# Curated specificity fingerprints for ai_gene_review.validation.specificity_fingerprint.
#
# A fingerprint is a short set of residue positions, in the numbering of one
# experimentally characterized reference protein, that decides which of several
# reactions catalysed within one superfamily a protein performs. Each one must come
# from mutagenesis plus testing of homologues (not from conservation alone), and
# cites the paper with verbatim supporting_text from publications/PMID_*.md.
#
# Fields
#   function / contrast_function: the reaction the fingerprint indicates, and the
#     paralogous reaction it is meant to tell apart (GO id, label, EC).
#   reference: UniProt accession whose numbering the positions use.
#   min_identity: below this identity to the reference (identical aligned positions
#     / reference length) the alignment, and so the fingerprint, is not trusted.
#   positions[].role: "required" residues decide the verdict; "supporting" ones
#     are reported only.
#   positions[].contrast_residues: residues typical of contrast_function there.

fingerprints:
  - id: holpase_hisn_pseudomonas
    function:
      go: GO:0004401
      label: histidinol-phosphatase activity
      ec: 3.1.3.15
    contrast_function:
      go: GO:0004647
      label: L-phosphoserine phosphatase activity
      ec: 3.1.3.3
    reference:
      accession: Q9I6F6
      label: PA0335 (paHisN), Pseudomonas aeruginosa PAO1
    # The paper's sequence similarity network separated the HolPase cluster at a
    # 45.8% identity edge threshold, and a homologue at about 48% identity carrying
    # the fingerprint was confirmed in vitro.
    min_identity: 0.45
    source:
      reference_id: PMID:38284491
      supporting_text:
        - In summary, the sequence motif DxD together with the tyrosine at position 47 are most likely to define a fingerprint, which could classify a protein as HolPase. The additional occurrence of the accessory amino acids Y57 or T113 may support this classification.
        - Taken together, the residues D16 and D18 form a DxD motif, which is indicative for a HolPase, whereas an ExI motif indicates a PSPase.
        - the residue corresponding to Y47 is strongly conserved within PSPases as a methionine
        - Beta1 had a sequence identity with paHisN of around 48% but contained all three fingerprint and the two accessory residues
    positions:
      - position: 16
        residues: [D]
        role: required
        contrast_residues: [E]
      - position: 18
        residues: [D]
        role: required
        contrast_residues: [I]
      - position: 47
        residues: [Y]
        role: required
        contrast_residues: [M]
      - position: 57
        residues: [Y]
        role: supporting
      - position: 113
        residues: [T]
        role: supporting
