  source_defects:
  - defect_type: MISSING_STATEMENT
    resource: GO_CAM
    record: gomodel:68d5ebd600001111/68d5ebd600001483
    slot: evidence
    requested_change: ADD
    asserted_value: gomodel:68d5ebd600001111/68d5ebd600001483
    corrected_value: PMID:23744639
    corrected_label: Kisspeptin activation of TRPC4 channels in female GnRH neurons requires PIP2 depletion
      and cSrc kinase activation
    confidence: PROBABLE
    explanation: >-
      This activity asserts that TRPC4 is the channel kisspeptin opens in the GnRH neuron, but no
      reference in the model connects TRPC4 to kisspeptin or to GnRH neurons. Its four cited papers
      are a human TRPC1/TRPC4 cryo-EM structure, a TRPC subunit-assembly study, an EGF-driven
      hTRPC4 trafficking study in COS-7 and HEK293 cells, and an orthology transfer from mouse Trpc4
      (MGI:109525) for the process and the cell type. The work that actually makes the link is in
      mouse: PMID:23744639 detects TRPC4alpha mRNA in GnRH neurons and shows the kisspeptin current
      requires PIP2 depletion and cSrc, and PMID:18434521 characterizes the current pharmacologically
      as TRPC-like. Please add them, so that a reader can see where the subunit assignment comes from.
      Please also note how far that evidence reaches: it is subunit expression plus pharmacology in
      mouse, not gene-specific loss of function, PMID:18434521 found TRPC1, TRPC3, TRPC4, TRPC5, TRPC6
      and TRPC7 all expressed in GnRH neurons, and the review this model cites for the incoming edge
      says the current is "likely mediated by TRP canonical (TRPC) channels". A heteromer, as in the
      cited human structure, would also make the single-subunit activity an approximation.
  notes: >-
    TRPC4 has no gene review in this repository, so there is nothing to compare the activity with. The
    representation is good practice: the channel activity is attributed to the subunit, with
    GO:0034703 cation channel complex recorded as the complex the subunit is part of, rather than to
    the bare complex term. GO:0005261 monoatomic cation channel activity is apt for a non-selective
    cation current, and the cited human structure supports a preference for monovalent cations.
    occurs_in plasma membrane is right for a channel, although the evidence is overexpressed human
    TRPC4 inserted into the membrane after EGF stimulation in COS-7 and HEK293 cells, not a GnRH
    neuron. The evidence codes handle the species problem correctly, which was the specific question
    put to this review: everything coded ECO:0000314 is a genuinely human in vitro experiment, and
    everything that comes from mouse, the membrane-depolarization process and the GnRH-neuron cell
    type, is coded ECO:0000250 against GO_REF:0000024 with mouse Trpc4 (MGI:109525) as the source,
    which is the correct way to carry mouse data into a human model. What the codes cannot convey is
    that the subunit identity itself is an inference, which is why the missing references matter. Two
    further gaps, both scope rather than error: this activity has no outgoing edge, so the step from
    depolarization to GnRH release that the model's title claims is not represented; and the
    inhibition of inwardly rectifying and other K+ currents, which both the cited review and the mouse
    electrophysiology give as a co-equal or primary part of the kisspeptin response, is absent from the
    model entirely.
