model: gomodel:68d5ebd600001111
title: KISS1/KISS1R signaling pathway induces membrane depolarization in GnRH neurons
  and stimulate GnRH release (Human)
taxon: NCBITaxon:9606
status: COMPLETE
summary: >-
  A four-step chain in the gonadotropin-releasing hormone neuron: the kisspeptin-10 chain of KISS1
  (UniProtKB:Q15726-PRO_0000021548) carries receptor ligand activity in the extracellular region and
  directly positively regulates KISS1R at the plasma membrane; KISS1R directly positively regulates
  GNAQ, with GNAQ as its has-input effector; GNAQ indirectly positively regulates a TRPC4 cation
  channel activity, which is part of membrane depolarization. The entities, the edge directions and
  the direct-versus-indirect distinctions are all right, and the ligand side is modelled on the
  mature peptide chain rather than the precursor, which is the correct choice. Three things need a
  curator. First, the process containment is inverted on three of the four activities: the
  phospholipase C pathway is placed inside positive regulation of gonadotropin secretion, which is
  in turn placed inside positive regulation of membrane depolarization, whereas the model's own
  title has depolarization as the mechanism and gonadotropin release as the outcome, so the two
  outer levels should be the other way round. Second, the nested gonadotropin-secretion context on
  the ligand activity is supported with a direct-assay code on a rat-only study, in a model whose
  taxon is human and which elsewhere uses orthology transfer from rat Kiss1 for rat-derived facts.
  Third, TRPC4 is asserted as the channel, but nothing in the model cites the work that identifies
  it: the review the model does cite says the kisspeptin current is "likely mediated by TRP
  canonical (TRPC) channels", and the underlying mouse studies rest on subunit expression plus
  pharmacology, with six TRPC subunits detected in GnRH neurons. The model also represents only the
  cation-channel arm; inhibition of inwardly rectifying and other K+ currents, which the cited
  review lists first, and the GnRH release step named in the title are both absent. KISS1R is typed
  with the generic G protein-coupled receptor activity term throughout, one step above the
  neuropeptide receptor activity the gene review accepts.
