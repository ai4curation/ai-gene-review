    off-topic for a kisspeptin model; but GNAQ's own GOA carries an IDA row for GO:0003925 keyed to
    that same publication, and the GNAQ gene review accepts it, so the GO-CAM is reusing an existing
    curated annotation whose support lies in a full text not available here, and second-guessing it
    would be overruling two curators on an abstract. The location, GO:0005886 plasma membrane, is
    supported by the palmitoylation study, but the GNAQ gene review modifies its plasma-membrane rows,
    including the row on this same publication, to the more specific GO:0009898 cytoplasmic side of
    plasma membrane, which would be the better filler here and would also sit correctly beside a
    receptor in the membrane. The verdict is UNCERTAIN because of the inverted process containment
    recorded on the KISS1R activity, which this activity also carries, and because the identity of the
    downstream channel is a mouse inference, as recorded on the TRPC4 activity.
