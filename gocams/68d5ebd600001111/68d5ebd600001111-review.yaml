    requested_change: CHECK
    asserted_value: GO:1904181
    corrected_value: GO:0032278
    corrected_label: positive regulation of gonadotropin secretion
    confidence: PROBABLE
    explanation: >-
      The process containment runs GO:0007200 phospholipase C-activating G protein-coupled receptor
      signaling pathway, part_of GO:0032278 positive regulation of gonadotropin secretion, part_of
      GO:1904181 positive regulation of membrane depolarization. The outermost two levels are the wrong
      way round. GO:1904181 is any process that increases membrane depolarization and GO:0032278 is any
      process that increases gonadotropin release; in this model's own narrative, stated in its title,
      kisspeptin depolarizes the GnRH neuron and the depolarization is what drives GnRH and hence
      gonadotropin release, so depolarization is the means and gonadotropin secretion the outcome.
      Neither term is an ancestor of the other in GO, so the nesting is entirely this model's
      contextual assertion. Please swap the two outer levels, so that the pathway sits inside positive
      regulation of membrane depolarization and that inside positive regulation of gonadotropin
      secretion, or drop the outermost level. The same inverted stack is carried by the kisspeptin-10
      activity gomodel:68d5ebd600001111/68d5ebd600001119 and the GNAQ activity
      gomodel:68d5ebd600001111/68d5ebd600001151, and is recorded once here rather than three times.
      Note that the TRPC4 activity in the same model is placed in GO:0051899 membrane depolarization
      with no nesting at all, so it is not tied into either outer process.
  notes: >-
    The receptor is typed GO:0004930 G protein-coupled receptor activity, which is true and directly
    evidenced here, but the KISS1R gene review accepts the specific descendant GO:0008188 neuropeptide
    receptor activity as the receptor's core molecular function and marks every GO:0004930 row,
    including the rows resting on these same two publications, as too general. Checked in OLS:
    GO:0008188 has GO:0004930 among its ancestors, via GO:0008528 G protein-coupled peptide receptor
    activity, so this is a clean subsumption and not a disagreement; hence GENERIC_MF and a consistency
    of MORE_GENERAL rather than a defect. has_input GNAQ is the correct filler for a receptor activity,
    the downstream effector it activates, and is supported by the KISS1R-Gq cryo-EM structure; the
    direct positive edge to the GNAQ activity has independent support in the Wacker FRET data on
    ligand-induced catalytic activation of Galpha. The plasma-membrane location and the GnRH-neuron
    cell type are both appropriate, the latter transferred from mouse Kiss1r (MGI:2148793, confirmed
    through the Alliance as Kiss1r), which is the right mechanism for a cell-type claim that has no
    human in vivo assay. Two scope observations, neither a defect: the structure paper the model cites
    also reports Gi/o coupling, which the model does not represent; and nothing in this model
    represents GnRH release itself, although the title asserts it, so the gonadotropin-secretion
    context is doing that work as a process annotation.
