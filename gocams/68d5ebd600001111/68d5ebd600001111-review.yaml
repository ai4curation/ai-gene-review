    requested_change: CHECK
    asserted_value: ECO:0000314
    corrected_value: ECO:0000250
    confidence: SUSPECTED
    explanation: >-
      The nested positive regulation of gonadotropin secretion (GO:0032278) on this activity carries
      ECO:0000314, direct assay evidence used in manual assertion, with PMID:15219839. That study is
      entirely in rat: metastin was given subcutaneously to prepubertal female and male rats. In a
      model whose taxon is NCBITaxon:9606, a direct-assay code on a rat-only experiment asserts a human
      assay that was not performed, and this same model uses ECO:0000250 with RGD:727850 for the
      rat-derived location of the same activity. The alternative reading is that the administered
      peptide was the human 54-residue metastin, in which case the direct-assay code is defensible
      because the human gene product itself was assayed in a rat host; the abstract says only
      "metastin" and the full text is not available here. Please confirm which peptide was given, and
      if it was the rat peptide, change the code to ECO:0000250 with RGD:727850, as elsewhere in this
      model. The human mutant-phenotype evidence on the same slot (ECO:0000315, PMID:22335740) is
      correct either way.
    supported_by:
    - reference_id: PMID:15219839
      supporting_text: we show that subcutaneous administration of metastin increased the plasma levels
        of gonadotropins (follicle-stimulating hormone and luteinizing hormone) and induced ovulation
        in prepubertal female rats
  notes: >-
    The enabled_by entity is right and is worth stating explicitly: UniProtKB:Q15726-PRO_0000021548 is
    Kisspeptin-10, residues 112-121 of the KISS1 precursor in the UniProt record
    (FT PEPTIDE 112..121 /note="Kisspeptin-10" /id="PRO_0000021548"), so the activity sits on the
    mature bioactive peptide and not on the precursor accession, and the cached label
    "KISS1-Kisspeptin-10 Hsap" matches. GO:0048018 receptor ligand activity is exactly the core
    molecular function of the KISS1 gene review, which proposes it as a new annotation on the human
    gene because GOA carries only kisspeptin receptor binding and bare protein binding, and cites GO's
    own GO-CAM models as corroboration; this activity is that corroboration, so the two agree.
    One caveat on the chain-level attribution: Kotani isolated the 54-, 14- and 13-residue peptides,
    and the decapeptide as such is carried by the Wacker study (KP-10 and KP-54 dose-responses) and by
    the shared amidated RF C-terminus, so the evidence for this specific chain is one step removed in
    the first of the two cited papers. has_input KISS1R is appropriate for a ligand activity, because
    the receptor is what the ligand acts on, and the regulation is not hidden there: the model also
    draws the explicit ligand-to-receptor causal edge, which is the representation the has-input rule
    asks for. The edge is RO:0002629, directly positively regulates, which is the right directness for
    agonist occupancy of a receptor. occurs_in extracellular region (GO:0005576) carries a
    CellTypeAssociation to the GnRH neuron; the extracellular space is not literally part of the
    neuron, and this reads as the convention for "acting at the GnRH neuron" rather than as a
    containment claim, so it is not flagged. The verdict is UNCERTAIN only because of the inverted
    process containment recorded on the KISS1R activity in this model, which this activity also
    carries, and the evidence-code query above.
