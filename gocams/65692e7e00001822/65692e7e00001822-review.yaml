  - source_id: PMID:35343654
    supporting_text: In this study, we have demonstrated that knockout of RNF115 significantly promotes
      the trafficking of TLRs from the ER to subcellular compartments and cell surface, and thereby potentiates
      TLRs‐mediated signaling and TLRs‐induced immune responses.
  notes: 'The best-modelled activity in the file. GO:0061630 ubiquitin protein ligase activity with part_of
    GO:0070979 protein K11-linked ubiquitination and has_input both RAB1A and RAB13 states exactly the
    assayed chemistry (specific acceptor lysines on each RAB), and occurs_in ER matches the AKT1/14-3-3-dependent
    localization the same paper demonstrates. The outgoing edge uses RO:0012010 "removes input for" to
    GDI1 rather than a regulation predicate, which is the mechanistically accurate representation: RNF115
    does not act on GDI1 at all, it modifies GDI1''s substrate so that GDI1 can no longer recover it.
    The model title''s framing (RNF115 inhibits TLR transport to the cell surface) is supported by the
    knockout result quoted above. RNF115 has no gene review in this repository, and note that it also
    appears in the literature as a negative regulator of MAVS, which is the subject of a separate cached
    model (65bc474400000029) where MAVS is stabilized by palmitoylation.'
