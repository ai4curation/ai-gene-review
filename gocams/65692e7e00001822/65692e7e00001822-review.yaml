  notes: 'The typing is right in kind: a 14-3-3 protein that carries phospho-RNF115 to a membrane is doing
    adaptor work, so GO:0035591 signaling adaptor activity with has_input RNF115 and part_of GO:0070972
    protein localization to endoplasmic reticulum is a fair reading, and it is better than a bare binding
    term. What makes this UNCERTAIN rather than OK is the choice of paralog: the paper recovered six 14-3-3
    proteins as RNF115 interactors (theta, eta, zeta, epsilon, gamma and beta) and argues the family-level
    mechanism, so singling out YWHAE (14-3-3 epsilon) asserts more specificity than the evidence gives.
    A GO-CAM entity set over the 14-3-3 paralogs would express what was shown. The causal edge to RNF115
    cites PMID:22607805, which establishes 14-3-3 epsilon as a chaperone that drives membrane association
    of a client (RIG-I) but says nothing about RNF115; the model-specific support is PMID:35343654, which
    it already cites on occurs_in, part_of and has_input, so this is recorded as a note rather than a
    source defect.'
