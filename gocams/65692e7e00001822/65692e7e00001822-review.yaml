  - source_id: PMID:35343654
    supporting_text: Several 14‐3‐3 chaperones were found as RNF115‐interacting proteins in mass spectrometry
      assays and in subsequent co‐immunoprecipitation assays (14‐3‐3 theta, eta, zeta, epsilon, gamma,
      and beta) (Table S1 and Figure S4A, Supporting Information).
  - source_id: PMID:22607805
    supporting_text: 14-3-3ε regulates a RIG-I translocon that mediates membrane association and innate
