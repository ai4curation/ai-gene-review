    resource: GO_CAM
    requested_change: REPOINT
    confidence: PROBABLE
    explanation: 'The RAB13 -> TLR4 edge carries ECO:0000314 with reference PMID:8294494, a 1994 paper
      that cloned rab13 and localized it to the junctional complex ("A small rab GTPase is distributed
      in cytoplasmic vesicles in non polarized cells but colocalizes with the tight junction marker ZO-1
      in polarized epithelial cells"). It cannot support a relation to TLR4, which was not identified
      until the late 1990s, and its cached abstract contains no mention of Toll-like receptors. The relation
      is established by the model''s own primary paper, PMID:35343654, which shows RAB13 carrying a subset
      of TLRs from the Golgi to the cell surface. The same reference is used for RAB13 enabled_by, where
      it is appropriate.'
    supported_by:
    - reference_id: PMID:35343654
      supporting_text: Specifically, RAB1A promotes the trafficking of TLRs from the ER to the Golgi apparatus,
        whereas RAB13 facilitates the trafficking of a subset of TLRs from the Golgi apparatus to the cell
        surface.
  notes: 'Compartment lead dismissed. RAB13 (Golgi) directly positively regulates TLR4 (plasma membrane)
    is reported as NONADJACENT at distance 2, but this is the relocation case the guidance allows: TLR4
    is the cargo, RAB13 acts on it in the Golgi, and TLR4''s own occurs_in records where it signals afterwards.
    No transport step is missing from the cell''s point of view, so no NONADJACENT_COMPARTMENTS flag.
    What is wrong is the directness: budding, transport and fusion lie between a Golgi RAB GTPase and
    a receptor becoming active at the cell surface, and the evidence in the paper is loss- and gain-of-function
    on surface TLR levels, not an action of RAB13 on TLR4 receptor activity. An indirect positive relation
    (RO:0002213) represents this correctly; hence DIRECT_VS_INDIRECT_CAUSAL. GO:0003924 GTPase activity
    is the conventional typing for a RAB annoton and occurs_in Golgi apparatus (coarse) matches the TGN
    pool shown by PMID:18779367. RAB13 has no gene review in this repository.'
