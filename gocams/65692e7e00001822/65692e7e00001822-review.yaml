    supporting_text: It is shown that the 14-3-3 chaperones bind to AKT1-phosphorylated RNF115 and facilitate
      RNF115 localizing on the ER and the Golgi apparatus.
  - source_id: PMID:35343654
    supporting_text: Interestingly, RNF115 contains an AKT phosphorylation site (Ser132/133) within the
      potential 14‐3‐3 binding domain.
  - source_id: PMID:10983986
    supporting_text: The protooncogene TCL1 is an Akt kinase coactivator.
  source_defects:
  - defect_type: WRONG_TERM
    record: gomodel:65692e7e00001822/65692e7e00001823
    slot: part_of
    asserted_value: GO:0060079
    resource: GO_CAM
    requested_change: CHECK
    confidence: PROBABLE
    explanation: 'The AKT1 activity in this model is the kinase step that phosphorylates RNF115 (Ser132/133)
      and so licenses 14-3-3 binding and ER localization of an E3 ligase that restrains Toll-like receptor
      trafficking. Its part_of is GO:0060079 excitatory postsynaptic potential, asserted with ECO:0000303
      (author statement without traceable support) from PMID:21711983, a review of Akt and GSK-3 in dopamine
      and serotonin neurotransmission. Nothing in this model''s pathway is synaptic, and the process appears
      to have been carried over from AKT1''s neuronal annotations. No replacement is asserted because
      the right process depends on how the curators scope the step: GO:0070972 protein localization to
      endoplasmic reticulum (as used on the 14-3-3 activity) or a negative regulation of TLR signaling
      term would both fit the model.'
    supported_by:
    - reference_id: PMID:35343654
      supporting_text: Interestingly, RNF115 contains an AKT phosphorylation site (Ser132/133) within
        the potential 14‐3‐3 binding domain.
  notes: 'GO:0004674 protein serine/threonine kinase activity with has_input RNF115 is correct and matches
    the AKT1 gene review''s first core function (GO:0004674, ACCEPT), so consistency is CONSISTENT; the
    model''s claim is more specific than the review only in naming RNF115 as the substrate, which the
    review does not cover. Two context problems keep the verdict at UNCERTAIN. occurs_in GO:0016020 membrane
    is as coarse as a location can be while still resolving to nothing useful; the AKT1 review ACCEPTs
    GO:0005886 plasma membrane, and the cited PMID:24529379 is about TSC complex regulation of mTORC1
    at the lysosome, so neither the reference nor the term pins the pool of AKT1 that acts here. The part_of
    process is unrelated to this pathway (see the source defect). The causal edge to the 14-3-3 activity
    cites PMID:10983986 (TCL1 as an Akt coactivator), which supports AKT1 kinase activity but not an action
    on a 14-3-3 protein; because that cache is abstract-only I have not recorded it as a defect, but the
    model''s own PMID:35343654 is the reference that supports the edge. Note the model asserts the edge
    AKT1 -> YWHAE rather than AKT1 -> RNF115: that is a considered choice, since phosphorylation of RNF115
    is what creates the 14-3-3 binding site, and it is consistent with has_input RNF115 on this activity.'
