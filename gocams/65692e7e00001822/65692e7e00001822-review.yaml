    record: gomodel:65692e7e00001822/657ba49f00000094
    slot: occurs_in
    asserted_value: GO:0005783
    corrected_value: GO:0005829
    corrected_label: cytosol
    resource: GO_CAM
    requested_change: CHECK
    confidence: SUSPECTED
    explanation: 'The GDI1 activity is placed in the endoplasmic reticulum with ECO:0000314 from PMID:35343654,
      but that paper''s GDI1 experiments are co-immunoprecipitations of GDI1 with RAB1A and RAB13; it
      does not localize GDI1 to the ER. GDI1 is a soluble chaperone that extracts prenylated RAB-GDP from
      membranes and holds it in the cytosol, and UniProt P31150 records its subcellular location as cytoplasm
      and the trans-Golgi network, not the ER. The placement matters for the model: from the cytosol,
      GDI1 borders both the ER membrane (RAB1A) and the Golgi membrane (RAB13), so a cytosolic location
      removes the compartment jump on the GDI1 -> RAB13 edge without changing any claim. Flagged for the
      curators to check rather than asserted, since no experiment in the cited paper settles it.'
    supported_by:
    - reference_id: PMID:35343654
      supporting_text: Furthermore, RNF115 catalyzes K11‐linked ubiquitination on the Lys49 and Lys61
        residues of RAB1A and on the Lys46 and Lys58 residues of RAB13, which impairs the recruitment
        of GDP dissociation inhibitor 1 (GDI1) to RAB1A and RAB13, thereby inhibiting the reactivation
        of the two RABs and the post‐ER trafficking of TLRs.
    - reference_id: file:human/GDI1/GDI1-uniprot.txt
      supporting_text: 'SUBCELLULAR LOCATION: Cytoplasm'
    - reference_id: file:human/GDI1/GDI1-uniprot.txt
      supporting_text: Golgi apparatus, trans-Golgi network
  notes: 'Compartment lead confirmed, as a wrong location rather than a missing step: GDI1 (ER) directly
    positively regulates RAB13 (Golgi) is reported as NONADJACENT at distance 2, and the fix is to place
    GDI1 where it actually works, the cytosol, which touches both membranes (see the source defect). No
    transporter or additional activity is missing from the model, and the companion edge to RAB1A is unaffected
    because it is already ER-ER. The positive sign is well supported in an otherwise counterintuitive
    direction: GDI classically holds RAB-GDP inactive, but the paper''s readout is that losing GDI1 recruitment
    blocks "the reactivation of the two RABs", so GDI1 enables the next round of RAB activity and positive
    regulation is right. GO:0005092 GDP-dissociation inhibitor activity with has_input RAB1A and RAB13
    is the correct MF and filler. GDI1 has no gene review in this repository.'
