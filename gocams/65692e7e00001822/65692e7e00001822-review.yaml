    supporting_text: Furthermore, RNF115 catalyzes K11‐linked ubiquitination on the Lys49 and Lys61 residues
      of RAB1A and on the Lys46 and Lys58 residues of RAB13, which impairs the recruitment of GDP dissociation
      inhibitor 1 (GDI1) to RAB1A and RAB13, thereby inhibiting the reactivation of the two RABs and the
