model: gomodel:65692e7e00001822
title: RNF115 inhibition of TLR transport to cell surface (Human)
taxon: NCBITaxon:9606
status: COMPLETE
summary: 'The model reconstructs the brake that RNF115 puts on post-ER delivery of Toll-like receptors.
  AKT1 phosphorylates RNF115, which lets a 14-3-3 chaperone (YWHAE in the model) act as the adaptor that
  places RNF115 on the ER; RNF115 then K11-ubiquitinates RAB1A and RAB13, and the model expresses the
  consequence elegantly as "removes input for" the GDP-dissociation-inhibitor activity of GDI1, because
  the modified RABs can no longer be recovered by GDI1. GDI1 in turn positively regulates RAB1A (ER to
  Golgi) and RAB13 (Golgi to cell surface), and RAB13 delivers TLR4 to the plasma membrane where it signals.
  The causal skeleton and the signs are faithful to the single primary paper (PMID:35343654). The problems
  are in the periphery: several edges and nodes cite papers that predate or do not contain the asserted
  relation (PMID:8294494 for RAB13 acting on TLR4, PMID:10983986 for AKT1 acting on the 14-3-3 adaptor),
  the AKT1 activity carries an unrelated process (GO:0060079 excitatory postsynaptic potential, on an
  author statement) and a location as coarse as "membrane", GDI1 is placed in the ER although it is a
  cytosolic chaperone, and the trafficking edges are typed as direct where vesicular transport intervenes.
  RAB1A is wired only to GDI1, so the ER-to-Golgi leg of TLR transport that the paper attributes to it
  is not expressed in the model.'
