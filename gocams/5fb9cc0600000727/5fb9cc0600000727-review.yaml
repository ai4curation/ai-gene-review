  supporting_text: Toll-like receptor 2 (TLR2) initiates potent immune responses by recognizing diacylated
    and triacylated lipopeptides. Its ligand specificity is controlled by whether it heterodimerizes with
    TLR1 or TLR6.
  evidence:
  - source_id: PMID:19931471
    supporting_text: Toll-like receptor 2 (TLR2) initiates potent immune responses by recognizing diacylated
      and triacylated lipopeptides. Its ligand specificity is controlled by whether it heterodimerizes
      with TLR1 or TLR6.
  - source_id: PMID:16880211
    supporting_text: Our data show that TLR2 forms heterodimers with TLR1 and TLR6 and that these heterodimer
      pre-exist and are not induced by the ligand.
  - source_id: PMID:11521063
    supporting_text: TLR2 without MD-2 does not respond to pure protein-free endotoxic LPS, ReLPS, and
      lipid A
  notes: 'Wrong ligand class. GO:0001875 is defined as combining with a lipopolysaccharide and transmitting
    the signal across the cell membrane (OLS, checked 2026-09-30). The model''s own ligand is CHEBI:60192
    triacyl lipopeptide. Suggested correction: GO:0038187 pattern recognition receptor activity, or a
    new term for lipopeptide immune receptor activity as a sibling of GO:0001875 (GO has none). The complex
    term as enabler is appropriate (the ligand bridges both subunits). has_input TIRAP and the direct
    positive regulation of TIRAP follow the receptor pattern. Gene reviews: TLR1, TLR2 and TLR6 each modify
    the matching IDA row (contributes_to GO:0001875, PMID:16880211) to GO:0038187 and remove the GO_REF:0000108
    LPS-mediated signaling row inferred from it.'
