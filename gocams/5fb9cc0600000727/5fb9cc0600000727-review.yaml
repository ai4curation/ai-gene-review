model: gomodel:5fb9cc0600000727
title: Triacyl lipopetide activation of TLR1-TLR2 complex (Human)
taxon: NCBITaxon:9606
status: COMPLETE
summary: 'Carriers LBP and CD14 deliver triacyl lipopeptide (CHEBI:60192) to the TLR1-TLR2 heterodimer,
  which directly activates the adaptor TIRAP in the TLR1:TLR2 signaling pathway (GO:0038123). The causal
  story is sound. The defect is the receptor molecular function: GO:0001875 lipopolysaccharide immune
  receptor activity, although the model''s own ligand is a lipopeptide and LPS is recognised by TLR4/MD-2.
  The same choice appears in model 5fce9b7300000030, and the GOA rows contributes_to GO:0001875 on TLR1
  and TLR2 share this model''s reference, curator and 2025-12-04 date, so the error propagates to six
  gene annotations (three IDA rows plus three inferred LPS signaling rows across TLR1, TLR2 and TLR6).
  TIRAP''s adaptor term is correct but generic, and the model stops at TIRAP without MYD88.'
