model: gomodel:65d7e4ac00001584
title: MICU1 inhibits mitochondrial calcium uptake by occluding MCU in absence of
  calcium (Human).
taxon: NCBITaxon:9606
status: COMPLETE
summary: >-
  This human model captures the calcium-free inhibited state of the
  mitochondrial calcium uniporter. SMDT1/EMRE is represented as a
  protein-macromolecule adaptor that recruits MICU1 to the inner-membrane MCU
  pore; MICU1 is represented with calcium channel inhibitor activity and a
  direct negative edge to MCU, reflecting pore occlusion at low calcium; and MCU
  is the calcium channel inhibited in this state. The molecular functions,
  EMRE-to-MICU1 positive edge, MICU1-to-MCU negative edge and inner-membrane
  context are coherent and align with
  modules/mitochondrial_calcium_uniporter.yaml. The only model-level defect is
  the GO:0072732 cellular-response-to-calcium-starvation process wrapper: the
  cited structural paper supports the calcium-free state of the purified
  uniplex, not a cellular starvation response, so the three activities should
  be placed directly in the mitochondrial calcium import process rather than in
  GO:0072732.
