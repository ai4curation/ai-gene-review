    slot: part_of
    requested_change: REPOINT
    asserted_value: GO:0072732
    corrected_value: GO:0036444
    corrected_label: calcium import into the mitochondrion
    cause: CONTEXT_NOT_ASSAYED
    confidence: CONFIRMED
    explanation: >-
      The SMDT1/EMRE adaptor activity is placed in GO:0072732 cellular response
      to calcium ion starvation. The cited PMID:32494073 structures support a
      calcium-free inhibited state of the MCU-EMRE-MICU1-MICU2 uniplex, and
      PMID:24231807 and PMID:27099988 support EMRE coupling MCU to the MICU
      gatekeepers, but these papers do not assay a cellular response to calcium
      deprivation. The activity should instead be part_of GO:0036444 calcium
      import into the mitochondrion, the process in which EMRE couples MICU1 to
      the MCU pore.
  notes: >-
    No local SMDT1 gene review exists, so consistency is recorded as
    NO_GENE_REVIEW. GO:0030674 protein-macromolecule adaptor activity is a
    coherent activity type for EMRE's bridging role between the MCU pore and
    MICU1, and the model's has_input fillers are the adapted proteins rather
    than transported cargo. The inner-membrane context is correct. The aligned
    mitochondrial_calcium_uniporter module uses GO:0099103 channel activator
    activity as EMRE's primary term but explicitly records the same GO:0030674
    adaptor term as a grounded alternative.
