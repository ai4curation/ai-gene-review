model: gomodel:6246724f00000632
title: Bradykinin degradation by ACE and bradykin-binding to its receptor (Human)
taxon: NCBITaxon:9606
status: COMPLETE
summary: >-
  A compact human bradykinin inactivation/receptor-activation model: ACE
  peptidyl-dipeptidase activity in the extracellular region degrades
  KNG1-derived bradykinin and is placed causally upstream of the KNG1 hormone
  activity; the KNG1 hormone activity directly activates plasma-membrane
  BDKRB2 bradykinin receptor activity. The molecular functions and locations
  are sound, the existing kallikrein/kinin module already pins all three
  activities, and the one GO-CAM best-practice issue is a redundant BDKRB2
  has_input edge that points back to its upstream KNG1 ligand.
activity_reviews:
- activity_id: gomodel:6246724f00000632/6246724f00000633
  gene_product: UniProtKB:P12821
  molecular_function: GO:0008241
  biological_process: GO:0010815
  cellular_component: GO:0005576
  verdict: OK
  consistency: CONSISTENT
  gene_review: file:human/ACE/ACE-ai-review.yaml
  supporting_text: >-
    Both active sites converted bradykinin (BK) to BK1-7 and BK1-5 with
    similar kinetics and with Kappm at least 30 times lower and kcat/kappm 10
    times higher than for AI.
  evidence:
  - source_id: PMID:7683654
    statement: >-
      Both active sites of somatic ACE degrade bradykinin through
      peptidyl-dipeptidase cleavage.
    supporting_text: >-
      Both active sites converted bradykinin (BK) to BK1-7 and BK1-5 with
      similar kinetics and with Kappm at least 30 times lower and kcat/kappm 10
      times higher than for AI.
  - source_id: file:human/ACE/ACE-ai-review.yaml
    statement: >-
      The completed ACE gene review keeps GO:0008241 and explicitly includes
      bradykinin catabolism in the accepted core function.
    supporting_text: generating angiotensin II from angiotensin I and inactivating bradykinin
  notes: >-
    ACE's GO:0008241 peptidyl-dipeptidase activity, extracellular region
    placement, and bradykinin-catabolism process are consistent with the local
    ACE review and the kallikrein/kinin module. The activity's has_input edge
    points to UniProtKB:P01042/KNG1 as the source gene product for bradykinin;
    this is slightly coarser than the free bradykinin peptide but is acceptable
    in this model because the downstream KNG1 node is itself the GO:0005179
    hormone activity of the released kinin. The indirect negative causal edge
    from ACE to that KNG1 hormone activity is directionally correct for
    bradykinin inactivation.
- activity_id: gomodel:6246724f00000632/6246724f00000645
  gene_product: UniProtKB:P01042
  molecular_function: GO:0005179
  biological_process: GO:0042311
  cellular_component: GO:0005576
  verdict: OK
  consistency: NO_GENE_REVIEW
  supporting_text: >-
    Saturation binding analysis indicates that the human BK-2 receptor
    expressed in COS-7 cells binds BK with a KD of 0.13 nM.
  evidence:
  - source_id: PMID:1314587
    statement: >-
      Human bradykinin binds the cloned human B2 receptor with sub-nanomolar
      affinity.
    supporting_text: >-
      Saturation binding analysis indicates that the human BK-2 receptor
      expressed in COS-7 cells binds BK with a KD of 0.13 nM.
  notes: >-
    GO:0005179 hormone activity is broad but correctly represents the
    KNG1-derived bradykinin agonist acting upstream of the B2 receptor. The
    extracellular location is also right for a soluble kinin hormone. The
    direct positive edge to BDKRB2 is the best-practice representation of
    ligand-driven receptor activation. There is no completed local KNG1 review,
    so this activity is marked NO_GENE_REVIEW even though it matches the
    existing KNG1 annoton in modules/kallikrein_kinin_cascade.yaml.
- activity_id: gomodel:6246724f00000632/6246724f00000659
  gene_product: UniProtKB:P30411
  molecular_function: GO:0004947
  biological_process: GO:0042311
  cellular_component: GO:0005886
  verdict: UNCERTAIN
  qc_flags:
