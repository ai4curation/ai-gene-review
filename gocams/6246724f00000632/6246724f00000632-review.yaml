  evidence:
  - source_id: PMID:1329734
    statement: >-
      The cloned human B2 receptor is a bradykinin receptor that drives
      calcium/phosphatidylinositol signaling after bradykinin stimulation.
    supporting_text: >-
      Functional coupling to the Ca(2+)-phosphatidylinositol cascade was
      demonstrated in transfected CHO cells where inositol phosphates accumulation
      and intracellular calcium concentration were elevated in response to BK
      stimulation.
  - source_id: PMID:17077303
    statement: Human ACE and B2 bradykinin receptors can occupy the same plasma-membrane compartment.
    supporting_text: Human ACE and bradykinin B2 receptors form a complex at the plasma membrane.
  source_defects:
  - defect_type: WRONG_STATEMENT
    resource: GO_CAM
    record: gomodel:6246724f00000632/6246724f00000659
    slot: molecular_associations
    requested_change: DELETE_VALUE
    asserted_value: gomodel:6246724f00000632/6246724f00000663
    confidence: PROBABLE
    explanation: >-
      The BDKRB2 bradykinin receptor activity has a has_input edge to the
      KNG1 gene product. KNG1-derived bradykinin is the upstream ligand that
      activates the receptor, not the downstream effector acted on by the
      receptor activity. The source model already represents the ligand role
      correctly with a direct positive causal edge from the KNG1 hormone
      activity to this BDKRB2 receptor activity, so the receptor-side has_input
      assertion is redundant and should be deleted.
  notes: >-
    GO:0004947 and the plasma-membrane location correctly represent human BDKRB2
    as a B2 bradykinin receptor, and the adjacent extracellular-to-membrane
    edge from the KNG1 hormone activity is compartmentally sound. The node is
    marked UNCERTAIN only because the receptor also has a has_input edge back to
    KNG1; ligand-to-receptor activation belongs on the existing causal edge, not
    on the receptor's has_input list. There is no completed local BDKRB2 review,
    so the activity is marked NO_GENE_REVIEW.
notes: >-
  Alignment with modules/kallikrein_kinin_cascade.yaml: the module already cites
  gomodel:6246724f00000632 and pins the model's three activities to matching
  concrete annotons for KNG1 hormone activity, BDKRB2 bradykinin receptor
  activity, and ACE bradykinin-cleaving peptidyl-dipeptidase activity. No module
  edit is needed for this GO-CAM. `just gocam-lint` reported the BDKRB2
  receptor-ligand has_input misuse recorded above, two advisory copied-edge
  evidence notices, and the absence of a curator narrative; `just
  gocam-compartments` resolved all three locations and found only same or
  adjacent causal edges.
