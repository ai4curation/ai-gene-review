  evidence:
  - source_id: PMID:1314587
    statement: >-
      Human bradykinin binds the cloned human B2 receptor with sub-nanomolar
      affinity.
    supporting_text: >-
      Saturation binding analysis indicates that the human BK-2 receptor
      expressed in COS-7 cells binds BK with a KD of 0.13 nM.
  notes: >-
    GO:0005179 hormone activity is broad but correctly represents the
    KNG1-derived bradykinin agonist acting upstream of the B2 receptor. The
    extracellular location is also right for a soluble kinin hormone. The
    has_input edge to BDKRB2 is the conventional target-receptor filler for a
    GO-CAM ligand/hormone activity, and the direct positive edge to BDKRB2 is
    the best-practice representation of ligand-driven receptor activation.
    There is no completed local KNG1 review, so this activity is marked
    NO_GENE_REVIEW even though it matches the existing KNG1 annoton in
    modules/kallikrein_kinin_cascade.yaml.
