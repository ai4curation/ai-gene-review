model: gomodel:6246724f00000632
title: Bradykinin degradation by ACE and bradykin-binding to its receptor (Human)
taxon: NCBITaxon:9606
status: COMPLETE
summary: >-
  A compact human bradykinin inactivation/receptor-activation model: ACE
  peptidyl-dipeptidase activity in the extracellular region degrades
  KNG1-derived bradykinin and is placed causally upstream of the KNG1 hormone
  activity; the KNG1 hormone activity directly activates plasma-membrane
  BDKRB2 bradykinin receptor activity. The molecular functions and locations
  are sound, the existing kallikrein/kinin module already pins all three
  activities, and the two GO-CAM best-practice issues are has_input fillers
  that resolve to full KNG1 where the model intends two different free
  bradykinin roles: ACE's peptide substrate and BDKRB2's upstream ligand.
activity_reviews:
- activity_id: gomodel:6246724f00000632/6246724f00000633
  gene_product: UniProtKB:P12821
  molecular_function: GO:0008241
  biological_process: GO:0010815
  cellular_component: GO:0005576
  verdict: UNCERTAIN
  qc_flags:
  - HAS_INPUT_MISUSE
  consistency: CONSISTENT
  gene_review: file:human/ACE/ACE-ai-review.yaml
  supporting_text: >-
    Both active sites converted bradykinin (BK) to BK1-7 and BK1-5 with
    similar kinetics and with Kappm at least 30 times lower and kcat/kappm 10
    times higher than for AI.
  evidence:
  - source_id: PMID:7683654
    statement: >-
      Both active sites of somatic ACE degrade bradykinin through
      peptidyl-dipeptidase cleavage.
    supporting_text: >-
      Both active sites converted bradykinin (BK) to BK1-7 and BK1-5 with
      similar kinetics and with Kappm at least 30 times lower and kcat/kappm 10
      times higher than for AI.
  source_defects:
  - defect_type: WRONG_STATEMENT
    resource: GO_CAM
    record: gomodel:6246724f00000632/6246724f00000633
    slot: molecular_associations
    requested_change: REPOINT
    asserted_value: UniProtKB:P01042
    corrected_value: CHEBI:3165
    corrected_label: bradykinin
    confidence: PROBABLE
    explanation: >-
      The ACE peptidyl-dipeptidase activity has a has_input edge to
      UniProtKB:P01042/KNG1, but ACE does not cleave intact kininogen in the
      kinin cascade. ACE degrades the already-released bradykinin nonapeptide:
      the cited ACE evidence shows both ACE active sites converting bradykinin
      to BK1-7 and BK1-5, and CHEBI:3165 resolves to bradykinin in ChEBI. The
      GO-CAM input should therefore be repointed from KNG1 to CHEBI:3165.
  notes: >-
    ACE's GO:0008241 peptidyl-dipeptidase activity, extracellular region
    placement, and bradykinin-catabolism process are consistent with the local
    ACE review and the kallikrein/kinin module. The activity's indirect
    negative causal edge to the KNG1 hormone activity is directionally correct
    for bradykinin inactivation. The has_input edge is not correct: it points
    to UniProtKB:P01042/KNG1, but this kininase step acts on the released
    bradykinin peptide, not on the KNG1 precursor protein.
