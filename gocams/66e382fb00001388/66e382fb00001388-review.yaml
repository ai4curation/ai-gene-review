      - source_id: PMID:11580864
        statement: >-
          The paper's authors found BMP5 transcripts and protein in rat superior
          cervical ganglion cultures, consistent with a local BMP5 source for the
          dendrite-growth response.
        supporting_text: >-
          RT-PCR and immunocytochemical analyses indicate that BMP-5 mRNA and
          protein are expressed in the superior cervical ganglia (SCG) during
          times of initial growth and rapid expansion of the dendritic arbor.
    notes: >-
      GO:0005125 cytokine activity is a broad but valid description of this
      TGF-beta superfamily ligand, and PMID:11580864 directly supports
      recombinant BMP5 as a soluble extracellular driver of dendrite growth that
      triggers Smad-1 phosphorylation. No local human BMP5 review exists yet, so
      the model is recorded as NO_GENE_REVIEW for consistency. The direct
      positive edge to BMPR1A is biologically plausible for a BMP ligand and
      matches the reusable bmp_signaling module's BMP ligand to type I receptor
      step; the BMP5 activity has also been pinned to that generic ligand role.
