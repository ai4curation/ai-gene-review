model: gomodel:66e382fb00001388
title: BMP5 role in dendritic growth via SMAD1 (Human)
taxon: NCBITaxon:9606
status: COMPLETE
summary: >-
  A compact BMP5 to nuclear SMAD1 model. Extracellular BMP5 activity is placed
  upstream of the plasma-membrane BMPR1A type I receptor activity, which is then
  placed directly upstream of SMAD1 DNA-binding transcription activator activity
  in the nucleus; all three activities are assigned to positive regulation of
  dendrite development. The causal order matches the generic BMP receptor and
  SMAD module, and the existing bmp_signaling module explains the compressed
  BMPR1A-to-SMAD1 edge with SMAD1/5 activation and nuclear import. The main
  evidence caveat is that the BMP5 dendrite-growth paper used rat sympathetic
  neurons, recombinant human BMP5, and a soluble BMPR-IA-Fc ligand trap: it
  supports BMP5-induced Smad-1 phosphorylation and is consistent with BMPR1A, but
  it does not directly test endogenous BMPR1A or SMAD1 requirement in the
  dendrite-growth response.
