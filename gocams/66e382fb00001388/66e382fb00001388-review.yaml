notes: >-
  The source model has no free-text narrative beyond its title; gocam-lint
  therefore reports only the informational no_narrative finding. The existing
  bmp_signaling module already has gocam_associations for this model's BMPR1A
  receptor and SMAD1 transcriptional-effector activities. This review adds the
  missing association for the BMP5 ligand activity to the same generic BMP
  ligand annoton, making the module pins explain all three GO-CAM activities.
