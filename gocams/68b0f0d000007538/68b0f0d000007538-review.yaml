  notes: The dehydrogenase half of the bifunctional 3beta-HSD/isomerase step (pregnenolone to progesterone) is the
    right first activity of the corticosterone pathway and Hsd3b1 is the steroidogenic-tissue isoform. From the
    cached abstracts, two of the three cited papers (C2C12 cells, thymic organelles) measure the reaction without
    assigning it to an isoform, so attribution to Hsd3b1 rests on the expression pattern in PMID:1924345; full texts
    were not available. The causal edge to the isomerase activity carries no evidence. The occurs_in evidence includes
    PMID:19042983, whose abstract concerns prenatal progesterone exposure and male fertility and does not mention
    enzyme localisation; this may be a mis-keyed reference and is worth a check by the model owner (abstract-level
    observation only).
