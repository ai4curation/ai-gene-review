model: gomodel:68b0f0d000007538
title: Glucocorticoid biosynthetic process 2 (Mouse)
taxon: NCBITaxon:10090
status: COMPLETE
summary: 'A mouse model of the adrenal route from pregnenolone to corticosterone: Hsd3b1 3beta-hydroxysteroid dehydrogenase
  and isomerase activities and Cyp21a1 progesterone 21-hydroxylase in the endoplasmic reticulum membrane, then Cyp11b1
  11beta-hydroxylase in the mitochondrial inner membrane, with Hsd11b1 in kidney assigned to glucocorticoid catabolism
  and Serpina6 (corticosteroid-binding globulin) as an extracellular carrier. Only the first three activities are
  chained (Hsd3b1 to Hsd3b1 to Cyp21a1, both edges without evidence); Cyp11b1, Hsd11b1, Serpina6 and a placeholder
  transporter are unconnected, so the model reads as a parts list more than a causal pathway. The enzyme assignments
  are right. Serpina6 is modelled as a carrier with no biosynthetic process, which is the correct reading of its
  role and matches the review of human SERPINA6; giving it corticosterone as input and a hormone transport process
  would say what it carries and why it is in the model.'
