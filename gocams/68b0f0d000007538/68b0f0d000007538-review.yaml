  notes: 'Mouse Serpina6 (CBG) as a molecular carrier in the extracellular region is correct and well supported:
    recombinant mouse CBG binds steroid and the knockout abolishes serum corticosterone binding. No mouse gene review
    exists; the review of the human ortholog (genes/human/SERPINA6) reaches the same function and refines the term
    to lipid carrier activity (GO:0005319) because the cargo is a steroid, so the model is consistent with it and
    slightly more general. The curator gave this activity no part_of process, which agrees with the human review:
    CBG does none of the work of glucocorticoid biosynthesis, and the human GOA row to that process (from Reactome
    pathway membership) is removed there. The activity is nevertheless disconnected from the rest of the model.
    Two additions would make it informative: has_input corticosterone (CHEBI:16827, already an object of the model)
    as the cargo, and part_of hormone transport (GO:0009914), the process the human review proposes. A causal edge
    from Cyp11b1 would not be right, since secretion and plasma binding are not regulation of the carrier by the
    enzyme. The serine-type endopeptidase inhibitor activity that mouse Serpina6 carries by IBA and IEA is, correctly,
    not modelled.'
  supporting_text: The absence of CBG resulted in a lack of corticosterone binding activity in serum and in an approximately
    10-fold increase in free corticosterone levels in CBG-null mice
  evidence:
  - source_id: PMID:16980625
    statement: CBG is the plasma glucocorticoid carrier; knockout removes serum corticosterone binding.
    supporting_text: The absence of CBG resulted in a lack of corticosterone binding activity in serum and in an
      approximately 10-fold increase in free corticosterone levels in CBG-null mice
  - source_id: PMID:8039711
    statement: A coding substitution in mouse CBG changes its steroid-binding affinity when expressed in cells.
    supporting_text: Expression of these mutants in the MDCK cell line indicated that the Lys201-->Glu substitution
      accounts for the abnormal steroid-binding affinity of CBG in RIIIS/J mice.
