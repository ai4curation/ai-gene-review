  notes: 'Progesterone 21-hydroxylase activity of Cyp21a1 as part of glucocorticoid biosynthesis is supported by
    loss of function and rescue: 21-hydroxylase-deficient mice have no corticosterone, and transfer of the mouse
    gene or of human CYP21 restores it. The activity has no outgoing edge to the Cyp11b1 11beta-hydroxylase step
    that consumes its product, so the pathway stops here in the model.'
  supporting_text: Plasma corticosterone increased from undetectable levels to values similar in wild-type mice
    by 7 and 14 days
  evidence:
  - source_id: PMID:10602386
    statement: Human CYP21 restores 21-hydroxylase activity and corticosterone in 21-hydroxylase-deficient mice.
    supporting_text: 21OH activity measured in adrenal tissue increased from undetectable to levels found in wild-type
      mice 2 to 7 days after AdhCYP21 injection.
  - source_id: PMID:7925109
    statement: A 21-hydroxylase transgene rescues the lethal deficiency.
    supporting_text: in all four transgenic lines, the transgene rescued the lethal mutation
