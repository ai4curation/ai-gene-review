  notes: The cited study measured 11beta-HSD1 activity in mouse kidney and liver and relates lower renal activity
    to higher corticosterone, which supports the dehydrogenase direction and a catabolic role in that tissue. Read
    from the abstract only. In most tissues 11beta-HSD1 is regarded as acting mainly as a reductase that regenerates
    active glucocorticoid, so assigning it to glucocorticoid catabolism holds for the kidney context annotated here
    and should not be generalised; the model does record the kidney cell context. The activity has no causal edge.
  supporting_text: down-regulation of the Ke 6 gene may lead to elevated corticosterone levels, mediated through
    an inhibition of 11betaHSD-1 activity
  evidence:
  - source_id: PMID:8940387
    statement: 11beta-HSD1 activity was measured in kidney and liver; reduced renal activity accompanies higher
      corticosterone.
    supporting_text: we measured the level of 11betaHSD-1 activity in kidney and liver tissues of cpk homozygote
      mice and found a reduction in its activity only in the kidney, not in the liver
