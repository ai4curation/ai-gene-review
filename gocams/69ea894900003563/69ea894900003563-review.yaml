model: gomodel:69ea894900003563
title: Green light signaling mediated by OPN1MW photoreceptor via G-alpha-t (transducin)_Visual perception (Human)
taxon: NCBITaxon:9606
status: COMPLETE
summary: 'Human cone phototransduction driven by OPN1MW (P04001), with the same five-activity structure as the red-cone
  model 68fac5ed00003872: opsin -> GNAT2 (directly positively regulates) -> PDE6H inhibitor (directly negatively
  regulates) -> PDE6C phosphodiesterase (directly negatively regulates) -> CNGA3/CNGB3 channel (directly negatively
  regulates, via the cGMP concentration). Each activity was compared with its counterpart rather than assumed identical.
  The main difference from the red model is that PDE6C is part_of GO:0070966 (no-go mRNA decay) instead of GO:0141190
  (transducin-mediated opsin signalling), citing the same paper; this is a term-selection error that the PDE6C gene
  review also removed from GOA, and it is the one WRONG verdict. Other differences: the PDE6H -> PDE6C edge and
  the channel ion associations carry evidence here. Shared with the red and rod models: the opsin -> GNAT2 edge
  cites an opsin 3 melanocyte paper and the all-trans-retinal activator an opsin 3 keratinocyte paper. Specific
  to this model: the opsin enabled_by and pathway are ISS from the red opsin; the retinal cone cell extension pairs
  a sequence-similarity code with a microspectrophotometry paper. The compartment check is clean (all edges SAME).'
