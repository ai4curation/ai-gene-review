    68fac5ed00003872 places the same activity, with the same reference, in GO:0141190; this is a term-selection
    error, and the fix is that one repoint. The verdict is WRONG for the part_of claim only; consistency is CONFLICT
    because the review removed that process, while the MF itself is consistent.
