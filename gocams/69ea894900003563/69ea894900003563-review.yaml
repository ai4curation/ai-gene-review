      is a cGMP phosphodiesterase. The red-cone model 68fac5ed00003872 cites the same paper and evidence code for
      part_of GO:0141190, which is evidently what was intended here. The PDE6C gene review removes the matching
      GOA row (IDA PMID:21127010), so the GOA annotation should be corrected too.
