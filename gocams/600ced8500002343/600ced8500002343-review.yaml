  supporting_text: Recently, we reported that bone morphogenetic protein (BMP)9 and BMP10 are specific
    ligands for ALK1 that potently inhibit microvascular endothelial cell migration and growth.
  evidence:
  - source_id: PMID:18309101
    supporting_text: Recently, we reported that bone morphogenetic protein (BMP)9 and BMP10 are specific
      ligands for ALK1 that potently inhibit microvascular endothelial cell migration and growth.
  - source_id: PMID:9748228
    supporting_text: Furthermore, we show that ALK1 (TSRI), an orphan receptor that is closely related to
      ALK2 also mediates Smad1 signaling.
  - source_id: PMID:19366699
    supporting_text: Using small interfering RNA, we demonstrate that the type I receptor, ALK1, is
      essential for these responses.
  notes: >-
    GO:0016361 is defined as "Combining with activin-bound type II activin receptor ... acts as a
    downstream transducer of activin signals" (OLS, checked 2026-11-05). ALK1 is named "activin
    receptor-like" but is the type I receptor for BMP9 and BMP10, which is what this model depicts.
    GO:0098821 BMP receptor activity would state it. The has_input SMAD1 (substrate) and the direct edge
    to SMAD1 are supported by PMID:9748228. ALK1 is not pinned in modules/bmp_signaling.yaml, so the
    checker cannot mark the ACVRL1 -> SMAD1 edge EXPLAINED; it reports INDETERMINATE because of the
    chromatin end. It is the same receptor kinase -> R-SMAD convention edge the module explains for
    BMPR1A (release, SMAD4 complex formation, nuclear import via
    modules/karyopherin_nuclear_protein_import.yaml), so NONADJACENT_COMPARTMENTS is not flagged. ACVRL1
    has no gene review.
