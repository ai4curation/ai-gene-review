notes: >-
  Read-only assessment; the model is not edited. Observation, raised once rather than per model: SMAD4 is
  absent from this and the other BMP/TGF-beta SMAD GO-CAMs, although R-SMAD nuclear function requires the
  R-SMAD/SMAD4 complex. modules/bmp_signaling.yaml spells out that step. Question for GO-CAM curators: are
  BMP receptors (ALK1, BMPR2, ACVR2B, BMPR1A) typed with activin or TGF-beta receptor terms by design,
  given that GO:0098821 BMP receptor activity exists?
