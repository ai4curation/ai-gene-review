model: gomodel:600ced8500002343
title: BMP9 signaling pathway (Human)
taxon: NCBITaxon:9606
status: COMPLETE
summary: >-
  GDF2 (BMP9) growth factor activity in the extracellular region has the type II receptors ACVR2B and
  BMPR2 and the type I receptor ACVRL1 (ALK1) as inputs. It directly activates the two type II receptors,
  each of which directly activates ACVRL1. ACVRL1 has SMAD1 as input and directly activates SMAD1
  DNA-binding transcription factor activity, located on chromatin. The causal chain matches the cited
  literature: BMP9 signals through ALK1 with BMPR-II or ActR-II as type II partners, and ALK1 drives
  Smad1 signaling. The receptor activities are typed with activin-specific terms. ACVRL1 carries GO:0016361
  activin receptor activity, type I, whose definition requires activin-bound type II receptors, although
  ALK1 is the BMP9/BMP10 receptor. ACVR2B and BMPR2 carry GO:0016362 activin receptor activity, type II,
  where GO:0098821 BMP receptor activity describes their role in this model. SMAD1 occurs_in chromatin,
  which GO does not place in the nucleus. The evidence for the ACVR2B -> ACVRL1 edge comes from
  activin/ALK4 papers rather than BMP9/ALK1 work. SMAD4, required for nuclear SMAD1 function, is absent,
  as in the other BMP/TGF-beta SMAD models.
