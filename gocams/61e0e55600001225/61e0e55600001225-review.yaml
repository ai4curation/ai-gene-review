  notes: 'The dicarboxylate carrier exports malate from Mdh2 to cytosolic Mdh1 (exchanging phosphate); the chained
    metabolite is malate. GO:0015140 malate transmembrane transporter activity is correct; the human SLC25A10 review''s
    core MF is GO:0015364 dicarboxylate:phosphate antiporter activity, which is not a descendant of GO:0015140,
    so the relation is RELATED rather than a clean subsumption and no GENERIC_MF flag is raised. That review keeps
    gluconeogenesis as non-core. Compartment lead (NONADJACENT, inner membrane -> cytosol) checked and not flagged:
    the carrier exports the metabolite into the intermembrane space, and it reaches the cytosolic enzyme through
    the outer membrane via VDAC porins, a passive, non-selective step that the Reactome source (R-HSA-70263) and
    GO-CAM metabolic models conventionally collapse (Reactome describes the SLC25A12/13 exchange as between cytosolic
    aspartate and mitochondrial glutamate). An acceptable simplification, not a missing regulated step; see the
    model summary.'
