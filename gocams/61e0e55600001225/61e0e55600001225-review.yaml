model: gomodel:61e0e55600001225
title: Gluconeogenesis 1 (Mouse)
taxon: NCBITaxon:10090
status: COMPLETE
summary: 'Mouse gluconeogenesis, malate route, derived from Reactome R-HSA-70263. Pcx makes oxaloacetate in the
  matrix, Mdh2 reduces it to malate, the inner-membrane carriers Slc25a10 (dicarboxylate:phosphate) and Slc25a11
  (oxoglutarate:malate) export malate, and cytosolic Mdh1 reoxidises it to oxaloacetate, generating cytosolic NADH.
  Pck1, Eno1, Pgam1, Pgk1, Gapdh, Tpi1, Aldoc, Fbp1 and Gpi1 then convert it to glucose 6-phosphate, which Slc37a4
  moves into the ER for G6pc1 (and G6pc3). All edges are ''directly provides input for'', and each was traced: every
  activity''s product is the next one''s substrate (oxaloacetate, malate, PEP, phosphoglycerates, triose phosphates,
  fructose bisphosphate, hexose phosphates). The compartment check flags Slc25a10 -> Mdh1 and Slc25a11 -> Mdh1 (inner
  membrane -> cytosol). These were judged an acceptable simplification, not a missing step: malate crosses the outer
  membrane passively through VDAC porins, and the Reactome source treats SLC25 exchange as cytosol <-> matrix. A
  shared outer-membrane passage module would make such edges EXPLAINED across models. The model shares its lower
  half with Gluconeogenesis 3 (62d0afa500000298), and so shares its weaknesses. Aldoc, the brain aldolase, stands
  in for liver Aldob. G6pc3''s gluconeogenic role rests on an astrocyte study. The Tpi1 enabled_by reference looks
  like an aldolase C paper (suspected source defect). Evidence for Mdh1, Mdh2 and Slc25a11 is old or indirect. Causal
  edges carry no evidence.'
