    not represented (see summary). The edge''s reference (PMID:20940301) shows the PDE6 activity, not channel regulation.
    The BRIDGED compartment lead (disc membrane -> outer segment membrane) is the expected diffusion of cGMP in the
    outer-segment cytosol.'
