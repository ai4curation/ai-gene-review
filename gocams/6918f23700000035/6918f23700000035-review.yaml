model: gomodel:6918f23700000035
title: Dim light signaling mediated by RHO photoreceptor via G-alpha-t (transducin)_Visual
  perception (Human)
taxon: NCBITaxon:9606
status: COMPLETE
summary: 'Human rod (dim-light) phototransduction as a five-step chain on the rod outer segment: rhodopsin (RHO)
  photoreceptor activity directly positively regulates rod transducin alpha (GNAT1) G protein activity; GNAT1
  directly negatively regulates the enzyme-inhibitor activity of PDE6G; PDE6G directly negatively regulates the
  cGMP phosphodiesterase activity of the rod PDE6 complex (PDE6A/PDE6B); and PDE6 directly negatively regulates
  the cGMP-gated CNGA1/CNGB1 channel, whose Na+ and Ca2+ influx (extracellular to cytoplasmic side) is the dark
  current. Every activity, location and process matches the core functions of the new or existing gene reviews
  (RHO, GNAT1, PDE6G, PDE6A, PDE6B, CNGA1; CNGB1 is DRAFT). The two double-negative steps are a faithful encoding
  of the mechanism: GTP-bound Gt-alpha displaces the Pgamma C-terminus from the catalytic sites (PMID:33007200),
  so "GNAT1 directly negatively regulates PDE6G" and "PDE6G directly negatively regulates PDE6" are each single
  physical steps, and modelling GNAT1 as a direct positive regulator of the catalytic complex would hide the inhibitor.
  The PDE6 -> channel edge acts through the cGMP concentration, not through contact. No gene-product activity intervenes,
  so the direct, negative relation is defensible; but the mediator is not represented (PDE6 has no has_input cGMP
  and the channel no small-molecule activator cGMP, although the model uses RO:0012001 for retinal), so the edge
  reads as a protein-protein regulation that it is not. The weaknesses are evidence, not biology: both upstream
  causal edges cite unrelated papers (RHO -> GNAT1: an opsin 3 melanocyte paper; GNAT1 -> PDE6G: a serotonin
  receptor structure paper), the all-trans-retinal activator cites an opsin 3 keratinocyte paper, several GNAT1
  and PDE6G associations pair ECO:0000314 (direct assay) with the ISS reference GO_REF:0000024, and the PDE6G ->
  PDE6 edge and the channel''s ion inputs/outputs carry no evidence. Five source defects are recorded. The compartment
  check is clean (one BRIDGED edge, disc membrane -> outer segment membrane, which is the expected lateral diffusion
  of cGMP within the outer segment).'
