  notes: 'Complex-enabled cGMP phosphodiesterase activity, with PDE6A and PDE6B as has_part, on the rod disc membrane:
    matches both the PDE6A and PDE6B review core functions (GO:0047555, GO:0141190, GO:0120202, in GO:7770030; the
    PDE6B review is genes/human/PDE6B/PDE6B-ai-review.yaml). Attributing the activity to the complex is right, since
