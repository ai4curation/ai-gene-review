    consistency: CONSISTENT
    gene_review: file:human/CASP7/CASP7-ai-review.yaml
    supporting_text: PARP-1 proteolysis efficacy is sensitive to RNase A and promoted by added RNA
    evidence:
      - source_id: PMID:31586028
        statement: >-
          CASP7 binds nucleic acids through its N-terminal exosite, and RNA
          promotes CASP7 proteolysis of PARP1 and other RNA-binding substrates.
        supporting_text: PARP-1 proteolysis efficacy is sensitive to RNase A and promoted by added RNA
    notes: >-
      The biology is right and matches the CASP7 gene review, which represents
      RNA binding as a core CASP7 activity in apoptotic execution. PMID:31586028
      supports RNA-mediated bridging between the CASP7 exosite and PARP1's
      RNA-bound Zn3/BRCT domains, so the positive edge from this activity to the
      CASP7 peptidase activity captures a real substrate-recruitment mechanism.
      The model is graded UNCERTAIN rather than OK only because GO:0003723 RNA
      binding is a bare binding term pressed into service as a substrate-selection
      activity; the same gene review asks whether CASP7 RNA binding should be
      modelled instead as a substrate-recognition cofactor for PARP1 and
      RNA-binding-protein cleavage.
