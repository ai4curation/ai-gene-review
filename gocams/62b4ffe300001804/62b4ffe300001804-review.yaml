notes: >-
  Module alignment: modules/apoptotic_execution_phase.yaml already cites this
  GO-CAM on the CASP3 and CASP7 principal-executioner peptidase annotons. The
  model's PARP1-cleavage substrate branch is a small, concrete instance of the
  broader substrate repertoire that the reusable module deliberately excludes;
  adding a separate PARP1 part would reopen a complete substrate inventory rather
  than improve the module boundary. The CASP7 RNA-exosite node is also a
  substrate-specific mechanism for PARP1 and other RNA-binding proteins rather
  than a new mammalian execution requirement.

  Checks run and dismissed: just gocam-lint reports no_narrative, one binding_mf
  notice for the CASP7 RNA-binding activity reviewed above, and same_gene_chain
  because CASP7 appears as separate RNA-binding and peptidase activities in the
  same nuclear compartment. That two-activity chain is intentional here: the RNA
  exosite promotes the PARP1-specific peptidase event. just gocam-compartments
  reports no unresolved, non-adjacent or relocating edges; all four activity
  locations are coarse and the three causal edges are same-compartment edges.
