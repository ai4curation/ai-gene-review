model: gomodel:62b4ffe300001804
title: Cleavage and inactivation of PARP1 by CASP3 and/or CASP7 during the execution
  phase of apoptosis (Human)
taxon: NCBITaxon:9606
status: COMPLETE
summary: >-
  A compact apoptosis-substrate model: nuclear CASP3 and CASP7 both cleave PARP1
  directly, thereby inactivating the PARP1 NAD+ poly-ADP-ribosyltransferase
  activity, and the model adds a CASP7 RNA-binding exosite activity that
  promotes the CASP7-on-PARP1 cleavage event.
activity_reviews:
