    corrected_value: UniProtKB:P26439
    corrected_label: HSD3B2
    cause: CONTEXT_NOT_ASSAYED
    confidence: PROBABLE
    explanation: >-
      The pregnenolone 3-beta-hydroxy-Delta5-steroid dehydrogenase activity is
      embedded in a cholesterol-to-cortisol model and feeds CYP17A1/CYP21A2 in
      the adrenal cortisol branch, but the source GO-CAM's own direct-assay
      reference, PMID:1401999, is not available in the local publications
      cache. PMID:1944309 shows that HSD3B1/type I can catalyze the chemistry
      but that adrenal and gonadal steroidogenesis use HSD3B2/type II. Please
      check whether this activity should be enabled_by
      UniProtKB:P26439/HSD3B2, as in modules/adrenal_steroidogenesis.yaml, or
      whether the HSD3B1 progesterone context should be separated from the
      downstream cortisol branch.
    supported_by:
    - reference_id: PMID:1944309
      supporting_text: >-
        type II transcripts are the almost exclusive 3 beta HSD mRNA species in
        the human adrenal gland, ovary, and testis, while type I transcripts
        correspond to the almost exclusive 3 beta HSD mRNA species in the
        placenta and skin
  notes: >-
    GO:0003854 is a correct term for the first half of an HSD3B pregnenolone to
    progesterone conversion, and pregn-5-ene-3,20-dione is the expected output
    of the dehydrogenase activity. The pathway-context question prevents a
    CONSISTENT comparison with the completed HSD3B2 review, and there is no
    local HSD3B1 review to compare.
