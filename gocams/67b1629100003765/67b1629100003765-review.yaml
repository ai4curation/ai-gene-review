model: gomodel:67b1629100003765
title: Progesterone and cortisol biosynthetic pathway from cholesterol (Human).
taxon: NCBITaxon:9606
status: COMPLETE
summary: >-
  This human steroidogenesis model chains six enzyme activities from cholesterol
  to progesterone and then to cortisol. The CYP11A1, CYP17A1, CYP21A2, and
  CYP11B1 activities use specific catalytic terms and their steroid inputs and
  outputs match the adrenal-steroidogenesis module. The model should add
  occurs_in locations for CYP11A1 at the mitochondrial inner membrane and for
  CYP17A1/CYP21A2 at the endoplasmic reticulum membrane. Its two HSD3B
  activities use HSD3B1, whereas the local adrenal module represents the
  adrenal/gonadal isoenzyme HSD3B2; GO-CAM curators should either re-point those
  two adrenal/cortisol activities to HSD3B2 or split/retitle the model if the
  HSD3B1 placenta/peripheral isoenzyme is intended.
