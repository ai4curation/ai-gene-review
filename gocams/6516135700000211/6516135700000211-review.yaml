model: gomodel:6516135700000211
title: Tumor necrosis factor-mediated signaling pathway 2 (Mouse)
taxon: NCBITaxon:10090
status: COMPLETE
summary: >-
  The model connects extracellular TNF to TNFR1 and a membrane-associated
  FAN-RACK1-EED signaling assembly, ending in sphingomyelin hydrolysis.
  The principal defect is the assignment of the terminal pathway activity
  to Smpd2 rather than Smpd3. Plasma-membrane association is otherwise a
  reasonable spatial summary; it does not imply that the adaptors span
  the lipid bilayer.
