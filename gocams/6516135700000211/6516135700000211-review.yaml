notes: >-
  Scope: assessment of the six activities in the cached model, modified
  2026-03-12, with emphasis on location and terminal gene identity.
  Cached source assertions are preserved verbatim; this review does not
  edit the production model. Gene-review consistency is evaluated by
  species and gene product: only mouse Tnfrsf1a has a matching review
  in the inspected repository tree. Human SMPD2/SMPD3 reviews were useful
  context but were not substituted for missing mouse reviews.
  Reference-level QuickGO inspection on 2026-11-18 returned 12 human/mouse
  annotations for PMID:20080539, including the MGI Smpd2 PM ISO row with
  O60906 and IntAct EED interactions with Q9NY59 and Q9JJY3. This pattern
  corroborates the identity lead; the paper's full Results establish the
  nSMase2 pathway assignment. The model linter finds a missing-evidence
  edge from Nsmaf to Rack1 and no curator narrative. Compartment checking
  resolves every location to an exact anchor and every edge as SAME or
  ADJACENT; therefore no nonadjacent-compartment flag is warranted.
  For visualization, place the adaptors at the cytoplasmic membrane surface
  and TNFR1 across the membrane. A broad occurs-in plasma-membrane
  assertion does not mean constitutive residence or bilayer-spanning topology.
