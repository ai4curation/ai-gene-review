      model. GO:0005179 hormone activity is a broad but accepted MF in the GCG review;
      that same review also records the more product-specific GO:0031769 glucagon
      receptor binding core function for this peptide and places it in extracellular
      region, glucose homeostasis and adenylate-cyclase-activating GPCR signaling.
      has_input names GCGR, the receptor the ligand acts on, and the explicit direct
      ligand-to-receptor causal edge carries the activation event.
