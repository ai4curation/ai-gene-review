model: gomodel:68d5ebd600000298
title: 'GCGR-mediated signaling via G-alpha-s ("stimulatory", activating adenylate
  cyclase) following activation by glucagon (Human) '
taxon: NCBITaxon:9606
status: COMPLETE
summary: >-
  A compact human glucagon-to-Gs model: extracellular glucagon peptide directly
  activates GCGR at the plasma membrane, and the active receptor directly activates
  GNAS/Gs-alpha on the cytoplasmic side of the plasma membrane. The peptide, receptor
  and G-protein molecular functions are biologically correct and align with the
  glucagon-receptor-signaling module. The model stops at the Gs activity and does not
  explicitly represent the adenylyl cyclases named in the model title, and the
  GCGR-to-GNAS causal edge is present three times with identical predicate and target.
