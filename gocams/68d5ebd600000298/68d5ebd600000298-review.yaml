          (gomodel:68d5ebd600000298/68d5ebd600000318), all cited to PMID:28514451.
          The triplicate edge is present in the cached gocam-py export reviewed here.
          A single GCGR-to-GNAS direct positive edge is the intended receptor-to-Gs
          step and should be retained; the two extra copies should be deleted.
    notes: >-
      GCGR glucagon receptor activity, plasma membrane, and the
      adenylate-cyclase-activating GPCR process are an exact match to the reviewed
      GCGR core function and to the glucagon-receptor-signaling module. GCGR sits
      immediately upstream of Gs, so a direct positive causal edge to the GNAS
      activity is correct. The only source-model defect is duplication of that edge:
      the same RO:0002629 association to GNAS appears three times.
notes: >-
  This review aligns all three cached activities to modules/glucagon_receptor_signaling.yaml:
  the module already pins the glucagon peptide, GCGR and GNAS steps to this human
  GO-CAM. The module then models the ADCY5/ADCY6 and PKA tiers downstream, which
  are implied by the GO-CAM title and GO:0007189 process assignment but are absent
  from this compact GO-CAM. The generic gpcr_camp_pka_signaling module also
  records the GO-CAM's GNAS activity as a reusable Gs activation arm. `just
  gocam-lint` found only the triplicate GCGR-to-GNAS edge and the lack of a
  free-text curator narrative; `just
  gocam-compartments` found no unresolved or nonadjacent compartment issue.
  The PMIDs attached in the source model to the GCG peptide are not cached locally,
  so the peptide review was checked against the completed local GCG review and
  its UniProt source text instead of those GO-CAM references.
