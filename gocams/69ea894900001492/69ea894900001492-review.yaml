  notes: >-
    The ATOX1 nuclear activity captures the regulatory half of PMID:15761197:
    ATOX1 changes SOD3 mRNA/protein levels in addition to supporting copper
    delivery. The model uses an indirect edge from a nuclear transcription
    factor activity to extracellular SOD3 activity. The edge direction and sign
    are plausible, but the nonadjacent nuclear-to-extracellular relation skips
    target-gene transcription, SOD3 translation, secretion and copper loading.
