model: gomodel:69ea894900001492
title: Regulation of removal of superoxide radicals by ATOX1 through regulation of
  SOD3 activity. (Human)
taxon: NCBITaxon:9606
status: COMPLETE
summary: >-
  Human extracellular SOD3 is modelled together with two upstream copper-supply
  routes: SLC31A1 imports Cu(I) across the plasma membrane, ATOX1 carries
  cytosolic Cu(I) toward the secretory pathway, and ATP7A exports copper across
  the trans-Golgi network membrane so secreted cuproenzymes can be metalated.
  A second, regulatory branch places ATOX1 in the nucleus as an RNA polymerase
  II-specific transcriptional activator indirectly increasing extracellular SOD3
  superoxide dismutase activity. The SOD3 and ATP7A activities are consistent
  with the human gene reviews. The model is otherwise a compact, biologically
  plausible SOD3 copper-loading model, but the transcriptional ATOX1 branch and
  the cytosol-to-Golgi copper-trafficking branch remain two disconnected causal
  components.
