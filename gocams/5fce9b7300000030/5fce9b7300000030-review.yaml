model: gomodel:5fce9b7300000030
title: Diacyl lipopeptide and bacteriocin activation of TLR6_TLR2 receptor (Human)
taxon: NCBITaxon:9606
status: COMPLETE
summary: The TLR2-TLR6 heterodimer, with diacyl lipopeptide (CHEBI:46896) and the bacteriocin BacSp222
  (CHEBI:48081) as inputs, directly activates MYD88, which indirectly activates RELA in the TLR2:TLR6
  signaling pathway (GO:0038124). The receptor is typed as GO:0001875 lipopolysaccharide immune receptor
  activity, the same wrong ligand class as in model 5fb9cc0600000727. The ligands are recorded as has_input
  of the receptor, which the curation guidelines reserve for the downstream effector (MYD88 is also an
  input here). The MYD88 and RELA activities are sound.
