model: gomodel:680ad14200006156
title: RAD51 and RAD54B cooperate in double-strand break repair via homologous recombination
  (Human)
taxon: NCBITaxon:9606
status: COMPLETE
summary: >-
  This compact human model states the strand-invasion tier of double-strand break
  repair by homologous recombination: RAD54B is connected to RAD51 DNA strand
  exchange, and RAD51 is connected back to a second RAD54B ATP-dependent DNA
  activity.
  The RAD51 activity is consistent with the completed local RAD51 review and both
  RAD51 and RAD54B line up with the strand-invasion part of
  modules/homologous_recombination_dsb_repair.yaml. The source GO-CAM has two
  identically typed RAD54B activities on opposite sides of RAD51 in a reciprocal
  regulation motif, so GO-CAM curators should check whether that is the intended
  representation. The model also uses
  GO:0035861 site of double-strand break as the location for all activities; that
  correctly marks the repair site but leaves the causal graph without an explicit
  cellular compartment, and GO:0000228 nuclear chromosome would state the nuclear
  chromosome context.
