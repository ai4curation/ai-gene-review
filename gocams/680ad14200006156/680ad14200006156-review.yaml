    asserted_value: GO:0035861
    corrected_value: GO:0000228
    corrected_label: nuclear chromosome
    confidence: PROBABLE
    explanation: >-
      The activity is placed at GO:0035861 site of double-strand break. That term
      identifies a repair site but it is not resolved to a distinct cell
      compartment for GO-CAM causal reasoning. The model should use a concrete
      nuclear chromosome/chromatin term for RAD51 action at damaged chromatin and
      leave the break site as process context.
  notes: >-
    GO:0000150 DNA strand exchange activity is RAD51's accepted core molecular
    function in the local gene review. The module pins this same activity to the
    strand-invasion node. The activity itself is sound, but its GO:0035861
    location is a damage-site term rather than a resolvable nuclear compartment.
