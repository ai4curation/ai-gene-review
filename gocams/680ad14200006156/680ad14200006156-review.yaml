  notes: >-
    GO:0000150 DNA strand exchange activity is RAD51's accepted core molecular
    function in the local gene review. The module pins this same activity to the
    strand-invasion node. The activity itself is sound and its GO:0035861
    location correctly marks the damage site; the location is still unresolved
    for explicit cellular-compartment reasoning because it does not assert that
    the site is on nuclear chromatin.
