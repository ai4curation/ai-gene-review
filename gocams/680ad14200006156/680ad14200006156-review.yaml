notes: >-
  The GO-CAM overlaps the strand-invasion node of
  modules/homologous_recombination_dsb_repair.yaml. The module already pins RAD51
  to gomodel:680ad14200006156/680ad14200006159 and pins RAD54B to
  gomodel:680ad14200006156/680ad14200006162; it deliberately ignores the duplicate
  RAD54B node gomodel:680ad14200006156/680ad14200007271. `just gocam-lint` reported
  that duplicate RAD54B activity and the missing free-text model narrative. `just
  gocam-compartments` found no nonadjacent direct edges, but reported that all
  three activities use GO:0035861 site of double-strand break as an unresolved
  location. No local RAD54B review exists yet.
