  - source_id: PMID:28216226
    supporting_text: In contrast, Flag-mNBS1S433D and Flag-mNBS1S433E failed to accumulate at functional
      telomeres (Figures 2B, 2C).
  - source_id: PMID:28216226
    supporting_text: Finally, in addition to being a protein docking hub, a recent report suggests that
      TRF2 could also wrap telomeric DNA around its TRF2TRFH domain
  notes: >-
    The process fits. Docking dephosphorylated NBS1 on TRF2 keeps MRN away from
    telomere ends in G1 and prevents fusions, which is GO:0031848 protection
    from non-homologous end joining at telomere. The MF/has_input pairing is the
    problem. GO:0140463 (OLS) brings a protein to a region of chromatin to keep
    that protein, or its complex, localised there. In this paper the
    chromatin-bound partner is TRF2, the "protein docking hub". NBS1 (through
    its YQLSP motif) is the client, and it needs TRF2 to accumulate at
    functional telomeres. If an adaptor is involved, it is TRF2, with NBN/MRN as
    has_input. The convention in this curator's sibling models
    (gomodel:65a1f4f800000428, gomodel:65a1f4f800000391) makes MDC1/RAD17 the
    adaptor with has_input NBN, and NBN the adaptor with has_input Mre11
    complex. Here NBN has_input TERF2 inverts that pattern. The paper also
    frames the mechanism as sequestration of MRN, so protein sequestering
    activity is an alternative for the TRF2-side node. The causal edge to TERF2
    is addressed in source_defects. This node and 65a1f4f800002885 describe
    the same physical state, NBS1 dephosphorylated on S432 and bound to TRF2.
    They differ only in part_of. No NBN gene review exists.
