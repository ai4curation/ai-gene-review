model: gomodel:65a1f4f800002884
title: Phosphorylation of NBN regulates DNA repair choice at telomes (Human).
taxon: NCBITaxon:9606
status: COMPLETE
summary: >-
  The model is built from one paper (PMID:28216226, Rai et al. 2017, PMC5639704)
  and has two disconnected three-node chains with the same gene sequence. In
  chain 1, CDK2 (cyclin-dependent protein serine/threonine kinase activity,
  has_input NBN) directly negatively regulates NBN (chromatin-protein adaptor
  activity, has_input TERF2, part_of protection from non-homologous end joining
  at telomere), and NBN directly positively regulates TERF2 (double-stranded
  telomeric DNA binding, part_of telomere maintenance). In chain 2, PPP1CA
  (protein serine/threonine phosphatase activity, has_input NBN) directly
  positively regulates a second NBN adaptor activity (part_of double-strand
  break repair via alternative nonhomologous end joining), which directly
  positively regulates a second TERF2 DNA-binding activity. The paper's point
  is a switch. CDK2 phosphorylates NBS1 S432 in S/G2 and releases it from the
  TRF2 TRFH domain. Phospho-NBS1 then binds MRE11 at telomeres lacking TRF2,
  activates ATM and drives classical NHEJ. PP1-alpha dephosphorylates S432 in
  G1. Dephosphorylated NBS1 stays docked on TRF2, which keeps MRN away from
  telomere ends and favours alternative NHEJ when POT1-TPP1 is lost. The
  kinase (CDK2) and the phosphatase (PP1-alpha) are correct, and the
  regulatory signs on the two enzyme edges match the paper. The model has
  three main problems. (1) Both NBN nodes describe the same state,
  dephosphorylated NBN docked on TRF2, so the choice is not represented. The
  phospho-NBN to MRE11/ATM to C-NHEJ branch is missing entirely, and the two
  NBN nodes could be one activity regulated by both enzymes, which would also
  connect the graph. (2) The NBN-TRF2 relation runs the wrong way. The paper
  describes TRF2 as the docking hub, and NBS1 is the client that needs TRF2 to
  accumulate at functional telomeres. Yet the model gives NBN a
  chromatin-protein adaptor activity with TERF2 as has_input. (3) Neither
  NBN-to-TERF2 "directly positively regulates" edge has support: the paper
  never shows NBN changing TRF2's binding to telomeric DNA. The TERF2 DNA-binding
  nodes rest only on a background sentence of the cited paper.
