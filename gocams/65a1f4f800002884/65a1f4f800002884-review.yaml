references:
- id: PMID:28216226
  title: NBS1 Phosphorylation Status Dictates Repair Choice of Dysfunctional Telomeres.
notes: >-
  Read-only assessment; the model is not edited. This review incorporates cjm's
  manual review of this model in "Problematic GO-CAM models" (pp. 15-17), which
  used it as an example of how GO-CAM represents choice. Confirmed: the model is
  two disconnected chains with isomorphic gene sequences (CDK2 -| NBN -> TERF2
  and PPP1CA -> NBN -> TERF2); its intent, a phosphorylation-state switch, is
  legible only from the title and the part_of labels on the NBN nodes; and
  GO-CAM has no explicit construct for a switch. Refined: the chains are not
  the two arms of the choice. Both NBN nodes model the same dephosphorylated,
  TRF2-docked state. The phospho-NBN -> MRE11/ATM -> C-NHEJ arm that defines
  the choice is absent, so the model is incomplete as well as hard to read.
  Kinase discrepancy: the paper, and the cached model (date_modified 2024-02-14,
  unchanged since curation), both name CDK2, which is correct. The "CK2" that
  cjm quoted was in the UniProt O60934 function text. The live UniProt entry
  (checked 2026-11-02) now says CDK2, which fits cjm's note that the typo had
  been fixed but was not yet public. No GO-CAM defect is recorded for the kinase.
  Further issues not raised in the manual review: the NBN chromatin-protein
  adaptor activity with has_input TERF2 inverts the docking relationship (TRF2
  is the hub, NBS1 the client); the NBN -> TERF2 "directly positively regulates"
  edges are unsupported; the TERF2 DNA-binding nodes rest on a background
  sentence; and all evidence is ECO:0000314 although much of the work was done
  with mouse NBS1 in MEFs.
