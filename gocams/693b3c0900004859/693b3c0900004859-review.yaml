model: gomodel:693b3c0900004859
title: ' endoplasmic reticulum to Golgi vesicle-mediated transport (GO:0006888) (partial)'
taxon: NCBITaxon:4896
status: COMPLETE
summary: >-
  A PomBase model of COPII-mediated ER-to-Golgi transport in fission yeast, in three stages.
  Budding: the Sec12 orthologue Spo14 (guanyl-nucleotide exchange factor) activates Sar1 (G protein
  activity) at ER exit sites; Sar1 directly activates the inner coat (Sec23 adaptor, Sec24 cargo
  adaptor), Sec16 scaffolds the exit site, and Sec23 recruits the Sec13-Sec31 outer coat. Cargo
  loading: eight COPII cargo receptors (Emp43 and its paralogue SPCC126.08c, the cornichons Erv14 and
  Cor1, Erv29, Svp26, Ssp120 and an Erv41-Erv46-type cargo receptor complex), several with named cargo
  inputs, directly provide input to Sec24. Uncoating and fusion: Sec23 GAP activity, stimulated by
  Sec31, acts on Sar1 GTPase activity; the TRAPP GEF and the GAP Gyp10 act on Ypt1, which activates
  the tether Uso1; Uso1, Sly1 and the golgin Rud3 act upstream of the fusogenic SNARE complex, which
  Sec17 and Sec18 then disassemble. The Yip1-Yif1-Yos1 group sits upstream of Erv29. Most activities
  rest on orthology (ISO), PAINT (IBA) or curator inference rather than fission yeast experiments,
  which is normal for this pathway, and the biology is sound overall. Three problems were confirmed.
  The Sec23 GAP is drawn as directly negatively regulating Sar1 GTPase activity, the opposite sign to
  what a GAP does and to the model's own Gyp10 to Ypt1 edge. Ssp120 is a soluble luminal protein (the
  MCFD2 orthologue, partner of Emp43), so its direct input edge to cytosolic Sec24 skips the membrane
  that Emp43 spans. Rud3 is typed with a bare binding term (small GTPase binding). Several activities
  (TRAPP, the cargo receptor complex, SPCC126.08c, Sec16, the Sec23 adaptor node) carry no evidence on
  the enabled_by/MF assertion. Of the 13 direct edges the compartment check flags as non-adjacent, 11
  are cargo receptor to Sec24 edges and one is Yip1 to Erv29; together with the three flagged indirect
  edges (Sec23 adaptor to Sec13 and Sec31, Rud3 to the SNARE complex) these arise because "ER exit
  site", "COPII-coated vesicle" and "Golgi apparatus" are coarse terms that the check places in
  different compartments, while both ends sit on the cytosolic face of one budding membrane or of two
  membranes facing the same cytosol. They are legitimate and are dismissed once here; only the
  (duplicated) Ssp120 to Sec24 edge is a real gap. The SNARE complex to Sec18 edge (vesicle membrane to
  Golgi) is legitimate because after fusion the cis-SNARE complex is in the target membrane.
