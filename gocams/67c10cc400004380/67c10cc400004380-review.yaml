    the GO-CAM's plasma-membrane location is coarser than, and consistent with,
    the cytoplasmic-side-of-plasma-membrane location used in the GNAQ core
    function. The CaSR-to-Gq edge is supported by CaSR activation of the Gq/11
    family in cellular assays.
