    confidence: PROBABLE
    explanation: >-
      The nested part_of on the CASR activity makes intracellular calcium ion
      homeostasis a part of the phospholipase C-activating GPCR signaling
      pathway. The same cached activity records plasma membrane part_of
      parathyroid gland in its occurs_in field, showing that the nested value is the
      container. The Gq branch is one signaling route by which CaSR contributes
      to intracellular calcium homeostasis, so the nested biological-process
      relationship should be inverted.
  notes: >-
    The CASR review accepts G protein-coupled receptor activity (GO:0004930) at
    the plasma membrane as a core molecular function and accepts
    phospholipase C-activating GPCR signaling as a direct process. The cached
    activity records intracellular calcium ion homeostasis as its top-level
    part_of value, then nests that process under GO:0007200; that nesting
    appears inverted and is recorded as a GO-CAM source defect above rather than
    counted as corroboration. Its edge structure is otherwise appropriate:
    extracellular calcium is the small-molecule activator, GNAQ is the receptor
    activity's has_input effector molecule, and the causal edge directly
    positively regulates the GNAQ G protein activity.
notes: >-
  Alignment with modules/calcium_sensing_receptor_signaling.yaml: the module
  explicitly pins the CASR and GNAQ activities from this GO-CAM to its receptor
  and Gq/11-route annotons. The PLCB3 activity is represented through the
  referenced generic gpcr_plc_calcium_pkc_signaling#plc_beta_activation module
  rather than repeated as a local CaSR annoton. This agrees with the GO-CAM's
  CASR-to-GNAQ-to-PLCB3 causal structure. The generic module's Gq receptor input
  is a class A GPCR exemplar, so the class C CaSR-specific receptor step is
  intentionally kept in calcium_sensing_receptor_signaling.
