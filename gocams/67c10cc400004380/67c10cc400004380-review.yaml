model: gomodel:67c10cc400004380
title: CASR-mediated signaling via G-alpha-q (phospholipase c-activating, IP3, DAG)  following
  activation by extracellular calcium (Human).
taxon: NCBITaxon:9606
status: COMPLETE
summary: >-
  A compact CaSR-to-Gq human model: extracellular calcium activates the plasma-membrane
  calcium-sensing receptor, CaSR directly activates GNAQ on the cytoplasmic side of the
  plasma membrane, and GNAQ directly activates PLCB3 PIP2 hydrolysis as part of the
  phospholipase C-activating GPCR pathway. The CASR and GNAQ activities agree with
  their local gene reviews. PLCB3 now also agrees with its local review, although the
  GO-CAM occurs_in is cytoplasm rather than the cytoplasmic side of membrane where the
  PI(4,5)P2 substrate is hydrolyzed; otherwise, its PIP2-to-IP3/DAG reaction and
  activation by G alpha q agree with biochemical evidence and with the GPCR-PLC effector
  module.
