  notes: >-
    The phosphatidylinositol-4,5-bisphosphate phospholipase C activity
    (GO:0004435) and GO:0007200 part_of assignment are the expected PLC beta
    effector step of a CaSR-Gq branch. The model also captures the PIP2 inputs
    and IP3/DAG products. The PLCB3 review accepts PIP2 phospholipase C activity
    in GO:0007200 as a core function and keeps cytoplasm as a correct but coarse
    cellular-component assertion for the soluble active pool. The GO-CAM's
    cytoplasm occurs_in value is therefore compatible with the local review, but
    it is coarser than the cytoplasmic side of membrane used for the core PLCB3
    reaction because membrane PI(4,5)P2 is hydrolyzed from the cytoplasmic
    leaflet after G protein recruitment.
