model: gomodel:66c7d41500001120
title: NMDA glutamate receptor activity co-activated by glycine and involving GRIN1 and GRIN2C (Human)
taxon: NCBITaxon:9606
status: COMPLETE
summary: GluN1 (GRIN1) and GluN2C (GRIN2C) each carry NMDA glutamate receptor activity at the postsynaptic membrane;
  glycine activates GluN1 and L-glutamate activates GluN2C. The two subunit activities each "directly positively
  regulate" (RO:0002629) a third activity enabled by the complex term. The ligand each subunit senses is attached
  to that subunit as a small-molecule activator (RO:0012001), and ion flux (has input / has output) sits on the
  complex activity. Terms and structure are correct. The function rows cite PMID:26875626, a paper about GluN2A-selective
  modulators; only its abstract is cached and it does not mention GluN2C, so that citation could not be confirmed.
  PMID:36309015, cited on the causal edges, does describe human GluN1-2C receptors.
