  supporting_text: The N-methyl-D-aspartate receptor (NMDAR) is a Na(+) and Ca(2+) permeable ionotropic glutamate
    receptor that is activated by the coagonists glycine and glutamate
  notes: Enabled by the complex term, so there is no gene review to compare. Using the complex for the channel activity,
    alongside the two contributing subunits, is acceptable because the pore is formed jointly. It does repeat the
    same molecular function three times in one model, and a subunit "regulating" the complex it is part of is a
    modelling convention, not a mechanism. Ca2+ and Na+ as transported ions are supported; K+ efflux is not modelled.
