model: gomodel:68fac5ed00003872
title: Red light signaling mediated by OPN1LW photoreceptor via G-alpha-t (transducin)_Visual perception (Human)
taxon: NCBITaxon:9606
status: COMPLETE
summary: 'Human long-wavelength (red) cone phototransduction, the cone counterpart of the rod model 6918f23700000035:
  OPN1LW photoreceptor activity directly positively regulates cone transducin alpha (GNAT2); GNAT2 directly negatively
  regulates the inhibitor activity of the cone PDE6 gamma subunit (PDE6H); PDE6H directly negatively regulates the
  cGMP phosphodiesterase activity of PDE6C (the cone enzyme is a PDE6C homodimer, so a single-subunit enabler is
  right); and PDE6C directly negatively regulates the CNGA3/CNGB3 channel, whose Na+ and Ca2+ influx it closes.
  Everything is on the cone disc membrane in retinal cone cells. Every activity matches the core function of its
  gene review (OPN1LW, GNAT2, PDE6H, PDE6C, CNGB3; CNGA3 is DRAFT), including the PDE6C part_of the transducin-mediated
  opsin pathway, which the PDE6C review accepts. The double-negative GNAT2 -> PDE6H -> PDE6C steps and the PDE6C
  -> channel step through the cGMP concentration are judged as in the rod model: correct sign, defensibly direct
  (no gene-product activity intervenes), but the cGMP mediator is not represented. Evidence defects: the OPN1LW
  -> GNAT2 edge cites an opsin 3 melanocyte paper and the all-trans-retinal activator an opsin 3 keratinocyte paper
  (both shared with the other opsin models); the PDE6H -> PDE6C edge and the channel''s ion inputs/outputs carry
  no evidence; and the GNAT2 -> PDE6H direct edge rests on a mutant-phenotype paper (achromatopsia truncations),
  which shows the gene is needed but not the mechanism. The compartment check is clean (all SAME).'
