  - source_id: PMID:32034146
    statement: Acetylated XPF drives assembly and activation of the XPF-ERCC1 complex.
    supporting_text: this acetylation is required for XPF-ERCC1 complex assembly and subsequent activation
  notes: >-
    SIRT1's NAD-dependent protein lysine deacetylase activity exactly matches a
    reviewed SIRT1 core molecular function. Its has_input XPF filler is the
    protein being deacetylated, and direct negative regulation of the downstream
    XPF-ERCC1 assembly activity is the right sign for the enzyme opposing
    KAT5/TIP60. The local ERCC4 UniProt record names SIRT1 as the XPF
    deacetylase and cites PMID:32034146, and the paper's cached abstract
    supports acetylated XPF as the positive state needed for stress-induced
    XPF-ERCC1 assembly. The model should add a nuclear or damage-site
    occurs_in value.
