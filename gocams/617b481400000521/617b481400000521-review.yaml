model: gomodel:617b481400000521
title: KAT5 involvement in nucleotide excision repair (Human)
taxon: NCBITaxon:9606
status: COMPLETE
summary: >-
  A compact human model in which TIP60/KAT5 acetylates XPF/ERCC4 at Lys911
  after UV or mitomycin-C damage, promoting stress-induced XPF-ERCC1 assembly
  and activation for nucleotide-excision and interstrand-crosslink repair.
  SIRT1 is the opposing XPF deacetylase, KAT5 directly promotes the
  assembly adaptor-like XPF activity, and SIRT1 directly inhibits it; the XPF
  assembly activity then directly promotes the catalytic XPF-ERCC1 endonuclease
  activity. KAT5 and SIRT1 use plausible molecular functions and inputs, but all
  four activities are missing locations. The regulator branch is valid evidence
  for the canonical full-length XPF/ERCC4 protein, not for the short
  non-displayed UniProt isoform Q92889-2 that enables both XPF activities in
  the cached GO-CAM.
