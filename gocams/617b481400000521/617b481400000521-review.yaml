    explanation: >-
      The model types the XPF-ERCC1 NER incision activity as GO:0000014
      single-stranded DNA endonuclease activity. That term is not globally
      false for ERCC4: QuickGO confirms that GO:1990599 3-prime overhang
      single-stranded DNA endonuclease activity is a child of GO:0000014, and
      the local ERCC4 review keeps GO:1990599 annotations for the telomeric
      overhang branch. For the NER 5-prime incision modeled here, QuickGO
      confirms that GO:0106332 is not a GO:0000014 descendant, and the cached
      human XPF-ERCC1 assays show junction-specific cleavage with no free
      ssDNA cleavage under the same conditions.
