  notes: >-
    SIRT1's NAD-dependent protein lysine deacetylase activity exactly matches a
    reviewed SIRT1 core molecular function. Its has_input XPF filler is the
    protein being deacetylated, and direct negative regulation of the downstream
    XPF-ERCC1 assembly activity is the right sign for the enzyme opposing
    KAT5/TIP60. The local cached abstract does not expose a SIRT1 sentence from
    the paper's Results section, so this is left UNCERTAIN rather than OK; the
    abstract does support acetylated XPF as the positive state needed for
    stress-induced XPF-ERCC1 assembly. The model should add a nuclear or
    damage-site occurs_in value.
