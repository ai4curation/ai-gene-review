model: gomodel:59cc772c00000000
title: IL1beta-mediated signaling pathway (Human)
taxon: NCBITaxon:9606
status: COMPLETE
summary: >-
  The model runs from caspase-1 maturation of IL-1 beta to TAK1. CASP1 (cytosol) cleaves pro-IL-1 beta and
  directly positively regulates IL1B cytokine activity (extracellular region). IL1B activates IL1R1
  (plasma membrane), which directly activates the IL1RAP coreceptor and the MYD88 adaptor. MYD88 recruits
  IRAK4, IRAK4 phosphorylates IRAK1, IL1RAP recruits TOLLIP, and TOLLIP is drawn as directly activating
  IRAK1. IRAK1 is causally upstream of MAP3K7 (TAK1) through an indirect edge that omits TRAF6. The
  receptor-proximal chain (IL1B, IL1R1, IL1RAP, MYD88, IRAK4) is well supported by the cited papers.
  There are four main problems. First, the CASP1 -> IL1B direct edge skips the release of mature
  IL-1 beta from the cytosol to the extracellular space. Second, the TOLLIP -> IRAK1 edge is drawn as
  positive although the cited paper reports that Tollip overexpression impairs NF-kappaB activation,
  and the TOLLIP gene review treats TOLLIP as restraining IRAK1. Third, the three kinases carry the
  generic GO:0016301 kinase activity. Fourth, the IRAK1 -> MAP3K7 edge and the MAP3K7 location have
  no evidence, and MAP3K7 has no part_of process.
