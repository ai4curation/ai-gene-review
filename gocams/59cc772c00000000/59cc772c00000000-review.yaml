  gene_review: genes/human/TOLLIP/TOLLIP-ai-review.yaml
  supporting_text: As overexpression of Tollip results in impaired NF-kappaB
    activation, we conclude that Tollip is an important constituent of the IL-1R
    signalling pathway.
  evidence:
  - source_id: PMID:10854325
    supporting_text: Co-recruited MyD88 then triggers
      IRAK autophosphorylation, which in turn leads to rapid dissociation of IRAK from
      Tollip (and IL-1Rs).
  - source_id: PMID:10854325
    supporting_text: As overexpression of Tollip results in impaired NF-kappaB
      activation
  - source_id: file:human/TOLLIP/TOLLIP-uniprot.txt
    supporting_text: Inhibits IRAK1 phosphorylation and kinase activity
  notes: >-
    The MF (molecular adaptor activity, carrying IRAK1 to IL1RAP), the
    has_input IRAK1 and the location agree with the TOLLIP review, which ACCEPTs
    GO:0060090 and GO:0070498 from the same paper. The verdict rests on the causal
    edge. TOLLIP -> IRAK1 kinase activity is asserted as RO:0002629 directly
    positively regulates, but the cited paper places IRAK1 activation on MYD88.
    In that paper, phosphorylated IRAK leaves TOLLIP, and TOLLIP overexpression
    impairs NF-kappaB activation. The curated UniProt function (PMID:11751856)
    says TOLLIP inhibits IRAK1 phosphorylation and kinase activity. The TOLLIP
    review's description also calls its role "regulated restraint of
    IRAK-dependent innate immune signaling". The edge sign therefore conflicts
    with the review and with the source the model cites. Because TOLLIP also
    recruits IRAK1 to the receptor, the corrected edge should be negative
    (directly negatively regulates), or the activity could be retyped as protein
    sequestering activity holding IRAK1 in resting cells.
