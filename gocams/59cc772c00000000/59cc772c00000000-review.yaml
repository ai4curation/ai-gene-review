    resource: GO_CAM
    record: gomodel:59cc772c00000000/626b20c100001914
    slot: causal_associations
    requested_change: CHECK
    asserted_value: RO:0002629
    confidence: SUSPECTED
    explanation: >-
      TOLLIP molecular adaptor activity is drawn as directly positively regulating IRAK1 kinase
      activity, citing PMID:10854325. That paper reports that Tollip holds IRAK before stimulation, that
      MyD88 triggers IRAK autophosphorylation, that IRAK then dissociates from Tollip, and that Tollip
      overexpression impairs NF-kappaB activation. Later work treats TOLLIP as a negative regulator of
      IRAK1. Check whether the edge should be negative (directly negatively regulates, RO:0002630), or
      whether TOLLIP's recruiting role should be drawn as input to the receptor complex rather than as
      positive regulation of IRAK1 kinase activity.
    supported_by:
    - reference_id: PMID:10854325
      supporting_text: As overexpression of Tollip results in impaired NF-kappaB activation
notes: >-
  Read-only assessment; the model is not edited. TRAF6, the IKK complex and NF-kappaB are not modelled,
  so the pathway stops at TAK1. A module for inflammasome-dependent IL-1 beta release (CASP1 cleavage of
  pro-IL-1 beta and GSDMD, then pore-mediated release) would explain the CASP1 -> IL1B edge the way the
  JAK-STAT and BMP modules explain receptor -> transcription factor edges.
