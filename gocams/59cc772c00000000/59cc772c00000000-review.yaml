model: gomodel:59cc772c00000000
title: IL1beta-mediated signaling pathway (Human)
taxon: NCBITaxon:9606
status: COMPLETE
summary: >-
  CASP1 cysteine-type endopeptidase activity (has_input IL1B) directly activates
  IL1B cytokine activity, which directly activates the IL1R1 interleukin-1
  receptor. IL1R1 directly activates two branches. In the first, MYD88 adaptor
  activity activates IRAK4 kinase activity, which phosphorylates IRAK1. In the
  second, IL1RAP coreceptor activity activates TOLLIP adaptor activity, which is
  drawn as directly activating IRAK1. IRAK1 kinase activity is then causally
  upstream of TAK1 (MAP3K7) kinase activity, with a positive effect. The
  ligand-receptor-Myddosome core is sound and well evidenced. There are five
  problems. (1) The TOLLIP -> IRAK1 edge is positive, but the cited paper
  (PMID:10854325) and the curated UniProt function both describe TOLLIP as
  inhibiting IRAK1 phosphorylation and NF-kappaB activation. (2) IRAK4, IRAK1 and
  TAK1 are typed with the bare GO:0016301 kinase activity, where GO:0004674
  protein serine/threonine kinase activity (and GO:0004709 for TAK1) applies.
  (3) The IRAK1 -> TAK1 edge has no evidence and omits TRAF6 and K63
  ubiquitination, the step that actually activates TAK1. The model also gives
  IRAK1's contribution as kinase activity, although the IRAK family other than
  IRAK4 can signal without catalytic activity. (4) TAK1 has no part_of process,
  its occurs_in has no evidence, and it is a terminal node. (5) The CASP1 ->
  IL1B edge is asserted as direct although CASP1 acts in the cytosol and IL1B
  cytokine activity is extracellular. The GSDMD-pore secretion step between
  them, which CASP1 also triggers by cleaving GSDMD, is missing.
