    autophosphorylation, and Tollip overexpression impairs NF-kappaB activation. The TOLLIP gene review
    describes TOLLIP as restraining IRAK1 in resting cells. Only the abstract is cached, so the edge is
    left UNCERTAIN and recorded as a suspected defect for the curator to check, not as wrong.
  source_defects:
