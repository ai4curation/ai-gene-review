    corrected_value: RO:0002407
    corrected_label: indirectly positively regulates
    confidence: PROBABLE
    explanation: >-
      The edge runs from CASP1 cysteine-type endopeptidase activity in the
      cytosol to IL1B cytokine activity in the extracellular region
      (gomodel:59cc772c00000000/59cc772c00000002), and it is asserted as direct.
      Processed IL-1beta has to leave the cell by GSDMD-pore-mediated
      unconventional secretion before it can act. That step is itself
      downstream of CASP1 cleaving GSDMD, so the relation is not a single step.
      The preferred correction is to add a GSDMD pore activity between the two;
      failing that, make the edge indirect.
    supported_by:
    - reference_id: PMID:33883744
      supporting_text: A prominent biological role of the GSDMD pore is to mediate
        unconventional protein secretion of IL-1β
