  evidence:
  - source_id: PMID:20485341
    supporting_text: It has been shown that once phosphorylated, IRAK1 or IRAK2 leaves
      the Myddosome and interacts with TRAF6 to elicit Lys63-linked polyubiquitination
      and downstream signaling
  - source_id: PMID:11960013
    supporting_text: Most strikingly, and in
      contrast to the other IRAKs, IRAK-4 depends on its kinase activity to activate
      NF-kappa B.
  - source_id: PMID:10383454
    supporting_text: Although IRAK-M and IRAK-2 exhibit only a negligible
      autophosphorylation activity, they can reconstitute the IL-1 response in a 293
      mutant cell line lacking IRAK.
  notes: >-
    IRAK1 is a protein serine/threonine kinase, so GO:0016301 is generic
    (GO:0004674). The has_input IRAK1 (self) records autophosphorylation, cited
    to PMID:14625308 (not cached). This is acceptable, though IRAK4 is the kinase
    that starts the activation. The outgoing edge to TAK1 uses RO:0002304
    (causally upstream of, positive effect) and has no evidence. An indirect
    relation is correct here, because IRAK1 acts on TAK1 through TRAF6 E3 ligase
    activity and K63-linked ubiquitination, and TRAF6 is missing from the model.
    The activity that drives this step is also probably not catalytic. IRAK4,
    unlike the other IRAKs, needs its kinase activity to activate NF-kappaB, and
    the kinase-dead family members IRAK2 and IRAK-M reconstitute IL-1 responses
    in IRAK1-deficient cells. Signalling adaptor or scaffold activity toward
    TRAF6 would fit IRAK1's role in the pathway better, alongside its
    autophosphorylation. IRAK1 has no gene review.
