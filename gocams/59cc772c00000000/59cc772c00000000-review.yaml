  supporting_text: Subcellular fractionation of the extracts suggested that the processing activity is
    found in the cytosol of monocytes or monocyte-like cell lines.
  evidence:
  - source_id: PMID:2787508
    supporting_text: Subcellular fractionation of the extracts suggested that the processing activity is
      found in the cytosol of monocytes or monocyte-like cell lines.
  - source_id: PMID:2787508
    supporting_text: The exact cellular site of cleavage and mechanism of secretion is at present unknown.
  - source_id: PMID:2950091
    supporting_text: The data show that the initial translation product from IL-1 beta mRNA must be
      processed in order to bind to the IL-1 receptor and hence express biological activity.
  notes: >-
    The MF, the substrate (has_input IL1B), the cytosol location and part_of protein maturation all hold,
    and they match the CASP1 gene review's core function. GO:0004197 is in the cytosol. The direct
    positive edge goes to IL1B cytokine activity in the extracellular region (compartment check:
    NONADJACENT, distance 2). The cited paper places the cleavage in the cytosol and leaves the
    secretion route open. Missing step: release of mature IL-1 beta across the plasma membrane, which is
    now known to run mainly through gasdermin D pores (CASP1 also cleaves GSDMD) or unconventional
    secretion. No module explains this edge, unlike the receptor -> transcription factor edges in the
    JAK-STAT and BMP models. The cleavage edge is mechanistically direct (CASP1 acts on pro-IL-1 beta),
    so the gap is a missing secretion step, not a wrong directness. The occurs_in evidence
    (PMID:20197547, SphK2 cleavage in apoptotic cells) does not state the cytosol in its abstract.
    PMID:2787508 supports the location better. The part_of evidence (PMID:15326478) concerns pro-IL-18
    rather than pro-IL-1 beta.
