  gene_review: genes/human/CASP1/CASP1-ai-review.yaml
  supporting_text: Interleukin-1 beta (IL-1 beta)-converting enzyme cleaves the IL-1
    beta precursor to mature IL-1 beta, an important mediator of inflammation.
  evidence:
  - source_id: PMID:1574116
    supporting_text: Interleukin-1 beta (IL-1 beta)-converting enzyme cleaves the IL-1
      beta precursor to mature IL-1 beta, an important mediator of inflammation.
  - source_id: PMID:2787508
    supporting_text: Subcellular fractionation of the
      extracts suggested that the processing activity is found in the cytosol of
      monocytes or monocyte-like cell lines.
  - source_id: PMID:2787508
    supporting_text: The cleavage product is
      also capable of binding to the IL-1 receptor found on fibroblast membranes.
  - source_id: PMID:2787508
    supporting_text: The exact cellular site of cleavage and mechanism of secretion
      is at present unknown.
  - source_id: PMID:33883744
    supporting_text: Caspase-1 also
      cleaves inactive precursors of the interleukin (IL)-1 family to generate mature
      cytokines such as IL-1β and IL-18. Cleaved GSDMD forms transmembrane pores to
      enable the release of IL-1 and to drive cell lysis through pyroptosis
  - source_id: PMID:33883744
    supporting_text: A prominent biological role of the GSDMD pore is to mediate
      unconventional protein secretion of IL-1β
  notes: >-
    The catalytic activity is correct. GO:0004197 is the CASP1 review's core MF,
    and has_input IL1B (pro-IL-1beta) is the substrate. The edge to IL1B cytokine
    activity is the problem, because it crosses compartments. CASP1 acts in the
    cytosol (occurs_in GO:0005829), where pro-IL-1beta is cleaved. The IL1B
    activity it is said to directly activate occurs in the extracellular region
    (GO:0005576), where IL-1beta binds IL1R1 on the target cell. Mature IL-1beta
    lacks a signal peptide, so getting it out of the cell is a separate step:
    unconventional secretion through gasdermin D pores. CASP1 also triggers that
    step by cleaving GSDMD. Cleavage does make IL-1beta competent to bind the
    receptor, since the precursor cannot, but cleavage alone does not make the
    extracellular activity happen. A cleaved IL-1beta that stays in the cytosol
    signals nothing. RO:0002629 directly positively regulates therefore
    compresses at least two steps (processing, then GSDMD-dependent release)
    into one. Two fixes would work. The minimal one is to change the edge to
    RO:0002407 indirectly positively regulates. The better one is to model the
    release: CASP1 -> GSDMD wide pore channel activity in the plasma membrane,
    which in turn activates IL1B cytokine activity, with mature IL-1beta as the
    GSDMD transport input. The model also gives the has_input IL1B molecule node
    no location; pro-IL-1beta is cytosolic. There are also two provenance
    caveats. First, the enabled_by evidence (PMID:2787508, Kostura 1989; the user
    supplied the full text) characterises an uncloned "pre-IL-1beta convertase"
    activity in monocyte extracts. It supports the activity and its cytosolic
    location, but not the identity of the gene product; PMID:1574116 (Thornberry
    1992, purification and cDNA cloning) is the reference that does. The
    Kostura full text also anticipates the compartment issue: it concludes that
    processing "closely precedes or is coupled to secretion". Second, part_of GO:0051604
    protein maturation is cited to PMID:15326478, which concerns pro-IL-18
    rather than the pro-IL-1beta in this model. The CASP1 review's core process
    for this activity is the more specific GO:0140447 cytokine precursor
    processing.
