  verdict: WRONG
  consistency: NO_GENE_REVIEW
  supporting_text: >-
    Specific HATs acetylate histone H4K5 (HAM1, HAM2), H4K12 (HAG2), and H3K14
    (HAG1)
  evidence:
  - source_id: PMID:17877703
    statement: The MYST-family acetyltransferases HAM1 and HAM2 acetylate H4K5 in vitro.
    supporting_text: >-
      Specific HATs acetylate histone H4K5 (HAM1, HAM2), H4K12 (HAG2), and
      H3K14 (HAG1)
  - source_id: PMID:23273925
    statement: >-
      HAM1/HAM2 are MYST histone acetyltransferases that act on H4K5, with
      in vivo support.
    supporting_text: >-
      two MYST histone acetyltransferases HAM1
      and HAM2 work redundantly to acetylate histone H4 lysine 5 (H4K5ace) in vitro.
  - source_id: PMID:25183522
    statement: MRG1/2 recruit the H4-specific acetyltransferases HAM1/HAM2.
    supporting_text: >-
      interact with the histone H4-specific acetyltransferases (HAM1 and HAM2)
  - source_id: PMID:25183522
    statement: >-
      Model-wide process issue: in Arabidopsis H3K36me3 peaks at the 5' end of
      the coding region rather than following elongating Pol II, so
      elongation-coupled chromatin remodeling (GO:0140673) is a poor fit.
    supporting_text: >-
      the H3K36me3 level in Arabidopsis peaks at the 5′-end of the coding region
  notes: >-
    The molecular function (histone H4K5 acetyltransferase, GO:0043995), its
    input (histone H4, AT2G28740) and chromatin location are correct for the
    MYST acetyltransferase HAM1. The enabler is the wrong gene, though.
    AT2G45160 is SCARECROW-LIKE 27 (UniProtKB:Q7XJM8, a GRAS-family
    transcription regulator, also called HAM1/HAIRY MERISTEM 1 and LOM1). It
    has no acetyltransferase domain and none of the three cited papers studies
    it. The MYST HAM1 of PMID:17877703, PMID:23273925 and PMID:25183522 is
    AT5G64610 (UniProtKB:Q9FLF7, "Histone acetyltransferase of the MYST family
    1"; UniProt cites PMID:17877703 and PMID:23273925 for its H4K5 activity).
    HAM2 (AT5G09740) acts redundantly and could be added as a second enabler
    or a separate activity. The enabled_by should be changed to AT5G64610. As
    cached, this annoton asserts an acetyltransferase activity for a GRAS
    protein and would propagate a false MF to SCL27. It is also the terminal
    node, with no causal output to transcription of FT/FLC, so the model's
    output on flowering-gene expression is not represented (the paper's
    readout). The verdict rests on the wrong enabler; the model-wide process
    issue (GO:0140673) is recorded in the summary and does not drive it.
