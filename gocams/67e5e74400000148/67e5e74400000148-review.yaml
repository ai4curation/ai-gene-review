- activity_id: gomodel:67e5e74400000148/67e5e74400000149
  gene_product: AGI_LocusCode:AT1G02740
  molecular_function: GO:0140003
  biological_process: GO:0140673
  cellular_component: GO:0000785
  verdict: UNCERTAIN
  consistency: NO_GENE_REVIEW
  qc_flags:
  - HAS_INPUT_MISUSE
  supporting_text: >-
    MRG1/2 binds to H3K36me3 with their chromodomain and
    interact with the histone H4-specific acetyltransferases (HAM1 and HAM2)
  evidence:
  - source_id: PMID:25183522
    statement: MRG2 reads H3K36me3 in vivo; binding depends on SDG8-made H3K36me3.
    supporting_text: >-
      These data indicate that H3K36me3 is essential for MRG protein binding in vivo.
  - source_id: PMID:25183522
    statement: MRG2 physically engages HAM1/2 (PLA, BiFC, Co-IP).
    supporting_text: >-
      The interaction between MRG1/2 and MYST family proteins HAM1/2,
      characterised by an in situ PLA assay, BiFC assay and Co-IP analysis
  - source_id: PMID:25183522
    statement: >-
      Model-wide process issue: in Arabidopsis H3K36me3 peaks at the 5' end of
      the coding region rather than following elongating Pol II, so
      elongation-coupled chromatin remodeling (GO:0140673) is a poor fit.
    supporting_text: >-
      the H3K36me3 level in Arabidopsis peaks at the 5′-end of the coding region
  notes: >-
    MRG2 (UniProtKB:Q4V3E2) as a histone H3K36me3 reader (GO:0140003) is well
    supported: there is chromodomain peptide binding in vitro, and the PLA
    signal is lost in sdg8. Has input HTR4 (histone H3.3) is appropriate. The
    second has input, AT2G45160 (SCL27), is wrong twice over. It is the wrong
    locus (the partner is MYST HAM1, AT5G64610), and a recruited effector
    enzyme is not the input of a reader activity: the
    "directly positively regulates" edge to the acetyltransferase already
    captures the recruitment. The MRG2 -> HAM edge (RO:0002629) is defensible:
    the paper shows direct physical interaction and loss of H4K5ac at FT in
    mrg1 mrg2. MRG1 (AT4G37280), which acts redundantly with MRG2, is not
    modelled. Process GO:0140673 (elongation-coupled suppression of cryptic
    transcription) contradicts the paper's conclusion that plant MRGs
    diverged from that role and act at promoter/5' regions to raise FT and FLC
    expression. That process issue is model-wide and recorded in the summary;
    this activity's UNCERTAIN verdict rests on the has-input misuse.
  source_defects:
  - defect_type: WRONG_GENE_PRODUCT
    resource: GO_CAM
    record: gomodel:67e5e74400000148/67e5e74400000149
    slot: has_input
    requested_change: DELETE_VALUE
    asserted_value: AGI_LocusCode:AT2G45160
    cause: SYMBOL_COLLISION
    confidence: CONFIRMED
    explanation: >-
      The MRG2 H3K36me3 reader activity has AT2G45160 (SCL27, a GRAS protein
      with the alias HAM1) as a has_input. The partner the paper reports is the
      MYST acetyltransferase HAM1, AT5G64610 (UniProtKB:Q9FLF7). Separately, a
      recruited effector enzyme is not the input of a reader activity. The
      MRG2-to-HAM1 relationship is already captured by the causal edge to the
      acetyltransferase activity, so the has_input should be removed rather
      than re-pointed.
    supported_by:
    - reference_id: PMID:25183522
      supporting_text: >-
        interact with the histone H4-specific acetyltransferases (HAM1 and HAM2)
- activity_id: gomodel:67e5e74400000148/67e5e74400000156
  gene_product: AGI_LocusCode:AT1G77300
  molecular_function: GO:0140955
  biological_process: GO:0140673
