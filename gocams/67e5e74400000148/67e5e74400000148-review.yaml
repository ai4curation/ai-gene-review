model: gomodel:67e5e74400000148
title: Arabidopsis MRG domain proteins bridge two histone modifications
taxon: NCBITaxon:3702
status: COMPLETE
summary: >-
  A four-activity chromatin model built almost entirely on Xu et al. 2014
  (PMID:25183522), describing how Arabidopsis MRG proteins couple H3K36
  trimethylation to histone H4 acetylation at flowering-time genes. The chain
  is: ASHH3/SDG7 (AT2G44150, histone H3K36 dimethyltransferase, has input
  histone H3.3 HTR4) "directly provides input for" ASHH2/SDG8 (AT1G77300,
  histone H3K36 trimethyltransferase, has input HTR4), which "directly provides
  input for" the MRG2 (AT1G02740) histone H3K36me3 reader activity (has input
  HTR4 and AT2G45160), which "directly positively regulates" a histone H4K5
  acetyltransferase activity (has input histone H4, AT2G28740). Every activity
  occurs in chromatin and is part_of transcription elongation-coupled chromatin
  remodeling (GO:0140673). The core story (SDG8-deposited H3K36me3 is read by
  the MRG2 chromodomain, and MRG1/2 recruit the MYST acetyltransferases
  HAM1/HAM2 to raise H4K5 acetylation at FT and FLC) is well supported by the
  cited paper. Two problems dominate. (1) Wrong gene product: the H4K5
  acetyltransferase is enabled by AT2G45160, which is SCARECROW-LIKE 27
  (UniProtKB:Q7XJM8), a GRAS-family transcription regulator whose alternative
  symbol is also HAM1 (HAIRY MERISTEM 1). The MYST acetyltransferase HAM1
  studied in all three cited papers is AT5G64610 (UniProtKB:Q9FLF7; HAM2 is
  AT5G09740). The same wrong locus is reused as a has input of the MRG2 reader.
  This looks like a symbol collision when the entity was picked. (2) Process:
  GO:0140673 is defined as restoring chromatin after RNA polymerase II passes
  during elongation, to suppress cryptic intragenic initiation. That is the
  role of animal and yeast MRG15/Eaf3. The cited paper argues that the
  Arabidopsis MRGs diverged from it and instead raise acetylation at the
  promoter and 5' region to elevate transcription. A positive regulation of
  transcription / flowering-gene expression process would fit the paper's
  claim better. No gene product in this model has a gene review in this
  repository (genes/ARATH has none of MRG1, MRG2, SDG8, SDG7, HAM1, HAM2 or
  SCL27). The downstream targets FT, FLC and SOC1 are reviewed, but they are
  not represented in the model.
notes: >-
  This is the only production GO-CAM with NCBITaxon:3702 in the GO production
  index (gocam-models.json, 2036 models, checked 2026-10-14). It is also the
  only model with TAIR/AGI gene products in gocam-gps.json (49,416 model
  entries), and the only model returned by the GO API taxon endpoint
  (api.geneontology.org/api/taxon/NCBITaxon:3702/models). Molecular-function
  associations carry no evidence of their own. The ECO:0000314 evidence sits
  on enabled_by, occurs_in, part_of and the edges. Some of it supports genetic
  (mutant) observations, for which ECO:0000315 would be more accurate.
