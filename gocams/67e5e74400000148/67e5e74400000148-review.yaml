  verdict: OK
  consistency: NO_GENE_REVIEW
  supporting_text: >-
    mutation of the Arabidopsis H3K36 methyltransferase SDG8 leads to a near
    complete abolishment of H3K36me3 and a slight reduction in H3K36me2
  evidence:
  - source_id: PMID:25183522
    statement: SDG8 (ASHH2) is required for H3K36me3 and for MRG2 chromatin engagement.
    supporting_text: >-
      MRG2 binds to H3K36me3 specifically in vivo because the binding of MRG2
      is completely abolished in the sdg8 mutant
  - source_id: PMID:25183522
    statement: >-
      Model-wide process issue: in Arabidopsis H3K36me3 peaks at the 5' end of
      the coding region rather than following elongating Pol II, so
      elongation-coupled chromatin remodeling (GO:0140673) is a poor fit.
    supporting_text: >-
      the H3K36me3 level in Arabidopsis peaks at the 5′-end of the coding region
  notes: >-
    ASHH2/SDG8/EFS (UniProtKB:Q2LAE1) is the main Arabidopsis H3K36
    trimethyltransferase, so the MF is correct. In this model it rests on
    mutant immunostaining (a genetic observation tagged ECO:0000314). The
    "directly provides input for" edge to the MRG2 reader is appropriate: the
    H3K36me3 product of SDG8 is what the MRG2 chromodomain binds, and MRG2
    chromatin binding is lost in sdg8. Has input HTR4 (histone H3.3) is
    acceptable. The model-wide process issue (GO:0140673) is recorded in the
    summary and does not drive this activity's verdict, so the MF and edge,
    both well supported, leave it OK.
