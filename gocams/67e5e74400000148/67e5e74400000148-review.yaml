  verdict: UNCERTAIN
  consistency: NO_GENE_REVIEW
  qc_flags:
  - DIRECT_VS_INDIRECT_CAUSAL
  supporting_text: >-
    The double mutant with another close homologue of SDG8, sdg7 sdg8 fully
    abolishes both the di- and tri-methylation marks at H3K36 (Figure 4A).
  evidence:
  - source_id: PMID:25183522
    statement: >-
      SDG7 (ASHH3) contributes to the residual H3K36me2 left in sdg8. The
      evidence is genetic: immunostaining of mutant nuclei.
    supporting_text: >-
      mutation of the Arabidopsis H3K36 methyltransferase SDG8 leads to a near
      complete abolishment of H3K36me3 and a slight reduction in H3K36me2
  - source_id: PMID:25183522
    statement: >-
      Model-wide process issue: in Arabidopsis H3K36me3 peaks at the 5' end of
      the coding region rather than following elongating Pol II, so
      elongation-coupled chromatin remodeling (GO:0140673) is a poor fit.
    supporting_text: >-
      the H3K36me3 level in Arabidopsis peaks at the 5′-end of the coding region
  notes: >-
    ASHH3/SDG7 (UniProtKB:Q945S8) is a SET-domain H3K36 methyltransferase
    homologue of SDG8. The cited paper supports a contribution to H3K36me2
    in vivo only through the sdg7 sdg8 double mutant. It does not include an
    enzyme assay, so ECO:0000314 overstates the evidence type (ECO:0000315 /
    IMP would be accurate). The MF H3K36 dimethyltransferase is plausible but
    rests on genetic inference here. The edge "directly provides input for"
    ASHH2 encodes a strict sequential model (SDG7 makes me2, SDG8 converts it
    to me3). The paper does not test that order. The sdg8 single mutant
    already lowers H3K36me2, so SDG8 likely also makes some me2 itself, and
    the direct-input edge over-states what the genetics show. Has input HTR4
    (histone H3.3, AT4G40030) is a reasonable stand-in for histone H3 as
    substrate. The verdict rests on the evidence type and the over-strict
    input edge; the model-wide process issue (GO:0140673) is recorded in the
    summary and does not drive this activity's verdict.
- activity_id: gomodel:67e5e74400000148/67e5e74400000172
  gene_product: AGI_LocusCode:AT2G45160
  molecular_function: GO:0043995
  biological_process: GO:0140673
