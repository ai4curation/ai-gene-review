model: gomodel:66e382fb00001232
title: BMP4 signaling pathway (Human)
taxon: NCBITaxon:9606
status: COMPLETE
summary: >-
  BMP4 cytokine activity in the extracellular region has BMPR2 as input and directly activates BMPR2.
  BMPR2 directly activates the type I receptor BMPR1A, and BMPR1A, with SMAD1 as substrate, directly
  activates the DNA-binding transcription factor activities of SMAD1, SMAD5 and SMAD9 in the nucleus.
  The causal chain is the canonical BMP-SMAD1/5/8 pathway. The three receptor -> nuclear R-SMAD edges are
  the GO-CAM direct-regulation convention: the receptor phosphorylates the R-SMAD at the membrane, and the
  R-SMAD acts later in the nucleus. The compartment check reports them as EXPLAINED by
  modules/bmp_signaling.yaml. There are three main problems. BMPR1A is typed with GO:0005025
  transforming growth factor beta receptor activity, type I, and BMPR2 with activin receptor activity,
  type II, although GO:0098821 BMP receptor activity is the core function in both gene reviews. The
  BMPR2 -> BMPR1A edge cites a BMP9/ALK1 study in which BMP4 had little effect. The SMAD5 and SMAD9 edges
  cite a Smad1 paper. SMAD4 is absent, as in the other BMP/TGF-beta SMAD models.
