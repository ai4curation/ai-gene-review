    The location and process are supported (PMID:17992660 shows BMPR-II dependence of BMP4-induced Smad
    signalling). The MF GO:0016362 activin receptor activity, type II is kept as non-core in the BMPR2
    gene review, whose core function is GO:0098821 BMP receptor activity. In a BMP4 model the depicted
