  notes: 'MF granularity: the demonstrated reaction is S-palmitoylation of a protein cysteine (MAVS Cys79,
    GSK3beta Cys14), so GO:0019706 protein-cysteine S-palmitoyltransferase activity is the term the evidence
    supports; GO:0016409 palmitoyltransferase activity is its parent and does not say that the acceptor
    is a protein thiol. has_input MAVS is the correct filler (the palmitoylation substrate). occurs_in
    GO:0005783 endoplasmic reticulum is coarse but well supported: PMID:21926431 maps the KXX signal that
    restricts DHHC4 to ER membranes, and GO:0005789 endoplasmic reticulum membrane would state the side.
    Compartment lead dismissed: the ZDHHC4 (ER) -> MAVS (mitochondrial outer membrane) edge is reported
    as NONADJACENT at distance 2, but the primary paper''s mechanism is exactly an ER-anchored enzyme
    acylating a protein of the outer mitochondrial membrane. Both are membranes bordering the cytosol
    and the DHHC active site and the MAVS N-terminal region both face the cytosol, so no transport step
    is missing; the adjacency graph simply does not treat two cytosol-facing membranes as touching. GO:0044233
    mitochondria-associated endoplasmic reticulum membrane contact site would make the contact explicit
    if the curators wanted to state it. No NONADJACENT_COMPARTMENTS flag.'
