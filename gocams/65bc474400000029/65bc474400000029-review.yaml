    content). The CPT1A (mitochondrial outer membrane) -> ZDHHC4 (ER) edge is the flagged non-adjacent
    pair; it is the reported recruitment of an ER enzyme by a mitochondrial outer-membrane protein, i.e.
    contact-site biology, so the lead is dismissed for the same reason as on the ZDHHC4 activity and no
    NONADJACENT_COMPARTMENTS flag is recorded. What the model cannot distinguish, because the primary
    paper''s full text is not in our cache, is whether recruitment requires CPT1A catalytic activity or
    only its presence; the abstract describes recruitment alone.'
