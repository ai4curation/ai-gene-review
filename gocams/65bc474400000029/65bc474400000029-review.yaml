  notes: 'GO:0030674 protein-macromolecule adaptor activity is the right call rather than a binding term:
    the paper''s claim is that TRAF3IP3 couples two partners (it "bridges MAVS and TRAF3"), which is what
    an adaptor does. Mitochondrial outer membrane and the cytoplasmic pattern recognition receptor signaling
    pathway are both directly supported, and the enabled_by reference (PMID:31390091) is the paper that
    establishes the role. The activity is a leaf: TRAF3, TBK1 and IRF3 are not in the model, so the adaptor''s
    output has no object. That is model scope, not an error, and the activity is not an orphan because
    it carries the incoming MAVS edge.'
