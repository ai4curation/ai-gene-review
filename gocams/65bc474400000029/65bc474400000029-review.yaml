title: ZDHHC4-mediated palmitoylation of MAVS via CPT1A (Human)
taxon: NCBITaxon:9606
status: COMPLETE
summary: 'The model states a four-step innate-immune chain: CPT1A, at the mitochondrial outer membrane,
  acts as a protein adaptor that recruits the ER-anchored palmitoyltransferase ZDHHC4; ZDHHC4 palmitoylates
  MAVS (Cys79) and thereby activates MAVS signaling adaptor activity on the outer mitochondrial membrane;
  activated MAVS then engages TRAF3IP3, the adaptor that brings TRAF3 to MAVS for downstream TBK1-IRF3
  activation. The causal story is faithful to the primary paper (PMID:38016475), and the two cross-compartment
  edges that the adjacency check flags (ZDHHC4 in the ER acting on MAVS in the mitochondrial outer membrane,
  and CPT1A in the mitochondrial outer membrane acting on ZDHHC4 in the ER) are the biology the paper
  reports rather than missing steps: both membranes border the cytosol, and the recruitment is ER-mitochondrion
  contact-site chemistry. The weaknesses are evidence bookkeeping and term granularity: three annotations
  cite papers that do not contain the asserted entities (PMID:35606353 for ZDHHC4''s innate-immune role
  and its edge to MAVS, PMID:20451243 and PMID:16858409 for the MAVS-TRAF3IP3 relations), and ZDHHC4''s
  molecular function stops at GO:0016409 palmitoyltransferase activity where GO:0019706 protein-cysteine
  S-palmitoyltransferase activity is what was shown. The model ends at TRAF3IP3: TRAF3, TBK1 and IRF3
  are not represented.'
