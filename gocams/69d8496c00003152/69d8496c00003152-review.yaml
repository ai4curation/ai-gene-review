    F-box/Kelch substrate receptor, TP53 is the substrate, and the process and nuclear
    location agree with the FBXO42 core function. The edge to RBX1 is a reasonable GO-CAM
    compression of the adaptor handing the p53 substrate to the SCF catalytic core. The p53
    substrate is phosphorylation-dependent; the upstream CSN-associated kinase activity that
    creates the recognized phosphodegron is out of scope for this compact model. The verdict is
    UNCERTAIN only because two p53-specific claims cite the RBPJ paper rather than the p53
    papers.
