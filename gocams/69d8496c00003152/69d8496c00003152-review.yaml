        forming SCF(betaTrCP1-betaTrCP1) and SCF(betaTrCP2-betaTrCP2) ubiquitin-ligase complexes.
    - reference_id: PMID:21127074
      supporting_text: JFK destabilizes p53 through the assembly of a Skp1-Cul1-F-box complex
  notes: >-
    GO:0160072 ubiquitin ligase complex scaffold activity matches the CUL1 review's core
    function, and GO:0031146 matches its SCF-dependent proteasomal ubiquitin-dependent protein
    catabolic process role. has_input FBXO42 is an acceptable SCF-specific input for the scaffold
    activity because FBXO42 is the F-box substrate receptor that binds the SKP1-CUL1 core. The
    model omits SKP1, so the CUL1-to-FBXO42 connection is a compact representation of complex
    assembly rather than a fully drawn subunit path. The activity is marked UNCERTAIN only because
    the direct positive edge to FBXO42 overstates that relationship.
