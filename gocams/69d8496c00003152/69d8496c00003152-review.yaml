    explanation: >-
      The edge from CUL1 scaffold activity to FBXO42 substrate-adaptor activity says CUL1
      directly positively regulates FBXO42. CUL1 is the SCF scaffold, and FBXO42 is the
      substrate receptor that binds SKP1-CUL1 through its F-box and p53 through its substrate
      recognition domain. PMID:19509332 and PMID:21127074 support FBXO42 working in a
      SKP1-CUL1-F-box complex, but neither shows CUL1 activating FBXO42. The edge-specific
      reference, PMID:10644755, is about beta-TrCP1/2 recognition of phosphorylated
      IkappaBalpha, not FBXO42. Please delete the causal edge. The activity-level
      has_input FBXO42 already captures the local assembly context without asserting that CUL1
      regulates FBXO42's molecular function.
    supported_by:
