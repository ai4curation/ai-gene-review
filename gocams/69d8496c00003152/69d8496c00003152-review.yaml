model: gomodel:69d8496c00003152
title: FBXO42-mediated degradation of p53 via CUL1/RBX1 (Human)
taxon: NCBITaxon:9606
status: COMPLETE
summary: >-
  A four-activity human SCF(FBXO42) model in the nucleus. CUL1 has ubiquitin ligase complex
  scaffold activity in SCF-dependent proteasomal ubiquitin-dependent protein catabolic process
  and lists FBXO42 as an input; FBXO42/JFK has ubiquitin-like ligase-substrate adaptor activity
  in the same process and lists TP53 as its input; FBXO42 provides TP53 to RBX1 ubiquitin protein
  ligase activity; RBX1 directly negatively regulates TP53 DNA-binding transcription activator
  activity. The core biological statement is right: FBXO42 is an F-box substrate receptor in an
  SKP1-CUL1-RBX1 complex, and it recognizes phosphorylated p53 for ubiquitination and
  degradation. The activities use appropriate MF terms, p53 as the substrate input, and a nuclear
  location. The TP53 transcription-factor activity is real but is absent from the current TP53
  review's core_functions, which use the broader cis-regulatory binding MF. The model has three
  evidence or edge-level problems. First, CUL1's edge directly positively regulating FBXO42 is not
  the right causal statement for complex assembly: CUL1 scaffolds the SCF core but is not known to
  activate FBXO42 substrate-adaptor activity. Second, the FBXO42 process and the FBXO42-to-RBX1
  edge cite the RBPJ/Notch K63-polyubiquitination paper rather than the p53 degradation papers.
  Third, the RBX1-to-TP53 edge cites a general CUL1/RBX1 study of beta-TrCP-directed IkappaBalpha
  ubiquitination rather than the p53 degradation evidence.
