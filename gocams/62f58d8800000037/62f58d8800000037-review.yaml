model: gomodel:62f58d8800000037
title: >-
  Activation of the kinase activity of EIF2AK4/GCN2 by isoform ZAKalpha of
  MAP3K20 in response to ribosome collisions (Human)
taxon: NCBITaxon:9606
status: COMPLETE
summary: >-
  This human model connects ZAKalpha sensing of colliding ribosomes to EIF2AK4
  kinase activity and then to EIF2S1/eIF2alpha inhibition in the cytosol. The
  causal topology and the ZAKalpha and EIF2AK4 molecular functions match the
  ribosome-collision literature and the integrated-stress-response module. Two
  source terms need repair: MAP3K20/ZAKalpha is placed in negative regulation
  of translation in response to endoplasmic reticulum stress even though the
  cited paper supports ribosome-collision-triggered GCN2 signaling, and the
  EIF2S1 node reuses the source GO:0160296 cap-dependent initiation-factor term
  that the local EIF2S1 review already repoints to the parent translation
  initiation factor activity.
activity_reviews:
- activity_id: gomodel:62f58d8800000037/63d320cd00001794
  gene_product: UniProtKB:Q9NYL2-1
  molecular_function: GO:0170011
  biological_process: GO:1902010
  cellular_component: GO:0005737
