    eIF2alpha-phosphorylation inhibition represented in the module.
- activity_id: gomodel:62f58d8800000037/62f58d8800000057
  gene_product: UniProtKB:P05198
  molecular_function: GO:0160296
  biological_process: GO:0006413
  cellular_component: GO:0005829
  verdict: WRONG
  consistency: CONFLICT
  gene_review: file:human/EIF2S1/EIF2S1-ai-review.yaml
  supporting_text: >-
    eIF2 (eukaryotic translation initiation factor 2) and eIF2B augmented
    translation of capped, uncapped and encephalomyocarditis virus-internal
    ribosome entry site-promoted mRNAs
  evidence:
  - source_id: file:human/EIF2S1/EIF2S1-ai-review.yaml
    statement: >-
      The local EIF2S1 review modifies GO:0160296 to the parent GO:0003743
      because eIF2 is a general initiation factor, not a cap-specific factor.
    supporting_text: >-
      GO:0160296 is defined by recognition and binding of the
      7-methylguanosine cap, which is eIF4E/eIF4F activity, not eIF2's.
  - source_id: PMID:16289705
    statement: >-
      eIF2 and eIF2B support capped, uncapped and IRES-driven mRNAs in the
      HeLa cell-free translation system, so this paper does not support a
      cap-dependent activity for EIF2S1.
    supporting_text: >-
      eIF2 (eukaryotic translation initiation factor 2) and eIF2B augmented
      translation of capped, uncapped and encephalomyocarditis virus-internal
      ribosome entry site-promoted mRNAs
  source_defects:
  - defect_type: WRONG_TERM
    resource: GO_CAM
    record: gomodel:62f58d8800000037/62f58d8800000057
    slot: molecular_function
    requested_change: REPOINT
    asserted_value: GO:0160296
    corrected_value: GO:0003743
    corrected_label: translation initiation factor activity
    confidence: CONFIRMED
    explanation: >-
      The EIF2S1 activity is typed GO:0160296 cap-dependent translation
      initiation factor activity, following the UniProt row from PMID:16289705.
      eIF2 delivers Met-tRNAi as part of the eIF2-GTP-Met-tRNAi ternary complex
      and does not recognize the 5' mRNA cap; the cited paper shows eIF2 and
      eIF2B augmenting capped, uncapped and EMCV-IRES translation alike, while
      eIF4E is the cap-specific factor. Retype the activity to GO:0003743
      translation initiation factor activity.
    supported_by:
    - reference_id: PMID:16289705
      supporting_text: >-
        eIF2 (eukaryotic translation initiation factor 2) and eIF2B augmented
        translation of capped, uncapped and encephalomyocarditis virus-internal
        ribosome entry site-promoted mRNAs
  notes: >-
    The gene product, cytosol location and translational-initiation process are
    consistent with the translation-initiation module and the shared eIF2 node
    in modules/integrated_stress_response.yaml. The molecular function should
    be GO:0003743, as in both modules, because EIF2S1/eIF2 is not
    cap-specific.
