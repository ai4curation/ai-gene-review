notes: >-
  Aligned to modules/integrated_stress_response.yaml and
  modules/translation_initiation.yaml. The ZAKalpha activity is upstream
  ribosome-collision activation context for the species-neutral ISR module
  rather than a reusable part of the ISR core itself, while the EIF2AK4 and
  EIF2S1 activities map directly to the GCN2 kinase and eIF2alpha annotons.
  `just gocam-lint` reports only no_narrative, and `just gocam-compartments`
  reports no unresolved terms and no non-adjacent compartment edges.
