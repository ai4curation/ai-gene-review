  consistency: MORE_SPECIFIC
  gene_review: file:human/MAP3K20/MAP3K20-ai-review.yaml
  supporting_text: >-
    ZAK associates normally with elongating, transiently colliding, ribosomes,
    but under broad cellular stress, auto-phosphorylates on abundant more stable
    colliding ribosomes and activates downstream SAPK signaling pathways
  evidence:
  - source_id: file:human/MAP3K20/MAP3K20-ai-review.yaml
    statement: >-
      The local MAP3K20 review represents ZAKalpha ribosome-collision sensing
      as a core ribosome-binding function.
    supporting_text: >-
      Proximal sensor of ribosome collisions in the ribotoxic stress response
  - source_id: PMID:32610081
    statement: >-
      ZAKalpha binds elongating ribosomes, auto-phosphorylates on colliding
      disomes and is required for early GCN2-mediated stress signaling.
    supporting_text: >-
      ZAK associates normally with elongating, transiently colliding, ribosomes,
      but under broad cellular stress, auto-phosphorylates on abundant more
      stable colliding ribosomes and activates downstream SAPK signaling
      pathways
  source_defects:
  - defect_type: WRONG_TERM
    resource: GO_CAM
    record: gomodel:62f58d8800000037/63d320cd00001794
    slot: part_of
    requested_change: REPOINT
    asserted_value: GO:1902010
    corrected_value: GO:0140469
    corrected_label: GCN2-mediated signaling
    confidence: CONFIRMED
    explanation: >-
      The MAP3K20/ZAKalpha activity in this model represents ribosome-collision
      sensing upstream of EIF2AK4/GCN2. The cited PMID:32610081 paper shows that
      ZAKalpha sits on colliding ribosomes and is required for
      collision-induced GCN2/eIF2alpha phosphorylation; it is not an
      endoplasmic-reticulum-stress branch. The part_of process should therefore
      be GCN2-mediated signaling, matching the EIF2AK4 node it activates, or an
      equivalent ribosome-collision-specific ISR process.
    supported_by:
    - reference_id: PMID:32610081
      supporting_text: >-
        under intermediate doses of ANS, we find that ZAK KO cells show marked
        reductions in eIF2α phosphorylation as compared to WT cells
  notes: >-
    GO:0170011 is a better molecular-function term than the broader ribosome
    binding used in the current local MAP3K20 core function. The source issue
    is the biological-process slot: GO:1902010 is the ER-stress-specific branch
    of translational control, while PMID:32610081 supports ZAKalpha-mediated
    GCN2 activation from colliding ribosomes.
