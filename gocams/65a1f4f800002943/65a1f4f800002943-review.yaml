model: gomodel:65a1f4f800002943
title: Lipoprotein cargo loading in COPII-mediated ER to Golgi transport (Human)
taxon: NCBITaxon:9606
summary: >-
  A three-step COPII lipoprotein-export model in which PREB/SEC12 activates
  SAR1B at ER exit sites and the SAR1B branch converges on SURF4 COPII cargo
  receptor activity for selective lipoprotein loading. PREB-to-SAR1B is a
  well-formed direct positive GEF-to-GTPase edge. SURF4 is correctly placed as
  the receptor terminal node, but the SAR1B activity misuses has_input for SURF4
  and overstates the edge as direct positive regulation of SURF4 receptor
  activity when the cited SAR1B evidence supports COPII coat assembly and
  lipoprotein secretion, not SURF4 as a biochemical SAR1B target.
status: COMPLETE
activity_reviews:
- activity_id: gomodel:65a1f4f800002943/65a1f4f800003148
  gene_product: UniProtKB:O15260
  molecular_function: GO:0097020
  biological_process: GO:0090110
  cellular_component: GO:0070971
  verdict: OK
  consistency: NO_GENE_REVIEW
  supporting_text: "governed by the GTPase SAR1B and SURF4, a high-efficiency cargo receptor"
  notes: >-
    SURF4 COPII receptor activity at the ER exit site, part_of
    COPII-coated vesicle cargo loading and lipoprotein transport, is a suitable
    terminal receptor node for the model. PMID:33186557 directly supports a
    SAR1B/SURF4 lipoprotein-export program. The GO-CAM could be made more
    explicit by adding the lipoprotein cargo input to SURF4, but the existing
    activity is not orphaned because it is downstream of the SAR1B activity. No
    SURF4 gene review exists in this project yet.
- activity_id: gomodel:65a1f4f800002943/65a1f4f800003134
  gene_product: UniProtKB:Q9Y6B6
  molecular_function: GO:0003925
  biological_process: GO:0090110
  cellular_component: GO:0070971
  verdict: UNCERTAIN
  qc_flags:
  - GENERIC_MF
  - HAS_INPUT_MISUSE
  - DIRECT_VS_INDIRECT_CAUSAL
  consistency: NO_GENE_REVIEW
  supporting_text: "SAR1B knockdown caused loss of lipoprotein secretion"
  notes: >-
    SAR1B is correctly in the COPII-coated vesicle cargo-loading/lipoprotein
    branch at ER exit sites, but GO:0003925 is a generic small-G-protein MF where
    GTPase activity would be tighter. The has_input SURF4 assertion is the larger
    graph problem: SURF4 is a cargo receptor that acts with SAR1B, not a substrate
    or downstream effector acted on by SAR1B GTPase activity. The direct positive
    SAR1B -> SURF4 edge therefore compresses an indirect coat-assembly/cargo-loading
    route into direct regulation of SURF4 receptor activity. No SAR1B gene review
    exists in this project yet.
- activity_id: gomodel:65a1f4f800002943/65a1f4f800002969
  gene_product: UniProtKB:Q9HCU5
  molecular_function: GO:0005085
  biological_process: GO:0048208
  cellular_component: GO:0070971
  verdict: OK
  consistency: NO_GENE_REVIEW
  supporting_text: "Addition of the SAR1 guanine exchange factor SEC12 proportionally increased the loading speed of both paralogs"
  notes: >-
    PREB/SEC12 guanyl-nucleotide exchange factor activity with has_input SAR1B is
    the correctly directed initiating GEF step for this subgraph. It directly
    positively regulates the SAR1B GTPase activity and is nested part_of
    COPII vesicle coat assembly. The ERES occurs_in assertion is supported by
    cTAGE5 recruitment of Sec12 to ER exit sites in PMID:27170179, although that
    paper concerns collagen export rather than lipoprotein cargo. No PREB gene
    review exists in this project yet.
