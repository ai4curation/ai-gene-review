notes: >-
  Checked against modules/acetylcholine_signaling.yaml. That module already
  links gomodel:678073a900000353 to its species-neutral alpha7 nAChR annoton;
  no module edit was needed. `just gocam-lint 678073a900000353` reported only
  the expected one-activity/small-model shape and no blocking structural
  findings. `just gocam-compartments 678073a900000353` found the ER-to-cytoplasm
  calcium movement spatially resolved, so the ER setting was assessed
  biologically against the cited human and rat evidence rather than from a
  compartment-graph failure.
