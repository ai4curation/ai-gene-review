model: gomodel:678073a900000353
title: CHRNA7 nAChR activity in synaptic transmission involved in micturition. (Human)
taxon: NCBITaxon:9606
status: COMPLETE
summary: >-
  A one-activity human CHRNA7 model that places alpha7 nicotinic acetylcholine
  receptor cation-channel activity in acetylcholine receptor signaling and the
  rat-derived micturition branch. The molecular-function typing itself is sound
  and matches both the completed CHRNA7 gene review and the alpha7 annoton in
  modules/acetylcholine_signaling.yaml: human alpha7 is a homopentameric,
  acetylcholine-gated, calcium-permeable cation channel. The context is less
  clean. The occurs_in value makes the conducting CHRNA7 activity happen at the
  endoplasmic reticulum membrane, and the calcium input/output then make the
  alpha7 receptor itself read as the ER calcium-release channel. The rat
  urothelial paper that motivates the micturition context instead reports a
  ryanodine-sensitive intracellular mechanism downstream of alpha7 stimulation,
  so the ER-release step should be checked rather than folded into CHRNA7's
  own channel activity. The choline small-molecule activator association also
  lacks direct evidence in the cached model.
