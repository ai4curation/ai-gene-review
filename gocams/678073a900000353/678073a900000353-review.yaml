    explanation: >-
      The activity asserts the human CHRNA7 acetylcholine-gated cation channel
      in the endoplasmic reticulum membrane by ISS from rat RGD:2348 and then
      gives it calcium input in the ER and calcium output in the cytoplasm. A
      sibling GO-CAM, gomodel:67369e7600000404, places the same human
      CHRNA7/GO:0022848 activity at the postsynaptic membrane with direct-assay
      evidence from PMID:21718690, and the completed CHRNA7 gene review accepts
      four direct-assay plasma-membrane rows. The rat bladder paper that appears
      to motivate the micturition context, PMID:22250215, reports
      alpha7-dependent calcium elevation through a ryanodine-sensitive
      intracellular mechanism. That supports intracellular calcium release
      downstream of alpha7 stimulation, not localization of the conducting
      alpha7 channel to the ER membrane. Check whether this urothelial activity
      should be placed at the plasma membrane, with a separate ER
      ryanodine-receptor release step if the model needs one.
