    requested_change: CHECK
    asserted_value: GO:0005789
    corrected_value: GO:0005886
    corrected_label: plasma membrane
    cause: CONTEXT_NOT_ASSAYED
    confidence: PROBABLE
    explanation: >-
      The activity asserts the human CHRNA7 acetylcholine-gated cation channel
      in the endoplasmic reticulum membrane by ISS from rat RGD:2348 and then
      gives it calcium input in the ER and calcium output in the cytoplasm. The
      model's direct human evidence, PMID:33735609, supports plasma-membrane
      alpha7 channel activity and calcium permeability. The rat bladder paper
      that appears to motivate the micturition context, PMID:22250215, reports
      alpha7-dependent calcium elevation through a ryanodine-sensitive
      intracellular mechanism. That supports intracellular calcium release
      downstream of alpha7 stimulation, not localization of the conducting
      alpha7 channel to the ER membrane. Check whether this activity should be
      placed at the plasma membrane, with a separate ER ryanodine-receptor
      release step if the urothelial model needs one.
    supported_by:
    - reference_id: PMID:33735609
      supporting_text: >-
        To test for calcium permeability, the bath solution contained (in mM):
        150 KCl, 5 or 20 CaCl2
    - reference_id: PMID:22250215
      supporting_text: >-
        α7 through a ryanodine-sensitive intracellular mechanism and α3*
        through extracellular influx
  notes: >-
    The activity's GO:0022848 molecular function agrees with the CHRNA7 review,
    which accepts acetylcholine-gated monoatomic cation-selective channel
    activity as core and describes it as a property of the assembled receptor
    rather than an alpha7 monomer. The linked
    modules/acetylcholine_signaling.yaml annoton represents the same conductive
    alpha7 homopentamer at the plasma membrane, with five CHRNA7 active units.
    The verdict is UNCERTAIN because the model attaches that same channel
    activity to the ER membrane / ER-to-cytoplasm calcium-release setting, and
    because the RO:0012001 choline activator association has no ECO code or
    reference in the cached model.
