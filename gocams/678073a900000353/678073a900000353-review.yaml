  notes: >-
    The activity's GO:0022848 molecular function agrees with the CHRNA7 review,
    which accepts acetylcholine-gated monoatomic cation-selective channel
    activity as core and describes it as a property of the assembled receptor
    rather than an alpha7 monomer. The linked
    modules/acetylcholine_signaling.yaml annoton represents the same conductive
    alpha7 homopentamer at the plasma membrane, with five CHRNA7 active units.
    The verdict is UNCERTAIN because the model attaches that same channel
    activity to the ER membrane / ER-to-cytoplasm calcium-release setting, and
    because the RO:0012001 choline activator association has no ECO code or
    reference in the cached model. The corrected value for the occurs_in defect
    is generic plasma membrane rather than postsynaptic membrane because the
    model is explicitly in a urothelial cell and its own micturition context is
    not a synapse.
