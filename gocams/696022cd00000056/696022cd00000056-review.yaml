notes: >-
  Reviewed against genes/human/CYP27A1/CYP27A1-ai-review.yaml,
  genes/human/HSD11B2/HSD11B2-ai-review.yaml,
  genes/human/SMO/SMO-ai-review.yaml and modules/hedgehog_signaling.yaml. The
  module already cites this GO-CAM on the SMO transducer annoton, which
  is the right boundary: the module's generic Patched-Smoothened-Ci/GLI motif
  records sterol control of Smoothened without copying the two upstream
  oxysterol-enzyme assertions or treating HSD11B2 and CYP27A1 as generic
  Hedgehog pathway components. The GO-CAM has no explicit causal edges; the
  HSD11B2-to-CYP27A1-to-SMO path is implicit in shared molecule flow, and an
  explicit upstream activation edge from CYP27A1's product to SMO would make the
  missing regulatory relation clear.
