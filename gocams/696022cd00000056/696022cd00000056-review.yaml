  notes: >-
    This activity carries the exact GO:0047022 and GO:0045880 terms that the
    completed HSD11B2 review marked over-annotated. PMID:30340023 directly
    supports HSD11B2-dependent 7β-OHC oxidation to 7k-C in human HEK293T cells
    without stating the construct species and places Hsd11b2 upstream of the
    CYP27A1 oxysterol relay in mouse Ptch1-null fibroblasts, so the node is not
    a wrong-gene assertion. It is still in CONFLICT with the local review
    because the exact 7β-OHC activity and Smoothened assignment are
    by-similarity, non-core and not directly shown for human HSD11B2, and because
    the asserted NADP+ cofactor may be wrong for the human type 2 enzyme. The
    node also omits an occurs_in value; HSD11B2 is an ER-membrane enzyme, but
    the correct location for this disputed oxysterol activity should be checked
    together with the human pathway assertion. A separate UNIPROT CHECK records
    the internal P80365 mismatch between the FUNCTION text's oxysterol oxidation
    direction and the by-similarity RHEA:68656 NADPH reduction.
