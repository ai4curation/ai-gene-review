    explanation: >-
      The model's shared small-molecule flow connects HSD11B2 to CYP27A1 to SMO:
      HSD11B2 produces 7-ketocholesterol, CYP27A1 consumes 7-ketocholesterol and
      produces an oxysterol, and SMO currently consumes that oxysterol through a
