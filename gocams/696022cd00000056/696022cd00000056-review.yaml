  gene_review: file:human/CYP27A1/CYP27A1-ai-review.yaml
  supporting_text: >-
    7KCh is metabolized at a 4-fold higher rate than cholesterol in the
    reconstituted system in vitro
  evidence:
  - source_id: PMID:21411718
    statement: >-
      Recombinant human CYP27A1 can oxygenate 7-ketocholesterol in a
      reconstituted adrenodoxin/adrenodoxin reductase/NADPH system.
    supporting_text: >-
      7KCh is metabolized at a 4-fold higher rate than cholesterol in the
      reconstituted system in vitro
  - source_id: PMID:30340023
    statement: >-
      Mouse Ptch1-null fibroblast perturbation and downstream-oxysterol rescue
      support a Cyp27a1-dependent enzymatic contribution to Smoothened
      activation.
    supporting_text: >-
      7β-DHC and 7k,27-OHC, but not 7k-C, restored HH signaling following
      depletion of CYP27A1
  notes: >-
    The molecular function matches the completed CYP27A1 review's accepted
    GO:0016716 IDA row; the specific cholesterol 26-hydroxylase term
    GO:0031073 would name the wrong substrate for this 7-ketocholesterol step.
    The GO:0045880 process matches the review's non-core ISS row from mouse
    Cyp27a1. This is therefore RELATED rather than fully CONSISTENT with a core
    human function: the pathway contribution is an ortholog inference from the
    mouse Ptch1-null cell assay plus direct human 7-ketocholesterol conversion,
    not a direct human Hedgehog-pathway assay. The generic CHEBI:53030
    oxysterol output and SMO ligand hide the specific point of the rescue
    assay: 7k,27-OHC and 7β,27-DHC activate the pathway downstream of CYP27A1,
    while 7k-C does not. MISSING_LOCATION is recorded because the model leaves
    the CYP27A1 activity unlocalized even though the human enzyme is
    mitochondrially associated.
