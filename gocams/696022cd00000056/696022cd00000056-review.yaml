      CYP27A1 GO:0016716 activity to the SMO GO:0004930 activity so the
      oxysterol activation step remains explicit rather than disconnecting the
      model.
    supported_by:
    - reference_id: PMID:30340023
      supporting_text: >-
        7β-DHC and 7k,27-OHC, but not 7k-C, restored HH signaling following
        depletion of CYP27A1
    - reference_id: PMID:31168089
      supporting_text: >-
        We present a cryo-electron microscopy structure of human SMO bound to
        24(S),25-epoxycholesterol and coupled to a heterotrimeric Gi protein.
  notes: >-
    The receptor activity, smoothened signaling process and non-motile cilium
    membrane location all match accepted SMO annotations and core functions in
    the completed local review. The GNAI1 input models SMO's immediate
    heterotrimeric-Gi effector and is a proper receptor has_input filler; the
    oxysterol molecule is an activating ligand and should sit upstream of SMO
    as a causal activator or small-molecule activator relation rather than as
    RO:0002233 has_input. The mis-slotted oxysterol input is also supported by
    ECO:0000250 / GO_REF:0000024 with MGI:88594, a mouse Cyp27a1 seed, which is
    further evidence that it belongs on the CYP27A1-to-SMO handoff rather than
    on SMO's receptor has_input assertion.
