model: gomodel:696022cd00000056
title: HSD11B2 and CYP27A1 generate oxysterols that activate SMO (Human).
taxon: NCBITaxon:9606
status: COMPLETE
summary: >-
  This compact human Hedgehog-side model links HSD11B2-dependent
  7β-hydroxycholesterol oxidation to CYP27A1-dependent oxysterol synthesis
  and then to activation of ciliary Smoothened. The SMO receptor activity is
  directly supported in human cells, but the model also attaches the activating
  oxysterol ligand as has_input where the relation should name only SMO's GNAI1
  effector. CYP27A1's human monooxygenase activity and mouse-derived Smoothened
  process inference are represented with the expected inputs and products, but
  the node lacks the mitochondrial location that would make the compartment
  boundary explicit. The HSD11B2 node is the least secure: human HSD11B2 can
  oxidize 7β-hydroxycholesterol to 7-ketocholesterol, but the model asserts the
  activity with the wrong cofactor direction and places it in a human
  Smoothened-signaling context by sequence similarity from mouse.
