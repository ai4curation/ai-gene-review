model: gomodel:696022cd00000056
title: HSD11B2 and CYP27A1 generate oxysterols that activate SMO (Human).
taxon: NCBITaxon:9606
status: COMPLETE
summary: >-
  This compact human Hedgehog-side model links HSD11B2-dependent
  7β-hydroxycholesterol oxidation to CYP27A1-dependent oxysterol synthesis
  and then to activation of ciliary Smoothened. The SMO receptor activity is
  directly supported in human cells, but the model also attaches the activating
  oxysterol ligand as has_input where the relation should name only SMO's GNAI1
  effector. CYP27A1's human monooxygenase activity has the expected 7k-C input
  but hides the specific downstream product behind a generic oxysterol, and the
  node lacks the mitochondrial location that would make the compartment boundary
  explicit. The HSD11B2 node is the least secure:
  HSD11β2-overexpressing human HEK293T cells oxidize 7β-hydroxycholesterol to
  7-ketocholesterol, and UniProt records the same oxidation direction, but the
  model asserts that conversion with a NADP+-dependent term whose cofactor needs
  checking; the Smoothened context is inferred by sequence similarity from
  mouse.
