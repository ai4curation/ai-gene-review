    requested_change: CHECK
    asserted_value: GO:0045880
    cause: CONTEXT_NOT_ASSAYED
    confidence: PROBABLE
    explanation: >-
      The HSD11B2 node asserts human positive regulation of Smoothened signaling
      by sequence similarity from mouse Hsd11b2. The local human HSD11B2 review
      marks this GO:0045880 process as over-annotated: the cached mouse study
      supports mouse Hsd11b2 upstream of CYP27A1-dependent
      Smoothened-activating oxysterols, but the human pathway context is not
      directly assayed. Please check whether direct human evidence supports
      retaining the Smoothened-signaling process on this activity in a human
      GO-CAM.
  - defect_type: WRONG_TERM
    resource: GO_CAM
    record: gomodel:696022cd00000056/696022cd00000144
    slot: molecular_function
    requested_change: CHECK
    asserted_value: GO:0047022
    confidence: PROBABLE
    explanation: >-
      The HSD11B2 node asserts NADP-dependent 7β-hydroxysteroid dehydrogenase
      activity by sequence similarity from mouse Hsd11b2. PMID:30340023 directly
      supports 7β-OHC-to-7k-C conversion by HSD11β2 in human HEK293T cells, but
      it does not establish the NADP+ cofactor specificity on which GO:0047022
      turns. Human HSD11B2 is otherwise an NAD-dependent 11-beta-hydroxysteroid
      dehydrogenase: its experimentally backed UniProt catalytic activities use
      NAD(+), KW NAD and an FT BINDING for NAD(+) are present, and GO already
      maintains NAD+/NADP+ sibling terms for 11-beta-HSD activity
      (GO:0070523/GO:0070524). The one NADPH/NADP+ oxysterol reaction on the
      UniProt record is RHEA:68656 by similarity and runs in the opposite
      physiological direction, 7-oxocholesterol reduction to
      7β-hydroxycholesterol, while the GO-CAM models 7β-OHC oxidation to 7k-C.
      GO-CAM curators should check whether this human oxysterol conversion
      should be re-pointed to an NAD+ sibling term, if one exists, or otherwise
      to a cofactor-agnostic term.
  notes: >-
    This activity carries the exact GO:0047022 and GO:0045880 terms that the
    completed HSD11B2 review marked over-annotated. PMID:30340023 directly
    supports HSD11B2-dependent 7β-OHC oxidation to 7k-C in human HEK293T cells
    and places Hsd11b2 upstream of the CYP27A1 oxysterol relay in mouse
    Ptch1-null fibroblasts, so the node is not a wrong-gene assertion. It is
    still in CONFLICT with the local review because the review judged the
    molecular-function term minor and attached to a non-physiological cofactor,
    and the Smoothened assignment non-core, indirect and not directly shown for
    human HSD11B2. As a follow-up, the HSD11B2 review's ISS GO:0047022 summary
    should be narrowed because it frames the oxysterol conversion as pure
    ortholog transfer even though PMID:30340023 assays the 7β-OHC-to-7k-C
    conversion in human cells. The node also omits an occurs_in value; HSD11B2
    is an ER-membrane enzyme, but the correct location for this disputed
    oxysterol activity should be checked together with the human pathway
    assertion.
