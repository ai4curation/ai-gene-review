  notes: >-
    The GO:0016716 molecular function looks like the wrong donor-specific
    monooxygenase sibling: CYP27A1 reactions use reduced adrenodoxin as electron
    donor, so GO:0016713 fits its EC subclass better, while the specific
    GO:0031073 cholesterol 26-hydroxylase term would name the wrong substrate
    for this 7-ketocholesterol step. The GO:0045880 process matches the
    completed CYP27A1 review's non-core ISS row from mouse Cyp27a1. This is
    therefore RELATED rather than fully CONSISTENT with a core human function:
    the pathway contribution is an ortholog inference from the mouse Ptch1-null
    cell assay plus 7-ketocholesterol conversion in human cells, not a direct
    human Hedgehog-pathway assay. The same donor-class problem also affects the
    GO:0016716 IDA row that the completed CYP27A1 review currently accepts, so
    the UniProt source row needs upstream follow-up rather than a GO-CAM-only
    fix. The same paper also
    reports that CYP27A1 expression in pig LLC-PK1 cells is sufficient to
    activate the Hedgehog transcriptional program, but the construct species is
    again unstated and that assay is not human. The generic CHEBI:53030
    oxysterol output and SMO ligand hide the specific point of the rescue
    assay: 7k,27-OHC and 7β,27-DHC activate the pathway downstream of CYP27A1,
    while 7k-C does not. The SMO CHEBI:87653 small-molecule-activator ADD and
    the CYP27A1 CHEBI:87653 has_output CHECK should move together so the
    receptor activator remains the same molecule emitted by the upstream
    reaction. MISSING_LOCATION is recorded because the model leaves
    the CYP27A1 activity unlocalized even though the completed CYP27A1 review
    accepts GO:0005743 mitochondrial inner membrane and GO:0005759
    mitochondrial matrix.
