      regulates edge from the CYP27A1 GO:0016713 activity to the SMO GO:0004930
      activity so the oxysterol activation step remains explicit rather than
      disconnecting the model. Because CYP27A1 acts at the mitochondrial inner
      membrane while SMO is activated in the non-motile cilium membrane, that
      causal relation should be mediated through the diffusible oxysterol
      product rather than modeled as direct membrane-to-cilium contact.
