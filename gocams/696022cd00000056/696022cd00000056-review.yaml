model: gomodel:696022cd00000056
title: HSD11B2 and CYP27A1 generate oxysterols that activate SMO (Human).
taxon: NCBITaxon:9606
status: COMPLETE
summary: >-
  This compact human Hedgehog-side model links HSD11B2-dependent
  7β-hydroxycholesterol oxidation to CYP27A1-dependent oxysterol synthesis
  and then to activation of ciliary Smoothened. The SMO receptor node is
  directly supported in human cells and cleanly matches the completed SMO gene
  review, but the model also attaches the activating oxysterol ligand as
  has_input where the relation should name only SMO's GNAI1 effector. CYP27A1's
  human monooxygenase activity and mouse-derived Smoothened process inference
  are represented with the expected inputs and products, but the node lacks the
  mitochondrial location that would make the compartment boundary explicit. The
  HSD11B2 node is the least secure: it imports a By-similarity NADP+-dependent
  oxysterol side activity that the local HSD11B2 review marked over-annotated
  for human HSD11B2, so the human model should treat that handoff as a curation
  query rather than as a settled physiological step.
