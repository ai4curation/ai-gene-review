      evidence supports retaining this oxysterol molecular function in the human
      GO-CAM.
  notes: >-
    This activity carries the exact GO:0047022 and GO:0045880 terms that the
    completed HSD11B2 review marked over-annotated. PMID:30340023 supports the
    mouse pathway and UniProt records a human oxysterol side activity, so the
    node is not a wrong-gene assertion. It is still in CONFLICT with the local
    review because the review judged this By-similarity Smoothened assignment
    non-core, indirect and not directly shown for human HSD11B2. The node also
    omits an occurs_in value; HSD11B2 is an ER-membrane enzyme, but the correct
    location for this disputed oxysterol activity should be checked together
    with the human pathway assertion.
