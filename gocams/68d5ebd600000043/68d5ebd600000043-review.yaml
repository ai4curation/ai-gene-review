  notes: >-
    The ligand side is modelled correctly. Receptor ligand activity (GO:0048018) on TAC3 is the
    core molecular function in the TAC3 review, which deliberately keeps the molecular function on
    the ligand and the receptor activity on TACR3. A more specific child, GO:0160041 neuropeptide
    activity, exists; the TAC3 review considered it and kept GO:0048018, so I do not flag a generic
    MF. has_input is the receptor (P29371), and the edge to the receptor activity is directly
    positively regulates (RO:0002629). Both are the GO-CAM convention for a ligand, and the edge
    points the right way, from ligand to receptor. The extracellular region matches the TAC3
    review's core location; the automated 2026-03-12 change from extracellular space to
    extracellular region is in the model comments. The uncertainty is the process. part_of
    GO:0007189 is ECO:0000250 with rat Tac3 (RGD:3809), which matches the human ISS row in QuickGO.
    Rat Tac3 is annotated to GO:0007189 from PMID:1370820, which measured cAMP through rat
    receptors in CHO cells. No human evidence is cited. The TAC3 review keeps GO:0007189 as
    non-core for exactly this reason: shown only for the rodent receptor, and weaker than the Gq
    output. The activity is consistent with the review's core function; the pathway context is the
    review's non-core one. No source defect: an ISS transfer from rat is a legitimate code.
