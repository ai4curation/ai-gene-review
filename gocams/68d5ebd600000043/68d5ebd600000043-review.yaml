  - defect_type: WRONG_REFERENCE
    resource: GO_CAM
    record: gomodel:68d5ebd600000043/68d5ebd600000049
    slot: causal_associations
    requested_change: CHECK
    asserted_value: PMID:22985858
    cause: SPECULATION_AS_ASSERTION
    confidence: PROBABLE
    explanation: >-
      In gomodel:68d5ebd600000043 the NK3R (UniProtKB:P29371) activity directly positively
      regulates (RO:0002629) Gs-alpha (UniProtKB:P63092) G protein activity, and has Gs-alpha
      as has_input. Both rest only on ECO:0000304 from PMID:22985858. The supporting sentence is
      from that paper's introduction and is hedged: "higher doses of NK3R agonists increase cAMP
      formation, suggesting a linkage of NK3R and Gs". The paper's own experiments use a rat
      hypothalamic cell line and do not examine G proteins. The sentence cites its reference 52,
      Nakajima et al. 1992 (PMID:1370820). That study expressed rat tachykinin receptors in CHO
      cells, and GOA annotates it only to rat proteins. It found adenylyl cyclase stimulation
      about tenfold less sensitive than PI hydrolysis and did not identify Gs. Please check
      whether the edge should instead cite the primary study, as ECO:0000250 with rat Tacr3
      (RGD:3810) like this activity's part_of, or a study of the human receptor such as
      PMID:7616392 (agonist-evoked cAMP in CHO cells expressing human NK3R). Neither identifies
      Gs-alpha as the transducer.
    supported_by:
    - reference_id: PMID:22985858
      supporting_text: In addition to PLC, higher doses of NK3R agonists increase cAMP formation,
        suggesting a linkage of NK3R and Gs
    - reference_id: PMID:1370820
      supporting_text: The stimulation of cyclic AMP formation was less efficient than that of PI
        hydrolysis
  notes: >-
    Molecular function, location and edge type are correct. Neuromedin K receptor activity
    (GO:0016498) is the core MF in the TACR3 review, and the plasma membrane is its core location.
    has_input Gs-alpha and a direct positive edge to G protein activity follow the GO-CAM receptor
    pattern, and the edge points from receptor to G protein. The edge from the TAC3 ligand
    activity into this one is also correct. The uncertainty is the Gs branch. part_of GO:0007189
    is ECO:0000250 with rat Tacr3 (RGD:3810), matching the human ISS row from rat P16177 in
    QuickGO; rat Tacr3 is annotated from PMID:1370820. The Gs-alpha edge rests on a hedged
    background statement that traces to the same rat study (source defect above). The TACR3
    review treats GO:0007209 (Gq/PLC) as core and keeps GO:0007189 as non-core. Its notes say cAMP
    was not shown for the human receptor in the papers read. PMID:7616392 shows agonist-evoked
    cAMP accumulation for the human receptor in CHO cells, with an EC50 roughly 25-fold above that
    for inositol phosphate. That supports keeping the pathway non-core rather than removing it. No
    tachykinin-specific adenylate cyclase pathway term exists in GO (GO:0007217 has only the PLC
    child GO:0007209), so GO:0007189 is the right term for this branch. Compartment check:
    extracellular region to plasma membrane is adjacent and plasma membrane to its cytoplasmic
    side is the same compartment; no lead to dismiss.
