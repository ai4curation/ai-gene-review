    asserted_value: RGD:2716
    confidence: SUSPECTED
    explanation: >-
      The occurs_in evidence for the GNAS (UniProtKB:P63092) activity is ECO:0000314 (direct
      assay) from PMID:12135370 with with_objects RGD:2716, which is rat Gnas. A direct-assay
      code does not take a with/from, and the GOA rows that UniProt made from the same paper
      (P63092 is_active_in GO:0009898 IDA, involved_in GO:0007189 IDA) carry none. If the
      experiment was done on rat Gs-alpha, the evidence should be ECO:0000250 with RGD:2716;
      if it was done on human Gs-alpha, the with object should be dropped. The cached abstract
      does not say which species was used. The location itself is sound.
  notes: >-
    The model has the right gene product: P63092 is the Gs-alpha subunit. G protein activity
    (GO:0003925) is the correct molecular function for a heterotrimeric G-alpha subunit, and the
    cytoplasmic side of the plasma membrane is its location. Both cited papers are general
    Gs-alpha biochemistry, not NK3R studies. That is normal for the G-protein node of a receptor
    model; whether NK3R couples to Gs-alpha is a claim of the upstream NK3R edge (see that
    activity). GOA carries the same human IDA rows for both papers (P63092: GO:0003925 and
    GO:0007189 from PMID:10200251; GO:0009898 and GO:0007189 from PMID:12135370); both papers are
    cached as abstracts only, so I defer to the curator on species and assay details. The only
    irregularity is the rat with object on a direct-assay code (suspected defect above). It does
    not affect the claim. Terminal node: adenylyl cyclase is not modelled, so nothing downstream
    connects to the cAMP output named in the process. No consistency check was possible: the
    repository's genes/human/GNAS/ review is of NESP55 (UniProtKB:O95467), a different protein
    from the same locus, and there is no review of Gs-alpha (P63092).
