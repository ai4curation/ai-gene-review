model: gomodel:68d5ebd600000043
title: Neuromedin K (Neurokinin B/NKB) binding to its receptor (TACR3/NK3R) triggers
  adenylate cyclase-activating G protein-coupled receptor signaling pathway (Human)
taxon: NCBITaxon:9606
status: COMPLETE
summary: >-
  A three-step chain. Neurokinin B (TAC3) has receptor ligand activity in the extracellular
  region, takes the receptor NK3R as input and directly positively regulates (RO:0002629) NK3R
  neuromedin K receptor activity at the plasma membrane. NK3R takes Gs-alpha (GNAS) as input and
  directly positively regulates its G protein activity on the cytoplasmic side of the plasma
  membrane. All three activities are placed in the adenylate cyclase-activating G protein-coupled
  receptor signalling pathway (GO:0007189). Adenylyl cyclase itself is not modelled. The
  molecular functions, locations and the direction and type of both causal edges are correct.
  The weakness is the evidence for the Gs branch. No activity in the model cites a study of the
  human receptor and cAMP or Gs. The ligand's and the receptor's membership of the pathway are
  ISS transfers from rat Tac3 (RGD:3809) and rat Tacr3 (RGD:3810), whose own annotations come
  from one study of rat tachykinin receptors expressed in CHO cells (PMID:1370820). The
  receptor-to-Gs-alpha edge and has_input are a traceable author statement (PMID:22985858): an
  introduction sentence in a rat cell-line paper that hedges ("suggesting a linkage of NK3R and
  Gs") and cites that same rat study, which found adenylyl cyclase stimulation about tenfold less
  efficient than PI hydrolysis and did not identify the G protein. A human-receptor study that
  measured agonist-evoked cAMP exists (PMID:7616392) but is not cited, and it does not identify
  Gs either. The model is a reasonable sketch of a secondary output that has been inferred for
  the human receptor. It should not be read as equal in standing to the Gq/phospholipase C model
  gomodel:68d5ebd600000736, which rests on human structural and signalling data.
