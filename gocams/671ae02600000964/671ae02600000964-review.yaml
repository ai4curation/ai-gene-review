model: gomodel:671ae02600000964
title: Release of sequestered calcium ion into cytosol by ITPR2 upon 1D-myo-inositol
  1,4,5-trisphosphate binding (Human)
taxon: NCBITaxon:9606
status: COMPLETE
summary: >-
  A single-activity human IP3-receptor type 2 model: ER-membrane ITPR2 enables
  inositol 1,4,5-trisphosphate-gated calcium channel activity, uses IP3 as a
  small-molecule activator, and transports calcium from the ER lumen to the
  cytoplasm as part of sequestered calcium release.
activity_reviews:
  - activity_id: gomodel:671ae02600000964/671ae02600001008
    gene_product: UniProtKB:Q14571
    molecular_function: GO:0005220
    biological_process: GO:0051209
    cellular_component: GO:0005789
    verdict: OK
    consistency: CONSISTENT
    gene_review: file:human/ITPR2/ITPR2-ai-review.yaml
    supporting_text: >-
      Using cell types expressing predominantly type-1, -2 or -3 InsP(3)
      receptors, we show that InsP(3)-evoked Ca(2+) mobilization from each is
      similarly inhibited by calmodulin
    evidence:
      - source_id: PMID:10620513
        statement: >-
          ITPR2 belongs to the same ER IP3-receptor calcium-release family as
          ITPR1 and ITPR3, and cells expressing predominantly type 2 receptors
          mobilize calcium in response to InsP3.
        supporting_text: >-
          Using cell types expressing predominantly type-1, -2 or -3 InsP(3)
          receptors, we show that InsP(3)-evoked Ca(2+) mobilization from each is
          similarly inhibited by calmodulin
    source_defects:
      - defect_type: WRONG_TERM
        resource: GO_CAM
        record: gomodel:671ae02600000964/671ae02600001008
        slot: part_of
        requested_change: REPOINT
        asserted_value: GO:0051209
        corrected_value: GO:1903514
        corrected_label: release of sequestered calcium ion into cytosol by endoplasmic
          reticulum
        confidence: PROBABLE
        explanation: >-
          The ITPR2 activity releases calcium from the ER lumen to the
          cytoplasm, as shown by the model's input calcium molecule located in
          GO:0005788 and its cytoplasmic output calcium molecule. Because
          GO:1903514 exactly captures ER-to-cytosol release and is used by the
          aligned module, the model's broader GO:0051209 process should be
          refined.
      - defect_type: WRONG_TERM
        resource: GO_CAM
        record: gomodel:671ae02600000964/671ae02600001017
        slot: located_in
        requested_change: REPOINT
        asserted_value: GO:0005737
        corrected_value: GO:0005829
        corrected_label: cytosol
        confidence: PROBABLE
        explanation: >-
          The output calcium molecule is located in GO:0005737 cytoplasm even
          though the activity is typed with GO:0051209 release of sequestered
          calcium ion into cytosol and the aligned module represents the
          product as cytosolic calcium. Repointing the molecule to GO:0005829
          cytosol would make the molecule flow match the process.
      - defect_type: WRONG_EVIDENCE_CODE
        resource: GO_CAM
        record: gomodel:671ae02600000964/671ae02600001008
        slot: evidence
        requested_change: CHECK
        asserted_value: "ECO:0000314 (PMID:35301323, with/from UniProtKB:Q14573)"
        confidence: SUSPECTED
        explanation: >-
          The RO:0012001 IP3-activator edge on this ITPR2 activity carries a
          direct-assay code whose with/from object is ITPR3, a different
          paralog; IDA does not take a with/from, and evidence from ITPR3 would
          call for ISS/ISO. The sibling models are clean: ITPR1 uses ISS with
          RGD:2933 and ITPR3 uses IDA with no with/from. PMID:35301323 is not
          cached and was not read, so this is a query rather than an assertion;
          if the paper assays ITPR2 directly, the fix is to drop only the
          with/from.
    notes: >-
      The model is a one-step slice of the IP3-receptor branch in
      modules/er_calcium_store_cycling.yaml, and its molecular function and
      ER-membrane location match the module's ITPR2 annoton and the first
      core function in the ITPR2 gene review. The cached model asserts
      enabled_by, occurs_in, part_of, and the calcium input/output molecules by
      ISS from mouse MGI:99418; its IP3 activator edge cites uncached
      PMID:35301323 with ITPR3 as a with/from object, but the RO:0012001
      relation correctly represents IP3 as a small-molecule activator rather
      than as transported cargo.
references:
  - id: PMID:10620513
    title: Ca2+-calmodulin inhibits Ca2+ release mediated by type-1, -2 and -3
      inositol trisphosphate receptors.
notes: >-
  Reviewed against modules/er_calcium_store_cycling.yaml. The cached model is a
  one-step slice of that module's IP3 receptor branch, not a standalone ER/SR
  calcium-cycle model; the surrounding module covers the paralog alternatives,
  RYR channels, SERCA re-uptake and optional regulators. The merged ITPR2 gene
  review makes the activity's GO:0005220 ER-membrane calcium-release claim
  consistent with the local core function, while the three source defects above
  record the remaining GO-CAM source-level refinements and evidence query.
