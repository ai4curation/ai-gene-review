    modules/glucagon_receptor_signaling.yaml. The verdict is UNCERTAIN because
    this Gi-specific model adds a direct positive GCGR-to-GNAI1 causal edge
    cited to PMID:28514451, whose GCGR functional assay is cAMP accumulation
    rather than direct Gi activation or inhibition of adenylyl cyclase.
