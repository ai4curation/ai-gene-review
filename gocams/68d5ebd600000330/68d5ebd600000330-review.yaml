        and glucagon-induced cAMP accumulation assays, and it is good support
        for GCGR glucagon receptor activity, but it does not establish a direct
        coupling from GCGR to the Gi-alpha-1 activity represented by
        UniProtKB:P63096. PMID:32193322 is a candidate replacement because the
        same GCGR activity already cites it on the has_input GNAI1 edge, and
        UniProt curates GCGR interaction with GNAI1 from PMID:32193322 and
        PMID:38346960.
      supported_by:
