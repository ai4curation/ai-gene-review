    extracellular activity is aligned with the same ligand annoton in
    modules/glucagon_receptor_signaling.yaml. The local cache lacks the three
    PMIDs attached to the GO-CAM peptide node, including the GCGR Gs/Gi
    structural paper PMID:32193322, so this activity was checked against the
    completed local GCG review and its UniProt source text.
