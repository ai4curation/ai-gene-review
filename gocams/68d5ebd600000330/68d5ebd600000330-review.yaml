model: gomodel:68d5ebd600000330
title: GCGR-mediated signaling via G-alpha-i (inhibitory), inhibiting adenylate cyclase
  following activation by glucagon  (Human)
taxon: NCBITaxon:9606
status: COMPLETE
summary: >-
  A compact human glucagon-to-Gi model: the extracellular glucagon peptide
  directly activates GCGR at the plasma membrane, and the active receptor
  directly activates GNAI1 on the cytoplasmic side of the plasma membrane. The
  peptide node is correct and matches the mature glucagon chain in the local GCG
  review. The GCGR node carries the right glucagon receptor activity and plasma
  membrane location, but it is placed in the Gs/cyclase-activating GPCR process
  instead of the Gi/cyclase-inhibiting process and its model-specific causal
  edge to GNAI1 is cited to a GCGR structure/cAMP paper that does not establish
  Gi coupling. GNAI1 is typed correctly as a Gi G-protein activity in the
  cyclase-inhibiting GPCR arm, but the model stops at GNAI1 and never represents
  the adenylyl cyclase inhibition named in its title.
