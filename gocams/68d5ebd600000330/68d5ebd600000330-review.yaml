  notes: >-
    GCGR glucagon receptor activity and plasma-membrane location match the
    reviewed GCGR core function. The reviewed GCGR file covers the
    Gs/adenylate-cyclase-activating route and the module keeps this Gi arm
    outside its local Gs boundary, so the Gi process assertion is marked
    NOT_IN_REVIEW and flagged as the wrong part_of term for this activity
    instance. The direct positive GCGR-to-GNAI1 causal edge is structurally
    supported by a later GCGR-Gi paper already cited on the model's has_input
    edge, but it is attached here to PMID:28514451, whose GCGR functional assay
    is cAMP accumulation rather than direct Gi activation or inhibition of
    adenylyl cyclase. The local GCGR review should be extended later to cover
    this GCGR-Gi structural evidence.
