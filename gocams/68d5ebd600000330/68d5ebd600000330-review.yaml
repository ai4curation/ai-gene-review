      resource: GO_CAM
      record: gomodel:68d5ebd600000330/68d5ebd600000362
      slot: causal_associations
      requested_change: ADD
      asserted_value: gomodel:68d5ebd600000330/68d5ebd600000362
      confidence: PROBABLE
      explanation: >-
        The model title names adenylyl cyclase inhibition through G-alpha-i,
        and the GNAI1 activity is part_of the
        adenylate-cyclase-inhibiting GPCR pathway, but the GNAI1 node is
        terminal. Please add a downstream adenylyl cyclase activity and the
        negative causal edge from this Gi-alpha-1 activity that represents the
        inhibition named by the model.
  notes: >-
    GNAI1's GO:0003925 G protein activity and GO:0007193
    adenylate-cyclase-inhibiting GPCR signalling process match the local GNAI1
    review. The cytoplasmic side of the plasma membrane is also a reviewed
    GNAI1 location and is the right side of the membrane for receptor-coupled
    Gi signalling. The node's own PMID:16204467 direct-assay source is an EP4
    prostanoid-receptor paper that supports generic Gi coupling rather than
    GCGR-specific coupling. The node has no downstream molecular or causal edge,
    so the model never states which adenylyl cyclase Gi inhibits despite making
    that inhibitory output explicit in the model title.
notes: >-
  This review leaves modules/glucagon_receptor_signaling.yaml unchanged. The
  module already declares gomodel:68d5ebd600000330 as a second human GCGR model
  with a Gi-coupled arm and explains that the Gi arm is outside the module
  boundary, which is otherwise limited to the glucagon-to-Gs-to-adenylyl
  cyclase route. `just gocam-lint` reported only the lack of a curator
  narrative, and `just gocam-compartments` found all three activities resolved
  with same or adjacent compartments.
