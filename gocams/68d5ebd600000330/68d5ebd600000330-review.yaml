      explanation: >-
        The model cites PMID:28514451 for the GCGR-to-GNAI1 direct positive
        causal edge. That paper supports full-length GCGR structure-function
        and glucagon-induced cAMP accumulation assays, and it is good support
        for GCGR glucagon receptor activity, but it does not establish a direct
        coupling from GCGR to the Gi-alpha-1 activity represented by
        UniProtKB:P63096. If a GCGR-to-GNAI1 edge is intended, the edge needs a
        Gi-specific source; otherwise this causal edge should be deleted.
