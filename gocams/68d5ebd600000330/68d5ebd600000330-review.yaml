    - source_id: PMID:16204467
      statement: >-
        EP4 receptor experiments support receptor-coupled Gi suppression of cAMP
        signalling in a generic prostanoid context.
      supporting_text: >-
        the EP(4) prostanoid receptor subtype, but not the EP(2), couples to a
        PTX-sensitive inhibitory G-protein (Galpha(i)) that can inhibit
        cAMP-dependent signaling
