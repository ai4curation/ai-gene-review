    confidence: SUSPECTED
    explanation: The GRIN1 activity, with glycine (CHEBI:15428) as small-molecule activator (RO:0012001), directly
      positively regulates (RO:0002629) the complex-level channel activity. For GluN1/GluN3 receptors PMID:26777280
      reports that glycine binding to GluN3 triggers opening whereas glycine binding to GluN1 causes auto-inhibition,
      and PMID:17047094 reports that agonist binding to NR3 alone is sufficient for activation. Please check whether
      glycine should be an activator of the GluN1 activity here and whether this edge should be positive.
  notes: 'The activity term matches the third core function in the GRIN1 review (glycine-gated cation channel activity
    with GluN3 partners). The sign of the regulation is doubtful: the model attaches glycine to GluN1 as a small-molecule
    activator and has this activity directly positively regulate the complex activity, but in GluN1/GluN3 receptors
    glycine at GluN3 opens the channel while glycine at GluN1 reduces the current, and GluN3 occupancy alone is
    sufficient. Both cited papers are cached as abstracts only, so this is recorded as a suspected defect.'
