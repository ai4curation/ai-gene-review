model: gomodel:66c7d41500001953
title: glycine-gated cation channel activity involving GRIN1 and GRIN3A (Human)
taxon: NCBITaxon:9606
status: COMPLETE
summary: 'GluN1 (GRIN1) and GluN3A (GRIN3A) each carry glycine-gated cation channel activity at the postsynaptic
  membrane, each activated by glycine. The two subunit activities each "directly positively regulate" (RO:0002629)
  a third activity enabled by the complex term. The ligand each subunit senses is attached to that subunit as a
  small-molecule activator (RO:0012001), and ion flux (has input / has output) sits on the complex activity. Here
  the complex is the general neurotransmitter receptor complex and its activity is the general transmitter-gated
  monoatomic ion channel activity, less specific than the glycine-gated term on its own subunits. Nearly all evidence
  is transferred from rat, although direct human evidence exists: PMID:38598639 (structure and function of human
  GluN1-3A) is cited only on the causal edges. The activity terms agree with the GRIN1 review. One point is doubtful:
  glycine is drawn as an activator of GluN1 with a positive edge to the channel, whereas published work reports
  that glycine at GluN3 opens these receptors and glycine at GluN1 reduces the current (PMID:26777280).'
