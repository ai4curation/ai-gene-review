    separate GNAQ from GNA11, so GNAQ represents the Gq family; the paper says the Gαq family.
    The location is the plasma membrane, but the cited paper says the cytoplasmic face, the GNAQ
    review refines its plasma membrane rows to GO:0009898, and the sister Gs model puts Gs-alpha
    there. GO:0009898 would be more precise and consistent. Phospholipase C-beta is not modelled.
