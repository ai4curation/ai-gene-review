model: gomodel:68d5ebd600000736
title: 'Neuromedin K (Neurokinin B/NKB) binding to its receptor (TACR3/NK3R) triggers
  phospholipase C-activating G protein-coupled receptor signaling pathway (Human) '
taxon: NCBITaxon:9606
status: COMPLETE
summary: >-
  A three-step chain. Neurokinin B (TAC3) has receptor ligand activity in the extracellular
  region, takes NK3R as input and directly positively regulates (RO:0002629) NK3R neuromedin K
  receptor activity at the plasma membrane. NK3R takes Gq-alpha (GNAQ) as input and directly
  positively regulates its G protein activity at the plasma membrane. All three are part of the
  phospholipase C-activating tachykinin receptor signalling pathway (GO:0007209), which is more
  specific than the pathway named in the title. Phospholipase C-beta is not modelled. Molecular
  functions, locations, has_input fillers and both edges are correct and point the right way.
  The ligand, receptor and receptor-to-Gq claims rest on a study of the human receptor
  (PMID:37391393): cryo-EM structures of NK3R with Gq bound to NKB, plus IP-one assays. This
  model agrees with the TAC3, TACR3 and GNAQ reviews. Two small caveats: the structure used an
  engineered Gq chimera and the IP-one assay does not separate Gq from G11, so GNAQ stands for the
  Gq family; and GNAQ is placed in the plasma membrane where its own evidence and the GNAQ review
  support the cytoplasmic side.
