model: gomodel:66e382fb00000049
title: NMDA glutamate receptor activity co-activated by D-serine and involving GRIN1 and GRIN2A (Human)
taxon: NCBITaxon:9606
status: COMPLETE
summary: Same receptor as model 6690711d00000596 (GluN1 with GluN2A) but with D-serine, not glycine, as the GluN1
  co-agonist. The two subunit activities each "directly positively regulate" (RO:0002629) a third activity enabled
  by the complex term. The ligand each subunit senses is attached to that subunit as a small-molecule activator
  (RO:0012001), and ion flux (has input / has output) sits on the complex activity. The two subunit activities are
  supported only by transfer from mouse (ECO:0000250), although the same curator cites direct human evidence for
  them in the glycine model; D-serine as activator of GluN1 is also by transfer. The structure and terms are correct
  and agree with the GRIN1 review.
