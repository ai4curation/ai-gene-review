  - source_id: PMID:12805203
    statement: GluN1 forms the glycine site, GluN2 the glutamate site.
    supporting_text: NMDA receptors require both glycine and glutamate for activation with NR1 and NR2 forming glycine
      and glutamate sites, respectively
  supporting_text: Potentiation was observed with recombinant triheteromeric GluN1/GluN2A/GluN2B NMDARs and with
    synaptically activated NMDARs in brain slices
  notes: Matches the first core function in the GRIN1 review (NMDA glutamate receptor activity as a contributing
    subunit, postsynaptic membrane, cation transport). The co-agonist is attached to GluN1 and glutamate to the
    GluN2 subunit, which agrees with the review and with its removal of the GOA glutamate binding row on GRIN1.
    D-serine as the GluN1 activator and the function itself are supported here only by transfer from mouse (ECO:0000250);
    the GRIN1 review did not check D-serine against a primary paper.
