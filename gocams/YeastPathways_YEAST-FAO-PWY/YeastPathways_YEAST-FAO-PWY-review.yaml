model: gomodel:YeastPathways_YEAST-FAO-PWY
title: 'fatty acid oxidation pathway - imported from: Saccharomyces Genome Database'
taxon: NCBITaxon:559292
status: COMPLETE
summary: >-
  An automatic import of the YeastPathways pathway YEAST-FAO-PWY, fatty acid oxidation. Eleven
  activities cover fatty acid activation (five alternative acyl-CoA synthetases: FAA1, FAA2,
  FAA3, FAA4, FAT1 on one node), acyl-CoA oxidation by POX1, enoyl-CoA isomerisation (ECI1
  and DCI1 on one node), hydration and dehydrogenation by FOX2, and thiolysis by POT1. Steps
  are linked only by shared metabolites. Every activity is ECO:0000245 / GO_REF:0000123 from
  the pathway database, part_of GO:0019395 fatty acid oxidation, and occurs_in cytosol. The
  pathway's chemistry and most enzyme assignments are right; its location is not. Yeast beta-oxidation
  is peroxisomal, and every gene review rejects the cytosol row for its gene: REMOVE for the
  peroxisomal enzymes (POX1, FAA2, FAT1, DCI1, ECI1, FOX2, POT1) and MARK_AS_OVER_ANNOTATED
  for the membrane-bound activators (FAA1, FAA3, FAA4). Both yeast metabolic models put the
  POX1, FOX2, ECI1, DCI1 and POT1 reactions in the peroxisome. Three activities are wrong
  beyond location. FOX2 is drawn with (S)-specific chemistry in both its steps, the same error
  as in GO-CAM YeastPathways_PWY-5177. DCI1 is given ECI1's delta3-delta2 isomerase reaction,
  while it is the delta(3,5)-delta(2,4)-dienoyl-CoA isomerase; yeast-GEM gets this right and
  iMM904 repeats the error. FAT1 is typed with the long-chain ligase where its role here is
  very-long-chain. FAA3's place in the pathway is itself doubtful.
