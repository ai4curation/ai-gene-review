notes: >-
  Structural checks: just gocam-lint reported no findings and just gocam-compartments resolved
  all 11 locations. Verdict convention used here: a correct molecular function whose only
  defect is the location (or a doubtful process context) is UNCERTAIN, with the location carried
  by a source defect; WRONG is used where the molecular function or its metabolites are wrong.
  Location defects for enzymes whose gene review gives peroxisomal matrix as the core location
  are REPOINTed to GO:0005782; FOX2 and FAA2 to GO:0005777 peroxisome, following their reviews;
  FAT1 to GO:0005778 peroxisomal membrane. For FAA1, FAA3 and FAA4 the request is CHECK, because
  their reviews mark cytosol over-annotated rather than wrong and they share one node with
  peroxisomal enablers. Process: part_of GO:0019395 fatty acid oxidation is true for all but
  FAA3. The gene reviews treat the same general term inconsistently: POX1 and POT1 MODIFY
  it to fatty acid beta-oxidation (or its acyl-CoA oxidase child), while FOX2, ECI1, DCI1
  and FAA2 ACCEPT it as the correct parent. Under the 2026-11-14 ruling a correct but general
  term is MODIFY, so the ACCEPTs are the outliers; that is a gene-review follow-up, not a
  GO-CAM defect, and no process defect is raised except for FAA3. Scope: the model omits the
  2,4-dienoyl-CoA reductase step (SPS19) that the DCI1 di-isomerase feeds and the Pxa1/Pxa2
  acyl-CoA import that connects the membrane-bound Faa1/Faa4 activation to peroxisomal oxidation.
  The GEM comparison (gem_compartments.py, output gem_compartments.md) checks gene placement,
  compartments and EC numbers only; it is not an FBA run.
