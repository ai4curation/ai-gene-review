  notes: >-
    No local SMDT1 gene review exists, so consistency is recorded as
    NO_GENE_REVIEW. The GO-CAM's GO:0030674 protein-macromolecule adaptor
    activity is coherent for the auxiliary EMRE subunit that couples MCU to the
    MICU gatekeepers. The aligned module uses GO:0099103 channel activator
    activity to name EMRE's essential pore-opening effect, but it also records
    the GO-CAM adaptor term as an experimentally grounded alternative. The
    has_input fillers, MICU1 and MCU, are the proteins EMRE adapts rather than
    transported cargo or upstream ligands, so they are not HAS_INPUT_MISUSE. The
    SMDT1-to-MICU1 positive edge summarizes the same direct bridging/retention
    role supported by the PMID:24231807 and PMID:27099988 EMRE-MICU interaction
    data, not a separate Ca2+ flux step.
