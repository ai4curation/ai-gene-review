  consistency: NO_GENE_REVIEW
  supporting_text: >-
    Both MICU1 and MICU2 are regulated by calcium through their EF-hand domains,
    thus accounting for the sigmoidal response of MCU to [Ca(2+)] in situ and
    allowing tight physiological control
  evidence:
  - source_id: PMID:24560927
    statement: >-
      MICU2 is an EF-hand calcium-regulated partner of MICU1 that tunes MCU
      channel opening.
    supporting_text: >-
      Both MICU1 and MICU2 are regulated by calcium through their EF-hand
      domains, thus accounting for the sigmoidal response of MCU to [Ca(2+)] in
      situ and allowing tight physiological control
  - source_id: PMID:32494073
    statement: MICU2 is one of the two gatekeeper proteins in the core human uniplex.
    supporting_text: >-
      In mammals, the uniporter complex (uniplex) contains four core components:
      the pore-forming MCU protein, the gatekeepers MICU1 and MICU2, and an
      auxiliary subunit, EMRE, essential for Ca2+ transport
  notes: >-
    No local MICU2 gene review exists, so consistency is recorded as
    NO_GENE_REVIEW. The calcium ion sensor function and nested calcium-import
    context match the mitochondrial_calcium_uniporter module's MICU2 annoton.
    The model's inner-membrane location substitutes the uniplex membrane for
    the module's intermembrane-space sensor face, where the EF-hands sense
    calcium. MICU2 has the opposite sign from MICU1 at resting calcium: the
    cited PMID:24560927 paper shows MICU2 inhibits MCU at low calcium. The
    positive MICU2-to-MCU edge is still recorded as OK here because this GO-CAM
    represents the high-calcium, Ca2+-activated opening state of the
    MICU1-MICU2 dimer that the module documents, and does not attempt to model
    the low-calcium inhibitory branch.
