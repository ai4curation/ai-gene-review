    confidence: CONFIRMED
    explanation: >-
      The evidence list for the MCU activity's part_of GO:0036444 assertion
      cites PMID:22925203, which is Tsai et al. 2012 on mouse Pde8b in memory,
      motor performance and aging. That paper is unrelated to MCU or
      mitochondrial calcium import. The GO:0036444 assertion itself is supported
      by the remaining PMID:23755363 IMP evidence and the direct human uniporter
      evidence on the same activity, so only the spurious PMID:22925203
      reference should be removed from this assertion.
  notes: >-
    MCU is the correctly typed inner-membrane calcium-channel activity that
    moves calcium from the intermembrane space to the matrix. This is the same
    pore-forming core function captured by the local MCU gene review and the
    matching MCU annoton in modules/mitochondrial_calcium_uniporter.yaml.
    has_input/has_output correctly name the transported calcium in the
    intermembrane space and matrix, and the activity is the common target of the
    MICU1-MICU2 gatekeeping edges rather than an orphan.
