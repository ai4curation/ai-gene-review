  - source_id: PMID:24231807
    statement: >-
      EMRE is required for uniporter current and bridges MCU to MICU1-MICU2.
    supporting_text: >-
      EMRE was required for the interaction of MCU with MICU1 and MICU2. Hence,
      EMRE is essential for in vivo uniporter current and additionally bridges
      the calcium-sensing role of MICU1 and MICU2 with the calcium-conducting
      role of MCU.
  - source_id: PMID:27099988
    statement: >-
      EMRE couples MCU permeation to tight MICU regulation through its MCU
      transmembrane contact and MICU1-binding tail.
    supporting_text: >-
      This dual functionality of EMRE ensures that all transport-competent
      uniporters are tightly regulated, responding appropriately to a dynamic
      intracellular Ca(2+) landscape.
