model: gomodel:65d7e4ac00001363
title: Mitochondrial calcium uptake by the uniplex complex composed of SMDT1/EMRE,
  MICU1, MICU2 and MCU (Human).
taxon: NCBITaxon:9606
status: COMPLETE
summary: >-
  This human model captures the core mitochondrial calcium uniporter pore and
  MICU1-MICU2 gatekeeping branch. MCU is the inner-membrane calcium channel;
  SMDT1/EMRE binds the pore and MICU gatekeepers as an auxiliary adaptor; and
  MICU1-MICU2 are calcium sensors that switch the pore between low-calcium
  inhibition and calcium-activated opening. The model records that activated
  gatekeeper state with positive edges to MCU. The four activities are already
  pinned to matching annotons in
  modules/mitochondrial_calcium_uniporter.yaml, and the model has no unresolved
  compartment or skipped-compartment causal leads.
