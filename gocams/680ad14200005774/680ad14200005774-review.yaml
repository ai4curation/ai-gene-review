  source_defects:
  - defect_type: WRONG_REFERENCE
    resource: GO_CAM
    record: gomodel:680ad14200005774/680ad14200005775
    slot: causal_associations
    requested_change: CHECK
    asserted_value: PMID:37963465
    cause: UNKNOWN
    confidence: SUSPECTED
    explanation: >-
      The direct ADRB2-to-GNAS causal edge cites PMID:37963465. PubMed resolves
      that identifier to a TAAR1 structure/signaling paper, not a beta-2
      adrenergic receptor paper. The same PMID is cited on receptor-to-G-protein
      causal edges in 84 cached GO-CAM models, including TAAR1, VIPR1, DRD1,
      ADRB3, CALCR, ADRB1 and ADRB2 models, so this appears to be systematic
      reuse of a TAAR1 reference rather than a one-model typo. The edge itself
      is biologically sound: ADRB2 acts immediately upstream of Gs alpha, and
      PMID:2831218, already cited on the ADRB2 activity, supports Gs coupling
      and adenylate cyclase stimulation by the human beta-2 adrenergic receptor.
      Check whether this batch of receptor-to-G-protein edges should keep
      PMID:37963465 only on TAAR1 models or should be re-evidenced from
      receptor-specific sources.
    supported_by:
    - reference_id: PMID:2831218
      supporting_text: >-
        associated with high affinity ligand binding, Gs coupling, and
        adenylate cyclase stimulation.
  - defect_type: WRONG_REFERENCE
    resource: GO_CAM
    record: gomodel:680ad14200005774/680ad14200005775
    slot: molecular_associations
    requested_change: CHECK
    asserted_value: PMID:12391161
    cause: UNKNOWN
    confidence: SUSPECTED
    explanation: >-
      The activity's (R)-adrenaline activator assertion cites PMID:12391161.
      That paper uses isoproterenol-stimulated beta-2 adrenergic receptor as a
      control for beta-1 receptor/CNrasGEF-dependent Ras activation, so it is
      only weak support for a direct epinephrine has-small-molecule-activator
      edge: it tested the nonselective beta agonist isoproterenol, not the
      modelled CHEBI:71406 (R)-adrenaline ligand. PMID:2831218, already cited
      on this activity, is a better candidate reference because it directly
      covers epinephrine affinity of the human beta-2 adrenergic receptor.
    supported_by:
    - reference_id: PMID:2831218
      supporting_text: >-
        reduction in its affinity for isoproterenol, epinephrine, and
        norepinephrine
  - defect_type: WRONG_STATEMENT
    resource: GO_CAM
    record: gomodel:680ad14200005774/680ad14200005775
    slot: part_of
    requested_change: DELETE_VALUE
    asserted_value: GO:0106134 part_of GO:0010666
    confidence: PROBABLE
    explanation: >-
      The nested part_of chain makes positive regulation of cardiac muscle cell
      contraction (GO:0106134) a part of positive regulation of cardiac muscle
      cell apoptotic process (GO:0010666). The local ADRB2 review keeps both
      cardiac outputs as non-core, tissue-specific ADRB2 signaling outputs, but
      contraction is not itself part of apoptosis. Please delete the nested
      apoptosis tier from the contraction assertion, or remodel the cardiac
      processes as separate ADRB2 outputs if both were intended.
  notes: >-
    The ADRB2 review accepts beta2-adrenergic receptor activity (GO:0004941) at
    the plasma membrane and accepts the adenylate cyclase-activating
    adrenergic receptor signaling pathway as a direct process, so the GO-CAM
    molecular function, location and top-level process match the local gene
    review. The model also uses GNAS as the receptor has_input, epinephrine as
    the chemical input and a direct positive ADRB2-to-GNAS edge, which are the
    expected GO-CAM assertions for a Gs-coupled receptor activity. The cited
    PMID on the causal edge is unrelated, however, and the PMID on the
    epinephrine activator assertion is weaker than the beta-2 receptor
    mutagenesis paper already cited on this activity. ADRB2's nested orthology
    inferences to positive regulation of cardiomyocyte contraction and apoptosis
    are plausible, non-core, tissue-specific outputs, but the contraction term
    is wrongly nested under the apoptosis term. These citation and process
    nesting issues are recorded as source defects above.
