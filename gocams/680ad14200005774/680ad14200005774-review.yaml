    explanation: >-
      The direct ADRB2-to-GNAS causal edge cites PMID:37963465. PubMed resolves
      that identifier to a TAAR1 structure/signaling paper, not a beta-2
      adrenergic receptor paper. The edge itself is biologically sound: ADRB2
      acts immediately upstream of Gs alpha, and PMID:2831218, already cited on
      the ADRB2 activity, supports Gs coupling and adenylate cyclase
      stimulation by the human beta-2 adrenergic receptor. Check whether the
      edge should be keyed to an adrenaline/isoproterenol beta-2 receptor
      reference, to PMID:2831218, or to the uncached PMID:17916776 evidence
      already cited on the ADCY6 assertions.
