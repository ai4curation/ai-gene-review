  - defect_type: WRONG_REFERENCE
    resource: GO_CAM
    record: gomodel:680ad14200005774/680ad14200005775
    slot: molecular_associations
    requested_change: CHECK
    asserted_value: PMID:12391161
    corrected_value: PMID:2831218
    cause: UNKNOWN
    confidence: SUSPECTED
    explanation: >-
      The activity's (R)-adrenaline activator assertion cites PMID:12391161.
      That paper uses isoproterenol-stimulated beta-2 adrenergic receptor as a
      control for beta-1 receptor/CNrasGEF-dependent Ras activation, so it is
      weak support for a direct epinephrine has-small-molecule-activator edge.
      PMID:2831218, which is already cited on this activity, directly covers
      epinephrine affinity of the human beta-2 adrenergic receptor and is a
      better candidate reference for this association.
    supported_by:
    - reference_id: PMID:2831218
      supporting_text: >-
        reduction in its affinity for isoproterenol, epinephrine, and
        norepinephrine
  notes: >-
    The ADRB2 review accepts beta2-adrenergic receptor activity (GO:0004941) at
    the plasma membrane and accepts the adenylate cyclase-activating
    adrenergic receptor signaling pathway as a direct process, so the GO-CAM
    molecular function, location and top-level process match the local gene
    review. The model also uses GNAS as the receptor has_input, epinephrine as
    the chemical input and a direct positive ADRB2-to-GNAS edge, which are the
    expected GO-CAM assertions for a Gs-coupled receptor activity. The cited
    PMID on the causal edge is unrelated, however, and the PMID on the
    epinephrine activator assertion is weaker than the beta-2 receptor
    mutagenesis paper already cited on this activity; both citation issues are
    recorded as source defects above. ADRB2's nested part_of chain to
    cardiomyocyte contraction and cardiac-muscle-cell apoptosis is inferred by
    orthology and was not evaluated here.
- activity_id: gomodel:680ad14200005774/680ad14200005779
  gene_product: UniProtKB:O43306
  molecular_function: GO:0004016
  biological_process: GO:0007189
  cellular_component: null
  verdict: UNCERTAIN
  qc_flags:
  - MISSING_LOCATION
  consistency: NO_GENE_REVIEW
  supporting_text: >-
    Gbetagamma subunits enhance the activity of these enzymes provided either
    Galpha(s) or forskolin is present.
  evidence:
  - source_id: PMID:17110384
    statement: >-
      Human ADCY6 activity is stimulated by G alpha s together with G beta-gamma
      in reconstituted and intact-cell beta-adrenergic assays.
    supporting_text: >-
      Gbetagamma subunits enhance the activity of these enzymes provided either
      Galpha(s) or forskolin is present.
  notes: >-
    GO:0004016 adenylate cyclase activity and cAMP output correctly represent
    ADCY6 as the effector of Gs in this branch. The source model omits
    occurs_in, so the activity cannot yet be placed at the plasma membrane
    alongside GNAS. The biochemical context is otherwise plausible:
    PMID:17110384 shows that G beta-gamma conditionally stimulates human ACVI
    when G alpha s or forskolin is also present, and that endogenous
    G beta-gamma contributes to isoproterenol-induced cAMP production in cells
    overexpressing hACVI. The source model's direct-assay support for ADCY6
    enabled_by and cAMP molecular output also cites PMID:17916776, which is not
    cached locally and remains unverified here, and PMID:23842570, an
    abstract-only D1/EP1 receptor study whose abstract reports that AC6
    depletion reduced D1-induced cAMP production. There is no ADCY6 review in
    genes/human yet.
notes: >-
  Alignment with modules/beta_adrenergic_signaling.yaml: the concrete
  beta-adrenergic module already pins this GO-CAM's ADRB2 and GNAS activities
  to its beta-2 receptor and Gs activation annotons. The ADCY6 activity is
  covered by the module's reference to the reusable
  modules/gpcr_camp_pka_signaling.yaml adenylyl-cyclase tier rather than
  repeated as a beta-adrenergic annoton. No module change is needed for this
  compact three-activity model.
