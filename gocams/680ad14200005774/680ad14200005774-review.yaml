model: gomodel:680ad14200005774
title: Signaling by adrenaline mediated by ADRB2 receptor via  G-alpha-s (activatory)_Cardiomyocyte
  contraction (Human)
taxon: NCBITaxon:9606
status: COMPLETE
summary: >-
  A compact beta-2 adrenergic Gs model: epinephrine activates the plasma-membrane
  beta-2 adrenergic receptor, ADRB2 directly activates GNAS/Gs alpha on the
  cytoplasmic side of the plasma membrane, and active GNAS directly stimulates
  ADCY6 adenylate cyclase activity to produce cAMP in the
  adenylate-cyclase-activating GPCR signaling pathway. The molecular-function
  typing, receptor has_input, GNAS location and GNAS-to-ADCY6 edge are
  structurally sound. ADRB2 and ADCY6 are consistent with completed local gene
  reviews. The GNAS/Gs-alpha product has no matching local gene review; the
  local GNAS review covers NESP55 rather than P63092. The main local model
  issues are the missing ADCY6 occurs_in value, systematic reuse of a TAAR1
  PMID on the ADRB2-to-GNAS edge, a weak PMID attached to the epinephrine
  activator assertion and a nested cardiac process edge that makes contraction
  part of apoptosis.
