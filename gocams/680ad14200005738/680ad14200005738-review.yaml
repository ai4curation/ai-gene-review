  gene_review: file:human/GNAI1/GNAI1-ai-review.yaml
  supporting_text: >-
    Types V and VI adenylyl cyclase are most sensitive to inhibition by Gi
    alpha 1, Gi alpha 2, and Gi alpha 3
  evidence:
  - source_id: PMID:8119955
    statement: >-
      G alpha i1 directly inhibits type V and VI adenylyl cyclases in
      reconstituted assays.
    supporting_text: >-
      Types V and VI adenylyl cyclase are most sensitive to inhibition by Gi
      alpha 1, Gi alpha 2, and Gi alpha 3
  - source_id: PMID:17635935
    statement: >-
      G alpha i1 localizes to the plasma membrane and cytoplasm.
    supporting_text: >-
      A YFP fusion protein of Giα1 localized at the plasma membrane and
      cytoplasm
  notes: >-
    GO:0003925 G protein activity on the cytoplasmic side of the plasma
    membrane correctly represents GNAI1 in its receptor-coupled G protein
    switch role, and the local GNAI1 review accepts both this activity and
    GO:0007193 for the cyclase-inhibiting signaling branch. The source model's
    PMID:33762731 enabled_by and PMID:34239069 part_of references are 5-HT
    receptor/Gi structure papers where GNAI1 is a modeled G-protein component.
    The direct negative edge to ADCY6 is also directionally and mechanistically
    correct for active G alpha i1 inhibiting type VI adenylyl cyclase, and its
    GO_REF:0000024 with/from UniProtKB:P30804, dog ADCY6, reads as a
    cyclase-side orthology donor because the same model uses P30804 on ADCY6's
    own GO:0007193 part_of assertion.
