model: gomodel:680ad14200005738
title: >-
  Signaling by adrenaline mediated by ADRB2 receptor via G-alpha-i
  (inhibitory)_Cardioprotection (Human)
taxon: NCBITaxon:9606
status: COMPLETE
summary: >-
  A compact beta-2 adrenergic Gi model: adrenaline activates the plasma-membrane
  ADRB2 receptor, ADRB2 directly activates GNAI1/G alpha i on the cytoplasmic
  side of the plasma membrane, and active GNAI1 directly inhibits ADCY6 adenylate
  cyclase activity in the adenylate-cyclase-inhibiting GPCR signaling pathway.
  The molecular-function typing, receptor has_input and GNAI1 location are
  structurally sound, and ADRB2 and GNAI1 are consistent with their completed
  local gene reviews. The main local model issues are the missing ADCY6
  occurs_in value and reuse of PMID:37963465, a TAAR1 paper, on both ADRB2
  input/causal assertions.
activity_reviews:
