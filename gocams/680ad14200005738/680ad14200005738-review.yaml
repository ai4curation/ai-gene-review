  - MISSING_LOCATION
  consistency: NO_GENE_REVIEW
  supporting_text: >-
    depletion of AC6, another AC isoform, reduced cAMP production induced by D1
    stimulation alone
  evidence:
  - source_id: PMID:23842570
    statement: >-
      ADCY6/AC6 contributes to G protein-coupled receptor-stimulated cAMP
      production in HEK293T cells.
    supporting_text: >-
      depletion of AC6, another AC isoform, reduced cAMP production induced by
      D1 stimulation alone
  notes: >-
    GO:0004016 adenylate cyclase activity and cAMP output correctly represent
    ADCY6 as the effector inhibited by GNAI1 in this branch. The source model
    omits occurs_in, so the activity cannot yet be placed at the plasma membrane
    alongside GNAI1. The direct-assay support for ADCY6 enabled_by and cAMP
    molecular output also cites PMID:17916776, which is not cached locally and
    remains unverified here, and PMID:23842570, an abstract-only D1/EP1 receptor
    study whose abstract reports that AC6 depletion reduced D1-induced cAMP
    production. There is no ADCY6 review in genes/human yet.
notes: >-
  Alignment with modules/beta_adrenergic_signaling.yaml: the concrete
  beta-adrenergic module already links this GO-CAM's ADRB2 activity to its
  PKA-dependent ADRB2/Gi-switch annoton. The model's GNAI1/ADCY6 downstream arm
  is covered in the beta-adrenergic module by the optional Gi-switch notes and
  by delegation to modules/gpcr_camp_pka_signaling.yaml, so no module change is
  needed for this three-activity model.
