    resource: GO_CAM
    record: gomodel:680ad14200005738/680ad14200005739
    slot: molecular_associations
    requested_change: CHECK
    asserted_value: PMID:37963465
    cause: UNKNOWN
    confidence: SUSPECTED
    explanation: >-
      The activity's (R)-adrenaline activator assertion cites PMID:37963465.
      PubMed resolves that identifier to a TAAR1 structure/signaling paper, not
      a beta-2 adrenergic receptor paper. The same PMID is cited on
      receptor-to-G-protein causal edges in many cached GO-CAM models, including
      TAAR1, VIPR1, DRD1, ADRB3, CALCR, ADRB1 and ADRB2 models, so this appears
      to be systematic reuse of a TAAR1 reference rather than a one-model typo.
      The epinephrine activator edge itself is biologically sound for ADRB2, but
      should be re-evidenced from a receptor-specific source.
    supported_by:
    - reference_id: PMID:2831218
      supporting_text: >-
        reduction in its affinity for isoproterenol, epinephrine, and
        norepinephrine
  - defect_type: WRONG_REFERENCE
    resource: GO_CAM
    record: gomodel:680ad14200005738/680ad14200005739
    slot: causal_associations
    requested_change: CHECK
    asserted_value: PMID:37963465
    cause: UNKNOWN
    confidence: SUSPECTED
    explanation: >-
      The direct ADRB2-to-GNAI1 causal edge also cites PMID:37963465, the same
      TAAR1 structure/signaling paper reused on multiple receptor-to-G-protein
      GO-CAM edges. The edge itself is biologically plausible: PMID:9363896
      supports beta-2 adrenergic receptor coupling to Gi after PKA-dependent
      switching. Check whether PMID:37963465 should remain only on TAAR1 models
      or whether this systematic receptor-to-G-protein evidence batch should be
      re-evidenced from receptor-specific sources.
    supported_by:
    - reference_id: PMID:9363896
      supporting_text: >-
        also serves to 'switch' coupling of this receptor from Gs to Gi and
        initiate a new set of signalling events.
  notes: >-
    The ADRB2 review accepts beta2-adrenergic receptor activity at the plasma
    membrane and accepts GO:0071881 as the supported Gi arm of ADRB2 signaling,
    so the GO-CAM molecular function, location and top-level process match the
    local gene review. The nested GO:0010667 cardiac-apoptosis process is a
    non-core ADRB2 process in the gene review; the source GO-CAM assigns it by
    GO_REF:0000024 transfer from mouse Adrb2 rather than direct human cardiac
    evidence, so it directionally matches the model's cardioprotection title but
    is less strongly supported than the core receptor and Gi assertions. The
    ADRB2 occurs_in reference, PMID:19584355, is a genuine beta2AR paper. The
    model also uses GNAI1 as the receptor has_input, adrenaline as the chemical
    input and a direct positive ADRB2-to-GNAI1 edge, which are the expected
    GO-CAM assertions for a Gi-coupled receptor activity; only the TAAR1
    reference attached to both molecular and causal association edges is suspect.
- activity_id: gomodel:680ad14200005738/680ad14200005740
  gene_product: UniProtKB:O43306
  molecular_function: GO:0004016
  biological_process: GO:0007193
  cellular_component: null
