    record: gomodel:67f85f2b00003584/67f85f2b00003586
    slot: part_of.with_objects
    requested_change: CHECK
    asserted_value: MGI:95775
    cause: UNKNOWN
    confidence: CONFIRMED
    explanation: >-
      The ADCY6 part_of GO:0007198 line is an ISS/GO_REF:0000024 manual
      transfer with MGI:95775 as its with/from object, but that MGI identifier
      is mouse Gnao1 rather than a mouse Adcy6 ortholog. Please check the
      with/from seed together with the serotonin-specific process term.
    supported_by:
    - reference_id: file:gocams/62f58d8800006739/62f58d8800006739-src.yaml
      supporting_text: |-
        - id: MGI:MGI:95775
          label: Gnao1 Mmus
  notes: >-
    The ADCY6 GO:0004016 molecular function is compatible with the
    species-neutral GPCR/cAMP module's transmembrane adenylyl cyclase activity,
    and ADCY6 is already one of the representative AC5/6 proteins in the
    module's Gi-inhibited variant. There is no local ADCY6 review, so this
    activity cannot yet be checked against a gene-level audit. The cached
    PMID:23842570 evidence supports ADCY6 involvement in cAMP output, while the
    other source direct-assay reference on the activity, PMID:17916776, is not
    locally cached. `just gocam-lint` reports the absent occurs_in value as an
    advisory missing_location row, as in the sibling CASR-to-GNAI1-to-ADCY6
    model gomodel:67c10cc400004342. The activity is the object of the
    unsupported GNAO1 inhibitory edge, and the
    acetylcholine-versus-serotonin process mismatch should be corrected before
    using this activity as evidence for CHRM2-driven ADCY6 inhibition.
