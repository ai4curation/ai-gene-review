model: gomodel:67f85f2b00003584
title: CHRM2-mediated signaling via G-alpha-o (inhibitory), inhibiting adenylate cyclase
  following activation by acetylcholine (Human).
taxon: NCBITaxon:9606
status: COMPLETE
summary: >-
  This compact human model asserts acetylcholine-activated M2 receptor coupling
  to Go alpha, followed by direct negative regulation of ADCY6 adenylyl cyclase.
  The receptor and GNAO1 activities agree with the dedicated M2-Go branch in
  modules/acetylcholine_signaling.yaml and with the completed CHRM2 and GNAO1
  reviews. The model should, however, re-cite the CHRM2-to-GNAO1 edge with an
  M2-Go paper rather than a 5-HT1B-Go structure, check the unsupported direct
  GNAO1-to-ADCY6 inhibitory edge, add an ADCY6 occurs_in location, and replace
  the serotonin-receptor process plus mouse Gnao1 ISS seed on ADCY6 with an
  acetylcholine or generic adenylyl-cyclase-inhibiting GPCR process.
