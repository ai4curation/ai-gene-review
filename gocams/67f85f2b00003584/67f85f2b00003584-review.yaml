  notes: >-
    The receptor molecular function and plasma-membrane location are correct,
    and the has_input GNAO1 molecule association follows receptor-effector
    best practice. The GO-CAM's GO:0007193 process is the generic parent of the
    acetylcholine-specific inhibitory process GO:0007197 accepted in the CHRM2
    review; the nested part_of GO:0007213 supplies a generic acetylcholine
    receptor context but still misses the more specific cyclase-inhibiting ACh
    process. The activity is therefore MORE_GENERAL rather than conflicting.
    The direct positive edge to GNAO1 is mechanistically appropriate but is
    marked UNCERTAIN because it cites the wrong Go structural paper and because
    the M2-specific edge needs a direct M2-Go source even though PMID:29925951
    supports an accepted generic GNAO1 GPCR-signaling annotation.
