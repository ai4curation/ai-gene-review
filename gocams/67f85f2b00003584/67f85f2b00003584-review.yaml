notes: >-
  This model overlaps modules/acetylcholine_signaling.yaml. CHRM2 and GNAO1 are
  already pinned to the module's M2-Go reception branch, whose boundary states
  that receptor-Go coupling is modeled separately from a universal direct
  Go-to-ADCY6 claim. No module edit is needed: `just gocam-lint` reports one
  missing_evidence warning on the GNAO1-to-ADCY6 edge, plus advisory
  no_narrative and ADCY6 missing_location rows, and `just gocam-compartments`
  finds no unresolved locations or nonadjacent causal edges.
