notes: >-
  The overlapping ModuleReview is
  modules/epithelial_apical_basal_polarity_complexes.yaml, which already pins
  gomodel:62900b6400001749 to the SCRIB signaling-adaptor annoton. The module
  uses basolateral plasma membrane rather than the GO-CAM's broader cell-cell
  junction location and summarizes this GO-CAM at the right boundary:
  ZDHHC7-dependent palmitoylation localizes SCRIB for epithelial polarity, while
  the rest of the module covers the species-neutral apical-basal polarity
  complexes. No module edit was needed.
