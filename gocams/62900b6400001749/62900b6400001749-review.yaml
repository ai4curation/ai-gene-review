    - reference_id: PMID:27380321
      supporting_text: expressing of WT SCRIB inhibited YAP target gene expression
    - reference_id: PMID:27380321
      supporting_text: expression of SCRIB WT, but not the SCRIB mutant (C4/10S or P305L), led to
        YAP cytoplasmic retention
