    supporting_text: Immunofluorescence and confocal microscopy studies showed that palmitoylation of
      SCRIB is required for its plasma membrane targeting
  notes: >-
    The SCRIB signaling-adaptor activity itself is defensible: SCRIB is a
    junctional LAP scaffold, and the existing epithelial apical-basal-polarity
    module records this activity as the SCRIB annoton. GO:0005911 cell-cell
    junction is broader than that module's basolateral plasma membrane term; the
    model would be spatially clearer if it used the plasma-membrane side of the
    junction. The source-defect here is on the outgoing causal edge, not the
    activity typing. The edge says SCRIB constitutively positively regulates
    YAP1 transcription-coactivator activity, but PMID:27380321 shows the
    opposite sign: wild-type SCRIB inhibited YAP target-gene expression and
    retained YAP in the cytoplasm, whereas mislocalized palmitoylation-deficient
    SCRIB mutants lost that inhibition.
