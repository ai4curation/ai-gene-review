  notes: >-
    ZDHHC7 is the palmitoyl acyltransferase that modifies SCRIB on its
    N-terminal cysteines and controls SCRIB membrane localization. The model also
    uses SCRIB as a has_input molecule for this activity, which is the right
    target relationship for a palmitoylation enzyme. The cached model omits an
    occurs_in term for ZDHHC7; this is recorded as a minor location gap rather
    than a source defect because the source paper assayed ZDHHC7 biochemistry
    without explicitly assigning the active pool to a single organelle.
