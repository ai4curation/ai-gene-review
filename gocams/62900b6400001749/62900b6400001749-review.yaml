    requested_change: CHECK
    asserted_value: RO:0012009 to gomodel:62900b6400001749/62900b6400002048
    confidence: PROBABLE
    explanation: >-
      The model's SCRIB-to-YAP1 edge is positive, but the cited paper supports
      negative regulation of YAP by junctional, palmitoylated SCRIB. Wild-type
      SCRIB increased inhibitory YAP S127 phosphorylation, inhibited YAP
      target-gene expression, and retained YAP in the cytoplasm, whereas the
      palmitoylation-deficient C4/10S and P305L SCRIB mutants lost those
      inhibitory activities. The edge should therefore use a negative relation,
      with curators checking whether to model SCRIB's effect on YAP as direct or
      as an indirect effect through Hippo-pathway kinases.
