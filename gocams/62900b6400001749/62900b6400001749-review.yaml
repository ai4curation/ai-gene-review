  notes: >-
    GO:0003713 is a correct molecular-function term for YAP1 and matches a core
    function in the YAP1 gene review; GO:0030859 is also present in that review
    but kept as non-core because YAP is read out as the downstream transcriptional
    effector that becomes active when polarity control fails, not as the protein
    that drives establishment of the polarized epithelial state. The missing
    occurs_in should be the nucleus or chromatin for an active YAP
    transcription-coactivator node. The biggest model-level issue is incoming:
    SCRIB is wired with a positive relation to this YAP1 activity, while the
    cited experiments show ZDHHC7-dependent, membrane-localized SCRIB suppressing
    YAP reporter activity and YAP target-gene expression.
