model: gomodel:62900b6400001749
title: ZDHHC7 Hsap regulates SCRIB in polarized cell differentiation (Human)
taxon: NCBITaxon:9606
status: COMPLETE
summary: >-
  A focused model in which ZDHHC7 palmitoylates SCRIB, palmitoylated SCRIB
  localizes to junctional plasma membrane, and membrane-localized SCRIB suppresses
  YAP activity during epithelial polarity. ZDHHC7 protein-cysteine
  S-palmitoyltransferase activity with SCRIB as input is well supported, and the
  SCRIB signaling-adaptor node matches the existing epithelial-polarity module.
  The model's causal sign is likely wrong at the SCRIB-to-YAP1 edge, however:
  PMID:27380321 shows that SCRIB suppresses YAP target-gene expression and keeps
  YAP out of the nucleus, whereas the cached edge says SCRIB constitutively
  positively regulates the YAP1 transcription-coactivator activity.
