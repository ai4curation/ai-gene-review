model: gomodel:63c0ac2b00001252
title: Palmitoylation of NLRP3 by ZDHHC12, leading to NLRP3 degradation by the chaperone-mediated
  autophagy process (Human)
taxon: NCBITaxon:9606
status: COMPLETE
summary: >-
  A focused human NLRP3 turnover model in which ZDHHC12 S-palmitoylates NLRP3,
  HSPA8/Hsc70 delivers the modified NLRP3 substrate to LAMP-2A, and
  chaperone-mediated autophagy degrades NLRP3 to limit inflammasome assembly.
  The HSPA8 and ZDHHC12 activities are plausible but omit occurs_in locations
  and need a full-text check against the NLRP3-specific paper; ZDHHC12's direct
  positive edge to the HSPA8 activity also overstates the relationship between
  NLRP3 palmitoylation and later CMA delivery. The model's hard defect is the
  LAMP2 molecular-function term: GO:0035591 signaling adaptor activity describes
  signal relay, while LAMP-2A acts as a lysosomal CMA substrate
  receptor/translocation component.
