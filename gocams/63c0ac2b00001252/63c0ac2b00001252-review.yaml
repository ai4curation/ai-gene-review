  gene_review: genes/human/LAMP2/LAMP2-ai-review.yaml
  supporting_text: >-
    Substrate proteins bind to the lysosomal membrane through the
    lysosome-associated membrane protein type 2A (LAMP-2A)
  evidence:
  - source_id: PMID:18644871
    statement: >-
      LAMP-2A binds CMA substrates as a monomer and its high-molecular-weight
      complex is required for substrate translocation.
    supporting_text: >-
      Substrate proteins only bind to monomeric LAMP-2A, while the efficient
      translocation of substrates requires the formation of a particular
      high-molecular-weight LAMP-2A complex.
  - source_id: PMID:11082038
    statement: LAMP-2A is the lysosomal-membrane receptor for CMA substrates.
    supporting_text: >-
      Lamp2a acts as a receptor in the lysosomal membrane for substrate proteins
      of chaperone-mediated autophagy.
  notes: >-
    LAMP-2A is correctly placed at the lysosomal membrane and correctly part_of
    chaperone-mediated autophagy, matching the LAMP2 review and the LAMP-2A
    translocation annoton in modules/chaperone_mediated_autophagy.yaml. Its GO-CAM
    molecular-function term is the problem: GO:0035591 is a signaling adaptor
    term, but the CMA activity is substrate binding, substrate translocation by
    a LAMP-2A multimer, and receptor recycling, with no established GO term for
    that exact combined activity.
  source_defects:
  - defect_type: WRONG_TERM
    resource: GO_CAM
    record: gomodel:63c0ac2b00001252/63c0ac2b00001271
    slot: molecular_function
    requested_change: CHECK
    asserted_value: GO:0035591
    cause: SCOPE_OVER_REACH
    confidence: CONFIRMED
    explanation: >-
      The LAMP2/LAMP-2A activity is typed as GO:0035591 signaling adaptor
      activity, but LAMP-2A does not relay a signal in this model. LAMP-2A binds
      CMA substrate at the lysosomal membrane as a monomer, assembles into a
      high-molecular-weight complex required for translocation, and is then
      recycled by Hsc70. Curators should replace GO:0035591 with an activity
      term for the CMA receptor/translocation role if one exists or request a
      new term for that LAMP-2A activity.
    supported_by:
    - reference_id: PMID:18644871
