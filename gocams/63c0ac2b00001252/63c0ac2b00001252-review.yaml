    supporting_text: >-
      is associated with the cytosolic side of the lysosomal membrane where it
      binds to substrates of this proteolytic pathway
  - source_id: PMID:36586411
    statement: ZDHHC12-dependent palmitoylation promotes NLRP3 degradation through CMA.
    supporting_text: >-
      zDHHC12 is identified as the S-acyltransferase for NLRP3 palmitoylation,
      which promotes its degradation through the chaperone-mediated autophagy
      pathway.
    notes: Pathway context; the cached abstract does not mention HSPA8.
  notes: >-
    The HSPA8 activity is the same CMA substrate-delivery annoton pinned by
    modules/chaperone_mediated_autophagy.yaml, and the HSPA8 review already
    decomposes its GO:0061740 row through this GO-CAM activity and the CMA
    module. GO:0061740 is a precomposed protein-targeting-in-CMA term but is
    supportable for the source GO-CAM. NLRP3 and LAMP-2A are defensible
    has_input fillers for this bridging activity: HSPA8 binds the NLRP3
    substrate and brings it to the LAMP-2A receiver at the lysosomal membrane.
    The direct positive edge to the LAMP2 activity compactly places HSPA8
    immediately upstream of receptor-bound substrate translocation; unlike the
    ZDHHC12 edge, that direct HSPA8-to-LAMP2 edge is supported even though it
    shares the same 2023-03-16 RO:0002629 migration stamp.
    The cached PMID:36586411 abstract does not mention HSPA8, so the
    NLRP3-specific HSPA8 step rests on source GO-CAM evidence from full text
    that is unavailable locally. The model should add an occurs_in for the
    HSPA8 activity because this delivery step begins in the cytosol and
    presents the substrate to LAMP-2A at the lysosomal membrane.
