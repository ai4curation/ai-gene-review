        translocation of substrates requires the formation of a particular
        high-molecular-weight LAMP-2A complex.
    - reference_id: PMID:11082038
      supporting_text: >-
        Lamp2a acts as a receptor in the lysosomal membrane for substrate
        proteins of chaperone-mediated autophagy.
