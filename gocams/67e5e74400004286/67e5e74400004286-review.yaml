          concentrating response.
        supporting_text: >-
          levels of AC6 mRNA, the most highly expressed AC isoform in the inner
          medulla, inversely correlate with fluid intake
      - source_id: PMID:20864687
        statement: >-
          Loss of AC6 reduces inner-medullary cAMP production and downstream
          AQP2 phosphorylation and trafficking in the collecting-duct V2 pathway.
        supporting_text: >-
          mice lacking AC6 had lower levels of inner medullary cAMP, reduced
          abundance of phosphorylated AQP2 (at both serine-256 and serine-269),
          and lower urine osmolality than wild-type mice.
    notes: >-
      GO:0004016 adenylate cyclase activity and cAMP as the output correctly
      represent ADCY6 in the renal V2 branch. The source model omits
      occurs_in; the aligned module places this activity at the plasma membrane,
      consistent with ADCY6 being a membrane-bound cyclase and with direct
      stimulation from the membrane-associated Gs-alpha activity. The missing
      location leaves the GNAS-to-ADCY6 compartment edge indeterminate in
      just gocam-compartments, so the verdict is UNCERTAIN until the GO-CAM
      asserts the membrane location explicitly. No local ADCY6 gene review
      exists yet.
