    evidence:
      - source_id: PMID:1534149
        statement: >-
          The cloned human antidiuretic hormone receptor is a seven-pass
          G protein-coupled receptor that stimulates adenylyl cyclase in the
          renal collecting-duct response to vasopressin.
        supporting_text: >-
          which binds to specific receptors on renal collecting tubule cells,
          stimulates adenylyl cyclase and promotes the cyclic AMP-mediated
          incorporation of water pores into the luminal surface of these cells.
      - source_id: PMID:20864687
        statement: >-
          In collecting ducts, AVP acts through the Gs-coupled V2 receptor to
          stimulate adenylyl cyclase and downstream AQP2 phosphorylation and
          trafficking.
        supporting_text: >-
          AVP acts on the CD through the G s protein-coupled vasopressin V 2
          receptor (V 2 R) to stimulate adenylyl cyclase (AC) and thus the
          synthesis of cAMP.
    notes: >-
      The activity is a close match to the AVPR2 annoton in
      modules/vasopressin_receptor_signaling.yaml: same gene, same
      vasopressin-receptor molecular function, same activating-GPCR process and
      a plasma-membrane location. The model uses GNAS as a receptor has_input,
      which is the right GO-CAM pattern for a receptor acting on its immediate
      downstream effector. There is no local AVPR2 gene review yet, so the
      activity itself cannot be marked CONSISTENT.
