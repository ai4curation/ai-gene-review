    evidence:
      - source_id: PMID:1534149
        statement: >-
          The V2 pathway is initiated by the released antidiuretic hormone that
          binds renal collecting-tubule receptors upstream of adenylyl cyclase
          activation.
        supporting_text: >-
          Antidiuresis, the recovery of water from the lumen of the renal collecting
          tubule, is regulated by the hypothalamic release of antidiuretic hormone
          (ADH)
      - source_id: PMID:20864687
        statement: >-
          AVP is the hormonal stimulus for V2 receptor-mediated cAMP formation
          and AQP2 trafficking in collecting-duct water reabsorption.
        supporting_text: >-
          Arginine vasopressin (AVP) enhances water reabsorption in the renal
          collecting duct by vasopressin V 2 receptor (V 2 R)-mediated activation
          of adenylyl cyclase (AC)
    notes: >-
      The model gets the ligand boundary right: the AVP cleavage product is
      modeled as an extracellular hormone activity and directly positively
      regulates AVPR2, without placing the hormone itself in the GPCR signaling
      pathway. That agrees with the module's explicit AVP-as-ligand treatment.
      The one local defect is the redundant has_input AVPR2 assertion. Per the
      GO-CAM has-input rule, a ligand activates a receptor through a causal
      edge; the receptor is not an input consumed or transformed by the ligand
      activity. No local AVP gene review exists yet.
