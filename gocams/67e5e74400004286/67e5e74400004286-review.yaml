model: gomodel:67e5e74400004286
title: AVPR2 -mediated signaling G-alpha-s ("stimulatory", activating adenylate cyclase)
  following activation by vasopressin (AVP) (Human).
taxon: NCBITaxon:9606
status: COMPLETE
summary: >-
  A compact renal V2 branch: extracellular Arg-vasopressin activates the
  plasma-membrane AVPR2 receptor, AVPR2 directly activates Gs alpha, active Gs
  alpha directly stimulates ADCY6, and ADCY6 produces cAMP in the
  adenylate-cyclase-activating GPCR arm of renal water absorption.
activity_reviews:
  - activity_id: gomodel:67e5e74400004286/67e5e74400004289
    gene_product: UniProtKB:P63092
    molecular_function: GO:0003925
    biological_process: GO:0007189
    cellular_component: GO:0009898
    verdict: OK
    consistency: NOT_IN_REVIEW
    gene_review: file:human/GNAS/GNAS-ai-review.yaml
    supporting_text: >-
      Gbetagamma subunits enhance the activity of these enzymes provided either
      Galpha(s) or forskolin is present.
    evidence:
      - source_id: PMID:17110384
        statement: >-
          Human ADCY6 is stimulated in a G protein-dependent manner, supporting
          the direct positive edge from Gs alpha to ADCY6 as the next step in
          the V2 receptor cascade.
        supporting_text: >-
          Gbetagamma subunits enhance the activity of these enzymes provided either
          Galpha(s) or forskolin is present.
      - source_id: PMID:20864687
        statement: >-
          Arginine vasopressin acts through the V2 receptor to stimulate adenylyl
          cyclase in collecting-duct water reabsorption.
        supporting_text: >-
          Arginine vasopressin (AVP) enhances water reabsorption in the renal
          collecting duct by vasopressin V 2 receptor (V 2 R)-mediated activation
          of adenylyl cyclase (AC)
    notes: >-
      GO:0003925 G protein activity on the cytoplasmic side of the plasma
      membrane is the expected Gs-alpha activity connecting AVPR2 to ADCY6. The
      local GNAS review exists, but it currently reviews the NESP55
      neuroendocrine secretory product rather than the Gs-alpha product used
      here, so the AVPR2-linked G protein activity is marked NOT_IN_REVIEW. The
      direct positive edge to ADCY6 is same-compartment/adjacent after placing
      ADCY6 at the membrane.
