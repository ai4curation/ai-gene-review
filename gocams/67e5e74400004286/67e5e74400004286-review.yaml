notes: >-
  Module alignment: modules/vasopressin_receptor_signaling.yaml already cites
  this GO-CAM on all four matching annotons. The model covers only the first
  three steps of the module's renal V2 branch: AVP ligand activity, AVPR2
  receptor activation of GNAS, and GNAS stimulation of ADCY6 to produce cAMP.
  The downstream AKAP/PKA, AQP2-phosphorylation, recycling, fusion, AQP2 water
  channel and PDE4D feedback steps are deliberately outside this small
  source model, and no module change is needed.

  Checks run and dismissed: just gocam-lint reports one missing_location lead
  for ADCY6, reflected above as MISSING_LOCATION, and no_narrative because the
  cached source model has no free-text curator narrative. just
  gocam-compartments reports no nonadjacent or unresolved edges; its one
  INDETERMINATE edge is a consequence of the missing ADCY6 location.
