  evidence:
  - source_id: PMID:30893606
    statement: CAPS-1 DAMH binding to the Munc13-1 MUN domain hinders syntaxin-1 opening.
    supporting_text: >-
      CAPS-1 plays an inhibitory role dependent on binding of the DAMH domain to
      the MUN domain of Munc13-1, which hinders the ability of Munc13 to catalyze
      opening of syntaxin-1, inhibiting SNARE complex formation
  - source_id: PMID:30893606
    statement: The paper's overall conclusion is that CAPS-1 facilitates SNARE complex formation.
    supporting_text: >-
      Our results suggest that CAPS-1 facilitates SNARE complex formation via the
      DAMH domain in a manner dependent on sequential and cooperative interaction
      with Munc13-1 and SNARE proteins.
  notes: >-
    The negative edge to Munc13-1 and has input Munc13-1 are right for the
    inhibitory DAMH-MUN interaction, which is shown. But "protein binding" says
    nothing; the inhibitory role reads as an enzyme-inhibitor-like or
    sequestering activity toward Munc13-1, and the chaperone role on the
    syntaxin-1/SNAP-25 complex, which the paper treats as the facilitating
    function, is not modelled at all. The net sign the paper concludes
    (facilitation) is therefore not represented. part_of neuronal dense core
    vesicle exocytosis is consistent with CAPS's established role, but this
    paper's in vitro assays address SNARE complex formation and the abstract
    does not show DCV exocytosis itself; the part_of evidence is coded as
    mutant phenotype. No location. No review for rat Cadps or a human ortholog
    in this worktree.
