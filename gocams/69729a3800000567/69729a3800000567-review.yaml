    supporting_text: >-
      which hinders the ability of Munc13 to catalyze opening of syntaxin-1,
      inhibiting SNARE complex formation
  notes: >-
    Same representation as in the Stxbp1 SNARE-assembly model: has input
    syntaxin-1A and part_of positive regulation of SNARE complex assembly are
    right, and the paper itself describes Munc13 as catalyzing syntaxin-1
    opening. "Protein-containing complex binding" is a bare binding term for
    that activity; GO has no term for MUN-domain catalysed syntaxin opening,
    so this is partly an ontology gap. No location (presynaptic active zone
    membrane). No review for rat Unc13a; the human UNC13A ortholog review has
    syntaxin-1 binding as a core function directly involved in synaptic
    vesicle priming and positive regulation of SNARE complex assembly.
