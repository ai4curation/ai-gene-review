  - source_id: PMID:30893606
    statement: CAPS-1 DAMH binds the syntaxin-1/SNAP-25 complex and stabilizes open syntaxin-1.
    supporting_text: >-
      a chaperone role dependent on interaction of the DAMH domain with the
      syntaxin-1/SNAP-25 complex, which stabilizes the open conformation of Syx1,
      facilitating SNARE complex formation
  notes: >-
    SNAP-25 appears in the paper only as part of the syntaxin-1/SNAP-25
    acceptor complex that CAPS-1 binds. "Protein-containing complex binding"
    records that it is in a complex and nothing about its role; SNAP-25's own
    function in SNARE assembly is GO:0005484 (helical-bundle zippering
    fusogenic activity). The activity has no process (SNARE complex assembly or
    dense core vesicle exocytosis would apply), no location (plasma membrane),
    and no outgoing edge, so the chain ends without reaching exocytosis. The
    incoming "directly provides input for" edge from Munc13-1 is reasonable
    (opened syntaxin-1 pairs with SNAP-25). No review for rat Snap25; the human
    SNAP25 ortholog review makes GO:0005484 its core function, directly
    involved in synaptic vesicle priming and fusion and, in a second core
    function, in presynaptic dense core vesicle exocytosis.
