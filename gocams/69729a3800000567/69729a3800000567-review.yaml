model: gomodel:69729a3800000567
title: dense core granule exocytosis (rat)
taxon: NCBITaxon:10116
status: COMPLETE
summary: >-
  A three-activity model built entirely from one structural/biochemical paper
  on the CAPS-1 DAMH domain (PMID:30893606). CAPS-1 (Cadps, protein binding
  with has input Munc13-1, part_of neuronal dense core vesicle exocytosis)
  directly negatively regulates Munc13-1 (Unc13a, protein-containing complex
  binding with has input syntaxin-1A, part_of positive regulation of SNARE
  complex assembly), which directly provides input for SNAP-25 (Snap25,
  protein-containing complex binding, with no process or location). The model
  captures only the inhibitory half of the paper's "dual role": DAMH binding
  to the Munc13-1 MUN domain hinders syntaxin-1 opening. It omits the
  chaperone half that the paper presents as CAPS-1's net effect, in which DAMH
  binds the syntaxin-1/SNAP-25 complex and stabilizes open syntaxin-1 to
  facilitate SNARE complex formation. So the model's only CAPS edge is
  negative although the paper concludes that CAPS-1 facilitates SNARE complex
  formation. All three molecular functions are binding terms, none of the
  activities has a location, and only CAPS is tied to dense core vesicle
  exocytosis, the process in the title. The evidence is in vitro with
  recombinant proteins; the cached record is abstract-only.
