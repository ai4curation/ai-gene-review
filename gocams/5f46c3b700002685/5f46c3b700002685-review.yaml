model: gomodel:5f46c3b700002685
title: IL6:sIL6R Trans-signaling pathway (Human)
taxon: NCBITaxon:9606
status: COMPLETE
summary: >-
  IL6 cytokine activity (extracellular) has the soluble IL-6 receptor isoform (IL6R isoform 2) as input
  and directly activates it. The sIL6R activity, typed as GO:0004915 interleukin-6 receptor activity in
  the extracellular region, has IL6ST (gp130) as input and directly activates IL6ST coreceptor activity
  at the plasma membrane. IL6ST directly activates JAK1 protein tyrosine kinase activity, and JAK1
  directly activates STAT3 DNA-binding transcription factor activity in the nucleus. STAT3 indirectly
  activates SOCS3 (its target gene, also recorded as has_input), and SOCS3 protein kinase inhibitor
  activity directly negatively regulates JAK1, closing the feedback loop. The causal story is the
  accepted trans-signaling pathway. The JAK1 -> STAT3 edge is the GO-CAM direct-regulation convention,
  EXPLAINED by modules/jak_stat_signaling.yaml. The STAT3 -> SOCS3 edge is correctly indirect
  (transcription and translation). The main problems are three. First, the receptor typing is inverted
  for trans-signaling: soluble IL6R, which lacks a membrane segment, carries a term defined by
  transmembrane signalling, and gp130, the signal-transducing subunit, is called a coreceptor. Second,
  two references look unrelated to the claims they support: a SOCS1/LPS paper for the IL6R and IL6ST
  inputs, and a SOCS2/IGF-IR paper for SOCS3. Third, the STAT3 and JAK1 MFs are less specific than their
  gene reviews.
