  - source_id: PMID:27893700
    supporting_text: The IL-6-sIL-6Rα soluble complex associates with gp130 and initiates IL-6 signaling
      in gp130+ cells.
  notes: >-
    The sIL6R isoform (P08887-2) in the extracellular region with the direct edge to gp130 is the
    defining step of trans-signaling and is well supported. GO:0004915 is defined as "Combining with
    interleukin-6 and transmitting the signal from one side of the membrane to the other" (OLS, checked
    2026-11-05). The soluble isoform does not span the membrane, and the cited papers describe it as
    presenting IL-6 to gp130. A term for activating gp130, such as GO:0030546 signaling receptor activator
    activity, would describe the depicted role; there is no specific GO term for a soluble ligand-binding
    receptor subunit. The has_input IL6ST cites PMID:12433365, which concerns SOCS1 in LPS signalling
    (see the source defect). IL6R has no gene review.
