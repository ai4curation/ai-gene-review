notes: >-
  Read-only assessment; the model is not edited. The trans-signaling story is sound; the problems lie in
  the receptor typing (soluble IL6R carries a transmembrane-signalling term while gp130 is called a
  coreceptor) and in two apparently misattached references (PMID:12433365, PMID:9727029), recorded as
  source defects for checking.
