model: gomodel:65d7e4ac00002808
title: MCUB inhibits mitochondrial calcium uptake by the uniplex complex (composed
  of SMDT1/EMRE, MICU1, MICU2 and MCU) to prevent calcium overload (Human).
taxon: NCBITaxon:9606
status: COMPLETE
summary: >-
  The model captures the inhibitory MCUB branch of the human mitochondrial calcium
  uniporter. MCUB enables calcium channel inhibitor activity in the mitochondrial
  inner membrane and directly negatively regulates the calcium-channel activity of
  MCU; MICU1, MICU2 and SMDT1/EMRE are represented as positive regulators or
  adaptor components of the same MCU import activity. Its five activities all use
  specific molecular functions, carry inner-membrane locations and match the reviewed
  uniplex roles. The model is also already pinned by the existing
  mitochondrial_calcium_uniporter module.
