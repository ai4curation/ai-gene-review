  evidence:
  - source_id: PMID:22447935
    statement: PIP2 binding raises Syt1 Ca2+ affinity more than 40-fold (cooperative binding).
    supporting_text: >-
      PIP(2) binding reduced the apparent dissociation constant for Ca(2+) from
      ∼250 to <5 μM. Thus, our data show that PIP(2) makes synaptotagmin-1 >40-fold
      more sensitive to Ca(2+).
  notes: >-
    Syt1 is the Ca2+ sensor for synchronous release; "calcium ion binding" is
    the generic parent of calcium ion sensor activity (GO:0061891). The rat
    Syt1 review MODIFYs every calcium ion binding row, including the IDA from
    PMID:22447935 cited here, to GO:0061891, and makes calcium ion sensor
    activity its first core function, so the model is more general than the
    review. The reciprocal positive edges with PIP2 binding encode cooperative
    binding; the abstract shows the PIP2 -> Ca2+ direction directly. The
    negative edge to SV2A matches the Ca2+ inhibition of the SV2A interaction
    (PMID:8910372), but its reference is recorded as "PMID: 8910372" with a
    space, so it is malformed rather than missing. No process (e.g.
    calcium-dependent activation of synaptic vesicle fusion) and no location.
