    activity it is still a binding term; its consequence (raising Ca2+
    sensitivity) is carried only by the edge to the calcium activity. Syt1 binds
    PIP2 on the plasma membrane in trans, so a location and a process (the
    review uses calcium-dependent activation of synaptic vesicle fusion) are
    missing.
