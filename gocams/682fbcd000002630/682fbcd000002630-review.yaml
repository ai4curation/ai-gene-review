model: gomodel:682fbcd000002630
title: Syt1 vesicle organization (rat)
taxon: NCBITaxon:10116
status: COMPLETE
summary: >-
  A five-activity model of synaptotagmin-1 (Syt1) regulatory interactions on
  rat synaptic vesicles. Three Syt1 activities are split out of one protein:
  homo-oligomerization (identical protein binding, part_of protein
  homooligomerization), which is constitutively upstream of both Syt1 calcium
  ion binding and Syt1 PI(4,5)P2 binding; those two directly positively
  regulate each other, encoding the cooperative Ca2+/PIP2 binding of the C2B
  domain. Syt1 calcium ion binding directly negatively regulates SV2A
  (protein binding with has input Syt1, occurs_in synaptic vesicle), encoding
  the Ca2+ inhibition of the SV2A-synaptotagmin interaction. Casein kinase 1
  alpha (Csnk1a1, protein serine/threonine kinase activity, has input SV2A,
  part_of protein phosphorylation, occurs_in synapse) directly positively
  regulates the SV2A binding activity, encoding enhanced synaptotagmin binding
  by phosphorylated SV2. Every edge has a matching statement in the cited
  abstracts, and the edge directions and signs agree with them. The weakness
  is molecular-function typing: four of five activities are binding terms,
  including bare protein binding and identical protein binding, and Syt1's
  calcium activity is typed as calcium ion binding where calcium ion sensor
  activity applies (the rat Syt1 review MODIFYs exactly this row to that
  term). Only the kinase activity is tied to a process and placed in the
  cell; the Syt1 activities have neither, and the title's "vesicle
  organization" appears nowhere as a process. The kinase is attributed to the
  CK1 alpha isoform, which the cited paper does not determine. One edge's
  reference is malformed ("PMID: 8910372", with a space).
