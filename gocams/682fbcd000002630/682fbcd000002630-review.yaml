    statement: Casein kinase I is suggested as a primary SV2 kinase; isoform not stated.
    supporting_text: >-
      Phosphopeptide mapping, in gel kinase assays, and surveys of kinase
      inhibitors suggest that casein kinase I is a primary SV2 kinase.
  - source_id: PMID:10747945
    statement: Phosphorylation of SV2 increases its binding to synaptotagmin.
    supporting_text: >-
      Comparison of synaptotagmin binding with phosphorylated and unphosphorylated
      SV2 amino-terminal peptides reveals an increase in binding with
      phosphorylation.
  notes: >-
    Kinase activity with has input SV2A, protein phosphorylation and the
    positive direct edge to SV2A binding are all consistent with the abstract,
    and a kinase acting on its substrate's binding is a proper direct
    regulation. The concern is the enabler: the paper says only that "casein
    kinase I" is suggested by inhibitor and in-gel assays, and the abstract
    does not name the CK1 alpha isoform, so attributing the activity to
    Csnk1a1 rests on something the cached abstract does not show (full text
    not available). Location "synapse" is broad (the substrate is a synaptic
    vesicle protein). No review for rat Csnk1a1.
