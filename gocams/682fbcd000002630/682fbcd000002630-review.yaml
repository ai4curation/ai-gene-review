  - source_id: PMID:8910372
    statement: SV2A binds synaptotagmin directly, and calcium inhibits the interaction.
    supporting_text: >-
      The interaction between SV2 and synaptotagmin is direct, specific to SV2A,
      and inhibited by calcium with an EC50 of approximately 10 microM.
  notes: >-
    The interaction, its Ca2+ inhibition and its location on synaptic vesicles
    are supported, and both incoming edges (negative from Syt1 Ca2+ binding,
    positive from the kinase) match the abstracts. But "protein binding" says
    nothing about what SV2A does; the paper itself states that SV2 function was
    unknown and only suggests "a regulatory relationship between these two
    proteins". No process, and no outgoing edge, so the model never says what
    the SV2A-Syt1 interaction does. The rat Syt1 review REMOVEs the reciprocal
    Syt1 protein binding row from this paper under the protein-binding policy.
    No review for rat Sv2a.
