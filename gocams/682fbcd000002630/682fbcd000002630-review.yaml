      mutations in the GXXXG motif that inhibit oligomerization of Syt1 reduce
      the rate of vesicle capture
  notes: >-
    Oligomerization in the membrane is supported, and "constitutively upstream
    of" the Ca2+ and lipid binding activities fits the finding that
    oligomerization mutants slow Ca2+-dependent vesicle capture. The MF is a
    bare binding term; the process term carries the claim. No location
    (synaptic vesicle membrane). The rat Syt1 review keeps the identical
    protein binding rows, including the IDA from this paper, as
    KEEP_AS_NON_CORE, so the activity is in the review but not as a core
    function.
