model: gomodel:66c7d41500003458
title: NMDA glutamate receptor activity co-activated by glycine and involving GRIN1 and GRIN2D (Human)
taxon: NCBITaxon:9606
status: COMPLETE
summary: GluN1 (GRIN1) and GluN2D (GRIN2D) each carry NMDA glutamate receptor activity at the postsynaptic membrane;
  glycine activates GluN1 and L-glutamate activates GluN2D. The two subunit activities each "directly positively
  regulate" (RO:0002629) a third activity enabled by the complex term. The ligand each subunit senses is attached
  to that subunit as a small-molecule activator (RO:0012001), and ion flux (has input / has output) sits on the
  complex activity. Terms and structure are correct and the function is directly supported by human NMDAR1A/2D recordings
  (PMID:9489750). The glutamate activator association on GluN2D carries a stray with-object, rat Grin2c (RGD:2739),
  on an experimental code.
