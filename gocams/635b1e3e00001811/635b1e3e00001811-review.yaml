model: gomodel:635b1e3e00001811
title: The NLRP3 inflammasome (Human)
taxon: NCBITaxon:9606
status: COMPLETE
summary: >-
  The model has 14 activities on 6 gene products (NLRP3 x5, CASP1 x3, the
  GSDMD N-terminal chain x3, NEK7, IL18, IL1B). PYCARD (ASC) appears only as a
  has_input molecule. The causal story runs as follows. NLRP3 molecular sensor
  activity (cytosol) and NEK7 molecular function activator activity (MTOC) both
  directly activate an NLRP3 signaling adaptor activity whose input is NLRP3
  itself (MTOC). That activity directly activates NLRP3 PtdIns4P binding
  (membrane), which activates NLRP3 signaling adaptor activity toward PYCARD,
  which activates NLRP3 cysteine-type endopeptidase activator activity toward
  CASP1. The activator fans out to three CASP1 cysteine-type endopeptidase
  activities, one per substrate (GSDMD, pro-IL-1beta, pro-IL-18). Only the
  GSDMD-cleaving node continues: it activates two GSDMD-NT lipid-binding
  activities (PtdIns4P and PtdIns(4,5)P2) at the plasma membrane, both of which
  activate GSDMD-NT wide pore channel activity (inputs IL-1beta and IL-18). The
  pore in turn directly activates IL18 and IL1B cytokine activity in the
  extracellular region. The downstream half is sound. Unlike the IL-1 model
  (gomodel:59cc772c00000000), it routes mature cytokines out through the GSDMD
  pore rather than drawing a direct edge from cytosolic CASP1 to extracellular
  cytokine activity, so there is no compartment-crossing shortcut here. The
  upstream half has five problems. (1) The NLRP3 self-input adaptor node is the
  inactive cage (its two references are structures of the resting
  NLRP3 oligomer), but it is placed at the MTOC and drawn upstream of PtdIns4P
  binding at the membrane. Published step order is the reverse: the cage forms
  on the TGN before stimulation, the dispersed TGN is trafficked to the MTOC,
  and NEK7 opens the cage there. (2) Molecular sensor activity requires binding
  the sensed molecule, and no direct NLRP3 agonist ligand is known; the NLRP3
  gene review marks this term over-annotated. (3) The CASP1-activating step is
  attributed to NLRP3, but ASC recruits and activates caspase-1 through
  CARD-CARD contacts; PYCARD, the central adaptor of the complex, has no
  activity in the model. (4) Two of the three CASP1 nodes (pro-IL-1beta and
  pro-IL-18 cleavage) are dead ends with no edge to the pore that releases their
  products, so the split into three nodes adds no causal information. The
  pro-IL-1beta node also cites an IL-18 paper for its part_of and a secretion
  paper for its substrate. (5) Locations are generic (membrane rather than
  trans-Golgi network membrane) and the NLRP3 ATPase activity, the
  conformational switch of the protein, is absent. The repeated same-gene nodes
  are therefore partly legitimate (distinct MFs, a cytosol to TGN to MTOC
  translocation) and partly redundant or mis-ordered.
