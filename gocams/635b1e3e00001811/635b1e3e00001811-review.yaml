  - source_id: PMID:16407889
    supporting_text: Here we show that MSU and CPPD engage the caspase-1-activating
      NALP3 (also called cryopyrin) inflammasome, resulting in the production of
      active interleukin (IL)-1beta and IL-18.
  - source_id: PMID:11786556
    supporting_text: When expressed in cells, ASC recruits PYPAF1 to distinct
