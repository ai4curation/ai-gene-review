  notes: >-
    The biology (NLRP3 responds to crystals, lysosomal damage and other danger
    signals) is right, and the node is the entry point of the model. The MF is
    the problem. GO:0140299 molecular sensor activity is defined as binding to a
    molecule and eliciting a change in activity in response to its level. No
    direct NLRP3 agonist ligand has been identified, and both enabled_by
    references describe engagement by particles or lysosomal damage, not
    binding of a sensed molecule. The NLRP3 review MARK_AS_OVER_ANNOTATED all
    GO:0140299 rows, including the IDA from PMID:16407889 cited here, hence
    CONFLICT. The one direct binding event that fits the sensor idea is
    PtdIns4P binding, which is already a separate node
    (gomodel:635b1e3e00001811/635b1e3e00001847). An alternative is to drop this
    node and let the NLRP3 ATPase activity (GO:0016887, core in the NLRP3
    review, absent from the model) carry the switch. The occurs_in cytosol
    reference (PMID:11786556) shows cytoplasmic loci on overexpression with
    ASC, which is adequate. The outgoing edge goes to the cage node, which is
    discussed under that activity.
