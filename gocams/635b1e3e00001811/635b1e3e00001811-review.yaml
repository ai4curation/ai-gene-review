notes: >-
  Read-only assessment; the model is not edited. This review incorporates the
  manual review by cjm ("Problematic GO-CAM models", NLRP3 section).

  Points confirmed. (1) Multiple chains of the same gene are real: NLRP3 x5,
  CASP1 x3, GSDMD-NT x3. Some are defensible distinct activities (NLRP3 sensor
  vs adaptor vs lipid-binding vs activator; CASP1 by substrate; GSDMD lipid
  binding vs pore), but several are redundant or mis-ordered, so the user's
  "confusing, over-complicated" reading is fair for the upstream half. (2) The
  model is unconventional relative to KEGG hsa04621 and typical pathway figures,
  which draw NLRP3, ASC and caspase-1 once each; here ASC/PYCARD is not even an
  activity, only a has_input molecule, while NLRP3 is five nodes.

  Points refined. (3) NEK7: the user is right that NEK7 is an essential,
  kinase-independent activator and that the model should reflect this. It
  already does: the NEK7 node is typed GO:0140677 molecular function activator
  activity (non-catalytic), not a kinase MF, so there is no kinase-MF error to
  fix here. The refinement is that NEK7's outgoing edge lands on the
  inactive-cage node. (4) Bacterial inhibition of pyroptosis (PMID:36227980):
  the model does not contain a bacterial activity or a PtpB node. It cites that
  paper only as evidence for the two GSDMD-NT phosphoinositide-binding nodes
  (1910, 1917). So the model does not "include mechanisms by which bacteria
  inhibit pyroptosis"; it reuses a host-lipid finding from a bacterial-evasion
  paper. The curated UniProt FUNCTION is a cleaner reference for those steps.

  Point I disagree with framing on. The same-gene repeats are not uniformly
  wrong. The genuine defects are specific: the NLRP3 self-input adaptor node
  (1821) is the inactive cage mislabelled as an adaptor and placed out of order;
  molecular sensor activity (1812) mistypes the entry point; the CASP1
  activation step is on NLRP3 rather than PYCARD, which has no activity; and two
  CASP1 nodes are dead ends. The downstream half (CASP1 -> GSDMD -> pore ->
  cytokines) is correct and, unlike the sibling IL-1 model, routes cytokines out
  through the GSDMD pore with no compartment-crossing shortcut.

  Publications fetched into the cache for this review: PMID:36227980,
  PMID:14528293, PMID:15192144, PMID:21880711, PMID:1919436, PMID:26642356,
  PMID:36442502. Gene reviews exist for NLRP3, NEK7, CASP1, GSDMD and PYCARD;
  IL1B and IL18 have none.
