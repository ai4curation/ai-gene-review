  notes: >-
    This is the most problematic of the five NLRP3 nodes and the main reason
    the NLRP3 chain is hard to read. Its has_input is NLRP3 itself, and both
    enabled_by/part_of references (PMID:35254907, PMID:35114687) are structures
    of the inactive, ADP-bound NLRP3 cage, the resting state that NEK7 later
    disrupts. A homo-oligomeric resting cage is not a signaling adaptor:
    an adaptor brings different partners together, and a self input names no
    partner (HAS_INPUT_MISUSE). The node is also placed and ordered against the
    sources. Its occurs_in is the MTOC, but the cage forms on TGN membranes
    before stimulation. It directly activates NLRP3 PtdIns4P binding at the
    membrane, but published step order puts TGN binding first and MTOC arrival
    later (PMID:36442502), so the edge is reversed (INCORRECT_DIRECTIONALITY).
    Two incoming edges add to the confusion. Molecular sensor activity "directly
    activates" the formation of a resting-state cage, and NEK7, whose role is to
    break that cage, is drawn as directly activating it. If the node is meant to
    be the active NEK7-bridged oligomer at the MTOC (PMID:31189953), it needs
    that evidence and should sit downstream of PtdIns4P binding, just before
    ASC recruitment. The NLRP3 review ACCEPTs GO:0035591 from these same papers,
    but it reads the adaptor role as ASC recruitment, which node 1836
    already covers; its MTOC-specific core function is GO:0140693 molecular
    condensate scaffold activity. Hence RELATED rather than CONSISTENT. The
    simplest repair is to delete this node and route NEK7 to the ASC-recruiting
    adaptor activity.
