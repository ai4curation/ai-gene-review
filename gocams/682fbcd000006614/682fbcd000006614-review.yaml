  - source_id: PMID:14528015
    statement: Syp is required for correct sorting of VAMP2 to synaptic vesicles, through a direct interaction.
    supporting_text: >-
      These data support a role for SypI in directing the correct sorting of
      VAMP2 in neurons and demonstrate that a direct interaction between the two
      proteins is required for SypI in order to exert its effect.
  notes: >-
    The paper supports a Syp role in sorting VAMP2 to synaptic vesicles, so a
    carrier-like MF (GO:0140597 protein carrier activity) is defensible, though
    the paper shows a sorting requirement, not that Syp delivers VAMP2. Two
    problems. The process should be the sorting itself (protein targeting or
    localization to synaptic vesicles), not synaptic vesicle exocytosis, which
    this paper does not test. And the cargo, VAMP2, should be the activity's
    has input; instead it is modelled as an upstream VAMP2 activity that
    "directly provides input for" this one, closing a Syp -> VAMP2 -> Syp loop.
    No outgoing edge. No gene review for rat Syp and none for a human ortholog
    in this worktree. Only the abstract is cached.
