model: gomodel:682fbcd000006614
title: Syp vesicle fusion (rat)
taxon: NCBITaxon:10116
status: COMPLETE
summary: >-
  A three-activity model of the synaptophysin I (Syp) - VAMP2 interaction in
  rat hippocampal neurons, built on two papers from one group. Syp
  homo-oligomerizes on the synaptic vesicle membrane (identical protein
  binding, part_of protein homooligomerization) and directly provides input
  for VAMP2 (protein-containing complex binding, part_of vesicle fusion to
  plasma membrane, occurs_in axon), which in turn directly provides input for
  a second Syp activity (protein carrier activity, part_of synaptic vesicle
  exocytosis, occurs_in synaptic vesicle membrane). The biology behind it is
  two findings: Syp forms homo-oligomers and Syp-VAMP2 hetero-oligomers on the
  vesicle membrane, from which VAMP2 dissociates when exocytosis is stimulated
  (PMID:12181340); and Syp is needed for VAMP2 to be sorted to synaptic
  vesicles rather than to constitutively fusing vesicles (PMID:14528015). The
  model encodes this awkwardly. Two of the three molecular functions are bare
  binding terms. VAMP2 is the cargo of the Syp sorting activity and belongs as
  its has input, not as an upstream activity providing input to it, and the
  resulting Syp -> VAMP2 -> Syp loop is not a causal sequence. The sorting
  activity is tied to synaptic vesicle exocytosis rather than to targeting of
  VAMP2 to synaptic vesicles, which is what the paper shows. VAMP2 is placed in
  the axon although the cited paper locates the hetero-oligomers on the
  synaptic vesicle membrane.
