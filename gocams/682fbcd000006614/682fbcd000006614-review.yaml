  evidence:
  - source_id: PMID:12181340
    statement: The Syp-VAMP2 hetero-oligomers are on the synaptic vesicle membrane, not described as axonal.
    supporting_text: >-
      We show that synaptophysin I and VAMP2 form both homo- and hetero-oligomers
      on the synaptic vesicle membrane.
  notes: >-
    "Protein-containing complex binding" records only that VAMP2 sits in a
    complex with Syp. VAMP2's own molecular function in vesicle fusion is
    GO:0005484 (helical-bundle zippering fusogenic activity), which would fit
    the part_of vesicle fusion to plasma membrane; the binding term does not.
    The location "axon" does not resolve to a distinct compartment for a
    vesicle protein, and the cited paper places the complex on the synaptic
    vesicle membrane (the same term the two Syp activities use). The
    outgoing edge to the Syp carrier activity reverses the relationship: VAMP2
    is the cargo of Syp-dependent sorting (PMID:14528015), so it is that
    activity's input, not an upstream activity driving it. No review for rat
    Vamp2; the human VAMP2 ortholog review makes GO:0005484 its first core
    function and keeps syntaxin-1 binding as a second.
