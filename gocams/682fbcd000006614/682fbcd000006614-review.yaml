  evidence:
  - source_id: PMID:12181340
    statement: Syp and VAMP2 form homo- and hetero-oligomers on the synaptic vesicle membrane; VAMP2 dissociates on stimulation.
    supporting_text: >-
      We show that synaptophysin I and VAMP2 form both homo- and hetero-oligomers
      on the synaptic vesicle membrane. When exocytosis is stimulated with
      alpha-latrotoxin, VAMP2 dissociates from synaptophysin I even in the
      absence of appreciable exocytosis
  - source_id: PMID:12181340
    statement: The authors propose that Syp regulates VAMP2 availability for the SNARE complex.
    supporting_text: >-
      We propose that synaptophysin I has multiple roles in neurotransmitter
      release, regulating VAMP2 availability for the soluble N-ethylmaleimide-sensitive
      factor attachment protein receptor complex
  notes: >-
    Homo-oligomerization on the synaptic vesicle membrane in hippocampal
    neurons is supported (FRET in live neurons), and the location is right.
    "Identical protein binding" is a bare binding term; the process term
    (protein homooligomerization) carries what the evidence shows. The
    outgoing "directly provides input for" edge to VAMP2 is weakly founded:
    the paper's claim is that Syp holds VAMP2 in a hetero-oligomer and that
    VAMP2 is released on stimulation, a proposed regulation of VAMP2
    availability (closer to sequestering than to providing input), and it
    concerns the hetero-oligomer rather than the Syp homo-oligomer this
    activity represents. No gene review for rat Syp. Only the abstract is
    cached.
