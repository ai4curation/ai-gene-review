model: gomodel:62b4ffe300005437
title: Inhibition of the JAK-STAT pathway by S.flexneri OspC3 that blocks calcium-binding
  to calmodulin (Human)
taxon: NCBITaxon:9606
status: COMPLETE
summary: >-
  A three-activity model of host-pathogen interference. The Shigella flexneri
  type III effector OspC3 (UniProtKB:A0A0H2US87), typed with GO:0005516
  calmodulin binding, has_input CALM1, occurs_in host cell cytoplasm
  (GO:0030430) of an epithelial cell, part_of symbiont-mediated suppression of
  host calcium-mediated signal transduction (GO:0075135). It directly negatively
  regulates (RO:0002630) host CALM1 calcium ion binding (GO:0005509), which
  directly positively regulates CALM1 protein serine/threonine kinase activator
  activity (GO:0043539, has_input CAMK2A). Both host activities are part_of
  cellular response to interferon-beta (GO:0035458) within positive regulation
  of receptor signaling pathway via JAK-STAT (GO:0046427). The mechanism is
  correct and is the central finding of PMID:35568036. Five problems. (1) The
  model is a clone of 62b4ffe300005467 with OspC1 swapped for OspC3: identical
  molecular functions, processes, locations, relations and reference, and the
  paper treats the two effectors as doing the same thing, so the split is
  combinatorial rather than biological. (2) It ends at a has_input: CAMK2A
  appears only as an object of the CALM1 activator activity, not as an activity,
  so the pathway stops one step short of the kinase it inhibits and two steps
  short of STAT1, which the paper measures directly; the continuation lives in
  separate models (62b4ffe300004525, 62b4ffe300004489). (3) OspC3's MF is a bare
  binding term, where the paper's own conclusion is sequestration of apo-CaM.
  (4) The two CALM1 activities are one sensor activity, and neither has an
  occurs_in. (5) The paper's negative result (OspC2 binds apo-CaM but does not
  inhibit CaMKII T286 phosphorylation or IFN signalling) and OspC3's separate,
  mechanistically distinct caspase-4 ADP-riboxanase activity are both absent,
  so nothing records what OspC3 does besides this, or which family members fail
  to do it.
