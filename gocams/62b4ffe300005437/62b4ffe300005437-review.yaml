  - source_id: PMID:34409271
    supporting_text: The Shigella T3SS effector OspC3 reportedly suppresses cytosolic
      LPS sensing by inhibiting caspase-4 but not caspase-11 activity.
  notes: >-
    The claim is well supported: OspC3 binds apo-calmodulin and blocking CaMKII
    T286 autophosphorylation follows. Two issues. GO:0005516 calmodulin binding
    is a bare binding term that names the partner but not the consequence; the
    paper states the consequence as sequestration, so GO:0140311 protein
    sequestering activity is the functional typing, with calmodulin as has_input
    (already present) and the inhibitory edge carrying the consequence. The
    binding typing is also what makes the causal edge read oddly, as one binding
    activity negatively regulating another binding activity. Second, nothing in
    this model distinguishes OspC3 from OspC1: both models give the two
    effectors the same MF, process, location, input and edge, matching the
    paper, which assays them in parallel, but the paper also shows OspC2 binds
    apo-CaM without inhibiting (so the family is 2 of 3), and that OspC3's
    caspase-4 ADP-riboxanase activity is a separate, separable mechanism. GO-CAM
    cannot express the OspC2 negative here because OspC2 is not in the model; a
    NOT annotation on OspC2 for GO:0075135, or a single model holding all three
    paralogs, would capture it. OspC3 has no gene review in this repository
    (genes/SHIFL/ holds only ipaH4.5 and sctN). The occurs_in evidence,
    PMID:34409271, is a genuine OspC3 paper and supports a cytosolic site of
    action; the same reference is reused for OspC1 in the sibling model, where
    it is not an OspC1 paper.
notes: >-
  Read-only assessment; the model is not edited. This review incorporates a
  manual review by cjm ("Problematic GO-CAM models"), which treats this model
  together with its three siblings from PMID:35568036: 62b4ffe300005467 (the
  OspC1 clone of this model), 62b4ffe300004525 (IFN-beta host branch) and
  62b4ffe300004489 (IFN-gamma host branch). Points confirmed: the one mechanism
  of the paper is split four ways by the combinatorics of two OspC effectors and
  two IFN ligands, and this model and 62b4ffe300005467 differ only in the
  effector; none of the four contains the IFN -> receptor -> JAK -> STAT1
  component, which sits unconnected in 62b4ffe300003747; the CALM1 -> CALM1
  same-gene chain is here too; GO:0061891 calcium ion sensor activity is the
  right type for the CALM1 Ca2+ node; the cytosolic host activities lack
  occurs_in; the OspC2 negative result is not captured ("T286 phosphorylation
  was reduced upon expression of OspC1 or OspC3 but not OspC2", with all three
  binding apo-CaM); and the OspC cell-death activities are omitted. Points
  refined: OspC3's effector activity is better typed as GO:0140311 protein
  sequestering activity than as a bare calmodulin-binding term, which is a
  sharper statement of the "lacks the real role" criticism; the host locations
  are missing only on the cytosolic CaM activities, since the OspC node does
  carry occurs_in host cell cytoplasm; GO:0061891 is a lateral re-typing under
  molecular function regulator activity, not a child of GO:0005509; and the
  omission of the cell-death branch is partly defensible, because PMID:35568036
  demonstrates that IFN inhibition and cell-death inhibition are separable
  ("Therefore, these findings establish that OspC effectors inhibit cell death
  and IFN signaling by distinct biochemical mechanisms."), so it belongs in its
  own model rather than this one, though no such model is linked. Point where
  the omission is defensible: Pyk2 (PTK2B, Q14289) is absent and the evidence
  for it is a single pharmacological inhibitor (TyrA9), so leaving it out is a
  reasonable decision. Point added: the model terminates at a has_input, so
  CAMK2A, the entity actually inhibited, is present only as an object.
