  notes: >-
    Same assessment as in the three sibling models. GO:0005509 states that CALM1
    binds Ca2+ without saying what that accomplishes; GO:0061891 calcium ion
    sensor activity ("Binding to and responding, e.g. by conformational change,
    to changes in the cellular level of calcium ions (Ca2+)", OLS, checked
    2026-11-02) is the role. GO:0061891 is not a child of GO:0005509 (parents:
    GO:0140784 metal ion sensor activity, GO:0140299 molecular sensor activity,
    GO:0098772 molecular function regulator activity), so this is a re-typing to
    another branch and the flag is BINDING_AS_FUNCTION, not GENERIC_MF.
    Re-typing also merges this node with the following CALM1 node. One point in
    the model's favour: because OspC3 binds the Ca2+-free form, "directly
    negatively regulates CALM1 calcium ion binding" is a fair literal statement
    of the mechanism, and under a sensor typing the incoming inhibitory edge
    would have to be re-expressed as inhibition of the sensor activity. The
    CALM1 review ACCEPTs GO:0005509 but does not list it among its core
    functions, hence RELATED. No occurs_in.
