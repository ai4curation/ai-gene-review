  - source_id: PMID:35568036
    supporting_text: Ca2+/CaM/CaMKII modulate IFN signaling by potentiating STAT1 phosphorylation.
  notes: >-
    The MF matches the CALM1 review's first core function, GO:0043539, ACCEPTed
    there on an IDA row from this paper, and has_input CAMK2A is the correct
    filler for an activator activity. The problem is that has_input is the only
    thing linking CAMK2A to the model: there is no CAMK2A activity node and no
    causal edge, so this terminal node both ends the model and hides its
    continuation from any traversal that follows causal edges. The sibling
    models 62b4ffe300004525 and 62b4ffe300004489 do give CAMK2A an activity and
    a direct positive edge, which is the representation to prefer. Missing
    occurs_in, and redundant with the preceding CALM1 node.
