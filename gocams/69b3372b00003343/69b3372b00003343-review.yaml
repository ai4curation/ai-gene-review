model: gomodel:69b3372b00003343
title: FSH delivery to granulosa cells promotes follicle development  (Human)
taxon: NCBITaxon:9606
status: COMPLETE
summary: >-
  A seven-activity chain in the ovarian granulosa cell, all placed in ovarian follicle development
  (GO:0001541). The follicle-stimulating hormone complex (FSHB plus CGA) carries FSH hormone
  activity in the extracellular region and directly activates FSHR at the plasma membrane; FSHR
  directly activates Gs-alpha (GNAS, UniProtKB:P63092); Gs-alpha indirectly activates the PKA
  catalytic subunit PRKACA in the nucleus; PRKACA directly activates CREB1, with CREB1 as its input;
  CREB1 indirectly increases CYP19A1 aromatase activity at the endoplasmic reticulum membrane. AKAP8
  (AKAP95) is a side input: it takes PRKACA as input and directly positively regulates it in the
  nucleus. The causal story is right and, unlike the generic FSH model gomodel:59dc728000000351, it
  is drawn with the FSH complex, the canonical Gs-alpha entry and a direct receptor-to-Gs edge.
  Every predicate has the right directness: the two indirect edges span adenylyl cyclase-cAMP and
  transcription-translation, and the four direct ones are ligand-receptor, receptor-G protein,
  anchor-kinase and kinase-substrate. There is no use of "provides input for". The steps beyond the receptor rest on
  human granulosa-cell evidence: FSH induction of CYP19A1 promoter activity, mRNA, protein and
  estradiol in primary human cumulus granulosa cells (PMID:30541132), and, in the human KGN line and
  primary luteinised granulosa cells, a requirement for AKAP95 for nuclear PKA, FSH-induced CREB
  phosphorylation and FSH-induced CYP19A1 expression (PMID:29397057). The problems are in the
  evidence attached to individual slots. FSHR enabled_by, its location and its edge, and the FSH
  complex's location and has_input, cite PMID:27889227, a PTHR trafficking review that never mentions
  FSH. The PRKACA-to-CREB1 edge cites a study of MAP2c phosphorylation in HeLa cells, and the
  CREB1-to-aromatase edge cites a study of SRCAP on the PEPCK promoter; neither concerns its edge.
  The PRKACA and CREB1 follicle-development rows carry a malformed reference, GO_REF:000024, with no
  with/from. FSHR's granulosa-cell context carries a sequence-similarity code for a human
  immunofluorescence study. AKAP8's ovarian follicle development is nested inside itself. AKAP8 is
  typed as protein-containing complex stabilizing activity, which its evidence, an anchoring study,
  does not show. The model also omits adenylyl cyclase and cAMP, which the Gs-to-PKA edge
  summarises. It gives CREB1 no target gene, and it gives the FSH complex no process.
