    cause: UNKNOWN
    confidence: SUSPECTED
    explanation: >-
      The AKAP8 (UniProtKB:O43823) activity is typed GO:0140777 protein-containing complex
      stabilizing activity, defined as direct binding to one subunit of a complex that prevents an
      interaction with a factor that would promote dissociation of the complex. The only evidence on
      the activity, PMID:29397057, describes AKAP95 as an anchor that confines PKA to the nucleus, and
      its experiments measure nuclear PKA, CREB phosphorylation and CYP19A1 expression after
      knockdown or inhibition of AKAP95; it reports nothing about the stability or dissociation of a
      complex. An anchoring role that brings PKA to its nuclear substrate is usually represented as
      molecular adaptor activity (GO:0060090), the term used for AKAP5 in gomodel:62f58d8800004747. Please
      check which activity was meant. Two related points for the same activity: AKAP95 binds the PKA
      RIIalpha regulatory subunit (PMID:9473338), whereas has_input names the catalytic subunit
      PRKACA (UniProtKB:P17612); and the evidence for the molecular function is a knockdown and
      inhibitor experiment, which is mutant phenotype (ECO:0000315) rather than direct assay
      (ECO:0000314) evidence.
    supported_by:
    - reference_id: PMID:29397057
      supporting_text: A-Kinase anchor protein 95 (AKAP95) is known to confine PKA to the nucleus.
    - reference_id: PMID:9473338
      supporting_text: A fragment covering amino acids 414-692 of human AKAP95 was expressed in
        Escherichia coli and shown to bind RIIalpha.
  - defect_type: DUPLICATE_ASSERTION
    resource: GO_CAM
    record: gomodel:69b3372b00003343/6a2b236300001185
    slot: part_of
    requested_change: DELETE_VALUE
    asserted_value: GO:0001541
    confidence: CONFIRMED
    explanation: >-
      The AKAP8 activity's process association is ovarian follicle development (GO:0001541), and
      that process is itself given a nested part_of ovarian follicle development (GO:0001541), both
      with ECO:0000314 and PMID:29397057. A process cannot be part of itself. The GOA row exported
      from this model (O43823 involved_in GO:0001541, PMID:29397057) carries the same circular
      extension, part_of(GO:0001541). Please delete the nested part_of, or replace it with the outer
      process that was intended.
  notes: >-
    The placement of AKAP8 in the model is right. It is a side input to the PKA activity, not a step
    downstream of FSHR, and the human granulosa-cell study shows AKAP95 is needed for nuclear PKA,
    for FSH-induced CREB phosphorylation and for FSH-induced CYP19A1 expression. The nucleus and the
    granulosa-cell context are therefore supported on human evidence, and the direct edge to the PKA
    activity follows the usual GO-CAM pattern for an anchoring or adaptor protein. What is uncertain is
    the activity type (defect above) and the mechanism. The cited abstract asserts nuclear anchoring
    as background ("is known to confine PKA to the nucleus"). The study that characterised human
    AKAP95 found RIIalpha excluded from the interphase nucleus and associated with AKAP95 only in
    mitosis, so anchoring of PKA in the interphase granulosa-cell nucleus rests on the 2018 knockdown
    and inhibitor data alone, of which I have the abstract only. No gene review exists for AKAP8.
    Compartment check: the edge to the PKA activity is nucleus to nucleus; no lead.
