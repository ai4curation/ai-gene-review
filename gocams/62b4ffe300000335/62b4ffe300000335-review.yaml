  notes: 'FCGR3A/CD16A receiving a signal and triggering degranulation is the right opening for an antibody-dependent
    killing model, and the activity is correctly placed at the plasma membrane and tied to GO:0043320
    natural killer cell degranulation. The molecular function is the weak point: GO:0140375 immune receptor
    activity is a generic parent where a child clearly applies. FCGR3A itself carries GO:0019770 IgG receptor
    activity by IBA and GO:0019772 low-affinity IgG receptor activity by IDA, and CD16A is precisely a
    low-affinity IgG Fc receptor, so GO:0019772 says what this receptor does and GO:0140375 does not.
    The cell-type assertion CL:0000814 mature NK T cell contradicts the rest of the model and is recorded
    as a source defect. The outgoing edge uses RO:0002304 causally upstream of, positive effect, which
    is the appropriately hedged choice - receptor engagement reaches perforin only through degranulation,
    several steps later - and is right where the two RO:0002629 edges further down the chain are not.'
