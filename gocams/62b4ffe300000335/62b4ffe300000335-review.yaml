- activity_id: gomodel:62b4ffe300000335/62b4ffe300000378
  gene_product: UniProtKB:P14222
  molecular_function: GO:0005509
  biological_process: GO:0001913
  cellular_component: GO:0001772
  verdict: UNCERTAIN
  consistency: CONSISTENT
  notes: 'Calcium binding by perforin is real, essential and correctly placed at the immunological synapse:
    purified human perforin permeabilises nothing without calcium, and the PRF1 gene review accepts GO:0005509
    as a core molecular function, so this activity is consistent with the review. The problem is using
    it as an activity node. GO:0005509 calcium ion binding is an unqualified binding term with no functional
    consequence named, which is the BINDING_AS_FUNCTION pattern, and it is then made to directly positively
    regulate another activity of the same gene product. What the C2 domain actually does is bind the target
    membrane in a calcium-dependent way; if this step is to stand as a separate activity, GO:0005544 calcium-dependent
    phospholipid binding names it and ion binding does not. The alternative, arguably better, modelling
    is to drop this node and treat calcium as a cofactor requirement of the pore activity itself, since
    one protein regulating its own other activity through a conformational change is a single mechanism
    rather than two activities. Note that GO:0005544 is not currently annotated to PRF1 in any species,
    which the gene review raises as an open question rather than asserting. The process GO:0001913 T cell
    mediated cytotoxicity is correct only if the model''s NKT cell type is correct; see the source defect
    on activity 62b4ffe300000336, and if that is repointed to an NK cell this must become GO:0042267 natural
    killer cell mediated cytotoxicity.'
  qc_flags:
  - BINDING_AS_FUNCTION
  gene_review: genes/human/PRF1/PRF1-ai-review.yaml
  supporting_text: A C-terminal C2 domain mediates initial, Ca(2+)-dependent membrane binding.
- activity_id: gomodel:62b4ffe300000335/62b4ffe300000355
  gene_product: UniProtKB:P14222
  molecular_function: GO:0022829
  biological_process: GO:0071806
  cellular_component: GO:0005886
  verdict: UNCERTAIN
  consistency: CONSISTENT
  notes: 'The core of the model and essentially right. GO:0022829 wide pore channel activity is the term
    GO uses for this protein class - perforin''s own complement family members C6, C7, C8A, C8B, C8G and
    C9 all carry it by direct assay, as do MPEG1 and the gasdermins - and the PRF1 gene review accepts
    it as the gene''s primary core function, so this activity is consistent with the review. Nesting GO:0071806
    protein transmembrane transport inside GO:0017038 protein import is a good representation of what
    the pore accomplishes, and this is the only activity in the model that declares a has input, which
    is the right instinct for a transporter. The one flagged problem is the outgoing edge: it asserts
    RO:0002629 directly positively regulates onto granzyme B''s serine-type endopeptidase activity, which
    misdescribes the relationship. The pore does not alter that enzyme''s catalytic rate; it relocates
    the enzyme to where its substrates are, and granzyme B is proteolytically competent before it crosses.
    The model''s own comments record that this predicate arrived by an automated change in March 2023
    replacing RO:0002213 positively regulates, so the directness was not a curator''s judgement about
    this edge, and the three sibling PRF1 models use the weaker RO:0002304 for the same step. Either the
    earlier indirect predicate or a has input naming granzyme B carries the relationship properly. The
    location is the target cell''s plasma membrane, not the killer cell''s, which GO-CAM cannot express.'
