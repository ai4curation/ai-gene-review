- activity_id: gomodel:62b4ffe300000335/62b4ffe300000371
  gene_product: UniProtKB:P10144
  molecular_function: GO:0004252
  biological_process: GO:0140507
  cellular_component: GO:0005737
  verdict: OK
  consistency: NO_GENE_REVIEW
  notes: 'Granzyme B as a serine-type endopeptidase acting in the target cytoplasm within the granzyme-mediated
    programmed cell death signaling pathway is correct, specific and the right terminus for the chain;
    GO:0004252 is appropriately precise for GZMB. Graded OK: the two issues worth noting are minor and
    neither contradicts the evidence. GO:0005737 cytoplasm is coarse where GO:0005829 cytosol would be
    more precise, given that the pathway proceeds through cytosolic substrates - but cytoplasm is not
    wrong. And the activity declares no has input, so no substrate is named; caspase-3 and BID are the
    classical ones, with gasdermin E the relevant substrate where the outcome is pyroptosis rather than
    apoptosis, which the sibling models represent. That absence is not flagged, because the cache cannot
    show what any has input names (see the model notes), so a reviewer cannot tell a missing input from
    an unnamed one. No gene review exists for GZMB in this repository, so consistency cannot be assessed;
    GZMB would be a good next gene to review, since it is the one granule effector already carrying GO:0042267
    by direct assay and is the comparator that justified proposing that term for PRF1.'
  supporting_text: The pores allow granzyme entry, which rapidly triggers the apoptotic death of the target
    cell.
