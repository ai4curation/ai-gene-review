notes: 'Checks run and dismissed, so they are not reopened: just gocam-compartments reports no unresolved
  locations and no non-adjacent edges for this model (3 RESOLVED, 1 COARSE, edges 2 SAME and 1 ADJACENT).
  The single COARSE location is GO:0005737 cytoplasm on the granzyme B activity; GO:0005829 cytosol would
  be more precise, since granzyme B acts on cytosolic substrates after escaping the endosome, but cytoplasm
  is defensible and is not flagged. Two compartment points that the automated check cannot see and that
  are not defects: the plasma membrane of the receptor activity is the killer cell''s while the plasma
  membrane of the pore activity is the target cell''s, and the cytoplasm of the granzyme activity is likewise
  the target''s. GO-CAM has no way to say which cell a compartment belongs to, so the model reads as though
  all four activities happen in one cell. Worth keeping in mind when reading the chain; nothing in the
  model is wrong because of it.


  Not modelled, and arguably the bigger omission for perforin: the endosomal delivery route. The reference
  behind three of these activities, PMID:20038786, is the paper showing that perforin triggers clathrin-
  and dynamin-dependent endocytosis that removes perforin and granzymes from the plasma membrane into
  early endosomes, and the same group then showed perforin forming pores in that endosomal membrane to
  release granzyme B into the cytosol (PMID:21685908). The model represents only the plasma-membrane pore.
  Which route predominates is genuinely disputed, so this is a scope observation rather than an error;
  a second pore activity occurring in GO:0010008 endosome membrane would represent the alternative the
  cited evidence actually supports.


  The title says ''Perforin maturation'', but no maturation step is modelled. Perforin does undergo a
  real maturation event - proteolytic removal of a C-terminal glycosylated propeptide in the granule,
  required for activity - and if that is what the title means, the activity is missing; if ''maturation''
  is meant loosely for the calcium-binding and oligomerisation steps, the title is misleading. Not recorded
  as a defect either way, since it is a title rather than an assertion.


  Two things that look like defects in the cached model are artifacts of this repository''s cache and
  were withdrawn from this review after checking them across the whole corpus. (1) No activity in this
  model carries evidence on its molecular_function association - but neither does any of the 12,585 activities
  in the 2,036 cached models, so the gocam-py serialisation in <id>-src.yaml does not carry MF evidence
  and nothing can be concluded about what the upstream model holds. (2) The perforin pore activity declares
  a has input association (RO:0002233) with its own IDA evidence from PMID:20038786, but the entity it
  names is null in the cache - and that is true of all 19,378 molecular_associations in the corpus, 100%
  of them, so the cache records that a has input exists and drops what it points to. The upstream model
  therefore does have a has input on the pore activity; whether it names granzyme B, which is what a transport
  activity''s cargo should be, cannot be determined from these files and was not flagged. Both are worth
  raising as repository tooling issues rather than as curation defects, and the second one matters for
  any future GO-CAM review here, since has input correctness is one of the six things this skill asks
  a reviewer to assess and it is currently unreviewable.


  Cross-model comparison with the four other cached models containing PRF1 (61e0e55600001659, 62b4ffe300000081,
  6348a65d00000594, 6348a65d00000661). The perforin activity is modelled identically in the three pyroptosis
  models - GO:0022829, occurs_in GO:0005886, part_of GO:0071806 - which is the same shape as this model
  and is reassuring. In all three, however, the edge from the perforin pore to the downstream granzyme
  activity uses RO:0002304 causally upstream of, positive effect, not the RO:0002629 directly positively
  regulates asserted here. That makes this model the outlier on the very edge flagged below, and the majority
  choice is the one this review argues for. 62b4ffe300000081 differs more: it gives PRF1 two activities,
  both occurs_in GO:0016020 membrane rather than a specific membrane, and one of them is part_of GO:0009306
  protein secretion - the framing the PRF1 gene review re-levels to GO:0071806 protein transmembrane transport,
  since efflux of caspase-7 through a lytic pore is not regulated secretion. That model has its own review.'
