model: gomodel:62b4ffe300000335
title: Perforin maturation leading to granzyme-mediated programmed cell death signaling pathway (Human)
taxon: NCBITaxon:9606
status: COMPLETE
summary: 'Read on its own terms, the model tells a four-step antibody-dependent killing story: an Fc receptor
  on the killer cell receives a signal and triggers degranulation; released perforin binds calcium; calcium-loaded
  perforin forms a pore in the target membrane; granzyme B, delivered through it, cleaves its substrates
  in the target cytoplasm and runs the death programme. That chain is biologically right and is the correct
  shape for perforin - the pore is the activity and granzyme delivery is what it is for - and the compartments
  are sound, with no unresolved locations and no non-adjacent edges. Three problems sit on top of it.
  First and most consequential, the model is an NK-cell model by every piece of evidence it cites - CD16A/FCGR3A,
  natural killer cell degranulation, and three references all about human NK cells, including the one
  supplying the IDA for the cell type itself - but its only cell-type assertion is CL:0000814 mature NK
  T cell, one transposed digit from CL:0000824 mature natural killer cell. Correcting it makes GO:0042267
  natural killer cell mediated cytotoxicity the right process in place of GO:0001913, and GO:0042267 is
  exactly the term the PRF1 gene review independently proposes as a gap in the gene''s record; the two
  assertions have to move together. Second, the FCGR3A activity uses the generic GO:0140375 immune receptor
  activity where the gene''s own GO:0019772 low-affinity IgG receptor activity applies. Third, an automated
  change in March 2023 replaced RO:0002213 positively regulates with RO:0002629 directly positively regulates
  throughout, which over-claims directness from the pore onto granzyme B''s protease activity: the pore
  does not change that enzyme''s catalytic rate, it moves the enzyme to its substrates, and the three
  sibling PRF1 models use the weaker RO:0002304 for the same step. Separately, the perforin calcium-binding
  node is a bare binding term used as an activity, which would be better stated as calcium-dependent phospholipid
  binding or folded into the pore activity as a cofactor requirement. Two further apparent defects - no
  evidence on any molecular_function, and an unnamed has input on the pore - were checked across all 2,036
  cached models and are artifacts of this repository''s cache rather than properties of the model; they
  are recorded in the notes and withdrawn from the activity reviews.'
