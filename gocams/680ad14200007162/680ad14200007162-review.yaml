  notes: >-
    The model places LAMP2/LAMP-2A protein-macromolecule adaptor activity at
    the lysosomal membrane, part_of chaperone-mediated autophagy and nested
    under positive regulation of ferroptosis. The LAMP2 review accepts
    chaperone-mediated autophagy as LAMP-2A's core pathway, keeps positive
    regulation of ferroptosis as a non-core downstream output of GPX4
    degradation, and treats GO:0030674 as compatible but broader than the ideal
    "CMA receptor/translocation component" description; no existing specific
    child term captures that receptor/translocation role. PMID:11082038 used rat
    LAMP-2A, so the GO-CAM's human lysosomal-membrane IDA rests on conserved CMA
    biology and the curator's judgement.
