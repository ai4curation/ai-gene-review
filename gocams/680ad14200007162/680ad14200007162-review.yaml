notes: >-
  This model is already cited by the GPX4 abundance switch in
  modules/ferroptosis.yaml. The GO-CAM expands the switch's destabilizer arm
  with an explicit HSPA8 activity, while the module deliberately factors the
  reusable HSPA8-to-LAMP2A delivery mechanism into
  modules/chaperone_mediated_autophagy.yaml and leaves GPX4-specific
  degradation consequences in the ferroptosis module. No module edit is needed:
  the GO-CAM and module agree that CMA lowers GPX4 abundance and thereby
  promotes ferroptosis, and the pre-existing CMA module covers the generic
  HSPA8/LAMP2A handoff for soluble KFERQ-like substrates. The direct
  LAMP2A-to-GPX4 negative causal edge is a compressed but acceptable edge from
  the receptor/translocation step that commits GPX4 to lysosomal degradation;
  downstream lysosomal hydrolases execute the final proteolysis. The duplicated
  GPX4 molecule individuals are cargo inputs for the HSPA8 and LAMP2A steps,
  not separate gene products. `just gocam-lint` reports only advisory
  missing_location and no_narrative rows, and `just gocam-compartments` finds no
  unresolved locations or nonadjacent causal edges; manual review additionally
  notes that HSPA8 occurs_in GO:0005737 is broad for a cytosolic CMA-recognition
  activity.
