    phospholipid-hydroperoxide glutathione peroxidase activity directly reduces
    membrane lipid hydroperoxides and is part_of negative regulation of
    ferroptosis. This matches the GPX4 review's core
    GO:0047066/GO:0110076 function and the GPX4 defense-factor annoton in
    modules/ferroptosis.yaml. The source GO-CAM omits an occurs_in location;
    this should be cytosolic or otherwise isoform-qualified for the GPX4 pool
    accessed by CMA.
