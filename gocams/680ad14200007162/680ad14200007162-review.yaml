  notes: >-
    The model places LAMP2/LAMP-2A protein-macromolecule adaptor activity at
    the lysosomal membrane, part_of chaperone-mediated autophagy and nested
    under positive regulation of ferroptosis. The LAMP2 review accepts
    chaperone-mediated autophagy as LAMP-2A's core pathway, accepts
    positive regulation of ferroptosis as a specific downstream output of
    GPX4 degradation, and treats GO:0030674 as compatible but broader than
    the ideal "CMA receptor/translocation component" description.
