    resource: GO_CAM
    record: gomodel:680ad14200007162/680ad14200007175
    slot: occurs_in
    requested_change: CHECK
    asserted_value: GO:0005737 / PMID:17289661
    corrected_value: GO:0005829 / PMID:11559757
    corrected_label: cytosolic-side HSPA8/Hsc70 CMA substrate recognition
    confidence: PROBABLE
    explanation: >-
      HSPA8's substrate-recognition step in chaperone-mediated autophagy is
      placed at broad cytoplasm using PMID:17289661 as ECO:0000314 evidence. That
      paper isolated IMP1-containing ribonucleoprotein granules and is good
      general evidence for cytoplasmic HSPA8, but it is not about the CMA
      HSPA8/Hsc70 activity or the side of the lysosomal membrane where that
      activity happens. PMID:11559757 directly places Hsc70 on the cytosolic side
      of the lysosomal membrane while it binds CMA substrates, so the GO-CAM
      should check this occurs_in term and evidence and either use a
      cytosol/lysosomal-surface location supported by that reference or retain
      broad cytoplasm only if a CMA-specific source requires it.
    supported_by:
    - reference_id: PMID:17289661
      supporting_text: >-
        We isolated the IMP1-containing RNP granules and found that they
        represent a unique RNP entity
    - reference_id: PMID:11559757
      supporting_text: >-
        is associated with the cytosolic side of the lysosomal membrane where it
        binds to substrates of this proteolytic pathway
  notes: >-
    HSPA8/HSC70 substrate-recognition activity is modelled as a
    protein-macromolecule adaptor in chaperone-mediated autophagy, with GPX4
    and LAMP2 inputs and a provides_input_for edge into the LAMP2A activity. GPX4
    is the CMA cargo; LAMP2 is interpreted as the LAMP-2A docking partner that
    HSPA8 hands the cargo to, overlapping but not contradicting the causal edge.
    The cached abstract supports HSC70 binding to GPX4 during autophagic
    degradation, and the CMA-specific typing follows the GO-CAM curator's full
    article assessment. The HSPA8 review already records the same
    GO:0030674/GO:0061684 pair as a core CMA function and keeps the nested
    GO:0160020 positive regulation of ferroptosis claim as non-core. GO:0030674
    is broad but is the available local term for KFERQ-substrate-recognition
    adaptor activity; no more specific GO child is available. The
    cellular_component value GO:0005737 is a broad cytoplasm term, whereas the
    reusable chaperone-mediated autophagy module places this substrate-recognition
    step more precisely in GO:0005829 cytosol. The GO-CAM backs that broad
    occurs_in with PMID:17289661, an IMP1 RNP-granule proteomics paper that
    supports HSPA8 in cytoplasm generally but does not support the CMA-specific
    location; PMID:11559757 is the more direct local source for Hsc70 on the
    cytosolic side of the lysosomal membrane where it binds CMA substrates.
