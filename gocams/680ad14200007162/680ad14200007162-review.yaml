model: gomodel:680ad14200007162
title: GPX4 is degraded via chaperone-mediated autophagy (Human).
taxon: NCBITaxon:9606
status: COMPLETE
summary: >-
  This compact human model represents chaperone-mediated autophagy of GPX4 as
  the destabilizing branch of a ferroptosis defense-factor switch. Cytosolic
  HSPA8/HSC70 adaptor activity binds GPX4 and LAMP2, provides input for the
  lysosomal-membrane LAMP2A CMA-receptor activity, and the LAMP2A activity
  directly negatively regulates GPX4 phospholipid-hydroperoxide glutathione
  peroxidase activity, thereby making CMA of GPX4 part of positive regulation of
  ferroptosis. The activities agree with the completed GPX4, HSPA8 and LAMP2
  reviews and with the GPX4 switch already modelled in modules/ferroptosis.yaml.
  The only local quality issue is the missing occurs_in value on the GPX4
  peroxidase node.
