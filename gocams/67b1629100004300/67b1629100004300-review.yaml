model: gomodel:67b1629100004300
title: CHRNA9 nAChR sodium channel activity. (Human)
taxon: NCBITaxon:9606
status: COMPLETE
summary: >-
  This compact model asserts a single human CHRNA9 alpha9 activity: the
  plasma-membrane receptor enables acetylcholine-gated cation-selective channel
  activity in the acetylcholine receptor signaling pathway, with sodium as the
  transported cation and acetylcholine represented as an activator. The MF/BP
  assertion is supported by the cloned human alpha9/alpha10 expression evidence
  and is consistent with the completed local CHRNA9 review. The source model is
  also already aligned to the alpha9/alpha10 nicotinic receptor annoton in
  modules/acetylcholine_signaling.yaml; that module adds the CHRNA10 partner
  subunit and notes that related sibling GO-CAMs model calcium and potassium
  permeation through the same broad cation-channel MF.
activity_reviews:
- activity_id: gomodel:67b1629100004300/67b1629100004304
  gene_product: UniProtKB:Q9UGM1
  molecular_function: GO:0022848
  biological_process: GO:0095500
  cellular_component: GO:0005886
  verdict: UNCERTAIN
  qc_flags:
  - MISSING_EVIDENCE
  - COMPLEX_SUBUNIT_REPRESENTATION
  consistency: CONSISTENT
  gene_review: file:human/CHRNA9/CHRNA9-ai-review.yaml
  evidence:
  - source_id: PMID:11752216
    statement: >-
      Cloned human alpha9 and alpha10 coassemble into functional
      acetylcholine-responsive receptors, grounding the GO:0022848 channel
      function and GO:0095500 acetylcholine receptor signaling process used by
      this activity.
    supporting_text: >-
      it promoted robust acetylcholine-evoked currents when coinjected with
      alpha9.
  - source_id: PMID:25282151
    statement: >-
      The cited structure is informative for the human CHRNA9 extracellular
      domain but is not a complete alpha9/alpha10 plasma-membrane channel.
    supporting_text: >-
      the monomeric state of human neuronal α9 nicotinic acetylcholine receptor
      (nAChR)
  source_defects:
  - defect_type: WRONG_EVIDENCE_CODE
    resource: GO_CAM
    record: gomodel:67b1629100004300/67b1629100004304
    slot: occurs_in evidence
    requested_change: CHECK
    asserted_value: ECO:0000314 / PMID:25282151
    cause: CONTEXT_NOT_ASSAYED
    confidence: SUSPECTED
    explanation: >-
      This CHRNA9 activity occurs_in GO:0005886 plasma membrane with
      PMID:25282151 as direct assay evidence. The cited abstract-only paper crystallized
      soluble, monomeric human alpha9 extracellular-domain constructs and
      alpha-bungarotoxin-bound states rather than assaying a complete
      membrane-spanning alpha9/alpha10 channel at the plasma membrane. The
      plasma-membrane assertion is biologically plausible and consistent with
      the completed local CHRNA9 review, whose corresponding IDA/PMID:25282151
      row is accepted using independent receptor-function evidence, but GO-CAM
      curators should check whether this location edge needs a functional
      receptor reference or an orthology-transfer evidence code.
    supported_by:
    - reference_id: PMID:25282151
      supporting_text: >-
        despite the absence of a complementary subunit and transmembrane domain
  - defect_type: WRONG_TERM
    resource: GO_CAM
    record: gomodel:67b1629100004300/67b1629100004312
    slot: located_in
    requested_change: REPOINT
    asserted_value: GO:0005737
    corrected_value: GO:0005576
    corrected_label: cellular_component
    cause: OTHER
    confidence: PROBABLE
    explanation: >-
      The sodium has_input molecule gomodel:67b1629100004300/67b1629100004312
      is localized to GO:0005737 cytoplasm even though the channel occurs in
      the plasma membrane and the separate sodium has_output molecule is also
      cytoplasmic. This makes the sodium transport edge cytoplasm-to-cytoplasm
      rather than extracellular-to-cytoplasm. The sibling potassium model
      gomodel:67b1629100004130 and the CHRNA9/CHRNA10 complex model
      gomodel:67b1629100004393 place the input ion in GO:0005576 after the same
      automated replacement of GO:0005615.
  notes: >-
    The MF and process match the CHRNA9 review's accepted
    alpha9/alpha10 receptor activity. The source model records CHRNA9 as the
    enabled_by gene product, while modules/acetylcholine_signaling.yaml models
    the physiologic human alpha9/alpha10 heteromer by including CHRNA10 as the
    partner subunit and the cached GO-CAM set already contains a separate
    CHRNA9/CHRNA10 protein-complex model for the same channel MF at
    gomodel:67b1629100004393. The single-subunit CHRNA9 projection is therefore
    under-specified rather than irreconcilable, and it does not require a local
    module edit. The RO:0012001 edge to acetylcholine is an
    activator relation, not a receptor has_input filler. PMID:22774872, cited on
    that activator edge in the cached GO-CAM, is not locally cached and was not
    quote-checked here. The sodium has_input/has_output molecules are both
    localized to cytoplasm, with the has_output molecule carrying no evidence
    on its location. Because this one-activity model has no causal edges, `just
    gocam-compartments` reported no unresolved or nonadjacent activity-to-activity
    edges; it does not check this intra-activity translocation defect.
references:
- id: PMID:11752216
  title: A novel human nicotinic receptor subunit, alpha10, that confers functionality
    to the alpha9-subunit.
- id: PMID:25282151
  title: Crystal structures of free and antagonist-bound states of human α9 nicotinic
    receptor extracellular domain.
notes: >-
  The model overlaps the alpha9/alpha10 branch in
  modules/acetylcholine_signaling.yaml, where the exact activity is already
  cited by the alpha9/alpha10 annoton. The cached source has no causal edges;
  `just gocam-lint` reports only the advisory no_narrative and small_model INFO
  rows. Sibling GO-CAMs gomodel:67b1629100004130,
  gomodel:67b1629100004322 and gomodel:67b1629100004393 represent nearby
  potassium, calcium and alpha9/alpha10 protein-complex views of the same
  broad cation-channel MF.
