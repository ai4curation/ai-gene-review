model: gomodel:6690711d00000596
title: ' NMDA glutamate receptor activity co-activated by glycine and involving GRIN1 and GRIN2A (human)'
taxon: NCBITaxon:9606
status: COMPLETE
summary: GluN1 (GRIN1) and GluN2A (GRIN2A) each carry NMDA glutamate receptor activity at the postsynaptic membrane
  of a neuron; glycine activates GluN1 and L-glutamate activates GluN2A. The two subunit activities each "directly
  positively regulate" (RO:0002629) a third activity enabled by the complex term. The ligand each subunit senses
  is attached to that subunit as a small-molecule activator (RO:0012001), and ion flux (has input / has output)
  sits on the complex activity. The complex activity moves Ca2+ and Na+ (same ion as input and output, i.e. transport)
  and is part of monoatomic cation transmembrane transport, itself part of regulation of synaptic plasticity. The
  ligand-to-subunit assignment is correct and agrees with the GRIN1 review. Function and transport evidence is direct
  (human recombinant receptors); location and the plasticity process are transferred from rat and mouse. The model
  comment asks whether K+ efflux should be added; it is not modelled.
