model: gomodel:69ea894900000181
title: PARP1 stabilizes AFF1 involved in transcriptional restart after DNA damage
  (Human)
taxon: NCBITaxon:9606
status: COMPLETE
summary: >-
  This compact human model captures the DNA-damage transcriptional-restart
  branch in which PARP1 ADP-ribosylates AFF1, thereby removing AFF1 as an input
  for SIAH1-mediated ubiquitination and stabilizing the AFF1-containing super
  elongation complex at sites of DNA damage. The AFF1 node is consistent with
  the AFF1 review and is already pinned by the RNA polymerase II elongation and
  termination module. The PARP1 and SIAH1 nodes use correct generic enzymatic
  functions and correct AFF1 has_input fillers; they are not added to the
  module because PARP1 and SIAH1 regulate the SEC in this damage-recovery model
  rather than forming its core elongation machinery. The only best-practice
  issues are that the PARP1 and AFF1 activities use site of DNA damage without
  an explicit nuclear or chromatin compartment, and the SIAH1 ubiquitin ligase
  activity lacks an occurs_in value even though this edge belongs to a nuclear
  DNA-damage transcription-restart branch.
activity_reviews:
- activity_id: gomodel:69ea894900000181/69ea894900000182
  gene_product: UniProtKB:P09874
  molecular_function: GO:0140805
  biological_process: GO:0032786
  cellular_component: GO:0090734
  verdict: OK
  qc_flags:
  - UNRESOLVED_COMPARTMENT
  consistency: CONSISTENT
  gene_review: file:human/PARP1/PARP1-ai-review.yaml
  evidence:
  - source_id: PMID:41062835
    statement: >-
      PARP1 PARylates AFF1 after DNA damage in a Siah1-targeted region,
      preventing AFF1 ubiquitination and supporting transcriptional recovery.
    supporting_text: >-
      Upon DNA damage, PARP1 binds to and PARylates AFF1 in a region targeted by
      the E3 ligase Siah1, preventing AFF1 ubiquitination and promoting its
      stability. This stabilization supports efficient transcriptional recovery
      after DNA damage.
  - source_id: PMID:32028527
    statement: >-
      HPF1 switches DNA-damage PARP1/PARP2 ADP-ribosylation toward
      serine-linked modification, supporting the GO:0140805 molecular function
      used on this PARP1 activity.
    supporting_text: >-
      These post-translational modifications are predominantly serine-linked
      and require the accessory factor HPF1, which is specific for the DNA
      damage response and switches the amino acid specificity of PARP1 and
      PARP2 from aspartate or glutamate to serine residues5-10.
  - source_id: PMID:27256882
    statement: >-
      PARP1-dependent ADP-ribosylation also promotes Pol II pause release by
      modifying NELF-E, corroborating a positive role for PARP1 catalytic
      activity in transcription elongation.
    supporting_text: >-
      Depletion or inhibition of PARP-1 or mutation of the ADP-ribosylation
      sites on NELF-E promotes Pol II pausing
  notes: >-
    The molecular function is PARP1's HPF1-dependent serine
    ADP-ribosyltransferase activity, which is a core function in the PARP1
    review. The model has the right AFF1 has_input target and the
    transcript-restart paper supports an RO:0012010 "removes input for" edge:
    PARP1 PARylation protects AFF1 from SIAH1-mediated ubiquitination rather
    than increasing SIAH1 ligase activity. Consistency is CONSISTENT because the
    local PARP1 review records GO:0140805 as a core DNA-damage-response
    molecular function; the activity's GO:0032786 part_of term is a
    non-core transcriptional output of the same catalytic activity. GO:0090734
    site of DNA damage was checked as a compartment lead: it marks the lesion
    site but does not by itself resolve to a distinct nuclear compartment, so
    the UNRESOLVED_COMPARTMENT flag is retained.
