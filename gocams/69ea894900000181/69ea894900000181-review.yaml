  source_defects:
  - defect_type: WRONG_TERM
    resource: GO_CAM
    record: gomodel:69ea894900000181/69ea894900000245
    slot: part_of
    requested_change: REPOINT
    asserted_value: GO:0032786
    corrected_value: GO:0032968
    corrected_label: positive regulation of transcription elongation by RNA polymerase II
    confidence: PROBABLE
    explanation: >-
      The AFF1 activity is part_of GO:0032786 positive regulation of
      DNA-templated transcription, elongation. AFF1 acts in the RNA polymerase
      II super elongation complex, the same PMID:41062835 evidence supports the
      Pol II-resolved child GO:0032968 on the local AFF1 review, and GOA
      already carries the child for AFF1 from that reference. Please repoint
      this GO-CAM activity to GO:0032968.
    supported_by:
    - reference_id: PMID:41062835
      supporting_text: AFF1 depletion impairs DNA repair and survival
  notes: >-
    AFF1's transcription elongation factor activity at DNA-damage sites matches
    the second core function in the local AFF1 review. The model uses
    GO:0003711 as enabled_by AFF1, while the gene review deliberately records
    the term as contributes_to_molecular_function because the assembled SEC,
    not AFF1 alone, delivers elongation factor activity. That qualifier nuance
    does not contradict the activity, because the activity's enabled_by is also
    part_of GO:0032783 super elongation complex. The same review records the
    GO:0032786 row from PMID:41062835 as MODIFY, not ACCEPT, because
    GO:0032968 is the Pol II-specific child supported by the same reference and
    GOA already supplies that child for AFF1. GO:0090734 site of DNA damage was
    checked as a compartment lead: the AFF1 gene review verified that it is not
    an is_a/part_of descendant of GO:0000785 chromatin, so the activity still
    needs an explicit compartment term for cellular reasoning.
    modules/rna_polymerase_ii_elongation_and_termination.yaml already pins this
    exact activity on its super_elongation_complex annoton. PMID:41062835 is
    abstract-only in the local cache, so the AFF1/PARP1/SIAH1 mechanism awaits
    full-text verification.
