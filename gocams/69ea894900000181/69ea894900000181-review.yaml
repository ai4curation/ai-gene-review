model: gomodel:69ea894900000181
title: PARP1 stabilizes AFF1 involved in transcriptional restart after DNA damage
  (Human)
taxon: NCBITaxon:9606
status: COMPLETE
summary: >-
  This compact human model captures the DNA-damage transcriptional-restart
  branch in which PARP1 ADP-ribosylates AFF1, thereby removing AFF1 as an input
  for SIAH1-mediated ubiquitination and stabilizing the AFF1-containing super
  elongation complex at sites of DNA damage. The AFF1 node is consistent with
  the AFF1 review and is already pinned by the RNA polymerase II elongation and
  termination module. The PARP1 and SIAH1 nodes use correct generic enzymatic
  functions and correct AFF1 has_input fillers; they are not added to the
  module because PARP1 and SIAH1 regulate the SEC in this damage-recovery model
  rather than forming its core elongation machinery. The only best-practice
  issue is that the SIAH1 ubiquitin ligase activity lacks an occurs_in value,
  leaving the model to infer the nuclear or chromatin context from the AFF1 and
  PARP1 nodes.
