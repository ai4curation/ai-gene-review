    confidence: SUSPECTED
    explanation: >-
      The SIAH1 ubiquitin-protein ligase activity has no occurs_in value, but
      the AFF1 input suggests this specific activity is either the cytoplasmic
      basal ubiquitination event blocked after DNA damage or a nucleoplasmic
