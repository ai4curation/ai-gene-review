notes: >-
  Read-only assessment; the cached GO-CAM was not edited. The model overlaps
  only the super_elongation_complex annoton in
  modules/rna_polymerase_ii_elongation_and_termination.yaml. Its PARP1 and SIAH1
  activities are damage-specific regulation of that annoton rather than new
  parts of the species-neutral core RNA polymerase II elongation module, so no
  module edit was needed. Consistency values are judged on the activity's
  molecular function and biological process compared with accepted core
  functions in the gene review; cellular-component caveats, missing locations
  and substrate catalog gaps are carried separately in qc_flags, source_defects
  and notes. Verdicts are stricter: an activity with an unresolved compartment,
  a missing location or a requested upstream source change stays UNCERTAIN
  until the GO-CAM is checked.
