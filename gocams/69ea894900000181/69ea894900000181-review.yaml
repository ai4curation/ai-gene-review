  notes: >-
    SIAH1 is correctly typed as a ubiquitin protein ligase, and AFF1 is the
    relevant has_input substrate for the edge that removes the
    GO:0003711-bearing AFF1 activity. The local SIAH1 review records
    GO:0061630 and GO:0043161 as core molecular-function/process claims, so
    the model is consistent with the generic ligase review. The review does not
    yet mention AFF1 as a substrate; this GO-CAM extends the reviewed substrate
    catalogue without contradicting it. The activity is missing an occurs_in
    term. The AFF1 substrate implies that GO-CAM curators should check whether
    this is cytoplasmic basal AFF1 ubiquitination that PARP1 blocks after DNA
    damage, or whether it occurs in SIAH1's real but secondary nucleoplasmic
    pool.
