    explanation: >-
      The CDK1 activity in the ULK3-to-GLI2 branch cites PMID:31279575, but that
      paper assays the Fused-family kinases ULK3 and STK36/mFu and does not mention
      CDK1, CDC2 or cyclins. The model already has ULK3 upstream with GLI2 as input,
      so if CDK1 was intended as a second copy of the ULK3 activity then this row
      should be deleted. If CK1 was keyed as CDK1, the row belongs instead on the
      casein kinase 1 isoform the curator judges was assayed.
    supported_by:
    - reference_id: PMID:31279575
      supporting_text: through the Fu-family kinases ULK3 and mFu/STK36
  notes: >-
    CDK1 is a real cyclin-dependent serine/threonine kinase, but the Hedgehog/GLI2
    row citing PMID:31279575 is not supported; the existing CDK1 review records the
    same miscitation. The activity also lacks an occurs_in value.
