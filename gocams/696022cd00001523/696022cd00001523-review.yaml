  notes: >-
    ULK3 has the right molecular function, the right GLI2 input, and the right
    Hedgehog activation process. Its own activity should be located at the ciliary
    tip or ciliary base in this branch; without an occurs_in, the direct edge to the
    GLI2 phosphorylation branch cannot be compartment-checked. The causal edge points
    to the erroneous CDK1 node above rather than directly to the modeled GLI2
    activation/release step, so the activity is biologically right but the local
    wiring remains incomplete until the CDK1 node is removed or rewired.
