model: gomodel:696022cd00001523
title: Smoothened (SMO) activation by cholesterol triggers a signaling that promotes
  (1) GLI2 transcription activator activity via phosphorylation of GLI2 by ULK3 and
  (2) inhibits the smoothened signaling inhibitor GPR161 (Human).
taxon: NCBITaxon:9606
status: COMPLETE
summary: >-
  Human SMO is modeled in two active-cilium branches. In one branch, oxysterol-activated
  SMO at the non-motile cilium membrane engages Gi and, redundantly, stimulates ULK3
  phosphorylation of GLI2; GNAI1 is connected to ciliary ADCY3 as an inhibitor of
  cAMP production, and ULK3 points through a second kinase node toward release of GLI2
  from SUFU. In the other branch, activated ciliary SMO sequesters the PKA catalytic
  subunit and inhibits its cAMP-dependent kinase activity, opposing the ciliary GPR161
  pathway that raises local cAMP through Gs. SMO, GPR161, SUFU and GLI2 agree with
  their human gene reviews, and the new ULK3 review keeps the ULK3 kinase activity in
  Hedgehog signaling. The main modeling error is the CDK1 activity between ULK3 and
  SUFU: the cited Fused-family-kinase paper supports GLI2 phosphorylation by ULK3/STK36,
  not CDK1. ULK3 and PKA also lack locations even though this branch is explicitly
  ciliary.
