model: gomodel:62b4ffe300005467
title: Inhibition of the JAK-STAT pathway by S.flexneri OspC1 that blocks calcium-binding
  to calmodulin (Human)
taxon: NCBITaxon:9606
status: COMPLETE
summary: >-
  A three-activity model of host-pathogen interference, structurally identical
  to 62b4ffe300005437 with OspC1 in place of OspC3. The Shigella flexneri type
  III effector OspC1 (UniProtKB:Q8VSJ7), typed with GO:0005516 calmodulin
  binding, has_input CALM1, occurs_in host cell cytoplasm (GO:0030430) of an
  epithelial cell, part_of symbiont-mediated suppression of host
  calcium-mediated signal transduction (GO:0075135), directly negatively
  regulates (RO:0002630) host CALM1 calcium ion binding (GO:0005509), which
  directly positively regulates CALM1 protein serine/threonine kinase activator
  activity (GO:0043539, has_input CAMK2A). Both host activities are part_of
  cellular response to interferon-beta (GO:0035458) within positive regulation
  of receptor signaling pathway via JAK-STAT (GO:0046427). The mechanism is
  correct and well evidenced by PMID:35568036. The problems are those of the
  OspC3 clone. (1) Two models for one claim: every term, relation and reference
  is shared with 62b4ffe300005437, and the paper assays the two effectors in
  parallel as doing the same thing. (2) The model ends at a has_input: CAMK2A is
  an object of the CALM1 activator activity, not an activity, so the chain stops
  before the kinase that is inhibited and well before STAT1, which the paper
  measures. (3) OspC1's MF is a bare binding term where the paper concludes
  sequestration of apo-CaM. (4) The two CALM1 activities are one sensor
  activity, and neither carries an occurs_in. (5) Neither the OspC2 negative
  result nor OspC1's separate role in blocking caspase-3/7 apoptosis is
  represented. In addition, the occurs_in evidence is PMID:34409271, a study of
  OspC3, not OspC1.
