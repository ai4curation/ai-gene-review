  notes: >-
    The MF matches the CALM1 review's first core function, GO:0043539, ACCEPTed
    there on an IDA row from this paper, and has_input CAMK2A is the correct
    filler for an activator activity. But has_input is the only link to CAMK2A:
    there is no CAMK2A activity and no causal edge, so this terminal node ends
    the model and hides its continuation from any traversal following causal
    edges, which is why pathway viewers draw this model as stopping at CALM1.
    The sibling models 62b4ffe300004525 and 62b4ffe300004489 do give CAMK2A an
    activity with a direct positive edge; that is the representation to prefer.
    Missing occurs_in, and redundant with the CALM1 calcium ion binding node.
