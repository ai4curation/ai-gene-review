    confidence: PROBABLE
    explanation: >-
      The occurs_in GO:0030430 host cell cytoplasm assertion for OspC1 carries
      ECO:0000314 (direct assay) with PMID:34409271, "Shigella OspC3 suppresses
      murine cytosolic LPS sensing". That paper is about OspC3 and does not
      assay OspC1; the same reference is used for the OspC3 node in the sibling
      model 62b4ffe300005437, where it is appropriate. Either a reference that
      localises OspC1 itself should be cited, or the inference should be
      recorded as such rather than as a direct assay. The duplication is a sign
      that this model was cloned from the OspC3 model with only the effector
      changed.
    supported_by:
    - reference_id: PMID:34409271
      supporting_text: The Shigella T3SS effector OspC3 reportedly suppresses cytosolic
        LPS sensing by inhibiting caspase-4 but not caspase-11 activity.
  notes: >-
    The claim itself is well supported: OspC1 binds apo-calmodulin, blocks
    CaMKII T286 autophosphorylation and abolishes IFN-beta-induced STAT1
    phosphorylation. Two typing issues, identical to the OspC3 model. GO:0005516
    calmodulin binding names the partner but not the consequence; the paper
    concludes sequestration, so GO:0140311 protein sequestering activity is the
    functional typing, with calmodulin as has_input (already present) and the
    inhibitory edge carrying the consequence. The binding typing is also what
    makes the causal edge read as one binding activity negatively regulating
    another. Second, the model asserts nothing that distinguishes OspC1 from
    OspC3, while the paper does distinguish the family: OspC2 binds apo-CaM yet
    does not inhibit, so only 2 of 3 members carry this function, and OspC1
    separately blocks caspase-3/7 apoptosis through an unidentified target. A
    NOT annotation on OspC2, or a single model covering all three paralogs,
    would record the negative. OspC1 has no gene review in this repository
    (genes/SHIFL/ holds only ipaH4.5 and sctN).
