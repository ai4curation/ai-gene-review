  notes: >-
    Same assessment as in the three sibling models. GO:0005509 says CALM1 binds
    Ca2+ without saying what that accomplishes; GO:0061891 calcium ion sensor
    activity ("Binding to and responding, e.g. by conformational change, to
    changes in the cellular level of calcium ions (Ca2+)", OLS, checked
    2026-11-02) is the role. GO:0061891 is not a child of GO:0005509 (parents:
    GO:0140784 metal ion sensor activity, GO:0140299 molecular sensor activity,
    GO:0098772 molecular function regulator activity), so this is a re-typing to
    another branch and the flag is BINDING_AS_FUNCTION rather than GENERIC_MF;
    it would also merge this node with the following CALM1 node. In the model's
    favour, OspC1 binds the Ca2+-free form, so "directly negatively regulates
    CALM1 calcium ion binding" literally describes the mechanism; under a sensor
    typing the inhibitory edge would be re-expressed as inhibition of the sensor
    activity. The CALM1 review ACCEPTs GO:0005509 but lists GO:0043539,
    GO:0072542 and GO:0005246 as its core functions, hence RELATED. No
    occurs_in.
notes: >-
  Read-only assessment; the model is not edited. This review incorporates a
  manual review by cjm ("Problematic GO-CAM models"), which treats this model
  together with its three siblings from PMID:35568036: 62b4ffe300005437 (the
  OspC3 clone of this model), 62b4ffe300004525 (IFN-beta host branch) and
  62b4ffe300004489 (IFN-gamma host branch). Points confirmed: one mechanism is
  split four ways by the combinatorics of two OspC effectors and two IFN
  ligands, and this model and 62b4ffe300005437 are term-for-term identical apart
  from the effector; none of the four contains the IFN -> receptor -> JAK ->
  STAT1 component, which sits unconnected in 62b4ffe300003747; the CALM1 ->
  CALM1 same-gene chain is present; GO:0061891 calcium ion sensor activity is
  the right type for the CALM1 Ca2+ node; the cytosolic host activities lack
  occurs_in; the OspC2 negative result is not captured, although all three
  effectors bind apo-CaM and only OspC1 and OspC3 inhibit; and OspC1's apoptosis
  role is omitted. Points refined: OspC1's effector activity is better typed as
  GO:0140311 protein sequestering activity than as bare calmodulin binding; the
  missing locations are on the host CaM activities only, since the OspC node
  carries occurs_in host cell cytoplasm; GO:0061891 is a lateral re-typing under
  molecular function regulator activity, not a child of GO:0005509; and omitting
  the apoptosis branch is partly defensible, since PMID:35568036 shows the two
  activities are mechanistically distinct ("Therefore, these findings establish
  that OspC effectors inhibit cell death and IFN signaling by distinct
  biochemical mechanisms.") and OspC1's apoptosis target is unidentified
  ("OspC1 targets an unknown host factor to inhibit Caspase 3/7-mediated
  apoptosis"), so it belongs in its own model, which does not appear to exist.
  Point where the omission is defensible: Pyk2 (PTK2B, Q14289) is absent and
  rests on a single pharmacological inhibitor (TyrA9), so leaving it out is
  reasonable. Points added: the model terminates at a has_input, so CAMK2A is
  present only as an object; and the occurs_in evidence for OspC1 is an OspC3
  paper, recorded as a source defect.
