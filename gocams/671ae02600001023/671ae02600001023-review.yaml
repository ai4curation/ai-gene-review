model: gomodel:671ae02600001023
title: Release of sequestered calcium ion into cytosol by ITPR3 upon 1D-myo-inositol
  1,4,5-trisphosphate binding (Human)
taxon: NCBITaxon:9606
status: COMPLETE
summary: >-
  A single-activity human IP3-receptor type 3 model: ER-membrane ITPR3 enables
  inositol 1,4,5-trisphosphate-gated calcium channel activity, uses IP3 as a
  small-molecule activator, and transports calcium from the ER lumen to the
  cytoplasm as part of sequestered calcium release.
activity_reviews:
  - activity_id: gomodel:671ae02600001023/671ae02600001024
    gene_product: UniProtKB:Q14573
    molecular_function: GO:0005220
    biological_process: GO:0051209
    cellular_component: GO:0005789
    verdict: OK
    consistency: CONSISTENT
    gene_review: file:human/ITPR3/ITPR3-ai-review.yaml
    supporting_text: >-
      Inositol-1,4,5-trisphosphate receptors (IP3Rs) are large, tetrameric
      cation channels that serve as the primary intracellular calcium (Ca2+)
      release channels in nonexcitable cells.
    evidence:
      - source_id: PMID:37898605
        statement: >-
          Cryo-EM and calcium-imaging work on human ITPR3 supports the model's
          IP3-gated calcium-channel activity and IP3/Ca2+ activation framing.
        supporting_text: >-
          Here, we collect electron cryomicroscopic images of human type 3 IP3R
          (hIP3R3) vitrified in a broad range of Ca2+ concentrations and treat
          particle abundance as a proxy for the relative free energy of each state
          to establish high-resolution thermodynamic models of IP3R activation
          and inhibition, which combined with cellular Ca2+ imaging elucidates
          the structural basis for IP3R-generated Ca2+ oscillations.
      - source_id: PMID:32949214
        statement: >-
          ITPR3 belongs to the tetrameric ER IP3 receptor family that binds IP3
          and releases calcium from the ER into the cytoplasm.
        supporting_text: >-
          IP3 is produced after activation of G protein coupled receptors (GPCR),
          and binds the tetrameric IP3Rs, which release Ca2+ from ER into
          cytoplasm.
    source_defects:
      - defect_type: WRONG_TERM
        resource: GO_CAM
        record: gomodel:671ae02600001023/671ae02600001024
        slot: part_of
        requested_change: REPOINT
        asserted_value: GO:0051209
        corrected_value: GO:1903514
        corrected_label: release of sequestered calcium ion into cytosol by endoplasmic
          reticulum
        confidence: PROBABLE
        explanation: >-
          The ITPR3 activity releases calcium from the ER lumen to the cytoplasm,
          as shown by the model's input calcium molecule located in GO:0005788
          and its cytoplasmic output calcium molecule. Because GO:1903514 exactly
          captures ER-to-cytosol release and is used by the aligned module's
          ITPR branch, the model's broader GO:0051209 process should be refined.
      - defect_type: WRONG_TERM
        resource: GO_CAM
        record: gomodel:671ae02600001023/671ae02600001035
        slot: located_in
        requested_change: REPOINT
        asserted_value: GO:0005737
        corrected_value: GO:0005829
        corrected_label: cytosol
        confidence: PROBABLE
        explanation: >-
          The output calcium molecule is located in GO:0005737 cytoplasm even
          though the activity is typed with GO:0051209 release of sequestered
          calcium ion into cytosol and the aligned module represents the
          product as cytosolic calcium. Repointing the molecule to GO:0005829
          cytosol would make the molecule flow match the process.
    notes: >-
      The molecular function and ER-membrane location match ITPR3's first local
      core function and the IP3-receptor annoton in
      modules/er_calcium_store_cycling.yaml. The model's GO:0051209 process and
      the output calcium's GO:0005737 location are broader than the
      module-aligned ER-to-cytosol event and should be repointed to GO:1903514
      and GO:0005829 respectively; the activity already has ER-lumen calcium as
      input, so these two changes would make the molecule flow exactly match the
      process. The RO:0012001 relation to 1D-myo-inositol 1,4,5-trisphosphate
      correctly represents IP3 as a small-molecule activator rather than as
      transported cargo.
references:
  - id: PMID:32949214
    title: Dominant mutations in ITPR3 cause Charcot-Marie-Tooth disease.
  - id: PMID:37898605
    title: Structural titration reveals Ca(2+)-dependent conformational landscape
      of the IP(3) receptor.
notes: >-
  Reviewed against genes/human/ITPR3/ITPR3-ai-review.yaml and
  modules/er_calcium_store_cycling.yaml. The cached model is a one-step slice
  of that module's IP3 receptor branch, not a standalone ER/SR calcium-cycle
  model; the surrounding module covers the paralog alternatives, RYR channels,
  SERCA re-uptake and optional regulators.
