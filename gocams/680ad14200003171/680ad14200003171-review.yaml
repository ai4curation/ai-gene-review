    explanation: >-
      The direct ADRB1-to-GNAS causal edge cites PMID:37963465. PubMed resolves
      that identifier to a TAAR1 structure/signaling paper, not a beta-1
      adrenergic receptor paper. The edge itself is biologically sound: ADRB1
      acts immediately upstream of Gs alpha, and PMID:12391161, already cited on
      the ADRB1 activity, shows beta1-AR signaling through Gs alpha and cAMP.
      Check whether the edge should be keyed to an adrenaline/isoproterenol
      beta-1 receptor reference, to PMID:12391161, or to the uncached
      PMID:11854867/PMID:17916776 evidence already cited on nearby beta-AR and
      ADCY6 assertions.
    supported_by:
