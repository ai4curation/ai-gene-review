model: gomodel:680ad14200003171
title: Signaling by adrenaline mediated by ADRB1 receptor via  G-alpha-s (activatory)
  (Human)
taxon: NCBITaxon:9606
status: COMPLETE
summary: >-
  A compact beta-1 adrenergic Gs model: epinephrine activates the plasma-membrane
  beta-1 adrenergic receptor, ADRB1 directly activates GNAS/Gs alpha on the
  cytoplasmic side of the plasma membrane, and active GNAS directly stimulates
  ADCY6 adenylate cyclase activity to produce cAMP in the
  adenylate-cyclase-activating GPCR signaling pathway. The molecular-function
  typing, receptor has_input, GNAS location and GNAS-to-ADCY6 edge are
  structurally sound; the model's main local issues are the missing ADCY6
  occurs_in value and an unrelated TAAR1 PMID on the ADRB1-to-GNAS edge.
  ADRB1 and ADCY6 have no local gene reviews yet; the local GNAS review covers
  NESP55 rather than the Gs-alpha product P63092.
activity_reviews:
- activity_id: gomodel:680ad14200003171/680ad14200003176
  gene_product: UniProtKB:O43306
  molecular_function: GO:0004016
  biological_process: GO:0007189
  cellular_component: null
  verdict: UNCERTAIN
  qc_flags:
  - MISSING_LOCATION
  consistency: NO_GENE_REVIEW
  supporting_text: >-
    Gbetagamma subunits enhance the activity of these enzymes provided either
    Galpha(s) or forskolin is present.
  evidence:
  - source_id: PMID:17110384
    statement: >-
      Human ADCY6 activity is stimulated by G alpha s together with G beta-gamma
      in reconstituted and intact-cell beta-adrenergic assays.
    supporting_text: >-
      Gbetagamma subunits enhance the activity of these enzymes provided either
      Galpha(s) or forskolin is present.
  notes: >-
    GO:0004016 adenylate cyclase activity and cAMP output correctly represent
    ADCY6 as the effector of Gs in this branch. The source model omits
    occurs_in, so the activity cannot yet be placed at the plasma membrane
    alongside GNAS. The biochemical context is otherwise plausible:
    PMID:17110384 shows that G beta-gamma conditionally stimulates human ACVI
    when G alpha s or forskolin is also present, and that endogenous
    G beta-gamma contributes to isoproterenol-induced cAMP production in cells
    overexpressing hACVI. There is no ADCY6 review in genes/human yet.
