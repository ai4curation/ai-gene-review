  notes: >-
    ADRB1 is correctly typed with beta1-adrenergic receptor activity
    (GO:0004940) at the plasma membrane. The model also uses GNAS as the
    receptor has_input and epinephrine as the chemical input, which is the
    expected GO-CAM pattern for a receptor activity that acts on its immediate
    G-protein effector and is stimulated by a small-molecule ligand. The
    ADRB1-to-GNAS edge is the right direct positive relationship, but the
    PMID:37963465 reference on that edge is unrelated and is recorded as a
    source defect above. There is no ADRB1 review in genes/human yet.
notes: >-
  Alignment with modules/beta_adrenergic_signaling.yaml: the concrete
  beta-adrenergic module already pins this GO-CAM's ADRB1 and GNAS activities to
  its beta-1 receptor and Gs activation annotons. The ADCY6 activity is covered
  by the module's reference to the reusable modules/gpcr_camp_pka_signaling.yaml
  adenylyl-cyclase tier rather than repeated as a beta-adrenergic annoton. No
  module change is needed for this compact three-activity model.
