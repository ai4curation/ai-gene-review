  evidence:
  - source_id: PMID:12135370
    statement: >-
      Gs alpha is associated with the cytoplasmic face of the plasma membrane
      and redistributes after GPCR activation.
    supporting_text: >-
      The heterotrimeric G protein subunit, alpha(s), can move reversibly from
      plasma membranes to cytoplasm in response to activation by GPCRs or
      activating mutations.
  - source_id: PMID:17110384
    statement: >-
      G alpha s is sufficient, with G beta-gamma, to stimulate ADCY6 in the
      immediate downstream step of the beta-adrenergic cascade.
    supporting_text: >-
      Gbetagamma subunits enhance the activity of these enzymes provided either
      Galpha(s) or forskolin is present.
  notes: >-
    P63092 is the canonical Gs-alpha subunit. GO:0003925 G protein activity on
    the cytoplasmic side of the plasma membrane is the expected activity for the
    receptor-coupled G protein in this model, and the direct positive edge to
    ADCY6 is same-compartment/adjacent once the cyclase is placed at the plasma
    membrane. The repository's genes/human/GNAS review is centered on NESP55
    (O95467), a different product of the same locus, so the Gs-alpha/P63092
    activity cannot be compared to a completed local review.
