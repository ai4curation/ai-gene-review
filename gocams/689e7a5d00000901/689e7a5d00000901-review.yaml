  notes: 'Protein-membrane adaptor activity with has_input RGS7, part_of protein localization to plasma membrane,
    at the ON-bipolar dendrite terminus: matches the GPR179 review core function exactly (GO:0043495, GO:0072659,
    GO:0044292), and the review''s ISS rows say this is the activity this GO-CAM assigns. The compartment check
    reports dendrite terminus as UNRESOLVED (it names no membrane or cytosol); the review''s second core location,
    postsynaptic membrane, is the side on which the anchoring happens and would resolve it. No outgoing edge, which
    is acceptable for the terminal activity of this model. All associations are ISS from mouse Gpr179. Of the model''s
    other gene products, only DAG1 (alpha-dystroglycan, a has_input molecule, not an activity enabler) has a review,
    a DRAFT.'
