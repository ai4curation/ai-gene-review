    explanation: The EGFLAM -> GPR179 'directly positively regulates' edge uses ECO:0000314 (direct assay) with
      GO_REF:0000024 (ortholog transfer) and MGI:2146149 (mouse Egflam); every other EGFLAM association uses ECO:0000250
      with the same reference. Either the code should be ECO:0000250 or a direct-assay paper (for example PMID:30282023,
