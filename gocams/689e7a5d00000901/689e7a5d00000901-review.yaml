  notes: No gene review exists for EGFLAM. Molecular adaptor activity with has_input GPR179 and alpha-dystroglycan
    fits the published model of pikachurin as a transsynaptic bridge between the presynaptic dystroglycan complex
    and GPR179 (PMID:30282023), so the MF is defensible. Two problems. (1) The outgoing edge says EGFLAM directly
    positively regulates GPR179's protein-membrane adaptor activity, but the evidence shows pikachurin positions
    GPR179 (anchoring GPR179-RGS at the ON-bipolar dendritic tips), not that it changes the rate of GPR179's RGS-anchoring
    activity; agreeing with the GPR179 reviewer, this reads better as localisation (e.g. EGFLAM part_of a protein-localisation-to-synapse
    process upstream of GPR179) than as direct regulation; flagged DIRECT_VS_INDIRECT_CAUSAL as the nearest category.
    (2) occurs_in photoreceptor ribbon synapse is nested as part_of synaptic cleft, which inverts the containment
    (the cleft is part of the synapse); the compartment check reports ribbon synapse as UNRESOLVED (a junction spanning
    several compartments). Synaptic cleft (GO:0043083), already in the model, is the location of a secreted bridging
    protein. All EGFLAM evidence is ISS from mouse.
