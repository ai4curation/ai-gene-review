    explanation: 'The evidence reference on the LARGE1 -> EGFLAM causal edge is written "PMID: 22223806", with a
      space after the colon, so it is not a valid CURIE and will not resolve in tools that parse references. The
      intended paper (LARGE as a bifunctional xylosyl-/glucuronyltransferase whose product lets alpha-dystroglycan
      bind laminin-G domain ligands) supports the edge in substance; only the identifier needs normalising.'
    supported_by:
    - reference_id: PMID:22223806
      supporting_text: This modification allowed α-DG to bind laminin-G domain-containing ECM ligands.
  notes: 'No gene review exists for LARGE1. has_input alpha-dystroglycan (the substrate) is correct, and the edge
    to the pikachurin adaptor (RO:0002413, provides input for: the glycosylated alpha-DG is an input of EGFLAM''s
    adaptor activity) is the right relation. GENERIC_MF / partial: LARGE1 is bifunctional, building the [-3-Xyl-alpha1,3-GlcA-beta1-]
    repeat (matriglycan) with both xylosyltransferase and glucuronosyltransferase activities (PMID:22223806); the
    model gives only glucuronosyltransferase (GO:0015020), so half of the polymerising activity is missing (a second
    activity or a more specific term would capture it). occurs_in Golgi cites PMID:25279699, which localises FKRP,
    FKTN, TMEM5 and B4GAT1 to the Golgi and places them "prior to LARGE", not LARGE itself. The compartment lead
    (Golgi -> extracellular adaptor, INDETERMINATE because the EGFLAM location is unresolved) reflects real secretory
    transport of glycosylated alpha-DG to the photoreceptor surface, an acceptable simplification for a provides-input
    edge. The same LARGE1 activity recurs in three other dystroglycan models (gocams/index.tsv).'
