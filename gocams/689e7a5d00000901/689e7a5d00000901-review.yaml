model: gomodel:689e7a5d00000901
title: Post-translational modification-dependent alpha-dystroglycan interaction with pikachurin (EGFLAM) is required
  for ribbon synapse formation (Human)
taxon: NCBITaxon:9606
status: COMPLETE
summary: 'Three-activity model of how glycosylated alpha-dystroglycan engages pikachurin to organise the photoreceptor
  ribbon synapse: LARGE1 glucuronosyltransferase activity in the Golgi, with alpha-dystroglycan as input, provides
  input for the molecular adaptor activity of pikachurin (EGFLAM) in the synaptic region, which bridges alpha-dystroglycan
  and GPR179 and is said to directly positively regulate GPR179''s protein-membrane adaptor activity, which anchors
  RGS7 at the ON-bipolar dendrite terminus. Only GPR179 has a gene review, and its activity is CONSISTENT with that
  review''s core function. LARGE1 is UNCERTAIN because its xylosyltransferase half is missing (it is a bifunctional
  matriglycan polymerase) and its Golgi reference localises other enzymes; EGFLAM is UNCERTAIN because the edge
  to GPR179 encodes positioning as direct activity regulation and its location nesting is inverted (ribbon synapse
  part_of synaptic cleft). Recorded defects: a malformed reference "PMID: 22223806" on the LARGE1 edge, and ECO:0000314
  paired with the ortholog-transfer reference GO_REF:0000024 on the EGFLAM edge. Compartment leads: two UNRESOLVED
  locations (ribbon synapse, dendrite terminus), both flagged, and two INDETERMINATE edges that follow from them.'
