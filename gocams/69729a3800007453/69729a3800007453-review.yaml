notes: >-
  Read-only assessment; the model is not edited. No fission yeast gene in this model has a gene review in
  this repository, so every consistency is NO_GENE_REVIEW. SGD with/from identifiers were checked against
  the SGD API; all resolve to the expected orthologues except the two recorded on Hsp10 and Pam16. The
  three compartment flags (Tom40 to Tim50 twice, Tom22 to Tim50) are explained by Tim50's wrong occurs_in,
  not by a missing transport step: the presequence route as drawn (TOM, IMS hand-over to Tim50, TIM23,
  PAM, MPP) is complete for matrix import. Tim21, which couples Tom22 to TIM23, is not in the model, but
  that is an optional addition, not a gap in the precursor path. The Tom22 activity appears three times
  under one id in the cache and is reviewed three times to match the seeded entries.
