model: gomodel:69729a3800007453
title: protein import into mitochondrial matrix (GO:0030150)
taxon: NCBITaxon:4896
status: COMPLETE
summary: >-
  A PomBase model of presequence protein import into the fission yeast mitochondrial matrix, followed by
  precursor processing and folding. The imported precursor is passed along a chain of "directly provides
  input for" edges: the receptor Tom20 hands it to Tom22, Tom22 to the Tom40 channel, and Tom40 and Tom22
  to the inner-membrane presequence receptor Tim50; Tim50 passes it to the TIM23 channel (Tim23, Tim17),
  which hands it to the matrix Hsp70 Ssc1 of the PAM motor; Ssc1 passes it to the processing peptidase
  MPP (Mas1, activated by Mas2), which feeds Oct1, Icp55, the rhomboid Rbd1 (Pcp1; input Msp1), the
  folding chaperonin Mcp60 (with Hsp10) and the presequence protease Cym1 (also fed by Oct1). Small TOM
  subunits (Tom5, Tom6, Tom7), Mgr2, Tim44, Zim17 and Pam17 are attached by constitutive or regulatory
  edges, and the PAM regulators Pam18 (J-protein, activates Ssc1), Pam16 (inhibits Pam18) and Mge1
  (nucleotide exchange) act on Ssc1. Evidence is almost entirely ISO, ISS, IBA and InterPro inference from
  budding yeast and mammals; the causal story is the accepted mechanism and is sound. The compartment check
  flags three direct edges (Tom40 to Tim50 twice, Tom22 to Tim50) as outer membrane to matrix. The edges
  themselves are right - the precursor leaves Tom40 into the intermembrane space, where the Tim50 receptor
  domain (with the Tom22 IMS domain) captures it - and the flag arises because Tim50's occurs_in is
  mitochondrial matrix, inferred from the TIM23 complex. Tim50 is an inner membrane protein whose receptor
  domain faces the intermembrane space; with that location the edges are outer membrane to inner membrane
  across the IMS (bridged), so no step is missing and the defect is Tim50's location. Two evidence
  with/from errors were found: the Hsp10 enabled_by ISO cites SGD:S000000004, which is SSA1 (a cytosolic
  Hsp70), not HSP10; and the Pam16 enabled_by ISO cites the malformed SGD:SS000005758, the id of MGE1, not
  PAM16. Pam16 is typed as protein translocation chaperone activity, which defines the Hsp70 pulling
  action that Ssc1 performs, while Ssc1 itself carries only the generic ATP hydrolysis activity; the
  two MFs look misplaced. Tom22 appears three times in the cache under one activity id.
