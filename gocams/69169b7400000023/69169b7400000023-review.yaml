    SLC25A45 transport. The verdict is UNCERTAIN because the activity omits the
    3-hydroxy-N-trimethyllysine output, and because the outgoing edge to BBOX1
    correctly skips the middle of the pathway but uses an indirect regulation
    predicate for substrate flow through the missing SHMT1/SHMT2 aldolase and
    ALDH9A1 dehydrogenase steps.
