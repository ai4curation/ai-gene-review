notes: >-
  modules/human_carnitine_biosynthesis.yaml already declares this production
  GO-CAM and pins its SLC25A45, TMLHE and BBOX1 activities to matching module
  steps. The module's added SHMT1/SHMT2 aldolase and ALDH9A1 dehydrogenase
  steps explain why the model's edge from TMLHE to BBOX1 must be indirect; they
  also make the relation-class issue visible because the edge connects pathway
  metabolites, not a regulatory influence on BBOX1. The GO-CAM has no causal
  edge from SLC25A45 to TMLHE, so that handoff is represented only by the shared
  CHEBI:58100 molecule nodes. SHMT1 is cytosolic and SHMT2 is mitochondrial,
  and both carry GO:0120567 in the module, so the compact GO-CAM also does not
  state at which metabolite the pathway crosses the inner membrane to reach
  cytosolic BBOX1. `just gocam-lint` reported BBOX1 missing_location and
  no_narrative leads; `just
  gocam-compartments` found no
  unresolved or nonadjacent compartments because BBOX1's missing location is
  indeterminate and the TMLHE-to-BBOX1 edge is not a direct edge.
