notes: >-
  modules/human_carnitine_biosynthesis.yaml already declares this production
  GO-CAM and pins its SLC25A45, TMLHE and BBOX1 activities to matching module
  steps. The module's added SHMT1/SHMT2 aldolase and ALDH9A1 dehydrogenase
  steps explain why the model's edge from TMLHE to BBOX1 must be indirect, so
  no module edit is needed. `just gocam-lint` reported BBOX1 missing_location
  and no_narrative leads; `just gocam-compartments` found no unresolved or
  nonadjacent compartments once BBOX1's missing location is treated as
  indeterminate.
