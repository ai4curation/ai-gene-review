    - source_id: PMID:41075794
      statement: Epitope-tagged SLC25A45 localizes to mitochondria.
      supporting_text: Mitochondrial localization of SLC25A45-FLAG was confirmed
  notes: >-
    The completed SLC25A45 review accepts GO:7770026 trimethyllysine transporter
    activity, GO:0045329 carnitine biosynthetic process, and GO:0005743
    mitochondrial inner membrane as core SLC25A45 annotations, so the model's
    MF, BP, and occurs_in are consistent with the gene review. Its has_output
    association correctly describes trimethyllysine in the mitochondrial matrix
    after inner-membrane import. Its has_input places the pre-import
    trimethyllysine in broad GO:0005737 cytoplasm, a union that contains the
    mitochondrial matrix, so a curator may want to sharpen that molecule
    location to cytosol or the mitochondrial intermembrane space.
