model: gomodel:69169b7400000023
title: SLC25A45 mediates mitochondrial uptake of methylated lysine for carnitine biosynthesis
  (Human).
taxon: NCBITaxon:9606
status: COMPLETE
summary: >-
  This compact human model links mitochondrial trimethyllysine uptake by
  SLC25A45 to the first and last enzymatic steps of L-carnitine biosynthesis:
  SLC25A45 imports trimethyllysine from the cytoplasm into the mitochondrial
  matrix, TMLHE hydroxylates matrix trimethyllysine, and TMLHE indirectly
  provides input for cytosolic BBOX1. The SLC25A45 transporter term and the
  TMLHE and BBOX1 catalytic functions are specific and evidence-aligned. The
  TMLHE to BBOX1 causal edge is indirect, appropriately compressing the SHMT1/2
  and ALDH9A1 middle steps already expanded in
  modules/human_carnitine_biosynthesis.yaml. The only model-level gaps are on
  the BBOX1 node, which omits both BBOX1's cytosolic location and its
  gamma-butyrobetaine substrate.
