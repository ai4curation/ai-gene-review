model: gomodel:69169b7400000023
title: SLC25A45 mediates mitochondrial uptake of methylated lysine for carnitine biosynthesis
  (Human).
taxon: NCBITaxon:9606
status: COMPLETE
summary: >-
  This compact human model links mitochondrial trimethyllysine uptake by
  SLC25A45 to the first and last enzymatic steps of L-carnitine biosynthesis:
  SLC25A45 imports trimethyllysine from the cytoplasm into the mitochondrial
  matrix, TMLHE hydroxylates matrix trimethyllysine, and TMLHE indirectly
  provides the precursor series for cytosolic BBOX1. The SLC25A45 transporter
  term and the TMLHE and BBOX1 catalytic functions are specific and
  evidence-aligned, but both enzyme nodes lack expected products, and BBOX1 also
  lacks its cytosolic location and gamma-butyrobetaine input. The TMLHE to BBOX1
  edge is legitimately indirect because the model compresses the SHMT1/2 and
  ALDH9A1 middle steps already expanded in
  modules/human_carnitine_biosynthesis.yaml, but it should not be typed as a
  regulation predicate for this metabolic substrate handoff.
