model: gomodel:62b4ffe300004489
title: Regulation of the JAK-STAT pathway by calmodulin in response to interferon-gamma
  (Human)
taxon: NCBITaxon:9606
status: COMPLETE
summary: >-
  The IFN-gamma counterpart of 62b4ffe300004525, built from the same template
  with one extra node. CALM1 calcium ion binding (GO:0005509) directly
  positively regulates CALM1 protein serine/threonine kinase activator activity
  (GO:0043539, has_input CAMK2A), which directly positively regulates CAMK2A
  calcium/calmodulin-dependent protein kinase activity (GO:0004683, has_input
  STAT1); that in turn directly positively regulates STAT1 DNA-binding
  transcription factor activity (GO:0000981) in the nucleus, which directly
  positively regulates EP300 transcription coactivator activity (GO:0003713),
  also in the nucleus. The CaM and CaMKII activities are part_of cellular
  response to type II interferon (GO:0071346) within positive regulation of
  receptor signaling pathway via JAK-STAT (GO:0046427); EP300 is part_of
  GO:0046427 alone. The chain CaM -> CaMKII -> STAT1 S727 is the well-evidenced
  content of PMID:11972023 and is sound. Five problems. (1) As in the three
  sibling models, IFN-gamma itself is absent: no IFNG, no IFNGR1/IFNGR2, no
  JAK1/JAK2, and no Y701 phosphorylation step, so nothing in the model responds
  to interferon-gamma. (2) The model opens with two consecutive CALM1
  activities, Ca2+ binding then kinase activation, which are one sensor
  activity. (3) The CaM and CaMKII activities have no occurs_in. (4) The
  enabled_by of the kinase node is CAMK2A, but PMID:11972023 identifies the
  Stat1-interacting, Stat1-phosphorylating kinases as the ubiquitous CaMKII
  gamma/delta isoforms, with alpha/beta from rat brain used only as a positive
  control. (5) The STAT1 -> EP300 edge carries ECO:0000314 with PMID:11972023,
  where p300 appears only as a speculative remark in the Discussion; the
  experimental support for it is PMID:16257975, which is cited on the EP300
  activity itself. The EP300 branch has no counterpart in the IFN-beta sibling,
  which is the asymmetry between the four models.
