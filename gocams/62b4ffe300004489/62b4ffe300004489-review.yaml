    corrected_label: CaMKII gamma / CaMKII delta (CAMK2G / CAMK2D)
    confidence: PROBABLE
    explanation: >-
      The activity is enabled_by CAMK2A (UniProtKB:Q9UQM7, CaMKII alpha), but
      PMID:11972023, the reference for the activity's process, location-free
      context and both its causal edges, identifies the Stat1-binding and
      Stat1-phosphorylating kinases as the ubiquitously expressed CaMKII
      gamma/delta isoforms. Purified CaMKII alpha/beta from rat brain is used in
      that paper only as a positive control in the in vitro kinase assay. CaMKII
      alpha is largely neuronal, whereas the IFN-gamma experiments are in NIH
      3T3 fibroblasts and U3A cells. The model may intend CAMK2A as a
      representative of the CaMKII family; if so that should be stated,
      otherwise the enabled_by should point at the gamma and/or delta gene
      products, whose accessions were not looked up for this report. Note that
      the alpha paralog is appropriate in the sibling models built on
      PMID:35568036, which used a constitutively active CaMKII alpha construct.
    supported_by:
    - reference_id: PMID:11972023
      supporting_text: These results indicate that there is a specific interaction between
        Stat1 and the ubiquitous members of the CaMKII family
  notes: >-
    GO:0004683 calcium/calmodulin-dependent protein kinase activity is specific
    and is the CAMK2A review's single core function. has_input STAT1 is the
    substrate, which is the correct filler, and the direct positive edge to the
    STAT1 transcription factor activity is justified here by a demonstrated
    phosphorylation, unlike in the IFN-beta sibling, where the same step is
    asserted as RO:0002304 causally upstream of, positive effect on
    pharmacological evidence; the two models should be internally consistent or
    should say why they differ. The enabled_by evidence code is ECO:0000304
    (author statement supported by traceable reference), weaker than the
    ECO:0000314 used elsewhere in the model. No occurs_in, although PMID:11972023
    reports CaMKII gamma/delta in both the cytoplasm and the nucleus. The
    paralog question is recorded as a source defect above.
notes: >-
  Read-only assessment; the model is not edited. This review incorporates a
  manual review by cjm ("Problematic GO-CAM models"), which treats this model
  together with its three siblings from PMID:35568036: 62b4ffe300004525
  (IFN-beta variant), 62b4ffe300005467 (OspC1 inhibition) and 62b4ffe300005437
  (OspC3 inhibition). Points confirmed: the four models fragment one mechanism
  along a 2x2 of OspC effector and IFN ligand; none of them contains the
  IFN -> receptor -> JAK -> STAT1 component, which exists only in the
  unconnected canonical model 62b4ffe300003747; the CALM1 -> CALM1 same-gene
  chain is present here as in all three siblings; GO:0061891 calcium ion sensor
  activity is the right type for the CALM1 Ca2+ node; the cytosolic host
  activities lack locations; and the EP300 branch is real but creates an
  unexplained asymmetry with the IFN-beta model. Points refined: the
  missing-location criticism does not extend to STAT1 and EP300, which both
  carry occurs_in nucleus; GO:0061891 is a lateral re-typing under molecular
  function regulator activity, not a child of GO:0005509; and the EP300 problem
  is sharper than stated, because the edge that introduces EP300 cites
  PMID:11972023 with a direct-assay evidence code although that paper assays no
  coactivator, while the correct reference (PMID:16257975) is already present on
  the EP300 node. Point added: the kinase node is enabled_by CAMK2A although the
  cited paper identifies CaMKII gamma/delta, recorded as a source defect. Point
  where the omission is defensible: Pyk2 (PTK2B, Q14289) is absent, and the
  evidence for it in PMID:35568036 is a single pharmacological inhibitor
  (TyrA9), so leaving it out is a reasonable curation decision rather than a
  defect; PMID:11972023, the basis of this model, does not implicate Pyk2 at
  all.
