  notes: >-
    The molecular function is right and specific: GO:0160220 is defined as
    (R)-lactate + ATP + D-alanine = ADP + D-alanyl-(R)-lactate + phosphate (OLS,
    checked 2026-11-02), which is exactly the Bugg et al. reaction, and the
    model's has_input (R)-lactate / D-alanine and has_output
    D-alanyl-(R)-lactic acid match it (ATP, ADP and phosphate are not
    represented, a completeness rather than a correctness issue). The location
    is the problem. occurs_in GO:0016020 membrane is cited to PMID:2266943,
    which did report a vancomycin-induced 40 kDa membrane-associated VanA band
    in enterococcal membrane fractions, so the assertion is not invented; but
    the same abstract concludes that VanA is related to cytoplasmic D-Ala-D-Ala
    ligases, and the enzyme's substrates and product belong to the cytoplasmic
    precursor pool. GO:0005829 cytosol is the better term, and the 1990 crude
    membrane fraction is weak evidence against it. This activity is a terminal
    node: the depsipeptide it makes is never handed to the D-Ala-D-Ala adding
    enzyme, so the model's output is a metabolite rather than a resistant cell
    wall.
