notes: >-
  Read-only assessment; the model is not edited. gomodel:671ae02600002832 is a
  DEVELOPMENT-state model (status: development in the cached source, last
  modified 2025-02-13), not a production GO-CAM, so the gaps noted below may
  simply be work in progress rather than finished curation, and the source
  defects recorded here are offered in that spirit.

  This review incorporates the manual review by cjm ("Problematic GO-CAM
  models", AMR Gene Pathways / Response to antibiotic - vancomycin resistance
  vanA cluster), checked point by point against the cached model and the cited
  literature.

  Confirmed. (1) The VanH and VanA reactions are correctly typed and correctly
  chained, via shared molecule nodes rather than causal edges. (2) The location
  is wrong for VanA: membrane (GO:0016020) rests on a 1990 membrane-fraction
  observation (PMID:2266943) while the ligase acts on cytoplasmic precursors;
  cytosol is the better term. The same applies to the vancomycin molecule node
  (gomodel:671ae02600002832/671ae02600002875 is untyped for location, but
  gomodel:671ae02600002832/671ae02600002855 vancomycin is located_in
  GO:0016020 by curator inference), which is odd for an antibiotic that acts on
  the external face of the cell wall. (3) The biological process is not wrong:
  GO:0046677 response to antibiotic is true of every activity here. It is
  however uninformative about mechanism, and GO has no "response to vancomycin"
  or "glycopeptide resistance" term (OLS, checked 2026-11-02), so cjm's
  suggestion of a dedicated resistance BP is an ontology request, not a
  curation fix. (4) Missing context is real and is the model's biggest
  limitation: nothing downstream of the depsipeptide is represented - no
  D-Ala-D-Ala adding enzyme incorporating D-Ala-D-Lac into
  UDP-MurNAc-pentapeptide, no transglycosylation/transpeptidation, no VanY
  D,D-carboxypeptidase or VanZ, and no representation of the reduced vancomycin
  affinity that the whole cluster exists to produce. PMID:1931965 itself
  supplies the next step ("The VanA product D-alanyl-D-2-hydroxybutyrate could
  then be incorporated into the UDPMurNAc-pentapeptide peptidoglycan precursor
  by D-Ala-D-Ala adding enzyme from Escherichia coli or by crude extract from E.
  faecium BM4147"), so this is a curation gap rather than a knowledge gap.

  Refined. The two-component sensing cjm lists as missing is present in the
  cached version: VanS appears twice (sensor kinase GO:0000155 and phosphatase
  GO:0004721) and VanR twice (GO:0001216), with kinase and phosphatase edges
  onto VanR and three indirect edges from VanR to the VanH, VanA and VanX
  activities. VanX is present too. The critique appears to predate the
  2025-01/2025-02 additions (the screenshot in the review shows the three-enzyme
  view only). Consequently the "chain of length 2" characterisation no longer
  holds: the longest causal chain is now VanS kinase -> VanR -> VanH/VanA/VanX,
  i.e. three activities, plus a two-step metabolic chain through the shared
  (R)-lactate node. The deeper version of cjm's point does survive: the chain
  still terminates at a metabolite, so the model does not yet connect the
  mechanism to the resistance phenotype, and that - rather than its length - is
  what limits its computational value.

  Disagreed, or at least qualified. "Annotating to the experiment" and "based
  primarily on a 1991 biochemistry paper" understate the current model: it cites
  six references spanning 1990 to 2019 (PMID:2266943, PMID:1931965,
  PMID:1503450, PMID:1556077, PMID:8494882, PMID:30677074), including a
  2019 study of full-length VanSA. The 1991 paper is the backbone of the
  enzymatic half only. I also disagree with the implied remedy of annotating a
  review instead of the primary literature: the primary papers are the right
  sources here, and the real problem is the opposite one - a statement in the
  model that the primary literature does not support.

  Found independently of cjm's review, and arguably the most serious issue: the
  VanS sensor kinase carries vancomycin as a small-molecule activator
  (RO:0012001) with ECO:0000314 direct assay evidence from PMID:8494882, a paper
  that assayed only an MBP fusion of the VanS cytosolic domain and performed no
  vancomycin assay, while PMID:30677074 - cited by this same model for the VanS
  phosphatase - reports that purified full-length VanSA is insensitive to
  vancomycin and argues against a binary antibiotic-kinase complex. The model
  therefore asserts as directly assayed fact something the literature it cites
  contradicts. Also found independently: the duplicated VanR node, which leaves
  the inhibitory branch of the two-component system regulating a VanR activity
  that regulates nothing; the has_input of VanR being the VanH protein rather
  than the target genes; the generic dipeptidase term on VanX; the inverted
  part_of nesting on the VanS kinase; and four of seven activities with no
  occurs_in.

  Structural patterns here that an automatic linter could detect are listed in
  the review report accompanying this file: duplicate activity nodes (same
  enabled_by + molecular_function + part_of), split regulation of duplicate
  nodes by two arms of one bifunctional enzyme, inconsistent nested part_of
  ordering of the same term pair within one model, catalytic activities whose
  has_input/has_output do not cover the participants of the GO term's own
  reaction definition, generic MF terms with an applicable child already in GO,
  terminal metabolite nodes with no consuming activity, and activities lacking
  occurs_in where a sibling activity of the same gene product has one.
