model: gomodel:671ae02600002832
title: Response to antibiotic - vancomycin resistance vanA cluster (E.faecium)
taxon: NCBITaxon:1352
status: COMPLETE
summary: >-
  The model tells the VanA-type glycopeptide resistance story of Enterococcus
  faecium in two connected halves. In the regulatory half, VanS (Q06240) is a
  membrane sensor histidine kinase (GO:0000155) that directly positively
  regulates the DNA-binding transcription activator activity of the response
  regulator VanR (Q06239), and, as a phosphoprotein phosphatase (GO:0004721),
  directly negatively regulates it; VanR in turn indirectly positively regulates
  the three enzyme activities of the distal operon. In the enzymatic half, VanH
  (Q05709) is a D-lactate dehydrogenase (GO:0008720) whose output (R)-lactate is
  the input of the VanA (P25051) D-alanine-(R)-lactate ligase (GO:0160220),
  which outputs the depsipeptide D-alanyl-(R)-lactate; VanX (Q06241) is a
  dipeptidase (GO:0016805) acting on D-alanyl-D-alanine. The causal backbone
  (VanS to VanR to the resistance enzymes) and the VanH/VanA metabolic chaining
  by shared molecule nodes are sound and match the primary literature.
  Four problems stand out. (1) VanA is placed in the membrane (GO:0016020) on
  the strength of a 1990 report of a membrane-associated VanA band; the ligase
  acts on cytoplasmic peptidoglycan precursors and should be cytosolic, and the
  vancomycin molecule node is likewise placed in the membrane. (2) VanR is
  represented by two near-identical activity nodes with the same gene product,
  MF and process, one receiving the kinase edge and the other the phosphatase
  edge; a single VanR activity should carry both. (3) The VanS kinase carries
  vancomycin as a small-molecule activator (RO:0012001) with direct-assay
  evidence from PMID:8494882, a paper that assayed only the cytosolic domain and
  never tested vancomycin; PMID:30677074, which the model itself cites for the
  phosphatase, reports that purified full-length VanSA is insensitive to
  vancomycin. (4) VanR's has_input is the VanH protein rather than the target
  genes, and lists only vanH although the model's own reference shows vanH,
  vanA and vanX are cotranscribed. Smaller issues: VanX is typed at the generic
  dipeptidase parent when GO:0160237 D-Ala-D-Ala dipeptidase activity exists;
  four of seven activities have no occurs_in; and the part_of nesting of
  GO:0046677 and GO:0000160 is inverted on the VanS kinase relative to VanR.
  The model stops at the modified precursor: nothing downstream (MurF-type
  addition to UDP-MurNAc-pentapeptide, transglycosylation/transpeptidation, the
  reduced vancomycin affinity that is the point of the whole cluster) is
  represented, and VanY/VanZ are absent.
