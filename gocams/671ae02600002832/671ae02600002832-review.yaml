  notes: >-
    The core claim is sound: GO:0000155 phosphorelay sensor kinase activity for
    VanS, occurs_in membrane (correct for a transmembrane sensor, and the one
    place in this model where a membrane location is right), and RO:0002629
    directly positively regulates VanR, which matches the demonstrated
    phosphotransfer from phospho-VanS to VanR. Two attached assertions do not
    hold up. First, RO:0012001 has small molecule activator vancomycin is
    asserted with ECO:0000314 direct assay evidence from PMID:8494882; that
    paper assayed an MBP fusion of the VanS cytosolic domain (residues 95-374)
    and never tested vancomycin, and its only statement about vancomycin sensing
    is a speculative closing remark. PMID:30677074, cited elsewhere in this same
