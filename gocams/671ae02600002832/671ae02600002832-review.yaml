  notes: >-
    A pseudo-duplicate of gomodel:671ae02600002832/6792e70800000096: same gene
    product (Q06239), same molecular function (GO:0001216), same process
    (GO:0000160), no has_input and no outgoing causal edges. Its only role is to
    receive the VanS phosphatase edge, while the kinase edge goes to the other
    VanR node. Nothing in the biology justifies two VanR activities: the kinase
    and the phosphatase arms of the bifunctional sensor act on one and the same
    response regulator, and the phosphorylation state is a state of that
    activity rather than a second activity. As drawn, the model asserts that
    VanS dephosphorylates a VanR activity that regulates nothing, so the
    inhibitory branch has no consequence anywhere in the model. The duplicate
    should be merged into the other node. The claim the node makes about VanR is
    true, which is why the two nodes are hard to tell apart automatically; the
    verdict is WRONG for the representation, not for the biology.
