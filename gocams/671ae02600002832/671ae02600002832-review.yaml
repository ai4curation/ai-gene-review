    of VanR-phosphate by VanS itself. The mutant-phenotype evidence
    (ECO:0000315, T168K) is apt. GO:0004721 is generic, but GO has no term for
    phosphorelay response-regulator (aspartyl-phosphate) phosphatase activity
    (OLS searches for "aspartate phosphatase" and "phosphorelay response
    regulator phosphatase activity" return nothing, checked 2026-11-02), so this
    is an ontology gap rather than a curation error, and GENERIC_MF is not
    flagged. The activity has no occurs_in although the sibling VanS kinase
    activity in the same model is placed in the membrane. The edge target is
    wrong: it points at the duplicate VanR node rather than the VanR activity
    that carries the model's downstream edges.
