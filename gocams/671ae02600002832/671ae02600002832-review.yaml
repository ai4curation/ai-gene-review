    activities insensitive to vancomycin, explicitly arguing against a binary
    antibiotic-kinase complex. The identity of the inducing signal is an open
    question, and the model asserts it as a directly assayed fact. Second, the
    nested part_of reads activity part_of GO:0046677 part_of GO:0000160, i.e.
    response to antibiotic is part of the phosphorelay system; the VanR
    activities in the same model nest the two terms the other way round, which
    is the correct direction.
