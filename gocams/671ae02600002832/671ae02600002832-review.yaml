    restores resistance to a VanH-deficient strain. Two gaps: no occurs_in (the
    reaction is cytosolic, as for VanA), and the substrates pyruvate and NADH
    are not represented as has_input, so only half the reaction is in the model.
    A broader-specificity caveat is worth recording: PMID:1931965 characterises
    VanH as a D-specific alpha-keto acid dehydrogenase whose product spectrum is
    wider than D-lactate, with D-2-hydroxybutyrate the best VanA substrate in
    vitro.
