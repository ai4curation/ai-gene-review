model: gomodel:69a0c46f00002570
title: Deubiquitination of RAD51 by UCHL3 promotes association between BRA2 and RAD51
  and formation of nucleoprotein filaments during homologous recombination-mediated
  repair of DSBs (Human).
taxon: NCBITaxon:9606
status: COMPLETE
summary: ATM phosphorylates UCHL3 after DNA damage; activated UCHL3 deubiquitinates RAD51, and RAD51
  deubiquitination promotes BRCA2-RAD51 association and RAD51 nucleoprotein-filament assembly during
  homologous-recombination repair. The causal order is sound. The model also exposes two curation
  granularity issues already visible from the connected gene and module reviews; the BRCA2 mediator
  activity is modelled with the generic protein-macromolecule adaptor term, and the ATM and UCHL3
  activities lack explicit nuclear/site-of-damage locations.
