model: gomodel:663d668500001089
title: SELENOI is involved in ether lipid homeostasis and myelination (Human).
taxon: NCBITaxon:9606
status: COMPLETE
summary: >-
  A compact human CDP-ethanolamine branch model: cytosolic ETNK1 phosphorylates
  ethanolamine to phosphoethanolamine, PCYT2 converts phosphoethanolamine to
  CDP-ethanolamine, and ER-membrane SELENOI uses CDP-ethanolamine to form the
  ethanolamine head group of ether-linked PE species that feed
  plasmalogen/myelin homeostasis.
