        explanation: >-
          The PCYT2 activity in this GO-CAM is placed at the endoplasmic
          reticulum membrane, apparently via the Reactome event that describes
          PCY2 as active and membrane-bound there. By contrast, PAINT places
          human PCYT2 in cytoplasm through PTN000077597, and the local PCYT2
