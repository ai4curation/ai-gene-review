        statement: >-
          Human ETNK1/EKI1 phosphorylates ethanolamine at the first step of the
          CDP-ethanolamine branch and can rate-control PtdEtn synthesis.
        supporting_text: >-
          Ethanolamine kinase (EKI) is the first committed step in
