model: gomodel:69d8496c00002213
title: ARFGAP2 has GTPase activating activity for ARF1 during COPI vesicle formation
  (Human).
taxon: NCBITaxon:9606
summary: >-
  A compact COPI coat-cycle model in which ARFGAP2 acts as the ARF1-directed GAP,
  directly stimulating ARF1 GTP hydrolysis, while ARF1 G protein activity is placed
  upstream of the COPI vesicle coat. ARFGAP2 and ARF1 are both represented with
  plausible MFs and inputs. The terminal COPI coat activity is correctly treated
  as a complex-level activity, but its MF is better described as cargo-adaptor/coat
  assembly than protein carrier activity, and its ER-membrane location looks like
  an arrival-compartment assertion rather than the Golgi/ERGIC donor membrane where
  COPI cargo selection and coat assembly occur.
status: COMPLETE
activity_reviews:
- activity_id: gomodel:69d8496c00002213/69d8496c00002214
  gene_product: UniProtKB:Q8N6H7
  molecular_function: GO:0005096
  biological_process: GO:0006890
  cellular_component: GO:0000139
  verdict: OK
  consistency: NO_GENE_REVIEW
  notes: >-
    ARFGAP2 is plausibly modelled as an ARF1-directed GTPase activator at the
    Golgi membrane, has_input ARF1, and directly positively regulates ARF1 G
    protein activity; for a GAP, the positive edge reads as stimulation of ARF1
    GTP hydrolysis. The ARFGAP2 MF and has_input assertion are transferred from
    rat by sequence similarity, while PMID:20858901 directly supports ARFGAP2/3
    acting with coatomer on Golgi COPI coat assembly. No ARFGAP2 gene review
    exists in this project yet.
