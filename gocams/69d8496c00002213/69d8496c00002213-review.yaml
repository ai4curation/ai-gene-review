  gene_review: file:human/ARF1/ARF1-ai-review.yaml
  supporting_text: >-
    The cycle of nucleotide exchange and hydrolysis by a small GTP-binding protein,
    ADP-ribosylation factor (ARF), helps to provide vectoriality to vesicle
    transport.
  notes: >-
    ARF1 G protein activity on the Golgi membrane during COPI-coated vesicle
    budding is consistent with the ARF1 review's accepted core role in
    COPI-dependent Golgi-to-ER traffic. The model MF GO:0003925 is broader than
    the review's GO:0003924 GTPase activity, so the GO-CAM activity could be
    tightened, but its direction to the coatomer step is biologically sensible:
    activated ARF1 recruits coatomer for COPI coat formation.
- activity_id: gomodel:69d8496c00002213/69d8496c00002232
  gene_product: GO:0030126
  molecular_function: GO:0140597
  biological_process: GO:0006890
  cellular_component: GO:0005789
  verdict: UNCERTAIN
  qc_flags:
  - GENERIC_MF
  consistency: NO_GENE_REVIEW
  notes: >-
    Modelling the terminal activity at the GO:0030126 COPI vesicle coat level is
    appropriate because this is a collective coatomer activity rather than a
    single active subunit. The activity is under-typed, though: COPI coatomer is
    a vesicle coat/cargo adaptor, and GO's current retrograde-transport GO-CAMs
    use cargo adaptor activity for the COPI coat rather than broad protein carrier
    activity. The asserted occurs_in GO:0005789 endoplasmic reticulum membrane is
    also suspicious for Golgi-to-ER retrograde COPI traffic because COPI cargo
    selection and coat assembly occur at donor Golgi/ERGIC membranes before the
    vesicle uncoats for ER fusion; PMID:26160949 supports COPI coat structure,
    not ER-membrane execution.
