model: gomodel:62b4ffe300004525
title: Regulation of the JAK-STAT pathway by calmodulin in response to interferon-beta
  (Human)
taxon: NCBITaxon:9606
status: COMPLETE
summary: >-
  A four-activity linear chain in the host cell only. CALM1 calcium ion binding
  (GO:0005509) directly positively regulates a second CALM1 activity, protein
  serine/threonine kinase activator activity (GO:0043539, has_input CAMK2A),
  which directly positively regulates CAMK2A calcium/calmodulin-dependent
  protein kinase activity (GO:0004683); that activity is causally upstream,
  positive effect (RO:0002304) of STAT1 DNA-binding transcription factor
  activity (GO:0000981) in the nucleus. Every activity is part_of cellular
  response to interferon-beta (GO:0035458) within positive regulation of
  receptor signaling pathway via JAK-STAT (GO:0046427), except STAT1, which is
  part_of cell surface receptor signaling pathway via JAK-STAT (GO:0007259).
  The biology is right and is the core finding of PMID:35568036, but the model
  has four problems. (1) The event that defines it is absent: there is no IFNB1,
  no IFNAR1/IFNAR2, no JAK1/TYK2 and no STAT1 phosphorylation step, so a model
  titled "in response to interferon-beta" contains nothing that responds to
  interferon-beta; the ligand-receptor-JAK chain exists in a separate model
  (62b4ffe300003747) with no link to this one. (2) The chain opens with two
  consecutive CALM1 activities, calcium ion binding then kinase activator
  activity. These are one activity, not two: CaM's role is to sense Ca2+ and
  thereby activate its targets, for which GO:0061891 calcium ion sensor activity
  is the correct type. (3) Neither CALM1 activity nor the CAMK2A activity has an
  occurs_in, although the mechanism is explicitly cytosolic and STAT1's nuclear
  location is recorded. (4) The model terminates at STAT1 transcription factor
  activity with no has_input and no downstream activity, so the ISGs that are
  the measured output of the paper are not represented. The inhibitor side of
  the same mechanism (OspC1, OspC3) is held in two further models, and the
  IFN-gamma variant in a third, with no relation between any of them.
