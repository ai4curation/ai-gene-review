    explanation: >-
      The enabled_by, occurs_in and part_of evidence for this activity is
      PMID:28753426, a study of SETD2-mediated STAT1 K525 methylation in
      IFN-alpha signalling and HBV replication. It supports STAT1 transcription
      factor activity in the nucleus in type I interferon signalling, but it is
      not an interferon-beta study, so it is a weak citation for part_of
      GO:0035458 cellular response to interferon-beta. PMID:35568036, which the
      rest of the model rests on, assays IFN-beta directly and would support the
      process term.
