    GO:0000981 is the STAT1 review's primary core function and occurs_in nucleus
    is right, so the typing is sound. Two structural gaps. The activity has no
    has_input, so the ISGs that the paper measures (Viperin, ISRE reporter) are
    not in the model, and it has no downstream activity, so the model ends at
    the transcription factor. Its part_of is GO:0007259 cell surface receptor
    signaling pathway via JAK-STAT, the neutral parent, where the other three
    activities use GO:0046427 positive regulation of receptor signaling pathway
    via JAK-STAT; the inconsistency is unexplained. Most importantly, nothing
    upstream of STAT1 in this model phosphorylates it on Y701: the JAK-STAT core
    is missing entirely (see the model summary).
notes: >-
  Read-only assessment; the model is not edited. This review incorporates a
  manual review by cjm ("Problematic GO-CAM models"), which treats this model
  together with its three siblings from PMID:35568036: 62b4ffe300004489
  (IFN-gamma variant), 62b4ffe300005467 (OspC1 inhibition) and 62b4ffe300005437
  (OspC3 inhibition). Points confirmed here: one mechanism is split across four
  linear models by the combinatorics of two OspC effectors and two IFN ligands;
  the IFN -> IFNAR -> JAK -> STAT1 component is absent from all four and lives
  only in the unconnected canonical model 62b4ffe300003747; the CALM1
  calcium-ion-binding typing understates the role, for which GO:0061891 calcium
  ion sensor activity is the term; the CALM1 -> CALM1 same-gene chain is present
  here and in all three siblings; Pyk2 (PTK2B, Q14289) is absent and its
  evidence in the paper is indeed thin, resting on the inhibitor TyrA9 alone
  ("First, 293T cells expressing an ISRE reporter were treated with inhibitors
  of CaM (W7), CaMKII (KN93), and its downstream signaling partner Pyk2"), so
  its omission is defensible. Points refined: the missing-location criticism
  applies to the cytosolic CaM and CaMKII activities, not to all host
  activities, since STAT1 (and EP300 in the IFN-gamma model) do carry occurs_in
  nucleus; and GO:0061891 is a lateral re-typing under molecular function
  regulator activity rather than a more specific child of GO:0005509, so the
  swap changes the branch, not just the granularity. Point not applicable to
  this model: the extra EP300 link and the OspC negative-result and apoptosis
  gaps belong to the sibling models and are assessed there.
