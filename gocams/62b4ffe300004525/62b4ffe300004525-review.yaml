  notes: >-
    GO:0005509 is a bare binding term: it says CALM1 binds Ca2+ but not what
    binding Ca2+ accomplishes, which is the whole point of the activity here.
    GO:0061891 calcium ion sensor activity ("Binding to and responding, e.g. by
    conformational change, to changes in the cellular level of calcium ions
    (Ca2+)", OLS, checked 2026-11-02) is the right type and the paper's own
    framing. One refinement of that recommendation: GO:0061891 is not a child of
    GO:0005509. Its parents are GO:0140784 metal ion sensor activity,
    GO:0140299 molecular sensor activity and GO:0098772 molecular function
    regulator activity, so this is a re-typing to a different branch, not a
    specialisation, and the QC flag is BINDING_AS_FUNCTION rather than
    GENERIC_MF. Re-typing also dissolves the CALM1 -> CALM1 edge: sensing Ca2+
    and thereby activating a target kinase is one activity, and a sensor MF with
    a direct positive edge to CAMK2A would replace both CALM1 nodes. The CALM1
    review ACCEPTs GO:0005509 (IDA, PMID:35568036 among others) but does not
    list it as a core function; the core functions are GO:0043539, GO:0072542
    and GO:0005246, hence RELATED rather than CONSISTENT. No occurs_in, although
    the CaM/CaMKII step assayed in this paper is cytosolic.
