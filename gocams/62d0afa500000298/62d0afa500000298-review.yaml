model: gomodel:62d0afa500000298
title: Gluconeogenesis 3 (Mouse)
taxon: NCBITaxon:10090
status: COMPLETE
summary: 'Mouse gluconeogenesis, aspartate (lactate) route, derived from Reactome R-HSA-70263. In the matrix Pcx
  makes oxaloacetate, Got2 transaminates it to aspartate, the inner-membrane aspartate/glutamate carriers Slc25a13
  (citrin) and Slc25a12 (aralar) export aspartate, and Slc25a11 exports the 2-oxoglutarate co-product; cytosolic
  Got1 regenerates oxaloacetate, Pck1 makes PEP, and Eno1, Pgam1, Pgk1, Gapdh, Tpi1 and Aldoc run the reversible
  glycolytic steps in reverse to fructose 1,6-bisphosphate; Fbp1 and Gpi1 give glucose 6-phosphate, which Slc37a4
  moves into the ER for G6pc1 (and G6pc3). Every causal edge is ''directly provides input for'' and every edge''s
  metabolite was traced: each activity''s product is the next activity''s substrate (oxaloacetate, aspartate, 2-oxoglutarate,
  PEP, 2-/3-phosphoglycerate, 1,3-bisphosphoglycerate, glyceraldehyde 3-phosphate/DHAP, fructose 1,6-bisphosphate,
  fructose 6-phosphate, glucose 6-phosphate). The compartment check flags the three carrier -> Got1 edges (inner
  membrane -> cytosol). These were judged an acceptable simplification, not a missing step: the metabolite crosses
  the outer membrane passively through VDAC porins, and the Reactome source itself treats SLC25 exchange as cytosol
  <-> matrix. If the project wants these edges EXPLAINED, a shared outer-membrane passage module should be added
  rather than flagging each model. The weaker points are isoform choices and evidence. Aldoc, the brain aldolase,
  stands in for liver Aldob. Aralar (Slc25a12) is the brain/muscle carrier. G6pc3''s gluconeogenic role rests on
  an astrocyte study, and its main known role is 1,5-anhydroglucitol 6-phosphate removal. Both carriers use the
  generic GO:0015172 where GO:0000515 applies. The Tpi1 enabled_by reference looks like an aldolase C paper (suspected
  source defect). Causal edges carry no evidence throughout, as is usual for these Reactome-derived MGI models;
  Got2 and Slc25a12 also lack evidence on part_of.'
