    not a missing regulated step; see the model summary.'
notes: Read-only assessment; the model is not edited. Inner-membrane carrier -> cytosolic enzyme edges were checked
  and deliberately not flagged NONADJACENT_COMPARTMENTS (passive VDAC passage across the outer membrane, collapsed
  by convention in the Reactome source); raise once as a modelling-convention question, not per model.
  Consistency convention - where no mouse gene review exists, each MGI activity is compared against the
  human orthologue review named in its gene_review path, because GoCamConsistencyEnum has no value for
  consistency with an orthologue review; mouse reviews are used where they exist (Pck1, Gapdh).
