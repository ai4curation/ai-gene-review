  notes: >-
    FOX2 (MFE-2) is the D-bifunctional protein. Its SDR dehydrogenase domains
    oxidise (3R)-3-hydroxyacyl-CoA. GO:0003857 is the (3S)-specific
    dehydrogenase, which is the wrong stereospecificity, and the has_input
