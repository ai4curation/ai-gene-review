    gives the physiological direction as acetoacetyl-CoA synthesis
    (PhysiologicalDirection=left-to-right for 2 acetyl-CoA = acetoacetyl-CoA +
    CoA) and no yeast evidence places Erg10 in glutaryl-CoA catabolism. The
    activity is consistent on function and uncertain on process context. It is
    not WRONG, because Erg10 is the only cytosolic acetoacetyl-CoA thiolase in
    yeast and the reaction it is drawn with is one it catalyses.
