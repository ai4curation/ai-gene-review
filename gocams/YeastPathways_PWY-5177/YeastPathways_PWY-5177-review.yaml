    is one of FOX2's two core functions. occurs_in cytosol is wrong: Fox2 is a
    peroxisomal matrix enzyme, and the review REMOVEs the PWY-5177 cytosol row.
    The part_of GO:0046395 is true of Fox2 only through fatty acid
    beta-oxidation, and the review marks this row MARK_AS_OVER_ANNOTATED. The
    other substrates and products (NAD+ in, NADH, H+ and acetoacetyl-CoA out)
    are consistent with a 3-hydroxyacyl-CoA dehydrogenase.
