    supporting_text: ERG10 catalyzes the formation of acetoacetyl-CoA from acetyl-CoA
  - source_id: file:yeast/ERG10/ERG10-ai-review.yaml
    supporting_text: There is no yeast-specific evidence that Erg10 participates in
      glutaryl-CoA/lysine catabolism; its physiological direction is acetoacetyl-CoA
      synthesis for the mevalonate pathway.
  notes: >-
    The MF GO:0003985 acetyl-CoA C-acetyltransferase activity is correct and is
    ERG10's core function in the gene review. The thiolase reaction is
    reversible, so drawing it in the cleavage direction (has_input
    acetoacetyl-CoA and CoA, has_output acetyl-CoA) is chemically valid, and
