  - source_id: file:yeast/PHS1/PHS1-ai-review.yaml
    supporting_text: Pathway mis-assignment in YeastCyc; Phs1 functions in fatty acid
      elongation, not catabolism, and S. cerevisiae Phs1 has no reported short-chain
      or (3S) activity.
  notes: >-
    PHS1 is attached to the crotonase-type step (crotonyl-CoA + H2O ->
    (S)-3-hydroxybutanoyl-CoA). GO:0018812 3-hydroxyacyl-CoA dehydratase
    activity is true of Phs1 in general, but its curated activity is the more
    specific GO:0102158 very-long-chain (3R)-3-hydroxyacyl-CoA dehydratase
    activity (the review's core function). The has_input/has_output
    metabolites are a C4 (S)-specific intermediate, which Phs1 is not reported
    to use. Its location is the ER membrane, and its process is very-long-chain
    fatty acid elongation, an anabolic pathway. The PHS1 review REMOVEs both the
    PWY-5177 cytosol row and the GO:0046395 row. It keeps the GO:0018812 MF row
