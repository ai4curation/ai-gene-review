    slot: part_of
    requested_change: CHECK
    asserted_value: GO:0046395
    cause: SCOPE_OVER_REACH
    confidence: SUSPECTED
    explanation: >-
      part_of carboxylic acid catabolic process comes from the PWY-5177
      reaction template. Erg10's documented physiological role is the
      condensation of acetyl-CoA to acetoacetyl-CoA for mevalonate and
      ergosterol biosynthesis, and no yeast study places it in glutaryl-CoA
      catabolism. The pathway itself lacks yeast enablers for its first two
      steps. Raised as a query: the reaction is reversible, so the context
      cannot be excluded outright.
