notes: >-
  Structural checks: `just gocam-lint` reported no findings, and
  `just gocam-compartments` resolved all four locations with no non-adjacent
  edges, so no compartment flags apply. The model has no causal edges. Its steps
  are joined by metabolite flow, which the linter accepts, so ORPHAN_ACTIVITY
  is not flagged. The glutaryl-CoA dehydrogenase (GLUTARYL-COA-DEHYDROG-RXN)
  and glutaconyl-CoA decarboxylase reactions survive only as metabolite
  individuals, with no activity or enabler. The model therefore begins at
  crotonyl-CoA, and nothing in it ties it to glutaryl-CoA. The fourth
  activity is not a duplicate entry: activity id RXN-11667 is the single
  hydratase reaction node with two alternative enablers (PHS1, FOX2), which
  the cache flattens into two activities. A suggested upstream action for
  SGD/YeastPathways is to check whether PWY-5177 should be exported to GO-CAM
  at all. Without the first two steps, it contributes only template-derived RCA
  rows, and all three gene reviews dispute those rows.
