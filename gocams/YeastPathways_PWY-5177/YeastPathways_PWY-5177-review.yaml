model: gomodel:YeastPathways_PWY-5177
title: 'glutaryl-CoA degradation - imported from: Saccharomyces Genome Database'
taxon: NCBITaxon:559292
status: COMPLETE
summary: >-
  An automatic import of the YeastPathways (YeastCyc) pathway PWY-5177,
  glutaryl-CoA degradation. Glutaryl-CoA is oxidatively decarboxylated to
  crotonyl-CoA, which is hydrated to 3-hydroxybutanoyl-CoA, oxidised to
  acetoacetyl-CoA, and cleaved by a thiolase into two acetyl-CoA. Only the last
  three steps have enablers. PHS1 and FOX2 share one hydratase node (activity
  id RXN-11667, an entity set flattened into two activities) for crotonyl-CoA
  + H2O -> (S)-3-hydroxybutanoyl-CoA. FOX2 also enables the NAD+-dependent
  dehydrogenase step to acetoacetyl-CoA, and ERG10 enables the thiolytic
  cleavage to acetyl-CoA. All four activities are placed in the cytosol and
  part_of the generic GO:0046395 carboxylic acid catabolic process. Every
  assertion is ECO:0000245 / GO_REF:0000123 from the pathway database. The
  steps are linked only by shared metabolites (has_output of one step is
  has_input of the next), which is normal for these imports. The glutaryl-CoA
  dehydrogenase and glutaconyl-CoA decarboxylase steps are represented only
  by their metabolites and have no yeast enabler. The model reads as a
  reaction-matching template, not a described yeast pathway: no yeast evidence
  places any of the three gene products in glutaryl-CoA or lysine catabolism.
  The PHS1 activity and both FOX2 activities are wrong as drawn. PHS1 is an ER
  membrane very-long-chain (3R)-3-hydroxyacyl-CoA dehydratase of fatty acid
  elongation, not a cytosolic short-chain crotonase. FOX2 is the peroxisomal
  multifunctional enzyme type 2, whose hydratase and dehydrogenase are
  (3R)-specific. The (S)-3-hydroxybutanoyl-CoA intermediate and the
  GO:0003857 (3S)-specific dehydrogenase are therefore the wrong
  stereochemistry for FOX2, and its location is the peroxisome, not the
  cytosol. ERG10 is correctly typed and located (cytosolic acetoacetyl-CoA
  thiolase), but its physiological direction is acetoacetyl-CoA synthesis
  for the mevalonate pathway, so the catabolic process context is doubtful.
  All three gene reviews already flag the PWY-5177-derived RCA rows
  (REMOVE, MODIFY or MARK_AS_OVER_ANNOTATED) in the same way. Two yeast
  genome-scale metabolic models agree. Neither iMM904 nor yeast-GEM 9.1.1 has
  any glutaryl-CoA reaction. yeast-GEM has the same C4 chemistry as the last
  three steps, but in the peroxisome as the final turn of beta-oxidation:
  FOX2 makes and oxidises (R)-3-hydroxybutanoyl-CoA, and POT1, not ERG10,
  cleaves acetoacetyl-CoA. iMM904 lets Erg10 run only in the condensation
  direction.
