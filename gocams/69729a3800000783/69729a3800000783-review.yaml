model: gomodel:69729a3800000783
title: Stxbp1 SNARE assembly (rat)
taxon: NCBITaxon:10116
status: COMPLETE
summary: >-
  A three-activity linear chain for neuronal SNARE complex assembly in rat.
  Munc18-1 (Stxbp1, syntaxin-1 binding, part_of SNARE complex assembly)
  directly provides input for Munc13-1 (Unc13a, protein-containing complex
  binding with has input syntaxin-1A, part_of positive regulation of SNARE
  complex assembly), which directly provides input for VAMP2 (SNARE binding,
  part_of SNARE complex assembly). The story it encodes is the
  Munc18-1/Munc13-1 templated pathway: Munc18-1 holds syntaxin-1 closed,
  the Munc13-1 MUN domain opens syntaxin-1 out of the Munc18-1-syntaxin-1
  complex, and VAMP2 then zippers into the SNARE complex. The causal order
  and the "directly provides input for" edges fit that pathway, since the
  Munc18-1-syntaxin-1 complex is what the MUN domain acts on. The weaknesses
  are in molecular-function typing: all three activities use binding terms.
  For VAMP2 a functional term exists (GO:0005484, helical-bundle zippering
  fusogenic activity, formerly SNAP receptor activity) and is even present in
  the model's object list without being used. For Munc18-1 the gene's own
  review keeps syntaxin-1 binding as a core function but also records a
  protein-macromolecule adaptor (template) role that would carry the SNARE
  assembly claim better. No activity has an occurs_in location (synaptic
  vesicle membrane, presynaptic active zone membrane). The Unc13a -> Vamp2
  edge cites PMID:9030619, a VAMP2 mutagenesis study that does not examine
  Munc13.
