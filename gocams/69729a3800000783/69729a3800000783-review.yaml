    statement: VAMP-2 central-domain mutations change binary and ternary SNARE complex formation.
    supporting_text: >-
      Deletions within the central conserved domain of VAMP-2 eliminated binding
      to either syntaxin 1A or both syntaxin 1A and SNAP-25.
  notes: >-
    The evidence (VAMP-2 mutagenesis affecting complex formation with syntaxin
    1A and SNAP-25) supports VAMP2 participating in SNARE complex assembly, but
    "SNARE binding" is a bare binding term for what is VAMP2's SNARE-motif
    zippering role. GO:0005484 (helical-bundle zippering fusogenic activity,
    the renamed SNAP receptor activity) is the functional term and is already
    listed among the model's objects, apparently left unused. No location is
    given (synaptic vesicle membrane). There is no review for rat Vamp2; the
    human VAMP2 ortholog review makes GO:0005484 its first core function (with
    SNARE complex assembly among its processes) and keeps syntaxin-1 binding as
    a second core function.
