  evidence:
  - source_id: PMID:26030875
    statement: Munc18-1 gates syntaxin-1 entry into the SNARE complex and orchestrates its assembly.
    supporting_text: >-
      Munc18-1 orchestrates SNARE complex assembly through its interactions with
      the SNAREs. For instance, Munc18-1 locks syntaxin-1 in a closed
      conformation that involves intramolecular binding of its N-terminal Habc
      domain and its SNARE motif, gating entry of syntaxin-1 into the SNARE
      complex
  notes: >-
    Matches the rat Stxbp1 review's first core function exactly (GO:0017075
    syntaxin-1 binding, directly involved in SNARE complex assembly and synaptic
    vesicle priming), and that review ACCEPTs the syntaxin-1 binding and SNARE
    complex assembly rows. By the GO-CAM MF guidance it is still a bare binding
    term: what Munc18-1 does with syntaxin-1 (closing it, then templating
    syntaxin-1/VAMP2 assembly with Munc13) is better carried by the review's
    second core function, protein-macromolecule adaptor activity (GO:0030674),
    directly involved in SNARE complex assembly. The outgoing edge to Unc13a
    ("directly provides input for") is right in direction and directness: the
    Munc18-1-syntaxin-1 complex is the MUN domain's substrate. No location.
