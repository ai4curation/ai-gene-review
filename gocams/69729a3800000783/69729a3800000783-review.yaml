  - source_id: PMID:26030875
    statement: The Munc13-1 MUN domain stimulates the transition from the Munc18-1-syntaxin-1 complex to the SNARE complex.
    supporting_text: >-
      This result confirms that MUN933 is functional in stimulating SNARE
      complex assembly starting from the Munc18-1–syntaxin-1 complex.
  - source_id: PMID:26030875
    statement: Munc18-1 alone inhibits SNARE complex formation; the MUN domain relieves this.
    supporting_text: >-
      SNARE assembly reactions started with syntaxin-1 alone or the
      Munc18-1–syntaxin-1 complex illustrate that Munc18-1 strongly inhibits
      SNARE complex formation, whereas addition of either MUN* or MUN933 equally
      facilitates SNARE complex assembly
  notes: >-
    The process (positive regulation of SNARE complex assembly), the has input
    (syntaxin-1A, the protein the MUN domain opens) and the incoming
    Stxbp1 -> Unc13a "directly provides input for" edge are all well supported:
    the Munc18-1-syntaxin-1 complex is exactly what the MUN domain acts on.
    The MF "protein-containing complex binding" is a bare binding term; GO has
    no term for the MUN-domain catalysed opening of syntaxin-1, and the
    syntaxin-1 binding term used by the human ortholog review would be no less
    a binding term, so this is a GO gap rather than a curator error. The
    outgoing Unc13a -> Vamp2 edge is plausible (opened syntaxin-1 accepts
    VAMP2), but its cited reference, PMID:9030619, is a VAMP2 mutagenesis paper
    that does not study Munc13. No location given (presynaptic active zone
    membrane). No review for rat Unc13a; the human UNC13A ortholog review has
    syntaxin-1 binding as a core function directly involved in synaptic vesicle
    priming and positive regulation of SNARE complex assembly, the same process
    this activity is part of.
