model: gomodel:65a1f4f800003542
title: Cell contact inhibition by Hippo signaling (Human).
taxon: NCBITaxon:9606
status: COMPLETE
summary: A compact Hippo signaling model in which WWC2 scaffolds SAV1/MST2 to activate LATS2, LATS2 phosphorylates
  and inactivates YAP1, and YWHAB sequesters phosphorylated YAP1 from the nucleus. NF2/Merlin is modelled as a cytoplasmic
  signaling adaptor in Hippo signaling that directly positively regulates LATS2. The NF2 activity agrees with the
  NF2 gene review; no new hard defect was found in this pass, though the directness of the NF2-to-LATS2 edge is
  inferred from a 2007 Merlin/YAP overexpression result rather than reconstituted biochemistry.
