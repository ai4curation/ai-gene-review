  notes: >-
    GO:1990756 ubiquitin-like ligase-substrate adaptor activity is the right MF
    type for a cullin substrate receptor, and GO:0140627 is the C-end degron
    protein-catabolism process. The cached abstract of PMID:29779948 supports
    C-end-degron-targeting CRL2 adaptors as a class but not the exact KLHDC10
    row, and there is no local KLHDC10 gene review to cross-check, so the node
    is left UNCERTAIN rather than promoted to text-verified OK. The activity has
    no occurs_in assertion.
