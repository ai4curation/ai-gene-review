model: gomodel:63f809ec00000611
title: The CRL2(KLHDC10) complex catalyzes ubiquitination via the DesCEND (destruction
  via C-end degrons) pathway (Human)
taxon: NCBITaxon:9606
status: COMPLETE
summary: >-
  A compact three-activity model of the CRL2(KLHDC10) ubiquitin ligase used in
  the C-end degron rule pathway: CUL2 scaffold activity promotes the KLHDC10
  substrate-adaptor step, and KLHDC10 provides the substrate-recognition input
  for RBX1 ubiquitin ligase activity. The activity and causal structure are
  consistent with the expected cullin-RING architecture, and
  modules/hif_oxygen_sensing.yaml correctly reuses only the CUL2 and RBX1
  activities as evidence for the shared CRL2 core rather than for VHL substrate
  recognition. The three GO-CAM activities cite PMID:29779948, but that local
  publication cache is abstract-only and does not name KLHDC10, CUL2 or RBX1,
  so this review records the exact-activity evidence as not text-verified
  rather than filing source defects. `just gocam-lint` reports missing locations
  on all three activities; the model leaves CRL2(KLHDC10) spatial context
  implicit.
