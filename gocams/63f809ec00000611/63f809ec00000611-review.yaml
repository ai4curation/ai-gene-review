    CUL2 scaffold role in a human CRL2 complex. No CUL2 gene review exists
    locally, and the cached PMID:29779948 abstract does not text-verify the
    exact activity, so the verdict remains UNCERTAIN. The activity has no
    occurs_in assertion.
