      the exact KLHDC10 assertion.
    supporting_text: >-
      We characterize eight Cullin-RING E3 ubiquitin ligase (CRL) complex
      adaptors that regulate C-terminal degrons, including six CRL2 and two
      CRL4 complexes
  - source_id: PMID:33909987
    statement: >-
      The CRL2(KLHDC10) complex is a C-end rule E3 ligase that directly binds
      Ala-tailed ribosome-stalling products for degradation.
    supporting_text: >-
      we identify the CRL2KLHDC10 E3 ligase complex and the novel C-end rule
      E3, Pirh2/Rchy1, as bona fide RQC pathway components that directly bind
      to Ala-tailed ribosome stalling products and target them for degradation
  notes: >-
    GO:1990756 ubiquitin-like ligase-substrate adaptor activity is the right MF
    type for a cullin substrate receptor, and GO:0140627 is the C-end degron
    protein-catabolism process. Cached PMID:33909987 verifies the same KLHDC10
    CRL2 adaptor activity independently, and sibling production model
    gomodel:63f809ec00000560 asserts the same GO:1990756 and GO:0140627
    activity for KLHDC10, with PMID:33909987 evidence attached to the
    enabled_by and part_of associations. The activity remains flagged because
    it has no occurs_in assertion.
