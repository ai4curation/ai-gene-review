  - source_id: PMID:33909987
    statement: >-
      Thrun et al. independently identify CRL2(KLHDC10) as a C-end rule E3
      ligase in the RQC pathway.
    supporting_text: >-
      we identify the CRL2KLHDC10 E3 ligase complex and the novel C-end rule
      E3, Pirh2/Rchy1, as bona fide RQC pathway components that directly bind
      to Ala-tailed ribosome stalling products and target them for degradation
  notes: >-
    CUL2 is the expected scaffold of a CRL2 complex, and
    GO:0160072 ubiquitin ligase complex scaffold activity matches that
    architectural role. The model's CUL2-to-KLHDC10 direct positive edge is
    plausible as assembly of the scaffold with the substrate receptor, and
    modules/hif_oxygen_sensing.yaml uses this activity only to ground the shared
    CUL2 scaffold role in a human CRL2 complex. The verdict remains UNCERTAIN
    because neither cited abstract text-verifies GO:0160072 scaffold activity
    for CUL2 specifically; PMID:33909987 corroborates a CRL2(KLHDC10) C-end
    rule E3, but does not name CUL2 or its scaffold role. The activity has no
    occurs_in assertion, and no CUL2 gene review exists locally.
