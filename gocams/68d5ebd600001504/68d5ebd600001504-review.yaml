notes: >-
  Compartments were checked with just gocam-compartments 68d5ebd600001504: no unresolved location and
  no skipped compartment, with the two cytoplasm fillers reported as coarse. Those two are discussed
  on the DUSP18 and SRC activities rather than flagged, since cytoplasm is true of both proteins and
  the question is only whether this model should say where in the cytoplasm. The whole model rests on
  one primary paper, PMID:38346942, whose human content is a single osteoclast-formation experiment in
  cells from giant cell tumour of bone; everything else is mouse, carried in correctly as ECO:0000250
  against GO_REF:0000024 with mouse Dusp18 (MGI:1922469), Kiss1 (MGI:2663985), Kiss1r (MGI:2148793)
  and Src (MGI:98397) as sources, each confirmed through the Alliance as the stated ortholog. The
  residue the paper names, Tyr 416, is mouse numbering; the model does not state a residue, so nothing
  in it is wrong on that account, but a curator adding one should map it onto human SRC first.
