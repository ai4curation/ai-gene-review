model: gomodel:68d5ebd600001504
title: KISS1/KISS1R signaling pathway is involved in the negative regulation of bone resorption by
  osteoclasts  (Human)
taxon: NCBITaxon:9606
status: COMPLETE
summary: >-
  The bone arm of the same ligand-receptor pair: the kisspeptin-10 chain of KISS1
  (UniProtKB:Q15726-PRO_0000021548) directly positively regulates KISS1R, KISS1R acts on a DUSP18
  protein tyrosine phosphatase activity, and DUSP18 directly negatively regulates SRC kinase
  activity, with the whole chain placed inside negative regulation of osteoclast differentiation and
  negative regulation of bone resorption. The mechanism is taken from one paper, Li et al. 2024
  (PMID:38346942), and the phosphatase half of it is the best-evidenced thing in either kisspeptin
  model: purified DUSP18 dephosphorylates Src at the activating Tyr 416 in vitro while the
  catalytically dead C104S mutant does not, so has_input SRC on the phosphatase and the directly
  negatively regulates edge are both exactly right, and the sign is right because Tyr 416 is an
  activating autophosphorylation site. The receptor half is where the encoding comes apart. Three
  things on the KISS1R activity misstate what that paper shows. Its causal edge uses provides input
  for, which in RO means the upstream activity produces a molecule the downstream activity consumes;
  the receptor produces no such molecule, it recruits already-active Src and the phosphatase to a
  proline/arginine-rich motif in its own C terminus, and it separately raises Dusp18 expression, so
  the edge is a regulation and the sibling GnRH model draws the equivalent step as directly
  positively regulates. Its has_input is SRC, where a receptor's input should be the effector it
  activates; Src here is upstream of complex assembly, since the interactions are abolished by a Src
  kinase inhibitor and by Src knockdown, and SRC is already correctly the phosphatase's input. And
  all the receptor-side activities are placed inside the phospholipase C-activating GPCR pathway,
  which the cited paper's own inhibitor data contradict for this chain: neither the recruitment nor
  the rise in Dusp18 was blocked by the PLC inhibitor U73122. Beyond that, SRC carries the generic
  protein kinase activity term where the model's own mechanism is tyrosine dephosphorylation, KISS1R
  is again the generic GPCR term rather than neuropeptide receptor activity, and no activity declares
  a cell type, although the entire claim is osteoclast-specific and DUSP18 was described on first
  characterization as testis-restricted.
