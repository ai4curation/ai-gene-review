  notes: >-
    DUSP18 has no gene review in this repository, so there is nothing to compare the activity with.
    This is the soundest activity in either kisspeptin model. GO:0004725 protein tyrosine phosphatase
    activity names the chemistry the paper demonstrates, on a real protein substrate rather than a
    surrogate, and I am not flagging it as generic: the more specific child GO:0004726 adds only the
    non-membrane-spanning qualifier, which is topology rather than function. has_input SRC is the
    substrate the activity acts on, which is what that slot is for. The causal edge RO:0002630,
    directly negatively regulates, is right on both counts asked about in review: direct, because the
    in vitro reconstitution with purified proteins is single-step mechanistic evidence rather than a
    knockout phenotype, and negative, because Tyr 416 is the activating autophosphorylation site, so
    removing that phosphate lowers kinase activity. The process placement is also supported in human
    cells, not only in mouse: Kp-10 suppressed osteoclast formation in osteoclasts from human giant
    cell tumour of bone, which is the human leg of the GO:0045671 claim, while the organ-level
    GO:0045779 containment rests on the mouse knockouts and the in vivo Kp-10 rescue. The verdict is
    OK; the two defects recorded here are a request to state the cell type, which is missing from the
    model as a whole, and a question about the precision of the location.
