  notes: >-
    The biological claim this activity makes, that Kp-10 acting on KISS1R switches on DUSP18 in the
    osteoclast, is sound and is supported in human cells as well as mouse. The verdict is WRONG
    because three of its encoded relations each misstate what its own cited evidence shows: the causal
    predicate asserts material transfer where the paper describes recruitment and up-regulation, the
    has_input names a kinase that the paper places upstream of assembly rather than downstream of the
    receptor, and the pathway containment asserts a PLC-activating route that the paper's inhibitor
    data exclude for these steps. Each is recorded separately above so that a curator can act on them
    one at a time. Two further points. The molecular function is the generic GO:0004930, where the
    KISS1R gene review accepts the descendant GO:0008188 neuropeptide receptor activity as core and
    marks the GO:0004930 rows too general; that is a clean subsumption, checked in OLS, so it is
    GENERIC_MF and a consistency of MORE_GENERAL, not an error. The DIRECT_VS_INDIRECT_CAUSAL flag is
    recorded because the single outgoing edge merges an immediate recruitment step with a
    transcriptional arm that is several steps long; the relation-kind problem is the typed defect above,
    since the flag vocabulary has no value for it. The process containment inside negative regulation
    of osteoclast differentiation and negative regulation of bone resorption matches what the KISS1R
    gene review keeps as non-core rows for this receptor, so the bone framing itself is consistent.
