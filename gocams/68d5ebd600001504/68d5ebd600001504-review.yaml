    the relevant rows are settled there. Beyond the generic molecular function recorded above, three
    observations. The location GO:0005737 cytoplasm mirrors a GOA row that the SRC review examined and
    accepted, on this same publication, so it is not recorded as a defect here even though in this
    model's mechanism the step happens at the plasma membrane, where the paper's immunofluorescence
    puts Dusp18 and Src together; the SRC review's own core-function locations are plasma membrane and
    focal adhesion. The process placement, osteoclast differentiation inside bone resorption
    transferred from mouse Src (MGI:98397, confirmed through the Alliance), matches the two rows the
    SRC review keeps as non-core for this gene, so it is consistent; GO does not itself assert that
    osteoclast differentiation is part of bone resorption, checked in OLS, so that nesting is this
    model's contextual claim, and it is a defensible one, though note that the paper's framing of Src's
    essential role in osteoclasts is functional rather than developmental. Finally, this activity is
    the end of the chain and has no outgoing edge: what SRC does to drive resorption, and how its
    dephosphorylation reduces it, is not represented, so the model stops one step short of the process
    it is named for. That is scope, not error, and it is not an orphan activity, since the phosphatase
    edge comes into it.
