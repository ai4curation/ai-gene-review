model: gomodel:66c7d41500000672
title: ' NMDA glutamate receptor activity co-activated by glycine and involving GRIN1 and GRIN2B (Human)'
taxon: NCBITaxon:9606
status: COMPLETE
summary: 'GluN1 (GRIN1) and GluN2B (GRIN2B) each carry NMDA glutamate receptor activity at the postsynaptic membrane;
  glycine activates GluN1 and L-glutamate activates GluN2B. The two subunit activities each "directly positively
  regulate" (RO:0002629) a third activity enabled by the complex term. The ligand each subunit senses is attached
  to that subunit as a small-molecule activator (RO:0012001), and ion flux (has input / has output) sits on the
  complex activity. Terms and structure are correct. Three evidence records need repair: the GluN2B causal edge
  pairs an experimental code (ECO:0000314) with the ortholog-transfer reference GO_REF:0000024, one glutamate activator
  association on GluN2B has no evidence at all, and two references are written "PMID: 24272827" with a space.'
