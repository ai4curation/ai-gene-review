    supporting_text: >-
      including density for the amide linkage to the N-terminal cysteine (C24)
      of Hedgehog, indicates that the palmitoylation reaction has occurred
  - source_id: PMID:24342078
    statement: >-
      Processed, cholesterol-tethered Hedgehog is actively secreted by
      Dispatched and Scube2 rather than passively appearing extracellularly.
    supporting_text: >-
      The processed N-terminal fragment would be retained in the cell by its
      cholesterol tail, except it is actively secreted by the synergistic
      actions of Disp and the secreted protein Scube2
  notes: >-
    GO:0019706, GO:0051604 and GO:0005789 agree with the completed HHAT review:
    protein maturation is the right process, and the enzyme is an ER-membrane
    acyltransferase. The MF term is the best available GO term despite its
    sulfur-vs-N-terminal chemistry caveat; the HHAT gene review proposes a
    protein-cysteine N-palmitoyltransferase activity term that would capture
    HHAT's amide-forming chemistry more precisely. GO-CAM compartment QC
    classifies the HHAT-to-mature-SHH edge as RELOCATING rather than
    non-adjacent because HHAT acts on SHH at the ER membrane and SHH then acts
    extracellularly, so the Dispatched/Scube2 release step is a downstream
    module feature rather than a defect in this direct regulatory edge. The
    nested GO:0045880 positive regulation of smoothened signaling pathway
    parent is likewise acceptable because HHAT palmitoylation licenses the SHH-N
    ligand output that later engages Patched.
