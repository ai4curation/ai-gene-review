    explanation: >-
      The HHAT protein-cysteine S-palmitoyltransferase activity directly
      positively regulates extracellular SHH-ShhN morphogen activity in the
      source model. The palmitoylation step finishes lipidation in the
      endoplasmic reticulum membrane, but the dually lipidated ligand is still
      cholesterol-tethered and requires a Dispatched/Scube2 release step before
      it can act extracellularly. Please check whether this edge should be
      changed to an indirect regulatory relation, or whether a release/export
      activity should be inserted between ER maturation and extracellular
      morphogen activity.
