model: gomodel:696022cd00000016
title: Protein maturation of SHH by autocleavage, autocholesterylation and palmitoylation
  by HHAT (Human).
taxon: NCBITaxon:9606
status: COMPLETE
summary: >-
  This compact human Hedgehog-biogenesis model captures the intrinsic SHH
  precursor cholesterolysis/autoprocessing cycle, the HHAT-catalyzed
  N-terminal acylation step, and the mature SHH-N morphogen output. The HHAT
  palmitoyltransferase and SHH cholesterol-transfer activities match the
  completed human gene reviews, and the same ordered chemistry is already
  represented generically in modules/hedgehog_signaling.yaml. Two edges need
  qualification. The pair of SHH precursor self-processing activities are a
  curator decision to split one Hint/Hog reaction cycle into endopeptidase-like
  cleavage and cholesterol transfer. The GO:0004175 term conflicts with the
  local SHH review's preferred GO:0140853 repair but is left here as an
  unresolved GO-level modeling question, mirroring the Hedgehog module and
  PTHR11889 review. The HHAT-to-mature-SHH edge compresses a required release
  step: N-palmitoylation finishes the ER lipidation program, but Dispatched and
  Scube2 are needed to move cholesterol-tethered ligand from the producing cell
  before extracellular morphogen activity is available.
