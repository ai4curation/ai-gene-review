notes: >-
  Reviewed against genes/human/SHH/SHH-ai-review.yaml,
  genes/human/HHAT/HHAT-ai-review.yaml, modules/hedgehog_signaling.yaml and
  modules/cerebellum_development.yaml. The reusable Hedgehog module already
  pins all four activities from this GO-CAM to the generic
  Hedgehog-ligand-biogenesis tier, and the cerebellum-development module
  intentionally cites only the mature SHH-N output as a Purkinje-cell
  developmental signal. The only model-level gap relative to
  modules/hedgehog_signaling.yaml is the release/export handoff between the
  HHAT ER-membrane activity and extracellular SHH-N morphogen activity.
