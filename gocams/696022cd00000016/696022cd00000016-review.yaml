  notes: >-
    The SHH review modifies human GO:0004175 endopeptidase activity rows to the
    mechanistically precise cholesterol-protein transferase activity
    GO:0140853 because Hedgehog self-cleavage is a cholesterolysis reaction, not
    ordinary peptide-bond hydrolysis. The GO-CAM and
    modules/hedgehog_signaling.yaml deliberately keep the GO:0004175 cleavage
    framing as one half of the same Hint/Hog self-processing cycle, and the
    PTHR11889 family review leaves GO:0004175 unresolved rather than treating
    it as a clear source defect. Its direct edge to the GO:0140853 cholesterol
    transferase activity is the same-gene chain reported by gocam-lint, and its
    GO:0016540 protein autoprocessing assertion is nested under GO:0051604
    protein maturation in the cached model; both fit the GO-CAM's deliberate
    two-activity representation of one intramolecular maturation cycle.
