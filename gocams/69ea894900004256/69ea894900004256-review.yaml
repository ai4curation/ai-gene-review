  supporting_text: >-
    the native rod CNG functions as a heterotetramer consisting of three A1 and
    one B1 subunits
  evidence:
  - source_id: PMID:34699778
    statement: >-
      The human rod CNG channel is a CNGA1/CNGB1 heterotetramer, matching the
      source model's CNGA1 and CNGB1 complex parts.
    supporting_text: >-
      the native rod CNG functions as a heterotetramer consisting of three A1
      and one B1 subunits
  - source_id: PMID:34699778
    statement: Human CNGA1/CNGB1 channels are fully activated by cGMP.
    supporting_text: >-
      While cGMP can fully activate both CNGA1 and CNGA1/B1
  - source_id: PMID:19299621
    statement: >-
      Rod CNG channels normally localize to the rod outer-segment plasma
      membrane.
    supporting_text: >-
      CNG channels localize exclusively to the plasma membrane of photosensitive
      outer segments of rod photoreceptors
  notes: >-
    The activity matches the rod CNG channel represented in
    modules/cyclic_nucleotide_gated_channels.yaml: the generic GO:0017071
    complex has CNGA1 and CNGB1 parts, GO:0005223 is the specific cGMP-gated
    cation-channel MF, and GO:0042622 is the expected rod outer-segment plasma
    membrane. The model records extracellular sodium and calcium as inputs and
    the same cations on the cytoplasmic side as outputs, consistent with CNG
    channel influx. Because the GO-CAM is enabled by a GO complex rather than a
    gene product, there is no single local gene review to join; the completed
    CNGA1 and CNGB1 reviews both support the matching rod-channel complex.
