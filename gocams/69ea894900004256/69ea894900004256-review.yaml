    statement: >-
      The human rod CNG channel is a CNGA1/CNGB1 heterotetramer, matching the
      source model's CNGA1 and CNGB1 complex parts.
    supporting_text: >-
      the native rod CNG functions as a heterotetramer consisting of three A1
      and one B1 subunits
  - source_id: PMID:34699778
    statement: Human CNGA1/CNGB1 channels are fully activated by cGMP.
    supporting_text: >-
