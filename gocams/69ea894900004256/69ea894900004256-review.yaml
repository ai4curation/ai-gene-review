      membrane of rod outer segments.
  - source_id: PMID:19299621
    statement: >-
      Human CNGB1 lacking its ANK3-binding site still associates with CNGA1 but
      no longer recruits ANK3.
    supporting_text: >-
      Co-expressed CNG-alpha1 with mutant CNG-beta1 (RP deletion or IL1237AA
      mutation) in HEK 293 cells abolished ankyrin-G binding without affecting
      the normal CNG-alpha1 and CNG-beta1 association
  notes: >-
    GO:0106006 cytoskeletal protein-membrane anchor activity captures the
    adaptor/anchoring role better than either bare protein binding or the
    generic cargo adaptor term GO:0140312: ankyrin-G binds the beta subunit, uses
    the channel as its input cargo, and promotes its transport to the
    specialized rod outer-segment plasma membrane. The human ANK3 gene has no
    local review yet, so consistency is NO_GENE_REVIEW. The current direct
    positive edge to the channel activity needs checking, however: ankyrin-G is
    needed for CNG-beta1 targeting and the same source reports shortened rod
    outer segments after ankyrin-G depletion, so the edge is best read as
    upstream of channel localization rather than immediate regulation of
    channel conductance.
  source_defects:
  - defect_type: WRONG_CAUSAL_RELATION
    resource: GO_CAM
    record: gomodel:69ea894900004256/69ea894900004343
    slot: causal_associations
    requested_change: CHECK
    asserted_value: RO:0002629 to gomodel:69ea894900004256/69ea894900004257
    confidence: PROBABLE
    explanation: >-
      The model asserts that ANK3 cytoskeletal protein-membrane anchor activity
      directly positively regulates the CNGA1/CNGB1 channel activity. The cited
      paper supports ankyrin-G binding to CNGB1 and ankyrin-G dependence for
      CNG-beta1 trafficking to the rod outer segment, but the edge from ANK3 to
      cGMP-gated channel conductance spans post-Golgi transport, ROS membrane
      residence, and probably ROS assembly or maintenance. The knockdown also
      shortened rod outer segments, so it does not by itself establish a single
      direct step from ANK3 anchoring to channel activity. Curators should either
      downgrade this causal relation to an indirect upstream relation or insert
      an explicit CNG-channel localization/transport intermediate.
    supported_by:
    - reference_id: PMID:19299621
      supporting_text: Thus, ankyrin-G is required for transport of CNG channels to the plasma membrane
        of rod outer segments.
    - reference_id: PMID:19299621
      supporting_text: Thus, ankyrin-G plays role(s) in either assembly and/or maintenance of ROS in
        addition to localization of the CNG channel.
