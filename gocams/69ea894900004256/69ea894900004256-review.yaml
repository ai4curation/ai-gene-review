  - source_id: PMID:19299621
    statement: >-
      Rod CNG channels normally localize to the rod outer-segment plasma
      membrane.
    supporting_text: >-
      Cyclic nucleotide-gated (CNG) channels localize exclusively to the plasma
      membrane of photosensitive outer segments of rod photoreceptors where they
      generate the electrical response to light.
  notes: >-
    The activity matches the rod CNG channel represented in
    modules/cyclic_nucleotide_gated_channels.yaml: the generic GO:0017071
    complex has CNGA1 and CNGB1 parts, GO:0005223 is the specific cGMP-gated
    cation-channel MF, and GO:0042622 is the expected rod outer-segment plasma
    membrane. The model records extracellular sodium and calcium as inputs and
    the same cations on the cytoplasmic side as outputs, consistent with CNG
    channel influx. Because the GO-CAM is enabled by a GO complex rather than a
    gene product, there is no single local gene review to join. The completed
    CNGA1 and CNGB1 reviews both support the matching rod-channel complex, and
    CNGA1 is listed here as a representative complex-subunit review.
