model: gomodel:69ea894900004256
title: CNG channel transport by ankyrin-G/ANK3_Visual perception (Human)
taxon: NCBITaxon:9606
status: COMPLETE
summary: >-
  A compact rod-channel transport model. ANK3 binds the CNGB1 subunit of the rod
  CNGA1/CNGB1 cyclic-nucleotide-gated channel and supports channel delivery to
  the rod outer-segment plasma membrane; the model then links that localized
  channel complex to cGMP-gated sodium and calcium influx in visual perception.
  The ANK3 and channel molecular-function terms are specific, the channel is
  represented as the shared activity of a CNGA1/CNGB1-containing complex rather
  than as CNGB1 alone. The model's one causal edge is spatially local to the
  photoreceptor outer-segment membrane, but it overstates directness: the
  ANK3-to-channel edge cites a mutant phenotype that can span CNGB1 binding,
  post-Golgi trafficking, outer-segment assembly or maintenance, and membrane
  residence before reaching cGMP-gated conductance. The ANK3 activity has no
  local gene review yet, while the CNGA1 and CNGB1 reviews and the
  cyclic-nucleotide-gated-channel module agree with the rod channel annoton.
