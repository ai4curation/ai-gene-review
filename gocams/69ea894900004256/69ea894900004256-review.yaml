model: gomodel:69ea894900004256
title: CNG channel transport by ankyrin-G/ANK3_Visual perception (Human)
taxon: NCBITaxon:9606
status: COMPLETE
summary: >-
  A compact rod-channel transport model. ANK3 binds the CNGB1 subunit of the rod
  CNGA1/CNGB1 cyclic-nucleotide-gated channel and supports channel delivery to
  the rod outer-segment plasma membrane; the model then links that localized
  channel complex to cGMP-gated sodium and calcium influx in visual perception.
  The ANK3 and channel molecular-function terms are specific, the channel is
  represented as the shared activity of a CNGA1/CNGB1-containing complex rather
  than as CNGB1 alone, and the one causal edge is local to the photoreceptor
  outer segment membrane. The ANK3 activity has no local gene review yet, while
  the CNGA1 and CNGB1 reviews and the cyclic-nucleotide-gated-channel module
  agree with the rod channel annoton.
activity_reviews:
- activity_id: gomodel:69ea894900004256/69ea894900004343
  gene_product: UniProtKB:Q12955
  molecular_function: GO:0106006
  biological_process: GO:0072659
  cellular_component: GO:0042622
  verdict: OK
  consistency: NO_GENE_REVIEW
  supporting_text: >-
    Thus, ankyrin-G is required for transport of CNG channels to the plasma
    membrane of rod outer segments.
  evidence:
  - source_id: PMID:19299621
    statement: >-
      ANK3/ankyrin-G is required for transport of CNGB1-containing cyclic
      nucleotide-gated channels to the rod outer-segment plasma membrane.
    supporting_text: >-
      Thus, ankyrin-G is required for transport of CNG channels to the plasma
      membrane of rod outer segments.
  - source_id: PMID:19299621
    statement: >-
      Human CNGB1 lacking its ANK3-binding site still associates with CNGA1 but
      no longer recruits ANK3.
    supporting_text: >-
      Co-expressed CNG-alpha1 with mutant CNG-beta1 (RP deletion or IL1237AA
      mutation) in HEK 293 cells abolished ankyrin-G binding without affecting
      the normal CNG-alpha1 and CNG-beta1 association
  notes: >-
    GO:0106006 cytoskeletal protein-membrane anchor activity captures the
    adaptor/anchoring role better than bare protein binding: ankyrin-G binds the
    beta subunit, uses the channel as its input cargo, and promotes its transport
    to the specialized rod outer-segment plasma membrane. The direct positive
    edge to the channel activity is read as a single localizing step that makes
    the CNGA1/CNGB1 channel available at its operating membrane, not as acute
    gating of existing CNG pores. The human ANK3 gene has no local review yet,
    so consistency is NO_GENE_REVIEW.
