notes: >-
  `just gocam-lint` reports only informational no_narrative and small_model
  findings, and `just gocam-compartments` finds both activity locations resolved
  with the one direct edge staying within the photoreceptor outer segment
  membrane. The existing cyclic_nucleotide_gated_channels module already pins
  gomodel:69ea894900004256/69ea894900004257 to its rod CNGA1/CNGB1 channel
  annoton. It intentionally leaves ANK3-dependent outer-segment trafficking out
  of scope, so no module edit was needed for this review.
