  source_defects:
  - defect_type: MISSING_STATEMENT
    resource: GO_CAM
    record: gomodel:6606056e00000678/6606056e00000679
    slot: causal_associations
    requested_change: CHECK
    asserted_value: RO:0012010
    cause: UNKNOWN
    confidence: CONFIRMED
    explanation: >-
      The edge from the NCOA1 (UniProtKB:Q15788) transcription coactivator activity to the UBR5
      ubiquitin protein ligase activity, removes input for (RO:0012010), has no evidence line. This
      edge is the model's representation of the condition in its title, that UBR5 acts on ESR1 only
      when ESR1 is not bound to a coactivator. RO defines "removes input for" as p causally upstream
      of q, where p and q both have input c and p reduces the levels of c. The NCOA1 activity in this
      model has no has_input, so the shared input (ESR1) that the relation requires is not stated.
      The evidence that exists is in PMID:37478846. It is for RARA: excess full-length NCOA1 impaired
      UBR5 binding to RARA in vitro, and NCOA1 binding preceded UBR5 binding over an ATRA time course.
      For the estrogen receptor the study shows only that estradiol induces UBR5 binding, and it
      extends the competition to ER by generalisation. Please add evidence to the edge, indicating
      that the ER case is extrapolated from RARA or citing an ER-specific competition study, and add
      ESR1 (UniProtKB:P03372) as has_input of the NCOA1 activity. The sibling VDR
      (gomodel:6606056e00000576) and PGR (gomodel:6606056e00000637) models also have no evidence on the
      same edge; the RARA/RXRA model (gomodel:6606056e00000485) has one evidence line.
    supported_by:
    - reference_id: PMID:37478846
      supporting_text: we found UBR5 binding to RARA in vitro was impaired by an excess of full-length
        NCOA1 (Figure 2E), confirming that NCOA1 and UBR5 directly compete for the H3/H4 hydrophobic
        cleft.
    - reference_id: PMID:37478846
      supporting_text: In a direct binding assay with recombinant proteins, the UBR5-ER interaction
        was induced by estradiol but not fulvestrant
  notes: >-
    Transcription coactivator activity (GO:0003713) is the core function of the NCOA1 gene review,
    which also accepts the chromatin row from PMID:15831516 and the estrogen receptor signaling pathway
    row from PMID:7481822 that this activity cites, so the activity is CONSISTENT. The enabled_by
    citation, PMID:15919756, is a study of the coactivator SYT whose abstract does not mention NCOA1.
    The NCOA1 review accepts the GOA IDA row from the same paper, and I have not seen the full text,
    so I defer to the curator. The doubt about this activity is entirely
    its outgoing edge (defect above). Whether "removes input for" is the best relation for
    competitive occupancy of a binding cleft is debatable, since NCOA1 shields ESR1 rather than
    lowering its level, but the same convention is used for the same step across the series, so I
    raise it only as part of that defect. Chromatin does not resolve to the nucleus
    (UNRESOLVED_COMPARTMENT; GO:0000228 nuclear chromosome would state it).
