  evidence:
  - source_id: PMID:15831516
    statement: ERalpha binds an estrogen response element and drives estrogen-dependent transcription
      in human MCF-7 cells (nuclear receptor activity and the pathway).
    supporting_text: Direct binding of ERalpha to the ERE was shown using EMSAs, and transient
      transfections in MCF-7 cells demonstrated that endogenous ERalpha can induce estrogen-dependent
      transcriptional activation from the module or the ERE linked to a heterologous promoter.
  - source_id: PMID:15831516
    statement: ERalpha occupies genomic regulatory modules in vivo (chromatin location).
    supporting_text: We isolated 12 transcriptionally active genomic modules that recruit ERalpha and
      the coactivator steroid receptor coactivator (SRC)-3 to different intensities in vivo.
  - source_id: PMID:15831516
    statement: Estrogen-dependent recruitment of SRC-1 (NCOA1) to an ERalpha-bound module, which
      supports the direct positive edge from ESR1 to NCOA1.
    supporting_text: ChIP assays showed that the coregulators SRC-1, SRC-3, and receptor-interacting
      protein 140 are recruited to this intronic module in an estrogen-dependent manner.
  - source_id: PMID:9338790
    statement: 17beta-estradiol bound in the ER ligand-binding domain (the small-molecule activator).
    supporting_text: Here we report the crystal structures of the LBD of ER in complex with the
      endogenous oestrogen, 17beta-oestradiol, and the selective antagonist raloxifene
  - source_id: PMID:9338790
    statement: Agonist binding sets the conformation of the transactivation surface, the structural
      basis for coactivator recruitment.
    supporting_text: each class of ligand induces a distinct conformation in the transactivation
      domain of the LBD, providing structural evidence of the mechanism of antagonism.
  notes: >-
    Nuclear receptor activity (GO:0004879) with 17beta-estradiol as small-molecule activator, part of
    the estrogen receptor signaling pathway (GO:0030520), is the correct and specific description of
    ligand-activated ERalpha. The direct positive edge to the NCOA1 coactivator activity follows the
    convention used across this series of models (receptor activity directly positively regulates
    coactivator activity), and the estrogen-dependent recruitment of SRC-1 to an ERalpha-bound
    module in MCF-7 cells supports it on human data. The incoming negative edge from UBR5 is
    discussed on that activity. The only issue here is the location: chromatin does not resolve to
    the nucleus (UNRESOLVED_COMPARTMENT); the ChIP evidence places the receptor on nuclear chromatin,
    for which GO:0000228 nuclear chromosome is the term that states it. The enabled_by evidence is a
    direct assay in both papers (crystal structure with ligand; EMSA and reporter transactivation),
    which is appropriate. No gene review exists for ESR1. The ESR2 review in this repository covers
    the paralogue, not this gene product.
