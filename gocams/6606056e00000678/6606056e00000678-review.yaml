    explanation: >-
      The UBR5 (UniProtKB:O95071) ubiquitin protein ligase activity is part_of GO:0071630 nuclear
      protein quality control by the ubiquitin-proteasome system. GO defines it as a protein quality
      control pathway that breaks down misfolded, damaged or unassembled proteins. The cited study
      (PMID:37478846) describes something else: agonist-triggered degradation of an activated,
      ligand-bound receptor, which it frames as a regulator of hormone-induced transcription. Nothing
      in it describes the estrogen receptor as misfolded, damaged or unassembled. A protein catabolic
      process such as GO:0043161 (proteasome dependence was shown for the RARA reporter) or
      GO:0006511 ubiquitin-dependent protein catabolic process would state what was shown. The same
      process term is used on the UBR5 activities of the sibling models for RARA/RXRA
      (gomodel:6606056e00000485), VDR (gomodel:6606056e00000576) and PGR (gomodel:6606056e00000637),
      so this is raised once as a question about the series' convention.
    supported_by:
