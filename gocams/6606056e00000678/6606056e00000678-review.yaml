    cause: UNKNOWN
    confidence: SUSPECTED
    explanation: >-
      The UBR5 activity directly negatively regulates (RO:0002630) the ESR1 (UniProtKB:P03372) nuclear
      receptor activity, citing PMID:37478846. The negative sign reflects UBR5-dependent degradation of
      the agonist-bound receptor, which the study shows for an ER reporter. The same study, however,
      found that UBR5 knockdown strongly decreased agonist-induced transcription of RARA target genes
      and concluded that UBR5 is "a common mediator and regulator of NR-induced transcription"; it
      reported no estrogen-induced transcriptional readout for ER. As drawn, the edge says UBR5 lowers
      the receptor's transcription factor activity, which is what the study's transcriptional data
      argue against for the one receptor where it was measured. Please check whether the edge is meant
      to state only that UBR5 ends the receptor's activity by degrading it. If it is, that reading
      should be made explicit. If it is meant to cover the receptor's transcriptional output, the sign
      is not supported for ESR1.
    supported_by:
    - reference_id: PMID:37478846
      supporting_text: Among genes responsive to ATRA in our data (Figure 4C) and previously
        characterized as ATRA-induced genes41,42 (Figure S6E), UBR5 knockdown strongly decreased
        transcriptional activation, suggesting a role for UBR5 in ATRA-induced gene expression.
    - reference_id: PMID:37478846
      supporting_text: We establish the UBR5 transcriptional regulatory hub as a common mediator and
        regulator of NR-induced transcription.
  notes: >-
    has_input ESR1 is the right filler for a ligase activity, because ESR1 is the substrate, and it is
    supported for the estrogen receptor by estradiol-induced direct binding of the recombinant
    proteins. UBR5 is a HECT ubiquitin ligase and ubiquitin protein ligase activity (GO:0061630) is
    its function. The study does not assay ubiquitination of ER directly. It shows the binding and the
    UBR5 requirement for ER reporter degradation, and it shows HECT-domain dependence for GR, so the
    claim that UBR5 ubiquitinates ESR1 is an inference, although a reasonable one. The direct-assay
    code on the edge fits the binding data better than the degradation data, which come from a
    CRISPR screen (mutant phenotype). The chromatin location was demonstrated by ChIP-seq at RARA
    sites in NB4 cells and at GR sites in A549 cells, not at ER sites. Chromatin (GO:0000785) does not
    resolve to the nucleus in GO; GO:0000228 nuclear chromosome states the location these ChIP
    experiments show. The same location is used on all three activities and is flagged on each. No
    gene review exists for UBR5.
