model: gomodel:6606056e00000678
title: UBR5 ubiquitinates ligand-bound ESR1 when ESR1 is not associated with Nuclear receptor
  coactivators (NCOAs) (Human).
taxon: NCBITaxon:9606
status: COMPLETE
summary: >-
  A three-activity loop on chromatin. Estradiol-activated ESR1 (nuclear receptor activity, with
  17beta-estradiol as small-molecule activator) directly positively regulates NCOA1 transcription
  coactivator activity. NCOA1 "removes input for" (RO:0012010) the UBR5 ubiquitin protein ligase
  activity. UBR5 takes ESR1 as input and directly negatively regulates ESR1's receptor activity, as
  part of nuclear protein quality control by the ubiquitin-proteasome system (GO:0071630). The model
  is one of a series built from a single study (PMID:37478846), with sibling models for RARA/RXRA, VDR
  and PGR. That study supports the core claim for the estrogen receptor. Estradiol, but not
  fulvestrant, induced direct binding of recombinant UBR5 and ER, and UBR5 guides prevented
  ligand-induced degradation of an ER reporter in a CRISPR screen. The condition in the title is
  shown for other receptors, not for ESR1. NCOA1 directly competed with UBR5 for RARA in vitro, and
  coactivator-then-UBR5 binding was followed over time for RARA and the glucocorticoid receptor.
  For ER there is only the paper's general conclusion that NCOAs and UBR5 bind the same cleft. Four
  further points need a curator. The edge that encodes the condition (NCOA1 removes input for UBR5)
  carries no evidence at all, and NCOA1 is given no has_input, although the relation requires the
  two activities to share an input. The process term describes degradation of misfolded, damaged or
  unassembled proteins, whereas the study describes agonist-triggered turnover of an active
  receptor. The negative sign of the UBR5-to-ESR1 edge captures receptor degradation, but the same
  study found UBR5 knockdown reduced agonist-induced transcription for RARA and concluded that UBR5
  is a mediator of NR-induced transcription; it measured no ER transcriptional output. Ubiquitination
  of ER itself was not assayed: the ligase activity on ESR1 is inferred from binding and
  UBR5-dependent degradation. All three activities are placed on chromatin, which does not resolve to
  the nucleus. The ESR1 and NCOA1 activities, and the ESR1-to-NCOA1 edge, are well supported by human
  MCF-7 data.
