    supported_by:
    - reference_id: PMID:27889227
      supporting_text: Family B GPCRs like the PTHR exhibit bifurcating signaling pathways, one
        involving adenylyl cyclase and using cAMP as a second messenger
  notes: >-
    Adenylate cyclase activity at the plasma membrane, contributing to cAMP biosynthesis, is the
    correct molecular function and location for ADCY1, a transmembrane adenylyl cyclase, and the
    incoming direct edge from the Gs-alpha activity is the right relation. Two things keep the
    verdict at UNCERTAIN. First, the evidence: nothing cited names ADCY1 (defect above). In QuickGO,
    human ADCY1's adenylate cyclase activity itself rests on ISS from bovine P19754, IBA and a
    Reactome TAS, with no human direct assay, so the model adds no new support. Second, the choice of
    isoform in an FSH receptor chain: ADCY1 is the calcium/calmodulin-stimulated cyclase, and nothing
    in the model ties ADCY1, as opposed to another isoform, to FSHR signalling or to an FSH target
    cell. The model title ("GPCR - AC activating") suggests a template, in which case ADCY1 is a
    stand-in; the model does not say so. This is the model's terminal activity: no edge leaves it,
    which is acceptable for a cAMP output, and the process here (GO:0006171) is not tied into the
    GO:0007189 pathway that the other three activities share. No gene review exists for ADCY1.
