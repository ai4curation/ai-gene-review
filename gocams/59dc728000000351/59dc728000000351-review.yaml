model: gomodel:59dc728000000351
title: GPCR - AC activating
taxon: NCBITaxon:9606
status: COMPLETE
summary: >-
  A four-activity sketch of the follicle-stimulating hormone (FSH) receptor's cAMP output. FSHB
  carries follicle-stimulating hormone activity in the extracellular region, takes FSHR as input
  and directly positively regulates FSHR receptor activity at the plasma membrane. FSHR
  indirectly positively regulates (RO:0002407) a GNAS adenylate cyclase activator activity on the
  cytoplasmic side of the plasma membrane, which directly positively regulates ADCY1 adenylate
  cyclase activity, part of cAMP biosynthesis. The ligand, receptor and G protein are placed in the
  adenylate cyclase-activating G protein-coupled receptor signalling pathway (GO:0007189). The
  biology is the textbook FSH-Gs-cAMP route and the receptor activity agrees with the FSHR gene
  review, but the model's evidence does not support it. Every slot of every activity cites
  PMID:27889227, a review of GPCR trafficking centred on the parathyroid hormone receptor whose full
  text never mentions FSH, FSHR, follicles or gonadotropins and names no adenylyl cyclase isoform.
  Two evidence lines added on 2026-02-26 are defective: the GNAS enabled_by carries a direct-assay
  code with no reference, and the GNAS-to-ADCY1 edge cites PMID:123, a 1975 surgical study of
  duodenogastric reflux, which reads as a placeholder. There are also three modelling problems. The
  receptor-to-G-protein edge is marked indirect although receptor-catalysed GDP-GTP exchange on
  Gs-alpha is a single direct step, as the cited review itself says and as the structure of the
  FSH-FSHR-Gs complex shows. The G protein is the XLalphas entry (UniProtKB:Q5JWF2) rather than the
  canonical Gs-alpha entry (UniProtKB:P63092) used for every other Gs-alpha activity in the cached
  GO-CAMs, including the granulosa-cell FSH model gomodel:69b3372b00003343. And the hormone activity
  is placed on the FSH beta chain alone, although FSH acts as an alpha-beta heterodimer, which the
  sister model represents with the FSH complex term.
