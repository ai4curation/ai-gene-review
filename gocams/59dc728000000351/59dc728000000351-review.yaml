      coupling only by similarity to rat. If the intention was the gene-level Gs-alpha, please
      repoint to P63092. If XLalphas was meant deliberately, a reference showing XLalphas coupling to
      FSHR or acting in an FSH target cell would be needed.
  notes: >-
    The activity type and its location are reasonable for a Gs-alpha subunit: GO:0010856 adenylate
    cyclase activator activity names what activated Gs-alpha does to adenylyl cyclase, and the
    cytoplasmic side of the plasma membrane is where it does it. It differs from the convention used
    in every other cached Gs-alpha activity, which is GO:0003925 G protein activity with a direct
    positive edge to adenylate cyclase activity; the two terms sit in different branches (GO:0010856
    under enzyme activator activity, GO:0003925 under GTPase activity), so this is a choice of
    representation rather than an error, and I do not flag it. The outgoing edge, directly positively
    regulates ADCY1 adenylate cyclase activity, has the right directness and direction for Gs-alpha
    acting on a transmembrane cyclase. The incoming edge from FSHR is discussed on that activity. The
    problems are entirely in identity and evidence: the XLalphas accession, an untraceable
    direct-assay line on enabled_by and a placeholder PMID on the edge (defects above), plus a
    supporting review that speaks only of GPCRs and Gs in general. No consistency check is possible:
    the repository's genes/human/GNAS review is of NESP55 (UniProtKB:O95467), and there is no review
    of either XLalphas (Q5JWF2) or Gs-alpha (P63092). Compartment check: all locations resolve and
    both edges touching this activity are SAME or ADJACENT; no lead to dismiss.
