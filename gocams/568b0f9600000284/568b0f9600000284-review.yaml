    Nothing here is wrong, but the whole activity is inferred from expression
    rather than function, hence UNCERTAIN. No QC flag fits cleanly: the root MF
    is an explicit "unknown", not a generic term with an applicable child. It
    has no outgoing causal edges (it is the sink), which is appropriate for an
    effector. No sysm-1 gene review in this project; a candidate, though the
    review would mostly document that the molecular function is unknown. See
    the atf-7 activity for the problem with the incoming edge.
- activity_id: gomodel:568b0f9600000284/5745387b00000588
  gene_product: WB:WBGene00012019
  molecular_function: GO:0004674
  biological_process: GO:0140367
  cellular_component: GO:0009898
  verdict: UNCERTAIN
  consistency: NO_GENE_REVIEW
  qc_flags:
    - DIRECT_VS_INDIRECT_CAUSAL
  supporting_text: Thus, a surfeit of DKF-2 activates PMK-1 and enhances resistance to PA14
  evidence:
    - source_id: PMID:19371715
      statement: DKF-2 promotes PMK-1 activation and pathogen resistance (genetic/overexpression evidence).
      supporting_text: Thus, a surfeit of DKF-2 activates PMK-1 and enhances resistance to PA14
    - source_id: PMID:19371715
      statement: DKF-2 output includes the same ShKT effector class (T24B8.5) as the PMK-1 arm.
      supporting_text: >-
        Five pathogen-induced ShKT transcripts (F01D5.2, F01D5.3, F01D5.5,
        F49F1.5 and T24B8.5) were also induced by elevated DKF-2.
  notes: >-
    DKF-2 is a protein kinase D (PKD) expressed in the 18 intestinal cells
    (PMID:19371715). MF: generic "protein serine/threonine kinase activity"
    (GO:0004674) is the most specific applicable GO term - GO has a PKC-specific
    child but no PKD-specific one - so no GENERIC_MF flag. Location (cytoplasmic
    side of plasma membrane, IDA PMID:17728253) fits DAG/C1-domain-mediated
    membrane translocation of PKD. BP part_of antibacterial innate immune
    response (IMP PMID:19371715) is well supported (dkf-2 null is hypersensitive
    to P. aeruginosa PA14; activated DKF-2 induces 85 defence transcripts).
    The problem is the causal edge: "directly positively regulates" PMK-1 MAP
    kinase activity (RO:0002629). Ren et al. show that DKF-2 overexpression
    raises di-phosphorylated PMK-1 3-4-fold and that DKF-2-dependent effector
    induction is largely PMK-1-dependent, but a PKD does not phosphorylate the
    p38 TGY activation loop (that is the SEK-1 MAPKK step) and the paper does
    not identify the intermediate; the mechanism between DKF-2 and PMK-1 is
    unknown. The model's comment shows this edge was RO:0002213 (positively
    regulates) until the 2023-03-16 automated predicate swap, which is exactly
    the case where the swap over-claims. Recommend reverting to RO:0002213 or
    RO:0002407 (indirectly positively regulates). Full text of PMID:19371715 is
    cached and was read.
