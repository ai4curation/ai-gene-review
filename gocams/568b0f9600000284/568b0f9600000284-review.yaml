  gene_product: WB:WBGene00002187
  molecular_function: GO:0005515
  biological_process: GO:1900181
  cellular_component: GO:0005737
  verdict: WRONG
  consistency: NO_GENE_REVIEW
  qc_flags:
    - BINDING_AS_FUNCTION
  supporting_text: >-
    Biochemical assays demonstrated that phosphorylation by KGB-1 inhibits FOS-1
    self-association and binding to the kreg-1 promoter.
  evidence:
    - source_id: PMID:23437011
      statement: KGB-1 is a catalytically active JNK-family MAP kinase; a kinase MF is available.
      supporting_text: >-
        Biochemical assays demonstrated that phosphorylation by KGB-1 inhibits
        FOS-1 self-association and binding to the kreg-1 promoter.
    - source_id: PMID:22554143
      statement: The process assignment reflects an adult-only, age-reversed effect on DAF-16 nuclear localisation.
      supporting_text: >-
        KGB-1 activation enhanced DAF-16 nuclear localization and transcriptional
        activity during development but decreased it in adults.
  notes: >-
    KGB-1 is a JNK-family MAP kinase (the VHP-1/MEK-1 pathway MAPK), yet the
    activity is typed as bare "protein binding" (GO:0005515) with IPI evidence
    from the P-granule GLH-1/GLH-2 helicase interactions (PMID:12435362) and a
    yeast two-hybrid partner from PMID:23437011 (FOS-1 in that paper). This is
    the hard-rule BINDING_AS_FUNCTION case: binding says nothing about what
    KGB-1 does in this model, the GLH interactions are germline and unrelated to
    intestinal immunity, and a proper catalytic MF is readily available - "MAP
    kinase activity" (GO:0004707) or the more specific "JUN kinase activity"
    (GO:0004705) - with direct biochemical support (KGB-1 phosphorylates FOS-1,
    PMID:23437011). The process, "negative regulation of protein localization
    to nucleus" (GO:1900181, IMP PMID:22554143), encodes KGB-1's attenuation of
    intestinal DAF-16::GFP nuclear localisation in ADULTS; the same study shows
    the opposite effect (enhanced DAF-16 nuclear localisation) during
    development, so this is a fragile, age-conditional process for a
    model-level assertion, and no has_input (DAF-16) is given to say what is
    kept out of the nucleus. Structurally the activity is a leaf: VHP-1 ->
    KGB-1 -> (DAF-16 exclusion) never rejoins the antibacterial output, so it
    reads as an aside imported from the JNK/stress literature. Recommend
    retyping the MF to GO:0004707/GO:0004705 and either adding the DAF-16
    has_input with the adult context, or dropping the activity from this
    antibacterial model. No kgb-1 gene review; a strong candidate (JNK, VHP-1
    substrate, FOS-1 kinase).
