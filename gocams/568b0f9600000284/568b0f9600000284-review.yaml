  supporting_text: TPA-1, a PKCdelta homolog, regulated activation and functions of DKF-2 in vivo.
  evidence:
    - source_id: PMID:19371715
      statement: TPA-1 (PKC-delta) acts upstream of DKF-2 in intestinal cells.
      supporting_text: Thus, we conclude that TPA-1 uniquely regulates DKF-2 in intestinal cells in vivo.
    - source_id: PMID:22470487
      statement: The cited AMP-production evidence is from the epidermal antifungal (Drechmeria) response, not intestinal antibacterial defence.
      supporting_text: >-
        It acts in the epidermis downstream of the PKC∂ TPA-1, as a positive
        regulator of nlp antimicrobial peptide gene expression after infection.
    - source_id: PMID:17728253
      statement: PKC phosphorylates the PKD activation loop directly, so a direct TPA-1 -> DKF-2 edge is mechanistically plausible.
      supporting_text: >-
        they mediate delivery of DKF-2 to a membrane where protein kinase C
        phosphorylates Ser(925) and Ser(929) in the A-loop
  notes: >-
    TPA-1 is the PKC-delta ortholog, activated by diacylglycerol. Three issues.
    (1) GENERIC_MF: "protein serine/threonine kinase activity" (GO:0004674)
    where the PKC-specific child "diacylglycerol-dependent serine/threonine
    kinase activity" (GO:0004697) applies; the enabled_by evidence itself
    includes an InterPro PKC-family mapping (IPR000961) and an IBA from the PKC
    node. (2) MISSING_LOCATION: no occurs_in, although the pathway acts in
    intestinal cells at the plasma membrane (its substrate DKF-2 is placed at
    the cytoplasmic side of the plasma membrane). (3) Evidence/context
    mismatch on the process nesting: GO:0002225 "positive regulation of
    antimicrobial peptide production" and its nesting inside GO:0140367
    "antibacterial innate immune response" both cite PMID:22470487 (Labed et
    al., NIPI-4), which documents TPA-1 as a regulator of nlp-29-cluster AMP
    genes in the EPIDERMIS after Drechmeria coniospora FUNGAL infection and
    wounding. That reference supports GO:0002225 but not the antibacterial
    nesting; the intestinal antibacterial role of TPA-1 comes from PMID:19371715
    (tpa-1 loss phenocopies the dkf-2 null in PA14 killing; TPA-1 "uniquely
    regulates DKF-2 in intestinal cells"), which should be the citation for the
    GO:0140367 context. The enabled_by IMP citation PMID:23072806 is an axon
    regeneration paper (TPA-1 -> MLK-1); it does establish TPA-1 kinase function
    but is unrelated to immunity. Causal edge TPA-1 -> DKF-2 "directly
    positively regulates" (IGI, PMID:19371715): the edge evidence is genetic
    (and Ren et al. note the epistasis could formally be read either way), but
    PKC-mediated A-loop phosphorylation of PKD is the established direct
    mechanism (PMID:17728253), so the direct predicate is acceptable here.
    Verdict UNCERTAIN on the combination of generic MF and mis-contextualised
    process evidence. No tpa-1 gene review; a candidate.
