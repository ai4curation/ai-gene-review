  supporting_text: >-
    we report here that RNAi of C. elegans tir-1 enhances susceptibility of
    nematodes to killing by bacterial pathogens and that activated PMK-1 levels
    in tir-1 RNAi-inactivated worms are diminished, suggesting that tir-1 acts
    upstream of pmk-1
  evidence:
    - source_id: PMID:15123841
      statement: tir-1 acts upstream of PMK-1 activation in intestinal antibacterial defence.
      supporting_text: >-
        we report here that RNAi of C. elegans tir-1 enhances susceptibility of
        nematodes to killing by bacterial pathogens and that activated PMK-1
        levels in tir-1 RNAi-inactivated worms are diminished, suggesting that
        tir-1 acts upstream of pmk-1
    - source_id: PMID:15625192
      statement: TIR-1 physically engages the NSY-1 MAPKKK (adaptor, not bare binding).
      supporting_text: >-
        TIR-1 localizes NSY-1 to post-synaptic regions of AWC, and TIR-1 binds
        UNC-43, suggesting that it assembles a synaptic signaling complex that
        regulates odorant receptor expression
  notes: >-
    TIR-1 (SARM ortholog) is correctly typed with "signaling adaptor activity"
    (GO:0035591) rather than a bare binding term: it binds and positions the
    NSY-1/ASK1 MAPKKK (PMID:15625192) and is required for PMK-1 activation and
    pathogen resistance (PMID:15123841). This matches the tir-1 gene review's
    second core function exactly (GO:0035591, assembling the complex that feeds
    the NSY-1/SEK-1/PMK-1 cascade), and the review ACCEPTs the GO:0140367 IMP
    annotation (PMID:19837372) used here for part_of. The tir-1 review's other
    core function, TIR-domain NAD+ nucleosidase activity (GO:0003953), is not in
    this model, which is acceptable for an immunity-focused model but worth
    noting since SARM1 NADase activity is the family's catalytic function.
    Causal edge: "directly positively regulates" NSY-1 is defensible for an
    adaptor that physically recruits the MAPKKK, but note the edge evidence is
    IMP (reduced phospho-PMK-1 in tir-1 RNAi) and Liberati et al. themselves say
    "it is unclear at what point TIR-1 intersects the NSY-1/SEK-1/PMK-1
    pathway"; the direct predicate is the product of the 2023 automated swap
    from RO:0002213. Location (cytoplasm, IDA PMID:15625192) is from the AWC
    neuron study, not the intestine, but is not wrong.
