model: gomodel:568b0f9600000284
title: Antibacterial innate immune response in the intestine via MAPK cascade (C.
  elegans)
taxon: NCBITaxon:6239
status: COMPLETE
summary: >-
  The canonical C. elegans intestinal p38 immunity cassette, modelled as a
  linear signalling chain with one accessory input arm and one negative arm.
  Core chain: TIR-1 (SARM ortholog, signaling adaptor activity) directly
  positively regulates NSY-1 (ASK1 ortholog, MAPKKK), which directly positively
  regulates SEK-1 (MKK3 ortholog, MAPKK), which directly positively regulates
  PMK-1 (p38 MAPK), which directly positively regulates the ATF-7 (ATF2/ATF7
  ortholog) RNA polymerase II-specific DNA-binding transcription factor
  activity in the nucleus; ATF-7 in turn "directly negatively regulates" the
  (unknown, root-MF) activity of the secreted ShKT-domain effector SYSM-1
  (T24B8.5, the classic PMK-1 reporter gene). Every activity on this chain is
  part_of antibacterial innate immune response (GO:0140367). Accessory input:
  TPA-1 (PKC-delta, generic Ser/Thr kinase) directly positively regulates
  DKF-2 (protein kinase D, generic Ser/Thr kinase, cytoplasmic face of the
  plasma membrane), which directly positively regulates PMK-1 - the DAG ->
  PKC -> PKD arm of Ren et al. 2009. Negative arm: the MKP-7 ortholog VHP-1
  (MAP kinase tyrosine/serine/threonine phosphatase activity) directly
  negatively regulates both PMK-1 and the JNK KGB-1; KGB-1 is typed only as
  "protein binding" and is tied to negative regulation of protein localization
  to nucleus (its adult-stage attenuation of DAF-16 nuclear entry), forming a
  leaf that does not connect back to the antibacterial output. Important
  structural note: the model's own comments record that on 2023-03-16 every
  causal predicate was mechanically upgraded from indirect (RO:0002212 /
  RO:0002213) to direct (RO:0002630 / RO:0002629). For the kinase-substrate
  and phosphatase-substrate edges this is correct; for the DKF-2 -> PMK-1 edge
  and the ATF-7 -> SYSM-1 edge it produces "direct" claims the evidence does
  not support (see those activities). The ATF-7 -> SYSM-1 edge also has the
  wrong sign for the model's own story: PMK-1 phosphorylation relieves ATF-7
  repression (repressor -> activator switch), yet the model chains a positive
  PMK-1 -> ATF-7 edge into a negative ATF-7 -> SYSM-1 edge, which reads as
  "PMK-1 activation represses T24B8.5" - the opposite of the biology.
  Consistency: the five gene products with reviews in this project (tir-1,
  nsy-1, sek-1, pmk-1, atf-7) all match accepted core functions; the five
  without (sysm-1, dkf-2, tpa-1, vhp-1, kgb-1) are candidates, with kgb-1
  and vhp-1 the most informative additions.
