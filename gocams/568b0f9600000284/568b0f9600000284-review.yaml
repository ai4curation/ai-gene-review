  notes: >-
    ATF-7 (ATF2/ATF7 ortholog) "DNA-binding transcription factor activity, RNA
    polymerase II-specific" (GO:0000981) in the nucleus (IDA PMID:20369020),
    part_of antibacterial innate immune response (IMP PMID:20369020). MF and
    context match the atf-7 gene review's first core function exactly
    (GO:0000981, directly_involved_in GO:0140367, nucleus), so CONSISTENT. The
    generic 0000981 rather than the repressor (GO:0001227) or activator
    (GO:0001228) child is defensible because ATF-7 does both. The verdict is
    UNCERTAIN because of the outgoing edge ATF-7 -"directly negatively
    regulates"-> SYSM-1 (T24B8.5) activity (RO:0002630; IMP PMID:20369020,
    PMID:19837372). Two problems. (a) Directness: a transcription factor
    regulating an effector's molecular activity acts via target-gene
    transcription -> new protein, a multi-step relation; per GO-CAM practice the
    target gene belongs in has_input on the TF activity and any causal edge to
    the effector activity should be indirect. The model's comment shows this
    edge was RO:0002212 until the 2023-03-16 automated swap upgraded it to
    "directly", so this is a mechanical artefact (DIRECT_VS_INDIRECT_CAUSAL).
    (b) Sign: the model captures only ATF-7's basal repressor mode, but the
    upstream edge PMK-1 -> ATF-7 is POSITIVE. Read as a chain, "PMK-1
    activates ATF-7 activity, which represses T24B8.5" says infection lowers
    T24B8.5 expression - the opposite of the biology, where T24B8.5 is
    PMK-1-INDUCED because phosphorylation relieves ATF-7 repression and flips it
    to an activator. Internally consistent alternatives: PMK-1 -| ATF-7
    repressor activity (GO:0001227) -| sysm-1, or PMK-1 -> ATF-7 activator
    activity (GO:0001228) -> sysm-1 (with sysm-1 as has_input target gene).
    The atf-7 gene review handles this by recording both positive and negative
    regulation of innate immune response as directly_involved_in processes of
    the MAPK-binding core function. Minor: the enabled_by evidence is ISS
    (ECO:0000250) although the same paper provides direct genetic and
    biochemical evidence.
