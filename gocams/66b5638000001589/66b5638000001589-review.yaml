notes: >-
  Read-only assessment; the model is not edited. This review incorporates cjm's manual
  review of this model in "Problematic GO-CAM models" (section "Integrated Stress Response
  Pathway"), checked against the cached model (date_modified 2025-09-12) and the literature.
  CONFIRMED: (1) EIF2S1 appears as two activity nodes, and EIF2AK3 directly negatively
  regulates one and directly positively regulates the other, which drives ATF4; this is
  ambiguous for both humans and machines. (2) The duplication exists to encode the
  paradoxical ISR (global translation down, ATF4 translation up through its uORFs).
  (3) A representation without the duplicate, PERK -[neg]-> eIF2alpha -[neg]-> ATF4, is
  sound and consistent with GO-CAM practice, provided the second edge is "indirectly
  negatively regulates" (RO:0002409): it is mediated by ribosome scanning and uORF
  reinitiation, not a single step. (4) The model is cloned for variant paths. The same
  EIF2AK -> two-EIF2S1 -> ATF4 block, with the same evidence (PMID:16289705 on the
  eIF2alpha -> ATF4 edge), appears in 66b5638000000624, 66b5638000000739 and
  6606056e00000903. REFINED: since cjm's screenshots, the curator has given the two
  eIF2alpha nodes different MF terms (GO:0160296 cap-dependent and GO:0160297
  IRES-mediated translation initiation factor activity). This makes the problem worse:
  both terms are defined by cap or IRES binding, which eIF2 does not do, and ATF4 is not
  IRES-translated. The duplication is therefore not just a style issue; the terms that
  were meant to tell the nodes apart are wrong. cjm's text says the effect of
  phosphorylation is to "reduce global transcription"; it is translation that is reduced.
  ADDITIONAL (not in cjm's review): has_input ATF4 on a general initiation factor is a
  misuse; the eIF2alpha -> ATF4 edge is cited to an unrelated cell-free translation methods
  paper; the ATF4 -> COX7A2L edge is cited to ATF4 papers that do not mention COX7A2L
  (the relevant PMID:31023583 is on has_input only); and COX7A2L's part_of respirasome
  assembly is contradicted by one of its own references. AGREE with cjm that free-text
  comments on the eIF2alpha -> ATF4 edge would help, since its net sign depends on eIF2-GTP
  levels. Gene reviews compared: EIF2AK3 and ATF4; EIF2S1 and COX7A2L have no review.
