model: gomodel:66b5638000001589
title: Activation of the integrated stress response via activation of EIF2AK3/PERK
  in response to unfolded protein response promotes expression of COX7A2L/SCAF1, increasing
  formation of respiratory chain supercomplexes (Human).
taxon: NCBITaxon:9606
status: COMPLETE
summary: >-
  ER stress activates the ER-membrane kinase EIF2AK3/PERK (GO:0004694, has_input EIF2S1),
  which phosphorylates eIF2alpha. The model then splits eIF2alpha into two activity nodes
  enabled by the same protein (P05198). PERK directly negatively regulates one, typed as
  GO:0160296 cap-dependent translation initiation factor activity, which stands for the
  global attenuation of translation and has no downstream edge. PERK directly positively
  regulates the other, typed as GO:0160297 IRES-mediated translation initiation factor
  activity with has_input ATF4; this node indirectly positively regulates ATF4
  DNA-binding transcription factor activity (has_input COX7A2L). ATF4 in turn indirectly
  positively regulates COX7A2L/SCAF1 protein-macromolecule adaptor activity (has_input
  respiratory chain complexes III and IV, part_of mitochondrial respirasome assembly)
  in the inner mitochondrial membrane. The PERK kinase activity, the ATF4 transcription
  factor activity and the overall PERK-eIF2alpha-ATF4-SCAF1 story (Balsa et al. 2019)
  are sound. The eIF2alpha part is not. Both eIF2alpha MF terms are defined by mRNA cap
  recognition or IRES binding, neither of which eIF2 does; eIF2 delivers initiator
  Met-tRNA and is used by capped and IRES-driven mRNAs alike. ATF4 is not translated from
  an IRES: its induction is a uORF delayed-reinitiation effect of reduced eIF2-GTP
  ternary complex. So the positive PERK-to-eIF2alpha edge has the wrong sign as a
  statement about eIF2 activity, has_input ATF4 on a general initiation factor is a
  misuse, and the edge from eIF2alpha to ATF4 is cited to a cell-free translation methods
  paper that never mentions ATF4. A single eIF2alpha node (GO:0003743 translation
  initiation factor activity), negatively regulated by PERK and indirectly negatively
  regulating ATF4 activity, would state the biology without the duplicate node.
