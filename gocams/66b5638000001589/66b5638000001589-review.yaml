    explanation: >-
      GO:0160296 cap-dependent translation initiation factor activity is defined as enabling
      recognition and binding of the 7-methylguanosine cap (OLS, checked 2026-11-02). That is
      the eIF4E/eIF4F activity, not eIF2's. eIF2 forms the ternary complex with GTP and
      initiator Met-tRNA and supports both cap-dependent and IRES-driven initiation. The
      model's own reference for this node (PMID:16289705) shows eIF2 stimulating capped,
      uncapped and EMCV-IRES mRNAs alike, while eIF4E alone was cap-specific. The parent
      GO:0003743 (the term this node carried before the 2025-09-12 edit, as shown in cjm's
      screenshot) is the accurate choice.
    supported_by:
    - reference_id: PMID:16289705
      supporting_text: eIF2 (eukaryotic translation initiation factor 2) and eIF2B augmented
        translation of capped, uncapped and encephalomyocarditis virus-internal ribosome entry
        site-promoted mRNAs.
  notes: >-
    This node stands for "general translation, inhibited by PERK". The negative edge into
    it is right, but the MF term is wrong for eIF2 (see source defect). GO:0160296 and
