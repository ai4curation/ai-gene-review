    cached model differs from cjm's screenshot, where both nodes read "translation
    initiation factor activity". The node has no downstream edge, so the model never says
    what the attenuation of general translation does. eIF2 is an alpha-beta-gamma
    heterotrimer and the alpha subunit is the regulatory, phosphorylated subunit;
    attributing the initiation-factor activity to EIF2S1 alone is defensible (it is the
    subunit PERK acts on), but the eIF2 complex is the actual factor. GENERIC_MF is not
    strictly the right flag (the term is wrong rather than vague); there is no flag for
    a wrong MF term. EIF2S1 has no gene review in this repository.
