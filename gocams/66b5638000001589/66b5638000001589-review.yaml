    asserted_value: PMID:16289705
    corrected_value: PMID:15277680
    confidence: PROBABLE
    explanation: >-
      The edge from eIF2alpha to ATF4 is supported only by PMID:16289705, a cell-free
      translation methods paper on supplementing HeLa extracts with initiation factors. Its
      abstract does not mention ATF4, stress or eIF2alpha phosphorylation. PMID:15277680
      (Vattem and Wek 2004) directly addresses how eIF2 levels control ATF4 translation.
    supported_by:
    - reference_id: PMID:15277680
      supporting_text: Here we describe the mechanism regulating ATF4 expression involving the
        differential contribution of two upstream ORFs (uORFs) in the 5' leader of the mouse
        ATF4 mRNA.
