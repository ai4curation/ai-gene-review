    requested_change: REPOINT
    asserted_value: RO:0002407
    corrected_value: RO:0002409
    corrected_label: indirectly negatively regulates
    confidence: PROBABLE
    explanation: >-
      High eIF2 activity (abundant eIF2-GTP) represses ATF4 translation by sending
      reinitiating ribosomes to the inhibitory uORF2; reduced eIF2 activity derepresses it.
