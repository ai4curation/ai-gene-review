    statement: The neuronal signal was provided by constitutively active XBP-1s, which does not require IRE-1 splicing.
    supporting_text: >-
      age-onset loss of ER proteostasis could be reversed by expression of a
      constitutively active form of XBP-1, XBP-1s.
  notes: >-
    The activity is the same splicing step as the intestinal IRE-1 and matches
    the ire-1 review's core function. Its place in this model is weaker: the
    paper's neuronal arm used a constitutively active, already-spliced XBP-1s
    transgene, which bypasses IRE-1, and the cached abstract does not show
    that endogenous neuronal IRE-1 is needed for the intertissue signal. The
    occurs_in neuronal cell body evidence cites this paper as mutant
    phenotype, which the abstract does not resolve (full text not cached). No
    process, and neuronal cell body does not resolve the ER membrane
    compartment.
