    statement: UPR components in distal cells are required to receive the neuronal signal.
    supporting_text: >-
      Loss of UPR(ER) signaling components in distal cells blocked
      cell-nonautonomous signaling from the nervous system, thereby blocking
      increased longevity of the entire animal.
  notes: >-
    Intestinal XBP-1 is the receiving end of the signal and is supported by
    the requirement for distal UPR components. It has the same MF issue as the
    neuronal XBP-1 (DNA binding rather than the transcription factor activity
    that is the xbp-1 review's core function), no process (IRE1-mediated
    unfolded protein response is given only on the neuronal copy), no outgoing
    edge to the UPR target genes, and a tissue rather than a compartment as
    location.
