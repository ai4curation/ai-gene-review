  evidence:
  - source_id: PMID:23791175
    statement: Reducing small clear vesicle release blocks the neuron-to-intestine UPR signal downstream of xbp-1s.
    supporting_text: >-
      Reduction of small clear vesicle (SCV) release blocked nonautonomous
      signaling downstream of xbp-1s, suggesting that the release of
      neurotransmitters is required for this intertissue signaling event.
  - source_id: PMID:15976086
    statement: UNC-13 localizes to the active zone.
    supporting_text: >-
      These data demonstrate that ELKS is not required for localizing RIM or
      UNC-13 to the active zone in vivo .
  notes: >-
    Matches the unc-13 review's core function exactly: syntaxin-1 binding
    (GO:0017075), directly involved in synaptic vesicle priming and synaptic
    vesicle exocytosis, located at the presynaptic active zone. The review
    ACCEPTs the IBA syntaxin-1 binding row, the synaptic vesicle exocytosis IMP
    from this paper (PMID:23791175) and the active zone IDA from
    PMID:15976086. The gocam-compartments tool lists presynaptic active zone as
    unresolved, but it is a proper synaptic sub-compartment and is supported,
    so that lead is dismissed. As an MF, syntaxin-1 binding is still a binding
    term for what UNC-13 does (opening syntaxin-1 for SNARE assembly); GO has
    no term for that activity, and both the gene review and the human UNC13A
    review use the same term. The incoming indirect edge from neuronal XBP-1
    is right in kind and direction. The gap is downstream: UNC-13 has no edge
    to the intestinal UPR activities, so the intertissue step is missing.
