  evidence:
  - source_id: PMID:11779465
    statement: C. elegans UPR requires ire-1-mediated splicing of xbp-1 mRNA.
    supporting_text: >-
      C. elegans requires ire-1-mediated splicing of xbp-1 mRNA for UPR gene
      transcription and survival upon ER stress.
  - source_id: PMID:11780124
    statement: XBP-1 mRNA is a direct target of IRE1 endonuclease activity.
    supporting_text: >-
      Purified mouse IRE1 accurately cleaved XBP-1 mRNA in vitro, indicating that
      XBP-1 mRNA is a direct target of IRE1 endonucleolytic activity.
  notes: >-
    RNA endonuclease activity with has input xbp-1 and a direct positive edge to
    XBP-1 is the canonical splicing step and is well supported (the in vitro
    cleavage is with mouse IRE1; the worm requirement is genetic). It matches
    the ire-1 review's first core function (GO:0004521, directly involved in
    the IRE1-mediated unfolded protein response), whose rows the review
    ACCEPTs. That process is missing here. "Intestine" is a tissue and does not
    resolve a compartment; IRE-1 acts in the ER membrane. The activity
    receives no input from the neuronal arm, which is where the paper's
    cell-nonautonomous signal would enter. The ire-1 review is on this branch,
    outside the sparse checkout.
