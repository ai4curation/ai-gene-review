model: gomodel:5b528b1100000489
title: XBP-1 is a cell-nonautonomous regulator of stress resistance and longevity
taxon: NCBITaxon:6239
status: COMPLETE
summary: >-
  A five-activity model of cell-nonautonomous ER unfolded protein response
  (UPR) signalling in C. elegans, from neurons to the intestine (Taylor and
  Dillin 2013). In neurons, IRE-1 (RNA endonuclease activity, has input xbp-1,
  neuronal cell body) directly positively regulates XBP-1 (RNA polymerase II
  regulatory region sequence-specific DNA binding, part_of IRE1-mediated
  unfolded protein response, occurs_in neuron), which is causally upstream,
  with a positive effect, of UNC-13 (syntaxin-1 binding, part_of synaptic
  vesicle exocytosis, presynaptic active zone). In the intestine, a second
  IRE-1 -> XBP-1 pair repeats the splicing step. The paper's central claim is
  that neuronal XBP-1s activates the intestinal UPR through a secreted signal
  whose release needs small clear vesicle exocytosis. The model does not
  connect the two tissues: UNC-13 has no outgoing edge, and the intestinal
  IRE-1 has no incoming one, so the cell-nonautonomous step that the model is
  titled after is absent. Neuronal XBP-1 -> UNC-13 is correctly an indirect
  "causally upstream of" relation, since the abstract places SCV release
  downstream of xbp-1s by epistasis and gives no mechanism. In the paper the
  neuronal arm was driven by constitutively spliced XBP-1s, which bypasses
  IRE-1, so the abstract does not test the neuronal IRE-1 activity. Both
  XBP-1 activities use a DNA-binding term rather than transcription factor
  activity, and the intestinal pair has no process. Locations are given as
  tissues or cell parts (intestine, neuron, neuronal cell body) rather than the
  ER membrane and nucleus where these activities happen. UNC-13 matches its
  gene review's core function.
