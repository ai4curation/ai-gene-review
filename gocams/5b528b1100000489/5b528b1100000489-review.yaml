    statement: Neuronal XBP-1s activates the UPR in distal cells cell-nonautonomously.
    supporting_text: >-
      Neuronally derived XBP-1s was sufficient to rescue stress resistance,
      increase longevity, and activate the UPR(ER) in distal, non-neuronal cell
      types through a cell-nonautonomous mechanism.
  - source_id: PMID:24068940
    statement: ChIP shows XBP-1 binding at the hsp-4 locus.
    supporting_text: >-
      our ChIP evidence indicated that both SKN-1 and XBP-1 bind directly to the
      hsp-4 locus
  notes: >-
    The process and the causal role are well supported. The MF is the DNA-binding
    term; XBP-1's activity is DNA-binding transcription factor activity, RNA
    polymerase II-specific (GO:0000981), which is the xbp-1 review's core
    function. The review also ACCEPTs the GO:0000977 IDA from PMID:24068940, so
    the model uses an accepted term of the review, but not the one it chose as
    the core activity. "Neuron" is a cell type and does not resolve a
    compartment (nucleus). The incoming edge from neuronal IRE-1 is canonical,
    but the paper drove this arm with constitutively spliced XBP-1s. The
    xbp-1 review is on this branch, outside the sparse checkout.
