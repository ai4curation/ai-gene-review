  - source_id: file:human/VDAC1/VDAC1-ai-review.yaml
    statement: >-
      The local VDAC1 review identifies voltage-gated monoatomic anion channel
      activity in the outer mitochondrial membrane as VDAC1's core channel
      function.
    supporting_text: >-
      Voltage-gated, weakly anion-selective beta-barrel channel of the
      mitochondrial outer membrane
  source_defects:
  - defect_type: WRONG_TERM
    resource: GO_CAM
    record: gomodel:65d7e4ac00002121/65d7e4ac00002156
    slot: molecular_function
    requested_change: CHECK
    asserted_value: GO:0005245
    confidence: PROBABLE
    explanation: >-
      The model types VDAC1 as GO:0005245 voltage-gated calcium channel
      activity. VDAC1 is the voltage-dependent anion channel of the
      mitochondrial outer membrane; it can provide the outer-membrane conduit
      for calcium at MAMs, but the available local review supports
      GO:0008308 voltage-gated monoatomic anion channel activity as its core
      pore activity rather than the specific voltage-gated calcium-channel
      term.
  - defect_type: WRONG_TERM
    resource: GO_CAM
