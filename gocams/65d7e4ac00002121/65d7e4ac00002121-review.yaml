  supporting_text: Knockdown of grp75 abolished the stimulatory effect
  evidence:
  - source_id: PMID:17178908
    statement: >-
      HSPA9/GRP75 bridges VDAC1 and IP3 receptors at ER-mitochondria
      contact sites and its knockdown blocks enhanced mitochondrial calcium
      accumulation driven by the IP3R ligand-binding domain.
    supporting_text: Knockdown of grp75 abolished the stimulatory effect
  - source_id: PMID:17178908
    statement: >-
      The MAM-associated GRP75 pool copurifies with VDAC and IP3R, supporting
      the model's adaptor/scaffold function for HSPA9 in this complex.
    supporting_text: >-
      These results strongly suggest that grp75 has a central role in setting
      up the protein complex with VDAC and the IP3R.
  source_defects:
  - defect_type: WRONG_TERM
    resource: GO_CAM
    record: gomodel:65d7e4ac00002121/65d7e4ac00002122
    slot: occurs_in
    requested_change: CHECK
    asserted_value: GO:0044233
    confidence: PROBABLE
    explanation: >-
      The HSPA9 scaffold activity is placed at GO:0044233
      mitochondria-associated endoplasmic reticulum membrane contact site. That
      term spans the opposed ER and outer-mitochondrial membranes and does not
      resolve to one membrane for GO-CAM causal reasoning; the model should
      instead name the membrane or side of the membrane where the HSPA9/GRP75
      bridging activity occurs.
  notes: >-
    GO:0030674 protein-macromolecule adaptor activity is a reasonable molecular
    function for the MAM GRP75 bridge. The local HSPA9 review treats calcium
    import into the mitochondrion as a genuine but non-core MAM scaffolding
    role, but GO:0030674 itself is absent from the review and therefore is a
    candidate informative MF gap; the review currently only marks generic
    protein binding rows as over-annotated. The VDAC1 and ITPR1 has_input
    fillers are the proteins coupled by this adaptor and not HAS_INPUT_MISUSE.
    The model also nests HSPA9 under GO:0043065 positive regulation of apoptotic
    process, while the local review's only directional apoptotic row for HSPA9
    is the opposite-sign GO:0043066 negative regulation of apoptotic process
    for a non-core p53-sequestration role. With no corresponding pro-apoptotic
    scaffold role in the HSPA9 review, the nested pro-apoptotic context looks
    like a candidate over-extension of this ISS-backed model node. The only
    structured issue is spatial: GO:0044233 correctly signals the MAM context
    but hides which membrane the activity should occupy.
