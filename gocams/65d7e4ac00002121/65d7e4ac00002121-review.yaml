model: gomodel:65d7e4ac00002121
title: >-
  Apoptosis-induced by calcium import into mitochondria at ER-mitochondria
  contact sites mediated by the ITPR1:HSPA9:VDAC1 complex (Human)
taxon: NCBITaxon:9606
status: COMPLETE
summary: >-
  This human model represents ER-to-mitochondria calcium transfer at the
  mitochondria-associated ER membrane. ITPR1 releases ER-lumen calcium to the
  cytosol, VDAC1 conducts the cytosolic calcium across the mitochondrial outer
  membrane to the intermembrane space, MCU imports that calcium across the
  inner membrane into the matrix, and the HSPA9/GRP75 scaffold couples ITPR1
  to VDAC1. The MCU activity is aligned to the inner-membrane uniporter module;
  the upstream ITPR1-HSPA9-VDAC1 bridge is consistent with non-core calcium
  import roles in the gene reviews but is spatially underspecified because
  those three activities use the contact-site term instead of naming the ER or
  outer mitochondrial membrane that contains each activity. The model also
  nests every activity under positive regulation of apoptotic process:
  ITPR1 and MCU carry that process as a non-core role in their gene reviews,
  while HSPA9 and VDAC1 do not, so the apoptosis term is only partly aligned.
  VDAC1's non-core mitochondrial-calcium-import apoptotic role supports this
  same VDAC1-MCU pro-apoptotic chain, making this look like a candidate
  directional-refinement gap in that gene review. HSPA9 carries only the
  opposite-sign anti-apoptotic p53-sequestration role and no pro-apoptotic
  MAM-scaffold counterpart, making positive regulation of apoptotic process a
  likely over-extension on the HSPA9 scaffold activity.
