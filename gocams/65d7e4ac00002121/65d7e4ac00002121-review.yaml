    corrected_value: GO:0005741
    corrected_label: mitochondrial outer membrane
    confidence: PROBABLE
    explanation: >-
      The VDAC1 activity is placed at GO:0044233
      mitochondria-associated endoplasmic reticulum membrane contact site. The
      model has VDAC1 conducting calcium from the cytoplasm to the
      intermembrane space, so the activity should resolve to the mitochondrial
      outer membrane rather than to the two-membrane contact site as a whole.
  notes: >-
    VDAC1's part in ER-to-mitochondria calcium transfer is captured as a
    non-core role in the local gene review, but the model's GO:0005245
    molecular function looks too specific for this weakly anion-selective
    outer-membrane channel. The missing cached evidence for PMID:11485562
    prevents a definitive replacement recommendation, so the defect is phrased
    as a check rather than as a fixed repoint.
