  source_defects:
  - defect_type: WRONG_TERM
    resource: GO_CAM
    record: gomodel:65d7e4ac00002121/65d7e4ac00002156
    slot: molecular_function
    requested_change: CHECK
    asserted_value: GO:0005245
    corrected_value: GO:0005262
    corrected_label: calcium channel activity
    confidence: PROBABLE
    explanation: >-
      The model types VDAC1 as GO:0005245 voltage-gated calcium channel
      activity. VDAC1 is the voltage-dependent anion channel of the
      mitochondrial outer membrane; it can provide the outer-membrane conduit
      for calcium at MAMs, but GO:0005245 is too specific to CaV-family
      voltage-gated calcium channels. GO:0005262 calcium channel activity is a
      calcium-compatible candidate replacement for this node, whose own
      molecular associations move calcium from cytoplasm to mitochondrial
      intermembrane space.
  - defect_type: WRONG_TERM
