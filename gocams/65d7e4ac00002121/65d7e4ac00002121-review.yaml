notes: >-
  Reviewed against genes/human/HSPA9/HSPA9-ai-review.yaml,
  genes/human/ITPR1/ITPR1-ai-review.yaml, genes/human/MCU/MCU-ai-review.yaml,
  genes/human/VDAC1/VDAC1-ai-review.yaml, and
  modules/mitochondrial_calcium_uniporter.yaml. The module already pins the
  MCU activity from this GO-CAM and deliberately excludes the upstream
  ITPR1-HSPA9-VDAC1 bridge, because the reusable uniporter module begins at
  inner-membrane calcium uptake. ITPR1 is also represented by the broader
  ER/SR calcium-release branch of modules/er_calcium_store_cycling.yaml.
  HSPA9 and VDAC1 use rodent ISS (ECO:0000252/GO_REF:0000024) for enabled_by,
  occurs_in and part_of. ITPR1 uses human direct-assay evidence on enabled_by
  and rodent ISS for occurs_in and part_of; PMID:17178908 is ISS backing for
  the two causal edges out of HSPA9.
