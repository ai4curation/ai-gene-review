  supporting_text: The purified MCU protein showed channel activity in planar lipid bilayers
  evidence:
  - source_id: PMID:21685888
    statement: >-
      Purified MCU directly conducts calcium in planar lipid bilayers with
      uniporter-like electrophysiology and inhibitor sensitivity.
    supporting_text: The purified MCU protein showed channel activity in planar lipid bilayers
  - source_id: PMID:21685886
    statement: >-
      MCU is an inner-membrane component required for mitochondrial calcium
      uptake without globally collapsing respiration or membrane potential.
    supporting_text: >-
      Silencing MCU in cultured cells or in vivo in mouse liver severely
      abrogates mitochondrial Ca(2+) uptake, whereas mitochondrial respiration
      and membrane potential remain fully intact.
  notes: >-
    MCU is the correctly typed inner-membrane calcium-channel activity that
    moves calcium from the intermembrane-space side to the matrix. This is the
    one activity from the model pinned by
    modules/mitochondrial_calcium_uniporter.yaml, because that module represents
    the inner-membrane uptake and efflux system while treating MAM delivery as
    upstream context. The nested GO:0043065 positive regulation of apoptotic
    process context matches the local MCU review as a non-core, calcium
    overload-dependent downstream role rather than as the channel's direct
    core function.
