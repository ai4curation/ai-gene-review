    supporting_text: Inositol-1,4,5-trisphosphate receptors (IP3Rs) are activated by IP3 and Ca2+
  - source_id: PMID:17178908
    statement: >-
      Szabadkai et al. established physical and functional coupling between
      VDAC1 and IP3R through GRP75 at ER-mitochondria contacts.
    supporting_text: >-
      VDAC1 is physically linked to the endoplasmic reticulum
      Ca(2+)-release channel
  source_defects:
  - defect_type: WRONG_TERM
    resource: GO_CAM
    record: gomodel:65d7e4ac00002121/65d7e4ac00002129
    slot: occurs_in
    requested_change: REPOINT
    asserted_value: GO:0044233
    corrected_value: GO:0005789
    corrected_label: endoplasmic reticulum membrane
    confidence: PROBABLE
    explanation: >-
      The ITPR1 activity is placed at GO:0044233
      mitochondria-associated endoplasmic reticulum membrane contact site. The
      model's own calcium input is in the ER lumen and its output is in the
      cytoplasm, so this activity should resolve to the ER membrane that the IP3
      receptor channel spans, not to the two-membrane contact site as a whole.
  notes: >-
    ITPR1's molecular function matches the gene review core function. Its
    contribution to GO:0036444 calcium import into the mitochondrion is a
    non-core MAM calcium-delivery role in the local review and is upstream of
    the inner-membrane MCU step curated in mitochondrial_calcium_uniporter.yaml.
    The production GO-CAM correctly leaves the transported calcium as the
    channel input and output rather than incorrectly modelling IP3 as cargo.
