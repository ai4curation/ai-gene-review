    explanation: In model gomodel:66c7d41500003371 the GRIN1 activity occurs_in postsynaptic membrane (GO:0045211),
      but the GRIN3B activity and the complex activity that both subunits regulate occur_in presynaptic membrane
      (GO:0042734). The subunits of one receptor must share a membrane. Please make the three locations agree, or
      split pre- and postsynaptic receptors into separate models.
  notes: 'Matches the third core function in the GRIN1 review (glycine-gated cation channel activity with GluN3
    partners). Glycine as activator of GluN1 is right. The location is the problem: this activity is placed in the
    postsynaptic membrane while its partner GluN3B and the complex activity it regulates are placed in the presynaptic
    membrane. One tetramer cannot be in both; the GRIN1 review keeps presynaptic membrane only as a minor, non-core
    location. The curator should decide which membrane this model describes.'
