    explanation: In model gomodel:66c7d41500003371 the GRIN1 activity occurs_in postsynaptic membrane (GO:0045211),
      but the GRIN3B activity and the complex activity that both subunits regulate occur_in presynaptic membrane
      (GO:0042734). The subunits of one receptor must share a membrane. Please make the three locations agree, or
      split pre- and postsynaptic receptors into separate models.
  notes: 'The activity term matches the third core function in the GRIN1 review (glycine-gated cation channel activity
    with GluN3 partners). The sign of the regulation is doubtful: the model attaches glycine to GluN1 as a small-molecule
    activator and has this activity directly positively regulate the complex activity, but in GluN1/GluN3 receptors
    glycine at GluN3 opens the channel while glycine at GluN1 reduces the current, and GluN3 occupancy alone is
    sufficient. Both cited papers are cached as abstracts only, so this is recorded as a suspected defect. The location
    is the problem: this activity is placed in the postsynaptic membrane while its partner GluN3B and the complex
    activity it regulates are placed in the presynaptic membrane. One tetramer cannot be in both; the GRIN1 review
    keeps presynaptic membrane only as a minor, non-core location. The curator should decide which membrane this
    model describes.'
