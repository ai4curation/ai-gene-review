    explanation: 'The complex-level channel activity lists calcium(2+) (CHEBI:29108) as has input and has output,
      with ECO:0000250 evidence transferred from rat Grin1 and the rat GluN3 subunit. PMID:11823786 reports that
      NR1/NR3A or -3B receptors form relatively Ca2+-impermeable cation channels. Low is not zero, so this is a
      query: please check whether calcium transport should be asserted for the GluN1/GluN3 receptor, or kept only
      for sodium.'
  notes: Enabled by the complex term, so there is no gene review to compare. The activity is the general transmitter-gated
    monoatomic ion channel activity (GO:0022824), although the same model gives both subunits the specific descendant
    glycine-gated cation channel activity (GO:0160212); the complex activity should use the specific term too. Na+
    as a transported ion is appropriate. Ca2+ is also listed as has input and has output, by transfer from rat,
    but the rat study describes these receptors as relatively Ca2+-impermeable; this is recorded as a suspected
    defect. Located in the presynaptic membrane, in conflict with the GRIN1 activity.
