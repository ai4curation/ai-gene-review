model: gomodel:66c7d41500003371
title: glycine-gated cation channel activity involving GRIN1 and GRIN3B (Human)
taxon: NCBITaxon:9606
status: COMPLETE
summary: 'GluN1 (GRIN1) and GluN3B (GRIN3B) each carry glycine-gated cation channel activity, each activated by
  glycine. The two subunit activities each "directly positively regulate" (RO:0002629) a third activity enabled
  by the complex term. The ligand each subunit senses is attached to that subunit as a small-molecule activator
  (RO:0012001), and ion flux (has input / has output) sits on the complex activity. All evidence is by transfer
  from rat and mouse. The model is internally inconsistent about place: the complex activity and GluN3B are in the
  presynaptic membrane, while GluN1, a subunit of the same tetramer, is in the postsynaptic membrane. As in the
  GluN3A model, the complex activity uses the general transmitter-gated channel term, and glycine is drawn as a
  positive activator of GluN1 although glycine at GluN1 is reported to reduce the current of GluN1/GluN3 receptors
  (PMID:26777280).'
