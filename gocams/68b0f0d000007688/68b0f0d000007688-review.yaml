model: gomodel:68b0f0d000007688
title: Cholesterol transport between MOM & MIM by STAR adrenal gland (Human)
taxon: NCBITaxon:9606
status: COMPLETE
summary: >-
  This one-activity human adrenal model asserts that STAR enables cholesterol
  transfer at the mitochondrial outer membrane, moving cholesterol from the
  outer to the inner mitochondrial membrane as the StAR-dependent entry activity
  of adrenal glucocorticoid biosynthesis. The molecular function, outer-membrane
  site of action, cholesterol cargo, and intracellular cholesterol-transport
  process are specific and literature-supported, and they match both the
  completed local STAR review and the existing STAR entry-step annoton in
  modules/adrenal_steroidogenesis.yaml.
activity_reviews:
- activity_id: gomodel:68b0f0d000007688/68b0f0d000007689
  gene_product: UniProtKB:P49675
  molecular_function: GO:0120020
  biological_process: GO:0032367
  cellular_component: GO:0005741
  verdict: OK
  consistency: CONSISTENT
  gene_review: file:human/STAR/STAR-ai-review.yaml
  evidence:
  - source_id: PMID:12372832
    statement: >-
      Purified N-62 StAR transfers cholesterol between synthetic membranes
      without other mitochondrial proteins.
    supporting_text: >-
      Thus StAR can transfer cholesterol between synthetic membranes without
      other protein components found in mitochondria.
  - source_id: PMID:7761400
    statement: >-
      Human STAR coexpressed with P450scc and adrenodoxin increases
      pregnenolone synthesis.
    supporting_text: >-
      Human StAR, coexpressed in COS-1 cells with cytochrome P450scc and
      adrenodoxin, increased pregnenolone synthesis > 4-fold.
  - source_id: PMID:7892608
    statement: >-
      Human STAR loss of function causes impaired adrenal and gonadal
      steroidogenesis.
    supporting_text: >-
      In three unrelated individuals with this disorder, steroidogenic acute
      regulatory protein, which enhances the mitochondrial conversion of
      cholesterol into pregnenolone, was mutated and nonfunctional
  - source_id: PMID:12530629
    statement: >-
      Productive StAR activity localizes to the mitochondrial outer membrane.
    supporting_text: >-
      Only the constructs at the OMM were active, either in vivo or in vitro.
  notes: >-
    GO:0120020 cholesterol transfer activity is the specific MF accepted in the
    STAR review and required by the adrenal-steroidogenesis module's STAR
    annoton. The model's has_input and has_output molecule associations place
    cholesterol on the mitochondrial outer and inner membranes, respectively,
    matching StAR-dependent delivery to CYP11A1; its part_of
    GO:0032367 intracellular cholesterol transport and nested
    GO:0006704 glucocorticoid biosynthetic process are also retained in the
    local review. modules/adrenal_steroidogenesis.yaml already pins this
    production activity to the StAR cholesterol-delivery entry step, so no module
    edit is needed. `just gocam-lint` reports only advisory no_narrative and
    small_model INFO rows, and `just gocam-compartments` finds the activity
    location resolved with no nonadjacent or relocating causal edges.
references:
- id: PMID:12372832
  title: Transfer of cholesterol between phospholipid vesicles mediated by the steroidogenic
    acute regulatory protein (StAR).
- id: PMID:7761400
  title: 'Human steroidogenic acute regulatory protein: functional activity in COS-1
    cells, tissue-specific expression, and mapping of the structural gene to 8p11.2
    and a pseudogene to chromosome 13.'
- id: PMID:7892608
  title: Role of steroidogenic acute regulatory protein in adrenal and gonadal steroidogenesis.
- id: PMID:12530629
  title: The steroidogenic acute regulatory protein, StAR, works only at the outer mitochondrial
    membrane.
notes: >-
  This model overlaps the first reaction in modules/adrenal_steroidogenesis.yaml,
  where the StAR-dependent cholesterol transfer activity is already associated
  with gomodel:68b0f0d000007688/68b0f0d000007689. It has no causal edges because
  the source model isolates the transport step rather than expanding the
  downstream CYP11A1 pregnenolone reaction, which is the next explicit part in
  the module.
