    resource: GO_CAM
    requested_change: REPOINT
    confidence: PROBABLE
    cause: SYMBOL_COLLISION
    explanation: 'The activity asserts that UniProtKB:P24752 enables GO:0034736 cholesterol O-acyltransferase
      activity in the endoplasmic reticulum. P24752 is acetyl-CoA acetyltransferase 1, the potassium-activated
      thiolase of the mitochondrial matrix; the enzyme described in the cited paper is the ER sterol O-acyltransferase
      that the cholesterol field calls ACAT, whose human genes are SOAT1 (P35610) and SOAT2, routinely
      written ACAT1 and ACAT2 in that literature. The paper states it is "the ER-localized acyl-CoA:cholesterol
      acyltransferase (ACAT)", uses the SOAT inhibitor SZ58-035, and knocks down "ACAT1 and ACAT2" together,
      which only makes sense for the SOAT pair. The ACAT1 gene review in this repository reaches the same
      conclusion from the other direction, removing both the GO:0034736 and the GO:0005783 IDA rows that
      this paper generated for P24752; it also records that the published hairpin sequence matches mitochondrial
      ACAT1, which is why this is PROBABLE rather than CONFIRMED - the reagent and the intended enzyme
      disagree in the source paper itself, and the curators should resolve which was perturbed before
      re-pointing.'
    supported_by:
    - reference_id: PMID:32944968
      supporting_text: 25HC inhibits viral membrane fusion by activating the ER-localized acyl-CoA:cholesterol acyltransferase
        (ACAT) which leads to the depletion of accessible cholesterol from the plasma membrane.
    - reference_id: PMID:32944968
      supporting_text: Calu‐3 cells were transduced with lentiviral vectors carrying non‐targeting shRNA
        or shRNAs targeting ACAT1 and ACAT2.
  notes: 'Three problems compound on this one activity. (1) The gene product is wrong (see the source
    defect); the gene review for P24752 REMOVEs exactly the two statements this activity makes, so consistency
    is CONFLICT. (2) The outgoing edge to the S2 fusogenic activity carries an empty evidence list - the
    only edge in the model with no ECO code or reference at all. (3) Compartment lead confirmed. ER (membrane
    or lumen) to endosome is reported NONADJACENT at distance 2, and here the jump is real and informative:
    the enzyme never touches the viral fusion protein. Its product is a cholesteryl ester, and the step
    the model omits is the consequent depletion of accessible cholesterol from the target membrane, which
    is what changes fusion competence. The paper locates that effect at the plasma membrane and says the
    restriction is on "virus fusion at the cell surface", so the edge as drawn also points at the wrong
    fusion event (see the TMPRSS2 and S2 activities). Because a metabolite and a membrane-composition
    change lie in between, the predicate should be an indirect negative regulation rather than RO:0002630,
    hence DIRECT_VS_INDIRECT_CAUSAL. The activity also has no part_of; GO:0034435 cholesterol esterification
    or a sterol-metabolism process would place it.'
