    model applied to a two-taxon GO-CAM; from the virus''s point of view the host cell surface is the
    correct and most informative location for this activity, and every edge it makes is to a host plasma-membrane
    protein, so no UNRESOLVED_COMPARTMENT flag is recorded. The downstream edge to furin is biologically
    a step in virion biogenesis in the producer cell rather than in entry into this cell, which is worth
    noting but is a scope choice, not an error.'
