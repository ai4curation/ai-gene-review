    explanation: 'This single S2 activity, placed in the endosome and part_of fusion of virus membrane
      with host endosome membrane, receives activating edges from ACE2 and TMPRSS2 at the plasma membrane
      and an inhibitory edge from an ER acyltransferase, so it is made to stand for both entry routes
      at once. The two routes are alternatives with different proteases and different fusion sites: TMPRSS2
      primes spike at the cell surface and fusion then occurs with the plasma membrane (GO:0019064), whereas
      the endosomal route needs priming by the endolysosomal cathepsins, which are not represented in
      the model at all. The model would state what the literature shows by carrying two fusion activities,
      or by adding a cathepsin B/L activity (CTSL, UniProtKB:P07711; CTSB, UniProtKB:P07858) in the endosome
      upstream of this one and moving the TMPRSS2-dependent event to a plasma-membrane fusion node.'
