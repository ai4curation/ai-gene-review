  notes: 'Compartment lead dismissed for this activity. ACE2 (plasma membrane) directly positively regulates
    S2 (endosome) is reported NONADJACENT at distance 2, but this is the relocation case: ACE2 engages
    spike at the cell surface, the virion is then internalised, and S2 does its own job later in the endosome.
    Receptor engagement triggers the conformational changes that make S2 fusion-competent, so the edge
    is a legitimate direct regulation across compartments and no NONADJACENT_COMPARTMENTS flag is recorded.
    The verdict is WRONG on the molecular function rather than on the biology of the edge: as typed, the
    model asserts that a peptidase activity performs virion attachment (see the source defects). ACE2
    has no gene review in this repository; GOA carries GO:0001618 for it, and the activity would become
    straightforwardly correct by swapping the term.'
