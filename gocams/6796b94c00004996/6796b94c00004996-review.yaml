      supporting_text: However, only TMPRSS2 activity is essential for viral spread and pathogenesis in
        the infected host whereas CatB/L activity is dispensable (Iwata-Yoshikawa et al.
  notes: 'GO:0140522 fusogenic activity on the S2 cleavage product (PRO_0000449649) is the right MF and
    the right entity: the fusion machinery is S2, not the uncleaved spike, and the model keeps the two
    apart, which is good practice. part_of GO:0039654 and occurs_in endosome are a defensible description
    of the cathepsin-dependent route, and PMID:32194981 supports endosomal involvement by the pH-dependence
    of entry. The verdict is UNCERTAIN because of what converges on this node rather than what it says
    about itself: four upstream activities, three of which act at the plasma membrane or the ER, and no
    endosomal protease (see the source defect). The enabled_by reference, PMID:32374457, is abstract-only
    in our cache; the abstract does show S-glycoprotein-mediated cell fusion, so the fusogenic claim is
    supported, but I could not check the full text. No gene review exists for viral gene products in this
    repository.'
