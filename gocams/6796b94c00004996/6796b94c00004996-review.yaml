model: gomodel:6796b94c00004996
title: Sars-CoV2 entry into host cell (HUman-SARS-CoV-2)
taxon: NCBITaxon:9606
status: COMPLETE
summary: 'The model assembles SARS-CoV-2 entry around a single fusion node: full-length spike at the host
  cell surface binds ACE2 and provides itself as input to ACE2, TMPRSS2 and furin, and all three proteases
  plus ACE2 then positively regulate the fusogenic activity of the cleaved S2 subunit, which the model
  places in the endosome and ties to GO:0039654 fusion of virus membrane with host endosome membrane.
  An interferon arm runs alongside: CH25H positively regulates a cholesterol O-acyltransferase activity
  in the ER, which negatively regulates S2 fusion. Two things are wrong at the level of the claims rather
  than the bookkeeping. First, the cholesterol-esterifying activity is attributed to UniProtKB:P24752,
  the mitochondrial thiolase ACAT1, whereas the enzyme in the cited paper is the ER sterol O-acyltransferase
  known in the cholesterol literature as ACAT (SOAT1, UniProtKB:P35610) - a symbol collision that the
  ACAT1 gene review in this repository already acted on by removing both GO:0034736 and GO:0005783. Second,
  ACE2 is given GO:0004175 endopeptidase activity as the function by which it mediates virion attachment
  and activates S2, when the function at issue is receptor activity (GO:0001618); the paper cited for
  that edge is about angiotensin peptide kinetics. Beyond that, the model merges the two mutually exclusive
  entry routes: TMPRSS2 at the plasma membrane and ACAT in the ER both act on a fusion event the model
  pins in the endosome, and cathepsin B/L, the protease that primes spike in the endolysosome, is absent.
  Several activities also lack a location or a process (CH25H, furin), and the ACAT1 -> S2 edge carries
  no evidence at all.'
