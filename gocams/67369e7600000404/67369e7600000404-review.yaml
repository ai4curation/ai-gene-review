  consistency: CONSISTENT
  gene_review: file:human/CHRNA7/CHRNA7-ai-review.yaml
  supporting_text: >-
    Human alpha 7 homomers exhibited rapidly desensitizing, inwardly rectifying,
    agonist-induced, cation currents that triggered Ca(2+)-sensitive Cl-
    channels in the oocytes.
  evidence:
  - source_id: PMID:8145738
    statement: >-
      Human alpha7 homomers form rapidly desensitizing, agonist-gated cation
      channels.
    supporting_text: >-
      Human alpha 7 homomers exhibited rapidly desensitizing, inwardly rectifying,
      agonist-induced, cation currents that triggered Ca(2+)-sensitive Cl-
      channels in the oocytes.
  - source_id: PMID:8906617
    statement: >-
      Human alpha7 alone is sufficient to form an acetylcholine-responsive
      receptor in Xenopus oocytes.
    supporting_text: >-
      Recombinant receptors were expressed in Xenopus laevis oocytes injected
      with in vitro transcripts encoding either alpha 7 alone or alpha 2, alpha
      3, or alpha 4 in pairwise combination with beta 2 or beta 4. Inward currents
      were elicited by the application of acetylcholine (1-100 microM)
  - source_id: PMID:21718690
    statement: >-
      Alpha7-containing nicotinic receptors are found postsynaptically near the
      postsynaptic density.
    supporting_text: >-
      Postsynaptically, α7*nAChRs are localized in or near the postsynaptic
      density (PSD)
  source_defects:
  - defect_type: OTHER
    resource: GO_CAM
    record: gomodel:67369e7600000404
    slot: taxon
    requested_change: CHECK
    asserted_value: NCBITaxon:10090
    corrected_value: NCBITaxon:9606
    cause: OTHER
    confidence: SUSPECTED
    explanation: >-
      This GO-CAM's primary taxon is mouse (NCBITaxon:10090), with human
      (NCBITaxon:9606) present only as an additional taxon, but the model title
      is explicitly human and its only enabled_by gene product is the human
      CHRNA7 protein UniProtKB:P36544. GO-CAM curators should check whether the
      model should use Homo sapiens as its primary taxon. The same
      mouse-primary / human-additional shape appears on the human-titled
      gomodel:6494e2e900001496 and gomodel:66187e4700000078 cached models, so
      this may be a recurring metadata pattern rather than a one-off slip.
  - defect_type: WRONG_EVIDENCE_CODE
    resource: GO_CAM
    record: gomodel:67369e7600000404/67369e7600000405
    slot: occurs_in evidence
    requested_change: CHECK
    asserted_value: ECO:0000314 / PMID:21718690
    cause: CONTEXT_NOT_ASSAYED
    confidence: PROBABLE
    explanation: >-
      The CHRNA7 activity occurs_in GO:0045211 postsynaptic membrane with
      PMID:21718690 annotated as direct assay evidence. PMID:21718690 discusses
      alpha7 receptors in or near the postsynaptic density in its Introduction,
      while citing older localization work, but the paper's direct experiments
      assay CHRFAM7A-dominant-negative effects on CHRNA7 function in cell lines
      and Xenopus oocytes. GO-CAM curators should check whether the
      postsynaptic-membrane assertion needs an ECO code/reference change.
    supported_by:
    - reference_id: PMID:21718690
      supporting_text: >-
        Postsynaptically, α7*nAChRs are localized in or near the postsynaptic
        density (PSD)
  - defect_type: WRONG_EVIDENCE_CODE
    resource: GO_CAM
    record: gomodel:67369e7600000404/67369e7600000405
    slot: part_of evidence
    requested_change: CHECK
    asserted_value: ECO:0000314 / PMID:8145738
    cause: CONTEXT_NOT_ASSAYED
    confidence: SUSPECTED
    explanation: >-
      The CHRNA7 activity is part_of GO:0007268 chemical synaptic transmission
      with PMID:8145738 annotated as direct assay evidence. The cached
      PMID:8145738 record is abstract-only, but its title and abstract describe
      cloned human alpha7 from SH-SY5Y and functional alpha7 homomers expressed
      in Xenopus oocytes. That work supports acetylcholine-gated cation-channel
      activity, but the record available here does not show a direct assay of
      chemical synaptic transmission. GO-CAM curators should check whether the
      part_of assertion needs a different reference/evidence code or a narrower
      process.
    supported_by:
    - reference_id: PMID:8145738
      supporting_text: >-
        Human alpha 7 homomers exhibited rapidly desensitizing, inwardly
        rectifying, agonist-induced, cation currents that triggered
        Ca(2+)-sensitive Cl- channels in the oocytes.
  notes: >-
    GO:0022848 is the specific channel MF accepted throughout the local CHRNA7
    review for assembled alpha7 receptors. The source model's
    GO:0007268 chemical synaptic transmission process is broader than the
    GO:0095500 acetylcholine receptor signaling process used by the module and
    the GO:0007271 cholinergic synaptic transmission child proposed in the local
    review, but it is a valid parent for this acetylcholine-gated activity. The
    source model does not localize the calcium has_input and gives its cytosolic
    calcium has_output no evidence; this should be checked with the
    evidence-code caveats above, but `just gocam-compartments` found no
    unresolved activity locations or nonadjacent/relocating edges. The
    RO:0012001 edge to acetylcholine represents the ligand as an activator, not
    as a receptor has_input filler, and no module edit is needed because
    modules/acetylcholine_signaling.yaml already pins this activity to the alpha7
    homopentamer annoton. The source model has the human title and human
    UniProtKB:P36544 enabled_by assertion under a mouse primary taxon with human
    listed only as an additional taxon; that taxon shape should be checked
    upstream, but the activity itself is human and aligns with the human CHRNA7
    module association.
references:
- id: PMID:8145738
  title: 'Human alpha 7 acetylcholine receptor: cloning of the alpha 7 subunit from
    the SH-SY5Y cell line and determination of pharmacological properties of native
