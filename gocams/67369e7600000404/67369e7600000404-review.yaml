model: gomodel:67369e7600000404
title: CHRNA7 homopentameric ligand-gated cation channel activated by Acetylcholine
  (Human).
taxon: NCBITaxon:10090
status: COMPLETE
summary: >-
  This compact model asserts a single human CHRNA7 alpha7 activity: the
  homopentameric receptor enables acetylcholine-gated cation-selective channel
  activity at the postsynaptic membrane, with acetylcholine as the activating
  ligand and calcium as the transported cargo. The molecular function and ligand
  / calcium molecule associations are supported and align with the alpha7
  homopentamer annoton in modules/acetylcholine_signaling.yaml. The source model
  is also consistent with the completed local CHRNA7 review, which accepts
  alpha7 as an assembled acetylcholine-gated channel complex while refining the
  broad GO:0007268 process to GO:0007271 synaptic transmission, cholinergic.
activity_reviews:
- activity_id: gomodel:67369e7600000404/67369e7600000405
  gene_product: UniProtKB:P36544
  molecular_function: GO:0022848
  biological_process: GO:0007268
  cellular_component: GO:0045211
  verdict: OK
  consistency: CONSISTENT
  gene_review: file:human/CHRNA7/CHRNA7-ai-review.yaml
  supporting_text: >-
    Human alpha 7 homomers exhibited rapidly desensitizing, inwardly rectifying,
    agonist-induced, cation currents that triggered Ca(2+)-sensitive Cl-
    channels in the oocytes.
  evidence:
  - source_id: PMID:8145738
    statement: >-
      Human alpha7 homomers form rapidly desensitizing, agonist-gated cation
      channels.
    supporting_text: >-
      Human alpha 7 homomers exhibited rapidly desensitizing, inwardly rectifying,
      agonist-induced, cation currents that triggered Ca(2+)-sensitive Cl-
      channels in the oocytes.
  - source_id: PMID:8906617
    statement: >-
      Human alpha7 alone is sufficient to form an acetylcholine-responsive
      receptor in Xenopus oocytes.
    supporting_text: >-
      Recombinant receptors were expressed in Xenopus laevis oocytes injected
      with in vitro transcripts encoding either alpha 7 alone or alpha 2, alpha
      3, or alpha 4 in pairwise combination with beta 2 or beta 4. Inward currents
      were elicited by the application of acetylcholine (1-100 microM)
  - source_id: PMID:21718690
    statement: >-
      Alpha7-containing nicotinic receptors are found postsynaptically near the
      postsynaptic density.
    supporting_text: >-
      Postsynaptically, α7*nAChRs are localized in or near the postsynaptic
      density (PSD)
  source_defects:
  - defect_type: WRONG_EVIDENCE_CODE
    resource: GO_CAM
    record: gomodel:67369e7600000404/67369e7600000405
    slot: occurs_in evidence
    requested_change: CHECK
    asserted_value: ECO:0000314 / PMID:21718690
    cause: CONTEXT_NOT_ASSAYED
    confidence: PROBABLE
    explanation: >-
      The CHRNA7 activity occurs_in GO:0045211 postsynaptic membrane with
      PMID:21718690 annotated as direct assay evidence. PMID:21718690 discusses
      alpha7 receptors in or near the postsynaptic density in its Introduction,
      while citing older localization work, but the paper's direct experiments
      assay CHRFAM7A-dominant-negative effects on CHRNA7 function in cell lines
      and Xenopus oocytes. GO-CAM curators should check whether the
      postsynaptic-membrane assertion needs an ECO code/reference change.
    supported_by:
    - reference_id: PMID:21718690
      supporting_text: >-
        Postsynaptically, α7*nAChRs are localized in or near the postsynaptic
        density (PSD)
  notes: >-
    GO:0022848 is the specific channel MF accepted throughout the local CHRNA7
    review for assembled alpha7 receptors. The source model's
    GO:0007268 chemical synaptic transmission process is broader than the
    GO:0007271 cholinergic synaptic transmission term proposed in the local
    review, but it is a valid parent for this acetylcholine-gated activity. The
    RO:0012001 edge to acetylcholine represents the ligand as an activator, not
    as a receptor has_input filler, and the calcium has_input/has_output pair is
    appropriate for a cation-channel activity. `just gocam-compartments` found no
    unresolved locations or nonadjacent/relocating edges, and no module edit is
    needed because modules/acetylcholine_signaling.yaml already pins this
    activity to the alpha7 homopentamer annoton. The source model has the human
    title and human UniProtKB:P36544 enabled_by assertion under a mouse primary
    taxon with human listed only as an additional taxon; that taxon shape should
    be checked upstream, but the activity itself is human and aligns with the
    human CHRNA7 module association.
references:
- id: PMID:8145738
  title: 'Human alpha 7 acetylcholine receptor: cloning of the alpha 7 subunit from
    the SH-SY5Y cell line and determination of pharmacological properties of native
    receptors and functional alpha 7 homomers expressed in Xenopus oocytes.'
- id: PMID:8906617
  title: Comparative structure of human neuronal alpha 2-alpha 7 and beta 2-beta
    4 nicotinic acetylcholine receptor subunits and functional expression of the
    alpha 2, alpha 3, alpha 4, alpha 7, beta 2, and beta 4 subunits.
- id: PMID:21718690
  title: The chimeric gene CHRFAM7A, a partial duplication of the CHRNA7 gene, is
    a dominant negative regulator of α7*nAChR function.
notes: >-
  The model overlaps the alpha7 nicotinic acetylcholine receptor branch in
  modules/acetylcholine_signaling.yaml, where it is already cited by the
  alpha7 homopentamer annoton. It has no causal edges and `just gocam-lint`
  reports only the advisory no_narrative and small_model INFO rows. The
  The sibling GO-CAM gomodel:678073a900000353 represents a urothelial alpha7
  context with a different process and location, whereas this model is the
  postsynaptic alpha7 instance that best matches the existing module annoton's
  ligand-gated channel claim.
