model: gomodel:68b0f0d000008519
title: C16-Ceramide-1-P transport enabled by CPTP (CERT1 transports Cer for C1P synthesis)  (Human)
taxon: NCBITaxon:9606
status: COMPLETE
summary: >-
  This production model captures the CERT1/CERK/CPTP route for C16 ceramide and
  C16 ceramide 1-phosphate at the Golgi. CERT1 transfers
  N-hexadecanoylsphingosine from the cytoplasmic side of the ER membrane to an
  ER-trans-Golgi network membrane contact site; CERK phosphorylates that
  ceramide to C1P at the cytoplasmic side of the TGN membrane; and CPTP
  transfers the resulting C1P through the cytosol to the cytoplasmic side of the
  plasma membrane. The activities have the right gene products, molecular
  functions, cargos/substrates and compartments, and all three activities are
  consistent with the CERK, CERT1 and CPTP gene reviews. The only evidence defect
  found here is the CERK occurs_in citation: it uses the 2011 CERK review with
  direct-assay evidence rather than the primary TGN-localization paper.
