  notes: >-
    This activity matches the CERK review's core function: ceramide kinase
    activity in ceramide metabolism at the cytoplasmic side of the TGN membrane.
    The model also attaches C16 ceramide as input and C16 C1P as output at the
    correct TGN-side compartments. The verdict is UNCERTAIN only because the
    occurs_in evidence line cites a review rather than the primary TGN paper.
