    supporting_text: downregulation of CERT by RNA interference technology dramatically reduced the levels of newly synthesized C1P
  notes: >-
    CERT1 has no gene review in this project, but the activity is plausible for
    the CERT/CERK pathway: it transfers C16 ceramide from the ER side toward the
    Golgi/TGN, providing the substrate pool used by CERK for newly synthesized
    C1P. The model's explicit ER-side input and TGN-side output molecules are
    consistent with the abstract-level CERT knockdown evidence and the later
    CPTP model.
