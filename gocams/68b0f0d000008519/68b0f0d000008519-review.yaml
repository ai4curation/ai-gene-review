    supporting_text: human GLTPD1, named here CPTP, is shown to specifically transfer C1P between membranes
  notes: >-
    CPTP has no gene review in this project, but PMID:23863933 directly
    identifies GLTPD1 as ceramide-1-phosphate transfer protein, tests purified
    protein for selective C1P transfer, and shows cytosolic localization with
    association at Golgi/TGN and plasma-membrane pools. The model's output to
    the cytoplasmic side of the plasma membrane is compatible with the
    subcellular fractionation after CPTP depletion.
