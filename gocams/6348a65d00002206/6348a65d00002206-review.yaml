      is selectively required for CPD repair
  - source_id: PMID:33937266
    statement: >-
      The catalytically inactive USP44 C281A mutant failed to reverse DDB2
      ubiquitination in vitro, supporting the more specific cysteine-type
      deubiquitinase child GO:0004843.
    supporting_text: >-
      Ubiquitination of DDB2 was reversed by the inclusion of wild-type USP44 but
      not the catalytically inactive USP44C281A
  notes: >-
    The DDB2 has_input substrate is consistent with the cited mechanism. The MF
    GO:0101005 deubiquitinase activity is directionally right but too broad for a
    USP-family cysteine protease where the child GO:0004843 cysteine-type
    deubiquitinase activity applies, so the row is marked GENERIC_MF. No local
    USP44 review exists yet, so this cannot be checked against gene-level core
    functions. The chromatin location is unresolved as a nuclear compartment and
    the source paper leaves open whether USP44 deubiquitinates chromatin-bound
    DDB2, released DDB2, or both, so the chromatin field should be read as the
    DDB2 substrate context.
