notes: >-
  Module alignment: modules/nucleotide_excision_repair.yaml already cites this
  GO-CAM on the DDB2 damaged-DNA-binding annoton and the XPC DNA-damage-sensor
  annoton. The USP44 activity is not modelled in the module, matching its current
  boundary: USP44 and USP24 deubiquitination of DDB2 are regulatory stabilization
  context for UV-DDB, not the conserved GG-NER recognition machine itself.

  Checks run and dismissed: `just gocam-lint` reported a binding_mf lead for DDB2,
  but damaged-DNA binding is the DDB2 lesion-recognition function, not a generic
  undirected binding claim. It also reported the source model's missing free-text
  narrative. `just gocam-compartments` reported GO:0000785 chromatin as unresolved
  for all three activities; that lead is recorded as UNRESOLVED_COMPARTMENT on each
  activity because the source model does not state GO:0000228 nuclear chromosome,
  the term that would make the nuclear compartment explicit; the NER module records
  GO:0090734 site of DNA damage for these recognition steps. The source GO-CAM's
  enabled_by, occurs_in and part_of edges are all similarity-transferred from the
  mouse accessions Q8C2S0, Q99J79 and P51612, although the same paper includes
  human-cell DDB2 and XPC recruitment assays that could support direct human
  evidence.
