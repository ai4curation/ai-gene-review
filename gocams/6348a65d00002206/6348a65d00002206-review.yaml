model: gomodel:6348a65d00002206
title: USP44-mediated stabilization of  DDB2 to Facilitate Nucleotide Excision Repair
  (Human)
taxon: NCBITaxon:9606
status: COMPLETE
summary: >-
  This compact human model captures the USP44 branch that stabilizes GG-NER lesion
  recognition: USP44 deubiquitinates DDB2, DDB2 remains on damaged chromatin long
  enough to recruit and hand lesions to XPC, and XPC then assembles downstream
  nucleotide-excision repair factors. DDB2 and XPC align with the UV-DDB and XPC
  complex annotons already pinned in modules/nucleotide_excision_repair.yaml. The
  module deliberately keeps USP44 outside its core GG-NER boundary as a regulatory
  deubiquitinase that tunes DDB2 turnover rather than one of the damage-recognition
  complexes.
