model: gomodel:65d7e4ac00002435
title: MICU3 promotes mitochondrial calcium uptake by MCU in the central nervous system
  (Human).
taxon: NCBITaxon:9606
status: COMPLETE
summary: >-
  This human model captures the neuron-enriched MICU1-MICU3 gatekeeping branch
  of the mitochondrial calcium uniporter. MICU3 and MICU1 are represented as
  inner-membrane calcium sensors that positively regulate MCU-mediated calcium
  import, and SMDT1/EMRE is the auxiliary adaptor that links the pore to MICU1.
  The four activities match the matching MICU1-MICU3 and MCU-EMRE annotons in
  modules/mitochondrial_calcium_uniporter.yaml. MCU and MICU1 also match local
  gene reviews, while MICU3 and SMDT1/EMRE still lack reviews. The causal
  structure is coherent, but the GO-CAM carries a few reference-level defects:
  two MICU1-MICU3 edges cite a MICU1-MICU2 structural paper rather than the
  MICU3 functional paper, and the MCU and SMDT1 part_of assertions retain an
  unrelated PMID:22925203 reference already seen on the sibling uniplex model.
