  notes: >-
    No local MICU3 gene review exists, so consistency is recorded as
    NO_GENE_REVIEW. GO:0061891 calcium ion sensor activity and the nested
    calcium-import context match the MICU3 branch in
    modules/mitochondrial_calcium_uniporter.yaml. The activity's
    inner-membrane location is the same coarse location used in the module
    because local MICU3 evidence has not yet established the finer
    intermembrane-space exposure used for MICU1 and MICU2.
