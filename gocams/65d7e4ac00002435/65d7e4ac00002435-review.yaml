    confidence: CONFIRMED
    explanation: >-
      The evidence list for the MCU activity's part_of GO:0036444 assertion
      cites PMID:22925203, which is Tsai et al. 2012 on mouse Pde8b in memory,
      motor performance and aging. That paper is unrelated to MCU or
