notes: >-
  Module alignment: modules/apoptotic_execution_phase.yaml already cites the
  CASP7 and XIAP activities from this GO-CAM, and modules/trail_apoptotic_signaling.yaml
  already cites the CASP8 activity. This PR adds the missing CASP9 activity pin
  to modules/intrinsic_apoptotic_signaling.yaml. I did not add the PAK2 branch:
  it is a specific kinase-substrate inhibitory side branch with no local PAK2
  review. I also did not add a new CASP10 executioner-maturation part to the
  TRAIL module because that module deliberately treats CASP10 as an optional
  DISC component and notes that it cannot simply substitute for CASP8.

  Checks run and dismissed: just gocam-lint reports missing_evidence on the
  CASP9-to-CASP7 edge and the second CASP10-to-CASP7 edge, duplicate_edge for
  the two CASP10-to-CASP7 edges, edge_evidence_copied on the XIAP-to-CASP7
  edge, and no_narrative. just gocam-compartments reports no unresolved,
  non-adjacent or relocating edges; all six activities are in the cytosol and
  all seven edges are same-compartment edges.
