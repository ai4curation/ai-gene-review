    consistency: CONSISTENT
    gene_review: file:human/XIAP/XIAP-ai-review.yaml
    supporting_text: >-
      Here we present the crystal structure of caspase-7 in complex with a potent
      inhibitory fragment from XIAP at 2.45 A resolution.
    evidence:
      - source_id: PMID:11257230
        statement: >-
          XIAP directly inhibits CASP7 through a linker peptide that occupies
          the CASP7 catalytic groove.
        supporting_text: >-
          Here we present the crystal structure of caspase-7 in complex with a potent
          inhibitory fragment from XIAP at 2.45 A resolution.
      - source_id: PMID:11257231
        statement: >-
          The XIAP linker blocks the CASP7 substrate groove, while BIR2 makes a
          regulatory contribution to caspase binding.
        supporting_text: >-
          the linker is the only contacting element for the caspase
    notes: >-
      The activity matches the local XIAP review and the XIAP restraint part of
      modules/apoptotic_execution_phase.yaml. GO:0004869 is the reviewed
      caspase-inhibitor molecular function, CASP7 is a correct has_input
      substrate, and the negative edge to the CASP7 peptidase activity has
      direct structural and biochemical support. The cytosol placement comes
      from a Reactome event projection onto the XIAP-CASP7 complex, but it is
      consistent with the local review's retained cytosol rows.
