    title: Phosphorylation of caspase-7 by p21-activated protein kinase (PAK) 2 inhibits
      chemotherapeutic drug-induced apoptosis of breast cancer cell lines.
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: Cached abstract directly supports PAK2 binding, phosphorylation and inhibition of CASP7.
