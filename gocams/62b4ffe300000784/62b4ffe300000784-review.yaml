      CASP7 role already pinned from modules/apoptotic_execution_phase.yaml, and
      the source correctly leaves CASP7 as the terminal activity downstream of
      the initiator and PAK2 regulators. The activity is UNCERTAIN only because
      its cytosol source is miscited.
