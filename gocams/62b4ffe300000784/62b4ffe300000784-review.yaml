    reference_review:
      relevance: LOW
      correctness: MISCITED
      review_notes: >-
        This paper may support CASP3 cytosol/nucleus behavior in erythroid
        cells, but the cached abstract does not mention the modeled CASP7,
        CASP8 or CASP9 cytosolic activities.
  - id: PMID:8625410
    title: Wiskott-Aldrich syndrome protein, a novel effector for the GTPase CDC42Hs,
      is implicated in actin polymerization.
    reference_review:
      relevance: NONE
      correctness: MISCITED
      review_notes: >-
        The cached abstract describes WASP as a CDC42 effector in actin
