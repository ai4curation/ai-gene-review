model: gomodel:62b4ffe300000784
title: >-
  Involvement of CASP7 in apoptosis, its activation by initiator caspases (CASP8, CASP9
  and CASP10) and regulation by XIAP and PAK2 (Human)
taxon: NCBITaxon:9606
status: COMPLETE
summary: >-
  A cytosolic CASP7 activation and restraint model. XIAP inhibits the active
  executioner CASP7; CASP8, CASP9 and CASP10 mature the CASP7 zymogen; and PAK2
  phosphorylates CASP7 to inhibit CASP7 maturation and activity. The XIAP,
  CASP7, CASP8 and CASP9 branches line up with the apoptotic execution, TRAIL,
  and intrinsic-apoptosis modules, but the model has several source-level issues:
  two causal edges are asserted without evidence, CASP10 has a duplicate edge to
  CASP7, PAK2 is incorrectly wired as a direct negative regulator of CASP9, and
  three cytosol assignments all cite a CASP3/Hsp70/GATA1 erythropoiesis paper
  that does not support the modeled CASP7, CASP8 or CASP9 activities.
activity_reviews:
  - activity_id: gomodel:62b4ffe300000784/62b4ffe300000864
    gene_product: UniProtKB:P98170
    molecular_function: GO:0004869
    biological_process: GO:0043066
    cellular_component: GO:0005829
