        requested_change: DELETE_VALUE
        asserted_value: gomodel:62b4ffe300000784/62b4ffe300000815
        confidence: CONFIRMED
        explanation: >-
          The PAK2 activity negatively regulates CASP7, not the CASP9 peptidase
          activity. PMID:27889207 shows that PAK2 phosphorylation of CASP7
          Ser-30 obstructs the CASP7-CASP9 interaction and slows CASP7 linker
          processing, while Ser-239 phosphorylation blocks the active CASP7
          substrate pocket. Keep the direct negative edge from PAK2 to CASP7
          and delete the edge that points to CASP9.
        supported_by:
          - reference_id: PMID:27889207
            supporting_text: >-
              Phosphorylation of caspase-7 S30 allosterically obstructs its
              interaction with caspase-9
      - defect_type: WRONG_REFERENCE
        resource: GO_CAM
        record: gomodel:62b4ffe300000784/62b4ffe300001008
        slot: occurs_in
        requested_change: CHECK
        asserted_value: PMID:8625410
        confidence: CONFIRMED
        explanation: >-
          The PAK2 cytosol assertion cites PMID:8625410, which is the original
          human WASP paper. Its abstract describes WASP as a CDC42 effector in
          actin organization and does not mention PAK2. The PAK2-CASP7 activity
          may occur in the cytosol, but this reference is the wrong support for
          that location.
        supported_by:
          - reference_id: PMID:8625410
            supporting_text: >-
              Wiskott-Aldrich syndrome protein, a novel effector for the GTPase
              CDC42Hs, is implicated in actin polymerization.
    notes: >-
      No local PAK2 gene review exists, so the kinase activity cannot yet be
      compared with curated core functions. The PAK2-CASP7 branch itself is
      supported, but the model should keep CASP7 as the inhibited activity
      rather than drawing PAK2 as an upstream negative regulator of CASP9.
