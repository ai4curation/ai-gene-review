        slot: occurs_in
        requested_change: CHECK
        asserted_value: PMID:17167422
        confidence: PROBABLE
        explanation: >-
          The CASP7 cytosol assertion cites PMID:17167422, an erythropoiesis
          paper about Hsp70 preventing CASP3-mediated GATA1 cleavage. The cached
          abstract mentions CASP3 and GATA1, not CASP7, and does not support
          CASP7 cytosolic localization. The cytosol term is biologically
          plausible for this CASP7 activation model but should cite CASP7
          evidence or a pathway event that actually contains CASP7.
        supported_by:
