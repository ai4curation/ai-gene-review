    asserted_value: PMID:21247876
    confidence: CONFIRMED
    explanation: >-
      The LIN28A enabled_by, part_of and hsa-let-7a-1 has_input assertions cite
      PMID:21247876 with direct-assay evidence. That paper studies Lin28
      recruitment of RNA helicase A during translational stimulation; it only
      mentions let-7 miRNA inhibition in its Introduction as prior background
      and cites earlier primary papers for the let-7 claims. The source model
      should be checked for the intended primary LIN28A pre-let-7 binding and
      pre-miRNA-processing evidence.
    supported_by:
    - reference_id: PMID:21247876
      supporting_text: >-
        Here we report the characterization of the molecular interplay between
        Lin28 and RNA helicase A (RHA) known to play an important role in
        remodeling ribonucleoprotein particles during translation.
  notes: >-
    LIN28A's GO:0070883 pre-miRNA binding and negative regulation of pre-miRNA
    processing are biologically plausible for let-7 RNAs, but they are not
    supported by the source PMID:21247876 row. The activity has no occurs_in;
    its direct negative edge to DGCR8 also lacks an evidence item, although
    binding of the shared hsa-let-7a-1 RNA is a plausible way to block
    Microprocessor access.
