    corrected_value: GO:0031053
    corrected_label: primary miRNA processing
    confidence: CONFIRMED
    explanation: >-
      DGCR8 is the double-stranded-RNA-binding partner that positions DROSHA on
      pri-miRNA hairpins in the Microprocessor. The cited DGCR8 paper therefore
      supports part_of GO:0031053 primary miRNA processing, as already recorded
      in the aligned module, rather than GO:2000633 positive regulation of
      pre-miRNA processing.
    supported_by:
