    DROSHA-containing Microprocessor complex and the existing
    modules/mirna_biogenesis_and_silencing.yaml annoton. The GO-CAM process
    term is the issue: DGCR8 performs the canonical nuclear pri-miRNA to
    pre-miRNA step rather than a separate positive-regulation step. The activity
    also lacks an occurs_in assertion; the Microprocessor activity should occur
    in the nucleus.
