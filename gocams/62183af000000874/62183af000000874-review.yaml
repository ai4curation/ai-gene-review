model: gomodel:62183af000000874
title: miRNA maturation by TRUB1 (Human)
taxon: NCBITaxon:9606
status: COMPLETE
summary: >-
  This compact human model places TRUB1, LIN28A and DGCR8 on one
  let-7a-centered regulatory path: TRUB1 and LIN28A both bind the same
  hsa-let-7a-1 RNA, TRUB1 directly inhibits LIN28A's inhibitory RNA-binding
  activity, and LIN28A directly inhibits DGCR8's protein-RNA adaptor activity.
  The cached GO-CAM captures a plausible TRUB1/LIN28A regulatory branch, but
  PMID:32926445, the model's sole TRUB1 paper, is not present in the local
  publication cache, both direct negative causal edges lack evidence, LIN28A is
  keyed to a paper that studies Lin28/RHA translational stimulation rather than
  let-7 processing, and the DGCR8 activity is placed in positive regulation of
  pre-miRNA processing where DGCR8 instead performs primary miRNA processing in
  the Microprocessor complex.
