notes: >-
  Aligned to modules/mirna_biogenesis_and_silencing.yaml. That module already
  pins this GO-CAM's DGCR8 activity to its Microprocessor annoton and explicitly
  treats the TRUB1/LIN28A branch as substrate-specific let-7 regulation outside
  the canonical species-neutral module boundary, so no module edit is needed for
  this review. `just gocam-compartments` reports three missing locations and no
  unresolved or non-adjacent compartment edges.
