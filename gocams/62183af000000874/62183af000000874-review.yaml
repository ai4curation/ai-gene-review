  - MISSING_EVIDENCE
  consistency: NO_GENE_REVIEW
  notes: >-
    The TRUB1 pre-miRNA-binding node has no local gene review and its only
    source, PMID:32926445, is absent from the local publication cache, so the
    node's molecular function, part_of process and hsa-let-7a-1 input were not
    text-checked here. `just gocam-lint` flags GO:0070883 as a binding
    function, but the model binds it to the specific let-7a-1 RNA substrate and
    not to a generic protein-binding event. The activity has no occurs_in, and
    its direct negative edge to LIN28A carries no evidence after the source
    model's automated 2023-03-16 RO:0002212-to-RO:0002630 conversion.
