  gene_review: file:human/PSAT1/PSAT1-ai-review.yaml
  notes: >-
    PSAT1 "O-phospho-L-serine:2-oxoglutarate transaminase activity" (GO:0004648)
    with has_output 2-oxoglutarate is the canonical PSAT1 MF and exact core
    catalytic activity in the PSAT1 review. The review also keeps the
    PMID:40281343 negative regulation of ferroptosis row as a real but
    non-core, phosphorylation-dependent moonlighting role in which PSAT1
    supplies 2-oxoglutarate to EGLN3/PHD3 to promote GPX4 Pro159 hydroxylation
    and stabilization. Placing the PSAT1 activity part_of negative regulation
    of ferroptosis is a slightly long-range process assignment because its
    contribution is indirect through 2-OG supply to EGLN3, but it is consistent
    with the reviewed context-specific GPX4-stabilizing branch.
