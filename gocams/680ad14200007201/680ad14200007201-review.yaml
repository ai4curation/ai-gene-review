  notes: >-
    HSPA8/HSC70 is modelled as a "protein-macromolecule adaptor activity"
    (GO:0030674) part_of chaperone-mediated autophagy, providing input for the
    LAMP2 step (RO:0002413). The HSPA8 review records the same
    GO:0030674/GO:0061684 pair as a core CMA substrate-recognition function. The
    adaptor MF is broad for HSC70's KFERQ-motif recognition but is the available
    local term (GENERIC_MF). The main remaining caveat is the broad
    GO:0005737 cytoplasm occurs_in: cytoplasm is true of HSPA8 generally, but
    the CMA handoff to LAMP2A is more specifically on the cytosolic side of the
    lysosomal membrane, as in the reviewed HSPA8 core function and the reusable
    chaperone-mediated autophagy module.
