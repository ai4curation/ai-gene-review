    evidence is PMID:17289661, a proteomics study of IMP1 ribonucleoprotein
    granules that is unrelated to CMA: the location looks carried over from
    HSPA8's standard cytoplasm annotation and not shown for this activity. It is
    true, so this is a note on evidence fit, not a defect.
