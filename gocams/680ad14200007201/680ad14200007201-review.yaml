  notes: >-
    PSAT1 "O-phospho-L-serine:2-oxoglutarate transaminase activity" (GO:0004648)
    with has_output 2-oxoglutarate is the canonical PSAT1 MF and the PSAT1
    review's core function. There is no causal edge out of this activity: it
    reaches EGLN3 only through the shared 2-oxoglutarate molecule node (PSAT1
    has_output, EGLN3 has_input), which is the right way to model co-substrate
    supply. part_of negative regulation of ferroptosis is a long-range process
    for a transaminase; the PSAT1 review keeps the matching IDA row as
    KEEP_AS_NON_CORE, which is consistent. No occurs_in (MISSING_LOCATION): the
    PSAT1 review's core location is cytosol (GO:0005829), and the abstract's
    PSAT1-GPX4 interaction implies the same compartment as GPX4, but the
    abstract does not state a compartment, so the model term should come from
    the full text.
