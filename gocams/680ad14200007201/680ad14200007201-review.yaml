    assay evidence; the location is not in doubt (the LAMP2 review accepts seven
    other lysosomal membrane rows), but the evidence is cross-species. The LAMP2 -> GPX4 edge is
    INDETERMINATE in the compartment check only because GPX4 has no occurs_in;
    with GPX4 in the cytosol it would be ADJACENT, as the mechanism requires.
