    resource: GO_CAM
    record: gomodel:67c10cc400004342/67c10cc400004343
    slot: part_of
    requested_change: REPOINT
    asserted_value: GO:0006874 part_of GO:0007193
    corrected_value: GO:0007193 part_of GO:0006874
    corrected_label: adenylate cyclase-inhibiting G protein-coupled receptor signaling pathway
      part of intracellular calcium ion homeostasis
    confidence: PROBABLE
    explanation: >-
      The nested part_of on the CASR activity makes intracellular calcium ion homeostasis a part
      of the adenylate cyclase-inhibiting GPCR signaling pathway. The cAMP-inhibiting Gi branch
      is instead one signaling route by which CaSR contributes to intracellular calcium
      homeostasis, so the nesting should be checked and likely inverted.
  notes: >-
    The CASR review accepts G protein-coupled receptor activity (GO:0004930) at the plasma
    membrane as a core molecular function and accepts adenylate cyclase-inhibiting GPCR
    signaling as a direct process. The cached activity records intracellular calcium ion
    homeostasis as its top-level part_of value, then nests that process under GO:0007193; that
    nesting appears inverted and is recorded as a GO-CAM source defect above rather than counted
    as corroboration. Its edge structure is otherwise appropriate: extracellular calcium is the
    small-molecule activator, GNAI1 is the receptor activity's has_input effector molecule, and
    the causal edge directly positively regulates the GNAI1 G protein activity.
notes: >-
  Alignment with modules/calcium_sensing_receptor_signaling.yaml: the module explicitly pins the
  CASR and GNAI1 activities from this GO-CAM to its receptor and Gi/o-route annotons. The ADCY6
  activity is represented through the referenced generic gpcr_camp_pka_signaling#adenylyl_cyclase_activation
  module rather than repeated as a local CaSR annoton. The generic
  gpcr_camp_pka_signaling module now also records this GO-CAM's CASR, GNAI1
  and ADCY6 activities as the reusable Gi-to-adenylyl-cyclase inhibition arm.
  The only open model-local structural issue is the missing ADCY6 location,
  which also makes the GNAI1-to-ADCY6 edge indeterminate in the compartment
  check.
