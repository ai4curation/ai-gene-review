model: gomodel:67c10cc400004342
title: CASR-mediated signaling via G-alpha-i (inhibitory), inhibiting adenylate cyclase)
  following activation by extracellular calcium (Human).
taxon: NCBITaxon:9606
status: COMPLETE
summary: >-
  A compact CaSR-to-Gi human model: extracellular calcium activates the plasma-membrane
  calcium-sensing receptor, CaSR directly activates GNAI1 on the cytoplasmic side of the
  plasma membrane, and GNAI1 directly inhibits ADCY6 adenylate cyclase activity as part of
  the adenylate cyclase-inhibiting GPCR pathway. The CASR, GNAI1 and ADCY6 activities agree
  with their local gene reviews. ADCY6 is missing an occurs_in location; otherwise, the
  cyclase step is the expected G alpha i-inhibited effector.
