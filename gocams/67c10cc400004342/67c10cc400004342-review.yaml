  notes: >-
    Adenylate cyclase activity (GO:0004016) and negative regulation by Gi agree with the generic
    G alpha i-to-adenylyl-cyclase effector step: purified Gi alpha 1 inhibited type VI adenylyl
    cyclase in a reconstituted assay. The activity lacks an occurs_in value in the GO-CAM, so the
    cytoplasmic side of plasma membrane inferred by the model's context is not explicit on the
    ADCY6 node itself. The ADCY6 review keeps adenylate cyclase activity at the plasma
    membrane as its core molecular function and keeps generic Gi-coupled inhibition of ADCY6
    as a supported non-core receptor branch, so the molecular function and biological
    process are consistent with the local review.
