model: gomodel:62b4ffe300000081
title: CASP7 activates SMPD1 to repair perforin pores in hepatocytes (Human)
taxon: NCBITaxon:9606
status: COMPLETE
summary: 'A membrane-repair model: NK or CTL attack punches perforin pores in a hepatocyte, granzyme B
  activates caspase-7, caspase-7 proteolytically activates acid sphingomyelinase, and the resulting ceramide
  lets the cell repair the pores. The underlying biology is the Nozaki 2022 pathway and it is worth modelling;
  the hepatocyte cell type is asserted consistently on all five activities and matches the title. But
  the model has three real problems, two of them about perforin. The chain is wired through perforin rather
  than through caspase-7: granzyme B is made to directly positively regulate perforin''s channel activity,
  on evidence (PMID:9852092, ''Granzyme B mimics apical caspases'', and PMID:31953257) that is about granzyme
  B activating caspase-3 and -7, so the edge''s object looks wrong - the evidence supports granzyme B
  acting on the caspase-7 activity in this same model, not on the pore. Biologically the dependence runs
  the other way too: the pore delivers granzyme B. Second, PRF1 is given two activities with identical
  molecular function and identical location, differing only in their process, and one of them has no causal
  edge at all, leaving it disconnected from the model it belongs to. Third, both perforin activities sit
  in GO:0016020 membrane, a generic term where the evidence and the biology specify the hepatocyte plasma
  membrane, and one is placed in GO:0009306 protein secretion, which the PRF1 gene review re-levels to
  GO:0071806 protein transmembrane transport on the grounds that efflux of caspase-7 through a lytic pore
  is not regulated secretion. As in the sibling model 62b4ffe300000335, the RO:0002629 directly positively
  regulates predicates throughout arrived by an automated change in March 2023 that replaced RO:0002213
  positively regulates, so their directness was not a per-edge curation decision.'
activity_reviews:
- activity_id: gomodel:62b4ffe300000081/62b4ffe300000195
  gene_product: UniProtKB:P14222
  molecular_function: GO:0022829
  biological_process: GO:0009306
  cellular_component: GO:0016020
  verdict: UNCERTAIN
  consistency: CONFLICT
  notes: 'The molecular function is right and matches the PRF1 gene review''s primary core function, so
    the conflict recorded here is on the process, not the activity: this is not a claim that perforin
    does nothing here. Two issues. GO:0009306 protein secretion, asserted by similarity from mouse (GO_REF:0000024),
    describes the controlled release of proteins from a cell, and what happens here is caspase-7 escaping
    through a lytic lesion - not a secretory route and not controlled. The gene review re-levels the same
    annotation on the GOA record to GO:0071806 protein transmembrane transport, which names the step without
    implying a secretory mechanism, and the same substitution would fix this activity. GO:0016020 membrane
    is also weaker than the evidence: PMID:20889983 supports membrane insertion, and the model itself
    places the activity in a hepatocyte under attack, so the hepatocyte plasma membrane (GO:0005886) is
    what is meant and is what the gene review accepts. The outgoing edge to caspase-7 asserts RO:0002629
    directly positively regulates; perforin does not alter caspase-7''s catalytic rate, it provides the
    conduit the enzyme passes through, and the predicate arrived by the automated March 2023 change rather
    than by a judgement about this edge.'
  qc_flags:
  - DIRECT_VS_INDIRECT_CAUSAL
  gene_review: genes/human/PRF1/PRF1-ai-review.yaml
  supporting_text: Planar lipid bilayer experiments indicate that perforin pores exhibit a broad range
    of conductances, from 0.15 to 21 nanosiemens.
- activity_id: gomodel:62b4ffe300000081/62b4ffe300000218
  gene_product: UniProtKB:P14222
  molecular_function: GO:0022829
  biological_process: GO:0140507
  cellular_component: GO:0016020
  verdict: UNCERTAIN
  consistency: CONSISTENT
  notes: 'Taken alone this activity is sound and consistent with the gene review: GO:0022829 wide pore
    channel activity in GO:0140507 granzyme-mediated programmed cell death signaling pathway is exactly
    perforin''s role, and both terms are accepted there. The problem is its place in the model. It has
    no causal edge in either direction, so it is disconnected from the pathway the model exists to describe,
    and it duplicates activity 62b4ffe300000195 in molecular function, location and cell type, differing
    only in the process it is attached to. Either this is one pore activity serving two processes, in
    which case one activity carrying both would be the clearer representation, or it is genuinely a second
    instance - the pore that lets granzyme B in, as against the pore that lets caspase-7 out - in which
    case the distinction is the interesting part and should be visible in the wiring rather than left
    to the reader. As drawn, the model''s granzyme-mediated death pathway has no connection to its membrane-repair
    chain. GO:0016020 membrane understates the location here as it does on 62b4ffe300000195.'
  qc_flags:
  - ORPHAN_ACTIVITY
  gene_review: genes/human/PRF1/PRF1-ai-review.yaml
  supporting_text: Perforin is released from cytotoxic lymphocytes, together with proapoptotic granzymes,
    to bind to a target cell membrane where it oligomerizes and forms pores.
- activity_id: gomodel:62b4ffe300000081/62b4ffe300000091
  gene_product: UniProtKB:P10144
  molecular_function: GO:0004252
  biological_process: GO:0051604
  cellular_component: GO:0005737
  verdict: WRONG
  consistency: CONSISTENT
  notes: 'Granzyme B as a serine-type endopeptidase driving protein maturation is a fair description of
    what it does in this pathway - it proteolytically activates executioner caspases, which is a maturation
    event - and the location and evidence are reasonable. The edge is the problem, and it is why this
    activity is graded WRONG rather than UNCERTAIN. It asserts that granzyme B directly positively regulates
    perforin''s channel activity (62b4ffe300000195). Granzyme B does not regulate pore formation; the
    dependence runs the other way, since the pore is how granzyme B reaches the cytosol at all. The model''s
    own evidence says so: both cited references concern granzyme B activating caspases, and this model
    contains a caspase-7 activity, 62b4ffe300000105, which is what that evidence supports as the edge''s
    object. Re-pointing the edge from perforin to caspase-7 would make the model match both its evidence
    and the pathway, and would connect the chain correctly: pore, then granzyme B, then caspase-7, then
    acid sphingomyelinase. The directness is a second, independent problem, and the cited paper is explicit
    about it: granzyme B does not activate procaspase-7 directly in cells. Yang et al. found caspase-7
    unprocessed in caspase-3-deficient cells exposed to granzyme B, concluding that granzyme B activates
    caspase-3, which removes the caspase-7 propeptide and only then allows granzyme B to activate it,
    so that ''two proteases, caspase-3 and GrB, are required to activate procaspase-7''. A corrected edge
    onto caspase-7 should therefore be indirect, not RO:0002629, and caspase-3 is a missing participant
    in this model. As with every such predicate here, the current directness arrived by the automated
    March 2023 replacement of RO:0002213 rather than by a decision about this edge. Consistency with the
    GZMB gene review written alongside this one: the activity typing is consistent with it - GO:0004252
    is accepted there as granzyme B''s core molecular function and GO:0051604 protein maturation as a
    core process, which is the right framing for an enzyme that activates its substrates by limited cleavage
    rather than degrading them. The consistency verdict therefore describes the activity, not the edge,
    which remains the reason this entry is graded WRONG. That review also records the caspase-3 requirement
    quoted above from PMID:9852092.'
  qc_flags:
  - INCORRECT_DIRECTIONALITY
  - DIRECT_VS_INDIRECT_CAUSAL
  supporting_text: Thus GrB initiates the death pathway by processing the accessible caspase-3, and the
    caspase-7 propeptide regulates trans-activation of the zymogen by granzyme.
  gene_review: genes/human/GZMB/GZMB-ai-review.yaml
- activity_id: gomodel:62b4ffe300000081/62b4ffe300000154
  gene_product: UniProtKB:P17405
  molecular_function: GO:0061750
  biological_process: GO:0046513
  cellular_component: GO:0005576
  verdict: OK
  consistency: CONSISTENT
  notes: 'Acid sphingomyelinase generating ceramide is the terminus of the repair arm and is correctly
    typed: GO:0061750 acid sphingomyelin phosphodiesterase activity is specific and right for SMPD1, and
    GO:0046513 ceramide biosynthetic process is what the reaction accomplishes. Graded OK. The activity
    has no outgoing edge, which is appropriate for a terminal node, and unlike perforin activity 62b4ffe300000218
    it is reached by an incoming edge, so it is not orphaned. The ceramide it produces is what allows
    endocytic removal of the pores, so a model wanting to close the loop could connect this back to the
    perforin activities; that is an extension rather than a defect. Consistency: an SMPD1 review exists
    (its status is still INITIALIZED, but all 102 of its annotation rows are adjudicated) and it accepts
    GO:0061750 acid sphingomyelin phosphodiesterase activity, the exact term this activity uses, so the
    typing is consistent. Two smaller observations from that review rather than from this model. Its GO:0005576
    extracellular region rows are kept as non-core, which fits: the enzyme has both a lysosomal and a
    secreted form, and only the secreted one is relevant here. A note on GO:0046513 ceramide biosynthetic
    process, the process this activity uses, and a correction to an earlier version of this review. That
    term appeared on the SMPD1 record with mixed verdicts, which an aggregate count made look like a straight
    contradiction; reading the rows shows it is not. Seven rows accept it, including three IDA and two
    IMP, and a single row carried MARK_AS_OVER_ANNOTATED for a specific and well-argued reason: its reference,
    PMID:19279011, is a study of acid beta-glucosidase 1 in the ceramide salvage pathway whose experiments
    manipulate GBA1, not SMPD1. So the claim was never in dispute, only that row''s evidence. The row
    has since been changed to ACCEPT with the reference flagged MISCITED, which is where the defect belongs
    and matches how the same situation was handled on PRF1 and GZMB, and the SMPD1 review is now COMPLETE.
    Recorded here because this model depends on the term.'
  supporting_text: Here we show that PMA selectively activates ASMase and that ASMase accounts for the
    majority of PMA-induced ceramide.
  gene_review: genes/human/SMPD1/SMPD1-ai-review.yaml
- activity_id: gomodel:62b4ffe300000081/62b4ffe300000105
  gene_product: UniProtKB:P55210
  molecular_function: GO:0004197
  biological_process: GO:0051604
  cellular_component: GO:0005576
  verdict: OK
  consistency: CONSISTENT
  notes: 'Caspase-7 as a cysteine-type endopeptidase whose protein-maturation activity activates acid
    sphingomyelinase is well supported by the cited reference and is the hinge of the repair pathway.
    Graded OK. The extracellular location is discussed in the model notes: it fits the pathway''s claim
    that caspase-7 exits the attacked cell, while the reference supporting it studied the enzyme in intracellular
    TNF-R1 receptosomes, so the placement is an interpretation rather than a direct observation. Not flagged,
    because the compartment check finds the edge to acid sphingomyelinase adjacent and the reading is
    a defensible curation decision. Consistency: a complete CASP7 review exists in this repository and
    this activity agrees with it on every axis - GO:0004197 cysteine-type endopeptidase activity is accepted
    there twenty-six times over and is one of its core molecular functions, GO:0051604 protein maturation
    is accepted, and GO:0005576 extracellular region is accepted. The extracellular placement discussed
    above is therefore not an outlier in this repository''s own curation.'
  supporting_text: Caspase-7 down modulation revealed the functional link between caspase-7 and A-SMase,
    confirming proteolytic cleavage as one further mode of A-SMase activation.
  gene_review: genes/human/CASP7/CASP7-ai-review.yaml
