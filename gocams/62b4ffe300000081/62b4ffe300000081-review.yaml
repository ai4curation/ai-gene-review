notes: 'Checks run and dismissed: just gocam-compartments reports no unresolved locations and no non-adjacent
  edges (2 RESOLVED, 3 COARSE; edges 2 SAME, 1 ADJACENT). The three COARSE locations are GO:0016020 membrane
  twice and GO:0005737 cytoplasm once; the membrane ones are flagged in the activity reviews because the
  evidence does resolve them, the cytoplasm one on granzyme B is not, since granzyme B acting on cytoplasmic
  substrates is as much as the cited work fixes.


  Two apparent defects were checked corpus-wide and withdrawn as artifacts of this repository''s cache
  rather than properties of the model, exactly as in the review of 62b4ffe300000335. No activity here
  carries evidence on its molecular_function association, but neither does any of the 12,585 activities
  in the 2,036 cached models. And every molecular_associations entry in this model has a null entity -
  which is true of all 19,378 such entries in the corpus - so although this model declares three has input
  associations (RO:0002233, on the two proteases and on perforin activity 62b4ffe300000195), a has output
  (RO:0002234, on acid sphingomyelinase) and a has small molecule inhibitor (RO:0012002, on perforin activity
  62b4ffe300000218), what any of them names cannot be read from these files. The inhibitor association
  is the interesting one and is unreviewable here; it would be worth looking at in the live model.


  One location worth a curator''s eye but not flagged: caspase-7 is placed in GO:0005576 extracellular
  region, which fits the pathway''s claim that activated caspase-7 leaves the cell to meet acid sphingomyelinase,
  but its supporting reference PMID:21157428 concerns caspase-7 activating that enzyme in TNF-R1 receptosomes,
  an intracellular compartment, and the evidence code is ECO:0000304 rather than a direct code. The model''s
  comments also record that this term arrived by an automated change in March 2026 replacing GO:0005615
  extracellular space. The extracellular placement is probably the curator''s deliberate reading of the
  newer pathway, so it is recorded here rather than flagged.'
