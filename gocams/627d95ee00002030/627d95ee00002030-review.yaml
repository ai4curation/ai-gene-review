model: gomodel:627d95ee00002030
title: Activation of PARP2 activity by HPF1 during DNA repair (Human)
taxon: NCBITaxon:9606
status: COMPLETE
summary: >-
  A compact PARP2 DNA-damage model: PARP2 damaged-DNA binding and HPF1
  substrate-adaptor activity feed the HPF1/PARP2 serine ADP-ribosyltransferase
  activity, and the model then places that initiation step upstream of PARP2
  poly-ADP-ribose synthesis. The source model is directionally coherent and
  uses specific molecular-function terms for HPF1-assisted serine initiation
  and PAR-chain elongation. PARP2 branching is supported by the cached full text
  for PMID:30104678. The HPF1-specific evidence paper, PMID:34108479, is not
  cached locally, so those nodes are left UNCERTAIN rather than text-verified.
  The definite source defect is a duplicated PARP2 damaged-DNA-binding edge:
  one copy has PMID:34108479 evidence and the otherwise identical copy has no
  evidence.
