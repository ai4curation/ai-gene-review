    requested_change: CHECK
    asserted_value: RO:0002629 directly positively regulates gomodel:627d95ee00002030/627d95ee00002047
    confidence: PROBABLE
    explanation: >-
      The source model comment records an automated 2023-03-16 conversion from
      RO:0002213 to RO:0002629, so directness of the edge from PARP2 serine
      initiation to PARP2 PAR elongation/branching is not a curator-entered
      mechanistic claim. PMID:32028527 reports that HPF1-bound serine
      ADP-ribosylation and PAR chain formation are sterically mutually exclusive
      at a given moment, and PMID:30104678 supports PARP2 branching after
      activation by PAR. The model should be checked for whether this relation
      should be indirect, deleted, or remodelled through PAR as an input to PARP2
      chain branching.
  supporting_text: a complete loss of serine-ADP-ribosylation was observed for the E284A mutant
  evidence:
  - source_id: PMID:32028527
    statement: >-
      HPF1 Glu284 is required for PARP2-catalysed serine ADP-ribosylation.
    supporting_text: >-
      results were comparable for PARP1- and PARP2-catalysed reactions,
      confirming their conserved interaction with HPF1
  notes: >-
    The MF is the specific HPF1-dependent serine-initiation activity. Cached
    PMID:32028527 verifies that human HPF1 and PARP2 form a joint active site
    and that the HPF1 E284A active-site mutant abolishes PARP1/PARP2-catalysed
    serine ADP-ribosylation. The activity remains UNCERTAIN because its
    RO:0002629 directly-positive edge to PAR-chain elongation has only a
    bulk-converted direct relation and conflicts with the transient handoff from
    HPF1-bound serine initiation to free PARP2 acting on PAR. In the module
    alignment this GO:0140805 activity now maps to a dedicated PARP2
    serine-initiation annoton rather than to the broader PARP2
    poly-ADP-ribosyltransferase annoton.
