    asserted_value: RO:0002629 directly positively regulates gomodel:627d95ee00002030/627d95ee00002040
    confidence: CONFIRMED
    explanation: >-
      The damaged-DNA-binding activity has two direct positive causal edges to the
      same PARP2 NAD+-protein-serine ADP-ribosyltransferase activity. The first
      copy cites PMID:34108479 and has the same ECO/PMID evidence item twice,
      while the second copy carries no evidence at all. Both edges have 2023-03-16
      provenance matching the automated RO:0002213-to-RO:0002629 conversion
      recorded in the model comment, so that conversion may be how the duplicate
      was introduced. Keep the evidenced edge and delete the empty duplicate.
  notes: >-
    `just gocam-lint` reports a binding MF, but GO:0003684 damaged DNA binding
    is the lesion-recognition trigger for PARP2 activation at DNA lesions, not a
    generic protein-binding placeholder. GO:0090734 site of DNA damage is a
    biologically specific but compartment-unresolved chromosomal location. The
    source PMID, PMID:34108479, is absent from the local publication cache and
    was not text-checked here, so the node remains UNCERTAIN. The activity records
    GO:0006974 as the immediate biological process; the source nests that process
    under GO:0006281 DNA repair. The otherwise identical second edge to the PARP2
    serine ADP-ribosyltransferase node lacks both an ECO code and a reference.
