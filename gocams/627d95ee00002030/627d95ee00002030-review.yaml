model: gomodel:627d95ee00002030
title: Activation of PARP2 activity by HPF1 during DNA repair (Human)
taxon: NCBITaxon:9606
status: COMPLETE
summary: >-
  A compact PARP2 DNA-damage model: PARP2 damaged-DNA binding and HPF1
  substrate-adaptor activity feed the HPF1/PARP2 serine ADP-ribosyltransferase
  activity, and the model then places that initiation step upstream of PARP2
  poly-ADP-ribose synthesis. The source model uses specific molecular-function
  terms for HPF1-assisted serine initiation and PAR-chain elongation, and cached
  PMID:32028527 verifies the HPF1/PARP2 joint active site and PARP2-catalysed
  serine ADP-ribosylation. The model leaves two edge-level source issues: the
  PARP2 damaged-DNA-binding edge is duplicated, with one PMID:34108479-supported
  copy and one otherwise identical evidence-free copy, and the
  serine-initiation-to-chain-elongation edge carries RO:0002629 after the
  source's automated RO:0002213-to-RO:0002629 conversion even though HPF1-bound
  serine initiation and PAR elongation are not simultaneous single-step
  reactions.
