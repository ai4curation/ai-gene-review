    notes: >-
      The enabled_by object is the correct UniProtKB:P17812 CTPS1 entry despite
      the typo in the cached GO-CAM title, which writes "CTSP1". GO:0160264 is
      the exact H1N76/N77 deamidase activity accepted by the CTPS1 review, and
      chromatin is retained there as the damage-associated activity location;
      GO:0000228 nuclear chromosome would make the nuclear chromatin compartment
      explicit. H1-4 is the right has_input target for this activity: the 2025
      paper focuses on H1.4 among the H1 variants and demonstrates direct
      CTPS1-H1.4 deamidation in vitro. The CTPS1-to-EP300 edge is a direct
      substrate-priming edge: CTPS1 modifies H1.4 at N76/N77 and that deamidated
      H1.4 is then a preferred EP300 substrate for the adjacent K75 acetylation
      event. GO:0160264 is more specific than the CTPS1 core GO:0160260 protein
      asparagine deamidase function, whose description names histone H1 N76/N77
      deamidation directly. The CTPS1 gene review still accepts the GO:1902340
      row for PMID:40240600, but its core function uses GO:0140861 as the
      pathway context without GO:1902340, so this GO-CAM review records the
      process-context disagreement as a suspected CHECK rather than an exported
      delete request.
