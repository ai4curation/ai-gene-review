model: gomodel:682fbcd000000000
title: Histone H1 deamidation by CTSP1 promotes subsequent acetylation by EP300 and  facilitates
  chromatin relaxation for DNA repair (Human).
taxon: NCBITaxon:9606
status: COMPLETE
summary: >-
  A compact damaged-chromatin model: CTPS1 directly deamidates H1-4 on N76/N77
  at chromatin, priming the same linker histone for EP300-mediated H1K75
  acetylation, and the acetylated H1.4 state then weakens H1-DNA association to
  relax damaged chromatin. The molecular functions and the two has-input links
  are supported by the 2025 primary paper and match the CTPS1, EP300 and H1-4
  gene reviews. The EP300 and H1-4 process/context details need tightening: the
  represented biology is DNA repair-dependent chromatin remodeling rather than
  mitotic or apoptotic chromosome condensation, and the cited GO-CAM evidence
  places modified H1 at DSB-associated chromatin rather than specifically at
  heterochromatin.
