      EP300 review, and the H1-4 has_input edge is correct for the substrate
      lysine acetylated by p300. The direct negative edge to the H1 structural
      activity has the right sign: K75 acetylation after CTPS1-dependent
      N76/N77 deamidation loosens H1.4-linker-DNA contacts and increases
      damaged-chromatin accessibility. The activity is UNCERTAIN only because
      the primary part_of term is GO:1902340 negative regulation of chromosome
      condensation, whose chromosome-condensation definition overspecifies the
      repair-associated chromatin relaxation measured in PMID:40240600. The
      nested GO:0140861 part_of assertion names the right process.
