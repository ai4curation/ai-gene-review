    notes: >-
      The enabled_by object is the correct UniProtKB:P17812 CTPS1 entry despite
      the typo in the cached GO-CAM title, which writes "CTSP1". GO:0160264 is
      the exact H1N76/N77 deamidase activity accepted by the CTPS1 review, and
      chromatin is retained there as the damage-associated activity location.
      H1-4 is the right has_input target for this activity: the 2025 paper
      focuses on H1.4 among the H1 variants and demonstrates direct CTPS1-H1.4
      deamidation in vitro. The positive edge to EP300 is a direct substrate
      priming edge: CTPS1 modifies H1.4 at N76/N77 and that deamidated H1.4 is
      then a preferred EP300 substrate for the adjacent K75 acetylation event.
