notes: >-
  Module alignment: modules/histone_acetyltransferase_complexes.yaml already
  pins this GO-CAM on the EP300 H1K75 acetyltransferase activity. No module edit
  is needed: CTPS1 is a DNA-damage-specific upstream deamidase that primes a
  linker-histone substrate, while H1-4 is that substrate. The reusable
  histone-acetyltransferase-complex module should not absorb a model-specific
  CTPS1 -> H1.4 -> EP300 substrate-preparation branch.

  Checks run and recorded: just gocam-lint reports only no_narrative. just
  gocam-compartments reports all three chromatin or heterochromatin locations
  as UNRESOLVED_COMPARTMENT because GO classifies chromatin beneath chromosome
  rather than nuclear lumen; the review flags all three and names GO:0000228
  nuclear chromosome as the term that would state the localizable nuclear
  chromatin compartment. Both causal edges stay within chromatin and have no
  non-adjacent or relocating compartment issue.
