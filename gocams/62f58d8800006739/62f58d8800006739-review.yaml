  evidence:
  - source_id: PMID:21220323
    statement: G alpha o2, not Go1 or Gi, mediates the inhibitory pathway; no channel mechanism is stated.
    supporting_text: >-
      We thus provide unique genetic evidence that the G(o2) protein is a
      transducer in an inhibitory pathway that prevents damaging oversecretion
      of insulin.
  - source_id: PMID:34636409
    statement: The cited review describes GIRK channels as G-protein-activated in mouse beta cells without naming the subunit.
    supporting_text: >-
      G protein-coupled inward-rectifying K+ (GIRK) channels, a type of inward
      rectifier that is activated in a G-protein-dependent manner have been
      shown to be present in mouse β-cells, where they mediate epinephrine- and
      somatostatin-induced hyperpolarization
  notes: >-
    The isoform-level part_of negative regulation of insulin secretion is well
    supported by the Go2-specific knockout, which is the strength of this
    activity. The molecular function is not: GIRK (Kir3) channels are opened by
    the Gβγ dimer released from Gi/o heterotrimers, not by the G alpha
    subunit, so "potassium channel activator activity" and the direct positive
    edge to Kcnj6 belong on the Gβγ complex already present in the model.
    Neither cited paper attributes channel activation to G alpha o2: the
    knockout paper names no mechanism, and the review (TAS evidence for the
    edge) says only "G-protein-dependent". No review for mouse Gnao1.
