  evidence:
  - source_id: PMID:18096703
    statement: Galphaz-null islets have higher cAMP and insulin secretion, consistent with tonic adenylyl cyclase inhibition by Galphaz.
    supporting_text: >-
      the increased insulin secretion observed in Galphaz-null islets appears to
      be due to the relief of a tonic inhibition of adenylyl cyclase, as cAMP
      production was significantly increased in Galphaz-null islets in the
      absence of exogenous stimulation
  notes: >-
    Adenylate cyclase inhibitor activity and the negative regulation of insulin
    secretion are supported by the Galphaz knockout. The adenylyl cyclase it
    inhibits is not in the model, so the arm stops here. The plasma membrane
    location cites PMID:21220323, a G alpha o2 paper that does not concern
    Gz, and the incoming receptor edge has no evidence; the cited Gz paper
    does not show that alpha2A specifically couples to Gz. No review for
    mouse Gnaz.
