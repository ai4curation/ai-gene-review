  evidence:
  - source_id: PMID:17992256
    statement: The Gi-coupled alpha2A-adrenergic receptor negatively regulates insulin secretion.
    supporting_text: >-
      3-iodothyronamine, a thyroid hormone metabolite, could negatively and
      positively regulate insulin secretion via the G(i)-coupled
      alpha(2A)-adrenergic receptor and the G(s)-coupled receptor Taar1,
      respectively
  - source_id: PMID:1898674
    statement: Adrenaline suppresses beta-cell electrical activity through a G-protein-dependent K+ channel.
    supporting_text: >-
      adrenaline suppresses B-cell electrical activity (and thus insulin
      secretion) by a G protein-dependent mechanism, which culminates in the
      activation of a sulphonylurea-insensitive low-conductance K+ channel
      distinct from the KATP channel
  notes: >-
    The receptor activity, its catecholamine activators and its role in
    negative regulation of insulin secretion are well supported, and
    "directly positively regulates" is the conventional edge from a GPCR to
    its G proteins. But none of the four outgoing edges, nor the plasma
    membrane location or the noradrenaline activator, carries evidence.
    PMID:1898674 shows an adrenaline response without naming the receptor
    subtype. No review for mouse Adra2a.
