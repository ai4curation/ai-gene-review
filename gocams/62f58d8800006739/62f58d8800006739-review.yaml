  evidence:
  - source_id: PMID:20622165
    statement: Galphao loss enhances insulin secretion and increases docked insulin granules.
    supporting_text: >-
      Gαo nullizygous β-cells contain an increased number of insulin granules
      docked on the cell plasma membrane, although the total number of vesicles
      per β-cell remains unchanged.
  notes: >-
    The knockout phenotype supports Gαo in negative regulation of insulin
    secretion, but the activity is a root molecular function with no
    outgoing edge, so it adds nothing beyond the process annotation. Its
    mechanism is open in the paper itself, which only raises the possibility
    that Gαo acts through Gβγ on the SNARE complex. It also overlaps the
    separate G alpha o2 isoform activity: PMID:21220323 finds that Go2, not
    Go1, is the relevant variant, and this activity's knockout removes both.
    A G alpha GTPase/G-protein activity term would be more informative than
    the root. No review for mouse Gnao1.
