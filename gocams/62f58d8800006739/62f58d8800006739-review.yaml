  - source_id: PMID:20643776
    statement: Noradrenaline inhibits beta-cell exocytosis through Gbetagamma acting on the SNAP-25 C-terminus.
    supporting_text: >-
      These data indicate that inhibition of exocytosis by NA is downstream of
      increased [Ca(2+)](i) and is mediated by an interaction between Gβγ and the
      C-terminus of SNAP-25
  notes: >-
    The Gβγ -> SNAP-25 direct negative regulation is the mechanism of
    PMID:20643776 (rat INS 832/13 cells), and "molecular function inhibitor
    activity" with a negative edge to SNAP-25's fusogenic activity is a fair
    representation. However, the activity's enabled_by, part_of and outgoing
    edge carry no evidence; only the plasma membrane location is evidenced, and
    it cites the G alpha o2 knockout paper. This complex is also the
    physiological activator of GIRK channels, which the model instead assigns
    to the G alpha o2 subunit (see that activity). A complex is the enabler,
    so there is no single gene review to compare against.
