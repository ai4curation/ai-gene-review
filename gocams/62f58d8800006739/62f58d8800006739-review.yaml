  evidence:
  - source_id: PMID:20393461
    statement: GIRK2-containing channels expressed in Xenopus oocytes conduct G-protein-activated K+ currents.
    supporting_text: >-
      In oocytes injected with mRNA for GIRK1/GIRK2, GIRK2, or GIRK1/GIRK4
      subunits, extracellular application of atomoxetine or reboxetine reversibly
      reduced GIRK currents.
  notes: >-
    GIRK2 has K+ channel activity, but the enabled_by evidence is an oocyte
    pharmacology study of channel inhibitors, not of beta cells, and the
    part_of negative regulation of insulin secretion rests on a review that
    places "GIRK channels" in mouse beta cells without naming GIRK2
    (traceable author statement). A more specific term, G-protein activated
    inward rectifier potassium channel activity, applies. No review for mouse
    Kcnj6.
