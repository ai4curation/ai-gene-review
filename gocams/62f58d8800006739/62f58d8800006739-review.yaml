model: gomodel:62f58d8800006739
title: Negative regulation of insulin secretion 2 (Mouse)
taxon: NCBITaxon:10090
status: COMPLETE
summary: >-
  An alpha2-adrenergic inhibition pathway in the mouse pancreatic beta cell.
  The alpha2A-adrenergic receptor (Adra2a, alpha2-adrenergic receptor
  activity, activated by adrenaline and noradrenaline, plasma membrane)
  directly positively regulates four G-protein activities: G alpha z (Gnaz,
  adenylate cyclase inhibitor activity), G alpha o (Gnao1, root molecular
  function only), the G alpha o2 splice isoform (PR:P18872-2, potassium
  channel activator activity) and the G beta/gamma complex (molecular function
  inhibitor activity). The G alpha o2 isoform then directly positively
  regulates the GIRK2 channel (Kcnj6, potassium channel activity), and
  G beta/gamma directly negatively regulates SNAP-25 (Snap25, SNAP receptor
  activity, now labelled helical-bundle zippering fusogenic activity, part_of
  insulin secretion). Everything except SNAP-25 is part_of negative
  regulation of insulin secretion. The three arms correspond to three
  documented mechanisms: lower cAMP through Gz, hyperpolarization through a
  G-protein-gated K+ channel, and a distal block of exocytosis through
  G beta/gamma binding the SNAP-25 C-terminus. Problems: GIRK channels are
  gated by G beta/gamma, yet the K+ channel activator activity is placed on the
  G alpha o2 subunit, while the G beta/gamma complex in the model is used only
  for the SNAP-25 arm; the five edges leaving the receptor and G beta/gamma
  carry no evidence; and several evidence references do not match their claim.
  SNAP-25's own typing is correct (the fusogenic SNARE activity), but its
  enabled_by evidence cites a VAMP2/calmodulin paper, it has no location, and
  its part_of rests on a rat INS cell line.
