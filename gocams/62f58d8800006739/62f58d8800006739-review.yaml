  evidence:
  - source_id: PMID:20643776
    statement: Gbetagamma inhibition of beta-cell exocytosis requires the SNAP-25 C-terminus.
    supporting_text: >-
      NA-induced inhibition was also abolished by treatment with BoNT/A, which
      cleaves the C-terminal nine amino acids of SNAP-25, and also by a SNAP-25
      C-terminal-blocking peptide containing the BoNT/A cleavage site.
  - source_id: PMID:12145198
    statement: The enabled_by reference is about VAMP2 calmodulin/lipid binding; SNAP-25 is named only as a SNARE partner.
    supporting_text: >-
      Neurotransmitter release involves the assembly of a heterotrimeric SNARE
      complex composed of the vesicle protein synaptobrevin (VAMP 2) and two
      plasma membrane partners, syntaxin 1 and SNAP-25.
  notes: >-
    The molecular function is right: GO:0005484 (formerly SNAP receptor
    activity, now helical-bundle zippering fusogenic activity) is SNAP-25's
    own activity in exocytosis, and the incoming Gβγ negative edge fits
    PMID:20643776, whose BoNT/A and blocking-peptide experiments tie the
    noradrenaline effect to the SNAP-25 C-terminus. The evidence around it is
    weak. The enabled_by reference, PMID:12145198 (coded as direct assay), is a
    study of the VAMP2 C-terminal calmodulin/phospholipid-binding domain in
    chromaffin and PC12 cells and does not assay SNAP-25; it reads as a
    mis-keyed reference. The part_of insulin secretion is inferred by
    orthology from the rat INS 832/13 study rather than shown in mouse. No
    location (plasma membrane). It is the model's only activity not part_of
    negative regulation of insulin secretion, which is correct: SNAP-25 drives
    secretion and is the regulated target. No review for mouse Snap25; the
    human SNAP25 ortholog review makes the same GO:0005484 activity its core
    function, directly involved in synaptic vesicle priming and fusion and, in
    a second core function, in presynaptic dense core vesicle exocytosis and
    calcium-ion regulated exocytosis, so the model's MF agrees with the
    ortholog's.
