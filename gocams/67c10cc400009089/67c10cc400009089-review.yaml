    notes: >-
      SOS1 guanyl-nucleotide exchange factor activity is a core molecular function in the SOS1
      review, and the GO-CAM places it in the EGFR pathway represented by the EGFR module. The
      model leaves Ras itself out and therefore gives the SOS1 GEF no Ras has_input target; the
      downstream edge to MAPK3 uses the indirect RO:0002407 relation, so the edge is a compact
      summary of the missing Ras/RAF/MEK tiers rather than a directness error. However, that
      compact edge is unevidenced in the model because it inherits PMID:1371879, which supports
      Ras activation downstream of other receptors rather than this EGF-to-MAPK3 step. Occurs_in
      GO:0005737 cytoplasm is also coarser than the SOS1 review's cytosol and plasma-membrane
      locations for receptor-recruited Ras exchange.
