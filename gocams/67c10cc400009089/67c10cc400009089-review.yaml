      EGF is the correct upstream ligand and GO:0007173 is the right process. The local EGF
      review represents the molecular activity as GO:0005154 epidermal growth factor receptor
      binding, so the GO-CAM's GO:0008083 growth factor activity is judged RELATED rather than
