      The activity is biologically right: GRB2 bridges activated EGFR-family phosphotyrosines
      to SOS-family Ras GEFs. GO:0030674 protein-macromolecule adaptor activity is true but
      generic relative to the GRB2 review's EGFR-pathway core functions, and GO:0005068
      transmembrane receptor protein tyrosine kinase adaptor activity would be the most specific
      single term for the activity with EGFR and SOS1 as the two has_input fillers. The source
      paper used for the enabled_by evidence is a T-cell-receptor/LAT study; the local GRB2
      review does accept GO:0030674 as a core TCR-LAT function from that paper, but the EGFR
      context is represented by the more specific GO:0005068 and GO:0005091 core functions.
      The direct GRB2 -> SOS1 edge is a direct recruitment step. Occurs_in GO:0005737 cytoplasm
      is a coarse parent of the cytosol and plasma-membrane locations in the GRB2 review.
