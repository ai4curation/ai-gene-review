        supporting_text: Epidermal growth factor increased the activation of Ras
      - source_id: PMID:15611079
        statement: >-
          The paper cited for the EGF enabled_by edge assayed human ErbB-family ligands,
          but its focus is epigen, not EGF.
        supporting_text: that undergoes cleavage at two sites to release a soluble EGF-like domain
    notes: >-
      EGF is the correct upstream ligand and GO:0007173 is the right process. The local EGF
      review represents the molecular activity as GO:0005154 epidermal growth factor receptor
      binding, so the GO-CAM's GO:0008083 growth factor activity is judged RELATED rather than
      an exact match or clean parent/child relationship. The source model also gives this ligand
      activity two has_input links to EGFR and two direct positive edges to the EGFR receptor
      activity. The causal edge is the correct representation of ligand activation of a receptor;
      has_input is redundant and not GO-CAM best practice for ligand/receptor binding. One of the
      two otherwise-identical EGF -> EGFR direct edges has no evidence, which is the
      gocam-lint MISSING_EVIDENCE finding.
