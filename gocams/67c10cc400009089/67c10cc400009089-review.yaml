      has_input is redundant and not GO-CAM best practice for ligand/receptor binding. The first
      EGF -> EGFR edge carries the same ECO:0000314 / PMID:15611079 evidence item twice, and the
      otherwise-identical second edge has no evidence, which is the gocam-lint MISSING_EVIDENCE
      finding. The sole source reference on the EGF has_input assertion, PMID:6319448, is not
      cached here and was not text-checked.
