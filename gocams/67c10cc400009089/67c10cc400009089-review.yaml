        statement: >-
          GRB2 SH2/SH3 architecture supports its adaptor role at activated receptors and
          signaling proteins.
        supporting_text: >-
          GRB2 facilitates the assembly of multiprotein signaling complexes at activated
          receptors and signaling proteins
      - source_id: PMID:8253073
        statement: >-
          Ash/GRB2 associates with activated EGF receptor in EGF-stimulated cells, matching the
          EGFR input on this activity.
        supporting_text: Ash co-precipitated with EGF receptor from EGF-stimulated cells
    notes: >-
      The activity is biologically right: GRB2 bridges activated EGFR-family phosphotyrosines
      to SOS-family Ras GEFs. GO:0030674 protein-macromolecule adaptor activity is true but
      generic relative to the GRB2 review's transmembrane receptor protein tyrosine kinase
      adaptor and guanyl-nucleotide exchange factor adaptor core functions, so the activity is
      marked MORE_GENERAL rather than CONFLICT. The two has_input fillers, EGFR and SOS1,
      capture the two sides of the bridge, and the direct GRB2 -> SOS1 edge is a direct
      recruitment step.
