model: gomodel:67c10cc400009089
title: EGF signaling pathway (Human)
taxon: NCBITaxon:9606
status: COMPLETE
summary: >-
  A compact EGF-to-ERK human model: extracellular EGF directly activates EGFR at the plasma
  membrane; active EGFR directly recruits/activates the GRB2 adaptor, whose activity bridges
  the phosphorylated receptor to SOS1; SOS1 is then placed indirectly upstream of MAPK3/ERK1.
  The five enabled_by gene products and process assignments match the local gene reviews and
  the EGFR module's human activities. The EGF and EGFR locations match exactly, while GRB2,
  SOS1, and MAPK3 are all placed in GO:0005737 cytoplasm, a coarse parent of the cytosolic
  and plasma-membrane or nuclear locations in the corresponding reviews. The main modelling
  issue is on the EGF ligand activity, where EGFR is represented redundantly as has_input even
  though the causal EGF-to-EGFR edge already carries the ligand/receptor relation; one duplicate
  copy of that causal edge also lacks evidence, and the other carries the same evidence item
  twice. The model deliberately compresses the Ras, RAF, and MEK tiers between SOS1 and ERK1
  into an indirect SOS1-to-MAPK3 edge; that is not a directness error, but that edge and the
  SOS1 enabled_by assertion cite a hemopoietin/c-kit p21ras paper that predates human SOS1
  cloning rather than SOS1 evidence.
