model: gomodel:66c7d41500002413
title: DDX41 activation of the cGAS-STING signaling (Human)
taxon: NCBITaxon:9606
status: DRAFT
summary: >-
  A four-activity model of DDX41 feeding the cGAS-STING DNA-sensing axis: BTK
  (protein tyrosine kinase) activates DDX41 (helicase), which activates the
  STING1 signaling adaptor, which activates the TBK1 kinase driving type I
  interferon production. The STING1 and TBK1 steps are canonical and match the
  respective gene-review core functions. Two source defects are recorded on the
  upstream half, both as REPOINT. First, the BTK activity's enabled_by and its
  causal edge to DDX41 cite PMID:34554188, a BTK-NLRP3 inflammasome paper whose
  full cached text never mentions DDX41/cGAS/STING; the same activity's part_of
  and has_input slots already cite the correct paper, PMID:25704810 (BTK
  phosphorylates DDX41 to activate dsDNA/STING binding), so only those two slots
  carry the wrong reference. Second, the DDX41 activity is typed GO:0003724 RNA
  helicase activity, but its own cited paper (PMID:35613581) shows DDX41 unwinds
  DNA and fails to unwind the tested RNA duplexes, and the DDX41 gene review
  already repoints this same term/evidence/reference to GO:0003678 DNA helicase
  activity.
