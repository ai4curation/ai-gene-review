    requested_change: CHECK
    asserted_value: GO:0003724
    corrected_value: GO:0003678
    corrected_label: DNA helicase activity
    cause: OTHER
    confidence: SUSPECTED
    explanation: >-
      This DDX41 activity is typed GO:0003724 RNA helicase activity in a model
      whose biological process is the cGAS-STING cytosolic DNA-sensing pathway
      (GO:0140896). The activity's own cited reference, PMID:35613581, reports
      that DDX41 preferentially unwinds DNA (DNA > DNA:RNA hybrid > RNA) and
      additionally anneals DNA strands, and is required for cGAS/STING activation
      against DNA viruses - i.e. the function exercised at this node is DNA
      helicase/remodelling, not RNA helicase. GO:0003678 DNA helicase activity is
      the term the DDX41 gene review binds for this exact cGAS-STING role. RNA
      helicase activity is a genuine DDX41 function in spliceosomal RNA processing,
      so this is raised as a query about the term chosen for the DNA-sensing node
      rather than a blanket denial of RNA helicase activity for the protein.
    supported_by:
    - reference_id: PMID:35613581
      supporting_text: DDX41 protein has ATP-dependent DNA-unwinding activity and ATP-independent strand-annealing
        activity
  notes: >-
    The gene review (genes/human/DDX41) is DRAFT and models the DDX41 cGAS-STING
    role as DNA helicase activity (GO:0003678, core function 2), a sibling of this
    activity's RNA-helicase term under GO:0004386 helicase activity. Marked RELATED
    rather than CONFLICT because the review does not negate RNA helicase activity
    generally; the divergence is specifically the term chosen for the DNA-sensing
    node.
