  notes: >-
    MF GO:0004713 protein tyrosine kinase activity is one level more general than
    the BTK gene review's core GO:0004715 non-membrane spanning protein tyrosine
    kinase activity (MORE_GENERAL, GENERIC_MF); the specific child would be the
    better term. The BTK->DDX41 regulatory role modelled here is accepted in the
    BTK gene review on the strength of PMID:25704810, so the substance is CONSISTENT
    - the only defects are the citation and the generic MF.
