model: gomodel:66c7d41500002413
title: DDX41 activation of the cGAS-STING signaling (Human)
taxon: NCBITaxon:9606
status: DRAFT
summary: >-
  A four-activity model of DDX41 feeding the cGAS-STING DNA-sensing axis: BTK
  (protein tyrosine kinase) activates DDX41 (helicase), which activates the
  STING1 signaling adaptor, which activates the TBK1 kinase driving type I
  interferon production. The STING1 and TBK1 steps are canonical and consistent
  with the gene reviews. Two source defects were found on the upstream half.
  First, both the BTK activity's enabled_by and its causal edge to DDX41 cite
  PMID:34554188, which is a BTK-NLRP3 inflammasome paper that does not mention
  DDX41; the intended reference is almost certainly PMID:25704810, the paper that
  actually reports BTK phosphorylating DDX41 to activate dsDNA/STING binding, and
  which the BTK gene review already cites for this role. Second, the DDX41
  activity is typed GO:0003724 RNA helicase activity, whereas the role this model
  exercises - and the one its own cited paper (PMID:35613581) assays - is
  DNA-preferential unwinding; GO:0003678 DNA helicase activity (the term the DDX41
  gene review binds for exactly this cGAS-STING role) fits better. Recorded as
  queries/repoints, not biology changes: the causal story is sound.
