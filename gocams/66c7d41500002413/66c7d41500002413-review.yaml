    confidence: CONFIRMED
    explanation: >-
      The BTK activity's enabled_by (ECO:0000314) cites PMID:34554188, "BTK
      operates a phospho-tyrosine switch to regulate NLRP3 inflammasome activity".
      Its full cached text does not mention DDX41, cGAS, STING or DNA sensing and
      reports BTK as a regulator of the NLRP3 inflammasome, a different pathway.
      The intended reference is PMID:25704810, "Bruton's tyrosine kinase
      phosphorylates DDX41 and activates its binding of dsDNA and STING to
      initiate type 1 interferon response" - and the model itself already cites
      PMID:25704810 on this same activity's part_of (GO:0141111) and its
      has_input DDX41 edge, so the wrong reference is confined to enabled_by and
      the causal edge. The modelled biology (BTK activating DDX41 in cGAS-STING)
      is correct; only the citation is wrong.
