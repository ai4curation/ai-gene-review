    requested_change: REPOINT
    asserted_value: GO:0003724
    corrected_value: GO:0003678
    corrected_label: DNA helicase activity
    cause: OTHER
    confidence: PROBABLE
    explanation: >-
      This DDX41 activity is typed GO:0003724 RNA helicase activity in a model
      whose biological process is the cGAS-STING cytosolic DNA-sensing pathway
      (GO:0140896). Its single evidence line is PMID:35613581 (ECO:0000314), and
      that paper reports the opposite of RNA helicase activity: recombinant DDX41
      unwinds DNA in an ATP-dependent manner and anneals DNA strands, while it
      could not unwind the tested RNA duplexes (with active DDX43 as a positive
      control). The DDX41 gene review already repoints the same term, evidence
      code and reference (GO:0003724 / IDA / PMID:35613581) to GO:0003678 DNA
      helicase activity for this reason, and DDX41's core functions carry RNA
      binding (GO:0003723) and DNA helicase activity, with every RNA-helicase row
      marked UNDECIDED or MODIFY-away. GO:0003678 is therefore the term the cited
      evidence supports for this node.
    supported_by:
    - reference_id: PMID:35613581
      supporting_text: DDX41 protein has ATP-dependent DNA-unwinding activity and ATP-independent strand-annealing
        activity
    - reference_id: PMID:35613581
      supporting_text: could not unwind these substrates
  notes: >-
    Consistency RELATED: the DDX41 gene review represents this same cGAS-STING
    role as DNA helicase activity (GO:0003678), a sibling of this activity's
    RNA-helicase term under GO:0004386 helicase activity, and asserts no positive
    RNA helicase activity for DDX41. Verdict stays UNCERTAIN because the activity
    as modelled uses the term the gene review repoints.
