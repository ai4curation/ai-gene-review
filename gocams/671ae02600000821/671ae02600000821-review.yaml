model: gomodel:671ae02600000821
title: Release of sequestered calcium ion into cytosol by ITPR1 upon 1D-myo-inositol
  1,4,5-trisphosphate binding (Human)
taxon: NCBITaxon:9606
status: COMPLETE
summary: >-
  A single-activity human IP3-receptor model: ER-membrane ITPR1 enables
  inositol 1,4,5-trisphosphate-gated calcium channel activity, uses IP3 as a
  small-molecule activator, and transports calcium from the ER lumen to the
  cytoplasm as part of sequestered calcium release.
activity_reviews:
  - activity_id: gomodel:671ae02600000821/671ae02600000822
    gene_product: UniProtKB:Q14643
    molecular_function: GO:0005220
    biological_process: GO:0051209
    cellular_component: GO:0005789
    verdict: OK
    consistency: CONSISTENT
    gene_review: file:human/ITPR1/ITPR1-ai-review.yaml
    supporting_text: >-
      Using cell types expressing predominantly type-1, -2 or -3 InsP(3) receptors,
      we show that InsP(3)-evoked Ca(2+) mobilization from each is similarly
      inhibited by calmodulin
    evidence:
      - source_id: PMID:10620513
        statement: >-
          ITPR1 supports IP3-evoked calcium mobilization, and the model's ER-lumen
          calcium input and cytoplasmic calcium output instantiate the channel's
          release activity.
        supporting_text: >-
          Using cell types expressing predominantly type-1, -2 or -3 InsP(3) receptors,
          we show that InsP(3)-evoked Ca(2+) mobilization from each is similarly
          inhibited by calmodulin
      - source_id: PMID:7852357
        statement: >-
          This abstract-only record is the GO-CAM's sole cited source for the
          ER-membrane assertion; the visible abstract reports a C-terminal
          topology result, so the ER-membrane IDA itself rests on full text not
          available in the local cache.
        supporting_text: >-
          A site-specific anti-IP3R antibody was used to localize the carboxyl
          terminus of the IP3R to the cytoplasm in T cells
      - source_id: PMID:27108798
        statement: >-
          Immunofluorescence of human lymphoblastoid cells independently
          corroborates ITPR1 localization to the smooth ER.
        supporting_text: >-
          As expected, punctate perinuclear staining was seen in both control
          and mutant cell lines consistent with known localization to the smooth
          endoplasmic reticulum
      - source_id: PMID:36376291
        statement: >-
          Structural work on IP3R1 treats IP3Rs as ER-membrane calcium channels
          that release ER calcium in response to IP3 and calcium.
        supporting_text: >-
          Inositol-1,4,5-trisphosphate receptors (IP3Rs) are ubiquitous Ca2+
          channels predominantly localized to the endoplasmic reticulum (ER)
          membranes
    source_defects:
      - defect_type: WRONG_TERM
        resource: GO_CAM
        record: gomodel:671ae02600000821/671ae02600000822
        slot: part_of
        requested_change: REPOINT
        asserted_value: GO:0051209
        corrected_value: GO:1903514
        corrected_label: release of sequestered calcium ion into cytosol by endoplasmic
          reticulum
        confidence: PROBABLE
        explanation: >-
          The ITPR1 activity releases calcium from the ER lumen to the
          cytoplasm, as shown by the model's input calcium molecule located in
          GO:0005788 and its cytoplasmic output calcium molecule. Because
          GO:1903514 exactly captures ER-to-cytosol release and is used by the
          aligned module and the local ITPR1 core function, the model's broader
          GO:0051209 process should be refined.
      - defect_type: WRONG_TERM
        resource: GO_CAM
        record: gomodel:671ae02600000821/671ae02600000956
        slot: located_in
        requested_change: REPOINT
        asserted_value: GO:0005737
        corrected_value: GO:0005829
        corrected_label: cytosol
        confidence: PROBABLE
        explanation: >-
          The output calcium molecule is located in GO:0005737 cytoplasm even
          though the activity is typed with GO:0051209 release of sequestered
          calcium ion into cytosol and the aligned module represents the
          product as cytosolic calcium. Repointing the molecule to GO:0005829
          cytosol would make the molecule flow match the process.
    notes: >-
      The molecular function and ER-membrane location match ITPR1's first local
      core function and the IP3-receptor annoton in
      modules/er_calcium_store_cycling.yaml. The model's GO:0051209 process and
      the output calcium's GO:0005737 location are broader than the
      module-aligned ER-to-cytosol event and should be repointed to GO:1903514
      and GO:0005829 respectively; the activity already has ER-lumen calcium as
      input, so these two changes would make the molecule flow exactly match the
      process. The
      RO:0012001 relation to 1D-myo-inositol 1,4,5-trisphosphate correctly
      represents IP3 as a small-molecule activator rather than as transported
      cargo; it is currently asserted by ISS from rat RGD:2933, while
      PMID:10620513 would support a direct human evidence upgrade. This activity
      was already pinned to the module's ITPR1 annoton; the
      module association now uses the cached GO-CAM title and describes the
      reviewed transport event.
