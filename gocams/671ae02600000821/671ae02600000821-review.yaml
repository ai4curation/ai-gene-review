model: gomodel:671ae02600000821
title: Release of sequestered calcium ion into cytosol by ITPR1 upon 1D-myo-inositol
  1,4,5-trisphosphate binding (Human)
taxon: NCBITaxon:9606
status: COMPLETE
summary: >-
  A single-activity human IP3-receptor model: ER-membrane ITPR1 enables
  inositol 1,4,5-trisphosphate-gated calcium channel activity, uses IP3 as a
  small-molecule activator, and transports calcium from the ER lumen to the
  cytoplasm as part of sequestered calcium release.
activity_reviews:
  - activity_id: gomodel:671ae02600000821/671ae02600000822
    gene_product: UniProtKB:Q14643
    molecular_function: GO:0005220
    biological_process: GO:0051209
    cellular_component: GO:0005789
    verdict: OK
    consistency: CONSISTENT
    gene_review: file:human/ITPR1/ITPR1-ai-review.yaml
    supporting_text: >-
      Using cell types expressing predominantly type-1, -2 or -3 InsP(3) receptors,
      we show that InsP(3)-evoked Ca(2+) mobilization from each is similarly
      inhibited by calmodulin
    evidence:
      - source_id: PMID:10620513
        statement: >-
          ITPR1 supports IP3-evoked calcium mobilization, and the model's ER-lumen
          calcium input and cytoplasmic calcium output instantiate the channel's
          release activity.
        supporting_text: >-
          Using cell types expressing predominantly type-1, -2 or -3 InsP(3) receptors,
          we show that InsP(3)-evoked Ca(2+) mobilization from each is similarly
          inhibited by calmodulin
      - source_id: PMID:7852357
        statement: >-
          The human type-1 IP3 receptor belongs to the intracellular
          calcium-release channel family.
        supporting_text: >-
          Inositol 1,4,5-trisphosphate receptors (IP3R) are intracellular calcium
          release channels involved in diverse signaling pathways
    notes: >-
      The molecular function and ER-membrane location match ITPR1's first local
      core function and the IP3-receptor annoton in
      modules/er_calcium_store_cycling.yaml. The model's GO:0051209 process is
      broader than the module's ER-specific GO:1903514 process, but the same
      activity explicitly has ER-lumen calcium as input and cytoplasmic calcium
      as output, so its molecule flow supplies the ER-to-cytoplasm context. The
      RO:0012001 relation to 1D-myo-inositol 1,4,5-trisphosphate correctly
      represents IP3 as a small-molecule activator rather than as transported
      cargo. This activity was already pinned to the module's ITPR1 annoton; the
      module association now uses the cached GO-CAM title and describes the
      reviewed transport event.
references:
  - id: PMID:10620513
    title: Ca2+-calmodulin inhibits Ca2+ release mediated by type-1, -2 and -3
      inositol trisphosphate receptors.
  - id: PMID:7852357
    title: The human type 1 inositol 1,4,5-trisphosphate receptor from T lymphocytes.
      Structure, localization, and tyrosine phosphorylation.
notes: >-
  Reviewed against genes/human/ITPR1/ITPR1-ai-review.yaml and
  modules/er_calcium_store_cycling.yaml. The cached model is a one-step slice
  of that module's IP3 receptor branch, not a standalone ER/SR calcium-cycle
  model; the surrounding module covers the paralog alternatives, RYR channels,
  SERCA re-uptake and optional regulators.
