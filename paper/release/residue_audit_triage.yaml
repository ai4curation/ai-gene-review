# Manual triage of the rows flagged by scripts/audit_residue_claims.py
# (prose asserts loss of a catalytic/active-site residue; the protein's own UniProt record
# annotates an ACT_SITE by sequence analysis or experiment; the review has no structured
# residue_claims). Positions are in each protein's own numbering, sequence version 1, read
# from genes/<ORG>/<GENE>/<GENE>-uniprot.txt. Kinase positions were located by matching the
# canonical subdomain VI-B (HRD) and VII (DFG) motifs, not by a full alignment to an anchor.
audit_date: 2026-11-18
flagged_rows: 8
flagged_genes: 6
verdict_summary:
  claim_correct: 2        # LYK4, NFP
  not_a_loss_claim: 4     # engineered mutations or a negated statement
  intact_site_error: 0
cases:
  - gene: ARATH/FRK1
    accession: O64483
    verdict: not_a_loss_claim
    note: Text says there is "no evidence of loss of catalytic residues"; the pattern matched a negation.
  - gene: LAMBD/A
    accession: P03708
    verdict: not_a_loss_claim
    note: Describes engineered substitutions of the catalytic Glu179 that abolish ATPase activity.
  - gene: human/PTPRN2
    accession: Q92932
    verdict: not_a_loss_claim
    note: Describes activity lost on mutation of the catalytic cysteine.
  - gene: yeast/GRE3
    accession: P38715
    verdict: not_a_loss_claim
    note: Describes the engineered Y49F substitution of the catalytic tyrosine.
  - gene: ARATH/LYK4
    accession: O64825
    rows: [GO:0004672, GO:0004674, GO:0106310]
    verdict: claim_correct
    residues:
      - role: catalytic-loop aspartate (HRD), the residue UniProt annotates as ACT_SITE
        position: 467
        residue: D
        status: RETAINED
      - role: Mg2+-binding aspartate of the DFG motif
        position: 485
        residue: S
        context: AKIGSLGSA (canonical AKIADFGLA)
        status: LOST
    note: >-
      "Lacks key catalytic residues" holds: the DFG aspartate is replaced by serine. The flag
      fired because UniProt's ACT_SITE marks the retained HRD aspartate, a different residue.
  - gene: MEDTR/NFP
    accession: Q0GXS4
    rows: [GO:0004672]
    verdict: claim_correct
    residues:
      - role: catalytic-loop aspartate (HRD), the residue UniProt annotates as ACT_SITE
        position: 435
        residue: D
        status: RETAINED
      - role: Mg2+-binding aspartate of the DFG motif
        position: 453
        residue: N
        context: AKIANFGMA (canonical AKIADFGLA)
        status: LOST
    note: >-
      "Lacks conserved catalytic residues" holds: the DFG aspartate is replaced by asparagine.
      As for LYK4, UniProt's ACT_SITE marks the retained HRD aspartate.
follow_up: >-
  Done: the LYK4 and NFP arguments are recorded as structured residue claims (RETAINED HRD
  Asp, LOST DFG Asp) on their kinase-activity rows, positions confirmed by archived global
  pairwise alignments to CERK1 (A8R7E6) in each gene's -bioinformatics folder, which match the
  motif-located positions above. All checks pass, including the new alignment_file check.
