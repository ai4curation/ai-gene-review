% TeX4ht configuration for the phone-friendly HTML build (scripts/build_html.sh).
\Preamble{xhtml,html5,charset=utf-8}
\Configure{@HEAD}{\HCode{<meta name="viewport" content="width=device-width, initial-scale=1" />\Hnewline}}
\Css{html{background:\#fbfbfa;}}
\Css{body{max-width:44em;margin:0 auto;padding:12px 16px 48px;font-family:Georgia,"Times New Roman",serif;font-size:17px;line-height:1.55;color:\#1f2328;background:\#fbfbfa;}}
\Css{h1,h2,h3,h4,.titleHead,.sectionHead,.subsectionHead,.likesubsectionHead{font-family:-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.25;}}
\Css{.titleHead{font-size:1.5em;font-weight:700;margin:1em 0 .5em;}}
\Css{img.fig{display:block;max-width:100\%;height:auto;margin:.5em auto;background:\#fff;}}
\Css{div.tabular,table.tabular{display:block;overflow-x:auto;max-width:100\%;}}
\Css{table.tabular td{padding:2px 6px;font-size:.8em;white-space:nowrap;}}
\Css{.figure,.table{margin:1.2em 0;border-top:1px solid \#ddd;padding-top:.6em;}}
\Css{.caption{font-size:.9em;color:\#444;text-align:left;}}
\Css{div.caption,div.center{text-align:left;}}
\Css{code,.ectt-1000,.cmtt-10{font-size:.9em;word-break:break-word;}}
\Css{a{color:\#1a5fb4;}}
\begin{document}
\EndPreamble
