  review:
    action: KEEP_AS_NON_CORE
    summary: Human DNMT3A is recruited to MYC target promoters through a MYC
      interaction. This is a context-specific way the enzyme is recruited.
    reason: Binding to sequence-specific transcription factors is one way DNMT3A
      is targeted to particular loci. The human MYC interaction is the source.
