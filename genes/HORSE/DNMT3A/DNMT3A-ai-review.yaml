- term:
    id: GO:0106222
    label: lncRNA binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - UniProtKB:O88508
  - ensembl:ENSMUSP00000020991
