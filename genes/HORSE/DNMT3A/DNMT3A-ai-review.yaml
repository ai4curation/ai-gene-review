core_functions:
- description: >-
    De novo DNA cytosine-5 methyltransferase. It methylates CpG sites in
    chromatin and silences CpG-island promoters and other targets. In this
    exon-skipped horse model, the catalytic domain, ADD domain and
    tetramerization interface are retained, but PWWP-guided heterochromatin
    targeting is probably compromised.
