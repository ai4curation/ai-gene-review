  - ensembl:ENSP00000324375
  review:
    action: UNDECIDED
    summary: The lncRNA partners in human and mouse are specific RNAs, and
      neither has been shown to have a horse counterpart.
    reason: In human, the RNA partner is the PTENpg1 antisense RNA from a
      pseudogene. In mouse, it is the Dum lncRNA. The RNA-binding region of
