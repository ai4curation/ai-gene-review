suggested_questions:
- question: >-
    Is the exon-9-skipping DNMT3A transcript (ENSECAT00000098563) expressed in
    horse tissues? If so, does the resulting PWWP-truncated product lose
    pericentric-heterochromatin targeting while staying catalytically active?
suggested_experiments:
- description: >-
    Use RT-PCR across exons 8-10 of horse DNMT3A in testis and somatic tissues to
    measure exon-9 inclusion. Then compare the localization of GFP-tagged full-length
    and exon-9-skipped horse DNMT3A, and their major-satellite methylation, in
    Dnmt3a/3b-deficient ES cells.
