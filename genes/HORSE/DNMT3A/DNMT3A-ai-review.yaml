- term:
    id: GO:0106363
    label: protein-cysteine methyltransferase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: enables
  supporting_entities:
  - UniProtKB:O88508
  - ensembl:ENSMUSP00000020991
  review:
    action: KEEP_AS_NON_CORE
    summary: Methylation of its own catalytic cysteine is a side reaction that
      DNA substrate suppresses.
    reason: Mouse Dnmt3a slowly methylates its own active-site cysteine in
      DNA-free assays. The reaction is not seen when CpG DNA is present. The
      catalytic cysteine is conserved in horse (C671), so the capacity should
      transfer. A physiological protein-methylation role has not been
      established, so this is kept as non-core.
    supported_by:
    - reference_id: PMID:21481189
      supporting_text: 'In the presence of CpG containing dsDNA, which is the natural

        substrate for Dnmt3a, the transfer of the methyl group from AdoMet to the

        flipped target base was preferred and auto-methylation was not detected.'
- term:
    id: GO:0141196
    label: transposable element silencing by piRNA-mediated DNA methylation
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:O88508
  - ensembl:ENSMUSP00000020991
  review:
    action: KEEP_AS_NON_CORE
    summary: In the male germline, DNMT3A catalyzes de novo methylation of
      transposons targeted by piRNAs. This is a developmental use of its core
      activity.
    reason: In this process, DNMT3A writes the methylation that piRNA pathways
      direct, so it participates rather than merely being required. The
      ortholog data come from mouse male germ cells, and the catalytic domain is
      fully conserved in horse. Horse has no rodent-specific DNMT3C, which does
      not argue against a DNMT3A contribution. Whether this splice form is made
      in horse germ cells is unknown. The row is kept as non-core, matching the
      human review.
    supported_by:
    - reference_id: PMID:38705424
      supporting_text: 'Immunofluorescence of DNMT1, DNMT3a and DNMT3b on

        testis samples confirmed the differential expression and localization of these

        three DNA methylation transferases during horse development.'
    - reference_id: file:HORSE/DNMT3A/DNMT3A-bioinformatics/RESULTS-rereview.md
      supporting_text: The catalytic PC-motif cysteine (human C710 -> horse C671), ENV-motif E756 -> E717, the CpG-recognition TRD R836 -> R797 and the tetramer-interface R882 -> R843 are all conserved.
