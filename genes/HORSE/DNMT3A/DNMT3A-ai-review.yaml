      in this splice model. In mouse, promoter and other non-satellite targets
      were still methylated by PWWP-disrupted Dnmt3a.
    supported_by:
    - reference_id: PMID:23042785
      supporting_text: "DNMT3A \nrecruitment is increased, with hypermethylation being associated with\
        \ silencing \nof gene expression."
    - reference_id: PMID:15456878
      supporting_text: The observation that these mutant proteins efficiently methylate other genomic sequences
        indicates that the PWWP domains are not required for enzymatic activities but are involved in functional
        specialization.
