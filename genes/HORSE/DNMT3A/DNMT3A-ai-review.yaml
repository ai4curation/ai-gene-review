id: A0A9L0TK01
gene_symbol: DNMT3A
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9796
  label: Equus caballus
description: >-
  DNMT3A is a de novo DNA cytosine-5 methyltransferase. It uses
  S-adenosyl-L-methionine to methylate CpG (and to a lesser extent non-CpG)
  cytosines in DNA, establishing methylation patterns that silence promoters,
  CpG islands, repeats and germline loci. It acts in the nucleus on chromatin
  as an oligomer, alone or together with the non-catalytic partner DNMT3L. An
  ADD domain reads unmethylated histone H3K4 and relieves autoinhibition of the
  catalytic domain, and a PWWP domain reads H3K36me2/3 and targets the enzyme to
  intergenic and pericentric heterochromatin. This horse entry, A0A9L0TK01, is
  an exon-skipping splice model of the horse gene (873 aa). It lacks the
  36-residue exon that corresponds to human residues 339-374, inside the PWWP
  region, but it retains the full ADD domain and the full catalytic domain with
  all of its catalytic and CpG-recognition residues. Methyltransferase activity
  is therefore expected to be intact. PWWP-dependent heterochromatin targeting
  is probably lost.
