  review:
    action: ACCEPT
    summary: The retained DNMT3A catalytic machinery supports gene-expression regulation.
    reason: The ADD and methyltransferase domains are conserved, supporting targeted DNA methylation and
      transcriptional effects. A PWWP deletion can change genomic targeting without eliminating the broad
      regulatory function.
    supported_by: &id012
