taxon:
  id: NCBITaxon:9796
  label: Equus caballus
description: DNMT3A is a conserved de novo DNA cytosine-5 methyltransferase associated with nuclear chromatin
  and gene-expression regulation. The selected horse model retains the ADD and catalytic domains but lacks
  a segment overlapping the end of the PWWP chromatin-reader domain, leaving its normal histone-guided
  genomic targeting uncertain. DNMT3A expression has been measured during horse testis development.
