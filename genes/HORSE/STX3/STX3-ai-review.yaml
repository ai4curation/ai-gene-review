core_functions:
- description: Plasma-membrane Qa-SNARE (t-SNARE) that assembles trans-SNARE complexes with R-SNAREs and SNAP-family Qbc-SNAREs to fuse transport vesicles with the plasma membrane. This mediates apical cargo exocytosis in polarized epithelia and regulated postsynaptic AMPA-receptor exocytosis in neurons.
  molecular_function:
    id: GO:0005484
    label: SNAP receptor activity
  directly_involved_in:
  - id: GO:0006906
    label: vesicle fusion
  - id: GO:0006887
    label: exocytosis
  - id: GO:0098967
    label: exocytic insertion of neurotransmitter receptor to postsynaptic membrane
  locations:
  - id: GO:0005886
    label: plasma membrane
  in_complex:
    id: GO:0031201
    label: SNARE complex
  supported_by:
  - reference_id: PMID:24726755
    supporting_text: STX3 is an apical receptor involved in membrane fusion of apical vesicles in enterocytes.
  - reference_id: PMID:23395379
    supporting_text: Together, these results identify critical roles for syntaxin-3, SNAP-47 and synaptobrevin-2 as components of a unique postsynaptic SNARE-mediated vesicle fusion machinery that is required for the delivery of AMPARs to the plasma membrane during LTP.
  - reference_id: file:HORSE/STX3/STX3-bioinformatics/RESULTS.md
    supporting_text: 'A0A3Q2H352 is 289 residues and carries the complete syntaxin architecture: the N-terminal Habc region, the SNARE motif and a C-terminal transmembrane anchor.'
