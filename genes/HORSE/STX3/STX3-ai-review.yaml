id: A0A3Q2H352
gene_symbol: STX3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9796
  label: Equus caballus
description: Syntaxin-3 is a tail-anchored Qa-SNARE (t-SNARE) of the plasma membrane. It has an N-terminal peptide and three-helix Habc regulatory domain that bind Sec1/Munc18 proteins, a SNARE motif, and a C-terminal transmembrane anchor. By zippering with an R-SNARE (VAMP7 or synaptobrevin-2) and SNAP-family Qbc-SNAREs into a four-helix SNARE complex, it drives fusion of transport vesicles with the plasma membrane. In polarized epithelia such as enterocytes it is the apical t-SNARE for selective apical exocytosis of cargo such as NHE3, CFTR and GLUT5. Loss in humans causes microvillus inclusion disease. In neurons it mediates regulated postsynaptic exocytosis of AMPA receptors during long-term potentiation. In photoreceptors it is required for trafficking of outer-segment membrane proteins (rhodopsin, PRPH2/ROM1) and is enriched at ribbon synapses. Alternative splicing yields 3A and 3B forms that differ in the C-terminal half of the SNARE motif and the anchor. This horse product (Ensembl model, 289 aa) carries the 3B-type (exon 9B) SNARE segment joined to the 3A-type (exon 10A) membrane anchor.
