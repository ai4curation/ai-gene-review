- question: Is the exon-9B/exon-10A combination encoded by the horse Ensembl model A0A3Q2H352 an expressed transcript (e.g., in horse retina), or a gene-model artefact that should be split into canonical STX3A (9A/10A) and STX3B (9B/10B) products?
suggested_experiments:
