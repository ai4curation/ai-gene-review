      are male sterile, with loss of spermatogonia or meiotic arrest.'
    action: KEEP_AS_NON_CORE
    reason: The orthology is sound (same SF3 subfamily, 95.3% identity to mouse), and a transcription factor that
      is needed in spermatogonia and spermatocytes for expression of germline genes is reasonably said to act in
