taxon:
  id: NCBITaxon:9796
  label: Equus caballus
description: FOXJ3 (forkhead box J3) is a forkhead/winged-helix transcription factor of the FOXJ2/FOXJ3 subfamily.
  Its N-terminal fork-head domain binds forkhead consensus sites in cis-regulatory DNA, and the protein acts in
  the nucleus as an activator of RNA polymerase II transcription; the long C-terminal region is largely disordered
  and low-complexity. In mouse, Foxj3 activates the muscle enhancer of Mef2c, contributing to slow-twitch (type
  I) fiber identity and muscle regeneration, and it is needed in male germ cells for spermatogonial survival and
  for expression of meiotic genes in spermatocytes. The horse protein (623 aa) is a full-length ortholog, 98.1%
  identical to human FOXJ3, with a fully conserved fork-head domain.
