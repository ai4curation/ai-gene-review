- term:
    id: GO:0007141
    label: male meiosis I
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q8BUR3
  - ensembl:ENSMUSP00000035746
  review:
    summary: 'Ensembl Compara transfer from mouse Foxj3 (IMP, PMID:27739607): conditional deletion in spermatocytes
      (Stra8-Cre) causes meiotic arrest with reduced transcripts of meiotic genes.'
    action: MARK_AS_OVER_ANNOTATED
    reason: The mouse data show FOXJ3 is necessary for spermatocytes to complete meiosis, and the reported mechanism
      is reduced expression of meiotic genes (Rad51, Dmc1, Hormad1 and others), i.e. FOXJ3 acts upstream as a transcription
      factor rather than doing any step of meiosis I itself. The PAINT curators propagated the DNA-binding and transcription-factor
      terms at PTN002918318 but not the meiosis or spermatogenesis terms, and the result rests on a single knockout
      study (abstract-only in our cache). Not a core function for the horse protein.
    supported_by:
    - reference_id: PMID:27739607
      supporting_text: loss of FOXJ3 in spermatocytes using Foxj3flox/flox , Stra8-Cre mice led to meiotic arrest
    - &id003
      reference_id: PMID:27739607
      supporting_text: survival of spermatogonia and participates in spermatocyte meiosis
