suggested_questions:
- question: Which genes does FOXJ3 directly bind and activate in germ cells, and are the reduced meiotic transcripts
    (Rad51, Dmc1, Hormad1) direct FOXJ3 targets or secondary to arrested development?
- question: Does FOXJ3 regulate Mef2c and slow-fiber identity in non-rodent mammals such as horse, whose muscles
    have a high proportion of type I and IIA fibres?
suggested_experiments:
- description: FOXJ3 ChIP-seq or CUT&RUN in mouse spermatocytes and in skeletal muscle, combined with conditional-knockout
    RNA-seq, to separate direct FOXJ3 targets from secondary effects.
