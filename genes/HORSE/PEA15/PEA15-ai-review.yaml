id: A0A9L0RWM8
gene_symbol: PEA15
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9796
  label: Equus caballus
description: PEA15 (PEA-15/PED) is a small, non-catalytic cytoplasmic phosphoprotein made of an N-terminal
  death-effector domain (DED) and a flexible C-terminal tail. It binds the MAP kinases ERK1 and ERK2
  through a bipartite interface (the DED engages the ERK DEF docking site and the C-terminal tail the
  D-recruitment site), holding them in the cytoplasm and keeping them from nuclear substrates, while
  protecting bound ERK from dephosphorylation so that it is rapidly active when released. Phosphorylation
  of the tail (Ser104 by PKC, Ser116 by CaMKII/Akt) shifts PEA15 between ERK-bound and FADD-bound states.
  Through DED interactions with FADD and caspase-8 it inhibits Fas- and TNFR1-triggered caspase-8 activation
  and extrinsic apoptosis. In mammalian cells it also affects glucose uptake indirectly, by altering
  glucose-transporter trafficking. The horse gene model A0A9L0RWM8 contains the entire 130-residue conserved
  mammalian PEA15 sequence (identical to human) preceded by a predicted 46-residue N-terminal extension
  of unknown significance.
existing_annotations:
- term:
    id: GO:0000165
    label: MAPK cascade
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR029546
  review:
    summary: InterPro2GO mapping from the PEA15-specific DED signature. PEA15 is not a kinase or a cascade
      scaffold; it binds ERK1/2 and controls their localization and activation state, i.e. it regulates
      the ERK1/2 cascade.
    action: MODIFY
    reason: The mammalian experimental work places PEA15 as a regulator of ERK1/2 signalling rather than
      a component that transmits the phosphorylation relay. It binds ERK, blocks ERK nuclear entry and
      ERK-dependent transcription (PMID:11702783), and in the ERK2 complex holds the activation loop in
      an inactive conformation while protecting it from dephosphorylation (PMID:23575685). Its net effect
      can be inhibitory (cytoplasmic retention) or permissive (accumulation of releasable phospho-ERK),
      so the unsigned regulation term GO:0070372 regulation of ERK1 and ERK2 cascade, a regulation term
      for the MAPK cascade subtype it acts on, is the accurate replacement. Transfer to horse is supported
      by membership of PANTHER PTHR48169:SF1 (with human, mouse and rat PEA15) and by 130/130 identity of
      the horse model's conserved core to human PEA15, including the C-terminal ERK-docking segment and
      DED (file:HORSE/PEA15/PEA15-bioinformatics/RESULTS-rereview.md).
    proposed_replacement_terms:
    - id: GO:0070372
      label: regulation of ERK1 and ERK2 cascade
    supported_by:
    - reference_id: PMID:11702783
      supporting_text: PEA-15 can redirect the biological outcome of MAP kinase signaling by regulating
        the subcellular localization of ERK MAP kinase.
    - reference_id: PMID:23575685
      supporting_text: even though ERK bound to PEA-15 is phosphorylated, its activation loop is held
        in an inactive conformation (Fig. 4b) and its nuclear transport is blocked
    - reference_id: file:HORSE/PEA15/PEA15-bioinformatics/RESULTS-rereview.md
      supporting_text: '| C-terminal ERK D-site segment 121-129 | 167-175 | 9/9 |'
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  supporting_entities:
  - UniProtKB-SubCell:SL-0086
  review:
    summary: PEA15 is a soluble cytoplasmic protein; its best-characterized activity is anchoring ERK in
      the cytoplasm.
    action: ACCEPT
    reason: Curated human UniProt localization is cytoplasm, and the mouse/human functional data show that
      PEA15 anchors ERK in the cytoplasm via its nuclear export sequence (PMID:11702783). The NES (human
      residues 7-17) is fully conserved in the horse model (positions 53-63). The predicted N-terminal extension
      has no recognizable signal peptide or transmembrane segment, so nothing argues for a different compartment,
      although its effect on localization is untested. Cytoplasm is the appropriate level; cytosol would
      also be defensible but cytoplasm is accepted as is.
    supported_by:
    - reference_id: file:human/PEA15/PEA15-uniprot.txt
      supporting_text: 'SUBCELLULAR LOCATION: Cytoplasm'
    - reference_id: PMID:11702783
      supporting_text: PEA-15 contains a nuclear export sequence required for its capacity to anchor ERK
        in the cytoplasm.
- term:
    id: GO:0042981
    label: regulation of apoptotic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR001875
  - InterPro:IPR029546
  review:
    summary: Correct but general; PEA15's apoptotic role is specifically inhibition of death-receptor (Fas/TNFR1)
      signalling at the FADD/caspase-8 step.
    action: MODIFY
    reason: The experimental mechanism is DED-dependent interference with FADD-caspase-8 (FLICE) association
      downstream of Fas and TNFR1 (PMID:10442631). The specific descendant GO:1902042 negative regulation
      of extrinsic apoptotic signaling pathway via death domain receptors is already carried by this horse
      protein (ARBA row below) and is the term PAINT propagates at the PEA15 node, so the general term
      is refined to it rather than kept alongside it.
    proposed_replacement_terms:
    - id: GO:1902042
      label: negative regulation of extrinsic apoptotic signaling pathway via death domain receptors
    supported_by:
    - reference_id: PMID:10442631
      supporting_text: 'Thus, PED/PEA-15 is an endogenous protein inhibiting FAS and TNFR1-mediated

        apoptosis.'
- term:
