- term:
    id: GO:0140311
    label: protein sequestering activity
  evidence_type: ISS
  original_reference_id: PMID:11702783
  qualifier: enables
  review:
    summary: PEA15 binds ERK1/2 and anchors them in the cytoplasm, preventing their nuclear localization;
      this is its best-established molecular activity and is not captured by any existing horse annotation.
    action: NEW
    reason: GO:0140311 is defined as binding a protein to inhibit its localization to where it is active,
      which matches NES-dependent cytoplasmic anchoring of ERK by PEA15 (PMID:11702783) and the structural
      basis of ERK2 capture (PMID:23575685). Transfer is by orthology within PANTHER PTHR48169:SF1, with
      the horse conserved core identical to human, including the NES and both ERK-docking surfaces (file:HORSE/PEA15/PEA15-bioinformatics/RESULTS-rereview.md).
      This is a molecular function of the gene product itself, not a downstream phenotype.
    supported_by:
    - reference_id: PMID:11702783
      supporting_text: PEA-15 contains a nuclear export sequence required for its capacity to anchor ERK
        in the cytoplasm.
    - reference_id: PMID:23575685
      supporting_text: even though ERK bound to PEA-15 is phosphorylated, its activation loop is held
        in an inactive conformation (Fig. 4b) and its nuclear transport is blocked
    - reference_id: file:HORSE/PEA15/PEA15-bioinformatics/RESULTS-rereview.md
      supporting_text: '| NES (residues 7-17) | 53-63 | 11/11 |'
- term:
    id: GO:0035877
    label: death effector domain binding
  evidence_type: ISS
  original_reference_id: PMID:10442631
  qualifier: enables
  review:
    summary: The PEA15 DED associates with the DED-containing proteins FADD and caspase-8 (FLICE), the interaction
      through which it blocks death-receptor signalling.
    action: NEW
    reason: Human PEA15 co-precipitates with FADD and FLICE, overexpressed FADD competes with the PEA15-FLICE association only
      when it retains its DED, and the inhibitory effect is attributed to the PEA15 DED (PMID:10442631). The human GOA records
      these interactions only as uninformative protein binding; death effector domain binding states the
      informative activity. The horse DED is identical to human (79/79) within PTHR48169:SF1. Proposed
      as an MF only; no new process term is added.
    supported_by:
    - reference_id: PMID:10442631
      supporting_text: PED/PEA-15-FLICE association was inhibited by overexpression of the wild-type but
        not of a DED-deletion mutant of FADD.
    - reference_id: file:HORSE/PEA15/PEA15-bioinformatics/RESULTS-rereview.md
      supporting_text: '| DED (UniProt FT 3-81) | 49-127 | 79/79 |'
