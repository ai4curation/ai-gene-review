id: A0A9L0RWM8
gene_symbol: PEA15
product_type: PROTEIN
status: IN_PROGRESS
taxon:
  id: NCBITaxon:9796
  label: Equus caballus
description: PEA15 is a death-effector-domain regulatory protein that binds ERK kinases and controls their
  activity and intracellular distribution. It also modulates death-receptor signaling through FADD/caspase-8
  interactions. Mammalian PEA15 regulates glucose uptake through effects on glucose-transporter trafficking
  rather than acting as a membrane transporter. The selected horse protein contains the complete conserved
  human PEA15 sequence with an additional N-terminal extension.
existing_annotations:
- term:
    id: GO:0000165
    label: MAPK cascade
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR029546
  review:
    summary: PEA15 directly modulates ERK MAP kinase signaling.
    action: ACCEPT
    reason: The ERK2–PEA15 structures and biochemical experiments establish direct binding and altered
      kinase conformation/activity. Participation in the MAPK cascade is a supported regulatory role;
      PEA15 need not itself be a kinase.
    supported_by:
    - reference_id: PMID:23575685
      supporting_text: occupying two key docking sites of ERK2
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  supporting_entities:
  - UniProtKB-SubCell:SL-0086
  review:
    summary: Cytoplasmic/cytosolic localization is consistent with PEA15 signaling regulation.
    action: ACCEPT
    reason: PEA15 binds cytoplasmic ERK and regulates its distribution; the soluble death-effector-domain
      architecture and curated localization support this compartment. The selected horse sequence retains
      the entire human core, but its extra N-terminal segment is not assumed to be functionally neutral.
    supported_by:
    - reference_id: file:human/PEA15/PEA15-uniprot.txt
      supporting_text: 'SUBCELLULAR LOCATION: Cytoplasm'
- term:
    id: GO:0042981
    label: regulation of apoptotic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR001875
  - InterPro:IPR029546
  review:
    summary: PEA15 regulates apoptotic signaling through death-effector-domain interactions.
    action: ACCEPT
    reason: Human-cell overexpression and co-precipitation experiments demonstrate inhibition of Fas/TNFR1-dependent
      caspase-8 activation involving FADD. This supports apoptotic regulation; the conserved horse core
      supports transfer of the mechanism.
    supported_by:
    - reference_id: PMID:10442631
      supporting_text: 'Thus, PED/PEA-15 is an endogenous protein inhibiting FAS and TNFR1-mediated

        apoptosis.'
- term:
    id: GO:1902042
    label: negative regulation of extrinsic apoptotic signaling pathway via death domain receptors
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: involved_in
  supporting_entities:
  - ARBA:ARBA00088654
  review:
    summary: PEA15 can inhibit death-receptor-mediated extrinsic apoptosis.
    action: ACCEPT
    reason: The human primary experiment shows protection from FasL and TNFalpha effects and impaired
      FADD–caspase-8 association. This is the specific pathway represented by the annotation. The horse
      protein preserves the human death-effector-domain sequence, although the effect of its N-terminal
      extension has not been measured.
    supported_by:
    - reference_id: PMID:10442631
      supporting_text: 'Thus, PED/PEA-15 is an endogenous protein inhibiting FAS and TNFR1-mediated

        apoptosis.'
