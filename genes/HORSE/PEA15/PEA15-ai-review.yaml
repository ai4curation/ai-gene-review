core_functions:
- description: Binds ERK1/2 through its DED and C-terminal docking segment and retains them in the cytoplasm,
    away from nuclear substrates, while protecting bound phospho-ERK from dephosphorylation; this regulates
    the output of the ERK1/2 cascade.
  molecular_function:
    id: GO:0140311
    label: protein sequestering activity
  directly_involved_in:
  - id: GO:0070372
    label: regulation of ERK1 and ERK2 cascade
  locations:
  - id: GO:0005737
    label: cytoplasm
  supported_by:
  - reference_id: PMID:11702783
    supporting_text: blocks ERK-dependent transcription and proliferation by binding ERKs and preventing
      their localization in the nucleus
  - reference_id: PMID:23575685
    supporting_text: occupying two key docking sites of ERK2
- description: Uses its death-effector domain to engage FADD and caspase-8 at death receptors, reducing
    FADD-caspase-8 association and caspase-8 activation and thereby inhibiting Fas/TNFR1-induced extrinsic
    apoptosis.
  molecular_function:
    id: GO:0035877
    label: death effector domain binding
  directly_involved_in:
