    label: negative regulation of extrinsic apoptotic signaling pathway via death domain receptors
  locations:
  - id: GO:0005737
    label: cytoplasm
  supported_by:
  - reference_id: PMID:10442631
    supporting_text: PED/PEA-15 co-precipitated with both FADD and FLICE.
suggested_questions:
- question: Is the predicted 46-residue N-terminal extension of horse A0A9L0RWM8 (and the 9-residue extension
    of F7AD02) translated in horse tissues, or are these gene-model artifacts from upstream in-frame ATGs/alternative
    5' exons, with the native product starting at the conserved MAEY Met (position 47)?
- question: If the extension is translated, does it alter PEA15 NES-dependent ERK sequestration or the
    N-terminal PLD1-binding surface (human residues 1-24)?
suggested_experiments:
- description: N-terminal proteomics or western blotting of horse astrocyte/brain lysate with a PEA15
    antibody to determine whether the native protein is ~15 kDa (130 aa) or ~20 kDa (176 aa).
  experiment_type: proteomics
