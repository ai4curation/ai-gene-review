gene_symbol: PEA15
taxon:
  id: NCBITaxon:9796
  label: Equus caballus
status: COMPLETE
description: PEA15 is a non-catalytic DED-containing cytoplasmic protein that anchors ERK1/2 and inhibits
  death-receptor-induced apoptosis. In mammalian cells it regulates glucose-transporter trafficking indirectly,
  through phospholipase D1 and PKC-alpha signalling, so the single ProtNLM2 carbohydrate-transport prediction
  for the horse protein remains uncertain.
