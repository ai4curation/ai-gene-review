  review:
    assessment: UNC
    confidence_score: 1
    summary: The horse gene model carries the complete human PEA15 core at 100% identity (with a 46-residue
      N-terminal extension) in PANTHER subfamily PTHR48169:SF1, so human PEA15 evidence transfers to it.
      That evidence shows PEA15 regulates glucose transport rather than performing it. Overexpressed human
      PEA15 in L6 myotubes raises surface GLUT1 and inhibits insulin-stimulated glucose transport and GLUT4
      recruitment, and this effect is mediated indirectly through PEA15 binding to the phospholipase D1
      D4 domain and the consequent increase in PKC-alpha activity. The human gene review keeps only the
      regulatory term GO:0046325 (negative regulation of D-glucose import across plasma membrane), as non-core,
      and notes that PEA15 has no transporter activity; the horse GOA set has no carbohydrate-transport
      or glucose-import term. GO:0008643 asserts participation in directed carbohydrate movement, and a
      regulation term is not an is_a descendant of the regulated process, so the existing regulatory evidence
      neither supports nor overlaps the prediction. PEA15 is not shown to take part in the transport step
      itself, but no evidence directly excludes a participatory role, so the prediction remains uncertain
      rather than refuted.
    supported_by:
    - reference_id: PMID:9670003
      supporting_text: 'Transfection of PED/PEA-15 in

        differentiating L6 skeletal muscle cells increases the content of Glut1

        transporters on the plasma membrane and inhibits insulin-stimulated glucose

        transport and cell-surface recruitment of Glut4'
    - reference_id: PMID:18541525
      supporting_text: PED/PEA-15 overexpression impairs insulin regulation of glucose transport, and this
        is mediated by its interaction with the C-terminal D4 domain of phospholipase D1 (PLD1) and the consequent
        increase of protein kinase C-alpha activity
    - reference_id: file:HORSE/PEA15/PEA15-bioinformatics/RESULTS.md
      supporting_text: Global alignment of cached UniProt sequences gives **130/130 identical paired residues
        (100.0%)**.
