description: EFR3A-family protein with a strongly conserved downstream scaffold region. The selected horse
  sequence lacks the N-terminal cysteine cluster used by mammalian EFR3 proteins for palmitoylation-dependent
  plasma-membrane anchoring, making the localization and membrane-recruitment function of this protein
  form uncertain.
