suggested_questions:
- question: Does the horse EFR3A locus encode a product that begins with the metazoan-conserved
    N-terminal Cys-rich motif? The selected 796-residue model begins MIDKDGLVKA, aligning to
    human residue 29 onward, so the entire palmitoylation motif (human Cys6-Cys9) is absent
    - and that motif is what anchors the protein to the plasma membrane.
  experts: []
- question: If a leaderless short form is genuinely expressed in horse, does it still assemble
    with PI4KA, TTC7 and HYCC? The downstream HEAT/ARM scaffold is 98% identical, so complex
    assembly and membrane anchoring may dissociate in this protein form.
  experts: []
- question: Human EFR3A has three annotated splice isoforms and EFR3B is a paralog with its
    own Cys motif. Could the equine short form correspond to an alternative first exon rather
    than to the canonical product?
  experts: []
suggested_experiments:
- hypothesis: The equine EFR3A locus produces a transcript encoding the conserved N-terminal
    Cys-rich motif, and A0A9L0S4L8 reflects an incorrect translation start rather than a non-palmitoylated
    equine product.
  description: 5-prime RACE plus long-read sequencing of EFR3A transcripts from horse brain
    and another EFR3A-expressing tissue to establish the translation start and first-exon structure;
    rerun the paired alignment in EFR3A-bioinformatics on the corrected sequence.
  experiment_type: transcript 5-prime mapping / gene-model validation
- hypothesis: The selected horse form fails to reach the plasma membrane because it lacks the
    palmitoylation motif, while a motif-bearing equine form localizes normally.
  description: Express tagged versions of the selected 796-residue sequence and of a motif-restored
    equine form in a mammalian cell line; score plasma-membrane versus cytosolic distribution
    by confocal imaging and test palmitoylation directly by bioorthogonal metabolic labeling,
    using human EFR3A and its C6S/C7S/C8S/C9S mutant as the positive and negative controls
    established in PMID:23229899.
  experiment_type: palmitoylation labeling and localization assay
- hypothesis: Membrane anchoring and complex assembly are separable - the conserved scaffold
    binds TTC7 and PI4KA even in a form that cannot be palmitoylated.
  description: Co-immunoprecipitate tagged horse EFR3A forms against TTC7A/TTC7B, PI4KA and
    HYCC1/HYCC2, and assay plasma-membrane PtdIns4P in human EFR3A-depleted cells complemented
    with each form, so that binding and functional recruitment are scored independently.
  experiment_type: complex assembly and functional complementation
references:
- id: GO_REF:0000120
  title: Combined Automated Annotation using Multiple IEA Methods
  findings:
  - statement: The plasma-membrane annotation on this horse record is produced by combined
      automated IEA pipelines (here an ARBA rule plus the UniProt subcellular-location keyword
      mapping), not by any equine observation, so it inherits whatever the rule conditions
      assert about the family.
    supporting_text: Combined Automated Annotation using Multiple IEA Methods
    reference_section_type: DATABASE_ENTRY
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Procedural GO reference for combined automated annotation. Correctly applied
      at the family level; it is a rule-based mapping rather than evidence, which is why the
      annotation it produced is left UNDECIDED for a model missing the anchoring motif.
- id: file:HORSE/EFR3A/EFR3A-uniprot.txt
  title: 'UniProtKB A0A9L0S4L8: selected horse EFR3A protein model'
  findings:
  - statement: The horse EFR3A entry is an unreviewed 796-residue TrEMBL record whose protein
      name is assigned by an ARBA automated annotation rule, with no equine experimental characterization.
    supporting_text: 'RecName: Full=Protein EFR3 homolog A {ECO:0000256|ARBA:ARBA00072621};'
    reference_section_type: DATABASE_ENTRY
  - statement: The record's sequence begins MIDKDGLVKA, which corresponds to human Q14156 residue
      29 onward; the human N-terminal segment MPTRVCCCCS, containing the Cys6-Cys9 palmitoylation
      cluster, has no counterpart in this model.
    supporting_text: MIDKDGLVKA DMEKLTFYAV SAPEKLDRIG SYLAERLSRD
    reference_section_type: DATABASE_ENTRY
  - statement: The downstream EFR3-like ARM/HEAT repeat architecture is detected intact, which
      is what secures family identity independently of the missing N-terminus.
    supporting_text: 'InterPro; IPR049152; EFR3-like_ARM.'
    reference_section_type: DATABASE_ENTRY
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Source record for the reviewed protein form. Naming is ARBA rule-based and
      domain assignment is InterPro/Pfam-based; together they establish family identity but
      no equine function, and they do not adjudicate the missing N-terminal motif. The sequence
      start quoted here is the direct basis for the review's claim about the absent Cys cluster.
- id: file:human/EFR3A/EFR3A-uniprot.txt
  title: 'UniProtKB Q14156: human EFR3A (curated reference ortholog)'
  findings:
  - statement: Human EFR3A is a component of the complex that localizes phosphatidylinositol
      4-kinase to the plasma membrane, and within that complex it is specifically the membrane-anchoring
      component - so losing the anchor is losing its assigned role, not a peripheral feature.
    supporting_text: 'FUNCTION: Component of a complex required to localize'
    reference_section_type: DATABASE_ENTRY
  - statement: The complex is PI4KA plus EFR3 (EFR3A or EFR3B), TTC7 (TTC7A or TTC7B) and HYCC
      (HYCC1 or HYCC2), giving the specific partners an equine assembly test would need to
      score.
    supporting_text: composed of PI4KA, EFR3 (EFR3A or EFR3B), TTC7 (TTC7A or TTC7B) and
    reference_section_type: DATABASE_ENTRY
  - statement: Plasma-membrane residence is a lipid-anchor localization, with a small cytosolic
      pool also observed; palmitoylation is what anchors the protein.
    supporting_text: 'PTM: Palmitoylated at its N-terminus, anchoring the protein to the'
    reference_section_type: DATABASE_ENTRY
  - statement: Human EFR3A has three annotated splice isoforms, a further reason to treat a
      divergent N-terminus in another species as a transcript-model question rather than as
      demonstrated loss of anchoring.
    supporting_text: Event=Alternative splicing; Named isoforms=3;
    reference_section_type: DATABASE_ENTRY
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Curated Swiss-Prot record for the human ortholog, with experimental ECO codes
      on the localization and palmitoylation annotations. Used as the source of characterized
      mammalian biology under consideration for transfer; the membrane-anchoring role is what
      makes the missing N-terminal motif consequential rather than incidental.
- id: file:HORSE/EFR3A/EFR3A-bioinformatics/RESULTS.md
  title: "EFR3A: horse\u2013human sequence comparison"
  findings:
  - statement: Over the paired region the horse and human proteins are near-identical (98.24%
      across 796 residues), with the whole horse sequence paired and roughly 25 human residues
      unpaired - so the difference is confined to one end rather than distributed.
    supporting_text: The horse sequence A0A9L0S4L8 (796 residues) aligns to human Q14156 (821
      residues) with 98.24% identity across 796 paired residues. Paired coverage is 96.95%
      of the human sequence and 100.0% of the horse sequence.
    reference_section_type: RESULTS
  - statement: The comparison explicitly declines to establish one-to-one orthology or to verify
      the sequence that was supplied to the prediction pipeline, so the truncation is recorded
      as a model limitation rather than a demonstrated equine difference.
    supporting_text: This establishes sequence conservation between the selected pair; it does
      not independently establish one-to-one orthology or verify the sequence supplied to ProtNLM.
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Reproducible Biopython global alignment (match 2, mismatch -1, gap open -10,
      extension -0.5) with retained sequence hashes; computed, not hardcoded. The very high
      downstream identity is what makes this a localized N-terminal question rather than a
      doubt about orthology.
- id: PMID:23229899
  title: "PtdIns4P synthesis by PI4KIII\u03B1 at the plasma membrane and its impact on plasma membrane\
    \ identity."
  findings:
  - statement: Phosphatidylinositol 4-kinase III alpha reaches the plasma membrane as part of an
      evolutionarily conserved
      complex containing Efr3, which the authors identify as a palmitoylated peripheral membrane
      protein rather than a transmembrane one.
    supporting_text: Efr3/rolling blackout, which we found was a palmitoylated peripheral
      membrane protein.
    reference_section_type: ABSTRACT
  - statement: The N-terminal Cys-rich motif is conserved in all metazoans and was identified
      as the candidate palmitoylation site, which is why its absence from a mammalian EFR3A
      model is a specific concern rather than ordinary sequence divergence.
    supporting_text: Further sequence analysis identified a Cys-rich motif at the N terminus
      of EFR3 that is conserved in all metazoans and could potentially act as a palmitoylation
      site
    reference_section_type: RESULTS
  - statement: Palmitoylation at that motif was demonstrated by metabolic labeling, and the
      palmitoylation-deficient EFR3A mutant C6S/C7S/C8S/C9S relocalized to the cytosol - direct
      evidence that these exact residues, the ones missing from the horse model, determine
      plasma-membrane residence.
    supporting_text: 'palmitoylation-deficient mutants (C6S/C7S/C8S/C9S for EFR3A and C5S/C7S/C8S
      for EFR3B) were localized in the cytosol'
    reference_section_type: RESULTS
  - statement: The equivalent EFR3B palmitoylation-deficient mutant also failed to recruit TTC7B
      and the kinase to the plasma membrane, showing the motif is required for the complex's
      function and not only for EFR3's own localization.
    supporting_text: the EFR3B palmitoylation-deficient mutant was unable to recruit tagged
      TTC7B and M1-
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached. The primary experimental source for EFR3A palmitoylation
      and plasma-membrane anchoring, and the direct basis for the UNDECIDED action - the mutant
      that loses exactly the residues missing from the horse model goes to the cytosol. Human
      and rodent cell work; equine transfer is not asserted.
