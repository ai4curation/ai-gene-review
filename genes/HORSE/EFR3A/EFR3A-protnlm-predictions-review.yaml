  review:
    assessment: UNC
    confidence_score: 1
    summary: "Human EFR3A recruits PI4KA through a palmitoylated membrane anchor. The horse sequence aligns\
      \ at 98.24% identity downstream but lacks human residues2\u201326, including the Cys6\u2013Cys9\
      \ palmitoylation cluster whose mutation relocates human EFR3A to the cytosol (PMID:23229899; PMID:25380825).\
      \ Thus high overall similarity does not establish plasma-membrane recruitment for this exact protein\
      \ model. Alternative initiation or an incomplete gene model could reconcile the sequences, but neither\
      \ is demonstrated here. The prediction remains unresolved rather than being transferred from the\
      \ human gene label. Training-set membership is unknown."
    supported_by:
    - reference_id: file:human/EFR3A/EFR3A-uniprot.txt
      supporting_text: 'CC   -!- FUNCTION: Component of a complex required to localize

        CC       phosphatidylinositol 4-kinase (PI4K) to the plasma membrane

        CC       (PubMed:23229899, PubMed:25608530, PubMed:26571211). The complex acts

        CC       as a regulator of phosphatidylinositol 4-phosphate (PtdIns(4)P)

        CC       synthesis (Probable). In the complex, EFR3A probably acts as the

        CC       membrane-anchoring component (PubMed:23229899). Also involved in

        CC       responsiveness to G protein-coupled receptors; it is however unclear

        CC       whether this role is direct or indirect (PubMed:25380825).

        CC       {ECO:0000269|PubMed:23229899, ECO:0000269|PubMed:25380825,

        CC       ECO:0000269|PubMed:25608530, ECO:0000305}.'
