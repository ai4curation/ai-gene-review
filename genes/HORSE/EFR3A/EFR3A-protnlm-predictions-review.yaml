    summary: >-
      Recruitment of the PI4KA complex to the plasma membrane is the core process of EFR3A, and
      the horse EFR3A gene already carries GO:0072659 by IBA on its full-length product
      A0A3Q2GU27, so the term is not novel at the gene level. It is incorrect for this exact
      product. A0A9L0S4L8 is an alternative-first-exon product that aligns to human EFR3A at
      98.24% identity downstream but lacks human residues 2-26, including the Cys6-Cys9
      palmitoylation cluster; nothing in the horse sequence pairs with that motif. EFR3 acts as
      the membrane localization signal of the complex through its palmitoylated N-terminus,
      palmitoylation is required for plasma membrane association of metazoan Efr3, the
      C6S/C7S/C8S/C9S EFR3A mutant is cytosolic, and the palmitoylation-deficient EFR3B mutant
      cannot recruit TTC7B and PI4KA to the plasma membrane (PMID:23229899; PMID:24360784;
      PMID:38746453). The conserved basic patch and TTC7-binding scaffold are retained, but the
      lipid anchor on which EFR3A participation in this process depends is absent from this
      accession, so the prediction does not hold for the sequence ProtNLM2 was given.
      Training-set membership is unknown.
