suggested_questions:
- question: Does horse IRAK3, which has Asn at the position of human Ser110, undergo IL-33-induced nuclear translocation
    in dendritic cells, or is that mechanism primate-specific?
- question: Is the C207-C292 disulfide-linked pseudokinase dimer formed by horse IRAK3, and does it contribute to
    retention of IRAK1/IRAK4 on MyD88?
suggested_experiments:
- description: Knock down or knock out IRAK3 in equine monocyte-derived macrophages and measure LPS- and IL-1-induced
    TNF/IL-6 production, IRAK1 release from MyD88, and LPS tolerance on re-challenge.
