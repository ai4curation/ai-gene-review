core_functions:
- description: Pseudokinase adaptor of the MyD88-IRAK4 receptor-proximal complex. By orthology to human and mouse
    IRAK3, it retains IRAK1/IRAK4 on MyD88 and blocks IRAK1-TRAF6 coupling, acting as TLR/IL-1R-induced negative
    feedback. Inferred; not tested in horse.
  molecular_function:
    id: GO:0019901
    label: protein kinase binding
  directly_involved_in:
