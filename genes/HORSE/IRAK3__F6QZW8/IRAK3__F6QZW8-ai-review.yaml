    label: negative regulation of toll-like receptor signaling pathway
  - id: GO:0043242
    label: negative regulation of protein-containing complex disassembly
  - id: GO:0002755
    label: MyD88-dependent toll-like receptor signaling pathway
  locations:
  - id: GO:0005737
    label: cytoplasm
  supported_by:
  - *id015
  - *id008
  - *id007
  - *id003
- description: Head-to-head homodimerisation of the pseudokinase domain. Both interface cysteines of the human disulfide-linked
    dimer are conserved in horse. Inferred; not tested in horse.
  molecular_function:
