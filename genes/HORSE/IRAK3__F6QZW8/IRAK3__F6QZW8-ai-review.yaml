id: F6QZW8
gene_symbol: IRAK3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9796
  label: Equus caballus
description: 'IRAK3 (IRAK-M) of the horse is a member of the IL-1 receptor-associated kinase family, with an N-terminal
  death domain, a central pseudokinase domain and a C-terminal region carrying a TRAF6-binding motif. The canonical
  horse product (614 aa) is a 1:1 ortholog of human and mouse IRAK3 (PANTHER subfamily PTHR24419:SF7) and conserves
  the features defined experimentally in those species: the death-domain surface residues that contact MyD88/IRAK4
  and IRAK1/TRAF6, the noncanonical CGS catalytic loop and DFA magnesium loop that make IRAK3 a pseudokinase with
  weak ATP binding and no established kinase activity, and both cysteines of the disulfide-linked head-to-head pseudokinase
  dimer. By orthology, horse IRAK3 is expected to act in the cytoplasm as a TLR- and IL-1R-induced negative-feedback
  regulator. It retains IRAK1 and IRAK4 on MyD88, prevents IRAK1-TRAF6 coupling, and limits macrophage cytokine
  production, contributing to endotoxin tolerance. In some contexts it also drives a MEKK3-dependent second wave
  of NF-kB. Human Ser110, the IRAK1 phosphorylation site recognised by PIN1 in IL-33 signaling, is Asn in horse.
  None of these functions has been tested experimentally in horse.'
