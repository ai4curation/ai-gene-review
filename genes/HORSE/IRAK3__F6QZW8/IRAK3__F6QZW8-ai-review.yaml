  review:
    summary: Magnesium ion binding, transferred electronically (ARBA plus the human IDA from the original IRAK-M
      paper).
    action: REMOVE
    reason: IRAK3 has a degenerate Mg2+-coordinating loop (DFA instead of DFG). Purified human IRAK3 showed no thermal
      shift with MgCl2 and ATP, so there is no evidence that it binds Mg2+ as a kinase cofactor. Horse retains the
      same DFA316-318 configuration. The human review removes the source IDA for the same reason.
    supported_by:
    - &id002
      reference_id: PMID:33238146
      supporting_text: The canonical catalytic “HRD”-motif is missing entirely in IRAK3 and replaced with “CGS,”
        whereas the Mg2+-coordinating “DFG”-motif is slightly altered to “DFA.”
    - reference_id: PMID:33238146
      supporting_text: In agreement with the structure-guided predictions, MgCl2 and ATP did not induce significant
        thermal shifts in IRAK3, while the addition of staurosporine resulted in a +7.9°C shift of the melting temperature.
    - &id003
      reference_id: file:HORSE/IRAK3__F6QZW8/IRAK3__F6QZW8-bioinformatics/RESULTS.md
      supporting_text: Every residue tested in the human and mouse functional and structural studies is conserved
