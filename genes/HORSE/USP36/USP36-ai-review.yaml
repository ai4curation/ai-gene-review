suggested_questions:
- question: Should the reported SUMO ligase activity of human USP36 toward EXOSC10 and snoRNP proteins
    (PMID:36912080) be captured in GO, and is it conserved in other mammals such as horse?
- question: Which residues of the poorly conserved middle disordered region (67% identity horse vs human)
    are required for substrate recognition, and do they differ among mammals?
suggested_experiments:
- description: Express horse USP36 in human USP36-depleted cells and test rescue of rRNA processing and
    nucleophosmin/DHX33 stability, comparing wild type with a Cys131Ala catalytic mutant.
