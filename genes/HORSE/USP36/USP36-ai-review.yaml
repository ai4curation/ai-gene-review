id: F6W2H6
gene_symbol: USP36
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9796
  label: Equus caballus
description: USP36 is a nucleolar ubiquitin-specific protease of the peptidase C19 family, with an N-terminal
  USP catalytic domain (catalytic Cys131 and His382) followed by a long, largely disordered C-terminal
  region whose basic stretches target it to nucleoli. It removes ubiquitin, including Lys-48-linked chains,
  from nucleolar and nuclear substrates such as nucleophosmin, fibrillarin, the RNA helicase DHX33, MYC
  and CEP63, protecting them from proteasomal degradation and thereby sustaining rRNA transcription and
  processing, nucleolar structure and ribosome production. It also deubiquitinates monoubiquitinated histone
  H2B at specific loci, restrains p62-dependent selective autophagy, and has been reported to promote
  SUMOylation of the RNA exosome subunit EXOSC10. A cytoplasmic pool modulates NEDD4L-mediated ubiquitination
  of TrkA. The horse protein F6W2H6 is a full-length ortholog (1123 aa) of human USP36.
