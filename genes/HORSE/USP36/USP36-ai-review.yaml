core_functions:
- description: Nucleolar ubiquitin-specific protease that removes ubiquitin, including Lys-48-linked chains,
    from nucleolar substrates such as nucleophosmin, fibrillarin and DHX33, stabilizing them and sustaining
    rRNA transcription and processing.
  molecular_function:
    id: GO:0004843
    label: cysteine-type deubiquitinase activity
  directly_involved_in:
