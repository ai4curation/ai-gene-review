description: CXCR3 is a seven-transmembrane chemokine receptor that recognizes CXCL9, CXCL10 and CXCL11
  and coordinates lymphocyte recruitment through G-protein signaling. Mammalian alternative isoforms differ
  in ligand recognition and downstream growth responses; CXCR3-B also recognizes CXCL4 and mediates angiostatic
  responses.
