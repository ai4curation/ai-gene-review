    summary: >-
      CXCR3 recruits effector T cells to interferon-driven inflammatory sites; a
      contextual, non-core process for the receptor.
    action: KEEP_AS_NON_CORE
    reason: >-
      The receptor's direct role is chemokine signalling and T-cell chemotaxis; its
      contribution to inflammation is through recruitment of effector lymphocytes.
