core_functions:
- description: >-
    Plasma-membrane C-X-C chemokine receptor that binds CXCL9, CXCL10 and CXCL11 and
    activates Gi-coupled chemokine signalling (Ca2+ mobilisation), directing chemotaxis
    of activated effector T lymphocytes toward interferon-induced chemokine gradients.
    Function inferred by orthology within PANTHER subfamily PTHR10489:SF671 from human
    CXCR3.
