suggested_questions:
- question: >-
    Does the horse CXCR3 locus encode a CXCR3-B-like isoform with an alternative
    N-terminal exon (as in human), and does the 23-residue N-terminal extension of the
    second horse model F6U4S6 correspond to a real transcript or a gene-model artefact?
- question: >-
    Does horse CCL21 act on horse CXCR3 (as reported for mouse) or not (as for human)?
suggested_experiments:
- description: >-
    Express horse CXCR3 (A0A9L0T1D1) in a reporter cell line and measure binding,
    Ca2+ flux and chemotaxis in response to equine CXCL9, CXCL10, CXCL11, CXCL4 and
    CCL21, with pertussis toxin to test Gi dependence.
