- term:
    id: GO:0002685
    label: regulation of leukocyte migration
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR004070
  review:
    summary: >-
      InterPro2GO mapping from the CXCR3-specific signature (IPR004070). CXCR3 signalling
      steers leukocyte (mainly activated T-cell) migration toward CXCL9/10/11; the
      receptor's own role is better captured by T cell chemotaxis and chemokine-mediated
      signalling, so this regulation term is true but peripheral.
    action: KEEP_AS_NON_CORE
    reason: >-
      The horse protein is in PANTHER subfamily PTHR10489:SF671 with human P49682 (90.8%
      identity, full-length) and mouse/dog/bovine CXCR3, so the human ligand-driven
      leukocyte migration evidence transfers. In human, CXCR3 engagement by CXCL9/10/11
      drives chemotaxis of Th1 cells, NK cells, macrophages and dendritic cells. The
      receptor directly mediates chemotaxis (captured on the chemotaxis row, refined to
      T cell chemotaxis) rather than acting as a modulator of a migration process driven
      by something else, so this regulation term is retained only as non-core.
    supported_by:
    - reference_id: PMID:12782716
      supporting_text: the interaction of CXCL9, CXCL10, and CXCL11 with CXCR3 also results
        in the chemotaxis of activated Th1 cells (17, 18), NK cells (19), macrophages (20),
        and dendritic cells (21)
