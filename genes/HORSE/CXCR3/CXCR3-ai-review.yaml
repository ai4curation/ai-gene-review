gene_symbol: A0A9L0T1D1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9796
  label: Equus caballus
description: >-
  Horse CXCR3 (C-X-C chemokine receptor type 3, also called the IP-10 receptor) is a
  rhodopsin-like seven-transmembrane G protein-coupled receptor of the plasma membrane.
  By orthology with the experimentally characterised human and mouse receptors, which
  sit in the same PANTHER subfamily (PTHR10489:SF671), it binds the interferon-inducible
  C-X-C chemokines CXCL9 (MIG), CXCL10 (IP-10) and CXCL11 (I-TAC) and transduces their
  signal through heterotrimeric Gi proteins, mobilising intracellular calcium and
  directing the chemotaxis of activated effector (type-1) T lymphocytes and other
  leukocytes toward sites of interferon-driven inflammation. The 369-residue product
  conserves the human ligand-recognition N terminus (including the two sulfated
  tyrosines), the conserved extracellular disulfide and the DRY motif. In horses, CXCR3
  transcripts are detected in blood leukocytes and wounded skin, but ligand binding and
  signalling of the horse receptor have not been tested directly. Human CXCR3 also has a
  splice variant (CXCR3-B) with an extended N terminus that binds CXCL4 and mediates
  angiostatic signalling; whether horses make an equivalent isoform is unknown.
