- term:
    id: GO:0030695
    label: GTPase regulator activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: enables
  supporting_entities:
  - ARBA:ARBA00026642
  review:
    summary: KRIT1 is a Rap1 effector, not a regulator of the GTPase cycle; refine to small GTPase binding.
    action: MODIFY
    reason: GTPase regulator activity means modulating the GTPase cycle, as a GEF, GAP or GDI-like factor
      does. No study shows KRIT1 altering Rap1 nucleotide exchange or hydrolysis. Human KRIT1 binds the
      effector loop of GTP-loaded Rap1 through its FERM F1/F2 lobes (co-crystal structure) and is relocalized
      by it, which is effector behaviour. The ARBA term is replaced by small GTPase binding, as in the
      human KRIT1 review. The FERM Rap1-interaction region is identical in horse and human. This is inferred
      for horse.
    proposed_replacement_terms:
    - id: GO:0031267
      label: small GTPase binding
