id: A0A3Q2GZV2
gene_symbol: KRIT1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9796
  label: Equus caballus
description: KRIT1 (Krev interaction trapped protein 1, CCM1) of the horse is a 736-residue non-enzymatic
  scaffold protein made of an N-terminal Nudix-like domain, three NPx(Y/F) motifs (NPAY, NPLF, NPYF),
  four ankyrin repeats and a C-terminal FERM domain. It is the full-length product of the horse KRIT1
  gene and differs from human KRIT1 at only 10 of 736 positions, with every mapped interaction surface
  identical. In human and mouse cells, KRIT1 binds microtubules in the cytoplasm. GTP-loaded Rap1 binds
  its FERM F1/F2 lobes and releases it to PI(4,5)P2-containing plasma membrane at endothelial cell-cell
  junctions. There it binds the HEG1 cytoplasmic tail and the CCM2 PTB domain, anchoring the KRIT1-CCM2-PDCD10
  complex at VE-cadherin adherens junctions. Junctional KRIT1 stabilizes cell-cell contacts, restrains
  RhoA/Rho kinase signaling and keeps the endothelium quiescent and polarized. Through its N-terminal
  NPAY motif it also sequesters ICAP1 away from the beta1 integrin tail. None of these activities has
  been tested on the horse protein. They are inferred from its PANTHER subfamily membership (PTHR13283:SF11,
  with human, mouse and zebrafish KRIT1) and from PAINT phylogenetic propagation.
