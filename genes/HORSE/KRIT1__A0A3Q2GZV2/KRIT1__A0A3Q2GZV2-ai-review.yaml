- term:
    id: GO:0009948
    label: anterior/posterior axis specification
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN002665063
  - ZFIN:ZDB-GENE-030131-555
  review:
    summary: Rests on a zebrafish morphant body-axis phenotype; not participation in axis specification.
    action: REMOVE
    reason: The only seed for this PTN002665063 assertion is a ZFIN acts_upstream_of_or_within IGI on
      zebrafish krit1 (PMID:26540726). In that study, combined ccm2l/ccm2 knockdown gave cardiac and circulation
      defects with secondary body axis abnormalities, which MEKK3 silencing rescued. That is a downstream
      organismal phenotype of vascular/cardiac CCM-MEKK3 dysregulation. It is not patterning of the
      anterior/posterior axis, and the 'upstream of' sense is lost when the IBA is issued as involved_in.
      No mammalian KRIT1 study implicates axis specification. The same row was removed in the human
      KRIT1 (O00522) review on the same grounds.
    supported_by:
    - reference_id: PMID:26540726
      supporting_text: A knockdown of ccm2l and ccm2 in zebrafish leads to a more severe "big heart" and
        circulation defects compared with loss of function of ccm2 alone, and also leads to substantial
        body axis abnormalities.
    propagation_review:
      root_cause: SOURCE_WEAK_OR_INFERRED
      failure_modes:
      - CONTEXT_OR_TISSUE_MISMATCH
      - SOURCE_EVIDENCE_WEAK
      source_entities:
      - source_id: PANTHER:PTN002665063
        source_label: bilaterian KRIT1 clade node
        source_status: SOURCE_WEAK_OR_INFERRED
        comment: Horse KRIT1 correctly descends from this node, so its placement is not in question. The
          single seed for this term is weak.
      - source_id: ZFIN:ZDB-GENE-030131-555
        source_label: zebrafish krit1
