suggested_questions:
- question: PAINT propagated microtubule binding, plasma membrane, redox homeostasis, polarity and anti-angiogenic
    roles to KRIT1 orthologs, but not the experimentally established Rap1 binding, HEG1/CCM2 adaptor activity
    or ICAP1-binding functions of human KRIT1. Was this a deliberate choice, and should those functions
    be placed at the vertebrate KRIT1 node (PTN002665064)?
- question: Is horse KRIT1 expressed and junction-localized in equine endothelium, and do equine vascular
    malformations involve the CCM genes?
suggested_experiments:
- description: Express tagged horse KRIT1 in equine endothelial cells and test GTP-dependent Rap1 binding
    (pulldown with GTPgammaS- versus GDP-loaded Rap1), microtubule co-sedimentation, and Rap1-dependent
    relocalization to VE-cadherin junctions. This would establish in horse the functions that are currently
    transferred from human and mouse.
