- id: PMID:17916086
  title: Krit 1 interactions with microtubules and membranes are regulated by Rap1 and integrin cytoplasmic
    domain associated protein-1.
  findings:
  - statement: Purified KRIT1 binds microtubules through its N and C termini and binds PI(4,5)P2-containing
      liposomes; Rap1 enhances membrane binding.
    supporting_text: Krit1 binds in vitro to microtubules through its N- and C-termini
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Experiments on human/mouse KRIT1, not horse. It is the experimental seed (human IDA)
      for the microtubule binding PAINT node, and it supports the membrane-binding mechanism.
- id: PMID:21633110
  title: A mechanism of Rap1-induced stabilization of endothelial cell--cell junctions.
  findings:
  - statement: KRIT1 is a GTP-dependent Rap1 effector; Rap1 binding releases KRIT1 from microtubules
      to cell-cell junctions, where it suppresses Rho kinase signaling.
    supporting_text: native KRIT1 protein binds the effector loop of Rap1A but not H-Ras in a GTP-dependent
      manner
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Mammalian (non-horse) KRIT1. It establishes the Rap1-effector function used to refine
      the ARBA GTPase regulator activity row.
- id: PMID:22577140
  title: Structural basis for small G protein effector interaction of Ras-related protein 1 (Rap1) and
    adaptor protein Krev interaction trapped 1 (KRIT1).
  findings:
  - statement: Co-crystal structure of the human KRIT1 FERM domain with Rap1 maps the interface to the
      Rap1 switch regions and the FERM F1/F2 lobes.
    supporting_text: Rap1-KRIT1 interaction encompasses an extended surface
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Structural study of human KRIT1. The interface it maps is conserved in horse (see RESULTS.md).
- id: PMID:23007647
  title: Structural basis of the junctional anchorage of the cerebral cavernous malformations complex.
  findings:
  - statement: KRIT1 links the CCM complex to endothelial junctions through HEG1 binding.
    supporting_text: CCM1/KRIT1 links this complex to endothelial cell (EC) junctions
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only in the cache. Human KRIT1 structural/biochemical work; supports the junctional
      localization refinement.
- id: PMID:20332120
  title: CCM1 regulates vascular-lumen organization by inducing endothelial polarity.
  findings:
  - statement: CCM1 interacts with VE-cadherin, organizes adherens junctions and their association with
      the polarity complex; loss dismantles junctions and polarity.
    supporting_text: The protein interacts with VEC and directs AJ organization
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Human/mouse endothelial cells. Supports the adherens junction refinement and the non-core
      polarity rows.
- id: PMID:20616044
  title: Cerebral cavernous malformation protein CCM1 inhibits sprouting angiogenesis by activating DELTA-NOTCH
    signaling.
  findings:
  - statement: CCM1 inhibits endothelial proliferation, migration, lumen formation and sprouting in primary
      human endothelial cells.
    supporting_text: CCM1 inhibits endothelial proliferation, apoptosis, migration, lumen formation, and
      sprouting angiogenesis in primary human endothelial cells.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Human endothelial cells. Supports the non-core negative regulation of angiogenesis rows.
- id: PMID:20668652
  title: KRIT1 regulates the homeostasis of intracellular reactive oxygen species.
  findings:
  - statement: KRIT1 loss raises intracellular ROS through reduced FOXO1/SOD2 expression.
    supporting_text: KRIT1 loss/down-regulation is associated with a significant increase in intracellular
      ROS levels
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Mouse MEFs and human endothelial cells. Supports an indirect, non-core role in redox
      homeostasis.
- id: PMID:23317506
  title: Mechanism for KRIT1 release of ICAP1-mediated suppression of integrin activation.
  findings:
  - statement: KRIT1 binds ICAP1 through its N-terminal NPAY region and competes with the integrin beta1
      tail for ICAP1.
    supporting_text: KRIT1 directly competes with integrin
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Human KRIT1. Background for the description. The ICAP1-binding region 172-195 is identical
      in horse. Not used to support any horse annotation row, because no ICAP1/integrin term is propagated
      to this protein.
- id: PMID:26540726
  title: The cerebral cavernous malformation proteins CCM2L and CCM2 prevent the activation of the MAP
    kinase MEKK3.
  findings:
  - statement: Zebrafish ccm2l/ccm2 double knockdown gives cardiac defects with secondary body axis abnormalities.
    supporting_text: also leads to substantial body axis abnormalities
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: The source of the zebrafish seed for the anterior/posterior axis specification IBA. It
      shows a morphant organismal phenotype, so it is cited only to justify removing that row.
