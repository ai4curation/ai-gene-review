core_functions:
- description: Calcium-activated NAD(P)H oxidase that reduces oxygen to hydrogen peroxide at the apical
    plasma membrane, using FAD and two transmembrane hemes, in a complex with the maturation factor DUOXA1.
    Inferred for horse DUOX1 from PAINT node PTN000944147 (DUOX clade, seeded by human DUOX1 and DUOX2),
    membership of PTHR11972:SF75 and conservation of all calcium, heme and FAD contact residues. The F6YEX2
    gene model lacks the last 35 residues and 5 of 11 NADPH contacts, which are encoded by other horse
    DUOX1 transcripts.
  molecular_function: *id007
  directly_involved_in:
  - *id021
  locations:
  - id: GO:0016324
    label: apical plasma membrane
  in_complex:
    id: GO:0043020
    label: NADPH oxidase complex
  supported_by:
  - *id005
  - *id006
  - *id004
  - *id015
suggested_questions:
- question: Is the 18-nt final coding exon of the canonical horse DUOX1 transcript ENSECAT00000026134
    (giving the 1516-residue F6YEX2) a gene-model or assembly artefact, given that the other three horse
    DUOX1 transcripts encode a full C-terminus matching human residues 1517-1551?
- question: Which horse DUOX1 transcripts are actually translated in airway epithelium and thyroid, and
    does the EF-hand-deleted product A0A9L0SQG9 exist as protein?
suggested_experiments:
- description: Express horse DUOX1 (full-length coding sequence, including the C-terminus present in the
    non-canonical transcripts) with horse DUOXA1 in HEK293 cells and measure calcium-stimulated, NADPH-dependent
    H2O2 release with Amplex Red, to confirm the orthology-based activity assignment.
