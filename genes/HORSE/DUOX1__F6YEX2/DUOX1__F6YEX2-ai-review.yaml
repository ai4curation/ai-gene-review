id: F6YEX2
gene_symbol: DUOX1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9796
  label: Equus caballus
description: 'DUOX1 encodes dual oxidase 1, a large multi-pass plasma-membrane NADPH oxidase of the NOX/DUOX
  family that makes hydrogen peroxide outside the cell. Its cytosolic dehydrogenase domain binds NADPH
  and FAD and passes electrons through two hemes in the transmembrane ferric-reductase domain to oxygen
  at the outer face of the membrane, releasing H2O2 rather than superoxide. Calcium binding to EF-hand
  modules in the long intracellular loop switches the enzyme on. DUOX1 works as a complex with the maturation
  factor DUOXA1, which takes it from the endoplasmic reticulum to the apical plasma membrane of polarized
  epithelia. A large extracellular N-terminal domain resembles animal heme peroxidases but in mammals
  lacks the heme-ligating residues and has no peroxidase activity. In mammals the H2O2 is a co-substrate
  for lactoperoxidase in airway host defense and for thyroid peroxidase in thyroid hormone synthesis,
  and acts as a local signal in epithelial wound responses. Nothing has been measured on the horse protein:
  these functions are inferred from human DUOX1, which is in the same PANTHER subfamily (PTHR11972:SF75).
  The UniProt entry F6YEX2 (1516 aa) is the Ensembl canonical product of horse DUOX1 and carries all calcium,
  heme and FAD binding residues of human DUOX1, but its gene model stops 35 residues short of the human
  C-terminus, which other horse DUOX1 transcripts do encode.'
existing_annotations:
- term:
    id: GO:0004601
    label: peroxidase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR010255
  review:
    summary: Peroxidase activity assigned by the InterPro haem-peroxidase superfamily signature (IPR010255),
      which matches the extracellular N-terminal peroxidase-homology domain of DUOX1.
    action: REMOVE
    reason: The peroxidase-homology domain of mammalian DUOX1 is not a functional peroxidase. The purified
      human DUOX1 domain binds no heme and has no peroxidase activity, and the cryo-EM structure shows
      that the heme-ligating histidine is absent; human DUOX1 carries a curated NOT peroxidase activity
      annotation from that work. The horse record carries the PROSITE PRU00298 caution that conserved
      residues needed to propagate the peroxidase features are missing, and the horse domain is present
      in full and of the same SF75 subfamily as human, so there is no basis for expecting it to differ.
      Only the nematode orthologue's domain binds heme and is weakly active. An earlier report of peroxidase
      activity in lysates (PMID:11514595) is contradicted for the human domain by the purified-protein
      study. No PAINT node in PTHR11972 asserts peroxidase activity, which agrees with this. The InterPro
      mapping is a fold-level transfer to a pseudo-peroxidase domain.
    supported_by:
    - &id002
      reference_id: PMID:19460756
      supporting_text: the isolated hDUOX1(1-593) does not bind heme and has no intrinsic peroxidase activity
    - reference_id: PMID:33420071
      supporting_text: key residues for heme binding, such as the heme ligand histidine, are missing in
        the PHD of hDUOX1
    - reference_id: file:HORSE/DUOX1__F6YEX2/DUOX1__F6YEX2-uniprot.txt
      supporting_text: Lacks conserved residue(s) required for the propagation of feature annotation.
