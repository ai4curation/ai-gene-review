suggested_questions:
- question: Which CADM1 splice forms are expressed in horse brain, mast cells and epithelia, and is the
    stalk-short SP4-type product (the only one in UniProt for horse) the predominant form as it is in human
    mast cells?
- question: Should GO capture the ligand role of CADM1 for CRTAM with a more specific function term than
    signaling receptor binding?
suggested_experiments:
- description: RT-PCR across the stalk exons of horse CADM1 in brain and lung to determine which splice
    forms (SP1, SP4 and others) are expressed.
