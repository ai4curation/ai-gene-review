  review:
    summary: Broad process term reflecting the recognition of CADM1-bearing cells by CRTAM-expressing
      NK and CD8+ T cells.
    action: KEEP_AS_NON_CORE
    reason: CADM1 takes part in cell-cell recognition as the surface molecule that is recognized (PMID:15811952),
      and its homophilic and heterophilic trans interactions also underlie recognition between neighbouring
      cells. The term is true but broad; the specific immune outcome is captured by susceptibility to
      natural killer cell mediated cytotoxicity, which is not a descendant of cell recognition, so this
      is retained as non-core rather than replaced.
    supported_by:
    - reference_id: PMID:15811952
      supporting_text: they reveal Necl-2 as one of the molecular targets that allows the immunosurveillance
        network to distinguish tumor cells from normal cells
