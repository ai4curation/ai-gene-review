gene_symbol: CADM1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9796
  label: Equus caballus
description: CADM1 (cell adhesion molecule 1; also called SynCAM1, TSLC1 and nectin-like 2) is a single-pass
  type I transmembrane glycoprotein of the nectin-like branch of the immunoglobulin superfamily, with
  an extracellular region of three Ig-like domains (one V-type and two C2-type), a short stalk, a transmembrane
  helix and a cytoplasmic tail ending in a PDZ-binding motif. Studies of the human and rodent orthologs
  show that it forms cis homodimers and mediates Ca(2+)-independent homophilic (and some heterophilic)
  cell-cell adhesion at the plasma membrane of epithelial cells, mast cells and neurons, where it acts
  at synapses as a synaptic adhesion molecule that promotes synapse assembly. Its cytoplasmic tail links
  it to the actin cytoskeleton through protein 4.1 (EPB41L3) and to PDZ-domain scaffolds of the MAGUK
  family. On epithelial, tumor and dendritic cells CADM1 is the ligand recognized by the CRTAM receptor
  on activated NK cells and CD8+ T cells, so CADM1 expression makes cells susceptible to NK-cell cytotoxicity.
  The horse protein (417 aa) is 99% identical to human CADM1 and corresponds to the human isoform 5
  (SP4) splice form, which lacks a Thr-rich segment of the extracellular stalk.
