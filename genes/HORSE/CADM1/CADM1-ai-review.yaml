  review:
    summary: PAINT transfer from node PTN002913382, grounded in the human CADM1 interaction with the
      NK/CD8+ T-cell receptor CRTAM. CADM1 is the cell-surface ligand that CRTAM recognizes.
    action: ACCEPT
    reason: Human CADM1 binds CRTAM through its Ig-like V-type domain, and this binding triggers NK-cell
      cytotoxicity and CD8+ T-cell IFN-gamma secretion (PMID:15811952, PMID:15781451). The horse protein
      sits in the same PANTHER subfamily (PTHR45889:SF2, CELL ADHESION MOLECULE 1) as human, mouse and
      rat CADM1 and is 99% identical to human CADM1 across the whole extracellular region (file:HORSE/CADM1/CADM1-bioinformatics/RESULTS.md),
      so the inherited ligand function is well supported. No more specific GO term for CRTAM binding exists.
    supported_by:
