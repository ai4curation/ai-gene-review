- term:
    id: GO:0051606
    label: detection of stimulus
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:1889272
  - PANTHER:PTN002913382
  - UniProtKB:Q9BY67
  review:
    summary: Propagated from a human IDA annotation based on the CRTAM study. In that system CADM1 is
      the stimulus (the ligand on the target cell) and the CRTAM-expressing NK or CD8+ T cell is the
      detecting cell.
    action: MARK_AS_OVER_ANNOTATED
    reason: The evidence shows that NK cells and CD8+ T cells recognize CADM1 through CRTAM (PMID:15811952).
      The detection step is performed by the receptor-bearing lymphocyte, not by CADM1, which is the
      molecule being detected. The CADM1 side of this interaction is already captured by signaling receptor
      binding and susceptibility to natural killer cell mediated cytotoxicity. Because the PAINT curators
      placed this term on the CADM1 node, it is marked as an over-annotation rather than removed.
    propagation_review:
      root_cause: SOURCE_BAD
      failure_modes:
      - ROLE_CONFLATION
      source_entities:
      - source_id: PANTHER:PTN002913382
        source_label: PTN002913382
        source_status: SOURCE_BAD
        comment: The horse protein is correctly inside the CADM1 clade under this node; the problem is
          the term, which is seeded from the human CRTAM study (PMID:15811952) where CADM1 is the detected
          ligand and the CRTAM-bearing lymphocyte performs the detection.
    supported_by:
    - reference_id: PMID:15811952
      supporting_text: natural killer (NK) cells and CD8+ T cells recognize Necl-2 through a receptor
        known as class I-restricted T-cell-associated molecule (CRTAM), which is expressed only on activated
        cells
