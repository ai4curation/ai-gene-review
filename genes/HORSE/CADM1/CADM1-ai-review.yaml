- id: PMID:22438059
  title: CADM1 isoforms differentially regulate human mast cell survival and homotypic adhesion.
  findings:
  - statement: The SP4 isoform (exons 7/8/11), which corresponds to the horse entry, is the main isoform
      in human mast cells and gives stronger homotypic adhesion than SP1.
    supporting_text: The most highly expressed SP4 isoform is likely to contribute to MC aggregation and
      longevity in mastocytosis
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached. Establishes that the stalk-short SP4 splice form is functional for
      homotypic adhesion.
