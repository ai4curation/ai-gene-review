  review:
    summary: CADM1/SynCAM1 is present on axons and dendrites of neurons in rodents; the donors are mouse
      and rat Cadm1.
    action: KEEP_AS_NON_CORE
    reason: The rodent donors localize CADM1 to neuronal processes, consistent with its role as a synaptic
