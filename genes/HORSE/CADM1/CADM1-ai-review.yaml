- term:
    id: GO:0007156
    label: homophilic cell-cell adhesion
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:1889272
  - MGI:MGI:2137858
  - PANTHER:PTN001910345
  review:
    summary: Homophilic, Ca(2+)-independent cell-cell adhesion is the defining activity of CADM1 and is
      propagated from a deeper node (PTN001910345) covering CADM family members.
    action: ACCEPT
    reason: Human CADM1 mediates homophilic adhesion in a Ca(2+)/Mg(2+)-independent manner in aggregation
      assays (PMID:12050160), and the SP4 splice form, which the horse entry corresponds to, gave stronger
      homotypic adhesion than SP1 in human mast cells (PMID:22438059). Mouse SynCAM1 acts as a homophilic
      adhesion molecule at synapses (PMID:12202822). The horse protein is inside the CADM1 subfamily and
      conserves the adhesive Ig-like V-type domain, so this is core.
    supported_by:
    - reference_id: PMID:12050160
      supporting_text: these results indicate that TSLC1 mediates intracellular adhesion through homophilic
        interactions in a Ca(2+)/Mg(2+)-independent manner
    - reference_id: PMID:22438059
      supporting_text: SP4 overexpression in HMC-1 cells and HLMCs augmented homotypic adhesion to a greater
        extent than SP1 in various conditions.
    - reference_id: PMID:12202822
      supporting_text: functions as a homophilic cell adhesion molecule at the synapse
- term:
