  title: 'SIRT5: horse–human sequence comparison'
  findings: []
  reference_review:
    relevance: HIGH
    correctness: LOW_QUALITY
    review_notes: 'Reproducible Biopython global alignment with retained sequence hashes and mapped human catalytic/cofactor
      features; computed, not hardcoded. The feature table maps point/short features only and omits human Q9NXA8
      BINDING 58-77, an NAD-binding loop that maps 19/20 identical to F6S899. The report therefore supports SIRT5-family
      homology and retention of the catalytic histidine plus N-terminal NAD-contacting residues, but its listed
      C-terminal zinc/NAD losses fall after an abrupt non-homologous junction that is diagnostic of a frameshifted
      F6S899 gene model rather than lineage divergence; cf. the OpenScientist report''s candidate intact isoform
      A0A9L0T9B1. Normal sirtuin catalysis remains unresolved for this exact sequence. Re-review (2026-10-20): no
      longer cited as support; superseded by RESULTS-rereview.md, which compares F6S899 with the full-length horse
      models and the Ensembl exon structures and confirms the gene-model explanation (skipped 124-nt exon).'
