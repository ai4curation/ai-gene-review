  review:
    summary: NAD+ binding from the InterPro sirtuin signature (IPR003000). True of the horse SIRT5 gene product,
      whose deacylase reaction consumes NAD+; F6S899 retains the N-terminal NAD-binding GAG loop and QNID motif,
      but its frameshifted C-terminus lacks the later NAD-contacting segments, so the exact F6S899 translation is
      an incomplete model.
    action: KEEP_AS_NON_CORE
    reason: 'NAD+ is the co-substrate of SIRT5-family deacylation, and the InterPro sirtuin domain match is sound
      for the gene: PANTHER places F6S899 in PTHR11085:SF10, the SIRT5 subfamily, and full-length products of the
      same Ensembl gene (ENSECAG00000026898; A0A9L0T9B1) keep all mapped human NAD-contacting residues. The term
      is kept because it describes the gene product, but as non-core: it is a cofactor-binding consequence of the
      catalytic activity (protein-succinyllysine desuccinylase), not the function itself. The F6S899 sequence keeps
      the N-terminal Rossmann NAD loop (human 58-77) and QNID (140-143) but loses GTS 249-251, NTE 275-277 and Cys293
      to an out-of-frame C-terminus caused by a skipped 124-nt exon; whether that truncated translation folds and
      binds NAD is not established, and it is best treated as a gene-model defect rather than a functional variant.'
