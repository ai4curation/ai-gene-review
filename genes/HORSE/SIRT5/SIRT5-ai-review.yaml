core_functions:
- description: NAD-dependent removal of succinyl groups from protein lysines of mitochondrial metabolic enzymes,
    the principal activity of the horse SIRT5 gene. Assigned to the gene by PANTHER PTHR11085:SF10 membership and
    the PAINT node PTN000119399 (seeded by human SIRT5 and mouse Sirt5), which already propagates this term to the
    full-length horse product A0A9L0T9B1. The F6S899 translation itself lacks the second zinc-ligand pair.
  molecular_function:
