  label: Equus caballus
description: 'Horse SIRT5 is the mitochondrial NAD-dependent protein lysine deacylase of sirtuin class III (PANTHER
  PTHR11085:SF10), which by orthology to human and mouse SIRT5 removes succinyl, malonyl and glutaryl groups from
  lysines of mitochondrial and cytosolic metabolic enzymes, consuming NAD+ and releasing nicotinamide. The UniProt
  record F6S899 (282 aa) is a defective Ensembl gene model of this gene: it matches human SIRT5 through the N-terminal
  targeting sequence, the NAD-binding GAG loop, the Tyr102/Arg105 acyl pocket, the catalytic His158 and the first
  zinc-ligand cysteine pair, but its transcript skips a 124-nt coding exon, so the C-terminal third is translated
  out of frame and lacks the second zinc-ligand cysteine pair and the C-terminal NAD-contacting segments. Full-length
  products of the same horse gene (A0A9L0T9B1, 310 aa, 88% identical to human SIRT5) retain every catalytic element.'
