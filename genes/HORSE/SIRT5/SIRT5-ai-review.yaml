  label: Equus caballus
description: SIRT5-family protein with a conserved N-terminal sirtuin domain segment and a divergent C-terminal
  region. The selected 282-residue horse sequence retains the catalytic histidine but differs at two conserved
  zinc-coordinating cysteines and several NAD-binding segments, leaving normal sirtuin catalysis unresolved.
