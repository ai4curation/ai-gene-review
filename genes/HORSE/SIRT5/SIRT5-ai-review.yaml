suggested_questions:
- question: Should GO annotations for horse SIRT5 be anchored on a full-length product of ENSECAG00000026898 (A0A9L0T9B1,
    which already carries the PAINT IBAs) rather than on F6S899, whose transcript skips a 124-nt exon and whose
    C-terminal third is out of frame? Is there RNA-seq support for the F6S899 exon structure, including its 3-nt
    gap between the last two exons?
suggested_experiments:
- description: RT-PCR or long-read sequencing across exons 6-8 of horse SIRT5 in liver or muscle to test whether
    any transcript skips the 124-nt exon; recombinant expression of the full-length horse protein with a succinyl-lysine
    peptide assay to confirm desuccinylase activity.
