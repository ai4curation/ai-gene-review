  source_version: UniProt API snapshot 2026-09-08
  predicted_term:
    id: GO:0046872
    label: metal ion binding
  predicted_term_type: GO_MF
  review:
    assessment: NPI
    error_type: DOMAIN_ARCHITECTURE_MISMATCH
    confidence_score: 0
    summary: 'Metal ion binding is true of the horse SIRT5 gene: sirtuins bind one structural zinc ion through
      a four-cysteine zinc ribbon, human SIRT5 is curated as binding one Zn(2+) per subunit (PMID:22076378), and
      the full-length horse product A0A9L0T9B1 retains all four zinc-ligand cysteines and carries GO:0008270 zinc
      ion binding. This accession, however, lacks the feature the activity depends on. F6S899 is a defective gene
      model whose transcript skips a 124-nt coding exon, so its C-terminal third is translated out of frame; mapping
      the human zinc ligands onto it shows Cys166 and Cys169 retained but Trp at the positions of Cys207 and Cys212.
      With half of the tetrathiolate zinc site missing, this exact sequence has no established metal-binding site,
      and no other metal site is known for the family. The prediction is therefore incorrect for the product scored.'
