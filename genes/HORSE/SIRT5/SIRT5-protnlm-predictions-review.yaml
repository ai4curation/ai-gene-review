  publication_type: DEEP_RESEARCH
  reference_review:
    relevance: HIGH
    review_notes: Substantive computational synthesis directly addressing the F6S899 model defect and identifying
      the A0A9L0T9B1 record as a candidate intact horse isoform. The report's broad frameshift conclusion agrees
      with the cached human-to-horse comparison, but its Cys241/Cys244 CDLC table row is not aligned with the human
      UniProt zinc-ligand numbering; treat the CDLC claim as a lost C-terminal motif, not a verified zinc-ligand
      pair, pending curator review.
  findings:
  - statement: OpenScientist found that F6S899 is a frameshifted SIRT5 model and recommended moving functional inference
      to an intact horse isoform such as A0A9L0T9B1.
    supporting_text: The exact translated sequence of F6S899 as supplied would **not** produce a functional NAD-dependent
      desuccinylase, and the record should be flagged as a mispredicted/frameshifted model.
