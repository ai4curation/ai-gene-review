description: Assessment of 1 ProtNLM2 GO prediction for horse SIRT5 (F6S899). The single prediction, metal ion binding,
  is true of the horse SIRT5 gene but is scored NPI for this product, because F6S899 is a defective gene model whose
  frameshifted C-terminus lacks the second zinc-ligand cysteine pair of the sirtuin zinc ribbon.
