id: A0A5F5PXH2
gene_symbol: SLC27A5
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9796
  label: Equus caballus
description: SLC27A5 (bile acyl-CoA synthetase, BACS; fatty acid transport protein 5, FATP5) is a liver-enriched
  member of the FATP subfamily of ATP-dependent AMP-binding (ANL superfamily) acyl-CoA synthetases. The 700-residue
  horse protein has an N-terminal hydrophobic membrane anchor, a large AMP-binding catalytic domain and the conserved
  AMP-binding C-terminal subdomain. By orthology to the experimentally characterised human and mouse enzymes, it
  is an endoplasmic reticulum membrane enzyme whose main role is the ATP-dependent activation of C24 bile acids
  (cholate, chenodeoxycholate and the secondary bile acids deoxycholate and lithocholate) to their CoA thioesters,
  the first step of bile acid conjugation with glycine or taurine, so that bile acids returning to the liver through
  the enterohepatic circulation are re-conjugated. It also activates long-chain and very-long-chain fatty acids (C18
  to C26) to acyl-CoAs, and a pool at the basal (sinusoidal) plasma membrane of hepatocytes contributes to hepatic
  long-chain fatty acid uptake. None of these functions has been tested on the horse protein itself.
