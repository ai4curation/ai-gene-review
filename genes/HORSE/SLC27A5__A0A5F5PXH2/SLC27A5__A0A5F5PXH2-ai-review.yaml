suggested_questions:
- question: Should GO:0002152 bile acid conjugation be annotated to SLC27A5? The GO term comment names cholate-CoA
    ligase activity as the first step of the process, the mouse knockout abolishes most conjugation, yet in human
    only BAAT carries the term.
- question: The horse UniProt record names this gene ZBTB45 (VGNC:25152) with SLC27A5 only as a synonym, although
    its Ensembl gene, CTD cross-reference (10998, human SLC27A5) and PANTHER subfamily all identify SLC27A5. Is the
    VGNC assignment a mapping error caused by the adjacent ZBTB45 locus?
suggested_experiments:
- description: Express recombinant horse SLC27A5 (A0A5F5PXH2) and assay cholate-, chenodeoxycholate- and lignocerate-CoA
    ligase activity, with subcellular fractionation of horse liver to confirm ER-membrane localisation.
