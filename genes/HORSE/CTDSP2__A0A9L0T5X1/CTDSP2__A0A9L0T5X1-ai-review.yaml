- description: Mg2+-dependent, aspartate-nucleophile dephosphorylation of phospho-Ser5 in the RNA polymerase
    II CTD heptad repeats, restraining promoter clearance and repressing transcription of target genes.
    The activity is inferred from human SCP2 through PTHR12210:SF187 orthology and full conservation
    of the catalytic residues. It has not been assayed in horse.
