- term:
    id: GO:0006357
    label: regulation of transcription by RNA polymerase II
  evidence_type: IEA
  original_reference_id: GO_REF:0000108
  qualifier: involved_in
  supporting_entities:
  - GO:0008420
  review:
    summary: The process is correct but less specific than the ortholog evidence, which shows that SCP2
      restrains RNA polymerase II transcription.
    action: MODIFY
    reason: This row is a logical inference from the CTD phosphatase activity. The phosphatase itself
      does the regulating step, by removing the Ser5 phosphate that promoter clearance needs, so this is
      participation, not a necessity claim. The direction is negative in every experimental study of the
      ortholog. In human cells, SCP2 silencing led to earlier Ser5 CTD phosphorylation and higher androgen-dependent
      transcription (PMID:16724108). REST recruits SCPs to RE-1 neuronal genes, where they silence those
      genes (PMID:15681389). The refinement to negative regulation of transcription by RNA polymerase II
      matches the human CTDSP2 review. It is an orthology inference with no horse experiment behind it,
      and it is supported by the near-identity of the catalytic domain within PTHR12210:SF187.
    supported_by:
    - reference_id: PMID:16724108
      supporting_text: Ser 5 phosphorylation of the RNA polymerase II CTD, a process necessary for initiation
        of transcription elongation, occurred significantly earlier in SCP2-silenced than parental LNCaP
        cells.
    - reference_id: PMID:15681389
      supporting_text: We show that REST/NRSF recruits SCPs to neuronal genes that contain RE-1 elements,
        leading to neuronal gene silencing in non-neuronal cells.
    proposed_replacement_terms:
    - id: GO:0000122
      label: negative regulation of transcription by RNA polymerase II
- term:
    id: GO:0008420
    label: RNA polymerase II CTD heptapeptide repeat phosphatase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN000954535
  - UniProtKB:O14595
  - UniProtKB:Q9GZU7
  review:
    summary: RNA polymerase II CTD heptapeptide repeat phosphatase activity is the defining catalytic
      activity of the small CTD phosphatases and is soundly inherited by the horse CTDSP2 product.
    action: ACCEPT
    reason: The PAINT IBD for GO:0008420 sits at node PTN000954535, which spans the SCP clade (CTDSP1
      SF139, CTDSP2 SF187, CTDSPL SF43). It is seeded by experimental annotations of human CTDSP2 (O14595)
      and CTDSP1 (Q9GZU7). Horse is not a PANTHER reference proteome, and InterPro assigns A0A9L0T5X1 only
      to family PTHR12210, with no subfamily. Placement inside the clade therefore rests on sequence analysis.
      The catalytic region is 100% identical to cow CTDSP2 and 99.4% identical to human CTDSP2, both SF187,
      but only 82% identical to CTDSPL and 78% to CTDSP1, and VGNC names the gene CTDSP2. Every residue
      the activity depends on is conserved (Asp148, Asp150, Thr204, Lys242, Asn259), so there is no sign
      of lineage-specific loss. PAINT propagated only this molecular function from the node, with no process
      or location terms, and that choice is respected here. No horse protein has been assayed.
    supported_by:
    - reference_id: file:HORSE/CTDSP2__A0A9L0T5X1/CTDSP2__A0A9L0T5X1-bioinformatics/RESULTS.md
      supporting_text: '| human CTDSP2 O14595 (SF187) | 174 | 0.994 |'
    - reference_id: file:HORSE/CTDSP2__A0A9L0T5X1/CTDSP2__A0A9L0T5X1-bioinformatics/RESULTS.md
      supporting_text: '| 109 | D | ACT_SITE proton donor; Mg2+ binding | 150 | D | True |'
