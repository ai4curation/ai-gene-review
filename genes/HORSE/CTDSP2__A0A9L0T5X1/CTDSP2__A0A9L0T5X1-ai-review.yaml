  qualifier: enables
  supporting_entities:
  - EC:3.1.3.16
  review:
    summary: Protein serine/threonine phosphatase activity is correct for this catalytically intact SCP
      phosphatase, and it is the term that covers the Smad1 C-terminal phosphoserine activity, which has
      no substrate-specific GO term.
    action: ACCEPT
    reason: The EC 3.1.3.16 mapping itself rests on an ARBA name rule, which is not independent support.
      The claim stands on other grounds. The horse protein carries the FCP1 domain, the conserved DLDET
      catalytic motif and PIRSR-annotated active-site residues, and its catalytic region is 99.4% identical
      to human CTDSP2 and 100% identical to cow CTDSP2, both members of PANTHER subfamily PTHR12210:SF187.
      Human SCP-family enzymes are experimentally established protein phosphoserine phosphatases acting
      on the RNA polymerase II CTD (PMID:12721286) and on Smad1 (PMID:16882717, which also assayed Xenopus
      SCP2/Os4). The activity is inferred by orthology, not assayed on the horse protein. GO:0008420 is
      a child of this term and covers the CTD activity. This broader term is kept as precise as warranted
      for the Smad1 activity, as in the human ortholog review.
