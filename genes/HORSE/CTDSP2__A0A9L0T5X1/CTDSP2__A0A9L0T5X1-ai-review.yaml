id: A0A9L0T5X1
gene_symbol: CTDSP2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9796
  label: Equus caballus
description: A0A9L0T5X1 is the 312-residue product of the Ensembl canonical transcript of the horse CTDSP2
  gene (VGNC:16932, ENSECAG00000018788 on chromosome 6), the horse ortholog of human small C-terminal
  domain phosphatase 2 (SCP2). It is a small phosphatase of the FCP/SCP branch of the haloacid dehalogenase
  (HAD) superfamily. Its C-terminal FCP1-homology domain (residues 138-296) is 99.4% identical to that
  of human CTDSP2 and keeps the Mg2+-dependent DLDET motif, with Asp148 as the predicted phosphoaspartyl
  nucleophile and Asp150 as the proton donor, together with both transition-state residues (Thr204 and
  Lys242) and the third Mg2+ ligand (Asn259). By orthology with the human and Xenopus proteins, it is
  expected to act in the nucleus, removing phosphate from Ser5 of the RNA polymerase II C-terminal heptad
  repeats and from the C-terminal phosphoserines of Smad1, thereby restraining transcription of target
  genes and terminating BMP signalling. No experimental study of the horse protein exists. Its predicted
  N-terminus is longer than that of the human protein and does not start with methionine, so the exact
  start of the horse protein is unresolved.
