suggested_questions:
- question: Where does the horse CTDSP2 protein start? The canonical Ensembl model (A0A9L0T5X1) has an
    N-terminal extension that does not begin with methionine, and it skips the exon that encodes human
    SDLLQCLQYQFYQ, which the 252-aa model A0A9L0R207 keeps.
- question: Should GO propagate the nuclear location and the BMP-Smad1 role of the SCP clade? PAINT node
    PTN000954535 propagates only GO:0008420.
suggested_experiments:
- description: Run 5'-RACE and long-read cDNA sequencing of horse CTDSP2 transcripts to fix the true translation
    start and exon structure of the full-length product.
- description: Assay recombinant horse CTDSP2 catalytic domain (with a D148A control) for Mg2+-dependent
    dephosphorylation of phospho-Ser5 CTD peptides and of C-terminally phosphorylated Smad1.
