  review:
    summary: PAINT inference from node PTN002010604 (human ALKAL1/ALKAL2 and zebrafish members). Horse ALKAL2
      is in the same PANTHER subfamily as human ALKAL2 and retains the full augmentor domain, so the
      ligand-activator function is soundly inherited. The term, however, names an activator of a
      "receptor signaling protein tyrosine kinase", whereas ALK and LTK are transmembrane receptor tyrosine
      kinases activated from outside the cell.
    action: MODIFY
    reason: The activity is correct but the term is the wrong sibling. GO:0030298 and GO:0030297
      (transmembrane receptor protein tyrosine kinase activator activity) are both children of GO:0030296;
      GO:0030297 is defined as binding to and increasing the activity of a transmembrane receptor protein
      tyrosine kinase, which is exactly what ALKAL2 does to ALK and LTK. This is a lateral correction, not a
      refinement; the inherited claim itself is upheld.
