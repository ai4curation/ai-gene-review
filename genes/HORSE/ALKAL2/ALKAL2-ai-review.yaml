id: F6XWZ3
gene_symbol: ALKAL2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9796
  label: Equus caballus
description: ALKAL2 (ALK and LTK ligand 2, also called FAM150B or augmentor-alpha) is a small secreted
  cytokine that acts as an activating ligand for the receptor tyrosine kinases ALK and LTK. Its conserved
  C-terminal augmentor domain, a three-helix bundle held by two intramolecular disulfides, binds the receptor
  extracellular region and drives receptor dimerization close to the plasma membrane, where ligand-membrane
  contacts stabilize the signaling complex. Receptor activation leads to downstream ERK1/2 and ERK5 MAP kinase
  signaling, with roles in neural development and energy expenditure described for the ortholog. The horse
  entry F6XWZ3 (271 aa) is the Ensembl-canonical gene model, which carries a 119-residue Arg/Gly/Ala/Pro-rich
  N-terminal extension absent from other mammals; residues 120-271 are identical to the 152-residue horse
  model A0A3Q2I4Q6 and contain the full signal peptide and an intact augmentor domain. Like other non-primate
  orthologs, horse ALKAL2 lacks the cysteine that forms the interchain disulfide in human ALKAL2.
