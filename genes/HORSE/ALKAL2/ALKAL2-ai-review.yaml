suggested_questions:
- question: Is the 119-residue N-terminal extension of the Ensembl-canonical horse model (F6XWZ3) ever
    translated, or is the 152-residue product starting at Met120 (A0A3Q2I4Q6, RefSeq XP_001503231) the only
    real protein? An internal signal peptide would be expected to compromise secretion of the long form.
- question: Should ALK/LTK ligands be annotated to GO:0030297 (transmembrane receptor protein tyrosine kinase
    activator activity) rather than GO:0030298, which is currently used for human ALKAL1/ALKAL2 by IDA and
    propagated by PAINT?
suggested_experiments:
- hypothesis: Horse ALKAL2 is translated from Met120 of the F6XWZ3 model, giving a 152-residue secreted protein.
  description: 5'-RACE or long-read transcript sequencing from horse adrenal gland or kidney to define the
    true translation start of ALKAL2, followed by N-terminal sequencing of the secreted protein.
  experiment_type: transcript mapping
- hypothesis: The 152-residue horse ALKAL2 activates ALK and LTK like the human ortholog.
  description: Test conditioned medium from cells expressing the 152-residue horse ALKAL2 for activation of
    horse or human ALK and LTK (receptor phosphorylation, pERK1/2).
  experiment_type: cell-based receptor activation assay
