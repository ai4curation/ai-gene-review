  review:
    summary: Combined IEA (InterPro VDCC beta signatures) assigns pore activity to a subunit that has no pore.
    action: MODIFY
    reason: CACNB3 is the cytoplasmic auxiliary beta subunit; the calcium-conducting pore is formed by the alpha1
      subunit. The horse protein is the beta3 ortholog (99.78% core identity to human CACNB3 versus 63-74% to the
      other beta paralogs), and human beta3 modulates channel current amplitude and gating when coexpressed with
      alpha1. The correct molecular function is calcium channel regulator activity.
