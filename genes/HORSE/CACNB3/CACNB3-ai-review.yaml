taxon:
  id: NCBITaxon:9796
  label: Equus caballus
description: CACNB3 encodes the beta3 auxiliary subunit of high voltage-activated calcium channels. It is a cytoplasmic
  protein built from an SH3 domain, a HOOK region and a catalytically inactive guanylate-kinase-like domain; the
  guanylate-kinase-like domain binds the alpha-interaction domain in the intracellular I-II loop of the pore-forming
  alpha1 subunit. By binding alpha1, beta3 increases channel surface expression and peak current and shifts the
  voltage dependence of activation and inactivation of L-type (Cav1) and N-type (Cav2.2) channels, so it controls
  calcium influx in neurons, smooth muscle and other excitable cells. The horse entry A0A5F5PZM5 is an alternative
  first-exon model of the gene whose conserved core is almost identical to human beta3.
