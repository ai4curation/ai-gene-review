    summary: Human CACNB3 coexpression experiments demonstrate modulation of voltage-dependent calcium
      channels (PMID:8119293). The horse protein spans the complete human reference with 97.11% identity,
      supporting conservation of the regulatory beta-subunit architecture. Regulation of ion transmembrane
      transport is therefore supported without assigning a pore-forming function to the beta subunit.
      The exact process term is absent from target GOA, which contains calcium-transport and channel-complex
      annotations; this is target annotation novelty, not evidence about model training. Training-set
      membership is unknown.
