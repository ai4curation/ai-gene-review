    id: GO:0034765
    label: regulation of monoatomic ion transmembrane transport
  predicted_term_type: GO_BP
  review:
    assessment: COR
    confidence_score: 2
    summary: Beta subunits regulate high voltage-activated calcium channel currents without forming the
      pore. Coexpression of human beta3 modulates voltage-dependent calcium channel activity (PMID:8119293),
      and rat beta3 coexpressed with a cardiac alpha1 increases peak current, shifts the voltage dependence
      of activation and accelerates activation and inactivation (PMID:7679112). The horse protein is 99.78%
      identical to human CACNB3 over the shared core and groups with the beta3 lineage (PTHR11824:SF8) rather
      than the other beta paralogs, so this beta3-specific evidence transfers. The horse gene review records
      the same role as calcium channel regulator activity in its core function. Horse GOA carries calcium
      ion transport, calcium ion transmembrane transport and channel-complex terms but no regulation-of-transport
      process term, so the prediction is novel for the target. It is a correct but general parent of the
      positive regulation of voltage-gated calcium channel activity that the evidence supports. Training-set
      membership is unknown.
    supported_by:
    - reference_id: file:human/CACNB3/CACNB3-uniprot.txt
      supporting_text: 'CC   -!- FUNCTION: Regulatory subunit of the voltage-gated calcium channel that

        CC       gives rise to L-type calcium currents (PubMed:8119293). Increases

        CC       CACNA1B peak calcium current and shifts the voltage dependencies of

        CC       channel activation and inactivation (By similarity). Increases CACNA1C

        CC       peak calcium current and shifts the voltage dependencies of channel

        CC       activation and inactivation (By similarity).

        CC       {ECO:0000250|UniProtKB:P54287, ECO:0000250|UniProtKB:Q9MZL3,

        CC       ECO:0000269|PubMed:8119293}.'
    - reference_id: file:HORSE/CACNB3/CACNB3-bioinformatics/RESULTS.md
      supporting_text: The horse sequence A0A5F5PZM5 (517 residues) aligns to human P54284 (484 residues)
        with 97.11% identity across 484 paired residues. Paired coverage is 100.0% of the human sequence
        and 93.62% of the horse sequence.
    - reference_id: PMID:7679112
      supporting_text: Coexpression of beta 3 with a cardiac alpha 1 in Xenopus oocytes induces similar
        changes in Ca2+ channel activity as beta 1 and beta 2, that is, it increases peak currents, modulates
        the voltage dependence of activation, and accelerates activation.
    - reference_id: file:HORSE/CACNB3/CACNB3-bioinformatics/RESULTS-rereview.md
      supporting_text: Over the shared core, A0A5F5PZM5 is 99.78% identical to human CACNB3 (P54284; 464/465
        paired residues)
    - reference_id: PMID:8119293
      supporting_text: 'The cloned H beta 3

        subunit was further expressed in Xenopus oocytes to demonstrate its ability to

        modulate VDCC activity.'
