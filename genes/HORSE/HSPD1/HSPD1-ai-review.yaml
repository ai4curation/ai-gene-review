core_functions:
- description: >-
    Gene-level function of horse HSPD1, inherited from the PTHR45633 PAINT nodes PTN000143677
    (protein folding) and PTN000143509 (mitochondrial matrix): ATP-dependent protein folding
    chaperone that, with the Hsp10 co-chaperonin, folds imported and stress-denatured proteins
    in the mitochondrial matrix. The full-length horse product is A0A9L0S8L8; this F6Z587
    model lacks 32 residues of the intermediate hinge domain, and whether its product is
    competent for the folding cycle is unresolved.
