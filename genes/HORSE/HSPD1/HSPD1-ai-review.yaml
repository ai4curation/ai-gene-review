suggested_questions:
- question: Is the horse HSPD1 transcript that skips the 96-bp exon at chr18:72882811-72882906
    (ENSECAT00000009419, UniProt F6Z587) supported by RNA-seq junction reads, or is it a
    gene-build artefact?
- question: Is the 14-residue N-terminal extension (MKAHLTKRNSASSE) of the Ensembl canonical
    horse model A0A9L0S8L8 real, given that human and F6Z587 both start at MLRLP?
suggested_experiments:
- description: Express the F6Z587 product (lacking mature residues 145-176) alongside the
    full-length horse Hsp60 and test tetradecamer assembly, Hsp10 binding and ATP-dependent
    refolding of malate dehydrogenase or rhodanese in vitro.
