- term:
    id: GO:0005832
    label: chaperonin-containing T-complex
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: part_of
  supporting_entities:
  - ARBA:ARBA00029273
  review:
    summary: Wrong complex. HSPD1 is a type I (GroEL-like) chaperonin; the chaperonin-containing
      T-complex (CCT/TRiC) is the cytosolic type II chaperonin built from TCP-1 subunits.
    action: REMOVE
    reason: The ARBA rule conflates the two chaperonin types because both share the
      Cpn60/TCP-1 fold signature (InterPro IPR002423, IPR017998). HSPD1 belongs to PTHR45633
      (Cpn60/GroEL), not to the TCP-1 family that makes up CCT, and it acts in the
      mitochondrial matrix with Hsp10, not in the cytosol. No member of PTHR45633 carries this
      complex in the PAINT data, and the human structure defines the HSPD1 assembly as the
      type I Hsp60-Hsp10 system. The exon skip in F6Z587 does not bear on this.
    supported_by:
    - reference_id: PMID:25918392
      supporting_text: Human mitochondria harbor a single type I chaperonin system
    - reference_id: file:human/HSPD1/HSPD1-uniprot.txt
      supporting_text: Belongs to the chaperonin (HSP60) family
- term:
    id: GO:0006457
    label: protein folding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR018370
  review:
    summary: Protein folding is the function of the horse HSPD1 gene, but this exon-skipped
      product lacks part of the hinge domain on which the folding cycle depends.
    action: UNDECIDED
    reason: Protein folding is a PAINT IBD at the family root node PTN000143677 (seeded by
      E. coli GroEL, M. tuberculosis GroEL1/2, yeast HSP60 and human P10809), so it is the
      ancestral function of the gene. The full-length horse product A0A9L0S8L8 has every human
      residue and inherits this IBA. F6Z587, however, omits 32 of the 54 residues of the first
      segment of the intermediate hinge domain (mature 138-191; PMID:32317635). The hinge
      couples ATP binding in the equatorial domain to the apical-domain movement that
      encapsulates substrate. Even single substitutions elsewhere in mammalian Hsp60 (D3G,
      V72I) destabilise the complex in the presence of nucleotide and abolish folding
      (PMID:31444388). No evidence was found that the exon-skipped transcript is expressed or
      that its product oligomerises. The gene-level function is not in doubt; whether this
      particular product performs it is unknown, so the row is left undecided rather than
      accepted or removed.
    supported_by:
    - reference_id: file:interpro/panther/PTHR45633/PTHR45633-paint.tsv
      supporting_text: SGD:S000004249|UniProtKB:P0A6F5|UniProtKB:P10809|UniProtKB:P9WPE7|UniProtKB:P9WPE9
