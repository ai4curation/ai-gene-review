  review:
    summary: ATP binding by the equatorial domain; the equatorial nucleotide-binding residues
      are all retained in this exon-skipped model.
    action: ACCEPT
    reason: Nucleotide binding is a conserved property of the whole Cpn60/GroEL family
      (PTHR45633; InterPro IPR001844) and is carried by the equatorial domain (mature residues
      1-137 and 411-526 in the human structure, PMID:32317635). The 32-residue deletion in
      F6Z587 falls entirely inside the intermediate hinge domain (mature 145-176), and every
      human ATP-binding position maps to an identical horse residue. ATP binding is a narrower
      claim than ATP-dependent folding, and it does not depend on the hinge region. Accepted;
      the folding activity itself is judged separately below.
