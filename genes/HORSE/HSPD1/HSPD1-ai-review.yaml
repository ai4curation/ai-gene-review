id: F6Z587
gene_symbol: HSPD1
product_type: PROTEIN
status: IN_PROGRESS
taxon:
  id: NCBITaxon:9796
  label: Equus caballus
description: >-
  HSPD1 (Hsp60, mitochondrial chaperonin 60) is the mitochondrial member of the type I
  (GroEL-like) chaperonin family. In mammals it is imported into the mitochondrial matrix via
  an N-terminal transit peptide and assembles into heptameric rings that, with the HSPE1/Hsp10
  co-chaperonin, form ATP-driven folding chambers that fold newly imported and stress-denatured
  matrix proteins. Each subunit has an equatorial ATP-binding domain, an intermediate hinge
  domain that couples nucleotide state to movement, and an apical substrate- and
  Hsp10-binding domain. The horse HSPD1 gene on chromosome 18 encodes this chaperonin; this
  UniProt entry (F6Z587, 541 aa) is an alternative gene model that skips one 96-bp coding exon
  and so lacks 32 residues of the intermediate hinge domain (human P10809 residues 171-202),
  while keeping the transit peptide, the equatorial ATP-binding residues and the apical domain.
  Whether a product of this model can cycle as a chaperonin is untested. The full-length
  horse product is represented by A0A9L0S8L8.
