  review:
    summary: The cold-response transfer requires its specific ortholog experiment.
    action: UNDECIDED
    reason: General stress-induced chaperoning is compatible with cold stress but does not establish this
      precise response in human or horse. The ISS source is not resolved here, and no horse-specific cold-response
      assay has been inspected.
