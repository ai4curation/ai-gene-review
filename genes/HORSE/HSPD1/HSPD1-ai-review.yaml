id: F6Z587
gene_symbol: HSPD1
product_type: PROTEIN
status: IN_PROGRESS
taxon:
  id: NCBITaxon:9796
  label: Equus caballus
description: HSPD1/Hsp60 is a mitochondrial type I chaperonin-family protein. The selected horse sequence
  retains the mitochondrial precursor region and conserved nucleotide-binding positions, but has an internal
  32-residue deletion relative to canonical human Hsp60. Family identity is secure; the functional consequences
  of that deletion for Hsp10-assisted folding and oligomerization remain unresolved.
existing_annotations:
- term:
    id: GO:0005524
    label: ATP binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR002423
  - InterPro:IPR018370
  review:
    summary: Conserved nucleotide-binding residues support ATP binding.
    action: ACCEPT
    reason: The chaperonin fold and nucleotide-binding positions are conserved in the selected horse sequence,
      even though the internal deletion limits assessment of complete folding-cycle function. ATP binding
      is a narrower claim than efficient ATP-dependent substrate folding.
    supported_by:
    - reference_id: file:human/HSPD1/HSPD1-uniprot.txt
      supporting_text: ATP
