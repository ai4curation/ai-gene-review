    summary: Transferred from chicken HSPD1, whose Hsp60 mRNA rises in cold-stressed heart;
      a stress-induction observation, kept as non-core.
    action: KEEP_AS_NON_CORE
    reason: The ISS donor Q5ZL72 is chicken HSPD1, a member of the same PANTHER family
      (PTHR45633) and a vertebrate ortholog of horse HSPD1. The source study measured increased
      Hsp60 mRNA in chicken hearts under cold stress. That is induction of the gene as part of
      a general stress response, which is consistent with the stress-inducible chaperonin role
      but does not show a cold-specific mechanism. The claim concerns the gene's regulation
      rather than the activity of this specific protein model, so the exon skip does not
      affect it. Kept as a peripheral annotation, matching the human HSPD1 review of the same
      transfer.
