      supporting_text: '| BINDING | 111–115 | 111,112,113,114,115 | 5/5 |'
- term:
    id: GO:0005759
    label: mitochondrial matrix
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  supporting_entities:
  - UniProtKB-SubCell:SL-0170
  review:
    summary: The mitochondrial matrix is the principal chaperonin compartment.
    action: ACCEPT
    reason: The mammalian Hsp60/Hsp10 folding system acts in mitochondria. The selected horse sequence
      retains the N-terminal mitochondrial precursor region, supporting targeting independently of uncertain
      catalytic consequences of the internal deletion.
    supported_by:
    - reference_id: PMID:25918392
      supporting_text: Human mitochondria harbor a single type I chaperonin system
- term:
    id: GO:0005832
    label: chaperonin-containing T-complex
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: part_of
  supporting_entities:
  - ARBA:ARBA00029273
  review:
    summary: Hsp60 is a type I chaperonin, not a subunit of the cytosolic TRiC/CCT complex.
    action: REMOVE
    reason: The selected sequence belongs to the Cpn60/GroEL branch and retains a mitochondrial precursor
      segment. Human structural/biochemical work establishes the Hsp60/Hsp10 type I system. The internal
      deletion does not turn it into a CCT paralog. The ARBA assertion and ProtNLM narrative agree on
      an incorrect complex identity; their agreement is not biological validation.
    supported_by:
    - reference_id: PMID:25918392
      supporting_text: Human mitochondria harbor a single type I chaperonin system
- term:
    id: GO:0006457
    label: protein folding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR018370
  review:
    summary: Hsp60/Hsp10 ATP-dependent folding is established for the intact mammalian chaperonin.
    action: UNDECIDED
    reason: Purified mammalian Hsp60 with Hsp10 restores activity to unfolded substrate in an ATP-dependent
      reaction. This establishes folding/refolding, ATP-driven chaperoning and partner-assisted assembly.
      For the selected horse model, deletion of human 171–202 requires assessment of the apical-domain
      transition and oligomeric cycle before transferring full functional competence; conservation alone
      does not resolve that deletion.
    supported_by:
    - reference_id: PMID:1346131
      supporting_text: 'facilitates the formation of catalytically active ribulose-bisphosphate

        carboxylase from an unfolded state in the presence of K+ and MgATP.'
