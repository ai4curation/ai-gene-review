suggested_questions:
- question: >-
    Is the DARS2 transcript that skips the 108-nt exon (ENSECAT00000125808, encoding
    A0A9L0SB67) supported by horse RNA-seq or long-read data, and is the same exon skip
    seen in other mammals?
  experts: []
- question: >-
    Does removal of residues equivalent to human 341-376, at the start of the bacterial-type
    insertion domain, affect folding, dimerisation or tRNA(Asp) aminoacylation of
    mitochondrial AspRS?
  experts: []
suggested_experiments:
- description: >-
    Express the full-length (A0A3Q2HM61) and exon-skipped (A0A9L0SB67) horse DARS2
    products, compare tRNA(Asp) aminoacylation kinetics and oligomeric state, and test
    whether the short isoform rescues mitochondrial translation in DARS2-deficient cells.
  experiment_type: in vitro aminoacylation assay and complementation
