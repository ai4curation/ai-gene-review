core_functions:
- description: >-
    Catalyses ATP-dependent attachment of L-aspartate to mitochondrial tRNA(Asp) as a
    homodimeric class II synthetase in mitochondria, supplying charged tRNA for
    mitochondrial protein synthesis. Transferred from the human ortholog, which lies in
    the same PANTHER subfamily (PTHR22594:SF5) and below the same PAINT nodes; the
    benchmark isoform lacks part of the insertion domain and its own activity is
    untested.
  molecular_function:
    id: GO:0004815
    label: aspartate-tRNA ligase activity
