  supporting_entities:
  - InterPro:IPR004365
  review:
    summary: >-
      Correct but too general; the nucleic acid bound by the OB-fold anticodon-binding
      domain is tRNA(Asp), so tRNA binding is the appropriate term.
    action: MODIFY
    reason: >-
      The InterPro OB-fold anticodon-binding signature (IPR004365) that drives this
      mapping is the domain that recognises the tRNA anticodon. In the human DARS2
      structure the residues that contact the anticodon and acceptor-end bases of tRNA
      are conserved with E. coli AspRS, and the tRNA-binding surface is unusually
      electropositive. The horse gene is a one-to-one ortholog of human DARS2 within
      PANTHER PTHR22594:SF5, and the anticodon-binding domain is intact in this isoform.
      tRNA binding (GO:0000049), an is_a descendant of nucleic acid binding, is the
      supported specific term. It is subsidiary to the ligase activity.
    supported_by:
    - reference_id: PMID:23275545
      supporting_text: Otherwise, almost all residues making direct and specific interactions with bases at both ends of the Eco tRNA are conserved in the human enzyme
    - reference_id: PMID:23275545
      supporting_text: Electropositive patches render HsaDRS2 more attractive for its RNA partner
    - reference_id: file:HORSE/DARS2/DARS2-bioinformatics/RESULTS-rereview.md
      supporting_text: It is the one-to-one ortholog of human DARS2 within SF5.
    proposed_replacement_terms:
