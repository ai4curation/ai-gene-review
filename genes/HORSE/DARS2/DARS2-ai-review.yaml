  - InterPro:IPR004364
  review:
    summary: >-
      Correct but too general; DARS2 is specifically an aspartate-tRNA ligase.
    action: MODIFY
    reason: >-
      Human DARS2 aminoacylates tRNA(Asp) with aspartate (direct kinetic measurements),
      and PAINT curators placed aspartate-tRNA ligase activity at the PTHR22594:SF5 root
      node PTN000502597, from which the horse DARS2 gene descends. All aspartate- and
      ATP-binding residues are conserved in this horse isoform, and the HAMAP
      type-1 AspRS rule (MF_00044) matches it. The amino-acid specificity is therefore
      supported and GO:0004815 aspartate-tRNA ligase activity is the correct specific
      term. Aspartate-tRNA(Asn) ligase activity (GO:0050560), which is annotated to human
      DARS2 from a single in vitro study, was not propagated by PAINT and is not
      transferred here. Activity of this particular exon-skipping isoform has not been
      tested; the call is made for the gene product.
    supported_by:
    - reference_id: PMID:15779907
      supporting_text: Both belong to the expected class of synthetases, have a dimeric organization, and aminoacylate Escherichia coli tRNAs as well as in vitro transcribed human mitochondrial tRNAs.
