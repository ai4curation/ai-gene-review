product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9796
  label: Equus caballus
description: DARS2 is the nuclear-encoded mitochondrial aspartate-tRNA ligase. It activates aspartate
  with ATP and transfers it to mitochondrial tRNA(Asp), supporting synthesis of mitochondrially encoded
  respiratory-chain proteins. The enzyme forms a homodimer and contains an N-terminal mitochondrial targeting
  sequence. The selected protein sequence has an internal or terminal difference from the characterized
  human protein, so its precise activity and regulation remain to be established.
