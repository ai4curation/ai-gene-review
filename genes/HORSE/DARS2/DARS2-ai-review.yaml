id: A0A9L0SB67
gene_symbol: DARS2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9796
  label: Equus caballus
description: >-
  DARS2 encodes the mitochondrial aspartate-tRNA ligase (mitochondrial aspartyl-tRNA
  synthetase), a nuclear-encoded class II aminoacyl-tRNA synthetase of the bacterial
  AspRS type. The enzyme is imported into mitochondria via an N-terminal arginine-rich
  targeting sequence and acts as a homodimer: it activates L-aspartate with ATP to form
  aspartyl-adenylate and transfers the aspartyl group to the 3' end of mitochondrial
  tRNA(Asp), supplying charged tRNA for synthesis of the 13 mtDNA-encoded
  respiratory-chain subunits. Each subunit has an N-terminal OB-fold anticodon-binding
  domain, a class II catalytic domain that binds ATP and aspartate, and a
  bacterial-type insertion domain that in the human enzyme is rotated to open the
  active-site groove for the tRNA acceptor arm. In human cells the enzyme is found in
  both the soluble and membrane-associated fractions of mitochondria. This horse entry
  (A0A9L0SB67, 616 aa) is the product of an alternative DARS2 transcript that skips one
  in-frame 108-nt exon, so it lacks 36 residues at the start of the insertion domain
  (human residues 341-376) while retaining the transit region, the anticodon-binding
  domain and every ATP- and aspartate-binding residue; whether this shorter isoform is
  expressed as a stable, active enzyme is unknown. The full-length horse product is
  A0A3Q2HM61 (652 aa).
