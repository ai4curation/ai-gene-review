  review:
    summary: Core molecular function. Horse DARS2 is the one-to-one ortholog of the experimentally
      characterised human mitochondrial aspartyl-tRNA synthetase, and all mapped substrate-binding
      residues are conserved. Inferred, not measured in horse.
    action: ACCEPT
    reason: The EC 6.1.1.12 assignment is backed by family classification (HAMAP MF_00044 type 1
      AspRS; NCBIfam TIGR00459 aspS_bact; PANTHER PTHR22594:SF5 "Aspartate--tRNA ligase,
      mitochondrial"). In the PANTHER 19 tree the horse leaf lies under PTN000502597, the SF5 root node
