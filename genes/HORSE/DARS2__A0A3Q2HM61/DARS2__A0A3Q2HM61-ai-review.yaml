  review:
    summary: A peripheral, electrostatically bound membrane pool is experimentally established for the
      human ortholog; its functional significance is unknown, so it is kept as non-core.
    action: KEEP_AS_NON_CORE
    reason: Human mt-AspRS partitions between soluble and membrane fractions of mitochondria and is
      released from membranes by salt, indicating peripheral electrostatic attachment (PMID:30006346).
