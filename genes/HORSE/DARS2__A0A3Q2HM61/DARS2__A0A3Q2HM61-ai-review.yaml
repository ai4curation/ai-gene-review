      PMID:23275545). The horse sequence is 89.9% identical to human Q6PI48 and conserves the
      aspartate-binding QQFK motif, the ATP/Asp-binding RDE, E535, R542 and GLDR residues. Type 1
      (discriminating) AspRS family membership argues for Asp-specific rather than
      non-discriminating Asp/Asn charging.
