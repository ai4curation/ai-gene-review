core_functions:
- description: Mitochondrial aspartyl-tRNA synthetase. Activates L-aspartate with ATP and esterifies it
    to mitochondrial tRNA(Asp), supplying Asp-tRNA(Asp) for mitochondrial protein synthesis. Inferred in
    horse from one-to-one orthology (PANTHER PTHR22594:SF5; PAINT node PTN000502597) with the
    experimentally characterised human enzyme and conservation of all mapped substrate-binding residues;
    not measured in horse.
