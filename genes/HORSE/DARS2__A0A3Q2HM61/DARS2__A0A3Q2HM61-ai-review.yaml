- id: PMID:23275545
  title: Thermodynamic properties distinguish human mitochondrial aspartyl-tRNA synthetase from bacterial
    homolog with same 3D architecture.
  findings:
  - statement: Human DARS2 (HsaDRS2) aminoacylates mitochondrial and E. coli tRNA(Asp) transcripts with
      similar efficiency and is a homodimer with a bacterial-type architecture, including an insertion
      domain at residues 337-470.
    supporting_text: the mt-aaRS charged both cognate and non-cognate tRNAs with similar efficiency
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Human ortholog kinetics and structure (full text cached). The insertion domain it
      defines is fully retained in A0A3Q2HM61.
- id: PMID:30006346
  title: Three human aminoacyl-tRNA synthetases have distinct sub-mitochondrial localizations that are
    unaffected by disease-associated mutations.
  findings:
  - statement: Human mt-AspRS is present in both soluble and membrane sub-mitochondrial fractions, and
      the membrane pool is held by electrostatic interactions.
    supporting_text: Chemical treatments revealed that mt-AspRs is anchored in the mitochondrial membrane
      through electrostatic interactions
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Human ortholog localization; supports matrix and peripheral membrane locations by
      orthology.
