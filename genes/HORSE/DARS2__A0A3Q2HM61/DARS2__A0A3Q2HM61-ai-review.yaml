- term:
    id: GO:0005524
    label: ATP binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR002312
  - InterPro:IPR004115
  - InterPro:IPR004364
  - InterPro:IPR004524
  review:
    summary: ATP is the activating co-substrate of the aspartylation reaction; the ATP-binding residues
      of the class II active site are conserved in horse DARS2.
    action: ACCEPT
    reason: Aspartate is activated by ATP to aspartyl-adenylate before transfer to tRNA(Asp). The class II
      catalytic domain signatures support ATP binding, and the human ATP-contacting residues (RDE
      266-268, E535, GLDR 584-587) are identical in the horse protein. This is part of the catalytic
      mechanism rather than an independent function, but it is accurate and as specific as the evidence
      allows.
    supported_by:
    - reference_id: file:HORSE/DARS2__A0A3Q2HM61/DARS2__A0A3Q2HM61-uniprot.txt
