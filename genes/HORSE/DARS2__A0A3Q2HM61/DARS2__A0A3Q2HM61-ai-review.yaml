gene_symbol: DARS2
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9796
  label: Equus caballus
description: DARS2 encodes the nuclear-encoded mitochondrial aspartate-tRNA ligase (mt-AspRS) of the
  horse, a bacterial-type class II aminoacyl-tRNA synthetase with an N-terminal Arg-rich mitochondrial
  targeting region, an anticodon-binding OB-fold domain, a bacterial-type insertion (GAD) domain and a
  class II catalytic domain. By orthology to the experimentally characterised human enzyme, it is
  imported into mitochondria, functions as a homodimer, activates L-aspartate with ATP to form
  aspartyl-adenylate and transfers it to mitochondrial tRNA(Asp), supplying Asp-tRNA(Asp) for
  translation of the mitochondrially encoded respiratory-chain subunits. It acts mainly in the
  mitochondrial matrix, with a pool peripherally associated with mitochondrial membranes in the human
  ortholog. The protein described here (A0A3Q2HM61, 652 aa) is the gene-centric canonical product of
  the horse gene and retains every substrate-binding residue mapped in the human enzyme and the full
  insertion domain. No function of horse DARS2 has been measured directly; all functions are inferred
  from its one-to-one orthology with human DARS2 within PANTHER subfamily PTHR22594:SF5.
