suggested_questions:
- question: Which of the seven protein-coding horse DARS2 transcripts are expressed in tissues, and do the
    isoforms lacking part of the insertion domain retain aminoacylation activity or act as dominant
    negatives in the dimer?
  experts: []
suggested_experiments:
- description: Express the mature form of A0A3Q2HM61 (lacking the transit peptide) and assay
    aminoacylation of horse mitochondrial tRNA(Asp) transcripts, alongside the 36-residue-deleted
    isoform A0A9L0SB67, to establish activity of the horse enzyme directly.
