  label: Equus caballus
description: >-
  FBXL20 (F-box/LRR-repeat protein 20; SCRAPPER in mouse) is the substrate-recognition
  subunit of an SCF (SKP1-CUL1-F-box) E3 ubiquitin ligase. An N-terminal F-box binds
  SKP1, linking the protein to the CUL1-RBX1 catalytic core, and a C-terminal array of
  cysteine-containing leucine-rich repeats binds substrates, which are then
  polyubiquitinated and degraded by the proteasome. Characterized mammalian substrates are
  the class III phosphatidylinositol 3-kinase VPS34/PIK3C3, whose CDK-phosphorylated form
  is degraded after DNA damage, reducing autophagy and receptor endocytosis; the PP2A
  regulatory subunit PR55alpha/PPP2R2A; and, in neurons, the presynaptic active-zone protein
  RIM1, whose turnover by SCRAPPER tunes synaptic vesicle release. FBXL20 expression is
  induced by p53. A C-terminal CAAX-type prenylation motif targets the protein to membranes
  and is needed for its punctate synaptic distribution. The horse protein is a 436-residue
  full-length product identical in sequence to human FBXL20 and is cytoplasmic and
  membrane-associated.
