suggested_questions:
- question: Should the effect of FBXL20-mediated VPS34 degradation on autophagy be captured as
    a regulation-of-autophagy process term for FBXL20, or only as has_input VPS34 on the SCF
    activity in a GO-CAM? No PAINT node propagates an autophagy term to the FBXL20 subfamily.
- question: Is horse FBXL20 prenylated at its C-terminal CAAX-type motif and localized to
    presynaptic membranes, as shown for mouse SCRAPPER?
suggested_experiments:
- description: Test whether horse FBXL20 co-immunoprecipitates SKP1, CUL1 and VPS34, and
    whether its knockdown in equine cells stabilizes VPS34 after DNA damage.
