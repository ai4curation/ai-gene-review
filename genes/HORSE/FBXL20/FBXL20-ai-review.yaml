- id: PMID:17803915
  title: SCRAPPER-dependent ubiquitination of active zone protein RIM1 regulates synaptic
    vesicle release.
  findings:
  - statement: Mouse SCRAPPER/Fbxl20 forms an SCF complex with Skp1 and Cullin1, binds and
      ubiquitinates RIM1, and is the main ligase for RIM1 degradation in neurons. Its CAAX
      prenylation signal is needed for its punctate distribution.
    supporting_text: SCRAPPER is the predominant ubiquitin ligase that mediates RIM1 degradation
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed esearch/esummary verified (Cell 2007, Yao et al.); full text cached.
      This is the founding study of the mouse ortholog, which is in the same PANTHER
      subfamily (SF47).
- id: PMID:25593308
  title: FBXL20-mediated Vps34 ubiquitination as a p53 controlled checkpoint in regulating
    autophagy and receptor degradation.
  findings:
  - statement: After DNA damage, CDK phosphorylation of Vps34 makes it a substrate for
      FBXL20 together with Skp1-Cullin1, leading to its proteasomal degradation and reduced
      autophagy and receptor endocytosis. FBXL20 expression is p53-dependent.
    supporting_text: the expression of FBXL20 is regulated by p53-dependent transcription
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed esearch/esummary verified (Genes Dev 2015, Xiao et al.); full text
      cached. Human cell study.
