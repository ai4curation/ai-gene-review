id: A0A3Q2LPC0
gene_symbol: FLCN
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9796
  label: Equus caballus
description: Folliculin (FLCN) is a cytoplasmic longin/DENN-domain protein that, as a heterodimer with FNIP1
  or FNIP2, is the GTPase-activating protein (GAP) for the lysosomal Rag GTPases RagC and RagD. An arginine
  finger in the longin domain (Arg164) stimulates GTP hydrolysis by RagC/D, which in amino-acid-replete cells
  allows mTORC1 to phosphorylate its non-canonical substrates TFEB and TFE3 and retain them in the cytoplasm.
  Under amino acid starvation FLCN-FNIP is recruited to the lysosomal membrane, where it is held in an inactive
  lysosomal folliculin complex with the Rag heterodimer and Ragulator. FLCN has also been reported at primary
  cilia, centrosomes, the mitotic spindle and the nucleus, and is implicated in autophagy, lysosome positioning
  and inhibition of lactate dehydrogenase A. Loss of FLCN causes Birt-Hogg-Dube syndrome in humans. The horse
  protein is a full-length ortholog (578 residues, 94.8% identical to human) that retains the catalytic
  arginine.
