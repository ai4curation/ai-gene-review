core_functions:
- description: As a heterodimer with FNIP1/FNIP2, FLCN is the GTPase-activating protein for RagC/RagD,
    supplying the catalytic arginine finger (Arg164); this activates mTORC1 toward TFEB/TFE3 in response to
    amino acids. FLCN-FNIP shuttles between the cytosol and the lysosomal membrane.
  molecular_function:
    id: GO:0005096
    label: GTPase activator activity
  directly_involved_in:
  - id: GO:1904263
    label: positive regulation of TORC1 signaling
  locations:
  - id: GO:0005765
    label: lysosomal membrane
  - id: GO:0005829
    label: cytosol
  in_complex:
    id: GO:1990877
    label: FNIP-folliculin RagC/D GAP
  supported_by:
  - reference_id: PMID:24095279
    supporting_text: we identified the FLCN-FNIP complex as a potent GTPase activating protein (GAP) for RagC/D
  - reference_id: file:HORSE/FLCN/FLCN-bioinformatics/RESULTS.md
    supporting_text: SITE human R164 -> horse R164 (Essential for GTPase activation (GAP) activity)
suggested_questions:
- question: Does horse FLCN inhibit LDHA as reported for human FLCN, and which N-terminal residues form the
    inhibitory loop? The horse N-terminal 30 residues are identical to human, but the disordered segment
    (31-82) carries most of the horse-human differences.
- question: Is the TGF-beta signalling effect of Flcn loss (mouse IMP, propagated to horse by PAINT) a direct
    function or a consequence of TFE3 deregulation, and should the propagated term be retained?
suggested_experiments:
- description: Measure RagC/RagD GAP activity of recombinant horse FLCN-FNIP2 and of an R164A mutant in vitro,
    and test TFEB/TFE3 nuclear localization in horse FLCN-knockout cells rescued with wild-type or R164A FLCN.
