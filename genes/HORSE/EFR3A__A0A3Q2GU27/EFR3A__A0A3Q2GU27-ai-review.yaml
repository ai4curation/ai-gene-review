  label: Equus caballus
description: >-
  EFR3A (protein EFR3 homolog A) of the horse is an 821-residue, non-enzymatic,
  all-alpha-helical ARM/HEAT-repeat scaffold of the EFR3 family (PANTHER PTHR12444:SF1,
  the EFR3A subfamily). In mammals EFR3A sits on the cytoplasmic face of the plasma
  membrane, held there by palmitoylation of an N-terminal cysteine cluster (Cys6-Cys9) and
  by a conserved basic patch that binds acidic phospholipids. Its C-terminal region binds
  the TTC7-FAM126 (hyccin) subcomplex of the phosphatidylinositol 4-kinase type III alpha
  (PI4KA) complex, so EFR3A tethers the kinase assembly to the plasma membrane, where PI4KA
  makes the plasma-membrane pool of phosphatidylinositol 4-phosphate. EFR3A has no catalytic
  activity of its own and is partly redundant with its paralog EFR3B. This record is the
  full-length, canonical-start product of the horse EFR3A gene (Ensembl ENSECAG00000014883);
  it is 98.5% identical to human EFR3A over its whole length and keeps the palmitoylation
  cluster, the basic patch and the TTC7-binding C terminus. No experiment has been
  reported on horse EFR3A; its functions are inferred from the human and mouse
  orthologs in the same PANTHER subfamily.
