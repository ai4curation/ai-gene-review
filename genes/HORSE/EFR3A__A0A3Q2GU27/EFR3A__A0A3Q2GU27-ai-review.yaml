suggested_questions:
- question: Which horse EFR3A transcripts are expressed as protein in which tissues? The gene also
    makes products with alternative first exons, including one (A0A9L0S4L8) that lacks the
    Cys6-Cys9 palmitoylation cluster.
- question: PAINT propagated plasma membrane and protein localization to plasma membrane at
    PTN000278197 but not a phosphoinositide biosynthesis term. Should the scaffold contribution of
    EFR3 to PI4P synthesis (annotated to human EFR3A by TAS) be captured at the family level?
suggested_experiments:
- description: Express tagged horse EFR3A (A0A3Q2GU27) and a C6S-C9S mutant in equine cells and
    measure plasma-membrane localization and recruitment of TTC7B/PI4KA, to confirm in horse the
    activity inferred from human EFR3A.
