- term:
    id: GO:0043495
    label: protein-membrane adaptor activity
  evidence_type: ISS
  original_reference_id: PMID:39705356
  qualifier: enables
  review:
    summary: Human EFR3A binds the plasma membrane through its palmitoylated N terminus and
      basic patch and binds the TTC7B-FAM126A subcomplex through its C terminus, tethering the
      PI4KA complex to the membrane. Proposed for horse by orthology within PTHR12444:SF1.
    action: NEW
    reason: GOA has no molecular function for horse EFR3A. The activity is established
      experimentally for human EFR3A (cryo-EM/HDX-MS structure and interface mutagenesis,
      PMID:39705356; palmitoylation-site mutants, PMID:23229899) and for mouse EFR3A
      (basic-patch mutant, PMID:24360784). Human, mouse and horse EFR3A are in the same PANTHER
      subfamily (PTHR12444:SF1). The horse protein keeps every residue that these experiments
      showed to be needed for the two binding faces. The human EFR3A review in this repository
      proposes the same term (genes/human/EFR3A). This is the molecular activity behind the two
      IBA rows, not a separate claim. It is an ISS transfer; no horse experiment exists.
    supported_by:
    - reference_id: PMID:39705356
      supporting_text: The EFR3A C terminus undergoes a disorder-order transition upon binding to the
        PI4KA complex, with an unexpected direct interaction with both TTC7B and FAM126A.
    - reference_id: PMID:24360784
      supporting_text: A conserved basic patch in Efr3, which binds acidic phospholipids, anchors the
        complex to the plasma membrane.
