  review:
    summary: PAINT IBD at PTN000278197, seeded by human EFR3A and EFR3B, both of which recruit
      TTC7B and PI4KA to the plasma membrane. Horse A0A3Q2GU27 descends from this node.
    action: ACCEPT
    reason: Recruiting the PI4KA complex to the plasma membrane is the core process EFR3
      proteins carry out, and EFR3A itself supplies the membrane anchor, so this is
      participation, not mere necessity. In horse the C-terminal TTC7B/FAM126A-binding region
      (human residues 724-787) is 63/64 identical to human, and the membrane anchor is intact.
      The node placement is sound and the target is inside it. The process is inferred for
      horse, not tested.
    supported_by:
    - reference_id: PMID:39705356
