  title: "PtdIns4P synthesis by PI4KIIIα at the plasma membrane and its impact on plasma membrane\
    \ identity."
  findings:
  - statement: Human EFR3A is palmitoylated on its N-terminal Cys6-Cys9 cluster, which is required
      for plasma-membrane localization; EFR3 is part of an evolutionarily conserved PI4KIIIalpha
      complex that targets the kinase to the plasma membrane.
    supporting_text: Importantly, palmitoylation-deficient mutants (C6S/C7S/C8S/C9S for EFR3A and
      C5S/C7S/C8S for EFR3B) were localized in the cytosol
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached. Human-cell study (EFR3A/EFR3B); primary source for
      palmitoylation-dependent plasma-membrane localization and PI4KA recruitment. No horse data.
- id: PMID:24360784
  title: Structural insights into assembly and regulation of the plasma membrane phosphatidylinositol
    4-kinase complex.
  findings:
  - statement: A conserved Efr3 basic patch binds acidic phospholipids; the equivalent basic-patch
      mutant of mouse EFR3A loses plasma-membrane localization.
    supporting_text: Whereas wild-type EFR3A-GFP localized to the plasma membrane
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text cached. The structure is of yeast Efr3, which PANTHER places outside
      PTHR12444, so it is not used for transfer. The mammalian test was on mouse EFR3A, which is in
      the same subfamily (PTHR12444:SF1) as horse A0A3Q2GU27.
- id: PMID:39705356
  title: Molecular basis for plasma membrane recruitment of PI4KA by EFR3.
  findings:
  - statement: The human EFR3A C terminus folds on binding TTC7B-FAM126A and contacts both directly;
      disrupting this interface lowers PI4KA plasma-membrane recruitment. EFR3A does not contact
      PI4KA directly.
    supporting_text: The EFR3A C terminus undergoes a disorder-order transition upon binding to the
      PI4KA complex, with an unexpected direct interaction with both TTC7B and FAM126A.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached. Human proteins; key evidence for the adaptor molecular function.
