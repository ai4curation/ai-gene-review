gene_symbol: GPC3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9796
  label: Equus caballus
description: >-
  Glypican-3 (GPC3) is an X-linked glypican, a cell-surface heparan sulfate proteoglycan
  attached to the outer leaflet of the plasma membrane by a glycosylphosphatidylinositol
  (GPI) anchor. The horse protein is the full-length 580-residue ortholog of human GPC3.
  It shares 96% identity with human GPC3 and sits in the same PANTHER GLYPICAN-3
  subfamily (PTHR10822:SF4). It keeps the conserved cysteine framework, the furin-like
  convertase site (RQYR355-358), the heparan sulfate attachment serines (S495, S509) and
  the GPI omega-site asparagine (N554). In human and mouse, a furin-like convertase
  cleaves the GPC3 core protein into disulfide-linked alpha and beta subunits. At the
  cell surface, GPC3 binds Wnt ligands and Frizzled receptors and promotes canonical Wnt
  signaling. In mouse, GPC3 binds Hedgehog ligands in competition with Patched and drives
  their endocytosis and degradation, which restrains Hedgehog signaling during
  development. GPC3 can also be released from the cell surface. Loss of GPC3 causes
  developmental overgrowth in humans (Simpson-Golabi-Behmel syndrome) and in mice. GPC3
  has not been studied experimentally in the horse, so these functions are inferred from
  the orthologs.
