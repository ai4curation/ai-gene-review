suggested_questions:
- question: >-
    PAINT propagated plasma membrane from the euteleostome GPC3-containing node
    (PTN002585559) but not negative regulation of smoothened signaling pathway. Mouse
    Gpc3 has experimental Hedgehog evidence. Should that term be propagated within the
    GPC3 subfamily, or is the omission deliberate?
- question: >-
    Does horse GPC3 restrain growth, and is it released into the circulation as in human
    fetal and liver-cancer contexts?
suggested_experiments:
- description: >-
    Express horse GPC3 in Gpc3-null mouse embryonic fibroblasts and test whether it
    competes with Patched for Sonic hedgehog binding and suppresses Gli reporter activity.
