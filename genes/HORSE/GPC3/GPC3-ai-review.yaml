- id: PMID:18477453
  title: Glypican-3 inhibits Hedgehog signaling during development by competing with patched for Hedgehog
    binding.
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Mouse Gpc3 study (cached abstract only). It shows that GPC3 binds Hedgehog, competes
      with Patched and induces Hedgehog endocytosis and degradation. It is the basis for
      the Hedgehog core function, which is transferred within the GPC3 subfamily.
  findings:
  - statement: GPC3 binds Hedgehog with high affinity, competes with Patched, and acts as a negative regulator
      of Hedgehog signaling.
    supporting_text: GPC3 competes with Patched for Hedgehog binding
