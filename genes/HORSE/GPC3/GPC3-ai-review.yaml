- term:
    id: GO:0016477
    label: cell migration
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - FB:FBgn0041604
  - FB:FBgn0263930
  - PANTHER:PTN002247069
  - UniProtKB:Q9Y625
  - WB:WBGene00001687
  - ZFIN:ZDB-GENE-011119-1
  - ZFIN:ZDB-GENE-031212-1
  review:
    summary: >-
      Cell migration was propagated from the eumetazoan glypican node. The donors are fly
      glypicans, human GPC6, the worm glypican and two zebrafish glypicans. For GPC3
      itself, convertase-processed GPC3 is needed for gastrulation cell movements in
      zebrafish. These movements depend on Wnt/PCP signaling, so the glypican regulates
      migration through signaling rather than performing it.
    action: KEEP_AS_NON_CORE
    reason: >-
      The PAINT curators placed this term deliberately at a deep node, and there is no
      evidence that GPC3 has lost the function. The role is indirect, through
      morphogen-signaling modulation, so it is kept but marked non-core.
    supported_by:
    - reference_id: PMID:14610063
      supporting_text: This processing is essential for GPC3 modulating Wnt
        signaling and cell survival in vitro and for supporting embryonic cell movements
        in zebrafish.
- term:
    id: GO:0031012
    label: extracellular matrix
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: located_in
  supporting_entities:
  - InterPro:IPR001863
  review:
    summary: >-
      This is the InterPro2GO mapping from the glypican family signature. Glypicans are
      GPI-anchored to the plasma membrane and are not structural components of the
      extracellular matrix. Unlike PAINT, which assigns extracellular region and cell
      surface, InterPro2GO assigns this location to the whole family without any
      GPC3-specific evidence.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      GPC3 is a membrane-anchored proteoglycan at the cell surface. The PAINT curators gave
      the family the cell surface and extracellular region terms but not extracellular
      matrix.
    supported_by:
    - reference_id: PMID:24496449
      supporting_text: Glypican-3 (GPC3) is a proteoglycan that is bound to the cell surface.
- term:
    id: GO:0090263
    label: positive regulation of canonical Wnt signaling pathway
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - FB:FBgn0263930
  - PANTHER:PTN000850517
  - UniProtKB:P51654
  review:
    summary: >-
      This term was propagated from the bilaterian node PTN000850517, with Drosophila Dlp
      and human GPC3 as donors. Human GPC3 interacts directly with Frizzled through its
      glycosaminoglycan chains and promotes Wnt-Frizzled signaling complexes. The horse
      protein keeps both heparan sulfate attachment serines and the furin site needed
      for Wnt modulation.
    action: ACCEPT
    reason: >-
      This is the core signaling role of GPC3. There is experimental evidence from the human
      ortholog in the same PANTHER subfamily (SF4), and the residues the role depends on
      are conserved.
    supported_by:
    - reference_id: PMID:24496449
      supporting_text: GPC3 and Frizzled interact
        directly through the glycosaminoglycan chains of GPC3, indicating that this
        glypican stimulates the formation of signaling complexes between Wnt and
        Frizzled.
    - reference_id: file:HORSE/GPC3/GPC3-bioinformatics/RESULTS.md
      supporting_text: The heparan sulfate attachment serines S495 and S509 are conserved.
- term:
    id: GO:1905475
    label: regulation of protein localization to membrane
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN002247069
  - RGD:1359399
  - RGD:1593308
  review:
    summary: >-
      This term was propagated from the eumetazoan glypican node, with two rat glypicans as
      donors. For GPC3, Wnt binding triggers endocytosis of a Wnt-Frizzled-GPC3 complex,
      and GPC3 induces Hedgehog endocytosis in mouse. Both effects change where signaling
      proteins sit relative to the membrane, but this is not a well-defined GPC3 activity.
    action: KEEP_AS_NON_CORE
    reason: >-
      The term is a family-level PAINT inference, and there is no evidence that GPC3 has
      lost the function. It is peripheral to the core signaling-modulation role.
    supported_by:
    - reference_id: PMID:24496449
      supporting_text: the binding of Wnt at the cell
        membrane triggers the endocytosis of a complex that includes Wnt, Frizzled and
        GPC3.
