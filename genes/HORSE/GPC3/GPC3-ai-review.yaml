  review:
    summary: >-
      Extracellular region was propagated from a eumetazoan glypican node (PTN002247069),
      with a mouse glypican as the only donor. Glypicans, GPC3 included, can be released
      from the cell surface, so a soluble pool exists. The functional pool of GPC3,
      however, is GPI-anchored at the plasma membrane.
    action: KEEP_AS_NON_CORE
    reason: >-
      The term is plausible for the shed or released form, which is inherited family-wide
      at PTN002247069. It is peripheral to the core function, which takes place in the
      plasma membrane. The PAINT node placement gives no reason to remove it.
