id: A0A3Q2H1L9
gene_symbol: VAPA
product_type: PROTEIN
status: IN_PROGRESS
taxon:
  id: NCBITaxon:9796
  label: Equus caballus
description: VAPA is an endoplasmic reticulum membrane-anchored adaptor of the VAMP-associated protein
  family. Its cytoplasmic major sperm protein (MSP) domain recognizes FFAT motifs in partner proteins,
  linking the endoplasmic reticulum to other membranes and supporting lipid-transfer contact sites. The
  horse protein retains the MSP domain, coiled-coil region and C-terminal membrane anchor characteristic
  of mammalian VAPA.
existing_annotations:
- term:
    id: GO:0005789
    label: endoplasmic reticulum membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: located_in
  supporting_entities:
  - InterPro:IPR016763
  - UniProtKB-SubCell:SL-0097
  review:
    summary: The conserved C-terminal membrane anchor and mammalian VAPA experiments support ER membrane
      residence.
    action: ACCEPT
    reason: The selected horse protein retains the MSP domain and terminal transmembrane helix and is
      98.4% identical across all 249 human canonical residues. This architecture supports transfer of
      the experimentally established ER-anchored adaptor role. The extra horse segment lies in the linker
      and corresponds to an alternatively spliced human region; it does not replace the membrane anchor.
      ARBA localization text is not used as validation.
    supported_by:
    - &id001
      reference_id: PMID:33124732
      supporting_text: VAP‐A, VAP‐B, and MOSPD2 are anchored in the ER membrane by a carboxyl‐terminal
        transmembrane domain with their MSP domain projecting into the cytosol.
- term:
    id: GO:0005886
    label: plasma membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  supporting_entities:
  - UniProtKB-SubCell:SL-0039
  review:
    summary: The peripheral plasma-membrane/tight-junction pool is supported by mammalian localization
      evidence.
    action: KEEP_AS_NON_CORE
    reason: Human VAP-33 antibodies colocalize with occludin at tight junctions, and human VAPA can be
      recruited to plasma-membrane contact sites. Conservation supports this as a plausible horse localization,
      while the principal role is ER membrane anchoring. This is a mammalian transfer rather than a horse
      imaging experiment.
    supported_by:
    - reference_id: PMID:10523508
      supporting_text: 'Antibodies to the human VAP-33 co-localized with occludin at

        the tight junction in many tissues and tissue culture cell lines.'
