    id: GO:0005789
    label: endoplasmic reticulum membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: located_in
  supporting_entities:
  - InterPro:IPR016763
  - UniProtKB-SubCell:SL-0097
  review:
    summary: ER membrane residence through the C-terminal tail anchor is the defining location of VAPA
      and is conserved in the horse protein.
    action: ACCEPT
    reason: The horse protein belongs to PANTHER subfamily PTHR10809:SF155 (VAPA), the same subfamily
      as human VAPA (Q9P0L0), and PAINT curators placed ER membrane at the deep VAP node PTN000087323,
      from which human VAPA receives its IBA; the horse protein descends from that node. It aligns
      gaplessly to human VAPA isoform 2 over all 294 residues at 95.9% identity, with the Phobius-predicted
      C-terminal helix (273-293) in the position of the human type IV anchor. Structural and cell-biology
      work on human VAPA establishes the ER-anchored topology with the MSP domain in the cytosol. ARBA
      localization text in the horse entry is not used as support.
    supported_by:
    - reference_id: PMID:33124732
      supporting_text: VAP‐A, VAP‐B, and MOSPD2 are anchored in the ER membrane by a carboxyl‐terminal
        transmembrane domain with their MSP domain projecting into the cytosol.
    - reference_id: file:HORSE/VAPA/VAPA-uniprot.txt
