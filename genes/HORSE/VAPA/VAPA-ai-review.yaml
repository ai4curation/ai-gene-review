gene_symbol: VAPA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9796
  label: Equus caballus
description: VAPA (vesicle-associated membrane protein-associated protein A) is a tail-anchored protein
  of the endoplasmic reticulum membrane. A C-terminal transmembrane helix holds it in the ER while its
  N-terminal major sperm protein (MSP) domain faces the cytosol and binds FFAT and phospho-FFAT motifs
  in partner proteins such as oxysterol-binding protein-related proteins, STARD3 and other lipid-transfer
  and trafficking factors. Acting as a docking platform, VAPA recruits these partners to the ER surface
  and helps form membrane contact sites between the ER and endosomes, Golgi and the plasma membrane;
  the lipid transfer itself is carried out by the recruited partners. A minor pool has been reported
  at the plasma membrane and at epithelial tight junctions. This horse entry encodes the longer VAPA
  splice form, which carries an extra segment of about 45 residues in the linker between the MSP domain
  and the coiled-coil region, equivalent to human VAPA isoform 2; the MSP domain, coiled coil and membrane
  anchor are intact.
existing_annotations:
