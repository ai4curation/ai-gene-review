suggested_questions:
- question: Does the linker insertion that distinguishes VAPA isoform 2 (present in this horse gene
    model) alter partner selection, dimerization or contact-site formation compared with the shorter
    isoform?
suggested_experiments:
- description: Express the long (isoform 2-like) and short horse VAPA forms in VAPA/VAPB double-knockout
    cells and compare recruitment of FFAT partners (OSBP, STARD3) and ER-endosome contact formation.
  experiment_type: complementation and imaging
