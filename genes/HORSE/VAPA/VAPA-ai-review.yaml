- term:
    id: GO:0005886
    label: plasma membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  supporting_entities:
  - UniProtKB-SubCell:SL-0039
  review:
    summary: A plasma-membrane pool of VAPA is reported for mammalian VAPA and was propagated by PAINT
      across the VAP family; it is peripheral to the ER-anchored adaptor role.
    action: KEEP_AS_NON_CORE
    reason: Human VAPA was detected at the plasma membrane with occludin in polarized epithelia, and
      PAINT propagated plasma membrane from the same deep node (PTN000087323) that carries ER membrane,
      so the location is a phylogenetically considered inference that covers this SF155 member. The bulk
      of VAPA is in the ER and its core adaptor activity is exercised from the ER side of contact sites,
      so this location is kept as non-core. No horse imaging data exist.
    supported_by:
    - reference_id: PMID:10523508
      supporting_text: 'Antibodies to the human VAP-33 co-localized with occludin at

        the tight junction in many tissues and tissue culture cell lines.'
- term:
    id: GO:0005923
    label: bicellular tight junction
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  supporting_entities:
  - UniProtKB-SubCell:SL-0265
  review:
    summary: Tight-junction localization rests on one 1999 antibody colocalization study of human VAPA
      and was not propagated by PAINT; the electronic transfer to horse overstates the evidence.
    action: MARK_AS_OVER_ANNOTATED
    reason: The only experimental basis is antibody colocalization of human VAP-33/VAPA with occludin
      (PMID:10523508, abstract only). PAINT curators propagated ER membrane and plasma membrane from
      the VAP node PTN000087323 but did not propagate bicellular tight junction, although the human
      IDA was available to them; per campaign rules this omission is treated as a deliberate judgment.
      The horse row comes from a UniProt subcellular-location mapping of ARBA-predicted text rather
      than from phylogenetic inference, and the later literature on VAPA localizes it to the ER and
      to ER-organelle contact sites rather than to junctional complexes. The term is not demonstrably
      wrong, so it is flagged as an over-annotation rather than removed.
    supported_by:
    - reference_id: PMID:10523508
      supporting_text: 'Antibodies to the human VAP-33 co-localized with occludin at

        the tight junction in many tissues and tissue culture cell lines.'
- term:
    id: GO:0043495
    label: protein-membrane adaptor activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: Proposed new annotation. VAPA recruits FFAT-bearing cytosolic proteins to the ER membrane,
      and PAINT placed this activity at the VAP node from which the horse SF155 member descends.
    action: NEW
    reason: The horse entry has no molecular-function annotation. Human VAPA carries protein-membrane
      adaptor activity by IDA in several studies and by IBA from PAINT node PTN000087323; the horse
      protein is in the same PANTHER subfamily (PTHR10809:SF155), so it inherits from that node. The
      residues that form the FFAT-binding pocket of human VAPA (K50, K52, T53, T54, K94, F95, M96,
      K125) are all identical in the horse protein, and the C-terminal membrane anchor is retained, so
      both halves of the adaptor (partner binding and membrane anchoring) are present. The extra linker
      segment shared with human isoform 2 lies outside the MSP domain and the anchor. This proposal is
      evidenced by phylogenetic placement plus residue conservation; it is not a horse experiment. FFAT
      motif binding (GO:0033149) is not proposed separately because PAINT did not propagate it, and the
      adaptor term already captures the role.
    supported_by:
    - reference_id: PMID:33124732
      supporting_text: F207, the second residue of the FFAT motif, was bound to the hydrophobic pocket
        at the surface of the MSP domain constituted by aliphatic parts of the side chains of K52, T54,
        K94, M96, and K125 of VAP‐A
    - reference_id: file:HORSE/VAPA/VAPA-bioinformatics/RESULTS-rereview.md
      supporting_text: '| 94 | K | 94 | K | True |'
    - reference_id: file:HORSE/VAPA/VAPA-bioinformatics/RESULTS-rereview.md
      supporting_text: '| 96 | M | 96 | M | True |'
