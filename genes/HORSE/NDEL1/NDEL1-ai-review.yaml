id: A0A5F5PSW5
gene_symbol: NDEL1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9796
  label: Equus caballus
description: NDEL1 (nudE neurodevelopment protein 1-like 1) of the horse is a cytoplasmic coiled-coil
  protein of the NudE family and the vertebrate NDEL1 ortholog, near-identical to human NDEL1 over its
  first 338 residues. Its N-terminal coiled coil forms parallel homodimers that bind the LIS1 (PAFAH1B1)
  homodimer, and its downstream region binds the cytoplasmic dynein-1 intermediate chain, DISC1, CENP-F,
  katanin and neurofilament light chain. By tethering LIS1 to dynein, NDEL1 regulates the minus-end-directed
  motor, supporting dynein-driven nucleus-centrosome coupling and nuclear translocation in radially migrating
  cortical neurons and retrograde organelle and lysosome transport, although in purified systems it can
  also restrain dynein activation. NDEL1 localizes to the centrosome (mother centriole), where it helps
  anchor microtubules and recruit pericentriolar proteins, to kinetochores via CENP-F, to the mitotic
  spindle and to axons. CDK5 and CDK1 phosphorylation of its central region (sites conserved in horse)
  switches its regulation of LIS1/dynein. The horse gene model replaces the last seven residues of the
  mammalian protein with a 143-residue C-terminal extension of unknown significance.
