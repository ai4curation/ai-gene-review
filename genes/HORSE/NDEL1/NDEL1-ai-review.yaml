suggested_questions:
- question: Is the 143-residue C-terminal extension of the horse (and donkey) NDEL1 gene model expressed,
    or is it an Ensembl gene-model artefact replacing the conserved mammalian final exon (human residues
    339-345)?
- question: Does NDEL1 net-activate or restrain dynein in vivo, given that in purified systems it inhibits
    dynein-dynactin-adaptor assembly while cellular loss of function phenocopies dynein loss?
suggested_experiments:
- description: RNA-seq/long-read transcript evidence or RT-PCR across the last exons of horse NDEL1 to
    determine which C-terminus is expressed.
