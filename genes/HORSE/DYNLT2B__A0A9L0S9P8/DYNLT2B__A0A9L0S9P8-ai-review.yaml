core_functions:
- description: Non-catalytic Tctex-type light chain of cytoplasmic dynein-2 that, as a heterodimer with
    DYNLT1/DYNLT3, binds the WDR60/DYNC2I1 intermediate chain and supports retrograde intraflagellar transport.
    Assigned to the equine gene by one-to-one orthology (PANTHER PTHR21255:SF7, the DYNLT2B-specific
    subfamily; PAINT node PTN000478852) to the experimentally characterized human protein; no equine
    experiment exists. A0A9L0S9P8 lacks the human-like N-terminus and first beta-strand, so whether this
    particular protein model is competent for the function is unresolved.
