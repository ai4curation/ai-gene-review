suggested_questions:
- question: Is A0A9L0S9P8 a real equine transcript product? Its 40-residue N-terminal prefix lacks an
    initiator methionine and replaces the conserved N-terminus and first Tctex beta-strand found in
    A0A9L0TLH8, which suggests an incomplete or mis-joined 5' gene model rather than a distinct isoform.
  experts: []
- question: Should the UniProt gene-centric representative for equine DYNLT2B be a model that encodes
    the complete human-like Tctex fold (A0A9L0TLH8 or the Ensembl canonical A0A9L0S150) instead of
    A0A9L0S9P8?
  experts: []
suggested_experiments:
- hypothesis: The equine DYNLT2B locus produces a transcript whose 5' exon encodes the human-like
    N-terminus (as in A0A9L0TLH8), and the A0A9L0S9P8 prefix is a gene-model artefact.
  description: 5' RACE and long-read cDNA sequencing of DYNLT2B transcripts from horse testis and a
    ciliated epithelium, mapping start sites and the first coding exon against the three model variants.
  experiment_type: full-length transcript sequencing / gene-model validation
- hypothesis: The equine protein, like the human orthologue, heterodimerizes with DYNLT1 and binds
    WDR60/DYNC2I1, and loss of the first beta-strand (as in A0A9L0S9P8) abolishes dimerization.
  description: Co-immunoprecipitation of horse A0A9L0TLH8 and A0A9L0S9P8 sequences with DYNLT1 and WDR60
    in the visible-immunoprecipitation format used for the human subcomplexes (PMID:29742051), with
    human TCTEX1D2 as positive control.
  experiment_type: pairwise interaction mapping / co-immunoprecipitation
