- id: PMID:29742051
  title: Interaction of WDR60 intermediate chain with TCTEX1D2 light chain of the dynein-2 complex is
    crucial for ciliary protein trafficking.
  findings:
  - statement: Human TCTEX1D2 is in a WDR60-TCTEX1D2-DYNLT1/DYNLT3 subcomplex of dynein-2, mapped by
      visible immunoprecipitation.
    supporting_text: The dynein-2 complex can be divided into three subcomplexes, namely DYNC2H1-DYNC2LI1,
      WDR34-DYNLL1/DYNLL2-DYNLRB1/DYNLRB2, and WDR60-TCTEX1D2-DYNLT1/DYNLT3.
    reference_section_type: ABSTRACT
  - statement: TCTEX1D2 knockout cells have a milder retrograde trafficking defect than WDR60 knockouts,
      indicating an auxiliary role within the complex.
    supporting_text: our results demonstrated that WDR60 plays a major role and TCTEX1D2 plays an auxiliary
      role in the dynein-2 complex to mediate retrograde ciliary protein trafficking.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached. Human cell experiments; primary experimental basis for the
