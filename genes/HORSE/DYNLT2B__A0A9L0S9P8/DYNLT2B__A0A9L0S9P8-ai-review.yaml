    summary: Proposed by orthology to human DYNLT2B, grounded phylogenetically. PAINT placed dynein
      intermediate chain binding at the Tctex family node PTN000478852, which is ancestral to the
      DYNLT2B-specific subfamily PTHR21255:SF7 containing this equine gene; the human SF7 member carries
