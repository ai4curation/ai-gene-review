id: A0A9L0S9P8
gene_symbol: DYNLT2B
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9796
  label: Equus caballus
description: Dynein light chain Tctex-type 2B (DYNLT2B, also known as TCTEX1D2) is a small non-catalytic
  Tctex-1-fold light chain of cytoplasmic dynein-2, the minus-end-directed motor that powers retrograde
  intraflagellar transport in cilia and flagella. In the experimentally characterized human and mouse
  orthologues it forms a heterodimer with DYNLT1 or DYNLT3 that binds the dynein-2-specific intermediate
  chain WDR60/DYNC2I1; loss of the human protein impairs retrograde ciliary protein trafficking and causes
  a short-rib thoracic dysplasia ciliopathy, and loss of the mouse protein disrupts sperm flagellum
  assembly. The equine gene (Ensembl ENSECAG00000015913, chromosome 19) is a one-to-one orthologue in the
  DYNLT2B-specific PANTHER subfamily PTHR21255:SF7, and these functions are inferred for it by orthology;
  no equine experiment has been reported. A0A9L0S9P8 is the 145-residue UniProt reference-proteome
  gene-centric entry for the gene. Its sequence from the second helix to the C-terminus (human residues
  38-142) is 100% identical to the other full-length equine models and highly conserved with human, but
  its first 40 residues are an unrelated sequence with no initiator methionine that replaces the human
  N-terminus, including the first beta-strand of the Tctex fold; the human-like full-length product is
  represented instead by A0A9L0TLH8 and the Ensembl canonical model A0A9L0S150.
