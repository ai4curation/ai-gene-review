core_functions:
- description: >-
    Scaffold subunit of the CPLANE complex (with Inturned and Fuzzy) at the ciliary base, contributing to
    basal-body recruitment of peripheral IFT-A and transition-zone recruitment of septin and MKS/NPHP
    proteins during cilium organization.
  directly_involved_in:
  - id: GO:0044782
    label: cilium organization
  locations:
