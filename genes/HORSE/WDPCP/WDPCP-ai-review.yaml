id: A0A3Q2KRK8
gene_symbol: WDPCP
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9796
  label: Equus caballus
description: >-
  WDPCP (fritz homolog) is a WD40 beta-propeller plus alpha-solenoid scaffold protein of the conserved
  fritz family (PANTHER PTHR13667, subfamily SF5). In vertebrates it forms the CPLANE (ciliogenesis and
  planar polarity effector) complex with Inturned and Fuzzy, which associates with the Rsg1 GTPase and
  JBTS17/CPLANE1 at the basal body and recruits peripheral IFT-A subunits there, so that WDPCP is needed
  for cilium formation. Orthologs localize to the ciliary transition zone/base and along the axoneme,
  and a cytoplasmic pool associates with the actin cytoskeleton, focal adhesions and the cell cortex,
  where WDPCP interacts with septin 2 and supports septin and actin organization, cell shape and
  directional migration. The C-terminal tail of the mouse protein binds monophosphorylated
  phosphoinositides, preferentially PI(3)P. The horse protein A0A3Q2KRK8 (705 aa) is one of eight
  Ensembl transcript products of the horse WDPCP gene; it retains the full propeller and solenoid but
  ends in an alternative 12-residue C-terminus that lacks the conserved end of the phosphoinositide-binding
  tail.
existing_annotations:
- term:
    id: GO:0005886
    label: plasma membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  supporting_entities:
  - UniProtKB-SubCell:SL-0039
  review:
    action: MODIFY
    summary: >-
      The membrane-associated pool of fritz/WDPCP is cortical rather than a plasma membrane protein
      per se; the experimental observations are cortical concentration of Fritz-GFP in Xenopus and
      actin-cytoskeleton/focal-adhesion localization in mouse cells.
    reason: >-
      This row maps the UniProt "Cell membrane" subcellular location, which for this unreviewed entry
      rests only on an ARBA rule; for the reviewed Xenopus ortholog (same PANTHER subfamily SF5) it
      traces to Kim et al. 2010, whose text actually reports Fritz-GFP "concentrated at the cell
      cortex". WDPCP has no transmembrane segment, and its lipid-binding tail prefers PI(3)P, an
      endosomal rather than plasma-membrane phosphoinositide (PMID:35427153). Mouse Wdpcp is
      cytoplasmic on actin filaments and focal adhesions (PMID:24302887). The PAINT curators did not
      propagate plasma membrane from the PTHR13667 node PTN001007408, which carries only ciliary terms.
      The claim is better expressed as cell cortex (GO:0005938); this is a lateral correction, not a
      refinement.
    proposed_replacement_terms:
    - id: GO:0005938
      label: cell cortex
    supported_by:
    - reference_id: PMID:20671153
      supporting_text: both sept2 fused to green fluorescent protein (sept2-GFP) and Fritz-GFP were concentrated
        at the cell cortex during CE
    - reference_id: PMID:24302887
      supporting_text: We show Wdpcp is localized in the ciliary transition zone, and also in the actin
        cytoskeleton and focal adhesions.
    - reference_id: file:HORSE/WDPCP/WDPCP-bioinformatics/rereview/RESULTS-rereview.md
      supporting_text: The node does not carry plasma membrane, axoneme, phosphatidylinositol
        binding or septin cytoskeleton terms.
- term:
    id: GO:0005930
    label: axoneme
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  supporting_entities:
  - UniProtKB-SubCell:SL-0304
  review:
    action: ACCEPT
    summary: >-
      Axonemal localization is observed directly for two subfamily SF5 orthologs: endogenous mouse Wdpcp
      in IMCD3 cells and Xenopus Fritz in multiciliated cells, in addition to the ciliary-base pool.
    reason: >-
      The previous UNDECIDED was too cautious: the cached full texts state that Wdpcp/Fritz is found
      along the axoneme as well as in a ring at the ciliary base, in mouse (antibody) and Xenopus. The
      PAINT node PTN001007408 places the more specific axonemal basal plate (part of axoneme) at the
      eumetazoan ancestor of the family, and horse WDPCP sits in the same subfamily (SF5) as both
      experimental orthologs. The horse isoform retains the whole propeller and solenoid that form the
      CPLANE interfaces. Axoneme is kept as stated rather than refined, because the shaft pool is reported
      separately from the basal pool; the basal plate localization is added as a NEW row below.
    supported_by:
    - reference_id: PMID:24302887
      supporting_text: Using an antibody raised to Wdpcp, we showed Wdpcp is localized to the ciliary axoneme
        and in a ring-like structure at the base of the cilia in IMCD3 cells
    - reference_id: PMID:20671153
      supporting_text: sept7 and Fritz were localized along ciliary axonemes and in distinct foci near basal
        bodies
    - reference_id: file:HORSE/WDPCP/WDPCP-bioinformatics/rereview/RESULTS-rereview.md
      supporting_text: UniProt places A0A3Q2KRK8 in
        PTHR13667:SF5, the same subfamily as human O95876, mouse Q8C456 and Xenopus Q32NR9
- term:
    id: GO:0097541
    label: axonemal basal plate
  evidence_type: IBA
  original_reference_id: file:HORSE/WDPCP/WDPCP-bioinformatics/rereview/RESULTS-rereview.md
  qualifier: located_in
  review:
    action: NEW
    summary: >-
      PAINT places axonemal basal plate at the eumetazoan PTHR13667 node PTN001007408; GOA propagates
      it to the canonical horse WDPCP product (A0A9L0T876) but not to this alternative transcript product.
    reason: >-
      Horse WDPCP descends from PTN001007408 (subfamily SF5). The node assertion rests on mouse Wdpcp,
      which localizes to the ciliary transition zone, the region whose distal end holds the basal plate.
      The A0A3Q2KRK8 isoform differs from the canonical product only in its final C-terminal residues and
      retains the CPLANE-forming propeller and solenoid, so there is no isoform-specific reason to withhold
      the IBA. Added because GOA's IBA propagation skipped this non-canonical gene-model product.
    supported_by:
    - reference_id: file:HORSE/WDPCP/WDPCP-bioinformatics/rereview/RESULTS-rereview.md
      supporting_text: The PAINT ancestral node PTN001007408 (taxon 6072, Eumetazoa) in PTHR13667 carries IBD assertions for
        axonemal basal plate (GO:0097541), cilium organization (GO:0044782)
    - reference_id: PMID:24302887
      supporting_text: We observed Wdpcp is localized to the transition zone
- term:
    id: GO:0044782
    label: cilium organization
  evidence_type: IBA
  original_reference_id: file:HORSE/WDPCP/WDPCP-bioinformatics/rereview/RESULTS-rereview.md
  qualifier: involved_in
  review:
    action: NEW
    summary: >-
      WDPCP is a core subunit of the CPLANE module that recruits peripheral IFT-A proteins to the basal
      body and is required for transition-zone recruitment of Sept2, Mks1 and Nphp1; PAINT places
      cilium organization at the eumetazoan family node.
    reason: >-
      Participation, not just necessity: WDPCP physically co-purifies with Intu and Fuz, forms the
      CPLANE structure, and the complex recruits IFT-A subunits to basal bodies, so WDPCP contributes
      scaffold structure to the recruitment step (PMID:27158779, PMID:35427153). The PAINT curators chose
      the general cilium organization (seeded by mouse Wdpcp and Xenopus Fritz) rather than cilium
      assembly; that level is followed here. Nervous system development, also on the node, is an
      organismal outcome of the ciliary defect and is not added. GOA propagated this IBA to the canonical
      horse product but not to this alternative transcript product.
    supported_by:
    - reference_id: file:HORSE/WDPCP/WDPCP-bioinformatics/rereview/RESULTS-rereview.md
      supporting_text: The PAINT ancestral node PTN001007408 (taxon 6072, Eumetazoa) in PTHR13667 carries IBD assertions for
        axonemal basal plate (GO:0097541), cilium organization (GO:0044782)
    - reference_id: PMID:27158779
      supporting_text: These data suggest that CPLANE acts by recruiting peripheral IFT-A proteins to the
        basal body
    - reference_id: PMID:24302887
      supporting_text: in Wdpcp-deficient cells, Sept2, Nphp1, and Mks1 were lost from the transition zone,
        indicating Wdpcp is required for recruitment of proteins essential for ciliogenesis
