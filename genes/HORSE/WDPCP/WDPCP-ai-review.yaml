id: A0A3Q2KRK8
gene_symbol: WDPCP
product_type: PROTEIN
status: IN_PROGRESS
taxon:
  id: NCBITaxon:9796
  label: Equus caballus
description: WDPCP is a conserved CPLANE-family ciliary and cytoskeletal scaffold. Its retained WD40 and
  alpha-solenoid architecture supports roles at the ciliary base and in actin organization. The horse
  protein has a shorter N terminus consistent with mammalian variation and a small deletion in the phosphoinositide-binding
  tail whose effect on lipid affinity is unresolved.
existing_annotations:
- term:
    id: GO:0005886
    label: plasma membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  supporting_entities:
  - UniProtKB-SubCell:SL-0039
  review:
    action: ACCEPT
    summary: A peripheral membrane-associated WDPCP pool is supported.
    reason: The conserved scaffold and experimentally characterized actin/focal-adhesion localization
      support the broad membrane assignment. The small tail deletion leaves precise phosphoinositide affinity
      uncertain without negating peripheral localization.
    supported_by:
    - reference_id: PMID:24302887
      supporting_text: 'Wdpcp

        is also found in the cytoplasm, where it is localized in the actin cytoskeleton

        and in focal adhesions.'
    - &id001
      reference_id: file:HORSE/WDPCP/WDPCP-bioinformatics/RESULTS.md
      supporting_text: share 88.1% identity among 704 paired residues.
    - &id003
      reference_id: file:HORSE/WDPCP/WDPCP-bioinformatics/RESULTS.md
      supporting_text: The WD40/alpha-solenoid scaffold is extensively conserved, supporting broad ciliary
        and cytoskeletal roles.
- term:
    id: GO:0005930
    label: axoneme
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  supporting_entities:
  - UniProtKB-SubCell:SL-0304
  review:
    action: UNDECIDED
    summary: Ciliary-base localization is supported more clearly than axonemal shaft localization.
    reason: The mammalian evidence places WDPCP at the transition zone. Conservation supports ciliary
      participation but does not independently resolve the exact axoneme annotation.
    supported_by:
    - &id002
      reference_id: PMID:24302887
      supporting_text: Wdpcp is localized to the transition zone
    - *id001
