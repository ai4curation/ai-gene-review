    label: axonemal basal plate
  - id: GO:0005930
    label: axoneme
  supported_by:
  - reference_id: PMID:27158779
    supporting_text: These data suggest that CPLANE acts by recruiting peripheral IFT-A proteins to the
      basal body
  - reference_id: PMID:24302887
    supporting_text: We observed Wdpcp is localized to the transition zone
  - reference_id: file:HORSE/WDPCP/WDPCP-bioinformatics/rereview/RESULTS-rereview.md
    supporting_text: UniProt places A0A3Q2KRK8 in
      PTHR13667:SF5, the same subfamily as human O95876, mouse Q8C456 and Xenopus Q32NR9
suggested_questions:
- question: >-
    Is the horse A0A3Q2KRK8 transcript (alternative final exon, lacking the conserved GSLxMxHFxLV
    C-terminus) expressed as a protein, and does its truncated tail still bind PI(3)P?
- question: >-
    Should GOA propagate PAINT IBA annotations to every UniProt product of a gene rather than only to
    the gene-centric canonical entry, given that this isoform retains the domains the node assertions
    depend on?
suggested_experiments:
- description: >-
    Express the A0A3Q2KRK8 C-terminal segment alongside the canonical-like A0A9L0R7M2 tail and compare
    phosphoinositide binding on PIP strips or liposomes, as done for mouse Wdpcp.
