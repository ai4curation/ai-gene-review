- id: file:HORSE/WDPCP/WDPCP-hypotheses/horse40-cell-projection-organization/openscientist.md
  title: 'OpenScientist hypothesis run: WDPCP cell projection organization'
  publication_type: DEEP_RESEARCH
  reference_review:
    relevance: HIGH
    review_notes: Substantive computational synthesis directly addressing the GO:0030030 prediction. Its
      WDPCP/CPLANE orthology conclusion is corroborated by the cached gene-model comparison, and its
      caveat that more specific child terms are better supported is consistent with the LSP assessment.
  findings:
  - statement: OpenScientist supported GO:0030030 as a broad horse WDPCP process annotation via conserved
      CPLANE/ciliogenesis and planar-polarity biology, with curation caveats on term breadth and orthology-only
      evidence.
    supporting_text: GO:0030030 is therefore biologically justified for the horse protein. The two curation
      caveats are that the term is generic (specific children such as cilium assembly and establishment
      of planar polarity are better supported) and that all functional evidence is transferred by orthology
      to an unreviewed TrEMBL record, so an **ISS/ISO** evidence code is appropriate rather than an experimental
      one.
predictions:
- source_method: ProtNLM2
  source_version: UniProt API snapshot 2026-09-08
  predicted_term:
    id: GO:0030030
    label: cell projection organization
  predicted_term_type: GO_BP
  review:
    assessment: LSP
    confidence_score: 2
    summary: >-
      WDPCP is a CPLANE subunit required for cilium formation: mouse CPLANE recruits peripheral IFT-A
      to the basal body, and a mouse Wdpcp in-frame deletion abolishes ciliogenesis. Horse A0A3Q2KRK8
      is in the same PANTHER subfamily (SF5) as these orthologs and descends from PAINT node
      PTN001007408, which carries cilium organization; the canonical horse WDPCP product A0A9L0T876
      carries GO:0044782 cilium organization by IBA, accepted in its gene review. GO:0044782 is_a
      GO:0120036 is_a GO:0030030 (OLS4), so the prediction is correct but less specific than an
      annotation the gene already has. The OpenScientist synthesis reaches the same conclusion on
      term breadth. The actin protrusion and migration phenotypes are real but do not by themselves
      warrant a more specific process term here.
    supported_by:
    - reference_id: PMID:27158779
      supporting_text: These data suggest that CPLANE acts by recruiting peripheral IFT-A proteins to the
        basal body
    - reference_id: PMID:41268724
      supporting_text: Cilia formation and Hh signaling were severely impaired.
    - &rr_sf5
      reference_id: file:HORSE/WDPCP/WDPCP-bioinformatics/rereview/RESULTS-rereview.md
      supporting_text: UniProt places A0A3Q2KRK8 in
        PTHR13667:SF5, the same subfamily as human O95876, mouse Q8C456 and Xenopus Q32NR9
    - reference_id: file:HORSE/WDPCP/WDPCP-hypotheses/horse40-cell-projection-organization/openscientist.md
      supporting_text: GO:0030030 is therefore biologically justified for the horse protein. The two curation
        caveats are that the term is generic (specific children such as cilium assembly and establishment
        of planar polarity are better supported) and that all functional evidence is transferred by orthology
        to an unreviewed TrEMBL record, so an **ISS/ISO** evidence code is appropriate rather than an experimental
        one.
- source_method: ProtNLM2
  source_version: UniProt API snapshot 2026-09-08
  predicted_term:
    id: GO:0005737
    label: cytoplasm
  predicted_term_type: GO_CC
  review:
    assessment: LSP
    confidence_score: 2
    summary: >-
      Mouse Wdpcp has a cytoplasmic pool on actin filaments and focal adhesions, and Xenopus Fritz
      concentrates at the cell cortex; both orthologs share PANTHER subfamily SF5 with horse
      A0A3Q2KRK8, which retains the full propeller and solenoid. The prediction is therefore correct.
      This product already carries GO:0005930 axoneme (IEA, accepted in the gene review on direct
      mouse and Xenopus axonemal localization), and axoneme is a descendant of cytoplasm via ciliary
      plasm (OLS4); the cortical pool is likewise better captured by cell cortex, the replacement the
      gene review proposes for plasma membrane. Cytoplasm is thus a less precise restatement of
      supported locations.
    supported_by:
    - reference_id: PMID:24302887
      supporting_text: 'Wdpcp

        is also found in the cytoplasm, where it is localized in the actin cytoskeleton

        and in focal adhesions.'
    - &xl_cortex
      reference_id: PMID:20671153
      supporting_text: both sept2 fused to green fluorescent protein (sept2-GFP) and Fritz-GFP were concentrated
        at the cell cortex during CE
    - &mm_axoneme
      reference_id: PMID:24302887
      supporting_text: Using an antibody raised to Wdpcp, we showed Wdpcp is localized to the ciliary axoneme
        and in a ring-like structure at the base of the cilia in IMCD3 cells
    - *rr_sf5
