- source_method: ProtNLM2
  source_version: UniProt API snapshot 2026-09-08
  predicted_term:
    id: GO:0005856
    label: cytoskeleton
  predicted_term_type: GO_CC
  review:
    assessment: LSP
    confidence_score: 2
    summary: >-
      Mouse Wdpcp localizes to the actin cytoskeleton and is required to recruit Sept2 to actin
      filaments, and in Xenopus it acts through septins and actomyosin at the cell cortex; this
      orthology-based transfer within PANTHER subfamily SF5 supports the term. GO:0005930 axoneme,
      already carried by this product and accepted in the gene review, is a descendant of GO:0005856
      cytoskeleton (OLS4), so the prediction is less specific than an existing supported annotation.
      The actin-associated pool has no more specific annotation in GOA, but the term as predicted
      remains an ancestor of the accepted axoneme location.
    supported_by:
    - reference_id: PMID:24302887
      supporting_text: 'in Wdpcp-deficient cells, Sept2 was lost from the actin

        cytoskeleton, suggesting Wdpcp is required for Sept2 recruitment to actin

        filaments.'
    - reference_id: PMID:25436430
      supporting_text: Wdpcp acts via septins and actomyosin to control cell cortex stability during epithelial
        homeostasis
    - *mm_axoneme
    - *rr_sf5
