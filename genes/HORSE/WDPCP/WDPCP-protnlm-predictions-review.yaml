description: >-
  ProtNLM2 (UniProt API snapshot 2026-09-08) emitted four GO terms for horse WDPCP isoform A0A3Q2KRK8:
  cell projection organization, cytoplasm, cilium and cytoskeleton. All four are biologically correct
  for this CPLANE scaffold, which sits in PANTHER subfamily PTHR13667:SF5 with the experimentally
  characterized mouse, human and Xenopus orthologs and retains the full WD40 propeller and alpha-solenoid.
  All four are, however, ancestors of more specific annotations the horse gene already carries and that
  the gene reviews accept: axoneme (on this product) and axonemal basal plate and cilium organization
  (IBA, on the canonical horse product A0A9L0T876). Each prediction is therefore less precise (LSP).
