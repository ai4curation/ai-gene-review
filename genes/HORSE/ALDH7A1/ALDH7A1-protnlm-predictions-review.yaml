    summary: Human ALDH7A1 is an alpha-aminoadipic-semialdehyde dehydrogenase with experimentally demonstrated
      activity on several additional aldehydes. Those results establish ALDH chemistry but do not establish
      glyceraldehyde-3-phosphate oxidation. The selected horse sequence retains catalytic residues but
      has an internal 18-residue deletion, further limiting an exact substrate transfer. No target GOA
      overlap or direct glyceraldehyde-3-phosphate assay was found in the inspected evidence. The different
      canonical substrate alone does not prove the predicted reaction is impossible for a broad-specificity
      ALDH, so the prediction remains uncertain rather than receiving a confident paralog-error label.
