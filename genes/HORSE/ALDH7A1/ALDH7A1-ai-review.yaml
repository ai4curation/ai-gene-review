suggested_questions:
- question: Is the horse ALDH7A1 transcript ENSECAT00000119202, which skips the 54-nt second coding exon
    (human residues 65-82), supported by RNA-seq junction reads, or is it an annotation artefact?
- question: Should GO/UniProt annotation of ALDH7A1 in horse be anchored on the full-length Ensembl canonical
    product A0A9L0R3Y5 rather than on alternative gene models such as A0A9L0RRL6?
suggested_experiments:
- hypothesis: Removing the two beta strands encoded by the skipped exon disrupts folding or tetramerization
    of ALDH7A1.
  description: Express full-length horse ALDH7A1 and the exon-skipped A0A9L0RRL6 product in E. coli, then
    compare solubility, oligomeric state (size-exclusion chromatography) and NAD+-dependent AASA and 4-HNE
    oxidation kinetics.
