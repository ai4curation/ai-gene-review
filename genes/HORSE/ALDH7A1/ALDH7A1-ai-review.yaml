id: A0A9L0RRL6
gene_symbol: ALDH7A1
product_type: PROTEIN
status: IN_PROGRESS
taxon:
  id: NCBITaxon:9796
  label: Equus caballus
description: ALDH7A1 is an antiquitin-family aldehyde dehydrogenase associated with lysine degradation
  and aldehyde detoxification. The selected horse sequence retains the catalytic glutamate and cysteine
  and the amino-terminal region corresponding to the human mitochondrial targeting peptide. It also contains
  an internal 18-residue deletion relative to canonical human ALDH7A1, so the substrate preferences and
  activity of this protein model require confirmation.
existing_annotations:
- term:
    id: GO:0000139
    label: Golgi membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  supporting_entities:
  - UniProtKB-SubCell:SL-0134
  review:
    summary: This extramitochondrial localization is not resolved for the selected precursor sequence.
    action: UNDECIDED
    reason: Human ALDH7A1 has distinct mitochondrial and cytosolic isoforms and context-dependent nuclear/membrane
      pools. The selected horse sequence contains the N-terminal region corresponding to the human mitochondrial
      precursor; neither ARBA-derived localization text nor a gene-wide list of human compartments establishes
      this exact horse protein in the annotated compartment. Horse isoform and localization evidence is
      missing.
    supported_by:
    - reference_id: PMID:20207735
      supporting_text: 'Analysis of human and mouse

        cDNA sequences revealed mitochondrial and cytosolic transcripts'
- term:
    id: GO:0004029
    label: aldehyde dehydrogenase (NAD+) activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - InterPro:IPR044638
  - EC:1.2.1.3
  review:
    summary: ALDH family chemistry is plausible, but catalytic competence of the internally deleted model
      remains unresolved.
    action: UNDECIDED
    reason: The selected horse protein preserves the ALDH catalytic glutamate and cysteine and annotated
      nucleotide-binding residues. However, the internal deletion corresponding to human residues 65–82
      removes part of a structured region. Conserved catalytic side chains alone do not establish an intact
      active fold or oligomer. Human biochemical evidence identifies the expected family chemistry, but
      model/structure verification or a direct assay is required to establish activity of this exact sequence.
    supported_by:
    - reference_id: PMID:20207735
      supporting_text: 'Purified

        recombinant ALDH7A1 efficiently metabolized a number of aldehyde substrates'
    - reference_id: file:HORSE/ALDH7A1/ALDH7A1-bioinformatics/RESULTS.md
      supporting_text: '| ACT_SITE | 330–330 | 312 | 1/1 |'
- term:
    id: GO:0004043
    label: L-aminoadipate-semialdehyde dehydrogenase [NAD(P)+] activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - ARBA:ARBA00087386
  - EC:1.2.1.31
  review:
    summary: The expected ALDH7A1 substrate/pathway assignment needs confirmation for the internally deleted
      protein model.
    action: UNDECIDED
    reason: Human experiments support alpha-aminoadipic-semialdehyde oxidation, lysine degradation and
      betaine-aldehyde activity. The selected horse protein is ALDH7A1-like and retains catalytic residues
      but lacks human 65–82, including part of a structured N-terminal region. The consequence for substrate
      recognition and active folding is unresolved. Do not infer a different substrate from the deletion,
      but do not present exact substrate/pathway transfer as established for this model.
    supported_by:
    - reference_id: PMID:20207735
      supporting_text: 'including the osmolyte precursor, betaine aldehyde, lipid peroxidation-derived

        aldehydes, and the intermediate lysine degradation product, alpha-aminoadipic

        semialdehyde.'
