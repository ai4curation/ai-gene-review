id: A0A9L0RRL6
gene_symbol: ALDH7A1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9796
  label: Equus caballus
description: >-
  ALDH7A1 (antiquitin, alpha-aminoadipic semialdehyde dehydrogenase) is the horse
  ortholog of the mammalian ALDH7 family aldehyde dehydrogenase. Its conserved role is
  the NAD+-dependent oxidation of alpha-aminoadipic semialdehyde (in equilibrium with
  delta1-piperideine-6-carboxylate) to alpha-aminoadipate in L-lysine catabolism; the
  orthologous human enzyme also oxidizes betaine aldehyde and lipid-peroxidation-derived
  aldehydes. The enzyme is a homotetramer of the aldehyde-dehydrogenase fold with a
  catalytic glutamate and cysteine. Mammalian ALDH7A1 is found mainly in mitochondria
  and the cytosol, the two pools arising from transcripts with and without an
  amino-terminal mitochondrial targeting peptide, with smaller nuclear and membrane-associated
  pools. A0A9L0RRL6 is one of several Ensembl-predicted products of the horse ALDH7A1 gene:
  it starts at the mitochondrial-precursor methionine but skips one 54-nt coding exon,
  removing 18 residues (human 65-82, two beta strands at the start of the
  aldehyde-dehydrogenase domain). Catalytic and NAD-binding residues are retained, but
  whether this exon-skipped product is expressed or active has not been tested.
