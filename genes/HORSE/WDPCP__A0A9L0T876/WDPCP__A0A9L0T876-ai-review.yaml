    label: embryonic digit morphogenesis
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:O95876
  - ensembl:ENSP00000272321
  review:
    summary: >-
      Ensembl Compara transfer of a human IMP based on a patient with postaxial polydactyly; Wdpcp mutant
      mice also have Y-shaped metacarpals. A developmental manifestation of the ciliary role.
    action: KEEP_AS_NON_CORE
    reason: >-
      The donor annotation rests on loss-of-function genetics in human and mouse (PMID:27158779). These
      establish that the gene is needed for normal digit patterning, through cilium-dependent Hedgehog
      signaling, not that WDPCP carries out a digit-specific morphogenetic step. The same term is kept as
      non-core in the human WDPCP review. There is no horse phenotype data.
    supported_by:
    - reference_id: PMID:27158779
      supporting_text: We also observed Y-shaped metacarpals and defects in tongue and palate morphology in
        Wdpcp mutants
