- term:
    id: GO:0044782
    label: cilium organization
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:2144467
  - PANTHER:PTN001007408
  - UniProtKB:Q32NR9
  review:
    summary: >-
      PAINT placed cilium organization at PTN001007408 from mouse and Xenopus experimental data. WDPCP
      takes part directly, as the CPLANE scaffold that recruits IFT-A and transition-zone proteins to the
      ciliary base.
    action: ACCEPT
    reason: >-
      Horse A0A9L0T876 is in subfamily SF5 under PTN001007408 and keeps the propeller and solenoid that
      form the CPLANE interfaces; its divergence is confined to the disordered tail, which is unresolved in
      the CPLANE structures. In mouse, CPLANE recruits peripheral IFT-A to the basal body
      (PMID:27158779), and Wdpcp is required to recruit Sept2, Nphp1 and Mks1 to the transition zone
      (PMID:24302887). WDPCP therefore performs part of the process as a recruiting scaffold. Inferred for
      horse, not tested.
    supported_by:
    - reference_id: PMID:27158779
      supporting_text: These data suggest that CPLANE acts by recruiting peripheral IFT-A proteins to the
        basal body
    - reference_id: PMID:24302887
      supporting_text: in Wdpcp-deficient cells, Sept2, Nphp1, and Mks1 were lost from the transition zone,
        indicating Wdpcp is required for recruitment of proteins essential for ciliogenesis
    - reference_id: file:HORSE/WDPCP__A0A9L0T876/WDPCP__A0A9L0T876-bioinformatics/RESULTS.md
      supporting_text: the seven-bladed WD40 beta-propeller and the alpha-solenoid that form the Inturned/Fuzzy
        interfaces are retained intact.
- term:
    id: GO:0045184
    label: establishment of protein localization
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:2144467
  - PANTHER:PTN001007408
  review:
    summary: >-
      PAINT IBA from mouse Wdpcp. WDPCP recruits several proteins to more than one destination: SEPT2 to
      actin filaments, SEPT2/NPHP1/MKS1 to the transition zone and, within CPLANE, peripheral IFT-A to the
      basal body.
    action: ACCEPT
    reason: >-
      WDPCP is the recruiting scaffold in each case, so it does part of the work of the process. The
      general term is kept because the evidence covers several cargoes and destinations, one of them
      (SEPT2 to actin) outside the cilium. The narrower protein localization to ciliary transition zone
      (GO:1904491) is not an is_a descendant of this term and would cover only part of the evidence.
      Inferred for horse by descent from PTN001007408; consistent with the human WDPCP review.
    supported_by:
    - reference_id: PMID:24302887
      supporting_text: Wdpcp interacts with Sept2 and is colocalized with Sept2 in actin filaments, but in
        Wdpcp-deficient cells, Sept2 was lost from the actin cytoskeleton, suggesting Wdpcp is required for
        Sept2 recruitment to actin filaments
    - reference_id: PMID:27158779
      supporting_text: These data suggest that CPLANE acts by recruiting peripheral IFT-A proteins to the
        basal body
