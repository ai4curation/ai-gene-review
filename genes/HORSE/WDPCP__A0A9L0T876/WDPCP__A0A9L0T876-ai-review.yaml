    label: axonemal basal plate
  - id: GO:0005930
    label: axoneme
  supported_by:
  - reference_id: PMID:27158779
    supporting_text: These data suggest that CPLANE acts by recruiting peripheral IFT-A proteins to the
      basal body
  - reference_id: PMID:24302887
    supporting_text: We observed Wdpcp is localized to the transition zone
  - reference_id: file:HORSE/WDPCP__A0A9L0T876/WDPCP__A0A9L0T876-bioinformatics/RESULTS.md
    supporting_text: UniProt places A0A9L0T876 in PANTHER PTHR13667:SF5, the subfamily that contains human O95876, mouse
suggested_questions:
- question: >-
    Is the ENSECAT00000134648 transcript, with its alternative terminal exon inside an intron of the
    full-length model, translated in horse tissues, or is A0A9L0R7M2 the main WDPCP product?
- question: >-
    Should GO annotations transferred at the gene level (Ensembl Compara, PAINT) be checked against the
    domain content of each UniProt product, given that this canonical product lacks the PIP-binding tail?
suggested_experiments:
- description: >-
    Compare phosphoinositide binding of the A0A9L0T876 and A0A9L0R7M2 C-terminal segments on PIP strips or
    liposomes, as done for mouse Wdpcp, and test whether the A0A9L0T876 product still assembles with
    Inturned and Fuzzy and reaches the ciliary base.
