- term:
    id: GO:0035091
    label: phosphatidylinositol binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q8C456
  - ensembl:ENSMUSP00000020568
  review:
    summary: >-
      Ensembl Compara transfer from mouse Wdpcp, whose phosphoinositide binding maps to its last 60
      C-terminal residues. That segment is absent from A0A9L0T876.
    action: REMOVE
    reason: >-
      Mouse Wdpcp binds PI(3)P, PI(5)P and PI(4)P on its own, and the binding maps to the last 60
      C-terminal residues (PMID:35427153). In A0A9L0T876 the colinear alignment with human WDPCP ends at
      human residue 692; only 6 of the 60 residues of the equivalent human window (687-746) are present,
      and the next 96 residues are encoded by an alternative terminal exon unrelated to the conserved tail.
      The ciliopathy residue S708, which lies in the PIP-binding tail and alters binding when mutated, has
      no counterpart. The binding module on which the mouse activity depends is therefore missing from this
      product, and the Compara transfer (which works at the gene level) does not hold for it. The PAINT
      curators did not place phosphatidylinositol binding on PTN001007408 either. The activity is likely
      for the full-length horse product A0A9L0R7M2, which keeps the conserved tail, but it does not apply
      to A0A9L0T876 and should not be transferred onward from it. Whether the novel tail binds lipids is
      unknown.
    supported_by:
    - reference_id: PMID:35427153
      supporting_text: Wdpcp engages PIPs via the last 60 C-terminal residues
    - reference_id: file:HORSE/WDPCP__A0A9L0T876/WDPCP__A0A9L0T876-bioinformatics/RESULTS.md
      supporting_text: Only 6 of those 60 residues (687-692) lie inside the colinear
        block of A0A9L0T876, and the ciliopathy residue S708, which sits in the PIP-binding tail, has no
        counterpart.
- term:
