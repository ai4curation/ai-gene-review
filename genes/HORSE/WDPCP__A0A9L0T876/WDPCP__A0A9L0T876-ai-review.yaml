id: A0A9L0T876
gene_symbol: WDPCP
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9796
  label: Equus caballus
description: >-
  WDPCP (fritz homolog) is a non-enzymatic scaffold protein of the conserved fritz family (PANTHER
  PTHR13667, subfamily SF5), built from an N-terminal seven-bladed WD40 beta-propeller followed by an
  alpha-solenoid and a disordered C-terminal tail. In vertebrates it forms the CPLANE (ciliogenesis and
  planar polarity effector) complex with Inturned and Fuzzy. At the ciliary base CPLANE recruits the
  peripheral IFT-A subunits to the basal body, and WDPCP is needed for transition-zone localization of
  septin 2 and MKS/NPHP proteins, so it is required for cilium formation. Orthologs are also found along
  the ciliary axoneme, and a cytoplasmic pool on the cell cortex, actin filaments and focal adhesions
  recruits septin 2 and supports actin organization, cell polarity and directional migration. In mouse the
  last ~60 residues of the tail bind monophosphorylated phosphoinositides, preferring PI(3)P. The horse
  protein A0A9L0T876 (756 aa) is the product of the Ensembl canonical WDPCP transcript. It is identical to
  the full-length horse model A0A9L0R7M2 through residue 660 and so keeps the complete propeller and
  solenoid. Its last 96 residues come from an alternative terminal exon and replace the conserved end of
  the tail, including the mapped phosphoinositide-binding segment. No function has been tested
  experimentally for any horse WDPCP product; all functions here are inferred from orthologs in the same
  subfamily.
existing_annotations:
- term:
    id: GO:0005886
    label: plasma membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  supporting_entities:
  - UniProtKB-SubCell:SL-0039
  review:
    summary: >-
      Maps the UniProt "Cell membrane" location, which for this unreviewed entry rests only on an ARBA
      rule. The membrane-proximal pool observed for orthologs is cortical and cytoskeletal, not an
      integral plasma-membrane location.
    action: MODIFY
    reason: >-
      WDPCP has no transmembrane segment. The experimental observations behind the subfamily's peripheral
      localization are cortical concentration of Fritz-GFP in Xenopus (Q32NR9, PTHR13667:SF5;
      PMID:20671153) and localization of mouse Wdpcp (Q8C456, SF5) to actin filaments and focal adhesions
      (PMID:24302887). A plausible means of membrane association, the PI(3)P-binding C-terminal tail
      (PMID:35427153), is missing from this particular product (see the bioinformatics results), which
      weakens a membrane claim further. The PAINT node PTN001007408 that governs this subfamily carries
      no plasma membrane assertion. The claim is better expressed as cell cortex. This is a lateral
      correction, not a refinement, and it is an inference: no horse WDPCP product has been localized.
    proposed_replacement_terms:
    - id: GO:0005938
      label: cell cortex
    supported_by:
    - reference_id: PMID:20671153
      supporting_text: both sept2 fused to green fluorescent protein (sept2-GFP) and Fritz-GFP were concentrated
        at the cell cortex during CE
    - reference_id: PMID:24302887
      supporting_text: We show Wdpcp is localized in the ciliary transition zone, and also in the actin
        cytoskeleton and focal adhesions.
    - reference_id: file:HORSE/WDPCP__A0A9L0T876/WDPCP__A0A9L0T876-bioinformatics/RESULTS.md
      supporting_text: The node carries no plasma membrane, axoneme, cell cortex or
        phosphatidylinositol binding assertion.
