core_functions:
- description: >-
    Scaffold subunit of the CPLANE complex (with Inturned and Fuzzy) at the ciliary base that recruits
    peripheral IFT-A to the basal body and septin and MKS/NPHP proteins to the transition zone during
    cilium organization. Inferred from mouse and Xenopus orthologs in the same PANTHER subfamily and from
    PAINT node PTN001007408; not tested in horse.
  directly_involved_in:
  - id: GO:0044782
    label: cilium organization
  - id: GO:0045184
    label: establishment of protein localization
