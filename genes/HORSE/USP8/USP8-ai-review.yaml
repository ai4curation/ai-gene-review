id: A0A9L0T7K6
gene_symbol: USP8
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9796
  label: Equus caballus
description: USP8 (ubiquitin-specific protease 8, also called UBPY) is a cysteine-type deubiquitinase
  of the peptidase C19 (USP) family. It removes ubiquitin from protein substrates and processes Lys-48-
  and Lys-63-linked chains. Its N-terminal MIT domain binds ESCRT-III CHMP proteins and targets the enzyme
  from the cytosol to endosome membranes. There it deubiquitinates ESCRT-0 components and endocytosed
  receptor cargo, controlling endosomal ubiquitin levels, endosome morphology and growth factor receptor
  down-regulation. USP8 also stabilizes particular substrates and is recruited to the midbody late in
  cytokinesis. Phosphorylation of a central serine recruits 14-3-3 proteins and holds USP8 in the cytosol.
  The horse gene (Ensembl ENSECAG00000006611) produces several alternatively spliced products. This UniProt
  entry, A0A9L0T7K6 (1112 aa), uses an alternative 3' terminal exon. It keeps the MIT, rhodanese-like
  and USP domains and the catalytic Cys785 and His1066. It replaces the last 17 residues of the USP domain,
  including the conserved C-terminal YILFY strand segment, with an unrelated 12-residue tail, so whether
  this splice form is catalytically active is untested.
