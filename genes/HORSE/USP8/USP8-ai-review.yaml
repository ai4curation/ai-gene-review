  review:
    summary: A generic deubiquitinase-to-catabolism transfer. USP8's documented links to protein degradation
      are regulatory and work in both directions, so participation in the catabolic process itself is
      not established.
    action: MARK_AS_OVER_ANNOTATED
    reason: USP8 removes ubiquitin; it does not perform the degradation steps. Its effects on turnover
      depend on the substrate. It stabilizes Nrdp1, STAM and BACE1 by removing ubiquitin, yet it is required
      for efficient EGFR and Met down-regulation. Human curators captured this with regulatory terms (regulation
      of protein stability, negative regulation of lysosomal protein catabolic process), not GO:0006511.
      PAINT did not assert GO:0006511 at the USP8 nodes. The process term is therefore an over-annotation
      for this gene, though not demonstrably false.
