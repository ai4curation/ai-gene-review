  label: Equus caballus
description: USP8 is a cysteine-type deubiquitinase that removes ubiquitin from protein substrates. It
  regulates endosomal ubiquitin dynamics, cargo sorting and substrate stability, linking deubiquitination
  to receptor trafficking and protein turnover.
existing_annotations:
- term:
    id: GO:0004843
    label: cysteine-type deubiquitinase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - ARBA:ARBA00026880
  - InterPro:IPR001394
  - InterPro:IPR018200
  - EC:3.4.19.12
  review:
    summary: Recombinant human USP8 removes ubiquitin; the horse protein conserves the USP catalytic architecture.
    action: ACCEPT
    reason: Recombinant human USP8 removes ubiquitin; the horse protein conserves the USP catalytic architecture.
      This assessment transfers characterized mammalian biology to the selected horse sequence with the
      sequence limitations stated in the comparison.
    supported_by:
    - &id001
      reference_id: file:human/USP8/USP8-uniprot.txt
      supporting_text: 'CC   -!- FUNCTION: Hydrolase that can remove conjugated ubiquitin from proteins

        CC       and therefore plays an important regulatory role at the level of

        CC       protein turnover by preventing degradation. Converts both ''Lys-48'' an

        CC       ''Lys-63''-linked ubiquitin chains. Catalytic activity is enhanced in the

        CC       M phase. Involved in cell proliferation. Required to enter into S phase

        CC       in response to serum stimulation. May regulate T-cell anergy mediated

        CC       by RNF128 via the formation of a complex containing RNF128 and OTUB1.

        CC       Probably regulates the stability of STAM2 and RASGRF1. Regulates

        CC       endosomal ubiquitin dynamics, cargo sorting, membrane traffic at early

        CC       endosomes, and maintenance of ESCRT-0 stability. The level of protein

        CC       ubiquitination on endosomes is essential for maintaining the morphology

        CC       of the organelle. Deubiquitinates EPS15 and controls tyrosine kinase

        CC       stability. Removes conjugated ubiquitin from EGFR thus regulating EGFR

        CC       degradation and downstream MAPK signaling. Involved in acrosome

        CC       biogenesis through interaction with the spermatid ESCRT-0 complex and

        CC       microtubules. Deubiquitinates BIRC6/bruce and KIF23/MKLP1.

        CC       Deubiquitinates BACE1 which inhibits BACE1 lysosomal degradation and

        CC       modulates BACE-mediated APP cleavage and amyloid-beta formation

        CC       (PubMed:27302062). {ECO:0000269|PubMed:16520378,

        CC       ECO:0000269|PubMed:17711858, ECO:0000269|PubMed:18329369,

        CC       ECO:0000269|PubMed:27302062, ECO:0000269|PubMed:9628861}.'
    - &id002
      reference_id: file:HORSE/USP8/USP8-bioinformatics/RESULTS.md
      supporting_text: The horse sequence A0A9L0T7K6 (1112 residues) aligns to human P40818 (1118 residues)
        with 91.82% identity across 1112 paired residues. Paired coverage is 99.46% of the human sequence
        and 100.0% of the horse sequence.
    - &id003
      reference_id: PMID:9628861
      supporting_text: "We have identified and \ncharacterized a novel human ubiquitin isopeptidase, UBPY,\
        \ which both as a \nrecombinant protein and upon immunoprecipitation from cell extracts is able\
        \ to \ncleave linear or isopeptide-linked ubiquitin chains."
