suggested_questions:
- question: Is the alternative 3' terminal exon of horse USP8 (Ensembl ENSECAT00000088864, UniProt A0A9L0T7K6),
    which replaces the C-terminal YILFY strand segment of the USP domain, supported by RNA-seq, and does
    it occur in other mammals?
- question: Should the canonical-structure horse USP8 products (F7BV54, A0A3Q2HXC7) receive the USP8-node
    IBA annotations (cytosol, midbody, endosome organization) that this accession lacks because it is not
    in the PANTHER tree?
suggested_experiments:
- description: Express the horse A0A9L0T7K6 product and the F7BV54 product (same gene, canonical human-like
    C-terminus) and compare their activity on K48- and K63-linked di-ubiquitin and on monoubiquitinated
    EGFR, with the catalytic Cys785Ala mutant as a negative control.
  hypothesis: Losing the C-terminal YILFY strand segment reduces or abolishes deubiquitinase activity of
    the alternative splice form.
