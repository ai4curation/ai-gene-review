core_functions:
- description: Cysteine-type deubiquitinase that removes ubiquitin, including Lys-48- and Lys-63-linked
    chains, from endosomal cargo and ESCRT-associated proteins. It is recruited from the cytosol to endosome
    membranes through its CHMP-binding MIT domain, and so controls endosomal ubiquitin levels and receptor
    sorting. The activity of the A0A9L0T7K6 splice form, which has an altered USP-domain C-terminus, is
    unverified.
