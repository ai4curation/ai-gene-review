product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9796
  label: Equus caballus
description: PTPRN2 is a membrane protein of neuroendocrine secretory vesicles that traffics between secretory
  granules and the plasma membrane. It regulates vesicle accumulation and secretion and has a phosphatase-like
  intracellular domain. Conventional phosphoprotein activity is impaired, whereas phosphoinositide phosphatase
  activity and regulation of membrane PI(4,5)P2 have been reported in mammalian cells. The selected protein
  sequence has an internal or terminal difference from the characterized human protein, so its precise
  activity and regulation remain to be established.
