gene_symbol: PTPRN2
aliases:
- IA-2beta
- phogrin
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9796
  label: Equus caballus
description: PTPRN2 (IA-2beta, phogrin) is a single-pass type I transmembrane protein of the dense-core
  secretory granules of neuroendocrine cells and neurons, and is also found on synaptic vesicles. It has
  a luminal IA-2 domain and a cytoplasmic receptor-type protein-tyrosine-phosphatase-like domain. That
  domain has no detectable activity on phosphoprotein substrates, but in the rat ortholog it hydrolyses
  phosphoinositides, including PI(4,5)P2 and PI(3)P, by a catalytic-cysteine-dependent mechanism. Through
  this activity and its granule-membrane role, PTPRN2 maintains dense-core granule number and regulates
  stimulus-coupled secretion of insulin and of neurotransmitters. This horse product (A0A9L0T4W6, 976 aa)
  is one of eight Ensembl/UniProt models of the horse PTPRN2 gene. It uses an alternative terminal exon
  that replaces the last 37 residues of the phosphatase-like domain, and the cytoplasmic C-terminus, with
  56 non-conserved residues, so the catalytic competence of this exact product is untested.
