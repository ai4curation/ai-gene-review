  review:
    summary: Electronic transfer of protein-tyrosine phosphatase activity from the PTP-domain signature.
      The PTPRN2 subfamily (PANTHER PTHR46106:SF5) has lost this activity; the rat and human orthologs
      show no activity on phosphoprotein or pNPP substrates.
    action: REMOVE
    reason: The domain-signature mapping (InterPro IPR000242, EC 3.1.3.48) assumes canonical PTP catalysis.
      The rat ortholog phogrin, in the same PANTHER subfamily (PTHR46106:SF5), shows no detectable activity
      against phosphoproteins or pNPP. Human PTPRN2 work states the same, attributing it to substitutions
      in the PTP domain. Its demonstrated substrates are phosphoinositides, covered by the MODIFY of the
      hydrolase row below. The benchmark horse model also lacks the conserved C-terminal end of the domain.
      Protein-tyrosine dephosphorylation is not supported for this gene product.
    supported_by:
    - reference_id: PMID:26620550
      supporting_text: PTPRN2 belongs to the protein tyrosine phosphatase family, but does not exhibit
        activity against phosphoprotein substrates due to several critical amino acid variations in the
        PTP domain (Magistrelli et al, 1996).
    - reference_id: PMID:20097759
      supporting_text: In the absence of detectable ability to dephosphorylate phosphoproteins or p -nitrophenyl
        phosphate (pNPP), it has been suggested that phogrin and the closely related DCV protein IA-2 may
        function as a dominant negatives
    - reference_id: file:HORSE/PTPRN2/PTPRN2-bioinformatics/RESULTS-rereview.md
      supporting_text: In A0A9L0T4W6 only the first 15 of those residues (TYVLIDMVLNKMAKG) are retained;
        the remaining 47 conserved residues are replaced by 56 unrelated residues
