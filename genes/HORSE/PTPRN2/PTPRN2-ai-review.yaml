- term:
    id: GO:0051046
    label: regulation of secretion
  evidence_type: ISS
  original_reference_id: PMID:20097759
  qualifier: involved_in
  review:
    summary: Proposed by orthology within PANTHER PTHR46106:SF5. PTPRN2 orthologs regulate dense-core
      granule secretion through their own granule-membrane and catalytic-cysteine-dependent activity.
    action: NEW
    reason: PAINT propagates this term to human PTPRN2 by IBA from node PTN000439769. That node covers
      the IA-2/IA-2beta family and has fly and worm donors. This horse accession has no IBA rows, most
      likely because it is not the canonical horse model used in the PANTHER tree. The protein does part
      of the work. Overexpressed rat phogrin inhibits glucose-stimulated insulin secretion, and the C934S
      catalytic mutant does not, so the effect depends on phogrin's own enzymatic activity. Mouse Ptprn2
      loss lowers dense-core granule number and insulin secretion. The broad regulation term is used rather
      than insulin secretion because PTPRN2 also acts in neurons. Same caveat as the activity row about
      this model's altered C-terminal exon.
    supported_by:
    - reference_id: PMID:20097759
      supporting_text: Insulin secretion was not decreased by overexpression of phogrin(C934S)-myc, indicating
        that the effect of phogrin on insulin secretion depends on its enzymatic activity.
    - reference_id: PMID:21732083
      supporting_text: insulin content, insulin secretion and the number and half-life of DCV
core_functions:
- description: Phosphatidylinositol phosphate phosphatase of the dense-core granule membrane. The cytoplasmic
    PTP-like domain dephosphorylates phosphoinositides such as PI(4,5)P2 and PI(3)P, using the catalytic
    cysteine of its CX5R loop, rather than phosphoproteins. Inferred for horse PTPRN2 from the rat ortholog
    (same PANTHER subfamily, PTHR46106:SF5). The benchmark model keeps the catalytic loop but has a
    non-conserved C-terminal exon.
  molecular_function:
    id: GO:0052866
    label: phosphatidylinositol phosphate phosphatase activity
  locations:
  - id: GO:0032127
    label: dense core granule membrane
  supported_by:
  - reference_id: PMID:20097759
    supporting_text: We report here that phogrin is able to dephosphorylate specific inositol phospholipids,
      including phosphatidylinositol (PI) 3-phosphate and PI 4,5-diphosphate but not PI 3,4,5-trisphosphate.
  - reference_id: PMID:20097759
    supporting_text: The PIPase activity of phogrin depended on the catalytic site cysteine and correlated
      with effects on glucose-stimulated insulin secretion.
- description: Regulates stimulus-coupled secretion from dense-core granules and synaptic vesicles. Granule
    PTPRN2 is needed to maintain the number and half-life of insulin-containing dense-core granules. Its
    loss in mouse lowers insulin content and glucose-stimulated insulin secretion, and the catalytic cysteine
    is required for its effect on insulin secretion.
  directly_involved_in:
  - id: GO:0051046
    label: regulation of secretion
  locations:
  - id: GO:0032127
    label: dense core granule membrane
  - id: GO:0030672
    label: synaptic vesicle membrane
  supported_by:
  - reference_id: PMID:21732083
    supporting_text: insulin content, insulin secretion and the number and half-life of DCV
  - reference_id: PMID:15220191
    supporting_text: We conclude that IA-2beta is involved in insulin secretion
  - reference_id: PMID:19361477
    supporting_text: IA-2beta is present in both DCV and SV
