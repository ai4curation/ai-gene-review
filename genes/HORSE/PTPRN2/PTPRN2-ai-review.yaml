    summary: UniRule transfer of dual-specificity protein phosphatase activity. No PTPRN2 ortholog has
      shown activity on any phosphoprotein substrate, so this is a stronger version of the unsupported
      protein-tyrosine phosphatase claim.
    action: REMOVE
    reason: Same basis as the protein-tyrosine phosphatase row. The PTPRN2 subfamily is defined by the
      loss of phosphoprotein phosphatase activity. The rat ortholog, assayed directly, dephosphorylates
      phosphoinositides but not phosphoproteins or pNPP. Nothing supports activity on phosphoserine or
      phosphothreonine. The UniRule rule over-propagates a generic PTP-fold activity to a subfamily that
      has diverged from it.
