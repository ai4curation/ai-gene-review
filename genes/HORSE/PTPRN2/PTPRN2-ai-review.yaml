- term:
    id: GO:0016787
    label: hydrolase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: enables
  supporting_entities:
  - UniRule:UR000414439
  review:
    summary: True for the gene but uninformative. The PTPRN2 ortholog hydrolyses phosphoinositide monoesters,
      so the specific activity is phosphatidylinositol phosphate phosphatase activity.
    action: MODIFY
    reason: The specific hydrolase activity of the PTPRN2 subfamily is known. Rat phogrin (Ptprn2, Q63475,
      same PANTHER subfamily PTHR46106:SF5 as this horse protein) dephosphorylates PI(3)P, PI(5)P and PI(4,5)P2
      but not PI(3,4,5)P3. The activity depends on the catalytic cysteine and is about 75-fold higher in
      the purified full-length transmembrane protein than in the isolated catalytic domain. GO:0052866
      phosphatidylinositol phosphate phosphatase activity is an is_a descendant of hydrolase activity;
      it is broad enough not to assert one phosphate-position specificity. The transfer is a gene-level,
      subfamily-level transfer. The benchmark horse model retains the catalytic cysteine loop (HCSDGAGRSG),
      but its non-conserved C-terminal exon removes the end of the domain, so this exact product is not
      established to be active.
    proposed_replacement_terms:
    - id: GO:0052866
      label: phosphatidylinositol phosphate phosphatase activity
    supported_by:
    - reference_id: PMID:20097759
      supporting_text: We report here that phogrin is able to dephosphorylate specific inositol phospholipids,
        including phosphatidylinositol (PI) 3-phosphate and PI 4,5-diphosphate but not PI 3,4,5-trisphosphate.
    - reference_id: PMID:20097759
      supporting_text: The PIPase activity of phogrin depended on the catalytic site cysteine and correlated
        with effects on glucose-stimulated insulin secretion.
    - reference_id: file:HORSE/PTPRN2/PTPRN2-bioinformatics/RESULTS-rereview.md
      supporting_text: Its PTP domain is incomplete at the C-terminal end, so whether it folds and is catalytically
        competent is untested.
