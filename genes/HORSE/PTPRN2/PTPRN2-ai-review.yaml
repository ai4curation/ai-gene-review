suggested_questions:
- question: Is the horse PTPRN2-208 transcript (ENSECAT00000094767), with its alternative terminal exon,
    expressed in any horse tissue, or is it a gene-build artifact?
- question: Does the C-terminal end of the PTPRN2 phosphatase-like domain, which this model replaces,
    affect folding or phosphoinositide phosphatase activity?
suggested_experiments:
- description: Express full-length horse A0A9L0T4W6 and canonical A0A9L0RAE3, each with a catalytic-cysteine-to-serine
    mutant, in HEK293 or INS-1 cells. Compare plasma-membrane PI(4,5)P2 levels and purified-protein PIPase
    activity, as in the rat phogrin assays.
  experiment_type: in vitro enzymology and cell-based PI(4,5)P2 imaging
- description: Use RT-PCR or long-read sequencing of horse pancreatic islet and brain RNA to test whether
    the alternative terminal exon used by A0A9L0T4W6 is present in real transcripts.
  experiment_type: transcript structure validation
