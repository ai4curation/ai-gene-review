    error_type: PSEUDOENZYME_OVERANNOTATION
    summary: Focused pseudophosphatase review refutes protein dephosphorylation for horse PTPRN2. As the
      IA-2 beta/phogrin pseudophosphatase ortholog, its wild-type PTP-like domain lacks conventional
      phosphoprotein-substrate activity, its demonstrated intrinsic catalytic activity is against phosphoinositide
      lipids, and its protein-directed roles are noncatalytic scaffolding or down-regulation of active
      receptor-type protein phosphatases. The GO:0006470 call is therefore a PTP-domain inheritance error,
      not a regulatory participation in protein dephosphorylation.
    supported_by:
    - reference_id: PMID:26620550
      supporting_text: PTPRN2 belongs to the protein tyrosine phosphatase family, but does not exhibit
        activity against phosphoprotein substrates due to several critical amino acid variations in the
        PTP domain (Magistrelli et al, 1996).
    - reference_id: file:HORSE/PTPRN2/PTPRN2-bioinformatics/RESULTS.md
      supporting_text: The selected horse sequence has a divergent C-terminal region, including deletion
        of human residues 989–1003 within the annotated phosphatase domain. The N-terminal signal sequence
        and transmembrane segment are retained. Substrate-specific enzymatic activity requires more than
        the global homology assignment.
    - reference_id: file:HORSE/PTPRN2/PTPRN2-hypotheses/horse40-protein-dephosphorylation/openscientist.md
      supporting_text: Because the only demonstrated PTPRN2 catalytic activity is on **phosphatidylinositol
        lipids**, it satisfies GO:0046856/GO:0052866 — **not** GO:0006470/GO:0004725, whose definitions
        explicitly require a protein substrate.
