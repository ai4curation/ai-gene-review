    summary: GO:0006470 asserts that PTPRN2 itself takes part in removing phosphate from proteins.
      PTPRN2 (IA-2beta/phogrin) is an IA-2 family pseudophosphatase (PANTHER PTHR46106:SF5) with no
      detectable activity on phosphoprotein or pNPP substrates. Its only demonstrated intrinsic catalytic
      activity, shown for the rat ortholog in the same subfamily, is dephosphorylation of phosphoinositide
      lipids. That is a different substrate class and supports phosphatidylinositol phosphate phosphatase
      activity, not protein dephosphorylation. The horse and human gene reviews remove the protein tyrosine
      phosphatase activity rows and the human GO:0006470 row on these grounds. Reported protein-directed
      effects are indirect. Phogrin protects PTP1B from oxidation and so allows PTP1B to dephosphorylate the
      insulin receptor, and a correlative cancer study proposes that PTPRN2 promotes STAT1 dephosphorylation
      without identifying an enzyme. At most these would support regulation of protein dephosphorylation,
      in which another phosphatase does the work. The horse model also lacks the conserved C-terminal end of
      the PTP-like domain. The prediction transfers a PTP-fold process to a pseudophosphatase and is refuted.
    supported_by:
    - reference_id: PMID:26620550
      supporting_text: PTPRN2 belongs to the protein tyrosine phosphatase family, but does not exhibit
        activity against phosphoprotein substrates due to several critical amino acid variations in the
        PTP domain (Magistrelli et al, 1996).
    - reference_id: PMID:26620550
      supporting_text: Recently, PTPRN2 was found to exhibit phosphatidylinositol phosphatase (PIP) activity
        against PI(4,5)P2 and, to a lesser extent, PI3P
    - reference_id: PMID:20097759
      supporting_text: In the absence of detectable ability to dephosphorylate phosphoproteins or p -nitrophenyl
        phosphate (pNPP), it has been suggested that phogrin and the closely related DCV protein IA-2 may
        function as a dominant negatives
    - reference_id: PMID:29483197
      supporting_text: protected recombinant PTP1B from oxidation to potentiate its activity toward the IR
    - reference_id: PMID:42139752
      supporting_text: PTPRN2 may promote STAT1 Y701 dephosphorylation and inhibit STAT1 activation
    - reference_id: file:HORSE/PTPRN2/PTPRN2-bioinformatics/RESULTS.md
      supporting_text: The selected horse sequence has a divergent C-terminal region, including deletion
        of human residues 989–1003 within the annotated phosphatase domain. The N-terminal signal sequence
        and transmembrane segment are retained. Substrate-specific enzymatic activity requires more than
        the global homology assignment.
    - reference_id: file:HORSE/PTPRN2/PTPRN2-hypotheses/horse40-protein-dephosphorylation/openscientist.md
      supporting_text: Horse A0A9L0T4W6 is the ortholog of human **PTPRN2 (IA-2β / phogrin)**
