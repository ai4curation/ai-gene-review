    summary: Human PTPRN2 lacks conventional phosphoprotein-substrate activity, and the focused
      OpenScientist report confirms that the selected horse protein is a PTPRN2 ortholog retaining the
      IA-2 pseudophosphatase active-site signature rather than an active protein tyrosine phosphatase.
      Reported intrinsic PTPRN2 activity is on phosphoinositide lipids, which is distinct from protein
      dephosphorylation, and the protein-directed regulatory evidence instead shows inhibitory modulation
      of an active RPTP. The horse-specific domain truncation leaves exact catalytic behavior unresolved,
      but the best available ortholog, sequence, and mechanistic evidence refutes the GO:0006470 prediction
      as a downstream over-propagation from PTP-domain presence to a pseudophosphatase.
    supported_by:
    - reference_id: PMID:26620550
      supporting_text: PTPRN2 belongs to the protein tyrosine phosphatase family, but does not exhibit
        activity against phosphoprotein substrates due to several critical amino acid variations in the
        PTP domain (Magistrelli et al, 1996).
    - reference_id: PMID:26620550
      supporting_text: Recently, PTPRN2 was found to exhibit phosphatidylinositol phosphatase (PIP) activity
        against PI(4,5)P2 and, to a lesser extent, PI3P
    - reference_id: file:HORSE/PTPRN2/PTPRN2-bioinformatics/RESULTS.md
      supporting_text: The selected horse sequence has a divergent C-terminal region, including deletion
        of human residues 989–1003 within the annotated phosphatase domain. The N-terminal signal sequence
        and transmembrane segment are retained. Substrate-specific enzymatic activity requires more than
        the global homology assignment.
    - reference_id: file:HORSE/PTPRN2/PTPRN2-hypotheses/horse40-protein-dephosphorylation/openscientist.md
      supporting_text: Horse A0A9L0T4W6 is the ortholog of human **PTPRN2 (IA-2β / phogrin)**
        ... Across multiple independent biochemical studies the wild-type IA-2 family PTP-like domain has
        **no activity against conventional (protein/phosphotyrosine) substrates** ... The **only demonstrated
        intrinsic catalytic activity** of phogrin/PTPRN2 is toward **phosphoinositide lipids**
        ... the only regulatory link that is directional *opposes* dephosphorylation
