suggested_questions:
- question: Does the TRAF2 RING have intrinsic E3 ligase activity in any physiological context (for example
    K48 ubiquitination of caspase-8, or NIK turnover), or is all TRAF2-dependent ubiquitination carried
    out by the recruited cIAPs?
- question: Is the 15-residue linker insertion in horse F7BIV4 (after human positions 260 and 265) supported
    by horse transcript data, or is it an artefact of the Ensembl gene model?
suggested_experiments:
- description: Reconstitute Traf2-null (or Traf2/Traf5 double-null) cells with RING-mutant TRAF2 that
    still binds cIAPs, and measure TNF-induced RIPK1 ubiquitination, JNK activation and NIK levels, to
    separate RING-dependent from recruitment-dependent outputs.
  experiment_type: genetic complementation
