id: F7BIV4
gene_symbol: F7BIV4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9796
  label: Equus caballus
description: TRAF2 is a cytoplasmic adaptor that organizes TNF receptor superfamily signaling complexes.
  Its C-terminal TRAF region engages receptors and associated proteins, while oligomerization and recruitment
  of cIAP ubiquitin ligases connect receptor activation to NF-kappaB, MAP kinase signaling and regulation
  of cell survival. TRAF2 also participates in selected immune-receptor and ER-stress signaling assemblies.
  Intrinsic ubiquitin-ligase activity has been reported in cofactor-dependent assays but remains mechanistically
  contested.
existing_annotations:
- term:
    id: GO:0004842
    label: ubiquitin-protein transferase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR037305
  review:
    summary: 'Intrinsic TRAF2 ubiquitin-transfer activity is contested at the mechanistic level: the RING/E2
      structural and biochemical study finds an unfavorable E2 interface, whereas a later purified-protein
      study reports S1P-dependent RIP1 ubiquitination and excludes detectable cIAP1/2 contamination. The
      positive assay cannot be discarded from the negative study alone, nor can cIAP recruitment establish
      TRAF2 catalysis. A universal autonomous E3 assignment remains unresolved. Transfer to F7BIV4 is
      supported by the retained RING/zinc-finger and C-terminal TRAF architecture, 92.0% paired identity
      and complete human-sequence coverage; horse-specific experimental confirmation is unavailable.'
    action: UNDECIDED
    reason: 'Intrinsic TRAF2 ubiquitin-transfer activity is contested at the mechanistic level: the RING/E2
      structural and biochemical study finds an unfavorable E2 interface, whereas a later purified-protein
      study reports S1P-dependent RIP1 ubiquitination and excludes detectable cIAP1/2 contamination. The
      positive assay cannot be discarded from the negative study alone, nor can cIAP recruitment establish
      TRAF2 catalysis. A universal autonomous E3 assignment remains unresolved. Transfer to F7BIV4 is
      supported by the retained RING/zinc-finger and C-terminal TRAF architecture, 92.0% paired identity
      and complete human-sequence coverage; horse-specific experimental confirmation is unavailable.'
    supported_by:
    - &id005
      reference_id: PMID:19810754
      supporting_text: 'These structural differences prevent TRAF2 from interacting with Ubc13

        and other related E2s via steric clash and unfavorable interfaces. Our

        structural observation should prompt a re-evaluation of the role of TRAF2 in

        TNFalpha signaling and may indicate that TRAF2-associated proteins such as cIAPs

        may be the ubiquitin ligases for NF-kappaB signaling.'
    - &id006
      reference_id: PMID:20577214
      supporting_text: In agreement with previous studies 20,21, incubation of purified RIP1 with recombinant
        TRAF2, ubiquitin, the ubiquitin-activating enzyme E1, and Ubc13/Uev1a, an E2 that facilitates
        Lys 63 polyubiquitination, failed to produce ubiquitinated RIP1. Remarkably however, addition
        of S1P induced efficient TRAF2-mediated ubiquitination of RIP1 (Fig. 3a).
    - &id001
      reference_id: file:HORSE/TRAF2/TRAF2-bioinformatics/RESULTS.md
      supporting_text: The downloaded human Q12933 sequence (501 residues) and selected horse F7BIV4 sequence
        (516 residues) share 92.0% identity among 501 paired residues. Paired coverage is 100.0% of human
        and 97.1% of horse.
