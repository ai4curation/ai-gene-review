id: F7BIV4
gene_symbol: TRAF2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9796
  label: Equus caballus
description: TRAF2 (TNF receptor-associated factor 2) is a cytoplasmic signaling adaptor of the TRAF
  family, built from an N-terminal RING domain, a series of TRAF-type zinc fingers, a coiled-coil (TRAF-N)
  region and a C-terminal MATH (TRAF-C) domain. The trimeric MATH domains bind the cytoplasmic tails of
  ligand-engaged TNF receptor superfamily members (such as TNFR2 and CD40) and adaptor proteins in the
  TNFR1 complex, while the coiled-coil region recruits the cIAP1/cIAP2 ubiquitin ligases. Through this
  recruitment TRAF2 couples receptor engagement to canonical NF-kappaB and JNK/MAP kinase activation and
  protects cells from TNF-induced apoptosis. In resting cells a TRAF2-TRAF3-cIAP assembly keeps the kinase
  NIK low and so restrains non-canonical NF-kappaB signaling. TRAF2 also binds the ER-stress sensor IRE1
  and links it to ASK1-JNK activation. Whether the atypical TRAF2 RING has intrinsic ubiquitin ligase
  activity is disputed. Structural work finds no productive E2 interface, a sphingosine-1-phosphate cofactor
  model is not supported by Sphk1-deficient cells, and much TRAF2-associated ubiquitination is carried
  out by the recruited cIAPs. The horse protein F7BIV4 is a full-length member of the TRAF2 orthologous
  subfamily, in which all domains and key binding residues are conserved; its functions are inferred from
  human and mouse TRAF2.
existing_annotations:
- term:
    id: GO:0004842
    label: ubiquitin-protein transferase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR037305
  review:
    summary: Intrinsic TRAF2 ubiquitin-transfer activity is unresolved. A RING/E2 structural and biochemical
      study finds no productive E2 interface. A purified-protein study reports S1P-dependent RIP1 ubiquitination,
      but Sphk1 deficiency does not reproduce TRAF2 loss in TNF signaling in vivo. Much TRAF2-dependent
      ubiquitination is carried out by the cIAPs that TRAF2 recruits.
    action: UNDECIDED
    reason: The PAINT curators placed GO:0004842 at the vertebrate TRAF2-clade node PTN002562154 (PTHR10131),
      seeded by human Q12933 and mouse Traf2 experimental annotations. F7BIV4 sits in the same PANTHER
      subfamily (PTHR10131:SF21) and keeps the RING Cys/His ligands, so placement is not the problem. The
      problem is the donor evidence itself. Yin et al. (PMID:19810754) report a RING that cannot engage
      Ubc13. Alvarez et al. (PMID:20577214) rescue activity only with an S1P cofactor. Etemadi et al. (PMID:26701909)
      show that TRAF2-dependent TNF signaling does not require Sphk1, and they summarise the field as
      holding that TRAF2 mainly acts by recruiting cIAPs. The human review keeps the same term UNDECIDED,
      and this row follows it.
    supported_by:
    - reference_id: PMID:19810754
      supporting_text: These structural differences prevent TRAF2 from interacting with Ubc13 and other
        related E2s via steric clash and unfavorable interfaces.
    - reference_id: PMID:20577214
      supporting_text: Remarkably however, addition of S1P induced efficient TRAF2-mediated ubiquitination
        of RIP1 (Fig. 3a).
    - reference_id: PMID:26701909
      supporting_text: Keratinocyte-specific deletion of Traf2, but not Sphk1 deficiency, disrupted TNF
        mediated NF-κB and MAP kinase signalling
    - reference_id: PMID:26701909
      supporting_text: support the idea that the main function of TRAF2 in TNF-induced NF-κB is to recruit
        cIAPs to the TNFR1-SC
