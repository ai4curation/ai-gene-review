        receptor signals, and in CD40-mediated, TNF-dependent IgM production.
    - reference_id: PMID:10514016
      supporting_text: in the absence of TRAF2, the T helper-dependent antibody response, CD40-mediated
        proliferation, and NF-kappaB activation are defective.
