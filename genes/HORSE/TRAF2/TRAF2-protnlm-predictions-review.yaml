    label: regulation of immunoglobulin production
  predicted_term_type: GO_BP
  review:
    assessment: COR
    confidence_score: 2
    summary: Mouse CD40 C-terminal-tail experiments support antibody isotype switching through an alternative
      TRAF2-binding site, and direct human TRAF2–CD40 binding establishes the molecular connection. Conserved
      full-length horse TRAF2 supports this broad humoral-regulatory role. This is a mammalian functional
      inference, not direct horse antibody-response measurement or proof of every isotype-specific effect.
      The supported annotation is absent from the frozen horse GOA; model training membership is unknown.
    supported_by:
    - reference_id: PMID:17360936
      supporting_text: 'Previously, we have shown

        signaling through the C-terminal tail of CD40 in the absence of canonical

        TRAF-binding sites is capable of signaling through an alternative TRAF2-binding

        site. Here, we demonstrate that B cells from mice harboring CD40 with only the

        C-terminal tail can activate both canonical and noncanonical NFkappaB signaling

        pathways. Moreover, while lacking germinal center formation, several hallmarks

        of humoral immune responses including clonal B-cell activation/expansion,

        antibody isotype switching, and affinity maturation remain normal.'
    - *id003
    - *id001
