id: F7BIV4
gene_symbol: TRAF2
taxon:
  id: NCBITaxon:9796
  label: Equus caballus
status: COMPLETE
description: Horse F7BIV4 is a full-length member of the TRAF2 orthologous subfamily, a cytoplasmic adaptor
  that binds TNF receptor superfamily tails (including CD40) through its MATH domain and recruits cIAP1/2
  ubiquitin ligases. All five ProtNLM2 terms are supported by experimental evidence on human or mouse TRAF2
  and are absent from the horse GOA set, which carries only TNF receptor binding (not an ancestor of
  CD40 receptor binding), signaling, apoptosis, JNK and disputed E3-activity terms.
