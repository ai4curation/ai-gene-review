  predicted_term:
    id: GO:0002637
    label: regulation of immunoglobulin production
  predicted_term_type: GO_BP
  review:
    assessment: COR
    confidence_score: 2
    summary: TRAF2-deficient mouse B cell lines are defective in CD40-mediated, TNF-dependent IgM production,
      and TRAF2-deficient mice have defective T helper-dependent antibody responses; mouse Traf2 carries
      this term by IMP. Horse F7BIV4 is a full-length member of the same TRAF2 orthologous subfamily
      with the receptor-binding MATH domain conserved, which justifies transfer. The horse gene has no
      immunoglobulin-production annotation in GOA. The role is a downstream, non-core consequence of
      TRAF2's CD40 adaptor function.
    supported_by:
