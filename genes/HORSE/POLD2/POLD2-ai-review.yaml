  findings:
  - statement: Mammalian Pol delta is a POLD1-POLD2-POLD3-POLD4 heterotetramer in which POLD2 has a central
      structural role; a patient POLD2 variant destabilises the complex.
    supporting_text: On the one hand, the identified POLD2 mutant leads to severe polymerase δ complex
      instability
