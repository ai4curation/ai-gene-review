id: F7DA84
gene_symbol: POLD2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9796
  label: Equus caballus
description: POLD2 (p50) is the non-catalytic B subunit of DNA polymerase delta, the B-family replicative
  polymerase that synthesizes lagging-strand (and some leading-strand) DNA and performs repair-associated
  DNA synthesis. Within the heterotetramer (POLD1, POLD2, POLD3, POLD4) POLD2 bridges the catalytic subunit
  POLD1 and the PCNA-binding subunit POLD3 and is needed for holoenzyme stability. POLD2 and POLD3 are
  also accessory subunits of the translesion polymerase zeta (REV3L-REV7-POLD2-POLD3), where they raise
  the efficiency and processivity of lesion bypass, and POLD2 binds the Y-family polymerase eta. The
  protein has an N-terminal OB-fold domain and a C-terminal inactive calcineurin-like phosphoesterase
  fold and acts in the nucleoplasm. The horse protein is 469 residues long and 95% identical to human
  POLD2 over its full length.
