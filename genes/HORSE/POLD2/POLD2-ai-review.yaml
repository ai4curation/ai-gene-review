  review:
    summary: InterPro2GO DNA binding from the DNA polymerase alpha/delta/epsilon subunit B family (IPR007185).
      POLD2 is a structural accessory subunit; DNA is engaged by the catalytic subunit and by POLD3/PCNA,
      and the PolD2-PolD3 structure lacks an evident DNA-binding surface.
    action: MARK_AS_OVER_ANNOTATED
    reason: No direct DNA binding by POLD2 has been shown, and the structure argues against a DNA-binding
      surface. The family-level mapping overstates what this subunit does; consistent with the human
      POLD2 review.
