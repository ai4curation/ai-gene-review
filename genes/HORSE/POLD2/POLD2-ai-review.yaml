- term:
    id: GO:0042276
    label: error-prone translesion synthesis
  evidence_type: ISS
  original_reference_id: file:HORSE/POLD2/POLD2-bioinformatics/RESULTS.md
  qualifier: involved_in
  review:
    summary: Proposed. As a subunit of Pol zeta4, POLD2 raises the efficiency and processivity of lesion
      bypass, i.e. it contributes structurally to the polymerase that performs the step.
    action: NEW
    reason: The POLD2-containing Pol zeta4 extends primers across cisplatin lesions, and POLD2 and POLD3
      enhance the association of Pol zeta with DNA, so POLD2 does part of the work of the process as a
      complex subunit (not merely being required for it). PAINT places this term (IBD, seeded by SGD Pol31
      and human POLD2) at PTN000045935, ancestral to horse POLD2.
    supported_by:
    - reference_id: PMID:24449906
      supporting_text: The purified four-subunit Pol ζ4 (Rev3–Rev7–PolD2–PolD3) is much more efficient and
        more processive at bypassing a 1,2-intrastrand d(GpG)-cisplatin cross-link than the two-subunit
        Pol ζ2 (Rev3–Rev7).
    - reference_id: PMID:24449906
      supporting_text: The effect of decreased K M and increased processivity suggests that PolD2 and PolD3
        significantly enhance association of Pol ζ with DNA substrates.
