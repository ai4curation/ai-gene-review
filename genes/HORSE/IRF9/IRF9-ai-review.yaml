id: A0A9L0SN53
gene_symbol: IRF9
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9796
  label: Equus caballus
description: IRF9 (ISGF3 gamma, p48) is the interferon regulatory factor that serves as the DNA-recognition
  subunit of the ISGF3 transcription factor complex. Its N-terminal IRF tryptophan-pentad domain binds
  interferon-stimulated response elements (ISREs), and its C-terminal IRF-association domain binds the
  coiled-coil domain of STAT2. In response to type I (and type III) interferons, tyrosine-phosphorylated
  STAT1-STAT2 heterodimers associate with IRF9 to form ISGF3, which accumulates in the nucleus and activates
  RNA polymerase II transcription of interferon-stimulated genes, establishing the antiviral state. The
  horse gene encodes several predicted transcripts; this canonical model (529 aa) carries an 84-residue
  proline-rich insertion within the IRF-association domain that is absent from human, mouse and donkey
  IRF9 and from the RefSeq-supported horse model.
