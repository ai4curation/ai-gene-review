id: F6X2Q2
gene_symbol: SLC27A5
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9796
  label: Equus caballus
description: SLC27A5 (bile acyl-CoA synthetase, BACS; fatty acid transport protein 5, FATP5) is a liver-enriched
  member of the FATP subfamily of ATP-dependent AMP-binding (ANL superfamily) acyl-CoA synthetases. It is anchored
  in the endoplasmic reticulum membrane by an N-terminal hydrophobic region and has a large cytoplasmic catalytic
  domain. Its main role is the ATP-dependent activation of C24 bile acids (cholate, chenodeoxycholate and the secondary
  bile acids deoxycholate and lithocholate) to their CoA thioesters, the step that precedes glycine or taurine conjugation,
  so that bile acids returning to the liver through the enterohepatic circulation are re-activated and re-conjugated.
  It also activates long-chain and very-long-chain fatty acids (C18 to C26) to acyl-CoAs and contributes to hepatic
  long-chain fatty acid uptake, with a minor plasma-membrane pool. The horse UniProt entry F6X2Q2 (671 aa) is an
  alternative gene model whose first 599 residues are identical to the full-length horse model A0A5F5PXH2 (700 aa)
  but whose C-terminal 72 residues are unrelated to the conserved SLC27A5 C-terminus and lack the AMP-binding C-terminal
  subdomain.
