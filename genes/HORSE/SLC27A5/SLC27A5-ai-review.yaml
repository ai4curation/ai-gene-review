suggested_questions:
- question: Is any horse transcript encoding the F6X2Q2 C-terminus (residues 600-671) expressed, or is ENSECAT00000018051
    a mis-predicted 3-prime end of the SLC27A5 gene whose correct product is A0A5F5PXH2?
- question: Should PAINT place cholate-CoA ligase activity (GO:0047747) on an SLC27A5-specific (SF25) node, given
    that SLC27A2 at the current bile acid node does not activate C24 bile acids?
suggested_experiments:
- description: RT-PCR or long-read sequencing of horse liver SLC27A5 transcripts to determine which 3-prime exon
    structure is used, followed by cholate- and lignocerate-CoA ligase assays of recombinant horse protein.
