        from the second branchial arch into more anterior structures
    - reference_id: PMID:25889273
      supporting_text: Ectopic Hoxa2 expression results in the transformation of the proximal Meckel's
        cartilage and of the malleus, two ventral PA1 CNCCs derivatives, into a supernumerary styloid
