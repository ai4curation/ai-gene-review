- term:
    id: GO:0061061
    label: muscle structure development
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:P31245
  - ensembl:ENSMUSP00000014848
  review:
    summary: Ensembl Compara projection of a mouse Hoxa2 annotation from an ectopic-expression
      study in cranial neural crest (PMID:25889273).
    action: MARK_AS_OVER_ANNOTATED
    reason: The cached abstract of the source study describes only effects on skeletal derivatives
      of neural crest and says nothing about muscle. HOXA2 acts in neural crest mesenchyme, not in
      myogenic cells, so any effect on arch musculature is most likely an indirect consequence of
      a mispatterned skeleton and connective tissue. That is a downstream phenotype, not
      participation in muscle development. The full text was not available, so this is marked as
      over-annotated rather than removed.
    supported_by:
    - reference_id: PMID:25889273
      supporting_text: Here we show that ectopic expression of Hoxa2 in Hox-negative CNCCs results
        in distinct phenotypes in different CNCC subpopulations.
