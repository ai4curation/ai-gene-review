suggested_questions:
- question: Is the 85-residue N-terminal segment of the Ensembl horse HOXA2 model (F7DP63)
    supported by any horse transcript evidence, or should the model be corrected to the RefSeq
    structure (XP_001499478.2), which has the conserved HOXA2 N-terminus and no predicted signal
    peptide?
- question: Does the MGI annotation of mouse Hoxa2 to muscle structure development (PMID:25889273)
    reflect a cell-autonomous role in muscle, or a secondary effect of mispatterned neural crest?
suggested_experiments:
- description: 5' RACE or long-read RNA-seq from horse embryonic or adult tissues expressing
    HOXA2, to determine the true first exon and protein N-terminus.
