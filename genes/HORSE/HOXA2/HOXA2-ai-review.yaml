  review:
    summary: Ensembl Compara projection of the mouse Hoxa2 annotation from ectopic-expression work
      in cranial neural crest (PMID:25889273).
    action: MODIFY
    reason: HOXA2 acts on skeletal development through the skeletal elements derived from the
      pharyngeal arches. Knockouts transform the second-arch skeleton, and ectopic expression
      turns first-arch elements (malleus, proximal Meckel's cartilage) into second-arch-like
      structures. HOXA2 takes part as the selector TF that sets neural crest identity, so the
      supported term is the more specific descendant, embryonic viscerocranium morphogenesis.
      This process is pleiotropic and developmental, so it is not core.
    proposed_replacement_terms:
    - id: GO:0048703
      label: embryonic viscerocranium morphogenesis
