id: F7DP63
gene_symbol: HOXA2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9796
  label: Equus caballus
description: HOXA2 (homeobox protein Hox-A2) is a nuclear homeodomain transcription factor of the
  Antp homeobox family, proboscipedia subfamily, and the paralog-group-2 member of the HOXA cluster.
  It binds Hox and Pbx-Hox motifs in RNA polymerase II cis-regulatory regions through its homeodomain
  and uses an N-terminal YPWM hexapeptide to cooperate with PBX/MEIS cofactors. Depending on the
  target it represses transcription (for example Six2) or activates it at second-arch enhancers.
  In the mammalian embryo HOXA2 gives the cranial neural crest mesenchyme of the second pharyngeal
  arch its identity, which determines the shape of the middle-ear and hyoid skeletal elements. It
  also patterns hindbrain rhombomeres 2-3. Loss of HOXA2 in mouse turns second-arch skeletal
  elements into first-arch-like duplicates and causes cleft palate. A human HOXA2 homeodomain
  variant causes microtia with hearing impairment. The horse UniProt entry F7DP63 comes from an
  Ensembl gene model whose first 85 residues are not homologous to the conserved HOXA2 N-terminus.
  Residues 86-404 match the horse RefSeq HOXA2 protein almost exactly and contain an intact
  hexapeptide and homeodomain.
