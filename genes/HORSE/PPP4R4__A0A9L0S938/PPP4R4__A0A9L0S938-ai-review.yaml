  label: Equus caballus
description: >-
  PPP4R4 (serine/threonine-protein phosphatase 4 regulatory subunit 4) of the horse is an 869-residue
  noncatalytic protein built largely of HEAT/ARM-type repeats, followed by a coiled-coil segment and a
  disordered C-terminal tail. A0A9L0S938 is the UniProt gene-centric canonical product of the single horse
  PPP4R4 gene (Ensembl ENSECAG00000019485, chromosome 24). It is 95% identical over its full length to human
  PPP4R4 (Q6NUP7) and belongs to the same PANTHER subfamily (PTHR21467:SF0), so it is the one-to-one ortholog
  of the human protein. Nothing about horse PPP4R4 has been tested experimentally. Its function is inferred
  from human PP4R4, which binds the PP4 catalytic subunit PPP4C specifically (not PP2Ac or PP6c) at an
  interface like the one the PP2A A subunit uses. Human PP4R4 forms a stable cytosolic PPP4C-PPP4R4 complex
  that is separate from the other PP4 holoenzymes and lowers PPP4C activity toward model substrates in vitro.
  By orthology, horse PPP4R4 is expected to be a cytosolic regulatory subunit of protein phosphatase 4. Its
  physiological substrates and the cellular processes it regulates are unknown in any species.
