suggested_questions:
- question: Does horse PPP4R4 co-purify with horse PPP4C as a stable cytosolic complex, as the human
    ortholog does, and in which horse tissues is it expressed?
- question: Do the horse PPP4R4 splice products that differ only at the disordered C-terminus (A0A9L0S938 and
    A0A9L0S961) differ in PP4c binding or localization?
suggested_experiments:
- description: Affinity purification and mass spectrometry of tagged horse PPP4R4 from equine cells, to test
    whether it binds PPP4C specifically (and not PPP2CA or PPP6C), as human PP4R4 does.
- description: Phosphoproteomics in PPP4R4-knockout versus wild-type cells, to identify substrates whose
    dephosphorylation depends on PPP4R4 but not on PPP4R2/PPP4R3.
