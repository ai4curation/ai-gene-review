- term:
    id: GO:0060271
    label: cilium assembly
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q8CFW7
  - ensembl:ENSMUSP00000048320
  review:
    summary: Compara transfer from mouse Cc2d2a, which does structural work at the mother centriole in
      early ciliogenesis; core process.
    action: ACCEPT
    reason: The donor passes the participation test, not just the necessity test. Endogenous Cc2d2a sits
      on the subdistal appendages that it is needed to build, as shown by immunogold. Its loss abolishes
      appendage assembly, microtubule anchoring, vesicle docking and transition-zone elaboration while
      the mother centriole persists, and a Cc2d2a transgene rescues axoneme assembly. The requirement depends
      on the tissue; some Cc2d2a-/- MEFs still form cilia. The general term is therefore correct here,
      alongside the more specific IBA non-motile cilium assembly. The donor is a same-subfamily ortholog.
    supported_by:
    - reference_id: PMID:24947469
      supporting_text: We therefore conclude that CC2D2A is needed for the assembly of SDA at mother centriole,
        for stable MT anchoring and docking of transport vesicles, and for further elaboration of the transition
        zone.
    - reference_id: PMID:24947469
      supporting_text: rescue the axoneme assembly defect
    - reference_id: PMID:21725307
      supporting_text: Thus, Cc2d2a shares tissue-specific ciliogenic functions with Tctn1 and Tctn2.
