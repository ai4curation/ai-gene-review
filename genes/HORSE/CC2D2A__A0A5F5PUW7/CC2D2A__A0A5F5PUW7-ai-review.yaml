  review:
    summary: Ensembl Compara transfer from mouse Cc2d2a. In mouse the protein is needed for Hedgehog signalling
      because it gates Smoothened entry into the cilium, not because it transduces the signal.
    action: KEEP_AS_NON_CORE
    reason: The donor, mouse Cc2d2a, is in the same PANTHER subfamily (SF7) as the horse protein, which
      is 85% identical to it (file:HORSE/CC2D2A__A0A5F5PUW7/CC2D2A__A0A5F5PUW7-bioinformatics/RESULTS.md).
      So the transfer is phylogenetically sound. In Cc2d2a-/- MEFs, ciliary Smoothened is strongly reduced
      after SAG stimulation, and null embryos lose ventral, Shh-dependent neural-tube fates. CC2D2A contributes
      through transition-zone control of ciliary membrane composition and has no ligand, receptor, kinase
      or transcription-factor role. The term is therefore true but peripheral, matching the action on
      the human ortholog. There is no horse experimental evidence.
    supported_by:
    - reference_id: PMID:21725307
      supporting_text: Smo displayed reduced ciliary localization in Tctn1−/− and Tctn2−/− MEFs treated
