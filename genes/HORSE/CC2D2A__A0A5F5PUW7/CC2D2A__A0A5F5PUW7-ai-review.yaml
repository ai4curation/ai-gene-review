id: A0A5F5PUW7
gene_symbol: CC2D2A
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9796
  label: Equus caballus
description: CC2D2A (coiled-coil and C2 domain-containing protein 2A, MKS6) of the horse is a large
  (1,643 residues) non-catalytic structural protein of the ciliary base. A0A5F5PUW7 is the full-length
  product of the horse gene (ENSECAG00000025115). It is a 1:1 ortholog of human CC2D2A (about 89% identity
  over the whole length) and mouse Cc2d2a, and belongs to the same PANTHER subfamily (PTHR20837:SF7). It
  has the same architecture as the human protein, an N-terminal disordered region, central coiled coils,
  a CC2D2AN-C2 module, a transglutaminase-like peptidase fold whose catalytic residues are lost throughout
  the CC2D2A clade, and a C-terminal C2 domain. Almost all residues that carry disease-associated missense
  variants in human are conserved. By orthology, horse CC2D2A is expected to be a core subunit of the
  MKS/Tectonic module of the ciliary transition zone. There it is needed to localize the module's components
  and, through them, to keep the ciliary membrane's distinctive composition, including the ciliary entry
  of Smoothened needed for Hedgehog signalling. It is also expected to sit on the subdistal appendages
  of the mother centriole, where in mouse it is needed to assemble the appendages, anchor microtubules,
  dock ciliary vesicles and extend the axoneme. None of these functions has been tested experimentally
  in horse; all are inferred from mouse, human, worm and zebrafish orthologs.
