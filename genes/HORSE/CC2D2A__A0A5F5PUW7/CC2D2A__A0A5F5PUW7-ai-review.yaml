suggested_questions:
- question: Do horse CC2D2A variants contribute to equine cerebellar, renal or retinal disorders resembling
    Joubert, Meckel or retinitis pigmentosa phenotypes? The human disease positions are almost all conserved
    in horse.
- question: Which CC2D2A surfaces (coiled coils, CC2D2AN-C2, inactive TGL fold, C-terminal C2) contact
    MKS-module partners, CEP290, NINL and subdistal-appendage proteins?
suggested_experiments:
- description: Immunolocalize endogenous CC2D2A in ciliated horse cells (for example airway or oviduct
    epithelium, where the gene is expressed) together with transition-zone and subdistal-appendage markers.
    This would directly test the locations inferred here by orthology.
  experiment_type: immunofluorescence / immunogold electron microscopy
