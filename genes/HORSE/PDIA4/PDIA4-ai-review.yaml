description: 'PDIA4 (ERp72) is an endoplasmic reticulum luminal thiol-disulfide oxidoreductase of the
  protein disulfide isomerase (PDI) family. The horse protein (645 aa) has an N-terminal signal peptide,
  an acidic N-terminal stretch, three catalytic thioredoxin-like domains each carrying a CGHC redox-active
  site, two non-catalytic thioredoxin-fold domains, and a C-terminal REEL ER retrieval signal; it is 90%
  identical to human ERp72 over its full length. PDIA4 catalyses the oxidation, reduction and isomerization
  of disulfide bonds in nascent secretory and membrane proteins, and acts within a large ER chaperone
  network with BiP (HSPA5), GRP94 (HSP90B1), PDI, ERdj3, cyclophilin B, GRP170, UGGT1 and SDF2L1 that
  binds incompletely folded client proteins such as immunoglobulin heavy chains and thyroglobulin. It
  is an ER stress-inducible protein, and small amounts are released and found at the cell surface, for
  example on activated platelets.'
