suggested_questions:
- question: Which client proteins depend specifically on ERp72 rather than on PDI or ERp57, given that their
    in vitro thiol-disulfide oxidase chemistry is very similar?
suggested_experiments:
- description: Quantitative proteomics of disulfide-bonded secretory clients (e.g. trapping with CXXA active-site
    mutants) in cells lacking PDIA4 compared with cells lacking P4HB or PDIA3, to define ERp72-specific substrates.
