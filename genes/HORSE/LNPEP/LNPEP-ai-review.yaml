gene_symbol: LNPEP
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9796
  label: Equus caballus
description: >-
  LNPEP (leucyl-cystinyl aminopeptidase, also called oxytocinase, placental
  leucine aminopeptidase, or insulin-regulated aminopeptidase IRAP) encodes a
  zinc-dependent M1-family metalloaminopeptidase. It is a single-pass type-II
  membrane protein with a cytosolic N-terminal region carrying a tankyrase-binding
  RXXPDG motif, a transmembrane anchor, and a large extracellular or
  vesicle-lumen-facing catalytic domain with the HEXXH-(18)-E zinc-binding and
  GAMEN aminopeptidase motifs. By orthology to the experimentally studied human
  and rodent enzymes, it removes N-terminal residues from peptide hormones and
  neuropeptides such as oxytocin, vasopressin, angiotensin III, Met-enkephalin and
  dynorphin, and it cycles between intracellular storage vesicles and the plasma
  membrane. The horse protein has not been studied directly.
