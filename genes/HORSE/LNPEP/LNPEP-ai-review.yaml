core_functions:
- description: >-
    Membrane-anchored zinc-dependent M1 metalloaminopeptidase whose catalytic
    ectodomain removes N-terminal residues from peptide hormones and neuropeptides
    (by orthology to human LNPEP: oxytocin, vasopressin, angiotensin III,
    Met-enkephalin, dynorphin). It acts at the plasma membrane and in intracellular
    vesicle membranes, between which it is redistributed.
  molecular_function:
    id: GO:0070006
    label: metalloaminopeptidase activity
  directly_involved_in:
  - id: GO:0043171
    label: peptide catabolic process
  - id: GO:0010813
    label: neuropeptide catabolic process
  locations:
  - id: GO:0005886
    label: plasma membrane
  - id: GO:0030659
    label: cytoplasmic vesicle membrane
  supported_by:
  - reference_id: PMID:1731608
    supporting_text: We also examined the hydrolytic activity of P-LAP using naturally occurring peptide hormones and found that the enzyme hydrolyzed oxytocin, vasopressin, and angiotensin III.
  - reference_id: PMID:11389728
    supporting_text: P-LAP was shown to degrade several bioactive neuropeptides such as Met-enkephalin and dynorphin A (1-8).
  - reference_id: file:HORSE/LNPEP/LNPEP-bioinformatics/RESULTS.md
    supporting_text: Horse LNPEP is the 1:1 ortholog of human LNPEP by shared PANTHER subfamily
suggested_questions:
- question: >-
    Is the roughly 30-residue N-terminal extension in the horse Ensembl model
    (ENSECAT00000084437.1) translated in vivo, or does the true initiator match the
    human start site, as conservation suggests?
- question: >-
    Do equine LNPEP orthologs take part in endosomal MHC class I cross-presentation
    and GLUT4 storage-vesicle trafficking as the human and mouse proteins do? These
    roles are not propagated by PAINT and are untested in horse.
