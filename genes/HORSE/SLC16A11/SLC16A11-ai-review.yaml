  label: Equus caballus
description: SLC16A11 (monocarboxylate transporter 11, MCT11) is a twelve-transmembrane-helix member of the
  proton-linked monocarboxylate transporter family (SLC16, TC 2.A.1.13) of the major facilitator superfamily.
  Horse SLC16A11 falls in PANTHER subfamily PTHR11360:SF80 with human SLC16A11. The human protein carries out
  H+-coupled pyruvate transport across the plasma membrane, and its cell-surface delivery depends on the
  ancillary protein basigin (BSG). Most of the human protein sits in the endoplasmic reticulum membrane. It is
  expressed in liver, salivary gland and thyroid and affects hepatic lipid metabolism; reduced-function
  variants raise type 2 diabetes risk. The horse entry F6YMY3 is the Ensembl-canonical but probably aberrant
  gene model. It has a 73-residue disordered N-terminal extension and a divergent C-terminus in place of the
  conserved twelfth transmembrane helix and cytoplasmic tail.
