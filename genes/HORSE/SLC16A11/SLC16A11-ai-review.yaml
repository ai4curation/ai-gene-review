  review:
    summary: Monocarboxylic acid transmembrane transporter activity from PAINT node PTN000888455 (Eumetazoa).
      Human SLC16A11 is among the donors.
    action: ACCEPT
    reason: Horse SLC16A11 is in the same PANTHER subfamily (PTHR11360:SF80) as human SLC16A11. The human protein
      is an H+-coupled monocarboxylate transporter with demonstrated pyruvate transport. The horse sequence keeps
      TM1-TM11 of the MFS fold at about 86% identity. This is the core activity of the gene. PAINT did not
      propagate a pyruvate-specific term, and the horse protein's substrate has not been tested, so this term is
      as precise as the evolutionary evidence supports for the horse gene. The F6YMY3 model lacks the conserved
      TM12 region, but another product of the same gene (A0A9L0RBE3) keeps it, and the annotation describes the gene.
    supported_by:
    - reference_id: PMID:28666119
      supporting_text: SLC16A11 is a H+-coupled monocarboxylate transporter
