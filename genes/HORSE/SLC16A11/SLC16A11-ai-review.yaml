suggested_questions:
- question: Is the Ensembl-canonical horse SLC16A11 transcript (F6YMY3), whose C-terminus diverges where human
    TM12 lies, a real expressed isoform, or should the canonical model be the TM12-containing product (A0A9L0RBE3)
    with an N-terminus starting at the residue matching human Met1?
- question: Does horse SLC16A11 transport pyruvate, like the human ortholog, and does it need BSG for surface expression?
suggested_experiments:
- description: Long-read cDNA sequencing of horse liver SLC16A11 transcripts to settle the 5' start and 3' exon
    structure. Then a pyronic FRET pyruvate-uptake assay of the full-length horse protein co-expressed with BSG in HEK293T cells.
