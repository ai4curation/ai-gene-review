gene_symbol: ENTR1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9796
  label: Equus caballus
description: ENTR1 (endosome-associated-trafficking regulator 1, also called SDCCAG3) is a cytoplasmic
  coiled-coil protein of early and recycling endosomes with no defined enzymatic activity. In mammalian
  cells it associates with the SNX27-retromer machinery (it binds VPS35) and supports endosome-to-plasma-membrane
  recycling of selected cargo such as the glucose transporter GLUT1. It also accumulates at the midbody
  during cytokinesis, where it forms a complex with the phosphatase PTPN13 and the Arf GAP GIT1 and is
  needed for normal completion of cell division, and it localizes to the centrosome and ciliary basal
  body, where its N-terminal region binds IFT88 and supports primary cilium formation and ciliary delivery
  of polycystin-2. The horse protein (459 aa, Ensembl-canonical model) is a one-to-one ortholog of human
  ENTR1 (86% identity) with an intact C-terminal ENTR1 coiled-coil region; its N-terminal disordered region
  differs from human isoform 1 only by alternative exons.
