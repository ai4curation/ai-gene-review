  - *id012
suggested_questions:
- question: Is the PANTHER split of human ENTR1 (PTHR31259:SF6) from horse and mouse ENTR1 (SF3) a real
    subfamily boundary or an HMM-scoring artifact among one-to-one mammalian orthologs?
- question: Does ENTR1 have a molecular activity (for example a specific adaptor role between retromer,
    GIT1/PTPN13 and IFT88) that would justify an MF term beyond protein binding?
suggested_experiments:
- description: Compare horse ENTR1 splice forms (A0A5F5Q1J2, which contains the Gly/Arg-rich exon, versus
    F6QT44) for basal-body targeting and IFT88 binding in equine cells, to test whether the alternative
    N-terminal exons alter ciliary function.
