- description: Endosome-associated coiled-coil regulator of cargo recycling, resident on early and recycling
    endosomes alongside SNX27-retromer. No molecular activity has been defined, so no molecular_function
    is asserted.
  locations:
  - id: GO:0005769
    label: early endosome
  - id: GO:0055037
    label: recycling endosome
  supported_by:
  - *id001
  - *id006
- description: Regulation of cytokinesis, with accumulation at the midbody in a complex with PTPN13 and
    GIT1.
  directly_involved_in:
  - id: GO:0032465
    label: regulation of cytokinesis
  supported_by:
  - *id007
  - *id005
- description: Support of primary cilium formation and ciliary delivery of membrane cargo (polycystin-2)
    from the ciliary base, through IFT88 binding by the N-terminal region.
  directly_involved_in:
