id: A0A9L0TTC1
gene_symbol: GPAM
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9796
  label: Equus caballus
description: GPAM encodes glycerol-3-phosphate acyltransferase 1, mitochondrial (GPAT1), a peripheral membrane enzyme
  on the cytosolic face of the mitochondrial outer membrane. It transfers a fatty acyl group from long-chain acyl-CoA,
  preferentially palmitoyl-CoA, to the sn-1 position of glycerol-3-phosphate to form lysophosphatidic acid, the
  committed first step of de novo glycerolipid synthesis. The lysophosphatidic acid is acylated further to phosphatidic
  acid by other enzymes and feeds triacylglycerol and glycerophospholipid synthesis; in liver this partitions acyl-CoA
  toward esterification rather than mitochondrial beta-oxidation. The enzyme has an N-terminal acyltransferase domain
  with an HXXXXD catalytic motif and a C-terminal domain needed for folding, and associates with the membrane through
  an amphipathic surface and an N-terminal loop-helix that carries the mitochondrial-targeting signal. This UniProt
  entry (A0A9L0TTC1, 790 aa) is one of several horse GPAM splice products and lacks a 38-residue segment of the
  catalytic domain present in the canonical 828-aa product (A0A9L0TCA8); its own activity has not been tested.
