  review:
    summary: 'glycerol-3-phosphate O-acyltransferase activity: GPAT1 catalyzes the initial acyl-CoA-dependent
      step that supplies lysophosphatidic acid for glycerolipid synthesis at the mitochondrial outer membrane.
      Participation in downstream lipid biosynthetic routes does not mean GPAT1 catalyzes every later
      reaction. The human structural study independently establishes GPAT1 identity and membrane association.
      Transfer to horse is an inference; the paired-sequence report records model-specific gaps and limits.'
