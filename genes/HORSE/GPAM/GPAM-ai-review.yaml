  review:
    action: ACCEPT
    summary: Glycerol-3-phosphate O-acyltransferase activity is the defining catalytic activity of GPAT1.
    reason: Human GPAT1 catalyses acyl transfer from acyl-CoA to the sn-1 position of glycerol-3-phosphate (cryo-EM
      structure plus functional assays, PMID:36522428; experimentally supported UniProt function). Horse GPAM is
      in the same PANTHER subfamily (PTHR12563:SF16) and descends from PAINT node PTN000970957, where curators placed
      this activity for metazoan GPAT1/GPAT2, so the transfer is phylogenetically grounded rather than a best-hit
      inference. A0A9L0TTC1 itself is a non-canonical splice product lacking human-equivalent residues 370-407,
      a conserved catalytic-domain segment with resolved secondary structure; it keeps the HXXXXD motif and all
      six CoA-binding residues, but whether this isoform is active is untested, so the annotation is accepted as
      a statement about the GPAM gene product.
