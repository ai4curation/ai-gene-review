suggested_questions:
- question: Is the horse GPAM transcript ENSECAT00000105322 (A0A9L0TTC1), which skips a 38-codon segment encoding
    part of the catalytic domain (human residues 370-407), expressed as protein, and does it retain glycerol-3-phosphate
    acyltransferase activity?
suggested_experiments:
- description: Express canonical horse GPAM (A0A9L0TCA8) and the 790-aa isoform A0A9L0TTC1 side by side and compare
    NEM-resistant glycerol-3-phosphate acyltransferase activity with palmitoyl-CoA and mitochondrial outer-membrane
    targeting; confirm isoform expression by RT-PCR across the skipped exon junction.
