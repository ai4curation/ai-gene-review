- term:
    id: GO:0035773
    label: insulin secretion involved in cellular response to glucose stimulus
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:102765
  - MGI:MGI:107418
  - PANTHER:PTN000439772
  review:
    summary: PAINT propagation from the vertebrate IA-2/IA-2beta node PTN000439772, seeded by mouse Ptprn
      and Ptprn2.
    action: ACCEPT
    reason: The curators restricted this term to the vertebrate PTPRN/PTPRN2 node rather than the deeper
      family node, and horse PTPRN2 is a eutherian member of that clade. Mouse Ptprn2 knockout alone impairs
      glucose-stimulated insulin secretion and reduces dense-core vesicle number, half-life and insulin
      content, and in rat phogrin the catalytic-cysteine-dependent PIPase activity correlates with effects
      on glucose-stimulated insulin secretion. The protein acts as a component of the dense-core granule
      membrane that maintains granule number and membrane phosphoinositides, which is participation in the
      secretory process. Inferred for horse; there is no horse-specific data.
    supported_by:
    - reference_id: PMID:15220191
      supporting_text: The IA-2beta(-/-) mice, in contrast to wild-type controls, showed mild glucose intolerance and impaired glucose-stimulated insulin secretion.
    - reference_id: PMID:21732083
      supporting_text: Islets from single and DKO mice all showed a significant decrease in insulin content, insulin secretion and the number and half-life of DCV
    - reference_id: PMID:20097759
      supporting_text: The PIPase activity of phogrin depended on the catalytic site cysteine and correlated
        with effects on glucose-stimulated insulin secretion.
