- term:
    id: GO:0051046
    label: regulation of secretion
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - FB:FBgn0031294
  - PANTHER:PTN000439769
  - WB:WBGene00002048
  review:
    summary: PAINT propagation from the IA-2 family node PTN000439769, seeded by fly and worm IA-2 orthologs.
    action: ACCEPT
    reason: Regulation of dense-core-vesicle-dependent secretion is the conserved role across the IA-2
      family, from invertebrate IDA-1/IA-2 to mammalian PTPRN and PTPRN2, and horse PTPRN2 sits within that
      clade. In vertebrates, Ptprn2 knockout reduces dense-core vesicle number and insulin secretion and
      IA-2beta overexpression inhibits glucose-stimulated insulin secretion in insulinoma cells. The general
      term is as precise as the cross-family evidence allows.
    supported_by:
    - reference_id: PMID:21732083
      supporting_text: Islets from single and DKO mice all showed a significant decrease in insulin content, insulin secretion and the number and half-life of DCV
    - reference_id: PMID:16418280
      supporting_text: Administration of ghrelin or overexpression of IA-2beta, but not overexpression of IA-2, inhibited glucose-stimulated insulin secretion in MIN6 insulinoma cells
