id: A0A9L0RAE3
gene_symbol: PTPRN2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9796
  label: Equus caballus
description: PTPRN2 (IA-2beta, phogrin) is a single-pass type I transmembrane protein of the IA-2 family
  of receptor-like protein-tyrosine phosphatases. A0A9L0RAE3 is the canonical horse product of the gene
  and belongs to the same PANTHER subfamily (PTHR46106:SF5) as human, mouse and rat PTPRN2. It has a
  signal peptide, a luminal IA-2/RESP18 ectodomain with a conserved dibasic processing site, a single
  transmembrane helix and a cytoplasmic PTP-like domain that is 96% identical to the human domain. The
  catalytic cysteine, P-loop, WPD-loop aspartate and Q-loop glutamine are retained, as are the
  tyrosine-based internalization motif and C-terminal leucine-based sorting signal that, in rodents,
  direct the protein to neuroendocrine dense-core secretory granules and recycle it after exocytosis.
  No horse PTPRN2 has been studied experimentally. By orthology to the characterised rodent and human
  proteins, horse PTPRN2 is expected to be a dense-core granule and synaptic vesicle membrane protein
  that maintains secretory vesicle number and supports glucose-stimulated insulin secretion, and to act
  as a phosphatidylinositol phosphate phosphatase (PI(3)P, PI(4,5)P2) rather than as a protein-tyrosine
  phosphatase.
existing_annotations:
- term:
    id: GO:0004725
    label: protein tyrosine phosphatase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - InterPro:IPR000242
  - EC:3.1.3.48
  - UniRule:UR000414439
  review:
    summary: Domain- and rule-based electronic assignment of protein tyrosine phosphatase activity to the
      PTP-like domain.
    action: REMOVE
    reason: The horse PTP-like domain is 96% identical to human PTPRN2 and retains exactly the residues
      of the characterised SF5 orthologs, including their departures from active PTPs. Direct biochemistry
      on rat phogrin (same subfamily) found no significant enzymatic activity on phosphoprotein substrates,
      the mouse knockout study describes IA-2beta as enzymatically inactive, and human PTPRN2 is reported
      inactive against phosphoproteins. The measurable catalytic-cysteine-dependent activity of the subfamily
      is on phosphoinositides. The InterPro/EC mapping is therefore a demonstrably wrong transfer for this
      subfamily, and there is no horse evidence that could restore it.
    supported_by:
    - reference_id: PMID:26620550
      supporting_text: PTPRN2 belongs to the protein tyrosine phosphatase family, but does not exhibit
        activity against phosphoprotein substrates due to several critical amino acid variations in the
        PTP domain (Magistrelli et al, 1996).
    - reference_id: PMID:20097759
      supporting_text: By sequence, phogrin is a member of the family of receptor-like protein-tyrosine
        phosphatases, but it contains substitutions in conserved catalytic sequences, and no significant
        enzymatic activity for phogrin has ever been reported.
    - reference_id: PMID:15220191
      supporting_text: enzymatically inactive member of the transmembrane protein tyrosine phosphatase
        family
