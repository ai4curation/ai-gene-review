- term:
    id: GO:0016787
    label: hydrolase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: enables
  supporting_entities:
  - UniRule:UR000414439
  review:
    summary: UniRule-based assignment of generic hydrolase activity.
    action: MODIFY
    reason: Hydrolase activity is true but uninformative. The catalytic activity characterised in the
      subfamily is dephosphorylation of phosphoinositides by the PTP-like domain, which depends on the
      catalytic cysteine; that cysteine (horse Cys984), the P-loop and the substrate-binding residues are
      conserved in horse. The specific term is phosphatidylinositol phosphate phosphatase activity, a hydrolase
      descendant. For horse this remains an inference from the rat SF5 ortholog.
    proposed_replacement_terms:
    - id: GO:0052866
      label: phosphatidylinositol phosphate phosphatase activity
    supported_by:
    - reference_id: PMID:20097759
      supporting_text: phogrin is able to dephosphorylate specific inositol phospholipids, including phosphatidylinositol (PI) 3-phosphate and PI 4,5-diphosphate but not PI 3,4,5-trisphosphate.
    - reference_id: PMID:20097759
      supporting_text: The PIPase activity of phogrin depended on the catalytic site cysteine and correlated
        with effects on glucose-stimulated insulin secretion.
