suggested_questions:
- question: Is the 39-residue longer luminal region of the horse canonical model (60.8% identity to human
    over residues 22-615, against 96% in the PTP-like domain) a real horse-specific exon or a gene-model
    artifact, and does it affect proprotein processing to the mature IA-2beta60 form?
- question: Does horse PTPRN2, like rat phogrin, dephosphorylate PI(3)P and PI(4,5)P2, and which phosphate
    does it remove from PI(4,5)P2?
suggested_experiments:
- description: Express horse PTPRN2 and a Cys984Ser mutant, purify the transmembrane form and assay it
    against PI(3)P, PI(4,5)P2 and phosphotyrosine peptides at neutral pH to test whether the subfamily
    lipid phosphatase activity and lack of protein phosphatase activity hold in horse.
