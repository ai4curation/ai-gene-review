id: A0A3Q2HE51
gene_symbol: PIKFYVE
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9796
  label: Equus caballus
description: PIKFYVE is the phosphoinositide 5-kinase that converts phosphatidylinositol 3-phosphate (PtdIns3P)
  to phosphatidylinositol 3,5-bisphosphate (PtdIns(3,5)P2) and phosphatidylinositol to phosphatidylinositol 5-phosphate
  on endosomal membranes. This horse entry is a full-length 2108-residue product, a member of the single PIKfyve
  subfamily of PANTHER family PTHR46715, with an N-terminal PtdIns3P-binding FYVE zinc finger that recruits it to
  early and late endosomes, a DEP domain, a chaperonin-like region and a C-terminal PIPK catalytic domain. In mammals
  PIKFYVE works in a complex with the scaffold VAC14 and the PtdIns(3,5)P2 phosphatase FIG4, so that synthesis and
  turnover of the lipid are coupled; it also has a serine protein kinase activity, and autophosphorylation represses
  its lipid kinase activity. Through PtdIns(3,5)P2 it controls endolysosome maturation and lysosome homeostasis,
  endosome-to-TGN retrieval, phagosome-lysosome fusion, and cell-type-specific processes such as melanosome biogenesis,
  neutrophil chemotaxis and ROS production, MHC class II antigen presentation and STING activation. Horse PIKFYVE
  has not been studied experimentally; these functions are inferred from human and mouse PIKFYVE, with which it
  shares about 92-93% identity and all checked catalytic and FYVE zinc-ligand residues.
