suggested_questions:
- question: Is the PtdIns 5-kinase activity of PIKFYVE direct on PtdIns in cells, or is the cellular PtdIns5P pool
    largely produced by 3-dephosphorylation of PIKFYVE-made PtdIns(3,5)P2 by myotubularins?
- question: Should the cell-type-specific processes propagated by PAINT (neutrophil chemotaxis, regulation of ROS
    biosynthesis, melanosome organization) remain at the mammalian PIKfyve node, given that they rest on inhibitor
    or conditional-knockout necessity evidence?
suggested_experiments:
- description: Express horse PIKFYVE and the K1887E mutant with VAC14 and FIG4 and measure PtdIns3P and PtdIns 5-kinase
    activity in vitro; test rescue of vacuolation in PIKFYVE-knockout equine cells.
