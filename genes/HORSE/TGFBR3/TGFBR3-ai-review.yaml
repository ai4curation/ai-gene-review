suggested_questions:
- question: >-
    The Ensembl model ENSECAT00000021086.3 behind F7E1V2 lacks a signal peptide, and its
    first ~41 residues do not align with the first 80 residues of human TGFBR3. Do horse
    RNA-seq or long-read transcripts support a different first exon that encodes the
    canonical signal peptide and N-terminal orphan-domain segment?
- question: >-
    PAINT propagated GO:0005024 (generic TGF-beta receptor activity) at PTN002678643 rather
    than the type III child GO:0070123, which rat and human TGFBR3 carry by IDA. Should the
    IBD be refined to GO:0070123?
suggested_experiments:
- description: >-
    Clone the horse TGFBR3 transcript by 5' RACE from heart or liver to define the true
    N-terminus. Then express it in L6 myoblasts, which lack endogenous TbetaRIII, and test
    TGF-beta2 affinity cross-linking to TbetaRII and TGF-beta2-induced Smad2
    phosphorylation.
