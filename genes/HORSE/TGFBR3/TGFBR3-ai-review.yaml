id: F7E1V2
gene_symbol: TGFBR3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9796
  label: Equus caballus
description: >-
  TGFBR3 (betaglycan, the TGF-beta type III receptor) is a single-pass type I membrane
  proteoglycan. Its large ectodomain contains an N-terminal endoglin-related (orphan)
  ligand-binding region and a C-terminal zona pellucida (ZP) domain that carries heparan
  sulfate and chondroitin sulfate chains. Its short cytoplasmic tail ends in a PDZ-binding
  motif. It has no kinase domain. It acts as a coreceptor for TGF-beta superfamily ligands:
  it binds TGF-beta isoforms, binding TGF-beta2 with especially high affinity, and presents
  them to the type II TGF-beta receptor (TGFBR2), which is required for efficient TGF-beta2
  signaling. It also binds inhibin, acting as an inhibin coreceptor with ActRII that
  antagonises activin signaling, and binds BMPs, enhancing their binding to BMP type I
  receptors. After TGFBR2 phosphorylates its cytoplasmic tail, beta-arrestin2 binds and
  drives internalisation, which downregulates signaling. The same interaction regulates
  Cdc42 and epithelial cell migration independently of TGF-beta. The ectodomain can be shed;
  the soluble form sequesters ligand and inhibits signaling. In mammalian and avian embryos,
  TGFBR3 is needed for TGF-beta2- and BMP-driven endocardial epithelial-mesenchymal
  transformation in the heart and for normal heart and liver development. These functions
  are inferred for horse from the rat, mouse, human and chicken orthologs in the same
  PANTHER subfamily (PTHR14002:SF7). The horse entry F7E1V2 (809 aa) conserves the ZP
  domain, the glycosaminoglycan attachment serines, the transmembrane helix, the
  phosphorylated threonine and the C-terminal tail. Its predicted N-terminus lacks a signal
  peptide and does not align with the first 80 residues of human TGFBR3, which suggests an
  error in the gene model.
