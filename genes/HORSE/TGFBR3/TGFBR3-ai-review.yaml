- term:
    id: GO:0016477
    label: cell migration
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN002678643
  - UniProtKB:Q90998
  review:
    summary: >-
      This row was propagated from PTN002678643, with chicken TGFBR3 as the only donor. In
      chick cushion explants, TBRIII antisera inhibit mesenchyme formation and migration. In
      human epithelial and cancer cells, TbetaRIII activates Cdc42 through beta-arrestin2 and
      inhibits random migration.
    action: MODIFY
    reason: >-
      TGFBR3 is not part of the cell-motility machinery. It modulates migration, through
      signaling in cushion mesenchyme and through beta-arrestin2/Cdc42 in epithelial cells,
      and the direction of the effect depends on context. The function is inherited at the
      node, so the claim is kept but reframed as regulation of cell migration rather than
      participation.
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - ROLE_CONFLATION
      source_entities:
      - source_id: PANTHER:PTN002678643
        source_label: PTN002678643
        source_status: SUPPORTS_TRANSFER
        comment: Horse is inside the clade. The donor evidence (chick cushion explants) shows that TGFBR3
          modulates migration; it does not show TGFBR3 acting as motility machinery.
    proposed_replacement_terms:
    - id: GO:0030334
      label: regulation of cell migration
    supported_by:
    - reference_id: PMID:19416857
      supporting_text: TbetaRIII through its
        interaction with the scaffolding protein beta-arrestin2, activates Cdc42 and
        inhibits migration.
    - reference_id: PMID:10092230
      supporting_text: TBRIII-specific antisera were found to inhibit mesenchyme formation and
        migration in atrioventricular cushion explants
