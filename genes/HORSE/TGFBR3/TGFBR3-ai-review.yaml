  original_reference_id: PMID:18184661
  review:
    summary: >-
      Proposed. TbetaRIII acts as a cell-surface BMP receptor: it enhances ligand binding to
      BMP type I receptors, and silencing it attenuates BMP-induced Smad1 phosphorylation.
    action: NEW
    reason: >-
      As a ligand-presenting coreceptor, TGFBR3 does part of the receptor step of the BMP
