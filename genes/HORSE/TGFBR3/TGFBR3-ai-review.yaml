- term:
    id: GO:0001837
    label: epithelial to mesenchymal transition
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN002678643
  - UniProtKB:Q03167
  - UniProtKB:Q90998
  review:
    summary: >-
      This row was propagated from the Euteleostomi TGFBR3 node PTN002678643, with human
      TGFBR3 (IDA, PMID:18184661) and chicken TGFBR3 (Q90998) as donors. In chick
      atrioventricular cushion explants, TBRIII-specific antisera inhibit endocardial
      transformation, and misexpressing TBRIII lets non-transforming endothelium transform in
      response to TGF-beta2. BMP-2 also stimulates TbetaRIII-mediated epithelial to
      mesenchymal transformation.
    action: KEEP_AS_NON_CORE
    reason: >-
      TGFBR3 acts in this process as the signaling coreceptor that sets off and localises
      endocardial EMT, as shown by cell-autonomous gain- and loss-of-function in explants;
      the support is not just an organismal phenotype. Horse sits inside the clade that
      inherited the function. The process is real but is a context-specific outcome of the
      core coreceptor activity, so it is kept as non-core.
    supported_by:
    - reference_id: PMID:10092230
      supporting_text: Misexpression of TBRIII in nontransforming
        ventricular endothelial cells conferred transformation in response to TGF-beta2.
    - reference_id: PMID:18184661
      supporting_text: BMP-2 specifically stimulates
        TbetaRIII-mediated epithelial to mesenchymal cell transformation.
