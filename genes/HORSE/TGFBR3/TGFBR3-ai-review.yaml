- term:
    id: GO:0005539
    label: glycosaminoglycan binding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - MGI:MGI:104637
  - PANTHER:PTN002678643
  - RGD:61821
  - UniProtKB:Q90998
  review:
    summary: >-
      This row was propagated from PTN002678643, with mouse (IDA, PMID:12773577), rat and
      chicken TGFBR3 as donors. Betaglycan is itself a proteoglycan: its core protein carries
      heparan and chondroitin sulfate chains at two conserved serines (rat Ser535/Ser546,
      horse S494/S505). The cached abstracts do not show binding of the core protein to free
      GAGs.
    action: KEEP_AS_NON_CORE
    reason: >-
      Rodent curators assert this term experimentally, and I cannot see their full texts, so
      I defer to them rather than remove it. However, GAG binding is not part of the
      ligand-presentation mechanism: the GAG chains are dispensable for TGF-beta binding. The
      protein's defining GAG-related feature is that it carries GAG chains, not that it binds
      GAGs. So the term is kept as non-core.
    supported_by:
    - reference_id: PMID:8106553
      supporting_text: Their mutation to alanine prevents GAG
        attachment but does not interfere with betaglycan stability or ability to bind
        and present TGF-beta to receptor II.
    - reference_id: file:HORSE/TGFBR3/TGFBR3-bioinformatics/RESULTS.md
      supporting_text: GAG attachment serines human S534/S545 map to horse S494/S505.
