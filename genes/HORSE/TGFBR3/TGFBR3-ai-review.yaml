- term:
    id: GO:0036122
    label: BMP binding
  evidence_type: ISS
  original_reference_id: PMID:18184661
  review:
    summary: >-
      Proposed. Human TbetaRIII binds BMP-2, BMP-4, BMP-7 and GDF-5 directly, through the
      same ligand-binding domains it uses for TGF-beta. Horse is in the same PANTHER
      subfamily (SF7), and the ectodomain is conserved apart from the mis-modelled
      N-terminus.
