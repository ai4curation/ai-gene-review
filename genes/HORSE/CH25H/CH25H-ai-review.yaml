id: F6T000
gene_symbol: CH25H
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9796
  label: Equus caballus
description: >-
  CH25H encodes cholesterol 25-hydroxylase, a polytopic integral membrane enzyme of the
  endoplasmic reticulum that hydroxylates the cholesterol side chain at carbon 25 to form the
  oxysterol 25-hydroxycholesterol (25-HC). It is not a cytochrome P450 but a member of the
  sterol desaturase / fatty acid hydroxylase family of non-heme diiron oxygenases, whose iron
  centre is held by three conserved histidine boxes; all of these histidines are retained in
  the horse protein (270 aa, 83% identical to human CH25H over its full length). In mammals
  25-HC acts as a regulatory oxysterol: it blocks SREBP processing and so represses cholesterol
  synthesis, and it is the precursor of 7-alpha,25-dihydroxycholesterol, the GPR183/EBI2 ligand
  that positions B and T cells in lymphoid tissue. CH25H is an interferon-inducible gene, and
  25-HC restricts enveloped viruses by depleting accessible plasma-membrane cholesterol and
  blocking virus-cell membrane fusion. The horse functions are inferred from the human and
  rodent orthologs; no equine-specific experimental study was found.
