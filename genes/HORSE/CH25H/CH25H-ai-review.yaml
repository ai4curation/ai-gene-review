- term:
    id: GO:1903914
    label: negative regulation of fusion of virus membrane with host plasma membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:O95992
  - ensembl:ENSP00000360918
  review:
    summary: >-
      Human CH25H and 25-HC block SARS-CoV-2 and other coronavirus spike-mediated fusion at the
      plasma membrane by depleting accessible cholesterol via ACAT; projected from human.
    action: KEEP_AS_NON_CORE
    reason: >-
      Well supported for the human ortholog, including a catalytically dead CH25H control,
      so the antiviral effect depends on 25-HC production. It is a downstream consequence of the
      core enzymatic activity, and no equine virus study was found, so it is kept as non-core.
    supported_by:
    - reference_id: PMID:32944968
      supporting_text: >-
        These results strongly support a function for 25HC in blocking human coronavirus
        spike‐mediated fusion with the plasma membrane, thereby suppressing virus entry.
    - reference_id: PMID:33239446
      supporting_text: >-
        Collectively, our data support a model that 25HC suppresses SARS-CoV-2 S protein-mediated
        fusion, which inhibits virus replication, possibly by altering cholesterol levels.
