suggested_questions:
- question: >-
    Is horse CH25H induced by type I interferon in equine macrophages, and does it restrict
    enveloped equine viruses (e.g. equine arteritis virus, equine herpesvirus 1) as the human
    enzyme restricts coronaviruses?
suggested_experiments:
- description: >-
    Express horse CH25H (wild type and a histidine-box-3 HH->QQ mutant) in HEK293 cells and
    measure 25-hydroxycholesterol by LC-MS/MS, to confirm the inferred activity directly.
  experiment_type: enzyme activity assay
