- term:
    id: GO:0000254
    label: C-4 methylsterol oxidase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - AGI_LocusCode:AT1G07420
  - AGI_LocusCode:AT2G29390
  - AGI_LocusCode:AT4G12110
  - AGI_LocusCode:AT4G22756
  - CGD:CAL0000198201
  - MGI:MGI:1913484
  - PANTHER:PTN000221246
  - SGD:S000003292
  - UniProtKB:Q15800
  review:
    summary: >-
      Family-root IBA (PTN000221246, Eukaryota) seeded by the C-4 methylsterol oxidases
      MSMO1/ERG25 and plant SMO1 paralogs. CH25H is a side-chain C-25 hydroxylase of cholesterol;
      no member of the CH25H clade has been shown to oxidise 4-methylsterols.
    action: REMOVE
    reason: >-
      The IBD sits at the root of the heterogeneous sterol desaturase family (PTHR11863), whose
      branches catalyse different reactions (C-4 methyl oxidation, C-5 desaturation,
      sphingolipid C-4 hydroxylation, C-25 hydroxylation). Every donor is a methylsterol oxidase
      (human MSMO1 Q15800, mouse Msmo1, yeast ERG25, Arabidopsis SMO1 paralogs); the CH25H
      subfamily (PANTHER SF213, with its own PAINT node PTN002627316 for cholesterol
      25-hydroxylase activity) is a divergent branch whose characterised members hydroxylate
      cholesterol at C-25 instead. The PTHR11863 family review likewise concludes that C-4
      methylsterol oxidase activity is not a family-wide grant and is not supported for CH25H.
      Horse CH25H is therefore inside the descendant set only because of the node placement, and
      there is substrate-specific evidence against the function in its clade. The human ortholog
      review marks the same row over-annotated; here REMOVE is used because the claim is a
      specific reaction the enzyme is not known to perform, not a broad true term.
    supported_by:
    - reference_id: PMID:9852097
      supporting_text: >-
        Unlike most other sterol hydroxylases, cholesterol 25-hydroxylase is not a cytochrome
        P450, but rather it is a member of a small family of enzymes that utilize diiron
        cofactors to catalyze the hydroxylation of hydrophobic substrates.
    - reference_id: file:human/CH25H/CH25H-uniprot.txt
      record_section: ["CC:CATALYTIC ACTIVITY"]
      supporting_text: Reaction=cholesterol + AH2 + O2 = 25-hydroxycholesterol + A + H2O;
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: PANTHER:PTN000221246
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          Eukaryote-wide family node; the methylsterol oxidase activity is right for the
          MSMO1/ERG25/SMO1 branches but CH25H diverged to cholesterol C-25 hydroxylation.
- term:
    id: GO:0001567
    label: cholesterol 25-hydroxylase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - MGI:MGI:1333869
  - PANTHER:PTN002627316
  - UniProtKB:O95992
  review:
    summary: >-
      Core activity. The IBD node PTN002627316 (Euteleostomi) is the CH25H-clade node, seeded by
      experimentally characterised human CH25H and mouse Ch25h; horse CH25H is a one-to-one
      eutherian ortholog in this clade and keeps all three diiron histidine boxes.
    action: ACCEPT
    reason: >-
      Human and mouse CH25H were cloned and shown to synthesise 25-hydroxycholesterol, with the
      histidine clusters required for activity (PMID:9852097); human CH25H activity was
      reconfirmed by mass spectrometry with a His242/His243 mutant control (PMID:33239446). The
      PAINT node is the specific CH25H subfamily node, not the heterogeneous family root, so the
      placement is sound. The horse protein aligns over 100% of its length with human CH25H
      and conserves every histidine of boxes 1-3
      (file:HORSE/CH25H/CH25H-bioinformatics/RESULTS-rereview.md).
    supported_by:
    - reference_id: PMID:9852097
      supporting_text: >-
        The encoded enzymes are polytopic membrane proteins of 298 and 272 amino acids,
        respectively, which contain clusters of histidine residues that are essential for
        catalytic activity.
    - reference_id: PMID:33239446
      supporting_text: >-
        Cholesterol 25-hydroxylase (CH25H) is an interferon (IFN)-stimulated gene that shows
        broad antiviral activities against a wide range of enveloped viruses.
    - reference_id: file:HORSE/CH25H/CH25H-bioinformatics/RESULTS-rereview.md
      supporting_text: 'Histidine box-3: human 238-244 HHDLHHS -> horse 238-244 HHDLHHS; all histidines
        conserved: True'
