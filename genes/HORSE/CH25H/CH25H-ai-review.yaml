- term:
    id: GO:0008610
    label: lipid biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR050307
  review:
    summary: >-
      CH25H synthesises the oxysterol 25-HC, a lipid, so the broad term is literally true. GO has
      no oxysterol/25-hydroxycholesterol biosynthetic process term, so nothing more specific can
      replace it.
    action: KEEP_AS_NON_CORE
    reason: >-
      The InterPro2GO mapping is broad and was written for the whole sterol desaturase family.
      For CH25H it holds as the formation of 25-HC, but the informative description of the
      process is cholesterol metabolic process plus the specific MF; using sterol biosynthetic
      process instead would wrongly suggest the cholesterol synthesis pathway, which CH25H
      represses rather than performs.
    supported_by:
    - reference_id: PMID:9852097
      supporting_text: >-
        Among the most potent of regulatory oxysterols is 25-hydroxycholesterol, whose
        biosynthetic enzyme has not yet been isolated.
