core_functions:
- description: CH25H is a membrane-associated cholesterol 25-hydroxylase that produces the regulatory
    oxysterol 25-hydroxycholesterol. It belongs to a histidine-rich diiron enzyme family. Its product
    regulates sterol homeostasis and contributes to mammalian immune-cell positioning and defense against
    enveloped viruses.
