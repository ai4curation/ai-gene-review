- term:
    id: GO:0036197
    label: zymosterol biosynthetic process
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:1913484
  - PANTHER:PTN002275159
  review:
    summary: >-
      IBA from the Eumetazoa node PTN002275159 seeded only by mouse Msmo1, a C-4 methylsterol
      oxidase of post-squalene cholesterol synthesis. CH25H does not act on zymosterol or its
      4-methylsterol precursors and is not a cholesterol-synthesis enzyme.
    action: REMOVE
    reason: >-
      Zymosterol formation requires C-4 demethylation of lanosterol-derived methylsterols, the
      MSMO1 reaction. CH25H hydroxylates finished cholesterol and its product represses, rather
      than contributes to, sterol synthesis via SREBP. This is the same functional divergence as
      the C-4 methylsterol oxidase row; the IBA reaches CH25H only through node placement.
    supported_by:
    - reference_id: PMID:9852097
      supporting_text: >-
        Expression of cholesterol 25-hydroxylase in transfected cells reduces the biosynthesis of
        cholesterol from acetate and suppresses the cleavage of sterol regulatory element binding
        protein-1 and -2.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: PANTHER:PTN002275159
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          Node seeded by mouse Msmo1 (methylsterol oxidase); correct for MSMO1 but CH25H diverged
          to cholesterol side-chain hydroxylation.
