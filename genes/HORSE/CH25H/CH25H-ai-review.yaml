id: F6T000
gene_symbol: CH25H
product_type: PROTEIN
status: IN_PROGRESS
taxon:
  id: NCBITaxon:9796
  label: Equus caballus
description: CH25H is a membrane-associated cholesterol 25-hydroxylase that produces the regulatory oxysterol
  25-hydroxycholesterol. It belongs to a histidine-rich diiron enzyme family. Its product regulates sterol
  homeostasis and contributes to mammalian immune-cell positioning and defense against enveloped viruses.
existing_annotations:
- term:
    id: GO:0000254
    label: C-4 methylsterol oxidase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - AGI_LocusCode:AT1G07420
  - AGI_LocusCode:AT2G29390
  - AGI_LocusCode:AT4G12110
  - AGI_LocusCode:AT4G22756
  - CGD:CAL0000198201
  - MGI:MGI:1913484
  - PANTHER:PTN000221246
  - SGD:S000003292
  - UniProtKB:Q15800
  review:
    summary: The characterized CH25H reaction is cholesterol C25 hydroxylation, not removal of the C4
      methyl groups during sterol biosynthesis. Shared sterol-enzyme ancestry does not support this substrate-specific
      reaction.
    action: REMOVE
    reason: The characterized CH25H reaction is cholesterol C25 hydroxylation, not removal of the C4 methyl
      groups during sterol biosynthesis. Shared sterol-enzyme ancestry does not support this substrate-specific
      reaction. This assessment transfers characterized mammalian biology to the selected horse sequence
      with the sequence limitations stated in the comparison.
    supported_by:
    - &id001
      reference_id: file:human/CH25H/CH25H-uniprot.txt
      supporting_text: 'CC   -!- FUNCTION: Catalyzes the formation of 25-hydroxycholesterol from

        CC       cholesterol, leading to repress cholesterol biosynthetic enzymes

        CC       (PubMed:9852097). Plays a key role in cell positioning and movement in

        CC       lymphoid tissues: 25-hydroxycholesterol is an intermediate in

        CC       biosynthesis of 7-alpha,25-dihydroxycholesterol (7-alpha,25-OHC), an

        CC       oxysterol that acts as a ligand for the G protein-coupled receptor

        CC       GPR183/EBI2, a chemotactic receptor for a number of lymphoid cells (By

        CC       similarity). May play an important role in regulating lipid metabolism

        CC       by synthesizing a corepressor that blocks sterol regulatory element

        CC       binding protein (SREBP) processing (PubMed:9852097). As an interferon-

        CC       stimulated gene, has broad antiviral activities against a wide range of

        CC       enveloped viruses, such as vesicular stomatitis virus (VSV) and SARS

        CC       coronavirus-2 (SARS-CoV-2). Its product, 25-hydroxycholesterol,

        CC       activates the ER-localized enzyme ACAT to induce internalization of

        CC       accessible cholesterol on the plasma membrane and restricts SARS-CoV-2

        CC       S protein-mediated fusion which inhibits virus replication

        CC       (PubMed:32944968, PubMed:33239446). In testis, production of 25-

        CC       hydroxycholesterol by macrophages plays a role in Leydig cell

        CC       differentiation (By similarity). Required to restrain inflammation in

        CC       macrophages: production of 25-hydroxycholesterol protects macrophages

        CC       from cholesterol overload, thereby preventing mitochondrial DNA release

        CC       and subsequent activation of the AIM2 inflammasome (By similarity).

        CC       {ECO:0000250|UniProtKB:Q4QQV7, ECO:0000250|UniProtKB:Q9Z0F5,

        CC       ECO:0000269|PubMed:32944968, ECO:0000269|PubMed:33239446,

        CC       ECO:0000269|PubMed:9852097}.'
    - &id002
      reference_id: file:HORSE/CH25H/CH25H-bioinformatics/RESULTS.md
      supporting_text: The horse sequence F6T000 (270 residues) aligns to human O95992 (272 residues)
        with 83.33% identity across 270 paired residues. Paired coverage is 99.26% of the human sequence
        and 100.0% of the horse sequence.
    - &id003
      reference_id: PMID:9852097
      supporting_text: "Here, we report the cloning of cholesterol \n25-hydroxylase cDNAs from the mouse\
        \ and human. The encoded enzymes are polytopic \nmembrane proteins of 298 and 272 amino acids,\
        \ respectively, which contain \nclusters of histidine residues that are essential for catalytic\
        \ activity. Unlike \nmost other sterol hydroxylases, cholesterol 25-hydroxylase is not a cytochrome\
        \ \nP450, but rather it is a member of a small family of enzymes that utilize diiron \ncofactors\
        \ to catalyze the hydroxylation of hydrophobic substrates. The \ncholesterol 25-hydroxylase gene\
        \ lacks introns, and in the human it is located on \nchromosome 10q23. The murine gene is expressed\
        \ at low levels in multiple \ntissues. Expression of cholesterol 25-hydroxylase in transfected\
        \ cells reduces \nthe biosynthesis of cholesterol from acetate and suppresses the cleavage of\
        \ \nsterol regulatory element binding protein-1 and -2. The data suggest that \ncholesterol 25-hydroxylase\
        \ has the capacity to play an important role in \nregulating lipid metabolism by synthesizing\
        \ a co-repressor that blocks sterol \nregulatory element binding protein processing and ultimately\
        \ leads to inhibition \nof gene transcription."
