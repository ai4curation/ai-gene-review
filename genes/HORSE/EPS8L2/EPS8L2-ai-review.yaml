suggested_questions:
- question: Is the 91-residue N-terminal extension of the horse Ensembl model F7BFV0 supported
    by horse transcript evidence, or should translation start at Met92 (which aligns to Met1 of
    human and mouse EPS8L2)?
- question: Does EPS8L2 itself regulate actin filament length at stereocilia tips (for example,
    barbed-end capping as for EPS8), and would stereocilium maintenance (GO:0120045) then be an
    appropriate process term? MGI curators annotated the mouse knockout to sensory perception of
    sound rather than to stereocilium maintenance, and EPS8 does not carry GO:0120045.
suggested_experiments:
- description: Test purified EPS8L2 C-terminal effector region for barbed-end capping and
    bundling activity in pyrene-actin and TIRF assays, alongside EPS8, to determine which actin
    activity underlies its stereocilia-maintenance role.
