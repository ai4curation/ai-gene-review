- id: PMID:14565974
  title: The eps8 family of proteins links growth factor stimulation to actin reorganization
    generating functional redundancy in the Ras/Rac pathway.
  findings:
  - statement: Human EPS8L2 binds F-actin directly, associates with ABI1 and SOS1, forms
      complexes with Rac-GEF activity, localizes to PDGF-induced ruffles and restores RTK-induced
      ruffling in Eps8-null fibroblasts.
    supporting_text: Eps8L1 and eps8L2, similarly to eps8, mediate RTK-dependent actin remodeling,
      most likely by entering into a RacGEF complex with Abi1 and Sos-1
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached; source of the human EPS8L2 IDA/IGI annotations behind the IBA
      and Ensembl transfers. Experiments used human EPS8L2 expressed in mouse fibroblasts.
- id: PMID:23918390
  title: Progressive hearing loss and gradual deterioration of sensory hair bundles in the
    ears of mice lacking the actin-binding protein Eps8L2.
  findings:
  - statement: Mouse Eps8L2 localizes to stereocilia tips and is required for long-term
      maintenance of the hair-bundle staircase and hearing.
    supporting_text: We conclude that Eps8L2 is required for the long-term maintenance of the
      staircase structure and mechanosensory function of auditory hair bundles.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached; source of the mouse IDA annotations (stereocilium tip,
      stereocilium bundle, sensory perception of sound) transferred to horse.
- id: PMID:26282398
  title: EPS8L2 is a new causal gene for childhood onset autosomal recessive progressive
    hearing loss.
  findings:
  - statement: A homozygous EPS8L2 frameshift segregates with childhood-onset progressive
      hearing loss in a consanguineous family.
    supporting_text: located in exon 12 of the EPS8L2 gene, was predicted to cause a frame shift
      leading to premature termination of translation
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Human genetic evidence (one family) concordant with the mouse knockout.
