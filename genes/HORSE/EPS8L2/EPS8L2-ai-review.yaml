  review:
    summary: Direct F-actin binding by the conserved C-terminal effector region is the
      defining biochemical activity of EPS8, EPS8L1 and EPS8L2; inherited at the PAINT node.
    action: ACCEPT
    reason: PAINT placed actin binding at node PTN000958212, seeded by mouse Eps8, human EPS8L1
      and human EPS8L2, each with direct evidence. In the founding study the purified C-terminal
      fragments of EPS8, EPS8L1 and EPS8L2 cosedimented with F-actin, whereas EPS8L3 did not.
      Horse F7BFV0 falls in the EPS8L2 subfamily (PTHR12287:SF20) and is about 87% identical
      to human EPS8L2 over the full length, so it is inside the clade that inherits the function.
      F-actin binding underlies both its ruffle and stereocilium-tip localization. A more specific
      child (actin filament binding) exists, but the parental term is a valid inherited assertion
      and the PAINT curators placed it at this level.
