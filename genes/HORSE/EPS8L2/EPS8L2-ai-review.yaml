id: F7BFV0
gene_symbol: EPS8L2
product_type: PROTEIN
status: IN_PROGRESS
taxon:
  id: NCBITaxon:9796
  label: Equus caballus
description: >-
  EPS8L2 (epidermal growth factor receptor pathway substrate 8-like 2) is a member of
  the EPS8 family of actin-binding signalling adaptors, with an N-terminal
  phosphotyrosine-binding (PTB)-like domain, a central SH3 domain and a C-terminal
  effector region that binds F-actin. In mammals it is the paralog most similar to EPS8:
  it associates with ABI1 and SOS1 to form a complex with Rac guanine-nucleotide exchange
  activity, localizes to growth-factor-induced, F-actin-rich membrane ruffles, and can
  substitute for EPS8 in receptor tyrosine kinase-driven ruffling. In the inner ear it
  sits at the tips of hair-cell stereocilia, most strongly in the shorter rows, and is
  required for the long-term maintenance of the stereocilia staircase and of hearing;
  loss of function causes progressive hearing loss in mice and humans. The horse gene
  product F7BFV0 is the one-to-one ortholog of human and mouse EPS8L2 (PANTHER
  PTHR12287:SF20, about 87% identity); its Ensembl gene model carries a 91-residue
  N-terminal extension, and its methionine 92 corresponds to the start of the human
  protein. Functions are inferred from the mouse and human orthologs; nothing has been
  measured on the horse protein.
