  review:
    summary: Plasma-membrane location of the DUOX1-DUOXA1 oxidase. Human DUOX1 sits in the plasma membrane,
      and PAINT places plasma membrane at an ancestral NOX/DUOX node (PTN001735877) seeded by human DUOX1.
      The horse product keeps the signal peptide and all seven transmembrane helices.
    action: ACCEPT
    reason: Membrane topology is fully conserved in this product (TM helices 1-7 all present, plus the
      SignalP signal peptide). The human DUOX1 structure places the oxidase in the plasma membrane. DUOXA1
      is needed for maturation and surface delivery. The 99-residue deletion lies in the cytosolic loop
      between TM1 and TM2, and nothing shows it affects trafficking, but surface delivery of this particular
      splice product has not been tested. The location is accepted as the gene-level location of horse
      DUOX1.
