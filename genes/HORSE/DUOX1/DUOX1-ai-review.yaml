      reference_id: PMID:33420071
      supporting_text: 'Dual oxidases (DUOXs) produce hydrogen peroxide by transferring electrons from

        intracellular NADPH to extracellular oxygen. They are involved in many crucial

        biological processes and human diseases, especially in thyroid diseases. DUOXs

        are protein complexes co-assembled from the catalytic DUOX subunits and the

        auxiliary DUOXA subunits and their activities are regulated by intracellular

        calcium concentrations.'
