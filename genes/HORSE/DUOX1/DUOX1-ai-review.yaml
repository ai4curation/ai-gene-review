gene_symbol: DUOX1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9796
  label: Equus caballus
description: Horse DUOX1 encodes dual oxidase 1, a multi-pass plasma-membrane NADPH oxidase of the NOX/DUOX
  family (PANTHER PTHR11972, subfamily SF75 DUAL OXIDASE 1). By orthology to human DUOX1, it pairs with the
  maturation factor DUOXA1 and transfers electrons from cytosolic NADPH, through FAD in the cytosolic dehydrogenase
  domain and two hemes in the transmembrane ferric-reductase domain, to extracellular oxygen, releasing
  hydrogen peroxide. A cytosolic loop carrying two EF-hand calcium-binding motifs couples activity to intracellular
  calcium. The extracellular N-terminal peroxidase-homology domain is a structural module; in mammals the
  isolated domain binds no heme and has no demonstrated intrinsic peroxidase activity. DUOX1-derived peroxide
  supports epithelial host defence and redox signalling, and supplies the oxidant for thyroid peroxidase.
  This UniProt entry (1452 aa) is the product of an alternative Ensembl transcript that lacks the segment
  corresponding to human residues 775-873, which includes the first EF-hand and most of the second.
