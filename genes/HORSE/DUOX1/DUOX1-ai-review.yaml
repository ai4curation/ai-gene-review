- term:
    id: GO:0016491
    label: oxidoreductase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR013112
  - InterPro:IPR013121
  - InterPro:IPR017927
  review:
    summary: Generic oxidoreductase activity from the FAD-binding, NAD-binding and FR-type signatures
      of the dehydrogenase domain. The specific activity of the DUOX1 subfamily is NAD(P)H oxidase H2O2-forming
      activity, and every heme, FAD and NADPH contact residue of human DUOX1 is conserved in this product.
    action: MODIFY
    reason: The general term is correct but uninformative. PAINT asserts NAD(P)H oxidase H2O2-forming
      activity (GO:0016174) at node PTN000944147, with human DUOX1 (Q9NRD9) and DUOX2 among the experimental
      seeds. The horse protein is in the same DUOX1 subfamily (PTHR11972:SF75), not the DUOX2 subfamily
      (SF67). The rereview alignment shows all 13 heme, 8 FAD and 11 NADPH contact residues of human DUOX1
      at the aligned positions. The caveat is regulation, not catalysis. This product lacks EF-hand 1
      and most of EF-hand 2 (6 of 15 human Ca2+ ligands kept, and those are mostly the structural site
      in the peroxidase-homology domain). Mutating these EF-hand sites abolishes calcium activation of
      DUOX, so this product, if made, probably lacks calcium-stimulated activity; its basal activity is
      untested.
    proposed_replacement_terms:
