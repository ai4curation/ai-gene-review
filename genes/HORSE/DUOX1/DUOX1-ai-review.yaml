  review:
    summary: InterPro2GO transfer from the haem-peroxidase superfamily signature, which matches the
      extracellular peroxidase-homology domain. Purified mammalian DUOX1 peroxidase-homology domain binds
      no heme and has no intrinsic peroxidase activity, and the PROSITE rule flags missing conserved
      residues in this very record.
    action: REMOVE
    reason: The IPR010255 hit records fold homology, not catalysis. Human DUOX1 carries a curated NOT
      peroxidase activity (IDA, PMID:19460756) because the purified human domain (residues 1-593) bound
      no heme and had no peroxidase activity. An earlier lysate assay (PMID:11514595) reported activity
      for the expressed human domain, but the purified-protein result is the stronger test and is what
      the human curators recorded. Covalent heme and modest peroxidase activity were shown only for the
      C. elegans domain, a different lineage that has kept the peroxidase active-site residues. The horse
      record's PROSITE PRU00298 rule (a curated UniRule-type system) reports that the conserved residues
      needed to propagate the peroxidase features are missing. The horse protein falls in the same
      mammalian DUOX1 subfamily (PTHR11972:SF75) as human DUOX1, so the human negative result is the
      relevant comparator and the electronic positive call should go.
