core_functions:
- description: Calcium-regulated NADPH oxidase that reduces extracellular oxygen to hydrogen peroxide
    at the plasma membrane, using FAD and two transmembrane hemes, together with the maturation factor
    DUOXA1. Inferred for horse DUOX1 from PAINT node PTN000944147 (human DUOX1/DUOX2 seeds), membership
    of PTHR11972:SF75, and conservation of every heme, FAD and NADPH contact residue. A0A9L0SQG9 is an
    alternative splice product that lacks most of the EF-hand calcium-sensing module, so its calcium regulation,
    and whether it is expressed as a protein at all, are unverified.
  molecular_function:
    id: GO:0016174
    label: NAD(P)H oxidase H2O2-forming activity
  directly_involved_in:
  - id: GO:0050665
    label: hydrogen peroxide biosynthetic process
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
