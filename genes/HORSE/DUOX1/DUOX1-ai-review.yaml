- term:
    id: GO:0006979
    label: response to oxidative stress
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR010255
  review:
    summary: InterPro2GO transfer from the haem-peroxidase superfamily signature, the same peroxidase-homology
      hit behind the removed peroxidase row. DUOX1 produces oxidant; it is not an oxidative-stress response
      component.
    action: MARK_AS_OVER_ANNOTATED
    reason: The IPR010255 mapping to response to oxidative stress assumes the protein is a peroxide-consuming
      peroxidase. Mammalian DUOX1's peroxidase-homology domain lacks that activity. The protein's actual
      role is to generate H2O2 for host defence and signalling, so a stress-response term misdescribes
      it. The term is not removed outright because DUOX-derived peroxide does feed redox signalling in
      epithelia, but nothing shows that horse DUOX1 takes part in a response to oxidative stress. The
      PANTHER family review for PTHR11972 makes the same point about separating oxidant generation from
      oxidant handling.
    supported_by:
    - reference_id: PMID:19460756
      supporting_text: 'the isolated hDUOX1(1-593) does not bind heme and has

        no intrinsic peroxidase activity.'
    - reference_id: PMID:33420071
      supporting_text: 'Dual oxidases (DUOXs) produce hydrogen peroxide by transferring electrons from

        intracellular NADPH to extracellular oxygen.'
