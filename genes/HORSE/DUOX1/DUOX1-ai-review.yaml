    label: heme binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR010255
  review:
    summary: Heme binding is true of DUOX1, but through the transmembrane ferric-reductase domain (two
      bis-histidine hemes), not the peroxidase-homology domain whose signature produced this IEA.
    action: ACCEPT
    reason: The review judges the claim, not the route. Human DUOX1 binds heme in its transmembrane domain
      (curated IDA from the cryo-EM structure), and this horse product keeps all 13 of the human heme
      contact residues. The InterPro source of this row (IPR010255, peroxidase superfamily) points at
      the wrong domain, since the mammalian peroxidase-homology domain binds no heme. Heme binding by
      the oxidase core is still well grounded by orthology within PTHR11972:SF75 and by residue conservation,
      so the annotation stands.
    supported_by:
