description: ProtNLM2 emitted four GO terms for A0A9L0SQG9, an alternative horse DUOX1 splice product
  (PTHR11972:SF75) that lacks human residues 775-873, removing EF-hand 1 and most of EF-hand 2 while keeping
  the peroxidase-homology domain, all transmembrane helices and every heme, FAD and NADPH contact residue.
  Calcium ion binding is correct and not novel, since the canonical horse DUOX1 product F6YEX2 carries
  it, and it has exact-sequence support from the conserved putative calcium site in the peroxidase-homology
  domain. Thyroid hormone generation is true of the gene but uncertain for this product. DUOX1 joins the
  process through H2O2 production, the product keeps the whole catalytic core but lacks the calcium-sensing
  EF-hands that activate it, and calcium-free DUOX1 still shows low basal activity, so the deletion's effect
  on H2O2 output is untested. Hydrogen peroxide
  catabolic process is refuted, because DUOX1 generates H2O2 and its peroxidase-homology domain has no
  peroxidase activity. Hormone biosynthetic process is refuted by GO semantics, because the only hormone
  pathway DUOX1 supports, thyroid hormone generation, is explicitly excluded from biosynthetic processes.
