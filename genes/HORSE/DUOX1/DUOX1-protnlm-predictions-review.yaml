  predicted_term:
    id: GO:0042446
    label: hormone biosynthetic process
  predicted_term_type: GO_BP
  review:
    assessment: NPI
    confidence_score: 0
    summary: DUOX1's only established hormone-related role is supplying the H2O2 that thyroid peroxidase
      uses to iodinate thyroglobulin, which GO captures as thyroid hormone generation (GO:0006590), a term
      the canonical horse DUOX1 product F6YEX2 already carries. GO deliberately places thyroid hormone
      generation outside the biosynthetic-process branch; OLS4 shows GO:0006590 is not a descendant of
      GO:0042446, and its definition comment states that the term does not fall under the general GO
      definition for biosynthetic processes because thyroid hormones are formed by proteolysis of a larger
      molecule. No evidence links DUOX1 to the biosynthesis of any other hormone. The prediction therefore
      places a real thyroid contribution under a GO branch that excludes it, and the term is discordant
      with GO's definition of the process DUOX1 supports.
    supported_by:
    - reference_id: PMID:15062544
      supporting_text: A crucial step in thyroid hormone synthesis is the oxidative coupling of iodide
        to thyroglobulin that is catalyzed by thyroperoxidase. The limiting factor of this reaction is
        the supply of hydrogen peroxide.
    - reference_id: PMID:33420071
      supporting_text: 'Dual oxidases (DUOXs) produce hydrogen peroxide by transferring electrons from

        intracellular NADPH to extracellular oxygen.'
