- source_method: ProtNLM2
  source_version: UniProt API snapshot 2026-09-08
  predicted_term:
    id: GO:0006590
    label: thyroid hormone generation
  predicted_term_type: GO_BP
  review:
    assessment: UNC
    confidence_score: 1
    summary: Thyroid hormone generation is a correct term for the DUOX1 gene, and the canonical horse
      product F6YEX2 already carries it. DUOX1 takes part in the process by generating the H2O2 that thyroid
      peroxidase uses. A0A9L0SQG9 lacks the segment corresponding to human residues 775-873, which removes
      EF-hand 1 and most of EF-hand 2; of the 15 human calcium-ligand positions it keeps 6, and 5 of those
      form the extracellular peroxidase-homology site, not the EF-hands. The catalytic machinery is intact,
      with all heme, FAD and NADPH contact residues retained. The EF-hand module is a calcium-gated activator,
      not the catalytic step itself; point mutations of its calcium-binding residues abolish activity of
      mouse DUOX1-DUOXA1, but human DUOX1-DUOXA1 in low calcium retains low basal H2O2 production, and no
      study has tested a DUOX1 lacking this segment. The participation mechanism is therefore not fully
      accounted for by the missing feature, and there is no positive refutation; the product could retain
      basal or calcium-independent oxidase output, or could be inactive or fail to mature with DUOXA1.
      Whether this exact sequence contributes to thyroid hormone generation is unresolved.
    supported_by:
    - reference_id: PMID:32929281
      supporting_text: DUOX1 contains cytoplasmic EF-hand motifs, and mutations of calcium-binding residues
        abolish enzymatic activities of DUOX1–DUOXA1 complexes
    - reference_id: PMID:33420071
      supporting_text: 'In the presence of calcium ions, intracellular EF-hand modules

        might enhance the catalytic activity of DUOX by stabilizing the dehydrogenase

        domain in a conformation that allows electron transfer.'
