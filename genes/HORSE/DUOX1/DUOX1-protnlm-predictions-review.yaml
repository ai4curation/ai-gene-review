    label: hydrogen peroxide catabolic process
  predicted_term_type: GO_BP
  review:
    assessment: NPI
    confidence_score: 0
    summary: The mammalian DUOX1 catalytic system generates H2O2; the isolated human peroxidase-like domain
      binds no heme and has no intrinsic peroxidase activity. Producing the substrate for a separate peroxidase
      is not evidence that DUOX1 carries out H2O2 catabolism. The selected horse protein retains the homologous
      peroxidase-like region within the same DUOX1 subfamily as human DUOX1, and no independent catabolic
      mechanism is supported. The gene review removes the electronic peroxidase activity and cellular
      oxidant detoxification rows on these grounds. This prediction confuses an oxidant-generating enzyme
      with peroxide-consuming chemistry.
