- source_method: ProtNLM2
  source_version: UniProt API snapshot 2026-09-08
  predicted_term:
    id: GO:0005509
    label: calcium ion binding
  predicted_term_type: GO_MF
  review:
    assessment: CNN
    confidence_score: 2
    summary: Calcium binding is directly observed in human DUOX1, whose EF-hand calcium occupancy switches
      the oxidase on, and horse DUOX1 already carries calcium ion binding on its canonical product F6YEX2,
      so the term is not novel for the gene. This splice product lacks EF-hand 1 and most of EF-hand 2,
      retaining 6 of the 15 human calcium-ligand positions. The retained ligands include the complete
      putative calcium site in the extracellular peroxidase-homology domain (human positions 109, 170, 172,
      174 and 176), which the mouse DUOX1 structure places at the position of the lactoperoxidase calcium
      site, and the peroxidase-like region is fully present. Calcium ion binding is therefore supported for
      this exact sequence as well, by orthology within PTHR11972:SF75; what the deletion probably removes
      is calcium-regulated activation, not all calcium binding.
    supported_by:
    - reference_id: PMID:33420071
      supporting_text: 'In the presence of calcium ions, intracellular EF-hand modules

        might enhance the catalytic activity of DUOX by stabilizing the dehydrogenase

        domain in a conformation that allows electron transfer.'
    - reference_id: PMID:32929281
      supporting_text: The structure also revealed two putative cation binding sites in the PHD of DUOX1.
