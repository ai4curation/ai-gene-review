description: ZDHHC23 is a membrane-associated DHHC-family protein S-palmitoyltransferase. Its conserved
  catalytic cysteine supports protein lipidation; characterized mammalian ZDHHC23 palmitoylates the potassium-channel
  subunit KCNMA1 and influences its plasma-membrane localization.
