- term:
    id: GO:0006612
    label: protein targeting to membrane
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000525256
  - SGD:S000004236
  - UniProtKB:Q10L01
  review:
    summary: S-palmitoylation-dependent membrane targeting is inherited from the DHHC-family root node.
      For ZDHHC23 the characterized effect is plasma-membrane delivery of KCNMA1, captured by GO:0072659.
    action: KEEP_AS_NON_CORE
    reason: The donors are yeast Erf2 and rice DHHC9, whose substrates gain membrane association through
      palmitoylation. The DHHC enzyme does part of the work of that process because it installs the lipid
      anchor. For ZDHHC23, the substrate KCNMA1 is already an integral membrane protein, and palmitoylation
      of its S0-S1 loop governs exit from the TGN and surface delivery, not membrane insertion. The
      family-level term is plausibly true of ZDHHC23 activity on other substrates but has no ZDHHC23-specific
      support. The ZDHHC23-specific process is the separately annotated GO:0072659, which is not a descendant
      of this term, so the term is kept as non-core rather than refined.
    supported_by:
    - reference_id: PMID:22399288
      supporting_text: Furthermore, we reveal reversible protein palmitoylation is a critical step in
        controlling exit of BK channels from the trans-Golgi network (TGN) and thus a major checkpoint
        for regulating cell surface expression of the channel.
