core_functions:
- description: >-
    Protein-cysteine S-palmitoyltransferase acting at Golgi and trans-Golgi network membranes. It
    palmitoylates the intracellular S0-S1 loop of the BK channel subunit KCNMA1 and so promotes exit of
    the channel from the TGN and its localization to the plasma membrane.
