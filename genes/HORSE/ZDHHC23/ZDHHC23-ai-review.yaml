taxon:
  id: NCBITaxon:9796
  label: Equus caballus
description: >-
  ZDHHC23 is a multipass membrane protein S-acyltransferase of the DHHC family (PANTHER subfamily
  PTHR22883:SF475). It transfers palmitate from palmitoyl-CoA onto cysteine residues of substrate
  proteins through an autoacylated cysteine in its DHHC cysteine-rich domain (C283 in this horse
  product). In mammalian cells ZDHHC23 resides mainly in Golgi and trans-Golgi network membranes. With
  ZDHHC22, it palmitoylates the intracellular S0-S1 loop of the BK potassium channel alpha subunit
  KCNMA1. This palmitoylation is needed for efficient exit of the channel from the trans-Golgi network
  and for its delivery to the plasma membrane. Rodent ZDHHC23 (NIDD) also binds the PDZ domain of
  neuronal nitric-oxide synthase through a C-terminal -EDIV motif. The 448-residue horse product
  described here is the Ensembl canonical gene model. Its C-terminal tail comes from an alternative last
  exon and lacks the -EDIV motif.
