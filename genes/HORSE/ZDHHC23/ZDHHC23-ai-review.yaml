    label: Golgi membrane
  supported_by:
  - reference_id: PMID:22399288
    supporting_text: First, we demonstrate that zDHHC22 and zDHHC23 specifically control palmitoylation
      of the S0–S1 loop of BK channels to control surface trafficking.
  - reference_id: file:HORSE/ZDHHC23/ZDHHC23-bioinformatics/RESULTS-rereview.md
    supporting_text: A0A9L0T4E4 has the DHHC motif at 280-283, so its predicted active-site cysteine
      is C283.
suggested_questions:
- question: Is the A0A9L0T4E4 alternative last exon, which encodes a 49-residue tail without the -EDIV
    PDZ-binding motif, supported by horse transcript data? Do horse tissues instead mainly express the
    -EDIV isoform found in the other Ensembl models (A0A3Q2KPV4, A0A9L0R7E2, A0A9L0SCZ1)?
- question: Does the C-terminal tail (-EDIV, GLLG or the alternative horse tail) change ZDHHC23 substrate
    choice, for example KCNMA1 compared with nNOS-associated targets?
suggested_experiments:
- description: Express horse ZDHHC23 isoforms carrying the A0A9L0T4E4 tail or the -EDIV tail in HEK293
    cells with the KCNMA1 S0-S1-YFP reporter. Measure acyl-biotin exchange palmitoylation and surface
    expression, and use a DHHS (C283S) mutant as the catalytic-dead control.
