  review:
    assessment: UNC
    confidence_score: 1
    summary: 'The horse protein is a one-to-one orthologue of human DYNLT2B in the DYNLT2B-specific PANTHER
      subfamily PTHR21255:SF7, with 91% identity over the aligned Tctex domain. Endogenous human TCTEX1D2
      colocalizes with WDR60 at the ciliary base, the site where IFT dynein is loaded onto trains; the
      human and mouse reviews accept this location as part of the core retrograde IFT context. Transfer
      within the subfamily is justified because the location follows from dynein-2 membership. The horse
      gene has no GOA annotation on any product, so the term is novel for it. Product-level assessment:
      ProtNLM2 was given A0A9L0SWY1, which keeps the Tctex domain signatures (Pfam PF03645, CDD cd21459)
      and the human Tctex strands at residues 4-11, 89-99, 104-113 and 119-126, but ends two residues
      after strand 119-126 and so lacks the C-terminal Tctex beta-strand (human residues 128-140), and
      it adds an approximately 117-residue disordered N-terminal extension. In the human DYNLT1-DYNLT2B
      heterodimer crystal structure (PDB 8RGI), most DYNLT2B residues within 4 angstroms of DYNLT1 lie
      in the retained strands 89-112, and only residues 137, 139 and 140 of the missing strand contact
      DYNLT1, but that strand belongs to the core beta-sheet of the fold. Whether this truncated product
      folds, heterodimerizes with DYNLT1 or DYNLT3 and binds WDR60, on which ciliary-base localization,
      which follows from incorporation into dynein-2 through WDR60 depends, is untested, so the prediction
      is UNC for this product although the term is correct and novel for the gene.'
