id: A0A9L0SWY1
gene_symbol: DYNLT2B
taxon:
  id: NCBITaxon:9796
  label: Equus caballus
status: COMPLETE
description: 'ProtNLM2 made ten GO predictions for A0A9L0SWY1, one of at least ten protein models of the
  horse DYNLT2B gene, which has no GOA annotation on any product. Nine terms are true of the gene by transfer
  within the DYNLT2B-specific PANTHER subfamily PTHR21255:SF7 from experimentally characterized human
  and mouse orthologues and would be novel for it: dynein intermediate chain binding, intraciliary retrograde
  transport, ciliary base, axoneme, cilium assembly, regulation of cilium assembly, and the centrosome,
  interphase microtubule-organizing-center and spindle-pole locations. This accession lacks the C-terminal
  Tctex beta-strand (human residues 128-140), and whether the truncated product can still heterodimerize
  and bind WDR60, on which all nine depend, is untested, so they are scored UNC for this product. Regulation
  of intraciliary retrograde transport is incorrect, because the loss-of-function evidence shows the protein
  is part of the retrograde IFT machinery rather than a regulator of it.'
