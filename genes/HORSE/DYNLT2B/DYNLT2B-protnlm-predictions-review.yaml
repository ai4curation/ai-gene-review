  review:
    assessment: NPI
    confidence_score: 0
    error_type: CURATION_MISTAKE
    summary: 'The evidence behind this term is loss-of-function: removing TCTEX1D2 impairs retrograde
      IFT and destabilizes the IFT dynein motor. That shows the protein is part of the machinery that
      executes retrograde IFT, not a modulator of a process carried out by others. The human and mouse
      reviews both correct the corresponding annotations laterally to GO:0035721 intraciliary retrograde
      transport on exactly these grounds, which also refutes the regulation term predicted here; the prediction
      reproduces the upstream regulation framing. The participation term GO:0035721 is predicted separately;
      it is true of the gene but is scored UNC for this alternative model.'
    supported_by:
    - reference_id: PMID:26044572
      supporting_text: 'We thus define TCTEX1D2 as an integral component of

        the evolutionarily conserved retrograde IFT machinery.'
