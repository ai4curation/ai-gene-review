id: A0A9L0SWY1
gene_symbol: DYNLT2B
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9796
  label: Equus caballus
description: Dynein light chain Tctex-type 2B (DYNLT2B, also known as TCTEX1D2) is a small non-catalytic
  Tctex-1-fold light chain of the cytoplasmic dynein-2 motor that drives retrograde intraflagellar transport
  in cilia. By one-to-one orthology with human DYNLT2B (PANTHER subfamily PTHR21255:SF7, about 91-93% identity
  over the Tctex domain), the equine protein is expected to heterodimerize with DYNLT1 or DYNLT3 and bind the
  dynein-2 intermediate chain WDR60/DYNC2I1, contributing to retrograde ciliary protein trafficking; in mouse
  the orthologue is additionally required for sperm flagellum assembly. The equine locus (Ensembl
  ENSECAG00000015913, chromosome 19) is annotated with at least ten protein models that differ at the N- and
  C-termini. The A0A9L0SWY1 model (245 residues) carries an approximately 117-residue disordered N-terminal
  extension and ends after the fourth beta-strand, lacking the C-terminal beta-strand (human residues 128-142)
  that forms part of the Tctex fold, whereas other equine models (for example A0A9L0S150 and A0A9L0TLH8)
  encode the complete fold. No equine experimental characterization has been reported.
suggested_questions:
- question: Which equine DYNLT2B transcript is the predominant product in ciliated tissues and testis? The
    locus carries at least ten protein models; A0A9L0SWY1 combines an N-terminal disordered extension with
    a C-terminus that stops before the final Tctex beta-strand, while the Ensembl canonical model (A0A9L0S150)
    and A0A9L0TLH8 retain the human C-terminus, so transcript-level evidence is needed to decide whether the
    truncated form is expressed at all.
  experts: []
- question: Does the missing C-terminal region matter functionally? It covers most of the terminal
    beta-strand of the human Tctex fold, and human DYNLT2B works as a DYNLT2B-DYNLT1/DYNLT3
    dimer bound to the WDR60 intermediate chain, so the question is whether this protein form
    can still dimerize and engage WDR60 at all.
  experts: []
- question: Given that mouse Tctex1d2 loss disrupts sperm flagellum assembly while leaving
    motile cilia normal, is the equine requirement for DYNLT2B likewise flagellum-biased, and
    is the long N-terminal extension expressed in testis?
  experts: []
suggested_experiments:
- hypothesis: The equine DYNLT2B locus encodes a product matching the human light chain over
    its full length, and the N-terminal extension plus C-terminal truncation in A0A9L0SWY1
    reflect a gene-model or translation-start discrepancy rather than equine biology.
  description: Long-read (Iso-Seq or targeted nanopore) sequencing of DYNLT2B transcripts from
    horse testis and a ciliated tissue, plus 5-prime RACE to fix the translation start; reassemble
    the ORF and re-run the paired comparison in DYNLT2B-bioinformatics on the corrected sequence.
  experiment_type: full-length transcript sequencing / gene-model validation
- hypothesis: Loss of the C-terminal strand abolishes the DYNLT2B-DYNLT1 dimer and hence WDR60
    binding, whereas the N-terminal extension is dispensable for both.
  description: Co-express the selected horse sequence, an N-terminally trimmed version, and
    a C-terminally restored version against DYNLT1/DYNLT3 and WDR60 in the visible-immunoprecipitation
    format used to map the human dynein-2 subcomplexes (PMID:29742051), scoring dimer formation
    and WDR60 recruitment with human TCTEX1D2 as the positive control.
  experiment_type: pairwise interaction mapping / co-immunoprecipitation
- hypothesis: Whichever equine form is real, it supports retrograde ciliary protein trafficking
    as the human light chain does.
  description: Complement human TCTEX1D2-knockout cells with the selected horse sequence and
    with any transcript-verified full-length equine form, and score rescue of the retrograde
    trafficking defect (ciliary accumulation of IFT-B and GPCR cargo) against human TCTEX1D2
    and empty vector.
  experiment_type: cross-species complementation in a knockout cell line
references:
- id: file:HORSE/DYNLT2B/DYNLT2B-uniprot.txt
  title: 'UniProtKB A0A9L0SWY1: selected horse DYNLT2B protein model'
  findings:
  - statement: The horse DYNLT2B entry is an unreviewed 245-residue TrEMBL record whose protein
      name and gene symbol come solely from an Ensembl gene model, with no equine experimental
      characterization.
    supporting_text: Ensembl; ENSECAT00000143034.1; ENSECAP00000080542.1; ENSECAG00000015913.4.
    reference_section_type: DATABASE_ENTRY
  - statement: Domain signatures confirm a Tctex-1-like fold in the horse protein, which is
      what supports family identity independently of the length discrepancy.
    supporting_text: 'InterPro; IPR005334; Tctex-1-like.'
    reference_section_type: DATABASE_ENTRY
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Source record for the reviewed protein form. Naming and domain assignment
      are computational (Ensembl/InterPro/Pfam); they establish family identity but no equine
      function, and they do not adjudicate the 245-versus-142-residue discrepancy.
- id: file:HORSE/DYNLT2B/DYNLT2B-bioinformatics/RESULTS.md
  title: "DYNLT2B: horse\u2013human sequence comparison"
  findings:
  - statement: The conserved region is nearly identical to human DYNLT2B (91.41% over 128 residues)
      but covers only half the horse sequence, so family identity is secure while whole-protein
      equivalence is not.
    supporting_text: The horse sequence A0A9L0SWY1 (245 residues) aligns to human Q8WW35 (142
      residues) with 91.41% identity across 128 paired residues. Paired coverage is 90.14%
      of the human sequence and 52.24% of the horse sequence.
    reference_section_type: RESULTS
  - statement: Mapping human secondary-structure features onto the alignment shows the human
      C-terminal strand (residues 128-140) has no horse counterpart beyond a single residue,
      localizing the discrepancy to a structural element rather than to a disordered tail.
    supporting_text: 'STRAND: human [128, 129, 130, 131, 132, 133, 134, 135, 136, 137, 138,
      139, 140] DSLFCVVAAFGCF'
    reference_section_type: RESULTS
  - statement: The comparison explicitly declines to establish one-to-one orthology or to verify
      the sequence that was supplied to the prediction pipeline.
    supporting_text: This establishes sequence conservation between the selected pair; it does
      not independently establish one-to-one orthology or verify the sequence supplied to ProtNLM.
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Reproducible Biopython global alignment (BLOSUM62, gap open -10, extension
      -0.5) with retained sequence hashes and mapped human structural features; computed, not
      hardcoded. It localizes the model discrepancy to a specific beta-strand, which is why
      this review treats the alteration as consequential rather than as generic percentage-identity
      noise - while still not establishing a folding or binding defect.
- id: file:HORSE/DYNLT2B/DYNLT2B-bioinformatics/RESULTS-rereview.md
  title: DYNLT2B horse gene models vs human Q8WW35 (re-review)
  findings:
  - statement: The equine DYNLT2B gene carries ten UniProt protein models; the Ensembl canonical transcript
