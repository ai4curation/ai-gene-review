    summary: Proposed by orthology to human DYNLT2B, grounded phylogenetically. PAINT placed dynein intermediate chain binding at the Tctex
      family node PTN000478852, which is ancestral to the DYNLT2B-specific subfamily PTHR21255:SF7 that
      contains this equine protein; the human SF7 member carries it both by IBA and by direct experiment
      (WDR60-TCTEX1D2-DYNLT1/DYNLT3 subcomplex). Horse is simply not among the species receiving the IBA
      rows in GOA.
