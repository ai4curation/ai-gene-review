- id: PMID:38454149
  title: Structure and tethering mechanism of dynein-2 intermediate chains in intraflagellar
    transport.
  findings:
  - statement: DYNLT2B/TCTEX1D2 is one of four light chains in the reconstituted eight-subunit
      dynein-2 complex used for cryo-EM, alongside the heavy chain, two intermediate chains
      and the light intermediate chain.
    supporting_text: The subunits in the final construct are the dynein-2 heavy chain (DYNC2H1),
      two intermediate chains (WDR60/DYNC2I1 and WDR34/DYNC2I2), light intermediate chain (DYNC2LI1),
      and single isoforms of the four dynein-2 light chains (DYNLRB1, DYNLL1, DYNLT1, and DYNLT2B/TCTEX1D2).
    reference_section_type: RESULTS
  - statement: Even in this structure the stoichiometry of the DYNLT1/DYNLT2B pair within dynein-2
      is left undefined, so the structural context of the horse model's altered C-terminus
      cannot be read off the complex architecture.
    supporting_text: Orange blur and question mark reflect undefined stoichiometry of DYNLT1
      and DYNLT2B.
    reference_section_type: RESULTS
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text cached. The source of the structural context for the human Tctex
      fold referenced in the notes. Cited for complex composition and the explicit stoichiometry
      caveat, not for the WDR34/WDR60 tethering results, which concern the intermediate chains
      rather than DYNLT2B.
- id: PMID:29742051
  title: Interaction of WDR60 intermediate chain with TCTEX1D2 light chain of the dynein-2
    complex is crucial for ciliary protein trafficking.
  findings:
  - statement: DYNLT2B/TCTEX1D2 sits in a defined dynein-2 subcomplex with WDR60 and DYNLT1/DYNLT3,
      mapped by visible immunoprecipitation - the interaction that the horse model's truncated
      dimer interface puts in question.
    supporting_text: The dynein-2 complex can be divided into three subcomplexes, namely DYNC2H1-DYNC2LI1,
      WDR34-DYNLL1/DYNLL2-DYNLRB1/DYNLRB2, and WDR60-TCTEX1D2-DYNLT1/DYNLT3.
    reference_section_type: ABSTRACT
  - statement: TCTEX1D2 knockout cells are defective in retrograde ciliary protein trafficking,
      but less severely than WDR60 knockouts, placing TCTEX1D2 in an auxiliary rather than
      essential role within the complex.
    supporting_text: our results demonstrated that WDR60 plays a major role and TCTEX1D2 plays
      an auxiliary role in the dynein-2 complex to mediate retrograde ciliary protein trafficking.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached. One of the two experimental sources behind the human FUNCTION
      annotation. The auxiliary-role conclusion is worth carrying forward, since it tempers
      how much phenotypic weight a divergent DYNLT2B form would be expected to carry.
- id: PMID:25830415
  title: Tctex1d2 associates with short-rib polydactyly syndrome proteins and is required for
    ciliogenesis.
  findings:
  - statement: Tctex1d2 associates with the dynein intermediate chains WDR34 and WDR60 and
      other dynein-1 and dynein-2 subunits, and localizes with WDR60 to the ciliary base;
      depletion of either causes ciliogenesis defects.
    supporting_text: Tctex1d2 and Wdr60 localize to the base of the cilium and their depletion
      causes defects in ciliogenesis.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text cached. The original identification of TCTEX1D2 as a dynein light
      chain and the source of the ciliary-base localization claim. The localization is a separate
      observation from complex assembly and carries its own transfer limits, as the gene notes
      record.
- id: PMID:39827215
  title: TCTEX1D2 is essential for sperm flagellum formation in mice.
  findings:
  - statement: Mouse Tctex1d2 knockouts are male-infertile with dysplastic sperm flagella and
      disrupted axonemal structure, while their motile cilia remain normal - so the in vivo
      requirement is flagellum-biased rather than uniformly ciliary.
    supporting_text: Tctex1d2-/- mice generated in this study exhibited male infertility due
      to flagellar dysplasia, and the axonemal structures were disrupted inside the flagella.
    reference_section_type: ABSTRACT
  - statement: TCTEX1D2 acts in two distinct dynein complexes, interacting with cytoplasmic
      dynein-2 subunits (WDR34, WDR60, DYNLT1) and also with the inner-dynein-arm subunits
      WDR63 and WDR78 in testis.
    supporting_text: Furthermore, TCTEX1D2 also interacted with WDR63 and WDR78, subunits of
      inner dynein arm, which is axonemal dynein.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text cached. Mouse in vivo evidence; cited for the tissue-restricted
      phenotype and the second (axonemal dynein) interaction set, both of which shape what
      an equine experiment should measure. Transfer to horse is not asserted.
