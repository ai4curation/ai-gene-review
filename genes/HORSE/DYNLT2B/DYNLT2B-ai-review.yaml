    supporting_text: 'Ensembl canonical transcript of ENSECAG00000015913: ENSECAT00000082191. UniProt reference-proteome
      gene-centric entry: A0A9L0S9P8.'
    reference_section_type: RESULTS
  - statement: The benchmark model lacks the complete set of human Tctex-fold strands, whereas the Ensembl
      canonical model A0A9L0S150 covers the whole human sequence with all strands present.
    supporting_text: '| A0A9L0SWY1 (benchmark) | 245 | False | False | True | 91.41 | 90.14 | False | GVFMAARCFWDADTDNYTHDVFMNK
      |'
    reference_section_type: RESULTS
  - statement: The Ensembl canonical model A0A9L0S150 aligns over the full human length with all strands
      mapped and the human C-terminal sequence intact.
    supporting_text: '| A0A9L0S150 | 259 | True | False | True | 92.96 | 100.0 | True | DNYTHDVFMNDSLFCVVAAFGCFYY
      |'
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Reproducible re-review script (compare_gene_models_rereview.py) that fetches all equine
      DYNLT2B UniProt entries, the Ensembl canonical flag and the UniProt reference-proteome gene-centric
      FASTA, and aligns each model to human Q8WW35. Establishes that A0A9L0SWY1 is one of several alternative
      gene models rather than the canonical product. Strand pairing counts aligned positions, not identity.
