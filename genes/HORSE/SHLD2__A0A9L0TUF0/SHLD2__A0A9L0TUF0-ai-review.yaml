id: A0A9L0TUF0
gene_symbol: SHLD2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9796
  label: Equus caballus
description: SHLD2 encodes the central, non-enzymatic subunit of shieldin, the vertebrate DNA double-strand-break
  (DSB) end-protection complex formed with SHLD1, SHLD3 and REV7 (MAD2L2). A0A9L0TUF0 is the 1047-residue
  product of the Ensembl canonical horse transcript and the one-to-one ortholog of human SHLD2, in the
  same PANTHER subfamily (PTHR14495:SF2). Its N-terminal segment carries the motif that in human SHLD2
  binds the SHLD3-REV7 recruitment module, which links shieldin to the 53BP1-RIF1 pathway at damaged
  chromatin. Its C-terminal region carries the RPA1-like OB folds that in the human protein bind SHLD1
  and single-stranded DNA. In human cells, shieldin occupies resected 3' overhangs at DSBs, limits
  further resection and RAD51 loading, and so favours non-homologous end joining over homologous recombination,
  with roles in immunoglobulin class-switch recombination and in joining deprotected telomeres. Horse
  SHLD2 has not been studied experimentally. Its functions are inferred from the human ortholog, whose
  mapped functional elements are all conserved in this sequence, including the OB-fold-B exon present
  only in the long human isoform. The horse model also has a 39-residue N-terminal and a 100-residue
  C-terminal extension that have no counterpart in human SHLD2 and are of unknown significance.
