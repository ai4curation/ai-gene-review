suggested_questions:
- question: Are the 39-residue N-terminal and 100-residue C-terminal extensions of the horse canonical
    SHLD2 model, which have no counterpart in human SHLD2, part of the expressed horse protein, or are
    they gene-model artefacts (an upstream in-frame start or read-through past the conserved stop)?
- question: Does horse express both SHLD2 splice forms (with and without the OB-fold-B exon), as human
    does?
suggested_experiments:
- description: Map horse SHLD2 transcript start and end by RNA-seq or RACE from equine B cells or fibroblasts,
    and confirm the protein size by immunoblot.
  hypothesis: The expressed horse protein starts at the methionine equivalent to human M1 (horse M40) and
    ends near the conserved human C-terminus, so the canonical model's extensions are annotation artefacts.
- description: Deplete SHLD2 in BRCA1-deficient equine cells and measure RAD51 foci, resection and PARP
    inhibitor sensitivity, or test horse SHLD2 for rescue of human SHLD2-knockout cells.
  hypothesis: Horse SHLD2 suppresses HR and promotes NHEJ as the human ortholog does.
