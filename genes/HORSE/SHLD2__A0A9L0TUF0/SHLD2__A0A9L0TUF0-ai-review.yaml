- term:
    id: GO:0003697
    label: single-stranded DNA binding
  evidence_type: ISS
  original_reference_id: PMID:30022168
  qualifier: enables
  review:
    summary: Proposed. The SHLD2 C-terminal OB-fold region binds ssDNA directly in the human ortholog;
      the region is conserved in horse.
    action: NEW
    reason: This is the molecular activity of SHLD2 itself, not a downstream effect. Purified human SHLD2C
      (residues 421-904 of the long form) binds ssDNA with about 10 nM affinity, independent of SHLD1,
      and an OB-fold mutant that abolishes binding fails to suppress HR. The horse region equivalent to
      SHLD2C (464-947) is 81.8% identical, with the OB-fold-B exon and the zinc-ribbon cysteines of OB
      fold C conserved. The term is missing from GOA for both human and horse. Evidence is by sequence
      similarity to the experimentally characterised ortholog in the same PANTHER subfamily.
    supported_by:
    - reference_id: PMID:30022168
      supporting_text: We estimate the binding affinity of the SHLD2C-ssDNA interaction to be ~10 nM (Fig
        4e and ED Fig 9c). We conclude that SHLD2 possesses ssDNA-binding activity.
    - reference_id: file:HORSE/SHLD2__A0A9L0TUF0/SHLD2__A0A9L0TUF0-bioinformatics/RESULTS.md
      supporting_text: '| 421-904, SHLD2C construct that binds ssDNA | 464-947 | 81.8% |'
- term:
    id: GO:0030674
    label: protein-macromolecule adaptor activity
  evidence_type: ISS
  original_reference_id: PMID:30022168
  qualifier: enables
  review:
    summary: Proposed. SHLD2 bridges the SHLD3-REV7 recruitment module and SHLD1 in the human ortholog;
      both binding regions are conserved in horse.
    action: NEW
    reason: In human shieldin, SHLD3-REV7 binds the SHLD2 N-terminus, and deleting residues 6-11 abolishes
      that binding, while SHLD1 binds the C-terminal OB-fold region. SHLD2 is therefore the adaptor that
      joins the recruitment and DNA-binding halves of the complex. In human GOA this is captured only as
      bare protein binding rows, which the human review MODIFIES to this term. In horse, residues 45-50
      (equivalent to human 6-11) are identical, and the SHLD1-interaction region is 81.2% identical. Evidence
      is by sequence similarity to the characterised ortholog in the same PANTHER subfamily.
    supported_by:
    - reference_id: PMID:30022168
      supporting_text: Further mapping studies suggest that Shieldin consists of a DSB-recruitment module
        composed of SHLD3-REV7 that binds to the N-terminus of SHLD2 (residues 1-50; ED Fig 6, ED Fig 7a-c),
        and a presumptive DNA-binding module (SHLD2-SHLD1) featuring the OB-fold domains at the SHLD2 C-terminus
        (SHLD2C residues 421-904; ED Fig 7a).
    - reference_id: file:HORSE/SHLD2__A0A9L0TUF0/SHLD2__A0A9L0TUF0-bioinformatics/RESULTS.md
      supporting_text: 6-11, deletion abolishes SHLD3/MAD2L2 binding | 45-50 | 100%
