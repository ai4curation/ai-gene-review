- term:
    id: GO:0019901
    label: protein kinase binding
  evidence_type: ISS
  original_reference_id: PMID:24859006
  review:
    summary: Proposed. Mouse Par3L, in the same PANTHER subfamily (SF4), binds the kinase LKB1 (STK11) and
      restrains its activity. Binding needs PDZ2, PDZ3 and the linker between them.
    action: NEW
    reason: The horse entry has no informative molecular function. LKB1 binding is the best-characterized
      molecular activity of PARD3B; it is specific to this subfamily (not shared with Par3) and maps to the
      PDZ2-PDZ3 linker, which is 88-93% identical in horse. The transfer rests on shared membership of
      PTHR16484:SF4, not on similarity alone. Kinase inhibitor activity is not proposed, because inhibition was
      measured only indirectly (AMPK phosphorylation in cells). MGI captured this interaction as bare protein
      binding; protein kinase binding is the informative form of the same claim.
    supported_by:
    - reference_id: PMID:24859006
      supporting_text: LKB1 binding to Par3L protein requires PDZ domains 2 and 3 plus the intervening region.
    - reference_id: PMID:24859006
      supporting_text: Here we identify Par3L as an essential factor for mouse mammary stem cell maintenance,
        and show that it acts by suppressing the kinase activity of the Par4/LKB1 polarity protein.
    - reference_id: file:HORSE/PARD3B/PARD3B-bioinformatics/RESULTS.md
      supporting_text: mouse Par3L is required for LKB1 binding, is 38/41 identical to human and 36/41 identical
        to
