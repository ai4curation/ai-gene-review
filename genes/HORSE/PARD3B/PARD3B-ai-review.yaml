id: A0A9L0RMF2
gene_symbol: PARD3B
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9796
  label: Equus caballus
description: PARD3B (partitioning defective 3 homolog B; PAR3beta, Par3L) is the vertebrate paralog of the
  cell-polarity scaffold PARD3 in the PAR3 family. It has an N-terminal Par3/HAL oligomerization domain,
  three PDZ domains and a long disordered C-terminal region. Unlike PARD3, it has lost the conserved
  aPKC-binding motif and does not form the stable PARD3-PAR6-aPKC complex, although some isoforms bind
  PARD6B and it has been found near PAR6B at the apical membrane of epithelial cysts. PARD3B localizes to
  epithelial tight junctions, lateral cell-cell contacts and the cell cortex. It binds the spindle-orientation
  adaptor Inscuteable, 14-3-3 proteins (through a phosphorylated serine) and the kinase LKB1 (STK11), whose
  activity it restrains; in mouse this LKB1 interaction is needed to maintain mammary stem cells, and loss
  of the gene causes epithelial tumours with spindle defects. The horse protein A0A9L0RMF2 is a full-length
  product, 88% identical to human PARD3B, with all three PDZ domains and the PARD3B-specific changes in the
  aPKC-binding region.
