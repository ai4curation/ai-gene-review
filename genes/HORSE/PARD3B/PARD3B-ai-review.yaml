suggested_questions:
- question: Does PARD3B inhibit LKB1 directly (in vitro kinase assay with purified LKB1-STRAD-MO25) or by
    sequestering it, and should GO capture it as protein kinase inhibitor activity?
- question: Is the 31-residue segment near horse residue 132 a real alternatively spliced exon of horse PARD3B,
    or an artefact of the gene model?
- question: Do the phosphoinositide-binding residues of PARD3/Bazooka survive in the PARD3B subfamily, which
    would test the family-level phosphatidylinositol binding IBA?
suggested_experiments:
- description: Purified PARD3B PDZ2-PDZ3 fragment titrated into in vitro LKB1-STRAD-MO25 kinase assays on an
    AMPK alpha substrate peptide, with the linker-deletion mutant as a negative control.
  experiment_type: biochemical assay
- description: Lipid-overlay or liposome-binding assays of PARD3B PDZ2 versus PARD3 PDZ2 to test the inherited
    phosphatidylinositol binding annotation.
  experiment_type: biochemical assay
