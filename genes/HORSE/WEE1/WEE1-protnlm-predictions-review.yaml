  predicted_term:
    id: GO:0060631
    label: regulation of meiosis I
  predicted_term_type: GO_BP
  review:
    assessment: UNC
    confidence_score: 1
    summary: WEE1 is a conserved CDK-inhibitory kinase, but mammalian oocyte studies distinguish somatic
      WEE1 from WEE2/Wee1B. A mitotic checkpoint mechanism does not automatically establish regulation
      of meiosis I. Broad meiotic participation cannot be excluded without horse-specific expression and
      perturbation evidence. Later Wee2 knockout mice retain fertility, reinforcing that this evidence
      should not be generalized to absolute indispensability or absence of compensation.
