    id: GO:0035038
    label: female pronucleus assembly
  predicted_term_type: GO_BP
  review:
    assessment: UNC
    confidence_score: 1
    summary: The mouse egg-activation experiment distinguishes WEE2/Wee1B depletion, which blocks pronucleus
      formation, from WEE1/Wee1A depletion, which does not in that assay. The selected horse sequence
      is a close full-length WEE1 match, making paralog transfer a plausible explanation. However, differential
      necessity does not exclude participation, and later Wee2 knockout mice retain substantial fertility
      with possible compensation. Without horse oocyte expression and perturbation evidence, this specific
      biological-process prediction remains uncertain rather than definitively refuted.
    supported_by:
