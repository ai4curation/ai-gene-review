  review:
    action: MODIFY
    summary: Ser/Thr residue specificity is not supported for WEE1; the established activity is tyrosine-directed.
    reason: These rows derive from the PROSITE Ser/Thr kinase active-site motif (PS00108/PRU10027), EC
      2.7.11.1 and its Rhea mapping, and the generic UniRule kinase rule; that motif marks the eukaryotic
      kinase fold rather than residue specificity. Purified human WEE1 (same PANTHER subfamily SF72) phosphorylates
      CDK1 exclusively on Tyr15 with no Thr14 phosphorylation; dual Thr14/Tyr15 activity belongs to the
      PKMYT1 branch and to fungal Wee1 in other subfamilies. PAINT curators placed protein serine/threonine
      kinase activity on a different PTHR11042 node (PTN008683913) that does not reach WEE1, and propagated
      only tyrosine kinase activity to the WEE1 clade, which we read as a deliberate decision. Replace
      with protein tyrosine kinase activity (lateral correction). Being phosphorylated on Ser/Thr residues
      (WEE1 is itself a substrate of CDK1, PLK1 and CK2) does not make WEE1 a Ser/Thr kinase.
    supported_by:
    - *id004
    - *id001
    proposed_replacement_terms: *id005
