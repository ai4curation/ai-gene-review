gene_symbol: WEE1
product_type: PROTEIN
status: IN_PROGRESS
taxon:
  id: NCBITaxon:9796
  label: Equus caballus
description: WEE1 is a conserved protein tyrosine kinase that inhibits CDK activity and restrains the
  G2/M transition. The horse protein closely matches full-length human WEE1 across both regulatory and
  catalytic regions, supporting nuclear checkpoint activity. It is distinct from the WEE2 paralog associated
  with oocyte meiotic regulation.
