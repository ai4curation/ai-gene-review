id: F6TY09
gene_symbol: WEE1
product_type: PROTEIN
status: IN_PROGRESS
taxon:
  id: NCBITaxon:9796
  label: Equus caballus
description: WEE1 is a nuclear non-receptor protein tyrosine kinase of the WEE1 branch of the eukaryotic
  protein kinase superfamily. It phosphorylates the inhibitory tyrosine (Tyr15) of CDK1 in complex with
  cyclin B, keeping the kinase inactive during S and G2 phases so that cells do not enter mitosis before
  DNA replication is complete and DNA damage is repaired. The 646-residue protein has a long N-terminal
  regulatory region, a central kinase domain and a short C-terminal region; its abundance and activity
  are controlled by phosphorylation and ubiquitin-mediated degradation at mitotic entry. It is distinct
  from the oocyte-enriched paralog WEE2, which regulates CDK1 during meiosis, and from the membrane-associated
  PKMYT1, which phosphorylates both Thr14 and Tyr15.
