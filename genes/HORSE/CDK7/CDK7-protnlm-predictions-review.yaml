  predicted_term:
    id: GO:0006468
    label: protein phosphorylation
  predicted_term_type: GO_BP
  review:
    assessment: COR
    confidence_score: 2
    summary: Human CDK7 phosphorylates CDKs and the RNA polymerase II CTD; the horse catalytic domain
      and ATP-binding features are conserved. Protein phosphorylation is therefore a justified mammalian
      functional transfer. This BP term is absent from the frozen horse GOA, although kinase MF annotations
      are present; novelty here means target annotation coverage, not a new biochemical discovery or known
      absence from training. Training-set membership is unknown.
