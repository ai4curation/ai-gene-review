taxon:
  id: NCBITaxon:9796
  label: Equus caballus
description: CDK7 is the catalytic subunit of the cyclin-H/MAT1 CDK-activating kinase complex. It phosphorylates
  cell-cycle CDKs and, in association with TFIIH, the C-terminal domain of RNA polymerase II. The selected
  horse protein conserves the human catalytic domain and has an additional C-terminal segment.
