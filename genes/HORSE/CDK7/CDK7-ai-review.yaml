  review:
    summary: ATP-dependent activity acting on DNA is the DNA-dependent ATPase/helicase activity of TFIIH, which
      belongs to XPB (ERCC3) and XPD (ERCC2), not to CDK7.
    action: REMOVE
    reason: Projected from a human IDA (PMID:9852112) that assayed purified whole TFIIH. CDK7 is a protein kinase;
      its ATP hydrolysis transfers phosphate to protein substrates and it has no DNA-acting ATPase. The activity
      is a complex-level property contributed by other subunits, and TFIIH-like subcomplexes lacking CAK retain
      repair activity. This electronic projection to horse should not be retained.
    supported_by:
