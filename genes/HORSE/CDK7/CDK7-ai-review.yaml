id: A0A9L0R074
gene_symbol: CDK7
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9796
  label: Equus caballus
description: CDK7 is a serine/threonine protein kinase of the CMGC group and the catalytic subunit of the CDK-activating
  kinase (CAK), a trimer with cyclin H and the assembly factor MAT1. In the nucleus, free CAK activates cell-cycle
  CDKs (CDK1, CDK2, CDK4, CDK6) by phosphorylating the threonine in their activation segment, and so drives progression
  through G1 and the S and G2 phases. As the TFIIK module of the general transcription factor TFIIH, the same kinase
  phosphorylates Ser5 and Ser7 of the RNA polymerase II C-terminal heptapeptide repeats during transcription initiation,
  promoting promoter escape and recruitment of the mRNA capping machinery. CAK also associates with the XPD helicase
  in a CAK-ERCC2 complex. The horse gene is the ortholog of human CDK7 within PANTHER subfamily PTHR24056:SF0. The
  UniProt model A0A9L0R074 contains the complete kinase region but replaces the last eight residues of the conserved
  C-terminus with a 77-residue segment that has no counterpart in other CDK7 proteins.
