suggested_questions:
- question: Is the A0A9L0R074 3' end (77-residue C-terminus replacing GLPKKLIF) supported by horse RNA-seq, or is
    it an intron read-through artefact of the Ensembl model? The transcript-supported horse model K9K3U4 has the
    conserved human-like C-terminus.
suggested_experiments:
- hypothesis: The A0A9L0R074 C-terminal exon is not a major expressed horse CDK7 product.
  description: RT-PCR / long-read sequencing across the horse CDK7 3' exons to determine whether the A0A9L0R074
    C-terminal exon is expressed, and if so whether the encoded protein assembles with cyclin H and MAT1.
