suggested_questions:
- question: Is the 22-residue N-terminal extension of A0A5F5Q204 (absent from sibling model A0A5F5PQM0 and from human) a real
    alternative first exon used in horse tissues, or an Ensembl gene-model artefact? Does it affect signal-peptide cleavage?
