id: A0A5F5Q204
gene_symbol: TNFRSF1A
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9796
  label: Equus caballus
description: 'TNFRSF1A encodes tumor necrosis factor receptor 1 (TNFR1, p55/p60), the principal signalling receptor for soluble
  TNF and lymphotoxin-alpha. It is a single-pass type I membrane protein. Its extracellular region has four cysteine-rich
  domains: the N-terminal one carries the pre-ligand assembly domain, and CRD2-CRD3 bind trimeric ligand to form a 3:3 receptor-ligand
  complex. Its cytoplasmic region carries a death domain. Ligand binding recruits TRADD to the death domain and assembles
  a membrane-bound signalling complex (TRADD, RIPK1, TRAF2, cIAPs) that activates canonical NF-kappaB and MAPK signalling,
  driving inflammatory gene expression and cell survival. When that complex fails, TRADD and RIPK1 form a cytoplasmic complex
  with FADD and caspase-8 that triggers extrinsic apoptosis. The receptor localizes to the plasma membrane, lipid rafts and
  an intracellular Golgi pool, and its ectodomain can be shed as a soluble TNF-binding protein. In horse, the gene product
  A0A5F5Q204 is the 1:1 ortholog of human TNFR1 (PANTHER PTHR46861:SF1) and conserves all four cysteine-rich domains, the
  transmembrane helix and the death domain. Its function is inferred from orthology, because no horse-specific experiments
  are annotated.'
