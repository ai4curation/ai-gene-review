core_functions:
- description: >-
    Acyl-CoA-dependent sn-1 acylation of glycerol 3-phosphate to lysophosphatidic acid, with a
    preference for arachidonoyl-CoA, at the cytosolic face of the mitochondrial outer membrane;
    this initiates de novo phosphatidic acid and triacylglycerol synthesis, notably in testis.
  molecular_function:
    id: GO:0004366
    label: glycerol-3-phosphate O-acyltransferase activity
  directly_involved_in:
  - id: GO:0006654
    label: phosphatidic acid biosynthetic process
  - id: GO:0019432
    label: triglyceride biosynthetic process
  locations:
  - id: GO:0005741
    label: mitochondrial outer membrane
  supported_by:
  - reference_id: PMID:17689486
    supporting_text: When Cos-7 cells were transiently transfected with GPAT2, NEM-sensitive
      GPAT activity increased 30%.
  - reference_id: PMID:22905194
    supporting_text: corroborating GPAT2's role in synthesizing TAG that is rich in arachidonic
      acid
  - reference_id: file:HORSE/GPAT2/GPAT2-bioinformatics/RESULTS.md
    supporting_text: H205-K206-S207-L208-L209-D210, identical in sequence and position.
suggested_questions:
- question: Does purified GPAT2 have intrinsic 1-acylglycerol-3-phosphate acyltransferase
    activity, or does the AGPAT increase in overexpressing membranes come from endogenous AGPATs?
- question: How does GPAT2 contribute to primary piRNA biogenesis without its acyltransferase
    activity, and is this role conserved outside rodents?
suggested_experiments:
- description: Assay purified or reconstituted wild-type and HXXXXD-mutant GPAT2 with
    lysophosphatidic acid and arachidonoyl-CoA to test for intrinsic AGPAT activity.
- description: Knock out GPAT2 in a non-rodent mammalian germline model and measure primary
    piRNA populations and MILI/PIWIL2 localization to mitochondria.
