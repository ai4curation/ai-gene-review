gene_symbol: GPAT2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9796
  label: Equus caballus
description: >-
  GPAT2 (glycerol-3-phosphate acyltransferase 2, mitochondrial) is an 800-residue
  member of the GPAT/DHAPAT lipid acyltransferase family. By orthology to the mouse
  enzyme it transfers a fatty acyl chain from acyl-CoA, with a preference for
  arachidonoyl-CoA, to the sn-1 position of sn-glycerol 3-phosphate to form
  lysophosphatidic acid, the first step of de novo phosphatidic acid and
  triacylglycerol synthesis. The protein sits in the mitochondrial outer membrane
  with two membrane-spanning segments and its catalytic HXXXXD motif facing the
  cytosol. Expression is largely restricted to the testis, where in mouse it
  supports the synthesis of arachidonate-rich triacylglycerol in spermatocytes.
  Mouse GPAT2 also binds the PIWI protein MILI (PIWIL2) and is needed for primary
  piRNA production in germline stem cells, a role that does not require its
  acyltransferase activity.
existing_annotations:
- term:
    id: GO:0003841
    label: 1-acylglycerol-3-phosphate O-acyltransferase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q14DK4
  - ensembl:ENSMUSP00000049619
  review:
    summary: Ensembl Compara transfer from mouse Gpat2 (Q14DK4) of 1-acylglycerol-3-phosphate
      (LPA) acyltransferase activity. The mouse evidence is a 2-fold increase in AGPAT activity
      in membranes of CHO-K1 cells overexpressing GPAT2, with arachidonoyl-CoA.
    action: KEEP_AS_NON_CORE
    reason: >-
      The horse protein is in the same PANTHER subfamily (PTHR12563:SF15) as mouse Gpat2, so
      the transfer stays within the GPAT2 ortholog group. The donor evidence is weak for an
      intrinsic activity: it is an increase in AGPAT activity in total membranes of
      overexpressing cells, and the authors state that they cannot tell a second activity of
      GPAT2 from an indirect effect. PAINT curators propagated GPAT activity but not AGPAT
      activity at node PTN000970957, which I treat as a deliberate decision. Kept as a possible
      secondary in vitro activity, not core.
    supported_by:
    - reference_id: PMID:22905194
      supporting_text: These findings suggest that the increase in PA may be due to an AGPAT
        activity for this heterologously-expressed protein, but we cannot exclude the possibility
        that the protein has dual enzymatic activities.
    - reference_id: PMID:22905194
      supporting_text: GPAT2 overexpression significantly increased both GPAT and AGPAT activities
        only when arachidonoyl-CoA was used as a substrate
