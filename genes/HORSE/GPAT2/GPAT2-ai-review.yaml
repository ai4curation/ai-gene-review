- term:
    id: GO:0034587
    label: piRNA processing
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q14DK4
  - ensembl:ENSMUSP00000049619
  review:
    summary: Ensembl Compara transfer from mouse Gpat2, whose knockdown in germline stem cells
      impairs primary piRNA production; Gpat2 co-precipitates with MILI/PIWIL2.
    action: KEEP_AS_NON_CORE
    reason: >-
      The donor evidence is more than a downstream phenotype: GPAT2 binds MILI on the
      mitochondrial outer membrane, its knockdown impairs primary piRNA biogenesis, and
      catalytic-dead HXXXXD mutants rescue, which points to a non-enzymatic (proposed scaffold)
      contribution within the pathway. It rests on a single study in cultured mouse germline
      stem cells, the mechanism is unknown, and PAINT did not propagate the term at
      PTN000970957 (the node also contains GPAM, which has no piRNA role). The horse protein is
      a GPAT2 ortholog in the same subfamily and is testis-expressed, so the transfer is
      plausible. Kept as a germline-specific, non-core role.
    supported_by:
    - reference_id: PMID:23611983
      supporting_text: GPAT2 is not only one of the MILI bound proteins but also a protein essential
        for primary piRNA biogenesis.
    - reference_id: PMID:23611983
      supporting_text: These data suggest that the acyltransferase activity of GPAT2 is dispensable
        for the biogenesis of piRNA.
