description: PPP4R4 is a cytosolic regulatory subunit of protein phosphatase 4. It forms a stable complex
  with the PP4 catalytic subunit that is distinct from complexes containing PP4R1 or PP4R2–PP4R3. Its
  association changes PP4 activity and subcellular organization rather than providing intrinsic phosphatase
  catalysis.
