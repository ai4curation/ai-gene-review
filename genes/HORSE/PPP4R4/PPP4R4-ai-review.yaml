id: A0A9L0S961
gene_symbol: PPP4R4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9796
  label: Equus caballus
description: >-
  PPP4R4 (protein phosphatase 4 regulatory subunit 4) is a noncatalytic HEAT/ARM-repeat
  protein with weak similarity to the scaffolding A subunit of PP2A. In human cells it binds
  the catalytic subunit of protein phosphatase 4 (PP4c) specifically, and not PP2Ac or PP6c,
  to form a stable cytosolic PP4c-PP4R4 heterodimer. This complex is separate from the
  PP4c-PP4R1 and PP4c-PP4R2-PP4R3 complexes, and PP4R4 does not bridge PP4c to those
  subunits. PP4c bound to PP4R4 dephosphorylates model substrates less actively than free
  PP4c, so PPP4R4 modulates PP4 rather than providing phosphatase catalysis itself. Its
  physiological substrates and cellular role are not known. Horse PPP4R4 is the ortholog of
  human PPP4R4 in PANTHER subfamily PTHR21467:SF0. The UniProt entry A0A9L0S961 is a
  865-residue alternative product of the horse gene. It matches the canonical horse product
  except for a short alternative C-terminus, and it keeps the HEAT repeats and the residues
  needed for PP4c binding.
existing_annotations:
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  supporting_entities:
  - UniProtKB-SubCell:SL-0086
  review:
    summary: >-
      Correct, but the evidence supports the more specific cytosol. The human ortholog was
      isolated as a stable cytosolic PP4c partner, and PAINT places cytosol at PTN001087371,
      the node that contains horse PPP4R4.
    action: MODIFY
    reason: >-
      This row comes from the UniProt SubCell mapping of an ARBA-predicted "Cytoplasm" line,
      so on its own it is a prediction. The claim is still sound for this protein, which
      sits in PTHR21467:SF0 with experimentally characterised human PPP4R4 (Q6NUP7). Human
      PPP4R4 was identified as a stable cytosolic PP4c partner (PMID:18715871). Later work
      describes PP4R1 and PP4R4 as the cytoplasmic PP4 regulatory subunits, unlike the
      nuclear PP4R2/PP4R3 (PMID:37605615). PAINT propagated GO:0005829 cytosol from node
      PTN001087371 to the canonical horse product A0A9L0S938. A0A9L0S961 differs from that
      product only in its last few residues, inside the disordered C-terminal tail. Cytosol
      (GO:0005829) is the specific location the evidence supports and is the location used
      in core_functions, so the general term is refined to it.
    proposed_replacement_terms:
    - id: GO:0005829
      label: cytosol
    supported_by:
    - reference_id: PMID:18715871
      supporting_text: "we identify \na novel, stable cytosolic PP4c interacting partner, KIAA1622, which\
        \ we have \nrenamed PP4R4."
    - reference_id: PMID:37605615
      supporting_text: PP4R2, PP4R3α, and PP4R3β are present in nuclei, while PP4R1 and PP4R4 are located
        in the cytoplasm
    - reference_id: file:HORSE/PPP4R4/PPP4R4-bioinformatics/RESULTS-rereview.md
      supporting_text: A0A9L0S961 and A0A9L0S938 are identical over residues 1-861. They differ only at
        the extreme C-terminus.
- term:
    id: GO:0019888
    label: protein phosphatase regulator activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  review:
    summary: >-
      Proposed. PAINT places protein phosphatase regulator activity at PTN001087371, which
      contains horse PPP4R4. The IBA reached the canonical horse entry A0A9L0S938 but not this
      alternative product of the same gene.
    action: NEW
    reason: >-
      Participation, not just necessity: PPP4R4 is the regulatory subunit itself and binds
      PP4c directly. The human ortholog forms a PP4c-PP4R4 complex whose activity on
      fluorogenic substrate and gammaH2AX differs from that of free PP4c (PMID:18715871). The
      PP4c-binding residues identified by mutagenesis (R501 and V618) are conserved at the same
      positions in A0A9L0S961. A PAINT curator placed GO:0019888 at PTN001087371, and horse
      PPP4R4 is a descendant (the IBA is on A0A9L0S938). This accession lacks the term only
      because the propagation went to the gene-centric canonical entry; there is no
      biological difference. The human IDA inhibitor-activity terms (GO:0004864, GO:0004865)
      were deliberately not propagated by PAINT. They rest on one comparative in-vitro
      activity measurement and are not added here.
    supported_by:
    - reference_id: PMID:18715871
      supporting_text: "PP4c.PP4R4 complexes exhibit phosphatase activity toward a \nfluorogenic substrate\
        \ and gammaH2AX, but this activity is lower than that \nassociated with the PP4c.PP4R2.PP4R3 complex,\
        \ which itself is less active than \nthe free PP4c catalytic subunit."
    - reference_id: file:HORSE/PPP4R4/PPP4R4-bioinformatics/RESULTS-rereview.md
      supporting_text: Both residues are conserved at the same positions in A0A9L0S961, with identical
        local context
- term:
    id: GO:0030289
    label: protein phosphatase 4 complex
  evidence_type: ISS
  original_reference_id: PMID:18715871
  qualifier: part_of
  review:
    summary: >-
      Proposed. PPP4R4 is a subunit of a PP4c-PP4R4 heterodimer, which by definition is a
      protein phosphatase 4 complex.
    action: NEW
    reason: >-
      GO:0030289 is defined as "a protein serine/threonine phosphatase complex formed by the
      catalytic subunit of protein phosphatase 4 plus one or more regulatory subunits". Its
      only parent is GO:0008287, the term that PAINT (PTN001087371) and the human IDA use for
      PPP4R4. The comparators in the same role, the other PP4 regulatory subunits PPP4R1,
      PPP4R2 and PPP4R3A and the catalytic subunit PPP4C, all carry GO:0030289 in human GOA.
      So the specific term is the convention for PP4 subunits. PPP4R4 has the generic parent
      only because its annotations predate any choice of the specific child; no curator
      argued against it. Human PPP4R4 binds PP4c specifically and does not bind PP2Ac or
      PP6c (PMID:18715871). The proteomic study of PPP holoenzymes treats PP4c-PP4R4 as one
      of the PP4 holoenzymes and measures its formation directly (PMID:34845248). Horse
      PPP4R4 shares subfamily PTHR21467:SF0 and the conserved PP4c-binding residues. If
      GO:0030289 is not accepted, the PAINT term GO:0008287 is the fallback.
    supported_by:
    - reference_id: PMID:18715871
      supporting_text: "PP4R4 displays weak sequence homology with the A (scaffolding) \nsubunit of the\
        \ PP2A holoenzyme and specifically associates with PP4c (and not \nwith the related PP2Ac or PP6c\
        \ phosphatases)."
    - reference_id: PMID:34845248
      supporting_text: PP4R2, PP4R3α, and PP4R4 were mostly unaffected by the reduction in methylation
    - reference_id: file:HORSE/PPP4R4/PPP4R4-bioinformatics/RESULTS-rereview.md
      supporting_text: Both residues are conserved at the same positions in A0A9L0S961, with identical
        local context
