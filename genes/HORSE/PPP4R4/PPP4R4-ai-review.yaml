core_functions:
- description: >-
    Noncatalytic regulatory subunit of protein phosphatase 4. It forms a stable cytosolic
    PP4c-PP4R4 heterodimer, separate from the other PP4 holoenzymes, and changes the
    activity of the bound catalytic subunit. Its physiological substrates are unknown.
  molecular_function:
