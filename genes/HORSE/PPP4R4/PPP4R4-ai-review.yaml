suggested_questions:
- question: >-
    Which physiological substrates does the cytosolic PP4c-PP4R4 complex dephosphorylate, and
    does PP4R4 act mainly to target substrates or to restrain PP4c activity?
- question: >-
    Should PPP4R4's GO:0008287 annotations (human IDA, PAINT PTN001087371) be refined to
    GO:0030289 protein phosphatase 4 complex, as is done for the other PP4 regulatory
    subunits?
suggested_experiments:
- description: >-
    Phosphoproteomics after PPP4R4 knockout, compared with PPP4C depletion, in a cell type
    that expresses PPP4R4, to identify substrates specific to the PP4c-PP4R4 complex.
  experiment_type: phosphoproteomics
