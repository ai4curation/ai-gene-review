id: A0A9L0S961
gene_symbol: PPP4R4
taxon:
  id: NCBITaxon:9796
  label: Equus caballus
status: COMPLETE
description: >-
  ProtNLM2 emitted three GO terms for the horse PPP4R4 alternative product A0A9L0S961. The
  molecular function (protein phosphatase regulator activity) and complex (protein
  serine/threonine phosphatase complex) predictions are correct, supported by the human
  PP4c-PP4R4 study and the PAINT node shared by horse PPP4R4, but both terms are already
  carried by IBA on the canonical horse product A0A9L0S938 of the same gene, so they are not
  novel. Blastocyst hatching rests only on a pooled RNAi screen of the mouse ortholog that
  scored a combined hatching and outgrowth defect; that necessity evidence does not show
  that PPP4R4 does any of the work of hatching, so the prediction is uncertain.
