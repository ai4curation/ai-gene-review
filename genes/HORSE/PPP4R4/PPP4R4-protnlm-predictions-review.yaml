predictions:
- source_method: ProtNLM2
  source_version: UniProt API snapshot 2026-09-08
  predicted_term:
    id: GO:0001835
    label: blastocyst hatching
  predicted_term_type: GO_BP
  review:
    assessment: UNC
    confidence_score: 1
    summary: >-
      The only experimental link between PPP4R4 and this process is a pooled RNAi screen in
      mouse zygotes, in which knockdown of the ortholog Ppp4r4 (same PANTHER subfamily
      PTHR21467:SF0) was one of 35 knockdowns scored as defective in a combined hatching and
      outgrowth assay. That is a single unreplicated screen result, it measures necessity rather
      than participation, and the authors themselves flag that Ppp4r4 is not expressed at the
      stages where it appears to be required. No mechanism connects the cytosolic PP4c-PP4R4
      complex, whose substrates are unknown, to zona escape. PubMed searches for PPP4R4 or
      KIAA1622 with embryo or blastocyst found no other study. Neither horse product carries the
      term in GOA, and the horse gene review does not address it. The prediction is neither
      supported nor refuted; a validated knockout or rescue phenotype with a traced mechanism
      would be needed.
    supported_by:
    - reference_id: PMID:27869233
      supporting_text: In this way, 35 genes (Supplementary Table S2) were identified as indispensable
        for normal hatching and outgrowth.
    - reference_id: PMID:27869233
      supporting_text: Akap3, Ankrd7, Fbll1, Ppp4r4, St8sia6 and Ube2a are not expressed in later stages
        but are required for successful OG
    - reference_id: PMID:18715871
      supporting_text: "we identify \na novel, stable cytosolic PP4c interacting partner, KIAA1622, which\
        \ we have \nrenamed PP4R4."
- source_method: ProtNLM2
  source_version: UniProt API snapshot 2026-09-08
  predicted_term:
    id: GO:0019888
    label: protein phosphatase regulator activity
  predicted_term_type: GO_MF
  review:
    assessment: CNN
    confidence_score: 2
    summary: >-
      Human PP4R4 is an experimentally isolated stable cytosolic partner of PP4c, and the
      PP4c-PP4R4 complex has lower phosphatase activity than free PP4c, which establishes a
      noncatalytic regulatory role. Horse PPP4R4 is in the same PANTHER subfamily
      (PTHR21467:SF0) and PAINT node, and A0A9L0S961 keeps the HEAT repeats and the PP4c-binding
      residues, so the transfer is justified. The term is the core molecular function in the horse
      gene review. It is not novel for the gene: the canonical horse product A0A9L0S938, which is
      identical to A0A9L0S961 except at the extreme C-terminus, already carries GO:0019888 by IBA.
    supported_by:
    - reference_id: PMID:18715871
      supporting_text: "PP4c.PP4R4 complexes exhibit phosphatase activity toward a \nfluorogenic substrate\
        \ and gammaH2AX, but this activity is lower than that \nassociated with the PP4c.PP4R2.PP4R3 complex,\
        \ which itself is less active than \nthe free PP4c catalytic subunit."
    - reference_id: file:HORSE/PPP4R4/PPP4R4-bioinformatics/RESULTS-rereview.md
      supporting_text: A0A9L0S961 and A0A9L0S938 are identical over residues 1-861. They differ only at
        the extreme C-terminus.
    - reference_id: file:HORSE/PPP4R4/PPP4R4-bioinformatics/RESULTS-rereview.md
      supporting_text: Both residues are conserved at the same positions in A0A9L0S961, with identical
        local context
- source_method: ProtNLM2
  source_version: UniProt API snapshot 2026-09-08
  predicted_term:
    id: GO:0008287
    label: protein serine/threonine phosphatase complex
  predicted_term_type: GO_CC
  review:
    assessment: CNN
    confidence_score: 2
    summary: >-
      Human PP4R4 binds PP4c specifically, and not PP2Ac or PP6c, in a stable cytosolic complex,
      so PPP4R4 is a subunit of a serine/threonine phosphatase complex; the transfer to horse rests
      on shared subfamily PTHR21467:SF0 and conserved PP4c-binding residues. The exact term is
      already carried by IBA on the canonical horse product A0A9L0S938 of the same gene, so the
      prediction is not novel. The horse gene review refines this complex to the more specific
      child GO:0030289 protein phosphatase 4 complex, but that refinement is a proposal rather
      than an existing annotation, so the prediction matches the existing term rather than being
      less precise than one.
    supported_by:
    - reference_id: PMID:18715871
      supporting_text: "PP4R4 displays weak sequence homology with the A (scaffolding) \nsubunit of the\
        \ PP2A holoenzyme and specifically associates with PP4c (and not \nwith the related PP2Ac or PP6c\
        \ phosphatases)."
    - reference_id: file:HORSE/PPP4R4/PPP4R4-bioinformatics/RESULTS-rereview.md
      supporting_text: A0A9L0S961 and A0A9L0S938 are identical over residues 1-861. They differ only at
        the extreme C-terminus.
    - reference_id: file:HORSE/PPP4R4/PPP4R4-bioinformatics/RESULTS-rereview.md
      supporting_text: Both residues are conserved at the same positions in A0A9L0S961, with identical
        local context
