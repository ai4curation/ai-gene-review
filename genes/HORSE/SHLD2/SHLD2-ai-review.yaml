- term:
    id: GO:0035861
    label: site of double-strand break
  evidence_type: ISO
  original_reference_id: file:HORSE/SHLD2/SHLD2-bioinformatics/RESULTS-rereview.md
  review:
    summary: >-
      Shieldin is recruited to double-strand-break sites through TP53BP1-RIF1 and
      the SHLD3-MAD2L2 module that binds the SHLD2 N-terminus. That N-terminus is
      intact in this horse model.
    action: NEW
