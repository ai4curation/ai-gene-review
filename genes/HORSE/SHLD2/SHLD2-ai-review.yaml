      PAINT places site of double-strand break on node PTN001025652 (seeded by
      human Q86V20), and horse A0A9L0TUF0 carries the IBA. The benchmark model
      keeps the human 1-60 region that is sufficient for SHLD3 and MAD2L2 binding.
      In human, an OB-fold point mutant and an OB-B splice variant still
