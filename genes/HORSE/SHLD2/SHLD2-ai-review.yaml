      supporting_text: the human 1-60 region that is sufficient for SHLD3 and MAD2L2 binding is present.
core_functions:
- description: >-
    Shieldin scaffold subunit recruited to nuclear double-strand-break sites, where
    the SHLD2 OB-fold region binds single-stranded DNA ends to restrain resection and
    favour non-homologous end joining. The function is transferred from human SHLD2
    through shared PTHR14495:SF2 membership and PAINT node PTN001025652. For this
    alternative horse model only the recruitment and SHLD3-MAD2L2-binding module is
    intact; OB fold C and the distal SHLD1-binding region are truncated, so whether
    this product can protect DNA ends is unknown.
  molecular_function:
    id: GO:0030674
    label: protein-macromolecule adaptor activity
  locations:
  - id: GO:0035861
    label: site of double-strand break
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: file:human/SHLD2/SHLD2-uniprot.txt
    supporting_text: SHLD2 forms a scaffold which interacts with a SHLD3-MAD2L2
  - reference_id: PMID:30022168
    supporting_text: Shieldin localizes to double-strand-break sites in a 53BP1- and RIF1-dependent
      manner, and its SHLD2 subunit binds to single-stranded DNA via OB-fold domains that
      are analogous to those of RPA1 and POT1.
  - reference_id: file:HORSE/SHLD2/SHLD2-bioinformatics/RESULTS-rereview.md
    supporting_text: The truncated OB fold C means the
      model cannot be assumed to keep the ssDNA-binding and SHLD1-binding functions that
      human end-protection requires.
knowledge_gaps:
- gap_statement: >-
    It is not known whether the horse SHLD2 transcript encoding A0A9L0RGD6, with its
    divergent C-terminal tail and truncated OB fold C, is expressed, and whether its
    product binds SHLD1 and single-stranded DNA or acts as a recruitment-competent but
    end-protection-defective shieldin subunit.
  boundary: >-
    Established: the model keeps the SHLD3-MAD2L2-binding N-terminus, OB folds A and B
    and the zinc-ribbon cysteines; human OB-fold mutants still localize to breaks and
    assemble with shieldin but fail to suppress homologous recombination. Unknown: any
    equine transcript or protein evidence for this 3' end, and its activity.
  gap_kind:
  - BIOLOGY
  provenance:
  - reference_id: file:HORSE/SHLD2/SHLD2-bioinformatics/RESULTS-rereview.md
    supporting_text: no transcript evidence was examined.
suggested_questions:
- question: Is the divergent, gapped C-terminus of the selected 883-residue horse model (A0A9L0RGD6)
    the real equine SHLD2 terminus, or a gene-model artefact? Human SHLD2 binds SHLD1 through
    its C-terminus, so the answer decides whether this protein form can complete a shieldin
    complex at all.
  experts: []
- question: Does horse SHLD2 use an insertion-containing (human isoform-2-like) OB-fold
    architecture as its dominant form, and do the three OB folds retain the single-stranded
    DNA-contacting residues whose mutation abolishes human end protection?
  experts: []
suggested_experiments:
- hypothesis: The selected horse SHLD2 protein form retains shieldin-complex assembly and
    damage-site recruitment but, like the human short and OB-mutant forms, cannot suppress
    homologous recombination.
  description: Express the selected 883-residue horse SHLD2 sequence (and a transcript-verified
    equine C-terminal variant, if different) in human SHLD2-knockout cells; score ionizing-radiation-induced
    focus colocalization with TP53BP1, co-immunoprecipitation of SHLD1/SHLD3/MAD2L2, RAD51
    focus suppression and olaparib sensitivity in a BRCA1-deficient background. The human
    assays separating recruitment and assembly from resection control (PMID:30022168) provide
    the readout and the positive/negative controls.
  experiment_type: cross-species complementation with separation-of-function readouts
- hypothesis: The equine SHLD2 locus produces a transcript whose 3-prime end differs from
    the Ensembl-derived protein model used here.
  description: Long-read (Iso-Seq or targeted nanopore) sequencing of SHLD2 transcripts from
    horse tissues with active V(D)J and class-switch recombination (lymph node, spleen), followed
    by reannotation of the C-terminal exons and re-running the paired human-horse alignment
    on the corrected sequence.
  experiment_type: full-length transcript sequencing / gene-model validation
- hypothesis: Horse SHLD2 OB folds bind single-stranded DNA with the affinity and 3-prime-overhang
    preference of the human protein.
  description: Purify the recombinant horse OB-fold region and the equivalent human SHLD2
    fragment in parallel and compare binding to single-stranded and 3-prime-overhang DNA substrates
    by electrophoretic mobility shift and fluorescence anisotropy, including the horse equivalent
    of the human m1 mutant as a negative control.
  experiment_type: in vitro nucleic-acid binding assay
