    summary: >-
      Nuclear localization is a family-wide property placed by PAINT on node
      PTN001025652 of PTHR14495 and annotated on the canonical horse product
      A0A9L0TUF0, but not on this alternative model, which has no GO annotation.
    action: NEW
    reason: >-
      A0A9L0RGD6 is a product of the same horse SHLD2 gene (Ensembl
      ENSECAG00000001626), sits in the single SHLD2 subfamily PTHR14495:SF2 and
      descends from PAINT node PTN001025652, whose IBD assigns nucleus. Human
      SHLD2 is nuclear by experiment. In human, damage-site recruitment does not
      need an intact OB-fold region, so the truncated C-terminus of this model is
      no argument against the location.
    supported_by:
