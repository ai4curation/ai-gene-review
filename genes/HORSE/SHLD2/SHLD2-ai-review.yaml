id: A0A9L0RGD6
gene_symbol: SHLD2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9796
  label: Equus caballus
description: >-
  SHLD2 (shieldin complex subunit 2, formerly FAM35A) is the scaffold subunit of
  shieldin, the SHLD1-SHLD2-SHLD3-MAD2L2 complex that acts downstream of TP53BP1
  and RIF1 at DNA double-strand breaks. In characterized mammalian SHLD2 the
  N-terminus binds the SHLD3-MAD2L2 subcomplex, while a C-terminal region with
  three OB folds and a zinc ribbon binds SHLD1 and single-stranded DNA; this
  DNA-end binding limits end resection, suppresses homologous recombination and
  favours non-homologous end joining in the nucleus. A0A9L0RGD6 is one of seven
  Ensembl transcript models of the horse SHLD2 gene and is not the canonical
  product. It keeps the N-terminal SHLD3-MAD2L2-binding region, OB folds A and B
  (including the long-form OB-B exon) and the zinc-ribbon cysteines of OB fold C,
  but its last ~70 residues are a divergent arginine/glycine/proline-rich tail in
  place of the remainder of OB fold C and the distal SHLD1-binding region.
