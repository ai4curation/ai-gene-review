- id: file:HORSE/SHLD2/SHLD2-bioinformatics/RESULTS.md
  title: 'SHLD2: horse-human sequence comparison'
  findings:
  - statement: The selected horse sequence is clearly orthologous to human SHLD2 over most
      of its length (70.2% identity, 792 paired residues).
    supporting_text: The downloaded human Q86V20 sequence (835 residues) and selected horse
      A0A9L0RGD6 sequence (883 residues) share 70.2% identity among 792 paired residues.
    reference_section_type: RESULTS
  - statement: The selected horse model retains the inserted OB-fold segment and aligns
      strongly through most of human isoform 2, but its distal C-terminus then becomes
      divergent and gapped. That divergent tail lies within the broad SHLD2C DNA-binding
      module, but the cached mapping does not localize the SHLD1 contact surface inside it.
    supporting_text: >-
      The selected horse sequence retains the inserted OB-fold segment, with strong
      alignment through human isoform-2 residue 798. Beyond that point the horse C-terminus
      is substantially divergent and gapped.
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Reproducible local alignment with retained output and sequence hashes; computed,
      not hardcoded. Establishes orthology and the specific C-terminal limitation, not function.
- id: file:human/SHLD2/SHLD2-uniprot.txt
  title: 'UniProtKB Q86V20: human SHLD2 (curated reference ortholog)'
  findings:
  - statement: Human SHLD2 is the scaffold subunit of shieldin, which acts downstream of TP53BP1
      to promote non-homologous end joining and suppress DNA end resection.
    supporting_text: functions downstream of TP53BP1 to promote non-homologous end joining
    reference_section_type: DATABASE_ENTRY
  - statement: Within shieldin, SHLD2 bridges the SHLD3-MAD2L2 subcomplex through its N-terminus
      and SHLD1 through its C-terminus, the bipartite architecture that makes the divergent
      horse C-terminus consequential.
    supporting_text: subcomplex via its N-terminus, and with SHLD1 via its C-terminus
    reference_section_type: DATABASE_ENTRY
  - statement: Human SHLD2 is nuclear and chromosome-associated, forming nuclear foci after
      DNA damage.
    supporting_text: 'SUBCELLULAR LOCATION: Nucleus {ECO:0000269|PubMed:29656893,'
    reference_section_type: DATABASE_ENTRY
  - statement: The human 1-60 region is sufficient for SHLD3 and MAD2L2 binding, and the
      region mediating SHLD1 binding spans 652-822 of the 835-residue product.
    supporting_text: /note="Mediates interaction with SHLD1"
    reference_section_type: DATABASE_ENTRY
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Curated Swiss-Prot record for the human ortholog, with experimental ECO
      codes. Used here as the source of characterized mammalian biology being considered for
      transfer, not as evidence about the horse protein.
- id: PMID:34354233
  title: ASTE1 promotes shieldin-complex-mediated DNA repair by attenuating end resection.
  full_text_unavailable: true
  findings:
  - statement: End protection by shieldin is executed specifically by the SHLD2 OB folds binding
      single-stranded DNA ends, which is why OB-fold integrity is the decisive question for
      any SHLD2 protein model.
    supporting_text: The SHLD2 subunit binds to single-stranded DNA ends and blocks end
      resection through OB-fold domains.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only in the local cache; cited for its framing statement about
      SHLD2 OB-fold-mediated end-resection blocking, not for the ASTE1 results. Human cell
      work.
- id: PMID:30022168
  title: The shieldin complex mediates 53BP1-dependent DNA repair.
  full_text_unavailable: false
  findings:
  - statement: Shieldin localizes to double-strand-break sites downstream of 53BP1 and RIF1,
      and SHLD2 binds single-stranded DNA through OB folds analogous to those of RPA1 and
      POT1.
    supporting_text: Shieldin localizes to double-strand-break sites in a 53BP1- and RIF1-dependent
      manner, and its SHLD2 subunit binds to single-stranded DNA via OB-fold domains that
      are analogous to those of RPA1 and POT1.
    reference_section_type: ABSTRACT
  - statement: Damage-site recruitment and shieldin assembly are separable from end protection,
      because the short splice form and an OB-fold point mutant both localize to breaks and
      assemble with the complex yet fail to suppress homologous recombination. Conserved localization
      therefore cannot establish repair-pathway control for a divergent SHLD2 protein form.
    supporting_text: Importantly, both mutants localized to DSB sites (ED Fig 10cd) and interacted
      with the other members of the Shieldin complex (ED Fig 10e). Therefore, the SHLD2-m1
      and SHLD2S mutants are defective in suppressing HR.
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text cached. The separation-of-function experiment shows that recruitment and
      complex assembly alone do not prove end protection, which is why the divergent distal
      tail still needs transcript or structural checking. The completed prediction review
      argues that the conserved OB1/OB2 module and recruitment segment are sufficient for
      GO:2001034 and GO:2000042 transfer while the likely OB3 lesion remains unresolved.
- id: file:HORSE/SHLD2/SHLD2-bioinformatics/RESULTS-rereview.md
  title: 'SHLD2 (horse) re-review: all equine protein models vs human SHLD2'
  findings:
  - statement: A0A9L0RGD6 is a non-canonical Ensembl transcript model of horse SHLD2; the
      Ensembl canonical product is A0A9L0TUF0 (1047 aa), which carries the gene's GO annotations.
    supporting_text: The benchmark accession A0A9L0RGD6 is ENSECAT00000102809
    reference_section_type: RESULTS
  - statement: The benchmark model keeps the SHLD3-MAD2L2-binding N-terminus, the long-form
      OB-B exon and the OB-C zinc-ribbon cysteines, but diverges after horse residue ~811,
      losing the equivalent of human iso-1 residues 731-835.
    supporting_text: The benchmark model therefore lacks the equivalent of the last ~105
      residues of human SHLD2 (iso-1 731-835)
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Reproducible re-review analysis (compare_isoforms_rereview.py, output in
      compare_isoforms_rereview.json). Computed from UniProt sequences and an Ensembl REST lookup;
      establishes gene-model identity and domain retention, not function.
- id: file:interpro/panther/PTHR14495/PTHR14495-paint.tsv
  title: PAINT annotations for PTHR14495
  findings:
  - statement: PAINT node PTN001025652 (taxon Eumetazoa) carries IBD assertions of nucleus,
      site of double-strand break and regulation of double-strand break repair via homologous
      recombination, each seeded by human Q86V20. The more specific human experimental terms
