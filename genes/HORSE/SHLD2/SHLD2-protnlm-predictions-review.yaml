- source_method: ProtNLM2
  source_version: UniProt API snapshot 2026-09-08
  predicted_term:
    id: GO:2001034
    label: positive regulation of double-strand break repair via nonhomologous end joining
  predicted_term_type: GO_BP
  review:
    assessment: COR
    confidence_score: 2
    summary: Mammalian SHLD2 experiments support this repair-process role, and the OpenScientist audit
      resolved the selected horse sequence as a justified orthology transfer. A likely C-terminal frameshift
      corrupts OB3, but it leaves the conserved SHLD3/REV7 recruitment segment and the OB1/OB2
      ssDNA-binding execution module intact, so the horse model retains the apparatus that restricts
      DNA end resection and promotes NHEJ. This is a homology-based ISS/IBA transfer, not direct horse
      evidence.
    supported_by:
