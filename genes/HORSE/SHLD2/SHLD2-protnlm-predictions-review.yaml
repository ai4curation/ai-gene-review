    summary: 'Shieldin loss impairs class-switch recombination in mammalian B cells, and the horse SHLD2
      gene carries this term (IEA ortholog transfer) on its canonical product A0A9L0TUF0. SHLD2 contributes
      to CSR through NHEJ-promoting end protection by shieldin, which uses the N-terminal SHLD3-REV7
      recruitment segment and the C-terminal SHLD2-SHLD1 OB-fold ssDNA-binding module. A0A9L0RGD6 keeps
      the recruitment segment, OB folds A and B and the OB-fold-C zinc ribbon, but has a truncated OB fold
      C (Pfam SHLD2 C-terminal match 733-804, 72 residues, against 772-935, 164 residues, in the canonical
      model) and lacks the distal half of the SHLD1-interacting region. No experiment shows that this
      truncation abolishes end protection or CSR, and no horse B-cell or CSR evidence exists. The missing
      segment does not fully account for the gene''s role in CSR, and no evidence refutes the term for
      this product, so the call is uncertain.'
