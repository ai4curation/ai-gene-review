description: A0A9L0RGD6 is a non-canonical 883-residue Ensembl model of horse SHLD2; GOA places the gene's
  annotations on the canonical product A0A9L0TUF0. Scored for this exact product, it keeps the N-terminal
  SHLD3-MAD2L2 recruitment segment, OB folds A and B and the OB-fold-C zinc ribbon, but its Pfam SHLD2
  C-terminal (OB fold C) match covers 72 residues against 164 in the canonical model, and it lacks the distal
  half of the SHLD1-interacting region. Nuclear (nucleoplasm) and double-strand-break-site localization depend
  only on the retained recruitment module and are correct but not novel. The NHEJ-promotion, anti-HR and
  isotype-switching process terms depend on the OB-fold ssDNA-binding module, which this product keeps only
  in part; no experiment has tested this C-terminal truncation, so these terms are uncertain. The
  actin-cytoskeleton location rests only on a secondary human HPA signal and is unresolved.
