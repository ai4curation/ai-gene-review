- source_method: ProtNLM2
  source_version: UniProt API snapshot 2026-09-08
  predicted_term:
    id: GO:0015629
    label: actin cytoskeleton
  predicted_term_type: GO_CC
  review:
    assessment: UNC
    confidence_score: 1
    summary: HPA reports an additional actin-filament pool of human SHLD2 with supported antibody-based
      reliability, so this prediction is not contradicted merely by SHLD2 being a nuclear repair protein.
      However, the secondary localization is cell-line dependent and its targeting mechanism is uncharacterized;
      family membership and global sequence identity do not establish conservation of this particular
      pool in the selected horse isoform. The main nuclear localization has substantially stronger mechanistic
      support. A conserved targeting determinant or independent localization evidence is needed to resolve
      this exact transfer.
    supported_by:
    - &id002
      reference_id: file:human/SHLD2/SHLD2-hpa.xml
      supporting_text: Mainly localized to the nucleoplasm. In addition localized to the actin filaments.
    - *id001
