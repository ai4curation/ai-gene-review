    label: site of double-strand break
  predicted_term_type: GO_CC
  review:
    assessment: COR
    confidence_score: 2
    summary: The selected horse protein belongs to the SHLD2 family and retains its OB-fold architecture;
      its alignment with human SHLD2 covers 94.9% of the human sequence with 70.2% identity among paired
      residues. Human SHLD2 recruitment to double-strand breaks and conserved shieldin domains support
      this location in horse. This is a supported transfer new relative to the frozen horse GOA, not a
      claim that the model training set lacked mammalian SHLD2 annotations.
