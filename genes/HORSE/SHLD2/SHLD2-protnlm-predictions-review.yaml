    summary: 'The horse SHLD2 gene carries this term on its canonical product A0A9L0TUF0; whether this
      product carries it is unresolved. Human SHLD2 suppresses HR by blocking end resection through
      ssDNA binding by the C-terminal SHLD2-SHLD1 OB-fold module (SHLD2C). OB-fold mutant m1 and the SHLD2S
      variant disrupting OB fold B localize to DSBs and assemble shieldin yet fail to suppress HR, so
      recruitment alone is not enough. A0A9L0RGD6 keeps the recruitment segment, OB folds A and B and
      the OB-fold-C zinc ribbon; its Pfam SHLD2 C-terminal match spans only 733-804 (72 residues) against
      772-935 (164 residues) in the canonical model, and it lacks the distal half of the human
      SHLD1-interacting region, which is replaced by an unrelated Arg/Gly/Pro-rich tail. The tested human
      mutations differ from this C-terminal truncation, and whether the partial module still binds ssDNA
      or SHLD1 has not been measured. The anti-HR mechanism therefore depends on a module this product
      keeps only in part, and loss of the function is neither shown nor excluded, so the call is uncertain.'
