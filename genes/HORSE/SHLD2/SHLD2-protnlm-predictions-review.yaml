  predicted_term:
    id: GO:2001034
    label: positive regulation of double-strand break repair via nonhomologous end joining
  predicted_term_type: GO_BP
  review:
    assessment: UNC
    confidence_score: 1
    summary: 'The horse SHLD2 gene carries this term on its canonical product A0A9L0TUF0; whether this
      product carries it is unresolved. Human SHLD2 promotes NHEJ as part of shieldin: its N-terminus
      binds SHLD3-REV7 for recruitment, and its C-terminal OB-fold module (SHLD2C) binds single-stranded
      DNA with SHLD1 to protect ends. A0A9L0RGD6 keeps the recruitment segment, OB folds A and B and the
      four zinc-ribbon cysteines of OB fold C, but conservation ends after horse residue ~811: its Pfam
      SHLD2 C-terminal match spans 733-804 (72 residues) against 772-935 (164 residues) in the canonical
      model, and it lacks the equivalent of human iso-1 731-835, the distal half of the SHLD1-interacting
      region (652-822). Human OB-fold point mutant m1 and the SHLD2S variant disrupting OB fold B still
      reach DSBs and assemble shieldin but fail to suppress HR, so the module is required. Neither
      mutation corresponds to this C-terminal truncation, and no experiment has tested whether a SHLD2
      that keeps OB folds A, B and the zinc ribbon binds ssDNA or SHLD1. The missing segment is part of
      the required module, but its loss is not shown to abolish the function, and the retained recruitment
      and partial SHLD1-binding regions could still contribute. Neither positive refutation nor a fully
      accounted mechanism applies, so the call is uncertain.'
