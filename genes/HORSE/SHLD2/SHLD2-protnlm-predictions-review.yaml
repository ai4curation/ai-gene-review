- source_method: ProtNLM2
  source_version: UniProt API snapshot 2026-09-08
  predicted_term:
    id: GO:2001034
    label: positive regulation of double-strand break repair via nonhomologous end joining
  predicted_term_type: GO_BP
  review:
    assessment: UNC
    confidence_score: 1
    summary: Mammalian SHLD2 experiments support this repair-process role at the gene level. However,
      the selected horse sequence retains the long-form OB insertion but has a markedly divergent C-terminus
      after the region corresponding to human isoform-2 residue 798. The primary human study demonstrates
      that SHLD2 variants can retain DSB recruitment and complex association while losing suppression
      of homologous recombination. Thus family identity and nuclear localization are insufficient to establish
      an intact end-protection module in this model. An isoform/gene-model or structural check is needed
      before transferring the repair-process claim to this exact sequence.
    supported_by:
