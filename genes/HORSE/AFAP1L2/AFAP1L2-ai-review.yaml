- term:
    id: GO:0036312
    label: phosphatidylinositol 3-kinase regulatory subunit binding
  evidence_type: ISS
  original_reference_id: PMID:19060924
  qualifier: enables
  review:
    action: NEW
    summary: Tyrosine-phosphorylated AFAP1L2 docks the SH2 domains of the PI3K p85 regulatory subunit,
      linking Src/RET activity to PI3K-Akt signalling.
    reason: In human cells RET/PTC phosphorylates XB130 Tyr54, which is a critical binding site for the
      p85alpha SH2 domains, and XB130 knockdown lowers Akt activity (PMID:19060924). The rat ortholog PI3KAP
      associates with p85 and with PI3K activity in a Src-dependent manner, and a Y72F mutant that cannot
      bind p85 fails to enhance IGF-I-induced DNA synthesis (PMID:22496359). Both proteins are in the AFAP1L2
      subfamily (PTHR14338:SF4) with the horse model; horse Tyr65 is the conserved equivalent of human Tyr54.
      This is the adaptor's informative binding activity; no GO annotation currently records it in any
      species, so this is a curation gap rather than a PAINT omission of an existing experimental term.
      Evidence is ISS from the human and rat experimental work.
    supported_by:
    - reference_id: PMID:19060924
      supporting_text: We identified tyrosine 54 of XB130 as the major target of RET/PTC-mediated phosphorylation
        and a critical binding site for the SH2 domains of p85alpha.
    - reference_id: PMID:22496359
      supporting_text: a mutant Y72F incapable of binding to p85 PI3K did not show this response
    - reference_id: file:HORSE/AFAP1L2/AFAP1L2-bioinformatics/RESULTS-rereview.md
      supporting_text: '| Tyr54 (p85 SH2-binding phosphosite) | 65-65 | 1/1 | 1/1 |'
- term:
    id: GO:0051015
    label: actin filament binding
  evidence_type: ISS
  original_reference_id: PMID:27462298
  qualifier: enables
  review:
    action: NEW
    summary: The C-terminal segment of AFAP1L2 binds actin filaments directly, and the full-length multimeric
      protein crosslinks F-actin in vitro.
    reason: Recombinant mouse PI3KAP/XB130 fragments containing residues 830-840 co-sedimented with actin
      filaments, and full-length protein crosslinked F-actin in a manner requiring the N-terminal multimerizing
      region and this C-terminal actin-binding region (PMID:27462298). The authors note the segment is
      conserved across vertebrate orthologs. Human XB130 likewise requires its C-terminal 63 residues to
      reach lamellipodial F-actin (PMID:21084565). Mouse Q5DTU0 and horse A0A9L0RQI4 are both in PTHR14338:SF4;
      the horse C-terminal 63-residue segment pairs fully with human (57/63 identical) and ends in the same
      terminal residues. This activity is direct biochemistry of the ortholog, transferred as ISS.
    supported_by:
    - reference_id: PMID:27462298
      supporting_text: These results indicated that PI3KAP/XB130 bound to actin filaments through amino
        acid residues 830–840 and that this region needed to be intact.
    - reference_id: PMID:27462298
      supporting_text: These results indicated that PI3KAP/XB130 could crosslink actin filaments in vitro.
    - reference_id: file:HORSE/AFAP1L2/AFAP1L2-bioinformatics/RESULTS-rereview.md
      supporting_text: '| C-terminal 63 aa (756-818) | 788-850 | 63/63 | 57/63 |'
- term:
    id: GO:0030027
    label: lamellipodium
  evidence_type: ISS
  original_reference_id: PMID:21084565
  qualifier: located_in
  review:
    action: NEW
    summary: On stimuli that induce lamellipodia, AFAP1L2 translocates to the branched F-actin meshwork
      of the lamellipodium.
    reason: Human XB130 (same PANTHER subfamily PTHR14338:SF4 as the horse model) moves to the cell periphery
      after EGF, wounding or active Rac and localizes to lamellipodial F-actin; the N-terminal 167 residues
      and C-terminal 63 residues are required, while the PH domains are dispensable (PMID:21084565). Both
      required regions are fully present in the horse model. This is a stimulus-dependent location of the
      protein itself, distinct from the cytosolic pool, and is not a downstream phenotype.
    supported_by:
    - reference_id: PMID:21084565
      supporting_text: In stimulated cells, XB130 localized to the lamellipodial F-actin meshwork.
    - reference_id: PMID:21084565
      supporting_text: both the XB130 N-terminus (167 amino acids) and C-terminus (63 amino acids) harbor
        crucial regions for its translocation to lamellipodia
    - reference_id: file:HORSE/AFAP1L2/AFAP1L2-bioinformatics/RESULTS-rereview.md
      supporting_text: '| C-terminal 63 aa (756-818) | 788-850 | 63/63 | 57/63 |'
