suggested_questions:
- question: Which of the ten horse AFAP1L2 TrEMBL transcript models is the principal product, and is the
    20-residue coiled-coil insertion and alternative N-terminal exon of A0A9L0RQI4 expressed in horse thyroid?
- question: Should the GO record for AFAP1L2 orthologs capture the p85-binding adaptor activity (PI3K regulatory
    subunit binding) and actin filament binding, which are experimentally shown in human and rodent but
    currently unannotated in any species?
