  label: Equus caballus
description: AFAP1L2 is a conserved cytoplasmic signaling adaptor with an AFAP-family architecture. Its
  horse sequence retains the full span of the human protein, supporting a conserved role in organizing
  Src-related signaling and kinase activation. Downstream effects on transcription, proliferation and
  cytokine production are inferred from characterized mammalian epithelial-cell systems and depend on
  signaling context.
