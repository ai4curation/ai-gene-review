  review:
    action: ACCEPT
    summary: AFAP1L2 is a cytoplasmic protein, partitioning between the cytosol and cortical/lamellipodial
      F-actin; cytoplasm is the right level to cover both pools.
    reason: Human XB130 is cytoplasmic by immunofluorescence (PMID:17412687, the experimental basis of the
      human UniProt subcellular-location statement) and is described as a cytosolic adaptor that translocates
      to lamellipodial F-actin on stimulation (PMID:21084565); the mouse ortholog localizes to actin stress
      fibres and is diffuse in the cytosol when the actin-binding region is deleted (PMID:27462298). The horse
      model sits in the same PANTHER subfamily (PTHR14338:SF4) as human and mouse AFAP1L2 and retains all
      characterized regions, including the C-terminal actin-binding segment (file:HORSE/AFAP1L2/AFAP1L2-bioinformatics/RESULTS-rereview.md).
      The ARBA-derived horse UniProt statement is not itself used as evidence. The more specific cytosol term
      from the PAINT node is carried in GOA by another horse AFAP1L2 product (A0A3Q2HBW2) and is recorded in
      core_functions; cytoplasm remains accurate for the actin-associated pool as well, so it is kept rather
      than refined.
    supported_by:
