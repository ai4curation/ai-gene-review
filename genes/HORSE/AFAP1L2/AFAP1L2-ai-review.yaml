taxon:
  id: NCBITaxon:9796
  label: Equus caballus
description: AFAP1L2 (XB130, PI3KAP) is a cytoplasmic adaptor and scaffold protein of the AFAP family,
  built from an N-terminal region carrying SH2- and SH3-binding motifs, two pleckstrin homology domains,
  a coiled-coil region and a short C-terminal actin-binding segment. It binds the Src tyrosine kinase and
  enhances its activity, and once tyrosine-phosphorylated by Src or RET it docks the SH2 domains of the
  p85 regulatory subunit of phosphatidylinositol 3-kinase, coupling tyrosine kinase signals to PI3K-Akt
  signalling, cell-cycle progression and survival. Through its C-terminal segment it binds and crosslinks
  actin filaments and is recruited to lamellipodial F-actin, where it supports cell spreading and motility.
  In mammals it is most abundant in thyroid epithelium. The horse product is an Ensembl-predicted transcript
  model of the AFAP1L2 gene that retains every characterized human domain and motif.
