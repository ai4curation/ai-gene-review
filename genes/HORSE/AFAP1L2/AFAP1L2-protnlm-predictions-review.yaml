  review:
    assessment: NPI
    confidence_score: 0
    error_type: CURATION_MISTAKE
    summary: >-
      The term is carried in GOA on the horse AFAP1L2 product A0A3Q2HBW2 (IBA from PTN002682769 and Compara
      IEA), both seeded by the human IDA from Xu et al. 2007, so it is not novel; the issue is correctness.
      The underlying experiment shows only that XB130 enhances Src-dependent SRE/AP-1 reporter activity.
      AFAP1L2 is a cytoplasmic adaptor with no DNA-binding domain or nuclear role, and the reporter gain is
      a distal readout of its Src-activating activity. The human gene review marks both the IDA and IBA rows
      over-annotated on these grounds, which equally refute the prediction for the horse ortholog. The
      adaptor's real contribution is captured by protein tyrosine kinase activator activity.
    supported_by:
