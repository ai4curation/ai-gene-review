      these grounds. In vivo, Xb130 knockout mice show enhanced, not reduced, LPS-induced cytokine
      production and lung injury, and more inflammatory skin injury after TPA, so the cell-line result does
      not generalize to a pro-inflammatory role. The prediction propagates an over-broad annotation.
