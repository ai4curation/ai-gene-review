description: >-
  ProtNLM2 emitted nine GO terms for the horse AFAP1L2 transcript model A0A9L0RQI4, a PANTHER
  PTHR14338:SF4 member that retains every characterized human XB130 region. All nine terms are already
  carried in GOA by another product of the horse AFAP1L2 gene (A0A3Q2HBW2), by PAINT IBA from node
  PTN002682769 and/or Ensembl Compara ortholog transfer from human Q8N4X5, so none is novel. Seven are
  supported by human and rodent XB130 experiments within the same 1:1 ortholog subfamily (CNN): protein
  tyrosine kinase activator activity, SH2 and SH3 domain binding, regulation of the mitotic cell cycle,
  regulation of IL-6 production, positive regulation of IL-8 production and positive regulation of EGFR
  signaling. Two are over-broad readings of downstream signaling outputs of a cytoplasmic adaptor
  (NPI): positive regulation of DNA-templated transcription and inflammatory response; mouse knockout
  studies further show that XB130 loss enhances, rather than reduces, in vivo inflammatory injury.
