- term:
    id: GO:0032797
    label: SMN complex
  evidence_type: ISS
  original_reference_id: PMID:12065586
  qualifier: part_of
  review:
    summary: GEMIN7 is an integral, central subunit of the SMN complex (SMN, GEMIN2-8, UNRIP), the
      complex whose definition names Gemin2-8 explicitly.
    action: NEW
    reason: The GO:0032797 definition lists Gemin2-8 and Unrip as integral components. Human GEMIN7
      was identified in purified native SMN complexes, interacts directly with SMN, and with SMN and
      GEMIN8 forms the central building block onto which other subunits assemble. Horse GEMIN7 is a
      full-length ortholog in the same single PANTHER subfamily (88.5% identity), with the
      N-terminal SMN-binding region conserved. This is a cellular component assertion, so the
      process-participation bar does not apply; the term replaces the over-general
      Sm-like protein family complex IBA.
    supported_by:
    - reference_id: PMID:12065586
      supporting_text: Binding experiments show that Gemin7 interacts directly with SMN and Gemin6
        and mediates the association of Gemin6 with the SMN complex
    - reference_id: PMID:17178713
