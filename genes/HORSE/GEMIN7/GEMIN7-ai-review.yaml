  review:
    summary: GEMIN7 is a subunit of the SMN snRNP-assembly machine and contributes to recruiting Sm
      proteins during Sm-core assembly. The IBA from node PTN001027441 (donors human GEMIN7 and
      S. pombe gem7) covers the horse protein, which sits in the same and only subfamily
      (PTHR14679:SF1) as both donors.
    action: ACCEPT
    reason: Human GEMIN7 knockdown reduces snRNP assembly activity and Sm protein (SmE) loading on
      the SMN complex, and the GEMIN6/GEMIN7/GEMIN8/UNRIP module is required for Sm protein
      recruitment to the assembly pathway. This is participation, not mere necessity, because the
      GEMIN6-GEMIN7 Sm-like heterodimer binds Sm proteins and is exchanged for the SmD3-SmB pair as
      the Sm core forms, so GEMIN7 is part of the assembly machinery that does the work. The PAINT
      node is placed at the base of a single-subfamily family that includes yeast and human
      members, and horse is inside it with an end-to-end 88.5% identical sequence.
    supported_by:
    - reference_id: PMID:19321448
      supporting_text: Gemin7 knockdown revealed a decrease in snRNP assembly activity and a decrease
        in SmE protein, a component of snRNP, in the SMN complex
    - reference_id: PMID:17023415
      supporting_text: the involvement of the heteromeric subunit containing Gemin6, Gemin7, Gemin8,
        and Unrip in the recruitment of Sm proteins to the snRNP assembly pathway
    - reference_id: file:HORSE/GEMIN7/GEMIN7-uniprot.txt
      supporting_text: DR   PANTHER; PTHR14679:SF1; GEM-ASSOCIATED PROTEIN 7; 1.
