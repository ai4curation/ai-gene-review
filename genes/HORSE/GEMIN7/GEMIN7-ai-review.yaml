gene_symbol: GEMIN7
product_type: PROTEIN
status: IN_PROGRESS
taxon:
  id: NCBITaxon:9796
  label: Equus caballus
description: GEMIN7 (gem-associated protein 7) is a small (131 aa) subunit of the SMN complex, the
  cytoplasmic machine that loads the seven Sm proteins onto small nuclear RNAs to build the Sm core
  of spliceosomal snRNPs. It has an N-terminal Arg/Gly-containing, partly disordered segment that
  binds SMN and a C-terminal Sm-like fold through which it forms a heterodimer with GEMIN6. Together
  with GEMIN8 and STRAP/UNRIP, the GEMIN6-GEMIN7 heterodimer forms a peripheral module tethered to
  SMN through GEMIN8 and GEMIN7; this module binds Sm proteins (notably SmE) and is thought to act as
  a placeholder for an Sm protein pair during assembly of the Sm core, before being displaced from
  the maturing snRNP. GEMIN7 is found with SMN in the cytoplasm, in the nucleoplasm and in nuclear
  gems. The horse protein is a full-length ortholog of human GEMIN7 (88.5% identity, identical
  length, same PANTHER subfamily).
