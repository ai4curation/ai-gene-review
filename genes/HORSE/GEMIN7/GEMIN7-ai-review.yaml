- term:
    id: GO:0003723
    label: RNA binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - InterPro:IPR047575
  - UniRule:UR001714480
  review:
    summary: Electronic transfer from the generic Sm domain signature (IPR047575). GEMIN7 has an
      Sm-like fold but there is no evidence that it binds RNA; its Sm fold mediates protein-protein
      contacts with GEMIN6 and Sm proteins.
    action: MARK_AS_OVER_ANNOTATED
    reason: The Sm-domain-to-RNA-binding mapping assumes the canonical Sm-ring function, but in
      GEMIN6 and GEMIN7 the Sm fold is used to form an Sm-like heterodimer that binds Sm proteins.
      The RNA-recognising subunit of the SMN complex is GEMIN5. Removing the GEMIN6/GEMIN7/UNRIP
      module from SMN (by GEMIN8 knockdown) impairs association with Sm proteins but not with
      snRNAs, arguing against an RNA-binding role for this module. No direct RNA-binding assay for
      GEMIN7 is reported in the literature examined. Not removed because no experiment excludes RNA
      contact within the assembled complex.
    supported_by:
    - reference_id: PMID:15939020
      supporting_text: Gemin6 and Gemin7 exist as a heterodimer, and interact with each other via an
        interface similar to that which mediates interactions among the Sm proteins
    - reference_id: PMID:17023415
      supporting_text: affects snRNP assembly by impairing the SMN complex association with Sm proteins
        but not with snRNAs
    - reference_id: PMID:17178713
      supporting_text: the peripheral component Gemin5 contributes an essential activity to the SMN
        complex
