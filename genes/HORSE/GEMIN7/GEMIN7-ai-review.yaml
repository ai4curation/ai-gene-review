suggested_questions:
- question: Is GO:0030674 protein-macromolecule adaptor activity the best available MF for GEMIN7,
    whose documented activities are bridging GEMIN6 to SMN and acting with GEMIN6 as an Sm-protein
    placeholder during Sm-core assembly, or would an snRNP-assembly-chaperone MF term be warranted?
- question: Does the GEMIN6-GEMIN7 Sm-like heterodimer contact snRNA at any stage of Sm-core
    assembly, which would bear on the electronic RNA binding annotation?
suggested_experiments:
- description: Direct RNA-binding assays (e.g. EMSA or CLIP) of recombinant GEMIN6-GEMIN7 heterodimer
    with U snRNAs to test whether the Sm-like fold retains any RNA contact.
