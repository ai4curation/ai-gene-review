core_functions:
- description: Cysteine-type deubiquitinase that removes ubiquitin, including Lys-48- and Lys-63-linked
    chains, from endosomal receptor cargo and ESCRT-associated proteins. It is recruited from the cytosol
    to endosome membranes through its CHMP-binding MIT domain, and so controls endosomal ubiquitin levels
    and receptor sorting. Inferred for horse from the experimentally characterised human and mouse orthologs
    in the same PANTHER subfamily; not tested on the horse protein.
