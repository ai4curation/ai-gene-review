  review:
    summary: A generic transfer from deubiquitinase to protein catabolism. USP8's documented effects on
      protein degradation are regulatory and go in both directions, so participation in the catabolic
      process itself is not established.
    action: MARK_AS_OVER_ANNOTATED
    reason: USP8 removes ubiquitin; it does not carry out the degradation steps. Its effect on turnover
      depends on the substrate. It stabilizes Nrdp1 and STAM by removing ubiquitin. Overexpressing it
      delays EGFR degradation, while depleting it blocks EGFR and Met down-regulation in one study and
      accelerates EGFR degradation in another. Human curators recorded this with regulatory terms (regulation
      of protein stability, negative regulation of lysosomal protein catabolic process), not GO:0006511,
      and PAINT did not place GO:0006511 at any USP8 node. The process term is an over-annotation for
      this gene, though not demonstrably false.
