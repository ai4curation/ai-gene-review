suggested_questions:
- question: F7BV54 is the full-length, human-isoform-1-like product of horse USP8 but is not a leaf in
    the PANTHER tree, so it receives none of the eight IBA annotations that human and mouse USP8 inherit
    (including endosome organization, regulation of protein stability, midbody and postsynaptic density).
    Should PANTHER/PAINT add this sequence, or should IBA propagation reach orthologs that UniProt places
    in SF27?
- question: Human curators annotate USP8 with K48- and K63-linked deubiquitinase activity from in vitro
    chain processing (PMID:16520378), but PAINT placed only the generic cysteine-type deubiquitinase activity.
    Is linkage-level specificity a property of the USP8 subfamily that should be propagated, or an in vitro
    observation best left on the human entry?
- question: Do equine corticotroph or pars intermedia tumours (pituitary pars intermedia dysfunction)
    carry USP8 14-3-3-motif mutations, as human corticotroph adenomas do?
suggested_experiments:
- description: Express recombinant horse USP8 (F7BV54) and its Cys785Ala mutant, and measure cleavage
    of K48- and K63-linked di-ubiquitin and of monoubiquitinated EGFR; in parallel, express a GFP fusion
    with and without the MIT domain in equine cells to test endosomal recruitment.
  hypothesis: Horse USP8 is an active cysteine-type deubiquitinase that depends on Cys785 and is recruited
    to endosomes by its MIT domain, as human USP8 is.
- description: Sequence the USP8 14-3-3-motif region (horse residues ~712-719) in pituitary tissue from
    horses with pars intermedia dysfunction and from controls.
  hypothesis: Somatic USP8 14-3-3-motif mutations contribute to some cases of equine pituitary disease,
    as they do to human corticotroph adenomas.
