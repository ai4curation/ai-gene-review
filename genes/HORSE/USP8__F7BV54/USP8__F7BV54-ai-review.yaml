id: F7BV54
gene_symbol: USP8
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9796
  label: Equus caballus
description: USP8 (ubiquitin-specific protease 8, also called UBPY) is a cysteine-type deubiquitinase
  of the peptidase C19 (USP) family. It removes ubiquitin from protein substrates and processes Lys-48-
  and Lys-63-linked polyubiquitin chains. The protein has an N-terminal MIT domain, which binds ESCRT-III
  CHMP proteins and targets the enzyme from the cytosol to endosome membranes; a catalytically inactive
  rhodanese-like domain; a central SH3-binding motif that binds the ESCRT-0 subunits STAM/STAM2; a 14-3-3
  binding motif around a phosphoserine that holds the enzyme in the cytosol; and a C-terminal USP catalytic
  domain with a Cys/His catalytic dyad. On endosomes USP8 deubiquitinates ESCRT-0 components and endocytosed
  receptor cargo such as EGFR, controlling endosomal ubiquitin levels and receptor down-regulation. It
  also stabilizes particular substrates by removing ubiquitin and is recruited to the midbody late in
  cytokinesis. In mammals, gain-of-function somatic mutations in the 14-3-3 motif cause corticotroph pituitary
  adenomas. Horse F7BV54 (1117 aa) is the product of the horse USP8 gene that matches the human canonical
  isoform 1 over its whole length (92.8% identity), with every characterised domain, motif and catalytic
  residue conserved. All of these functions are known from human and mouse USP8; none has been tested
  experimentally on the horse protein.
