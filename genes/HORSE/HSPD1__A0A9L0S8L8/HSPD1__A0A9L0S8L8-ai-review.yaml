suggested_questions:
- question: Is the 14-residue N-terminal extension (MKAHLTKRNSASSE) of A0A9L0S8L8 translated in horse tissues, or
    does translation start at the conserved MLRLP methionine as in human?
- question: Should A0A9L0S8L8 or F6Z587 be the PANTHER/UniProt representative for horse HSPD1, given that F6Z587
    lacks a hinge-domain exon?
suggested_experiments:
- description: N-terminal proteomics or ribosome profiling of horse tissue to determine the translation start and
    the mature N-terminus of matrix Hsp60.
  experiment_type: proteomics
- description: Reconstitute recombinant horse Hsp60 with Hsp10 and measure ATP-dependent refolding of a model substrate
    (e.g. malate dehydrogenase) to confirm the inferred core activity.
  experiment_type: biochemical assay
