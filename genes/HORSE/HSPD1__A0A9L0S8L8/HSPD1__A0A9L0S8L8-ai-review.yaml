id: A0A9L0S8L8
gene_symbol: HSPD1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9796
  label: Equus caballus
description: 'HSPD1 encodes Hsp60, the mitochondrial type I (GroEL-like) chaperonin. This entry (A0A9L0S8L8, 587
  aa) is the canonical horse product: it contains every residue of human Hsp60 (P10809), 97.6% identical, plus a
  14-residue N-terminal extension ahead of the conserved matrix-targeting presequence. Each subunit has an equatorial
  ATP-binding domain, an intermediate hinge domain and an apical substrate- and Hsp10-binding domain. In mammals,
  Hsp60 is imported into the mitochondrial matrix, where heptameric rings associate with the HSPE1/Hsp10 co-chaperonin
  to form ATP-driven folding chambers. These enclose newly imported and stress-denatured matrix proteins and release
  them folded. Smaller pools of mammalian Hsp60 are reported in the cytosol, at the cell surface and in extracellular
  fluids, with context-dependent effects on apoptosis and on antigen-presenting cells. Horse Hsp60 has not been
  characterised biochemically; its functions are inferred from human, rodent, yeast and bacterial members of the
  same chaperonin family.'
