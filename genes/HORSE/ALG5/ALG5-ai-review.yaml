- id: file:HORSE/ALG5/ALG5-bioinformatics/RESULTS.md
  title: ALG5 human–horse sequence comparison
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Local human-horse sequence comparison inspected; verifies preservation
      of the N-terminal transmembrane segment supporting ER-membrane
      localization, while noting that an internal 30-residue deletion relative
      to human ALG5 leaves active glucosyltransferase transfer unresolved.
- id: file:HORSE/ALG5/ALG5-bioinformatics/RESULTS-rereview.md
  title: ALG5 re-review isoform identity and conservation of the missing segment
  findings:
  - statement: >-
      A0A5F5PM72 pairs gaplessly with human isoform 2 (Q9Y673-2). The 30 residues it lacks
      (human 95-124) contain a strand and DDGS motif conserved across PTHR10859:SF91 orthologs
      from yeast to mouse. All other horse ALG5 UniProt entries contain the segment but are
      otherwise truncated, diverged or internally deleted.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Reproducible Biopython analysis (compare_isoforms_rereview.py) using sequences fetched
      from UniProt REST on 2026-10-20. Sequence evidence only; it does not measure activity.
- id: PMID:10359825
  title: A mutation in the human ortholog of the Saccharomyces cerevisiae ALG6 gene causes carbohydrate-deficient
    glycoprotein syndrome type-Ic.
  findings:
  - statement: Human ALG5 cDNA partially complements the S. cerevisiae alg5 glycosylation defect (CPY
      hypoglycosylation), despite the ALG6-focused title.
    supporting_text: Expression of the humanALG5andALG6cDNA partially complemented the respective yeast
      mutations, as shown by the improved glycosylation of CPY
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text cached. The study assays both ALG5 and ALG6. The cloned human ALG5 cDNA was
      reported to encode 242 aa, and which isoform region it contained is not stated.
suggested_questions:
- question: >-
    Does ALG5 isoform 2 (lacking human residues 95-124, which include the conserved DDGS motif),
    represented in horse by A0A5F5PM72, retain dolichyl-phosphate glucosyltransferase activity,
    or is it a non-catalytic or regulatory product?
- question: >-
    Should UniProt or Ensembl provide a full-length (isoform-1-equivalent) horse ALG5 product, so
    that gene-level Dol-P-Glc synthase annotations do not rest on a deletion isoform?
suggested_experiments:
- description: >-
    Express human or horse ALG5 isoform 1 and isoform 2 in an S. cerevisiae alg5 deletion strain.
    Compare complementation of CPY hypoglycosylation, and measure Dol-P-Glc formation from
    UDP-[3H]glucose and dolichyl phosphate in microsomes.
  experiment_type: complementation and enzyme assay
