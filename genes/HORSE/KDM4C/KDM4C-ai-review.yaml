taxon:
  id: NCBITaxon:9796
  label: Equus caballus
description: KDM4C (lysine-specific demethylase 4C, JMJD2C, GASC1) is a nuclear JmjC-domain histone demethylase
  of the KDM4/JHDM3 family. Using Fe(II) and 2-oxoglutarate, it removes methyl groups from trimethylated lysine
  9 and, less efficiently, lysine 36 of histone H3, converting H3K9me3 and H3K36me3 to lower methylation states.
  Besides the catalytic JmjN/JmjC module, which carries a structural zinc site, it has PHD and double Tudor reader
  domains that bind methylated histone tails. Recruited to target genes by transcription factors such as the androgen
  receptor, it removes repressive H3K9me3 and stimulates transcription; loss of H3K9me3 also reduces heterochromatin.
  KDM4A, KDM4B and KDM4C form a vertebrate-conserved dual H3K9/H3K36 subclass. The horse protein is a full-length
  KDM4C ortholog (1053 aa, 91% identical to human KDM4C) that conserves all JmjC Fe(II)-, 2-oxoglutarate- and Zn(2+)-binding
  residues.
