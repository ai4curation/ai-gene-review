- id: PMID:16732293
  title: The putative oncogene GASC1 demethylates tri- and dimethylated lysine 9 on histone H3.
  findings:
  - statement: GASC1/KDM4C and other JMJD2 members demethylate H3K9me3/me2 using iron and 2-oxoglutarate; ectopic
      expression reduces heterochromatin.
    supporting_text: three members of this subfamily of proteins demethylate H3K9me3/me2 in vitro through a hydroxylation
      reaction requiring iron and alpha-ketoglutarate as cofactors
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only cache; primary demonstration of KDM4C (GASC1) H3K9me3/me2 demethylase activity.
- id: PMID:16603238
  title: Reversal of histone lysine trimethylation by the JMJD2 family of histone demethylases.
  findings:
  - statement: JMJD2 subfamily members are trimethyl-specific demethylases.
    supporting_text: other human JMJD2 subfamily members also functioned as trimethylation-specific demethylases
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only cache; family-level evidence, cited by UniProt for human KDM4C function.
- id: PMID:17277772
  title: Cooperative demethylation by JMJD2C and LSD1 promotes androgen receptor-dependent gene expression.
  findings:
  - statement: KDM4C assembles with the androgen receptor on target genes, demethylates H3K9me3 and stimulates transcription.
    supporting_text: Assembly of ligand-bound androgen receptor and JMJD2C on androgen receptor-target genes results
      in demethylation of trimethyl H3K9 and in stimulation of androgen receptor-dependent transcription
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only cache; human KDM4C chromatin recruitment and coactivator role.
- id: PMID:21914792
  title: Structural and evolutionary basis for the dual substrate selectivity of human KDM4 histone demethylase
    family.
  findings:
  - statement: KDM4A-C are a vertebrate-conserved subclass demethylating both H3K9 and H3K36; KDM4C structure solved
      with Ni2+ and N-oxalylglycine.
    supporting_text: KDM4A–C, which are highly conserved in all vertebrates, and demethylate both H3K9 and H3K36
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached; kinetics, KDM4C crystal structure and phylogeny supporting orthology transfer
      within vertebrates.
- id: PMID:28262558
  title: Potent and Selective KDM5 Inhibitor Stops Cellular Demethylation of H3K4me3 at Transcription Start Sites
