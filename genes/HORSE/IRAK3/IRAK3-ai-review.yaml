core_functions:
- description: Pseudokinase that binds IRAK4 and stabilises MyD88-IRAK signaling assemblies, preventing
    release of IRAK1/IRAK4 and IRAK1-TRAF6 complex formation, thereby acting as a negative feedback regulator
    of TLR and IL-1 receptor signaling.
