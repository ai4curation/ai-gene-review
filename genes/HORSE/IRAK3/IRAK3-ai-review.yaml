  id: NCBITaxon:9796
  label: Equus caballus
description: IRAK3 (IRAK-M) is a pseudokinase of the IRAK family that acts as a negative feedback regulator
  of Toll-like receptor and interleukin-1 receptor signaling in myeloid cells. It has an N-terminal death
  domain, through which IRAK proteins assemble with MyD88 in the receptor-proximal Myddosome, a central
  kinase-like domain with a noncanonical, catalytically compromised active site and weak ATP affinity,
  and a C-terminal region. Studies of the mouse and human orthologs show that IRAK-M is induced by TLR
  stimulation and restrains signaling by preventing release of IRAK1 and IRAK4 from MyD88 and the formation
  of IRAK1-TRAF6 complexes, which limits inflammatory cytokine production and contributes to endotoxin
  tolerance. This UniProt entry is an alternative Ensembl gene model of horse IRAK3 that begins at an
  alternative first exon, lacks the first 50 residues of the canonical 614-residue product (F6QZW8),
  and keeps most of the death domain and the complete pseudokinase domain.
existing_annotations:
- term:
    id: GO:0005524
    label: ATP binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR000719
  review:
    summary: The horse product retains the complete kinase-like domain, and the human ortholog binds ATP
      with weak affinity in an unobstructed pocket. Nucleotide binding is real but secondary to the scaffolding
      role of this pseudokinase.
    action: KEEP_AS_NON_CORE
    reason: InterPro2GO maps the protein kinase domain to ATP binding. The human IRAK3 pseudokinase domain,
      in the same PANTHER subfamily (PTHR24419:SF7), binds ATP only weakly but does bind it and binds
      ATP-competitive inhibitors with high affinity. The horse benchmark model contains the full pseudokinase
      domain (all 288 residues of the human domain align, 123-410) with the same noncanonical CGS/DFA
      configuration, so the term is retained. It does not imply phosphotransfer activity and is not the
      core function, so it is kept as non-core.
    supported_by:
    - reference_id: PMID:33238146
      supporting_text: Here, we find that IRAK3 has a weak affinity for ATP, despite having a mostly unobstructed
        ATP-binding pocket that is accessible for the ATP-competitive inhibitor staurosporine.
    - reference_id: file:HORSE/IRAK3/IRAK3-bioinformatics/RESULTS-rereview.md
      supporting_text: '| Protein kinase domain 165-452 | 288/288, 123-410 | 288/288, 170-457 | 288/288 |'
- term:
    id: GO:0007165
    label: signal transduction
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR000488
  review:
    summary: Correct but too general. IRAK3 acts specifically in MyD88-dependent Toll-like receptor and
      interleukin-1 receptor signaling, the pathways to which PAINT propagates the IRAK3 clade.
    action: MODIFY
    reason: The death-domain InterPro2GO mapping gives the generic signal transduction term. The IRAK3
      subfamily (PTHR24419:SF7) operates in receptor-proximal TLR/IL-1R signaling. Human IRAK-M reconstitutes
      the IL-1 response in IRAK1-deficient cells, mouse IRAK-M controls MyD88-associated IRAK complexes,
      and PAINT places interleukin-1-mediated signaling and lipopolysaccharide-mediated signaling at nodes
      inherited by IRAK3 (these IBAs are present on the canonical horse product F6QZW8 but are not projected
      to this alternative model). The benchmark model keeps the Pfam/InterPro death-domain match (64 of
      66 residues of the human PROSITE death domain) but lacks the N-terminal 50 residues of the canonical
      product. The replacement terms describe the gene; whether this particular alternative product assembles
      into the Myddosome has not been tested.
    proposed_replacement_terms:
    - id: GO:0002755
      label: MyD88-dependent toll-like receptor signaling pathway
    - id: GO:0070498
      label: interleukin-1-mediated signaling pathway
    supported_by:
    - reference_id: PMID:10383454
      supporting_text: Although IRAK-M and IRAK-2 exhibit only a negligible autophosphorylation activity,
        they can reconstitute the IL-1 response in a 293 mutant cell line lacking IRAK.
    - reference_id: PMID:12150927
      supporting_text: IRAK-M prevented dissociation of IRAK and IRAK-4 from MyD88 and formation of IRAK-TRAF6
        complexes.
    - reference_id: file:HORSE/IRAK3/IRAK3-bioinformatics/RESULTS-rereview.md
      supporting_text: Benchmark residues 4-567 are an exact substring of F6QZW8 starting at canonical residue
        51.
