suggested_questions:
- question: Is the alternative first exon used by the horse transcript ENSECAT00000032597 (A0A3Q2HDT6,
    starting MIT and lacking canonical residues 1-50) supported by horse RNA-seq or CAGE data, or is it
    a gene-model artifact?
- question: Human IRAK3 Ser110, phosphorylated by IRAK1 and isomerised by PIN1 in the IL-33 pathway, is
    Asn in horse. Does horse IRAK-M participate in IL-33-driven nuclear signaling by another route, or
    is that mechanism primate-specific?
suggested_experiments:
- description: Express the horse canonical (F6QZW8) and alternative (A0A3Q2HDT6) IRAK3 products in IRAK3-deficient
    macrophages and compare MyD88 co-immunoprecipitation and suppression of LPS-induced cytokine production,
    to test whether the 50-residue N-terminal truncation affects Myddosome assembly.
  experiment_type: complementation and co-immunoprecipitation
