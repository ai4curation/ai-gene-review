id: F7A4N8
gene_symbol: CTDSP2
taxon:
  id: NCBITaxon:9796
  label: Equus caballus
status: COMPLETE
description: Kinase activity is refuted for the selected 174-residue CTDSP2 product F7A4N8. The exact
  sequence contains no kinase machinery and lacks the FCP1-homology catalytic domain; the gene's full-length
  products and their human, mouse and cow orthologs are small CTD phosphatases (SCP2), not kinases. The horse
  gene has no GOA annotations, so the re-reviewed gene review and the human CTDSP2 review are the reference
  for this assessment.
