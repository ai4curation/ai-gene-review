    summary: Focused CTDSP2 sequence, family and AlphaFold review refutes GO:0016301 for F7A4N8. The selected
      174-residue model contains no defining eukaryotic kinase catalytic motifs, matches only the N-terminal
      part of the HAD-like FCP/SCP phosphatase family, and diverges before the human CTDSP2 FCP1 catalytic
      domain and DLDET motif. This is a catalytic-class and domain-architecture false positive, not a
      defensible phosphatase-versus-kinase ambiguity; the horse model should be resolved before any CTDSP2
      phosphatase terms are transferred.
