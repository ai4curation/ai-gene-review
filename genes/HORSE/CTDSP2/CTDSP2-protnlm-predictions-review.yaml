  review:
    assessment: NPI
    error_type: DOMAIN_ARCHITECTURE_MISMATCH
    confidence_score: 0
    summary: Kinase activity is incorrect for F7A4N8 on two independent grounds. First, the exact
      174-residue input shares only an 84-residue N-terminal prefix with human CTDSP2, lacks the FCP1-homology
      catalytic domain and its DxDx(T/V) motif, contains none of the eukaryotic protein-kinase catalytic
      motifs, and has no confidently folded catalytic domain in its AlphaFold model. Second, the CTDSP2
      family itself is not a kinase family; the full-length horse products (A0A9L0T5X1, A0A9L0R207) retain
      the DLDET motif and group with CTDSP2 orthologs in PANTHER PTHR12210:SF187, whose characterised member,
      human SCP2, is a small CTD phosphatase that preferentially dephosphorylates Ser5 of the RNA polymerase II
      CTD. No literature reports kinase activity for any CTDSP2 ortholog (PubMed search of CTDSP2 with kinase,
      horse or equine). The prediction therefore has no support for this product or for the gene.
