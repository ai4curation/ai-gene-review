id: F7A4N8
gene_symbol: CTDSP2
taxon:
  id: NCBITaxon:9796
  label: Equus caballus
status: COMPLETE
description: Kinase activity is refuted for the selected short CTDSP2 protein model. The exact sequence
  contains no kinase machinery; its missing FCP1-homology catalytic phosphatase domain indicates a truncated
  or aberrant CTDSP2 model rather than a functional kinase.
