  source_version: UniProt API snapshot 2026-09-08
  predicted_term:
    id: GO:0016301
    label: kinase activity
  predicted_term_type: GO_MF
  review:
    assessment: NPI
    confidence_score: 0
    error_type: DOMAIN_ARCHITECTURE_MISMATCH
    summary: >-
      Nonparalog incorrect. No kinase mechanism is supported for F7A4N8: the selected
      174-residue sequence matches only the N-terminal portion of human CTDSP2, diverges
      before the FCP1/HAD catalytic phosphatase domain, and lacks eukaryotic protein
      kinase motifs. The exact model also lacks the canonical CTDSP2 phosphatase active
      site, so the strongest interpretation is a truncated or aberrant CTDSP2 model
      rather than a kinase or a functional CTD phosphatase.
