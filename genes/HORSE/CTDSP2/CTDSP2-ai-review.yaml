- id: file:HORSE/CTDSP2/CTDSP2-bioinformatics/RESULTS.md
  title: CTDSP2 human-horse sequence comparison
  findings:
  - statement: A forced global alignment of F7A4N8 against human CTDSP2 pairs 170 residues;
      the re-review analysis shows the identity is concentrated in the first 84 residues and
      the rest of the pairing is alignment noise against an unrelated tail.
    supporting_text: Paired coverage is 62.7% of human O14595 (271 aa) and 97.7% of horse
      F7A4N8 (174 aa).
    reference_section_type: RESULTS
  - statement: The alignment is not a reciprocal orthology test and does not by itself license
      transferring the human catalytic annotation to this product.
    supporting_text: This measures conservation between the identified records. It is not a
      reciprocal orthology analysis and does not itself validate a functional annotation.
    reference_section_type: RESULTS
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Earlier reproducible Biopython global alignment. Its feature table correctly
      records that both human catalytic aspartates are unaligned in F7A4N8. The 57.1% identity
      over 170 paired residues overstates similarity beyond residue 84, because a global alignment
      with these gap penalties pairs the unrelated C-terminal tail. Superseded for gene-model
      and placement questions by RESULTS-rereview.md.
- id: file:HORSE/CTDSP2/CTDSP2-bioinformatics/RESULTS-rereview.md
  title: CTDSP2 (horse) re-review gene model and phylogenetic placement
  findings:
  - statement: The horse CTDSP2 gene has three Ensembl protein-coding transcripts. F7A4N8 comes
      from the non-canonical ENSECAT00000020049, whose sixth exon (375 bp) extends 273 nt upstream
      of the 102-bp exon used by both other transcripts.
    supporting_text: 76298535-76298161 (375 bp)
    reference_section_type: RESULTS
  - statement: F7A4N8 shares only an 84-residue prefix with human CTDSP2 and lacks the DxDx(T/V)
      catalytic motif found at human position 107.
    supporting_text: '| horse_CTDSP2gene_F7A4N8 | 174 | 84 | 109/164 | none |'
    reference_section_type: RESULTS
  - statement: The Ensembl canonical horse product A0A9L0T5X1 (312 aa) retains the catalytic
      DLDET motif at position 148.
    supporting_text: "| horse_CTDSP2gene_A0A9L0T5X1 | 312 | 0 | 248/258 | [(148, 'DLDET')] |"
    reference_section_type: RESULTS
  - statement: Over the catalytic region, the full-length horse product is 99.4% identical to
      human CTDSP2 and groups with CTDSP2 orthologs, well separated from CTDSP1 (78%) and CTDSPL
      (81%).
    supporting_text: '| human_CTDSP2_O14595 | 0.994 |'
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Re-review analysis (compare_sequences_rereview.py), computed from cached UniProt
      sequences and the Ensembl REST gene model, with no hand-entered values. The comparators human,
      mouse and cow CTDSP2 are all PANTHER PTHR12210:SF187 members in the PANTHER 19.0 classification
      files; horse is not a PANTHER reference proteome, so its placement rests on this tree plus
      the VGNC orthology assignment.
