- id: PMID:12721286
  title: A novel RNA polymerase II C-terminal domain phosphatase that preferentially dephosphorylates
    serine 5.
  full_text_unavailable: true
  findings:
  - statement: The small CTD phosphatase (SCP) family, of which CTDSP2 is a member, preferentially
      dephosphorylates Ser5 within the RNA polymerase II CTD consensus repeat.
    supporting_text: This study describes a family of small CTD phosphatases (SCPs) that preferentially
      catalyze the dephosphorylation of Ser5 within the consensus repeat.
    reference_section_type: ABSTRACT
  - statement: The SCPs repress transcription through their phosphatase activity. Expressing SCP1
      inhibits activated transcription, whereas a phosphatase-inactive mutant enhances it, so the
      repressor role cannot be transferred to a product that lacks the active site.
    supporting_text: Expression of SCP1 inhibits activated transcription from a number of promoters,
      whereas a phosphatase-inactive mutant of SCP1 enhances transcription.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: One of the two primary sources behind the human CTDSP2 FUNCTION annotation.
      Abstract-only in the local cache, and the abstract foregrounds SCP1; it cannot establish
      by itself which assays were performed on CTDSP2/SCP2. Cited for family biology, not as
      equine evidence.
- id: PMID:15681389
  title: Small CTD phosphatases function in silencing neuronal gene expression.
  full_text_unavailable: true
  findings:
  - statement: REST/NRSF recruits the SCP family (SCP1 to SCP3, including CTDSP2) to RE-1-element
      neuronal genes to silence them in non-neuronal cells.
    supporting_text: We show that REST/NRSF recruits SCPs to neuronal genes that contain RE-1
      elements, leading to neuronal gene silencing in non-neuronal cells.
    reference_section_type: ABSTRACT
  - statement: SCP-mediated neuronal gene silencing is conserved as far as Drosophila, consistent
      with the full-length horse CTDSP2 product retaining the conserved catalytic domain.
    supporting_text: Thus, SCP activity is an evolutionarily conserved transcriptional regulator
      that acts globally to silence neuronal genes.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The REST/neuronal-silencing source behind the curated human record. Abstract-only
      in the local cache; it addresses the SCP family (SCPs 1 to 3) rather than CTDSP2 in isolation.
      Cited for pathway context, not as equine evidence.
