id: F7A4N8
gene_symbol: CTDSP2
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9796
  label: Equus caballus
description: >-
  F7A4N8 is a 174-residue product predicted from one alternative transcript
  (ENSECAT00000020049) of the horse CTDSP2 gene (ENSECAG00000018788, chromosome 6),
  which encodes the small CTD phosphatase SCP2. Its first 84 residues are essentially
  identical to the N-terminal non-catalytic region of human CTDSP2, after which the
  transcript uses an extended exon whose extra sequence encodes 90 unrelated residues
  and a stop codon. The product therefore lacks the entire FCP1-homology (HAD-type)
  phosphatase domain, including the DxDx(T/V) motif that carries the nucleophilic and
  proton-donor aspartates. Other transcripts of the same gene (Ensembl canonical
  ENSECAT00000107019, UniProt A0A9L0T5X1, 312 aa; and ENSECAT00000138494, A0A9L0R207,
  252 aa) do encode the complete catalytic domain, and the full-length product groups
  with CTDSP2 orthologs (PANTHER PTHR12210:SF187 members in human, mouse and cow)
  rather than with CTDSP1 or CTDSPL. In mammals the full-length enzyme is a nuclear
  Mg2+-dependent phosphatase that preferentially removes phosphate from Ser5 of the RNA
  polymerase II CTD and is recruited by REST to silence RE-1-containing neuronal genes
  in non-neuronal cells. Because the truncated F7A4N8 product lacks the catalytic domain
  and its transcript carries a premature stop codon upstream of four exon junctions, it
  has no demonstrable enzymatic function, and it may be a nonsense-mediated-decay
  transcript or annotation artefact rather than a stable protein.
existing_annotations: []
suggested_questions:
- question: Is ENSECAT00000020049, the transcript encoding F7A4N8, supported by horse RNA-seq
    or long-read data? Its 375-bp exon extends 273 nt upstream of the canonical 102-bp exon
    acceptor and introduces a premature stop codon upstream of four further exon junctions,
    the signature of a nonsense-mediated-decay or intron-retention isoform rather than a
    stable protein product.
  experts: []
- question: Which horse CTDSP2 model best represents the real full-length product? The Ensembl
    canonical model (A0A9L0T5X1, 312 aa) has an N-terminal extension that does not begin with
    methionine and omits the 13-residue SDLLQCLQYQFYQ exon present in human CTDSP2, whereas
    A0A9L0R207 (252 aa) keeps that exon but omits the 19-residue exon that forms part of the
    catalytic fold. Neither model reproduces the human 271-residue architecture exactly.
  experts: []
- question: If a short F7A4N8-like protein is made, does its retained N-terminal segment (which
    in the SCP proteins lies outside the catalytic domain) have any function, such as competing
    with full-length CTDSP2 for partners, or is it simply degraded?
  experts: []
suggested_experiments:
- hypothesis: The F7A4N8-encoding transcript (ENSECAT00000020049) is a minor, NMD-targeted
    isoform, and the dominant horse CTDSP2 transcript encodes a full-length catalytic protein
    like human CTDSP2.
  description: Quantify junction-spanning reads for the extended exon versus the canonical
    102-bp exon acceptor in public horse RNA-seq (e.g. FAANG tissues), and compare isoform
    abundance in horse cells with and without NMD inhibition (cycloheximide or UPF1
    knockdown). Confirm full-length ORFs by long-read (Iso-Seq) sequencing.
  experiment_type: transcript isoform quantification / NMD sensitivity
- hypothesis: Phosphatase activity on RNA polymerase II CTD Ser5 is carried by the full-length
    horse CTDSP2 product and is absent from F7A4N8, which lacks the catalytic domain.
  description: Express the full-length horse CTDSP2 product and F7A4N8, and assay phosphate
    release from a Ser5-phosphorylated CTD heptapeptide substrate, with human CTDSP2 as a
    positive control and a catalytic-aspartate (D-to-A) mutant as a negative control.
  experiment_type: in vitro phosphatase assay with Ser5-phosphorylated CTD substrate
