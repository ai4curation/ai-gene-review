id: F7A4N8
gene_symbol: CTDSP2
product_type: PROTEIN
status: IN_PROGRESS
taxon:
  id: NCBITaxon:9796
  label: Equus caballus
description: F7A4N8 is a 174-residue protein model assigned to the horse CTDSP2 locus. Its N-terminal
  segment is closely conserved with human CTDSP2, but the remaining sequence does not preserve the canonical
  FCP1-homology phosphatase domain. The catalytic activity and physiological role of this particular protein
  model are unresolved; it cannot be treated as a demonstrated active CTD phosphatase.
gene_model_issues:
- issue_type: TRUNCATED_GENE_MODEL
  status: SUSPECTED
  description: >-
    The 174-residue model aligns with only the N-terminal part of human CTDSP2 and does
    not cover the FCP1-homology domain or its catalytic aspartates (human Asp107 and
    Asp109). It may be an incomplete exon assembly; a real short product is the
    alternative.
  evidence_types:
  - ORTHOLOG_COMPARISON
  - DOMAIN_ARCHITECTURE
  supported_by:
  - reference_id: file:HORSE/CTDSP2/CTDSP2-bioinformatics/RESULTS.md
    supporting_text: Paired coverage is 62.7% of human O14595 (271 aa) and 97.7% of horse
      F7A4N8 (174 aa).
suggested_questions:
- question: Is the 174-residue F7A4N8 protein model a genuine equine CTDSP2 product, or a
    truncated gene model? The sequence diverges from human CTDSP2 after roughly residue 84
    and so lacks the FCP1-homology catalytic domain entirely; nothing in the record distinguishes
    a real short isoform from an incomplete exon assembly.
  experts: []
- question: Does the horse CTDSP2 locus encode a full-length product that retains the catalytic
    aspartate pair equivalent to human Asp107/Asp109, and if so, is the short form co-expressed
    as an alternative product rather than an artefact?
  experts: []
- question: If a short equine CTDSP2 product is real, does its retained N-terminal segment
    still support REST/NRSF-dependent recruitment to RE-1 element genes in the absence of
    phosphatase activity, as the phosphatase-inactive human SCP forms do?
  experts: []
suggested_experiments:
- hypothesis: The equine CTDSP2 locus produces a full-length, FCP1-homology-domain-containing
    transcript, and F7A4N8 reflects an incomplete gene model rather than the dominant product.
  description: RT-PCR across the predicted CTDSP2 exons plus long-read (Iso-Seq or targeted
    nanopore) sequencing of horse tissue RNA, prioritizing pancreas, where human CTDSP2 expression
    is highest. Reassemble the ORF and re-run the paired alignment in CTDSP2-bioinformatics
    on the corrected sequence.
  experiment_type: full-length transcript sequencing / gene-model validation
- hypothesis: Whichever equine CTDSP2 product is real, its phosphatase activity on RNA polymerase
    II CTD Ser5 tracks with the presence of the catalytic aspartate pair.
  description: Express and purify the selected 174-residue form and any transcript-verified
    full-length equine form, and assay release of phosphate from a TFIIH-phosphorylated CTD
    substrate (or a Ser5-phosphorylated CTD heptapeptide) in parallel with recombinant human
    CTDSP2 as the positive control and a catalytic-aspartate mutant as the negative control.
  experiment_type: in vitro phosphatase assay with Ser5-phosphorylated CTD substrate
references:
- id: file:HORSE/CTDSP2/CTDSP2-uniprot.txt
  title: 'UniProtKB F7A4N8: selected horse CTDSP2 protein model'
  findings:
  - statement: The horse CTDSP2 entry is an unreviewed 174-residue TrEMBL record whose protein
      name derives solely from an Ensembl gene model, with no equine experimental characterization.
    supporting_text: 'SubName: Full=CTD small phosphatase 2 {ECO:0000313|Ensembl:ENSECAP00000016443.3};'
    reference_section_type: DATABASE_ENTRY
  - statement: The gene symbol assignment rests on VGNC orthology nomenclature rather than
      on any demonstrated equine phosphatase activity, and the record carries no InterPro
      phosphatase or kinase domain signature.
    supporting_text: 'Name=CTDSP2 {ECO:0000313|VGNC:VGNC:16932};'
    reference_section_type: DATABASE_ENTRY
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Source record for the reviewed protein form. Naming is computational (Ensembl
      model plus VGNC symbol); it fixes the locus identity but establishes no equine function.
      The absence of a domain signature is noted as an observation about this record, not as
      proof of lost activity.
- id: file:HORSE/CTDSP2/CTDSP2-bioinformatics/RESULTS.md
  title: CTDSP2 human-horse sequence comparison
  findings:
  - statement: The horse model covers only about two-thirds of human CTDSP2, with conservation
      confined largely to the N-terminal region; identity over the paired region is a modest
      57.1%.
    supporting_text: Paired coverage is 62.7% of human O14595 (271 aa) and 97.7% of horse
      F7A4N8 (174 aa).
    reference_section_type: RESULTS
  - statement: The alignment is explicitly not a reciprocal orthology test and does not by
      itself license transferring the human catalytic annotation to this protein form.
    supporting_text: This measures conservation between the identified records. It is not a
      reciprocal orthology analysis and does not itself validate a functional annotation.
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Reproducible Biopython global alignment with retained full output, sequence
      hashes and scoring parameters; computed, not hardcoded. The per-feature table records
      that both human catalytic-aspartate positions are unaligned or deleted in the horse model
      - the central reason this review withholds a catalytic claim.
- id: file:human/CTDSP2/CTDSP2-uniprot.txt
  title: 'UniProtKB O14595: human CTDSP2 catalytic features'
  findings:
  - statement: Human CTDSP2 is a small CTD phosphatase that preferentially dephosphorylates
      Ser-5 of the POLR2A C-terminal heptapeptide repeats and negatively regulates RNA polymerase
      II transcription.
    supporting_text: "FUNCTION: Preferentially catalyzes the dephosphorylation of 'Ser-5'"
    reference_section_type: DATABASE_ENTRY
  - statement: Human CTDSP2 is recruited by REST to RE-1-element neuronal genes, silencing
      them in non-neuronal cells.
    supporting_text: by REST to neuronal genes that contain RE-1 elements, leading to
    reference_section_type: DATABASE_ENTRY
  - statement: The catalytic machinery sits in the FCP1-homology domain spanning human residues
      97-255, i.e. almost entirely outside the region to which the 174-residue horse model
      aligns.
    supporting_text: DOMAIN          97..255
    reference_section_type: DATABASE_ENTRY
  - statement: Catalysis requires the aspartate pair Asp107 (4-aspartylphosphate intermediate)
      and Asp109 (proton donor), both of which are unaligned or deleted in the selected horse
      model.
    supporting_text: ACT_SITE        107
    reference_section_type: DATABASE_ENTRY
  - statement: Human CTDSP2 is nuclear, though by similarity rather than by direct experiment.
    supporting_text: 'SUBCELLULAR LOCATION: Nucleus {ECO:0000250}.'
    reference_section_type: DATABASE_ENTRY
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Curated Swiss-Prot record for the human ortholog. Used as the source of the
      characterized biology under consideration for transfer and, critically, of the residue-level
      coordinates that make the transfer unsafe for this truncated protein form.
- id: PMID:12721286
  title: A novel RNA polymerase II C-terminal domain phosphatase that preferentially dephosphorylates
    serine 5.
  full_text_unavailable: true
  findings:
  - statement: The small CTD phosphatase (SCP) family, of which CTDSP2 is a member, preferentially
      dephosphorylates Ser5 within the RNA polymerase II CTD consensus repeat.
    supporting_text: This study describes a family of small CTD phosphatases (SCPs) that preferentially
      catalyze the dephosphorylation of Ser5 within the consensus repeat.
    reference_section_type: ABSTRACT
  - statement: Phosphatase activity is what makes the SCPs transcriptional repressors - expressing
      SCP1 inhibits activated transcription whereas a phosphatase-inactive mutant enhances
      it. Catalytic integrity therefore cannot be bypassed when transferring the repressor
      role to a protein form lacking the active site.
    supporting_text: Expression of SCP1 inhibits activated transcription from a number of promoters,
      whereas a phosphatase-inactive mutant of SCP1 enhances transcription.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: One of the two primary sources behind the human CTDSP2 FUNCTION annotation.
      Abstract-only in the local cache, and the abstract foregrounds SCP1; it cannot establish
      by itself which assays were performed on CTDSP2/SCP2. The human experimental annotation
      is retained under that access limitation rather than questioned - the curator read the
      full text.
- id: PMID:15681389
  title: Small CTD phosphatases function in silencing neuronal gene expression.
  full_text_unavailable: true
  findings:
  - statement: REST/NRSF recruits the SCP family (SCP1 to SCP3, including CTDSP2) to RE-1-element
      neuronal genes to silence them in non-neuronal cells, and the family's expression is
      restricted to non-neuronal tissues.
    supporting_text: We show that REST/NRSF recruits SCPs to neuronal genes that contain RE-1
      elements, leading to neuronal gene silencing in non-neuronal cells.
    reference_section_type: ABSTRACT
  - statement: SCP-mediated neuronal gene silencing is evolutionarily conserved as far as Drosophila,
      which is why a divergent equine protein form is better explained by a gene-model problem
      than by lineage-specific loss of the pathway.
    supporting_text: Thus, SCP activity is an evolutionarily conserved transcriptional regulator
      that acts globally to silence neuronal genes.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The REST/neuronal-silencing source behind the curated human record. Abstract-only
      in the local cache; it addresses the SCP family (SCPs 1 to 3) rather than CTDSP2 in isolation.
      Cited for pathway context, not as equine evidence.
