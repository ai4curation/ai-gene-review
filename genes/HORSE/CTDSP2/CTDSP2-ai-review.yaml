description: F7A4N8 is a 174-residue protein model assigned to the horse CTDSP2 locus. Its N-terminal
  segment is closely conserved with human CTDSP2, but the remaining sequence does not preserve the canonical
  FCP1-homology phosphatase domain. The catalytic activity and physiological role of this particular protein
  model are unresolved; it cannot be treated as a demonstrated active CTD phosphatase.
