id: A0A9L0T9B1
gene_symbol: SIRT5
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9796
  label: Equus caballus
description: SIRT5 of horse (Equus caballus) is a 310-residue NAD+-dependent protein lysine deacylase of the class III sirtuin
  subfamily (PANTHER PTHR11085:SF10), encoded by Ensembl gene ENSECAG00000026898 and 88% identical to human SIRT5 over its
  full length. Like its characterised human and mouse orthologs it is predicted to remove negatively charged acyl groups (succinyl,
  malonyl and glutaryl) from protein lysine residues, transferring the acyl group to ADP-ribose and releasing nicotinamide;
  Tyr102 and Arg105 of the acyl-binding pocket, the catalytic His158, the four zinc-binding cysteines and the NAD+ binding
  motifs are all conserved. Deacetylase activity is weak in the orthologs. It has an N-terminal mitochondrial presequence
  and is expected to act mainly in the mitochondrial matrix, with a cytosolic pool and a minor nuclear pool. In mammals SIRT5
  regulates mitochondrial and cytosolic metabolic enzymes such as CPS1 (urea cycle), HMGCS2 (ketogenesis) and SOD1. None of
  these properties has been tested experimentally in horse; all derive from orthologs within the same PANTHER subfamily and
  PAINT node.
