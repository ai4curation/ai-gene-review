suggested_questions:
- question: Is the 310-residue A0A9L0T9B1 product (ENSECAT00000146678) the main SIRT5 isoform expressed in horse tissues,
    given that the Ensembl canonical transcript encodes A0A9L0T6A9 with a divergent C-terminus lacking two NAD+-contacting
    segments?
- question: Does horse SIRT5 show the same preference for succinyl, malonyl and glutaryl over acetyl lysine as human SIRT5?
suggested_experiments:
- description: Express recombinant horse SIRT5 (A0A9L0T9B1 mature form) and measure NAD+-dependent desuccinylation, demalonylation,
    deglutarylation and deacetylation of acyl-lysine peptides, with a Y102F/R105M mutant as control.
  experiment_type: in vitro enzyme assay
- description: Map transcript usage of ENSECAG00000026898 by long-read RNA-seq in horse liver and skeletal muscle to determine
    which C-terminal variant predominates.
  experiment_type: transcriptomics
