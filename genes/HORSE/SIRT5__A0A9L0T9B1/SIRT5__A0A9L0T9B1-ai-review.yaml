  review:
    summary: Minor nuclear pool inherited as an ancestral sirtuin location; not where SIRT5 chiefly acts.
    action: KEEP_AS_NON_CORE
    reason: Human SIRT5 is mainly mitochondrial, with a minor nuclear pool detectable by fractionation. The IBA derives from
      the deep sirtuin node PTN008492176, seeded by the nuclear sirtuins; the PAINT curator placed mitochondrion and cytosol,
      not nucleus, on the SIRT5-subfamily node PTN000119399, so nucleus is an ancestral location that survives in SIRT5 only
      as a small secondary pool. The IEA row restates the HAMAP subcellular-location note, which itself says only very small
      amounts are nuclear. Kept as a minor, non-core location. No experimental study of SIRT5 in horse exists; this is an
      inference from the human and mouse orthologs.
