  review:
    summary: >-
      PAINT propagation from node PTN000295037, seeded by budding yeast Orc5. ORC binds origin DNA
      as a complex; ORC5 is one of the AAA+ subunits that encircle the DNA, and origin binding by ORC
      depends on ATP bound by the ORC1/4/5 module.
    action: ACCEPT
    reason: >-
      The horse protein sits inside the PTHR12705:SF0 clade with the donor and conserves the
      ATP-binding site that ORC needs to assemble and bind DNA. A single well-characterised donor is
      sufficient for a PAINT node. The activity is a property of the ORC complex to which ORC5
      contributes, rather than an autonomous activity of the isolated subunit; in core_functions it is
      recorded as a contributing activity of nuclear ORC.
    supported_by:
    - reference_id: PMID:28112645
      supporting_text: Binding of the Origin Recognition Complex (ORC) to origins of replication marks the first step in the initiation of replication of the genome in all eukaryotic cells.
