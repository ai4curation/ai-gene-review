suggested_questions:
- question: >-
    Which ORC5 residues contact origin DNA in mammalian ORC, and does ORC5 contribute directly to
    DNA binding or only through ATP-dependent assembly of the complex?
- question: >-
    Are the human OBI1 ubiquitylation sites on ORC5 conserved in horse, and is ORC5 ubiquitylation a
    conserved mammalian mechanism of origin selection?
suggested_experiments:
- description: >-
    Express horse ORC1-6 with a Walker A K43A (or equivalent) ORC5 mutant and test complex assembly and
    ATP-dependent origin DNA binding, to confirm that the human ATP-dependent assembly requirement holds
    for the horse complex.
