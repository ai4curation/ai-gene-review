  label: Equus caballus
description: >-
  ORC5 is a subunit of the six-subunit origin recognition complex (ORC1-6), the nuclear
  initiator that marks DNA replication origins and, with CDC6 and CDT1, loads the MCM2-7
  helicase to license origins in G1. The horse protein (437 aa) is a full-length ortholog
  of human ORC5 (about 90% identity) in the single-subfamily PANTHER family PTHR12705. It has an
  AAA+ (RecA-like) domain, an alpha-helical lid and a C-terminal winged-helix region. In
  human ORC, ORC5 forms the ORC1/4/5 AAA+ motor module with ORC1 and ORC4 and binds ATP at
  its own Walker A site and at the ORC4-ORC5 interface. ATP binding by ORC5 is needed for
  complex assembly, but ORC5 is not the catalytic ATPase; its Walker B motif is the
  non-canonical DKAE, and all of these ATP-site residues are conserved in the horse protein.
  In human cells, chromatin-bound ORC5 is multi-mono-ubiquitylated in S phase by the E3 ligase
  OBI1, which promotes origin firing.
