core_functions:
- description: >-
    Structural, ATP-binding AAA+ subunit of the nuclear origin recognition complex. Within the
    ORC1/4/5 motor module it binds ATP, which is needed for ORC assembly, and it contributes to the
    complex's ATP-dependent binding of replication origins and loading of the MCM2-7 helicase at
    replication initiation.
