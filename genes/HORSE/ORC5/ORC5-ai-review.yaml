- term:
    id: GO:0005524
    label: ATP binding
  evidence_type: ISS
  original_reference_id: PMID:28112645
  qualifier: enables
  review:
    summary: >-
      Human ORC5 binds ATP at its Walker A/B site and at the ORC4-ORC5 interface in the crystal
      structure of the ORC1/4/5 motor module, and mutating the ORC5 ATP-binding site impairs human ORC
      assembly. The horse protein conserves every ATP-contacting residue reported for human ORC5.
    action: NEW
    reason: >-
      ATP binding is a structural, non-catalytic property of ORC5 that is required for ORC assembly.
      It is transferred from the human ortholog in the same single-subfamily PANTHER family, and is
      backed by conservation of Walker A (GHTASGKT), the DKAE Walker B motif, R104, P139, R143, Y182 and
      R226 in the horse sequence. No ATPase activity term is proposed: ORC5 is not the catalytic ATPase
      of ORC.
    supported_by:
    - reference_id: PMID:28112645
      supporting_text: The third nucleotide binds to Walker-A and -B motifs on ORC5 (Figure 3c), although the Walker-B motif is somewhat different (DKAE, rather than DELD (ORC1) or DEFD (ORC4)).
    - reference_id: PMID:17716973
      supporting_text: Mutations in the ATP-binding sites of Orc4 or Orc5 impair complex assembly, whereas Orc1 ATP binding is not required.
    - reference_id: file:HORSE/ORC5/ORC5-bioinformatics/RESULTS.md
      supporting_text: All ATP-site and inter-subunit residues described for human ORC5 are conserved in the horse protein.
