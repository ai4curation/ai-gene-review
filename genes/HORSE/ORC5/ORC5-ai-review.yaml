  title: ATP-dependent assembly of the human origin recognition complex.
  findings:
  - statement: ATP binding by ORC4 and ORC5, but not ORC1, is required for human ORC assembly in vitro.
    supporting_text: Mutations in the ATP-binding sites of Orc4 or Orc5 impair complex assembly, whereas Orc1 ATP binding is not required.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
