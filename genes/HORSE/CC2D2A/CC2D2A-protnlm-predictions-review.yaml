id: A0A5F5PJ44
gene_symbol: CC2D2A
taxon:
  id: NCBITaxon:9796
  label: Equus caballus
status: COMPLETE
description: >-
  ProtNLM2 (UniProt API snapshot 2026-09-08) emitted four GO biological-process terms for A0A5F5PJ44,
  a horse CC2D2A splice model that retains the coiled coils and C2 domain of this MKS-module ciliary
  transition-zone scaffold. Smoothened signaling pathway is biologically supported by mouse Cc2d2a
  loss-of-function data transferred within the CC2D2A orthogroup, but the horse gene already carries
  it in GOA on its canonical product A0A5F5PUW7, so it is CNN. Neural tube closure is supported by the
  mouse null, whose open neural tube the authors trace to defective cilia-based Shh signalling, and is
  absent from horse GOA, so it is COR. Heart development and kidney development record organ-level
  phenotypes of ciliary loss (laterality-driven and cushion-cilia heart defects, prenatal renal cysts);
  CC2D2A performs no step of either process, the mouse review marks both source annotations as
  over-annotations not suitable for ortholog transfer, and both are NPI.
