    id: GO:0001843
    label: neural tube closure
  predicted_term_type: GO_BP
  review:
    assessment: COR
    confidence_score: 2
    summary: >-
      Neural tube closure is not in horse GOA for either CC2D2A product. The targeted mouse Cc2d2a null
      has an open neural tube, and the authors trace it to loss of neural-tube cilia and cilia-based Shh
      signalling; the mouse gene review keeps this IMP as a valid non-core process. The horse protein
      is an ortholog in the same CC2D2A subfamily with high identity across its coiled-coil and C2-domain
      scaffold, so the transfer is an orthology inference rather than a horse observation. The term describes
      a developmental consequence of the core ciliogenesis role, not a CC2D2A activity.
    supported_by:
