- source_method: ProtNLM2
  source_version: UniProt API snapshot 2026-09-08
  predicted_term:
    id: GO:0007507
    label: heart development
  predicted_term_type: GO_BP
  review:
    assessment: NPI
    confidence_score: 0
    summary: >-
      The prediction is not in horse GOA for either CC2D2A product. Mouse Cc2d2a mutants show dextrocardia
      with situs inversus and atrioventricular septal defects in which atrioventricular-cushion cilia are
      absent, so the heart phenotype is real. It is, however, a downstream consequence of loss of cilia
      at the node and in the cushions: CC2D2A is a transition-zone and subdistal-appendage scaffold that
      performs no step of heart development. The mouse gene review marks the mouse heart development IMP
      as an over-annotation for this reason and states that it should not be transferred to orthologs, and
      no horse or PAINT evidence supports an organ-development role. The prediction is therefore refuted
      as a functional claim for the horse protein.
    supported_by:
    - reference_id: PMID:24947469
      supporting_text: Cc2d2a-/- embryos often revealed situs inversus and dextrocardia
    - reference_id: PMID:25807483
      supporting_text: In Cc2d2a mutant embryo, while cilia were abundant in outflow cushions, they were
        absent in AV cushions
    - reference_id: PMID:25807483
      supporting_text: Cc2d2a mutant embryos die prenatally with AVSD
- source_method: ProtNLM2
  source_version: UniProt API snapshot 2026-09-08
  predicted_term:
    id: GO:0007224
    label: smoothened signaling pathway
  predicted_term_type: GO_BP
  review:
    assessment: CNN
    confidence_score: 2
    summary: >-
      The horse CC2D2A gene already carries smoothened signaling pathway in GOA (Ensembl Compara IEA from
      mouse on the canonical product A0A5F5PUW7), and the horse canonical-product review keeps it as a
      true but non-core process. In mouse, Cc2d2a-null fibroblasts show strongly reduced ciliary Smoothened
      after SAG stimulation and null embryos lose Shh-dependent ventral neural-tube fates. A0A5F5PJ44 is
      a splice model of the same gene that retains the coiled coils and C2 domain at high identity to
      human CC2D2A, so the orthologous transfer is justified. CC2D2A contributes by gating ciliary membrane
      composition, not by any receptor or transducer activity.
    supported_by:
    - reference_id: PMID:21725307
      supporting_text: an effect that was even stronger in Cc2d2a−/− MEFs
    - reference_id: PMID:24947469
      supporting_text: the neural tube patterning defect of Cc2d2a-/- embryos mostly affects ventral cell
        fates, consistent with a perturbation of Shh signaling
    - reference_id: file:HORSE/CC2D2A/CC2D2A-bioinformatics/RESULTS.md
      supporting_text: share 90.3% identity among 1478 paired residues.
- source_method: ProtNLM2
  source_version: UniProt API snapshot 2026-09-08
  predicted_term:
    id: GO:0001822
    label: kidney development
  predicted_term_type: GO_BP
  review:
    assessment: NPI
    confidence_score: 0
    summary: >-
      The prediction is not in horse GOA. Cc2d2a loss in mouse leaves perinatal kidney tubules with few
      cilia, and a forward-genetic Cc2d2a line develops prenatal cystic kidney disease, but these are
      ciliopathy phenotypes of a protein that acts at the transition zone and mother centriole of essentially
      all ciliated cells; CC2D2A performs no step of kidney development. The mouse gene review marks the
      mouse kidney development IMP as an over-annotation on these grounds and advises against transfer to
      orthologs, and PAINT propagates no organ-development term in this family. The prediction is therefore
      refuted as a functional claim for the horse protein.
    supported_by:
    - reference_id: PMID:24947469
      supporting_text: Perinatal kidney tubules and tracheal epithelium revealed few cilia in Cc2d2a-/-
        embryos
    - reference_id: PMID:27002738
      supporting_text: Severe cystic disease was identified only in lines with cilia-related mutations including
        Bicc1, Cc2d2a, Tmem67, Cep290 and Pkd1
