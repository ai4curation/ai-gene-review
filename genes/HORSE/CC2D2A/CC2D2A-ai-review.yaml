taxon:
  id: NCBITaxon:9796
  label: Equus caballus
description: CC2D2A (coiled-coil and C2 domain-containing protein 2A; MKS6 in the Meckel syndrome nomenclature)
  is a large structural protein of the ciliary base. It has a disordered N-terminal region, central coiled
  coils and a C-terminal C2 domain, and is a core subunit of the MKS (B9/tectonic-like) module of the ciliary
  transition zone together with the tectonics, the B9-domain proteins MKS1, B9D1 and B9D2 and several
  transmembrane proteins. In this module CC2D2A is needed for the interdependent transition-zone localization
  of its partners, and so for the diffusion barrier that keeps the ciliary membrane compositionally distinct
  from the plasma membrane. In mouse it also localizes to the subdistal appendages of the mother centriole
  and is required for their assembly, for docking of the mother centriole and for axoneme formation; its
  loss abolishes primary cilia in many tissues and thereby disrupts cilia-dependent Hedgehog signalling,
  causing the Meckel and Joubert syndrome spectrum in humans. The horse gene ENSECAG00000025115 has seven
  TrEMBL transcript models; A0A5F5PJ44 is a shorter splice model (1480 aa) that starts at the methionine
  equivalent to human Met50 and lacks a 93-residue segment within the disordered N-terminal region, while
  retaining the coiled coils, the C2 domain and the entire C-terminal region.
