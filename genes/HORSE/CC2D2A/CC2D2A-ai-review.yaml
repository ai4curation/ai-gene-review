  in_complex:
    id: GO:0036038
    label: MKS complex
  supported_by:
  - reference_id: PMID:24947469
    supporting_text: CC2D2A is needed for the assembly of SDA at mother centriole, for stable MT anchoring
      and docking of transport vesicles, and for further elaboration of the transition zone.
  - reference_id: PMID:24947469
    supporting_text: The mouse Cc2d2a transgene could rescue the axoneme assembly defect in Cc2d2a-/-
      MEFs
  - reference_id: file:HORSE/CC2D2A/CC2D2A-bioinformatics/RESULTS.md
    supporting_text: share 90.3% identity among 1478 paired residues.
  - reference_id: file:HORSE/CC2D2A/CC2D2A-bioinformatics/RESULTS.md
