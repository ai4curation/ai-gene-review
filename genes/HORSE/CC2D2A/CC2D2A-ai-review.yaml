    summary: CC2D2A acts at the ciliary transition zone, the region between the basal body and the axoneme,
      as part of the MKS module.
    reason: PAINT curators placed ciliary transition zone at the PTHR20837 node PANTHER:PTN000464650 (taxon
      2759, Eukaryota), seeded by fly, mouse, worm, zebrafish and trypanosome orthologs. Horse CC2D2A is in
      PTHR20837:SF7 with human Q9P2K1 and mouse Q8CFW7, and therefore descends from that node; the horse
      gene-centric model A0A5F5PUW7 already carries this IBA. The benchmark model A0A5F5PJ44 is a splice
      model of the same gene (ENSECAG00000025115) that was not the PANTHER leaf and so received nothing; it
      retains every conserved region beyond the N-terminal disordered segment. Mouse Cc2d2a localizes to
      the transition zone (PMID:21725307, PMID:22179047) and the worm ortholog MKS-6 does likewise (PMID:21422230).
