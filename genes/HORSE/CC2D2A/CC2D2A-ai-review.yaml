gene_symbol: CC2D2A
product_type: PROTEIN
status: IN_PROGRESS
taxon:
  id: NCBITaxon:9796
  label: Equus caballus
description: CC2D2A is a conserved coiled-coil and C2-domain-containing ciliary protein. Its retained
  architecture is consistent with a role organizing the ciliary base and transition zone, supporting ciliogenesis
  and cilia-dependent developmental signaling. The shorter horse N-terminal region corresponds chiefly
  to a disordered region of the human protein.
core_functions:
- description: Conserved ciliary scaffold expected to support cilium assembly and transition-zone organization.
