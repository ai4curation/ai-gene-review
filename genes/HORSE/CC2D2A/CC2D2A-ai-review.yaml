suggested_questions:
- question: Is CC2D2A's subdistal appendage localization and function, shown in mouse fibroblasts, conserved
    across mammals and cell types, and does it reflect a role separate from its transition-zone role in
    the MKS module?
- question: Which horse CC2D2A transcripts are expressed, and does the A0A5F5PJ44 splice form (lacking an
    N-terminal disordered segment) differ in localization or MKS-module assembly from the full-length product?
suggested_experiments:
- description: Express tagged full-length (A0A5F5PUW7) and short (A0A5F5PJ44) horse CC2D2A in Cc2d2a-null
    mouse fibroblasts and compare rescue of ciliogenesis and transition-zone localization of TMEM231 and
    B9D1.
