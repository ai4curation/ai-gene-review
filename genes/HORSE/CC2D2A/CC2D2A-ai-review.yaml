    action: NEW
    summary: CC2D2A contributes ciliary-base structure (subdistal appendages and transition zone) on which
      primary cilium assembly depends.
    reason: PAINT placed non-motile cilium assembly at PANTHER:PTN000464650, seeded by mouse and worm. Mouse
      Cc2d2a localizes to subdistal appendages by immuno-EM, is needed for their assembly and for axoneme
      extension, and the axoneme defect of Cc2d2a-null MEFs is rescued by a Cc2d2a transgene (PMID:24947469);
