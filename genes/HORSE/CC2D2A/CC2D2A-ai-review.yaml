  review:
    action: NEW
    summary: As a structural MKS-module subunit, CC2D2A is required for, and contributes to, the interdependent
      recruitment of its module partners to the transition zone.
    reason: PAINT placed this process at the same eukaryote-wide node PANTHER:PTN000464650, seeded by mouse
      and worm. The participation is structural rather than catalytic (the scaffold case); TMEM231, B9D1
      and CC2D2A depend on one another for transition-zone localization (PMID:22179047), and in C. elegans
      MKS-6 belongs to the MKS/MKSR module whose members are interdependent for TZ docking (PMID:21422230).
      Horse CC2D2A (PTHR20837:SF7) descends from the node and the benchmark model keeps the coiled-coil and
      C2 regions.
    supported_by:
