  title: Distinct functions for the paralogous RBM41 and U11/U12-65K proteins in the minor spliceosome.
  findings:
  - statement: RBM41 and its paralog U11/U12-65K bind the 3'-terminal stem-loops of U12 and U6atac
      snRNAs with comparable affinity through their C-terminal RRMs.
    supporting_text: The two paralogous proteins have a similar shared dual RNA binding specificity in
      vitro, interacting with the same 3′-terminal stem-loops of U12 and U6atac snRNAs with
      approximately equal affinity
  - statement: RBM41 is present in post-catalytic and intron-lariat minor spliceosome complexes.
    supporting_text: Together these results suggest that RBM41 is present in the minor spliceosome post
      catalytic (P) and intron lariat spliceosome (ILS) complexes
  - statement: Endogenous RBM41 localizes to Cajal bodies.
    supporting_text: Consistently, we found that endogenous RBM41 localizes to Cajal bodies, as shown
      by colocalization with coilin-GFP in HEK293 cells
  - statement: The RBM41 orthologous group arose by an ancient duplication present in LECA.
    supporting_text: solidifies it as resulting from an ancient duplication and having been present in
      LECA
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached (PMC11039992). This is the only primary study of RBM41 function. Its
      experiments are on human RBM41 (HEK293, HeLa extracts, recombinant RRM), and the review transfers
      them to horse by PANTHER SF2 orthology.
