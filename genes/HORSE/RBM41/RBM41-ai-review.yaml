taxon:
  id: NCBITaxon:9796
  label: Equus caballus
description: RBM41 (RNA-binding protein 41) is a single-RRM protein specific to the minor (U12-type)
  spliceosome. It is the paralog of the U11/U12 di-snRNP protein U11/U12-65K (RNPC3); the two arose
  from an ancient eukaryotic gene duplication. In its human ortholog, the C-terminal RRM binds the
  3'-terminal stem-loops of U12 and U6atac snRNAs. RBM41 is found in the U12 mono-snRNP and in
  post-catalytic and intron-lariat minor spliceosome complexes that contain excised U12-type intron
  lariats, and it accumulates in Cajal bodies. RBM41 is thought to act after splicing chemistry,
  during disassembly and recycling of the minor spliceosome, taking over the U12 3' stem-loop from
  U11/U12-65K. It is not essential for cell viability, but its loss alters 3' splice site choice at a
  subset of U12-type introns. The horse gene model (437 aa) includes an optional 24-residue exon in
  the N-terminal region and keeps the complete C-terminal RRM.
