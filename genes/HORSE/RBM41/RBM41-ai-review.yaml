suggested_questions:
- question: Is the optional 24-residue N-terminal exon (present in the horse and donkey models and in
    human isoform 3) conserved and used across mammals? Does it affect the unique N-terminal domain that
    BioID implicated in the association with DHX8?
- question: Does RBM41 contact intronic RNA in excised lariats directly, or only through the
    U12/U6atac snRNAs?
suggested_experiments:
- description: CLIP of RBM41 to map direct RNA contacts in vivo (snRNA stem-loops versus intron
    lariat). This would test whether pre-mRNA intronic binding applies to RBM41.
