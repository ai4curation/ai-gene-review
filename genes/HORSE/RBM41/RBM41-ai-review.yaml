  review:
    summary: The node PTN000413238 lies above the RBM41/U11-U12-65K duplication. Participation in
      minor-intron splicing is shared by both paralogs and is supported directly for the SF2
      ortholog, human RBM41.
    action: ACCEPT
    reason: Horse RBM41 is in PANTHER subfamily PTHR16105:SF2 with human RBM41. Human RBM41 is a
      component of minor spliceosome complexes (P and ILS) and of the U12 mono-snRNP. Its knockout
      changes 3' splice site selection at U12-type introns, so RBM41 does part of the work of
      U12-type splicing as a spliceosome component, mainly at post-splicing and disassembly steps.
      The general term is appropriate because GO has no U12-type-specific mRNA splicing process term
      in this branch.
    supported_by:
