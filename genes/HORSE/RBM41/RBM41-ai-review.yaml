  review:
    summary: Over-annotation. The RNA contacts shown for RBM41 are with snRNA stem-loops. Its
      association with intron lariats is through the spliceosome, not shown to be direct.
    action: MARK_AS_OVER_ANNOTATED
    reason: The only donor is Arabidopsis U11/U12-65K. For RBM41, the RRM's mapped ligands are the U12
      and U6atac snRNA 3' stem-loops. The excised-intron-lariat signal is a co-immunoprecipitation of
      spliceosome-bound lariats, which does not show direct binding to intronic sequence. The term
