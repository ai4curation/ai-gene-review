- term:
    id: GO:0030234
    label: enzyme regulator activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: enables
  supporting_entities:
  - ARBA:ARBA00026580
  review:
    summary: Correct but general. MTMR9 orthologs specifically activate partner myotubularin
      lipid phosphatases; the specific term is phosphatase activator activity.
    action: MODIFY
    reason: Phosphatase activator activity is experimentally established for human MTMR9 on
      MTMR6 and MTMR8 (EXP, PMID:19038970, PMID:22647598) and, independently, for mouse MTMR9 on
      MTMR7 (PMID:12890864, where the MTMR9 coiled coil alone suffices for binding). Human and
      mouse lie on one side of the boreoeutherian split and horse on the other, so the shared
      activity places this function at least at their common ancestor, from which the horse
      MTMR9 gene descends (all three are in PTHR10807:SF56). Note that PAINT node PTN002246859
      propagates only protein phosphatase binding and negative regulation of autophagy from human
      MTMR9 and does not propagate the activator term; the transfer here therefore rests on the
      two independent mammalian experimental orthologs, not on a PAINT IBD. The horse product
      retains the coiled coil (466-500) used for partner binding, but lacks 42 residues at the
      GRAM/phosphatase-like domain junction; the term is asserted for the gene's function, with
      the caveat that activity of this exon-skipped form is untested. GO:0019211 is_a enzyme
      activator activity, a descendant of enzyme regulator activity, and matches the human
      review's MODIFY of the same ARBA row.
    proposed_replacement_terms:
    - id: GO:0019211
      label: phosphatase activator activity
    supported_by:
    - reference_id: PMID:22647598
      supporting_text: Complex formation between the active myotubularins and MTMR9 increases
        their catalytic activity and alters their substrate specificity
    - reference_id: PMID:19038970
      supporting_text: MTMR9 increased the 3-phosphatase activity of MTMR6 up to 6-fold.
    - reference_id: PMID:12890864
      supporting_text: The coiled-coil domain of MTMR9 was sufficient for binding to MTMR7. The
