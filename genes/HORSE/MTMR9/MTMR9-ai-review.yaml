core_functions:
- description: Catalytically inactive myotubularin that heterodimerizes through its C-terminal
    coiled coil with active myotubularin phosphoinositide 3-phosphatases (MTMR6, MTMR7, MTMR8)
    and increases their activity and alters their substrate preference, acting in the cytosol.
    Function inferred from human and mouse SF56 orthologs; the exon-skipped horse product
    retains the coiled coil but lacks 42 residues at the GRAM/phosphatase-like domain junction.
  molecular_function:
    id: GO:0019211
    label: phosphatase activator activity
  locations:
