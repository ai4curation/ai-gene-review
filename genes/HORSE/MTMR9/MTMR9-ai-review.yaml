  label: Equus caballus
description: >-
  A0A9L0T3C1 is a 507-residue product of the horse MTMR9 gene (Ensembl ENSECAG00000014120,
  transcript ENSECAT00000122597) that skips one 126-nt coding exon and therefore lacks 42
  residues (human Q96QG7 positions 98-139) at the junction between the GRAM domain and the
  phosphatase-like myotubularin domain; elsewhere it is 97.8% identical to human MTMR9 and it
  retains the C-terminal coiled coil that mediates partner binding. MTMR9 is a catalytically
  inactive member of the myotubularin family (PANTHER PTHR10807:SF56): its phosphatase-like
  domain lacks the catalytic cysteine of the CX5R motif. In human and mouse it heterodimerizes
  through the coiled coil with the active phosphoinositide 3-phosphatases MTMR6, MTMR7 and
  MTMR8, increasing their catalytic activity, shifting their substrate preference (MTMR6/MTMR9
  toward PtdIns(3,5)P2, MTMR8/MTMR9 toward PtdIns(3)P) and raising partner protein levels. It is
  a soluble cytoplasmic protein with perinuclear and partial endoplasmic reticulum pools and is
  recruited to membrane ruffles during macropinocytosis. Whether the exon-skipped horse product
  is expressed as a protein and retains full partner-activating function has not been tested.
