suggested_questions:
- question: Is the exon-3-skipped horse MTMR9 transcript (ENSECAT00000122597, product A0A9L0T3C1)
    expressed as a stable protein, and does removing human-equivalent residues 98-139 affect
    folding of the phosphatase-like domain or MTMR6/MTMR8 activation?
- question: The horse MTMR9 Ensembl canonical model (F7CCR9) replaces the conserved C-terminal
    coiled-coil sequence with an unrelated tail, whereas A0A5F5PR89 matches the human protein
    over its full length. Which horse model should serve as the gene representative in PANTHER
    and UniProt?
suggested_experiments:
- description: RT-PCR across exons 2-4 of horse MTMR9 in several tissues to quantify the
    exon-3-skipped isoform, followed by co-expression with MTMR6 or MTMR8 and phosphoinositide
    phosphatase assays comparing the 507- and 549-residue products.
