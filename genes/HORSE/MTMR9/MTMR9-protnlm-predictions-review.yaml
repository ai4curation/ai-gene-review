  label: Equus caballus
status: COMPLETE
description: 'ProtNLM2 (UniProt API snapshot 2026-09-08) emitted seven GO terms for the exon-skipped horse
  MTMR9 product A0A9L0T3C1. Five are correct novel predictions transferred from experimentally characterized
  human and mouse MTMR9 orthologs in the same PANTHER subfamily (PTHR10807:SF56): positive regulation
  of phosphatase activity, regulation of phosphatidylinositol dephosphorylation, protein-containing complex,
  protein stabilization and negative regulation of autophagy (the last a non-core, partner-dependent effect).
  Enzyme regulator activity is correct but already in horse GOA. Protein phosphatase binding is uncertain
  because MTMR9''s partners are phosphoinositide phosphatases, not protein phosphatases. All transfers
  carry the caveat that this product lacks human residues 98-139.'
