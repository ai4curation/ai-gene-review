    label: protein stabilization
  predicted_term_type: GO_BP
  review:
    assessment: UNC
    confidence_score: 1
    summary: Human MTMR9 association stabilizes its partners, but the selected horse sequence contains
      a 42-residue internal deletion at the domain junction. Protein stabilization is a specific consequence
      of productive association, not established merely by sequence similarity or annotation overlap.
      Target gene-model validation or evidence that this shortened isoform retains partner stabilization
      is needed.
