  title: 'OpenScientist hypothesis run: MTMR9 negative regulation of autophagy'
  publication_type: DEEP_RESEARCH
  findings:
  - statement: OpenScientist confirmed that the shortened horse MTMR9 sequence retains the inactive PTP-like
      domain and C-terminal coiled-coil dimerization region needed for partner-mediated activity.
    supporting_text: The **PTP-like pseudophosphatase domain** (P-loop `LIHGTEGTDSTLQVT`) and the **C-terminal
      coiled-coil dimerization region** are fully conserved
  - statement: OpenScientist reported that the autophagy-suppressive role of MTMR9 is context- and partner-dependent
      rather than uniform across cell types, supporting a non-primary interpretation of GO:0010507.
    supporting_text: knockdown of MTMR5 or MTMR2, but not the unrelated phosphatase MTMR9, significantly
      enhances neuronal degradation of TDP-43
