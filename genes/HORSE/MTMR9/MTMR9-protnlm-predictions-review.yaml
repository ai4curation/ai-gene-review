    label: protein stabilization
  predicted_term_type: GO_BP
  review:
    assessment: COR
    confidence_score: 2
    summary: Formation of the MTMR6-MTMR9 heteromer increases protein levels of both partners, attributed
      to inhibition of their degradation (PMID:19038970), and MTMR9 binding raises MTMR8 stability. The
      human and mouse MTMR9 reviews accept protein stabilization as part of a core partner-binding function.
      The horse product is a 1:1 SF56 ortholog that retains the C-terminal coiled coil through which MTMR9
