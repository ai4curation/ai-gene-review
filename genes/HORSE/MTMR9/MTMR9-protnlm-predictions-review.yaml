  review:
    assessment: UNC
    confidence_score: 1
    summary: The human MTMR8–MTMR9 complex inhibits autophagy, so the prediction is biologically plausible
      and is not refuted by MTMR9 being catalytically inactive. The selected horse sequence lacks residues
