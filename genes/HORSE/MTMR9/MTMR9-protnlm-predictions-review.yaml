- source_method: ProtNLM2
  source_version: UniProt API snapshot 2026-09-08
  predicted_term:
    id: GO:0010922
    label: positive regulation of phosphatase activity
  predicted_term_type: GO_BP
  review:
    assessment: COR
    confidence_score: 2
    summary: Human MTMR9 raises the catalytic activity of its active partners MTMR6 and MTMR8 (direct
      assays, PMID:22647598), and mouse MTMR9 binds MTMR7 through its coiled coil and increases MTMR7
      activity (PMID:12890864). The human and mouse gene reviews accept this term, and the horse protein
      is a 1:1 ortholog in the same PANTHER subfamily (PTHR10807:SF56), 97.8% identical over 507 aligned
      residues and retaining the C-terminal partner-binding region. Horse GOA lacks this process term
      (it carries only enzyme regulator activity), so this is a correct novel prediction by justified
      orthology transfer. It describes regulation of partner catalysis, not intrinsic phosphatase activity;
      the 42-residue deletion at the GRAM/phosphatase-like domain junction leaves the activity of this
      exact product untested.
    supported_by:
    - reference_id: PMID:22647598
      supporting_text: 'Complex formation between the

        active myotubularins and MTMR9 increases their catalytic activity and alters

        their substrate specificity'
    - reference_id: PMID:12890864
      supporting_text: 'The coiled-coil domain of MTMR9 was sufficient for binding to

        MTMR7. The binding of MTMR9 increased the Ins(1,3)P2 phosphatase activity of

        MTMR7.'
    - reference_id: file:HORSE/MTMR9/MTMR9-bioinformatics/RESULTS.md
      supporting_text: The selected horse sequence lacks human residues 98–139, crossing the GRAM-domain/myotubularin-domain
        junction; the C-terminal region implicated in partner association is retained. Complex formation
        and downstream regulation remain inferences with a gene-model caveat.
