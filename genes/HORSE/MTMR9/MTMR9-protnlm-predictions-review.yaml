    summary: 'Human MTMR9 contributes to negative regulation of autophagy as the catalytically inactive
      activating subunit of the MTMR8-MTMR9 PtdIns(3)P phosphatase complex (PMID:22647598); the human
      and mouse reviews keep this term as non-core, and PAINT places it on node PTN002246859 within the
      MTMR9 lineage, which the horse gene descends from. The OpenScientist audit found that the horse
