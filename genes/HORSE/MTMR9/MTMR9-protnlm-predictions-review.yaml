- source_method: ProtNLM2
  source_version: UniProt API snapshot 2026-09-08
  predicted_term:
    id: GO:0010922
    label: positive regulation of phosphatase activity
  predicted_term_type: GO_BP
  review:
    assessment: COR
    confidence_score: 2
    summary: Human MTMR9 directly complexes with and regulates MTMR6/MTMR8; catalytic inactivity of MTMR9
      is compatible with this regulatory or complex-associated claim. The horse protein is 97.8% identical
      over 507 aligned residues, retaining the C-terminal association region. The 42-residue deletion
      at the GRAM/phosphatase-domain junction is a gene-model caveat, but does not remove the entire partner-binding
      region. This is an inferred conserved regulatory role, new relative to the frozen horse GOA, rather
      than evidence for intrinsic phosphatase catalysis.
    supported_by:
    - &id001
      reference_id: PMID:22647598
      supporting_text: 'Complex formation between the

        active myotubularins and MTMR9 increases their catalytic activity and alters

        their substrate specificity'
    - reference_id: file:HORSE/MTMR9/MTMR9-bioinformatics/RESULTS.md
      supporting_text: The selected horse sequence lacks human residues 98–139, crossing the GRAM-domain/myotubularin-domain
        junction; the C-terminal region implicated in partner association is retained. Complex formation
        and downstream regulation remain inferences with a gene-model caveat.
