suggested_questions:
- question: Do horse SEC23A and SEC23B differ in tissue expression (e.g. in erythroid or
    chondrogenic lineages) in a way that would make loss of SEC23A produce a CLSD-like skeletal
    phenotype in equids, as in humans?
