  review:
    summary: Sec23 is the GTPase-activating protein for the small GTPase Sar1/SAR1, an activity
      inherited by all SEC23 family members from the PTN000124617 node.
    action: ACCEPT
    reason: Sar1 GAP activity was shown biochemically for yeast Sec23p, and the PAINT node covers
      the whole SEC23 clade into which horse SEC23A falls (PTHR11141:SF7, 99% identical to human
      SEC23A, gap-free full-length alignment). This is the defining molecular function of SEC23.
      No more specific GO term for Sar1/ARF-family GAP activity exists to replace it.
    supported_by:
    - reference_id: PMID:8451644
      supporting_text: The isolated Sec23p subunit and the oligomeric complex stimulated guanosine
        triphosphatase (GTPase) activity of Sar1p 10- to 15-fold but did not activate two other
        small GTP-binding proteins involved in vesicle traffic (Ypt1p and ARF).
    - reference_id: PMID:36594468
      supporting_text: SEC23 also functions as the GTPase-activating protein for SAR1 and stimulates
        SAR1 GTP hydrolysis.
