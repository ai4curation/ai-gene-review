gene_symbol: SEC23A
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9796
  label: Equus caballus
description: >-
  SEC23A is the horse ortholog of the Sec23 subunit of the COPII coat. It is a 765-residue
  cytosolic protein with a Sec23/Sec24-type zinc finger, trunk, beta-sandwich, helical and
  gelsolin-like domains, and it heterodimerises with a SEC24 cargo adaptor to form the inner
  COPII coat. GTP-bound SAR1 recruits SEC23-SEC24 to endoplasmic reticulum exit sites by binding
  SEC23, and SEC23 then acts as the GTPase-activating protein for SAR1 before the outer
  SEC13-SEC31 cage is added. Through these activities SEC23A drives the
  formation of COPII-coated vesicles and carriers that export secretory proteins from the
  endoplasmic reticulum to the Golgi. In humans, loss-of-function mutation of SEC23A (F382L)
  impairs ER export and causes cranio-lenticulo-sutural dysplasia, with defective collagen
  secretion; the paralog SEC23B is largely functionally interchangeable. The horse protein is
  99% identical to human SEC23A and belongs to the same PANTHER subfamily.
