suggested_questions:
- question: Is A0A5F5PR89 (ENSECAT00000074905, full-length, 549 aa) or F7CCR9 (Ensembl canonical, with a divergent
    last exon that truncates the coiled coil) the predominant horse MTMR9 transcript in tissues, and should the
    PANTHER tree member for horse be switched to the full-length product?
- question: Does horse MTMR9 heterodimerize with and activate horse MTMR6 and MTMR8 with the same substrate
    preferences reported for the human complexes?
suggested_experiments:
- description: Co-express horse MTMR9 (A0A5F5PR89) with horse MTMR6 or MTMR8, test co-immunoprecipitation and
    measure 3-phosphatase activity of the purified complexes on PI3P and PI(3,5)P2 relative to the active partner
    alone.
  experiment_type: biochemical reconstitution
- description: RNA-seq or RT-PCR across horse tissues to quantify the relative usage of the full-length MTMR9
    terminal exon versus the divergent F7CCR9 terminal exon.
  experiment_type: transcript analysis
