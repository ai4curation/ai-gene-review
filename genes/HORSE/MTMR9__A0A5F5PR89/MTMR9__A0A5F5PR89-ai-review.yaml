id: A0A5F5PR89
gene_symbol: MTMR9
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9796
  label: Equus caballus
description: 'MTMR9 (myotubularin-related protein 9) is a catalytically inactive member of the myotubularin family
  of phosphoinositide 3-phosphatases. The horse protein encoded by this full-length 549-residue product has the
  family architecture: an N-terminal PH-GRAM domain, a myotubularin phosphatase-like domain in which the catalytic
  cysteine and arginine of the HCX5R active-site loop are replaced, and a C-terminal coiled coil that mediates
  dimerization. In mammals MTMR9 is a non-catalytic regulatory partner of the active myotubularins MTMR6, MTMR7
  and MTMR8: it forms heterodimers with them through the coiled coil, stabilizes the active partner, raises its
  catalytic rate and shapes its substrate preference (MTMR6-MTMR9 favours phosphatidylinositol 3,5-bisphosphate,
  MTMR8-MTMR9 favours phosphatidylinositol 3-phosphate). It is a soluble cytoplasmic protein that associates
  with intracellular membranes, the perinuclear region and membrane ruffles. These activities have been shown
  for human and mouse MTMR9; the horse protein, which is 98% identical to human MTMR9 over its full length with
  an identical active-site loop and coiled coil, is expected to share them but has not been studied directly.'
