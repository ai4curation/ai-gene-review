    summary: Proposed. MTMR9 regulates 3-phosphoinositide dephosphorylation by activating, and setting the
      substrate preference of, its partner phosphatases MTMR6 and MTMR8.
    action: NEW
    reason: MTMR9 does part of the work of this process directly, as the activating subunit of the partner
      phosphatase rather than as a substrate or a requirement upstream. In human cells and with purified
      components the MTMR8-MTMR9 and MTMR6-MTMR9 complexes have higher activity and altered substrate preference,
      and MTMR8-MTMR9 lowers cellular PI3P (PMID:22647598, PMID:19038970); human MTMR9 carries this term by IDA.
