    heterodimerizes with them, raises their catalytic rate and sets their substrate preference, thereby regulating
    3-phosphoinositide turnover. Established experimentally for human and mouse MTMR9; inferred for horse from
    full-length 98% identity, the same PANTHER subfamily and identical active-site loop and coiled coil.'
