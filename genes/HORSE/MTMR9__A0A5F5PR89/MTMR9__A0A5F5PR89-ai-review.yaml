  review:
    summary: Proposed. MTMR9 heterodimerizes with the active lipid phosphatases MTMR6, MTMR7 and MTMR8 through
      its C-terminal coiled coil.
    action: NEW
    reason: 'Binding to the active myotubularin phosphatases is the physical basis of MTMR9 function and is shown
      for human MTMR9 with MTMR6 and MTMR8 (PMID:19038970, PMID:16787938, PMID:22647598) and for mouse Mtmr9 with
      Mtmr7 (PMID:12890864). The partners are lipid phosphatases, so the general phosphatase binding term is
      used rather than protein phosphatase binding (GO:0019903); this follows the human review. PAINT placed
      the related protein phosphatase binding term at the MTMR9 node PTN002246859 (seeded by human MTMR9), which
      establishes the function as inherited across the MTMR9 clade, and the horse gene''s tree member F7CCR9
      receives that IBA. A0A5F5PR89 is not itself in the PANTHER tree, but it is the full-length product of the
      same gene, maps to PTHR10807:SF56, and its coiled coil (human 508-542) is 100% identical to human. Not
      shown experimentally in horse.'
