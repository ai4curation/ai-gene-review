id: A0A9L0SKW1
gene_symbol: OLFML2A
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9796
  label: Equus caballus
description: OLFML2A (olfactomedin-like protein 2A, photomedin-1) is a member of the olfactomedin-domain
  glycoprotein family, in the OLFML2A subfamily of the olfactomedin-related proteins. It has an N-terminal
  region carrying tandem CXCXCX9C cysteine motifs, a central coiled-coil and disordered segment, and a
  C-terminal olfactomedin domain. In mammals the canonical product has an N-terminal signal peptide. In
  the mouse it is secreted as a disulfide-linked, O-glycosylated homodimer, cleaved in the middle of the
  molecule after secretion, and it binds the sulfated glycosaminoglycans chondroitin sulfate E and
  heparin. Photomedin-1 is found in the outer segments of retinal photoreceptors and in the major
  processes of kidney podocytes. Its physiological
  role beyond glycosaminoglycan binding is not known. The horse locus encodes a signal-peptide-bearing
  product that is nearly identical in length to the human protein. This UniProt entry (599 residues) is
  one of several shorter alternative models of the gene. It lacks the signal peptide and a 22-residue
  N-terminal segment, but it keeps the complete olfactomedin domain.
