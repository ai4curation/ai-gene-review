  review:
    action: ACCEPT
    summary: OLFML2A is a secreted extracellular protein. The horse locus encodes a leader-bearing
      form, although this particular leaderless model would not be secreted on its own.
    reason: 'At the gene level the extracellular location is well grounded. (1) A0A9L0SKW1 belongs to
      PANTHER subfamily PTHR23192:SF29 (OLFACTOMEDIN-LIKE PROTEIN 2A), with experimentally characterized
      mouse photomedin-1 (Q8BHP7). That protein is secreted as a disulfide-bonded dimer and is
      proteolytically processed after secretion (PMID:15836428). (2) PAINT places extracellular region
      at the family root node PTN000573635. All SF29 members descend from that node, and human OLFML2A
      carries the corresponding IBA. (3) The earlier review left this row UNDECIDED pending a check of
      the horse transcript models. That check is now done. The same Ensembl gene (ENSECAG00000023908)
      has a RefSeq isoform, XP_023484611.2 (650 aa), which carries a hydrophobic leader homologous to
      the human 1-27 signal peptide and pairs with human over all but five positions. A0A9L0SKW1 is
      one of several leaderless alternative models of the locus, comparable to human isoform 2, which
      lacks residues 1-39. On its own sequence it has no secretion signal, and the UniProt mapping
      behind this row is an ARBA family rule rather than a sequence feature. GO describes the gene
      product, though, and the gene product is secreted. The row is accepted, and the identity caveat
      is recorded in the notes.'
    supported_by:
    - reference_id: PMID:15836428
      supporting_text: These proteins, named photomedin-1 and photomedin-2, were secreted as disulphide-bonded
        dimers (photomedin-1) or oligomers/multimers (photomedin-2) with O-linked carbohydrate chains,
        although photomedin-1 was proteolytically processed in the middle of the molecule after secretion.
    - reference_id: file:HORSE/OLFML2A/OLFML2A-bioinformatics/RESULTS-rereview.md
      supporting_text: The horse locus encodes a leader-bearing product.
    - reference_id: file:HORSE/OLFML2A/OLFML2A-bioinformatics/RESULTS-rereview.md
      supporting_text: The benchmark accession A0A9L0SKW1 is one of several leaderless alternative models
        of the same gene.
    - reference_id: file:HORSE/OLFML2A/OLFML2A-uniprot.txt
      supporting_text: DR   PANTHER; PTHR23192:SF29; OLFACTOMEDIN-LIKE PROTEIN 2A; 1.
    - reference_id: file:human/OLFML2A/OLFML2A-uniprot.txt
      supporting_text: FT   SIGNAL          1..27
- term:
    id: GO:0050840
    label: extracellular matrix binding
  evidence_type: ISS
  original_reference_id: PMID:15836428
  review:
    action: NEW
    summary: Binding of sulfated glycosaminoglycans, transferred within the OLFML2A subfamily from mouse
      photomedin-1.
    reason: Mouse photomedin-1 (Q8BHP7) carries an IDA annotation for this term from PMID:15836428. In
      a panel of ECM components it bound chondroitin sulfate E and heparin preferentially. The horse
      protein is a PANTHER SF29 ortholog of the mouse protein, and its
      olfactomedin domain is intact, including the cysteines of the conserved intradomain disulfide.
      Only the mouse protein has been assayed, and the binding site has not been mapped, so the transfer
      is made at the level of the mouse IDA term. More specific heparin-binding or chondroitin-sulfate-binding
      terms are not used. This is the only molecular activity established for the subfamily. It is not
      evidence that the protein organizes the matrix.
    supported_by:
    - reference_id: PMID:15836428
      supporting_text: Among a panel of ECM components, including glycosaminoglycans, photomedins preferentially
        bound to chondroitin sulphate-E and heparin.
    - reference_id: file:HORSE/OLFML2A/OLFML2A-uniprot.txt
      supporting_text: DR   PANTHER; PTHR23192:SF29; OLFACTOMEDIN-LIKE PROTEIN 2A; 1.
    - reference_id: file:human/OLFML2A/OLFML2A-uniprot.txt
      supporting_text: 'SUBUNIT: Homodimer. Binds to heparin and chondroitin sulfate E.'
core_functions:
- description: Secreted olfactomedin-domain glycoprotein that binds the sulfated glycosaminoglycans chondroitin
    sulfate E and heparin in the extracellular space. This activity is inferred for horse from the mouse
    ortholog in PANTHER subfamily SF29 and applies to the leader-bearing product of the locus. The
    physiological consequence of the binding is unknown.
  molecular_function:
