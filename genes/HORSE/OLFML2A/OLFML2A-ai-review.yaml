gene_symbol: OLFML2A
product_type: PROTEIN
status: IN_PROGRESS
taxon:
  id: NCBITaxon:9796
  label: Equus caballus
description: OLFML2A belongs to the photomedin family of olfactomedin-domain glycoproteins. Characterized
  mammalian photomedin-1 is a secreted, homodimeric protein that binds sulfated extracellular glycosaminoglycans.
  The selected horse protein retains the olfactomedin domain but lacks the N-terminal segment corresponding
  to the human secretion signal, leaving the localization and maturation of this particular protein model
  unresolved.
