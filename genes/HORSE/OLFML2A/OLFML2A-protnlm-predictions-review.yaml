    review_notes: Substantive computational synthesis directly addressing the selected horse accession's
      missing signal peptide and the extracellular-matrix localization prediction. The photomedin-family
      identity is independently corroborated by cached PANTHER and sequence-comparison evidence, but
      the live Ensembl/RefSeq isoform-resolution claims should be treated as curator-verification leads.
