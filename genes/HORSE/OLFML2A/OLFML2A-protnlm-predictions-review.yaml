    label: extracellular matrix organization
  predicted_term_type: GO_BP
  review:
    assessment: UNC
    confidence_score: 1
    summary: Secretion, ECM residence, glycosaminoglycan binding and self-association are supported by
      mouse photomedin experiments and conserved horse sequence. These properties make a role in ECM organization
      plausible but do not demonstrate creation, rearrangement or disassembly of matrix. A perturbation
      or reconstitution result linking OLFML2A to matrix organization is needed to support this more specific
      process claim; the prediction is not refuted simply because such evidence is missing. In addition,
      the selected horse model lacks the human signal-peptide segment, so entry into the secretory pathway
      is unresolved.
