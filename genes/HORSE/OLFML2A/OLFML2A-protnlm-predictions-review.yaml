  predicted_term:
    id: GO:0042802
    label: identical protein binding
  predicted_term_type: GO_MF
  review:
    assessment: UNC
    confidence_score: 1
    summary: Horse GOA carries no molecular-function annotation, so the term would be novel for the 
      gene. The experimental basis is mouse photomedin-1, secreted as a disulfide-bonded dimer, and 
      curated human UniProt records OLFML2A as a homodimer by similarity. That disulfide-linked 
      dimer forms in the oxidizing secretory pathway, which A0A9L0SKW1 cannot enter because it lacks
      the N-terminal signal peptide (its N-terminus MDSQ-VFGD replaces the leader matching human 
      1-27). The accession also lacks the 22-residue segment opposite human 123-144, but retains the
      region matching the human coiled coil (157-183) and the olfactomedin domain. Which region 
      mediates photomedin-1 self-association, and whether a cytosolic leaderless product could 
      dimerize non-covalently, is unresolved, so the prediction can be neither confirmed nor refuted
      for this product.
