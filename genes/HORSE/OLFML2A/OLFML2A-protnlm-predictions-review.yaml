  predicted_term:
    id: GO:0042802
    label: identical protein binding
  predicted_term_type: GO_MF
  review:
    assessment: UNC
    confidence_score: 1
    summary: Mouse photomedin-1 experiments support disulfide-linked homodimerization. The selected horse
      protein retains strong OLFML2A family similarity but lacks the human residues 2–27 corresponding
      to the secretion signal. This leaves the localization, secretory maturation and access to extracellular
      partners of this exact model unresolved. A complete transcript/isoform assignment or the original
      prediction input sequence could distinguish a gene-model problem from a biologically meaningful
      nonsecreted form; absence of a leader in this snapshot alone does not refute the extracellular identity
      of the horse gene.
