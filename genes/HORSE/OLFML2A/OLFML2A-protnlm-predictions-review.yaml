  label: Equus caballus
status: COMPLETE
description: 'A0A9L0SKW1 is a leaderless alternative model of the horse OLFML2A (photomedin-1) locus.
  Compared with the canonical signal-peptide-bearing product (RefSeq XP_023484611.2, counterpart of human
  Q68BL7 isoform 1), it lacks the N-terminal signal peptide (human residues 1-27) and a 22-residue segment
  opposite human 123-144, but keeps the complete olfactomedin domain, its conserved disulfide cysteines
  and the region matching the human coiled coil. The protein belongs to PANTHER subfamily PTHR23192:SF29
  with experimentally characterized mouse photomedin-1, and the only horse GOA annotation is extracellular
  region. Scored for this sequence, extracellular matrix, extracellular matrix binding and extracellular
  matrix organization all require secretion, which this product cannot achieve without a leader, so they
  are incorrect for this accession although true of the gene. Identical protein binding is uncertain:
  the characterized dimer is disulfide-linked and so formed in the secretory pathway, and whether the
  leaderless product self-associates by other means is unknown.'
