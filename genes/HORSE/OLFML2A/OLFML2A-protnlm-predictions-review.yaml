    summary: 'Extracellular matrix organization would require this product to act in the extracellular
      space. A0A9L0SKW1 lacks the N-terminal signal peptide: its N-terminus MDSQ-VFGD replaces the hydrophobic
      leader that aligns with human signal peptide 1-27 (maximum hydropathy 0.25 versus 2.93 for human
      and 3.13 for the leader-bearing horse isoform X1), and the record carries no SIGNAL or transmembrane
      feature; its Secreted annotation comes from an ARBA family rule. Without a secretion signal the
      product cannot reach the matrix, so it cannot participate in its organization. Independently of
      this, the gene-level case is weak: mouse photomedin-1 is a matrix-associated glycosaminoglycan-binding
      protein, and the Manabe et al. ECM screen behind the mouse acts_upstream_of_or_within annotation
      assayed several properties without the cached abstract saying which one Olfml2a satisfied.'
