- term:
    id: GO:0031629
    label: synaptic vesicle fusion to presynaptic active zone membrane
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - FB:FBgn0011288
  - PANTHER:PTN000447754
  review:
    summary: Synaptic vesicle fusion at the active zone is carried out by SNAP25. SNAP23, when forced to
      substitute for it, supports only asynchronous release.
    action: MARK_AS_OVER_ANNOTATED
    reason: This has the same origin as the synaptic vesicle priming row (PTN000447754, single Drosophila
      Snap25 donor, node above the SNAP25/SNAP23 duplication). In Snap25-null neurons, lentiviral SNAP23
      restores only asynchronous evoked release, not synchronous release. This is an overexpression rescue
      and does not show that endogenous SNAP23 acts in synaptic vesicle fusion. In mammals SNAP23 acts in
      non-neuronal exocytosis and postsynaptic membrane trafficking, so the paralog has diverged from this
      function.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: PANTHER:PTN000447754
        source_label: PTN000447754
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Synaptic SNAP-25 node seeded only by Drosophila Snap25 (FBgn0011288) and placed above
          the vertebrate SNAP25/SNAP23 duplication; the synaptic vesicle role was retained by SNAP25
          (PTHR19305:SF5) but not by SNAP23 (SF4).
    supported_by:
    - reference_id: PMID:17728451
      supporting_text: Also evoked release was rescued by all isoforms, but synchronous release required
        SNAP-25a/b in both glutamatergic and GABAergic neurons. SNAP-23 supported asynchronous release
        only, reminiscent of synaptotagmin-1 null neurons.
