- term:
    id: GO:0016082
    label: synaptic vesicle priming
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - FB:FBgn0011288
  - PANTHER:PTN000447754
  review:
    summary: Synaptic vesicle priming is a function of the neuronal paralog SNAP25; SNAP23 fails to support
      a primed vesicle pool when tested in its place.
    action: MARK_AS_OVER_ANNOTATED
    reason: This IBA comes from PTN000447754, a node seeded by Drosophila Snap25 alone and placed above
      the vertebrate SNAP25/SNAP23 split, so SNAP23 inherits it mechanically. There is evidence that SNAP23
      diverged from this function after the duplication. SNAP23 is the ubiquitously expressed paralog, and
      when it is expressed in Snap25-null chromaffin cells it does not support a standing pool of primed
      vesicles. The synaptic vesicle t-SNARE role was kept by SNAP25 (PTHR19305:SF5). No study places
      endogenous SNAP23 in synaptic vesicle priming. The term is not strictly impossible, because SNAP23 is a
      t-SNARE that can form trans complexes, but it misrepresents this protein's role.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: PANTHER:PTN000447754
        source_label: PTN000447754
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Synaptic SNAP-25 node seeded only by Drosophila Snap25 (FBgn0011288) and placed above
          the vertebrate SNAP25/SNAP23 duplication; the synaptic vesicle role was retained by SNAP25
          (PTHR19305:SF5) but not by SNAP23 (SF4).
    supported_by:
    - reference_id: PMID:12859899
      supporting_text: SNAP-25b induced larger primed vesicle pools than SNAP-25a, whereas SNAP-23 did not
        support a standing pool of primed vesicles.
    - reference_id: PMID:8663154
      supporting_text: Unlike SNAP-25, SNAP-23 was expressed in all tissues examined.
