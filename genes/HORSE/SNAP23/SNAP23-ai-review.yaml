gene_symbol: SNAP23
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9796
  label: Equus caballus
description: SNAP23 (synaptosome-associated protein 23) is the ubiquitously expressed member of the SNAP-25
  family of Qbc t-SNAREs. It contributes two SNARE coiled-coil motifs to the four-helix trans-SNARE bundle
  that it forms with a syntaxin (for example STX4 or STX11) and a vesicle VAMP, and assembly of this bundle
  drives fusion of transport and secretory vesicles with the plasma membrane. SNAP23 has no transmembrane
  domain; it is held at the plasma membrane by S-palmitoylation of a cysteine-rich linker between the two
  SNARE motifs. In mammals it mediates constitutive and regulated exocytosis in non-neuronal cells, including
  immune cells, epithelia, adipocytes and muscle, where for example it supports delivery of TLR4 and CD36
  to the cell surface. Unlike its neuronal paralog SNAP25 it supports only poorly the priming and synchronous
  fusion of synaptic vesicles. The horse protein A0A3Q2HTF1 is a full-length 211-residue product carrying
  both SNARE motifs and the conserved palmitoylated cysteines.
