core_functions:
- description: Recognizes the Sm site of Sm-class pre-snRNAs through its tandem WD40 propellers and delivers them
    to the SMN complex for cytoplasmic Sm-core assembly of spliceosomal snRNPs. Inferred from the human ortholog
    (same PANTHER subfamily, PAINT node PTN005299808 for the process) with all RNA-contact residues conserved; not
    tested in horse.
  molecular_function:
    id: GO:0017069
    label: snRNA binding
  directly_involved_in:
