  review:
    summary: Core process. PAINT places spliceosomal snRNP assembly at PTN005299808, and F6WDM0 is a full-length
      member of the same subfamily.
    action: ACCEPT
    reason: 'The IBA is the phylogenetic judgement that snRNP assembly is ancestral to the GEMIN5 clade. F6WDM0
      is in PTHR46362:SF1 and keeps the complete WD40 snRNA-recognition module with every mapped contact residue,
      so nothing argues for loss of function in horse. The experimental grounding is human: GEMIN5 binds snRNAs
      and depletion lowers Sm-core assembly (PMID:16857593); it delivers pre-snRNAs to the SMN complex (PMID:20513430).
