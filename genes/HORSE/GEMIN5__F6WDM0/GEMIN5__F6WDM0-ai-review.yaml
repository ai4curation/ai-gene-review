  review:
    summary: Binding of the m7G cap of pre-snRNAs by the WD40 module, inferred from the human ortholog; all cap-contact
      residues are conserved in horse.
    action: ACCEPT
    reason: This is an Ensembl Compara transfer from the one-to-one human ortholog Q8TEQ6 (same PANTHER subfamily
      PTHR46362:SF1, 88.8% identity over the full length). No horse protein has been tested experimentally. Human
      GEMIN5 binds the m7G cap directly in pull-downs (PMID:19750007), and the cap analogue binds at a defined site
      in the crystal structure of the WD40 module (PMID:27881601). All five residues implicated by mutation or by
      the soaked structure (W286, F338, Y474, L580, N582) are identical in F6WDM0. PAINT did not place this term
      at node PTN005299808, which spans vertebrate and insect members; that omission is a node-level judgement and
      does not count against transfer between one-to-one mammalian orthologs, but it means this activity is not
      phylogenetically established beyond mammals.
