id: F6WDM0
gene_symbol: GEMIN5
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9796
  label: Equus caballus
description: GEMIN5 (gem-associated protein 5) is a large WD40-repeat RNA-binding protein and the snRNA-recognition
  subunit of the SMN complex. Its N-terminal tandem seven-bladed WD40 propellers bind the Sm site and the 7-methylguanosine
  cap of Sm-class small nuclear RNA precursors, so that the SMN complex selects these RNAs for assembly of the heptameric
  Sm core of spliceosomal snRNPs in the cytoplasm. A central TPR-like region mediates dimerization, and a C-terminal
  non-canonical RNA-binding region binds structured mRNAs. GEMIN5 also binds the SMN mRNA 3'-UTR to promote its
  translation and binds 60S ribosomal subunits, dampening global translation. It is mainly cytoplasmic, with a smaller
  pool in the nucleoplasm and in gems. Horse F6WDM0 is the full-length (1517 aa) product of the horse GEMIN5 gene,
  a one-to-one ortholog of human GEMIN5 in PANTHER subfamily PTHR46362:SF1 (89% identity). All residues known to
  contact snRNA or the cap are conserved. None of these functions has been tested in horse; they are inferred from
  the human (and mouse) protein and from the phylogenetic placement of the gene.
