suggested_questions:
- question: PAINT node PTN005299808 propagates spliceosomal snRNP assembly, SMN complex, nucleus and mRNA 3'-UTR
    binding, but not snRNA binding or RNA 7-methylguanosine cap binding, although human GEMIN5 has IDA support for
    both and they are the activities through which it acts in snRNP assembly. Is the omission deliberate (for example
    because the Drosophila member Rigor mortis lacks the snRNA-binding evidence), and should snRNA binding be placed
    at a mammalian or vertebrate node?
- question: Does the 9-residue insertion in the second WD40 propeller of horse GEMIN5 (after human position 618)
    reflect a genuine horse-specific exon feature, and does it affect the fold or RNA binding?
suggested_experiments:
- description: Electrophoretic mobility shift or filter-binding assays with recombinant horse GEMIN5 WD40 module
    and U4 snRNA Sm-site and m7G-cap probes, with W14A/Y15A and Y474 mutants as controls, to confirm in this species
    the snRNA- and cap-binding activities inferred from human.
