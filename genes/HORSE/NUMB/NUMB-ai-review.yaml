- id: PMID:11121447
  title: Numb is an endocytic protein.
  findings:
  - statement: Mammalian Numb localizes to clathrin-coated pits, vesicles and endosomes, binds the alpha-adaptin
      appendage, and its fragments inhibit receptor-mediated internalization.
    supporting_text: Here, we demonstrate that Numb is an endocytic protein.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cached abstract and full text checked; establishes NUMB as an endocytic adaptor.
- id: PMID:24336247
  title: The clathrin adaptor Numb regulates intestinal cholesterol absorption through dynamic interaction
    with NPC1L1.
  findings:
  - statement: Numb PTB recognizes the NPC1L1 YVNXXF motif and recruits clathrin for internalization.
    supporting_text: Numb, a clathrin adaptor, specifically recognized this motif and recruited clathrin
      for internalization.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only cache; quote checked against the abstract.
- id: PMID:18657069
  title: AAK1 regulates Numb function at an early step in clathrin-mediated endocytosis.
  findings:
  - statement: AAK1 phosphorylates Numb; a T102A mutant disrupts transferrin and LDL uptake and accumulates
      at coated pits.
    supporting_text: these observations demonstrate that Numb endocytic activity is regulated by AAK1
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only cache; quotes checked against the abstract.
- id: PMID:17589506
  title: Numb and Numbl are required for maintenance of cadherin-based adhesion and polarity of neural progenitors.
  findings:
  - statement: Mouse Numb localizes to apical end-feet, interacts with cadherins and is required for their
      basolateral insertion in radial glia.
    supporting_text: Numb accumulates in the apical end-feet, where it localizes to adherens junction-associated
      vesicles and interacts with cadherins.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only cache; source of the mouse cadherin/catenin binding and apical/basolateral
      location rows transferred to horse.
- id: PMID:17174898
  title: Postnatal deletion of Numb/Numblike reveals repair and remodeling capacity in the subventricular
    neurogenic niche.
  findings:
  - statement: Postnatal Numb/Numbl deletion disrupts lateral ventricle ependymal integrity and SVZ neuroblast
      survival without increasing proliferation.
    supporting_text: These results show that Numb/Numbl are required for multiple aspects of postnatal
      SVZ homeostasis, including ependymal wall integrity and neuroblast survival.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text cached; supports lateral ventricle development but describes survival rather
      than division of SVZ neuroblasts.
- id: PMID:12410312
  title: Progenitor cell maintenance requires numb and numblike during mouse neurogenesis.
