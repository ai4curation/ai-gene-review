- term:
    id: GO:0035615
    label: clathrin-cargo adaptor activity
  evidence_type: ISS
  original_reference_id: file:HORSE/NUMB/NUMB-bioinformatics/RESULTS.md
  review:
    summary: >-
      Proposed molecular function. Mammalian NUMB (same PANTHER subfamily SF5,
      97% identical over the full length to human NUMB) recognizes the YVNXXF
      endocytic motif of NPC1L1 with its PTB domain and recruits clathrin, and
      binds the AP-2 alpha-adaptin appendage; NUMB itself performs the
      cargo-to-clathrin bridging step.
    action: NEW
    reason: >-
      This is the best-documented molecular activity of mammalian NUMB, but GOA
      for the SF5 orthologs carries it only as uninformative protein binding rows.
      The horse protein retains the full PTB domain and the C-terminal DPF/NPF
      motif region, and its subfamily placement supports transfer. Comparator
      check: the PTB-domain cargo adaptors DAB2 (P98082) and LDLRAP1 (Q5SW96)
      carry this same term from experimental evidence (QuickGO, 2026-10-21).
    supported_by:
    - reference_id: PMID:24336247
      supporting_text: Numb, a clathrin adaptor, specifically recognized this motif and recruited clathrin
        for internalization.
    - reference_id: PMID:11121447
      supporting_text: it associates with the appendage domain of alpha adaptin, a subunit of AP2, a major
        component of clathrin-coated pits
    - reference_id: file:HORSE/NUMB/NUMB-bioinformatics/RESULTS.md
      supporting_text: it is a full-length isoform 1 (p72)
- term:
    id: GO:0072583
    label: clathrin-dependent endocytosis
  evidence_type: ISS
  original_reference_id: file:HORSE/NUMB/NUMB-bioinformatics/RESULTS.md
  review:
    summary: >-
      Proposed process. Mammalian NUMB fragments act as dominant negatives on
      receptor-mediated internalization, and a non-phosphorylatable NUMB mutant
      disrupts transferrin and LDL uptake; NUMB recruits cargo into clathrin-coated
      pits.
    action: NEW
    reason: >-
      NUMB does part of the work of this process (cargo selection and clathrin
      recruitment), so this is participation, not mere necessity. Comparator
      PTB-domain cargo adaptors in the same role (human DAB2 P98082 and LDLRAP1
      Q5SW96) carry receptor-mediated endocytosis or its children (QuickGO,
      2026-10-21); clathrin-dependent endocytosis is chosen here because NUMB
      cargoes include non-receptor transmembrane proteins such as NPC1L1.
    supported_by:
    - reference_id: PMID:11121447
      supporting_text: fragments of Numb act as dominant negatives on both constitutive and ligand-regulated
        receptor-mediated internalization
    - reference_id: PMID:18657069
      supporting_text: Overexpression of a Numb point mutant (T102A) that lacks the AAK1 phosphorylation
        site potently disrupts transferrin and low-density lipoprotein internalization
