id: A0A5F5PK46
gene_symbol: NUMB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9796
  label: Equus caballus
description: >-
  NUMB (protein numb homolog) is a cytoplasmic and peripheral plasma membrane
  protein built from an N-terminal phosphotyrosine-binding (PTB) domain followed
  by a long proline-rich, largely disordered C-terminal region carrying DPF and
  NPF motifs. It acts as a monomeric clathrin-cargo adaptor: the PTB domain binds
  sorting signals in the cytoplasmic tails of transmembrane cargoes (for example
  the YVNXXF motif of NPC1L1, integrins, cadherins and metabotropic glutamate
  receptor 1), while the C-terminal region binds the alpha-adaptin appendage of
  AP-2 and EPS15, recruiting cargo into clathrin-coated pits for internalization;
  its activity is regulated by AAK1 phosphorylation. NUMB is found at the plasma
  membrane, in clathrin-coated pits and vesicles and on endosomes, and in
  polarized cells at the basolateral membrane and apical end-feet of radial glia.
  Through endocytic control of receptors it antagonizes Notch signalling and
  contributes to cell fate decisions, maintenance of neural progenitors and of
  adherens junctions in the developing and postnatal brain, dendritic spine
  development, synaptic receptor trafficking and cholesterol uptake. The horse
  protein is a full-length 652-residue ortholog of human NUMB in PANTHER subfamily
  PTHR47368:SF5.
