suggested_questions:
- question: >-
    Should vertebrate NUMB (PTHR47368:SF5) carry negative regulation of Notch
    signaling pathway? Mammalian Numb promotes Itch-dependent Notch1
    ubiquitination, but PAINT propagated this term only within the Drosophila
    numb subfamily and no vertebrate MOD has annotated it; is that a deliberate
    convention or a curation gap?
- question: >-
    Is "neuroblast division in subventricular zone" the right reading of the
    Kuo et al. 2006 Numb/Numbl phenotype, given that the paper reports survival
    defects without altered proliferation?
suggested_experiments:
- description: >-
    Express horse NUMB (wild type and a PTB-binding-pocket mutant) in NUMB/NUMBL
    double-knockdown cells and measure NPC1L1, integrin alpha5 and transferrin
    receptor internalization, to confirm that the inferred clathrin-cargo adaptor
    activity is conserved in the horse ortholog.
