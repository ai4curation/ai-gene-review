suggested_questions:
- question: Is RASGEF1A a Rap2-specific exchange factor in vivo, or does it also activate H-, K- and
    N-Ras as reported in cholangiocarcinoma cells? If it is Rap2-specific, should the family-root
    Ras protein signal transduction IBD be negated for the RASGEF1 clade, as PAINT has done for other
    Rap-GEF clades?
- question: Is the 44-residue insertion in the horse gene model (horse 112-155, within the REM region)
    supported by horse transcript data, or is it a gene-model artefact?
suggested_experiments:
- description: GTP-loading pull-down assays (RalGDS-RBD for Rap, Raf-RBD for Ras) in neural cells after
    RASGEF1A depletion or re-expression, to establish whether the physiological substrate is Rap2, Ras,
    or both.
- description: RT-PCR or long-read sequencing of horse brain RASGEF1A transcripts to test whether the
    REM-region insertion exon is expressed.
