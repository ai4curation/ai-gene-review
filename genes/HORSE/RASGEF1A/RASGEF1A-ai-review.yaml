  label: Equus caballus
description: RASGEF1A (RasGEF domain family member 1A) is a guanine nucleotide exchange factor of the
  CDC25-domain family. It has an N-terminal Ras exchanger motif (REM) and a C-terminal catalytic Ras-GEF
  domain, and it activates small GTPases by catalysing GDP release and GTP loading. Purified human RASGEF1A
  acts as a highly specific exchange factor for Rap2 and not for Rap1. An earlier cell-based and in vitro
  study instead reported exchange activity on K-, H- and N-Ras and increased cell motility, so whether it
  acts on Ras-subfamily GTPases is disputed. The human protein is detected in brain and spinal cord. The
  horse protein A0A9L0R5H6 is the full-length ortholog (96% identity to human, both GEF domains intact).
  Its gene model has a 5-residue N-terminal extension and a 44-residue insertion within the REM region.
