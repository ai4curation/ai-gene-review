- description: Guanine nucleotide exchange factor that activates small GTPases by catalysing GDP-GTP
    exchange through its CDC25-type Ras-GEF domain. Purified-protein data indicate a strong preference
    for Rap2; reported activity on Ras-subfamily GTPases is disputed.
