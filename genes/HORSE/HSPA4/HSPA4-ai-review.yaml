suggested_questions:
- question: Is the 800-aa horse transcript ENSECAT00000106098, which skips the exon encoding human HSPA4
    residues 679-718, supported by full-length transcript evidence? Does the encoded protein keep Hsc70
    nucleotide-exchange activity and the ability to support disaggregation?
suggested_experiments:
- description: Express full-length horse HSPA4 (F6YZJ4) and the exon-skipped form (A0A9L0S5Z5). Compare
    their stimulation of Hsc70 ADP release, Hsc70 ATPase turnover, and Hsc70/DNAJB1-dependent refolding
    of aggregated luciferase, across a range of concentrations.
