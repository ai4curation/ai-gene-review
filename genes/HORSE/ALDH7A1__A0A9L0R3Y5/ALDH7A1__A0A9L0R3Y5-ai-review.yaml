    NAD+-dependent oxidation of alpha-aminoadipic semialdehyde (in equilibrium with
    delta-1-piperideine-6-carboxylate) to alpha-aminoadipate, a step of L-lysine degradation. For
    horse this is inferred, not measured. PAINT places the activity and process at the vertebrate
    ALDH7A1 node PTN000192435, seeded by human, mouse and zebrafish experiments. Horse A0A9L0R3Y5
    conserves every catalytic, NAD-binding and AASA-binding residue of the human enzyme. The
    lysine-catabolic enzyme is mitochondrial (matrix) in vertebrates, with a cytosolic form as well.
