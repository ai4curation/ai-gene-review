id: A0A9L0R3Y5
gene_symbol: ALDH7A1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9796
  label: Equus caballus
description: >-
  Horse ALDH7A1 (antiquitin; alpha-aminoadipic semialdehyde dehydrogenase) is a member of the
  aldehyde dehydrogenase superfamily, family 7. A0A9L0R3Y5 is the full-length Ensembl canonical
  translation (566 aa) of horse gene ENSECAG00000010547. It contains every residue of human ALDH7A1
  (P49419) with no internal gap and is 95.7% identical to it. The proton-acceptor glutamate, the
  nucleophilic cysteine, the NAD(+)-binding residues and the alpha-aminoadipic semialdehyde-binding
  residues characterized in the human enzyme are all conserved. By descent from the vertebrate
  ALDH7A1 node of the PTHR43521 family tree, the horse protein is inferred to be a homotetrameric
  NAD(+)-dependent dehydrogenase. Its main reaction would be the oxidation of alpha-aminoadipic
  semialdehyde (in equilibrium with delta-1-piperideine-6-carboxylate) to alpha-aminoadipate in
  L-lysine degradation. It would also oxidize betaine aldehyde, medium-chain aldehydes and
  lipid-peroxidation-derived aldehydes. In vertebrates the enzyme occurs in mitochondria (matrix) and
  cytosol, with nuclear and stress-recruited membrane pools. Compared with human and mouse, the horse
  canonical model carries a 27-residue arginine-rich N-terminal extension ahead of the conserved
  mitochondrial targeting region. None of these functions or locations has been measured on the
  horse protein itself.
