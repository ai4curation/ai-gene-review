  review:
    summary: >-
      The defining activity of ALDH7A1 is AASA/P6C oxidation to alpha-aminoadipate. It is inferred
      for horse from the PAINT vertebrate node and from conserved substrate-binding residues.
    action: ACCEPT
    reason: >-
      This is the core catalytic function of the ALDH7A1 clade. Human enzyme assays and patient
      biochemistry establish it (PMID:20207735, PMID:16491085), as do mouse and zebrafish
      experiments. PAINT placed GO:0004043 at PTN000192435 from those three seeds, so the function is
      inherited across bony vertebrates, and horse is inside that clade. Horse retains the three
      residues that bind (S)-2-amino-6-oxohexanoate in the human enzyme (T358, G516, A517), the
      catalytic E323 and C357, and E454 (human E427, the PDE hot spot). No horse-specific evidence of
      loss exists. The ARBA source is not counted as support.
    supported_by:
    - reference_id: PMID:16491085
      supporting_text: these mutations abolish the activity of antiquitin as a
        delta1-piperideine-6-carboxylate (P6C)-alpha-aminoadipic semialdehyde (alpha-AASA) dehydrogenase.
    - reference_id: PMID:20207735
      supporting_text: including the osmolyte precursor, betaine aldehyde, lipid peroxidation-derived
        aldehydes, and the intermediate lysine degradation product, alpha-aminoadipic semialdehyde.
    - reference_id: file:interpro/panther/PTHR43521/PTHR43521-paint.tsv
      supporting_text: MGI:MGI:108186|UniProtKB:P49419|ZFIN:ZDB-GENE-030131-6129
    - reference_id: file:HORSE/ALDH7A1__A0A9L0R3Y5/ALDH7A1__A0A9L0R3Y5-bioinformatics/RESULTS.md
