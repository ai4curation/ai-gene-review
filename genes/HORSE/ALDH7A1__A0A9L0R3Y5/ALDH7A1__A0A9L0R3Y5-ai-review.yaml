  review:
    summary: >-
      Mitochondrial ALDH7A1 is the lysine-catabolic form. PAINT places this location at the
      vertebrate node from mouse and human data. Horse import is inferred, with an unresolved
      N-terminal caveat.
    action: ACCEPT
    reason: >-
      PAINT placed GO:0005739 at PTN000192435 with human and mouse seeds, and the human
      targeting-sequence isoform is mitochondrial (PMID:20207735). Horse conserves the human-equivalent
      transit region at residues 28..53. In the canonical model it is preceded by a 27-residue
      Arg-rich extension absent from human and mouse. Whether translation starts at the upstream
      methionine, and whether import is affected, is unverified. Since a presequence-like extension
      is unlikely to abolish targeting, the location is accepted as inferred rather than observed.
    supported_by:
    - reference_id: file:HORSE/ALDH7A1__A0A9L0R3Y5/ALDH7A1__A0A9L0R3Y5-bioinformatics/RESULTS.md
