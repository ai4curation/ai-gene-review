    supporting_text: 'Gapless end-to-end alignment: 753 aligned positions, 720 identical (95.6% identity).'
  - reference_id: PMID:17018530
    supporting_text: >-
      These findings strongly indicate that LOXL3 encodes
      two variants, LOXL3 and LOXL3-sv1, both of which function as amine oxidases with
      distinct tissue and substrate specificities from one another.
