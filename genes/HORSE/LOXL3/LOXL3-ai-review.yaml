suggested_questions:
- question: >-
    Does horse LOXL3 show the same substrate preferences among collagen types,
    elastin and fibronectin as the human and mouse orthologs, and is it expressed
    in equine cartilage, tendon and palate?
- question: >-
    Is the reported SRCR-dependent nuclear STAT3 deacetylation activity of LOXL3
    reproducible, and does it occur for the equine protein?
suggested_experiments:
- description: >-
    Express recombinant horse LOXL3 and assay BAPN-inhibitable amine oxidase
    activity against collagen I/II, elastin and fibronectin substrates.
