core_functions:
- description: >-
    Secreted copper- and LTQ-dependent protein-lysine 6-oxidase that oxidatively
    deaminates peptidyl lysine residues in collagen and elastin precursors to
    allysine in the extracellular matrix, initiating covalent cross-linking that
    organizes and stabilizes collagen fibrils. Transferred from the human and mouse
    LOXL3 orthologs in the same PANTHER subfamily (PTHR45817:SF2); all catalytic
    residues are conserved in horse.
  molecular_function:
    id: GO:0004720
    label: protein-lysine 6-oxidase activity
