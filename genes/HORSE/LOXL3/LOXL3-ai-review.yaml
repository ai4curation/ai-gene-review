    reason: >-
      PAINT placed protein-lysine 6-oxidase activity at PTN002550804, the root of
      PTHR45817, with human LOXL3 (P58215) itself among the experimental seeds.
      Horse A0A9L0TKN1 sits in the LOXL3 subfamily PTHR45817:SF2 with P58215 and
