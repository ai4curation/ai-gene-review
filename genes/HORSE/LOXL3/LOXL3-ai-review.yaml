id: A0A9L0TKN1
gene_symbol: LOXL3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9796
  label: Equus caballus
description: >-
  LOXL3 (lysyl oxidase-like 3) encodes a secreted copper- and lysine
  tyrosylquinone (LTQ)-dependent protein-lysine 6-oxidase of the lysyl oxidase
  family. The 753-residue horse precursor has an N-terminal signal peptide, four
  scavenger receptor cysteine-rich (SRCR) domains and a C-terminal lysyl oxidase
  catalytic domain that retains the copper-binding histidines and the lysine and
  tyrosine residues that form the LTQ cofactor. By orthology with the
  experimentally characterized human and mouse proteins (same PANTHER subfamily,
  ~96% identity to human LOXL3), it oxidatively deaminates peptidyl lysines in
  collagen and elastin precursors, generating allysine residues that initiate
  covalent cross-linking and stabilize collagen fibrils in the extracellular
  matrix. Mouse Loxl3 also oxidizes fibronectin at the myotendinous junction, and
  its loss reduces collagen cross-links and causes cleft palate and spinal
  deformity. A single study reports a nuclear, STAT3-deacetylating activity of the
  SRCR region; this intracellular role is secondary and has not been examined in
  horse.
