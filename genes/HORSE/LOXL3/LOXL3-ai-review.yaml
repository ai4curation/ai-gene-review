    label: peptidyl-lysine oxidation
  evidence_type: ISS
  original_reference_id: file:HORSE/LOXL3/LOXL3-bioinformatics/RESULTS.md
  review:
    summary: The process that the core catalytic activity directly executes; missing from horse GOA.
    action: NEW
    reason: >-
      LOXL3 itself catalyzes the oxidation of peptidyl lysine to allysine, so
      this is direct participation, not substrate necessity. The human ortholog
      (P58215, same PANTHER subfamily SF2) carries this process, and horse
      LOXL3 is full length with every catalytic residue conserved. The term is
      the process counterpart of protein-lysine 6-oxidase activity and is not
      an ancestor or descendant of collagen fibril organization.
    supported_by:
    - reference_id: file:HORSE/LOXL3/LOXL3-bioinformatics/RESULTS.md
      supporting_text: 'LTQ cofactor residues conserved: human K634 -> horse K634; human Y670 -> horse Y670.'
