gene_symbol: ATG3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9796
  label: Equus caballus
description: ATG3 is the E2-like conjugating enzyme of the autophagy ubiquitin-like conjugation systems.
  After the E1 ATG7 activates an ATG8-family protein (LC3 or GABARAP), ATG3 accepts it as a thioester
  on its catalytic cysteine and, together with the E3-like ATG12~ATG5-ATG16L1 complex, transfers its C-terminal
  glycine to phosphatidylethanolamine in the phagophore membrane, which drives phagophore expansion during
  autophagosome assembly. ATG3 cycles between binding ATG7 and binding the E3; an N-terminal amphipathic
  helix senses membrane curvature and lipid-packing defects and restricts lipidation to the target membrane,
  and a noncanonical LIR motif contacts LC3/GABARAP. ATG3 also conjugates ATG12 onto itself, and the ATG12-ATG3
  conjugate influences mitochondrial homeostasis. ATG3 is a soluble cytosolic protein recruited to phagophore
  membranes. This horse gene model (342 residues) is 98.4% identical to human ATG3 over its full length,
  keeps the catalytic cysteine and known functional motifs, and carries a 28-residue internal insertion
  in the catalytic core that is absent from human ATG3 and from other horse ATG3 models.
