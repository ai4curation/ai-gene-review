  - *id001
  - *id007
suggested_questions:
- question: Is the 28-residue insertion (horse 223-250) shared by horse and donkey ATG3 gene models an
    expressed equid exon, and is a protein carrying it in the catalytic core active in LC3 lipidation
    and ATG12 autoconjugation?
suggested_experiments:
- description: RT-PCR and long-read sequencing of horse tissue ATG3 transcripts to test whether the insertion-containing
    isoform is expressed; then express 342- and 314-residue forms in ATG3-knockout cells and compare LC3-II
    formation and in vitro LC3-PE conjugation.
