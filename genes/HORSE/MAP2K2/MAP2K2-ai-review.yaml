id: A0A9L0SHX8
gene_symbol: MAP2K2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9796
  label: Equus caballus
description: MAP2K2 (MEK2) is a cytoplasmic dual-specificity protein kinase of the MAP kinase kinase family that
  acts in the RAF-MEK-ERK cascade. Once activated by RAF phosphorylation of its activation loop, it phosphorylates
  the threonine and tyrosine of the Thr-Glu-Tyr motif in the activation loop of the ERK1 and ERK2 MAP kinases, relaying
  growth-factor and mitogen signals to ERK-dependent control of proliferation and differentiation. The horse entry
  A0A9L0SHX8 is one of several gene-model products of the horse MAP2K2 locus; it retains the N-terminal ERK-docking
  region and the catalytic core (human residues 1-363) but carries an unrelated 27-residue C-terminal tail in place
  of the final part of the kinase domain and the C-terminal DVD docking region.
