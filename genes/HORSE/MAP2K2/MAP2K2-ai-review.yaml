      MEK1/MEK2 activate only ERK1/ERK2 (human MEK2 phosphorylates and activates ERK1, PMID:8388392), so the precise
      process is GO:0070371 ERK1 and ERK2 cascade, an is_a descendant of GO:0000165, which the human MAP2K2 review
      accepts. A0A9L0SHX8 is an alternative horse MAP2K2 gene model that retains human MEK2 residues 1-363 (Lys101,
