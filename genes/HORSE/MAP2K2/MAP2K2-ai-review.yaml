core_functions:
- description: Dual-specificity MAP kinase kinase that phosphorylates the activation-loop threonine and tyrosine
    of ERK1/ERK2 in the RAF-MEK-ERK cascade. Inferred for the horse MAP2K2 gene product from PAINT node PTN000684494
    and human MEK2 biochemistry; the A0A9L0SHX8 model lacks the C-terminal DVD region and its own activity is untested.
  molecular_function:
    id: GO:0004708
    label: MAP kinase kinase activity
  directly_involved_in:
  - id: GO:0070371
    label: ERK1 and ERK2 cascade
  supported_by:
  - *id002
  - *id003
  - *id001
  - reference_id: PMID:15866172
    supporting_text: DVD site is a stretch of about 20 amino acids immediately on the C-terminal side of the MAPKK
      catalytic domain
suggested_questions:
- question: Is the horse MAP2K2 transcript ENSECAT00000136538 (A0A9L0SHX8), whose final exon replaces human MEK2
    residues 364-400, supported by RNA-seq junction reads, or is it a gene-build artefact? Which horse transcript
    encodes the human-like 400-residue MEK2?
- question: Should horse MAP2K2 GO annotation be anchored on a corrected full-length gene model (A0A9L0SHX8 residues
    1-363 joined to the F6YUU0 C-terminal exon) rather than on the current defective models?
- question: Are the ARBA-propagated endosome, Golgi-inheritance and mitochondrial terms MEK2 properties, or MEK1/ERK
    properties transferred to MEK2 through review-based TAS annotations?
suggested_experiments:
- hypothesis: Loss of the end of the kinase domain and the DVD docking site in the A0A9L0SHX8 product abolishes
    RAF-dependent activation of horse MEK2.
  description: Express full-length horse MEK2 (reconstructed human-like model) and the A0A9L0SHX8 product, co-express
    with BRAF or RAF1, and compare activation-loop Ser222/Ser226 phosphorylation and phosphorylation of kinase-dead
    ERK2 in vitro.
