  review:
    assessment: COR
    confidence_score: 2
    summary: MAP2K2 (MEK2) is a dual-specificity MAP kinase kinase that itself phosphorylates the threonine
      and tyrosine of the ERK1/ERK2 activation loop, so the gene product performs protein phosphorylation
      rather than merely being required for it. Human MEK2 phosphorylates and activates ERK1 in vitro
      (PMID:8388392), and horse MAP2K2 descends from PAINT node PTN000684494, which asserts MAP kinase kinase
      activity with human MEK2 among its seeds. A0A9L0SHX8 is an alternative horse MAP2K2 gene model that
      retains human residues 1-363 with Lys101, Asp194 and Ser222/Ser226 conserved, but carries an unrelated
      C-terminal tail; the prediction is judged as a claim about the horse MAP2K2 gene product, and the
      catalytic competence of this particular model is untested. Neither this entry nor any other horse
      MAP2K2 product (A0A9L0SF07, F6YUU0, A0A9L0R4J0, A0A9L0SD26) carries GO:0006468 or a descendant in
      GOA; MAPK cascade and ERK1 and ERK2 cascade are signal-transduction terms, not is_a descendants of
      protein phosphorylation, and the kinase MF terms are in a different aspect. The broad BP is therefore
      correct and novel. Training-set membership is unknown.
    supported_by:
    - reference_id: file:human/MAP2K2/MAP2K2-uniprot.txt
      supporting_text: 'CC   -!- FUNCTION: Catalyzes the concomitant phosphorylation of a threonine and

