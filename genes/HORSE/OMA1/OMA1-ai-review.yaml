- term:
    id: GO:0043065
    label: positive regulation of apoptotic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q96E52
  - ensembl:ENSP00000360270
  review:
    summary: In apoptosis, BAX/BAK activate OMA1, and OPA1 cleavage by OMA1 remodels cristae and promotes
      cytochrome c release. This is a real but context-dependent role downstream of the core proteolytic
      activity.
    action: KEEP_AS_NON_CORE
    reason: The human IDA (PMID:25275009) and the OMA1 siRNA delay of staurosporine apoptosis
      (PMID:20038677) support the term, and OMA1 makes the cristae-remodelling cut. Apoptotic regulation is
      one context of OPA1 processing rather than the enzyme's defining function, so it is kept as non-core.
    supported_by:
    - reference_id: PMID:25275009
      supporting_text: Knockdown or knockout of OMA1 in these cells attenuated cytochrome c
        release.
    - reference_id: PMID:20038677
      supporting_text: OMA1 siRNA inhibited apoptosis
- term:
    id: GO:0140467
    label: integrated stress response signaling
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q96E52
  - ensembl:ENSP00000360270
  review:
    summary: OMA1 generates the signal of the mitochondrial branch of the ISR by cleaving DELE1. This is
      a direct, catalytic contribution to the signaling pathway.
    action: ACCEPT
    reason: Two independent human studies (IDA, PMID:32132706, PMID:32132707) define an OMA1-DELE1-HRI
      relay. OMA1 performs the DELE1 cleavage that produces the cytosolic signalling fragment, so it does
      part of the work of the pathway. Transfer to horse rests on the one-to-one ortholog in subfamily SF1
      with a conserved active site. DELE1 and HRI are present in horse, but the pathway has not been tested
      in horse cells.
    supported_by:
    - reference_id: PMID:32132706
      supporting_text: We show that the
        mitochondrial protease OMA1 and the poorly characterized protein DELE1, together
        with HRI, constitute the missing pathway that is triggered by mitochondrial
        stress.
- term:
    id: GO:0140468
    label: HRI-mediated signaling
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q96E52
  - ensembl:ENSP00000360270
  review:
    summary: OMA1 acts upstream of HRI. Its DELE1 cleavage product binds and activates HRI. Human curators
      annotated this term by IDA, and it is a specific child of integrated stress response signaling.
    action: KEEP_AS_NON_CORE
    reason: GO defines the term as signal transmission via HRI. OMA1 contributes the signal-generating step
      that activates HRI and has no role in what HRI does afterwards. The human IDA rows are not overruled,
      and the term is kept at the precision the curators chose. It is marked non-core because the signalling
      kinase is HRI, while OMA1's defining activity is the upstream mitochondrial proteolysis.
    supported_by:
    - reference_id: PMID:32132707
      supporting_text: 'we identified factors upstream of HRI:

        OMA1, a mitochondrial stress-activated protease'
- term:
    id: GO:1903850
    label: regulation of cristae formation
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q96E52
  - ensembl:ENSP00000360270
  review:
    summary: OPA1 cleavage by OMA1 is described as critical for cristae remodelling during apoptosis.
