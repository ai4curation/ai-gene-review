suggested_questions:
- question: Is the horse transcript ENSECAT00000099022 (A0A9L0R9P8), whose C-terminal ~110 residues replace
    the conserved segment equivalent to human ~401-460 (Cys407, C-terminal autocatalytic region), a real
    expressed isoform or a gene-model artefact? Would F6YE56 or a model with the conserved exon be a better
    gene-centric canonical?
suggested_experiments:
- description: RNA-seq/long-read support check of horse OMA1 3' exon structure, and expression of the
    A0A9L0R9P8 and F6YE56 products in OMA1-knockout cells to test whether each can restore CCCP-induced
    OPA1 S1 cleavage.
  experiment_type: complementation assay
