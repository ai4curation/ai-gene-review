  review:
    summary: Core catalytic activity of OMA1. The PAINT node PTN000506393 places metalloendopeptidase
      activity at the base of the OMA1/M48 clade, and horse OMA1 (PTHR22726:SF1) is inside it with every
      zinc ligand and the catalytic glutamate conserved.
