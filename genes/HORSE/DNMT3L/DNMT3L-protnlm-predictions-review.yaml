id: A0A9L0T837
gene_symbol: DNMT3L
taxon:
  id: NCBITaxon:9796
  label: Equus caballus
status: COMPLETE
description: DNMT3L is a catalytically inactive nuclear regulator of DNMT3A/DNMT3B de novo DNA methylation.
  Both ProtNLM2 predictions are biologically correct for the conserved horse ortholog; nucleus is already
  carried by horse GOA, and regulation of gene expression is less precise than the horse annotation to
  negative regulation of gene expression, epigenetic.
