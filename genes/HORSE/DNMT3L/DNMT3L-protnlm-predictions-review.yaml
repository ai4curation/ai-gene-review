- source_method: ProtNLM2
  source_version: UniProt API snapshot 2026-09-08
  predicted_term:
    id: GO:0010468
    label: regulation of gene expression
  predicted_term_type: GO_BP
  review:
    assessment: LSP
    confidence_score: 2
    summary: Loss of mouse Dnmt3L abolishes maternal methylation imprints and causes biallelic expression
      of maternally imprinted genes, and human DNMT3L represses transcription in an HDAC1-dependent manner.
      The horse protein is a full-length ortholog. Horse GOA carries negative regulation of gene expression,
      epigenetic (GO:0045814), accepted in the gene review and an is_a descendant of GO:0010468, so this
      broad prediction is correct but less precise than the existing annotation.
    supported_by:
    - reference_id: PMID:11719692
      supporting_text: Lack of maternal methylation imprints in heterozygous embryos derived from homozygous
        mutant oocytes caused biallelic expression of genes that are normally expressed only from the allele
        of paternal origin.
    - reference_id: PMID:12202768
      supporting_text: We find that Dnmt3L can repress transcription and that this repression is dependent
        on HDAC1 and is relieved by treatment with the HDAC inhibitor trichostatin A.
    - reference_id: file:HORSE/DNMT3L/DNMT3L-bioinformatics/RESULTS.md
      supporting_text: share 77.7% identity among 386 paired residues. Paired coverage is 100.0% of human
        and 90.6% of horse.
