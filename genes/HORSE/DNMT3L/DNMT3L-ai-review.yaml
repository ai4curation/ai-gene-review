id: A0A9L0T837
gene_symbol: DNMT3L
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9796
  label: Equus caballus
description: >-
  DNMT3L (DNA methyltransferase 3-like) is a catalytically inactive member of the DNMT3
  family that regulates de novo DNA methylation. It has an amino-terminal ADD
  (ATRX-DNMT3-DNMT3L) cysteine-rich zinc-binding domain, which binds the amino-terminal
  tail of histone H3 when lysine 4 is unmethylated, and a carboxy-terminal
  methyltransferase-like domain that lacks the catalytic motifs of active DNA
  methyltransferases. Through the carboxy-terminal domain DNMT3L binds the catalytic
  domains of DNMT3A and DNMT3B, forming heterotetramers in which DNMT3L stimulates DNA
  and S-adenosyl-L-methionine binding and methyl transfer by its partner. DNMT3L is a
  nuclear protein expressed mainly in germ cells during the periods of de novo
  methylation and in embryonic stem cells. In mouse it is required to establish maternal
  methylation imprints in oocytes and to methylate and silence retrotransposons in
  prospermatogonia, where it acts with the piRNA pathway. In embryonic stem cells it also
  limits methylation at bivalent, Polycomb-marked promoters by competing with DNMT3A and
  DNMT3B for PRC2. The horse protein A0A9L0T837 is a full-length product of the DNMT3L
  gene in the same PANTHER subfamily as human and mouse DNMT3L; its function is inferred
  from those orthologs, since no horse-specific assay has been reported.
