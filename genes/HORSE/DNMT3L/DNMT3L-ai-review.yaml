- term:
    id: GO:0006346
    label: DNA methylation-dependent constitutive heterochromatin formation
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q9CWR8
  - ensembl:ENSMUSP00000000746
  review:
    summary: Correct but general; the specific DNMT3L-dependent heterochromatin process is piRNA-directed
      transposon methylation (GO:0141196), a descendant of this term that the gene already carries.
    action: MODIFY
    reason: DNMT3L participates in DNA methylation-dependent silencing as the activating subunit of DNMT3A
      (and DNMT3C in rodents). Its best-documented heterochromatin-forming role is de novo methylation
      of dispersed retrotransposons in prospermatogonia. Tandem pericentric repeats, the classical constitutive
      heterochromatin, are methylated normally in Dnmt3l-null germ cells (Bourc'his and Bestor 2004),
      so the general term over-reaches unless restricted to the transposon case. GO:0141196 transposable
      element silencing by piRNA-mediated DNA methylation is an is_a descendant of GO:0006346 (verified
      via OLS hierarchy) and is already annotated to this gene.
    proposed_replacement_terms:
    - id: GO:0141196
      label: transposable element silencing by piRNA-mediated DNA methylation
    supported_by:
    - reference_id: PMID:15318244
      supporting_text: Whereas dispersed repeated sequences were demethylated in mutant germ cells, tandem
        repeats in pericentric regions were methylated normally.
    - reference_id: PMID:15318244
      supporting_text: Deletion of the Dnmt3L gene prevented the de novo methylation of both long-terminal-repeat
        (LTR) and non-LTR retrotransposons
- term:
    id: GO:0007141
    label: male meiosis I
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q9CWR8
  - ensembl:ENSMUSP00000000746
  review:
    summary: Projection of a mouse knockout phenotype (meiotic failure in spermatocytes) that the source
      paper attributes to an earlier defect in cells that do express Dnmt3L.
    action: REMOVE
    reason: The mouse IMP (Bourc'his and Bestor 2004) shows that Dnmt3l-null males have meiotic catastrophe,
      but the same paper states that spermatocytes do not express Dnmt3L. The meiotic failure is a downstream
      consequence of retrotransposon hypomethylation in perinatal prospermatogonia, not participation of
      DNMT3L in meiosis I. The GO term asserts that the gene product does some of the work of meiosis,
      which DNMT3L cannot do in cells where it is absent. Its real contribution is captured by the transposon-silencing
      and imprinting terms.
    supported_by:
    - reference_id: PMID:15318244
      supporting_text: Loss of Dnmt3L from early germ cells also caused meiotic failure in spermatocytes,
        which do not express Dnmt3L.
