core_functions:
- description: Activates the de novo DNA methyltransferases DNMT3A and DNMT3B by binding their catalytic
    domains through its catalytically inactive C-terminal methyltransferase-like domain, forming a DNA
    methyltransferase heterotetramer and accelerating DNA and AdoMet binding.
  molecular_function:
    id: GO:0008047
    label: enzyme activator activity
  directly_involved_in:
  - id: GO:0071514
    label: genomic imprinting
  - id: GO:0141196
    label: transposable element silencing by piRNA-mediated DNA methylation
  locations:
  - id: GO:0005634
    label: nucleus
  in_complex:
    id: GO:0140020
    label: DNA methyltransferase complex
  supported_by:
  - reference_id: PMID:15671018
    supporting_text: We show here that Dnmt3L stimulates the catalytic activity of the Dnmt3A and Dnmt3B
      enzymes by directly binding to their respective catalytic domains via its own C-terminal domain.
  - reference_id: PMID:17713477
    supporting_text: forming a tetrameric complex with two active sites
  - reference_id: file:HORSE/DNMT3L/DNMT3L-bioinformatics/RESULTS-rereview.md
    supporting_text: Human Phe261, whose substitution F261A abolishes binding to DNMT3A (UniProt Q9UJW3
      MUTAGEN, PMID:17713477), aligns to horse Phe301.
- description: Reads chromatin through its ADD domain, binding the histone H3 amino-terminal tail when
    lysine 4 is unmethylated, which links de novo DNA methylation to H3K4me0 chromatin.
  molecular_function:
    id: GO:0140006
    label: histone H3 reader activity
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:17687327
    supporting_text: DNMT3L specifically interacts with the extreme amino terminus of histone H3; this
      interaction was strongly inhibited by methylation at lysine 4 of histone H3 but was insensitive to
      modifications at other positions.
  - reference_id: file:HORSE/DNMT3L/DNMT3L-bioinformatics/RESULTS-rereview.md
    supporting_text: All cysteines in the human ADD domain (human 41-173) are conserved in horse
suggested_questions:
- question: Should GO have a DNA methyltransferase activator activity term (child of enzyme activator activity)
    so that DNMT3L's specific activating function is expressible?
- question: Is the meiotic catastrophe in Dnmt3l-null males fully explained by retrotransposon reactivation
    in prospermatogonia, given that spermatocytes do not express DNMT3L?
- question: Does horse DNMT3L, like mouse, function with a germline-specific DNMT3 paralog, or only with
    DNMT3A (DNMT3C is rodent-specific)?
suggested_experiments:
- description: Test whether recombinant horse DNMT3L C-terminal domain stimulates horse DNMT3A catalytic-domain
    methyltransferase activity and whether the F301A substitution abolishes binding and stimulation.
- description: Profile DNMT3L expression and retrotransposon/imprint methylation in equine fetal gonads
    and oocytes to confirm the germline timing seen in mouse.
