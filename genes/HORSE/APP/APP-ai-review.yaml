id: A0A3Q2IKB0
gene_symbol: APP
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9796
  label: Equus caballus
description: 'APP (amyloid-beta precursor protein) is a single-pass type I membrane glycoprotein of the APP family.
  At the neuronal surface the full-length protein acts as an adhesion and receptor-like molecule: copper-dependent
  trans-dimerization of its E1 and E2 ectodomains between neighbouring cells promotes synapse formation, and the
  protein supports neurite outgrowth and axonogenesis, partly by binding heparin and other extracellular matrix
  components. APP traffics from the ER and Golgi to the plasma membrane and is internalized into endosomes. Sequential
  cleavage by alpha- or beta-secretase and gamma-secretase releases a soluble ectodomain, amyloid-beta peptides
  and a cytoplasmic intracellular domain (AICD). Kunitz-domain isoforms (APP751/770) inhibit serine proteases. Amyloid-beta
  peptides bind copper and zinc and aggregate into oligomers and fibrils that activate glia and impair synaptic
  plasticity. The cytoplasmic tail normally carries a YENPTY motif that binds PTB-domain adaptors such as FE65/APBB1
  and X11/APBA and mediates clathrin-dependent endocytosis. Horse A0A3Q2IKB0 is the Ensembl-canonical gene model
  of horse APP: a 768-residue KPI-containing, OX-2-lacking (APP751-like) ectodomain with a human-identical amyloid-beta
  region, but with an unrelated C-terminal tail after human Glu738 that lacks the YENPTY motif, which other horse
  APP transcripts retain.'
