  review:
    summary: Nucleus (SubCell mapping of an ARBA-derived location). In human and mouse, the gamma-secretase-released
      AICD fragment enters the nucleus together with FE65/APBB1.
    action: MARK_AS_OVER_ANNOTATED
    reason: Nuclear localization belongs to the AICD fragment, not to full-length APP, and depends on the C-terminal
      YENPTY motif that recruits FE65/APBB1. A0A3Q2IKB0 has an unrelated C-terminal tail after human Glu738 and
      lacks YENPTY, so this gene model cannot make the nuclear-targeted AICD. Other horse APP transcripts (F6XKR3,
      A0A3Q2HIF9) do retain the motif.
