suggested_questions:
- question: Is the C-terminal tail of the Ensembl-canonical horse APP model ENSECAT00000045461 (A0A3Q2IKB0), which
    lacks the conserved YENPTY motif, supported by any horse transcript evidence, or is it a gene-model artefact
    that should be replaced by a transcript ending in the conserved APP C-terminus (as in F6XKR3)?
- question: Which APP isoforms (APP695 versus KPI-containing APP751/770) are expressed in horse brain and peripheral
    tissues, and does the human-type amyloid-beta sequence lead to amyloid deposition in aged horses?
suggested_experiments:
- description: RT-PCR or long-read sequencing of horse brain APP transcripts across the last two exons, to test
    whether the divergent C-terminal exon of ENSECAT00000045461 is expressed and translated.
