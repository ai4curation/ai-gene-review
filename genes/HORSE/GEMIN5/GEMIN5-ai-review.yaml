suggested_questions:
- question: PAINT node PTN005299808 propagates spliceosomal snRNP assembly, SMN complex, nucleus and mRNA
    3'-UTR binding, but not snRNA binding or 7-methylguanosine cap binding, although the human ortholog
    has IDA support for both. Is leaving them out a deliberate judgement, for example that they belong
    to a narrower clade, or is it a gap?
- question: Is the horse transcript ENSECAT00000103662 (A0A9L0R5P7), which skips the linker equivalent
    to human 723-798, expressed as protein? Does losing this phosphorylation/SUMOylation-rich linker
    change GEMIN5 regulation?
suggested_experiments:
- description: RT-PCR or long-read RNA-seq across the exon junction encoding the human 723-798 equivalent
    in horse tissues, to establish whether the shorter isoform is expressed and how abundant it is relative
    to the full-length F6WDM0 transcript.
