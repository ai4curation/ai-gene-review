  review:
    action: KEEP_AS_NON_CORE
    summary: GEMIN5 has a minor nuclear pool that colocalizes with SMN in gems.
    reason: Immunolocalization of the human ortholog shows a nuclear pool in addition to the predominant
      cytoplasmic one. PAINT also placed nucleus (is_active_in) at PTN005299808. The isoform-specific
      deletion does not remove any region known to determine localization. snRNP assembly by the SMN
      complex takes place mainly in the cytoplasm, so the nuclear pool is peripheral to the core function.
    supported_by:
    - reference_id: PMID:11714716
      supporting_text: "Immunolocalization studies demonstrate that Gemin5 is found in the cytoplasm and\
        \ \nin the nucleus, where it colocalizes with SMN in gems."
