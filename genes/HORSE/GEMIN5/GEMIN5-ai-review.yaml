  review:
    action: UNDECIDED
    summary: The exact horse model has a deletion affecting the RNA-recognition region.
    reason: Human GEMIN5 binds the SMN 3′-UTR directly, but the selected horse sequence lacks human723–798
      at the tandem-WD40 module boundary. ARBA does not resolve whether the modified module still supports
      the relevant RNA interaction. The gene-family function is well grounded; functionality of this selected
      model needs verification.
    supported_by:
    - reference_id: PMID:25911097
      supporting_text: Gemin5 directly binds to the mature SMN 3′-UTR immediately upstream of the poly(A)
        tail.
    - reference_id: file:HORSE/GEMIN5/GEMIN5-bioinformatics/RESULTS.md
