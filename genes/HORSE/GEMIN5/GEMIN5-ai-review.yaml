  label: Equus caballus
description: >-
  GEMIN5 (gem-associated protein 5) is a large WD40-repeat RNA-binding protein and the snRNA-recognition
  subunit of the SMN complex. Its N-terminal tandem seven-bladed WD40 propellers bind the Sm site and
  7-methylguanosine cap of small nuclear RNAs, so that the SMN complex can select snRNAs for Sm-core
  (snRNP) assembly in the cytoplasm. A central TPR-like dimerization region and a C-terminal non-canonical
  RNA-binding region support interactions with structured mRNAs and ribosomes. Through these GEMIN5 binds
  the SMN mRNA 3'-UTR and regulates translation. The protein is mainly cytoplasmic, with a smaller nuclear
  pool in gems. This horse entry (1433 aa) is an alternative-transcript product of the GEMIN5 gene. It
  keeps the complete WD40 module, with all of its mapped RNA-contact residues, and the C-terminal regions.
  It lacks a 76-residue disordered linker (human 723-798) that lies just after the WD40 fold and carries
  phosphorylation and SUMOylation sites.
existing_annotations:
- term:
    id: GO:0003730
    label: mRNA 3'-UTR binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: enables
  supporting_entities:
  - ARBA:ARBA00028422
  review:
    action: ACCEPT
    summary: GEMIN5 binds the SMN mRNA 3'-UTR. The activity is inherited within PANTHER subfamily PTHR46362:SF1,
      and this isoform keeps the RNA-binding regions.
    reason: Human GEMIN5, in the same PANTHER subfamily (PTHR46362:SF1, sequence identity 89%), binds
      the SMN 3'-UTR directly (PMID:25911097). PAINT curators placed mRNA 3'-UTR binding at node PTN005299808,
      with mouse and human donors, and propagated it as an IBA to the full-length horse product F6WDM0
      of this same gene. The earlier review marked this row UNDECIDED because the isoform has an internal
      deletion. Re-analysis shows that the missing block (human 723-798) lies C-terminal to the folded
      tandem WD40 domain (residues 3-722 in the crystal structure). It falls in a region annotated as disordered.
      All mapped RNA-contact residues and the TPR-like and RBS regions are retained. Nothing therefore
      argues against inheritance. The ARBA term agrees with the phylogenetic inference.
    supported_by:
    - reference_id: PMID:25911097
      supporting_text: Gemin5 directly binds to the mature SMN 3′-UTR immediately upstream of the poly(A)
        tail.
    - reference_id: file:HORSE/GEMIN5/GEMIN5-bioinformatics/rereview/RESULTS-rereview.md
      supporting_text: It therefore sits C-terminal to the structured RNA-recognition module, not inside
        it.
    - reference_id: file:HORSE/GEMIN5/GEMIN5-uniprot.txt
      record_section: ["DR:PANTHER"]
      supporting_text: DR   PANTHER; PTHR46362:SF1; GEM-ASSOCIATED PROTEIN 5; 1.
