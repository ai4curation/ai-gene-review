taxon:
  id: NCBITaxon:9796
  label: Equus caballus
description: GEMIN5 is a conserved multidomain RNA-binding protein related to the mammalian snRNP-assembly
  and translation regulator. The selected horse model retains most of the protein but lacks a segment
  spanning the end of its N-terminal WD40 RNA-recognition module, leaving some RNA-binding and assembly
  functions uncertain. Cytoplasmic and nuclear localization are consistent with characterized GEMIN5 proteins.
