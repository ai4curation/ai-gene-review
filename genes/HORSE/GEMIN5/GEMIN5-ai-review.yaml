    summary: A nuclear gem-associated pool is plausible for the conserved GEMIN5 protein.
    reason: Human immunolocalization establishes this additional pool. The horse sequence retains the
      large GEMIN5 architecture and C-terminal interaction regions; the internal RNA-recognition deletion
      does not itself refute nuclear localization.
