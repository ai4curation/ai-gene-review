      of snRNAs.
  - reference_id: PMID:27881601
    supporting_text: The 2.0 Å structure shows that the G5N region encompassing residues 3–722 is folded
      into two seven-bladed WD40 repeat domains.
  - reference_id: file:HORSE/GEMIN5/GEMIN5-bioinformatics/rereview/RESULTS-rereview.md
    supporting_text: All 12 human residues mutated in PMID:27881601 (N13, W14, Y15, R33, R335, M357, R359,
      F381, Y383, M403, W422, Y474) are identical at the aligned positions in both A0A9L0R5P7 and F6WDM0.
