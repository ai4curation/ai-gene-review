- source_method: ProtNLM2
  source_version: UniProt API snapshot 2026-09-08
  predicted_term:
    id: GO:0006417
    label: regulation of translation
  predicted_term_type: GO_BP
  review:
    assessment: CNN
    confidence_score: 2
    summary: In human cells GEMIN5 binding to the SMN 3'-UTR increases SMN translation, and GEMIN5 bound
      to ribosomes through its N-terminal domain dampens global protein synthesis, so it regulates translation
      in both directions. The horse product keeps the relevant RNA-binding regions and is in the same
      PANTHER subfamily, which justifies transfer as an inference. The full-length product F6WDM0 already
      carries regulation of translation in GOA (Ensembl Compara IEA), and the gene review of this product
      uses the same term in its core functions, so the prediction is correct but not novel.
    supported_by:
