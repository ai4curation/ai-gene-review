  review:
    assessment: LSP
    confidence_score: 2
    summary: Human imaging establishes a nuclear GEMIN5 pool, consistent with the conserved horse protein
      architecture. The frozen horse GOA already has the more specific nucleoplasm location, whose biological
      rationale is supported by the human imaging. The predicted nucleus term is therefore less specific;
