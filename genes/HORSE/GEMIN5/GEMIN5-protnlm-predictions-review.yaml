  predicted_term:
    id: GO:0016567
    label: protein ubiquitination
  predicted_term_type: GO_BP
  review:
    assessment: UNC
    confidence_score: 1
    summary: The characterised activities of GEMIN5 are snRNA and cap recognition for snRNP assembly,
      SMN mRNA 3'-UTR binding and ribosome-associated translation control. Neither the human nor the horse
      gene review, the GOA files of either horse product, nor a PubMed search for GEMIN5 with ubiquitin,
      ubiquitination or E3 (three hits, none describing a GEMIN5 role in ubiquitination) supports participation
      in protein ubiquitination. GEMIN5 has no ubiquitin-ligase or ubiquitin-binding domain, but the absence
      of a catalytic domain would not by itself refute a noncatalytic role. No evidence supports or refutes
      the prediction.
    supported_by:
    - reference_id: PMID:27881600
      supporting_text: 'the WD40 domain of Gemin5 is both necessary and

        sufficient for binding the Sm site of pre-snRNAs'
    - reference_id: PMID:25911097
      supporting_text: Gemin5 binding to the SMN 3′-UTR activates expression of SMN protein by increasing
        translation of the SMN mRNA.
    - *panther
- source_method: ProtNLM2
  source_version: UniProt API snapshot 2026-09-08
  predicted_term:
    id: GO:0005634
    label: nucleus
  predicted_term_type: GO_CC
  review:
    assessment: UNC
    confidence_score: 1
    summary: Immunolocalization of human GEMIN5 shows a minor nuclear pool that colocalizes with SMN in
      gems, besides the predominant cytoplasmic pool, so nucleus is true of the gene (and less specific
      than the nucleoplasm and Gemini of Cajal bodies annotations the gene carries). For this product the
      call is unresolved. A0A9L0R5P7 lacks the block equivalent to human 723-798, which in the full-length
      horse product F6WDM0 includes the basic-residue cluster at 748-757 (PKPKKKKK), a lysine run of the
      kind that can act as a classical monopartite nuclear localization signal; the product keeps a shorter
      KKRK motif at its residue 765. No nuclear-import determinant of GEMIN5 has been mapped, and its nuclear pool
      could instead depend on co-import with the SMN complex, so it cannot be told whether this product
      keeps what nuclear localization requires.
    supported_by:
    - reference_id: PMID:11714716
      supporting_text: "Immunolocalization studies demonstrate that Gemin5 is found in the cytoplasm and\
        \ \nin the nucleus, where it colocalizes with SMN in gems."
    - &deletion
      reference_id: file:HORSE/GEMIN5/GEMIN5-bioinformatics/rereview/RESULTS-rereview.md
      supporting_text: It lacks a 76-residue internal block that corresponds to human 723-798.
    - &basic
      reference_id: file:HORSE/GEMIN5__F6WDM0/GEMIN5__F6WDM0-uniprot.txt
      supporting_text: FT   COMPBIAS        748..757
