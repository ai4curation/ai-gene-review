  predicted_term:
    id: GO:0000340
    label: RNA 7-methylguanosine cap binding
  predicted_term_type: GO_MF
  review:
    assessment: CNN
    confidence_score: 2
    summary: Human GEMIN5 binds the m7G cap directly in pull-down assays, and a soaked m7GTP structure
      places the cap in the central pore of the second WD40 propeller, stacked by Tyr474 and contacted
      by Leu580 and Asn582. A0A9L0R5P7 keeps the complete folded WD40 module; the deletion lies C-terminal
      to it. A direct ungapped comparison of the downloaded sequences in this assessment shows the cap-site
      residues W286, F338, Y474, L580 and N582 identical to human. The transfer from the same PANTHER subfamily
      is therefore justified. The gene already carries this term in GOA on its full-length product F6WDM0
      (Ensembl Compara IEA, accepted by its review), so the prediction is correct but not novel.
    supported_by:
    - reference_id: PMID:19750007
      supporting_text: Gemin5 binds directly to the m7G cap structure.
    - reference_id: PMID:27881600
      supporting_text: 'the WD40 domain of Gemin5 recognizes the Sm site

        and m7G cap of pre-snRNAs via two distinct binding sites'
    - reference_id: PMID:27881601
      supporting_text: In the present structure, Tyr474 stacks m7G from one side, but the other side is
        contacted by Leu580 and Asn582.
    - *panther
    - *fold
