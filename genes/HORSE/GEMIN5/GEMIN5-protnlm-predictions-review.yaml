- source_method: ProtNLM2
  source_version: UniProt API snapshot 2026-09-08
  predicted_term:
    id: GO:0000387
    label: spliceosomal snRNP assembly
  predicted_term_type: GO_BP
  review:
    assessment: CNN
    confidence_score: 2
    summary: Human GEMIN5 binds the Sm site of snRNAs through its tandem WD40 domain and is required for
      SMN-complex Sm-core assembly. A0A9L0R5P7 is in the same PANTHER subfamily (PTHR46362:SF1), shares
      89% identity with human, and keeps the complete folded WD40 module (human 3-722) with all 12 mutationally
      validated RNA-contact residues; its missing block (human 723-798) is a disordered linker outside
      the fold. The transfer is therefore justified, as an inference from the human ortholog. The gene
      already carries this term in GOA on its full-length product F6WDM0 (IBA from PAINT and Ensembl Compara
      IEA), and the gene review lists it as a core process of this product, so the prediction is correct
      but not novel.
    supported_by:
    - reference_id: PMID:16857593
      supporting_text: Reduction of Gemin5 results in
    - reference_id: PMID:27881600
      supporting_text: 'the WD40 domain of Gemin5 is both necessary and

        sufficient for binding the Sm site of pre-snRNAs'
    - reference_id: PMID:27881601
      supporting_text: The 2.0 Å structure shows that the G5N region encompassing residues 3–722 is folded
        into two seven-bladed WD40 repeat domains.
    - &panther
      reference_id: file:HORSE/GEMIN5/GEMIN5-uniprot.txt
      supporting_text: DR   PANTHER; PTHR46362:SF1; GEM-ASSOCIATED PROTEIN 5; 1.
    - &fold
      reference_id: file:HORSE/GEMIN5/GEMIN5-bioinformatics/rereview/RESULTS-rereview.md
      supporting_text: It therefore sits C-terminal to the structured RNA-recognition module, not inside
        it.
    - &residues
      reference_id: file:HORSE/GEMIN5/GEMIN5-bioinformatics/rereview/RESULTS-rereview.md
      supporting_text: All 12 human residues mutated in PMID:27881601 (N13, W14, Y15, R33, R335, M357, R359,
        F381, Y383, M403, W422, Y474) are identical at the aligned positions in both A0A9L0R5P7 and F6WDM0.
- source_method: ProtNLM2
