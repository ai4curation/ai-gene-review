id: A0A9L0R5P7
gene_symbol: GEMIN5
taxon:
  id: NCBITaxon:9796
  label: Equus caballus
status: COMPLETE
description: A0A9L0R5P7 is an alternative-transcript product of horse GEMIN5 that keeps the complete
  tandem WD40 snRNA/cap-recognition module and the C-terminal RNA-binding regions, and lacks only a
  disordered linker equivalent to human 723-798, which contains the protein's lysine-rich basic cluster
  (horse F6WDM0 748-757). Three ProtNLM2 predictions (spliceosomal snRNP assembly, RNA 7-methylguanosine
  cap binding, regulation of translation) depend on regions this product retains, are supported by human
  ortholog experiments within the same PANTHER subfamily, and are already carried by this gene in GOA
  (CNN). Nucleus and mRNA 3'-UTR binding are true of the gene but depend on determinants that have not
  been mapped, so whether the deleted basic linker is needed for them on this product is unresolved (UNC).
  Protein ubiquitination has no supporting evidence for GEMIN5 or its relatives (UNC).
