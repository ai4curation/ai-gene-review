  predicted_term_type: GO_BP
  review:
    assessment: UNC
    confidence_score: 1
    summary: The retrieved primary studies establish GEMIN5 RNA recognition, snRNP assembly and translation
      regulation. They do not establish a role executing or regulating protein ubiquitination. Being ubiquitinated,
      interacting with a ubiquitin-system protein, or changing proteostasis indirectly is insufficient
      for this process assignment. A direct mechanistic contribution to the ubiquitination process is
      needed; the absence of a catalytic ubiquitin-ligase domain alone would not refute noncatalytic participation.
