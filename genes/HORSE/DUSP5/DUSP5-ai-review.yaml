suggested_questions:
- question: Does horse DUSP5 show the same mitogen- and stress-inducible expression and nuclear ERK anchoring as the human protein, for example in equine fibroblasts or immune cells?
- question: Should the nuclear anchoring of ERK2 by DUSP5 (KIM plus NLS dependent) be captured as a process annotation such as protein localization to nucleus, given that DUSP5 itself supplies the NLS that retains ERK2?
suggested_experiments:
- description: Express horse DUSP5 (wild type and C263S) in equine cells and measure nuclear phospho-ERK1/2, JNK and p38 after growth-factor stimulation to confirm ERK-selective nuclear inactivation and anchoring.
