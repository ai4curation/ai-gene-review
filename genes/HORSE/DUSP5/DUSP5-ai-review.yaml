  title: Specific inactivation and nuclear anchoring of extracellular signal-regulated kinase 2 by the inducible dual-specificity protein phosphatase DUSP5.
  findings:
  - statement: Human DUSP5 binds ERK2 through an N-terminal KIM, inactivates ERK2 but not JNK or p38, and anchors ERK2 in the nucleus via its own NLS.
    supporting_text: Nuclear anchoring is ERK2 specific and requires both interactions between the DUSP5 KIM and the common docking site of ERK2 and a functional NLS within DUSP5.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached (PMC549372); human DUSP5 characterization, transferred to horse via PTHR10159:SF40 orthology.
