taxon:
  id: NCBITaxon:9796
  label: Equus caballus
description: DUSP5 is an inducible, nuclear dual-specificity protein phosphatase of the MAP kinase phosphatase (MKP) family. It has an N-terminal rhodanese-like domain carrying a kinase-interaction motif (KIM) and a nuclear localization signal, and a C-terminal dual-specificity phosphatase catalytic domain with a phosphocysteine-intermediate active site (Cys263 in the HCxxGxxRS P-loop). In mammals DUSP5 is encoded by an immediate-early gene induced by mitogens and stress; it binds ERK1/2 through the KIM, dephosphorylates the activation-loop phosphothreonine and phosphotyrosine of ERK, and anchors inactivated ERK2 in the nucleus, while sparing JNK and p38. It therefore acts as a nuclear, ERK-selective negative-feedback regulator of the ERK1/ERK2 cascade. The horse protein (384 aa) is full length and about 95% identical to human DUSP5, with the catalytic site, NLS and domain architecture conserved, and sits in the same PANTHER subfamily (PTHR10159:SF40); its function is inferred from the characterized
  human ortholog.
