id: F6ZKQ4
gene_symbol: MITF
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9796
  label: Equus caballus
description: MITF (melanocyte inducing transcription factor) is a basic helix-loop-helix leucine-zipper
  (bHLH-Zip) transcription factor of the MiT/TFE family (with TFE3, TFEB and TFEC). It binds E-box (CACGTG)
  and M-box (TCATGTG) elements as a homodimer or as a heterodimer with other MiT/TFE members and activates
  RNA polymerase II transcription of pigmentation genes such as TYR and TYRP1, acting as the master regulator
  of melanocyte survival, differentiation and melanosome biogenesis. This horse gene product (413 aa) is
  the melanocyte-type MITF-M isoform, transcribed from the melanocyte-specific promoter and lacking the
  6-residue alternatively spliced segment upstream of the basic region; it is 97.8% identical to human
  MITF-M. It lacks the longer N terminus of the widely expressed MITF-A-type isoforms, which in those isoforms
  mediates Rag GTPase binding, lysosomal recruitment and mTORC1-dependent degradation. In horses, a variant
  in the melanocyte-specific promoter and coding variants (a frameshift and a basic-region N310S substitution
  that reduces M-box binding) cause splashed white and related white-spotting coat phenotypes.
