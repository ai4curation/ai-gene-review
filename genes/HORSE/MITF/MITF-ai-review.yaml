- id: PMID:22511888
  title: Mutations in MITF and PAX3 cause "splashed white" and other white spotting phenotypes in horses.
  findings:
  - statement: A 10 bp insertion in the horse melanocyte-specific MITF promoter and two coding variants
      cause splashed white and other white-spotting phenotypes.
    supporting_text: We therefore sequenced the MITF gene and found a 10 bp insertion in the melanocyte-specific
      promoter.
  - statement: Recombinant horse MITF bHLH-Zip binds an M-box oligonucleotide; the basic-region N310S variant
      reduces binding by about 80%.
    supporting_text: We analyzed the DNA binding properties of the mutant MITF in an electrophoretic mobility
      shift assay and found that DNA binding activity was reduced by about 80%
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached. The EMSA protein is horse MITF residues 112-207 of Q95MD1, identical in
      sequence to the corresponding region of F6ZKQ4. The only horse-specific functional evidence for MITF.
- id: PMID:9647758
  title: Identification of a novel isoform of microphthalmia-associated transcription factor that is enriched
    in retinal pigment epithelium.
  findings:
  - statement: MITF-M is melanocyte-restricted, MITF-A is widely expressed, and both differ only at the
      N terminus; MITF-A activates TYR and TYRP1 transcription.
    supporting_text: MITF-M mRNA is exclusively expressed in melanocytes and melanoma cells
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only cache; human/mouse study defining the isoform structure used to identify F6ZKQ4
      as an MITF-M product.
- id: PMID:10587587
  title: Ser298 of MITF, a mutation site in Waardenburg syndrome type 2, is a phosphorylation site with functional
    significance.
  findings:
  - statement: MITF-M Ser298 (GSK3 site) enhances tyrosinase promoter binding; the site is conserved as
      Ser-292 in horse MITF-M(-) F6ZKQ4.
    supporting_text: Glycogen synthase kinase 3 (GSK3) was found to phosphorylate Ser298 in vitro,
      thereby enhancing the binding of MITF to the tyrosinase promoter.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only cache; human MITF-M study.
- id: PMID:23401004
  title: Rag GTPases mediate amino acid-dependent recruitment of TFEB and MITF to lysosomes.
  findings:
  - statement: Rag binding and lysosomal recruitment depend on an N-terminal region shared by TFEB and MITF-A-type
      isoforms but absent from MITF-M, so this regulation is not transferred to F6ZKQ4.
    supporting_text: In contrast, no homology was observed between the N terminus of TFEB and MITF isoforms
      4, 5, and 6 or TFEC.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text cached; used to scope lysosomal recruitment away from the MITF-M product.
- id: PMID:36608670
  title: A central role for regulated protein stability in the control of TFE3 and MITF by nutrients.
  findings: []
  reference_review:
