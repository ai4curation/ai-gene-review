  review:
    summary: Branched-chain-amino-acid transamination is the established catalytic reaction.
    action: MODIFY
    reason: Branched-chain-amino-acid transamination is the established catalytic reaction. This assessment
      transfers characterized mammalian biology to the selected horse sequence with the sequence limitations
      stated in the comparison.
    supported_by:
    - &id001
      reference_id: file:human/BCAT2/BCAT2-uniprot.txt
      supporting_text: 'CC   -!- FUNCTION: Catalyzes the first reaction in the catabolism of the

        CC       essential branched chain amino acids leucine, isoleucine, and valine

        CC       (PubMed:17050531, PubMed:25653144, PubMed:8702755). Branched chain

        CC       amino acid catabolism plays a role in adipocyte differentiation by

        CC       providing lipogenic acetyl-CoA pools in differentiated adipocytes (By

        CC       similarity). Mechanistically, acetyl-CoA derived from branched chain

        CC       amino acid catabolism is used by EP300/p300 to acetylate and inhibit

        CC       PRDM16, thereby preventing adipose tissue browning (By similarity). May

        CC       also function as a transporter of branched chain alpha-keto acids (By

        CC       similarity). {ECO:0000250|UniProtKB:O35854,

        CC       ECO:0000250|UniProtKB:O35855, ECO:0000269|PubMed:17050531,

        CC       ECO:0000269|PubMed:25653144, ECO:0000269|PubMed:8702755}.'
    - &id002
      reference_id: file:HORSE/BCAT2/BCAT2-bioinformatics/RESULTS.md
      supporting_text: The horse sequence A0A9L0TSN4 (452 residues) aligns to human O15382 (392 residues)
        with 83.42% identity across 392 paired residues. Paired coverage is 100.0% of the human sequence
        and 86.73% of the horse sequence.
    - &id003
      reference_id: PMID:17050531
      supporting_text: 'Mammalian branched chain aminotransferases (BCATs) have a unique CXXC center.

        Kinetic and structural studies of three CXXC center mutants (C315A, C318A, and

        C315A/C318A) of human mitochondrial (hBCATm) isozyme and the oxidized hBCATm

        enzyme (hBCATm-Ox) have been used to elucidate the role of this center in hBCATm

        catalysis. X-ray crystallography revealed that the CXXC motif, through its

        network of hydrogen bonds, plays a crucial role in orienting the substrate

        optimally for catalysis. In all structures, there were changes in the structure

        of the beta-turn preceding the CXXC motif when compared with wild type protein.'
    proposed_replacement_terms:
