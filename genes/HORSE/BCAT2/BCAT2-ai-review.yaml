- term:
    id: GO:0030170
    label: pyridoxal phosphate binding
  evidence_type: ISS
  original_reference_id: PMID:11264579
  qualifier: enables
  review:
    summary: >-
      PLP is the covalently bound cofactor of BCAT2 (Schiff base to the
      active-site lysine), shown structurally for human BCAT2; the
      corresponding lysine is conserved in the horse protein.
    action: NEW
    reason: >-
      PLP binding is an intrinsic part of the enzyme's catalytic mechanism and
      is supported by structural data for the human ortholog in the same
      subfamily, plus conservation of the Schiff-base lysine (human K229) in the
      horse sequence. It is not an ancestor or descendant of the transaminase
      term, so it adds cofactor information rather than redundancy.
    supported_by:
    - reference_id: PMID:11264579
      supporting_text: The 4'-aldehyde of the PLP cofactor is covalently linked to the epsilon-amino group
        of the active-site lysine
    - reference_id: file:HORSE/BCAT2/BCAT2-bioinformatics/RESULTS-rereview.md
      supporting_text: '| A0A9L0TSN4 | K/K | C/C | C/C | R/R | Y/Y | Y/Y | V/V | V/V | T/T |'
