suggested_questions:
- question: >-
    Is the 59-residue Gly/Arg/Pro-rich upstream extension of horse model
    A0A9L0TSN4 ever translated, or does translation initiate at Met60 as in
    other mammals? If translated, is the extended protein still imported into
    mitochondria and processed?
suggested_experiments:
- description: >-
    Map the horse BCAT2 translation start by 5'-RACE plus ribosome profiling or
    N-terminal proteomics of equine muscle or liver, and test mitochondrial
    import of tagged full-length (1-452) versus Met60-initiated constructs.
