id: A0A9L0TSN4
gene_symbol: BCAT2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9796
  label: Equus caballus
description: >-
  BCAT2 encodes the mitochondrial branched-chain-amino-acid aminotransferase, a
  pyridoxal 5'-phosphate (PLP)-dependent class-IV aminotransferase that
  reversibly transfers the alpha-amino group of leucine, isoleucine and valine to
  2-oxoglutarate, producing glutamate and the corresponding branched-chain
  2-oxo acids. This transamination is the first step of branched-chain amino
  acid catabolism; the 2-oxo acid products are then oxidatively decarboxylated
  by the mitochondrial branched-chain 2-oxo acid dehydrogenase complex. The
  enzyme is a homodimer whose active site lies near the dimer interface, with
  PLP bound as a Schiff base to an active-site lysine and a redox-sensitive CXXC
  motif that positions substrate for catalysis. Mammalian orthologs carry a
  27-residue N-terminal mitochondrial presequence that is removed on import. The
  horse protein A0A9L0TSN4 is a gene model of BCAT2 (PANTHER subfamily
  PTHR11825:SF39) whose residues 60-452 correspond to the full conserved
  mammalian enzyme, including the presequence; residues 1-59 are a Gly/Arg/Pro-rich
  extension absent from reviewed mammalian orthologs.
