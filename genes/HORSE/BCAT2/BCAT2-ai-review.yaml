- term:
    id: GO:0004084
    label: branched-chain-amino-acid:2-oxoglutarate transaminase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - ARBA:ARBA00087482
  - InterPro:IPR005786
  - InterPro:IPR033939
  - EC:2.6.1.42
  review:
    summary: >-
      Core molecular function. Branched-chain amino acid transamination is
      experimentally established for the human and rat orthologs in the same
      PANTHER subfamily (SF39), and the PAINT root node of PTHR11825
      (PTN000214535) carries the L-leucine, L-isoleucine and L-valine
      2-oxoglutarate transaminase activities, so the horse protein inherits
      them by descent. All catalytic and substrate-binding residues are retained.
    action: ACCEPT
    reason: >-
      Evolutionary grounding: the horse protein is in PTHR11825:SF39 together
      with human O15382 and rat O35854, both with experimental activity; PAINT
      placed the three branched-chain transaminase activities (GO:0052654,
      GO:0052655, GO:0052656, all is_a GO:0004084) at PTN000214535, the family
      root, seeded by human, rat, fly and fission yeast data
      (interpro/panther/PTHR11825/PTHR11825-paint.tsv). Sequence: residues
      60-452 align to the full human enzyme at 83.4% identity with the PLP
      lysine (human K229), CXXC cysteines (human C342/C345) and curated
      substrate contacts conserved. The 59-residue N-terminal extension lies
      outside the catalytic domains and does not affect this inference.
    supported_by:
    - reference_id: file:human/BCAT2/BCAT2-uniprot.txt
      supporting_text: 'Reaction=L-leucine + 2-oxoglutarate = 4-methyl-2-oxopentanoate + L-'
    - reference_id: PMID:9165094
      supporting_text: When rat BCAT(m) is overexpressed in COS-1 cells, the protein exhibits BCAT activity
    - reference_id: PMID:17050531
      supporting_text: X-ray crystallography revealed that the CXXC motif, through its network of hydrogen
        bonds, plays a crucial role in orienting the substrate optimally for catalysis.
    - reference_id: file:HORSE/BCAT2/BCAT2-bioinformatics/RESULTS-rereview.md
      supporting_text: '| A0A9L0TSN4 | K/K | C/C | C/C | R/R | Y/Y | Y/Y | V/V | V/V | T/T |'
    - reference_id: file:HORSE/BCAT2/BCAT2-uniprot.txt
      supporting_text: PTHR11825:SF39; BRANCHED-CHAIN-AMINO-ACID AMINOTRANSFERASE, MITOCHONDRIAL
- term:
    id: GO:0005739
    label: mitochondrion
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  supporting_entities:
  - UniProtKB-SubCell:SL-0173
  review:
    summary: >-
      BCAT2 is the mitochondrial isozyme: the PAINT eukaryotic node
      PTN000214536 carries mitochondrion, and the horse protein is in the
      mitochondrial subfamily SF39 and retains the region corresponding to the
      27-residue mammalian presequence (horse residues 60-86). The location
      holds for the gene product; whether this particular gene model, with 59
      extra upstream residues, is a real translation product is unverified.
    action: ACCEPT
    reason: >-
      The previous review left this UNDECIDED because of the N-terminal
      extension. On re-examination the location claim concerns the BCAT2 gene
      product, and the evolutionary evidence is strong: PAINT placed
      mitochondrion at PTN000214536 (taxon Eukaryota) seeded by human, mouse,
      rat, budding yeast and fission yeast data, and rat BCAT2 is processed at
      its mitochondrial targeting sequence when expressed in cells. The horse
      sequence beginning at Met60 matches the conserved mammalian N terminus
      that contains the presequence, and the 59-residue upstream extension is
      found in no reviewed mammalian ortholog and in only some horse gene
      models (A0A3Q2HXS7 and Ensembl transcripts), which suggests a gene-model
      artefact from an upstream in-frame start rather than a functional
      divergence. Whether a protein carrying this extension would be imported
      is untested; that caveat is recorded in the notes and does not overturn
      the gene-level location.
    supported_by:
    - reference_id: PMID:9165094
      supporting_text: When rat BCAT(m) is overexpressed in COS-1 cells, the protein exhibits BCAT activity
        and correct processing of the mitochondrial targeting sequence.
    - reference_id: file:human/BCAT2/BCAT2-uniprot.txt
      supporting_text: 'CC   -!- SUBCELLULAR LOCATION: Mitochondrion {ECO:0000250|UniProtKB:O35854}.'
    - reference_id: file:HORSE/BCAT2/BCAT2-bioinformatics/RESULTS-rereview.md
      supporting_text: A0A9L0TSN4 residues 60-452 (393 aa) begin at the Met aligned to human Met1.
    - reference_id: file:HORSE/BCAT2/BCAT2-bioinformatics/RESULTS-rereview.md
      supporting_text: 'First 20 residues found in reviewed orthologs: none.'
