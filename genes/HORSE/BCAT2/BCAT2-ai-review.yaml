  label: Equus caballus
description: BCAT2 is a branched-chain-amino-acid aminotransferase that initiates leucine, isoleucine
  and valine catabolism. The selected horse protein conserves the human catalytic and substrate-binding
  architecture but carries an additional N-terminal segment whose effect on mitochondrial targeting is
  unresolved.
