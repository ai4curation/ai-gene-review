core_functions:
- description: Structural subunit of the MICOS complex in the mitochondrial inner membrane. It acts
    at crista junctions and contributes to forming them. The function is inferred from the human orthologue,
    which is in the same PANTHER subfamily and is the PAINT seed. No molecular activity beyond a structural
    contribution has been demonstrated for any MIC26. The cardiolipin binding reported for the paralogue
    MIC27 is not transferred.
  supported_by:
  - reference_id: PMID:25764979
    supporting_text: The latter isoform spans the mitochondrial inner membrane and physically interacts
      with several MICOS complex subunits such as MIC60, MIC27, and MIC10.
  - reference_id: PMID:32788226
    supporting_text: SKOs and DKO cells have significant reduction in CJs per mitochondrial section.
  - reference_id: PMID:32439808
    supporting_text: The mutation caused impaired processing of the protein during import and faulty insertion
      into the IMM. This was associated with altered MICOS assembly and cristae junction disruption.
  - reference_id: file:HORSE/SAT1/SAT1-bioinformatics/RESULTS.md
    supporting_text: PANTHER v19 places A0A5F5PNJ9 in PTHR14564:SF2 "MICOS COMPLEX SUBUNIT MIC26", the
      same subfamily as human APOO (Q9BUR5)
  molecular_function:
