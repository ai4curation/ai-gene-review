  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Human MIC26 in the inner membrane and in MICOS, and needed for normal crista junction
      number. Its glycosylated/secreted form was later withdrawn (PMID:37279200); only the mitochondrial
      conclusions are used here. Abstract only in cache.
