product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9796
  label: Equus caballus
description: 'Horse MIC26 (apolipoprotein O, APOO) is a 198-residue integral protein of the mitochondrial
  inner membrane and a subunit of the mitochondrial contact site and cristae organising system (MICOS).
  MICOS is the inner-membrane complex that forms and maintains crista junctions, the narrow necks that
  join each crista to the inner boundary membrane. The protein is the one-to-one orthologue of human
  MIC26, to which it is 91% identical over its full length. It has the single ApoO (MIC26/MIC27) domain
  and one transmembrane helix (residues 110-128). In human cells MIC26 belongs, with its paralogue MIC27
  and with MIC10 and MIC13, to the MIC10 subcomplex of MICOS. It joins the complex late in assembly and
  is not needed to stabilise the other subunits, but loss of MIC26 reduces the number of crista junctions,
  loss of MIC26 together with MIC27 collapses the cristae, and pathogenic variants of human APOO disrupt
  cristae. These functions are inferred for the horse protein from the human orthologue; no experiment
  has been reported on horse MIC26. Despite its historical name, MIC26 is a mitochondrial protein and
  not a secreted apolipoprotein.'
