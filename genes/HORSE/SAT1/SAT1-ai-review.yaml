  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The cardiolipin-binding result belongs to the paralogue MIC27 (PANTHER SF3), not to
      MIC26 (SF2). It is cited to justify not transferring a lipid-binding function to this protein.
- id: file:HORSE/SAT1/SAT1-uniprot.txt
