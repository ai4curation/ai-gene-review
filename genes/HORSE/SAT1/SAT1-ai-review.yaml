suggested_questions:
- question: Should the UniProt gene name of A0A5F5PNJ9 be corrected from SAT1 to APOO? Its VGNC (VGNC:22698)
    and Bgee cross-references belong to the horse SAT1 gene, which overlaps APOO on the opposite strand
    of chromosome X.
