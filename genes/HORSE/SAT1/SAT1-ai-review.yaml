- id: PMID:37279200
  title: MIC26 and MIC27 are bona fide subunits of the MICOS complex in mitochondria and do not exist
    as glycosylated apolipoproteins.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Knockout-controlled demonstration that the secreted 55 kDa 'ApoO' species is not MIC26,
      and that MIC26 is only in mitochondria. It is why no secretory term is carried over to the horse
      orthologue. Full text in cache.
- id: PMID:23704930
  title: APOOL is a cardiolipin-binding constituent of the Mitofilin/MINOS protein complex determining
