id: A0A9L0TCA8
gene_symbol: GPAM
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9796
  label: Equus caballus
description: GPAM encodes glycerol-3-phosphate acyltransferase 1, mitochondrial (GPAT1). This peripheral membrane enzyme sits
  on the cytosolic face of the mitochondrial outer membrane. It transfers a long-chain fatty acyl group from acyl-CoA, preferentially
  saturated palmitoyl-CoA, to the sn-1 position of glycerol 3-phosphate, making lysophosphatidic acid. This is the committed
  first step of de novo glycerolipid synthesis. Other enzymes acylate the lysophosphatidic acid to phosphatidic acid, which
  feeds triacylglycerol synthesis and glycerophospholipid synthesis. In liver, GPAT1 competes with carnitine palmitoyltransferase
  1 on the outer membrane for acyl-CoA and so steers fatty acids toward esterification rather than beta-oxidation. The protein
  has an N-terminal acyltransferase domain with an HXXXXD catalytic motif and a C-terminal domain needed for folding. It binds
  the membrane through an amphipathic surface and an N-terminal loop-helix that carries the mitochondrial-targeting signal.
  The horse protein (A0A9L0TCA8, 828 aa, the canonical GPAM product) is a full-length ortholog of the experimentally characterised
  human and rodent enzymes. Its functions are inferred from them and have not been tested in horse.
