core_functions:
- description: Acyl-CoA:glycerol-3-phosphate sn-1 acyltransferase on the cytosolic face of the mitochondrial outer membrane.
    It makes lysophosphatidic acid, the first step of de novo phosphatidic acid and triacylglycerol synthesis. Inferred for
    horse from human and rodent GPAT1 by PANTHER SF16/PAINT PTN000970957 placement; not tested in horse.
  molecular_function: *id010
  directly_involved_in:
