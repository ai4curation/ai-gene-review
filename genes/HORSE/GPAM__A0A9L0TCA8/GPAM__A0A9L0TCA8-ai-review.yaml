suggested_questions:
- question: Is horse GPAT1 regulated by nutrition in liver and adipose tissue as in rodents, and does it contribute to hepatic
    lipid accumulation in equine metabolic syndrome or hyperlipaemia?
- question: Which horse GPAM transcripts are translated? Is the 790-aa isoform A0A9L0TTC1, which lacks the human 370-407 equivalent,
    active alongside the canonical A0A9L0TCA8 product?
suggested_experiments:
- description: Express canonical horse GPAM (A0A9L0TCA8) and measure N-ethylmaleimide-resistant glycerol-3-phosphate acyltransferase
    activity with palmitoyl-CoA versus oleoyl-CoA, together with mitochondrial outer-membrane targeting (protease-protection
    of isolated mitochondria), to confirm the inferred activity and location in this species.
  experiment_type: in vitro enzyme assay / subcellular fractionation
