gene_symbol: CAPSL
product_type: PROTEIN
status: IN_PROGRESS
taxon:
  id: NCBITaxon:9796
  label: Equus caballus
description: CAPSL is a conserved calcyphosin-like protein containing EF-hand calcium-binding motifs.
  Its sequence strongly supports calcium binding and an intracellular regulatory role. Human CAPSL supports
  endothelial proliferation and migration, but the precise downstream mechanism and corresponding physiological
  functions in horse remain to be established. A mammalian structural preprint identifies CAPSL as a microtubule-inner
  protein of the ciliary transition zone and reports microtubule stabilization in vitro; the native structural
  evidence is from bovine cilia.
