  review:
    summary: The EF-hand calcium-binding loops are conserved, which supports calcium ion binding for horse CAPSL.
    action: ACCEPT
    reason: >-
      Horse CAPSL carries EF-hand domains (PROSITE PS50222, three matched; PS00018
      calcium-binding-site motif, two matched) and the four-EF-hand architecture of
      the calcyphosin family. It is a member of the same PANTHER subfamily
      (PTHR34524:SF5) as human CAPSL Q8WWF8. In the human sequence, PROSITE-ProRule
      assigns calcium-coordinating positions in EF-hands 1 and 2. Of the ten mapped
      positions, nine are identical in horse. The one change, Asp to Asn at human
      position 54 (horse 71), is a conservative substitution that EF-hand loops
      tolerate. Calcium binding is a family-level property, and Ca2+-loaded
      structures of the paralog CAPS (PTHR34524:SF2) support it. The
      family review leaves the scope for the whole family unresolved because EF-hand
      integrity varies across distant members. For a mammalian SF5 ortholog with
      intact loops, the inference is sound. No direct measurement of calcium binding
      by CAPSL has been made.
    supported_by:
    - reference_id: file:human/CAPSL/CAPSL-uniprot.txt
      supporting_text: /note="EF-hand 1"
    - reference_id: file:human/CAPSL/CAPSL-uniprot.txt
      supporting_text: /ligand="Ca(2+)"
    - reference_id: file:HORSE/CAPSL/CAPSL-bioinformatics/RESULTS.md
      supporting_text: 202/208 identical paired residues (97.1%)
    - reference_id: file:HORSE/CAPSL/CAPSL-uniprot.txt
      supporting_text: PANTHER; PTHR34524:SF5; CALCYPHOSIN-LIKE PROTEIN; 1.
