  label: Equus caballus
description: >-
  CAPSL (calcyphosin-like) is a small EF-hand protein of the calcyphosin family
  (PANTHER PTHR34524, subfamily SF5 calcyphosin-like protein), which it shares with
  human CAPSL; the paralogous calcyphosin CAPS sits in a different subfamily (SF2).
  Horse CAPSL is 97% identical to human CAPSL across its full length, and its
  EF-hand pairs retain the residues that coordinate calcium, so it is expected to
  bind calcium. No experiments have been done on the horse protein. In other
  mammals, human CAPSL is found in the cytoplasm and the nucleus. Its depletion in
  human retinal endothelial cells impairs proliferation and migration, endothelial
  Capsl loss in mice disrupts retinal angiogenesis, and the gene has been linked to
  adipocyte differentiation. A 2026 cryo-electron tomography preprint on bovine
  tracheal cilia identifies CAPSL as a microtubule inner protein in the lumen of
  the ciliary transition-zone doublet, where it forms a pseudo-helical spiral.
  Recombinant human CAPSL stabilises microtubules in vitro. In horse, CAPSL is
  expressed in bronchial epithelium, which fits a role in multiciliated cells. Its
  most likely primary role is a structural one inside ciliary microtubules, but
  this rests on one unrefereed study, and whether calcium binding regulates it is
  unknown.
