knowledge_gaps:
- gap_statement: >-
    It is not known whether CAPSL is a constitutive microtubule inner protein of the
    ciliary transition zone in vivo across mammals. It is also not known whether its
    EF-hands bind calcium with physiologically relevant affinity, or whether calcium
    changes how it binds or stabilises tubulin.
  boundary: >-
    What is established is the conserved EF-hand architecture, a single cryo-ET
    preprint placing CAPSL in the lumen of bovine transition-zone doublets, and
    perturbation phenotypes in human and mouse endothelial and adipogenic cells. No
    calcium affinity has been measured, and no ciliary loss-of-function phenotype has
    been reported.
  gap_kind:
  - BIOLOGY
suggested_questions:
- question: >-
    If the transition-zone MIP assignment of the Cai et al. 2026 preprint holds up
    after peer review, should microtubule binding and a ciliary transition zone
    location be annotated to CAPSL across mammalian SF5 orthologs?
- question: >-
    Do the cytoplasmic and nuclear CAPSL pools seen in endothelial cells reflect
    functions separate from the ciliary pool, or a soluble pool in non-ciliated cells?
- question: >-
    Is the 17-residue N-terminal extension (MQERASIVASLSNWWQQ) of the horse Ensembl
    model supported by transcript evidence, or does it come from an upstream in-frame
    start codon that gene-model prediction chose instead of the conserved MAGTAR start?
suggested_experiments:
- hypothesis: CAPSL EF-hands bind calcium, and calcium occupancy modulates its binding to the microtubule lumen.
  description: >-
    Measure calcium binding of recombinant CAPSL and EF-hand loop mutants by ITC.
    Compare microtubule co-sedimentation and stabilisation assays with and without
    calcium.
  experiment_type: binding assay
- hypothesis: CAPSL is required for transition-zone doublet integrity in motile cilia.
  description: >-
    Knock out CAPSL in primary airway multiciliated cultures, then assess
    transition-zone ultrastructure by cryo-ET, ciliary beating and the transition-zone
    barrier.
  experiment_type: genetic perturbation with ultrastructure
