id: A0A9L0SR44
gene_symbol: KRIT1
product_type: PROTEIN
status: IN_PROGRESS
taxon:
  id: NCBITaxon:9796
  label: Equus caballus
description: KRIT1/CCM1 is a conserved multidomain Rap1-effector scaffold associated with endothelial
  junction organization and vascular integrity. The horse sequence retains the N-terminal partner-binding
  region, ankyrin repeats and C-terminal FERM domain characteristic of mammalian KRIT1. Its specific developmental
  effects are inferred from mammalian experiments rather than measured directly in horse.
existing_annotations:
- term:
    id: GO:0005856
    label: cytoskeleton
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  supporting_entities:
  - UniProtKB-SubCell:SL-0090
  review:
    summary: Microtubule association contributes to KRIT1 spatial regulation.
    action: ACCEPT
    reason: In vitro binding and cellular localization demonstrate microtubule association, and Rap1/ICAP1
      alter that association. This is a mechanistic localization/binding property of the scaffold rather
      than evidence of a microtubule motor.
    supported_by:
    - reference_id: PMID:17916086
      supporting_text: Krit1 binds in vitro to microtubules through its N- and C-termini
- term:
    id: GO:0005886
    label: plasma membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  supporting_entities:
  - UniProtKB-SubCell:SL-0039
  review:
    summary: Membrane/junctional and cytoplasmic pools are supported by KRIT1 recruitment experiments.
    action: ACCEPT
    reason: Rap1-dependent release from microtubules permits junctional recruitment, while CCM1 participates
      in the VE-cadherin polarity complex. The selected horse sequence retains the corresponding scaffold
      architecture and extensive sequence conservation, supporting transfer of these broad compartments.
    supported_by:
    - reference_id: PMID:20332120
      supporting_text: Both VEC and CCM1 control Rap1 concentration at cell-cell junctions.
    - reference_id: PMID:21633110
      supporting_text: Rap1 binding released KRIT1 from microtubules
- term:
    id: GO:0051093
    label: negative regulation of developmental process
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: involved_in
  supporting_entities:
  - ARBA:ARBA00027583
  review:
    summary: Human endothelial perturbation supports this antiangiogenic/developmental regulatory effect.
    action: KEEP_AS_NON_CORE
    reason: CCM1 perturbation directly changes endothelial proliferation, migration, apoptosis and sprouting
      in primary human endothelial cells. These are documented consequences of the junctional signaling
      regulator. Broad developmental-process annotations are retained as non-core; they do not identify
      a distinct enzyme function or germline piRNA mechanism.
    supported_by:
    - reference_id: PMID:20616044
      supporting_text: 'CCM1 inhibits

        endothelial proliferation, apoptosis, migration, lumen formation, and sprouting

        angiogenesis in primary human endothelial cells.'
