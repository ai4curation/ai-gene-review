suggested_questions:
- question: >-
    Is the 719-aa horse KRIT1 product (ENSECAT00000146800) supported by transcript evidence, with a
    distinct terminal exon, or is it a gene-model artefact? If it is expressed, does it lose
    HEG1-dependent junctional anchoring and act as a Rap1-binding, junction-incompetent variant?
- question: >-
    Should GO annotations on non-canonical alternative products that lack known interaction residues
    (here the HEG1 groove) be restricted relative to the canonical gene product?
suggested_experiments:
- description: >-
    RT-PCR or long-read sequencing of horse endothelial tissue to confirm the alternative 3' exon of
    ENSECAT00000146800. Then express the 719-aa and 736-aa horse products in endothelial cells and
    compare HEG1-tail binding, Rap1A-GTP binding and junctional localization.
  experiment_type: transcript validation and localization/binding assays
