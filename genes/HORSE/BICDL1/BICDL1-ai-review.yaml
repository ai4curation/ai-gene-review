- term:
    id: GO:0031267
    label: small GTPase binding
  evidence_type: ISS
  original_reference_id: file:HORSE/BICDL1/BICDL1-bioinformatics/RESULTS.md
  review:
    summary: Proposed molecular function. The C-terminal region of mouse BICDR-1 binds GTP-bound Rab6A and
      Rab6B directly, and binding requires K512, which is conserved as K510 in horse.
    action: NEW
    reason: Direct, specific Rab6 binding is how BICDL1 recognises its vesicle cargo. The determinant residue
      is conserved in the horse ortholog within the same PANTHER subfamily. The specific Rab GTPase binding
      term is obsolete and merged into small GTPase binding, so this is the most specific available term.
    supported_by:
    - reference_id: PMID:20360680
      supporting_text: Together these data show that the conserved C-terminal domain of BICDR-1 directly
        binds to Rab6A and Rab6B.
    - reference_id: file:HORSE/BICDL1/BICDL1-bioinformatics/RESULTS.md
      supporting_text: mouse K512 (required for Rab6 binding, Schlager et al. 2010) -> horse K510
