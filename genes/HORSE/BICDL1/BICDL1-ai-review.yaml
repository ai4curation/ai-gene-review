id: F6SAQ3
gene_symbol: BICDL1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9796
  label: Equus caballus
description: BICDL1 (BICD family-like cargo adaptor 1, also known as BICDR-1 or CCDC64) is a coiled-coil
  activating adaptor for cytoplasmic dynein-1. Its N-terminal coiled coil binds the dynein tail and dynactin
  and assembles a processive dynein-dynactin-BICDL1 motor that preferentially carries two dyneins, which
  moves faster than complexes formed with the related adaptor BICD2. Its C-terminal region, which contains
  the conserved BICDL1/2 C-terminal domain, binds the GTP-bound form of the small GTPase Rab6 and thereby
  couples the motor to Rab6-positive post-Golgi secretory vesicles. BICDL1 also binds the kinesin-3 KIF1C.
  In cells it concentrates around the centrosome together with Rab6 vesicles and dynein-dynactin, and by
  biasing these vesicles towards microtubule minus ends it restricts secretory delivery to growing neurites
  during early neuronal differentiation. The horse protein (F6SAQ3, 574 aa) is a full-length ortholog of
  the characterised mouse and human proteins in the same PANTHER subfamily, and its functions are inferred
  from those orthologs.
existing_annotations:
- term:
    id: GO:0047496
    label: vesicle transport along microtubule
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN001281025
  - ZFIN:ZDB-GENE-091204-439
  review:
    summary: PAINT propagation from deuterostome node PTN001281025 (PTHR32123:SF12, BICDL1 subfamily). The
      horse protein is a full-length SF12 member, 95-97% identical to the characterised mouse and human
      orthologs, with the Rab6-binding lysine conserved. Mouse BICDR-1 links dynein-dynactin to Rab6
      secretory vesicles and drives their minus-end-directed movement along microtubules.
    action: ACCEPT
    reason: This is the process the gene product directly executes. BICDL1 is the adaptor that attaches
      Rab6 vesicles to dynein-dynactin and activates processive motility, so it does part of the work of
      vesicle transport along microtubules rather than being merely required for it. The horse protein sits
      inside the PAINT clade (SF12, PTN001281025) that inherited the function, and there is no evidence of
      divergence. Term specificity matches the evidence; a minus-end-directed child would also be
      defensible, but PAINT chose this level and BICDR-1 also binds the plus-end motor KIF1C.
    supported_by:
    - reference_id: PMID:20360680
      supporting_text: These data suggest that increasing amounts of BICDR-1 in cells shift the transport
        of Rab6/NPY secretory vesicles to the microtubule minus-end (retrograde) direction.
    - reference_id: PMID:25176647
      supporting_text: BICD-related protein 1 (BICDR-1) accelerates minus-end-directed vesicle movements
        and affects Rab6 vesicle distribution.
    - reference_id: file:HORSE/BICDL1/BICDL1-bioinformatics/RESULTS.md
      supporting_text: mouse K512 (required for Rab6 binding, Schlager et al. 2010) -> horse K510
- term:
    id: GO:0055107
    label: Golgi to secretory granule transport
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:1922915
  - PANTHER:PTN001281025
  review:
    summary: PAINT propagation from the same SF12 node, seeded by the mouse Bicdl1 IMP annotation based on
      Schlager et al. 2010, in which BICDR-1 controls the distribution and exocytosis sites of Rab6/NPY
      post-Golgi secretory vesicles.
    action: KEEP_AS_NON_CORE
    reason: The node placement is sound and the horse protein is inside the clade, so the inheritance is
      not in question. The term is a reasonable description of the downstream trafficking outcome (NPY is a
      dense-core secretory cargo, and BICDR-1 positions these Golgi-derived carriers), but BICDL1 does not
      sort cargo into granules; its executed role is motor recruitment and activation for vesicles that
      have already left the Golgi. The core process is captured by vesicle transport along microtubule;
      this term is retained as a non-core, pathway-level consequence.
    supported_by:
    - reference_id: PMID:20360680
      supporting_text: BICDR-1 accumulates Rab6 secretory vesicles in the cell body around the centrosome
        and restricts delivery of these carriers to the neurites during the early phase of neuronal differentiation.
    - reference_id: PMID:20360680
      supporting_text: Most NPY-GFP exocytotic events occur in the cell body of BICDR-1 neurons, whereas
        in control cells most events take place in developing neurites.
- term:
    id: GO:0140660
    label: cytoskeletal motor activator activity
  evidence_type: ISS
  original_reference_id: file:HORSE/BICDL1/BICDL1-bioinformatics/RESULTS.md
  review:
    summary: Proposed molecular function. Mouse BICDR-1 (same SF12 subfamily, 95% identical over the full
      length) activates dynein-dynactin processivity and preferentially recruits two dyneins, increasing
      velocity.
    action: NEW
    reason: The horse entry has no molecular function annotation at all. The activating-adaptor activity is
      the defining, structurally established activity of BICDL1 orthologs; the horse protein retains the full
      N-terminal coiled coil, including the tryptophan used to register BICDR1 in the cryo-EM structure.
      Transfer is grounded in shared PANTHER SF12 membership and the deuterostome PAINT node, not in
      similarity alone. GO has no dedicated "dynein activating adaptor" term; this MF is the closest
      existing term.
    supported_by:
