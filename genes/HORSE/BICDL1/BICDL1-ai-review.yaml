suggested_questions:
- question: Does BICDL1 act as a Rab6 effector on dense-core (regulated) secretory granules in horse neuroendocrine
    cells, or only on constitutive Rab6 exocytic carriers, which would decide whether Golgi to secretory granule
    transport is a meaningful annotation for this family?
suggested_experiments:
- description: Single-molecule motility assays of recombinant horse BICDL1 with dynein-dynactin, and Rab6-GTP
    pull-downs with the K510M mutant, to confirm that the inferred activating-adaptor and Rab6-binding activities
    are conserved in the horse ortholog.
