suggested_questions:
- question: Which myosin heavy chain(s) does MYL10 associate with in vivo, and is it phosphorylated
    at the residues corresponding to the regulatory serine of MYL9/MYL12?
- question: Is the reported mitochondrial localization of human MYL10 a property of its human-specific
    N-terminal segment, or of the conserved light-chain core shared with other mammals?
suggested_experiments:
- description: Co-immunoprecipitation and mass spectrometry of endogenous MYL10 from mouse pre-B cells
    or retinal ganglion cells to identify its myosin heavy chain partner, and test of divalent cation
    binding by the recombinant core.
- description: Compare localization of fluorescent-protein fusions of the human and horse MYL10 N-terminal
    variants and of the shared core alone in the same cell line.
