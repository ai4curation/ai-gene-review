  review:
    summary: Calcium binding through the conserved first EF-hand of the regulatory light chain fold;
      core molecular function.
    action: ACCEPT
    reason: The PAINT node PTN000549442 places calcium ion binding at an ancestor of the regulatory light
      chains, seeded by the experimentally characterised ventricular light chain MYL2 (P10916). Horse
      MYL10 is inside that clade (it is a PTHR23049 member and its core is 84% identical to MYL2 and 98-99%
      identical to MYL10 of human, mouse and rat; neighbour-joining places the MYL10 clade as sister to
      MYL2), and it retains the canonical first EF-hand loop DQNRDGFIDKED with a PROSITE EF_HAND_1 calcium-binding
      site match, so there is no sign of loss. The RLC N-terminal site is a mixed Ca2+/Mg2+ site, and
      no direct binding measurement exists for any MYL10, so the term is kept at the general calcium
      ion binding level.
