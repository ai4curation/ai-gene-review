gene_symbol: MYL10
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9796
  label: Equus caballus
description: MYL10 (myosin regulatory light chain 10; precursor lymphocyte-specific regulatory light
  chain, PLRLC) is a small EF-hand protein of the myosin regulatory light chain (RLC) family. Its conserved
  C-terminal light-chain core (about 150 residues) is nearly identical among horse, mouse, rat and human
  MYL10 and is most closely related to the cardiac ventricular light chain MYL2, while the N-terminal
  segment preceding the core is encoded by variable, species-specific exons. The core retains the canonical
  first EF-hand loop (DQNRDGFIDKED) that in RLCs forms the divalent-cation (Ca2+/Mg2+) site, so MYL10 is
  expected to bind calcium and to act as a soluble cytoplasmic light chain. In mouse, the gene is expressed
  in precursor lymphocytes, where it is induced by interleukin-7, and its loss in retinal ganglion cells
  enhances axon regeneration after optic nerve injury; the myosin heavy chain it associates with, its phosphorylation
  and its cellular mechanism are not established. A mitochondrial localization has been reported for
  an expressed human MYL10 fusion protein, but its physiological meaning is unknown.
