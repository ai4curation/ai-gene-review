  label: Equus caballus
description: MYL10 is a myosin regulatory light-chain family protein with EF-hand calcium-binding motifs.
  It is an intracellular protein associated with myosin-family regulation by evolutionary inference. A
  mitochondrial localization has been reported for expressed human MYL10 and propagated through curated
  phylogenetic annotation, but the physiological function of this pool and the specific endogenous myosin
  partner remain incompletely characterized.
