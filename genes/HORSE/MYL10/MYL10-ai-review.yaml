    summary: Cytoplasmic location inherited from a deep regulatory light chain ancestor; appropriate
      for a soluble light chain.
    action: ACCEPT
    reason: PTN001495767 is a deep node supported by light chains from fungi, invertebrates and vertebrates,
      and horse MYL10 is a PTHR23049 regulatory light chain with an intact core and no transmembrane or
      signal features. Regulatory light chains function bound to myosin heavy chains in the cytoplasm,
      so cytoplasm is the expected location. The PAINT curators did not propagate a more specific myosin
