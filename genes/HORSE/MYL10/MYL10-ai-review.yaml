    review_notes: >-
      Earlier human-horse pairwise comparison, useful for mapping the first EF-hand
      calcium-binding positions onto the selected horse MYL10 record. Its mapped
      first-EF-hand row is correct after accounting for the 34-residue insertion before
      the first EF-hand in human MYL10 that horse, mouse and rat lack, but its paired
      coverage is incomplete and it is not by itself proof of model completeness,
      orthology, or actin motor regulation: it demonstrates neither calcium binding nor
      an endogenous horse myosin partner. Superseded as primary support by
      RESULTS-rereview.md.
