  review:
    summary: Mitochondrial location propagated from a single human expressed-fusion-protein observation;
      retained as non-core.
    action: KEEP_AS_NON_CORE
    reason: The node PTN002746160 is grounded on human MYL10 (Q9BUA6), whose own mitochondrion annotation
      is IDA from expressed fusion proteins (GO_REF:0000054); human MYL10 appearing as the donor is normal
      grounding, not circularity, and horse MYL10 is in the MYL10 clade. The curator's placement is retained.
      Two caveats limit its weight. The observation is a single high-throughput fusion-protein localization,
      and the N-terminal segment that precedes the conserved core differs completely between human (MLLRLVSNSWPQ...)
      and horse (MTNSCKSMRKKS...), which is where any targeting signal would be expected; the conserved
      light-chain core itself carries no known mitochondrial targeting feature. No mitochondrial function
      is proposed.
