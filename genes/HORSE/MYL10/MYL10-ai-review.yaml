    label: calcium ion binding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN000549442
  - UniProtKB:P10916
  review:
    summary: Calcium-binding EF-hand architecture supports the conserved molecular function.
    action: ACCEPT
    reason: Human MYL10 has PROSITE-ProRule calcium-coordinating positions in the first EF-hand. The horse
      protein retains the EF-hand core, including the corresponding binding-region sequence. The IBA represents
      curated placement of calcium binding in the light-chain phylogeny; the InterPro evidence is compatible
      sequence support. Direct calcium-binding measurements on horse MYL10 are not asserted.
    supported_by:
    - reference_id: file:human/MYL10/MYL10-uniprot.txt
      supporting_text: /ligand="Ca(2+)"
