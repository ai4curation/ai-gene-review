core_functions:
- description: Cytosolic Hsp110-family nucleotide-exchange factor for Hsc70/Hsp70. Accelerates ADP release
    from Hsp70 so that the Hsp70/J-domain protein machinery can disaggregate and refold proteins. Inferred
    for horse from PANTHER SF6 membership and the Hsp110 PAINT node; demonstrated biochemically for human
    Apg2, not for the horse protein.
  molecular_function:
    id: GO:0000774
    label: adenyl-nucleotide exchange factor activity
  directly_involved_in:
  - id: GO:0006457
    label: protein folding
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: file:interpro/panther/PTHR45639/PTHR45639-paint.tsv
    supporting_text: CGD:CAL0000182153|SGD:S000000373|SGD:S000001556|SGD:S000006027|UniProtKB:Q92598
  - reference_id: PMID:36167183
    supporting_text: During aggregate reactivation, Apg2 performs as a specialized nucleotide exchange
      factor
  - reference_id: PMID:30521813
    supporting_text: Hsp110s support the refolding of aggregated polypeptides acting as specialized nucleotide
      exchange factors of Hsp70.
suggested_questions:
- question: Does the human HSPA4 IDA for Tom40 import and TOM complex assembly (PMID:15644312), which
    Ensembl Compara projects to horse, rest on an HSPA4 experiment in the full text, and if so, would
    a term upstream of outer-membrane protein insertion describe it better than matrix import?
suggested_experiments:
- description: Purify horse HSPA4 (F6YZJ4) and measure stimulation of Hsc70 ADP release and ATPase turnover,
    and Hsc70/DNAJB1-dependent reactivation of aggregated luciferase, across a concentration range, to
    test whether the biphasic exchange-factor behaviour of human Apg2 is conserved.
  experiment_type: in vitro biochemistry
