id: F6YZJ4
gene_symbol: HSPA4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9796
  label: Equus caballus
description: HSPA4 (Apg-2, HSPH2) of the horse is an 840-residue member of the Hsp110 branch of the
  Hsp70 superfamily. F6YZJ4 is the full-length product of the Ensembl canonical transcript
  (ENSECAT00000023133) of the horse HSPA4 gene (ENSECAG00000020813), is collinear with human HSPA4
  (P34932) over its whole length at about 97% identity, and belongs to PANTHER subfamily PTHR45639:SF6
  (HSPA4 orthologs). Like other Hsp110 proteins it has an Hsp70-like N-terminal nucleotide-binding
  domain, a beta-sandwich substrate-binding domain with the Hsp110 acidic insertion, an alpha-helical
  lid and a C-terminal extension with a HYOU1-like domain and a disordered tail. Hsp110 proteins act
  mainly as nucleotide-exchange factors for cytosolic Hsp70s such as Hsc70 (HSPA8). They bind the Hsp70
  nucleotide-binding domain in their ATP-bound state and accelerate ADP release, which lets Hsp70 and
  J-domain proteins such as DNAJB1 disaggregate and refold aggregated proteins. In the human protein
  this activity is concentration-dependent and is tuned by the acidic subdomain and the C-terminal
  extension. The protein is expected to be soluble and cytosolic, with a minor nuclear pool. None of
  these activities has been measured on the horse protein. They are inferred from its PANTHER subfamily
  membership and PAINT propagation from the Hsp110 clade, and from biochemistry on human Apg2. The only
  horse-specific data are transcriptomic, showing HSPA4 among heat-shock genes upregulated in blood
  after endurance racing.
