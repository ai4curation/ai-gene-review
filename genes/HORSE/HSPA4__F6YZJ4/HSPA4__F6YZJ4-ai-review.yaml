- term:
    id: GO:0016887
    label: ATP hydrolysis activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR013126
  review:
    summary: Family-wide InterPro2GO transfer of the ATPase activity of conventional Hsp70s. For Hsp110
      proteins the relevant activity is nucleotide exchange on Hsp70, not their own ATP turnover.
    action: MARK_AS_OVER_ANNOTATED
    reason: IPR013126 covers all Hsp70-superfamily proteins, so this mapping assigns the canonical Hsp70
      ATPase to every member. In PTHR45639, PAINT curators placed GO:0016887 at the conventional Hsp70
      node PTN000452648 but not at the Hsp110 node from which F6YZJ4 inherits its other IBAs, a deliberate
      omission. In metazoan disaggregation the Hsp110 contribution depends on nucleotide exchange and
      not on Hsp110 ATPase activity, and the Apg2 studies measure stimulation of the Hsc70 ATPase rather
      than hydrolysis by HSPA4. Some Hsp110s have weak intrinsic ATPase activity, so the term is not demonstrably
      false, but it overstates HSPA4 function.
    supported_by:
    - reference_id: PMID:22990239
      supporting_text: This Hsp110 effect relies on nucleotide exchange, not on ATPase activity
    - reference_id: file:interpro/panther/PTHR45639/PTHR45639-paint.tsv
