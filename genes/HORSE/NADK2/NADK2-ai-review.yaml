- description: Mitochondrial NAD(+) kinase. Phosphorylates NAD(+) with ATP to produce
    NADP(+) in the mitochondrial matrix, the source of the mitochondrial NADP(H) pool.
    Function inferred from the experimentally characterised human ortholog in the same
    PANTHER subfamily, with all catalytic motifs conserved.
