  title: Identification and characterization of a human mitochondrial NAD kinase.
  findings:
  - statement: Human NADK2 (C5orf33) has NAD+ kinase activity using ATP or polyphosphate
      and is mitochondrial; it conserves the GGDG and NE/D motifs but has Ser/Lys/Trp
      in place of the Ppnk NAD-site Asp/Thr/Tyr.
    supporting_text: In the structure of the C5orf33 protein, although the GGDG motif
      and NE/D short motif were completely conserved, the Asp, Thr and Tyr residues
      were not, corresponding instead to Ser-306, Lys-317 and Trp-319
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary biochemical and localisation characterisation of the human
      ortholog; full text cached. Basis for transfer to horse.
