suggested_questions:
- question: Is the 96-residue N-terminal extension of the A0A3Q2GYY5 gene model (upstream
    of the human-equivalent start Met at residue 97) supported by horse transcript
    or proteomic evidence, or should the model start at Met-97 so the mitochondrial
    transit peptide is N-terminal?
- question: Do the horse NADK2 splice forms with and without the 22-residue alternative
    exon (A0A3Q2GYY5 versus F7DCV0) and the form lacking human residues 288-319 (A0A3Q2H586)
    differ in catalytic activity or mitochondrial targeting?
suggested_experiments:
- description: Map the native N-terminus of horse liver NADK2 by N-terminal proteomics
    or 5' RACE, and test whether a Met-1 construct of A0A3Q2GYY5 is imported into mitochondria
    as efficiently as a Met-97 construct.
