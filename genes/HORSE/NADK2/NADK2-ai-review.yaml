    summary: PAINT transfer of NAD+ metabolic process from PTN004406956. Correct,
      because the enzyme consumes NAD+, but the specific process it performs is the
      synthesis of NADP+.
    action: MODIFY
    reason: The term is true but general. NADP+ biosynthetic process (GO:0006741)
      is an is_a descendant of NAD+ metabolic process and names the step NADK2 itself
      catalyses (NAD+ + ATP -> NADP+ + ADP). The replacement refines the PAINT term
      and does not contradict it.
