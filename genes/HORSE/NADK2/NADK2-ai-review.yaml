    summary: PAINT transfer of NAD+ kinase activity from node PTN004406956, seeded
      by experimental annotations on human NADK2 (Q4G0N4) and mouse Nadk2. The horse
      protein sits in the same PANTHER subfamily (PTHR13158:SF5) and retains every
