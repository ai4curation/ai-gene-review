id: A0A3Q2GYY5
gene_symbol: NADK2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9796
  label: Equus caballus
description: NADK2 is the mitochondrial NAD(+) kinase (EC 2.7.1.23) of the horse,
  the ortholog of human and mouse NADK2 within the PANTHER mitochondrial NAD kinase
  subfamily (PTHR13158:SF5). It is a soluble matrix enzyme with an N-terminal mitochondrial
  targeting region and a C-terminal NAD kinase catalytic domain carrying the conserved
  GGDG and NE/D motifs. By homology with the experimentally characterised human enzyme,
  it phosphorylates NAD(+) with ATP (or inorganic polyphosphate in vitro) to form
  NADP(+), and so supplies the mitochondrial NADP(H) pool used by NADPH-dependent matrix
  enzymes such as 2,4-dienoyl-CoA reductase in polyunsaturated fatty acid oxidation,
  the first step of lysine degradation, proline synthesis and antioxidant defence.
  The human enzyme is thought to act as a homodimer. The UniProt entry A0A3Q2GYY5
  is one of several horse NADK2 gene models; it has a 96-residue N-terminal extension
  that the human and mouse proteins lack and a 22-residue alternative exon shared
  with canonical mouse NADK2.
