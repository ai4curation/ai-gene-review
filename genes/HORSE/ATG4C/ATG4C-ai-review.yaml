suggested_questions:
- question: Is the horse ATG4C C-terminus really as in A0A3Q2H6C4, or does the true horse transcript end colinearly
    with human and donkey ATG4C (458 residues)?
- question: Given its weak priming activity, is the physiological role of ATG4C predominantly delipidation and ATG8
    recycling, and on which ATG8 paralogs does it act in vivo?
suggested_experiments:
- description: RT-PCR / long-read sequencing of horse ATG4C transcripts from tissues to determine the true 3-prime
    exon structure and C-terminal sequence.
- description: Compare ATG8 lipidation and delipidation in ATG4B-null versus ATG4B/ATG4C double-null cells reconstituted
    with wild-type or C111S ATG4C, to separate priming from delipidation contributions.
