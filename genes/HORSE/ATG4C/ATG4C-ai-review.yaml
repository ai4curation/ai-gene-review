id: A0A3Q2H6C4
gene_symbol: ATG4C
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9796
  label: Equus caballus
description: ATG4C (autophagy related 4C cysteine peptidase, autophagin-3) is a cytoplasmic papain-like cysteine
  protease of peptidase family C54 that processes ATG8-family ubiquitin-like proteins (LC3s and GABARAPs). It can
  cleave the C-terminal residue of pro-ATG8 proteins to expose the glycine used for phosphatidylethanolamine (PE)
  conjugation, although this priming activity is weak compared with ATG4B, and it removes PE from membrane-anchored
  ATG8 proteins (delipidation), an activity in which it is comparable to the other ATG4 paralogs. Through these
  reactions it supports autophagosome formation and recycling of ATG8 proteins during macroautophagy. The horse
  UniProt entry A0A3Q2H6C4 is a 666-residue gene model whose catalytic domain (residues 1-400) is 90-100% identical
  to human ATG4C with the Cys111-Asp345-His347 triad conserved, but whose C-terminal ~55 canonical residues are
  replaced by ~263 residues of unrelated low-complexity sequence, most likely a gene-model error.
