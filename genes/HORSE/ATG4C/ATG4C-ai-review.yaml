  review:
    summary: ATG4-mediated priming and recycling of ATG8 proteins is a step of autophagosome biogenesis; inherited
      from the ATG4 family node.
    action: ACCEPT
    reason: PAINT placed autophagosome assembly at the root ATG4 node (PTN002503342), with human ATG4C among the
      descendants that carry experimental support. The horse protein is in the ATG4C subfamily (PTHR22624:SF38)
      with the catalytic triad conserved. ATG4C itself catalyses the ATG8 processing step, so this is participation,
      not mere requirement. A0A3Q2H6C4 is an aberrant 666-residue gene model whose C-terminal ~55 canonical residues
      are replaced by unrelated low-complexity sequence, but the catalytic domain (1-400, 90-100% identical to human)
      is intact, so the judgment concerns the horse ATG4C gene product.
