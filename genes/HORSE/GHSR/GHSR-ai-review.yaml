id: F6QF00
gene_symbol: GHSR
product_type: PROTEIN
status: IN_PROGRESS
taxon:
  id: NCBITaxon:9796
  label: Equus caballus
description: GHSR is a conserved seven-transmembrane ghrelin receptor. The selected horse protein is strongly
  conserved with human GHSR across the complete receptor, supporting acyl-ghrelin recognition and heterotrimeric
  G-protein signaling. Equine GHSR1a transcripts have been sequence-confirmed in pituitary and adrenal
  medulla; tissue-specific physiological responses remain less well characterized than in human and rodent
  models.
