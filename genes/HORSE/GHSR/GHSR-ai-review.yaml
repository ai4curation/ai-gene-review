- term:
    id: GO:0046697
    label: decidualization
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q92847
  - ensembl:ENSP00000241256
  review:
    summary: The decidualization evidence is from human endometrial stromal cells.
    action: UNDECIDED
    reason: The primary study adds ghrelin to human stromal-cell decidualization cultures and detects
      receptor expression. This supports a human reproductive context; placentation and decidual responses
      differ among mammals, so this precise process is not transferred confidently to horse without relevant
