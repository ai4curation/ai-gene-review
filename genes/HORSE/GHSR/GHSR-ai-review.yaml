- term:
    id: GO:0032691
    label: negative regulation of interleukin-1 beta production
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q92847
  - ensembl:ENSP00000241256
  review:
    summary: GHSR-dependent cytokine inhibition is supported in human immune cells.
    action: KEEP_AS_NON_CORE
    reason: Human monocyte/T-cell experiments demonstrate suppression of IL-1beta, IL-6 and TNF-alpha
      expression through GHSR. This is a tissue-specific signaling consequence, not the defining receptor
      function; conservation makes horse transfer plausible but direct horse immune-cell assays are absent.
    supported_by:
    - reference_id: PMID:15232612
      supporting_text: 'ghrelin acts via GHS-R to

        specifically inhibit the expression of proinflammatory anorectic cytokines such

        as IL-1beta, IL-6, and TNF-alpha.'
