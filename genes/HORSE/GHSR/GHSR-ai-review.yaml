- term:
    id: GO:0046697
    label: decidualization
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q92847
  - ensembl:ENSP00000241256
  review:
    summary: A human endometrial ligand-supplementation finding transferred to a species without a comparable
      decidual reaction.
    action: MARK_AS_OVER_ANNOTATED
    reason: 'The human donor evidence comes from adding ghrelin to endometrial stromal cultures, which raises
      decidualization markers. That shows the receptor pathway can modulate the process, not that GHSR does
      a step of decidualization, so even the human IDA is a regulatory effect at most. For horse, the transfer
      is also biologically doubtful: equids form an epitheliochorial placenta and lack the invasive stromal
      decidual reaction of human pregnancy. The term should not be carried to F6QF00 without equine uterine
      evidence.'
    supported_by:
    - reference_id: PMID:17494105
      supporting_text: Ghrelin administered in combination with sex steroids to HESC, resulted in an increase
        in PRL and IGFBP-1 production
