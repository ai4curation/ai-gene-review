- term:
    id: GO:0007612
    label: learning
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q99P50
  - ensembl:ENSMUSP00000061153
  review:
    summary: An organism-level behavioural readout. The cellular mechanism is captured by regulation of
      synaptic plasticity.
    action: MARK_AS_OVER_ANNOTATED
    reason: The mouse donor evidence places GHSR as a coreceptor with DRD1 in hippocampal neurons, where it
      redirects DRD1 to Gq signaling and so initiates synaptic plasticity. Learning is the downstream
      behavioural outcome measured in animals. GHSR does molecular work at the level of the receptor heteromer
      and synaptic plasticity, and those claims are kept in GO:0015026 and GO:0048167. A behavioural term
      on top of them is an over-annotation from a phenotype readout. It has also not been examined in horse.
    supported_by:
    - reference_id: file:human/GHSR/GHSR-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: Following DRD1 activation by dopamine in hippocampal neurons, GHSR acts as a coreceptor,
        resulting in DRD1 coupling to G(q) at the expense of G(s), initiating hippocampal synaptic plasticity
        involved in memory and learning
