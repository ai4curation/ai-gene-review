  review:
    summary: The ligand is wrong. GHSR binds ghrelin, not growth hormone-releasing hormone (GHRH); the GHRH
      receptor is GHRHR.
    action: MODIFY
    reason: The GO:0016520 definition (OLS) is "Combining with growth hormone-releasing hormone to initiate
      a change in cell activity". GO:0001616 is defined as combining with ghrelin. The ghrelin discovery
      paper explicitly separates the GHSR pathway from GHRH regulation. The intended function, a receptor
      for a GH-releasing ligand, is right, but the ligand is not. The defect is on the human donor IDA
      rows, which cite ghrelin and secretagogue studies, and the human GO-CAM gomodel:67f85f2b00000823 carries
      the same GHRH term. Replace with the ghrelin receptor term.
