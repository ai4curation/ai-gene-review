core_functions:
- description: Plasma-membrane receptor for acyl-ghrelin and synthetic growth hormone secretagogues that
    activates heterotrimeric G-protein (mainly Gq/11) signaling and so transduces the stomach-derived
    hormone signal.
  molecular_function:
    id: GO:0001616
    label: growth hormone secretagogue receptor activity
  locations:
  - id: GO:0005886
    label: plasma membrane
  directly_involved_in:
  - id: GO:0007186
    label: G protein-coupled receptor signaling pathway
  - id: GO:0009755
    label: hormone-mediated signaling pathway
  supported_by:
  - reference_id: PMID:35027551
    supporting_text: active ghrelin receptor-Go complex bound to the endogenous agonist ghrelin.
  - reference_id: PMID:10604470
    supporting_text: an endogenous ligand specific for GHS-R.
  - reference_id: file:HORSE/GHSR/GHSR-bioinformatics/RESULTS-rereview.md
    supporting_text: Every curated human site in the record is conserved in horse
suggested_questions:
- question: Horse ghrelin is reported to carry mainly a C4 acyl chain rather than the canonical C8. Does
    equine GHSR (F6QF00) respond to C4-acyl ghrelin with the same potency and efficacy as to C8-ghrelin?
  experts: []
- question: Should the human GHSR IDA rows and the ghrelin-GHSR GO-CAM (gomodel:67f85f2b00000823) that
    use GO:0016520 growth hormone-releasing hormone receptor activity be corrected to GO:0001616, so the
    ligand mismatch stops propagating to orthologs?
  experts: []
suggested_experiments:
- hypothesis: Recombinant equine GHSR1a binds acyl-ghrelin and signals through Gq/11 with high constitutive
    activity, as human GHSR1a does.
  description: Express sequence-verified F6QF00 in HEK293 cells and measure IP1 accumulation and Ca2+ responses
    to equine C4-acyl ghrelin, C8-ghrelin, des-acyl ghrelin and LEAP2, together with basal activity relative
    to human GHSR1a.
  experiment_type: heterologous receptor signaling assay
