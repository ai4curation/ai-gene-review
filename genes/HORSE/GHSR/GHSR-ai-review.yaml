- term:
    id: GO:0016520
    label: growth hormone-releasing hormone receptor activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q92847
  - ensembl:ENSP00000241256
  review:
    summary: The cited ligand is ghrelin, not growth-hormone-releasing hormone.
    action: MODIFY
    reason: QuickGO defines GO:0016520 as binding growth-hormone-releasing hormone, whereas GO:0001616
      binds ghrelin. The discovery paper explicitly distinguishes the ghrelin/GHSR pathway from hypothalamic
      GHRH. Human IDA rows cite ghrelin/secretagogue studies, and the horse Ensembl transfer names human
      Q92847 as donor. Replace the ligand-confused term with the ghrelin receptor term; no claim of a
      wrong experimental organism or missing assay is needed.
    supported_by:
    - reference_id: PMID:10604470
      supporting_text: 'there is a mechanism for regulating GH release that is distinct from

        its regulation by hypothalamic growth-hormone-releasing hormone (GHRH).'
    proposed_replacement_terms:
    - id: GO:0001616
      label: growth hormone secretagogue receptor activity
