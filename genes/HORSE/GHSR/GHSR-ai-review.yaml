id: F6QF00
gene_symbol: GHSR
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9796
  label: Equus caballus
description: GHSR is the growth hormone secretagogue receptor type 1a (ghrelin receptor), a class A
  (rhodopsin-like) seven-transmembrane G protein-coupled receptor of the plasma membrane. In mammals
  it is activated by acyl-ghrelin, the stomach-derived peptide hormone, and by synthetic growth hormone
  secretagogues. It couples mainly to Gq/11 and phospholipase C signaling and has high ligand-independent
  (constitutive) activity. Activation promotes pituitary growth hormone release and appetite. In neurons
  it can also act as a coreceptor in heteromers with dopamine D1 and D2 receptors. The horse protein
  F6QF00 is a complete 366-residue receptor that conserves the curated human ligand-contact residues,
  the extracellular disulfide and the receptor activation motifs. In horses, GHSR1a transcripts are
  sequence-confirmed in pituitary and adrenal medulla. GHS-R1a-immunoreactive protein in cultured equine
  chondrocytes mediates a ghrelin-dependent protective response that a GHS-R1a antagonist blocks.
