      MCR and contains four of its five modified residues (thiopeptide, S-methylcysteine,
      1-N-methylhistidine, 5-methylarginine).
    supporting_text: The electron density at 1.6 A resolution of the M. barkeri enzyme
      revealed that four of the five modified amino acid residues of MCR from M. thermoautotrophicum,
      namely a thiopeptide, an S-methylcysteine, a 1-N-methylhistidine and a 5-methylarginine
      were also present.
