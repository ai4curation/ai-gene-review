    summary: InterPro2GO mapping from the MCR alpha-subunit family signatures. MCR catalyzes
      the terminal step of every methanogenic route.
    action: MODIFY
    reason: The claim is correct but general. M. barkeri Fusaro grows and makes methane
      on H2/CO2, on methanol and on acetate, and its single MCR performs the last step
      of each route. GO has an is_a child for each of these three routes, so all three
      are listed rather than one. This differs from the hydrogenotroph orthologs, which
      take only the CO2 child.
