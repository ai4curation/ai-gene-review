proposed_new_terms:
- proposed_name: coenzyme F430 binding
  proposed_definition: Binding to coenzyme F430, a nickel-containing tetrapyrrole
    (hydrocorphinoid) cofactor of methyl-coenzyme M reductase and related alkyl-coenzyme
    M reductases.
  justification: Every MCR and alkyl-coenzyme M reductase alpha subunit binds F430
    (or a modified F430) through an axial ligand to its nickel. GO has heme, chlorophyll
    and cobalamin binding under tetrapyrrole binding but no F430 term.
  proposed_parent:
    id: GO:0046906
    label: tetrapyrrole binding
  supported_by:
  - reference_id: file:METBF/mcrA/mcrA-uniprot.txt
    record_section: ["CC:COFACTOR"]
    supporting_text: Note=Binds 2 coenzyme F430 non-covalently per MCR complex.
suggested_questions:
- question: Does the Methanosarcina-specific absence of 2-methylglutamine, or the
    Phe in place of the coenzyme M-contacting Tyr of Methanothermobacter MCR, change
    the kinetics or stability of Methanosarcina MCR?
suggested_experiments:
- experiment_type: Site-directed mutagenesis
  hypothesis: The Tyr-to-Phe substitution at the coenzyme M site of Methanosarcina
    MCR tunes substrate affinity rather than being neutral.
  description: Using the Methanosarcina genetic system, replace Phe464 of McrA with
    Tyr in the chromosomal mcr operon, purify the variant MCR, and compare its KM for
    methyl-coenzyme M and its specific activity with wild-type MCR.
