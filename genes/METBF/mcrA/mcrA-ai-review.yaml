taxon:
  id: NCBITaxon:269797
  label: Methanosarcina barkeri str. Fusaro
description: mcrA (Mbar_A0893) encodes the alpha subunit of methyl-coenzyme M reductase
  (MCR) in Methanosarcina barkeri Fusaro, a mesophilic, metabolically versatile methanogen
  of the order Methanosarcinales that forms methane from H2 plus CO2, from methanol
  and from acetate. MCR is a cytoplasmic alpha2beta2gamma2 heterohexamer that catalyzes
  the final step shared by all of these routes, the reduction of methyl-coenzyme M
  by coenzyme B to methane and the CoM-S-S-CoB heterodisulfide (EC 2.8.4.1). The 1.6
  A crystal structure of M. barkeri MCR shows an active site almost identical to that
  of the Methanothermobacter enzyme, occupied by coenzyme M and coenzyme B, with coenzyme
  F430 bound through the alpha-subunit Gln161 as axial nickel ligand. The alpha subunit
  carries a thioglycine, an S-methylcysteine, a 1-N-methylhistidine, a 5-methylarginine
  and a didehydroaspartate near the active site, but lacks the 2-methylglutamine of
  the Methanothermobacter enzyme, and has phenylalanine in place of a coenzyme M-contacting
  tyrosine, as does the Methanosarcina acetivorans ortholog.
