    redox chemistry and CslA-dependent glycan synthesis are unknown.
  boundary: Cu/radical chemistry, model-substrate peroxide generation, native glycan-deposition defects
    and direct complex formation are established. These do not establish a particular glucan oxidation
    reaction.
