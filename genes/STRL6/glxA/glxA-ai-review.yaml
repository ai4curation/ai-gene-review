- term:
    id: GO:0005507
    label: copper ion binding
  evidence_type: IDA
  original_reference_id: PMID:26205496
  qualifier: enables
  review:
    action: NEW
    summary: Add direct copper-cofactor binding.
    reason: The target GlxA crystal structure and spectroscopy establish a mononuclear copper active site;
      this is direct metal coordination rather than a copper-response phenotype. Copper-ion binding is
      not an ancestor of either oxidoreductase or cellulose-synthase activity, and no generic metal-ion-binding
      row is added. This captures the essential cofactor interaction, not copper transport or homeostasis.
    supported_by:
