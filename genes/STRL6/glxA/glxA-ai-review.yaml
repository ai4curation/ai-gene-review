- term: &id001
    id: GO:0016491
    label: oxidoreductase activity
  evidence_type: IDA
  original_reference_id: PMID:26205496
  qualifier: enables
  review:
    action: NEW
    summary: Add demonstrated copper-radical oxidoreductase activity.
    reason: 'Purified GlxA has a Cu/Tyr–Cys redox center and produces peroxide in glycolaldehyde-dependent
      assays; the2016 GlxA/DtpA coupled experiment directly supports peroxide formation, and Trp288 variants
      disrupt maturation and catalytic activity. Oxidoreductase is intentionally the broadest justified
      reaction class: the physiological donor and oxidized product are unidentified, so a particular galactose,
      glyoxal or aldehyde-oxidase reaction is not assigned from homology or the partial EC number. No
      more-specific oxidoreductase annotation is proposed, so this row is not an ancestor duplicate. Low-efficiency
      model-substrate chemistry is not described as a dedicated glycolaldehyde metabolic pathway.'
