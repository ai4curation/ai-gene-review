- term: &id003
    id: GO:0016760
    label: cellulose synthase (UDP-forming) activity
  evidence_type: IDA
  original_reference_id: PMID:38557137
  qualifier: contributes_to
  review:
    action: NEW
    summary: Add contribution to the reconstituted cellulose-synthase activity.
    reason: The purified CslA–GlxA complex synthesizes cellulose from UDP-glucose; GlxA supplies the physically
      associated support component, while CslA contains the glycosyltransferase catalytic site. GlxA truncations
      retain different levels of complex formation and activity, demonstrating a contribution beyond a
      knockout-necessity argument. The contributes_to qualifier does not assign independent glucosyltransferase
      catalysis to GlxA. Same-role QuickGO checks on BcsB P37652 and Q3J126 found no corresponding MF
      annotation; their absence is not evidence of a curation gap, and the present proposal rests on the
      target complex-reconstitution assay. The MF is outside the oxidoreductase/binding hierarchies and
      is not redundant with them. Native glucan identity is unresolved, so no separate native cellulose-biosynthesis
      BP is manufactured.
    supported_by:
    - reference_id: PMID:38557137
      supporting_text: the CslA–GlxA complex produces cellulose chains of at least 60–80 glucose units
        with UDP-glucose as substrate.
    - reference_id: file:STRL6/glxA/glxA-source-analysis/PMID38557137-supplement.txt
    - reference_id: file:STRLI/cslA/cslA-source-analysis/identity-report.json
references:
- id: PMID:38557137
  title: CslA and GlxA from Streptomyces lividans form a functional cellulose synthase complex.
  findings:
  - statement: GlxA physically associates with CslA and contributes to the cellulose-synthesizing purified
      complex; the direct ligand-binding site and native polymer remain unresolved.
    supporting_text: the CslA–GlxA complex produces cellulose chains of at least 60–80 glucose units with
      UDP-glucose as substrate.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full cached primary text examined.
- id: PMID:26205496
  title: GlxA is a new structural member of the radical copper oxidase family and is required for glycan
    deposition at hyphal tips and morphogenesis of Streptomyces lividans.
  findings:
  - statement: Structure, spectroscopy and enzyme assays establish a membrane-associated mononuclear copper-radical
      oxidase; native substrate specificity is unresolved.
    supporting_text: 'GlxA is membrane associated and has an active site consisting of a mononuclear

      copper and a cross-linked Y-C cofactor.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cached abstract, curated UniProt experimental statements and institutional accepted
      manuscript examined. PDF font encoding corrupts plain extraction; selected pages were OCRed and
      representative structural/assay pages visually checked. No OCR string is used as a verbatim quote.
- id: PMID:28093470
  title: Active-site maturation and activity of the copper-radical oxidase GlxA are governed by a tryptophan
    residue.
  findings:
  - statement: Trp288 variants alter Cu loading/redox cofactor maturation and fail to restore normal development,
      linking the redox-active structure to native function.
    supporting_text: 'two distinct one-electron acceptors

      comprising the copper ion and a 3''-(S-cysteinyl) tyrosine.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cached abstract and institutional accepted manuscript examined, including selected-page
      OCR; no OCR string used as a verbatim quote.
- id: PMID:26740586
  title: The DyP-type peroxidase DtpA is a Tat-substrate required for GlxA maturation and morphogenesis
    in Streptomyces.
  findings:
  - statement: GlxA produces peroxide in a glycolaldehyde-dependent coupled assay and depends on maturation
      machinery; this does not identify its natural oxidized substrate.
    supporting_text: GlxA is producing H2O2, which is subsequently used by DtpA.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full cached primary text examined.
