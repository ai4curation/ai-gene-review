suggested_questions:
- question: Does GlxA oxidize a nascent glycan, a free metabolite, or another native substrate during
    CslA-dependent glycan production?
- question: Can GlxA redox chemistry be uncoupled experimentally from its structural support of CslA,
    and does either function directly mediate c-di-GMP recognition?
