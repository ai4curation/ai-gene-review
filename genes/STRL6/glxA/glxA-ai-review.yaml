taxon:
  id: NCBITaxon:1200984
  label: Streptomyces lividans 1326
description: GlxA (SLI_3188) is a membrane-anchored copper-radical oxidase and partner of the CslA glycan
  synthase in Streptomyces lividans 1326. Its extracellular catalytic region contains a mononuclear copper
  center and a cross-linked tyrosine–cysteine redox cofactor. GlxA is required for glycan deposition at
  hyphal tips and forms a complex with CslA that synthesizes cellulose in vitro. It oxidizes glycolaldehyde
  with low efficiency in vitro, while its physiological redox substrate and the relationship between redox
  chemistry and glucan synthesis remain unresolved.
