  title: Falcon deep research report for Q7NUH2 (CV_2726)
  findings:
  - statement: No experimental study of CV_2726 exists. The report's links to C. violaceum
      OhrR are only family-level analogy. OhrR (CV_0210, Q7P1K3) is a MarR paralog in PTHR33164:SF5, not SF43,
      so its peroxide-sensing role is not transferred here.
    supporting_text: No published knockouts or biochemical assays specific to CV_2726/Q7NUH2
