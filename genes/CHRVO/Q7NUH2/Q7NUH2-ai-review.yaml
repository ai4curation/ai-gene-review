suggested_questions:
- question: What operator does CV_2726 bind, and which genes does it control? The neighbouring
    genes (an alcohol dehydrogenase, an acyl-CoA dehydrogenase and hydrolase, MarC) do not
    clearly point to a regulon.
- question: Does a phenolic or aromatic ligand, as with Rv2887 and salicylate, release CV_2726
    from DNA, or is it oxidant-sensitive? Its sequence has two cysteines (C77 and C94); whether either aligns with the redox-sensing cysteine of OhrR-type regulators has not been tested.
suggested_experiments:
- description: EMSA or DNase I footprinting of purified CV_2726 on intergenic regions near
    CV_2726/CV_2727/CV_2728, followed by RNA-seq of a CV_2726 deletion mutant to define its
    regulon. Then screen phenolic compounds and oxidants for release from DNA.
