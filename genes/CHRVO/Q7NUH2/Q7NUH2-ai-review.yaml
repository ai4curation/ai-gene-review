gene_symbol: Q7NUH2
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:243365
  label: Chromobacterium violaceum ATCC 12472
description: >-
  CV_2726 (UniProt Q7NUH2) is a 147-residue MarR-family winged helix-turn-helix
  transcription factor from Chromobacterium violaceum ATCC 12472. The HTH marR-type
  domain (PROSITE PS50995) covers the whole protein. Like other MarR proteins, it is
  expected to act as a cytoplasmic homodimer that binds operator DNA in or near target
  promoters and regulates their transcription. In most characterized MarR proteins, a
  small-molecule ligand or an oxidant lowers this DNA-binding affinity. PANTHER places
  it in subfamily PTHR33164:SF43. That subfamily is broad: CV_2726 shares only 20-29%
  identity with its characterized members, which include M. tuberculosis Rv2887 (a
  salicylate-responsive repressor of a methyltransferase gene) and staphylococcal TcaR
  (a regulator of the ica operon and of teicoplanin susceptibility). No experimental
  data exist for CV_2726, so its operator, regulon, effector ligand and regulatory sign
  are unknown.
existing_annotations:
- term:
    id: GO:0003677
    label: DNA binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: enables
  review:
    summary: UniRule transfer, based on the MarR-type winged-HTH domain that covers the
      whole 147-residue protein (PS50995, residues 1-147). DNA binding is correct.
      However, MarR-family proteins bind particular operator sequences rather than DNA
      in general, and GO:0003700 (also annotated here) is defined as selective binding
      to a specific DNA sequence.
    action: MODIFY
    reason: The term is correct but general. The MarR winged-HTH architecture supports
      sequence-specific operator binding, which is the DNA-binding mode implied by the
      accepted GO:0003700 transcription factor activity. Refine the term to sequence-specific
      DNA binding (GO:0043565). The actual operator sequence is unknown.
    proposed_replacement_terms:
    - id: GO:0043565
      label: sequence-specific DNA binding
    supported_by:
    - reference_id: file:genes/CHRVO/Q7NUH2/Q7NUH2-uniprot.txt
      record_section: ["DR:InterPro"]
      supporting_text: DR   InterPro; IPR000835; HTH_MarR-typ.
    - reference_id: file:genes/CHRVO/Q7NUH2/Q7NUH2-uniprot.txt
      record_section: ["DR:PROSITE"]
      supporting_text: DR   PROSITE; PS50995; HTH_MARR_2; 1.
- term:
    id: GO:0003700
    label: DNA-binding transcription factor activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: InterPro2GO mapping from IPR000835 (HTH_MarR-typ) and IPR039422 (MarR/SlyA-like).
      Every characterized member of PTHR33164:SF43 (Rv2887, TcaR) and the family archetype,
      E. coli MarR, is a DNA-binding transcriptional regulator. CV_2726 has the complete
      MarR domain. This molecular function is conserved across the family and is the right
      level of specificity for an uncharacterized member.
    action: ACCEPT
    reason: The core, family-conserved activity. A full-length MarR-type winged-HTH domain
      and membership of PTHR33164 support it. Whether it acts as a repressor or an activator
      is not established, so the generic term is as precise as the evidence allows.
    supported_by:
    - reference_id: file:genes/CHRVO/Q7NUH2/Q7NUH2-uniprot.txt
      record_section: ["DR:InterPro"]
      supporting_text: DR   InterPro; IPR039422; MarR/SlyA-like.
    - reference_id: file:genes/CHRVO/Q7NUH2/Q7NUH2-uniprot.txt
      record_section: ["DR:PANTHER"]
      supporting_text: DR   PANTHER; PTHR33164; TRANSCRIPTIONAL REGULATOR, MARR FAMILY; 1.
- term:
    id: GO:0006351
    label: DNA-templated transcription
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: involved_in
  review:
    summary: UniRule transfer. A MarR-family regulator controls transcription but does
      none of the work of transcription itself (RNA polymerase does). The accurate process
      term, regulation of DNA-templated transcription (GO:0006355), is already annotated.
    action: MARK_AS_OVER_ANNOTATED
    reason: The process is transcription itself, carried out by RNA polymerase. The regulator's
      role is captured by GO:0006355, which this gene already carries.
- term:
    id: GO:0006355
    label: regulation of DNA-templated transcription
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: Combined automated annotation. It agrees with the PAINT IBD for GO:0006355
      at PTN002109389, the PTHR33164 node seeded by experimentally characterized MarR-family
      members across Proteobacteria and Firmicutes. CV_2726 descends from this node and
      shows no sign of divergence. Its domain is intact and covers the full length of
      the protein.
    action: ACCEPT
    reason: This is the core biological process of a MarR-family transcription factor
      and is supported by phylogenetic placement. Positive or negative regulation cannot
      be asserted because the regulatory sign of CV_2726 is unknown.
    supported_by:
    - reference_id: file:interpro/panther/PTHR33164/PTHR33164-paint.tsv
      supporting_text: "PTHR33164\tPTN002109389\tGO:0006355\tP\tIBD\tfalse"
- term:
    id: GO:0006950
    label: response to stress
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  review:
    summary: TreeGrafter transfer of the PAINT IBD for GO:0006950 at PTN002109389. The
      seeds are E. coli MarR (P27245) and B. subtilis O34777. The curator judged a stress-response
      role to be ancestral to the family. CV_2726 shows no sign of divergence from it. Its
      closest characterized SF43 relative, Rv2887, responds to salicylate-type phenolic
      compounds. Still, no stress, signal or regulon has been identified for CV_2726, and
      the term is very broad.
    action: KEEP_AS_NON_CORE
    reason: Kept to respect the PAINT node placement, since no target-specific evidence
      argues against it. It is non-core because the specific stress, if any, is unknown,
      and members of SF43 respond to quite different signals (salicylate, antibiotics,
      aromatic substrates).
    supported_by:
    - reference_id: file:interpro/panther/PTHR33164/PTHR33164-paint.tsv
      supporting_text: "PTHR33164\tPTN002109389\tGO:0006950\tP\tIBD\tfalse\tUniProtKB:O34777|UniProtKB:P27245"
    - reference_id: file:genes/CHRVO/Q7NUH2/Q7NUH2-deep-research-falcon.md
      supporting_text: No published knockouts or biochemical assays specific to CV_2726/Q7NUH2
