id: Q7NUH2
gene_symbol: CV_2726
taxon:
  id: NCBITaxon:243365
  label: Chromobacterium violaceum ATCC 12472
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for CV_2726, a 147-aa MarR-family winged-HTH
  transcriptional regulator of Chromobacterium violaceum. The GO channel fails completely:
  its top five are sterol-biosynthesis enzymes (7-dehydrocholesterol reductase, cholesterol
  biosynthesis via 24,25-dihydrolanosterol, cholestenone 5-alpha-reductase, a sterol C4
  decarboxylase) for a bacterium that makes no sterols, at scores of 11.6 and below, and
  two of the five labels no longer resolve to any current GO term. The free-text Function
  channel is entirely correct on the same query, returning MarR-family regulator
  descriptions ("Regulatory protein involved in autolytic activity, multidrug resistance
  and virulence"; "Negatively regulates mhqA, mhqED, mhqNOP..."). The core molecular
  function, DNA-binding transcription factor activity, is already in GOA and is retrieved
  by the GO channel only at rank 22. ProtNLM2 made no GO prediction here.
  Assessment: 0 correct (COR/CNN/LSP), 0 uncertain (UNC), 3 incorrect (NPI).
source_documents:
  - projects/PROTREK_EVALUATION/argo50_protrek_hits.tsv
  - genes/CHRVO/Q7NUH2/Q7NUH2-uniprot.txt
  - genes/CHRVO/Q7NUH2/Q7NUH2-goa.tsv
predictions:
  - source_method: ProTrek
    source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
    source_reference_id: PMID:41039041
    predicted_term:
      id: GO:0047598
      label: 7-dehydrocholesterol reductase activity
    predicted_term_type: GO_MF
    review:
      assessment: NPI
      confidence_score: 0
      error_type: TAXON_CONSTRAINT_VIOLATION
      summary: >-
        Top-ranked hit (score 11.55). A multi-pass membrane sterol reductase of the
        cholesterol pathway, predicted for a 147-aa soluble DNA-binding protein in a
        bacterium that does not synthesise sterols. There is no fold, motif or taxonomic
        route to this call; it is a failure rather than an over-reach. The score is in the
        benchmark's bottom quartile and is the only warning a user gets.
      supported_by:
        - reference_id: GO_REF:0000002
          supporting_text: Gene Ontology annotation through InterPro
  - source_method: ProTrek
    source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
    source_reference_id: PMID:41039041
    predicted_term:
      id: GO:0033488
      label: cholesterol biosynthetic process via 24,25-dihydrolanosterol
    predicted_term_type: GO_BP
    review:
      assessment: NPI
      confidence_score: 0
      error_type: TAXON_CONSTRAINT_VIOLATION
      summary: >-
        Rank 2 (score 11.21), the pathway counterpart of rank 1 and impossible for the same
        reason. Four of this protein's five top calls are sterol metabolism, so the failure
        is systematic rather than a single stray hit - the embedding has landed in a sterol
        neighbourhood and every rank reports from there.
      supported_by:
        - reference_id: GO_REF:0000002
          supporting_text: Gene Ontology annotation through InterPro
  - source_method: ProTrek
    source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
    source_reference_id: PMID:41039041
    predicted_term:
      id: GO:1900377
      label: negative regulation of secondary metabolite biosynthetic process
    predicted_term_type: GO_BP
    review:
      assessment: NPI
      confidence_score: 0
      error_type: FREQUENCY_BIAS
      summary: >-
        Rank 4 by score (10.41), reviewed in place of rank 3 whose label
        ("cholestenone 5-alpha-reductase activity") does not resolve to any term in the
        current GO release. This is the only hit in the list with the right shape - a
        regulatory process - and it is still not supportable: C. violaceum's best-known
        secondary metabolite is violacein, whose regulators are quorum-sensing LuxR-type
        proteins and the MarR homolog VioS, and there is no evidence CV_2726 is among them.
        Recorded as a lead-shaped miss rather than as a hypothesis, because the correct
        general statement (this is a transcriptional repressor of some regulon) is already
        in GOA and was not what the model returned.
      supported_by:
        - reference_id: GO_REF:0000002
          supporting_text: Gene Ontology annotation through InterPro
