  label: Pseudomonas putida S16
description: MaiA, also called Iso or Pp-Iso, is the maleate cis-trans isomerase of the nicotine-degrading
  Pseudomonas putida S16 strain. Purified enzyme converts maleate to fumarate at the end of its pyrrolidine
  nicotine-catabolic pathway. Structures of the wild-type enzyme and a maleate-bound C200A variant support
  substrate recognition within a buried active site. This shared downstream reaction does not establish
  a complete nicotinate degradation pathway in S16.
