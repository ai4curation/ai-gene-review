  label: Helicobacter pylori 26695
description: 'TrxA (Trx1; HP_0824) is a small thioredoxin of Helicobacter pylori 26695 with a reversible
  active-site dithiol/disulfide pair. It accepts reducing equivalents from the NADPH-dependent thioredoxin
  reductase TrxB and reduces protein disulfides, including the oxidized peroxiredoxin AhpC. This relay
  supports peroxide detoxification and cellular thiol-redox balance. Trx1 and the second thioredoxin Trx2
  differ in client specificity: Trx2 can be reduced by TrxB but does not replace Trx1 in the tested AhpC
  system.'
