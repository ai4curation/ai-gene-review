- id: url:https://scb.wfu.edu/Poole-files/Baker_Hpylori.pdf
  title: https://scb.wfu.edu/Poole-files/Baker_Hpylori.pdf
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Author-hosted full text of PMID:11222594, obtained through the normal URL fetcher. Methods
      identify 26695 genomic DNA and TIGR-ATCC clones; Table 2 explicitly identifies AhpC as P21762, and
      loci HP0824/HP0825 identify Trx1/TrxR. Figures 2–6 distinguish the native reconstructed system from
      heterologous mixtures. Detailed AhpC substrate kinetics substitute E. coli TrxR to reduce background
      oxidase activity. The inability to obtain ahpC knockouts under these conditions is not a universal
      essentiality assertion.
  findings:
  - statement: The reconstructed native NADPH/TrxR/Trx1/AhpC system consumes peroxide; this is not a direct
      NADH-dependent AhpC reaction.
    supporting_text: The maximal sustained rate of NADPH oxidation was observed when all three pro- teins,
      TrxR, Trx1, and AhpC, were included in the assay mix- ture (Fig. 4).
  - statement: Native TrxR has a strong NADPH preference in the tested insulin-linked system.
    supporting_text: In TrxR-Trx1-insulin experiments in which NADPH was replaced with NADH, no decrease
      in the NADH A 340 was observed upon addition of TrxR to the reaction mixture, demonstrating the
      high speciﬁcity of TrxR for NADPH.
  - statement: Trx2 can be reduced by TrxR but does not replace Trx1 as an AhpC reductant under the tested
      conditions.
    supporting_text: These data indicate that while Trx2 is a good substrate for TrxR, it fails to act
      as a reductase for H. pylori AhpC.
  - statement: Some fine AhpC kinetic measurements intentionally use E. coli TrxR.
    supporting_text: Use of E. coli TrxR rather than H. pylori TrxR in this assay did not signiﬁcantly
      affect the results but did greatly decrease the problem of AhpC-independent NADPH oxidation.)
- id: PMID:11222594
  title: 'Essential thioredoxin-dependent peroxiredoxin system from Helicobacter pylori: genetic and kinetic
    characterization.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Canonical PMID abstract and complete author-hosted PDF were read together. The full-text
      URL reference records source-specific Results and Methods quotations; neither native strain identity
      nor all kinetic measurements is inferred from the abstract alone.
  findings:
  - statement: Native thioredoxin reductase and Trx1 constitute the AhpC recycling system.
    supporting_text: Instead, homologues of Escherichia coli thioredoxin (Trx) reductase (TrxR, HP0825)
      and Trx (Trx1, HP0824) formed a reductase system for H. pylori AhpC.
