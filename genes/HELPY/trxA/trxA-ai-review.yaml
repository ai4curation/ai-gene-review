- id: PMID:12576586
  title: Role of the thioredoxin system and the thiol-peroxidases Tpx and Bcp in mediating resistance
    to oxidative and nitrosative stress in Helicobacter pylori.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract read; normal forced recovery remained abstract-only. It establishes viable
      trx mutants and stress phenotypes, limiting universal essentiality claims. The later full PMID:25964471
      identifies the earlier parent strain as 26695. No mechanistic substrate specificity is inferred
      from paraquat sensitivity alone.
  findings:
  - statement: Thioredoxin function supports stress resistance but is not universally essential for viability.
    supporting_text: The results show that a functional thioredoxin system is necessary for both oxidative
      and nitrosative stress resistance in H. pylori but, surprisingly, is not essential for viability
      despite the absence of glutathione and a glutaredoxin system in this bacterium.
- id: PMID:25964471
  title: Comparative Roles of the Two Helicobacter pylori Thioredoxins in Preventing Macromolecule Damage.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text read. Methods include 26695/43504 for in vitro work, specify 43504 in oxygen-stress
      assays, and use X47 for mouse colonization. TrxA-dependent macromolecular protection corroborates
      redox defense without converting damage phenotypes into direct DNA-repair activity.
  findings:
  - statement: TrxA is a demonstrated electron donor for antioxidant enzymes.
    supporting_text: However, H. pylori TrxA is expressed in greater amounts as a response to stress agents
      ( 27 ), and it is the electron donor for two important antioxidant enzymes, AhpC and Msr ( 13 ,
      19 ).
- id: PMID:16354674
  title: Helicobacter pylori thioredoxin is an arginase chaperone and guardian against oxidative and nitrosative
    stresses.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Canonical abstract read; normal force and publisher-URL retrieval did not recover the
      full source. Direct Trx1-mediated reactivation of damaged arginase is reported, but exact strain/construct
      and separation of folding from redox activity remain unresolved here. Retain this finding and question
      rather than inventing a target-specific NEW assertion.
  findings:
  - statement: H. pylori Trx1 can reactivate denatured arginase in the reported assays.
    supporting_text: Trx1 has chaperone activity that renatures urea- or heat-denatured arginase back
      to the catalytically active state.
core_functions:
- description: Protein-disulfide reduction through reversible thiol exchange, including regeneration of
    AhpC using electrons supplied by NADPH-dependent TrxB. Insulin and DTNB assays establish broader reductase
    capacity; the native AhpC client is distinguished from Trx2, which fails to substitute under the tested
    conditions.
