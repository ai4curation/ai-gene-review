  review:
    summary: A family-level superoxide-removal assignment is not resolved by the available H. pylori redox
      assays.
    action: UNDECIDED
    reason: IPR005982 identifies thioredoxin reductase, but the inspected target assays establish thioredoxin
      reduction and downstream peroxide detoxification rather than a demonstrated superoxide-removal route.
      GO:0019430 includes multistep cellular removal, so absence of direct superoxide-dismutase chemistry
      does not disprove participation. Thioredoxin-mutant paraquat sensitivity also does not by itself
      identify a TrxB-dependent superoxide sink. Keep the claim unresolved pending source-specific mechanistic
      evidence.
    supported_by:
    - reference_id: url:https://scb.wfu.edu/Poole-files/Baker_Hpylori.pdf
      supporting_text: When assayed with small-molecule (DTNB) or protein (insulin) disulﬁde-containing
        substrates, both Trx1 and Trx2 from H. pylori exhibited TrxR-dependent reductase activities that
        were hyperbolically dependent on the Trx1 and Trx2 concentrations.
    - reference_id: url:https://scb.wfu.edu/Poole-files/Baker_Hpylori.pdf
      supporting_text: On the basis of results reported here and mechanisms out- lined for other 2-Cys
        AhpC homologues (10, 51), electrons from NADPH proceed along the path outlined in Fig. 9 for the
        reduction of peroxides to alcohols. This scheme is highly anal- ogous to that for electron transfer
        through the S. typhimurium AhpC system, except that TrxR and Trxl replace AhpF in the H. pylori
        system. Nonetheless, one tightly bound ﬂavin and three disulﬁde redox centers mediate electron
        transfer from pyridine nucleotide to peroxide in both cases.
