  label: Helicobacter pylori 26695
description: TrxB (HP_0825) is the FAD-containing, NADPH-dependent thioredoxin reductase of Helicobacter
  pylori 26695. It regenerates reduced thioredoxins through a redox-active disulfide, thereby supplying
  electrons to protein-disulfide reduction and antioxidant systems. TrxB reduces both Trx1 and Trx2, but
  only Trx1 supports AhpC turnover in the tested native peroxiredoxin system. The enzyme strongly prefers
  NADPH over NADH in the characterized coupled assay.
