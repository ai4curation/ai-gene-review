  review:
    summary: Native TrxB reduces thioredoxin using NADPH, with measured donor and Trx1 kinetics.
    action: ACCEPT
    reason: The PTN005133404 inherited catalytic assertion agrees with direct H. pylori TrxR assays in
      PMID:11222594 Figures 2–3. NADH substitution failed to sustain turnover in the insulin-linked assay;
      this supports the NADPH-specific term without claiming all homologous reductases have identical
      donor preferences. Both Trx1 and Trx2 are reductase substrates.
    supported_by:
    - reference_id: url:https://scb.wfu.edu/Poole-files/Baker_Hpylori.pdf
      supporting_text: In TrxR-Trx1-insulin experiments in which NADPH was replaced with NADH, no decrease
        in the NADH A 340 was observed upon addition of TrxR to the reaction mixture, demonstrating the
        high speciﬁcity of TrxR for NADPH.
    - reference_id: url:https://scb.wfu.edu/Poole-files/Baker_Hpylori.pdf
      supporting_text: When assayed with small-molecule (DTNB) or protein (insulin) disulﬁde-containing
        substrates, both Trx1 and Trx2 from H. pylori exhibited TrxR-dependent reductase activities that
