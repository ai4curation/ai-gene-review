core_functions:
- description: FAD- and disulfide-mediated transfer of reducing equivalents from NADPH to thioredoxins.
    Both Trx1 and Trx2 are substrates; the native peroxide-defense route proceeds through Trx1 to AhpC.
    Detailed TrxR kinetics are native-protein measurements, unlike the separate AhpC kinetic assays using
    E. coli TrxR.
