  review:
    summary: cheZ acts in a cytoplasmic polar chemotaxis-regulatory complex.
    action: ACCEPT
    reason: The experimental localization supports a cytoplasmic polar pool. PMID:26061894 primarily
      studies G27 derivatives; its methods explicitly report some localization confirmation in 26695,
      SS1, SS2000 and J99, without assigning every panel to 26695. The target is the curated 26695
      ortholog, not an asserted identical G27 construct. Cytoplasm is retained at the documented
      granularity; absence of transmembrane helices and poor detergent solubility are not evidence
      for an integral membrane location.
    supported_by:
    - reference_id: PMID:26061894
      supporting_text: Together, these findings indicate that CheZHP and ChePep depend on each other
        for their polar localization and form a novel chemotaxis protein cluster distinct from the
        flagellar or chemotaxis signaling complexes.
    - reference_id: PMID:26061894
