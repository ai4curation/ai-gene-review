  - InterPro:IPR047802
  review:
    summary: CheZ is a phosphoprotein phosphatase acting on chemotaxis response regulators.
    action: MODIFY
    reason: The IPR047802 family mapping correctly identifies phosphatase chemistry, but GO:0004721
      specifies the demonstrated protein substrate. Purified SS1 CheZ accelerates CheY-P dephosphorylation
      and acts on the CheAY receiver domain, with weak CheV2 activity and no detected CheV1/CheV3
      activity. Lack of action on CheA lacking its receiver domain does not support histidine-phosphatase
      activity. The paper uses 26695 numbering D189/Q193 for sites corresponding to SS1 D177/Q181;
      it is not a direct purified O24976 assay.
    supported_by:
    - reference_id: PMID:20497335
      supporting_text: These results demonstrate that HP0170 is a CheYHP-P phosphatase in H. pylori
        and can be appropriately called CheZHP.
    proposed_replacement_terms:
    - id: GO:0004721
      label: phosphoprotein phosphatase activity
