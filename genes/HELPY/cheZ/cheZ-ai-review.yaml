gene_symbol: cheZ
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:85962
  label: Helicobacter pylori 26695
description: CheZ (HP_0170) is a divergent bacterial chemotaxis phosphatase that accelerates hydrolysis
  of response-regulator phosphoaspartate, principally on CheY. It forms a cytoplasmic polar complex
  with ChePep that helps control swimming reversals. H. pylori biochemical studies also identify
  the receiver domain of CheAY as a substrate and weaker activity toward CheV2; these experiments
  used SS1 protein, supporting the function assigned to the 26695 ortholog.
