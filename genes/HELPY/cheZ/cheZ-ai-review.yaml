  evidence_type: ISS
  original_reference_id: PMID:20497335
  review:
    summary: CheZ directly resets the chemotaxis phosphosignal.
    action: NEW
    reason: CheZ itself performs the regulatory step by catalyzing removal of the response-regulator
      phosphate, rather than being only a required substrate. Biochemistry in SS1 and the full-deletion
      behavioral analysis in G27 support inference to 26695. This is the single new BP proposal;
      no redundant chemotaxis parent is added.
    supported_by:
    - reference_id: PMID:20497335
