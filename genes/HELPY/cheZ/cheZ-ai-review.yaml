core_functions:
- description: Accelerates response-regulator phosphoaspartate hydrolysis to reset chemotaxis signaling.
    CheY-P is the principal established substrate, with CheAY receiver-domain activity and weak CheV2
    activity documented for SS1. ChePep organizes a polar phosphatase complex; transfer to the 26695
    ortholog is explicit.
