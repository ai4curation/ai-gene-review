    reason: >-
      Bare protein binding is uninformative, but this particular interaction has a
      defined molecular function established by structure and mutagenesis: the
      UreF-UreH heterodimer, and its homodimerization into (UreF-UreH)2, is the
      platform that recruits UreG and is required for urease activation
