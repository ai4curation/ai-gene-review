- term:
    id: GO:0016151
    label: nickel cation binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - InterPro:IPR002639
  - UniRule:UR000002805
  review:
    summary: >-
      Isothermal titration calorimetry shows that H. pylori UreF binds nickel, but
      the functional relevance of that binding has never been tested and the metal
      site that matters for maturation is on the UreG dimer.
    action: KEEP_AS_NON_CORE
    reason: >-
      The row is not fabricated: a review of the UreD tunnel work states explicitly
      that ITC demonstrates nickel binding by HpUreF while noting that its functional
      relevance was not tested (PMID:26401965). Against that, no nickel site appears
      in the H. pylori UreF-UreH or UreG/UreF/UreH structures, the nickel of the
      preactivation complex is measured on the UreG dimer interface (Cys66/His68),
      and the H. pylori UreF record carries no metal-binding feature. The property is
      therefore kept as a non-core accessory feature rather than as part of UreF's
      function, which is urease activation through UreG recruitment.
    supported_by:
    - reference_id: PMID:26401965
      supporting_text: >-
        HpUreF was structurally characterized25 and isothermal titration calorimetry
        demonstrates it binds nickel,26 although the functional relevance of metal
        binding was not tested.
    - reference_id: PMID:24115911
      supporting_text: >-
        In the presence of nickel and GTP, wild-type UreG binds 1.2±0.1 nickel ions
        per UreG dimer, whereas significantly less nickel is bound to UreG(C66A) or
        UreG(H68A) variants.
