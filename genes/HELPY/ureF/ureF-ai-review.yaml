id: Q09065
gene_symbol: ureF
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:85962
  label: Helicobacter pylori 26695
description: >-
  UreF is a cytoplasmic urease maturation protein of Helicobacter pylori. It
  forms a tight heterodimer with UreH (the UreD ortholog) that dimerizes into a
  (UreF-UreH)2 platform; conformational changes in UreF on complex formation -
  ordering of its C-terminal tail around Arg250 and uncoiling of the first turn
  of helix alpha2 to expose Tyr48 - create the binding surface that recruits the
  GTPase UreG, giving the (UreG-UreF-UreH)2 preactivation complex. By juxtaposing
  two UreG protomers, the UreF-UreH platform assembles the Cys66-Pro67-His68
  nickel site at the UreG dimer interface, and the same platform is required
  later for nickel-charged UreG to deliver its metal to apo-urease. UreF thus
  acts as a urease activator and as a checkpoint coupling GTP hydrolysis to
  nickel insertion; substitutions that block UreG recruitment (Y48A, R250A) or
  UreF-UreH dimerization abolish urease maturation without affecting urease
  assembly. UreF is not part of the mature enzyme and has no catalytic activity
  of its own.
