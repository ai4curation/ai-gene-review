  review:
    summary: >-
      UreF is a subunit of the (UreG-UreF-UreH)2 urease activation complex resolved
      by X-ray crystallography.
    action: NEW
    reason: >-
      The term names exactly this entity - a protein complex required for urease
      activation whose subunits dissociate before urease becomes catalytic - and the
      H. pylori complex is its structural prototype: the 2.35 A structure of the
      UreG/UreF/UreH complex, with UreG released on nickel/GTP binding. The complex
      is not currently annotated for any H. pylori subunit.
    supported_by:
    - reference_id: PMID:24115911
      supporting_text: >-
        We report here the crystal structure of the UreG/UreF/UreH complex, which
        illustrates how UreF and UreH facilitate dimerization of UreG
