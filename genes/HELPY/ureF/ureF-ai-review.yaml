  review:
    summary: >-
      UreF increases urease activity by promoting nickel incorporation into the
      active site - the definition of this term - and H. pylori UreF is the
      best-characterized member of the family.
    action: ACCEPT
    reason: >-
      The PAINT node covers the UreF family, whose ancestral role is urease
      activation; the plant donor (Arabidopsis UreF) and H. pylori UreF behave the
      same way. Target-specific evidence is direct: nickel-charged UreG activates
      apo-urease only when the UreF/UreH complex is present, and UreF variants that
      cannot recruit UreG abolish maturation in vivo (PMID:24115911, PMID:22013070).
    supported_by:
    - reference_id: PMID:24115911
      supporting_text: >-
        We found that the nickel-charged UreG dimer can activate urease only in the
        presence of the UreF/UreH complex (Figure 7A).
