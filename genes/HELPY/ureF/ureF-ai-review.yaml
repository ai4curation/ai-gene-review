suggested_questions:
- question: >-
    Does H. pylori UreF act as a GTPase-activating or gating factor for UreG, as
    proposed for the Klebsiella aerogenes protein, or only as a recruitment and
    positioning platform?
- question: >-
    What triggers release of the (UreF-UreH)2 platform from urease once the
    metallocenter is complete?
suggested_experiments:
- hypothesis: >-
    UreF controls the fidelity of metal selection, so that in its absence zinc can
    occupy the site UreG delivers to.
  description: >-
    Measure in vitro urease activation and active-site metal content with
    nickel- versus zinc-charged UreG, in the presence and absence of UreF-UreH, and
    with the UreG-recruitment-deficient UreF variants Y48A and R250A.
  experiment_type: In vitro reconstitution with metal analysis and enzyme assays
