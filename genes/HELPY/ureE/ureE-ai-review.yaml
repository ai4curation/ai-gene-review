suggested_questions:
- question: >-
    What is the physiological role of the Zn(2+) site of H. pylori UreE, which
    stabilizes the UreE-UreG complex in vitro but is not the metal delivered to
    urease?
- question: >-
    How is nickel partitioned between the urease (UreE) and hydrogenase (HypB)
    branches when HypA can hand nickel to either?
suggested_experiments:
- hypothesis: >-
    The histidine ligands that discriminate Ni(2+) from Zn(2+) in UreE are required
    for urease maturation in vivo, whereas the Zn(2+) site is not.
  description: >-
    Introduce the Ni-specific and Zn-specific ligand substitutions identified in
    vitro into the H. pylori chromosomal ureE and measure urease activity, cellular
    nickel content and acid survival for each allele.
  experiment_type: Allelic replacement with enzyme assays and metal quantification
