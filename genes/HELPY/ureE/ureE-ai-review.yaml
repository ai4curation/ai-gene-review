- term:
    id: GO:0019627
    label: urea metabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR007864
  review:
    summary: >-
      UreE acts only in the catabolic branch of urea metabolism, by supplying the
      nickel cofactor that the hydrolytic step depends on.
    action: MODIFY
    reason: >-
      The term is true but less specific than the evidence supports: H. pylori has no
      urea-synthesizing role for this protein, and UreE's documented function is
      activation of the urea-hydrolyzing enzyme. The specific child GO:0043419 urea
      catabolic process is the supported term, and it is the term PANTHER-based
      annotation places on the other accessory proteins. UreE qualifies as a
      participant on the cofactor-contribution reading: it does not merely enable the
      pathway from outside, it donates the active-site metal without which no step
      occurs.
    proposed_replacement_terms:
    - id: GO:0043419
      label: urea catabolic process
    supported_by:
    - reference_id: PMID:29203664
      supporting_text: >-
        The nickel-charged UreE dimer, providing the sole source of nickel, and the
        UreG2F2H2 complex could activate urease in vitro in the presence of GTP.
    - reference_id: PMID:25752610
      supporting_text: >-
        The pathogenicity of Helicobacter pylori relies heavily on urease, which
        converts urea to ammonia to neutralize the stomach acid.
