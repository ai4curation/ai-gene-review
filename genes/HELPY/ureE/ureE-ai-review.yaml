id: Q09064
gene_symbol: ureE
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:85962
  label: Helicobacter pylori 26695
description: >-
  UreE is the nickel metallochaperone of the Helicobacter pylori urease
  maturation system. It is a cytoplasmic homodimer that binds nickel with
  sub-micromolar affinity through conserved histidine ligands (one Ni(2+) per
  dimer; it also binds Zn(2+) at a distinct site) and hands that nickel on to the
  GTPase UreG through a transient UreE2-UreG2 complex, in which it additionally
  promotes GTP loading of UreG. Upstream, UreE receives nickel from the
  hydrogenase/urease nickel-trafficking protein HypA, so it sits at the junction
  of cellular nickel supply and urease activation. Nickel-charged UreE is
  sufficient, with UreG and the UreF-UreH complex, to activate apo-urease in
  vitro, identifying it as the proximal nickel source for assembly of the urease
  dinickel active site; apo-UreE cannot substitute. UreE is not itself catalytic
  and is not a subunit of the mature urease.
