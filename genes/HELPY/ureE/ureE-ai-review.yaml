- term:
    id: GO:0006457
    label: protein folding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR012406
  review:
    summary: >-
      InterPro-derived "protein folding" for a metallochaperone: UreE does not
      promote folding, it completes the maturation of urease by supplying nickel.
    action: MODIFY
    reason: >-
      There is no evidence that UreE assists polypeptide folding; apo-urease folds
      and assembles into a native-size inactive enzyme without any accessory protein
      (PMID:1612735). What UreE does is deliver the nickel required for the enzyme
      to attain catalytic competence, which is protein maturation rather than protein
      folding. GO:0110147 "protein maturation by nickel ion transfer" is obsolete, so
      the parent term GO:0051604 is the available replacement.
    proposed_replacement_terms:
    - id: GO:0051604
      label: protein maturation
    supported_by:
    - reference_id: PMID:1612735
      supporting_text: >-
        Clones containing only ureA and ureB also produced an assembled but inactive
        enzyme.
    - reference_id: PMID:29203664
      supporting_text: >-
        The nickel-charged UreE dimer, providing the sole source of nickel, and the
        UreG2F2H2 complex could activate urease in vitro in the presence of GTP.
