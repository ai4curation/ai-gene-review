  review:
    summary: >-
      Yeast two-hybrid interaction between UreE and the urease maturation GTPase
      UreG (genome-wide H. pylori interaction map).
    action: MODIFY
    reason: >-
      Bare protein binding carries no functional information, but in this case the
      interaction has a well-defined molecular meaning that is independently
      established: the UreE-UreG complex is the nickel-transfer step of urease
      maturation. In vitro, complexation of H. pylori UreE and UreG facilitates
      transfer of nickel from UreE to UreG (PMID:25752610), and nickel-charged UreE
      is the sole nickel source able to activate apo-urease via UreG
      (PMID:29203664). The informative replacement is therefore nickel chaperone
      activity, which is defined as directly binding and delivering nickel ions to a
      target protein.
    proposed_replacement_terms:
    - id: GO:0170061
      label: nickel chaperone activity
    supported_by:
    - reference_id: PMID:25752610
      supporting_text: >-
        Combined biophysical and bioassay studies show that the formation of 2E-2G
        complex not only facilitates nickel transfer from UreE to UreG, but also
        enhances the binding of GTP.
    - reference_id: PMID:29203664
      supporting_text: >-
        The activation was nickel dependent because adding apo-UreE 2 without the
        bound nickel (UreE 2 ) failed to activate urease
