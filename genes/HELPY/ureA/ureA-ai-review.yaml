- term:
    id: GO:0043419
    label: urea catabolic process
  evidence_type: IMP
  original_reference_id: PMID:1313413
  qualifier: involved_in
  review:
    summary: >-
      Mutation of ureA abolishes urease expression/activity in the heterologous
      E. coli reconstitution of the H. pylori urease cluster.
    action: ACCEPT
    reason: >-
      Cussac et al. showed by transposon and insertion mutagenesis that ureA is one
      of the five genes required for urease activity, and UniProt records the
      disruption phenotype from the same paper. Combined with the structural
      evidence that UreA is a subunit of the enzyme, the phenotype reflects direct
      participation rather than mere necessity.
    supported_by:
    - reference_id: PMID:1313413
      supporting_text: >-
        Of the nine urease genes identified, ureA, ureB, ureF, ureG, and ureH were
        shown to be required for urease expression in E. coli, as mutations in each
        of these genes led to negative phenotypes.
    - reference_id: file:HELPY/ureA/ureA-uniprot.txt
      supporting_text: 'DISRUPTION PHENOTYPE: Cells do not express urease.'
- term:
    id: GO:0005198
    label: structural molecule activity
  evidence_type: IDA
  original_reference_id: PMID:11373617
  qualifier: enables
  review:
    summary: >-
      UreA is a non-catalytic structural chain that, together with UreB, builds the
      trimeric catalytic unit and the dodecameric shell.
    action: NEW
    reason: >-
      The urease structure shows the enzyme as an assembly of 12 catalytic units
      built from UreA and UreB, and recombinant UreA+UreB alone assemble a
      native-size but inactive apoenzyme (PMID:1612735) - i.e. UreA's contribution is
      architectural, not catalytic. This mirrors the treatment of the separate gamma
      and beta chains in other bacteria (e.g. PSEPK ureA/ureB) and gives UreA an
      informative molecular function in place of the over-annotated urease activity
      rows.
    supported_by:
    - reference_id: PMID:11373617
      supporting_text: >-
        We have determined the crystal structure of H. pylori urease, which has a
        1.1 MDa spherical assembly of 12 catalytic units with an outer diameter of
        approximately 160 A.
    - reference_id: PMID:1612735
      supporting_text: >-
        Clones containing only ureA and ureB also produced an assembled but inactive
        enzyme.
