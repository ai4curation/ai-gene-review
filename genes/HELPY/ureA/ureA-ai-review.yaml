- term:
    id: GO:0016151
    label: nickel cation binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR002026
  - InterPro:IPR036463
  review:
    summary: >-
      InterPro-based transfer of nickel binding to UreA; the urease nickel site is
      in the catalytic UreB subunit.
    action: REMOVE
    reason: >-
      The two active-site nickel ions are coordinated by residues of the alpha
      (UreB) subunit, bridged by carbamylated Lys219 (PMID:22013070, and the
      UniProt binding-site features of P69996). Neither H. pylori-specific nor
      family-level evidence gives the gamma-beta chain a nickel-binding site, and the
      ureA UniProt record lists no metal-binding feature. The InterPro domain
      signatures that triggered this row describe the urease family as a whole, not a
      UreA metal site.
    supported_by:
    - reference_id: PMID:22013070
      supporting_text: >-
        Activation of apo-urease involves carboxylation of lysine 219 and insertion
        of two nickel ions.
