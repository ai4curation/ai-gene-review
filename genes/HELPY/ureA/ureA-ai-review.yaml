gene_symbol: ureA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:85962
  label: Helicobacter pylori 26695
description: >-
  UreA is the small structural chain of Helicobacter pylori urease. Unlike most
  bacterial ureases, which have three distinct chains (gamma UreA, beta UreB,
  alpha UreC), H. pylori urease has only two: UreA is a natural fusion of the
  gamma and beta subunits, while the catalytic alpha subunit is encoded by ureB.
  Three UreA-UreB heterodimers form a trimeric catalytic unit and four such units
  assemble into a 1.1 MDa dodecameric sphere whose clustered active sites allow
  the enzyme to stay active at low pH. UreA itself is non-catalytic: it provides
  the structural framework that completes the active-site cleft of the
  neighbouring catalytic subunit, so it contributes to, rather than independently
  possesses, urease activity. The assembled, nickel-loaded enzyme hydrolyzes urea
  to ammonia and bicarbonate in the cytoplasm, and the ammonia produced raises
  the local pH and permits colonization of the gastric mucosa.
