- term:
    id: GO:0009039
    label: urease activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN002129956
  - PomBase:SPAC1952.11c
  - UniProtKB:P9WFE9
  review:
    summary: >-
      UreA is the fused gamma-beta structural chain; the dinickel catalytic centre
      lies in UreB, so UreA contributes to urease activity rather than enabling it
      on its own.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The PAINT node is placed on a clade that includes single-chain eukaryotic
      ureases (e.g. the S. pombe and mycobacterial donors), in which the gamma, beta
      and alpha regions are one polypeptide that genuinely enables the activity. In
      H. pylori the chains are split: ureB encodes the catalytic alpha subunit with
      carbamylated Lys219 and the two nickel ions, while ureA encodes only the beta
      and gamma regions (PMID:22013070, PMID:24115911). The claim is not false at the
      holoenzyme level, but an enables qualifier on an individual non-catalytic
      subunit overstates it; the appropriate expression is contributes_to urease
      activity within GO:0035550, as recorded in core_functions.
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - ROLE_CONFLATION
      source_entities:
      - source_id: PANTHER:PTN002129956
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          The ancestral node covers ureases in which the gamma, beta and alpha
          regions are catalytically self-contained (single-chain eukaryotic ureases
          among the descendants), so urease activity is properly enabled there. In
          the two-chain H. pylori enzyme the catalytic alpha region is on UreB, so
          the node's activity claim describes the holoenzyme rather than this
          subunit.
    supported_by:
    - reference_id: PMID:22013070
      supporting_text: >-
        the ureA gene encodes the β and γ subunits as a fusion protein, and the ureB
        gene encodes the α subunit
    - reference_id: PMID:24115911
      supporting_text: >-
        Maturation of urease, a process that involves the delivery of two nickel
        ions into the carbamylated active site of the apo-enzyme, offers a paradigm
        to study metallochaperone-driven incorporation of metal into metalloenzyme.
