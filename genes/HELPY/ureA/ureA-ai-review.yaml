suggested_questions:
- question: >-
    Does the gamma-beta fusion in H. pylori UreA, rather than the separate chains
    found in other bacteria, contribute to the distinctive dodecameric assembly and
    its acid resistance?
suggested_experiments:
- hypothesis: >-
    The gamma-beta linker of UreA is required for dodecamer formation rather than
    for catalysis per se.
  description: >-
    Express H. pylori urease with UreA split into separate gamma and beta
    polypeptides at the natural domain boundary and compare assembly state (SEC/light
    scattering, EM) and specific activity with the wild-type enzyme.
  experiment_type: Protein engineering with assembly and activity assays
