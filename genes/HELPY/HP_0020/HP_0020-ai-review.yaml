id: O24865
gene_symbol: HP_0020
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:85962
  label: Helicobacter pylori 26695
description: HP_0020 is a predicted pyridoxal-phosphate-dependent carboxypolyamine decarboxylase of Helicobacter
  pylori 26695. Its NspC-family membership supports decarboxylation of carboxyspermidine to spermidine
  in the alternative polyamine pathway. It is distinct from the LysA enzymes responsible for diaminopimelate
  decarboxylation and lysine synthesis. Direct substrate assays and native flux measurements for HP_0020
  remain unavailable.
