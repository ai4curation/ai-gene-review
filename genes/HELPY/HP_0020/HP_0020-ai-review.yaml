  supported_by: *id003
proposed_new_terms:
- proposed_name: carboxyspermidine decarboxylase activity
  proposed_definition: 'Catalysis of the reaction: carboxyspermidine + H+ = spermidine + carbon dioxide.'
  justification: The reaction is represented by RHEA:34095 within EC 4.1.1.96. No specific active decarboxylase
    GO term was found by QuickGO name searches on 2026-11-05. This proposal captures the spermidine-forming
    reaction and does not assert carboxynorspermidine, CAPA or tetramine specificity.
  proposed_parent:
    id: GO:0016831
    label: carboxy-lyase activity
  supported_by:
  - *id007
suggested_questions:
- question: What are the relative catalytic efficiencies and native fluxes for the carboxyspermidine,
    carboxynorspermidine and CAPA routes in this exact strain?
suggested_experiments:
- description: Measure purified exact-strain enzyme kinetics with competing substrates and couple these
    assays to isotope-resolved polyamine metabolomics and genetic complementation.
  experiment_type: enzyme kinetics and isotope tracing
