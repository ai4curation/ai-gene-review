core_functions:
- description: Predicted PLP-dependent decarboxylation of carboxyspermidine to spermidine, inferred from
    NspC-family enzymes and the H. pylori alternative spermidine pathway.
  proposed_molecular_function: carboxyspermidine decarboxylase activity
