  review:
    summary: Refine the broad catalytic annotation to carboxyspermidine decarboxylase activity.
    action: MODIFY
    reason: NspC subfamily membership and characterized carboxypolyamine decarboxylases support this specific
      activity. This is a homology inference for HP_0020, not a direct assay. The native amine-substrate
      route cannot be established by NspC membership alone. No active specific GO term was found in QuickGO
      name searches on 2026-11-05; the proposed term describes the spermidine-forming reaction without
