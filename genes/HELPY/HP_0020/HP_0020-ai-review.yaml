  review:
    summary: Reject LysA chemistry propagated onto the NspC subfamily.
    action: REMOVE
    reason: The PTHR43727 family contains both LysA and NspC branches; this protein is classified in NspC
      subfamily SF1. Its family review scopes diaminopimelate decarboxylation and lysine biosynthesis
      to SF2 and judges the ancestral PTN000159906 assertions to need pruning before propagation into
      SF1. Experimentally characterized NspC/CAPA homologues differ in carboxypolyamine specificity and
      reject meso-diaminopimelate. This challenges transfer across functional subfamilies, not the donor
      count. just paint-losses HELPY HP_0020 found no IRD or IKR on this lineage; there is currently no
      loss blocking the overly broad IBD.
    supported_by:
    - *id001
    - &id002
      reference_id: PMID:19196710
      supporting_text: no activity with l -arginine, l -lysine, and meso -diaminopimelate
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      source_entities:
