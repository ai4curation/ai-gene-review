  review:
    summary: Replace native norspermidine synthesis with the supported spermidine pathway role.
    action: MODIFY
    reason: The InterPro mapping turns NspC-family membership into a norspermidine process claim. The
      H. pylori CASDH study supports the alternative spermidine pathway, whereas no native norspermidine
      production by HP_0020 was established. The replacement is an inference from its catalytic NspC role
      and organismal pathway evidence, not a 26695 knockout claim. Catalytic decarboxylation makes the
      enzyme a direct participant. Native specificity against CAPA remains to be tested.
    supported_by:
    - *id001
    - *id005
    proposed_replacement_terms:
