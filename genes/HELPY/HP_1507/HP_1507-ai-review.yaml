suggested_questions:
- question: Is O26037 N-terminally incomplete because of an incorrect start assignment, and does the exact
    short protein retain NADPH-dependent carboxypolyamine synthesis?
suggested_experiments:
- description: Verify the native translation start and N terminus in 26695; assay the exact 385-residue
    protein and an experimentally justified extended construct for NADP binding and product formation
    with putrescine, DAP and agmatine.
  experiment_type: translation-start verification, ligand binding and enzyme kinetics
knowledge_gaps:
- gap_statement: Does the native 26695 translation product include the N-terminal NADP-contacting segment
    absent from the O26037 reference sequence, and can the exact 385-residue protein catalyse carboxypolyamine
    formation?
  boundary: The structure is A0A2X5A3P4 from NCTC11637, not an assay of O26037. Five residues in the absent
    segment contact NADP within 4 Å in 8H52. Neither activity loss nor an incorrect translation start
    is proven. Substrate choice between putrescine, diaminopropane and agmatine remains unresolved even
    if cofactor competence is established.
  gap_kind:
  - BIOLOGY
  status: OPEN
  significance: Controls whether any CASDH activity or native spermidine-pathway role can safely be assigned
    to this exact protein.
  resolution: Verify the 26695 genomic and translated N terminus; compare exact and extended proteins
    for NADP binding and LC-MS-verified reactions with competing amines.
  provenance:
