taxon:
  id: NCBITaxon:85962
  label: Helicobacter pylori 26695
description: HP_1507 is a carboxypolyamine-dehydrogenase-family protein in Helicobacter pylori 26695.
  The 385-residue reference sequence is shorter at its N terminus than the 399-residue CASDH structurally
  characterized from strain NCTC 11637. The absent segment contacts NADP in the homologous structure,
  leaving cofactor binding and catalytic competence of the shorter protein unresolved. Its exact translation
  start, amine substrate and contribution to native polyamine biosynthesis require verification.
references:
- id: file:HELPY/HP_1507/HP_1507-hypotheses/kgap-hp1507-start-site/openscientist.md
  title: OpenScientist analysis of whether the O26037 reference start site of HP_1507 is wrong
  findings:
  - statement: >-
      An in-frame TTG lies 42 nucleotides upstream of the annotated GTG with no intervening stop, and
      translation from it gives a 399-residue protein identical to RefSeq and restoring the Rossmann
      GxGxxG fingerprint that O26037 lacks; no sampled H. pylori ortholog annotation reproduces the
      385-residue form, and InterPro clips O26037's cofactor-domain matches by exactly the annotation
      difference while the C-terminal match agrees.
    supporting_text: >-
      Within *H. pylori*, 26695 is the outlier, and a single divergent annotation in an otherwise uniform
      set is evidence of an annotation error rather than of real variation.
  reference_review:
    relevance: HIGH
    correctness: UNVERIFIED
    review_notes: >-
      Computed results only; the run's literature quotations were not independently re-verified. Verified
      locally: O26037 is 385 residues beginning MVAHKMGMNRD, prefixing the stated 14-residue extension gives
      399 residues with Met at the position the run reports for O26037 Met1 and the GAGGVG fingerprint at
      8-13, and the record carries the PF03435, PF16653 and SSF51735 cross-references the InterPro argument
      uses, EMBL AE000511 with AAD08549.1, and protein existence level 4, Predicted. Not verified: the
      genomic coordinates and codon walk, the RefSeq and identical-protein-group records, the 382-record
      ortholog survey, the initiator-codon and Shine-Dalgarno genome statistics, the InterPro match
      boundaries on the orthologs, and the 8H52 contact counts and secondary structure. The run reports no
      unresolved references.
