gene_model_issues:
- issue_type: WRONG_START_SITE
  status: SUSPECTED
  description: 'The frozen O26037 model from H. pylori 26695 begins at a position corresponding to residue
    15 of the 399-residue NCTC 11637 structural protein A0A2X5A3P4. Thus a potentially misplaced translation
    start omits 14 homologous N-terminal residues, including five residues whose heavy atoms lie within
    4.0 Å of NADP in 8H52. This is a hypothesis from homolog comparison, not a demonstrated correction:
    the proteins come from different strains, the corresponding first retained residue is M in O26037
    versus V in the structural construct, and the 26695 genomic start and translated N terminus have not
    been verified. Genuine strain-specific sequence divergence or a functional shortened product remains
    possible. The structural contacts explain why confident catalytic transfer is withheld; they do not
    prove model error or inactivity. No corrected start codon or extended 26695 sequence is asserted.'
  evidence_types:
  - ORTHOLOG_COMPARISON
  supported_by:
  - reference_id: file:HELPY/HP_1507/HP_1507-bioinformatics/RESULTS.md
    supporting_text: Aligning the shared C-terminal region places O26037 residue 1 at native residue 15
      (V in the structural construct, M in O26037); native residues 1–14 are absent.
