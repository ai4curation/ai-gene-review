gene_model_issues:
- issue_type: WRONG_START_SITE
  status: CONFIRMED
  description: >-
    The O26037 model from H. pylori 26695 begins at a position corresponding to residue 15 of the
    399-residue protein, so it omits 14 homologous N-terminal residues that carry the Rossmann GxGxxG
    dinucleotide-binding fingerprint and contribute 15 heavy atoms within 4 Angstrom of NADP in 8H52. The
    earlier version of this entry withheld the claim because the 26695 genomic start and translated
    N-terminus had not been verified; an OpenScientist run has now verified both. The genome carries an
    in-frame TTG 42 nucleotides upstream of the annotated GTG with all 13 intervening codons open and the
    first in-frame stop a further 31 codons back, and translation from it gives a 399-residue protein
    byte-identical to the RefSeq entry and 99 per cent identical to the NCTC11637 structural protein, with
    no difference inside the extension. RefSeq already annotates the 1200-nucleotide CDS with the TTG
    initiator across all 78 assemblies of its identical-protein group; no one of 382 sampled H. pylori
    ortholog annotations reproduces the 385-residue form; the extension abuts an 85-base-pair divergent
    intergenic region and creates no overlap; TTG initiates more 26695 genes than GTG does; and InterPro
    clips the PF03435 and SSF51735 matches on O26037 by 12 and 27 residues while the C-terminal PF16653
    match agrees exactly, which is the signature of a truncated N-terminus rather than of real divergence.
    The strain-divergence and shortened-product alternatives are no longer tenable: the 385-residue form is
    unique to the original 1997 GenBank submission for 26695 and to the UniProt entry derived from it, and
    the missing segment is an interior beta-strand with the annotated start falling in the middle of helix
    A, so a folded 385-residue product is unlikely. The correction is therefore asserted as the 399-residue
    product from the TTG at AE000511.1:1580280, CDS 1580280..1581479. It rests on genomic sequence,
    annotation across strains, domain boundaries and the structure, not on proteomics: no experimental
    N-terminus for this protein exists in any strain, and the 8H52 construct carries an engineered GSHMAS
    tag so its first residue is a construct boundary. The affected annotations are those that depend on
    cofactor binding; this review's withholding of confident catalytic transfer stands, because the
    substrate question is separate and untouched.
  evidence_types:
  - GENOMIC_SEQUENCE
  - ORTHOLOG_COMPARISON
  - DOMAIN_ARCHITECTURE
  - ADJACENT_GENES
