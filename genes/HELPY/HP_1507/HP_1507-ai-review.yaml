- id: file:HELPY/HP_1507/HP_1507-bioinformatics/RESULTS.md
  title: HP1507 construct and NADP-contact assessment
  findings:
  - statement: The 26695 reference sequence lacks a segment that contacts NADP in the 399-residue NCTC11637
