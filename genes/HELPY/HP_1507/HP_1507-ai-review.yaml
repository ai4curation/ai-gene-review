  label: Helicobacter pylori 26695
description: HP_1507 is a carboxypolyamine-dehydrogenase-family protein in Helicobacter pylori 26695.
  The 385-residue reference sequence is shorter at its N terminus than the 399-residue CASDH structurally
  characterized from strain NCTC 11637. The absent segment contacts NADP in the homologous structure,
  leaving cofactor binding and catalytic competence of the shorter protein unresolved. Its exact translation
  start, amine substrate and contribution to native polyamine biosynthesis require verification.
