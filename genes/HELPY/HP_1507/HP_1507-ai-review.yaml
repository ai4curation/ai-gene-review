suggested_questions:
- question: Is O26037 N-terminally incomplete because of an incorrect start assignment, and does the exact
    short protein retain NADPH-dependent carboxypolyamine synthesis?
suggested_experiments:
- description: Verify the native translation start and N terminus in 26695; assay the exact 385-residue
    protein and an experimentally justified extended construct for NADP binding and product formation
    with putrescine, DAP and agmatine.
  experiment_type: translation-start verification, ligand binding and enzyme kinetics
knowledge_gaps:
- gap_statement: Does the native 26695 translation product include the N-terminal NADP-contacting segment
    absent from the O26037 reference sequence, and can the exact 385-residue protein catalyse carboxypolyamine
    formation?
  boundary: >-
    The structure is A0A2X5A3P4 from NCTC11637, not an assay of O26037. Five residues in the absent segment
    contact NADP within 4 Angstrom in 8H52. Neither activity loss nor an incorrect translation start is
    proven. Substrate choice between putrescine, diaminopropane and agmatine remains unresolved even if
    cofactor competence is established. An OpenScientist run (kgap-hp1507-start-site) settles the start-site
    half of this gap on the genomic sequence, which is what the gap and the gene model issue both asked for,
    and leaves the substrate half untouched. The 26695 genome carries an in-frame TTG 42 nucleotides
    upstream of the annotated GTG, with all 13 intervening codons open and the first in-frame stop a further
    31 codons back inside the intergenic region; translating from it gives exactly 399 residues, the
    14-residue extension MHTVLQIGAGGVGS followed by the 385 residues of O26037, which the local record
    confirms begins MVAHKMGMNRD. That translation is byte-identical to the RefSeq protein and 99 per cent
    identical to the NCTC11637 protein of 8H52, with none of the four differences inside the extension, so
    the decisive test the hypothesis specified passes: the intervening sequence is in frame and free of
    stops. Four further lines agree and are largely independent of one another. The extension restores the
    Rossmann GxGxxG dinucleotide-binding fingerprint at positions 8-13 of the longer form, which O26037
    lacks; of 382 sampled H. pylori ortholog annotations not one reproduces the 385-residue N-terminus, 375
    use the 399-residue start, and all 11 non-pylori Helicobacter orthologs examined begin with the same
    motif across 71 to 97 per cent identity, so the uniformity is not an artefact of near-identical
    sequences. InterPro shows the truncation directly rather than by inference: on O26037 the PF03435 match
    starts 12 residues late and the SSF51735 Rossmann match 27 residues late, while the C-terminal PF16653
    match agrees exactly, so only the N-terminal boundary of the cofactor domain differs and it differs by
    the size of the annotation discrepancy; the local record carries all three signatures. And RefSeq has
    already moved to the corrected coordinates, annotating a 1200-nucleotide CDS with a TTG initiator across
    all 78 assemblies in the identical-protein group, while the extension creates no overlap, since the
    proposed start is the first base after an 85-base-pair divergent intergenic region. Two objections were
    tested genome-wide and both fail: TTG initiates 9.5 per cent of 26695 genes, more than GTG at 6.1 per
    cent, and the proposed ribosome-binding site scores at the 72nd percentile of 1528 CDSs with a canonical
    four-base spacer. The run is explicit that the Shine-Dalgarno comparison does not discriminate between
    the two starts, 13 against 12 being within noise; it removes an objection rather than choosing. On the
    structural question the run reaches the same conclusion as this review but by a different route, and it
    corrects the framing: of the 15 heavy atoms within 4 Angstrom of NADP contributed by the missing
    segment, 12 are backbone and only 3 are side chain, which is weak evidence of essentiality on its own,
    exactly as the hypothesis anticipated. What carries the argument instead is position: the missing
    Thr3-Ile7 is an interior strand of a seven-stranded sheet paired in parallel with Ala33, helix A runs
    from Gly10 to Asn23 so the O26037 start falls mid-helix, and residues 2-14 make 285 heavy-atom contacts
    with 33 core residues. A folded 385-residue product is therefore unlikely. The remaining limits are
    stated plainly and are why the substrate half of this gap does not move: no proteomic or
    ribosome-profiling evidence reports this protein's N-terminus anywhere, six PubMed queries returning
    nothing to quote, and the 8H52 construct carries an engineered GSHMAS tag ahead of MHTVLQI, so its
    SEQRES records a construct boundary and not a native initiating residue; the ortholog agreement is
    annotation rather than observation, and the 382-record sample is an arbitrary slice of 6456 records
    whose entries are not independent, so the 98 per cent should not be read as a population frequency.
