  title: ChePep controls Helicobacter pylori Infection of the gastric glands and chemotaxis in the
    Epsilonproteobacteria.
  findings:
  - statement: ChePep controls reversal bias and chemotactic behavior; experiments distinguish G27
      cell behavior from SS1 mouse colonization.
    supporting_text: Genetic analysis of the chemotaxis signaling pathway shows that ChePep regulates
      flagellar rotation through the chemotaxis system.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text inspected. The 26695 annotation is retained as a well-supported ortholog
      location claim; no G27 experiment is relabeled as a native 26695 assay.
- id: PMID:26061894
  title: Helicobacter pylori CheZ(HP) and ChePep form a novel chemotaxis-regulatory complex distinct
    from the core chemotaxis signaling proteins and the flagellar motor.
  findings:
  - statement: CheZ and ChePep interact directly and depend on one another for polar localization,
      separately from the receptor-CheA cluster.
    supporting_text: Together, these findings indicate that CheZHP and ChePep depend on each other
      for their polar localization and form a novel chemotaxis protein cluster distinct from the
      flagellar or chemotaxis signaling complexes.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PMID:26061894 primarily studies G27 derivatives; its methods explicitly report
      some localization confirmation in 26695, SS1, SS2000 and J99, without assigning every panel
      to 26695. The target is the curated 26695 ortholog, not an asserted identical G27 construct.
      The full cheZ deletion gives hyperreversals; the earlier straight-swimming phenotype involved
      a partial deletion retaining terminal fragments. Preliminary ChePep phosphatase assays were
      negative (data not shown); activation of CheZ was proposed, not established.
