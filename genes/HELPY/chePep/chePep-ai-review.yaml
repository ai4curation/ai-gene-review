gene_symbol: chePep
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:85962
  label: Helicobacter pylori 26695
description: ChePep (HP_0322) is a cytoplasmic chemotaxis regulator that binds the phosphatase CheZ
  and helps organize its polar localization. ChePep and CheZ depend on one another for polar positioning
  in a complex distinct from the receptor-CheA signaling cluster. ChePep controls swimming reversal
  bias and contributes to effective gastric colonization in H. pylori models. A phosphatase or phosphatase-activator
  activity has not been established for ChePep.
