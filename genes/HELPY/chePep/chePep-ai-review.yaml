core_functions:
- description: Binds CheZ and helps organize its polar chemotaxis-regulatory complex, thereby controlling
    response-regulator signaling and swimming reversal bias. The direct binding/localization mechanism
    is supported in H. pylori; inference to 26695 does not establish enzymatic activity or allosteric
    activation of CheZ.
