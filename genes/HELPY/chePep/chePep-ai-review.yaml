- term:
    id: GO:0019903
    label: protein phosphatase binding
  evidence_type: ISS
  original_reference_id: PMID:26061894
  review:
    summary: ChePep directly binds the CheZ protein phosphatase.
    action: NEW
    reason: Purified-protein reciprocal co-immunoprecipitation demonstrates direct ChePep-CheZ binding,
      and loss of ChePep disrupts CheZ polar localization. This functional interaction supports the
      specific binding term, not generic protein binding, inferred to the curated 26695 ortholog
      from the G27-centered study. ChePep phosphatase activity was not detected in preliminary assays;
      activation of CheZ remains a hypothesis.
    supported_by:
    - reference_id: PMID:26061894
      supporting_text: We used co-immunoprecipitation with purified proteins (Fig. 7A), and found
        that CheZHP was co-immunoprecipitated with ChePep, suggesting these proteins interact directly
        (Fig.7B), and ChePep was similarly co-immunoprecipitated with CheZHP (data not shown).
    - reference_id: PMID:26061894
      supporting_text: Together, these findings indicate that CheZHP and ChePep depend on each other
        for their polar localization and form a novel chemotaxis protein cluster distinct from the
        flagellar or chemotaxis signaling complexes.
    - reference_id: PMID:26061894
      supporting_text: Preliminary in vitro experiments, however, did not detect any phosphatase
        activity associated with ChePep (data not shown).
- term:
    id: GO:0050920
    label: regulation of chemotaxis
  evidence_type: ISS
  original_reference_id: PMID:26061894
  review:
    summary: ChePep organizes a polar chemotaxis phosphatase complex.
    action: NEW
    reason: ChePep performs structural work in the regulatory mechanism by directly binding CheZ
      and organizing its polar distribution, in addition to the documented hyperreversal and chemotaxis
      phenotypes. Thus this proposal rests on participation, not deletion necessity alone. G27 mechanism
      and SS1 colonization data are distinguished from the inferred 26695 function; no infection
      or redundant chemotaxis parent term is added.
    supported_by:
    - reference_id: PMID:26061894
      supporting_text: We used co-immunoprecipitation with purified proteins (Fig. 7A), and found
        that CheZHP was co-immunoprecipitated with ChePep, suggesting these proteins interact directly
        (Fig.7B), and ChePep was similarly co-immunoprecipitated with CheZHP (data not shown).
    - reference_id: PMID:26061894
      supporting_text: Together, these findings indicate that CheZHP and ChePep depend on each other
        for their polar localization and form a novel chemotaxis protein cluster distinct from the
        flagellar or chemotaxis signaling complexes.
    - reference_id: PMID:21791582
      supporting_text: Genetic analysis of the chemotaxis signaling pathway shows that ChePep regulates
        flagellar rotation through the chemotaxis system.
