  review:
    summary: >-
      UreG is a SIMIBI-class P-loop GTPase whose GTP hydrolysis is measured
      directly and is required for urease maturation.
    action: ACCEPT
    reason: >-
      Purified H. pylori UreG hydrolyzes GTP: each nickel-charged dimer releases
      about two phosphates when stimulated by bicarbonate (PMID:24115911), and its
      GTPase activity is stimulated by K+/NH4+ and HCO3- to a biologically relevant
      level (PMID:25752610). A chromosomal P-loop substitution (Lys14 to Ala)
      produces protein with negligible GTP hydrolysing activity and abolishes urease
      activity (PMID:14521881). The InterPro-derived term is exactly right.
    supported_by:
    - reference_id: PMID:24115911
      supporting_text: >-
        We found that each nickel-charged UreG dimer, when stimulated by bicarbonate,
        released 2.0±0.4 phosphate
    - reference_id: PMID:14521881
      supporting_text: >-
        Purified UreG parental and mutant (Lys14 to Ala14) proteins had molecular
        masses of 27 kDa, but possessed negligible GTP hydrolyzing activity.
