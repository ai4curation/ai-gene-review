suggested_questions:
- question: >-
    How is metal selectivity achieved in vivo, given that apo-UreG binds zinc more
    tightly than nickel in vitro while the GTP-bound dimer is nickel-specific?
- question: >-
    What makes bicarbonate (and K+/NH4+) the physiological stimulators of UreG GTP
    hydrolysis, and does their effect couple carbamylation of urease Lys219 to
    nickel insertion?
suggested_experiments:
- hypothesis: >-
    Bicarbonate stimulation of UreG GTP hydrolysis is the step that times nickel
    release to completion of Lys219 carbamylation.
  description: >-
