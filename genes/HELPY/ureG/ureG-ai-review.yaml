id: Q09066
gene_symbol: ureG
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:85962
  label: Helicobacter pylori 26695
description: >-
  UreG is the GTP-hydrolysing nickel metallochaperone of the Helicobacter pylori
  urease maturation system and a member of the SIMIBI class of P-loop GTPases
  (G3E family). It is recruited by the UreF-UreH platform, where the two UreG
  protomers are juxtaposed so that their invariant Cys66-Pro67-His68 motifs form a
  single metal site at the dimer interface; GTP binding drives this dimerization
  and the rotation of Cys66 and His68 into a square-planar nickel coordination.
  UreG receives nickel from the metallochaperone UreE through a transient
  UreE2-UreG2 complex, which also promotes GTP loading. Nickel and GTP release the
  charged UreG dimer from UreF-UreH; it then engages the UreF-UreH-urease complex,
  and bicarbonate-stimulated GTP hydrolysis returns UreG to a monomer while
  releasing its nickel into the urease active site. UreG is thus the nucleotide
  switch that couples GTP hydrolysis to nickel insertion: nickel-loaded UreG is
  sufficient, with UreF-UreH, to activate apo-urease in vitro, whereas P-loop
  mutants with negligible GTPase activity abolish urease activity in vivo. UreG is
  not part of the mature enzyme and has no role in its oligomeric assembly.
