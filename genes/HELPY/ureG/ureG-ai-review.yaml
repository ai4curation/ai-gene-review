      supporting_text: >-
        Combined biophysical and bioassay studies show that the formation of 2E-2G
        complex not only facilitates nickel transfer from UreE to UreG, but also
        enhances the binding of GTP.
    - reference_id: PMID:24115911
      supporting_text: >-
        demonstrated that the nickel-charged UreG dimer, upon GTP hydrolysis, reverts
        to its monomeric form and releases nickel to urease.
