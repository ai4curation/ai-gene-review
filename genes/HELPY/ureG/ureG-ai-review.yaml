  review:
    summary: >-
      UreG binds UreF within the UreG/UreF/UreH complex, as resolved
      crystallographically and probed by GST pull-down assays.
    action: MODIFY
    reason: >-
      The generic term hides the function of the contact. Recruitment of UreG by
      UreF-UreH is what builds UreG's nickel site and what licenses nickel transfer
      to apo-urease; nickel-charged UreG cannot activate urease without the UreF/UreH
      complex. The informative term for UreG's contribution to this step is urease
      activator activity, defined as increasing urease activity by promoting
      incorporation of nickel into the active site.
