  review:
    summary: >-
      Yeast two-hybrid interaction between UreG and the nickel metallochaperone UreE
      from the genome-wide H. pylori interaction map.
    action: MODIFY
    reason: >-
      Bare protein binding carries no functional information, and here the
      interaction's molecular meaning is established independently: the UreE2-UreG2
      complex transfers nickel from UreE to UreG and preactivates UreG's GTPase
      (PMID:25752610), and nickel-loaded UreG then releases that nickel into urease
      upon GTP hydrolysis (PMID:24115911). UreG therefore binds and delivers nickel
      to a target protein, which is nickel chaperone activity.
    proposed_replacement_terms:
    - id: GO:0170061
      label: nickel chaperone activity
    supported_by:
