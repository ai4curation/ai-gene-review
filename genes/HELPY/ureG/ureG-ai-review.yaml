        UreG(H68A) variants.
    - reference_id: PMID:25752610
      supporting_text: >-
        In this study, we demonstrate that, in the presence of GTP and Mg(2+), UreG
        binds Ni(2+) with an affinity (Kd) of ∼0.36 μm.
