  review:
    summary: >-
      Yeast two-hybrid interaction between the two urease structural subunits
      UreB and UreA from the genome-wide H. pylori interaction map.
    action: REMOVE
    reason: >-
      Bare protein binding is uninformative. The UreA-UreB interaction is real
      (it is the assembly of the urease heterohexamer/dodecamer) but it is better
      captured by membership of the urease complex (GO:0035550, proposed as NEW
      below) and by urease activity itself. The cited paper is abstract-only and
      supports no more specific molecular function. Removal does not dispute the
      interaction.
    supported_by:
    - reference_id: PMID:11196647
      supporting_text: >-
        We have used a high-throughput strategy of the yeast two-hybrid assay to
        screen 261 H. pylori proteins against a highly complex library of
        genome-encoded polypeptides.
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:24115911
  qualifier: enables
  supporting_entities:
  - UniProtKB:P14916
  review:
    summary: >-
      Fong et al. used purified (apo-)urease, i.e. the UreA-UreB complex, in
      pull-down and activation assays with the UreG/UreF/UreH accessory proteins.
    action: REMOVE
    reason: >-
      Bare protein binding to the partner structural subunit UreA conveys no
      functional information; the subunit association is the urease complex
      itself (GO:0035550) and the enzyme activity (GO:0009039) is accepted
      separately. No more informative MF for the UreB-UreA interaction is
      supported by this paper, so the generic term is removed per the
      protein-binding policy; the interaction itself is not in doubt.
    supported_by:
    - reference_id: PMID:24115911
      supporting_text: >-
        Interestingly, we found that the nickel-charged UreG dimer can interact
        with the GST-UreF/UreH/urease complex (Figure 7D).
