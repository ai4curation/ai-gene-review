id: P69996
gene_symbol: ureB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:85962
  label: Helicobacter pylori 26695
description: >-
  UreB is the large, catalytic subunit of Helicobacter pylori urease, the
  ortholog of the alpha subunit (UreC) of three-chain bacterial ureases. It
  carries the metallo-dependent hydrolase (TIM-barrel) domain with the dinickel
  active site, in which a carboxylated lysine (Lys219) bridges two nickel ions
  that are inserted post-translationally by the UreE/UreF/UreG/UreH maturation
  machinery. Three UreA-UreB heterodimers form a trimeric unit and four such
  units assemble into a 1.1 MDa spherical dodecamer whose clustered active sites
  remain functional at low pH. The cytoplasmic enzyme hydrolyzes urea to ammonia
  and bicarbonate (Km in the sub-millimolar range), and the ammonia buffers the
  bacterium against gastric acid; urease activity is essential for colonization
  of the stomach.
