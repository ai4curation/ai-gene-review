suggested_questions:
- question: >-
    How does the clustering of 12 active sites inside the dodecameric shell
    protect nickel-chelating residues from protonation at gastric pH?
suggested_experiments:
- hypothesis: >-
    Dodecamer formation is required for acid stability of H. pylori urease.
  description: >-
    Engineer interface mutations that block dodecamer assembly but leave the
    (UreA-UreB)3 unit intact, and compare activity and nickel retention across
    pH 3-8.
  experiment_type: Site-directed mutagenesis with enzyme kinetics and metal analysis
