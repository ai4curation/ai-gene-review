  review:
    summary: >-
      UreB is the catalytic (alpha/UreC-type) subunit carrying the dinickel
      active site; urease activity is its defining function.
    action: ACCEPT
    reason: >-
      The IBA is placed on the urease alpha-subunit clade, which includes plant
      and fungal single-chain ureases and bacterial UreC proteins; UreB is
      squarely inside it, with all active-site ligands conserved (UniProt
      binding/active-site features). Purified native and recombinant H. pylori
      urease hydrolyzes urea (PMID:2188975), and the active site requires
      carbamylated Lys219 and two nickel ions (PMID:24115911).
    supported_by:
    - reference_id: PMID:2188975
      supporting_text: >-
        The purified enzyme exhibited a Km of 0.3 +/- 0.1 mM and a Vmax of 1,100
        +/- 200 mumols of urea hydrolyzed/min/mg of protein
    - reference_id: PMID:22013070
      supporting_text: >-
        the ureA gene encodes the β and γ subunits as a fusion protein, and the
        ureB gene encodes the α subunit
