- id: PMID:24097943
  title: Alkyl hydroperoxide reductase repair by Helicobacter pylori methionine sulfoxide reductase.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text read. Recombinant HP1563 biochemistry and methionine substitutions are separated
      from native SS1 msr-mutant survival assays and E. coli expression-based protection. AhpC is the
      substrate of Msr-mediated repair; this is not an AhpC protein-repair process annotation.
  findings:
  - statement: HOCl-damaged AhpC regains its peroxide activity after Msr-dependent repair.
    supporting_text: Upon incubation with an enzyme repair mixture requiring Msr, oxidized AhpC fully
      recovered peroxide reductase activity (at a level similar to that seen with the nonoxidized sample).
- id: PMID:16481626
  title: The antioxidant protein alkylhydroperoxide reductase of Helicobacter pylori switches from a peroxide
    reductase to a molecular chaperone function.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text read. HD30 and HC28 clinical-isolate proteins, not strain 26695, were assayed
      for insulin antiaggregation after prolonged oxidation. This supports a homologous stress-dependent
      holdase hypothesis, not a target-specific NEW folding annotation. The paper uses inconsistent disulfide
      language and speculates about human-gene recombination; neither is adopted.
  findings:
  - statement: Oxidized clinical-isolate AhpC complexes suppress aggregation in vitro.
    supporting_text: It is noteworthy that HMW complexes of AhpC can indeed protect insulin from DTT-induced
      protein aggregation.
core_functions:
- description: Reduction of hydrogen peroxide and diverse organic hydroperoxides through a typical two-cysteine
    peroxiredoxin cycle, regenerated by native Trx1. NADPH supplies electrons upstream through TrxB; AhpC
    itself is not an NADPH-binding flavoprotein. The native reconstruction is distinct from detailed substrate-kinetics
    assays that use E. coli TrxR.
