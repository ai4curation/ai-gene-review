      process.
    action: ACCEPT
    reason: The ferrithiocyanate endpoint assay in PMID:11222594 Figure 6 measured loss of hydrogen peroxide
      in the complete native system, with no loss when AhpC was omitted. Thus AhpC performs peroxide catabolism
      itself; the PTN000073874 assertion is supported independently of the annotation donor list.
    supported_by:
    - reference_id: url:https://scb.wfu.edu/Poole-files/Baker_Hpylori.pdf
