gene_symbol: ahpC
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:85962
  label: Helicobacter pylori 26695
description: AhpC (HP_1563) is a typical two-cysteine peroxiredoxin of Helicobacter pylori 26695. It reduces
  hydrogen peroxide and organic hydroperoxides through a cysteine-based catalytic cycle and is regenerated
  by thioredoxin Trx1 (HP_0824), with NADPH providing reducing equivalents through thioredoxin reductase
  TrxB (HP_0825). The soluble antioxidant protects cellular redox balance; its physiological reducing
  system differs from the dedicated NADH/AhpF system of Salmonella. Oxidized AhpC forms intersubunit disulfides,
  and its activity can be damaged by oxidation of methionine residues and restored by methionine sulfoxide
  reductase.
