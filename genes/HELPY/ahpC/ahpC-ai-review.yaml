  review:
    summary: AhpC couples peroxide removal to the thioredoxin redox cycle and contributes to cell redox
      homeostasis.
    action: ACCEPT
    reason: The inherited PTN000073874 process matches the measured electron-transfer cycle and detoxifying
      chemistry. This claim concerns maintenance of cellular redox balance; it does not turn AhpC into
      a transcriptional regulator or assign all thioredoxin-dependent repair reactions to it.
    supported_by:
    - reference_id: url:https://scb.wfu.edu/Poole-files/Baker_Hpylori.pdf
      supporting_text: On the basis of results reported here and mechanisms out- lined for other 2-Cys
        AhpC homologues (10, 51), electrons from NADPH proceed along the path outlined in Fig. 9 for the
        reduction of peroxides to alcohols. This scheme is highly anal- ogous to that for electron transfer
        through the S. typhimurium AhpC system, except that TrxR and Trxl replace AhpF in the H. pylori
        system. Nonetheless, one tightly bound ﬂavin and three disulﬁde redox centers mediate electron
        transfer from pyridine nucleotide to peroxide in both cases.
