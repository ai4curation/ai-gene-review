- term:
    id: GO:0102039
    label: NADH-dependent peroxiredoxin activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - RHEA:62628
  - EC:1.11.1.26
  review:
    summary: The transferred NADH-dependent reaction does not describe the experimentally characterized
      H. pylori AhpC reducing system.
    action: MODIFY
    reason: This is a lateral donor-system correction to GO:0140824, not a descendant refinement. The
      UniProt catalytic statement explicitly derives from Salmonella AhpC P0A251. In PMID:11222594, native
      TrxR uses NADPH, Trx1 recycles AhpC, and tested Salmonella AhpF cannot support H. pylori AhpC turnover.
      AhpC retains its peroxide-reducing function within the native Trx1-linked electron-donor architecture.
      These assays do not prove that every conceivable engineered NADH relay is impossible.
    supported_by:
    - reference_id: url:https://scb.wfu.edu/Poole-files/Baker_Hpylori.pdf
      supporting_text: The maximal sustained rate of NADPH oxidation was observed when all three pro-
        teins, TrxR, Trx1, and AhpC, were included in the assay mix- ture (Fig. 4).
    - reference_id: url:https://scb.wfu.edu/Poole-files/Baker_Hpylori.pdf
      supporting_text: In TrxR-Trx1-insulin experiments in which NADPH was replaced with NADH, no decrease
        in the NADH A 340 was observed upon addition of TrxR to the reaction mixture, demonstrating the
        high speciﬁcity of TrxR for NADPH.
    - reference_id: url:https://scb.wfu.edu/Poole-files/Baker_Hpylori.pdf
      supporting_text: No signiﬁcant rate of NADH oxidation was observed in an anaerobic S. typhimurium
        AhpF and H. pylori AhpC system (Fig. 5, medium dashes).
    proposed_replacement_terms:
    - *id002
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: RHEA:62628
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: The mapped Salmonella NADH/AhpF-linked reaction is not the demonstrated native H. pylori
          TrxR/Trx1 pathway.
