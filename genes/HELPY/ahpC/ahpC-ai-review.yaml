      supporting_text: Proof that AhpC reduces peroxides was obtained using an endpoint assay in which
        the peroxide concentration was mon- itored over the course of the incubation. In an assay mixture
        containing TrxR, Trx1, AhpC, NADPH, and H 2O2, ferrithio- cyanate complex formation with H 2O2
        decreased over time (5.0 s21 relative to TrxR), indicating that peroxide was contin - ually consumed
        in the presence of H. pylori AhpC (Fig. 6).
