- id: PMID:31465435
  title: Helicobacter pylori senses bleach (HOCl) as a chemoattractant using a cytosolic chemoreceptor.
  findings:
  - statement: HOCl oxidation of a CZB cysteine inhibits TlpD-dependent kinase activation; native
      cells respond by attraction.
    supporting_text: HOCl acts as a chemoattractant by reversibly oxidizing a conserved cysteine
      within a 3His/1Cys Zn-binding motif in TlpD that inactivates the chemotransduction signaling
      complex.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text inspected. Purified TlpD and CheW are SS1, CheA is G27, all produced
      with N-terminal tags in E. coli. Native HOCl chemotaxis uses G27 and PMSS1. Assays do not support
      direct zinc, pH, peroxide or superoxide sensing. The archived SS1 sequence is explicitly compared
      with O25321.
- id: PMID:18245281
  title: Functional characterization and mutagenesis of the proposed behavioral sensor TlpD of Helicobacter
    pylori.
  findings:
  - statement: TlpD supports energy-dependent behavior and occupies cytoplasmic and peripheral locations.
    supporting_text: TlpD, which apparently lacks transmembrane domains, was detected both in the
      bacterial cytoplasm and at the bacterial periphery.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cache is abstract-only; publisher full text was inspected separately and source
      attribution recorded in the source analysis. The KE26695-derived TlpD-V5 fusion complements
      an N6 tlpD mutant. This is target-derived construct evidence, not a native untagged 26695 ligand
      assay.
- id: PMID:21725005
  title: Identification of a chemoreceptor zinc-binding domain common to cytoplasmic bacterial chemoreceptors.
  findings:
  - statement: The CZB domain binds zinc; publisher methods identify 26695 HP0599/hylB as TlpD.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cache is abstract-only; publisher full text inspected. The 26695 sequence is used
      for sequence analysis, while recombinant SS1/J99 proteins are used for zinc-binding studies.
      Source analysis records the exact sections and URLs; do not conflate sequence-analysis target
      and assay strain.
- id: PMID:27002127
  title: The Helicobacter pylori CZB Cytoplasmic Chemoreceptor TlpD Forms an Autonomous Polar Chemotaxis
    Signaling Complex That Mediates a Tactic Response to Oxidative Stress.
  findings:
  - statement: TlpD assembles autonomous polar signaling complexes and has partner-dependent membrane
      association.
    supporting_text: It loses the normal membrane association that appears to be driven by interactions
      with other chemoreceptors and with CheW, CheV1, and CheA.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only after normal forced fetch. The quoted localization and membrane-association
      statements are explicit in the abstract; detailed mutant/strain assignments are not invented.
- id: PMID:41660828
  title: The Helicobacter pylori TlpD cytoplasmic chemoreceptor requires an intact C-terminus for
    polar localization and function.
  findings:
  - statement: G27 TlpD C-terminal truncation disrupts polar localization and chemotaxis.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text inspected; G27 and tagged ectopic constructs, not a native 26695 assay.
      The discussion assigns HP0599 to AcxC, an apparent locus typo; that sentence is excluded as
      interaction or identity evidence.
- id: PMID:41648481
  title: Structure and signaling mechanism of Helicobacter pylori transducer-like protein D.
  findings:
  - statement: A J99-derived TlpD structure supplies contextual information on receptor
      architecture.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: This is a 2026 bioRxiv preprint describing J99-derived TlpD structure and
      signaling. Relevance is MEDIUM because it provides comparative architectural context rather
      than decisive evidence for the reviewed 26695 protein. VERIFIED records that the stated
      provenance and contextual finding match the source; it does not imply peer review, validation
      of every result, or a 26695 structure. Preprint status alone is not a scientific-quality
      defect, so LOW_QUALITY is not asserted. No new annotation rests on this source alone.
