  review:
    summary: TlpD is peripherally associated with the cytoplasmic face of the inner membrane.
    action: MODIFY
    reason: The generic MCP-domain mapping must not be interpreted as transmembrane topology. TlpD
      lacks transmembrane segments but occurs in cytoplasmic and peripheral pools; PMID:27002127
      explicitly reports membrane association dependent on other chemoreceptors and Che proteins.
      Thus membrane association is supported and can be refined to the cytoplasmic side of the plasma
      membrane. This is compatible with autonomous cytoplasmic polar complexes when other receptors
      are absent.
    supported_by:
