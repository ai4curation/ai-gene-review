gene_symbol: tlpD
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:85962
  label: Helicobacter pylori 26695
description: TlpD (HP_0599) is a cytoplasmic chemoreceptor with an MCP signaling region and a C-terminal
  chemoreceptor zinc-binding (CZB) domain. It forms polar signaling assemblies with CheW and CheA
  and can associate peripherally with the inner membrane without a transmembrane segment. H. pylori
  TlpD senses hypochlorous acid through reversible oxidation of a conserved zinc-coordinating cysteine,
  decreasing CheA stimulation and promoting attraction. This biochemical mechanism was established
  with SS1 TlpD and is inferred for the closely related 26695 protein; responses to other oxidative
  or metabolic conditions need not reflect direct sensing of those chemicals.
