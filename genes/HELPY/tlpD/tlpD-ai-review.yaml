  review:
    summary: TlpD organizes polar chemoreceptor signaling complexes.
    action: NEW
    reason: The abstract of PMID:27002127 explicitly reports autonomous polar localization and recruitment
      of CheW/CheA/CheV by TlpD. Full-text G27 experiments in PMID:41660828 independently show that
