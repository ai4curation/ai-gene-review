suggested_questions:
- question: Do native strain 26695 TlpD and signaling partners reproduce the SS1/G27 reconstructed
    HOCl response quantitatively, and which oxidative-stress phenotypes arise indirectly rather than
    through direct ligand sensing?
- question: How are TlpD sensitivity and adaptation controlled in H. pylori without the canonical
    CheR/CheB methylation system?
