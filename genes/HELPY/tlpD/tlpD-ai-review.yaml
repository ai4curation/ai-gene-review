- id: PMID:38048436
  title: Reassessing the Standard Chemotaxis Framework for Understanding Biased Migration in Helicobacter
    pylori.
  findings:
  - statement: H. pylori lacks CheR/CheB homologs; canonical receptor methylation cannot be presumed
      from an MCP domain label.
    supporting_text: The notable difference between these two systems is the absence of CheR and
      CheB homologs in H. pylori.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full-text comparative review; supports taxonomic adaptation context, not a new
      TlpD assay.
core_functions:
- description: Cytoplasmic chemoreception through a zinc-containing redox-sensitive CZB domain, coupled
    through CheW to modulation of CheA autophosphorylation. HOCl-dependent inhibition and attraction
    are established for SS1-derived protein and G27/PMSS1 cells and inferred for 26695 through near-identical
    sequence and conserved zinc ligands. TlpD can act in polar cytoplasmic and peripheral membrane-associated
    assemblies.
