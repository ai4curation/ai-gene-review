id: Q09067
gene_symbol: ureH
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:85962
  label: Helicobacter pylori 26695
description: >-
  UreH is the Helicobacter pylori ortholog of UreD, the urease maturation protein
  that binds the urease apoprotein. It forms a tight cytoplasmic heterodimer with
  UreF; two such heterodimers associate into a (UreF-UreH)2 platform that recruits
  two copies of the GTPase UreG, producing the (UreG-UreF-UreH)2 preactivation
  complex whose crystal structure has been solved. Within that complex, UreH and
  UreF together position the two UreG protomers so that their invariant
  Cys66-Pro67-His68 motifs form a single nickel site at the dimer interface, and
  the same UreF-UreH platform is required for nickel-charged UreG to hand its
  metal to apo-urease: UreG alone cannot activate the enzyme. A buried channel
  running from the UreG metal site through UreF and out of UreH has been proposed
  as the nickel conduit into the nascent active site, and the equivalent tunnel in
  Klebsiella UreD is experimentally required for activation. Mutation of ureH
  abolishes urease activity without preventing assembly of the urease subunits,
  consistent with a role in metallocenter maturation rather than in oligomer
  assembly. UreH is not a subunit of the mature enzyme and has no catalytic
  activity.
