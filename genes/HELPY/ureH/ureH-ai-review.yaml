- term:
    id: GO:0150006
    label: urease activator complex
  evidence_type: IDA
  original_reference_id: PMID:24115911
  qualifier: part_of
  review:
    summary: >-
      UreH is a subunit of the (UreG-UreF-UreH)2 urease activation complex resolved
      by X-ray crystallography.
    action: NEW
    reason: >-
      The term describes exactly this entity - a complex required for urease
      activation whose subunits dissociate before urease becomes catalytic - and the
      H. pylori UreG/UreF/UreH complex is its structural prototype, with UreG
      released upon nickel and GTP binding. No H. pylori subunit currently carries
      the term.
    supported_by:
    - reference_id: PMID:24115911
      supporting_text: >-
        We report here the crystal structure of the UreG/UreF/UreH complex, which
        illustrates how UreF and UreH facilitate dimerization of UreG
    - reference_id: PMID:24115911
      supporting_text: >-
        Interaction studies revealed that addition of nickel and GTP to the
        UreG/UreF/UreH complex releases a UreG dimer that binds a nickel ion at the
        dimeric interface.
