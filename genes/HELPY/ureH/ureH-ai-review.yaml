proposed_new_terms: []
suggested_questions:
- question: >-
    Does H. pylori UreH bind nickel itself, and is the tunnel identified in silico
    through UreF and UreH actually used for nickel delivery in this organism, as it
    is in Klebsiella UreD?
- question: >-
    How does UreH engage apo-urease, and is that contact what licenses nickel
    transfer from the UreG dimer?
suggested_experiments:
- hypothesis: >-
    UreH contacts apo-urease directly and conducts nickel through its internal
    channel, so channel-blocking substitutions should uncouple complex formation from
    activation.
  description: >-
    Map the UreH-apo-urease interface by crosslinking mass spectrometry or cryo-EM of
    the full preactivation complex, then test interface and channel-narrowing
    substitutions for in vitro activation, urease nickel content, and retention of
    UreF/UreG binding.
  experiment_type: Structural mapping with targeted mutagenesis, metal analysis and activation assays
