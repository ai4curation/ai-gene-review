  review:
    summary: >-
      UreH increases urease activity by promoting nickel incorporation into the
      active site, which is the definition of this term.
    action: ACCEPT
    reason: >-
      The PAINT node covers the UreD/UreH family, whose ancestral and conserved role
      is urease activation (the Arabidopsis donor is the plant UreD). H.
      pylori-specific evidence is direct: UreH is one of the two proteins forming the
      platform without which nickel-charged UreG cannot activate apo-urease, and
      ureH mutants have no urease activity (PMID:24115911, PMID:1313413).
    supported_by:
    - reference_id: PMID:24115911
      supporting_text: >-
        We found that the nickel-charged UreG dimer can activate urease only in the
        presence of the UreF/UreH complex (Figure 7A).
    - reference_id: PMID:1313413
      supporting_text: >-
        Of the nine urease genes identified, ureA, ureB, ureF, ureG, and ureH were
        shown to be required for urease expression in E. coli, as mutations in each
        of these genes led to negative phenotypes.
