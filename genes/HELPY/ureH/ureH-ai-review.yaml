- term:
    id: GO:0016151
    label: nickel cation binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR002669
  review:
    summary: >-
      UreD/UreH-family proteins can bind divalent metals and a nickel-transfer
      tunnel exits through UreD/UreH, but nickel binding is not the activity through
      which UreH matures urease.
    action: KEEP_AS_NON_CORE
    reason: >-
      The family property is real: a soluble MBP fusion of Klebsiella aerogenes UreD
      binds nickel (and zinc more tightly) in vitro (PMID:22369361), and the channel
      that runs from the UreG metal site through UreF and out of UreH is
      experimentally required for nickel delivery in the Klebsiella ortholog
      (PMID:26401965). No nickel site or metal stoichiometry has been measured for
      H. pylori UreH itself, and in the H. pylori complex the measured nickel load
      sits on the UreG dimer interface (PMID:24115911). The term is therefore kept as
      a plausible accessory property rather than as a core function.
    supported_by:
    - reference_id: PMID:22369361
      supporting_text: >-
        MBP-UreD binds divalent metal ions (~2.5 Ni per protomer, Kd ~50 μM; ~4 Zn
        per protomer, Kd ~5 μM)
    - reference_id: PMID:26401965
      supporting_text: >-
        These findings support the role of a molecular tunnel in UreD as a direct
        facilitator of nickel transfer into urease, illustrating a new paradigm in
        active site metallocenter assembly.
    - reference_id: PMID:24115911
      supporting_text: >-
        In the presence of nickel and GTP, wild-type UreG binds 1.2±0.1 nickel ions
        per UreG dimer, whereas significantly less nickel is bound to UreG(C66A) or
        UreG(H68A) variants.
