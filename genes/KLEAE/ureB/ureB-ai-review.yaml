  review:
    summary: >-
      UreB contributes to urease activity as a subunit of the holoenzyme but
      does not carry the catalytic site.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The binickel catalytic center is in the alpha subunit (UreC). UreB
      contributes to, rather than independently enables, urease activity; its
      His39 and His41 substitutions reduce activity only by 20-30%, consistent
      with a peripheral structural role. The contributes-to relationship is
      recorded in core_functions.
    supported_by:
    - reference_id: PMID:8718850
      supporting_text: Urease from Klebsiella aerogenes [Jabri et al. (1995) Science
        268, 998-1004] is an (alpha beta gamma)3 trimer with each alpha-subunit
        having an (alpha beta)8-barrel domain containing a binickel active center.
