status: COMPLETE
taxon:
  id: NCBITaxon:548
  label: Klebsiella aerogenes
description: >-
  UreB is the beta subunit of the cytoplasmic nickel-dependent urease of
  Klebsiella aerogenes. Together with UreA (gamma) and the catalytic UreC
  (alpha) it forms the (UreABC)3 enzyme that hydrolyzes urea to ammonia and
  carbon dioxide. UreB contains no nickel ligands or catalytic residues; it is a
  structural subunit of the trimer-of-trimers whose surface histidines
  contribute modestly to activity and thermal stability. The UreABC apoprotein
  is matured by the UreD, UreF and UreG accessory proteins and the UreE nickel
  metallochaperone, which install the carbamylated dinickel center in UreC.
