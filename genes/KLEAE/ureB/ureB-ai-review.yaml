- term:
    id: GO:0005198
    label: structural molecule activity
  evidence_type: IDA
  original_reference_id: PMID:8718850
  qualifier: enables
  review:
    summary: >-
      UreB is a non-catalytic structural chain of the urease assembly.
    action: NEW
    reason: >-
      The beta subunit carries no active-site residues and buries a large
      fraction of its residues in the assembly, which the structural analysis
      links to enzyme stability. Mirrors the structural-subunit modelling used
      for the orthologous P. putida UreB review.
    supported_by:
    - reference_id: PMID:8718850
      supporting_text: >-
        Analysis of the urease tertiary/quaternary structure suggests that the
        stability of this enzyme may be largely due to its burial of an
        unusually large fraction of its residues: 50% in the gamma-subunit, 30%
        in the beta-subunit
