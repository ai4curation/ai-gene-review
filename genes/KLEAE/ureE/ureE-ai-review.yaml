- term:
    id: GO:0170061
    label: nickel chaperone activity
  evidence_type: TAS
  original_reference_id: PMID:22369361
  qualifier: enables
  review:
    summary: >-
      UreE acts as the nickel metallochaperone of the urease activation
      pathway, delivering nickel to the UreD-UreF-UreG-apoprotein complex.
    action: NEW
    reason: >-
      GO:0170061 (directly binding to and delivering nickel ions to a target
      protein) is more informative than nickel cation binding alone. K.
      aerogenes UreE binds nickel specifically and facilitates metallocenter
      assembly; the field (including later work from the same laboratory)
      describes it as delivering nickel to the UreDFG-apoprotein complex.
      Direct transfer has not been quantified in the cached K. aerogenes
      papers, so this is recorded as TAS and kept alongside nickel cation
      binding as the primary core function.
    supported_by:
    - reference_id: PMID:22369361
      supporting_text: UreE functions as a metallochaperone that delivers Ni to a
        UreD-UreF-UreG complex bound to urease apoprotein, with UreG serving as a
        GTPase during enzyme activation.
    - reference_id: file:KLEAE/ureE/ureE-uniprot.txt
      supporting_text: Probably functions as a nickel donor during metallocenter
        assembly.
