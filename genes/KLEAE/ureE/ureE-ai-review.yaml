taxon:
  id: NCBITaxon:548
  label: Klebsiella aerogenes
description: >-
  UreE is a cytoplasmic, histidine-rich nickel-binding metallochaperone that
  facilitates assembly of the dinickel active site of Klebsiella aerogenes
  urease. The UreE homodimer binds about six Ni(II) ions with micromolar
  affinity through histidyl-rich sites, and UreE is thought to deliver nickel to
  the UreD-UreF-UreG complex bound to the UreABC apoprotein, where UreG couples
  GTP hydrolysis to metal installation in UreC. Deletion of ureE lowers but does
  not abolish urease activation, and its requirement can be bypassed in vitro
  by high nickel concentrations, consistent with a role in efficient nickel
  supply rather than in protein folding or complex assembly.
