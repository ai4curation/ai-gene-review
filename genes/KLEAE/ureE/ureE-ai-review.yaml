  review:
    summary: >-
      InterPro mapping that extends the "chaperone" label of UreE to general
      protein folding.
    action: REMOVE
    reason: >-
      UreE is a metallochaperone: it binds nickel and is proposed to donate it
      during metallocenter assembly into a preformed, already folded urease
      apoprotein (whose structure is nearly identical to the holoenzyme). There
      is no evidence that UreE assists folding of any polypeptide; the
      InterPro2GO mapping conflates metal delivery with protein folding.
    supported_by:
    - reference_id: PMID:8318889
      supporting_text: We hypothesize that UreE binds intracellular nickel ion and
        functions as a nickel donor during metallocenter assembly into the urease
        apoprotein.
    - reference_id: PMID:8718850
      supporting_text: the structure of the apoenzyme is nearly identical to that
        of the holoenzyme
