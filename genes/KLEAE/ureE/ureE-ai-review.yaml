suggested_questions:
- question: >-
    Does K. aerogenes UreE transfer nickel directly to UreG (as shown for H.
    pylori UreE-UreG), and is transfer gated by the UreG nucleotide state?
suggested_experiments:
- hypothesis: >-
    UreE transfers Ni(II) to GTP-bound UreG within the UreDFG-apoprotein
    complex.
  description: >-
    Measure nickel transfer from Ni-loaded UreE to apo-UreG and to the
    UreABC-UreD-UreF-UreG complex by metal-occupancy assays and activation
    kinetics, with GTP, GDP and non-hydrolysable analogues.
  experiment_type: Metal transfer and in vitro urease activation assay
