suggested_questions:
- question: >-
    Does UreA participate in docking of the UreD-UreF-UreG activation complex
    onto the apoprotein, or is it purely a structural core subunit?
suggested_experiments:
- hypothesis: >-
    Surface residues of UreA contribute to binding of UreD-UreF-UreG to the
    UreABC apoprotein.
  description: >-
    Mutagenize solvent-exposed UreA residues near the predicted UreD contact
    surface and measure UreD-UreF-UreG-apoprotein complex formation and
    GTP-dependent activation.
  experiment_type: Site-directed mutagenesis, pull-down and in vitro activation assay
