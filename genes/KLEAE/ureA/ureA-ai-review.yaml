id: P18316
gene_symbol: ureA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:548
  label: Klebsiella aerogenes
description: >-
  UreA is the gamma subunit of the cytoplasmic nickel-dependent urease of
  Klebsiella aerogenes. Three UreA-UreB-UreC heterotrimers assemble into the
  (UreABC)3 enzyme, which hydrolyzes urea to ammonia and carbon dioxide and so
  supplies nitrogen from urea. UreA carries no catalytic or nickel-binding
  residues; the dinickel active site with its carbamylated lysine lies in the
  UreC alpha subunit. UreA is a largely buried structural component of the
  trimer-of-trimers assembly, and the UreABC apoprotein is the platform on which
  the UreD, UreF and UreG accessory proteins, together with the UreE nickel
  metallochaperone, install the active-site nickel ions.
