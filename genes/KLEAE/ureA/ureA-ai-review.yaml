  review:
    summary: UreA is the gamma subunit of the (alpha beta gamma)3 urease complex.
    action: NEW
    reason: >-
      Crystal structures of K. aerogenes urease define the enzyme as an
      (alpha beta gamma)3 assembly, and the curated UniProt subunit statement
      (experimental evidence) names UreA as the gamma chain. GOA carries this
      complex term for UreB but not for UreA; membership is directly
      established for this protein.
    supported_by:
    - reference_id: PMID:8718850
      supporting_text: Urease from Klebsiella aerogenes [Jabri et al. (1995) Science
        268, 998-1004] is an (alpha beta gamma)3 trimer
    - reference_id: file:KLEAE/ureA/ureA-uniprot.txt
      supporting_text: Heterotrimer of UreA (gamma), UreB (beta) and UreC (alpha)
        subunits.
- term:
    id: GO:0005198
    label: structural molecule activity
  evidence_type: IDA
  original_reference_id: PMID:8718850
  qualifier: enables
  review:
    summary: >-
      UreA is a non-catalytic, largely buried structural chain that contributes
      to the stability of the urease assembly.
    action: NEW
    reason: >-
      The structure shows that the gamma subunit has no active-site residues
      but buries half of its residues in the assembly, which the authors relate
      to the stability of the enzyme. Mirrors the structural-subunit modelling
      used for the orthologous P. putida UreA review.
    supported_by:
    - reference_id: PMID:8718850
      supporting_text: >-
        Analysis of the urease tertiary/quaternary structure suggests that the
        stability of this enzyme may be largely due to its burial of an
        unusually large fraction of its residues: 50% in the gamma-subunit
