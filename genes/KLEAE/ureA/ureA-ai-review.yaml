- term:
    id: GO:0009039
    label: urease activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - InterPro:IPR012010
  - RHEA:20557
  - EC:3.5.1.5
  - UniRule:UR000001329
  review:
    summary: >-
      UreA is an essential subunit of the urease holoenzyme but does not itself
      carry the catalytic site.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Urease activity is a property of the (UreABC)3 complex whose dinickel
      catalytic center lies entirely in the alpha subunit (UreC). The term is
      biologically relevant, but "enables" overstates the role of the gamma
      structural subunit, which contributes to (rather than independently
      enables) urease activity. The contributes-to relationship is recorded in
      core_functions.
    supported_by:
    - reference_id: PMID:8718850
      supporting_text: Urease from Klebsiella aerogenes [Jabri et al. (1995) Science
        268, 998-1004] is an (alpha beta gamma)3 trimer with each alpha-subunit
        having an (alpha beta)8-barrel domain containing a binickel active center.
- term:
    id: GO:0016151
    label: nickel cation binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR002026
  - InterPro:IPR036463
  review:
    summary: >-
      InterPro-to-GO transfer of nickel binding to the urease gamma subunit.
    action: REMOVE
    reason: >-
      All nickel ligands of K. aerogenes urease (His134, His136, carbamylated
      Lys217, His246, His272, Asp360) are in UreC (alpha); the binickel center
      is in the alpha-subunit barrel domain. There is no evidence that the
      gamma subunit binds nickel, so this domain-level mapping is an
      over-propagation for UreA.
    supported_by:
    - reference_id: PMID:8718850
      supporting_text: Urease from Klebsiella aerogenes [Jabri et al. (1995) Science
        268, 998-1004] is an (alpha beta gamma)3 trimer with each alpha-subunit
        having an (alpha beta)8-barrel domain containing a binickel active center.
