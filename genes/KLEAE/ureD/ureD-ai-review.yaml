suggested_questions:
- question: >-
    Is the metal-binding capacity of UreD (Ni and Zn) physiologically relevant
    to urease activation, for example as a transient nickel relay or a zinc
    sink that protects activation fidelity?
- question: >-
    Why does purified MBP-UreD fail to bind UreABC in vitro although UreD forms
    complexes with the apoprotein in vivo?
suggested_experiments:
- hypothesis: >-
    UreD metal-binding residues are dispensable for scaffolding but contribute
    to activation efficiency.
  description: >-
    Identify UreD metal ligands by structural modelling on the H. pylori UreH
    structure, mutate them, and test complex formation and in vivo urease
    activity under nickel-limiting and zinc-excess conditions.
  experiment_type: Mutagenesis, metal binding and in vivo activation assay
