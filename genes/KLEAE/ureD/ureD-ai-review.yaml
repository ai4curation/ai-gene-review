  - InterPro:IPR002669
  - UniRule:UR000076261
  review:
    summary: >-
      Purified K. aerogenes MBP-UreD binds about 2.5 Ni(II) per protomer, but
      binds Zn(II) with ten-fold higher affinity.
    action: KEEP_AS_NON_CORE
    reason: >-
      Nickel binding is experimentally demonstrated for this protein (as an MBP
      fusion), so the annotation is true. However, the binding is weak
      (Kd about 50 uM) and not selective over zinc, and UreD's defining role is
      scaffolding the activation complex rather than nickel delivery, which is
      performed by UreE and UreG. Kept as a real but non-core property.
    supported_by:
    - reference_id: PMID:20207756
      supporting_text: MBP-UreD was purified as a large multimer (> 670 kDa) that
        bound approximately 2.5 Ni2+ ions (K(d) of approximately 50 microM, where
        K(d) is the dissociation constant) per UreD protomer according to equilibrium
        dialysis measurements.
    - reference_id: PMID:20207756
      supporting_text: Zn2+ directly competes with 10-fold higher affinity
- term:
    id: GO:0018237
    label: urease activator activity
  evidence_type: IMP
  original_reference_id: PMID:7909161
  qualifier: enables
  review:
    summary: >-
      UreD binds the urease apoprotein and is required for incorporation of
      nickel into the active site; UreD-apoprotein complexes are activated in
      proportion to bound UreD.
    action: NEW
    reason: >-
      GO:0018237 is defined as increasing urease activity by promoting
      incorporation of nickel into the active site. Extracts lacking UreD fail
      to generate active urease, UreD-bound apoprotein is activated in
      proportion to the number of UreD bound, and UreD dissociates on
      activation. This is the term placed by PAINT on the UreD family node and
      it directly describes the activity, unlike the generic protein-binding
      rows.
    supported_by:
    - reference_id: PMID:7909161
      supporting_text: extracts of cells containing a ureD deletion derivative failed
        to generate active urease, thus highlighting a key role for UreD in the
        metallocenter assembly process.
    - reference_id: PMID:7909161
      supporting_text: The UreD-urease apoprotein complexes are competent for activation
        by nickel, with the level of activity obtained being directly related to
        the number of UreD molecules bound per urease molecule.
