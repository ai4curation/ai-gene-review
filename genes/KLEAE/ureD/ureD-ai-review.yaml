id: Q09063
gene_symbol: ureD
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:548
  label: Klebsiella aerogenes
description: >-
  UreD is a cytoplasmic urease accessory protein required to activate the
  nickel-dependent urease of Klebsiella aerogenes. It binds the UreABC
  apoprotein (up to three UreD per (UreABC)3), stabilizing an apoprotein
  conformation competent for lysine carbamylation and nickel incorporation,
  and serves as the docking scaffold for UreF and UreG to form the
  UreABC-UreD-UreF-UreG activation complex. In that complex, nickel delivered
  by the UreE metallochaperone is installed into the UreC active site in a
  GTP-hydrolysis-dependent manner, after which the accessory proteins
  dissociate. Deletion of ureD abolishes production of active urease. Purified
  MBP-UreD binds Ni(II) and, more tightly, Zn(II), but its defining activity is
  scaffolding the activation machinery.
