        represent the activation-competent form of urease apoprotein in the cell.
    - reference_id: PMID:9209019
      supporting_text: An insoluble protein species containing UreD, UreF, and UreG
        (termed the DFG complex) was detected in cells carrying deletions in ureE
        and the urease structural genes.
- term:
    id: GO:0043419
    label: urea catabolic process
  evidence_type: IMP
  original_reference_id: PMID:1624427
  qualifier: involved_in
  review:
    summary: >-
      UreD is required for production of active urease, the sole enzyme of the
      urea catabolic process.
    action: NEW
    reason: >-
      Participation, not mere necessity: UreD is a subunit of the urease
      activator complex, and GO itself defines GO:0150006 urease activator
      complex as capable of part of GO:0043419 urea catabolic process.
      UreD performs the activation step (nickel incorporation) that the
      process depends on; ureD deletion yields inactive, nickel-free urease.
      UreG already carries this term in GOA; this mirrors the P. putida UreD
      review.
    supported_by:
    - reference_id: PMID:1624427
      supporting_text: the enzyme was inactive (deletions in ureD, ureF, or ureG)
    - reference_id: PMID:1624427
      supporting_text: These results demonstrate that all four accessory genes are
        necessary for the functional incorporation of the urease metallocenter.
