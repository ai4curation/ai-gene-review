suggested_questions:
- question: >-
    Which UreC conformational states (e.g., active-site flap or domain
    movements) are induced by UreD-UreF-UreG binding to open a nickel access
    channel to the buried active site?
suggested_experiments:
- hypothesis: >-
    Accessory-protein binding opens a channel in UreC that allows nickel and
    CO2 to reach the buried Lys217 site.
  description: >-
    Determine cryo-EM structures of UreABC-UreD-UreF-UreG in GDP and GTP states
    and test channel-lining UreC residues by mutagenesis and in vitro
    activation.
  experiment_type: Cryo-EM, mutagenesis and activation assay
