  review:
    summary: >-
      UreC carries the complete dinickel catalytic site that hydrolyzes urea.
    action: ACCEPT
    reason: >-
      Structures and kinetics of K. aerogenes urease place the binickel active
      center and the catalytic residues (His219, His320, Asp221, Arg336) in the
      alpha subunit. Requiring UreA and UreB for assembly does not make UreC
      non-catalytic.
    supported_by:
    - reference_id: PMID:10913264
