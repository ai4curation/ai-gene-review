  label: Klebsiella aerogenes
description: >-
  UreC is the alpha and catalytic subunit of the cytoplasmic nickel-dependent
  urease of Klebsiella aerogenes, which hydrolyzes urea to ammonia and carbon
  dioxide (EC 3.5.1.5). Within the (UreABC)3 enzyme each UreC chain contains an
  (alpha beta)8-barrel domain that holds a dinickel active center: two Ni(II)
  ions about 3.5 A apart, bridged by a carbamylated lysine (Lys217) and
  coordinated by histidine and aspartate ligands, with His219 and His320
  contributing to substrate binding and general acid catalysis. The apoprotein
  is structurally preorganized but inactive; nickel and carbon dioxide are
  installed in vivo by the UreD-UreF-UreG accessory complex in a
  GTP-hydrolysis-dependent process, with UreE acting as a nickel
  metallochaperone.
