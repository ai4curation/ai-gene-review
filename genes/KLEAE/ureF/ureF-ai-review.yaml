  review:
    summary: >-
      UreF interacts with UreD (MBP-UreD pull-downs and an approximately 1:1
      in vitro complex between MBP-UreD and the UreF domain of UreEF).
    action: REMOVE
    reason: >-
      The UreD-UreF interaction is well supported, but bare protein binding is
      uninformative and is removed under the protein-binding policy. Its
      functional content is captured by the NEW GO:0018237 urease activator
      activity, GO:0030695 GTPase regulator activity and GO:0150006 urease
      activator complex rows. Removal does not mean the interaction is false.
    supported_by:
