id: P18318
gene_symbol: ureF
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:548
  label: Klebsiella aerogenes
description: >-
  UreF is a cytoplasmic urease accessory protein required for activation of
  Klebsiella aerogenes urease. It binds the UreD-UreABC apoprotein complex,
  altering its conformation, and provides the docking surface for UreG to form
  the UreABC-UreD-UreF-UreG activation complex. Within this complex UreF gates
  the GTPase activity of UreG, coupling GTP hydrolysis to productive nickel
  incorporation and increasing the fidelity of metallocenter assembly,
  especially against the noncognate metal zinc. Deletion of ureF yields
  inactive, nickel-deficient urease. The C-terminus of UreF is required for
  formation of the activation complex and its N-terminus for activation.
