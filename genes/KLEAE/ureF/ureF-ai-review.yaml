suggested_questions:
- question: >-
    Does K. aerogenes UreF bind nickel at all, or is the UniRule nickel-binding
    assignment purely a family-level transfer?
- question: >-
    How does UreF gate UreG nucleotide hydrolysis mechanistically (e.g., by
    controlling UreG dimerization or nickel release)?
suggested_experiments:
- hypothesis: >-
    UreF does not itself bind nickel but controls nickel release from UreG.
  description: >-
    Measure metal binding by purified UreF (from a UreDF or UreEF construct
    with the UreE His-rich region removed) and nickel release from UreG in
    the presence of wild-type and K165A UreF.
  experiment_type: Equilibrium dialysis, metal transfer and GTPase assays
