    supported_by:
    - reference_id: PMID:7721685
      supporting_text: We propose that the UreD-UreF-UreG-urease apoprotein complexes
        represent the activation-competent form of urease apoprotein in the cell.
    - reference_id: PMID:9209019
      supporting_text: An insoluble protein species containing UreD, UreF, and UreG
        (termed the DFG complex) was detected
- term:
    id: GO:0043419
    label: urea catabolic process
  evidence_type: IMP
  original_reference_id: PMID:1624427
  qualifier: involved_in
  review:
    summary: UreF is required to produce active urease, the enzyme of urea catabolism.
    action: NEW
    reason: >-
      Participation rather than mere necessity: UreF is a subunit of the urease
      activator complex, which GO itself defines as capable of part of
      GO:0043419, and it performs the GTPase-gating step of activation. UreG
      already carries this term in GOA; this mirrors the P. putida UreF review.
    supported_by:
    - reference_id: PMID:1624427
      supporting_text: These results demonstrate that all four accessory genes are
        necessary for the functional incorporation of the urease metallocenter.
