- term:
    id: GO:0016151
    label: nickel cation binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - InterPro:IPR002639
  - UniRule:UR000002805
  review:
    summary: >-
      UniRule/InterPro transfer of nickel binding to UreF; no direct nickel
      binding by UreF has been demonstrated.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      In the K. aerogenes system nickel binding is measured for UreE, UreG and
      (weakly) UreD, whereas UreF is characterized as the UreG-binding gate of
      the GTPase cycle. The UreEF fusion binds nickel through its UreE portion
      (His-rich tag region), and UreF was originally proposed as a GTPase
      activating protein, not a nickel carrier. The term overstates what is
      known for UreF; not removed outright because UreF participates in the
      nickel-transfer step of the activation complex.
    supported_by:
    - reference_id: PMID:22369361
      supporting_text: UreE functions as a metallochaperone that delivers Ni to a
        UreD-UreF-UreG complex bound to urease apoprotein, with UreG serving as a
        GTPase during enzyme activation.
    - reference_id: PMID:17041056
      supporting_text: The UreEF fusion protein was overproduced as a soluble protein
        with a convenient tag involving the His-rich region of UreE.
- term:
    id: GO:0018237
    label: urease activator activity
  evidence_type: IMP
  original_reference_id: PMID:22369361
  qualifier: enables
  review:
    summary: >-
      UreF is required for urease activation; UreF surface variants that weaken
      UreG binding give less than 10% of wild-type urease activity.
    action: NEW
    reason: >-
      GO:0018237 is defined as increasing urease activity by promoting nickel
      incorporation into the active site, and is the term PAINT places on the
      UreF family node. ureF deletion gives inactive urease with low nickel
      content, and site-directed UreF variants in the UreG-binding surface
      sharply reduce urease activation in vivo.
    supported_by:
    - reference_id: PMID:22369361
      supporting_text: When produced in the context of the entire urease gene cluster,
        cell-free extracts of nine site-directed mutants had less than 10% of the
        wild-type urease activity.
    - reference_id: PMID:1624427
      supporting_text: the enzyme was inactive (deletions in ureD, ureF, or ureG)
- term:
    id: GO:0030695
    label: GTPase regulator activity
  evidence_type: IDA
  original_reference_id: PMID:22369361
  qualifier: enables
  review:
    summary: >-
      UreF binds UreG and gates its GTPase activity within the activation
      complex.
    action: NEW
    reason: >-
      A UreF variant (K165A) increased the GTPase activity of the
      UreABC-UreD-UreF-UreG complex while uncoupling it from activation,
      showing that UreF regulates UreG GTP hydrolysis. The data argue against
      UreF being a GTPase-activating protein, so the general regulator term is
      used rather than GAP activity.
    supported_by:
    - reference_id: PMID:22369361
      supporting_text: Further experiments with these complexes provided evidence
        that UreF gates the GTPase activity of UreG to enhance the fidelity of urease
        metallocenter assembly, especially in the presence of the noncognate metal
        Zn.
- term:
    id: GO:0150006
    label: urease activator complex
  evidence_type: IDA
  original_reference_id: PMID:7721685
  qualifier: part_of
  review:
    summary: UreF is a component of the UreD-UreF-UreG urease activation complex.
    action: NEW
    reason: >-
      UreDFG-apoprotein complexes containing UreF were isolated from cells, and
