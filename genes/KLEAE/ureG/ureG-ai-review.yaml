suggested_questions:
- question: >-
    How does UreG nucleotide state control nickel binding and release, and
    why does isolated K. aerogenes UreG show no nucleotide binding?
suggested_experiments:
- hypothesis: >-
    GTP binding drives UreG dimerization and nickel capture, and hydrolysis
    triggers nickel release to the UreC site.
  description: >-
    Correlate UreG oligomeric state, nickel occupancy and nucleotide state in
    isolation and within the UreDFG-apoprotein complex using native MS and
    metal-transfer assays.
  experiment_type: Native mass spectrometry, metal binding and GTPase assays
