  review:
    summary: >-
      UreG promotes nickel incorporation into urease; P-loop mutants produce
      inactive urease and fail to form activation complexes.
    action: NEW
    reason: >-
      GO:0018237 (increasing urease activity by promoting incorporation of
      nickel into the active site) is the PAINT-placed term for the UreD/UreF/
      UreG nodes and is directly supported for K. aerogenes UreG by P-loop
      mutagenesis and GTP-dependent in vitro activation of the UreDFG-apoprotein
      complex. Recorded alongside GTPase activity, which describes the
      underlying catalytic activity.
    supported_by:
    - reference_id: PMID:9209019
      supporting_text: These mutant cells were unable to synthesize the UreD-UreF-UreG-urease
        apoprotein species that are thought to be the key urease activation complexes
        in the cell.
    - reference_id: PMID:10500143
      supporting_text: Significantly, we also observed nickel-dependent activation
        at physiologically relevant (approximately 100 microM) bicarbonate levels,
        but only in the presence of GTP.
