taxon:
  id: NCBITaxon:548
  label: Klebsiella aerogenes
description: >-
  UreG is a cytoplasmic SIMIBI-class G3E P-loop GTPase that acts as the energy
  transducer and nickel-handling component of the Klebsiella aerogenes urease
  activation machinery. Isolated UreG is a monomer that binds one Ni(II) or
  Zn(II) with micromolar affinity but shows no intrinsic nucleotide binding or
  hydrolysis; within the UreABC-UreD-UreF-UreG complex, GTP hydrolysis at the
  UreG nucleotide site is required for nickel- and bicarbonate-dependent
  activation of urease apoprotein at physiological bicarbonate levels. UreF
  gates UreG GTPase activity to couple hydrolysis to faithful nickel
  installation, and UreE is thought to supply nickel to the complex. P-loop
  substitutions (K20A, T21A) abolish formation of the activation complex and
  production of active urease.
