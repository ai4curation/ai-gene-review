    summary: K. aerogenes UreG binds one Ni(II) with a Kd of about 5 uM.
    action: ACCEPT
    reason: >-
      Direct metal-binding measurements on purified K. aerogenes UreG show
      stoichiometric nickel binding, consistent with its role in handling
      nickel during metallocenter assembly (zinc binds with similar
      affinity, a fidelity problem that UreF gating mitigates).
