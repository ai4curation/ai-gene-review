  review:
    summary: >-
      UreG is the GTPase of the urease activation complex; GTP hydrolysis at
      its nucleotide site is required for physiological urease activation.
    action: ACCEPT
    reason: >-
      Activation of the UreABC-UreD-UreF-UreG complex at physiological
      bicarbonate requires GTP hydrolysis (not just binding), and the critical
      nucleotide site was localized to UreG. GTPase activity of the complex is
      directly measured and is modulated by UreF. Isolated UreG does not bind
      or hydrolyze GTP, so the activity is expressed in the context of the
      activation complex; this does not change the molecular function.
    supported_by:
    - reference_id: PMID:10500143
      supporting_text: Based on studies involving a nonhydrolyzable analog of GTP,
        we conclude that nucleotide hydrolysis, not just binding, is required for
        this process. The critical nucleotide-binding site was localized to UreG
        on the basis of experiments using a variant complex.
    - reference_id: PMID:22369361
      supporting_text: a defective UreF enhances the GTPase activity of UreABC—UreD—UreF—UreGStr
