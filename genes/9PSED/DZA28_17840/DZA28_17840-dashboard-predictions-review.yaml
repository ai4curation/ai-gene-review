    label: plasma membrane
  predicted_term_type: GO_CC
  review:
    assessment: COR
    confidence_score: 2
    summary: >-
      Correct and novel. DeepTMHMM predicts 13 alpha-helical TM segments with no signal
      peptide on the query (dashboard_call.json), and UniProt Phobius predicts 7 on
      A0ABY3D9I3. The MgtC N-terminal and DUF4010 modules each span 5-6 predicted helices,
      so the protein is an integral cytoplasmic-membrane protein of a Gram-negative bacterium.
      GOA for A0ABY3D9I3 is empty, so the term is not already annotated; the companion review
      adds it as NEW (ISM). Confidence is 2 rather than 3 because the location rests on
      topology prediction and family analogy, with no experimental localization of any
      PTHR39084 member.
