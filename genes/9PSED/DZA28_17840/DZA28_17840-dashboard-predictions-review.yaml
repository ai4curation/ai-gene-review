description: >-
  The KBase gene-annotate dashboard (Dark Protein Atlas) LLM call for P. putida
  NZ_CP015876.1_2730 (SJTE-1 A210_RS13675) is "MgtC/SapB/SrpB/YhiD-family integral inner
  membrane protein containing DUF4010, substrate undetermined" (tier B). It has one GO term,
  GO:0005886 plasma membrane. The query is 98.8% identical over all 412 residues to
  A0ABY3D9I3 (P. alloputida B2017 DZA28_17840), so it is scored on that accession. No
  homolog exists in the KT2440 or other P. putida reference proteomes, so there is no
  KT2440 fitness data, and the dashboard evidence holds no fitness phenotype for any
  homolog. The call is accurate and appropriately hedged. The domain architecture
  (divergent PF02308 MgtC N-terminal domain plus PF13194 DUF4010) and the 13-helix topology
  are confirmed. The annotator rightly declined to transfer Mg2+ transport, Sap peptide
  uptake or colistin resistance. Two weaknesses: the word "substrate" presupposes a
  transporter, which nothing supports (canonical Salmonella MgtC is an F1Fo ATP synthase
  inhibitor, not a transporter; PMID:23827679); and the call does not say that the protein
  lacks the canonical MgtC C-terminal domain. GOA for A0ABY3D9I3 is empty, so the plasma
  membrane term is a correct novel prediction.
