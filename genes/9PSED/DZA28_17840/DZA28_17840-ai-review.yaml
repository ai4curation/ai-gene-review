core_functions: []
suggested_questions:
- question: >-
    Does the fused MgtC-N/DUF4010 protein interact with F1Fo ATP synthase subunits or other
    membrane proteins, as Salmonella MgtC does, or does DUF4010 confer a distinct activity?
- question: >-
    Is the gene co-regulated with the adjacent Crp/Fnr-family regulator FnrC, for example
    under low oxygen, and what is its knockout phenotype?
suggested_experiments:
- description: >-
    Delete A210_RS13675 in P. putida SJTE-1 (or the strain B2017 ortholog) and profile growth
    under low Mg2+, acid pH, anoxia and polymyxins, measuring ATP levels and membrane potential.
  hypothesis: >-
    Like other MgtC-family proteins, it modulates membrane energetics under stress, with
    FnrC-dependent expression.
