references:
- id: PMID:23827679
  title: A bacterial virulence protein promotes pathogenicity by inhibiting the bacterium's own F1Fo ATP synthase.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Defines the mechanism of canonical Salmonella MgtC, which binds and inhibits the F1Fo ATP
      synthase a subunit and is not a transporter. It shares only a divergent N-terminal
      membrane domain with DZA28_17840 (about 31% identity), so it is family context, not
      transferable evidence.
  findings:
  - statement: Salmonella MgtC binds the a subunit of the F1Fo ATP synthase and inhibits ATP-driven proton translocation.
    supporting_text: We establish that MgtC interacts with the a subunit of the F1Fo ATP synthase, hindering ATP-driven proton translocation and NADH-driven ATP synthesis in inverted vesicles.
- id: PMID:27150578
  title: Evolved resistance to colistin and its loss due to genetic reversion in Pseudomonas aeruginosa.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Lists PA0043, the closest studied homolog (42% identity over 362 residues), among
      mutations in an in vitro-evolved colistin-resistant lineage, with knock-out and
      complementation. The authors note PA0043 encodes a hypothetical protein of unknown
      function, and the MIC changes in deletion mutants were small. No molecular function
      can be derived from it.
  findings:
  - statement: PA0043 is a hypothetical protein of unknown function.
    supporting_text: The remaining two genes (PA0043 and PA0260) appeared to encode hypothetical proteins of unknown function.
  - statement: PA0043 was associated with colistin resistance for the first time in this study.
    supporting_text: we associated PA0043, PA2157, and PA4089 with colistin resistance for the first time.
