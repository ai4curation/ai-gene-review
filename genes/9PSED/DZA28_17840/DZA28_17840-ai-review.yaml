description: >-
  DZA28_17840 (A0ABY3D9I3) is an uncharacterized polytopic inner-membrane protein of 412
  residues. It is reviewed here in place of the KBase gene-annotate dashboard sequence
  NZ_CP015876.1_2730 from P. putida SJTE-1 (locus A210_RS13675, WP_014756724.1), which is
  98.8% identical over all 412 residues; the exact UniProt entries for that sequence were
  deleted. The protein fuses a divergent MgtC/SapB/SrpB/YhiD N-terminal membrane domain
  (Pfam PF02308, residues 11-129, score 58 versus about 130 for canonical MgtC/YhiD) to a
  membrane-embedded DUF4010 domain (PF13194, residues 177-387). DeepTMHMM predicts 13 TM
  helices and Phobius predicts 7. It lacks the cytoplasmic C-terminal domain of canonical
  MgtC and is only about 30-35% identical to Salmonella MgtC, E. coli YhiD or M. tuberculosis
  MgtC over about 210 aligned residues, so it is not an MgtC ortholog. Salmonella MgtC is not
  a Mg2+ transporter despite its name: it is a virulence factor that binds the a subunit of
  the F1Fo ATP synthase and inhibits it (PMID:23827679). That activity cannot be transferred
  to this protein. The closest studied relative is P. aeruginosa PA0043 (42% identity over
  362 residues). A PA0043 missense allele was linked to colistin resistance in an in vitro
  evolution study (PMID:27150578), but that study assigned no molecular activity. Neither
  PANTHER PTHR39084 nor its single Swiss-Prot member (Aquifex aq_1828, DUF4010 only) has a
  characterized function.
  In SJTE-1 the gene lies downstream of, and overlaps, the Crp/Fnr-family regulator gene fnrC.
  Nearby are universal stress protein genes and the paa phenylacetate cluster. There is no
  integrase, transposase, phage gene or tRNA within 25 kb, and its GC content is typical of
  the genome. However, the gene is absent from KT2440 and other reference P. putida
  proteomes, so it is accessory. No fitness data exist for this protein or its KT2440
  counterpart (there is none). Molecular function and biological process are unknown; only
  the inner-membrane location is supported.
