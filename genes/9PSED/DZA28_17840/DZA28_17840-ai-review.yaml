    action: NEW
    reason: >-
      DeepTMHMM predicts 13 alpha-helical TM segments and no signal peptide, and UniProt
      Phobius predicts 7. Both Pfam modules are membrane-embedded. In a Gram-negative
      bacterium an alpha-helical polytopic protein without a signal peptide is placed in the
      cytoplasmic (inner) membrane. The canonical MgtC proteins that share the N-terminal
      domain are inner-membrane proteins (PMID:23827679). This is the only GO annotation
      the evidence supports.
