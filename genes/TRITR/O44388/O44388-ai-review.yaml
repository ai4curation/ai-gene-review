id: O44388
gene_symbol: O44388
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:36087
  label: Trichuris trichiura
description: >-
  Beta-tubulin of the human whipworm Trichuris trichiura forms alpha/beta
  heterodimers that polymerize into microtubule protofilaments. This 444 aa
  beta chain carries conserved Tubulin/FtsZ nucleotide-binding and C-terminal
  domains, including the wild-type benzimidazole-susceptible Phe167, Glu198
  and Phe200 residues at positions where F167Y, E198A and F200Y substitutions
  are associated with nematode beta-tubulin benzimidazole resistance.
existing_annotations:
