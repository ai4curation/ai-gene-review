suggested_questions:
- question: >-
    Which T. trichiura beta-tubulin paralog or paralogs are incorporated into
    the microtubules engaged by benzimidazoles, and is O44388 the dominant
    beta-tubulin chain in that drug-sensitive pool?
suggested_experiments:
- description: >-
    Map O44388-specific sequence variants onto current Trichuris beta-tubulin
    loci and compare isoform-resolved beta-tubulin expression in susceptible and
    benzimidazole-exposed or resistant Trichuris isolates.
  hypothesis: >-
    Only a subset of Trichuris beta-tubulin isotypes constitutes the
    benzimidazole-sensitive microtubule pool, and O44388-like beta-tubulin may
    be one such isotype.
  experiment_type: comparative genomics and expression profiling
