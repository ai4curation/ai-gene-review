    label: GTPase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR002453
  review:
    summary: InterPro2GO beta-tubulin GTPase assignment.
    action: ACCEPT
    reason: >-
      O44388 has the beta-tubulin InterPro signature, a conserved
      Tubulin/FtsZ GTPase-domain signature and a full-length beta-tubulin
      sequence. This row keeps GO's enables qualifier by convention for
      beta-tubulins while core_functions models the activity as
      contributes_to_molecular_function; it should be read as the beta-chain
      contribution to the tubulin nucleotide cycle, not as evidence that the T.
      trichiura beta chain was assayed in isolation or independently
      autohydrolyzes GTP away from an alpha/beta-tubulin interface.
    supported_by:
    - &uniprot_gtpase_domain
      reference_id: file:genes/TRITR/O44388/O44388-uniprot.txt
      record_section: ["DR:InterPro"]
      supporting_text: >-
        InterPro; IPR003008; Tubulin_FtsZ_GTPase
    - &uniprot_function
      reference_id: file:genes/TRITR/O44388/O44388-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: >-
        Microtubules grow by the addition of GTP-tubulin dimers to the
        microtubule end, where a stabilizing cap forms. Below the cap, tubulin
        dimers are in GDP-bound state, owing to GTPase activity of alpha-tubulin
