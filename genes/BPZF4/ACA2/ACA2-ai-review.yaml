id: H9C180
gene_symbol: aca2
taxon:
  id: NCBITaxon:1127516
  label: Pectobacterium phage ZF40
description: Aca2 is the 116-residue helix-turn-helix regulator encoded beside acrIF8 in Pectobacterium
  phage ZF40. It forms a homodimer and represses transcription by binding inverted repeats in the operon
  promoter. The same HTH domain also recognizes conserved RNA stem-loops and blocks ribosome access, repressing
  translation. These complementary activities control anti-CRISPR production during phage infection; Aca2
  is a regulator of the inhibitor rather than a direct Cas inhibitor.
existing_annotations:
- term:
    id: GO:0003677
    label: DNA binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  review:
    summary: This annotation is correct but too general. Aca2 is specifically a sequence-specific DNA-binding
      transcription factor that recognizes inverted repeat operator sequences in the acrIF8-aca2 promoter
      through its N-terminal HTH domain. The protein binds as a homodimer to regulate transcription.
    action: MODIFY
    proposed_replacement_terms:
    - &id003
      id: GO:0001217
      label: DNA-binding transcription repressor activity
    supported_by:
    - reference_id: PMID:31428783
      supporting_text: Aca2 is a dimer that represses the expression of the acrIF8–aca2 operon, and that
        this autoregulation is mediated through binding to inverted repeats in the promoter region
    reason: Direct promoter binding represses acrIF8-aca2 transcription, supporting refinement to DNA-binding
      transcription repressor activity (GO:0001217), rather than only the broader transcription factor
      term.
- term:
    id: GO:0003723
    label: RNA binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000043
  review:
    summary: Correct annotation supported by experimental evidence. Aca2 binds conserved RNA stem-loops
      on the acrIF8-aca2 mRNA to block ribosome access and inhibit translation. This RNA-binding function,
      mediated by the same HTH domain that binds DNA, provides a second layer of regulatory control beyond
      transcriptional repression.
    action: ACCEPT
    supported_by:
    - &id001
      reference_id: PMID:38987591
      supporting_text: the HTH domain of the regulator Aca2, in addition to repressing Acr synthesis transcriptionally
        through DNA binding, inhibits translation of mRNAs by binding conserved RNA stem-loops and blocking
        ribosome access
    reason: Direct RNA binding by the HTH domain blocks ribosome access and provides a distinct translational
      regulatory function.
- term:
    id: GO:0046872
    label: metal ion binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000043
  review:
    summary: A crystallographic metal association does not establish a physiological metal-binding function.
    action: MARK_AS_OVER_ANNOTATED
    reason: UniProt records an Mg(2+) contact at residue 92 from apo structure 7VJO. PMID:34756887 reports
      crystallization in 0.2 M magnesium chloride. This is valid structural evidence of a contact, but
      does not establish a physiological metal-binding activity. Retain MARK_AS_OVER_ANNOTATED for the
      keyword-derived functional assertion; the concern is the high-magnesium crystallization context,
      not a requirement that metal binding be necessary for DNA/RNA repression.
    supported_by:
    - reference_id: file:BPZF4/ACA2/ACA2-uniprot.txt
      record_section: ["FT:BINDING"]
      supporting_text: 'BINDING         92

        FT                   /ligand="Mg(2+)"

        FT                   /ligand_id="ChEBI:CHEBI:18420"

        FT                   /evidence="ECO:0007744|PDB:7VJO"'
    - reference_id: PMID:34756887
      supporting_text: The crystals of apo-Aca2 were crystallized in 0.2 M magnesium chloride hexahydrate;
        0.1 M TRIS hydrochloride pH 8.5; 20% (w/v) PEG 8000.
- term:
    id: GO:0017148
    label: negative regulation of translation
  evidence_type: IDA
  review:
    summary: Aca2 inhibits translation by binding conserved RNA stem-loops in the acrIF8-aca2 mRNA to
      block ribosome access.
    action: NEW
    reason: This biological process term captures Aca2's dual regulatory mechanism that includes translational
      repression through RNA binding.
    supported_by:
