      reference_id: PMID:31428783
      supporting_text: Aca2 is a dimer that represses the expression of the acrIF8–aca2 operon, and that
        this autoregulation is mediated through binding to inverted repeats in the promoter region
  original_reference_id: PMID:31428783
- term:
