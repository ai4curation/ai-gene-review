core_functions:
- description: Twist-family bHLH transcription factor of the skeletogenic mesoderm
    (primary mesenchyme cell) lineage that, downstream of Alx1 and in a positive-feedback
    loop with it, maintains the PMC regulatory state and drives the transcriptional
    programmes for ingression (epithelial-mesenchymal transition, specifically de-adhesion),
    PMC fusion and calcite biomineralization. Functional evidence is from the congener
    Lytechinus variegatus; the S. purpuratus protein is the 92%-identical orthologue.
