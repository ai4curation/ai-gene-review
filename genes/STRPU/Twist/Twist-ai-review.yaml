gene_symbol: Twist
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7668
  label: Strongylocentrotus purpuratus
description: Twist is the single sea urchin member of the Twist family of basic helix-loop-helix
  (bHLH) transcription factors, with a TWIST1-type bHLH domain and the C-terminal
  WR motif characteristic of the family. In the sea urchin embryo twist is transcribed
  in the skeletogenic mesoderm lineage (the large micromere-derived primary mesenchyme
  cells, PMCs) from the late blastula, is maintained in PMCs through gastrulation,
  and is later also expressed in the non-skeletogenic (secondary) mesenchyme. It is
  activated downstream of the PMC specifier Alx1 and feeds back positively on alx1
  expression, forming a positive-feedback loop that maintains the PMC regulatory state
  after the transient initiating inputs have faded. Twist knockdown in the congener
  Lytechinus variegatus delays PMC ingression (epithelial-mesenchymal transition),
  with a specific failure of the de-adhesion step, disrupts PMC migration and syncytial
  fusion, lowers transcripts of the biomineralization genes msp130, sm50 and sm30,
  and abolishes the larval calcite skeleton; overexpression produces supernumerary
  and mis-positioned spicules. Later roles in secondary mesenchyme derivatives (pigment
  and muscle cells) are also reported. The protein is the echinoderm orthologue of
  the mesoderm and EMT regulators Twist1/Twist2 of vertebrates and Drosophila Twist.
