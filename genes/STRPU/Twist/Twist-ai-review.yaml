  knowledge_gaps:
  - gap_statement: No functional, expression or DNA-binding data exist for S. purpuratus
      Twist itself; all evidence is from L. variegatus, and the S. purpuratus GRN
      models (Oliveri 2008; Shashikant 2018) do not include twist.
  - gap_statement: Direct transcriptional targets of sea urchin Twist are unknown;
      the Twist-to-alx1 and Twist-to-biomineralization-gene inputs have not been tested
      by cis-regulatory analysis, so neither activator nor repressor activity can
      be asserted.
suggested_questions:
- question: Is Twist a direct activator of alx1 (and of sm50/msp130/sm30) in PMCs,
    which would justify a GO:0001228 activator annotation, or does it act through
    intermediate regulators?
- question: Does Sp-Twist show the same PMC-restricted, post-ingression expression
    and knockdown phenotype as LvTwist, so that the L. variegatus-based annotations
    can be confirmed in S. purpuratus?
- question: Which bHLH partner (an E-protein homo/heterodimer?) does sea urchin Twist
    use, and does it also regulate the proposed conserved targets hex and fgfr1?
suggested_experiments:
- description: Whole-mount in situ hybridization time course and morpholino/CRISPR
    knockdown of Sp-twist in S. purpuratus, scored for ingression timing, PMC fusion
    and skeleton formation, to transfer the L. variegatus phenotype to the species
    of the UniProt record.
- description: Twist ChIP-seq or reporter analysis of the alx1 and sm50 cis-regulatory
    modules in PMCs to test whether the positive Twist inputs modelled in the GRN
    are direct and activating.
