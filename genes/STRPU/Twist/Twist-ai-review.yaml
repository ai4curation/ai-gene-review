    review_notes: PubMed-verified (Mol Biol Evol 2007;24:1912-25). This is the RX
      citation on the TrEMBL record (third-party annotation BK006287); abstract only
      is cached and it reports no sea urchin experiment. Used only for family background.
- id: PMID:18495103
  title: Twist is an essential regulator of the skeletogenic gene regulatory network
    in the sea urchin embryo.
  findings:
  - statement: The S. purpuratus twist gene (204 aa; GenBank DAA06084, the source
      of UniProt A7Z0B7) was identified in silico from the genome; all functional
      work was done on the L. variegatus orthologue (92% identical).
    supporting_text: we identified the Sptwist gene in silico , which encodes a 204
      amino acid polypeptide, by blasting the assembly of S. purpuratus genome with
      the coding sequence of Lvtwist
  - statement: GenBank DAA06084 was deposited by this study.
    supporting_text: Strongylocentrotus purpuratus Twist protein sequence was annotated
      and deposited on GenBank (Accession Number DAA06084 ).
  - statement: twist is expressed predominantly in ingressing PMCs at mesenchyme blastula
      and later in the SMC territory.
    supporting_text: At early mesenchyme blastula (MB) stage, Lvtwist mRNA is predominantly
      expressed in ingressing PMCs
  - statement: Knockdown or overexpression of Twist perturbs successive phases of
      PMC development.
    supporting_text: Perturbations of Twist either by morpholino knockdown or by overexpression
      result in defects in progressive phases of PMC development, including specification,
      ingression/EMT, differentiation and skeletogenesis.
  - statement: Twist is required for maintenance of the PMC specification state through
      reciprocal regulation with Alx1.
    supporting_text: Evidence is presented that Twist expression is required for the
      maintenance of the PMC specification state, and a reciprocal regulation between
      Alx1 and Twist offers stability for the subsequent processes, such as PMC differentiation
      and skeletogenesis.
  - statement: Twist morphants show delayed ingression and no larval skeleton; biomineralization
      gene transcripts are reduced.
    supporting_text: Downstream of Twist, the mRNA expression level of Lvmsp130, Lvsm50
      , and Lvsm30 were examined by QPCR, and were all significantly reduced in Twi
      morphants when compared to MB controls
  - statement: Twist is required cell-autonomously in micromeres for timely ingression,
      migration and PMC fusion.
    supporting_text: The chimeras show that Twist is essential in micromeres for these
      cells to ingress punctually and migrate properly into the blastocoel as PMCs.
  - statement: Whether the Alx1-Twist regulatory inputs are direct was not tested.
    supporting_text: However, whether this mutually positive regulation is due to
      direct intergenic inputs will requires further examination to confirm the relationship,
      such as cis-regulatoy analyses.
  - statement: Secondary mesenchyme derivatives (pigment cells, muscle) are also reduced
      in morphants.
    supporting_text: Other SMC-associated phenotypes were also observed to persist
      including reduction of pigment cells ( Fig. 3E,K ; Fig. S1 ) and absence of
      muscle
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'PubMed-verified (Dev Biol 2008;319:406-15; PMC2517249), full text
      cached. The primary functional paper on sea urchin Twist. Organism caveat: experiments
      are in Lytechinus variegatus; the S. purpuratus gene/protein (A7Z0B7) was identified
      in silico only.'
- id: PMID:24598159
  title: Sub-circuits of a gene regulatory network control a developmental epithelial-mesenchymal
    transition.
  findings:
  - statement: twist (with snail) is part of the L. variegatus skeletogenic GRN but
      not of the published S. purpuratus GRN model.
    supporting_text: The biggest difference between the current S. purpuratus GRN
      model and that shown in Fig. 1 is the observation that snail and twist are part
      of the L. variegatus GRN (Wu et al., 2007; Wu et al., 2008 ).
  - statement: twist is one of 13 PMC transcription factors required for EMT, downstream
      of alx1/ets1/tbr.
    supporting_text: Three TFs highest in the GRN specified and activated EMT (alx1,
      ets1, tbr) and the 10 TFs downstream of those (tel, erg, hex, tgif, snail, twist,
      foxn2/3, dri, foxb, foxo) were also required for EMT.
