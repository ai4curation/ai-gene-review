- term:
    id: GO:0010718
    label: positive regulation of epithelial to mesenchymal transition
  evidence_type: IMP
  original_reference_id: PMID:18495103
  qualifier: involved_in
  review:
    summary: Twist is one of the transcription factors that control the ingression
      (EMT) of the skeletogenic PMCs. Morpholino knockdown (two non-overlapping morpholinos)
      delays ingression of >80% of embryos; micromere-transplant chimeras show the
      requirement is cell-autonomous in the micromere lineage; and a five-assay dissection
      of EMT shows that twist morphant PMCs remodel the basement membrane, move, constrict
      and keep polarity but fail the de-adhesion step, placing twist with alx1 and
      snail in a positive-feedback de-adhesion sub-circuit. Twist regulates the EMT
      programme transcriptionally rather than executing it, hence the regulation term.
      Note that all functional data on sea urchin Twist come from Lytechinus variegatus
      (LvTwist); the S. purpuratus protein was identified in silico by the same authors
      and is 92% identical.
    action: NEW
    reason: 'Participation test passed for a regulatory role: the gene product is
      a transcription factor in the GRN sub-circuit that drives de-adhesion, and its
      loss delays/blocks completion of EMT. Recorded as IMP from morpholino knockdown
      and chimera experiments in L. variegatus, there being no S. purpuratus functional
      data; kept as a regulation term because no EMT effector target of Twist has
      been identified.'
    supported_by:
    - reference_id: PMID:18495103
      supporting_text: PMCs of Twi morphants failed to ingress (>80%, Fig. 3E ) until
        after a significant delay.
    - reference_id: PMID:18495103
      supporting_text: The chimeras show that Twist is essential in micromeres for
        these cells to ingress punctually and migrate properly into the blastocoel
        as PMCs.
    - reference_id: PMID:24598159
      supporting_text: Our analysis of both snail and twist knockdowns showed a failure
        of PMCs to complete EMT in spite of four other successful cell state changes
    - reference_id: PMID:24598159
      supporting_text: Therefore, alx1, twist and snail display control over adhesive
        state change and make a distinct sub-circuit of the GRN, a positive-feedback
        lockdown, that governs the de-adhesion process ( Fig. 7E ).
- term:
    id: GO:0070169
    label: positive regulation of biomineral tissue development
  evidence_type: IMP
  original_reference_id: PMID:18495103
  qualifier: involved_in
  review:
    summary: Twist knockdown abolishes the larval calcite skeleton even after prolonged
      culture, strongly reduces transcripts of the biomineralization genes msp130,
      sm50 and sm30, delays appearance of the PMC-specific MSP130 (1d5) antigen, and
      cell-autonomously prevents the syncytial PMC fusion that precedes spicule deposition;
      overexpression gives extra and mis-positioned spicules. Twist is a transcriptional
      regulator upstream of the skeletogenic differentiation programme, not an executor
      of mineral deposition, hence the regulation term. Note that all functional data
      on sea urchin Twist come from Lytechinus variegatus (LvTwist); the S. purpuratus
      protein was identified in silico by the same authors and is 92% identical.
    action: NEW
    reason: Specific, non-pleiotropic positive input of Twist into biomineral (spicule)
      formation, shown by loss-of-function morphology, QPCR of biomineralization genes
      and PMC-fusion chimeras in L. variegatus; recorded as IMP. Same term as used
      for the sibling PMC regulators Alx1, Hex and FoxB.
    supported_by:
    - reference_id: PMID:18495103
      supporting_text: Twi morphants failed to form a skeleton ( Fig. 3I ).
    - reference_id: PMID:18495103
      supporting_text: Downstream of Twist, the mRNA expression level of Lvmsp130,
        Lvsm50 , and Lvsm30 were examined by QPCR, and were all significantly reduced
        in Twi morphants when compared to MB controls
    - reference_id: PMID:18495103
      supporting_text: These data show that Lvtwist functions upstream of the PMC
        skeletogenic differentiation program.
    - reference_id: PMID:18495103
      supporting_text: Taken together, these data support the hypothesis that Twist
        is required for PMC fusion, and therefore for developmental events upstream
        of skeletogenesis.
- term:
    id: GO:0001710
    label: mesodermal cell fate commitment
  evidence_type: IMP
  original_reference_id: PMID:18495103
  qualifier: involved_in
  review:
    summary: Twist is activated in the skeletogenic (PMC) lineage downstream of Alx1
      and feeds back to maintain alx1 expression after ingression, forming an Alx1-Twist
      positive-feedback loop that the authors show is required for maintenance of
      the PMC specification state; without Twist, PMC differentiation and skeletogenesis
      progressively fail. Because twist comes on after the specification genes alx1/ets1
      and acts in maintenance rather than initiation, the commitment term (parent
      of specification and determination) is used, as for the sibling state-stabilization
      regulators Hex and Erg. Note that all functional data on sea urchin Twist come
      from Lytechinus variegatus (LvTwist); the S. purpuratus protein was identified
      in silico by the same authors and is 92% identical.
    action: NEW
    reason: 'Participation test passed: Twist is a transcription factor whose activity
      locks down the already-specified skeletogenic mesodermal regulatory state (positive
      feedback onto alx1). IMP from morpholino/QPCR perturbation in L. variegatus.
      Directness of the Twist-to-alx1 input is untested, so no transcription-activator
      term is proposed.'
    supported_by:
    - reference_id: PMID:18495103
      supporting_text: Evidence is presented that Twist expression is required for
        the maintenance of the PMC specification state, and a reciprocal regulation
        between Alx1 and Twist offers stability for the subsequent processes, such
        as PMC differentiation and skeletogenesis.
    - reference_id: PMID:18495103
      supporting_text: In Twi morphants, Lvalx1 expression level is reduced at MB
        stage, but not at earlier stages, while Lvets1 expression is unaffected in
        Twi morphants.
    - reference_id: PMID:18495103
      supporting_text: At LHB and EMB stage, the expression of Lvtwist is reduced
        in Alx1 morphants, but not in either Ets1 or Sna morphants.
    - reference_id: PMID:18495103
      supporting_text: Alx1 appears necessary for twist expression, and later Twist
        appears to feed back to positively regulate alx1 expression ( Fig. 8 ).
    - reference_id: PMID:24598159
      supporting_text: In the sea urchin de-adhesion sub-circuit, alx1 is upstream
        of both twist and snail, with twist also positively regulating alx1.
