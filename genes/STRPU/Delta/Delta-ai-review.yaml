core_functions:
- description: Cell-surface Notch ligand presented by the skeletogenic micromere lineage (and later by the non-skeletogenic
    mesoderm) that activates Notch/Su(H) signaling in the contiguous veg2 cells, thereby specifying them as non-skeletogenic
    mesoderm (pigment and other mesodermal lineages) through direct activation of gcm and other mesodermal regulatory
    genes.
  supported_by:
  - reference_id: PMID:22306924
    supporting_text: The expression of the Delta signaling ligand is required for pregastrular specification of
      all mesoderm derivatives in the adjacent NSM.
  - reference_id: PMID:18413610
    supporting_text: from seventh cleavage, the Notch ligand Delta. Reception of this signal causes the ring of
      cells then immediately adjacent to the micromere lineage to assume mesodermal fate
  - reference_id: PMID:16925988
    supporting_text: confirming that spgcm is a direct target of canonical N signaling mediated through Su(H) inputs
  - reference_id: PMID:11934860
    supporting_text: expression of LvDelta by micromere descendants is both necessary and sufficient for the development
      of two mesodermal cell types, pigment cells and blastocoelar cells
  molecular_function:
