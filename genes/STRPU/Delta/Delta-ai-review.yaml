suggested_questions:
- question: Should GO:0005112 Notch binding be asserted for the sea urchin protein? It is the expected activity of
    a DSL-domain ligand and mouse Dll1 carries it by IPI, but no direct Delta-Notch binding assay has been reported
    for S. purpuratus; the current review stops at receptor ligand activity inferred from concordant ligand/receptor/Su(H)
    perturbations.
- question: Is the ARBA 'cytoplasm' location a transfer of the vertebrate Dll1 intracellular-domain observation,
    and if so should the ARBA rule be restricted to vertebrate members? Nothing in the sea urchin literature supports
    a cytoplasmic pool.
- question: The second (NSM) phase of delta expression signals to the veg2 endoderm ring and small micromeres; should
    any endoderm-directed process be annotated, given that no endoderm regulatory gene responds to Delta before
    gastrulation?
suggested_experiments:
- description: Immunolocalization or a tagged Delta BAC to document surface presentation on the micromere descendants
    and the SM-to-NSM switch at the protein level, and to test whether the ligand is endocytosed or cleaved in the
    signaling cell.
  experiment_type: localization
- description: In vitro or cell-based binding assay between the sea urchin Delta DSL/EGF ectodomain and the Sp-Notch
    EGF repeats to convert the inferred receptor ligand activity into direct Notch binding evidence.
  experiment_type: biochemical
- description: Lineage-restricted rescue (micromere-only delta mRNA in a Delta-CRISPR background) to separate the
    contribution of the first (SM) and second (NSM) phases of expression to pigment, blastocoelar, muscle and coelomic
    pouch fates.
  experiment_type: genetic
