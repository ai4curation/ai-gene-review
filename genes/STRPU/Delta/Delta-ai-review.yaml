taxon:
  id: NCBITaxon:7668
  label: Strongylocentrotus purpuratus
description: 'Delta is the single-pass type I transmembrane Notch ligand of the purple sea urchin embryo, built
  of an N-terminal MNNL domain, a DSL domain, eight EGF-like repeats (several of the calcium-binding type), a
  transmembrane helix and a short cytoplasmic tail. It is not secreted: it stays tethered to the surface of the
  cell that expresses it and signals only to cells in direct contact, by activating the Notch receptor and thereby
  Su(H)-dependent transcription in the neighbour. Zygotic delta transcription begins at about 8-9 h after fertilization
  in the large micromere (skeletogenic mesoderm) lineage at the center of the vegetal plate, where its transcription
  is permitted by the Pmar1-HesC double-negative gate (HesC represses delta everywhere else, through a class C
  E-box in the 5'' UTR proximal module, while Runx and Ets1 activate it). Delta presented by the micromere descendants
  is the inductive signal that makes the immediately adjacent ring of veg2 cells non-skeletogenic mesoderm: it drives
  the Notch/Su(H)-dependent activation of gcm and of gataE, foxA and foxY in those cells, and blocking the ligand,
  the receptor or Su(H) abolishes pigment cells and other pregastrular mesoderm derivatives. When the skeletogenic
  cells ingress at the mesenchyme blastula stage, delta is switched off in them and turned on in the non-skeletogenic
  mesoderm itself, moving the signal outward to the veg2 endoderm ring and to the small micromeres. In the Lytechinus
  orthologue the micromere ligand is both necessary and sufficient for pigment and blastocoelar cell formation,
  and macromere-derived Delta is needed for blastocoelar and muscle cells. Later, in the gastrula ectoderm, Delta/Notch
  signaling restricts the number of neural progenitors by lateral inhibition; Delta knockdown or CRISPR mutation
  gives supernumerary neurons.'
