- term:
    id: GO:0042662
    label: negative regulation of mesodermal cell fate specification
  evidence_type: IMP
  original_reference_id: PMID:17636127
  qualifier: involved_in
  review:
    summary: Proposed. HesC is the repressor that keeps the skeletogenic mesoderm (large micromere lineage) regulatory
      state off in every other cell of the embryo; removing it converts all cells to skeletogenic mesenchyme.
    action: NEW
    reason: 'Participation test: HesC itself performs the regulatory step, direct transcriptional repression of
      the mesodermal specification genes alx1, ets1, tbr and delta, and the cis-regulatory sites through which it
      does so are mapped. hesC morpholino causes all cells to express the micromere regulatory state, ingress and
      adopt mesenchymal form (PMID:17636127); in other euechinoids hesC knockdown likewise increases mesenchyme
      cell number (PMID:27046223). The term is used for transcriptional regulators that restrict mesodermal fate
      (e.g. Mesp1, Dkk1 lineages in QuickGO), so it is the conventional term for this role. It is not an ancestor/descendant
      of any term already on the gene. Downstream skeletogenesis/biomineralization terms are deliberately not proposed
      (consequences of the fate decision, executed by other genes).'
    supported_by:
    - *id004
    - *id007
    - reference_id: PMID:17636127
      supporting_text: the amount of transcript of delta and alx1 had increased 4- to 7-fold above normal in the
        two experiments performed
    - *id003
    - reference_id: PMID:27046223
      supporting_text: The number of larval mesenchyme cells increased when the translation of hesC was inhibited
core_functions:
- description: Sequence-specific transcriptional repression of the skeletogenic-mesoderm regulatory genes (delta,
    alx1, ets1, tbr) in every cell outside the large micromere lineage, as the second repressor of the pmar1-hesC
    double-negative gate that restricts skeletogenic mesoderm specification to the micromeres.
  supported_by:
  - *id004
