- Repressor of micromeres
status: COMPLETE
description: 'Sp-HesC is a Hairy/Enhancer-of-split (HES) family basic helix-loop-helix transcriptional repressor
  of the purple sea urchin, with an N-terminal bHLH DNA-binding domain, an Orange domain and a C-terminal WRPW motif
  that recruits the Groucho/TLE corepressor. In the early embryo hesC is transcribed zygotically from about 8 h
  after fertilization in every cell except the large micromere lineage, where the paired-homeodomain repressor Pmar1
  shuts it off. HesC is the second repressor of the pmar1-hesC double-negative gate that initiates skeletogenic
  mesoderm specification: it directly represses the micromere regulatory genes alx1, ets1, tbr and the Notch ligand
  gene delta through cis-regulatory target sites (a class C E-box in the delta proximal module, proximal and distal
  sites at alx1, a proximal site at tbr), so that these genes are transcribed only where HesC is absent. Blocking
  hesC translation phenocopies global Pmar1 expression, converting all cells of the embryo into ingressing skeletogenic
  mesenchyme. Later, hesC is repressed by Blimp1 in the non-skeletogenic mesoderm and activated by Delta-Notch signaling
  through a Su(H) site, and its withdrawal permits delta expression to sweep from mesoderm into endoderm. This micromere-gating
  role of HesC is an evolutionary novelty of euechinoid sea urchins; cidaroid and starfish hesC do not occupy the
  same position, although the family''s ancestral role as a Notch-responsive repressor in ectodermal lateral inhibition
  is retained in echinoids.'
