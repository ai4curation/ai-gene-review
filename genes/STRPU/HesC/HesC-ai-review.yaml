suggested_questions:
- question: Should the HesC-delta relationship be represented as HesC 'has input' delta (negative regulation of
    delta transcription) rather than as a Notch-pathway regulation term? HesC controls where the ligand gene is
    transcribed, which is one transcriptional step removed from the pathway.
- question: Does Sp-HesC bind the mapped class C E-box (CACGCG) sites directly? No EMSA or ChIP has been reported
    for the sea urchin protein; binding-site identity rests on mutagenesis and the HES family consensus.
- question: Is the IBA anterior/posterior pattern specification row from PTN000105428 appropriate for non-vertebrate
    members of this node, given that the seeding evidence is the vertebrate segmentation clock and C. elegans lin-22?
suggested_experiments:
- description: ChIP-qPCR or EMSA with recombinant Sp-HesC on the delta proximal CRM (+359 E-box), the alx1 proximal/distal
    sites and the tbr proximal site to convert the functional site assignments into direct binding evidence.
- description: Immunolocalization or GFP-tagged HesC BAC to document nuclear localization and protein clearance
    kinetics in the micromere lineage relative to alx1/delta activation, addressing the timing discrepancy raised
    by quantitative FISH.
- description: Test whether Sp-HesC is required for serotonergic neuron restriction in the apical plate (hesC morpholino
    with neural markers), which would ground the family-level regulation-of-neurogenesis inference in this species.
