    summary: IBA from PAINT node PTN000105428, seeded by vertebrate Hes/Her/Hey genes of the somite segmentation
      clock and by C. elegans lin-22 seam-cell patterning. No anterior/posterior patterning function has been reported
      for sea urchin HesC; its characterized function is to restrict the skeletogenic (micromere) regulatory state
      along the animal-vegetal axis, a euechinoid-specific gate.
    action: MARK_AS_OVER_ANNOTATED
    reason: The IBD node placement bundles lineage-specific vertebrate/nematode A/P roles onto a bilaterian HES
      node. In S. purpuratus, hesC perturbation converts the whole embryo to skeletogenic mesenchyme with no reported
      axial patterning defect, and the double-negative gate in which HesC acts is an evolutionary novelty of euechinoids
