suggested_questions:
- question: Should the oral ectoderm role be captured with GO:0060834 oral/aboral axis specification (which
    currently carries no annotations in QuickGO) rather than, or in addition to, ectodermal cell fate
    specification?
- question: Does Dri act as a repressor of aboral ectoderm genes (spec1 and its regulators) in the oral
    ectoderm, or only as an activator of oral regulatory genes, with aboral repression being indirect?
- question: Is the response of the spdri reporter to Dri a direct positive autoregulatory loop, and does
    it operate in both expression phases?
suggested_experiments:
- description: Dri ChIP-seq (or ChIP-qPCR on candidate modules such as Sp-cyp1 and oral ectoderm regulatory
    genes) in S. purpuratus at 18-24 h to identify direct targets in the PMC and oral ectoderm phases
    and to establish the sign of Dri input in the oral ectoderm.
- description: Electrophoretic mobility shift assays with purified Dri ARID domain on the mapped Sp-cyp1
    218-bp module to confirm sequence-specific binding of the sites required for reporter expression.
