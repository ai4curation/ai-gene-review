taxon:
  id: NCBITaxon:7668
  label: Strongylocentrotus purpuratus
description: 'Dri (Spdeadringer, Spdri) is an ARID-class transcription factor of the ARID3/Dead ringer/Bright
  subfamily, with a central ARID DNA-binding domain and a C-terminal REKLES domain. In the sea urchin
  embryo it is expressed in two separate phases, each following prior territorial specification: first,
  from about 12 h until ingression, in the skeletogenic descendants of the large micromeres (the primary
  mesenchyme cell lineage), where it is activated by the skeletogenic regulators Ets1, Alx1 and Tbr; and
  second, from about 20 h, in the oral ectoderm, where it is released by the Gsc-controlled repressor
  gate and remains expressed in the oral "face" epithelium far into development. In the skeletogenic lineage
  Dri is a direct transcriptional activator, together with Ets1, of the terminal skeletogenic differentiation
  gene battery (for example cyclophilin, whose cis-regulatory module requires intact Dri target sites),
  and its cell-autonomous function is needed for skeletogenic gene expression before ingression and for
  spicule formation. In the oral ectoderm Dri is part of the central regulatory network that maintains
  oral ectoderm identity; when it is knocked down, oral-specific features are lost and the aboral marker
  spec1 spreads around the entire ectoderm, and the oral-side patterning information that the primary
  mesenchyme cells need to complete skeletogenesis is not presented. Knockdown also causes failure of
  gastrulation, through indirect, non-autonomous effects rather than a defect in endomesoderm specification.'
