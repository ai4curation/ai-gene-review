- term:
    id: GO:0007501
    label: mesodermal cell fate specification
  evidence_type: IMP
  original_reference_id: PMID:16925988
  qualifier: involved_in
  review:
    summary: Gcm is the direct genomic target of Delta/Notch signalling in the veg2 cells and the first
      regulatory gene of the aboral non-skeletogenic mesoderm (pigment cell precursor) state. Morpholino
      knockdown gives larvae without pigment cells, and rewiring gcm under tbr control converts skeletogenic
      mesoderm cells into pigment cells in the absence of Notch signalling, so gcm expression is necessary
      and sufficient to specify this mesodermal sub-fate. Gcm itself performs the first regulatory step
      (activation of gataE and the downstream aboral NSM circuit).
    action: NEW
    reason: Gcm is the transcription factor that executes the specification step downstream of the Delta
      signal (participation, not merely necessity); the sibling GRN regulators Alx1 and Pmar1 carry the
      same term for the skeletogenic mesoderm lineage. Downstream repression of skeletogenic and oral-NSM
      genes is indirect and not annotated.
    additional_reference_ids:
    - PMID:22238426
    - PMID:22509525
    - PMID:23261933
    supported_by:
    - reference_id: PMID:16925988
      supporting_text: These results confirm that this gene is required for pigment cell specification.
    - reference_id: PMID:22238426
      supporting_text: The result of reengineering the regulatory circuitry in this way was to divert
        the developmental program of these cells from skeletogenesis to pigment cell formation, confirming
        a direct prediction of the GRN.
    - reference_id: PMID:22509525
      supporting_text: Gcm is required in veg2 progeny during late cleavages for the early phase of pigment
        cell precursor specification.
    - reference_id: PMID:23261933
      supporting_text: First the gcm gene acts as the primary, novel, regulatory state pioneer activated
        by the D/N signal
