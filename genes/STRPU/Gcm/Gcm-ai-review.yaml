core_functions:
- description: Pioneer transcriptional activator of the aboral non-skeletogenic mesoderm (pigment cell
    precursor) regulatory state. Activated directly by Delta/Notch signalling through Su(H) sites in its
    cis-regulatory module, Gcm acts in the nucleus of veg2-derived mesoderm cells to activate gataE and
    the rest of the aboral NSM circuit; its expression is necessary (morpholino gives no pigment cells)
    and sufficient (forced expression converts skeletogenic cells to pigment cells) for specification
    of this mesodermal fate.
  molecular_function:
    id: GO:0001228
    label: DNA-binding transcription activator activity, RNA polymerase II-specific
