  review:
    summary: The PAINT node carrying gliogenesis is seeded by Drosophila gcm and gcm2 and by mouse Gcm1.
      The glial function is a Drosophila-specific deployment of the family; mammalian Gcm1/Gcm2 act in
      placenta and parathyroid, and sea urchin gcm is expressed exclusively in the mesodermal pigment
      cell lineage from late cleavage onward, never in neural or glial tissue, and its knockdown phenotype
      is loss of pigment cells. There is therefore target-specific evidence that this lineage does not
      use gcm for gliogenesis, so the propagation to this node over-reaches.
