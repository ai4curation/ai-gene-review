- glial cells missing
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7668
  label: Strongylocentrotus purpuratus
description: Gcm is the single sea urchin orthologue of the Drosophila glial cells missing transcription
  factor, carrying an N-terminal GCM DNA-binding domain that recognises the ATGCGGRY consensus and C-terminal
  trans-activation domains. In the purple sea urchin embryo it is the immediate transcriptional target
  of Delta/Notch signalling from the skeletogenic micromeres, switched on in the adjacent veg2 cells at
  late cleavage through Su(H) sites in its middle cis-regulatory module, and it is the top-level, pioneering
  regulator of the aboral non-skeletogenic mesoderm (pigment cell) regulatory state. Acting in the nucleus
  as a sequence-specific activator, Gcm directly drives the GATA factor gene gataE and the pigment differentiation
  gene polyketide synthase (pks), and, through a late module bearing Gcm and Six1 sites, sustains its
  own expression in a gcm-gataE-six1 feedback loop that locks down pigment cell fate. Morpholino knockdown
  produces larvae with no pigment cells and abolishes the pigment differentiation gene battery, while
  forced expression in skeletogenic cells converts them to pigment cells. Its expression is confined by
  Alx1 repression in the skeletogenic lineage, FoxA repression in the endoderm and Not-dependent clearance
  from the oral mesoderm.
