  review:
    summary: 'Phylogenetic inference from the GCM family node seeded by human GCM2. The sea urchin protein
      has the GCM DNA-binding domain (residues 50-208), and cis-regulatory work in this species shows
      that consensus Gcm sites (ATGCGGRY) in the pks -1.5 kb region and in the gcm late module are required
      for output of those modules, i.e. Gcm binds cis-regulatory DNA of RNA polymerase II transcribed
      genes. Experimental support merged from the primary literature: Predicted Gcm consensus sites in
      the pks cis-regulatory region and in the gcm late cis-regulatory module are functionally required
      in reporter assays, demonstrating sequence-specific binding of Gcm to RNA polymerase II cis-regulatory
      DNA in vivo.'
    action: ACCEPT
    reason: 'The IBA is consistent with direct cis-regulatory evidence for Gcm sites in pks and gcm regulatory
      modules; the term is the correct specific DNA-binding term. A separate experimental NEW row would
      duplicate this GOA term, so its evidence is carried here: Site-directed mutagenesis of Gcm consensus
      sites in two separate cis-regulatory modules gives loss of output; this is the standard evidence
      for cis-regulatory-region sequence-specific DNA binding by a transcription factor.'
    supported_by:
    - reference_id: PMID:20122918
