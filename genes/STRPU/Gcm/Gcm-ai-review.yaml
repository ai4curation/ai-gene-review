- description: Direct activation of the pigment cell differentiation gene battery and self-sustaining
    maintenance of the pigment cell state. Gcm binds consensus sites in the pks (echinochrome polyketide
    synthase) cis-regulatory region and in its own late module, driving pks and, with GataE and Six1,
    a feedback loop that keeps gcm on in differentiated, dispersed pigment cells; Gcm knockdown abolishes
    pks, fmo, sult, dopt, papss and bpnt expression.
