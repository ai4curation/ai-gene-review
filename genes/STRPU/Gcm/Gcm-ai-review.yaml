knowledge_gaps:
- gap_statement: The repression of skeletogenic regulatory genes (ets1, alx1, tbr) and of oral NSM genes
    after gcm expression is indirect; the aboral repressor(s) acting downstream of Gcm/GataE have not
    been identified.
  gap_kind:
  - BIOLOGY
  status: OPEN
  provenance:
  - reference_id: PMID:23261933
    supporting_text: One outstanding issue is the identity of the aboral NSM gene which represses oral
      NSM genes resulting in the expanded pattern of oral gene expression when either Gcm MASO or GataE
      MASO is applied.
- gap_statement: Gcm binding to the gataE cis-regulatory module is inferred from kinetics, knockdown and
    Notch-independence rather than from mapped Gcm sites, and no Gcm ChIP or in vitro binding data exist
    for this species.
  gap_kind:
  - BIOLOGY
  status: OPEN
  provenance:
  - reference_id: PMID:23261933
    supporting_text: Nevertheless, our findings indicate that Gcm is likely to provide the missing Notch-dependent
      input into the gataE gene during its early NSM phase of expression.
suggested_questions:
- question: Which Gcm site(s) in the gataE cis-regulatory module mediate the direct Gcm input, and does
    Gcm bind them cooperatively with Su(H)?
- question: Does sea urchin Gcm have any function outside the pigment cell lineage (e.g. in adult or larval
    immune cells), given its persistent expression in dispersed pigment cells?
- question: Through which intermediate repressor does forced gcm expression shut down ets1 and the skeletogenic
    regulatory state?
suggested_experiments:
- description: ChIP-seq or DNA-affinity capture with a tagged Gcm in mesenchyme blastula embryos to map
    genome-wide Gcm occupancy and confirm direct binding to gataE, six1 and the pigment differentiation
    battery.
  experiment_type: ChIP-seq
- description: Site-directed mutagenesis of predicted Gcm consensus sites in the gataE early NSM module
    in reporter assays, with and without Gcm MASO, to establish the gataE linkage at cis-regulatory resolution.
  experiment_type: cis-regulatory reporter analysis
