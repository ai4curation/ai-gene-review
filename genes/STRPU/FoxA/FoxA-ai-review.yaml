  review:
    summary: PAINT inference of RNA polymerase II cis-regulatory sequence-specific DNA binding for
      the forkhead family node (PTN000930906; mouse/rat Foxa1-3, human FOXA proteins, worm PHA-4,
      fly fork head, yeast FKH1/2). Sea urchin FoxA is shown to act through a defined genomic
      target site in its own module I.
    action: ACCEPT
    reason: Family-wide winged-helix DNA binding is robust, and the cis-regulatory dissection of
      the foxa locus shows that a single FoxA site in module I mediates autorepression, i.e. the
      protein binds a cis-regulatory region of an RNA polymerase II gene.
    supported_by:
    - reference_id: PMID:20479235
      supporting_text: A mutation of a single putative FoxA site in module I increased the level
        of the FIJ:GFP reporter transcript at 20–24 hpf ( Fig. 3 I ). This result verifies that
        FoxA is an autorepressor that reduces, but does not eliminate, its gene product level.
