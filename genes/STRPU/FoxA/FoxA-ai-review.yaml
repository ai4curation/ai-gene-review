suggested_questions:
- question: Is FoxA repression of gcm direct (FoxA sites in the gcm cis-regulatory system), or mediated
    through the Notch/Su(H) input that activates gcm? The transplantation experiments establish the
    functional relationship but not the cis-regulatory mechanism.
- question: Should FoxA also be annotated as a transcriptional activator (GO:0001228)? Activation of
    hedgehog and the post-gastrular requirement for gut-specific gene expression are reported, but
    the cached primary evidence is abstract-level or second-hand, so no activator row was proposed.
- question: Does the oral-ectoderm (stomodaeum) function of foxa warrant a separate mouth
    development annotation, given that it is a distinct, non-endodermal regulatory network?
suggested_experiments:
- description: Cis-regulatory analysis of the gcm locus in the endoderm, mutating candidate FoxA
    sites in a gcm reporter and combining with foxa MASO, to test whether gcm repression by FoxA is
    direct.
  experiment_type: cis-regulatory analysis
- description: ChIP-seq or DAP-seq for Sp-FoxA at 24-30 hpf to define its direct target set in the
    endoderm (gut differentiation genes, hedgehog, adhesion and intercalation genes) and separate direct
    activation from indirect requirements.
  experiment_type: genomic binding profiling
