    summary: Generic morphogenesis term propagated from the forkhead family node (many vertebrate
      Fox genes with organ morphogenesis phenotypes). In sea urchin, foxa knockdown causes failure of
      gut formation and absence of the mouth, so the family-level inference holds but is
      uninformative.
    action: MODIFY
