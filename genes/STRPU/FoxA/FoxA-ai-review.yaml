core_functions:
- description: Sequence-specific transcriptional repression in veg2 endoderm cells, acting on its own
    gene (through a FoxA site in cis-regulatory module I) and on the mesoderm regulator gcm, which
    excludes the mesodermal (pigment/mesenchymal) program from endoderm cells and maintains the
    endoderm-mesoderm boundary.
  supported_by:
