      sea urchin phenotype is failure of archenteron/gut formation (cell intercalation and epithelial
      organisation) on foxa MASO, plus absence of the stomodaeum, for which GO:0048546 digestive
      tract morphogenesis is the appropriate descendant. This is a downstream consequence of the
      endoderm regulatory state FoxA drives, so it is not a core function.
