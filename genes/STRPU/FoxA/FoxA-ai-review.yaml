id: Q1PA44
gene_symbol: FoxA
product_type: PROTEIN
aliases:
- Sp-FoxA
- SpFoxA
- foxa
- Sp-foxa
status: COMPLETE
description: 'Sp-FoxA is the purple sea urchin orthologue of the FoxA/HNF3 class of forkhead-box
  transcription factors, with a winged-helix Fork-head DNA-binding domain, a Forkhead N-terminal
  region and a FoxA-type C-terminal region. It is a canonical endoderm regulatory gene: zygotic
  transcription begins at about 11 h post-fertilization in the whole veg2 endomesoderm lineage,
  is switched off in the prospective non-skeletogenic mesoderm at 18-20 h so that only the
  veg2 endoderm keeps expressing it, and later extends to veg1 endoderm, the gut after
  gastrulation and a patch of oral ectoderm where the mouth forms. Four cis-regulatory modules
  integrate a Tcf/beta-catenin toggle switch (spatial restriction to the endoderm), Su(H),
  Hox11/13b, Otx and Brachyury activating inputs, and a single FoxA site through which the
  protein represses its own gene. In the endoderm FoxA represses the mesoderm regulator gcm
  and thereby excludes mesodermal (pigment cell) fate from endodermal cells, helps maintain the
  endoderm-mesoderm boundary and provides regulatory functions essential for specification of
  the foregut endoderm; it also activates hedgehog. Loss of FoxA yields excess pigment and other
  mesenchymal cells, failure of gut formation and absence of the mouth.'
