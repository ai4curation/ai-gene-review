- term:
    id: GO:0042662
    label: negative regulation of mesodermal cell fate specification
  evidence_type: IMP
  original_reference_id: PMID:17038513
  qualifier: involved_in
  review:
    summary: In the veg2 endomesoderm, FoxA represses gcm, the Delta/Notch target that sits at the
      top of the mesoderm GRN, and so excludes mesodermal fate from endoderm cells; foxa MASO makes
      more endomesoderm cells become pigment and other mesenchymal cell types, and blastomere
      transplantation combined with MASO localizes this function to the normal endoderm.
    action: NEW
    reason: 'Participation test: FoxA itself performs the regulatory step (repression of gcm) that
      prevents mesodermal specification in endoderm; this is the central conclusion of Oliveri et
      al. 2006 and is restated as boundary maintenance by de-Leon and Davidson. Comparator check:
      GO:0042662 is carried by transcription factors that repress mesodermal fate in other systems
      (mouse/human MESP1, zebrafish klf2a/b), so the term is conventional for a fate-repressing
      transcription factor.'
    supported_by:
    - reference_id: PMID:17038513
      supporting_text: mesodermal fate in the veg2 endomesoderm; it is required in postgastrular
    - reference_id: PMID:17038513
