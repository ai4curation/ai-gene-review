- term:
    id: GO:0070169
    label: positive regulation of biomineral tissue development
  evidence_type: IMP
  original_reference_id: PMID:15328009
  qualifier: involved_in
  review:
    summary: >-
      The Hnf6-dependent PMC differentiation genes (sm50, pm27, msp130) encode spicule
      matrix and PMC surface proteins of the larval skeleton, so Hnf6 is a transcriptional
      activator of the biomineralization effector battery. It does not specify the
      skeletogenic lineage (alx1, ets1, pmar1, tbrain are Hnf6-independent) and is not
      involved in micromere signaling, so no lineage-specification term is proposed for
      this territory.
    action: NEW
    reason: >-
      Same term used for the co-acting PMC regulators (e.g. Dri) in this organism; Hnf6
      performs the activating step on biomineralization genes, which satisfies the
      participation test for a regulation term.
