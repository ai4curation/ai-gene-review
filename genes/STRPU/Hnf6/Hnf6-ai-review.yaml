- id: PMID:15328009
  title: SpHnf6, a transcription factor that executes multiple functions in sea urchin
    embryogenesis.
  findings:
  - statement: Sp-hnf6 encodes a ONECUT-class transcription factor with multiple distinct
      developmental roles demonstrated by loss of function.
    supporting_text: The Strongylocentrotus purpuratus hnf6 (Sphnf6) gene encodes a new
      member of the ONECUT family of transcription factors. The expression of hnf6 in the
      developing embryo is triphasic, and loss-of-function analysis shows that the Hnf6
      protein is a transcription factor that has multiple distinct roles in sea urchin
      development.
  - statement: hnf6 is maternal and globally distributed before gastrulation.
    supporting_text: hnf6 is expressed maternally, and before gastrulation its transcripts
      are distributed globally.
  - statement: Early Hnf6 is required to activate PMC differentiation (biomineralization)
      genes but not PMC regulatory genes.
    supporting_text: Early in development, its expression is required for the activation of
      PMC differentiation genes such as sm50, pm27, and msp130, but not for the activation
      of any known PMC regulatory genes, for example, alx, ets1, pmar1, or tbrain.
  - statement: Hnf6 is not involved in early micromere signaling.
    supporting_text: Micromere transplantation experiments show that the gene is not involved
      in early micromere signaling.
  - statement: Early hnf6 is required for gatac expression.
    supporting_text: Early hnf6 expression is also required for expression of the mesodermal
      regulator gatac.
  - statement: Hnf6 participates in the oral ectoderm GRN and is essential to maintain the
      oral ectoderm specification state.
    supporting_text: The second known role of hnf6 is its participation after gastrulation
      in the oral ectoderm gene regulatory network (GRN), in which its expression is
      essential for the maintenance of the state of oral ectoderm specification.
  - statement: hnf6 expression prefigures and persists in the neurogenic ciliated band, whose
      formation requires hnf6.
    supporting_text: The third role is in the neurogenic ciliated band, which is foreshadowed
      exactly by a trapezoidal band of hnf6 expression at the border of the oral ectoderm
      and where it continues to be expressed through the end of embryogenesis. Neither oral
      ectoderm regulatory functions nor ciliated band formation occur normally in the
      absence of hnf6 expression.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Dev Biol 2004;273:226-43); this is the paper cited on the UniProt RX
      line and the primary functional (morpholino, QPCR, WMISH, micromere transplantation)
      study of Sp-Hnf6. Only the abstract is cached, so quotes are limited to the abstract.
- id: PMID:15661644
  title: Expression of AmHNF6, a sea star orthologue of a transcription factor with
    multiple distinct roles in sea urchin development.
  findings:
  - statement: The Davidson lab summarises SpHNF6 as an early activator of skeletogenic
      differentiation genes and of oral ectoderm regulatory genes.
    supporting_text: The sea urchin transcription factor SpHNF6 is an early activator of
      differentiation genes in skeletogenic lineages and regulatory genes in the oral
      ectoderm.
  - statement: hnf6/onecut genes form the ONECUT homeodomain class; the ciliary-band phase of
      expression is conserved between sea urchin and sea star.
    supporting_text: The vertebrate and the echinoderm hnf6 and onecut genes belong to the
      novel ONECUT homeo domain class of transcription factors.
  - statement: AmHNF6 localises to the ciliary bands by the end of gastrulation, as in sea
      urchin.
    supporting_text: As is observed in sea urchin, by the end of gastrulation, the expression
      of AmHNF6 is distinctly localized to the ciliary bands.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Gene Expr Patterns 2005;5:381-6). Primarily about the sea star
      orthologue; used for the authors' own summary of SpHNF6 function and for conservation
      of the ciliary band expression phase. Abstract only cached.
- id: PMID:15230963
  title: 'On the origin of the chordate central nervous system: expression of onecut in
    the sea urchin embryo.'
  findings:
  - statement: Independent cloning of the same gene as SpOnecut; 483 aa with one CUT domain
      and a homeodomain, orthologous to mammalian HNF6.
    supporting_text: The isolated sea urchin gene, named SpOnecut, encodes a protein of 483
      amino acids with one cut domain and a homeodomain.
  - statement: Expression is detected in the emerging ciliary band from late blastula and is
      restricted to the ciliary band at gastrula.
    supporting_text: In the sea urchin embryo, expression is first detected in the emerging
      ciliary band at the late blastula stage. During the gastrula stage, expression is
      limited to the ciliary band.
  - statement: SpOnecut is the first gene found to exclusively mark the ciliary band and apical
      organ of the pluteus.
    supporting_text: This is the first gene known that exclusively marks the ciliary band
      and therein the apical organ in a pluteus larva
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Evol Dev 2004;6:227-36). Same gene (483 aa, CUT + homeodomain, matches
      Q6UAY6) cloned independently; its WMISH did not detect the early ubiquitous maternal
      phase reported by Otim et al. Abstract only cached.
- id: PMID:18413610
  title: Global regulatory logic for specification of an embryonic cell lineage.
  findings:
  - statement: In the skeletogenic micromere lineage GRN, Hnf6 is a ubiquitously present driver
      of the differentiation gene battery alongside the lineage-specific regulators.
    supporting_text: these differentiation genes require as drivers products of all of the
      now familiar components of the skeletogenic regulatory state ( alx1 , ets1 , tbr ,
      tel , erg , hex , foxb , dri ) and in addition a factor that is at this stage
      ubiquitously present, Hnf6 ( 42 ).
  - statement: hnf6 is the one ubiquitously expressed factor in the micromere GRN and has an
      ancillary "booster" function rather than a lineage-specifying one.
    supporting_text: Indeed one such factor is included in the micromere lineage GRN ( hnf6 )
      and its ancillary “booster” function is illustrative.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (PNAS 2008;105:5955-62); full text cached. Places hnf6 in the
      skeletogenic GRN as an input to differentiation genes only.
- id: PMID:19268450
  title: A perturbation model of the gene regulatory network for oral and aboral ectoderm
    specification in the sea urchin embryo.
  findings:
  - statement: hnf6 is an early oral ectoderm gene, later a ciliated band gene, and is
      activated independently of Nodal.
    supporting_text: These are the early oral ectoderm and later ciliated band genes hnf6 and
      otxβ1/2
  - statement: hnf6 is one of four early components producing the oral ectoderm regulatory
      state.
    supporting_text: 'there appear to be four early genetic components producing the initial
      zygotic transcriptional regulatory state in the specification of the oral ectoderm:
      the nodal independent hnf6, and otxβ1/2 genes; the nodal dependant gsc repressor, and
      the nodal dependant foxg activator.'
  - statement: hnf6 knockdown causes the aboral marker spec1 to spread over the whole
      ectoderm.
    supporting_text: knock-down of dri (Amore et al., 2003), of hnf6 (Otim et al., 2004),
      or of gsc (Angerer et al., 2001), all cause expression of spec1 to spread around the
      whole ectoderm
  - statement: From early gastrula, hnf6 expression resolves from the oral ectoderm to the
      trapezoidal ciliated band.
    supporting_text: From early gastrula stage onwards, genes initially expressed thoughout
      the oral ectoderm resolve to this trapezoidal band, i.e, the hnf6 (Otim et al., 2004),
      otxβ1/2 (Yuh et al., 2002), and foxg (Tu et al., 2006) genes
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Dev Biol 2009;329:410-21); full text cached. Oral/aboral ectoderm GRN
      model that incorporates the Otim et al. 2004 hnf6 perturbation data.
