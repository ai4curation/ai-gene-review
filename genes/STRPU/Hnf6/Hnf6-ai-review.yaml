  knowledge_gaps:
  - gap_statement: >-
      No direct target of Hnf6 has been defined at the cis-regulatory level in any of its
      three territories (PMC differentiation genes, oral ectoderm regulatory genes,
      ciliated band genes), so whether its inputs are direct and whether it acts purely
      as an activator is unknown.
    boundary: >-
      Morpholino loss-of-function establishes requirement for sm50/pm27/msp130, gatac and
      oral ectoderm maintenance, and GRN models place hnf6 as a driver of differentiation
      genes; no Hnf6 binding site has been functionally tested in a target module.
    gap_kind:
    - BIOLOGY
proposed_new_terms:
- proposed_name: ciliary band development
  proposed_definition: >-
    The process whose specific outcome is the progression of the ciliary band over time,
    from its formation to the mature structure. The ciliary band is a neurogenic band of
    ciliated ectodermal cells at the boundary of oral and aboral ectoderm in echinoderm
    and other deuterostome larvae, used for swimming and feeding.
  justification: >-
    hnf6/onecut is the canonical marker of the echinoderm ciliary band and is required for
    its normal formation, yet GO has no term for this larval structure; the closest
    available terms (nervous system development, epithelium development) do not capture
    it.
  proposed_parent:
    id: GO:0048856
    label: anatomical structure development
suggested_questions:
- question: >-
    Does Hnf6 bind directly to the cis-regulatory modules of sm50, pm27 or msp130, or is
    its "booster" input into the skeletogenic differentiation battery indirect?
- question: >-
    Which ciliated band genes depend on Hnf6, and does its ciliated band role reflect a
    conserved ONECUT function in neurogenic ectoderm shared with the chordate CNS
    expression of onecut genes?
suggested_experiments:
- hypothesis: Hnf6 is a direct activator of PMC biomineralization effector genes.
  description: >-
    Mutate predicted ONECUT (CUT/homeodomain) sites in the characterised sm50 and msp130
    cis-regulatory modules in reporter constructs and compare expression with wild-type
    constructs in normal and Hnf6-morpholino embryos; confirm occupancy by ChIP with an
    anti-Hnf6 antibody or tagged Hnf6 at mesenchyme blastula.
