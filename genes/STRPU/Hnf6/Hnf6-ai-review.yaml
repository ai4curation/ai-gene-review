  label: Strongylocentrotus purpuratus
description: >-
  Hnf6 (SpHnf6, also cloned as SpOnecut) is the single sea urchin member of the ONECUT
  class of homeodomain transcription factors, a 483-residue protein with one CUT domain
  and a C-terminal homeodomain, orthologous to vertebrate HNF6/ONECUT1. Its expression in
  the embryo is triphasic. It is transcribed maternally and its transcripts are distributed
  throughout the embryo before gastrulation; during this phase it acts in the skeletogenic
  (large micromere/primary mesenchyme cell) lineage as an early, ubiquitously present
  "booster" input into the biomineralization differentiation gene battery (sm50, pm27,
  msp130), without being required for any of the lineage-specifying PMC regulatory genes
  (alx1, ets1, pmar1, tbrain) or for early micromere signaling; it is also needed for
  expression of the mesodermal regulator gatac. After gastrulation it becomes an early,
  Nodal-independent component of the oral ectoderm gene regulatory network, where it is
  required to maintain the oral ectoderm regulatory state; in its absence the aboral
  marker spec1 spreads over the whole ectoderm. Finally its expression resolves to a
  trapezoidal band at the oral/aboral ectoderm boundary that exactly prefigures the
  neurogenic ciliated band, where it persists through the end of embryogenesis and where
  it is required for normal ciliated band formation. The ciliary-band phase of expression
  is conserved in the sea star AmHNF6, and ONECUT genes in other deuterostomes are
  expressed in the central nervous system.
