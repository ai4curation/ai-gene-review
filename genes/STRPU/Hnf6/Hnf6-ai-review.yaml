  review:
    summary: >-
      Hnf6 is a CUT + homeodomain (ONECUT-class) transcription factor. Morpholino knockdown
      abolishes activation of PMC differentiation genes (sm50, pm27, msp130) and of gatac,
      and prevents maintenance of the oral ectoderm regulatory state, showing that the
      protein functions as a transcriptional regulator of protein-coding (Pol II) genes.
      Direct binding to a target cis-regulatory module has not been shown, so the general
      factor term is proposed rather than the activator child.
