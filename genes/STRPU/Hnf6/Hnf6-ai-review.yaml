core_functions:
- description: >-
    Ubiquitously present early transcriptional activator ("booster") of the skeletogenic
    differentiation gene battery (sm50, pm27, msp130) in the primary mesenchyme cell
    lineage, acting alongside the lineage-specific regulators without itself specifying
    the lineage.
