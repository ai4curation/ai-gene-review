- id: PMID:7875376
  title: An orthodenticle-related protein from Strongylocentrotus purpuratus.
  findings:
  - statement: Discovery of the SpOtx cDNA (the Q26417 sequence); SpOtx binds TAATCC/T sites of spec2a in bandshifts.
    supporting_text: The S. purpuratus aboral ectoderm-specific Spec2a gene has several TAATCC/T sites in its control region, and we provide evidence, using bandshift analysis, that Spec2a may be target gene for SpOtx.
  - statement: Transcripts are initially ubiquitous then restricted to oral ectoderm and endoderm; protein is nuclear in all cells at blastula and pluteus.
    supporting_text: SpOtx transcripts were found initially in all cells of the cleaving embryo, but they gradually became restricted to oral ectoderm and endoderm cells. In contrast, SpOtx protein was found in nuclei of all cells at both blastula and pluteus stages.
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified; the Swiss-Prot RX reference for Q26417 (Gan et al., Dev Biol 1995). Abstract only in cache.
- id: PMID:9242422
  title: Two Otx proteins generated from multiple transcripts of a single gene in Strongylocentrotus purpuratus.
  findings:
  - statement: otx encodes alpha and beta forms by alternative splicing/promoter use, sharing homeodomain and C-terminus.
    supporting_text: SpOtx(alpha) and SpOtx(beta) had identical C-termini and homeoboxes but were entirely different in their N-terminal domains.
  - statement: The alpha form is ubiquitous during cleavage; the beta forms appear at mesenchyme blastula and become restricted to oral ectoderm and vegetal plate.
    supporting_text: three distinct SpOtx(beta) mRNAs resulted from two separate transcriptional initiation events, and these transcripts began to accumulate at mesenchyme blastula stage primarily in ectoderm and then later were largely restricted to oral ectoderm and vegetal plate territories.
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified (Li et al., Dev Biol 1997); source of the isoform nomenclature (alpha, beta1/2) used throughout the GRN literature. Abstract only in cache.
- id: PMID:8625836
  title: Altering cell fates in sea urchin embryos by overexpressing SpOtx, an orthodenticle-related protein.
  findings:
  - statement: SpOtx is cytoplasmic in early cleavage and enters nuclei at the 60-120-cell stage.
    supporting_text: SpOtx was found in the cytoplasm of early cleavage stage embryos and was translocated into nuclei between the 60- and 120-cell stage, coincident with Spec gene activation.
  - statement: N- and C-terminal transactivation domains; overexpression converts the embryo to aboral ectoderm.
    supporting_text: Eggs injected with SpOtx mRNA developed into epithelial balls of aboral ectoderm suggesting that SpOtx redirected nonaboral ectoderm cells to an aboral ectoderm fate.
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified (Mao et al., Development 1996); gain-of-function and transactivation-domain evidence. Abstract only in cache.
- id: PMID:10433832
  title: Requirement of SpOtx in cell fate decisions in the sea urchin embryo and possible role as a mediator of beta-catenin signaling.
  findings:
  - statement: Dominant-negative Engrailed-SpOtx blocks endoderm and aboral ectoderm formation.
    supporting_text: The Engrailed-SpOtx fusion protein reduced the expression of endoderm- and aboral ectoderm-specific genes and inhibited the formation of endoderm and aboral ectoderm cell types.
  - statement: SpOtx acts downstream of or parallel to nuclear beta-catenin and rescues aboral ectoderm but not endoderm in C-cadherin embryos.
    supporting_text: Coexpressing SpOtx with C-cadherin restored aboral ectoderm-specific gene expression and aboral ectoderm morphology, but with C-cadherin present, SpOtx was not sufficient for endoderm formation.
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified (Li, Wikramanayake, Klein, Dev Biol 1999); the loss-of-function evidence for the endoderm and ectoderm fate terms. Abstract only in cache.
- id: PMID:8952065
  title: 'Transient appearance of Strongylocentrotus purpuratus Otx in micromere nuclei: cytoplasmic retention of SpOtx possibly mediated through an alpha-actinin interaction.'
  findings:
  - statement: SpOtx is nuclear in 16-cell-stage micromeres only, and later in all cells; cytoplasmic retention is linked to alpha-actinin binding.
    supporting_text: SpOtx appears transiently in nuclei of micromeres but not in nuclei of mesomeres and macromeres. At later stages of development, SpOtx was translocated into nuclei of all cells.
  full_text_unavailable: true
  reference_review:
