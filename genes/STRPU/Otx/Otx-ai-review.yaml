id: Q26417
gene_symbol: Otx
aliases:
- otx
- SpOtx
- orthodenticle homolog
- otx-alpha
- otx-beta1/2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7668
  label: Strongylocentrotus purpuratus
description: >-
  Otx (SpOtx) is the single orthodenticle-class (paired/bicoid-type, K50)
  homeodomain transcription factor of the purple sea urchin. One gene produces
  an alpha form and several beta forms (otx-beta1/2) by alternative promoter use
  and splicing; the forms share the homeodomain and C-terminus but differ in
  their N-termini. Otx is supplied maternally, is transcribed in all cells of the
  cleaving embryo, and its transcripts later become restricted to endoderm, oral
  ectoderm and the ciliated band. The protein is initially held in the
  cytoplasm, entering micromere nuclei precociously at the 16-cell stage and the
  nuclei of all other cells around the 60-120-cell stage. Otx binds TAATCC/T
  motifs and acts as a transcriptional activator with N- and C-terminal
  transactivation domains. In the micromeres it cooperates with nuclear
  beta-catenin/Tcf to switch on pmar1. In the vegetal-plate endoderm the
  otx-beta1/2 cis-regulatory module integrates Gatae, Blimp1 (Krox) and Otx
  inputs as an AND gate, and Otx in turn directly activates blimp1b, gatae, foxa,
  brachyury and endo16, forming the positive feedback loops that lock down the
  endoderm regulatory state. In the ectoderm Otx activates the aboral-ectoderm
  differentiation gene spec2a through multiple Otx sites, and dominant-negative
  Engrailed-Otx blocks both endoderm and aboral ectoderm formation while Otx
  overexpression converts the embryo into aboral ectoderm.
