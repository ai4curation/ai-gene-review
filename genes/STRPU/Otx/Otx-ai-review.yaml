  - reference_id: PMID:19895806
    supporting_text: Another key function in the early endoderm regulatory network is provided by the homeodomain transcription factor Otx.
- description: >-
    Activation of ectodermal differentiation genes and specification of
    ectodermal (aboral ectoderm) fate. Otx binds multiple TAATCC/T sites in the
    spec2a RSR enhancer and activates it; Engrailed-Otx blocks aboral ectoderm
    formation, Otx overexpression converts the embryo into aboral ectoderm, and
    Otx restores aboral ectoderm in embryos lacking nuclear beta-catenin. The
    beta1/2 forms are also early oral ectoderm and ciliated band genes.
