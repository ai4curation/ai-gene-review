    summary: >-
      SpOtx is a sequence-specific activator. Its N- and C-terminal regions are
      transactivation domains in yeast, and the homeodomain plus both regions are
      required for the overexpression phenotype. Consensus Otx sites fused to a
      basal promoter are sufficient to activate reporter expression in all cell
