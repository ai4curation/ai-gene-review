- term:
    id: GO:0001714
    label: endodermal cell fate specification
  evidence_type: IMP
  original_reference_id: PMID:10433832
  qualifier: involved_in
  review:
    summary: >-
      A dominant-negative Engrailed-SpOtx fusion reduces endoderm-specific gene
      expression and blocks endoderm formation, and activated beta-catenin cannot
      bypass the block, placing Otx downstream of or parallel to nuclear
      beta-catenin in endoderm specification. In the GRN, the otx beta1/2
      transcription unit is a key endoderm node: it is driven by Gatae, Blimp1
      (Krox) and Otx, and Otx directly activates blimp1b, gatae, foxa, brachyury
      and endo16, forming the positive feedback loops that lock down the endoderm
      regulatory state. The beta1/2 forms are the isoforms expressed in the
      vegetal-plate endoderm; UniProt lists no isoform accessions so the isoform
      field is not populated.
    action: NEW
    reason: >-
      Otx itself performs regulatory steps of endoderm specification (direct
      activation of endoderm regulatory genes) rather than being merely required
      upstream; loss-of-function blocks endoderm formation. Comparable direct
      endoderm regulators (GATA4/6, Sox17 in vertebrates) carry this term.
    additional_reference_ids:
    - PMID:15110718
    - PMID:17570356
    - PMID:19895806
    supported_by:
    - reference_id: PMID:10433832
      supporting_text: We show here that the homeodomain transcription factor SpOtx is required for endoderm and aboral ectoderm formation during sea urchin embryogenesis.
    - reference_id: PMID:10433832
      supporting_text: The Engrailed-SpOtx fusion protein reduced the expression of endoderm- and aboral ectoderm-specific genes and inhibited the formation of endoderm and aboral ectoderm cell types.
    - reference_id: PMID:17570356
      supporting_text: These two genes cross-regulate, generating a positive feedback loop which serves to lock down the state of endoderm specification
    - reference_id: PMID:19895806
      supporting_text: Another key function in the early endoderm regulatory network is provided by the homeodomain transcription factor Otx.
- term:
    id: GO:0001715
    label: ectodermal cell fate specification
  evidence_type: IMP
  original_reference_id: PMID:10433832
  qualifier: involved_in
  review:
    summary: >-
      SpOtx is necessary and sufficient for the aboral ectoderm fate: the
      Engrailed-SpOtx repressor fusion inhibits aboral ectoderm formation and
      aboral-ectoderm gene expression; SpOtx mRNA injection converts the embryo
      into epithelial balls of aboral ectoderm; and SpOtx restores aboral
      ectoderm gene expression and morphology in C-cadherin embryos lacking
      nuclear beta-catenin. Mechanistically Otx activates the aboral-ectoderm
      differentiation gene spec2a through Otx sites, with spatial restriction
      supplied by repressors (Gsc, GataE) acting at neighbouring elements. Later
      GRN work also places otx-beta1/2 among the early nodal-independent oral
      ectoderm genes and the ciliated band, so the generic ectodermal
      specification term is used rather than an aboral-specific one.
    action: NEW
    reason: >-
      Necessity (dominant negative), sufficiency (overexpression, rescue) and a
      direct target (spec2a) are all shown for this gene product in the ectoderm.
    additional_reference_ids:
    - PMID:8625836
    - PMID:8088441
    - PMID:19268450
    supported_by:
    - reference_id: PMID:10433832
      supporting_text: Coexpressing SpOtx with C-cadherin restored aboral ectoderm-specific gene expression and aboral ectoderm morphology, but with C-cadherin present, SpOtx was not sufficient for endoderm formation.
    - reference_id: PMID:8625836
      supporting_text: Eggs injected with SpOtx mRNA developed into epithelial balls of aboral ectoderm suggesting that SpOtx redirected nonaboral ectoderm cells to an aboral ectoderm fate.
    - reference_id: PMID:19268450
      supporting_text: These are the early oral ectoderm and later ciliated band genes hnf6 and otxβ1/2
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IDA
  original_reference_id: PMID:8625836
  qualifier: located_in
  review:
    summary: >-
      Maternal SpOtx protein is cytoplasmic in early cleavage-stage blastomeres
      (except the 16-cell-stage micromeres) and is translocated into nuclei
      between the 60- and 120-cell stage. Cytoplasmic retention is proposed to
      be mediated by an interaction between a proline-rich SH3-binding-like
      region of SpOtx and alpha-actinin. This is a regulated, stage-specific
      location rather than the site of transcriptional activity.
    action: NEW
    reason: >-
      Directly observed by immunostaining in this species; records the
      developmentally regulated nuclear import that gates Otx activity. Non-core
      location.
    additional_reference_ids:
    - PMID:8952065
    supported_by:
    - reference_id: PMID:8625836
      supporting_text: SpOtx was found in the cytoplasm of early cleavage stage embryos and was translocated into nuclei between the 60- and 120-cell stage, coincident with Spec gene activation.
    - reference_id: PMID:8952065
      supporting_text: A yeast two-hybrid analysis showed a specific interaction between the proline-rich region of SpOtx and a putative SH3 domain of the sea urchin alpha-actinin.
