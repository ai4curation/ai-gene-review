knowledge_gaps:
- gap_statement: >-
    UniProt Q26417 carries no isoform accessions although the otx gene produces
    an alpha form and independently regulated beta1 and beta2 transcripts; it is
    not established which form Q26417 represents, and isoform-specific
    perturbation (the beta1/2 module drives the endoderm GRN role, the alpha
    form the early ubiquitous/micromere role) cannot be recorded in the isoform
    field.
  gap_kind:
  - BIOLOGY
  status: OPEN
  provenance:
  - reference_id: PMID:19895806
    supporting_text: The perturbation of Otx expression by morpholinos is complicated by the fact that otx is expressed in various splice isoforms (Li et al.
- gap_statement: >-
    Whether Otx binds the pmar1 cis-regulatory module directly, and whether Otx
    loss of function affects micromere specification, has not been shown; the
    Otx input to pmar1 rests on the GRN model and precocious micromere
    nuclearization.
  gap_kind:
  - BIOLOGY
  status: OPEN
  provenance:
  - reference_id: PMID:18413610
    supporting_text: The pmar1 genes are activated by the β-catenin/Tcf transcription complex plus Otx, i.e., by two of the micromere-specific inputs just enumerated ( 25 , 30 ).
suggested_questions:
- question: Which otx isoform (alpha, beta1 or beta2) does Swiss-Prot Q26417 correspond to, and should UniProt add isoform records so that isoform-specific annotations can be made?
- question: Does Otx bind the pmar1 cis-regulatory region directly, and does knockdown of the alpha form alone impair skeletogenic micromere specification?
- question: Is the aboral-ectoderm role of Otx (Klein lab, 1994-1999) carried by the alpha form while the beta1/2 forms act in oral ectoderm/ciliated band and endoderm, as the expression data suggest?
suggested_experiments:
- description: Isoform-specific perturbation with translation-blocking morpholinos against the unique alpha and beta N-terminal exons, followed by nanostring/QPCR of the endoderm (blimp1b, gatae, foxa, brachyury, endo16) and ectoderm (spec2a, hnf6, gsc) gene batteries.
  hypothesis: The beta1/2 forms carry the endoderm GRN feedback function whereas the alpha form carries the early micromere and aboral ectoderm functions.
- description: ChIP or DNA-affinity assays with tagged Otx on the pmar1, blimp1b, gatae, foxa and brachyury cis-regulatory modules, with mutation of candidate TAATCC/T sites in reporter constructs.
  hypothesis: Otx occupies TAATCC/T sites in these modules and its input is direct.
