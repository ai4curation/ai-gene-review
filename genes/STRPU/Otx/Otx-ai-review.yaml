core_functions:
- description: >-
    Sequence-specific transcriptional activation of endoderm regulatory genes in
    the endomesoderm gene regulatory network. Acting in the nucleus of
    vegetal-plate endoderm cells, Otx (chiefly the beta1/2 forms) binds TAATCC/T
    sites and, together with Gatae and Blimp1/Krox, drives its own beta1/2
    module and directly activates blimp1b, gatae, foxa, brachyury and endo16,
    forming the positive feedback loops that lock down the endoderm regulatory
    state; dominant-negative Engrailed-Otx blocks endoderm formation.
  molecular_function:
