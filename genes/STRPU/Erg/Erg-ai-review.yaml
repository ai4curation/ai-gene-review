- term:
    id: GO:0001710
    label: mesodermal cell fate commitment
  evidence_type: IMP
  original_reference_id: PMID:18413610
  qualifier: involved_in
  review:
    summary: Erg is a component of the dynamic state-stabilization subcircuit (erg-hex and hex-tgif positive
      feedback loops) that locks down the skeletogenic mesenchyme (primary mesenchyme cell) regulatory
      state after the transient initiating inputs from the double-negative gate have faded. Its outputs
      drive hex, feed multiple other nodes of the GRN and the differentiation genes, so Erg performs the
      regulatory step that commits the lineage rather than merely being required for it. It is expressed
      exclusively in mesenchyme cells and their progenitors during the relevant period.
    action: NEW
    reason: 'Participation test passed: Erg is a transcription factor whose activity maintains the lineage
      regulatory state; the commitment term (parent of specification and determination) is chosen because
      Erg acts after the specification genes alx1/ets1/tbr/tel and its documented role is stabilization/lockdown
      of the already-specified mesodermal fate. IMP from the morpholino/QPCR perturbation data.'
    supported_by:
    - reference_id: PMID:18413610
      supporting_text: These genes are engaged in interlocking positive double feedback loops ( erg with
        hex ; and hex with tgif ). Interference with expression of any of these genes severely depresses
        transcript levels of the others ( Fig. S3 ). Thus they dynamically stabilize all aspects of the
        regulatory state downstream of themselves.
    - reference_id: PMID:18413610
      supporting_text: The tgif-hex and erg-hex loops in the skeletogenic micromere GRN are canonical
        examples. Outputs of these genes not only serve as drivers for one another but also feed multiple
        other nodes of the GRN, so that their activity ensures the persistence of surrounding activities.
    - reference_id: PMID:16997294
      supporting_text: five of the nine sea urchin ets genes expressed during embryogenesis are exclusively
        (Sp-Ets1/2, Sp-Erg, Sp-Ese) or additionally (Sp-Tel, Sp-Pea) expressed in mesenchyme cells and/or
        their progenitors.
