id: Q6R7X7
gene_symbol: Erg
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7668
  label: Strongylocentrotus purpuratus
description: Erg is an ETS-family transcription factor of the ERG/FLI1 subfamily, with an N-terminal PNT
  (pointed/SAM) domain and a C-terminal ETS winged-helix DNA-binding domain. In the sea urchin embryo
  it is zygotically activated in the large micromere-derived skeletogenic mesenchyme lineage (the primary
  mesenchyme cells), immediately downstream of the lineage-founding regulators alx1, ets1, tbr and tel,
  together with the homeobox genes hex and tgif. Erg and Hex drive each other's transcription in an interlocking
  positive feedback loop (erg-hex, hex-tgif) that dynamically locks down the skeletogenic regulatory state
  once the transient initiating inputs have faded, and Erg is in turn a feed-forward driver, together
  with Alx1, Ets1, Tbr, Tel, Hex, FoxB and Dri, of the battery of differentiation genes that build the
  larval calcite endoskeleton. Knockdown of erg depresses transcripts of hex and of the downstream differentiation
  genes. Around the time the skeletogenic cells finish ingressing, erg is additionally switched on in
  the oral non-skeletogenic mesoderm, where it is confined by the aboral mesoderm regulators Gcm and GataE.
  In Lytechinus variegatus the erg ortholog is also required for the epithelial-mesenchymal transition
  of the skeletogenic cells, with Snail upstream and hex downstream of it.
