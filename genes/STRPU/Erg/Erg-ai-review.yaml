- id: PMID:18413610
  title: Global regulatory logic for specification of an embryonic cell lineage.
  findings:
  - statement: erg is activated immediately downstream of the four double-negative-gate targets (alx1,
      ets1, tbr, tel) together with hex and tgif; erg and hex form an interlocking positive feedback loop
      and knockdown of either depresses the other.
    supporting_text: These genes are engaged in interlocking positive double feedback loops ( erg with
      hex ; and hex with tgif ). Interference with expression of any of these genes severely depresses
      transcript levels of the others ( Fig. S3 ). Thus they dynamically stabilize all aspects of the
      regulatory state downstream of themselves.
  - statement: Erg is one of the drivers of the skeletogenic differentiation genes, serving as both an
      A and a B driver in the feed-forward subcircuits.
    supporting_text: The alx1 and erg genes play both roles, but the ets1 gene ( 9 ) is used in these
      gene batteries only as the A driver
  - statement: The erg-hex loop is a canonical dynamic state-lockdown circuit whose outputs also feed
      other GRN nodes.
    supporting_text: The tgif-hex and erg-hex loops in the skeletogenic micromere GRN are canonical examples.
      Outputs of these genes not only serve as drivers for one another but also feed multiple other nodes
      of the GRN, so that their activity ensures the persistence of surrounding activities.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached; the synthesis of the S. purpuratus skeletogenic micromere GRN with
      the erg morpholino/QPCR perturbation data (Fig. S3, Table S1). Primary source for all NEW rows.
- id: PMID:16997294
  title: Identification and developmental expression of the ets gene family in the sea urchin (Strongylocentrotus
    purpuratus).
  findings:
  - statement: Sp-Erg is one of 11 S. purpuratus ets genes and is expressed exclusively in mesenchyme
      cells and/or their progenitors during embryogenesis; it is not maternally expressed.
    supporting_text: five of the nine sea urchin ets genes expressed during embryogenesis are exclusively
      (Sp-Ets1/2, Sp-Erg, Sp-Ese) or additionally (Sp-Tel, Sp-Pea) expressed in mesenchyme cells and/or
      their progenitors.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified (Dev Biol 2006;300:35-48), abstract only cached. Same group (Arnone
      lab) that deposited the Q6R7X7 cDNA; establishes single-orthologue status and mesenchymal expression
      of Sp-Erg.
- id: PMID:23261933
  title: Diversification of oral and aboral mesodermal regulatory states in pregastrular sea urchin embryos.
  findings:
  - statement: After skeletogenic mesenchyme ingression, erg (with hex and ets1/2) is activated specifically
      in the oral non-skeletogenic mesoderm, and its NSM expression expands when the aboral regulators
      gcm or gataE are knocked down.
    supporting_text: At this time three genes that are first expressed in the SM, erg, hex, and ets1/2
      are activated specifically in the oral NSM (Fig. 1O–R).
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text cached; S. purpuratus WMISH and perturbation data on the second, later expression
      domain of erg. Expression-level only; no annotation proposed from it.
- id: PMID:24598159
  title: Sub-circuits of a gene regulatory network control a developmental epithelial-mesenchymal transition.
  findings:
  - statement: In Lytechinus variegatus, erg is one of the ten downstream PMC transcription factors required
      for EMT, and snail regulates erg while erg regulates hex.
    supporting_text: the 10 TFs downstream of those (tel, erg, hex, tgif, snail, twist, foxn2/3, dri,
      foxb, foxo) were also required for EMT.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text cached. Experiments in L. variegatus, so used only as corroboration of the
      erg -> hex linkage and as a lead for an EMT role; not used as the basis of an S. purpuratus annotation.
- id: PMID:11493577
  title: A large-scale analysis of mRNAs expressed by primary mesenchyme cells of the sea urchin embryo.
  findings:
  - statement: PMC EST project (the UniProt RX reference); the erg cDNA was recovered from this PMC-enriched
      EST collection, which identified transcription factors among PMC-expressed mRNAs.
    supporting_text: The collection of newly identified proteins includes many candidate regulators of
      primary mesenchyme morphogenesis, including PMC-specific extracellular matrix proteins, cell surface
      proteins, spicule matrix proteins and transcription factors.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Cited on the UniProt record as the sequence source; abstract only cached and it does
      not discuss erg specifically. Background/provenance only.
- id: PMID:1457815
  title: The sea urchin erg homolog defines a highly conserved erg-specific domain.
  findings:
  - statement: A Lytechinus variegatus genomic fragment of the erg homologue showed that, beyond the ETS
      domain, the protein shares an ERG/Fli-1-specific conserved region.
    supporting_text: the remainder of the sequence is only homologous with the human ERG and murine Fli-1
      genes. This latter region, designated R, represents a highly conserved erg-specific domain.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Early L. variegatus sequence note; supports subfamily assignment (ERG/FLI1) only.
aliases:
- Sp-Erg
- erg
- SpErg
core_functions:
- description: ETS-domain sequence-specific transcription factor that, in the skeletogenic mesenchyme
    (primary mesenchyme cell) lineage, forms a positive feedback loop with Hex to lock down the lineage
    regulatory state and acts as a feed-forward driver of the skeletogenic differentiation (biomineralization)
    gene battery.
  molecular_function:
    id: GO:0000981
    label: DNA-binding transcription factor activity, RNA polymerase II-specific
  directly_involved_in:
  - id: GO:0045944
    label: positive regulation of transcription by RNA polymerase II
  - id: GO:0001710
    label: mesodermal cell fate commitment
  - id: GO:0070169
    label: positive regulation of biomineral tissue development
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:18413610
    supporting_text: These genes are engaged in interlocking positive double feedback loops ( erg with
      hex ; and hex with tgif ). Interference with expression of any of these genes severely depresses
      transcript levels of the others ( Fig. S3 ). Thus they dynamically stabilize all aspects of the
      regulatory state downstream of themselves.
  - reference_id: PMID:18413610
    supporting_text: these differentiation genes require as drivers products of all of the now familiar
      components of the skeletogenic regulatory state ( alx1 , ets1 , tbr , tel , erg , hex , foxb , dri
      )
  - reference_id: PMID:16997294
    supporting_text: five of the nine sea urchin ets genes expressed during embryogenesis are exclusively
      (Sp-Ets1/2, Sp-Erg, Sp-Ese) or additionally (Sp-Tel, Sp-Pea) expressed in mesenchyme cells and/or
      their progenitors.
  knowledge_gaps:
  - gap_statement: No direct evidence (cis-regulatory module analysis, ChIP or EMSA) that Erg binds and
      activates hex or any differentiation-gene module in S. purpuratus; all Sp evidence is morpholino/QPCR
      perturbation, and the morphological consequence of erg knockdown (skeleton phenotype, ingression)
      is not documented in the cached literature.
    boundary: The erg-hex positive feedback and the requirement of erg for differentiation-gene transcript
      levels are established by perturbation; the erg -> hex link is independently seen in L. variegatus,
      where erg is also required for EMT.
    gap_kind:
    - BIOLOGY
suggested_questions:
- question: Is Erg a direct activator of hex and of the skeletogenic differentiation genes (which would
    justify GO:0001228 / GO:0000978 with IDA), or does it act through intermediates? A cis-regulatory
    dissection of the hex or an Erg-dependent differentiation-gene module has not been reported for S.
    purpuratus.
- question: Does erg knockdown in S. purpuratus produce the ingression (EMT) defect reported for L. variegatus
    erg morphants, and what is the skeletal phenotype? This would determine whether a positive regulation
    of epithelial to mesenchymal transition annotation is warranted for the S. purpuratus gene product.
- question: What is the function of the later oral non-skeletogenic mesoderm expression of erg (with hex
    and ets1/2), and does the same erg-hex loop operate there?
suggested_experiments:
- description: ChIP-qPCR/ChIP-seq of tagged Sp-Erg in primary mesenchyme cells, combined with GFP reporter
    analysis of the hex cis-regulatory region with mutated ETS (GGAA/T) sites, to test direct Erg input
    into hex and the differentiation genes.
- description: Time-lapse imaging of ingression and skeletal spicule formation after erg morpholino knockdown
    in S. purpuratus, with hex and biomineralization-gene QPCR at matched time points.
