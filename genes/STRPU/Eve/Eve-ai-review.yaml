- id: PMID:12027439
  title: New early zygotic regulators expressed in endomesoderm of sea urchin embryos
    discovered by differential array hybridization.
  findings:
  - statement: Speve was discovered as a beta-catenin-dependent zygotic even-skipped orthologue expressed
      early in all vegetal blastomeres and later shifting to veg1 derivatives.
    supporting_text: Speve, an evenskipped orthologue expressed very early in all vegetal blastomeres and
      then gradually shifting to veg(1) derivatives by the mesenchyme blastula stage
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The UniProt entry's own RX citation (mRNA AF517551/AAM53251); the discovery paper of Speve
      in the differential macroarray screen for cadherin-sensitive endomesoderm regulators. Abstract only
      in cache; PubMed-verified.
- id: PMID:18061160
  title: A spatially dynamic cohort of regulatory genes in the endomesodermal gene network of the sea urchin
    embryo.
  findings:
  - statement: The eve cis-regulatory module is activated by beta-catenin/Tcf and Blimp1, and repressed by
      Hox11/13b within the torus and by Tcf outside it.
    supporting_text: 'We verify the cis-regulatory inputs of even-skipped predicted by network analysis. These
      include activation by β-catenin/Tcf and Blimp1, repression within the torus by Hox11/13b, and repression
      outside the torus by Tcf in the absence of Wnt8 signal input.'
    finding_review:
      finding_status: DISPUTED
      superseded_by:
      - PMID:19895806
      review_notes: The Blimp1-site mutation reduced Eve-GFP expression, but the later systematic
        perturbation analysis found no effect of blimp1 MASO on endogenous eve transcript levels, and the
        blimp1b (veg2) and eve (veg1) expression domains do not overlap at 18 h; the Blimp1 input was
        therefore dropped from the endoderm GRN. The Tcf and Hox11/13b inputs are not disputed.
      supported_by:
      - reference_id: PMID:19895806
        supporting_text: our current perturbation experiments show that blimp1 MASO has no effect at all
          on eve transcript levels (Fig. S2)
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached. Smith, Kurokawa & Davidson 2008. Expression time course of eve (vegetal
      plate from 6th cleavage, veg2 then veg1), BAC-GFP knock-in and 2.5 kb Eve-GFP reporter with site
      mutations for Tcf, Blimp1 and Hox sites, and hox11/13b MASO showing de-repression of eve.
- id: PMID:19895806
  title: The endoderm gene regulatory network in sea urchin embryos up to mid-blastula stage.
  findings:
  - statement: Up to 18 h the only perturbation that changes eve expression is eve MASO itself, showing
      autorepression; eve MASO affects no other gene analyzed.
    supporting_text: The only perturbation resulting in a change of eve expression levels was injection
      of eve MASO itself.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached. Peter & Davidson 2010. Systematic MASO perturbation of the early
      endoderm GRN; establishes eve autorepression, its restriction to veg1 by 15 h, and the absence
      of other eve targets before 18 h. Corrects the Blimp1-eve link of PMID:18061160.
- id: PMID:21623371
  title: A gene regulatory network controlling the embryonic specification of endoderm.
  findings:
  - statement: Eve activates hox11/13b in veg1 descendants from 24 h, spatially activating the veg1
      endoderm GRN that specifies hindgut fate.
    supporting_text: Hox11/13b expression is activated by Eve in descendants of veg1 cells at 24 h, because
      injection of eve MASO reduces hox11/13b expression only after 24 h (Fig. 3b).
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached. Peter & Davidson 2011 Nature. The complete endoderm GRN to 30 h; Eve is
      the spatial activator of the veg1 (hindgut) endoderm GRN, its assembly being timed by a veg2-derived
      signal (V1), and Eve controls a second predicted signal (V2) to veg2.
- id: PMID:25385617
  title: Specific functions of the Wnt signaling system in gene regulatory networks throughout the early
    sea urchin embryo.
  findings:
  - statement: Eve MASO decreases wnt1, wnt4, wnt5 and wnt16; Eve represses animal-ectoderm genes in veg1
      cells and activates wnt4, thereby driving veg1 ectoderm specification.
    supporting_text: 'Thus Eve plays a dual role in the specification of veg1 ectoderm: It directly represses
      genes of the animal ectoderm in these cells, and it activates the expression of wnt4 in veg1 endoderm
      and veg1 ectoderm, leading to the activation of genes of the veg1 ectodermal GRN.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached. Cui, Siriwon, Li, Davidson & Peter 2014 PNAS. Wnt-pathway perturbations
      (C59, Wnt1/Wnt16 MASO) and eve MASO; places Eve as the pan-veg1 factor upstream of the veg1 wnt genes
      and of both the veg1 endoderm and veg1 ectoderm regulatory states.
- id: PMID:25655703
  title: Geometric control of ciliated band regulatory states in the sea urchin embryo.
  findings:
  - statement: Eve excludes fgf9 and myc from the veg1 ectoderm subdomains of the ciliated band.
    supporting_text: fgf9 expression is excluded from subdomains 3 and 4 (Veg1 ectoderm) by Eve.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text cached. Barsi, Li & Davidson 2015. Adds specific repressive targets of Eve
      (fgf9, myc) in the veg1 ectoderm portion of the ciliated band, by eve MASO.
- id: PMID:33484703
  title: microRNA-31 regulates skeletogenesis by direct suppression of Eve and Wnt1.
  findings:
  - statement: eve is a direct target of miR-31; removing miR-31 suppression or overexpressing Eve causes
      PMC patterning and skeletogenic defects.
    supporting_text: Removal of miR-31 suppression of Eve and overexpression of Eve result in skeletogenic
      and PMC patterning defects.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text cached. Sampilo et al. 2021 eLife. Post-transcriptional control of eve by
      miR-31; the skeletal phenotype is indirect (via Vegf3 and Wnt1) and is not annotated here.
