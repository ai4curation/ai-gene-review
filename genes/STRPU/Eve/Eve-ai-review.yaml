status: COMPLETE
description: 'Sp-Eve (Speve, even-skipped) is the purple sea urchin orthologue of the even-skipped class of
  homeodomain transcription factors (297 aa, homeodomain at residues 143-203). It is one of the earliest
  zygotic regulatory genes of the vegetal half of the embryo: transcription begins in the vegetal plate at
  sixth cleavage across the macromere (veg1 and veg2) descendants, runs at the leading edge of the outward
  expanding wave of Wnt8/beta-catenin-Tcf-dependent expression, and by 15 h after fertilization is confined
  to the veg1 lineage, the precursor of veg1 (hindgut) endoderm and veg1 ectoderm. Its cis-regulatory module
  is activated by beta-catenin/Tcf, repressed by Tcf/Groucho outside the Wnt8 range, and repressed in veg2
  cells by Hox11/13b; eve also represses its own gene, which clears its expression from veg2 endoderm. Up to
  about 18 h Eve has no detectable target other than itself, but from 21-24 h it activates the regulatory
  genes of the veg1 endoderm gene regulatory network (hox11/13b, and through it brachyury and hnf1) that
  specify future hindgut fate, and it activates wnt1, wnt4, wnt5 and wnt16 in veg1 cells while repressing
  animal-ectoderm genes (e.g. fgf9, myc) there, thereby also establishing the veg1 ectoderm regulatory state.
  Later in development eve mRNA is a direct target of miR-31, and de-repression or overexpression of Eve
  disturbs skeletogenic mesenchyme patterning.'
