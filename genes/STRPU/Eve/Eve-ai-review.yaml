suggested_questions:
- question: Does Sp-Eve bind the hox11/13b, wnt4 or eve cis-regulatory modules directly? All Eve outputs rest
    on morpholino perturbation within the GRN framework; no Eve target site has been mutated and no EMSA or
    ChIP has been reported for the sea urchin protein.
- question: Is the Blimp1 input into the eve cis-regulatory module (site mutation reduced Eve-GFP to 14% of
    control) a reporter artefact, given that blimp1 MASO does not change endogenous eve transcript levels
    and the two expression domains do not overlap at 18 h?
- question: Should Eve's control of the veg1 wnt ligand genes be represented as regulation of Wnt signaling,
    or (as here) only as transcriptional regulation with the wnt genes as inputs? Eve acts one transcriptional
    step upstream of the ligands.
suggested_experiments:
- description: Mutagenesis of candidate Eve (TAAT-core homeodomain) sites in the hox11/13b and wnt4 cis-regulatory
    modules in BAC-GFP reporters, and EMSA/ChIP-qPCR with the Sp-Eve homeodomain, to convert the IMP
    activator links into direct cis-regulatory evidence.
- description: Autorepression site mapping in the eve cis-regulatory module (Eve-site mutation in the 2.5 kb
    Eve-GFP construct), to test whether veg2 clearance of eve is a direct cis effect.
- description: Immunolocalization or Eve-GFP fusion to document nuclear localization and protein persistence
    relative to the veg2-to-veg1 shift of eve transcription.
knowledge_gaps:
- gap_statement: The nature of the Eve-dependent signal V2 to veg2 endoderm and the mechanism by which Eve
    restricts animal-ectoderm gene expression in veg1 ectoderm remain undefined.
