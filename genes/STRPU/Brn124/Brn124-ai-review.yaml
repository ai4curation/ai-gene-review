taxon:
  id: NCBITaxon:7668
  label: Strongylocentrotus purpuratus
description: 'Sp-Brn1/2/4 is the single class III POU-domain (Brn1/Brn2/Brn4/Oct6-related)
  homeodomain transcription factor of the purple sea urchin, with a POU-specific domain and a
  homeodomain that together confer sequence-specific DNA binding. It was cloned as the predicted
  gut-specific regulator of the endoderm differentiation gene endo16: zygotic brn1/2/4
  transcription begins at low level in the 20-h blastula endoderm, rises abruptly about ten-fold
  as gastrulation starts, and is confined to the gut endoderm (described as midgut by Yuh et al.
  and as foregut by later fluorescent in situ hybridization), coincident with endo16. In the
  endoderm gene regulatory network it is activated in veg2-derived anterior endoderm cells by
  Blimp1 in the last hours before gastrulation, downstream of the post-gastrular gut
  specification genes, and it drives the late, high-rate phase of endo16 transcription through
  endo16 cis-regulatory Module B; blocking its translation abolishes Module B-driven expression
  while leaving Module A intact. Predicted Brn1/2/4 sites also occur in the midgut/hindgut
  cis-regulatory module of blimp1/krox1a. Independently of its gut role, Brn1/2/4 is expressed
  in scattered ectodermal neural precursors under SoxC control, is required for the
  differentiation of serotonergic and all synaptotagmin B-expressing neurons, and at low dose
  its misexpression produces excess neurons, placing it as a neurogenic regulator downstream of
  SoxC, a role shared with its vertebrate class III POU relatives.'
