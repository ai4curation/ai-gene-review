- term:
    id: GO:0045944
    label: positive regulation of transcription by RNA polymerase II
  evidence_type: IMP
  original_reference_id: PMID:15893979
  qualifier: involved_in
  review:
    summary: Brn1/2/4 positively regulates transcription of the endoderm differentiation gene
      endo16 in the gut. Knockdown abolishes the late phase of endo16 transcription and the
      output of cis-regulatory Module B; each endo16 gene produces about one mRNA every two
