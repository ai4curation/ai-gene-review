        endo16, while not affecting Module A, also as predicted.
    - reference_id: PMID:15893979
      supporting_text: The kinetics of accumulation of these transcripts indicates that the
        switch into the late phase of endo16 expression occurs when the brn1/2/4 transcript
        level nears its plateau (2000 molecules mRNA per embryo), after which each endo16 gene
        produces about 1 mRNA every 2 min (about 380 molecules mRNA per min in the whole
        embryo).
- term:
    id: GO:0048565
    label: digestive tract development
  evidence_type: IMP
  original_reference_id: PMID:15893979
  qualifier: involved_in
  review:
    summary: Brn1/2/4 is a gut-endoderm regulatory gene activated in veg2-derived anterior
      endoderm by Blimp1 in the last hours before gastrulation, downstream of the genes
      executing post-gastrular specification of the midgut, and it drives the gut
      differentiation gene endo16. Its endodermal expression is gut-restricted (midgut per Yuh
      et al.; foregut per later FISH), so the broad digestive tract development term is used
      rather than a midgut- or foregut-specific one.
    action: NEW
    reason: The transcription factor performs a regulatory step of gut differentiation
      (activation of endo16) rather than being merely required for it, and its expression and
      network inputs are confined to the forming gut; the organ-level term is chosen because the
      cached literature disagrees on the gut subregion.
    supported_by:
    - reference_id: PMID:15893979
      supporting_text: The brn1/2/4 gene lies downstream of the regulatory genes executing
        post-gastrular specification of the midgut, as shown by further gene expression
        perturbation experiments which provide an initial glimpse of the underlying network
        architecture.
    - reference_id: PMID:15893979
      supporting_text: As predicted by the endo16 model, brn1/2/4 expression is confined
        perfectly to the midgut, coincident with the domain of endo16 expression.
    - reference_id: PMID:21623371
      supporting_text: Blimp1 then activates brn1/2/4 and tgif expression (Fig. 1f).
    - reference_id: PMID:19250980
      supporting_text: Endodermal expression of this gene is restricted to the foregut.
- term:
    id: GO:0045666
    label: positive regulation of neuron differentiation
  evidence_type: IMP
  original_reference_id: PMID:26657764
  qualifier: involved_in
  review:
    summary: Independently of its endodermal role, Brn1/2/4 acts downstream of SoxC in the
      neurogenic regulatory pathway. It is expressed in scattered ectodermal neural precursors
      in a SoxC-dependent manner (foregut expression is SoxC-independent), morpholino knockdown
      prevents the development of serotonergic and all synaptotagmin B-expressing neurons, and
      low-dose misexpression produces excess serotonergic neurons. This is the role of its
      vertebrate class III POU relatives (Brn1, Brn2, Brn4).
    action: NEW
    reason: Both loss-of-function (no differentiated neurons) and gain-of-function (excess
      neurons at low dose) for a transcription factor that sits in the neurogenic pathway
      between SoxC and terminal differentiation genes support a positive regulatory role in
      neuron differentiation. Non-endodermal and therefore a second, separate core function.
    supported_by:
    - reference_id: PMID:26657764
      supporting_text: Using a combination of molecular screens and tests of gene function by
        morpholino-mediated knockdown, we identified SoxC and Brn1/2/4 , which function
        sequentially in the neurogenic regulatory pathway and are also required for the
        differentiation of all neurons.
    - reference_id: PMID:26657764
      supporting_text: We conclude that Brn1/2/4 is required for the development of serotonergic
        and all SynB -expressing neurons and can directly or indirectly drive the production of
        excess neurons at low dose
    - reference_id: PMID:26657764
      supporting_text: 'in SoxC morphants, labeling of individual ectoderm cells for Brn1/2/4
        transcripts was dramatically reduced, whereas expression in the foregut was not
        detectably affected'
