- id: PMID:15893979
  title: Brn1/2/4, the predicted midgut regulator of the endo16 gene of the sea urchin
    embryo.
  findings:
  - statement: Sp-Brn1/2/4 is a POU domain factor closely related to mammalian Brain-1, -2 and
      -4, cloned as the predicted midgut regulator of endo16.
    supporting_text: 'The cDNA sequence reveals it to be a POU domain factor related closely to
      the mammalian factors Brain-1, -2, and -4.'
  - statement: Zygotic activation at 20 h at about 100 molecules per embryo, then an abrupt
      ten-fold increase at the start of gastrulation; expression confined to the gut (midgut)
      coincident with endo16.
    supporting_text: the gene is first activated in the 20-h blastula, but there remain only
      about 100 molecules of brn1/2/4 mRNA per embryo (only a few per endoderm cell) until an
      abrupt 10-fold increase occurs as gastrulation begins.
  - statement: Morpholino knockdown blocks the late phase of endo16 expression and specifically
      abolishes Module B-driven expression, not Module A.
    supporting_text: Arrest of Brn1/2/4 translation by MASO treatment blocks the late phase of
      endo16 expression and specifically abolishes expression of cis-regulatory Module B of
      endo16, while not affecting Module A, also as predicted.
  - statement: brn1/2/4 lies downstream of the regulatory genes executing post-gastrular midgut
      specification.
    supporting_text: The brn1/2/4 gene lies downstream of the regulatory genes executing
      post-gastrular specification of the midgut, as shown by further gene expression
      perturbation experiments which provide an initial glimpse of the underlying network
      architecture.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary cloning and functional paper for Sp-Brn1/2/4 (Yuh, Dorman and Davidson
      2005, Dev Biol). PMID found by eutils title search; abstract only in cache, so the
      perturbation details that define its upstream inputs are not quotable here.
- id: PMID:21623371
  title: A gene regulatory network controlling the embryonic specification of endoderm.
  findings:
  - statement: brn1/2/4 is activated in veg2-derived (anterior endoderm) cells in the final hours
      before gastrulation, by 27 h.
    supporting_text: 'A few additional regulatory genes are activated in the final hours before
      gastrulation: brn1/2/4, gatae, dac and tgif are expressed in veg2-derived cells and hnf1
      is expressed in the veg1 endoderm domain by 27 h after fertilization.'
  - statement: Blimp1 activates brn1/2/4 in veg2 endoderm; the veg1 regulator Eve affects it only
      indirectly through a proposed signal.
    supporting_text: Blimp1 then activates brn1/2/4 and tgif expression (Fig. 1f).
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full-text Peter and Davidson 2011 Nature endoderm GRN; places brn1/2/4 as a late
      veg2 endoderm node under Blimp1. The cached text does not spell out brn1/2/4 outputs, so
      none are asserted from it.
- id: PMID:16798107
  title: Regulation of spblimp1/krox1a, an alternatively transcribed isoform expressed
    in midgut and hindgut of the sea urchin gastrula.
  findings:
  - statement: The midgut/hindgut cis-regulatory module of blimp1/krox1a contains predicted
      Brn1/2/4 binding sites.
    supporting_text: 'Its sequence contains binding sites for Brn1/2/4, Otx, and Blimp1/Krox
      itself, as predicted in a prior regulatory network analysis.'
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract only; supports predicted Brn1/2/4 sites in a second gut cis-regulatory
      module but the sites were not functionally tested in the abstract.
- id: PMID:19250980
  title: Fluorescent in situ hybridization reveals multiple expression domains for SpBrn1/2/4
    and identifies a unique ectodermal cell type that co-expresses the ParaHox gene
    SpLox.
  findings:
  - statement: By FISH, endodermal SpBrn1/2/4 expression is restricted to the foregut, with
      additional domains in stomodeal ectoderm and scattered ciliary band cells, some
      co-expressing SpLox.
    supporting_text: 'Endodermal expression of this gene is restricted to the foregut. SpBrn1/2/4
      is also expressed in two distinct ectodermal domains: throughout the stomodeal ectoderm,
      and within cells scattered throughout the ciliated band.'
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract only. Expression-only study; its foregut assignment conflicts with the
      midgut description of Yuh et al. 2005 and is recorded as an open question.
- id: PMID:26657764
  title: Neurogenic gene regulatory pathways in the sea urchin embryo.
  findings:
  - statement: Brn1/2/4 acts downstream of SoxC in the neurogenic regulatory pathway and is
