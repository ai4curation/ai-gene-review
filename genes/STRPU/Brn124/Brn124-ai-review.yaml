suggested_questions:
- question: Is the endodermal expression domain of brn1/2/4 the midgut (Yuh et al. 2005, WMISH
    and endo16 coincidence) or the foregut (Cole and Arnone 2009, FISH)? The answer decides
    whether a midgut development or foregut-specific term should replace the organ-level
    digestive tract development annotation.
- question: Which endoderm GRN genes does Brn1/2/4 regulate besides endo16? Perturbation data in
    Peter and Davidson 2011 (Fig. 4 and supplementary tables) may define outputs such as
    gatae or foxa, but the cached text does not state them, so no such linkages were annotated.
- question: Is the Brn1/2/4 input into endo16 Module B direct (site mutation in Module B) or
    mediated by another Module B factor? The morpholino result is module-specific, consistent
    with the predicted site, but a Module B site mutation was not quotable from the abstract.
suggested_experiments:
- description: Mutate the predicted Brn1/2/4 site in endo16 Module B in a GFP reporter and
    compare with the Brn1/2/4 morpholino phenotype to show direct activation.
  experiment_type: cis-regulatory analysis
- description: Double FISH of brn1/2/4 with foregut (foxa) and midgut (endo16, blimp1/krox1a)
    markers at gastrula and prism stages to settle the midgut versus foregut discrepancy.
  experiment_type: expression analysis
- description: Brn1/2/4 morpholino followed by NanoString or RNA-seq of the endoderm regulatory
    gene set at 27-48 h to define its outputs in the gut GRN and separate them from its neural
    targets.
  experiment_type: perturbation transcriptomics
