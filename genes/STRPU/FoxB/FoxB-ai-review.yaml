suggested_questions:
- question: Which skeletogenic differentiation genes are direct FoxB targets? Oliveri et al. 2008 list
    foxb among the required drivers, but no FoxB binding site has been validated by cis-regulatory mutagenesis,
    and the PMC CRM atlases (Shashikant et al. 2018) do not report a FoxB motif.
- question: Is the Lytechinus variegatus finding that foxb is required for the apical-constriction step
    of primary mesenchyme cell EMT reproducible in S. purpuratus? If so, GO:0010718 (positive regulation
    of epithelial to mesenchymal transition), already proposed for alx1 and ets1, would also apply to
    Sp-FoxB.
- question: What are the later, non-skeletogenic expression domains of Sp-FoxB (Minokawa et al. 2004;
    Tu et al. 2006) and do they reflect separate regulatory functions, e.g. in the oral ectoderm or gut,
    as the Wnt/hedgehog-responsive promoter sites proposed in 1999 might suggest?
suggested_experiments:
- description: Morpholino knockdown of Sp-foxb followed by NanoString/QPCR of the biomineralization battery
    (msp130, sm50, sm30, p16, p19, cyp1) and whole-embryo skeletal phenotyping at 48 h, to quantify which
    differentiation genes depend on FoxB in S. purpuratus and whether a skeleton-minus or ingression-defective
    phenotype results.
- description: EMSA or CUT&RUN with tagged Sp-FoxB on the msp130 and msp103L cis-regulatory modules, to
    test whether the feed-forward Ets1/Alx1/FoxB wiring involves direct FoxB occupancy of effector-gene
    CRMs.
