core_functions:
- description: Sequence-specific DNA-binding transcription factor of the skeletogenic (primary mesenchyme)
    lineage, activated by Tbr and Alx1 in the late tier of the skeletogenic GRN, whose product helps drive
    transcription of the biomineralization differentiation gene batteries that build the larval skeleton.
  supported_by:
  - reference_id: PMID:18413610
    supporting_text: The tbr and alx1 genes also provide inputs into the additional skeletogenic differentiation
      genes dri and foxb.
  - reference_id: PMID:18413610
    supporting_text: these differentiation genes require as drivers products of all of the now familiar
      components of the skeletogenic regulatory state ( alx1 , ets1 , tbr , tel , erg , hex , foxb , dri
      ) and in addition a factor that is at this stage ubiquitously present, Hnf6 ( 42 ).
  - reference_id: PMID:10433970
    supporting_text: Spfkh1 is transcribed in one open reading frame that contains the DNA binding domain,
      nuclear localization signal and transactivation domain.
