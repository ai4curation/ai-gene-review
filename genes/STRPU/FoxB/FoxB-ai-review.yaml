gene_symbol: FoxB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7668
  label: Strongylocentrotus purpuratus
description: 'Sp-FoxB (originally cloned as Spfkh1) is the purple sea urchin forkhead box B class transcription
  factor: a 360-residue, basic (pI 9.96) protein with an N-terminal winged-helix Fork-head DNA-binding
  domain, a nuclear localization signal and a transactivation region. It is a regulatory gene of the skeletogenic
  micromere / primary mesenchyme cell lineage, activated in the late tier of the skeletogenic gene regulatory
  network by inputs from the double-negative-gate outputs Tbr and Alx1 (in an Ets1-Alx1 feed-forward arrangement),
  alongside dri and foxo. Together with Alx1, Ets1, Tbr, Tel, Erg, Hex and Dri its product is required
  as a driver of the skeletogenic differentiation gene batteries that build the larval biomineral skeleton,
  and in Lytechinus the orthologue is required for the apical-constriction step of primary mesenchyme
  cell epithelial-mesenchymal transition. Additional, later expression domains outside the skeletogenic
  lineage have been reported, and its upstream cis-regulatory region shows signatures of directional selection
  in natural populations.'
