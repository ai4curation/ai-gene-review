- term:
    id: GO:0001837
    label: epithelial to mesenchymal transition
  evidence_type: ISS
  original_reference_id: PMID:17287249
  qualifier: involved_in
  review:
    summary: Snail is the transcription factor that executes the de-adhesion step of PMC ingression, the
      classic EMT of the sea urchin embryo. Morpholino knockdown and chimera experiments in L. variegatus
      show it is required in micromeres for PMC ingression; it represses cadherin transcription and is
      needed for cadherin endocytosis; snail/twist morphant PMCs make the laminin hole, move toward the
      blastocoel and constrict apically but fail to de-adhere and complete EMT. Participation test passed
      because Snail itself performs the regulatory step (silencing cadherin) rather than merely being
      upstream. Comparator check passed because human SNAI1 carries GO:0001837 and GO:0010718 and the
      Snail family is the canonical EMT driver. Caveats for S. purpuratus are that the functional data
      are from L. variegatus, that Sp-sna is expressed at low levels before gastrulation, and that its
      PMC enrichment and response to Alx1 knockdown differ between Barsi et al. 2014 and Rafiq et al.
      2014; hence ISS, not IMP.
    action: NEW
    reason: 'Snail is the direct repressor of cadherin in the PMC de-adhesion sub-circuit and is required
      for ingression; this is the core process of the gene product in the sea urchin embryo. Evidence
      is orthology-transferred from L. variegatus. Term choice note: Snail in this directory carries the
      executional term GO:0001837 epithelial to mesenchymal transition because it directly silences cadherin,
      whereas Twist and FoxN2/3 carry the regulatory term GO:0010718 because their inputs into the de-adhesion
      sub-circuit are indirect.'
    supported_by:
    - reference_id: PMID:17287249
      supporting_text: Functional knockdown analyses of Snail in whole embryos and chimeras demonstrate
        that Snail is required in micromeres for PMC ingression.
    - reference_id: PMID:17287249
      supporting_text: Furthermore, Snail expression is required for endocytosis of cadherin, a cellular
        activity that accompanies PMC ingression.
    - reference_id: PMID:24598159
      supporting_text: Our analysis of both snail and twist knockdowns showed a failure of PMCs to complete
        EMT in spite of four other successful cell state changes
    - reference_id: PMID:24598159
      supporting_text: In L. variegatus , alx1, twist and snail constitute a functional sub-circuit in
        the GRN that controls the repression and endocytosis of cadherin required for de-adhesion ( Wu
        and McClay, 2007 ; Wu et al., 2008 )
    - reference_id: PMID:30264451
      supporting_text: Wu and McClay (2007), working with Lytechinus variegatus, provided evidence that
        this regulatory gene acts downstream of alx1 to regulate PMC ingression.
