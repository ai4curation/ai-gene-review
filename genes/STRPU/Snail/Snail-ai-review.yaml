taxon:
  id: NCBITaxon:7668
  label: Strongylocentrotus purpuratus
description: Snail is the sea urchin orthologue of the Snail/Slug family of C2H2 zinc-finger transcriptional
  repressors, a 341-residue protein with five C-terminal zinc fingers and an N-terminal basic region,
  encoded by a single gene in the Strongylocentrotus purpuratus genome (Sp-sna). Snail-family factors
  bind E-box-type cis-regulatory sequences and repress transcription, their best-known target across animals
  being the epithelial cadherin gene, and they are the canonical drivers of the de-adhesion step of epithelial-mesenchymal
  transition (EMT). In the sea urchin embryo snail is transcribed in the skeletogenic primary mesenchyme
  cell (PMC) lineage immediately before these cells ingress from the vegetal plate epithelium, downstream
  of pmar1 and alx1, and it is shut off in the PMCs shortly after ingression; later a snail homologue
  is expressed transiently in subsets of non-skeletogenic mesenchyme and in the ciliated band. Functional
  work, done in Lytechinus variegatus, shows that Snail is required in the micromere lineage for PMC ingression,
  that it represses cadherin transcription and is needed for cadherin endocytosis, and that together with
  alx1 and twist it forms the de-adhesion sub-circuit of the EMT gene regulatory network, while being
  dispensable for basement-membrane penetration, directed motility and apical constriction. In S. purpuratus
  the gene is expressed at low levels before gastrulation and its reported PMC enrichment and regulation
  by Alx1 differ between studies, so its exact contribution in this species is still uncertain.
