- id: PMID:17287249
  title: The Snail repressor is required for PMC ingression in the sea urchin embryo.
  findings:
  - statement: Snail is required in micromeres for PMC ingression, represses cadherin transcription, is
      needed for cadherin endocytosis, and sits downstream of Pmar1 and Alx1 in the micromere-PMC GRN.
    supporting_text: Perturbation studies position Snail in the sea urchin micromere-PMC gene regulatory
      network (GRN), downstream of Pmar1 and Alx1, and upstream of several PMC-expressed proteins.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified (Development 2007;134:1061-70). Primary functional paper for sea urchin
      Snail. Abstract only cached; the abstract does not name the species, but Shashikant et al. 2018
      and Saunders and McClay 2014 state the work was in Lytechinus variegatus, so it supports S. purpuratus
      Snail by orthology (ISS), not directly.
- id: PMID:24598159
  title: Sub-circuits of a gene regulatory network control a developmental epithelial-mesenchymal transition.
  findings:
  - statement: snail is one of 13 pre-EMT transcription factors required for PMC EMT in L. variegatus;
      snail knockdown blocks de-adhesion but not laminin-hole formation, motility or apical constriction.
    supporting_text: Three TFs highest in the GRN specified and activated EMT (alx1, ets1, tbr) and the
      10 TFs downstream of those (tel, erg, hex, tgif, snail, twist, foxn2/3, dri, foxb, foxo) were also
      required for EMT.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached; L. variegatus morpholino study (LvSnail2 MASO) that places snail in
      the de-adhesion sub-circuit with alx1 and twist and notes snail/twist are absent from the S. purpuratus
      GRN model.
- id: PMID:30264451
  title: 'From genome to anatomy: The architecture and evolution of the skeletogenic gene regulatory network
    of sea urchins and other echinoderms.'
  findings:
  - statement: The role of snail in the S. purpuratus PMC GRN is unsettled; Sp-sna is expressed at low
      levels before gastrulation and its PMC enrichment and response to Alx1 knockdown differ between
      studies.
    supporting_text: It remains unclear whether the role of snail is different in the two species or whether
      technical differences in these studies account for the apparent variability.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached; authoritative review of the skeletogenic GRN that explicitly summarises
      the S. purpuratus versus L. variegatus discrepancy for snail (citing Oliveri 2008, Barsi 2014, Rafiq
      2014).
- id: PMID:18495103
  title: Twist is an essential regulator of the skeletogenic gene regulatory network in the sea urchin
    embryo.
  findings:
  - statement: snail is expressed just before EMT and disappears from PMCs shortly after ingression; twist
      and snail both depend on Alx1 but a direct Twist-Snail regulatory link is not supported.
    supporting_text: Here, expression of twist and snail both rely on Alx1, but as yet, one cannot conclude
      on the relationship between these two proteins in the sea urchin embryos.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text cached; L. variegatus study of Twist that includes Sna morphant QPCR data
      and restates the timing of snail expression relative to ingression.
- id: PMID:16958110
  title: A homologue of snail is expressed transiently in subsets of mesenchyme cells in the sea urchin
    embryo and is down-regulated in axis-deficient embryos.
  findings:
  - statement: A snail homologue is expressed transiently in subsets of non-skeletogenic mesenchyme and
      the ciliated band in L. variegatus, and this expression is lost in radialized embryos.
    supporting_text: these patterns are consistent with expression of SNAIL by novel subsets of SMCs that
      are largely distinct from skeletogenic mesenchyme.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed-verified; abstract only. L. variegatus expression study; it provides the nuclear
      protein and secondary-mesenchyme expression context but no S. purpuratus or perturbation data.
- id: PMID:16997293
  title: The C2H2 zinc finger genes of Strongylocentrotus purpuratus and their expression in embryonic
    development.
  findings:
  - statement: Genome-wide survey of S. purpuratus C2H2 zinc-finger genes by the group that submitted
      the Snail cDNA (AY372519); expression of this gene class was measured by QPCR and in situ hybridization.
    supporting_text: Spatial expression pattern was determined by whole mount in situ hybridization for
      43 genes transcribed at a sufficient level, and localized expression was observed in diverse embryonic
      tissues.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: PubMed-verified; abstract only. Context for the UniProt sequence submission (Materna
      and Davidson 2003); the abstract does not discuss snail individually.
core_functions:
- description: Sequence-specific C2H2 zinc-finger transcriptional repressor that, in the skeletogenic
    primary mesenchyme cell lineage just before ingression, silences the cadherin gene and thereby drives
    the de-adhesion step of the epithelial-mesenchymal transition by which PMCs leave the vegetal plate
    epithelium; it acts downstream of pmar1 and alx1 and alongside twist in the EMT de-adhesion sub-circuit.
    The functional evidence is from the Lytechinus variegatus orthologue.
  molecular_function:
    id: GO:0001227
    label: DNA-binding transcription repressor activity, RNA polymerase II-specific
  directly_involved_in:
  - id: GO:0001837
    label: epithelial to mesenchymal transition
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:17287249
    supporting_text: Functional knockdown analyses of Snail in whole embryos and chimeras demonstrate
      that Snail is required in micromeres for PMC ingression.
  - reference_id: PMID:17287249
    supporting_text: Snail represses the transcription of cadherin, a repression that appears evolutionarily
      conserved throughout the animal kingdom.
  - reference_id: PMID:24598159
    supporting_text: In L. variegatus , alx1, twist and snail constitute a functional sub-circuit in the
      GRN that controls the repression and endocytosis of cadherin required for de-adhesion ( Wu and McClay,
      2007 ; Wu et al., 2008 )
  knowledge_gaps:
  - gap_statement: Whether S. purpuratus Snail performs the same cadherin-repressing, ingression-enabling
      role as the L. variegatus orthologue has not been tested by perturbation; the S. purpuratus expression
      data (PMC enrichment, response to Alx1 knockdown) are contradictory between studies.
    boundary: Established in L. variegatus by morpholino knockdown, chimeras and cadherin transcript/endocytosis
      assays; in S. purpuratus only QPCR/transcriptome expression data exist and they disagree.
    gap_kind:
    - BIOLOGY
suggested_questions:
- question: Is Sp-snail required for PMC ingression in S. purpuratus, as Lv-snail is in L. variegatus,
    or has the de-adhesion sub-circuit been rewired between the two species?
- question: Is Sp-sna activated or repressed by Alx1 in S. purpuratus (Rafiq et al. 2014 reported an increase
    in Alx1 morphants, opposite to L. variegatus)?
- question: Does sea urchin Snail bind the cadherin cis-regulatory region directly (E-box occupancy),
    and does it recruit a co-repressor through its N-terminal SNAG-like region?
suggested_experiments:
- description: Morpholino or CRISPR knockdown of Sp-sna in S. purpuratus with live imaging of PMC ingression
    and assays of cadherin mRNA and protein endocytosis, to test whether the L. variegatus role transfers.
  hypothesis: Sp-Snail is required for the de-adhesion step of PMC EMT via cadherin repression.
- description: Stage-resolved single-cell or NanoString quantification of Sp-sna in PMCs versus other
    cells across hatched blastula to mesenchyme blastula, and in Alx1 morphants, to resolve the Barsi
    versus Rafiq discrepancy.
  hypothesis: Sp-sna is transiently enriched in pre-ingression PMCs and is positively regulated by Alx1.
