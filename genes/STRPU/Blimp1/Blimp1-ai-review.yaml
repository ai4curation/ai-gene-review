status: COMPLETE
description: 'Sp-Blimp1 (blimp1/krox, formerly SpKrox1) is the purple sea urchin orthologue of the vertebrate
  PRDM1/Blimp-1 transcription factor, with an N-terminal PR/SET domain and four C-terminal C2H2 zinc fingers.
  The gene produces two alternatively transcribed isoforms: the early 1b form (this entry), transcribed
  zygotically from about 6-9 h after fertilization, and the late 1a form expressed only from gastrulation
  in the midgut and hindgut. Blimp1b is a central node of the endomesoderm gene regulatory network. It is
  activated by beta-catenin/Tcf (downstream of Wnt8) and by Otx, and represses its own gene through Blimp1
  sites in its cis-regulatory module; together with wnt8, which it directly activates, this autorepressive
  feedback subcircuit produces an expanding torus of expression that sweeps outward from the skeletogenic
  micromeres through the non-skeletogenic mesoderm to the veg2 endoderm. Blimp1 acts as an activator on the
  wnt8, otx (beta1/2 module) and even-skipped cis-regulatory systems and as a repressor of its own gene, of
  hesC and of notch, thereby releasing delta transcription in the mesoderm and coordinating the outward
  progression of Wnt and Notch signalling. Blocking blimp1 translation blocks endomesoderm specification;
  in the endoderm it participates in the blimp1-otx-gatae positive feedback loop and drives brn1/2/4 and
  tgif expression. Blimp1 isoforms are also reported to regulate germline determinants such as vasa and
  nanos.'
