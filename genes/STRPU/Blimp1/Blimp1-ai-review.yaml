suggested_questions:
- question: Should Blimp1's control of the wnt8 ligand gene and of the hesC/notch genes be represented as positive
    regulation of canonical Wnt signaling and regulation of Notch signaling, or (as here) only as transcriptional
    regulation with 'has input' wnt8/hesC/notch? Blimp1 acts one transcriptional step upstream of each pathway,
    and Peter & Davidson 2011 report that the Blimp1-site mutation does not affect a whole-locus wnt8 BAC.
- question: Does Sp-Blimp1 bind its mapped consensus sites directly? No EMSA or ChIP has been reported for the sea
    urchin protein; all site assignments rest on mutagenesis and the vertebrate Blimp-1 consensus.
- question: Which of the Blimp1 splice isoforms (1a, 1b, or the additional variants described by Reyes et al. 2025)
    corresponds to the germline function on vasa/nanos, and does it map to this accession (the 1b form)?
- question: Is the PR/SET domain of Sp-Blimp1 catalytically inactive, as in vertebrate PRDM1, and does repression
    of hesC involve recruitment of histone-modifying corepressors as suggested for the persistent silencing in
    skeletogenic mesenchyme?
suggested_experiments:
- description: ChIP-qPCR or EMSA with recombinant Sp-Blimp1 zinc fingers on the wnt8 module, the blimp1b CR2 autorepression
    sites, the hesC intronic site and the notch site, converting functional site assignments into direct binding
    evidence.
- description: Immunolocalization or a Blimp1-GFP fusion to document nuclear localization and protein persistence
    relative to the extinction of blimp1b transcription in the centre of the torus, which constrains the kinetics
    of autorepression.
- description: Isoform-specific morpholinos (1a versus 1b exon junctions) with endoderm and germline markers to
    partition the endomesoderm and germ-cell functions between the two transcription units.
