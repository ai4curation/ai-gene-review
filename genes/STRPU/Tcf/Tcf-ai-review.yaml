taxon:
  id: NCBITaxon:7668
  label: Strongylocentrotus purpuratus
description: Tcf (SpTcf/Lef) is the single Tcf/Lef-family HMG-box transcription factor of the
  purple sea urchin and the nuclear effector of the maternal beta-catenin system that polarizes
  the embryo along its animal-vegetal axis. The protein carries an N-terminal beta-catenin-binding
  region and a C-terminal HMG box that recognizes Tcf sites in the cis-regulatory modules of the
  early endomesoderm regulatory genes (pmar1, wnt8, blimp1, otx, foxa and others). In animal-half
  blastomeres, where beta-catenin is degraded, Tcf bound by the co-repressor Groucho keeps these
  genes silent; in the vegetal micromeres and macromere descendants, where Dishevelled stabilizes
  beta-catenin and it enters the nucleus, beta-catenin displaces Groucho and converts Tcf into a
  transcriptional activator. Tcf is thus an obligatory input to nearly every node at the top of
  the endomesoderm gene regulatory network. It drives pmar1 in the micromeres, opening the
  double-negative gate of the skeletogenic lineage, sustains the wnt8/Blimp1 community-effect loop
  that spreads the vegetal regulatory state outward, and activates the veg2 endoderm regulatory
  genes; the same Tcf sites later extinguish the endoderm programme in mesoderm precursors once
  Notch signalling reduces nuclear beta-catenin. A dominant-negative Tcf animalizes the embryo,
  abolishing skeletogenic and non-skeletogenic mesenchyme, endoderm and aboral ectoderm, while
  a constitutively active Tcf vegetalizes it.
