  review:
    summary: Dominant-negative SpTcf/Lef abolishes endoderm formation, and the endoderm GRN of the
      veg2 lineage is launched by cis-regulatory Tcf sites in most of its eight early regulatory
      genes. Tcf itself performs the transcriptional step that initiates the endoderm regulatory
