suggested_questions:
- question: Does the sea urchin genome encode a single Tcf/Lef gene, and does SpTcf/Lef produce
    alternative isoforms (as vertebrate TCF7L2 does) with different activator or repressor
    potential?
- question: Is the C-terminal region of SpTcf/Lef a target of the Notch-induced NLK kinase in
    S. purpuratus, as shown for TCF in Paracentrotus lividus, and does phosphorylation account for
    the clearance of the endoderm GRN from mesoderm precursors?
suggested_experiments:
- description: ChIP or DamID for tagged SpTcf/Lef at 16- to 60-cell stages, with separated animal
    and vegetal halves, to test whether Tcf occupies the wnt8, pmar1 and foxa Tcf sites in both
    territories while co-occupancy with beta-catenin is vegetal-only and with Groucho is
    animal-only.
  hypothesis: Tcf is constitutively DNA-bound and the activator/repressor switch is determined
    solely by which cofactor it recruits.
- description: Co-immunoprecipitation or in vitro pull-down of S. purpuratus beta-catenin and
    Groucho with the N-terminal (IPR013558) and HMG-box regions of SpTcf/Lef, and rescue of the
    dominant-negative phenotype with binding-site mutants.
  hypothesis: The N-terminal beta-catenin-binding region of SpTcf/Lef is necessary for activation
    of the endomesoderm GRN and dispensable for Groucho-mediated repression.
