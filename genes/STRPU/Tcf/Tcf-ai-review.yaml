- id: PMID:10664150
  title: Involvement of Tcf/Lef in establishing cell types along the animal-vegetal axis of sea
    urchins.
  full_text_unavailable: true
  findings:
  - statement: SpTcf/Lef was cloned from S. purpuratus and its expression peaks when beta-catenin
      enters vegetal nuclei.
    supporting_text: Expression of SpTcf/Lef was maximal when beta-catenin became localized to
      nuclei of vegetal blastomeres, consistent with its acting in combination with beta-catenin
      to specify vegetal cell fates.
  - statement: A dominant-negative SpTcf/Lef phenocopies loss of nuclear beta-catenin, abolishing
      mesenchyme, endoderm and aboral ectoderm.
    supporting_text: Expression of a dominant-negative SpTcf/Lef inhibited primary and secondary
      mesenchyma, endoderm, and aboral ectoderm formation in a manner similar to that observed
      when nuclear accumulation of beta-catenin was prevented.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Huang et al. 2000, Dev Genes Evol; the UniProt RX reference for Q9Y0B2 and the
      only S. purpuratus-specific loss-of-function study of SpTcf/Lef. Abstract only; PubMed
      title verified.
- id: PMID:10625549
  title: TCF is the nuclear effector of the beta-catenin signal that patterns the sea urchin
    animal-vegetal axis.
  full_text_unavailable: true
  findings:
  - statement: Dominant-negative TCF animalizes and activated TCF vegetalizes the embryo.
    supporting_text: 'We show that expression of a dominant negative TCF results in a classic
      "animalized" embryo. In contrast, microinjected RNA encoding an activated TCF produces a
      highly "vegetalized" embryo.'
  - statement: All of beta-catenin's axis-patterning activity is mediated through TCF, acting
      between fertilization and the 60-cell stage.
    supporting_text: We also provide evidence indicating that all of beta-catenin's activity in
      patterning the sea urchin AV axis is mediated by TCF.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Vonica et al. 2000, Dev Biol. PubMed-verified. The cached abstract does not
      state the sea urchin species used, so it is cited as corroborating evidence for the
      conserved Tcf role rather than as S. purpuratus-specific data.
- id: PMID:9847248
  title: Nuclear beta-catenin is required to specify vegetal cell fates in the sea urchin embryo.
  full_text_unavailable: true
  findings:
  - statement: Nuclear beta-catenin accumulates cell-autonomously in endomesoderm precursors and is
      required for all vegetal fates and for micromere signalling.
    supporting_text: the accumulation of beta-catenin in nuclei of vegetal cells is regulated cell
      autonomously and that this localization is required for the establishment of all vegetal
      cell fates and the production of micromere-derived signals
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Logan et al. 1999, Development. Establishes the upstream beta-catenin
      requirement that Tcf transduces; does not assay Tcf itself.
- id: PMID:15708573
  title: LvGroucho and nuclear beta-catenin functionally compete for Tcf binding to influence
    activation of the endomesoderm gene regulatory network in the sea urchin embryo.
  full_text_unavailable: true
  findings:
  - statement: Groucho binds Tcf through its Q and WD domains and antagonizes endomesoderm gene
      expression.
    supporting_text: Interaction assays demonstrate that LvGroucho interacts with Tcf via both the
      Q and the WD domains of the protein. LvGroucho interacts with Tcf to antagonize the
      expression of key endomesoderm regulatory genes.
  - statement: Groucho and nuclear beta-catenin compete for Tcf binding, forming the switch that
      initiates the endomesoderm GRN.
    supporting_text: LvGroucho functionally competes with beta-catenin for Tcf binding, and this
      competitive mechanism regulates one of the earliest steps in the initiation of the sea
      urchin endomesoderm GRN
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Range et al. 2005, Dev Biol. Lytechinus variegatus, not S. purpuratus; provides
      the mechanism of the Tcf repressor/activator switch and is cited as corroborating evidence.
