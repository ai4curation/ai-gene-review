core_functions:
- description: Beta-catenin-dependent transcriptional activation of the endomesoderm regulatory
    genes. In vegetal blastomeres where maternal beta-catenin is nuclear, Tcf bound to Tcf sites in
    the cis-regulatory modules of pmar1, wnt8, blimp1 and the veg2 endoderm genes recruits
    beta-catenin and activates them, initiating skeletogenic micromere specification, the wnt8
    community-effect loop and the endoderm regulatory state. This is the terminal, transcriptional
    step of canonical Wnt signalling in the early embryo.
  molecular_function:
    id: GO:0001228
    label: DNA-binding transcription activator activity, RNA polymerase II-specific
  directly_involved_in:
  - id: GO:0060070
    label: canonical Wnt signaling pathway
  - id: GO:0001714
    label: endodermal cell fate specification
  - id: GO:0007501
    label: mesodermal cell fate specification
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:10664150
    supporting_text: Our results suggest that SpTcf/Lef functions by interacting with beta-catenin
      to specify cell fates along the sea urchin animal-vegetal axis.
  - reference_id: PMID:16289024
    supporting_text: The Tcf1/beta-catenin and Blimp1/Krox inputs are both necessary for normal
      endomesodermal expression mediated by this cis-regulatory module
  - reference_id: PMID:18413610
    supporting_text: "The pmar1 genes are activated by the β-catenin/Tcf transcription complex\
      \ plus Otx, i.e., by two of the micromere-specific inputs just enumerated ( 25 , 30 )."
- description: Groucho-dependent repression of the same target genes where beta-catenin is not
    nuclear. In the animal half of the embryo, and later in mesoderm precursors in which Notch
    signalling lowers nuclear beta-catenin, DNA-bound Tcf complexed with the co-repressor Groucho
    silences the endomesoderm regulatory genes, confining the endomesoderm GRN to the vegetal
    territory and then clearing the endoderm regulatory state from the mesoderm.
  molecular_function:
