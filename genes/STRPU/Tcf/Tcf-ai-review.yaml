- gap_statement: Whether Tcf occupies its target cis-regulatory sites in vivo in both the animal
    (repressed) and vegetal (activated) territories, as the switch model requires, has not been
    shown by chromatin binding assays; the evidence is from site mutation in reporter constructs.
