- term:
    id: GO:0001227
    label: DNA-binding transcription repressor activity, RNA polymerase II-specific
  evidence_type: IDA
  original_reference_id: PMID:16289024
  qualifier: enables
  review:
    summary: Where beta-catenin is not nuclear, Tcf represses the same target genes. In the wnt8
      cis-regulatory system of S. purpuratus, Tcf1 sites in the early module act to repress
      ectopic transcription in prospective ectoderm cells, and the Tcf sites of the veg2 endoderm
      genes are reused to extinguish the endoderm GRN in mesoderm precursors when Notch signalling
      lowers nuclear beta-catenin. The repressive state depends on the co-repressor Groucho, which
      competes with beta-catenin for Tcf binding (shown for the Lytechinus variegatus orthologue).
    action: NEW
    reason: Tcf-site mutation in a S. purpuratus cis-regulatory module derepresses transcription
      in the animal half, demonstrating that the DNA-bound factor represses in the absence of
      nuclear beta-catenin; this is the other half of the Tcf switch and is the mechanism that
      restricts the endomesoderm GRN to the vegetal half.
    supported_by:
    - reference_id: PMID:16289024
      supporting_text: In a second regulatory region, which initiates expression in micromere and
        macromere descendant cells early in cleavage, Tcf1 sites act to repress ectopic
        transcription in prospective ectoderm cells.
    - reference_id: PMID:21623371
      supporting_text: "A possible explanation is that in cells receiving Notch signalling, the\
        \ availability of nuclear β-catenin is reduced, leading to Tcf/Groucho-mediated repression."
    - reference_id: PMID:15708573
      supporting_text: LvGroucho interacts with Tcf to antagonize the expression of key
        endomesoderm regulatory genes.
- term:
    id: GO:0060070
    label: canonical Wnt signaling pathway
  evidence_type: IMP
  original_reference_id: PMID:10664150
  qualifier: involved_in
  review:
    summary: Tcf is the transcriptional effector of nuclear beta-catenin in the sea urchin embryo.
      Dominant-negative SpTcf/Lef reproduces the phenotype of blocking beta-catenin
      nuclearization; all of beta-catenin's axis-patterning activity is mediated by TCF; and
      beta-catenin/Tcf is itself an output of Wnt8 reception, closing the wnt8 community-effect
      loop. Tcf performs the terminal step of the pathway (transcriptional response), so it
      participates in the pathway rather than merely being required for it.
    action: NEW
    reason: The dominant-negative phenotype and its identity with the beta-catenin-blockade
      phenotype in S. purpuratus establish Tcf as the nuclear component of the canonical
      (beta-catenin-dependent) Wnt pathway.
    supported_by:
    - reference_id: PMID:10664150
      supporting_text: Our results suggest that SpTcf/Lef functions by interacting with
        beta-catenin to specify cell fates along the sea urchin animal-vegetal axis.
    - reference_id: PMID:10625549
      supporting_text: We also provide evidence indicating that all of beta-catenin's activity in
        patterning the sea urchin AV axis is mediated by TCF.
    - reference_id: PMID:19104065
      supporting_text: the wnt8 gene requires inputs from both β-catenin/Tcf (i.e., from the same
        signal transduction system that it activates) and from Blimp1 factor for expression
- term:
