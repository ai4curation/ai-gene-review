taxon:
  id: NCBITaxon:7668
  label: Strongylocentrotus purpuratus
description: 'Wnt8 is a secreted, lipid-modified Wnt-family ligand (358 aa, single Wnt domain with the family-conserved
  cysteine pattern) of the purple sea urchin embryo. It is the earliest zygotic intercellular signal of the vegetal
  pole: transcription begins at the 16-cell stage in the four micromeres, under control of the maternally
  nuclearized beta-catenin/Tcf system, and then spreads at the 60-cell stage to the adjacent veg2 tier of
  macromere descendants. Reception of Wnt8 by neighbouring cells drives beta-catenin into their nuclei, and
  because the wnt8 cis-regulatory system itself depends on a beta-catenin/Tcf input (together, in one module,
  with the zinc-finger factor Blimp1), each Wnt8-producing cell recruits its neighbours to produce Wnt8 in turn.
  This intercellular positive feedback, coupled to blimp1 autorepression that later extinguishes expression at
  the centre, generates an expanding torus of wnt8 and blimp1 expression that sweeps outward from the
  skeletogenic micromere lineage through the non-skeletogenic mesoderm and into the veg2 endoderm, carrying with
  it the beta-catenin/Tcf input on which most endomesodermal regulatory genes depend, and setting where the
  complementary Delta/Notch signal is deployed. Blocking Wnt8 translation prevents specification of both the
  mesoderm (primary mesenchyme, pigment and muscle cells) and the endoderm and abolishes gastrulation, while
  overexpressed Wnt8 induces ectopic endoderm and multiple invagination sites. Later, from the blastula stage,
  wnt8 expression moves into veg1 and posterior ectoderm, where Wnt8 together with Wnt1, acting through the
  Frizzled5/8 receptor and JNK rather than beta-catenin, restricts the anterior neuroectoderm to the anterior
  pole.'
