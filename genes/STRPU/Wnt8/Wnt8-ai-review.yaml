    - reference_id: PMID:16289024
      supporting_text: Expression of the wnt8 gene is the key transcriptional motivator of an intercellular signaling
        loop which drives endomesoderm specification forward early in sea urchin embryogenesis.
    - reference_id: PMID:18061160
      supporting_text: Morpholino-substituted antisense oligonucleotide (MASO) targeting blimp1 blocks endomesoderm
