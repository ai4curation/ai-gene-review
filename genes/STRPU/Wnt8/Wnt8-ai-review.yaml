- term:
    id: GO:0048018
    label: receptor ligand activity
  evidence_type: IMP
  original_reference_id: PMID:15282746
  qualifier: enables
  review:
    summary: Proposed. Wnt8 is the secreted ligand whose reception by adjacent cells activates the Frizzled/beta-catenin
      pathway. In S. purpuratus, blocking translation of the ligand and blocking nuclearization of its downstream
      effector beta-catenin give the same loss of endomesoderm specification, overexpression of the ligand induces
      ectopic endoderm, and cis-regulatory reconstruction shows that outward expansion of the blimp1/wnt8 torus
      follows reception of the ligand by neighbouring cells.
    action: NEW
    reason: This is the molecular function GO uses for secreted Wnt ligands (the definition of the existing IEA
      'signaling receptor binding' row itself recommends it), and it is what the sea urchin loss- and gain-of-function
      data establish. No direct binding assay exists for the sea urchin protein, so the more specific frizzled
      binding is left to the IBA row rather than asserted experimentally.
    supported_by:
    - reference_id: PMID:15282746
      supporting_text: Overexpression of SpWnt8 by mRNA microinjection produced embryos with multiple invagination
        sites and showed that, consistent with its localization, SpWnt8 is a strong inducer of endoderm.
    - reference_id: PMID:15282746
      supporting_text: Blocking SpWnt8 function using SpWnt8 morpholino antisense oligonucleotides produced embryos
        that formed micromeres that could transmit the early endomesoderm-inducing signal, but these cells failed to
        differentiate as primary mesenchyme cells.
    - reference_id: PMID:17975065
      supporting_text: A cis-regulatory reconstruction experiment revealed that blimp1 autorepression accounts for
        progressive extinction of expression in the center of the torus, whereas its outward expansion follows
        reception of the Wnt8 ligand by adjacent cells.
    - reference_id: PMID:18413610
      supporting_text: Therefore, an intercellular feedback circuit is set up, as each wnt8 -expressing cell also
        causes the adjacent recipient cells to drive more β-catenin into its nucleus and further express wnt8
