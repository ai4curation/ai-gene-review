- term:
    id: GO:0007501
    label: mesodermal cell fate specification
  evidence_type: IMP
  original_reference_id: PMID:15282746
  qualifier: involved_in
  review:
    summary: Proposed. The same Wnt8 signal is required for the mesodermal lineages of the vegetal plate. In Wnt8
      morphants the micromeres form but fail to differentiate as primary mesenchyme cells, and the secondary
      mesenchyme-derived pigment and muscle cells are absent; blocking the ligand or beta-catenin nuclearization
      prevents specification of the non-skeletogenic mesoderm, and the intercellular wnt8 feedback loop is needed
      for specification of the skeletogenic micromere lineage itself.
    action: NEW
    reason: 'Participation test: Wnt8 is the ligand that supplies the beta-catenin/Tcf input to the skeletogenic and
      non-skeletogenic mesoderm regulatory states (in the micromeres it acts on the very cells that produce it, and
      positions the Delta/Notch signal that specifies NSM). Comparator check: Xenopus wnt8 (P28026) carries mesoderm
      development by IDA, and Drosophila FGF ligands carry GO:0007501 by IMP. Proposed with GO:0001714 as the
      specific replacement for the IBA cell fate commitment row. Downstream skeletogenic differentiation and pigment
      cell terms are deliberately not proposed (executed by the lineage GRNs and by Delta/Notch).'
    supported_by:
    - reference_id: PMID:15282746
      supporting_text: Blocking SpWnt8 function using SpWnt8 morpholino antisense oligonucleotides produced embryos
        that formed micromeres that could transmit the early endomesoderm-inducing signal, but these cells failed to
        differentiate as primary mesenchyme cells.
    - reference_id: PMID:15282746
      supporting_text: SpWnt8-morpholino embryos also did not form endoderm, or secondary mesenchyme-derived pigment
        and muscle cells, indicating a role for SpWnt8 in gastrulation and in the differentiation of endomesodermal
        lineages.
    - reference_id: PMID:19104065
      supporting_text: Thus, blocking Wnt8 translation with morpholino antisense oligonucleotides (MASO), or blocking
        nuclearization of its downstream effector, β-catenin, by overexpression of an intracellular fragment of
        Cadherin ( 15 , 6 ), prevents both NSM and endoderm specification.
    - reference_id: PMID:18413610
      supporting_text: blockade of wnt8 expression and disruption of the wnt8 intercellular feedback loop plays havoc
        with endomesodermal specification, including that of the skeletogenic micromere lineage
- term:
    id: GO:0009952
    label: anterior/posterior pattern specification
  evidence_type: IMP
  original_reference_id: PMID:23335859
  qualifier: involved_in
  review:
    summary: Proposed, non-core. From the blastula stage wnt8 expression moves into veg1 and posterior ectoderm,
      and Wnt8 together with Wnt1, signaling through Fzl5/8 and JNK, restricts the anterior neuroectoderm (foxq2
      domain) to the anterior pole; Wnt8 morphants fail to down-regulate foxq2 in posterior ectoderm.
    action: NEW
    reason: The ligand itself performs the posteriorizing signaling step, and A/P regionalization of the
      neuroectoderm is the process the experiment measures. This replaces the over-broad family-level 'neuron
      differentiation' IBA as the accurate statement of Wnt8's ectodermal role. Not part of the core endomesoderm
      function; the pathway in this context is beta-catenin-independent (JNK), which is noted in
      suggested_questions rather than asserted as a non-canonical pathway term.
    supported_by:
    - reference_id: PMID:23335859
      supporting_text: Here we show that the Wnt-dependent restriction of neuroectoderm to the anterior pole involves
        not only Wnt/β-catenin but also a series of linked steps mediated by Wnt/JNK signaling through Wnt1, Wnt8,
        and Fzl5/8, the homolog of vertebrate Fzl8.
    - reference_id: PMID:23335859
      supporting_text: embryos injected with either Wnt1 or Wnt8 morpholinos failed to down-regulate foxq2 expression
        in posterior ectoderm.
    - reference_id: PMID:23335859
      supporting_text: As development progressed, wnt8 expression first moved into the next most anterior tier of
        blastomeres (veg1) and then, during late blastula stages (18 and 24 hpf), into both veg1 and overlying
        posterior ectoderm cells
core_functions:
- description: Secreted Wnt ligand of the micromere and veg2 lineages that activates canonical Wnt/beta-catenin
    signaling in adjacent vegetal cells, driving the self-propagating Blimp1/Wnt8 feedback torus that delivers the
    beta-catenin/Tcf input for endoderm and mesoderm specification across the vegetal plate.
  supported_by:
  - reference_id: PMID:16289024
    supporting_text: Expression of the wnt8 gene is the key transcriptional motivator of an intercellular signaling
      loop which drives endomesoderm specification forward early in sea urchin embryogenesis.
  - reference_id: PMID:18413610
    supporting_text: Wnt8, which enhances nuclearization of β-catenin in recipient cells, including themselves
  - reference_id: PMID:19104065
    supporting_text: Expression of wnt8 is also essential for specification of both NSM and endoderm.
  - reference_id: PMID:15282746
    supporting_text: These results establish SpWnt8 as a critical component of the endomesoderm regulatory network in
      the sea urchin embryo.
