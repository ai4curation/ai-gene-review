  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Wikramanayake et al. 2004, Genesis. Abstract only. The primary S. purpuratus paper for this
      accession (the UniProt record cites only the corresponding cDNA submission by the same author, with no
      PubMed cross-reference; PMID found by eutils search). Establishes micromere/veg2 expression, its dependence
      on nuclear beta-catenin, endoderm induction by overexpression, and the MASO phenotype: no PMC differentiation,
      no endoderm, no pigment or muscle cells. Primary IMP/IDA source.'
- id: PMID:16289024
  title: cis-Regulatory inputs of the wnt8 gene in the sea urchin endomesoderm network.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Minokawa, Wikramanayake & Davidson 2005, Dev Biol. Abstract only. cis-regulatory analysis of
      the S. purpuratus wnt8 gene: Blimp1/Krox and Tcf1/beta-catenin sites in one module are both required, encoding
      the intercellular feedback loop. Note that PMID:21623371 later found the Blimp1-site mutation has no effect in
      a whole-locus BAC.'
