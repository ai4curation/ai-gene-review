suggested_questions:
- question: Should frizzled binding remain an IBA-only statement, or is there (or should there be) direct evidence
    that Sp-Wnt8 binds a specific sea urchin Frizzled (Fzl1/2/7 or Fzl5/8)? The endomesoderm role is
    beta-catenin-dependent and the later ectodermal role runs through Fzl5/8-JNK, suggesting Wnt8 engages more than
    one receptor.
- question: The later A/P neuroectoderm role is beta-catenin-independent (Wnt/JNK through Fzl5/8). Should a
    non-canonical Wnt signaling pathway term be added for Wnt8, given that the PLoS Biol study attributes the JNK
    step jointly to Wnt1 and Wnt8 and does not separate their receptor engagement?
- question: Is Blimp1 a necessary in vivo input into wnt8? The reporter-module analysis says yes, but the whole-locus
    BAC experiment in the endoderm GRN paper says the Blimp1-site mutation has no effect and that wnt8 turns on in
    veg2 before blimp1b; this affects how the torus subcircuit should be modelled but not the annotations here.
suggested_experiments:
- description: Cell-based or in vitro binding assay between recombinant Sp-Wnt8 and the extracellular cysteine-rich
    domains of the sea urchin Frizzled receptors (Fzl1/2/7, Fzl5/8, Fzl9/10) to convert the inherited frizzled
    binding into direct evidence and identify which receptor mediates the endomesodermal versus the ectodermal
    response.
  experiment_type: biochemical
- description: Tagged Wnt8 (BAC knock-in or mRNA with an epitope tag) to visualize the extracellular protein and its
    range of diffusion from micromeres to veg2 and veg1, testing the diffusion-based model of torus expansion.
  experiment_type: localization
- description: Lineage-restricted rescue (micromere-only versus veg2-only wnt8 expression in a Wnt8 morphant or
    CRISPR background) to separate the contributions of micromere-derived and veg2-derived Wnt8 to skeletogenic,
    non-skeletogenic mesoderm and endoderm specification.
  experiment_type: genetic
