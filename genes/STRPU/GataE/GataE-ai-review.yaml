- id: PMID:15567710
  title: Expression of Spgatae, the Strongylocentrotus purpuratus ortholog of vertebrate
    GATA4/5/6 factors.
  findings:
  - statement: Spgatae is the sea urchin ortholog of vertebrate gata4/5/6 by phylogenetic
      analysis.
    supporting_text: Spgatae is the sea urchin ortholog of the vertebrate gata4/5/6
      genes, as confirmed by phylogenetic analysis.
  - statement: Zygotic expression begins in the 15 h blastula in a ring of prospective
      mesoderm cells, expands to the whole vegetal plate at mesenchyme blastula, and
      later marks midgut, hindgut, archenteron-tip mesoderm and coelomic pouches.
    supporting_text: Spgatae transcripts were first detected in a ring of prospective
      mesoderm cells in the vegetal plate. Spgatae expression then expands to include
      the entire vegetal plate at the mesenchyme blastula stage.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Gene Expr Patterns 2004;5:161-5); this is the paper cited on
      the UniProt record (RX line) and the source of the gatae cDNA (AY623814,
      EMBL AAU21562). Abstract only cached; expression evidence (IEP-type).
- id: PMID:17570356
  title: Exclusive developmental functions of gatae cis-regulatory modules in the Strongylocentrorus
    purpuratus embryo.
  findings:
  - statement: gatae is required for normal development and, before gastrulation,
      is a direct activator of the endodermal regulatory genes foxA, brachyury and
      beta1/2-otx.
    supporting_text: reveal that prior to gastrulation gatae is a direct activator
      of a number of genes encoding transcription factors, including the endodermal
      transcription factors foxA, brachyury , and β1/2-otx
  - statement: gatae and beta1/2-otx cross-regulate in a positive feedback loop that
      locks down endoderm specification.
    supporting_text: These two genes cross-regulate, generating a positive feedback
      loop which serves to lock down the state of endoderm specification
  - statement: Two intronic cis-regulatory modules control gatae; module 10 is necessary
      and sufficient for the early endomesodermal phase and module 24 drives late gut
      endoderm expression.
    supporting_text: Module 10 produces early expression in mesoderm and endoderm cells
      up to the early gastrula stage, while module 24 generates late endodermal expression
      at gastrula and pluteus stages.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text cached (Dev Biol 2007;307:434-45, PMC2031225). S. purpuratus BAC
      knock-in and module-deletion analysis of the gatae locus itself; also
      summarizes the MASO perturbation evidence for gatae outputs from the
      endomesoderm GRN.
- id: PMID:15110718
  title: 'An otx cis-regulatory module: a key node in the sea urchin endomesoderm gene
    regulatory network.'
  findings:
  - statement: The beta1/2-otx cis-regulatory module requires gatae, otx and krox
      inputs as an AND logic processor; a pair of Gata sites is essential for endodermal
      expression and acts synergistically with an adjacent Otx site.
    supporting_text: For spatial expression in the endoderm, one particular pair of
      Gata sites is essential and these function synergistically with an adjacent
      Otx site.
  - statement: Mutation of the target sites reproduces the effect of gatae morpholino
      knockdown on the construct.
    supporting_text: mutation of these sites was demonstrated to produce the same
      respective effects on construct expression as does blocking its regulatory inputs
      by treatment with morpholino antisense oligonucleotides
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Dev Biol 2004;269:536-51). Direct DNA-level demonstration
      of the GataE input into otx in S. purpuratus (site mutagenesis plus gatae
      MASO). Abstract only cached.
- id: PMID:23261933
  title: Diversification of oral and aboral mesodermal regulatory states in pregastrular
    sea urchin embryos.
  findings:
  - statement: gataE is a direct Gcm target and a linchpin of the aboral non-skeletogenic
      mesoderm GRN, part of a feedback loop that locks down the aboral regulatory state.
    supporting_text: A linchpin of this network is gataE which as we show is a direct
      Gcm target and part of a feedback loop locking down the aboral regulatory state.
  - statement: GataE morpholino embryos lack pigment cells and show strongly reduced
      six1/2 and z166 transcripts, indicating direct GataE inputs into aboral NSM genes.
    supporting_text: At 48 hpf GataE MASO embryos lack pigment cells altogether, as
      shown by the absence of pks expression
  - statement: Blocking gcm or gataE expands the oral NSM regulatory genes ese, prox1,
      gataC and erg.
    supporting_text: If gcm or gataE expression are blocked by treatment with MASOs
      we see an expansion of ese, prox1, gataC, and erg expression
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text cached (Dev Biol 2013;375:92-104, PMC3570723). S. purpuratus
      perturbation study using two independent GataE MASOs (translation- and
      splice-blocking) plus module 10 reporter assays.
- id: PMID:20122918
  title: Cis-regulatory analysis of the sea urchin pigment cell gene polyketide synthase.
  findings:
  - statement: Mutagenesis of the SpGcm, SpGataE and SpKrl sites in the SpPks cis-regulatory
      region shows that SpGataE is a direct positive regulator of the pigment cell gene
      pks.
    supporting_text: The mutagenesis of these DNA-binding sites indicated that SpGcm,
      SpGataE and SpKrl are direct positive regulators of SpPks.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Calestani & Rogers, Dev Biol 2010). Direct cis-regulatory
      evidence for a GataE input into a differentiation gene in S. purpuratus.
      Abstract only cached.
- id: PMID:22306924
  title: A comprehensive analysis of Delta signaling in pre-gastrular sea urchin embryos.
  findings:
  - statement: gataE is a direct target of Delta/Notch signalling through functional
      Su(H) sites in its cis-regulatory module, with Gcm acting as an additional feed-forward
      activator in the NSM.
    supporting_text: The cis-regulatory module controlling gataE expression also contains
      functional Su(H) sites, thus proving that, like gcm, gataE is a direct target
      of D/N signaling
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text cached; establishes the upstream Delta/Notch input into
      gataE (S. purpuratus).
- id: PMID:19895806
  title: The endoderm gene regulatory network in sea urchin embryos up to mid-blastula
    stage.
  findings:
  - statement: gataE is first expressed exclusively in mesoderm precursors but becomes
      a component of the endoderm GRN; otx expression depends on Otx, GataE and Blimp1b.
    supporting_text: their data show that otx expression depends on Otx itself, GataE
      and Blimp1b, which are themselves encoded by Otx target genes.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text cached; endoderm GRN perturbation matrix including gataE
      MASO (S. purpuratus).
- id: PMID:21623371
  title: A gene regulatory network controlling the embryonic specification of endoderm.
  findings:
  - statement: The pre-gastrular veg2 endoderm GRN includes the positive feedback circuit
      between blimp1b, otx and gatae.
    supporting_text: The models proposed here include previously identified linkages
      such as the positive feedback circuit between blimp1b, otx and gatae.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text cached; the endoderm GRN synthesis (Nature 2011), used
      for the network context of gatae.
- id: PMID:14595011
  title: Developmental gene regulatory network architecture across 500 million years
    of echinoderm evolution.
  findings:
  - statement: The krox-otx-gatae feedback loop is conserved between sea urchin and
      starfish; gatae positively cross-regulates otx and is a major regulator of endodermal
      control genes including foxa and brachyury.
    supporting_text: The gatae gene is soon also engaged in this loop, requiring otx
      expression for function, and it, in turn, positively crossregulates otx .
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Full text cached. The new perturbation experiments in this paper are in the
      starfish Asterina miniata; the S. purpuratus linkages it summarizes rest on
      Davidson et al. 2002. Used as corroboration of conservation, not as primary
      S. purpuratus evidence.
- id: PMID:15882584
  title: Strongylocentrotus purpuratus transcription factor GATA-E binds to and represses
    transcription at an Otx-Goosecoid cis-regulatory element within the aboral ectoderm-specific
    spec2a enhancer.
  findings:
  - statement: SpGATA-E binds the proximal Otx/Gsc element of the spec2a enhancer,
      and GATA-E MASO increases activity from this element, suggesting a repressive
      role at this site.
    supporting_text: The proximal element bound to SpGATA-E, an endomesoderm-specific
      transcription factor.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Kiyama et al., Dev Biol 2005). Abstract only; the repressor
      conclusion is hedged ("suggesting") and the reported loss of ectoderm markers
      in GATA-E morphants is not easily reconciled with the endomesoderm-restricted
      expression, so no repressor term is proposed from it.
- id: PMID:17710433
  title: 'SpGataE, a Strongylocentrotus purpuratus ortholog of mammalian Gata4/5/6:
    protein expression, interaction with putative target gene spec2a, and identification
    of friend of Gata factor SpFog1.'
  findings:
  - statement: An anti-SpGataE antibody was generated; SpGataE physically interacts
      with the Fog ortholog SpFog1, but Fog1 knockdown does not affect endomesoderm
      specification.
    supporting_text: we identified an S. purpuratus fog ortholog, spfog1, and showed
      that SpGataE and SpFog1 physically interacted.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed-verified (Dev Genes Evol 2007). Abstract only cached; protein-level
      expression and cofactor interaction data.
- id: PMID:22509525
  title: 'Cis-regulatory logic driving glial cells missing: self-sustaining circuitry
    in later embryogenesis.'
  findings:
  - statement: gataE is downstream of gcm and upstream of six1 in the mesodermal GRN;
      six1 transcripts are specifically depleted by gataE MASO, and pks has direct GataE
      inputs.
    supporting_text: six1 is one of just two transcription factor mRNAs, the level of
      which is significantly depressed following knockdown of gataE transcripts
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text cached; corroborating perturbation data on gataE outputs
      in the NSM (S. purpuratus).
- id: PMID:11872831
  title: A genomic regulatory network for development.
  findings:
  - statement: The endomesoderm GRN, of which gatae is a node, was derived from large-scale
      perturbation analysis and cis-regulatory analysis.
    supporting_text: The network was derived from large-scale perturbation analyses,
      in combination with computational methodologies, genomic data, cis-regulatory
      analysis, and molecular embryology.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Background; abstract only cached and does not name gatae explicitly.
- id: PMID:12027441
  title: A provisional regulatory gene network for specification of endomesoderm in
    the sea urchin embryo.
  findings:
  - statement: The provisional network was built from morpholino, dominant-repressor,
      ectopic-expression and pathway-blockade perturbations of the regulatory genes,
      including gatae.
    supporting_text: The internal linkages between genes in the network have been
      determined functionally, by measurement of the effects of regulatory perturbations
      on the expression of all relevant genes in the network.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Background; the original perturbation data set for gatae outputs
      (abstract only cached, gatae not named in the abstract).
