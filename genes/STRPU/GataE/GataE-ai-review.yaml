      activation of the endodermal regulatory genes and the lock-down feedback loop),
      it is not merely required upstream. Vertebrate GATA4/5/6 orthologs and the sea
      urchin Otx and Blimp1 nodes of the same loop carry this term. Evidence is
      morpholino perturbation validated at the DNA level by site mutagenesis.
    supported_by:
