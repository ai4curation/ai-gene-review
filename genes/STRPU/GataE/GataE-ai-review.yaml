  review:
    summary: >-
      GataE is one of the transcription factors that installs and stabilizes the
      endoderm regulatory state of the veg2 lineage. It directly activates the
      endodermal regulatory genes otx (beta1/2), foxA and brachyury, and forms a
      positive cross-regulatory feedback loop with otx (and blimp1b) that locks down
