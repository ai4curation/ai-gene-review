  knowledge_gaps:
  - gap_statement: >-
      Whether GataE is a direct repressor of the oral mesoderm regulatory genes (ese,
      prox1, gataC, erg) and of the aboral ectoderm gene spec2a, or whether these
      restrictions are mediated by GataE-activated intermediates, has not been settled
      at the cis-regulatory level.
    boundary: >-
      GataE MASO expands oral NSM gene expression and derepresses the spec2a proximal
      element, and GATA-E binds that element in vitro; a functional GataE repressive
      site in an S. purpuratus module has not been demonstrated with site mutagenesis.
    gap_kind:
    - BIOLOGY
suggested_questions:
- question: Is GataE a direct transcriptional repressor (of spec2a in the endomesoderm,
    and of the oral NSM genes in the aboral NSM), which would justify GO:0001227 /
    GO:0000122 annotations, or is the exclusion of these states mediated indirectly
    through GataE-activated genes such as six1/2?
- question: Which cis-regulatory module drives the late gatae expression in the
    coelomic pouches, which neither module 10 nor module 24 accounts for, and what
    role does GataE play in coelomic pouch (adult rudiment) mesoderm?
- question: Does the SpGataE-SpFog1 interaction modulate GataE activity in a context
    (for example spec2a repression or later gut regionalization) not tested by the
    Fog1 morpholino experiments?
suggested_experiments:
- description: Site-directed mutagenesis of the GATA sites in the spec2a proximal element
    and in the cis-regulatory modules of ese, prox1 and gataC, combined with GataE
    ChIP-qPCR, to test direct repression by GataE.
- description: Genome-wide ChIP-seq of SpGataE (the anti-SpGataE antibody exists) at
    18 h, 24 h and 48 h to distinguish direct mesodermal, endodermal and gut-regionalization
    targets and to map GATA sites in the foxA and brachyury modules.
- description: BAC-reporter scanning of the region upstream of conserved patch 1 of
    the gatae locus to identify the missing coelomic pouch module and its inputs.
