core_functions:
- description: >-
    GATA4/5/6-class zinc-finger transcriptional activator of the endoderm gene
    regulatory network: in the veg2 endoderm it directly activates the regulatory
    genes otx (beta1/2), foxA and brachyury through GATA sites in their
    cis-regulatory modules and forms a positive feedback loop with otx that locks
    down the endoderm regulatory state before gastrulation.
