      factors, including the endodermal transcription factors foxA, brachyury , and
      β1/2-otx
  - reference_id: PMID:15110718
    supporting_text: For spatial expression in the endoderm, one particular pair of
      Gata sites is essential and these function synergistically with an adjacent
      Otx site.
  - reference_id: PMID:14595011
    supporting_text: The gatae gene is soon also engaged in this loop, requiring otx
      expression for function, and it, in turn, positively crossregulates otx .
- description: >-
    Linchpin activator of the aboral non-skeletogenic mesoderm (pigment cell)
    regulatory state: activated by Delta/Notch and Gcm in the veg2 mesoderm ring,
    GataE drives the aboral regulatory genes (six1/2, z166) and the pigment
    differentiation gene polyketide synthase, and its loss eliminates pigment
    cells and lets the oral mesoderm regulatory state expand.
