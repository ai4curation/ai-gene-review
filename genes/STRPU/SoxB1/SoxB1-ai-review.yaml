- term:
    id: GO:0090090
    label: negative regulation of canonical Wnt signaling pathway
  evidence_type: IMP
  original_reference_id: PMID:14499650
  qualifier: involved_in
  review:
    summary: Morpholino or dominant-negative reduction of SpSoxB1 elevates TCF/Lef-beta-catenin-dependent
      luciferase reporter expression in vivo, and SpSoxB1 overexpression suppresses all vegetal fates,
      phenocopying cadherin-mediated sequestration of beta-catenin. The activity does not require DNA
      binding (a non-binding mutant retains it), pointing to protein-level antagonism of the beta-catenin/TCF
      transcriptional complex. Reciprocally, nuclear beta-catenin drives SoxB1 protein turnover in vegetal
      cells, and the GRN literature treats SoxB1 as the antagonist of beta-catenin cofactor function that
      keeps ectoderm out of the endomesoderm program.
    action: NEW
    reason: SoxB1 itself dampens canonical Wnt transcriptional output (reporter readout rises on knockdown,
      falls on overexpression), so it participates in the negative regulation rather than merely being
      required upstream; this is its defining role in the endomesoderm GRN.
    additional_reference_ids:
    - PMID:15689377
    - PMID:18413610
    supported_by:
    - reference_id: PMID:14499650
      supporting_text: Reduction in SpSoxB1 level results in elevated TCF/Lef-beta-catenin-dependent expression
        of a luciferase reporter gene in vivo, indicating that in the normal embryo this protein suppresses
        the primary vegetal signaling mechanism that is required for specification of mesenchyme and endoderm.
    - reference_id: PMID:14499650
      supporting_text: Suppression of vegetal fates involves interference at the protein-protein level
        because a mutation of SpSoxB1 that prevents its binding to DNA does not significantly reduce this
        activity.
    - reference_id: PMID:15689377
      supporting_text: Patterning of cell fates along the sea urchin animal-vegetal embryonic axis requires
        the opposing functions of nuclear beta-catenin/TCF-Lef, which activates the endomesoderm gene
        regulatory network, and SoxB1, which antagonizes beta-catenin and limits its range of function.
    - reference_id: PMID:18413610
      supporting_text: SoxB1 is believed to act as an antagonist of the transcriptional cofactor function
        of β-catenin.
