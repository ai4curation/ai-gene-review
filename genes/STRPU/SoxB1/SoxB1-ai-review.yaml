  review:
    summary: SoxB1 is the pan-ectodermal transcription factor of the embryo. Nuclear SoxB1 becomes confined
      to ectoderm, soxb1 morpholino downregulates almost all regulatory genes of the ciliated band and
      oral/aboral ectoderm GRNs, Sox sites are essential for zygotic nodal expression, and ectopic SpSoxB1
      converts the embryo to an animalised (ectoderm-only) phenotype. Later authors describe soxb1 as
      involved in early specification of ectoderm.
    action: NEW
    reason: SoxB1 performs the regulatory step (activation of the ectodermal regulatory-state genes) that
      specifies ectodermal fate; comparator Otx carries the same term for aboral ectoderm in this species.
      Endoderm and gastrulation requirements are treated as indirect and not proposed.
    additional_reference_ids:
    - PMID:14499650
    - PMID:17855430
    - PMID:30413529
    supported_by:
    - reference_id: PMID:25655703
      supporting_text: Remarkably, almost all of the regulatory genes specifically expressed within these
        domains are downregulated by interference with SoxB1 expression, implying their common activation
        by this factor.
    - reference_id: PMID:14499650
      supporting_text: Here we show that elevated and ectopic expression of this factor suppresses differentiation
        of all vegetal cell types, a phenotype that is very similar to that caused by the suppression
