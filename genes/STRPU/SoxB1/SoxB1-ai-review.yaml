  review:
    summary: 'Inherited activator activity of the Sox family. In the sea urchin SoxB1 is required for
      zygotic nodal expression through Sox sites in the nodal cis-regulatory module, and soxb1 morpholino
      downregulates almost all regulatory genes of the ciliated band and oral/aboral ectoderm, which Barsi
      et al. interpret as common activation by SoxB1. One caveat: at the SpAN promoter multimerised Sox
