- id: PMID:25655703
  title: Geometric control of ciliated band regulatory states in the sea urchin embryo.
  findings:
  - statement: soxb1 morpholino downregulates nearly all ciliated-band and ectoderm regulatory genes;
      SoxB1 is a pan-ectodermal activator with negative autoregulation and repression of otx beta1/2.
    supporting_text: Remarkably, almost all of the regulatory genes specifically expressed within these
      domains are downregulated by interference with SoxB1 expression, implying their common activation
      by this factor.
  - statement: SoxB1 is described as a pan-ectodermal transcription factor.
    supporting_text: SoxB1 is a pan-ectodermal transcription factor that is known to affect many other
      regulatory genes of the oral and aboral ectoderm GRNs
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified (Barsi, Tu, Calestani, Davidson, Development 2015); full text cached;
      the systematic knockdown evidence for SoxB1 as ectoderm GRN activator.
- id: PMID:21576476
  title: Direct development of neurons within foregut endoderm of sea urchin embryos.
  findings:
  - statement: SoxB1 marks uncommitted neural precursors and is eliminated from differentiating neurons
      in ectoderm and foregut.
    supporting_text: Just as these factors disappear when neurons differentiate in mouse embryos, so also
      is SoxB1 eliminated from differentiating neurons in ectoderm and foregut endoderm in sea urchin
      embryos.
  - statement: Persistent foregut SoxB1 is proposed to preserve neural potential by antagonising canonical
      Wnt signaling.
    supporting_text: We propose that SoxB1 function supports retention of pluripotency in this region,
      at least in part by antagonizing canonical Wnt signaling that drives endomesoderm development.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed-verified (Wei, Angerer, Angerer, PLoS One 2011); full text cached.
- id: PMID:30413529
  title: Neurogenesis in the sea urchin embryo is initiated uniquely in three domains.
  findings:
  - statement: soxb1 is expressed in all three neurogenic territories, and its knockdown alters proneural
      gene expression territory-specifically.
    supporting_text: Expression of the six proneural transcription factors shows that the response to
      knockdown of soxC , sip1 or soxb1 differs when the three territories are compared
  reference_review:
    relevance: MEDIUM
