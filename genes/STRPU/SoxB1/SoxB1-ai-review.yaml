taxon:
  id: NCBITaxon:7668
  label: Strongylocentrotus purpuratus
description: SoxB1 (SpSoxB1) is the maternally supplied SoxB-group (Sox1/2/3-like) HMG-box transcription
  factor of the purple sea urchin. Its mRNA is uniform in the egg and the protein is nuclear in every
  blastomere of 4- and 8-cell embryos, but from the fourth cleavage it is cleared post-translationally
  from micromere nuclei and then progressively from the whole vegetal (endomesodermal) region, a turnover
  that depends on nuclear beta-catenin and can be triggered by Pmar1; after blastula stage nuclear SoxB1
  is confined to the ectoderm, making it the earliest known spatially restricted transcriptional regulator
  along the animal-vegetal axis. SoxB1 binds Sox cis-regulatory elements in a sequence-specific manner
  (for example the Sox site of the SpAN promoter, which it bends strongly and which is essential for promoter
  activity) and it acts as a transcriptional activator of nodal and of most oral-ectoderm, aboral-ectoderm
  and ciliated-band regulatory genes, while repressing its own gene and otx beta1/2. Independently of
  DNA binding it antagonises the transcriptional cofactor function of nuclear beta-catenin/TCF, so that
  elevated SoxB1 animalises the embryo and reduced SoxB1 raises TCF/beta-catenin reporter output; the
  mutual antagonism between SoxB1 and nuclear beta-catenin sets the boundary between ectoderm and the
  endomesoderm gene regulatory network. Later, SoxB1 persists in uncommitted neural precursors of the
  ectoderm and foregut endoderm and is lost from neurons as they differentiate.
