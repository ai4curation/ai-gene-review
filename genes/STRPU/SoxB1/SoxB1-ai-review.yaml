    label: positive regulation of transcription by RNA polymerase II
  - id: GO:0001715
    label: ectodermal cell fate specification
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:25655703
    supporting_text: Remarkably, almost all of the regulatory genes specifically expressed within these
      domains are downregulated by interference with SoxB1 expression, implying their common activation
      by this factor.
  - reference_id: PMID:17855430
    supporting_text: This work shows that Tcf, SoxB1 and Univin play essential roles in the regulation
      of nodal expression in the sea urchin and suggests that some of the regulatory interactions controlling
      nodal expression predate the chordates.
  - reference_id: PMID:10556071
    supporting_text: The vegetal region lacking nuclear SpSoxB1 gradually expands so that, after blastula
      stage, only cells in differentiating ectoderm accumulate this protein in their nuclei.
- description: Architectural DNA bending at a target promoter. SpSoxB1 binds and strongly bends the Sox
    element of the SpAN (tolloid/BMP1-related) promoter; the site is essential in vivo although multimerised
    Sox sites do not activate a basal promoter, so SoxB1 promotes SpAN transcription by bringing upstream
    activators into contact with the basal promoter rather than by classical transactivation.
  molecular_function:
    id: GO:0008301
    label: DNA binding, bending
  directly_involved_in:
  - id: GO:0045944
    label: positive regulation of transcription by RNA polymerase II
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:11763999
    supporting_text: However, like other factors containing HMG-class DNA binding domains, SpSoxB1 does
      induce strong bending of DNA.
  - reference_id: PMID:11763999
    supporting_text: Regulatory sites that bind SpSoxB1 and CBF (CCAAT binding factor) are essential for
      strong transcriptional activity because mutations of these elements reduce promoter activity in
      vivo 20- and 10-fold, respectively.
- description: DNA-binding-independent antagonism of nuclear beta-catenin/TCF signaling that confines
    the endomesoderm gene regulatory network to the vegetal half. SoxB1 dampens TCF/beta-catenin transcriptional
    output, its overexpression animalises the embryo, and reciprocally nuclear beta-catenin (via Pmar1)
    drives SoxB1 protein turnover in vegetal cells; this mutual antagonism sets the ectoderm/endomesoderm
    boundary. The molecular activity by which SoxB1 interferes with the beta-catenin/TCF complex has not
    been defined, so no molecular-function term is asserted.
  directly_involved_in:
  - id: GO:0090090
    label: negative regulation of canonical Wnt signaling pathway
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:14499650
    supporting_text: Reduction in SpSoxB1 level results in elevated TCF/Lef-beta-catenin-dependent expression
      of a luciferase reporter gene in vivo, indicating that in the normal embryo this protein suppresses
      the primary vegetal signaling mechanism that is required for specification of mesenchyme and endoderm.
  - reference_id: PMID:15689377
    supporting_text: Patterning of cell fates along the sea urchin animal-vegetal embryonic axis requires
      the opposing functions of nuclear beta-catenin/TCF-Lef, which activates the endomesoderm gene regulatory
      network, and SoxB1, which antagonizes beta-catenin and limits its range of function.
knowledge_gaps:
- gap_statement: The molecular mechanism by which SoxB1 antagonises beta-catenin/TCF is unresolved; the
    activity survives a DNA-binding mutation, implying a protein-level interaction, but a direct SoxB1-beta-catenin
    or SoxB1-TCF interaction has not been demonstrated in the sea urchin.
  gap_kind:
  - BIOLOGY
  status: OPEN
  provenance:
  - reference_id: PMID:14499650
    supporting_text: Suppression of vegetal fates involves interference at the protein-protein level because
      a mutation of SpSoxB1 that prevents its binding to DNA does not significantly reduce this activity.
- gap_statement: Whether the requirement of SoxB1 for gastrulation and endoderm differentiation reflects
    direct SoxB1 targets in the vegetal plate or an indirect consequence of disturbed ectoderm/endomesoderm
    boundary setting is not established; no endoderm process term is proposed here.
  gap_kind:
  - BIOLOGY
  status: OPEN
  provenance:
  - reference_id: PMID:14499650
    supporting_text: Surprisingly, normal expression of SpSoxB1 is required for gastrulation and endoderm
      differentiation, as shown by both morpholino-mediated translational interference and expression
      of a dominant negative protein.
suggested_questions:
- question: Does SoxB1 bind beta-catenin or TCF directly in sea urchin nuclei, or does it compete for
    a shared co-factor, and which SoxB1 domain mediates the antagonism?
- question: Which of the ciliated-band and oral/aboral ectoderm regulatory genes downregulated by soxb1
    morpholino carry functional Sox sites, i.e. which are direct SoxB1 targets?
suggested_experiments:
- description: Co-immunoprecipitation or proximity-labelling of SpSoxB1 with beta-catenin and Tcf in blastula
    nuclear extracts, combined with the DNA-binding-defective SoxB1 mutant, to identify the physical basis
    of Wnt antagonism.
  hypothesis: SoxB1 sequesters beta-catenin or Tcf at the protein level, independently of its HMG-box
    DNA binding.
- description: ChIP-seq of SpSoxB1 at blastula stage compared with the soxb1 morpholino transcriptome,
    to separate direct from indirect ectoderm GRN targets.
  hypothesis: Most ciliated-band and ectoderm regulatory genes downregulated by soxb1 MASO are bound directly
    by SoxB1 at Sox sites.
