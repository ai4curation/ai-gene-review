    summary: 'PAINT inference from the SoxB family (Dichaete, mouse Sox1/2/3/14, human SOX3/SOX14, zebrafish).
      In the sea urchin SoxB1 does repress some Pol II genes: it limits its own transcript level by negative
      feedback in presumptive ectoderm (soxb1 morpholino raises soxb1 mRNA) and it represses otx beta1/2
