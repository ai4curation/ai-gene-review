core_functions:
- description: Sequence-specific transcriptional activation of ectodermal regulatory genes and specification
    of ectodermal fate. Acting in the nuclei of animal-half and later ectodermal cells, SoxB1 binds Sox
    cis-regulatory sites (nodal 5' module, SpAN promoter) and drives nodal and nearly all oral-ectoderm,
    aboral-ectoderm and ciliated-band regulatory genes, while limiting its own transcript level by negative
    feedback.
