- id: PMID:10556071
  title: SpSoxB1, a maternally encoded transcription factor asymmetrically distributed among early sea
    urchin blastomeres.
  findings:
  - statement: Discovery of the SpSoxB1 cDNA (the Q9Y0D7 sequence); maternal mRNA is uniform, protein
      is nuclear in all early blastomeres and is lost from micromere nuclei at fourth cleavage.
    supporting_text: SpSoxB1 maternal transcripts are uniformly distributed in the unfertilized egg and
      the protein accumulates to similar, high concentrations in all nuclei of 4- and 8-cell embryos.
      However, at fourth cleavage, the micromeres, which are partitioned by asymmetric division of the
      vegetal 4 blastomeres, have reduced nuclear levels of the protein, while high levels persist in
      their sister macromeres and in the mesomeres.
  - statement: Nuclear SoxB1 becomes confined to ectoderm; it is the earliest spatially restricted transcriptional
      regulator on the animal-vegetal axis.
    supporting_text: The vegetal region lacking nuclear SpSoxB1 gradually expands so that, after blastula
      stage, only cells in differentiating ectoderm accumulate this protein in their nuclei.
  - statement: SpSoxB1 binds the Sox cis element of the SpAN promoter in EMSA and the nuclear-extract
      complex is supershifted by anti-SpSoxB1 antiserum.
    supporting_text: In vitro translated SpSoxB1 forms a specific complex with this cis element whose
      mobility is identical to that formed by a protein in nuclear extracts. An anti-SpSoxB1 rabbit polyclonal
      antiserum specifically supershifts this DNA-protein complex
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified; the RX reference on the Q9Y0D7 record (Kenny et al., Development 1999).
      Abstract only in cache.
- id: PMID:11763999
  title: SpSoxB1 serves an essential architectural function in the promoter SpAN, a tolloid/BMP1-related
    gene.
  findings:
  - statement: The SpSoxB1 site is essential for SpAN promoter activity in vivo (20-fold), but multimerised
      Sox sites cannot activate a basal promoter.
    supporting_text: Here we show that multimerized SpSoxB1 elements cannot activate transcription from
      the SpAN basal promoter in vivo.
  - statement: SpSoxB1 strongly bends DNA and is proposed to act architecturally at SpAN.
    supporting_text: The results described above suggest a model in which SpSoxB1 promotes transcription
      of the SpAN gene primarily through DNA bending, rather than through transcriptional activation.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified (Kenny et al., Nucleic Acids Res 2001); full text cached, source of
      the DNA-bending and in vivo site-mutagenesis evidence.
- id: PMID:14499650
  title: Tight regulation of SpSoxB factors is required for patterning and morphogenesis in sea urchin
    embryos.
  findings:
  - statement: SpSoxB1 overexpression animalises the embryo, phenocopying loss of nuclear beta-catenin;
      the effect is DNA-binding independent.
    supporting_text: Suppression of vegetal fates involves interference at the protein-protein level because
      a mutation of SpSoxB1 that prevents its binding to DNA does not significantly reduce this activity.
  - statement: SoxB1 loss of function elevates TCF/beta-catenin reporter output in vivo.
    supporting_text: Reduction in SpSoxB1 level results in elevated TCF/Lef-beta-catenin-dependent expression
      of a luciferase reporter gene in vivo, indicating that in the normal embryo this protein suppresses
      the primary vegetal signaling mechanism that is required for specification of mesenchyme and endoderm.
  - statement: Normal SoxB1 is nevertheless required for gastrulation and endoderm differentiation (treated
      here as an indirect requirement).
    supporting_text: Surprisingly, normal expression of SpSoxB1 is required for gastrulation and endoderm
      differentiation, as shown by both morpholino-mediated translational interference and expression
      of a dominant negative protein.
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified (Kenny et al., Development 2003); the key perturbation paper for SoxB1
      antagonism of beta-catenin. Abstract only in cache.
- id: PMID:15689377
  title: SoxB1 downregulation in vegetal lineages of sea urchin embryos is achieved by both transcriptional
    repression and selective protein turnover.
  findings:
  - statement: SoxB1 is cleared from vegetal lineages by beta-catenin-dependent protein turnover that
      can be activated by Pmar1.
    supporting_text: We show that SoxB1 is regulated at the level of protein turnover in these lineages.
      This mechanism is dependent on nuclear beta-catenin function. It can be activated by Pmar1, but
      not by Krl, both of which function downstream of beta-catenin/TCF-Lef.
  - statement: In mesomeres SoxB1 is subject to negative autoregulation.
    supporting_text: However, in mesomeres, SoxB1 appears to be subject to negative autoregulation that
      helps to maintain tight regulation of SoxB1 mRNA levels in presumptive ectoderm.
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified (Angerer et al., Development 2005). Abstract only in cache.
- id: PMID:11152635
  title: 'SpKrl: a direct target of beta-catenin regulation required for endoderm differentiation in sea
    urchin embryos.'
  findings:
  - statement: SpKrl (Blimp1/Krox), a direct beta-catenin/TCF target, represses soxb1 transcription in
      vegetal cells.
    supporting_text: SpKrl negatively regulates expression of the animalizing transcription factor, SpSoxB1.
  full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed-verified (Howard et al., Development 2001); supports the transcriptional arm
      of SoxB1 exclusion from the endomesoderm. Abstract only in cache.
- id: PMID:18413610
  title: Global regulatory logic for specification of an embryonic cell lineage.
  findings:
  - statement: Absence of nuclear SoxB1 is one of the initial micromere-specific character states in the
      skeletogenic GRN, and SoxB1 is regarded as an antagonist of beta-catenin cofactor function.
    supporting_text: SoxB1 is believed to act as an antagonist of the transcriptional cofactor function
      of β-catenin.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed-verified (Oliveri, Tu, Davidson, PNAS 2008); full text cached; places SoxB1 in
      the micromere GRN as the beta-catenin antagonist.
- id: PMID:17855430
  title: Cis-regulatory analysis of nodal and maternal control of dorsal-ventral axis formation by Univin,
    a TGF-beta related to Vg1.
  findings:
  - statement: SoxB1 (with Tcf and Univin) is essential for nodal expression; the nodal 5' module carries
      Sox sites.
    supporting_text: This work shows that Tcf, SoxB1 and Univin play essential roles in the regulation
      of nodal expression in the sea urchin and suggests that some of the regulatory interactions controlling
      nodal expression predate the chordates.
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
