      supporting_text: Regulatory sites that bind SpSoxB1 and CBF (CCAAT binding factor) are essential
        for strong transcriptional activity because mutations of these elements reduce promoter activity
        in vivo 20- and 10-fold, respectively.
    - reference_id: PMID:25655703
      supporting_text: Remarkably, almost all of the regulatory genes specifically expressed within these
        domains are downregulated by interference with SoxB1 expression, implying their common activation
