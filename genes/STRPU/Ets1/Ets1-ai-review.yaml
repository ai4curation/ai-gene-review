- term:
    id: GO:0007501
    label: mesodermal cell fate specification
  evidence_type: IMP
  original_reference_id: PMID:18413610
  qualifier: involved_in
  review:
    summary: >-
      Ets1 is one of the four essential regulators of the skeletogenic micromere lineage
      activated by the double-negative gate. It performs the regulatory work of
      specification directly: it feeds forward into alx1 and tbr and drives the
      differentiation gene batteries. Loss of function gives skeleton-minus embryos in
      S. purpuratus; gain of function in Hemicentrotus and Paracentrotus converts
      non-PMC cells into migratory mesenchyme, and a dominant-negative blocks SM50 and
      spicule formation.
    action: NEW
    reason: >-
      The lineage specified is skeletogenic mesoderm (large micromere/PMC); Ets1 is a
      direct transcriptional driver of the specifying regulatory state, not merely
      required upstream. Comparators Alx1 and Tbr in the same network carry or warrant
      the same term.
    supported_by:
    - reference_id: PMID:18413610
      supporting_text: 'They are four essential regulators of downstream micromere lineage
        function: alx1 ( 29 ), ets1 ( 9 , 33 ), tbr ( 34 , 35 ), and tel ( 9 )'
    - reference_id: PMID:16997294
      supporting_text: Functional analysis of Sp-Ets1/2 has previously demonstrated
        an essential role of this gene in the specification of the skeletogenic mesenchyme
        lineage
    - reference_id: PMID:10096062
      supporting_text: The overexpression of HpEts by mRNA injection into fertilized eggs
        alters the cell fate of non-PMC to migratory PMC
    - reference_id: PMID:14973284
      supporting_text: Overexpression of ets1 by injection of synthetic mRNA in the egg
        caused a dramatic increase in the number of cells becoming mesenchymal at the
        blastula stage
- term:
    id: GO:0010718
    label: positive regulation of epithelial to mesenchymal transition
  evidence_type: IMP
  original_reference_id: PMID:18413610
  qualifier: involved_in
  review:
    summary: >-
      Ets1 target genes are required for ingression (EMT) of the skeletogenic cells:
      ets1 morpholino blocks PMC ingression in S. purpuratus, ERK-phosphorylated Ets1 is
      required for the epithelial-to-mesenchymal transition of PMCs in Paracentrotus,
      and ectopic ets1 mRNA increases the number of cells becoming mesenchymal.
    action: NEW
    reason: >-
      Ets1 is a transcriptional driver of the ingression program (a regulatory role, so
