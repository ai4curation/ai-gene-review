- id: PMID:18413610
  title: Global regulatory logic for specification of an embryonic cell lineage.
  findings:
  - statement: ets1 is one of the four essential regulatory genes activated in the
      skeletogenic micromere lineage by the Pmar1/HesC double-negative gate; it is
      also maternally expressed and later expressed in non-skeletogenic mesoderm.
    supporting_text: 'They are four essential regulators of downstream micromere lineage
      function: alx1 ( 29 ), ets1 ( 9 , 33 ), tbr ( 34 , 35 ), and tel ( 9 )'
  - statement: Ets1 provides a cross-regulatory input into alx1 and is the most common
      positive (A) driver of the skeletogenic differentiation gene batteries.
    supporting_text: the ets1 gene ( 9 ) is used in these gene batteries only as the
      A driver, and it is the most common of these
  - statement: ets1 morpholino produces a skeleton-minus phenotype and blocks
      ingression of the skeletogenic cells.
    supporting_text: both it and alx1 target genes are required for ingression of the
      skeletogenic cells (ref. 36 and Fig. 3 F and G )
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached; the S. purpuratus skeletogenic micromere GRN synthesis,
      with ets1 morpholino data (Fig. 3) and the placement of ets1 as a double-negative
      gate target and A-driver of differentiation genes.
- id: PMID:17636127
  title: 'A missing link in the sea urchin embryo gene regulatory network: hesC and
    the double-negative specification of micromeres.'
  findings:
  - statement: ets1 is repressed outside the micromere lineage by HesC; hesC
      knockdown or global pmar1 expression derepresses ets1 (with delta, alx1 and tbr)
      throughout the embryo, converting all cells to skeletogenic fate.
    supporting_text: if expression of pmar1 is forced to occur globally (by injection
      into the egg of the mRNA), then the delta , tbr , ets1 , alx1 , and downstream
      genes are transcribed in all cells of the embryo, and all cells thereby adopt
      skeletogenic micromere lineage fate
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached; establishes the upstream double-negative-gate control
      of ets1 in S. purpuratus.
- id: PMID:12027443
  title: A regulatory gene network that directs micromere specification in the sea urchin
    embryo.
  findings:
  - statement: Pmar1 (or En-Pmar1) mRNA derepresses delta and the micromere-lineage
      transcription factor genes (including ets1, per later citation of this paper
      as the ets1 source) over most of the embryo.
    supporting_text: 'the effects are derepression: of the delta gene; and of skeletogenic
      genes, including several transcription factors normally expressed only in micromere
      descendants'
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract only cached; ets1 is not named in the abstract, but Oliveri
      et al. 2008 cite this paper (their ref. 9) as the source of the ets1 perturbation
      and expression data.
- id: PMID:16997294
  title: Identification and developmental expression of the ets gene family in the
    sea urchin (Strongylocentrotus purpuratus).
  findings:
  - statement: The S. purpuratus genome has one orthologue per vertebrate ets subfamily;
      the Ets1/Ets2 orthologue (Sp-Ets1/2) is maternally expressed and zygotically
      expressed exclusively in mesenchyme cells and their progenitors.
    supporting_text: five of the nine sea urchin ets genes expressed during embryogenesis
      are exclusively (Sp-Ets1/2, Sp-Erg, Sp-Ese) or additionally (Sp-Tel, Sp-Pea)
      expressed in mesenchyme cells and/or their progenitors
  - statement: Sp-Ets1/2 has an essential role in specification of the skeletogenic
      mesenchyme lineage.
    supporting_text: Functional analysis of Sp-Ets1/2 has previously demonstrated
      an essential role of this gene in the specification of the skeletogenic mesenchyme
      lineage
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract only cached; the genome survey that establishes Sp-Ets1/2
      as the single Ets1/2-class gene, which anchors the identity of Q26645 (NCBI Gene
      373306, ets1).
- id: PMID:16574094
  title: cis-Regulatory control of cyclophilin, a member of the ETS-DRI skeletogenic
    gene battery in the sea urchin embryo.
  findings:
  - statement: Ets1 is a direct driver of the skeletogenic differentiation gene Sp-cyp1;
      Ets1 target sites in a 218-bp cis-regulatory module are required for expression
      and loss of the Ets1 input depresses reporter activity.
    supporting_text: elimination of either Ets1 or Dri inputs severely depresses the
      activity of expression constructs containing this DNA fragment; and that Ets1
      and Dri target sites within the 218 bp fragment are required for normal expression.
      This indicates that the predicted inputs are direct.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract only cached; S. purpuratus reporter/cis-regulatory analysis
      giving the direct activator evidence for Ets1.
- id: PMID:19679118
  title: 'The cis-regulatory system of the tbrain gene: Alternative use of multiple
    modules to promote skeletogenic expression in the sea urchin embryo.'
  findings:
  - statement: Ets1/2 is a positive input into the distal module of the tbr
      cis-regulatory system; ets1/2 MASO reduces module activity and ets1/2 mRNA drives
      ectopic expression.
    supporting_text: a dedicated distal module utilizing positive Ets1/2 inputs contributes
      to definitive expression in the skeletogenic mesenchyme
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached; S. purpuratus cis-regulatory analysis of tbr with
      ets1/2 MASO and mRNA co-injections.
- id: PMID:20181745
  title: Activation of the skeletogenic gene regulatory network in the early sea urchin
    embryo.
  findings:
  - statement: Ets1 (and MAPK signaling) maintain, but do not initiate, alx1 expression
      in the skeletogenic lineage.
    supporting_text: this gene is regulated by MAPK signaling and by the transcription
      factor Ets1; however, these inputs influence only the maintenance of alx1 expression
      and not its activation
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract only cached; refines the ets1 to alx1 linkage (maintenance
      input).
- id: PMID:14973284
  title: A Raf/MEK/ERK signaling pathway is required for development of the sea urchin
    embryo micromere lineage through phosphorylation of the transcription factor Ets.
  findings:
  - statement: Ets1 is an ERK target; overexpression of ets1 mRNA converts extra cells
      to mesenchyme, and T107 phospho-site mutants are constitutively active (T107D)
      or inactive (T107A).
    supporting_text: Overexpression of ets1 by injection of synthetic mRNA in the egg
      caused a dramatic increase in the number of cells becoming mesenchymal at the
      blastula stage
  - statement: MAPK-dependent Ets1 activity is required for PMC specification and
      their epithelial-mesenchymal transition.
    supporting_text: the MAP kinase pathway, working through phosphorylation of Ets1,
      is required for full specification of the PMCs and their subsequent transition
      from epithelial to mesenchymal state
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract only cached. Experiments were done in Paracentrotus lividus,
      so used as corroboration; the Q26645 sequence carries the same P-P-T107-P motif,
      so the mechanism is expected to be conserved.
- id: PMID:10096062
  title: HpEts, an ets-related transcription factor implicated in primary mesenchyme
    cell differentiation in the sea urchin embryo.
  findings:
  - statement: HpEts (Hemicentrotus ets1/2 orthologue) overexpression converts non-PMC
      cells to migratory PMCs and induces SM50; a dominant-negative form blocks SM50
      and spicule formation.
    supporting_text: The overexpression of HpEts by mRNA injection into fertilized eggs
      alters the cell fate of non-PMC to migratory PMC
  - statement: The SM50 upstream region contains a functional positive ets site.
    supporting_text: In the upstream region of the SM50 gene there exists an ets binding
      site that functions as a positive cis-regulatory element
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract only cached. Hemicentrotus pulcherrimus orthologue (HpEts);
      the founding functional study, used as corroboration of the S. purpuratus data.
- id: PMID:21303847
  title: The control of foxN2/3 expression in sea urchin embryos and its function in
    the skeletogenic gene regulatory network.
  findings:
  - statement: Dominant-negative Ets1 blocks foxN2/3 expression in micromeres.
    supporting_text: Expression of dominant-negative Ets1 blocked foxN2/3 expression
      in the micromeres
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text cached; Lytechinus variegatus, so corroborative only.
- id: PMID:24496631
  title: Genome-wide analysis of the skeletogenic gene regulatory network of sea urchins.
  findings:
  - statement: Genome-wide RNA-seq identified functional targets of Ets1 among >200
      PMC effector genes.
    supporting_text: functional targets of Ets1 and Alx1, two pivotal, early transcription
      factors in the PMC GRN
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract only cached; breadth of Ets1 effector targets in S. purpuratus.
- id: PMID:29558892
  title: Global analysis of primary mesenchyme cell cis-regulatory modules by chromatin
    accessibility profiling.
  findings:
  - statement: Ets1 binding motifs are significantly enriched in PMC cis-regulatory
      modules.
    supporting_text: Binding sites for Ets1 and Alx1, two PMC-enriched transcription
      factors that have direct or indirect inputs into half of the known PMC effector
      genes in the PMC gene regulatory network [21], were found to be significantly
      enriched
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text cached; S. purpuratus ATAC-seq of PMCs, motif enrichment
      only (no direct Ets1 binding assay).
- id: PMID:20680330
  title: Functional evolution of Ets in echinoderms with focus on the evolution of
    echinoderm larval skeletons.
  findings:
  - statement: Ets1/2 is a central regulator of larval skeletogenic mesenchyme differentiation
      in sea urchins and an ancestral larval mesoderm regulator in echinoderms.
    supporting_text: In sea urchins, Ets1/2 plays a central role in the differentiation
      of larval skeletogenic mesenchyme cells
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Abstract only cached; evolutionary context (starfish/sea urchin
      comparison), background only.
