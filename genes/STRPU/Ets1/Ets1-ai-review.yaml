core_functions:
- description: >-
    ERK-activated ETS-domain transcriptional activator of the skeletogenic (primary
    mesenchyme cell) regulatory state in the large micromere lineage: turned on by the
    Pmar1/HesC double-negative gate, it maintains alx1, activates tbr and foxN2/3, and
    is the principal positive driver of the differentiation gene batteries required for
    PMC ingression and calcite biomineralization.
