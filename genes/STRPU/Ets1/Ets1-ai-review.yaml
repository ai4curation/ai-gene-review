      PAINT places a generic cell-differentiation role at the ETS family node, drawing on
      the many lineage-differentiation roles of vertebrate ETS factors. For the sea urchin
      gene the role is specific and well characterized: Ets1 is an essential regulator of
      the skeletogenic mesenchyme (PMC) lineage, whose loss gives skeleton-minus embryos
      and whose ectopic expression converts non-PMC cells to mesenchyme.
    action: MODIFY
    reason: >-
      The IBA is not wrong, but the informative term for this gene is the specification of
      the mesodermal (skeletogenic mesenchyme) cell fate, proposed as the replacement and
      as a NEW row.
    proposed_replacement_terms:
    - id: GO:0007501
      label: mesodermal cell fate specification
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - GRANULARITY_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN000218930
        source_status: SUPPORTS_TRANSFER
        comment: ETS-family node seeded by vertebrate, fly and worm ETS factors with lineage-differentiation roles; the transfer of a differentiation role to Sp-Ets1 is sound, but the family-level term is far less specific than the skeletogenic mesenchyme specification role established experimentally in S. purpuratus.
    supported_by:
    - reference_id: PMID:16997294
      supporting_text: Functional analysis of Sp-Ets1/2 has previously demonstrated
        an essential role of this gene in the specification of the skeletogenic mesenchyme
        lineage
    - reference_id: PMID:18413610
      supporting_text: interference with their expression produces a skeleton-minus phenotype,
        as illustrated in Fig. 3 B–G for tbr , hex , tgif , ets1 , and alx1
