  knowledge_gaps:
  - gap_statement: >-
      Direct DNA binding of S. purpuratus Ets1 to its cis-regulatory target sites has
      not been shown biochemically (no EMSA or ChIP is cached); the direct-input
      inference rests on site mutagenesis in reporter constructs and motif enrichment.
    boundary: >-
      Requirement of Ets1 target sites in the Sp-cyp1 module and of an ets site in the
      SM50 promoter, and enrichment of Ets1 motifs in PMC cis-regulatory modules, are
      established.
    gap_kind:
    - BIOLOGY
  - gap_statement: >-
      Whether the cofactor(s) that direct Ets1/2 to the skeletogenic rather than the
      general mesodermal target set, and the role of the PNT domain in that choice,
      have been identified.
    boundary: >-
      Starfish Ets1/2 injected into sea urchin eggs induces mesenchyme and part of the
      skeletogenic program, implicating unidentified cofactors rather than the factor
      itself.
    gap_kind:
    - BIOLOGY
suggested_questions:
- question: Is the later Ets1 input into non-skeletogenic mesoderm (where ets1 expression
    expands after ingression) a distinct regulatory function that would warrant an
    additional mesoderm-development annotation, or is it covered by mesodermal cell fate
    specification?
- question: Does ERK phosphorylation of T107 regulate Ets1 DNA binding, its interaction
    with a coactivator, or its stability, and is the same mechanism operative in S.
    purpuratus as shown in P. lividus?
- question: Is ets1 auto-activation (proposed from network analysis) a direct
    cis-regulatory input, which would justify an autoregulation annotation?
suggested_experiments:
- description: ChIP-seq (or CUT&RUN) of tagged Sp-Ets1 in PMCs at mesenchyme blastula
    stage, combined with EMSA on the Sp-cyp1 and tbr distal module ETS sites, to
    establish direct binding genome-wide and distinguish direct from indirect Ets1
    inputs in the PMC GRN.
- description: Phospho-site mutant (T107A/T107D) rescue of ets1 morphants in S.
    purpuratus, scored for alx1/tbr expression and PMC ingression, to confirm that ERK
    phosphorylation is the switch for Ets1 activity in this species.
