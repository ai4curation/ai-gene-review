  review:
    summary: GataC is a two-zinc-finger GATA1/2/3-class transcription factor (InterPro TF_GATA-2/3 family
      hit). In S. purpuratus it is a transcription factor gene of the oral non-skeletogenic mesoderm whose
      knockdown alters the later expression of immune effector genes in blastocoelar cells, consistent
      with sequence-specific transcription factor activity at RNA polymerase II genes. No direct DNA-binding
      or reporter assay of a GataC target is cached, so the electronic term is retained as the carrier
      of the core molecular function rather than replaced by an activator or repressor child.
    action: ACCEPT
    reason: Core molecular function; the family assignment is confirmed by the originating coelomocyte
      cDNA paper (GATA-2/3 homologue) and by the loss-of-function effect on effector gene expression.
      The sign of regulation is not documented in the cached literature, so no activator/repressor term
      is proposed.
    supported_by:
    - reference_id: PMID:10398804
      supporting_text: 'Three coelomocyte genes reported here encode transcription factors. These are an
        NFKB homologue (SpNFKB); a GATA-2/3 homologue (SpGATAc); and a runt domain factor (SpRunt-1).'
    - reference_id: PMID:23792116
      supporting_text: 'Here we characterize the oral NSM expression and downstream function of two homologs
        of key vertebrate hematopoietic transcription factors: SpGatac, an ortholog of vertebrate Gata-1/2/3
        and SpScl, an ortholog of Scl/Tal-2/Lyl-1.'
    - reference_id: PMID:23792116
      supporting_text: Perturbation of SpGatac affects blastocoelar cell migration at gastrulation and
        later expression of immune effector genes, whereas interference with SpScl function disrupts segregation
        of pigment and blastocoelar cell precursors.
