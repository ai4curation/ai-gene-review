- id: PMID:10398804
  title: 'Origins of immunity: transcription factors and homologues of effector genes
    of the vertebrate immune system expressed in sea urchin coelomocytes.'
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Immunogenetics 1999;49:773-86); the RX reference of UniProt O77156
      and the paper that cloned SpGATAc (EMBL AF077674) from S. purpuratus coelomocytes
      and assigned it to the GATA-2/3 class. Abstract only cached.
  findings:
  - statement: SpGATAc was cloned from coelomocytes as a GATA-2/3 homologue, alongside SpNFKB and SpRunt-1.
    supporting_text: 'Three coelomocyte genes reported here encode transcription factors. These are an
      NFKB homologue (SpNFKB); a GATA-2/3 homologue (SpGATAc); and a runt domain factor (SpRunt-1).'
  - statement: SpGATAc transcripts in coelomocytes disappear within hours of bacterial injection, whereas
      sham injection does not affect them.
    supporting_text: 'All three of these coelomocyte genes respond sharply to bacterial challenge: SpNFKB
      and SpRunt-1 genes are rapidly up-regulated, while transcripts of SpGATAc factor disappear within
      hours of injection of bacteria.'
- id: PMID:23792116
  title: An ancient role for Gata-1/2/3 and Scl transcription factor homologs in the development of immunocytes.
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Solek et al., Dev Biol 2013;382:280-92). The primary functional
      paper for SpGatac (oral NSM expression, morpholino phenotype, cis-regulatory
      repression by Gcm). Only the abstract is cached, so the identity and direction of
      the affected immune effector genes and the reporter-construct details are not
      recorded here.
  findings:
  - statement: SpGatac is the sea urchin ortholog of vertebrate Gata-1/2/3 and is expressed in the oral non-skeletogenic
      mesoderm.
    supporting_text: 'Here we characterize the oral NSM expression and downstream function of two homologs
      of key vertebrate hematopoietic transcription factors: SpGatac, an ortholog of vertebrate Gata-1/2/3
      and SpScl, an ortholog of Scl/Tal-2/Lyl-1.'
  - statement: SpGatac knockdown affects blastocoelar cell migration at gastrulation and the later expression
      of immune effector genes.
    supporting_text: Perturbation of SpGatac affects blastocoelar cell migration at gastrulation and later
      expression of immune effector genes, whereas interference with SpScl function disrupts segregation
      of pigment and blastocoelar cell precursors.
  - statement: Cis-regulatory analysis of the gatac gene shows direct repression by Gcm in presumptive pigment
      cells.
    supporting_text: Regulatory analysis of SpGatac indicates that oral NSM identity is directly suppressed
      in presumptive pigment cells by the transcription factor SpGcm.
  - statement: Homologs of the vertebrate GATA/Scl complex partners (E-protein, Lmo2) are co-expressed in the
      oral NSM.
    supporting_text: Homologs of several transcription regulators that interact with Gata-1/2/3 and Scl
      factors in vertebrate hematopoiesis are also co-expressed in the oral NSM, including SpE-protein,
      the sea urchin homolog of vertebrate E2A/HEB/E2-2 and SpLmo2, an ortholog of a dedicated cofactor
      of the Scl-GATA transcription complex.
- id: PMID:23261933
  title: Diversification of oral and aboral mesodermal regulatory states in pregastrular sea urchin embryos.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text cached (Materna, Ransick, Li & Davidson, Dev Biol 2013;375:92-104). Time
      course of gataC activation in the oral NSM, its ectopic expansion after gcm or gataE
      knockdown, and the negative result that GataC MASO does not affect any pre-gastrular
      regulatory gene.
  findings:
  - statement: gataC and prox1 are the first oral NSM-specific transcription factor genes, activated at 17-18
      hpf.
    supporting_text: 'The first transcription factor genes specific to the oral NSM, prox1 and gataC, are
      transcriptionally activated in this region between 17 and 18 hpf (Fig. 1B,T), which is significantly
      later than the onset of Nodal transcription at about 8–9 hpf (Fig. 1B).'
  - statement: Knockdown of the aboral regulators gcm or gataE expands gataC expression into the whole NSM.
    supporting_text: If gcm or gataE expression are blocked by treatment with MASOs we see an expansion
      of ese, prox1, gataC, and erg expression (the same is seen for shr2 expression; not shown).
  - statement: GataC knockdown has no effect on regulatory genes before gastrulation.
    supporting_text: GataC MASO treatment does not affect any regulatory genes pre-gastrulation (Supp.
      Fig. 4; Solek and Rast, personal communication)
  - statement: The oral NSM gives rise to the blastocoelar cells, which have immune functions in the larva.
    supporting_text: About one-third of the NSM cells, located in a V-shaped sector directly beneath the
      oral ectoderm, give rise upon gastrulation to a particular mesenchymal cell type known as blastocoelar
      cells (Ruffins and Ettensohn, 1996).
- id: PMID:22306924
  title: A comprehensive analysis of Delta signaling in pre-gastrular sea urchin embryos.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Full text cached (Materna & Davidson, Dev Biol 2012;364:77-87). Establishes that gataC
      is an oral-mesoderm-specific gene dependent on Delta/Notch signaling by 18 hpf; direct
      versus indirect input not resolved.
  findings:
  - statement: gataC is among the mesodermal transcription factor genes dependent on Delta/Notch signaling
      at 18 hpf, and is specifically expressed in the oral mesoderm.
    supporting_text: These genes encode the transcription factors Prox1, GataC, and Ese and are activated
      at around 16 hpf (Materna et al., 2010). The prox1, gataC, and ese genes are of particular interest
      because they are specifically expressed in the oral mesoderm (Fig. 6) (Poustka et al., 2007; Rizzo
      et al., 2006).
  - statement: Whether the Delta/Notch input into gataC is direct is unresolved.
    supporting_text: One or more of prox1, ese, and gataC could potentially be directly activated by D/N
      signaling as well.
- id: PMID:17506889
  title: 'A global view of gene expression in lithium and zinc treated sea urchin embryos: new components
    of gene regulatory networks.'
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
