suggested_questions:
- question: Which immune effector genes of the blastocoelar cells are direct GataC targets, and does GataC
    activate or repress them?
- question: Does GataC form an Scl/Lmo2/E-protein complex in sea urchin oral mesoderm cells as its orthologs
    do in vertebrate hematopoietic cells?
- question: Is the Delta/Notch input into gatac direct (Su(H) sites in the gatac cis-regulatory module) or
    relayed through other oral NSM regulators?
- question: What is the function of GataC in adult coelomocytes, given that its transcripts disappear rather
    than rise after bacterial challenge?
suggested_experiments:
- description: ChIP-seq or DNA-affinity capture of tagged GataC in gastrula-stage embryos to map its genomic
    occupancy and identify direct targets among the blastocoelar cell effector genes.
  experiment_type: ChIP-seq
- description: Single-cell RNA-seq of control and gatac morphant larvae to define which blastocoelar cell
    subtypes and effector genes depend on GataC.
  experiment_type: single-cell RNA-seq
