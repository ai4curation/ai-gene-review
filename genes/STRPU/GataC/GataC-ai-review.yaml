id: O77156
gene_symbol: GataC
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7668
  label: Strongylocentrotus purpuratus
description: GataC (SpGATAc, Sp-GataC) is the sea urchin GATA1/2/3-class zinc-finger transcription factor,
  with two tandem GATA-type zinc fingers flanked by disordered regions. In the embryo it is one of the
  first two transcription factor genes (with prox1) to be switched on specifically in the oral
  non-skeletogenic mesoderm at 17-18 hours post fertilization, downstream of Delta/Notch signaling and
  Nodal-dependent oral-aboral patterning, and it is excluded from the aboral (pigment cell) mesoderm by
  the Gcm/GataE regulatory state, with Gcm acting directly on the gatac gene. The oral mesoderm cells
  that express it become the blastocoelar cells, the migratory immunocytes of the larva; knockdown of
  gatac does not alter the pre-gastrular regulatory genes but perturbs blastocoelar cell migration at
  gastrulation and the later expression of immune effector genes. It is co-expressed with sea urchin
  homologs of Scl, Lmo2 and E-proteins, the partners of vertebrate GATA1/2/3 in hematopoietic complexes.
  In adults gatac is expressed in coelomocytes, the circulating immune cells, where its transcripts fall
  sharply within hours of bacterial challenge.
