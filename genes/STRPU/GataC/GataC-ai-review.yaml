- term:
    id: GO:0002520
    label: immune system development
  evidence_type: IMP
  original_reference_id: PMID:23792116
  qualifier: involved_in
  review:
    summary: The oral non-skeletogenic mesoderm cells that express gatac give rise to the blastocoelar
      cells, the immunocytes of the larva. Morpholino knockdown of SpGatac perturbs blastocoelar cell
      migration at gastrulation and the later expression of immune effector genes, so GataC is a transcriptional
      driver of immunocyte development, paralleling the hematopoietic roles of vertebrate GATA1/2/3 with
      which it shares co-expressed Scl, Lmo2 and E-protein partners. The gene is also expressed in adult
      coelomocytes.
    action: NEW
    reason: 'Participation test: GataC is the transcription factor that regulates effector gene expression
      in the developing immunocytes, so it performs part of the developmental program rather than merely
      being required for it. Comparator check: human GATA3 carries GO:0002520 and GATA1 carries hemopoiesis
      descendant terms, so lineage-development terms are the convention for this class. Evidence is IMP
      from the SpGatac morpholino phenotype; the cached record is abstract-only, so the identity and direction
      of the effector genes affected are not recorded here. No mesoderm specification term is proposed because
      GataC knockdown does not affect any pre-gastrular regulatory gene.'
    supported_by:
    - reference_id: PMID:23792116
      supporting_text: Perturbation of SpGatac affects blastocoelar cell migration at gastrulation and
        later expression of immune effector genes, whereas interference with SpScl function disrupts segregation
        of pigment and blastocoelar cell precursors.
    - reference_id: PMID:23792116
      supporting_text: Larval immunocytes, including pigment cells and several blastocoelar cell subtypes,
        emerge from a population of non-skeletal mesodermal (NSM) precursors that is specified at the blastula
        stage.
    - reference_id: PMID:23261933
      supporting_text: 'The first transcription factor genes specific to the oral NSM, prox1 and gataC,
        are transcriptionally activated in this region between 17 and 18 hpf (Fig. 1B,T), which is significantly
        later than the onset of Nodal transcription at about 8–9 hpf (Fig. 1B).'
    - reference_id: PMID:23261933
      supporting_text: About one-third of the NSM cells, located in a V-shaped sector directly beneath
        the oral ectoderm, give rise upon gastrulation to a particular mesenchymal cell type known as blastocoelar
        cells (Ruffins and Ettensohn, 1996).
    - reference_id: PMID:10398804
      supporting_text: 'All three of these coelomocyte genes respond sharply to bacterial challenge: SpNFKB
        and SpRunt-1 genes are rapidly up-regulated, while transcripts of SpGATAc factor disappear within
        hours of injection of bacteria.'
