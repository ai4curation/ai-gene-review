  review:
    summary: 'InterPro2GO mapping from the Fork-head domain signatures. Consistent with the functional
      record: FoxN2/3 is a Forkhead transcription factor whose knockdown in the micromere lineage abolishes
      the early expression of a battery of skeletogenic effector genes (sm30, sm50, msp130, VEGFR). Direct
      binding of FoxN2/3 to any target cis-regulatory module has not been shown, and the only sign demonstrated
