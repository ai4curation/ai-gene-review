taxon:
  id: NCBITaxon:7668
  label: Strongylocentrotus purpuratus
description: 'FoxN2/3 is a Forkhead (Fox) family transcription factor with a single winged-helix Fork-head
  DNA-binding domain; the sea urchin gene is equally related to the vertebrate FOXN2 and FOXN3 genes and
  is one of only two FoxN subfamily members in the genome (the other being FoxN1/4). In the embryo it
  is expressed in a dynamic, sequential pattern: transcripts first appear in the large micromere descendants
  (the precursors of the skeletogenic primary mesenchyme cells, PMCs) at the hatched blastula stage, are
  switched off in these cells as they ingress at the mesenchyme blastula stage, and then appear in the
  non-skeletogenic mesoderm and later in the endoderm of the mid- and hindgut. In the micromere lineage
  the gene lies downstream of maternal beta-catenin and the Pmar1/HesC double-negative gate and is activated
  by Ets1 and Tbr (Tbr being necessary but not sufficient), but not by Alx1; the later mesodermal and
  endodermal phases are driven independently of the micromere phase and of Delta/Notch signalling. During
  its brief window in the PMC precursors FoxN2/3 is an early transcriptional input into the skeletogenic
  effector gene battery: loss of function abolishes the early expression of the skeletal matrix genes
  (sm30, sm50, msp130) and of the VEGF receptor in PMCs, delays or blocks PMC ingression (epithelial-mesenchymal
  transition), and renders PMCs unable to join the syncytium that deposits the calcite larval skeleton,
  so that morphant PMCs remain in the blastocoel and the skeleton is malformed or absent. Target expression
  recovers at later stages, indicating that FoxN2/3 initiates rather than maintains the skeletogenic program.
  The orthologue is expressed in the prospective mesoderm of all echinoderms examined, including sea stars
  that lack skeletogenic mesenchyme, so the gene is thought to belong to an ancestral echinoderm mesoderm
  regulatory program.'
