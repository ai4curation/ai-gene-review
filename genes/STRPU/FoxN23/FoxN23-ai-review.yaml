- id: PMID:17081512
  title: 'Sea urchin Forkhead gene family: phylogeny and embryonic expression.'
  findings:
  - statement: Genome-wide survey of the 22 S. purpuratus fox genes, including the cloning of FoxN2/3
      (EMBL DQ286744); almost all fox genes are expressed in specific spatiotemporal patterns during embryogenesis.
    supporting_text: All but one of the S. purpuratus fox genes (SpfoxQ1) are expressed during embryogenesis,
      most in a very specific temporal and spatial manner.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed-verified (Dev Biol 2006;300:49-62); this is the paper cited on the UniProt RX
      line and the source of the Q2V887 cDNA. Only the abstract is cached, which does not mention foxN2/3
      specifically; its S. purpuratus expression data for foxN2/3 are known only through later citations
      (Rho and McClay 2011; Materna and Davidson 2013).
- id: PMID:21303847
  title: The control of foxN2/3 expression in sea urchin embryos and its function in the skeletogenic
    gene regulatory network.
  findings:
  - statement: foxN2/3 is expressed transiently in the micromere (PMC precursor) lineage from hatched
      blastula to mesenchyme blastula, then in non-skeletogenic mesoderm and later endoderm.
    supporting_text: Expression of foxN2/3 mRNA begins in micromeres at the hatched blastula stage and
      then is lost from micromeres at the mesenchyme blastula stage. foxN2/3 expression then shifts to
      the non-skeletogenic mesoderm and, later, to the endoderm.
  - statement: In micromeres foxN2/3 is activated downstream of Pmar1 by Ets1 and Tbr, not Alx1.
    supporting_text: Here, we show that Pmar1, Ets1 and Tbr are necessary for activation of foxN2/3 in
      micromeres.
  - statement: FoxN2/3 is required for early expression of skeletal matrix genes and of VEGFR, for PMC
      ingression, and for PMC incorporation into the skeletogenic syncytium; target expression recovers
      later.
    supporting_text: Thus, FoxN2/3 is necessary for normal ingression, for expression of several skeletal
      matrix genes, for preventing transfating and for fusion of the PMC syncytium.
  - statement: The study was performed in Lytechinus variegatus; the expression pattern matched that published
      for S. purpuratus.
    supporting_text: In this study, foxN2/3 was cloned from Lytechinus variegatus and its regulation and
      function were investigated.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified (Development 2011;138:937-45, PMC3035096); full text cached. The only
      dedicated functional study of foxN2/3. Experiments (two translation-blocking morpholinos with 5'UTR-reporter
      specificity controls and mRNA rescue, micromere transplantation, QPCR/WMISH of targets) were done
      in Lytechinus variegatus, not S. purpuratus; the authors state the expression pattern is the same
      as that reported for S. purpuratus by Tu et al. 2006. Used as the primary functional evidence for
      the S. purpuratus orthologue, with the cross-species caveat recorded on every row that depends on
      it.
- id: PMID:24598159
  title: Sub-circuits of a gene regulatory network control a developmental epithelial-mesenchymal transition.
  findings:
  - statement: foxn2/3 is one of 13 PMC transcription factors each required for the PMC epithelial-mesenchymal
      transition; its knockdown gave the most pronounced failure of apical constriction and cell-shape
      change.
    supporting_text: Three TFs highest in the GRN specified and activated EMT (alx1, ets1, tbr) and the
      10 TFs downstream of those (tel, erg, hex, tgif, snail, twist, foxn2/3, dri, foxb, foxo) were also
      required for EMT.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified (Development 2014;141:1503-13); full text cached. Independent morpholino
      knockdown of foxn2/3 with live imaging and morphometrics of EMT, again in Lytechinus variegatus.
- id: PMID:30264451
  title: 'From genome to anatomy: The architecture and evolution of the skeletogenic gene regulatory network
    of sea urchins and other echinoderms.'
  findings:
  - statement: foxN2/3 is listed among the regulatory genes expressed selectively in the S. purpuratus
      large micromere-PMC lineage and is downstream of beta-catenin and pmar1.
    supporting_text: overexpression of pmar1 or a form of cadherin that interferes with β-catenin function
      have shown that erg, foxN2/3, hex, tel, and tgif are all downstream of β-catenin and pmar1 (Oliveri
      et al., 2008; see also Rho and McClay, 2011, with respect to foxN2/3)
  - statement: foxN2/3 orthologues are expressed in the prospective mesoderm of sea stars and sea cucumbers,
      suggesting membership of an ancestral echinoderm mesoderm specification network.
    supporting_text: This mechanism can therefore be viewed as part of a basal mesoderm specification
      network which likely includes the regulatory genes ets1, hex, erg, tgif, and foxN2/3, as well as
      the signaling gene delta.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Review article (Shashikant and Ettensohn, Genesis 2018); full text cached. Used for
      the S. purpuratus GRN placement and the evolutionary context.
- id: PMID:20398801
  title: High accuracy, high-resolution prevalence measurement for the majority of locally expressed regulatory
    genes in early sea urchin development.
  findings:
  - statement: foxn2/3 transcript prevalence was measured by nCounter and QPCR through early S. purpuratus
