- term:
    id: GO:0045944
    label: positive regulation of transcription by RNA polymerase II
  evidence_type: ISS
  original_reference_id: PMID:21303847
  qualifier: involved_in
  review:
    summary: FoxN2/3 knockdown (two independent morpholinos, mRNA-rescued) abolishes the early expression
      of the skeletal matrix genes sm30, sm50 and msp130 and of the VEGF receptor in PMCs, and foxN2/3
      is one of the transcription factors that provide the parallel inputs activating the skeletogenic
      effector battery. The sign is activation; whether the inputs are direct is not known. Evidence is
      from the Lytechinus variegatus orthologue.
    action: NEW
    reason: 'Loss-of-function evidence that FoxN2/3 is required for activation of multiple protein-coding
      (RNA polymerase II) target genes; the gene product is the transcription factor providing the input,
      so it performs the regulatory step. The sign-neutral GOA parent GO:0006355 is kept and this child
      adds the demonstrated direction. The evidence is cross-species and loss-of-function only, so no
      activator MF child is proposed. Evidence code: the functional data are from the Lytechinus variegatus
      orthologue, not from S. purpuratus, so the row is coded ISS (sequence-orthology transfer) rather
      than IMP, following the convention used for Snail in this batch.'
    supported_by:
    - reference_id: PMID:21303847
      supporting_text: When we examined other skeletogenic genes by QPCR in FoxN2/3 KD embryos, sm30 and
        sm50 expression levels were also strongly reduced, consistent with the hypothesis that many skeletogenic
        genes require FoxN2/3 input
    - reference_id: PMID:21303847
      supporting_text: Thus, although FoxN2/3 is part of the GRN that activates skeletogenic genes and
        the VEGFR , it is not likely to be involved in long-term maintenance of that expression.
- term:
    id: GO:0010718
    label: positive regulation of epithelial to mesenchymal transition
  evidence_type: ISS
  original_reference_id: PMID:21303847
  qualifier: involved_in
  review:
    summary: FoxN2/3 is required for the timely ingression of the PMCs, the epithelial-mesenchymal transition
      of the sea urchin embryo. Two independent studies in Lytechinus variegatus show that foxN2/3 morphants
      fail to ingress on schedule; in a 13-factor comparison foxn2/3 knockdown gave the most pronounced
      defect in apical constriction and cell-shape change, and transplanted morphant micromeres show that
      the requirement is cell-autonomous. FoxN2/3 is a transcription factor acting on the effector program,
      hence the regulation term rather than GO:0001837.
    action: NEW
    reason: 'Regulatory (not executional) role in EMT supported by morpholino phenotypes in two independent
      studies. Comparator check: the upstream PMC regulators Alx1 and Ets1 in this directory carry the
      same term for the same role. Evidence is from L. variegatus. Evidence code: the functional data
      are from the Lytechinus variegatus orthologue, not from S. purpuratus, so the row is coded ISS (sequence-orthology
      transfer) rather than IMP, following the convention used for Snail in this batch. Term choice note:
      Snail in this directory carries the executional term GO:0001837 epithelial to mesenchymal transition
      because it directly silences cadherin, whereas Twist and FoxN2/3 carry the regulatory term GO:0010718
      because their inputs into the de-adhesion sub-circuit are indirect.'
    supported_by:
    - reference_id: PMID:21303847
      supporting_text: Knockdown of FoxN2/3 inhibits normal PMC ingression and foxN2/3 morphant PMCs do
        not organize in the blastocoel and fail to join the PMC syncytium.
    - reference_id: PMID:24598159
      supporting_text: Foxn2/3 was the only knockdown with a non-apically constricted shape significantly
        different from the mean shape for the duration of the time-course.
