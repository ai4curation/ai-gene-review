    correctness: VERIFIED
    review_notes: Full text cached; S. purpuratus expression time course only (Materna et al. 2010), used
      to anchor the S. purpuratus expression data.
- id: PMID:23261933
  title: Diversification of oral and aboral mesodermal regulatory states in pregastrular sea urchin embryos.
  findings:
  - statement: In S. purpuratus foxN2/3 is initially expressed in the skeletogenic lineage and then turns
      on in the non-skeletogenic mesoderm before gastrulation.
    supporting_text: though initially expressed in the skeletogenic lineage the zinc finger gene z48 as
