    supporting_text: 'the nCounter prevalence data are usually higher than those obtained with QPCR and
      they remain higher by a constant factor throughout their expression (Fig. 2: alx1, dach, e2a, erg,
      foxn2/3, myc, otxb1/2, soxc)'
  reference_review:
