core_functions:
- description: Forkhead transcription factor acting transiently in the skeletogenic (primary mesenchyme
    cell) lineage, downstream of Pmar1, Ets1 and Tbr, as one of the early parallel inputs that activate
    the skeletogenic effector gene battery (skeletal matrix genes sm30, sm50, msp130 and the VEGF receptor);
    through these outputs it is required for timely PMC ingression (epithelial-mesenchymal transition),
    for PMC fusion into the skeletogenic syncytium and for normal formation of the calcite larval skeleton.
    Functional evidence is from the Lytechinus variegatus orthologue.
  molecular_function:
    id: GO:0003700
    label: DNA-binding transcription factor activity
  directly_involved_in:
  - id: GO:0045944
    label: positive regulation of transcription by RNA polymerase II
  - id: GO:0010718
    label: positive regulation of epithelial to mesenchymal transition
  - id: GO:0070169
    label: positive regulation of biomineral tissue development
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:21303847
    supporting_text: Thus, FoxN2/3 is necessary for normal ingression, for expression of several skeletal
      matrix genes, for preventing transfating and for fusion of the PMC syncytium.
  - reference_id: PMID:21303847
    supporting_text: Here, we show that Pmar1, Ets1 and Tbr are necessary for activation of foxN2/3 in
      micromeres.
  - reference_id: PMID:24598159
    supporting_text: Three TFs highest in the GRN specified and activated EMT (alx1, ets1, tbr) and the
      10 TFs downstream of those (tel, erg, hex, tgif, snail, twist, foxn2/3, dri, foxb, foxo) were also
      required for EMT.
  knowledge_gaps:
  - gap_statement: No functional data exist for the S. purpuratus protein itself; all perturbation evidence
      is from Lytechinus variegatus, and no direct target (cis-regulatory module or binding site) of FoxN2/3
      has been identified in any sea urchin, so it is unknown whether the inputs into sm30, sm50, msp130
      and VEGFR are direct.
    boundary: The S. purpuratus expression pattern (PMC lineage, then NSM, then endoderm) and the Lytechinus
      loss-of-function phenotypes are established; direct binding and the S. purpuratus phenotype are
      not.
    gap_kind:
    - BIOLOGY
  - gap_statement: The function of the later, independently regulated non-skeletogenic mesoderm and endoderm
      phases of foxN2/3 expression is unknown; morphants show delayed archenteron invagination but this
      has not been separated from the PMC defect.
    boundary: Expression in NSM and gut is documented in both species; no tissue-specific perturbation
      of those phases has been done.
    gap_kind:
    - BIOLOGY
suggested_questions:
- question: Does FoxN2/3 bind directly to the cis-regulatory modules of the skeletal matrix genes and
    VEGFR in S. purpuratus (which would justify RNA polymerase II-specific and activator MF terms), or
    are its inputs relayed through other PMC transcription factors?
- question: Is the FoxN2/3-dependent step in PMC syncytium formation a transcriptional output (e.g. a
    fusogen or adhesion gene) that would support a specific cell-cell fusion annotation?
suggested_experiments:
- description: ChIP-seq or CUT&RUN for tagged Sp-FoxN2/3 in hatched blastula-stage S. purpuratus embryos,
    followed by GFP reporter analysis of candidate CRMs of sm50, msp130 and vegfr, to establish direct
    targets in the native species.
- description: S. purpuratus foxN2/3 morpholino or CRISPR knockdown with time-resolved RNA-seq of isolated
    PMCs, to define the complete early target set and separate the PMC-autonomous role from the later
    mesoderm and endoderm phases.
