taxon:
  id: NCBITaxon:7668
  label: Strongylocentrotus purpuratus
description: >-
  Alx1 is a paired-class (Q50) homeodomain transcription factor of the
  Cart1/Alx3/Alx4 subfamily, with a C-terminal OAR motif and a lineage-specific
  41-residue "Domain 2" (D2) motif that distinguishes it from its paralogue Alx4.
  In the sea urchin embryo it is transcribed exclusively in the large micromere
  lineage, the founder cells of the skeletogenic primary mesenchyme cells (PMCs),
  from the first interphase after the large micromeres are born. Its expression
  is cell-autonomous, is driven by Ets1 and by Alx1 itself, and is confined to
  the micromere lineage by the Pmar1/HesC double-negative gate: HesC represses
  alx1 everywhere else in the embryo through defined HesC sites in the alx1
  cis-regulatory system. Alx1 binds palindromic and TAAT half-site sequences as
  a dimer and acts as a direct activator of PMC regulatory genes (including its
  own gene) and of a large battery of terminal effector genes, including those
  required for epithelial-mesenchymal transition (ingression) and for calcium
  carbonate biomineralization. Morpholino knockdown blocks PMC specification and
  produces skeleton-less embryos in which the micromere domain instead expresses
  the non-skeletogenic mesoderm regulator gcm, while ectopic alx1 activates the
  skeletogenic program in other lineages. Alx1 is a conserved regulator of
  skeletal cell identity across echinoderms, and vertebrate Alx3/Alx4/Cart1
  proteins play analogous roles in craniofacial and limb skeletogenesis.
