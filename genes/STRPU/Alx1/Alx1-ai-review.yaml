core_functions:
- description: >-
    Sequence-specific, dimer-forming paired-class homeodomain transcriptional
    activator that institutes and stabilizes the skeletogenic (primary mesenchyme
    cell) regulatory state in the large micromere lineage: it auto-activates its own
    gene, drives the intermediate PMC transcription factors, represses the
    alternative non-skeletogenic mesoderm regulator gcm, and directly activates the
    effector genes for ingression (EMT) and calcite biomineralization.
  molecular_function:
    id: GO:0001228
    label: DNA-binding transcription activator activity, RNA polymerase II-specific
  directly_involved_in:
  - id: GO:0007501
    label: mesodermal cell fate specification
  - id: GO:0045944
    label: positive regulation of transcription by RNA polymerase II
  - id: GO:0070169
    label: positive regulation of biomineral tissue development
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:12756175
    supporting_text: that Alx1 is essential at an early stage of specification and
      controls ... downstream genes required for epithelial-mesenchymal transition
      and ... biomineralization.
  - reference_id: PMID:21723273
    supporting_text: we demonstrate that Alx1 protein is both an immediate, direct,
      auto-activator, and at higher concentrations an auto-repressor
  - reference_id: PMID:31331943
    supporting_text: intermediate transcription factors previously shown ... to be
      downstream of Alx1 all receive direct inputs from Alx1.
  - reference_id: PMID:34157281
    supporting_text: we show that Alx1 binds directly to several half sites. Moreover,
      Alx1 forms dimeric complexes at these sites
  knowledge_gaps:
  - gap_statement: >-
      Whether the repression of gcm by Alx1 (and the auto-repression of alx1 at high
      Alx1 levels) is a direct repressive activity of Alx1 on those cis-regulatory
      modules, or an indirect consequence of the activated PMC regulatory state, has
      not been shown at the cis-regulatory level in S. purpuratus.
    boundary: >-
      Perturbation evidence (alx1 morpholino expands gcm/pks into the micromere domain;
      alx1 mRNA reduces gcm) and the synthetic-construct auto-repression experiment are
      established; a direct Alx1-dependent repressive site has not been mapped.
    gap_kind:
    - BIOLOGY
suggested_questions:
- question: Is Alx1 a direct transcriptional repressor of gcm (and of its own gene at
    high concentration), which would justify GO:0001227 / GO:0000122 annotations, or is
    the exclusion of the non-skeletogenic mesoderm fate mediated indirectly through
    Alx1-activated intermediates?
- question: Does the D2 domain, which is required for skeletogenic function and alters
    DNA-binding properties, act by changing dimerization/half-site binding or by
    recruiting a specific coactivator?
suggested_experiments:
- description: Mutational dissection of the gcm cis-regulatory module (which already
    has defined Su(H) sites) for Alx1 binding sites, combined with Alx1 ChIP-qPCR, to
    test direct repression by Alx1 in the micromere lineage.
- description: Co-immunoprecipitation or proximity labeling of tagged Sp-Alx1 in PMCs,
    with and without the D2 domain, to identify the cofactors that distinguish Alx1
    from Alx4 in skeletogenic function.
