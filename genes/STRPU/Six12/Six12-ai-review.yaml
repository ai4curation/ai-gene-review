- id: PMID:22509525
  title: 'Cis-regulatory logic driving glial cells missing: self-sustaining circuitry
    in later embryogenesis.'
  findings:
  - statement: The gcm late cis-regulatory module, which sustains gcm expression from mesenchyme blastula
      onward, depends on two critical elements matching Gcm and Six1 consensus sites.
    supporting_text: Cis-perturbation analyses reveal that the two critical elements within this late
      module are consensus matches to Gcm and Six1 binding sites.
  - statement: Six1 depletion reduces endogenous gcm and late-module reporter output about three-fold,
      and Gcm depletion sharply reduces six1, so gcm and six1 form a positive intergenic feedback loop.
    supporting_text: These results support the conclusion gcm and six1 comprise a positive intergenic
      feedback loop in the mesodermal GRN.
  - statement: six1 mRNA is confined to gcm-positive pigment cell precursors from mesenchyme blastula and
      persists in dispersed pigment cells.
    supporting_text: six1 mRNA localizes to the pigment cell precursors as early as the mesenchyme blastula
      stage (Poustka et al., 2007) and expression is maintained in dispersed pigment cells (Figs. 7A–C).
  - statement: Six1 knockdown does not block pigment cell formation; six1 acts after primary specification
      of pigment cell precursors.
    supporting_text: injection of 250µM six1-MO did not produce any discernable effect on embryonic development,
      particularly with regard to pigment cell formation or differentiation.
  - statement: The UniProt H6WNA5 sequence (JQ264781) is the corrected six1 coding sequence deposited by
      this study.
    supporting_text: An updated six1 coding sequence has been filed in GenBank [accession JQ264781].
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified (Ransick & Davidson, Dev Biol 2012; PMC3561781); the only paper with
      direct Six1/2 loss-of-function and cis-regulatory data in S. purpuratus, and the source of the
      JQ264781 sequence behind UniProt H6WNA5. Full text in cache.
- id: PMID:23261933
  title: Diversification of oral and aboral mesodermal regulatory states in pregastrular
    sea urchin embryos.
  findings:
  - statement: six1/2 is activated in the aboral NSM shortly after gataE and z166, together with its cofactor
      eya.
    supporting_text: The six1/2 cofactor eya is also expressed in the aboral NSM (not shown).
  - statement: Gcm and GataE morpholinos each strongly depress six1/2 transcript levels, placing six1/2
      downstream of both in the aboral NSM GRN.
    supporting_text: Transcript levels of six1/2 and z166 are also greatly reduced in embryos bearing
      GataE MASO, about equally to embryos bearing Gcm MASO, so gataE is likely to provide direct inputs
      into these genes of the aboral GRN
  - statement: The six1/2-gcm feedback stabilises the aboral NSM regulatory state.
    supporting_text: This work demonstrated the institution of a feedback relation with six1/2, which
      serves to stabilize the aboral NSM regulatory state in addition to positive gcm auto-regulation.
  - statement: 'JQ264781 is the six1/2 sequence used in the mesoderm GRN work (gene prediction SPU_17397).'
    supporting_text: 'The actual 5’ end of the six1/2 sequence differs from the gene prediction SPU_17397
      (genbank accession numbers: prox1—JQ956375 , six1/2—JQ264781, z166—JQ945922).'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified (Materna, Ransick, Li, Davidson, Dev Biol 2013; PMC3570723); the mesoderm
      GRN paper that places six1/2 downstream of Gcm and GataE and the second UniProt RX reference. Full
      text in cache.
- id: PMID:22306924
  title: A comprehensive analysis of Delta signaling in pre-gastrular sea urchin embryos.
  findings:
  - statement: six1/2 and eya expression in the aboral mesoderm fails in the absence of Delta/Notch signalling.
    supporting_text: expression of other aboral mesoderm regulatory genes, i.e., the zinc finger gene z166,
      the six1/2 gene, and the gene encoding its co-factor Eya, also fails in the absence of D/N signaling.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed-verified (Materna & Davidson, Dev Biol 2012; PMC3294105). Establishes the indirect
      Delta/Notch dependence of six1/2 expression; perturbation of upstream signalling only.
- id: PMID:22238426
  title: Synthetic in vivo validation of gene network circuitry.
  findings:
  - statement: In the GRN summary, six1/2 lies in the subnetwork downstream of gcm and feeds back on gcm.
    supporting_text: A small subnetwork downstream of gcm includes the gatae gene and the six1/2 gene,
      which feeds back on gcm , as well as on an auto-regulatory feed from gcm onto itself
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: PubMed-verified (Damle & Davidson, PNAS 2012). Cited only for its network-level summary
      of the gcm-gataE-six1/2 subcircuit; six1/2 is not itself perturbed in this study.
- id: PMID:23055827
  title: Opposing nodal and BMP signals regulate left-right asymmetry in the sea urchin
    larva.
  findings:
  - statement: six1/2 is a left-sided marker expressed with pax6, eya, dach and soxE in aboral veg2-derived
      cells of the archenteron tip and the left coelomic pouch.
    supporting_text: Comparable expression patterns were observed for the left-sided markers pax6, six1/2,
      and genes encoding Six1/2 cofactors eya
  - statement: Left coelomic pouch six1/2 expression requires BMP signalling and is excluded from the right
      pouch by Nodal signalling.
    supporting_text: The expressions of all examined genes that were normally expressed in the aboral
      veg2 descendants, including soxE, pax6, six1/2, eya, and dach, were diminished in DM-treated embryos
      but remained in the single CP when BMP signaling was elevated (Figure 3F).
  - statement: Nodal receptor inhibition makes six1/2 expression bilateral.
    supporting_text: The arrowheads indicate soxE, pax6, six1/2, eya, and dach expression in the left CP
      in control and in both CPs in SB-505124-treated embryos.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed-verified (Luo & Su, PLoS Biol 2012; PMC3467216), S. purpuratus. Expression-only
      evidence for six1/2 as a BMP-dependent left coelomic pouch marker; six1/2 itself is not perturbed,
      so no left/right process annotation is proposed.
- id: PMID:26402456
  title: Deployment of a retinal determination gene network drives directed cell migration
    in the sea urchin embryo.
  findings:
  - statement: In Lytechinus variegatus, mesoderm-targeted Six1/2 knockdown impairs homing of the small
      micromeres to the coelomic pouches.
    supporting_text: Aboral transcription factor, Six1/2, affected homing when knocked down in the mesoderm,
      as well (n = 17, p < 0.02) and did not affect homing when knocked down in the micromere (n = 11).
  - statement: Six1/2 positively regulates six3, eya and itself in the coelomic pouch subcircuit.
    supporting_text: Six1/2 is seen to be upstream of six3, eya, and six1/2.
  - statement: The study organism is Lytechinus variegatus, not S. purpuratus.
    supporting_text: Adult Lytechinus variegatus were obtained from Reeftopia
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed-verified (Martik & McClay, eLife 2015). Orthologue data from Lytechinus variegatus
      using a Six1/2 morpholino adapted from Ransick & Davidson 2012; used for the positive sign of Six1/2
      regulation and the Eya cofactor relationship, not for a species-specific migration annotation.
- id: PMID:24295205
  title: 'Myogenesis in the sea urchin embryo: the molecular fingerprint of the myoblast
    precursors.'
  findings:
  - statement: At late gastrula Six1/2 is expressed in the aboral-anal domain of the archenteron tip with
