  review:
    summary: 'Phylogenetic inference from the SIX family node PTN000044272, seeded by mouse and human
      SIX factors with cis-regulatory binding data. The sea urchin protein has an intact homeodomain
      (residues 120-180), and cis-regulatory work in this species identifies a Six1 consensus match
      (GGGTATCA) as one of the two critical elements of the gcm late module, whose mutation reduces
      output in parallel with Six1 knockdown. Experimental support merged from the primary literature:
      site deletion in the gcm late module and six1 morpholino give concordant reductions of module
      output, which the authors interpret as a direct interaction of Six1 with the GGGTAT element.'
    action: ACCEPT
    reason: The IBA is consistent with cis/trans perturbation evidence for a functional Six site in an
      RNA polymerase II cis-regulatory module of gcm; this is the correct specific DNA-binding term. The
      sea urchin evidence is inferential (no in vitro binding or ChIP), so it is recorded here rather than
      as a separate experimental row.
