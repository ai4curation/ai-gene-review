  review:
    summary: Phylogenetic inference, seeded by a single mouse SIX gene, that SIX factors act within a
      transcription regulator complex, which for this family is the Six-Eya (and Dach) complex. In sea
      urchins the Eya cofactor is co-expressed with six1/2 in the aboral non-skeletogenic mesoderm and
