- gap_statement: Direct binding of Six1/2 to the GGGTAT element of the gcm late module is inferred from
    the concordance of site deletion and morpholino effects; no in vitro binding, ChIP or Six1/2 expression
    construct data exist for sea urchin.
  gap_kind:
  - BIOLOGY
  status: OPEN
  provenance:
  - reference_id: PMID:22509525
    supporting_text: The similarity of outcomes from these cis- and trans-perturbations is consistent
      with a direct interaction of Six1 with this GGGTAT element in the late module.
- gap_statement: Apart from gcm, the direct targets of Six1/2 in pigment cell precursors and in the left
    coelomic pouch are unknown, and its function in the S. purpuratus coelomic pouch has not been tested
    by perturbation.
  gap_kind:
  - BIOLOGY
  status: OPEN
  provenance:
  - reference_id: PMID:23055827
    supporting_text: Comparable expression patterns were observed for the left-sided markers pax6, six1/2,
      and genes encoding Six1/2 cofactors eya
suggested_questions:
- question: Does sea urchin Six1/2 require Eya as a co-activator at the gcm late module, and do Six1/2
    and Eya physically interact as in vertebrates and Drosophila?
- question: What does Six1/2 do in the left coelomic pouch (hydrocoel) downstream of BMP signalling, and
    does the Lytechinus small-micromere homing function hold in S. purpuratus?
- question: Which GataE input into six1/2 is direct, and does Six1/2 feed back on gataE as well as on gcm?
suggested_experiments:
- description: Mutagenesis of the GGGTATCA Six site in the gcm late module reporter combined with six1
    morpholino and with co-injection of six1 mRNA, to test epistasis and confirm that the site mediates
    the Six1/2 input.
  experiment_type: cis-regulatory reporter analysis
- description: DNA-affinity capture or ChIP with tagged Six1/2 at mesenchyme blastula and early pluteus
    to identify direct targets in pigment cell precursors and in the left coelomic pouch.
  experiment_type: ChIP-seq
- description: Mesoderm-targeted six1/2 knockdown in S. purpuratus followed by scoring of small micromere
    homing and left coelomic pouch marker expression, to test whether the Lytechinus coelomic pouch function
    is conserved.
  experiment_type: morpholino knockdown
