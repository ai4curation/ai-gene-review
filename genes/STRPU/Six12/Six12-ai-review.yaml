core_functions:
- description: Sequence-specific transcriptional activator in the nucleus of aboral non-skeletogenic
    mesoderm (pigment cell precursor) cells. Acting through a Six consensus element in the late cis-regulatory
    module of gcm, and with its cofactor Eya, Six1/2 sustains gcm transcription after the initiating
    Delta/Notch signal has ceased, closing a gcm-gataE-six1/2 positive feedback loop that stabilises
    the aboral mesoderm regulatory state; knockdown lowers peak gcm output about three-fold without
    abolishing pigment cells.
