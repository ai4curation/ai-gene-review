taxon:
  id: NCBITaxon:7668
  label: Strongylocentrotus purpuratus
description: Six1/2 is the single sea urchin member of the SIX1/SIX2 subgroup of SIX-class homeodomain
  transcription factors (sine oculis family), with an N-terminal Six domain that mediates cofactor
  binding, a central homeodomain that recognises the GGGTATCA-type Six consensus, and a His-rich
  C-terminus. In the purple sea urchin embryo it is a late-tier regulatory gene of the aboral
  non-skeletogenic mesoderm (pigment cell precursor) regulatory state, switched on in the mesenchyme
  blastula after gataE, downstream of Delta/Notch signalling, Gcm and GataE, together with its
  cofactor Eya. Acting in the nucleus as a sequence-specific activator, Six1/2 provides a positive
  input through a Six site in the late cis-regulatory module of gcm, forming with Gcm a positive
  intergenic feedback loop that sustains gcm expression in specified pigment cell precursors after
  the initiating Delta signal has ceased; its knockdown lowers gcm output about three-fold but
  does not prevent pigment cell formation. Later it is expressed with pax6, eya, dach and soxE in
  the aboral veg2-derived cells at the archenteron tip and in the left coelomic pouch, where its
  expression depends on BMP signalling and is excluded from the right side by Nodal; in the related
  sea urchin Lytechinus variegatus this coelomic pouch Pax6/Six3/Six1/2/Eya/Dach1 subcircuit directs
  the homing of the small micromeres.
