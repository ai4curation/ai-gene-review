      in a block in gastrulation movements but not expression of endoderm and mesoderm
      marker genes.
  - reference_id: PMID:19895806
    supporting_text: perturbation of brachyury expression strongly depressed expression
      levels of otx–β transcripts
  - reference_id: PMID:36396969
    supporting_text: Our analysis reveals an ancestral gene regulatory feedback loop connecting
      Brachyury, FoxA and canonical Wnt signalling involved in axial patterning
  knowledge_gaps:
  - gap_statement: >-
      The direct target modules of Brachyury in S. purpuratus have not been dissected
      at the cis-regulatory level in the published literature: the Brachyury sites in
      the foxA module are cited only as unpublished, and the ChIP-seq target set has not
      been tested by site mutagenesis, so the activator sign (GO:0001228) rests on
      loss- and gain-of-function inference.
    boundary: >-
      Morpholino knockdown and premature misexpression in S. purpuratus, and a
      dominant-repressor fusion in Lytechinus, all behave as loss and gain of an
      activator; no reporter construct with mutated Brachyury sites has been published.
    gap_kind:
    - BIOLOGY
suggested_questions:
- question: Is Brachyury a direct transcriptional activator of its endodermal effector
    targets (cytoskeletal modulators, hh) and of the otx-beta module, which would
    justify GO:0001228 and confirm the otx-brachyury positive feedback as a direct
    linkage in the endoderm kernel?
- question: Does Brachyury perform the same morphogenetic function in the oral ectoderm
    of S. purpuratus as it does in Lytechinus, that is, is stomodeal invagination and
    mouth formation dependent on Brachyury, and which effector genes does it control
    there?
- question: The hindgut (veg1) phase of brachyury expression is driven by Hox11/13b;
    does Brachyury contribute to hindgut/anus morphogenesis at the pluteus stage, and
    is the later re-expression in the adult rudiment vestibule and hydrocoel mesoderm
    functional?
suggested_experiments:
- description: Site-directed mutagenesis of T-box (Brachyury) binding sites in the
    cis-regulatory modules of S. purpuratus endodermal effector genes identified by
    ChIP-seq and by the macroarray screen, assayed as reporter constructs in
    Brachyury morpholino and misexpression backgrounds, to establish direct activation.
- description: Oral-ectoderm-targeted Brachyury perturbation in S. purpuratus (for
    example a photoactivatable or late-injected dominant-negative construct) combined
    with live imaging of stomodeal invagination, to test the mouth-formation function
    described in Lytechinus.
