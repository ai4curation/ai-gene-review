- term:
    id: GO:0007369
    label: gastrulation
  evidence_type: IMP
  original_reference_id: PMID:12027442
  qualifier: involved_in
  review:
    summary: >-
      Brachyury is expressed in the ring of endoderm cells that invaginate through the
      blastopore and is required for the movements of gastrulation. In S. purpuratus,
      interfering with Brachyury function by morpholino blocks gastrulation, and the
      endodermal genes that depend on Brachyury are cytoskeletal modulators and other
      effectors of gut morphogenesis rather than regulatory genes; in Lytechinus a
      dominant-repressor Brachyury-Engrailed fusion blocks gastrulation movements while
      leaving endoderm and mesoderm specification markers intact. Brachyury therefore
      performs the regulatory step that turns the endoderm regulatory state into the
      morphogenetic effector programme of archenteron invagination, which is
      participation in gastrulation rather than a mere upstream requirement.
    action: NEW
    reason: >-
      Loss-of-function evidence in S. purpuratus (morpholino) corroborated in
      Lytechinus (dominant negative), with the gene product acting directly on
      morphogenesis effector genes in the invaginating endoderm. Comparator check:
      mouse T (P20293) carries GO:0007509 mesoderm migration involved in gastrulation
      by IMP, so gastrulation-branch process terms are the established convention for
      Brachyury orthologues. The generic term is chosen because the sea urchin
      literature describes the gastrulation block as a whole rather than a specific
      cellular movement.
    supported_by:
    - reference_id: PMID:12027442
      supporting_text: Some of the endodermal genes that respond to Brachyury are cytoskeletal
        modulators that may play a role in gut morphogenesis. This finding is consistent
        with the block in gastrulation induced by interfering with Brachyury function in
