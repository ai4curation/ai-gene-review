core_functions:
- description: >-
    T-box transcription factor of the endoderm gene regulatory network that binds
    genomic cis-regulatory elements and activates the morphogenetic effector programme
    of the invaginating endoderm: expressed in the veg2 and then veg1 endoderm
    downstream of Tcf/beta-catenin, Otx and Hox11/13b, it drives cytoskeletal
    modulators, gut effector genes and the Hedgehog ligand, feeds back positively on
    the otx-beta transcript of the endoderm kernel, and is required for the cell
    movements of gastrulation.
