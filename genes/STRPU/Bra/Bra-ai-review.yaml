- id: PMID:10068473
  title: 'Expression pattern of Brachyury and Not in the sea urchin: comparative implications
    for the origins of mesoderm in the basal deuterostomes.'
  findings:
  - statement: SpBra is the S. purpuratus orthologue of vertebrate Brachyury.
    supporting_text: SpBra, the orthologue of the vertebrate Brachyury gene
  - statement: Embryonic expression is in the vegetal plate and secondary mesenchyme
      founder cells and is then extinguished; the gene is re-expressed in the larval
      vestibule of the adult rudiment and in the hydrocoel mesoderm.
    supporting_text: this gene is expressed during embryogenesis in the embryonic vegetal
      plate and secondary mesenchyme founder cells, and expression is then extinguished
  - statement: SpBra is expressed in the mesoderm of the left and right hydrocoels
      but in no larva-specific tissue.
    supporting_text: SpBra is also expressed in the mesoderm of both left and right
      hydrocoels, and it is not expressed in any larva-specific tissues
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Peterson, Harada, Cameron, Davidson; Dev Biol 1999;207:419-31).
      The paper that cloned and described SpBra in S. purpuratus. Abstract only cached;
      expression evidence (IEP-type).
- id: PMID:12027442
  title: brachyury Target genes in the early sea urchin embryo isolated by differential
    macroarray screening.
  findings:
  - statement: Brachyury expression in the S. purpuratus vegetal plate is confined to
      the presumptive endoderm.
    supporting_text: Brachyury expression in the vegetal plate is confined to the presumptive
      endodermal cells.
  - statement: Endodermal Bra-dependent genes include cytoskeletal modulators implicated
      in gut morphogenesis, consistent with the gastrulation block caused by interfering
      with Brachyury function.
    supporting_text: Some of the endodermal genes that respond to Brachyury are cytoskeletal
      modulators that may play a role in gut morphogenesis. This finding is consistent
      with the block in gastrulation induced by interfering with Brachyury function in
      sea urchins
  - statement: Brachyury links the endoderm regulatory state to morphogenesis and terminal
      gut effector genes.
    supporting_text: the brachyury gene transduces information about the state of endodermal
      specification to genes that modulate morphogenesis and genes that perform terminal
      functions in the gut
  - statement: The pigment-lineage SMC genes recovered in the screen are judged indirect
      targets.
    supporting_text: the SMC genes are likely to be indirect targets of Brachyury-induced
      signaling from the surrounding endoderm to the central mesoderm
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Rast, Cameron, Poustka, Davidson; Dev Biol 2002;246:191-208).
      S. purpuratus brachyury morpholino knockdown and premature misexpression combined
      with differential macroarray screening for downstream genes; the S. purpuratus
      loss-of-function source for the gastrulation phenotype. Abstract only cached.
- id: PMID:11784024
  title: The role of Brachyury (T) during gastrulation movements in the sea urchin Lytechinus
    variegatus.
  findings:
  - statement: A dominant-repressor LvBrac-Engrailed fusion blocks gastrulation movements
      without blocking endoderm and mesoderm marker gene expression.
    supporting_text: Microinjection of mRNA encoding this LvBrac-EN construct resulted
      in a block in gastrulation movements but not expression of endoderm and mesoderm
      marker genes.
  - statement: Brachyury is required for the morphogenetic movements in both the vegetal
      (blastopore) and oral (stomodeal) expression domains.
    supporting_text: It was then determined that LvBrac is necessary for the morphogenetic
      movements occurring in both expression regions.
  - statement: The oral ectoderm domain refines to the stomodeal opening.
    supporting_text: The second domain of LvBrac expression first appears broadly in the
      oral ectoderm at mesenchyme blastula stage and at later embryonic stages is refined
      to just the stomodael opening.
  - statement: Vegetal expression depends on autonomous beta-catenin signalling in the
      macromeres.
    supporting_text: Vegetal LvBrac expression depends on autonomous beta-catenin signaling
      in macromeres and does not require micromere or veg2-inductive signals.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Gross and McClay, Dev Biol 2001;239:132-47). The experiments are
      in Lytechinus variegatus, not S. purpuratus, and the perturbation is a
      dominant-interfering Engrailed fusion rather than a knockdown; used as
      corroborating evidence for the S. purpuratus gastrulation phenotype reported by
      Rast et al. 2002. Abstract only cached.
- id: PMID:19895806
  title: The endoderm gene regulatory network in sea urchin embryos up to mid-blastula
    stage.
  findings:
  - statement: brachyury shares the early veg2 endoderm expression pattern with foxA,
      blimp1b and hox11/13b.
    supporting_text: foxA, blimp1b, hox11/13b and brachyury showed very similar expression
      patterns.
  - statement: Both foxA and brachyury are controlled by Tcf, Hox11/13b and Otx, and
      ultimately by GataE.
    supporting_text: Both genes appear to be expressed under the control of Tcf, Hox11/13b
      and Otx, as mentioned above, and are also ultimately affected by GataE.
  - statement: Tcf/Groucho repression through Tcf sites restricts brachyury expression
      to the endoderm precursors.
    supporting_text: Mutation of Tcf binding sites in the cis-regulatory regions of hox11/13b,
      foxA and brachyury, and eve results in dramatic ectopic expression of reporter
      constructs in all or most domains of the embryo.
  - statement: brachyury morpholino strongly depresses otx-beta transcripts, revealing
      positive feedback from brachyury into the endoderm kernel.
    supporting_text: perturbation of brachyury expression strongly depressed expression
      levels of otx–β transcripts
  - statement: Otx is activated by the products of its target genes blimp1b and brachyury.
    supporting_text: Otx is activated by its own gene product as well as the products
      of its target genes blimp1b and brachyury.
  - statement: brachyury morpholino does not affect foxA levels at 18 hpf.
    supporting_text: Injection of a brachyury MASO did not affect the expression levels
      of foxA at 18 hpf.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text cached (Peter and Davidson, Dev Biol 2010;340:188-99). S. purpuratus
      endoderm GRN perturbation matrix including brachyury MASO; the cis-regulatory
      inputs into brachyury (Tcf, Otx, GataE) are cited here as unpublished work.
- id: PMID:21623371
  title: A gene regulatory network controlling the embryonic specification of endoderm.
  findings:
  - statement: brachyury shifts from veg2 endoderm at 18 h to the veg1 (hindgut) endoderm
      progenitors by 24 h.
    supporting_text: By 24 h post-fertilization, hox11/13b and brachyury, which are both
      expressed in veg2 endoderm at 18 h, are being transcribed instead in veg1 endodermal
      progenitors, where eve also continues to be expressed
  - statement: Hox11/13b drives brachyury expression in both the veg2 and veg1 endoderm
      GRNs.
    supporting_text: In both the early veg2 and the later veg1 endoderm GRNs, Hox11/13b
      functions as a driver of brachyury expression, as shown by the specific reduction
      of endodermal brachyury expression in embryos injected with hox11/13b MASO
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text cached (Peter and Davidson, Nature 2011). Places brachyury
      in the veg2 and veg1 endoderm GRNs of S. purpuratus.
- id: PMID:36396969
  title: An ancestral Wnt-Brachyury feedback loop in axial patterning and recruitment
    of mesoderm-determining target genes.
  findings:
  - statement: Genome-wide Brachyury ChIP-seq was performed in S. purpuratus (and Nematostella).
    supporting_text: we present a genome-wide target-gene screen using chromatin immunoprecipitation
      sequencing in the sea anemone Nematostella vectensis, an early branching non-bilaterian,
      and the sea urchin Strongylocentrotus purpuratus
  - statement: Brachyury sits in an ancestral feedback loop with FoxA and canonical
      Wnt signalling.
    supporting_text: Our analysis reveals an ancestral gene regulatory feedback loop connecting
      Brachyury, FoxA and canonical Wnt signalling involved in axial patterning
  - statement: The vertebrate mesodermal Brachyury targets are largely absent from the
      sea urchin target set.
    supporting_text: hardly any of the key mesodermal downstream targets in vertebrates
      are found in the sea anemone or the sea urchin
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Schwaiger, Andrikou et al., Nat Ecol Evol 2022;6:1921-39).
      Direct genome-wide chromatin binding of S. purpuratus Brachyury; the source for
      the IDA evidence on cis-regulatory DNA binding. Abstract only cached.
- id: PMID:35038441
  title: A single-cell RNA-seq analysis of Brachyury-expressing cell clusters suggests
    a morphogenesis-associated signal center of oral ectoderm in sea urchin embryos.
  findings:
  - statement: Brachyury is expressed in the invaginating endoderm and in the oral ectoderm
      of the invaginating mouth.
    supporting_text: In sea urchin embryos, Brachyury is expressed in the invaginating
      endoderm, and in the oral ectoderm of the invaginating mouth opening.
  - statement: All three endoderm clusters of the S. purpuratus scRNA-seq atlas express
      Brachyury in blastulae.
    supporting_text: Our results showed that cells of all three endoderm clusters expressed
      Brachyury in blastulae.
  - statement: Brachyury-positive oral ectoderm cells of the ventral organizer invaginate
      to form the stomodeum.
    supporting_text: This suggests that the ventral organizer contains Brachyury-positive
      cells which invaginate to form the stomodeum.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed-verified (Satoh et al., Dev Biol 2022). S. purpuratus single-cell
      expression data; descriptive, no perturbation. Abstract only cached.
- id: PMID:19393640
  title: Hedgehog signaling patterns mesoderm in the sea urchin.
  findings:
  - statement: The Hedgehog ligand is expressed by the endoderm downstream of Brachyury
      and FoxA.
    supporting_text: At gastrulation the Hh ligand is expressed by the endoderm downstream
      of the Brachyury and FoxA transcription factors in the endomesoderm gene regulatory
      network.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Full text cached (Walton et al., Dev Biol 2009). Lytechinus study;
      cited only for hh as a Brachyury-dependent endodermal effector gene.
- id: PMID:7555703
  title: A sea urchin homologue of the chordate Brachyury (T) gene is expressed in the
    secondary mesenchyme founder cells.
  findings:
  - statement: The sea urchin Brachyury gene is single copy.
    supporting_text: The HpTa gene is present as a single copy per haploid genome.
  - statement: HpTa transcripts mark the SMC founder cells, vegetal plate and the tip
      of the invaginating archenteron.
    supporting_text: HpTa transcripts were found in the secondary mesenchyme founder
      cells, vegetal plate of the mesenchyme blastula, extending tip of the invaginating
      archenteron
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed-verified (Harada, Yasuo, Satoh; Development 1995). Hemicentrotus
      pulcherrimus; the first sea urchin Brachyury clone, used for the single-copy
      argument on gene identity. Abstract only cached.
- id: PMID:16351823
  title: Brachyury homolog (HpTa) is involved in the formation of archenteron and secondary
    mesenchyme cell differentiation in the sea urchin embryo.
  findings:
  - statement: HpTa overexpression suppresses vegetal plate and SMC formation.
    supporting_text: The overexpression of HpTa resulted in suppression of the formation
      of vegetal plate and secondary mesenchyme cells.
  reference_review:
    relevance: LOW
    correctness: LOW_QUALITY
    review_notes: PubMed-verified (Zoology 2001). Hemicentrotus overexpression only,
      interpreted by the authors as cofactor squelching; not used to support any
      annotation.
- id: PMID:11819120
  title: Expression pattern of Brachyury in the embryo of the sea urchin Paracentrotus
    lividus.
  findings:
  - statement: PlBra is first expressed in a ring at the endoderm-mesoderm border and
      later around the blastopore and in the stomodeum.
    supporting_text: PlBra is first expressed at the end of cleavage in a ring of cells
      at the border between the presumptive endoderm and mesoderm territories.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: PubMed-verified (Croce, Lhomond, Gache; Dev Genes Evol 2001). Paracentrotus
      lividus expression pattern; corroborates the conserved blastopore and stomodeal
      domains.
