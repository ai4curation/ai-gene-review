  review:
    summary: Hex is the central node of the dynamic state-stabilization subcircuit (erg-hex and hex-tgif
      positive feedback loops) that locks down the skeletogenic mesenchyme (primary mesenchyme cell) regulatory
      state after the transient initiating inputs from the double-negative gate have faded. Its outputs
      drive erg and tgif, feed other nodes of the GRN (foxo) and the differentiation genes, so Hex performs
      the regulatory step that commits the lineage rather than merely being required for it. It is expressed
      selectively in the large micromere-PMC lineage during the relevant period.
    action: NEW
    reason: 'Participation test passed: Hex is a transcription factor whose activity maintains the lineage
      regulatory state; the commitment term (parent of specification and determination) is chosen because
      hex is activated after the specification genes alx1/ets1/tbr/tel and its documented role is stabilization/lockdown
      of the already-specified skeletogenic mesodermal fate. IMP from the morpholino/QPCR perturbation
      data. Same term and reasoning as the sibling Erg review.'
    supported_by:
    - reference_id: PMID:18413610
      supporting_text: 'three additional genes are activated: one encoding the Ets family factor Erg (
        9 ), and the other two, hex and tgif , encoding homeobox factors ( 5 )'
    - reference_id: PMID:18413610
      supporting_text: These genes are engaged in interlocking positive double feedback loops ( erg with
        hex ; and hex with tgif ). Interference with expression of any of these genes severely depresses
        transcript levels of the others ( Fig. S3 ). Thus they dynamically stabilize all aspects of the
        regulatory state downstream of themselves.
    - reference_id: PMID:18413610
      supporting_text: The tgif-hex and erg-hex loops in the skeletogenic micromere GRN are canonical examples.
        Outputs of these genes not only serve as drivers for one another but also feed multiple other
        nodes of the GRN, so that their activity ensures the persistence of surrounding activities.
    - reference_id: PMID:30264451
      supporting_text: Such feedback loops may convert the transient expression of pmar1 into a more stable
        regulatory state in the skeletogenic lineage and buffer against initial variation in the level
        of expression of these genes.
