gene_symbol: Hex
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:7668
  label: Strongylocentrotus purpuratus
description: Hex is the single sea urchin orthologue of the vertebrate hematopoietically-expressed
  homeobox protein HHEX, a 317-residue transcription factor with one homeodomain flanked by disordered
  N- and C-terminal regions. In the embryo it is zygotically activated in the large micromere-derived
  skeletogenic mesenchyme lineage (the primary mesenchyme cells), downstream of nuclear beta-catenin and
  pmar1 and of the lineage-founding regulators ets1 and alx1. There it is the hub of a dynamic state-stabilization
  subcircuit, forming interlocking positive feedback loops with the ETS factor Erg (erg-hex) and the
  TALE homeobox factor Tgif (hex-tgif), so that knockdown of hex depresses erg and tgif transcripts and
  vice versa; this transcriptional lockdown converts the transient initiating inputs into a stable skeletogenic
  regulatory state. Hex outputs also go to foxo and, as a feed-forward driver together with Alx1, Ets1,
  Tbr, Tel, Erg, FoxB and Dri, to the battery of differentiation genes that build the larval calcite
  endoskeleton. Morpholino knockdown of hex yields embryos with a full complement of ingressed skeletogenic
  cells that nevertheless cannot form the biomineral skeleton. After skeletogenic cell ingression hex is
  switched on a second time in the oral non-skeletogenic mesoderm, together with erg and ets1/2. In Lytechinus
  variegatus the hex orthologue is additionally required for the apical constriction and motility steps
  of the skeletogenic epithelial-mesenchymal transition.
