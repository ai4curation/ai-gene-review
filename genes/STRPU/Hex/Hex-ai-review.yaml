- id: PMID:18413610
  title: Global regulatory logic for specification of an embryonic cell lineage.
  findings:
  - statement: hex is activated, with erg and tgif, immediately downstream of the four double-negative-gate
      targets (alx1, ets1, tbr, tel) and forms interlocking positive feedback loops with both erg and
      tgif; knockdown of any one depresses the others.
    supporting_text: These genes are engaged in interlocking positive double feedback loops ( erg with
      hex ; and hex with tgif ). Interference with expression of any of these genes severely depresses
      transcript levels of the others ( Fig. S3 ). Thus they dynamically stabilize all aspects of the
      regulatory state downstream of themselves.
  - statement: Hex outputs go to tgif, erg, foxo and the skeletogenic differentiation genes.
    supporting_text: In addition to tgif , the outputs of hex go to erg , to differentiation genes as we
      see below, and to foxo , a late activated regulatory gene the functions of which occur beyond the
      time frame of this GRN.
  - statement: hex morphants have a skeleton-minus phenotype with a full complement of ingressed skeletogenic
      cells, i.e. a differentiation defect without an ingression defect.
    supporting_text: 'This is not the case for tbr , hex , or tgif : interference with their expression
      results in embryos with a full complement of ingressed cells of the micromere lineage but these cells
      are unable to create the biomineral skeleton.'
  - statement: Hex is one of the feed-forward drivers of the biomineralization differentiation gene battery.
    supporting_text: these differentiation genes require as drivers products of all of the now familiar
      components of the skeletogenic regulatory state ( alx1 , ets1 , tbr , tel , erg , hex , foxb , dri
      )
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached; the synthesis of the S. purpuratus skeletogenic micromere GRN with
      the hex morpholino/QPCR perturbation data (Fig. S3) and the hex MASO skeleton-minus phenotype (Fig.
      3C-E). Primary source for all NEW rows. The hex gene is cited there to the Howard-Ashby 2006 homeobox
      survey (ref. 5).
- id: PMID:30264451
  title: 'From genome to anatomy: The architecture and evolution of the skeletogenic
    gene regulatory network of sea urchins and other echinoderms.'
  findings:
  - statement: hex is expressed selectively in the large micromere-PMC lineage and lies downstream of nuclear
      beta-catenin and pmar1.
    supporting_text: overexpression of pmar1 or a form of cadherin that interferes with β-catenin function
      have shown that erg, foxN2/3, hex, tel, and tgif are all downstream of β-catenin and pmar1
  - statement: The erg/hex/tgif mutual positive interactions are interpreted as converting transient
      pmar1 expression into a stable skeletogenic regulatory state.
    supporting_text: One prominent example is a set of mutual regulatory interactions among erg, hex,
      and tgif that reinforces the expression of all three genes.
  - statement: The ets1 -> hex input reported by Oliveri et al. 2008 was not reproduced by Rafiq et al.
      2014.
    supporting_text: Most notably, Oliveri et al. (2008) reported significant changes in the expression
      of erg, tgif, and hex following Ets1 knockdown, while Rafiq and co-workers (Rafiq et al., 2014)
      did not detect such changes.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached (Genesis 2018 review by Shashikant, Khor and Ettensohn). Independent-lab
      synthesis of the PMC GRN; used to corroborate the Oliveri 2008 hex linkages and to record the unresolved
      ets1 -> hex discrepancy.
- id: PMID:23261933
  title: Diversification of oral and aboral mesodermal regulatory states in pregastrular
    sea urchin embryos.
  findings:
  - statement: After skeletogenic mesenchyme ingression, hex (with erg and ets1/2) is activated a second
      time, specifically in the oral non-skeletogenic mesoderm.
    supporting_text: At this time three genes that are first expressed in the SM, erg, hex, and ets1/2
      are activated specifically in the oral NSM (Fig. 1O–R).
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text cached; S. purpuratus WMISH time course of the second, later expression domain
      of hex. Expression-level only; no annotation proposed from it.
- id: PMID:24598159
  title: Sub-circuits of a gene regulatory network control a developmental epithelial-mesenchymal
    transition.
  findings:
  - statement: hex is the sole HHEX-subfamily gene in the sea urchin genome, which supports the identity
      of the single HHEX-class accession A0A7M7R9J9 with the GRN gene hex.
    supporting_text: All orthologs but hex (hhex) are found within a subfamily of two or three members.
  - statement: In Lytechinus variegatus, hex is one of the ten downstream PMC transcription factors required
      for EMT, acting as a terminal node of the apical-constriction and motility sub-circuits.
    supporting_text: 'apical constriction is controlled by a complex forward cascade that feeds into five
      terminal TFs: tel, hex, foxn2/3, foxb and foxo.'
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text cached. Experiments in L. variegatus (LvHex cloned from the S. purpuratus
      annotation, two MASOs). Used for the identity argument and as a lead for an EMT role; the EMT phenotype
      conflicts with the normal ingression of S. purpuratus hex morphants (Oliveri 2008), so no EMT annotation
      is proposed for the S. purpuratus gene product.
- id: PMID:17055477
  title: Identification and characterization of homeobox transcription factor genes
    in Strongylocentrotus purpuratus, and their expression in embryonic development.
  findings:
  - statement: Genome-wide survey of the 96 S. purpuratus homeobox genes with QPCR time courses and WMISH;
      this is the source (ref. 5 of Oliveri et al. 2008) for hex as a homeobox factor of the micromere
      lineage.
    supporting_text: A set of 96 homeobox transcription factors was identified in the
      Strongylocentrotus purpuratus genome using permissive blast searches with a
      large collection of authentic homeodomain sequences from mouse, human and fly.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed-verified (Dev Biol 2006;300:74-89), abstract only cached; the hex-specific expression
      data are in the full text and supplementary material, which were not accessible. Cited for provenance
      of the hex gene model.
