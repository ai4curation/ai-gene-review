  knowledge_gaps:
  - gap_statement: No direct evidence (cis-regulatory module analysis, ChIP or EMSA) that Hex binds and
      activates erg, tgif, foxo or any differentiation-gene module in S. purpuratus; all Sp evidence is
      morpholino/QPCR perturbation plus the skeleton-minus morphology. The ets1 -> hex input is reported
      by one laboratory and not reproduced by another, and the function of the later oral non-skeletogenic
      mesoderm expression is unknown.
    boundary: The hex-erg and hex-tgif positive feedback loops, the requirement of hex for differentiation-gene
      transcript levels and the skeleton-minus phenotype with normal ingression are established by perturbation
      in S. purpuratus; an EMT role is documented only in L. variegatus.
    gap_kind:
    - BIOLOGY
suggested_questions:
- question: Is Hex a direct activator of erg, tgif and of the skeletogenic differentiation genes (which
    would justify GO:0001228 / GO:0000978 with IDA), or does it act through intermediates? No cis-regulatory
    dissection of a Hex-dependent module has been reported for S. purpuratus.
- question: Why do hex morphants ingress normally in S. purpuratus (Oliveri 2008) but fail apical constriction
    and motility during EMT in L. variegatus (Saunders and McClay 2014)? Is this a species difference, a
    difference in knockdown efficiency, or a difference in scoring?
- question: Does Ets1 provide a direct input into hex? Oliveri et al. 2008 reported loss of hex expression
    after ets1 knockdown, whereas Rafiq et al. 2014 did not detect such a change.
- question: What is the function of the later oral non-skeletogenic mesoderm expression of hex (with erg
    and ets1/2), and does the same hex-erg loop operate there, as the vertebrate hematopoietic parallels
    suggest?
suggested_experiments:
- description: ChIP-qPCR/ChIP-seq of tagged Sp-Hex in primary mesenchyme cells, combined with GFP reporter
    analysis of the erg and tgif cis-regulatory regions with mutated homeodomain (TAAT-core) sites, to test
    direct Hex input into its feedback-loop partners and into the differentiation genes.
- description: Side-by-side morpholino and CRISPR knockdown of hex in S. purpuratus and L. variegatus with
    time-lapse imaging of ingression, and QPCR of erg, tgif and biomineralization genes at matched time
    points, to resolve the ingression-phenotype discrepancy.
