- id: PMID:10400389
  title: Lim1 related homeobox gene (HpLim1) expressed in sea urchin embryos.
  findings:
  - statement: HpLim1 is a two-LIM-domain, LIM-class homeodomain protein orthologous
      to Lim1 of other animals.
    supporting_text: HpLim1 contains two LIM domains and a LIM-class homeodomain, and
      amino acid sequences of these three domains are highly homologous to corresponding
      domains of Lim1 of other animals.
  - statement: Transcripts accumulate from hatching, decline after mesenchyme blastula,
      and localise to the vegetal plate region of hatched blastulae but not to ingressed
      primary mesenchyme cells.
    supporting_text: Accumulation of HpLim1 transcripts begins at hatching, and declines
      after the mesenchyme blastula stage. HpLim1 mRNA was localized in the vegetal plates
      of hatched blastulae, but it was not detectable in primary mesenchyme cells (PMC)
      ingressed into the blastocele.
  - statement: Ectopic HpLim1 mRNA suppresses gut, mesoderm and aboral ectoderm
      differentiation and the embryo mainly expresses an oral ectoderm marker.
    supporting_text: HpLim1 mRNA-injected embryos became spherical with markedly reduced
      gut formation, failed to express marker proteins for aboral ectoderm and mesoderm,
      and mainly expressed an oral ectoderm marker.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Dev Growth Differ 1999;41:273-82). Founding paper for sea urchin
      Lim1, but in Hemicentrotus pulcherrimus, not S. purpuratus, and abstract-only in
      the cache. The gain-of-function phenotype is the only functional perturbation of a
      sea urchin lim1 gene itself; it is used as supporting context, not as the basis of
      an S. purpuratus annotation.
- id: PMID:17055477
  title: Identification and characterization of homeobox transcription factor genes
    in Strongylocentrotus purpuratus, and their expression in embryonic development.
  findings:
  - statement: Genome-wide survey of 96 S. purpuratus homeobox genes with QPCR time
      courses and whole-mount in situ hybridisation; the source of the embryonic
      expression catalogue that includes lim1.
    supporting_text: QPCR time course measurements revealed that 65% of these genes are
      expressed within the first 48 h of development (late gastrula).
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Dev Biol 2006;300:74-89). Abstract-only in the cache and the
      abstract does not name lim1, so its lim1-specific expression data cannot be quoted
      here; included as the general S. purpuratus homeobox survey.
- id: PMID:19268450
  title: A perturbation model of the gene regulatory network for oral and aboral ectoderm
    specification in the sea urchin embryo.
  findings:
  - statement: In S. purpuratus lim1 marks a distinct ectodermal domain along the interface
      with the vegetal endomesoderm that spans both oral and aboral ectoderm.
    supporting_text: there is a separate domain along the interface with the vegetal
      endomesoderm that extends all across both oral and aboral ectoderm, as indicated by
      expression of the lim1 gene (Kawasaki et al. 1999)
  - statement: lim1 is expressed along the lower (vegetal) margin of both oral and aboral
      ectoderm and is activated independently of nodal.
    supporting_text: the lim1 gene, which is expressed along the lower margin of both
      oral and aboral ectoderm
  - statement: Within the aboral ectoderm the lim1 domain is the only subdivision, lying
      next to the endomesoderm border.
    supporting_text: The only subdivision within it is that mentioned above, the lim1
      domain immediately adjacent to the vegetal endomesoderm border.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Dev Biol 2009;329:410-21), full text cached, S. purpuratus. The
      primary S. purpuratus statement of where lim1 is expressed and that it is
      Nodal-independent; lim1 itself was not perturbed.
- id: PMID:21203442
  title: Ancestral regulatory circuits governing ectoderm patterning downstream of Nodal
    and BMP2/4 revealed by gene regulatory network analysis in an echinoderm.
  findings:
  - statement: In Paracentrotus Nodal morphants, lim1 (with onecut/hnf6, otx2 and foxA)
      is expressed but no longer regionalised in the presumptive ectoderm, so lim1 is not
      an oral-specific marker.
    supporting_text: we showed that the expression of onecut/hnf6, otx2, lim1, and foxA
      in the presumptive ectoderm region of Nodal morphants was not regionalized,
      consistent with the absence of any oral territory in these embryos.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (PLoS Genet 2010;6:e1001259), full text cached, Paracentrotus
      lividus. Used only for the cross-species point that lim1 regionalisation along the
      animal-vegetal axis does not require Nodal.
- id: PMID:22771578
  title: Direct and indirect control of oral ectoderm regulatory gene expression by
    Nodal signaling in the sea urchin embryo.
  findings:
  - statement: lim1 is classed as a veg1 oral ectoderm regulatory gene and is not affected
      by knockdown of the Nodal-dependent repressor Not.
    supporting_text: no effects were seen on expression of the other veg1 oral ectoderm
      regulatory genes nk2.2 and lim1
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Dev Biol 2012;369:377-85), full text cached, S. purpuratus.
      Places lim1 in the veg1 ectoderm regulatory state and shows a negative
      perturbation result (Not-independent).
- id: PMID:24227654
  title: Short-range Wnt5 signaling initiates specification of sea urchin posterior
    ectoderm.
  findings:
  - statement: Lim1 is the earliest border ectoderm (BE) gene, expressed throughout the BE
      from 8 hpf and diminishing by gastrulation.
    supporting_text: The earliest marker expressed in the BE was Lim1. It was expressed
      throughout the BE beginning at 8 hpf and was diminished by gastrulation.
  - statement: A short-range Wnt5 signal from the endoderm activates the BE subcircuit that
      includes the transcription factors IrxA, Nk1, Pax2/5/8 and Lim1; Nodal and BMP2/4
      restrict these genes to subregions of the BE.
    supporting_text: This signal activates a unique subcircuit of the ectoderm gene
      regulatory network, including the transcription factors IrxA, Nk1, Pax2/5/8 and
      Lim1, which are ultimately restricted to subregions of the border ectoderm (BE).
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Development 2013;140:4881-9), full text cached. The experiments
      are in Lytechinus variegatus, not S. purpuratus, and perturb the upstream signals
      (Wnt5, Nodal, BMP2/4), not lim1 itself; used for the regulatory inputs to lim1.
- id: PMID:24556994
  title: Encoding regulatory state boundaries in the pregastrular oral ectoderm of the
    sea urchin embryo.
  findings:
  - statement: Comprehensive regulatory-state maps of all spatially expressed oral
      ectoderm regulatory genes define the endoderm/ectoderm and ectoderm/apical-plate
      boundaries by region-specific repressors plus broad activators.
    supporting_text: Comprehensive regulatory state maps, including all spatially
      expressed oral ectoderm regulatory genes, were established. The circuitry at each
      boundary deploys specific repressors of regulatory states across the boundary,
      identified in this work, plus activation by broadly expressed positive regulators.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (PNAS 2014;111:E906-13), abstract-only in the cache. The paper
      maps the oral ectoderm regulatory states that include the veg1 lim1 domain, but the
      abstract does not name lim1, so no lim1-specific claim is drawn from it.
