core_functions:
- description: >-
    LIM-homeodomain transcription factor of the embryonic ectoderm gene regulatory
    network. Lim1 is expressed from hatching to gastrulation in the border (veg1)
    ectoderm adjacent to the endomesoderm on both the oral and aboral sides, where it is
    activated downstream of endodermal Wnt5 signalling, independently of Nodal and Not,
    and is presumed to regulate RNA polymerase II transcription of ectodermal regulatory
    genes; ectopic expression of the Hemicentrotus ortholog reprograms the embryo toward
    an oral ectoderm marker state.
  molecular_function:
    id: GO:0000981
    label: DNA-binding transcription factor activity, RNA polymerase II-specific
  directly_involved_in:
  - id: GO:0006357
    label: regulation of transcription by RNA polymerase II
  - id: GO:0007398
    label: ectoderm development
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:19268450
    supporting_text: the lim1 gene, which is expressed along the lower margin of both
      oral and aboral ectoderm
  - reference_id: PMID:24227654
    supporting_text: This signal activates a unique subcircuit of the ectoderm gene
      regulatory network, including the transcription factors IrxA, Nk1, Pax2/5/8 and
      Lim1, which are ultimately restricted to subregions of the border ectoderm (BE).
  - reference_id: PMID:10400389
    supporting_text: HpLim1 mRNA-injected embryos became spherical with markedly reduced
      gut formation, failed to express marker proteins for aboral ectoderm and mesoderm,
      and mainly expressed an oral ectoderm marker.
  knowledge_gaps:
  - gap_statement: >-
      No loss-of-function (morpholino or genome editing) study of lim1 has been reported in
      any sea urchin, so the regulatory outputs of Lim1 in the border ectoderm, and whether
      it is an activator or a repressor, are unknown.
    boundary: >-
      Expression and upstream-input perturbations (Wnt5, Nodal, BMP2/4 in Lytechinus; Not
      in S. purpuratus) place lim1 in the border-ectoderm regulatory state; the only
      functional perturbation is HpLim1 mRNA overexpression in Hemicentrotus.
    gap_kind:
    - BIOLOGY
suggested_questions:
- question: Is Lim1 a direct activator or repressor in the border ectoderm, and which of
    the other border ectoderm regulatory genes (nk1, irxA, pax2/5/8, vegf3) or the
    endoderm/ectoderm boundary repressors are its direct targets?
- question: Does S. purpuratus lim1 show the same Wnt5 dependence that was demonstrated for
    Lim1 in Lytechinus variegatus, and is the response direct (Tcf sites in a lim1
    cis-regulatory module)?
- question: Does Lim1 contribute to the later neurogenic ciliary band, as the PAINT
    neuron-differentiation inference would predict, or is its role confined to the
    pregastrular patterning of the ectoderm/endoderm border?
suggested_experiments:
- description: lim1 morpholino or Cas9 knockdown in S. purpuratus with Nanostring/QPCR and
    in situ readout of border ectoderm genes (nk1, irxA, pax2/5/8, vegf3, wnt5) and of
    adjacent endoderm genes at 12-24 h, to define the regulatory outputs of Lim1 and the
    sign of its action.
- description: BAC-reporter dissection of the lim1 locus to identify the border-ectoderm
    cis-regulatory module and test Tcf (Wnt5), Smad (Nodal/BMP2/4) and Not sites by site
    mutagenesis.
- description: Double in situ hybridisation of lim1 with synaptotagmin B and other neural
    markers at pluteus stage to test whether lim1-expressing border ectoderm cells
    contribute to ciliary band neurons.
