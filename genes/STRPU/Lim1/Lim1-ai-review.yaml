taxon:
  id: NCBITaxon:7668
  label: Strongylocentrotus purpuratus
description: >-
  Lim1 is the sea urchin ortholog of the vertebrate Lhx1/Lhx5 LIM-homeodomain
  transcription factors, a 480-residue protein with two N-terminal LIM
  zinc-finger domains followed by a LIM-class homeodomain. It is a zygotically
  expressed regulatory gene of the embryonic ectoderm: transcripts appear
  around hatching (about 8 h) in a ring of ectoderm cells immediately adjacent
  to the vegetal endomesoderm, extending across both the oral and the aboral
  face of the embryo (the "veg1" or "border" ectoderm), and decline by
  gastrulation. Its expression is independent of Nodal signalling and of the
  Nodal-dependent homeodomain repressor Not, and in Lytechinus it is the
  earliest gene activated in the border ectoderm by a short-range Wnt5 signal
  from the adjacent endoderm, with Nodal and BMP2/4 later restricting the
  border-ectoderm genes to subregions. In Hemicentrotus, ectopic HpLim1 mRNA
  suppresses gut, mesoderm and aboral ectoderm differentiation and drives
  embryo-wide expression of an oral ectoderm marker, indicating that the
  protein acts as a sequence-specific transcriptional regulator of ectodermal
  regulatory state.
