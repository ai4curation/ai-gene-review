  review:
    summary: Pmar1 represses transcription of hesC in the micromeres. In a QPCR screen of 46
      regulatory genes after forced global pmar1 expression, hesC was one of five genes
      significantly down-regulated at both 9 and 12 h; hesC morpholino knockdown phenocopies
      pmar1 overexpression, and hesC is expressed everywhere except the micromeres where
      Pmar1 is present. This is the regulatory step Pmar1 itself performs in the
      double-negative gate.
    action: NEW
    reason: Pmar1 is the gene product that carries out the repression (participation test
      passed); hesC is the direct process target. Downstream derepression of delta, alx1,
      ets1 and tbr is performed by relief of HesC and is not annotated to Pmar1.
    additional_reference_ids:
    - PMID:18413610
    supported_by:
    - reference_id: PMID:17636127
      supporting_text: Five of the 46 regulatory genes tested were found to be significantly
        down-regulated at both time points in the two experiments performed. These genes were
        six3 , smadIP , awh , hesC , and foxJ1
    - reference_id: PMID:18413610
      supporting_text: HesC is expressed zygotically early in cleavage, in all cells of the
        embryo except the micromeres, where Pmar1 prevents its expression.
- term:
    id: GO:0007501
    label: mesodermal cell fate specification
  evidence_type: IMP
  original_reference_id: PMID:12781680
  qualifier: involved_in
  review:
    summary: Pmar1 is the lineage-initiating regulator of the skeletogenic micromere
      (primary mesenchyme) fate. Micromeres in which beta-catenin nuclearization is blocked
      remain unspecified, and expression of Pmar1 in such micromeres rescues the entire
      micromere program in chimeras, including the PMC differentiation program; even
      presumptive ectoderm cells carrying pmar1 mRNA can substitute for micromeres. Global
      pmar1 expression converts the whole embryo into skeletogenic mesenchyme. The
      specification is cell-autonomous once pmar1 is on, matching the GO definition of
      mesodermal cell fate specification.
    action: NEW
    reason: Pmar1 itself performs the first regulatory step of the specification circuit
      (repression of hesC that unlocks alx1/ets1/tbr/tel), so it participates in, rather than
      merely being required for, specification of the mesodermal micromere lineage. Downstream
      Delta/Notch signalling to secondary mesoderm and endomesoderm induction of neighbouring
      cells are executed by other gene products and are not annotated here.
    additional_reference_ids:
    - PMID:18413610
    - PMID:12027443
    supported_by:
    - reference_id: PMID:12781680
      supporting_text: Pmar1 is an important transcription factor necessary for initiating the
        micromere specification program and for the expression of two inductive signals
        produced by micromeres.
    - reference_id: PMID:18413610
      supporting_text: So pmar1 is necessary and sufficient; no other β-catenin/Tcf target
        need be involved.
    - reference_id: PMID:12027443
      supporting_text: This results in transformation of much of the embryo into skeletogenic
        mesenchyme cells that express skeletogenic markers.
