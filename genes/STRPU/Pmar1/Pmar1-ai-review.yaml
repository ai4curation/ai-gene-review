- id: PMID:12027443
  title: A regulatory gene network that directs micromere specification in the sea urchin embryo.
  findings:
  - statement: pmar1 encodes a paired-class homeodomain factor expressed only in micromeres
      during cleavage/early blastula, activated by Otx and beta-catenin/Tcf, and acting as a
      repressor of a repressor.
    supporting_text: pmar1 is expressed only during cleavage and early blastula stages, and
      exclusively in micromeres. It is initially activated as soon as the micromeres are
      formed, in response to Otx and beta-Catenin/Tcf inputs.
  - statement: Pmar1 mRNA and an Engrailed-Pmar1 fusion give identical derepression phenotypes,
      establishing that Pmar1 is a repressor.
    supporting_text: "In both cases, the effects are derepression: of the delta gene; and of skeletogenic genes, including several transcription factors normally expressed only in micromere descendants, and also a set of downstream skeletogenic differentiation genes."
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified (Oliveri, Carrick, Davidson, Dev Biol 2002); the discovery paper
      for pmar1 and the UniProt-cited reference for Q8WRE9. Abstract only in cache.
- id: PMID:12781680
  title: Activation of pmar1 controls specification of micromeres in the sea urchin embryo.
  findings:
  - statement: Pmar1 expression rescues all micromere functions in beta-catenin-blocked
      micromeres transplanted into micromereless hosts.
    supporting_text: When such beta-catenin-blocked micromeres also express Pmar1, all observed
      micromere functions are rescued.
  - statement: Mosaic Pmar1 expression induces ectopic endo16 in adjacent cells, showing Pmar1
      controls the early endomesoderm induction signal.
    supporting_text: Pmar1 expressed mosaically from inserted DNA constructs causes induction of
      ectopic Endo 16 in adjacent cells
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified title (Oliveri, Davidson, McClay, Dev Biol 2003); chimera and
      transplant tests of the GRN prediction that pmar1 initiates micromere specification.
      Abstract only in cache.
- id: PMID:17636127
  title: 'A missing link in the sea urchin embryo gene regulatory network: hesC and the double-negative
    specification of micromeres.'
  findings:
  - statement: hesC is the repressor-of-micromeres gene repressed by Pmar1; hesC knockdown
      phenocopies global pmar1 overexpression.
    supporting_text: As logically required, blockade of hesC mRNA translation and global
      overexpression of pmar1 mRNA have the same effect, which is to cause all of the cells of
      the embryo to express micromere-specific genes.
  - statement: Direct Pmar1 binding to hesC regulatory DNA is inferred but not yet demonstrated.
    supporting_text: Although this remains to be finally authenticated by identification of the
      cis -regulatory target sites, HesC interactions with the target genes of Fig. 1 D are
      likely to be direct, as is likely to be the interaction of Pmar1 with the hesC regulatory
      apparatus.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached; identifies hesC as the Pmar1 target by QPCR screen after pmar1
      mRNA overexpression and hesC MASO phenocopy.
- id: PMID:18413610
  title: Global regulatory logic for specification of an embryonic cell lineage.
  findings:
  - statement: pmar1 is a small cluster of near-identical genes activated by beta-catenin/Tcf plus
      Otx, expressed transiently from late fourth cleavage.
    supporting_text: The first genes in the sequence are the pmar1 genes (there is a cluster of
      several very similar pmar1 genes). The pmar1 genes are activated by the β-catenin/Tcf
      transcription complex plus Otx
  - statement: pmar1 is necessary and sufficient for skeletogenic micromere specification.
    supporting_text: So pmar1 is necessary and sufficient; no other β-catenin/Tcf target need be
      involved.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached; synthesis of the skeletogenic micromere GRN with the
      pmar1-hesC double-negative gate as its first subcircuit.
