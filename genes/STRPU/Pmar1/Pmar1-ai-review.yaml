suggested_questions:
- question: Which member(s) of the pmar1 gene cluster does Q8WRE9 represent, and do the several
    near-identical copies differ in expression level, timing or function?
- question: Does Pmar1 bind the hesC cis-regulatory region directly, and what is its DNA-binding
    specificity (paired-class homeodomain P3/P2 site preference)?
- question: Which additional repressors, if any, are controlled by Pmar1 to account for the
    hesC-independent early activation of alx1 and delta?
suggested_experiments:
- description: Map Pmar1 occupancy on the hesC locus by ChIP or DNA-affinity assays with a tagged
    Pmar1 in cleavage-stage embryos, and test candidate sites in hesC reporter constructs for loss
    of micromere repression.
  hypothesis: Pmar1 represses hesC directly through one or more paired-class homeodomain sites in
    the hesC cis-regulatory module.
- description: Repeat the pmar1 mRNA-overexpression QPCR screen with a hesC morpholino background to
    isolate hesC-independent Pmar1 targets among early regulatory genes.
  hypothesis: Pmar1 represses at least one additional early repressor that gates alx1 and delta
    activation.
