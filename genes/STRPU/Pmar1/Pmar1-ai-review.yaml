    label: nucleus
  supported_by:
  - reference_id: PMID:17636127
    supporting_text: A gene encoding a transcriptional repressor, pmar1 , is activated specifically
      in micromeres, where it represses transcription of a second repressor that is otherwise
      active globally.
  - reference_id: PMID:12781680
    supporting_text: Pmar1 is an important transcription factor necessary for initiating the
      micromere specification program and for the expression of two inductive signals produced
      by micromeres.
  - reference_id: PMID:18413610
    supporting_text: So pmar1 is necessary and sufficient; no other β-catenin/Tcf target need be
      involved.
