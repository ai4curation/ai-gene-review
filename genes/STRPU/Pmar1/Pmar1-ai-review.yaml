core_functions:
- description: Micromere-specific transcriptional repression of hesC that opens the double-negative
    gate of the skeletogenic micromere gene regulatory network. Pmar1, a paired-class homeodomain
    repressor activated by beta-catenin/Tcf and Otx at fourth cleavage, acts in the micromere
    nucleus to shut off transcription of the globally expressed repressor hesC, thereby permitting
    expression of alx1, ets1, tbr, tel and delta only in this lineage. Its expression is necessary
    and sufficient to specify the skeletogenic (mesodermal) micromere fate.
  molecular_function:
    id: GO:0001227
    label: DNA-binding transcription repressor activity, RNA polymerase II-specific
  directly_involved_in:
  - id: GO:0000122
    label: negative regulation of transcription by RNA polymerase II
  - id: GO:0007501
    label: mesodermal cell fate specification
  locations:
