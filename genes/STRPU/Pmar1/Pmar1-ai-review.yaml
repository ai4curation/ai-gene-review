taxon:
  id: NCBITaxon:7668
  label: Strongylocentrotus purpuratus
description: Pmar1 (paired-class micromere anti-repressor) is a paired-class homeodomain
  transcriptional repressor of the purple sea urchin, encoded by a small cluster of near-identical
  pmar1 genes. It is expressed transiently and exclusively in the micromeres of the cleaving
  embryo, switching on at the fourth cleavage in response to nuclear beta-catenin/Tcf together
  with Otx and disappearing by early blastula stage. In the nucleus of the micromeres Pmar1
  represses transcription of hesC, a second repressor that is otherwise expressed throughout
  the embryo and that silences the regulatory genes alx1, ets1, tbr and tel and the Notch
  ligand gene delta. This double-negative gate confines the skeletogenic regulatory state to
  the micromere lineage. Forced expression of Pmar1 in every cell, or of an Engrailed-Pmar1
  fusion, converts most of the embryo into skeletogenic mesenchyme, and Pmar1 alone rescues
  specification in micromeres in which beta-catenin signalling is blocked, so Pmar1 is
  necessary and sufficient to initiate skeletogenic micromere specification and, through the
  gate, the expression of the micromere-derived Delta and endomesoderm-inducing signals.
