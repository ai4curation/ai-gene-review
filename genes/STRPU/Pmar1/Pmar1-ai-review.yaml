  review:
    summary: Pmar1 is a paired-class homeodomain protein that acts in vivo as a transcriptional
      repressor. Global expression of pmar1 mRNA and of an Engrailed-Pmar1 repressor-domain
      fusion give identical derepression phenotypes (ectopic delta and skeletogenic gene
      expression), and forced Pmar1 expression lowers hesC transcript levels, identifying
      hesC as the repressed target. Direct binding of Pmar1 to hesC cis-regulatory DNA has not
      been mapped, so the term is supported by gain-of-function equivalence and target
      down-regulation rather than a reporter assay.
    action: NEW
