- term:
    id: GO:0019288
    label: isopentenyl diphosphate biosynthetic process, methylerythritol phosphate
      pathway
  evidence_type: IGI
  original_reference_id: PMID:20660776
  qualifier: involved_in
  review:
    summary: >-
      DRL carries out the DXP to MEP step of the MEP pathway in B. abortus, which
      lacks DXR.
    action: NEW
    reason: >-
      DRL itself performs a step of the pathway, the NADPH-dependent
      reductoisomerization of DXP to MEP, which is the step for which DXR enzymes
      carry this term; the gene product is not merely required for the pathway.
      B. abortus has homologues of all other MEP pathway enzymes but no DXR, and
      BAB2_0264 restores mevalonate-independent growth of a dxr-deleted E. coli strain
      while failing to rescue DXS or MEP cytidylyltransferase mutants, placing it at
      exactly that step. The evidence code reflects the genetic complementation
      experiment.
    supported_by:
    - *id002
    - *id003
    - reference_id: PMID:20660776
      supporting_text: expression of BAB2_0264 in these strains did not rescue their
        MVA auxotrophy
