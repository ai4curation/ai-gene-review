  review:
    summary: >-
      Generic oxidoreductase activity from the InterPro Asp/homoserine dehydrogenase
      NAD(P)-binding domain signature.
    action: MODIFY
    reason: >-
      Correct but general. The purified BAB2_0264 protein converts DXP to MEP in an
      NADPH-dependent reaction and the gene fully complements a dxr-deleted E. coli
      strain, so the supported specific activity is GO:0030604, an is_a descendant of
      oxidoreductase activity (through GO:0016616, acting on the CH-OH group of donors
      with NAD or NADP as acceptor). The low turnover relative to DXR does not make
      this a secondary activity, because B. abortus has no DXR yet has the rest of the
      MEP pathway, so DRL is its only route from DXP to MEP.
