id: Q2YIM3
gene_symbol: BAB2_0264
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:359391
  label: Brucella abortus 2308
description: >-
  BAB2_0264 encodes DRL, the deoxyxylulose-5-phosphate reductoisomerase-like enzyme
  of Brucella abortus, which catalyses the NADPH-dependent conversion of
  1-deoxy-D-xylulose 5-phosphate (DXP) to 2-C-methyl-D-erythritol 4-phosphate (MEP),
  the first committed step of the methylerythritol phosphate pathway for isoprenoid
  precursor biosynthesis. B. abortus lacks the canonical DXR, and DRL is unrelated to
  it in sequence, belonging instead to a family similar to homoserine dehydrogenase,
  with an N-terminal NAD(P)-binding Rossmann domain and a C-terminal SAF domain. The
  enzyme is a homodimer whose three-domain fold and active site differ from those of
  DXR; it is inhibited by fosmidomycin but has a turnover number two to three orders
  of magnitude below typical DXR enzymes. DRL homologues that complement DXR-deficient
  Escherichia coli form a monophyletic clade scattered across alpha-proteobacteria,
  firmicutes and a few other bacterial lineages.
