suggested_questions:
- question: >-
    Does DRL use the same retro-aldol isomerization followed by NADPH reduction as
    DXR, and which active-site residues, including the magnesium ligands seen in the
    crystal structures, are catalytic?
- question: >-
    Is the low turnover number of recombinant DRL intrinsic to the enzyme or a
    consequence of the C-terminal histidine tag and assay conditions, and is this step
    rate-limiting for isoprenoid synthesis in Brucella?
suggested_experiments:
- description: >-
    Determine steady-state kinetics and the metal requirement of untagged DRL,
    together with site-directed mutants of the magnesium-coordinating residues
    identified in the crystal structures, to establish the catalytic mechanism.
- description: >-
    Construct a conditional BAB2_0264 depletion strain of B. abortus and measure MEP
    pathway intermediates and isoprenoid output, to test whether DRL is essential and
    rate-limiting in its native organism.
