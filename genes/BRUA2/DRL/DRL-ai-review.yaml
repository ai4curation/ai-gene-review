  review:
    summary: >-
      Purified recombinant DRL produces MEP from DXP with NADPH; the product was
      confirmed by mass spectrometry and the activity is inhibited by fosmidomycin.
    action: NEW
    reason: >-
      A direct in vitro assay of the purified protein establishes the exact reaction,
      with kinetic parameters reported (Km for DXP 109 micromolar). It is corroborated
      in vivo by full complementation of a dxr-deleted E. coli strain by BAB2_0264
      alone, and the crystallographic study describes the same enzyme as catalysing
      the DXR reaction. The current GOA rows stop at generic oxidoreductase activity.
