core_functions:
- description: >-
    NADPH-dependent reductoisomerase that converts 1-deoxy-D-xylulose 5-phosphate into
    2-C-methyl-D-erythritol 4-phosphate, the first committed step of the MEP pathway,
    taking the place of the DXR enzyme that B. abortus lacks.
