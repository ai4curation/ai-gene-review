      surfaces
  knowledge_gaps:
  - gap_statement: >-
      The molecular activity of CLIPA8 is unknown. It is required for cleavage of
      downstream CLIPs and for PPO activation, but whether it acts as a cofactor of a
      PPO-activating protease, binds PPO or microbial surfaces, or works by some other
      mechanism has not been tested.
    boundary: >-
      Established: CLIPA8 is noncatalytic, is cleaved after infection downstream of TEP1
      and SPCLIP1, is cleaved in vitro by CLIPB4, CLIPB9 and CLIPB10, and is genetically
      required for CLIPA28, CLIPB10 and CLIPC9 cleavage and PPO activation.
    gap_kind:
    - BIOLOGY
suggested_questions:
- question: >-
    Does cleaved CLIPA8 act as a cofactor that enhances PPO cleavage by a CLIPB
    prophenoloxidase-activating protease, analogous to the lepidopteran SPH1/SPH2 cofactor
    complex, and if so which GO molecular function term should represent it?
- question: >-
    Which CLIPA8 functions can be transferred to other descendants of PANTHER node
    PTN000667087 (for example Drosophila Scarface)? Only the node-level extracellular and
    innate immune claims are shared by descent; the melanization-cascade hierarchy is
    specific to the mosquito CLIPA lineage unless a resolved tree shows otherwise.
suggested_experiments:
- description: >-
    Reconstitute PPO activation in vitro with activated CLIPB4/CLIPB9/CLIPB10, PPO6 and
    full-length versus pre-cleaved recombinant CLIPA8 (and an IMLR cleavage-site mutant)
    to test for a direct cofactor activity.
  experiment_type: in vitro reconstitution
- description: >-
    Immunolocalise CLIPA8 on E. coli and B. bassiana hyphae in wild-type and TEP1 or
    SPCLIP1 knockdown mosquitoes to test whether the cleaved form is recruited to
    microbial surfaces.
  experiment_type: immunofluorescence microscopy
