- term:
    id: GO:0042742
    label: defense response to bacterium
  evidence_type: IMP
  original_reference_id: PMID:17537726
  qualifier: involved_in
  review:
    summary: >-
      CLIPA8 is required for melanization of Gram-positive and Gram-negative bacteria in
      the hemocoel, although knockdown does not reduce survival after bacterial infection.
    action: ACCEPT
    reason: >-
      Melanization of bacteria is a defense response against bacteria, and CLIPA8 is
      required for it. The finding that knockdown mosquitoes survive and clear bacteria as
      well as controls shows that this branch is dispensable for survival, not that CLIPA8
      is uninvolved; the annotation asserts involvement, which is supported. The survival
      result should be kept in mind before treating CLIPA8 as an antibacterial resistance
      factor.
    supported_by:
