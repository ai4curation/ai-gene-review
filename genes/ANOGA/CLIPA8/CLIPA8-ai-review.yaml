core_functions:
- description: >-
    Secreted noncatalytic clip-domain serine protease homolog that, after its own
    TEP1- and SPCLIP1-dependent cleavage in the hemolymph, is required for activation
    cleavage of downstream CLIPs (CLIPA28, CLIPB10, CLIPC9), prophenoloxidase activation
    and phenoloxidase recruitment to microbial surfaces, thereby promoting pathogen-directed
    melanization of bacteria, fungal hyphae and Plasmodium ookinetes. Experimentally
    established in A. gambiae by RNAi and hemolymph biochemistry; the molecular activity
    (for example a protease cofactor function) is not established.
  directly_involved_in:
  - id: GO:0035008
    label: positive regulation of melanization defense response
  - id: GO:0010954
    label: positive regulation of protein processing
  - id: GO:0061760
    label: antifungal innate immune response
  locations:
  - id: GO:0005576
    label: extracellular region
  supported_by:
  - reference_id: PMID:17537726
    supporting_text: >-
      CLIPA8 silencing by RNA interference inhibits pro-phenoloxidase activation and
      melanization of bacteria in the hemolymph following microbial challenge
  - reference_id: PMID:33045027
    supporting_text: >-
      CLIPC9 cleavage is inhibited following SPCLIP1, CLIPA8, and CLIPA28 knockdown
      positioning it downstream of the CLIP-SPH cascade
  - reference_id: PMID:23166497
