  evidence_type: IMP
  original_reference_id: PMID:33045027
  qualifier: involved_in
  review:
    summary: >-
      CLIPA8 is required for melanization of P. berghei ookinetes in CTL4-depleted
      mosquitoes; co-silencing rescues live oocysts.
    action: ACCEPT
    reason: >-
      Plasmodium is a symbiont in the GO sense. CLIPA8 is required for the melanotic
      killing of ookinetes in CTL4 knockdown mosquitoes (and for melanization of dead
      ookinetes in the refractory L3-5 strain), while single knockdown in susceptible G3
