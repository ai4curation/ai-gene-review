  qualifier: enables
  supporting_entities:
  - InterPro:IPR001254
  review:
    summary: >-
      InterPro2GO mapping from the trypsin-like domain signature. CLIPA8 has the S1 fold
      but lacks the catalytic serine, so it is not an endopeptidase.
    action: REMOVE
    reason: >-
      The catalytic Ser195 position of the triad is Gly in CLIPA8 (CDGDGGSG instead of
      the canonical GDSGGP; His163 and Asp212 are kept), as recorded in the curated
      UniProt caution and confirmed by the motif scan in the bioinformatics folder.
      Without the nucleophilic serine the charge-relay mechanism cannot operate. The
      experimental literature consistently describes CLIPA8 as a noncatalytic serine
      protease homolog. The InterPro domain match supports family membership, not
      catalysis; this is a pseudoenzyme over-annotation.
    additional_reference_ids:
    - file:ANOGA/CLIPA8/CLIPA8-bioinformatics/RESULTS.md
    supported_by:
    - reference_id: file:ANOGA/CLIPA8/CLIPA8-uniprot.txt
      supporting_text: >-
        Although it belongs to peptidase S1 family, lacks the conserved Ser residue
        within the catalytic triad (Asp-His-Ser) which is replaced by a Gly residue,
        probably resulting in a loss of proteolytic activity.
    - reference_id: file:ANOGA/CLIPA8/CLIPA8-bioinformatics/RESULTS.md
