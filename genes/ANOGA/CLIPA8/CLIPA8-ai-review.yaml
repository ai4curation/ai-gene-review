id: A0A1S4H5S2
gene_symbol: CLIPA8
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:7165
  label: Anopheles gambiae
description: >-
  CLIPA8 (AGAP010731) is a secreted clip-domain serine protease homolog (cSPH) of the
  CLIPA subfamily in the malaria mosquito Anopheles gambiae. It has an N-terminal clip
  domain and a C-terminal trypsin-like protease-like domain in which the catalytic serine
  is replaced by glycine, so it is not a protease. CLIPA8 circulates in the hemolymph as a
  full-length precursor and, after microbial infection, is cleaved into a disulfide-linked
  light (clip) and heavy (protease-like) chain. Its cleavage depends on the complement-like
  protein TEP1 and the upstream cSPH SPCLIP1 and is restrained by the serpin SRPN2. Within
  a hierarchical noncatalytic module (SPCLIP1, then CLIPA8, then CLIPA28), CLIPA8 is
  required for the cleavage of downstream catalytic and noncatalytic CLIPs (CLIPA28,
  CLIPB10, CLIPC9), for prophenoloxidase activation and for phenoloxidase recruitment to
  microbial surfaces. RNAi knockdown abolishes melanization of bacteria, of Beauveria
  bassiana hyphae and of Plasmodium berghei ookinetes (in refractory or CTL4-depleted
  mosquitoes), and increases susceptibility to fungal infection, but does not affect
  wound melanization or survival after bacterial infection. How CLIPA8 promotes
  downstream protease activation at the molecular level (for example as a protease
  cofactor) has not been shown biochemically.
