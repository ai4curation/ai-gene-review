    label: proteolysis
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR001254
  review:
    summary: >-
      InterPro2GO process mapping from the trypsin-like domain. CLIPA8 is noncatalytic;
      it is a substrate of proteolysis, not a protease.
    action: REMOVE
    reason: >-
      Proteolysis names the entity that hydrolyses peptide bonds. CLIPA8 lacks the
      catalytic serine and does not cleave anything; it is itself cleaved, in vitro by
      activated CLIPB4, CLIPB9 and CLIPB10. Being the substrate is not participation.
      Its genuine role, promoting the cleavage of other CLIPs, is captured by the IMP
      positive regulation of protein processing row.
    supported_by:
    - reference_id: file:ANOGA/CLIPA8/CLIPA8-uniprot.txt
      supporting_text: >-
        lacks the conserved Ser residue within the catalytic triad (Asp-His-Ser) which is
        replaced by a Gly residue
