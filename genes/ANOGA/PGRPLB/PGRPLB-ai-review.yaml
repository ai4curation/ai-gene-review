gene_symbol: PGRPLB
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:7165
  label: Anopheles gambiae
description: PGRP-LB (AGAP001212) is an Anopheles gambiae peptidoglycan recognition protein with a 
  conserved zinc-dependent amidase domain. Phylogenetic evidence supports cleavage of bacterial 
  peptidoglycan, reducing immunostimulatory ligands and regulating the IMD/REL2 innate immune 
  pathway. Work on the Anopheles coluzzii ortholog shows that gut PGRPLB restrains late systemic 
  antimicrobial responses after blood feeding, with no change in the measured local midgut CEC1 
  response upon knockdown. Two predicted membrane-associated isoforms differ in their transmembrane 
  regions; their detailed localization and secretion remain unresolved.
existing_annotations:
- term:
    id: GO:0005615
    label: extracellular space
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: Extracellular-space localization remains unresolved for the predicted 
      membrane-associated mosquito PGRP-LB products.
    action: UNDECIDED
    reason: GOA traces this IBA to PTN002475783 in PTHR11022. The current PAINT snapshot places 
      extracellular region at this node, whereas the older row specifies extracellular space. 
      PMID:28494453 describes two Anopheles coluzzii PGRPLB isoforms differing in predicted 
      transmembrane domains, but does not experimentally establish secretion, ectodomain release, or
      complete exclusion from extracellular space. Membrane prediction is insufficient to replace an
      inherited extracellular annotation categorically. Keep the original location unresolved 
      pending isoform-resolved localization assessment.
    propagation_review:
      root_cause: UNRESOLVED
      source_entities:
      - source_id: PANTHER:PTN002475783
        source_label: PTN002475783
        source_status: UNRESOLVED
        comment: Current IBD is extracellular region; GOA carries extracellular space. Predicted 
          membrane topology raises a location question but is not a demonstrated loss.
    supported_by:
    - reference_id: PMID:28494453
      supporting_text: PGRPLB encodes 2 isoforms, which share the same PGRP domain and differ in 
        their transmembrane domains
- term:
    id: GO:0006955
    label: immune response
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: Immune regulation is central to PGRP-LB function and supports this broad immune-process
      annotation.
    action: ACCEPT
    reason: An amidase that removes immune-stimulating peptidoglycan performs a regulatory step in 
      immunity; it need not activate an immune response to participate. The PTHR11022 ancestral 
      immune-response placement at PTN002475783 is consistent with direct PGRPLB knockdown in 
      Anopheles coluzzii, a member of the Anopheles gambiae complex formerly designated its M form. 
      The primary experiment supports restraint of systemic responses, rather than the previous 
      claim of reduced local midgut CEC1 expression.
    supported_by:
    - reference_id: PMID:28494453
      supporting_text: PGRPLB silencing did not affect CEC1 expression in the gut but significantly 
        induced CEC1 in the fat body 72 h after the blood meal
- term:
    id: GO:0008745
    label: N-acetylmuramoyl-L-alanine amidase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: >-
      This is the correct core molecular function for PGRP-LB. Unlike the non-catalytic
      PGRP-S1, PGRP-LB retains the conserved zinc-coordinating residues required for
      N-acetylmuramoyl-L-alanine amidase activity. This enzymatic activity cleaves the
      amide bond between N-acetylmuramic acid and L-alanine in peptidoglycan stem peptides,
      thereby degrading immunostimulatory peptidoglycan fragments. The UniProt entry
      explicitly states PGRP-LB "Belongs to the N-acetylmuramoyl-L-alanine amidase 2 family"
      and annotates the Amidase_2 domain (Pfam PF01510).
    action: ACCEPT
    reason: >-
      Core molecular function annotation. PGRP-LB contains conserved PGRP and amidase
      domain residues characteristic of catalytic PGRPs. Multiple sources confirm that
      amidase-type PGRPs like PGRP-LB enzymatically degrade PGN, reducing IMD/REL2
      activation. This contrasts with non-catalytic PGRPs like PGRP-S1 which lack these
      catalytic residues.
    supported_by:
    - reference_id: file:ANOGA/PGRPLB/PGRPLB-deep-research-falcon.md
      supporting_text: "Amidase PGRPs cleave the amide bond between N-acetylmuramic acid and L-alanine
        in the PGN stem peptide (N-acetylmuramoyl-L-alanine amidase activity)"
    - reference_id: file:ANOGA/PGRPLB/PGRPLB-deep-research-falcon.md
      supporting_text: "Evidence indicates conserved PGRP domain and amidase residues characteristic of
        N-acetylmuramoyl-L-alanine amidases in insect PGRP-LB proteins"
    - reference_id: UniProt:F5HMW5
      supporting_text: "Belongs to the N-acetylmuramoyl-L-alanine amidase 2 family"

- term:
    id: GO:0016019
    label: peptidoglycan immune receptor activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: The receptor annotation requires distinguishing signal initiation from enzymatic 
      removal of the peptidoglycan ligand.
    action: UNDECIDED
    reason: PTN002475783 carries the peptidoglycan immune receptor IBD. GO:0016019 requires binding 
      peptidoglycan and transmitting a signal to initiate innate immunity. Amidase activity and 
      negative regulation do not by themselves establish this signal-initiation function, but 
      specialization as an amidase also does not prove loss of an ancestral receptor function. 
      PMID:28494453 assays immune regulation, not receptor coupling. Withdraw the confident 
      replacement by binding alone and leave this mechanistic question for focused adjudication.
    propagation_review:
      root_cause: UNRESOLVED
      source_entities:
      - source_id: PANTHER:PTN002475783
        source_label: PTN002475783
        source_status: UNRESOLVED
        comment: Retained ancestral receptor placement needs assessment of signal transmission 
          distinct from ligand hydrolysis; no donor-count objection.
    supported_by:
    - reference_id: PMID:28494453
      supporting_text: PGRPLB silencing did not affect CEC1 expression in the gut but significantly 
        induced CEC1 in the fat body 72 h after the blood meal
- term:
    id: GO:0050830
    label: defense response to Gram-positive bacterium
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: Retain the inherited Gram-positive defense context as non-core pending the focused 
      mechanistic assessment.
    action: KEEP_AS_NON_CORE
    reason: PTN002475783 places defense response to Gram-positive bacterium in the ancestral PGRP 
      clade. The previous replacement with Gram-negative defense treated DAP-type peptidoglycan as 
      exclusive to Gram-negative bacteria; some Gram-positive bacteria also contain this chemotype. 
      No target-specific loss of the inherited defense role was established. Anopheles coluzzii 
      PGRPLB directly modulates systemic immunity, although that study does not isolate a 
      Gram-positive challenge. Retain the IBA as an inference, without claiming a mosquito-specific 
      Gram-positive experiment.
    supported_by:
    - reference_id: PMID:28494453
      supporting_text: PGRPLB silencing did not affect CEC1 expression in the gut but significantly 
        induced CEC1 in the fat body 72 h after the blood meal
