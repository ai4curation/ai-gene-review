- term:
    id: GO:0008270
    label: zinc ion binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  review:
    summary: >-
      This annotation is appropriate for PGRP-LB. Unlike the non-catalytic PGRP-S1,
      PGRP-LB retains the conserved zinc-coordinating residues required for amidase
      catalytic activity. The zinc ion is essential for the N-acetylmuramoyl-L-alanine
      amidase reaction mechanism. The deep research confirms PGRP-LB has "conserved
      PGRP domain and amidase residues characteristic of N-acetylmuramoyl-L-alanine
      amidases."
    action: ACCEPT
    reason: >-
      Correct annotation. PGRP-LB is a catalytic amidase that requires zinc for its
      enzymatic activity. The InterPro-based annotation correctly identifies PGRP-LB
      as a zinc-dependent enzyme, in contrast to non-catalytic PGRPs like PGRP-S1
      which have lost the zinc-binding residues.
    supported_by:
    - reference_id: file:ANOGA/PGRPLB/PGRPLB-deep-research-falcon.md
      supporting_text: "conserved PGRP domain and amidase residues characteristic of N-acetylmuramoyl-L-alanine
        amidases in insect PGRP-LB proteins"
    - reference_id: UniProt:F5HMW5
      supporting_text: "Belongs to the N-acetylmuramoyl-L-alanine amidase 2 family"

