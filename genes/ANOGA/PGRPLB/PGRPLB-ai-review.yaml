- term:
    id: GO:0009253
    label: peptidoglycan catabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  review:
    summary: >-
      This annotation is correct for PGRP-LB. As a catalytic amidase that cleaves
      peptidoglycan, PGRP-LB directly participates in peptidoglycan catabolism. This
      contrasts with non-catalytic PGRPs like PGRP-S1 which bind but do not degrade
      peptidoglycan.
    action: ACCEPT
    reason: >-
      Correct annotation. PGRP-LB enzymatically degrades peptidoglycan through its
      N-acetylmuramoyl-L-alanine amidase activity. This is a core biological process
      annotation that accurately reflects PGRP-LB's catalytic function.
    supported_by:
    - reference_id: file:ANOGA/PGRPLB/PGRPLB-deep-research-falcon.md
      supporting_text: "amidase activity: enzymatic cleavage of peptidoglycan (N-acetylmuramoyl-L-alanine
        amidase) that reduces peptidoglycan ligands for IMD/REL2 activation"
    - reference_id: file:ANOGA/PGRPLB/PGRPLB-deep-research-falcon.md
      supporting_text: "Amidase PGRPs cleave the amide bond between N-acetylmuramic acid and L-alanine
        in the PGN stem peptide (N-acetylmuramoyl-L-alanine amidase activity), thereby reducing immunostimulatory
        PGN ligands"

- term:
    id: GO:0042834
    label: peptidoglycan binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  review:
    summary: >-
      This annotation is correct. PGRP-LB contains a PGRP domain that enables binding
      to peptidoglycan, which is a prerequisite for its amidase enzymatic activity.
      The protein must bind its substrate (peptidoglycan) before catalyzing hydrolysis.
    action: ACCEPT
    reason: >-
      Correct annotation. PGRP-LB retains the peptidoglycan binding function through
      its PGRP domain. Substrate binding is essential for its catalytic amidase activity.
      The IEA annotation from InterPro is appropriate.
    supported_by:
    - reference_id: file:ANOGA/PGRPLB/PGRPLB-deep-research-falcon.md
      supporting_text: "PGRP-LB is an amidase-type PGRP that recognizes bacterial peptidoglycan (PGN)
        and enzymatically degrades it"

- term:
    id: GO:0045087
    label: innate immune response
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  review:
    summary: >-
      This annotation is accurate. PGRP-LB is a component of the insect innate immune
      system, specifically functioning to modulate (negatively regulate) the IMD/REL2
      pathway. It acts by degrading peptidoglycan to prevent immune overactivation.
    action: ACCEPT
    reason: >-
      Appropriate annotation for PGRP-LB's role in innate immunity. PGRPs are key
      components of the insect innate immune system. PGRP-LB specifically functions
      as a negative regulator by degrading peptidoglycan to maintain immune homeostasis.
    supported_by:
    - reference_id: file:ANOGA/PGRPLB/PGRPLB-deep-research-falcon.md
      supporting_text: "PGRP-LB function is situated within gut/midgut immunity and microbiota homeostasis;
        Anopheles midgut studies integrating PGRP family functions link PGRP-LB to IMD/REL2 regulation"

- term:
    id: GO:0061060
    label: negative regulation of peptidoglycan recognition protein signaling pathway
  evidence_type: ISS
  original_reference_id: PMID:28494453
  review:
    summary: PGRP-LB suppresses peptidoglycan-triggered immune signaling through its conserved 
      amidase role.
    action: NEW
    reason: Retain the pre-existing proposal for negative regulation of peptidoglycan recognition 
      protein signaling. The PGRPLB ortholog in Anopheles coluzzii directly restrains systemic CEC1 
      induction after blood feeding. The protein itself is inferred to perform the ligand-cleavage 
      step, satisfying participation rather than merely serving as a substrate. The direct mosquito 
      result and conserved amidase mechanism support the existing proposal; the old 
      reviewer-authored IBA metadata has been corrected to ISS with the close-ortholog primary 
      reference, rather than claiming that this proposed term was found on PTN002475783.
    supported_by:
    - reference_id: PMID:28494453
      supporting_text: PGRPLB silencing did not affect CEC1 expression in the gut but significantly 
        induced CEC1 in the fat body 72 h after the blood meal
