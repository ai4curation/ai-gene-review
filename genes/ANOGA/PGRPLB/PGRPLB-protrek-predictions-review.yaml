    label: peptidoglycan immune receptor activity
  predicted_term_type: GO_MF
  review:
    assessment: CNN
    confidence_score: 2
    summary: >-
      Top-ranked hit (score 19.45), an exact match to the IBA annotation in GOA. Correct at the level
      of the record, though it emphasises the receptor framing that fits the non-catalytic short-form
      PGRPs, whereas this review's account of PGRP-LB is a catalytic amidase acting as a scavenger.
      Already annotated, so not novel; the amidase activity that GOA also carries by IBA and that
      all three models recover is not what ProTrek ranks first.
    supported_by:
