  predicted_term_type: GO_BP
  review:
    assessment: NPI
    confidence_score: 0
    error_type: FREQUENCY_BIAS
    summary: >-
      Rank 3 (score 16.65), 0.24 units below rank 2 and asserting the opposite regulatory sign. PGRP-LB
      is a negative regulator; positive regulation of the same pathway is the role of the recognition
      PGRPs such as PGRP-LC/LE. Presenting both directions adjacent in the ranked list means the correct
      call at rank 2 carries no more weight than its contradiction, which is the recurring directional
      blindness of this retrieval mode.
    supported_by:
    - reference_id: GO_REF:0000033
      supporting_text: >-
        Annotation inferences using phylogenetic trees
