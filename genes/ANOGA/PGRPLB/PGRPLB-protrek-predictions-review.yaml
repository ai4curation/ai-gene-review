id: F5HMW5
gene_symbol: PGRPLB
taxon:
  id: NCBITaxon:7165
  label: Anopheles gambiae (African malaria mosquito)
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for Anopheles PGRP-LB, a catalytic long-form peptidoglycan recognition
  protein that degrades peptidoglycan to damp IMD/REL2 signalling. ProTrek recovers the review's core
  biological process exactly at rank 2 - negative regulation of the peptidoglycan recognition protein
  signaling pathway, which is absent from GOA - and then immediately offers the opposite-signed term
  at rank 3. Its free-text Function channel returns the amidase scavenger description at 20.3. Assessment:
  1 correct novel (COR), 1 correct not novel (CNN), 1 nonparalog incorrect (NPI).
