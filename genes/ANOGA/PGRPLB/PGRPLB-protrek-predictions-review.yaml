  predicted_term:
    id: GO:0061060
    label: negative regulation of peptidoglycan recognition protein signaling pathway
  predicted_term_type: GO_BP
  review:
    assessment: COR
    confidence_score: 2
    summary: >-
      Rank 2 (score 16.89), absent from GOA and an exact match to this review's core biological process.
      It captures the distinctive biology of PGRP-LB - that degrading DAP-type peptidoglycan removes
      the immunostimulatory ligand and so negatively regulates IMD/REL2 - rather than the generic
      recognition role. Neither GO-GPT nor BioReason-SFT recovers this term for this gene, so it is
      ProTrek's clearest added value on the ARGO139 cohort so far.
    supported_by:
    - reference_id: GO_REF:0000033
      supporting_text: >-
        Annotation inferences using phylogenetic trees
