suggested_questions:
- question: Does Anopheles TOLL9 recognize LPS through an MD-2-like partner, an endogenous Spaetzle ligand,
    or a different input? Distinguish Bombyx ligand evidence from canonical Drosophila Toll assumptions.
- question: Which TIR-dependent partners and physiological immune responses require AGAP006974 itself? mosGILT-dependent
    transcript changes do not answer receptor necessity or direct activity.
suggested_experiments:
- description: Test purified or cell-expressed TOLL9 with candidate LPS/MD-2-like and Spaetzle inputs, then
    measure receptor-dependent signaling with appropriate accessory-protein controls.
  hypothesis: TOLL9 ligand recognition may resemble the Bombyx Toll9 route or differ from it.
- description: Perturb AGAP006974 in mosquitoes and rescue with the wild-type receptor, measuring defined immune
    outputs and pathogen responses.
  hypothesis: The receptor may contribute to a subset of innate-defense responses rather than every output
    of the general Toll pathway.
