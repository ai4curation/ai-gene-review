  label: Anopheles gambiae
description: TOLL9 (AGAP006974) is an Anopheles gambiae Toll-family membrane receptor with extracellular leucine-rich
  repeats and an intracellular TIR domain. Its conserved receptor architecture and phylogenetic placement support
  transmembrane signaling, while immune-family homology and altered expression in immune-activated mosquitoes
  suggest an innate-defense role. The physiological ligand, accessory proteins and downstream pathway of this
  particular mosquito receptor remain incompletely established. Related insect Toll9 proteins can recognize
  lipopolysaccharide through MD-2-like partners, so ligand recognition need not follow the Spaetzle mechanism
  of canonical Drosophila Toll.
