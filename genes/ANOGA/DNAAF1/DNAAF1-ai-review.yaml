  - term:
      id: GO:0007368
      label: determination of left/right symmetry
    evidence_type: IBA
    original_reference_id: GO_REF:0000033
    qualifier: involved_in
    supporting_entities:
      - PANTHER:PTN002915666
      - UniProtKB:Q8NEP3
      - ZFIN:ZDB-GENE-031114-4
    review:
      summary: >-
        In vertebrates (Homo sapiens DNAAF1 and Danio rerio lrrc50/dnaaf1), DNAAF1
        is required for left-right body-axis determination because preassembly of
        outer and inner dynein arms is essential for motile nodal cilia at the
        embryonic left-right organizer. Propagating GO:0007368 from PANTHER node
        PTN002915666 to Anopheles gambiae is a lineage mismatch because dipteran
        insects lack an embryonic node and motile nodal cilia.
      action: REMOVE
      reason: >-
        Left-right symmetry determination via motile nodal cilia at the embryonic
        left-right organizer is a deuterostome/vertebrate developmental mechanism
        (human DNAAF1 Q8NEP3 and zebrafish dnaaf1 ZDB-GENE-031114-4 on PTN002915666).
        Dipteran insects such as Anopheles gambiae lack nodal cilia and establish
        left-right asymmetry via non-ciliary mechanisms, whereas insect motile
        axonemes are restricted to sperm flagella and mechanosensory chordotonal
        neurons.
      supported_by:
        - reference_id: PMID:29228333
          supporting_text: DNAAF1-RUVBL1 biochemical and genetic interactions have a
            novel functional role in symmetry breaking and cardiac development
      propagation_review:
        root_cause: PROPAGATION_BAD
        failure_modes:
          - LINEAGE_OR_TAXON_MISMATCH
        source_entities:
          - source_id: PANTHER:PTN002915666
            source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
            comment: >-
              Eukaryotic DNAAF1/ODA7 node where left-right symmetry determination
              (GO:0007368) reflects vertebrate motile nodal cilia at the embryonic
              left-right organizer (human Q8NEP3, zebrafish ZDB-GENE-031114-4), a
              developmental mechanism absent in dipteran insects.
