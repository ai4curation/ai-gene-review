      label: axoneme assembly
    evidence_type: IBA
    original_reference_id: GO_REF:0000033
    qualifier: involved_in
    supporting_entities:
      - PANTHER:PTN002915666
      - UniProtKB:Q8NEP3
      - ZFIN:ZDB-GENE-031114-4
    review:
