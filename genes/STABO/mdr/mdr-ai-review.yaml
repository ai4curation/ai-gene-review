id: H6TB12
gene_symbol: mdr
product_type: PROTEIN
status: INITIALIZED
taxon:
  id: NCBITaxon:75736
  label: Starmerella bombicola
description: Mdr (SbSLMdr.1) is an MDR-subfamily ABC transporter in the sophorolipid (SL) biosynthetic
  cluster that is largely responsible for SL export; transporter knockout reduces secretion
  to ~10% of wild type, indicating alternative routes but a major role for Mdr. The transportome
  analysis lists SbSLMdr.1 as a plasma membrane SL transporter. [PMID:34998388, PMID:23516968]
existing_annotations:
- term:
    id: GO:0005743
    label: mitochondrial inner membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  review:
    summary: The additional mitochondrial oligopeptide claims require separate localization and
      substrate assessment.
    action: UNDECIDED
    reason: The exact frozen TG graft PTN008681462 is recovered in the current PTHR43394 reference
      tree as an Embryophyta subtree; H6TB12 is not a reference leaf. Tree GO-slim retains peptide/mitochondrial
      terms there, but the latest IBD GAF places the narrow assertions on other branches and retains
      broad membrane/ABC functions along this path. PMID:23516968 and PMID:34998388 establish
      sophorolipid export genetically and full-length ABC architecture, not a direct negative
      mitochondrial-localization or oligopeptide assay. The earlier rejection inferred loss from
      predominant substrate/location. Leave each claim unresolved pending source-version/architecture
      adjudication.
    propagation_review:
      root_cause: UNRESOLVED
      source_entities:
      - source_id: PANTHER:PTN008681462
        source_label: PTN008681462
        source_status: UNRESOLVED
        comment: Frozen graft recovered; current reference subtree and GAF versions differ. Sophorolipid
          export is positive target evidence, not a universal alternative-cargo exclusion.
    supported_by:
    - reference_id: PMID:34998388
      supporting_text: Previous research demonstrated that the SbSLMdr.1, present in the SL biosynthetic
        gene cluster, is indeed largely responsible for export of SLs [10].
