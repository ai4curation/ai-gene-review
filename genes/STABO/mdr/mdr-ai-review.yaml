id: H6TB12
gene_symbol: mdr
product_type: PROTEIN
status: INITIALIZED
taxon:
  id: NCBITaxon:75736
  label: Starmerella bombicola
description: Mdr (SbSLMdr.1) is an MDR-subfamily ABC transporter in the sophorolipid (SL) biosynthetic
  cluster that is largely responsible for SL export; transporter knockout reduces secretion
  to ~10% of wild type, indicating alternative routes but a major role for Mdr. The transportome
  analysis lists SbSLMdr.1 as a plasma membrane SL transporter. [PMID:34998388, PMID:23516968]
existing_annotations:
- term:
    id: GO:0005743
    label: mitochondrial inner membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  review:
    summary: The mitochondrial inner-membrane row is a half-size Mdl1/ABCB10
      family transfer to a full-length MDR sophorolipid exporter.
    action: REMOVE
    reason: The focused architecture and provenance review found that GO:0005743,
      GO:0015421, and GO:0090374 are all supported only by the same TreeGrafter
      PTN008681462 row from the Mdl1-named PTHR43394 family. H6TB12 is a 1299 aa
      full-length MDR exporter with two nucleotide-binding domains, not a half-size
      mitochondrial peptide exporter, and the positive Starmerella evidence supports
      plasma-membrane sophorolipid export rather than mitochondrial import.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - WRONG_ORTHOLOG_OR_PARALOG
      - FUNCTIONAL_DIVERGENCE
      - COMPARTMENT_OR_COMPLEX_MISMATCH
