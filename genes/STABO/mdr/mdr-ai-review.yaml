  review:
    summary: The additional mitochondrial oligopeptide claims require separate localization
      and substrate assessment.
    action: UNDECIDED
    reason: The exact frozen TG graft PTN008681462 is recovered in the current PTHR43394
      reference tree as an Embryophyta subtree; H6TB12 is not a reference leaf. Tree
      GO-slim retains peptide/mitochondrial terms there, but the latest IBD GAF places
      the narrow assertions on other branches and retains broad membrane/ABC functions
      along this path. PMID:23516968 and PMID:34998388 establish sophorolipid export
      genetically and full-length ABC architecture, not a direct negative mitochondrial-localization
      or oligopeptide assay. The earlier rejection inferred loss from predominant
      substrate/location. Leave each claim unresolved pending source-version/architecture
      adjudication.
