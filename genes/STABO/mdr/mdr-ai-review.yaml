- term:
    id: GO:0140377
    label: sophorolipid biosynthetic process
  evidence_type: IMP
  original_reference_id: PMID:23516968
  qualifier: involved_in
  review:
    summary: The transporter gene lies in the sophorolipid biosynthetic gene cluster,
      which the authors describe as five genes directly involved in sophorolipid synthesis.
      Its knockout reduces secreted sophorolipids to about 10% of wild type. The protein's
      own activity is export of the finished sophorolipids rather than a chemical step
      of their synthesis.
    action: KEEP_AS_NON_CORE
    reason: Experimental curator annotation consistent with the authors' framing of
      the cluster; not contradicted, so retained. The core role of Mdr is ATP-driven
      sophorolipid export (captured by ABC-type transporter activity and transmembrane
      transport), so the biosynthetic process is kept as non-core.
    supported_by:
    - reference_id: PMID:23516968
      supporting_text: we present the sophorolipid gene cluster consisting of five genes
        directly involved in sophorolipid synthesis
    - reference_id: PMID:23516968
      supporting_text: knocking out the transporter gene yields mutants still able to
        secrete sophorolipids, though only at levels of 10% as compared with the wild
        type, suggesting alternative routes for secretion
