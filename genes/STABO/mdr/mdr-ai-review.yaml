        source_label: PTN008681462
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: The focused report confirmed that all three mitochondrial/oligopeptide
          rows share this single TreeGrafter provenance. The transferred terms
          fit half-size Mdl1/ABCB10 exporters rather than full-length MDR-family
          sophorolipid exporters.
    supported_by:
    - reference_id: PMID:34998388
      supporting_text: Previous research demonstrated that the SbSLMdr.1, present in the SL biosynthetic
        gene cluster, is indeed largely responsible for export of SLs [10].
