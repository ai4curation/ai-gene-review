  title: OpenScientist focused report on mdr sophorolipid export and mitochondrial peptide capacity
  publication_type: DEEP_RESEARCH
  findings:
  - statement: The focused report found that the mitochondrial inner membrane, ABC-type
      oligopeptide transporter activity, and oligopeptide export from mitochondrion rows share one
      TreeGrafter source.
    supporting_text: All three disputed mitochondrial/oligopeptide terms carry the identical
      provenance
    reference_section_type: RESULTS
  - statement: The focused report found H6TB12 to be a full-length MDR exporter rather than a
      half-size mitochondrial peptide exporter.
    supporting_text: H6TB12 is a **full-length** ABCB transporter (1299 aa, 12 TM helices, 2 NBDs;
      UniProt subfamily "Multidrug resistance exporter, TC 3.A.1.201")
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Focused report read. Its QuickGO provenance and architecture checks support
      removing the three TreeGrafter mitochondrial/oligopeptide rows while retaining the
      sophorolipid-export and generic ABC transporter annotations.
suggested_questions:
- question: Can the PTHR43394 TreeGrafter graft for H6TB12 be constrained so Mdl1/ABCB10
    mitochondrial peptide-export terms do not propagate to full-length MDR exporters?
suggested_experiments:
- description: Localize tagged H6TB12 in Starmerella bombicola during sophorolipid-producing
    conditions to directly distinguish plasma-membrane export from mitochondrial inner-membrane
    targeting.
- description: Compare sophorolipid and oligopeptide transport in H6TB12-dependent efflux assays or
    reconstituted vesicles to test whether the full-length MDR exporter has any peptide-export
    capacity.
