- term:
    id: GO:0005886
    label: plasma membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  review:
    summary: The full-length ABC transporter supports sophorolipid export from the cell.
    action: ACCEPT
    reason: Primary deletion studies demonstrate a major reduction in extracellular sophorolipids;
      sequence architecture supports ATP-binding/hydrolytic coupling and transmembrane export.
      Plasma-membrane placement is the functional/topological inference for secretion, not a directly
      imaged exclusive localization. The second exporter provides partial redundancy, which does
      not negate this transporter function.
    supported_by:
    - reference_id: PMID:34998388
      supporting_text: Previous research demonstrated that the SbSLMdr.1, present in the SL biosynthetic
        gene cluster, is indeed largely responsible for export of SLs [10].
