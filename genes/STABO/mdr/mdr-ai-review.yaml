status: COMPLETE
taxon:
  id: NCBITaxon:75736
  label: Starmerella bombicola
description: Mdr (SbSLMdr.1) is an MDR-subfamily ABC transporter in the sophorolipid
  (SL) biosynthetic cluster that is largely responsible for SL export; transporter
  knockout reduces secretion to ~10% of wild type, indicating alternative routes but
  a major role for Mdr. The transportome analysis lists SbSLMdr.1 as a plasma membrane
  SL transporter. [PMID:34998388, PMID:23516968]
