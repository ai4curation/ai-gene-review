taxon:
  id: NCBITaxon:19
  label: Syntrophotalea carbinolica
description: AcoC is the lipoyl-bearing E2 acetyltransferase of the acetoin catabolic system
  in Syntrophotalea carbinolica (historically Pelobacter carbinolicus), strain Gra Bd 1. Its
  lipoyl arm accepts acetyl equivalents generated by AcoA/AcoB, and its acetyltransferase activity
  transfers acetyl to coenzyme A, producing acetyl-CoA and a reduced lipoyl arm for E3-dependent
  reoxidation. Purified native E2 participates in reconstitution with native E1 and E3; the
  protein has two predicted lipoyl-binding domains.
existing_annotations:
- term:
    id: GO:0006086
    label: pyruvate decarboxylation to acetyl-CoA
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR045257
  review:
    summary: Pyruvate-specific assignment overextends the characterized acetoin-system role.
    action: MARK_AS_OVER_ANNOTATED
    reason: GO:0006086 specifically converts pyruvate to acetyl-CoA, not acetoin to acetyl-CoA.
      The native protein is mapped to the acetoin system by purified-protein N termini and its
      aco locus. The shared dehydrogenase family supports related chemistry but overextends
      substrate or complex specificity here. This assessment does not assert that an unmeasured
      pyruvate side activity or secondary complex association is impossible. InterPro IPR045257
      is an E2/Pdx1 family assignment rather than evidence of a native pyruvate complex. Independently,
      full review PMID20508247 reports that the reconstituted Pelobacter complex does not use
      pyruvate or alpha-ketoglutarate, citing 1898934; that negative result is secondary here
      and does not establish the isolated E2 partner range.
    supported_by:
    - reference_id: PMID:8110297
      supporting_text: 'Use of oligonucleotide probes, which were deduced from the N-terminal
        sequences

        of the purified enzyme components, identified the structural genes for the alpha

        and beta subunits of E1 (acetoin:2,6-dichlorophenolindophenol oxidoreductase),

        E2 (dihydrolipoamide acetyltransferase), and E3 (dihydrolipoamide dehydrogenase)

        of the Pelobacter carbinolicus acetoin dehydrogenase enzyme system, which were

        designated acoA, acoB, acoC, and acoL, respectively.'
      reference_section_type: ABSTRACT
    - reference_id: PMID:1898934
      supporting_text: 'The combination of purified Ao:DCPIP OR, DHLTA, and

        DHLDH in the presence of thiamine pyrophosphate and the substrate acetoin or

        methylacetoin resulted in a coenzyme A-dependent reduction of NAD.'
      reference_section_type: ABSTRACT
    - reference_id: PMID:20508247
      supporting_text: Reconstituted AoDH containing the E1, E2, and E3 subunits from the bacterium
        Pelobacter carbinolicus is specific for acetoin and does not use pyruvate or α-ketoglutarate
        as substrate ( 162 ).
