suggested_questions:
- question: Is AcoL dedicated to acetoin breakdown or shared with native 2-oxoacid dehydrogenase
    complexes under other growth conditions?
suggested_experiments:
- description: Compare purified AcoL with native acetoin and 2-oxoacid E2 partners, measuring
    lipoyl reoxidation and NAD versus NADP turnover.
  experiment_type: native-component biochemical reconstitution
