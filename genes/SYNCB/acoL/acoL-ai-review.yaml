taxon:
  id: NCBITaxon:19
  label: Syntrophotalea carbinolica
description: AcoL is the FAD-dependent dihydrolipoyl dehydrogenase associated with the acetoin
  catabolic system in Syntrophotalea carbinolica (historically Pelobacter carbinolicus), strain
  Gra Bd 1. It reoxidizes the reduced protein-bound lipoyl cofactor while reducing NAD+, allowing
  repeated cycles of acetoin cleavage and acetyl-CoA production. Native AcoL was purified as
  a homodimer with NAD(H) specificity and contributes to reconstitution with the native E1 and
  E2 components.
