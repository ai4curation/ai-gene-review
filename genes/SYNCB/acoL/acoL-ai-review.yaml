  review:
    summary: Whether this acetoin-linked E3 also serves 2-oxoglutarate metabolism is unresolved.
    action: UNDECIDED
    reason: The reviewed native evidence assigns AcoL to acetoin turnover. A conserved E3 enzyme
      can in principle be shared among dehydrogenase systems, so acetoin association does not
      establish loss of 2-oxoglutarate-system function. The TreeGrafter PTN000530396 transfer
      does not resolve which native multienzyme partners this AcoL actually services. Retain
      uncertainty rather than infer absence from the accessible source or donor count. The 2010
      review reports that the complete acetoin complex rejects alpha-ketoglutarate, but this
      cannot establish that isolated AcoL never services another E2 partner.
