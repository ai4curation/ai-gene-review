  review:
    summary: Housekeeping-E3 2-oxoglutarate role transferred to the acetoin-system E3; likely
      over-annotation.
    action: MARK_AS_OVER_ANNOTATED
    reason: The TreeGrafter transfer from PTN000530396 carries a process established for
      housekeeping dihydrolipoamide dehydrogenases of the 2-oxoglutarate dehydrogenase complex.
      This AcoL was purified as the E3 of the acetoin dehydrogenase enzyme system and is encoded in
      the aco cluster; the reconstituted Pelobacter system is specific for acetoin and does not use
      alpha-ketoglutarate. No experiment places it in a 2-oxoglutarate dehydrogenase complex. Shared
      E3 chemistry leaves a minor role possible, so the row is marked over-annotated rather than
      removed. The same judgement is applied to the B. subtilis AcoL IBA row.
