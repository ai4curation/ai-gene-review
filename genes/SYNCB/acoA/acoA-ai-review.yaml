  label: Syntrophotalea carbinolica
description: AcoA is the alpha subunit of the thiamine-diphosphate-dependent acetoin-cleaving
  E1 enzyme in Syntrophotalea carbinolica (historically Pelobacter carbinolicus), strain Gra
  Bd 1. Together with the complementary E1 subunit it contributes to acetoin cleavage, releasing
  acetaldehyde and supplying an acetyl equivalent to the lipoyl-bearing E2 acetyltransferase.
  Native E1, E2 and E3 components reconstitute CoA-dependent NAD reduction with acetoin. E1
  also cleaves methylacetoin and diacetyl in the artificial DCPIP assay.
existing_annotations:
- term:
    id: GO:0004739
    label: pyruvate dehydrogenase (acetyl-transferring) activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN007511179
  review:
    summary: Pyruvate-specific assignment overextends the characterized acetoin-system role.
    action: MARK_AS_OVER_ANNOTATED
    reason: GO:0004739 specifically oxidatively decarboxylates pyruvate with release of CO2;
      acetoin cleavage releases acetaldehyde instead. The native protein is mapped to the acetoin
      system by purified-protein N termini and its aco locus. The shared dehydrogenase family
      supports related chemistry but overextends substrate or complex specificity here. This
      assessment does not assert that an unmeasured pyruvate side activity or secondary complex
      association is impossible. The original TreeGrafter node is preserved; it is not treated
      as a new pairwise experimental assay. Independently, full review PMID20508247 reports
      that the reconstituted Pelobacter complex does not use pyruvate or alpha-ketoglutarate,
      citing 1898934; that negative result is secondary here and does not establish the isolated
      E2 partner range.
    supported_by:
    - reference_id: PMID:8110297
      supporting_text: 'Use of oligonucleotide probes, which were deduced from the N-terminal
        sequences

        of the purified enzyme components, identified the structural genes for the alpha

        and beta subunits of E1 (acetoin:2,6-dichlorophenolindophenol oxidoreductase),

        E2 (dihydrolipoamide acetyltransferase), and E3 (dihydrolipoamide dehydrogenase)

        of the Pelobacter carbinolicus acetoin dehydrogenase enzyme system, which were

        designated acoA, acoB, acoC, and acoL, respectively.'
      reference_section_type: ABSTRACT
    - reference_id: PMID:1898934
      supporting_text: 'The combination of purified Ao:DCPIP OR, DHLTA, and

        DHLDH in the presence of thiamine pyrophosphate and the substrate acetoin or

        methylacetoin resulted in a coenzyme A-dependent reduction of NAD.'
      reference_section_type: ABSTRACT
    - reference_id: PMID:20508247
      supporting_text: Reconstituted AoDH containing the E1, E2, and E3 subunits from the bacterium
        Pelobacter carbinolicus is specific for acetoin and does not use pyruvate or α-ketoglutarate
        as substrate ( 162 ).
