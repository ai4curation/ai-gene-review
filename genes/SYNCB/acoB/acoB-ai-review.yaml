core_functions:
- description: Contribution of the AcoB beta subunit to the assembled acetoin-cleaving E1 activity.
    The physiological lipoyl-disulfide acceptor is inferred from the multicomponent system;
    DCPIP is an artificial assay acceptor, and the isolated subunit is not asserted to catalyze
    the complete reaction.
