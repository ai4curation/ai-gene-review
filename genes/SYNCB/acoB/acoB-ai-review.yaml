  review:
    summary: Propose the previously unrepresented beta-subunit contribution to E1 activity.
    action: NEW
    reason: The beta subunit is an identified structural component of active heteromeric E1,
      rather than a substrate consumed by the reaction. No existing molecular-function row covers
      this contribution. The proposed broad redox term avoids claiming that isolated AcoB catalyzes
      acetoin cleavage. Native protein purification and gene mapping, together with native reconstitution,
      support the inference.
