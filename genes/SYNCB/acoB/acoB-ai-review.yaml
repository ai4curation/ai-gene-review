- id: PMID:20508247
  title: Lipoic acid metabolism in microbial pathogens.
  findings:
  - statement: The review explains acetoin cleavage through a TPP intermediate and reductive
      acylation of the E2 lipoyl cofactor.
    supporting_text: This intermediate collapses, releasing acetaldehyde and leaving TPP with
      an activated hydroxyethyl group that is poised to acylate the lipoamide cofactor of the
      E2 subunit.
  - statement: The review reports that reconstituted Pelobacter AoDH does not accept pyruvate
      or alpha-ketoglutarate, citing 1898934. This is secondary evidence; it does not exclude
      isolated E3 sharing with other complexes.
    supporting_text: Reconstituted AoDH containing the E1, E2, and E3 subunits from the bacterium
      Pelobacter carbinolicus is specific for acetoin and does not use pyruvate or α-ketoglutarate
      as substrate ( 162 ).
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full review read for AoDH mechanism and substrate discrimination. Its Pelobacter
      specificity statement is secondary evidence because the cited 1991 primary remains abstract-only
      here; its generic E2 architecture is not used to erase the distinct H16/Pseudomonas alpha/beta-hydrolase
      fold.
suggested_questions:
- question: What is the quantitative substrate range of the native E1 complex, including any
    pyruvate side activity, under physiological lipoyl-acceptor conditions?
suggested_experiments:
- description: Reconstitute sequence-verified native AcoA/AcoB with lipoylated AcoC and the
    native E3; measure acetaldehyde, acetyl-CoA and NADH independently of DCPIP.
  experiment_type: native-component biochemical reconstitution
