  label: Syntrophotalea carbinolica
description: AcoB is the beta subunit of the thiamine-diphosphate-dependent acetoin-cleaving
  E1 enzyme in Syntrophotalea carbinolica (historically Pelobacter carbinolicus), strain Gra
  Bd 1. Together with the complementary E1 subunit it contributes to acetoin cleavage, releasing
  acetaldehyde and supplying an acetyl equivalent to the lipoyl-bearing E2 acetyltransferase.
  Native E1, E2 and E3 components reconstitute CoA-dependent NAD reduction with acetoin. E1
  also cleaves methylacetoin and diacetyl in the artificial DCPIP assay.
