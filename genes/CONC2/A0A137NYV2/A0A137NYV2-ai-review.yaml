    action: ACCEPT
    reason: All three catalytic-triad signatures are present (SUBTILASE_ASP, _HIS
      and _SER), together with RuleBase peptidase S8 family membership. Proteinase
      K-like S8A enzymes are endopeptidases. The protein is uncharacterised, so this
