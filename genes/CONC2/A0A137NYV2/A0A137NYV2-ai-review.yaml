  label: Conidiobolus coronatus NRRL 28638
description: CONCODRAFT_9893 encodes a predicted subtilisin-like serine protease of
  the entomophthoralean fungus Conidiobolus coronatus, a saprobe and opportunistic
  pathogen of insects and mammals. It belongs to peptidase family S8, subfamily S8A,
  in the proteinase K-like group, and is one of several dozen S8 paralogs in the
  genome. The 352-residue precursor has a predicted N-terminal signal peptide, a
  region in the usual propeptide position, and an S8 catalytic domain that carries
  all three residues of the Asp-His-Ser charge-relay triad within canonical
  active-site motifs. By family membership it is inferred to be a serine
  endopeptidase. The protein has not been purified or assayed. Whether it is
  secreted or targeted to the vacuole, its pH optimum, and its relation to the
  characterised extracellular alkaline and subtilisin-like proteases of C.
  coronatus are all unknown.
