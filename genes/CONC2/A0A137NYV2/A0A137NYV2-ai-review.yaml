suggested_questions:
- question: Is CONCODRAFT_9893 secreted, as its predicted signal peptide allows, or
    targeted to the vacuole like the proteinase K-like yeast proteinase B?
- question: Does any of the purified C. coronatus extracellular proteases (the NCL
    alkaline protease, or the 30-32 kDa subtilisin-like proteinase) correspond to
    CONCODRAFT_9893, as could be tested by peptide mass fingerprinting against the
    NRRL 28638 proteome?
suggested_experiments:
- description: Secretome proteomics of C. coronatus grown on protein-rich medium
    (for example soybean meal or gelatin), with LC-MS/MS matched to the UP000070444
    proteome, to establish which of the roughly 36 S8 paralogs, if any including CONCODRAFT_9893,
    are secreted and abundant. Follow with heterologous expression and pH-activity
    profiling of the dominant ones.
