- id: PMID:30111619
  title: Early Diverging Insect-Pathogenic Fungi of the Order Entomophthorales Possess
    Diverse and Unique Subtilisin-Like Serine Proteases.
  findings:
  - statement: The C. coronatus genome encodes a large family of subtilisin-like
      serine proteases (36 SLSPs by this survey), all with S8A-type active-site motifs.
    supporting_text: C. coronatus (n = 36)
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified, full text cached. It sets the paralog context and
      the S8A motif criteria. It does not name individual C. coronatus gene models.
- id: PMID:16933280
  title: Specificity of an extracellular proteinase from Conidiobolus coronatus and
    its inhibition by an inhibitor from insect hemolymph.
  findings:
  - statement: C. coronatus secretes several proteinases. A purified 30-32 kDa extracellular
      enzyme is subtilisin-like, with a preference for aromatic and hydrophobic residues
      at P1.
    supporting_text: secretes several proteinases into culture broth
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed-verified abstract. It concerns a purified protein with no
      sequence, so it cannot be mapped to CONCODRAFT_9893 or any other gene model.
- id: PMID:9082920
  title: A serine alkaline protease from the fungus Conidiobolus coronatus with a
    distinctly different structure than the serine protease subtilisin Carlsberg.
  findings:
  - statement: The NCL C. coronatus alkaline serine protease resembles subtilisin
      Carlsberg functionally but differs from it structurally (composition, immunology,
      peptide maps). No sequence was reported.
    supporting_text: Our results demonstrate that although they are functionally analogous,
      the Conidiobolus protease is structurally distinct from subtilisin Carlsberg.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed-verified abstract. Dissimilarity from a bacterial subtilisin
      is compatible with a fungal proteinase K-like S8 enzyme, so it does not argue
      against the S8 assignment. It does not identify which gene encodes the enzyme.
- id: PMID:1572367
  title: Evidence for controlled autoproteolysis of alkaline protease. A mechanism
    for physiological regulation of conidial discharge in Conidiobolus coronatus.
  findings:
  - statement: The C. coronatus alkaline serine protease occurs as two related forms,
      the smaller arising by PMSF-sensitive autoproteolysis.
    supporting_text: Purified protease I showed partial degradation to protease II
      in vitro, the process being sensitive to phenylmethylsulfonyl fluoride, indicating
      its proteolytic nature.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: PubMed-verified abstract. Physiology of an unsequenced C. coronatus
      alkaline protease; background only.
