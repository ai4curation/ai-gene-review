      supporting_text: All three are
        conserved in the L. lactis protein, consistent with a functional SufB scaffold
        subunit rather than a degenerate paralog.
- term:
    id: GO:0051536
    label: iron-sulfur cluster binding
  evidence_type: ISS
  original_reference_id: PMID:28839209
  qualifier: enables
  review:
    summary: >-
      Proposed. SufB binds the nascent cluster it scaffolds; the E. coli cluster
      ligands at the SufB-SufD interface (Cys405, Glu434) are conserved here as
      Cys380 and Glu409.
    action: NEW
    reason: >-
      GO has no scaffold-specific MF for Fe-S assembly proteins, and
      iron-sulfur cluster binding is the standard function term for scaffolds
      (it was also the call made by the KBase annotation pipeline). The term is
      kept at the generic level because the cluster type assembled on the
      SufBC2D complex is not resolved for the Firmicute protein. Evidence is
      transferred from E. coli SufB (39.9% identity over 466 aligned residues,
      all key residues conserved).
    supported_by:
    - reference_id: PMID:17350958
      supporting_text: Furthermore, SufB can act as a site for Fe-S cluster assembly
        in the Suf system.
    - reference_id: PMID:28839209
      supporting_text: Another functional region resides at an interface
        between SufB and SufD, where three residues (SufBC405, SufBE434, and SufDH360)
        appear to comprise the site for de novo cluster formation.
    - reference_id: file:LACLM/sufB/sufB-bioinformatics/RESULTS.md
      supporting_text: E. coli C405 -> query C380
- term:
    id: GO:1990229
    label: iron-sulfur cluster assembly complex
  evidence_type: ISS
  original_reference_id: PMID:26472926
  qualifier: part_of
  review:
    summary: >-
      Proposed. SufB is the scaffold subunit of the SufBC2D complex; the partner
      subunits SufC (llmg_1974) and SufD (llmg_1973) are encoded in the same
      operon.
    action: NEW
    reason: >-
      The SufBC2D complex is structurally and biochemically defined for the E.
      coli orthologs, and both partner genes are present in the L. lactis
      sufCDSUB operon. GO has no SUF-specific complex term, so the generic
      iron-sulfur cluster assembly complex is the most precise available.
    supported_by:
    - reference_id: PMID:26472926
      supporting_text: two ABC ATPase components (SufC) with
        function-specific components (SufB-SufD protomers)
    - reference_id: file:LACLM/sufB/sufB-bioinformatics/RESULTS.md
      supporting_text: This is the Firmicute-type sufCDSUB operon
references:
- id: GO_REF:0000002
  title: Gene Ontology annotation through association of InterPro records with GO
    terms
  findings: []
- id: PMID:17350958
  title: SufE transfers sulfur from SufS to SufB for iron-sulfur cluster assembly.
  findings:
  - statement: In E. coli, SufE transfers SufS-derived sulfur to SufB (requiring
      SufC), and SufB acts as a site for Fe-S cluster assembly.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only cache; ortholog (E. coli) evidence for the scaffold role.
- id: PMID:26472926
  title: Functional Dynamics Revealed by the Structure of the SufBCD Complex, a Novel
    ATP-binding Cassette (ABC) Protein That Serves as a Scaffold for Iron-Sulfur Cluster
    Biogenesis.
  findings:
  - statement: Crystal structure of E. coli SufBCD shows an ABC-protein
      architecture with two SufC ATPases and a SufB-SufD heterodimer; ATPase
      driven conformational change is proposed to drive cluster assembly.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only cache; structural basis of the SufBC2D complex.
- id: PMID:28839209
  title: Mapping the key residues of SufB and SufD essential for biosynthesis of iron-sulfur
    clusters.
  findings:
  - statement: E. coli SufB Cys254 is essential for sulfur transfer from SufE;
      SufB Cys405 and Glu434 with SufD His360 form the de novo cluster site.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text; residues used for the conservation check in sufB-bioinformatics.
- id: PMID:24321018
  title: 'Fe-S cluster biogenesis in Gram-positive bacteria: SufU is a zinc-dependent
    sulfur transfer protein.'
  findings:
  - statement: In Firmicutes the SUF system uses SufU rather than SufE as the
      sulfur acceptor of SufS, with SufB, SufC and SufD as candidate scaffold
      components.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Explains why the L. lactis operon encodes SufU (llmg_1970) and no SufE.
- id: PMID:20097860
  title: SufU is an essential iron-sulfur cluster scaffold protein in Bacillus subtilis.
  findings: []
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Background on Firmicute SUF; its SufU-as-scaffold model was revised
      by PMID:24321018 toward SufU as a sulfur-transfer protein.
- id: PMID:24009606
  title: Interaction between the genomes of Lactococcus lactis and phages of the P335
    species
  findings:
  - statement: Uses llmg_1969 (sufB) only as a landmark of a prophage integration
