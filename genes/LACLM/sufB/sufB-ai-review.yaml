- id: PMID:24936909
  title: 'Oxidative stress enhances the expression of sulfur assimilation genes: preliminary
    insights on the Enterococcus faecalis iron-sulfur cluster machinery regulation'
  findings:
  - statement: The E. faecalis sufCDSUB operon (sufB ortholog EF2390, 78.7%
      identity) is induced by H2O2.
  reference_review:
    relevance: LOW
