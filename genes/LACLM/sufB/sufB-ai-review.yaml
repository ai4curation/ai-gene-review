- term:
    id: GO:0051536
    label: iron-sulfur cluster binding
  evidence_type: ISS
  original_reference_id: PMID:28839209
  qualifier: enables
  supporting_entities:
  - UniProtKB:P77522
  review:
    summary: >-
      Proposed. SufB binds the nascent cluster it scaffolds; the E. coli cluster
      ligands at the SufB-SufD interface (Cys405, Glu434) are conserved here as
      Cys380 and Glu409.
    action: NEW
    reason: >-
      GO has no scaffold-specific MF for Fe-S assembly proteins, so the
      cluster-binding term carries the scaffold's function. Evidence is
      transferred from E. coli SufB (P77522; 39.9% identity over 466 aligned
      residues, all key residues conserved). Comparator check (QuickGO,
      2026-10-30): P77522 carries both GO:0051539 [4Fe-4S] cluster binding (IDA,
      PMID:17350958) and GO:0051537 [2Fe-2S] cluster binding (IDA,
      PMID:25485887); B. subtilis SufB (O32162) has no MF annotation. The parent
      term is used rather than either child because the donor's cluster species
      is not settled: a [4Fe-4S] cluster was reconstituted on SufBCD in vitro,
      but the anaerobically isolated complex carries a cluster that is
      spectroscopically distinct from it, and SufB also binds a [2Fe-2S]
      cluster (PMID:28839209, PMID:25485887).
    supported_by:
    - reference_id: PMID:17350958
      supporting_text: Furthermore, SufB can act as a site for Fe-S cluster assembly
        in the Suf system.
    - reference_id: PMID:28839209
      supporting_text: Another functional region resides at an interface
        between SufB and SufD, where three residues (SufBC405, SufBE434, and SufDH360)
        appear to comprise the site for de novo cluster formation.
    - reference_id: PMID:28839209
      supporting_text: However, anaerobically isolated SufBCD complex from E. coli was demonstrated to possess Fe-S cluster with distinct spectroscopic features from that of [4Fe-4S] cluster reconstituted in vitro.
    - reference_id: PMID:25485887
      supporting_text: We show that the IscU Fe2S2 cluster is less stable than the SufB
        Fe2S2 cluster in the presence of hydrogen peroxide, oxygen, and an iron
        chelator.
    - reference_id: file:LACLM/sufB/sufB-bioinformatics/RESULTS.md
      supporting_text: E. coli C405 -> query C380
- term:
