  review:
    summary: >-
      Proposed. SufB is the scaffold subunit of the SufBC2D complex; the partner
      subunits SufC (llmg_1974) and SufD (llmg_1973) are encoded in the same
      operon.
    action: NEW
    reason: >-
      The SufBC2D complex is structurally and biochemically defined for the E.
      coli orthologs, and both partner genes are present in the L. lactis
      sufCDSUB operon. GO has no SUF-specific complex term, so the generic
      iron-sulfur cluster assembly complex is the most precise available.
      Comparator check (QuickGO, 2026-10-30): E. coli SufB carries this term by
      IDA and IPI, and the PANTHER IBA for it has also propagated to B. subtilis
      SufB (O32162).
    supported_by:
