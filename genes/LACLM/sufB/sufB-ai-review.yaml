  review:
    summary: >-
      Correct core process. A2RMK5 carries the full-length SufB-specific family
      signature and the SufBD core domain, keeps the residues that are essential
      for sulfur acceptance and cluster formation in E. coli SufB, and sits in a
      sufCDSUB operon.
    action: ACCEPT
    reason: >-
      SufB is the scaffold on which SUF Fe-S clusters are assembled
      (PMID:17350958, PMID:28839209). The InterPro mapping is specific to the
      SufB/SufBD family, the query matches TIGR01980 over 95% of its length,
      and the catalytic residues are conserved (sufB-bioinformatics/RESULTS.md),
      so the process is as specific as GO allows and is the core role.
    supported_by:
