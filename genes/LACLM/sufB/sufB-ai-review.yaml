      supporting_text: two ABC ATPase components (SufC) with
        function-specific components (SufB-SufD protomers)
    - reference_id: file:LACLM/sufB/sufB-bioinformatics/RESULTS.md
      supporting_text: This is the Firmicute-type sufCDSUB operon
