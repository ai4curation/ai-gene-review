core_functions:
- description: >-
    Scaffold subunit of the cytoplasmic SufBC2D complex that accepts
    persulfide sulfur (via SufS/SufU) and assembles nascent Fe-S clusters at the
    SufB-SufD interface for transfer to client apoproteins.
  molecular_function:
    id: GO:0051536
    label: iron-sulfur cluster binding
  directly_involved_in:
  - id: GO:0016226
    label: iron-sulfur cluster assembly
  in_complex:
    id: GO:1990229
    label: iron-sulfur cluster assembly complex
  supported_by:
  - reference_id: PMID:28839209
    supporting_text: SufB forms a stable complex with SufC and SufD with a 1:2:1 stoichiometry, and acts as a scaffold for the de novo Fe-S cluster.
  - reference_id: file:LACLM/sufB/sufB-bioinformatics/RESULTS.md
    supporting_text: All three are
      conserved in the L. lactis protein, consistent with a functional SufB scaffold
      subunit rather than a degenerate paralog.
suggested_questions:
- question: Does L. lactis SufU transfer sulfur directly to SufB Cys236 within a
    SufBC2D complex, as SufE does to E. coli SufB Cys254?
- question: Is sufB essential in L. lactis, as expected if SUF is its only Fe-S
    assembly system?
suggested_experiments:
- description: Purify L. lactis SufBC2D (with and without SufB C236A or C380A) and
    test SufS/SufU-dependent persulfide transfer and anaerobic cluster
    reconstitution by UV-visible and Mossbauer spectroscopy.
  experiment_type: in vitro reconstitution
- description: Attempt a clean sufB deletion or CRISPRi knockdown in MG1363 and
    measure activities of Fe-S enzymes under aerobic and H2O2 stress.
  experiment_type: genetic essentiality and phenotype
