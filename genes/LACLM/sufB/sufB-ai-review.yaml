suggested_questions:
- question: Does L. lactis SufU transfer sulfur directly to SufB Cys236 within a
    SufBC2D complex, as SufE does to E. coli SufB Cys254?
- question: Is sufB essential in L. lactis, as expected if SUF is its only Fe-S
    assembly system?
suggested_experiments:
- description: Purify L. lactis SufBC2D (with and without SufB C236A or C380A) and
    test SufS/SufU-dependent persulfide transfer and anaerobic cluster
    reconstitution by UV-visible and Mossbauer spectroscopy.
  experiment_type: in vitro reconstitution
- description: Attempt a clean sufB deletion or CRISPRi knockdown in MG1363 and
    measure activities of Fe-S enzymes under aerobic and H2O2 stress.
  experiment_type: genetic essentiality and phenotype
