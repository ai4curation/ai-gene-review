id: A2RMK5
gene_symbol: sufB
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:416870
  label: Lactococcus cremoris subsp. cremoris MG1363
aliases: [llmg_1969, NZ_LKLC01000161.1_58]
description: >-
  SufB is the core scaffold subunit of the SUF iron-sulfur cluster biogenesis
  machinery of Lactococcus lactis. It is a 470-residue soluble cytoplasmic
  protein with the SufBD N-terminal and beta-helix core domains and the full
  SufB-specific (TIGR01980) family signature. By orthology with Escherichia coli
  SufB, it forms a SufBC2D complex with the SufC ABC-type ATPase and SufD, on
  which nascent Fe-S clusters are assembled: sulfur delivered by the cysteine
  desulfurase system is accepted at a conserved SufB cysteine (Cys236 here,
  equivalent to E. coli Cys254) and the cluster is built at the SufB-SufD
  interface, where the E. coli ligand residues Cys405 and Glu434 are conserved
  as Cys380 and Glu409. The gene lies in a Firmicute-type sufCDSUB operon
  (llmg_1974-llmg_1969), in which SufU rather than SufE carries persulfide from
  SufS. Because the SUF system is the only housekeeping Fe-S assembly pathway in
  such Firmicutes, SufB is expected to be essential for maturation of all
  cellular Fe-S proteins; no L. lactis protein has yet been characterised
  experimentally.
