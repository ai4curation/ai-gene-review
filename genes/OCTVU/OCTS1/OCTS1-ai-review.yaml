suggested_questions:
- question: >-
    Does OCTS1 specifically form homodimers like canonical GSTs, or does it heterodimerize with
    other S-crystallin family members in the lens? The crystal structure shows a GST-like dimer
    via crystallographic symmetry, but the in vivo oligomeric state in the lens has not been
    determined.
  experts:
  - Chi-Yuan Chou
  - Wei-Hung Tan
- question: >-
    What is the in vivo GSH occupancy of OCTS1 in the octopus lens? Given the high GSH
    concentration in lenses (2-10 mM) and the tight binding, is OCTS1 constitutively GSH-bound
    under physiological conditions?
  experts:
  - Chi-Yuan Chou
- question: >-
    Are there S-crystallin family members in O. vulgaris that retain significant GST activity
    (analogous to the short-loop SL11/Lops4 in squid), and if so, could they serve a dual
    antioxidant/structural role in the lens?
  experts:
  - Joram Piatigorsky
  - Shyh-Horng Chiou

suggested_experiments:
- hypothesis: >-
    Different S-crystallin isoforms are spatially segregated in the octopus lens to create the
    graded refractive index
  description: >-
    Mass spectrometry of octopus lens extracts from concentric layers to determine the relative
    abundance of different S-crystallin isoforms and their spatial distribution (cortex vs.
    nucleus) to map the protein-density gradient underlying the refractive index.
  experiment_type: mass spectrometry proteomics
- hypothesis: >-
    OCTS1 binds GSH with high affinity under physiological conditions
  description: >-
    Isothermal titration calorimetry (ITC) of OCTS1 with GSH to precisely measure binding
    affinity (Kd) and stoichiometry under physiological conditions, complementing the
    Km-based estimates from kinetic assays.
  experiment_type: biophysical binding assay
- hypothesis: >-
    The four key active-site mutations identified in OctS4 also restore GST activity in OCTS1
  description: >-
    Mutagenesis of the four key residues (L100F/D101N/M104V/Q108F) in OCTS1 specifically to
    test whether the activity restoration seen in the related OctS4 crystallin also applies to
    this isoform, and whether the stability/activity tradeoff is conserved across S-crystallin
    paralogs.
  experiment_type: site-directed mutagenesis and enzyme kinetics
