id: P27013
gene_symbol: OCTS1
product_type: PROTEIN
status: IN_PROGRESS
taxon:
  id: NCBITaxon:6645
  label: Octopus vulgaris
description: S-crystallin 1 (OCTS1) is a major structural protein of the Octopus vulgaris eye lens, derived
  from the glutathione S-transferase family. It retains the GST fold and an inserted loop characteristic
  of long-loop S-crystallins, while reported GST activity is much lower than that of authentic detoxifying
  GST enzymes. Related octopus S-crystallins bind glutathione in a way that improves stability and reduces
  aggregation; detailed kinetic and structural experiments on OctS4 support this mechanism by homology.
  S-crystallins contribute the refractive material of the cephalopod lens, and their distribution and
  assembly help establish the optical properties required to focus light.

existing_annotations:
- term:
    id: GO:0004364
    label: glutathione transferase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  review:
    summary: OCTS1 is an S-crystallin lens protein with very low reported GST activity. Recombinant octopus
      S-crystallin and native lens preparations support strongly reduced catalysis relative to authentic
      GST. The detailed 2016 kinetic and mutagenesis study concerns the related OctS4 protein, with a Q108F
      mutant used for crystallography, and should not be described as an assay or structure of OCTS1 itself.
    action: MARK_AS_OVER_ANNOTATED
    reason: Retain MARK_AS_OVER_ANNOTATED for propagation of an ancestral detoxifying GST function to a
      structural lens protein. Residual in-vitro catalysis is real and is not erased by this decision; its
      physiological importance for OCTS1 has not been demonstrated. The OctS4 study supports the family
      mechanism of enhanced GSH stabilization and reduced electrophilic-substrate catalysis, while the exact
      OCTS1-specific kinetic magnitude and residue effects remain inferred. Existing adjudications agree
      on structural co-option, but their categorical absence-of-function and essential-tryptophan language
      exceeds what is needed for this judgment.
    additional_reference_ids:
    - PMID:8587103
    - PMID:1373730
    supported_by:
    - reference_id: PMID:7639695
      supporting_text: We found that the expressed octopus S-crystallin possessed much lower GST activity
        than the authentic GSTs from other tissues.
    - reference_id: PMID:27499004
      supporting_text: The GST catalytic activity (kcat) of the wild-type S-crystallin is 0.24 s−1, which
        is about the same to that of the S-crystallins purified from octopus lens18 but only ~1/700, of
        that of GST-σ (it will be ~1/6000 if compared their catalytic efficiency by kcat/Km,CDNB) (Table
        1).
    - reference_id: PMID:8587103
      supporting_text: SL20-1 of O. pacificus and Lops12 of L. opalescens (which are encoded by abundant
        lens mRNAs) have no GST activity. [...] GST activity was lost by gradual drift in sequence as well
        as by insertion of an extra peptide by exon shuffling.
    - reference_id: file:OCTVU/OCTS1/OCTS1-hypotheses/function-hypothesis-go-0004364/openscientist.md
      supporting_text: 'Verdict: REFUTED - Pseudo-enzyme / activity lost (Failure Mode #2)'
    - reference_id: file:OCTVU/OCTS1/OCTS1-hypotheses/function-hypothesis-go-0004364/openscientist.md
      supporting_text: InterPro domain architecture analysis separately classifies OCTS1 in the S-crystallin
        family (IPR003083)
    - reference_id: file:OCTVU/OCTS1/OCTS1-hypotheses/function-hypothesis-go-0004364/falcon.md
      supporting_text: While it retains the canonical GST fold and strong glutathione (GSH) binding, its
        catalytic efficiency toward electrophilic substrates is reduced approximately **700-fold in kcat**
        and **~6,000-fold in catalytic efficiency (kcat/Km,CDNB)** relative to the authentic octopus GST-σ
        enzyme

- term:
    id: GO:0006749
    label: glutathione metabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  review:
    summary: Glutathione binding stabilizes related octopus S-crystallins, while GST catalysis is strongly
      reduced. Binding alone does not establish participation in glutathione metabolism. The detailed 2016
      stabilization measurements concern OctS4 and are homolog evidence for OCTS1.
    action: MARK_AS_OVER_ANNOTATED
    reason: 'Retain the challenge to a physiological glutathione-metabolism assignment: the evidence supports
      a structural lens role and conserved GSH interaction, but does not establish appreciable OCTS1-specific
      glutathione turnover in vivo. The reported residual catalysis and homolog experiments are acknowledged
      rather than treated as absence of all chemistry.'
    supported_by:
    - reference_id: PMID:27499004
      supporting_text: In the presence of GSH, the melting temperature (Tm) of S-crystallin was higher by
        7 °C than that of the protein in the absence of GSH
    - reference_id: PMID:27499004
      supporting_text: If we considered the situation of S-crystallin in the lens, it is important for this
        protein to capture GSH for as long as possible and to minimize its catalytic activity, otherwise
        the GSH will be released as a product conjugate.

- term:
    id: GO:0005212
    label: structural constituent of eye lens
  evidence_type: TAS
  original_reference_id: PMID:7639695
  review:
    summary: >-
      GO:0005212 (structural constituent of eye lens) is the core molecular function of OCTS1.
      S-crystallins are the dominant structural proteins of cephalopod eye lenses, analogous to
      alpha/beta/gamma crystallins in vertebrate lenses. Lin and Chiou 1992 (PMID:1627174)
      cloned OCTS1 from octopus lens tissue. The UniProt entry states: "S-crystallins are
      structural components of squids and octopi eye lens." Sweeney et al. 2007 (PMID:17293312)
      showed that S-crystallins are "differentially expressed in a radial gradient, suggesting
      a role in refractive index" and that they form the graded refractive index structure
      essential for vision in cephalopod camera-type eyes. This annotation is present in UniProt
      via keyword mapping (GO_REF:0000043) but absent from the QuickGO/GOA export; it should
      be added as a curated annotation.
    action: NEW
    reason: >-
      This is the primary molecular function of OCTS1. The protein has been co-opted from an
      ancestral GST enzyme to serve as a structural/refractive lens protein. Multiple studies
      confirm lens-specific expression and structural role. Although present in UniProt via
      keyword mapping, it is not in the GOA export and should be formally annotated. This is
      the most important annotation for this protein.
    supported_by:
    - reference_id: PMID:1627174
      supporting_text: >-
        S-crystallin is a major lens protein present in the octopus and squid of Cephalopods.
    - reference_id: PMID:7639695
      supporting_text: >-
        S-Crystallin is a major protein present in the lenses of cephalopods (octopus and squid).
    - reference_id: PMID:17293312
      supporting_text: >-
        S-crystallins are differentially expressed in a radial gradient, suggesting a role in
        refractive index.

- term:
    id: GO:0043295
    label: glutathione binding
  evidence_type: ISS
  original_reference_id: PMID:27499004
  review:
    summary: Glutathione binding is proposed by similarity to the experimentally characterized octopus S-crystallin
      OctS4. PMID:27499004 measures OctS4 and solves its engineered Q108F mutant, not OCTS1; the GSH-binding
      and stabilization mechanism is therefore homolog-based evidence for this target.
    action: NEW
    reason: Retain the conservative GSH-binding proposal as an inferred conserved property of closely related
      S-crystallins. The 43-fold Km difference is an apparent kinetic parameter from OctS4, not a directly
      measured OCTS1 binding dissociation constant. A target-specific assay is still needed to establish
      OCTS1 affinity and stabilization quantitatively.
    supported_by:
    - reference_id: PMID:27499004
      supporting_text: The apparent binding affinity of GSH with S-crystallin is significantly tighter than
        that with GST-sigma, with a 43-fold decrease in Km.
    - reference_id: PMID:27499004
      supporting_text: we observed the presence of a GSH molecule within the active site of S-crystallin,
        located between the N-domain (βA to α3) and C-domain (α4 to α10) of the protein (Fig. 1b). There
        is a disulfide-bond between the thiol group of the GSH and residue Cys112 of S-crystallin.
    - reference_id: PMID:27499004
      supporting_text: S-crystallin is stabilized by glutathione binding to prevent its aggregation; this
        contrasts with GST-sigma, which do not possess this protection
    - reference_id: PMID:9929473
      supporting_text: The active center region of S-crystallin is even more shielded and buried after dimerization,
        which may explain for the failure of S-crystallin to bind to the immobilized-glutathione in affinity
        chromatography.
    - reference_id: PMID:27499004
      supporting_text: Only one of them, named OctS4, could be expressed and purified to homogeneity.

- term:
    id: GO:0007601
    label: visual perception
  evidence_type: NAS
  original_reference_id: PMID:17293312
  review:
    summary: As the dominant structural protein of the cephalopod eye lens, S-crystallin 1 plays an essential
      role in visual perception by contributing to the graded refractive index that focuses light onto the
      retina. Sweeney et al. 2007 (PMID:17293312) demonstrated that "a lens with a graded refractive index
      is required for vision in aquatic animals with camera-type eyes" and that S-crystallins create this
      gradient through differential expression at different radial positions.
    action: NEW
    reason: S-crystallins supply the refractive structure that focuses incoming light, which is direct structural
      participation in visual perception. A QuickGO comparator query on 2026-09-20 found the same process
      annotation on the lens structural proteins CRYAA (experimental) and CRYBA1 (IBA/NAS), supporting this
      use of the term. The squid radial-gradient evidence is homolog-level support for the octopus lens
      protein, not an OCTS1-specific perturbation assay.
    supported_by:
    - reference_id: PMID:17293312
      supporting_text: A lens with a graded refractive index is required for vision in aquatic animals with
        camera-type eyes. This optical design entails a radial gradient of protein density.

references:
- id: PMID:1627174
  title: Facile cloning and sequencing of S-crystallin genes from octopus lenses based on polymerase chain
    reaction.
  findings:
  - statement: Cloned OCTS1 cDNA from octopus lens poly(A)+RNA using PCR
    supporting_text: S-crystallin is a major lens protein present in the octopus and squid of Cephalopods.
      To facilitate the cloning of the protein, cDNA was constructed from the poly(A)+RNA of octopus lenses,
      and amplification by polymerase chain reaction (PCR) was carried out.
  - statement: S-crystallins exist as a multigene family with 37-44% nucleotide similarity and 23-30%
      amino acid similarity to mammalian GSTs
    supporting_text: Sequencing two of 15 positive clones obtained shows 37-44% similarity in nucleotide
      and 23-30% similarity in amino acid sequences as compared with mammalian glutathione S-transferases
      (GST), revealing that S-crystallins exist as a multigene family and probably derived from GST by
      gene duplication and subsequent mutational base replacements.
- id: PMID:7639695
  title: 'Octopus S-crystallins with endogenous glutathione S-transferase (GST) activity: sequence comparison
    and evolutionary relationships with authentic GST enzymes.'
  findings:
  - statement: Three distinct S-crystallin isoforms identified with 61-64% nucleotide identity
    supporting_text: Sequencing of 10 of 15 positive clones coding for this crystallin revealed three
      distinct S-crystallin isoforms with 61-64% identity in nucleotide sequences and 42-58% similarity
      in amino acid sequences when compared with homologous crystallins in squid lenses.
  - statement: Recombinant octopus S-crystallin has much lower GST activity than authentic GSTs
    supporting_text: We found that the expressed octopus S-crystallin possessed much lower GST activity
      than the authentic GSTs from other tissues.
  - statement: S-crystallins are structurally related to Alpha-class GSTs and derived from ancestral GST
    supporting_text: Sequence comparison and construction of phylogenetic trees for S-crystallins from
      squid and octopus lenses and various classes of GSTs revealed that S-crystallins represent a multigene
      family which is structurally related to Alpha-class GSTs and probably derived from the ancestral
      GST by gene duplication and subsequent multiple mutational substitutions.
- id: PMID:8587103
  title: 'Glutathione S-transferase and S-crystallins of cephalopods: evolution from active enzyme to
    lens-refractive proteins.'
  findings:
  - statement: At least 24 different S-crystallins in squid Loligo opalescens, 46-99% identical
    supporting_text: Here we show by cDNA cloning that there are at least 24 different S-crystallins that
      are 46-99% identical to each other by amino acid sequence in the squid Loligo opalescens.
  - statement: Long-loop S-crystallins have no GST activity; short-loop retain some
    supporting_text: Squid GST (which is expressed little in the lens) has very high enzymatic activity
      using 1-chloro-2,4-dinitrobenzene (CDNB) as a substrate; by contrast, SL20-1 of O. pacificus and
      Lops12 of L. opalescens (which are encoded by abundant lens mRNAs) have no GST activity. Interestingly,
      SL11 and Lops4 have some enzymatic activity with the CDNB substrate.
  - statement: GST activity lost by gradual sequence drift plus insertion of central peptide by exon shuffling
    supporting_text: "These \ndata indicate that the S-crystallins consist of a family of enzymatically\
      \ \ninactive proteins (when using CDNB as a substrate) which is considerably larger \nthan previously\
      \ believed and that GST activity was lost by gradual drift in \nsequence as well as by insertion\
      \ of an extra peptide by exon shuffling."
- id: PMID:27499004
  title: 'Structure of a Highly Active Cephalopod S-crystallin Mutant: New Molecular Evidence for Evolution
    from an Active Enzyme into Lens-Refractive Protein.'
  findings:
  - statement: OctS4 Q108F mutant structure in complex with GSH at 2.35 angstrom resolution; homolog evidence
      for OCTS1
    supporting_text: We determined the crystal structure of the S-crystallin Q108F mutant at 2.35 Å resolution
  - statement: Wild-type OctS4 has markedly lower GST kcat and catalytic efficiency than authentic octopus
      GST-sigma
    supporting_text: The GST catalytic activity (kcat) of the wild-type S-crystallin is 0.24 s−1, which
      is about the same to that of the S-crystallins purified from octopus lens18 but only ~1/700, of
      that of GST-σ (it will be ~1/6000 if compared their catalytic efficiency by kcat/Km,CDNB) (Table
      1).
  - statement: OctS4 has a 43-fold lower apparent Km for GSH than GST-sigma; this is not a directly measured
      binding Kd
    supporting_text: the apparent binding affinity of GSH with S-crystallin is significantly tighter than
      that with GST-σ, with a 43-fold decrease in Km,GSH.
  - statement: GSH increases OctS4 thermal stability; homolog evidence for a stabilization mechanism
    supporting_text: In the presence of GSH, the melting temperature (Tm) of S-crystallin was higher by
      7 °C than that of the protein in the absence of GSH
  - statement: The OctS4 quadruple mutant shows a 518-fold increase in catalytic efficiency toward CDNB
    supporting_text: Furthermore, the quadruple mutant of S-crystallin, L100F/D101N/M104V/Q108F, had the
      lowest Km,CDNB (0.18 mM) and the highest Km,GSH. Although there was only a 23-fold increase in activity
      for some unknown reason, the catalytic efficiency (kcat/Km,CDNB) has a 518-fold increase (Table
      1).
  - statement: Tradeoff between enzyme activity and protein stability via GSH binding drove evolution
    supporting_text: a tradeoff between enzyme activity and the stability of the lens protein might have
      been one of the major driving force behind lens evolution
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cached full text explicitly identifies OctS4 as the expressed protein and Q108F as the
      crystallized mutant. Strong homolog-level mechanism evidence for OCTS1; direct attribution of OctS4
      kinetic values or structure to OCTS1 would be miscitation.
- id: PMID:1373730
  title: Characterization of squid crystallin genes. Comparison with mammalian glutathione S-transferase
    genes.
  findings:
  - statement: Squid lens crystallins confirmed as a family of GST-like proteins by peptide sequencing
    supporting_text: 'Here we confirm by peptide sequencing that the crystallins of the

      lens of the squid Ommastrephes sloani pacificus comprise a family of GST-like

      proteins.'
  - statement: Squid lens extracts showed 400 times less GST activity than liver
    supporting_text: Squid lens extracts showed 400 times less GST activity than those of liver using
      1-chloro-2,4-dinitrobenzene as a substrate, suggesting that the abundant GST-like crystallins lack
      enzymatic activity.
- id: PMID:17293312
  title: Evolution of graded refractive index in squid lenses.
  findings:
  - statement: S-crystallins differentially expressed in a radial gradient correlating with refractive
      index
    supporting_text: S-crystallins are differentially expressed in a radial gradient, suggesting a role
      in refractive index. This gradient in S-crystallin expression is correlated with their evolutionary
      history and biochemistry.
  - statement: S-crystallins have been under positive selection for protein stabilization
    supporting_text: S-crystallins have been under positive selection. This selection appears to have
      resulted in stabilization of derived S-crystallins via mutations in the dimer interface and extended
      electrostatic fields.
- id: PMID:7987197
  title: '[The evolutionary kinship of the crystallins of cephalopods and vertebrates with heat-shock
    proteins and stress-induced proteins].'
  findings:
  - statement: S-crystallins show no enzymatic activity despite homology with squid GST
    supporting_text: S-crystallins of the squid and the octopus are related, but not identical to glutathione
      S-transferases. S-crystallins show no enzymatic activity, though they have 42-44% homology with
      a squid glutathione-S-transferase.
  - statement: Vertebrates and cephalopods converged on same strategy of enzyme co-option for lens function
    supporting_text: In the course of evolution vertebrates and cephalopods used the same strategy of
      recruitment of ancestral proteins (primarily enzymes, whose activity is related with stress and
      detoxification) for structural functions in the lens.
- id: PMID:28798124
  title: 'Eye patches: Protein assembly of index-gradient squid lenses.'
  findings:
  - statement: S-crystallins form colloidal gels at all radial positions in the squid lens via patchy
      colloidal self-assembly
    supporting_text: patchy colloidal physics resulted from an evolutionary radiation of globular S-crystallin
      proteins
  - statement: Disordered loops protruding from the S-crystallin surface (including the long-loop insertion)
      serve as low-valence linkers for self-assembly into volumetric materials
  - statement: Peripheral lens regions with low particle valence form stable gels at low density, while
      central regions with higher valence gel at higher densities, creating the refractive index gradient
- id: PMID:10733985
  title: Molecular basis for the polymerization of octopus lens S-crystallin.
  findings:
  - statement: Octopus S-crystallin aggregates more easily than sigma-GST in the presence of denaturants
  - statement: Proposed molecular model involves side-by-side associations of Lys-208 with a complementary
      patch of aspartate residues (Asp-90, Asp-94, Asp-101, Asp-102, Asp-179, Asp-180), potentially forming
      a liquid crystal structure in the lens
- id: PMID:9929473
  title: 'Homology modeling of cephalopod lens S-crystallin: a natural mutant of sigma-class glutathione
    transferase with diminished endogenous activity.'
  findings:
  - statement: Homology model revealed that S-crystallin active center is more buried after dimerization
      than in GST-sigma
  - statement: Mutation of Asn99 (GST) to Asp101 (S-crystallin) alters the electrostatic environment at
      the active site, contributing to loss of catalytic activity
  - statement: The closed conformation explains the failure of S-crystallin to bind immobilized glutathione
      in affinity chromatography
- id: PMID:8827456
  title: Kinetic characterization of the endogenous glutathione transferase activity of octopus lens S-crystallin.
  findings:
  - statement: S-crystallin kinetics conform to a steady-state random Bi-Bi mechanism similar to authentic
      GSTs
  - statement: Tyr7 interacts with bound GSH to lower the pKa of the sulfhydryl group to 6.82-6.85, but
      overall catalytic efficiency is drastically reduced
- id: PMID:39133170
  title: Membrane structures and functional correlates in the bi-segmented eye lens of the cephalopod.
  findings:
  - statement: Synchrotron X-ray scattering reveals extensive membrane-like structures in both anterior
      and posterior squid lens segments, with the posterior segment having a higher refractive index gradient
