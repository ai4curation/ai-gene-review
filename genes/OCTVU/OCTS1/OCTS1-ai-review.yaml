core_functions:
- molecular_function:
    id: GO:0005212
    label: structural constituent of eye lens
  description: OCTS1 supplies structural lens material that contributes to light refraction and visual
    perception. It is a GST-derived long-loop S-crystallin with strongly reduced reported transferase
    activity. Homolog experiments on OctS4 and its engineered Q108F mutant support glutathione-mediated
    stabilization and aggregation protection, but their quantitative kinetic and structural measurements
    are not direct measurements of OCTS1. The conserved lens structural role is better supported than
    a physiological detoxification function.
  directly_involved_in:
  - id: GO:0007601
    label: visual perception
  supported_by:
  - reference_id: PMID:1627174
    supporting_text: S-crystallin is a major lens protein present in the octopus and squid of Cephalopods.
  - reference_id: PMID:7639695
    supporting_text: S-Crystallin is a major protein present in the lenses of cephalopods (octopus and
      squid).
  - reference_id: PMID:17293312
    supporting_text: S-crystallins are differentially expressed in a radial gradient, suggesting a role
      in refractive index.
  - reference_id: PMID:27499004
    supporting_text: We suggest that a tradeoff between enzyme activity and the stability of the lens
      protein might have been one of the major driving force behind lens evolution.
  - reference_id: PMID:27499004
    supporting_text: In the presence of GSH, the melting temperature (Tm) of S-crystallin was higher by
      7 °C than that of the protein in the absence of GSH
  - reference_id: PMID:28798124
    supporting_text: patchy colloidal physics resulted from an evolutionary radiation of globular S-crystallin
