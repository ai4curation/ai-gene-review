id: P16494
gene_symbol: N
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:35304
  label: Bunyamwera virus
description: >-
  NSs is the 11-kDa non-structural accessory protein of Bunyamwera virus (BUNV), the
  prototype orthobunyavirus. It is translated by alternative initiation from the
  S-segment mRNA in a reading frame overlapping that of the nucleocapsid protein N,
  which is why UniProt files this entry under the gene name N; the protein described
  here is NSs, not the nucleocapsid. NSs is dispensable for replication in cultured
  cells and in mice but acts as a virulence factor in the mammalian host. Its
  characterised activity is a block of host RNA polymerase II-dependent transcription.
  In infected mammalian cells NSs leaves CTD serine 5 phosphorylation and promoter
  occupancy intact but prevents serine 2 phosphorylation of the polymerase CTD
  heptapeptide repeat, blocking the transition from initiation to elongation, and it
  binds the Mediator head-module subunit MED8 through a conserved C-terminal motif
  (residues 81-93) that is required for the transcriptional block. The consequences
  are shutoff of host-cell protein synthesis and failure of the infected cell to
  transcribe the interferon-beta gene, so that NSs-deficient virus becomes a strong
  inducer of type I interferon and is attenuated in interferon-competent cells and in
  mouse brain. NSs blocks interferon induction rather than interferon receptor
  signalling; upstream sensing (IRF-3 and NF-kappaB activation) and the dsRNA-activated
  effectors PKR and RNase L are unaffected. The transcriptional block is specific to
  mammalian cells, with no interference with CTD phosphorylation or host shutoff in
  mosquito cells, consistent with lytic infection of the vertebrate host and persistent
  infection of the arthropod vector.
