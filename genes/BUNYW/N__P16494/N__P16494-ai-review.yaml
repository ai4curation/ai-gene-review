existing_annotations:
- term:
    id: GO:0016032
    label: viral process
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR000797
  review:
    summary: >-
      Root-level InterPro2GO mapping from the Bunya_NSs family signature. True of NSs
      but uninformative, because the family's defining role is the block of host RNA
      polymerase II-dependent transcription and the resulting host gene-expression
      shutoff, both of which are asserted elsewhere in this review.
    action: MODIFY
    reason: >-
      The gene product is a viral protein acting in the virus-host interaction, so the
      term is not wrong, but it is a high-level parent that conveys nothing about what
      NSs does. The InterPro family it comes from (IPR000797 Bunya_NSs) is the
      orthobunyavirus NSs family whose characterised activity is inhibition of host
      RNAP II CTD serine 2 phosphorylation and consequent host shutoff [PMID:15150262,
      PMID:16973571]. Replace with the specific terms the gene already carries on
      experimental evidence, GO:0039523 for the mechanism and GO:0039657 for the
      outcome.
    proposed_replacement_terms:
    - id: GO:0039523
      label: symbiont-mediated suppression of host mRNA transcription via inhibition
        of RNA polymerase II activity
    - id: GO:0039657
      label: symbiont-mediated suppression of host gene expression
    supported_by:
    - reference_id: PMID:15150262
      supporting_text: However, NSs prevented CTD phosphorylation at serine 2, suggesting
        a block in transition from initiation to elongation.
    - reference_id: file:BUNYW/N__P16494/N__P16494-uniprot.txt
      record_section: ["CC:SIMILARITY"]
      supporting_text: Belongs to the orthobunyavirus NS-S protein family.
- term:
    id: GO:0019080
    label: viral gene expression
  evidence_type: IMP
  original_reference_id: PMID:11209062
  qualifier: involved_in
  review:
    summary: >-
      CACAO row. The cited paper's only observation about viral gene expression is that
      the NSs-deleted virus makes about ten times MORE nucleocapsid protein than wild
      type (Fig. 4A, [35S]methionine labelling of BHK cells quantified by
      PhosphorImager). NSs therefore lowers, rather than supports, the level of viral
      gene products, so as an involved_in assertion this term has the sign reversed.
    action: MODIFY
    reason: >-
      This is a direction error rather than a wrong-gene or wrong-paper problem. The
      assay is on BUNV-infected cells and the protein scored is viral, but deleting NSs
      increases viral N protein, so NSs cannot be read as contributing to viral gene
      expression [PMID:11209062]. The correctly signed term for exactly this figure is
      GO:0046725 negative regulation by virus of viral protein levels in host cell,
      which the same CACAO submission also entered from the same paper; the two rows as
      they stand contradict one another. No evidence anywhere in the BUNV NSs
      literature places NSs in viral transcription or translation, since transcription
      and replication of BUNV RNA require only N and L [PMID:11209062] and NSs is
      dispensable for growth.
    proposed_replacement_terms:
    - id: GO:0046725
      label: negative regulation by virus of viral protein levels in host cell
    supported_by:
    - reference_id: PMID:11209062
      supporting_text: Quantification of this gel by using a PhosphorImager indicated
        that approximately 10 times more N protein was produced in cells infected with
        BUNdelNSs compared with wt BUN.
    - reference_id: PMID:11209062
      supporting_text: showed that transcription and replication of the RNA required
        only the N and L proteins, although the possibility of a regulatory role for NSs
        could not be discounted
- term:
    id: GO:0039502
    label: symbiont-mediated suppression of host type I interferon-mediated signaling
      pathway
  evidence_type: IDA
  original_reference_id: PMID:15150262
  qualifier: involved_in
  review:
    summary: >-
      CACAO row. The cited paper shows that NSs blocks phosphorylation of the RNA
      polymerase II CTD at serine 2 while serine 5 phosphorylation and RNAP II
      occupancy of the interferon-beta promoter (chromatin immunoprecipitation) are
      unaffected, so the interferon-beta gene fails to be transcribed. It does not
      assay the type I interferon-mediated signaling pathway (interferon binding IFNAR
      and the downstream JAK-STAT cascade), which is what GO:0039502 denotes.
    action: MODIFY
    reason: >-
      GO:0039502 is defined as interference with a type I interferon-mediated signaling
      pathway in the host and sits under GO:0052029 symbiont-mediated suppression of
      host signal transduction pathway, so it asserts a block downstream of the
      interferon receptor. What the paper demonstrates is a block of interferon-beta
      gene transcription, upstream of any interferon being made [PMID:15150262], and the
      wider literature shows the sensing arm is explicitly NOT blocked, with IRF-3 and
      NF-kappaB activated normally in infected cells and PKR and RNase L unaffected
      [PMID:12133999, PMID:12692253]. The claim the evidence supports is suppression of
      the host innate immune response achieved through the transcription block, so the
      proposed replacement is GO:0052170; the mechanism is already captured by the
      gene's GO:0039523 rows. This is an adjacent-branch substitution, not a
      curator-attribution error, and the paper is unambiguously about this gene product.
      The companion review of Rift Valley fever virus NSs, the same lesion on host RNA
      polymerase II with the sensing arm intact, proposes a new term for this step
      (symbiont-mediated suppression of host type I interferon production) because GO has
      no symbiont-mediated counterpart of GO:0032480. That term would fit this row equally
      well and should replace GO:0052170 here if GO creates it; GO:0052170 is used now
      because it is an existing term the evidence fully supports, and this gene already
      carries it by other rows.
    proposed_replacement_terms:
    - id: GO:0052170
      label: symbiont-mediated suppression of host innate immune response
    supported_by:
    - reference_id: PMID:15150262
      supporting_text: Furthermore, RNAP II was able to bind to the IFN-beta gene
        promoter as revealed by chromatin immunoprecipitation analysis, indicating that
        the initiation of transcription was not disturbed by NSs.
    - reference_id: PMID:12133999
      supporting_text: These results suggest that BUN NSs is an IFN induction antagonist
        that blocks the transcriptional activation of IFN-alpha/beta in order to increase
        the virulence of Bunyamwera virus.
    - reference_id: PMID:12692253
      supporting_text: NSs is different from other IFN antagonists, since it inhibits
        dsRNA-dependent IFN induction but has no effect on the dsRNA-activated PKR and
        RNase L systems.
- term:
    id: GO:0039502
    label: symbiont-mediated suppression of host type I interferon-mediated signaling
      pathway
  evidence_type: IMP
  original_reference_id: PMID:11209062
  qualifier: involved_in
  review:
    summary: >-
      CACAO row, same term from the reverse-genetics paper. The supporting experiment is
      an interferon-beta promoter-luciferase reporter in murine BF cells (Fig. 7A).
      Wild-type BUNV gives background luciferase whereas BUNdelNSs gives an
      approximately 20-fold induction, with a thymidine kinase promoter control showing
      the effect is specific. That measures interferon-beta gene induction, not the
      interferon-mediated signaling pathway.
    action: MODIFY
    reason: >-
      Same adjacent-branch problem as the IDA row, resolved the same way for
      consistency. The phenotype is loss of a block on interferon-beta promoter
      activation [PMID:11209062], and direct measurement in the companion study found
      neither interferon nor interferon mRNA in wild-type-infected cells while BUNdelNSs
      was a strong inducer [PMID:12133999], all upstream of IFNAR signalling. GO:0052170
      symbiont-mediated suppression of host innate immune response is the supported
      claim, and the mechanistic term GO:0039523 is annotated separately. The paper is
      the right paper for this gene product and the knockout evidence is solid, so this
      is a term-choice correction, not a challenge to the curator's reading. As for the
      IDA row above, the proposed production term in the companion Rift Valley fever
      virus NSs review would fit this row better than GO:0052170 and should replace it if
      GO creates it.
    proposed_replacement_terms:
    - id: GO:0052170
      label: symbiont-mediated suppression of host innate immune response
    supported_by:
    - reference_id: PMID:11209062
      supporting_text: In contrast, there was approximately 20-fold increase in
        luciferase activity in cells infected with BUNdelNSs, indicating strong
        activation of the IFN-β promoter.
    - reference_id: PMID:11209062
      supporting_text: Thus, the loss of NSs changed BUN from a noninducer to an inducer
        of IFN.
    - reference_id: PMID:12133999
      supporting_text: Here we demonstrate that BUNdelNSs is a strong inducer of
        IFN-alpha/beta, whereas in cells infected with the wild-type counterpart
        expressing NSs (wild-type BUN), neither IFN nor IFN mRNA could be detected.
- term:
    id: GO:0039523
    label: symbiont-mediated suppression of host mRNA transcription via inhibition
      of RNA polymerase II activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000043
  qualifier: involved_in
  supporting_entities:
  - UniProtKB-KW:KW-1104
  review:
    summary: >-
      Keyword-based mapping (KW-1104, inhibition of host RNA polymerase II by virus)
      that agrees with the experimental IMP row for the same term and with UniProt's
      curated FUNCTION statement.
    action: ACCEPT
    reason: >-
      The keyword rests on the curated UniProt FUNCTION block, which is itself tied to
      the experimental publication (ECO:0000269 with PubMed:15150262), and the mechanism
      has since been corroborated by the MED8-interaction study [PMID:16973571] and by a
      virus whose truncated NSs fails to block RNAP II activity [PMID:20427562]. This is
      the core function of NSs.
    supported_by:
    - reference_id: file:BUNYW/N__P16494/N__P16494-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: Inhibits phosphorylation at serine 2 in the heptapeptide repeat
        (YSPTSPS) of the CTD of RNA polymerase II, suggesting that the elongation step
        of transcription and/or 3'-end processing is prevented.
    - reference_id: PMID:16973571
      supporting_text: Wild-type BUNV efficiently inhibited transcription from the CMV
        promoter, whereas BUNdelNSs2 and BUNNSs-T83 had no major effect on RNA polymerase
        II activity compared to mock infection
- term:
    id: GO:0039523
    label: symbiont-mediated suppression of host mRNA transcription via inhibition
      of RNA polymerase II activity
  evidence_type: IMP
  original_reference_id: PMID:15150262
  qualifier: involved_in
  review:
    summary: >-
      CACAO row and the best-matched annotation on this gene product. The cited paper's
      central result is exactly this term, namely that in BUNV-infected mammalian cells
      NSs prevents RNA polymerase II CTD serine 2 phosphorylation while serine 5
      phosphorylation and promoter binding are normal, so mRNA elongation and 3'-end
      processing are blocked.
    action: ACCEPT
    reason: >-
      The CACAO term matches the assay at the right granularity, a mechanism-specific
      term rather than a phenotype read-out, and it is independently corroborated. NSs
      binds the Mediator head subunit MED8 through residues 81-93, and viruses lacking
      that domain (BUNNSs-T83) or carrying an N-terminally truncated NSs lose the RNAP
      II block [PMID:16973571, PMID:20427562]. RNA polymerase II is also destabilised
      late in wild-type but not NSs-mutant infection [PMID:16973571]. Retained as a core
      function.
    supported_by:
    - reference_id: PMID:15150262
      supporting_text: Here, we demonstrate that NSs targets the RNA polymerase II (RNAP
        II) complex.
    - reference_id: PMID:15150262
      supporting_text: However, NSs prevented CTD phosphorylation at serine 2, suggesting
        a block in transition from initiation to elongation.
    - reference_id: PMID:16973571
      supporting_text: The region encompassing amino acids 81 to 93 of NSs was shown to
        be essential for the interaction.
- term:
    id: GO:0039657
    label: symbiont-mediated suppression of host gene expression
  evidence_type: IEA
  original_reference_id: GO_REF:0000043
  qualifier: involved_in
  supporting_entities:
  - UniProtKB-KW:KW-1190
  review:
    summary: >-
      Keyword-based mapping (KW-1190, host gene expression shutoff by virus), consistent
      with the experimental IMP row for the same term.
    action: ACCEPT
    reason: >-
      Host-cell gene-expression shutoff is directly demonstrated by the reduced shutoff
      of host protein synthesis in NSs-deleted virus [PMID:11209062] and by the loss of
      reporter-gene suppression in the MED8-interaction mutant [PMID:16973571]. The claim
      is independent of, rather than entailed by, GO:0039523 in the GO hierarchy (the two
      are siblings under GO:0039656 symbiont-mediated perturbation of host gene
      expression), and the 2001 paper notes that shutoff is only partly accounted for by
      any single pathway, so the broader term is kept rather than collapsed into the
      transcription term.
    supported_by:
    - reference_id: file:BUNYW/N__P16494/N__P16494-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: Inhibition of host transcription machinery leads to shut off of
        host cell protein synthesis and inhibition of the host innate immune response.
    - reference_id: PMID:11209062
      supporting_text: The reduction, but not the abrogation, of host cell protein
        shutoff by BUNdelNSs suggests also that more than one pathway may be involved.
- term:
    id: GO:0039657
    label: symbiont-mediated suppression of host gene expression
  evidence_type: IMP
  original_reference_id: PMID:11209062
  qualifier: involved_in
  review:
    summary: >-
      CACAO row, supported by Fig. 4B of the cited paper. BHK cells infected at 5
      pfu/cell and labelled with [35S]methionine show almost complete shutoff of host
      protein synthesis by 48 h with wild-type BUNV, whereas BUNdelNSs-infected cells
      retain substantial host synthesis. The term matches the assay.
    action: ACCEPT
    reason: >-
      The annotation is at the right level for the experiment, since a bulk host protein
      synthesis read-out supports suppression of host gene expression without specifying
      the step, and the transcription-level mechanism is annotated separately
      (GO:0039523). Shutoff is cell-type restricted and does not occur in mosquito cells
      [PMID:11209062], which is a property of the host interaction rather than a reason
      to doubt the term. Core function.
    supported_by:
    - reference_id: PMID:11209062
      supporting_text: At 48 h after infection, host cell protein synthesis was almost
        completely shut off in wt BUN-infected BHK cells. In contrast, in
        BUNdelNSs-infected cells, host cell protein synthesis was reduced compared with
        mock-infected cells but not inhibited to the same extent as in wt-infected cells.
    - reference_id: PMID:16973571
      supporting_text: A recombinant virus in which the interacting domain in NSs was
        deleted had strongly reduced ability to inhibit host protein expression and was
        unable to inhibit the interferon response.
- term:
    id: GO:0046725
    label: negative regulation by virus of viral protein levels in host cell
  evidence_type: IMP
  original_reference_id: PMID:11209062
  qualifier: involved_in
  review:
    summary: >-
      CACAO row, supported by Fig. 4A of the cited paper. Cells infected with BUNdelNSs
      produce roughly ten times more nucleocapsid protein than wild-type BUNV-infected
      cells, so NSs expression lowers the level of a viral protein in the infected cell.
      The term matches the measurement and is correctly signed.
    action: KEEP_AS_NON_CORE
    reason: >-
      The observation is real and the term is the right one for it, but down-regulating
      the virus' own N protein is best read as a consequence of the general NSs-imposed
      block on host RNAP II-dependent transcription and translation rather than a
      distinct evolved activity. The paper offers no mechanism specific to viral
      proteins, and the authors frame NSs as an accessory virulence factor whose
      production is tightly coupled to N expression, so the row is kept as a peripheral,
      non-core annotation. It is not removed, because the assay is in BUNV-infected
      cells, the effect is large, and the full text was read by the curator.
    supported_by:
    - reference_id: PMID:11209062
      supporting_text: It was also noticeable that the amount of N protein produced by
        BUNdelNSs, relative to the G1 protein, was increased compared with wt.
    - reference_id: PMID:11209062
      supporting_text: suggests a selection pressure against viruses in which NSs
        production is not tightly regulated by being expressed from the same mRNA as N
core_functions:
- description: >-
    Suppression of host RNA polymerase II-dependent mRNA transcription in mammalian
    cells. NSs leaves CTD serine 5 phosphorylation and promoter occupancy intact but
    prevents serine 2 phosphorylation of the polymerase CTD heptapeptide repeat,
    blocking the transition from initiation to elongation. It acts through the Mediator
    head-module subunit MED8, which it binds via a conserved motif in residues 81-93,
    and a virus truncated in that motif loses the block.
  directly_involved_in:
  - id: GO:0039523
    label: symbiont-mediated suppression of host mRNA transcription via inhibition of
      RNA polymerase II activity
  supported_by:
  - reference_id: PMID:15150262
    supporting_text: However, NSs prevented CTD phosphorylation at serine 2, suggesting
      a block in transition from initiation to elongation.
  - reference_id: PMID:16973571
    supporting_text: Here, we show that the ability to inhibit both host transcription
      and the interferon response is linked to interaction of NSs with the MED8 component
      of Mediator, a protein complex necessary for mRNA production.
  - reference_id: PMID:20427562
    supporting_text: Strikingly, despite encoding an NSs protein that contains the Med8
      interaction domain, mBUNNSs22 fails to block RNA polymerase II activity during
      infection.
  knowledge_gaps:
  - gap_statement: >-
      How NSs binding to MED8 prevents serine 2 phosphorylation of the RNA polymerase II
      CTD is undetermined; it is not known whether NSs inhibits a CTD kinase (CDK9 or
      TFIIH) directly, prevents its Mediator-dependent recruitment, or acts through
      MED8-associated ubiquitin ligase activity.
    boundary: >-
      Established: NSs binds MED8 via residues 81-93, the interaction is required for the
      transcription block, serine 5 phosphorylation and promoter occupancy are unaffected,
      and RNA polymerase II is destabilised late in wild-type infection.
    gap_kind:
    - BIOLOGY
  - gap_statement: >-
      The function of the NSs N-terminal 21 residues is unknown; a virus expressing an
      N-terminally truncated NSs retains the MED8 interaction domain yet fails to block
      RNA polymerase II, so a second, unidentified activity is required.
    boundary: >-
      Established: MED8 binding alone is insufficient for the transcription block, and
      both the N-terminal region and the C-terminal MED8 motif are needed for interferon
      antagonism.
    gap_kind:
    - BIOLOGY
- description: >-
    Shutoff of host-cell gene expression and protein synthesis in the mammalian host,
    the downstream consequence of the transcription block. Shutoff is reduced but not
    abolished in NSs-deleted virus and does not occur in mosquito cells.
  directly_involved_in:
  - id: GO:0039657
    label: symbiont-mediated suppression of host gene expression
  supported_by:
  - reference_id: PMID:11209062
    supporting_text: At 48 h after infection, host cell protein synthesis was almost
      completely shut off in wt BUN-infected BHK cells.
  - reference_id: PMID:16973571
    supporting_text: A recombinant virus in which the interacting domain in NSs was
      deleted had strongly reduced ability to inhibit host protein expression and was
      unable to inhibit the interferon response.
  knowledge_gaps:
  - gap_statement: >-
      What accounts for the NSs-independent component of host shutoff, and whether NSs
      contributes anything post-transcriptionally, is unresolved; shutoff is reduced but
      not abolished in NSs-deleted virus.
    boundary: >-
      Established: NSs is required for full shutoff of host protein synthesis in
      mammalian cells, acting at least through the RNA polymerase II serine 2 block, and
      no shutoff occurs in mosquito cells with or without NSs.
    gap_kind:
    - BIOLOGY
- description: >-
    Antagonism of the host innate immune response by preventing transcriptional
    activation of the interferon-beta gene, so that infected cells make neither
    interferon nor interferon mRNA. The block is on interferon induction, not on
    interferon receptor signalling, and upstream sensing (IRF-3 and NF-kappaB) and the
    dsRNA-activated PKR and RNase L systems remain functional. Loss of this activity
    attenuates the virus in interferon-competent cells and in mouse brain.
  directly_involved_in:
  - id: GO:0052170
    label: symbiont-mediated suppression of host innate immune response
  supported_by:
  - reference_id: PMID:12133999
    supporting_text: These results suggest that BUN NSs is an IFN induction antagonist
      that blocks the transcriptional activation of IFN-alpha/beta in order to increase
      the virulence of Bunyamwera virus.
  - reference_id: PMID:11209062
    supporting_text: Thus, the loss of NSs changed BUN from a noninducer to an inducer of
      IFN.
  - reference_id: PMID:16973571
    supporting_text: an RT-PCR signal specific for IFN-β mRNA was detected only in cells
      infected with BUNdelNSs or BUNNSsT83 virus, and no signal was detected in cells
      infected with wt BUNV or in mock-infected cells
  knowledge_gaps:
  - gap_statement: >-
      Why the transcription and interferon block operates in mammalian but not insect
      cells is unknown; it has not been established whether the relevant Mediator or CTD
      kinase target differs in mosquito cells or whether NSs fails to engage it there.
    boundary: >-
      Established: NSs inhibits CTD serine 2 phosphorylation and interferon-beta
      transcription in mammalian cells, while no interference with CTD phosphorylation is
      detectable in insect cells, where infection is persistent rather than lytic.
    gap_kind:
    - BIOLOGY
suggested_questions:
- question: >-
    Is host-cell shutoff attributable entirely to the RNA polymerase II serine 2 block,
    or does NSs also act post-transcriptionally? Shutoff is reduced but not abolished in
    BUNdelNSs, and the authors explicitly invoke more than one pathway.
- question: >-
    Should GO add a term for symbiont-mediated suppression of host type I interferon
    production, as distinct from the existing signalling terms GO:0039502 and
    GO:0140886? Several viral proteins, including BUNV and Rift Valley fever virus NSs,
    block interferon gene transcription without touching IFNAR signalling, and curators
    appear to reach for the signalling term for lack of an induction term.
- question: >-
    What explains the mammalian-versus-mosquito difference, absence of the relevant
    Mediator or CDK interaction in insect cells, or failure of NSs to reach its target
    there?
suggested_experiments:
- description: >-
    Reconstitute the NSs block in vitro with purified Mediator and RNA polymerase II plus
    P-TEFb/CDK9 and TFIIH, to test directly whether NSs inhibits CTD serine 2 kinase
    activity or instead prevents kinase recruitment via MED8.
- description: >-
    Compare Mediator composition and NSs-MED8 binding in mammalian versus Aedes cells
    (co-immunoprecipitation from both backgrounds, plus complementation of insect cells
    with the mammalian MED8 orthologue) to explain the host-restricted transcription
    block.
- description: >-
    Define the function of the NSs N-terminal 21 residues separately from MED8 binding,
    using the ambisense-S recombinant viruses that express tagged NSs independently of N,
    combined with quantitative CTD phospho-profiling (Ser2 and Ser5 ChIP-seq) and host
    transcriptome measurement.
- description: >-
    Test whether the reduction of viral N protein levels by NSs is a mechanistically
    distinct activity or a by-product of global shutoff, by measuring S-segment mRNA and
    N protein in cells infected with wild-type, BUNdelNSs and BUNNSs-T83 viruses at
    matched replication levels.
