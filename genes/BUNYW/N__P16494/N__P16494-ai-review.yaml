- id: PMID:11209062
  title: Bunyamwera bunyavirus nonstructural protein NSs is a nonessential gene product
    that contributes to viral pathogenesis.
  findings:
  - statement: >-
      NSs is dispensable for replication in cultured cells and in mice but contributes to
      virulence; BUNdelNSs forms smaller plaques, grows to about 1 log lower titres and
      kills mice more slowly after intracerebral inoculation.
    supporting_text: The generation of viruses lacking the NSs gene shows conclusively
      that the product is not essential for replication in either cultured cells or in
      mice, and thus NSs can be designated as an accessory protein.
  - statement: >-
      NSs is required for efficient shutoff of host-cell protein synthesis, though
      shutoff is reduced rather than abolished in its absence.
    supporting_text: At 48 h after infection, host cell protein synthesis was almost
      completely shut off in wt BUN-infected BHK cells.
  - statement: >-
      Loss of NSs converts BUNV from a non-inducer to a strong inducer of the
      interferon-beta promoter, with a thymidine kinase promoter control showing the
      effect is not merely reduced shutoff.
    supporting_text: This indicates that activation of the IFN-β promoter was specific
      and independent of the reduced ability of BUNdelNSs to shut off host cell protein
      synthesis.
  - statement: >-
      Cells infected with NSs-deleted virus accumulate about ten times more viral
      nucleocapsid protein than wild-type-infected cells.
    supporting_text: Quantification of this gel by using a PhosphorImager indicated that
      approximately 10 times more N protein was produced in cells infected with BUNdelNSs
      compared with wt BUN.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text cached and read (PMC14645). Establishes the NSs knockout phenotypes that
      four of the five CACAO rows rest on. Supports host shutoff, the interferon
      induction block and the viral N protein increase, but contains nothing placing NSs
      in viral gene expression or in interferon receptor signalling.
- id: PMID:15150262
  title: Inhibition of RNA polymerase II phosphorylation by a viral interferon antagonist.
  findings:
  - statement: >-
      NSs targets the RNA polymerase II complex and prevents CTD serine 2 phosphorylation
      while serine 5 phosphorylation and promoter binding remain normal, implying a block
      between initiation and elongation.
    supporting_text: However, NSs prevented CTD phosphorylation at serine 2, suggesting a
      block in transition from initiation to elongation.
  - statement: >-
      RNA polymerase II still occupies the interferon-beta promoter in infected cells, so
      NSs acts after recruitment rather than by preventing initiation.
    supporting_text: Furthermore, RNAP II was able to bind to the IFN-beta gene promoter
      as revealed by chromatin immunoprecipitation analysis, indicating that the
      initiation of transcription was not disturbed by NSs.
  - statement: >-
      The CTD phosphorylation block is specific to mammalian cells and is not seen in
      insect cells, consistent with lytic infection of the vertebrate host and persistent
      infection of the vector.
    supporting_text: Surprisingly, no interference with CTD phosphorylation was observed
      in insect cells.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Abstract-only in the cache (full_text_available false); the JBC full text could not
      be retrieved and the GONUTS page for this PMID is offline, so figure-level detail
      comes from the abstract and from the recapitulation in PMID:16973571. The abstract
      is explicit enough to show that the paper assays interferon-beta gene transcription
      rather than interferon receptor signalling, which is the basis for modifying the
      GO:0039502 row.
- id: PMID:12133999
  title: Bunyamwera bunyavirus nonstructural protein NSs counteracts the induction of
    alpha/beta interferon.
  findings:
  - statement: >-
      Wild-type BUNV-infected cells contain neither interferon nor interferon mRNA whereas
      BUNdelNSs is a strong inducer; induction requires viral dsRNA and IRF-3 and
      correlates with NF-kappaB activation, placing the NSs block at transcriptional
      activation of the interferon genes rather than at sensing.
    supporting_text: IFN induction by BUNdelNSs correlated with activation of NF-kappaB
      and was dependent on virally produced double-stranded RNA and on the IFN
      transcription factor IRF-3.
  - statement: >-
      BUNdelNSs replicates to wild-type levels in cells and mice lacking a functional type
      I interferon system, showing that the growth defect is caused by the interferon it
      induces.
    supporting_text: Furthermore, both in cultured cells and in mice lacking a functional
      IFN-alpha/beta system, BUNdelNSs replicated to wild-type BUN levels, whereas in
      IFN-competent systems, wild-type BUN grew more efficiently.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Abstract-only in the cache. Added by this review and not a GOA reference. Decides
      the induction-versus-signalling question that the GO:0039502 rows turn on.
- id: PMID:16973571
  title: 'Interaction of Bunyamwera Orthobunyavirus NSs protein with mediator protein
    MED8: a mechanism for inhibiting the interferon response.'
  findings:
  - statement: >-
      NSs binds the Mediator head-module subunit MED8 (yeast two-hybrid plus
      co-immunoprecipitation from mammalian cells), with the interaction domain mapped to
      NSs residues 81-93, a region containing the most C-terminally conserved
      orthobunyavirus NSs motif.
    supporting_text: The region encompassing amino acids 81 to 93 of NSs was shown to be
      essential for the interaction.
  - statement: >-
      A recombinant virus truncated in the MED8-interaction domain (BUNNSs-T83) behaves
      like the NSs deletion virus, failing to inhibit RNA polymerase II-driven reporter
      transcription, failing to suppress host protein expression and permitting
      interferon-beta mRNA synthesis.
    supporting_text: an RT-PCR signal specific for IFN-β mRNA was detected only in cells
      infected with BUNdelNSs or BUNNSsT83 virus, and no signal was detected in cells
      infected with wt BUNV or in mock-infected cells
  - statement: >-
      RNA polymerase II is progressively destabilised in wild-type infection but remains
      stable in BUNdelNSs and BUNNSs-T83 infections, suggesting an NSs-dependent late
      degradation of the polymerase.
    supporting_text: RNA polymerase II levels decreased over time in wt BUNV-infected
      cells, while the protein appeared considerably more stable in BUNdelNSs2-infected
      cells.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text cached and read; added by this review. Provides the molecular mechanism
      behind GO:0039523 and the strongest independent corroboration of the CACAO
      transcription annotation.
- id: PMID:20427562
  title: The N-terminus of Bunyamwera orthobunyavirus NSs protein is essential for
    interferon antagonism.
  findings:
  - statement: >-
      A virus expressing NSs lacking the N-terminal 21 residues retains the
      MED8-interaction domain yet still fails to block RNA polymerase II activity and is a
      potent interferon inducer, so MED8 binding is necessary but not sufficient for the
      transcription block.
    supporting_text: Strikingly, despite encoding an NSs protein that contains the Med8
      interaction domain, mBUNNSs22 fails to block RNA polymerase II activity during
      infection.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Full text cached; added by this review. Used for the structure-function caveat and
      the knowledge gap, not as primary support for any annotation action.
- id: PMID:12692253
  title: Activation of PKR by Bunyamwera virus is independent of the viral interferon
    antagonist NSs.
  findings:
  - statement: >-
      NSs does not inhibit the dsRNA-activated effectors PKR or RNase L; eIF-2alpha
      phosphorylation is similar in wild-type and NSs-deleted infection, so the NSs block
      is confined to interferon induction.
    supporting_text: NSs is different from other IFN antagonists, since it inhibits
      dsRNA-dependent IFN induction but has no effect on the dsRNA-activated PKR and RNase
      L systems.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Abstract-only in the cache; added by this review. Bounds the scope of the NSs
      innate-immune block, supporting the move away from the interferon signalling term.
- id: PMID:19193790
  title: Bunyamwera orthobunyavirus S-segment untranslated regions mediate poly(A)
    tail-independent translation.
  findings:
  - statement: >-
      The PABP1-binding and nuclear-retention activity reported in this paper is
      attributed to the viral nucleocapsid protein N, not to NSs, although UniProt's
      P16494 FUNCTION block cites this paper for NSs involvement in PABP1 relocalisation.
    supporting_text: Furthermore, we demonstrate that the viral nucleocapsid protein binds
      to, and colocalizes with, PABP in the cytoplasm early in infection, followed by
      nuclear retention of PABP.
  reference_review:
    relevance: LOW
    correctness: MISCITED
    review_notes: >-
      The paper itself is sound and correctly identified; the problem is its use in
      UniProt's NSs FUNCTION block, where the PABP1 statement is attributed to NSs while
      the paper attributes the PABP interaction to the nucleocapsid protein N. Recorded
      here so the claim is not propagated to an NSs annotation.
