- id: file:9POAL/NCGR_LOCUS1270/NCGR_LOCUS1270-hypotheses/function-hypothesis-go-0006000/openscientist.md
  title: OpenScientist fructose-process adjudication for NCGR_LOCUS1270
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: Read in full. Useful FBPase/chloroplast context and separate ontology branches, but
      absent is_a ancestry is not disjointness. Existing human FBP1/FBP2 TAS and Dictyostelium fbp IDA
      annotations contradict the blanket free-fructose-substrate rule. Actual PTN004269459 maps to a chloroplast-associated
      sorghum protein, so cytosolic-paralog misgrafting was not demonstrated. Export contained no executed
      analysis sidecar beyond report renders; key sequence and topology observations were independently
      recomputed. No duplicate run is needed.
  findings:
  - statement: The report correctly identifies the phosphatase reaction and chloroplast specialization,
      but overstates exclusion of broader metabolic processes and secondary compartments.
- id: file:9POAL/NCGR_LOCUS1270/NCGR_LOCUS1270-bioinformatics/RESULTS.md
  title: NCGR TreeGrafter reference identity, sequence comparison and GO comparator audit
  findings:
  - statement: The named sorghum reference supports chloroplast specialization and does not demonstrate
      an erroneous cytosolic-paralog graft.
    supporting_text: The named TreeGrafter reference is a chloroplast-associated sorghum homolog, not
      an established cytosolic-paralog mismatch.
