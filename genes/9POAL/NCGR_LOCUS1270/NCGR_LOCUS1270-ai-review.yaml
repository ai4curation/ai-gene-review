core_functions:
- description: Chloroplastic fructose-1,6-bisphosphatase catalyzes the hydrolysis of fructose-1,6-bisphosphate
    to fructose-6-phosphate and inorganic phosphate as part of the Calvin-Benson-Bassham cycle in the
    chloroplast stroma. This is the primary evolved function of this enzyme, operating at a critical branch
    point that controls partitioning of fixed carbon between RuBP regeneration and carbon output for starch
    synthesis. The enzyme is light-activated via the ferredoxin/thioredoxin system and requires Mg2+.
    In C4 grasses like Miscanthus, this activity occurs primarily in bundle sheath cell chloroplasts.
  molecular_function:
    id: GO:0042132
    label: fructose 1,6-bisphosphate 1-phosphatase activity
  directly_involved_in:
  - id: GO:0019253
    label: reductive pentose-phosphate cycle
  locations:
  - id: GO:0009570
    label: chloroplast stroma
  supported_by:
  - reference_id: PMID:16415064
    supporting_text: FBPase contributes to the partitioning of the fixed carbon for RuBP regeneration
      or starch synthesis
  - reference_id: PMID:18377232
    supporting_text: ferredoxin (Fdx) was shown to activate fructose 1,6-bisphosphatase in illuminated
      chloroplast preparations, thereby laying the foundation for the field now known as "redox biology."
  - reference_id: PMID:16663806
    supporting_text: The results suggest the chloroplastic FBPase in maize is primarily located in the
      bundle sheath cells
suggested_questions:
- question: Does the Miscanthus lutarioriparius cpFBPase have dual FBPase/SBPase activity like some cyanobacterial
    homologs, or is it strictly specific for fructose-1,6-bisphosphate?
  experts: []
- question: Is the NCGR_LOCUS1270 locus the only cpFBPase gene in M. lutarioriparius, or are there additional
    paralogs (e.g., a cpFBPaseII-like redox-independent isoform as described in Arabidopsis)?
  experts: []
- question: Which physiological process boundaries justify fructose/sucrose metabolism or gluconeogenesis
    for this chloroplast FBPase, and is there a functional conditional cytosolic pool? The named TreeGrafter
    reference is a closely matching chloroplast-associated sorghum homolog; distinguish an ancestral assertion
    needing refinement from a demonstrated wrong-paralog query insertion.
suggested_experiments:
- hypothesis: NCGR_LOCUS1270 encodes a functional chloroplastic FBPase with thioredoxin-dependent redox
    regulation.
  description: Express recombinant NCGR_LOCUS1270 protein, confirm FBPase activity in vitro, and test
    for thioredoxin f-dependent activation. Compare kinetic parameters (Km for FBP, metal ion requirements,
    pH optimum) with characterized cpFBPases from maize and Arabidopsis.
- hypothesis: The cpFBPase in Miscanthus is preferentially expressed in bundle sheath cells, consistent
    with its role in C4 Calvin cycle operation.
  description: Perform in situ hybridization or cell-type-specific transcriptomic analysis (e.g., laser
    capture microdissection) of M. lutarioriparius leaves to determine whether NCGR_LOCUS1270 is preferentially
    expressed in bundle sheath versus mesophyll cells.
status: COMPLETE
