id: A0A811M8A5
gene_symbol: NCGR_LOCUS1270
taxon:
  id: NCBITaxon:422564
  label: Miscanthus lutarioriparius
description: NCGR_LOCUS1270 is a predicted chloroplast fructose-1,6-bisphosphatase from the C4 grass Miscanthus
  lutarioriparius. It hydrolyzes fructose 1,6-bisphosphate to fructose 6-phosphate and inorganic phosphate,
  supporting carbon regeneration and partitioning in the Calvin-Benson-Bassham cycle. Conserved sequence
  features and close grass homologs support stromal localization and light-dependent regulation through
  the ferredoxin/thioredoxin system. The enzyme belongs to the class1 FBPase family and uses magnesium
  as a cofactor.
