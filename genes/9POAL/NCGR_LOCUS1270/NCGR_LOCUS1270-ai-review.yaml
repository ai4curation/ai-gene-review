  review:
    summary: The chloroplast role does not resolve whether the broader sucrose-process annotation is warranted.
    action: UNDECIDED
    reason: Chloroplast FBPase supplies and regulates carbon partitioning, whereas the best-established
      sucrose-synthesis reactions use the cytosolic paralog. Supplying precursors alone is not sufficient
