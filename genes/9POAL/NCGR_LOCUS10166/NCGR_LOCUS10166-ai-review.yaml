taxon:
  id: NCBITaxon:422564
  label: Miscanthus lutarioriparius
description: NCGR_LOCUS10166 encodes a predicted 719-amino-acid protein in Miscanthus 
  lutarioriparius with an N-terminal histidinol dehydrogenase-like domain and a C-terminal ARV1-like
  membrane region. The HDH domain retains annotated catalytic and zinc-binding residues and is 
  strongly conserved relative to a separate Miscanthus HDH, supporting a role in NAD-dependent 
  histidinol oxidation during histidine biosynthesis. The ARV-like region suggests a connection to 
  membrane lipid homeostasis. Whether the deposited model produces a single functional fusion 
  protein, and how its domains are processed or targeted between plastid and endomembrane 
  compartments, remain unresolved.
