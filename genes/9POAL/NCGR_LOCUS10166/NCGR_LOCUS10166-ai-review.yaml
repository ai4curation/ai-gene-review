core_functions:
- molecular_function:
    id: GO:0004399
    label: histidinol dehydrogenase activity
  description: The conserved N-terminal HDH domain is predicted to catalyze NAD-dependent oxidation 
    of histidinol to histidine. Annotated catalytic and zinc-coordination residues are retained. 
    This is an inference from the deposited model; expression of a complete fusion and its 
    physiological compartment remain unresolved.
  directly_involved_in:
  - id: GO:0000105
    label: L-histidine biosynthetic process
  supported_by:
  - *id001
proposed_new_terms: []
suggested_questions:
- question: Does Ml02G067130.1 encode an expressed fusion, alternative processed products, or an 
    incorrectly merged model? Deposited chromosome-1 homolog coordinates establish a separate 
    adjacent pair, but do not resolve the chromosome-2 transcript.
- question: Does the candidate ARV region retain the functional AHD C-terminal subdomain and 
    lipid-homeostasis roles despite divergent ends? Loss of the cysteine-rich subdomain alone is 
    tolerated in Arabidopsis.
- question: What are the mature products and destinations, and can a soluble cytosolic pool or 
    plastid/ER partitioning be demonstrated?
suggested_experiments:
- description: Sequence full-length transcripts across the proposed HDH–ARV junction and test 
    protein termini with targeted proteomics.
  hypothesis: The locus may generate a fusion, separate products or alternative transcripts; 
    junction and peptide data can distinguish these possibilities.
- description: Assay HDH activity and ARV complementation for experimentally validated products, 
    with organelle-localization imaging.
  hypothesis: The HDH domain may remain catalytically active even if the fused model or ARV 
    targeting differs from the deposited prediction.
