- id: PMID:16725371
  title: Arabidopsis thaliana expresses two functional isoforms of Arvp, a protein involved in the 
    regulation of cellular lipid homeostasis.
  findings:
  - statement: Arabidopsis ARV homologs complement yeast arv1 deficiency and localize to ER in onion
      cells; this does not resolve the Miscanthus fusion.
    supporting_text: both proteins are exclusively targeted to the endoplasmic reticulum.
  - statement: Loss of the cysteine-rich ARV subdomain alone did not abolish homolog activity.
    supporting_text: Removal of the cysteine-rich subdomain has no effect on Arvp activity,
