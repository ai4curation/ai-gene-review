suggested_questions:
- question: >-
    Does the PMID:19824013 supplementary table place Exg2 in the
    phosphatidylinositol-phospholipase-C-released GPI fraction, and is any
    sharper cell-surface term warranted for GPI-anchored Candida glucanases?
  experts:
  - Candida Genome Database curators
suggested_experiments:
- description: >-
    Directly assay purified Exg2 and Xog1 under matched beta-1,3-glucan
    substrates and in exg2/xog1 double mutants to quantify Exg2's catalytic
    contribution under cell-wall regeneration and iron-limitation conditions.
  hypothesis: >-
    Exg2 is a lower-abundance GPI-anchored exo-1,3-beta-glucanase whose
    contribution to wall beta-glucan remodeling is context-specific and masked
    by Xog1 during standard planktonic growth.
