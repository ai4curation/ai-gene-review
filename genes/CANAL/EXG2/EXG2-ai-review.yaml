id: Q5AIA1
gene_symbol: EXG2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:237561
  label: Candida albicans SC5314
description: >-
  Candida albicans EXG2 encodes a predicted GPI-anchored glycoside hydrolase 5
  glucan exo-1,3-beta-glucosidase related to Xog1. Exg2 belongs to the fungal
  EXG1/XOG1 secreted beta-glucanase subfamily, is predicted to act at the
  extracellular face of the cell membrane or after secretion, and is implicated
  in fungal-type cell wall beta-glucan metabolism, although Xog1 supplies the
  dominant measured exoglucanase activity during standard growth.
core_functions:
- description: >-
    GPI-anchored or secreted exo-1,3-beta-glucanase predicted to remove glucose
    from the non-reducing ends of beta-1,3-glucans during fungal-type cell wall
    beta-glucan remodeling.
  molecular_function:
    id: GO:0004338
    label: glucan exo-1,3-beta-glucosidase activity
  directly_involved_in:
  - id: GO:0070879
    label: fungal-type cell wall beta-glucan metabolic process
