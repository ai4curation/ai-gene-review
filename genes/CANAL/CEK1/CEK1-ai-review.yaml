- term:
    id: GO:0009272
    label: fungal-type cell wall biogenesis
  evidence_type: IMP
  original_reference_id: PMID:19563901
  qualifier: involved_in
  review:
    summary: >-
      Cek1 is required for normal C. albicans cell-wall mannan assembly.
    action: ACCEPT
    reason: >-
      The mannan analysis directly compared the cek1 deletion mutant with wild type and found that cek1
      cells lacked the high- and intermediate-molecular-weight mannan species found in wild type. That
      mutant cell-wall composition phenotype supports fungal-type cell wall biogenesis.
    supported_by:
    - reference_id: PMID:19563901
      supporting_text: >-
        the mannan of strains CHK21 (chk1Delta null), the cek1Delta null, and the double mutant consisted
        only of low Mw mannan
