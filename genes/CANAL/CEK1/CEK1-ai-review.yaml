id: Q5A1D3
gene_symbol: CEK1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:237561
  label: Candida albicans SC5314
description: >-
  Candida albicans CEK1 encodes an ERK/Kss1/Fus3-family MAP kinase that acts in a Ste11-Hst7-Cek1 module
  downstream of upstream inputs including Cst20 and Sho1. Cek1 phosphorylates protein substrates as part
  of nutrient-responsive and cell-wall-responsive signaling, promotes starvation-induced and serum-associated
  filamentous growth, contributes to normal fungal cell-wall mannan and beta-glucan architecture, and
  partially overlaps with Cek2 in the Candida mating pathway.
