  evidence_type: IMP
  original_reference_id: PMID:9398674
  qualifier: involved_in
  review:
    summary: >-
      The CPP1/CEK1 genetic interaction supports Cek1-dependent control of filamentous growth.
    action: ACCEPT
    reason: >-
      Deletion of CEK1 suppressed cpp1 derepressed hyphal growth on solid surfaces, placing Cek1 in the
