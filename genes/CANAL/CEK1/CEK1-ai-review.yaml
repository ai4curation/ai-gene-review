- term:
    id: GO:0052067
    label: symbiont-mediated perturbation of host phagocytosis
  evidence_type: IMP
  original_reference_id: PMID:40172223
  qualifier: involved_in
  review:
    summary: >-
      CEK1 limits early phagocyte recruitment and uptake in the zebrafish infection model.
    action: KEEP_AS_NON_CORE
    reason: >-
      The 2025 zebrafish screen directly assayed a cek1 deletion strain and its CEK1 add-back, then grouped
      cek1 among mutants with increased phagocytosis and increased phagocyte count at the infection site.
      This is a valid host-pathogen phenotype, but secondary to Cek1 MAPK signaling through wall and morphogenesis
      outputs.
    supported_by:
    - reference_id: PMID:40172223
      supporting_text: >-
        one (Group IV; cek1∆/∆) had increased phagocytosis and an increased phagocyte count
- term:
    id: GO:0071466
    label: cellular response to xenobiotic stimulus
  evidence_type: IMP
  original_reference_id: PMID:17604452
  qualifier: involved_in
  review:
    summary: >-
      The CaFT screen design supports compound-response profiling, but the CEK1-specific supplemental
      row is not cached.
    action: UNDECIDED
    reason: >-
      The 2007 chemically induced haploinsufficiency paper used heterozygous deletion strains to identify
      compound-sensitive Candida genes. CEK1 may have been scored in the missing Table S1, but the cached
      article body does not mention CEK1 or orf19.10404, so the xenobiotic-response claim should remain
      undecided until the supplement is available.
    supported_by:
    - reference_id: PMID:17604452
      supporting_text: >-
        The CaFT facilitates a reverse genetic approach; that is, it links traits (responses to inhibitory
        compounds) to preexisting mutations
- term:
    id: GO:0071507
    label: pheromone response MAPK cascade
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN001172087
  - PomBase:SPAC31G5.09c
  - SGD:S000000112
  review:
    summary: >-
      The PTN001172087 fungal ERK-family PAINT inference fits Cek1 partial participation in Candida mating.
    action: ACCEPT
    reason: >-
      PTN001172087 is the fungal Kss1/Fus3/Spk1-type pheromone MAPK-cascade node. C. albicans CEK1 is
      in this clade and experimental Candida genetics show that cek1 contributes to mating, partly redundantly
      with CEK2, so the PAINT placement is appropriate.
    supported_by:
    - reference_id: PMID:12453219
      supporting_text: >-
        cst20 and cek1 mutants showed reduced mating efficiency
    - reference_id: PMID:12453219
      supporting_text: >-
        a cek1 cek2 double mutant was completely defective in mating
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: PANTHER:PTN001172087
        source_label: PANTHER:PTN001172087
        source_status: SUPPORTS_TRANSFER
        comment: >-
          This fungal ERK-family node is seeded by pheromone MAPKs, and Candida CEK1 has direct support
          for a partial, CEK2-redundant role in mating.
- term:
    id: GO:0106310
    label: protein serine kinase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000116
  qualifier: enables
  supporting_entities:
  - RHEA:17989
  review:
    summary: >-
      The Rhea row captures the serine-phosphorylation half of CEK1 MAP kinase chemistry.
    action: ACCEPT
    reason: >-
      CEK1 is annotated with EC 2.7.11.24 and UniProt records the L-seryl-protein phosphorylation reaction,
      so protein serine kinase activity is a correct parent of the MAP kinase reaction.
    supported_by:
    - reference_id: file:genes/CANAL/CEK1/CEK1-uniprot.txt
      supporting_text: >-
        Reaction=L-seryl-[protein] + ATP = O-phospho-L-seryl-[protein] + ADP +
- term:
    id: GO:1900436
    label: positive regulation of filamentous growth of a population of unicellular organisms in 
      response to starvation
  evidence_type: IMP
  original_reference_id: PMID:9398674
  qualifier: involved_in
  review:
    summary: >-
      The CPP1/CEK1 genetic interaction supports hyphal growth, but not the narrow positive starvation-regulation
      term.
    action: MODIFY
    reason: >-
      The cpp1 suppression experiment establishes that Cek1-dependent signaling controls filamentous growth
      on solid surfaces; the exact starvation-positive-regulation assertion belongs to the later direct
      CEK1 deletion paper.
    supported_by:
    - reference_id: PMID:9398674
      supporting_text: >-
        Disruption of the MAP kinase homologue CEK1 suppressed the morphological effects of the CPP1 disruption
        in C. albicans
    proposed_replacement_terms:
    - id: GO:0030447
      label: filamentous growth
- term:
    id: GO:1900436
    label: positive regulation of filamentous growth of a population of unicellular organisms in 
      response to starvation
  evidence_type: IMP
  original_reference_id: PMID:9596738
  qualifier: involved_in
  review:
    summary: >-
      CEK1 positively regulates starvation-induced filamentation.
    action: ACCEPT
    reason: >-
      The cek1 deletion phenotype on severe nitrogen starvation plates, plus placement of CEK1 with CST20,
      HST7 and CPH1 in a canonical MAPK cascade, supports the positive-regulation term for starvation-induced
      filamentous growth.
    supported_by:
    - reference_id: PMID:9596738
      supporting_text: >-
        Epistasis studies revealed that the C. albicans CST20 , HST7 , CEK1 , and CPH1 gene products lie
        in an equivalent, canonical, MAPK cascade
    - reference_id: PMID:9596738
      supporting_text: >-
        Strains with deletions of both alleles of CST20 , CPH1 , HST7 , or CEK1 were all defective in
        true hyphal outgrowth on solid SLAD
- term:
    id: GO:1900445
    label: positive regulation of filamentous growth of a population of unicellular organisms in 
      response to biotic stimulus
  evidence_type: IMP
  original_reference_id: PMID:9596738
  qualifier: involved_in
  review:
    summary: >-
      CEK1 positively regulates serum-induced mycelial colony growth.
    action: ACCEPT
    reason: >-
      CEK1 add-back experiments showed that cek1 disruption impairs serum-induced mycelial colony expansion,
      supporting positive regulation of filamentation in response to a biotic stimulus.
    supported_by:
    - reference_id: PMID:9596738
      supporting_text: >-
        disruption of the CEK1 gene adversely affects the growth of serum-induced mycelial colonies
- term:
    id: GO:1990277
    label: parasexual reproduction with cellular fusion
  evidence_type: IMP
  original_reference_id: PMID:12453219
  qualifier: involved_in
  review:
    summary: >-
      CEK1 has a partial, CEK2-redundant role in Candida parasexual mating.
    action: KEEP_AS_NON_CORE
    reason: >-
      Candida mating is a real Cek1 MAPK-pathway output, but cek1 single mutants only have reduced mating
      because Cek2 is partially redundant. Keep the row as a secondary specialized output rather than
      the central CEK1 morphogenesis and wall function.
    supported_by:
    - reference_id: PMID:12453219
      supporting_text: >-
        cst20 and cek1 mutants showed reduced mating efficiency
    - reference_id: PMID:12453219
      supporting_text: >-
        a cek1 cek2 double mutant was completely defective in mating
