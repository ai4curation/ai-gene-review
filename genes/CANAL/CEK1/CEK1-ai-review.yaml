- term:
    id: GO:0030447
    label: filamentous growth
  evidence_type: IMP
  original_reference_id: PMID:9596738
  qualifier: involved_in
  review:
    summary: >-
      Direct cek1 deletion and add-back experiments established a role in agar-invasive and serum-associated
      mycelial growth.
    action: ACCEPT
    reason: >-
      The CEK1-null strain is defective in the shift to agar-invasive hyphal colonies under nutrient-limited
      solid-medium conditions, while also showing reduced serum-induced mycelial colony growth. This is
      direct support for a Cek1 role in Candida filamentous growth.
    supported_by:
    - reference_id: PMID:9596738
      supporting_text: >-
        Cek1p acts as part of the MAPK cascade involved in starvation-specific hyphal development
    - reference_id: PMID:9596738
      supporting_text: >-
        disruption of the CEK1 gene adversely affects the growth of serum-induced mycelial colonies
