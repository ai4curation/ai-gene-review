core_functions:
- description: >-
    MAP kinase activity in the Cek1 MAPK pathway: Cek1 is an ERK-family Ser/Thr protein kinase whose activation
    supports starvation- and serum-associated filamentation and normal fungal cell-wall construction in
    C. albicans.
  molecular_function:
    id: GO:0004707
    label: MAP kinase activity
  directly_involved_in:
  - id: GO:0036170
    label: filamentous growth of a population of unicellular organisms in response to starvation
  - id: GO:0009272
    label: fungal-type cell wall biogenesis
  locations:
  - id: GO:0005634
    label: nucleus
  - id: GO:0005737
    label: cytoplasm
  supported_by:
  - reference_id: PMID:9596738
    supporting_text: >-
      Cek1p acts as part of the MAPK cascade involved in starvation-specific hyphal development
  - reference_id: PMID:19563901
    supporting_text: >-
      the mannan of strains CHK21 (chk1Delta null), the cek1Delta null, and the double mutant consisted
      only of low Mw mannan
suggested_questions:
- question: >-
    Which direct Cek1 substrates connect Hst7-Cek1 activation to cell-wall mannan assembly, beta-glucan
    masking, and starvation-induced filamentous growth?
suggested_experiments:
- description: >-
    Use analog-sensitive Cek1 combined with quantitative phosphoproteomics after SLAD, mannitol-agar,
    serum, and cell-wall perturbation treatments to separate direct Cek1 substrates from indirect Cek1-dependent
    phosphosites.
