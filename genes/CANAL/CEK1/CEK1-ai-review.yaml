- term:
    id: GO:0009267
    label: cellular response to starvation
  evidence_type: IMP
  original_reference_id: PMID:9398674
  qualifier: involved_in
  review:
    summary: >-
      The CPP1/CEK1 genetics support Cek1-dependent filamentous growth, but not a generic starvation-response
      annotation.
    action: MODIFY
    reason: >-
      The 1997 cpp1 epistasis paper showed that deleting CEK1 suppresses the derepressed hyphal phenotype
      of cpp1 cells. That places Cek1 in the hyphal-growth pathway, but the narrower starvation-specific
      CEK1-null experiments came later, so this row should be generalized to filamentous growth.
    supported_by:
    - reference_id: PMID:9398674
      supporting_text: >-
        Disruption of the MAP kinase homologue CEK1 suppressed the morphological effects of the CPP1 disruption
        in C. albicans
    proposed_replacement_terms:
    - id: GO:0030447
      label: filamentous growth
- term:
    id: GO:0009267
    label: cellular response to starvation
  evidence_type: IMP
  original_reference_id: PMID:9596738
  qualifier: involved_in
  review:
    summary: >-
      The CEK1 deletion phenotype is a starvation-specific filamentation defect, not a generic starvation
      response.
    action: MODIFY
    reason: >-
      Direct CEK1-null experiments showed defective agar-invasive hyphal growth when nutrients were limiting
      on mannitol or under severe nitrogen limitation. GO:0036170 captures that starvation-induced filamentous-growth
      output more precisely than the broad cellular response to starvation parent.
    supported_by:
    - reference_id: PMID:9596738
      supporting_text: >-
        C. albicans cells with a deletion of the CEK1 gene are defective in shifting from a unicellular
        budding colonial growth mode to an agar-invasive hyphal growth mode when nutrients become limiting
    proposed_replacement_terms:
    - id: GO:0036170
      label: filamentous growth of a population of unicellular organisms in response to starvation
