- term:
    id: GO:0005575
    label: cellular_component
  evidence_type: ND
  original_reference_id: GO_REF:0000015
  qualifier: is_active_in
  review:
    summary: CGD no-data cellular-component placeholder.
    action: ACCEPT
    nd_case: INFERABLE
    reason: >-
      This root cellular-component ND row follows the evidence-code guideline:
      no literature on C. albicans ALG11 identifies a cellular component, and
      the ER-membrane rows are orthology/PAINT inferences rather than
      same-species localization data. PMID:42181501 directly perturbs
      C. albicans alg11 in colony biofilms, but its rheology and cell-wall
      phenotypes are downstream necessity evidence in the biological-process
      aspect and do not identify a cellular component for ALG11.
    additional_reference_ids:
    - PMID:42181501
    supported_by:
