id: Q59S72
gene_symbol: ALG11
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:237561
  label: Candida albicans SC5314
description: >-
  ALG11 encodes the Candida albicans ortholog of the conserved ALG11
  alpha-1,2-mannosyltransferase. It is a single-pass endoplasmic-reticulum
  membrane enzyme that uses GDP-mannose to add the fourth and fifth mannoses to
  Man3GlcNAc2-PP-dolichol on the cytoplasmic face of the ER, producing the
  Man5GlcNAc2-PP-dolichol intermediate in lipid-linked oligosaccharide
  assembly for protein N-linked glycosylation.
