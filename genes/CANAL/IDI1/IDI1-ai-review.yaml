taxon:
  id: NCBITaxon:237561
  label: Candida albicans SC5314
description: >-
  IDI1 encodes the Candida albicans type-I isopentenyl-diphosphate
  delta-isomerase, a soluble IPP isomerase that catalyzes the reversible
  conversion of isopentenyl diphosphate to dimethylallyl diphosphate in the
  mevalonate pathway. The product, dimethylallyl diphosphate, is the allylic
  primer for farnesyl diphosphate synthesis and therefore supplies ergosterol
  and other fungal isoprenoids.
