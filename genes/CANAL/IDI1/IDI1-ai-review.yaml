  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - AGI_LocusCode:AT5G16440
  - PANTHER:PTN000853999
  review:
    summary: >-
      IBA from the eukaryotic PTN000853999 type-I IPP-isomerase node, seeded
      for this process only by Arabidopsis IPP1. In fungal mevalonate-pathway
      flux, MVD produces IPP and IDI1 consumes IPP to make DMAPP.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      GO:0009240 describes the substrate rather than the product of the
      physiological IDI1 reaction in fungi; the accepted direct process is
      dimethylallyl diphosphate biosynthesis.
