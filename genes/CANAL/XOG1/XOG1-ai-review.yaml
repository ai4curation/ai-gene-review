    reason: >-
      Tsai et al. experimentally showed that recombinant Xog1p and an
      Xog1-derived peptide bind LL-37. LL-37 is a 37-residue mature cathelicidin
      antimicrobial peptide, so this is a peptide-binding activity rather than
      binding to a cell adhesion molecule.
