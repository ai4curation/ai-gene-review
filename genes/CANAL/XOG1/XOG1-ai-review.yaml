id: P29717
gene_symbol: XOG1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:237561
  label: Candida albicans SC5314
description: >-
  Candida albicans XOG1 encodes a secreted, cell-wall-associated glucan
  exo-1,3-beta-glucosidase of glycoside hydrolase family 5. Xog1 is the major
  exo-beta-1,3-glucanase activity in C. albicans, cleaves beta-1,3-glucans and
  beta-1,3-linked laminari-oligosaccharides with retention of configuration,
  and contributes to fungal cell wall beta-glucan remodeling, biofilm matrix
  glucan delivery, exposed beta-1,3-glucan shaving, and adhesion to abiotic and
  host-cell surfaces.
core_functions:
- description: >-
    Secreted and cell-wall-associated beta-1,3-glucan exoglucanase that removes
    glucose from the non-reducing ends of fungal beta-1,3-glucans; Xog1 is the
    dominant C. albicans exoglucanase and uses this activity in fungal-type cell
    wall beta-glucan metabolism.
  molecular_function:
    id: GO:0004338
    label: glucan exo-1,3-beta-glucosidase activity
  directly_involved_in:
  - id: GO:0070879
    label: fungal-type cell wall beta-glucan metabolic process
  - id: GO:0009251
    label: glucan catabolic process
  locations:
  - id: GO:0005576
    label: extracellular region
  - id: GO:0009986
    label: cell surface
  supported_by:
  - reference_id: PMID:9308184
    supporting_text: >-
      this gene is responsible for the major exoglucanase activity in C.
      albicans, although residual exoglucanase activity could still be detected
    reference_section_type: ABSTRACT
  - reference_id: PMID:10469155
    supporting_text: >-
      The exo-beta-1,3-glucanase of Candida albicans (Exg) has a marked
      specificity for beta-1,3-glucosidic linkages as judged by the kinetic
      constants for p-nitophenyl beta-glucoside, beta-linked disaccharides of
      glucose (laminaribiose, gentiobiose, and cellobiose), oligosaccharides of
      the laminari series, laminarin and pustulan.
    reference_section_type: ABSTRACT
  - reference_id: file:genes/CANAL/XOG1/XOG1-uniprot.txt
    supporting_text: "SUBCELLULAR LOCATION: Secreted, cell wall"
