id: Q59VG6
gene_symbol: ERG3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:237561
  label: Candida albicans SC5314
description: 'ERG3 encodes the Candida albicans Delta7-sterol 5(6)-desaturase, a multi-pass ER-membrane non-heme
  di-iron enzyme that introduces the C5=C6 double bond into episterol in late ergosterol biosynthesis. C. albicans
  erg3 loss abolishes C-5 desaturation, alters the sterol profile, confers azole resistance by preventing toxic
  14alpha-methyl-3,6-diol formation, and impairs hyphal growth and virulence.'
