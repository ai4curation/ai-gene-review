  review:
    summary: Plasma-membrane proteomics row from a C. albicans membrane-fraction survey; Erg3 is a polytopic
      ER-membrane sterol desaturase and the cached abstract does not directly identify ERG3 in the
      plasma-membrane fraction.
    action: MARK_AS_OVER_ANNOTATED
    reason: CGD curators had the full plasma-membrane proteomics paper and may have seen an Erg3 spectral
      assignment, but the cached abstract only states the study aim; without that full-text evidence, the
      plasma-membrane row is most likely a fraction carry-over from an ER-membrane enzyme.
    supported_by:
    - reference_id: PMID:19824013
      supporting_text: global picture of the protein composition of the C. albicans plasma membrane
