knowledge_gaps:
- gap_statement: Whether C. albicans Eaf3 physically associates with the
    Rco1/Rpd31-containing CaRpd31S deacetylase complex remains unresolved.
  boundary: PAINT supports fungal Eaf3/Rpd3S inheritance and the 2016 Candida
    study identified an Rco1/Rpd31 complex, but its initial Rpd3/Rpd31
    purifications did not recover Eaf3 or Rco1.
  gap_kind:
  - BIOLOGY
  dark_aspect: CC_DARK
  status: OPEN
  significance: Resolving Eaf3 membership would determine whether the
    C. albicans Rpd3S-like complex has retained the canonical fungal
    H3K36me-coupled Eaf3 reader module.
  resolution: Directly test Eaf3 association with tagged Rpd31 and Rco1 in
    yeast and hyphal growth conditions.
  provenance:
  - *candida_rpd3s_negative
suggested_experiments:
- hypothesis: C. albicans Eaf3 associates with Rco1 and Rpd31 in a
    CaRpd31S-like complex but was missed in the initial Rpd3/Rpd31 pulldowns.
  description: Tag Eaf3 at its endogenous locus and perform reciprocal
    co-immunoprecipitation or affinity purification with tagged Rco1 and Rpd31,
    followed by quantitative immunoblotting and mass spectrometry under yeast
    and hyphal induction conditions.
  experiment_type: reciprocal co-IP/AP-MS
