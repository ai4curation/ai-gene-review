taxon:
  id: NCBITaxon:237561
  label: Candida albicans SC5314
description: Eaf3 is a nuclear MRG-family chromatin protein in Candida
  albicans. It has an N-terminal Tudor-knot/chromo-like module and a
  C-terminal MRG interaction domain and belongs to the conserved fungal
  Eaf3/Alp13 branch that functions in NuA4 histone acetyltransferase complexes
  and Rpd3S-type histone deacetylase complexes, linking histone acetylation and
  deacetylation machinery to RNA polymerase II-associated chromatin regulation.
