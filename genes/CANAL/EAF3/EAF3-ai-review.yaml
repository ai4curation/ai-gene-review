gene_symbol: EAF3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:237561
  label: Candida albicans SC5314
description: Eaf3 is a nuclear MRG-family chromatin protein in Candida
  albicans. It belongs to the conserved fungal Eaf3/Alp13 branch that functions
  in NuA4 histone acetyltransferase complexes and Rpd3S-type histone
  deacetylase complexes, linking histone acetylation and deacetylation
  machinery to RNA polymerase II-associated chromatin regulation.
