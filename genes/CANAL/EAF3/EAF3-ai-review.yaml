  title: Efg1-mediated recruitment of NuA4 to promoters is required for hypha-specific
    Swi/Snf binding and activation in Candida albicans.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The cached extraction omits Table 4, but the paper's body and
      CGD's IDA row support conserved C. albicans NuA4 membership; Table 4 was
      checked manually and lists EAF3/orf19.2660 as the C. albicans ortholog of
      budding-yeast EAF3.
  findings:
  - statement: C. albicans contains a conserved NuA4 histone acetyltransferase
      complex and NuA4-dependent H4 acetylation supports activation of
      hypha-specific genes.
    supporting_text: H4 acetylation by the NuA4 complex is important for hyphal
      morphogenesis and the induction of hypha-specific genes
- id: PMID:27935838
  title: The Paralogous Histone Deacetylases Rpd3 and Rpd31 Play Opposing Roles in Regulating
    the White-Opaque Switch in the Fungal Pathogen Candida albicans.
  findings:
  - statement: C. albicans has a divergent Rpd3S-like complex in which Rpd31,
      rather than Rpd3, is the Rco1-associated histone deacetylase subunit.
    supporting_text: Rpd31 but not Rpd3 represents the HDAC component of the
      CaRpd31S regulatory complex
  - statement: The initial Candida Rpd3/Rpd31 pulldowns did not recover Eaf3 or
      Rco1, leaving Eaf3 association with the CaRpd31S complex unresolved.
    supporting_text: Of note, we were unable to identify the putative
      orthologues Eaf3 and Rco1 present in the Rpd3S complex.
