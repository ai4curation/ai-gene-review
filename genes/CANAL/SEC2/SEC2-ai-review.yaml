suggested_questions:
- question: >-
    How does S584 phosphorylation coordinate Sec2's vesicle localization,
    Spitzenkorper residence, and release of SEC2 mRNA during hyphal extension?
  experts: []
suggested_experiments:
- description: >-
    Assay purified Candida albicans Sec2 against Sec4 and other C. albicans Rab
    GTPases to confirm Sec4 as its physiological nucleotide-exchange substrate
    and to distinguish direct GEF activity from upstream vesicle recruitment.
