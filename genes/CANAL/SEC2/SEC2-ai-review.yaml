taxon:
  id: NCBITaxon:237561
  label: Candida albicans SC5314
description: >-
  Sec2 is the Candida albicans Sec2-family Rab guanine nucleotide exchange
  factor for the Sec4 Rab on post-Golgi secretory vesicles. It concentrates with
  Sec4 on secretory vesicles in the Spitzenkorper at hyphal tips, localizes to
  bud-neck and polarized pseudohyphal growth sites in other morphologies, and
  requires Cdc28-dependent phosphorylation at Ser584 to sustain Spitzenkorper
  localization and normal hyphal growth. It also physically associates with its
  own SEC2 mRNA on secretory vesicles, an interaction lost in an S584E
  phosphomimetic and therefore consistent with phospho-dependent mRNA release.
