- term:
    id: GO:0003729
    label: mRNA binding
  evidence_type: IDA
  original_reference_id: PMID:25231350
  qualifier: enables
  review:
    summary: Sec2p directly associates with its own SEC2 mRNA.
    action: NEW
    reason: >-
      Caballero-Lima et al. used SEC2 RIP enrichment and UV/oligo-dT RNA
      capture to show that Sec2p directly and selectively binds SEC2 mRNA. The
      binding is experimentally supported as an mRNA-binding molecular
      function, but it is left as a non-core annotation because the paper leaves
      open whether the interaction autoregulates Sec2p translation, reinforces
      Spitzenkorper localization, or releases Sec2p for recycling to the Golgi.
    supported_by:
    - reference_id: PMID:25231350
      supporting_text: >-
        Thus, Sec2p is associated only with its own encoding mRNA.
    - reference_id: PMID:25231350
      supporting_text: >-
        The results show that Sec2p, but not Gin4p, directly associates with
        mRNA
