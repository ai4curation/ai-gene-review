id: Q5AL49
gene_symbol: SEC2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:237561
  label: Candida albicans SC5314
description: SEC2 encodes the Candida albicans Sec2-family Rab guanine
  nucleotide exchange factor that promotes post-Golgi Sec4 vesicle traffic to
  polarized growth sites. Sec2 localizes to secretory vesicles and the
  Spitzenkorper during hyphal growth, and phosphorylation of Ser584 by the
  Cdc28-Hgc1/Ccn1 kinase system is required for stable Spitzenkorper
  localization and normal hyphal extension.
