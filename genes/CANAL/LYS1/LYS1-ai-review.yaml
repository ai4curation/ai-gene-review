    summary: >-
      PTN000123605 correctly places a broad saccharopine dehydrogenase
      activity on the eukaryotic SDH ancestor, but Candida LYS1 is in the exact
      NAD(+), L-lysine-forming fungal SF23 branch.
    action: MODIFY
    reason: >-
      PTN000123605 is a sound family-level PAINT node seeded by fungal LYS1,
      fungal LYS9, plant, animal, and Candida SDH-family members. The term is
      too generic for P43065 because the PANTHER member table places it in
      PTHR11133:SF23 with S. cerevisiae LYS1 and S. pombe lys3, all of which
      perform GO:0004754 rather than the reciprocal NADP(+),
      L-glutamate-forming reaction.
    proposed_replacement_terms:
