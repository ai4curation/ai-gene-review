id: P43065
gene_symbol: LYS1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:237561
  label: Candida albicans SC5314
description: >-
  LYS1 encodes the Candida albicans saccharopine dehydrogenase [NAD(+),
  L-lysine-forming], a soluble fungal alpha-aminoadipate-pathway enzyme that
  catalyzes the final L-lysine biosynthetic step. Lys1 cleaves
  L-saccharopine with NAD(+) and water to produce L-lysine, 2-oxoglutarate,
  NADH, and a proton. It is the Candida member of the fungal LYS1/lys3 branch
  of the saccharopine dehydrogenase family, distinct from the reciprocal
  NADP(+), L-glutamate-forming LYS9/lys9 branch.
