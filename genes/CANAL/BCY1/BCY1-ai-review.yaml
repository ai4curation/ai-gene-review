      direct Candida vacuolar-membrane pool is carbon-source-specific and
      already represented by an independent IDA row.
    action: REMOVE
    reason: >-
      Bcy1 is not a generic membrane protein; it is soluble and mainly
      cytosolic. A conditional subpopulation is enriched around the vacuolar
      membrane during growth on glycerol, but that specific location is already
      covered by the direct Candida vacuolar-membrane IDA annotation.
