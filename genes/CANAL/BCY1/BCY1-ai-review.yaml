- term:
    id: GO:0046580
    label: negative regulation of Ras protein signal transduction
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:P07278
  - sgd:YIL033C
  review:
    summary: >-
      Ensembl Compara transfer from S. cerevisiae to a Ras-signaling feedback
      term. Candida Bcy1's conserved direct role is downstream of Ras/Cyr1, as
      the PKA regulatory subunit required for cAMP responsiveness and for
      restraining Tpk catalytic activity before cAMP binding.
    action: MODIFY
    reason: >-
      In C. albicans, Ras1 stimulates Cyr1 upstream of the cAMP-PKA holoenzyme,
      while Bcy1 binds Tpk catalytic subunits to restrain PKA activity until
      cAMP binding releases them. The transferred Ras feedback term assigns
      Bcy1 to the wrong upstream process and should be replaced by cAMP/PKA
      signal transduction plus Bcy1's direct negative regulation of that
      pathway.
    proposed_replacement_terms:
    - id: GO:0141156
      label: cAMP/PKA signal transduction
    - id: GO:0141162
      label: negative regulation of cAMP/PKA signal transduction
    additional_reference_ids:
