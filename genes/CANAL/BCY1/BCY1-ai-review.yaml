    summary: >-
      PAINT places cAMP-dependent protein kinase inhibitor activity at the
      PTHR11635 root node PTN004280545. Bcy1 is the conserved regulatory
      subunit that keeps Candida PKA inactive until cAMP binding releases the
      Tpk catalytic subunits.
    action: ACCEPT
    reason: >-
      This is a correct core molecular function for Candida Bcy1 and is
      corroborated by C. albicans genetics and biochemistry: a bcy1 tpk2 mutant
      has constitutive cAMP-independent PKA activity, Bcy1 coimmunoprecipitates
      with Tpk1-GFP, and BCY1 overexpression suppresses filamentation in
      several hyphal-induction settings.
