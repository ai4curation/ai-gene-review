    - PMID:42506221
    supported_by:
    - reference_id: PMID:14871949
      supporting_text: >-
        protein kinase A activity in the bcy1 tpk2 mutant was independent of
        the presence of cAMP
    - reference_id: PMID:42506221
      supporting_text: >-
        Supporting this, overexpression of Bcy1 blocked iron-induced hyphal
        formation
