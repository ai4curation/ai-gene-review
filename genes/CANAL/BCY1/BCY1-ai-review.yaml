id: Q9HEW1
gene_symbol: BCY1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:237561
  label: Candida albicans SC5314
description: >-
  BCY1 encodes the sole Candida albicans regulatory subunit of cAMP-dependent
  protein kinase A. Bcy1 binds cAMP through two cyclic-nucleotide-binding
  domains and binds the Tpk1/Tpk2 catalytic subunits in the heterotetrameric PKA
  holoenzyme, thereby restraining catalytic kinase activity until cAMP binding
  releases active Tpk subunits. This regulation places Bcy1 downstream of
  Ras1/Cyr1-generated cAMP in control of cAMP-PKA signaling, filamentous
  growth, carbon-source responses, stress responses, and white-opaque switching.
  Functional Bcy1-GFP is predominantly cytosolic in glucose, can accompany
  Tpk2-containing holoenzyme to the vacuolar membrane in glycerol, and is
  recruited to cytoplasmic P-bodies and stress granules during heat stress.
