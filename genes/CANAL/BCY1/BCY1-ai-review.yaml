suggested_questions:
- question: >-
    Does C. albicans Bcy1 ever enter the nucleus in a narrow morphogenetic,
    stress, or cell-cycle window, or did the older nuclear-localization signal
    reflect allele dosage, tag behavior, or indirect inference from Tpk1-GFP?
- question: >-
    Which vacuolar-peripheral substrates, if any, are regulated by the
    glycerol-induced Tpk2-Bcy1 holoenzyme pool?
suggested_experiments:
- description: >-
    Image endogenous, fully functional Bcy1 together with nuclear markers across
    the glucose, glycerol, heat, salt, serum, and GlcNAc conditions used in the
    older and newer localization studies to resolve whether Bcy1 has a transient
    nuclear pool.
- description: >-
    Combine Tpk2 mutants that lose vacuolar recruitment with phosphoproteomics
    during glycerol growth to test whether the vacuolar Bcy1-Tpk2 holoenzyme
    regulates a local substrate set.
