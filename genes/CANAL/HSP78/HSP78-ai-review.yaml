suggested_questions:
  - question: >-
      Are there direct C. albicans HSP78 localization, deletion, or biochemical
      data, or does current support remain based on fungal Hsp78 orthology and
      PAINT?
suggested_experiments:
  - description: >-
      Delete C. albicans HSP78, follow matrix-targeted aggregation reporters
      after heat stress, and test whether an ATPase-dead Hsp78 variant fails to
      clear mitochondrial aggregates after recovery.
