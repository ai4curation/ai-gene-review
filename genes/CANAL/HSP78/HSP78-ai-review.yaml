id: Q96UX5
gene_symbol: HSP78
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:237561
  label: Candida albicans SC5314
description: >-
  HSP78 encodes the Candida albicans mitochondrial Hsp100/ClpB-family paralog
  of fungal Hsp78 disaggregases. The protein is predicted to be imported into
  the mitochondrial matrix and belongs to the same fungal Hsp78 PAINT clade as
  Saccharomyces cerevisiae HSP78, supporting a conserved role as an
  ATP-dependent disaggregase that resolubilizes and refolds heat-damaged
  mitochondrial proteins with the mitochondrial Hsp70 system.
