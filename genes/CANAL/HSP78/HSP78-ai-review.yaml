  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: involved_in
  supporting_entities:
  - ARBA:ARBA00027200
  review:
    summary: >-
      Protein folding is a reasonable chaperone parent, but protein refolding is
      the correct Hsp78-family process.
    action: MODIFY
    reason: >-
      Hsp78 proteins act on preformed mitochondrial aggregates, resolubilizing
      them so clients can refold with Hsp70-system support. The exact
      descendant term is already asserted by PAINT at the fungal Hsp78 node.
    proposed_replacement_terms:
      - id: GO:0042026
        label: protein refolding
    additional_reference_ids:
      - PMID:11734006
    supported_by:
      - reference_id: PMID:11734006
        supporting_text: >-
          Studies on the chaperone activity of Hsp78 show that its cooperation
          with the mitochondrial Hsp70 system, consisting of Ssc1p, Mdj1p and
          Mge1p, is needed for the efficient reactivation of substrate proteins.
