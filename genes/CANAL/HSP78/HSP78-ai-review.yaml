  - InterPro:IPR018368
  review:
    summary: >-
      C. albicans HSP78 has the conserved Hsp100/ClpB AAA+ ATPase domains that
      bind ATP during the disaggregase cycle.
    action: ACCEPT
    reason: >-
      The InterPro ATP-binding row is appropriate for the mitochondrial Hsp78
      paralog. The specific Candida protein has not been biochemically
      reconstituted, but the two-NBD AAA+ architecture is conserved across the
      fungal Hsp78 clade.
    additional_reference_ids:
      - PMID:11734006
    supported_by:
      - reference_id: PMID:11734006
        supporting_text: >-
          Analysis of its ATPase activity reveals that the observed positive
          cooperativity effect depends both on Hsp78 and ATP concentration.
