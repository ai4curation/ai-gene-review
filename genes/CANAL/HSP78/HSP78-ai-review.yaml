- id: PMID:7628444
  title: Hsp78, a Clp homologue within mitochondria, can substitute for chaperone
    functions of mt-hsp70.
  findings:
    - statement: >-
        S. cerevisiae Hsp78 binds newly imported polypeptides and prevents
        misfolded matrix proteins from aggregating when mitochondrial Hsp70 is
        impaired.
      supporting_text: >-
        hsp78 suppresses the defect in mitochondrial protein import under
        permissive conditions in vitro and interacts directly with newly
        imported polypeptide chains.
- id: PMID:8413229
  title: HSP78 encodes a yeast mitochondrial heat shock protein in the Clp family
    of ATP-dependent proteases.
  findings:
    - statement: >-
        S. cerevisiae Hsp78 is a soluble mitochondrial matrix ClpB/Hsp100-family
        protein.
      supporting_text: >-
        Submitochondrial fractionation showed that hsp78 is a soluble protein
        located in the mitochondrial matrix.
- id: PMID:8830768
  title: The molecular chaperone Hsp78 confers compartment-specific thermotolerance
    to mitochondria.
  findings:
    - statement: >-
        Hsp78 protects mitochondrial function during severe heat stress.
      supporting_text: >-
        Hsp78 is crucial for maintenance of respiratory competence and for
        mitochondrial genome integrity under severe temperature stress
        (mitochondrial thermotolerance).
- id: PMID:11734006
  title: Importance of two ATP-binding sites for oligomerization, ATPase activity
    and chaperone function of mitochondrial Hsp78 protein.
  findings:
    - statement: >-
        Purified S. cerevisiae Hsp78 forms ATP-dependent hexamers, has ATPase
        activity, and cooperates with the mitochondrial Hsp70 system to
        reactivate substrate proteins.
      supporting_text: >-
        Studies on the chaperone activity of Hsp78 show that its cooperation
        with the mitochondrial Hsp70 system, consisting of Ssc1p, Mdj1p and
        Mge1p, is needed for the efficient reactivation of substrate proteins.
- id: PMID:16460754
  title: The disaggregation activity of the mitochondrial ClpB homolog Hsp78 maintains
    Hsp70 function during heat stress.
  findings:
    - statement: >-
        Hsp78 has ATP-dependent mitochondrial protein-disaggregation activity
        and is required to resolubilize heat-induced matrix aggregates.
      supporting_text: >-
        Hsp78 is indispensable for the resolubilization of protein aggregates
        generated by heat stress under in vivo conditions.
