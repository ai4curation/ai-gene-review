knowledge_gaps:
- gap_statement: >-
    The subcellular localization and membrane topology of C. albicans Cyb5 have
    not been directly measured.
  boundary: >-
    PTHR19359:SF150 membership, conserved cytochrome-b5 architecture, and
    orthology to S. cerevisiae Cyb5 strongly support an ER/microsomal membrane
    assignment, but those are all transferred or inferred rather than direct
    C. albicans localization data.
  gap_kind:
  - BIOLOGY
  dark_aspect: CC_DARK
  status: OPEN
suggested_questions:
- question: >-
    Which C. albicans sterol oxygenases require Cyb5 as their physiological
    electron donor, and how much can Ncp1 compensate at Erg11, Erg25, Erg3 or
    Erg5 in vivo?
suggested_experiments:
- description: >-
    Reconstitute C. albicans Cyb5 with Cbr1, Ncp1 and individual sterol
    oxygenases, then compare wild-type and cyb5 deletion sterol intermediates
    under squalene-epoxidase, CYP51, C-4 methylsterol oxidase, C-5 desaturase
    and C-22 desaturase inhibition.
