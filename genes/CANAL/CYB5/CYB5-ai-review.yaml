taxon:
  id: NCBITaxon:237561
  label: Candida albicans SC5314
description: >-
  Candida albicans CYB5 encodes a small tail-anchored fungal microsomal
  cytochrome b5. It is predicted to bind heme through the conserved
  cytochrome-b5 domain and to sit in the endoplasmic reticulum or microsomal
  membrane with its heme domain on the cytosolic face. Direct C. albicans
  disruption experiments showed that CYB5 is nonessential but needed for normal
  ergosterol biosynthesis and wild-type azole tolerance, consistent with an
  electron-carrier role for sterol oxygenases.
