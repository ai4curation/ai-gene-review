id: Q5A3M6
gene_symbol: MCD4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:237561
  label: Candida albicans SC5314
description: >-
  MCD4 encodes the Candida albicans GPI ethanolamine phosphate transferase 1,
  an ER multipass membrane enzyme of the PTHR12250/PIGN family. CaMcd4
  complements S. cerevisiae mcd4 when native yeast MCD4 is repressed and is
  inferred to add phosphoethanolamine to the first mannose of GPI-anchor
  precursors during GPI-anchor biosynthesis.
