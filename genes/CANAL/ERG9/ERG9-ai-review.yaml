id: A0A1D8PI71
gene_symbol: ERG9
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:237561
  label: Candida albicans SC5314
description: >-
  ERG9 is the Candida albicans squalene synthase, an integral endoplasmic-reticulum
  membrane enzyme of the sterol pathway. It converts two farnesyl diphosphate molecules
  to squalene in an NAD(P)H-dependent reaction, providing the first committed sterol
  intermediate that is further converted through lanosterol to ergosterol.
