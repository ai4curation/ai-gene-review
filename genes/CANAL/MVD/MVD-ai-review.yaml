id: A0A1D8PC43
gene_symbol: MVD
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:237561
  label: Candida albicans SC5314
description: >-
  MVD encodes the cytosolic diphosphomevalonate decarboxylase of the mevalonate
  pathway. The enzyme ATP-dependently decarboxylates
  (R)-5-diphosphomevalonate to isopentenyl diphosphate, supplying the C5
  isoprenoid precursor used for ergosterol and other sterol and isoprenoid
  products. The C. albicans enzyme complements an S. cerevisiae erg19
  temperature-sensitive MVD mutant and belongs to the conserved fungal
  PTHR10977:SF3 diphosphomevalonate decarboxylase clade.
