  - UniProtKB:P53602
  review:
    summary: >-
      PTN000104601 cytosol inference inherited from characterized cytosolic MVD
      enzymes.
    action: ACCEPT
    reason: >-
      No C. albicans-specific localization experiment is cached. The PAINT
      cytosol node is seeded by mouse and human MVDs rather than a fungal MVD,
      but cytosol inheritance is consistent with direct S. pombe and S.
      cerevisiae localization of soluble fungal MVD enzymes. The UniProt
      FUNCTION record's vacuole sentence is the same review-level
      pathway-compartment statement flagged as weak for S. cerevisiae MVD1/ERG19,
      not a direct Candida MVD localization assay.
    supported_by:
