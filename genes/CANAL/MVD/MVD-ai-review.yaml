gene_symbol: MVD
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:237561
  label: Candida albicans SC5314
description: MVD (CAALFM_C100070WA, orf19.6105; also called MVD1 or ERG19) encodes the Candida
  albicans diphosphomevalonate decarboxylase (EC 4.1.1.33), a 362-residue member of the GHMP
  superfamily. The enzyme uses ATP to phosphorylate and decarboxylate (R)-5-diphosphomevalonate,
  releasing isopentenyl diphosphate (IPP), ADP, phosphate and CO2. This is the last step of the
  mevalonate pathway and supplies the C5 unit for ergosterol and for non-sterol isoprenoids such as
  dolichol, ubiquinone and prenyl groups. MVD is a single-copy gene on chromosome 1 with one small
  intron. A single copy of C. albicans MVD fully rescues a temperature-sensitive S. cerevisiae erg19
  mutant, and conditional shut-off strains indicate that the gene is needed for growth and virulence
  in a mouse infection model. Its transcript level varies with carbon source, growth phase and the
  yeast or hyphal growth form, and rises on exposure to amphotericin B. Its subcellular location has
  not been determined in C. albicans; the characterised yeast ortholog is a soluble cytoplasmic
  homodimer.
