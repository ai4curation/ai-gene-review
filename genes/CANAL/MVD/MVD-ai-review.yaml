suggested_questions:
- question: Where is C. albicans MVD located? UniProt's narrative places the middle ergosterol module in
    the vacuole, a GFP survey scores the S. cerevisiae ortholog as cytoplasmic, and an overexpressed
    DsRed fusion of the A. oryzae ortholog is vacuolar. Does the endogenous, chromosomally tagged
    Candida protein localize to the cytosol, and does its location change between yeast and hyphal
    growth?
- question: Dassanayake et al. described minimal identity between C. albicans and human MVD, whereas a
    2025 comparison reports about 47% identity over 96% of the sequence. Is the active site divergent
    enough for fungal-selective inhibitors of this in vivo-essential enzyme?
suggested_experiments:
- hypothesis: C. albicans MVD is a cytosolic enzyme in both yeast and hyphal cells.
  description: Tag MVD at its chromosomal locus with a C-terminal fluorescent protein expressed from the
    native promoter, check that the fusion supports growth as the only copy, and image it with cytosolic,
    vacuolar (CMAC or FM4-64) and peroxisomal markers in yeast and hyphal cells; confirm by subcellular
    fractionation with organelle marker immunoblots.
  experiment_type: localization
- hypothesis: Purified C. albicans MVD has diphosphomevalonate decarboxylase kinetics comparable to
    the S. cerevisiae enzyme.
  description: Express His-tagged C. albicans MVD in E. coli, purify it, and measure kcat and Km for
    (R)-5-diphosphomevalonate and ATP with a coupled ADP-release assay, alongside S. cerevisiae Mvd1 and
    human MVD to compare inhibitor sensitivity.
  experiment_type: enzyme kinetics
