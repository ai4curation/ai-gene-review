id: Q5A1B0
gene_symbol: ERG26
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:237561
  label: Candida albicans SC5314
description: ERG26 encodes the Candida albicans sterol-4-alpha-carboxylate 3-dehydrogenase/C-4 decarboxylase,
  an NAD(P)-dependent 3-beta-HSD-family enzyme of the ER-membrane C-4 demethylation complex. It catalyzes the
  oxidative decarboxylation of 4-alpha-carboxysterols to 3-keto sterol intermediates during the two C-4 demethylation
  rounds of ergosterol biosynthesis. C. albicans ERG26 complements the Saccharomyces cerevisiae erg26 mutant and
  is essential for growth under the tested laboratory conditions.
