description: ALG14 is the ER membrane-anchor subunit of the Alg13/Alg14 UDP-GlcNAc 
  transferase complex. It recruits the soluble catalytic Alg13 subunit to the 
  cytoplasmic face of the ER membrane, enabling the second step of dolichol-linked 
  oligosaccharide assembly during protein N-glycosylation.
