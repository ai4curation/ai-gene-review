- term:
    id: GO:0044011
    label: single-species biofilm formation on inanimate substrate
  evidence_type: IMP
  original_reference_id: PMID:22635920
  qualifier: involved_in
  review:
    summary: >-
      C. albicans hsp104 mutants have a reproducible in vitro biofilm maturation
      defect.
    action: KEEP_AS_NON_CORE
    reason: >-
      HSP104 loss impaired mature biofilm formation on two abiotic surfaces
      without measurably impairing initial adhesion, so this is an experimentally
      supported Candida-specific process. It should be kept as non-core because
      the likely molecular contribution is indirect proteostasis during stress
      rather than a dedicated adhesin or matrix-building activity.
    supported_by:
      - reference_id: PMID:22635920
        supporting_text: >-
          biofilm formation by cells lacking HSP104 proved to be defective in two
          established in vitro models that use polystyrene and polyurethane as
          the substrates.
