- term:
    id: GO:0006457
    label: protein folding
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: involved_in
  supporting_entities:
  - ARBA:ARBA00027200
  review:
    summary: >-
      The ARBA assertion captures the Hsp104 chaperone pathway, but the more
      precise process is protein refolding rather than de novo protein folding.
    action: MODIFY
    reason: >-
      Hsp104-family disaggregases act after proteins have misfolded and
      aggregated; they solubilize aggregates so Hsp70/Hsp40 can refold the
      liberated clients. The C. albicans protein reactivates heat-denatured
      proteins in an S. cerevisiae hsp104 mutant, so GO:0042026 is the better
      process term.
    proposed_replacement_terms:
      - id: GO:0042026
        label: protein refolding
    additional_reference_ids:
      - PMID:16467463
    supported_by:
      - reference_id: PMID:16467463
        supporting_text: >-
          CaHsp104 is able to provide all known functions of ScHsp104 in an S.
          cerevisiae hsp104 null mutant, i.e., tolerance to high-temperature
          stress, reactivation of heat-denatured proteins, and propagation of the
          [PSI+] prion.
- term:
    id: GO:0009986
    label: cell surface
  evidence_type: IDA
  original_reference_id: PMID:12543933
  qualifier: located_in
  review:
    summary: >-
      HSP104 was annotated by CGD from a C. albicans cell-wall proteomics paper,
      but only the abstract is cached and it does not expose the HSP104 peptide
      assignment.
    action: UNDECIDED
    reason: >-
      Molecular chaperones can appear among fungal cell-surface moonlighting
      proteins, but HSP104's primary function is cytosolic disaggregation. The
      cached PMID:12543933 abstract reports mass-spectrometric identification of
      proteins classically associated with the cell wall and other compartments
      but does not show whether HSP104 was confidently assigned or surface
      exposed. Defer to CGD's full-text curation pending a direct check of the
      complete paper.
    supported_by:
      - reference_id: PMID:12543933
        supporting_text: >-
          Mass spectrometry analyses have allowed the identification of several
          cell surface proteins classically associated with both the cell wall
          and other compartments.
