- id: PMID:16467463
  title: The [PSI+] prion of Saccharomyces cerevisiae can be propagated by an Hsp104
    orthologue from Candida albicans.
  findings:
    - statement: >-
        C. albicans CaHsp104 is a stress-inducible Hsp104 ortholog that
        complements S. cerevisiae hsp104 for high-temperature tolerance,
        heat-denatured protein reactivation, and PSI+ prion propagation.
      supporting_text: >-
        CaHsp104 is able to provide all known functions of ScHsp104 in an S.
        cerevisiae hsp104 null mutant, i.e., tolerance to high-temperature
        stress, reactivation of heat-denatured proteins, and propagation of the
        [PSI+] prion.
- id: PMID:21209325
  title: Identification of sumoylation targets, combined with inactivation of SMT3,
    reveals the impact of sumoylation upon growth, morphology, and stress resistance
    in the pathogen Candida albicans.
  findings:
    - statement: >-
        Hsp104 is a C. albicans sumoylation target, and mutating its consensus
        SUMO site affected thermal-stress resistance.
      supporting_text: >-
        Mutation of consensus sumoylation sites in Hsp60 and Hsp104 affected
        the resistance of C. albicans to thermal stress.
- id: PMID:22635920
  title: The heat-induced molecular disaggregase Hsp104 of Candida albicans plays
    a role in biofilm formation and pathogenicity in a worm infection model.
  findings:
    - statement: >-
        C. albicans hsp104/hsp104 mutants are heat sensitive, and HSP104
        reintegration restores thermotolerance.
      supporting_text: >-
        Mutants lacking HSP104 became hypersusceptible to lethally high
        temperatures, similarly to the corresponding mutants of Saccharomyces
        cerevisiae, whereas normal susceptibility was restored upon
        reintroduction of the gene.
    - statement: >-
        HSP104 expression before lethal heat shock is sufficient to confer extra
        thermal protection.
      supporting_text: >-
        Turning on expression of HSP104 prior to administration of the heat shock
        resulted in cells acquiring a greater thermotolerance with respect to
        cells of the wild-type strain
    - statement: >-
        HSP104 loss impairs mature C. albicans biofilm formation on abiotic
        surfaces.
      supporting_text: >-
        biofilm formation by cells lacking HSP104 proved to be defective in two
        established in vitro models that use polystyrene and polyurethane as the
        substrates.
- id: PMID:28375147
  title: Crystal structures of Hsp104 N-terminal domains from Saccharomyces cerevisiae
    and Candida albicans suggest the mechanism for the function of Hsp104 in dissolving
    prions.
  findings:
    - statement: >-
        The Candida Hsp104 N-terminal domain has a conserved putative
        peptide-binding groove in the structural region used by Hsp104 to engage
        misfolded clients.
      supporting_text: >-
        The structures of ScHsp104NTD and CaHsp104NTD reveal that the yeast
        Hsp104 NTD may utilize a conserved putative peptide-binding groove to
        interact with misfolded polypeptides.
