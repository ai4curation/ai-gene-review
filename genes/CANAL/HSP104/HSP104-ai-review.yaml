gene_symbol: HSP104
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:237561
  label: Candida albicans SC5314
description: >-
  HSP104 encodes the cytosolic Candida albicans Hsp100/ClpB-family AAA+
  chaperone that resolves heat-damaged protein aggregates and supports induced
  thermotolerance. The protein is stress inducible, can functionally substitute
  for Saccharomyces cerevisiae Hsp104 in aggregate reactivation and prion
  propagation assays, and is required in C. albicans for efficient survival of
  lethal heat stress. Loss of HSP104 also compromises in vitro biofilm maturation
  and attenuates virulence in a room-temperature Caenorhabditis elegans
  infection model, consistent with a Candida-specific deployment of the
  conserved disaggregase during host-associated stress.
