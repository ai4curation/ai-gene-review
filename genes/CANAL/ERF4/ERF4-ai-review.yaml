suggested_questions:
- question: >-
    Has C. albicans ERF4 retained an ER-localized Erf2 complex, or does its
    complex localize like the fission-yeast Golgi/cell-periphery Erf2-Erf4
    pool?
suggested_experiments:
- experiment_type: endogenous ERF4 localization
  hypothesis: C. albicans Erf4 localizes with Erf2 at the endoplasmic reticulum.
  description: >-
    Fluorescently tag ERF4 and its predicted ERF2 catalytic partner at the
    native loci and score colocalization with ER and Golgi markers during yeast
    and hyphal growth.
