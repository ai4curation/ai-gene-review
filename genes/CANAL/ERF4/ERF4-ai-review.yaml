  label: Candida albicans SC5314
description: >-
  ERF4 encodes the Candida albicans ortholog of S. cerevisiae Shr5/Erf4, the
  accessory subunit of the Erf2 Ras palmitoyltransferase complex. GOA currently
  represents the gene by orthology and PAINT transfer from budding-yeast Erf4;
  this is consistent with a conserved Saccharomycotina ER-localized
  palmitoyltransferase-complex role.
