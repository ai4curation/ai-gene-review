- term:
    id: GO:0030447
    label: filamentous growth
  evidence_type: IMP
  original_reference_id: PMID:16079341
  qualifier: involved_in
  review:
    summary: >-
      CHS7 loss directly alters hyphal and colony morphology, but the
      filamentous-growth phenotype is downstream of the cell-wall chitin defect.
    action: KEEP_AS_NON_CORE
    reason: >-
      Keep as non-core. The chs7 null grows and undergoes the yeast-to-hypha
      transition, but its hyphae are curved with irregular lateral walls and
      generate compact colonies; this captures a real cell-wall morphogenesis
      phenotype rather than the core ER export-chaperone activity.
    supported_by:
    - reference_id: PMID:16079341
      supporting_text: >-
        However, colony morphology appeared distinctively affected.
        chs7Delta hyphae were very curved and had irregular lateral walls,
        resulting in very compact colonies that seemed unable to spread out
        radially on the surface, unlike the wild-type.
