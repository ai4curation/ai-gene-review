- term:
    id: GO:0030447
    label: filamentous growth
  evidence_type: IMP
  original_reference_id: PMID:16079341
  qualifier: involved_in
  review:
    summary: >-
      Filamentous growth is a supported downstream phenotype of C. albicans
      chs7 deletion rather than the direct export-chaperone role of CHS7.
    action: KEEP_AS_NON_CORE
    reason: >-
      Keep as non-core. The abstract reports increased filamentation,
      abnormal curved hyphae, and defective colony spreading in chs7 null
      strains, so the annotation is experimentally grounded. The core CHS7
      function, however, is CHS3/chitin synthase III biogenesis; the
      filamentous-growth defects are downstream morphogenetic consequences of
      impaired wall chitin synthesis. This row and the GO:0044182 row record
      the same IMP phenotype from the same paper at two granularities;
      GO:0044182 is the more specific population-level term.
    supported_by:
    - reference_id: PMID:16079341
      supporting_text: >-
        yeast cells displayed minor morphogenetic defects affecting septum
        formation, and showed an increased tendency to form filaments
    - reference_id: PMID:16079341
      supporting_text: >-
        chs7Delta hyphae were very curved and had irregular lateral walls,
        resulting in very compact colonies that seemed unable to spread out
        radially on the surface, unlike the wild-type.
- term:
    id: GO:0044182
    label: filamentous growth of a population of unicellular organisms
  evidence_type: IMP
  original_reference_id: PMID:16079341
  qualifier: involved_in
  review:
    summary: >-
      The population-level filamentous-growth row captures the abnormal
      filamentous colony morphology of C. albicans chs7 mutants but is
      secondary to the CHS3 export and chitin-synthesis defect.
    action: KEEP_AS_NON_CORE
    reason: >-
      Keep as non-core. PMID:16079341 reports that chs7 null cells can still
      initiate germ tubes and the dimorphic transition, but produce compact
      colonies with very curved hyphae and irregular lateral walls. That
      supports a role in normal hyphal population morphology while placing the
      process downstream of the core CHS7-dependent chitin synthase III
      pathway. The positive population-growth row is therefore grounded in
      abnormal hyphal and colony morphology, distinct from the GO:1900429
      negative-regulation row that records the increased filamentation of chs7
      null yeast cells.
    supported_by:
    - reference_id: PMID:16079341
      supporting_text: >-
        chs7Delta hyphae were very curved and had irregular lateral walls,
        resulting in very compact colonies that seemed unable to spread out
        radially on the surface, unlike the wild-type.
