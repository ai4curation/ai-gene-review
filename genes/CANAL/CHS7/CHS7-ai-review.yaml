- id: PMID:16079341
  title: Candida albicans strains deficient in CHS7, a key regulator of chitin synthase
    III, exhibit morphogenetic alterations and attenuated virulence.
  full_text_unavailable: true
  findings:
  - statement: Most C. albicans chitin synthesis depends on CHS7.
    supporting_text: >-
      most chitin synthesis in Candida albicans, one of the fungi most
      commonly isolated from opportunistic mycoses and infections, depends on
      CHS7
    full_text_unavailable: true
  - statement: C. albicans chs7 null mutants have reduced chitin content and
      chitin synthase activity.
    supporting_text: >-
      C. albicans chs7Delta null mutants showed reduced levels of chitin and
      CS activity, and were resistant to Calcofluor
    full_text_unavailable: true
  - statement: C. albicans CHS7 is related to S. cerevisiae CHS7 but is
      specialized enough that it cannot export S. cerevisiae Chs3p.
    supporting_text: >-
      Despite the sequence similarity and functional relationship with
      ScChs7p, CaChs7p was unable to restore CSIII activity in a
      Saccharomyces cerevisiae chs7Delta null mutant, because it was unable to
      direct ScChs3p export from the endoplasmic reticulum.
    full_text_unavailable: true
  - statement: C. albicans chs7 null mutants have septation and filamentation
      phenotypes.
    supporting_text: >-
      C. albicans chs7Delta null mutants did not show any defect in growth
      rate, but yeast cells displayed minor morphogenetic defects affecting
      septum formation, and showed an increased tendency to form filaments.
    full_text_unavailable: true
  - statement: The C. albicans chs7 null mutant has abnormal hyphal morphology.
    supporting_text: >-
      chs7Delta hyphae were very curved and had irregular lateral walls,
      resulting in very compact colonies that seemed unable to spread out
      radially on the surface, unlike the wild-type.
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed/cached-abstract metadata were verified; the abstract
      directly supports the chitin-synthesis and hyphal-morphogenesis evidence
      used here, but the cached publication is abstract-only.
- id: PMID:17559412
  title: Promoter heterozygosity at the Candida albicans CHS7 gene is translated
    into differential expression between alleles.
  full_text_unavailable: true
  findings:
  - statement: Natural promoter heterozygosity changes the contribution of the two
      CHS7 alleles to total CaCHS7 mRNA.
    supporting_text: >-
      Both alleles are expressed in the wild type and contribute to the total
      levels of the CaCHS7 mRNA.
    full_text_unavailable: true
  - statement: Reduced expression from the lower-output CHS7 promoter allele is
      associated with reduced chitin and moderate hypha-inducing-medium
      morphogenesis defects.
    supporting_text: >-
      The HeteroL strain showed reduced levels of chitin, a partial resistance
      to calcofluor, and a moderate degree of morphogenetic alterations in
      hypha-inducing media.
    full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed/cached-abstract metadata were verified; this paper is a
      CHS7-specific follow-up that supports the CHS7 dosage, chitin, and
      morphogenesis link but does not add a separate GO function.
