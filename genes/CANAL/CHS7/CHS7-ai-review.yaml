proposed_new_terms:
- proposed_name: chitin synthase export chaperone activity
  proposed_definition: >-
    A protein folding chaperone activity that binds or escorts a chitin synthase
    client in the endoplasmic reticulum to promote its productive folding, ER
    quality-control evasion, and export toward the Golgi.
  justification: >-
    C. albicans CHS7, S. cerevisiae CHS7, and N. crassa csc-1 all support a
    client-biased export factor for class IV chitin synthases rather than a
    generic unfolded-protein binder; GO:0044183 is correct but could be refined
    by a child term for this dedicated CHS7-family activity.
  proposed_parent:
    id: GO:0044183
    label: protein folding chaperone
  supported_by:
  - reference_id: PMID:39926406
    supporting_text: >-
      These proteins function as specialized chaperones that prevent the
      aggregation of PM proteins at the ER by ensuring proper folding
suggested_questions:
- question: >-
    Does C. albicans Chs7 physically bind CaChs3 and travel with it beyond the
    ER, as S. cerevisiae Chs7 does?
- question: >-
    Does the naturally weak CHS7 L promoter sensitize specific clinical
    isolates to wall stress by limiting CaChs7-dependent Chs3 export?
suggested_experiments:
- hypothesis: C. albicans Chs7 directly promotes Chs3 folding and ER export.
  description: >-
    Image functional CaChs3-GFP and CaChs7-mCherry expressed from their native
    loci in wild-type, chs7-null, and CHS7 rescue strains; combine this with
    Chs3 co-immunoprecipitation and detergent-solubility assays to distinguish
    client aggregation from a post-folding export block.
  experiment_type: chitin-synthase client-folding and ER-export assay
- hypothesis: >-
    The CHS7 S/L promoter polymorphism controls chitin synthase III output by
    making CaChs7 limiting for CaChs3 export.
  description: >-
    Swap the S and L promoter alleles at the native CHS7 locus, then measure
    CaChs7 abundance, CaChs3 ER retention, chitin synthase III activity, wall
    chitin, and hyphal colony morphology under basal and wall-stress
    conditions.
  experiment_type: promoter-allele dosage assay
