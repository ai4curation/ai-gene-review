description: >-
  Candida albicans CHS7 encodes a seven-transmembrane endoplasmic-reticulum
  membrane protein in the conserved fungal CHS7 family. CaChs7 supports
  CHS3-dependent chitin synthase activity and cell-wall chitin production,
  consistent with an orthologous client-specific chitin synthase export
  chaperone role that promotes Chs3 biogenesis and ER-to-Golgi transport.
