    label: chitin biosynthetic process
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - CGD:CAL0000175393
  - PANTHER:PTN002175570
  - SGD:S000001184
  review:
    summary: >-
      The chitin biosynthetic process IBA is supported by the current
      PTN002175570 PAINT placement and by direct C. albicans chs7 deletion
      evidence for reduced chitin and chitin synthase activity.
    action: ACCEPT
    reason: >-
      Accept as a core biological-process annotation. Candida CHS7 does not
      catalyze chitin polymerization itself, but it performs a required,
      pathway-intrinsic chaperone/export step for CHS3-dependent chitin
      synthase III function. PAINT now places GO:0006031 at the fungal
      CHS7-family ancestor with both C. albicans and S. cerevisiae CHS7 as
      seeds, and the Candida deletion phenotype directly supports a loss of
      chitin synthesis output.
    supported_by:
    - reference_id: PMID:16079341
      supporting_text: >-
        most chitin synthesis in Candida albicans, one of the fungi most
        commonly isolated from opportunistic mycoses and infections, depends
        on CHS7
    - reference_id: PMID:16079341
      supporting_text: >-
        C. albicans chs7Delta null mutants showed reduced levels of chitin and
        CS activity, and were resistant to Calcofluor
