  review:
    summary: >-
      The chitin-biosynthesis IBA is supported by the conserved PTN002175570
      node and by direct C. albicans chs7-null reductions in chitin synthase
      activity and cell-wall chitin.
    action: ACCEPT
    reason: >-
      Accept as a core biological process. CHS7 is not the polymerizing chitin
      synthase, but a client-specific CHS3 export/folding factor directly does
      work needed for the biosynthetic route: it allows the class IV chitin
      synthase to exit the ER and produce most wall chitin. CGD:CAL0000175393
