id: Q5AA40
gene_symbol: CHS7
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:237561
  label: Candida albicans SC5314
description: >-
  CHS7 encodes a CHS7-family multipass membrane chaperone that supports normal
  Chs3-dependent chitin synthase III activity and cell-wall chitin production
  in Candida albicans. By homology with Saccharomyces cerevisiae CHS7 and
  Neurospora crassa csc-1/CSE-7, the protein is inferred to act at the
  endoplasmic reticulum membrane as a client-biased export chaperone for the
  class IV chitin synthase.
