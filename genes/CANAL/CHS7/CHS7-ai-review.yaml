- term:
    id: GO:1900429
    label: negative regulation of filamentous growth of a population of unicellular
      organisms
  evidence_type: IMP
  original_reference_id: PMID:16079341
  qualifier: involved_in
  review:
    summary: >-
      The negative regulation of population-level filamentous growth row is
      consistent with the increased filamentation of chs7 null cells but is a
      non-core morphogenesis phenotype.
    action: KEEP_AS_NON_CORE
    reason: >-
      Keep as non-core. The abstract reports that chs7 null yeast cells show
      an increased tendency to form filaments, supporting the negative
      regulatory sign assigned by CGD. That increased yeast-cell filamentation
      is distinct from the compact-colony and curved-hypha morphology behind
      the positive GO:0044182 population-level row. Both phenotypes are still
      secondary to the core CHS3 export/chitin synthase III defect, so neither
      should be treated as the primary function of CHS7.
