- term:
    id: GO:0030447
    label: filamentous growth
  evidence_type: IMP
  original_reference_id: PMID:16079341
  qualifier: involved_in
  review:
    summary: >-
      Candida chs7 mutants have altered hyphal morphology, but filamentous
      growth is a downstream morphology phenotype rather than the core Chs7
      activity.
    action: KEEP_AS_NON_CORE
    reason: >-
      Sanz et al. reported that chs7 null-mutant hyphae were highly curved with
      irregular lateral walls and compact colony morphology. This supports a
      relationship to filamentous growth, while the abstract also says Chs7 was
      not required for germ-tube emission or the yeast-to-hypha transition, so
      the row should remain non-core.
    supported_by:
    - reference_id: PMID:16079341
      supporting_text: chs7Delta hyphae were very curved
    - reference_id: PMID:16079341
      supporting_text: null mutant strains underwent the dimorphic transition correctly
