- id: PMID:16079341
  title: Candida albicans strains deficient in CHS7, a key regulator of chitin synthase
    III, exhibit morphogenetic alterations and attenuated virulence.
  full_text_unavailable: true
  findings:
  - statement: C. albicans CHS7 is required for most cell-wall chitin synthesis.
    supporting_text: >-
      most chitin synthesis in Candida albicans, one of the fungi most
      commonly isolated from opportunistic mycoses and infections, depends on
      CHS7.
    full_text_unavailable: true
  - statement: C. albicans chs7 null mutants have reduced chitin synthase activity and
      reduced chitin.
    supporting_text: >-
      C. albicans chs7Delta null mutants showed reduced levels of chitin and
      CS activity, and were resistant to Calcofluor.
    full_text_unavailable: true
  - statement: C. albicans CHS7 is functionally related to S. cerevisiae CHS7 but does
      not export S. cerevisiae Chs3 in a cross-species rescue test.
    supporting_text: >-
      Despite the sequence similarity and functional relationship with
      ScChs7p, CaChs7p was unable to restore CSIII activity in a
      Saccharomyces cerevisiae chs7Delta null mutant, because it was unable
      to direct ScChs3p export from the endoplasmic reticulum.
    full_text_unavailable: true
  - statement: Loss of CHS7 causes yeast-cell and hyphal-colony morphology defects.
    supporting_text: >-
      chs7Delta hyphae were very curved and had irregular lateral walls,
      resulting in very compact colonies that seemed unable to spread out
      radially on the surface, unlike the wild-type.
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed and the cached abstract were verified. The cache is abstract-only,
      but the abstract directly supports the CHS7 deletion chitin-synthesis and
      morphogenesis evidence used here.
- id: PMID:17559412
  title: Promoter heterozygosity at the Candida albicans CHS7 gene is translated into
    differential expression between alleles.
  full_text_unavailable: true
  findings:
  - statement: Both CHS7 alleles contribute to wild-type C. albicans CHS7 expression.
    supporting_text: >-
      Both alleles are expressed in the wild type and contribute to the total
      levels of the CaCHS7 mRNA.
    full_text_unavailable: true
  - statement: The CHS7 L allele drives lower transcription than the S allele.
    supporting_text: >-
      the presence of this region in the promoter (L allele) significantly
      reduced the transcription of the gene as compared with its absence (S
      allele).
    full_text_unavailable: true
  - statement: Reduced CHS7 expression in heterozygous strains can reduce chitin and
      alter hypha-induced morphology.
    supporting_text: >-
      The HeteroL strain showed reduced levels of chitin, a partial resistance
      to calcofluor, and a moderate degree of morphogenetic alterations in
      hypha-inducing media.
    full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed and the cached abstract were verified. This is a direct CHS7
      expression-regulation follow-up, not a new molecular-mechanism paper.
