- term:
    id: GO:0000128
    label: flocculation
  evidence_type: IMP
  original_reference_id: PMID:16079341
  qualifier: involved_in
  review:
    summary: >-
      The C. albicans chs7 deletion directly causes altered wall and colony
      morphology, but the abstract-only cache does not expose the flocculation
      assay behind CGD's row.
    action: UNDECIDED
    reason: >-
      Leave undecided. The cached Sanz et al. record is abstract-only and
      documents chitin depletion, minor septation defects, increased
      filamentation, and compact abnormal colonies, but it does not mention
      flocculation. Because CGD also curates a same-paper
      GO:0060257 negative-regulation row, the underlying full text is needed to
      verify both the assay and its direction before retaining this annotation.
    supported_by:
    - reference_id: PMID:16079341
      supporting_text: >-
        C. albicans chs7Delta null mutants did not show any defect in growth
        rate, but yeast cells displayed minor morphogenetic defects affecting
        septum formation, and showed an increased tendency to form filaments.
- term:
    id: GO:0003674
    label: molecular_function
  evidence_type: ND
  original_reference_id: GO_REF:0000015
  qualifier: enables
  review:
    summary: >-
      The no-data molecular-function placeholder is stale now that the current
      PAINT family records assert protein folding chaperone at the fungal CHS7
      node.
    action: ACCEPT
    reason: >-
      No literature on this gene product, in this species, identifies a function in this
      aspect, so the ND follows the evidence-code guideline and is accepted
      (projects/NO_DATA.md). Inferred rows in the same aspect do not make it stale.
      Earlier action REMOVE, because: Remove the ND placeholder. Q5AA40 is a
      PTHR35329:SF2 CHS7-family protein, the current PTN002175570 PAINT ancestor carries
      the molecular function GO:0044183 protein folding chaperone, and the Candida null
      mutant has the expected loss of Chs3-dependent chitin synthase output. The local
      GOA snapshot is therefore missing a specific CHS7-family molecular-function
      annotation rather than reflecting an absence of functional knowledge.
    nd_case: INFERABLE
