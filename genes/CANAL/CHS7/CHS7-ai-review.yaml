suggested_questions:
- question: >-
    Does C. albicans Chs7 directly bind and export CaChs3, and which
    CaChs3-specific surfaces explain the inability of CaChs7 to export the
    S. cerevisiae Chs3 client?
  experts: []
- question: >-
    What specific full-text flocculation assays underlie CGD's flocculation and
    negative-regulation annotations for PMID:16079341?
  experts: []
suggested_experiments:
- hypothesis: >-
    CaChs7 promotes C. albicans Chs3 ER export as a species-tuned client
    chaperone whose substrate recognition differs from S. cerevisiae Chs7.
  description: >-
    Tag endogenous CaChs3 and CaChs7 in wild-type, chs7Delta, and cross-species
    complementation strains, then combine ER-export microscopy,
    co-immunoprecipitation, and chitin synthase activity assays to map the Chs3
    surfaces that depend on CaChs7.
  experiment_type: client-mapping and ER-export assay
