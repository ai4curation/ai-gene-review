taxon:
  id: NCBITaxon:237561
  label: Candida albicans SC5314
description: >-
  Candida albicans ERG25 encodes the ER-membrane C-4 methylsterol oxidase of
  the sterol desaturase family. The enzyme carries the conserved histidine
  clusters of non-heme di-iron oxygenases and catalyzes the oxygen-dependent
  C-4 methyl oxidations in the ergosterol pathway. ERG25 is essential in C.
  albicans, and the C-terminal ER-retrieval signal and orthology to
  Saccharomyces cerevisiae Erg25 support an ER-resident C-4 demethylation role.
