    reason: >-
      Vma8 is a V1-sector subunit by conserved family membership and
      S. cerevisiae experimental evidence. The claim should therefore be kept,
      but the UniProt ISS donor P16140 is the S. cerevisiae VMA2/subunit B
      record rather than the VMA8/subunit D ortholog P32610, so the source
      should be repointed upstream.
