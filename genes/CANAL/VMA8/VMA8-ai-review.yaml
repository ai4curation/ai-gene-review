- term:
    id: GO:0045121
    label: membrane raft
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: located_in
  supporting_entities:
  - UniProtKB:P32610
  - sgd:YEL051W
  review:
    summary: >-
      Likely over-propagated from a condition-specific S. cerevisiae
      localization. C. albicans Vma8's conserved location is the vacuolar
      V-ATPase, with no direct evidence that this peripheral D subunit occupies
      starvation-induced vacuolar membrane microdomains.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The transferred S. cerevisiae evidence is not a constitutive Vma8
      localization assay: Toulmay and Prinz showed that yeast vacuolar membrane
      proteins, including Vma8, segregate into stress- and stationary
      phase-induced vacuolar lipid domains. That IDA row is reasonable as a
      non-core yeast localization, but it is condition-specific cell biology
      rather than conserved evidence that every fungal Vma8 ortholog resides in
      a membrane raft.
    supported_by:
    - reference_id: PMID:23836928
      supporting_text: >-
        micrometer-scale, stable lipid domains formed in the yeast vacuole
        membrane in response to nutrient deprivation, changes in the pH of the
        growth medium, and other stresses.
