id: P87220
gene_symbol: VMA8
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:237561
  label: Candida albicans SC5314
description: >-
  Vma8 is the Candida albicans V-type proton ATPase subunit D, a conserved
  peripheral V1-sector subunit of the vacuolar ATPase. It acts as part of the
  fungal vacuolar V-ATPase holoenzyme on the cytosolic face of the vacuolar
  membrane, contributing to the rotary ATPase activity that energizes proton
  movement into the vacuole and maintains vacuolar acidification.
existing_annotations:
- term:
    id: GO:0000221
    label: vacuolar proton-transporting V-type ATPase, V1 domain
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: part_of
  supporting_entities:
  - UniProtKB:P32610
  - sgd:YEL051W
  review:
    summary: >-
      Correct. C. albicans Vma8 is the fungal ortholog of S. cerevisiae Vma8,
      the 32-kDa V1 subunit D of the vacuolar ATPase.
    action: ACCEPT
    reason: >-
      The EnsemblFungi IEA source traces through S. cerevisiae VMA8/YEL051W,
      and P87220 is in the conserved PTHR11671 V-type ATP synthase subunit D
      family. Budding-yeast Vma8p was identified in the isolated V-ATPase and
      the vma8 deletion blocked association of other V1 subunits with the
      vacuolar membrane, supporting the conserved assignment of the Candida
      protein to the peripheral V1 domain.
    supported_by:
    - reference_id: file:genes/CANAL/VMA8/VMA8-uniprot.txt
      supporting_text: DR   PANTHER; PTHR11671; V-TYPE ATP SYNTHASE SUBUNIT D; 1.
    - reference_id: PMID:7797485
      supporting_text: >-
        We have identified VMA8, the gene encoding the 32-kDa subunit of the
        V-ATPase, by 100% match between the sequences of tryptic peptides and
        the predicted protein sequence of ORF11.
