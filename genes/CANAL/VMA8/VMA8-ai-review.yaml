- id: PMID:7797485
  title: >-
    VMA8 encodes a 32-kDa V1 subunit of the Saccharomyces cerevisiae vacuolar
    H(+)-ATPase required for function and assembly of the enzyme complex.
  findings:
  - statement: >-
      S. cerevisiae VMA8 encodes the 32-kDa V-ATPase subunit D; deletion of
      VMA8 abolishes vacuolar V-ATPase activity and prevents V1 assembly onto
      the vacuolar membrane.
    supporting_text: >-
