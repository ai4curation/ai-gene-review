- id: PMID:23836928
  title: Direct imaging reveals stable, micrometer-scale lipid domains that segregate proteins in live cells.
  findings:
  - statement: >-
      S. cerevisiae vacuolar membrane proteins enter visible lipid microdomains
      during starvation and other stresses; this supports the direct yeast VMA8
      membrane-raft row but is only contextual for the C. albicans similarity
      transfer.
    supporting_text: >-
      micrometer-scale, stable lipid domains formed in the yeast vacuole
