- term:
    id: GO:1902600
    label: proton transmembrane transport
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:P32610
  - sgd:YEL051W
  review:
    summary: >-
      Correct. Vma8 is part of the vacuolar V-ATPase machinery that transports
      protons across the vacuolar membrane.
    action: ACCEPT
    reason: >-
      Proton transmembrane transport is the physical transport process coupled
      to V-ATPase ATP hydrolysis. S. cerevisiae Vma8 mutations reduce or
      uncouple proton transport by the V-ATPase, supporting transfer of this
      broad but core process to the C. albicans ortholog.
    supported_by:
    - reference_id: PMID:10801866
      supporting_text: >-
        Six of the single mutations and all three of the double mutations led
        to significant (>30%) loss of activity, with the mutations having the
        greatest effects on activity clustering in the regions Val(71)-Gly(80)
        and Lys(209)-Met(221).
