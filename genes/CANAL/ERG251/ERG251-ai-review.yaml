id: A0A1D8PLB5
gene_symbol: ERG251
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:237561
  label: Candida albicans SC5314
description: >-
  Candida albicans ERG251 encodes a membrane C-4 sterol methyl oxidase and is
  the predominant SMO paralog controlling C-4 demethylation, 14-methylsterol
  production under azole stress and sterol-dependent phenotypes in this
  species. Erg251-GFP co-localizes with the ER in yeast and hyphal growth
  conditions, and ERG251 perturbation alters sterol composition with secondary
  effects on fluconazole tolerance, filamentation and stress responses.
