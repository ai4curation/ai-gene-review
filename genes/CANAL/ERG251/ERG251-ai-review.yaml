  review:
    summary: >-
      The high-throughput plasma-membrane proteomics hit came from a broad
      C. albicans membrane survey. Erg251 is a membrane protein whose
      best-supported catalytic site is the ER, and the broad fraction is
      insufficient to place this SMO specifically at the plasma membrane.
    action: MARK_AS_OVER_ANNOTATED
