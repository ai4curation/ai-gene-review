  review:
    summary: BGL22 is a full-length GH3 protein in the PANTHER beta-glucosidase family
      and carries the GH3 active-site signature (PROSITE PS00775), consistent with a
      catalytically competent beta-glucosidase. The PAINT assertion places the activity
      at an ancestral node of the family.
    action: ACCEPT
    reason: The best-supported statement of what the protein does. It describes the
      enzyme's chemistry, not growth on any particular sugar, so it is not contradicted
