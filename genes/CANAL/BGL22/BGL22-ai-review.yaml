taxon:
  id: NCBITaxon:237561
  label: Candida albicans (strain SC5314 / ATCC MYA-2876)
description: BGL22 (orf19.7339.1, CAALFM_CR09420CA) encodes a 924-residue glycoside
  hydrolase family 3 (GH3) beta-glucosidase (EC 3.2.1.21) that is predicted to hydrolyse
  terminal, non-reducing beta-D-glucosyl residues. It has the N- and C-terminal GH3
  catalytic domains, the GH3 active-site signature and a C-terminal fibronectin type
  III-like domain, the architecture of the fungal extracellular beta-glucosidases, and
  a predicted N-terminal signal peptide, which suggests it is secreted. It sits in the
  PANTHER beta-glucosidase family PTHR42715 (subfamily SF2). Nothing is known
  experimentally about its substrate, expression or role in C. albicans. The organism
  does not assimilate cellobiose and has no cellulases, so whatever BGL22 does, it does
  not support growth on cellulose-derived sugars; plausible substrates are other
  beta-glucosides or beta-glucan oligosaccharides.
