- description: Predicted secreted GH3 beta-glucosidase that hydrolyses terminal,
    non-reducing beta-D-glucosyl residues. Its natural substrate in C. albicans is
    unknown; it is not part of a cellobiose or cellulose utilisation route, which the
    organism lacks.
