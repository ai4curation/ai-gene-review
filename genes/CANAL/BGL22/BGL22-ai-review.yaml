suggested_questions:
- question: What is the natural substrate of BGL22 in C. albicans? A secreted GH3
    beta-glucosidase in a yeast that cannot use cellobiose or salicin suggests a
    different beta-glucoside or a beta-glucan oligosaccharide (for example from host or
    fungal cell walls).
  experts: []
- question: Is BGL22 expressed and secreted under any laboratory or host condition, and
    is its loss of a role in cellobiose use due to expression, substrate specificity or
    the absence of glucose release outside the cell?
  experts: []
suggested_experiments:
- experiment_type: Enzyme kinetics
  description: Express BGL22 heterologously and measure activity on p-nitrophenyl
    beta-D-glucoside, cellobiose, gentiobiose, laminaribiose and salicin.
  hypothesis: BGL22 is an active beta-glucosidase with low activity on cellobiose and
    salicin relative to beta-1,3- or beta-1,6-linked glucosides.
- experiment_type: Physiology
  description: Overexpress BGL22 from a constitutive promoter in SC5314 and test growth
    on cellobiose as sole carbon source.
  hypothesis: If BGL22 can hydrolyse cellobiose but is not normally expressed or
    secreted, forced expression will allow growth on cellobiose.
