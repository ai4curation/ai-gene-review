- term:
    id: GO:0000422
    label: autophagy of mitochondrion
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - FB:FBgn0035850
  - PANTHER:PTN000132136
  - SGD:S000006021
  review:
    summary: >-
      Mitophagy is seeded by S. cerevisiae Atg21, the protein Candida ATG21 is named for, in the
      sister group of the Candida pair. Kept as non-core.
    action: KEEP_AS_NON_CORE
    reason: >-
      Keep as non-core. The IBD is at the family root PTN000132136 (419 leaves) with two seeds, S.
      cerevisiae Atg21 (SGD:S000006021, IMP, PMID:19793921) and Drosophila Atg18a (FB:FBgn0035850).
      Candida ATG21 is in the same root child PTN000132137 (144 leaves), in the fungal clade
      PTN000881190 (20 leaves), where the Candida ATG18 and ATG21 pair (PTN000881194) is sister to
      the S. cerevisiae and Eremothecium Atg18 and Atg21 group (PTN000132224) under the 6-leaf node
      PTN000881193. It is not on the Hsv2 side of the tree, which is the other root child
      PTN000132247. The budding yeast seed is in that sister group, so the target is inside the
      seeded clade, and the seed evidence is a screen in which ATG21 deletion reduced mitophagy
      efficiency. Nothing on Candida Atg21 argues against the term, and the absence of a C. albicans
      experiment is not a reason to doubt the transfer. Mitophagy is a cargo-specific process in
      which the yeast protein has a supporting role, so the row is non-core. The root placement is
      still too deep for the other root child (PTN000132247), which holds no seed.
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      source_entities:
      - source_id: PANTHER:PTN000132136
        source_label: PTN000132136
        source_status: SUPPORTS_TRANSFER
        comment: >-
          S. cerevisiae Atg21 is a seed and sits in the sister group of the Candida pair under
          PTN000881193, so the placement is sound for this target. The node is deeper than its seeds
          only on the PTN000132247 side.
- term:
    id: GO:0000425
    label: pexophagy
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000132136
  - SGD:S000001917
  review:
    summary: >-
      Pexophagy is seeded by S. cerevisiae Atg18 alone, and the S. cerevisiae Atg21 protein was
      tested and is not needed for pexophagy.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The IBD is at the family root PTN000132136 (419 leaves) with one seed, S. cerevisiae Atg18
      (SGD:S000001917, IMP, PMID:11739783). Candida ATG21 is in the same root child PTN000132137
      (144 leaves), in the fungal clade PTN000881190 (20 leaves), where the Candida ATG18 and ATG21
      pair (PTN000881194) is sister to the S. cerevisiae and Eremothecium Atg18 and Atg21 group
      (PTN000132224) under the 6-leaf node PTN000881193. It is not on the Hsv2 side of the tree,
      which is the other root child PTN000132247. The tree therefore does not separate Candida ATG21
      from the seed, and the doubt comes from the Atg21 subfamily and not from node placement. In S.
      cerevisiae, peroxisome degradation is blocked in atg18 deletion cells and proceeds at the
      wild-type rate in atg21 deletion cells (PMID:15155809), so the budding yeast protein that
      Candida ATG21 is named for does not take part in pexophagy. That result is on the ortholog and
      not on the Candida protein, and the tree does not resolve which Candida paralog corresponds to
      which yeast paralog, so it is doubt and not a demonstrated loss. The row stays an
      over-annotation. A peroxisome turnover assay in a C. albicans atg21 deletion strain would
      settle it.
    propagation_review:
      root_cause: PROPAGATION_BAD
      source_entities:
      - source_id: PANTHER:PTN000132136
        source_label: PTN000132136
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          The single seed is S. cerevisiae Atg18. Its paralog Atg21 was tested in the same assay and
          is dispensable for pexophagy (PMID:15155809), so a root IBD that reaches every Atg21
          protein overreaches.
