- term:
    id: GO:0061723
    label: glycophagy
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - FB:FBgn0035850
  - PANTHER:PTN000132136
  review:
    summary: >-
      Glycophagy is seeded by Drosophila Atg18a alone, in the metazoan sister of the fungal clade,
      and Atg21 is the Cvt-specialised paralog in budding yeast.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The IBD is at the family root PTN000132136 (419 leaves) with one seed, Drosophila Atg18a
      (FB:FBgn0035850, IMP, PMID:24265594). The seed sits in the metazoan clade PTN000881175 (67
      leaves). Candida ATG21 is in the sister fungal clade PTN000881190 (20 leaves), which holds no
      seed for this term, and the two join at PTN000132139 (87 leaves), three nodes below the IBD.
      The fly evidence is a requirement for the core autophagy machinery in glycogen autophagy. In
      S. cerevisiae Atg21 is dispensable for nonspecific autophagy and for pexophagy and is needed
      for the Cvt pathway (PMID:15155809), so a core-machinery argument does not carry to Atg21
      proteins. A PubMed search found no report of glycogen autophagy in C. albicans. The row stays
      an over-annotation on the Atg21 subfamily and not on node placement, because moving the IBD down
      to the Atg18, WIPI1 and WIPI2 node PTN000132139 would still cover this protein. A glycogen
      turnover assay in atg21 deletion cells would settle it.
    propagation_review:
      root_cause: PROPAGATION_BAD
      source_entities:
      - source_id: PANTHER:PTN000132136
        source_label: PTN000132136
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          The single fly seed is in the metazoan clade PTN000881175; the fungal sister clade
          PTN000881190 that holds the target has no seed for this term, and the IBD is three nodes
          above their join.
