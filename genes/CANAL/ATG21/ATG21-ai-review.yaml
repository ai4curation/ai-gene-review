  label: Candida albicans SC5314
description: 'Atg21 is a fungal PROPPIN beta-propeller phosphoinositide-binding protein in the Atg18 family.
  It is the C. albicans ortholog of the Saccharomycotina Atg21 branch, whose members are inferred
  to bind phosphoinositides and act as PI3P-rich membrane adaptors at vacuolar or phagophore-associated
  membranes.'
