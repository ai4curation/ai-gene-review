core_functions:
- description: Atg21 is a fungal PROPPIN phosphoinositide adaptor inferred by orthology to bind
    PI3P-rich vacuolar or phagophore-associated membranes. It belongs to the Saccharomycotina
    Atg21 clade, which sits beside Atg18 in the PROPPIN family tree and not on the Hsv2 side.
  molecular_function:
    id: GO:0032266
    label: phosphatidylinositol-3-phosphate binding
  directly_involved_in:
  - id: GO:0034497
    label: protein localization to phagophore assembly site
  locations:
  - id: GO:0000329
    label: fungal-type vacuole membrane
  supported_by:
  - reference_id: PMID:25691244
    supporting_text: Atg21 thus defines PI3P-dependently the lipidation site by linking and
      organising the E3 ligase complex and Atg8 at the PAS.
    reference_section_type: ABSTRACT
  - reference_id: PMID:15155809
    supporting_text: the Atg18, Atg21, and Ygr223c fusion proteins, but not MBP itself, bound to
      PtdIns(3)P that had been immobilized on nitrocellulose in vitro, but they also bound to
      PtdIns 4-phosphate with apparently equal affinity
    reference_section_type: RESULTS
  - reference_id: file:genes/CANAL/ATG21/ATG21-uniprot.txt
    supporting_text: DR   PANTHER; PTHR11227; WD-REPEAT PROTEIN INTERACTING WITH PHOSPHOINOSIDES
      WIPI -RELATED; 1.
    reference_section_type: DATABASE_ENTRY
