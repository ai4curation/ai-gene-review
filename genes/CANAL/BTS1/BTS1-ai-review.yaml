taxon:
  id: NCBITaxon:237561
  label: Candida albicans SC5314
description: >-
  Candida albicans BTS1 is the conserved geranylgeranyl diphosphate synthase
  of the fungal/animal FPP/GGPP synthase family in the PTHR12001 SF44 GGPP
  synthase clade. It is expected to form the C20 allylic isoprenoid
  geranylgeranyl diphosphate, a branch-point donor for protein
  geranylgeranylation and other isoprenoid end products.
