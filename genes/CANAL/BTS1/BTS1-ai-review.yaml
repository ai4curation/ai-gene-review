knowledge_gaps:
- gap_statement: The subcellular location of C. albicans Bts1 has not been established.
  boundary: >-
    BTS1 is a PTHR12001 SF44 geranylgeranyl diphosphate synthase, but the
    2026-11-23 PubMed search found no direct C. albicans BTS1 localization
    paper and PAINT does not propagate a cellular-component term on the SF44
    GGPP synthase node.
  gap_kind:
  - BIOLOGY
  dark_aspect: CC_DARK
  status: OPEN
  significance: >-
    Localization would distinguish whether Bts1 supplies a cytosolic
    geranylgeranyl diphosphate pool for protein prenylation, an organellar
    pool, or both.
  resolution: Endogenous Bts1 tagging and fractionation across yeast and hyphal growth would close the gap.
suggested_questions:
- question: What is the subcellular distribution of C. albicans BTS1 during yeast and hyphal growth?
suggested_experiments:
- hypothesis: C. albicans Bts1 is a cytosolic GGPP synthase that supplies protein geranylgeranylation.
  description: >-
    Combine endogenously tagged Bts1 microscopy with targeted GGPP measurement
    and prenylated-GTPase mobility assays after BTS1 depletion or catalytic-site
    complementation.
  experiment_type: fluorescence microscopy / lipidomics
