    label: histone H3K56 acetyltransferase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  review:
    summary: >-
      Proposed GO-Central PAINT annotation for the defining Candida Rtt109
      activity.
    action: NEW
    reason: >-
      C. albicans RTT109 sits in the PTHR31571:SF2 Rtt109 subfamily under
      PANTHER:PTN001586545, the same node that carries GO-Central's
      histone H3K56 acetyltransferase IBD. Direct Candida experiments show that
      rtt109-null cells lose detectable H3K56ac, so the PAINT transfer is
      well grounded.
    supported_by:
    - reference_id: PMID:20080646
      supporting_text: >-
        rtt109(-/-) mutant cells lack acetylated H3K56 (H3K56ac) and are
        hypersensitive to genotoxic agents.
- term:
    id: GO:0006974
    label: DNA damage response
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: >-
      Proposed GO-Central PAINT annotation for the conserved RTT109 DNA-damage
      role.
    action: NEW
    reason: >-
      The fungal RTT109 PAINT node inherits the DNA-damage-response assertion
      from characterized budding- and fission-yeast descendants. The Candida
      ortholog is not just a sequence transfer: rtt109-null cells are
      hypersensitive to genotoxic agents and constitutively display DNA-damage
      markers.
    supported_by:
    - reference_id: PMID:20080646
      supporting_text: >-
        display increased H2A S129 phosphorylation and elevated DNA repair gene
        expression, consistent with endogenous DNA damage.
