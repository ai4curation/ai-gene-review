core_functions:
- molecular_function:
    id: GO:0032931
    label: histone H3K56 acetyltransferase activity
  description: RTT109 acetylates histone H3K56 as part of the fungal replication-
    and repair-coupled chromatin assembly system. In C. albicans this activity is
    required to maintain H3K56ac, withstand genotoxic stress, preserve normal genome
    integrity and pathogenicity, and support H3K56ac-sensitive white-opaque cell-state
    transitions.
  directly_involved_in:
  - id: GO:0006974
    label: DNA damage response
  locations:
  - id: GO:0005634
    label: nucleus
proposed_new_terms: []
suggested_questions:
- question: Which C. albicans histone chaperones physically deliver H3-H4 to Rtt109
    in vivo, and how do Asf1, Vps75, CAF-1 and HIR divide the replication, genotoxic-stress
    and white-opaque switching functions?
suggested_experiments:
- hypothesis: C. albicans Vps75 and Asf1 stimulate Rtt109-dependent H3K56 acetylation
    in distinct chromatin contexts.
  description: Combine endogenous co-immunoprecipitation of Rtt109 with vps75 and
    asf1 perturbations, quantitative H3K56ac blots, and genotoxic-stress and white-opaque
    switching assays to separate direct chaperone effects on the enzyme from indirect
    chromatin-assembly phenotypes.
  experiment_type: genetics / co-immunoprecipitation / chromatin assay
