- id: PMID:20080646
  title: Histone acetyltransferase Rtt109 is required for Candida albicans pathogenesis.
  findings:
  - statement: >-
      C. albicans rtt109-null cells lack detectable H3K56ac, are
      hypersensitive to genotoxic agents, and show endogenous DNA-damage
      readouts and reduced pathogenicity.
    supporting_text: >-
      rtt109(-/-) mutant cells lack acetylated H3K56 (H3K56ac) and are
      hypersensitive to genotoxic agents
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified; abstract-only in the local cache, but the abstract
      directly establishes RTT109 as the C. albicans H3K56 acetyltransferase
      needed for genotoxic-stress resistance and pathogenesis.
- id: PMID:20601951
  title: Modulation of histone H3 lysine 56 acetylation as an antifungal therapeutic strategy.
  findings:
  - statement: >-
      H3K56 acetylation in C. albicans is controlled by RTT109 and HST3 and
      altered H3K56ac compromises genotoxic-stress resistance and virulence.
    supporting_text: >-
      H3K56ac in C. albicans is regulated by the RTT109 and HST3 genes, which
      respectively encode the H3K56 acetyltransferase (Rtt109p) and deacetylase
      (Hst3p)
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified; abstract-only in the local cache, but the abstract is a
      direct Candida RTT109/HST3 H3K56ac study.
- id: PMID:21749487
  title: Regulation of white and opaque cell-type formation in Candida albicans by Rtt109 and Hst3.
  findings:
  - statement: >-
      RTT109 is needed for efficient white-to-opaque switching and for
      maintenance of the opaque state.
    supporting_text: >-
      deletion of RTT109, encoding the acetyltransferase for histone H3K56,
      impairs stochastic and environmentally stimulated white-opaque switching.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed/PMC-verified full text; this is the direct source for RTT109's
      role in C. albicans opaque cell-type formation and maintenance.
- id: PMID:23417560
  title: Nucleosome assembly factors CAF-1 and HIR modulate epigenetic switching frequencies in an H3K56 acetylation-associated manner in Candida albicans.
  findings:
  - statement: >-
      RTT109-dependent H3K56 acetylation genetically interacts with CAF-1 and
      HIR histone-chaperone pathways in stress resistance and white-opaque
      switching.
    supporting_text: >-
      Reducing levels of histone H3K56 acetylation by deleting RTT109 could
      rescue the sensitivity of cac2Δ/Δ cells to nicotinamide.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed/PMC-verified full text; supports the broader chromatin-assembly
      context of the Candida Rtt109/H3K56ac pathway.
