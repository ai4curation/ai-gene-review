suggested_questions:
- question: >-
    Which C. albicans histone chaperones physically deliver H3-H4 to Rtt109 in
    vivo, and how do Asf1, Vps75, CAF-1 and HIR divide the replication,
    genotoxic-stress and white-opaque switching functions?
suggested_experiments:
- hypothesis: >-
    C. albicans Vps75 and Asf1 stimulate Rtt109-dependent H3K56 acetylation in
    distinct chromatin contexts.
  description: >-
    Combine endogenous co-immunoprecipitation of Rtt109 with vps75 and asf1
    perturbations, quantitative H3K56ac blots, and genotoxic-stress and
    white-opaque switching assays to separate direct chaperone effects on the
    enzyme from indirect chromatin-assembly phenotypes.
  experiment_type: genetics / co-immunoprecipitation / chromatin assay
