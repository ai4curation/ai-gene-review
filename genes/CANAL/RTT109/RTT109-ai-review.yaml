taxon:
  id: NCBITaxon:237561
  label: Candida albicans SC5314
description: >-
  Candida albicans RTT109 is a fungal Rtt109/KAT11-family histone
  acetyltransferase that acetylates histone H3 lysine 56 in the nucleus. This
  H3K56 acetylation system supports genome stability after replication and DNA
  damage, contributes to filamentous growth and virulence in host-like stress
  settings, and helps form and maintain the opaque cell state through the
  chromatin state that white-opaque switching requires.
