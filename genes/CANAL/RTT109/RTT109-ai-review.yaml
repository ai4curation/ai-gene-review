core_functions:
- molecular_function:
    id: GO:0032931
    label: histone H3K56 acetyltransferase activity
  description: >-
    RTT109 acetylates histone H3K56 as part of the fungal replication- and
    repair-coupled chromatin assembly system. In C. albicans this activity is
    required to maintain H3K56ac, withstand genotoxic stress, preserve normal
    genome integrity and pathogenicity, and support H3K56ac-sensitive
    white-opaque cell-state transitions.
  directly_involved_in:
  - id: GO:0006974
    label: DNA damage response
  locations:
  - id: GO:0005634
    label: nucleus
