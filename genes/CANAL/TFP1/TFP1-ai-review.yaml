- id: PMID:25220074
  title: Role of TFP1 in vacuolar acidification, oxidative stress and filamentous
    development in Candida albicans.
  findings:
  - statement: Tfp1 is a putative C. albicans V-ATPase subunit that is essential
      for vacuolar acidification and endocytic trafficking.
    supporting_text: In this study, we identified C. albicans Tfp1 as a putative
      subunit of V-ATPase, and explored its importance in multiple cellular
      processes. Our results revealed that Tfp1 played an essential role in
      vacuolar acidification and endocytic trafficking.
    full_text_unavailable: true
    reference_section_type: ABSTRACT
  - statement: Loss of TFP1 perturbs oxidative-stress physiology and reduces
      Cap1 expression after hydrogen peroxide treatment.
    supporting_text: Western blotting analysis showed that deletion of TFP1
      significantly reduced the expression of Cap1 under H2O2 treatment, which
      contributes to the regulation of genes involved in the oxidative stress
      response.
    full_text_unavailable: true
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified primary C. albicans TFP1 study; the local
      cache contains the abstract but not the full text.
- id: PMID:26255859
  title: Tfp1 is required for ion homeostasis, fluconazole resistance and N-Acetylglucosamine
    utilization in Candida albicans.
  findings:
  - statement: TFP1 deletion disrupts iron, copper, and calcium homeostasis and
      alters fluconazole and N-acetylglucosamine physiology.
    supporting_text: In this study, we demonstrated the essential roles of
      V-ATPase through Tfp1, a putative V-ATPase subunit. Deletion of TFP1 led
      to generation of an iron starvation signal and reduced total iron content,
      which was associated with mislocalization of Fet34p that was finally due
      to disorders in copper homeostasis.
    full_text_unavailable: true
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed-verified TFP1 follow-up; useful background for
      secondary ion-homeostasis phenotypes, with only the abstract cached.
- id: PMID:29086141
  title: Effects of Disruption of PMC1 in the tfp1∆/∆ Mutant on Calcium Homeostasis,
    Oxidative and Osmotic Stress Resistance in Candida albicans.
  findings:
  - statement: Further deletion of the vacuolar calcium pump PMC1 in a tfp1
      mutant exacerbates calcium-homeostasis and stress phenotypes.
    supporting_text: In this study, we found that further deletion of PMC1, a
      vacuolar calcium pump, in tfp1∆/∆ mutant led to more severe dysregulation
      of calcium homeostasis.
    full_text_unavailable: true
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed-verified genetic follow-up that treats Tfp1 loss as the
      V-ATPase perturbation background; only the abstract is cached.
