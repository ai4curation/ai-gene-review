gene_symbol: TFP1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:237561
  label: Candida albicans SC5314
description: Tfp1 is the catalytic A subunit of the peripheral V1 sector of the
  Candida albicans vacuolar-type H+-ATPase. As a fungal PTHR43607 member it
  belongs to the conserved V-ATPase/A-ATPase alpha/beta family, binds and
  hydrolyzes ATP in the V1 domain, and contributes to the rotary proton pump
  that acidifies the fungal vacuole. Loss of TFP1 disrupts vacuolar
  acidification and endomembrane homeostasis, causing secondary defects in ion
  handling, oxidative-stress physiology, endocytic trafficking, filamentation,
  and virulence.
