  review:
    summary: Keep the extracellular-region proteomics hit as a peripheral localization.
    action: KEEP_AS_NON_CORE
    reason: >
      Vaz et al. identified proteins present reproducibly in the C. albicans
      hyphal secretome by LC-MS/MS. The localization is compatible with a
      proteomic extracellular-region call but is secondary to MET15's
      cytosolic biosynthetic role, so it is retained as non-core rather than
      folded into the core function.
