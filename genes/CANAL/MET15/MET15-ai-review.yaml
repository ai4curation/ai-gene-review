id: Q59US5
gene_symbol: MET15
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:237561
  label: Candida albicans SC5314
description: >
  Candida albicans MET15 encodes a cytosolic PLP-dependent
  O-acetylhomoserine sulfhydrylase in the direct sulfhydrylation branch of
  methionine biosynthesis. Purified CaMet15p catalyzes formation of
  L-homocysteine from O-acetyl-L-homoserine and sulfide, but did not show
  detectable O-acetylserine-dependent L-cysteine synthesis in the direct
  2024 biochemical assay. MET15 disruption impairs growth without methionine,
  consistent with a role in de novo L-methionine biosynthesis, and proteomic
  surveys have also reported MET15 in extracellular or wall-associated hyphal
  fractions.
