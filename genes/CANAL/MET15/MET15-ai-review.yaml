- id: PMID:42003610
  title: Met32 governs transcriptional control of sulfur metabolic flexibility and
    resistance to reactive sulfur species in the human fungal pathogen Candida albicans.
  findings:
  - statement: MET15 is among the C. albicans sulfur/methionine pathway transcripts induced under sulfur deprivation.
    supporting_text: Under sulfur deprivation, and when using Met/Cys as sulfur repletion sources, C. albicans cells induce genes involved in the different steps of methionine biosynthesis, including sulfur assimilation (MET3, MET14, MET16, MET5, MET10), incorporation into carbon chain (MET15, MET2, MET6, SAM2, MET1), and the trans-sulfuration pathway (CYS4, CYS3), which allows the interconversion between cysteine and homocysteine (Fig. 1E; Table 1).
    reference_section_type: RESULTS
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text was read; the newer sulfur-starvation transcriptomics paper gives pathway-regulation context for MET15 but does not change the direct CaMet15p activity assessment.
