gene_symbol: ATG18
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:237561
  label: Candida albicans SC5314
description: Candida albicans Atg18 is a conserved fungal Atg18-family PROPPIN that supports
  macroautophagy and DNA damage-induced autophagy. The protein is inferred to bind PI3P and
  PI(3,5)P2 through its beta-propeller and to act at phagophore assembly, endosomal and fungal-type
  vacuole membranes.
