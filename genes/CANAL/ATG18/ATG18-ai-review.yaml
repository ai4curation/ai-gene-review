      phenotype rather than a directly demonstrated species-specific process.
- term:
    id: GO:0006974
    label: DNA damage response
  evidence_type: IMP
  original_reference_id: PMID:38132782
  qualifier: involved_in
  review:
    summary: Atg18 is required for DNA damage-induced autophagy in C. albicans.
    action: KEEP_AS_NON_CORE
    reason: Keep as non-core. Atg18 is required for C. albicans GFP-Atg8 processing in MMS
      as well as nitrogen starvation, supporting this DNA-damage-induced autophagy phenotype
      as a condition-specific biological process rather than the conserved Atg18 molecular core.
    supported_by:
    - reference_id: PMID:38132782
      supporting_text: The results showed that the atg1Δ/Δ, atg11Δ/Δ, atg13Δ/Δ, and atg18Δ/Δ
        strains have almost no GFP-Atg8 to GFP conversion under an MMS treatment and nitrogen
        starvation
      reference_section_type: RESULTS
