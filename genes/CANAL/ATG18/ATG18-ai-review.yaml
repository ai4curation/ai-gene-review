suggested_questions:
- question: Which selective-autophagy routes outside bulk macroautophagy have been assayed
    directly for C. albicans ATG18 rather than inferred from S. cerevisiae or a sibling PROPPIN
    paralog?
  experts: []
suggested_experiments:
- description: Use GFP-Atg8 processing and cargo-specific pexophagy, mitophagy and nucleophagy
    reporters in an ATG18 loss-of-function background to separate conserved Atg18 macroautophagy
    functions from lineage-specific selective autophagy roles.
