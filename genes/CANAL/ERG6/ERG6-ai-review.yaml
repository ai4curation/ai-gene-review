suggested_questions:
- question: Does C. albicans Erg6 also have a lipid-droplet pool as in S. cerevisiae,
    or is the ER the dominant detectable site of the late Erg6 reaction?
- question: Does the CaFT fluconazole phenotype of ERG6 reflect altered drug uptake,
    altered sterol-pathway flux, or both?
suggested_experiments:
- description: Tag native ERG6 in C. albicans, image it with ER and lipid-droplet markers,
    and pair localization with subcellular sterol methyltransferase assays to test whether
    lipid droplets carry an active Erg6 pool.
  hypothesis: Candida Erg6 is active at the ER and may also be active on lipid droplets.
  experiment_type: subcellular localization
