id: O74198
gene_symbol: ERG6
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:237561
  label: Candida albicans SC5314
description: ERG6 encodes the Candida albicans sterol 24-C-methyltransferase, a class I-like
  SAM-dependent Erg6/SMT-family enzyme of the late ergosterol pathway. The enzyme transfers
  a methyl group from S-adenosyl-L-methionine to C-24 of zymosterol to form fecosterol,
  the first committed C-24-methylation step after zymosterol production; purified native
  CaErg6 is a homooligomeric enzyme that prefers zymosterol and is inhibited by sterol
  substrate analogs. ERG6 disruption or reduced expression causes zymosterol accumulation
  and membrane/sterol phenotypes in Candida, consistent with a core endoplasmic-reticulum-associated
  role in ergosterol biosynthesis.
