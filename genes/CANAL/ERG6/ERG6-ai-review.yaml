  evidence_type: IMP
  original_reference_id: PMID:17604452
  qualifier: involved_in
  review:
    summary: Xu et al. detected altered fluconazole fitness of ERG6 deletion strains in
      CaFT/spot-test assays, but Erg6 is a sterol-pathway enzyme whose expression or
      dosage changes alter membrane composition and drug susceptibility; it is not itself
      an execution step in a xenobiotic-response program.
    action: MARK_AS_OVER_ANNOTATED
    reason: The phenotype supports a link between Erg6-dependent sterol composition and
      compound sensitivity, not direct participation of the Erg6 enzyme in the cellular
      response to xenobiotic stimulus.
    supported_by:
    - reference_id: PMID:17604452
      supporting_text: In addition, the ERG6 strain showed relative resistance as indicated
        by the significant negative z-scores at higher concentrations
