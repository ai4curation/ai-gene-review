id: Q92206
gene_symbol: ERG1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:237561
  label: Candida albicans SC5314
description: >-
  ERG1 encodes Candida albicans squalene epoxidase, a particulate FAD-dependent monooxygenase of the
  squalene monooxygenase family that catalyzes epoxidation of squalene to 2,3-oxidosqualene in the
  ergosterol biosynthetic pathway. Candida ERG1 produces a 55 kDa particulate enzyme whose activity
  requires oxygen, FAD, and NADH or NADPH, is inhibited by allylamine antifungals, and is conserved
  with ER-membrane squalene monooxygenases from budding yeast, fission yeast, and animals. Repressing
  or conditionally disrupting ERG1 depletes ergosterol and accumulates squalene, consistent with ERG1
  executing an essential early oxygenation step in fungal sterol synthesis.
