  label: Candida albicans SC5314
description: Candida albicans ERG7 encodes lanosterol synthase, the oxidosqualene cyclase that
  converts (S)-2,3-epoxysqualene to lanosterol in ergosterol biosynthesis. Heterologous
  complementation in Saccharomyces cerevisiae established the Candida gene as a structural
  gene for oxidosqualene cyclase.
