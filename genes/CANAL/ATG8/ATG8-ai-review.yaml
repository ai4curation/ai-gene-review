- id: PMID:27473887
  title: The malfunction of peroxisome has an impact on the oxidative stress sensitivity
    in Candida albicans.
  findings:
  - statement: >-
      C. albicans autophagy-defective pex1 atg8 and pex1 atg1 double mutants
      have attenuated oxidative-stress tolerance compared with pex1 mutants.
    supporting_text: showed remarkable attenuated tolerance to oxidative stress
    reference_section_type: ABSTRACT
  full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified abstract-only cache. The abstract supports a double-mutant
      oxidative-stress phenotype for atg8 in a pex1 background, but the visible
      evidence shows necessity for peroxisome-stress adaptation rather than a
      direct oxidative-stress molecular activity of ATG8 itself.
- id: PMID:29544880
  title: >-
    Stress-associated endoplasmic reticulum protein 1 (SERP1) and Atg8 synergistically
    regulate unfolded protein response (UPR) that is independent on autophagy in Candida
    albicans.
  findings:
  - statement: >-
      Loss of both SERP1/YSY6 and ATG8 sensitized C. albicans to tunicamycin and
      impaired mitochondrial function under ER stress.
    supporting_text: >-
      We found that deletion of both SERP1/YSY6 and ATG8 led to hypersensitivity to
      tunicamycin (TN), and resulted in severe mitochondrial dysfunction under this
      stress.
    reference_section_type: ABSTRACT
  - statement: >-
      The serp1/ysy6 atg8 double mutant attenuated HAC1 mRNA splicing and reduced
      UPR reporter activation.
    supporting_text: >-
      UPR reporting systems illustrated that the double mutation attenuated splicing of
      HAC1 mRNA, followed by decreased level of UPR activation.
    reference_section_type: ABSTRACT
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified abstract-only cache. The abstract directly supports the CGD
      IGI assertion that ATG8 and SERP1/YSY6 act together in the C. albicans
      unfolded-protein response under ER stress.
- id: PMID:31284951
  title: Function of Atg11 in non-selective autophagy and selective autophagy of
    Candida albicans.
  findings:
  - statement: >-
      C. albicans Atg11 is required for Atg8 transport and degradation under
      nitrogen starvation and hypha-inducing conditions.
    supporting_text: >-
      Western blotting and GFP localization further revealed that the transport and
      degradation of Atg8 was blocked
    reference_section_type: ABSTRACT
  - statement: >-
      Atg11-dependent autophagy contributes to both non-selective and selective
      autophagy in C. albicans.
    supporting_text: >-
      These results indicated that Atg11 plays an essential role in both non-selective
      and selective autophagy in C. albicans.
    reference_section_type: ABSTRACT
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified abstract-only cache. The abstract describes GFP-Atg8
      transport/degradation assays and supports the vacuolar trafficking/localization
      context used for the C. albicans Atg8 review.
- id: PMID:36328097
  title: >-
    Atg8 and Ire1 in combination regulate the autophagy-related endoplasmic reticulum
    stress response in Candida albicans.
  findings:
  - statement: >-
      In a C. albicans ATG8 IRE1 double mutant, ER stress caused stronger UPR
      defects and an ER-phagy-associated vacuolar-fusion defect than in either
      single mutant.
    supporting_text: >-
      Further investigations showed that the double mutant had a defect in ER-phagy,
      which was associated with attenuated vacuolar fusion under ER stress.
    reference_section_type: ABSTRACT
  - statement: >-
      Ire1 and Atg8 act together in C. albicans UPR activation and ER-phagy during
      ER-stress adaptation.
    supporting_text: >-
      This study revealed that Ire1 and Atg8 in combination function in the activation
      of the UPR and ER-phagy to maintain ER homeostasis under ER stress in
      C. albicans.
    reference_section_type: ABSTRACT
  full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified abstract-only cache. This 2023 paper corroborates a
      C. albicans ATG8 contribution to the ER-stress response, but the visible
      abstract supports retaining rather than refining the existing CGD UPR row.
