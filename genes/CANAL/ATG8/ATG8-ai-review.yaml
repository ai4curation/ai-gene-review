gene_symbol: ATG8
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:237561
  label: Candida albicans SC5314
description: >-
  Candida albicans ATG8 encodes a conserved Atg8-family ubiquitin-like modifier
  that is proteolytically processed and conjugated to phosphatidylethanolamine
  on autophagosomal membranes. Lipidated Atg8 marks autophagosomes and supports
  autophagosome assembly, maturation, vacuolar delivery, mitophagy and
  starvation-induced autophagy; C. albicans experiments also implicate ATG8 in
  the ER-stress response together with SERP1/YSY6 and IRE1.
