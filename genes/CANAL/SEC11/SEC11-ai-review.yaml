id: Q5A869
gene_symbol: SEC11
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:237561
  label: Candida albicans SC5314
description: SEC11 encodes the Candida albicans catalytic subunit of the
  endoplasmic-reticulum signal peptidase complex. SEC11 is a single-pass ER
  membrane protein in the peptidase S26B family and, by conservation with yeast
  and metazoan Sec11/SEC11 subunits, cleaves N-terminal signal peptides from
  secretory-pathway preproteins as they enter the ER lumen.
