  review:
    summary: The S26 InterPro signatures correctly identify SEC11 as a serine
      peptidase; GO:0004252 captures the Sec11 catalytic mechanism while
      GO:0009003 captures the signal-peptide substrate class.
    action: ACCEPT
    reason: Candida SEC11 is an S26B signal peptidase with the conserved
      signal-peptidase catalytic subunit architecture. GO:0009003 signal
      peptidase activity is a sibling of GO:0004252 under endopeptidase
      activity, not a child, and the serine-type term records the conserved
      Sec11 active-site mechanism independently of the substrate-specific
      signal peptidase rows.
