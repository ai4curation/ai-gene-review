references:
- id: PMID:15300682
  title: Characterization of Candida albicans orthologue of the Saccharomyces
    cerevisiae signal-peptidase-subunit encoding gene SPC3.
  findings:
  - statement: C. albicans SPC3 is the true fungal SPC3 ortholog, is essential
      for viability, and functionally connects the Candida signal peptidase
      complex to the ER Sec61 translocon.
    supporting_text: The cloned gene could rescue the phenotype associated with
      a spc3 mutation in S. cerevisiae
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed-verified primary C. albicans study; it assayed the SPC3
      accessory subunit rather than SEC11 directly, but supports existence of a
      conserved Candida ER signal peptidase complex.
- id: PMID:32102426
  title: The Role of Secretory Pathways in Candida albicans Pathogenesis.
  findings:
  - statement: In C. albicans, signal peptidase cleavage follows ER
      translocation; Spc3p and Sec11p had been assigned as signal peptidase
      complex subunits, but SEC11 itself had not been directly characterized in
      C. albicans as of 2020.
    supporting_text: Following translocation into the ER, the N-terminal signal
      peptide is cleaved by signal peptidase
    reference_section_type: DISCUSSION
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed/PMC-verified review that synthesizes the C. albicans
      secretory-pathway literature and explicitly notes the lack of direct
      Candida SEC11 characterization.
- id: PMID:34388369
  title: Structure of the human signal peptidase complex reveals the determinants
    for signal peptide cleavage.
  findings:
  - statement: Human SEC11A and SEC11C form the proteolytic subunits of two
      ER-localized signal peptidase complexes, with an active site that abuts the
      ER membrane.
    supporting_text: human SPC exists in two functional paralogs with distinct
      proteolytic subunits
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed-verified structural study of metazoan SEC11A/SEC11C
      paralogs; supports conserved Sec11/SPC mechanism but is not Candida
      evidence.
- id: PMID:42586426
  title: The Sec11 C-terminal short helix promotes productive engagement of
    internal signal sequences with the signal peptidase complex.
  findings:
  - statement: S. cerevisiae Sec11 is the SPC catalytic subunit and its
      C-terminal short helix helps stabilize internal signal sequences during
      cleavage.
    supporting_text: Sec11, the catalytic subunit of the SPC, is evolutionarily
      conserved from bacteria to humans
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed/PMC-verified 2026 S. cerevisiae study; supports a
      conserved feature that UniProt also identifies in Candida SEC11.
