suggested_questions:
- question: Has C. albicans SEC11 been directly depleted or mutated to confirm
    essentiality and identify Candida substrates whose signal peptides are most
    sensitive to partial SPC loss?
  experts: []
suggested_experiments:
- experiment_type: conditional SEC11 depletion with secretory precursor readouts
  hypothesis: Candida albicans SEC11 is the essential catalytic SPC subunit, and
    depletion will cause accumulation of uncleaved secretory precursors.
  description: Place SEC11 under a repressible promoter or acute degron, repress
    it over a short time course, and assay cleavage of epitope-tagged secreted
    aspartyl protease, GPI-anchored cell wall protein, and Kar2 reporters by
    immunoblotting or targeted proteomics while monitoring ER stress markers.
