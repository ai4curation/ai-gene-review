- term:
    id: GO:0110034
    label: negative regulation of adenylate cyclase-activating glucose-activated G protein-coupled receptor
      signaling pathway
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN002001416
  - PomBase:SPCC285.09c
  review:
    summary: PAINT propagation (node PTN002001416; donor S. pombe cgs2/pde1) of negative regulation of
      the adenylate cyclase-activating glucose-activated GPCR (Gpr1/Gpa2) signalling pathway. Pde1 does
      terminate the glucose-induced cAMP rise, but in C. albicans that rise is reported to come from Cdc25-Ras1
      rather than a glucose-activated GPCR.
    action: MODIFY
    reason: 'Pde1 hydrolyses the cAMP produced after glucose addition and is the phosphodiesterase that
      terminates that spike in C. albicans (and in the S. cerevisiae ortholog), so negative regulation
      of glucose signalling is well supported. The ''adenylate cyclase-activating glucose-activated G
      protein-coupled receptor'' part of GO:0110034 does not transfer cleanly to C. albicans: Maidan et
      al. (2005) found glucose-induced cAMP intact in gpr1 and gpa2 deletions but abolished in cdc25 and
      ras1 deletions, and the CaGpr1 ligand appears to be methionine or lactate rather than sugar. Miwa
      et al. (2004) reported the opposite, so the receptor wiring is disputed rather than settled; Wilson
      et al. (2010) link Gpa2 to acidification-induced cAMP. The direct parent term GO:1902660 (negative
      regulation of glucose mediated signaling pathway) captures what Pde1 does on either reading, without
      committing to a GPCR input, and is therefore proposed as the replacement. The S. pombe placement
      is sound for fission yeast, where the Git3/Gpa2 receptor does sense glucose. An independent OpenScientist
      hypothesis run, given the competing references but not this review''s verdict, reached the same
      conclusion and recommended GO:1902660.'
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - GRANULARITY_MISMATCH
      - LINEAGE_OR_TAXON_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN002001416
        source_label: PTN002001416
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Node placement for the cAMP phosphodiesterase role is sound, and the glucose-GPCR context
          holds for the S. pombe donor (cgs2; Git3/Gpa2 glucose receptor). In C. albicans the Gpr1/Gpa2
          module appears to sense methionine/lactate and glucose-induced cAMP is Cdc25/Ras1-dependent
          (disputed), so the parent GO:1902660 is the appropriate level for the target.
    supported_by:
    - reference_id: PMID:20558315
      supporting_text: Pde1, but not Pde2, is responsible for down-regulation of cAMP signalling induced
        by glucose addition or intracellular acidification
    - reference_id: PMID:20558315
      supporting_text: Our biochemical evidence shows that Gpa2 stimulates cAMP signalling in response
        to intracellular acidification
    - reference_id: PMID:15673611
      supporting_text: deletion of neither CaGpr1 nor CaGpa2 affects glucose-induced cAMP signaling. In
        contrast, the latter is abolished in strains lacking CaCdc25 or CaRas1, suggesting that the CaCdc25-CaRas1
        rather than the CaGpr1-CaGpa2 module mediates glucose-induced cAMP signaling
    - reference_id: PMID:30761119
      supporting_text: However, it seems that the ligand(s) for CaGpr1 are not sugars but lactate and
        methionine.
    - reference_id: file:CANAL/PDE1/PDE1-deep-research-falcon.md
      supporting_text: A **2005** *C. albicans* genetic study found that loss of **Gpr1 or Gpa2 did not
        abolish glucose-induced cAMP signaling**, whereas loss of **Cdc25 or Ras1 did**.
    - reference_id: PMID:15667329
      supporting_text: it remains unclear whether Gpr1 senses sugars, as in Saccharomyces cerevisiae,
        or specific amino acids like methionine
    - reference_id: file:CANAL/PDE1/PDE1-hypotheses/pde1-glucose-gpcr-pathway/openscientist.md
      supporting_text: Partially supported but over-annotated
    - reference_id: file:CANAL/PDE1/PDE1-hypotheses/pde1-glucose-gpcr-pathway/openscientist.md
      supporting_text: prefer GO:1902660 (glucose-mediated signaling) without the GPCR qualifier
    additional_reference_ids:
    - PMID:15673611
    - PMID:15302825
    - PMID:30761119
    - PMID:15667329
    - file:CANAL/PDE1/PDE1-hypotheses/pde1-glucose-gpcr-pathway/openscientist.md
    proposed_replacement_terms:
    - id: GO:1902660
      label: negative regulation of glucose mediated signaling pathway
