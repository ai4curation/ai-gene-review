  review:
    summary: PAINT propagation (from S. pombe cgs2/pde1) of negative regulation of the adenylate cyclase-activating
      glucose-activated GPCR (Gpr1/Gpa2) signalling pathway.
    action: ACCEPT
    reason: In C. albicans, Pde1 (not Pde2) is responsible for terminating the cAMP spike triggered by
      glucose addition, which is generated through the Gpa2 G-alpha pathway; this matches the role of
      the S. cerevisiae and S. pombe orthologs. Pde1 performs the negative-regulatory step itself by hydrolysing
      the second messenger, so it executes this regulation.
