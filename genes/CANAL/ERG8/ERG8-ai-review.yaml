  title: Nonorthologous gene displacement of phosphomevalonate kinase.
  findings:
  - statement: >-
      Phosphomevalonate kinase catalyzes phosphorylation of 5-phosphomevalonate to
      5-diphosphomevalonate in the mevalonate pathway.
    supporting_text: >-
      Phosphomevalonate kinase (PMK; EC 2.7.4.2) catalyzes the phosphorylation of
      5-phosphomevalonate into 5-diphosphomevalonate, an essential step in isoprenoid
      biosynthesis via the mevalonate pathway.
    reference_section_type: ABSTRACT
  - statement: >-
      ERG8-type PMKs occur in eubacteria, fungi and plants, whereas animal PMVK enzymes are
      nonorthologous.
    supporting_text: >-
      orthologues of ERG8 are present in eubacteria, fungi, and plants, while orthologues of
      human PMK are found only in animals
    reference_section_type: ABSTRACT
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Abstract cached; supports the fungal/plant GHMP ERG8 family and the PMK reaction.
