        source_label: PTN000781523
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          PTN000781523 is a Eukaryota-level node seeded only by Arabidopsis
          AT1G31910 and over-propagates a plant peroxisomal PMK localization to
          fungal cytosolic ERG8 proteins.
    supported_by:
    - reference_id: file:interpro/panther/PTHR31814/PTHR31814-review.yaml
      supporting_text: >-
        Peroxisome is removed by both the S. cerevisiae ERG8 and S. pombe erg8 reviews:
