taxon:
  id: NCBITaxon:237561
  label: Candida albicans SC5314
description: >-
  Candida albicans ERG8 encodes a GHMP-family phosphomevalonate kinase that phosphorylates
  5-phosphomevalonate with ATP to produce 5-diphosphomevalonate in the cytoplasmic mevalonate
  pathway. The reaction supplies isopentenyl diphosphate for farnesyl diphosphate production
  and downstream ergosterol biosynthesis, using the fungal/plant ERG8-type PMK fold rather than
  the unrelated animal PMVK fold.
