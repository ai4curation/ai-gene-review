  review:
    summary: >-
      IBA to peroxisome derives from Eukaryota-level PAINT node PTN000781523,
      seeded only by Arabidopsis PMK. The family review judged this placement
      in need of pruning for fungal ERG8 members.
    action: REMOVE
    reason: >-
      PTN000781523 places a single Arabidopsis-seeded peroxisomal PMK
      assertion above the plant-fungal split. Candida ERG8 ends in IGL rather
      than a canonical PTS1 motif and is expected to execute its mevalonate
      pathway step in the cytosol.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
