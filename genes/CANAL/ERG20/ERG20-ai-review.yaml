id: A0A1D8PH78
gene_symbol: ERG20
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:237561
  label: Candida albicans SC5314
description: >-
  ERG20 (CAALFM_C204580WA; UniProt A0A1D8PH78) encodes the Candida albicans
  farnesyl diphosphate synthase, a soluble FPP/GGPP-synthase-family
  trans-prenyltransferase in central isoprenoid metabolism. ERG20 performs the
  two Mg2+-dependent, head-to-tail condensations that convert dimethylallyl
  diphosphate and two isopentenyl diphosphate molecules first to geranyl
  diphosphate and then to (2E,6E)-farnesyl diphosphate, the C15 isoprenoid
  branch point for ergosterol and other sterol/non-sterol isoprenoids.
