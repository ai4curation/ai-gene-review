suggested_questions:
- question: Which direct Mkc1 substrates connect activation of the Mkk2-Mkc1 cascade to 
    Cek1/GSC1/CRH11 expression, chitin-synthase localization, invasive growth, and 
    biofilm-specific transcription?
suggested_experiments:
- description: Construct an analog-sensitive MKC1 allele and perform acute inhibitor 
    phosphoproteomics after caspofungin, tunicamycin, zymolyase, and semisolid-surface 
    stimulation to separate direct Mkc1 substrates from secondary outputs of cell-wall 
    remodeling.
