suggested_questions:
- question: Which direct Mkc1 substrates connect cell-wall stress and
    contact-induced PKC-MAPK activation to chitin-synthase expression, glucan
    masking, and biofilm architecture in Candida albicans?
suggested_experiments:
- description: Use an analog-sensitive MKC1 allele with acute cell-wall stress,
    contact induction, and caspofungin treatment followed by quantitative
    phosphoproteomics and ChIP/RNA-seq of downstream transcription factors to
    separate direct Mkc1 substrates from indirect CWI remodeling outputs.
