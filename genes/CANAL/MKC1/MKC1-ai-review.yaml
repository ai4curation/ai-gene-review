- description: 'MAP kinase activity in the Candida cell-wall-integrity pathway: Mkc1 is the terminal
    Ser/Thr MAP kinase that responds to Mkk2-dependent activation and drives cell-wall remodeling,
    contact-dependent invasive growth and biofilm maturation, and compensatory chitin responses
    during echinocandin stress.'
