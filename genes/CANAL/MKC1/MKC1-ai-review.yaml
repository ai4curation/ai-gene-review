id: Q5AAG6
gene_symbol: MKC1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:237561
  label: Candida albicans SC5314
description: 'Mkc1 is the cell-wall-integrity mitogen-activated protein kinase of Candida albicans.
  It is activated by Mkk2-dependent phosphorylation in response to cell-wall or membrane perturbation,
  surface contact, oxidative stress, temperature shifts, and echinocandins, and it promotes fungal
  cell-wall construction, contact-dependent invasive filamentation, biofilm maturation, and caspofungin-induced
  chitin remodeling.'
