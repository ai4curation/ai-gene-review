id: Q5AAG6
gene_symbol: MKC1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:237561
  label: Candida albicans SC5314
description: 'Candida albicans MKC1 encodes the Slt2/Spm1-family MAP kinase of the
  cell-wall-integrity pathway. Mkc1 is activated downstream of the Pkc1-Mkk2 module
  during cell-wall and surface-contact stress, phosphorylates protein substrates as
  a serine/threonine MAPK, and supports fungal cell-wall construction, chitin-mediated
  caspofungin remodeling, invasive filamentous growth, biofilm development, thermal
  and oxidative stress responses, and systemic virulence phenotypes.'
