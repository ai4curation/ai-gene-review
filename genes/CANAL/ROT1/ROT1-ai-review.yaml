- term:
    id: GO:0007118
    label: budding cell apical bud growth
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN001999057
  - SGD:S000004813
  review:
    summary: >-
      The Saccharomycetales bud-growth row is plausible for Candida albicans
      but secondary to Rot1's ER maturation role.
    action: KEEP_AS_NON_CORE
    reason: >-
      PTN001999057 is restricted to the budding-yeast branch and therefore does
      not propagate to fission yeast; C. albicans ROT1 sits inside that
      Saccharomycetales clade. The row reflects a downstream morphogenesis
      outcome of defective ER protein maturation and cell-wall integrity rather
      than the core Rot1 activity.
    additional_reference_ids:
    - PMID:17606994
    - PMID:42042339
    supported_by:
    - reference_id: PMID:17606994
      supporting_text: >-
        First, it is required for the maintenance of apical growth during bud
        growth.
    - reference_id: PMID:42042339
      supporting_text: >-
        The rot1Δ/TRpROT1 mutant failed to form filaments under doxycycline
        repression, although residual hyphae were visible when grown on Spider
        medium.
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      source_entities:
      - source_id: PANTHER:PTN001999057
        source_status: SUPPORTS_TRANSFER
        comment: >-
          The bud-growth row is a Saccharomycetales-specific Rot1 IBD and is
          consistent with C. albicans morphogenesis phenotypes, but it is a
          non-core consequence of the ER folding and cell-wall defect.
