suggested_questions:
- question: >-
    Is CaRot1 directly associated with the C. albicans OST complex, as
    S. cerevisiae Rot1 is with Ost3, or does it regulate N-glycosylation
    indirectly through ER homeostasis?
suggested_experiments:
- experiment_type: affinity purification and glycosylation occupancy profiling
  hypothesis: >-
    C. albicans Rot1 directly supports a subset of OST-dependent glycoprotein
    clients.
  description: >-
    Tag CaRot1 at the native locus, identify ER glycosylation partners by
    affinity purification or proximity labeling, and compare site-specific
    N-glycan occupancy after ROT1 repression.
