id: Q5ABP8
gene_symbol: ROT1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:237561
  label: Candida albicans SC5314
description: >-
  ROT1 encodes the Candida albicans member of the conserved fungal Rot1 family.
  Correctly decoded CaRot1 complements lethal S. cerevisiae rot1 loss, and
  reduced ROT1 expression in C. albicans impairs N-linked glycosylation,
  early lipid-linked oligosaccharide synthesis, ER-stress tolerance, cell-wall
  integrity, and filamentation. These phenotypes are consistent with the
  conserved ER membrane chaperone or chaperone-associated glycoprotein
  maturation role established for budding-yeast Rot1.
