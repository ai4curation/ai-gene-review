- id: PMID:11566881
  title: 'Sorting of proteins into multivesicular bodies: ubiquitin-dependent and
    -independent targeting.'
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Cached full text verified; provides direct S. cerevisiae Phm5/Ppn1
      vacuolar membrane-cargo evidence used as the orthologous support for
      refining the C. albicans generic vacuolar-membrane rows.
  findings:
  - statement: >-
      S. cerevisiae Phm5/Ppn1 is a membrane cargo protein sorted through late
      endosomes and multivesicular bodies to the vacuole; when ubiquitin-mediated
      internal-vesicle sorting is impaired, Phm5 accumulates on the vacuole
      membrane.
    supporting_text: >-
      We detected three new proteins that follow the same pathway as Cps1p: a
      polyphosphatase (Phm5p), a protein with homology to haem oxygenases
      (Hmx1p) and a possible proton transporter (Sna3p).
    reference_section_type: RESULTS
