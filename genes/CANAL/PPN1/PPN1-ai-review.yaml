- id: PMID:35575514
  title: Blocking Polyphosphate Mobilization Inhibits Pho4 Activation and Virulence
    in the Pathogen Candida albicans.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Cached full text verified; directly supports a redundant in vivo
      polyphosphate-mobilization role for C. albicans PHM5/PPN1 and PPX1.
  findings:
  - statement: >-
      C. albicans PHM5/PPN1 and PPX1 function redundantly in polyphosphate
      mobilization; reintegrating either gene into ppn1Delta ppx1Delta cells
      restored polyphosphate mobilization during phosphate starvation.
    supporting_text: >-
      These results indicate that Ppx1 and Ppn1 have redundant functions in
      releasing Pi from polyP in C. albicans.
