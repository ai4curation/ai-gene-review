suggested_questions:
- question: >-
    Is PHM5/Ppn1 proteolytically processed and activated in C. albicans
    vacuoles as in S. cerevisiae?
- question: >-
    Do Ppn2 or Ddp1 account for the residual polyphosphate mobilization seen in
    C. albicans ppn1Delta ppx1Delta cells during phosphate starvation?
suggested_experiments:
- hypothesis: >-
    C. albicans PHM5/Ppn1 hydrolyzes long-chain vacuolar polyphosphate by both
    endo- and exopolyphosphatase modes.
  description: >-
    Epitope-tag and purify full-length or proteolytically processed PHM5/Ppn1,
    assay its hydrolysis of long-chain inorganic polyphosphate in vitro, and
    pair the assay with vacuolar localization and rescue experiments in
    ppn1Delta ppx1Delta cells.
  experiment_type: biochemical genetics
