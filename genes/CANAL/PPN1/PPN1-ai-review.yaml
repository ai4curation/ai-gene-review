  label: Candida albicans SC5314
description: >-
  PHM5 encodes the Candida albicans SC5314 Ppn1 endopolyphosphatase-family
  enzyme in the conserved fungal Ppn1 clade, with a vacuolar type-II membrane
  precursor topology propagated from yeast Ppn1. Its metallo-dependent
  phosphatase domain is inferred to hydrolyze vacuolar inorganic polyphosphate
  internally and from chain ends, and C. albicans Ppn1 acts redundantly with Ppx1
  to mobilize polyphosphate during phosphate limitation.
