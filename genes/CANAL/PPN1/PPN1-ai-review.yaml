  review:
    summary: >-
      PAINT assigns endopolyphosphatase activity at the fungal Ppn1 node
      PTN000818947, seeded by the S. cerevisiae PPN1 experimental record.
    action: ACCEPT
    reason: >-
      A0A1D8PQR0 is the C. albicans PTHR10340:SF55 representative and falls in
