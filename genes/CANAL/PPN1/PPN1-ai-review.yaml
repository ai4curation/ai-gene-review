- term:
    id: GO:0006798
    label: polyphosphate catabolic process
  evidence_type: IGI
  original_reference_id: PMID:35575514
  qualifier: involved_in
  supporting_entities:
  - CGD:CAL0000180862
  review:
    summary: >-
      CGD manually curates C. albicans PHM5/PPN1 to polyphosphate catabolism
      from the ppn1Delta ppx1Delta genetics and PPN1 reintegration evidence.
    action: ACCEPT
    reason: >-
      Ahmed et al. showed that deleting both PPN1 and PPX1 impairs
      polyphosphate mobilization during phosphate limitation and that
      reintegrating PPN1 restores this mobilization. That redundant-genetic
      phenotype supports PHM5/PPN1 involvement in polyphosphate catabolism.
    supported_by:
    - *pmid_35575514_polyp
