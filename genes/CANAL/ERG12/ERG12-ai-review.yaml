gene_symbol: ERG12
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:237561
  label: Candida albicans SC5314
description: ERG12 encodes the Candida albicans GHMP-family mevalonate kinase, a soluble cytosolic
  enzyme of the mevalonate pathway. The kinase uses ATP to phosphorylate (R)-mevalonate to
  (R)-5-phosphomevalonate, producing the first phosphorylated intermediate in the three-step
  conversion of mevalonate to isopentenyl diphosphate. This upstream isoprenoid-biosynthetic
  step supplies precursors for ergosterol biosynthesis in fungi.
