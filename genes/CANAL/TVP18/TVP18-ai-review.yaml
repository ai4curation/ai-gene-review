  review:
    summary: >-
      The Golgi-membrane IBA follows from a fungal TVP18-family PAINT node
      seeded by Saccharomyces cerevisiae TVP18.
    action: ACCEPT
    reason: >-
      Accept as the conserved core cellular location. PTN001779222 places
      Golgi membrane on the fungal TVP18 ancestor, and the Candida protein is a
      PTHR13314:SF2 member with the same multipass topology and
      similarity-inferred Golgi membrane localization.
    supported_by:
    - reference_id: file:interpro/panther/PTHR13314/PTHR13314-paint.tsv
      supporting_text: "PTHR13314\tPTN001779222\tGO:0000139\tC\tIBD\tfalse\tSGD:S000004675\ttaxon:4890\t20240205"
    - reference_id: PMID:16107716
      supporting_text: >-
        We found six uncharacterized but evolutionarily conserved proteins and
        named them Svp26 ( S ed5 compartment v esicle p rotein of 26 kDa),
        Tvp38, Tvp23, Tvp18, Tvp15 ( T lg2 compartment v esicle p roteins of
        38 , 23 , 18 , and 15 kDa), and Gvp36 ( G olgi v esicle p rotein of
        36 kDa).
      reference_section_type: ABSTRACT
    - reference_id: PMID:33263222
      supporting_text: >-
        we identified three strains with irreversible perturbations in the
        stacking of the Golgi cisternae, all of which had disruption in genes
