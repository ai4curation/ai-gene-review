- term:
    id: GO:0016192
    label: vesicle-mediated transport
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - FB:FBgn0261722
  - MGI:MGI:1924317
  - PANTHER:PTN001779219
  - SGD:S000004675
  review:
    summary: >-
      Vesicle-mediated transport is a broad but defensible ancestral
      TVP18/calcium-channel-flower-family PAINT claim.
    action: ACCEPT
    reason: >-
      Accept as the conserved process for this otherwise mechanistically dark
      Golgi membrane protein. PTN001779219 places vesicle-mediated transport on
      an ancestral TVP18/calcium-channel-flower-family node using descendant
      evidence including Drosophila fwe and S. cerevisiae TVP18, and there is
      no Candida-specific evidence for loss or divergence from the fungal Golgi
      trafficking role.
    supported_by:
    - reference_id: file:interpro/panther/PTHR13314/PTHR13314-paint.tsv
      supporting_text: "PTHR13314\tPTN001779219\tGO:0016192\tP\tIBD\tfalse\tFB:FBgn0261722|SGD:S000004675\ttaxon:33154\t20260828"
