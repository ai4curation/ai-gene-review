  review:
    summary: >-
      This CGD molecular-function root row is an ND placeholder; no specific
      molecular activity is established for C. albicans TVP18.
    action: ACCEPT
    reason: >-
      ACCEPT under the ND acceptance rule (projects/NO_DATA.md). The evidence this
      review cites for the molecular function is inferred (from orthologs, family
      membership or sequence features) or comes from other species; none of it is
      literature on this gene product in this species. This was judged from the review's
      own content during the NO_DATA re-action pass, not from a new literature search.
      Earlier action: KEEP_AS_NON_CORE. The TVP18 knockout study cited (PMID:33263222)
      reports a Golgi phenotype, not a molecular activity.
