- id: PMID:17178117
  title: "Tvp38, Tvp23, Tvp18 and Tvp15: novel membrane proteins in the Tlg2-containing
    Golgi/endosome compartments of Saccharomyces cerevisiae."
  findings:
  - statement: S. cerevisiae Tvp18 acts with Tvp23, Tvp15, and Yip1-family proteins
      in late Golgi/endosomal compartments.
    supporting_text: Tvp23, Tvp18 and Tvp15 are in an interactive network with
      Yip1-family proteins, Yip4 and Yip5.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified abstract-only S. cerevisiae TVP-family paper; supports the
      Golgi/endosomal trafficking role of the SGD PAINT seed rather than directly
      assaying Candida albicans TVP18.
- id: PMID:33263222
  title: Knockout of RSN1, TVP18 or CSC1-2 causes perturbation of Golgi cisternae
    in Pichia pastoris.
  findings:
  - statement: Knockout of the Komagataella phaffii TVP18 ortholog perturbs Golgi
      cisternal stacking.
    supporting_text: we identified three strains with irreversible perturbations
      in the stacking of the Golgi cisternae, all of which had disruption in
      genes that encode proteins with annotated function as or homology to
      calcium/calcium permeable ion channels.
    reference_section_type: ABSTRACT
  - statement: The K. phaffii Golgi-stacking phenotype suggests a calcium-related
      role but does not directly demonstrate channel activity.
    supporting_text: >-
      suggest that Ca2+ concentration, homeostasis or signalling may play a
      significant role for Golgi stacking in this organism and should be
      investigated in other organisms.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified abstract-only functional study in Komagataella phaffii;
      provides direct fungal TVP18 loss-of-function context for Golgi morphology
      but is not a direct Candida albicans assay.
