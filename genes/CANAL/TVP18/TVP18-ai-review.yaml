gene_symbol: TVP18
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:237561
  label: Candida albicans SC5314
description: >-
  TVP18 encodes a conserved TVP18/calcium-channel-flower-family multipass
  membrane protein. Candida albicans TVP18 belongs to the fungal TVP18
  subfamily whose characterized Saccharomyces cerevisiae members act at the
  Golgi membrane in vesicle trafficking, but the precise molecular activity of
  the fungal proteins has not been established.
