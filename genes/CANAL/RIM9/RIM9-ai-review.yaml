core_functions:
- description: >-
    RIM9 is a PalI/Rim9-family multipass membrane component required for
    neutral and alkaline ambient-pH signaling through the Candida Rim101
    pathway, enabling Rim101-dependent downstream stress and morphogenesis
    responses.
  directly_involved_in:
  - id: GO:0036244
    label: cellular response to neutral pH
  - id: GO:0071469
    label: cellular response to alkaline pH
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:37888991
    supporting_text: >-
      The Rim pathway consists of an intricate sensor complex in the plasma
      membrane (Rim8, Rim9, and Rim21/Dfg16)
  - reference_id: PMID:19230847
    supporting_text: >-
      Here we report that, in C. albicans, the RIM9 homologue is required for
      Rim-dependent signalling.
proposed_new_terms: []
suggested_questions:
- question: >-
    What is the direct molecular activity of C. albicans RIM9 within the
    Rim21/Rim8 plasma-membrane sensing complex: signal relay,
    scaffold/adaptor function, membrane organization, or another activity?
- question: >-
    Does Candida RIM9 localize to hyphal tips, bud tips, or division sites under
    alkaline pH, starvation, or filamentation conditions?
suggested_experiments:
- description: >-
    Construct a functional GFP-RIM9 or RIM9-GFP allele and image it with plasma
    membrane, hyphal-tip, and bud-neck markers during yeast growth, neutral-pH
    filamentation, alkaline-pH stress, and starvation.
  experiment_type: live-cell fluorescence microscopy
- description: >-
    Reconstitute Candida Rim21/Dfg16, Rim8, and RIM9 at controlled expression
    levels and test whether RIM9 is required for sensor-complex assembly,
    membrane residency, or signal-dependent endocytosis after alkaline pH or
    LL-37 exposure.
  experiment_type: protein localization and complex assembly assay
knowledge_gaps:
- gap_statement: >-
    The direct molecular activity and polarized localization of Candida RIM9 are
    unknown.
  boundary: >-
    RIM9 is required for Rim-dependent signaling and multiple CGD-curated
    stress and filamentation phenotypes, but the cached Candida literature does
    not directly assay GFP-RIM9 localization or define whether RIM9 functions
    as a scaffold, membrane organizer, signal-relay subunit, or trafficking
    factor.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
