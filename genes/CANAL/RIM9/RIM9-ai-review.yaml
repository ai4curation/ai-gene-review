gene_symbol: RIM9
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:237561
  label: Candida albicans SC5314
description: >-
  RIM9 is a short PalI/Rim9-family multipass membrane protein in Candida
  albicans that acts in the upstream Rim101 ambient-pH signaling pathway. It is
  required for Rim-dependent signaling and contributes to Rim101-dependent
  neutral/alkaline pH, starvation, filamentation, lithium, and LL-37 stress
  phenotypes.
