  evidence_type: ND
  original_reference_id: GO_REF:0000015
  qualifier: enables
  review:
    summary: >-
      ACCEPT: Candida RIM9 has a clear pathway role but no resolved elemental
      molecular function.
    action: ACCEPT
    reason: >-
      The cached Candida papers establish that short-form RIM9, not the
      long-form SRD1 paralog, is required for Rim101 pathway signaling and
      alkaline-associated stress responses, but they do not resolve whether the
      direct molecular activity is signal relay, scaffolding, membrane
      organization, or another activity. The ND molecular_function row therefore
      remains accurate.
    additional_reference_ids:
    - PMID:19230847
    - PMID:22381911
    supported_by:
    - reference_id: PMID:19230847
      supporting_text: >-
        Here we report that, in C. albicans, the RIM9 homologue is required for
        Rim-dependent signalling.
    - reference_id: PMID:22381911
      supporting_text: >-
        challenges in C. albicans show RIM9 but not SRD1 is important for proper
        response and hyphal formation.
