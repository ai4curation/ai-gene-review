  review:
    summary: >-
      Esa1 acetylates nucleosomal histone tails but is not itself part of the
      nucleosome.
    action: REMOVE
    reason: >-
      This automatic transfer has the wrong cellular-component role. ESA1-family
      enzymes act in NuA4 complexes on nucleosomal histones, whereas the
