id: Q5A7Q2
gene_symbol: ESA1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:237561
  label: Candida albicans SC5314
description: >-
  ESA1 encodes the Candida albicans ESA1/MYST histone acetyltransferase, a
  chromatin enzyme and catalytic subunit of NuA4-family complexes. Esa1
  acetylates histone H4, especially H4K5 and H4K12 in C. albicans cells, and
  contributes to NuA4-dependent regulation of nuclear transcription,
  filamentous growth, temperature adaptation, and genotoxic and oxidative stress
  resistance.
