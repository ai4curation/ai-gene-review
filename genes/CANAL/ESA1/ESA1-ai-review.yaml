suggested_questions:
- question: >-
    How do Candida Esa1 scaffold functions and HAT-domain catalytic functions
    partition the positive and negative effects on filamentation seen in null
    ESA1 mutants versus the esa1E372Q catalytic mutant?
- question: >-
    Are the crotonyltransferase and 2-hydroxyisobutyryltransferase activities
    inferred from S. cerevisiae ESA1 and S. pombe Mst1 measurable for Candida
    Esa1 in vivo, and are histones the physiological substrates?
- question: >-
    What is the ESA1 evidence in PMID:40988556 for regulation of phenotypic
    switching?
suggested_experiments:
- description: >-
    Compare wild-type, ESA1 deletion or depletion, and esa1E372Q strains by
    H4K5ac, H4K12ac, H4K16ac, H3K9ac, Esa1 occupancy, and RNA polymerase II
    ChIP-seq through a serum-induction time course to separate Esa1 catalytic
    and noncatalytic effects on hypha-specific promoters.
- description: >-
    Repeat the Esa1 in vitro acyltransferase assay with purified Candida NuA4
    using acetyl-CoA, crotonyl-CoA, and 2-hydroxyisobutyryl-CoA, and pair the
    assay with targeted H4 acyl-lysine mass spectrometry in ESA1 depletion or
    catalytic-mutant strains.
