- id: PMID:18685084
  title: Efg1-mediated recruitment of NuA4 to promoters is required for hypha-specific
    Swi/Snf binding and activation in Candida albicans.
  findings:
  - statement: >-
      The C. albicans NuA4 module acts at hypha-specific promoters and is
      required for normal H4 acetylation, Swi/Snf recruitment, and
      hypha-specific gene activation.
    supporting_text: >-
      These results indicate that H4 acetylation by the NuA4 complex is
      important for hyphal morphogenesis and the induction of hypha-specific
      genes.
- id: PMID:23355007
  title: Distinct and redundant roles of the two MYST histone acetyltransferases Esa1
    and Sas2 in cell growth and morphogenesis of Candida albicans.
  findings:
  - statement: >-
      C. albicans Esa1 is the NuA4 catalytic subunit and is required for normal
      H4K5 and H4K12 acetylation.
    supporting_text: >-
      At all temperatures examined, the esa1/esa1 mutant cells exhibited a
      significantly decreased overall level of H4 acetylation.
  - statement: >-
      ESA1 deletion blocks filamentous growth and hypha-specific gene induction.
    supporting_text: >-
      deletion of C. albicans ESA1 blocked filament formation under all hyphal
      induction conditions examined
  - statement: >-
      ESA1 is required for resistance to genotoxic and oxidative stresses.
    supporting_text: >-
      The esa1/esa1 mutant cells displayed sensitivity to DNA damage induced by
      HU, MMS, and CPT
- id: PMID:40795216
  title: Histone acetylation by SAGA complex but not by NuA4 complex is required for
    filamentation program in Candida albicans.
  findings:
  - statement: >-
      The Esa1 HAT-domain mutant does not reduce H4 acetylation at assayed
      hyphal genes.
    supporting_text: >-
      Surprisingly, the Esa1 HAT domain mutation did not impair H4 acetylation
      at hyphal genes
