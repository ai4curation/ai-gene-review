  supporting_entities:
  - UniProtKB:Q08649
  - sgd:YOR244W
  review:
    summary: >-
      rDNA heterochromatin formation is demonstrated for budding-yeast ESA1 but
      not for Candida Esa1.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      S. cerevisiae Esa1 is required for rDNA-locus transcriptional silencing,
      so the donor process is not unsupported yeast biology. The cached Candida
      experiments directly support H4 acetylation, transcriptional regulation,
      filamentation, and stress resistance rather than this specialized
      chromatin-silencing process.
