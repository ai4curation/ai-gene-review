id: Q5AJD2
gene_symbol: ALG8
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:237561
  label: Candida albicans SC5314
description: >-
  ALG8 is the Candida albicans ortholog of the conserved ALG8
  dolichyl-phosphate-glucose glucosyltransferase. It is a multi-pass
  endoplasmic-reticulum membrane enzyme that adds the second glucose to
  Glc1Man9GlcNAc2-PP-dolichol during lipid-linked oligosaccharide assembly,
  producing the Glc2Man9GlcNAc2-PP-dolichol precursor used for protein
  N-linked glycosylation.
