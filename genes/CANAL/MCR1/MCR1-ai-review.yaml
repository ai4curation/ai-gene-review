- id: PMID:10622712
  title: >-
    Biodiversity of the P450 catalytic cycle: yeast cytochrome b5/NADH
    cytochrome b5 reductase complex efficiently drives the entire sterol
    14-demethylation (CYP51) reaction.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Abstract-only cache; the reconstitution supports the biochemical
      possibility that Candida CYP51 can accept electrons from a yeast
      microsomal cytochrome-b5/NADH-cytochrome-b5-reductase system, but that
      system corresponds to the CBR1 branch rather than mitochondrial MCR1.
  findings:
  - statement: >-
      Lamb et al. reconstituted Candida CYP51-mediated sterol
      14alpha-demethylation using purified proteins and showed that a yeast
      microsomal cytochrome-b5/NADH-cytochrome-b5-reductase electron-transfer
      chain can support the reaction in vitro.
    supporting_text: >-
      fungal CYP51 mediated sterol 14alpha-demethylation
    reference_section_type: ABSTRACT
