gene_symbol: ERG11
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:237561
  label: Candida albicans SC5314
description: Candida albicans ERG11 encodes lanosterol 14-alpha-demethylase, the endoplasmic-reticulum
  membrane CYP51 heme-thiolate cytochrome P450 that removes the 14alpha methyl group from lanosterol and
  related sterols during fungal ergosterol biosynthesis. Purified CaCYP51 binds lanosterol and eburicol and
  supports NADPH-cytochrome P450 reductase reconstitution assays; the enzyme is also the direct target of azole
  antifungals, so ERG11 variants, expression changes, and reduced dosage reshape azole susceptibility.
