id: Q59P03
gene_symbol: CBR1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:237561
  label: Candida albicans SC5314
description: >-
  Candida albicans CBR1 encodes the CBR1-like membrane-anchored
  NADH-cytochrome b5 reductase of the fungal NADH-cytochrome b5
  reductase family. Cbr1 has the conserved FAD- and NADH-binding domains and a
  single N-terminal transmembrane helix, was recovered in a Candida plasma
  membrane proteome, and is inferred from the characterized Saccharomyces
  cerevisiae ortholog to reduce cytochrome b5 for sterol-biosynthetic
  cytochrome P450 electron transfer and to reduce the iron protein Dph3 for
  radical-SAM tRNA and diphthamide chemistry.
core_functions:
- description: >-
    FAD-dependent reduction of ferricytochrome b5 by NADH, inferred for Candida
    CBR1 from the conserved CBR1-like NADH-cytochrome b5 reductase subfamily;
    in yeasts, this electron-transfer system can feed sterol-biosynthetic
    cytochrome P450s.
  molecular_function:
    id: GO:0090524
    label: cytochrome-b5 reductase activity, acting on NADH
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: file:interpro/panther/PTHR19370/PTHR19370-paint.tsv
    supporting_text: "PTHR19370\tPTN001064671\tGO:0004128\tF\tIBD\tfalse"
  - reference_id: file:genes/CANAL/CBR1/CBR1-uniprot.txt
    supporting_text: "Rhea:RHEA:46680"
- description: >-
    NADH-dependent reduction of Dph3, inferred from S. cerevisiae Cbr1, to
    supply reducing equivalents to radical-SAM systems required for tRNA wobble
    uridine modification and the first step of diphthamide biosynthesis.
  proposed_molecular_function: NADH-dependent Dph3 reductase activity
  contributes_to_molecular_function:
    id: GO:0090560
    label: 2-(3-amino-3-carboxypropyl)histidine synthase activity
  directly_involved_in:
  - id: GO:0002926
    label: tRNA wobble base 5-methoxycarbonylmethyl-2-thiouridinylation
  - id: GO:0017183
    label: protein histidyl modification to diphthamide
  locations:
  - id: GO:0005886
    label: plasma membrane
  in_complex:
    id: GO:0120513
    label: 2-(3-amino-3-carboxypropyl)histidine synthase complex
  supported_by:
  - reference_id: PMID:27694803
    supporting_text: >-
      Here, using a proteomic approach, we identified Saccharomyces cerevisiae
      cytochrome b5 reductase (Cbr1) as a NADH-dependent reductase for Dph3.
    reference_section_type: ABSTRACT
  - reference_id: PMID:34154323
    supporting_text: >-
      Under physiological conditions, the reduction of the [4Fe–4S] clusters in
      Dph1–Dph2 requires Dph3 and Cbr1.
