- id: PMID:19824013
  title: Analysis of Candida albicans plasma membrane proteome.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Abstract-only cache; the abstract verifies the C. albicans
      plasma-membrane subproteome workflow but not the individual CBR1 peptide
      call curated by CGD.
  findings:
  - statement: >-
      Cabezón et al. used a C. albicans plasma membrane subproteomics workflow
      and LC-MS/MS to identify 214 membrane proteins; CGD used the full text as
      direct support for CBR1 localization at the plasma membrane.
    supporting_text: >-
      After LC-MS/MS analysis using both a MALDI-TOF/TOF and a linear ion trap
      quadrupole, a total of 214 membrane proteins were identified
    reference_section_type: ABSTRACT
- id: PMID:27694803
  title: Cbr1 is a Dph3 reductase required for the tRNA wobble uridine modification.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full-text cache; directly characterizes S. cerevisiae Cbr1 as the major
      NADH-dependent Dph3 reductase supporting mcm5s2U wobble uridine
      modification and, when electron demand is raised, diphthamide formation.
  findings:
  - statement: >-
      S. cerevisiae Cbr1 was identified as an NADH-dependent Dph3 reductase,
      rapidly reduced Dph3 in vitro when NADH was supplied, and provided the
      Dph3-dependent reducing system for the Dph1-Dph2 radical-SAM enzyme.
    supporting_text: >-
      Upon addition of NADH to initiate the reaction, Dph3 was rapidly reduced
      by Cbr1
  - statement: >-
      Loss of CBR1 alone partially impaired mcm5s2U tRNA wobble uridine
      modification, and combined loss of CBR1 and MCR1 further reduced this
      Dph3-dependent modification.
    supporting_text: >-
      CBR1 deletion alone conferred some resistance to γ-toxin, suggesting
      that formation of tRNA modifications was partially impaired
- id: PMID:34154323
  title: >-
    Dph3 Enables Aerobic Diphthamide Biosynthesis by Donating One Iron Atom to
    Transform a [3Fe-4S] to a [4Fe-4S] Cluster in Dph1-Dph2.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Full-text cache; refines the Dph3 mechanism downstream of Cbr1 and
      confirms that Cbr1/Dph3/NADH is the physiological reduction system that
      enables Dph1-Dph2 activity.
  findings:
  - statement: >-
      Dph3 and Cbr1 supply the physiological reducing system needed for the
      Dph1-Dph2 radical-SAM complex during aerobic diphthamide biosynthesis.
    supporting_text: >-
      Under physiological conditions, the reduction of the [4Fe–4S] clusters in
      Dph1–Dph2 requires Dph3 and Cbr1.
- id: PMID:10622712
  title: >-
    Biodiversity of the P450 catalytic cycle: yeast cytochrome b5/NADH
    cytochrome b5 reductase complex efficiently drives the entire sterol
    14-demethylation (CYP51) reaction.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Abstract-only cache; supports a possible CBR1/b5 electron-transfer input
      into sterol demethylation with purified C. albicans CYP51 and S.
      cerevisiae b5/b5R proteins, but does not establish Candida CBR1 as an in
      vivo ER sterol reductase.
  findings:
  - statement: >-
      Purified fungal cytochrome b5 and NADH-cytochrome b5 reductase can
      reconstitute sterol 14alpha-demethylation by C. albicans CYP51 in vitro,
      providing a possible alternative to NADPH-cytochrome P450 reductase.
    supporting_text: >-
      Using purified proteins including Candida albicans CYP51 and yeast NADPH
      cytochrome P450 reductase, cytochrome b5 and NADH cytochrome b5
      reductase, we show here that fungal CYP51 mediated sterol
      14alpha-demethylation can be wholly and efficiently supported by the
      cytochrome b5/NADH cytochrome b5 reductase electron transport system.
    reference_section_type: ABSTRACT
- id: file:genes/CANAL/CBR1/CBR1-uniprot.txt
  title: UniProt record for Candida albicans CBR1
  findings:
  - statement: >-
      The C. albicans CBR1 Swiss-Prot record classifies Q59P03 as EC 1.6.2.2
      and as PANTHER subfamily PTHR19370:SF184, the CBR1-like branch, and
      infers electron transfer to Dph3 and to sterol-biosynthetic enzymes from
      the S. cerevisiae ortholog.
    supporting_text: "PANTHER; PTHR19370:SF184; NADH-CYTOCHROME B5 REDUCTASE-LIKE"
- id: file:interpro/panther/PTHR19370/PTHR19370-paint.tsv
  title: PTHR19370 PAINT annotations
  findings:
  - statement: >-
      PAINT node PTN001064671 is the CBR1-like Saccharomycetales ancestor used
      to propagate cytochrome-b5 reductase activity and plasma-membrane
      localization to C. albicans CBR1.
    supporting_text: "PTHR19370\tPTN001064671\tGO:0004128\tF\tIBD\tfalse"
proposed_new_terms:
- proposed_name: NADH-dependent Dph3 reductase activity
  proposed_definition: >-
    Catalysis of the reaction: 2 Fe(3+)-[Dph3] + NADH = 2 Fe(2+)-[Dph3] +
    NAD(+) + H(+).
  justification: >-
    RHEA:71231 captures the NADH-dependent reduction of Dph3, and
    PMID:27694803 shows that S. cerevisiae Cbr1 performs this reaction in the
    physiological reduction system for the Dph1-Dph2 and Elp3 radical-SAM
    enzymes. GO:0090560 describes the downstream 2-(3-amino-3-carboxypropyl)
    histidine synthase reaction catalyzed by Dph1-Dph2 rather than the CBR1
    reductase step.
  proposed_parent:
    id: GO:0016651
    label: oxidoreductase activity, acting on NAD(P)H
  supported_by:
  - reference_id: PMID:27694803
    supporting_text: >-
      Upon addition of NADH to initiate the reaction, Dph3 was rapidly reduced
      by Cbr1
suggested_questions:
- question: >-
    Should GO add an NADH-dependent Dph3 reductase molecular-function term for
    RHEA:71231 so CBR1-like reductases can be distinguished from the Dph1-Dph2
    2-(3-amino-3-carboxypropyl)histidine synthase itself?
- question: >-
    Does Candida CBR1 localize to the endoplasmic reticulum and mitochondrial
    outer membrane, as S. cerevisiae Cbr1 does, in addition to its detection in
    the plasma-membrane proteome?
- question: >-
    Does Candida CBR1 provide cytochrome-b5-dependent electrons to CYP51 or
    other sterol-biosynthetic P450s in vivo when NADPH-cytochrome P450
    reductase is limiting?
suggested_experiments:
- description: >-
    Endogenously tag C. albicans Cbr1 and combine confocal microscopy with
    membrane fractionation to test whether the protein occupies the ER,
    mitochondrial outer membrane, plasma membrane, or multiple membrane pools.
- description: >-
    Measure sterol intermediates and azole sensitivity in C. albicans CBR1
    deletion or depletion strains, with and without limiting NADPH-cytochrome
    P450 reductase, to determine whether Cbr1 supports CYP51 electron transfer
    in vivo.
