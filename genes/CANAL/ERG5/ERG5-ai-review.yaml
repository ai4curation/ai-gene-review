id: G1UB11
gene_symbol: ERG5
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:237561
  label: Candida albicans SC5314
description: >-
  ERG5 encodes the Candida albicans cytochrome P450 CYP61-family sterol C-22
  desaturase, a heme-dependent ER-membrane enzyme that introduces the
  C22-C23 double bond into the sterol side chain during late ergosterol
  biosynthesis. The C. albicans protein is a PTHR24286:SF228 member orthologous
  to the biochemically characterized Saccharomyces cerevisiae and Candida
  glabrata CYP61 enzymes, and a clinical C. albicans erg5 mutant accumulates
  ergosta-5,7-dienol with no detectable ergosterol.
