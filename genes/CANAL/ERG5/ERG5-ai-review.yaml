core_functions:
- description: >-
    ER-membrane CYP61 sterol C-22 desaturase that uses O2 and electrons from
    NADPH-cytochrome P450 reductase to introduce the C22-C23 sterol side-chain
    double bond in late ergosterol biosynthesis.
  molecular_function:
    id: GO:0000249
    label: C-22 sterol desaturase (NADPH) activity
  directly_involved_in:
  - id: GO:0006696
    label: ergosterol biosynthetic process
  locations:
  - id: GO:0005789
    label: endoplasmic reticulum membrane
  supported_by:
  - *canal_reaction
  - *canal_clinical
  - *canal_er
suggested_questions:
- question: >-
    Does the CA108 Erg5 insertion abolish all residual C-22 desaturase activity
    in complementation assays with a defined C. albicans erg5 deletion?
suggested_experiments:
- hypothesis: C. albicans Erg5 performs the conserved CYP61 C-22 desaturation reaction directly.
  description: >-
    Reconstitute purified Candida Erg5 or Erg5-containing microsomes with fungal
    NADPH-cytochrome P450 reductase and test conversion of 5-dehydroepisterol
    to the C-22-desaturated product by GC-MS.
  experiment_type: biochemistry
