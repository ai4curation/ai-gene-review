      supporting_text: >-
        The profiles of additional inhibitors of ergosterol biosynthesis,
        including terbinafine, lovastatin, and dyclonine, are described in Text
        S1
    - reference_id: PMID:15105135
      supporting_text: >-
        erg2 and erg16 mutant cells of C. albicans became hypersensitive
