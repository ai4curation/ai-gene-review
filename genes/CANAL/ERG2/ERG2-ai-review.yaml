  evidence_type: IMP
  original_reference_id: PMID:17604452
  qualifier: involved_in
  review:
    summary: >-
      ERG2 chemical-genetic response phenotypes are real but secondary to the
      core sterol-isomerase step.
    action: KEEP_AS_NON_CORE
    reason: >-
      Xu et al. used the CaFT heterozygous deletion pool to profile responses
      to inhibitory compounds and reports the additional ergosterol-biosynthesis
      inhibitor profiles in supplemental Text S1, Figure S2, and Table S1. The
      cached main text does not expose the ERG2-specific supplementary result,
      so this review defers to CGD for the row. The response phenotype is
      biologically plausible because ERG2 mutants alter membrane sterol
      composition and show altered susceptibility to multiple xenobiotics, but
      it is a downstream phenotype rather than the gene's core catalytic role.
    additional_reference_ids:
    - PMID:15105135
    supported_by:
