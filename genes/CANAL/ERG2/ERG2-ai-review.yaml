description: >-
  ERG2 encodes the Candida albicans sterol C-8 isomerase, an ER-membrane enzyme
  in the late ergosterol biosynthetic pathway. The protein catalyzes
  isomerization of the sterol B-ring double bond to convert fecosterol to
  episterol, feeding the final C-5 desaturase, C-22 desaturase, and C-24
  reductase reactions that produce ergosterol for fungal membranes.
