- term:
    id: GO:0034599
    label: cellular response to oxidative stress
  evidence_type: IMP
  original_reference_id: PMID:11349062
  qualifier: involved_in
  review:
    summary: >-
      The direct Candida mutant and overexpression phenotypes show that ALO1
      supports oxidative-stress resistance.
    action: KEEP_AS_NON_CORE
    reason: >-
      Disrupting ALO1 eliminated D-erythroascorbate and increased H2O2 and
      menadione sensitivity, while ALO1 overexpression increased survival under
      the same oxidants. This is a well-supported physiological outcome of the
      oxidase activity, not a separate core molecular function.
    supported_by:
    - reference_id: PMID:11349062
      supporting_text: >-
        The alo1/alo1 null mutants of C. albicans showed increased sensitivity
        towards oxidative stress. Overexpression of ALO1 made the cells more
        resistant to the same stress
      reference_section_type: ABSTRACT
