- id: PMID:7957197
  title: Characterisation of D-arabinono-1,4-lactone oxidase from Candida albicans
    ATCC 10231.
  findings:
  - statement: >-
      The C. albicans enzyme was purified from a mitochondrial fraction and
      characterized as an FAD-linked D-arabinono-1,4-lactone oxidase with
      alternate L-galactono-, L-gulono-, and L-xylono-1,4-lactone activities.
    supporting_text: >-
      D-Arabinono-1,4-lactone oxidase, which catalyses the final step in the
      biosynthesis of D-erythroascorbic acid, was purified 639-fold from the
      mitochondrial fraction of C. albicans
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Primary C. albicans ALO biochemistry paper supporting the exact oxidase
      activity, mitochondrial fraction, covalent flavin, and alternate
      sugar-lactone substrate rows.
- id: PMID:11349062
  title: Deficiency of D-erythroascorbic acid attenuates hyphal growth and virulence
    of Candida albicans.
  findings:
  - statement: >-
      Cloning and disruption of ALO1 showed that the gene encodes the enzyme
      required for D-arabinono-1,4-lactone oxidase activity and cellular
      D-erythroascorbate production.
    supporting_text: >-
      In the alo1/alo1 null mutants, the activity of
      D-arabinono-1,4-lactone oxidase was completely lost and
      D-erythroascorbic acid could not be detected
    reference_section_type: ABSTRACT
  - statement: >-
      C. albicans ALO1 was predicted to encode an integral membrane protein with
      a covalent-FAD binding site and a single transmembrane segment.
    supporting_text: >-
      predicted that the enzyme should be an integral membrane protein with a
      transmembrane segment
    reference_section_type: RESULTS
  - statement: >-
      Loss and overexpression of ALO1 altered oxidative-stress resistance, and
      alo1/alo1 mutants had conditional hyphal growth and virulence defects.
    supporting_text: >-
      The alo1/alo1 null mutants of C. albicans showed increased sensitivity
      towards oxidative stress. Overexpression of ALO1 made the cells more
      resistant to the same stress
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text is cached; this is the primary gene-level C. albicans ALO1
      disruption and overexpression study.
