- id: PMID:18282465
  title: D-Erythroascorbic acid activates cyanide-resistant respiration in Candida
    albicans.
  findings:
  - statement: >-
      Later C. albicans work connected ALO1-derived D-erythroascorbate to
      alternative oxidase expression and cyanide-resistant respiration.
    supporting_text: >-
      the presence of cyanide in culture medium remarkably retarded the growth
      of alo1/alo1 mutant of Candida albicans
    reference_section_type: ABSTRACT
  full_text_unavailable: true
