    review_notes: >-
      Directly assays the alo1/alo1 strain after the core ALO1 characterization;
      useful context but not needed for a new GO process assertion.
- id: PMID:39775849
  title: A protein interaction map of the myosin Myo2 reveals a role for Alo1 in
    mitochondrial inheritance in yeast.
  findings:
  - statement: >-
      Budding-yeast Alo1 was identified as a Myo2 cargo-binding-domain
      interactor and implicated in mitochondrial inheritance under oxidative
      stress.
    supporting_text: >-
      using the cargo-binding domain of Myo2, the major organelle transporter in
      yeast, as bait
    reference_section_type: ABSTRACT
  full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Source-side support for the S. cerevisiae Myo2 binding annotation that
      Ensembl Compara transfers to C. albicans; no direct Candida Myosin V
      binding evidence was found.
