    supporting_text: >-
      D-Arabinono-1,4-lactone oxidase, which catalyses the final step in the
      biosynthesis of D-erythroascorbic acid, was purified 639-fold from the
      mitochondrial fraction of C. albicans
    reference_section_type: ABSTRACT
  - reference_id: PMID:11349062
    supporting_text: >-
      In the alo1/alo1 null mutants, the activity of
      D-arabinono-1,4-lactone oxidase was completely lost
    reference_section_type: ABSTRACT
