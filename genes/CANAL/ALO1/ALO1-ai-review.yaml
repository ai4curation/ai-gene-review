id: O93852
gene_symbol: ALO1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:237561
  label: Candida albicans SC5314
description: >-
  Candida albicans ALO1 encodes an FAD-linked sugar-lactone oxidase of the
  fungal ALO1 family. The enzyme is purified from mitochondrial fractions, is
  predicted to be an integral membrane protein, and catalyzes the terminal
  oxidation of D-arabinono-1,4-lactone in D-erythroascorbic acid biosynthesis.
  Loss of ALO1 abolishes cellular D-arabinono-1,4-lactone oxidase activity and
  D-erythroascorbic acid production, making cells more sensitive to oxidative
  stress and conditionally reducing filamentous growth and virulence.
core_functions:
- description: >-
    FAD-dependent oxidation of D-arabinono-1,4-lactone at the mitochondrial
    membrane, with molecular oxygen as electron acceptor, in the terminal step
    of fungal D-erythroascorbate biosynthesis.
  molecular_function:
    id: GO:0003885
    label: D-arabinono-1,4-lactone oxidase activity
  directly_involved_in:
  - id: GO:0070485
    label: dehydro-D-arabinono-1,4-lactone biosynthetic process
  locations:
