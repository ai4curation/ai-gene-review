id: A0A1D8PIC7
gene_symbol: ERG24
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:237561
  label: Candida albicans SC5314
description: ERG24 encodes the Candida albicans Delta14-sterol reductase, a polytopic ER-membrane ERG4/ERG24-family enzyme
  that reduces the C14=C15 double bond of a 4,4-dimethyl sterol intermediate during ergosterol biosynthesis. C. albicans erg24
  mutants are viable but have altered sterol composition, slow growth, sensitivity to several inhibitory compounds, reduced
  mouse pathogenicity and defective serum-induced germ-tube formation.
