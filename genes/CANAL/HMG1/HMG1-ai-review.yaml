taxon:
  id: NCBITaxon:237561
  label: Candida albicans SC5314
description: >-
  HMG1 encodes the Candida albicans class I 3-hydroxy-3-methylglutaryl-CoA
  reductase. Hmg1 is a predicted multipass ER-membrane enzyme whose conserved
  cytosolic catalytic domain reduces HMG-CoA to mevalonate using NADPH, the
  final step of the early mevalonate pathway that supplies ergosterol and other
  isoprenoid branches. The protein belongs to the conserved HMG-CoA reductase
  family and contains a sterol-sensing membrane domain plus the canonical HMGR
  substrate- and NADPH-binding catalytic fold.
