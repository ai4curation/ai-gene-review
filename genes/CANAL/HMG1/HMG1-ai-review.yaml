    label: cellular response to xenobiotic stimulus
  evidence_type: IMP
  original_reference_id: PMID:17604452
  qualifier: involved_in
  review:
    summary: >-
      Xu et al. 2007 used the C. albicans fitness test to link heterozygote drug
      responses to antifungal mechanisms of action, including lovastatin among the
      ergosterol-biosynthesis inhibitors. That supports HMG1 as the lovastatin target
      in the mevalonate pathway, but a drug-target haploinsufficiency phenotype is not
      evidence that Hmg1 itself executes a xenobiotic response program.
    action: MARK_AS_OVER_ANNOTATED
    reason: The xenobiotic-response process overstates a chemical-genetic target phenotype.
    supported_by:
