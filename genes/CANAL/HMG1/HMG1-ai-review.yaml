  review:
    summary: >-
      IBA to peroxisomal membrane from PTN000060347. The PTHR10572 family review flags
      this node as needing pruning in fungi: the mammalian peroxisomal HMGCR pool is
      contested, and the fungal HMG-CoA reductases reviewed so far are ER enzymes rather
      than peroxisomal enzymes.
    action: REMOVE
    reason: >-
      The peroxisomal-membrane compartment is over-propagated from a contested
      mammalian localisation source to fungal HMGRs; C. albicans Hmg1 is predicted by UniProt
      homology to be an ER membrane multipass enzyme, and the family-level assessment
      calls for an IRD on the fungal branch.
