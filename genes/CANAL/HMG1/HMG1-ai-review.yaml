- id: PMID:38069194
  title: Inhibitors of 3-Hydroxy-3-methylglutaryl Coenzyme A Reductase Decrease
    the Growth, Ergosterol Synthesis and Generation of petite Mutants in Candida
    glabrata and Candida albicans.
  findings:
  - statement: >-
      The 2023 HMGR-inhibitor study directly tested C. albicans growth and
      ergosterol synthesis under designed HMG-CoA reductase inhibitors and found
      ergosterol-depletion results consistent with action on the intended target.
    supporting_text: >-
      The aim of the current contribution was to evaluate the effect of the series of test compounds
      1a–b, 2a–c, 3a–b, 4a–c, 5a–b, 6a–g and 7a–b on the capacity of C. albicans
      and C. glabrata to grow, synthesize ergosterol and generate petite mutants.
      ... According to these results, the compounds acted on the target for which they
      have been designed
  - statement: >-
      CaHMGR was modeled as a class I HMG-CoA reductase with an N-terminal
      transmembrane region, soluble C-terminal catalytic region, and nine
      transmembrane segments.
    supporting_text: >-
      both shared characteristics of class I HMGRs, including a transmembrane region
      in the N-terminal, a soluble region in the C-terminal and a linker between these
      two regions. ... CgHMGR and CaHMGR have eight and nine transmembrane segments,
      respectively, but are highly conserved in the soluble region
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed/PMC-verified 2023 study of HMGR-directed inhibitors in Candida; it
      models CaHMGR and measures C. albicans growth and ergosterol depletion,
      but directly assays recombinant C. glabrata HMGR rather than CaHMG1.
