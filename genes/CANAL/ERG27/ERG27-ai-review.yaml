- id: PMID:15552648
  title: Isolation, characterization, and regulation of the Candida albicans ERG27 gene encoding the sterol 3-keto reductase.
  findings:
  - statement: C. albicans ERG27 encodes the sterol 3-keto reductase required for sterol C-4 demethylation.
    supporting_text: required for sterol C-4 demethylation
  - statement: Repressing C. albicans ERG27 compromised sterol synthesis.
    supporting_text: compromising all sterol synthesis
  - statement: Repressing C. albicans ERG27 caused loss of both the Erg27 3-keto reductase and the Erg7 oxidosqualene cyclase activities.
    supporting_text: complete loss of both 3-keto reductase and oxidosqualene cyclase
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only cache; the abstract directly describes C. albicans ERG27 isolation, conditional disruption and loss of sterol-synthesis activity.
- id: PMID:17604452
  title: Genome-wide fitness test and mechanism-of-action studies of inhibitory compounds in Candida albicans.
  findings:
  - statement: ERG27 haploinsufficiency was detected in a C. albicans fitness test under radicicol treatment.
    supporting_text: Radicicol also elicited HI of ERG27
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full-text cache; supports the CGD xenobiotic-response row as a CaFT radicicol hit rather than a core Erg27 function.
