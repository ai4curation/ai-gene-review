description: ERG27 encodes the Candida albicans Erg27 3-keto-steroid reductase, an NADPH-dependent short-chain dehydrogenase/reductase that functions in the endoplasmic-reticulum C-4 demethylation segment of ergosterol biosynthesis. It reduces 3-keto sterol intermediates back to their 3beta-hydroxy forms downstream of Erg25 and Erg26, and its loss blocks sterol synthesis.
