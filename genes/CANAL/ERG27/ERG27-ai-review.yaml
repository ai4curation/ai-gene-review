description: ERG27 encodes the Candida albicans Erg27 3-keto-steroid reductase, an NADPH-dependent short-chain dehydrogenase/reductase of the fungal Erg27 subfamily. Erg27 reduces 3-keto sterol intermediates during the endoplasmic-reticulum sterol C-4 demethylation steps of ergosterol biosynthesis and also helps stabilize the oxidosqualene cyclase Erg7 at lipid particles.
