id: A0A1D8PT38
gene_symbol: CEK2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:237561
  label: Candida albicans SC5314
description: Cek2 is a Candida albicans ERK-family mitogen-activated protein kinase in the pheromone-response MAPK pathway. It acts with the related MAPK Cek1 to support parasexual mating, has a smaller positive mating role than Cek1 in opaque cells, becomes important for white-cell mating under glucose-depleted conditions, accumulates in the nucleus late in the pheromone response, and helps adaptation to pheromone-mediated arrest.
