core_functions:
- description: >-
    MAP kinase activity in the pheromone-response MAPK cascade: Cek2 is a C.
    albicans ERK-family Ser/Thr MAPK that acts with Cek1 downstream of pheromone
    signaling to support parasexual mating, contributes a minor but measurable
    mating function in opaque cells, supports glucose-depletion-induced white-cell
    mating, and helps cells adapt to pheromone-mediated arrest.
  molecular_function:
    id: GO:0004707
    label: MAP kinase activity
  directly_involved_in:
  - id: GO:0071507
    label: pheromone response MAPK cascade
  - id: GO:1990277
    label: parasexual reproduction with cellular fusion
  locations:
  - id: GO:0005634
    label: nucleus
  - id: GO:0005737
    label: cytoplasm
  supported_by:
  - reference_id: PMID:12075459
    supporting_text: In vitro kinase activity assay showed Cek2 could phosphorylate MBP(myelin bovine protein)
    reference_section_type: ABSTRACT
  - reference_id: PMID:12453219
    supporting_text: a cek1 cek2 double mutant was completely defective in mating
    reference_section_type: ABSTRACT
  - reference_id: PMID:33793759
    supporting_text: Cek2-GFP fusion protein was distributed throughout the cytoplasm and showed clear nuclear localization when treated with pheromone
  - reference_id: PMID:37045865
    supporting_text: ectopic expression of CEK2 but not CEK1 in the white-locked wor1/wor1 mutant highly enhanced mating
suggested_questions:
- question: >-
    Which Cek2 substrates execute its adaptation function after pheromone-mediated
    arrest, and how do they differ from the Cek1 substrates that drive the major
    Candida opaque-cell pheromone response?
- question: >-
    Is Cek2's cryptic contribution to cell-wall biogenesis a direct output of
    Cek2 kinase activity, or an indirect consequence of Cek1/Cek2/SVG pathway
    cross-regulation?
suggested_experiments:
- description: >-
    Combine analog-sensitive Cek2 with quantitative phosphoproteomics after
    pheromone, glucose depletion, and cell-wall stress to separate direct Cek2
    substrates from Cek1-dependent and indirect MAPK-pathway phosphosites.
