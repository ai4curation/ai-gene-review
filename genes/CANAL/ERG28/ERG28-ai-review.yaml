suggested_questions:
- question: Has C. albicans Erg28 been experimentally tested for Erg25/Erg26/Erg27 complex assembly or
    for ER retention of the C-4 demethylation enzymes?
suggested_experiments:
- hypothesis: C. albicans ERG28 scaffolds the C-4 demethylation enzymes at the ER membrane.
  description: Tag C. albicans Erg28 and test co-immunoprecipitation with Erg25, Erg26 and Erg27, coupled
    to sterol profiling of an ERG28 depletion strain.
  experiment_type: protein interaction / sterol profiling
