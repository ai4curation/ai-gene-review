id: Q5AD51
gene_symbol: ERG28
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:237561
  label: Candida albicans SC5314
description: ERG28 encodes the Candida albicans ortholog of the conserved Erg28 family, a small
  multi-pass endoplasmic-reticulum membrane protein inferred to organize the sterol C-4 demethylation
  step of ergosterol biosynthesis. By homology with budding-yeast Erg28, it is expected to scaffold
  the Erg25, Erg26 and Erg27 enzymes at the ER membrane rather than catalyse a sterol reaction itself.
