      gap.
    action: ACCEPT
    nd_case: TRUE_GAP
    reason: PAINT and S. cerevisiae orthology support a conserved Erg28 protein-scaffold activity, but
      no C. albicans-specific publication was found that directly tests ERG28 molecular function.
