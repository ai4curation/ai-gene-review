        sterol-profile paper
    knowledge_gaps:
    - gap_statement: The molecular function of C. albicans ERG28 has not been experimentally
        tested in C. albicans.
      boundary: Orthology to S. cerevisiae ERG28 and PTHR15451 PAINT support a likely
