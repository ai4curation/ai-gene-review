      detoxification by a CoASH transfer from succinyl-CoA to acetate.
proposed_new_terms:
- proposed_name: amino acid catabolism-mediated extracellular alkalinization
  proposed_definition: >-
    A biological process in which a fungal cell catabolizes extracellular amino
    acids as carbon sources and releases alkaline nitrogenous waste, thereby
    increasing the pH of the extracellular environment.
  justification: >-
    Vylkova et al. identified Candida albicans mutants, including ach1, that
    are defective in raising extracellular pH from acidic amino-acid-containing
    medium. The local GO cache has terms for cellular responses to acidic,
    neutral, and alkaline pH. The GO pH-change branch has a broad pH elevation
    term and intracellular/vacuolar/lysosomal descendants, but no term for the
    organism-driven environmental alkalinization phenotype these mutants affect.
  proposed_parent:
    id: GO:0045852
    label: pH elevation
  supported_by:
  - reference_id: PMID:21586647
    supporting_text: >-
