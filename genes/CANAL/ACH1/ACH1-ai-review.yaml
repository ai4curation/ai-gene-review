  qualifier: enables
  supporting_entities:
  - CGD:CAL0000189008
  - PANTHER:PTN000484586
  - SGD:S000000111
  review:
    summary: >-
      The PTN000484586 placement correctly connects C. albicans ACH1 to fungal
      Ach1 acetate metabolism, but the specific hydrolase term is secondary to
      the later CoA-transferase recharacterization of fungal Ach1 enzymes.
    action: KEEP_AS_NON_CORE
    reason: >-
      C. albicans ACH1 complements Saccharomyces ach1 loss and is induced by
      acetate, ethanol, and glycerol, supporting conserved acetate/acetyl-CoA
      metabolism. The specific GO:0003986 assertion should be flagged rather
      than removed: S. cerevisiae Ach1p retains minor acetyl-CoA hydrolase
      activity, but Fleck and Brock showed that the fungal enzyme has its
      highest activity as a succinyl-CoA:acetate CoA-transferase and concluded
      that fungal Ach1 functions in mitochondrial acetate detoxification by CoA
      transfer.
    additional_reference_ids:
    - PMID:19298859
    supported_by:
    - reference_id: PMID:18689527
      supporting_text: Both ACH1 and ACS2 complement mutations in their S. cerevisiae homolog.
    - reference_id: PMID:18689527
      supporting_text: >-
        ACH1 was present at low levels in glucose-containing medium and was
        highly induced when acetate, ethanol, or glycerol was the carbon source.
    - reference_id: PMID:19298859
      supporting_text: >-
        Ach1p showed highest specific activity for the CoASH transfer from
        succinyl-CoA to acetate and only a minor acetyl-CoA-hydrolase activity.
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      source_entities:
      - source_id: PANTHER:PTN000484586
        source_status: SUPPORTS_TRANSFER
        comment: >-
          This node correctly scopes the fungal Ach1 acetate-metabolism enzyme
          family onto C. albicans ACH1 and supports acetyl-CoA hydrolase as a
          minor retained side activity.
