  supported_by:
  - reference_id: PMID:18689527
    supporting_text: >-
      loss of ACH1 conferred a mild retardation of growth in the presence of
      ethanol and acetate, phenotypes that were complemented by the restoration of
      a single copy of ACH1
  - reference_id: PMID:19298859
    supporting_text: >-
