id: P83773
gene_symbol: ACH1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:237561
  label: Candida albicans SC5314
description: >-
  ACH1 encodes a conserved fungal acetyl-CoA hydrolase/transferase family
  enzyme that interconverts acetate and short-chain acyl-CoA species, with the
  best fungal enzymology favoring acetate CoA-transferase as the dominant
  activity. In Candida albicans, ACH1 supports mitochondrial acetate metabolism,
  growth on acetate and ethanol as alternative carbon sources, and efficient
  amino-acid-driven extracellular alkalinization.
