- term:
    id: GO:0071469
    label: cellular response to alkaline pH
  evidence_type: IMP
  original_reference_id: PMID:21586647
  qualifier: involved_in
  review:
    summary: >-
      ACH1 is required for efficient amino-acid-driven environmental
      alkalinization, not for cellular response to alkaline pH; GO currently
      lacks a precise extracellular pH-elevation term for this phenotype.
    action: MODIFY
    reason: >-
      PMID:21586647 found ACH1 in a screen for mutants defective in
      neutralizing acidic amino-acid medium by raising extracellular pH. That is
      the opposite direction from GO:0071469 cellular response to alkaline pH,
      which implies a cell responding to an alkaline stimulus. Existing pH
      elevation terms describe increased internal pH of an organism or cell,
      not alkalinization of the extracellular medium, so this row should be
      repaired to an ontology term for amino-acid-catabolism-driven extracellular
      alkalinization once such a term exists.
    proposed_replacement_terms:
    - id: NTR
      label: amino acid catabolism-mediated extracellular alkalinization
    supported_by:
    - reference_id: PMID:21586647
      supporting_text: >-
        Mutations in four genes, STP2, a transcription factor regulating amino
        acid permeases, ACH1 (acetyl-coenzyme A [acetyl-CoA] hydrolase), DUR1,2
        (urea amidolyase), and ATO5, a putative ammonia transporter, abolish or
        delay neutralization.
core_functions:
- description: >-
    Catalyzes the succinyl-CoA-dependent transfer of CoA to acetate in the
    fungal Ach1 family, producing acetyl-CoA during mitochondrial acetate
    metabolism and supporting alternative carbon-source utilization.
