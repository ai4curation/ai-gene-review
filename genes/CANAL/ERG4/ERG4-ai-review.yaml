description: ERG4 encodes the Candida albicans Delta24(24-1)-sterol reductase, a predicted polytopic ER-membrane ERG4/ERG24-family
  enzyme that catalyzes the terminal NADPH-dependent reduction of the C-24(28) double bond of ergosta-5,7,22,24(28)-tetraenol
  to ergosterol.
