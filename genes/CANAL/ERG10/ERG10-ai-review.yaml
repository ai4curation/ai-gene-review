taxon:
  id: NCBITaxon:237561
  label: Candida albicans SC5314
description: >-
  Candida albicans ERG10 encodes the cytosolic acetoacetyl-CoA thiolase of the
  fungal mevalonate pathway. As a PTHR18919:SF165 ERG10-family member, it is
  inferred to condense two acetyl-CoA molecules to acetoacetyl-CoA in the first
  step of mevalonate formation, supplying the isoprenoid precursor pool used for
  ergosterol biosynthesis.
