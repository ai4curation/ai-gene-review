  label: Candida albicans SC5314
description: >-
  Candida albicans ERG10 encodes the cytosolic acetoacetyl-CoA thiolase of the
  fungal mevalonate pathway. The enzyme condenses two acetyl-CoA molecules to
  acetoacetyl-CoA in the first committed step of mevalonate formation, supplying
  the isoprenoid precursor pool used for ergosterol biosynthesis.
