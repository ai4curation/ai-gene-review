- term:
    id: GO:0008150
    label: biological_process
  evidence_type: ND
  original_reference_id: GO_REF:0000015
  qualifier: involved_in
  review:
    summary: >-
      Stale CGD root biological-process placeholder. The ERG10 subfamily
      placement, curated UniProt synthesis, and a newer Candida-specific
      inhibitor/rescue study all support ergosterol biosynthesis as the
      relevant process.
    action: REMOVE
    nd_case: STALE
    reason: >-
      C. albicans-specific ERG10 evidence now exists: Lin et al. inhibited the
      enzyme activity of Candida ERG10 with bacterial polyynes, showed that
      ERG10 overexpression rescues Candida viability from three of those
      polyynes, and describes ERG10 as the first enzyme of ergosterol
      biosynthesis. This makes the root biological-process no-data placeholder
      stale in a way independent of the PAINT IBA.
    supported_by:
    - reference_id: PMID:35551233
      supporting_text: >-
        ERG10 is the first enzyme of the ergosterol biosynthesis pathway and
        is crucial for fungal cell membrane formation
