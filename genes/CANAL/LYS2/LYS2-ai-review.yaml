suggested_questions:
- question: >-
    GO:0004043 is defined in the oxidative EC 1.2.1.31 direction, but fungal
    Lys2 physiologically catalyzes the ATP-dependent reductive EC 1.2.1.95
    reaction; should GO add a dedicated molecular-function term for this AAR
    reaction so the fungal enzymes no longer have to use the reverse-direction
    semialdehyde dehydrogenase label?
