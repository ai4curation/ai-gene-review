    - &lys2_catalytic_domains
      reference_id: PMID:12756539
      supporting_text: >-
        These results confirm the hypothesis that specific amino acid residues
        in highly conserved catalytic domains of Lys2p are essential for the
        alpha-aminoadipate reductase activity.
