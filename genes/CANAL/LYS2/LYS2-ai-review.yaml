- term:
    id: GO:0004043
    label: L-aminoadipate-semialdehyde dehydrogenase [NAD(P)+] activity
  evidence_type: IDA
  original_reference_id: PMID:15546125
  qualifier: enables
  review:
    summary: >-
      ACCEPT: the C. albicans AAR activity is correct and directly shown in the
      earlier Candida LYS2 papers; the cached abstract for the GOA-cited PMID is
      a later S. pombe Lys1/Lys7 activation paper that discusses C. albicans
      Lys2 as an established comparator.
    action: ACCEPT
    reason: >-
      PMID:15546125 itself assayed S. pombe Lys1 in the available abstract, but
      C. albicans Lys2 had already been disrupted, complemented, recombinantly
      activated, and mutagenized in PMID:10647122, PMID:9560434,
      PMID:11717270, and PMID:12756539. The molecular-function assertion is
      therefore sound for LYS2.
    supported_by:
