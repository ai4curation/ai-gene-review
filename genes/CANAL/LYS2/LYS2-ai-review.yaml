taxon:
  id: NCBITaxon:237561
  label: Candida albicans SC5314
description: >-
  Candida albicans LYS2 encodes L-2-aminoadipate reductase, a large NRPS-like
  enzyme of the fungal alpha-aminoadipate lysine-biosynthesis pathway. Lys2
  adenylates alpha-aminoadipate, transfers it to its phosphopantetheine-bearing
  peptidyl-carrier domain, and reduces the tethered intermediate with NADPH to
  alpha-aminoadipate semialdehyde. The PCP serine is phosphopantetheinylated by
  a Lys5-like phosphopantetheinyl transferase, and conserved residues in the
  Candida Lys2 activation, adenylation, NADPH-binding, and alpha-aminoadipate
  binding domains are required for reductase activity.
