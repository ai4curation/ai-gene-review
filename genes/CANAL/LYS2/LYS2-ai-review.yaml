core_functions:
- description: >-
    L-2-aminoadipate reductase catalysis in fungal L-lysine biosynthesis via an
    adenylated and PCP-bound alpha-aminoadipate intermediate; the PCP domain
    requires phosphopantetheinylation for activity.
