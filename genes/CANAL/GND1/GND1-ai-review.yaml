- term:
    id: GO:0019521
    label: D-gluconate metabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000043
  review:
    summary: 'Substrate over-generalisation from a keyword mapping. This annotation derives from the UniProt keyword "Gluconate utilization" (ARBA/RuleBase), which reflects the bacterial gluconate catabolic route in which free D-gluconate is phosphorylated by gluconokinase and then decarboxylated by Gnd. The substrate of Gnd1 is 6-phospho-D-gluconate, not D-gluconate, and in the yeast oxidative PPP that substrate is supplied by Zwf1 and 6-phosphogluconolactonase from glucose 6-phosphate rather than from exogenous gluconate. No evidence that C. albicans routes free D-gluconate through Gnd1 was retrieved.'
    action: MARK_AS_OVER_ANNOTATED
    reason: The term names the wrong substrate class for the fungal enzyme (D-gluconate versus 6-phospho-D-gluconate) and imports a bacterial gluconate-utilization context; GO:0009051 already captures the actual pathway. Not demonstrably false, so flagged as over-annotation rather than removed.
