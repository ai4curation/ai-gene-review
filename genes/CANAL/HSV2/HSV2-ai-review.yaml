description: 'Hsv2 is a fungal PROPPIN beta-propeller phosphoinositide-binding protein in the Atg18 family.
  It belongs to the Saccharomycotina Hsv2 branch and is inferred to bind PI3P/PI(3,5)P2-family
  phosphoinositides and act as a membrane-associated adaptor related to S. cerevisiae Hsv2.'
