  label: Candida albicans SC5314
description: MIT1 encodes the Candida albicans GT32 inositol phosphorylceramide mannosyltransferase
  that transfers mannose from GDP-mannose to IPC to make MIPC. Mit1 is required for MIPC synthesis
  and for downstream synthesis of phospholipomannan and beta-1,2-mannosylated Candida cell-surface
  glycoconjugates that affect macrophage interaction and systemic virulence.
