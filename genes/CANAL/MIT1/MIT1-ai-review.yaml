  title: Inactivation of CaMIT1 inhibits Candida albicans phospholipomannan beta-mannosylation,
    reduces virulence, and alters cell wall protein beta-mannosylation.
  findings:
  - statement: Mille et al. identified C. albicans MIT1 as a SUR1 homologue coding for GDP-mannose:IPC
      mannosyltransferase.
    supporting_text: a C. albicans gene homologue for the Saccharomyces cerevisiae SUR1 gene was identified
      and named MIT1
    reference_section_type: ABSTRACT
  - statement: The C. albicans mit1 mutant lacks MIPC, demonstrating that Mit1 is required for Candida
      IPC mannosylation.
    supporting_text: confirmed that mit1Delta did not synthesize MIPC, demonstrating a role of MIT1
      in the mannosylation of C. albicans IPCs
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Direct C. albicans MIT1 disruption paper; the cached abstract contains the core
      IPC-to-MIPC and phospholipomannan evidence used here.
