- term:
    id: GO:0030447
    label: filamentous growth
  evidence_type: IMP
  original_reference_id: PMID:12773383
  qualifier: involved_in
  review:
    summary: >-
      MARK_AS_OVER_ANNOTATED: the IMP evidence reports altered colony
      filamentation after ERG13 dosage reduction, not a direct filamentation
      function.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The cited screen identified heterozygous insertion mutants with altered
      filamentous colony morphology, and the ERG13-specific result is in the
      uncached supplementary table rather than the cached main text. Unlike a
      ribosome-biogenesis factor such as Ytm1 that has a specific filamentation
      phenotype under this CGD screen, Erg13 catalyzes an essential
      mevalonate-pathway step, so altered colony morphology after ERG13 dosage
      reduction is best read as an indirect lipid/isoprenoid precursor phenotype
      rather than a dedicated filamentous-growth role.
    supported_by:
    - reference_id: PMID:12773383
      supporting_text: >-
        Colonies that displayed altered filamentous growth (either increased or
        decreased) were rescreened, and only those with reproducible phenotypes
        were considered further.
