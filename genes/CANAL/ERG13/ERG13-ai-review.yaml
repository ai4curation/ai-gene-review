  - UniProtKB:P54868
  review:
    summary: >-
      KEEP_AS_NON_CORE: PTN000222418 soundly places ERG13 in acetyl-CoA
      metabolism, but this is a broad process parent of the direct HMG-CoA
      synthase reaction.
    action: KEEP_AS_NON_CORE
    reason: >-
      The accepted PAINT node links the conserved HMG-CoA synthase reaction to
      acetyl-CoA metabolic process, and Candida ERG13 directly condenses
      acetyl-CoA with acetoacetyl-CoA in mevalonate biosynthesis. Acetyl-CoA is
      a substrate of this reaction, so the process assertion is true but is a
      substrate-level description rather than Erg13's core mevalonate/ergosterol
      pathway role.
    supported_by:
    - reference_id: file:interpro/panther/PTHR43323/PTHR43323-paint.tsv
