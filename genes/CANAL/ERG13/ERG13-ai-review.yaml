- term:
    id: GO:0009267
    label: cellular response to starvation
  evidence_type: IMP
  original_reference_id: PMID:12773383
  qualifier: involved_in
  review:
    summary: >-
      MARK_AS_OVER_ANNOTATED: the starvation row extrapolates from a Spider
      medium filamentation phenotype.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Uhl et al. screened heterozygous transposon mutants for altered
      filamentous growth on nutrient-poor Spider medium. That establishes a
      dosage-sensitive phenotype under a starvation-like induction condition;
      the ERG13-specific call is in the uncached supplementary table rather than
      the cached main text. For this essential mevalonate enzyme, the result is
      best interpreted as indirect sensitivity of a lipid/isoprenoid precursor
      step rather than evidence that HMG-CoA synthase executes a starvation
      response.
    supported_by:
    - reference_id: PMID:12773383
      supporting_text: >-
        For nutrient limitation, we used Spider medium
