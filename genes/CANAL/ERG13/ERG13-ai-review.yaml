  evidence_type: IMP
  original_reference_id: PMID:17604452
  qualifier: involved_in
  review:
    summary: >-
      MARK_AS_OVER_ANNOTATED: the CaFT evidence is a chemical-genetic fitness
      phenotype, not a direct xenobiotic-response function.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Xu et al. used a barcoded heterozygous deletion pool to identify genes
