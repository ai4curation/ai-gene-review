description: >-
  Candida albicans ERG13 encodes hydroxymethylglutaryl-CoA synthase, the
  mevalonate-pathway enzyme that condenses acetyl-CoA with acetoacetyl-CoA to
  form HMG-CoA. This early sterol/isoprenoid-biosynthesis reaction supplies the
  mevalonate branch that feeds fungal ergosterol synthesis.
