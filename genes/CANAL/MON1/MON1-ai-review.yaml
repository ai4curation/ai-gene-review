  review:
    summary: The three FUZ/MON1/HPS1 longin-domain InterPro entries support a
      conserved membrane-trafficking role but are broader than the MON1-specific
      vacuolar delivery role already asserted for Q5A723.
    action: MODIFY
    reason: Vesicle-mediated transport is true but generic for longin-domain
