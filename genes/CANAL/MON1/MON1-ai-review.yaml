  review:
    summary: PAINT places Candida MON1 in the conserved Mon1-Ccz1 complex at the
      opisthokont PTN000315023 ancestor, with fungal, fly, worm, and human
      experimental descendants supporting the complex assignment.
    action: ACCEPT
    reason: Mon1 is a defining subunit of the Mon1-Ccz1 Rab7 GEF complex. The
      broad PAINT placement is appropriate because the complex and the Rab7/Ypt7
      GEF function are conserved from fungi to animals, and Q5A723 remains in the
      MON1 branch of PTHR13027.
    additional_reference_ids:
