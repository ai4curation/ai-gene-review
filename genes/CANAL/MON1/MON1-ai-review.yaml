  label: Candida albicans SC5314
description: MON1 encodes the Candida albicans ortholog of vacuolar fusion protein
  Mon1, a conserved MON1/SAND-family longin-domain protein in the fungal MON1
  subfamily. By descent from the characterized fungal Mon1 proteins, it is expected
  to associate with Ccz1 in the Mon1-Ccz1 Rab GEF complex on endolysosomal and
  vacuolar membranes, where the complex contributes guanyl-nucleotide exchange
  activity for Rab7/Ypt7-family GTPases and promotes protein delivery to the
  fungal vacuole.
