core_functions:
- description: As a fungal Mon1 ortholog, C. albicans MON1 is predicted to form
    a Mon1-Ccz1 complex on endolysosomal and fungal vacuole membranes. The
    Mon1 subunit contributes to the complex's Rab7/Ypt7-family guanyl-nucleotide
    exchange activity and supports protein targeting to the vacuole; the
    experimental PAINT source for the fungal vacuole membrane and protein-targeting annotations is the
    PTN000989606 fungal ancestor seeded by S. cerevisiae MON1.
