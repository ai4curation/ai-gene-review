suggested_questions:
- question: What is the natural substrate of CAALFM_C301820WA? With no predicted signal
    peptide and an inserted PA14 domain, it may act on an intracellular or cell-surface
    beta-glucoside rather than on an extracellular carbon source.
  experts: []
- question: Do CAALFM_C301820WA and its paralog BGL22 have overlapping substrates, and is
    either expressed under any condition in which C. albicans encounters
    beta-glucosides?
  experts: []
suggested_experiments:
- experiment_type: Enzyme kinetics
  description: Express CAALFM_C301820WA heterologously and measure activity on
    p-nitrophenyl beta-D-glucoside, cellobiose, gentiobiose, laminaribiose and salicin,
    with and without the PA14 domain.
  hypothesis: The protein is an active beta-glucosidase whose PA14 domain contributes
    to substrate binding.
- experiment_type: Localisation
  description: Tag CAALFM_C301820WA with GFP at its native locus and image cells grown
    in rich medium and in host-mimicking conditions.
  hypothesis: The protein is intracellular, consistent with the absence of a predicted
    signal peptide.
