taxon:
  id: NCBITaxon:237561
  label: Candida albicans (strain SC5314 / ATCC MYA-2876)
description: CAALFM_C301820WA (orf19.9233) encodes an 866-residue glycoside hydrolase
  family 3 (GH3) beta-glucosidase (EC 3.2.1.21) predicted to hydrolyse terminal,
  non-reducing beta-D-glucosyl residues. It has the N- and C-terminal GH3 catalytic
  domains with the GH3 active-site signature, a PA14 domain inserted in the catalytic
  region, and a C-terminal fibronectin type III-like domain. No signal peptide is
  predicted. It belongs to the PANTHER beta-glucosidase family PTHR42715 (subfamily SF27)
  and is a paralog of BGL22. Nothing is known experimentally about its substrate,
  expression or location. C. albicans does not assimilate cellobiose and has no
  cellulases, so the protein is not part of a cellulose-utilisation route; its
  physiological substrate remains to be identified.
