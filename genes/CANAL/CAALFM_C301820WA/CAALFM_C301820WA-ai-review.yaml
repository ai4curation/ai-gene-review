  supporting_entities:
  - PANTHER:PTN000770815
  - UniProtKB:Q5BFG8
  review:
    summary: The PAINT node for this family carries glucan breakdown. For this protein the
      glucan is unknown. A role in releasing glucose from beta-glucan oligosaccharides is
      plausible, but cellulose-derived glucan can be ruled out because C. albicans does
      not assimilate cellobiose.
    action: KEEP_AS_NON_CORE
    reason: The general process is compatible with the activity and with the
      organism's carbon-source profile; there is no target-specific evidence to place
      the protein in a particular glucan pathway.
    supported_by:
