- term:
    id: GO:0030245
    label: cellulose catabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000041
  qualifier: involved_in
  supporting_entities:
  - UniPathway:UPA00696
  review:
    summary: This row comes from the UniPathway mapping of the GH3 family rule
      ("Glycan metabolism; cellulose degradation"), which fits the beta-glucosidases of
      cellulolytic fungi. It does not fit C. albicans. The organism has no cellulase
      annotated anywhere in GOA, and its only cellulose catabolic process annotations are
      this row and the identical row on its paralog BGL22. Cellobiose, the end
      product a beta-glucosidase would clear in cellulose breakdown, is not assimilated
      by any of 215 typical C. albicans strains tested. The FUNG-GROWTH plate for
      strain SC5314 shows no growth on cellobiose or on cellulose above its no-carbon
      control.
    action: REMOVE
    reason: An over-propagated electronic pathway mapping. C. albicans has no
      cellulose catabolic process for this protein to take part in, and the organism's
      inability to use cellobiose argues against the cellulose-degradation role
      specifically, not against the enzyme activity.
    supported_by:
    - reference_id: PMID:7007420
      supporting_text: None of the isolates assimilated cellobiose and salicin
    - reference_id: file:projects/FUNG_GROWTH/GOA_JOIN.md
      supporting_text: Candida albicans SC5314 scores 1 on cellobiose and 1 on crystalline cellulose, the same as its no-carbon control plate
    - reference_id: file:projects/FUNG_GROWTH/GOA_JOIN.md
      supporting_text: Candida albicans has no GOA annotation to cellulase activity (GO:0008810)
