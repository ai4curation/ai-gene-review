id: A0A444Z7V7
gene_symbol: A0A444Z7V7
taxon:
  id: NCBITaxon:3818
  label: Arachis hypogaea
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for a peanut cellulose-synthase-like D (CSLD3)
  protein. The retrieval is confident (top-1 score 19.27, free-text Function score 21.92)
  and lands squarely in plant cell-wall biosynthesis, which is right. What it does not do
  is separate CSLD from CESA: four of the five top calls are cellulose synthesis, whereas
  CSLD proteins are hemicellulose synthases making beta-1,4-mannan and glucomannan
  backbones - and ProTrek's own free-text channel says exactly that at rank 1 ("Golgi-
  localized beta-glycan synthase that polymerize the backbones of noncellulosic
  polysaccharides (hemicelluloses)"). The GO channel therefore contradicts the Function
  channel on the same query. The distinction is not academic: it determines which polymer
  the enzyme makes and where in the wall it acts. The correct term, mannan synthase
  activity, is retrieved at rank 9. ProtNLM2 made no GO prediction here.
  Assessment: 1 correct not novel (CNN), 1 less precise (LSP), 1 incorrect (PLI).
source_documents:
  - projects/PROTREK_EVALUATION/argo50_protrek_hits.tsv
  - genes/ARAHY/A0A444Z7V7/A0A444Z7V7-uniprot.txt
