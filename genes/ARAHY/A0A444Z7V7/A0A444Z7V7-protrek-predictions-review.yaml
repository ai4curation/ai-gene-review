predictions:
  - source_method: ProTrek
    source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
    source_reference_id: PMID:41039041
    predicted_term:
      id: GO:0009833
      label: plant-type primary cell wall biogenesis
    predicted_term_type: GO_BP
    review:
      assessment: LSP
      confidence_score: 2
      summary: >-
        Top-ranked hit (score 19.27), absent from GOA. Correct at the level stated - CSLD3
        orthologs act at sites of rapid polarized wall deposition such as root-hair tips and
        pollen tubes, and contribute to primary wall biogenesis - but it says nothing about
        the polymer or the chemistry, which is where the interesting question lies for this
        protein. Scored LSP as a correct but low-resolution call.
      supported_by:
        - reference_id: GO_REF:0000002
          supporting_text: Gene Ontology annotation through InterPro
  - source_method: ProTrek
    source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
    source_reference_id: PMID:41039041
    predicted_term:
      id: GO:0052324
      label: plant-type cell wall cellulose biosynthetic process
    predicted_term_type: GO_BP
    review:
      assessment: PLI
      confidence_score: 0
      error_type: PARALOG_OVERANNOTATION
      summary: >-
        Rank 2 (score 18.95). This commits the protein to cellulose synthesis, which is the
        CESA subfamily's role. CSLD proteins synthesise noncellulosic beta-1,4-glycans;
        GOA's own cellulose synthase (UDP-forming) IEA annotation for this entry carries the
        same over-assignment, and ProTrek reinforces it. The model's free-text retrieval gets
        this right on the same query, so the error is specific to what the GO index can
        express for this family - mannan synthase activity exists in the index but is
        retrieved only at rank 9.
      supported_by:
        - reference_id: GO_REF:0000002
          supporting_text: Gene Ontology annotation through InterPro
  - source_method: ProTrek
    source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
    source_reference_id: PMID:41039041
    predicted_term:
      id: GO:0016759
      label: cellulose synthase activity
    predicted_term_type: GO_MF
    review:
      assessment: CNN
      confidence_score: 2
      summary: >-
        Rank 3 (score 17.36). Mechanically this is a parent of the cellulose synthase
        (UDP-forming) activity already in GOA, so it agrees with the existing annotation and
        is scored as correct-but-not-novel on that basis. Substantively it inherits the same
        CESA/CSLD conflation as rank 2, which this review's account of the family disputes;
        it is recorded here as agreement with the record rather than as an independent
        endorsement of the chemistry.
      supported_by:
        - reference_id: GO_REF:0000002
          supporting_text: Gene Ontology annotation through InterPro
