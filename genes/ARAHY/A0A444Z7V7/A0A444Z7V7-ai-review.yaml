id: A0A444Z7V7
gene_symbol: A0A444Z7V7
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:3818
  label: Arachis hypogaea
description: >-
  Cellulose synthase-like D (CSLD) glycosyltransferase of peanut (Arachis hypogaea; ORF
  Ahy_B05g078721). It belongs to the CESA/CSL superfamily of family 2 glycosyltransferases.
  The 1139-residue product is full length and has the CESA-type architecture: an N-terminal
  RING-type zinc-finger region, two N-terminal transmembrane helices, a large cytosolic
  glycosyltransferase domain, and five C-terminal transmembrane helices. The catalytic aspartates,
  the nucleotide-sugar binding residues and the QxxRW motif of processive beta-glycan synthases
  are all conserved. In a neighbour-joining tree the protein falls in the angiosperm CSLD2/CSLD3
  clade, and its closest relatives are Arabidopsis CSLD3 (KOJAK) and CSLD2 (about 85% identity).
  Arabidopsis CSLD3 is a UDP-glucose-dependent beta-1,4-glucan synthase. It accumulates at the
  apical plasma membrane of tip-growing root hairs and is needed to build a cellulose-like wall
  there. Earlier mutant and microsomal studies linked CSLD2, CSLD3 and CSLD5 to mannan
  synthesis, but this assignment is not supported by the later work on purified protein. By
  orthology, the peanut protein is expected to synthesise a beta-1,4-glucan wall polymer from
  UDP-glucose. It probably passes through the ER and Golgi on its way to the plasma membrane,
  where it acts during polarised wall deposition. There is no direct experimental study of this
  peanut protein.
existing_annotations:
- term:
    id: GO:0000139
    label: Golgi membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  review:
    summary: >-
      Golgi membrane comes from a UniProt subcellular-location rule. Arabidopsis CSLD3 has been
      found in the Golgi by organelle proteomics, and CSLD proteins are multi-pass membrane
      proteins that move through the secretory pathway. The polarised plasma-membrane domain
      in tip-growing cells is where CSLD3 activity has been shown, so the Golgi is a real
      location but not the main site of function.
    action: KEEP_AS_NON_CORE
    reason: >-
      The localisation is plausible for an ortholog of AtCSLD3, which LOPIT proteomics placed
      in the Golgi. The previous review accepted this term as core. That is changed here,
      because the evidence on where CSLD3 acts points to the apical plasma membrane of root
      hairs (PMID:21765420), not the Golgi.
    supported_by:
    - reference_id: file:ARAHY/A0A444Z7V7/A0A444Z7V7-uniprot.txt
      supporting_text: >-
        Golgi apparatus membrane
    - reference_id: PMID:21765420
      supporting_text: >-
        eYFP-CSLD3 proteins, but not CESA cellulose synthases, localize to a polarized
        plasma-membrane domain in root hairs
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: located_in
  review:
    summary: >-
      Cytoplasm is true by GO part_of inheritance, because Golgi membrane is part of the
      cytoplasm, but it says nothing useful about a multi-pass membrane glycosyltransferase.
    action: TOO_GENERAL
    reason: >-
      This is an ARBA-derived term. The Golgi membrane annotation in this review already
      entails it. It is not wrong, so it is not removed.
- term:
    id: GO:0009409
    label: response to cold
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: involved_in
  review:
    summary: >-
      In Arabidopsis, CSLD2 and CSLD3 expression rises at low temperature, and growth at
      reduced temperature partly rescues the single-mutant root-hair phenotypes. That is
      temperature-dependent expression and phenotype, not evidence that the glycosyltransferase
      takes part in a cold-response pathway.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      This is an ARBA-derived term. Its likely basis is the Arabidopsis expression data
      (PMID:18768911, which TAIR curated to AtCSLD3 as acts_upstream_of_or_within). Expression
      induction and conditional rescue of a phenotype show that the gene's activity is
      temperature sensitive. They do not show that the protein does any of the work of
      responding to cold. Transferring the term from Arabidopsis expression data to a peanut
      paralog-group member is weaker still.
    supported_by:
    - reference_id: PMID:18768911
      supporting_text: >-
        the expression of both CSLD2 and CSLD3 is elevated at
        reduced temperatures
- term:
    id: GO:0012505
    label: endomembrane system
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: located_in
  review:
    summary: >-
      Endomembrane system is correct but broad. The Golgi membrane annotation already entails
      it.
    action: TOO_GENERAL
    reason: >-
      This is an ARBA-derived term. Golgi membrane is part of the endomembrane system, and
      Golgi membrane is retained in this review. The general term adds no information.
- term:
    id: GO:0016020
    label: membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: located_in
  review:
    summary: >-
      The protein is an integral membrane protein with seven predicted transmembrane helices.
      The specific membrane where the ortholog acts is the plasma membrane.
    action: MODIFY
    reason: >-
      Membrane is correct but general. The supported specific location is the plasma membrane:
      AtCSLD3 accumulates in an apical plasma-membrane domain of root hairs, and PAINT node
      PTN001410221 propagates plasma membrane to AtCSLD3. That node is ancestral to the
      CSLD2/CSLD3 clade that contains this protein. Plasma membrane is also proposed below as
      a NEW annotation.
    proposed_replacement_terms:
    - id: GO:0005886
      label: plasma membrane
    supported_by:
    - reference_id: file:ARAHY/A0A444Z7V7/A0A444Z7V7-uniprot.txt
      supporting_text: >-
        TRANSMEM        1103..1123
    - reference_id: PMID:21765420
      supporting_text: >-
        eYFP-CSLD3 proteins, but not CESA cellulose synthases, localize to a polarized
        plasma-membrane domain in root hairs
- term:
    id: GO:0016760
    label: cellulose synthase (UDP-forming) activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: >-
      GO:0016760 means the transfer of glucose from UDP-glucose onto a (1,4)-beta-D-glucan
      chain. That is the activity shown for Arabidopsis CSLD3, this protein's closest
      characterised relative: purified, reconstituted CSLD3 is a UDP-glucose-dependent
      beta-1,4-glucan synthase. A CSLD3 chimera carrying a CESA6 catalytic domain also
      complements the csld3 mutant. The catalytic residues and the QxxRW motif are conserved
      in the peanut protein.
    action: ACCEPT
    reason: >-
      The previous review changed this term to mannan synthase activity. That decision is
      reversed. The InterPro2GO mapping from IPR005150 is broad, but for a member of the
      CSLD2/CSLD3 clade it matches the strongest available biochemistry (PMID:32169960,
      PMID:21765420). Clade membership was confirmed by the alignment and tree in the
      bioinformatics folder. Whether the CSLD3 product counts as cellulose in the
      microfibril sense is still open, but the GO term is defined by the reaction, and
      the reaction is the one shown.
    supported_by:
    - reference_id: PMID:32169960
      supporting_text: >-
        Arabidopsis (Arabidopsis thaliana) CSLD3 is a
        UDP-glucose-dependent β-1,4-glucan synthase
    - reference_id: PMID:21765420
      supporting_text: >-
        CSLD3 represents a distinct (1→4)-β-glucan synthase activity in apical plasma
        membranes during tip growth in root-hair cells
    - reference_id: file:ARAHY/A0A444Z7V7/A0A444Z7V7-bioinformatics/RESULTS.md
      supporting_text: >-
        The target therefore belongs to the angiosperm CSLD2/CSLD3 clade
- term:
    id: GO:0030244
    label: cellulose biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  review:
    summary: >-
      Arabidopsis CSLD3 synthesises the beta-1,4-glucan of the cellulose-like polysaccharide
      in root-hair tips, and new synthesis of that polymer is needed for tip growth. The
      peanut protein is an ortholog in the same clade and has an intact catalytic site, so
      it is expected to do the same polymerisation step.
    action: ACCEPT
    reason: >-
      The previous review changed this to cell wall organization on the assumption that CSLDs
      make mannan. Reconstitution of CSLD3 and rescue with a CSLD3-CESA6 chimera contradict
      that assumption. The more specific GO:0052324 (plant-type cell wall cellulose
      biosynthetic process) would assume that the CSLD product is wall cellulose proper. The
      cited work calls it cellulose-like, so the general term is kept as the most precise one
      the evidence supports.
    supported_by:
    - reference_id: PMID:21765420
      supporting_text: >-
        cellulose-like polysaccharides are present in root-hair tips, and de novo synthesis of
        these polysaccharides is required for tip growth
    - reference_id: PMID:32169960
      supporting_text: >-
        forms protein complexes
        displaying similar ultrastructural features to those formed by CESA6
- term:
    id: GO:0051753
    label: mannan synthase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: enables
  review:
    summary: >-
      Mannan synthase activity (GDP-mannose donor) rests on Arabidopsis csld2/csld3/csld5
      mutants, which have less mannan epitope, and on assays of CSLD proteins expressed in
      heterologous membranes (PMID:21471331, PMID:21904114). Purified, reconstituted CSLD3
      instead behaves as a UDP-glucose-dependent beta-1,4-glucan synthase (PMID:32169960).
      Mannan synthase is not the established activity of the CSLD2/CSLD3 clade.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      This is an ARBA-derived term. TAIR holds an experimental mannan-synthase annotation for
      AtCSLD3 (PMID:21904114), so the claim is not removed. The evidence conflicts, though. A
      reduced mannan epitope in a mutant is necessity evidence, and microsomal activity can
      come from co-purifying CSLA enzymes. The defined-protein reconstitution supports glucan
      synthesis. The previous review made this term the core activity, and that is reversed:
      the term is kept as a disputed, non-core claim.
    supported_by:
    - reference_id: PMID:21904114
      supporting_text: >-
        gathered evidence that CSLD2, CSLD3 and CSLD5 are
        involved in mannan synthesis
    - reference_id: PMID:32169960
      supporting_text: >-
        while these CSLD polysaccharide synthases are essential, the
        nature of the polysaccharides they synthesize has remained elusive
- term:
    id: GO:0005886
    label: plasma membrane
  evidence_type: ISS
  original_reference_id: PMID:21765420
  qualifier: located_in
  review:
    summary: >-
      The ortholog AtCSLD3 localises to a polarised plasma-membrane domain at root-hair tips,
      where it supplies beta-1,4-glucan synthase activity. PAINT node PTN001410221, which is
      ancestral to the CSLD2/CSLD3 clade, carries plasma membrane.
    action: NEW
    reason: >-
      This is the main site of activity for the clade and is missing from this protein's
      annotations. GOA has no IBA rows for this peanut entry, which explains the gap. The
      protein's placement inside the AtCSLD2/AtCSLD3 clade was confirmed by alignment and
      tree, so it descends from the PAINT node whose annotations AtCSLD3 inherits.
    supported_by:
    - reference_id: PMID:21765420
      supporting_text: >-
        eYFP-CSLD3 proteins, but not CESA cellulose synthases, localize to a polarized
        plasma-membrane domain in root hairs
    - reference_id: file:ARAHY/A0A444Z7V7/A0A444Z7V7-bioinformatics/RESULTS.md
      supporting_text: >-
        the target groups with the AtCSLD2 + AtCSLD3 pair, then with
        OsCSLD2 and OsCSLD1
references:
- id: GO_REF:0000002
  title: Gene Ontology annotation through association of InterPro records with GO terms
  findings:
  - statement: >-
      GO_REF:0000002 supplied InterPro-derived annotations for cellulose synthase activity,
      cellulose biosynthetic process, and membrane localization based on the IPR005150
      cellulose synthase domain.
- id: GO_REF:0000044
  title: Gene Ontology annotation based on UniProtKB/Swiss-Prot Subcellular Location vocabulary
    mapping, accompanied by conservative changes to GO terms applied by UniProt
  findings:
  - statement: >-
      GO_REF:0000044 supplied the Golgi membrane localization annotation based on UniProt
      subcellular location vocabulary.
- id: GO_REF:0000117
  title: Electronic Gene Ontology annotations created by ARBA machine learning models
  findings:
  - statement: >-
      GO_REF:0000117 supplied ARBA-derived annotations for cytoplasm localization, response
      to cold, endomembrane system localization, and mannan synthase activity.
- id: file:ARAHY/A0A444Z7V7/A0A444Z7V7-uniprot.txt
  title: UniProtKB entry for A0A444Z7V7
  findings:
  - statement: >-
      UniProt classifies this protein in the glycosyltransferase 2 family, plant cellulose
      synthase-like D subfamily, with Golgi apparatus membrane localization and a cellulose
      synthase domain (PF03552) plus zinc finger RING domain (PF14570).
- id: file:ARAHY/A0A444Z7V7/A0A444Z7V7-goa.tsv
  title: QuickGO GOA annotations for A0A444Z7V7
  findings:
  - statement: GOA rows supplied the 8 existing annotations reviewed in this file.
- id: file:ARAHY/A0A444Z7V7/A0A444Z7V7-deep-research-falcon.md
  title: Deep research report on A0A444Z7V7 cellulose synthase domain-containing protein
  findings:
  - statement: >-
      Deep research confirmed no direct experimental studies exist for A0A444Z7V7 from
      peanut. Functional inference relies on conserved domain architecture and
      characterization of homologous CESA/CSL proteins in Arabidopsis, poplar, wheat, and
      other model plants.
  reference_review:
    relevance: LOW
    correctness: LOW_QUALITY
    review_notes: >-
      The report treats the protein as a generic CESA and never identifies its CSLD placement.
      Its kinetic and complex-assembly material is about CESAs (poplar CesA8, Arabidopsis
      CESA6). In the 2026-10-21 re-review it is no longer used as support for any annotation;
      it is kept for provenance.
- id: file:ARAHY/A0A444Z7V7/A0A444Z7V7-bioinformatics/RESULTS.md
  title: A0A444Z7V7 placement among CSLD and CESA proteins
  findings:
  - statement: >-
      In a MAFFT alignment and NJ tree, A0A444Z7V7 groups with Arabidopsis CSLD2 and CSLD3
      (about 85% identity), inside the CSLD clade and apart from the CESAs. The catalytic
      aspartates, the nucleotide-sugar binding residues and the QxxRW motif are conserved.
- id: PMID:32169960
  title: Biochemical and Genetic Analysis Identify CSLD3 as a beta-1,4-Glucan Synthase That
    Functions during Plant Cell Wall Synthesis.
  findings:
  - statement: >-
      Reconstituted Arabidopsis CSLD3 is a UDP-glucose-dependent beta-1,4-glucan synthase that
      forms CESA6-like complexes.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PMID and title verified against PubMed. Only the abstract is cached, and it states the
      UDP-glucose dependence directly.
- id: PMID:21765420
  title: A role for CSLD3 during cell-wall synthesis in apical plasma membranes of tip-growing
    root-hair cells.
  findings:
  - statement: >-
      CSLD3 localises to the apical plasma membrane of root hairs and supplies a
      (1->4)-beta-glucan synthase activity. A CSLD3 chimera with a CESA6 catalytic domain
      complements csld3.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PMID and title verified against PubMed (esummary); abstract only.
- id: PMID:21904114
  title: Mannan synthase activity in the CSLD family.
  findings:
  - statement: >-
      Mutant and heterologous-expression evidence linking CSLD2, CSLD3 and CSLD5 to mannan
      synthesis.
  reference_review:
    relevance: MEDIUM
    correctness: DISPUTED
    review_notes: >-
      PMID verified. The claimed GDP-mannose activity is not supported by the later work on
      purified CSLD3 (PMID:32169960).
- id: PMID:21471331
  title: The cooperative activities of CSLD2, CSLD3, and CSLD5 are required for normal Arabidopsis
    development.
  findings:
  - statement: >-
      csld2/3/5 mutant combinations have developmental defects and less mannan epitope.
  reference_review:
    relevance: MEDIUM
    correctness: DISPUTED
    review_notes: PMID verified; mannan assignment contested as for PMID:21904114.
- id: PMID:11156607
  title: KOJAK encodes a cellulose synthase-like protein required for root hair cell morphogenesis
    in Arabidopsis.
  findings:
  - statement: >-
      KOJAK/AtCSLD3 is required for root-hair elongation, and kjk root hairs rupture at the
      tip.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PMID verified. The ER localisation of the GFP fusion in this paper differs from the
      later plasma-membrane result (PMID:21765420).
- id: PMID:18768911
  title: Functional analysis of the cellulose synthase-like genes CSLD1, CSLD2, and CSLD4 in tip-growing
    Arabidopsis cells.
  findings:
  - statement: >-
      CSLD2 and CSLD3 expression is elevated at reduced temperatures. CSLD2 is needed for root
      hairs, and CSLD1 and CSLD4 are needed for pollen-tube growth.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PMID verified; basis of the cold-response assessment.
core_functions:
- description: >-
    Processive UDP-glucose-dependent beta-1,4-glucan synthase of the CSLD2/CSLD3 clade. It is
    expected to polymerise a cellulose-like wall glucan at the plasma membrane during polarised
    wall deposition, such as tip growth.
  molecular_function:
    id: GO:0016760
    label: cellulose synthase (UDP-forming) activity
  directly_involved_in:
  - id: GO:0030244
    label: cellulose biosynthetic process
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:32169960
    supporting_text: >-
      Arabidopsis (Arabidopsis thaliana) CSLD3 is a
      UDP-glucose-dependent β-1,4-glucan synthase
  - reference_id: PMID:21765420
    supporting_text: >-
      CSLD3 represents a distinct (1→4)-β-glucan synthase activity in apical plasma
      membranes during tip growth in root-hair cells
  - reference_id: file:ARAHY/A0A444Z7V7/A0A444Z7V7-bioinformatics/RESULTS.md
    supporting_text: >-
      The target therefore belongs to the angiosperm CSLD2/CSLD3 clade
suggested_questions:
- question: >-
    Do CSLD2/CSLD3-clade proteins make any mannan in vivo, or do the reduced mannan epitopes in
    csld mutants come from indirect effects on CSLA-made mannan?
- question: >-
    Is the CSLD3 beta-1,4-glucan product crystalline cellulose, which would justify
    GO:0052324, or a different wall glucan?
suggested_experiments:
- description: >-
    Express and purify the peanut protein, reconstitute it in proteoliposomes, and supply
    UDP-glucose or GDP-mannose to test donor specificity and the linkage of the product.
- description: >-
    Express a fluorescent fusion in peanut root hairs or pollen tubes to test whether the
    protein accumulates at the apical plasma membrane, as AtCSLD3 does.
