description: >-
  ProtNLM2 made no predictions (GO or subcellular location) for this peanut
  protein and returned only the protein name "Cellulose synthase-like protein D3".
  That name is consistent with the gene review, which places the protein in the
  angiosperm CSLD2/CSLD3 clade of the CESA/CSL glycosyltransferase family and
  infers, by orthology to Arabidopsis CSLD3, a UDP-glucose-dependent beta-1,4-glucan
  synthase acting at the plasma membrane during polarised wall deposition. With no
  GO or location output there is nothing to score; the absence of predictions is
  recorded as assessed.
