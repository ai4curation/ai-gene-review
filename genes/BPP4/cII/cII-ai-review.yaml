id: P13059
gene_symbol: cII
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10680
  label: Enterobacteria phage P4
description: Nonessential 264-amino-acid protein cII (30.1 kDa, DUF2977/PF11191) encoded by a leftward-transcribed gene in
  the left-end nonessential region of satellite bacteriophage P4. Despite its historical designation from a clear-plaque mutant,
  cII is dispensable for lysogenization and lytic growth, and its normal molecular function remains unknown.
existing_annotations: []
core_functions: []
references:
- id: PMID:2403440
  title: 'Nonessential region of bacteriophage P4: DNA sequence, transcription, gene products, and functions.'
  findings:
  - statement: Determined the nucleotide sequence and transcription of the nonessential P4 cII gene and showed that cII loss-of-function
      does not impair lysogeny.
    supporting_text: The newly sequenced region encodes three nonessential genes, which are called gop, beta, and cII (in
      order, from left to right). The gop gene product kills Escherichia coli when the beta protein is absent; the gop and
      beta genes are transcribed rightward from the same promoter.
- id: PMID:2183201
  title: DNA sequence of satellite bacteriophage P4.
  findings:
  - statement: Reported the complete nucleotide sequence of satellite bacteriophage P4 including the cII gene.
suggested_questions:
- question: Does the P4 cII gene product function as a prophage-encoded anti-phage defense protein or restriction system component
    in lysogenic Escherichia coli hosts?
  experts:
  - Gianni Dehò
  - Daniela Ghisotti
  - Eduardo P. C. Rocha
suggested_experiments:
- description: Challenge Escherichia coli lysogens carrying wild-type P4 versus a P4 cII deletion mutant with a panel of diverse
    coliphages to test for prophage-mediated superinfection exclusion or abortive infection.
  hypothesis: Like many accessory genes in satellite phage hotspots, cII encodes an anti-phage defense factor that protects
    the host-helper-satellite ecosystem from competing phages.
