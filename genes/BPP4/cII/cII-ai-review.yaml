suggested_questions:
- question: Does the P4 cII gene product function as a prophage-encoded anti-phage defense protein or restriction system component in lysogenic Escherichia coli hosts?
  experts:
  - Gianni Dehò
  - Daniela Ghisotti
  - Eduardo P. C. Rocha
suggested_experiments:
- description: Challenge Escherichia coli lysogens carrying wild-type P4 versus a P4 cII deletion mutant with a panel of diverse coliphages to test for prophage-mediated superinfection exclusion or abortive infection.
  hypothesis: Like many accessory genes in satellite phage hotspots, cII encodes an anti-phage defense factor that protects the host-helper-satellite ecosystem from competing phages.
