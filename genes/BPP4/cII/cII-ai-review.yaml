  label: Enterobacteria phage P4
description: Nonessential 264-amino-acid protein cII (30.1 kDa, DUF2977/PF11191) encoded by a leftward-transcribed gene in the left-end nonessential region of satellite bacteriophage P4. Despite its historical designation from a clear-plaque mutant, cII is dispensable for lysogenization and lytic growth, and its normal molecular function remains unknown.
