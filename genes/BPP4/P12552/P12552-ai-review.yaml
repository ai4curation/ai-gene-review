taxon:
  id: NCBITaxon:10680
  label: Enterobacteria phage P4
description: Excisionase and transcriptional regulator Vis (88 aa, ~9.8 kDa; historically designated ORF88 or uncharacterized
  9.8 kDa protein in early sequence records) of satellite bacteriophage P4. Vis is an AlpA-family winged-helix nucleic acid-binding
  protein encoded immediately upstream of the late sid-delta-psu operon. It functions both as the P4 excisionase that promotes
  Int-mediated excisive site-specific recombination of the P4 prophage from the Escherichia coli chromosome and as a negative
  regulator of P4 integrase (int) gene expression by binding the Pint promoter region.
