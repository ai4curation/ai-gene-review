suggested_questions:
- question: Is ORF151 (P68664) expressed as a stable polypeptide during lytic, plasmid, or lysogenic growth of satellite phage
    P4?
suggested_experiments:
- description: Perform ribosome profiling and targeted mass spectrometry of P4-infected and P4-lysogenic Escherichia coli
    cells to test whether ORF151 is translated in vivo.
