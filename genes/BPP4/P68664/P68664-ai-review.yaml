  label: Enterobacteria phage P4
description: Uncharacterized 16.5 kDa protein (ORF151, 151 aa) predicted from the complete genome sequence of satellite bacteriophage
  P4. It lacks recognizable sequence motifs or structural domains, and its molecular function and role in the phage P4 life
  cycle remain unknown.
