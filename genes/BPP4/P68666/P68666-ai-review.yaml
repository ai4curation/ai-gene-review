id: P68666
gene_symbol: P68666
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10680
  label: Enterobacteria phage P4
description: Copy number control protein Cnr (106 aa, ~11.7 kDa; historically designated ORF106 or uncharacterized 11.7 kDa
  protein in early sequence records) of satellite bacteriophage P4, encoded immediately upstream of the alpha replication
  gene. Cnr is a winged-helix protein that directly binds the C-terminal winged-helix origin-binding domain (P4-OBD) of the
  multifunctional P4 replication protein gpAlpha, forming a heterodimer that modulates gpAlpha origin recognition and negatively
  regulates P4 DNA replication initiation to control plasmid copy number.
