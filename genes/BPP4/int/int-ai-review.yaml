id: P08320
gene_symbol: int
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10680
  label: Enterobacteria phage P4
description: Site-specific tyrosine recombinase (integrase) Int (440 aa, 50.5 kDa) catalyzes integration of the satellite
  bacteriophage P4 genome into the Escherichia coli chromosome at the 20-bp attB core within the leuX tRNA gene to establish
  proviral latency, as well as Vis-assisted prophage excision. In addition, Int binds the Pint promoter region to negatively
  autoregulate its own transcription.
