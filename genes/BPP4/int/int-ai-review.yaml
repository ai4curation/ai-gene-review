core_functions:
- description: Binds the phage (P4attP) and Escherichia coli chromosomal (P4attB) attachment sites to catalyze site-specific
    viral genome integration into host DNA during establishment of integrated proviral latency, and binds the Pint promoter
    to negatively autoregulate int transcription.
  molecular_function:
    id: GO:0003677
    label: DNA binding
  directly_involved_in:
  - id: GO:0044826
    label: viral genome integration into host DNA
  - id: GO:0075713
    label: establishment of integrated proviral latency
  - id: GO:0039695
    label: DNA-templated viral transcription
  supported_by:
  - reference_id: PMID:3119856
    supporting_text: We determined the DNA sequences of regions essential for bacteriophage P4 integration. A 20 base-pair
      core sequence in both phage (P4attP) and host (P4attB) attachment regions contains the recombination site.
  - reference_id: PMID:16847139
    supporting_text: Phage P4 int gene encodes the integrase responsible for phage integration into and excision from the
      Escherichia coli chromosome. Here, the data showing that P4 int expression is regulated in a complex manner at different
      levels are presented. First of all, the Pint promoter is regulated negatively by both Int and Vis, the P4 excisionase.
