      core sequence in both phage (P4attP) and host (P4attB) attachment regions contains the recombination site.
- id: PMID:2183201
  title: DNA sequence of satellite bacteriophage P4.
  findings:
  - statement: Compiled the complete nucleotide sequence of satellite bacteriophage P4 including the int gene.
- id: PMID:16847139
  title: Expression of phage P4 integrase is regulated negatively by both Int and Vis.
  findings:
  - statement: Demonstrated that P4 int transcription from the Pint promoter is negatively regulated by both Int autoregulation
      and the P4 excisionase Vis.
    supporting_text: Phage P4 int gene encodes the integrase responsible for phage integration into and excision from the
      Escherichia coli chromosome. Here, the data showing that P4 int expression is regulated in a complex manner at different
      levels are presented. First of all, the Pint promoter is regulated negatively by both Int and Vis, the P4 excisionase.
suggested_questions:
- question: How does cooperative binding of the excisionase Vis (P12552) to attL/attR remodel the P4 Int synaptic complex
    to favor excisive over integrative recombination?
  experts:
  - Gianni Dehò
  - Daniela Ghisotti
  - Michael L. Kahn
suggested_experiments:
- description: Determine the cryo-EM structures of the P4 Int-attP-attB integrative intasome and the P4 Int-Vis-attL-attR
    excisive intasome.
  hypothesis: Vis bends the attP arm DNA to align the N-terminal arm-type DNA-binding domain of Int with the catalytic core
    in an excision-competent tetrameric synapse.
