suggested_questions:
- question: Does P4 Beta directly bind Gop to form a toxin-antitoxin complex, or does its DUF2075 calcineurin-like phosphoesterase domain hydrolyze a nucleotide second messenger or reverse a Gop-catalyzed modification?
  experts:
  - Gianni Dehò
  - Daniela Ghisotti
  - Eduardo P. C. Rocha
suggested_experiments:
- description: Co-express and purify His-tagged Beta and untagged Gop from Escherichia coli to test direct complex formation by size-exclusion chromatography and assay metal-dependent phosphoesterase activity of Beta on cyclic oligonucleotides and phosphopeptides.
  hypothesis: Beta forms a stable heteromeric complex with Gop that masks Gop's toxic effector activity until triggered by heterologous phage infection.
