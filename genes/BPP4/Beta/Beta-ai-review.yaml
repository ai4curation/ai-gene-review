  label: Enterobacteria phage P4
description: Protein Beta (354 aa) is encoded in the left-end nonessential gop-beta operon of satellite bacteriophage P4 and contains a calcineurin-like phosphoesterase superfamily domain (DUF2075/PF09848). Cotranscribed with gop, Beta counteracts the lethal host-killing activity of the Gop protein in Escherichia coli, functioning as the antitoxin/inhibitory partner of the Gop-Beta module.
