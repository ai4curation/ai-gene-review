id: P13057
gene_symbol: Beta
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10680
  label: Enterobacteria phage P4
description: Protein Beta (354 aa) is encoded in the left-end nonessential gop-beta operon of satellite bacteriophage P4 and
  contains a calcineurin-like phosphoesterase superfamily domain (DUF2075/PF09848). Cotranscribed with gop, Beta counteracts
  the lethal host-killing activity of the Gop protein in Escherichia coli, functioning as the antitoxin/inhibitory partner
  of the Gop-Beta module.
existing_annotations: []
core_functions: []
references:
- id: PMID:2403440
  title: 'Nonessential region of bacteriophage P4: DNA sequence, transcription, gene products, and functions.'
  findings:
  - statement: Sequenced the P4 gop-beta-cII region and demonstrated that gop and beta are cotranscribed and that Beta prevents
      Gop from killing Escherichia coli.
    supporting_text: The newly sequenced region encodes three nonessential genes, which are called gop, beta, and cII (in
      order, from left to right). The gop gene product kills Escherichia coli when the beta protein is absent; the gop and
      beta genes are transcribed rightward from the same promoter.
- id: PMID:2183201
  title: DNA sequence of satellite bacteriophage P4.
  findings:
  - statement: Compiled the complete 11,624-bp nucleotide sequence of satellite bacteriophage P4 including the beta gene.
suggested_questions:
- question: Does P4 Beta directly bind Gop to form a toxin-antitoxin complex, or does its DUF2075 calcineurin-like phosphoesterase
    domain hydrolyze a nucleotide second messenger or reverse a Gop-catalyzed modification?
  experts:
  - Gianni Dehò
  - Daniela Ghisotti
  - Eduardo P. C. Rocha
suggested_experiments:
- description: Co-express and purify His-tagged Beta and untagged Gop from Escherichia coli to test direct complex formation
    by size-exclusion chromatography and assay metal-dependent phosphoesterase activity of Beta on cyclic oligonucleotides
    and phosphopeptides.
  hypothesis: Beta forms a stable heteromeric complex with Gop that masks Gop's toxic effector activity until triggered by
    heterologous phage infection.
