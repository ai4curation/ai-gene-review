id: P05461
gene_symbol: sid
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10680
  label: Enterobacteria phage P4
description: Capsid size-determining protein Sid (244 aa, ~27.3 kDa) of satellite bacteriophage P4, encoded as the first gene
  of the late sid-delta-psu operon. During coinfection with helper phage P2, Sid self-assembles into a continuous dodecahedral
  external scaffolding cage (60 or 120 copies) on the surface of nascent procapsids, forming arches that contact helper P2
  major capsid protein gpN hexamers at the icosahedral 2-fold axes and connect as trimers over the 3-fold axes. This external
  scaffold constrains helper capsid assembly from the normal large P2 T=7 capsid into a smaller T=4 procapsid that specifically
  accommodates the 11.6 kb P4 genome and excludes the larger helper P2 genome.
