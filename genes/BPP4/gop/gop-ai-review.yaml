suggested_questions:
- question: What essential Escherichia coli cellular target or membrane structure is disrupted by Gop when Beta is inactivated
    or degraded?
  experts:
  - Gianni Dehò
  - Daniela Ghisotti
  - Eduardo P. C. Rocha
suggested_experiments:
- description: Select and whole-genome sequence Escherichia coli host mutants resistant to inducible Gop expression, and perform
    bacterial cytological profiling upon Gop induction.
  hypothesis: Gop inhibits an essential bacterial macromolecular synthesis pathway or compromises inner membrane integrity
    when released from Beta inhibition during heterologous phage infection.
