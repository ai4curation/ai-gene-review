id: P13058
gene_symbol: gop
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10680
  label: Enterobacteria phage P4
description: Host-killing effector protein Gop (146 aa, 16.6 kDa, PF09849/IPR019176) is encoded as the first gene of the nonessential
  rightward gop-beta operon of satellite bacteriophage P4. In the absence of its cotranscribed inhibitory partner Beta, Gop
  is lethal to Escherichia coli, functioning as the toxic effector component of the P4 Gop-Beta module.
existing_annotations:
- term:
    id: GO:0031640
    label: killing of cells of another organism
  evidence_type: IMP
  original_reference_id: PMID:2403440
  qualifier: involved_in
  review:
    summary: Genetic demonstration that the P4 gop gene product kills Escherichia coli host cells when the Beta protein is
      absent.
    action: NEW
    reason: Ghisotti et al. (1990) demonstrated that expression of functional Gop protein in the absence of Beta is lethal
      to Escherichia coli and that mutations in gop restore bacterial survival.
    supported_by:
    - reference_id: PMID:2403440
      supporting_text: The newly sequenced region encodes three nonessential genes, which are called gop, beta, and cII (in
        order, from left to right). The gop gene product kills Escherichia coli when the beta protein is absent; the gop and
        beta genes are transcribed rightward from the same promoter.
core_functions:
- description: Induces lethal toxicity in Escherichia coli host cells when uninhibited by the cotranscribed Beta protein,
    acting as the toxic effector subunit of the phage P4 gop-beta module.
  directly_involved_in:
