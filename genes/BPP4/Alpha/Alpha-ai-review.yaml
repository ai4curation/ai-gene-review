taxon:
  id: NCBITaxon:10680
  label: Enterobacteria phage P4
description: Multifunctional replication protein gpAlpha (777 aa) is the autonomous replication initiator, DNA helicase, and DNA primase of satellite bacteriophage P4. It comprises an N-terminal zinc-binding prokaryotic DNA primase domain that synthesizes RNA primers on single-stranded DNA, a central NTP-driven DNA helicase domain that unwinds the replication fork, and a C-terminal winged-helix origin-binding domain (P4-OBD) that binds Type I iterons at the P4 replication origin (ori) and cis replication region (crr) under negative regulation by Cnr.
