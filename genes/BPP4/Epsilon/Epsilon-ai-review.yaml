  label: Enterobacteria phage P4
description: Helper-phage derepression protein gpEpsilon (95 aa, 10.9 kDa) is encoded in the early essential region of satellite
  bacteriophage P4. During infection of Escherichia coli lysogenic for helper phage P2, gpEpsilon inactivates the P2 immunity
  repressor C to derepress the resident helper prophage and activate helper viral transcription and morphogenetic gene expression.
