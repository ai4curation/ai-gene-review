suggested_questions:
- question: What is the structural basis by which P4 gpEpsilon binds the dimeric helper phage P2 immunity repressor C to prevent
    operator DNA binding?
  experts:
  - Gianni Dehò
  - Richard Calendar
  - Elisabeth Haggård-Ljungquist
suggested_experiments:
- description: Solve the crystal or cryo-EM structure of the P4 gpEpsilon-P2 C repressor heterocomplex and measure operator
    DNA binding affinity by fluorescence anisotropy.
  hypothesis: gpEpsilon binds the dimerization interface of P2 repressor C, disrupting the relative orientation of its N-terminal
    helix-turn-helix DNA-binding domains.
