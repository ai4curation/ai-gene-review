suggested_experiments:
- description: Determine the cryo-EM structure of Escherichia coli RNA polymerase holoenzyme bound to the P4 Psid promoter
    and full-length gpDelta.
  hypothesis: The N-terminal and C-terminal zinc-finger repeats of gpDelta form an intramolecular pseudo-dimer that bridges
    the -55 promoter element and both alpha-CTD subunits of host RNA polymerase.
