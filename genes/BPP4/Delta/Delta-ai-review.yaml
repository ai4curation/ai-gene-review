id: P12551
gene_symbol: Delta
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10680
  label: Enterobacteria phage P4
description: Transcriptional transactivator protein gpDelta (166 aa) is encoded in the satellite bacteriophage P4 late sid-delta-psu
  operon and contains two tandem P2 Ogr-like Cys4 zinc-finger domains. It binds upstream of both satellite phage P4 late promoters
  and helper phage P2 morphogenetic/lysis late promoters and directly contacts the alpha subunit (RpoA) of Escherichia coli
  RNA polymerase to activate late viral transcription.
