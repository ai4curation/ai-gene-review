    summary: Genetic and suppressor analysis demonstrating that gpDelta positively regulates transcription of phage P2 and
      P4 late genes through interaction with host RNA polymerase alpha subunit.
    action: NEW
    reason: Halling et al. (1990) and Dale et al. (1986) showed that P4 gpDelta is the transactivation factor that positively
      regulates transcription from P2 and P4 late promoters by interacting with the Escherichia coli RNA polymerase alpha
      subunit.
    supported_by:
    - reference_id: PMID:2193910
      supporting_text: DNA sequence analysis revealed that the four independent org mutations are identical and that they
        occur in the P4 delta gene, which codes for a factor that positively regulates the transcription of the P2 and P4
        late genes.
    - reference_id: PMID:3295254
      supporting_text: The satellite bacteriophage P4 genes for capsid size determination (sid), transactivation (delta),
        and polarity suppression (psu) are cotranscribed at late times after infection from a single P4 late promoter (Psid)
        that lies to the left of the sid gene.
