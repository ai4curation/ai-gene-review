- id: PMID:2193910
  title: A mutation of the transactivation gene of satellite bacteriophage P4 that suppresses the rpoA109 mutation of Escherichia
    coli.
  findings:
  - statement: Mapped P4 org suppressor mutations of the host rpoA109 RNA polymerase mutation to the P4 delta gene, demonstrating
      direct functional interaction between gpDelta and the RNA polymerase alpha subunit.
    supporting_text: DNA sequence analysis revealed that the four independent org mutations are identical and that they occur
      in the P4 delta gene, which codes for a factor that positively regulates the transcription of the P2 and P4 late genes.
- id: PMID:2183201
  title: DNA sequence of satellite bacteriophage P4.
  findings:
  - statement: Compiled the complete nucleotide sequence of satellite bacteriophage P4 including the delta transactivation
      gene.
suggested_questions:
- question: Do both tandem Ogr-like zinc-finger domains of a single gpDelta monomer contact DNA and the RNA polymerase alpha-CTD
    simultaneously, mimicking a P2 Ogr homodimer?
