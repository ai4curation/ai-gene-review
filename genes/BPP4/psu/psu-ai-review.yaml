id: P05460
gene_symbol: psu
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10680
  label: Enterobacteria phage P4
description: Polarity suppression protein Psu (190 aa, 21.3 kDa) is a homodimeric Rho-antitermination factor encoded at the
  distal end of the satellite bacteriophage P4 late sid-delta-psu operon. Psu dimers directly bind Escherichia coli transcription
  termination factor Rho (ρ), clamping two open ρ rings and forcing their expansion into inactive higher-order oligomers,
  thereby suppressing Rho-dependent transcription termination in helper phage P2 late genes and host operons.
