references:
- id: PMID:3295254
  title: Organization and expression of the satellite bacteriophage P4 late gene cluster.
  findings:
  - statement: Sequenced the P4 late sid-delta-psu operon and showed that psu is cotranscribed from the late promoter Psid.
    supporting_text: The satellite bacteriophage P4 genes for capsid size determination (sid), transactivation (delta), and
      polarity suppression (psu) are cotranscribed at late times after infection from a single P4 late promoter (Psid) that
      lies to the left of the sid gene.
- id: PMID:1938879
  title: The Psu protein of bacteriophage P4 is an antitermination factor for rho-dependent transcription termination.
  findings:
  - statement: Demonstrated that Psu acts in trans as an antitermination factor that suppresses Rho-dependent polarity in
      phage P2 late genes, plasmid operons, and the Escherichia coli chromosome.
    supporting_text: In vivo, Psu protein acted in trans to suppress rho-dependent polarity in the late genes of an infecting
      P2 phage, in plasmid operons, and in the host chromosome.
- id: PMID:39788982
  title: The Psu protein of phage satellite P4 inhibits transcription termination factor ρ by forced hyper-oligomerization.
  findings:
  - statement: Determined cryo-EM structures of Escherichia coli Rho-Psu complexes, revealing that Psu homodimers clamp open
      Rho rings and force their expansion into inactive higher-order oligomers.
    supporting_text: Our cryogenic electron microscopy structures of ρ-Psu complexes show that Psu dimers clamp two inactive,
      open ρ rings and promote their expansion to higher-oligomeric states.
suggested_questions:
- question: Can Psu bind and pry open closed, RNA-translocating Rho hexamers directly on nascent transcripts, or does it selectively
    trap open Rho rings prior to RNA ring closure?
  experts:
  - Markus C. Wahl
  - Irina Artsimovitch
  - Ranjan Sen
suggested_experiments:
- description: Perform single-molecule magnetic tweezers transcription termination assays on E. coli RNA polymerase-Rho complexes
    with pre-loaded closed Rho hexamers versus free open Rho rings upon Psu addition.
  hypothesis: Psu preferentially captures open Rho rings before ring closure around rut RNA, shifting the conformational equilibrium
    toward inactive hyper-oligomers.
