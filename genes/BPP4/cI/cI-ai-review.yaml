id: P05462
gene_symbol: cI
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10680
  label: Enterobacteria phage P4
description: Putative 137-amino-acid polypeptide (15.4 kDa) originally predicted from an open reading frame spanning the cI405
  and ash immunity mutations of satellite bacteriophage P4. Subsequent work established that P4 lysogenic immunity at the
  cI locus is mediated by a small regulatory antisense RNA (CI RNA) processed from the primary transcript rather than by this
  predicted polypeptide, which has no known protein function.
existing_annotations: []
core_functions: []
references:
- id: PMID:6095206
  title: Nucleotide sequence of the essential region of bacteriophage P4.
  findings:
  - statement: Sequenced the P4 immunity region and mapped the cI405 and ash mutations to a region capable of encoding a putative
      15-kDa open reading frame.
    supporting_text: cI405, a proposed repressor gene mutation, is located in a sequence capable of coding for a 15 kd protein.
      A new class of P4 mutations, ash, is located in the neighborhood of cI405.
- id: PMID:2183201
  title: DNA sequence of satellite bacteriophage P4.
  findings:
  - statement: Presented the complete nucleotide sequence and genetic organization of satellite bacteriophage P4.
suggested_questions:
- question: Is the 137-codon open reading frame P05462 overlapping the P4 CI RNA locus ever translated in vivo, or is this
    UniProt entry solely a historical artifact of open reading frame prediction prior to discovery of the non-coding CI immunity
    RNA?
  experts:
  - Gianni Dehò
  - Daniela Ghisotti
suggested_experiments:
- description: Perform ribosome profiling (Ribo-seq) and mass spectrometry on P4-infected and P4-lysogenic Escherichia coli
    cells to test whether any ribosomes initiate translation on the P05462 reading frame.
  hypothesis: The P05462 reading frame is not translated in vivo and functions exclusively at the RNA level as the precursor
    to the CI immunity sRNA.
