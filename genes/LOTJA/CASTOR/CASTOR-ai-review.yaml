    - reference_id: PMID:19106374
      supporting_text: The castor-2 mutant is defective in Ca 2+ spiking ( Figure 5 ) and
        both root nodule and arbuscular mycorrhiza symbioses ( Imaizumi-Anraku et al., 2005
