references:
- id: PMID:27256883
  title: C2c2 is a single-component programmable RNA-guided RNA-targeting CRISPR effector.
  full_text_unavailable: false
  findings:
  - statement: The reconstituted L. shahii C2c2 locus confers immunity to the ssRNA phage
      MS2 in E. coli
    supporting_text: We explored whether LshC2c2 could confer immunity to MS2 (25), a lytic
      single-stranded (ss) RNA phage, without DNA intermediates in its life cycle, that
      infects E. coli.
    reference_section_type: RESULTS
  - statement: Individually validated spacers give a three- to four-log reduction in plaque
      formation
    supporting_text: To validate the interference activity of the enriched spacers, we
      individually cloned four top-enriched spacers into pLshC2c2 CRISPR arrays and observed
      a 3- to 4-log10 reduction in plaque formation
    reference_section_type: RESULTS
  - statement: Four single substitutions in the two HEPN R-H dyads abolish MS2 protection
    supporting_text: We mutated each of these putative catalytic residues separately to
      alanine (R597A, H602A, R1278A, H1283A) in the LshC2c2 locus plasmids and assayed for
      MS2 interference. None of the four mutant plasmids were able to protect E. coli from
      phage infection
    reference_section_type: RESULTS
  - statement: Catalysis is by the two HEPN domains; HEPN mutants are catalytically inactive
      RNA-binding proteins
    supporting_text: Cleavage is mediated by catalytic residues in the two conserved Higher
      Eukaryotes and Prokaryotes Nucleotide-binding (HEPN) domains, mutations of which
      generate catalytically inactive RNA-binding proteins.
    reference_section_type: ABSTRACT
  - statement: Target RNA engagement activates non-specific cleavage of unrelated collateral
      RNAs
    supporting_text: whereas the LshC2c2-crRNA complex did not mediate cleavage of any of
      the four collateral RNAs in the absence of the target RNA, all four were efficiently
      degraded in the presence of the target RNA
    reference_section_type: RESULTS
  - statement: No cleavage of dsDNA or of a ssDNA version of the target was detected
    supporting_text: When incubated with LshC2c2 protein and a crRNA complementary to
      protospacer 14, no cleavage of the dsDNA plasmid library was observed (fig. S10C). We
      also did not observe cleavage when targeting a ssDNA version of ssRNA target 1
    reference_section_type: RESULTS
  - statement: Targeting efficacy depends on a 3' protospacer flanking site, with G
      disfavoured; the term PAM is deliberately avoided for an RNA-targeting system
    supporting_text: spacers with a G immediately flanking the 3’ end of the protospacer
      were less fit relative to all other nucleotides at this position (i.e. A, U, or C),
      suggesting that the 3′ protospacer flanking site (PFS) affects the efficacy of
      C2c2-mediated targeting
    reference_section_type: RESULTS
  - statement: The authors proposed that collateral cleavage of cellular mRNAs, rather than
      clearance of the invader, prevents virus reproduction
    supporting_text: We therefore surmised that, in addition to the cleavage of the target
      RNA, C2c2 CRISPR systems might prevent virus reproduction also via non-specific
      cleavage of cellular mRNAs, causing programmed cell death (PCD) or dormancy
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text cached from PMC5127784. The founding characterisation of this exact protein
      and the source of every experimental annotation in this review; verified against the
      cached record. UniProt cites it for FUNCTION IN RNA PHAGE RESISTANCE, ACTIVE SITE,
      COFACTOR, ACTIVITY REGULATION and the four mutagenesis positions on this entry.
- id: PMID:28086085
  title: Two distant catalytic sites are responsible for C2c2 RNase activities.
  full_text_unavailable: true
  findings:
  - statement: Cas13a has two RNase activities, one for the target and one for crRNA
      processing
    supporting_text: C2c2, the effector of type VI CRISPR-Cas systems, has two RNase
      activities-one for cutting its RNA target and the other for processing the CRISPR RNA
      (crRNA).
    reference_section_type: ABSTRACT
  - statement: The two catalytic pockets are in different domains, Helical-1 for pre-crRNA
      and HEPN for target RNA
    supporting_text: The two RNase catalytic pockets responsible for cleaving pre-crRNA and
      target RNA are independently located on Helical-1 and HEPN domains, respectively.
    reference_section_type: ABSTRACT
  - statement: Structures of this protein were determined in crRNA-free and crRNA-bound
      states
    supporting_text: Here, we report the structures of Leptotrichia shahii C2c2 in its
      crRNA-free and crRNA-bound states.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Cached abstract only (no PMC record); all quoted text is from the abstract and is
      flagged as such. The structure is of this exact protein and is the source of UniProt's
      REC/NUC lobe boundaries and active-site assignments on this entry. It establishes that
      the two RNase activities are at distinct sites, which is why they are modelled as two
      core functions.
- id: PMID:28475872
  title: RNA targeting by functionally orthogonal type VI-A CRISPR-Cas enzymes.
  full_text_unavailable: true
  findings:
  - statement: Type VI-A Cas13a carries two separate ribonuclease activities, for crRNA
      maturation and for ssRNA degradation
    supporting_text: In type VI-A CRISPR-Cas systems, the signature protein Cas13a (formerly
      C2c2) contains two separate ribonuclease activities that catalyze crRNA maturation and
      ssRNA degradation.
    reference_section_type: ABSTRACT
  - statement: The Cas13a family splits into two functional groups with orthogonal crRNA
      recognition and different ssRNA cleavage specificities, not predictable from sequence
    supporting_text: we show that the Cas13a enzyme family comprises two distinct functional
      groups that recognize orthogonal sets of crRNAs and possess different ssRNA cleavage
      specificities
    reference_section_type: ABSTRACT
  - statement: pre-crRNA processing is not essential for ssRNA cleavage but enhances
      targeting by array-internal crRNAs
    supporting_text: we find that Cas13a pre-crRNA processing is not essential for ssRNA
      cleavage, although it enhances ssRNA targeting for crRNAs encoded internally within
      the CRISPR array
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Cached abstract only (publisher restricts PMC full text). Cited correctly. Relevant
      here mainly as a caution: the family's functional split could not be predicted
      bioinformatically, which argues against propagating substrate or guide specificity
      across Cas13a orthologs by similarity. UniProt cites it for FUNCTION IN CRRNA
      PROCESSING on this entry, including the observation that this enzyme cuts L. buccalis
      and L. wadei pre-crRNA at a different position from where those enzymes cut their own.
- id: PMID:31142834
  title: Cas13-induced cellular dormancy prevents the rise of CRISPR-resistant bacteriophage.
  full_text_unavailable: false
  findings:
  - statement: Cas13 uses RNA guides and catalyses both sequence-specific cis- and
      non-specific trans-RNA cleavage
    supporting_text: the type VI effector nuclease Cas13 uses RNA guides to locate
      complementary transcripts and catalyse both sequence-specific cis- and non-specific
      trans-RNA cleavage
    reference_section_type: ABSTRACT
  - statement: trans-cleavage of transcripts halts host growth and is sufficient to abort the
      infectious cycle
    supporting_text: Here we show that trans-cleavage of transcripts halts the growth of the
      host cell and is sufficient to abort the infectious cycle.
    reference_section_type: ABSTRACT
  - statement: The authors conclude the fundamental feature of type VI-A immunity is host
      dormancy produced by transcript destruction, a form of abortive infection
    supporting_text: we believe that the fundamental feature of type VI-A immunity is the
      dormancy of the host cell produced by the destruction of host transcripts. This is
      similar to other phage defense strategies known as abortive infection
    reference_section_type: DISCUSSION
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Full text cached from PMC6570424. Correctly cited, and the paper that established what
      type VI-A immunity actually does to the host cell. The work is on the Listeria
      seeligeri ortholog, not this protein, so it is used here only to justify the term
      request for defence by induced dormancy and to frame the suggested questions; no
      annotation on P0DOC6 rests on it.
core_functions:
- description: >-
    Loaded with a mature crRNA, recognises a complementary single-stranded RNA transcript
    whose 3' protospacer flanking site is not G, and cleaves it preferentially before
    uridines at positions outside the crRNA-pairing region, in exposed single-stranded
    loops, so that the cut site depends on the secondary structure around the target.
    Engagement of a viable target then converts the same active site into a
    substrate-non-specific ribonuclease that degrades unrelated bystander RNA. Catalysis
    is by a single composite site formed where the two HEPN folds meet: substitution of
    either arginine or either histidine of the two R-H dyads abolishes both specific and
    collateral cleavage, and neither HEPN fold compensates for loss of the other, leaving
    a catalytically dead but RNA-programmable RNA-binding protein. Requires Mg2+. There is
    no activity on single-stranded DNA, double-stranded DNA, or partially double-stranded
    RNA.
