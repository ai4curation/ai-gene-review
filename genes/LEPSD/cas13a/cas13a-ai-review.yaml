proposed_new_terms:
- proposed_name: guide RNA-dependent nucleic acid endonuclease activity
  proposed_definition: >-
    Catalysis of the cleavage of ester linkages within a nucleic acid molecule by creating
    internal breaks, where the position of cleavage is determined by base pairing between
    the substrate and a separate guide RNA bound non-covalently by the enzyme. The guide RNA
    is neither substrate nor product; it programs the sequence specificity of an enzyme whose
    active site is otherwise sequence-non-specific, so that the specificity of the catalysis
    is a property of the bound guide rather than of the protein.
  proposed_parent:
    id: GO:0004519
    label: endonuclease activity
  justification: >-
    GO has no molecular-function term for guide-RNA-programmed target recognition or
    cleavage. Checked against the current GO release: no molecular-function label contains
    "RNA-guided", "guide RNA" or "CRISPR". The consequence is that every CRISPR effector, and
    every other guide-dependent nuclease, can only be annotated with a term that describes
    its chemistry (GO:0004520, GO:0004521, GO:0004530, GO:1990238) and is therefore
    indistinguishable in GO from an unguided nuclease of the same chemistry. Cas13a shows the
    cost acutely: the one GO term available, GO:0004521, has to carry both the
    guide-programmed target cleavage and the structure-directed processing of the guide
    itself, two activities at two distant sites in the same protein, and GO can say nothing
    about the difference. Two children are needed, guide RNA-dependent DNA endonuclease
    activity (Cas9 and Cas12 families) and guide RNA-dependent RNA endonuclease activity
    (Cas13 and type III effectors), and the parent would also accommodate class 1
    multi-subunit effectors through contributes_to. This request is deliberately scoped to
    the nuclease function rather than to recognition in general, so that catalytically dead
    guide-loaded effectors - which Cas13a HEPN mutants are, and which are themselves used as
    programmable RNA-binding proteins - are handled by a binding term instead. This is the
    same request as in the reviews of U2UMQ6, A0Q7Q2 and C7NBY4 and should be merged with
    them.
  supported_by:
  - reference_id: PMID:27256883
    supporting_text: Cleavage is mediated by catalytic residues in the two conserved Higher
      Eukaryotes and Prokaryotes Nucleotide-binding (HEPN) domains, mutations of which
      generate catalytically inactive RNA-binding proteins.
  - reference_id: PMID:28086085
    supporting_text: The two RNase catalytic pockets responsible for cleaving pre-crRNA and
      target RNA are independently located on Helical-1 and HEPN domains, respectively.
- proposed_name: defense response to virus by induction of host dormancy
  proposed_definition: >-
    A defense response to virus in which the infected cell halts its own growth and enters a
    reversible non-growing state, so that the viral replication cycle cannot be completed.
    The invader is not cleared from the infected cell and the cell does not necessarily lyse;
    the protective output is realised at the level of the population, because an arrested cell
    continues to adsorb virions while producing no progeny.
  proposed_parent:
    id: GO:0051607
    label: defense response to virus
  justification: >-
    Type VI-A immunity does not work by destroying the invader. Target recognition licenses
    indiscriminate cleavage of cellular transcripts, and it is that degradation, not clearance
    of the phage, that halts the infection; trans-cleavage alone is sufficient to abort the
    infectious cycle. GO cannot express this. The nearest existing terms fail in different
    ways: GO:0051607 defense response to virus is correct but silent about the mechanism and
    about the fate of the infected cell; GO:0022611 dormancy process and its children
    GO:0097436 and GO:0097437 descend from GO:0032502 developmental process and describe a
    developmental programme, so applying them to phage-induced bacterial growth arrest would
    be a branch error rather than a stretch; and GO:0012501 programmed cell death is wrong
    because the arrest is reversible and the cell is not killed. On the question of which
    entity performs the step, the answer here favours the term: Cas13a itself degrades the
    host transcripts, and the arrest follows directly from that degradation rather than being
    executed by something else - which is exactly why the analogous request is not made for
    Cas12a trans-cleavage, where no cellular consequence has been demonstrated. The gap is not
    specific to CRISPR: abortive-infection defence by growth arrest is shared with
    toxin-antitoxin systems, retrons and Thoeris, none of which can be annotated for it
    either, so a term under GO:0051607 would serve a whole class of prokaryotic defence
    systems. No annotation to this term is asserted on P0DOC6, because the dormancy outcome
    was demonstrated on the Listeria seeligeri ortholog rather than on this protein.
  supported_by:
  - reference_id: PMID:31142834
    supporting_text: Here we show that trans-cleavage of transcripts halts the growth of the
      host cell and is sufficient to abort the infectious cycle.
  - reference_id: PMID:31142834
    supporting_text: we believe that the fundamental feature of type VI-A immunity is the
      dormancy of the host cell produced by the destruction of host transcripts. This is
      similar to other phage defense strategies known as abortive infection
  - reference_id: PMID:27256883
    supporting_text: We therefore surmised that, in addition to the cleavage of the target
      RNA, C2c2 CRISPR systems might prevent virus reproduction also via non-specific
      cleavage of cellular mRNAs, causing programmed cell death (PCD) or dormancy
suggested_questions:
- question: >-
    What do the native Leptotrichia shahii CRISPR spacers match? Type VI-A spacers surveyed
    elsewhere matched double-stranded DNA phages rather than RNA phages, which would make the
    MS2 experiment a proof of mechanism rather than a model of the natural threat, and would
    mean the physiological target is a phage transcript rather than a phage genome.
- question: >-
    Does LshCas13a induce reversible dormancy in a host, as the Listeria seeligeri ortholog
    does, and if so what fraction of arrested cells resumes growth once the infection has
    been aborted?
- question: >-
    What are the end-group products of LshCas13a target cleavage? Until these are known, no
    term below GO:0004521 can be justified for this activity, since both available children
    specify a hydrolytic mechanism and a particular phosphomonoester.
- question: >-
    What determines the functional split in the Cas13a family, which could not be predicted
    bioinformatically? Orthologs recognise orthogonal crRNA sets and differ in ssRNA cleavage
    specificity, so guide and substrate specificity should not be propagated across the family
    by sequence similarity.
- question: >-
    Should GO acquire a molecular-function branch for guide-RNA dependence, and a process term
    for defence by induced host dormancy? Both gaps are recorded as term requests here.
suggested_experiments:
- description: >-
    Sequence the native Leptotrichia shahii CRISPR array and search its spacers against phage
    and plasmid databases, to establish whether the system is directed at RNA phages, at
    transcripts of DNA phages, or at mobile elements, which the heterologous MS2 experiment
    cannot answer.
- description: >-
    Measure growth, viability and colony-forming ability of cells expressing the L. shahii
    locus before, during and after targeted phage infection, with and without the HEPN point
    mutants, to test directly whether this ortholog arrests the host as the L. seeligeri
    ortholog does and whether the arrest is reversible.
- description: >-
    Determine the chemical end groups of LshCas13a target-RNA cleavage products by treatment
    with alkaline phosphatase and T4 polynucleotide kinase, as was done for the L. buccalis
    pre-crRNA products, to establish whether the HEPN reaction is hydrolytic and which GO
    child term would apply.
- description: >-
    Quantify collateral RNA degradation in vivo by RNA sequencing of infected cells at
    intervals after targeting, to measure how much of the transcriptome is destroyed, whether
    phage and host transcripts are degraded with equal indiscrimination, and whether
    degradation is self-limiting.
