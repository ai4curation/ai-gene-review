id: P0DOC6
gene_symbol: cas13a
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:1122172
  label: Leptotrichia shahii DSM 19757
description: >-
  Cas13a (originally C2c2) is the single-protein effector of the class 2, type VI-A
  CRISPR-Cas adaptive immune system of Leptotrichia shahii, and the only class of
  single-component CRISPR effector whose target is RNA rather than DNA. The
  1389-residue protein is bilobed: a crRNA-recognition lobe makes most of the contacts
  with the guide, and a nuclease lobe carries two HEPN folds that come together to form
  a single composite ribonuclease active site. The protein matures its own guide,
  cleaving precursor CRISPR RNA one nucleotide upstream of the repeat stem-loop to
  yield a mature crRNA with an optimal 28-nucleotide spacer, using a catalytic pocket
  that is separate from the HEPN site and lies in the recognition lobe. Loaded with that
  crRNA it recognises a complementary single-stranded transcript, with efficacy set by a
  3' protospacer flanking site rather than by a PAM, and cleaves it preferentially before
  uridines. Two features make it unlike DNA-targeting effectors. Cleavage falls outside
  the crRNA-pairing region, in exposed single-stranded loops, so the cut position depends
  on the secondary structure around the target. And engagement of a viable target
  converts the HEPN site into a substrate-non-specific ribonuclease that degrades
  unrelated bystander RNA; the same point mutations in either HEPN dyad abolish both
  specific and collateral cleavage, and either mutation leaves a catalytically inactive,
  RNA-programmable RNA-binding protein. The enzyme has no activity on single-stranded
  DNA, double-stranded DNA or partially double-stranded RNA. The biological output is
  spacer-programmed resistance to RNA invaders: a cell carrying the locus with a matching
  spacer shows a three- to four-log reduction in plaque formation by the single-stranded
  RNA phage MS2, and that protection is lost in each of four single catalytic-residue
  substitutions. Because indiscriminate degradation of cellular transcripts accompanies
  target destruction, type VI-A immunity is thought to act by arresting the infected cell
  rather than by cleanly clearing the invader from it.
existing_annotations:
- term:
    id: GO:0004521
    label: RNA endonuclease activity
  evidence_type: IDA
  original_reference_id: PMID:27256883
  qualifier: enables
  review:
    summary: >-
      Purified LshCas13a loaded with a crRNA cleaves a complementary single-stranded RNA
      target, preferentially before uridines and at positions outside the crRNA-pairing
      region; engagement of that target then licenses cleavage of unrelated bystander
      RNAs by the same active site. The protein also cleaves its own precursor crRNA, at
      a separate catalytic pocket. All of this is endonucleolytic cleavage of RNA, which
      is what this term states.
    action: NEW
    reason: >-
      GOA holds no annotation of any kind for this entry, so every row here is NEW. The
      step is performed by this protein itself: cleavage is measured with purified
      LshCas13a plus crRNA on defined substrates, and all four single alanine
      substitutions of the two HEPN R-H dyads abolish it, which both locates the activity
      in this polypeptide and rules out a contaminating nuclease. GO:0004521 rather than
      its children GO:0016891 or GO:0016892 because those two each stipulate a hydrolytic
      mechanism and specify the product phosphomonoester, and neither the mechanism nor
      the end-group chemistry of LshCas13a target cleavage is established in the
      literature cited; GO:0004521 is defined without reference to mechanism and descends
      from GO:0004519 and GO:0004540 rather than from a hydrolase parent. One row covers
      both the guide-processing and the target/collateral activities because GO cannot
      presently distinguish them - both are RNA endonuclease activity, and what separates
      them is guide dependence, for which no term exists. The distinction is carried in two
      separate core_functions entries instead.
    supported_by:
    - reference_id: PMID:27256883
      supporting_text: Cleavage is mediated by catalytic residues in the two conserved
        Higher Eukaryotes and Prokaryotes Nucleotide-binding (HEPN) domains, mutations of
        which generate catalytically inactive RNA-binding proteins.
    - reference_id: PMID:27256883
      supporting_text: whereas the LshC2c2-crRNA complex did not mediate cleavage of any of
        the four collateral RNAs in the absence of the target RNA, all four were
        efficiently degraded in the presence of the target RNA
    - reference_id: PMID:28086085
      supporting_text: C2c2, the effector of type VI CRISPR-Cas systems, has two RNase
        activities-one for cutting its RNA target and the other for processing the CRISPR
        RNA (crRNA).
- term:
    id: GO:0099048
    label: CRISPR-cas system
  evidence_type: IMP
  original_reference_id: PMID:27256883
  qualifier: involved_in
  review:
    summary: >-
      The native biological process. GO:0099048 names three stages, and LshCas13a performs
      two of them in its own right: it matures the crRNA from the array transcript, and it
      destroys the complementary invader transcript. The remaining stage, spacer
      acquisition, is carried out by Cas1-Cas2 and is not claimed here.
    action: NEW
    reason: >-
      GOA holds no biological-process annotation for this entry. GO:0099048 is the term GO
      provides for this system, its definition names the stages explicitly, and it has no
      children, so there is no more specific alternative. Evidence is IMP: the
      reconstituted locus confers interference, and interference is abolished by single
      substitutions of the catalytic residues, so the phenotype tracks the catalytic
      competence of this gene product rather than merely its presence.
    supported_by:
    - reference_id: PMID:27256883
      supporting_text: We mutated each of these putative catalytic residues separately to
        alanine (R597A, H602A, R1278A, H1283A) in the LshC2c2 locus plasmids and assayed
        for MS2 interference. None of the four mutant plasmids were able to protect E. coli
        from phage infection
    - reference_id: PMID:28086085
      supporting_text: The two RNase catalytic pockets responsible for cleaving pre-crRNA
        and target RNA are independently located on Helical-1 and HEPN domains,
        respectively.
- term:
    id: GO:0051607
    label: defense response to virus
  evidence_type: IMP
  original_reference_id: PMID:27256883
  qualifier: involved_in
  review:
    summary: >-
      The L. shahii locus, reconstituted in E. coli and programmed against the
      single-stranded RNA phage MS2, reduces plaque formation by three to four orders of
      magnitude, and each of four single substitutions in the HEPN catalytic dyads
      abolishes that protection. This is the strongest evidence available for any Cas13a
      and it is on this ortholog.
    action: NEW
    reason: >-
      Loss of function at four independent catalytic residues, against a quantitative
      three-to-four-log phenotype, in the organism's own locus. GO:0051607 is not redundant
      with GO:0099048: they sit in different branches, GO:0099048 under GO:0099046
      clearance of foreign intracellular nucleic acids and GO:0140546, and GO:0051607 under
      GO:0006952 and GO:0009615, so one names the mechanism and the other the class of
      invader resisted. Deliberately asserted at this level and no deeper: the protective
      output of type VI-A immunity is now understood to be arrest of the infected cell
      rather than clearance of the invader from it (PMID:31142834), but that was shown on
      the Listeria seeligeri ortholog, and GO has no term for defence by induced dormancy
      in any case. That gap is raised in proposed_new_terms rather than approximated here.
    supported_by:
    - reference_id: PMID:27256883
      supporting_text: To validate the interference activity of the enriched spacers, we
        individually cloned four top-enriched spacers into pLshC2c2 CRISPR arrays and
        observed a 3- to 4-log10 reduction in plaque formation
    - reference_id: PMID:27256883
      supporting_text: We mutated each of these putative catalytic residues separately to
