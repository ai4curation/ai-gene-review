- description: >-
    Matures its own CRISPR guide, cleaving the precursor crRNA transcribed from the array
    one nucleotide upstream of the repeat stem-loop to yield a mature crRNA with an optimal
    28-nucleotide spacer, with no tracrRNA and no dedicated Cas6-type ribonuclease. This
    uses a catalytic pocket in the crRNA-recognition lobe that is distinct and distant from
    the HEPN target-cleavage site, and depends on the 5' end and bulge-containing stem of
    the crRNA rather than on the spacer sequence. The site specificity is ortholog-specific:
    this enzyme cleaves its own and other Leptotrichia pre-crRNAs three nucleotides away
    from where those enzymes cut their own.
