taxon:
  id: NCBITaxon:196627
  label: Corynebacterium glutamicum ATCC 13032
description: ThrB is the ATP-dependent homoserine kinase of Corynebacterium glutamicum ATCC 13032. It
  phosphorylates L-homoserine to O-phospho-L-homoserine, supplying the penultimate intermediate in L-threonine
  biosynthesis. This standalone GHMP-family kinase acts in the cytoplasm and is encoded in the hom-thrB
  operon. Threonine competes with homoserine at the active site, providing feedback inhibition; the engineered
  A20G variant retains kinase activity but reduces this inhibition.
