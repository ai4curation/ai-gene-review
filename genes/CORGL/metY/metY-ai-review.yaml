suggested_questions:
- question: >-
    Given that the MetY Km for sulfide (8.6 mM) is far above physiological sulfide levels, which sulfur
    donor does MetY use in vivo when cells grow on sulfate, and how much flux does direct sulfhydrylation
    carry relative to MetB/MetC trans-sulfuration?
suggested_experiments:
- description: >-
    13C/34S flux analysis of wild type, metB and metY mutants grown on sulfate to measure the share of
    homocysteine made by each route, combined with intracellular sulfide measurements.
