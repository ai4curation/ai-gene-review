id: Q79VI4
gene_symbol: metY
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:196627
  label: Corynebacterium glutamicum ATCC 13032
description: >-
  O-acetyl-L-homoserine sulfhydrylase (MetY) of Corynebacterium glutamicum, a fold-type I pyridoxal 5'-phosphate
  enzyme of the homocysteine/cysteine synthase family. It makes L-homocysteine in one step from O-acetyl-L-homoserine
  and sulfide, the direct-sulfhydrylation route of methionine biosynthesis that runs in parallel with
  trans-sulfuration (MetB and MetC) in this bacterium; either route alone supports growth without methionine,
  and loss of both causes methionine auxotrophy. The purified enzyme is a homohexamer, is inhibited by
  methionine, and its expression is strongly repressed by methionine. MetY also accepts methanethiol or
  dimethyldisulfide in place of sulfide, forming L-methionine directly, and it is required for growth
  on those sulfur sources.
existing_annotations:
- term:
    id: GO:0003961
    label: O-acetylhomoserine aminocarboxypropyltransferase activity
  evidence_type: EXP
  original_reference_id: PMID:20798582
  qualifier: enables
  review:
    summary: >-
      Isotope labelling and mutant analysis show that methanethiol and dimethyldisulfide are added as
      a whole S-CH3 group to O-acetylhomoserine to form methionine, that MetY catalyses this reaction,
      and that a metY deletion cannot grow on those sulfur sources. That is the reaction GO:0003961 defines
      (O-acetyl-L-homoserine + methanethiol = L-methionine + acetate).
    action: KEEP_AS_NON_CORE
    reason: >-
      A genuine secondary activity with an in vivo role when methanethiol is the sulfur source; the core
      activity is the sulfide reaction, GO:0051009, which is a child of this term. The wild-type activity
      on methanethiol is low (63 mU/mg).
    supported_by:
    - reference_id: PMID:20798582
      supporting_text: >-
        Both sulfur compounds are incorporated as entire molecule, adding the terminal S-CH3 group to
        O-acetylhomoserine. In this reaction, methionine is directly formed.
    - reference_id: PMID:20798582
      supporting_text: >-
        Deletion of metY resulted in methionine auxotrophic strains grown on methanethiol or dimethyldisulfide
        as sole sulfur source.
