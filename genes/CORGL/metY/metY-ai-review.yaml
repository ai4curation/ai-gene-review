- term:
    id: GO:0004124
    label: cysteine synthase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN002887234
  review:
    summary: >-
      TreeGrafter transfer of cysteine synthase (O-acetylserine sulfhydrylase) activity from a PANTHER
      node. No assay of C. glutamicum MetY on O-acetyl-L-serine is reported in the cached sources; the
      characterized activities are on O-acetylhomoserine. The current PAINT snapshot of PTHR43797 has
      replaced cysteine synthase with O-acetylhomoserine sulfhydrylase at the family root.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Cysteine synthase activity is documented for some family members (yeast MET17 converts
      O-acetylserine to cysteine), but the purified C. glutamicum enzyme was characterized only with
      O-acetylhomoserine, and no O-acetylserine assay is reported for it, so the transfer is not
      supported for this protein.
    supported_by:
    - reference_id: file:yeast/MET17/MET17-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: >-
        Also catalyzes the conversion of O-acetylserine (OAS) into cysteine, the last step in the
        cysteine biosynthesis pathway
    - reference_id: PMID:18050920
      supporting_text: >-
        The Km values for the O-acetylhomoserine catalysis effected by MetB and MetY were 3.9 and 6.4
        mM
