    id: GO:0071266
    label: '''de novo'' L-methionine biosynthetic process'
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: involved_in
  supporting_entities:
  - UniRule:UR000160033
  review:
    summary: Asd catalyzes an aspartate-to-homoserine step explicitly included in de novo methionine
      biosynthesis.
    action: ACCEPT
    reason: Retain de novo methionine participation on the same basis in all three Asd reviews. The
      live GO:0071266 definition explicitly includes synthesis from simpler components such as
      L-aspartate or L-homoserine; unlike a salvage-only process, it encompasses the
      aspartate-to-homoserine reactions. This target's curated HAMAP MF_02121 pathway statement
      assigns Asd to step 2/3 of homoserine formation in that de novo route, independently of the
      GOA row itself. Asd performs the precursor-forming chemical reaction, rather than serving as a
      consumed substrate or merely affecting the pathway indirectly. Curated yeast HOM2 methionine
      annotations and its methionine GO-CAM provide a consistent same-role convention. This supports
      the existing term and its use in author-supplied refinements/core functions; it does not
      depend on treating an existing IEA as automatically true. Inherited NEW proposals at other
      PSEPK loci require gene-specific assessment and do not impose a general ban on shared-trunk
      participation. PP_4473 has an untagged curated pathway statement, Hom has an ARBA-only pathway
      statement, and PP_0664 has an uncertain native role; these are not one evidence tier and their
      separate outcomes do not determine this Asd claim.
    supported_by:
    - *id001
    - *id002
    - *id003
    - reference_id: file:CORGL/asd/asd-uniprot.txt
      record_section: *id004
      supporting_text: "CC   -!- PATHWAY: Amino-acid biosynthesis; L-methionine biosynthesis via de novo\n\
        CC       pathway; L-homoserine from L-aspartate: step 2/3. {ECO:0000255|HAMAP-\nCC       Rule:MF_02121}."
- term:
    id: GO:1901705
    label: L-isoleucine biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR005986
  review:
    summary: A distal isoleucine assignment is broader than the conservatively supported Asd process
      scope.
    action: MARK_AS_OVER_ANNOTATED
    reason: Asd catalyzes the shared aspartate-to-homoserine precursor reaction; downstream
      threonine can supply isoleucine. The live GO:1901705 definition does not impose a threonine
      starting boundary and its parents include aspartate-family biosynthesis, so this is not a
      claim that GO forbids shared precursor participation. Nevertheless, the specific Ile
      assignment here rests on an InterPro propagation, not separately established target
      participation in the downstream branch. Same-role Bacillus Q04797 and Mycobacterium P9WNX5
      comparators carry only that same electronic mapping; curated yeast HOM2 P13663 instead has
      homoserine/threonine/methionine assignments, and the inspected yeast/PomBase GO-CAMs model
      those nearer processes. Together with the distinct threonine-to-isoleucine branch described in
      PMID:19946135, this supports a conservative over-annotation verdict rather than asserting
      every downstream destination of the shared precursor as a separate Asd process. Upstream
      carbon supply is not denied; the original row is preserved. Apply the same bounded process
      scope to ECOLI, CORGL and PSEPK Asd.
    supported_by:
    - *id001
    - *id002
    - *id003
    - reference_id: PMID:19946135
      supporting_text: Isoleucine is best known to be derived from threonine in five steps,
        beginning with the formation of 2-ketobutyrate from threonine (catalyzed by threonine
        dehydratase).
