- id: PMID:1980002
  title: Aspartokinase genes lysC alpha and lysC beta overlap and are adjacent to the aspartate
    beta-semialdehyde dehydrogenase gene asd in Corynebacterium glutamicum.
  findings:
  - statement: Native asd DNA complements an asd-deficient host and elevates Asd activity in C.
      glutamicum.
    supporting_text: Plasmids carrying the C. glutamicum asd gene complemented Escherichia coli asd
      mutants. Increase in ASD activity by a factor of 30-60 was measured for C. glutamicum cells
      harbouring high copy-number plasmids with the C. glutamicum asd gene.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract read. The clone originates from a selected lysine-producing strain and
      the recipient includes wild-type ATCC 13032; the 30–60-fold change is plasmid dosage, not
      basal native flux.
- id: file:CORGL/asd/asd-uniprot.txt
  title: UniProtKB asd reviewed record (P0C1D8)
  findings:
  - statement: The curated Asd family rule supports NADPH-dependent reductive dephosphorylation.
    record_section:
    - CC:FUNCTION
    supporting_text: 'CC   -!- FUNCTION: Catalyzes the NADPH-dependent formation of L-aspartate-

      CC       semialdehyde (L-ASA) by the reductive dephosphorylation of L-aspartyl-

      CC       4-phosphate. {ECO:0000255|HAMAP-Rule:MF_02121}.'
  - statement: The same rule supports a homodimer.
    record_section:
    - CC:SUBUNIT
    supporting_text: 'CC   -!- SUBUNIT: Homodimer. {ECO:0000255|HAMAP-Rule:MF_02121}.'
  - statement: The curated HAMAP pathway assignment places Asd at step 2/3 from aspartate to
      homoserine within de novo methionine biosynthesis.
    supporting_text: "CC   -!- PATHWAY: Amino-acid biosynthesis; L-methionine biosynthesis via de novo\n\
      CC       pathway; L-homoserine from L-aspartate: step 2/3. {ECO:0000255|HAMAP-\nCC       Rule:MF_02121}."
    record_section:
    - CC:PATHWAY
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: HAMAP family and residue-level annotations support inference; native cofactor
      preference and homodimer stoichiometry are not separately measured by the retrieved abstract.
- id: PMID:30023797
  title: Reduction of Feedback Inhibition in Homoserine Kinase (ThrB) of Corynebacterium glutamicum
    Enhances l-Threonine Biosynthesis.
  findings:
  - statement: The corynebacterial route comprises the five successive LysC-Asd-Hom-ThrB-ThrC
      reactions.
    supporting_text: From l-aspartate, the biosynthesis of l-threonine comprises five successive
      reactions sequentially catalyzed in Corynebacterium glutamicum by aspartate kinase (LysC),
      aspartyl semialdehyde dehydrogenase (Asd), homoserine dehydrogenase (Hom), homoserine kinase
      (ThrB), and threonine synthase (ThrC) (Figure 1).
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text read. This route statement is introduction/background synthesis, not a
      five-enzyme experiment; direct work in this paper concerns cloned ATCC13032 ThrB.
- id: PMID:19946135
  title: Cohesion group approach for evolutionary analysis of aspartokinase, an enzyme that feeds a
    branched network of many biochemical pathways.
  findings:
  - statement: The threonine-derived isoleucine branch is described as five reactions beginning with
      threonine dehydratase; this biochemical branch convention does not by itself redefine the
      broad GO process.
    supporting_text: Isoleucine is best known to be derived from threonine in five steps, beginning
      with the formation of 2-ketobutyrate from threonine (catalyzed by threonine dehydratase).
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full comparative review distinguishes the shared aspartate-family network from the
      threonine-to-isoleucine branch and alternative citramalate route. It informs process
      boundaries, not a native Asd loss-of-function experiment or a GO axiom excluding shared
      precursors.
