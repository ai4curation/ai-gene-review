taxon:
  id: NCBITaxon:196627
  label: Corynebacterium glutamicum ATCC 13032
description: Asd is the standalone aspartate-semialdehyde dehydrogenase of Corynebacterium
  glutamicum ATCC 13032. It reduces 4-phospho-L-aspartate to L-aspartate 4-semialdehyde using NADPH
  and releasing phosphate. This shared biosynthetic intermediate feeds the diaminopimelate/lysine
  branch and the homoserine branch that supplies threonine and methionine. The enzyme belongs to the
  bacterial aspartate-semialdehyde dehydrogenase family and is inferred to function as a homodimer.
