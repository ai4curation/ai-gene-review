- term:
    id: GO:0030979
    label: alpha-glucan biosynthetic process
  evidence_type: ISS
  original_reference_id: PMID:20305657
  review:
    summary: >-
      As the maltokinase of the TreS-Mak-GlgE-GlgB pathway, Cgl2304 makes maltose
      1-phosphate, the donor substrate GlgE uses to extend alpha-glucan.
    action: NEW
    reason: >-
      Mak catalyses a committed step of the four-enzyme pathway from trehalose to alpha-glucan
      defined in M. tuberculosis, so it does part of the work of alpha-glucan synthesis. It
      is not merely required for it. C. glutamicum has the whole gene set: treS (cg2529) is
      immediately upstream with a 4-nt translational-coupling overlap, and glgE (cg1382) and
      glgB are present. A thesis reports that inactivating cg2530 in a malQ deletion strain
      blocked trehalose and maltose use, which fits a maltose 1-phosphate route. Alpha-glucan
      biosynthetic process is used rather than glycogen biosynthetic process because GlgE
      pathway flux to glycogen has not been shown in C. glutamicum. There, glycogen is also made
      by the classical GlgC/GlgA route (PMID:12855718). Comparator check: other enzymes in the
      same pathway are annotated at this level or at the glycogen level. M. tuberculosis and
      M. smegmatis GlgE (P9WQ17, Q9RP48) carry alpha-glucan biosynthetic process, and the
      reviewed mycobacterial maltokinases (O07177, A0R6D9) carry glycogen biosynthetic process.
    supported_by:
    - reference_id: PMID:20305657
      supporting_text: >-
        We describe a new pathway from trehalose to alpha-glucan in
        Mycobacterium tuberculosis comprising four enzymatic steps mediated by TreS,
        Pep2, GlgE (which has been identified as a maltosyltransferase that uses maltose
        1-phosphate) and GlgB.
    - reference_id: file:CORGL/Cgl2304/Cgl2304-bioinformatics/RESULTS.md
      supporting_text: >-
        The two CDSs overlap by 4 nt (gap_to_next = -4), the ATGA
        overlap typical of translationally coupled genes.
    - reference_id: file:CORGL/Cgl2304/Cgl2304-deep-research-claude-code.md
      supporting_text: >-
        C. glutamicum ΔmalQ IM treX did not seem to be able to utilize trehalose for growth
