core_functions:
- description: >-
    Probable maltokinase: ATP-dependent phosphorylation of maltose to alpha-maltose
    1-phosphate (EC 2.7.1.175, RHEA:31915), feeding the maltosyltransferase GlgE in the
    TreS-Mak-GlgE-GlgB route from trehalose to alpha-glucan. Inferred from conserved
    active-site residues and the treS-coupled gene arrangement. The protein lacks the
    N-terminal cap subdomain of mycobacterial Mak, and its activity has not been measured.
  proposed_molecular_function: maltokinase activity
  directly_involved_in:
  - id: GO:0030979
    label: alpha-glucan biosynthetic process
  - id: GO:0046835
    label: carbohydrate phosphorylation
  supported_by:
  - reference_id: PMID:20507595
    supporting_text: >-
      The enzyme was dependent on maltose and ATP, although GTP and UTP could be used to
      produce maltose-1-phosphate
  - reference_id: file:CORGL/Cgl2304/Cgl2304-bioinformatics/RESULTS.md
    supporting_text: >-
      The catalytic loop of Cgl2304 is HGDLHLGQ (residues 246-253). It is identical to the loop of
      every reference maltokinase
proposed_new_terms:
- proposed_name: maltokinase activity
  proposed_definition: >-
    Catalysis of the reaction: ATP + D-maltose = ADP + alpha-maltose 1-phosphate + H+.
  justification: >-
    Maltokinase (EC 2.7.1.175, RHEA:31915) is a characterised enzyme activity of the
    TreS-Mak-GlgE-GlgB alpha-glucan pathway in actinobacteria, with biochemically and
    structurally characterised members (M. bovis BCG, M. vanbaalenii, Actinoplanes,
    S. coelicolor). GO has no term for it, so reviewed maltokinases carry only process terms
    and the activity can only be stated as generic carbohydrate kinase activity.
  proposed_parent:
    id: GO:0019200
    label: carbohydrate kinase activity
  supported_by:
  - reference_id: PMID:20507595
    supporting_text: >-
      The enzyme was dependent on maltose and ATP, although GTP and UTP could be used to
      produce maltose-1-phosphate
suggested_questions:
- question: >-
    Does purified Cgl2304 phosphorylate maltose with ATP and Mg2+ to alpha-maltose 1-phosphate,
    and does the Asp265Asn (DFE) mutant abolish activity?
- question: >-
    Does Cgl2304 bind C. glutamicum TreS (Cgl2303) and get stimulated by it, as mycobacterial
    Pep2 does, despite lacking the N-terminal cap subdomain?
- question: >-
    How much does the TreS-Mak-GlgE route contribute to glycogen or other alpha-glucan in
    C. glutamicum, compared with the GlgC/GlgA route?
suggested_experiments:
- description: >-
    Express Cgl2304 (wild type and the D265N and Y338A/Y342A mutants), assay ATP-dependent
    maltose phosphorylation by coupled ADP release, and confirm maltose 1-phosphate by TLC
    and NMR; repeat with added TreS (Cgl2303).
  experiment_type: in vitro enzyme assay with active-site mutants
- description: >-
    Build a markerless in-frame cg2530 deletion and a non-polar treS deletion, alone and in
    glgE and glgC backgrounds. Measure maltose 1-phosphate, trehalose and glycogen, and test
    growth on trehalose and maltose.
  experiment_type: genetic and metabolite analysis
