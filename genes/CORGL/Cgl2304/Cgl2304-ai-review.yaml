    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Full text checked. It is the only peer-reviewed paper naming cg2530; it reports
      homology only and cites unpublished data. Its "Pep1" label for the maltose kinase is a
      naming slip: Pep2 is the maltokinase (PMID:20305657, PMID:15378530).
