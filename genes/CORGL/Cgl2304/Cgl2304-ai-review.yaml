      cg2530 is named as a homolog of the mycobacterial maltose kinase. The paper calls that
      kinase "Pep1", whereas the mycobacterial maltokinase is Pep2 and Streptomyces pep1 is GlgE.
    supporting_text: >-
      maltose formed from trehalose by TreS is incorporated into glycogen by the
      consecutive action of the maltose kinase Pep1 and the maltosyltransferase GlgE
