taxon:
  id: NCBITaxon:196627
  label: Corynebacterium glutamicum ATCC 13032
description: >-
  Cgl2304 (cg2530) is a 363-residue cytoplasmic protein of Corynebacterium glutamicum and the
  probable maltokinase (Mak, also called Pep2; EC 2.7.1.175). It would phosphorylate maltose
  with ATP to make alpha-maltose 1-phosphate, the second step of the TreS-Mak-GlgE-GlgB pathway.
  That pathway turns trehalose into alpha-glucan: TreS converts trehalose to maltose, Mak makes
  maltose 1-phosphate, the maltosyltransferase GlgE adds maltosyl units to alpha-1,4-glucan, and
  GlgB adds branches. Cgl2304 belongs to the eukaryotic-like (aminoglycoside phosphotransferase-type)
  kinase fold. It is 40-44% identical to characterised maltokinases from mycobacteria,
  Actinoplanes and Streptomyces over almost its whole length. It keeps their P-loop
  (EQSN), the ATP lysine, the catalytic loop HGDLHLGQ with the catalytic Asp248, the
  Mg-binding DFE motif (Asp265) and the Lys/Tyr/Tyr maltose-binding residues. Unlike those
  enzymes, it lacks the N-terminal cystatin-like cap subdomain, which in mycobacteria is
  thought to regulate activity and to dock Mak onto TreS. Other corynebacterial orthologs are
  equally short, and an in-frame stop codon lies just upstream of the start, so the short
  form is real rather than a gene-model error. The gene lies directly downstream of
  treS (cg2529) and overlaps it by 4 nt, so the two are probably translationally coupled. This
  is the same treS-mak arrangement as in mycobacteria, and C. glutamicum also encodes GlgE
  (cg1382) and GlgB. Insertional inactivation of cg2530 in a strain lacking the amylomaltase
  MalQ prevented growth on trehalose and maltose. This points to a second, MalQ-independent
  route for these sugars through maltose 1-phosphate. Wild-type cells with the same insertion
  grew normally. Maltokinase activity of the C. glutamicum protein has not been measured, and
  the gene's old names ("trehalose synthase", "probably involved in trehalose biosynthesis")
  come from its orthogroup label, not from evidence.
existing_annotations:
- term:
    id: GO:0019200
    label: carbohydrate kinase activity
  evidence_type: ISS
  original_reference_id: PMID:25619172
  review:
    summary: >-
      Cgl2304 is a probable ATP-dependent maltose kinase (maltokinase, EC 2.7.1.175). GO has no
      maltokinase activity term, so carbohydrate kinase activity is the most specific existing
      term.
    action: NEW
    reason: >-
      GOA has no annotations for Q8NNA0. Cgl2304 is 40-44% identical over 91-99% of its length
      to six characterised maltokinases (M. tuberculosis/M. bovis BCG, M. vanbaalenii,
      M. smegmatis, Actinoplanes missouriensis, S. coelicolor Pep2). It keeps every catalytic,
      Mg-binding, nucleotide-binding and maltose-binding residue named in the M. vanbaalenii
      Mak structure paper, including the Mg-binding Asp whose mutation abolishes activity of the
      M. tuberculosis enzyme. The reaction transfers phosphate from ATP to maltose, which matches
      the definition of carbohydrate kinase activity. A maltokinase activity term is proposed
      under proposed_new_terms. The inference is from homology and conserved active-site
      residues; the C. glutamicum protein has not been assayed. It also lacks the Mak N-terminal
      cap subdomain, whose effect on activity is unknown.
    supported_by:
