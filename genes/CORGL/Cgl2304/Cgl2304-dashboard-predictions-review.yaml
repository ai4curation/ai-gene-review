- id: file:CORGL/Cgl2304/Cgl2304-dashboard-prediction-evidence/dashboard_page.txt
  title: gene-annotate dashboard review page for NZ_CP025533.1_2296
  findings:
  - statement: The dashboard page's prior-annotation panel already lists maltokinase.
    supporting_text: K16146 — maltokinase [EC:2.7.1.175]
  - statement: The call is a fold-level kinase-like annotation with metabolic context.
    supporting_text: Protein kinase-like family protein associated with trehalose and alpha-glucan metabolism.
  - statement: The model rejected maltose kinase activity for lack of characterization.
    supporting_text: >-
      A specific trehalose synthase assignment is rejected because the orthogroup
      prediction lacks biochemical corroboration; maltose kinase activity likewise remains
      unsupported.
  - statement: The dashboard drew no GO terms from the call.
    supporting_text: No GO term could be drawn from this call.
  - statement: The PaperBLAST snippet the model saw was truncated before the words "maltose kinase".
    supporting_text: >-
      [snippet] GlgE (7, 17). Genes encoding homologs of Pep1 (cg2530) and GlgE (cg1382)
      were also identified in C. glutamicum but have not yet been characterized
- id: file:CORGL/Cgl2304/Cgl2304-bioinformatics/RESULTS.md
  title: >-
    Cgl2304 (Q8NNA0): comparison with characterised maltokinases, catalytic residues and
    gene context
  findings:
  - statement: Cgl2304 is 40-44% identical to six characterised maltokinases over 91-99% of its length.
    supporting_text: >-
      Cgl2304 is about 40-44% identical to all six characterised maltokinases over 91-99% of its length.
  - statement: The maltokinase catalytic loop is conserved exactly.
    supporting_text: >-
      The catalytic loop of Cgl2304 is HGDLHLGQ (residues 246-253). It is identical to the loop of
      every reference maltokinase
  - statement: The Pfam Mak N-terminal cap HMM does not hit Cgl2304.
    supporting_text: >-
      The Pfam Mak_N_cap HMM (PF18085) hits all six reference maltokinases
  - statement: The gene overlaps treS by 4 nt and its model is not N-terminally truncated.
    supporting_text: >-
      The two CDSs overlap by 4 nt (gap_to_next = -4), the ATGA
      overlap typical of translationally coupled genes.
- id: PMID:20802079
  title: Link between phosphate starvation and glycogen metabolism in Corynebacterium glutamicum, revealed by metabolomics.
  findings:
  - statement: cg2530 is named as a homolog of the mycobacterial maltose kinase, with the maltose kinase labelled Pep1.
    supporting_text: >-
      maltose formed from trehalose by TreS is incorporated into glycogen by the
      consecutive action of the maltose kinase Pep1 and the maltosyltransferase GlgE
- id: PMID:25619172
  title: Structure of mycobacterial maltokinase, the missing link in the essential GlgE-pathway.
  findings:
  - statement: The maltokinase catalytic loop HGD and DFE motif carry the catalytic base and the Mg-binding Asp.
    supporting_text: >-
      the catalytic loop (303HGD305) and the 322DFE324 motif that contain the putative
      catalytic base (Asp305) and the magnesium-binding Asp322, respectively
  - statement: Mutating the Mg-binding Asp abolishes Mtb maltokinase activity.
    supporting_text: >-
      mutation of the invariant magnesium-binding Asp339 of MakMtb (Asp322 in MakMvan) to
      asparagine completely abolished the enzymatic activity
- id: PMID:20507595
  title: Biochemical characterization of the maltokinase from Mycobacterium bovis BCG.
  findings:
  - statement: The mycobacterial ortholog is an ATP-dependent maltokinase making maltose-1-phosphate.
    supporting_text: >-
      The enzyme was dependent on maltose and ATP, although GTP and UTP could be used to
      produce maltose-1-phosphate
