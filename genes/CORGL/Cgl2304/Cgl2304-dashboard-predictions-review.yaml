description: >-
  The KBase gene-annotate dashboard (Dark Protein Atlas) LLM call for C. glutamicum
  NZ_CP025533.1_2296 (363 aa, tier B) is "Protein kinase-like family protein associated
  with trehalose and alpha-glucan metabolism." The dashboard's GO extractor drew no GO
  terms from it, so there are no term predictions to score. The sequence is identical over
  its full length to C. glutamicum ATCC 13032 Cgl2304 (cg2530, NCgl2222; Q8NNA0), and GOA
  for Q8NNA0 is empty. Everything the call says is true: the protein has a protein
  kinase-like fold, and its STRING partners are the trehalose and alpha-glucan enzymes
  TreS, GlgE, TreZ, GlgB and TreY. But the call stops at the fold, and its trace rejects
  maltose kinase activity for lack of characterization. The evidence supports that
  activity well. Cgl2304 is 40-44% identical, over 91-99% of its length, to six
  characterised maltokinases (Mak/Pep2, EC 2.7.1.175) from M. tuberculosis, M. bovis BCG,
  M. vanbaalenii, M. smegmatis, Actinoplanes missouriensis and S. coelicolor. Every
  catalytic, Mg-binding, nucleotide-binding and maltose-binding residue named in the
  maltokinase structure paper is conserved. These include the HGDLHLGQ catalytic loop,
  identical in all six enzymes, the DFE Mg-binding Asp, and the Lys/Tyr/Tyr
  maltose-binding triad. The gene lies directly downstream of treS (cg2529), with a 4-nt
  ATGA translational-coupling overlap. This is the conserved treS-mak arrangement of
  mycobacteria, and the genome also encodes GlgE (cg1382) and GlgB. The paper behind the
  call's PaperBLAST snippet (PMID:20802079) names cg2530 as a homolog of "the maltose
  kinase Pep1". "Pep1" is a misnomer there: the mycobacterial maltokinase is Pep2, and in
  Streptomyces "pep1" is the GlgE locus. The snippet shown to the model was cut before that
  phrase, so the model saw only "uncharacterized". The dashboard page's "Known before"
  panel already shows eggNOG mak and KEGG K16146 maltokinase (EC 2.7.1.175). In a 2011 PhD
  thesis (not peer reviewed), an insertion in cg2530 in a malQ deletion background
  abolished trehalose and maltose use, which fits a TreS-Mak route. One real difference
  from the reference enzymes is that Cgl2304 lacks the maltokinase N-terminal cap
  subdomain (no Pfam Mak_N_cap hit). This is typical of corynebacterial orthologs and is not
  a gene-model error: an in-frame stop lies 5 codons upstream. No maltokinase activity has
  been measured for the C. glutamicum protein. Recommended dashboard verdict: under-called.
  Suggested annotation: "Maltokinase (Mak/Pep2; maltose + ATP -> maltose 1-phosphate, EC
  2.7.1.175), probable, of the TreS-Mak-GlgE-GlgB alpha-glucan pathway; encoded
  downstream of and translationally coupled to treS; lacks the Mak N-terminal cap
  subdomain". The empty GO set is not an error, because GO has no maltokinase activity
  term. Carbohydrate kinase activity (GO:0019200) and carbohydrate phosphorylation
  (GO:0046835) would be safe parents.
