- id: PMID:30023797
  title: Reduction of Feedback Inhibition in Homoserine Kinase (ThrB) of Corynebacterium glutamicum Enhances
    l-Threonine Biosynthesis.
  findings:
  - statement: The corynebacterial route comprises the five successive LysC-Asd-Hom-ThrB-ThrC reactions.
    supporting_text: From l-aspartate, the biosynthesis of l-threonine comprises five successive reactions
      sequentially catalyzed in Corynebacterium glutamicum by aspartate kinase (LysC), aspartyl semialdehyde
      dehydrogenase (Asd), homoserine dehydrogenase (Hom), homoserine kinase (ThrB), and threonine synthase
      (ThrC) (Figure 1).
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text read. This route statement is introduction/background synthesis, not a five-enzyme
      experiment; direct work in this paper concerns cloned ATCC13032 ThrB.
