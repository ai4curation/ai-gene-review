gene_symbol: hom
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:196627
  label: Corynebacterium glutamicum ATCC 13032
description: Hom is the standalone homoserine dehydrogenase of Corynebacterium glutamicum ATCC 13032.
  It reduces L-aspartate 4-semialdehyde to L-homoserine, directing the shared aspartate-derived precursor
  into threonine and methionine biosynthesis. NADPH-dependent chemistry is supported by the conserved
  Hom family and biochemical work on related corynebacterial enzymes. Wild-type C. glutamicum Hom is feedback
  inhibited by threonine; mutations affecting its C-terminal regulatory region can release this inhibition
  and alter flux between the homoserine and lysine branches.
