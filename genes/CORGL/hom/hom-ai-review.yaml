- id: PMID:1743520
  title: A C-terminal deletion in Corynebacterium glutamicum homoserine dehydrogenase abolishes allosteric
    inhibition by L-threonine.
  findings:
  - statement: Wild-type C. glutamicum Hom is inhibited by threonine; mutant deregulation is a distinct
      phenotype.
    supporting_text: L-Threonine inhibits the wild-type (wt) enzyme with a Ki of 0.16 mM.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract read; full publisher access returned403. The abstract does not identify the
      strain or establish a NADH/NADPH comparison. Core Hom activity is independently corroborated.
- id: PMID:4394351
  title: Regulation of aspartate family amino acid biosynthesis in Brevibacterium flavum. 3. Properties
    of homoserine dehydrogenase.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Canonical paper identity. The PMID cache contains bibliographic text only; the same
      paper was recovered as the J-STAGE PDF URL cited separately for verbatim evidence. B. flavum No.2247
      is not ATCC13032. See hom-source-analysis.md for the manifestation mapping; count these as one paper.
- id: url:https://www.jstage.jst.go.jp/article/biochemistry1922/68/3/68_3_311/_pdf
  title: Regulation of Aspartate Family Amino Acid Biosynthesis in Brevibacterium flavum III. Properites
    of Homoserine Dehydrogenase
  findings:
  - statement: A partially purified B. flavum No.2247 enzyme was assayed with NADPH and showed ordered
      substrate/product interaction.
    supporting_text: "These \nresults suggest an ordered mechanism for the reaction, in which NADPH is\
      \ the first \nbinding substrate and NADP+ is the last releasing product."
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full primary PDF read. Alternate manifestation of PMID:4394351, identical authors/journal/year/pages.
      OCR artifacts retained in the cache; source title is the fetched title, including its typo. This
      is comparative strain evidence, not native ATCC13032 cofactor specificity.
- id: PMID:2835591
  title: Nucleotide sequence and fine structural analysis of the Corynebacterium glutamicum hom-thrB operon.
  findings:
  - statement: Corynebacterial hom and thrB encode distinct proteins in an operon.
    supporting_text: A polypeptide of Mr 46,136 is encoded by hom and a polypeptide of Mr 32,618 is encoded
      by thrB.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract read. UniProt assigns this sequence study to ATCC13059, not ATCC13032. Supports
      conserved standalone architecture.
