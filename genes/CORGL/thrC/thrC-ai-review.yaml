- id: PMID:2127631
  title: The molecular structure of the Corynebacterium glutamicum threonine synthase gene.
  findings:
  - statement: C. glutamicum thrC was mapped using complementation.
    supporting_text: The minimal region encoding the Corynebacterium glutamicum threonine synthase structural
      gene and its promoter was mapped by deletion analysis and complementation of the C. glutamicum thrC
      allele to a 1.6 kb region of the recombinant plasmid pFS80.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract read. Native gene-level evidence is corynebacterial, but this abstract does
      not establish an ATCC13032 assay. It states thrC is expressed independently of hom/thrB.
- id: PMID:8074505
  title: Analysis and expression of the thrC gene of Brevibacterium lactofermentum and characterization
    of the encoded threonine synthase.
  findings:
  - statement: Purified B.lactofermentum enzyme directly converts phosphohomoserine to threonine with
      PLP.
    supporting_text: The purified enzyme required pyridoxal phosphate as its only cofactor to convert
      homoserine phosphate into threonine.
  - statement: The active enzyme in the characterized strain is monomeric.
    supporting_text: The active form corresponded to a monomeric 52.8-kDa protein, as shown by sodium
      dodecyl sulfate-polyacrylamide gel electrophoresis.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract read; PMC landing page has abstract and references, not body text. UniProt
      associates the sequence study with ATCC13869 and the abstract names complementation/overexpression
      host UL1035. These are not native ATCC13032 oligomer measurements.
