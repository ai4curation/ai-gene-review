taxon:
  id: NCBITaxon:196627
  label: Corynebacterium glutamicum ATCC 13032
description: ThrC is the pyridoxal-phosphate-dependent threonine synthase of Corynebacterium glutamicum
  ATCC 13032. It converts O-phospho-L-homoserine and water to L-threonine and inorganic phosphate, completing
  threonine biosynthesis from aspartate. It is a standalone threonine synthase rather than part of an
  aspartokinase-homoserine-dehydrogenase fusion. Corynebacterial genetics and purified-enzyme studies
  support the conserved reaction and PLP requirement.
