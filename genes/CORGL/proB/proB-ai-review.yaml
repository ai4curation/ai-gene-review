- id: PMID:39514317
  title: 'Challenging a decades-old paradigm: ProB and ProA do not channel the unstable intermediate in
    proline synthesis after all.'
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full primary source provides E. coli native-locus monomeric-GFP localization as a comparator
      for soluble glutamate kinases. It does not directly localize this target, establish a stable ProA-ProB
      complex here, or demonstrate substrate channeling.
  findings:
  - statement: E. coli native-locus monomeric-GFP ProB is dispersed in the cytoplasm; together with target
      HAMAP localization and soluble architecture this supports, but does not experimentally demonstrate,
      cytosolic localization of the present homolog.
    supporting_text: When we express ProB and ProA tagged with monomeric superfolder GFP (msfGFP) from
      a gene integrated into the native locus, both proteins are dispersed throughout the cytoplasm
