  review:
    summary: RNA binding remains unresolved for this target.
    action: UNDECIDED
    reason: The PUA domain is compatible with RNA binding but does not establish it on this protein. PMID:37511294
      demonstrated weak specific RNA binding by E. coli K-12 ProB using SELEX and competition EMSA, contradicting
      a family-wide rejection; neither the RNA-binding site nor conservation of that activity in this
      target was established. No target-specific RNA assay was found. Do not infer RNA binding from the
      PUA signature alone or infer its absence from a metabolic role.
