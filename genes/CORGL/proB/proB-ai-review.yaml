- id: PMID:25367752
  title: 'Evolution of proline biosynthesis: enzymology, bioinformatics, genetics, and transcriptional
    regulation.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Comparative review. The repository cache contains the abstract, while the publisher
      full text was independently inspected at https://onlinelibrary.wiley.com/doi/10.1111/brv.12146 on
      2026-11-07 UTC. The pathway overview supports conserved chemistry and alternative routes; it is
      not a target-specific activity or localization assay. Older channeling interpretations do not establish
      a stable complex on these target proteins.
  findings:
  - statement: The prevalent glutamate route separates kinase phosphorylation from reductase production
      of glutamate semialdehyde, which cyclizes spontaneously before the final proline-forming reduction.
    supporting_text: glutamate is phosphorylated to γ-glutamyl phosphate by γ-glutamyl kinase, reduced
      to γ-glutamyl semialdehyde by γ-glutamyl phosphate reductase, cyclized spontaneously to Δ(1)-pyrroline-5-carboxylate
- id: PMID:8755867
  title: 'Mutations in the Corynebacterium glutamicum proline biosynthetic pathway: a natural bypass of
    th proA step.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cached abstract read. ATCC17965 complementation/mutants are a strain comparison for
      ATCC13032; residual proA-mutant growth and asd rescue argue for a bypass. Full text was not recovered.
  findings:
  - statement: The ATCC 17965 proB locus complements an E. coli proB auxotroph, supporting the conserved
      kinase function; the reviewed ATCC 13032 sequence is not the experimentally cloned strain.
    supporting_text: Two chromosomal loci containing the Corynebacterium glutamicum ATCC 17965 proB and
      proC genes were isolated by complementation of Escherichia coli proB and proC auxotrophic mutants.
  - statement: C. glutamicum ATCC 17965 proB complements an E. coli proB auxotroph, and a C. glutamicum
      proB mutant is proline auxotrophic with altered cell morphology; these phenotypes corroborate the
      kinase role in a different strain.
    supporting_text: A proB mutant has a pleiotropic phenotype, being both proline auxotrophic and affected
      in cell morphology.
  full_text_unavailable: true
- id: PMID:37511294
  title: Investigating the Prevalence of RNA-Binding Metabolic Enzymes in E. coli.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full primary text read. ASKA K12 ProB was recloned into pET21a and assayed by SELEX/EMSA.
      This is positive Ecoli binding evidence, not an assay on the present target; binding site and physiological
      regulatory effect remain unresolved.
  findings:
  - statement: E. coli ProB enriches RNA sequences by SELEX and binds one tested RNA specifically in EMSA,
      but the interaction is weak and its binding site and physiological effect remain unresolved. This
      does not demonstrate RNA binding by the present target.
    supporting_text: SELEX with glutamate-5-Kinase (ProB) revealed a small number of highly amplified
      RNA fragments. Representative EMSA experiments with one of those sequences confirmed the specific
      binding.
