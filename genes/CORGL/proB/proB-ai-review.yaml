taxon:
  id: NCBITaxon:196627
  label: Corynebacterium glutamicum ATCC 13032
description: Corynebacterium glutamicum ProB is a soluble cytoplasmic glutamate 5-kinase that transfers
  phosphate from ATP to L-glutamate, producing L-glutamyl 5-phosphate for the first step of proline biosynthesis.
  ProB supplies the initiating phosphorylation step of the glutamate route to proline.
