taxon:
  id: NCBITaxon:196627
  label: Corynebacterium glutamicum ATCC 13032
description: Corynebacterium glutamicum ProA is a soluble cytoplasmic gamma-glutamyl phosphate reductase
  that uses NADPH to reduce L-glutamyl 5-phosphate to L-glutamate 5-semialdehyde. The latter cyclizes
  spontaneously to pyrroline-5-carboxylate, a precursor of proline. ProA supplies the reductive step of
  the glutamate route; a bypass observed in another C. glutamicum strain does not invalidate the canonical
  enzyme.
