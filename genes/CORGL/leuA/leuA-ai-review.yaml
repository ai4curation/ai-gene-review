- id: PMID:8117072
  title: 'Leucine synthesis in Corynebacterium glutamicum: enzyme activities, structure
    of leuA, and effect of leuA inactivation on lysine synthesis.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Primary characterization of C. glutamicum leuA: cloning by
      complementation, leucine feedback inhibition of IPMS, attenuator-like
      leader, and leuA inactivation in lysine producers. Abstract-only in the
      cache; UniProt curates function, regulation and disruption phenotype
      from it.
  findings:
  - statement: IPMS is inhibited by leucine with Ki 0.4 mM.
    supporting_text: >-
      The first enzyme of the pathway is
      inhibited by leucine (Ki = 0.4 mM)
  - statement: The leuA fragment encoding isopropylmalate synthase was cloned by complementation and sequenced.
    supporting_text: >-
      The leuA complementing fragment
      encoding the isopropylmalate synthase was sequenced.
  - statement: leuA has features of attenuation control upstream.
    supporting_text: >-
      Upstream of leuA there
      is extensive hyphenated dyad symmetry and a putative leader peptide, which are
      features characteristic of attenuation control.
- id: PMID:24333966
  title: 'Pushing product formation to its limit: metabolic engineering of Corynebacterium
    glutamicum for L-leucine overproduction.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Identifies the feedback-resistant LeuA R529H/G532D variant and uses it
      to engineer L-leucine overproduction.
  findings:
  - statement: Wild-type IPMS is inhibited by low L-leucine concentrations.
    supporting_text: >-
      the
      leuA-encoded 2-isopropylmalate synthase (IPMS) is inhibited by low L-leucine
      concentrations with a K(i) of 0.4 mM.
  - statement: The R529H/G532D double substitution confers feedback resistance.
    supporting_text: >-
      We identified a feedback-resistant IMPS
      variant, which carries two amino acid exchanges (R529H, G532D).
- id: PMID:15159544
  title: Crystal structure of LeuA from Mycobacterium tuberculosis, a key enzyme in
    leucine biosynthesis.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Structure of the actinobacterial ortholog; locates leucine feedback
      inhibition in the C-terminal regulatory domain and shows a domain-swapped
      dimer with an active-site zinc. Ortholog evidence, used for context only.
  findings:
  - statement: The C-terminal regulatory domain is the site of leucine feedback inhibition in M. tuberculosis LeuA.
    supporting_text: >-
      Mutational and crystallographic data indicate the latter as the site
      for leucine feedback inhibition of activity.
