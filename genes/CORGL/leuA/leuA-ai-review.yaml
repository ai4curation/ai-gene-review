id: P42455
gene_symbol: leuA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:196627
  label: Corynebacterium glutamicum ATCC 13032
description: >-
  leuA encodes 2-isopropylmalate synthase (alpha-isopropylmalate synthase,
  IPMS, EC 2.3.3.13), the first committed enzyme of leucine biosynthesis in
  Corynebacterium glutamicum. The 616-residue, homodimeric LeuA type 2 enzyme
  condenses the acetyl group of acetyl-CoA with 3-methyl-2-oxobutanoate
  (2-ketoisovalerate) to form (2S)-2-isopropylmalate, using a divalent metal
  ion bound in an N-terminal pyruvate carboxyltransferase (TIM barrel)
  domain. A C-terminal regulatory domain mediates feedback inhibition by
  L-leucine (Ki 0.4 mM); the R529H/G532D double substitution in this region
  yields a feedback-resistant enzyme used to engineer L-leucine
  overproduction. leuA expression is additionally controlled by attenuation,
  and leuA disruption causes leucine auxotrophy. Because LeuA draws on the
  2-ketoisovalerate and acetyl-CoA pools, its inactivation was used to raise
  lysine yields in industrial strains.
existing_annotations:
- term:
    id: GO:0000287
    label: magnesium ion binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: enables
  review:
    summary: >-
      HAMAP MF_00572 predicts a Mg2+ ion bound by four residues of the
      catalytic domain.
    action: KEEP_AS_NON_CORE
    reason: >-
      The metal is a catalytic cofactor of the synthase, not a separate
      function. The metal identity has not been tested for this enzyme (the
      M. tuberculosis LeuA structure has zinc in the active site,
      PMID:15159544), but the HAMAP rule's Mg2+ assignment is plausible and
      retained as non-core cofactor information, as in the PSEPK leuA review.
    supported_by:
    - reference_id: file:CORGL/leuA/leuA-uniprot.txt
      record_section: ["CC:COFACTOR"]
      supporting_text: 'Name=Mg(2+); Xref=ChEBI:CHEBI:18420;'
- term:
    id: GO:0003824
    label: catalytic activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: >-
      Root molecular-function class from the pyruvate carboxyltransferase
      domain signature (IPR000891).
    action: MODIFY
    reason: >-
      True but uninformative; the specific activity, 2-isopropylmalate
      synthase (GO:0003852), is an is_a descendant, is accepted in this review
      and is supported by complementation and disruption data. Same action as
      the yeast LEU4/LEU9 and S. pombe leu3 reviews.
    proposed_replacement_terms:
    - id: GO:0003852
      label: 2-isopropylmalate synthase activity
    supported_by:
    - reference_id: file:CORGL/leuA/leuA-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: >-
        Complements an E.coli
        leuA deletion (PubMed:8117072).
- term:
    id: GO:0003852
    label: 2-isopropylmalate synthase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: >-
      LeuA catalyses the condensation of acetyl-CoA with 2-ketoisovalerate to
      2-isopropylmalate.
    action: ACCEPT
    reason: >-
      The electronic assignment agrees with experimental data on this protein:
      the cloned leuA fragment raises isopropylmalate synthase activity,
      complements an E. coli leuA deletion, and its disruption abolishes the
      activity and causes leucine auxotrophy (PMID:8117072, curated in
      UniProt).
    supported_by:
    - reference_id: PMID:8117072
      supporting_text: >-
        The leuA complementing fragment
        encoding the isopropylmalate synthase was sequenced.
    - reference_id: file:CORGL/leuA/leuA-uniprot.txt
      record_section: ["CC:DISRUPTION PHENOTYPE"]
      supporting_text: >-
        Lacks 2-isopropylmalate synthase activity, no
        longer grows in the absence of leucine
- term:
    id: GO:0003985
    label: acetyl-CoA C-acetyltransferase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: enables
  review:
    summary: >-
      This assigns thiolase chemistry (two acetyl-CoA to acetoacetyl-CoA),
      which is not the LeuA reaction.
    action: REMOVE
    reason: >-
      LeuA transfers the acetyl group of acetyl-CoA onto 2-ketoisovalerate to
      give 2-isopropylmalate; it does not condense two acetyl-CoA molecules.
      GO:0003985 is not an ancestor of GO:0003852, so the UniRule-derived term
      is a wrong mapping rather than a broad one. Same action as the PSEPK
      leuA review.
    supported_by:
    - reference_id: file:CORGL/leuA/leuA-uniprot.txt
      record_section: ["CC:CATALYTIC ACTIVITY"]
      supporting_text: Reaction=3-methyl-2-oxobutanoate + acetyl-CoA + H2O
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: located_in
  review:
    summary: >-
      A soluble biosynthetic enzyme of a Gram-positive bacterium; cytoplasm is
      the expected location.
    action: ACCEPT
    reason: >-
      No sub-cytoplasmic location is known or expected; LeuA has no
      transmembrane segment or signal peptide and acts on cytoplasmic
      metabolites. Cytoplasm is as precise as the evidence allows.
    supported_by:
    - reference_id: file:CORGL/leuA/leuA-uniprot.txt
      record_section: ["CC:SUBCELLULAR LOCATION"]
      supporting_text: 'SUBCELLULAR LOCATION: Cytoplasm {ECO:0000255|HAMAP-Rule:MF_00572}.'
