proposed_new_terms: []
suggested_questions:
- question: >-
    Does L-leucine bind directly to the C-terminal regulatory domain of
    C. glutamicum LeuA, and how do R529H and G532D abolish inhibition?
- question: >-
    Which divalent metal occupies the active site of C. glutamicum LeuA in
    vivo, given the Mg2+ assignment by rule and zinc in the M. tuberculosis
    ortholog structure?
suggested_experiments:
- description: >-
    Measure L-leucine binding to purified wild-type and R529H/G532D LeuA by
    isothermal titration calorimetry and determine the structure of the
    leucine-bound regulatory domain.
  experiment_type: ligand binding and structural biology
- description: >-
    Determine the metal content of purified LeuA by ICP-MS and the activity of
    the apo-enzyme reconstituted with Mg2+, Mn2+ or Zn2+.
  experiment_type: metalloprotein biochemistry
