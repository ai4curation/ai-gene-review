- id: PMID:1956296
  title: Genetic and biochemical analysis of the aspartokinase from Corynebacterium glutamicum.
  findings:
  - statement: Native ATCC 13032 locus and two protein products establish the LysC assembly provenance.
    supporting_text: The lysC/asd gene cluster of Corynebacterium glutamicum ATCC 13032 was cloned and
      sequenced.
  - statement: Purification resolves large and small aspartokinase products.
    supporting_text: The C. glutamicum aspartokinase was purified and found to contain two proteins of
      Mr 47,000 and Mr 18,000.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract read; native organism and purification stated explicitly. Mutant feedback resistance
      is separate from wild-type activity.
- id: PMID:20573952
  title: Mechanism of concerted inhibition of alpha2beta2-type hetero-oligomeric aspartate kinase from
    Corynebacterium glutamicum.
  findings:
  - statement: The wild-type enzyme has alpha2beta2 architecture.
    supporting_text: CgAK has a characteristic α2β2-type heterotetrameric structure made up of two α subunits
      and two β subunits.
  - statement: Catalysis resides in alpha N-terminal domains; beta and alpha C-terminal regions regulate.
    supporting_text: The N-terminal portion of the α subunit functions as a catalytic domain, whereas
      the β subunit and C-terminal portion of the α subunit serve as regulatory domains.
  - statement: Structural work used recombinant expression constructs with the internal beta initiation
      site disabled and beta supplied separately.
    supporting_text: In the former plasmid, the internal ribosome-binding sequence for translation of
      the β subunit, which is located in the middle of the α subunit gene, was mutated not to function.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text read. Recombinant wild-type and S301F variants are distinguished. Structural
      coexpression is not evidence for independent native loci.
