gene_symbol: lysC
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:196627
  label: Corynebacterium glutamicum ATCC 13032
description: LysC is the aspartokinase of Corynebacterium glutamicum ATCC 13032, catalyzing ATP-dependent
  phosphorylation of L-aspartate to 4-phospho-L-aspartate at the entry to the aspartate-derived amino
  acid pathways. Alternative translation initiation at the same locus produces a full-length alpha chain
  and a shorter beta chain corresponding to its C-terminal regulatory region. Two alpha and two beta chains
  form the regulated enzyme; the alpha N-terminal domain is catalytic, whereas the beta chains and alpha
  C-terminal domains mediate concerted feedback inhibition by lysine and threonine. This cytosolic reaction
  supplies precursors for lysine and the homoserine-derived threonine and methionine branches.
