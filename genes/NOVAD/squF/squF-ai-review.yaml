  review:
    summary: SquF catalyzes the terminal step of oxidative sulfoquinovose degradation.
    action: NEW
    reason: SquF performs a step of the pathway itself, reducing the desulfonated product of SquD to glucose
      (curated catalytic activity from Liu et al. 2021, Ref.2 of the UniProt record), consistent with the
      SmoB review and with the comparator E. coli YihU, the route-completing reductase of sulfo-EMP, which
      carries GO:1902777. TAS is used because the cited source is the review that summarizes the primary enzyme
      assay, which has no PMID.
    supported_by:
