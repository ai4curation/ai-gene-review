suggested_questions:
- question: Does SquF also serve the dioxygenase (SqoD) route in organisms carrying both C-S cleavage
    pathways, and does it accept NADH as UniProt's alternative name "NAD(P)-dependent" implies?
suggested_experiments:
- experiment_type: cofactor specificity kinetics
  description: Measure SquF kinetics with NADPH versus NADH using in situ generated 6-dehydroglucose
    and compare with SmoB, which is strictly NADP(H)-specific.
