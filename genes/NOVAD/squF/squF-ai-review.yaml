  review:
    summary: SquF is a soluble aldo-keto reductase acting on an intracellular pathway intermediate.
    action: KEEP_AS_NON_CORE
    reason: As for its ortholog SmoB, SquF lacks a signal peptide or transmembrane segment and acts on
      6-dehydroglucose generated inside the cell by SquD. The TreeGrafter cytosol transfer is plausible
      but not directly assayed, and location is peripheral to the catalytic function, so it is kept as
      non-core (same action as the identical SmoB row).
    supported_by:
    - reference_id: PMID:41676062
      supporting_text: Following the C-S cleavage by SquD/SsuE, the NAD(P)H-dependent oxidoreductase SquF
        reduces 6-dehydro-D-glucose to form glucose, which can enter primary metabolism
- term:
    id: GO:0016491
    label: oxidoreductase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR018170
  - InterPro:IPR020471
  review:
    summary: Correct but uninformative; SquF is an NADP-dependent CH-OH oxidoreductase (6-dehydroglucose
      reductase, EC 1.1.1.432).
    action: MODIFY
    reason: The AKR-signature mapping is true but very general. The experimentally assigned reaction (D-glucose
      + NADP+ = 6-dehydro-D-glucose + NADPH, RHEA:70779) acts on a CH-OH donor with NADP as acceptor, so
      GO:0016616 is the most specific existing descendant; a dedicated 6-dehydroglucose reductase term
      is proposed below (as for SmoB).
    supported_by:
    - reference_id: file:NOVAD/squF/squF-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: NADP-dependent reduction of 6-dehydro-D-glucose to D-glucose (Ref.2).
    proposed_replacement_terms:
    - id: GO:0016616
      label: oxidoreductase activity, acting on the CH-OH group of donors, NAD or NADP as acceptor
