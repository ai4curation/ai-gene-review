id: Q2G5J3
gene_symbol: squF
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:279238
  label: Novosphingobium aromaticivorans DSM 12444
description: SquF (Saro_2444) is an NADP(H)-dependent aldo-keto reductase of Novosphingobium aromaticivorans
  encoded next to the sulfoquinovose monooxygenase gene squD. It reduces 6-dehydro-D-glucose, the aldehyde
  formed when SquD removes sulfite from sulfoquinovose, to D-glucose, and in vitro also catalyzes the reverse
  NADP+-dependent oxidation of glucose at C6. It is the counterpart of Agrobacterium SmoB and completes
  the oxidative sulfoquinovose degradation route, allowing the carbon skeleton of the plant sulfosugar
  to enter central metabolism as glucose.
