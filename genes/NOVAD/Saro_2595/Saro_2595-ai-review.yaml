proposed_new_terms:
- proposed_name: GS-HPV glutathione-dependent deglutathionylase activity
  proposed_definition: Catalysis of the glutathione-dependent conversion of beta-glutathionyl-gamma-hydroxypropiovanillone
    (GS-HPV) to gamma-hydroxypropiovanillone (HPV), with formation of glutathione disulfide from the substrate-bound
    glutathionyl group and a second glutathione molecule. Substrate stereoisomer specificity is a property
    of the individual enzyme.
  justification: The experimentally established GS-HPV reaction is not the halide substitution in GO:0004364
    and does not match the elimination of hydrogen sulfide or substituted H2S in GO:0016846. A substrate-specific
    term is needed; a proposed parent is left for ontology assessment rather than inferred from the historical
    glutathione lyase name.
  supported_by:
