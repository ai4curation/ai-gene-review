  label: Novosphingobium aromaticivorans DSM 12444
description: Saro_2595 encodes NaGSTNu, a homodimeric Nu-class glutathione transferase-family enzyme that
  removes glutathione from both stereoisomers of beta-glutathionyl-gamma-hydroxypropiovanillone in Novosphingobium
  aromaticivorans F199. Using a second glutathione molecule, it produces gamma-hydroxypropiovanillone
  and glutathione disulfide. This intracellular deglutathionylation step completes the conversion of glutathionylated
  intermediates generated during beta-aryl ether cleavage; native deletion experiments establish its requirement
  for complete GGE metabolism. It accepts both epimers but has a higher measured catalytic efficiency
  for the beta(S) substrate.
