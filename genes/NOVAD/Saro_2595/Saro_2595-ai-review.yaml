core_functions:
- description: NaGSTNu catalyzes glutathione-dependent deglutathionylation of both beta(R)- and beta(S)-GS-HPV
    to HPV and GSSG. It provides both epimer-release activities in the characterized F199 pathway, although
    the reported catalytic efficiencies differ by approximately fourfold in favor of beta(S)-GS-HPV. This
    C-S bond cleavage coupled to GSSG formation is distinct from canonical GST halide substitution and
    from the elimination reaction in the GO carbon-sulfur lyase definition.
  proposed_molecular_function: GS-HPV glutathione-dependent deglutathionylase activity
