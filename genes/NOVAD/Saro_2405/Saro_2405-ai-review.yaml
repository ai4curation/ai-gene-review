  label: Novosphingobium aromaticivorans DSM 12444
description: Saro_2405 encodes NaLigE, a glutathione-dependent beta-aryl etherase of Novosphingobium aromaticivorans
  F199. It cleaves beta(R)-configured alpha-keto beta-O-4 aromatic dimers by replacing the aryloxy group
  with a glutathionyl group. Purified enzyme assays establish activity on model dimers containing guaiacyl
  and syringyl units. This chemistry contributes to the intracellular processing of small lignin-derived
  aromatics after oxidation of their benzylic alcohol groups. NaLigE and the distinct BaeAB heterodimer
  provide alternative beta(R)-MPHPV cleavage routes in F199.
