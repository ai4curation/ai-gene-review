references:
- id: PMID:25232892
  title: A group of sequence-related sphingomonad enzymes catalyzes cleavage of β-aryl ether linkages
    in lignin β-guaiacyl and β-syringyl ether dimers.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text identifies the DSM12444 loci, recombinant enzymes and individual chiral substrate
      assays. The tested G/S model dimers are alpha-keto substrates with specified ring substituents;
      they do not establish cleavage of every native lignin oligomer.
  findings:
  - statement: The assayed NaLigE enzyme is linked explicitly to Saro_2405 from DSM12444.
    supporting_text: Genes encoding potential Lig enzymes NaLigE (Saro_2405), NaLigF1 (Saro_2091), NaLigF2
      (Saro_2865), and RpHypGST (RPA4340) were cloned from genomic DNA from N. aromaticivorans strain
      DSM12444 or Rhodopseudomonas palustris (R. palustris) strain CGA009, respectively.
    reference_section_type: METHODS
  - statement: NaLigE was tested individually with glutathione and four guaiacyl/syringyl model dimer
      classes.
    supporting_text: individual proteins NaLigE, NsLigE, SsLigE, SsLigP, NaLigF1, NaLigF2, or SsLigF1
      (0.25 mg mL–1) were individually incubated with GSH and one of the racemic β-ethers GβG, GβS, SβG,
      or SβS (1.0 mM) as cosubstrates.
    reference_section_type: METHODS
  - statement: NaLigE belongs to the experimentally tested beta(R)-selective etherase group.
    supporting_text: each LigE/LigP β-etherase homologue has the conserved function of degrading β(R)-enantiomers
      whereas each LigF1/LigF2 β-etherase homologue exhibits stereospecificity for the β(S)-enantiomers.
    reference_section_type: INTRODUCTION
  - statement: The direct glutathionyl-product configuration analysis described here uses SYK-6 enzymes,
      providing mechanistic context for the individually measured Na substrate stereospecificities.
    supporting_text: analysis of the aqueous layers from these reactions18 confirmed that SsLigE- and
      SsLigP-catalyzed formation of Gβ(S)-SG whereas Gβ(R)-SG was formed as a product of SsLigF-catalyzed
      reactions
    reference_section_type: RESULTS
- id: PMID:30541921
  title: A heterodimeric glutathione S-transferase that stereospecifically breaks lignin's β(R)-aryl ether
    bond reveals the diversity of bacterial β-etherases.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full-text experiments use the exact F199 recombinant enzyme as a stereospecific MPHPV
      control; NaLigE is additionally examined by native genetics and kinetic comparison with BaeAB.
  findings:
  - statement: NaLigE is an experimentally established stereospecific MPHPV-cleaving control in the BaeAB
      study.
    supporting_text: The reaction containing both BaeA and BaeB was split and combined with either NaLigE
      (E) or NaLigF1 (F), which are stereospecific for β(R)- or β(S)-MPHPV, respectively.
    reference_section_type: RESULTS
  - statement: Native genetic results establish alternative NaLigE and BaeAB routes for beta(R)-MPHPV
      cleavage.
    supporting_text: loss of either Saro_2873 or Saro_2872 rendered 12444ΔligE unable to metabolize β(R)-MPHPV
    reference_section_type: RESULTS
