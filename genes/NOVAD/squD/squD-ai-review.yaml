  review:
    summary: SquD is an FMNH2- and O2-dependent sulfonate monooxygenase whose physiological substrate
      is sulfoquinovose.
    action: ACCEPT
    reason: 'GO:0008726 is defined as "an alkanesulfonate + O2 + FMNH2 = an aldehyde + sulfite + H2O +
      FMN". The experimentally assigned SquD reaction (RHEA:70775, EC 1.14.14.181, curated by UniProt from
      Liu et al. 2021, ACS Catal.) is this transformation applied to sulfoquinovose, whose C6 primary alkyl
      sulfonate becomes the C6 aldehyde of 6-dehydroglucose. It is the most specific existing GO term; the
      SQ-specific activity is proposed as a new child term (as for A. fabrum SmoC). The TreeGrafter graft
      point PTN008675999 is not itself a PAINT IBD node; the activity it carries traces to the SsuD-seeded
      node PTN000768559 of PTHR42847, which is correct for SquD.'
    supported_by:
    - reference_id: file:NOVAD/squD/squD-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: Catalyzes the oxidative desulfurization of sulfoquinovose to sulfite and 6-dehydro-D-glucose
        (Ref.2).
