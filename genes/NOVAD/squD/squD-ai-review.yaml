proposed_new_terms:
- proposed_name: sulfoquinovose monooxygenase activity
  proposed_definition: 'Catalysis of the reaction: 6-sulfo-D-quinovose + FMNH2 + O2 = 6-dehydro-D-glucose
    + FMN + sulfite + H2O + 2 H+ (RHEA:70775, EC 1.14.14.181).'
  justification: Same proposal as in the A. fabrum SmoC review; the reaction has an EC number and Rhea
    entry but no GO term, and the characterized enzymes (SmoC, SquD) are SQ-specific members of the SsuD
    family.
