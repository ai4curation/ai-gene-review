suggested_questions:
- question: Is SquD as strictly specific for sulfoquinovose as A. fabrum SmoC, and which flavin reductase
    supplies it with FMNH2 in N. aromaticivorans?
suggested_experiments:
- experiment_type: substrate and partner profiling
  description: Assay purified SquD on SQ, SQGro and representative alkanesulfonates with candidate N.
    aromaticivorans flavin reductases, and test growth of squD and reductase deletion mutants on SQ.
