product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:279238
  label: Novosphingobium aromaticivorans DSM 12444
description: SquD (Saro_2443) is the sulfoquinovose monooxygenase of the alphaproteobacterium Novosphingobium
  aromaticivorans, a bacterial-luciferase-like FMNH2-dependent monooxygenase of the SsuD family. It catalyzes
  oxidative cleavage of the C-S bond of sulfoquinovose (6-deoxy-6-sulfo-D-glucose) with reduced FMN and
  molecular oxygen, releasing sulfite and 6-dehydro-D-glucose, which the adjacently encoded aldo-keto reductase
  SquF reduces to glucose. Reduced flavin is supplied by an NAD(P)H-dependent flavin reductase of the SsuE
  type. SquD is thus the C-S bond-cleaving enzyme of the oxidative (sulfo-ASMO/SMO) sulfoquinovose degradation
  route, which lets the organism use all six carbons of the sulfosugar, and is the counterpart of Agrobacterium
  SmoC.
