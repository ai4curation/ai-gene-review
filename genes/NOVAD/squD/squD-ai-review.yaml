  review:
    summary: SquD degrades sulfoquinovose, not the aliphatic alkanesulfonates of the Ssu sulfur-scavenging
      system.
    action: MODIFY
    reason: 'GO:1902777 6-sulfoquinovose(1-) catabolic process names the actual substrate and route: SquD
      initiates a sulfoquinovose degradation pathway in which the sugar carbon skeleton is recovered as
      glucose. GO:0046306 alkanesulfonate catabolic process is reached from the SsuD-seeded node and
      describes the breakdown of aliphatic sulfonates in general, so the substrate-specific process is the
      better term (a lateral correction, since GO:1902777 is not a descendant of GO:0046306, matching
      the SmoC review).'
