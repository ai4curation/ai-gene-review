        (SQ) with concomitant production of inorganic sulfite (Ref.2).
    - reference_id: PMID:41676062
      supporting_text: In the sulfo-ASMO pathway, the degradation of SQ is initiated by the flavin-dependent
        alkane sulfonate monooxygenase SquD, which converts SQ to 6-dehydro-D-glucose and sulfite by an
