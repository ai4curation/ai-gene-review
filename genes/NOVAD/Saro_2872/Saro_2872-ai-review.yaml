core_functions:
- description: 'BaeB contributes to glutathione-dependent beta(R)-aryl ether cleavage by the BaeAB heterodimer.
    Both BaeB and BaeA (Saro_2873) are needed for substantial activity: each isolated subunit gave less
    than 1% MPHPV conversion in the reported assay. GO:0016765 records contribution to the chemically
    appropriate broad transferase class, while the exact beta-etherase activity is proposed below for
    the complex. No independent full beta-etherase activity or structural-only function is assigned to
    this subunit.'
