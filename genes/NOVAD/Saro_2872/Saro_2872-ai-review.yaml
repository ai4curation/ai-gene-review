  label: Novosphingobium aromaticivorans DSM 12444
description: Saro_2872 encodes BaeB, one of the two glutathione S-transferase-like subunits of the BaeAB
  beta-aryl etherase in Novosphingobium aromaticivorans F199. Together with BaeA (Saro_2873), it forms
  a heterodimer that cleaves beta(R)-MPHPV into guaiacol and a glutathionylated hydroxypropiovanillone
  product, using glutathione. This reaction provides an alternative to NaLigE during intracellular aromatic-dimer
  metabolism; substantial activity requires both BaeAB subunits. Its exact molecular contribution within
  the active heterodimer remains unresolved; the tested Ser14 substitution does not substantially alter
  the measured kinetics.
existing_annotations: []
references:
- id: PMID:30541921
  title: A heterodimeric glutathione S-transferase that stereospecifically breaks lignin's β(R)-aryl ether
    bond reveals the diversity of bacterial β-etherases.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text supports native double-mutant phenotypes, separate versus combined cell-free
      subunit assays, co-purification, size-exclusion evidence for a heterodimer, stereospecific substrate
      consumption and mutagenesis. It does not directly assign the stereoconfiguration of the BaeAB-generated
      GS-HPV product.
  findings:
  - statement: The exact F199 loci encode the two BaeAB subunits.
    supporting_text: we identify this β-etherase as a previously uncharacterized heterodimeric GST (named
      here BaeAB) encoded by Saro_2873 (baeA) and Saro_2872 (baeB).
    reference_section_type: INTRODUCTION
  - statement: The heterodimer cleaves beta(R)-MPHPV but does not measurably act on beta(S)-MPHPV in the
      reported assay.
    supporting_text: the recombinant enzyme had no effect on β(S)-MPHPV and converted β(R)-MPHPV into
      GS-HPV and guaiacol
    reference_section_type: RESULTS
  - statement: Individual subunits exhibit only trace conversion; mixing both produces robust cleavage
      of half the racemic substrate.
    supporting_text: When the Saro_2873 or Saro_2872 polypeptides were individually incubated with racemic
      (β(R) and β(S)) MPHPV and GSH, only a trace amount of GS-HPV was observed (representing <1% conversion
      of the MPHPV present in the reaction)
    reference_section_type: RESULTS
  - statement: The purified complex has an apparent mass consistent with a heterodimer of the approximately
      29-kDa subunits.
    supporting_text: We also analyzed the purified recombinant protein complex by gel permeation chromatography
      (GPC) and found that it eluted as a single peak with an apparent molecular weight of ∼59 kDa
    reference_section_type: RESULTS
  - statement: Loss of either subunit prevents beta(R)-MPHPV metabolism when NaLigE is also absent.
    supporting_text: loss of either Saro_2873 or Saro_2872 rendered 12444ΔligE unable to metabolize β(R)-MPHPV
    reference_section_type: RESULTS
  - statement: BaeB Ser14 substitution does not appreciably change the measured catalytic parameters;
      this does not establish that the whole BaeB subunit is dispensable or purely structural.
    supporting_text: The variant in which BaeB Ser14 was changed to an alanine (B:S14A) had the same kcat
      and Km values as WT BaeAB
    reference_section_type: RESULTS
