suggested_questions:
- question: What interactions supplied by BaeB enable BaeA-mediated catalysis, and does BaeB directly
    contact glutathione or the aromatic substrate in the active heterodimer?
  experts:
  - Wayne S. Kontur
  - Timothy J. Donohue
suggested_experiments:
- hypothesis: Subunit-interface contacts are needed to form an active BaeA-centered catalytic environment.
  description: Determine the BaeAB structure with a substrate analogue or product, then test interface
    and BaeB pocket substitutions while checking heterodimer stability and beta(R)-MPHPV kinetics. Distinguish
    loss of assembly from loss of substrate positioning.
  experiment_type: Structure determination and separation-of-function mutagenesis
