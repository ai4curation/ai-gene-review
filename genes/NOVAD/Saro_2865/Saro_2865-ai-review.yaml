core_functions:
- description: NaLigF2 catalyzes glutathione-dependent cleavage of the beta(S)-aryl ether linkage in alpha-keto
    model dimers. Its assayed substrate range includes the G/G, G/S, S/G and S/S ring combinations used
    by Gall et al.; those are defined substituted model compounds, not a demonstration of unrestricted
    native-lignin depolymerization. Reciprocal product configuration is inferred from established LigE/LigF
    stereoinverting chemistry; the Na-specific chiral assays directly establish substrate selectivity,
    while the explicit product-configuration analysis in this paper uses the SYK-6 enzymes.
  proposed_molecular_function: glutathione-dependent beta-aryl etherase activity
