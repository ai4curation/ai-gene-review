    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text identifies the DSM12444 loci, recombinant enzymes and individual chiral substrate
      assays. The tested G/S model dimers are alpha-keto substrates with specified ring substituents;
      they do not establish cleavage of every native lignin oligomer.
  findings:
  - statement: The assayed NaLigF2 enzyme is linked explicitly to Saro_2865 from DSM12444.
    supporting_text: Genes encoding potential Lig enzymes NaLigE (Saro_2405), NaLigF1 (Saro_2091), NaLigF2
