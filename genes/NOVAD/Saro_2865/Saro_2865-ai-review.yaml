    supporting_text: individual proteins NaLigE, NsLigE, SsLigE, SsLigP, NaLigF1, NaLigF2, or SsLigF1
      (0.25 mg mL–1) were individually incubated with GSH and one of the racemic β-ethers GβG, GβS, SβG,
      or SβS (1.0 mM) as cosubstrates.
    reference_section_type: METHODS
  - statement: NaLigF2 belongs to the experimentally tested beta(S)-selective etherase group.
    supporting_text: each LigE/LigP β-etherase homologue has the conserved function of degrading β(R)-enantiomers
