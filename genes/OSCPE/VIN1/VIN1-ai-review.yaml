  - id: GO:0030863
    label: cortical cytoskeleton
  - id: GO:0005911
    label: cell-cell junction
  - id: GO:0030175
    label: filopodium
  supported_by:
  - reference_id: PMID:29880641
    supporting_text: >-
      Thus, binding of talin to Op vinculin D1 releases autoinhibition for F-actin
      binding, similar to the behavior of vertebrate vinculin.
  - reference_id: PMID:29880641
    supporting_text: >-
      Immunofluorescence of O. pearsei tissue using an affinity-purified antibody
      raised against Op vinculin showed co-localization with cortical belts of
      actin filaments at cell–cell contacts in the pinacoderm and choanoderm
      tissues
  knowledge_gaps:
  - gap_statement: >-
      Activation was shown only with a synthetic talin peptide and heterologous
      (rabbit muscle) actin. Whether VIN1 is activated by other partners at sponge
      cell-cell contacts (for example O. pearsei alpha-catenin under tension) is
      unknown.
- description: >-
    Binding to talin. The VIN1 D1 domain binds the vinculin-binding site of
    O. pearsei talin with nanomolar affinity; this interaction is partially masked
    in full-length VIN1 and is the trigger for F-actin binding.
  molecular_function:
    id: GO:1990147
    label: talin binding
  supported_by:
  - reference_id: PMID:29880641
    supporting_text: >-
      Full-length Op vinculin and Op vinculin D1 bound Op talin peptide
  - reference_id: PMID:29880641
    supporting_text: >-
      Moreover, Op vinculin bound talin but not β-catenin
suggested_questions:
- question: >-
    Are the VIN1-positive belts at sponge cell-cell contacts cadherin-catenin
    adherens junctions? Do O. pearsei cadherin, beta-catenin and alpha-catenin
    co-localize with VIN1 there, and does VIN1 bind O. pearsei alpha-catenin?
- question: >-
    Are the VIN1-positive filopodia of migratory mesohyl cells integrin- and
    talin-containing focal-adhesion-like contacts?
- question: >-
    Given that VIN1 lacks domain D2, how does it achieve autoinhibition, and is its
    weaker autoinhibition physiologically relevant?
suggested_experiments:
- experiment_type: Co-immunolocalization
  description: >-
    Co-stain O. pearsei tissue for VIN1 with antibodies to TLN, integrin beta,
    cadherin and alpha-catenin to assign VIN1-positive contacts to cell-matrix or
    cell-cell adhesion structures; complement with immuno-electron microscopy.
- experiment_type: Binding assay
  description: >-
    Test binding of VIN1 to full-length O. pearsei talin rod fragments and to
    O. pearsei alpha-catenin, including under force (e.g. optical trap), and test
    F-actin binding with sponge actin.
- experiment_type: Functional perturbation
  description: >-
    Inhibit VIN1 (e.g. antibody or morpholino/RNAi delivery in tissue explants or
    reaggregating cells) and score epithelial integrity and cell migration.
