core_functions:
- description: >-
    Talin-activated actin filament binding. VIN1 is autoinhibited for F-actin
    binding on its own; binding of a talin vinculin-binding-site peptide to its D1
    domain releases autoinhibition and allows it to bind actin filaments, the
    conserved vinculin mechanism for coupling adhesion complexes to the actin
    cytoskeleton. In sponge tissue it sits with cortical actin at cell-cell
    contacts and with actin in filopodia of migratory cells.
  molecular_function:
    id: GO:0051015
    label: actin filament binding
