- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:29880641
  qualifier: enables
  supporting_entities:
  - UniProtKB:A0A3G2LGI8
  review:
    summary: >-
      ITC shows that full-length VIN1 and its D1 domain bind a synthetic peptide
      corresponding to the vinculin-binding site of O. pearsei talin (TLN residues
      598-621); the D1 interaction has nanomolar affinity, comparable to the
      mammalian vinculin-talin interaction.
    action: MODIFY
    reason: >-
      Generic protein binding is uninformative. The interacting partner is
      specifically talin, and the paper treats this binding as the vinculin
      activation mechanism, so talin binding (GO:1990147) captures the function.
      The interaction was not shown with alpha-catenin or cadherin, so terms such
      as alpha-catenin binding or cadherin binding are not supported.
    proposed_replacement_terms:
