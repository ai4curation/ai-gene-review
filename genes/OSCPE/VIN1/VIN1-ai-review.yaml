gene_symbol: VIN1
product_type: PROTEIN
status: DRAFT
aliases:
- Op vinculin
- VINC_OSCPE
taxon:
  id: NCBITaxon:1940113
  label: Oscarella pearsei
description: >-
  VIN1 is the vinculin ortholog of the homoscleromorph sponge Oscarella pearsei,
  an 846-residue member of the vinculin/alpha-catenin family. It groups with
  animal vinculins in phylogenetic analyses and its 2.3 A crystal structure is
  more similar to vertebrate vinculin than to alpha-catenin, although it lacks
  domain D2, the helix bundle that otherwise distinguishes vinculins from
  alpha-catenins. Recombinant VIN1 is a monomer. Its N-terminal D1 domain binds a
  peptide from the vinculin-binding site of sponge talin (TLN) with high affinity,
  whereas full-length VIN1 binds the same peptide about ten-fold more weakly,
  indicating partial head-tail autoinhibition. VIN1 alone does not bind actin
  filaments, but talin peptide relieves this autoinhibition and allows F-actin
  binding, the same activation mechanism as in vertebrate vinculin. VIN1 does not
  bind beta-catenin. In sponge tissue the endogenous protein co-localizes with
  actin filaments in belt-like zones at cell-cell contacts of the outer
  epithelium (pinacoderm) and feeding epithelium (choanoderm), at the base of the
  microvillar collar of choanocytes, and in filopodial and lamellipodial
  extensions of migratory mesohyl cells. These properties suggest that VIN1
  links adhesion complexes at cell-cell and cell-matrix contacts to the actin
  cytoskeleton, as vinculin does in other animals.
