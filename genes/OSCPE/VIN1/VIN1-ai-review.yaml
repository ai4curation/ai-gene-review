- id: PMID:29880641
  title: Analysis of a vinculin homolog in a sponge (phylum Porifera) reveals that
    vertebrate-like cell adhesions emerged early in animal evolution.
  findings:
  - statement: >-
      VIN1 is a vinculin ortholog by phylogeny and structure but lacks domain D2.
    supporting_text: >-
      However, Op vinculin lacks domain 2, which typically distinguishes vinculin
      from α-catenin in other animals
  - statement: >-
      Recombinant VIN1 binds a sponge talin vinculin-binding-site peptide but not a
      sponge beta-catenin peptide (ITC).
    supporting_text: >-
      Moreover, Op vinculin bound talin but not β-catenin
  - statement: >-
      VIN1 alone does not bind F-actin; talin peptide activates F-actin binding
      (co-sedimentation).
    supporting_text: >-
      Thus, binding of talin to Op vinculin D1 releases autoinhibition for F-actin
      binding, similar to the behavior of vertebrate vinculin.
  - statement: >-
      Endogenous VIN1, detected with a validated antibody in fixed sponge tissue,
      co-localizes with cortical actin belts at cell-cell contacts in pinacoderm
      and choanoderm and with actin in filopodia of migratory mesohyl cells.
    supporting_text: >-
      Immunofluorescence of O. pearsei tissue using an affinity-purified antibody
      raised against Op vinculin showed co-localization with cortical belts of
      actin filaments at cell–cell contacts in the pinacoderm and choanoderm
      tissues
  - statement: >-
      The cell-cell contacts at which VIN1 localizes are not ultrastructurally
      defined junctions.
    supporting_text: >-
      The localization of Op vinculin to cell–cell contacts in the pinacoderm and
      choanoderm is consistent with a possible AJ in these tissues, despite the
      lack of ultrastructural evidence
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Primary and only paper on this protein; full text cached (PMC6066325) and
      matches the UniProt RN citation for VINC_OSCPE. Localization data are from
      immunostaining of endogenous protein in O. pearsei tissue (not heterologous
      expression); binding data are in vitro with recombinant protein, synthetic
      sponge peptides and rabbit muscle actin. No genetic perturbation.
