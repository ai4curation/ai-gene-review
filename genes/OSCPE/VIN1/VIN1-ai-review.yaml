- term:
    id: GO:0007155
    label: cell adhesion
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR006077
  - InterPro:IPR036723
  review:
    summary: >-
      InterPro2GO mapping from the vinculin/catenin domain. Vinculin in other
      animals connects cadherin- and integrin-based adhesions to actin; in the
      sponge, VIN1 is at cell-cell contacts and in migratory-cell protrusions and
      shows the conserved talin-activated F-actin binding.
    action: ACCEPT
    reason: >-
      Vinculin does part of the work of adhesion (it is the actin-anchoring
      linker in adhesion complexes), so the general process term is appropriate
      for a vinculin ortholog with conserved biochemistry. The sponge data are
      localization and in vitro binding only; no loss-of-function test of
      adhesion exists, so the more specific adhesion subtypes are not asserted.
    supported_by:
    - reference_id: PMID:29880641
      supporting_text: >-
        We propose that Op vinculin played a role in cell adhesion and tissue
        organization in the last common ancestor of sponges and other animals.
    - reference_id: PMID:29880641
      supporting_text: >-
        Mammalian vinculin predominantly localizes to cell–ECM contacts, where it
        anchors FA complexes to the actin cytoskeleton
