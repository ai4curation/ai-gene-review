  review:
    summary: >-
      ITC with a synthetic peptide of TLN residues 598-621 (the homolog of the
      mouse talin vinculin-binding site) and recombinant VIN1 or its D1 domain
      shows direct binding; the peptide also activates VIN1 F-actin binding.
    action: MODIFY
    reason: >-
      Generic protein binding is uninformative. The partner is vinculin and the
      tested segment is a vinculin-binding site, so vinculin binding (GO:0017166)
      describes the function. Caveat: evidence is from a peptide, not full-length
      TLN, whose vinculin-binding sites in other talins are cryptic until the rod
      is unfolded by force.
