- id: PMID:29880641
  title: Analysis of a vinculin homolog in a sponge (phylum Porifera) reveals that
    vertebrate-like cell adhesions emerged early in animal evolution.
  findings:
  - statement: >-
      TLN has the conserved talin domain organization, plus an additional
      predicted PTB domain.
    supporting_text: >-
      As in their mammalian counterparts, Op talin has an N-terminal FERM domain
      followed by a talin middle domain, vinculin-binding sites, and an I/WLEQ
      domain.
  - statement: >-
      The tested TLN fragment is a synthetic peptide of residues 598-621,
      homologous to the mouse talin vinculin-binding site.
    supporting_text: >-
      In a MUSCLE alignment Mm talin 605–628 correspond to residues 598–621 in Op
      talin
  - statement: >-
      The TLN peptide binds VIN1 and activates VIN1 binding to F-actin.
    supporting_text: >-
      In the presence of Op talin peptide, full-length Op vinculin bound to F-actin
      filaments
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Only paper on this protein; full text cached (PMC6066325) and matches the
      UniProt RN citation for TLN_OSCPE. The paper is focused on VIN1; TLN was
      studied only as a synthetic 24-residue vinculin-binding-site peptide in ITC
      and co-sedimentation assays. TLN localization and other activities were not
      examined.
existing_annotations:
- term:
    id: GO:0001726
    label: ruffle
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: located_in
  supporting_entities:
  - InterPro:IPR015224
  review:
    summary: >-
      InterPro2GO mapping from the talin central domain. No localization data
      exist for sponge talin.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Ruffle is a peripheral, context-dependent location of talin in cultured
      vertebrate cells, and a domain signature is a poor predictor of it. The
      characteristic talin location (focal adhesion / anchoring junction) is
      already annotated, and no ruffle-like structure has been described for
      O. pearsei talin.
