taxon:
  id: NCBITaxon:1940113
  label: Oscarella pearsei
description: >-
  TLN is the talin of the homoscleromorph sponge Oscarella pearsei, a 2531-residue
  cytoskeletal adaptor with the domain organization of animal talins: an
  N-terminal FERM head, followed by a talin rod made of helical bundles that
  carry vinculin-binding sites, and a C-terminal I/LWEQ actin-binding domain. It
  also has a predicted phosphotyrosine-binding domain just after the FERM domain
  that is absent from mouse talin. A peptide corresponding to its principal
  vinculin-binding site (residues 598-621) binds the D1 domain of sponge vinculin
  (VIN1) with nanomolar affinity and activates F-actin binding by VIN1,
  reproducing the talin-vinculin activation mechanism of vertebrate focal
  adhesions. By homology with talins of other animals, TLN is expected to bind
  integrin beta-subunit cytoplasmic tails and membrane lipids through its head
  and actin filaments through its rod and C-terminus, linking integrin-based
  cell-matrix adhesions to the actin cytoskeleton; these activities have not been
  tested for the sponge protein.
