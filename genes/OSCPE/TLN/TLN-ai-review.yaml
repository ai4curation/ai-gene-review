- term:
    id: GO:0098609
    label: cell-cell adhesion
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN001072690
  review:
    summary: >-
      TreeGrafter propagation from the talin family node.
    action: MODIFY
    reason: >-
      Talin's established role is in integrin-based attachment of cells to the
      extracellular matrix, whereas cell-cell contacts (adherens junctions) are
      built on cadherins and catenins. Nothing links O. pearsei talin to cell-cell
      contacts. The essence (adhesion) is right, but cell-matrix adhesion is the
      appropriate process.
    proposed_replacement_terms:
    - id: GO:0007160
      label: cell-matrix adhesion
    supported_by:
    - reference_id: PMID:29880641
      supporting_text: >-
        The AJ (containing cadherins and catenins) and FAs (comprising integrins,
        talin, and paxillin) differ in protein composition
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - GRANULARITY_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN001072690
        source_label: talin family node
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          The family-node adhesion term is right in essence, but talin acts at
          integrin-matrix adhesions; cell-cell adhesion is the wrong sibling for this
          sponge protein.
core_functions:
- description: >-
    Vinculin binding. The TLN vinculin-binding site (residues 598-621) binds the
    D1 domain of sponge vinculin with nanomolar affinity and releases vinculin
    autoinhibition so that vinculin binds F-actin, the conserved talin-vinculin
    reinforcement mechanism of integrin adhesions.
  molecular_function:
    id: GO:0017166
    label: vinculin binding
  supported_by:
  - reference_id: PMID:29880641
    supporting_text: >-
      Full-length Op vinculin and Op vinculin D1 bound Op talin peptide
  - reference_id: PMID:29880641
    supporting_text: >-
      In the presence of Op talin peptide, full-length Op vinculin bound to F-actin
      filaments
  knowledge_gaps:
  - gap_statement: >-
      Shown only with a 24-residue synthetic peptide. Whether full-length TLN binds
      VIN1, whether its vinculin-binding sites are cryptic and force-exposed as in
      vertebrate talin, and how many functional sites the rod carries are unknown.
- description: >-
    Predicted integrin-actin adaptor at cell-matrix adhesions, by homology to
    animal talins: integrin beta-tail and membrane binding through the FERM head,
    and actin filament binding through the rod and C-terminal I/LWEQ domain.
  molecular_function:
    id: GO:0005178
    label: integrin binding
  locations:
  - id: GO:0005925
    label: focal adhesion
  supported_by:
  - reference_id: PMID:29880641
    supporting_text: >-
      As in their mammalian counterparts, Op talin has an N-terminal FERM domain
      followed by a talin middle domain, vinculin-binding sites, and an I/WLEQ
      domain.
  - reference_id: PMID:29880641
    supporting_text: >-
      integrins anchor to the actin cytoskeleton through interactions with a
      large number of cytoplasmic proteins including talin, vinculin, and
      paxillin
  knowledge_gaps:
  - gap_statement: >-
      None of these activities or the focal adhesion location has been tested for
      O. pearsei talin; the role of the extra PTB domain is unknown.
suggested_questions:
- question: >-
    Does full-length O. pearsei talin localize with VIN1 in the filopodia of
    migratory mesohyl cells and at basal contacts with the collagen IV-containing
    basal lamina, i.e. are these focal-adhesion-like contacts?
- question: >-
    What does the additional PTB domain after the FERM domain of sponge talin
    bind?
suggested_experiments:
- experiment_type: Immunolocalization
  description: >-
    Raise an antibody to O. pearsei talin and co-stain with VIN1, integrin beta
    and phalloidin in sponge tissue.
- experiment_type: Binding assay
  description: >-
    Test binding of the recombinant TLN FERM head to O. pearsei integrin beta
    cytoplasmic tails and to PIP2-containing membranes, and map vinculin binding
    across rod fragments with and without force (magnetic tweezers).
