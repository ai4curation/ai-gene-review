  review:
    summary: Xylan biosynthesis in the Klebsormidium wall.
    action: NEW
    reason: The alga's wall contains substituted beta-1,4-xylan, and KfXYS1 is its only IRX10-clade
      xylan synthase; the authors attribute the wall xylan to a KfXYS1 pathway. No mutant
      exists, so this is a curator inference. The general xylan term is used because the algal
      xylan's substitution differs from land-plant glucuronoxylan.
    supported_by:
