  label: Klebsormidium nitens
description: KFL_003980130 (UniProt A0A1Y1IIS5) of the charophyte green alga Klebsormidium
  nitens (formerly K. flaccidum NIES-2285) encodes KfXYS1, the algal ortholog of the land-plant
  IRX10/XYS1 xylan synthases (glycosyltransferase family 47). It is the only IRX10-clade protein
  among the alga's GT47 proteins, about 72% identical to Arabidopsis IRX10L, and the peptides
  encoded by the published KfXYS1 cloning primers match its N-terminal region and C-terminus.
  Recombinant KfXYS1 is a UDP-xylose-dependent beta-1,4-xylosyltransferase that synthesises
  beta-1,4-xylan in vitro, and the Klebsormidium cell wall contains substituted beta-1,4-xylan.
  It has a predicted N-terminal transmembrane anchor. IRX10/XYS1 orthologs are found among
  algae only in Klebsormidiophyceae and Zygnematophyceae, and chlorophytes such as Chlamydomonas
  lack them, so the land-plant xylan synthase predates the colonisation of land.
gene_model_issues:
- issue_type: OTHER
  status: SUSPECTED
  description: 'The UniProt model A0A1Y1IIS5 has 470 residues, while the published KfXYS1
    construct (Jensen et al. 2018) covers residues 27-445 of a 445-residue protein. Both share
    the N-terminal RSSLF peptide (residue 26 here) and the C-terminal RGDDEN, so the models
    differ internally by about 25 residues: an extra exon or intron retention in one model.
    Annotations are unaffected; the GT47 domain (96-391) lies within both. Not checked against
    transcript evidence.'
  supported_by:
  - reference_id: file:ARATH/IRX10/IRX10-bioinformatics/RESULTS.md
    supporting_text: so the two gene models differ internally by about 25 residues
  - reference_id: PMID:29460505
    supporting_text: the truncated coding region of KfXYS1 (amino acids 27–445) was PCR‐amplified
