suggested_questions:
- question: The UniProt gene model (470 aa) and the published KfXYS1 construct (ending at
    residue 445) share both ends but differ internally by about 25 residues. Which model matches
    the Klebsormidium transcript?
- question: Where does KfXYS1 localise in the alga, and does Klebsormidium have GT43 partners
