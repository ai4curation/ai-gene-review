proposed_new_terms:
- proposed_name: formylmethanofuran amidohydrolase activity
  proposed_definition: 'Catalysis of the reaction: N-formylmethanofuran + H2O = methanofuran
    + formate. In methanogenic archaea this reaction runs in the condensing direction in the
    FwdA/FmdA subunit of formylmethanofuran dehydrogenase, which joins formate made at the
    tungsten- or molybdenum-pterin subunit to methanofuran.'
  justification: The FwdA active site performs only this half of the EC 1.2.7.12 reaction,
    so the whole-enzyme term can be used only with contributes_to. Rhea already has the
    reaction (RHEA:24686) but GO has no matching term; the nearest is GO:0016811.
  proposed_parent:
    id: GO:0016811
    label: hydrolase activity, acting on carbon-nitrogen (but not peptide) bonds, in linear
      amides
  proposed_mappings:
  - predicate: skos:exactMatch
    target_term:
      id: RHEA:24686
      label: N-formylmethanofuran + H2O = methanofuran + formate
  supported_by:
  - reference_id: PMID:27846502
    supporting_text: CO2 is first reduced to formate in FwdBD, which then diffuses through
      a 43-angstrom-long tunnel to FwdA, where it condenses with methanofuran to
      formyl-methanofuran.
suggested_questions:
- question: Should GO:0044675 (tungsten enzyme complex) be redefined as a six-subunit
    FwdABCDFG complex (the definition says four polypeptides), and should FwdA also be
    annotated part_of GO:0044676 (molybdenum enzyme complex), given that the fmd operon has
    no fmdA and FmdA appears to be the fwdA product?
- question: Should InterPro/GO map IPR053635 (Metallo-hydrolase FwdA/FmdA) to the proposed
    formylmethanofuran amidohydrolase activity, or to GO:0016811, instead of relying on the
    generic composite-domain mapping?
suggested_experiments:
- experiment_type: Site-directed mutagenesis and enzyme assay
  hypothesis: The FwdA binuclear zinc site (His57, His59, Lys178, His231, His271, Asp385)
    is required for formylmethanofuran formation but not for CO2 reduction to formate at
    FwdB.
  description: In the Methanothermobacter genetic system, replace a zinc ligand of FwdA
    (e.g. K178A or D385N), purify Fwd, and measure formate production from CO2 separately
    from N-formylmethanofuran formation, and the formylmethanofuran:formate exchange
    (hydrolysis) activity.
- experiment_type: Protein composition analysis
  hypothesis: FwdA is incorporated into the molybdenum isoenzyme Fmd in molybdate-grown
    cells.
  description: Purify Fmd from molybdate-grown Delta H cells and identify subunit A by mass
    spectrometry against MTH_1557.
