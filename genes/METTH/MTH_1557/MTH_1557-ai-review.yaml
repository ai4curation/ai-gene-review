  review:
    summary: ARBA machine-learning annotation of generic hydrolase activity.
    action: MODIFY
    reason: True but too general. FwdA is the amidohydrolase-fold subunit of
      formylmethanofuran dehydrogenase, and its half reaction is the formation (formally
      the reverse of hydrolysis) of the formyl amide bond of N-formylmethanofuran from
      formate and methanofuran. The amide is a linear N-substituted formamide, so the most
      specific existing GO term is GO:0016811 (C-N bonds in linear amides), the same
      replacement used for the GO:0016810 row. A term for the specific reaction (RHEA:24686)
      is proposed under proposed_new_terms. The physiological direction is condensation, but
      GO reaction terms do not encode direction.
    proposed_replacement_terms:
    - id: GO:0016811
      label: hydrolase activity, acting on carbon-nitrogen (but not peptide) bonds, in linear
        amides
    supported_by:
    - reference_id: PMID:27846502
      supporting_text: Catalysis is separately performed by subunits FwdBD (FwdB and FwdD),
        which are related to tungsten-containing formate dehydrogenase, and subunit FwdA, a
        binuclear metal center carrying amidohydrolase.
    - reference_id: PMID:27846502
      supporting_text: CO2 is first reduced to formate in FwdBD, which then diffuses through
