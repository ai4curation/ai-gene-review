taxon:
  id: NCBITaxon:187420
  label: Methanothermobacter thermautotrophicus str. Delta H
description: >-
  MTH_1557 encodes FwdA, subunit A of the tungsten-containing formylmethanofuran
  dehydrogenase (Fwd, EC 1.2.7.12) of the hydrogenotrophic methanogen
  Methanothermobacter thermautotrophicus. Fwd catalyses the first step of CO2 reduction to
  methane, the reductive formylation of methanofuran with CO2 and electrons from reduced
  ferredoxin. The enzyme is a soluble cytoplasmic FwdABCDFG complex, encoded with FwdH by
  the fwdHFGDACB operon (MTH_1553-1559). Its reaction is split between two active sites:
  CO2 is reduced to formate at the tungsten-pterin site of FwdB (with FwdD), and formate
  passes through an internal tunnel to FwdA, where it is condensed with the amino group of
  methanofuran to give N-formylmethanofuran. FwdA is a member of the metal-dependent
  amidohydrolase superfamily, and in the orthologous Methanothermobacter wolfeii structure
  its active site holds two zinc ions bridged by a carboxylated lysine; all the metal
  ligands are conserved in MTH_1557. A single fwdA gene appears to supply subunit A also to
  the molybdenum isoenzyme (Fmd), whose operon lacks an fmdA gene.
