    supporting_text: to contain per mol 0.4 mol tungsten, < 0.05 mol molybdenum, 8 mol
      non-heme iron, 8 mol acid-labile sulfur and molybdopterin guanine dinucleotide.
  - reference_id: file:METTH/MTH_1559/MTH_1559-bioinformatics/RESULTS.md
    supporting_text: The protein ligand maps to Cys123 of O27601.
