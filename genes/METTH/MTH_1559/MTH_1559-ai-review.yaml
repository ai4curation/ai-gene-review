gene_symbol: MTH_1559
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:187420
  label: Methanothermobacter thermautotrophicus str. Delta H
description: >-
  MTH_1559 encodes FwdB, the catalytic tungsten-pterin subunit of the tungsten-containing
  formylmethanofuran dehydrogenase (Fwd, EC 1.2.7.12) of the hydrogenotrophic methanogen
  Methanothermobacter thermautotrophicus. Fwd catalyses the first step of CO2 reduction to
  methane, CO2 + methanofuran + reduced ferredoxin to N-formylmethanofuran, as a soluble
  cytoplasmic FwdABCDFG complex encoded by the constitutively transcribed fwdHFGDACB operon
  (MTH_1553-1559). FwdB, together with FwdD (which corresponds to the C-terminal cap domain
  of other formate dehydrogenases), forms a module related to tungsten formate
  dehydrogenases. It holds a tungsten ion bound by the dithiolenes of two pterin guanine
  dinucleotide cofactors, a terminal sulfido ligand and a cysteine (Cys123 in MTH_1559),
  plus one [4Fe-4S] cluster that receives electrons from the iron-sulfur relay of FwdF and
  FwdG. At this site CO2 is reduced to formate, which travels through an internal tunnel
  to FwdA, where it is condensed with methanofuran. A molybdenum isoenzyme (Fmd), whose
  subunit FmdB is encoded by a separate molybdate-induced operon, carries out the same
  reaction.
