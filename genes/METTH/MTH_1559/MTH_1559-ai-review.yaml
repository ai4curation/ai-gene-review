  review:
    summary: Combined automated annotation (FwdB family, EC 1.2.7.12, UniRule) of
      formylmethanofuran dehydrogenase activity on subunit B.
    action: MARK_AS_OVER_ANNOTATED
    reason: The activity is real and belongs to the enzyme this subunit is part of, but the
      full EC 1.2.7.12 reaction is a property of the Fwd complex, not of FwdB alone. FwdB
      (with FwdD) reduces CO2 to formate; the formate is condensed with methanofuran at a
      separate active site in FwdA, 43 A away, and the electrons arrive through the
      [4Fe-4S] clusters of FwdF and FwdG. The relation should therefore be contributes_to,
      which is recorded in core functions (pattern 16; same treatment as frhA). The row is
      not removed because the subunit performs half of the reaction.
    supported_by:
    - reference_id: PMID:27846502
      supporting_text: CO2 is first reduced to formate in FwdBD, which then diffuses through
        a 43-angstrom-long tunnel to FwdA, where it condenses with methanofuran to
        formyl-methanofuran.
