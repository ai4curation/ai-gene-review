- proposed_name: formate dehydrogenase activity (acceptor-unspecified)
  proposed_definition: 'Catalysis of the reaction: formate + A = CO2 + AH2, where A is an
    unspecified electron acceptor. Includes the CO2-reducing catalytic subunits of
    multisubunit enzymes, such as FwdB/FmdB of formylmethanofuran dehydrogenase, whose
    electrons are delivered by an internal iron-sulfur relay.'
  justification: GO has only acceptor-specific formate dehydrogenase terms (NAD+, NADP+,
    coenzyme F420, quinone, cytochrome, cytochrome c-553) and no common parent. The Mo/W
    catalytic subunits of formylmethanofuran dehydrogenases perform formate dehydrogenase
    chemistry without a free soluble acceptor, so none of the existing terms applies and
    the whole-enzyme term GO:0018493 can be used only with contributes_to. A generic term
    would also serve as the parent of the existing acceptor-specific terms, which now sit
    under two different oxidoreductase branches (CH or CH2 donors, and aldehyde or oxo
    donors).
  proposed_parent:
    id: GO:0016491
    label: oxidoreductase activity
  supported_by:
  - reference_id: PMID:27846502
    supporting_text: CO2 is first reduced to formate in FwdBD, which then diffuses through
      a 43-angstrom-long tunnel to FwdA
  - reference_id: PMID:30120799
    supporting_text: it is likely that the two groups of enzyme operate via the same
      fundamental chemical mechanism.
suggested_questions:
- question: Should PANTHER node PTN002875529 (PTHR43105) be checked so that NADH
    dehydrogenase activity, membrane and respiratory electron transport chain are not
    propagated to the soluble FwdB/FmdB clade?
- question: Should the UniProt PIRNR005646 rule add the Selenocysteine keyword only when the
    metal-ligand position is a Sec codon? O27601 and M. wolfeii FwdB use cysteine.
- question: Is a generic (acceptor-unspecified) formate dehydrogenase term acceptable to GO,
    as a parent for the existing acceptor-specific terms and for the catalytic subunits of
    formylmethanofuran dehydrogenases?
suggested_experiments:
- experiment_type: Site-directed mutagenesis and enzyme assay
  hypothesis: Cys123 of FwdB is the tungsten ligand required for CO2 reduction to formate,
    and loss of formate production at FwdB abolishes formylmethanofuran synthesis.
  description: Replace Cys123 of FwdB by Ser or Sec in the Methanothermobacter genetic
    system, purify Fwd from tungstate-grown cells, and measure CO2-dependent formate release
    and formylmethanofuran synthesis with reduced ferredoxin or Ti(III) citrate.
tags:
