core_functions:
- description: Tungsten-pterin catalytic subunit of formylmethanofuran dehydrogenase. With
    FwdD, FwdB reduces CO2 to formate at a tungsten bis(pterin guanine dinucleotide) site
    with a cysteine ligand, using electrons supplied through its [4Fe-4S] cluster from the
    Fe-S relay of the complex; the formate is passed to FwdA, which joins it to
    methanofuran. FwdB thus performs the redox half of the first step of CO2 reduction to
    methane.
  contributes_to_molecular_function:
    id: GO:0018493
    label: formylmethanofuran dehydrogenase activity
  directly_involved_in:
  - id: GO:0019386
    label: methanogenesis, from carbon dioxide
  locations:
  - id: GO:0005737
    label: cytoplasm
  in_complex:
    id: GO:0044675
    label: formyl-methanofuran dehydrogenase (tungsten enzyme) complex
  substrates:
  - id: CHEBI:16526
    label: carbon dioxide
  supported_by:
  - reference_id: PMID:27846502
    supporting_text: CO2 is first reduced to formate in FwdBD, which then diffuses through
      a 43-angstrom-long tunnel to FwdA, where it condenses with methanofuran to
      formyl-methanofuran.
- description: The FwdB half reaction, reversible reduction of CO2 to formate at the tungsten
    site (formate dehydrogenase-type chemistry).
  proposed_molecular_function: formate dehydrogenase activity (acceptor-unspecified)
  supported_by:
  - reference_id: PMID:27846502
    supporting_text: Catalysis is separately performed by subunits FwdBD (FwdB and FwdD),
      which are related to tungsten-containing formate dehydrogenase
- description: Binds the tungsten bis(pterin guanine dinucleotide) cofactor and one [4Fe-4S]
    cluster.
