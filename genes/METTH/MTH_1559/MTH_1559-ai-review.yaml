- term:
    id: GO:0043546
    label: molybdopterin cofactor binding
  evidence_type: ISS
  original_reference_id: PMID:27846502
  qualifier: enables
  review:
    summary: FwdB binds the tungsten bis(pterin guanine dinucleotide) cofactor.
    action: NEW
    reason: The gene has no cofactor annotation. The tungsten of Fwd is held by two pterin
      guanine dinucleotide (MGD) cofactors in FwdB, not as a free ion (pattern 17), so the
      correct term is the pterin-cofactor term rather than a metal or tungstate binding term.
