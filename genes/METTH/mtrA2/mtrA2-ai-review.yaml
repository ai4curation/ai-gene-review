knowledge_gaps:
- gap_statement: >-
    The biological role of mtrA2 is unknown: whether it is expressed, whether it carries a methylated
    cobamide, which methyltransferase(s) methylate or demethylate it, and whether it has any role in
    methanogenesis or in Mtr assembly or regulation have not been studied for mtrA2 or for any
    cytoplasmic MtrA homologue.
  boundary: >-
    Established, mtrA2 is a 183-residue paralog of MtrA outside the mtr operon that consists only of the
    cobamide-binding domain and lacks the membrane anchor; its cobalt-ligand His is conserved; a homologue
    of the same class from M. fervidus binds cobalamin tightly in vitro. Unknown, any in vivo function.
  gap_kind:
  - BIOLOGY
  dark_aspect: BP_DARK
  status: OPEN
  significance: >-
    Cytoplasmic MtrA homologues are found as extra copies in many methanogens, so they are likely to have
    a conserved role; knowing it would show whether they act as soluble methyl carriers, as
    regulators or spare parts of Mtr, or are inactive relics, and would allow the HAMAP rule to be
    split on functional rather than structural grounds.
  resolution: >-
    Deletion and expression studies in M. thermautotrophicus, corrinoid content of the native protein,
    and pull-down or methyl-transfer assays (see suggested_experiments).
  provenance:
  - reference_id: PMID:27324530
    supporting_text: The use of the cytoplasmic MtrA homologues as models for MtrA in order to increase
      the crystallization space is justified because of the high sequence identity
proposed_new_terms: []
suggested_questions:
- question: Should HAMAP MF_01093 exclude, or give a separate case to, the cytoplasmic MtrA homologues
    (below about 215 aa, no juxtamembrane or transmembrane segment), which currently receive the
    operon subunit's cell membrane location, a TM prediction inside the soluble domain, EC 7.2.1.4 and
    Mtr complex membership? The rule's Size window (183-262) and Duplicate line (METTH, METTM, METRM)
    show the paralogs are knowingly in scope.
- question: Should the InterPro2GO mappings of IPR005778 (MtrA) to sodium ion transport and
    tetrahydromethanopterin S-methyltransferase activity be restricted to the membrane-anchored
    subunit, given that the signature also matches the soluble homologues?
- question: Is mtrA2 expressed in M. thermautotrophicus under any growth condition, and does the
    native protein contain a cobamide?
suggested_experiments:
- hypothesis: mtrA2 is a soluble corrinoid protein that is not part of the Mtr complex.
  description: Express mtrA2 in M. thermautotrophicus Delta H with an affinity tag (or raise an
    antibody), fractionate cells into membrane and cytoplasm, determine the corrinoid content of the
    purified native protein, and test whether it co-purifies with Mtr subunits or with other
    methyltransferases.
  experiment_type: localisation and pull-down
- hypothesis: mtrA2 serves a methyl-transfer reaction other than the Mtr step.
  description: Delete mtrA2 and compare growth on H2/CO2 and on alternative substrates, with
    transcriptome and proteome profiling to find co-regulated methyltransferase genes; then test whether
    reconstituted holo-mtrA2 is methylated by MtrH or by candidate methyltransferases in vitro.
  experiment_type: genetics and enzymology
