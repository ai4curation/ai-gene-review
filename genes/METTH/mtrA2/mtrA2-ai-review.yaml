- term:
    id: GO:0050897
    label: cobalt ion binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR005778
  review:
    summary: InterPro2GO mapping from the MtrA family signature (IPR005778) to cobalt ion binding.
    action: MODIFY
    reason: The cobalt of MtrA-family proteins is the centre of a corrinoid prosthetic group held by the
      lower axial ligand His84, not a free Co2+ ion. That histidine and its glutamate partner are
      conserved in mtrA2 (His87 and Glu57), and the M. fervidus cytoplasmic MtrA homologue, of the same
      class and 65% identical to mtrA2, binds cobalamin tightly in the base-off/His-on mode. The
      informative term is GO:0031419 cobalamin binding. The native cofactor of cytochrome-free
      methanogens is 5-hydroxybenzimidazolyl cobamide rather than cobalamin, but the GO:0031419
      definition (a corrin nucleus with a cobalt atom) fits. Treated as for mtrA1 and METJA/mtrA
      (pattern 17 of the ARCHAEA catalogue). The binding is a prediction for mtrA2 itself; it has not
      been measured.
    proposed_replacement_terms:
