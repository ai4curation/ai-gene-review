status: COMPLETE
taxon:
  id: NCBITaxon:187420
  label: Methanothermobacter thermautotrophicus str. Delta H
description: >-
  mtrA2 (MTH_1062) of the hydrogenotrophic methanogen Methanothermobacter thermautotrophicus encodes
  a 183-residue paralog of MtrA, the cobamide-carrying subunit of the Na+-translocating
  methyl-tetrahydromethanopterin:coenzyme M methyltransferase (Mtr). Unlike the operon-encoded
  subunit mtrA1 (MTH_1159), mtrA2 lies outside the mtr operon and consists only of the soluble
  cobamide-binding domain. It is about 60% identical to mtrA1 over that domain and lacks the
  juxtamembrane segment and the C-terminal transmembrane helix that anchor MtrA in the complex. It
  belongs to the cytoplasmic MtrA homologues found as extra copies in many methanogens. The lower axial
  cobalt ligand of MtrA (His84) and its glutamate partner are conserved (His87 and Glu57). A
  near-identical cytoplasmic homologue from Methanothermus fervidus binds cobalamin tightly in the
  same base-off/His-on mode as MtrA. mtrA2 is therefore predicted to be a soluble corrinoid protein.
  Whether it is expressed, what it binds and which methyl-transfer reaction, if any, it serves are
  unknown, and there is no evidence that it is part of the Mtr complex.
