taxon:
  id: NCBITaxon:187420
  label: Methanothermobacter thermautotrophicus str. Delta H
description: >-
  mtrA1 (MTH_1159) encodes subunit A of the membrane-bound N5-methyltetrahydromethanopterin:coenzyme M
  methyltransferase (Mtr) of the hydrogenotrophic methanogen Methanothermobacter thermautotrophicus. It
  is the mtrA gene of the mtr operon, which lies just downstream of the methyl-coenzyme M reductase I
  operon. Mtr is an eight-subunit complex (MtrA-H) that catalyses the penultimate step of
  methanogenesis from CO2, the transfer of a methyl group from methyl-tetrahydromethanopterin
  (methyl-H4MPT) to coenzyme M. The exergonic transfer is coupled to the export of sodium ions and is
  the Na+-motive, energy-conserving step of the pathway. MtrA is the methyl-carrying subunit. Its
  N-terminal cytoplasmic domain binds a 5-hydroxybenzimidazolyl cobamide (factor III) prosthetic group
  in a base-off/His-on mode, with His84 as the lower axial cobalt ligand. A single C-terminal
  transmembrane helix anchors MtrA in the membrane-spanning stalk of the complex. In the catalytic
  cycle the cob(I)amide of MtrA is methylated by methyl-H4MPT in a reaction catalysed by MtrH, and the
  methyl-cob(III)amide is then demethylated by coenzyme M in a Na+-dependent reaction at the MtrCDE
  membrane module. The mobile cobamide domain is proposed to shuttle between MtrH and MtrCDE and to
  drive the conformational changes of the pump. The genome also encodes a separate, shorter paralog
  (mtrA2, MTH_1062) that consists only of a soluble cobamide-binding domain and has no known role.
