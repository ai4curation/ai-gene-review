- term:
    id: GO:0035725
    label: sodium ion transmembrane transport
  evidence_type: IEA
  original_reference_id: GO_REF:0000108
  qualifier: involved_in
  supporting_entities:
  - GO:0030269
  review:
    summary: Inter-ontology inference from the GO:0030269 row, whose term is a child of sodium ion
      transmembrane transporter activity.
    action: KEEP_AS_NON_CORE
    reason: The Na+ binding site and transmembrane path are in MtrCDE, and MtrA has only a single anchor
      helix in the stalk. MtrA nonetheless does part of the work of the transport. Its demethylation is
      the Na+-dependent, energy-releasing step, and its cobamide domain is proposed to switch MtrCDE
      between inward- and outward-facing states. The pump mechanism is a structural hypothesis and MtrA
      is the energy donor rather than the ion conductor, so the term is kept as non-core. The row derives
      from the over-annotated GO:0030269 row, but the process claim holds on its own. Same treatment as
      METJA/mtrA.
    supported_by:
    - reference_id: PMID:11248186
      supporting_text: it is proposed that methyl
        transfer from MtrA to coenzyme M is associated with a conformational change of
        the protein and that this change drives the electrogenic translocation of the
        sodium ions.
    - reference_id: PMID:38530900
      supporting_text: Hypothetically,
        strongly attached methyl-cob(III)amide (His-on) carrying MtrA induces an
        inward-facing conformation, Na+ flux into the membrane protein center and
        finally coenzyme M methylation
