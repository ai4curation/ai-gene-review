  review:
    summary: Combined automated annotation (InterPro, Rhea, EC 7.2.1.4 and HAMAP) of the complete Mtr
      reaction onto subunit A, with the qualifier enables.
    action: MARK_AS_OVER_ANNOTATED
    reason: GO:0030269 (RHEA:53492) is the whole reaction of the eight-subunit complex, methyl transfer
      from methyl-H4MPT to coenzyme M coupled to the outward movement of 2 Na+, and is also a child of
      sodium ion transmembrane transporter activity. MtrA alone catalyses neither half-reaction. MtrH
      catalyses methylation of the MtrA cob(I)amide by methyl-H4MPT, and the Na+-dependent methyl
      transfer to coenzyme M needs the MtrCDE module, which holds the Na+ and coenzyme M sites. MtrA is
      the cobamide-carrying intermediate linking the two half-reactions, so it does real work in the
      activity (the cofactor case) and the row is not removed, but enables overstates its role. The
      contribution is recorded in core_functions as contributes_to GO:0030269. Pattern 16 of the ARCHAEA
      catalogue, treated as for METJA/mtrA.
    supported_by:
    - reference_id: PMID:10338124
      supporting_text: We report here that the 34 kDa subunit MtrH catalyzes the methylation reaction.
    - reference_id: PMID:38530900
      supporting_text: Putative coenzyme M and Na+ were identified inside or in a side-pocket of a
        cytoplasmic cavity formed within MtrCDE.
