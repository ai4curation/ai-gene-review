core_functions:
- description: Methyl-carrying corrinoid subunit of the Na+-translocating Mtr complex. Its cobamide
    prosthetic group accepts the methyl group from methyl-H4MPT (in a reaction catalysed by MtrH) and
    donates it to coenzyme M at the MtrCDE membrane module. MtrA thereby contributes to the
    energy-conserving methyl-H4MPT to methyl-CoM step (RHEA:53492) of methanogenesis from CO2.
  contributes_to_molecular_function:
    id: GO:0030269
    label: tetrahydromethanopterin S-methyltransferase activity
  directly_involved_in:
  - id: GO:0019386
    label: methanogenesis, from carbon dioxide
  locations:
  - id: GO:0005886
    label: plasma membrane
  in_complex:
    id: GO:0044677
    label: methyl-tetrahydromethanopterin:coenzyme M methyltransferase complex
  supported_by:
  - reference_id: PMID:10338124
    supporting_text: The 23 kDa subunit MtrA harbors a corrinoid prosthetic group which is methylated
      and demethylated in the catalytic cycle.
  - reference_id: PMID:8001564
    supporting_text: forming an enzyme-bound CH3-corrinoid as
      intermediate
- description: Binding of the 5-hydroxybenzimidazolyl cobamide prosthetic group (cobalamin in vitro) in
    a base-off/His-on mode, with His84 as the lower axial cobalt ligand.
  molecular_function:
    id: GO:0031419
    label: cobalamin binding
  supported_by:
  - reference_id: PMID:8898900
    supporting_text: the corrinoid is bound to MtrA1
      in the base-off form and that the Co(II) of the prosthetic group is coordinated
      by a histidine residue of the apoprotein
  - reference_id: PMID:9461302
    supporting_text: identified by site-directed mutagenesis to be His84
proposed_new_terms: []
suggested_questions:
- question: GO:0031419 cobalamin binding names cobalamin, but cytochrome-free methanogens use
    5-hydroxybenzimidazolyl cobamide (factor III). Should GO broaden GO:0031419 to cobamide/corrinoid
    binding, or add a corrinoid binding parent? (Same question as METJA/mtrA.)
- question: GO has no molecular-function term for a corrinoid methyl-carrier protein. Should one be
    added, so that MtrA and other corrinoid methyl carriers need not be annotated only by contributes_to
    the whole-complex activity?
- question: Should the InterPro2GO mapping of IPR005778 (MtrA) to GO:0050897 cobalt ion binding be
    replaced by GO:0031419 cobalamin binding?
- question: The paralog mtrA2 (O27134, MTH_1062, 183 aa) has only the soluble cobamide domain and lies
    outside the mtr operon, yet HAMAP MF_01093 gives it the operon subunit's annotations (cell membrane,
    single-pass, with a TRANSMEM at 102..118 inside the soluble domain; EC 7.2.1.4; complex
    membership). Should MF_01093 exclude the cytoplasmic MtrA homologues (length below about 215 aa,
    no C-terminal anchor)?
suggested_experiments:
- hypothesis: The cytoplasmic paralog MtrA2 is not a subunit of the Mtr complex and carries a cobamide
    for another methyl-transfer reaction.
  description: Delete mtrA2 in M. thermautotrophicus Delta H, test growth on H2/CO2, and determine
    whether MtrA2 co-purifies with Mtr or with other methyltransferases; measure its corrinoid content.
- hypothesis: His84-associated segments of MtrA carry the conformational change that drives Na+
    translocation.
  description: Reconstitute the Mtr complex with His84 or Glu54 variants of MtrA and measure methyl
    transfer and 22Na+ uptake in proteoliposomes.
