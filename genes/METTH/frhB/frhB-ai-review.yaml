id: P19499
gene_symbol: frhB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:187420
  label: Methanothermobacter thermautotrophicus str. Delta H
description: >-
  FrhB is the beta subunit (about 31 kDa) of the cytoplasmic coenzyme F420-reducing
  [NiFe]-hydrogenase (Frh, EC 1.12.98.1) of the hydrogenotrophic methanogen
  Methanothermobacter thermautotrophicus. Frh is built from FrhA, FrhG and FrhB
  heterotrimers assembled into a large dodecameric shell. FrhB is an iron-sulfur
  flavoprotein with a fold not seen in other F420-binding proteins: it carries one
  [4Fe-4S] cluster, a tightly bound FAD and the binding site for coenzyme F420.
  Electrons from H2, split at the [NiFe] centre of FrhA, pass through the three
  [4Fe-4S] clusters of FrhG and the cluster of FrhB to the FAD, which reduces F420
  by hydride transfer; F420 binds in van der Waals contact with the FAD
  isoalloxazine ring. FrhB holds no nickel. The FrhB fold is shared by the
  F420-interacting subunits of other enzymes, such as F420H2 dehydrogenase (FpoF,
  FqoF), F420-dependent sulfite reductase and formate dehydrogenase (FdhB). The
  reduced F420 (F420H2) made by Frh supplies electrons for two reductive steps of
  CO2 reduction to methane. frhB is the last gene of the frhADGB operon.
