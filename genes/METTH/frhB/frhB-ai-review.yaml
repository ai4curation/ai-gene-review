core_functions:
- description: Iron-sulfur flavoprotein subunit of the cytoplasmic coenzyme
    F420-reducing hydrogenase (FrhABG). FrhB receives electrons from H2, split at the
    FrhA [NiFe] centre and relayed through the FrhG clusters, on its [4Fe-4S] cluster
    and FAD, and reduces the bound coenzyme F420 by hydride transfer from the FAD. The
    complex regenerates the F420H2 used in CO2-reducing methanogenesis.
