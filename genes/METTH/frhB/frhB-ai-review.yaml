suggested_questions:
- question: Should InterPro2GO mappings of the three Frh subunit-specific entries be
    split by subunit? IPR017679 (FrhB) should keep FAD binding and iron-sulfur cluster
    binding (ideally 4 iron, 4 sulfur cluster binding) and gain coenzyme F420 binding,
    but lose nickel cation binding, which belongs to IPR017682 (FrhA).
- question: Should PANTHER restrict GO:0052592 (CH/CH2 donor, iron-sulfur protein
    acceptor) in PTHR31332 to the 7-hydroxymethyl chlorophyll a reductase clade, rather
    than a node that includes archaeal FrhB, FpoF and FdhB subunits with different
    donors and acceptors?
- question: Is there a GO term, or should one be requested, for the subunit-level
    activity of FrhB-family proteins (FAD-dependent hydride transfer to coenzyme F420
    from an electron-transfer partner)? Without it, FrhB can only be annotated with
    binding terms and contributes_to the complex activity.
suggested_experiments:
- experiment_type: Site-directed mutagenesis and enzyme assay
  hypothesis: The conserved S209-V210 loop and 163IGKGK turn of FrhB form the F420
    site, and their substitution abolishes F420 reduction but not methylviologen
    reduction by the complex.
  description: Express Frh variants carrying substitutions in the FrhB F420-contacting
    loops (homologous expression in Methanothermobacter or Methanococcus), and compare
