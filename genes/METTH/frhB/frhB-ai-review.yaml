- term:
    id: GO:0019386
    label: methanogenesis, from carbon dioxide
  evidence_type: IC
  original_reference_id: PMID:23483797
  qualifier: involved_in
  review:
    summary: Frh regenerates the F420H2 consumed by two steps of CO2-reducing
      methanogenesis.
    action: NEW
    reason: The Frh complex catalyses a step of the hydrogenotrophic pathway itself, the
      H2-dependent reduction of F420, and FrhB performs the final part of that step, the
      hydride transfer from FAD to F420. The product F420H2 is the reductant for the
      methylene-H4MPT dehydrogenase and reductase steps. M. thermautotrophicus Delta H
      grows only by reducing CO2 with H2. The Hmd-Mtd cycle can substitute for Frh in
      M. maripaludis, but redundancy does not change that Frh performs the step. Not
      marked core, as in the frhA review.
    supported_by:
    - reference_id: PMID:23483797
      supporting_text: Four electrons are provided through the reduced form of the
        coenzyme F420, which is regenerated by Frh.
    - reference_id: PMID:18487331
      supporting_text: Their analysis demonstrates that either pathway supports growth on
        H2 and CO2.
