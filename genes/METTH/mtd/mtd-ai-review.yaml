    supporting_text: The methanogenic electron carrier coenzyme F420 was strictly
      required as the co-substrate.
  - reference_id: PMID:19761261
    supporting_text: Both substrates methenyl-H(4)MPT(+) and F(420)H(2) bind in a face
      to face arrangement to an active site cleft
  - reference_id: PMID:14499608
    supporting_text: The fourth reaction step of CO(2)-reduction to methane in
      methanogenic archaea is catalyzed by coenzyme F(420)-dependent
      methylenetetrahydromethanopterin dehydrogenase (Mtd).
suggested_questions:
- question: Should InterPro2GO map IPR002844 and IPR036080 to GO:0030268
    methylenetetrahydromethanopterin dehydrogenase activity in place of GO:0008901,
    given that every member is an archaeal F420-dependent Mtd?
- question: Should the family-level process mapping be broadened (for example to
    one-carbon metabolism) or taxon-restricted, since the Archaeoglobus Mtd works in a
    sulfate reducer rather than in methanogenesis?
