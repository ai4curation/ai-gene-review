      IPR036080 have identical membership (169 proteins), and every UniProtKB member
      (163 entries, all Archaea) is named F420-dependent methylene-H4MPT dehydrogenase
      (EC 1.5.98.1); the InterPro entry description itself states that the enzyme
      requires F420. No member is a hydrogenase, so the mapping is wrong for the whole
      family, not a scope problem. The correct activity is the GO:0030268 row.
