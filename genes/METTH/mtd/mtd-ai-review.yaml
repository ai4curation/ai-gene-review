- term:
    id: GO:0015948
    label: methanogenesis
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR002844
  - InterPro:IPR036080
  review:
    summary: InterPro2GO mapping of the Mtd family and superfamily to methanogenesis.
    action: MODIFY
    reason: Correct but general. M. thermautotrophicus Delta H grows only by reducing
      CO2 with H2, and Mtd catalyses the fourth step of that pathway, so the supported
      term is the is_a child GO:0019386 methanogenesis, from carbon dioxide, which the
      gene already carries (UniRule row). The Hmd-Mtd cycle, in which Mtd runs in the
      methylene-H4MPT-oxidising direction to supply F420H2, is also part of CO2
      reduction. The broad family-level mapping is reasonable for methanogen members,
      but the family also contains the Mtd of the sulfate reducer Archaeoglobus
      fulgidus, which is not methanogenic; that is flagged upstream as a CHECK.
    proposed_replacement_terms:
    - id: GO:0019386
      label: methanogenesis, from carbon dioxide
    supported_by:
    - reference_id: PMID:14499608
      supporting_text: The fourth reaction step of CO(2)-reduction to methane in
        methanogenic archaea is catalyzed by coenzyme F(420)-dependent
        methylenetetrahydromethanopterin dehydrogenase (Mtd).
