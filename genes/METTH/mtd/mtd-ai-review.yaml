  review:
    summary: Combined automated annotation (UniRule, UniPathway) of methanogenesis from
      carbon dioxide.
    action: ACCEPT
    reason: Mtd performs one step of the pathway itself (reduction of methenyl-H4MPT+
      to methylene-H4MPT with F420H2), and M. thermautotrophicus Delta H is an obligate
      CO2-reducing methanogen. Mtd is redundant with Hmd for this step, and mtd is
      transcribed mainly when H2 is limiting, but redundancy does not change that it
      catalyses the step. The reverse (methyl-oxidising) use of Mtd in methylotrophic
      methanogens and Archaeoglobus does not apply to this organism.
    supported_by:
