id: Q50501
gene_symbol: mtd
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:187420
  label: Methanothermobacter thermautotrophicus str. Delta H
description: >-
  Mtd is the coenzyme F420-dependent N5,N10-methylenetetrahydromethanopterin
  dehydrogenase (EC 1.5.98.1) of the hydrogenotrophic methanogen
  Methanothermobacter thermautotrophicus. It catalyses the reversible hydride
  transfer between reduced coenzyme F420 (F420H2) and
  5,10-methenyltetrahydromethanopterin (methenyl-H4MPT+), giving
  5,10-methylene-H4MPT; this is the fourth step of CO2 reduction to methane. The
  enzyme purified from strain Delta H is an oxygen-stable homohexamer of about
  36 kDa subunits, strictly requires F420 as its electron carrier, follows a
  ternary-complex mechanism and is stimulated by monovalent cations. It contains no
  flavin, metal or other prosthetic group: crystal structures of the Methanopyrus
  kandleri orthologue show methenyl-H4MPT+ and F420H2 stacked face to face in an
  active-site cleft for direct hydride transfer. Mtd is unrelated in sequence to
  Hmd, the H2-forming methylene-H4MPT dehydrogenase that catalyses the same C1
  interconversion with H2, and the two enzymes are differentially expressed: mtd is
  transcribed when H2 is limiting. Under nickel limitation, when the
  F420-reducing [NiFe]-hydrogenase is scarce, Hmd and Mtd together can reduce
  F420 with H2 (the Hmd-Mtd cycle). Mtd is a soluble cytoplasmic enzyme.
