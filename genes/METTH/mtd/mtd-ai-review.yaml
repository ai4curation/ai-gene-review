core_functions:
- description: Coenzyme F420-dependent methylene-H4MPT dehydrogenase. Catalyses the
    reversible direct hydride transfer between F420H2 and methenyl-H4MPT+, forming
    methylene-H4MPT in the fourth step of CO2 reduction to methane, and with Hmd can
    reduce F420 with H2 when the F420-reducing hydrogenase is limiting.
  molecular_function:
    id: GO:0030268
    label: methylenetetrahydromethanopterin dehydrogenase activity
  directly_involved_in:
