- term:
    id: GO:0030268
    label: methylenetetrahydromethanopterin dehydrogenase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - RHEA:16721
  - EC:1.5.98.1
  - UniRule:UR000037474
  review:
    summary: Combined automated annotation (UniRule, EC 1.5.98.1, RHEA:16721) of
      F420-dependent methylene-H4MPT dehydrogenase activity.
    action: ACCEPT
    reason: This is the core activity, and the term is the specific one. GO:0030268 is
      defined with coenzyme F420 as the acceptor (5,10-methylene-H4MPT + F420 + 2 H+ =
      5,10-methenyl-H4MPT + reduced F420), which distinguishes it from the H2-forming
      Hmd activity (GO:0047068). The enzyme purified from strain Delta H catalyses
      exactly this reversible reaction and strictly requires F420; the recombinant gene
      product from the closely related strain Marburg has the same F420 dependence. A
      single-subunit homohexamer, so enables is the right qualifier.
    supported_by:
    - reference_id: PMID:1991149
      supporting_text: The aerobically stable monofunctional enzyme catalyzed the
        reversible oxidation of 5,10-methylene-5,6,7,8-tetrahydromethanopterin to its
        5,10-methenyl derivative.
    - reference_id: PMID:1991149
      supporting_text: The methanogenic electron carrier coenzyme F420 was strictly
        required as the co-substrate.
    - reference_id: PMID:4084309
      supporting_text: The purified enzyme is absolutely dependent on coenzyme F420
    - reference_id: PMID:7852356
      supporting_text: was expressed in Escherichia coli yielding an enzyme that, like
        the native enzyme, was oxygen-stable, strictly dependent on coenzyme F420
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IC
  original_reference_id: PMID:1991149
  review:
    summary: Mtd is a soluble cytoplasmic enzyme.
    action: NEW
    reason: The gene has no location annotation. Mtd was purified from cell extracts of
      strain Delta H as a soluble homohexamer with nearly complete recovery, its
      substrates (methylene-H4MPT and coenzyme F420) are soluble cytoplasmic
      coenzymes, and the UniProt record has no transmembrane segment or signal peptide
      (only a disordered C-terminal region). These independent lines agree on the
      cytoplasm, as for the other soluble C1 enzymes of the pathway.
    supported_by:
    - reference_id: PMID:1991149
      supporting_text: 5,10-Methylenetetrahydromethanopterin dehydrogenase from
        Methanobacterium thermoautotrophicum strain delta H was purified to homogeneity
        with nearly complete recovery.
    - reference_id: PMID:1991149
      supporting_text: The dehydrogenase (Mr 216,000) was purified as an apparent
        hexamer of six identical 36 kDa subunits.
