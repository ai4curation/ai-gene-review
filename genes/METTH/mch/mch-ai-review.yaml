    summary: Combined automated annotation (InterPro IPR003209, UniRule, EC 3.5.4.27,
      RHEA:19053) of methenyl-H4MPT cyclohydrolase activity.
    action: ACCEPT
    reason: This is the core activity and the specific term. The enzyme purified from
      M. thermautotrophicus catalyses the reversible methenyl-H4MPT+ / 5-formyl-H4MPT
      interconversion (RHEA:19053) and is specific for the methanopterin rather than
      folate carrier; the recombinant gene product from the closely related strain
      Marburg is active, and the orthologue structures define the active site. The
      Delta H entry has no direct biochemistry of its own (PE 3), but the genome has
      a single mch gene, so the enzyme purified from M. thermautotrophicus is this
      gene product or its strain-level orthologue. A homo-oligomer of one gene
      product, so enables is right.
