id: O26867
gene_symbol: mch
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:187420
  label: Methanothermobacter thermautotrophicus str. Delta H
description: >-
  Mch is the N5,N10-methenyltetrahydromethanopterin cyclohydrolase (EC 3.5.4.27) of
  the hydrogenotrophic methanogen Methanothermobacter thermautotrophicus. It
  catalyses the reversible interconversion of N5-formyltetrahydromethanopterin
  (5-formyl-H4MPT) and 5,10-methenyl-H4MPT+ with release or uptake of water; in CO2
  reduction to methane it cyclises the 5-formyl-H4MPT made by the formyltransferase
  Ftr to methenyl-H4MPT+, the third step of the pathway, which is then reduced by
  Mtd or Hmd. The enzyme purified from M. thermautotrophicus has 41 kDa subunits,
  is stimulated by Mg2+, favours methenyl-H4MPT+ at equilibrium and does not act
  on folate derivatives; the gene from the closely related strain Marburg encodes an
  active enzyme in Escherichia coli. Crystal structures of the Methanopyrus
  kandleri and Archaeoglobus fulgidus orthologues show a homotrimer with a new
  alpha/beta fold and a substrate pocket between two domains, in which a conserved
  arginine and glutamate activate the catalytic water and direct formation of the
  N5- rather than N10-formyl product. Mch is unrelated in fold to the
  tetrahydrofolate methenyl cyclohydrolases. It is a soluble cytoplasmic enzyme.
