suggested_questions:
- question: Is M. thermautotrophicus Mch a dimer, as estimated by size exclusion for
    the purified enzyme, or a trimer like the M. kandleri and A. fulgidus enzymes
    whose structures are known?
suggested_experiments:
- description: Determine the oligomeric state of recombinant M. thermautotrophicus
    Mch by native mass spectrometry or SEC-MALS, and test the R183/E186-equivalent
    variants to confirm the A. fulgidus mechanism in the methanogen enzyme.
