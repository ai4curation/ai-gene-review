- id: PMID:3782039
  title: Purification and properties of the 5,10-methenyltetrahydromethanopterin
    cyclohydrolase from Methanobacterium thermoautotrophicum.
  full_text_unavailable: true
  findings:
  - statement: Mch purified from M. thermautotrophicus has 41 kDa subunits (apparent
      dimer), is Mg2+-stimulated, favours methenyl-H4MPT at equilibrium and does not
      use folates.
    supporting_text: The enzyme was inhibited by 10-formyltetrahydromethanopterin and
      stimulated by Mg2+.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract only. DiMarco, Donnelly and Wolfe 1986; the abstract names
      M. thermoautotrophicum without a strain.
- id: PMID:8617278
  title: Primary structure of cyclohydrolase (Mch) from Methanobacterium
    thermoautotrophicum (strain Marburg) and functional expression of the mch gene in
    Escherichia coli.
  full_text_unavailable: true
  findings:
  - statement: The mch gene of strain Marburg (M. marburgensis) encodes an active
      cyclohydrolase in E. coli and is transcribed monocistronically.
    supporting_text: the mch gene appeared to be transcribed monocistronically as
      evidenced by Northern blot analysis and primer-extension experiments.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract only. Strain Marburg (now Methanothermobacter
      marburgensis), the closest relative of Delta H; 963 bp gene, same length as
      O26867.
- id: PMID:3097011
  title: 'The role of formylmethanofuran: tetrahydromethanopterin formyltransferase
    in methanogenesis from carbon dioxide.'
  full_text_unavailable: true
  findings:
  - statement: Purified Mch with purified Ftr converts formyl-MFR and H4MPT to
      methenyl-H4MPT.
    supporting_text: Reconstitution of a portion of the methanogenic C1 cycle was
      effected by combining purified formyltransferase, methenyl-H4MPT
      cyclohydrolase, formylmethanofuran, and H4MPT to give methenyl-H4MPT.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract only. Primarily about Ftr; used for the coupled Ftr-Mch
      reconstitution.
- id: PMID:9676239
  title: Overproduction and one-step purification of the N5,N10-methenyltetrahydromethanopterin
    cyclohydrolase (Mch) from the hyperthermophilic Methanopyrus kandleri.
  full_text_unavailable: true
  findings:
  - statement: Recombinant M. kandleri Mch, an enzyme of methanogenesis from CO2 and
      H2, has native properties.
    supporting_text: The purified enzyme showed essentially the same catalytic
      properties as the enzyme purified from M. kandleri cells.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Abstract only. Orthologue; compares with the M.
      thermoautotrophicum enzyme.
- id: PMID:10545331
  title: The crystal structure of methenyltetrahydromethanopterin cyclohydrolase
    from the hyperthermophilic archaeon Methanopyrus kandleri.
  full_text_unavailable: true
  findings:
  - statement: Crystal structure of M. kandleri Mch, a homotrimer with a new
      alpha/beta fold and an interdomain active-site pocket.
    supporting_text: The structure of the homotrimeric enzyme reveals a new
      alpha/beta fold that is composed of two domains forming a large
      sequence-conserved pocket between them.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract only. Grabarse et al. 1999.
- id: PMID:23013430
  title: Structure and catalytic mechanism of N(5),N(10)-methenyl-tetrahydromethanopterin
    cyclohydrolase.
  full_text_unavailable: true
  findings:
  - statement: Substrate-complex structures and mutants of A. fulgidus Mch identify
      catalytic Arg183 and Glu186; Glu186 directs N5-formyl product formation.
    supporting_text: Glu186 most likely acts as a general base.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract only. Orthologue from a sulfate reducer.
- id: PMID:8481088
  title: 'N5,N10-methenyltetrahydromethanopterin cyclohydrolase from the extremely
    thermophilic sulfate reducing Archaeoglobus fulgidus: comparison of its properties
    with those of the cyclohydrolase from the extremely thermophilic Methanopyrus
    kandleri.'
  full_text_unavailable: true
  findings:
  - statement: The A. fulgidus and M. kandleri cyclohydrolases are cytoplasmic
      enzymes with similar properties.
    supporting_text: The two cytoplasmic enzymes were found to have very similar
      molecular and catalytic properties.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract only. Orthologues; used for location.
- id: PMID:15752192
  title: Genetic analysis of mch mutants in two Methanosarcina species demonstrates
    multiple roles for the methanopterin-dependent C-1 oxidation/reduction pathway
    and differences in H(2) metabolism between closely related species.
  full_text_unavailable: true
  findings:
  - statement: An M. barkeri mch mutant cannot make methane from H2/CO2 or methanol.
    supporting_text: The resulting mutant does not grow in media using H(2)/CO(2),
      methanol, or acetate as carbon and energy sources
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract only. Orthologue genetics in a methylotrophic methanogen.
