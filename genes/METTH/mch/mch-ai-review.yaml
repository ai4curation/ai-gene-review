- description: Methenyltetrahydromethanopterin cyclohydrolase. Cyclises
    N5-formyl-H4MPT to 5,10-methenyl-H4MPT+ with loss of water, the third step of CO2
    reduction to methane, linking Ftr to the methenyl-H4MPT reductases Mtd and Hmd.
