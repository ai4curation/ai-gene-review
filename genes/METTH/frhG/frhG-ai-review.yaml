taxon:
  id: NCBITaxon:187420
  label: Methanothermobacter thermautotrophicus str. Delta H
description: >-
  FrhG is the gamma (small, about 26 kDa) subunit of the cytoplasmic coenzyme
  F420-reducing [NiFe]-hydrogenase (Frh, EC 1.12.98.1) of the hydrogenotrophic
  methanogen Methanothermobacter thermautotrophicus. Frh is a group 3
  [NiFe]-hydrogenase built from FrhA, FrhG and FrhB heterotrimers that assemble
  into a dodecameric shell. FrhG is the electron-relay subunit of each
  heterotrimer. It carries three [4Fe-4S] clusters that pass the electrons
  released by H2 oxidation at the [NiFe] site of FrhA to the [4Fe-4S] cluster and
  FAD of FrhB, where F420 is reduced. Its N-terminal domain is homologous to the
  small subunit of [NiFe]-hydrogenases and holds the proximal cluster, with an
  aspartate (Asp21 in this sequence) in place of one of the usual cysteine
  ligands. Its C-terminal ferredoxin-like domain holds the medial and distal
  clusters through two CxxCxxCxxxC motifs. In the structure of the orthologous
  M. marburgensis enzyme, two conserved cysteines of FrhG (Cys167 and Cys169 here)
  and those of a neighbouring FrhG appear to coordinate a metal ion, probably
  zinc, at the FrhG dimer interface. FrhG holds no nickel and no flavin. The
  complex regenerates the reduced F420 used in CO2-reducing methanogenesis.
