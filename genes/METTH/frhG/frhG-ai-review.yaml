- term:
    id: GO:0019386
    label: methanogenesis, from carbon dioxide
  evidence_type: IC
  original_reference_id: PMID:23483797
  qualifier: involved_in
  review:
    summary: Frh regenerates the F420H2 consumed by two steps of CO2-reducing methanogenesis.
    action: NEW
    reason: The Frh complex catalyses a step of the hydrogenotrophic pathway itself, the
      H2-dependent reduction of F420, whose product is the reductant for the
      methylene-H4MPT dehydrogenase and reductase steps. FrhG does part of the work of that
      step, the electron relay between the H2-splitting and F420-reducing sites, so it
      participates rather than being merely required. M. thermautotrophicus Delta H grows
      only by reducing CO2 with H2. The Hmd-Mtd cycle can substitute for Frh in M.
      maripaludis, but redundancy does not change that Frh performs the step. Not marked
      core; same treatment as genes/METTH/frhA.
    supported_by:
    - reference_id: PMID:23483797
      supporting_text: Four electrons are provided through the reduced form of the coenzyme
        F420, which is regenerated by Frh.
    - reference_id: PMID:18487331
      supporting_text: Their analysis demonstrates that either pathway supports growth on H2
        and CO2.
