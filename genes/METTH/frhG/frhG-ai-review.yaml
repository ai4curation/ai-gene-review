  review:
    summary: FrhG relays the electrons from the [NiFe] site of FrhA to FrhB through its
      three [4Fe-4S] clusters.
    action: NEW
    reason: This is the subunit's own molecular activity. In the structure of the
      orthologous M. marburgensis complex, the electron transfer chain of each heterotrimer
      runs from the [NiFe] site of FrhA through the proximal, medial and distal clusters of
      FrhG to the cluster and FAD of FrhB; FrhG carries no catalytic site and no substrate
      site. Two independent lines agree, the cofactor chain seen in two cryo-EM structures
      and the homology of the N-terminal domain to [NiFe]-hydrogenase small subunits, whose
      role is this relay. Comparator check in QuickGO, the E. coli hydrogenase-1 small
      subunit HyaA (P69739) carries GO:0009055 by IDA and IBA, and the hydrogenase-2 small
      subunit HybO (P69741) by IBA, so the term is the convention for [NiFe]-hydrogenase
      small subunits. FrhG performs the transfer itself, so enables is appropriate.
