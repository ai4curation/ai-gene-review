suggested_questions:
- question: Should the InterPro2GO mappings of IPR017681 (FrhG) to GO:0016151 nickel cation
    binding and GO:0050660 FAD binding be removed, and GO:0051536 refined to GO:0051539? The
    three Frh subunit entries (IPR017682, IPR017679, IPR017681) carry the same four terms,
    which is the cofactor set of the whole complex rather than of each subunit.
- question: Should UniProt add the proximal [4Fe-4S] cluster ligands to P19498? Only the
    two ferredoxin-domain clusters have binding features; the structure of the 98 percent
    identical M. marburgensis ortholog places the third cluster in the N-terminal domain,
    with Asp21 (Asp60 in the paper) as one ligand.
- question: Is the ion at the FrhG dimer interface (Cys167 and Cys169 of P19498 and their
    partners) zinc, and does it have a structural role in assembling the dodecamer?
suggested_experiments:
- experiment_type: Metal analysis and mutagenesis
  hypothesis: The FrhG dimer interface binds a structural zinc ion through Cys167 and
    Cys169 of each protomer, and the site is needed for assembly of the dodecameric Frh
    shell but not for electron transfer.
  description: Measure zinc in purified Frh by ICP-MS or X-ray fluorescence, and test
    Cys167Ser/Cys169Ser variants (in a genetically tractable methanogen or by heterologous
    expression of the operon) for zinc content, oligomeric state by size-exclusion or
    cryo-EM, and H2-dependent F420 reduction.
- experiment_type: Spectroscopy and mutagenesis
  hypothesis: Asp21 is a ligand of the proximal [4Fe-4S] cluster and tunes its midpoint
    potential for electron transfer from the [NiFe] site.
  description: Compare EPR and redox titrations of wild-type Frh with an Asp21Cys variant,
    and measure the effect on H2-dependent F420 reduction rates.
