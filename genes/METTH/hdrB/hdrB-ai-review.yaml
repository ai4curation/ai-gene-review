- term:
    id: GO:0051912
    label: CoB--CoM heterodisulfide reductase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR017678
  review:
    summary: InterPro2GO mapping from the HdrB family signature (IPR017678) to CoB--CoM
      heterodisulfide reductase activity.
    action: MODIFY
    reason: >-
      The claim that HdrB reduces CoM-S-S-CoB is sound: the disulfide is cleaved at its two
      noncubane [4Fe-4S] clusters. The term is wrong as written. GO:0051912 is defined with
      methanophenazine as the electron acceptor (EC 1.8.98.1, RHEA:18085), the membrane HdrDE
      enzyme of Methanosarcinales (archaea pattern 20). M. thermautotrophicus has no
      methanophenazine and no cytochromes; its cytoplasmic HdrABC takes electrons from H2 via
      MvhADG and couples heterodisulfide reduction to ferredoxin reduction by flavin-based
      bifurcation at HdrA (EC 1.8.98.5, RHEA:55748). GO has no term for that reaction, nor for
      HdrB's own half-reaction (an intra-complex step with HdrC as electron donor), so the
      replacement is the proposed term shared with the HdrA reviews. HdrB performs the
      disulfide chemistry but needs HdrA, HdrC and Mvh for the defined reaction, so the
      relation should be contributes_to.
    proposed_replacement_terms:
    - id: NTR
      label: H2:CoB-CoM heterodisulfide,ferredoxin reductase activity
    supported_by:
    - reference_id: PMID:28818947
      supporting_text: Soaking experiments showed that the heterodisulfide is clamped between the
        two noncubane [4Fe-4S] clusters and homolytically cleaved, forming coenzyme M and B bound to
        each iron.
    - reference_id: PMID:21262829
      supporting_text: It is reported here that the purified complex from Methanothermobacter
        marburgensis catalyzes the CoM-S-S-CoB-dependent reduction of ferredoxin with H 2 .
    - reference_id: PMID:21262829
      supporting_text: In Methanosarcina species Fd reduction with H 2 is coupled to CoM-S-S-CoB
        reduction with H 2 mainly via a chemiosmotic mechanism
    source_defects:
