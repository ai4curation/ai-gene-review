gene_symbol: hdrB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:187420
  label: Methanothermobacter thermautotrophicus str. Delta H
description: >-
  hdrB (MTH_1879) encodes subunit B of the cytoplasmic heterodisulfide reductase HdrABC of the
  hydrogenotrophic methanogen Methanothermobacter thermautotrophicus. The 302-residue protein
  consists of two cysteine-rich CCG domains and is the catalytic subunit for the disulfide: each
  CCG domain coordinates an unusual noncubane [4Fe-4S] cluster, and the CoM-S-S-CoB
  heterodisulfide is clamped between the two clusters and cleaved homolytically, releasing
  coenzyme M (CoM-SH) and coenzyme B (CoB-SH) one electron at a time. HdrB has no flavin and no
  ferredoxin-type cluster; its electrons come from H2 oxidised by the [NiFe]-hydrogenase MvhADG,
  passed through the bifurcating flavoprotein HdrA and the iron-sulfur subunit HdrC. Within the
  six-subunit MvhADG/HdrABC complex, this exergonic heterodisulfide reduction drives the
  endergonic reduction of ferredoxin by flavin-based electron bifurcation (EC 1.8.98.5), linking
  the last step of CO2 reduction to methane to the first. The Delta H protein has not been
  characterised directly; its function rests on the 95% identical HdrB of Methanothermobacter
  marburgensis, which conserves all four cluster-ligand cysteines of the C-terminal CCG domain.
