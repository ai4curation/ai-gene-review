core_functions:
- description: Catalytic heterodisulfide-reducing subunit of the cytoplasmic MvhADG/HdrABC complex.
    Its two CCG domains bind noncubane [4Fe-4S] clusters that clamp and homolytically cleave
    CoM-S-S-CoB to CoM-SH and CoB-SH, using electrons delivered from H2 through Mvh, HdrA and HdrC.
    HdrB contributes to the complex activity (EC 1.8.98.5, RHEA:55748), which has no GO term yet
    (see proposed_new_terms); GO also has no term for HdrB's half-reaction, so the subunit's own
    activity is recorded as cluster binding.
  molecular_function:
    id: GO:0051539
    label: 4 iron, 4 sulfur cluster binding
  directly_involved_in:
