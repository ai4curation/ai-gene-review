      binds this unusual [4Fe-4S] cluster.
proposed_new_terms:
- proposed_name: H2:CoB-CoM heterodisulfide,ferredoxin reductase activity
  proposed_definition: 'Catalysis of the reaction: 2 H2 + CoM-S-S-CoB + 2 oxidized ferredoxin [iron-sulfur]
    cluster = coenzyme M + coenzyme B + 2 reduced ferredoxin [iron-sulfur] cluster + 4 H+ (EC 1.8.98.5,
    RHEA:55748). The reaction couples the exergonic reduction of the heterodisulfide with the endergonic
    reduction of ferredoxin by flavin-based electron bifurcation, and is catalysed by the cytoplasmic
    HdrABC-MvhADG complex of hydrogenotrophic methanogens.'
  justification: GO:0051912 is defined only for the methanophenazine-dependent HdrDE reaction (EC 1.8.98.1),
    and GO:0045331 (H2:heterodisulfide) is obsolete. HdrB, the subunit that cleaves the disulfide, has no
    correct activity term in GO. Same proposal as in the METJA hdrA, METTH hdrA and METTH mvhA reviews.
  proposed_parent:
    id: GO:0016667
    label: oxidoreductase activity, acting on a sulfur group of donors
  supported_by:
  - reference_id: PMID:21262829
    supporting_text: It is reported here that the purified complex from Methanothermobacter
      marburgensis catalyzes the CoM-S-S-CoB-dependent reduction of ferredoxin with H 2 .
suggested_questions:
- question: Should GO:0051912 be generalized to the heterodisulfide reduction itself (any electron donor),
    with children for methanophenazine (EC 1.8.98.1), H2/ferredoxin bifurcating (EC 1.8.98.5) and formate
    (EC 1.8.98.6) reactions? The HdrB and HdrD catalytic subunits would then carry the parent, and the
    InterPro2GO mapping of IPR017678 could point to it.
- question: Does the native HdrB carry a zinc site in addition to its two noncubane [4Fe-4S] clusters, as
    suggested by X-ray absorption spectroscopy of the M. marburgensis enzyme?
suggested_experiments:
- hypothesis: Both CCG domains of Delta H HdrB are required for heterodisulfide reduction, with the
    N-terminal domain providing the second noncubane cluster rather than a zinc site.
  description: Express HdrB variants with cysteine-to-serine substitutions in the N-terminal CCG domain
    in the HdrABC-Mvh complex, and measure cluster content (EPR, Mossbauer), zinc content (ICP-MS) and
    CoM-S-S-CoB-dependent ferredoxin reduction with H2.
