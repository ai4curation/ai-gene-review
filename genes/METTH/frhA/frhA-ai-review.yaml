  review:
    summary: InterPro2GO mapping from the [NiFe]-hydrogenase large-subunit nickel-binding
      site signature (IPR018194) to ferredoxin hydrogenase activity.
    action: REMOVE
    reason: The term names the wrong electron acceptor. GO:0008901 is the reduction of
      ferredoxin by H2 (2 reduced ferredoxin + 2 H+ = 2 oxidized ferredoxin + H2). Frh is a
      group 3 [NiFe]-hydrogenase whose physiological acceptor is coenzyme F420, bound and
      reduced at the FAD of FrhB; the only other acceptor reported is the artificial dye
      methylviologen. No ferredoxin reduction has been reported for Frh. IPR018194 is the
      PROSITE nickel-binding motif shared by the large subunits of all [NiFe]-hydrogenase
      groups, whose acceptors include cytochromes, NAD(P), F420 and ferredoxin, so the
      motif carries no information about the acceptor. Mapping it to a single
      acceptor-specific activity is a scope over-reach. The correct activity is already
      captured by the GO:0050454 rows.
