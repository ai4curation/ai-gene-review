suggested_questions:
- question: Should UniProt add a C-terminal propeptide (residues 387-405) to P19496? In
    the M. marburgensis ortholog no density follows the C-terminal His386, consistent with
    cleavage by the FrhD maturation endopeptidase, and P19496 has His386 followed by 19
    residues; the entry currently shows CHAIN 2..405.
- question: Is there a coenzyme F420-reducing hydrogenase complex term in GO (none was
    found)? Group 3 [NiFe]-hydrogenase complexes such as FrhABG have no cellular component
    term, so subunit membership cannot be recorded.
- question: Should InterPro2GO mappings of subunit-specific family entries (IPR017682 for
    FrhA) be restricted to properties of that subunit, rather than cofactors of the whole
    complex (FAD and Fe-S clusters on FrhB and FrhG)?
suggested_experiments:
- experiment_type: Genetic deletion and enzyme assay
  hypothesis: In M. thermautotrophicus, as in M. maripaludis, the Hmd-Mtd cycle can replace
    Frh for F420 reduction during growth on H2 and CO2, and Frh becomes essential under
    nickel-replete but H2-limited conditions.
  description: Delete frhA (or the frhADGB operon) with the genetic system now available
    for Methanothermobacter, and measure growth, F420H2 levels and methane formation under
    H2-replete and H2-limited conditions, with and without nickel limitation.
- experiment_type: Mutagenesis
  hypothesis: Removal of the C-terminal 19 residues of FrhA by FrhD is required for nickel
    insertion and an active enzyme.
  description: Express frhA with and without frhD, or a frhA variant lacking the cleavage
    site, and test nickel content, C-terminal processing (mass spectrometry) and
    H2-dependent F420 reduction of the resulting complex.
