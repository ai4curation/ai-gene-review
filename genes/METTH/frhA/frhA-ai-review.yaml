gene_symbol: frhA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:187420
  label: Methanothermobacter thermautotrophicus str. Delta H
description: >-
  FrhA is the alpha (large, about 45 kDa) subunit of the cytoplasmic coenzyme
  F420-reducing [NiFe]-hydrogenase (Frh, EC 1.12.98.1) of the hydrogenotrophic
  methanogen Methanothermobacter thermautotrophicus. Frh is a group 3
  [NiFe]-hydrogenase built from FrhA, FrhG and FrhB heterotrimers that assemble
  into a 1.2 MDa hollow dodecameric shell, and it is one of the most abundant
  soluble proteins in the cell. FrhA carries the H2-activating [NiFe] active site,
  coordinated by four conserved cysteines (Cys63, Cys66, Cys380, Cys383), and a
  second conserved metal ion near its C-terminal histidine. The electrons from H2
  pass through three [4Fe-4S] clusters in FrhG and one in FrhB to the FAD of FrhB,
  where F420 is bound and reduced by hydride transfer. FrhA itself holds no Fe-S
  cluster and no flavin. The complex regenerates reduced F420 (F420H2), which
  supplies four of the eight electrons needed to reduce CO2 to methane. The frh
  genes form the operon frhADGB; FrhD is a homologue of the maturation
  endopeptidases that remove the C-terminal extension of [NiFe]-hydrogenase large
  subunits, and in the orthologous M. marburgensis enzyme the residues after the
  C-terminal histidine of FrhA are absent from the mature structure. In
  Methanococcus maripaludis, the Hmd-Mtd cycle can substitute for F420-reducing
  hydrogenases during growth on H2 and CO2.
