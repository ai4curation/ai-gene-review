  review:
    summary: InterPro2GO mapping from the FrhA family entry (IPR017682) to FAD binding.
    action: REMOVE
    reason: The FAD of Frh is bound by FrhB, not FrhA. The holoenzyme contains about one
      FAD per heterotrimer, and both cryo-EM structures of the orthologous M. marburgensis
