- term:
    id: GO:0050454
    label: coenzyme F420 hydrogenase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - InterPro:IPR017682
  - RHEA:23760
  - EC:1.12.98.1
  review:
    summary: Combined automated annotation (FrhA family IPR017682 and EC 1.12.98.1) of
      coenzyme F420 hydrogenase activity on the alpha subunit.
    action: MARK_AS_OVER_ANNOTATED
    reason: The activity is real and is the function of the enzyme this subunit belongs
      to, but the full reaction (H2 + F420 to F420H2) is a property of the FrhABG complex,
      not of FrhA alone. FrhA performs only the H2-activation half of the reaction at its
      [NiFe] site. The electrons are relayed by the Fe-S clusters of FrhG and FrhB, and the
      F420-binding site and the FAD that performs the hydride transfer are in FrhB. The
      subunits could not be separated with cofactors intact, and the smallest active unit
      is a multi-subunit complex. The relation should therefore be contributes_to rather
      than enables. The row is not removed, because the subunit takes part in the
      activity; its contribution is recorded in core_functions as contributes_to GO:0050454,
      supported experimentally by the purified Delta H complex (PMID:3663585). This follows the treatment of the
      carboxyltransferase subunit in genes/METS5/Msed_1375.
    supported_by:
    - reference_id: PMID:24569482
      supporting_text: Frh is a heterotrimeric enzyme composed of the 43 kDa subunit FrhA
        that contains a ...-center, the 26 kDa subunit FrhG with three [4Fe4S] clusters,
        and the 31 kDa iron–sulphur flavoprotein FrhB, which contains the F420-binding site
        and has one [4Fe4S] cluster and an FAD.
    - reference_id: PMID:3663585
      supporting_text: The minimal species transferring electrons from H2 to coenzyme F420
        appears to be an alpha beta delta (Mr 115K) complex.
    source_defects:
