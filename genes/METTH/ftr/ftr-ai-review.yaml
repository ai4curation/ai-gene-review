suggested_questions:
- question: Should InterPro2GO map the Ftr N-terminal (IPR022667) and C-terminal
    (IPR002770) domain entries to GO:0030270 instead of GO:0016740 transferase
    activity, given that both occur only in Ftr-family proteins?
- question: Is the residue corresponding to M. kandleri Glu245 conserved in the M.
    thermautotrophicus enzyme, and does the M. thermautotrophicus enzyme share the
    salt-dependent oligomerisation of the M. kandleri orthologue?
suggested_experiments:
- description: Site-directed mutagenesis of the conserved catalytic glutamate in
    recombinant M. thermautotrophicus Ftr, with kinetics in both directions, to
    confirm that the M. kandleri mechanism applies to the mesophilic-salt enzyme.
