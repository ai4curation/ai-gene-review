- id: PMID:2403564
  title: The formylmethanofuran:tetrahydromethanopterin formyltransferase from
    Methanobacterium thermoautotrophicum delta H. Nucleotide sequence and functional
    expression of the cloned gene.
  full_text_unavailable: true
  findings:
  - statement: The ftr gene of strain Delta H was cloned and sequenced and expresses
      a functional formyltransferase in E. coli; Ftr has no homology to other
      pterin-using proteins.
    supporting_text: The sequence of FTR does not appear to be homologous to any
      other sequenced proteins, including proteins which use pterin substrates.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract only. Strain Delta H, the organism under review; this is
      UniProt reference 1 for P21348.
- id: PMID:3097011
  title: 'The role of formylmethanofuran: tetrahydromethanopterin formyltransferase
    in methanogenesis from carbon dioxide.'
  full_text_unavailable: true
  findings:
  - statement: Purified M. thermautotrophicus Ftr is a tetramer that forms
      5-formyl-H4MPT; with Mch it reconstitutes methenyl-H4MPT formation and it is
      essential for CO2 reduction to methane.
    supporting_text: The enzyme is a tetramer of similar or identical subunits (Mr =
      41,000).
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract only. Donnelly and Wolfe 1986. The abstract names M.
      thermoautotrophicum without a strain.
- id: PMID:1483480
  title: Salt dependence, kinetic properties and catalytic mechanism of
    N-formylmethanofuran:tetrahydromethanopterin formyltransferase from the extreme
    thermophile Methanopyrus kandleri.
  full_text_unavailable: true
  findings:
  - statement: The M. kandleri orthologue is salt-dependent and follows a
      ternary-complex mechanism.
    supporting_text: The catalytic mechanism of formyltransferase was determined to
      be of the ternary-complex type.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract only. Orthologue (Breitung et al. 1992, Thauer lab).
- id: PMID:7601152
  title: Formylmethanofuran:tetrahydromethanopterin formyltransferase (Ftr) from the
    hyperthermophilic Methanopyrus kandleri. Cloning, sequencing and functional
    expression of the ftr gene and one-step purification of the enzyme overproduced
    in Escherichia coli.
  full_text_unavailable: true
  findings:
  - statement: Recombinant M. kandleri Ftr has the catalytic properties of the native
      enzyme.
    supporting_text: The purified enzyme showed essentially the same catalytic
      properties as that purified from M. kandleri cells.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Abstract only. Orthologue; compares with the M.
      thermoautotrophicum enzyme.
- id: PMID:9195883
  title: 'Formylmethanofuran: tetrahydromethanopterin formyltransferase from Methanopyrus
    kandleri - new insights into salt-dependence and thermostability.'
  full_text_unavailable: true
  findings:
  - statement: Crystal structure of the M. kandleri orthologue, a homotetramer of two
      dimers with the active site near the dimer interface.
    supporting_text: The approximate location of the active site was detected in a
      region close to the dimer interface.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract only. Ermler et al. 1997, the first Ftr structure.
- id: PMID:16466742
  title: 'The structure of formylmethanofuran: tetrahydromethanopterin formyltransferase
    in complex with its coenzymes.'
  full_text_unavailable: true
  findings:
  - statement: Coenzyme-complex structure of the M. kandleri orthologue; no
      prosthetic group, ternary-complex mechanism, catalytic Glu245.
    supporting_text: The enzyme, which is devoid of a prosthetic group, catalyzes the
      reversible formyl transfer between the two substrates coenzyme methanofuran
      and coenzyme tetrahydromethanopterin (H4MPT) in a ternary complex catalytic
      mechanism.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract only. Acharya et al. 2006, Thauer/Shima/Ermler labs.
- id: PMID:8481089
  title: 'Formylmethanofuran: tetrahydromethanopterin formyltransferase and N5,N10-methylenetetrahydromethanopterin
    dehydrogenase from the sulfate-reducing Archaeoglobus fulgidus: similarities with
    the enzymes from methanogenic Archaea.'
  full_text_unavailable: true
  findings:
  - statement: The non-methanogenic sulfate reducer A. fulgidus has an Ftr similar
      to the methanogen enzymes, so the family is not methanogen-specific.
    supporting_text: The sulfate-reducing Archaeoglobus fulgidus contains a number of
      enzymes previously thought to be unique for methanogenic Archaea.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Abstract only. Context for the family scope; does not affect the
      rows for this obligate methanogen.
