- term:
    id: GO:0030270
    label: formylmethanofuran-tetrahydromethanopterin N-formyltransferase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - InterPro:IPR014053
  - RHEA:18061
  - EC:2.3.1.101
  - UniRule:UR000009908
  review:
    summary: Combined automated annotation (InterPro IPR014053, UniRule, EC
      2.3.1.101, RHEA:18061) of the formyltransferase activity.
    action: ACCEPT
    reason: This is the core activity and the specific term. The enzyme purified from
      M. thermautotrophicus transfers the formyl group from formyl-MFR to H4MPT and
      the product is 5-formyl-H4MPT, exactly RHEA:18061; the cloned Delta H gene
      gives a functional enzyme. The M. kandleri orthologue structures show both
      coenzymes bound and the catalytic glutamate. The active form is a homo-oligomer
      of a single gene product, so enables is the right qualifier.
    supported_by:
    - reference_id: PMID:3097011
      supporting_text: The product of formyl transfer by the purified enzyme was shown
        by a number of criteria to be 5-formyl-H4MPT, as opposed to 10-formyl-H4MPT
        or 5,10-methenyl-H4MPT.
    - reference_id: PMID:2403564
      supporting_text: When this fragment was subcloned into the phagemid pTZ18R, a
        functional enzyme was synthesized under control of the lac promoter.
    - reference_id: PMID:16466742
      supporting_text: The key residue for substrate binding and catalysis is the
        strictly conserved Glu245.
    - reference_id: file:METTH/ftr/ftr-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: Catalyzes the reversible transfer of a formyl group from
        formylmethanofuran (formyl-MFR) to tetrahydromethanopterin (H(4)MPT) to
        produce 5-formyl tetrahydromethanopterin (5-formyl-H(4)MPT) and methanofuran
        (MFR).
