id: P21348
gene_symbol: ftr
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:187420
  label: Methanothermobacter thermautotrophicus str. Delta H
description: >-
  Ftr is the formylmethanofuran:tetrahydromethanopterin formyltransferase (EC
  2.3.1.101) of the hydrogenotrophic methanogen Methanothermobacter
  thermautotrophicus. It catalyses the reversible transfer of the formyl group from
  N-formylmethanofuran (formyl-MFR) to the N5 atom of tetrahydromethanopterin
  (H4MPT), releasing methanofuran and forming N5-formyl-H4MPT, the second step of
  CO2 reduction to methane; the product is then cyclised by the cyclohydrolase Mch.
  The enzyme purified from M. thermautotrophicus is a tetramer of similar or
  identical subunits, and the gene from strain Delta H expresses an active enzyme
  in Escherichia coli. Ftr has no prosthetic group and works by a ternary-complex
  mechanism. Crystal structures of the Methanopyrus kandleri orthologue show a
  homotetramer built from two dimers, with methanofuran bound in a cleft at the
  dimer interface and H4MPT in a shallow neighbouring cleft; a strictly conserved
  glutamate stabilises the tetrahedral oxyanion intermediate formed when N5 of
  H4MPT attacks the formyl carbon. Ftr is a soluble cytoplasmic enzyme.
