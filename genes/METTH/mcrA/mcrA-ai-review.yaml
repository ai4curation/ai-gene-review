suggested_questions:
- question: Do MCR I (mcrBDCGA) and MCR II (mrtBDGA) of M. thermautotrophicus differ
    in kinetic properties or substrate affinity in a way that explains their growth-phase
    switching, and is there a physiological role for the isoenzyme-specific post-translational
    modifications?
- question: Should GO have a coenzyme F430 binding term (a nickel tetrapyrrole cofactor)
    for MCR alpha subunits, rather than relying on generic nickel cation or metal
    ion binding mappings?
suggested_experiments:
- experiment_type: Genetic deletion and enzyme characterization
  hypothesis: MCR I and MCR II are functionally specialized for H2-limited versus
    H2-replete growth.
  description: Using the genetic system now available for Methanothermobacter, delete
    mcrA (or the mrt operon) and compare growth, methane formation and the kinetic
    properties of the remaining isoenzyme under H2-limited and H2-replete conditions.
