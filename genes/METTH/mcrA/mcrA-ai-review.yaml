  review:
    summary: InterPro2GO mapping from the MCR alpha-subunit family signatures. MCR
      catalyzes the terminal methane-forming step, so the subunit directly participates
      in methanogenesis.
    action: MODIFY
    reason: The claim is correct, and MCR is the catalytic enzyme of the final step.
      However, M. thermautotrophicus Delta H is an obligate hydrogenotroph that grows
      only on H2 plus CO2, so the methanogenic route MCR I serves in this organism
      is CO2 reduction. The more specific is_a child GO:0019386 methanogenesis, from
      carbon dioxide, is supported. The generic InterPro2GO term is appropriate as
      a family-wide mapping (MCR serves all methanogenic routes), but at gene level
      the specific route is known.
