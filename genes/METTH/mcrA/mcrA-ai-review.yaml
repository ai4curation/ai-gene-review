gene_symbol: mcrA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:187420
  label: Methanothermobacter thermautotrophicus str. Delta H
description: mcrA (MTH_1164) encodes the alpha subunit of methyl-coenzyme M reductase
  isoenzyme I (MCR I) of the hydrogenotrophic methanogen Methanothermobacter thermautotrophicus.
  MCR is a cytoplasmic alpha2beta2gamma2 heterohexamer that catalyzes the final, methane-forming
  step of methanogenesis, the reduction of methyl-coenzyme M with coenzyme B to methane
  and the CoM-S-S-CoB heterodisulfide (EC 2.8.4.1). Each holoenzyme contains two identical
  active sites, each holding one non-covalently bound nickel porphinoid coenzyme F430
  buried at the interface of the alpha, alpha', beta and gamma subunits; the alpha
  subunit supplies the axial glutamine ligand to the F430 nickel, most of the coenzyme
  M and coenzyme B contacts, and a set of conserved post-translationally modified active-site
  residues (thioglycine, methylated His, Arg, Gln and Cys, and didehydroaspartate). Catalysis
  requires the Ni(I) state of F430 and proceeds through a methyl radical and Ni(II)-thiolate
  intermediate. mcrA lies in the mcrBDCGA operon, upstream of the mtr operon; it is
  transcribed mainly in late growth phase, whereas the paralogous isoenzyme MCR II (mrtBDGA)
  predominates early in batch culture.
