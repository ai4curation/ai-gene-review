core_functions:
- description: Catalytic, F430-bearing alpha subunit of methyl-coenzyme M reductase
    I, catalyzing the reduction of methyl-coenzyme M by coenzyme B to methane and
    CoM-S-S-CoB, the terminal step of hydrogenotrophic (CO2-reducing) methanogenesis.
    The two active sites of the alpha2beta2gamma2 holoenzyme are formed at the alpha,
    alpha', beta, gamma interface, with alpha providing the F430 axial ligand and
    most substrate contacts.
