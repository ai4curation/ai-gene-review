      supporting_text: Cell extracts of M. marburgensis catalyzed the reduction of Fd from C.
        pasteurianum with H 2 at significant rates only in the presence of CoM-S-S-CoB
    - reference_id: PMID:12856108
      supporting_text: the only function of Mvh is to provide reducing equivalents for
        heterodisulfide reductase and that the MvhD subunit is an electron transfer protein that
        forms the contact site to heterodisulfide reductase
    - reference_id: PMID:21262829
      supporting_text: It is reported here that the purified complex from Methanothermobacter
        marburgensis catalyzes the CoM-S-S-CoB-dependent reduction of ferredoxin with H 2 .
