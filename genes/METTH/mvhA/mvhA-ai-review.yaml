proposed_new_terms:
- proposed_name: H2:CoB-CoM heterodisulfide,ferredoxin reductase activity
  proposed_definition: 'Catalysis of the reaction: 2 H2 + CoM-S-S-CoB + 2 oxidized ferredoxin [iron-sulfur]
    cluster = coenzyme M + coenzyme B + 2 reduced ferredoxin [iron-sulfur] cluster + 4 H+ (EC 1.8.98.5,
    RHEA:55748). The reaction couples the exergonic reduction of the heterodisulfide with the endergonic
    reduction of ferredoxin by flavin-based electron bifurcation, and is catalysed by the cytoplasmic
    HdrABC-MvhADG complex of hydrogenotrophic methanogens.'
  justification: The Mvh hydrogenase subunits supply the H2-derived electrons for this reaction; neither
    GO:0008901 (uncoupled ferredoxin hydrogenase) nor GO:0051912 (methanophenazine-dependent) describes
    it. Same proposal as in the METJA hdrA, METTH hdrA and METTH hdrB reviews.
  proposed_parent:
    id: GO:0016667
    label: oxidoreductase activity, acting on a sulfur group of donors
  supported_by:
  - reference_id: PMID:21262829
    supporting_text: It is reported here that the purified complex from Methanothermobacter
      marburgensis catalyzes the CoM-S-S-CoB-dependent reduction of ferredoxin with H 2 .
suggested_questions:
- question: Should the InterPro2GO mapping of IPR018194 ([NiFe]-hydrogenase large-subunit nickel-binding
    site) to GO:0008901 ferredoxin hydrogenase activity be replaced by an acceptor-neutral term such as
    GO:0033748 hydrogenase (acceptor) activity? The motif is shared by hydrogenases that reduce F420,
    NAD(P), cytochromes, quinones or, as here, feed a bifurcating partner.
- question: Should the proposed EC 1.8.98.5 term have a parent relation to the H2-oxidising activity, so
    that the hydrogenase subunits of the complex can be grouped with other hydrogenases?
suggested_experiments:
- hypothesis: The Delta H Mvh hydrogenase does not reduce ferredoxin with H2 in the absence of HdrABC
    and CoM-S-S-CoB.
  description: Purify free MvhADG and the MvhADG/HdrABC complex from strain Delta H and compare
    H2-dependent reduction of ferredoxin, methyl viologen and (for the complex) CoM-S-S-CoB, with and
    without heterodisulfide.
