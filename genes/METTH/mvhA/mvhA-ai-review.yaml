  - InterPro:IPR018194
  review:
    summary: InterPro2GO mapping from the [NiFe]-hydrogenase large-subunit family and
      nickel-binding site signatures.
    action: ACCEPT
    reason: MvhA is the subunit that carries the nickel of the [NiFe] active site. The nickel of
      the Marburg Mvh/Hdr complex is in the 51/41/17-kDa hydrogenase subcomplex, nickel limitation
      lowers the amount of Mvh about 70-fold, and the four nickel-ligand cysteines are present in
      Q50783 (UniProt Ni(2+) binding features). Nickel binding is central to H2 activation by this
      subunit. GO has no term for the [NiFe] dinuclear cofactor, so nickel cation binding is as
      precise as current terms allow (same decision as METTH/frhA).
    supported_by:
    - reference_id: PMID:8119281
      supporting_text: The first subcomplex was was composed of the 51-, 41- and 17-kDa subunits; 1
        mol trimer contained 0.7 mol nickel, 10 mol non-heme iron and 9 mol acid-labile sulfur and
        exhibited F420-non-reducing hydrogenase activity.
    - reference_id: PMID:12856108
      supporting_text: In cells of Mt. marburgensis from Ni(2+)-limited chemostat cultures the
        amount of Mvh decreased about 70-fold.
