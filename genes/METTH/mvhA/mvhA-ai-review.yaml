id: Q50783
gene_symbol: mvhA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:187420
  label: Methanothermobacter thermautotrophicus str. Delta H
description: >-
  mvhA (MTH_1134) encodes the alpha (large) subunit of the F420-non-reducing (methyl
  viologen-reducing) [NiFe]-hydrogenase Mvh of the hydrogenotrophic methanogen
  Methanothermobacter thermautotrophicus. It is encoded in the mvhDGAB operon with the small
  iron-sulfur subunit MvhG, the [2Fe-2S] subunit MvhD and the polyferredoxin MvhB. MvhA carries the
  nickel-iron active site, coordinated by four conserved cysteines (Cys61, Cys64, Cys442, Cys445),
  where H2 is split. The electrons pass through the [4Fe-4S] clusters of MvhG and the [2Fe-2S]
  cluster of MvhD to the flavin of the heterodisulfide reductase subunit HdrA, with which Mvh forms
  the cytoplasmic six-subunit MvhADG/HdrABC complex. There they are bifurcated to reduce ferredoxin
  and the CoM-S-S-CoB heterodisulfide together (EC 1.8.98.5), so Mvh supplies the reducing
  equivalents for both the last and, through ferredoxin, the first step of CO2 reduction to methane.
  The isolated hydrogenase reduces only artificial dyes such as methyl viologen. The Delta H
  protein has not been purified; its function rests on the 97.5% identical MvhA of
  Methanothermobacter marburgensis.
existing_annotations:
- term:
    id: GO:0008901
    label: ferredoxin hydrogenase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR018194
  review:
    summary: InterPro2GO mapping from the [NiFe]-hydrogenase large-subunit nickel-binding site
      signature (IPR018194) to ferredoxin hydrogenase activity.
    action: MODIFY
    reason: >-
      GO:0008901 is the direct, uncoupled reaction 2 reduced ferredoxin + 2 H+ = 2 oxidized
      ferredoxin + H2. Mvh does not catalyse it: cell extracts and the purified Mvh/Hdr complex
      reduce ferredoxin with H2 at significant rates only when CoM-S-S-CoB is present, because
      the endergonic ferredoxin reduction is driven by flavin-based bifurcation at HdrA. MvhA's
      electrons go through MvhG and MvhD to HdrA, not to ferredoxin directly, and the only
      function of Mvh is to supply Hdr. The essence of the row, that H2 electrons from this
      hydrogenase end on ferredoxin, is half right, so the row is modified to the coupled complex
      reaction (the proposed term shared with the HdrA and HdrB reviews), with contributes_to.
      The mapping itself is archaea pattern 19: IPR018194 is the nickel motif of every
      [NiFe]-hydrogenase large subunit and says nothing about the acceptor (the same mapping was
      removed from METTH/frhA, whose acceptor is F420).
    proposed_replacement_terms:
    - id: NTR
      label: H2:CoB-CoM heterodisulfide,ferredoxin reductase activity
    supported_by:
