    - defect_type: WRONG_TERM
      resource: INTERPRO
      record: InterPro:IPR018194
      requested_change: CHECK
      asserted_value: GO:0008901
      cause: SCOPE_OVER_REACH
      confidence: PROBABLE
      explanation: IPR018194 (nickel-dependent hydrogenase large subunit, nickel-binding site)
        matches the large subunits of all [NiFe]-hydrogenase groups. On MvhA (Q50783), the
        F420-non-reducing hydrogenase of the MvhADG/HdrABC complex, ferredoxin is reduced only in
        the heterodisulfide-coupled bifurcating reaction (EC 1.8.98.5), not by the uncoupled
        GO:0008901 reaction; on FrhA (P19496) the acceptor is F420. The mapping should be dropped
