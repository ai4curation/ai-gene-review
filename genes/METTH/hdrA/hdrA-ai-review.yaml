  review:
    summary: ARBA machine-learning assignment of the generic oxidoreductase class to the HdrA
      iron-sulfur flavoprotein.
    action: MODIFY
    reason: True but uninformative. The redox reaction HdrA takes part in is known from the 97%
      identical M. marburgensis ortholog. It is the H2-dependent reduction of CoM-S-S-CoB and
      ferredoxin by the MvhADG/HdrABC complex (EC 1.8.98.5, RHEA:55748), a descendant of
      oxidoreductase activity. GO has no term for it, so the replacement is the proposed term
      (the same proposed_name as in the M. jannaschii hdrA review). HdrA contributes to this
      complex activity, with contributes_to; it does not catalyse it alone (archaea pattern 16).
      The subunit's own role is recorded as the NEW electron transfer activity row.
