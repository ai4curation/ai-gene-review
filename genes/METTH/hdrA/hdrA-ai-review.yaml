        formylmethanofuran and the last step is the exergonic reduction of the heterodisulfide
        CoM-S-S-CoB with H 2 to coenzyme M (CoM-SH) and coenzyme B (CoB-SH).
    - reference_id: PMID:21262829
      supporting_text: We recently proposed that in hydrogenotrophic methanogens the two reactions
        are energetically coupled via the cytoplasmic MvhADG/HdrABC complex.
