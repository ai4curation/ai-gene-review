id: O27434
gene_symbol: hdrA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:187420
  label: Methanothermobacter thermautotrophicus str. Delta H
description: >-
  hdrA (MTH_1381) encodes subunit A of the cytoplasmic heterodisulfide reductase HdrABC of the
  hydrogenotrophic methanogen Methanothermobacter thermautotrophicus. It is a 659-residue
  iron-sulfur flavoprotein with an FAD-binding Rossmann region and four ferredoxin-type [4Fe-4S]
  cluster domains. HdrABC forms a tight six-subunit complex with the F420-non-reducing
  [NiFe]-hydrogenase MvhADG. The complex couples the exergonic reduction of the CoM-S-S-CoB
  heterodisulfide, the last product of methanogenesis, to the endergonic reduction of ferredoxin,
  which drives the first step of CO2 reduction (EC 1.8.98.5). Electrons from H2 reach the FAD of
  HdrA through the [2Fe-2S] subunit MvhD, and HdrA splits each electron pair by flavin-based
  electron bifurcation: one branch reduces ferredoxin, the other passes through HdrC to the
  noncubane [4Fe-4S] clusters of HdrB, where the heterodisulfide is cleaved. HdrA is therefore
  the electron-bifurcating and electron-transferring subunit, not the disulfide-reducing one. The
  Delta H protein has not been purified; its function rests on the 97% identical HdrA of
  Methanothermobacter marburgensis, whose complex has been purified and assayed.
