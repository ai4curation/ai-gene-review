  review:
    summary: HdrA regenerates CoM-SH and CoB-SH in the last step of CO2 reduction to methane and
      supplies reduced ferredoxin for the first step.
    action: NEW
    reason: HdrA does part of the work of the pathway. It bifurcates the electrons that reduce
      the heterodisulfide and the ferredoxin, so it is a participant, not a substrate. M.
      thermautotrophicus Delta H grows only by reducing CO2 with H2, and GO:0019386 is the most
      precise process term (as in METTH/frhA and METJA/hdrA).
    supported_by:
