id: O27224
gene_symbol: mtrH
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:187420
  label: Methanothermobacter thermautotrophicus str. Delta H
description: >-
  mtrH (MTH_1156) encodes subunit H of the N5-methyltetrahydromethanopterin:coenzyme M
  methyltransferase (Mtr) of the hydrogenotrophic methanogen Methanothermobacter thermautotrophicus.
  Mtr is an eight-subunit, membrane-bound complex (MtrA-H) that transfers the methyl group of
  methyl-tetrahydromethanopterin (methyl-H4MPT) to coenzyme M and couples this exergonic reaction to
  the export of sodium ions, the energy-conserving step of methanogenesis from CO2. MtrH is the only
  soluble subunit. It is attached to the cytoplasmic face of the membrane-bound MtrABCDEFG core and is
  easily lost during purification. MtrH catalyses the first half-reaction, the transfer of the methyl
  group from methyl-H4MPT to the cob(I)amide prosthetic group of MtrA, forming methyl-cob(III)amide.
  The second, Na+-dependent half-reaction, methyl transfer from MtrA to coenzyme M, takes place at the
  MtrCDE membrane module. MtrH has a TIM-barrel fold of the dihydropteroate synthase-like superfamily
  and is related to the methyltetrahydrofolate:corrinoid methyltransferases MetH and AcsE; structural
  models place the pterin of methyl-H4MPT at the bottom of the barrel, with the MtrA corrinoid inserted
  into its opening.
