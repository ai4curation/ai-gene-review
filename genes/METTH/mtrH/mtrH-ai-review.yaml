- term:
    id: GO:0030269
    label: tetrahydromethanopterin S-methyltransferase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - RHEA:53492
  - EC:7.2.1.4
  - UniRule:UR000038407
  review:
    summary: Combined automated annotation (Rhea, EC 7.2.1.4 and HAMAP MF_01501) of the complete Mtr
      reaction onto subunit H, with the qualifier enables.
    action: MARK_AS_OVER_ANNOTATED
    reason: GO:0030269 (RHEA:53492) is the whole Na+-coupled reaction of the eight-subunit complex,
      methyl-H4MPT + CoM + 2 Na+(in) = H4MPT + methyl-CoM + 2 Na+(out), and is also a child of sodium ion
      transmembrane transporter activity. MtrH catalyses only the first half-reaction, the methylation of
      the MtrA cob(I)amide by methyl-H4MPT; the second, Na+-dependent methyl transfer to coenzyme M needs
      MtrA and the MtrCDE membrane module, which holds the coenzyme M and Na+ sites. MtrH does a real
      catalytic step of the reaction, so the row is not removed, but enables overstates its role. Its
      contribution is recorded in core_functions as contributes_to GO:0030269, and its own activity as
      GO:0042086. Pattern 16 of the ARCHAEA catalogue.
    supported_by:
    - reference_id: PMID:10338124
      supporting_text: We report here that the 34 kDa subunit MtrH catalyzes the methylation reaction.
    - reference_id: PMID:11248186
      supporting_text: demethylation being sodium
        ion-dependent
    - reference_id: PMID:38530900
      supporting_text: Putative coenzyme M and Na+ were identified inside or in a side-pocket of a
        cytoplasmic cavity formed within MtrCDE.
- term:
    id: GO:0035725
    label: sodium ion transmembrane transport
  evidence_type: IEA
  original_reference_id: GO_REF:0000108
  qualifier: involved_in
  supporting_entities:
  - GO:0030269
  review:
    summary: Inter-ontology inference from the GO:0030269 row, whose term is a child of sodium ion
      transmembrane transporter activity.
    action: MARK_AS_OVER_ANNOTATED
    reason: The row exists only because the whole-complex activity was put on this subunit. MtrH is a
      soluble, peripheral subunit with no membrane anchor, the Na+ site and path are in MtrCDE, and the
      half-reaction MtrH catalyses (methylation of MtrA) is not the Na+-dependent one; the energy that
      drives Na+ export is released in the demethylation of MtrA by coenzyme M. MtrH is needed for the
      catalytic cycle that powers the pump, but necessity is not participation in the transport, so the
      claim is an over-annotation. It is not removed because MtrH is a genuine subunit of the Na+-pumping
      complex and AlphaFold2 models place it in contact with MtrB at the stalk.
    supported_by:
    - reference_id: PMID:27324530
      supporting_text: MtrH as a peripheral protein without a membrane anchor
    - reference_id: PMID:11248186
      supporting_text: Subunit MtrA harbors a cob(I)amide prosthetic group which is methylated
        and demethylated in the catalytic cycle, demethylation being sodium
        ion-dependent.
- term:
    id: GO:0044677
    label: methyl-tetrahydromethanopterin:coenzyme M methyltransferase complex
  evidence_type: ISS
  original_reference_id: PMID:7737157
  qualifier: part_of
  review:
    summary: GOA has no complex annotation for MtrH. The near-identical strain Marburg MtrH (34 kDa) is
      one of the eight subunits of the purified complex, encoded last in the mtrEDCBAFGH operon.
    action: NEW
    reason: GO:0044677 is the eight-polypeptide MtrA-H complex. The 34 kDa MtrH was identified as a
      subunit of the purified strain Marburg complex at the protein, DNA and RNA levels, and it is
      attached to the MtrABCDEFG core on the cytoplasmic side. O27224 is 97% identical to that MtrH and
      encoded in the Delta H mtr operon, so the annotation is by sequence similarity (ISS).
    supported_by:
    - reference_id: PMID:7737157
      supporting_text: SDS/PAGE of the purified complex revealed the
        presence of eight different polypeptides of apparent molecular masses of 34
        (MtrH)
    - reference_id: PMID:38530900
      supporting_text: Soluble MtrH, hosting the binding site for methyl-H4MPT is cytoplasmically attached
        to the residual MtrABCDEFG complex and easily lost during preparation
    - reference_id: file:METTH/mtrH/mtrH-bioinformatics/RESULTS.md
      supporting_text: O27224 MtrH Delta H vs P80187 MtrH M. marburgensis (strain Marburg) | 301/310 = 97.1%
- term:
    id: GO:0031234
    label: extrinsic component of cytoplasmic side of plasma membrane
  evidence_type: IC
  original_reference_id: PMID:38530900
  qualifier: located_in
  review:
    summary: GOA has no location for MtrH. It is a soluble subunit loosely attached to the cytoplasmic
      face of the membrane-bound Mtr core.
    action: NEW
    reason: Three independent lines agree. MtrH has no transmembrane segment (none predicted in O27224,
      and it is described as a peripheral protein without a membrane anchor); it is attached to the
      MtrABCDEFG core on the cytoplasmic side and is selectively removed by the membrane-perturbing agent
      dimethyl maleic anhydride; and its substrate methyl-H4MPT and partner domain (the MtrA cobamide
      domain) are cytoplasmic. GO:0031234 is defined for gene products loosely bound to the cytoplasmic
      surface of the plasma membrane and not integrated into it. Curator inference from the ortholog
      data.
    supported_by:
    - reference_id: PMID:27342374
      supporting_text: selective removal of the only soluble subunit MtrH with the membrane perturbing
        agent dimethyl maleic anhydride
    - reference_id: PMID:38530900
      supporting_text: Soluble MtrH, hosting the binding site for methyl-H4MPT is cytoplasmically attached
        to the residual MtrABCDEFG complex
    - reference_id: PMID:27324530
      supporting_text: MtrH as a peripheral protein without a membrane anchor
