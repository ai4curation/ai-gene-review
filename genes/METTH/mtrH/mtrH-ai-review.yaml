core_functions:
- description: Catalyses the first half-reaction of Mtr, transfer of the methyl group from
    methyl-H4MPT to the cob(I)amide prosthetic group of MtrA, forming methyl-cob(III)amide-MtrA and
    H4MPT. A specific term for this corrinoid-acceptor reaction is proposed under proposed_new_terms.
  molecular_function:
    id: GO:0042086
    label: 5-methyl-5,6,7,8-tetrahydromethanopterin-dependent methyltransferase activity
  directly_involved_in:
  - id: GO:0019386
    label: methanogenesis, from carbon dioxide
  in_complex:
    id: GO:0044677
    label: methyl-tetrahydromethanopterin:coenzyme M methyltransferase complex
  supported_by:
  - reference_id: PMID:10338124
    supporting_text: MtrH was purified and shown to exhibit
      methyltetrahydromethanopterin:cob(I)alamin methyltransferase activity.
- description: As the methyl-H4MPT-demethylating subunit, MtrH contributes to the overall
    Na+-translocating methyl transfer from methyl-H4MPT to coenzyme M (RHEA:53492, EC 7.2.1.4) of the
    MtrA-H complex.
  contributes_to_molecular_function:
    id: GO:0030269
    label: tetrahydromethanopterin S-methyltransferase activity
  in_complex:
    id: GO:0044677
    label: methyl-tetrahydromethanopterin:coenzyme M methyltransferase complex
  supported_by:
  - reference_id: PMID:10338124
    supporting_text: We report here that the 34 kDa subunit MtrH catalyzes the methylation reaction.
proposed_new_terms:
- proposed_name: methyltetrahydromethanopterin:corrinoid protein methyltransferase activity
  proposed_definition: >-
    Catalysis of the reaction: 5-methyl-5,6,7,8-tetrahydromethanopterin + a [Co(I) corrinoid protein]
    = 5,6,7,8-tetrahydromethanopterin + a [methyl-Co(III) corrinoid protein]. This is the first
    half-reaction of tetrahydromethanopterin S-methyltransferase (EC 7.2.1.4), catalysed by subunit
    MtrH with the cobamide of subunit MtrA as methyl acceptor.
  justification: >-
    GO has specific terms for the analogous methyltetrahydrofolate-dependent methylation of a corrinoid
    protein (GO:0102036) and for the second half-reactions of several methanogenic corrinoid
    methyltransferases (GO:1990088, GO:0043833), but not for the MtrH half-reaction, so the catalytic
    subunit of Mtr can be given only the donor-level parent GO:0042086 or the whole-complex
    Na+-translocating activity GO:0030269. The reaction is also absent from Rhea. The term would let
    MtrH (and MtxH-type homologues) carry their own activity and keep GO:0030269 as a contributes_to
    annotation for the complex subunits.
  proposed_parent:
    id: GO:0042086
    label: 5-methyl-5,6,7,8-tetrahydromethanopterin-dependent methyltransferase activity
  supported_by:
  - reference_id: PMID:10338124
    supporting_text: MtrH was purified and shown to exhibit
      methyltetrahydromethanopterin:cob(I)alamin methyltransferase activity.
suggested_questions:
- question: Should GO add a methyltetrahydromethanopterin:corrinoid protein methyltransferase activity
    term (child of GO:0042086) and Rhea the corresponding half-reaction, so that MtrH need not carry the
    whole Na+-translocating GO:0030269 activity?
- question: Should HAMAP MF_01501 (MtrH) assign GO:0030269 with contributes_to rather than enables, and
    should the inter-ontology GO:0035725 inference be suppressed for this soluble subunit?
suggested_experiments:
- hypothesis: Conserved Asp102, Asn128, Asp195 and Asn229 of MtrH bind the pterin of methyl-H4MPT as in
    the AlphaFold2-based model.
  description: Express Delta H MtrH, solve its structure with methyl-H4MPT or H4MPT, and measure
    methyl-H4MPT:cob(I)alamin methyltransferase activity of alanine variants of these residues.
- hypothesis: MtrH binds the Mtr core through the N-terminal segment of MtrB.
  description: Test co-purification or crosslinking of MtrH with wild-type and N-terminally truncated
    MtrB in the reconstituted or genetically modified complex.
