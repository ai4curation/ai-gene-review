proposed_new_terms:
- proposed_name: iron-guanylylpyridinol cofactor binding
  proposed_definition: Binding to the iron-guanylylpyridinol (FeGP) cofactor, a
    mononuclear low-spin Fe(II) complex ligated by two carbon monoxide molecules and
    the nitrogen of a 2-pyridinol that is linked through a phosphodiester to
    guanosine, which is the active-site cofactor of [Fe]-hydrogenase (Hmd).
  justification: Every Hmd binds the FeGP cofactor, which is required for activity
    and is the defining feature of the [Fe]-hydrogenase class. GO already has
    GO:0160300 iron-guanylylpyridinol cofactor biosynthetic process for the HcgA-G
    pathway but no term for binding the cofactor, and GO:0048037 cofactor binding is
    obsolete. Without such a term, keyword or domain mappings could only fall back to
    iron ion binding, the cofactor-metal-as-free-metal error seen for cobamide and
    F430 enzymes.
  proposed_parent:
    id: GO:0036094
    label: small molecule binding
  supported_by:
  - reference_id: PMID:16540118
    supporting_text: is a novel type of hydrogenase that tightly binds an
      iron-containing cofactor
  - reference_id: PMID:14686932
    supporting_text: When purified in the dark, Hmd consistently contained per monomer
      about one Fe, which was tightly bound to the cofactor.
suggested_questions:
- question: Should GO add an iron-guanylylpyridinol (FeGP) cofactor binding term, so
    that [Fe]-hydrogenases can record their cofactor without falling back to iron ion
    binding?
- question: PANTHER classifies the Hmd proteins (43 of 50 IPR010062 entries) in
    PTHR11645:SF0, a pyrroline-5-carboxylate reductase subfamily, and PAINT root node
    PTN000182176 already gives M. jannaschii Hmd (Q58194) P5C reductase activity and
    L-proline biosynthesis by IBA. Should Hmd be split into its own family or
    subfamily, or the node pruned (IRD), before the error reaches other Hmd entries?
suggested_experiments:
- description: Purify Hmd from M. thermautotrophicus Delta H (or express it with the
    Hcg cofactor-biosynthesis genes) and measure methenyl-H4MPT+ reduction with H2, to
    give the strain's own protein direct evidence rather than transfer from
    M. marburgensis.
  experiment_type: enzyme assay
