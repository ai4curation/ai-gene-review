id: O27211
gene_symbol: hmd
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:187420
  label: Methanothermobacter thermautotrophicus str. Delta H
description: >-
  Hmd is the H2-forming N5,N10-methylenetetrahydromethanopterin dehydrogenase
  ([Fe]-hydrogenase, 5,10-methenyltetrahydromethanopterin hydrogenase, EC 1.12.98.2)
  of the hydrogenotrophic methanogen Methanothermobacter thermautotrophicus. It
  catalyses the reversible reduction of 5,10-methenyltetrahydromethanopterin
  (methenyl-H4MPT+) with H2 to 5,10-methylene-H4MPT and a proton, the fourth step
  of CO2 reduction to methane; the F420-dependent Mtd catalyses the same step with
  reduced coenzyme F420. Hmd is a homodimeric enzyme without iron-sulfur clusters
  or nickel. Each subunit binds the iron-guanylylpyridinol (FeGP) cofactor, a
  light-sensitive organometallic cofactor in which a single low-spin iron is
  ligated by a cysteine thiolate, two carbon monoxide molecules and the nitrogen of
  a 2-pyridinol linked through a phosphodiester to guanosine; the Rossmann-like
  N-terminal domain holds the GMP moiety. The enzyme activates H2 heterolytically
  and transfers a hydride to the methenyl carbon. The gene is transcribed mainly
  when H2 is plentiful, and Hmd activity rises when nickel is limiting; together
  with Mtd it can then reduce F420 with H2 (the Hmd-Mtd cycle) in place of the
  nickel-dependent F420-reducing hydrogenase. Hmd is a soluble cytoplasmic enzyme.
  The protein of strain Delta H has not itself been purified; it is 97.7% identical
  to the characterised enzyme of the closely related M. marburgensis.
