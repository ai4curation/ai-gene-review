- id: PMID:1521540
  title: H2-forming methylenetetrahydromethanopterin dehydrogenase, a novel type of
    hydrogenase without iron-sulfur clusters in methanogenic archaea.
  full_text_unavailable: true
  findings:
  - statement: The purified M. thermoautotrophicum enzyme is a single 43 kDa
      polypeptide that reversibly dehydrogenates methylene-H4MPT to methenyl-H4MPT+
      and H2.
    supporting_text: It catalyzes the reversible dehydrogenation of
      methylenetetrahydromethanopterin (CH2 = H4MPT) to methenyltetrahydromethanopterin
      (CH identical to H4MPT+) and H2
  - statement: No iron-sulfur clusters, nickel or flavins were found; the iron
      cofactor was recognised only later (PMID:14686932).
    supporting_text: did not contain iron-sulfur clusters, nickel, or flavins
    finding_review:
      finding_status: OVERTURNED
      superseded_by:
      - PMID:14686932
      supported_by:
      - reference_id: PMID:14686932
        supporting_text: When purified in the dark, Hmd consistently contained per
          monomer about one Fe, which was tightly bound to the cofactor.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract only. Zirngibl et al. 1992, Thauer lab; the enzyme is from
      strain Marburg (now M. marburgensis), the source of GOA's EXP row on P32440.
      The absence of iron-sulfur clusters and nickel stands; the implied absence of
      metal was later corrected (functional FeGP iron).
