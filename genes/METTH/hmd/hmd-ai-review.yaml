core_functions:
- description: H2-forming methylene-H4MPT dehydrogenase ([Fe]-hydrogenase). Using its
    iron-guanylylpyridinol cofactor, it splits H2 and reduces methenyl-H4MPT+ to
    methylene-H4MPT in the fourth step of CO2 reduction to methane, and with Mtd it
    can reduce F420 with H2 when the nickel-dependent F420-reducing hydrogenase is
    limiting.
