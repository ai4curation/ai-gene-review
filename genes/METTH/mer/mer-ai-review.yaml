proposed_ontology_changes:
- change_type: NODE_RENAME
  ontology: GO
  about_node:
    id: GO:0018537
    label: coenzyme F420-dependent N5,N10-methenyltetrahydromethanopterin reductase
      activity
  old_value: coenzyme F420-dependent N5,N10-methenyltetrahydromethanopterin reductase
    activity
  new_value: coenzyme F420-dependent N5,N10-methylenetetrahydromethanopterin reductase
    activity
  change_dsl: rename GO:0018537 from 'coenzyme F420-dependent N5,N10-methenyltetrahydromethanopterin
    reductase activity' to 'coenzyme F420-dependent N5,N10-methylenetetrahydromethanopterin
    reductase activity'
  justification: The label names the wrong substrate. The definition of GO:0018537
    is 5-methyltetrahydromethanopterin + coenzyme F420 + H+ =
    5,10-methylenetetrahydromethanopterin + reduced coenzyme F420, the reaction of
    methylene-H4MPT reductase (EC 1.5.98.2, Mer), whose substrate is
    methylene-H4MPT. Methenyl-H4MPT is the substrate of the step before, catalysed by
    Mtd (GO:0030268) and Hmd (GO:0047068), so the current label invites confusion
    between steps 4 and 5 of methanogenesis. The definition and its mappings
    (EC 1.5.98.2, RHEA:21144) are correct; only the label needs changing, with the
    old label kept as a synonym.
  origin: SELF_PROPOSED
  confidence: CONFIRMED
  request_status: NOT_FILED
  affected_annotations:
