suggested_questions:
- question: Should the InterPro2GO mapping of the luciferase-like domain (IPR011251)
    and superfamily (IPR036661) to GO:0016705, an O2-dependent activity, be moved to
    the monooxygenase family entries or restricted so that it no longer reaches the
    flavin-free, O2-independent coenzyme F420-dependent members (Mer, Fgd, Adf)?
- question: Should GO:0018537 be relabelled to say methylene- rather than
    methenyl-tetrahydromethanopterin, to match its definition?
suggested_experiments:
- description: Solve a ternary complex of Mer with F420 (or F420H2) and
    methylene-H4MPT to confirm the postulated substrate sites and the direct hydride
    transfer geometry, which the published apoenzyme structures only infer.
  experiment_type: X-ray crystallography
