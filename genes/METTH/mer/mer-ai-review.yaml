      resource: INTERPRO
      record: InterPro:IPR011251
      requested_change: CHECK
      asserted_value: GO:0016705
      cause: SCOPE_OVER_REACH
      confidence: CONFIRMED
      explanation: IPR011251 (Luciferase-like domain) maps to GO:0016705
        oxidoreductase activity, acting on paired donors, with incorporation or
        reduction of molecular oxygen. That is right for the flavin monooxygenases of
        the fold (bacterial luciferase, alkanesulfonate monooxygenase) but wrong for
