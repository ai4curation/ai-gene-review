  review:
    summary: InterPro2GO mapping of the luciferase-like domain (IPR011251) and
      superfamily (IPR036661) to an O2-using paired-donor oxidoreductase activity.
    action: REMOVE
    reason: Wrong activity. GO:0016705 is defined by molecular oxygen being reduced or
      incorporated into a donor, the chemistry of the flavin monooxygenases (such as
      bacterial luciferase) after which the fold is named. Mer uses no O2 and no
      flavin. It is an oxygen-stable reductase that transfers a hydride from F420H2 to
      methylene-H4MPT in a ternary complex, and it contains no prosthetic group; its
      structural similarity to FMN-dependent luciferase is a shared fold, not shared
      chemistry. The correct activity is the GO:0018537 rows. The mapping is right for
      the flavin monooxygenase members of the superfamily but wrong for the whole
      F420-dependent clade. By UniProt query (2026-11-07), 446 of the 450 Mer-family
      (IPR019946) entries, and 52 of 53 reviewed F420-dependent luciferase-like
      enzymes (Mer, F420-dependent glucose-6-phosphate dehydrogenase, F420-dependent
      alcohol dehydrogenase, mycobacterial F420-dependent reductases), carry it.
    supported_by:
    - reference_id: PMID:2298726
      supporting_text: The active enzyme does not contain a flavin prosthetic group or
        iron-sulfur clusters
    - reference_id: PMID:10891279
      supporting_text: It is composed of identical 35-40 kDa subunits and lacks a
        prosthetic group.
    - reference_id: PMID:10891279
