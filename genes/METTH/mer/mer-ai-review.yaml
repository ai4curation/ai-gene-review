id: O27784
gene_symbol: mer
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:187420
  label: Methanothermobacter thermautotrophicus str. Delta H
description: >-
  Mer is the coenzyme F420-dependent N5,N10-methylenetetrahydromethanopterin
  reductase (EC 1.5.98.2) of the hydrogenotrophic methanogen Methanothermobacter
  thermautotrophicus. It catalyses the reduction of 5,10-methylene-H4MPT to
  5-methyl-H4MPT with reduced coenzyme F420 (F420H2) as the specific electron donor,
  the fifth step of CO2 reduction to methane; the methyl group is then transferred
  to coenzyme M by the membrane-bound methyltransferase. The reaction is reversible
  but strongly favours reduction. The enzyme purified from strain Delta H is an
  oxygen-stable oligomer of identical 35 kDa subunits that follows a ternary-complex
  mechanism and contains no flavin, iron-sulfur cluster or other prosthetic group;
  NAD(P)H and reduced viologens do not replace F420H2. Crystal structures of the
  Methanopyrus kandleri and Methanothermobacter enzymes show a TIM-barrel fold most
  similar to bacterial FMN-dependent luciferase, with the F420 and methylene-H4MPT
  sites in a cleft between insertion regions, but Mer binds no flavin and uses no
  oxygen; it transfers a hydride directly between its two substrates. Mer is a
  soluble cytoplasmic enzyme, and its single-gene transcript peaks in mid-exponential
  growth.
