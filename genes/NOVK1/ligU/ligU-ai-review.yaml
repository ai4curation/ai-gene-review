gene_symbol: ligU
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:164608
  label: Novosphingobium sp. KA1
description: >-
  LigU is a PrpF-family 1,3-allylic isomerase, (4E)-oxalomesaconate
  delta-isomerase, of the bacterial protocatechuate 4,5-cleavage
  (meta-cleavage) pathway. It moves the C4=C5 double bond of
  (4E)-oxalomesaconate (OMA), the product of 2-pyrone-4,6-dicarboxylate
  hydrolysis (or of gallate ring cleavage), to the C3=C4 position, forming
  (3Z)-2-keto-4-carboxy-3-hexenedioate (KCH) with high efficiency (kcat about
  1300 s-1). KCH is the preferred substrate of the LigJ hydratase, which
  converts it to 4-carboxy-4-hydroxy-2-oxoadipate for cleavage by the LigK
  aldolase to pyruvate and oxaloacetate. LigU is related to the methylaconitate
  isomerase PrpF and to methylitaconate delta-isomerase, and functions in the
  catabolism of lignin-derived and other aromatic compounds funnelled through
  protocatechuate; the KA1 gene lies within a plasmid-borne protocatechuate
  catabolic (lig) gene cluster.
