core_functions:
- description: >-
    1,3-allylic isomerase that converts (4E)-oxalomesaconate to
    (3Z)-2-keto-4-carboxy-3-hexenedioate, supplying the substrate of the LigJ
    hydratase in the lower protocatechuate 4,5-cleavage pathway. GO has no
    reaction-specific term; the general C=C-transposing isomerase term is used
    here and the specific term "(4E)-oxalomesaconate delta-isomerase activity"
    is requested under proposed_new_terms.
  molecular_function:
    id: GO:0016863
    label: intramolecular oxidoreductase activity, transposing C=C bonds
  directly_involved_in:
  - id: GO:0019617
    label: protocatechuate catabolic process, meta-cleavage
  supported_by:
  - reference_id: PMID:29658701
    supporting_text: LigU catalyzes the isomerization of the double bond between C4 and C5 in (4 E)-OMA to (3 Z)-2-keto-4-carboxy-3-hexenedioate (KCH), where the double bond has migrated to be between C3 and C4 via a 1,3-allylic isomerization.
proposed_new_terms:
- proposed_name: (4E)-oxalomesaconate delta-isomerase activity
  proposed_definition: >-
    Catalysis of the reaction: (1E)-4-oxobut-1-ene-1,2,4-tricarboxylate
    ((4E)-oxalomesaconate) = (3Z)-2-oxo-4-carboxy-3-hexenedioate, a
    1,3-allylic isomerization that moves the C4=C5 double bond to C3=C4.
  justification: >-
    LigU catalyses RHEA:58504 (EC 5.3.3.-) in the sphingomonad
    protocatechuate 4,5-cleavage pathway and no GO term covers the reaction.
    It is distinct from the OMA keto-enol tautomerase step catalysed by GalD
    in Pseudomonas gallate catabolism (proposed separately as
    4-oxalomesaconate tautomerase activity), because LigU produces a
    different isomer (KCH) that is hydrated by LigJ rather than GalB.
  proposed_parent:
    id: GO:0016863
    label: intramolecular oxidoreductase activity, transposing C=C bonds
  proposed_mappings:
  - predicate: skos:exactMatch
    target_term:
      id: RHEA:58504
      label: (1E)-4-oxobut-1-ene-1,2,4-tricarboxylate = (3Z)-2-oxo-4-carboxy-3-hexenedioate
  supported_by:
  - reference_id: PMID:29658701
    supporting_text: LigU catalyzes the isomerization of the double bond between C4 and C5 in (4 E)-OMA to (3 Z)-2-keto-4-carboxy-3-hexenedioate (KCH), where the double bond has migrated to be between C3 and C4 via a 1,3-allylic isomerization.
suggested_questions:
- question: >-
    Is the Sphingobium sp. SYK-6 orf1 of the ligK-orf1-ligI operon (essential
    for growth on vanillate and syringate, originally proposed to be a
    transporter) the SYK-6 LigU orthologue?
  experts:
  - Masai laboratory (Nagaoka University of Technology)
- question: >-
    Should GO create a single parent for the OMA isomerization/tautomerization
    activities (LigU-type 1,3-allylic isomerase and GalD-type tautomerase) that
    feed the two analogous OMA hydratases?
  experts:
  - GO molecular function editors
suggested_experiments:
- description: >-
    Test whether ligU disruption in a sphingomonad abolishes growth on
    protocatechuate and gallate, and whether spontaneous OMA isomerization
    can bypass LigU in vivo.
  experiment_type: gene disruption and growth phenotyping
