id: O06873
gene_symbol: pomA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:663
  label: Vibrio alginolyticus
description: PomA is the multi-pass membrane subunit of the sodium-driven polar flagellar stator
  of Vibrio alginolyticus. Five PomA subunits surround two PomB subunits to form the ion-conducting
  stator. PomA contributes to sodium permeation and couples ion-driven conformational motion
  to the rotor through its cytoplasmic interface with FliG.
