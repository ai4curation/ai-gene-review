id: O06873
gene_symbol: pomA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:663
  label: Vibrio alginolyticus
description: PomA is the multipass inner-membrane A subunit of the sodium-driven polar flagellar stator
  of Vibrio alginolyticus. Five PomA subunits surround two PomB subunits in the assembled channel. PomA
  contributes sodium-selective channel architecture and cytoplasmic rotor contacts that couple ion flow
  to torque. Its activity depends on the PomAB complex and is distinct from the proton-driven lateral-flagellar
  system.
