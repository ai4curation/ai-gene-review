- id: PMID:37500658
  title: Ion selectivity and rotor coupling of the Vibrio flagellar sodium-driven stator unit.
  findings:
  - statement: ATCC17749 PomAB structures reveal A5B2 architecture and sodium-binding features.
    supporting_text: PomAB assembles the characteristic bell shape of the stator unit family,
      with conserved 5:2 subunit stoichiometry and overall architecture.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full cached text inspected. ATCC17749 constructs and VaPotAB chimeras in Salmonella
      are not relabeled as VI05 native assays; the clipped 8BRD PomB chain maps to A0A7Y4B4T7,
      not a verified full-length O06874 sequence.
- id: PMID:39793043
  title: Structural insight into sodium ion pathway in the bacterial flagellar stator from marine
    Vibrio.
  findings:
  - statement: Exact-sequence structures and functional perturbations identify a sodium pathway
      and ion-selectivity mechanism.
    supporting_text: 'The structures and following functional analysis revealed the sodium

      ion pathway, the mechanism of ion selectivity, and the inhibition mechanism by

      phenamil.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full cached text inspected. Exact target sequences map to 9IJM (PomA exact;
      PomB exact plus C-terminal HHHHHH). Five A and two B subunits form the stator. Ion-conductivity
      experiments use engineered plug-deletion constructs and mutations; these are distinguished
      from unmodified native behavior.
