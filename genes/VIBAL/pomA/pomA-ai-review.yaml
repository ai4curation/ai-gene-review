    review_notes: Cached text remains abstract-only after normal retrieval and force retry;
      explicit abstract results are used without inventing methods. The older A4B2/plugged model
      is superseded in stoichiometry by later A5B2 cryo-EM structures; it remains informative
      about membrane and periplasmic organization.
