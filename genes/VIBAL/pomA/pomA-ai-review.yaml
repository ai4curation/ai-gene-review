    label: sodium channel activity
  evidence_type: IC
  original_reference_id: PMID:39793043
  qualifier: contributes_to
  review:
    summary: Add the independently supported missing function or component.
    action: NEW
    reason: Both PomA and PomB contribute to the sodium-permeation pathway of assembled PomAB, supported
      by exact-sequence structures and ion-conductivity perturbations. The contributes_to qualifier avoids
      claiming that an isolated subunit independently forms the channel. Sodium flows down its electrochemical
      gradient; no ATP-driven pumping or proton specificity is asserted. The 2025 plug-deletion growth
      assays are ion-leak proxies, not direct measurements of native single-channel flux; sodium-site
      structure and conduction-sensitive perturbations jointly support the channel inference.
    supported_by:
    - reference_id: PMID:39793043
      supporting_text: 'The structures and following functional analysis revealed the sodium

        ion pathway, the mechanism of ion selectivity, and the inhibition mechanism by

        phenamil.'
