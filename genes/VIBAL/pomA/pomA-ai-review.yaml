- term:
    id: GO:0071978
    label: bacterial-type flagellum-dependent swarming motility
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR047055
  - PANTHER:PTN002019356
  review:
    summary: Generalize the unsupported surface-swarming specificity.
    action: MODIFY
    reason: GO:0071978 specifies collective movement along a solid surface driven by numerous
      flagella. PomAB is the sodium-driven polar motor. The cited PomAB experiments describe
      spreading through soft agar as swarming, but the strains include lateral-flagellum-defective
      backgrounds and this assay wording does not establish the GO surface-swarming process.
      General bacterial flagellum-dependent motility captures the directly demonstrated motor
      contribution without that unsupported context.
    supported_by:
    - reference_id: PMID:22343296
      supporting_text: 'The polar flagellar motor of Vibrio alginolyticus rotates using Na(+)
        influx

        through the stator, which is composed of 2 subunits, PomA and PomB.'
