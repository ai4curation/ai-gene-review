knowledge_gaps:
- gap_statement: The GO stator-complex definition retains A4B2/nonrotating wording despite A5B2
    structures and models with rotation of the A-subunit ring around the anchored B-subunit
    dimer.
  boundary: The sodium-driven PomAB stator identity and ion-conducting role are established;
    this is an ontology-description mismatch rather than uncertainty about the target being
    a stator.
  gap_kind:
