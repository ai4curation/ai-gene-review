  review:
    summary: PomAB conducts sodium ions to power the polar motor.
    action: NEW
    reason: The target sequence exactly matches the 2025 structure (PomB additionally bears a C-terminal
      His6 tag). Sodium-site structures and conduction-sensitive mutagenesis support a contribution-qualified
      molecular function. Plug-deletion growth inhibition is an ion-leak proxy, not a direct measurement
      of native single-channel flux.
    supported_by:
