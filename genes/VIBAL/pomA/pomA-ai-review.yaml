- term:
    id: GO:0120101
    label: bacterial-type flagellum stator complex
  evidence_type: IDA
  original_reference_id: PMID:39793043
  qualifier: part_of
  review:
    summary: Add the independently supported missing function or component.
    action: NEW
    reason: 'PomA and PomB are directly resolved in the same flagellar stator complex. PDB 9IJM
      PomA is identical to O06873; its PomB entity contains all of O06874 followed by a six-histidine
      tag. GO:0120101 names the right complex, but its old A4B2/nonrotating definition is not
      adopted: the observed complex has A5B2 architecture.'
    supported_by:
    - reference_id: PMID:39793043
      supporting_text: 'The structures and following functional analysis revealed the sodium

        ion pathway, the mechanism of ion selectivity, and the inhibition mechanism by

        phenamil.'
