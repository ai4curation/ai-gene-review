    label: chemotaxis
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR047055
  review:
    summary: PomA contributes mechanical work to the sodium-driven polar motor during chemotactic swimming.
    action: KEEP_AS_NON_CORE
    reason: Chemotaxis is movement guided by a chemical concentration gradient. V. alginolyticus gradient
      experiments link sodium-driven swimming speed to chemotactic precision (PMID27439872), and polar-motor
      experiments establish CheY-controlled directional responses (PMID17376072). PomA supplies torque
      in the sodium-driven motor that executes those responses; this is positive species-level mechanical-effector
      evidence, not an inference from an inability to swim alone. Keep this as a non-core context of its
      primary torque-generating activity. The microfluidic study used YM4; the selected structural/reference
      protein and the other motor constructs are separately identified in this review. No PomA-specific
      gradient knockout, direct CheY binding to PomA, or exact cross-strain experimental identity is asserted.
    supported_by:
    - *id001
    - &id002
      reference_id: PMID:18326582
      supporting_text: The swimming speed of the wild type was ca. 63 μm s −1 .
      reference_section_type: RESULTS
    - reference_id: PMID:27439872
      supporting_text: 'swimming speed

        can be a fundamental determinant of the gradient-seeking capabilities of marine

        bacteria'
    - reference_id: PMID:17376072
      supporting_text: CheY controls its rotational direction.
