  title: Characterization of PomA mutants defective in the functional assembly of the Na(+)-driven
    flagellar motor in Vibrio alginolyticus.
  findings:
  - statement: PomA mutations separate stator interaction, assembly and ion-conductivity effects.
    supporting_text: 'The polar flagellar motor of Vibrio alginolyticus rotates using Na(+)
      influx

      through the stator, which is composed of 2 subunits, PomA and PomB.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full cached text inspected. The full article distinguishes polar flagellum
      motor assays and lateral-flagellum-defective backgrounds. Soft-agar swarm-ring wording
      does not establish GO surface-swarming motility. It assays PomA-PomB interaction and ion-conductivity
      effects, so the title focused on PomA does not make PomB interaction citations wrong.
