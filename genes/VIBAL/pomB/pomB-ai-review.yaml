  review:
    summary: PomAB conducts sodium ions to power the polar motor.
    action: NEW
    reason: The target sequence exactly matches the2025 structure (PomB additionally bears a C-terminalHis6
      tag). Sodium-site structures and conduction-sensitive mutagenesis support a contribution-qualified
      molecular function. Plug-deletion growth inhibition is an ion-leak proxy, not a direct measurement
      of native single-channel flux.
    supported_by:
    - *id001
    - &id002
      reference_id: PMID:39793043
      supporting_text: No growth inhibition was observed in L166K and M179K mutant cells, indicating that
        these mutations completely block the sodium ion flux.
