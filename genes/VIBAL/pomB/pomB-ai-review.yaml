taxon:
  id: NCBITaxon:663
  label: Vibrio alginolyticus
description: PomB is the B subunit of the sodium-driven polar flagellar stator of Vibrio alginolyticus.
  Its N-terminal membrane helix contributes to the PomAB ion pathway, including the essential Asp24, while
  its periplasmic plug and peptidoglycan-binding region regulate and anchor the stator. Two PomB subunits
  associate with five PomA subunits. Sodium transport and torque generation are properties of the assembled
  complex, not autonomous PomB.
