    summary: Add the independently supported missing function or component.
    action: NEW
    reason: 'PomA and PomB are directly resolved in the same flagellar stator complex. PDB 9IJM
      PomA is identical to O06873; its PomB entity contains all of O06874 followed by a six-histidine
