  review:
    summary: Add the independently supported missing function or component.
    action: NEW
    reason: Both PomA and PomB contribute to the sodium-permeation pathway of assembled PomAB,
      supported by exact-sequence structures and ion-conductivity perturbations. The contributes_to
      qualifier avoids claiming that an isolated subunit independently forms the channel. Sodium
