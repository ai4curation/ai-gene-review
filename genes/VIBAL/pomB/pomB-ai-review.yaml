- id: PMID:21642461
  title: 'Structure of the flagellar motor protein complex PomAB: implications for the torque-generating
    conformation.'
  findings:
  - statement: PomA and PomB form the membrane stator complex that couples sodium flux to flagellar rotation.
    supporting_text: PomAB is composed of two transmembrane (TM) components, PomA and PomB, and converts
      a sodium ion flux to rotation of the flagellum.
  - statement: Electron microscopy supports the membrane and periplasmic organization of PomAB.
    supporting_text: 'PomAB is composed of two transmembrane

      (TM) components, PomA and PomB, and converts a sodium ion flux to rotation of the

      flagellum.'
  reference_review:
    review_notes: Direct PomAB complex architecture and ion-coupling context. The current cache is abstract-only;
      older stoichiometric models are superseded by recent A5B2 structures without discarding the supported
      complex function.
- id: PMID:22343296
  title: Characterization of PomA mutants defective in the functional assembly of the Na(+)-driven flagellar
    motor in Vibrio alginolyticus.
  findings:
  - statement: PomA mutations separate stator interaction, assembly and ion-conductivity effects.
    supporting_text: 'The polar flagellar motor of Vibrio alginolyticus rotates using Na(+) influx

      through the stator, which is composed of 2 subunits, PomA and PomB.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full cached text inspected. The full article distinguishes polar flagellum motor assays
      and lateral-flagellum-defective backgrounds. Soft-agar swarm-ring wording does not establish GO
      surface-swarming motility. It assays PomA-PomB interaction and ion-conductivity effects, so the
      title focused on PomA does not make PomB interaction citations wrong.
- id: PMID:39793043
  title: Structural insight into sodium ion pathway in the bacterial flagellar stator from marine Vibrio.
  findings:
  - statement: PomAB structure-guided mutations alter sodium-leak-associated growth effects; this proxy
      is distinct from native single-channel flux.
    supporting_text: No growth inhibition was observed in L166K and M179K mutant cells, indicating that
      these mutations completely block the sodium ion flux.
  - statement: Exact-sequence structures and functional perturbations identify a sodium pathway and ion-selectivity
      mechanism.
    supporting_text: 'The structures and following functional analysis revealed the sodium

      ion pathway, the mechanism of ion selectivity, and the inhibition mechanism by

      phenamil.'
  reference_review:
    review_notes: PomAB structures match the selected UniProt sequences exactly, with PomB C-terminal
      His6. Recombinant production is in BL21(DE3)/pLysS; native Vibrio motility and plug-deletion ion-leak
      proxies are distinct experiments. Structural sodium density is not itself a direct ion-flux measurement.
- id: PMID:37500658
  title: Ion selectivity and rotor coupling of the Vibrio flagellar sodium-driven stator unit.
  findings:
  - statement: ATCC17749 PomAB structures reveal A5B2 architecture and sodium-binding features.
    supporting_text: PomAB assembles the characteristic bell shape of the stator unit family, with conserved
      5:2 subunit stoichiometry and overall architecture.
  reference_review:
    review_notes: ATCC 17749 DNA and modified PomB structural constructs; functional tests use the VaPotAB
      hybrid in Salmonella LT2. Do not describe hybrid rescue as native Vibrio motility or infer native
      PomB anchoring from the hybrid.
