  findings: []
  reference_review:
    review_notes: Direct native V.alginolyticus NMB191/VIO5 experiments are separate from E.coli PomA/PotB
      hybrid tests. The paper measures swimming speed as well as soft-agar rings called swarming; its
      latter label does not by itself establish the GO solid-surface swarming process.
- id: PMID:21642461
  title: 'Structure of the flagellar motor protein complex PomAB: implications for the torque-generating
    conformation.'
  findings:
  - statement: PomA and PomB form the membrane stator complex that couples sodium flux to flagellar rotation.
    supporting_text: PomAB is composed of two transmembrane (TM) components, PomA and PomB, and converts
      a sodium ion flux to rotation of the flagellum.
  reference_review:
    review_notes: Direct PomAB complex architecture and ion-coupling context. The current cache is abstract-only;
      older stoichiometric models are superseded by recent A5B2 structures without discarding the supported
      complex function.
- id: PMID:22343296
  title: Characterization of PomA mutants defective in the functional assembly of the Na(+)-driven flagellar
    motor in Vibrio alginolyticus.
  findings: []
- id: PMID:39793043
  title: Structural insight into sodium ion pathway in the bacterial flagellar stator from marine Vibrio.
  findings:
  - statement: PomAB structure-guided mutations alter sodium-leak-associated growth effects; this proxy
      is distinct from native single-channel flux.
    supporting_text: No growth inhibition was observed in L166K and M179K mutant cells, indicating that
      these mutations completely block the sodium ion flux.
  reference_review:
    review_notes: PomAB structures match the selected UniProt sequences exactly, with PomB C-terminalHis6.
      Recombinant production is in BL21(DE3)/pLysS; native Vibrio motility and plug-deletion ion-leak
      proxies are distinct experiments. Structural sodium density is not itself a direct ion-flux measurement.
- id: PMID:37500658
  title: Ion selectivity and rotor coupling of the Vibrio flagellar sodium-driven stator unit.
  findings: []
  reference_review:
    review_notes: ATCC17749 DNA and modified PomB structural constructs; functional tests use the VaPotAB
      hybrid in Salmonella LT2. Do not describe hybrid rescue as native Vibrio motility or infer native
      PomB anchoring from the hybrid.
