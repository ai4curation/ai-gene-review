id: O06874
gene_symbol: pomB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:663
  label: Vibrio alginolyticus
description: PomB is the single-pass membrane subunit of the sodium-driven polar flagellar stator
  of Vibrio alginolyticus. Two PomB subunits form the central transmembrane pair within a ring
  of five PomA subunits. PomB contributes essential sodium-binding and permeation determinants,
  a channel-gating plug and a periplasmic anchoring region that supports incorporation of the
  stator around the rotor.
