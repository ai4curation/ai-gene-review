    reason: PomB performs the stator ion-conduction and anchoring work that powers flagellar
      rotation, not merely a prerequisite inferred from a knockout. Comparator stator proteins
      P. putida MotA Q88DC2 and P. aeruginosa MotB Q9HUL2 carry this process in current QuickGO;
