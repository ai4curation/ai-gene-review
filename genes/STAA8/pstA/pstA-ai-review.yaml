taxon:
  id: NCBITaxon:93061
  label: Staphylococcus aureus subsp. aureus NCTC 8325
description: PstA (SAOUHSC_00452) is a Staphylococcus aureus PII-like cyclic di-AMP receptor. It belongs
  to the DarA/PstA family and forms a trimer with ligand-binding sites at monomer interfaces. Binding
  cyclic di-AMP changes exposed loops, providing a structural basis for signaling. Its downstream regulatory
  partner and direct physiological output remain unresolved; similarity to classical PII proteins does
  not establish nitrogen-metabolism activity.
