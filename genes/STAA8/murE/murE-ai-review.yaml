proposed_new_terms: []
suggested_questions:
- question: >-
    L-ornithine is accepted 400-fold less efficiently than L-lysine. Is that
    residual activity ever physiologically relevant, for instance in
    L-lysine-limited growth or in organisms whose peptidoglycan contains
    L-ornithine, or is it purely an in vitro property of the active site?
- question: >-
    How does MurE contribute to beta-lactam resistance in S. aureus: through
    the amount or quality of the tripeptide pool, or through an interaction
    with the resistance machinery that is independent of its ligase activity?
suggested_experiments:
- description: >-
    Swap the active-site residues that distinguish L-lysine-adding from
    meso-diaminopimelate-adding MurE enzymes between the S. aureus and E. coli
    proteins and measure specificity of the chimeras, to establish which
    residues determine third-position selection and so whether PANTHER
    subfamily membership can ever predict it.
- description: >-
    Determine the structure of S. aureus MurE with the UDP-MurNAc-L-Ala-D-Glu
    and L-lysine substrates bound, to show directly how meso-diaminopimelate is
    excluded.
