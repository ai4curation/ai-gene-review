core_functions:
- description: >-
    MurE adds L-lysine to UDP-N-acetylmuramoyl-L-alanyl-D-glutamate using
    Mg2+-ATP, producing the UDP-MurNAc-tripeptide of the S. aureus stem
    peptide. Its strict rejection of meso-diaminopimelate is what fixes
    L-lysine at the third stem position in this organism's peptidoglycan.
  molecular_function:
    id: GO:0047482
    label: UDP-N-acetylmuramoyl-L-alanyl-D-glutamate-L-lysine ligase activity
