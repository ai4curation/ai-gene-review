gene_symbol: murE
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:93061
  label: Staphylococcus aureus subsp. aureus NCTC 8325
description: >-
  MurE of Staphylococcus aureus is the cytoplasmic ATP-dependent amino
  acid-adding ligase of the third step of peptidoglycan stem-peptide assembly.
  It adds L-lysine to UDP-N-acetylmuramoyl-L-alanyl-D-glutamate to give the
  UDP-MurNAc-tripeptide that MurF then extends with D-alanyl-D-alanine. The
  purified enzyme is strictly specific for L-lysine and does not accept
  meso-diaminopimelate, the residue used by Escherichia coli and other
  Gram-negative bacteria; L-ornithine is accepted several hundred-fold less
  efficiently. This strict and inverse specificity of MurE orthologs is what
  sets the identity of the third stem residue, and therefore the crosslinking
  chemistry, of a species' peptidoglycan: L-lysine in S. aureus, where it also
  carries the pentaglycine bridge. Like the other Mur ligases, MurE is a
  three-domain Mur-ligase-fold enzyme that uses Mg2+-ATP, and it has been
  implicated in the expression of beta-lactam resistance in S. aureus.
