  review:
    summary: The generic DHHA1-domain inference exceeds the gene-specific evidence for nucleic-acid binding.
    action: MARK_AS_OVER_ANNOTATED
    reason: This electronic assignment rests on the widely distributed DHHA1 domain. The experimentally
      established substrate for this protein is a signaling dinucleotide, and a domain shared with RNA-processing
      enzymes does not establish a distinct nucleic-acid-binding function here. Retain the demonstrated
      hydrolytic function separately; this assessment does not assert that all possible RNA interactions
      have been disproved. The over-annotation judgment concerns the inference from domain membership;
      no negative nucleic-acid-binding experiment is claimed, and substrate-hydrolysis quotations are
      not evidence for absence of binding.
