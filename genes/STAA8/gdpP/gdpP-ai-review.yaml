taxon:
  id: NCBITaxon:93061
  label: Staphylococcus aureus subsp. aureus NCTC 8325
description: GdpP, encoded by SAOUHSC_00015 in Staphylococcus aureus NCTC 8325, is a membrane-associated
  c-di-AMP phosphodiesterase. Its DHH/DHHA1 catalytic domains hydrolyze the cyclic messenger to the linear
  dinucleotide pApA. By controlling c-di-AMP abundance, GdpP influences osmotic balance, cell size and
  cell-envelope properties. pApA inhibits the enzyme in vitro, providing a potential feedback connection
  to downstream pApA clearance by Pde2. The protein also contains PAS-like and degenerate GGDEF domains,
  but their regulatory properties must not be assumed identical to those of Bacillus GdpP.
