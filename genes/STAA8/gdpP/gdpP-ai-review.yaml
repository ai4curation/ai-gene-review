- id: PMID:27834680
  title: New Insights into the Cyclic Di-adenosine Monophosphate (c-di-AMP) Degradation Pathway and the
    Requirement of the Cyclic Dinucleotide for Acid Stress Resistance in Staphylococcus aureus.
  findings:
  - statement: pApA can limit GdpP-dependent c-di-AMP hydrolysis.
    supporting_text: Moreover, pApA is involved in a feedback inhibition loop that limits GdpP-dependent
      c-di-AMP hydrolysis.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cached full text examined. The USA300 experiments support a species-level regulatory
      mechanism; its magnitude is not asserted as directly measured in the NCTC8325 reference strain.
