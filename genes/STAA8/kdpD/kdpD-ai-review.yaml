taxon:
  id: NCBITaxon:93061
  label: Staphylococcus aureus subsp. aureus NCTC 8325
description: KdpD is an integral membrane sensor histidine kinase of the Staphylococcus aureus KdpD/KdpE
  system. Its cytoplasmic signaling domains regulate expression of the Kdp potassium uptake machinery.
  The NCTC 8325 protein is sequence-identical to the USA300 counterpart whose universal stress protein
  domain binds cyclic di-AMP. In the studied LAC* cellular background, increased cyclic di-AMP suppresses
  salt-induced kdpFABC expression; the biochemical coupling to kinase activity remains unresolved.
