- id: PMID:26195599
  title: Binding of Cyclic Di-AMP to the Staphylococcus aureus Sensor Kinase KdpD Occurs via the Universal
    Stress Protein Domain and Downregulates the Expression of the Kdp Potassium Transporter.
  findings:
  - statement: KdpD is the sensor component of the KdpD/KdpE system.
    supporting_text: 'The

      sensor kinase KdpD forms a two-component signaling system with the response

      regulator KdpE and regulates the expression of the kdpDE genes and the kdpFABC

      operon'
  - statement: Cyclic di-AMP binds its cytoplasmic USP domain.
    supporting_text: 'the S. aureus KdpD protein binds c-di-AMP specifically and with an affinity in

      the micromolar range through its universal stress protein (USP) domain.'
  - statement: In the LAC* background, cyclic di-AMP reduces salt-stress induction of kdpFABC; direct
      inhibition of KdpD autokinase was not measured.
    supporting_text: 'c-di-AMP binding to KdpD inhibits

      the upregulation of the kdpFABC operon under salt stress'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text distinguishes USA300/LAC* KdpD from the separately assayed MRSA252 KdpD2 paralog.
      The 885-residue USA300 donor is identical to NCTC 8325 Q2FWH7, independently rechecked in the consultation
      proof. Cellular expression effects remain LAC* observations, not target-strain measurements.
