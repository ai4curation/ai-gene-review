- term:
    id: GO:0180001
    label: cyclic-di-AMP binding
  evidence_type: ISS
  original_reference_id: PMID:26195599
  review:
    summary: Cyclic di-AMP recognition transfers from the sequence-identical USA300 KdpD counterpart.
    action: NEW
    reason: Direct binding assays establish cyclic di-AMP recognition by the USP domain of S. aureus KdpD.
      The assayed USA300 KdpD counterpart A0A0H2XIE2 (SAUSA300_2035) is identical across all 885 residues
      to NCTC 8325 Q2FWH7. Transfer is therefore recorded as ISS, not as an assay performed in the target
      strain; the full-length sequence comparison and provenance are documented in the notes. No direct
      inhibition of autokinase activity is inferred.
    supported_by:
    - reference_id: PMID:26195599
      supporting_text: 'the S. aureus KdpD protein binds c-di-AMP specifically and with an affinity in

        the micromolar range through its universal stress protein (USP) domain.'
  supporting_entities:
  - UniProtKB:A0A0H2XIE2
