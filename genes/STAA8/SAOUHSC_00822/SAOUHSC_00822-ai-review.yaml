suggested_questions:
- question: What is the native LnsAB oligomer stoichiometry, and how does LnsB contribute to 
    substrate recognition or acyl transfer?
- question: How do partner-interface differences determine the asymmetric activity of the S. aureus 
    and S. epidermidis mixed pairs?
suggested_experiments:
- description: Determine the native complex structure and stoichiometry with substrate-bound states;
    compare turnover and substrate binding of LnsB variants while controlling protein stability.
  experiment_type: structural and biochemical analysis
- description: Measure donor competition and acyl-enzyme intermediates with purified matched and 
    mixed species pairs, keeping recombinant expression and native strain phenotypes separate.
  experiment_type: in vitro enzyme assay
