  label: Staphylococcus aureus subsp. aureus NCTC 8325
description: 'LnsA is the catalytic acyltransferase component of the two-protein lipoprotein N-acylation
  system in Staphylococcus aureus. Together with the integral membrane partner LnsB, it transfers an acyl
  chain to the free alpha-amino group of the N-terminal cysteine of a diacylglyceryl lipoprotein, producing
  the triacylated form. Phosphatidylglycerol is the preferred donor in the reconstituted system, with
  transfer from its sn-1 position. LnsA is exported through a cleaved N-terminal signal peptide and remains
  associated with the external surface of the plasma membrane. His60, Cys143 and Tyr129 are required for
  activity; exact complex stoichiometry and a directly trapped acyl-enzyme intermediate remain unresolved.'
aliases:
- lnsA
existing_annotations:
- term: &id001
    id: GO:0016747
    label: acyltransferase activity, transferring groups other than amino-acyl groups
  evidence_type: IDA
  original_reference_id: PMID:42580408
  review:
    action: NEW
    summary: Catalytic LnsA acyltransferase activity within the required LnsAB system.
    reason: Purified recombinant LnsA residues32–189 and LnsB, expressed in an E. coli lnt-null 
      host, reconstitute N-acylation of a defined diacylated lipopeptide. LnsA H60A/C143A and Y129A 
      cellular substitutions eliminate activity, locating the catalytic center in LnsA; this is not 
      an assertion that LnsA acts without LnsB. Defined-lipid MS/MS assigns the preferred donor to 
      PG sn-1, without establishing exclusive donor use or in vivo flux. GO:0016747 represents the 
      transfer chemistry without introducing an obsolete or lysine-specific N-acyltransferase term.
    supported_by:
    - reference_id: PMID:42580408
      supporting_text: Reconstitution of the acylation system using a fluorescently-labeled DA-LP∗ 
        model lipopeptide acceptor and a TLC assay to separate TA-LP product showed that both 
        recombinant LnsA and LnsB are required, along with a phospholipid donor source
    - reference_id: PMID:42580408
      supporting_text: conversion of either of these residues to alanine abolished catalytic 
        activity
- term: &id002
    id: GO:0042158
    label: lipoprotein biosynthetic process
  evidence_type: IMP
  original_reference_id: PMID:32723923
  review:
    action: NEW
    summary: Direct catalytic or complex contribution to terminal lipoprotein biosynthesis.
    reason: 'Targeted deletion and complementation in the NCTC8325 HG003-derived TM226 background, with
      lipoprotein product MS/MS, establish the role of each gene in terminal N-acylation. The cloned complementation
      sequences came from NCTC8325. The later purified reconstruction distinguishes actual modifying work
      from a mere requirement for an outcome: LnsA supplies the catalytic center and LnsB an obligatory
      interacting component. Exact-term same-role Lnt comparator queries P23930 and Q88DN4 retain GO:0042158;
      the complex contributor also performs work rather than being the modified substrate. The original
      seed has no annotations, and no other proposed BP is an ancestor/descendant of this term. TLR2 signaling,
      cytokine responses and pathogenicity are downstream consequences and are not proposed as direct
      activities.'
    supported_by:
    - reference_id: PMID:32723923
      supporting_text: The MALDI-TOF MS and MS-MS results confirm that SAOUHSC_00822 and 
        SAOUHSC_02761 have nonredundant roles in TA-Lpp formation.
    - reference_id: PMID:42580408
      supporting_text: Reconstitution of the acylation system using a fluorescently-labeled DA-LP∗ 
        model lipopeptide acceptor and a TLC assay to separate TA-LP product showed that both 
        recombinant LnsA and LnsB are required, along with a phospholipid donor source
- term: &id003
    id: GO:0009897
    label: external side of plasma membrane
  evidence_type: IDA
  original_reference_id: PMID:42580408
  review:
    action: NEW
    summary: Exported LnsA acts on the external membrane surface.
    reason: Fractionation retains mature LnsA with membranes; live-cell SCAM accessibility to the 
      membrane-impermeable blocker establishes external exposure. Edman sequencing confirms cleavage
      after residue27. This supports the external side of the plasma membrane, not secretion into 
      the medium or retention of the signal peptide as a permanent membrane helix. The experiments 
      express the NCTC8325-derived construct in the RN4220-derived TXM1576 panel.
    supported_by:
    - reference_id: PMID:42580408
      supporting_text: In all cases, LnsA was not detected in the secreted supernatant with the bulk
        of LnsA remaining associated with the membrane.
    - reference_id: PMID:42580408
      supporting_text: In all cases, the membrane impermeable blocker 
        4-acetamido-4′-maleimidylstilbene-2,2′disulfonic acid (AMS) was as effective as the membrane
        permeable N-ethyl maleimide blocker in preventing maleimide-PEG (mal-PEG) modification of 
        the introduced cysteine residues
references:
- id: PMID:42580408
  title: Reconstitution of the LnsAB lipoprotein N-acylation system complex from Staphylococcus 
    aureus and characterization of substrate preference.
  findings:
  - statement: Purified target-pair reconstitution uses truncated LnsA32–189 and full LnsB produced 
      in lnt-null E. coli; both are required, excluding endogenous Lnt as the enzyme source.
    supporting_text: Reconstitution of the acylation system using a fluorescently-labeled DA-LP∗ 
      model lipopeptide acceptor and a TLC assay to separate TA-LP product showed that both 
      recombinant LnsA and LnsB are required, along with a phospholipid donor source
  - statement: Defined phospholipid mixtures and product MS/MS support preferential PG sn-1 
      transfer, not absolute donor exclusivity.
    supporting_text: The MS (Fig. 9F) and MS/MS (Fig. S5D) spectra indicated addition of a C15:0 
      acyl chain to the α-amino group of the DA-LP∗ acceptor, identifying the SN1 position of PG as 
      the source of fatty acids on the α-amino group of staphylococcal lipoproteins.
  - statement: Native-host crosslinking supports physical LnsAB association; oligomer stoichiometry 
      remains unestablished.
    supporting_text: While the precise subunit stoichiometries of the complex remain speculative, 
      the cysteine substitution crosslinking results strongly support a multimeric arrangement of 
      LnsA-LnsB heterodimers.
  - statement: 'Partner interchange is asymmetric: Se LnsB supports Sa LnsA, while Se LnsA does not support
      Sa LnsB.'
    supporting_text: The S. epidermidis LnsB, which is syntenic with S. aureus (Fig. 1B), was fully 
      functional and restored TA-LP synthesis when paired with S. aureus LnsA
  - statement: The reciprocal mixed pair fails despite detectable Se LnsA expression, whereas the 
      matched Se pair is active in the Sa host.
    supporting_text: S. epidermidis LnsA was unable to partner with S. aureus LnsB as the 
      lipopeptide remained di-acylated despite the protein being successfully expressed
  - statement: LnsA H60/C143/Y129 mutations identify the active-site region; an acyl-enzyme 
      intermediate itself was not trapped.
    supporting_text: conversion of either of these residues to alanine abolished catalytic activity
  - statement: LnsA remains membrane associated after signal-peptide cleavage, including without 
      LnsB.
    supporting_text: In all cases, LnsA was not detected in the secreted supernatant with the bulk 
      of LnsA remaining associated with the membrane.
  - statement: Live-cell accessibility supports extracellular exposure rather than a purely 
      predicted topology.
    supporting_text: In all cases, the membrane impermeable blocker 
      4-acetamido-4′-maleimidylstilbene-2,2′disulfonic acid (AMS) was as effective as the membrane 
      permeable N-ethyl maleimide blocker in preventing maleimide-PEG (mal-PEG) modification of the 
      introduced cysteine residues
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full Results, Discussion, Methods and genuine supplementary PDF read. Cellular 
      expression uses the RN4220-derived TXM1576 deletion host; the target sequences trace NCTC8325.
      Purified donor assays concern the Sa pair only. Se constructs are ATCC12228-derived but tested
      in S. aureus, not native Se mutants. Supplemental prose SE_2727 disagrees with main Fig2 and 
      TableS1 SE_2027; the official locus/sequence bridge is archived. A single Tyr29 mention 
      conflicts with Tyr129 in Results, Discussion, mutant table and sequence, so no Tyr29 catalytic
      claim is made. Neither precise stoichiometry nor autonomous LnsB activity is asserted.
- id: PMID:32723923
  title: Lipoprotein N-Acylation in Staphylococcus aureus Is Catalyzed by a Two-Component Acyl 
    Transferase System.
  findings:
  - statement: Native targeted deletion/complementation and product MS/MS establish nonredundant 
      roles in lipoprotein N-acylation. The native TM226/HG003-derived panel is distinguished from 
      RN4220 and USA300 JE2 experiments.
    supporting_text: The MALDI-TOF MS and MS-MS results confirm that SAOUHSC_00822 and SAOUHSC_02761
      have nonredundant roles in TA-Lpp formation.
  - statement: The NCTC8325 target sequence is explicitly the source of complementation constructs.
    supporting_text: Complementation plasmids expressing SAOUHSC_00822, SAOUHSC_02761, or both genes
      in tandem were built from fragments amplified from S. aureus NCTC8325 genomic DNA
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full source read. The 2020 catalytic-partner uncertainty is refined by 2026 
      reconstitution and mutagenesis. Immunological outputs alone are not treated as enzyme assays 
      or direct immune-regulatory functions.
