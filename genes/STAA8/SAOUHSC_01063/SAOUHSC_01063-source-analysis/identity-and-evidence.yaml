identity_and_construct_scope: Q2G2C2, official locus SAOUHSC_01063 without a UniProt
  primary gene symbol, 408 residues, NCTC8325. PMID30692671 explicitly amplified K2–N408
  from NCTC8325 genomic DNA; N-terminal His or His-SUMO-FLAG constructs were expressed
  in E. coli C43(DE3), including D287A. Native overexpression experiments were RN4220;
  PMID38480900 imaging used other S. aureus backgrounds, not this strain.
interpretation_limits: The purified construct establishes polymerase activity. Native
  RN4220 overexpression and JE2/COL imaging are separate strain evidence. No target-specific
  physiological lipid-II transport contribution is established.
