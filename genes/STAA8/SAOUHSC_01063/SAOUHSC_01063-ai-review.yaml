  - id: PMID:30692671
    title: FtsW is a peptidoglycan polymerase that is functional only in complex with its cognate
      penicillin-binding protein.
    findings:
      - statement: Purified S. thermophilus and NCTC8325-derived S. aureus FtsW polymerize lipid II
          with compatible class-B PBP partners. FtsW catalytic mutation abolishes activity, whereas
          PBP transpeptidase mutation does not. Direct construct and donor boundaries are recorded
          separately; Bacillus assignment is ortholog inference.
    reference_review:
      review_notes: Q2G2C2, official locus SAOUHSC_01063 without a UniProt primary gene symbol, 408
        residues, NCTC8325. PMID30692671 explicitly amplified K2–N408 from NCTC8325 genomic DNA;
        N-terminal His or His-SUMO-FLAG constructs were expressed in E. coli C43(DE3), including
        D287A. Native overexpression experiments were RN4220; PMID38480900 imaging used other S.
        aureus backgrounds, not this strain. The purified construct establishes polymerase activity.
        Native RN4220 overexpression and JE2/COL imaging are separate strain evidence. No
        target-specific physiological lipid-II transport contribution is established.
  - id: PMID:38480900
    title: Cell constriction requires processive septal peptidoglycan synthase movement independent
      of FtsZ treadmilling in Staphylococcus aureus.
    findings:
      - statement: S. aureus FtsW/PBP1 single-molecule dynamics couple processive synthase movement
          to constriction. Imaging and perturbation backgrounds include JE2/COL, distinct from the
          NCTC8325 biochemical donor.
    reference_review:
      review_notes: Q2G2C2, official locus SAOUHSC_01063 without a UniProt primary gene symbol, 408
