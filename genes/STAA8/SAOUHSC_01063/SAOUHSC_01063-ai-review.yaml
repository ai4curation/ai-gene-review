taxon:
  id: NCBITaxon:93061
  label: Staphylococcus aureus subsp. aureus NCTC 8325
description: SAOUHSC_01063 encodes FtsW, the membrane-integrated SEDS peptidoglycan polymerase of
  Staphylococcus aureus NCTC8325. FtsW synthesizes glycan strands in association with class-B PBP1,
  whose physical presence activates polymerization even when its peptide-crosslinking active site is
  inactivated. Together these proteins participate in septal wall synthesis, with polymerization and
  transpeptidation assigned to different catalytic components.
