    summary: Correct cAMP biosynthesis to the directly catalysed biosynthesis of cyclic di-AMP.
    action: MODIFY
    reason: The original cAMP term describes the wrong chemical product. CdaA/DacA itself performs the two-ATP
      condensation that synthesizes c-di-AMP. Fresh QuickGO searches found no specific c-di-AMP biosynthetic-process
