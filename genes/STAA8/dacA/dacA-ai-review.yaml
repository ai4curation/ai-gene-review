id: Q2FW92
gene_symbol: dacA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:93061
  label: Staphylococcus aureus subsp. aureus NCTC 8325
description: DacA is a membrane-anchored diadenylate cyclase that produces cyclic di-AMP for intracellular
  signaling in Staphylococcus aureus. Three N-terminal transmembrane helices anchor a cytoplasmic DAC catalytic
  domain that condenses two ATP molecules. Studies of the S. aureus enzyme show that productive higher-order
  association of catalytic-domain dimers supports synthesis and that direct binding of the phosphoglucosamine
  mutase GlmM inhibits this activity. The NCTC 8325 protein retains the conserved catalytic motifs of this
  enzyme class.
