- term:
    id: GO:0005886
    label: plasma membrane
  evidence_type: IC
  original_reference_id: PMID:30668586
  review:
    summary: Infer plasma-membrane anchoring of NCTC 8325 DacA from its membrane-spanning architecture and
      the experimentally studied S. aureus cyclase class.
    action: NEW
    reason: The target Q2FW92 record has three N-terminal transmembrane helices assigned by the curated HAMAP
      MF_01499 rule. Primary S. aureus DacA work describes the membrane anchor and cytoplasmic catalytic domain.
      Together these support the bacterial plasma-membrane location already represented in the core function.
      The primary study used LAC constructs, so this NCTC 8325 assignment is explicitly an IC inference, not
      a direct localization assay on this strain. NEW records this positive evidence-supported location recommendation;
      it is not added solely to suppress an annotation-coverage warning.
    supported_by:
