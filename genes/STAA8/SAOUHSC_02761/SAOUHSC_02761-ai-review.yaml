  review:
    action: NEW
    summary: LnsB contributes to the experimentally reconstituted LnsAB acyltransferase activity.
    reason: Purified LnsB is required together with LnsA in the reconstituted N-acylation reaction. Direct
      crosslinking supports a physical LnsAB complex, and LnsA contains the mutation-defined catalytic
      center. The qualified assertion records LnsB contribution to the complex acyltransferase activity,
      not autonomous acyl transfer or proteolysis. Eight tested CPBP motif substitutions retain N-acylation;
      neither a protease assignment nor a universal absence of every possible secondary activity follows.
      The specific substrate-presentation mechanism remains a hypothesis.
