proposed_new_terms:
- proposed_name: apolipoprotein N-acyltransferase activity
  proposed_definition: Catalysis of the phospholipid-dependent N-acylation of the N-terminal S-diacylglyceryl-L-cysteine
    of a bacterial lipoprotein.
  justification: Reconstitution in PMID:42580408 establishes phospholipid-dependent terminal N-acylation
    by the compatible LnsA/LnsB complex, with preference for the sn-1 acyl chain of phosphatidylglycerol
    under the tested conditions. This substrate-specific proposal matches the Lnt activity proposal without
    asserting a shared mechanism or family. LnsB contributes to the assembled activity; this does not
    assign autonomous acyltransferase or protease chemistry to LnsB.
