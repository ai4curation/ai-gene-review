  label: Staphylococcus aureus subsp. aureus NCTC 8325
description: LnsB is the integral membrane partner of the LnsA lipoprotein N-acyltransferase in Staphylococcus
  aureus. Both proteins are required for terminal N-acylation of diacylglyceryl lipoproteins, and the
  reconstituted complex preferentially uses the sn-1 acyl chain of phosphatidylglycerol. LnsB associates
  with LnsA at the external membrane surface and contributes to the active complex, although its precise
  role in substrate presentation or catalysis remains unresolved. It belongs to a divergent CPBP family;
  the tested canonical CPBP motif residues are dispensable for N-acylation, and protease activity has
  not been established. Partner recognition is selective, so activity cannot be inferred for every cross-species
  LnsA-LnsB combination.
