references:
- id: PMID:42580408
  title: Reconstitution of the LnsAB lipoprotein N-acylation system complex from Staphylococcus aureus
    and characterization of substrate preference.
  findings:
  - statement: Purified target-pair reconstitution uses truncated LnsA32–189 and full LnsB produced in
      lnt-null E. coli; both are required, excluding endogenous Lnt as the enzyme source.
    supporting_text: Reconstitution of the acylation system using a fluorescently-labeled DA-LP∗ model
      lipopeptide acceptor and a TLC assay to separate TA-LP product showed that both recombinant LnsA
      and LnsB are required, along with a phospholipid donor source
  - statement: Defined phospholipid mixtures and product MS/MS support preferential PG sn-1 transfer,
      not absolute donor exclusivity.
    supporting_text: The MS (Fig. 9F) and MS/MS (Fig. S5D) spectra indicated addition of a C15:0 acyl
      chain to the α-amino group of the DA-LP∗ acceptor, identifying the SN1 position of PG as the source
      of fatty acids on the α-amino group of staphylococcal lipoproteins.
  - statement: Native-host crosslinking supports physical LnsAB association; oligomer stoichiometry remains
      unestablished.
    supporting_text: While the precise subunit stoichiometries of the complex remain speculative, the
      cysteine substitution crosslinking results strongly support a multimeric arrangement of LnsA-LnsB
      heterodimers.
  - statement: 'Partner interchange is asymmetric: Se LnsB supports Sa LnsA, while Se LnsA does not support
      Sa LnsB.'
    supporting_text: The S. epidermidis LnsB, which is syntenic with S. aureus (Fig. 1B), was fully functional
      and restored TA-LP synthesis when paired with S. aureus LnsA
  - statement: The reciprocal mixed pair fails despite detectable Se LnsA expression, whereas the matched
      Se pair is active in the Sa host.
    supporting_text: S. epidermidis LnsA was unable to partner with S. aureus LnsB as the lipopeptide
      remained di-acylated despite the protein being successfully expressed
  - statement: The eight tested CPBP motif substitutions retain activity. This rejects ancestry alone
      as evidence for protease chemistry, while not proving a universal secondary-activity negative.
    supporting_text: None of the mutations affected TA-LP synthesis (Fig. 8C), indicating CPBP motifs
      are not relevant to the catalytic function of LnsB.
  - statement: The target LnsB protein is detergent-extracted from a membrane fraction for reconstitution.
    supporting_text: Protein was extracted from the membranes by gentle shaking at RT for 1 h in solubilization
      buffer
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full Results, Discussion, Methods and genuine supplementary PDF read. Cellular expression
      uses the RN4220-derived TXM1576 deletion host; the target sequences trace NCTC8325. Purified donor
      assays concern the Sa pair only. Se constructs are ATCC12228-derived but tested in S. aureus, not
      native Se mutants. Supplemental prose SE_2727 disagrees with main Fig2 and TableS1 SE_2027; the
      official locus/sequence bridge is archived. A single Tyr29 mention conflicts with Tyr129 in Results,
      Discussion, mutant table and sequence, so no Tyr29 catalytic claim is made. Neither precise stoichiometry
      nor autonomous LnsB activity is asserted.
