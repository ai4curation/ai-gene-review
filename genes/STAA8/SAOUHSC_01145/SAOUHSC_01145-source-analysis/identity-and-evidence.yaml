identity_and_construct_scope: Q2FZ94, official locus SAOUHSC_01145 without a UniProt
  primary gene symbol, 744 residues, NCTC8325. PMID30692671 amplified A2–D744 from
  NCTC8325 genomic DNA, expressed C-terminal His6 protein in E. coli C43(DE3), and
  tested S314A as the inactive PBP1 partner. PMID35703435 principally tests SH1000
  and derived MRSA backgrounds; those phenotypes are homolog/strain-transfer evidence,
  not NCTC8325 measurements. PMID38527711 structures39–608 map to Q2FZ94 in frozen
  UniProt but the cached text is abstract-only.
interpretation_limits: The 2019 polymerase experiment used catalytically disabled
  PBP1 and is not a direct PBP1 crosslink-product assay. 2022 catalytic essentiality
  depends on MSSA/MRSA background. Soluble-domain antibiotic acylation and crystal
  structures alone do not prove net physiological crosslinking.
