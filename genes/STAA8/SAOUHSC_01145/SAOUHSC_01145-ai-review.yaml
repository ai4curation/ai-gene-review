  label: Staphylococcus aureus subsp. aureus NCTC 8325
description: SAOUHSC_01145 encodes the membrane-anchored class-B penicillin-binding protein PBP1 of
  Staphylococcus aureus NCTC8325. PBP1 is a serine transpeptidase associated with septal
  peptidoglycan construction and a physical activating partner of the FtsW glycan polymerase. Its
  PASTA domains and protein interactions contribute to divisome function independently of the
  transpeptidase active site. Dependence on PBP1 catalysis varies with strain background and the
  presence of resistance-associated PBP2A.
