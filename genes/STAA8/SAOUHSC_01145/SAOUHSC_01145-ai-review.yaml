  - id: PMID:30692671
    title: FtsW is a peptidoglycan polymerase that is functional only in complex with its cognate
      penicillin-binding protein.
    findings:
      - statement: NCTC8325 PBP1 residues 2–744 activate the purified FtsW polymerase even with PBP1
          S314A. This demonstrates a noncatalytic partner role; it is not a net PBP1
          crosslink-product assay.
    reference_review:
      review_notes: Q2FZ94, official locus SAOUHSC_01145 without a UniProt primary gene symbol, 744
        residues, NCTC8325. PMID30692671 amplified A2–D744 from NCTC8325 genomic DNA, expressed
        C-terminal His6 protein in E. coli C43(DE3), and tested S314A as the inactive PBP1 partner.
        PMID35703435 principally tests SH1000 and derived MRSA backgrounds; those phenotypes are
        homolog/strain-transfer evidence, not NCTC8325 measurements. PMID38527711 structures39–608
        map to Q2FZ94 in frozen UniProt but the cached text is abstract-only. The 2019 polymerase
        experiment used catalytically disabled PBP1 and is not a direct PBP1 crosslink-product
        assay. 2022 catalytic essentiality depends on MSSA/MRSA background. Soluble-domain
        antibiotic acylation and crystal structures alone do not prove net physiological
        crosslinking.
  - id: PMID:35703435
    title: Penicillin-Binding Protein 1 (PBP1) of Staphylococcus aureus Has Multiple Essential
      Functions in Cell Division.
    findings:
      - statement: PBP1 S314A and PASTA deletions in SH1000-derived strains distinguish catalytic
          and physical roles in septum formation. PBP1 catalytic essentiality differs between MSSA
          and derived MRSA backgrounds; this is comparative support for the NCTC8325 reference
          protein.
