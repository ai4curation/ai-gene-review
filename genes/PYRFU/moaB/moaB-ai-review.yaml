  label: Pyrococcus furiosus DSM 3638
description: >-
  MoaB (PF0372) of the hyperthermophilic archaeon Pyrococcus furiosus is a molybdopterin
  adenylyltransferase. It transfers AMP from ATP to molybdopterin (MPT) in a Mg2+-dependent
  reaction, forming adenylyl-molybdopterin, the activated intermediate for metal insertion
  during maturation of the tungsten and molybdenum cofactors. It is a 169-residue protein of
  the MoaB/Mog fold, homologous to bacterial MogA and to the G domain of plant Cnx1, and it
  complements an Escherichia coli mogA mutant. The enzyme is a homohexamer, whereas mesophilic
  MogA-type proteins are trimers, and its activity rises up to 20-fold at 80 degrees C.
  Asp56 is essential and Asp32 important for activity. Unlike P. furiosus MoaB, E. coli MoaB
  has no detectable MPT adenylyltransferase activity.
