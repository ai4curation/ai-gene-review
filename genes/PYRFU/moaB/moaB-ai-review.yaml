suggested_questions:
- question: Which P. furiosus protein inserts tungstate into the MPT-AMP made by MoaB, and does
    MoaB form a complex with it as MogA does with MoeA in E. coli?
- question: Which sequence or structural features separate the active P. furiosus MoaB from the
    inactive E. coli MoaB within the same family?
suggested_experiments:
- hypothesis: The P. furiosus MoeA homolog uses MoaB-generated MPT-AMP to insert tungstate.
  description: Reconstitute W-MPT formation from MPT with purified P. furiosus MoaB and the MoeA
    homolog at 80 degrees C, comparing tungstate and molybdate, and detect W-MPT by activation of a
    W-dependent apo-aldehyde oxidoreductase.
