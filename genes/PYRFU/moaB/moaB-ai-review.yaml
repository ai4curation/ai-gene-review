- term:
    id: GO:0006777
    label: Mo-molybdopterin cofactor biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR008284
  - InterPro:IPR012245
  review:
    summary: InterPro2GO mapping of the MoaB and MoCF biosynthesis signatures to Mo-molybdopterin
      cofactor biosynthesis.
    action: MODIFY
    reason: >-
      The participation is real, since MoaB catalyses MPT adenylylation, but the
      molybdenum-specific term is too narrow for this organism. P. furiosus relies on tungsten
      enzymes, and Bevers et al. show that the same adenylyl transfer serves both W and Mo
      cofactor maturation. GO:0006777 is defined as formation of a cofactor with a mononuclear
      molybdenum ion, whereas its parent GO:0032324 covers "a mononuclear molybdenum
      (Mo-molybdopterin) or tungsten ion (W-molybdopterin) coordinated by one or two
      molybdopterin ligands", and GO:0032324 has_part GO:0061598, the MoaB activity. The row is
      generalized to GO:0032324.
    proposed_replacement_terms:
    - id: GO:0032324
      label: molybdopterin cofactor biosynthetic process
    supported_by:
    - reference_id: PMID:18154309
      supporting_text: In summary, MogA, Cnx1G, and MoaB proteins exhibit the same adenylyl
        transfer activity essential for metal insertion in W or Mo cofactor maturation.
    - reference_id: PMID:18154309
      supporting_text: Metal and nucleotide specificity for MPT adenylylation is well conserved
        between W and Mo cofactor synthesis.
