suggested_questions:
- question: >-
    Which specific Bacillus subtilis extracellular peptidase(s) catalyze the
    cleavage of the AimP propeptide (residues 31-37) to release the mature
    hexapeptide SAIRGA?
- question: >-
    Does the N-terminal propeptide fragment (residues 31-37) have any biological
    stability or regulatory role after signal peptidase cleavage, or is it rapidly
    degraded extracellularly?
suggested_experiments:
- description: >-
    Screen a Bacillus subtilis extracellular protease knockout library (including
    aprE, nprE, epr, bpr, mpr, vpr, and wprA mutants) using LC-MS/MS quantification
    of extracellular SAIRGA to identify the host protease(s) responsible for
    maturation of the AimP propeptide.
  hypothesis: >-
    One or more subtilisin-family extracellular serine proteases cleave the AimP
    propeptide after residue 37 to generate the active hexapeptide SAIRGA.
