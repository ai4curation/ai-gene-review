id: P0DOE2
gene_symbol: AimP
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10736
  label: Bacillus phage phi3T
description: >-
  Precursor of the hexapeptide arbitrium communication signal (SAIRGA) in Bacillus
  phage phi3T that mediates intercellular viral communication to regulate the
  lysis-lysogeny decision. Synthesized as a 43-amino-acid preproprotein, AimP is
  secreted from infected Bacillus host cells and cleaved by extracellular proteases
  to release the mature C-terminal hexapeptide SAIRGA into the extracellular medium.
  During subsequent infections, the mature peptide is imported into the host
  cytoplasm via the bacterial oligopeptide permease (OPP) transporter and binds
  directly to the phage transcriptional activator AimR, dissociating the AimR
  homodimer into inactive monomers to repress aimX transcription and promote lysogeny.
