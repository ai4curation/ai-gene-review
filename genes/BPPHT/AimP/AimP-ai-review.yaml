- id: PMID:28099413
  title: Communication between viruses guides lysis-lysogeny decisions.
  findings:
  - statement: >-
      Phage phi3T encodes a 43-aa precursor protein AimP that is secreted and
      proteolytically processed into the 6-aa mature arbitrium peptide SAIRGA.
    supporting_text: >-
      These results imply that the phage-encoded gene we identified is secreted
      and processed into the mature arbitrium communication peptide that further
      affects the phage lysis/lysogeny decision. We denoted this gene aimP.
  - statement: >-
      Mature SAIRGA binds directly to the phi3T AimR receptor and converts it
      from a DNA-binding homodimer into an inactive monomer, promoting lysogeny.
    supporting_text: >-
      These results suggest that the arbitrium peptide transfers the signal via
      alteration of the oligomeric state of its AimR receptor from a DNA binding
      dimer to a peptide-bound, dissociated monomer.
