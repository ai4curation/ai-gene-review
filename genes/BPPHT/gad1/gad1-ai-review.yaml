suggested_questions:
- question: >-
    Does Gad1 assemble into oligomers prior to encountering the host GajAB complex,
    or does it bind sequentially as monomers/dimers onto the GajA core before
    closing the octameric ring via C-terminal cysteine disulfide/packing contacts?
suggested_experiments:
- description: >-
    Use mass photometry and stopped-flow Forster resonance energy transfer (FRET)
    with fluorescently labeled Gad1 and GajAB to resolve the oligomeric state of
    free Gad1 and the assembly kinetics of the 4:4:8 GajAB-Gad1 complex.
  hypothesis: >-
    Gad1 exists predominantly as monomers or dimers in solution and undergoes
    cooperative templated oligomerization upon binding the GajA dimer-of-dimers
    surface.
