taxon:
  id: NCBITaxon:10736
  label: Bacillus phage phi3T
description: >-
  Anti-defense protein (Gabija anti-defense 1, Gad1) in Bacillus phage phi3T that
  inactivates the bacterial Gabija (GajAB) antiphage immune system. Gad1 directly
  binds the host 4:4 GajAB nucleotide-sensing endonuclease complex, assembling into
  an eight-subunit octameric web around the complex to form a 4:4:8 GajAB-Gad1
  assembly. This encasement sterically blocks the GajA Toprim endonuclease
  DNA-binding site, preventing target DNA recognition and cleavage and enabling
  phage replication in Gabija-expressing hosts.
