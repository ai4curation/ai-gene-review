suggested_questions:
- question: >-
    Does phage phi3T thymidylate synthase (thyP3) assemble into a multi-enzyme
    replication metabolon with phage- or host-encoded dihydrofolate reductase
    and deoxyCMP deaminase during lytic infection?
suggested_experiments:
- description: >-
    Perform affinity purification coupled to mass spectrometry (AP-MS) of
    epitope-tagged ThyP3 expressed from phage phi3T during lytic infection of
    Bacillus subtilis.
  hypothesis: >-
    ThyP3 physically associates with dihydrofolate reductase and nucleotide
    kinases to channel dTMP toward dTTP synthesis at phage replication forks.
