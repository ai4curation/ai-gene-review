  label: Bacillus phage phi3T
description: >-
  Homodimeric thymidylate synthase (EC 2.1.1.45) in Bacillus phage phi3T that
  catalyzes the reductive methylation of dUMP by
  (6R)-5,10-methylene-5,6,7,8-tetrahydrofolate to yield dTMP and
  7,8-dihydrofolate. By providing a phage-encoded de novo source of dTMP, thyP3
  supports thymidine nucleotide supply for viral DNA replication and can
  complement thymidylate synthase deficiency in Bacillus subtilis hosts.
