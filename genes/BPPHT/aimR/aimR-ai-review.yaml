suggested_questions:
- question: >-
    How does DNA-bound AimR recruit or stabilize host Bacillus subtilis RNA
    polymerase at the aimX promoter, and which sigma factor directs aimX
    transcription?
suggested_experiments:
- description: >-
    Perform in vitro transcription and cryo-EM single-particle reconstruction of
    the phi3T AimR homodimer bound to the aimP-aimX operator DNA together with
    Bacillus subtilis RNA polymerase holoenzyme.
  hypothesis: >-
    The AimR homodimer contacts the C-terminal domain of the RNA polymerase alpha
    subunit or sigma-A to recruit RNA polymerase to the aimX promoter.
