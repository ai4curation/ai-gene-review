core_functions:
- description: >-
    Functions as a peptide-regulated DNA-binding transcriptional activator that
    binds a phage operator site downstream of aimP as a homodimer to activate
    aimX transcription and promote lytic development, until binding of the
    arbitrium hexapeptide SAIRGA dissociates the dimer into monomers to promote
    lysogeny.
  molecular_function:
    id: GO:0003700
    label: DNA-binding transcription factor activity
  directly_involved_in:
  - id: GO:0098689
    label: latency-replication decision
  supported_by:
  - reference_id: PMID:28099413
    supporting_text: >-
      Sequencing of the DNA bound to AimR clearly showed that AimR binds a single
      site in the phage genome, directly downstream of the aimP gene (Fig 5A, 5B).
      Moreover, this binding only occurred when the arbitrium peptide was lacking
      from the medium, suggesting that binding of the arbitrium peptide to its AimR
      receptor leads to dissociation of the receptor from its binding site on the
      phage DNA.
  - reference_id: PMID:28099413
    supporting_text: >-
      The above results suggest that AimR, when bound to the phage DNA as a dimer
      in the absence of the arbitrium peptide, is a transcriptional activator of
      AimX.
