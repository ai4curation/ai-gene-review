id: P0DOE3
gene_symbol: aimR
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10736
  label: Bacillus phage phi3T
description: >-
  Intracellular peptide receptor and DNA-binding transcriptional activator of the
  arbitrium communication system in Bacillus phage phi3T that governs the
  latency-replication (lysis-lysogeny) decision. In the absence of the cognate
  AimP-derived arbitrium hexapeptide (SAIRGA), AimR forms a homodimer that binds a
  single site downstream of aimP in the phage genome and activates transcription of
  the non-coding regulator aimX to promote lytic replication. Binding of imported
  SAIRGA to the C-terminal TPR-like domain of AimR dissociates the homodimer into
  inactive monomers, abolishing DNA binding and aimX transcription to favor lysogeny.
existing_annotations:
- term:
    id: GO:0098689
    label: latency-replication decision
  evidence_type: IDA
  original_reference_id: PMID:28099413
  qualifier: involved_in
  review:
    action: ACCEPT
    reason: >-
      ChIP-seq, dCas9 silencing, and biochemical assays in PMID:28099413 directly
      demonstrate that AimR is the transcriptional switch that activates aimX to
      promote lysis in the absence of SAIRGA and dissociates from DNA upon SAIRGA
      binding to promote lysogeny.
    supported_by:
    - reference_id: PMID:28099413
      supporting_text: >-
        The above results suggest that AimR, when bound to the phage DNA as a dimer
        in the absence of the arbitrium peptide, is a transcriptional activator of
        AimX. Indeed, when AimR was silenced using dCas9, the expression of AimX
        was dramatically reduced (Fig 5D). Moreover, silencing of AimR resulted in
        increased lysogeny, suggesting that binding of AimR to the phage DNA
        inhibits lysogeny (or promotes lysis), possibly by activating the
        expression of AimX (Fig 5H).
