  label: Bacillus phage phi3T
description: >-
  Multispecific orphan DNA (cytosine-5-)-methyltransferase (M.Phi3TI) in Bacillus
  phage phi3T that catalyzes the S-adenosyl-L-methionine-dependent methylation of
  the internal cytosine C5 atom within both 5'-GGCC-3' and 5'-GCNGC-3' recognition
  sequences. Target sequence recognition is mediated by two tandem, non-overlapping
  ~50-amino-acid target-recognizing domains (TRDs) located within the C-terminal
  variable region of the enzyme. Methylation of these sites protects phage DNA
  from cleavage by host Bacillus subtilis restriction endonucleases such as BsuRI.
