suggested_questions:
- question: >-
    How does the single catalytic C5-methyltransferase core of M.Phi3TI
    alternately engage the two tandem ~50-aa target-recognizing domains (TRDs)
    when binding 5'-GCNGC-3' versus 5'-GGCC-3' DNA substrates?
suggested_experiments:
- description: >-
    Determine X-ray crystal or cryo-EM structures of M.Phi3TI in complex with
    S-adenosyl-L-homocysteine and DNA duplexes containing either 5'-GGCC-3' or
    5'-GCNGC-3' target sites.
  hypothesis: >-
    A flexible hinge between the two tandem TRDs allows one TRD at a time to
    dock into the major groove at the catalytic cleft while the non-engaged TRD
    is displaced away from the DNA axis.
