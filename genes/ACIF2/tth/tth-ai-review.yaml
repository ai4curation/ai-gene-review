    action: UNDECIDED
    reason: >-
      This EXP row derives from the Swiss-Prot subcellular location "Cell membrane" (SL-0039).
      The UniProt RP line for PubMed:17904676 lists "SUBCELLULAR LOCATION" among the topics taken
      from that paper, so a Swiss-Prot curator read its full text and chose "Cell membrane" with
      the note "Membrane-associated" rather than a generic "Membrane". Only the abstract of
      PMID:17904676 is cached here and it does not describe the fractionation, so I cannot see
      what the curator saw and do not overrule it. Evidence pointing elsewhere: the gene product
      was first isolated as a sulfur-induced outer membrane protein (PMID:10406099, strain MSR,
      abstract only); the Kanao laboratory later states that Af-Tth is localized in the outer
      membrane (PMID:20546308) and its 2024 review calls it an outer membrane peripheral protein
      also found in culture supernatant (PMID:38348185); the mature chain has no transmembrane
      segment, and in a Gram-negative bacterium GO plasma membrane denotes the inner membrane.
      Evidence cutting against an outer-membrane call: PMID:21833324 (2011, an independent group,
      published after Kanao 2007 and 2010) states that "to date its subcellular location is not
      clear", summarising earlier reports of it as an outer membrane protein, as a soluble and
      probably periplasmic protein, and as membrane-associated (citing Kanao 2007 for the last),
      and the 2024 review's own Table 1 gives the localization of the ATCC 23270 enzyme only as
      "membrane" and lists another A. ferrooxidans strain (ATCC 19859) whose enzyme is
      periplasmic. None of the outer-membrane statements I can read reports an inner/outer
      membrane separation. The weight of later evidence favours the outer membrane, which is
      asserted separately as a NEW GO:0009279 row, but a plasma-membrane fraction in the 2007
      full text cannot be excluded from what is available, so this row stays UNDECIDED.
