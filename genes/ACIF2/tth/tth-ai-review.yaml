        purified from tetrathionate-grown cells.
    - reference_id: PMID:25144400
      supporting_text: catalyzes tetrathionate hydrolysis to generate elemental sulfur, thiosulfate,
        and sulfate
    - reference_id: PMID:33103311
      supporting_text: 4THase activity was completely abolished in the site-specific Af-Tth D325N
        variant, suggesting that Asp325 plays a crucial role in the first step of tetrathionate
