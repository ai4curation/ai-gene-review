proposed_new_terms:
- proposed_name: tetrathionate hydrolase activity
  proposed_definition: 'Catalysis of the reaction: tetrathionate + H2O = sulfur + thiosulfate
    + sulfate + H+.'
  justification: >-
    Tetrathionate hydrolase (EC 3.12.1.-, RHEA:13541) is a well-characterised enzyme of
    acidophilic sulfur-oxidizing bacteria and archaea (Acidithiobacillus, Acidiphilium, Acidianus,
    Metallosphaera), with a solved structure and genetic evidence in A. ferrooxidans, but GO has
    no corresponding activity term; annotation currently stops at GO:0016828.
  proposed_parent:
    id: GO:0016828
    label: hydrolase activity, acting on sulfur-sulfur bonds
  supported_by:
  - reference_id: file:ACIF2/tth/tth-uniprot.txt
    record_section: ["CC:CATALYTIC ACTIVITY"]
    supporting_text: Reaction=tetrathionate + H2O = sulfur + thiosulfate + sulfate + H(+);
suggested_questions:
- question: Is the "Cell membrane" localization in UniProt based on a fractionation in PMID:17904676
    that distinguished inner from outer membrane, or only on membrane association?
- question: How is Af-Tth released to the medium (Sec export then outer-membrane shedding, outer
    membrane vesicles, or a dedicated secretion system), and is the released pool physiologically
    significant during mineral leaching?
- question: Is the reported tetrathionate-dependent ferric reductase activity (PMID:19502725) an
    intrinsic catalytic activity or a chemical reaction of reactive sulfur products with Fe3+?
suggested_experiments:
- description: Separate inner and outer membranes of tetrathionate-grown ATCC 23270 by sucrose density
    gradient with marker proteins and immunoblot for Af-Tth, including high-salt/carbonate washes.
  hypothesis: Af-Tth is a peripheral outer-membrane protein absent from inner-membrane fractions.
  experiment_type: subcellular fractionation and immunoblotting
