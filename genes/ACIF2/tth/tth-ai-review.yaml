  original_reference_id: PMID:17904676
  review:
    summary: >-
      Purified native and refolded recombinant Af-Tth hydrolyse tetrathionate (an S-S bond
      cleavage) to sulfur, thiosulfate and sulfate; no more specific GO term exists.
    action: NEW
    reason: >-
      Tetrathionate hydrolysis (RHEA:13541, EC 3.12.1.-) has no GO term; GO:0016828 is the most
