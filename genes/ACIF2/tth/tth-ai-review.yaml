- id: PMID:17904676
  title: Identification of a gene encoding a tetrathionate hydrolase in Acidithiobacillus
    ferrooxidans.
  findings:
  - statement: Tetrathionate hydrolase purified from tetrathionate-grown A. ferrooxidans
      ATCC 23270 is a homodimer of ~50 kDa subunits with an acidic pH optimum, and the encoding
      ORF (AFE_0029) was identified from its N-terminal sequence.
    supporting_text: A 4THase having a dimeric structure of identical 50kDa polypeptides was
      purified from tetrathionate-grown cells. The 4THase showed the maximum activity at pH 3.0
      and high stability under acidic conditions.
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed abstract matches; establishes enzyme identity. Abstract does not state
      the membrane localization behind the UniProt "Cell membrane" assignment.
- id: PMID:25144400
  title: The sole cysteine residue (Cys301) of tetrathionate hydrolase from Acidithiobacillus
    ferrooxidans does not play a role in enzyme activity.
  findings:
  - statement: C301A mutant has wild-type activity and dimerization; mechanism is cysteine-independent.
    supporting_text: the sole cysteine residue (Cys301) in Af-Tth is involved in neither the
      tetrathionate hydrolysis reaction nor the subunit assembly
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
- id: PMID:33103311
  title: Reaction mechanism of tetrathionate hydrolysis based on the crystal structure of
    tetrathionate hydrolase from Acidithiobacillus ferrooxidans.
  findings:
  - statement: Af-Tth is a homodimeric eight-bladed beta-propeller; Asp325 is essential for activity.
    supporting_text: Af-Tth is a homodimer, and its monomer structure exhibits an eight-bladed
      β-propeller motif.
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
- id: PMID:23722856
  title: Crystallization and preliminary X-ray diffraction analysis of tetrathionate hydrolase
    from Acidithiobacillus ferrooxidans.
  findings:
  - statement: The tth gene product was previously described as a sulfur-regulated outer membrane
      protein; proposed reaction produces sulfate and disulfane monosulfonic acid.
    supporting_text: It is speculated that sulfate and a chemically unstable compound, disulfane
      monosulfonic acid (HS 2 SO 3 − ), are generated during the hydrolysis of tetrathionate by
      4THase.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
- id: PMID:20546308
  title: Recombinant tetrathionate hydrolase from Acidithiobacillus ferrooxidans requires exposure
    to acidic conditions for proper folding.
  findings:
  - statement: Refolded recombinant Af-Tth is active without PQQ; the enzyme is localized in the
      outer membrane.
    supporting_text: No cofactor such as pyrroloquinoline quinone (PQQ) was required during the
      refolding process in spite of the similarity in the primary structure of Af-Tth to the PQQ
      family of proteins.
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
- id: PMID:10406099
  title: A novel gene encoding a sulfur-regulated outer membrane protein in Thiobacillus ferrooxidans.
  findings:
  - statement: The gene was first cloned as encoding a 54 kDa sulfur-induced outer membrane protein
      with a 32-residue signal peptide.
    supporting_text: The mature protein was produced by the removal of a 32 amino acid signal
      peptide-like sequence from the N-terminus of a 499 amino acid peptide.
    full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Strain is T. ferrooxidans MSR (per PMID:38348185), not ATCC 23270; the 499-aa
      precursor and 32-aa signal peptide match B7J3C9.
- id: PMID:21833324
  title: Growth of Acidithiobacillus Ferrooxidans ATCC 23270 in Thiosulfate Under Oxygen-Limiting
