- term:
    id: GO:0005576
    label: extracellular region
  evidence_type: IDA
  original_reference_id: PMID:21833324
  review:
    summary: >-
      TetH protein was identified by mass spectrometry in filtered culture supernatants of
      ATCC 23270 and extracellular tetrathionate hydrolase activity was measured there.
    action: NEW
    reason: >-
      Direct detection of the protein (MALDI-TOF MS) and its activity in cell-free culture
      medium supports a released/extracellular pool in addition to the outer-membrane-bound
      form. The mechanism of release (secretion, outer-membrane vesicles or shedding) is not
      established, so this is kept as a non-core location; the core location is the cell
      outer membrane.
    supported_by:
    - reference_id: PMID:21833324
      supporting_text: supernatants from both OSC- and OLC-incubated cells showed extracellular
        TTH activity, which most likely accounted for tetrathionate consumption in the culture
        medium.
    - reference_id: PMID:21833324
      supporting_text: Protein band No. 1 corresponded to TetH protein of A. ferrooxidans ATCC
        53993, which is identical to TetH from A. ferrooxidans ATCC 23270 used in this study
- term:
    id: GO:0044273
    label: sulfur compound catabolic process
  evidence_type: IMP
  original_reference_id: PMID:24727223
  review:
    summary: >-
      Af-Tth catalyses the hydrolytic step of dissimilatory tetrathionate/thiosulfate oxidation
      (S4-intermediate pathway); a tetH deletion abolishes growth on tetrathionate.
    action: NEW
    reason: >-
      The participation test is met: the gene product itself catalyses a step (tetrathionate
      hydrolysis) of reduced inorganic sulfur compound metabolism, and the knockout shows it is
      the only enzyme doing so in the cell. GO has no term for tetrathionate catabolism or
      dissimilatory RISC oxidation; GO:0019417 sulfur oxidation (oxidation of elemental sulfur)
      and GO:0019416 thiosulfate oxidation (thiosulfate to tetrathionate) describe other steps
      and are carried by other enzymes (e.g. TQO/DoxDA for the latter). Hydrolysis of
      tetrathionate to sulfur, thiosulfate and sulfate is a breakdown of a sulfur compound, so
      GO:0044273 sulfur compound catabolic process (breakdown of compounds that contain sulfur)
      fits and is one level more specific than GO:0006790 sulfur compound metabolic process; it
      is the most specific available process term.
    additional_reference_ids:
    - PMID:38348185
    supported_by:
    - reference_id: PMID:24727223
      supporting_text: The ΔtetH mutant could not grow on tetrathionate but could proliferate
        on sulfur with a lower cell yield than the wild type's, which indicated that tetrathionate
        hydrolysis is mediated only by TetH, encoded by tetH.
    - reference_id: PMID:38348185
      supporting_text: TTH, which catalyzes tetrathionate hydrolysis, is a unique enzyme that
        cooperates with TQO and/or TSD to function in the S4I pathway for RISC oxidation, particularly
        of thiosulfate
