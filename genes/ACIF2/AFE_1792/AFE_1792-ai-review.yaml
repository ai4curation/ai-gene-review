- term:
    id: GO:0019646
    label: aerobic electron transport chain
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN002873011
  review:
    summary: >-
      TreeGrafter transfer. As a quinone-reducing dehydrogenase, SQR feeds
      sulfide-derived electrons into the respiratory quinone pool and on to
      terminal oxidases. That is plausible participation for an aerobe, but not
      shown in vivo.
    action: KEEP_AS_NON_CORE
    reason: >-
      SQR does some of the work of a respiratory chain: it reduces quinone, the
      first carrier of the chain, from an inorganic donor, much as type II NADH
      dehydrogenases do from NADH. Cherney et al. frame the enzyme as part of
      sulfidotrophic respiration, and A. ferrooxidans respires aerobically.
      The term is defined by transfer to oxygen, with NADH and FADH2 only as
      example donors, so an SQR-fed chain fits it; but the claim has not
      been tested for AFE_1792 in cells, where other sulfur-oxidizing enzymes
      and SQR paralogs exist. It is kept as non-core context, not as the gene's
      core role.
    supported_by:
    - reference_id: PMID:20303979
      supporting_text: these oxidations are coupled to the reduction of ubiquinone
        or menaquinone
    - reference_id: PMID:22542586
      supporting_text: The electrons from sulfides are transferred first to the
        enzyme cofactor, FAD, which, in turn, passes them onto the quinone pool
        in the membrane.
- term:
