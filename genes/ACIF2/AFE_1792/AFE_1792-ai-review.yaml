- term:
    id: GO:0071949
    label: FAD binding
  evidence_type: IDA
  original_reference_id: PMID:20303979
  review:
    summary: >-
      The enzyme binds one FAD per subunit, seen in all crystal structures, and
      FAD is the redox cofactor of both half-reactions.
    action: NEW
    reason: >-
      Crystal structures of the target protein resolve a bound FAD (one per
      subunit, noncovalent, in the N-terminal Rossmann domain), and FAD
