id: B7JBP8
gene_symbol: AFE_1792
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:243159
  label: Acidithiobacillus ferrooxidans ATCC 23270
description: >-
  AFE_1792 encodes a Type I (SqrA) sulfide:quinone oxidoreductase (SQR) of the
  acidophilic iron- and sulfur-oxidizing bacterium Acidithiobacillus
  ferrooxidans. The enzyme is a homodimeric FAD flavoprotein with two tandem
  Rossmann-fold domains and a C-terminal pair of amphipathic helices, through
  which it is thought to attach monotopically to the cytoplasmic membrane. It
  oxidizes hydrogen sulfide to polysulfide chains and eventually
  cyclooctasulfur, and passes the electrons through FAD to membrane ubiquinone
  or menaquinone. Catalysis depends on a cysteine triad: Cys356 and Cys160 form
  the persulfide/polysulfide-bearing pair beside the FAD, and Cys128 is needed
  for the quinone reduction step. Activity, kinetics, crystal structures and
  mutagenesis come from the recombinant enzyme made in Escherichia coli. Its
  physiological contribution in A. ferrooxidans cells, which carry other
  SQR-family paralogs such as AFE_0267, has not been tested genetically.
