    label: sulfide:quinone oxidoreductase activity
  evidence_type: EXP
  original_reference_id: PMID:20303979
  qualifier: enables
  review:
    summary: >-
      Core activity. The recombinant enzyme oxidizes sulfide with
      decylubiquinone as acceptor, with KM values of 2.8 uM (sulfide) and 22 uM
      (decylubiquinone), and the active-site cysteines were identified by
      structure and mutagenesis.
    action: ACCEPT
    reason: >-
      This is direct biochemical evidence on the target protein (expressed in
      E. coli). The crystal structures with bound decylubiquinone and a
      polysulfide bridge on the active-site cysteines, together with the
      Cys356Ala and Cys160Ala loss-of-activity variants, fix this as the
      enzyme's catalytic function.
