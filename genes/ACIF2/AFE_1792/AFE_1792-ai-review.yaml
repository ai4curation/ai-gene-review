  findings:
  - statement: >-
      Crystal structures of the recombinant A. ferrooxidans SQR (native,
      decylubiquinone-bound and Cys160Ala) show a dimer with noncovalent FAD,
      membrane-anchoring amphipathic C-terminal helices, and a polysulfide
      bridge on the active-site cysteines.
    supporting_text: Two active-site cysteine residues situated on the re side
      of the FAD cofactor form a branched polysulfide bridge.
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed abstract checked. This is the primary structure and activity paper
      for this Swiss-Prot entry. UniProt attributes it to B7JBP8 (AFE_1792),
      and the B7JBP8 secondary-structure features derive from PDB 3SX6 of this
      group. Abstract only in the cache.
- id: PMID:22542586
  title: Structure-activity characterization of sulfide:quinone oxidoreductase variants.
  findings:
  - statement: >-
      Active-site variants dissect the two half-reactions: sulfide to FAD
      (Cys356, Cys160) and FAD to quinone (Cys128 and neighbours).
    supporting_text: In order to understand the role of the catalytically essential
      residues in the enzymatic mechanism of SQR we produced a number of variants
      of the conserved residues in the catalytic site including the cysteine triad
      of SQR from the acidophilic, chemolithotrophic bacterium Acidithiobacillus
      ferrooxidans.
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed abstract checked; mutagenesis details from the curated
      UniProt MUTAGEN features (ECO:0000269 from this PMID).
- id: PMID:23103448
  title: Characterization of the Type III sulfide:quinone oxidoreductase from Caldivirga
    maquilingensis and its membrane binding.
  findings:
  - statement: >-
      Places the structurally characterized A. ferrooxidans SQR in Type I
      (SqrA), with the Aquifex aeolicus enzyme, and lists the Type I hallmarks
      (flavin-linked cysteine, capping loop 2, elongated C-terminus).
    supporting_text: The greatest amount of information is available for the Type
      I SQRs (SqrA), which includes those from A. aeolicus and A. ferrooxidans, for
      which structures are known.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text cached; used for the SQR type definitions.
- id: PMID:20077566
  title: A new structure-based classification of sulfide:quinone oxidoreductases.
  findings:
  - statement: Defines the six structure-based SQR groups (Types I-VI) used here.
    supporting_text: we define new structure-based sequence fingerprints that support
