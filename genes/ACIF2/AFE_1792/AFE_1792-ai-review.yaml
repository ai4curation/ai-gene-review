  review:
    summary: >-
      Correct but general. The SQR is a monotopic or peripheral protein of the
      cytoplasmic (plasma) membrane, where it reduces the respiratory quinone
      pool.
    action: MODIFY
    reason: >-
      Two independent lines support plasma membrane over generic membrane.
      First, the structure shows C-terminal amphipathic helices thought to
      anchor the dimer in a membrane. Second, the enzyme's electron acceptor is
      the membrane quinone pool, which in Gram-negative Acidithiobacillus lies
      in the cytoplasmic membrane. Acidithiobacillus genome analyses also place
      SQR in the cytoplasmic membrane. The membrane has not been fractionated
      experimentally in A. ferrooxidans, so the more specific term is an
      inference, but it is the only membrane consistent with the function.
    proposed_replacement_terms:
    - id: GO:0005886
      label: plasma membrane
    supported_by:
    - reference_id: PMID:20303979
      supporting_text: The enzyme comprises two tandem Rossmann fold domains and
        a flexible C-terminal domain encompassing two amphipathic helices that
        are thought to provide for membrane anchoring.
    - reference_id: PMID:22542586
      supporting_text: Sulfide:quinone oxidoreductase (SQR) is a peripheral membrane
