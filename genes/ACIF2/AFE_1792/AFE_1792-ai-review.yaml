suggested_questions:
- question: >-
    Which of the A. ferrooxidans SQR-family genes (AFE_1792, the Type I enzyme
    characterized in vitro, or AFE_0267, the "sqr" named in the genome paper)
    carries most sulfide-oxidizing activity in cells grown on sulfur or sulfide
    minerals?
- question: >-
    Does PANTHER's placement of AFE_1792 (PTHR42913:SF6) versus its 87-94%
    identical Acidithiobacillus orthologs (PTHR43755:SF1) reflect a real tree
    split or a classification artefact?
suggested_experiments:
- description: >-
    Delete AFE_1792 and AFE_0267 separately and together in A. ferrooxidans,
    then measure membrane sulfide:decylubiquinone activity and growth or
    leaching on S0 and pyrite, to assign each paralog's in vivo contribution.
  experiment_type: gene knockout with membrane enzyme assays
