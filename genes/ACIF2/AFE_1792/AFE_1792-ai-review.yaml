      includes the oxidation of sulfide compounds H(2)S, HS(-), and S(2-) to soluble
      polysulfide chains or to elemental sulfur in the form of octasulfur rings;
      these oxidations are coupled to the reduction of ubiquinone or menaquinone.
  - reference_id: PMID:22542586
    supporting_text: The electrons from sulfides are transferred first to the enzyme
