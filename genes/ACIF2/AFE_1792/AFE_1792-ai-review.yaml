- id: file:ACIF2/AFE_1792/AFE_1792-bioinformatics/RESULTS.md
  title: SQR type assignment for five acidophile sulfide:quinone oxidoreductase entries
  findings:
  - statement: >-
      B7JBP8 is 41.9% identical to the Aquifex Type I SQR and conserves the Type
      I cysteine triad. PANTHER places it in PTHR42913:SF6, whereas its 87-94%
      identical Acidithiobacillus orthologs are placed in PTHR43755:SF1.
core_functions:
- description: >-
    Type I sulfide:quinone oxidoreductase. It oxidizes hydrogen sulfide to
    polysulfide/S8 at a cysteine pair beside FAD and passes the electrons to
    membrane quinone on the cytoplasmic membrane, supplying sulfide-derived
    electrons to the quinone pool.
  molecular_function:
    id: GO:0070224
    label: sulfide:quinone oxidoreductase activity
