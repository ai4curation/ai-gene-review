- term:
    id: GO:0070224
    label: sulfide:quinone oxidoreductase activity
  evidence_type: EXP
  original_reference_id: PMID:22542586
  qualifier: enables
  review:
    summary: >-
      Core activity. Variant enzymes were assayed separately for the sulfide-to-FAD
      and FAD-to-quinone half-reactions.
    action: ACCEPT
    reason: >-
      Cys356Ala abolishes FAD reduction and overall activity. Cys160Ala strongly
      reduces FAD reduction. Cys128 and the nearby Ser126/His132/His198 variants
      leave FAD reduction intact but impair quinone reduction. This dissects the
      two-step SQR reaction on the target protein itself.
    supported_by:
    - reference_id: PMID:22542586
      supporting_text: The enzymatic reaction proceeds in two steps. The electrons
        from sulfides are transferred first to the enzyme cofactor, FAD, which,
        in turn, passes them onto the quinone pool in the membrane.
    - reference_id: file:ACIF2/AFE_1792/AFE_1792-uniprot.txt
      record_section: ["FT:MUTAGEN"]
      supporting_text: 'C->A: Complete loss of enzyme activity. Abolishes
        enzyme FAD reduction. Abolishes activity with
        decylubiquinone.'
