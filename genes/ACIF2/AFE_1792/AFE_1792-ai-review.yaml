  review:
    summary: >-
      TreeGrafter transfer from a PTHR42913 ancestral node shared with
      NDH-2/AIF-like NAD(P)H:quinone oxidoreductases. The characterized enzyme
      takes electrons from sulfide, not NAD(P)H.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      B7JBP8 sits in PTHR42913:SF6, the SQR subfamily of a family that is
      otherwise dominated by NADH:quinone oxidoreductases (InterPro IPR051169).
      The crystal structures, kinetics and mutagenesis of the recombinant enzyme
      all describe a sulfide-dependent reaction: electrons pass from sulfide
      through the Cys356/Cys160 pair to FAD and then to quinone. KM values are
      reported for sulfide and decylubiquinone only. No study reports NAD(P)H as
      a substrate. In the related Type V A. ambivalens SQR, NADH oxidase
      activity was an artefact of a C-terminally truncated protein. The quinone
      reductase half of the term is true, but the NAD(P)H electron donor is
      inherited from the ancestral family function and is not supported for this
      subfamily. The row is kept as an over-annotation, not removed, because
      NAD(P)H activity has never been tested directly.
    supported_by:
