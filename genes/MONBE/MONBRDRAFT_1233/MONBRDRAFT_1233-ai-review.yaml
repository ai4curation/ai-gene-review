  review:
    summary: >-
      IBA from the PAINT IBD at PTN000683254, a deep AGC-kinase node whose descendants
      include animal, fungal and plant Ser/Thr kinases with experimental activity,
      including human LATS1/2 and Drosophila wts. A9UVF9 is in PANTHER subfamily
      PTHR24356:SF418 (Warts) and retains an intact kinase domain with the ATP-binding
      lysine and catalytic aspartate. In animals Warts/LATS phosphorylates Yorkie/YAP on
      HXRXXS motifs [PMID:35659869].
    action: ACCEPT
    reason: >-
      This is the core molecular activity of a Warts/LATS kinase. The IBD sits at a deep
      node that the M. brevicollis protein clearly descends from, and the catalytic
      residues are conserved, so there is no sign of loss of activity. The gene model is
      a fragment lacking the AGC C-terminal hydrophobic motif needed for full activation of
      animal LATS kinases; if this reflects the real gene rather than the draft assembly,
      regulation could differ, but the catalytic domain is intact. Activity has not been
      assayed for this protein.
    supported_by:
    - reference_id: file:MONBE/MONBRDRAFT_1233/MONBRDRAFT_1233-uniprot.txt
      supporting_text: PANTHER; PTHR24356:SF418; SERINE_THREONINE-PROTEIN KINASE WARTS; 1.
    - reference_id: file:MONBE/MONBRDRAFT_1233/MONBRDRAFT_1233-uniprot.txt
