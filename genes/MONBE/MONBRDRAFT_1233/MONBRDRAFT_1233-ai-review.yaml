  review:
    summary: >-
      IBA from the PAINT IBD at PTN002390470, the Warts/LATS "Metazoa-Choanoflagellida"
      node, seeded by mouse Lats2 and human LATS2 cell-cycle evidence. There are no
      cell-cycle data for M. brevicollis Warts. In the closest tested choanoflagellate,
      S. rosetta, warts knockout cells proliferate more slowly, the reverse of the animal
      loss-of-function phenotype [DOI:10.1101/2024.07.13.603360].
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      G1/S transition is a eukaryote-wide process, so this is not a taxon violation, and
      choanoflagellates do have a mitotic cell cycle. But the IBD rests on a vertebrate
      LATS2 role, and nothing places choanoflagellate Warts in G1/S control: S. rosetta
      warts loss slows rather than accelerates proliferation, and in M. brevicollis the
      upstream kinase and the Yorkie phosphorylation sites appear to be lost. Kept as an
      over-annotation rather than removed, consistent with the S. rosetta warts review,
      because no data contradict the node placement directly.
    supported_by:
    - reference_id: DOI:10.1101/2024.07.13.603360
      supporting_text: >-
        On the other hand, hippopac1 and warts pac1 KO clones proliferated markedly slower
    - reference_id: DOI:10.1101/2024.07.13.603360
      supporting_text: >-
        down proliferation in S. rosetta, which is the opposite of their animal
        loss-of-function phenotype
