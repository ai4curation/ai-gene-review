  review:
    summary: >-
      IBA from the PAINT IBD at PTN002390470 (Warts/LATS, "Metazoa-Choanoflagellida"),
      seeded by Drosophila wts, mouse Lats1/2 and human LATS1/2. The node placement is
      supported by evidence that the Hippo-Warts-Yorkie cascade predates animals: in
      Capsaspora, loss of the Warts homolog lets the Yorkie homolog enter the nucleus
      [PMID:38517944], and the S. rosetta Yorkie homolog carries four Warts motifs
      [PMID:38729842]. But M. brevicollis itself shows signs of losing the pathway: a Hpo
      homolog was not found in its genome [PMID:22832104], the Hippo gene model that was
      later identified is predicted to be truncated at the start of its kinase domain, and
      M. brevicollis Yorkie lacks a consensus HXRXXS Warts motif [PMID:38729842]. No
      experiment has addressed Warts function in M. brevicollis.
    action: UNDECIDED
    reason: >-
      The IBD itself is sound and was accepted for S. rosetta warts. The question here is
      whether this particular descendant still takes part in the cascade. M. brevicollis
      has target-specific comparative-genomic evidence of divergence (no intact Hippo, no
      consensus Warts site on Yorkie), and the authors suggest it may have lost Hippo
      regulation of Yorkie. That argues against inheritance in this lineage, but it is a
      sequence-based prediction from a draft assembly that also produced this fragmentary
      Warts model, and Warts could be activated by other upstream kinases or act on other
      substrates. Neither accepting nor removing is justified without data, so the row is
      left undecided and not counted as a core function.
    supported_by:
    - reference_id: PMID:38729842
      supporting_text: >-
        Further, the M. brevicollis Hippo gene contains an insertion that is predicted to
        truncate the protein at the beginning of the kinase domain
    - reference_id: PMID:38729842
      supporting_text: >-
        Thus M. brevicollis may be an example of an organism that encodes a Yorkie ortholog
        but has lost the capacity to be regulated by Hippo pathway signaling.
    - reference_id: PMID:22832104
      supporting_text: >-
        except for M. brevicollis and non-chytrid fungi, most likely due to secondary loses
    - reference_id: PMID:38517944
      supporting_text: >-
        Together, these results show that the Capsaspora Hippo kinase cascade regulates
        coYki by cytoplasmic sequestration, indicating a premetazoan origin of this
        regulatory activity of the Hippo pathway.
    propagation_review:
      root_cause: UNRESOLVED
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: PANTHER:PTN002390470
        source_label: Warts/LATS, Metazoa-Choanoflagellida node
        source_status: UNRESOLVED
        comment: >-
          IBD well supported by fly and mammalian Warts/LATS and consistent with Capsaspora
          data, but M. brevicollis shows predicted loss of Hippo and of Warts sites on
          Yorkie, so inheritance in this lineage is uncertain.
