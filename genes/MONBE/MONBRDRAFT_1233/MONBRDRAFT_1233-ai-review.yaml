- term:
    id: GO:0046620
    label: regulation of organ growth
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:1354386
  - PANTHER:PTN002390470
  review:
    summary: >-
      IBA from the IBD at PTN002390470 seeded by mouse Lats2. GO defines the term as
      modulating the growth of an organ of an organism; it is a child of regulation of
      developmental growth. M. brevicollis is strictly unicellular [PMID:18273011] and has
      no organs. The GO taxon constraints on this term do not exclude choanoflagellates, so
      nothing in the pipeline blocks the transfer.
    action: REMOVE
    reason: >-
      An organ is a multicellular structure of an animal or plant body. A strictly
      unicellular organism has none, so the term cannot be true of this protein whatever
      its function. The mouse source annotation is sound; the fault is that an organ-level
      outcome was placed at a node that includes unicellular choanoflagellates. Removed,
      as for S. rosetta warts; no replacement is proposed, because M. brevicollis does not
      even form rosettes.
    supported_by:
    - reference_id: PMID:18273011
      supporting_text: >-
        Although M. brevicollis is strictly unicellular, other choanoflagellates
        facultatively form colonies
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - LINEAGE_OR_TAXON_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN002390470
