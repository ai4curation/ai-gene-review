aliases:
- Warts
- Wts
- LATS homolog
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:81824
  label: Monosiga brevicollis
description: >-
  MONBRDRAFT_1233 encodes the Warts/LATS-family (NDR subgroup, AGC group)
  serine/threonine protein kinase of the strictly unicellular choanoflagellate Monosiga
  brevicollis. The UniProt entry (A9UVF9, 380 residues) is a fragment from the draft
  genome assembly, truncated at both ends: it covers the protein kinase domain (residues
  78-368, with the ATP-binding lysine K107 and catalytic aspartate D201) plus short
  flanking segments, but lacks the N-terminal region that in LATS kinases binds MOB1 and
  the AGC-kinase C-terminal extension with the hydrophobic-motif phosphorylation site. It
  is the only M. brevicollis member of the PANTHER Warts subfamily, which includes human
  LATS1/2 and Drosophila Warts. In animals Warts/LATS, activated by Hippo, phosphorylates
  the coactivator Yorkie/YAP on HXRXXS motifs and keeps it in the cytoplasm. M.
  brevicollis appears to have an eroded version of this pathway: its Hippo gene model is
  predicted to be truncated at the start of the kinase domain, and its Yorkie homolog has
  no consensus Warts phosphorylation motif. Nothing is known experimentally about this
  protein; its kinase activity, substrates, regulators and localization have not been
  examined.
