core_functions:
- description: >-
    Warts/LATS-family serine/threonine protein kinase, inferred from its family placement
    and intact catalytic residues. Its role in Hippo signaling is uncertain in M.
    brevicollis, which appears to have lost an intact Hippo kinase and the Warts sites on
    its Yorkie homolog. The gene model is a fragment covering mainly the kinase domain.
    No experiments have been done on this protein.
  molecular_function:
    id: GO:0004674
    label: protein serine/threonine kinase activity
  locations:
  - id: GO:0005737
    label: cytoplasm
  supported_by:
  - reference_id: file:MONBE/MONBRDRAFT_1233/MONBRDRAFT_1233-uniprot.txt
    supporting_text: PANTHER; PTHR24356:SF418; SERINE_THREONINE-PROTEIN KINASE WARTS; 1.
  - reference_id: PMID:38729842
    supporting_text: >-
      Thus M. brevicollis may be an example of an organism that encodes a Yorkie ortholog
      but has lost the capacity to be regulated by Hippo pathway signaling.
suggested_questions:
- question: >-
    Is the 380-residue MONBRDRAFT_1233 model a draft-assembly artefact, or does the
    M. brevicollis Warts gene really lack the N-terminal MOB1-binding region and the AGC
    C-terminal hydrophobic motif? Transcript evidence (RNA-seq or RACE) would settle this.
- question: >-
    Is the M. brevicollis Hippo gene truly truncated, or is this also an assembly error? If
    Hippo is lost, which kinases (if any) activate Warts in M. brevicollis?
- question: >-
    Without consensus HXRXXS sites on its Yorkie homolog, what does M. brevicollis Warts
    phosphorylate? Is the kinase under relaxed constraint compared with S. rosetta warts?
- question: >-
    Should PAINT place the organ-growth (GO:0046620) and apoptosis IBDs at a metazoan
    rather than the Metazoa-plus-choanoflagellate node, or should GO add taxon
    constraints restricting organ-level growth terms to taxa with organs?
suggested_experiments:
- hypothesis: The MONBRDRAFT_1233 gene encodes a full-length Warts/LATS kinase not captured
    by the draft gene model.
  description: >-
    Map M. brevicollis RNA-seq reads or perform 5' and 3' RACE on MONBRDRAFT_1233 to
    determine the full open reading frame, and check for MOB1-binding and hydrophobic-motif
    regions.
  experiment_type: transcript mapping
- hypothesis: M. brevicollis Warts is an active kinase that does not phosphorylate its
    Yorkie homolog.
  description: >-
    In vitro kinase assay of recombinant full-length M. brevicollis Warts (wild type versus
    K107A) on a generic AGC substrate and on recombinant M. brevicollis and S. rosetta
    Yorkie, with phospho-site mapping by mass spectrometry.
  experiment_type: biochemical kinase assay
