  review:
    summary: >-
      IBA from the IBD at PTN002390470 whose only seed is Drosophila wts, where Warts
      promotes apoptosis by inactivating Yorkie and so lowering expression of the caspase
      inhibitor diap1. No cell death has been studied in relation to Warts in any
      choanoflagellate.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The term is not excluded for opisthokonts, so this is not a taxon violation. But the
      donor biology is Yorkie-dependent control of an animal anti-apoptotic programme in
      growing tissue. There is no evidence that choanoflagellate Warts regulates apoptosis,
      choanoflagellate Yorkie homologs may not bind TEAD, and in M. brevicollis Yorkie lacks
      consensus Warts sites. Not removed, because no data contradict it; consistent with
      the S. rosetta warts review.
    supported_by:
