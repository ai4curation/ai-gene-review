  review:
    summary: >-
      InterPro2GO from the cadherin-like domain and superfamily signatures. In classical and protocadherins,
      calcium ions bound between successive EC repeats rigidify the ectodomain. The six EC-like
      repeats of A9V8Y4 match the cadherin profile (PS50268). But none matches the PROSITE CADHERIN_1
      signature, and a motif scan finds no DXNDN-type or LDRE-type calcium-binding motif. UniProt
      adds a caution that conserved residues needed for feature propagation are missing.
    action: UNDECIDED
    reason: >-
      Calcium binding is the usual property of EC repeats. Here the canonical calcium-ligand motifs
      are missing from all six repeats, so the inference from domain membership is weaker than
      for typical cadherins. Calcium may be bound through non-canonical ligands, but this has
      not been tested. Neither accepted nor removed.
    supported_by:
    - reference_id: file:MONBE/MBCDH12/MBCDH12-bioinformatics/RESULTS.md
      supporting_text: '| A9V8Y4 | 1794 | 1559-1581 | 213 aa (SH2) | 6 | 0 | 0 |'
