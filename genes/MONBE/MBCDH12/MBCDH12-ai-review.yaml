      IBA from the PAINT IBD at PTN008601603, the root of the PTHR24027 reference tree (PANTHER
      species label "Metazoa-Choanoflagellida"). Its seeds are classical cadherins: mouse Cdh1,
      rat cadherins and human CDH1, CDH2, CDH5, CDH24 and CDH26. A9V8Y4 is the only choanoflagellate
