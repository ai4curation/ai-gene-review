    reason: >-
      The target is inside the clade of the IBD node, so this is an argument against the placement,
      not against membership. Beta-catenin binding is a property of the classical-cadherin cytoplasmic
      domain. That domain arose with classical cadherins in animals and is absent from the M.
      brevicollis protein. Even within animals, a cadherin without it (Nematostella Dachsous)
      does not bind beta-catenin. Placing the IBD at the family root, above the choanoflagellate
      branch, asserts an ancestral catenin-binding function that the target-side sequence contradicts.
      The IBD belongs on the classical-cadherin subtree.
