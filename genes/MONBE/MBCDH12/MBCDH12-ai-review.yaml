core_functions:
- description: >-
    Single-pass transmembrane protein with divergent extracellular cadherin-like repeats, VWD,
    IPT/TIG and EGF modules, and a cytoplasmic SH2 domain that keeps the phosphotyrosine-binding
    FLVR arginine. The architecture suggests a cell-surface receptor that could couple extracellular
    binding to tyrosine-phosphorylation signalling. No ligand, partner or activity has been measured,
    and it is not a classical (catenin-binding) cadherin.
  locations:
  - id: GO:0016020
    label: membrane
  supported_by:
  - reference_id: file:MONBE/MBCDH12/MBCDH12-uniprot.txt
    supporting_text: 'SUBCELLULAR LOCATION: Membrane'
  - reference_id: file:MONBE/MBCDH12/MBCDH12-bioinformatics/RESULTS.md
    supporting_text: Both SH2 domains keep the arginine of the FLVR
suggested_questions:
- question: >-
    Does the SH2 domain of MBCDH12 bind phosphotyrosine peptides? M. brevicollis encodes many
    tyrosine kinases; which of them, or which of their substrates, are its partners?
- question: >-
    Are MBCDH12 and S. rosetta PTSG_05882 orthologs, and does this VWD-EGF-cadherin-TM-SH2 architecture
    define a choanoflagellate-specific cadherin family?
- question: >-
    Should the PAINT IBDs for beta-catenin binding, catenin complex, cadherin binding and cell
    migration be moved from the PTHR24027 root (PTN008601603) to the classical-cadherin subtree,
    given that the only choanoflagellate leaf lacks the Cadherin_C domain?
suggested_experiments:
- hypothesis: The MBCDH12 SH2 domain binds phosphotyrosine motifs.
  description: >-
    Express the recombinant SH2 domain, wild type and with the FLVR arginine mutated, and screen
    phosphotyrosine peptide arrays or M. brevicollis lysate pull-downs.
  experiment_type: biochemical binding assay
- hypothesis: MBCDH12 is located on the cell surface, for example the microvillar collar.
  description: >-
    Raise antibodies to the cytoplasmic tail and immunostain M. brevicollis, as done for MBCDH1.
  experiment_type: localization
