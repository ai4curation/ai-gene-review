product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:81824
  label: Monosiga brevicollis
description: >-
  MBCDH12 (MONBRDRAFT_11339) encodes an uncharacterized 1794-residue single-pass transmembrane
  cadherin-domain protein of the choanoflagellate Monosiga brevicollis, a strictly unicellular
  species. It is one of at least 23 cadherin-domain genes in that genome. After an N-terminal
  signal peptide (1-20), the extracellular region carries a von Willebrand factor type D module,
  six cadherin-like (EC) repeats, and IPT/TIG and EGF-like domains. A single transmembrane helix
  (1559-1581) is followed by a cytoplasmic tail of about 210 residues that contains an SH2 domain.
  The SH2 domain keeps the FLVR-motif arginine (FVVRDS) that binds phosphotyrosine in other SH2
  domains. The EC repeats lack the canonical calcium-binding motifs and the PROSITE cadherin signature,
  so they are divergent. The same VWD, EGF, EC-repeat, TM and SH2 arrangement occurs in Salpingoeca
  rosetta PTSG_05882. The protein has no cytoplasmic cadherin domain (Pfam Cadherin_C), the beta-catenin-binding
  module that defines classical cadherins, which are absent from choanoflagellates. There are
  no experimental data on MBCDH12. Its expression, localization, ligands, adhesive activity and
  SH2-binding partners are unknown. The only choanoflagellate cadherin localized so far, MBCDH1,
  sits on the microvillar collar.
