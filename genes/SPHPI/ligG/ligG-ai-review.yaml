proposed_new_terms:
- proposed_name: GS-HPV glutathione-dependent deglutathionylase activity
  proposed_definition: Catalysis of glutathione-dependent reductive removal of the glutathionyl group
    from beta-S-glutathionyl-gamma-hydroxypropiovanillone (GS-HPV), producing gamma-hydroxypropiovanillone
    and glutathione disulfide. The reaction consumes a second reduced glutathione; enzymes can differ
    in preference for betaR- and betaS-GS-HPV. This is not classical elimination of hydrogen sulfide or
    substituted hydrogen sulfide.
  justification: Direct substrate/product and stereochemical studies establish this activity, but live
    QuickGO definition and text searches did not identify a precise existing term. A broad family label
    or a chemically different reaction must not substitute for the experimentally established molecular
    function.
  supported_by: *id001
