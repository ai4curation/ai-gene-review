  label: Sphingomonas paucimobilis
description: LigG is a cysteine-containing, omega-class-related glutathione transferase from strain SYK-6,
  historically deposited as Sphingomonas paucimobilis. It catalyzes glutathione-dependent reductive deglutathionylation
  of beta-S-glutathionyl hydroxypropiovanillone (GS-HPV), releasing achiral hydroxypropiovanillone and
  oxidized glutathione. LigG strongly prefers betaR-GS-HPV, the product of LigF-mediated ether cleavage.
  In the native strain, LigG and LigQ both contribute to betaR-GS-HPV conversion, while LigQ supplies
  betaS-GS-HPV conversion. This reaction helps sustain glutathione recycling during catabolism of lignin-derived
  beta-O-4 dimers.
