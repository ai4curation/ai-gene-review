- id: PMID:26940872
  title: Structural and Biochemical Characterization of the Early and Late Enzymes in the Lignin β-Aryl
    Ether Cleavage Pathway from Sphingobium sp. SYK-6.
  findings:
  - statement: LigG catalyzes GSH-dependent cleavage of betaR-GS-HPV, yielding HPV and GSSG.
    supporting_text: The final step consists of a GSH-dependent lyase, LigG, that catalyzes the elimination
      of the GSH thioether linkage in (βR)-GS-HPV to produce glutathione disulfide (GSSG) and γ-hydroxypropiovanillone
      (HPV).
  - statement: Recombinant LigG was among the proteins purified from clarified lysate supernatant; this
      supports a soluble fold but is not direct native localization.
    supporting_text: The C-terminally His-tagged proteins were purified from the clarified supernatant
      using precharged nickel-immobilized metal ion affinity chromatography resin (GE Healthcare).
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Direct structural and biochemical characterization. Its historical statement that the
      betaS route was unknown has been superseded by LigQ identification and is not retained as a current
      conclusion.
- id: PMID:33244017
  title: Roles of two glutathione S-transferases in the final step of the β-aryl ether cleavage pathway
    in Sphingobium sp. strain SYK-6.
  findings:
  - statement: Purified LigG shows about 300-fold preference for betaR-GS-HPV, while native mutant experiments
      distinguish overlapping LigG/LigQ activity from the LigQ-dependent betaS route.
    supporting_text: 'Purified LigG showed an approximately 300-fold higher specific

      activity for (βR)-GS-HPV than that for (βS)-GS-HPV, whereas purified LigQ showed

      an approximately six-fold higher specific activity for (βS)-GS-HPV than that for

      (βR)-GS-HPV. Analyses of mutants of ligG, ligQ, and both genes revealed that

      SYK-6 converted (βR)-GS-HPV using both LigG and LigQ, whereas only LigQ was

      involved in converting (βS)-GS-HPV.'
  - statement: Native functional studies implicate LigG/LigQ in cellular glutathione recycling, supporting
      the intracellular setting of their catalytic role.
    supporting_text: 'This suggests that GSH removal from GS-HPV catalyzed by LigG and LigQ, is

      essential for cellular GSH recycling during β-aryl ether catabolism.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Gene-specific enzyme assays and native mutants directly refine the earlier model. Strong
      preference is not absolute inability to turn over betaS substrate in vitro.
