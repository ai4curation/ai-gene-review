core_functions:
- description: Catalyzes GSH-dependent reductive deglutathionylation of GS-HPV to HPV and GSSG, with approximately
    300-fold higher specific activity toward betaR than betaS substrate in the 2020 assay. LigG overlaps
    with LigQ for native betaR turnover but does not supply the native betaS route.
  proposed_molecular_function: GS-HPV glutathione-dependent deglutathionylase activity
  supported_by: &id001
  - reference_id: PMID:26940872
    supporting_text: The final step consists of a GSH-dependent lyase, LigG, that catalyzes the elimination
      of the GSH thioether linkage in (βR)-GS-HPV to produce glutathione disulfide (GSSG) and γ-hydroxypropiovanillone
      (HPV).
  - reference_id: PMID:33244017
    supporting_text: 'Purified LigG showed an approximately 300-fold higher specific

      activity for (βR)-GS-HPV than that for (βS)-GS-HPV, whereas purified LigQ showed

      an approximately six-fold higher specific activity for (βS)-GS-HPV than that for

      (βR)-GS-HPV. Analyses of mutants of ligG, ligQ, and both genes revealed that

      SYK-6 converted (βR)-GS-HPV using both LigG and LigQ, whereas only LigQ was

      involved in converting (βS)-GS-HPV.'
proposed_new_terms:
- proposed_name: GS-HPV glutathione-dependent deglutathionylase activity
  proposed_definition: Catalysis of reductive cleavage of the carbon-sulfur bond in beta-glutathionyl-gamma-hydroxypropiovanillone
    (GS-HPV), using an additional molecule of reduced glutathione to produce gamma-hydroxypropiovanillone
    (HPV) and glutathione disulfide.
  justification: The net reaction reduces the substrate carbon by replacing its carbon-sulfur bond with
    a carbon-hydrogen bond, coupled to oxidation of the substrate-bound and free glutathione sulfur atoms
    into glutathione disulfide. GO:0016491 therefore supplies an appropriate broad redox parent. GO:0016846
    describes elimination of hydrogen sulfide or substituted hydrogen sulfide; GO:0004364 describes halide
    substitution. GO:0015038 specifies a reaction with two free glutathione molecules and does not capture
    the GS-HPV thioether substrate. A GS-HPV-specific term preserves the demonstrated substrate and products
    without substituting disulfide-reductase or elimination chemistry.
  supported_by: *id001
  proposed_parent:
    id: GO:0016491
    label: oxidoreductase activity
