- id: PMID:16030198
  title: 'Characterization of the gallate dioxygenase gene: three distinct ring cleavage dioxygenases
    are involved in syringate degradation by Sphingomonas paucimobilis SYK-6.'
  findings:
  - statement: DesB is a gallate-specific ring-cleavage dioxygenase producing 4-oxalomesaconate.
    supporting_text: DesB specifically attacked gallate to generate 4-oxalomesaconate as the reaction
      product.
  - statement: DesB is a single-chain fusion of LigB-like (N-terminal) and LigA-like (C-terminal) regions.
    supporting_text: of DesB exhibited ca. 40% and 27% identity with the sequences of the PCA 4,5-dioxygenase
      beta and alpha subunits, respectively.
  - statement: DesB is a homodimer.
    supporting_text: DesB produced in Escherichia coli was purified and was estimated to be a homodimer
      (86 kDa).
  - statement: DesB (with LigM) is important for syringate catabolism and, with LigAB, for gallate degradation.
    supporting_text: (iii) DesB and LigAB are involved in gallate degradation.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Abstract-only in cache (PMC1196043). Primary characterization of DesB: cloning, purification,
      product, kinetics and mutant analysis.'
