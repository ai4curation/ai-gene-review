id: Q5NTE5
gene_symbol: desB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:13689
  label: Sphingomonas paucimobilis
description: >-
  DesB is a gallate dioxygenase, a homodimeric type II (class III, LigB-family)
  extradiol ring-cleavage dioxygenase in which an N-terminal LigB-like
  catalytic domain is fused to a C-terminal LigA-like domain, so that a single
  polypeptide corresponds to both subunits of the two-subunit protocatechuate
  4,5-dioxygenase. It specifically cleaves the aromatic ring of gallate with
  incorporation of both atoms of O2 to give 4-oxalomesaconate, which is then
  converted to 4-carboxy-4-hydroxy-2-oxoadipate and cleaved to pyruvate and
  oxaloacetate by the lower protocatechuate 4,5-cleavage pathway enzymes. By
  analogy with characterized LigB-family enzymes it is expected to use a
  non-heme Fe(II) cofactor. In the lignin-degrading sphingomonad strain SYK-6,
  DesB acts in the main route for syringate (syringyl-unit) catabolism, in
  which syringate is O-demethylated via 3-O-methylgallate to gallate before
  ring cleavage, and it is one of two dioxygenases (with LigAB) that degrade
  gallate. It is functionally equivalent to the GalA gallate dioxygenase of
  gallate-degrading pseudomonads.
