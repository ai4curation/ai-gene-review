id: C5CSP7
gene_symbol: iadE
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:543728
  label: Variovorax paradoxus S110
description: IadE (Vapar_1494) is the 162-amino-acid structural beta subunit of the heterohexameric (alpha3beta3)
  indole-3-acetic acid (IAA) Rieske non-heme iron aromatic-ring-hydroxylating dioxygenase complex (IadD/IadE)
  in Variovorax paradoxus S110. IadE adopts a single-domain NTF2-like twisted seven-stranded beta-sheet
  fold with three alpha-helices and trimerizes to form the structural stem base of the mushroom-shaped
  IadD/IadE heterohexamer, scaffolding the catalytic IadD alpha-subunit trimer cap. Co-expression of iadE
  with iadD is required for assembly of the functional IadD/IadE dioxygenase holoenzyme and for aerobic
  IAA catabolism and reversion of auxin-induced root growth inhibition in the plant rhizosphere.
references:
- id: GO_REF:0000118
  title: TreeGrafter-generated GO annotations
  findings: []
- id: PMID:36266335
  title: Diverse MarR bacterial regulators of auxin catabolism in the plant microbiome.
  findings:
  - statement: Demonstrated that iadD and iadE are the minimal gene pair necessary and sufficient for
      IAA degradation in Variovorax and heterologous E. coli.
    supporting_text: To test the necessity of these genes, we constructed knockout strains CL14 ΔiadDE
      and CL14 ΔiadCDE. Both lacked the ability to degrade IAA (Fig. 1d), demonstrating that iadD and
      iadE are necessary and sufficient for IAA degradation by Variovorax.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Establishes genetic necessity and sufficiency of iadDE for IAA catabolism.
- id: PMID:37459330
  title: Structural and biochemical characterization of the key components of an auxin degradation operon
    from the rhizosphere bacterium Variovorax.
  findings:
  - statement: Determined the 1.8 A crystal structure (PDB 7YLS) and 2.6 A cryo-EM structure (PDB 8H2T)
      of Variovorax paradoxus S110 IadD/IadE, showing that three IadE subunits form the stem base of the
      alpha3beta3 heterohexamer to scaffold the three catalytic IadD subunits.
    supporting_text: IadE is a single-domain protein, containing a twisted seven-stranded β-sheet and
      3 α-helices, which may mainly serve as a scaffold protein contributing to proper assembly of the
      oligomeric enzyme complex.
  - statement: Showed that three IadE subunits form the stem and three IadD subunits form the cap of the
      mushroom-shaped heterohexamer.
    supporting_text: An overall mushroom-shaped heterohexamer composed of 3 IadE at the “stem” and 3 IadD
      in the “cap” was resolved (Fig 3C).
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Direct crystal and cryo-EM structures of V. paradoxus S110 IadE (C5CSP7) in complex
      with IadD.
