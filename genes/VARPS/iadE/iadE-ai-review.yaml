suggested_questions:
- question: Does the IadE trimer stem allosterically modulate substrate binding or product release in
    the overlying IadD catalytic cap, or is its role purely assembly-scaffolding?
suggested_experiments:
- description: Assess the thermal stability, oligomeric state, and iron-center occupancy of recombinant
    V. paradoxus S110 IadD expressed with and without IadE.
  hypothesis: IadE trimerization templates the assembly of the IadD trimer cap and stabilizes the inter-subunit
    Rieske-to-mononuclear-iron interface.
  experiment_type: Size-exclusion chromatography-MALS and differential scanning fluorimetry
