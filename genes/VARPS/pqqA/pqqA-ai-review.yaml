description: >-
  PqqA (Vapar_3057, C5CPT7) in Variovorax paradoxus S110 is the 24-amino-acid ribosomally
  synthesized precursor peptide (MKWETPTATDLRFGFEITMYVSAR; HAMAP MF_00656, InterPro IPR011725, NCBIfam
  TIGR02107) for pyrroloquinoline quinone (PQQ) biosynthesis. Rather than functioning as a catalytic
  enzyme, PqqA serves as the polypeptide substrate of the PQQ biosynthetic pathway: its conserved glutamate
  (Glu16) and tyrosine (Tyr20) residues are bound by the peptide chaperone PqqD and cross-linked via
  an intramolecular carbon-carbon bond by the radical SAM cyclase PqqE, followed by proteolytic excision
  and oxidative ring maturation by PqqB and PqqC to yield the mature PQQ redox cofactor.
