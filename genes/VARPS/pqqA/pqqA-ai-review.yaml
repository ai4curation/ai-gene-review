suggested_questions:
- question: Which cellular peptidase(s) in Variovorax paradoxus excise the Glu16-Tyr20 cross-linked dipeptide
    intermediate from Vapar_3057 (PqqA) following PqqE-catalyzed carbon-carbon bond formation?
suggested_experiments:
- description: Reconstitute Variovorax paradoxus PqqA (C5CPT7) with purified PqqD and PqqE in vitro and
    substitute Glu16 or Tyr20 by site-directed mutagenesis to verify loss of SAM-dependent intramolecular
    Glu-Tyr cross-linking by LC-HRMS/MS.
  hypothesis: Substitution of either Glu16 or Tyr20 in Vapar_3057 abolishes PqqE-catalyzed intramolecular
    C-C cross-link formation while preserving N-terminal leader peptide binding to PqqD.
  experiment_type: In vitro RiPP reconstitution and LC-HRMS/MS peptide mapping
