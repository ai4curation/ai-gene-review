- id: PMID:25817994
  title: PqqD is a novel peptide chaperone that forms a ternary complex with the radical S-adenosylmethionine
    protein PqqE in the pyrroloquinoline quinone biosynthetic pathway.
  findings:
  - statement: Demonstrates that PqqA is the conserved peptide substrate of the pqqA-E RiPP pathway whose
      glutamate and tyrosine side chains are cross-linked by PqqE after nanomolar binding of PqqA to
      the peptide chaperone PqqD in a ternary PqqA-PqqD-PqqE complex.
    supporting_text: Pyrroloquinoline quinone (PQQ) is a product of a ribosomally synthesized and post-translationally
      modified pathway consisting of five conserved genes, pqqA-E. PqqE is a radical S-adenosylmethionine
      (RS) protein with a C-terminal SPASM domain, and is proposed to catalyze the formation of a carbon-carbon
      bond between the glutamate and tyrosine side chains of the peptide substrate PqqA.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Establishes the conserved biochemical mechanism of PqqA binding by PqqD and presentation
      to PqqE.
- id: PMID:32731194
  title: Biogenesis of the peptide-derived redox cofactor pyrroloquinoline quinone.
  findings:
  - statement: Reviews the complete PQQ biosynthetic pathway from the ribosomally synthesized precursor
      peptide PqqA, whose conserved glutamate and tyrosine residues supply the carbon-nitrogen skeleton
      of PQQ.
    supporting_text: The pqqA is translated into a short peptide that contains the fully conserved residues,
      glutamate and tyrosine; site-direct mutagenesis identified these two residues on PqqA as the best
      candidate for the precursor to PQQ (Figure 2A).[31]
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Comprehensive biochemical review of PqqA as the precursor peptide substrate of PQQ
      biogenesis.
