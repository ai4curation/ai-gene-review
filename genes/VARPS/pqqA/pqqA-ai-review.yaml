core_functions:
- description: Ribosomally synthesized 24-residue precursor peptide that supplies the conserved Glu16
    and Tyr20 side chains for PqqD/PqqE-mediated carbon-carbon cross-linking and subsequent proteolytic
    and oxidative maturation into pyrroloquinoline quinone (PQQ); acts as a biosynthetic precursor scaffold
    rather than a catalytic enzyme.
