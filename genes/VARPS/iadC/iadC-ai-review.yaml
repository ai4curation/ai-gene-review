id: C5CSP5
gene_symbol: iadC
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:543728
  label: Variovorax paradoxus S110
description: IadC (Vapar_1492) is the 330-amino-acid Class IA NADH:ferredoxin oxidoreductase component
  of the indole-3-acetic acid (IAA) Rieske non-heme iron dioxygenase system (IadD/IadE-IadC) in Variovorax
  paradoxus S110. Structurally, IadC folds into a triangle-shaped three-domain monomer comprising an N-terminal
  FMN-binding domain (residues 1-115), a central NADH-binding domain (residues 116-238), and a C-terminal
  plant-type [2Fe-2S] ferredoxin domain (residues 239-329 in the crystal structure PDB 7YLR; annotated
  as residues 245-330 by ProSite/UniProt) coordinated by four cysteine residues. IadC oxidizes NADH and
  transfers electrons via its non-covalently bound FMN cofactor and intramolecular [2Fe-2S] cluster to
  the Rieske [2Fe-2S] center of IadD, driving the aerobic dioxygenation of IAA to 2-oxindole-3-acetic
  acid (oxIAA) and enabling rapid auxin clearance and reversion of microbiome-induced root growth inhibition
  in the plant rhizosphere.
