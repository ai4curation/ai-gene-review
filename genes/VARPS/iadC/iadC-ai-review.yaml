- description: Class IA NADH-dependent FMN- and [2Fe-2S]-containing reductase component that transfers
    electrons from NADH to the IadD/IadE Rieske non-heme iron dioxygenase complex to catalyze the oxygenation
    of indole-3-acetic acid (IAA) into 2-oxindole-3-acetic acid (oxIAA).
