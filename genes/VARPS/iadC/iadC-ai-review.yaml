suggested_questions:
- question: Which endogenous Variovorax or E. coli cellular reductases can partially substitute for IadC
    when iadDE is expressed in the absence of iadC?
suggested_experiments:
- description: Measure the midpoint reduction potentials of the FMN and [2Fe-2S] cofactors in V. paradoxus
    S110 IadC by spectroelectrochemical titration and determine the rate constant of inter-protein electron
    transfer to IadD/IadE.
  hypothesis: The domain orientation of the FeSD domain against the NBD domain in IadC tunes the [2Fe-2S]
    redox potential for rapid, thermodynamically favorable electron delivery to the Rieske cluster of
    IadD.
  experiment_type: Spectroelectrochemistry and stopped-flow kinetics
