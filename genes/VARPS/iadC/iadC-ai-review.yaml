- id: PMID:36266335
  title: Diverse MarR bacterial regulators of auxin catabolism in the plant microbiome.
  findings:
  - statement: Demonstrated that inclusion of iadC alongside iadDE substantially accelerates IAA degradation
      in Variovorax and is strictly required to revert root growth inhibition caused by the IAA-producing
      commensal Arthrobacter CL28.
    supporting_text: However, only the CL14 ΔHS33 pBBR1::iadCDE strain containing all three genes was
      able to revert the Arthrobacter CL28-dependent RGI to CL14 wild-type levels.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Demonstrates physiological requirement of iadC for rapid IAA turnover and RGI reversion
      in the rhizosphere.
- id: PMID:37459330
  title: Structural and biochemical characterization of the key components of an auxin degradation operon
    from the rhizosphere bacterium Variovorax.
  findings:
  - statement: Solved the 1.68 A crystal structure of Variovorax paradoxus S110 IadC (PDB 7YLR), revealing
      a Class IA FMN-type reductase with an FMN-binding domain (residues 1-115), an NADH-binding domain
      (residues 116-238), and a plant-type [2Fe-2S] cluster domain (residues 239-329) coordinated by four
      cysteines.
    supporting_text: The overall triangle-shaped protein is composed of 3 major domains, including an
      FMN-binding domain (FBD, residues 1–115), an NADH-binding domain (NBD, residues 116–238), and a
      plant-type [2Fe-2S] cluster domain (FeSD, residues 239–329) (Fig 4C).
  - statement: Demonstrated that IadC transfers electrons from NADH via FMN and its [2Fe-2S] cluster to
      IadD/IadE to catalyze IAA conversion to oxIAA, and that mutations in FMN-binding residues or the
      [2Fe-2S] ligand Cys279 impair IAA turnover.
    supporting_text: FMN is thought to mediate electron transfer from the NADH electron donor to the [2Fe-2S]
      electron acceptor, which further delivers the electrons to the dioxygenase for the catalysis reaction
      [29,30] (Fig 4C and 4E). As anticipated, mutation of residues involved in FMN binding compromised
      IAA turnover (Fig 4D). Similarly, the C279S mutation impairing coordination of the [2Fe-2S] cluster
      significantly decreased the efficiency of the reaction.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Direct X-ray crystal structure (PDB 7YLR) and biochemical characterization of V. paradoxus
      S110 IadC (C5CSP5).
