gene_symbol: iadD
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:543728
  label: Variovorax paradoxus S110
description: IadD (Vapar_1493) is the 437-amino-acid catalytic alpha subunit of the heterohexameric (alpha3beta3)
  indole-3-acetic acid (IAA) Rieske non-heme iron aromatic-ring-hydroxylating dioxygenase complex (IadD/IadE)
  in Variovorax paradoxus S110. Together with the structural beta subunit IadE and the FMN/[2Fe-2S]-containing
  NADH-dependent reductase IadC, IadD catalyzes the initial aerobic oxygenation of the plant hormone indole-3-acetic
  acid (IAA) into 2-hydroxyindole-3-acetic acid, which tautomerizes to biologically inactive 2-oxindole-3-acetic
  acid (oxIAA) and is further degraded via dioxindole-3-acetic acid and isatin to anthranilic acid. Structurally,
  each IadD monomer comprises an N-terminal Rieske domain (residues 44-160) that coordinates a [2Fe-2S]
  cluster via Cys85, His87, Cys106, and His109, and a C-terminal catalytic domain (residues 1-43 and 161-437)
  that coordinates a mononuclear ferrous iron center via the 2-His-1-carboxylate facial triad His216,
  His221, and Asp377 adjacent to the IAA substrate-binding pocket. In the rhizosphere, IAA catabolism
  by the IadD/IadE-IadC dioxygenase system enables Variovorax to buffer root-zone auxin levels and prevent
  auxin-induced root growth inhibition in host plants.
