suggested_questions:
- question: What is the exact chemical mechanism by which the initial oxygenation product of IadD/IadE
    (2-hydroxyindole-3-acetic acid / oxIAA) is further oxidized to dioxindole-3-acetic acid (DOAA) and
    cleaved to isatin by downstream enzymes in the iad operon?
suggested_experiments:
- description: Perform single-turnover stopped-flow spectroscopy and cryo-EM of the transient IadC-IadD/IadE
    electron-transfer complex to map the docking interface between the IadC plant-type [2Fe-2S] domain
    and the IadD Rieske [2Fe-2S] domain.
  hypothesis: IadC docks transiently near the subunit interface of the IadD trimer to place its [2Fe-2S]
    cluster within electron-tunneling distance of the IadD Rieske [2Fe-2S] cluster.
  experiment_type: Cryo-EM and stopped-flow rapid kinetics
