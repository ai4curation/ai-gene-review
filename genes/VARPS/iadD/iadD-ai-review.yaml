- id: PMID:32999461
  title: A single bacterial genus maintains root growth in a complex microbiome.
  findings:
  - statement: Identified a conserved auxin-degradation operon across Variovorax genomes that is necessary
      and sufficient for reverting auxin- and microbiome-induced root growth inhibition.
    supporting_text: We identify an auxin-degradation operon that is conserved in all available genomes
      of Variovorax and is necessary and sufficient for the reversion of root growth inhibition.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Discovery of the conserved Variovorax iad auxin-degrading locus.
- id: PMID:36266335
  title: Diverse MarR bacterial regulators of auxin catabolism in the plant microbiome.
  findings:
  - statement: Demonstrated by gain-of-function and knockout genetics that iadD and iadE are necessary
      and sufficient for indole-3-acetic acid (IAA) degradation in Variovorax, and that co-expression
      of iadC accelerates IAA degradation to revert Arthrobacter-induced root growth inhibition.
    supporting_text: To test the necessity of these genes, we constructed knockout strains CL14 ΔiadDE
      and CL14 ΔiadCDE. Both lacked the ability to degrade IAA (Fig. 1d), demonstrating that iadD and
      iadE are necessary and sufficient for IAA degradation by Variovorax.
  - statement: Established by LC-MS/MS metabolomics that the Variovorax iad pathway degrades IAA through
      dioxindole-3-acetic acid and isatin to anthranilic acid.
    supporting_text: The intermediates dioxindole, isatin and isatinic acid, and the product anthranilic
      acid were all detected and thus produced in the bacterial cultures.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Genetic and metabolomic dissection of the Variovorax iad operon.
- id: PMID:37459330
  title: Structural and biochemical characterization of the key components of an auxin degradation operon
    from the rhizosphere bacterium Variovorax.
  findings:
  - statement: Solved the 1.8 A crystal structure (PDB 7YLS) and 2.6 A IAA-bound cryo-EM structure (PDB
      8H2T) of Variovorax paradoxus S110 IadD/IadE, revealing a mushroom-shaped heterohexamer where each
      IadD subunit coordinates a Rieske [2Fe-2S] cluster (Cys85, His87, Cys106, His109) and a mononuclear
      iron center (His216, His221, Asp377).
    supporting_text: The active site of IadD is located at the interface of IadD subunits, composed of
      a Rieske [2Fe-2S] cluster from the Rieske domain and a mononuclear iron in the catalytic domain
      of a neighboring subunit (Figs 3D and S5A and S5B). The [2Fe-2S] is stabilized by contacts with
      Cys85, His87, Cys106, and His109 and the mononuclear iron coordinates with His216, His221, and Asp377.
  - statement: Demonstrated in vitro reconstitution of IAA dioxygenation to 2-oxindole-3-acetic acid (oxIAA)
      by purified IadD/IadE and IadC in the presence of NADH and O2.
    supporting_text: Together, these data suggest that IAA was converted to oxIAA by the dioxygenase system
      composed of the IadD/E dioxygenase and the IadC reductase (Fig 5E).
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Direct structural (PDB 7YLS, 8H2T) and biochemical characterization of V. paradoxus
      S110 IadD (C5CSP6).
