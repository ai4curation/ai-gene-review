  - id: GO_REF:0000002
    title: Gene Ontology annotation through association of InterPro records with GO terms
    findings: []
  - id: GO_REF:0000120
    title: Combined Automated Annotation using Multiple IEA Methods
    findings: []
  - id: UniProtKB:C5CXZ7
    title: "UniProtKB entry C5CXZ7 (URE3_VARPS): Urease subunit gamma"
    findings:
      - statement: >-
          Vapar_4240 (C5CXZ7, ureA) is a Swiss-Prot reviewed 100-residue urease
          gamma subunit (HAMAP rule MF_00739, InterPro IPR012010, Pfam PF00547)
          that forms a cytoplasmic heterotrimer with UreB (beta) and UreC
          (alpha), with three heterotrimers associating to form the active
          urease complex.
        supporting_text: >-
          CC   -!- SUBUNIT: Heterotrimer of UreA (gamma), UreB (beta) and UreC (alpha)
          CC       subunits. Three heterotrimers associate to form the active enzyme.
          CC       {ECO:0000255|HAMAP-Rule:MF_00739}.
  - id: PMID:8718850
    title: Structures of the Klebsiella aerogenes urease apoenzyme and two active-site mutants.
    findings:
      - statement: >-
          Three-chain bacterial urease is an (alpha beta gamma)3 trimer of
          heterotrimers in which the binickel active center resides exclusively
          in the alpha (UreC) subunit while the gamma (UreA) and beta (UreB)
          chains are structural subunits.
        supporting_text: >-
          Urease from Klebsiella aerogenes [Jabri et al. (1995) Science 268, 998-1004] is
          an (alpha beta gamma)3 trimer with each alpha-subunit having an (alpha
          beta)8-barrel domain containing a binickel active center.
        full_text_unavailable: true
    full_text_unavailable: true
  - id: PMID:21183664
    title: Complete genome sequence of the metabolically versatile plant growth-promoting endophyte Variovorax paradoxus S110.
    findings:
      - statement: >-
          Reports the complete genome sequence of Variovorax paradoxus S110, in
          which ureA (Vapar_4240) is encoded on chromosome 1 (CP001635).
        supporting_text: >-
          Variovorax paradoxus is a microorganism of special interest due to its
          diverse metabolic capabilities, including the biodegradation of both
          biogenic compounds and anthropogenic contaminants.
