proposed_new_terms: []
suggested_questions:
  - question: >-
      What is the role of the small hypothetical ORF Vapar_4241 located between
      ureA (Vapar_4240) and ureB (Vapar_4242) in the Variovorax paradoxus S110
      urease gene cluster?
suggested_experiments:
  - hypothesis: >-
      Vapar_4240 (UreA) is essential for assembly of the trimeric (UreABC)3
      urease complex and urea-dependent growth in Variovorax paradoxus S110.
    description: >-
      Construct an in-frame deletion of ureA (Vapar_4240) in V. paradoxus S110
      and measure native (UreABC)3 complex assembly by blue-native PAGE and
      cell-extract urease activity using the phenol-hypochlorite ammonia assay.
    experiment_type: In-frame gene deletion, native PAGE complex analysis, and enzymatic assay
