  - term:
      id: GO:0009039
      label: urease activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: enables
    supporting_entities:
      - InterPro:IPR012010
      - RHEA:20557
      - EC:3.5.1.5
      - UniRule:UR000001329
    review:
      summary: >-
        UreA contributes structurally to the heteromeric urease complex but does
        not independently catalyze urea hydrolysis.
      action: MARK_AS_OVER_ANNOTATED
      reason: >-
        In three-chain bacterial ureases, the carbamylated dinickel active site
        resides exclusively in the alpha subunit UreC (Vapar_4243, C5CY00;
        PMID:8718850). Asserting that the gamma structural subunit UreA
        independently enables urease activity (GO:0009039) over-annotates a
        non-catalytic structural subunit; instead, UreA enables structural
        molecule activity (GO:0005198) and contributes_to urease activity
        within the assembled (UreABC)3 complex.
      supported_by:
        - reference_id: PMID:8718850
          supporting_text: >-
            Urease from Klebsiella aerogenes [Jabri et al. (1995) Science 268, 998-1004] is
            an (alpha beta gamma)3 trimer with each alpha-subunit having an (alpha
            beta)8-barrel domain containing a binickel active center.
  - term:
      id: GO:0016151
      label: nickel cation binding
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    supporting_entities:
      - InterPro:IPR002026
      - InterPro:IPR036463
    review:
      summary: >-
        InterPro-to-GO over-propagates nickel binding to UreA from the composite
        gamma/gamma-beta family entry.
      action: REMOVE
      reason: >-
        Structural studies of three-chain bacterial urease demonstrate that the
        binickel active center is coordinated solely within the (alpha beta)8
        TIM-barrel of the alpha subunit (UreC), whereas the gamma subunit (UreA)
        contains no metal-binding site (PMID:8718850).
      supported_by:
        - reference_id: PMID:8718850
          supporting_text: >-
            Urease from Klebsiella aerogenes [Jabri et al. (1995) Science 268, 998-1004] is
            an (alpha beta gamma)3 trimer with each alpha-subunit having an (alpha
            beta)8-barrel domain containing a binickel active center.
