taxon:
  id: NCBITaxon:543728
  label: Variovorax paradoxus S110
description: >-
  UreA (Vapar_4240) in Variovorax paradoxus S110 is the 100-amino-acid
  cytoplasmic gamma structural subunit (HAMAP rule MF_00739, InterPro
  IPR012010, Pfam PF00547) of the three-chain bacterial urease complex. Encoded
  at the head of the ureA-ureB-ureC-ureEFGD locus on chromosome 1, UreA
  assembles with UreB (beta subunit, Vapar_4242) and UreC (alpha catalytic
  subunit, Vapar_4243) into the (UreABC)3 trimer of heterotrimers and
  contributes structurally to nickel-dependent urea hydrolysis once the
  carbamylated dinickel active site is installed in UreC.
