- id: PMID:12670952
  title: 'The YggX protein of Salmonella enterica is involved in Fe(II) trafficking and minimizes the
    DNA damage caused by hydroxyl radicals: residue CYS-7 is essential for YggX function.'
  findings:
  - statement: Demonstrates that bacterial YggX chelates/traffics intracellular Fe(II) via conserved Cys7
      and protects DNA from Fenton-mediated hydroxyl radical oxidative damage.
    supporting_text: 'The ability of purified YggX to protect

      DNA from Fenton chemistry mediated damage in vitro and to decrease the

      concentration of Fe(II) ions in solution available for chelation provided a

      framework for the interpretation of data obtained from in vivo experiments.'
  - statement: A C7S substitution in Salmonella enterica YggX abolishes its function both in vivo and in
      vitro, establishing Cys7 as essential for Fe(II) trafficking.
    supporting_text: 'The

      interpretation of in vitro assay results, within the context of the in vivo

      phenotypes, was validated by a mutant variant of YggX (C7S) that was unable to

      function in vivo or in vitro.'
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Foundational biochemical and genetic characterization of bacterial YggX-family Fe(II)
      trafficking and oxidative stress protection in Salmonella enterica.
- id: PMID:11416172
  title: Protection from superoxide damage associated with an increased level of the YggX protein in Salmonella
    enterica.
  findings:
  - statement: Shows that YggX increases cellular resistance to superoxide stress and protects labile
      [4Fe-4S] clusters from oxidative inactivation.
    supporting_text: 'Here it is shown that elevated levels of the YggX

      protein increase the resistance of Salmonella enterica to superoxide stress,

      reverse enzymatic defects attributed to oxidized [Fe-S] clusters, and decrease

      the spontaneous mutation frequency.'
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Establishes the conserved role of YggX-family proteins in bacterial cellular response
      to superoxide stress.
