suggested_questions:
- question: How is expression of Vapar_2982 (yggX/fetP) coordinated with OxyR, SoxR, and Fur regulons
    during rhizosphere oxidative bursts or heavy-metal exposure in Variovorax paradoxus S110?
suggested_experiments:
- description: Construct a delta-Vapar_2982 deletion mutant in Variovorax paradoxus S110 and assay aconitase
    [4Fe-4S] activity and paraquat/hydrogen peroxide sensitivity relative to wild-type.
  hypothesis: Loss of Vapar_2982 increases labile cytosolic Fe(2+) damage to [4Fe-4S] dehydratases under
    superoxide or peroxide stress.
