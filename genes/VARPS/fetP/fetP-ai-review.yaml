taxon:
  id: NCBITaxon:543728
  label: Variovorax paradoxus S110
description: 'FetP (YggX-family probable Fe(2+)-trafficking protein, Vapar_2982) in Variovorax paradoxus
  S110 is an 89-amino-acid cytosolic iron-binding protein (HAMAP rule MF_00686, InterPro IPR007457) that
  mediates intracellular iron transactions between iron uptake pathways and iron-requiring biosynthetic
  enzymes, facilitating the assembly and repair of [4Fe-4S] clusters while protecting cells against iron-catalyzed
  oxidative stress. Note: Vapar_2982 carries the UniProt symbol fetP via the YggX Fe(2+)-trafficking protein
  family and is distinct from the periplasmic FetP-like cupredoxin (Vapar_3862 / C5CUI1) encoded adjacent
  to the variobactin siderophore locus.'
