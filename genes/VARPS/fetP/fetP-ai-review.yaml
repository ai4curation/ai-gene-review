id: C5CNX5
gene_symbol: fetP
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:543728
  label: Variovorax paradoxus S110
description: FetP (YggX-family probable Fe(2+)-trafficking protein, Vapar_2982) in Variovorax paradoxus
  S110 is a 90-amino-acid predicted cytosolic iron-binding protein (HAMAP rule MF_00686, InterPro IPR007457).
  Based on conserved YggX family membership, it is predicted to act as a mediator in intracellular iron
  transactions between iron acquisition pathways and iron-requiring processes such as the synthesis and
  repair of iron-sulfur clusters in biosynthetic enzymes.
