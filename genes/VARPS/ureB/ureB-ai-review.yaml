      label: urease activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: enables
    supporting_entities:
      - RHEA:20557
      - EC:3.5.1.5
      - UniRule:UR000001437
    review:
      summary: >-
        UreB contributes structurally to the heteromeric urease complex but does
        not independently catalyze urea hydrolysis.
      action: MARK_AS_OVER_ANNOTATED
      reason: >-
        UreB (Vapar_4242) is the non-catalytic beta structural chain of the
        (UreABC)3 complex; the binickel active site resides exclusively in the
        alpha subunit UreC (Vapar_4243, C5CY00; PMID:8718850). Asserting that
        UreB independently enables urease activity over-annotates an individual
        structural subunit; instead, UreB enables structural molecule activity
        (GO:0005198) and contributes_to urease activity (GO:0009039) within the
        assembled complex.
      supported_by:
        - reference_id: PMID:8718850
          supporting_text: >-
            Urease from Klebsiella aerogenes [Jabri et al. (1995) Science 268, 998-1004] is
            an (alpha beta gamma)3 trimer with each alpha-subunit having an (alpha
            beta)8-barrel domain containing a binickel active center.
