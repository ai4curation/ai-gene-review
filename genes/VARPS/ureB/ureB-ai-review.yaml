proposed_new_terms: []
suggested_questions:
  - question: >-
      Does UreB (Vapar_4242) directly contact the UreD-UreF-UreG accessory
      chaperone complex during nickel metallocenter installation into UreC
      (Vapar_4243) in Variovorax paradoxus S110?
suggested_experiments:
  - hypothesis: >-
      Vapar_4242 (UreB) is required both for structural stability of the
      (UreABC)3 apoprotein and for productive docking of the UreDFG activation
      scaffold.
    description: >-
      Co-express Vapar_4240 (ureA) and Vapar_4243 (ureC) with and without
      Vapar_4242 (ureB) alongside the accessory genes and quantify apoprotein
      complex stability and Ni(2+)-dependent urease activation.
    experiment_type: Recombinant co-expression, native complex pull-down, and urease activation assay
