id: C5CXZ9
gene_symbol: ureB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:543728
  label: Variovorax paradoxus S110
description: >-
  UreB (Vapar_4242) in Variovorax paradoxus S110 is the 101-amino-acid
  cytoplasmic beta structural subunit (HAMAP rule MF_01954, InterPro IPR002019,
  Pfam PF00699) of the three-chain bacterial urease complex. Encoded immediately
  upstream of the catalytic alpha subunit gene ureC (Vapar_4243) on chromosome 1,
  UreB associates with UreA (gamma subunit, Vapar_4240) and UreC to form the
  (UreABC)3 trimer of heterotrimers and contributes structurally to
  nickel-dependent urea hydrolysis.
references:
  - id: GO_REF:0000002
    title: Gene Ontology annotation through association of InterPro records with GO terms
    findings: []
  - id: GO_REF:0000120
    title: Combined Automated Annotation using Multiple IEA Methods
    findings: []
  - id: UniProtKB:C5CXZ9
    title: "UniProtKB entry C5CXZ9 (URE2_VARPS): Urease subunit beta"
    findings:
      - statement: >-
          Vapar_4242 (C5CXZ9, ureB) is a Swiss-Prot reviewed 101-residue urease
          beta subunit (HAMAP rule MF_01954, InterPro IPR002019, Pfam PF00699)
          that forms a cytoplasmic heterotrimer with UreA (gamma) and UreC
          (alpha), with three heterotrimers associating into the active enzyme.
        supporting_text: >-
          CC   -!- SUBUNIT: Heterotrimer of UreA (gamma), UreB (beta) and UreC (alpha)
          CC       subunits. Three heterotrimers associate to form the active enzyme.
          CC       {ECO:0000255|HAMAP-Rule:MF_01954}.
  - id: PMID:8718850
    title: Structures of the Klebsiella aerogenes urease apoenzyme and two active-site mutants.
    findings:
      - statement: >-
          Three-chain bacterial urease is an (alpha beta gamma)3 trimer of
          heterotrimers in which the binickel active center resides in the
          alpha (UreC) subunit while the beta (UreB) and gamma (UreA) chains
          are structural subunits.
        supporting_text: >-
          Urease from Klebsiella aerogenes [Jabri et al. (1995) Science 268, 998-1004] is
          an (alpha beta gamma)3 trimer with each alpha-subunit having an (alpha
          beta)8-barrel domain containing a binickel active center.
        full_text_unavailable: true
    full_text_unavailable: true
  - id: PMID:21183664
    title: Complete genome sequence of the metabolically versatile plant growth-promoting endophyte Variovorax paradoxus S110.
    findings:
      - statement: >-
          Reports the complete genome sequence of Variovorax paradoxus S110, in
          which ureB (Vapar_4242) is encoded immediately upstream of ureC
          (Vapar_4243) on chromosome 1 (CP001635).
        supporting_text: >-
          Variovorax paradoxus is a microorganism of special interest due to its
          diverse metabolic capabilities, including the biodegradation of both
          biogenic compounds and anthropogenic contaminants.
