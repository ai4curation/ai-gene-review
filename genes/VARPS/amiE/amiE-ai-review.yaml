  label: Variovorax paradoxus S110
description: AmiE (Vapar_0135, C5CWZ4) is a 344-amino-acid cytoplasmic aliphatic amidase (EC 3.5.1.4)
  in Variovorax paradoxus S110 belonging to the carbon-nitrogen hydrolase superfamily (PF00795, HAMAP
  rule MF_01242). It catalyzes the hydrolysis of short-chain linear aliphatic amides to their corresponding
  monocarboxylate organic acids and ammonium using a conserved Glu59-Lys134-Cys166 catalytic triad, where
  Cys166 acts as the active-site nucleophile that forms a covalent acyl-enzyme thioester intermediate.
  In the rhizosphere, AmiE enables assimilation of environmental and plant-derived short-chain amides
  as nitrogen and carbon sources.
