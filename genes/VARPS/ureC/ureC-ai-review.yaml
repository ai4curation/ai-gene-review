  label: Variovorax paradoxus S110
description: >-
  UreC (Vapar_4243) is the 572-amino-acid catalytic alpha subunit of cytoplasmic
  nickel-dependent urease (EC 3.5.1.5) in the plant-growth-promoting endophyte
  Variovorax paradoxus S110. Together with the structural subunits UreA (gamma)
  and UreB (beta), UreC assembles into a trimer of heterotrimers ((UreABC)3)
  whose active site coordinates a dinuclear Ni(2+) metallocenter bridged by a
  post-translationally carboxylated lysine residue (Lys222) and a hydroxide ion,
  ligated by His139, His141, His251, His277, and Asp365, with His325 serving as
  the general acid proton donor. Following chaperone-assisted metallocenter
  maturation by UreD, UreF, UreG, and the nickel metallochaperone UreE, UreC
  catalyzes the hydrolysis of urea into ammonia and carbamate (which
  spontaneously decomposes to a second ammonia molecule and carbonic acid/bicarbonate),
  supplying assimilable nitrogen and elevating local pH in the rhizosphere
  where carbonate generation can also promote microbially induced metal-carbonate
  biomineralization.
