- id: UniProtKB:C5CY00
  title: "UniProtKB/Swiss-Prot record C5CY00 (URE1_VARPS) - Urease subunit alpha from Variovorax paradoxus S110"
  findings:
  - statement: >-
      Vapar_4243 encodes the 572-aa catalytic alpha subunit (UreC, EC 3.5.1.5)
      of cytoplasmic urease in Variovorax paradoxus S110, which forms a
      (UreABC)3 trimer of heterotrimers and coordinates two Ni(2+) ions per
      subunit via His139, His141, carboxylated Lys222, His251, His277, and
      Asp365.
    supporting_text: "SUBUNIT: Heterotrimer of UreA (gamma), UreB (beta) and UreC (alpha) subunits. Three heterotrimers associate to form the active enzyme. {ECO:0000255|HAMAP-Rule:MF_01953}."
- id: PMID:21183664
  title: "Complete genome sequence of the metabolically versatile plant growth-promoting endophyte Variovorax paradoxus S110."
  findings:
  - statement: >-
      Complete genome sequence of Variovorax paradoxus S110 identifying
      Vapar_4243 (ureC) and its metabolic repertoire for plant-associated nitrogen
      and mineral cycling.
    supporting_text: "The complete genome sequence of V. paradoxus S110 is composed of 6,754,997 bp with 6,279 predicted protein-coding sequences within two circular chromosomes."
- id: PMID:20046957
  title: "Interplay of metal ions and urease."
  findings:
  - statement: >-
      Bacterial three-subunit ureases assemble into a (UreABC)3 holoenzyme whose
      UreC subunit houses a dinuclear nickel metallocenter bridged by a
      carboxylated lysine residue, matured in vivo by the UreD, UreF, UreG, and
      UreE accessory proteins.
    supporting_text: "The active site of urease contains two nickel atoms bridged by a carboxylated lysine and a solvent molecule, as shown for the K. aerogenes enzyme (Fig. 2).19 In addition, Ni1 is coordinated by two His residues plus a terminal water molecule while Ni2 is coordinated by two His, an Asp, and a terminal solvent."
suggested_questions:
- question: >-
    To what extent does urease-catalyzed carbonate production and local pH
    elevation by Variovorax paradoxus S110 drive microbially induced carbonate
    precipitation (MICP) of toxic divalent heavy metals (e.g., Cd2+, Ni2+, Pb2+)
    and lanthanides in contaminated rhizosphere soils?
  experts:
  - Hausinger RP
  - Han JI
  - Leadbetter JR
suggested_experiments:
- description: >-
    Compare urea-supplemented cultures of wild-type Variovorax paradoxus S110 and
    a ΔureC (Vapar_4243) mutant for pH elevation, dissolved carbonate production,
    and extracellular precipitation of CdCO3, NiCO3, and lanthanide carbonates by
    ICP-MS and X-ray diffraction.
  hypothesis: >-
    UreC-dependent urea hydrolysis raises extracellular pH and carbonate ion
    activity sufficiently to precipitate divalent heavy metals and rare earth
    elements out of solution, protecting host roots from metal toxicity while
    supplying ammonium nitrogen.
