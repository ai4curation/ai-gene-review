taxon:
  id: NCBITaxon:543728
  label: Variovorax paradoxus S110
description: >-
  UreG (Vapar_4248) in Variovorax paradoxus S110 is a 216-amino-acid
  cytoplasmic SIMIBI-class G3E-family GTPase and nickel metallochaperone
  (HAMAP rule MF_01389, InterPro IPR004400, PANTHER PTHR31715:SF0, Pfam
  PF02492) encoded in the chromosome 1 urease gene cluster (Vapar_4240-4249).
  UreG contains a canonical P-loop GTP-binding motif (residues 24-31,
  GPVGSGKT) and an invariant Cys-Pro-His (CPH, residues 72-74) metal-binding
  motif; within the UreD-UreF-UreG activation complex, UreG accepts Ni(2+) from
  UreE and couples GTP hydrolysis to nickel release into the carbamylated
  active site of UreC (Vapar_4243).
references:
  - id: GO_REF:0000002
    title: Gene Ontology annotation through association of InterPro records with GO terms
    findings: []
  - id: GO_REF:0000120
    title: Combined Automated Annotation using Multiple IEA Methods
    findings: []
  - id: UniProtKB:C5CY05
    title: "UniProtKB entry C5CY05 (UREG_VARPS): Urease accessory protein UreG"
    findings:
      - statement: >-
          Vapar_4248 (C5CY05, ureG) is a Swiss-Prot reviewed 216-residue
          cytoplasmic SIMIBI-class G3E GTPase (HAMAP rule MF_01389, InterPro
          IPR004400, PANTHER PTHR31715:SF0) with a conserved GTP-binding motif
          at residues 24-31 that facilitates GTP-hydrolysis-dependent
          incorporation of the urease nickel metallocenter into UreC.
        supporting_text: >-
          CC   -!- FUNCTION: Facilitates the functional incorporation of the urease nickel
          CC       metallocenter. This process requires GTP hydrolysis, probably
          CC       effectuated by UreG. {ECO:0000255|HAMAP-Rule:MF_01389}.
      - statement: >-
          Vapar_4248 binds GTP at its conserved P-loop nucleotide-binding motif
          (residues 24-31).
        supporting_text: >-
          FT   BINDING         24..31
          FT                   /ligand="GTP"
          FT                   /ligand_id="ChEBI:CHEBI:37565"
          FT                   /evidence="ECO:0000255|HAMAP-Rule:MF_01389"
  - id: PMID:10500143
    title: GTP-dependent activation of urease apoprotein in complex with the UreD, UreF, and UreG accessory proteins.
    findings:
      - statement: >-
          Activation of urease apoprotein in the UreD-UreF-UreG complex at
          physiological bicarbonate concentrations requires GTP hydrolysis
          catalyzed at the nucleotide-binding site of UreG.
        supporting_text: >-
          The critical nucleotide-binding site was localized to UreG on the basis of
          experiments using a variant complex.
        full_text_unavailable: true
    full_text_unavailable: true
  - id: PMID:22369361
    title: "Klebsiella aerogenes UreF: identification of the UreG binding site and role in enhancing the fidelity of urease activation."
    findings:
      - statement: >-
          Klebsiella aerogenes UreG directly binds one nickel or zinc ion with
          micromolar affinity and serves as the GTPase in the UreD-UreF-UreG
          activation complex.
        supporting_text: >-
          In K. aerogenes this protein is a monomer that binds one Ni or one Zn with Kd values of about 5 μM
        reference_section_type: RESULTS
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: >-
        Full text verified. Directly establishes micromolar Ni(2+) binding and
        UreF-gated GTPase activity for the bacterial UreG ortholog.
  - id: PMID:21183664
    title: Complete genome sequence of the metabolically versatile plant growth-promoting endophyte Variovorax paradoxus S110.
    findings:
      - statement: >-
          Genomic analysis of Variovorax paradoxus S110 highlights its diverse
          metabolic capabilities in soil and plant-associated environments.
        supporting_text: >-
          Variovorax paradoxus is a microorganism of special interest due to its
          diverse metabolic capabilities, including the biodegradation of both
          biogenic compounds and anthropogenic contaminants.
