proposed_new_terms: []
suggested_questions:
  - question: >-
      Does Variovorax paradoxus S110 UreG (Vapar_4248) form a nickel-bridged
      homodimer via its Cys72-Pro73-His74 motif upon receiving Ni(2+) from UreE?
suggested_experiments:
  - hypothesis: >-
      Substitution of Cys72 or His74 in the conserved CPH motif of Vapar_4248
      abolishes Ni(2+)-dependent dimerization and GTP-dependent activation of
      V. paradoxus S110 apo-urease.
    description: >-
      Purify wild-type Vapar_4248 and C72A/H74A variants and assay Ni(2+)
      binding, nucleotide-dependent dimerization by size-exclusion
      chromatography, and in vitro activation of apo-UreABC.
    experiment_type: Site-directed mutagenesis, size-exclusion chromatography, and urease activation assay
