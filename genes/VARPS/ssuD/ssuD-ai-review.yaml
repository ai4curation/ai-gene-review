- id: PMID:21183664
  title: Complete genome sequence of the metabolically versatile plant growth-promoting endophyte Variovorax
    paradoxus S110.
  findings:
  - statement: Genomic analysis of Variovorax paradoxus S110 highlighted an expanded suite of metabolic
      enzymes and transporters that mobilize organic sulfur and nutrient sources for bacterial and host
      plant nutrition.
    supporting_text: Genomic analysis has revealed multiple metabolic features for autotrophic and heterotrophic
      lifestyles. These metabolic diversities enable independent survival, as well as a symbiotic lifestyle.
