id: C5CNW9
gene_symbol: ssuD
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:543728
  label: Variovorax paradoxus S110
description: SsuD (Vapar_2976) in Variovorax paradoxus S110 is a 390-amino-acid cytosolic FMNH2-dependent
  alkanesulfonate monooxygenase (EC 1.14.14.5; HAMAP rule MF_01229) belonging to the bacterial luciferase-like
  TIM-barrel superfamily. Paired with an NAD(P)H-dependent FMN reductase (SsuE), it catalyzes the oxygenolytic
  C-S bond cleavage of aliphatic sulfonates to yield the corresponding aldehyde and inorganic sulfite,
  mobilizing recalcitrant organosulfonate esters and sulfonates in agricultural rhizosphere soils for
  both bacterial assimilation and host plant sulfur nutrition.
