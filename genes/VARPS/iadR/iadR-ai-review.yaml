id: C5CSP2
gene_symbol: iadR
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:543728
  label: Variovorax paradoxus S110
description: IadR (Vapar_1489, also designated MarR_73) is a 158-amino-acid indole-3-acetic acid (IAA)-sensing
  MarR-family DNA-binding transcriptional repressor that controls expression of the iad auxin-catabolic
  operon in Variovorax paradoxus S110. IadR forms a homodimer containing a winged-helix-turn-helix (wHTH)
  DNA-binding domain (residues 13-145) with an H-T-H motif (residues 59-82) and binds specifically to
  a 24 bp operator site in the intergenic region between iadR and iadA to repress transcription of the
  iad operon in the absence of auxin. When IAA is present, each IadR monomer binds IAA directly with sub-micromolar
  affinity (Kd = 0.41 uM) via an indole-binding pocket (Tyr15, Ala18, Trp45, Arg46, Val65) and carboxylate-coordinating
  triad (Ser28, His32, Arg46), triggering a conformational shift in the DNA-binding helices that releases
  IadR from operator DNA and derepresses transcription of the IAA degradation pathway.
