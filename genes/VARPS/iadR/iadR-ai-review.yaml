- description: Homodimeric MarR-family DNA-binding transcriptional repressor that binds a 24 bp operator
    upstream of iadA to repress transcription of the iad auxin-catabolic operon in the absence of auxin
    and directly binds indole-3-acetic acid (IAA) to trigger DNA release and operon derepression.
