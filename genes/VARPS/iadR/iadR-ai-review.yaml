suggested_questions:
- question: What is the identity of the additional IAA-responsive transcriptional regulator that further
    induces the iad operon upon IAA addition in a ΔiadR (ΔMarR_73) mutant background?
suggested_experiments:
- description: Determine the co-crystal structure of unliganded IadR bound to its 24 bp operator DNA duplex
    and compare it against the 1.3 A IAA-bound structure (PDB 7KFO).
  hypothesis: Operator DNA binding stabilizes a ~28 A inter-recognition-helix spacing in unliganded IadR,
    whereas IAA binding locks the wHTH domains into the 38 A splayed conformation observed in PDB 7KFO.
  experiment_type: X-ray crystallography of protein-DNA complex
