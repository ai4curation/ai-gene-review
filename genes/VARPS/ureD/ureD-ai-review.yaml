id: C5CVT2
gene_symbol: ureD
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:543728
  label: Variovorax paradoxus S110
description: >-
  UreD (Vapar_3971) in Variovorax paradoxus S110 is a 276-amino-acid
  cytoplasmic urease accessory protein (HAMAP rule MF_01384, InterPro
  IPR002669, PANTHER PTHR33643:SF1, Pfam PF01774). Based on conserved bacterial
  urease maturation biochemistry, UreD binds the inactive (UreABC)3 apoprotein,
  stabilizes an activation-competent conformation, and scaffolds the recruitment
  of UreF and the GTPase UreG to promote carbamylation and dinickel
  metallocenter installation in the UreC active site.
references:
  - id: GO_REF:0000120
    title: Combined Automated Annotation using Multiple IEA Methods
    findings: []
  - id: UniProtKB:C5CVT2
    title: "UniProtKB entry C5CVT2 (URED_VARPS): Urease accessory protein UreD"
    findings:
      - statement: >-
          Vapar_3971 (C5CVT2, ureD) is a Swiss-Prot reviewed 276-residue
          cytoplasmic urease accessory protein (HAMAP rule MF_01384, InterPro
          IPR002669, PANTHER PTHR33643:SF1) required for maturation of urease
          via functional incorporation of the nickel metallocenter as part of
          the UreD-UreF-UreG chaperone complex.
        supporting_text: "CC   -!- FUNCTION: Required for maturation of urease via the functional\nCC       incorporation of the urease nickel metallocenter. {ECO:0000255|HAMAP-\nCC       Rule:MF_01384}."
  - id: PMID:7909161
    title: In vitro activation of urease apoprotein and role of UreD as a chaperone required for nickel metallocenter assembly.
    findings:
      - statement: >-
          UreD binds the urease apoprotein and stabilizes an activation-competent
          conformation required for productive nickel incorporation into the
          active site.
        supporting_text: >-
          We propose that UreD is a chaperone protein which stabilizes a urease
          apoprotein conformation that is competent for nickel incorporation.
        full_text_unavailable: true
    full_text_unavailable: true
  - id: PMID:22369361
    title: "Klebsiella aerogenes UreF: identification of the UreG binding site and role in enhancing the fidelity of urease activation."
    findings:
      - statement: >-
          A soluble Klebsiella aerogenes MBP-UreD fusion binds divalent metal
          ions (nickel and zinc) in vitro.
        supporting_text: MBP-UreD binds divalent metal ions
        reference_section_type: RESULTS
    reference_review:
      relevance: MEDIUM
      correctness: VERIFIED
      review_notes: >-
        Full text verified. Supports family-level divalent metal binding by
        UreD as a secondary property alongside its primary apoprotein-scaffolding
        role.
  - id: PMID:21183664
    title: Complete genome sequence of the metabolically versatile plant growth-promoting endophyte Variovorax paradoxus S110.
    findings:
      - statement: >-
          Genomic analysis of Variovorax paradoxus S110 highlights its diverse
          metabolic capabilities in soil and plant-associated environments.
        supporting_text: >-
          Variovorax paradoxus is a microorganism of special interest due to its
          diverse metabolic capabilities, including the biodegradation of both
          biogenic compounds and anthropogenic contaminants.
