proposed_new_terms: []
suggested_questions:
  - question: >-
      Why is ureD (Vapar_3971) encoded at a separate locus from the main
      ureA-ureB-ureC-ureEFGD cluster (Vapar_4240-Vapar_4249) on chromosome 1 of
      Variovorax paradoxus S110, and is Vapar_4249 a second functional UreD
      paralog?
suggested_experiments:
  - hypothesis: >-
      Vapar_3971 (UreD) forms a direct pre-activation complex with V. paradoxus
      S110 apo-UreABC (Vapar_4240/Vapar_4242/Vapar_4243) and recruits UreF and
      UreG (Vapar_4248).
    description: >-
      Perform pull-down and in vitro urease activation assays with purified
      Vapar_3971, apo-UreABC, UreF, and UreG in the presence of Ni(2+),
      bicarbonate, and GTP.
    experiment_type: Protein-protein interaction pull-down and in vitro urease activation assay
