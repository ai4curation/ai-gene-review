    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: enables
    supporting_entities:
      - InterPro:IPR002669
      - UniRule:UR000076261
    review:
      summary: >-
        Orthologous UreD binds divalent metal ions in vitro, but selective
        nickel delivery is mediated by UreE and UreG rather than UreD.
      action: KEEP_AS_NON_CORE
      reason: >-
        Purified Klebsiella aerogenes MBP-UreD binds divalent metal ions
        including Ni(2+) and Zn(2+) (PMID:22369361), supporting retention as a
        non-core annotation, whereas UreD's defining core role is scaffolding
        the UreDFG activation complex on apo-urease (GO:0018237, GO:0044183).
      supported_by:
        - reference_id: PMID:22369361
          supporting_text: MBP-UreD binds divalent metal ions
  - term:
      id: GO:0018237
      label: urease activator activity
    evidence_type: ISS
    original_reference_id: PMID:7909161
    qualifier: enables
    review:
      summary: >-
        UreD binds apo-urease and promotes nickel incorporation into the UreC
        active site.
      action: NEW
      reason: >-
        Inferred from sequence and structural similarity (ISS) to Klebsiella
        aerogenes UreD (PMID:7909161; PANTHER PTHR33643:SF1), which binds
        apo-UreABC and is required to form activation-competent complexes for
        nickel incorporation into the active site (GO:0018237).
      supported_by:
        - reference_id: PMID:7909161
          supporting_text: >-
            The UreD-urease apoprotein complexes are competent for activation by nickel, with
            the level of activity obtained being directly related to the number of UreD
            molecules bound per urease molecule.
