- id: PMID:10926491
  title: The internal head protein Gp16 controls DNA ejection from the bacteriophage T7 virion.
  findings:
  - statement: Demonstrated that gp16 controls the transcription-independent translocation of the leading end of the T7 genome
      into the host cell.
    supporting_text: Mutant virions containing an altered gene 16 protein either prevent the blocks to transcription-independent
      DNA translocation or effect rapid release from blocking sites and allow the entire phage DNA molecule to enter the cell
      at a constant rate of about 75 bp per second.
- id: PMID:14763988
  title: Peptidoglycan hydrolytic activities associated with bacteriophage virions.
  findings:
  - statement: Characterized the N-terminal peptidoglycan lytic transglycosylase activity of gp16 and showed its requirement
      when the bacterial cell wall is highly cross-linked.
    supporting_text: T7gp16 is a 144 kDa internal head protein that is ejected into the cell at the initiation of infection;
      its enzyme activity is required only when the cell wall is more highly cross-linked.
- id: PMID:20036409
  title: Gp15 and gp16 cooperate in translocating bacteriophage T7 DNA into the infected cell.
  findings:
  - statement: Showed that ejected gp15 and gp16 associate with the host cell envelope and cooperate in ratcheting the leading
      end of the T7 genome into the host cytoplasm.
    supporting_text: After ejection from the infecting particle, gp15 and gp16 thus function together in ratcheting the leading
      end of the T7 genome into the cytoplasm of the infected cell.
- id: PMID:23306440
  title: The bacteriophage t7 virion undergoes extensive structural remodeling during infection.
  findings:
  - statement: Cryo-electron tomography revealed that gp16 spans the host cytoplasmic membrane and forms an intracellular
      hub during genome delivery.
    supporting_text: Gp14 localizes to the infected cell outer membrane, whereas gp15 and gp16 span the periplasm and cytoplasmic
      membrane.
- id: PMID:34214465
  title: Cryo-EM structure of the periplasmic tunnel of T7 DNA-ejectosome at 2.7 Å resolution.
  findings:
  - statement: Solved the 2.7-angstrom cryo-EM structure of the gp15-gp16N periplasmic tunnel complex and showed that gp16
      coordinates peptidoglycan hydrolysis, gp15 oligomerization, DNA binding, and lipid insertion.
    supporting_text: Gp16 promotes gp15 oligomerization, coordinating peptidoglycan hydrolysis, DNA binding, and lipid insertion.
suggested_questions:
- question: What is the atomic structure of the ~4,200-residue gp16 cytoplasmic hub, and how does it harness the proton-motive
    force or DNA binding energy to ratchet the leading 850 bp of the T7 genome into the cytoplasm before host RNA polymerase
    engagement?
  experts:
  - Gino Cingolani
  - Ian J. Molineux
  - Jun Liu
suggested_experiments:
- description: Determine the high-resolution cryo-EM structure of full-length hexameric gp16 reconstituted in lipid nanodiscs
    bound to the gp15 periplasmic tunnel and double-stranded DNA.
  hypothesis: The C-terminal transmembrane and cytoplasmic domains of gp16 form a hexameric DNA-binding ring across the inner
    membrane that undergoes asymmetric conformational stepping to prevent backward sliding of ejected viral DNA.
