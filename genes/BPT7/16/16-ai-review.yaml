id: P03726
gene_symbol: '16'
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10760
  label: Escherichia phage T7
description: Multifunctional internal virion protein gp16 is the largest subunit (~144 kDa) of the cylindrical internal core
  complex inside the mature bacteriophage T7 head. At the initiation of infection, gp16 is ejected through the portal-tail
  channel into the Escherichia coli cell envelope, where its N-terminal lytic exotransglycosylase domain locally cleaves host
  cell wall peptidoglycan while chaperoning hexamerization of the gp15 periplasmic DNA tunnel, and its C-terminal region inserts
  into the host cytoplasmic membrane and extends into the host cytoplasm as a hub that ratchets the leading end of the viral
  genome into the cell.
