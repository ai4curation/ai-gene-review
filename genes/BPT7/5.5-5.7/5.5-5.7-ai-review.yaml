  title: Complete nucleotide sequence of bacteriophage T7 DNA and the locations of T7 genetic elements.
  findings:
  - statement: Identified the overlapping reading frames of genes 5.5 and 5.7 and proposed that a -1 frameshift
      during translation of gene 5.5 produces the 5.5-5.7 fusion protein.
    supporting_text: Complete nucleotide sequence of bacteriophage T7 DNA and the locations of T7 genetic
      elements.
- id: file:genes/BPT7/5.5-5.7/5.5-5.7-uniprot.txt
  title: UniProtKB record for P03787 (V5557_BPT7)
  findings:
  - statement: Describes the 169-amino-acid 5.5-5.7 fusion protein generated by a -1 frameshift during
      translation of gene 5.5.
    supporting_text: It is believed that a second protein is produced by a -1 frameshift during the translation
      of gene 5.5.
suggested_questions:
- question: Does the gp5.5-5.7 fusion protein physically bridge host H-NS and host RNA polymerase holoenzyme
    at silenced T7 early promoters?
suggested_experiments:
- description: Purify recombinant gp5.5-5.7 fusion protein and compare its binding affinity and inhibitory
    activity toward Escherichia coli H-NS and sigma70-RNA polymerase holoenzyme against equimolar mixtures
    of isolated gp5.5 and gp5.7.
  hypothesis: Covalent linkage of the gp5.5 and gp5.7 domains targets the gp5.7 RNA polymerase inhibitor
    module directly to H-NS-bound nucleoid regions.
