id: P03787
gene_symbol: 5.5-5.7
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10760
  label: Escherichia phage T7
description: Fusion protein gp5.5-5.7 of Escherichia phage T7 produced by a -1 ribosomal frameshift near
  the 3' end of gene 5.5 into the overlapping reading frame of gene 5.7, combining the N-terminal gp5.5
  H-NS-binding anti-silencing domain (residues 1-98) with the C-terminal gp5.7 domain (residues 101-169).
alternative_products:
- id: P03787-1
  name: 5.5-5.7
  sequence_note: Fusion protein produced by -1 ribosomal frameshifting during translation of gene 5.5.
- id: P0DJY3-1
  name: '5.5'
  sequence_note: Canonical gp5.5 protein produced without ribosomal frameshifting.
existing_annotations:
- term:
    id: GO:0075523
    label: viral translational frameshifting
  evidence_type: IEA
  original_reference_id: GO_REF:0000043
  qualifier: involved_in
  supporting_entities:
  - UniProtKB-KW:KW-0688
  review:
    summary: Fusion protein gp5.5-5.7 is synthesized via a -1 ribosomal frameshift during translation
      of gene 5.5 mRNA.
    action: KEEP_AS_NON_CORE
    reason: Viral translational frameshifting describes the mechanism of synthesis of the 5.5-5.7 fusion
      polypeptide from the viral mRNA rather than the downstream activity of the mature protein.
    supported_by:
    - reference_id: file:genes/BPT7/5.5-5.7/5.5-5.7-uniprot.txt
      supporting_text: It is believed that a second protein is produced by a -1 frameshift during the
        translation of gene 5.5.
- term:
    id: GO:0003674
    label: molecular_function
  evidence_type: ND
  original_reference_id: GO_REF:0000015
  qualifier: enables
  review:
    summary: The distinct molecular function of the full-length gp5.5-5.7 fusion protein has not been
      directly characterized experimentally.
    action: NEW
    reason: Although the individual gp5.5 and gp5.7 polypeptides bind host H-NS and host RNA polymerase
      respectively, the specific biochemical activity of the intact gp5.5-5.7 frameshift fusion protein
      has not been directly assayed; root molecular_function with ND is assigned.
    supported_by:
    - reference_id: file:genes/BPT7/5.5-5.7/5.5-5.7-uniprot.txt
      supporting_text: It is believed that a second protein is produced by a -1 frameshift during the
        translation of gene 5.5.
core_functions:
- description: Frameshift fusion protein combining the N-terminal gp5.5 domain and C-terminal gp5.7 domain
    whose distinct composite molecular function has not been directly assayed.
  molecular_function:
