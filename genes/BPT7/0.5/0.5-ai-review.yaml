suggested_questions:
- question: Is gp0.5 inserted into the Escherichia coli inner membrane during T7 infection, and does it modulate host membrane
    potential or envelope stress responses?
suggested_experiments:
- description: Perform carbonate extraction and inner/outer membrane sucrose gradient fractionation on E. coli cells expressing
    epitope-tagged gp0.5 from native T7 promoters.
  hypothesis: Gp0.5 partitions exclusively with the detergent-soluble inner membrane fraction via its C-terminal transmembrane
    helix (residues 24-43).
