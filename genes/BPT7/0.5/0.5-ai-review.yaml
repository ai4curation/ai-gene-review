id: P03777
gene_symbol: '0.5'
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10760
  label: Escherichia phage T7
description: Small uncharacterized Class I early protein (gp0.5, 47 amino acids) encoded between genes 0.4 and 0.6A in the
  early region of the bacteriophage T7 genome. Contains a hydrophobic transmembrane segment (residues 24-43) predicted to
  anchor the peptide in the host Escherichia coli inner membrane; its specific physiological role during infection has not
  been experimentally determined.
existing_annotations:
- term:
    id: GO:0033644
    label: host cell membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  supporting_entities:
  - UniProtKB-SubCell:SL-0380
  review:
    summary: Sequence analysis identifies a hydrophobic transmembrane helix spanning residues 24-43 consistent with insertion
      into the host cell membrane.
    action: ACCEPT
    reason: Dunn and Studier (PMID:6864790) and Studier (PMID:7310871) noted that the 47-residue gp0.5 polypeptide is highly
      hydrophobic and contains a single-pass transmembrane segment predicted to localize to the host cytoplasmic membrane.
core_functions:
- description: Putative single-pass transmembrane peptide predicted to localize to the host bacterial cell membrane during
    early T7 infection.
  locations:
  - id: GO:0033644
    label: host cell membrane
