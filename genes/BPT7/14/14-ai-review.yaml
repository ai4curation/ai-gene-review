id: P03724
gene_symbol: '14'
taxon:
  id: NCBITaxon:10760
  label: Escherichia phage T7
description: Internal virion protein gp14 is a component of the cylindrical internal core complex packaged inside the mature
  bacteriophage T7 capsid head alongside gp15 and gp16. Upon virion attachment to the Escherichia coli surface, gp14 is the
  first core protein ejected through the portal-tail channel and inserts into the host outer membrane to form a transmembrane
  pore that anchors the periplasmic gp15-gp16 DNA-ejectosome channel for viral genome translocation across the host cell envelope.
existing_annotations:
- term:
    id: GO:0020002
    label: host cell plasma membrane
  evidence_type: EXP
  original_reference_id: PMID:20036409
  review:
    summary: Fractionation of infected Escherichia coli envelopes by sucrose density gradient centrifugation and Sarkosyl
      extraction showed that ejected gp14 localizes to the host outer membrane rather than the inner plasma membrane.
    action: MODIFY
    reason: Chang et al. (2010) explicitly demonstrated that ejected gp14 is Sarkosyl-insoluble and co-sediments with the
      outer membrane marker OmpA, localizing to the host outer membrane (GO:0044384) rather than the inner plasma membrane
      (GO:0020002).
    proposed_replacement_terms:
    - id: GO:0044384
      label: host outer membrane
    supported_by:
    - reference_id: PMID:20036409
      supporting_text: Essentially all the gp14 remained insoluble, indicating that it had localized to the outer membrane.
- term:
    id: GO:0020002
    label: host cell plasma membrane
  evidence_type: EXP
  original_reference_id: PMID:23306440
  review:
    summary: Cryo-electron tomography of T7-infected Escherichia coli minicells shows that gp14 localizes to the host outer
      membrane as part of the trans-envelope ejection channel.
    action: MODIFY
    reason: Hu et al. (2013) explicitly state that gp14 localizes to the infected cell outer membrane; the accurate cellular
      component term is host outer membrane (GO:0044384) rather than host cell plasma membrane (GO:0020002).
    proposed_replacement_terms:
    - id: GO:0044384
      label: host outer membrane
    supported_by:
    - reference_id: PMID:23306440
      supporting_text: Gp14 localizes to the infected cell outer membrane, whereas gp15 and gp16 span the periplasm and cytoplasmic
        membrane.
- term:
    id: GO:0020002
    label: host cell plasma membrane
  evidence_type: IDA
  original_reference_id: PMID:34214465
  review:
    summary: Structural and functional analyses of the T7 DNA-ejectosome demonstrate that gp14 forms a membrane-spanning pore
      in the Escherichia coli outer membrane.
    action: MODIFY
    reason: Swanson et al. (2021) show that gp14 forms the outer membrane pore of the T7 DNA-ejectosome while gp15 spans the
      periplasm and gp16 crosses the inner plasma membrane; therefore GO:0020002 should be replaced by GO:0044384 (host outer
      membrane).
    proposed_replacement_terms:
    - id: GO:0044384
      label: host outer membrane
    supported_by:
    - reference_id: PMID:34214465
      supporting_text: We find that gp14 forms an outer membrane pore, gp15 assembles into a 210 Å hexameric DNA tube spanning
        the host periplasm, and gp16 extends into the host cytoplasm forming a ∼4,200 residue hub.
