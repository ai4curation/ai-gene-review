- id: PMID:6864790
  title: Complete nucleotide sequence of bacteriophage T7 DNA and the locations of T7 genetic elements.
  findings:
  - statement: Determined the nucleotide sequence of T7 gene 14 encoding the 196-amino-acid internal virion protein gp14.
- id: PMID:16054667
  title: Changes in bacteriophage T7 virion structure at the initiation of infection.
  findings:
  - statement: Showed that the internal core proteins are ejected from the T7 virion into the infected cell at the initiation
      of infection.
    supporting_text: Five proteins are ejected from the bacteriophage T7 virion at the initiation of infection. The three
      known proteins of the internal core enter the infected cell
- id: PMID:20036409
  title: Gp15 and gp16 cooperate in translocating bacteriophage T7 DNA into the infected cell.
  findings:
  - statement: Demonstrated by sucrose gradient fractionation and Sarkosyl extraction of T7-infected Escherichia coli membranes
      that ejected gp14 partitions exclusively into the host outer membrane.
    supporting_text: Essentially all the gp14 remained insoluble, indicating that it had localized to the outer membrane.
- id: PMID:23306440
  title: The bacteriophage t7 virion undergoes extensive structural remodeling during infection.
  findings:
  - statement: Resolved the coaxial ring architecture of the gp14-gp15-gp16 internal core inside the T7 head and the trans-envelope
      tail extension formed across the host envelope during DNA ejection.
    supporting_text: Gp14 localizes to the infected cell outer membrane, whereas gp15 and gp16 span the periplasm and cytoplasmic
      membrane.
- id: PMID:34214465
  title: Cryo-EM structure of the periplasmic tunnel of T7 DNA-ejectosome at 2.7 Å resolution.
  findings:
  - statement: Showed that purified gp14 forms open channels in lipid bilayers and constitutes the outer membrane pore of
      the T7 DNA-ejectosome.
    supporting_text: We find that gp14 forms an outer membrane pore, gp15 assembles into a 210 Å hexameric DNA tube spanning
      the host periplasm, and gp16 extends into the host cytoplasm forming a ∼4,200 residue hub.
suggested_questions:
- question: Does gp14 transition from an 8-fold ring in the internal virion core to a hexameric pore in the host outer membrane
    to match the 6-fold symmetry of the periplasmic gp15-gp16 tunnel?
  experts:
  - Gino Cingolani
  - Ian J. Molineux
  - Jun Liu
suggested_experiments:
- description: Determine the high-resolution cryo-EM structure of detergent- or nanodisc-reconstituted gp14 bound to the N-terminal
    region of gp15.
  hypothesis: Membrane insertion of gp14 induces a conformational rearrangement into a beta-barrel or alpha-helical transmembrane
    pore that docks stoichiometrically onto the hexameric gp15 periplasmic tunnel.
