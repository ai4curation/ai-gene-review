id: P03804
gene_symbol: '19.5'
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10760
  label: Escherichia phage T7
description: Uncharacterized 49-amino-acid protein gp19.5 encoded near the right terminal end of the bacteriophage T7 genome.
  It contains a predicted N-terminal signal peptide (residues 1-24) and the conserved domain of unknown function DUF5465 (PF17553/IPR035326),
  but its biological function remains unknown.
existing_annotations: []
core_functions: []
references:
- id: PMID:6864790
  title: Complete nucleotide sequence of bacteriophage T7 DNA and the locations of T7 genetic elements.
  findings:
  - statement: Identified gene 19.5 near the right end of the bacteriophage T7 genome.
suggested_questions:
- question: Does gp19.5 insert into the Escherichia coli inner membrane or undergo Sec-dependent signal peptide cleavage to
    release a 25-amino-acid periplasmic peptide during late T7 infection?
  experts:
  - Ian J. Molineux
  - Ry Young
suggested_experiments:
- description: Express a C-terminally PhoA/GFP-tagged gp19.5 fusion in Escherichia coli and analyze membrane fractionation
    and signal peptidase I cleavage by immunoblotting.
  hypothesis: The hydrophobic N-terminal region of gp19.5 targets the peptide to the host cell envelope during late infection.
