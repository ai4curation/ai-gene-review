suggested_questions:
- question: Does gp19.5 insert into the Escherichia coli inner membrane or undergo Sec-dependent signal peptide cleavage to release a 25-amino-acid periplasmic peptide during late T7 infection?
  experts:
  - Ian J. Molineux
  - Ry Young
suggested_experiments:
- description: Express a C-terminally PhoA/GFP-tagged gp19.5 fusion in Escherichia coli and analyze membrane fractionation and signal peptidase I cleavage by immunoblotting.
  hypothesis: The hydrophobic N-terminal region of gp19.5 targets the peptide to the host cell envelope during late infection.
