description: Uncharacterized 49-amino-acid protein gp19.5 encoded near the right terminal end of the bacteriophage T7 genome. It contains a predicted N-terminal signal peptide (residues 1-24) and the conserved domain of unknown function DUF5465 (PF17553/IPR035326), but its biological function remains unknown.
