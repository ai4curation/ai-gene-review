id: P03696
gene_symbol: '2.5'
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10760
  label: Escherichia phage T7
description: Essential Class II single-stranded DNA-binding protein (gp2.5) that forms a homodimer in solution and coats transiently
  exposed single-stranded DNA at the viral replication fork via its OB-fold core domain. Coordinates leading- and lagging-strand
  viral DNA synthesis through direct interactions of its acidic C-terminal tail with T7 DNA polymerase (gp5) and the helicase-primase
  (gp4), and promotes homologous DNA strand annealing required for phage DNA recombination, concatemer formation, and double-strand
  break repair.
