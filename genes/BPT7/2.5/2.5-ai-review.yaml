suggested_questions:
- question: How does the conformational switch between the autoinhibited gp2.5 homodimer and the ssDNA-bound monomer regulate
    the timing of gp5 and gp4 recruitment on lagging-strand loops?
suggested_experiments:
- description: Use single-molecule fluorescence imaging of fluorescently labeled gp2.5 and gp5/trx on rolling-circle replication
    templates to visualize C-terminal tail release and polymerase exchange in real time.
  hypothesis: Binding of gp2.5 to nascent lagging-strand ssDNA displaces the intramolecularly bound acidic C-terminal tail,
    exposing the Phe232-terminated motif to capture recycling gp5/trx complexes.
