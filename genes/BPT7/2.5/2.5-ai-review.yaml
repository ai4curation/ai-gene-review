core_functions:
- description: Binds single-stranded DNA via its OB-fold core and interacts through its acidic C-terminal tail with T7 DNA
    polymerase (gp5) and helicase-primase (gp4) to coordinate viral DNA genome replication, while catalyzing homologous strand
    annealing for DNA recombination and repair.
