  label: Escherichia phage T7
description: Class II holin gp17.5 is a small two-transmembrane-helix protein that accumulates in the Escherichia coli inner
  (cytoplasmic) membrane during late lytic infection and triggers timed membrane permeabilization and depolarization, enabling
  peptidoglycan degradation and viral release by host cell lysis.
