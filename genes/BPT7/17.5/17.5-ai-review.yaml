suggested_questions:
- question: Does T7 holin gp17.5 act as a canonical macromolecular hole former that allows cytoplasmic gp3.5 amidase to cross
    the inner membrane, or as a pinholin whose membrane depolarization releases pre-exported or membrane-tethered gp3.5?
  experts:
  - Ry Young
  - Ian J. Molineux
suggested_experiments:
- description: Measure lesion size in the Escherichia coli inner membrane induced by gp17.5 expression using periplasmic GFP-fusion
    release assays and cryo-electron tomography.
  hypothesis: gp17.5 forms micron-scale inner-membrane lesions (canonical holin pores) sufficient for cytoplasmic gp3.5 to
    diffuse into the periplasm and also triggers gp18.5-gp18.7 spanin-mediated outer membrane disruption.
