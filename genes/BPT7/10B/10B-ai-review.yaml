suggested_questions:
- question: What is the selective advantage of displaying the 57-residue C-terminal extension of gp10B on the exterior of
    the T7 capsid in natural environments?
suggested_experiments:
- description: Compete wild-type T7 against a synonymous frameshift-null mutant (producing only gp10A) across intestinal mucus,
    biofilm matrices, and diverse Escherichia coli hosts.
  hypothesis: The flexible, surface-exposed C-terminal extension of gp10B modulates virion surface charge and interactions
    with host mucosal or biofilm surfaces.
