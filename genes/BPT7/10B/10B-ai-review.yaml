  qualifier: involved_in
  supporting_entities:
  - UniProtKB-KW:KW-0688
  review:
    summary: Minor capsid protein gp10B is produced by a -1 ribosomal frameshift near the 3' end of the gene 10A coding region.
    action: KEEP_AS_NON_CORE
    reason: Viral translational frameshifting describes the mechanism of synthesis of gp10B from the viral mRNA rather than
      the structural function of the mature capsid subunit.
    supported_by:
    - reference_id: PMID:1938901
      supporting_text: 'Gene 10 of bacteriophage T7, which encodes the most abundant capsid protein, has two products: a major
        product, 10A (36 kDa), and a minor product, 10B (41 kDa). 10B is produced by frameshifting into the -1 frame near
        the end of the 10A coding frame and is incorporated into the capsid.'
