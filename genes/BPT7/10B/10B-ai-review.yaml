id: P19727
gene_symbol: 10B
aliases:
- gp10B
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10760
  label: Escherichia phage T7
description: Minor capsid protein gp10B of Escherichia phage T7 synthesized via a -1 ribosomal frameshift near the 3' end
  of gene 10A mRNA (~10% frequency) that shares the N-terminal 341-residue HK97-like capsid fold of gp10A followed by a unique
  57-residue surface-exposed C-terminal extension and co-assembles with gp10A into the T=7 levo icosahedral viral capsid.
alternative_products:
