  name: 10B
  sequence_note: Minor capsid protein produced by -1 ribosomal frameshifting near the 3' end of gene 10A.
- id: P19726-1
  name: 10A
  sequence_note: Canonical major capsid protein produced without ribosomal frameshifting.
