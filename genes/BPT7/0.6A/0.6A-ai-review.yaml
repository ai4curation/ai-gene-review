  findings: []
suggested_questions:
- question: What is the molecular target of gp0.6A and its frameshift isoform gp0.6B in Escherichia coli, and what cis-acting
    mRNA sequence promotes the +1 ribosomal frameshift?
suggested_experiments:
- description: Perform affinity purification-mass spectrometry (AP-MS) of tagged gp0.6A and gp0.6B in T7-infected E. coli
    and assay dual-luciferase frameshifting reporters spanning the 3' end of gene 0.6A.
  hypothesis: A slippery sequence preceding the 0.6A stop codon directs +1 ribosomal frameshifting to produce gp0.6B, and
    one or both isoforms interact with host cytoplasmic factors during early takeover.
