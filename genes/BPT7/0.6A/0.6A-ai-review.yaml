id: P03778
gene_symbol: 0.6A
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10760
  label: Escherichia phage T7
description: Uncharacterized Class I early protein (gp0.6A, 53 amino acids) encoded between genes 0.5 and 0.7 in the early
  region of the bacteriophage T7 genome. A ribosomal frameshift near the 3' end of the 0.6A coding sequence also produces
  a longer 111-amino-acid isoform (gp0.6B) sharing the N-terminal 52 residues; the molecular and physiological functions of
  both products during T7 infection remain unknown.
