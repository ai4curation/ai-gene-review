  label: Escherichia phage T7
description: Essential tail assembly and host-adsorption protein gp7.3 of Escherichia phage T7 that resides within the axial
  channel of the mature virion tail nozzle, is required for assembly of adsorption-competent infectious virions, and is ejected
  from the virion upon initiation of host infection.
