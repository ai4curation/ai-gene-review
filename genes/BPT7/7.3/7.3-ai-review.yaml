- id: file:genes/BPT7/7.3/7.3-uniprot.txt
  title: UniProtKB record for P03751 (GP73_BPT7)
  findings:
  - statement: Annotates gp7.3 as a virion tail assembly protein required for phage adsorption and resolved in cryo-EM structure
      PDB 9JYZ.
    supporting_text: Plays an essential role most probably in virion tail assembly. May form a scaffold around which gp11
      and gp12 polymerize.
suggested_questions:
- question: How does gp7.3 positioned inside the gp12 tail nozzle confer adsorption competence to the exterior of the T7 tail
    tip, and does it interact directly with host outer-membrane lipopolysaccharide before gp14/gp15/gp16 core ejection?
suggested_experiments:
- description: Perform cryo-electron tomography of gp7.3-deficient T7 virions incubated with Escherichia coli minicells and
    compare the conformation of the distal gp12 nozzle tip against wild-type virions.
  hypothesis: gp7.3 acts as a central plug and scaffold at the distal tip of the gp12 nozzle that stabilizes the closed receptor-binding
    conformation of the nozzle loops.
