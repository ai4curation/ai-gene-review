core_functions:
- description: Assembles into a 210-angstrom-long hexameric DNA-binding tunnel spanning the host periplasmic space after ejection
    from the internal virion core, connecting the gp14 outer membrane pore to the gp16 inner membrane channel to translocate
    the viral genome into the host cytoplasm.
