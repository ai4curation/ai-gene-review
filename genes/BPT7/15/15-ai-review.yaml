id: P03725
gene_symbol: '15'
taxon:
  id: NCBITaxon:10760
  label: Escherichia phage T7
description: Internal virion protein gp15 is the central cylindrical ring subunit of the internal core complex inside the
  mature bacteriophage T7 head. At the initiation of infection, gp15 is ejected through the portal-tail channel into the Escherichia
  coli cell envelope, where it assembles with the N-terminal domain of gp16 into a 210-angstrom-long hexameric periplasmic
  DNA tunnel that bridges the gp14 outer membrane pore to the inner membrane during viral genome ejection.
