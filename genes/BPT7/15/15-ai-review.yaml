  title: Complete nucleotide sequence of bacteriophage T7 DNA and the locations of T7 genetic elements.
  findings:
  - statement: Determined the complete sequence of T7 gene 15 encoding the 747-amino-acid internal virion protein gp15.
- id: PMID:16054667
  title: Changes in bacteriophage T7 virion structure at the initiation of infection.
  findings:
  - statement: Showed that the internal core proteins are ejected from the T7 virion at the initiation of infection.
    supporting_text: Five proteins are ejected from the bacteriophage T7 virion at the initiation of infection. The three
      known proteins of the internal core enter the infected cell
- id: PMID:20036409
  title: Gp15 and gp16 cooperate in translocating bacteriophage T7 DNA into the infected cell.
  findings:
  - statement: Demonstrated that ejected gp15 and gp16 span the periplasm and cooperate in translocating T7 DNA into the infected
      cell.
    supporting_text: After ejection from the infecting particle, gp15 and gp16 thus function together in ratcheting the leading
      end of the T7 genome into the cytoplasm of the infected cell.
- id: PMID:23306440
  title: The bacteriophage t7 virion undergoes extensive structural remodeling during infection.
  findings:
  - statement: Visualized the internal core inside mature T7 virions and the trans-envelope channel formed across the host
      cell envelope during genome ejection.
    supporting_text: Gp14 localizes to the infected cell outer membrane, whereas gp15 and gp16 span the periplasm and cytoplasmic
      membrane.
- id: PMID:34214465
  title: Cryo-EM structure of the periplasmic tunnel of T7 DNA-ejectosome at 2.7 Å resolution.
  findings:
  - statement: Determined the 2.7-angstrom cryo-EM structure of the hexameric gp15 periplasmic tunnel in complex with the
      N-terminal peptidoglycan hydrolase domain of gp16 and characterized its DNA-binding and periplasmic bridging properties.
    supporting_text: We find that gp14 forms an outer membrane pore, gp15 assembles into a 210 Å hexameric DNA tube spanning
      the host periplasm, and gp16 extends into the host cytoplasm forming a ∼4,200 residue hub.
suggested_questions:
- question: How do individual gp15 monomers unfold to pass through the ~35-angstrom portal-tail constriction and subsequently
    refold in the oxidizing periplasm into a hexamer instead of the octameric symmetry seen in the virion core?
  experts:
  - Gino Cingolani
  - Ian J. Molineux
suggested_experiments:
- description: Perform single-molecule fluorescence resonance energy transfer (smFRET) and hydrogen-deuterium exchange mass
    spectrometry (HDX-MS) on gp15 during heat- or receptor-triggered in vitro ejection from T7 virions.
  hypothesis: gp15 undergoes vectorial N-to-C-terminal unfolding during transit through the tail nozzle and templates its
    hexameric refolding on the pre-inserted gp14 outer membrane pore.
status: COMPLETE
