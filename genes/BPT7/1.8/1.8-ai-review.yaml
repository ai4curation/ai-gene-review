description: Small uncharacterized Class II protein (gp1.8, 48 amino acids) encoded between the nucleotide kinase gene 1.7
  and the host RNA polymerase inhibitor gene 2 in the middle region of the bacteriophage T7 genome. Non-essential for lytic
  growth under standard laboratory conditions; its molecular target and biological function during T7 infection remain unknown.
