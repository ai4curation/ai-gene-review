id: P03789
gene_symbol: '19.2'
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10760
  label: Escherichia phage T7
description: Uncharacterized 85-amino-acid protein gp19.2 encoded in the late right-end region of the bacteriophage T7 genome
  and containing the conserved T7-like phage domain of unknown function DUF5477 (PF17571/IPR035340). Its biological role during
  phage infection remains unknown.
existing_annotations: []
core_functions: []
references:
- id: PMID:6864790
  title: Complete nucleotide sequence of bacteriophage T7 DNA and the locations of T7 genetic elements.
  findings:
  - statement: Identified the potential open reading frame 19.2 in the complete nucleotide sequence of bacteriophage T7 DNA.
suggested_questions:
- question: Is gene 19.2 translated during bacteriophage T7 infection, and does its DUF5477 domain play an accessory role
    in late DNA maturation or host defense evasion?
  experts:
  - Ian J. Molineux
  - Udi Qimron
suggested_experiments:
- description: Perform ribosome profiling (Ribo-seq) and targeted mass spectrometry on T7-infected Escherichia coli cells,
    coupled with plaque-forming assays of a clean non-polar stop-codon mutant of gene 19.2 across diverse E. coli clinical
    isolates.
  hypothesis: gp19.2 is a non-essential late accessory protein that enhances phage fitness only in hosts encoding specific
    restriction or abortive-infection defense systems.
