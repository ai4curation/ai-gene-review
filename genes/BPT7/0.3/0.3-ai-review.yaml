  qualifier: involved_in
  review:
    summary: Genetic evidence shows that T7 gene 0.3 (along with gene 1) plays a role in excluding superinfecting phage T3, which is secondary to Ocr's primary anti-restriction function.
    action: KEEP_AS_NON_CORE
    reason: McAllister and Barrett (PMID:916034) demonstrated that early genes 0.3 and 1 are required for exclusion of superinfecting phage T3 particles, though this effect is secondary to Ocr's primary biochemical role as a DNA mimic inhibitor of host restriction-modification enzymes.
    supported_by:
    - reference_id: PMID:916034
      supporting_text: Only two of the early genes of bacteriophage T7 were found to play a significant role in exclusion of superinfecting bacteriophage T3 particles; genes 0.3 and 1.
- term:
    id: GO:0099018
    label: symbiont-mediated evasion of host restriction-modification system
  evidence_type: IEA
  original_reference_id: GO_REF:0000043
  qualifier: involved_in
  supporting_entities:
  - UniProtKB-KW:KW-1258
  review:
    summary: Core biological process of Ocr, which binds and inhibits host Type I restriction-modification complexes as a DNA mimic.
    action: ACCEPT
    reason: Ocr (overcome classical restriction) is the archetypal bacteriophage anti-restriction protein; it forms a homodimeric B-form DNA mimic that binds with picomolar affinity to host Type I restriction-modification enzymes (EcoKI and EcoBI), preventing cleavage and methylation of unmodified T7 DNA (PMID:1095770; PMID:11804597).
    supported_by:
    - reference_id: PMID:11804597
      supporting_text: This ocr protein, encoded by gene 0.3 of bacteriophage T7, mimics the size and shape of a bent DNA molecule and the arrangement of negative charges along the phosphate backbone of B-form DNA. We also demonstrate that ocr is an efficient inhibitor in vivo of all known families of the complex type I DNA restriction enzymes.
