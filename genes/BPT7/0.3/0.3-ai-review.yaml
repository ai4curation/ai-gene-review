  title: Structure of Ocr from bacteriophage T7, a protein that mimics B-form DNA.
  findings:
  - statement: The crystal structure of gp0.3 (Ocr) shows an elongated homodimer whose surface carboxylic acid side chains mimic the phosphate backbone of ~24 bp of bent B-form DNA to bind and inhibit Type I restriction-modification enzymes.
    supporting_text: This ocr protein, encoded by gene 0.3 of bacteriophage T7, mimics the size and shape of a bent DNA molecule and the arrangement of negative charges along the phosphate backbone of B-form DNA. We also demonstrate that ocr is an efficient inhibitor in vivo of all known families of the complex type I DNA restriction enzymes.
suggested_questions:
- question: How is Ocr partitioned between its high-affinity targets (Type I restriction-modification enzymes and BREX BrxX) and its lower-affinity interaction with host RNA polymerase during the first minutes of infection?
suggested_experiments:
- description: Perform quantitative competition ChIP-seq and single-molecule tracking of fluorescently labeled Ocr in E. coli strains carrying EcoKI, BREX, or neither defense system to measure in vivo partitioning between restriction complexes and host RNA polymerase.
  hypothesis: High-affinity binding to EcoKI or BrxX sequesters Ocr early in infection until Ocr accumulation exceeds defense complex copy numbers, after which excess Ocr contributes to host RNA polymerase inhibition.
