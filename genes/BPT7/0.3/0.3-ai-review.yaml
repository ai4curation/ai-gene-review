taxon:
  id: NCBITaxon:10760
  label: Escherichia phage T7
description: Homodimeric B-form DNA mimic protein (Ocr, overcome classical restriction) expressed immediately upon infection as the first Class I early gene of bacteriophage T7. Presents a dense array of negatively charged aspartate and glutamate side chains that mimic the phosphate backbone of ~24 base pairs of bent B-form DNA, enabling high-affinity competitive binding to the DNA-binding clefts of host Type I restriction-modification enzymes (such as EcoKI and EcoBI) and BREX defense methyltransferases (BrxX/PglX) to block restriction of the unmethylated viral genome. Also interacts with the host RNA polymerase cleft to dampen host transcription and contributes to exclusion of superinfecting T3 phage particles.
