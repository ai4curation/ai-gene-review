      supporting_text: This ocr protein, encoded by gene 0.3 of bacteriophage T7, mimics the size and shape of a bent DNA molecule and the arrangement of negative charges along the phosphate backbone of B-form DNA. We also demonstrate that ocr is an efficient inhibitor in vivo of all known families of the complex type I DNA restriction enzymes.
core_functions:
- description: Acts as a homodimeric B-form DNA mimic that competitively binds and inhibits host Type I restriction-modification enzymes (such as EcoKI and EcoBI) and BREX defense complexes, protecting the newly injected T7 genome from restriction cleavage.
