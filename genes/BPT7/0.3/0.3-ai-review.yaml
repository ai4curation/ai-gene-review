  review:
    summary: Broad keyword-based annotation that is superseded by the specific restriction-modification evasion term GO:0099018.
    action: MODIFY
    reason: In prokaryotic virus-host interactions, Ocr specifically inhibits bacterial Type I restriction-modification complexes and BREX systems via DNA mimicry (PMID:11804597). Replacing this broad innate immunity term with GO:0099018 provides appropriate biological specificity.
