  review:
    summary: Keyword-derived annotation is correct in essence but broader than the specific restriction-modification evasion term GO:0099018 already present on this gene.
    action: MODIFY
    reason: Ocr specifically neutralizes host Type I restriction-modification and BREX defense systems by acting as a structural B-form DNA mimic (PMID:11804597). The more specific descendant term GO:0099018 (symbiont-mediated evasion of host restriction-modification system) is already asserted and better captures its primary role.
    proposed_replacement_terms:
    - id: GO:0099018
      label: symbiont-mediated evasion of host restriction-modification system
