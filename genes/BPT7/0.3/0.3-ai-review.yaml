  review:
    summary: Ocr directly binds the DNA-binding cleft of Type I restriction-modification enzymes and inhibits both their endonuclease and methyltransferase activities.
    action: NEW
    reason: Existing GOA annotations capture the biological process of restriction-modification evasion (GO:0099018) but lack a molecular function term for Ocr's direct stoichiometric enzyme inhibition of host Type I restriction endonucleases/methyltransferases (PMID:1095770; PMID:11804597).
    supported_by:
