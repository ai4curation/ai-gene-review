suggested_questions:
- question: How does F-plasmid exclusion protein PifA recognize gp1.2 to trigger abortive infection in F+ Escherichia coli hosts?
suggested_experiments:
- description: Determine the structure of the E. coli Dgt hexamer bound to T7 gp1.2 and test gp1.2 point mutants that escape F-plasmid PifA exclusion for their ability to inhibit Dgt in vitro.
  hypothesis: PifA recognizes a surface of gp1.2 distinct from its Dgt-inhibitory loop, allowing mutational separation of dGTPase inhibition from abortive infection triggering.
