taxon:
  id: NCBITaxon:10760
  label: Escherichia phage T7
description: Deoxyguanosine triphosphohydrolase (dGTPase) inhibitor (gp1.2, 85 amino acids) encoded adjacent to the primary replication origin of bacteriophage T7. Binds and inhibits the host Escherichia coli dGTP triphosphohydrolase (Dgt), preventing hydrolysis of dGTP into deoxyguanosine and tripolyphosphate and thereby preserving the intracellular dGTP pool required for viral DNA replication.
