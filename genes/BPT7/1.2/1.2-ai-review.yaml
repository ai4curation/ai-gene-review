- term:
    id: GO:0006260
    label: DNA replication
  evidence_type: IEA
  original_reference_id: GO_REF:0000043
  qualifier: involved_in
  supporting_entities:
  - UniProtKB-KW:KW-0235
  review:
    summary: Gp1.2 is required for T7 DNA replication in hosts with elevated dGTPase activity because it inhibits host dGTP triphosphohydrolase to maintain dGTP pools.
    action: ACCEPT
    reason: By inhibiting host dGTPase (Dgt), gp1.2 prevents depletion of intracellular dGTP and is essential for phage DNA synthesis in E. coli optA1 strains that overproduce dGTPase (PMID:6864790; PMID:24218612).
    supported_by:
    - reference_id: PMID:24218612
      supporting_text: In some cases, such as inhibition of a dGTPase that hydrolyzes dGTP into deoxyguanosine and triphosphate, the main reason is to preserve nucleotides for replication ( 23 ).
core_functions:
- description: Binds and inhibits the host Escherichia coli dGTP triphosphohydrolase (Dgt) to prevent dGTP degradation and maintain deoxyribonucleotide pools for viral DNA replication.
