  review:
    summary: Automated keyword mapping from legacy KW-0645 (Protease) to proteolysis.
    action: REMOVE
    reason: Based on an obsolete 1980s hypothesis that phage Rz/gp18.5 proteins might be endopeptidases; Summer et al. (2007)
      and subsequent studies established that gp18.5 is a non-enzymatic inner membrane spanin (i-spanin) subunit that mediates
      outer membrane disruption via coiled-coil conformational change rather than proteolysis.
    supported_by:
