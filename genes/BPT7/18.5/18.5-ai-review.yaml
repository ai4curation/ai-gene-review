core_functions:
- description: Acts as the inner-membrane spanin (i-spanin, Rz equivalent) subunit that complexes across the periplasm with
    the outer-membrane lipoprotein o-spanin gp18.7 to disrupt the host outer membrane after peptidoglycan degradation during
    viral release by cytolysis.
  directly_involved_in:
