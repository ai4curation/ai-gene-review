  title: Complete nucleotide sequence of bacteriophage T7 DNA and the locations of T7 genetic elements.
  findings:
  - statement: Determined the nucleotide sequence of bacteriophage T7 gene 18.5 encoding the 143-amino-acid lysis protein
      gp18.5.
- id: PMID:17900620
  title: Rz/Rz1 lysis gene equivalents in phages of Gram-negative hosts.
  findings:
  - statement: Established that T7 genes 18.5 and 18.7 encode an embedded Rz/Rz1 two-component spanin pair responsible for
      outer membrane disruption during phage lysis.
    supporting_text: While Rz and Rz1 equivalents have been identified in T7 and P2, most phages, including such well-studied
      classic phages as T4, P1, T1, Mu and SP6, lack annotated Rz/Rz1 equivalents.
suggested_questions:
- question: Does the T7 gp18.5-gp18.7 spanin complex require intermolecular disulfide bond formation in the periplasm for
    outer membrane fusion, analogous to the phage lambda Rz-Rz1 complex?
  experts:
  - Ry Young
  - Ryland F. Young
suggested_experiments:
- description: Reconstitute purified T7 gp18.5 and lipidated gp18.7 into separate liposome populations and assay liposome
    fusion by lipid-mixing FRET upon removal of a peptidoglycan-mimetic steric barrier.
  hypothesis: Release from peptidoglycan meshwork constraints allows the gp18.5 periplasmic coiled-coil to undergo a hairpin-like
    collapse that brings inner and outer membranes into contact for fusion.
