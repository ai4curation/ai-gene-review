id: P03803
gene_symbol: '18.5'
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10760
  label: Escherichia phage T7
description: Inner membrane spanin subunit gp18.5 (phage lambda Rz ortholog) is a single-pass inner-membrane protein with
  a periplasmic coiled-coil domain that pairs with the outer-membrane lipoprotein o-spanin gp18.7 to form a trans-periplasmic
  spanin complex. Following peptidoglycan degradation by the gp3.5 amidase, conformational collapse of the gp18.5-gp18.7 complex
  disrupts the Escherichia coli outer membrane to complete host cell lysis.
