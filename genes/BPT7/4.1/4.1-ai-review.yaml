id: P03782
gene_symbol: '4.1'
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10760
  label: Escherichia phage T7
description: Protein 4.1 (gp4.1) of Escherichia phage T7 is an uncharacterized 40-amino-acid putative Class II peptide encoded
  in an alternative overlapping reading frame within the 5' region of the DNA primase-helicase gene 4 (between the initiation
  codons of the gp4A and gp4B isoforms). It lacks conserved domain signatures and its in vivo translation and biological function
  during T7 infection remain unknown.
existing_annotations: []
core_functions: []
references:
- id: PMID:6864790
  title: Complete nucleotide sequence of bacteriophage T7 DNA and the locations of T7 genetic elements.
  findings: []
suggested_questions:
- question: Is open reading frame 4.1 translated during T7 infection, or does ribosome binding to the gene 4.1 Shine-Dalgarno
    sequence serve primarily to regulate translation initiation at the adjacent gp4A and gp4B start codons?
suggested_experiments:
- description: Introduce synonymous mutations disrupting the gene 4.1 start codon without altering the gp4A amino acid sequence,
    and measure the in vivo ratio of gp4A (63-kDa) to gp4B (56-kDa) synthesis by quantitative immunoblotting and ribosome
    profiling.
  hypothesis: Translation initiation at gene 4.1 modulates ribosome occupancy between the gp4A and gp4B initiation sites to
    control the stoichiometry of the two primase-helicase isoforms.
