id: P03779
gene_symbol: '1.1'
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10760
  label: Escherichia phage T7
description: Small uncharacterized basic protein (gp1.1, 42 amino acids) encoded immediately downstream of the phi1.1A and
  phi1.1B promoters within the primary replication origin region of the bacteriophage T7 genome. Synthesized during both Class
  I (early) and Class II (middle) gene expression; despite its high content of positively charged lysine and arginine residues,
  its molecular target and physiological function during infection have not been experimentally established.
existing_annotations: []
core_functions: []
