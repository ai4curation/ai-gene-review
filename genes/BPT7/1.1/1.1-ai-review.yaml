- id: PMID:6864790
  title: Complete nucleotide sequence of bacteriophage T7 DNA and the locations of T7 genetic elements.
  findings: []
suggested_questions:
- question: Does the basic 42-amino-acid gp1.1 polypeptide bind DNA or RNA at the adjacent primary replication origin (phi1.1A/phi1.1B)
    or interact with host nucleoid proteins?
suggested_experiments:
- description: Test purified recombinant gp1.1 for binding to single-stranded and double-stranded DNA/RNA substrates spanning
    the T7 primary replication origin using electrophoretic mobility shift assays (EMSAs).
  hypothesis: The arginine- and lysine-rich gp1.1 peptide binds nucleic acids or modulates R-loop stability at the adjacent
    primary replication origin.
