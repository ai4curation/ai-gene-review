suggested_questions:
- question: What is the structural mechanism by which the C-terminal domain of gp0.7 (residues 244-359) inhibits Escherichia
    coli RNA polymerase independently of its N-terminal kinase activity?
suggested_experiments:
- description: Determine the cryo-EM structure of E. coli RNA polymerase holoenzyme bound to the isolated C-terminal shutoff
    domain of gp0.7 (residues 244-359) and compare its binding site with those of T7 gp2 and gp0.3 (Ocr).
  hypothesis: The C-terminal domain of gp0.7 binds a distinct surface on E. coli RNA polymerase that synergizes with Thr1068
    phosphorylation of RpoC and with gp2 to ensure complete shutoff of host transcription.
