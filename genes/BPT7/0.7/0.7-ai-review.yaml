- description: Catalyzes ATP-dependent phosphorylation of serine and threonine residues on host RNA polymerase (RpoC), RNase
    E, RhlB, and translation factors, and acts via its C-terminal domain to suppress host gene expression and stabilize viral
    transcripts.
