taxon:
  id: NCBITaxon:10760
  label: Escherichia phage T7
description: Class I early ATP-dependent serine/threonine protein kinase (gp0.7, EC 2.7.11.1) and host transcriptional shutoff
  factor that remodels the host gene expression machinery during early T7 infection. Phosphorylates over 90 Escherichia coli
  proteins on serine and threonine residues—including the RNA polymerase beta' subunit (RpoC at Thr1068), endoribonuclease
  RNase E, RNA helicase RhlB, ribosomal protein S1, and translation factors IF1, IF2, IF3, and EF-G—to suppress host transcription,
  stabilize viral mRNAs against RNase E degradation, and optimize translation under suboptimal growth conditions, before down-regulating
  its own kinase activity via intramolecular autophosphorylation at Ser216.
