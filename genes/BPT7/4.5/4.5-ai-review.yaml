suggested_questions:
- question: Which structural domain of Escherichia coli Lon protease (N-terminal substrate-binding, AAA+ ATPase, or C-terminal
    peptidase domain) is bound by gp4.5, and does gp4.5 inhibit all Lon substrates or selectively block antitoxin recognition?
suggested_experiments:
- description: Determine the cryo-EM or X-ray structure of the gp4.5-Lon complex and measure in vitro ATPase and peptidase
    kinetics of purified E. coli Lon against folded protein substrates versus short fluorogenic peptides in the presence of
    gp4.5.
  hypothesis: gp4.5 binds the substrate-recognition or AAA+ translocation pore of Lon, competitively blocking unfolding and
    degradation of intrinsically disordered antitoxins.
status: COMPLETE
