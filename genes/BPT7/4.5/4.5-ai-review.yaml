references:
- id: PMID:23478446
  title: Discovery of functional toxin/antitoxin systems in bacteria by shotgun cloning.
  findings:
  - statement: Demonstrated that T7 gp4.5 binds and inhibits host Lon protease, preventing degradation of the SanaTA antitoxin
      and overcoming toxin-antitoxin-mediated phage resistance.
    supporting_text: Infection experiments with T7 phage showed that two of the new modules can provide resistance against
      phage. Moreover, our experiments revealed an "antidefense" protein in phage T7 that neutralizes phage resistance.
