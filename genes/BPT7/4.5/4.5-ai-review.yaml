id: P03785
gene_symbol: '4.5'
taxon:
  id: NCBITaxon:10760
  label: Escherichia phage T7
description: Inhibitor of toxin/antitoxin system protein gp4.5 of Escherichia phage T7 that binds and inhibits the host ATP-dependent
  endopeptidase Lon, thereby preventing Lon-mediated degradation of labile host antitoxins during infection and suppressing
  toxin-antitoxin-mediated abortive infection defense.
existing_annotations:
- term:
    id: GO:0004866
    label: endopeptidase inhibitor activity
  evidence_type: IDA
  original_reference_id: PMID:23478446
  review:
    summary: Protein gp4.5 physically interacts with and inhibits the host ATP-dependent endopeptidase Lon, blocking Lon-dependent
      degradation of labile antitoxins.
    action: NEW
    reason: Sberro et al. (2013) demonstrated that T7 gp4.5 co-immunoprecipitates with and inhibits Escherichia coli Lon protease
      to prevent degradation of unstable antitoxins; endopeptidase inhibitor activity directly captures its molecular function.
    supported_by:
    - reference_id: PMID:23478446
      supporting_text: Infection experiments with T7 phage showed that two of the new modules can provide resistance against
        phage. Moreover, our experiments revealed an "antidefense" protein in phage T7 that neutralizes phage resistance.
    - reference_id: file:genes/BPT7/4.5/4.5-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: Gp4.5 interacts with the host protease lon to neutralize the degradation of the antitoxin that would
        result in the activation of the toxin and the destruction of the bacteria.
- term:
    id: GO:0052031
    label: symbiont-mediated perturbation of host defense response
  evidence_type: IMP
  original_reference_id: PMID:23478446
  review:
    summary: By inhibiting host Lon protease, gp4.5 prevents activation of Lon-regulated toxin-antitoxin abortive infection
      defense systems.
    action: NEW
    reason: T7 mutants lacking gene 4.5 are restricted by the SanaTA toxin-antitoxin defense system, whereas wild-type gp4.5
      suppresses this host antiphage defense response.
    supported_by:
    - reference_id: PMID:23478446
      supporting_text: Infection experiments with T7 phage showed that two of the new modules can provide resistance against
        phage. Moreover, our experiments revealed an "antidefense" protein in phage T7 that neutralizes phage resistance.
    - reference_id: file:genes/BPT7/4.5/4.5-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: Plays a role in the inhibition of the host toxin-antitoxin (TA) system.
