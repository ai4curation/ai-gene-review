  title: UniProtKB record for P03785 (ITAS_BPT7)
  findings:
  - statement: Summarizes the role of gp4.5 in binding Escherichia coli Lon protease (P0A9M0) and inhibiting host toxin-antitoxin
      abortive infection defense.
    record_section: ["CC:FUNCTION"]
    supporting_text: Gp4.5 interacts with the host protease lon to neutralize the degradation of the antitoxin that would
