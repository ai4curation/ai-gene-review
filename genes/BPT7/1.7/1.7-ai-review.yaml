  label: Escherichia phage T7
description: Metal-independent Class II deoxynucleoside monophosphate kinase (gp1.7) expressed in two equally active isoforms (22.2 kDa full-length and 17.8 kDa initiated at Met40) that catalyzes the phosphorylation of dGMP and dTMP (as well as dideoxythymidylate, ddTMP) to dGDP and dTDP using GTP, dGTP, or dTTP as the phosphoryl donor. Lacks canonical nucleotide-binding motifs and divalent cation requirements, and couples with host nucleoside diphosphate kinase to accelerate dTTP and dGTP regeneration for rapid viral DNA replication.
