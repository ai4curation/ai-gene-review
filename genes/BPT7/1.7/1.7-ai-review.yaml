references:
- id: GO_REF:0000043
  title: Gene Ontology annotation based on UniProtKB/Swiss-Prot keyword mapping
  findings: []
- id: PMID:20497505
  title: A novel nucleotide kinase encoded by gene 1.7 of bacteriophage T7.
  findings:
  - statement: Purified gp1.7 is a metal-independent nucleotide kinase lacking canonical nucleotide-binding motifs that phosphorylates dGMP, dTMP, and ddTMP to dGDP, dTDP, and ddTDP using GTP, dGTP, or dTTP as the phosphate donor.
    supporting_text: We show that gp1.7 catalyses the phosphorylation of dGMP and dTMP to dGDP and dTDP, respectively, by using either GTP, dGTP or dTTP as the phosphate donor.
- id: PMID:18599435
  title: Gene 1.7 of bacteriophage T7 confers sensitivity of phage growth to dideoxythymidine.
  findings:
  - statement: Demonstrates that bacteriophage T7 gene 1.7 is responsible for the sensitivity of T7 DNA replication to exogenous dideoxythymidine (ddT).
    supporting_text: We isolated 95 T7 phage mutants that were resistant to ddT. All contained a mutation in T7 gene 1.7, a nonessential gene of unknown function.
suggested_questions:
- question: What is the three-dimensional fold and catalytic mechanism of the C-terminal kinase domain of gp1.7 that enables phosphoryl transfer without divalent metal ions or a canonical P-loop motif?
suggested_experiments:
- description: Determine the X-ray crystal structure of the C-terminal catalytic domain of gp1.7 in complex with dTMP and a non-hydrolyzable GTP analog.
  hypothesis: Positively charged side chains in the C-terminal domain of gp1.7 substitute for Mg2+ to stabilize the pentacovalent gamma-phosphate transition state during phosphoryl transfer.
