id: P03786
gene_symbol: '4.7'
taxon:
  id: NCBITaxon:10760
  label: Escherichia phage T7
description: Uncharacterized 135-amino-acid class II protein gp4.7 of Escherichia phage T7 belonging to the conserved podoviral
  Phage_T7_4_7 family (Pfam:PF26857) and located between gene 4.5 and the DNA polymerase gene 5. Its molecular function and
  biological role during phage infection remain unknown.
existing_annotations: []
core_functions: []
references:
- id: PMID:6864790
  title: Complete nucleotide sequence of bacteriophage T7 DNA and the locations of T7 genetic elements.
  findings:
  - statement: Identified the open reading frame for gene 4.7 in the class II region of the bacteriophage T7 genome immediately
      upstream of gene 5.
- id: file:genes/BPT7/4.7/4.7-uniprot.txt
