references:
- id: GO_REF:0000043
  title: Gene Ontology annotation based on UniProtKB/Swiss-Prot keyword mapping
  findings: []
- id: GO_REF:0000120
  title: Combined Automated Annotation using Multiple IEA Methods
  findings: []
- id: PMID:17437718
  title: 'Quasi-atomic model of bacteriophage t7 procapsid shell: insights into the structure and evolution of a basic fold.'
  findings:
  - statement: Demonstrated that T7 major capsid protein gp10A adopts the HK97-like fold and forms hexameric and pentameric
      capsomers of the T=7 shell.
    supporting_text: The procapsid structure at approximately 10 A resolution was used to obtain a quasi-atomic model by fitting
      a homology model of the T7 capsid protein gp10 that was based on the atomic structure of the HK97 capsid protein.
- id: PMID:1938901
  title: Frameshifting in gene 10 of bacteriophage T7.
  findings:
  - statement: Demonstrated that -1 ribosomal frameshifting near the 3' end of gene 10A mRNA produces the minor capsid protein
      10B.
    supporting_text: 'Gene 10 of bacteriophage T7, which encodes the most abundant capsid protein, has two products: a major
      product, 10A (36 kDa), and a minor product, 10B (41 kDa). 10B is produced by frameshifting into the -1 frame near the
      end of the 10A coding frame and is incorporated into the capsid.'
- id: PMID:20962334
  title: Molecular rearrangements involved in the capsid shell maturation of bacteriophage T7.
  findings:
  - statement: Resolved the spatial organization and maturational rearrangement of the 415 copies of gp10 in the T=7 levo
      icosahedral procapsid and mature virion.
    supporting_text: The mature capsid presents an expanded and thinner shell, with a drastic rearrangement of the major protein
      monomers that increases in their interacting surfaces, in turn resulting in a new bonding lattice.
- id: PMID:25313071
  title: Capsid expansion mechanism of bacteriophage T7 revealed by multistate atomic models derived from cryo-EM reconstructions.
  findings:
  - statement: Determined the 4.6 A cryo-EM structure of the T7 procapsid, resolving how the N-terminal inner helix of gp10A
      hexamers binds two gp9 scaffolding proteins.
    supporting_text: In the procapsid, the N terminus of the major capsid protein, gp10, has a six-turn helix at the inner
      surface of the shell, where each skewed hexamer of gp10 interacts with two scaffolding proteins.
- id: PMID:8528255
  title: A protein linkage map of Escherichia coli bacteriophage T7.
  findings:
  - statement: Identified homomeric interactions of gp10A by genome-wide yeast two-hybrid screening.
    supporting_text: To analyse these networks, we used the yeast two-hybrid system on a genome-wide scale to identify 25
      interactions among the proteins of Escherichia coli bacteriophage T7.
- id: file:genes/BPT7/10A/10A-uniprot.txt
  title: UniProtKB record for P19726 (CAPSA_BPT7)
  findings:
  - statement: Summarizes the role of major capsid protein 10A in assembling with 10B to form the T=7 icosahedral capsid.
    record_section: ["CC:FUNCTION"]
    supporting_text: Assembles with the minor capsid protein to form an icosahedral capsid with a T=7 symmetry, about 60 nm
      in diameter, and consisting of 415 capsid proteins.
suggested_questions:
- question: How do intracapsomeric and intercapsomeric salt bridges in gp10A substitute for covalent cross-linking (as in
    HK97) to stabilize the thin-walled mature T7 capsid against internal DNA pressure?
suggested_experiments:
- description: Mutate conserved charged residues at the E-loop and P-domain trimeric interfaces of gp10A and measure thermal
    and osmotic shock stability of DNA-packaged virions by atomic force microscopy nanoindentation.
  hypothesis: Non-covalent electrostatic latches between the E-loop of one gp10A subunit and the P-domain of an adjacent subunit
    lock the expanded T=7 lattice after DNA packaging.
