- term:
    id: GO:0075523
    label: viral translational frameshifting
  evidence_type: IEA
  original_reference_id: GO_REF:0000043
  qualifier: involved_in
  supporting_entities:
  - UniProtKB-KW:KW-0688
  review:
    summary: A -1 ribosomal frameshift near the 3' end of gene 10 mRNA produces the minor capsid isoform gp10B (~10% of translation
      events).
    action: KEEP_AS_NON_CORE
    reason: Viral translational frameshifting describes the cis-acting mRNA mechanism that generates the minor 10B isoform
      rather than the structural function of the canonical gp10A protein.
    supported_by:
    - reference_id: PMID:1938901
      supporting_text: 'Gene 10 of bacteriophage T7, which encodes the most abundant capsid protein, has two products: a major
        product, 10A (36 kDa), and a minor product, 10B (41 kDa). 10B is produced by frameshifting into the -1 frame near
        the end of the 10A coding frame and is incorporated into the capsid.'
