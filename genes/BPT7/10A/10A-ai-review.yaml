taxon:
  id: NCBITaxon:10760
  label: Escherichia phage T7
description: Major capsid protein gp10A of Escherichia phage T7 that adopts an HK97-like fold and self-assembles with the
  minor frameshift isoform gp10B into 60 hexamers and 11 pentamers (415 subunits total) around the gp9 scaffold and gp8 portal
  vertex to form the T=7 levo icosahedral viral capsid.
alternative_products:
- id: P19726-1
  name: 10A
  sequence_note: Canonical major capsid protein produced by standard translation of gene 10.
- id: P19727-1
  name: 10B
  sequence_note: Minor capsid protein produced by -1 ribosomal frameshifting near the 3' end of gene 10A.
