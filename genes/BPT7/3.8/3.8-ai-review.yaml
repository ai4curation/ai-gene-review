taxon:
  id: NCBITaxon:10760
  label: Escherichia phage T7
description: Protein 3.8 (gp3.8) of Escherichia phage T7 is a 121-amino-acid Class II protein encoded between the endolysin
  gene 3.5 and the DNA primase-helicase gene 4. Sequence analysis identifies a central His-Me finger (HNH) endonuclease domain
  (residues 34-94; Pfam PF13392 / InterPro IPR003615), suggesting that gp3.8 is a phage homing-like endonuclease, although
  its in vivo expression, DNA substrate specificity, and biological role during T7 infection have not been experimentally
  characterized.
existing_annotations: []
core_functions: []
references:
- id: PMID:6864790
  title: Complete nucleotide sequence of bacteriophage T7 DNA and the locations of T7 genetic elements.
  findings: []
suggested_questions:
- question: Does T7 gp3.8 possess site-specific HNH homing endonuclease activity that promotes lateral transfer of the gene
    3.8 locus between coinfecting T7-family phages?
suggested_experiments:
- description: Purify recombinant T7 gp3.8 and assay metal-dependent endonuclease activity on T7 versus T3 genomic DNA templates
    covering the gene 3.5-gene 4 intergenic region.
  hypothesis: Protein 3.8 functions as a site-specific HNH homing endonuclease that cleaves intronless/endonuclease-free alleles
    in related podophages to drive homing during mixed infection.
