  title: Complete nucleotide sequence of bacteriophage T7 DNA and the locations of T7 genetic elements.
  findings: []
suggested_questions:
- question: Does gp1.4 insert into the Escherichia coli inner membrane during T7 infection and interact with host membrane
    proteins or phage lysis/exclusion factors?
suggested_experiments:
- description: Express PhoA/GFP topology fusions of gp1.4 in E. coli and perform membrane fractionation and co-immunoprecipitation
    during T7 infection.
  hypothesis: Gp1.4 inserts into the host cytoplasmic membrane as a single-pass transmembrane protein via residues 12-32.
