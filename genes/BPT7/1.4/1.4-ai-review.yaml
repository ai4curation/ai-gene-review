id: P03791
gene_symbol: '1.4'
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10760
  label: Escherichia phage T7
description: Small uncharacterized Class II protein (gp1.4, 51 amino acids) encoded immediately downstream of DNA ligase (gene
  1.3) and the early transcription terminator TEl in bacteriophage T7. Contains a central hydrophobic transmembrane helix
  (residues 12-32) predicted to anchor the polypeptide in the host Escherichia coli cytoplasmic membrane; its molecular function
  during infection remains unknown.
existing_annotations:
- term:
    id: GO:0033644
    label: host cell membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  supporting_entities:
  - UniProtKB-SubCell:SL-0380
  review:
    summary: Sequence analysis identifies a hydrophobic transmembrane segment spanning residues 12-32 consistent with localization
      to the host cell membrane.
    action: ACCEPT
    reason: Gp1.4 contains a strongly hydrophobic 21-residue transmembrane alpha-helix (residues 12-32) predicted to insert
      into the host bacterial inner membrane (PMID:6864790).
core_functions:
- description: Putative single-pass transmembrane peptide predicted to localize to the host bacterial cell membrane during
    Class II gene expression.
  locations:
  - id: GO:0033644
    label: host cell membrane
