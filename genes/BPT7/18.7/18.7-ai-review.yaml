taxon:
  id: NCBITaxon:10760
  label: Escherichia phage T7
description: Outer membrane spanin subunit gp18.7 (phage lambda Rz1 equivalent) is an outer-membrane lipoprotein encoded in
  the +1 reading frame embedded within gene 18.5. Following signal peptide cleavage and lipidation at Cys-22, mature gp18.7
  is anchored in the inner leaflet of the Escherichia coli outer membrane and pairs across the periplasm with the inner-membrane
  spanin gp18.5 to disrupt the outer membrane during host cell lysis.
