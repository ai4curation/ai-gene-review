  - statement: Established that T7 gene 18.7 encodes the outer-membrane lipoprotein Rz1 equivalent (o-spanin) that pairs with
      gp18.5 (Rz) to disrupt the host outer membrane during phage lysis.
    supporting_text: While Rz and Rz1 equivalents have been identified in T7 and P2, most phages, including such well-studied
      classic phages as T4, P1, T1, Mu and SP6, lack annotated Rz/Rz1 equivalents.
suggested_questions:
- question: Which residues of the proline-rich periplasmic domain of mature gp18.7 form the binding interface with the C-terminal
    coiled-coil of gp18.5?
  experts:
  - Ry Young
  - Ryland F. Young
suggested_experiments:
- description: Determine the X-ray crystal or NMR structure of the soluble periplasmic ectodomain complex formed between T7
    gp18.5 (residues 33-143) and mature gp18.7 (residues 23-83).
  hypothesis: Proline-rich segments of gp18.7 pack against the C-terminal alpha-helical bundle of gp18.5 to lock the pre-fusion
    extended spanin conformation until peptidoglycan degradation occurs.
