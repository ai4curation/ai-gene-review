- id: PMID:5263754
  title: The structural gene for a T7 endonuclease essential for phage DNA synthesis.
  findings:
  - statement: T7 gene 3 is the structural gene for Endonuclease I, which hydrolyzes double- and single-stranded DNA and is
      required for host chromosome degradation and normal phage DNA synthesis.
    supporting_text: Gene 3 mutants synthesize only a limited amount of DNA. In addition, they are defective in carrying out
      the degradation of host DNA, suggesting that the gene 3 endonuclease is involved in this function.
- id: PMID:5541763
  title: Bacteriophage T7 endonuclease. I. Properties of the enzyme purified from T7 phage-infected Escherichia coli B.
  findings:
  - statement: Characterizes the purification and enzymatic properties of bacteriophage T7 Endonuclease I from infected Escherichia
      coli cells.
- id: PMID:9236119
  title: 'The junction-resolving enzyme T7 endonuclease I: quaternary structure and interaction with DNA.'
  findings:
  - statement: T7 Endonuclease I forms a stable homodimer in solution and binds four-way DNA junctions with nanomolar affinity
      to resolve branched recombination intermediates.
    supporting_text: Endonuclease I is a DNA junction-selective resolving enzyme from bacteriophage T7. Using a nuclease-defective
      mutant that retains normal binding to DNA we show that the protein binds to four-way DNA junctions as a dimer, in common
      with other junction-resolving enzymes studied.
suggested_questions:
- question: How is T7 Endonuclease I activity regulated in vivo so that it degrades the host Escherichia coli chromosome while
    sparing newly replicated linear T7 concatemers outside of Holliday junctions?
suggested_experiments:
- description: Perform time-resolved high-throughput cleavage sequencing (Endo-seq) in T7-infected Escherichia coli to map
    in vivo gp3 cleavage sites across both the host chromosome and replicating T7 concatemers.
  hypothesis: Endonuclease I preferentially targets replication forks and recombinational branch points in both host and viral
    DNA, while unbranched T7 dsDNA is protected by rapid packaging and gp2.5 coating.
