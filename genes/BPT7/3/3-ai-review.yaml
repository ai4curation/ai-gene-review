  label: Escherichia phage T7
description: Endonuclease I (gp3) of Escherichia phage T7 is a 149-amino-acid homodimeric PD-(D/E)XK-superfamily endonuclease
  and structure-selective Holliday junction resolvase. It binds four-way DNA junctions and branched DNA structures with nanomolar
  affinity and introduces paired endonucleolytic nicks to resolve recombination and replication intermediates prior to DNA
  packaging. In addition, gp3 cleaves both single-stranded and double-stranded host DNA during infection, acting in concert
  with the gp6 exonuclease to degrade the Escherichia coli chromosome into deoxynucleoside monophosphates that supply precursors
  for phage DNA synthesis.
