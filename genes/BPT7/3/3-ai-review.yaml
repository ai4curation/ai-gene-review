  review:
    summary: Automated EC 3.1.21.2 mapping assigns the phage T4-induced deoxyribonuclease IV label, whereas T7 gp3 is Endonuclease
      I with Holliday junction resolvase and double-stranded DNA endonuclease activities.
    action: MODIFY
    reason: EC 3.1.21.2 historically grouped several phage endonucleases under the T4 deoxyribonuclease IV (DenA) name, but
      T7 gp3 is a distinct PD-(D/E)XK Holliday junction resolvase and double-stranded/single-stranded DNA endonuclease. Replacing
      this term with GO:0008821 and GO:1990238 accurately reflects its biochemical activities.
