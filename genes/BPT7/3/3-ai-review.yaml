    id: GO:0015074
    label: DNA integration
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR008029
  review:
    summary: Spurious InterPro2GO propagation; bacteriophage T7 is strictly lytic and does not integrate into the host chromosome.
    action: REMOVE
    reason: Bacteriophage T7 is an obligately lytic phage that never integrates its genome into the host chromosome. Instead,
      gp3 resolves Holliday junctions formed during phage DNA replication/recombination and degrades the host chromosome (PMID:5263754;
      PMID:9236119).
