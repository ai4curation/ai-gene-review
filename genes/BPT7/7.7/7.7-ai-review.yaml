suggested_questions:
- question: Does gp7.7 function as a site-specific free-standing homing endonuclease that cleaves gene 7.7-minus alleles in
    related T7-family phages (such as phage T3) during mixed co-infection?
suggested_experiments:
- description: Purify recombinant gp7.7 and test for site-specific nicking or double-strand cleavage across T7 and T3 genomic
    DNA spanning the gene 7.3-8 intergenic region, combined with mixed T7/T3 co-infection marker exclusion assays.
  hypothesis: Like T7 gp3.8 and gp5.3/HNH homologs, gp7.7 is a selfish free-standing homing endonuclease that cleaves homologous
    phage genomes lacking the 7.7 insertion to drive gene conversion.
