id: P03798
gene_symbol: '5.3'
taxon:
  id: NCBITaxon:10760
  label: Escherichia phage T7
description: Class II protein gp5.3 of Escherichia phage T7 containing a conserved PD-(D/E)XK nuclease and tRNA-intron endonuclease-like
  catalytic domain (Pfam:PF11645, InterPro:IPR021671, InterPro:IPR011856) implicated in nucleic acid binding and potential
  nuclease activity during infection.
existing_annotations:
- term:
    id: GO:0003676
    label: nucleic acid binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  review:
    summary: InterPro2GO maps gp5.3 to nucleic acid binding based on its conserved tRNA-intron endonuclease-like / PD-(D/E)XK
      nuclease domain (IPR011856 / IPR021671).
    action: ACCEPT
    reason: Protein gp5.3 contains a well-defined PD-(D/E)XK endonuclease-like / tRNA-intron endonuclease-like fold (Pfam
      PF11645, InterPro IPR021671 and IPR011856) spanning residues 5-116, and because its specific DNA or RNA substrate has
      not been experimentally determined, nucleic acid binding is the most precise supported term.
    supported_by:
    - reference_id: file:genes/BPT7/5.3/5.3-uniprot.txt
      supporting_text: InterPro; IPR021671; PD(D/E)XK_Endonuc.
  supporting_entities:
  - InterPro:IPR011856
core_functions:
- description: Binds nucleic acids via its conserved PD-(D/E)XK / tRNA-intron endonuclease-like domain.
  molecular_function:
    id: GO:0003676
    label: nucleic acid binding
  supported_by:
  - reference_id: file:genes/BPT7/5.3/5.3-uniprot.txt
    supporting_text: InterPro; IPR021671; PD(D/E)XK_Endonuc.
references:
- id: GO_REF:0000002
  title: Gene Ontology annotation through association of InterPro records with GO terms.
  findings: []
- id: PMID:6864790
  title: Complete nucleotide sequence of bacteriophage T7 DNA and the locations of T7 genetic elements.
  findings:
  - statement: Identified the open reading frame for gene 5.3 in the class II region of the bacteriophage T7 genome downstream
      of gene 5.
- id: file:genes/BPT7/5.3/5.3-uniprot.txt
  title: UniProtKB record for P03798 (Y53_BPT7)
  findings:
  - statement: Annotates a PD-(D/E)XK endonuclease-like domain (Pfam PF11645, InterPro IPR021671) and tRNA-intron endonuclease
      catalytic domain-like region (InterPro IPR011856) spanning residues 5-116.
    supporting_text: InterPro; IPR021671; PD(D/E)XK_Endonuc.
suggested_questions:
- question: Does purified gp5.3 exhibit endonuclease activity on specific host tRNAs, mRNAs, or branched DNA intermediates
    in vitro?
suggested_experiments:
- description: Purify recombinant gp5.3 and assay divalent-metal-dependent nuclease activity across single-stranded DNA, double-stranded
    DNA, Holliday junctions, and Escherichia coli tRNA substrates, alongside site-directed mutagenesis of the predicted PD-(D/E)XK
    active-site residues.
  hypothesis: gp5.3 functions as a metal-dependent endonuclease that cleaves a specific host or viral nucleic acid substrate
    during the class II stage of T7 infection.
status: COMPLETE
