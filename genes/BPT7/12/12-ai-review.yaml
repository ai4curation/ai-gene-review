- id: file:genes/BPT7/12/12-uniprot.txt
  title: UniProtKB record for P03747 (TUBE2_BPT7)
  findings:
  - statement: Summarizes the assembly of gp12 into a hexameric ring forming the lower phage tail tube/nozzle together with
      gp11.
    supporting_text: Structural component of the short non-contractile tail. The tail complex is involved in viral genome
      delivery. Forms the end of the tail, including the canonical tube, the nozzle, and the small extensions below the fibers.
suggested_questions:
- question: Which internal beta-hairpin loops of the gp12 hexamer form the iris-like gate that retains gp7.3 and the viral
    DNA terminus prior to host lipopolysaccharide recognition?
suggested_experiments:
- description: Perform site-directed mutagenesis of the constricting internal beta-hairpin loops of gp12 and analyze spontaneous
    DNA release and cryo-EM nozzle aperture diameter in vitro.
  hypothesis: The central beta-hairpin loops of gp12 interact with gp7.3 in the closed state and swing radially outward against
    the inner nozzle wall during core ejection.
