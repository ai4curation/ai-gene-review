taxon:
  id: NCBITaxon:10760
  label: Escherichia phage T7
description: Tail tubular nozzle protein gp12 of Escherichia phage T7 that assembles as a homohexamer onto the distal surface
  of the dodecameric gp11 adaptor ring to form the conical lower tail tube and distal valve of the virion, sealing the axial
  DNA channel prior to infection, anchoring the six gp17 tail fiber trimers with gp11, and opening upon host adsorption to
  mediate short-tail genome ejection.
