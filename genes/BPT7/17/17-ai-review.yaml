taxon:
  id: NCBITaxon:10760
  label: Escherichia phage T7
description: Tail fiber protein gp17 assembles into six homotrimers attached to the head-proximal end of the bacteriophage
  T7 tail complex. Its C-terminal tip domain mediates the initial specific, reversible adsorption of the virion to Escherichia
  coli cell-surface lipopolysaccharide (LPS), orienting the tail nozzle for subsequent irreversible receptor engagement and
  genome ejection.
