suggested_questions:
- question: How is the mechanical signal of all six gp17 tail fibers simultaneously engaging host LPS transmitted through
    the gp11-gp12 tail complex to trigger gp13 nozzle opening and internal core ejection?
  experts:
  - Mark J. van Raaij
  - Ian J. Molineux
  - Jun Liu
suggested_experiments:
- description: Determine the cryo-EM structure of the gp17 C-terminal tip domain bound to purified Escherichia coli K-12 core
    oligosaccharide-lipid A in nanodiscs.
  hypothesis: Exterior loops at the apex of the gp17 beta-propeller/pyramid tip coordinate the inner-core heptose-phosphate
    moieties of rough LPS, stabilizing the extended fiber conformation.
