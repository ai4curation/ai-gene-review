      for the first specific, albeit reversible, attachment to Escherichia coli lipopolysaccharide.
- id: PMID:23306440
  title: The bacteriophage t7 virion undergoes extensive structural remodeling during infection.
  findings:
  - statement: Cryo-electron tomography demonstrated that the six gp17 tail fibers transition from a capsid-bound folded conformation
      to an extended surface-walking conformation upon LPS binding.
    supporting_text: Near the head-proximal end of the 23-nm tail are six fibers, trimers of gp17. Each fiber has an N-terminal
      domain that attaches the fiber to the tail, followed by proximal and distal half-fibers. The latter interact with the
      cell surface
