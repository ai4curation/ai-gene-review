    summary: Mature T7 virions incorporate internal head protein gp6.7 inside the T=7 icosahedral capsid.
    action: ACCEPT
    reason: Kemp et al. (2005) demonstrated that gp6.7 is an internal head protein packaged within mature T7 capsids and required
      for production of fully infectious virions.
    supported_by:
    - reference_id: PMID:16054667
      supporting_text: Two small proteins, the products of genes 6.7 and 7.3, also are ejected from the infecting virion.
