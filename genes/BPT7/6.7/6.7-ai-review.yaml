  label: Escherichia phage T7
description: Internal head morphogenesis protein gp6.7 of Escherichia phage T7 that is incorporated into the T=7 icosahedral
  viral capsid during head assembly, is required for morphogenesis of infectious virions, and is ejected from the virion into
  the host cell at the initiation of infection.
