    supporting_text: Plays a role in virion morphogenesis, and is ejected from the infecting particle into the bacterial cell.
suggested_questions:
- question: How is gp6.7 positioned within the portal-core complex inside the mature T7 head, and what role does it perform
    immediately before or during ejection through the portal channel?
suggested_experiments:
- description: Compare high-resolution asymmetric cryo-EM reconstructions of wild-type and gp6.7-deficient T7 virions before
    and after lipopolysaccharide-triggered DNA ejection.
  hypothesis: gp6.7 stabilizes the interface between the gp8 portal crown and the gp14/gp15/gp16 internal core stack until
    ejection is triggered.
