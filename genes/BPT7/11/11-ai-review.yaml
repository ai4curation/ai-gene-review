core_functions:
- description: Assembles into a homododecameric tail adaptor (gatekeeper) ring on the gp8 portal vertex to nucleate viral
    tail assembly, anchor the gp12 nozzle and gp17 tail fibers, and form the axial conduit for short-tail genome ejection.
