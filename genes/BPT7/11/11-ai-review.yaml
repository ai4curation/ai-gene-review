  label: Escherichia phage T7
description: Tail tubular adaptor (gatekeeper) protein gp11 of Escherichia phage T7 that docks onto the distal clip domain
  of the dodecameric gp8 portal ring after viral DNA packaging to assemble a 12-subunit toroidal ring, extending the axial
  DNA-ejection channel, recruiting the hexameric gp12 tail nozzle, and forming with gp12 the docking site for the six gp17
  tail fiber trimers.
