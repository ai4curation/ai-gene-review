- id: file:genes/BPT7/11/11-uniprot.txt
  title: UniProtKB record for P03746 (TUBE1_BPT7)
  findings:
  - statement: Summarizes the role of dodecameric gp11 as the gatekeeper-adaptor ring connecting the gp8 portal to the hexameric
      gp12 nozzle and gp17 tail fibers.
    supporting_text: Structural component of the short non-contractile tail. The tail complex is involved in viral genome
      delivery. Forms the 12-fold symmetric toroidal domain immediately below the connector protein gp8.
suggested_questions:
- question: How does interaction of gp17 tail fibers with host lipopolysaccharide transmit a conformational signal through
    the gp11-gp12 interface to trigger opening of the tail nozzle and ejection of internal core proteins?
suggested_experiments:
- description: Compare high-resolution cryo-EM structures of the gp8-gp11-gp12-gp17 tail complex before and after binding
    purified rough Escherichia coli lipopolysaccharide.
  hypothesis: Upward rotation of the proximal gp17 fiber knee at the gp11-gp12 junction perturbs the gp11-gp12 ring interface,
    unlocking the gp12 nozzle valve.
