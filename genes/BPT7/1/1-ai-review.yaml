  review:
    summary: Automated keyword mapping to a multi-subunit complex term is incorrect for T7 RNA polymerase, which functions
      as a single-subunit monomer.
    action: REMOVE
    reason: Unlike multisubunit bacterial or eukaryotic RNA polymerases, bacteriophage T7 RNA polymerase (gp1) is a self-contained
      single-polypeptide enzyme (883 residues) that performs promoter recognition, initiation, and elongation as a monomer
      without forming a multisubunit RNA polymerase complex (PMID:6708104; PMID:8133519).
