  label: Escherichia phage T7
description: Monomeric single-subunit DNA-directed 5'-3' RNA polymerase (gp1, EC 2.7.7.6) expressed as a Class I early protein
  that drives transcription of all Class II (replication) and Class III (structural and assembly) genes of bacteriophage T7.
  Recognizes conserved 17-23 bp phage promoters with high specificity via its N-terminal promoter-binding domain and catalyzes
  de novo RNA initiation and rapid elongation using a Pol I-like palm, fingers, and thumb catalytic core (active-site residues
  Asp537, Lys631, Tyr639, His811, and Asp812), while also synthesizing replication primers at the viral origin and partnering
  with T7 lysozyme (gp3.5) to regulate the transition from middle to late transcription and viral DNA packaging.
