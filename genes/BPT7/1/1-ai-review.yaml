  title: Bacteriophage T7 RNA polymerase and its active-site mutants. Kinetic, spectroscopic and calorimetric characterization.
  findings:
  - statement: Kinetic and biophysical characterization of wild-type T7 RNA polymerase and mutants at Asp537, Lys631, Tyr639,
      His811, and Asp812 defines their roles in NTP binding, divalent metal coordination, and phosphodiester bond formation.
    supporting_text: It has been demonstrated that the amino acids Asp537, Asp812, Lys631, His811 and Tyr639 are involved
      in bacteriophage T7 RNA polymerase catalysis.
- id: PMID:6708104
  title: Nucleotide sequence of the gene for bacteriophage T7 RNA polymerase.
  findings:
  - statement: Clones and expresses the active monomeric bacteriophage T7 gene 1 RNA polymerase in Escherichia coli and resolves
      sequence differences in gene 1.
    supporting_text: Differences between two previously published nucleotide sequences for bacteriophage T7 gene 1 have been
      resolved.
- id: PMID:15223315
  title: Multiple roles of T7 RNA polymerase and T7 lysozyme during bacteriophage T7 infection.
  findings:
  - statement: Reviews the multiple roles of T7 RNA polymerase in middle and late transcription, replication priming, concatemer
      processing/packaging, and regulation by T7 lysozyme (gp3.5).
    supporting_text: T7 RNA polymerase selectively transcribes T7 genes during infection but is also involved in DNA replication,
      maturation and packaging.
