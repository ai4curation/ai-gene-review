    supporting_text: Highly processive DNA-dependent RNA polymerase that catalyzes the transcription of class II and class
      III viral genes.
  - statement: Recognizes specific promoter sequences on the phage DNA template.
    supporting_text: Recognizes a specific promoter sequence and enters first into an 'abortive phase'
suggested_questions:
- question: How does T7 RNA polymerase coordinate its transition from transcription elongation to interaction with the terminase/packaging
    machinery at the concatemer junction?
suggested_experiments:
- description: Perform single-molecule fluorescence resonance energy transfer (smFRET) and cryo-EM on T7 RNA polymerase-lysozyme
    complexes paused near the right genetic end in the presence of terminase subunits gp18 and gp19.
  hypothesis: Lysozyme-stabilized pausing of T7 RNA polymerase near the concatemer junction recruits the gp18-gp19 terminase
    complex to couple late transcription termination with genome packaging.
