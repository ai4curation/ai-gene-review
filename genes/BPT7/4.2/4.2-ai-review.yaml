suggested_questions:
- question: Does gp4.2 localize to the host inner membrane via its N-terminal hydrophobic segment during
    class II gene expression, and what host or viral proteins does it interact with?
suggested_experiments:
- description: Perform affinity purification coupled to mass spectrometry (AP-MS) and membrane fractionation
    of epitope-tagged gp4.2 in T7-infected Escherichia coli to determine its subcellular localization
    and interaction partners.
  hypothesis: The conserved N-terminal hydrophobic region anchors gp4.2 to the host inner membrane while
    the C-terminal disordered tail interacts with host or phage replication/envelope factors.
