  label: Escherichia phage T7
description: Uncharacterized 112-amino-acid class II protein gp4.2 of Escherichia phage T7 belonging to
  the DUF5480 family (Pfam:PF17576) and containing a predicted N-terminal hydrophobic region and a C-terminal
  intrinsically disordered polar segment (residues 64-93). Its molecular function and biological role
  during the phage infection cycle remain unknown.
