  label: Escherichia phage T7
description: Endolysin (gp3.5, historically termed T7 lysozyme) of Escherichia phage T7 is a bifunctional 151-amino-acid zinc-dependent N-acetylmuramoyl-L-alanine amidase and transcriptional regulator. Through its zinc-coordinated catalytic cleft, gp3.5 hydrolyzes the amide bond between N-acetylmuramic acid and L-alanine in the host peptidoglycan cell wall, mediating abrupt cytolysis and phage progeny release once granted access to the periplasm late in infection. Independently of its zinc-dependent amidase activity, gp3.5 accumulates in the host cytoplasm and binds stoichiometrically to T7 RNA polymerase (gp1) at an allosteric site, inhibiting the transition from transcription initiation to elongation and shifting viral transcription from Class II replication genes to Class III morphogenetic genes.
