    summary: T7 lysozyme binds T7 RNA polymerase and allosterically inhibits the transition from transcription initiation to elongation.
    action: ACCEPT
    reason: Biochemical assays show that T7 lysozyme forms a 1:1 complex with T7 RNA polymerase and inhibits the synthesis of runoff transcripts by blocking the transition from abortive initiation to processive elongation (PMID:9192997).
    supported_by:
