- id: PMID:15223315
  title: Multiple roles of T7 RNA polymerase and T7 lysozyme during bacteriophage T7 infection.
  findings:
  - statement: The amidase activity of T7 lysozyme (gp3.5) is required for abrupt host cell lysis and release of progeny phage particles, whereas its binding to T7 RNA polymerase regulates transcription and DNA replication/maturation.
    supporting_text: The amidase activity of lysozyme is needed for abrupt lysis and release of phage particles but appears to have no role in replication and packaging.
- id: PMID:8171031
  title: The structure of bacteriophage T7 lysozyme, a zinc amidase and an inhibitor of T7 RNA polymerase.
  findings:
  - statement: Determines the 2.2-Angstrom crystal structure of T7 lysozyme (gp3.5), showing a catalytic zinc ion bound in the active-site cleft that is required for N-acetylmuramoyl-L-alanine amidase activity but dispensable for T7 RNA polymerase inhibition.
    supporting_text: The lysozyme of bacteriophage T7 is a bifunctional protein that cuts amide bonds in the bacterial cell wall and binds to and inhibits transcription by T7 RNA polymerase.
- id: PMID:9192997
  title: Mechanism of inhibition of bacteriophage T7 RNA polymerase by T7 lysozyme.
  findings:
  - statement: T7 lysozyme binds T7 RNA polymerase to form a reversible 1:1 complex that inhibits the transition from transcription initiation to elongation without competing for promoter DNA or nucleotide substrates.
    supporting_text: Bacteriophage T7 lysozyme is known to inhibit transcription by T7 RNA polymerase. Lysozyme present before initiation inhibited the synthesis of long RNA chains but did not inhibit elongation when added shortly after chains were initiated.
suggested_questions:
- question: How is T7 lysozyme (gp3.5) released from its cytoplasmic complex with T7 RNA polymerase to gain access to the periplasmic peptidoglycan layer upon holin (gp17.5) activation?
suggested_experiments:
- description: Measure in vivo FRET between fluorescently tagged gp3.5 and gp1 across the T7 infection cycle in wild-type versus gp17.5-deficient Escherichia coli hosts.
  hypothesis: Cytoplasmic gp3.5 is produced in molar excess over gp1 late in infection, so the unbound pool of gp3.5 translocates across holin-induced inner-membrane lesions without requiring dissociation of the gp1-gp3.5 complex.
