  title: Complete nucleotide sequence of bacteriophage T7 DNA and the locations of T7 genetic elements.
  findings:
  - statement: Determined the complete nucleotide sequence of T7 gene 19 encoding the 586-amino-acid DNA maturation protein
      gp19.
- id: PMID:3298244
  title: Processing of concatemers of bacteriophage T7 DNA in vitro.
  findings:
  - statement: Demonstrated that gp19, together with gp18 and procapsids, is essential for in vitro endonucleolytic processing
      and packaging of concatemeric T7 DNA.
    supporting_text: The products of genes 8 (prohead protein), 9 (scaffolding protein), and 19 (DNA maturation) along with
      gene 18 protein are essential, indicating that capsids are required for processing.
- id: PMID:23632014
  title: Large terminase conformational change induced by connector binding in bacteriophage T7.
  findings:
  - statement: Determined the 3D EM structure of the pentameric T7 gp19 large terminase motor and characterized the conformational
      change induced upon binding to the dodecameric gp8 portal connector.
    supporting_text: The terminase is a powerful motor that converts ATP hydrolysis into mechanical movement of the DNA. Here,
      we have determined the structure of the T7 large terminase by electron microscopy. The five terminase subunits assemble
      in a toroid that encloses a channel wide enough to accommodate dsDNA.
suggested_questions:
- question: How is the C-terminal endonuclease activity of pentameric gp19 suppressed during processive ATP-driven DNA translocation
    and specifically activated when headful pressure and the 160-bp terminal repeat are reached?
  experts:
  - José L. Carrascosa
  - Charles C. Richardson
suggested_experiments:
- description: Determine high-resolution cryo-EM structures of the T7 prohead portal-gp19 pentamer complex stalled during
    active dsDNA translocation with ADP-BeFx versus at the terminal cleavage state.
  hypothesis: Portal-induced asymmetric tilting of the five gp19 subunits coordinates sequential ATP hydrolysis during translocation
    and aligns two opposing C-terminal nuclease domains across the dsDNA duplex only upon stalling at the terminal repeat.
