  label: Escherichia phage T7
description: Large terminase subunit gp19 (DNA maturation protein) is a bifunctional ATP-driven DNA packaging motor and concatemer-resolving
  endonuclease. Five gp19 subunits assemble into a toroidal pentamer that docks onto the dodecameric gp8 portal vertex of
  the bacteriophage T7 prohead, coupling ATP hydrolysis to double-stranded DNA translocation into the capsid and cleaving
  concatemeric viral DNA into unit-length genomes.
