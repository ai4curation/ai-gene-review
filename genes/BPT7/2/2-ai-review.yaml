suggested_questions:
- question: How do gp2 and the C-terminal shutoff domain of gp0.7 cooperate on the Escherichia coli RNA polymerase holoenzyme to inhibit both -10/-35 and extended -10 promoters?
suggested_experiments:
- description: Perform in vitro transcription assays on -10/-35 and extended -10 promoters in the presence of purified gp2 alone, gp0.7 alone, or both proteins together, using phosphorylated and unphosphorylated E. coli RNA polymerase.
  hypothesis: Gp0.7-mediated phosphorylation of RpoC Thr1068 and C-terminal binding inhibit residual transcription at extended -10 promoters that are refractory to gp2 alone.
