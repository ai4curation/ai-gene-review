  label: Escherichia phage T7
description: Essential Class II protein (gp2, 64 amino acids) that binds the jaw domain of the host Escherichia coli RNA polymerase beta' subunit (RpoC) and inhibits transcription initiation by the sigma70 holoenzyme at -10/-35 promoters. By shutting off host RNA polymerase transcription from the early promoters on newly replicated T7 DNA concatemers, gp2 prevents host transcription complexes from colliding with the viral DNA packaging machinery and is strictly required for productive phage assembly.
