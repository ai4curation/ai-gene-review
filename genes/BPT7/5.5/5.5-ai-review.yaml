  label: Escherichia phage T7
description: Suppressor of silencing protein gp5.5 of Escherichia phage T7 that binds the central dimer-dimer oligomerization
  domain of the host nucleoid-associated protein H-NS, disrupting higher-order H-NS-DNA nucleoprotein complexes and relieving
  H-NS-mediated xenogeneic silencing of phage transcription.
alternative_products:
