  qualifier: involved_in
  review:
    summary: Protein gp5.5 binds the central oligomerization domain of host H-NS to block higher-order H-NS-DNA filament assembly
      and counteract H-NS-mediated xenogeneic silencing of phage DNA.
    action: NEW
    reason: Ali et al. (2011) demonstrated that gp5.5 binds H-NS and abolishes H-NS-mediated transcriptional silencing and
      restriction of T7 phage in vivo and in vitro.
    supported_by:
    - reference_id: PMID:21764926
      supporting_text: Association studies reveal that 5.5(T7) binds a region of H-NS (residues 60 to 80) recently found to
        contain a distinct domain necessary for higher-order H-NS oligomerization. Accordingly, we find that purified 5.5(T7)
        can disrupt higher-order H-NS-DNA complexes in vitro
