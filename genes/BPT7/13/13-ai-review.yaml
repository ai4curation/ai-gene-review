id: P03723
gene_symbol: '13'
taxon:
  id: NCBITaxon:10760
  label: Escherichia phage T7
description: Virion morphogenesis protein gp13 is a late class III structural assembly factor of bacteriophage T7 that is
  present in mature virions and is required for virion morphogenesis and infectivity, including stable incorporation of the
  internal core proteins (gp14, gp15, and gp16) and efficient tail attachment. Upon virion adsorption to the Escherichia coli
  host cell at the onset of infection, gp13 is lost from the particle as the internal core proteins are ejected.
