suggested_questions:
- question: Does gp13 transiently cap the portal/connector channel inside the head to retain the internal core cylinder prior
    to tail attachment, and is it proteolytically cleaved or expelled intact through the tail channel upon host receptor engagement?
  experts:
  - Ian J. Molineux
  - Gino Cingolani
suggested_experiments:
- description: Perform high-resolution asymmetric cryo-EM reconstruction of gp13-containing mature T7 virions versus 13-amber
    procapsids/heads to localize gp13 relative to the gp8 portal and gp14-gp15-gp16 internal core cylinder.
  hypothesis: gp13 localizes at the portal-core or head-tail interface where it stabilizes the internal core complex during
    assembly and is displaced when the tail channel opens for ejection.
