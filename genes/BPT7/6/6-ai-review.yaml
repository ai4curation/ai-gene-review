- id: PMID:1325707
  title: Role of exonuclease in the specificity of bacteriophage T7 DNA packaging.
  findings:
  - statement: Demonstrated that T7 gene 6 exonuclease stimulates concatemerization-coupled packaging
      of T7 DNA in vitro and suppresses packaging of heterologous phage P22 DNA.
    supporting_text: Addition of p6 in vitro both stimulates the concatemerization-packaging of T7 DNA
      and suppresses the packaging of P22 DNA.
- id: PMID:2170664
  title: Role of gene 6 exonuclease in the replication and packaging of bacteriophage T7 DNA.
  findings:
  - statement: Showed that the RNase H activity of gp6 removes RNA primers from newly replicated T7 DNA
      and is required to prevent premature degradation of replicated phage DNA.
    supporting_text: the RNA primers, produced by multiple initiations of DNA replication, are removed
      by the RNase H activity of gene 6 exonuclease during a wild-type T7 infection.
- id: PMID:364424
  title: T7 gene 6 exonuclease has an RNase H activity.
  findings:
  - statement: Demonstrated that T7 gene 6 exonuclease possesses intrinsic RNase H activity capable of
      excising RNA primers from RNA-DNA hybrids.
    supporting_text: T7 gene 6 exonuclease has been shown to have an RNase H activity as well as a double-strand
      specific DNase activity
- id: file:genes/BPT7/6/6-uniprot.txt
  title: UniProtKB record for P00638 (EXRN_BPT7)
  findings:
  - statement: Summarizes the dual 5'-3' dsDNA exonuclease and RNase H activities of gp6 in host chromosome
      degradation, RNA primer removal, and concatemer formation.
    supporting_text: Plays an essential role in phage DNA replication by participating in the removal
      of DNA-linked RNA primers. Participates also in T7 DNA packaging, host DNA degradation and phage
      genetic recombination.
suggested_questions:
- question: How is the 5'-3' exonuclease activity of gp6 regulated at the 160-bp terminal direct repeats
    so that resection stops once single-stranded 3' overhangs sufficient for concatemer annealing are
    exposed?
suggested_experiments:
- description: Determine the X-ray or cryo-EM structure of gp6 bound to a 5'-resected dsDNA-ssDNA junction
    and measure resection kinetics in the presence of T7 single-stranded DNA-binding protein gp2.5.
  hypothesis: Coating of the emerging 3' single-stranded overhang by gp2.5 sterically limits further 5'-3'
    resection by gp6 beyond the terminal repeat region.
