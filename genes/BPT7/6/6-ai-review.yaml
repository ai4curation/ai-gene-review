taxon:
  id: NCBITaxon:10760
  label: Escherichia phage T7
description: Bifunctional 5'-3' double-stranded DNA exonuclease and RNA-DNA hybrid ribonuclease (RNase
  H) gp6 of Escherichia phage T7 that degrades the host bacterial chromosome to supply nucleotide precursors,
  excises RNA primers from Okazaki fragments during lagging-strand viral DNA replication, and resects
  5' ends at the 160-bp terminal repeats to promote concatemer formation and selective viral DNA packaging.
