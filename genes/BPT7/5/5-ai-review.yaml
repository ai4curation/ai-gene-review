suggested_questions:
- question: How does the T7 replisome coordinate the handoff of the 3' primer terminus between the polymerase
    and 3'-5' exonuclease active sites of gp5 without dissociating from the gp4 helicase hexamer?
suggested_experiments:
- description: Perform single-molecule FRET and time-resolved cryo-EM of the full gp4-gp5/TrxA-gp2.5 replisome
    encountering a template lesion or dNTP mismatch during coupled leading-strand synthesis.
  hypothesis: The flexible thioredoxin-binding domain maintains contact with gp4 while the thumb and fingers
    subdomains rotate to transfer the mismatched 3' primer terminus into the N-terminal exonuclease cleft.
