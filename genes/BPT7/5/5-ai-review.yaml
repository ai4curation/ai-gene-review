  findings: []
- id: PMID:1846298
  title: Pre-steady-state kinetic analysis of processive DNA replication including complete characterization
    of an exonuclease-deficient mutant.
  findings:
  - statement: Determined pre-steady-state kinetic parameters of wild-type T7 DNA polymerase and a mutant
      lacking 3'-5' proofreading exonuclease activity.
    supporting_text: The elementary steps of DNA polymerization catalyzed by T7 DNA polymerase have been
      resolved by transient-state analysis of single nucleotide incorporation
- id: PMID:20696935
  title: Conformational dynamics of bacteriophage T7 DNA polymerase and its processivity factor, Escherichia
    coli thioredoxin.
  findings:
  - statement: Showed that binding of Escherichia coli thioredoxin to gp5 induces conformational changes
      that increase the DNA-binding interface and confer processivity.
    supporting_text: Thioredoxin (trx) of Escherichia coli binds tightly (Kd = 5 nM) to a unique segment
      in the thumb subdomain of gp5 and increases processivity.
- id: PMID:21606333
  title: Helicase-DNA polymerase interaction is critical to initiate leading-strand DNA synthesis.
  findings:
  - statement: Demonstrated that electrostatic interaction between the C-terminal tail of gp4 helicase
      and gp5/thioredoxin is required to initiate leading-strand DNA synthesis.
    supporting_text: Interactions between gene 4 helicase and gene 5 DNA polymerase (gp5) are crucial
      for leading-strand DNA synthesis mediated by the replisome of bacteriophage T7.
- id: PMID:23012374
  title: Thioredoxin, the processivity factor, sequesters an exposed cysteine in the thumb domain of bacteriophage
    T7 DNA polymerase.
  findings:
  - statement: Characterized the interaction between the thumb domain of gp5 and host Escherichia coli
      thioredoxin required for processive nucleotide polymerization.
    supporting_text: Gene 5 protein (gp5) of bacteriophage T7 is a non-processive DNA polymerase. It achieves
      processivity by binding to Escherichia coli thioredoxin (trx).
- id: PMID:24591606
  title: Single-molecule studies of polymerase dynamics and stoichiometry at the bacteriophage T7 replication
    machinery.
  findings:
  - statement: Demonstrated dynamic exchange and stoichiometry of gp5 DNA polymerases at the active T7
      replication fork.
    supporting_text: In this study, we visualize fluorescently labeled bacteriophage T7 DNA polymerases
      within the replisome while we simultaneously observe the kinetics of the replication process.
- id: PMID:2703498
  title: Selective inactivation of the exonuclease activity of bacteriophage T7 DNA polymerase by in vitro
    mutagenesis.
  findings:
  - statement: Mapped the 3'-5' exonuclease active site to the N-terminal domain of gp5 by selective in
      vitro mutagenesis.
    supporting_text: The 3' to 5' exonuclease activity of bacteriophage T7 DNA polymerase (gene 5 protein)
      can be inactivated selectively by reactive oxygen species.
- id: PMID:30265524
  title: Hydrophobic Residue in Escherichia coli Thioredoxin Critical for the Processivity of T7 DNA Polymerase.
  findings:
  - statement: Identified hydrophobic interactions between host thioredoxin and the gp5 thioredoxin-binding
      domain essential for processive T7 genome replication.
    supporting_text: Bacteriophage T7 uses the thioredoxin of its host, Escherichia coli, to enhance the
      processivity of its DNA polymerase, a requirement for the growth of phage T7.
- id: PMID:30679383
  title: Structures and operating principles of the replisome.
  findings:
  - statement: Determined cryo-EM structures of the T7 replisome showing leading- and lagging-strand gp5-thioredoxin
      polymerases coordinated by the hexameric gp4 helicase-primase.
    supporting_text: Using bacteriophage T7 as a model system, we determined cryo-electron microscopy
      structures up to 3.2-angstroms resolution of helicase translocating along DNA and of helicase-polymerase-primase
      complexes engaging in synthesis of both DNA strands.
- id: PMID:8528255
  title: A protein linkage map of Escherichia coli bacteriophage T7.
  findings:
  - statement: Identified protein-protein interactions of T7 gp5 including binding to gp4 helicase-primase
      by yeast two-hybrid screening.
    supporting_text: To analyse these networks, we used the yeast two-hybrid system on a genome-wide scale
      to identify 25 interactions among the proteins of Escherichia coli bacteriophage T7.
- id: file:genes/BPT7/5/5-uniprot.txt
  title: UniProtKB record for P00581 (DPOL_BPT7)
  findings:
  - statement: Annotates the 3'-5' exonuclease catalytic metal-binding sites (Asp5, Glu7, Asp174) and
      DNA polymerase catalytic Mg2+-binding sites (Asp475, Asp654).
    record_section: ["FT:BINDING"]
