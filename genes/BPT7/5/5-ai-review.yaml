taxon:
  id: NCBITaxon:10760
  label: Escherichia phage T7
description: Replicative family A DNA-directed DNA polymerase and 3'-5' proofreading exonuclease gp5 of
  Escherichia phage T7 that associates in a 1:1 complex with host Escherichia coli thioredoxin (TrxA)
  as a processivity factor and coordinates with the viral gp4 helicase-primase and gp2.5 single-stranded
  DNA-binding protein at the replication fork to catalyze high-fidelity leading- and lagging-strand viral
  DNA genome synthesis.
