id: P03692
gene_symbol: '4'
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10760
  label: Escherichia phage T7
description: DNA primase-helicase (gp4) of Escherichia phage T7 is a bifunctional hexameric enzyme that unwinds duplex DNA at the replication fork and synthesizes oligoribonucleotide primers on the lagging-strand template. Expressed from two in-frame initiation codons as a full-length 63-kDa isoform (gp4A, 566 amino acids) and an N-terminally truncated 56-kDa isoform (gp4B, 503 amino acids lacking the N-terminal Cys4 zinc-binding domain), gp4 assembles into a six-subunit ring/spiral lock-washer around the 5'-to-3' tracking single-stranded DNA strand. Its C-terminal RecA-like helicase domain couples dTTP/ATP hydrolysis to processive 5'-to-3' DNA unwinding via a hand-over-hand translocation mechanism, while its N-terminal zinc-finger and Toprim RNA polymerase domains recognize 5'-GTC-3' template sequences to synthesize tetraribonucleotide primers that are handed off directly to T7 DNA polymerase (gp5) for coordinated leading- and lagging-strand viral DNA replication.
