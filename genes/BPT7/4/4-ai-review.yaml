- id: PMID:11279245
  title: A complex of the bacteriophage T7 primase-helicase and DNA polymerase directs primer utilization.
  findings:
  - statement: T7 gp4 assembles into a ring-shaped hexamer with both 5'-3' DNA unwinding and oligoribonucleotide primer synthesis activities and forms a complex with T7 DNA polymerase to direct primer utilization.
    supporting_text: Gene 4 of bacteriophage T7 encodes a bifunctional primase-helicase that assembles into a ring-shaped hexamer with both DNA unwinding and primer synthesis activities.
- id: PMID:2829184
  title: A 7-kDa region of the bacteriophage T7 gene 4 protein is required for primase but not for helicase activity.
  findings:
  - statement: The 56-kDa gp4B isoform binds single-stranded DNA, hydrolyzes dTTP, and catalyzes 5'-3' DNA helicase activity, whereas the N-terminal 63-residue zinc-finger region unique to 63-kDa gp4A is required for primase activity.
    supporting_text: Like a mixture of the two proteins, the 56-kDa protein binds single-stranded DNA in the presence of dTTP, catalyzes DNA-dependent hydrolysis of dTTP, and has helicase activity.
- id: PMID:30679383
  title: Structures and operating principles of the replisome.
  findings:
  - statement: Determines cryo-EM structures of the T7 replisome comprising gp4, gp5, gp2.5, and Escherichia coli thioredoxin engaging in synthesis of both DNA strands.
    supporting_text: Using bacteriophage T7 as a model system, we determined cryo-electron microscopy structures up to 3.2-angstroms resolution of helicase translocating along DNA and of helicase-polymerase-primase complexes engaging in synthesis of both DNA strands.
- id: PMID:32009150
  title: Dynamic structural insights into the molecular mechanism of DNA unwinding by the bacteriophage T7 helicase.
  findings:
  - statement: Cryo-EM structures show that the six subunits of gp4 form a spiral lock-washer around the tracking single-stranded DNA strand (2 nt per subunit) and translocate via a hand-over-hand mechanism.
    supporting_text: The six subunits of gp4 adopt a spiral lock-washer form that encircles a coil-like DNA (tracking) strand with 2 nucleotides (nt) bound to each subunit.
- id: PMID:8528255
  title: A protein linkage map of Escherichia coli bacteriophage T7.
  findings:
  - statement: Genome-wide yeast two-hybrid screening identifies self-association of gp4 and physical interaction between gp4 and T7 DNA polymerase gp5.
    supporting_text: To analyse these networks, we used the yeast two-hybrid system on a genome-wide scale to identify 25 interactions among the proteins of Escherichia coli bacteriophage T7. Among these is a set of six interactions connecting proteins that function in DNA replication and DNA packaging.
- id: PMID:9185573
  title: Characterization and crystallization of the helicase domain of bacteriophage T7 gene 4 protein.
  findings:
  - statement: An isolated C-terminal fragment of T7 gp4 retains oligomerization, dTTP hydrolysis, and 5'-3' DNA helicase activities.
    supporting_text: One of these fragments, which is derived from the C-terminal region of the protein, was prepared and shown to retain helicase activity.
suggested_questions:
- question: What is the physiological advantage of co-expressing the primase-deficient 56-kDa gp4B isoform alongside the full-length 63-kDa gp4A isoform to form heterohexamers in vivo?
suggested_experiments:
- description: Compare replication fork progression and Okazaki fragment length distribution in T7 phage mutants engineered to express exclusively gp4A versus wild-type mixed gp4A/gp4B heterohexamers using single-molecule rolling-circle replication assays.
  hypothesis: Mixed gp4A/gp4B heterohexamers reduce steric crowding of N-terminal zinc-binding domains and modulate priming frequency to optimize processive replication fork speed.
