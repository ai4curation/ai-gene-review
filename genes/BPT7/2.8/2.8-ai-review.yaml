  review:
    summary: Domain architecture (InterPro:IPR044930 / IPR003615 HNH endonuclease domain) supports putative endonuclease activity.
    action: ACCEPT
    reason: Gp2.8 contains a canonical HNH/His-Me finger endonuclease domain (InterPro:IPR044930; Pfam:PF13392) conserved
      across freestanding T7-like phage homing endonucleases.
core_functions:
- description: Putative HNH-family DNA endonuclease predicted to cleave double-stranded or single-stranded DNA targets during
    phage infection or inter-phage genetic exchange.
