id: P03795
gene_symbol: '2.8'
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10760
  label: Escherichia phage T7
description: Putative Class II HNH (His-Me finger) family endonuclease (gp2.8, 139 amino acids) encoded between the single-stranded
  DNA-binding protein gene 2.5 and endonuclease I gene 3 in the bacteriophage T7 genome. Contains a conserved HNH nuclease
  domain characteristic of freestanding bacteriophage homing endonucleases, although its target DNA sequence specificity and
  in vivo role during infection remain uncharacterized.
