suggested_questions:
- question: Does gp2.8 act as a site-specific homing endonuclease during mixed infections with related T7-family phages (such
    as T3) that lack gene 2.8?
suggested_experiments:
- description: Purify recombinant gp2.8 and assay site-specific nicking or double-strand cleavage on bacteriophage T7 and
    T3 genomic DNA substrates across the gene 2.5-3 intergenic region.
  hypothesis: Gp2.8 cleaves the homologous insertion site in T3 or gp2.8-minus phage genomes to drive lateral gene transfer
    (homing) of the gene 2.8 locus.
