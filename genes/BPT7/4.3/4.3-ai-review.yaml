suggested_questions:
- question: Under what host strain backgrounds or environmental stress conditions does deletion of gene
    4.3 impair T7 replication or burst size?
suggested_experiments:
- description: Screen a clean T7 delta-4.3 mutant across a diverse panel of clinical and environmental
    Escherichia coli isolates encoding anti-phage defense systems and perform pull-down mass spectrometry
    of tagged gp4.3.
  hypothesis: Like neighboring class II accessory genes (such as 4.5 and 5.5), gp4.3 counteracts a specific
    host restriction or defense factor present in wild E. coli strains.
