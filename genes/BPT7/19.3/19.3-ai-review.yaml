id: P03790
gene_symbol: '19.3'
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10760
  label: Escherichia phage T7
description: Uncharacterized 57-amino-acid protein gp19.3 encoded near the right end of the bacteriophage T7 genome and containing
  the conserved domain of unknown function DUF5466 (PF17554/IPR035327). Its biological role during the T7 infection cycle
  remains unknown.
existing_annotations: []
core_functions: []
references:
- id: PMID:6864790
  title: Complete nucleotide sequence of bacteriophage T7 DNA and the locations of T7 genetic elements.
  findings:
  - statement: Identified the potential open reading frame 19.3 in the complete nucleotide sequence of bacteriophage T7 DNA.
suggested_questions:
- question: Is the 57-residue gp19.3 polypeptide expressed at late times of T7 infection, and what is the molecular target
    of its conserved DUF5466 domain?
  experts:
  - Ian J. Molineux
  - Udi Qimron
suggested_experiments:
- description: Epitope-tag the endogenous locus of gene 19.3 in phage T7 to assay protein expression and pull down interacting
    phage or Escherichia coli proteins by affinity purification-mass spectrometry (AP-MS).
  hypothesis: gp19.3 interacts with late phage packaging factors or host envelope/defense proteins during the final stages
    of the lytic cycle.
