id: P03776
gene_symbol: '0.4'
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10760
  label: Escherichia phage T7
description: Small Class I early protein (gp0.4) that directly binds the host bacterial tubulin homolog FtsZ and inhibits FtsZ filament assembly into the cytokinetic Z-ring. By arresting host cell division early in the lytic cycle before viral DNA replication has produced multiple genome copies, gp0.4 prevents daughter-cell escape and retains the entire host cell's metabolic resources to maximize bacteriophage progeny yield.
existing_annotations:
- term:
    id: GO:0044865
    label: symbiont-mediated suppression of host cell division
  evidence_type: IDA
  original_reference_id: PMID:24218612
  qualifier: involved_in
  review:
    summary: Direct biochemical and genetic evidence demonstrates that gp0.4 binds host FtsZ, blocks Z-ring assembly, and causes bacterial filamentation to inhibit host cell division.
    action: ACCEPT
    reason: Kiro et al. (PMID:24218612) showed by tandem affinity purification, reciprocal pull-downs, in vitro FtsZ polymerization assays, and selection of resistant ftsZ9 mutants that gp0.4 directly binds E. coli FtsZ and inhibits host cell division to increase phage competitiveness in dividing cells.
    supported_by:
    - reference_id: PMID:24218612
      supporting_text: Here, we show that Gp0.4 is a direct inhibitor of the E. coli filamenting temperature-sensitive mutant Z division protein. A chemically synthesized Gp0.4 binds to purified filamenting temperature-sensitive mutant Z protein and directly inhibits its assembly in vitro.
core_functions:
- description: Directly binds the host cytokinetic protein FtsZ and inhibits its polymerization into the Z-ring, arresting host cell division to prevent uninfected daughter cells from escaping and to maximize host resource utilization.
  directly_involved_in:
  - id: GO:0044865
    label: symbiont-mediated suppression of host cell division
  supported_by:
