    supporting_text: Here, we show that Gp0.4 is a direct inhibitor of the E. coli filamenting temperature-sensitive mutant Z division protein. A chemically synthesized Gp0.4 binds to purified filamenting temperature-sensitive mutant Z protein and directly inhibits its assembly in vitro.
references:
- id: PMID:24218612
  title: Gene product 0.4 increases bacteriophage T7 competitiveness by inhibiting
    host cell division.
  findings:
  - statement: Gp0.4 directly binds purified E. coli FtsZ and inhibits its filament assembly in vitro, causing cell elongation and division arrest in vivo that confers a competitive growth advantage to T7 in dividing bacterial populations.
    supporting_text: Here, we show that Gp0.4 is a direct inhibitor of the E. coli filamenting temperature-sensitive mutant Z division protein. A chemically synthesized Gp0.4 binds to purified filamenting temperature-sensitive mutant Z protein and directly inhibits its assembly in vitro.
suggested_questions:
- question: Does gp0.4 bind the inter-monomer longitudinal interface of FtsZ protofilaments or allosterically lock FtsZ in a low-affinity conformation near the N-terminal Gly18-Val19 loop mutated in ftsZ9?
suggested_experiments:
- description: Determine the cryo-EM or X-ray co-crystal structure of E. coli FtsZ bound to synthetic gp0.4 peptide and compare binding kinetics to wild-type FtsZ versus FtsZ9 by isothermal titration calorimetry.
  hypothesis: Gp0.4 binds near the N-terminal core helix H1 (adjacent to Gly18-Val19) to sterically or allosterically block longitudinal protofilament association.
