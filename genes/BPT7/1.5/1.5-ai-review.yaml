id: P03792
gene_symbol: '1.5'
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10760
  label: Escherichia phage T7
description: Very small uncharacterized Class II polypeptide (gp1.5, 29 amino acids) encoded between genes 1.4 and 1.6 in
  the middle region of the bacteriophage T7 genome. Non-essential for plaque formation under standard laboratory conditions;
  its molecular target and biological role during T7 infection have not been experimentally determined.
existing_annotations: []
core_functions: []
references:
- id: PMID:6864790
  title: Complete nucleotide sequence of bacteriophage T7 DNA and the locations of T7 genetic elements.
  findings: []
suggested_questions:
- question: Is the 29-amino-acid gp1.5 peptide stably accumulated during T7 infection, and does it interact with host membrane
    or cytoplasmic complexes?
suggested_experiments:
- description: Use ribosome profiling (Ribo-seq) and targeted peptidomics mass spectrometry on T7-infected Escherichia coli
    to quantify gp1.5 synthesis and screen for host binding partners.
  hypothesis: Gp1.5 is translated from Class II transcripts initiated at the phi1.5 promoter and modulates a non-essential
    host pathway.
