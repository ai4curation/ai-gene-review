  label: Escherichia phage T7
description: Monomeric ATP-dependent DNA ligase (gp1.3, EC 6.5.1.1) consisting of an N-terminal adenylyltransferase catalytic
  domain (active-site Lys34) and a C-terminal OB-fold double-stranded DNA-binding domain. Catalyzes the Mg2+- and ATP-dependent
  sealing of single-stranded nicks in double-stranded DNA via a covalent ligase-AMP intermediate, functioning in Okazaki fragment
  maturation during viral DNA replication as well as in phage DNA repair and recombination.
