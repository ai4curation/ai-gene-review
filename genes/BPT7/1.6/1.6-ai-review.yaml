taxon:
  id: NCBITaxon:10760
  label: Escherichia phage T7
description: Uncharacterized Class II protein (gp1.6, 86 amino acids) encoded between genes 1.5 and 1.7 in the middle region
  of the bacteriophage T7 genome. Synthesized from Class II transcripts during the replication phase of infection; it is non-essential
  for phage propagation in standard laboratory Escherichia coli strains and its biochemical function has not been experimentally
  determined.
