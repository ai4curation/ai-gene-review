- id: file:genes/BPT7/5.9/5.9-uniprot.txt
  title: UniProtKB record for P20406 (GP59_BPT7)
  findings:
  - statement: Summarizes gp5.9 inhibition of the host RecBCD complex and lists cryo-EM structures of gp5.9 bound to RecBCD
      (PDB 8B1R, 9GMB, 9GMD).
    record_section: ["CC:FUNCTION"]
    supporting_text: Plays a role in the inhibition of the host RecBCD complex (also called exonuclease V) (Probable).
suggested_questions:
- question: Can single-residue substitutions in gp5.9 uncouple RecBCD inhibition from activation of the retron-Ec48 abortive
    infection complex?
suggested_experiments:
- description: Perform deep mutational scanning of T7 gene 5.9 during infection of RecBCD+ Escherichia coli strains with and
    without the retron-Ec48 defense island.
  hypothesis: Specific surface residues of the gp5.9 coiled-coil contact retron-Ec48 or induce a distinct RecBCD conformation
    separable from competitive DNA-channel blockade.
