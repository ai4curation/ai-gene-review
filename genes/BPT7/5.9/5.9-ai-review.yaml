  label: Escherichia phage T7
description: RecBCD inhibitor protein gp5.9 of Escherichia phage T7 that acts as an acidic DNA mimic to bind the DNA-binding
  channel of the host RecBCD (exonuclease V) helicase-nuclease complex, inhibiting host degradation of linear viral DNA while
  also serving as the molecular trigger sensed by the bacterial retron-Ec48 guard defense system.
