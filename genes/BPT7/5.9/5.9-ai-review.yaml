- id: PMID:127051
  title: Partial purification and properties of a bacteriophage T7 inhibitor of the host exonuclease V activity.
  findings:
  - statement: Demonstrated that T7 gene 5.9 encodes a 52-amino-acid acidic protein that directly reduces and inhibits host
      Escherichia coli exonuclease V (RecBCD) activity.
    supporting_text: Infection of Escherichia coli with bacteriophage T7 results in an inhibition of the host exonuclease
      V (recB, C DNase) activity.
- id: PMID:33157039
  title: Bacterial Retrons Function In Anti-Phage Defense.
  findings:
  - statement: Showed that inhibition of RecBCD by phage T7 gp5.9 triggers the RecBCD-associated retron-Ec48 defense complex,
      inducing abortive infection.
    supporting_text: Focusing on retron Ec48, we show evidence that it "guards" RecBCD, a complex with central anti-phage
      functions in bacteria. Inhibition of RecBCD by phage proteins activates the retron, leading to abortive infection and
      cell death.
