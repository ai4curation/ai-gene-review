product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10760
  label: Escherichia phage T7
description: Capsid assembly scaffolding protein gp9 of Escherichia phage T7 that forms a transient concentric
  inner scaffold inside the procapsid, interacting with the N-terminal helices of skewed gp10 major capsid
  hexamers and the wing domain of the gp8 portal ring to direct T=7 procapsid assembly before being expelled
  during DNA packaging and capsid expansion.
existing_annotations:
- term:
    id: GO:0019069
    label: viral capsid assembly
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR008768
  review:
    summary: InterPro domain mapping assigns viral capsid assembly to the gp9 scaffolding protein.
    action: ACCEPT
    reason: Biochemical and cryo-EM studies (PMID:13677051, PMID:16211007, PMID:25313071) establish that
      gp9 is the transient scaffolding protein essential for directing accurate T=7 procapsid assembly
      from gp10 hexamers and pentamers around the gp8 portal vertex.
    supported_by:
    - reference_id: PMID:13677051
      supporting_text: We propose that gp9 facilitates assembly by binding to gp10 hexamers, locking them
        into a morphogenically correct conformation. gp9 is expelled as the procapsid matures into the
        larger, thinner walled, polyhedral capsid.
    - reference_id: PMID:25313071
      supporting_text: In the procapsid, the N terminus of the major capsid protein, gp10, has a six-turn
        helix at the inner surface of the shell, where each skewed hexamer of gp10 interacts with two
        scaffolding proteins.
core_functions:
- description: Directs assembly of the T=7 icosahedral procapsid by forming an inner scaffolding layer
    that binds the N-terminal helices of skewed gp10 hexamers and the gp8 portal ring before expulsion
    upon capsid maturation.
