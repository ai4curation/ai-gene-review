references:
- id: GO_REF:0000002
  title: Gene Ontology annotation through association of InterPro records with GO terms
  findings: []
- id: PMID:13677051
  title: Molecular mechanisms in bacteriophage T7 procapsid assembly, maturation, and DNA containment.
  findings:
  - statement: Demonstrated that gp9 binds gp10 hexamers to promote assembly of T=7 procapsids and is
      expelled during maturation into the expanded polyhedral capsid.
    supporting_text: We propose that gp9 facilitates assembly by binding to gp10 hexamers, locking them
      into a morphogenically correct conformation. gp9 is expelled as the procapsid matures into the larger,
      thinner walled, polyhedral capsid.
- id: PMID:16211007
  title: Maturation of phage T7 involves structural modification of both shell and inner core components.
  findings:
  - statement: Cryo-EM reconstruction of T7 procapsids resolved the internal scaffolding layer formed
      by gp9 between the core complex and the inner surface of the gp10 shell.
    supporting_text: The protein layer located between the core and the inner side of the shell can be
      assigned to the scaffolding protein (gp9).
- id: PMID:25313071
  title: Capsid expansion mechanism of bacteriophage T7 revealed by multistate atomic models derived from
    cryo-EM reconstructions.
  findings:
  - statement: Showed that each skewed hexamer of gp10 in the procapsid interacts via its N-terminal six-turn
      inner helix with two molecules of the gp9 scaffolding protein.
    supporting_text: In the procapsid, the N terminus of the major capsid protein, gp10, has a six-turn
      helix at the inner surface of the shell, where each skewed hexamer of gp10 interacts with two scaffolding
      proteins.
- id: file:genes/BPT7/9/9-uniprot.txt
  title: UniProtKB record for P03716 (SCAF_BPT7)
  findings:
  - statement: Summarizes the role of gp9 as a transient scaffolding protein in procapsid assembly that
      is absent from mature virions.
    record_section: ["CC:FUNCTION"]
    supporting_text: Scaffolding protein involved in the icosahedric procapsid assembly. Coassembles with
      the capsid proteins to form the procapsid
suggested_questions:
- question: What structural trigger during initial dsDNA entry causes the cooperative dissociation of
    gp9 from the N-terminal inner helix of gp10 and its exit through the gp10 hexamer skew pores?
suggested_experiments:
- description: Perform single-particle cryo-EM of T7 procapsids stalled at early stages of in vitro gp19-mediated
    DNA packaging to capture intermediates of gp9 release and gp10 hexamer unskewing.
  hypothesis: Electrostatic repulsion from incoming dsDNA and initial outward movement of the gp10 N-terminal
    helix disrupt the gp9 binding site, allowing unfolded or monomeric gp9 to exit through the central
    pores of skewed gp10 hexamers before shell expansion closes the pores.
