id: P03750
gene_symbol: '7'
taxon:
  id: NCBITaxon:10760
  label: Escherichia phage T7
description: Uncharacterized 133-amino-acid class III protein gp7 of Escherichia phage T7 encoded immediately upstream of
  essential tail protein gene 7.3. Although classical polar amber mutations in gene 7 led to its historical designation as
  a host-range protein, non-polar complementation studies demonstrated that gp7 is neither a virion component nor essential
  on laboratory Escherichia coli strains, and its molecular function remains unknown.
existing_annotations: []
core_functions: []
references:
- id: PMID:16054667
  title: Changes in bacteriophage T7 virion structure at the initiation of infection.
  findings:
  - statement: Showed that the products of genes 6.7 and 7.3 are internal virion proteins ejected at the initiation of infection,
      whereas gp7 is not present in mature virions.
    supporting_text: Two small proteins, the products of genes 6.7 and 7.3, also are ejected from the infecting virion.
- id: PMID:6864790
  title: Complete nucleotide sequence of bacteriophage T7 DNA and the locations of T7 genetic elements.
  findings:
  - statement: Determined the nucleotide sequence and genomic location of gene 7 in bacteriophage T7.
- id: file:genes/BPT7/7/7-uniprot.txt
  title: UniProtKB record for P03750 (Y7_BPT7)
  findings:
  - statement: Uncharacterized 133-amino-acid protein encoded by gene 7 of bacteriophage T7.
suggested_questions:
- question: Does gp7 have an accessory role in phage infection or host range on non-laboratory Escherichia coli strains when
    expression of downstream gp7.3 is maintained?
suggested_experiments:
- description: Construct a non-polar in-frame deletion of gene 7 that preserves the ribosome-binding site and translation
    coupling of gene 7.3, and assay plating efficiency across diverse rough and smooth Escherichia coli strains.
  hypothesis: gp7 provides a conditional fitness advantage in specific host envelope or physiological contexts independent
    of its translational coupling to gene 7.3.
status: COMPLETE
