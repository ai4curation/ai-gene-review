suggested_questions:
- question: Does gp7 have an accessory role in phage infection or host range on non-laboratory Escherichia
    coli strains when expression of downstream gp7.3 is maintained?
suggested_experiments:
- description: Construct a non-polar in-frame deletion of gene 7 that preserves the ribosome-binding site
    and translation coupling of gene 7.3, and assay plating efficiency across diverse rough and smooth
    Escherichia coli strains.
  hypothesis: gp7 provides a conditional fitness advantage in specific host envelope or physiological
    contexts independent of its translational coupling to gene 7.3.
status: COMPLETE
