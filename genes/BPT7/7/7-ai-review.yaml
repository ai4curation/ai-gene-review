id: P03750
gene_symbol: '7'
taxon:
  id: NCBITaxon:10760
  label: Escherichia phage T7
description: Uncharacterized 133-amino-acid class III protein gp7 of Escherichia phage T7 encoded immediately
  upstream of essential tail protein gene 7.3. Although classical polar amber mutations in gene 7 led
  to its historical designation as a host-range protein, non-polar complementation studies demonstrated
  that gp7 is neither a virion component nor essential on laboratory Escherichia coli strains, and its
  molecular function remains unknown.
