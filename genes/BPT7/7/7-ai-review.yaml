  review:
    summary: Protein gp7 has no experimentally established molecular function.
    action: NEW
    reason: Kemp et al. (2005) showed that historical gene 7 amber phenotypes were due to translational
      polarity on downstream gene 7.3 and that gp7 itself has no known biochemical activity; root molecular_function
      with ND is assigned.
