- id: PMID:15784250
  title: 'Structure of the connector of bacteriophage T7 at 8A resolution: structural homologies of a
    basic component of a DNA translocating machinery.'
  findings:
  - statement: Determined the cryo-EM structure of the homododecameric T7 gp8 portal connector and its
      central axial channel.
    supporting_text: The general morphology of the T7 connector is that of a 12-folded toroidal homopolymer
      with a channel that runs along the longitudinal axis of the particle.
- id: PMID:23580619
  title: Visualization of uncorrelated, tandem symmetry mismatches in the internal genome packaging apparatus
    of bacteriophage T7.
  findings:
  - statement: Resolved the symmetry mismatch and layered architecture of the 5-fold gp10 capsid shell,
      12-fold gp8 portal ring, and internal core stack at the T7 portal vertex.
    supporting_text: Our reconstructions collectively validate previously proposed symmetries, compositions,
      and sequential order of T7 portal vertex layers, resolving in tandem the 5-fold gene product 10
      (gp10) shell, 12-fold gp8 portal ring, and an internal core stack
- id: PMID:23632014
  title: Large terminase conformational change induced by connector binding in bacteriophage T7.
  findings:
  - statement: Resolved the complex between the dodecameric gp8 connector and pentameric gp19 terminase
      motor forming a continuous DNA translocation channel.
    supporting_text: The structure of the complete connector-terminase complex is also reported, revealing
      the coupling between the terminase and the connector forming a continuous channel.
- id: PMID:23884409
  title: Structural characterization of the bacteriophage T7 tail machinery.
  findings:
  - statement: Resolved the 3D cryo-EM structure of the T7 tail complex built from 12 monomers of gp8
      portal, 12 monomers of gp11 adaptor, and 6 monomers of gp12 nozzle.
    supporting_text: 'The T7 tail is a complex of around 2.7 MDa composed of at least four proteins as
      follows: the connector (gene product 8, gp8), the tail tubular proteins gp11 and gp12, and the fibers
      (gp17).'
- id: file:genes/BPT7/8/8-uniprot.txt
  title: UniProtKB record for P03728 (PORTL_BPT7)
  findings:
  - statement: Summarizes the role of the dodecameric gp8 portal ring in viral DNA packaging, tail attachment,
      and genome ejection.
    supporting_text: Forms the portal vertex of the capsid. This portal plays critical roles in head assembly,
      genome packaging, neck/tail attachment, and genome ejection.
suggested_questions:
- question: How does the tunnel-loop valve of the gp8 portal ring transition from the open DNA-translocating
    state during gp19-mediated packaging to the closed DNA-retaining conformation prior to gp11 adaptor
    binding?
suggested_experiments:
- description: Determine cryo-EM structures of the gp8-gp19 packaging complex stalled at full-head packaging
    pressure immediately before and after terminase dissociation and gp11 binding.
  hypothesis: High internal DNA pressure pushes the gp8 crown and wing domains downward, constricting
    the central tunnel loops to prevent DNA slippage before gp11 docks onto the clip domain.
