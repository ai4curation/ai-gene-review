taxon:
  id: NCBITaxon:10760
  label: Escherichia phage T7
description: Portal (connector) protein gp8 of Escherichia phage T7 that assembles into a homododecameric
  toroidal ring with a central axial channel at the unique fivefold vertex of the T=7 icosahedral capsid,
  coupling with the gp19 terminase motor to translocate viral double-stranded DNA into the procapsid,
  anchoring the internal gp14/gp15/gp16 core stack and external gp11 tail adaptor ring, and forming the
  conduit for genome ejection into the host cell.
