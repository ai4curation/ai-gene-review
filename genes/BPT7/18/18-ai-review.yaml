- id: PMID:6864790
  title: Complete nucleotide sequence of bacteriophage T7 DNA and the locations of T7 genetic elements.
  findings:
  - statement: Determined the nucleotide sequence of bacteriophage T7 gene 18 encoding the 89-amino-acid DNA maturation protein
      gp18.
- id: PMID:3036832
  title: Gene 18 protein of bacteriophage T7. Overproduction, purification, and characterization.
  findings:
  - statement: Overproduced, purified, and characterized native octameric gp18 and established its essential role in packaging
      T7 DNA.
    supporting_text: Genetic and physical analyses indicate that gene 18 protein of bacteriophage T7 is essential for packaging
      of T7 DNA.
- id: PMID:3298244
  title: Processing of concatemers of bacteriophage T7 DNA in vitro.
  findings:
  - statement: Reconstituted concatemeric T7 DNA processing in vitro and showed that gp18, gp19, and proheads (gp8 and gp9)
      are essential for concatemer cleavage and packaging.
    supporting_text: The products of genes 8 (prohead protein), 9 (scaffolding protein), and 19 (DNA maturation) along with
      gene 18 protein are essential, indicating that capsids are required for processing.
suggested_questions:
- question: How does the octameric gp18 ring recognize the T7 packaging initiation site near the right genetic end and coordinate
    the symmetry transition to the pentameric gp19 large terminase motor?
  experts:
  - José L. Carrascosa
  - Charles C. Richardson
suggested_experiments:
- description: Determine the cryo-EM structure of the T7 gp18-gp19 holoterminase complex bound to a T7 right-end packaging
    site DNA fragment.
  hypothesis: The C-terminal tail of octameric gp18 docks onto the N-terminal ATPase domain of pentameric gp19 to position
    concatemeric DNA into the central translocation channel.
