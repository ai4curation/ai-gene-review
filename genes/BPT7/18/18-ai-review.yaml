  label: Escherichia phage T7
description: Small terminase subunit gp18 (DNA maturation protein) is an 89-amino-acid homo-octameric DNA-binding protein
  essential for processing and packaging concatemeric bacteriophage T7 DNA into procapsids in concert with the large terminase
  subunit gp19.
