core_functions:
- description: >-
    Metal-dependent, single-strand-specific deoxyribonuclease of the N-terminal HD domain,
    requiring Mn2+, Co2+ or Ni2+ and inactive with Mg2+. Base-pairing of the complex's
    crRNA to a nascent invader transcript activates the nuclease, which degrades the
    single-stranded DNA exposed in the transcription bubble, so that destruction is
    directed at invader loci that are actively transcribed and not at silent or host DNA.
    The D16A substitution abolishes this activity without affecting cyclic oligoadenylate
    synthesis. Activity is extinguished as Csm3 cleaves the bound target RNA and the
    fragments dissociate, and is suppressed on self transcripts when the crRNA 5' handle
    pairs with the target's 3' flanking sequence.
