    reference_section_type: DATABASE_ENTRY
- description: >-
    Nucleotidyltransferase of the C-terminal Palm domain (GGDEF-like fold, residues
    509-647) which, once the complex has bound a cognate target RNA, polymerises and
    cyclises ATP into cyclic oligoadenylates from cyclic triadenylate up to cyclic
    hexaadenylate with release of diphosphate. The reaction accepts ATP, 2'dATP or 3'dATP
    but no other nucleotide and requires a free 3'-OH ribose, and the enzyme can also
    cyclise linear pppA3 to pppA6. The product is a diffusible second messenger that
    leaves the complex and allosterically activates the standalone ribonuclease Csm6 by
    binding its CARF domain, turning one recognition event into an amplified, cell-wide
    RNA-degrading response. Substituting the Palm-domain aspartate pair at 575-576
    abolishes this activity while leaving the HD nuclease intact, establishing the two
    centres as independent. GO has no term for this activity, so the proposed term is named
    here rather than forcing an ill-fitting id.
