id: A0A0A7HFE1
gene_symbol: cas10
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:1308
  label: Streptococcus thermophilus
description: >-
  Cas10 (Csm1) is the large catalytic subunit of the type III-A Csm effector complex of
  Streptococcus thermophilus, which assembles one copy of Cas10 and one of Csm4 at one end
  of a filament of five Csm3 subunits, with three copies of Csm2 and a single Csm5, around
  a mature CRISPR RNA. The complex is licensed not by invader DNA but by base-pairing of
  its crRNA to a nascent transcript of the invading element, and that recognition event
  switches on two chemically unrelated activities that lie in separate domains of Cas10.
  The N-terminal HD domain is a single-strand-specific deoxyribonuclease, active with
  Mn2+, Co2+ or Ni2+ but not Mg2+, which degrades the single-stranded DNA exposed in the
  transcription bubble of the locus being transcribed; because recognition is
  transcription-dependent, the nuclease destroys actively expressed invader DNA while
  leaving silent and host DNA untouched. The C-terminal Palm domain, recognised as a
  GGDEF-like fold, polymerises and cyclises ATP into cyclic oligoadenylates ranging from
  cyclic triadenylate to cyclic hexaadenylate with release of diphosphate, a reaction that
  needs a free 3'-OH ribose. These cyclic oligoadenylates are diffusible second messengers
  that leave the complex and allosterically activate the standalone ribonuclease Csm6
  through its CARF domain, amplifying a single recognition event into indiscriminate RNA
  degradation. The two catalytic centres are independent: substituting the HD-domain
  aspartate at position 16 abolishes DNA degradation while leaving cyclic oligoadenylate
  synthesis intact, and substituting the Palm-domain aspartate pair at 575-576 does the
  reverse. Both outputs are self-limiting, because cleavage of the bound target RNA by
  Csm3 and its subsequent dissociation shut the complex down, and pairing of the crRNA 5'
  handle with the target's 3' flank suppresses the nuclease on self transcripts.
