proposed_new_terms:
- proposed_name: cyclic oligoadenylate synthase activity
  proposed_definition: >-
    Catalysis of the polymerisation and cyclisation of ATP into a cyclic oligoadenylate
    with release of diphosphate, for example 4 ATP = cyclic tetraadenylate + 4
    diphosphate, or 6 ATP = cyclic hexaadenylate + 6 diphosphate. The product is a closed
    ring of three to six adenosine 5'-monophosphate units joined by 3'-5' phosphodiester
    bonds, which acts as a second messenger. The activity resides in the Palm
    (GGDEF-like) domains of the Cas10/Csm1 subunit of type III CRISPR-Cas effector
    complexes, where it is licensed by binding of a target RNA complementary to the
    complex's CRISPR RNA.
  justification: >-
    No GO molecular-function term describes the synthesis of cyclic oligoadenylate
    (cA3-cA6) second messengers, which is one of the two catalytic outputs of Cas10 and
    the step that makes type III CRISPR immunity a two-tier, amplifying response.
    GO:0001730 2'-5'-oligoadenylate synthetase activity must not be reused for it: that
    term is defined as "Catalysis of the reaction: ATP = pppA(2'p5'A)n oligomers. This
    reaction requires the binding of double-stranded RNA", which is the metazoan
    interferon-induced OAS enzyme. Its product is a linear 2'-5'-linked oligomer that
    retains a 5'-triphosphate, its trigger is free double-stranded RNA, and it sits under
    GO:0070566 adenylyltransferase activity. Cas10 instead makes a covalently closed ring
    of 3'-5'-linked AMP units, releases diphosphate at every step, and is triggered by
    crRNA-guided recognition of a target RNA inside a ribonucleoprotein complex; the
    requirement for a free 3'-OH ribose, measured on this very protein, is the direct
    chemical counter-indication to the 2'-5' term. The natural placement is alongside the
    bacterial cyclic-dinucleotide synthases, which GO already distinguishes at this
    granularity and places as direct children of GO:0016779 nucleotidyltransferase
    activity: GO:0106408 diadenylate cyclase activity ("Catalysis of the reaction: 2 ATP =
    3',3'-c-di-AMP + 2 diphosphate") and GO:0052621 diguanylate cyclase activity. A cyclic
    oligoadenylate synthase term is the missing member of that series. UniProt already
    records the reaction for this entry with Rhea cross-references (RHEA:58276 for cA6,
    RHEA:58280 for cA4 in the Thermus orthologue) and ChEBI entities for the products, so
    the term can be given exact external mappings on creation. The module
    modules/crispr_cas_adaptive_immunity.yaml carries the Cas10 Palm-domain annoton with
    no GO id and records the gap, but a module cannot propose a term; this is that
    proposal. A matching biological-process term for cyclic oligoadenylate signalling, and
    a cyclic oligoadenylate ring nuclease activity term for the enzymes that destroy the
    signal, are the companion requests.
  proposed_parent:
    id: GO:0016779
    label: nucleotidyltransferase activity
  proposed_mappings:
  - predicate: skos:closeMatch
    target_term:
      id: RHEA:58276
      label: 6 ATP = cyclic hexaadenylate + 6 diphosphate
  - predicate: skos:closeMatch
    target_term:
      id: RHEA:58280
      label: 4 ATP = cyclic tetraadenylate + 4 diphosphate
  supported_by:
  - reference_id: PMID:28663439
    supporting_text: >-
      target RNA binding by the Csm effector complex of Streptococcus thermophilus
      triggers Cas10 to synthesize cyclic oligoadenylates
    full_text_unavailable: true
  - reference_id: PMID:28722012
    supporting_text: >-
      Upon target RNA binding by the interference complex, its Cas10 subunit converts ATP
      into a cyclic oligoadenylate product, which allosterically activates Csm6 by binding
      to its CRISPR-associated Rossmann fold (CARF) domain.
    full_text_unavailable: true
suggested_questions:
- question: >-
    Why does this enzyme produce a cA3 to cA6 mixture when its cognate receiver, Csm6,
    responds to one ring size? Is the distribution controlled by the complex, by ATP
    concentration, or trimmed afterwards by a ring nuclease?
- question: >-
    Does ablating Cas10 catalysis, as opposed to ablating Csm3, cause a measurable loss of
    phage immunity in Streptococcus thermophilus itself? Until that experiment exists,
    GO:0051607 for this subunit rests on curator inference rather than a phenotype.
- question: >-
    Should GO acquire a cellular-component term for the Csm/Cmr effector complex? Complex
    membership for every curated Cas subunit currently collapses onto the root term
    GO:0032991, which loses the distinction between Cascade, Csm and Cmr.
- question: >-
    Is a biological-process term for cyclic oligoadenylate signalling warranted, parallel
    to GO:0061939 c-di-GMP signaling, so that the producer, the CARF-domain receivers and
    the ring nucleases that terminate the signal can be linked in the ontology?
suggested_experiments:
- description: >-
    Determine the ring-size distribution of the products as a function of ATP
    concentration, metal identity and target-RNA length by LC-MS, to establish whether the
    cA3-cA6 spectrum is a property of the active site or of the assay conditions.
- description: >-
    Build a cryo-EM structure of the StCsm complex with a bound target RNA and a
    non-hydrolysable ATP analogue in the Palm domains, to show how target recognition at
    the Csm3 filament is transmitted to the cyclase active site tens of angstroms away.
- description: >-
    Challenge Streptococcus thermophilus carrying wild-type, D16A and D575/D576A cas10
    alleles with a protospacer-bearing phage, separating the contribution of invader-DNA
    degradation from that of cyclic oligoadenylate signalling to immunity in the native
    host.
- description: >-
    Measure the kinetics of cOA accumulation and decay in vivo after phage challenge,
    using a quantitative assay for cA4 and cA6, to test whether the host encodes a ring
    nuclease that terminates the signal.
