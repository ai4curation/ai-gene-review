        id: CHEBI:60240
    note:
      texts:
      - evidences:
        - evidenceCode: ECO:0000269
          source: PubMed
          id: '27105119'
        - evidenceCode: ECO:0000269
          source: PubMed
          id: '28663439'
        value: Degradation of ssDNA requires Mn(2+), Co(2+) or Ni(2+); Mg(2+), Ca(2+) or Zn(2+) do not activate
          ssDNase activity (PubMed:27105119). Formation of cOA requires Mn(2+), Co(2+) or Zn(2+), Mg(2+) is not
          as efficient (PubMed:28663439).
  - texts:
    - evidences:
      - evidenceCode: ECO:0000269
        source: PubMed
        id: '27105119'
      value: ssDNase activity is activated by target RNA binding to the Csm-crRNA complex and is inhibited by EDTA
    commentType: ACTIVITY REGULATION
  - texts:
    - evidences:
      - evidenceCode: ECO:0000269
        source: PubMed
        id: '25458845'
      - evidenceCode: ECO:0000269
        source: PubMed
        id: '27105119'
      - evidenceCode: ECO:0000269
        source: PubMed
        id: '28663439'
      - evidenceCode: ECO:0000305
        source: PubMed
        id: '25458845'
      - evidenceCode: ECO:0000305
        source: PubMed
        id: '27105119'
      value: Part of the Csm effector complex that includes at least Cas10(1), Csm2(3), Csm3(5), Csm4(1), Csm5(1)
        and mature crRNA (PubMed:25458845, PubMed:27105119, PubMed:28663439). The Csm complex is elongated and slightly
        twisted with a maximal length of 215 Angstroms and a diameter of 75-80 Angstroms (PubMed:25458845). It has
        been modeled to have a central protein filamant of Csm3 subunits along which the dsRNA helix of paired crRNA
        and target RNA binds. The filament is capped at one end by Cas10 and Csm4 and at the other end by Csm5;
        ssDNA is thought to bind to the N-terminal HD domain of Cas10 (Probable). Csm with a precursor crRNA does
        not include Csm5, while Cas6, the enzyme probably involved in pre-crRNA processing, is found associated
        with a subset of the Csm complex (PubMed:25458845)
    commentType: SUBUNIT
  - texts:
    - evidences:
      - evidenceCode: ECO:0000269
        source: PubMed
        id: '27105119'
      - evidenceCode: ECO:0000269
        source: PubMed
        id: '28663439'
      value: The N-terminal HD domain has ssDNase activity (PubMed:27105119). The C-terminal GGDEF domain has the
        cOA synthesis activity (PubMed:28663439)
    commentType: DOMAIN
  - texts:
    - evidences:
      - evidenceCode: ECO:0000269
        source: PubMed
        id: '25458845'
      value: Encoded in a type III-A CRISPR locus
    commentType: MISCELLANEOUS
  - texts:
    - evidences:
      - evidenceCode: ECO:0000305
      value: Belongs to the CRISPR-associated Cas10/Csm1 family
    commentType: SIMILARITY
