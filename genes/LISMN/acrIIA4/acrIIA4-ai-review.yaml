id: A0A247D711
gene_symbol: acrIIA4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:1639
  label: Listeria monocytogenes
description: AcrIIA4 is an 87-residue acidic protein encoded by prophages integrated
  in the genomes of Listeria monocytogenes, where it neutralises the host type II-A
  CRISPR-Cas9 adaptive immune system and so protects the resident prophage and any
  co-infecting phage from Cas9-mediated destruction. It acts as a nucleic acid mimic.
  A densely negatively charged surface imitates the phosphate backbone of a DNA duplex
  and competitively occupies the protospacer-adjacent-motif (PAM) recognition surface
  of guide-RNA-loaded Cas9, so the enzyme can no longer license a double-stranded
  DNA target. A protruding loop simultaneously reaches into the RuvC catalytic pocket
  and blocks entry of the non-target DNA strand, so both target licensing and non-target-strand
  cleavage are shut down. Binding is guide-dependent, because the surface AcrIIA4 docks
  onto only forms once Cas9 has loaded its guide RNA, which means the inhibitor engages
  a ribonucleoprotein rather than apo Cas9. Inhibition is stoichiometric and reversible,
  requiring the inhibitor in excess of its target, and it extends to Cas9 orthologues
  from other species because the mimicked surface is conserved. Prophage-encoded AcrIIA
  proteins are carried by more than half of cas9-bearing L. monocytogenes strains,
  making this counter-defence a common feature of the species rather than an isolated
  case.
existing_annotations:
- term:
    id: GO:0098672
    label: symbiont-mediated suppression of host CRISPR-cas system
  evidence_type: IDA
  original_reference_id: PMID:28041849
  qualifier: acts_upstream_of_or_within_positive_effect
  review:
    summary: AcrIIA4 was identified as one of four prophage-encoded type II-A Cas9
      inhibitors in Listeria monocytogenes and shown to block both the native Lmo
      Cas9 and the heterologous Streptococcus pyogenes Cas9 in bacteria and in human
      cells. GO:0098672 is the correct and maximally specific process term for this
      activity, and the accession is the exact sequence used in the work (AEO04689.1,
      identical over all 87 residues), so the IDA code is properly grounded.
    action: ACCEPT
    reason: The term is right and the experimental grounding is on this very sequence,
      so the annotation is accepted as the core process. One caveat is recorded rather
      than acted on. The GOA qualifier acts_upstream_of_or_within_positive_effect
      is not the best-supported choice, because AcrIIA4 does not act upstream of the
      suppression process; its direct binding to guide-loaded Cas9 is the executing
      step of that process, so involved_in is better supported. The positive_effect
      component also reads, to anyone skimming the GAF, as though AcrIIA4 up-regulated
      something, which inverts the sense. Changing a qualifier is not a term change,
      so the action stays ACCEPT and the qualifier is flagged here for the assigning
      group (CACAO) rather than being rewritten.
    supported_by:
    - reference_id: PMID:28041849
      supporting_text: This analysis led to the discovery of four unique type II-A
        CRISPR-Cas9 inhibitor proteins encoded by Listeria monocytogenes prophages.
    - reference_id: PMID:28041849
      supporting_text: Two of these inhibitors also blocked the widely used Streptococcus
        pyogenes Cas9 when assayed in Escherichia coli and human cells.
- term:
    id: GO:0043021
    label: ribonucleoprotein complex binding
  evidence_type: IDA
  original_reference_id: PMID:28448066
  review:
    summary: AcrIIA4 binds Cas9 only after the guide RNA is loaded, because the composite
      surface it docks onto is created by the conformational change that sgRNA binding
      induces. The crystal structure is of the ternary AcrIIA4-SpyCas9-sgRNA complex,
      so the entity bound is a ribonucleoprotein, not a free protein.
    action: NEW
    reason: Guide dependence is a defining feature of this inhibitor and is reported
      independently by two structural groups, but GOA holds no molecular function
      term for A0A247D711 at all. GO:0043021 is asserted because it is literally true
      and checkable, and because the same term was used for the analogous type I-F
      inhibitor AcrF8 in genes/BPZF4/AcrF8. It is deliberately not offered as the
      core activity, since it records what is bound and not the mimicry that makes
      the binding inhibitory; the core activity is carried by the proposed term instead.
      GO:0005515 protein binding is avoided as uninformative.
    supported_by:
    - reference_id: PMID:28448066
      supporting_text: Our data show that AcrIIA2 and AcrIIA4 interact with SpyCas9
        in a sgRNA-dependent manner.
    - reference_id: PMID:28448066
      supporting_text: Structural comparison reveals that formation of the AcrIIA4-binding
        site of SpyCas9 is induced by sgRNA binding.
    - reference_id: PMID:28602637
      supporting_text: Selective Binding of AcrIIA4 to sgRNA-bound SpyCas9
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IC
  original_reference_id: PMID:28041849
  review:
    summary: AcrIIA4 is translated from a prophage integrated in the Listeria monocytogenes
      chromosome and acts on the host's own Cas9-guide RNA complex, which is a cytoplasmic
      ribonucleoprotein. The location is inferred by curator from the binding partner
      and from the fact that inhibition is demonstrated inside living cells; both
      published structures were determined in vitro, so there is no direct localization
      experiment.
    action: NEW
    reason: GO:0030430 host cell cytoplasm, which was used for the phage-taxon inhibitor
      AcrF8, is not appropriate here. This UniProt entry is assigned to Listeria monocytogenes
      itself, not to a phage, because the gene lies in a resident prophage; the cell
      whose cytoplasm the protein occupies is therefore its own cell under that taxon
      assignment, not a separate host. GO:0005737 is the correct component term for
      that situation. Evidence is IC rather than IDA because localization was inferred,
      not measured.
    supported_by:
    - reference_id: PMID:28041849
