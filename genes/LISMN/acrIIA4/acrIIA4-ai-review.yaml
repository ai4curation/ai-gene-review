proposed_new_terms:
- proposed_name: nucleic acid mimicry-based competitive inhibitor activity
  proposed_definition: A molecular function inhibitor activity in which a protein
    presents a surface whose shape and charge distribution imitate those of a nucleic
    acid, and thereby binds competitively to the nucleic-acid-binding site of a target
    protein or protein-containing complex, occluding that site so that the target
    cannot engage its genuine nucleic acid ligand. The inhibitor is not itself a nucleic
    acid, and because the mechanism is competitive occupancy rather than catalysis,
    inhibition is reversible and requires the inhibitor at or above the concentration
    of its target.
  justification: Mimicry-based competitive inhibition is the most common anti-CRISPR
    mechanism and is also used outside CRISPR biology, yet GO has no term for it,
    and every alternative loses the mechanism. A binding term such as GO:0043021 ribonucleoprotein
    complex binding records what is bound but not that binding is inhibitory, and
    GO:0005515 protein binding is uninformative. GO:0140721 nuclease inhibitor activity
    and the generic GO:0140678 molecular function inhibitor activity record that the
    target is inhibited but cannot distinguish a mimic from a domain blocker or from
    a catalytic inhibitor, which is precisely the distinction that matters, because
    a mimic competes with the substrate for one site and is therefore defeated by
    substrate excess whereas a catalytic inhibitor is not. GO:0140489 molecular template
    activity concerns templating polymer synthesis and is unrelated. The term is needed
    because anti-CRISPR proteins share no sequence homology, so mechanism is the only
    axis on which they can be compared, and without an MF term for mimicry that axis
    is invisible to GO-based reasoning. At least three proteins in this curation round
    would use it immediately, namely AcrIIA4 (this entry), the sequence-unrelated
    AcrIIA2 (UniProtKB:A0A059T5F6) which converges on the same Cas9 surface, and the
    unrelated type I-F inhibitor AcrF2/gp30 (UniProtKB:Q6TM72) which mimics a DNA
    duplex against a completely different effector. That three unrelated families
    converge on one mechanism is the argument that the mechanism, not the family,
    is the reusable unit.
  proposed_parent:
    id: GO:0140678
    label: molecular function inhibitor activity
  supported_by:
  - reference_id: PMID:28448066
    supporting_text: AcrIIA4 inhibits SpyCas9 activity by structurally mimicking the
      PAM to occupy the PAM-interacting site in the PAM-interacting domain, thereby
      blocking recognition of double-stranded DNA substrates by SpyCas9.
  - reference_id: PMID:29497118
    supporting_text: It has been suggested that the negatively charged patches mimic
      the phosphate groups of nucleic acids that associate with the PAM interaction
      site of SpyCas9
  - reference_id: PMID:29497118
    supporting_text: which was also found in AcrF2 proteins inhibiting the subtype
      I-F effector complex
knowledge_gaps:
- gap_statement: GO has no molecular-function term for mimicry-based competitive inhibition,
    so the activity that is the whole point of AcrIIA4 cannot be asserted with an
    existing identifier.
  boundary: The process is well served by GO:0098672, and what AcrIIA4 binds is capturable
    with GO:0043021. What cannot be expressed is that the binding works by imitating
    the substrate and is therefore competitive and substrate-displaceable.
  gap_kind:
  - ONTOLOGY
  status: OPEN
  significance: Anti-CRISPR families share no sequence homology, so mechanism is the
    only axis on which they can be compared. Without an MF term for mimicry, a DNA
    mimic, a catalytic-domain blocker and a guide-destroying enzyme all flatten to
    the same process term.
  resolution: Create the proposed term nucleic acid mimicry-based competitive inhibitor
    activity under GO:0140678, then move its identifier into the molecular_function
    slot here and in genes/9CAUD/acrIIA2 and genes/BPD31/orf30.
  provenance:
  - reference_id: PMID:29497118
    supporting_text: It has been suggested that the negatively charged patches mimic
      the phosphate groups of nucleic acids that associate with the PAM interaction
      site of SpyCas9
- gap_statement: Whether AcrIIA4 is expressed from the resident prophage at a level
    and time that matters during a natural Listeria infection is undetermined; all
    inhibition data come from induced heterologous expression or from purified protein.
  boundary: That AcrIIA4 inhibits Lmo Cas9 and SpyCas9, and how it does so structurally,
    are both firmly established. What is missing is the native expression regime.
  gap_kind:
  - BIOLOGY
  status: OPEN
  significance: Stoichiometric inhibitors must be present in excess of their target,
    so the native expression level is not a detail but a precondition for the mechanism
    to work in vivo. For the related AcrF8 locus the answer turned out to be a promoter
    burst followed by Aca-mediated repression, and no aca gene has been assigned to
    this locus.
  resolution: Measure AcrIIA4 protein abundance relative to Cas9 across lysogeny and
    prophage induction in a natural L. monocytogenes lysogen, and test for an aca-like
    repressor in the same operon.
  provenance:
  - reference_id: PMID:28041849
    supporting_text: More than half of L. monocytogenes strains with cas9 contain
      at least one prophage-encoded inhibitor, suggesting widespread CRISPR-Cas9 inactivation.
suggested_questions:
- question: Does AcrIIA4 occupancy of the PAM-recognition surface displace an already
    bound target duplex, or can it only act on Cas9 that has not yet engaged DNA?
    The buried-area comparison implies the former is thermodynamically possible, but
    it has not been tested directly.
  experts:
  - Hongtu Zhao
  - Dinshaw J. Patel
- question: Is the acidic surface of AcrIIA4 under selection to track variation in
    the PAM-interacting domain across Cas9 orthologues, or is it conserved because
    it mimics a chemically invariant feature, the phosphate backbone, that no Cas9
    can abandon?
  experts:
  - Joseph Bondy-Denomy
  - Jeong-Yong Suh
- question: Is there an Aca-like repressor in the acrIIA4 operon, and if not, what
    limits the cost of expressing a stoichiometric inhibitor in a lysogen?
  experts:
  - Joseph Bondy-Denomy
suggested_experiments:
- hypothesis: AcrIIA4 can displace a bound PAM duplex from Cas9, because it buries
    roughly three times the surface area that the duplex does.
  description: Form a dCas9-sgRNA-dsDNA ternary complex with radiolabelled target
    DNA, then titrate AcrIIA4 and follow DNA release by electrophoretic mobility shift
    assay, with unlabelled duplex as the competitor control. This is the experiment
    that distinguished a dislodging from a merely occluding inhibitor for AcrVA4 against
    Cas12a and it transfers directly.
  experiment_type: electrophoretic mobility shift competition assay
- hypothesis: The acidic patch is the inhibitory determinant, so charge rather than
    fold carries the function.
  description: Build a charge-neutralisation series across the beta3-alpha2 and alpha2-alpha3
    loops, with single, double and triple Asp or Glu to Asn or Gln substitutions,
    confirm each variant is folded by NMR or circular dichroism, then measure Cas9
    affinity by isothermal titration calorimetry alongside inhibition of DNA cleavage.
    A quantitative correlation between net surface charge and inhibitory potency,
    with the fold intact, would convert mimicry from a structural interpretation into
    a measured structure-activity relationship.
  experiment_type: charge-reversal mutagenesis with paired binding and activity readout
- hypothesis: AcrIIA4 is expressed at inhibitory levels from the resident prophage
    during natural lysogeny.
  description: Epitope-tag the chromosomal acrIIA4 in a natural L. monocytogenes lysogen,
    then quantify AcrIIA4 and Cas9 copies per cell by selected-reaction-monitoring
    mass spectrometry through exponential growth, stationary phase and mitomycin-C-induced
    prophage induction. The prediction specific to a stoichiometric inhibitor is that
    AcrIIA4 is in molar excess of Cas9 at every point where the prophage is at risk.
  experiment_type: targeted quantitative proteomics in a natural lysogen
