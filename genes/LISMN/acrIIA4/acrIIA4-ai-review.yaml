core_functions:
- description: Competitively occupies the PAM-recognition surface of guide-RNA-loaded Cas9 by presenting
    an acidic protein surface that imitates the phosphate backbone of a DNA duplex, and simultaneously
    inserts a loop into the RuvC catalytic pocket to block entry of the non-target DNA strand, so that
    the enzyme can neither license nor cleave a double-stranded DNA target
  proposed_molecular_function: nucleic acid mimicry-based competitive inhibitor activity
