    of a DNA duplex, and simultaneously inserts a loop into the RuvC catalytic pocket
    to block entry of the non-target DNA strand, so that the enzyme can neither license
    nor cleave a double-stranded DNA target
  proposed_molecular_function: nucleic acid mimicry-based competitive inhibitor activity
