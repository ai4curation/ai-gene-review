proposed_new_terms:
- proposed_name: nucleic acid mimicry-based competitive inhibitor activity
  proposed_definition: A molecular function inhibitor activity in which a protein presents a surface whose
    shape and charge distribution imitate a nucleic acid and occupies its binding site on a target protein
    or protein-containing complex, thereby preventing engagement of the genuine nucleic acid ligand.
  justification: The proposed term distinguishes inhibition through nucleic acid mimicry from other forms
    of inhibition. Existing nuclease inhibitor or molecular function inhibitor terms can describe the
    broader activity, and ribonucleoprotein complex binding describes the interaction. The proposal adds
    the mechanism shared by structurally unrelated AcrIF2, AcrIIA2 and AcrIIA4 proteins. It does not imply
    rapid reversibility, displacement of pre-bound substrate, or a universal requirement for inhibitor
    molar excess; occupancy depends on affinity, assembly state and order of addition.
  proposed_parent:
    id: GO:0140678
    label: molecular function inhibitor activity
  supported_by:
  - reference_id: PMID:28448066
    supporting_text: AcrIIA4 inhibits SpyCas9 activity by structurally mimicking the PAM to occupy the
      PAM-interacting site in the PAM-interacting domain, thereby blocking recognition of double-stranded
      DNA substrates by SpyCas9.
  - reference_id: PMID:29497118
    supporting_text: It has been suggested that the negatively charged patches mimic the phosphate groups
      of nucleic acids that associate with the PAM interaction site of SpyCas9
  - reference_id: PMID:29497118
    supporting_text: which was also found in AcrF2 proteins inhibiting the subtype I-F effector complex
knowledge_gaps:
- gap_statement: The concentration and timing of AcrIIA4 production relative to free and DNA-bound Cas9
    during native lysogeny and induction remain incompletely quantified.
  boundary: In vitro order-of-addition experiments show inhibition before target binding and no displacement
    of preformed Cas9-guide-DNA complexes. Native abundance measurements are a separate issue.
  gap_kind:
  - BIOLOGY
  status: OPEN
  significance: The fraction of accessible, guide-loaded Cas9 depends on infection timing as well as affinity
    and protein abundance. A universal inhibitor molar-excess requirement does not follow from 1:1 binding.
  resolution: Quantify AcrIIA4 and Cas9 abundance and occupancy through native prophage induction.
  provenance:
  - reference_id: PMID:28706995
    supporting_text: order-of-addition experiments showed that AcrIIA4 interferes with DNA recognition
      but has no effect on preformed Cas9-sgRNA-DNA complexes.
suggested_questions:
- question: How do native AcrIIA4 expression timing and Cas9 target occupancy determine protection during
    prophage induction?
suggested_experiments:
- description: Measure AcrIIA4 and Cas9 abundance alongside guide loading and target occupancy through
    a natural Listeria prophage induction time course.
