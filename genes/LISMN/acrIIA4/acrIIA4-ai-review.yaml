- id: PMID:28602637
  title: Inhibition Mechanism of an Anti-CRISPR Suppressor AcrIIA4 Targeting SpyCas9.
  full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Crystal structure of the AcrIIA4-SpyCas9-sgRNA ternary complex. PubMed-verified; supports
      both the PAM-surface competition and the RuvC occlusion, with buried-surface-area numbers that make
      the competition quantitative.
  findings:
  - statement: AcrIIA4 competitively occupies both the PAM-recognition surface and the RuvC catalytic
      pocket
    supporting_text: demonstrate that AcrIIA4 competitively occupies both PAM-interacting and non-target
      DNA strand cleavage catalytic pockets
    reference_section_type: ABSTRACT
  - statement: The inhibitor targets the residues essential for PAM duplex recognition and blocks DNA
      access to the RuvC catalytic residues
    supporting_text: AcrIIA4 preferentially targets critical residues essential for PAM duplex recognition,
      as well as blocks target DNA access to key catalytic residues lining the RuvC pocket
    reference_section_type: ABSTRACT
  - statement: AcrIIA4 buries roughly three times the surface that the PAM duplex itself buries, which
      is why it outcompetes the duplex
    supporting_text: AcrIIA4 targets the concave surface formed by the Topo, CTD and RuvC domains in the
      SpyCas9-sgRNA binary complex and buries an area of 1,693 Å2 on ternary complex formation (Figure
      4A). By contrast, positioning of the PAM duplex of dsDNA on the surface formed by Topo and CTD domains
      of the SpyCas9-sgRNA binary complex buries an area of 553 Å
    reference_section_type: RESULTS
  - statement: A protruding loop of AcrIIA4 enters the RuvC active site
    supporting_text: the protruding β1–β2 loop of AcrIIA4 inserts into the active site of RuvC domain
    reference_section_type: RESULTS
  - statement: Binding is selective for the guide-RNA-loaded form of Cas9
    supporting_text: Selective Binding of AcrIIA4 to sgRNA-bound SpyCas9
    reference_section_type: RESULTS
