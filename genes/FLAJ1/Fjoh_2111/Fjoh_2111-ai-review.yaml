suggested_questions:
- question: Which native lipoproteins bind directly to LolA1, and which compatible inner-membrane release
    and outer-membrane insertion partners determine its cargo selectivity?
- question: Do LolA1 and the pigment-locus paralog LolA2 carry chemically distinct cargo, or do they specialize
    in different lipoprotein subsets?
suggested_experiments:
- description: Reconstitute transfer of defined native UW101 lipoproteins through matched release machinery,
    purified LolA1 and LolB1; measure cargo binding and transfer separately from downstream motility and
    secretion.
  experiment_type: Purified-protein binding and membrane transfer reconstitution
- description: Determine LolA1 localization by controlled fractionation with cytoplasmic, periplasmic
    and membrane markers, testing the cleavable signal without relying on predicted localization alone.
  experiment_type: Subcellular fractionation and signal-peptide analysis
