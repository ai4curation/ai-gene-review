  review:
    summary: Native UW101 evidence and the LolA architecture support participation in lipoprotein trafficking.
    action: ACCEPT
    reason: PMID:40050408 identifies Fjoh_2111 as LolA1 in the same UW101 strain as A5FI22. Deletion and
      complementation establish physiological function, while outer-membrane proteomics shows reduced
      abundance of lipoprotein clients including GldJ and GldK. The specific LolA family/domain architecture
      provides independent mechanistic support for the carrier interpretation. Together these support
      the existing transport-participation claim; no purified LolA1 binding/transfer kinetics are asserted.
      The literal ECO:0007744 combined computational/experimental source evidence and E. coli P61316 supporting
      entity are preserved rather than relabeled as a target IDA, IMP or ISS assay. GO:0044874 is a related
      destination-specific localization term, not a verified descendant of GO:0042953, so no false hierarchical
      refinement is made. The gliding and T9SS phenotypes are consequences of trafficking defects, not
      new autonomous motor or secretion functions.
    supported_by:
    - reference_id: PMID:40050408
      supporting_text: The F. johnsoniae gene identified was Fjoh_2111, which we refer to as lolA1.
    - reference_id: PMID:40050408
      supporting_text: GldK and GldJ, two lipoproteins essential for gliding motility and T9 secretion28
        were much less abundant in the OM of the lolA1 and lolB1 mutants than in the WT strain
    - reference_id: file:FLAJ1/Fjoh_2111/Fjoh_2111-uniprot.txt
      record_section: ["DR:InterPro"]
      supporting_text: InterPro; IPR004564; OM_lipoprot_carrier_LolA-like.
references:
- id: PMID:40050408
  title: LolA and LolB are conserved in Bacteroidota and are crucial for gliding motility and Type IX
    secretion.
  findings:
  - statement: The primary study uses the target UW101 strain and explicitly identifies Fjoh_2111 as LolA1.
    supporting_text: The F. johnsoniae gene identified was Fjoh_2111, which we refer to as lolA1.
  - statement: The native lolA1 mutant has reduced outer-membrane lipoprotein cargo abundance; these are
      membrane proteome measurements, not isolated carrier kinetics.
    supporting_text: GldK and GldJ, two lipoproteins essential for gliding motility and T9 secretion28
      were much less abundant in the OM of the lolA1 and lolB1 mutants than in the WT strain
  - statement: The periplasmic location is inferred from the secretion signal; the paper does not present
      direct LolA1 compartment fractionation.
    supporting_text: All three LolA homologs carry such a signal sequence and are thus likely localized
      in the periplasm.
  - statement: Native complementation restores downstream motility, supporting biological relevance without
      establishing a direct motor function.
    supporting_text: Plasmid-borne complementation of lolA1 and lolB1 deletion with lolA1 and lolB1 fully
      restored gliding motility
  - statement: Cross-species complementation fails in the tested E. coli-to-F. johnsoniae direction, limiting
      assumptions of arbitrary carrier-partner compatibility.
    supporting_text: In trans expression of LolAEc and LolBEc did not restore gliding nor T9 secretion
      of the lolA1 and lolB1 mutants
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Protected full text read, including native strain/locus, deletion and complementation,
      OM proteomics, heterologous complementation and reporter experiments. F. johnsoniae ATCC17061/UW101
      matches the target. Carrier chemistry is supported by a synthesis of target phenotype and specific
      LolA architecture rather than purified target transfer. Location is predicted. No new gliding or
      T9SS process annotation is inferred from necessity.
