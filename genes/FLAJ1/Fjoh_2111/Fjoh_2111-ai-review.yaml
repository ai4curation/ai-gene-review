core_functions:
- description: Inferred periplasmic carriage of lipoproteins supporting their delivery to the outer membrane.
    The specific LolA architecture and native UW101 client-localization phenotypes support this role;
    purified target transfer and direct target compartment fractionation have not been demonstrated in
    the consulted study.
