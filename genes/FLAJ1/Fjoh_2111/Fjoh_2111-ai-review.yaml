  label: Flavobacterium johnsoniae UW101
description: Fjoh_2111 (LolA1) is a LolA-family lipoprotein-trafficking protein of Flavobacterium johnsoniae
  UW101, predicted to act as a soluble periplasmic carrier. It supports delivery of a subset of lipoproteins
  to the outer membrane, including components needed for gliding motility and type IX secretion. Native
  loss of LolA1 reduces the outer-membrane abundance of GldJ and GldK and disrupts these downstream systems.
  Other lipoproteins retain localization without the known LolA/LolB proteins, indicating alternative
  trafficking routes. LolA1 has distinct functional requirements from its pigment-locus paralog LolA2
  and is not freely exchangeable with the E. coli carrier under the tested conditions.
