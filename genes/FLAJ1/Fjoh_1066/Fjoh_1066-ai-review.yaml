  review:
    summary: LolB1 contributes to outer-membrane localization of a subset of lipoproteins.
    action: NEW
    reason: Native UW101 deletion changes outer-membrane client abundance, including GldK/GldJ; complementation
      restores downstream defects. Structural homology and functional-region analysis identify LolB1 as
      a cargo insertion component, rather than a cargo consumed by trafficking. Same-role E. coli and
      P. putida LolB comparators carry this process. This does not imply direct participation in gliding
      or T9 secretion, universal essentiality, or exclusive delivery of all lipoproteins.
    supported_by:
    - reference_id: PMID:40050408
      supporting_text: GldK and GldJ, two lipoproteins essential for gliding motility and T9 secretion28
        were much less abundant in the OM of the lolA1 and lolB1 mutants than in the WT strain
    - reference_id: PMID:40050408
      supporting_text: Plasmid-borne complementation of lolA1 and lolB1 deletion with lolA1 and lolB1
        fully restored gliding motility
