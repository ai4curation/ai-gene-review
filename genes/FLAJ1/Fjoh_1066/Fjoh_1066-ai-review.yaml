  label: Flavobacterium johnsoniae UW101
description: Fjoh_1066 encodes LolB1, a structurally divergent LolB-like lipoprotein in Flavobacterium
  johnsoniae UW101. Native deletion and complementation implicate it in delivery of a subset of lipoproteins
  to the outer membrane, including clients needed for gliding and type IX secretion. Its predicted LolB
  fold, lipoprotein signal and functional loop support an inferred outer-membrane insertion role. These
  studies establish cellular trafficking function rather than a purified-protein insertion reaction. Other
  paralogs and retained lipoprotein localization in strains lacking known LolA/LolB proteins show that
  LolB1 is neither universally essential nor the only delivery route.
