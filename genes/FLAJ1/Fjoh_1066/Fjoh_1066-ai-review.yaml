knowledge_gaps:
- gap_statement: The direct cargo-transfer/insertion reaction and client specificity of LolB1 have not
    been reconstituted by the reported native genetic and proteomic experiments.
  boundary: Native UW101 client-localization defects and complementation establish a trafficking role;
    structural similarity and loop phenotypes motivate the insertion mechanism. Alternative localization
    persists without known LolA/B proteins.
  gap_kind:
  - BIOLOGY
  status: OPEN
