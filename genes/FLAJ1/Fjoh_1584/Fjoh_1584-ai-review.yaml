knowledge_gaps:
- gap_statement: The physiological function and downstream fate of the native C20 ether product in F.
    johnsoniae are unresolved.
  gap_kind:
  - BIOLOGY
  dark_aspect: BP_DARK
  boundary: The substrate-resolved ether-forming reaction is established; it does not establish subsequent
    acetylation, sugar loading, or participation in a complete native lipid-carrier bypass.
  resolution: Identify native lipid products and perturb downstream candidate genes, coupling lipidomics
    to rescue and envelope phenotypes.
  status: OPEN
suggested_questions:
- question: What is the native role of the C20 GGGP product, and which enzymes use it in UW101?
