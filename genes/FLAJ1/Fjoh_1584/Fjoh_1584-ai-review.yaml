- id: PMID:24684232
  title: A comprehensive analysis of the geranylgeranylglyceryl phosphate synthase enzyme family identifies
    novel members and reveals mechanisms of substrate specificity and quaternary structure organization.
  findings:
  - statement: Bacterial group II GGGPS enzymes are distinguished from group I HepGP synthases; target-specific
      experimental detail is in the reviewed record.
    supporting_text: the previously uncharacterized bacterial enzymes from group II have GGGPS activity
      like the archaeal enzymes and differ from the bacterial group I enzymes that are heptaprenylglyceryl
      phosphate synthases.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full publisher text independently read on 2026-11-07; frozen local cache remains abstract-only.
      Figure2 assays comparative donor capacity in a B.subtilis delta-pcrB host, not native donor-species
      downstream pathways. Figure5 distinguishes fjGGGPS I90A from wild type; groupII Mg is modeled, not
      observed density.
