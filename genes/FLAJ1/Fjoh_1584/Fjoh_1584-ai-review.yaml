  label: Flavobacterium johnsoniae UW101
description: Fjoh_1584 encodes the homodimeric geranylgeranylglyceryl phosphate synthase of Flavobacterium
  johnsoniae UW101. This group II TIM-barrel enzyme transfers a C20 geranylgeranyl group to sn-glycerol-1-phosphate
  to form an ether-linked glycerophosphate. The Ile90 side chain helps restrict donor-chain length; replacing
  it with alanine permits heptaprenyl substrate use. The physiological role and downstream fate of the
  native C20 product remain unresolved.
