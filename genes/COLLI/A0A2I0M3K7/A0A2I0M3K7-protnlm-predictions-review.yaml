id: A0A2I0M3K7
gene_symbol: A0A2I0M3K7
taxon:
  id: NCBITaxon:8932
  label: Columba livia
status: COMPLETE
description: >-
  A0A2I0M3K7 is an N-terminally truncated 142-residue gene model of pigeon TRUB2 (PTHR13195:SF0,
  IPR039048) that lacks the catalytic aspartate. The gene carries general pseudouridine synthase activity
  by family membership and the bilaterian TRUB2 PAINT node; tRNA substrate specificity for the TRUB2
  lineage is not established, because human TRUB2 tRNA Psi55 activity is seen in vitro and in
  mitochondrial extracts but not in a cell-wide tRNA pseudouridine map, and PAINT did not propagate it.
