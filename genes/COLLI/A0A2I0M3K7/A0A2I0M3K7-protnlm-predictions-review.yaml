predictions:
  - source_method: ProtNLM2
    source_version: UniProt 2024_06 pilot
    predicted_term:
      id: GO:0106029
      label: tRNA pseudouridine synthase activity
    predicted_term_type: GO_MF
    review:
      assessment: NPI
      error_type: DOMAIN_ARCHITECTURE_MISMATCH
      confidence_score: 0
      summary: >-
        This accession, the exact sequence ProtNLM2 was given, cannot have tRNA pseudouridine synthase
        activity because it lacks the catalytic aspartate that every TruB-family pseudouridine synthase
        activity requires. The 142-residue gene model aligns to human TRUB2 residues 178-307 and has no
        counterpart of human residues 1-177, which contain the active-site nucleophile D98 (equivalent to
        E. coli TruB D48) and most of the Pseudouridine synthase II N-terminal catalytic domain; only
        residues 1-54 of that domain remain (UniProt DOMAIN 1..54). For the gene, GO:0106029 would be a
        novel refinement of the pseudouridine synthase activity (GO:0009982) it already carries, and even
        at gene level a tRNA-specific activity for the TRUB2 lineage is unsettled: recombinant human TRUB2
        has tRNA Psi55 activity (PMID:33023933), but a cell-wide tRNA pseudouridine map found no noticeable
        TRUB2 activity (PMID:41136621), in-cell evidence centres on mitochondrial mRNA sites
        (PMID:27974379), and the bilaterian TRUB2 PAINT node asserts only the general activity.
      supported_by:
        - reference_id: file:COLLI/A0A2I0M3K7/A0A2I0M3K7-uniprot.txt
          supporting_text: >-
            ID   A0A2I0M3K7_COLLI        Unreviewed;       142 AA. ... DR   InterPro; IPR039048; Trub2.
            ... DR   PANTHER; PTHR13195:SF0; PSEUDOURIDYLATE SYNTHASE TRUB2, MITOCHONDRIAL; 1. ... FT   DOMAIN          1..54
            ... FT                   /note="Pseudouridine synthase II N-terminal"
        - reference_id: PMID:33023933
          supporting_text: >-
            all three human recombinant proteins, TRUB1, PUS10, and TRUB2, have Ψ55 synthase activities,
            but differ slightly in their tRNA structural requirements
        - reference_id: PMID:41136621
          supporting_text: >-
            RPUSD3 and TRUB2 do not exhibit noticeable enzymatic activities in human
        - reference_id: PMID:27974379
          supporting_text: >-
            TRUB2/RPUSD3 were similarly involved in pseudouridylating specific residues in mitochondrial
            mRNAs
        - reference_id: file:COLLI/A0A2I0M3K7/A0A2I0M3K7-bioinformatics/RESULTS.md
          supporting_text: >-
            The catalytic aspartate position (human D98) lies outside the region covered by the pigeon
            sequence, so A0A2I0M3K7 lacks the catalytic aspartate.
        - reference_id: file:COLLI/A0A2I0M3K7/A0A2I0M3K7-bioinformatics/RESULTS.md
          supporting_text: >-
            Pigeon Met1 corresponds to human TRUB2 Met178; the pigeon gene model has no counterpart of
            human TRUB2 residues 1-177.
        - reference_id: file:COLLI/A0A2I0M3K7/A0A2I0M3K7-bioinformatics/RESULTS.md
          supporting_text: >-
            E. coli TruB D48 (context HTGALDPLATG) maps to human TRUB2 D98 (context VGHRLDAQASG).
        - reference_id: file:COLLI/A0A2I0M3K7/A0A2I0M3K7-bioinformatics/RESULTS.md
          supporting_text: >-
            PAINT node PTN000324318 does not assert tRNA pseudouridine(55) synthase activity
            (GO:0160148) or mitochondrial tRNA pseudouridine synthesis (GO:0070902), although human
            TRUB2 carries both by IMP (PMID:33023933).
