            ... FT                   /note="Pseudouridine synthase II N-terminal"
        - reference_id: PMID:27974379
          supporting_text: >-
            TRUB2/RPUSD3 were similarly involved in pseudouridylating specific residues in mitochondrial
            mRNAs
