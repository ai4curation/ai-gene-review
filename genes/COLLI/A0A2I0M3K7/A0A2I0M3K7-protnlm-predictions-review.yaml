      label: tRNA pseudouridine synthase activity
    predicted_term_type: GO_MF
    review:
      assessment: UNC
      confidence_score: 1
      summary: >-
        The target has TRUB2-specific family assignments and a partial pseudouridine-synthase architecture
        in only 142 residues. Human TRUB2/RPUSD3 perturbation implicates these proteins in mitochondrial
        mRNA pseudouridylation (PMID:27974379); this does not establish the tRNA-specific activity predicted
        here. Generic pseudouridine synthase activity in the cached annotations is not equivalent to tRNA
        pseudouridine synthase activity. A complete catalytic sequence and evidence for tRNA as a substrate
        are needed, while the available study does not by itself exclude additional tRNA activity.
      supported_by:
