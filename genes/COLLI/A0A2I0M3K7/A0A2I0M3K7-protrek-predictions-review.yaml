id: A0A2I0M3K7
gene_symbol: TRUB2
taxon:
  id: NCBITaxon:8932
  label: Columba livia
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for the pigeon TRUB2 ortholog, a mitochondrial tRNA
  pseudouridine-55 synthase. This is a complete miss: the top five GO calls are RNA
  polymerase III activity and complex, the Plasmodium PTEX translocon, a box C/D snoRNP
  binding term and the t-UTP complex, none of which involves pseudouridine synthesis, and
  the free-text Function channel returns 60S ribosome biogenesis and rRNA modification
  descriptions. Neither the family (TruB pseudouridine synthase) nor the compartment
  (mitochondrial matrix) is recovered anywhere in the top 25, even though the family is
  unambiguously assigned by InterPro (IPR039048) and PANTHER (PTHR13195:SF0) and is
  already annotated in GOA. Two features of the query explain part of it: the deposited
  sequence is only 142 aa - a partial model of a protein that is ~330 aa in mammals - and
  the top-1 score of 12.51 is well below the benchmark median. Both are visible to a user
  before the predictions are trusted.
  Assessment: 0 correct (COR/CNN/LSP), 1 uncertain (UNC), 2 incorrect (NPI).
source_documents:
  - projects/PROTREK_EVALUATION/argo50_protrek_hits.tsv
  - genes/COLLI/A0A2I0M3K7/A0A2I0M3K7-uniprot.txt
  - genes/COLLI/A0A2I0M3K7/A0A2I0M3K7-goa.tsv
predictions:
  - source_method: ProTrek
    source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
    source_reference_id: PMID:41039041
    predicted_term:
      id: GO:0001056
      label: RNA polymerase III activity
    predicted_term_type: GO_MF
    review:
      assessment: NPI
      confidence_score: 0
      error_type: FREQUENCY_BIAS
      summary: >-
        Top-ranked hit (score 12.51). TRUB2 is a standalone pseudouridine synthase, not a
        polymerase subunit; nothing in the TruB fold, in GOA, or in the review supports RNA
        polymerase activity. The retrieval has resolved the query only as far as "acts on
        RNA" and then defaulted to one of the most heavily annotated RNA-enzyme concepts in
        SwissProt. The term is additionally obsolete in the current GO release. Ranks 4 and
        5 continue the same theme (RNA polymerase III complex, t-UTP complex), so the whole
        top five commits to nuclear transcription and ribosome biogenesis for a mitochondrial
        tRNA-modifying enzyme.
      supported_by:
        - reference_id: GO_REF:0000002
          supporting_text: Gene Ontology annotation through InterPro
  - source_method: ProTrek
    source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
    source_reference_id: PMID:41039041
    predicted_term:
      id: GO:0097619
      label: PTEX complex
    predicted_term_type: GO_CC
    review:
      assessment: NPI
      confidence_score: 0
      error_type: TAXON_CONSTRAINT_VIOLATION
      summary: >-
        Rank 2 (score 11.90). The PTEX translocon is a Plasmodium-specific protein-export
        machine at the parasitophorous vacuole membrane. It cannot exist in a bird, and the
        prediction has no relationship to any feature of the sequence. This is the clearest
        example in the benchmark of a low-scoring query producing output that a taxon
        constraint check would reject outright - a filter ProtNLM2's Evidencer applies and
        ProTrek's raw retrieval does not.
      supported_by:
        - reference_id: GO_REF:0000002
          supporting_text: Gene Ontology annotation through InterPro
  - source_method: ProTrek
    source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
    source_reference_id: PMID:41039041
    predicted_term:
      id: GO:0005666
      label: RNA polymerase III complex
    predicted_term_type: GO_CC
    review:
      assessment: UNC
      confidence_score: 1
      summary: >-
        Rank 4 (score 11.36); reviewed in place of rank 3, whose retrieved label ("box C/D
        snoRNP complex binding") does not resolve to any term in the current GO release and
        so cannot be assigned an identifier. As a claim this is wrong for the same reason as
        rank 1 - TRUB2 is not a polymerase subunit - but at a score of 11.4 for a 142-aa
        partial sequence the output is indistinguishable from noise, so it is recorded as
        uncertain rather than as a substantive assertion. Counting the unresolvable rank 3
        and the obsolete rank 1, three of this protein's top five calls cannot be entered
        as annotations at all, the highest ontology-drift rate of any query in the benchmark.
      supported_by:
        - reference_id: GO_REF:0000002
          supporting_text: Gene Ontology annotation through InterPro
