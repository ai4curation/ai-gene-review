    source_reference_id: PMID:41039041
    predicted_term:
      id: GO:0003964
      label: RNA-directed DNA polymerase activity
    predicted_term_type: GO_MF
    review:
      assessment: COR
      confidence_score: 2
      summary: >-
        Rank 2 (score 11.93) and the correct defining activity for an RVT_1-domain protein,
        absent from GOA (which is empty for this entry) and not predicted by ProtNLM2, which
        stopped at DNA binding and integration. Correct and novel, with the standing caveat
        that this is a retrotransposon ORF rather than a host gene, so "function" here means
        the element's activity.
      supported_by:
        - reference_id: file:MYTGA/A0A8B6BFL6/A0A8B6BFL6-uniprot.txt
          supporting_text: Reverse transcriptase domain-containing protein
  - source_method: ProTrek
    source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
    source_reference_id: PMID:41039041
    predicted_term:
      id: GO:0031379
      label: RNA-directed RNA polymerase complex
    predicted_term_type: GO_CC
    review:
      assessment: NPI
      confidence_score: 0
      error_type: PARALOG_OVERANNOTATION
      summary: >-
        Rank 3 (score 11.72), with RNA-dependent RNA polymerase activity behind it at rank 4.
        RdRP is the RNA-virus replicase; a retroelement RT makes DNA from RNA, which is the
        opposite product. The two are frequently discussed together in the same viral-enzyme
        text, and the retrieval does not separate them - the same
        right-neighbourhood-wrong-direction pattern seen with the GEF/GAP and
        5'/3' tRNA-processing confusions elsewhere in this benchmark.
      supported_by:
        - reference_id: file:MYTGA/A0A8B6BFL6/A0A8B6BFL6-uniprot.txt
          supporting_text: Reverse transcriptase domain-containing protein
