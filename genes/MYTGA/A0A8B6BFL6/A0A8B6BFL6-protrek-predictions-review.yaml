predictions:
  - source_method: ProTrek
    source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
    source_reference_id: PMID:41039041
    predicted_term:
      id: GO:0042575
      label: DNA polymerase complex
    predicted_term_type: GO_CC
    review:
      assessment: UNC
      confidence_score: 1
      summary: >-
        Top-ranked hit (score 12.95). Retroelement reverse transcriptases do act within
        virus-like particles rather than as free enzymes, so a complex is not absurd - but
        "DNA polymerase complex" denotes the cellular replicative polymerase holoenzymes, and
        this protein is not part of one. Recorded as uncertain: the compartment claim is the
        right shape and the wrong complex, at a score in the benchmark's lower band.
      supported_by:
        - reference_id: file:MYTGA/A0A8B6BFL6/A0A8B6BFL6-uniprot.txt
          supporting_text: Reverse transcriptase domain-containing protein
