id: A0A8B6BFL6
gene_symbol: A0A8B6BFL6
taxon:
  id: NCBITaxon:32170
  label: Mytilus galloprovincialis
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for a mussel DIRS1-class retrotransposon protein
  carrying reverse transcriptase and RNase H domains. The protein has no GOA annotations.
  ProTrek recovers the defining catalytic activity at rank 2 (RNA-directed DNA polymerase
  activity) and the integration step at rank 5, but its top call assigns the protein to a
  DNA polymerase complex and rank 3 offers an RNA-directed RNA polymerase complex - the
  viral replicase machinery, a different enzyme class. Scores drop sharply through the
  list (12.95 to 9.77), and the free-text channel is weak here too (11.15), so this sits
  in the benchmark's lower-confidence band. ProtNLM2 on the same protein returned DNA
  binding, DNA recombination and DNA integration, all defensible for a retroelement, but
  missed the reverse transcriptase activity that ProTrek found.
  Assessment: 1 correct novel (COR), 1 uncertain (UNC), 1 incorrect (NPI).
source_documents:
  - projects/PROTREK_EVALUATION/argo50_protrek_hits.tsv
