      label: retrotransposition
  supported_by:
    - reference_id: file:MYTGA/A0A8B6BFL6/A0A8B6BFL6-uniprot.txt
      supporting_text: "CDD; cd09275; RNase_HI_RT_DIRS1; 1."
    - reference_id: PMID:32170321
      supporting_text: "These comprise, next to the name-giving YR, a putative GAG protein (GAG), a reverse transcriptase (RT) and an RNase H (RH)."
  knowledge_gaps:
    - gap_statement: >-
        Whether the RNase H domain retains all catalytic carboxylates and is active is
        unknown.
      boundary: >-
        cd09275 assignment and alignment to the DIRS-1 RNase H region, with one candidate SDA
        motif at 463.
      gap_kind:
        - BIOLOGY
suggested_questions:
  - question: >-
      Is this protein encoded by an intact DIRS-type element (with GAG and tyrosine
      recombinase ORFs and inverted terminal repeats at the locus), or by a degraded copy?
  - question: >-
      Should DIRS-type RT-RNase H proteins be separated from hepadnavirus polymerases at the
      subfamily level in PANTHER, given that PTHR33050:SF7 currently groups them together?
  - question: >-
      Is there evidence of recent retrotransposition activity for this element in
      the M. galloprovincialis population, such as polymorphic insertions?
suggested_experiments:
  - description: >-
      Express and purify the RT-RNase H region and test RNA-dependent DNA polymerase and
      RNase H activities in vitro (primer extension on an RNA template; cleavage of a
      labelled RNA-DNA hybrid), with a YLDD-to-YLAA mutant as a control.
  - description: >-
      Perform RNA-seq across tissues and developmental stages to determine whether
      the encoding retrotransposon is transcriptionally active.
  - description: >-
      Annotate the genomic locus to test for companion GAG and tyrosine recombinase ORFs, and
      build a phylogeny of the RT domain with classified DIRS, PAT, Ngaro and VIPER elements.
