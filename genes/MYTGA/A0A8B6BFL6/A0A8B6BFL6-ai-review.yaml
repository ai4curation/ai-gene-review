- id: PMID:32170321
  title: DIRS retrotransposons amplify via linear, single-stranded cDNA intermediates.
  findings:
    - statement: >-
        DIRS elements are retrotransposons that use a tyrosine recombinase instead of an
        integrase or endonuclease. They encode GAG, RT, RNase H and YR functions.
      supporting_text: "These comprise, next to the name-giving YR, a putative GAG protein (GAG), a reverse transcriptase (RT) and an RNase H (RH)."
