id: A0A8B6BFL6
gene_symbol: A0A8B6BFL6
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:29158
  label: Mytilus galloprovincialis
description: >-
  A0A8B6BFL6 (ORF MGAL_10B073878) is a predicted 612-residue protein of the Mediterranean
  mussel Mytilus galloprovincialis encoded by a DIRS-type (tyrosine recombinase)
  retrotransposon. It consists of a reverse transcriptase (RT) domain (residues ~174-349,
  with an intact YLDD polymerase motif C) followed by a DIRS1-type RNase H domain, preceded by
  an N-terminal region of unknown function. It belongs to PANTHER subfamily PTHR33050:SF7,
  together with the RT-RNase H protein encoded by ORF2 of the Dictyostelium DIRS-1 element,
  which it aligns with across both domains. It also shares more distant similarity with the
  hepadnavirus polymerases in the same subfamily. In DIRS elements, cDNA synthesis is carried
  out by the RT-RNase H protein, while integration is carried out by a separately encoded
  tyrosine recombinase. This protein contains no recombinase domain. Its expected role is
  therefore reverse transcription of the element RNA (RNA-directed DNA polymerase activity
  with associated RNase H degradation of the RNA template) during retrotransposition. No
  experimental characterisation of the mussel protein exists, and it is unknown whether the
  encoding element is intact or mobile.
