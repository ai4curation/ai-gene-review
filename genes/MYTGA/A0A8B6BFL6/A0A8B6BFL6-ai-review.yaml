    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text cached. It characterises the Dictyostelium DIRS-1 element, whose ORF2
      RT-RNase H protein (O96849/Q23898) is in the same PANTHER subfamily (PTHR33050:SF7)
      as A0A8B6BFL6. It is evidence for the DIRS RT role and for the YR being a separate
