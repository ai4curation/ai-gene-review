core_functions:
- description: >-
    Reverse transcription of the DIRS-type element RNA. The RT domain (with intact YLDD motif
    C) synthesises cDNA on an RNA template, which is the copying step of the element's
    retrotransposition cycle. The function is inferred from domain architecture, an intact
    polymerase motif, and membership of PTHR33050:SF7 alongside the Dictyostelium DIRS-1 ORF2
    RT, which element-level genetics shows supplies the RT activity for DIRS-1 mobility.
    Integration is not assigned to this protein, because DIRS elements perform it with a
    separately encoded tyrosine recombinase.
