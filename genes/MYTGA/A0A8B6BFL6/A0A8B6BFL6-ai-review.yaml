  knowledge_gaps:
    - gap_statement: >-
        No biochemical assay has shown reverse transcriptase activity for this protein, and
        it is unknown whether the encoding mussel element is transcribed or mobile.
      boundary: >-
        Domain architecture, an intact YLDD motif and subfamily placement with DIRS-1 ORF2
        support RT activity by homology only.
      gap_kind:
        - BIOLOGY
- description: >-
    RNase H degradation of the RNA strand of the RNA-DNA hybrids formed during reverse
    transcription. This is inferred from the DIRS1-type RNase H domain (CDD cd09275), which
    aligns with the RNase H region of DIRS-1 ORF2 and has a candidate first catalytic
    carboxylate. It is weaker than the RT inference, because the catalytic DEDD set has not
    been mapped residue by residue.
  molecular_function:
    id: GO:0004523
    label: RNA-DNA hybrid ribonuclease activity
  directly_involved_in:
