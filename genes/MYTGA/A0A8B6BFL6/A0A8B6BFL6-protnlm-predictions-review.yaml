          supporting_text: >-
            ID   A0A8B6BFL6_MYTGA        Unreviewed;       612 AA. ... FT   DOMAIN          174..349 ...
            FT                   /note="Reverse transcriptase"
        - reference_id: file:MYTGA/A0A8B6BFL6/A0A8B6BFL6-bioinformatics/RESULTS-rereview.md
          supporting_text: "RT motif C (Y-x-D-D): `YLDD` at 300-303, inside the Pfam RVT_1 domain (174-349)."
        - reference_id: PMID:32170321
          supporting_text: "indicated that the endogenous DIRS-1 reverse transcriptase can act in trans"
  - source_method: ProtNLM2
    source_version: UniProt 2024_06 pilot
    predicted_term:
      id: GO:0006310
      label: DNA recombination
    predicted_term_type: GO_BP
    review:
      assessment: NPI
      confidence_score: 0
      error_type: DOMAIN_ARCHITECTURE_MISMATCH
      summary: >-
        GOA has no annotations for this accession. The recombination step of DIRS-type elements is the
        site-specific recombination by which the element-encoded tyrosine recombinase (YR) integrates the
        circular cDNA intermediate. In DIRS-1 the YR is a separate ORF from the RT-RNase H protein, and
        A0A8B6BFL6 has no recombinase domain and no detectable similarity to the DIRS-1 YR (z = -0.7
        against shuffled controls). This protein's contribution is the reverse transcription that produces
        the cDNA; supplying the substrate of recombination is not performing it. The gene review assigns
        reverse transcription within retrotransposition and deliberately withholds DNA recombination on
        these grounds. A role in a YR-containing complex has not been reported and is not suggested by the
        sequence.
      supported_by:
        - reference_id: PMID:26104693
          supporting_text: "Site-specific recombination is believed to integrate the circle without creating duplications of the target sites."
        - reference_id: PMID:32170321
          supporting_text: "These comprise, next to the name-giving YR, a putative GAG protein (GAG), a reverse transcriptase (RT) and an RNase H (RH)."
        - reference_id: file:MYTGA/A0A8B6BFL6/A0A8B6BFL6-bioinformatics/RESULTS-rereview.md
          supporting_text: "The target has no detectable similarity to the DIRS-1 tyrosine recombinase."
  - source_method: ProtNLM2
    source_version: UniProt 2024_06 pilot
    predicted_term:
      id: GO:0015074
      label: DNA integration
    predicted_term_type: GO_BP
    review:
      assessment: NPI
      confidence_score: 0
      error_type: DOMAIN_ARCHITECTURE_MISMATCH
      summary: >-
        GOA has no annotations for this accession. DIRS-type elements are defined by a tyrosine
        recombinase in place of an integrase or endonuclease, and that recombinase mediates genomic
        integration of the element. A0A8B6BFL6 is the RT-RNase H protein: it has no integrase or
        recombinase domain, and it does not align with the DIRS-1 tyrosine recombinase. The RT generates the
        cDNA that is integrated, which makes it necessary for integration but does not make it a performer
        of the integration step. The gene review assigns this protein to retrotransposition through reverse
        transcription and explicitly withholds DNA integration because the step belongs to the separate
        recombinase.
      supported_by:
        - reference_id: PMID:32170321
          supporting_text: "As this name suggests, the group is characterized by the presence of tyrosine recombinases instead of an integrase (INT) or endonuclease (13,14). Usually, these enzymes mediate site-specific genomic integration of retrotransposons (15)."
        - reference_id: file:MYTGA/A0A8B6BFL6/A0A8B6BFL6-bioinformatics/RESULTS-rereview.md
          supporting_text: "Because DIRS elements encode the YR as a separate ORF, this protein is not expected to carry recombinase or integration activity itself."
