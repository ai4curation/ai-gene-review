  - source_method: ProtNLM2
    source_version: UniProt 2024_06 pilot
    predicted_term:
      id: GO:0006310
      label: DNA recombination
    predicted_term_type: GO_BP
    review:
      assessment: UNC
      confidence_score: 1
      summary: >-
        GOA has no annotations for this accession. The recombination step of DIRS-type elements is the
        site-specific recombination by which the element-encoded tyrosine recombinase (YR) integrates the
        circular cDNA intermediate. In DIRS-1 the YR is a separate ORF from the RT-RNase H protein, and
        A0A8B6BFL6 has no recombinase domain and no detectable similarity to the DIRS-1 YR (z = -0.7
        against shuffled controls), so it cannot perform the strand-exchange chemistry. That does not
        refute participation in the process: the protein makes the cDNA that is recombined, the enzyme
        that converts the single-stranded circle to the double-stranded recombination substrate has not
        been identified, and a scaffolding or binding contribution to a YR-containing complex has neither
        been shown nor excluded. With no positive refutation and no evidence of participation, the
        prediction is uncertain. The gene review assigns this protein to reverse transcription within
        retrotransposition and does not annotate DNA recombination.
      supported_by:
        - reference_id: PMID:26104693
          supporting_text: "Site-specific recombination is believed to integrate the circle without creating duplications of the target sites."
        - reference_id: PMID:32170321
          supporting_text: "These comprise, next to the name-giving YR, a putative GAG protein (GAG), a reverse transcriptase (RT) and an RNase H (RH)."
        - reference_id: PMID:32170321
          supporting_text: "The resulting single-stranded circular DNA would then be converted to a double-stranded circular DNA, which would be ready to be incorporated into the genome by means of the DIRS-1-encoded YR activity."
        - reference_id: file:MYTGA/A0A8B6BFL6/A0A8B6BFL6-bioinformatics/RESULTS-rereview.md
          supporting_text: "The target has no detectable similarity to the DIRS-1 tyrosine recombinase."
  - source_method: ProtNLM2
    source_version: UniProt 2024_06 pilot
    predicted_term:
      id: GO:0015074
      label: DNA integration
    predicted_term_type: GO_BP
    review:
      assessment: UNC
      confidence_score: 1
      summary: >-
        GOA has no annotations for this accession. DIRS-type elements are defined by a tyrosine
        recombinase in place of an integrase or endonuclease, and that recombinase mediates genomic
        integration of the element. A0A8B6BFL6 is the RT-RNase H protein: it has no integrase or
        recombinase domain and does not align with the DIRS-1 tyrosine recombinase, so it does not
        catalyse the joining step. The RT generates the cDNA that is integrated, which establishes
        necessity rather than participation. An accessory role, such as completing the double-stranded
        circular substrate or acting in a pre-integration complex with the recombinase, has not been
        tested in any DIRS element and is not excluded by the sequence. The prediction therefore rests on
        missing evidence rather than refutation and is uncertain. The gene review assigns this protein to
        retrotransposition through reverse transcription and does not annotate DNA integration.
      supported_by:
        - reference_id: PMID:32170321
          supporting_text: "As this name suggests, the group is characterized by the presence of tyrosine recombinases instead of an integrase (INT) or endonuclease (13,14). Usually, these enzymes mediate site-specific genomic integration of retrotransposons (15)."
        - reference_id: PMID:32170321
          supporting_text: "The resulting single-stranded circular DNA would then be converted to a double-stranded circular DNA, which would be ready to be incorporated into the genome by means of the DIRS-1-encoded YR activity."
        - reference_id: file:MYTGA/A0A8B6BFL6/A0A8B6BFL6-bioinformatics/RESULTS-rereview.md
          supporting_text: "Because DIRS elements encode the YR as a separate ORF, this protein is not expected to carry recombinase or integration activity itself."
