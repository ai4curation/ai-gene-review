    source_version: UniProt 2024_06 pilot
    predicted_term:
      id: GO:0003677
      label: DNA binding
    predicted_term_type: GO_MF
    review:
      assessment: COR
      confidence_score: 2
      summary: >-
        GOA has no annotations for this accession, so the term is novel. The protein has a Pfam RVT_1
        reverse-transcriptase domain (174-349) with an intact YLDD motif C and aligns continuously with
        the Dictyostelium DIRS-1 ORF2 RT-RNase H in the same PANTHER subfamily (PTHR33050:SF7), whose RT
        is shown genetically to supply cDNA synthesis for DIRS-1 retrotransposition. RNA-directed DNA
        polymerase activity extends a DNA primer strand on an RNA template, so DNA engagement is an
        inherent part of the inferred catalysis. GO:0003677 is not an ancestor of GO:0003964
        RNA-directed DNA polymerase activity (OLS4), so LSP does not apply, although DNA binding is a
        minimally informative description of an enzyme whose DNA contact is with its own substrate. The
        support is a family transfer with an intact motif, not an assay of the mussel protein.
      supported_by:
