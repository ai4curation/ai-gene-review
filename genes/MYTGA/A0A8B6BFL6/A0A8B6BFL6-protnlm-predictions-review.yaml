id: A0A8B6BFL6
gene_symbol: A0A8B6BFL6
taxon:
  id: NCBITaxon:29158
  label: Mytilus galloprovincialis
status: COMPLETE
description: >-
  A0A8B6BFL6 is the RT-RNase H protein of a DIRS-type (tyrosine recombinase) retrotransposon in
  Mytilus galloprovincialis. It has a reverse-transcriptase domain (174-349) with an intact YLDD motif C
  and a DIRS1-type RNase H domain, and it aligns with the Dictyostelium DIRS-1 ORF2 RT-RNase H in
  PANTHER PTHR33050:SF7. GOA carries no annotations for this accession. The DNA binding prediction is a
  correct but broad consequence of reverse transcription on a DNA primer (COR). The DNA recombination and
  DNA integration predictions are unresolved (UNC): in DIRS elements the strand-exchange step that
  integrates the cDNA is attributed to the separately encoded tyrosine recombinase, and this protein has
  no recombinase or integrase domain and no similarity to the DIRS-1 recombinase, but an accessory role
  of the RT-RNase H protein in preparing or delivering the integration substrate is neither shown nor
  excluded. Its established process role is reverse transcription within retrotransposition.
