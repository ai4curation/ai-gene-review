id: A0A8B6BFL6
gene_symbol: A0A8B6BFL6
taxon:
  id: NCBITaxon:29158
  label: Mytilus galloprovincialis
status: COMPLETE
description: >-
  A0A8B6BFL6 is the RT-RNase H protein of a DIRS-type (tyrosine recombinase) retrotransposon in
  Mytilus galloprovincialis. It has a reverse-transcriptase domain (174-349) with an intact YLDD motif C
  and a DIRS1-type RNase H domain, and it aligns with the Dictyostelium DIRS-1 ORF2 RT-RNase H in
  PANTHER PTHR33050:SF7. GOA carries no annotations for this accession. The DNA binding prediction is a
  correct but broad consequence of reverse transcription on a DNA primer (COR). The DNA recombination and
  DNA integration predictions are refuted for this protein (NPI): in DIRS elements both steps are carried
  out by the separately encoded tyrosine recombinase, and this protein has no recombinase or integrase
  domain and no similarity to the DIRS-1 recombinase. Its process role is reverse transcription within
  retrotransposition.
