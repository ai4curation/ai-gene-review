  - genes/MYTGA/A0A8B6GS20/A0A8B6GS20-uniprot.txt
  - genes/MYTGA/A0A8B6GS20/A0A8B6GS20-goa.tsv
  - publications/PMID_22647598.md
  - publications/PMID_14565969.md
  - genes/MYTGA/A0A8B6GS20/A0A8B6GS20-bioinformatics/RESULTS-rereview.md
  - genes/MYTGA/A0A8B6GS20/A0A8B6GS20-ai-review.yaml
