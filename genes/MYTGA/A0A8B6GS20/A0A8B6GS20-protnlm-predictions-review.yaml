predictions:
  - source_method: ProtNLM2
    source_version: UniProt 2024_06 pilot
    predicted_term:
      id: GO:0004438
      label: phosphatidylinositol-3-phosphate phosphatase activity
    predicted_term_type: GO_MF
    review:
      assessment: NPI
      confidence_score: 0
      summary: >-
        The prediction is an intrinsic lipid 3-phosphatase activity, which is not among the gene's GOA
        annotations. A0A8B6GS20 is a partial MTMR9-type gene model whose myotubularin-like region
        (residues 362-607) aligns to the C-terminal part of human MTMR9 and is placed in PANTHER
        PTHR10807:SF73 with C. elegans MTM-9, which is described experimentally as phosphatase-inactive.
        The retained CX5R-equivalent P-loop reads VHGSEGFDTT, with Gly at the catalytic Cys position and
        Thr at the Arg position, the same kind of substitution seen in human MTMR9 and worm MTM-9. PAINT
        records the loss of GO:0004438 (and GO:0106018) by IRD NOT rows at the MTMR9 clade node
        PTN000086907, and the gene review treats the protein as a noncatalytic regulatory subunit that
        binds and activates an active myotubularin partner. MTMR9-family proteins raise partner
        3-phosphatase output without catalysis themselves (PMID:22647598), so participation in
        phosphatidylinositol dephosphorylation is supported while the predicted intrinsic activity is not.
        This is a catalytic activity transferred to a fold-retaining pseudophosphatase.
      error_type: PSEUDOENZYME_OVERANNOTATION
      supported_by:
        - reference_id: file:MYTGA/A0A8B6GS20/A0A8B6GS20-uniprot.txt
          supporting_text: >-
            ID   A0A8B6GS20_MYTGA        Unreviewed;       607 AA. ... DR   InterPro; IPR010569; Myotubularin-like_Pase_dom.
            ... DR   PANTHER; PTHR10807:SF73; LD06050P; 1. ... DR   PANTHER; PTHR10807; MYOTUBULARIN-RELATED;
            1. ... FT   DOMAIN          372..544 ... FT                   /note="Myotubularin phosphatase"
        - reference_id: PMID:22647598
          supporting_text: >-
            inactive because they lack the conserved cysteine residue
        - reference_id: file:MYTGA/A0A8B6GS20/A0A8B6GS20-bioinformatics/RESULTS-rereview.md
          supporting_text: >-
            The target has Gly at the Cys position and Thr at the Arg position. Human MTMR9 (IHGTEGTDST) and
            worm MTM-9 (IHGGDGLDST) carry the same kind of substitution. So the retained region has the
            MTMR9-type inactive site.
        - reference_id: PMID:14565969
          supporting_text: >-
            the phosphatase-inactive MTM-9 protein is also predominantly localized to the coelomocyte cytoplasm
        - reference_id: file:MYTGA/A0A8B6GS20/A0A8B6GS20-hypotheses/prediction-pi3p-phosphatase/openscientist.md
          supporting_text: >-
            This is the signature of a **catalytically dead myotubularin pseudophosphatase** and directly
            refutes the GO:0004438 prediction.
