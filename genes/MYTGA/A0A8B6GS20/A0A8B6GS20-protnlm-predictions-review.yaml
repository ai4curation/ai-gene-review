    review:
      assessment: NPI
      confidence_score: 0
      summary: >-
        The target has a myotubularin-like phosphatase domain at residues 372–544, but this interval contains
        no CX5R catalytic motif. Experiments on MTMR complexes distinguish active phosphatases from inactive
        family members that lack the catalytic cysteine and regulate their partners (PMID:22647598). This
        sequence-level deficiency argues against the predicted intrinsic PI3P phosphatase activity even
        though the protein could influence phosphoinositide metabolism through a partner. The unusual
        N-terminal domain arrangement and exact MTMR paralog identity remain unresolved; the activity
        judgment does not depend on calling the target MTMR9.
