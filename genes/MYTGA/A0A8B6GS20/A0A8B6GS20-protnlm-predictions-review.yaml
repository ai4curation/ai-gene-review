id: A0A8B6GS20
gene_symbol: A0A8B6GS20
taxon:
  id: NCBITaxon:29158
  label: Mytilus galloprovincialis
status: COMPLETE
description: >-
  ProtNLM2 (UniProt 2024_06 pilot) emitted one GO prediction for this partial MTMR9-type gene model,
  phosphatidylinositol-3-phosphate phosphatase activity (GO:0004438). It is refuted: the retained
  phosphatase-like region carries the MTMR9-type inactive site (Gly and Thr at the catalytic Cys and
  Arg positions), the protein sits in PANTHER subfamily SF73 with the phosphatase-inactive C. elegans
  MTM-9, and PAINT negates this activity at the MTMR9 clade node.
