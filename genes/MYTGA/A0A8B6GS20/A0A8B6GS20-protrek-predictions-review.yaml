id: A0A8B6GS20
gene_symbol: MTMR9
taxon:
  id: NCBITaxon:32170
  label: Mytilus galloprovincialis
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for mussel MTMR9, a myotubularin-family
  pseudophosphatase that lacks the catalytic cysteine of the CX5R motif and works as a
  scaffold for the active MTMR6/7/8 enzymes. The GO channel returns four phosphoinositide
  phosphatase activities in its top four - the ancestral catalytic function the protein
  has lost - repeating the exact error ProtNLM2 made on this protein, which the
  ARGO-ProtNLM-50 evaluation flagged as its clearest paralog/pseudoenzyme failure. What
  makes this case sharp is that ProTrek's own free-text Function channel gets it right at
  rank 1, returning "Probably acts as an adapter for other myotubularin-like phosphatases".
  The information needed for the correct call is inside the model; the GO index does not
  let it out, because the SwissProt GO annotations for this family are catalytic and the
  scaffolding role is expressed only in prose.
  Assessment: 0 correct (COR/CNN/LSP), 0 uncertain (UNC), 3 incorrect (PLI).
source_documents:
  - projects/PROTREK_EVALUATION/argo50_protrek_hits.tsv
  - genes/MYTGA/A0A8B6GS20/A0A8B6GS20-uniprot.txt
