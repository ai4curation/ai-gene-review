predictions:
  - source_method: ProTrek
    source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
    source_reference_id: PMID:41039041
    predicted_term:
      id: GO:0004438
      label: phosphatidylinositol-3-phosphate phosphatase activity
    predicted_term_type: GO_MF
    review:
      assessment: PLI
      confidence_score: 0
      error_type: PSEUDOENZYME_OVERANNOTATION
      summary: >-
        Top-ranked hit (score 16.26) and, term for term, the same prediction ProtNLM2 made.
        MTMR9 is catalytically dead: the CX5R catalytic cysteine is absent, which is why
        UniProt itself flags the family membership as "non-catalytic". Its function is to
        heterodimerise with MTMR6/7/8 and control their localisation and specificity, which
        this review records as protein phosphatase binding. Two independent models
        converging on the same wrong catalytic call is a useful negative result: neither
        sequence-similarity retrieval nor seq2seq naming can detect a missing active-site
        residue, so pseudoenzymes need a separate check.
      supported_by:
        - reference_id: GO_REF:0000117
          supporting_text: Automatic annotation from ARBA rules
