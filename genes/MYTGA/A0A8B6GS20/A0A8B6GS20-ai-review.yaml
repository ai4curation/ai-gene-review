- id: PMID:16787938
  title: 'Systematic analysis of myotubularins: heteromeric interactions, subcellular localisation
    and endosome related functions.'
  findings:
  - statement: >-
      Myotubularins are lipid phosphatases; inactive members pair with active ones (MTMR8 with
      MTMR9).
  reference_review:
