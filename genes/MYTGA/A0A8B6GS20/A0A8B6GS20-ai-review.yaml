- id: file:MYTGA/A0A8B6GS20/A0A8B6GS20-deep-research-falcon.md
  title: Deep research report on MTMR9 in Mytilus galloprovincialis
  findings:
  - statement: >-
      MTMR9 is a catalytically inactive pseudophosphatase that lacks the
      catalytic cysteine in the CX5R motif
  - statement: >-
      MTMR9 forms heterodimeric complexes with MTMR6, MTMR7, and MTMR8,
      modulating their localization and substrate specificity
  - statement: >-
      MTMR9 recruits MTMR6 and MTMR8 to the intermediate compartment and
      Golgi apparatus, sustaining Golgi integrity and ER-to-Golgi transport
  - statement: >-
      No direct experimental data exist for A0A8B6GS20 in Mytilus
      galloprovincialis; all functional annotations are inferred from
      orthologous proteins in model organisms
  reference_review:
    relevance: LOW
    correctness: UNVERIFIED
    review_notes: >-
      Family-level literature summary that does not analyse the domain architecture of this
      gene model (D8C_UMOD fusion, missing GRAM and N-terminal phosphatase half). It is kept for
      provenance but is no longer cited as support; primary papers and the re-review sequence
      analysis are cited instead.
- id: file:MYTGA/A0A8B6GS20/A0A8B6GS20-bioinformatics/RESULTS-rereview.md
  title: A0A8B6GS20 architecture and identity check (2026-10-21 re-review)
  findings:
  - statement: >-
      Only residues 362-588 align to human MTMR9 (residues 313-542). Residues 1-361 are
      D8C_UMOD-type repeats; the model is a partial/fused MTMR9 gene model.
  - statement: >-
      The retained phosphatase-like region carries the MTMR9-type inactive motif VHGSEGFDTT,
      with Gly and Thr at the positions of the MTMR6 catalytic Cys and Arg.
  - statement: >-
      The full-length M. galloprovincialis MTMR9-type models from ORF MGAL_10B079678 are 97.2%
      identical over the shared C-terminal 246 residues.
- id: PMID:22647598
  title: Myotubularin-related protein (MTMR) 9 determines the enzymatic activity, substrate specificity,
    and role in autophagy of MTMR8.
  findings:
  - statement: >-
      MTMR9 dimerises with MTMR6, MTMR7 and MTMR8, increases their 3-phosphatase activity and
      sets substrate preference; the MTMR8/R9 complex inhibits autophagy.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only cache; quotes verified against the cached abstract. Human proteins.
