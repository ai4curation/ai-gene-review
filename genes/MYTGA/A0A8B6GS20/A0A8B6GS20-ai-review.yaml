taxon:
  id: NCBITaxon:29158
  label: Mytilus galloprovincialis
description: >-
  A0A8B6GS20 (ORF MGAL_10B089004) is a partial gene model from the Mediterranean mussel
  genome. Its C-terminal 246 residues belong to a myotubularin-related protein 9 (MTMR9)-type
  pseudophosphatase, placed in PANTHER subfamily PTHR10807:SF73 with Caenorhabditis elegans
  MTM-9. Its first ~360 residues are three D8C_UMOD-like cysteine-rich repeats of a kind found in
  extracellular proteins and unrelated to myotubularins. The retained myotubularin region covers
  only the C-terminal half of the phosphatase-like domain and the C-terminal region. It carries
  the MTMR9-type inactive site, with glycine at the catalytic cysteine position of the CX5R motif
  and threonine at the arginine position. The PH-GRAM domain and the N-terminal half of the
  phosphatase-like fold are absent. A full-length MTMR9-type model (ORF MGAL_10B079678) exists
  in the same genome and is 97% identical over the shared region. MTMR9-family proteins are
  catalytically inactive partners of active myotubularin 3-phosphatases (MTMR6/7/8 in mammals,
  MTM-6 in nematodes). They bind the active partner, stabilise it and raise its
  phosphatidylinositol 3-phosphate and phosphatidylinositol 3,5-bisphosphate 3-phosphatase
  output in the cytoplasm. Through that complex they act in endosomal trafficking. No
  experiments have been reported for the mussel protein, and the product encoded by this
  particular model is unlikely to fold as a complete MTMR9 protein.
existing_annotations:
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: located_in
  review:
    summary: >-
      TreeGrafter transfer from the MTMR9 clade node PANTHER:PTN000086907. MTMR9-family
      proteins are cytoplasmic, membrane-associated partners of active myotubularins. In the
      mammalian studies they relocalise with active partners, and in C. elegans MTM-9 acts with
      MTM-6 in endocytic traffic. The A0A8B6GS20 model carries extracellular-type D8C_UMOD
      repeats at its N-terminus, which probably come from a gene-model fusion and do not argue
      against cytoplasmic localisation of the mussel MTMR9 gene product. Cytoplasm is as precise
      as the phylogenetic evidence allows for this species.
    action: ACCEPT
    reason: >-
      Cytoplasmic localisation is conserved across the MTMR9 clade. That clade includes the
      worm protein in this PANTHER subfamily (SF73), and the endocytic-pathway work places
      MTM-9 in the cytoplasm. The target's MTMR9-homologous region is the clade member.
      Gene-model caveat: the N-terminal D8C_UMOD region of this model is not part of an MTMR9
      protein.
    supported_by:
    - reference_id: PMID:14565969
      supporting_text: >-
        We demonstrate that MTM-6 and MTM-9 function as part of a complex to
        regulate an endocytic pathway that involves the Arf6 GTPase
    - reference_id: file:MYTGA/A0A8B6GS20/A0A8B6GS20-bioinformatics/RESULTS-rereview.md
      supporting_text: >-
        A0A8B6GS20 (ORF MGAL_10B089004) is a partial MTMR9 gene model.
- term:
    id: GO:0010507
    label: negative regulation of autophagy
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  review:
    summary: >-
      The underlying IBA rests on one donor, human MTMR9. In human cells the MTMR8-MTMR9
      complex lowered PtdIns(3)P and inhibited autophagy. The node placement is a legitimate
      PAINT judgement and is not challenged on donor count. The biology behind it is narrower
      than the clade, though. The autophagy effect was shown for the pairing with MTMR8, a
      member of the vertebrate MTMR6/7/8 expansion. Invertebrates have a single MTM-6-type
      partner, and the C. elegans MTM-6/MTM-9 work describes endocytic traffic and Wnt-carrier
      recycling, not autophagy. It is a regulatory outcome of the partner phosphatase's
      PtdIns(3)P turnover, so it sits downstream of the core activity.
    action: KEEP_AS_NON_CORE
    reason: >-
      The term is supported for vertebrate MTMR9 with MTMR8. For a mollusc it is a plausible but
      untested regulatory consequence of partner-phosphatase activation. It is peripheral to the
      core function, which is partner binding and activation of a 3-phosphatase. The fragmentary
      gene model adds uncertainty for this accession.
    supported_by:
    - reference_id: PMID:22647598
      supporting_text: >-
        the MTMR8/R9 complex reduces cellular
        PtdIns(3)P levels. Consequentially, the MTMR6/R9 complex serves to inhibit
        stress-induced apoptosis and the MTMR8/R9 complex inhibits autophagy.
    - reference_id: PMID:21076391
      supporting_text: >-
        We conclude that regulation of
        endosomal trafficking by the MTM-6/MTM-9 myotubularin complex is required for
        the retromer-dependent recycling of MIG-14/Wls and Wnt secretion.
- term:
    id: GO:0019903
    label: protein phosphatase binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: enables
  review:
    summary: >-
      Partner binding is the central activity of MTMR9-family proteins. They heterodimerise
      with active myotubularins (MTMR6, MTMR7 and MTMR8 in human; MTM-6 in C. elegans). Those
      partners are lipid 3-phosphatases acting on PtdIns(3)P and PtdIns(3,5)P2, not
      phosphoprotein phosphatases. GO:0019903 is defined as binding to a protein phosphatase,
      so the bound partner does not strictly fit it. The parent term phosphatase binding
      (GO:0019902) describes the interaction accurately. The human MTMR9 review left the same
      partner-class question UNDECIDED. The target keeps the C-terminal region of MTMR9
      (human residues 313-542), so the region needed for partner association is plausibly
      present even in this partial model.
    action: MODIFY
    reason: >-
      The interaction is real and core, but the partner is a lipid phosphatase, so the right
      level is the parent GO:0019902 phosphatase binding. Phosphatase activator activity
      (GO:0019211, human EXP) was not propagated by PAINT to the clade node and is not
      proposed here.
    proposed_replacement_terms:
    - id: GO:0019902
      label: phosphatase binding
    supported_by:
