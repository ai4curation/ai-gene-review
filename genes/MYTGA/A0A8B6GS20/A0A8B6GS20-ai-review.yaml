      are myotubularin lipid phosphatases that function as a complex to
      dephosphorylate phosphatidylinositol-3-phosphate
suggested_questions:
- question: >-
    Is MGAL_10B089004 a haplotig-derived partial copy of the MTMR9 gene MGAL_10B079678, or a
    real partial duplicate fused to D8C_UMOD exons? If it is an assembly or annotation artefact,
    should UniProt merge or flag the entry?
- question: >-
    PANTHER places C. elegans MTM-9 and this mussel protein in SF73 and vertebrate MTMR9 in
    SF56. Is the split only taxonomic, or does it mark a functional difference in partner
    choice (single MTM-6-type partner vs the vertebrate MTMR6/7/8 set)?
suggested_experiments:
- description: >-
    Use RT-PCR or long-read transcript evidence across the junction between the D8C_UMOD
    repeats and the MTMR9 region of MGAL_10B089004 to find out whether a fused transcript
    exists in mussel tissues.
