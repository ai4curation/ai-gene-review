- id: PMID:21076391
  title: Wnt signalling requires MTM-6 and MTM-9 myotubularin lipid-phosphatase function in Wnt-producing
    cells.
  findings:
  - statement: >-
      The MTM-6/MTM-9 complex dephosphorylates PI3P and regulates MIG-14/Wls recycling in Wnt-producing
      cells.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only cache. C. elegans proteins in the target's PANTHER subfamily.
core_functions:
- description: >-
    Noncatalytic MTMR9-type subunit of a myotubularin phosphatase complex. It binds an active
    myotubularin 3-phosphatase, stabilises it and raises its activity toward
    phosphatidylinositol 3-phosphate and phosphatidylinositol 3,5-bisphosphate in the
    cytoplasm. This is inferred for the mussel MTMR9 gene from PANTHER subfamily SF73 (with
    C. elegans MTM-9) and from the conserved MTMR9-type inactive site. This partial gene model
    keeps only the C-terminal ~45% of the protein.
