- id: PMID:14565969
  title: Disease-related myotubularins function in endocytic traffic in Caenorhabditis elegans.
  findings:
  - statement: >-
      C. elegans MTM-6 and MTM-9 act as a complex in coelomocyte endocytosis and their loss
      disorganises PI3P localisation.
  reference_review:
