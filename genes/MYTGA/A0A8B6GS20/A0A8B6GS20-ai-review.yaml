- term:
    id: GO:0046856
    label: phosphatidylinositol dephosphorylation
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  review:
    summary: >-
      PAINT placed this process at the active ancestral node PTN008506586. At the MTMR9 clade
      node PTN000086907 the curators negated only the catalytic activities, recording loss of
      phosphatidylinositol-3-phosphate phosphatase activity (GO:0004438) and
      phosphatidylinositol-3,5-bisphosphate 3-phosphatase activity (GO:0106018) as IRD rows. They
      did not negate the process, so the retained process is a deliberate decision. Biologically,
      MTMR9 is the noncatalytic subunit of the heteromeric phosphatase: it raises partner activity
      up to 30-fold toward PtdIns(3,5)P2 and fixes substrate preference. That is the
      scaffold/regulatory-subunit kind of participation that justifies a process annotation for
      a noncatalytic complex member. The worm MTM-6/MTM-9 complex is described as acting to
      dephosphorylate PtdIns(3)P. The target has the same MTMR9-type inactive site (Gly at the
      Cys position, Thr at the Arg position), so it has no intrinsic catalysis.
    action: ACCEPT
    reason: >-
      MTMR9-family proteins do part of the work of this process as obligate regulatory subunits
      of the active 3-phosphatase complex. PAINT deliberately retained the process while
      negating the activities at this node. This review accepts it; the earlier review proposed
      replacing it with regulation of phosphatidylinositol dephosphorylation. Gene-model caveat:
      this accession lacks the N-terminal half of the MTMR9 fold.
    supported_by:
    - reference_id: PMID:22647598
      supporting_text: >-
        Complex formation between the
        active myotubularins and MTMR9 increases their catalytic activity and alters
        their substrate specificity
    - reference_id: PMID:21076391
      supporting_text: >-
        MTM-6 and MTM-9
        are myotubularin lipid phosphatases that function as a complex to
        dephosphorylate phosphatidylinositol-3-phosphate
    - reference_id: file:MYTGA/A0A8B6GS20/A0A8B6GS20-bioinformatics/RESULTS-rereview.md
      supporting_text: >-
        So the retained region has the MTMR9-type inactive site.
