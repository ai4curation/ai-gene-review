suggested_questions:
- question: Can a substrate-specific descendant of intramolecular acyltransferase activity represent lipoprotein
    sn-2 O-to-N transfer without conflating it with intermolecular Lnt chemistry?
- question: Which native lipoprotein substrate features determine Lit selectivity in Bacillus cereus beyond
    the characterized PrsA product?
proposed_new_terms:
- proposed_name: diacylglyceryl lipoprotein intramolecular O-to-N acyltransferase activity
  proposed_definition: Catalysis of intramolecular transfer of the sn-2 ester-linked acyl chain of the
    N-terminal S-diacylglyceryl-L-cysteine of a lipoprotein to its free alpha-amino group, yielding a
    lyso-form lipoprotein with one O-linked and one N-linked acyl chain.
  justification: Direct purified-enzyme product analysis and NMR in PMID:34253723 resolve the sn-2 donor
    within the same substrate. The existing intramolecular acyltransferase genus is valid but does not
    encode this substrate, donor position, or lyso product. Total acyl-chain number remains two; this
    is not the intermolecular third-chain addition catalyzed by Lnt, Lnb, or LnsAB.
  proposed_parent:
    id: GO:0016867
    label: intramolecular acyltransferase activity
  supported_by:
  - reference_id: PMID:34253723
    supporting_text: These data prove that the acyl chain transferred by Lit comes from the sn-2 position
      of the DAG in the BLP substrate.
