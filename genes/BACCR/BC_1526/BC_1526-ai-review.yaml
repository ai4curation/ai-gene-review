product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:226900
  label: Bacillus cereus ATCC 14579
description: BC_1526 (Lit) is a four-pass membrane lipoprotein intramolecular transacylase in Bacillus
  cereus ATCC14579. It relocates the sn-2 ester-linked acyl chain of an N-terminal diacylglyceryl-cysteine
  to the cysteine alpha-amino group, producing an N-acyl-S-monoacylglyceryl lyso-lipoprotein without adding
  another acyl chain. The reaction occurs at the extracytoplasmic membrane interface. Target protein chemistry
  and native lipoprotein product analysis establish this maturation activity; a histidine-dependent acid-base
  mechanism is supported by structural and functional studies.
existing_annotations:
- term:
    id: GO:0016867
    label: intramolecular acyltransferase activity
  evidence_type: IDA
  original_reference_id: PMID:34253723
  review:
    action: NEW
    summary: Purified target enzyme catalyzes intramolecular sn-2 O-to-N acyl transfer.
    reason: The exact ATCC14579 protein Q813T3 was assayed with a defined lipopeptide. NMR establishes
      that its sn-2 acyl chain becomes the N-terminal cysteine amide. This fits intramolecular acyltransferase
      activity; no third acyl chain is added. The current descendants describe different substrates and
      do not represent Lit specificity.
    supported_by:
    - &id001
      reference_id: PMID:34253723
      supporting_text: These data prove that the acyl chain transferred by Lit comes from the sn-2 position
        of the DAG in the BLP substrate.
- term:
    id: GO:0042160
    label: lipoprotein modification
  evidence_type: IDA
  original_reference_id: PMID:34253723
  review:
    action: NEW
    summary: Lit chemically remodels the covalent lipid attachment of a lipoprotein.
    reason: 'Lit performs the chemical step itself: it relocates an existing ester-linked acyl chain to
      the alpha-amino group. Target biochemical product identification and native BC1526 loss/complementation
      support participation, independently of growth necessity. This term describes alteration of a pre-existing
      lipoprotein; no redundant biosynthesis parent or host immune-response process is proposed. The comparator
      survey found sparse family-member coverage, not affirmative evidence against this directly measured
      catalyst; see the bounded comparator analysis.'
    supported_by:
    - *id001
    - &id002
      reference_id: PMID:28320885
      supporting_text: 'When deleted from the native host, lipoproteins remain diacylated

        with a free N terminus, as maturation to the N-acylated lyso form is abolished.'
- term:
    id: GO:0005886
    label: plasma membrane
  evidence_type: IC
  original_reference_id: PMID:34253723
  review:
    action: NEW
    summary: Lit is an integral bacterial cytoplasmic-membrane enzyme.
    reason: The target crystal structure resolves four membrane-spanning helices and an extracytoplasmic
      cap. Native lipoprotein modification and the polytopic architecture identify the bacterial cytoplasmic
      membrane as the functional location. This does not treat heterologous E.coli expression as native
      Bacillus fractionation. The authored proposal uses IC because the native compartment is inferred
      from structure and pathway context, not measured by a native Bacillus localization assay.
    supported_by:
    - &id003
      reference_id: PMID:34253723
      supporting_text: The protein assumes the shape of a truncated cone that spans the membrane with
        four transmembrane helices
