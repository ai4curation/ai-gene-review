id: A0A674PKV4
gene_symbol: gas7a
taxon:
  id: NCBITaxon:31033
  label: Takifugu rubripes
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for fugu gas7a, an F-BAR domain protein of the GAS7
  family. The top-ranked call is instructive: "F-BAR domain binding" - the GO term for
  proteins that *bind* an F-BAR domain, not for proteins that *have* one. The retrieval
  matched the sequence to text about F-BAR domains without preserving the direction of
  the relation, an error a similarity-based method makes easily and a domain-based
  pipeline cannot make at all. The rest of the top five transfers Rho/Rac regulatory
  functions from the wider PSTPIP/F-BAR superfamily, and none of the calls reaches the
  clathrin-coated-pit biology that this review and GOA both assign to GAS7. One call
  resolves to an obsoleted term.
  Assessment: 0 correct (COR/CNN/LSP), 1 uncertain (UNC), 2 incorrect (NPI).
source_documents:
  - projects/PROTREK_EVALUATION/argo50_protrek_hits.tsv
