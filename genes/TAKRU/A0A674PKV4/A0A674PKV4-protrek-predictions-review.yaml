predictions:
  - source_method: ProTrek
    source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
    source_reference_id: PMID:41039041
    predicted_term:
      id: GO:1990808
      label: F-bar domain binding
    predicted_term_type: GO_MF
    review:
      assessment: NPI
      confidence_score: 0
      error_type: FREQUENCY_BIAS
      summary: >-
        Top-ranked hit (score 15.17) and a relation inversion rather than a biological error:
        GAS7 contains an F-BAR domain (residues 121-381), and this term is for proteins whose
        binding partner is an F-BAR domain. Annotating it here would assert that gas7a binds
        another F-BAR protein, which is not reported. The mistake is characteristic of
        contrastive text retrieval - the embedding captures that the sequence is "about"
        F-BAR domains but not whether the protein is the domain's owner or its ligand - and
        it is a mistake that InterPro2GO-style mapping structurally cannot make.
      supported_by:
        - reference_id: GO_REF:0000033
          supporting_text: Annotation inferences using phylogenetic trees
  - source_method: ProTrek
    source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
    source_reference_id: PMID:41039041
    predicted_term:
      id: GO:0035021
      label: negative regulation of Rac protein signal transduction
    predicted_term_type: GO_BP
    review:
      assessment: NPI
      confidence_score: 0
      error_type: PARALOG_OVERANNOTATION
      summary: >-
        Rank 2 (score 14.40). Rho-family signalling regulation is characterised for other
        F-BAR/PSTPIP superfamily members (srGAP, PACSIN, PSTPIP1 and the Rho-inhibitory
        GAS7 activity in the retrieved Function text), not established for GAS7 itself, whose
        documented roles are neurite outgrowth and clathrin-mediated endocytosis. Rank 4
        repeats the same concept without the direction, which again shows the ranked list
        supplying variants rather than independent evidence.
      supported_by:
        - reference_id: GO_REF:0000033
          supporting_text: Annotation inferences using phylogenetic trees
  - source_method: ProTrek
    source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
    source_reference_id: PMID:41039041
    predicted_term:
      id: GO:0097750
      label: endosome membrane tubulation
    predicted_term_type: GO_BP
    review:
      assessment: UNC
      confidence_score: 1
      summary: >-
        Rank 3 (score 13.82). Membrane tubulation is the generic mechanism of F-BAR domains,
        so this is mechanistically plausible for gas7a and is close to the membrane-curvature
        role this review assigns at clathrin-coated pits. But the compartment is different -
        GOA and this review place the protein at the plasma membrane and clathrin-coated
        pits, not on endosomes - and no endosomal localisation has been shown for any GAS7
        family member. A reasonable hypothesis at the wrong location; left uncertain.
      supported_by:
        - reference_id: GO_REF:0000033
          supporting_text: Annotation inferences using phylogenetic trees
