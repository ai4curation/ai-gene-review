- term:
    id: GO:0005905
    label: clathrin-coated pit
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: located_in
  review:
    summary: >-
      Inherited from a Bilateria PAINT node defined by the FCHO muniscins. No
      GAS7 ortholog has been shown to localize to clathrin-coated pits, and GAS7
      lacks the FCHO modules that target clathrin foci.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      All four clathrin-related TreeGrafter rows match the IBD set of
      PTN000552124 (taxon Bilateria), whose seeds are only FCHO1 (O14526), FCHO2
      (Q0JRZ9, MGI:3505790) and C. elegans fcho-1. The PAINT curator separately
      placed GAS7-derived terms (neuron projection morphogenesis, seeded by mouse
      Gas7) on the chordate GAS7 node PTN001890901 and did not add clathrin
      terms there. FCHO targeting to clathrin foci depends partly on its
      C-terminal muHD, and its AP2 activation depends on a linker motif. GAS7,
      including this 401-residue fugu model, ends about 20 residues after the
      F-BAR domain and has neither element. Experimentally, GAS7 forms sheets on
      flat membranes, unlike the curvature-coupled assemblies at clathrin-coated
      pits. The term is therefore a likely over-propagation into a lineage that
      diverged from the node's defining function. It is not shown to be false,
      so this is not a REMOVE.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: PANTHER:PTN000552124
        comment: Bilateria IBD seeded only by FCHO1/FCHO2/fcho-1. The GAS7 descendants lack the muHD and AP2-activating linker the seed function depends on.
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
    supported_by:
    - reference_id: PMID:22484487
      supporting_text: Precise deposition of FCHO1 at clathrin foci therefore depends, in part, on the C-terminal μHD.
    - reference_id: file:TAKRU/A0A674PKV4/A0A674PKV4-bioinformatics/RESULTS-rereview.md
      supporting_text: any mu-homology domain (muHD) or AP-2-activating linker of the FCHO1/FCHO2 muniscins.
    - reference_id: PMID:31628328
      supporting_text: GAS7 has the F-BAR domain that possesses unique hydrophilic loops for two-dimensional sheet formation on flat membranes.
