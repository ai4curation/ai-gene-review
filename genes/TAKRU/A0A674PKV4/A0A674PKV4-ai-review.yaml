- term:
    id: GO:0048812
    label: neuron projection morphogenesis
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  review:
    summary: >-
      The best-supported GAS7 process, placed by PAINT on the chordate GAS7 node
      and seeded by mouse Gas7 neurite-outgrowth experiments.
    action: ACCEPT
    reason: >-
      The row matches the IBD on PTN001890901 (Chordata), seeded by mouse Gas7
      (MGI:1202388). The fugu protein is in the same PANTHER subfamily
      (PTHR23065:SF57) as mouse Gas7. In mouse, knockdown impaired Purkinje
      neurite outgrowth, overexpression promoted neurite-like outgrowth, and
      Gas7 contributes to membrane protrusions by recruiting N-WASP/Arp2/3. One
      caveat: this gene model lacks a canonical WW motif, so the WW-dependent
      N-WASP route cannot be assumed. The F-BAR membrane-scaffold contribution
      remains, and other fugu gas7a transcripts or the gas7b paralog may supply
      the WW-containing forms.
    propagation_review:
      root_cause: NO_FAILURE_CORE
      failure_modes: []
      source_entities:
      - source_id: PANTHER:PTN001890901
        comment: Chordate GAS7-lineage IBD seeded by mouse Gas7; the target is a descendant in the same subfamily.
        source_status: SUPPORTS_TRANSFER
      - source_id: MGI:MGI:1202388
        comment: Mouse Gas7 neurite-outgrowth experiments ground the node.
        source_status: SUPPORTS_TRANSFER
    supported_by:
    - reference_id: PMID:9736752
      supporting_text: inhibition of production in terminally differentiating cultures of embryonic
        murine cerebellum impedes neurite outgrowth from maturing Purkinje cells
    - reference_id: PMID:20150425
      supporting_text: specific interaction between Gas7
        and N-WASP is required for regular neurite outgrowth of hippocampal neurons
