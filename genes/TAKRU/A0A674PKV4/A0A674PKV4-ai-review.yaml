id: A0A674PKV4
gene_symbol: gas7a
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:31033
  label: Takifugu rubripes
description: >-
  gas7a encodes a Takifugu rubripes ortholog of growth arrest-specific protein 7
  (GAS7), a member of the PANTHER GAS7 subfamily (PTHR23065:SF57) of F-BAR
  (FCH-BAR) domain proteins. This 401-residue gene model is the longest of three
  alternative transcript products of the fugu gas7a gene. It consists of a poorly
  conserved N-terminal segment, a WW-FCH linker and a complete F-BAR domain
  (residues 121-381), with no SH3 domain and no canonical WW motif. F-BAR domains
  form dimers that bind acidic phospholipids on the cytoplasmic face of the plasma
  membrane; in mammalian GAS7 the F-BAR domain assembles into two-dimensional
  sheets on flat plasma membrane, for example at macrophage phagocytic cups. In
  mammals GAS7 is expressed mainly in neurons, where it promotes neurite outgrowth
  and membrane protrusion, partly by recruiting N-WASP and the Arp2/3 complex
  through its WW domain. The fugu protein has not been studied experimentally;
  its expected roles, as a cytoplasmic and plasma-membrane-associated F-BAR
  scaffold that contributes to neuron projection morphogenesis, are inferred from
  subfamily membership and conserved domain architecture.
