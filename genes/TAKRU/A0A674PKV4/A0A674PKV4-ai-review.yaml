suggested_questions:
- question: >-
    PAINT node PTN000552124 propagates clathrin-coated pit, clathrin-coated vesicle,
    clathrin coat assembly and clathrin-dependent endocytosis from FCHO1/FCHO2 to
    the GAS7 subfamily, which lacks the muHD and AP2-activating linker. Should these
    IBDs be moved to an FCHO-only node?
- question: >-
    Do any fugu gas7a or gas7b transcripts encode the WW (and SH3) modules that
    mammalian GAS7b/c use to recruit N-WASP, or is this lineage F-BAR-only like
    mammalian GAS7d?
suggested_experiments:
- description: >-
    Express tagged fugu gas7a (A0A674PKV4) in cultured neurons or macrophages and
    test plasma membrane sheet assembly, colocalization with clathrin-coated pits,
    and effects on neurite outgrowth, compared with mouse GAS7b.
