- term:
    id: GO:0048268
    label: clathrin coat assembly
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  review:
    summary: >-
      Clathrin coat assembly is the defining FCHO activity, carried out through
      AP2 activation by the FCHO linker and Eps15/intersectin recruitment by the
      muHD. GAS7 has neither module.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Inherited from PTN000552124, seeded by human FCHO1 and FCHO2. FCHO
      proteins act in coat assembly as allosteric activators of AP2, using a
      linker motif that GAS7 does not have. Nothing shows GAS7 doing any of the
      work of clathrin coat assembly. By the participation test, the step is
      performed by the FCHO/AP2 machinery, not by GAS7.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: PANTHER:PTN000552124
