  evidence_type: EXP
  original_reference_id: PMID:17046834
  qualifier: located_in
  review:
    summary: >-
      The structure paper describes PgoX as a monotopic membrane protein requiring detergent for solubilisation
      and identifies a hydrophobic patch ringed by positive charges as the probable membrane anchor.
    action: ACCEPT
    reason: >-
      Membrane association is supported by the detergent requirement and by the structure; in a bacterium
      without internal membranes this is the cytoplasmic (plasma) membrane. The face of the membrane has
      not been shown experimentally, so the row stays at plasma membrane. Core location.
    supported_by:
    - reference_id: PMID:17046834
      supporting_text: >-
        A hydrophobic patch surrounded by positively charged residues suggests the position of the membrane
        anchor, differing from the one proposed for the tobacco mitochondrial protoporphyrinogen oxidase.
    - reference_id: PMID:17046834
      supporting_text: >-
