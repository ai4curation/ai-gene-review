  label: Myxococcus xanthus
description: >-
  PgoX (also called HemY) is the oxygen-dependent protoporphyrinogen IX oxidase of Myxococcus xanthus
  (EC 1.3.3.4), a flavoprotein of the protoporphyrinogen/ coproporphyrinogen oxidase family that binds
  one FAD non-covalently and contains no redox-active metal. It catalyses the six-electron oxidation of
  protoporphyrinogen IX to protoporphyrin IX, using molecular oxygen as electron acceptor and producing
  three hydrogen peroxide per protoporphyrin; coproporphyrinogen III is not a substrate. The product is
  the substrate of ferrochelatase in the classical protoporphyrin-dependent route to heme b. The enzyme
  is strongly inhibited by the diphenyl ether herbicide acifluorfen, and its crystal structure, alone
  and with acifluorfen, shows membrane-, substrate- and FAD-binding domains. It is a monotopic, membrane-associated
  protein that needs detergent for solubilisation, resembling the human mitochondrial enzyme PPOX in catalytic
  properties.
existing_annotations:
- term:
    id: GO:0004729
    label: protoporphyrinogen oxidase activity, oxygen as acceptor
  evidence_type: EXP
  original_reference_id: PMID:8621504
  qualifier: enables
  review:
    summary: >-
      Dailey and Dailey 1996 expressed and purified the M. xanthus enzyme and showed oxidation of protoporphyrinogen
      IX (Km 1.6 uM, kcat 5.2 min-1 under air) with formation of 3 mol H2O2 per mol protoporphyrin, no
      activity on coproporphyrinogen III, a non-covalent FAD and inhibition by acifluorfen.
    action: ACCEPT
    reason: >-
      GO:0004729 is defined as "3 O2 + protoporphyrinogen IX = 3 H2O2 + protoporphyrin IX", exactly the
      measured stoichiometry, so the oxygen-acceptor term is correct here, unlike for the quinone-dependent
      HemG enzymes. Core function.
    supported_by:
    - reference_id: PMID:8621504
      supporting_text: >-
        The M. xanthus enzyme utilizes protoporphyrinogen IX, but not coproporphyrinogen III, as substrate
        and produces 3 mol of H2O2/mol of protoporphyrin.
