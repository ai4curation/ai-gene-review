suggested_questions:
- question: >-
    Which face of the cytoplasmic membrane does PgoX bind in M. xanthus, and is the predicted hydrophobic
    patch the native membrane anchor?
- question: >-
    Is PgoX a monomer or a dimer in the membrane, given the conflicting solution and crystal data?
suggested_experiments:
- hypothesis: PgoX is a peripheral protein on the cytoplasmic face of the M. xanthus inner membrane.
  description: >-
    Fractionate M. xanthus cells, test release of PgoX by salt, carbonate and detergent, and map topology
    with protease protection of spheroplasts; mutate the predicted membrane-anchor residues and repeat.
