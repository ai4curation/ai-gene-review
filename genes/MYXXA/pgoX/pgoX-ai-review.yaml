- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: EXP
  original_reference_id: PMID:17046834
  qualifier: located_in
  review:
    summary: >-
      UniProt EXP for cytoplasm from the crystal-structure paper. The paper (full text cached) contains
      no localization assay of the enzyme in M. xanthus; it describes the protein as membrane-associated
      and monotopic, and contrasts it with the cytoplasmic Bacillus subtilis enzyme.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The cited paper does not support cytoplasm. GO cytoplasm excludes the plasma membrane, and this
      enzyme is a monotopic membrane protein that needs detergent for solubilisation; the paper explicitly
      sets it apart from the cytoplasmic B. subtilis HemY. Its catalytic domain faces the cytoplasm, so
      the claim is not entirely wrong, but the location is the membrane, which the plasma membrane rows
      capture.
    supported_by:
    - reference_id: PMID:17046834
      supporting_text: >-
        mxPPOX is a membrane-associated enzyme that requires the presence of detergent for solubilization
        and purification.
    - reference_id: PMID:17046834
      supporting_text: >-
        This is in contrast to the PPOX from Bacillus subtilis, which is monomeric, cytoplasmic, has broader
        substrate specificity, and is not inhibited by AF (18).
    source_defects:
    - defect_type: WRONG_STATEMENT
      resource: UNIPROT
      record: UniProtKB:P56601
      slot: SUBCELLULAR LOCATION
      requested_change: DELETE_VALUE
      asserted_value: Cytoplasm {ECO:0000269|PubMed:17046834}
      cause: OTHER
      confidence: PROBABLE
      explanation: >-
        The cited structure paper describes PgoX as a membrane-associated monotopic enzyme and contrasts
        it with the cytoplasmic B. subtilis HemY; it reports no evidence that the M. xanthus enzyme is
        cytoplasmic. The Cytoplasm statement and its ECO:0000269 tag appear unsupported; Cell membrane
        (membrane-associated) is supported.
      supported_by:
      - reference_id: PMID:17046834
        supporting_text: >-
          This is in contrast to the PPOX from Bacillus subtilis, which is monomeric, cytoplasmic, has
          broader substrate specificity, and is not inhibited by AF (18).
