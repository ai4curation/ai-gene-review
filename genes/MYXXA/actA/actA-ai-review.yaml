- term:
    id: GO:0009966
    label: regulation of signal transduction
  evidence_type: IMP
  original_reference_id: PMID:11359579
  qualifier: involved_in
  review:
    summary: >-
      CACAO row, and the paper does assay actA itself: a dedicated actA null mutant caps CsgA
      (C-signal) at a quarter of the wild-type maximum. The claim is right, but the direction of
      the effect is established, so the sign-specific child GO:0009967 positive regulation of
      signal transduction is the supported term.
    action: MODIFY
    reason: >-
      What the paper shows for this gene, CACAO assessment. Gronewold and Kaiser constructed null
      mutants of each act gene separately and report the actA result by name in the abstract: in
      an actA (or actB) null the C-signal "never rises above one-quarter of the maximum wild-type
      level of CsgA protein". This is not an operon-wide phenotype attributed to one gene; the
      paper's whole point is that the four genes divide the job, with actA and actB setting the
      maximum level and actC and actD setting the timing. The pathway in which ActA sits both
      receives C-signal and raises CsgA production, "thus creating a positive feedback loop", so
      ActA modulates the extent of C-signal transduction and the term's essence is correct and
      sits at the right place in the ontology: a regulation-of-signalling term, not a
      developmental-process term that ActA would have to execute. Because the sign is determined
      (loss of actA reduces signalling; ActA is required for full C-signalling), the review
      replaces the unsigned parent with GO:0009967, an is_a child, under the rule that a correct
      but less specific term should be refined to the specific supported term. Granularity note,
      since the readout is csgA expression rather than signalling per se: a gene-expression
      regulation term is deliberately not proposed. ActA has no DNA-binding domain, the model is
      that it signals to the sigma-54 activator ActB, the DNA-binding member of the operon (and
      the member that carries GO:0006355 in UniProt), and a later independent analysis argues
      that even ActB does not bind the csgA promoter directly, so the csgA effect runs through at
      least one unidentified intermediate. The signalling terms say what ActA does; a
      transcription term would say what something downstream of ActA does. GONUTS, which would
      have carried the student's own evidence note, was re-checked on 2026-11-01 and now returns
      HTTP 410 with a permanent retirement notice, with no Wayback snapshot of the actA or Q93P59
      pages, so the recorded student rationale is unrecoverable; the abstract states the
      gene-specific mutant result explicitly enough that no UNDECIDED is needed.
    proposed_replacement_terms:
    - id: GO:0009967
      label: positive regulation of signal transduction
    additional_reference_ids:
    - PMID:17189369
    - PMID:26369581
    supported_by:
    - reference_id: PMID:11359579
      supporting_text: The act A and act B genes regulate the maximum level of the C-signal, which
        never rises above one-quarter of the maximum wild-type level of CsgA protein in null
        mutants of either gene.
    - reference_id: PMID:11359579
      supporting_text: the two gene products are part of the same signal transduction pathway.
        That pathway responds to C-signal and also regulates the production of CsgA protein, thus
        creating a positive feedback loop.
    - reference_id: PMID:17189369
      supporting_text: The final level of csgA expression is set by actA and actB
    - reference_id: PMID:26369581
      supporting_text: it seems unlikely that ActB directly regulates developmental expression of
        csgA
