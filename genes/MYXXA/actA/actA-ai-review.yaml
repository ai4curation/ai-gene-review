- term:
    id: GO:0043937
    label: regulation of sporulation
  evidence_type: IMP
  original_reference_id: PMID:11359579
  qualifier: involved_in
  review:
    summary: >-
      CACAO row with a gene-specific mutant phenotype behind it: the actA null aggregates and
      ripples but makes no spores, and the gene's contribution is to set the level of the
      morphogen that triggers sporulation. The shape of the term is right; only the spore type can
      be made specific, so this is refined to GO:0042173.
    action: MODIFY
    reason: >-
      What the paper shows for this gene, CACAO assessment. The abstract reports the actA null
      phenotype by name: "both aggregate, neither sporulates, both prolong rippling". The students
      did not read a developmental phenotype as a developmental process; they chose a regulation
      term, which is the correct shape for a protein whose output is the level of C-signal rather
      than any step of spore morphogenesis, and the asymmetry of the phenotype (aggregation
      intact, sporulation abolished) is exactly what a regulation-of-sporulation term expresses.
      The judgement is independently endorsed by a later review of this organism's two-component
      systems: "actA and actB are required for sporulation inside nascent fruiting bodies but not
      for the formation of aggregates of cells". The companion paper strengthens the specificity
      of the defect, since the act mutations leave the early C-signal-independent program
      untouched and only depress the reporters expressed from 6 h onward. What can be improved is
      granularity of spore type. Myxococcus myxospores are cellular spores, and other Myxococcus
      xanthus gene products are annotated in the GO:0030435 branch of sporulation resulting in
      formation of a cellular spore, so GO:0042173, the direct is_a child of GO:0043937 restricted
      to cellular-spore formation, is the specific supported term; GO:0043937 would otherwise also
      cover spore types this organism does not make. Kept as core, since the sporulation defect is
      the principal consequence of losing actA. GONUTS returned HTTP 410 (permanently retired)
      when re-checked on 2026-11-01, so the student's recorded evidence text could not be
      consulted; the gene-specific result is in the abstract. The redundant-entry defect recorded
      on the GO:0009966 row of this review applies equally to this row.
    proposed_replacement_terms:
    - id: GO:0042173
      label: regulation of sporulation resulting in formation of a cellular spore
    additional_reference_ids:
    - PMID:11807078
    - PMID:26369581
    supported_by:
    - reference_id: PMID:11359579
      supporting_text: 'The act A and act B mutants have the same developmental phenotype:
        both aggregate, neither sporulates, both prolong rippling.'
    - reference_id: PMID:26369581
      supporting_text: Mutational analyses indicate that actA and actB are required for
        sporulation inside nascent fruiting bodies but not for the formation of aggregates of
        cells
    - reference_id: PMID:11807078
      supporting_text: The actA and actB null mutations substantially decreased the expression of
        all these reporters.
    - reference_id: PMID:11359579
      supporting_text: The C-signal is a morphogen that controls the assembly of fruiting bodies
        and the differentiation of myxospores.
core_functions:
- description: >-
    Response-regulator signalling node of the act operon. ActA receives the C-signal input
    (through a receptor and histidine kinase that remain unidentified) on its CheY-like receiver
    domain and acts on ActB, the sigma-54 activator encoded immediately downstream, so that the
    pathway raises csgA expression and amplifies its own operon. The functional output is
    quantitative: ActA together with ActB sets the maximum level of C-signal that development
    reaches, and in its absence CsgA never exceeds a quarter of the wild-type peak, cells
    aggregate and ripple but do not sporulate. The molecular function is assigned from the intact
    receiver domain with its phospho-accepting Asp90 plus three independent published descriptions
    of ActA as a response regulator; no phosphotransfer or other biochemical activity has been
    measured on the protein itself, which is recorded as a knowledge gap below. The C-terminal
    GGDEF domain lacks the canonical GG(D/E)EF A-site motif, so diguanylate cyclase activity is
    not claimed. The activity is given here, in the review's own synthesis, rather than proposed
    as a NEW annotation row: InterPro2GO's mapping of the receiver-domain signature IPR001789
    stops at the process term GO:0000160 and does not assign GO:0000156, which is the convention
    across response regulators including ActB itself, and nothing beyond the domain match would
    justify departing from it.
  molecular_function:
    id: GO:0000156
    label: phosphorelay response regulator activity
  directly_involved_in:
  - id: GO:0000160
    label: phosphorelay signal transduction system
  - id: GO:0009967
    label: positive regulation of signal transduction
  - id: GO:0042173
    label: regulation of sporulation resulting in formation of a cellular spore
  supported_by:
  - reference_id: PMID:11359579
    supporting_text: By sequence homology, act A encodes a response regulator, and act B encodes a
      sigma-54 activator protein of the NTRC class.
  - reference_id: PMID:11359579
    supporting_text: The act A and act B genes regulate the maximum level of the C-signal, which
      never rises above one-quarter of the maximum wild-type level of CsgA protein in null mutants
      of either gene.
  - reference_id: PMID:17189369
    supporting_text: would signal ActA, which, in turn, would activate ActB, presumably to ActB
  - reference_id: PMID:17189369
    supporting_text: act reporter expression is substantially and equally depressed in the
  - reference_id: file:MYXXA/actA/actA-uniprot.txt
    record_section: ["FT:DOMAIN"]
    supporting_text: Response regulatory
  knowledge_gaps:
  - gap_statement: >-
      Nothing is known biochemically about ActA. No histidine kinase has been shown to
      phosphorylate it, the receptor that detects C-signal on the receiving cell has not been
      identified, phosphotransfer onto Asp90 has never been demonstrated, and no interaction
      between ActA and ActB has been measured.
    boundary: >-
      Established: ActA carries an intact receiver domain with a phospho-accepting aspartate, an
      actA null caps C-signal at a quarter of wild type and abolishes sporulation without blocking
      aggregation, and the same mutant depresses transcription of the act operon as strongly as an
      actB deletion. Missing: any direct measurement on the protein, including whether it is
      phosphorylated at all and whether phosphorylation is required for its effect on ActB.
    gap_kind:
    - BIOLOGY
    significance: >-
      The entire phosphorelay reading of ActA, including the GO:0000160 annotation and the
      molecular function assigned here, rests on domain architecture plus genetics. If ActA acts
      on ActB without phosphotransfer, as has turned out to be the case for the M. xanthus
      response-regulator-like protein FruA, the mechanistic model of the C-signal positive
      feedback loop changes.
    resolution: >-
      In vitro phosphorylation of purified ActA with candidate histidine kinases and with small
      phosphodonors such as acetyl phosphate, a D90A/D90E allele series tested for sporulation and
      for act and csgA reporter expression, and a direct binding assay between ActA and ActB.
    provenance:
    - reference_id: PMID:26369581
knowledge_gaps:
- gap_statement: >-
    The GGDEF output domain of ActA has no known ligand, product or partner, and it is not known
    whether c-di-GMP signalling is involved in the act pathway at all.
  boundary: >-
    Established: residues 207-342 match the GGDEF profile (PROSITE PS50887, Pfam PF00990, NCBIfam
    TIGR00254) and the domain is described in the literature as a predicted GGDEF-type effector.
    Observed here from the Q93P59 sequence: the canonical GG(D/E)EF A-site motif is absent, the
    nearest sequence at that position being GDCQF, which is the signature of a degenerate,
    probably non-catalytic GGDEF domain. Missing: any measurement of c-di-GMP synthesis,
    nucleotide binding or protein binding by this domain.
  gap_kind:
  - BIOLOGY
  significance: >-
    A catalytically dead GGDEF domain is usually a protein-protein interaction or
    c-di-GMP-binding module, so the identity of its partner would say how ActA transmits the
    C-signal to ActB, and whether the second messenger that governs the best-studied
    developmental decision in Myxococcus is c-di-GMP or something else.
  resolution: >-
    Purify ActA and its isolated GGDEF domain, assay diguanylate cyclase activity and c-di-GMP
    binding directly, and search for interaction partners of the domain by pull-down or
    bacterial two-hybrid in developing cells.
  provenance:
  - reference_id: PMID:26369581
- gap_statement: >-
    Which transcription factor actually drives csgA is unknown, so the mechanism by which ActA
    raises C-signal production is unresolved.
  boundary: >-
    Established: csgA expression and CsgA protein level depend on actA and actB, and the act
    pathway and csgA form a positive feedback loop. Missing: the direct regulator of the csgA
    promoter. ActB, the operon's sigma-54 activator and the obvious candidate, has no detectable
    binding site or sigma-54 consensus upstream of csgA, and its only identified direct targets
    are the act operon itself and MXAN4899.
  gap_kind:
  - BIOLOGY
  significance: >-
    The number of steps between ActA and csgA transcription decides what ActA can legitimately be
    annotated to: with a direct link, a regulation-of-transcription term would be defensible;
    with an unidentified intermediate, the signalling terms used in this review are as far as the
    evidence reaches.
  resolution: >-
    Map the csgA promoter by deletion and point mutagenesis, identify proteins binding it by
    DNA-affinity capture from developing cells, and test candidate regulators by ChIP-seq in a
    wild-type and an actA background.
  provenance:
  - reference_id: PMID:26369581
suggested_questions:
- question: >-
    Should ActA carry a regulation-of-gene-expression term for its effect on csgA? The directly
    measured readout in the defining paper is csgA expression and CsgA protein level, and ActA is
    also required for transcription of its own operon, but ActA has no DNA-binding domain, the
    model routes its effect through the sigma-54 activator ActB, and ActB itself apparently does
    not bind the csgA promoter. This review therefore annotates signalling only. A curator with
    access to the full text of PMID:11359579 could settle whether the csgA measurement was
    transcriptional and whether GO's conventions place such a term on a non-DNA-binding response
    regulator.
- question: >-
    Should UniProt merge the redundant act-operon entries? Q93P59 (AF350253, species taxon 34) and
    Q1D7F9 (CP000113, actA MXAN_3213, DK1622 taxon 246197) are the same 342-residue protein of the
    same strain, but only Q93P59 carries the experimental annotations, so they are invisible from
    the DK1622 reference proteome. The same split, in the opposite direction, affects actB
    (Q93P58 versus Q1D7F8) and actC (Q93P57 versus Q1D7F7).
- question: >-
    Is the prolonged rippling of an actA mutant a separate consequence of ActA signalling, or
    simply what a cell population does when C-signal stalls below the sporulation threshold?
    Rippling, aggregation and sporulation are triggered at successively higher C-signal levels,
    and the actA null stops at the rippling step.
- question: >-
    Is actE, the fifth gene of the operon recognised only in 2007, functional, and does it
    contribute to the phenotype attributed to the four-gene operon in the 2001 study? No actE
    mutant has been made and no homolog suggests a function.
  experts:
  - Anthony G. Garza
  - Lee Kroos
suggested_experiments:
- hypothesis: >-
    ActA is phosphorylated on Asp90 by a histidine kinase activated by C-signal, and this
    phosphorylation is required for ActB activation, csgA expression and sporulation.
  description: >-
    Build a chromosomal allele series at the actA receiver domain (D90A non-phosphorylatable,
    D90E phosphomimetic, plus a receiver-domain deletion) in DK1622 and score each for fruiting
    body morphology, spore titre, CsgA immunoblot level, and the act and csgA transcriptional
    lacZ reporters used in PMID:17189369. In parallel, purify ActA and test phosphorylation by
    acetyl phosphate and by each of the orphan histidine kinases implicated in late development,
    following phosphotransfer to ActB.
  experiment_type: bacterial genetics with in vitro phosphotransfer assays
- hypothesis: >-
    The GGDEF domain of ActA is catalytically dead and functions as a protein-interaction module
    that engages ActB.
  description: >-
    Assay purified full-length ActA and its isolated GGDEF domain for diguanylate cyclase
    activity and for c-di-GMP binding (by HPLC product detection and by isothermal titration or
    differential radial capillary action of ligand assay), then test ActA-ActB interaction by
    bacterial two-hybrid and by pull-down from developing cells, comparing wild-type ActA with a
    GGDEF-domain deletion and with a restored GGDEF A-site motif. A dead domain that still binds
    ActB, while the deletion loses binding and phenocopies the null, would establish the module's
    role.
  experiment_type: enzymology plus protein interaction analysis
- hypothesis: >-
    ActA acts on csgA transcription through an intermediate transcription factor rather than
    through direct ActB binding at the csgA promoter.
  description: >-
    Define the csgA promoter by scanning mutagenesis of a csgA-lacZ fusion in DK1622, identify
    proteins that bind it by DNA-affinity capture and mass spectrometry from cells at 18-24 h of
    development, and test each candidate by ChIP-seq in wild-type and delta actA backgrounds.
    Comparing the ActB ChIP-seq signal at the csgA promoter with that at the act promoter and
    MXAN4899 would resolve the contradiction between PMID:17189369 and PMID:26369581.
  experiment_type: promoter mapping with ChIP-seq and affinity proteomics
- hypothesis: >-
    The level versus timing division of labour within the act operon is quantitative, so graded
    expression of actA alone can reconstruct intermediate developmental outcomes.
  description: >-
    Place actA under an inducible promoter in an actA null background and titrate its expression,
    measuring CsgA level, rippling duration, aggregate morphology and spore titre at each
    induction level. If ActA acts purely on the maximum level of C-signal, spore titre should be a
    threshold function of actA dosage while the timing of csgA induction, which actC and actD
    control, should be unchanged.
  experiment_type: inducible expression dose-response with developmental phenotyping
