id: Q93P59
gene_symbol: actA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:34
  label: Myxococcus xanthus
description: >-
  ActA is the first gene product of the five-gene act operon (actA-actE, MXAN_3213-MXAN_3217) of
  the fruiting-body-forming soil bacterium Myxococcus xanthus. It is a cytoplasmic response
  regulator: a CheY-like receiver domain (residues 41-157, with a phospho-accepting aspartate at
  position 90) fused to a C-terminal GGDEF-type output domain that lacks the canonical GG(D/E)EF
  catalytic motif and is therefore unlikely to act as a diguanylate cyclase. ActA works together
  with ActB, the sigma-54 activator encoded immediately downstream, in a signal transduction
  pathway that receives the C-signal, the cell-surface morphogen encoded by csgA that coordinates
  aggregation, rippling and myxospore differentiation during starvation-induced development. The
  pathway both responds to C-signal and raises csgA expression, forming a positive feedback loop,
  and ActA together with ActB sets the maximum level of C-signal reached: in an actA null mutant
  CsgA protein never exceeds a quarter of the wild-type peak, cells still aggregate and ripple
  (rippling is prolonged) but fail to sporulate. ActA is also required for the rapid, C-signal
  dependent second phase of transcription of its own operon, so it feeds back on act expression
  as well. The histidine kinase that phosphorylates ActA, the receptor that detects C-signal, and
  any ligand of the degenerate GGDEF domain are all unknown, and no biochemical activity has been
  measured for the protein.
