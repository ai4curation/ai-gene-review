  review:
    summary: >-
      Correct and informative: the InterPro receiver-domain signature matches residues 41-157 with
      the phospho-accepting Asp90 intact, and three independent publications describe ActA as a
      response regulator operating in a signal transduction pathway that receives the C-signal.
      This is the mechanistic core of the gene.
    action: ACCEPT
    reason: >-
      IPR001789 is the response-regulator receiver (REC/CheY-like) domain, matched by PROSITE
      PS50110 over residues 41-157 of Q93P59, with a predicted 4-aspartylphosphate at Asp90. The
      inference is not left standing on the signature alone. The defining genetic study assigns
      the same identity ("By sequence homology, act A encodes a response regulator") and places
      ActA and ActB in one pathway that "responds to C-signal"; the promoter study restates it
      ("actA encodes a response regulator that works with actB") and gives the pathway logic
      explicitly, with C-signal signalling to ActA, which activates ActB; and the independent
      two-component-systems review of this organism agrees. The term is a process-level statement
      about participation in a phosphorelay, which is exactly what the evidence supports, so the
      granularity is right and no sub-term is needed. One caveat is recorded as a knowledge gap
      rather than as a reason to weaken the action: no histidine kinase has been shown to
      phosphorylate ActA, the C-signal receptor is unidentified, and phosphotransfer onto Asp90
      has never been measured, so the phosphorelay is inferred from domain architecture plus
      genetics rather than demonstrated biochemically.
