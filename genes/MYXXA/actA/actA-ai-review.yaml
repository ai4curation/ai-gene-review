- id: PMID:11359579
  title: The act operon controls the level and time of C-signal production for Myxococcus
    xanthus development.
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The defining study of the act operon and the source cited by both CACAO rows on this gene,
      and by the CACAO rows on actB (Q1D7F8) and actC (Q93P57). PMID verified against PubMed and
      against the UniProt entry, which cites it as the publication accompanying EMBL AF350253,
      the act-operon sequence from strain DK1622. The cached record is abstract-only, but the
      abstract reports the actA null mutant result by name, separately from actB, actC and actD,
      so both rows could be adjudicated without the full text. The strain question raised by the
      batch-3 screen is answerable from outside the paper: Q93P59 derives from AF350253 with
      STRAIN=DK1622, and the same authors' 2007 follow-up states that DK1622 provided the
      standard genetic background for their work on this operon. Independently corroborated by
      PMID:11807078 (same authors, developmental reporters) and by PMID:26369581 (independent
      review, which confirms the actA phenotype while questioning the mechanism).
  findings:
  - statement: >-
      The C-signal, the product of csgA, is the morphogen for both fruiting body assembly and
      myxospore differentiation, and its production is controlled by the act operon.
    reference_section_type: ABSTRACT
    supporting_text: The C-signal is a morphogen that controls the assembly of fruiting bodies
      and the differentiation of myxospores.
  - statement: >-
      csgA expression is under the control of the co-transcribed act genes, which at the time
      were taken to be four.
    reference_section_type: ABSTRACT
    supporting_text: Production of this signal, which is encoded by the csgA gene, is regulated
      by the act operon of four genes that are co-transcribed from the same start site.
    finding_review:
      finding_status: OVERTURNED
      superseded_by:
      - PMID:17189369
      review_notes: >-
        The operon has since been shown to contain a fifth gene, actE (MXAN_3217), co-transcribed
        with the rest. This does not affect the actA annotations, which rest on the actA null
        mutant, but the operon should be described as actA-actE.
      supported_by:
      - reference_id: PMID:17189369
        supporting_text: All act genes, actA to actE , are expressed together and constitute an
          operon
  - statement: >-
      actA, separately from the other act genes, sets the maximum level of C-signal: an actA null
      caps CsgA protein at a quarter of the wild-type peak. This is the gene-specific evidence
      behind the regulation-of-signal-transduction row.
    reference_section_type: ABSTRACT
    supporting_text: The act A and act B genes regulate the maximum level of the C-signal, which
      never rises above one-quarter of the maximum wild-type level of CsgA protein in null
      mutants of either gene.
  - statement: >-
      The actA null phenotype is asymmetric: aggregation and rippling proceed, sporulation does
      not. This is the gene-specific evidence behind the regulation-of-sporulation row.
    reference_section_type: ABSTRACT
    supporting_text: 'The act A and act B mutants have the same developmental phenotype:
      both aggregate, neither sporulates, both prolong rippling.'
  - statement: ActA is assigned as a response regulator from its sequence, and ActB as a sigma-54 activator.
    reference_section_type: ABSTRACT
    supporting_text: By sequence homology, act A encodes a response regulator, and act B encodes
      a sigma-54 activator protein of the NTRC class.
  - statement: >-
      ActA and ActB form one signal transduction pathway that both responds to C-signal and
      raises CsgA production, a positive feedback loop.
    reference_section_type: ABSTRACT
    supporting_text: the two gene products are part of the same signal transduction pathway. That
      pathway responds to C-signal and also regulates the production of CsgA protein, thus
      creating a positive feedback loop.
- id: PMID:11807078
  title: act operon control of developmental gene expression in Myxococcus xanthus.
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Companion study by the same authors, newly cached for this review. PMID verified against
      PubMed and Europe PMC (PMC134796); the cached record is abstract-only. Used for two things:
      it restates the 2001 result as transcriptional control of csgA, and it localizes the actA
      defect to the late, C-signal-dependent half of development by showing that the
      C-signal-independent early genes are untouched. Not used to support any annotation on its
      own.
  findings:
  - statement: >-
      The earlier work is summarised by its own authors as showing that the act genes direct csgA
      transcription, which is the basis for reading the actA effect as control of C-signal
      production rather than a late indirect consequence.
    reference_section_type: ABSTRACT
    supporting_text: Earlier work has shown that transcription of the csgA gene, which encodes
      the C-signal, is directed by four genes of the act operon.
  - statement: >-
      act mutations leave the early, C-signal-independent developmental program intact, so the
      actA defect is specific to C-signal-dependent events.
    reference_section_type: ABSTRACT
    supporting_text: Neither the time of first expression nor the rate of expression increase was
      changed in actA, actB, actC, or actD mutant strains.
  - statement: >-
      actA and actB null mutations depress all four aggregation and sporulation reporters
      expressed from 6 h of development, in contrast to the timing-only effects of actC and actD.
    reference_section_type: ABSTRACT
    supporting_text: The actA and actB null mutations substantially decreased the expression of
      all these reporters.
- id: PMID:17189369
  title: Mutations of the act promoter in Myxococcus xanthus.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Newly cached for this review, and the only act-operon paper whose full text is available
      (PMC1855723). PMID verified against PubMed. It is the source for three things this review
      needs and the 2001 abstract does not give: the strain (DK1622 provided the standard genetic
      background), the identity of actA with MXAN_3213 and the verification of the AF350253 act
      sequence against the DK1622 genome CP000113, and the demonstration that a delta actA mutant
      depresses transcription of the act operon itself, measured with a transcriptional lacZ
      fusion. Also the source of the mechanistic model in which C-signal signals to ActA, which
      activates ActB. Its proposal that the act operon activates csgA transcription is a model,
      not a direct demonstration, and is disputed by PMID:26369581.
  findings:
  - statement: >-
      The work was done in DK1622, the standard M. xanthus laboratory strain and reference genome.
    reference_section_type: RESULTS
    supporting_text: integrated by homologous recombination into the act region of the chromosome
      of DK1622, the strain which provided a standard genetic background for this work
  - statement: >-
      The act-operon sequence submitted as AF350253, from which UniProt entry Q93P59 derives, is
      the same sequence as in the DK1622 genome CP000113; actA is MXAN_3213.
    reference_section_type: RESULTS
    supporting_text: The entire sequence was verified in the complete sequence of the M. xanthus
      genome, GenBank accession number CP000113
  - statement: >-
      The operon contains five genes, actA to actE, not four as originally reported.
    reference_section_type: ABSTRACT
    supporting_text: All act genes, actA to actE , are expressed together and constitute an
      operon
  - statement: ActA is a response regulator functioning together with ActB.
    reference_section_type: RESULTS
    supporting_text: actA encodes a response regulator that works with actB
  - statement: >-
      Deleting actA depresses transcription of the act operon as strongly as deleting actB, so
      ActA feeds back on its own operon's expression.
    reference_section_type: RESULTS
    supporting_text: act reporter expression is substantially and equally depressed in the
  - statement: >-
      ActA and ActB are proposed to form the signal transduction pathway that receives C-signal,
      with ActA acting upstream of ActB.
    reference_section_type: DISCUSSION
    supporting_text: ActA and ActB appear to be part of a signal transduction pathway that
      receives input from C signal on the transmitting cell.
  - statement: >-
      The proposed order of events places an unidentified C-signal receptor upstream of ActA and
      ActB downstream of it.
    reference_section_type: DISCUSSION
    supporting_text: would signal ActA, which, in turn, would activate ActB, presumably to ActB
  - statement: >-
      The final level of csgA expression is attributed specifically to actA and actB, as distinct
      from the timing genes actC and actD.
    reference_section_type: DISCUSSION
    supporting_text: The final level of csgA expression is set by actA and actB
- id: PMID:26369581
  title: Two-Component Signal Transduction Systems That Regulate the Temporal and Spatial
    Expression of Myxococcus xanthus Sporulation Genes.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Independent review of M. xanthus two-component systems from a different laboratory,
      newly cached for this review with PMC full text; PMID verified against PubMed. It is the
      most useful corroborating source because it is not by the authors of the annotated paper
      and it is explicit about what is and is not established. It confirms the actA mutant
      phenotype and the response-regulator-plus-GGDEF architecture, states that little else is
      known about actA, and argues against the mechanism proposed in the primary papers: no ActB
      binding site or sigma-54 consensus could be found upstream of csgA, so the act-to-csgA link
      is probably indirect. A review rather than primary data, so it is cited for the published
      synthesis and the negative promoter search, not as experimental evidence for the phenotype.
  findings:
  - statement: >-
      ActA is a response regulator with a GGDEF-type output domain, independently stated outside
      the primary papers.
    reference_section_type: RESULTS
    supporting_text: ActA is a putative response regulator that is predicted to have a GGDEF-type
      effector domain, which is found in diguanylate cyclase enzymes.
  - statement: >-
      The actA requirement is specifically for sporulation within nascent fruiting bodies and not
      for aggregation, confirming the asymmetry of the 2001 phenotype.
    reference_section_type: RESULTS
    supporting_text: Mutational analyses indicate that actA and actB are required for sporulation
      inside nascent fruiting bodies but not for the formation of aggregates of cells
  - statement: >-
      Beyond that phenotype, actA is essentially uncharacterised, which is why this review
      proposes no molecular-function annotation beyond the response-regulator activity inferred
      from the domain.
    reference_section_type: RESULTS
    supporting_text: Little else is known about the function of actA
  - statement: >-
      The proposed direct regulation of csgA by ActB is unlikely, so the act-to-csgA effect runs
      through at least one unidentified intermediate. This is the reason no gene-expression
      regulation term is proposed for ActA.
    reference_section_type: RESULTS
    supporting_text: it seems unlikely that ActB directly regulates developmental expression of
      csgA
  - statement: >-
      No histidine kinase upstream of the act pathway has been identified, which is the basis of
      the phosphorelay knowledge gap recorded in this review.
    reference_section_type: RESULTS
    supporting_text: The histidine kinase sensor that activates ActB via phosphorylation and
      presumably triggers ActB-mediated expression of sporulation genes in nascent fruiting
      bodies has yet to be identified.
