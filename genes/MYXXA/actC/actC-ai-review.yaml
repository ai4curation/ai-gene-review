  knowledge_gaps:
  - gap_statement: 'ActC''s molecular activity and its target are undetermined: whether the GNAT domain
      acetylates anything, what the acceptor is, whether the NAD(P)-binding Rossmann domain binds a dinucleotide
      or catalyses a reaction, and by what step the protein lowers csgA expression.'
    boundary: 'What is firmly established is genetic and quantitative: actC is co-transcribed with the
      other act genes, its null mutant advances CsgA accumulation by about 15 h without changing the maximum,
      advances C-signal-dependent aggregation and sporulation gene expression, and produces many small
      fruiting bodies prematurely, while leaving C-signal-independent early development untouched. The
      domain architecture is also established from signatures.'
    gap_kind:
    - BIOLOGY
    dark_aspect: MF_DARK
    significance: ActC is the only identified negative component of the act timing circuit, and the circuit
      is the clock that sets fruiting-body number and size through C-signal kinetics. Without its activity
      the mechanism of developmental timing in this organism stops at a genetic epistasis and cannot be
      modelled biochemically; it also leaves the GNAT domain prediction, which is the only molecular handle
      on the protein, untestable.
    resolution: 'Assay purified ActC for acetyl-CoA-dependent acetyltransferase activity and identify
      its acceptor, and test whether it binds the csgA promoter region or acts through another act product.
      The only mechanism on offer is a proposal (PMID:17189369): ActC and ActD made in comparable amounts
      from one operon, ActC inhibiting csgA expression, and the ActD caspase-like protease degrading ActC
      to release the inhibition on schedule.'
