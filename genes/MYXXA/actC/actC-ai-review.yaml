- term:
    id: GO:0016407
    label: acetyltransferase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: enables
  supporting_entities:
  - UniRule:UR000414522
  review:
    summary: UniRule inference from the GNAT domain that occupies residues 273-437 of ActC. The domain
      match is genuine, but no acetyltransferase activity, acetyl donor or acceptor has ever been assayed
      for this protein, and the term stops one level above what the signature actually specifies.
    action: MODIFY
    reason: 'The GNAT match is real: the UniProt record carries a 273-437 N-acetyltransferase domain feature,
      PROSITE PS51186 (GNAT) and Pfam PF00583. The domain family is specifically an N-acetyltransferase,
      transferring acetyl to a nitrogen acceptor, which GO:0008080 states and the annotated term does
      not. GO:0008080 is an is_a child of this term, so this is a refinement to the specificity the evidence
      carries, with the evidence unchanged - it remains a domain-level prediction on a PE 4 (Predicted)
      entry, not a measured activity, and the review does not place it among the core functions. Keeping
      it rather than removing it is right: a GNAT domain is a positive, well-defined structural prediction
      and the protein''s unknown mechanism may well run through it. The one caution worth recording is
      that domain presence does not establish catalysis; several GNAT-fold proteins are non-catalytic
      binding modules, and only an assay can settle whether ActC acetylates anything.'
    proposed_replacement_terms:
    - id: GO:0008080
      label: N-acetyltransferase activity
    supported_by:
