id: Q93P57
gene_symbol: actC
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:34
  label: Myxococcus xanthus
description: 'ActC is one of the proteins encoded by the act operon of Myxococcus xanthus, a single transcription
  unit (actA-actE) that sets the level and the timing of C-signal production during starvation-induced
  fruiting-body development. The C-signal is the cell-surface morphogen encoded by csgA; it coordinates
  cell aggregation and the differentiation of myxospores, with sporulation genes requiring a higher C-signal
  threshold than aggregation genes. Within the operon actA and actB fix how high the C-signal can rise,
  while actC and actD govern when it rises. ActC is the brake: cells lacking actC begin accumulating CsgA
  about 15 hours earlier than wild type, reach the normal maximum, express C-signal-dependent aggregation
  and sporulation genes prematurely, and form many small fruiting bodies ahead of schedule, while early
  C-signal-independent development is unaffected. ActC therefore restrains the rise of csgA expression
  and, through it, the schedule of C-signal-dependent development; one proposal has the ActD protease
  degrading ActC to release that inhibition at the appropriate time. The 437-residue protein combines
  an N-terminal NAD(P)-binding Rossmann-like domain with a C-terminal GNAT (GCN5-related N-acetyltransferase)
  domain, but no catalytic activity, substrate, acetylation target or binding partner has been assayed,
  so the molecular mechanism of the inhibition is unknown.'
