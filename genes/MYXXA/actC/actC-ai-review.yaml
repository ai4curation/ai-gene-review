- term:
    id: GO:0009966
    label: regulation of signal transduction
  evidence_type: IMP
  original_reference_id: PMID:11359579
  qualifier: involved_in
  review:
    summary: 'CACAO row. The cited paper shows that the act operon regulates production of the C-signal,
      the CsgA morphogen that drives fruiting-body assembly and myxospore differentiation, and that actC
      specifically sets the time pattern of CsgA production: an actC null mutant raises CsgA 15 h earlier
      than wild type while reaching the same maximum. Regulating the C-signal does regulate C-signalling,
      so the term is true of actC; the direction is known and the term does not state it.'
    action: MODIFY
    reason: 'Right claim, unsigned term. Every reported actC phenotype is a release of a restraint: the
      null mutant produces CsgA 15 h early (PMID:11359579) and expresses C-signal-dependent aggregation
      and sporulation reporters prematurely (PMID:11807078), and the authors draw the conclusion explicitly
      in PMID:17189369 - actC inhibits the rise of csgA expression. ActC therefore reduces the rate at
      which C-signalling increases, which is negative regulation, and GO:0009968 is the is_a child of
      this term that says so. This is the standard sign refinement, not a change of claim. Two points
      in favour of keeping the row in this neighbourhood at all: the paper''s readout is the signal''s
      own production rather than any step inside a receiving cell, which would argue for the regulation-of-signaling
      branch, but the act operon is itself part of a C-signal-responsive positive feedback loop (ActA
      relays C-signal to the sigma-54 activator ActB, which drives act and csgA expression), so actC modulates
      a signal transduction pathway it also sits inside, and GO:0009968 remains defensible as well as
      more informative. The student''s choice of a regulation-of term rather than a bare signalling term
      was correct: ActC performs the regulation and the C-signalling cascade performs the transduction.'
    proposed_replacement_terms:
    - id: GO:0009968
      label: negative regulation of signal transduction
    additional_reference_ids:
    - PMID:11807078
    - PMID:17189369
    supported_by:
    - reference_id: PMID:11359579
      supporting_text: The C-signal is a morphogen that controls the assembly of fruiting bodies and the
        differentiation of myxospores
      reference_section_type: ABSTRACT
    - reference_id: PMID:11359579
