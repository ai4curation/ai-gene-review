suggested_questions:
- question: Does ActC have acetyltransferase activity at all, and if so what does it acetylate? The GNAT
    domain is the only molecular handle on the protein, and whether it is a catalytic domain or a non-catalytic
    binding module decides whether the molecular-function rows in GOA mean anything.
  experts:
  - Gronewold TM
  - Kaiser D
- question: Is the proposed ActD-mediated degradation of ActC real? The scheme in PMID:17189369 - comparable
    amounts of ActC and ActD made from one operon, ActC inhibiting csgA expression, the ActD caspase-like
    protease removing ActC to let csgA rise - is a hypothesis with no direct evidence, and it is the mechanism
    that would explain the opposite timing phenotypes of the two mutants.
  experts:
  - Gronewold TM
  - Kaiser D
- question: What does actE do, and should the act operon's GO annotations be revisited as a five-gene
    unit? actE was described after the 2001 paper that every current act annotation cites, and PMID:17189369
    reports no homologues and no phenotype for it.
  experts: []
- question: Does ActC act on the csgA promoter, on another act product, or on a C-signal-responsive regulator?
    This is what decides whether negative regulation of DNA-templated transcription is the right term
    rather than the gene-expression parent used here.
  experts: []
suggested_experiments:
- hypothesis: The GNAT domain of ActC is catalytically active and acetylates a protein of the C-signalling
    or act circuit.
  description: Express and purify full-length ActC and the isolated GNAT domain (residues 273-437), and
    assay acetyl-CoA-dependent acetyltransferase activity against a candidate panel - ActA, ActB, CsgA,
    FruA - and against M. xanthus developmental cell lysate, reading out by CoA release and by anti-acetyllysine
    immunoblot. Confirm any hit by mass spectrometry of the modified site and by mutating the conserved
    GNAT acetyl-CoA-binding motif in the chromosomal copy, which should reproduce the premature-CsgA phenotype
    of the null if catalysis is the relevant activity.
  experiment_type: in vitro enzyme assay with targeted mutagenesis
- hypothesis: ActC is degraded during development by the ActD protease, and this is what releases csgA
    expression on schedule.
  description: Raise antibodies against ActC or tag the chromosomal copy, and follow ActC protein levels
    through development in wild type and in an actD null by immunoblot. The prediction is that ActC disappears
    at the time csgA expression rises in wild type and persists in the actD mutant, matching that mutant's
    6 h delay. Pair this with an in vitro cleavage assay using purified ActD and ActC, and with the ActD
    catalytic-dyad mutant as a negative control.
  experiment_type: developmental time-course immunoblot and in vitro proteolysis
- hypothesis: ActC lowers csgA expression by acting at or near the csgA promoter.
  description: Test purified ActC for binding to the csgA promoter region by electrophoretic mobility
    shift and by DNase I footprinting, and in parallel map ActC occupancy genome-wide during development
    by ChIP-seq on a tagged chromosomal allele. A negative result on both would move the mechanism downstream
    of transcription initiation and would justify keeping the review's process term at the gene-expression
    level rather than refining it to a transcription term.
  experiment_type: DNA-binding assays and ChIP-seq
- hypothesis: actC regulates the timing of sporulation but not sporulation competence.
  description: Score sporulation quantitatively in the actC null against DK1622 over a full developmental
    time course - heat- and sonication-resistant spore counts at 12, 18, 24, 48 and 72 h - rather than
    at a single endpoint. This directly tests the reading taken here, that the sporulation row is a timing
    effect at unchanged final competence, and it supplies the actC-specific sporulation datum that the
    cited paper's abstract does not state.
  experiment_type: quantitative sporulation time course
