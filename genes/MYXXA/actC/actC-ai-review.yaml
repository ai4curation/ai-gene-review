- term:
    id: GO:0031155
    label: regulation of reproductive fruiting body development
  evidence_type: IMP
  original_reference_id: PMID:11359579
  qualifier: involved_in
  review:
    summary: CACAO row, and the best-grounded of the three. The cited paper's actC null mutant forms many
      small fruiting bodies prematurely - a morphological phenotype of the fruiting-body programme itself,
      which the same authors later restate while citing this paper. The mechanism is the 15 h advance
      in CsgA production that the same mutant shows.
    action: ACCEPT
    reason: 'The claim, the gene and the paper all match, and the term is at the right altitude. PMID:17189369
      attributes the morphology to this reference in terms: deletion of actC led to the premature formation
      of many small fruiting bodies. That is modulation of the rate and pattern of fruiting-body development,
      which is what GO:0031155 asserts, and it is a regulation-of term rather than the developmental process
      itself, which is the correct device here - ActC performs the regulation, while the C-signalling
      cascade executes the morphogenesis. The granularity question is worth stating because it is the
      obvious objection: the paper''s primary actC measurement is csgA/CsgA timing, which is a step upstream,
      so one could argue the row is a phenotype read as a process. It is not, for two reasons. First,
      the fruiting-body phenotype is itself reported, not inferred. Second, C-signal is the direct and
      sufficient determinant of fruiting-body timing and size in this organism, so modulating its rise
      is modulating fruiting-body development rather than something several steps removed. The direct
      claim the paper also supports - negative regulation of csgA expression - is absent from GOA and
      is added as a NEW row rather than substituted for this one.'
