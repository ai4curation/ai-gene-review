- term:
    id: GO:0043937
    label: regulation of sporulation
  evidence_type: IMP
  original_reference_id: PMID:11359579
  qualifier: involved_in
  review:
    summary: CACAO row. Sporulation in Myxococcus xanthus is triggered by the highest C-signal levels,
      so a gene that sets when C-signal rises does modulate when sporulation is induced; the companion
      paper shows the actC null expresses sporulation-related reporters prematurely. But the sporulation
      phenotypes named in the cited abstract are actA's and actB's, not actC's, and no actC sporulation
      defect is reported in anything readable here.
    action: KEEP_AS_NON_CORE
    reason: 'The claim is defensible but sits a step further out than the fruiting-body row and is timing-only,
      which is what makes it non-core rather than core. What the cited abstract attributes to actC is
      the time pattern of CsgA production at an unchanged maximum level; the sporulation phenotype it
      names belongs to the other two genes - the actA and actB mutants aggregate and neither sporulates.
      The actC-specific sporulation evidence is in the companion paper PMID:11807078, where the actC null
      expresses aggregation- and sporulation-related reporters prematurely but those reporters ultimately
      reach wild-type levels, so the effect is on scheduling and not on sporulation competence. Keeping
      the row is nevertheless right on the biology, since C-signal is essential for sporulation and sporulation
      genes have a higher C-signal threshold than aggregation genes, which is precisely the threshold
      whose crossing time actC sets. It is also right under the curator-deference rule: PMID:11359579
      is not open access and our cache is abstract-only, the full text very likely reports spore yields
      for all four act mutants, and REMOVE on an IMP row from an abstract would be exactly the error this
      project has warned about. Non-core, not over-annotated: the term is as precise as the evidence warrants
      and the claim is not inflated, it is simply peripheral to ActC''s own job of restraining csgA expression.'
    additional_reference_ids:
    - PMID:11807078
    - PMID:17189369
    supported_by:
    - reference_id: PMID:11807078
      supporting_text: These mutations changed the expression of four gene reporters that are related
        to aggregation and sporulation and are expressed at 6 h or later in development
      reference_section_type: ABSTRACT
    - reference_id: PMID:11807078
      supporting_text: The other act null mutations caused either premature expression to wild-type levels
        (actC) or delayed expression (actD), which ultimately rose to wild-type levels
      reference_section_type: ABSTRACT
    - reference_id: PMID:17189369
      supporting_text: The cell-surface-associated, nondiffusible C signal is essential for both fruiting
        body formation and sporulation
      reference_section_type: INTRODUCTION
    - reference_id: PMID:17189369
      supporting_text: Sporulation genes have a higher threshold of C-signal intensity than genes for
        aggregation
      reference_section_type: INTRODUCTION
    - reference_id: PMID:11359579
      supporting_text: 'The act A and act B mutants have the same developmental phenotype: both aggregate,
        neither sporulates, both prolong rippling'
      reference_section_type: ABSTRACT
- term:
    id: GO:0010629
    label: negative regulation of gene expression
  evidence_type: IMP
  original_reference_id: PMID:11359579
  qualifier: involved_in
  review:
    action: NEW
    summary: ActC restrains the rise of csgA expression. Deleting it makes CsgA appear about 15 h early,
      at the normal maximum level, and makes C-signal-dependent reporters fire prematurely; the authors
      state the inference directly, that ActC inhibits the rise of csgA expression.
    reason: 'This is ActC''s own action and GOA states only its consequences. Three rows cover the downstream
      developmental and signalling effects; none says what the protein does, which is to hold csgA expression
      down until the right time. The participation test is satisfied by the entity question rather than
      by the knockout: the process is a decrease in the expression of a gene, and the entity that decreases
      it is ActC, not the C-signalling cascade that executes the development downstream. The polarity
      is unambiguous across three papers from the same group - precocious CsgA production (PMID:11359579),
      precocious C-signal-dependent reporter expression at unchanged final levels (PMID:11807078), and
      the explicit conclusion in PMID:17189369 - and it is specific rather than a general developmental
      delay, because early C-signal-independent expression is untouched in all four act mutants. Chosen
      deliberately at GO:0010629 rather than at GO:0045892 negative regulation of DNA-templated transcription:
      the reporters are transcriptional and the authors speak of csgA transcription, but ActC is a GNAT/Rossmann
      protein with no demonstrated DNA binding and the proposed mechanism has it acting as a labile inhibitor
      removed by the ActD protease, so the level at which it intervenes is not established and a transcription-specific
      term would assert more than is known. Proposed as the single missing term; no additional regulatory
      or metabolic terms are proposed, since nothing else about ActC''s activity has been measured.'
