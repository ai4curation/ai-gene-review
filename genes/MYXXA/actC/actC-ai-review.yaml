core_functions:
- description: 'Timing brake on C-signal production during fruiting-body development: ActC, expressed
    from the act operon, holds down the rise of csgA expression so that the CsgA morphogen accumulates
    on schedule. In its absence CsgA rises about 15 h early to the same maximum, C-signal-dependent aggregation
    and sporulation genes are expressed prematurely, and many small fruiting bodies form ahead of time,
    while C-signal-independent early development is unchanged. No molecular_function term is asserted:
    the protein carries a GNAT N-acetyltransferase domain and an NAD(P)-binding Rossmann-like domain,
    but no activity, acceptor substrate or target has been assayed, so the predicted N-acetyltransferase
    activity is a domain-level inference rather than an established core activity.'
