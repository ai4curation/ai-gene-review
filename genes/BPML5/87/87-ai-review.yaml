id: Q05304
gene_symbol: '87'
status: COMPLETE
taxon:
  id: NCBITaxon:31757
  label: Fromanvirus L5
description: >-
  Gp87 is a 53-amino-acid (6.2 kDa) protein of unknown function encoded by gene
  87 near the right end of the Mycobacterium phage L5 genome and belonging to the
  conserved DUF5419 family (PF17441 / IPR039451). It is the second open reading
  frame transcribed leftward from the early lytic promoter Pleft at the right end
  of the genome under the regulation of the immunity repressor gp71, and its
  specific biochemical role during phage infection remains uncharacterized.
existing_annotations: []
core_functions:
- description: >-
    Uncharacterized early lytic protein containing the DUF5419 domain
    (PF17441 / IPR039451) with unknown molecular function and biological process.
  supported_by:
  - reference_id: PMID:8459766
    supporting_text: >-
      We describe here the complete DNA sequence of the L5 genome and initial
      characterization of L5 virion structure and gene expression.
  - reference_id: file:genes/BPML5/87/87-uniprot.txt
    supporting_text: >-
      DR   Pfam; PF17441; DUF5419; 1.
references:
- id: PMID:8459766
  title: 'DNA sequence, structure and gene expression of mycobacteriophage L5: a phage
    system for mycobacterial genetics.'
  findings:
  - statement: >-
      Reports the complete DNA sequence and genome organization of
      mycobacteriophage L5, identifying gene 87 near the right end of the genome.
    supporting_text: >-
      We describe here the complete DNA sequence of the L5 genome and initial
      characterization of L5 virion structure and gene expression.
- id: PMID:8594325
  title: Transcriptional regulation of repressor synthesis in mycobacteriophage L5.
  findings:
  - statement: >-
      Shows that early lytic transcription initiates at the Pleft promoter at the
      right end of the genome and is regulated by the phage repressor gp71.
    supporting_text: >-
      In early lytic growth, gene 71 is also transcribed from a promoter, Pleft,
      located at the right end of the genome and which appears to be a target of
      gp71 regulation.
- id: file:genes/BPML5/87/87-uniprot.txt
  title: UniProtKB record for Q05304 (VG87_BPML5)
  findings:
  - statement: >-
      Documents that gene 87 encodes a 53-amino-acid protein (Gp87) containing the
      DUF5419 domain (PF17441 / IPR039451).
    supporting_text: >-
      DR   Pfam; PF17441; DUF5419; 1.
suggested_questions:
- question: >-
    What is the molecular function of the conserved DUF5419 domain in gp87 during
    the immediate-early stage of L5 infection?
suggested_experiments:
- description: >-
    Construct an in-frame deletion of gene 87 in Mycobacterium phage L5 and
    express tagged gp87 in Mycobacterium smegmatis to test for effects on early
    phage transcription and host cell viability.
  hypothesis: >-
    Gp87 acts as an immediate-early accessory polypeptide following transcription
    initiation from Pleft.
