suggested_questions:
- question: What is the molecular function of the conserved DUF4417 domain in L5 gp1 during phage infection or cos-site processing?
  experts:
  - Graham F. Hatfull
suggested_experiments:
- description: Generate an L5 gene 1 deletion mutant via BRED (bacteriophage recombineering of electroporated DNA) to test whether gp1 is essential for lytic growth or lysogeny in Mycobacterium smegmatis.
  hypothesis: Deletion of gene 1 will reveal whether gp1 is required for virion assembly, DNA packaging, or early lytic infection.
  experiment_type: Knockout/knockdown phenotype analysis
