  label: Fromanvirus L5
description: Uncharacterized 229-amino-acid protein (gp1) encoded at the extreme left end of the Mycobacterium phage L5 genome. It contains a conserved DUF4417 domain (PF14386 / IPR025530) shared among Cluster A mycobacteriophages, but its molecular function and role in the phage life cycle remain unknown.
