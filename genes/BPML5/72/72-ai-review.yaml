id: Q05287
gene_symbol: '72'
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:31757
  label: Fromanvirus L5
description: Gene 72 protein (gp72) of Mycobacterium phage L5 is an uncharacterized
  58-amino-acid protein encoded on the leftwards-transcribed right arm immediately
  upstream of the prophage immunity repressor gene 71 and downstream of the early
  lytic gene cluster (genes 73-88). It lacks recognizable sequence or structural domain
  signatures, and its specific molecular function during lytic growth or lysogeny
  has not been experimentally determined.
