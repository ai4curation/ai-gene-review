suggested_questions:
- question: Does the gene 72 coding region primarily serve as a cis-acting promoter
    regulatory element containing the lysogenic promoters upstream of gene 71, or
    does the 58-residue gp72 polypeptide itself play a functional role in modulating
    repressor synthesis or early lytic growth?
  experts:
  - Graham F. Hatfull
suggested_experiments:
- hypothesis: L5 gp72 modulates the establishment of lysogeny or early lytic transcription
    independently of the cis-acting lysogenic promoters embedded near its locus.
  description: Introduce a premature nonsense mutation into codon 2 of gene 72 in
    L5 (preserving the sequence and spacing of the upstream lysogenic promoters driving
    gene 71) and compare lysogenization frequency, prophage induction, and lytic plaque
    formation against wild-type L5 in Mycobacterium smegmatis.
  experiment_type: start/nonsense codon mutagenesis and lysogenization assay
