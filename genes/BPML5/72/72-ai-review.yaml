    reference_section_type: ABSTRACT
- id: PMID:8594325
  title: Transcriptional regulation of repressor synthesis in mycobacteriophage L5.
  full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Characterizes the promoter region upstream of gene 71 (spanning
      the gene 72 locus) active in L5 lysogens and early lytic growth.
  findings:
  - statement: Three promoters located upstream of gene 71 are active in an L5 lysogen,
      and early lytic transcription also initiates from Pleft at the right end of
      the genome.
    supporting_text: We show here that there are three promoters located upstream
      of gene 71 which are active in an L5 lysogen but which do not require any phage-encoded
      proteins. In early lytic growth, gene 71 is also transcribed from a promoter,
      Pleft, located at the right end of the genome and which appears to be a target
      of gp71 regulation.
    reference_section_type: ABSTRACT
