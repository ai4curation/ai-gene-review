  label: Fromanvirus L5
description: Gene 63 protein (gp63) of Mycobacterium phage L5 is an uncharacterized
  78-amino-acid protein encoded in the early leftwards-transcribed right-arm operon.
  It is the founding member of the conserved mycobacteriophage GP63 protein family
  (PF17471 / IPR035341), whose biochemical function and biological role in phage infection
  have not yet been determined.
