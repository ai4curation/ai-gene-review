id: Q05245
gene_symbol: '35'
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:31757
  label: Fromanvirus L5
description: Conserved 72-amino-acid uncharacterized protein (Gp35) encoded in the integration/early region of mycobacteriophage L5 between the integrase gene 33 (int) and the excisionase gene 36 (XIS). Contains a proline-rich N-terminal region and a C-terminal hydrophobic segment; its molecular function remains unknown.
existing_annotations: []
core_functions:
- description: Conserved 72-amino-acid protein encoded between the integrase (gene 33) and excisionase (gene 36) loci of mycobacteriophage L5; its molecular function remains uncharacterized.
