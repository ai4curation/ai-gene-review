suggested_questions:
- question: Does the hydrophobic C-terminal segment of Gp35 target it to the mycobacterial plasma membrane during lysogenic conversion or early lytic growth?
  experts:
  - Graham F. Hatfull
suggested_experiments:
- description: Express an epitope-tagged Gp35 fusion in Mycobacterium smegmatis and perform subcellular fractionation (membrane vs. cytosolic fractions) along with phage infection assays.
  hypothesis: Gp35 localizes to the host cell membrane via its C-terminal transmembrane-like helix.
