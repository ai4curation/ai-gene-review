id: Q05290
gene_symbol: '75'
status: COMPLETE
taxon:
  id: NCBITaxon:31757
  label: Fromanvirus L5
description: >-
  Gp75 is a small 43-amino-acid (4.9 kDa) protein of unknown function encoded by
  gene 75 in the right-arm early lytic region of Mycobacterium phage L5, belonging
  to the conserved Phage_gp75 family (PF26828 / IPR059710). It resides within the
  leftward-transcribed early operon between gene 76 and gene 74 under the control
  of the early lytic promoter Pleft and gp71 stoperator sites, and its biological
  role during phage infection has not yet been established.
existing_annotations: []
core_functions:
- description: >-
    Uncharacterized small early right-arm phage peptide (Phage_gp75 domain,
    PF26828) encoded within the leftward-transcribed early operon of Mycobacterium
    phage L5.
  supported_by:
  - reference_id: PMID:8459766
    supporting_text: >-
      We describe here the complete DNA sequence of the L5 genome and initial
      characterization of L5 virion structure and gene expression.
  - reference_id: file:genes/BPML5/75/75-uniprot.txt
    supporting_text: >-
      DR   Pfam; PF26828; Phage_gp75; 1.
references:
- id: PMID:8459766
  title: 'DNA sequence, structure and gene expression of mycobacteriophage L5: a phage
    system for mycobacterial genetics.'
  findings:
  - statement: >-
      Establishes the complete nucleotide sequence and genetic map of
      mycobacteriophage L5, placing gene 75 in the leftward-transcribed right-arm
      early region.
    supporting_text: >-
      We describe here the complete DNA sequence of the L5 genome and initial
      characterization of L5 virion structure and gene expression.
- id: PMID:9312049
  title: Transcriptional silencing by the mycobacteriophage L5 repressor.
  findings:
  - statement: >-
      Demonstrates that the L5 repressor gp71 controls early lytic transcription
      initiation at Pleft as well as downstream elongation via stoperator sites.
    supporting_text: >-
      L5 gp71 regulates transcription initiation at an early lytic promoter, Pleft,
      but also affects downstream gene expression at 'stoperator' sites in the
      phage genome.
- id: file:genes/BPML5/75/75-uniprot.txt
  title: UniProtKB record for Q05290 (VG75_BPML5)
  findings:
  - statement: >-
      Documents that gene 75 encodes a 43-amino-acid peptide (Gp75) classified in
      the Phage_gp75 domain family (PF26828 / IPR059710).
    supporting_text: >-
      DR   Pfam; PF26828; Phage_gp75; 1.
suggested_questions:
- question: >-
    Is the 43-amino-acid gp75 polypeptide translated during early lytic infection,
    and does it form a complex with neighboring right-arm early gene products?
suggested_experiments:
- description: >-
    Perform ribosome profiling (Ribo-seq) and targeted mass spectrometry of
    Mycobacterium smegmatis during early L5 infection, coupled with inducible
    overexpression of gp75 to test for effects on host growth or phage burst size.
  hypothesis: >-
    Gp75 is synthesized during early lytic infection and acts as a small peptide
    modulator of a host or phage protein complex.
