id: Q05227
gene_symbol: '21'
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:31757
  label: Fromanvirus L5
description: Conserved 111-amino-acid protein (gp21) containing a DUF5403 domain (IPR039452/PF17395), encoded in the head-tail junction region of the late structural operon of mycobacteriophage L5 immediately upstream of the tail terminator gene 22. Its precise molecular function in virion morphogenesis remains uncharacterized.
existing_annotations: []
core_functions:
- description: Conserved DUF5403-domain protein encoded in the head-tail junction region of the mycobacteriophage L5 late structural operon; its specific molecular activity in virion morphogenesis remains unknown.
