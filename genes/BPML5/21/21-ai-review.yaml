    supporting_text: DR   InterPro; IPR039452; DUF5403.
suggested_questions:
- question: Does gp21 act as a head-tail joining factor (neck protein) incorporated in low copy number into mature virions, or as a transient assembly chaperone during capsid-to-tail attachment?
  experts:
  - Graham F. Hatfull
  - Roger W. Hendrix
suggested_experiments:
- description: Generate a targeted deletion of gene 21 in an L5 prophage via BRED (Bacteriophage Recombineering of Electroporated DNA) and examine assembly intermediates by transmission electron microscopy to determine whether unattached heads and tails accumulate.
  hypothesis: Loss of gp21 will block head-to-tail joining or destabilize filled capsids prior to tail attachment.
