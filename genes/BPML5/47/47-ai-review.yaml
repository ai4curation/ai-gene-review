suggested_questions:
- question: Is gene 47 co-transcribed with the downstream nucleotide metabolism genes (48 and 50) and involved in modulating host or phage nucleotide pools?
  experts:
  - Graham F. Hatfull
  - Sujoy K. Das Gupta
suggested_experiments:
- description: Assess whether deletion of gene 47 affects phage L5 plaque formation, intracellular dNTP levels, or the stability of the Gp48-Gp50 nucleotide-metabolizing complex during lytic infection of Mycobacterium smegmatis.
  hypothesis: Gp47 may play an accessory role in the right-arm nucleotide metabolism module.
