  label: Fromanvirus L5
description: Uncharacterized 69-amino-acid protein (Gp47) encoded immediately upstream of the thymidylate synthase gene (gene 48) in the right arm of the Mycobacterium phage L5 genome. It belongs to the conserved phage L5 Gp47 domain family (IPR056973/PF23887) of unknown biochemical function.
existing_annotations: []
core_functions:
- description: Uncharacterized 69-amino-acid right-arm phage protein containing the conserved Phage_L5_Gp47 domain (IPR056973 / PF23887); specific molecular activity has not yet been experimentally determined.
