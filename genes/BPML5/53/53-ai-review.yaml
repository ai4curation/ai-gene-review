id: Q05269
gene_symbol: '53'
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:31757
  label: Fromanvirus L5
description: Uncharacterized 234-amino-acid protein (Gp53) encoded upstream of the metallophosphoesterase gene (gene 54) in the right arm of the Mycobacterium phage L5 genome. It belongs to the conserved mycobacteriophage Gp53 protein family (IPR057899/PF25684) of unknown biochemical function.
existing_annotations: []
core_functions:
- description: Uncharacterized 234-amino-acid right-arm phage protein containing the conserved Mycobacteriophage_Gp53 domain (IPR057899 / PF25684); specific molecular activity has not yet been experimentally determined.
