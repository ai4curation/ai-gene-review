suggested_questions:
- question: Why is the minor tail protein gene 6 located in the left arm upstream of the lysis cassette rather than within the main tail morphogenesis operon (genes 23-31)?
  experts:
  - Graham F. Hatfull
suggested_experiments:
- description: Perform immunogold cryo-electron microscopy of L5 virions using anti-gp6 antibodies to map the precise position of gp6 along the tail tube or tail tip.
  hypothesis: Gp6 forms a peripheral tail fiber or collar appendage on the L5 siphoviral tail.
  experiment_type: Cryo-electron microscopy
