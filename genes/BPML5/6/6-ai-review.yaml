description: Minor tail protein Gp6 (313 AA) of Mycobacterium phage L5, experimentally identified in mature virions by N-terminal protein sequencing (residues 2-12). It contains a conserved LtfC/Gp6 beta-sandwich domain (PF23926 / IPR055688) and functions as a structural component of the phage tail.
