  label: Fromanvirus L5
description: Flavin-dependent thymidylate synthase (ThyX / Gp48, 243 aa; EC 2.1.1.148) that catalyzes the reductive methylation of dUMP to dTMP using 5,10-methylenetetrahydrofolate as the one-carbon donor and FAD and NADPH as redox cofactors. Expressed early during lytic growth of Mycobacterium phage L5, Gp48 compensates for the decline in host ThyA activity and physically associates with the phage-encoded class II ribonucleotide reductase Gp50 to supply thymidylate precursors for viral DNA synthesis.
