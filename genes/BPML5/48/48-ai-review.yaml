- id: PMID:8459766
  title: 'DNA sequence, structure and gene expression of mycobacteriophage L5: a phage system for mycobacterial genetics.'
  findings:
  - statement: Complete nucleotide sequence of mycobacteriophage L5 identifying gene 48 in the right-arm replication and nucleotide metabolism cluster.
    supporting_text: We describe here the complete DNA sequence of the L5 genome and initial characterization of L5 virion structure and gene expression.
- id: PMID:18248423
  title: Cloning, characterization and expression analysis of nucleotide metabolism-related genes of mycobacteriophage L5.
  findings:
  - statement: Recombinant Gp48 was overexpressed in E. coli and biochemically characterized as a flavin-dependent thymidylate synthase (ThyX).
    supporting_text: It was established that Gp50 was a class II RNR having properties similar to that of the corresponding enzyme from Lactobacillus leichmanni, whereas Gp48 was a flavin-dependent thymidylate synthase (ThyX) that resembled the Paramecium bursaria chlorella virus-1 ThyX enzyme in its properties.
  - statement: Gp48 coimmunoprecipitates with Gp50 (ribonucleotide reductase), indicating a phage nucleotide-metabolizing complex.
    supporting_text: Gp48 and 50 were also found to coimmunoprecipitate, which indicates the possible existence of an L5 thymidylate synthase complex.
  - statement: Synthesis of viral ThyX (Gp48) compensates for a significant decrease in host ThyA activity during lytic phage infection.
    supporting_text: Thymidylate synthase assays revealed that during the intracellular stage of phage growth, a significant decrease in the host thymidylate synthase (ThyA) activity occurred. It appears that synthesis of the viral enzyme (ThyX) is necessary to compensate for this loss in activity.
- id: file:genes/BPML5/48/48-uniprot.txt
  title: 'UniProtKB record for Q05259 (THYX_BPML5: Probable flavin-dependent thymidylate synthase)'
  findings:
  - statement: Gp48 is annotated as a flavin-dependent thymidylate synthase (EC 2.1.1.148) of the ThyX family (IPR003669).
    supporting_text: 'DR   InterPro; IPR003669; Thymidylate_synthase_ThyX.'
  - statement: Catalyzes reductive methylation of dUMP to dTMP using 5,10-methylenetetrahydrofolate, NADPH, and FADH2.
    supporting_text: 'CC   -!- FUNCTION: Catalyzes the reductive methylation of 2''-deoxyuridine-5''-'
  - statement: Binds 4 FAD molecules per homotetramer at subunit interfaces.
    supporting_text: 'CC       Note=Binds 4 FAD per tetramer. Each FAD binding site is formed by three'
  - statement: Participates in the pyrimidine metabolism / dTTP biosynthesis pathway.
    supporting_text: 'CC   -!- PATHWAY: Pyrimidine metabolism; dTTP biosynthesis.'
suggested_questions:
- question: What is the structural basis of the interaction between Gp48 (ThyX) and Gp50 (class II ribonucleotide reductase), and does complex formation channel dUDP/dUMP intermediates during L5 infection?
  experts:
  - Sujoy K. Das Gupta
  - Graham F. Hatfull
suggested_experiments:
- description: Reconstitute the purified Gp48-Gp50 complex in vitro, determine its stoichiometry and structure by cryo-EM or X-ray crystallography, and measure steady-state kinetic parameters of Gp48 in the presence and absence of Gp50.
  hypothesis: Direct physical association between Gp48 and Gp50 coordinates deoxyribonucleotide and thymidylate synthesis during rapid phage DNA replication.
