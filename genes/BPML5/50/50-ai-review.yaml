- id: PMID:8459766
  title: 'DNA sequence, structure and gene expression of mycobacteriophage L5: a phage system for mycobacterial genetics.'
  findings:
  - statement: Complete nucleotide sequence of mycobacteriophage L5 identifying gene 50 in the right-arm nucleotide metabolism module.
    supporting_text: We describe here the complete DNA sequence of the L5 genome and initial characterization of L5 virion structure and gene expression.
- id: PMID:18248423
  title: Cloning, characterization and expression analysis of nucleotide metabolism-related genes of mycobacteriophage L5.
  findings:
  - statement: Overexpression and biochemical characterization of Gp50 established that it is a class II adenosylcobalamin-dependent ribonucleotide reductase resembling the Lactobacillus leichmannii enzyme.
    supporting_text: It was established that Gp50 was a class II RNR having properties similar to that of the corresponding enzyme from Lactobacillus leichmanni, whereas Gp48 was a flavin-dependent thymidylate synthase (ThyX) that resembled the Paramecium bursaria chlorella virus-1 ThyX enzyme in its properties.
  - statement: Gp50 coimmunoprecipitates with Gp48 (flavin-dependent thymidylate synthase), indicating formation of a nucleotide-metabolizing complex during lytic growth.
    supporting_text: Gp48 and 50 were also found to coimmunoprecipitate, which indicates the possible existence of an L5 thymidylate synthase complex.
- id: PMID:24913246
  title: Mycobacteriophage L5Gp56, a novel member of the NrdH family of redoxins.
  findings:
  - statement: Both phage-encoded NrdH redoxin Gp56 and host thioredoxin TrxB are capable of reducing Gp50 to support its catalytic cycle.
    supporting_text: The abilities of Gp56 and TrxB to reduce Gp50, the L5-encoded ribonucleotide reductase, was examined. While both are capable of executing this function, the former needs more reducing equivalents in the process as compared with the latter.
- id: file:genes/BPML5/50/50-uniprot.txt
  title: 'UniProtKB record for Q05262 (VG50_BPML5: Putative adenosylcobalamin-dependent ribonucleoside-triphosphate reductase)'
  findings:
  - statement: Gp50 is a 682-amino-acid class II adenosylcobalamin-dependent ribonucleoside-triphosphate reductase (EC 1.17.4.2).
    supporting_text: 'DR   InterPro; IPR013345; RTP_Rdtase_AdoCbl-dep.'
  - statement: Catalyzes the thioredoxin-dependent reduction of ribonucleoside 5'-triphosphates to 2'-deoxyribonucleoside 5'-triphosphates (RHEA:12701).
    supporting_text: 'CC       Reaction=a 2''-deoxyribonucleoside 5''-triphosphate + [thioredoxin]-'
  - statement: Uses adenosylcob(III)alamin (CHEBI:18408) as cofactor.
    supporting_text: 'CC       Name=adenosylcob(III)alamin; Xref=ChEBI:CHEBI:18408;'
suggested_questions:
- question: What is the relative physiological contribution of phage-encoded NrdH (Gp56) versus host thioredoxin (TrxB) to Gp50 reduction during lytic infection of Mycobacterium smegmatis?
  experts:
  - Sujoy K. Das Gupta
  - Graham F. Hatfull
suggested_experiments:
- description: Measure intracellular dNTP pools and phage L5 burst size in wild-type versus gene 56-deleted L5 infections of Mycobacterium smegmatis under normal and B12-supplemented conditions.
  hypothesis: Phage-encoded Gp56 provides dedicated redox support to Gp50 when host thioredoxin pools are depleted or oxidized during late lytic infection.
