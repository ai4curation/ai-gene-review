  label: Fromanvirus L5
description: Class II adenosylcobalamin-dependent ribonucleoside-triphosphate reductase (Gp50, 682 aa; EC 1.17.4.2) that catalyzes the reduction of ribonucleoside 5'-triphosphates to 2'-deoxyribonucleoside 5'-triphosphates using either the phage-encoded NrdH-like redoxin Gp56 or host thioredoxin as electron donor. Expressed early in the lytic cycle of Mycobacterium phage L5, Gp50 physically associates with the phage-encoded thymidylate synthase Gp48 (ThyX) to provide dNTP precursors for viral genome replication.
