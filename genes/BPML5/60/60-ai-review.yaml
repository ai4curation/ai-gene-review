suggested_questions:
- question: Is gene 60 essential or dispensable for Mycobacterium phage L5 lytic growth
    and lysogeny in Mycobacterium smegmatis?
  experts:
  - Graham F. Hatfull
suggested_experiments:
- hypothesis: L5 gp60 is a non-essential early accessory protein that modulates host
    or phage replication/recombination machinery through protein-protein interactions.
  description: Construct an in-frame deletion of gene 60 in L5 using bacteriophage
    recombineering of electroporated DNA (BRED) to test essentiality, and perform
    affinity purification-mass spectrometry (AP-MS) of epitope-tagged gp60 in infected
    Mycobacterium smegmatis cells.
  experiment_type: BRED gene deletion and affinity purification-mass spectrometry
