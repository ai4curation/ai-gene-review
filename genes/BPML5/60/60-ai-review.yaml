id: Q05273
gene_symbol: '60'
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:31757
  label: Fromanvirus L5
description: Gene 60 protein (gp60) of Mycobacterium phage L5 is an uncharacterized
  47-amino-acid protein encoded in the early leftwards-transcribed right-arm operon
  between the Holliday junction resolvase gene 59 and gene 61. It contains a conserved
  domain of unknown function (DUF7429; PF24206 / IPR055852) found across related
  actinobacteriophages, but its specific molecular activity and role in the phage
  replication cycle remain unknown.
