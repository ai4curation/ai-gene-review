id: Q05265
gene_symbol: '55'
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:31757
  label: Fromanvirus L5
description: Uncharacterized 156-amino-acid protein (Gp55) encoded between the metallophosphoesterase gene (gene 54) and the NrdH-like redoxin gene (gene 56) in the right arm of the Mycobacterium phage L5 genome. It contains a DUF6378 domain (IPR045958/PF19905) and a C-terminal disordered region (residues 132-156), and its molecular function remains unknown.
existing_annotations: []
core_functions:
- description: Uncharacterized 156-amino-acid right-arm phage protein containing a conserved DUF6378 domain (IPR045958 / PF19905); specific molecular activity has not yet been experimentally determined.
