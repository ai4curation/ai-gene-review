  - Sujoy K. Das Gupta
suggested_experiments:
- description: Construct a targeted deletion of gene 55 in Mycobacterium phage L5 and test its impact on lytic replication efficiency and dNTP biosynthesis in Mycobacterium smegmatis.
  hypothesis: Located between the metallophosphoesterase gene 54 and the NrdH redoxin gene 56, Gp55 may play an accessory role in nucleotide metabolism or DNA replication.
