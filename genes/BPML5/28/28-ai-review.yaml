  label: Fromanvirus L5
description: Minor tail protein (Gp28, 596 aa) of mycobacteriophage L5, experimentally confirmed in mature virions by N-terminal amino acid sequencing (residues 2-9 after initiator methionine removal). Contains a conserved siphoviral Gp28/Gp37-like distal tail domain (IPR029432/PF14594) and forms a core structural component of the distal tail tip complex required for viral tail assembly.
