description: DNA-directed DNA polymerase (Gp44, 595 aa) belonging to the DNA polymerase type-A (Pol I) family that replicates the Mycobacterium phage L5 dsDNA genome. It comprises an N-terminal 3'-5' proofreading exonuclease domain (residues 1-212) and a C-terminal DNA polymerase catalytic domain (residues 213-595), and lacks a 5'-3' exonuclease domain.
