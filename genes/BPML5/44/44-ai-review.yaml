- id: PMID:8459766
  title: 'DNA sequence, structure and gene expression of mycobacteriophage L5: a phage system for mycobacterial genetics.'
  findings:
  - statement: Complete nucleotide sequence of mycobacteriophage L5 identifying gene 44 as the phage-encoded DNA polymerase I homolog.
    supporting_text: We describe here the complete DNA sequence of the L5 genome and initial characterization of L5 virion structure and gene expression.
- id: PMID:9636706
  title: 'Genome structure of mycobacteriophage D29: implications for phage evolution.'
  findings:
  - statement: Comparative genome analysis showing conservation of the L5 and D29 replication modules.
    supporting_text: The overall organization of the D29 genome is similar to that of L5, although a 3.6 kb deletion removing the repressor gene accounts for the inability of D29 to form lysogens.
- id: file:genes/BPML5/44/44-uniprot.txt
  title: 'UniProtKB record for Q05254 (DPOL_BPML5: DNA polymerase)'
  findings:
  - statement: Gp44 is a 595-amino-acid type-A DNA polymerase (EC 2.7.7.7) with an N-terminal 3'-5' exonuclease domain (residues 1-212) and a C-terminal polymerase domain (residues 213-595).
    supporting_text: 'DR   InterPro; IPR002298; DNA_polymerase_A.'
  - statement: Gp44 replicates viral genomic DNA and possesses both DNA polymerase and 3'-5' exonuclease activities.
    supporting_text: 'CC   -!- FUNCTION: Replicates viral genomic DNA. This polymerase possesses two'
  - statement: The N-terminal exonuclease domain degrades single-stranded DNA in the 3'-5' direction.
    supporting_text: 'CC       activity that degrades single-stranded DNA in the 3''-5'' direction.'
suggested_questions:
- question: Does Mycobacterium phage L5 Gp44 require a host or phage-encoded processivity factor (such as a thioredoxin/NrdH or sliding clamp) for processive viral genome synthesis?
  experts:
  - Graham F. Hatfull
  - Sujoy K. Das Gupta
suggested_experiments:
- description: Purify recombinant Gp44 and assay its primer extension rate, processivity, and 3'-5' exonuclease proofreading activity on primed single-stranded M13 DNA in the presence and absence of L5 Gp56 (NrdH redoxin) or host Mycobacterium smegmatis thioredoxin.
  hypothesis: Gp44 catalyzes both template-directed DNA polymerization and 3'-5' proofreading exonuclease cleavage, and its processivity may be modulated by phage or host accessory factors.
