  label: Fromanvirus L5
description: Minor tail protein and tape measure protein (Gp26, 837 aa) of mycobacteriophage L5, confirmed as a virion component by N-terminal amino acid sequencing (residues 2-11 after initiator methionine cleavage). Encoded immediately downstream of the gp24/gp25 tail assembly chaperones, Gp26 spans the lumen of the tail tube and serves as the molecular ruler that determines tail length during siphoviral tail assembly.
