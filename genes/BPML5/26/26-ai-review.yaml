references:
- id: PMID:8459766
  title: 'DNA sequence, structure and gene expression of mycobacteriophage L5: a phage system for mycobacterial genetics.'
  findings:
  - statement: Genome sequencing and N-terminal protein sequencing (residues 2-11) of purified L5 virions identified gp26 as an 837-amino-acid minor tail protein (tape measure protein).
    supporting_text: We describe here the complete DNA sequence of the L5 genome and initial characterization of L5 virion structure and gene expression.
- id: PMID:15469818
  title: Conserved translational frameshift in dsDNA bacteriophage tail assembly genes.
  findings:
  - statement: Established that phages with noncontractile tails whose length is controlled by a tape measure protein conserve upstream frameshifted tail assembly chaperones that coat the tape measure protein during tail assembly.
    supporting_text: Frameshifting sites could be identified for most phages with contractile or noncontractile tails whose length is controlled by a tape measure protein.
