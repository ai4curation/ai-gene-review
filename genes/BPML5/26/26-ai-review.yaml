suggested_experiments:
- description: Construct internal in-frame deletions and duplications within the alpha-helical repeat region of gene 26 and measure mature L5 tail lengths by transmission electron microscopy.
  hypothesis: Tail tube length in mature L5 virions scales linearly (~0.15 nm per amino acid residue) with the length of Gp26.
