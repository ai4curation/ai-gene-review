  label: Fromanvirus L5
description: Gene 62 protein (gp62) of Mycobacterium phage L5 is an uncharacterized
  51-amino-acid protein encoded in the early leftwards-transcribed right-arm operon.
  It is the founding member of the conserved Mycophage_gp62 protein family (PF26824
  / IPR059534) found across related mycobacteriophages, but its biochemical function
  and biological role in the phage life cycle remain unknown.
