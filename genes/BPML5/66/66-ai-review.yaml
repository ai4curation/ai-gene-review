  review:
    summary: Electronic mapping from IPR004843 (Calcineurin-like phosphoesterase).
      Hydrolase activity is correct but overly general given that IPR004843 specifically
      identifies a phosphoesterase domain.
    action: MODIFY
    reason: Because IPR004843 (PF00149 Metallophos) is a calcineurin-like phosphoesterase
      domain that hydrolyzes phosphoester bonds, the broad hydrolase term GO:0016787
      should be refined to its descendant GO:0016788 (hydrolase activity, acting on
      ester bonds), which captures phosphoesterase activity without over-specifying
      whether the physiological substrate is a phosphomonoester or phosphodiester.
    proposed_replacement_terms:
    - id: GO:0016788
      label: hydrolase activity, acting on ester bonds
