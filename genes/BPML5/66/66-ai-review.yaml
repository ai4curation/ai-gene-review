taxon:
  id: NCBITaxon:31757
  label: Fromanvirus L5
description: Gene 66 protein (gp66) of Mycobacterium phage L5 is a 207-amino-acid
  metallophosphoesterase encoded in the early leftwards-transcribed right-arm operon
  adjacent to the phage DNA replication cluster. Nearly the entire polypeptide (residues
  7-194) forms a calcineurin-like phosphoesterase domain (PF00149 / IPR004843) of
  the metallo-dependent phosphatase superfamily (IPR029052 / SSF56300), which coordinates
  divalent metal ions to catalyze the hydrolysis of phosphoester bonds, although its
  physiological substrate during mycobacteriophage infection has not yet been identified.
