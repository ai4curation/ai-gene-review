suggested_questions:
- question: Is L5 gp66 a nucleic acid phosphodiesterase/exonuclease acting in phage
    DNA replication and repair, a cyclic nucleotide phosphodiesterase that degrades
    host immune signaling molecules, or a protein phosphatase?
  experts:
  - Graham F. Hatfull
suggested_experiments:
- hypothesis: L5 gp66 is a Mn2+/Ni2+-dependent phosphoesterase that hydrolyzes phosphodiester
    or phosphomonoester substrates during early lytic infection.
  description: Purify recombinant L5 gp66 and screen phosphatase and phosphodiesterase
    activity against bis-p-nitrophenyl phosphate (bis-pNPP), pNPP, 2',3'-cAMP, cyclic
    dinucleotides (c-di-AMP, c-di-GMP, 3',3'-cGAMP), and single-stranded DNA substrates
    across divalent metal cofactors (Mn2+, Ni2+, Zn2+, Mg2+).
  experiment_type: in vitro metallophosphoesterase substrate profiling
