suggested_questions:
- question: Does Gp43 act as a processivity factor or accessory subunit for the adjacent phage DNA polymerase Gp44?
  experts:
  - Graham F. Hatfull
suggested_experiments:
- description: Test for a direct physical interaction between recombinant purified Gp43 and L5 DNA polymerase Gp44 using size-exclusion chromatography and surface plasmon resonance, and assay whether Gp43 stimulates Gp44 primer extension activity in vitro.
  hypothesis: Because gene 43 is immediately upstream of and co-oriented with the DNA polymerase gene 44, Gp43 may function as an accessory replication factor.
