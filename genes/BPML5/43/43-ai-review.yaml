  label: Fromanvirus L5
description: Uncharacterized 77-amino-acid protein (Gp43) encoded immediately upstream of the DNA polymerase gene (gene 44) in the right arm of the Mycobacterium phage L5 genome. Its molecular function and role in phage replication have not been determined.
existing_annotations: []
