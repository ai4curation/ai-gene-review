suggested_questions:
- question: Given its genomic location directly between genes 48 (ThyX) and 50 (RNR), does Gp49 scaffold or regulate the Gp48-Gp50 nucleotide-metabolizing complex?
  experts:
  - Sujoy K. Das Gupta
  - Graham F. Hatfull
suggested_experiments:
- description: Test whether Gp49 co-immunoprecipitates with Gp48 and Gp50 from phage L5-infected Mycobacterium smegmatis lysates and whether its proline- and glycine-rich disordered linkers mediate complex assembly.
  hypothesis: Gp49 may act as an adapter or regulatory subunit bridging Gp48 and Gp50 in the viral nucleotide biosynthesis complex.
