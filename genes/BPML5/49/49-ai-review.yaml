id: Q05261
gene_symbol: '49'
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:31757
  label: Fromanvirus L5
description: Uncharacterized 179-amino-acid protein (Gp49) encoded between the thymidylate synthase gene (gene 48) and the ribonucleotide reductase gene (gene 50) in the right arm of the Mycobacterium phage L5 genome. It belongs to the conserved phage Gp49 family (IPR057999/PF25690) and contains N-terminal proline-rich (residues 1-38) and central glycine-rich (residues 102-137) intrinsically disordered regions, but its biochemical function remains unknown.
existing_annotations: []
core_functions:
- description: Uncharacterized 179-amino-acid right-arm phage protein containing the conserved Phage_gp49 domain (IPR057999 / PF25690) and intrinsically disordered proline- and glycine-rich segments; specific molecular activity has not yet been experimentally determined.
