suggested_questions:
- question: Does L5 gp69 act as a 5'-to-3' exonuclease (analogous to phage RecE/Exo)
    that generates 3' single-stranded DNA overhangs for phage homologous recombination?
  experts:
  - Graham F. Hatfull
suggested_experiments:
- hypothesis: L5 gp69 is a Mg2+/Mn2+-dependent DNA exonuclease that resects double-stranded
    DNA ends to promote homologous recombination.
  description: Purify wild-type L5 gp69 and a catalytic PD-(D/E)XK active-site mutant,
    and assay degradation of 5'- or 3'-end-labeled linear dsDNA, ssDNA, and closed
    circular plasmid DNA substrates in vitro.
  experiment_type: in vitro exonuclease and endonuclease polarity assay
