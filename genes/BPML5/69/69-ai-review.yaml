  label: Fromanvirus L5
description: Gene 69 protein (gp69) of Mycobacterium phage L5 is a 290-amino-acid
  PD-(D/E)XK superfamily nuclease encoded in the early leftwards-transcribed right-arm
  operon downstream of the immunity repressor region. Its C-terminal region (residues
  99-282) forms an AddAB-type PD-(D/E)XK nuclease domain (PF12705 / IPR038726 / IPR011604)
  with a restriction endonuclease type II-like core fold (IPR011335 / SSF52980) predicted
  to catalyze divalent metal-dependent nucleic acid cleavage during phage DNA replication,
  recombination, or repair.
