  label: Fromanvirus L5
description: Putative HNH homing endonuclease (gp4, 98 AA) encoded in the left arm of the Mycobacterium phage L5 genome immediately upstream of the putative small terminase subunit gp5. It contains a conserved HNH nuclease domain (residues 38-73; PF01844 / IPR002711) with paired CxxC zinc-coordinating motifs and a basic C-terminal tail characteristic of phage DNA endonucleases.
