suggested_questions:
- question: Does L5 gp4 function as a freestanding mobile homing endonuclease or as an accessory cos-site cleavage/packaging factor alongside gp5 and gp13?
  experts:
  - Graham F. Hatfull
suggested_experiments:
- description: Purify recombinant L5 gp4 and assay divalent cation-dependent endonuclease activity on supercoiled and linear L5 cos-site DNA substrates in vitro.
  hypothesis: L5 gp4 will exhibit site-specific or nicking endonuclease activity on phage DNA in the presence of Mg2+ or Mn2+ and structural Zn2+.
  experiment_type: In vitro biochemical assay
