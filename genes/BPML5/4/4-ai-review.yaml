  review:
    summary: HNH domain proteins bind double-stranded DNA substrates rather than generic nucleic acids; refine to DNA binding (GO:0003677).
    action: MODIFY
    reason: L5 gp4 contains a phage HNH homing endonuclease domain (IPR002711 / PF01844) and a basic C-terminal region that bind double-stranded DNA substrates, making DNA binding (GO:0003677) more specific than nucleic acid binding.
