id: Q05305
gene_symbol: '88'
status: COMPLETE
taxon:
  id: NCBITaxon:31757
  label: Fromanvirus L5
description: >-
  Gp88 is a 239-amino-acid (26.5 kDa) protein of unknown function encoded by gene
  88, the rightmost open reading frame of Mycobacterium phage L5, and belongs to
  the conserved GP88 domain family (PF17338 / IPR020290). Positioned immediately
  downstream of the early lytic promoter Pleft at the right end of the genome,
  gene 88 is the first coding sequence transcribed upon early lytic infection
  under the control of the gp71 repressor, although its biochemical activity and
  cellular target remain uncharacterized.
existing_annotations: []
core_functions:
- description: >-
    Uncharacterized immediate-early lytic protein containing the GP88 domain
    (PF17338 / IPR020290) with unknown molecular function and biological process.
  supported_by:
  - reference_id: PMID:8459766
    supporting_text: >-
      We describe here the complete DNA sequence of the L5 genome and initial
      characterization of L5 virion structure and gene expression.
  - reference_id: file:genes/BPML5/88/88-uniprot.txt
    supporting_text: >-
      DR   Pfam; PF17338; GP88; 1.
references:
- id: PMID:8459766
  title: 'DNA sequence, structure and gene expression of mycobacteriophage L5: a phage
    system for mycobacterial genetics.'
  findings:
  - statement: >-
      Reports the complete DNA sequence and genome organization of
      mycobacteriophage L5, identifying gene 88 as the rightmost protein-coding
      gene at the right end of the genome.
    supporting_text: >-
      We describe here the complete DNA sequence of the L5 genome and initial
      characterization of L5 virion structure and gene expression.
- id: PMID:8594325
  title: Transcriptional regulation of repressor synthesis in mycobacteriophage L5.
  findings:
  - statement: >-
      Demonstrates that early lytic transcription in the right arm initiates at
      the Pleft promoter located at the right end of the L5 genome and is a
      target of gp71 regulation.
    supporting_text: >-
      In early lytic growth, gene 71 is also transcribed from a promoter, Pleft,
      located at the right end of the genome and which appears to be a target of
      gp71 regulation.
- id: PMID:9312049
  title: Transcriptional silencing by the mycobacteriophage L5 repressor.
  findings:
  - statement: >-
      Shows that the L5 repressor gp71 regulates transcription initiation at the
      early lytic promoter Pleft and silences downstream expression via oriented
      stoperator sites.
    supporting_text: >-
      L5 gp71 regulates transcription initiation at an early lytic promoter, Pleft,
      but also affects downstream gene expression at 'stoperator' sites in the
      phage genome.
- id: file:genes/BPML5/88/88-uniprot.txt
  title: UniProtKB record for Q05305 (VG88_BPML5)
  findings:
  - statement: >-
      Documents that gene 88 encodes a 239-amino-acid protein (Gp88) classified in
      the GP88 domain family (PF17338 / IPR020290).
    supporting_text: >-
      DR   Pfam; PF17338; GP88; 1.
suggested_questions:
- question: >-
    As the very first protein translated from the early lytic promoter Pleft,
    does gp88 initiate host takeover or anti-defense functions in Mycobacterium
    smegmatis?
suggested_experiments:
- description: >-
    Perform affinity purification-mass spectrometry (AP-MS) of tagged gp88 in
    Mycobacterium smegmatis and characterize the plaque and burst-size phenotypes
    of a phage L5 gene 88 deletion mutant.
  hypothesis: >-
    Gp88 acts in the host cytoplasm immediately after DNA injection to establish
    conditions permissive for early phage gene expression or replication.
