suggested_questions:
- question: Is Gp51 an accessory subunit of the L5 nucleotide metabolism complex (Gp48-Gp50) or an independent early/middle lytic factor?
  experts:
  - Graham F. Hatfull
  - Sujoy K. Das Gupta
suggested_experiments:
- description: Perform pull-down assays using tagged Gp51 in L5-infected Mycobacterium smegmatis extracts and assess the phenotype of a gene 51 deletion mutant.
  hypothesis: Gp51 may interact with components of the phage nucleotide metabolism or replication machinery encoded in the surrounding operon.
