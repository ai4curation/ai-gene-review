id: Q05263
gene_symbol: '51'
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:31757
  label: Fromanvirus L5
description: Uncharacterized 67-amino-acid protein (Gp51) encoded immediately downstream of the ribonucleotide reductase gene (gene 50) in the right arm of the Mycobacterium phage L5 genome. It belongs to the conserved phage Gp51 family (IPR059529/PF26826) of unknown molecular function.
existing_annotations: []
core_functions:
- description: Uncharacterized 67-amino-acid right-arm phage protein containing the conserved Phage_gp51 domain (IPR059529 / PF26826); specific molecular activity has not yet been experimentally determined.
  supported_by:
