references:
- id: GO_REF:0000043
  title: Gene Ontology annotation based on UniProtKB/Swiss-Prot keyword mapping
  findings: []
- id: PMID:8459766
  title: 'DNA sequence, structure and gene expression of mycobacteriophage L5: a phage system for mycobacterial genetics.'
  findings:
  - statement: Genome sequencing of mycobacteriophage L5 identified gene 24 in the tail morphogenesis cluster between the major tail subunit gene 23 and the tape measure protein gene 26.
    supporting_text: We describe here the complete DNA sequence of the L5 genome and initial characterization of L5 virion structure and gene expression.
- id: PMID:15469818
  title: Conserved translational frameshift in dsDNA bacteriophage tail assembly genes.
  findings:
  - statement: Demonstrated that dsDNA bacteriophage tail assembly genes located between the major tail subunit and tape measure protein utilize a strongly conserved programmed translational frameshift to produce two overlapping tail assembly chaperones analogous to lambda gpG and gpGT.
    supporting_text: A programmed translational frameshift similar to frameshifts in retroviral gag-pol genes and bacterial insertion elements was found to be strongly conserved in tail assembly genes of dsDNA phages and to be independent of sequence similarities. In bacteriophage lambda, this frameshift controls production of two proteins with overlapping sequences, gpG and gpGT, that are required for tail assembly.
- id: file:genes/BPML5/24/24-uniprot.txt
  title: UniProtKB record for Q05231 (VG24_BPML5)
  findings:
  - statement: Gp24 (132 aa) is the shorter isoform produced by conventional translation and functions with Gp25 (Q05232) as a tail assembly scaffold that is released during tail tube polymerization.
    supporting_text: 'CC   -!- FUNCTION: Promotes tail assembly by creating a scaffold for the tail'
suggested_questions:
- question: What is the exact stoichiometry of L5 Gp24 to Gp25 produced by the programmed -1 frameshift in Mycobacterium smegmatis, and how does Gp24 prevent premature aggregation of the 837-aa tape measure protein Gp26?
  experts:
  - Roger W. Hendrix
  - Robert L. Duda
  - Graham F. Hatfull
suggested_experiments:
- description: Co-express His-tagged Gp26 (tape measure protein) with and without Gp24/Gp25 in Mycobacterium smegmatis or Escherichia coli and assess Gp26 solubility and complex formation by size-exclusion chromatography and native mass spectrometry.
  hypothesis: Gp24 binds directly along the length of Gp26 to maintain it in a soluble, assembly-competent conformation prior to Gp23 polymerization.
