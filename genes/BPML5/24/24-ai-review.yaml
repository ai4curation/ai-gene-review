existing_annotations:
- term:
    id: GO:0075523
    label: viral translational frameshifting
  evidence_type: IEA
  original_reference_id: GO_REF:0000043
  qualifier: involved_in
  supporting_entities:
  - UniProtKB-KW:KW-0688
  review:
    summary: Automated keyword mapping from UniProtKB-KW:KW-0688 (Ribosomal frameshifting) reflects how the overlapping gp24/gp25 mRNA is translated rather than a biological process carried out by the Gp24 protein.
    action: REMOVE
    reason: Programmed -1 translational frameshifting is directed by a cis-acting mRNA frameshift signal between open reading frames 24 and 25 during translation by the host ribosome; the Gp24 polypeptide itself does not catalyze or regulate translational frameshifting.
    supported_by:
    - reference_id: PMID:15469818
      supporting_text: A programmed translational frameshift similar to frameshifts in retroviral gag-pol genes and bacterial insertion elements was found to be strongly conserved in tail assembly genes of dsDNA phages and to be independent of sequence similarities.
- term:
    id: GO:0098003
    label: viral tail assembly
  evidence_type: IEA
  original_reference_id: GO_REF:0000043
  qualifier: involved_in
  supporting_entities:
  - UniProtKB-KW:KW-1245
  review:
    summary: Gp24 is the canonical siphoviral tail assembly chaperone (analogous to phage lambda gpG) that scaffolds tail tube polymerization around the tape measure protein.
    action: ACCEPT
    reason: Conserved genomic position between the major tail subunit (gene 23) and tape measure protein (gene 26), conserved -1 translational frameshifting with gene 25, and homology to the Gp24/Gp25 tail assembly chaperone family (IPR020132) support its essential role in viral tail assembly.
    supported_by:
    - reference_id: PMID:15469818
      supporting_text: In bacteriophage lambda, this frameshift controls production of two proteins with overlapping sequences, gpG and gpGT, that are required for tail assembly.
    - reference_id: file:genes/BPML5/24/24-uniprot.txt
      supporting_text: 'CC   -!- FUNCTION: Promotes tail assembly by creating a scaffold for the tail'
core_functions:
- description: Acts as a non-structural tail assembly chaperone that, in a defined stoichiometric ratio with the frameshifted Gp25 fusion protein, coats the tape measure protein (Gp26) to scaffold polymerization of the major tail subunit (Gp23) during viral tail assembly.
