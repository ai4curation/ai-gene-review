  label: Fromanvirus L5
description: Tail assembly chaperone protein (Gp24, 132 aa) encoded between the major tail subunit gene 23 and the tape measure protein gene 26 in mycobacteriophage L5. Produced by conventional translation, Gp24 acts together with the frameshifted fusion protein Gp25 (Q05232) to coat the tape measure protein (Gp26) and scaffold polymerization of the major tail tube subunit (Gp23) without being incorporated into mature virions.
