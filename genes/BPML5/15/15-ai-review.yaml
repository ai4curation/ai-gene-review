  label: Fromanvirus L5
description: Uncharacterized 294-amino-acid protein (gp15) encoded in the head morphogenesis gene cluster of Mycobacterium phage L5 between the portal protein (gp14) and the capsid assembly scaffolding protein (gp16). It contains the conserved mycobacteriophage VG15 domain (PF25310 / IPR057369), though its specific biochemical role in virion head morphogenesis remains uncharacterized.
existing_annotations: []
core_functions:
- description: Conserved VG15-family protein (gp15, IPR057369/PF25310) encoded between the portal protein (gp14) and scaffolding protein (gp16) in the Mycobacterium phage L5 head morphogenesis operon; its specific molecular activity in capsid assembly remains unknown.
  supported_by:
