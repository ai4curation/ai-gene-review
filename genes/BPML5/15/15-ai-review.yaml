suggested_questions:
- question: Does L5 gp15 act as a prohead maturation factor, minor head component, or covalent cross-linking cofactor during gp17 capsid shell maturation?
  experts:
  - Graham F. Hatfull
suggested_experiments:
- description: Co-express L5 gp14 (portal), gp15, gp16 (scaffolding), and gp17 (major capsid) in Mycobacterium smegmatis with and without gp15, and examine procapsid assembly and gp17 cross-linking by SDS-PAGE and electron microscopy.
  hypothesis: Gp15 facilitates procapsid maturation or covalent cross-linking of major capsid protein gp17 subunits.
  experiment_type: Virion assembly assay
