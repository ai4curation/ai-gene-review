  label: Fromanvirus L5
description: Major capsid protein (gp17, 326 AA) of Mycobacterium phage L5 belonging to the HK97 gp5-like phage capsid family (PF05065 / IPR024455 / TIGR01554). Experimentally verified by N-terminal protein sequencing (residues 2-11), gp17 subunits polymerize around the gp16 scaffolding core and undergo extensive covalent cross-linking to form the icosahedral head shell that encapsulates the viral dsDNA genome.
