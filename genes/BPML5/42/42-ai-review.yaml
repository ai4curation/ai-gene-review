suggested_questions:
- question: Is gene 42 required for phage L5 DNA replication or host takeover during early lytic infection?
  experts:
  - Graham F. Hatfull
suggested_experiments:
- description: Construct a targeted gene 42 deletion mutant in Mycobacterium phage L5 via BRED and evaluate plaque morphology and burst size on Mycobacterium smegmatis.
  hypothesis: Loss of gene 42 will indicate whether Gp42 performs an essential or accessory function during lytic growth.
