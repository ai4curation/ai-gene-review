id: Q05288
gene_symbol: '73'
status: COMPLETE
taxon:
  id: NCBITaxon:31757
  label: Fromanvirus L5
description: >-
  Gp73 is an 85-amino-acid (10.3 kDa) protein of unknown function encoded by gene
  73 in the right-arm early region of Mycobacterium phage L5, belonging to the
  conserved mycobacteriophage gp73 domain family (PF25718 / IPR057897). It is
  positioned just upstream of the immunity repressor gene 71 within the leftward-transcribed
  right-arm operon controlled by the early lytic promoter Pleft and gp71-bound
  stoperator sites, but its specific biochemical activity and role during phage
  infection remain uncharacterized.
existing_annotations: []
core_functions:
- description: >-
    Uncharacterized early right-arm phage protein (Mycobacteriophage_73 domain,
    PF25718) encoded immediately upstream of the immunity repressor gene 71 in the
    Pleft-transcribed early operon of Mycobacterium phage L5.
  supported_by:
  - reference_id: PMID:8459766
    supporting_text: >-
      We describe here the complete DNA sequence of the L5 genome and initial
      characterization of L5 virion structure and gene expression.
  - reference_id: file:genes/BPML5/73/73-uniprot.txt
    supporting_text: >-
      DR   Pfam; PF25718; Mycobacteriophage_73; 1.
references:
- id: PMID:8459766
  title: 'DNA sequence, structure and gene expression of mycobacteriophage L5: a phage
    system for mycobacterial genetics.'
  findings:
  - statement: >-
      Reports the complete genome sequence, virion organization, and transcriptional
      architecture of mycobacteriophage L5, identifying gene 73 in the leftward-transcribed
      right-arm early region.
    supporting_text: >-
      We describe here the complete DNA sequence of the L5 genome and initial
      characterization of L5 virion structure and gene expression.
- id: PMID:8594325
  title: Transcriptional regulation of repressor synthesis in mycobacteriophage L5.
  findings:
  - statement: >-
      Demonstrates that early lytic transcription across the right arm of the L5
      genome initiates at the Pleft promoter at the right end of the genome and
      is regulated by the phage repressor gp71.
    supporting_text: >-
      In early lytic growth, gene 71 is also transcribed from a promoter, Pleft,
      located at the right end of the genome and which appears to be a target of
      gp71 regulation.
- id: PMID:9312049
  title: Transcriptional silencing by the mycobacteriophage L5 repressor.
  findings:
  - statement: >-
      Establishes that the L5 immunity repressor gp71 regulates both Pleft
      transcription initiation and downstream transcriptional elongation via
      oriented stoperator sites distributed across early and late operons.
    supporting_text: >-
      L5 gp71 regulates transcription initiation at an early lytic promoter, Pleft,
      but also affects downstream gene expression at 'stoperator' sites in the
      phage genome.
- id: file:genes/BPML5/73/73-uniprot.txt
  title: UniProtKB record for Q05288 (VG73_BPML5)
  findings:
  - statement: >-
      Documents that gene 73 encodes an 85-amino-acid protein (Gp73) classified in
      the Mycobacteriophage_73 domain family (PF25718 / IPR057897).
    supporting_text: >-
      DR   Pfam; PF25718; Mycobacteriophage_73; 1.
suggested_questions:
- question: >-
    Does gp73 modulate the expression or stability of the downstream immunity
    repressor gp71, or does it act independently on a mycobacterial host target
    during early lytic infection?
suggested_experiments:
- description: >-
    Construct an in-frame deletion of gene 73 in Mycobacterium phage L5 and pair it
    with inducible expression of gp73 in Mycobacterium smegmatis to assess plaque
    morphology, lysogenization frequency, and host cell viability.
  hypothesis: >-
    Gp73 functions as an accessory early lytic or lysogenic modulator that influences
    either the lysis-lysogeny decision or host physiology during early infection.
