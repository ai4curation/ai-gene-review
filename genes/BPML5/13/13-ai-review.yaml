  label: Fromanvirus L5
description: Terminase large subunit (gp13, 593 AA) of Mycobacterium phage L5 encoded immediately upstream of the portal protein gp14 in the head morphogenesis gene cluster. It belongs to the bacteriophage terminase family and acts as the ATP-driven DNA translocation motor and cos-cleavage subunit that packages viral genomic DNA into the procapsid.
