suggested_questions:
- question: How does L5 gp13 coordinate with the putative small terminase subunit gp5 across the intervening lysis cassette to cleave the 9-bp 3'-overhang cos site of L5?
  experts:
  - Graham F. Hatfull
suggested_experiments:
- description: Reconstitute an in vitro DNA packaging and cos-cleavage assay using purified L5 gp13, gp5, and procapsids containing the gp14 portal ring.
  hypothesis: L5 gp13 will exhibit ATP-dependent DNA translocation andgp5-stimulated cos-site endonuclease activity generating the 9-base cohesive ends of mature L5 DNA.
