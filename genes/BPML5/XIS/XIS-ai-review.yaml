- id: PMID:8459766
  title: 'DNA sequence, structure and gene expression of mycobacteriophage L5: a phage system for mycobacterial genetics.'
  findings:
  - statement: Sequenced the complete mycobacteriophage L5 genome and identified open reading frame 36 in the early/integration region near the attP-int cassette.
    supporting_text: We describe here the complete DNA sequence of the L5 genome and initial characterization of L5 virion structure and gene expression.
- id: PMID:10652095
  title: Identification and characterization of mycobacteriophage L5 excisionase.
  findings:
  - statement: Identified gp36 as the 56-amino-acid heat-stable excisionase (Xis-L5) of mycobacteriophage L5 and demonstrated that it strongly stimulates Int-mediated excisive recombination in vivo and in vitro.
    supporting_text: We show here that L5 gene 36 encodes the phage excisionase and is a small, heat-stable 56-amino-acid protein that strongly stimulates excisive recombination both in vivo and in vitro.
- id: PMID:12581642
  title: Control of directionality in L5 integrase-mediated site-specific recombination.
  findings:
  - statement: Demonstrated that Xis-L5 acts purely as an architectural DNA-binding and DNA-bending protein that binds attR DNA to assemble intasome-R for excision and inhibits integrative recombination at a post-attB-capture synaptic step.
    supporting_text: We show here that Xis-L5 binds to attR DNA, introduces a DNA bend, and facilitates the formation of an intasome-R complex. This complex, which requires mIHF, Xis-L5 and Int-L5, readily recombines with a second intasome formed by Int-L5, mIHF and attL DNA (intasome-L) to generate the attP and attB products of excision.
