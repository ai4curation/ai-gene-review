id: Q05246
gene_symbol: XIS
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:31757
  label: Fromanvirus L5
description: Small helix-turn-helix architectural DNA-binding protein (excisionase Xis-L5, gp36, 56 aa) that controls the directionality of mycobacteriophage L5 site-specific recombination. Binds cooperatively to four X1-X4 recognition sites within the P-arm of attR and attP DNA, inducing a sharp DNA bend that recruits integrase (Int-L5) to the P1-P2 arm sites to assemble the excisive intasome-R complex (together with host mIHF) and stimulate prophage excision, while simultaneously inhibiting integrative recombination.
