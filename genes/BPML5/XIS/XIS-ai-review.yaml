suggested_questions:
- question: How does cooperative binding of four Xis-L5 monomers to sites X1-X4 propagate a DNA trajectory that permits attB capture by intasome-P yet blocks productive synaptic strand exchange during integration?
  experts:
  - Graham F. Hatfull
  - Gregory D. Van Duyne
suggested_experiments:
- description: Solve the crystal or NMR structure of Xis-L5 bound to the 40-bp X1-X4 DNA segment from L5 attR.
  hypothesis: Head-to-tail oligomerization of four winged-HTH Xis-L5 monomers along one face of the DNA helix induces a >90-degree bend that juxtaposes the P1-P2 arm sites with the core integrase binding sites.
