suggested_questions:
- question: Does L5 gp65 assemble into a homohexameric ring on its own, or does it
    require an adjacent phage protein (such as gp64) for ring assembly and loading
    onto single-stranded DNA?
  experts:
  - Graham F. Hatfull
suggested_experiments:
- hypothesis: L5 gp65 forms an ATP-dependent 5'-to-3' DNA helicase that functionally
    couples with the phage DnaG-like primase (gp57/gp58).
  description: Purify recombinant L5 gp65, determine its oligomeric state by size-exclusion
    chromatography in the presence of ATP/Mg2+, and measure 5'-to-3' duplex DNA unwinding
    and DNA-dependent ATPase activity in vitro.
  experiment_type: in vitro DNA helicase and ATPase assay
