id: Q05279
gene_symbol: '65'
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:31757
  label: Fromanvirus L5
description: Gene 65 protein (gp65) of Mycobacterium phage L5 is a 268-amino-acid
  replicative DNA helicase containing a DnaB-like C-terminal P-loop NTPase catalytic
  domain (PF03796 / IPR007694 / PS50213). Encoded in the early leftwards-transcribed
  replication module of the L5 genome, gp65 couples nucleoside triphosphate (ATP)
  hydrolysis to the unwinding of duplex viral DNA ahead of the replication fork during
  viral DNA genome replication.
