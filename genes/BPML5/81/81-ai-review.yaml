id: Q05297
gene_symbol: '81'
status: COMPLETE
taxon:
  id: NCBITaxon:31757
  label: Fromanvirus L5
description: >-
  Gp81 is a 111-amino-acid (12.4 kDa) protein of unknown function encoded by gene
  81 in the right-arm early lytic region of Mycobacterium phage L5 and belonging
  to the conserved Phage_L5_Gp81 family (PF26898 / IPR060239). It lies within the
  leftward-transcribed early operon downstream of the gp71-regulated internal
  promoter in ORF83 and upstream of the cytotoxic early genes 77-79, though its
  specific biochemical activity and role during infection remain uncharacterized.
existing_annotations: []
core_functions:
- description: >-
    Uncharacterized early lytic protein containing the Phage_L5_Gp81 domain
    (PF26898 / IPR060239) with unknown molecular function and biological process.
  supported_by:
  - reference_id: PMID:8459766
    supporting_text: >-
      We describe here the complete DNA sequence of the L5 genome and initial
      characterization of L5 virion structure and gene expression.
  - reference_id: file:genes/BPML5/81/81-uniprot.txt
    supporting_text: >-
      DR   Pfam; PF26898; Phage_L5_Gp81; 1.
references:
- id: PMID:8459766
  title: 'DNA sequence, structure and gene expression of mycobacteriophage L5: a phage
    system for mycobacterial genetics.'
  findings:
  - statement: >-
      Reports the complete genome sequence and gene organization of
      mycobacteriophage L5, identifying gene 81 in the right-arm early region.
    supporting_text: >-
      We describe here the complete DNA sequence of the L5 genome and initial
      characterization of L5 virion structure and gene expression.
- id: PMID:18667563
  title: Identification of three cytotoxic early proteins of mycobacteriophage L5
    leading to growth inhibition in Mycobacterium smegmatis.
  findings:
  - statement: >-
      Shows that a gp71-regulated promoter situated in ORF83 directs transcription
      of the downstream early operon containing genes 82-77, where gp77, gp78,
      and gp79 act as cytotoxic host-shut-off proteins.
    supporting_text: >-
      The transcription of the cytotoxic polypeptides is directed by a promoter
      situated in ORF83 and transcription control is achieved through the phage
      repressor gp71, which is shown by co-expression of this protein.
- id: file:genes/BPML5/81/81-uniprot.txt
  title: UniProtKB record for Q05297 (VG81_BPML5)
  findings:
  - statement: >-
      Documents that gene 81 encodes a 111-amino-acid protein (Gp81) classified
      in the Phage_L5_Gp81 domain family (PF26898 / IPR060239).
    supporting_text: >-
      DR   Pfam; PF26898; Phage_L5_Gp81; 1.
suggested_questions:
- question: >-
    What is the biochemical function of the conserved Phage_L5_Gp81 domain during
    early lytic infection of Mycobacterium smegmatis?
suggested_experiments:
- description: >-
    Perform affinity purification-mass spectrometry (AP-MS) of tagged gp81 expressed
    in Mycobacterium smegmatis and assay the plaque phenotype of a gene 81 deletion
    mutant in phage L5.
  hypothesis: >-
    Gp81 interacts with host or phage factors during the early lytic phase prior
    to viral DNA replication.
