  review:
    summary: Gp22 contains the conserved phage tail terminator structural domain (IPR057003/PF23841) that caps the polymerized tail tube.
    action: NEW
    reason: Homology to the conserved siphoviral tail terminator family (IPR057003, Phage_tail_terminator_2) and syntenic position immediately upstream of the major tail subunit (gp23) establish gp22 as a structural component of the phage tail termination ring.
