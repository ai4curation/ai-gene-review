  label: Fromanvirus L5
description: Putative tail terminator protein (gp22, 139 aa) of mycobacteriophage L5 containing a conserved phage tail terminator domain (IPR057003/PF23841). Encoded immediately upstream of the major tail subunit gene 23, gp22 caps the distal end of the polymerized tail tube to terminate tail elongation and form the head-binding interface during virion assembly.
