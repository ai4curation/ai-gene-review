  qualifier: involved_in
  review:
    summary: As the phage tail terminator protein, gp22 terminates polymerization of the major tail subunit and stabilizes the completed tail for head attachment.
    action: NEW
    reason: Phage tail terminator proteins (IPR057003) are essential for completing viral tail assembly by capping the tail tube at the top of the tape measure protein and creating the binding surface for the head-tail connector.
