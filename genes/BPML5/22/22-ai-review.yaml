  - Roger W. Hendrix
suggested_experiments:
- description: Perform cryo-EM single-particle reconstruction of the mycobacteriophage L5 neck/head-to-tail interface and recombinant size-exclusion chromatography of purified gp22.
  hypothesis: Gp22 assembles into a hexameric termination ring that caps the hexameric stacks of the gp23 major tail tube protein.
