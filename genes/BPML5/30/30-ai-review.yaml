description: Conserved 101-amino-acid protein (Gp30) containing a DUF2746 domain (IPR022704/PF10874), encoded within the minor tail gene cluster of mycobacteriophage L5 between genes 29 and 31. Its specific biochemical or structural role in tail morphogenesis remains uncharacterized.
