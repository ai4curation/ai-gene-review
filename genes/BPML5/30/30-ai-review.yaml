suggested_questions:
- question: Is Gp30 a non-structural chaperone required for distal tail fiber/tip assembly or a low-abundance structural component of the L5 virion?
  experts:
  - Graham F. Hatfull
suggested_experiments:
- description: Construct an L5 gene 30 deletion mutant by BRED recombineering and test whether viable phage particles or tailless heads accumulate during lytic induction.
  hypothesis: Gp30 is required for functional tail tip assembly or host adsorption.
