  label: Fromanvirus L5
description: Gene 59 protein (gp59) of Mycobacterium phage L5 is a 164-amino-acid
  His-Me finger endonuclease belonging to the bacteriophage endonuclease VII family
  (PF02945 / IPR004211). Encoded in the early leftwards-transcribed replication and
  recombination region of the L5 genome, gp59 is predicted to function as a Holliday
  junction resolvase (crossover junction endodeoxyribonuclease) that cleaves four-way
  DNA junctions and branched replication/recombination intermediates during phage
  DNA metabolism.
