suggested_questions:
- question: Does L5 gp59 also debranch Y-junctions and single-strand overhangs prior
    to DNA packaging, in addition to resolving canonical four-way Holliday junctions?
  experts:
  - Graham F. Hatfull
suggested_experiments:
- hypothesis: L5 gp59 exhibits divalent cation-dependent endodeoxyribonuclease activity
    specific for synthetic four-way Holliday junctions and splayed-arm DNA substrates.
  description: Purify recombinant L5 gp59 and assay cleavage of radiolabeled or fluorescently
    labeled synthetic four-way Holliday junctions, three-way junctions, and linear
    duplex DNA controls in the presence of Mg2+ or Mn2+.
  experiment_type: in vitro Holliday junction resolution assay
