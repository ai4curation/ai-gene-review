references:
- id: PMID:8459766
  title: 'DNA sequence, structure and gene expression of mycobacteriophage L5: a phage
    system for mycobacterial genetics.'
  findings:
  - statement: >-
      Reports the complete DNA sequence and genome organization of
      mycobacteriophage L5, identifying gene 79 in the right-arm early region.
    supporting_text: >-
      We describe here the complete DNA sequence of the L5 genome and initial
      characterization of L5 virion structure and gene expression.
- id: PMID:18667563
  title: Identification of three cytotoxic early proteins of mycobacteriophage L5
    leading to growth inhibition in Mycobacterium smegmatis.
  findings:
  - statement: >-
      Identifies gp79 as one of three early L5 proteins (gp77, gp78, gp79) that
      inhibit Mycobacterium smegmatis growth upon inducible expression and shows
      that gp79 affects host cell division.
    supporting_text: >-
      Using an inducible mycobacterial shuttle vector, we have identified three
      ORFs within an early operon of mycobacteriophage L5 which encode gene
      products (gp) toxic to the host M. smegmatis when expressed. These ORFs,
      coding for gp77, gp78 and gp79, presumably function as shut-off genes
      during early stages of phage replication. There is evidence that cell
      division is affected by one of the proteins (gp79).
  - statement: >-
      Shows that transcription of gp77, gp78, and gp79 is driven from a promoter
      inside ORF83 and controlled by the phage repressor gp71.
    supporting_text: >-
      The transcription of the cytotoxic polypeptides is directed by a promoter
      situated in ORF83 and transcription control is achieved through the phage
      repressor gp71, which is shown by co-expression of this protein.
