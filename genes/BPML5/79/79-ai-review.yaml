suggested_questions:
- question: >-
    Does gp79 directly bind and inhibit Mycobacterium smegmatis FtsZ polymerization
    or another essential divisome protein to block host septation?
suggested_experiments:
- description: >-
    Perform bacterial two-hybrid and co-immunoprecipitation assays testing
    interaction of L5 gp79 with Mycobacterium smegmatis FtsZ, FtsW, and SepF,
    combined with fluorescence microscopy of FtsZ-GFP ring assembly upon gp79
    induction.
  hypothesis: >-
    Gp79 directly interacts with a core component of the mycobacterial divisome
    to prevent septum formation and arrest host cell division during early lytic
    infection.
