id: Q05294
gene_symbol: '79'
status: COMPLETE
taxon:
  id: NCBITaxon:31757
  label: Fromanvirus L5
description: >-
  Gp79 is a 72-amino-acid (7.9 kDa) cytotoxic early host-shut-off protein of
  Mycobacterium phage L5 belonging to the conserved GP79 domain family (PF17463 /
  IPR035353). Co-transcribed with gp78 and gp77 from a gp71-regulated early
  promoter located within ORF83, gp79 inhibits Mycobacterium smegmatis growth and
  perturbs host cell division when expressed, although its direct divisome or
  cellular target has not yet been biochemically defined.
existing_annotations:
- term:
    id: GO:0044003
    label: symbiont-mediated perturbation of host process
  evidence_type: IMP
  original_reference_id: PMID:18667563
  review:
    action: NEW
    reason: >-
      Inducible expression of L5 gp79 in Mycobacterium smegmatis is cytotoxic,
      inhibits host growth, and impairs host cell division.
    supported_by:
    - reference_id: PMID:18667563
      supporting_text: >-
        Using an inducible mycobacterial shuttle vector, we have identified three
        ORFs within an early operon of mycobacteriophage L5 which encode gene
        products (gp) toxic to the host M. smegmatis when expressed. These ORFs,
        coding for gp77, gp78 and gp79, presumably function as shut-off genes
        during early stages of phage replication. There is evidence that cell
        division is affected by one of the proteins (gp79).
