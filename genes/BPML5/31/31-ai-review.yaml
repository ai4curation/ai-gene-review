    summary: Gp31 is a 548-aa minor tail protein containing the conserved Minor_tail_gp31_C structural domain (IPR056923/PF24243).
    action: NEW
    reason: Presence of the conserved phage minor tail C-terminal domain (IPR056923, Minor_tail_gp31_C / PF24243, Phage_tail_C) and syntenic position in the L5 distal tail gene cluster establish Gp31 as a structural component of the viral tail.
