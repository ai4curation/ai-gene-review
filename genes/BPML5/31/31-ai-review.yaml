suggested_questions:
- question: Does Gp31 serve as the primary receptor-binding protein (RBP) that recognizes cell surface glycolipids or proteins on Mycobacterium smegmatis and Mycobacterium tuberculosis?
  experts:
  - Graham F. Hatfull
suggested_experiments:
- description: Express recombinant GFP-fused Gp31 and assay its binding to wild-type and phage-resistant Mycobacterium smegmatis cells by fluorescence microscopy and flow cytometry.
  hypothesis: Gp31 binds directly to the mycobacterial cell surface receptor to mediate phage adsorption.
