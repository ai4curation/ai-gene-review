  label: Fromanvirus L5
description: Minor tail protein (Gp31, 548 aa) encoded in the distal tail gene cluster of mycobacteriophage L5. Contains an N-terminal DUF7257 domain (IPR055681/PF23918) and the C-terminal Minor_tail_gp31_C phage tail domain (IPR056923/PF24243), functioning as a structural component of the distal tail tip / tail fiber complex.
