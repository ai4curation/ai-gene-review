id: Q05303
gene_symbol: '86'
status: COMPLETE
taxon:
  id: NCBITaxon:31757
  label: Fromanvirus L5
description: >-
  Gp86 is an 88-amino-acid (10.0 kDa) protein of unknown function encoded by gene
  86 near the right end of the Mycobacterium phage L5 genome. It belongs to the
  conserved Phage_gp86 domain family (PF26832 / IPR059528) and contains a
  C-terminal intrinsically disordered region (residues 64-88), and is expressed
  from the leftward-transcribed early lytic operon driven by the Pleft promoter,
  though its biochemical role during infection remains unknown.
existing_annotations: []
core_functions:
- description: >-
    Uncharacterized early lytic protein containing the Phage_gp86 domain
    (PF26832 / IPR059528) with unknown molecular function and biological process.
  supported_by:
  - reference_id: PMID:8459766
    supporting_text: >-
      We describe here the complete DNA sequence of the L5 genome and initial
      characterization of L5 virion structure and gene expression.
  - reference_id: file:genes/BPML5/86/86-uniprot.txt
    supporting_text: >-
      DR   Pfam; PF26832; Phage_gp86; 1.
references:
- id: PMID:8459766
  title: 'DNA sequence, structure and gene expression of mycobacteriophage L5: a phage
    system for mycobacterial genetics.'
  findings:
  - statement: >-
      Reports the complete DNA sequence and genome organization of
      mycobacteriophage L5, identifying gene 86 in the right-arm early region.
    supporting_text: >-
      We describe here the complete DNA sequence of the L5 genome and initial
      characterization of L5 virion structure and gene expression.
- id: PMID:8594325
  title: Transcriptional regulation of repressor synthesis in mycobacteriophage L5.
  findings:
  - statement: >-
      Demonstrates that early lytic transcription in the right arm initiates at
      the Pleft promoter at the right end of the genome and is regulated by gp71.
    supporting_text: >-
      In early lytic growth, gene 71 is also transcribed from a promoter, Pleft,
      located at the right end of the genome and which appears to be a target of
      gp71 regulation.
- id: file:genes/BPML5/86/86-uniprot.txt
  title: UniProtKB record for Q05303 (VG86_BPML5)
  findings:
  - statement: >-
      Documents that gene 86 encodes an 88-amino-acid protein (Gp86) classified in
      the Phage_gp86 domain family (PF26832 / IPR059528) with a predicted
      disordered region from residue 64 to 88.
    supporting_text: >-
      DR   Pfam; PF26832; Phage_gp86; 1.
suggested_questions:
- question: >-
    Does the disordered C-terminal tail of gp86 mediate protein-protein
    interactions with host or phage factors during early lytic infection?
suggested_experiments:
- description: >-
    Perform affinity purification-mass spectrometry (AP-MS) of epitope-tagged
    gp86 expressed in Mycobacterium smegmatis during early phage L5 infection.
  hypothesis: >-
    Gp86 interacts with a mycobacterial cytoplasmic target via its conserved
    Phage_gp86 core and C-terminal disordered region.
