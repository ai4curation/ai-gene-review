id: Q05284
gene_symbol: '70'
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:31757
  label: Fromanvirus L5
description: Gene 70 protein (gp70) of Mycobacterium phage L5 is an uncharacterized
  145-amino-acid protein encoded on the leftwards-transcribed right arm immediately
  downstream of the immunity repressor gene 71 and upstream of the PD-(D/E)XK nuclease
  gene 69. It is the founding member of the conserved mycobacteriophage GP70 protein
  family (PF17429 / IPR035405), whose specific molecular function and biological role
  in the phage life cycle remain unknown.
