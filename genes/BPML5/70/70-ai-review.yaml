suggested_questions:
- question: Is gene 70 co-transcribed with gene 71 in L5 lysogens or is transcription
    terminated or attenuated at intergenic stoperator sites between genes 71 and 70?
  experts:
  - Graham F. Hatfull
suggested_experiments:
- hypothesis: L5 gp70 is an accessory factor involved in the lysis-lysogeny decision
    or early recombination alongside the adjacent nuclease gp69.
  description: Measure gp70 transcript and protein levels during lytic infection versus
    lysogeny by RT-qPCR and western blotting, and test the effect of a gene 70 deletion
    on lysogenization frequency and lytic burst size in Mycobacterium smegmatis.
  experiment_type: lysogenization frequency assay and RT-qPCR expression profiling
