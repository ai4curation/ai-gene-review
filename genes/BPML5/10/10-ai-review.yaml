  review:
    summary: Spurious automated mapping from the UniProt Antimicrobial keyword (KW-0081); phage endolysins mediate viral egress, not host immune defense.
    action: REMOVE
    reason: Bacteriophage L5 gp10 is a viral endolysin that degrades the host cell wall for progeny phage release, not a host antibacterial defense protein.
    supported_by:
