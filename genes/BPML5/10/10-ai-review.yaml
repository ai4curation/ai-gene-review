    reason: L5 gp10 is a peptidoglycan hydrolase (LysA) whose enzymatic function is more specifically captured by hydrolase activity (GO:0016787).
    supported_by:
    - reference_id: PMID:22470512
      supporting_text: The observation that some organizations lack the central catalytic domain (Org-C, Org-H, Org-M, and Org-T) is consistent with the interpretation that the N-terminal domains are important for peptidoglycan hydrolysis. These are all relatively small proteins (<325 aa) and include the smallest of the mycobacteriophage endolysins, L5 gp10 and Saintus gp5, which are 292 and 225 residues respectively.
