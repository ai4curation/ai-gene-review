  label: Fromanvirus L5
description: Endolysin A (LysA, gp10; 292 AA) of Mycobacterium phage L5 that hydrolyzes the host mycobacterial peptidoglycan layer during the terminal stage of the lytic cycle. It exhibits an Org-C modular architecture consisting of an N-terminal N4 RipA-like peptidase domain and a C-terminal C1 cell-wall-binding region, acting in concert with the holin (gp11) and mycolylarabinogalactan esterase LysB (gp12) to lyse the host cell and release progeny virions.
