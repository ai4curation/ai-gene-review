  - Graham F. Hatfull
  - Katalin M. Payne
suggested_experiments:
- description: Perform LC-MS muropeptide analysis of isolated Mycobacterium smegmatis peptidoglycan digested with purified recombinant L5 gp10.
  hypothesis: The N4 domain of L5 gp10 acts as an endopeptidase cleaving the D-Glu-meso-DAP bond of mycobacterial peptidoglycan stem peptides, analogous to M. tuberculosis RipA.
  experiment_type: In vitro biochemical assay
