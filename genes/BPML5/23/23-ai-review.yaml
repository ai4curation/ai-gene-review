suggested_questions:
- question: Does the C-terminal extension of L5 Gp23 form surface-exposed Ig-like domains decorating the exterior of the siphoviral tail tube?
  experts:
  - Graham F. Hatfull
  - David Veesler
suggested_experiments:
- description: Determine the high-resolution cryo-EM structure of the L5 tail tube to resolve the inter-subunit contacts and hexameric ring architecture of Gp23.
  hypothesis: Gp23 forms stacked hexameric rings stabilized by beta-barrel core domains and extended polymerization loops homologous to other siphoviral tail tube proteins.
