  label: Fromanvirus L5
description: Major tail subunit protein (Gp23, 198 aa) of mycobacteriophage L5 that polymerizes around the tape measure protein scaffold to form the long, flexible, non-contractile siphoviral tail tube. Confirmed as an abundant virion structural polypeptide by N-terminal protein sequencing (with post-translational removal of the initiator methionine) and homology to the Bxb1-like phage tail tube protein family (IPR058154/PF25681).
