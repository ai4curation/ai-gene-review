  review:
    summary: Automated keyword mapping from UniProtKB-KW:KW-0167 (Capsid protein) erroneously annotates the major tail subunit Gp23 to the viral capsid instead of the viral tail.
    action: MODIFY
    reason: Gp23 is the major tail tube protein (RecName Major tail protein Gp23; InterPro IPR058154 Bxb1_TTP-like / Pfam PF25681 Phage_TTP_17), whereas the major capsid subunit of L5 is encoded by gene 17. The location should be modified to viral tail (GO:0098015).
