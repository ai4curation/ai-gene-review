id: Q05289
gene_symbol: '74'
status: COMPLETE
taxon:
  id: NCBITaxon:31757
  label: Fromanvirus L5
description: >-
  Gp74 is a 72-amino-acid (8.5 kDa) protein of unknown function encoded by gene
  74 in the right-arm early lytic region of Mycobacterium phage L5 and belonging
  to the conserved Phage_L5_Gp74 family (PF26893 / IPR059760). It is encoded
  within the leftward-transcribed early operon regulated by the Pleft promoter
  and gp71 repressor stoperator sites, immediately downstream of the cytotoxic
  early gene cluster (genes 77-79), though its own biochemical activity and
  role in infection have not been determined.
existing_annotations: []
core_functions:
- description: >-
    Uncharacterized early right-arm phage protein (Phage_L5_Gp74 domain, PF26893)
    encoded within the leftward-transcribed early operon of Mycobacterium phage L5.
  supported_by:
  - reference_id: PMID:8459766
    supporting_text: >-
      We describe here the complete DNA sequence of the L5 genome and initial
      characterization of L5 virion structure and gene expression.
  - reference_id: file:genes/BPML5/74/74-uniprot.txt
    supporting_text: >-
      DR   Pfam; PF26893; Phage_L5_Gp74; 1.
references:
- id: PMID:8459766
  title: 'DNA sequence, structure and gene expression of mycobacteriophage L5: a phage
    system for mycobacterial genetics.'
  findings:
  - statement: >-
      Determines the complete DNA sequence and genome organization of
      mycobacteriophage L5, identifying gene 74 in the leftward-transcribed
      right-arm early region.
    supporting_text: >-
      We describe here the complete DNA sequence of the L5 genome and initial
      characterization of L5 virion structure and gene expression.
- id: PMID:9312049
  title: Transcriptional silencing by the mycobacteriophage L5 repressor.
  findings:
  - statement: >-
      Shows that the L5 repressor gp71 silences early lytic transcription from
      Pleft and acts at oriented stoperator sites across the phage genome.
    supporting_text: >-
      L5 gp71 regulates transcription initiation at an early lytic promoter, Pleft,
      but also affects downstream gene expression at 'stoperator' sites in the
      phage genome.
- id: file:genes/BPML5/74/74-uniprot.txt
  title: UniProtKB record for Q05289 (VG74_BPML5)
  findings:
  - statement: >-
      Documents that gene 74 encodes a 72-amino-acid protein (Gp74) containing
      the Phage_L5_Gp74 domain (PF26893 / IPR059760).
    supporting_text: >-
      DR   Pfam; PF26893; Phage_L5_Gp74; 1.
suggested_questions:
- question: >-
    Is gp74 dispensable for lytic growth in Mycobacterium smegmatis, or does it
    cooperate with neighboring right-arm early proteins (such as gp77-gp79) in
    host takeover?
suggested_experiments:
- description: >-
    Express affinity-tagged gp74 from an inducible shuttle vector in Mycobacterium
    smegmatis to test for host growth inhibition and identify interacting host or
    phage proteins by co-immunoprecipitation and mass spectrometry.
  hypothesis: >-
    Gp74 interacts with a mycobacterial cytoplasmic protein or nucleic acid target
    during the early phase of L5 lytic infection.
