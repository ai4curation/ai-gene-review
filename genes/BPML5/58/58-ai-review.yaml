suggested_questions:
- question: What specific trinucleotide initiation sequence on the L5 genome is recognized
    by the CHC2 zinc-ribbon domain of gp58?
  experts:
  - Graham F. Hatfull
suggested_experiments:
- hypothesis: L5 gp58 binds single-stranded DNA in a Zn2+-dependent manner and recruits
    the TOPRIM catalytic subunit gp57 to initiate primer synthesis.
  description: Perform electrophoretic mobility shift assays (EMSA) and fluorescence
    anisotropy with purified gp58 on single-stranded DNA oligonucleotides in the presence
    and absence of Zn2+ chelators (o-phenanthroline), and test stimulation of gp57
    primase activity.
  experiment_type: single-stranded DNA binding and primase stimulation assay
