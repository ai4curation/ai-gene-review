id: Q05271
gene_symbol: '58'
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:31757
  label: Fromanvirus L5
description: Gene 58 protein (gp58) of Mycobacterium phage L5 is a 130-amino-acid
  protein containing a bacterial/phage DnaG-type CHC2 zinc-ribbon DNA-binding domain.
  Encoded in the early leftwards-transcribed replication operon immediately upstream
  of gene 57 (which encodes the catalytic TOPRIM primase domain), gp58 provides the
  N-terminal zinc-coordinating template-recognition module of the phage DNA primase
  machinery involved in viral DNA genome replication.
existing_annotations:
- term:
    id: GO:0003677
    label: DNA binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR002694
  - InterPro:IPR036977
  review:
    summary: Electronic annotation from InterPro DnaG-type CHC2 zinc finger signatures
      (IPR002694, IPR036977), which mediate single-stranded DNA template binding and
      initiation site recognition in DNA primases.
    action: ACCEPT
    reason: The N-terminal CHC2 zinc-ribbon domain of DnaG-type primases directly
      binds single-stranded DNA template to position the catalytic TOPRIM domain for
      primer synthesis.
    supported_by:
    - reference_id: file:BPML5/58/58-uniprot.txt
      supporting_text: DR   InterPro; IPR036977; DNA_primase_Znf_CHC2.
    - reference_id: file:BPML5/58/58-uniprot.txt
      supporting_text: DR   Pfam; PF01807; Zn_ribbon_DnaG; 1.
- term:
    id: GO:0003899
    label: DNA-directed RNA polymerase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR002694
  review:
    summary: 'Mapped electronically from IPR002694 (bacterial/phage DNA primase CHC2
      zinc finger). In L5, the DnaG-type primase is split across two genes: gp58 (130
      aa) encodes only the N-terminal CHC2 zinc-ribbon ssDNA-binding domain, whereas
      the adjacent gp57 encodes the catalytic TOPRIM nucleotidyltransferase domain.'
    action: REMOVE
    reason: Unlike full-length single-polypeptide DnaG primases, L5 gp58 (130 aa)
      contains only the N-terminal CHC2 zinc-ribbon DNA-binding domain (PF01807/IPR036977)
      and lacks the catalytic TOPRIM RNA polymerase/primase domain (which is encoded
      separately by gene 57, Q05270). Therefore gp58 itself enables DNA binding (GO:0003677)
      and zinc ion binding (GO:0008270), while catalytic RNA primer synthesis (GO:0003899)
      resides on gp57.
    supported_by:
    - reference_id: file:BPML5/58/58-uniprot.txt
      supporting_text: DR   Pfam; PF01807; Zn_ribbon_DnaG; 1.
    - reference_id: file:BPML5/58/58-uniprot.txt
      supporting_text: DR   InterPro; IPR036977; DNA_primase_Znf_CHC2.
- term:
    id: GO:0006260
    label: DNA replication
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR002694
  - InterPro:IPR036977
  review:
    summary: Mapped from InterPro DnaG primase zinc-finger signatures (IPR002694,
      IPR036977). True of the protein, but for a bacteriophage replication protein
      the more specific descendant term viral DNA genome replication (GO:0039693)
      is warranted.
    action: MODIFY
    reason: L5 gp58 is a phage-encoded replication primase subunit/domain that functions
      specifically in replicating the viral dsDNA genome, so GO:0006260 should be
      refined to its descendant GO:0039693 (viral DNA genome replication).
    proposed_replacement_terms:
    - id: GO:0039693
      label: viral DNA genome replication
    supported_by:
    - reference_id: file:BPML5/58/58-uniprot.txt
      supporting_text: DR   PANTHER; PTHR30313:SF2; DNA PRIMASE; 1.
