suggested_questions:
- question: What is the structural fold and biological role of the conserved Gp52 domain (PF17468) across L5-like mycobacteriophages?
  experts:
  - Graham F. Hatfull
suggested_experiments:
- description: Determine the solution NMR structure of recombinant Gp52 and test the effect of a gene 52 deletion on phage L5 lytic growth in Mycobacterium smegmatis.
  hypothesis: Structural and genetic characterization will reveal whether Gp52 functions as a small regulatory or nucleic acid-binding factor during lytic development.
