  label: Fromanvirus L5
description: Uncharacterized 61-amino-acid protein (Gp52) encoded in the right arm of the Mycobacterium phage L5 genome. It belongs to the conserved phage Gp52 domain family (IPR035344/PF17468) of unknown biochemical function.
existing_annotations: []
core_functions:
- description: Uncharacterized 61-amino-acid right-arm phage protein containing the conserved Gp52 domain (IPR035344 / PF17468); specific molecular activity has not yet been experimentally determined.
