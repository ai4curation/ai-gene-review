id: Q05298
gene_symbol: '82'
status: COMPLETE
taxon:
  id: NCBITaxon:31757
  label: Fromanvirus L5
description: >-
  Gp82 is a 126-amino-acid (14.2 kDa) protein of unknown function encoded by gene
  82 in the right-arm early lytic region of Mycobacterium phage L5 and belonging
  to the conserved Phage_L5_gp82 family (PF25735 / IPR058002). It is the first
  complete open reading frame located immediately downstream of the gp71-regulated
  internal promoter within ORF83 that drives transcription of the early host-shut-off
  operon, but its own biochemical activity and biological role remain uncharacterized.
existing_annotations: []
core_functions:
- description: >-
    Uncharacterized early lytic protein containing the Phage_L5_gp82 domain
    (PF25735 / IPR058002) with unknown molecular function and biological process.
  supported_by:
  - reference_id: PMID:8459766
    supporting_text: >-
      We describe here the complete DNA sequence of the L5 genome and initial
      characterization of L5 virion structure and gene expression.
  - reference_id: file:genes/BPML5/82/82-uniprot.txt
    supporting_text: >-
      DR   Pfam; PF25735; Phage_L5_gp82; 1.
references:
- id: PMID:8459766
  title: 'DNA sequence, structure and gene expression of mycobacteriophage L5: a phage
    system for mycobacterial genetics.'
  findings:
  - statement: >-
      Establishes the complete DNA sequence and genetic organization of
      mycobacteriophage L5, identifying gene 82 in the right-arm early region.
    supporting_text: >-
      We describe here the complete DNA sequence of the L5 genome and initial
      characterization of L5 virion structure and gene expression.
- id: PMID:18667563
  title: Identification of three cytotoxic early proteins of mycobacteriophage L5
    leading to growth inhibition in Mycobacterium smegmatis.
  findings:
  - statement: >-
      Demonstrates that an internal promoter situated in ORF83 directs
      gp71-regulated transcription of the downstream early operon containing
      gene 82 through gene 77.
    supporting_text: >-
      The transcription of the cytotoxic polypeptides is directed by a promoter
      situated in ORF83 and transcription control is achieved through the phage
      repressor gp71, which is shown by co-expression of this protein.
- id: file:genes/BPML5/82/82-uniprot.txt
  title: UniProtKB record for Q05298 (VG82_BPML5)
  findings:
  - statement: >-
      Documents that gene 82 encodes a 126-amino-acid protein (Gp82) belonging to
      the Phage_L5_gp82 domain family (PF25735 / IPR058002).
    supporting_text: >-
      DR   Pfam; PF25735; Phage_L5_gp82; 1.
suggested_questions:
- question: >-
    Does gp82 function as a chaperone, antitoxin-like modulator, or co-factor for
    the downstream cytotoxic early proteins gp77-gp79 transcribed from the adjacent
    ORF83 promoter?
suggested_experiments:
- description: >-
    Perform co-expression and pull-down assays of gp82 with gp77, gp78, and gp79
    in Mycobacterium smegmatis, and test whether a gene 82 deletion alters early
    lytic gene expression or phage burst size.
  hypothesis: >-
    Gp82 functions in the early lytic phase either by interacting with a host
    protein or by modulating the activity of neighboring early operon products.
