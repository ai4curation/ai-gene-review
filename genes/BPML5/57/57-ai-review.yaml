suggested_questions:
- question: Do L5 gp58 (zinc-binding domain) and gp57 (TOPRIM catalytic core) assemble
    into a non-covalent heterodimeric DNA primase, or are they expressed as a single
    polypeptide via programmed ribosomal frameshifting?
  experts:
  - Graham F. Hatfull
suggested_experiments:
- hypothesis: L5 gp57 and gp58 form a functional two-subunit DnaG-type DNA primase
    complex required for primer synthesis on single-stranded phage DNA templates.
  description: Co-express and purify recombinant His-tagged gp57 and untagged gp58
    in E. coli, assess complex formation by size-exclusion chromatography, and measure
    template-dependent oligoribonucleotide primer synthesis in vitro alone and in
    combination.
  experiment_type: protein complex reconstitution and in vitro primase assay
