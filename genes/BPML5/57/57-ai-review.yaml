id: Q05270
gene_symbol: '57'
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:31757
  label: Fromanvirus L5
description: Gene 57 protein (gp57) of Mycobacterium phage L5 is a 152-amino-acid
  protein that forms the catalytic TOPRIM (topoisomerase-primase) core domain of the
  phage DnaG-type DNA primase. Encoded in the early leftwards-transcribed replication
  module immediately downstream of gene 58 (which encodes the N-terminal CHC2 zinc-ribbon
  DNA-binding domain of the primase), gp57 contains the conserved metal-coordinating
  TOPRIM fold responsible for synthesizing short RNA primers on single-stranded DNA
  templates to initiate Okazaki fragment synthesis during viral DNA genome replication.
