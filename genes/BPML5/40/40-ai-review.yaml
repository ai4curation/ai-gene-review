  label: Fromanvirus L5
description: Uncharacterized 37-amino-acid acidic, cysteine-rich polypeptide (Gp40) encoded in the right arm of the Mycobacterium phage L5 genome. It contains a central hexacysteine motif flanked by acidic residues, but its biochemical function and role in phage infection remain unknown.
