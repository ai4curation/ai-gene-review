suggested_questions:
- question: Does the central hexacysteine motif (CGCCTCCGCTC) of Gp40 coordinate metal ions or form intramolecular disulfide bonds in vivo?
  experts:
  - Graham F. Hatfull
suggested_experiments:
- description: Express and purify recombinant Gp40 and perform inductively coupled plasma mass spectrometry (ICP-MS) and UV-visible spectroscopy to test for transition metal (e.g., Zn2+ or Fe-S) coordination by its central cysteine cluster.
  hypothesis: The conserved central cysteine cluster of Gp40 chelates divalent metal ions to stabilize this miniature phage polypeptide.
