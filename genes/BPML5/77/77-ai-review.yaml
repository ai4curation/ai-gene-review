  supported_by:
  - reference_id: PMID:18667563
    supporting_text: >-
      Using an inducible mycobacterial shuttle vector, we have identified three
      ORFs within an early operon of mycobacteriophage L5 which encode gene
      products (gp) toxic to the host M. smegmatis when expressed. These ORFs,
      coding for gp77, gp78 and gp79, presumably function as shut-off genes
      during early stages of phage replication.
  - reference_id: PMID:21656815
    supporting_text: >-
      Here we present data showing that this purified phage protein of unknown
      function specifically binds to protein MSMEG_3532 when incubated with cell
      lysates of Mycobacterium smegmatis. This interaction was confirmed by
      pull-down assays using purified MSMEG_3532 as bait which co-purified with
      gp77.
  knowledge_gaps:
  - gap_statement: >-
      The mechanistic link between gp77 binding to host L-serine dehydratase
      (SdhA) and host growth arrest remains unresolved.
    boundary: >-
      Direct physical binding between purified gp77 and MSMEG_3532 (SdhA) is
      established by pull-down assays, and gp77 cytotoxicity in M. smegmatis is
      demonstrated in vivo, but purified gp77 did not alter SdhA enzymatic
      activity in vitro at saturating L-serine concentrations.
    gap_kind:
    - BIOLOGY
    significance: >-
      Determining whether gp77 alters SdhA substrate affinity (Km), allosteric
      regulation, subcellular localization, or an additional host target is
      essential to explain how gp77 redirects host metabolism and arrests growth.
    resolution: >-
      Measure SdhA reaction kinetics across subsaturating L-serine concentrations
      in the presence of gp77 and test whether an M. smegmatis msmeg_3532 point
      mutant defective in gp77 binding is resistant to gp77-mediated growth
      inhibition.
references:
- id: PMID:8459766
  title: 'DNA sequence, structure and gene expression of mycobacteriophage L5: a phage
    system for mycobacterial genetics.'
  findings:
  - statement: >-
      Reports the complete DNA sequence and genome organization of
      mycobacteriophage L5, identifying gene 77 in the right-arm early region.
    supporting_text: >-
      We describe here the complete DNA sequence of the L5 genome and initial
      characterization of L5 virion structure and gene expression.
- id: PMID:18667563
  title: Identification of three cytotoxic early proteins of mycobacteriophage L5
    leading to growth inhibition in Mycobacterium smegmatis.
  findings:
  - statement: >-
      Identifies gp77, gp78, and gp79 as cytotoxic early host-shut-off proteins
      whose expression inhibits Mycobacterium smegmatis growth and whose
      transcription is driven from a promoter in ORF83 controlled by repressor
      gp71.
    supporting_text: >-
      Using an inducible mycobacterial shuttle vector, we have identified three
      ORFs within an early operon of mycobacteriophage L5 which encode gene
      products (gp) toxic to the host M. smegmatis when expressed. These ORFs,
      coding for gp77, gp78 and gp79, presumably function as shut-off genes
      during early stages of phage replication.
  - statement: >-
      Demonstrates that transcription of the operon encoding gp77, gp78, and gp79
      originates from a promoter in ORF83 and is repressed by gp71.
    supporting_text: >-
      The transcription of the cytotoxic polypeptides is directed by a promoter
      situated in ORF83 and transcription control is achieved through the phage
      repressor gp71, which is shown by co-expression of this protein.
- id: PMID:21656815
  title: The cytotoxic early protein 77 of mycobacteriophage L5 interacts with MSMEG_3532,
    an L-serine dehydratase of Mycobacterium smegmatis.
  findings:
  - statement: >-
      Demonstrates that purified L5 gp77 specifically binds Mycobacterium
      smegmatis protein MSMEG_3532 in cell lysates and in reciprocal pull-down
      assays using purified proteins.
    supporting_text: >-
      Here we present data showing that this purified phage protein of unknown
      function specifically binds to protein MSMEG_3532 when incubated with cell
      lysates of Mycobacterium smegmatis. This interaction was confirmed by
      pull-down assays using purified MSMEG_3532 as bait which co-purified with
      gp77.
  - statement: >-
      Identifies MSMEG_3532 biochemically as a pyridoxal-5'-phosphate-dependent
      L-serine dehydratase (SdhA) that converts L-serine to pyruvate.
    supporting_text: >-
      An enzymatic assay identified this host protein as a
      pyridoxal-5'-phosphate-dependent L-serine dehydratase (SdhA) which converts
      L-serine to pyruvate.
  - statement: >-
      Finds that purified gp77 does not inhibit SdhA activity in vitro at
      saturating L-serine concentration, suggesting a role in modulating in vivo
      amino acid pools or metabolism during phage maturation.
    supporting_text: >-
      Though the addition of purified gp77 to the established in vitro assay had
      no influence on SdhA activity at a saturating L-serine concentration, the
      specific interaction of phage protein and dehydratase in vivo may well have
      a role in altering the amino acid pool or the products of amino acid
      metabolism in favour of phage maturation.
