core_functions:
- description: >-
    Early host-shut-off factor that inhibits Mycobacterium smegmatis growth and
    directly binds the host cytoplasmic pyridoxal-5'-phosphate-dependent L-serine
    dehydratase (MSMEG_3532 / SdhA) to modulate host amino acid metabolism during
    early lytic infection.
