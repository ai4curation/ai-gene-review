suggested_questions:
- question: >-
    Which domain of gp77 (DUF2786 or DUF7168) mediates the physical interaction
    with host L-serine dehydratase MSMEG_3532, and is the other domain responsible
    for growth inhibition via a second host target?
- question: >-
    Does gp77 alter the Km of MSMEG_3532 for L-serine at physiological substrate
    concentrations or redirect pyruvate flux during early lytic infection?
suggested_experiments:
- description: >-
    Express truncated DUF2786 and DUF7168 domains of gp77 separately in
    Mycobacterium smegmatis to map which domain binds MSMEG_3532 in pull-down
    assays and which domain is sufficient for host cytotoxicity.
  hypothesis: >-
    One domain of gp77 mediates MSMEG_3532 binding while the two-domain
    architecture couples metabolic modulation to host growth arrest.
- description: >-
    Perform metabolomic profiling of L-serine, pyruvate, and downstream tricarboxylic
    acid cycle intermediates in M. smegmatis following inducible gp77 expression.
  hypothesis: >-
    Gp77 alters intracellular L-serine or pyruvate pools in vivo to favor phage
    biosynthesis.
