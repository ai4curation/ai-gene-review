id: Q05292
gene_symbol: '77'
status: COMPLETE
taxon:
  id: NCBITaxon:31757
  label: Fromanvirus L5
description: >-
  Gp77 is a 252-amino-acid (28.2 kDa) cytotoxic early host-shut-off protein of
  Mycobacterium phage L5 containing N-terminal DUF2786 (PF10979) and C-terminal
  DUF7168 (PF23771) domains. Transcribed during early lytic infection from a
  gp71-repressible promoter located in ORF83, gp77 accumulates in the host
  cytoplasm, inhibits Mycobacterium smegmatis growth, and specifically binds the
  host pyridoxal-5'-phosphate-dependent L-serine dehydratase (MSMEG_3532 / SdhA),
  which converts L-serine to pyruvate.
