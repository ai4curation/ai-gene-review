description: Minor tail protein (Gp27, 336 aa) of mycobacteriophage L5, experimentally verified as a virion component by N-terminal protein sequencing (residues 1-8). Encoded immediately downstream of the tape measure protein (Gp26) in the distal tail tip gene cluster, Gp27 is a structural component of the distal tail tip complex required for tail assembly.
