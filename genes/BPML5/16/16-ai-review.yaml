  label: Fromanvirus L5
description: Capsid assembly scaffolding protein (gp16, 173 AA) of Mycobacterium phage L5 encoded immediately upstream of the major capsid protein gp17. Verified at the protein level by N-terminal sequencing (residues 2-16), it contains a central alpha-helical coiled-coil domain and co-assembles with gp17 subunits to form the internal core scaffold required for icosahedral procapsid assembly.
