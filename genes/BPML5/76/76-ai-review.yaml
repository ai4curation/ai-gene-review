id: Q05291
gene_symbol: '76'
status: COMPLETE
taxon:
  id: NCBITaxon:31757
  label: Fromanvirus L5
description: >-
  Gp76 is a 91-amino-acid (10.1 kDa) protein of unknown function encoded by gene
  76 in the right-arm early lytic operon of Mycobacterium phage L5. It contains a
  conserved DUF7199 domain (PF23829 / IPR055623) and a C-terminal intrinsically
  disordered segment (residues 58-81), and is positioned immediately downstream of
  the cytotoxic early host-shut-off gene cluster (genes 77-79), although its own
  biochemical role during phage replication remains uncharacterized.
existing_annotations: []
core_functions:
- description: >-
    Uncharacterized early right-arm phage protein (DUF7199 domain, PF23829)
    encoded immediately downstream of the cytotoxic early host-shut-off gene
    cluster in Mycobacterium phage L5.
  supported_by:
  - reference_id: PMID:8459766
    supporting_text: >-
      We describe here the complete DNA sequence of the L5 genome and initial
      characterization of L5 virion structure and gene expression.
  - reference_id: file:genes/BPML5/76/76-uniprot.txt
    supporting_text: >-
      DR   Pfam; PF23829; DUF7199; 1.
references:
- id: PMID:8459766
  title: 'DNA sequence, structure and gene expression of mycobacteriophage L5: a phage
    system for mycobacterial genetics.'
  findings:
  - statement: >-
      Presents the complete genome sequence and gene organization of
      mycobacteriophage L5, identifying gene 76 in the right-arm early region.
    supporting_text: >-
      We describe here the complete DNA sequence of the L5 genome and initial
      characterization of L5 virion structure and gene expression.
- id: PMID:9312049
  title: Transcriptional silencing by the mycobacteriophage L5 repressor.
  findings:
  - statement: >-
      Demonstrates that the L5 repressor gp71 regulates early lytic transcription
      initiation at Pleft and silences downstream expression via stoperator sites.
    supporting_text: >-
      L5 gp71 regulates transcription initiation at an early lytic promoter, Pleft,
      but also affects downstream gene expression at 'stoperator' sites in the
      phage genome.
- id: file:genes/BPML5/76/76-uniprot.txt
  title: UniProtKB record for Q05291 (VG76_BPML5)
  findings:
  - statement: >-
      Shows that gp76 is a 91-amino-acid protein classified in the DUF7199 family
      (PF23829 / IPR055623) with a predicted disordered region spanning residues
      58 to 81.
    supporting_text: >-
      DR   Pfam; PF23829; DUF7199; 1.
suggested_questions:
- question: >-
    Does gp76 co-transcribe with the adjacent cytotoxic early genes 77-79 from the
    promoter in ORF83, and does it modulate their activity or stability?
suggested_experiments:
- description: >-
    Test inducible expression of gp76 alone and in combination with gp77-gp79 in
    Mycobacterium smegmatis, and perform pull-down assays from infected cell lysates
    to identify binding partners of its DUF7199 domain.
  hypothesis: >-
    Gp76 acts as an early accessory factor in the host cytoplasm during the initial
    stages of L5 lytic development.
