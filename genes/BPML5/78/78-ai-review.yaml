suggested_questions:
- question: >-
    What is the direct macromolecular target of the basic, intrinsically disordered
    gp78 peptide in Mycobacterium smegmatis?
suggested_experiments:
- description: >-
    Perform affinity pull-down and crosslinking mass spectrometry using epitopetagged
    gp78 in Mycobacterium smegmatis lysates to identify its host binding partner.
  hypothesis: >-
    The highly basic, disordered gp78 polypeptide binds an essential acidic host
    protein or ribonucleoprotein complex (such as RNA polymerase or the ribosome)
    to shut off host macromolecular synthesis.
