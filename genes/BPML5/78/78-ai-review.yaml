id: Q05293
gene_symbol: '78'
status: COMPLETE
taxon:
  id: NCBITaxon:31757
  label: Fromanvirus L5
description: >-
  Gp78 is a 45-amino-acid (5.5 kDa), basic, intrinsically disordered early
  host-shut-off polypeptide of Mycobacterium phage L5 belonging to the
  Phage_L5_Gp78 family (PF26884 / IPR059593). Transcribed together with gp77 and
  gp79 from a gp71-regulated early promoter situated in ORF83, gp78 is cytotoxic
  to Mycobacterium smegmatis and inhibits host cell growth when expressed,
  although its direct cellular target and molecular mechanism remain unknown.
existing_annotations:
- term:
    id: GO:0044003
    label: symbiont-mediated perturbation of host process
  evidence_type: IMP
  original_reference_id: PMID:18667563
  review:
    action: NEW
    reason: >-
      Inducible expression of L5 gp78 in Mycobacterium smegmatis is toxic and
      inhibits host cell growth, functioning as an early host-shut-off factor.
    supported_by:
    - reference_id: PMID:18667563
      supporting_text: >-
        Using an inducible mycobacterial shuttle vector, we have identified three
        ORFs within an early operon of mycobacteriophage L5 which encode gene
        products (gp) toxic to the host M. smegmatis when expressed. These ORFs,
        coding for gp77, gp78 and gp79, presumably function as shut-off genes
        during early stages of phage replication.
core_functions:
- description: >-
    Cytotoxic early host-shut-off polypeptide that inhibits Mycobacterium
    smegmatis cell growth during early lytic infection when expressed from the
    gp71-regulated promoter in ORF83.
