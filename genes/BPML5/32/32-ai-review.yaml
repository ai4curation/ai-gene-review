id: Q05241
gene_symbol: '32'
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:31757
  label: Fromanvirus L5
description: Conserved 220-amino-acid glycine-rich protein (Gp32) containing a Gly_rich_dom domain (IPR049304/PF21722), encoded at the distal end of the tail morphogenesis region in mycobacteriophage L5 between minor tail gene 31 and the attP/integrase locus. Its specific role in tail fiber assembly or host interaction remains uncharacterized.
existing_annotations: []
core_functions:
- description: Conserved glycine-rich domain protein (IPR049304/PF21722) encoded at the distal end of the mycobacteriophage L5 tail gene cluster; its specific molecular role in tail fiber assembly or host recognition remains unknown.
