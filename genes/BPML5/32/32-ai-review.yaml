suggested_questions:
- question: Does the glycine-rich protein Gp32 form a distal tail fiber filament or act as a tail fiber assembly chaperone for Gp31?
  experts:
  - Graham F. Hatfull
suggested_experiments:
- description: Perform mass spectrometry of purified L5 virions and test whether a gene 32 deletion mutant exhibits altered host range on Mycobacterium smegmatis and Mycobacterium bovis BCG.
  hypothesis: Gp32 either incorporates into the distal tail fiber tip or chaperones the folding of the Gp31 receptor-binding complex.
