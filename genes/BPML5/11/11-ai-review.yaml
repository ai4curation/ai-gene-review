suggested_questions:
- question: Does L5 gp11 function as a canonical large-hole holin or as a pinholin in Mycobacterium smegmatis?
  experts:
  - Graham F. Hatfull
  - Ry Young
suggested_experiments:
- description: Express L5 gp11 in a lambda S-defective lysogen or Mycobacterium smegmatis and measure membrane depolarization and beta-galactosidase/endolysin release kinetics upon premature triggering with 2,4-dinitrophenol (DNP).
  hypothesis: DNP-induced collapse of the proton-motive force will trigger premature oligomerization of L5 gp11 and rapid inner membrane permeabilization.
  experiment_type: Membrane permeabilization assay
