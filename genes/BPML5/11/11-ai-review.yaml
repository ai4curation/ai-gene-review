id: Q05296
gene_symbol: '11'
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:31757
  label: Fromanvirus L5
description: Holin protein (gp11, 131 AA) of Mycobacterium phage L5 encoded between the lysA (gene 10) and lysB (gene 12) endolysin genes in the phage lysis cassette. It inserts into the host mycobacterial plasma membrane via two transmembrane helices and oligomerizes at a programmed time to form membrane pores, allowing Endolysin A and Endolysin B to access the cell wall and trigger host cell lysis for progeny virion release.
