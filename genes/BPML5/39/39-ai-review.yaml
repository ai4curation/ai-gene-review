suggested_questions:
- question: Is Gp39 essential for Mycobacterium phage L5 lytic growth or DNA replication in Mycobacterium smegmatis?
  experts:
  - Graham F. Hatfull
suggested_experiments:
- description: Generate an in-frame deletion of gene 39 in Mycobacterium phage L5 using bacteriophage recombineering of electroporated DNA (BRED) to test whether Gp39 is essential for plaque formation and lytic propagation.
  hypothesis: Deletion of gene 39 will reveal whether Gp39 is required for normal burst size or lytic replication in Mycobacterium smegmatis.
