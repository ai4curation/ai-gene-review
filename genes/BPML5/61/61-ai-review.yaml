  label: Fromanvirus L5
description: Gene 61 protein (gp61) of Mycobacterium phage L5 is a 125-amino-acid
  protein encoded in the early leftwards-transcribed right-arm operon. It contains
  a conserved YAcAr domain (PF10686 / IPR019627) belonging to the MCP/YpsA-like structural
  superfamily (SSF102405), which is widespread in bacteriophages and bacteria, although
  its specific biochemical activity during L5 infection remains experimentally uncharacterized.
