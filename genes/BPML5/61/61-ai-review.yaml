suggested_questions:
- question: Does the MCP/YpsA-like (YAcAr) domain of L5 gp61 bind NAD+ or nucleotide
    derivatives, or inhibit host mycobacterial cell division during lytic infection?
  experts:
  - Graham F. Hatfull
suggested_experiments:
- hypothesis: L5 gp61 binds nucleotide cofactors via its MCP/YpsA-like Rossmannoid
    fold or interacts with host cell division machinery during early lytic infection.
  description: Express gp61 in Mycobacterium smegmatis to assay effects on cell length
    and FtsZ ring assembly by fluorescence microscopy, and perform differential scanning
    fluorimetry (thermal shift) with purified gp61 against a panel of nucleotides
    and nicotinamide cofactors.
  experiment_type: ligand thermal shift assay and host overexpression phenotype analysis
