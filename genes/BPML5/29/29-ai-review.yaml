- term:
    id: GO:0005198
    label: structural molecule activity
  evidence_type: IEA
  original_reference_id: file:genes/BPML5/29/29-uniprot.txt
  qualifier: enables
  review:
    summary: Gp29 contains the conserved Phage_gene29 minor tail structural domain (IPR021226/PF10910) and is encoded within the L5 minor tail gene cluster.
    action: NEW
    reason: Syntenic location within the L5 distal tail gene cluster (between gp28 and gp31) and conservation of the Phage_gene29 domain (IPR021226/PF10910) across mycobacteriophage tail modules support a structural role in the phage tail tip.
    supported_by:
    - reference_id: file:genes/BPML5/29/29-uniprot.txt
      supporting_text: DR   InterPro; IPR021226; Phage_gene29.
