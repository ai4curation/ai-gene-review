suggested_questions:
- question: Is Gp29 incorporated into the mature distal tail tip complex of L5 virions, or does it act as a tail fiber/tip assembly factor?
  experts:
  - Graham F. Hatfull
suggested_experiments:
- description: Perform LC-MS/MS proteomics on CsCl-purified mycobacteriophage L5 virions to quantify the copy number of Gp29 per virion.
  hypothesis: Gp29 is present in low copy number (3 to 6 copies per virion) as part of the distal tail tip complex.
