  label: Fromanvirus L5
description: Putative minor tail protein (Gp29, 147 aa) encoded in the distal tail morphogenesis gene cluster of mycobacteriophage L5 immediately downstream of minor tail protein Gp28. Defines the conserved Phage_gene29 domain family (IPR021226/PF10910) found in siphoviral minor tail and tail tip complexes.
