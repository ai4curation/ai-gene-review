    summary: As a conserved component of the minor tail gene cluster (IPR021226), Gp29 participates in assembly of the distal tail tip complex.
    action: NEW
    reason: Phage minor tail proteins encoded in the gp27-gp31 cluster assemble into the distal tail tip structure required for siphoviral tail morphogenesis.
