  label: Fromanvirus L5
description: Putative terminase small subunit (gp5, 155 AA) of Mycobacterium phage L5 containing a conserved Terminase_7 domain (PF25673 / IPR057972). It is predicted to recognize phage concatemeric DNA and recruit the large terminase subunit (gp13) to initiate viral DNA genome packaging into the procapsid.
