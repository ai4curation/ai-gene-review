  label: Fromanvirus L5
description: Uncharacterized 142-amino-acid protein (Gp46) encoded in the right arm of the Mycobacterium phage L5 genome. Structural classification predicts a homeodomain-like helical fold (Gene3D:1.10.10.60) and a central disordered region (residues 82-101), but its specific biochemical activity and biological role remain unknown.
existing_annotations: []
core_functions:
- description: Uncharacterized 142-amino-acid right-arm phage protein with a predicted homeodomain-like helical fold (Gene3D:1.10.10.60); specific molecular activity has not yet been experimentally determined.
