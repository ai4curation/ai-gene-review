suggested_questions:
- question: Does the predicted homeodomain-like fold of Gp46 mediate sequence-specific DNA binding to phage L5 promoters or replication origins?
  experts:
  - Graham F. Hatfull
suggested_experiments:
- description: Purify recombinant Gp46 and perform electrophoretic mobility shift assays (EMSAs) and ChIP-seq during L5 infection of Mycobacterium smegmatis to test for DNA binding across the phage and host genomes.
  hypothesis: The predicted homeodomain-like fold of Gp46 binds phage or host DNA to regulate middle/late transcription or replication.
