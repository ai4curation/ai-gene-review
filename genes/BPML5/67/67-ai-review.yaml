  label: Fromanvirus L5
description: Gene 67 protein (gp67) of Mycobacterium phage L5 is an uncharacterized
  43-amino-acid protein encoded in the early leftwards-transcribed right-arm operon
  between the metallophosphoesterase gene 66 and gene 68. It is the founding member
  of the conserved Mycobacteriophage_Gp67 domain family (PF25715 / IPR057900) shared
  across related mycobacteriophages, although its specific molecular function in the
  phage replication cycle remains unknown.
