suggested_questions:
- question: Is the small 43-residue peptide gp67 essential for L5 lytic growth or
    does it modulate the activity of the adjacent metallophosphoesterase gp66 or nuclease
    gp69?
  experts:
  - Graham F. Hatfull
suggested_experiments:
- hypothesis: L5 gp67 is an early accessory peptide that interacts with neighboring
    phage enzymes (gp66 or gp69) or host machinery during early lytic infection.
  description: Construct an in-frame deletion of gene 67 in L5 by BRED recombineering
    to assay essentiality and plaque morphology, and perform pull-down mass spectrometry
    using epitope-tagged gp67 in infected Mycobacterium smegmatis.
  experiment_type: BRED gene deletion and affinity purification-mass spectrometry
