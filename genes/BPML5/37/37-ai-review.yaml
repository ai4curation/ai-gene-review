  label: Fromanvirus L5
description: Putative MazG-like nucleotide pyrophosphatase (Gp37, 114 aa) encoded in the early/integration region of mycobacteriophage L5 adjacent to the excisionase gene 36 (XIS). Contains a conserved all-alpha MazG nucleotide pyrophosphohydrolase domain (IPR004518/PF03819, IPR011379, cd11541) predicted to hydrolyze nucleoside triphosphates or nucleotide signaling molecules during phage infection.
