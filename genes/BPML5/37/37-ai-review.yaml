suggested_questions:
- question: What is the physiological nucleotide substrate of L5 Gp37 in infected mycobacteria—does it hydrolyze (p)ppGpp alarmones, mutagenic non-canonical dNTPs, or dCTPs/dGTPs?
  experts:
  - Graham F. Hatfull
suggested_experiments:
- description: Purify recombinant L5 Gp37 and screen its pyrophosphohydrolase activity against a panel of canonical dNTPs/rNTPs, 8-oxo-dGTP, dUTP, and ppGpp/pppGpp using a malachite green inorganic pyrophosphatase-coupled assay.
  hypothesis: Gp37 exhibits Mg2+-dependent nucleotide pyrophosphohydrolase activity toward specific nucleoside triphosphates or alarmones.
