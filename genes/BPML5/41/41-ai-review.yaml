description: Uncharacterized 83-amino-acid protein (Gp41) encoded in the right arm of the Mycobacterium phage L5 genome. It belongs to the conserved mycobacteriophage Gp41 protein family (IPR059530/PF26817), whose molecular function remains unknown.
