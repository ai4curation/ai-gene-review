id: Q05300
gene_symbol: '83'
status: COMPLETE
taxon:
  id: NCBITaxon:31757
  label: Fromanvirus L5
description: >-
  Gp83 is a 72-amino-acid (8.0 kDa) uncharacterized protein encoded by gene 83
  (ORF83) in the right-arm early lytic region of Mycobacterium phage L5. The
  ORF83 coding sequence contains an internal gp71-repressible early promoter that
  directs transcription of the downstream cytotoxic host-shut-off genes (genes
  77-79), whereas the biochemical function of the Gp83 polypeptide itself
  (translated from transcripts originating farther upstream at Pleft) remains
  unknown.
existing_annotations: []
core_functions:
- description: >-
    Uncharacterized right-arm early protein encoded by ORF83 with unknown
    molecular function and biological process.
  supported_by:
  - reference_id: PMID:8459766
    supporting_text: >-
      We describe here the complete DNA sequence of the L5 genome and initial
      characterization of L5 virion structure and gene expression.
references:
- id: PMID:8459766
  title: 'DNA sequence, structure and gene expression of mycobacteriophage L5: a phage
    system for mycobacterial genetics.'
  findings:
  - statement: >-
      Reports the complete DNA sequence and genome organization of
      mycobacteriophage L5, identifying gene 83 in the right-arm early region.
    supporting_text: >-
      We describe here the complete DNA sequence of the L5 genome and initial
      characterization of L5 virion structure and gene expression.
- id: PMID:18667563
  title: Identification of three cytotoxic early proteins of mycobacteriophage L5
    leading to growth inhibition in Mycobacterium smegmatis.
  findings:
  - statement: >-
      Demonstrates that a promoter situated within ORF83 directs transcription of
      the downstream cytotoxic early proteins gp77, gp78, and gp79 under the
      control of the phage repressor gp71.
    supporting_text: >-
      The transcription of the cytotoxic polypeptides is directed by a promoter
      situated in ORF83 and transcription control is achieved through the phage
      repressor gp71, which is shown by co-expression of this protein.
- id: file:genes/BPML5/83/83-uniprot.txt
  title: UniProtKB record for Q05300 (VG83_BPML5)
  findings:
  - statement: >-
      Documents that gene 83 encodes a 72-amino-acid uncharacterized protein
      (Gp83) of 8,043 Da identified from the complete genomic DNA sequence.
    supporting_text: >-
      RP   NUCLEOTIDE SEQUENCE [LARGE SCALE GENOMIC DNA].
suggested_questions:
- question: >-
    Is the 72-amino-acid Gp83 polypeptide actively translated from transcripts
    initiating upstream at Pleft during early lytic infection, and does it have a
    protein-level function independent of the internal promoter housed within ORF83?
suggested_experiments:
- description: >-
    Introduce synonymous or nonsense mutations into ORF83 outside the core promoter
    and gp71 stoperator motifs to uncouple Gp83 protein synthesis from ORF83
    promoter activity during L5 infection of Mycobacterium smegmatis.
  hypothesis: >-
    Mutations that abolish Gp83 translation while preserving the internal ORF83
    promoter will reveal whether the Gp83 polypeptide itself contributes to lytic
    growth.
