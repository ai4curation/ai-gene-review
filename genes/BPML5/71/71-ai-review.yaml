  label: Fromanvirus L5
description: Gene 71 protein (gp71, also known as the immunity repressor IMM) of Mycobacterium
  phage L5 is a 183-amino-acid Cro/C1-type helix-turn-helix DNA-binding transcriptional
  repressor required for establishing and maintaining the lysogenic prophage state
  and conferring immunity to L5 superinfection. Unlike canonical lambdoid repressors
  that act solely at operator sites flanking early promoters, gp71 binds multiple
  asymmetric DNA sites throughout the L5 genome, repressing transcription initiation
  at the early lytic promoter Pleft at the right end of the genome and also binding
  oriented intergenic 'stoperator' sites distributed across early and late lytic operons,
  imposing an orientation-dependent polar block to transcription elongation that globally
  silences prophage lytic gene expression.
