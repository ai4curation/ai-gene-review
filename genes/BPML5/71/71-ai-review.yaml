suggested_questions:
- question: What is the structural basis for how monomeric or oligomeric gp71 bound
    to an asymmetric 13-bp stoperator site blocks elongating mycobacterial RNA polymerase
    in only one orientation?
  experts:
  - Graham F. Hatfull
suggested_experiments:
- hypothesis: Orientation-dependent roadblocking of mycobacterial RNA polymerase by
    gp71 at stoperator sites depends on an asymmetric C-terminal surface of gp71 that
    physically resists dislodgement by elongating RNA polymerase approaching from
    the promoter-proximal side.
  description: Determine the high-resolution structure of L5 gp71 bound to a 13-bp
    asymmetric stoperator DNA duplex by X-ray crystallography or cryo-EM, and perform
    in vitro single-round transcription roadblocking assays with purified Mycobacterium
    smegmatis RNA polymerase and C-terminal point mutants of gp71.
  experiment_type: structural determination and in vitro transcription roadblocking
    assay
