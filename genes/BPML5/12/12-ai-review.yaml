  label: Fromanvirus L5
description: Endolysin B (LysB, gp12; 254 AA) of Mycobacterium phage L5, a mycolylarabinogalactan esterase that cleaves the ester linkage joining the mycolic acid-rich outer membrane (mycomembrane) to the arabinogalactan-peptidoglycan complex of the mycobacterial cell envelope. It contains an alpha/beta-hydrolase catalytic domain with a conserved Ser82-Asp166-His240 catalytic triad and a C-terminal four-helix lipid-binding domain, acting with Endolysin A (gp10) and the holin (gp11) to complete host cell lysis and viral release.
