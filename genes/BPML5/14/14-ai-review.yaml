  label: Fromanvirus L5
description: Portal vertex protein (gp14, 486 AA) of Mycobacterium phage L5 belonging to the SPP1 Gp6-like phage portal family (PF05133 / IPR021145). It assembles into a ring-shaped homododecamer at a single vertex of the icosahedral capsid, forming the axial channel through which viral genomic DNA is packaged into the procapsid by the terminase complex and subsequently ejected through the tail into the host mycobacterial cell.
