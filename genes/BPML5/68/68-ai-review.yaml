  label: Fromanvirus L5
description: Gene 68 protein (gp68) of Mycobacterium phage L5 is an uncharacterized
  79-amino-acid protein encoded in the early leftwards-transcribed right-arm operon
  between gene 67 and the PD-(D/E)XK nuclease gene 69. It is the founding member of
  the conserved mycobacteriophage GP68 protein family (PF17469 / IPR035343), whose
  biochemical activity and role in phage infection have not yet been determined.
