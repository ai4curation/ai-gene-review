suggested_questions:
- question: Does L5 gp68 interact with the adjacent AddAB-type PD-(D/E)XK nuclease
    gp69 as a recombination or exonuclease accessory subunit?
  experts:
  - Graham F. Hatfull
suggested_experiments:
- hypothesis: L5 gp68 forms a complex with the adjacent PD-(D/E)XK nuclease gp69 (analogous
    to phage synaptase/exonuclease pairs) to promote phage homologous recombination
    or DNA processing.
  description: Co-express L5 gp68 and gp69 in E. coli to test for physical complex
    formation by size-exclusion chromatography and pull-down assays, and evaluate
    whether gp68 modulates the nuclease activity of gp69 in vitro.
  experiment_type: protein co-purification and nuclease modulation assay
