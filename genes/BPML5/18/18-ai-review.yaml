  label: Fromanvirus L5
description: Uncharacterized 57-amino-acid protein (gp18) encoded immediately downstream of the major capsid protein gp17 in the head-to-tail connector region of the Mycobacterium phage L5 genome. It contains a conserved DUF7302 domain (PF23976 / IPR055726) and a charged disordered C-terminal tail (residues 33-57), and its specific role in virion assembly remains unknown.
