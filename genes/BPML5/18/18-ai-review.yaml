suggested_experiments:
- description: Generate an L5 gene 18 amber or deletion mutant to examine whether gp18 is required for head stabilization or tail attachment by electron microscopy of mutant lysates.
  hypothesis: Loss of gp18 will impair head-to-tail joining or capsid stability if it functions as part of the neck/connector module.
