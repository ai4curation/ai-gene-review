    - reference_id: PMID:9882658
      supporting_text: The arm-type integrase binding sites within attP play specialized roles in the formation of specific protein-DNA architectures; the intasome is constructed by the formation of intramolecular integrase bridges between one pair of sites, P4-P5, and the attP core, while an additional pair of sites, P1-P2, is required for interaction with attB.
