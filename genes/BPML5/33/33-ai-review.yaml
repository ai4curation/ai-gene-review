suggested_questions:
- question: What is the atomic-resolution architecture of the Int-L5/mIHF/attP integrative intasome vs. the Int-L5/mIHF/Xis-L5/attR excisive intasome?
  experts:
  - Graham F. Hatfull
  - Phoebe A. Rice
  - Gregory D. Van Duyne
suggested_experiments:
- description: Determine the cryo-EM structures of the reconstituted L5 integrative intasome (Int-L5 + mIHF + attP + attB synaptic complex) and excisive intasome (Int-L5 + mIHF + Xis-L5 + attR + attL).
  hypothesis: mIHF and Xis-L5 remodel DNA curvature in the P-arm to switch Int-L5 N-terminal domain bridging from P4-P5 (integration) to P1-P2 (excision).
