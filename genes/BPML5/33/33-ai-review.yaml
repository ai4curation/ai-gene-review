taxon:
  id: NCBITaxon:31757
  label: Fromanvirus L5
description: Tyrosine site-specific recombinase (integrase Int-L5, gp33, 371 aa) that catalyzes both integrative recombination between the phage attP site and the host mycobacterial attB tRNA-Gly gene to establish lysogeny, and Xis-dependent excisive recombination between attL and attR during prophage induction. Contains an N-terminal arm-type DNA-binding domain, a central core-binding domain, and a C-terminal tyrosine recombinase catalytic domain (active-site Tyr-349), and requires the host architectural factor mIHF to assemble active intasome complexes.
