- id: PMID:1901654
  title: 'Site-specific integration of mycobacteriophage L5: integration-proficient vectors for Mycobacterium smegmatis, Mycobacterium tuberculosis, and bacille Calmette-Guérin.'
  findings:
  - statement: Identified the L5 int gene and attP site, characterized the mycobacterial chromosomal attB site, and demonstrated stable Int-mediated site-specific integration in M. smegmatis, M. tuberculosis, and BCG.
    supporting_text: We have identified the int gene and attP site of L5, characterized the chromosomal attachment site (attB), and constructed plasmid vectors that efficiently transform M. smegmatis through stable site-specific integration of the plasmid into the bacterial genome.
- id: PMID:1620623
  title: The cohesive ends of mycobacteriophage L5 DNA.
  findings:
  - statement: Characterized the cohesive ends (cos site) of the linear L5 genome that circularize upon infection prior to Int-mediated integration.
    supporting_text: The cohesive ends of mycobacteriophage L5 DNA.
- id: PMID:8459766
  title: 'DNA sequence, structure and gene expression of mycobacteriophage L5: a phage system for mycobacterial genetics.'
  findings:
  - statement: Complete genome sequencing of mycobacteriophage L5 mapped the full-length 371-aa integrase gene 33 immediately adjacent to the attP attachment site near the center of the genome.
    supporting_text: We describe here the complete DNA sequence of the L5 genome and initial characterization of L5 virion structure and gene expression.
- id: PMID:8226625
  title: Mycobacteriophage L5 integrase-mediated site-specific integration in vitro.
  findings:
  - statement: Purified recombinant L5 integrase and reconstituted site-specific integrative recombination in vitro, discovering its requirement for a novel mycobacterial integration host factor.
    supporting_text: We describe here the overexpression and purification of L5 integrase and its ability to mediate integrative recombination in vitro.
- id: PMID:8808947
  title: Positions of strand exchange in mycobacteriophage L5 integration and characterization of the attB site.
  findings:
  - statement: Determined the exact positions of Int-catalyzed strand exchange within the 43-bp common core shared by attP and the host tRNA-Gly attB site, and defined a 29-bp minimal functional attB sequence.
    supporting_text: These two sites have a 43-bp common core sequence within which strand exchange occurs and which overlaps a tRNAGly gene at attB. We show here that a 29-bp segment of DNA is necessary and sufficient for attB function and identify the positions of strand exchange.
- id: PMID:8986825
  title: A novel host factor for integration of mycobacteriophage L5.
  findings:
  - statement: Purified and cloned the mycobacterial integration host factor (mIHF) and showed that it promotes the assembly of specific Int-mIHF-attP intasome complexes.
    supporting_text: By itself, mIHF does not bind preferentially to attP DNA, although it significantly alters the pattern of integrase (Int) binding, promoting the formation of specific integrase-mIHF-attP intasome complexes.
- id: PMID:9882658
  title: Protein-DNA complexes in mycobacteriophage L5 integrative recombination.
  findings:
  - statement: Demonstrated that Int-L5 forms intramolecular bridges between arm-type sites P4-P5 and the attP core to construct the integrative intasome, while arm sites P1-P2 are required for attB capture.
    supporting_text: Here we show that attP, Int-L5, and mIHF assemble into a recombinationally active complex, the intasome, which is capable of attB capture and formation of products.
- id: PMID:10652095
  title: Identification and characterization of mycobacteriophage L5 excisionase.
  findings:
  - statement: Identified gp36 (Xis) as the L5 excisionase that stimulates Int-L5-mediated excisive recombination in vivo and in vitro.
    supporting_text: We show here that L5 gene 36 encodes the phage excisionase and is a small, heat-stable 56-amino-acid protein that strongly stimulates excisive recombination both in vivo and in vitro.
- id: PMID:12581642
  title: Control of directionality in L5 integrase-mediated site-specific recombination.
  findings:
  - statement: Showed that Int-L5 catalyzes both integrative and excisive recombination, with Xis-L5 bending attR DNA to promote Int-L5 binding to P1-P2 arm sites to form intasome-R while inhibiting synaptic intermediate formation during integration.
    supporting_text: Both the integrative and excisive site-specific recombination events are catalyzed by the phage-encoded tyrosine integrase (Int-L5) and require the host-encoded protein, mIHF.
