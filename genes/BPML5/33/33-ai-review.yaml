  review:
    summary: Int-L5 is a hetero-bivalent DNA-binding protein that recognizes both arm-type (P1-P7) and core-type DNA sequences within attP and attB.
    action: ACCEPT
    reason: Biochemical footprinting and mobility-shift assays in PMID:8986825 and PMID:9882658 demonstrate direct binding of Int-L5 to arm-type and core-type attachment site DNA to form intramolecular bridges within the intasome.
