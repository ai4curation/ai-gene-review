description: Uncharacterized 83-amino-acid protein (gp3) encoded in the left arm of the Mycobacterium phage L5 genome upstream of the HNH endonuclease gp4. It belongs to the conserved mycobacteriophage Gp3 family (IPR057898 / PF25687), and its molecular function and role in the phage life cycle are unknown.
