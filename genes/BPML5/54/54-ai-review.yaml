  label: Fromanvirus L5
description: Putative metallophosphoesterase (Gp54, 255 aa) encoded in the right-arm nucleotide-metabolism cluster of the Mycobacterium phage L5 genome. It belongs to the calcineurin-like phosphoesterase superfamily (IPR004843/PF00149) and retains the conserved binuclear metal-binding active-site motifs typical of enzymes that hydrolyze phosphate ester bonds.
