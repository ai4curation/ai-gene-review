suggested_questions:
- question: What is the physiological phosphorylated substrate (e.g., cyclic nucleotide, dNTP/rNTP, or nucleic acid intermediate) hydrolyzed by Gp54 during phage L5 infection?
  experts:
  - Sujoy K. Das Gupta
  - Graham F. Hatfull
suggested_experiments:
- description: Purify recombinant Gp54 in the presence of divalent metal cofactors (Mn2+, Ni2+, Zn2+, Fe2+) and assay phosphomonoesterase and phosphodiesterase activity against bis(p-nitrophenyl) phosphate, cyclic dinucleotides (c-di-AMP, c-di-GMP), and canonical ribo/deoxyribonucleotides.
  hypothesis: Gp54 functions as a Mn2+- or Zn2+-dependent phosphoesterase that hydrolyzes nucleotide or nucleic acid intermediates during lytic infection.
