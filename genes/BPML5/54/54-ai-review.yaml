    label: hydrolase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR004843
  review:
    summary: Gp54 contains a conserved calcineurin-like metallophosphoesterase domain (IPR004843/PF00149), supporting refinement from general hydrolase activity (GO:0016787) to the more specific descendant term hydrolase activity, acting on ester bonds (GO:0016788).
    action: MODIFY
    reason: The calcineurin-like phosphoesterase domain (IPR004843 / PF00149 Metallophos) specifically catalyzes hydrolysis of phosphoester bonds, which is more accurately captured by the descendant term GO:0016788 (hydrolase activity, acting on ester bonds).
    proposed_replacement_terms:
    - id: GO:0016788
      label: hydrolase activity, acting on ester bonds
