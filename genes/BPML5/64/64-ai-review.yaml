id: Q05277
gene_symbol: '64'
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:31757
  label: Fromanvirus L5
description: Gene 64 protein (gp64) of Mycobacterium phage L5 is a 128-amino-acid
  protein encoded in the early leftwards-transcribed right-arm operon immediately
  downstream of the DnaB-like replicative DNA helicase gene 65. It is the founding
  member of the conserved Phage_VG64 domain family (PF25682 / IPR058243) distributed
  across related actinobacteriophages; although annotated in sequence databases as
  a putative DNA-binding protein based on its genomic context in the replication module,
  its biochemical activity has not been experimentally characterized.
