suggested_questions:
- question: Does L5 gp64 bind single- or double-stranded DNA or act as a helicase
    loader/accessory factor for the adjacent DnaB-like replicative helicase gp65?
  experts:
  - Graham F. Hatfull
suggested_experiments:
- hypothesis: L5 gp64 binds DNA and assists in loading or stabilizing the adjacent
    DnaB-like helicase gp65 at the phage replication fork.
  description: Purify recombinant L5 gp64 and assay binding to single-stranded, double-stranded,
    and forked DNA substrates by electrophoretic mobility shift assay (EMSA), and
    test whether gp64 physically interacts with or stimulates the ATPase/helicase
    activity of gp65.
  experiment_type: electrophoretic mobility shift assay and helicase interaction assay
