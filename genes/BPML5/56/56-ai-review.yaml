suggested_questions:
- question: To what extent is phage-encoded gp56 required in vivo when host thioredoxin
    TrxB is present and reduces L5 ribonucleotide reductase gp50 more efficiently
    in vitro?
  experts:
  - Sujoy K. Das Gupta
  - Graham F. Hatfull
suggested_experiments:
- hypothesis: L5 gp56 provides a fitness advantage for phage replication under conditions
    where host thioredoxin (TrxB) is depleted or diverted to oxidative stress defense.
  description: Construct an L5 delta-56 mutant by bacteriophage recombineering of
    electroporated DNA (BRED) and compare burst size and dNTP pool levels against
    wild-type L5 in Mycobacterium smegmatis under normal growth and oxidative stress
    conditions.
  experiment_type: phage mutant fitness and intracellular dNTP pool quantification
