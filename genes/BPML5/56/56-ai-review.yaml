  review:
    summary: Biochemical characterization of purified L5 gp56 demonstrates that the
      reduced protein catalyzes the reduction of protein disulfide bonds, including
      those of the phage-encoded ribonucleotide reductase gp50, using electrons supplied
      by NADPH and thioredoxin reductase.
    action: NEW
    reason: Q05266 currently has no GO annotations in GOA. Direct biochemical assays
      in PMID:24913246 establish that reduced gp56 acts as a reductant of protein
      disulfide bonds and reduces the L5 ribonucleotide reductase gp50.
    supported_by:
    - reference_id: PMID:24913246
      supporting_text: The reduced protein can subsequently act as a reductant of
        protein disulfide bonds. Gp56 can be reduced by NADPH with the help of thioredoxin
        reductase (TrxR) but less efficiently as compared with TrxB. The abilities
        of Gp56 and TrxB to reduce Gp50, the L5-encoded ribonucleotide reductase,
        was examined. While both are capable of executing this function, the former
        needs more reducing equivalents in the process as compared with the latter.
