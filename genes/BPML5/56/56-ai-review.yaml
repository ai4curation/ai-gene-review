  label: Fromanvirus L5
description: Gene 56 protein (gp56) of Mycobacterium phage L5 is a 103-amino-acid
  NrdH-like redoxin belonging to the glutaredoxin/thioredoxin superfamily. Encoded
  in the early leftwards-transcribed right-arm operon near the phage DNA replication
  and nucleotide metabolism genes, gp56 adopts a glutaredoxin fold with a conserved
  active-site CXXC motif. Despite its sequence homology to glutaredoxins, gp56 exhibits
  thioredoxin-like biochemical properties, receiving electrons from NADPH via host
  thioredoxin reductase (TrxR) rather than glutathione. In its reduced state, gp56
  catalyzes the reduction of protein disulfide bonds and acts as an electron donor
  for the phage-encoded class II ribonucleotide reductase (gp50) to support deoxyribonucleotide
  biosynthesis during viral replication.
