id: Q05302
gene_symbol: '85'
status: COMPLETE
taxon:
  id: NCBITaxon:31757
  label: Fromanvirus L5
description: >-
  Gp85 is an 88-amino-acid (10.2 kDa) protein of unknown function encoded by gene
  85 in the right-arm early lytic region of Mycobacterium phage L5. It is situated
  between genes 86 and 84 within the leftward-transcribed early operon initiated
  at the Pleft promoter and regulated by the phage repressor gp71, and lacks
  conserved domain annotations or experimental functional characterization.
existing_annotations: []
core_functions:
- description: >-
    Uncharacterized early lytic protein encoded by gene 85 with unknown
    molecular function and biological process.
  supported_by:
  - reference_id: PMID:8459766
    supporting_text: >-
      We describe here the complete DNA sequence of the L5 genome and initial
      characterization of L5 virion structure and gene expression.
references:
- id: PMID:8459766
  title: 'DNA sequence, structure and gene expression of mycobacteriophage L5: a phage
    system for mycobacterial genetics.'
  findings:
  - statement: >-
      Establishes the complete DNA sequence and gene organization of
      mycobacteriophage L5, identifying gene 85 in the right-arm early region.
    supporting_text: >-
      We describe here the complete DNA sequence of the L5 genome and initial
      characterization of L5 virion structure and gene expression.
- id: PMID:8594325
  title: Transcriptional regulation of repressor synthesis in mycobacteriophage L5.
  findings:
  - statement: >-
      Shows that early lytic transcription across the right arm initiates at the
      Pleft promoter near the right end of the L5 genome and is regulated by
      gp71.
    supporting_text: >-
      In early lytic growth, gene 71 is also transcribed from a promoter, Pleft,
      located at the right end of the genome and which appears to be a target of
      gp71 regulation.
- id: file:genes/BPML5/85/85-uniprot.txt
  title: UniProtKB record for Q05302 (VG85_BPML5)
  findings:
  - statement: >-
      Documents that gene 85 encodes an 88-amino-acid uncharacterized protein
      (Gp85) of 10,159 Da identified from the complete genomic DNA sequence.
    supporting_text: >-
      RP   NUCLEOTIDE SEQUENCE [LARGE SCALE GENOMIC DNA].
suggested_questions:
- question: >-
    Is gp85 essential for early lytic infection of Mycobacterium smegmatis, or does
    it serve a host-range-specific role in slow-growing mycobacteria?
suggested_experiments:
- description: >-
    Generate a targeted deletion of gene 85 in Mycobacterium phage L5 and assay
    plaque formation, burst size, and host growth effects upon inducible expression
    in Mycobacterium smegmatis.
  hypothesis: >-
    Gp85 functions as an accessory early protein expressed immediately after
    transcription initiation from Pleft.
