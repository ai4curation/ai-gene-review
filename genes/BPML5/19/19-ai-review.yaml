core_functions:
- description: Conserved Mycophage_D29_Gp19-family protein (gp19, IPR018963/PF09355) encoded in the putative head-to-tail connector region of the Mycobacterium phage L5 structural operon; its specific molecular activity in virion morphogenesis remains unknown.
  supported_by:
