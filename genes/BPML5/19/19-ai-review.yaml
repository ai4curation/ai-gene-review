suggested_questions:
- question: Does L5 gp19 form one of the head-to-tail neck adaptor rings connecting the gp14 portal vertex to the siphoviral tail?
  experts:
  - Graham F. Hatfull
suggested_experiments:
- description: Test pairwise interactions of L5 gp19 with the portal protein gp14 and neighboring connector candidates (gp18, gp20, gp21, gp22) by bacterial two-hybrid and co-immunoprecipitation assays.
  hypothesis: Gp19 directly binds the portal vertex or adjacent neck proteins to assemble the head-to-tail interface.
  experiment_type: Protein-protein interaction assay
