  label: Fromanvirus L5
description: Uncharacterized 125-amino-acid protein (gp19) encoded between genes 18 and 20 in the putative head-to-tail connector region of the Mycobacterium phage L5 genome. It contains the conserved Mycophage_D29_Gp19 domain (PF09355 / IPR018963), but its molecular function and role in virion morphogenesis remain unknown.
