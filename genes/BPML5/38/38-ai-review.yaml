  label: Fromanvirus L5
description: Uncharacterized 50-amino-acid polypeptide (Gp38) encoded in the early/integration region of mycobacteriophage L5 adjacent to gene 37. Features a predicted N-terminal signal-like hydrophobic sequence containing a lipobox-like cysteine motif, though its biological function and subcellular localization have not been experimentally determined.
existing_annotations: []
core_functions:
- description: Uncharacterized 50-amino-acid polypeptide encoded in the early/integration region of mycobacteriophage L5 adjacent to gene 37; its molecular function remains unknown.
