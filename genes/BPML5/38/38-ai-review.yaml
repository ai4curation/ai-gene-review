suggested_questions:
- question: Is Gp38 processed by mycobacterial lipoprotein signal peptidase LspA at Cys-21 to act as a cell-envelope superinfection exclusion lipoprotein?
  experts:
  - Graham F. Hatfull
suggested_experiments:
- description: Express Gp38 in Mycobacterium smegmatis and test for acylation and processing by LspA, as well as superinfection resistance against homotypic and heterotypic mycobacteriophages.
  hypothesis: Gp38 is a small phage-encoded lipoprotein localized to the mycobacterial cell envelope.
