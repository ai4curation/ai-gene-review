id: Q05295
gene_symbol: '80'
status: COMPLETE
taxon:
  id: NCBITaxon:31757
  label: Fromanvirus L5
description: >-
  Gp80 is a 92-amino-acid (10.1 kDa) protein of unknown function encoded by gene
  80 in the right-arm early lytic region of Mycobacterium phage L5. It is situated
  immediately upstream of the cytotoxic early gene cluster (genes 77-79) and
  downstream of the gp71-regulated internal promoter in ORF83, but lacks conserved
  domain annotations and was not found to be individually toxic when expressed in
  Mycobacterium smegmatis.
existing_annotations: []
core_functions:
- description: >-
    Uncharacterized early right-arm phage protein encoded upstream of the
    cytotoxic early gene cluster (genes 77-79) and downstream of the
    gp71-regulated promoter in ORF83 of Mycobacterium phage L5.
  supported_by:
  - reference_id: PMID:8459766
    supporting_text: >-
      We describe here the complete DNA sequence of the L5 genome and initial
      characterization of L5 virion structure and gene expression.
  - reference_id: PMID:18667563
    supporting_text: >-
      The transcription of the cytotoxic polypeptides is directed by a promoter
      situated in ORF83 and transcription control is achieved through the phage
      repressor gp71, which is shown by co-expression of this protein.
references:
- id: PMID:8459766
  title: 'DNA sequence, structure and gene expression of mycobacteriophage L5: a phage
    system for mycobacterial genetics.'
  findings:
  - statement: >-
      Establishes the complete genome sequence and gene map of mycobacteriophage
      L5, identifying gene 80 in the right-arm early region.
    supporting_text: >-
      We describe here the complete DNA sequence of the L5 genome and initial
      characterization of L5 virion structure and gene expression.
- id: PMID:18667563
  title: Identification of three cytotoxic early proteins of mycobacteriophage L5
    leading to growth inhibition in Mycobacterium smegmatis.
  findings:
  - statement: >-
      Demonstrates that an internal promoter situated in ORF83 directs
      gp71-regulated transcription across the downstream early operon containing
      genes 82-77, whereas only gp77, gp78, and gp79 are individually cytotoxic
      to Mycobacterium smegmatis.
    supporting_text: >-
      The transcription of the cytotoxic polypeptides is directed by a promoter
      situated in ORF83 and transcription control is achieved through the phage
      repressor gp71, which is shown by co-expression of this protein.
- id: file:genes/BPML5/80/80-uniprot.txt
  title: UniProtKB record for Q05295 (VG80_BPML5)
  findings:
  - statement: >-
      Documents that gene 80 encodes a 92-amino-acid uncharacterized protein
      (Gp80) from the complete genomic DNA sequence of Mycobacterium phage L5.
    supporting_text: >-
      RP   NUCLEOTIDE SEQUENCE [LARGE SCALE GENOMIC DNA].
suggested_questions:
- question: >-
    What role does gp80 play when co-expressed with the downstream cytotoxic
    proteins gp77, gp78, and gp79 from the ORF83 promoter?
suggested_experiments:
- description: >-
    Compare the plaque phenotype and host shut-off kinetics of wild-type L5 and an
    in-frame gene 80 deletion mutant in Mycobacterium smegmatis.
  hypothesis: >-
    Gp80 acts as a non-toxic accessory or regulatory subunit within the ORF83-driven
    early lytic operon.
