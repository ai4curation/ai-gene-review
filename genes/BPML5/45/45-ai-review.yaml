  label: Fromanvirus L5
description: Uncharacterized 97-amino-acid protein (Gp45) encoded immediately downstream of the DNA polymerase gene (gene 44) in the right arm of the Mycobacterium phage L5 genome. It belongs to the conserved phage L5 Gp45 family (IPR059747/PF26905) of unknown molecular function.
existing_annotations: []
core_functions:
- description: Uncharacterized 97-amino-acid right-arm phage protein containing the conserved Phage_L5_Gp45 domain (IPR059747 / PF26905); specific molecular activity has not yet been experimentally determined.
