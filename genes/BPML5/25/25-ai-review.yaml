  - UniProtKB-KW:KW-1245
  review:
    summary: Gp25 is the conserved transframe tail assembly chaperone (analogous to phage lambda gpGT) required for scaffolding tail tube assembly.
    action: ACCEPT
    reason: Conserved -1 frameshift architecture between genes 24 and 25 and homology to dsDNA phage tail assembly chaperones (IPR020132) establish that Gp25 acts with Gp24 to scaffold polymerization of the major tail tube subunit around the tape measure protein.
    supported_by:
    - reference_id: PMID:15469818
      supporting_text: In bacteriophage lambda, this frameshift controls production of two proteins with overlapping sequences, gpG and gpGT, that are required for tail assembly.
    - reference_id: file:genes/BPML5/25/25-uniprot.txt
      supporting_text: 'CC   -!- FUNCTION: Promotes tail assembly by creating a scaffold for the tail'
core_functions:
- description: Acts as the transframe tail assembly chaperone (gp24-gp25 fusion) that cooperates with Gp24 to coat the tape measure protein (Gp26) and recruit the major tail subunit (Gp23) for tail tube polymerization during viral tail assembly.
