existing_annotations:
- term:
    id: GO:0075523
    label: viral translational frameshifting
  evidence_type: IEA
  original_reference_id: GO_REF:0000043
  qualifier: involved_in
  supporting_entities:
  - UniProtKB-KW:KW-0688
  review:
    summary: Automated keyword mapping from UniProtKB-KW:KW-0688 (Ribosomal frameshifting) reflects the translational mechanism that produces Gp25 rather than a function of the protein itself.
    action: REMOVE
    reason: Programmed -1 translational frameshifting is mediated by a cis-acting slippery sequence in the viral mRNA during translation by the host ribosome; the resulting Gp25 protein is the product of frameshifting and does not itself perform translational frameshifting.
    supported_by:
    - reference_id: PMID:15469818
      supporting_text: A programmed translational frameshift similar to frameshifts in retroviral gag-pol genes and bacterial insertion elements was found to be strongly conserved in tail assembly genes of dsDNA phages and to be independent of sequence similarities.
