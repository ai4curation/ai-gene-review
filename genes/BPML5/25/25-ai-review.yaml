  label: Fromanvirus L5
description: Transframe tail assembly chaperone protein (Gp25, 272 aa) of mycobacteriophage L5 produced via a conserved programmed -1 ribosomal frameshift from gene 24 into gene 25. Analogous to bacteriophage lambda gpGT, Gp25 shares its N-terminal tape-measure-binding domain with Gp24 (Q05231) and supplies a C-terminal domain that promotes polymerization of the major tail subunit (Gp23) around the tape measure protein scaffold (Gp26) during tail morphogenesis.
