references:
- id: GO_REF:0000043
  title: Gene Ontology annotation based on UniProtKB/Swiss-Prot keyword mapping
  findings: []
- id: PMID:8459766
  title: 'DNA sequence, structure and gene expression of mycobacteriophage L5: a phage system for mycobacterial genetics.'
  findings:
  - statement: Complete genome sequencing of mycobacteriophage L5 identified gene 25 between gene 24 and the tape measure protein gene 26 in the tail morphogenesis module.
    supporting_text: We describe here the complete DNA sequence of the L5 genome and initial characterization of L5 virion structure and gene expression.
- id: PMID:15469818
  title: Conserved translational frameshift in dsDNA bacteriophage tail assembly genes.
  findings:
  - statement: Identified the conserved programmed -1 translational frameshift in phage tail assembly genes that generates the overlapping gpG/gpGT-like chaperone pair required for tail assembly in phages whose tail length is controlled by a tape measure protein.
    supporting_text: A programmed translational frameshift similar to frameshifts in retroviral gag-pol genes and bacterial insertion elements was found to be strongly conserved in tail assembly genes of dsDNA phages and to be independent of sequence similarities. In bacteriophage lambda, this frameshift controls production of two proteins with overlapping sequences, gpG and gpGT, that are required for tail assembly.
- id: file:genes/BPML5/25/25-uniprot.txt
  title: UniProtKB record for Q05232 (TAP25_BPML5)
  findings:
  - statement: Gp25 is a 272-amino-acid transframe protein produced by a -1 ribosomal frameshift that acts with Gp24 to create a tail assembly scaffold and is released upon tail tube polymerization.
    supporting_text: 'CC   -!- FUNCTION: Promotes tail assembly by creating a scaffold for the tail'
suggested_questions:
- question: Does the disordered, highly charged C-terminal region of L5 Gp25 (residues 219-272) directly bind and nucleate polymerization of the major tail subunit Gp23?
  experts:
  - Roger W. Hendrix
  - Robert L. Duda
  - Graham F. Hatfull
suggested_experiments:
- description: Introduce synonymous mutations that disrupt the -1 frameshift slippery sequence between genes 24 and 25, and test complementation of tail assembly by supplying the full-length Gp25 fusion protein in trans.
  hypothesis: Abolishing the frameshift prevents tail assembly, and wild-type tail morphogenesis requires both Gp24 and the C-terminal extension of Gp25 in an appropriate stoichiometric ratio.
