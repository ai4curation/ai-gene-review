id: Q05301
gene_symbol: '84'
status: COMPLETE
taxon:
  id: NCBITaxon:31757
  label: Fromanvirus L5
description: >-
  Gp84 is a 66-amino-acid (7.4 kDa) protein of unknown function encoded by gene
  84 in the right-arm early lytic region of Mycobacterium phage L5 and belonging
  to the conserved Phage_Gp84 family (PF23794 / IPR056577). It is positioned
  within the leftward-transcribed early region between gene 85 and ORF83 downstream
  of the early lytic promoter Pleft, and its specific biochemical activity and
  role during phage infection have not been determined.
existing_annotations: []
core_functions:
- description: >-
    Uncharacterized early lytic protein containing the Phage_Gp84 domain
    (PF23794 / IPR056577) with unknown molecular function and biological process.
  supported_by:
  - reference_id: PMID:8459766
    supporting_text: >-
      We describe here the complete DNA sequence of the L5 genome and initial
      characterization of L5 virion structure and gene expression.
  - reference_id: file:genes/BPML5/84/84-uniprot.txt
    supporting_text: >-
      DR   Pfam; PF23794; Phage_Gp84; 1.
references:
- id: PMID:8459766
  title: 'DNA sequence, structure and gene expression of mycobacteriophage L5: a phage
    system for mycobacterial genetics.'
  findings:
  - statement: >-
      Reports the complete genome sequence and gene map of mycobacteriophage L5,
      identifying gene 84 in the leftward-transcribed right-arm early region.
    supporting_text: >-
      We describe here the complete DNA sequence of the L5 genome and initial
      characterization of L5 virion structure and gene expression.
- id: PMID:9312049
  title: Transcriptional silencing by the mycobacteriophage L5 repressor.
  findings:
  - statement: >-
      Shows that the L5 repressor gp71 regulates early lytic transcription
      initiation at Pleft and silences downstream expression via stoperator sites.
    supporting_text: >-
      L5 gp71 regulates transcription initiation at an early lytic promoter, Pleft,
      but also affects downstream gene expression at 'stoperator' sites in the
      phage genome.
- id: file:genes/BPML5/84/84-uniprot.txt
  title: UniProtKB record for Q05301 (VG84_BPML5)
  findings:
  - statement: >-
      Documents that gene 84 encodes a 66-amino-acid protein (Gp84) classified in
      the Phage_Gp84 domain family (PF23794 / IPR056577).
    supporting_text: >-
      DR   Pfam; PF23794; Phage_Gp84; 1.
suggested_questions:
- question: >-
    What is the molecular target or function of the conserved Phage_Gp84 domain
    during the earliest stage of L5 lytic transcription from Pleft?
suggested_experiments:
- description: >-
    Express tagged gp84 in Mycobacterium smegmatis to assess effects on host cell
    growth and perform co-immunoprecipitation coupled to mass spectrometry to
    identify interacting proteins.
  hypothesis: >-
    Gp84 acts as an early lytic accessory factor in the host cytoplasm following
    transcription from Pleft.
