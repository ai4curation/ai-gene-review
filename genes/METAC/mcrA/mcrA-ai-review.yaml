  title: 'Anaerobic growth of Methanosarcina acetivorans C2A on carbon monoxide: an
    unusual way of life for a methanogenic archaeon.'
  findings:
  - statement: M. acetivorans grows on CO mainly by acetogenesis/formigenesis, with
      methane formation dominating only in stationary phase; it is devoid of significant
      hydrogen metabolism.
    supporting_text: Methane formation surpassed acetate/formate formation only when
      the cultures entered stationary growth phase
