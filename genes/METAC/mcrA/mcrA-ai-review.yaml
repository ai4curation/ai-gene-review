- term:
    id: GO:0046906
    label: tetrapyrrole binding
  evidence_type: IDA
  original_reference_id: PMID:37307484
  qualifier: enables
  review:
    summary: The cryo-EM structure of M. acetivorans MCR resolves the nickel tetrapyrrole
      coenzyme F430 in the active site, with the alpha-subunit Gln161 as its axial
      ligand. MCR from a mcrD deletion strain has reduced F430 occupancy, and in the
      empty site Gln161 moves away from the cavity.
    action: NEW
    reason: Replaces the earlier draft's NEW GO:0016151 nickel cation binding, which
      described the nickel of a tetrapyrrole cofactor as a free cation. GO has no
      coenzyme F430 binding term; GO:0046906 tetrapyrrole binding (verified in QuickGO;
      parent of heme, chlorophyll and cobalamin binding) is the closest existing term,
      and a specific child is proposed under proposed_new_terms. F430 sits at the
      interface of several subunits, but the alpha subunit provides the axial ligand
      to its nickel, so the binding is a property of this subunit. Non-core relative
      to the catalytic activity it supports.
    supported_by:
    - reference_id: PMID:37307484
      supporting_text: Strong density is present throughout the entire active-site
        cavity, allowing for unambiguous identification of CoM, CoB, and F430 as well
        as the loop containing Glnα161.
    - reference_id: PMID:37307484
      supporting_text: Notably, Glnα161 has shifted ~7 Å away from the active-site
        cavity, consistent with a lack of F430.
