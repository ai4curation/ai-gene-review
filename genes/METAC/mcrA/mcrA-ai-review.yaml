gene_symbol: mcrA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:188937
  label: Methanosarcina acetivorans C2A
description: mcrA (MA_4546) encodes the alpha subunit of methyl-coenzyme M reductase
  (MCR) in the metabolically versatile marine methanogen Methanosarcina acetivorans
  C2A, which forms methane from acetate (acetoclastic route), from methanol and methylamines
  (methylotrophic route) and, in stationary phase, from carbon monoxide, but cannot
  use H2 plus CO2. MCR is a soluble cytoplasmic alpha2beta2gamma2 heterohexamer that
  catalyzes the terminal, methane-forming step shared by all of these routes, the
  reduction of methyl-coenzyme M by coenzyme B to methane and the CoM-S-S-CoB heterodisulfide
  (EC 2.8.4.1). Each holoenzyme has two active sites formed at the alpha, alpha', beta,
  gamma interface, each holding one non-covalently bound nickel porphinoid coenzyme
  F430; the alpha subunit supplies the axial glutamine ligand (Gln161) to the F430
  nickel and most coenzyme M and coenzyme B contacts. The alpha subunit carries conserved
  active-site post-translational modifications (thioglycine, methylhistidine, methylcysteine,
  didehydroaspartate) and a C5-methylarginine (Arg285) installed by the radical SAM
  methyltransferase MA_4551, which is dispensable for growth but contributes to MCR
  stability. Cryo-EM structures of assembly intermediates show that the McrD protein
  binds the alpha subunit of apo-MCR and promotes F430 loading.
