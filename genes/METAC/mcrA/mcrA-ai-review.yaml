proposed_new_terms:
- proposed_name: coenzyme F430 binding
  proposed_definition: Binding to coenzyme F430, a nickel-containing tetrapyrrole
    (hydrocorphinoid) cofactor of methyl-coenzyme M reductase and related alkyl-coenzyme
    M reductases.
  justification: Every MCR alpha subunit binds F430 through an axial glutamine ligand
    to its nickel. GO has heme, chlorophyll and cobalamin binding under tetrapyrrole
    binding but no F430 term, so keyword mappings fall back to metal ion binding.
  proposed_parent:
    id: GO:0046906
    label: tetrapyrrole binding
  supported_by:
  - reference_id: PMID:37307484
    supporting_text: containing the F430 axial ligand Glnα161
suggested_questions:
- question: Should GO add a coenzyme F430 binding term (child of tetrapyrrole binding)
    for MCR alpha subunits, rather than relying on generic metal ion or nickel cation
    binding mappings?
- question: Should GO add a methanogenesis-from-methylamines child of GO:0015948,
    so that MCR in methylotrophic methanogens can be annotated with route-specific
    terms?
- question: What sequence or structural features, if any, determine whether an MCR
    operates mainly in methanogenesis or in anaerobic methane oxidation?
suggested_experiments:
- experiment_type: Genetic and biochemical characterization
  hypothesis: McrA post-translational modifications tune MCR stability or catalysis
    under the different methanogenic growth substrates of M. acetivorans.
  description: Compare MCR purified from wild type and PTM-enzyme deletion strains
    grown on methanol, trimethylamine and acetate, measuring F430 occupancy, thermal
    stability and steady-state activity.
