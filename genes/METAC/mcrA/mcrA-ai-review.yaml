  title: Methanosarcina acetivorans sp. nov., an Acetotrophic Methane-Producing Bacterium
    Isolated from Marine Sediments.
  findings:
  - statement: The type strain C2A grows and forms methane on acetate, methanol and
      methylamines but not on H2/CO2 or formate.
    supporting_text: Sodium acetate, methanol, methylamine, dimethylamine, and trimethylamine
      were substrates for growth and methanogenesis; H(2)-CO(2) (80:20) and sodium
