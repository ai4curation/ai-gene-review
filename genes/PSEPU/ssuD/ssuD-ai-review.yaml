references:
- id: PMID:10480865
  title: Characterization of a two-component alkanesulfonate monooxygenase from Escherichia coli.
  full_text_unavailable: true
  findings:
  - statement: Purified E. coli SsuD establishes alkanesulfonate-to-sulfite/aldehyde chemistry, used comparatively
      rather than as a S-313 assay.
    supporting_text: The pure enzyme catalyzed the conversion of pentanesulfonic acid to sulfite and pentaldehyde
    reference_section_type: ABSTRACT
  - statement: Reduced FMN and oxygen are chemical requirements for the characterized E. coli SsuD reaction.
    supporting_text: SsuD catalysis was absolutely dependent on FMNH(2) and oxygen
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract and publication-linked curated E. coli biochemical statements inspected; publisher
      full PDF recovery returned 403. Direct E. coli reaction evidence is comparative support, not a measurement
      of S-313 turnover or assembly.
- id: PMID:10781557
  title: The ssu locus plays a key role in organosulfur metabolism in Pseudomonas putida S-313.
  full_text_unavailable: false
  findings:
  - statement: Native S-313 complementation requires SsuD for the tested pentanesulfonate and benzenesulfonate
      growth conditions.
    supporting_text: No growth was seen with pentanesulfonate or benzenesulfonate in the absence of SsuD
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text inspected, including native plasmid deletion/complementation, polar effects
      on ssuF, and the S-313 SsuE heterologous extract assay. Growth necessity is not equivalent to isolated
      catalytic specificity or exclusive transport.
- id: PMID:12835925
  title: Characterization and identification of genes essential for dimethyl sulfide utilization in Pseudomonas
    putida strain DS1.
  full_text_unavailable: true
  findings:
  - statement: The DS1 strain study directly reports SsuD-dependent methanesulfonate desulfonation; its
      clone is included in the same UniProt sequence record.
    supporting_text: Disruption of ssuD and SsuD enzymatic activity demonstrated that methanesulfonate
      is a metabolic intermediate of DMS and desulfonated by SsuD.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract explicitly reports DS1 SsuD enzymology and methanesulfonate conversion. The
      fetched UniProt record maps both S-313 and DS1 clones; the native DS1 physiological setting is not
      relabeled S-313.
