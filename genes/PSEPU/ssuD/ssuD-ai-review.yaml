suggested_questions:
- question: Does purified S-313 SsuD act on aromatic sulfonates, or does its native aromatic-growth requirement
    reflect a larger multienzyme pathway?
suggested_experiments:
- description: Compare purified AF075709-derived SsuD on aliphatic and aromatic sulfonates with matched
    reduced-FMN supply, then add candidate native partner proteins while measuring sulfite and carbon
    products.
