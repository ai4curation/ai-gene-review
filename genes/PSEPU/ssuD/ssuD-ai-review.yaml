id: O85764
gene_symbol: ssuD
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:303
  label: Pseudomonas putida
description: SsuD is a reduced-FMN-dependent alkanesulfonate monooxygenase that releases sulfite for sulfur
  assimilation by cleaving the carbon-sulfur bond of sulfonate substrates. The corresponding aldehyde
  and oxidized FMN are products of the oxygen-dependent reaction. Pseudomonas putida S-313 complementation
  experiments require SsuD for growth with pentanesulfonate and benzenesulfonate, although the latter
  growth phenotype does not establish isolated SsuD aromatic-substrate chemistry. The sequence record
  also includes DS1, where methanesulfonate turnover was demonstrated during dimethyl sulfide utilization.
  Native partners and substrate spectra must be distinguished from those of the biochemically characterized
  E. coli enzyme.
