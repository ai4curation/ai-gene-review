id: P0DOV5
gene_symbol: PpSQ1_00405
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:303
  label: Pseudomonas putida
description: >-
  Sulfoquinovose 1-dehydrogenase (SQDH, EC 1.1.1.390) of Pseudomonas putida SQ1, a homotetrameric
  short-chain dehydrogenase/reductase (SDR) that catalyzes the first step of the sulfoglycolytic
  Entner-Doudoroff (sulfo-ED) pathway: NAD+-dependent oxidation of the plant sulfosugar
  sulfoquinovose (6-deoxy-6-sulfo-D-glucose) at C1 to 6-deoxy-6-sulfo-D-glucono-1,5-lactone
  (RHEA:47896). The enzyme strongly prefers NAD+ over NADP+, follows an ordered mechanism in which
  NAD+ binds first, and uses the conserved SDR Asn-Ser-Tyr-Lys catalytic tetrad, with an arginine
  lining a sulfonate-binding pocket. It is encoded in the SQ-induced sulfo-ED gene cluster together
  with the lactonase, dehydratase, KDSG aldolase and sulfolactaldehyde dehydrogenase that convert
  SQ to pyruvate (used for growth) and 3-sulfolactate (excreted).
existing_annotations:
- term:
    id: GO:0016616
    label: oxidoreductase activity, acting on the CH-OH group of donors, NAD or NADP as acceptor
  evidence_type: IDA
  original_reference_id: PMID:26195800
  qualifier: enables
  review:
    summary: >-
      Purified recombinant enzyme oxidizes the C1 hydroxyl of sulfoquinovose with NAD+ as acceptor.
      This is the nearest existing GO parent of the exact reaction (EC 1.1.1.390, RHEA:47896), for
      which GO has no specific term.
    action: NEW
    reason: >-
      The GOA file carries no rows for this protein. The activity is established by direct enzymology
      (PMID:26195800, curated in UniProt with ECO:0000269) and by the independent full kinetic and
      structural study PMID:39840830. A specific child term is requested in proposed_new_terms; until
      it exists, GO:0016616 is the most specific accurate term (the donor is a CH-OH group, the
      acceptor NAD+).
    supported_by:
    - reference_id: file:PSEPU/PpSQ1_00405/PpSQ1_00405-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: Catalyzes the oxidation of sulfoquinovose to 6-deoxy-6-sulfo-D-glucono-1,5-lactone,
        with a strong preference for NAD(+) as the electron acceptor.
    - reference_id: PMID:39840830
      supporting_text: This corresponds to a million-fold preference for NAD+ in terms of (kcat/KM)app
        values.
- term:
    id: GO:0061722
    label: sulphoglycolysis
  evidence_type: IDA
  original_reference_id: PMID:26195800
  qualifier: involved_in
  review:
    summary: >-
      SQ dehydrogenase performs the first, committing step of the sulfo-ED route, which converts SQ
      to pyruvate and sulfolactaldehyde; the route was reconstituted in vitro from the purified
      P. putida SQ1 enzymes.
    action: NEW
    reason: >-
      GO:0061722 is defined as SQ breakdown resulting in DHAP and pyruvate; the sulfo-ED route
      produces pyruvate and the enzyme itself catalyzes a step of it, so the participation bar is
      met (the gene product does the work of the first step, it is not merely required). The protein
      is strongly induced during growth on SQ.
    supported_by:
    - reference_id: PMID:26195800
      supporting_text: It involves an NAD(+)-dependent SQ dehydrogenase, 6-deoxy-6-sulfogluconolactone
        (SGL) lactonase, 6-deoxy-6-sulfogluconate (SG) dehydratase, and 2-keto-3,6-dideoxy-6-sulfogluconate
        (KDSG) aldolase.
    - reference_id: PMID:26195800
      supporting_text: by in vitro reconstitution of the complete pathway by five heterologously produced
        enzymes
    - reference_id: file:PSEPU/PpSQ1_00405/PpSQ1_00405-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: Is involved in a degradation pathway of sulfoquinovose (SQ) that allows P.putida
        SQ1 to use SQ as the sole carbon and energy source for growth.
references:
- id: PMID:26195800
  title: Entner-Doudoroff pathway for sulfoquinovose degradation in Pseudomonas putida SQ1.
  full_text_unavailable: true
  findings:
  - statement: The sulfo-ED pathway begins with an NAD+-dependent SQ dehydrogenase and was reconstituted
      from five purified enzymes.
    supporting_text: It involves an NAD(+)-dependent SQ dehydrogenase, 6-deoxy-6-sulfogluconolactone
      (SGL) lactonase, 6-deoxy-6-sulfogluconate (SG) dehydratase, and 2-keto-3,6-dideoxy-6-sulfogluconate
      (KDSG) aldolase.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary characterization of the pathway and of this enzyme; cached abstract only
      (PMC XML restricted by the publisher). Enzymology details are taken from UniProt statements
      curated from this paper (ECO:0000269).
- id: PMID:39840830
  title: Structure, kinetics, and mechanism of Pseudomonas putida sulfoquinovose dehydrogenase, the first
    enzyme in the sulfoglycolytic Entner-Doudoroff pathway.
  findings:
  - statement: PpSQDH is a homotetrameric SDR enzyme strongly specific for NAD+.
    supporting_text: PpSQDH is a tetrameric enzyme belonging to the short-chain dehydrogenase/reductase
      (SDR) superfamily with a strong preference for NAD+ over NADP+.
    reference_section_type: ABSTRACT
  - statement: The catalytic site is the classical SDR tetrad.
    supporting_text: PpSQDH adopts the classical SDR fold with a highly conserved active site architecture
      comprising the Asn119-Ser147-Tyr160-Lys164 catalytic tetrad
  - statement: Kinetic mechanism is ordered with NAD+ binding first.
    supporting_text: Kinetic analysis revealed a rapid equilibrium ordered mechanism in which the NAD+
      cofactor is the first substrate to bind, and NADH is the last product to dissociate.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached; independent structural and kinetic confirmation of the activity
      on the same P. putida protein (PDB 9GWU/9GWV/9GWW are cross-referenced in the UniProt record).
- id: PMID:41676062
  title: Advances in microbial sulfoquinovose catabolism.
  findings:
  - statement: SQDH is the gatekeeper of the sulfo-ED pathway.
    supporting_text: In this pathway, α-SQ is first oxidized to 6-deoxy-6-sulfogluconolactone (SGL)
      by a NAD+-dependent sulfoquinovose dehydrogenase (SQDH).
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Recent review; used for pathway context only.
- id: PMID:32444469
  title: A Sulfoglycolytic Entner-Doudoroff Pathway in Rhizobium leguminosarum bv. trifolii SRDI565.
  full_text_unavailable: true
  findings:
  - statement: The sulfo-ED pathway also operates in Rhizobium leguminosarum.
    supporting_text: using a sulfoglycolytic Entner-Doudoroff (sulfo-ED) pathway, resulting in production
      of sulfolactate (SL) as the major metabolic end product.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Ortholog-organism context; abstract only.
