proposed_new_terms:
- proposed_name: sulfoquinovose 1-dehydrogenase (NAD+) activity
  proposed_definition: >-
    Catalysis of the reaction: 6-sulfo-D-quinovose + NAD+ = 6-deoxy-6-sulfo-D-glucono-1,5-lactone +
    NADH + H+.
  justification: >-
    EC 1.1.1.390 and RHEA:47896 describe this reaction, but GO has no corresponding term and no
    rhea2go/ec2go mapping, so the characterized sulfo-ED enzymes can only be annotated to the
    generic CH-OH/NAD(P) oxidoreductase parent.
  proposed_parent:
    id: GO:0016616
    label: oxidoreductase activity, acting on the CH-OH group of donors, NAD or NADP as acceptor
  proposed_mappings:
