  label: Pseudomonas putida
description: SsuB is the ATP-binding component of the SsuABC alkanesulfonate importer. Its ABC nucleotide-binding
  domain couples ATP hydrolysis to transport through the SsuC membrane subunit. The protein is predicted
  to associate peripherally with the cytoplasmic face of the inner membrane. The sequence record includes
  Pseudomonas putida S-313 and DS1; native S-313 insertion phenotypes require care because downstream
  SsuF expression can account for some growth defects.
