  review:
    summary: SsuB contributes the energy-coupling step of alkanesulfonate import.
    action: ACCEPT
    reason: 'The exact S-313 sequence is linked through AF075709 in the UniProt record. The transporter-family
      classification and curated functional assignment support this process role. S-313 ssuB insertion
      phenotypes are confounded by polar effects on ssuF: restoring SsuF restored sulfonate growth in
      PW7. Therefore that experiment is not treated as proof of an indispensable uptake ATPase, and retained
      growth does not invalidate an independently supported transport contribution.'
