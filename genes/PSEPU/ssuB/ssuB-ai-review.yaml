suggested_questions:
- question: How much of S-313 sulfonate uptake depends on SsuB when polar effects on ssuF are excluded?
suggested_experiments:
- description: Use an in-frame ssuB deletion with independent ssuF expression, quantify substrate uptake,
    and complement with wild-type or ATPase-site-mutated SsuB.
