suggested_questions:
- question: How do native intracellular substrate levels control the balance between butanediol oxidation
    and acetoin reduction?
- question: Do matched purified PpG2 Adh assays confirm the NAD preference and R-selectivity inferred
    from KT2440 BdhA?
suggested_experiments:
- description: Measure matched NAD(H)/NADP(H) and stereoisomer kinetics for purified PpG2 Adh; compare
    with the established KT2440 PP0552 assay.
  experiment_type: comparative enzyme kinetics
