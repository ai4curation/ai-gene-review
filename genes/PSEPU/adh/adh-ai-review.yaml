  qualifier: enables
  supporting_entities:
  - EC:1.1.1.4
  review:
    summary: R,R-butanediol oxidation is supported by the PpG2 locus and a close characterized homolog.
    action: ACCEPT
    reason: PMID:7813883 identifies and expresses the PpG2 Adh. Its full-length sequence differs at only
      8 of 362 residues from KT2440 BdhA, for which PMID:34513815 directly establishes the GO reaction.
      This is a supported homolog inference, not a claim that the 1994 accessible abstract reports PpG2
      stereochemical or NADP-exclusion assays.
    supported_by:
    - reference_id: PMID:7813883
      supporting_text: Expression of the P. putida ADH in Escherichia coli was demonstrated.
    - reference_id: file:PSEPU/adh/adh-bioinformatics/RESULTS.md
      supporting_text: Q59696 Adh and Q88QE2 BdhA have 354 identical residues in an ungapped 362-residue
        alignment (97.79% identity).
    - reference_id: PMID:34513815
      supporting_text: For the oxidative reaction, R,R-BDH can catalyze NAD-dependent dehydrogenation
        of (2R,3R)-2,3-BDO and meso-2,3-BDO.
