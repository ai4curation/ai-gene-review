id: Q59696
gene_symbol: adh
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:303
  label: Pseudomonas putida
description: Adh is a zinc-family butanediol dehydrogenase encoded beside the acetoin-cleaving genes in
  Pseudomonas putida PpG2. Its expression in Escherichia coli and induction with the native catabolic
  system link it to butanediol utilization. Near identity to the directly characterized KT2440 BdhA supports
  NAD-dependent R,R/meso-butanediol oxidation as a conserved activity; the detailed cofactor assignment
  remains a comparative inference for the PpG2 enzyme. An identical Adh sequence is also found in strain
  TS312.
