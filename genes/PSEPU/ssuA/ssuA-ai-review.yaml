  review:
    summary: A periplasmic binding protein is supported; its membrane association is unresolved.
    action: UNDECIDED
    reason: SsuA carries a secretion signal and substrate-binding-protein domains. These support periplasmic
      residence but do not establish a stable membrane pool. Association with a membrane transporter could
      explain the broad membrane assignment, and the absence of an anchor would not disprove peripheral
      association. No target-specific membrane fractionation or docking-localization experiment was identified;
      retain this uncertainty rather than infer exclusion from periplasmic localization.
