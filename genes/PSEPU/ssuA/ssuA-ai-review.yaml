  label: Pseudomonas putida
description: SsuA is the predicted periplasmic substrate-binding component of the SsuABC alkanesulfonate
  importer in Pseudomonas putida S-313. Its secretion signal and SsuA-family domains support capture of
  sulfonate substrates for an ATP-coupled transport complex. Native deletion-complementation experiments
  found that the tested sulfur sources could still support growth without SsuA, consistent with alternative
  uptake rather than demonstrating absence of transporter function. The UniProt sequence record also includes
  another strain, so the S-313 experimental context is distinguished from the generic species entry.
