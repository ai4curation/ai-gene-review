  review:
    summary: SsuA contributes substrate recognition to an alkanesulfonate ABC importer.
    action: MODIFY
    reason: The exact S-313 sequence is linked through AF075709 in the UniProt record. The generic ATPase-coupled
      transport claim is refined to the sulfonate-specific complex activity. SsuA is the binding subunit,
      not an autonomous ATPase or membrane pore. Native S-313 sequence/operon evidence and the characterized
      E. coli transport system support this inference; S-313 deletion nonauxotrophy limits necessity,
      not participation.
