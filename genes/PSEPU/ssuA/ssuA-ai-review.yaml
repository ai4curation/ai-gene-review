- id: PMID:10781557
  title: The ssu locus plays a key role in organosulfur metabolism in Pseudomonas putida S-313.
  full_text_unavailable: false
  findings:
  - statement: The S-313 locus contains the three inferred ABC-transporter components; sequence architecture
      is the basis for their specific roles.
    supporting_text: The first group consists of ssuA , ssuB , and ssuC , which are the genes for a putative
      ATP-binding cassette (ABC)-type transport system.
    reference_section_type: RESULTS
  - statement: SsuA deletion from a complementation construct did not abolish tested sulfur-source growth;
      alternative transport remains possible.
    supporting_text: Deletion of ssuA had no effect on growth with any sulfur source tested
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text inspected, including native plasmid deletion/complementation, polar effects
      on ssuF, and the S-313 SsuE heterologous extract assay. Growth necessity is not equivalent to isolated
      catalytic specificity or exclusive transport.
