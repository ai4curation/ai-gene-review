id: P16635
gene_symbol: gloA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:303
  label: Pseudomonas putida
description: >-
  gloA of Pseudomonas putida encodes glyoxalase I (lactoylglutathione lyase, EC 4.4.1.5), a small monomeric
  divalent-metal-dependent enzyme of the vicinal oxygen chelate (VOC) fold. It isomerises the hemithioacetal
  formed spontaneously from methylglyoxal and glutathione to (R)-S-lactoylglutathione, which glyoxalase
  II (GloB) then hydrolyses to D-lactate and glutathione. Expression of the cloned P. putida gene in E.
  coli or mammalian cells lowers intracellular methylglyoxal.
