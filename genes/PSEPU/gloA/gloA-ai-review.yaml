    label: methylglyoxal catabolic process
  evidence_type: IC
  original_reference_id: PMID:11461144
  qualifier: involved_in
  review:
    summary: >-
      Glyoxalase I carries out the first step of glutathione-dependent methylglyoxal catabolism.
    action: NEW
    reason: >-
      The enzyme performs the hemithioacetal-to-S-lactoylglutathione step itself, and expressing it lowers
      cellular methylglyoxal (UniProt pathway step 1/2), so the enzyme does part of the work of the process.
    supported_by:
    - *id001
