        the transgenic cells with the P. putida glyoxalase I displayed a reduction of 35-43% in intracellular
        MG
- term:
    id: GO:0046872
    label: metal ion binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR004361
  - InterPro:IPR018146
  review:
    summary: Generic metal ion binding from the glyoxalase I InterPro signatures.
    action: KEEP_AS_NON_CORE
    reason: >-
      Glyoxalase I needs one divalent metal per subunit, but UniProt lists Ni2+ or Zn2+ by similarity
      only and the native metal of this enzyme is not established, so the generic term is as precise as
      the evidence allows; cofactor binding is ancillary to the lyase activity. Treated the same way as
      the KT2440 ortholog (Q88GF8).
    supported_by:
    - reference_id: file:PSEPU/gloA/gloA-uniprot.txt
      record_section: ["CC:COFACTOR"]
      supporting_text: Binds 1 nickel or zinc ion per subunit.
- term:
