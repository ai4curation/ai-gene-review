    summary: InterPro/Rhea/EC mapping to glyoxalase I activity.
    action: ACCEPT
    reason: >-
      P16635 is the cloned P. putida glyoxalase I; it is a glyoxalase I family member in PTHR10374:SF30,
      and heterologous expression of the P. putida glyoxalase I gene raises glyoxalase I activity and
      lowers methylglyoxal in E. coli.
    supported_by:
