taxon:
  id: NCBITaxon:303
  label: Pseudomonas putida
description: SsuC is a multipass membrane permease assigned to the SsuABC alkanesulfonate import system
  of Pseudomonas putida S-313. It is expected to form the substrate-translocation component that works
  with the SsuB ATPase and SsuA binding protein. Conserved permease domains, membrane topology and the
  native ssu locus support this role; the original insertion-mutant study does not isolate transport necessity
  from downstream SsuF effects. The sequence record also represents another strain.
