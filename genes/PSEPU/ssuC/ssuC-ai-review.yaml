  review:
    summary: SsuC supplies the transmembrane component of alkanesulfonate import.
    action: ACCEPT
    reason: The exact S-313 sequence is linked through AF075709 in the UniProt record. Permease-family
      assignment and native ssuABC organization support the process contribution. The S-313 insertion
      phenotype alone cannot demonstrate exclusive uptake because of the documented polar effect on ssuF.
      This preserves an inferred transport role without asserting that SsuC independently hydrolyzes ATP.
