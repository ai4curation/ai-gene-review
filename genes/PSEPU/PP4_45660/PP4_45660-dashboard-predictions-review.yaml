description: >-
  The KBase gene-annotate dashboard (Dark Protein Atlas) LLM call for P. putida
  NZ_KZ987399.1_4576 is "DUF3422 family inner membrane protein of unknown molecular
  function" (tier A, Dark-Function stratum), with one GO term, GO:0005886 plasma membrane.
  The exact-sequence UniProt entries are deleted, so the call is scored on the type-strain
  reference-proteome entry A0ABN5URH5 (PP4_45660, P. putida NBRC 14164), 93.1% identical over
  all 405 residues. The gene is absent from KT2440, so there is no KT2440 Fitness Browser data.
  The call is supported and appropriately hedged. DUF3422 covers 98.8% of the query, and two
  independent topology predictors (DeepTMHMM in the dashboard evidence, Phobius in UniProt)
  place two alpha-helical TM segments at the C-terminus with no signal peptide, so
  inner-membrane localization is a sound sequence-model inference; GOA has no annotations, so
  the term is novel. No member of the DUF3422/COG4949 family has a characterized molecular
  function, and the annotator correctly declined to turn the distant-homolog (30-35%)
  carbon-source fitness phenotypes into a transporter or enzyme call. The tier-A label is
  generous, since its stated criterion rests on those distant homologs. The pipeline's
  Fitness Browser blocks also omitted the three close P. fluorescens FW300 orthologs
  (72-77% identity; Pf6N2E2_2210, AO356_01705, Pf1N1B4_5071), whose fitness data could not be
  retrieved here (Fitness Browser HTTP 403).
