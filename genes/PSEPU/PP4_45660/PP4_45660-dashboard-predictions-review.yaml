- source_method: gene-annotate dashboard LLM annotation (Dark Protein Atlas)
  source_version: '2026-10-30 snapshot'
  predicted_term:
    id: GO:0005886
    label: plasma membrane
  predicted_term_type: GO_CC
  review:
    assessment: COR
    confidence_score: 2
    summary: >-
      The prediction is correct as a sequence-model inference and novel (GOA for A0ABN5URH5 is
      empty). DeepTMHMM on the dashboard sequence predicts two alpha-helical TM segments
      (345-365, 380-397) and no signal peptide, and Phobius in the UniProt record independently
      predicts 348-368 and 380-399. Alpha-helical TM proteins of a Gram-negative bacterium
      without a beta-barrel signature are cytoplasmic-membrane proteins, which GO represents as
      plasma membrane. The protein is the full-length DUF3422 model (98.8% query coverage), so
      no TM region is missing from the scored accession. The support is prediction only: no
      DUF3422 protein has been localized experimentally.
