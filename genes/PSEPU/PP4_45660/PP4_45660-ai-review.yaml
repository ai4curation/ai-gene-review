core_functions: []
suggested_questions:
- question: >-
    What does the ~345-residue cytoplasmic DUF3422 domain bind or catalyze, and why do distant
    family members in Phaeobacter and Caulobacter show strong fitness defects on L-proline, L-citrulline,
    L-ornithine or D-xylose?
- question: >-
    Do the 72-77%-identical orthologs in P. fluorescens FW300-N2E2, N2C3 and N1B4
    (Pf6N2E2_2210, AO356_01705, Pf1N1B4_5071) have any specific fitness phenotype in the
    Fitness Browser?
suggested_experiments:
- description: >-
    Retrieve Fitness Browser data for Pf6N2E2_2210, AO356_01705 and Pf1N1B4_5071 (not reachable
    from this environment, HTTP 403) and check for condition-specific phenotypes and cofitness
    partners.
- description: >-
    Confirm inner-membrane localization and the cytoplasmic orientation of the N-terminal domain
    by fractionation and PhoA/LacZ or GFP fusion topology mapping.
- description: >-
    Delete the gene in NBRC 14164 or a P. fluorescens FW300 strain and phenotype it on proline,
    ornithine, citrulline and pentoses, the carbon sources implicated by distant homologs.
