  review:
    summary: Predicted integral component of the cytoplasmic (inner) membrane, anchored by two C-terminal transmembrane helices.
    action: NEW
    reason: >-
      GOA holds no annotations for A0ABN5URH5. Two independent topology predictors agree on
      two alpha-helical transmembrane segments at the C-terminus and no signal peptide:
      Phobius in the UniProt record (348-368 and 380-399) and DeepTMHMM in the dashboard
      evidence (345-365 and 380-397, class TM, inner membrane). In a Gram-negative
      bacterium, alpha-helical TM proteins without a beta-barrel signature reside in the
      cytoplasmic membrane, which GO represents as plasma membrane. This is a sequence-model
      inference; no fractionation or localization experiment exists for any DUF3422 protein.
