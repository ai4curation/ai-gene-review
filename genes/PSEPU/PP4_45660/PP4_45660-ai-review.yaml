description: >-
  PP4_45660 is a 405-residue protein of the uncharacterized DUF3422 family (Pfam PF11902,
  InterPro IPR021830; COG4949 "Uncharacterized membrane-anchored protein"), with the DUF3422
  region spanning almost the whole sequence. Two predicted alpha-helical transmembrane
  segments lie at the extreme C-terminus (about residues 345-399), with no signal peptide,
  so the protein is predicted to be anchored in the cytoplasmic (inner) membrane by a
  C-terminal helical hairpin, with a large N-terminal domain of about 345 residues on the
  cytoplasmic side. No molecular function, substrate or pathway has been established for
  any member of the family; no member has been characterized biochemically, structurally or
  genetically beyond genome-wide screens. The gene is part of the accessory genome of the
  P. putida group and has no homolog in strain KT2440. Close orthologs (72-77% identity) are
  present in P. fluorescens FW300 strains, and distant (30-35%) family members in
  alphaproteobacteria have strong transposon-fitness defects on L-proline, L-citrulline,
  L-ornithine or D-xylose as carbon source, without a shared mechanism. The UniProt names
  "Membrane-anchored protein" (ProtNLM) and "Lysin"/"Egg lysin" (submitter names on other
  family members) are not functional assignments; the lysin names have no supporting
  evidence.
