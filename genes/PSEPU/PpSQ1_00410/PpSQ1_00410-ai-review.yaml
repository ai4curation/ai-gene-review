proposed_new_terms:
- proposed_name: 6-deoxy-6-sulfogluconolactonase activity
  proposed_definition: >-
    Catalysis of the reaction: 6-deoxy-6-sulfo-D-glucono-1,5-lactone + H2O =
    6-deoxy-6-sulfo-D-gluconate + H+.
