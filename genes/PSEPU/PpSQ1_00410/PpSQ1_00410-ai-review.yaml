id: P0DOV6
gene_symbol: PpSQ1_00410
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:303
  label: Pseudomonas putida
description: >-
  6-Deoxy-6-sulfogluconolactonase (SGL lactonase, EC 3.1.1.99) of Pseudomonas putida SQ1, a
  six-bladed beta-propeller hydrolase of the SMP-30/regucalcin family. It catalyzes the second step
  of the sulfoglycolytic Entner-Doudoroff (sulfo-ED) pathway, hydrolyzing the ring of
  6-deoxy-6-sulfo-D-glucono-1,5-lactone, the product of sulfoquinovose dehydrogenase, to the
  open-chain 6-deoxy-6-sulfo-D-gluconate (RHEA:47908), which is then dehydrated and cleaved to
  pyruvate and 3-sulfolactaldehyde. Like other members of its family it is predicted to bind one
  divalent metal cation per subunit at the active site. The gene lies in the sulfoquinovose-induced
  sulfo-ED cluster, and the protein is strongly up-regulated during growth on sulfoquinovose.
existing_annotations:
- term:
    id: GO:0004341
    label: gluconolactonase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN001656416
  review:
    summary: >-
      TreeGrafter transfer of the regucalcin-family gluconolactonase activity. The protein is a
      lactonase, but its demonstrated substrate is the sulfonated analog
      6-deoxy-6-sulfo-D-glucono-1,5-lactone, not D-glucono-1,5-lactone.
    action: MODIFY
    reason: >-
      GO:0004341 is defined as "Catalysis of the reaction: D-glucono-1,5-lactone + H2O = D-gluconate"
      (OLS). No accessible data test P0DOV6 on D-glucono-1,5-lactone, while its own reaction
      (RHEA:47908, EC 3.1.1.99) has no GO term. The essence (a glucono-1,5-lactone-type lactone
      hydrolase) is sound, so the row is corrected to the parent carboxylic ester hydrolase activity,
      GO:0052689, which the module also uses; the exact activity is requested in proposed_new_terms.
      The graft point PTN001656416 (Salmonella STM2668 leaf) has no annotated ancestor in the current
      PTHR10907 PAINT slice, whose gluconolactonase node PTN004208435 covers a eukaryotic regucalcin
      clade only, so this TreeGrafter row reflects an older PAINT state.
    proposed_replacement_terms:
    - id: GO:0052689
      label: carboxylic ester hydrolase activity
    supported_by:
    - reference_id: file:PSEPU/PpSQ1_00410/PpSQ1_00410-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: Catalyzes the hydrolysis of 6-deoxy-6-sulfo-D-glucono-1,5-lactone to form 6-deoxy-6-sulfo-D-gluconate.
    - reference_id: file:PSEPU/PpSQ1_00410/PpSQ1_00410-uniprot.txt
      record_section: ["CC:SIMILARITY"]
      supporting_text: Belongs to the SMP-30/CGR1 family.
- term:
    id: GO:0005509
    label: calcium ion binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN001656416
  review:
    summary: >-
      Family-level transfer of the calcium binding of mammalian regucalcin. A divalent metal at the
      active site is expected for this lactonase family, but which cation P0DOV6 binds has not been
      measured.
    action: MODIFY
    reason: >-
      UniProt curates only "a divalent metal cation", and only by similarity to human regucalcin
      (Q15493), whose active-site metal is not restricted to Ca2+. The specific calcium claim is
      therefore not supported for this bacterial sulfo-lactonase; the generic metal ion binding term
      carries what is supported. It is a cofactor feature of the core hydrolase activity, not a
      separate core function.
    proposed_replacement_terms:
    - id: GO:0046872
      label: metal ion binding
    supported_by:
    - reference_id: file:PSEPU/PpSQ1_00410/PpSQ1_00410-uniprot.txt
      record_section: ["CC:COFACTOR"]
      supporting_text: Binds 1 divalent metal cation per subunit.
- term:
    id: GO:0019853
    label: L-ascorbic acid biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN001656416
  review:
    summary: >-
      Over-propagation of the animal regucalcin role (L-gulono-1,4-lactone formation in vitamin C
      synthesis) to a bacterial sulfoquinovose-pathway lactonase.
    action: REMOVE
    reason: >-
      The only demonstrated role of P0DOV6 is hydrolysis of sulfogluconolactone in sulfoquinovose
      catabolism; its gene is in the SQ-induced sulfo-ED cluster and the protein is induced by SQ.
      Nothing links it to ascorbate synthesis, and the current PAINT slice for PTHR10907 asserts no
      ascorbate-biosynthesis IBD on any node, so the row survives only through an outdated
      TreeGrafter graft. This is a lineage-inappropriate electronic transfer.
    supported_by:
    - reference_id: file:PSEPU/PpSQ1_00410/PpSQ1_00410-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: Is involved in a degradation pathway of sulfoquinovose (SQ) that allows P.putida
        SQ1 to use SQ as the sole carbon and energy source for growth.
    - reference_id: file:PSEPU/PpSQ1_00410/PpSQ1_00410-uniprot.txt
      record_section: ["CC:INDUCTION"]
      supporting_text: Is highly up-regulated during growth on sulfoquinovose, compared to growth on glucose
        or succinate (at protein level).
- term:
    id: GO:0061722
    label: sulphoglycolysis
  evidence_type: IDA
  original_reference_id: PMID:26195800
  qualifier: involved_in
  review:
    summary: >-
      The lactonase catalyzes the second step of the sulfo-ED route of sulfoquinovose breakdown to
      pyruvate, reconstituted in vitro from the purified P. putida SQ1 enzymes.
    action: NEW
    reason: >-
      GO:0061722 covers SQ breakdown to DHAP and pyruvate; the sulfo-ED route yields pyruvate, and
      this enzyme does the work of one step (lactone ring opening of the SQ dehydrogenase product),
      so it participates rather than merely being required.
    supported_by:
    - reference_id: PMID:26195800
      supporting_text: It involves an NAD(+)-dependent SQ dehydrogenase, 6-deoxy-6-sulfogluconolactone
        (SGL) lactonase, 6-deoxy-6-sulfogluconate (SG) dehydratase, and 2-keto-3,6-dideoxy-6-sulfogluconate
        (KDSG) aldolase.
    - reference_id: PMID:41676062
      supporting_text: SGL is then hydrolyzed and ring-opened by an SGL lactonase (SGL-L), yielding 6-deoxy-6-sulfogluconate
        (SG).
