suggested_questions:
- question: >-
    Is the sulfo-ED lactonase required in vivo, given that sugar 1,5-lactones also open
    spontaneously, and does it hydrolyze D-glucono-1,5-lactone at a comparable rate?
suggested_experiments:
- description: >-
    Determine kinetic constants of purified PpSQ1_00410 on 6-deoxy-6-sulfo-D-glucono-1,5-lactone
    versus D-glucono-1,5-lactone, and identify the bound metal by ICP-MS, to settle substrate
    specificity and the cofactor.
