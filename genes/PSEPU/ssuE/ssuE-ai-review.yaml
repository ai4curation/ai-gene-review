taxon:
  id: NCBITaxon:303
  label: Pseudomonas putida
description: SsuE is an NADPH-dependent flavin reductase associated with the alkanesulfonate monooxygenase
  system of Pseudomonas putida S-313. Heterologous expression of the S-313 gene produced NADPH-dependent
  FMN reduction, lower FAD reduction and no detectable NADH-supported activity under the tested conditions.
  SsuE can supply reduced flavin for oxygenase chemistry, but native complementation experiments found
  it dispensable for tested aliphatic-sulfonate and methionine growth while required for aromatic-sulfonate
  growth. The alternative reduced-flavin source supporting the former conditions was not identified.
