suggested_experiments:
- description: >-
    Measure kinetics of purified PpSQ1_00400 under anaerobic reconstitution, determine its Fe-S
    cluster type spectroscopically, and test 6-phosphogluconate, D-gluconate and pentonates as
    alternative substrates to define how sulfonate selectivity differs from Edd and AraC.
