  label: Pseudomonas putida
description: >-
  6-Deoxy-6-sulfo-D-gluconate dehydratase (SG dehydratase, EC 4.2.1.162) of Pseudomonas putida SQ1,
  a member of the IlvD/Edd family of iron-sulfur sugar-acid dehydratases. It catalyzes the third step
  of the sulfoglycolytic Entner-Doudoroff (sulfo-ED) pathway, dehydrating 6-deoxy-6-sulfo-D-gluconate
  to 2-dehydro-3,6-dideoxy-6-sulfo-D-gluconate (KDSG; RHEA:47912), the substrate of KDSG aldolase,
  in a reaction analogous to that of the 6-phosphogluconate dehydratase of the classical
  Entner-Doudoroff pathway. By similarity to related pentonate dehydratases it is expected to be a
  homodimer carrying a [4Fe-4S] cluster. It is encoded in the sulfoquinovose-induced sulfo-ED gene
  cluster and is strongly up-regulated during growth on sulfoquinovose.
