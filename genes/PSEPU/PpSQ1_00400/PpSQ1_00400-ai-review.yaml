proposed_new_terms:
- proposed_name: 6-deoxy-6-sulfo-D-gluconate dehydratase activity
  proposed_definition: >-
    Catalysis of the reaction: 6-deoxy-6-sulfo-D-gluconate = 2-dehydro-3,6-dideoxy-6-sulfo-D-gluconate
    + H2O.
