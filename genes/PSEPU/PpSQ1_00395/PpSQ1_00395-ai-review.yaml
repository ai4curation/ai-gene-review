- term:
    id: GO:1902777
    label: 6-sulfoquinovose(1-) catabolic process
  evidence_type: IDA
  original_reference_id: PMID:26195800
  qualifier: involved_in
  review:
    summary: >-
      SLA dehydrogenase oxidizes the sulfoquinovose-derived C3 sulfonate SLA to the excreted end
      product sulfolactate, completing the sulfo-ED route reconstituted in vitro with the purified
      P. putida SQ1 enzymes.
    action: NEW
    reason: >-
      The enzyme performs the final step of sulfoquinovose breakdown in this organism, so it does work
      of the process. The broader parent GO:1902777 is used rather than GO:0061722 sulphoglycolysis,
      whose definition ends at DHAP and pyruvate formation, a point upstream of SLA oxidation; this
      matches the module's process term for this annoton.
    supported_by:
    - reference_id: PMID:26195800
      supporting_text: which is oxidized to SL by an NAD(P)(+)-dependent SLA dehydrogenase.
    - reference_id: PMID:26195800
      supporting_text: by in vitro reconstitution of the complete pathway by five heterologously produced
        enzymes
