- term:
    id: GO:0009013
    label: succinate-semialdehyde dehydrogenase [NAD(P)+] activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR010102
  review:
    summary: >-
      InterPro2GO mapping of the SSADH signature (IPR010102). Same claim as the TreeGrafter SSADH row:
      real in vitro activity on a surrogate substrate, not the biological role.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      SLA dehydrogenases are close GabD relatives and match the SSADH family signature, so the domain
      mapping cannot separate them from true SSADHs. P0DOV9 oxidizes succinate semialdehyde in vitro
      with NAD+ or NADP+, but its demonstrated role is SLA oxidation in sulfoquinovose catabolism;
      treated consistently with the GO:0004777 row.
    supported_by:
    - reference_id: file:PSEPU/PpSQ1_00395/PpSQ1_00395-uniprot.txt
      record_section: ["CC:BIOPHYSICOCHEMICAL PROPERTIES"]
      supporting_text: KM=0.14 mM for 4-oxobutanoate with NADP(+) as cosubstrate
    - reference_id: PMID:37886098
      supporting_text: SLA dehydrogenases (annotated as GabD or SlaB) belong to the sequence-based protein
        family PF00171 within the Pfam database, which are members of the aldehyde dehydrogenase superfamily.
- term:
    id: GO:0009450
    label: GABA catabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR010102
  - PANTHER:PTN000192659
  review:
    summary: >-
      Process inferred from the SSADH signature and PANTHER clade. No evidence links P0DOV9 to GABA
      breakdown; its demonstrated process is sulfoquinovose catabolism.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Participation in GABA catabolism would require the enzyme to oxidize GABA-derived succinate
      semialdehyde in vivo. Only in vitro SSA turnover with a surrogate substrate is known; the gene is
      in the sulfo-ED cluster and is induced by sulfoquinovose, not by GABA. The in vitro SSA activity
      keeps this from being a demonstrably false row, so it is marked as over-annotated rather than
      removed.
    supported_by:
    - reference_id: file:PSEPU/PpSQ1_00395/PpSQ1_00395-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: Is involved in a degradation pathway of sulfoquinovose (SQ) that allows P.putida
        SQ1 to use SQ as the sole carbon and energy source for growth.
