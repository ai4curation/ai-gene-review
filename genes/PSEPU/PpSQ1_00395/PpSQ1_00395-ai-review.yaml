id: P0DOV9
gene_symbol: PpSQ1_00395
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:303
  label: Pseudomonas putida
description: >-
  3-Sulfolactaldehyde (SLA) dehydrogenase (EC 1.2.1.97) of Pseudomonas putida SQ1, a member of the
  aldehyde dehydrogenase superfamily closely related to bacterial succinate-semialdehyde
  dehydrogenases (GabD). It catalyzes the terminal step of the sulfoglycolytic Entner-Doudoroff
  (sulfo-ED) pathway, oxidizing (2S)-3-sulfolactaldehyde, released by KDSG aldolase, to
  (2S)-3-sulfolactate with either NAD+ or NADP+ as acceptor (RHEA:47932, RHEA:47928); the
  sulfolactate is excreted. The purified enzyme also oxidizes succinate semialdehyde efficiently,
  which served as a surrogate substrate for kinetic measurements. It uses the conserved ALDH
  catalytic cysteine nucleophile and glutamate general base, is encoded in the
  sulfoquinovose-induced sulfo-ED gene cluster, and is strongly up-regulated during growth on
  sulfoquinovose.
