- term:
    id: GO:0004777
    label: succinate-semialdehyde dehydrogenase (NAD+) activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN000192659
  review:
    summary: >-
      TreeGrafter transfer of the SSADH activity of the GabD/ALDH5A1 clade. The enzyme does oxidize
      succinate semialdehyde in vitro, but only as a surrogate assay substrate; its demonstrated
      biological substrate is 3-sulfolactaldehyde.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      UniProt's kinetic constants for P0DOV9 are for 4-oxobutanoate (succinate semialdehyde), with
      kcat about 11.8 s-1 for either cofactor, because pure SLA was not available when the enzyme was
      characterized. This is real in vitro activity, so the row is not removed, but nothing places the
      protein in succinate-semialdehyde metabolism in SQ1: its gene is in the sulfo-ED cluster and it
      is induced by SQ. The inherited IBD sits on PANTHER node PTN008681047, a deep node (162 leaves in
      seven subfamilies) that also covers non-SSADH aldehyde dehydrogenases such as E. coli AldA and
      P. aeruginosa DavD within the very graft clade PTN000192659 that P0DOV9 joins, so the
      substrate-specific term is broader than the node's descendants support. The accepted parent
      GO:0004029 carries the activity without naming the wrong physiological substrate.
    supported_by:
    - reference_id: file:PSEPU/PpSQ1_00395/PpSQ1_00395-uniprot.txt
      record_section: ["CC:BIOPHYSICOCHEMICAL PROPERTIES"]
      supporting_text: KM=0.14 mM for 4-oxobutanoate with NAD(+) as cosubstrate
    - reference_id: PMID:37886098
      supporting_text: In all cases accurate kinetic parameters have not been reported for any SLA dehydrogenase
        as SLA was not available in pure form.
    - reference_id: file:PSEPU/PpSQ1_00395/PpSQ1_00395-uniprot.txt
      record_section: ["CC:INDUCTION"]
      supporting_text: Is highly up-regulated during growth on sulfoquinovose, compared to growth on glucose
        or succinate (at protein level).
- term:
