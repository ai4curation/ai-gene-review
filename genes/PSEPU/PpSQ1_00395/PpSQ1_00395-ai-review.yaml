proposed_new_terms:
- proposed_name: 3-sulfolactaldehyde dehydrogenase [NAD(P)+] activity
  proposed_definition: >-
    Catalysis of the reaction: (2S)-3-sulfolactaldehyde + NAD(P)+ + H2O = (2S)-3-sulfolactate +
    NAD(P)H + 2 H+.
  justification: >-
    EC 1.2.1.97 and RHEA:47932/RHEA:47928 describe SLA oxidation, which recurs in the sulfo-ED,
    sulfo-EMP and sulfo-SFT routes, but GO has no term; the enzymes are therefore annotated either to
    generic aldehyde dehydrogenase terms or, by family transfer, to succinate-semialdehyde
    dehydrogenase, which names a different physiological substrate.
  proposed_parent:
    id: GO:0004030
    label: aldehyde dehydrogenase [NAD(P)+] activity
  proposed_mappings:
  - predicate: skos:exactMatch
    target_term:
      id: RHEA:47932
      label: (2S)-3-sulfolactaldehyde + NAD(+) + H2O = (2S)-3-sulfolactate + NADH + 2 H(+)
  supported_by:
  - reference_id: file:PSEPU/PpSQ1_00395/PpSQ1_00395-uniprot.txt
    record_section: ["CC:FUNCTION"]
    supporting_text: Catalyzes the oxidation of (2S)-3-sulfolactaldehyde to (2S)-3-sulfolactate, using
      both NAD(+) and NADP(+) as electron acceptors.
suggested_questions:
- question: >-
    Does P0DOV9 contribute to succinate-semialdehyde (GABA-shunt) metabolism in P. putida SQ1 when SQ
    is absent, or is its in vitro SSA activity physiologically irrelevant beside dedicated GabD
    paralogs?
suggested_experiments:
- description: >-
    Measure kinetics of purified P0DOV9 with chemically synthesized (2S)-SLA versus succinate
    semialdehyde, and test growth of a PpSQ1_00395 deletion strain on GABA and on SQ, to separate its
    sulfolactaldehyde and succinate-semialdehyde roles.
