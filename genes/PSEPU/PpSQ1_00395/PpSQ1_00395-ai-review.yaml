    label: cytosol
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: located_in
  supporting_entities:
  - PANTHER:PTN000192659
  review:
    summary: >-
      Plausible location of a soluble ALDH-family catabolic enzyme acting on an intracellular pathway
      intermediate.
    action: KEEP_AS_NON_CORE
    reason: >-
      The row follows the PAINT IBD on PTN000192659, seeded by E. coli AldA, a cytosolic aldehyde
      dehydrogenase of the same small proteobacterial clade into which P0DOV9 is grafted. No
      localization experiment exists for P0DOV9, but its substrate SLA is produced inside the cell by
      KDSG aldolase and the protein has no signal peptide or membrane segment in its record. Peripheral
      to the core activity.
    supported_by:
