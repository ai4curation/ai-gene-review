id: P0DOV8
gene_symbol: PpSQ1_00455
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:303
  label: Pseudomonas putida
description: >-
  2-Dehydro-3,6-dideoxy-6-sulfogluconate (KDSG) aldolase (EC 4.1.2.58) of Pseudomonas putida SQ1, a
  metal-dependent class II aldolase of the HpcH/HpaI family with a (beta/alpha)8 TIM-barrel fold. It
  catalyzes the C-C bond cleaving step of the sulfoglycolytic Entner-Doudoroff (sulfo-ED) pathway:
  retro-aldol cleavage of KDSG to pyruvate, which the bacterium uses for growth, and
  (2S)-3-sulfolactaldehyde, which is oxidized to 3-sulfolactate and excreted (RHEA:47924). Enzymes
  of this type form homohexamers with a divalent metal (optimally Co2+ or Mn2+) at a subunit-interface
  active site. The gene belongs to the sulfoquinovose-induced sulfo-ED cluster and the protein is
  strongly up-regulated during growth on sulfoquinovose.
existing_annotations:
- term:
    id: GO:0003824
    label: catalytic activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR005000
  review:
    summary: >-
      InterPro2GO mapping of the HpcH/HpaI aldolase domain to the root catalytic activity term. True
      but uninformative.
    action: MODIFY
    reason: >-
      The demonstrated activity is retro-aldol C-C cleavage of KDSG into pyruvate and an aldehyde, so
      the row is refined to aldehyde-lyase activity (GO:0016832), which the gene already carries and
      which is the most specific GO term available for EC 4.1.2.58.
    proposed_replacement_terms:
    - id: GO:0016832
      label: aldehyde-lyase activity
    supported_by:
    - reference_id: file:PSEPU/PpSQ1_00455/PpSQ1_00455-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: Catalyzes the retro-aldol cleavage of 2-dehydro-3,6-dideoxy-6-sulfo-D-gluconate
        to (2S)-3-sulfolactaldehyde and pyruvate.
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: located_in
  supporting_entities:
  - PANTHER:PTN007825897
  review:
    summary: >-
      Plausible location of a soluble catabolic enzyme that acts on intracellular sulfosugar
      intermediates and feeds pyruvate to central metabolism.
    action: KEEP_AS_NON_CORE
    reason: >-
      No localization experiment exists for P0DOV8, and the current PTHR30502 PAINT slice asserts no
      cellular-component IBD (only the root aldehyde-lyase node), so this TreeGrafter row reflects an
      older PAINT state. The claim is nonetheless consistent with the biology: the protein has no
      signal peptide or transmembrane segment in its record, its substrate is made by cytoplasmic
      pathway enzymes after SQ import, and its pyruvate product supports growth. Kept as a
      peripheral location rather than core function.
    supported_by:
    - reference_id: PMID:26195800
      supporting_text: The aldolase reaction yields pyruvate, which supports growth of P. putida, and 3-sulfolactaldehyde
        (SLA)
- term:
    id: GO:0016832
    label: aldehyde-lyase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN007825897
  review:
    summary: >-
      Correct: the enzyme cleaves KDSG into pyruvate and 3-sulfolactaldehyde. GO has no term for the
      exact reaction (EC 4.1.2.58, RHEA:47924), so this parent is as precise as GO allows.
    action: ACCEPT
    reason: >-
      The current PTHR30502 PAINT slice places GO:0016832 at the family root (PTN000766732, seeded by
      E. coli GarL and RhmA), which covers every HpcH/HpaI member, and the curated experimental
      function of P0DOV8 confirms it. The specific KDSG aldolase term is requested in
      proposed_new_terms.
    supported_by:
    - reference_id: file:PSEPU/PpSQ1_00455/PpSQ1_00455-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: Catalyzes the retro-aldol cleavage of 2-dehydro-3,6-dideoxy-6-sulfo-D-gluconate
        to (2S)-3-sulfolactaldehyde and pyruvate.
    - reference_id: file:interpro/panther/PTHR30502/PTHR30502-paint.tsv
      supporting_text: "PTHR30502\tPTN000766732\tGO:0016832\tF\tIBD\tfalse\tUniProtKB:P23522|UniProtKB:P76469"
- term:
    id: GO:0061722
    label: sulphoglycolysis
  evidence_type: IDA
  original_reference_id: PMID:26195800
  qualifier: involved_in
  review:
    summary: >-
      KDSG aldolase catalyzes the namesake C-C cleavage step of the sulfo-ED route, releasing
      pyruvate; the route was reconstituted in vitro from the purified P. putida SQ1 enzymes.
    action: NEW
    reason: >-
      GO:0061722 covers SQ breakdown resulting in DHAP and pyruvate; this enzyme performs the step
      that forms the pyruvate, so it does the work of the process.
    supported_by:
    - reference_id: PMID:26195800
      supporting_text: The aldolase reaction yields pyruvate, which supports growth of P. putida, and 3-sulfolactaldehyde
        (SLA)
    - reference_id: PMID:26195800
      supporting_text: by in vitro reconstitution of the complete pathway by five heterologously produced
        enzymes
