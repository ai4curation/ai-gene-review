proposed_new_terms:
- proposed_name: 2-dehydro-3,6-dideoxy-6-sulfogluconate aldolase activity
  proposed_definition: >-
    Catalysis of the reaction: 2-dehydro-3,6-dideoxy-6-sulfo-D-gluconate = (2S)-3-sulfolactaldehyde
    + pyruvate.
  justification: >-
    EC 4.1.2.58 and RHEA:47924 describe the sulfo-ED aldolase reaction, but GO has no term and no
    mapping for it. The related KDPG aldolase term (GO:0008675) names the phosphorylated glycolytic
    substrate, which this enzyme converts only modestly.
