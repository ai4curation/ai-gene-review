id: Q59695
gene_symbol: acoC
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:303
  label: Pseudomonas putida
description: AcoC is the lipoyl-bearing E2 acetyltransferase assigned to the acetoin-cleaving system of
  Pseudomonas putida PpG2. The E2 role is inferred from its conserved lipoyl-bearing architecture and
  position in the acetoin-cleaving locus. In the proposed E2 role it accepts the E1-derived acetyl group
  on its lipoyl carrier and transfers it to coenzyme A. Its alpha/beta-hydrolase catalytic-domain architecture
  differs from classical E2 acetyltransferase folds; a native E3 partner and specific catalytic-residue
  mechanism remain unresolved.
