- term:
    id: GO:0016020
    label: membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: located_in
  supporting_entities:
  - PANTHER:PTN008685320
  review:
    summary: Membrane location propagated from alpha/beta-hydrolase relatives to a soluble E2 component;
      likely over-annotation.
    action: MARK_AS_OVER_ANNOTATED
    reason: The membrane term reaches AcoC by TreeGrafter from PANTHER:PTN008685320, inside
      PTHR43798, where membrane was asserted at the deep PTN000177089 node from membrane-associated
      alpha/beta hydrolases (monoacylglycerol lipase-type seeds). AcoC belongs to that family only
      through its C-terminal alpha/beta-hydrolase-fold domain. Its role is the E2 component of the
      acetoin cleaving system, an N-terminal lipoyl domain plus that catalytic domain, and the curated
      record has no transmembrane segment or signal peptide. Nothing native places it at a membrane.
      Peripheral association is not excluded experimentally, so the row is marked over-annotated
      rather than removed.
