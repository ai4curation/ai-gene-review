suggested_questions:
- question: What catalytic residues mediate the alpha/beta-hydrolase-type E2 acetyl transfer, and which
    native E3 recycles its lipoyl group?
- question: Does native PpG2 AcoC associate with a membrane, as the TreeGrafter location inference suggests?
suggested_experiments:
- description: Measure acetyl transfer with purified lipoylated AcoC and defined substrates, then reconstitute
    E1/E2/E3 coupling; test native-cell fractionation independently of sequence-family labels.
  experiment_type: enzyme reconstitution and fractionation
