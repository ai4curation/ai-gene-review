  label: Priestia aryabhattai
description: >-
  SftD (locus Ga0111075_10031325 in strain SOS1) is the NAD+-dependent 3-sulfolactaldehyde (SLA)
  dehydrogenase of the 6-deoxy-6-sulfofructose transaldolase (sulfo-SFT or sulfo-TAL) pathway of
  Bacillus (Priestia) aryabhattai. It is encoded in an SQ-inducible gene cluster with the
  sulfoquinovose isomerase SftI and the sulfofructose transaldolase SftT, and oxidizes the
  3-sulfolactaldehyde formed by SftT to 3-sulfolactate (RHEA:47932, EC 1.2.1.97), which the
  aerobic bacterium excretes stoichiometrically during growth on sulfoquinovose. Recombinant
  SftD also oxidizes glyceraldehyde 3-phosphate and erythrose 4-phosphate in vitro. It is a
  soluble aldehyde dehydrogenase superfamily enzyme (Pfam PF00171; PANTHER PTHR42991 subfamily SF1),
  orthologous to B. megaterium SlaB.
