  review:
    summary: Purified recombinant SftD oxidizes 13C3-SLA to 13C3-sulfolactate with NAD+.
    action: NEW
    reason: >-
      In the in vitro reconstitution of the pathway, purified His-tagged SftD converted the SLA
      formed by SftT to SL in an NAD+-dependent reaction. SLA is an aldehyde and SL its
      carboxylate, so the reaction (RHEA:47932) falls under the GO:0004029 definition ("an
      aldehyde + H2O + NAD+ = a carboxylate + 2 H+ + NADH"). GO has no SLA-specific term (OLS
      2026-11-10), so this is the most specific usable term; a specific term is proposed. GOA
      currently lacks any experimental MF row for SftD, while its ortholog SlaB carries this term
      from Rhea mapping.
    supported_by:
    - reference_id: PMID:32919372
      supporting_text: Finally, after addition of protein 1325 (SftD) and NAD+ to the reaction mixture,
        the 13C3-SLA was converted to 13C3-SL (Figure 4), as compared with authentic SL standard (Figure
        S7).
    - reference_id: PMID:32919372
      supporting_text: Thus, protein SftD is another NAD+-dependent SLA dehydrogenase
- term:
    id: GO:1902777
    label: 6-sulfoquinovose(1-) catabolic process
  evidence_type: IDA
  original_reference_id: PMID:32919372
  qualifier: involved_in
  review:
    summary: SftD catalyzes the terminal SLA oxidation step of SQ breakdown in B. aryabhattai.
    action: NEW
    reason: >-
      SftD performs a step of SQ catabolism itself: it is one of three SQ-induced enzymes whose
      sequential addition reconstitutes SQ breakdown to SL in vitro. Comparator check: the
      analogous terminal SLA reductase YihU of E. coli carries GO:1902777, as do the other E. coli
      sulfoglycolysis enzymes. GO:0061722 sulphoglycolysis is not used because its definition
      requires DHAP and pyruvate as products, whereas this route yields fructose 6-phosphate.
    supported_by:
    - reference_id: PMID:32919372
      supporting_text: The SLA is oxidized to SL (Figures 3 and S3) by the co-encoded, co-induced
        NAD+-dependent dehydrogenase 1325 (Figure 2).
    - reference_id: PMID:32919372
      supporting_text: The candidate genes 1320 (sftT), 1323 (sftI), and 1325 (sftD) were cloned into
        plasmids, heterologously overexpressed in E. coli, and the proteins purified via His6-Tag affinity
        chromatography (Figure S4).
