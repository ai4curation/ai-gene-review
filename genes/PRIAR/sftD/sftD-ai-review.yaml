proposed_new_terms:
- proposed_name: 3-sulfolactaldehyde dehydrogenase (NAD+) activity
  proposed_definition: 'Catalysis of the reaction: (2S)-3-sulfolactaldehyde + NAD+ + H2O = (2S)-3-sulfolactate
    + NADH + 2 H+.'
  justification: >-
    EC 1.2.1.97 and RHEA:47932 describe this reaction, catalyzed by the SLA dehydrogenases of the
    sulfo-ED and sulfo-SFT sulfoquinovose degradation routes, but GO has no term for it (OLS search
    for "sulfolactaldehyde dehydrogenase" and "1.2.1.97" on 2026-11-10 returned no GO class).
  proposed_parent:
    id: GO:0004029
    label: aldehyde dehydrogenase (NAD+) activity
  supported_by:
  - reference_id: PMID:32919372
    supporting_text: Thus, protein SftD is another NAD+-dependent SLA dehydrogenase
suggested_questions:
- question: >-
    Does the GAP-oxidizing side activity of SftD matter in vivo, given that GAP is the acceptor
    substrate of the sulfofructose transaldolase SftT in the same pathway?
suggested_experiments:
- description: >-
    Determine kcat and Km of purified SftD for enzymatically prepared (2S)-SLA versus GAP and E4P
    (for example using SLA generated by SftT or by YihU from DHPS and quantified independently), to
    test whether SLA is the preferred substrate.
