  review:
    summary: Fold-based mapping; SftI acts in sulfoquinovose, not fucose, metabolism.
    action: REMOVE
    reason: >-
      IPR015888 marks the shared L-fucose isomerase fold, not fucose metabolism. SftI is expressed
      specifically during growth on SQ, in an SQ catabolic cluster, and its demonstrated substrates
      are SQ and fructose 6-phosphate; nothing links it to fucose utilization. NCBIfam NF048012 and
      PTHR36120 classify it as an SQ isomerase. This is an over-propagated domain-to-process mapping.
    supported_by:
