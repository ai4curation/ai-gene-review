        as 13C6-SQ but a slightly earlier HPLC retention time (Denger et al., 2014) was detected (Figure
        4), identified as 13C6-SF by its MS/MS fragmentation pattern (Denger et al., 2014) including
        corresponding 13C mass shifts (see Figure S5). Thus, protein SftI is an SQ isomerase.
