    summary: Purified SftI converts 13C6-SQ to 13C6-SF.
    action: ACCEPT
    reason: >-
      Recombinant SftI added to 13C6-SQ produced a product with the mass of SQ, a shifted HPLC
      retention time and the MS/MS fragmentation of SF, directly demonstrating SQ isomerase
      activity (RHEA:40439).
    supported_by:
    - reference_id: PMID:32919372
