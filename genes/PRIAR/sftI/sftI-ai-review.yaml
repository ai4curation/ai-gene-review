suggested_questions:
- question: >-
    Is the fructose 6-phosphate to glucose 6-phosphate isomerase side activity of SftI
    physiologically relevant, for example in routing the F6P produced by SftT, or is it an in vitro
    promiscuity of the sugar-phosphate-binding site?
suggested_experiments:
- description: >-
    Compare kcat/Km of SftI for SQ, F6P/G6P and L-fucose, and test a sftI deletion for growth on SQ
    versus glucose, to separate the SQ isomerase function from side activities.
