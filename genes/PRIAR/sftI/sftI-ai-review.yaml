  label: Priestia aryabhattai
description: >-
  SftI (locus Ga0111075_10031323 in strain SOS1) is the sulfoquinovose (SQ) isomerase of the
  6-deoxy-6-sulfofructose transaldolase (sulfo-SFT or sulfo-TAL) pathway of Bacillus (Priestia)
  aryabhattai. It is strongly induced during growth on SQ and isomerizes SQ to
  6-deoxy-6-sulfo-D-fructose (RHEA:40439, EC 5.3.1.31), the donor substrate of the co-encoded
  sulfofructose transaldolase SftT; in vitro it also interconverts fructose 6-phosphate and
  glucose 6-phosphate. SftI is a soluble enzyme with the L-fucose isomerase-like fold (PANTHER
  PTHR36120), orthologous to B. megaterium SqvD and unrelated in sequence to the E. coli
  sulfo-EMP isomerase YihS.
