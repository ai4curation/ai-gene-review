  review:
    summary: SftI catalyzes the first step of SQ breakdown in B. aryabhattai.
    action: NEW
    reason: >-
      SftI performs a step of SQ catabolism itself: it is one of the three SQ-induced enzymes whose
      sequential addition reconstitutes SQ degradation in vitro. Comparator check: the E. coli
      sulfo-EMP isomerase YihS carries GO:1902777. GO:0061722 sulphoglycolysis is not used because
      its definition requires DHAP and pyruvate as products, whereas this route yields fructose
      6-phosphate.
    supported_by:
    - reference_id: PMID:32919372
      supporting_text: we concluded that the SQ catabolic pathway in strain SOS1 involves only three
        inducible enzymes
