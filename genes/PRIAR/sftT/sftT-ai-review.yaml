  review:
    summary: Purified SftT transfers the dihydroxyacetone unit of 13C6-SF to GAP or E4P.
    action: NEW
    reason: >-
      Recombinant SftT formed 13C3-SLA and [1,2,3-13C3]-F6P from 13C-SF with unlabeled GAP, showing
      transfer of the SQ-derived dihydroxyacetone moiety onto the acceptor; E4P also served, giving
      S7P. GO:0016744 is the most specific existing term for this EC 2.2.1.14 reaction (GO:0004801
      is defined by the sedoheptulose 7-phosphate donor reaction). A specific child term is proposed.
    supported_by:
    - reference_id: PMID:32919372
      supporting_text: Furthermore, [1,2,3-13C3]-F6P formation was observed (Figure 4), confirming that
        the non-sulfonated 13C3-dihydroxyacetone moiety of SQ is transferred onto the unlabeled GAP as acceptor.
    - reference_id: PMID:32919372
      supporting_text: Thus, protein SftT is an SF-cleaving, SLA-forming, GAP/E4P-dependent transaldolase;
