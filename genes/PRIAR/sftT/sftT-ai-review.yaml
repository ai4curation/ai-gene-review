  review:
    summary: SftT is an acceptor-dependent transaldolase, not an aldehyde-lyase.
    action: MODIFY
    reason: >-
      IPR033919 (TSA/FSA archaeal/bacterial) groups acceptor-independent fructose-6-phosphate
      aldolases with transaldolases. For SftT, gel-filtered extract and SQ produced only SF, and SLA
      formed only after GAP or E4P was added, so the enzyme transfers the glycerone unit to an
      acceptor (EC 2.2.1.14) rather than acting as a lyase. The row is corrected laterally to
      GO:0016744 transketolase or transaldolase activity; GO has no term for EC 2.2.1.14 and a
      specific term is proposed.
    supported_by:
    - reference_id: PMID:32919372
      supporting_text: Gel-filtered cell extract and SQ alone produced only SF, but a conversion of the
        SQ via SF further to SLA was detectable after addition of GAP or E4P to the assay, i.e., as acceptor
        molecules for a transaldolase reaction.
    - reference_id: PMID:32919372
      supporting_text: Thus, protein SftT is an SF-cleaving, SLA-forming, GAP/E4P-dependent transaldolase;
