core_functions:
- description: >-
    6-deoxy-6-sulfo-D-fructose transaldolase (EC 2.2.1.14): transfer of the dihydroxyacetone unit
    of SF to D-glyceraldehyde 3-phosphate, forming D-fructose 6-phosphate and
    (2S)-3-sulfolactaldehyde (RHEA:66716), or to erythrose 4-phosphate forming sedoheptulose
    7-phosphate (RHEA:66920); the sulfosugar-cleaving step of the sulfo-SFT pathway. GO lacks a
    specific term, so the parent transketolase or transaldolase activity is used and a specific
    term is proposed.
  molecular_function:
    id: GO:0016744
    label: transketolase or transaldolase activity
  directly_involved_in:
  - id: GO:1902777
    label: 6-sulfoquinovose(1-) catabolic process
  supported_by:
  - reference_id: PMID:32919372
    supporting_text: Thus, protein SftT is an SF-cleaving, SLA-forming, GAP/E4P-dependent transaldolase;
proposed_new_terms:
- proposed_name: 6-deoxy-6-sulfo-D-fructose transaldolase activity
  proposed_definition: 'Catalysis of the reaction: 6-deoxy-6-sulfo-D-fructose + D-glyceraldehyde 3-phosphate
    = D-fructose 6-phosphate + (2S)-3-sulfolactaldehyde. D-erythrose 4-phosphate can also act as acceptor,
    forming D-sedoheptulose 7-phosphate.'
  justification: >-
    EC 2.2.1.14 with RHEA:66716 and RHEA:66920 describes the signature reaction of the sulfo-SFT
    pathway, but GO has no corresponding term (OLS searches on 2026-11-10). GO:0004801 transaldolase
    activity is defined by the sedoheptulose 7-phosphate donor and does not cover it.
  proposed_parent:
    id: GO:0016744
    label: transketolase or transaldolase activity
  supported_by:
  - reference_id: PMID:32919372
    supporting_text: Thus, protein SftT is an SF-cleaving, SLA-forming, GAP/E4P-dependent transaldolase;
suggested_questions:
- question: >-
    Is the sedoheptulose-7-phosphate transaldolase side activity of SftT relevant in vivo, for
    example by supplementing the housekeeping pentose phosphate transaldolase during growth on
    sulfoquinovose?
suggested_experiments:
- description: >-
    Measure kcat/Km of purified SftT for SF versus sedoheptulose 7-phosphate and fructose
    6-phosphate as donors, and test growth of a sftT deletion on SQ, to quantify donor preference
    and essentiality.
