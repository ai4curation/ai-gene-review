    summary: SftT catalyzes the sulfosugar-cleaving step of SQ breakdown in B. aryabhattai.
    action: NEW
    reason: >-
      SftT performs the C-C cleavage step of SQ catabolism itself and is one of three SQ-induced
      enzymes that reconstitute the pathway in vitro. Comparator check: E. coli YihT, the sulfo-EMP
      cleavage enzyme, carries GO:1902777. GO:0061722 sulphoglycolysis is not used because its
      definition requires DHAP and pyruvate as products, whereas SftT yields fructose 6-phosphate.
    supported_by:
