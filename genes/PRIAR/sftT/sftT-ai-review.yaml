  label: Priestia aryabhattai
description: >-
  SftT (locus Ga0111075_10031320 in strain SOS1) is the 6-deoxy-6-sulfo-D-fructose transaldolase
  (sulfofructose transaldolase; EC 2.2.1.14) of the sulfo-SFT (sulfo-TAL) sulfoquinovose
  degradation pathway of Bacillus (Priestia) aryabhattai. Strongly induced during growth on
  sulfoquinovose, it transfers the dihydroxyacetone unit of 6-deoxy-6-sulfo-D-fructose (formed by
  the isomerase SftI) to D-glyceraldehyde 3-phosphate or D-erythrose 4-phosphate, releasing
  3-sulfolactaldehyde and forming fructose 6-phosphate or sedoheptulose 7-phosphate; it does not
  cleave SF without an acceptor, and it also shows classical sedoheptulose-7-phosphate
  transaldolase activity in vitro. The sulfolactaldehyde is oxidized to sulfolactate by SftD. SftT
  is a 226-residue class I transaldolase of PANTHER PTHR10683 subfamily SF40, 41.7% identical to
  the Thermoplasma acidophilum fructose-6-phosphate transaldolase and orthologous to B. megaterium
  SqvA.
