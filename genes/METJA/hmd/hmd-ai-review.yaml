  review:
    summary: PAINT IBA of P5C reductase activity from the PTHR11645 root node
      PTN000182176, which reaches Hmd because PANTHER places it in SF0.
    action: REMOVE
    reason: >-
      Over-propagation to a neofunctionalized member (ARCHAEA pattern 1). The node
      placement is sound for the clade it was drawn for: every seed (E. coli and
      P. aeruginosa ProC, M. tuberculosis ProC, yeast PRO3, a Medicago P5CR, human
      PYCR1-3, mouse Pycr) is a characterised NAD(P)H-dependent P5C reductase. Hmd is
      not in that functional clade. It is a methanogen enzyme with a different
      substrate (methenyl-H4MPT+), a different reductant (H2, cleaved at an
      organometallic iron, not NAD(P)H), and a different active site: the iron of the
      FeGP cofactor bound to Cys176 in an intersubunit cleft, with the Rossmann-like
      N-terminal domain holding the GMP of that cofactor. Structures of this very
      protein (apo, holo, C176A, substrate complex) show the Hmd active site and no
      paper reports P5C reductase activity, P5C binding or NAD(P)H use for any Hmd.
      The shared fold (NAD(P)-binding Rossmann and 6PGDH C-terminal-like
      superfamilies) is remote: my pairwise check puts Hmd versus ProC, PRO3, PYCR1
      and PYCR3 at the shuffled-sequence background (SW z 0.6 to 5.6, against 175 for
      the M. thermautotrophicus Hmd), and the P5CR N-terminal [GA]x[GA]xx[GA] motif
      is absent from Hmd, so no P5CR catalytic residue can be mapped onto Hmd by
      alignment and none is claimed to be retained. The ProC function was lost on the
      Hmd branch; PAINT needs an IRD (or NOT) at the Hmd node. The PTHR11645 family
      review already records this as NEEDS_PRUNING with Q58194 as a member exception.
    supported_by:
    - reference_id: PMID:16540118
      supporting_text: The Rossmann fold-like structure of the N-terminal domain
        contains a mononucleotide-binding site, which could harbour the GMP moiety of
        the cofactor.
    - reference_id: PMID:16540118
      supporting_text: Adjacent to the iron of the cofactor modelled as a ligand to
        Cys176, an extended U-shaped extra electron density, interpreted as a
        polyethyleneglycol fragment, suggests a binding site for the substrate
        methenyltetrahydromethanopterin.
    - reference_id: PMID:37671838
      supporting_text: '[Fe]-hydrogenase catalyzes the heterolytic cleavage of H2 and
        reversible hydride transfer to methenyl-tetrahydromethanopterin.'
    - reference_id: file:METJA/hmd/hmd-bioinformatics/RESULTS.md
      supporting_text: Hmd versus every P5C reductase is at or near
        the shuffled-sequence background
