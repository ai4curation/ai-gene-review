id: Q58194
gene_symbol: hmd
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:243232
  label: Methanocaldococcus jannaschii DSM 2661
description: >-
  Hmd is the H2-forming N5,N10-methylenetetrahydromethanopterin dehydrogenase
  ([Fe]-hydrogenase, 5,10-methenyltetrahydromethanopterin hydrogenase, EC 1.12.98.2)
  of the hyperthermophilic hydrogenotrophic methanogen Methanocaldococcus
  jannaschii. It catalyses the reversible reduction of
  5,10-methenyltetrahydromethanopterin (methenyl-H4MPT+) with H2 to
  5,10-methylene-H4MPT and a proton, the fourth step of CO2 reduction to methane,
  a step that the F420-dependent Mtd can also carry out. The enzyme has no
  iron-sulfur clusters or nickel. It is a homodimer: the N-terminal Rossmann
  fold-like domain of each subunit has a mononucleotide-binding site for the GMP
  moiety of the iron-guanylylpyridinol (FeGP) cofactor, and the intertwined
  C-terminal segments form a central unit. The single low-spin iron of the cofactor
  is ligated by Cys176, two carbon monoxide molecules, an acyl carbon and the
  nitrogen of a 2-pyridinol, and sits in a deep intersubunit cleft where
  methenyl-H4MPT+ binds. There H2 is cleaved heterolytically and the hydride is
  transferred directly to the methenyl carbon. The M. jannaschii protein, as
  recombinant apoenzyme reconstituted with the cofactor, is the source of the
  apoenzyme, holoenzyme, Cys176Ala mutant and substrate-complex crystal structures
  of [Fe]-hydrogenase. It is a soluble cytoplasmic enzyme. The organism also has an
  inactive paralog, HmdII, that binds the cofactor and substrate.
