core_functions:
- description: H2-forming methylene-H4MPT dehydrogenase ([Fe]-hydrogenase). Using its
    iron-guanylylpyridinol cofactor bound to Cys176, it cleaves H2 heterolytically and
    transfers the hydride to methenyl-H4MPT+, forming methylene-H4MPT in the fourth
    step of CO2 reduction to methane.
