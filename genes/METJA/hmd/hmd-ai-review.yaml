proposed_new_terms:
- proposed_name: iron-guanylylpyridinol cofactor binding
  proposed_definition: Binding to the iron-guanylylpyridinol (FeGP) cofactor, a
    mononuclear low-spin Fe(II) complex ligated by two carbon monoxide molecules and
    the nitrogen of a 2-pyridinol that is linked through a phosphodiester to
    guanosine, which is the active-site cofactor of [Fe]-hydrogenase (Hmd).
  justification: Every Hmd binds the FeGP cofactor, which is required for activity
    and is the defining feature of the [Fe]-hydrogenase class; for M. jannaschii Hmd
    the cofactor-binding site (Cys176 and the GMP-binding Rossmann-like domain) is
    defined structurally. The inactive paralog HmdII also binds the cofactor, so a
    binding term would also serve proteins that lack the hydrogenase activity. GO has
    GO:0160300 iron-guanylylpyridinol cofactor biosynthetic process but no term for
    binding the cofactor. This is the same proposal as in the M. thermautotrophicus
    hmd review.
  proposed_parent:
    id: GO:0036094
    label: small molecule binding
  supported_by:
  - reference_id: PMID:16540118
    supporting_text: is a novel type of hydrogenase that tightly binds an
      iron-containing cofactor
  - reference_id: PMID:26094576
    supporting_text: Infrared spectroscopic and X-ray structural data clearly indicated
      binding of the FeGP cofactor.
suggested_questions:
- question: PANTHER classifies most Hmd proteins in PTHR11645:SF0, a
    pyrroline-5-carboxylate reductase subfamily, and PAINT root node PTN000182176
    gives M. jannaschii Hmd (Q58194) P5C reductase activity and L-proline biosynthesis
    by IBA. Should PAINT add an IRD at the Hmd branch, or PANTHER split Hmd (and the
    HmdII/HmdIII paralogs) into its own subfamily?
- question: Should GO add an iron-guanylylpyridinol (FeGP) cofactor binding term, so
    that Hmd and its inactive cofactor-binding paralogs can record the cofactor
    without falling back to iron ion binding?
suggested_experiments:
- description: Assay purified holo-Hmd from M. jannaschii with P5C and NAD(P)H, as a
    direct negative control for the inherited P5C reductase annotation, alongside the
    methenyl-H4MPT+ hydrogenase assay.
  experiment_type: enzyme assay
