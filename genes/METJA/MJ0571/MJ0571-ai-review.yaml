  review:
    action: ACCEPT
    summary: MJ0571 retains the ancestral cytosolic aspartokinase localization as an inference.
    reason: PAINT PTN000487132 places cytosol at an ancestral aspartokinase node seeded by E. coli
      MetL/P00562 and LysC/P08660; the inspected family review records those exact seeds and
      identifies a plant-plastid pruning issue. That phylogenetic assignment is retained for MJ0571
      as an inference, compatible with its soluble enzyme characterization in PMID:17012784, not as
      a direct native archaeal localization experiment. The PMID:18304323 abstract describes an E.
      coli cytosolic preparation but names neither donor, so it supplies study context rather than
      independent donor-hit verification. MJ0571 has no curated UniProt subcellular-location
      statement; a location statement for the distinct archaeal ThrB protein would not establish
      MJ0571 localization.
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: PANTHER:PTN000487132
        source_status: SUPPORTS_TRANSFER
        comment: MetL and LysC are the verified cytosolic seeds. The family review requires pruning 
          for plastid-targeted plant branches, not this archaeal recipient; localization remains an 
          ancestral inference.
    supported_by:
    - reference_id: PMID:18304323
      supporting_text: we identified 1103 proteins from the cytosolic fraction of the Escherichia 
        coli strain MC4100.
    - reference_id: file:interpro/panther/PTHR21499/PTHR21499-review.yaml
      supporting_text: "seeds:\n  - id: UniProtKB:P00562\n    label: metL\n    organism: Escherichia coli
