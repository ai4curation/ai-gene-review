  label: Methanocaldococcus jannaschii DSM 2661
description: 'MJ0571 encodes the monofunctional aspartokinase of Methanocaldococcus jannaschii. It catalyzes
  ATP-dependent phosphorylation of L-aspartate at the entry to the aspartate-family biosynthetic network. The
  recombinant enzyme forms a tetramer and is inhibited by threonine, while lysine did not inhibit under the
  tested conditions. The historical lysine-sensitive enzyme designation does not describe its measured regulation.'
