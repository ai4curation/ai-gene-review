  review:
    action: ACCEPT
    summary: MJ0571 is a monofunctional archaeal aspartokinase that uses ATP to activate aspartate.
    reason: The PTN000487132 aspartokinase inference is independently corroborated by direct target 
      structure and enzyme characterization in PMID:17012784. MJ0571 is monofunctional, binds 
      aspartate and MgADP, and forms a dimer of dimers; the archaeal target is not assumed to share 
      LysC lysine feedback simply because it lies in the same broad family.
