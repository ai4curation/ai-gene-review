- term:
    id: GO:0019287
    label: isopentenyl diphosphate biosynthetic process, mevalonate pathway
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:107624
  - PANTHER:PTN000048555
  - RGD:621295
  - SGD:S000004821
  review:
    summary: >-
      PAINT process inference from the PTHR43290 root node. MJ1087 catalyses the first step after
      mevalonate in IPP formation; in M. jannaschii the route from mevalonate 5-phosphate to IPP
      runs through isopentenyl phosphate rather than mevalonate diphosphate.
    action: ACCEPT
    reason: >-
      GO:0019287 is defined as IPP formation via the intermediate mevalonate, so it covers the
      modified archaeal routes as well as the classical one. The kinase does the work of the first
      phosphorylation step itself. M. jannaschii forms IPP through an isopentenyl phosphate kinase
      (MJ0044; PMID:16621811); the alternative decarboxylation routes from mevalonate 5-phosphate
      have been shown in H. volcanii (PMID:24375100) and A. pernix (PMID:30224495), and which one
      operates in M. jannaschii is not settled, but all start from the mevalonate 5-phosphate made
      by this enzyme. No PAINT loss on the lineage.
    supported_by:
    - reference_id: PMID:16621811
      supporting_text: The MJ0044 gene product was found to phosphorylate isopentenyl phosphate, generating
        isopentenyl diphosphate.
    - reference_id: PMID:16621811
      supporting_text: The presence of an IP kinase, in conjunction with the apparent absence of genes
        for phosphomevalonate kinase and diphosphomevalonate decarboxylase, suggests that an alternate
        pathway for the conversion of mevalonate-5-phosphate to IPP may be functioning in archaea.
    - reference_id: file:METJA/mvk/mvk-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: Functions in the mevalonate (MVA) pathway leading to isopentenyl diphosphate
        (IPP), a key precursor for the biosynthesis of isoprenoid compounds such as archaeal membrane
        lipids.
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: PANTHER:PTN000048555
        source_status: SUPPORTS_TRANSFER
        comment: The MVK step is shared by the classical and modified archaeal pathways, so the
          process inherited from eukaryotic seeds holds for the archaeal member.
