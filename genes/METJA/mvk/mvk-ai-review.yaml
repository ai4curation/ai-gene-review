    summary: >-
      PAINT inference from the PTHR43290 root node PTN000048555 (seeds mouse Mvk, rat Mvk, yeast
      ERG12, human MVK). MJ1087 sits inside this clade, and direct biochemistry on the recombinant
      M. jannaschii protein confirms mevalonate kinase activity.
    action: ACCEPT
    reason: >-
      The node is the family root, so every PTHR43290 member inherits the assertion unless a
