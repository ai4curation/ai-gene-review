suggested_questions:
- question: >-
    Which route converts mevalonate 5-phosphate to isopentenyl phosphate in M. jannaschii: a
    Haloferax-type phosphomevalonate decarboxylase, or the Aeropyrum-type dehydratase plus
    UbiD-family decarboxylase? The answer decides which enzyme consumes this kinase's product.
- question: >-
    Is feedback inhibition of this kinase by farnesyl and geranyl diphosphate relevant in vivo
    for regulating archaeal lipid precursor supply, given that some archaeal MVKs are
    feedback-resistant?
suggested_experiments:
- hypothesis: >-
    Mevalonate 5-phosphate made by MJ1087 is converted to isopentenyl phosphate in M. jannaschii
    cell extracts by a dehydratase-decarboxylase pair rather than a single phosphomevalonate
    decarboxylase.
  description: >-
    Incubate 13C-labelled mevalonate 5-phosphate with M. jannaschii cell-free extract and detect
    trans-anhydromevalonate 5-phosphate versus direct isopentenyl phosphate formation by LC-MS;
    test recombinant candidate homologs of the A. pernix enzymes.
  experiment_type: biochemical assay with cell-free extract
