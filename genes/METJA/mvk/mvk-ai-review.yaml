id: Q58487
gene_symbol: mvk
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:243232
  label: Methanocaldococcus jannaschii DSM 2661
description: >-
  mvk (MJ1087) encodes the mevalonate kinase of the hyperthermophilic methanogenic archaeon
  Methanocaldococcus jannaschii, a GHMP-family kinase that phosphorylates (R)-mevalonate at
  its 5-hydroxyl using Mg-ATP to give (R)-mevalonate 5-phosphate (EC 2.7.1.36). The
  recombinant enzyme is a thermostable homodimer of 36 kDa subunits with an activity optimum
  near 70-75 degrees C, Michaelis constants in the 70-100 micromolar range for both
  mevalonate and ATP, and competitive inhibition by farnesyl and geranyl diphosphate. Its
  crystal structure shows the GHMP fold with the active site in the cleft between the N- and
  C-terminal domains; Asp155 is the proposed catalytic base and Arg196 is essential for
  activity. The enzyme catalyses the first committed step after mevalonate synthesis in the
  archaeal mevalonate pathway that supplies isopentenyl diphosphate for the isoprenoid chains
  of archaeal membrane lipids. M. jannaschii lacks recognisable phosphomevalonate kinase and
  diphosphomevalonate decarboxylase genes and instead forms isopentenyl diphosphate by
  phosphorylating isopentenyl phosphate (isopentenyl phosphate kinase MJ0044), so the
  mevalonate 5-phosphate made by this kinase enters a modified downstream route. It is a
  soluble cytoplasmic enzyme.
