  review:
    summary: This specific initiation activity is directly contradicted for M.
    action: REMOVE
    reason: This specific initiation activity is directly contradicted for M. jannaschii ArgJ. PMID:10931207
      reports that the archaeal gene rescues argE but not argA deficiency and that purified M. jannaschii
      enzyme only catalyzes acetylornithine recycling, whereas the bacterial comparator ArgJs additionally
      use acetyl-CoA. Thus a family-level initiation assignment must exclude this experimentally monofunctional
      member; this is not a donor-count or self-donor objection.
    supported_by:
    - reference_id: PMID:10931207
      supporting_text: Archaeal argJ only complements an Escherichia coli argE mutant
    - reference_id: PMID:10931207
      supporting_text: M. jannaschii ArgJ is therefore a monofunctional enzyme
    propagation_review:
