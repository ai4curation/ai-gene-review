id: Q57645
gene_symbol: argJ
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:243232
  label: Methanocaldococcus jannaschii DSM 2661
description: ArgJ (MJ0186) is the monofunctional ornithine acetyltransferase of Methanocaldococcus jannaschii,
  formerly Methanococcus jannaschii. It transfers the acetyl group from N-acetylornithine to glutamate,
  releasing ornithine and regenerating N-acetylglutamate in arginine biosynthesis. Purified enzyme and
  complementation experiments distinguish this recycling activity from acetyl-CoA-dependent pathway initiation,
  which this ArgJ does not perform. Its precursor is processed into alpha and beta chains that assemble
  as an alpha2beta2 enzyme.
