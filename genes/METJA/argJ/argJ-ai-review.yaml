        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Acetyl-CoA-dependent initiation occurs in bifunctional bacterial ArgJ comparators, but
          direct complementation and purified-enzyme assays establish monofunctional recycling in MJ0186.
          The ancestral initiation assertion must not propagate to this experimentally distinguished member.
