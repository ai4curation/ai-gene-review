- term:
    id: GO:0070568
    label: guanylyltransferase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: enables
  supporting_entities:
  - UniRule:UR000092052
  review:
    summary: >-
      Correct but general parent of the experimentally supported phospholactate
      guanylyltransferase activity.
    action: MODIFY
    reason: >-
      The protein is a guanylyltransferase, but the specific activity is known and
      is already annotated by IDA: GO:0043814 phospholactate guanylyltransferase
      activity, an is_a child of GO:0070568. The general term should be refined to
      that one. The rule's CofC-family scope is broad because bacterial CofC/FbiD
      homologs may prefer PEP or 3-phospho-D-glycerate, for which GO has no terms,
      but for M. jannaschii CofC the 2-PL activity is established.
    proposed_replacement_terms:
    - id: GO:0043814
      label: phospholactate guanylyltransferase activity
    supported_by:
    - reference_id: PMID:18260642
      supporting_text: the purified protein was found to catalyze the formation of
        lactyl-2-diphospho-5'-guanosine from LP and GTP
