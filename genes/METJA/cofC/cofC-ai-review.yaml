id: Q58297
gene_symbol: cofC
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:243232
  label: Methanocaldococcus jannaschii DSM 2661
description: >-
  CofC (MJ0887) is a thermostable, homodimeric guanylyltransferase of the
  coenzyme F420 biosynthetic pathway in the methanogenic archaeon
  Methanocaldococcus jannaschii. It activates (2S)-2-phospho-L-lactate (2-PL)
  by condensation with GTP to form (2S)-lactyl-2-diphospho-5'-guanosine (LPPG)
  and diphosphate, the third step of F420 biosynthesis; LPPG is then used by
  CofD to transfer the phospholactyl group onto the deazaflavin chromophore Fo,
  forming F420-0. ATP, dGTP and ITP can substitute for GTP with lower activity.
  Recombinant CofC can also activate phosphoenolpyruvate (PEP) as a minor
  substrate, and when coupled to a mycobacterial FbiA partner it yields
  dehydro-F420-0, which led to a proposal that PEP is the physiological
  substrate; subsequent work with cognate CofD partners re-established 2-PL as
  the preferred substrate and the most likely starting point of F420
  biosynthesis in archaea. CofC belongs to the CofC family (Pfam PF01983,
  TIGR03552) of nucleotide-diphospho-sugar transferase fold enzymes, a family in
  which some bacterial homologs have switched to 3-phospho-D-glycerate.
existing_annotations:
- term:
    id: GO:0043814
    label: phospholactate guanylyltransferase activity
  evidence_type: IDA
  original_reference_id: PMID:18260642
  qualifier: enables
  review:
    summary: >-
      Direct biochemical demonstration that recombinant MJ0887 makes LPPG from
      2-phospho-L-lactate and GTP, with kinetic constants; this is the defining
      activity of CofC. GOA carries this claim twice (UniProt 2010 and MENGO
      2013), both IDA from the same paper.
    action: ACCEPT
    reason: >-
      The cited paper's abstract states the activity directly, with Km values for
      both substrates, and UniProt's curated catalytic activity is tied to it
      (ECO:0000269). A later report of no 2-PL turnover (PMID:30952857) used a
      non-cognate mycobacterial FbiA partner that only accepts the PEP-derived
      intermediate, and was explained as an assay artefact by PMID:35038903,
      which re-established 2-PL as the archaeal substrate. Core function.
    supported_by:
    - reference_id: PMID:18260642
      supporting_text: the purified protein was found to catalyze the formation of
        lactyl-2-diphospho-5'-guanosine from LP and GTP
    - reference_id: PMID:35038903
      supporting_text: Our previous study (22), however, found 2-PL to be the best
        substrate of the M. jannaschii CofC enzyme
    - reference_id: file:METJA/cofC/cofC-uniprot.txt
      record_section:
      - CC:FUNCTION
      supporting_text: Guanylyltransferase that catalyzes the activation of (2S)-2-
        phospholactate (2-PL) as (2S)-lactyl-2-diphospho-5'-guanosine, via the condensation
        of 2-PL with GTP.
- term:
    id: GO:0043814
    label: phospholactate guanylyltransferase activity
  evidence_type: IDA
  original_reference_id: PMID:18260642
  qualifier: enables
  negated: true
  review:
    summary: >-
      NOT annotation asserting that CofC lacks phospholactate guanylyltransferase
      activity, citing the very paper that demonstrated that activity. It was made
      by UniProt on the same date (2010-09-29), to the same term and from the same
      reference as a positive IDA row, and carries no annotation extension
      (checked in QuickGO), so the two rows directly contradict each other.
    action: REMOVE
    reason: >-
      The negation is contradicted by its own cited reference: the PMID:18260642
      abstract reports that MJ0887 catalyses formation of
      lactyl-2-diphospho-5'-guanosine from 2-phospho-L-lactate and GTP, with
      kinetic constants, and the same curator group's positive IDA row from that
      paper on the same day asserts the activity. The row predates the 2019 PEP
      proposal, so it cannot encode the later substrate debate. Even read in that
      light, the only report of no 2-PL turnover by Mj-CofC (PMID:30952857, a
      coupled assay with non-cognate Mtb-FbiA) was explained as an artefact of
      partner choice by PMID:35038903. The same 2008 paper found no lactate kinase
      activity (UniProt FUNCTION), which is one plausible origin of a mis-keyed
      negation, but the intended term is not recoverable from the GAF. The
      positive and negated rows cannot both stand; the positive is the one the
      evidence supports. The action differs from the positive rows on the same
      term because this row asserts the opposite claim.
    supported_by:
    - reference_id: PMID:18260642
      supporting_text: the purified protein was found to catalyze the formation of
        lactyl-2-diphospho-5'-guanosine from LP and GTP
    - reference_id: PMID:35038903
      supporting_text: Since Mjan-CofC can accept PEP as a minor substrate when combined
        with its cognate CofD (22), the assay resulted exclusively in DF420-formation
        when combined with FbiA, thus erroneously suggesting that 2-PL was not accepted
        by CofC.
    - reference_id: PMID:35038903
      supporting_text: reestablished 2-PL as the most likely starting point of F420
        biosynthesis in archaea
    source_defects:
    - defect_type: WRONG_QUALIFIER
      resource: UNIPROT
      slot: Qualifier
      requested_change: CHECK
      asserted_value: GO:0043814
      cause: UNKNOWN
      confidence: PROBABLE
      explanation: >-
        Q58297 carries both enables and NOT|enables GO:0043814 phospholactate
        guanylyltransferase activity, both IDA, both assigned by UniProt on
        2010-09-29, both citing PMID:18260642, neither with extensions. The cited
        paper characterises MJ0887 as the 2-phospho-L-lactate guanylyltransferase
        (Km 36 uM for 2-PL, 56 uM for GTP). The NOT row should be deleted, or, if
        it was meant to record a negative result from that paper (for example the
        absence of lactate kinase activity, or poor activity with an alternative
        nucleotide), re-keyed to the term actually intended.
