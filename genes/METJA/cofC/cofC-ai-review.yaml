- id: PMID:18260642
  title: Identification and characterization of the 2-phospho-L-lactate guanylyltransferase
    involved in coenzyme F420 biosynthesis.
  findings:
  - statement: Recombinant MJ0887 (CofC) catalyses formation of LPPG from 2-phospho-L-lactate
      and GTP, with Km 36 uM for 2-PL and 56 uM for GTP.
    supporting_text: the purified protein was found to catalyze the formation of lactyl-2-diphospho-5'-guanosine
      from LP and GTP
    full_text_unavailable: true
    finding_review:
      finding_status: CORROBORATED
      review_notes: Questioned by PMID:30952857 using a non-cognate FbiA partner; re-established
        by PMID:35038903 using cognate CofD partners.
      supported_by:
      - reference_id: PMID:35038903
        supporting_text: reestablished 2-PL as the most likely starting point of F420
          biosynthesis in archaea
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed abstract checked; primary characterisation of MJ0887 as LP guanylyltransferase.
      Abstract only in cache; UniProt curated comments (homodimer, alternative nucleotides,
      no lactate kinase activity, thermostability) are tied to this paper. It is also the
      cited reference of the contradictory NOT row.
- id: PMID:30952857
  title: A revised biosynthetic pathway for the cofactor F(420) in prokaryotes.
  findings:
  - statement: In coupled assays with Mtb-FbiA, Mj-CofC formed no F420-0 from 2-PL.
    supporting_text: We then tested whether Mtb-FbiA and CofC from Methanocaldococcus
      jannaschii (Mj-CofC) could catalyze F420-0 formation under the same conditions,
      which again yielded no product
    reference_section_type: RESULTS
    finding_review:
      finding_status: DISPUTED
      superseded_by:
      - PMID:35038903
      review_notes: The absence of 2-PL turnover is attributed to the non-cognate FbiA
        partner, which accepts only the PEP-derived intermediate EPPG.
      supported_by:
      - reference_id: PMID:35038903
        supporting_text: Since Mjan-CofC can accept PEP as a minor substrate when combined
          with its cognate CofD (22), the assay resulted exclusively in DF420-formation
          when combined with FbiA, thus erroneously suggesting that 2-PL was not accepted
          by CofC.
  - statement: Mj-CofC can use PEP to produce dehydro-F420-0 in a coupled assay.
    supporting_text: both Mtb-FbiD and CofC from Methanocaldococcus jannaschii (Mj-CofC)
      enzymes use PEP to produce dehydro-F420-0
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: Full text read. Its claim that archaeal CofC uses PEP rather than 2-PL
      was contested by PMID:35038903; the PEP activity itself (as a minor activity for
      Mj-CofC) is not disputed and is the basis for the PEP guanylyltransferase NTR.
- id: PMID:31469543
  title: Metabolic Pathway Rerouting in Paraburkholderia rhizoxinica Evolved Long-Overlooked
    Derivatives of Coenzyme F(420).
  findings:
  - statement: A CofC specificity switch reroutes F420 biosynthesis to 3-phospho-D-glycerate
      in P. rhizoxinica.
    supporting_text: a specificity switch in the guanylyltransferase CofC reprogrammed
      the pathway to start from 3-phospho-d-glycerate
    full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract only in cache. UniProt cites it for Mj-CofC 2-PL activity, and
      PMID:35038903 states this study found 2-PL to be the best Mj-CofC substrate; that
      claim could not be read here directly. Main subject is a bacterial CofC homolog.
- id: PMID:35038903
  title: Diversification by CofC and Control by CofD Govern Biosynthesis and Evolution
    of Coenzyme F(420) and Its Derivative 3PG-F(420).
  findings:
  - statement: CofD/FbiA partner choice determines which CofC product is captured;
      with cognate partners 2-PL is the preferred archaeal substrate, resolving the
      2-PL versus PEP debate.
    supporting_text: reestablished 2-PL as the most likely starting point of F420 biosynthesis
      in archaea
    reference_section_type: DISCUSSION
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text read (PMC8764529). Resolves the conflict between PMID:18260642
      and PMID:30952857.
