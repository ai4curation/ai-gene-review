suggested_questions:
- question: Should the UniProt NOT|enables GO:0043814 row on Q58297 (IDA, PMID:18260642,
    2010-09-29) be deleted, or was it intended for a different term such as an absent
    lactate kinase activity reported in the same paper?
- question: Since CofC-family members differ in substrate (2-PL, PEP, 3-phospho-D-glycerate),
    should the CofC-family UniRule and InterPro2GO mappings stop at guanylyltransferase
    activity until the substrate-specific terms exist, and which sequence features predict
    substrate preference?
- question: What generates 2-phospho-L-lactate in M. jannaschii (the CofB lactate kinase
    step), given that CofC itself has no lactate kinase activity?
suggested_experiments:
- experiment_type: Cognate coupled enzyme kinetics
  description: Measure M. jannaschii CofC kinetics with 2-PL, PEP and 3-phospho-D-glycerate
    coupled to M. jannaschii CofD (not FbiA), without pyruvate kinase/PEP regeneration
    systems, and quantify LPPG/EPPG directly by LC-MS.
- experiment_type: Metabolite profiling
  description: Test M. jannaschii or a related methanogen cell extract for dehydro-F420-0
    versus F420-0 and for intracellular 2-PL, to establish the in vivo substrate.
