- id: PMID:27324530
  title: MtrA of the sodium ion pumping methyltransferase binds cobalamin in a unique mode.
  findings:
  - statement: The soluble B12-binding domain of M. jannaschii MtrA, refolded with cobalamin, binds it at
      about 1:1. The crystal structure (PDB 5L8X) of the trypsin-cleaved domain is cofactor-free.
    supporting_text: The only MtrA protein with an approximately 1:1 cobalamin:protein ratio was the
      soluble domain of the membrane-associated MtrA from M. jannaschii
  - statement: The native cofactor in M. jannaschii is 5-hydroxybenzimidazolyl cobamide (factor III),
      not cobalamin.
    supporting_text: including M. jannaschii and M. fervidus, contain 5-hydroxybenzimidazolyl cobamide
      (factor III) rather than 5-dimethylbenzimidazolyl cobamide (cobalamin)
  - statement: His84 is the lower axial cobalt ligand (structure of the M. fervidus homologue).
    supporting_text: In MtrA, His84 pointing from a protrusion of loop β3-α3 towards the corrinoid ring,
      was coordinated to Co(III) via NE2
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached (PMC4915002). The only experimental work on the M. jannaschii protein
      itself. The cobalamin-bound structure is of the cytoplasmic MtrA homologue of Methanothermus
      fervidus; the M. jannaschii structure is the apo soluble domain.
- id: PMID:38530900
  title: Structural and mechanistic basis of the central energy-converting methyltransferase complex of
    methanogenesis.
  findings:
  - statement: Cryo-EM of Mtr(ABCDEFG)3 shows the MtrA C-terminal helix in the stalk and a mobile,
      unresolved B12 domain. Na+ and CoM bind in an MtrCDE cavity. MtrA is proposed to shuttle between
      MtrH and MtrCDE and to drive the pump conformationally.
    supporting_text: Putative coenzyme M and Na+ were identified inside or in a side-pocket of a
      cytoplasmic cavity formed within MtrCDE.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached (PMC10998594). Ortholog structure (not M. jannaschii). The coupling
      mechanism is stated as a hypothesis, and the MtrA-MtrH and MtrA-MtrCDE subcomplexes are AlphaFold2
      models.
