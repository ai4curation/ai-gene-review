- term:
    id: GO:0030269
    label: tetrahydromethanopterin S-methyltransferase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - InterPro:IPR005778
  - RHEA:53492
  - EC:7.2.1.4
  - UniRule:UR000100608
  review:
    summary: Combined automated annotation (InterPro, Rhea, EC 7.2.1.4 and HAMAP) of the complete Mtr
      reaction onto subunit A, with the qualifier enables.
    action: MARK_AS_OVER_ANNOTATED
    reason: GO:0030269 is the whole reaction of the eight-subunit complex, the methyl transfer from
      methyl-H4MPT to coenzyme M coupled to the outward movement of 2 Na+. It is also a child of sodium ion
      transmembrane transporter activity. MtrA alone catalyses neither half-reaction. MtrH catalyses
      methylation of the MtrA cob(I)amide by methyl-H4MPT. The Na+-dependent methyl transfer to coenzyme M
      needs the MtrCDE membrane module, which holds the Na+ and coenzyme M binding sites. MtrA is the
      cobamide-carrying intermediate that links the two half-reactions. It does real work in the activity
      (the cofactor case), so the row is not removed, but enables overstates its role. Its contribution is
      recorded in core_functions as contributes_to GO:0030269. This is pattern 16 of the ARCHAEA catalogue
      (whole-complex activity on a single subunit), treated as for the M. sedula biotin carrier and
      carboxyltransferase subunits (Msed_0148, Msed_1375). GO has no methyl-carrier MF term, so
      contributes_to is the most informative function annotation for MtrA.
    supported_by:
    - reference_id: PMID:10338124
      supporting_text: We report here that the 34 kDa subunit MtrH catalyzes the methylation reaction.
        MtrH was purified and shown to exhibit methyltetrahydromethanopterin:cob(I)alamin methyltransferase
        activity.
    - reference_id: PMID:38530900
      supporting_text: Putative coenzyme M and Na+ were identified inside or in a side-pocket of a
        cytoplasmic cavity formed within MtrCDE.
    - reference_id: file:METJA/mtrA/mtrA-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: Part of a complex that catalyzes the formation of methyl-coenzyme M and
        tetrahydromethanopterin from coenzyme M and methyl-tetrahydromethanopterin.
- term:
    id: GO:0035725
    label: sodium ion transmembrane transport
  evidence_type: IEA
  original_reference_id: GO_REF:0000108
  qualifier: involved_in
  supporting_entities:
  - GO:0030269
  review:
    summary: Inter-ontology inference from the GO:0030269 row, whose term is a child of sodium ion
      transmembrane transporter activity.
    action: KEEP_AS_NON_CORE
    reason: The Na+ binding site and the transmembrane pore are in the MtrCDE module, and MtrA has only a
      single anchor helix in the stalk. MtrA nonetheless does part of the work of the transport. Its
      demethylation is the Na+-dependent, energy-releasing step, and its cobamide domain is proposed to
      switch MtrCDE between the inward- and outward-facing states, much as the nucleotide-binding subunit
      powers an ABC transporter. The pump mechanism is a structural hypothesis, and MtrA is the energy
      donor rather than the ion conductor, so the term is kept as non-core. The row depends on the
      over-annotated GO:0030269 row, but the process claim holds on its own.
    supported_by:
    - reference_id: PMID:11248186
      supporting_text: it is proposed that methyl
        transfer from MtrA to coenzyme M is associated with a conformational change of
        the protein and that this change drives the electrogenic translocation of the
        sodium ions.
    - reference_id: PMID:38530900
      supporting_text: Hypothetically,
        strongly attached methyl-cob(III)amide (His-on) carrying MtrA induces an
        inward-facing conformation, Na+ flux into the membrane protein center and
        finally coenzyme M methylation
    - reference_id: PMID:27324530
      supporting_text: This finding points towards the participation of the demethylation reaction in
        sodium-ion translocation12, which is probably localized on MtrE as it contains a characteristic
        aspartate in the transmembrane helix15.
- term:
    id: GO:0050897
    label: cobalt ion binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR005778
  review:
    summary: InterPro2GO mapping from the MtrA family signature (IPR005778) to cobalt ion binding.
    action: MODIFY
    reason: The only cobalt MtrA binds is the cobalt at the centre of its corrinoid prosthetic group. The
      His84 contact to that cobalt (base-off/His-on) is part of binding the cobamide, not binding of a free
      Co2+ ion. By analogy with heme proteins, which GO annotates with heme binding and not iron ion
      binding, and with the F430 case in METAC mcrA (metal ion binding modified to tetrapyrrole binding),
      the informative term is cofactor binding. Unlike F430, the corrinoid has a specific GO term,
      GO:0031419 cobalamin binding (is_a GO:0046906 tetrapyrrole binding). The native M. jannaschii
      cofactor is 5-hydroxybenzimidazolyl cobamide (factor III), not cobalamin in the strict sense. The
      GO:0031419 definition ("a corrin nucleus containing a cobalt atom") still fits, and the soluble
      domain of this very protein binds cobalamin at about 1:1 in vitro. Whether GO should broaden the
      term to cobamides is raised under suggested_questions.
    proposed_replacement_terms:
    - id: GO:0031419
      label: cobalamin binding
    supported_by:
    - reference_id: PMID:27324530
      supporting_text: The only MtrA protein with an approximately 1:1 cobalamin:protein ratio was the
        soluble domain of the membrane-associated MtrA from M. jannaschii
    - reference_id: PMID:27324530
      supporting_text: In MtrA, His84 pointing from a protrusion of loop β3-α3 towards the corrinoid ring,
        was coordinated to Co(III) via NE2 and was hydrogen bonded via ND1 to Glu54-OE1.
    - reference_id: PMID:8898900
      supporting_text: the corrinoid is bound to MtrA1
        in the base-off form and that the Co(II) of the prosthetic group is coordinated
        by a histidine residue of the apoprotein
    - reference_id: file:METJA/mtrA/mtrA-uniprot.txt
      record_section: ["CC:COFACTOR"]
      supporting_text: Binds 1 5-hydroxybenzimidazolylcobamide group.
- term:
    id: GO:0044677
    label: methyl-tetrahydromethanopterin:coenzyme M methyltransferase complex
  evidence_type: ISS
  original_reference_id: PMID:38530900
  qualifier: part_of
  review:
    summary: GOA has no complex annotation for MtrA. MtrA is one of the eight subunits of the Mtr complex,
      and its C-terminal helix forms part of the Mtr(ABFG)3 stalk in the cryo-EM structure of an
      ortholog.
    action: NEW
    reason: GO:0044677 is defined as the eight-polypeptide complex that forms methyl-CoM and H4MPT from
      methyl-H4MPT and CoM, which is exactly the MtrA-H complex. Two independent lines place M. jannaschii
      MtrA in it. The HAMAP family rule assigns it as subunit A, and the ortholog structures show MtrA as
      a built-in subunit (stalk helix plus mobile B12 domain). The annotation is by sequence similarity,
      since the native M. jannaschii complex has not been purified.
    supported_by:
    - reference_id: PMID:38530900
      supporting_text: We present the 2.08 Å
        cryo-EM structure of Mtr(ABCDEFG)3 composed of the central Mtr(ABFG)3 stalk
        symmetrically flanked by three membrane-spanning MtrCDE globes.
    - reference_id: file:METJA/mtrA/mtrA-uniprot.txt
      record_section: ["CC:SUBUNIT"]
      supporting_text: The complex is composed of 8 subunits; MtrA, MtrB, MtrC, MtrD,
        MtrE, MtrF, MtrG and MtrH.
