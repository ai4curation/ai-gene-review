suggested_questions:
- question: GO:0031419 cobalamin binding names cobalamin (vitamin B12, the dimethylbenzimidazolyl
    cobamide), but methanogens without cytochromes use 5-hydroxybenzimidazolyl cobamide (factor III) and
    other organisms use further cobamides. Should GO broaden GO:0031419 to cobamide/corrinoid binding, or
    add a corrinoid binding parent, so that native-cofactor binding can be annotated exactly?
- question: GO has no molecular-function term for a methyl-carrier protein (by analogy with acyl carrier
    activity). Should GO add a corrinoid methyl-carrier activity term, so that MtrA, the corrinoid
    iron-sulfur protein and other corrinoid methyl carriers need not be annotated only by contributes_to
    the whole-complex activity?
- question: Should the InterPro2GO mapping of IPR005778 (MtrA) to GO:0050897 cobalt ion binding be
    replaced by GO:0031419 cobalamin binding, since the only cobalt bound is the corrin cobalt?
suggested_experiments:
- hypothesis: The native M. jannaschii MtrA holoprotein carries factor III bound through His84, and the
    His84-associated segments carry the conformational change that drives Na+ translocation.
  description: Express M. jannaschii mtrA-H homologously or reconstitute the complex, determine its
    corrinoid content by HPLC/MS, and test methyl transfer and 22Na+ uptake in proteoliposomes for
    wild-type and His84 or Glu54 variants.
