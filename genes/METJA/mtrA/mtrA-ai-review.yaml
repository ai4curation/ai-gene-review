core_functions:
- description: Methyl-carrying corrinoid subunit of the Na+-translocating Mtr complex. Its cobamide
    prosthetic group accepts the methyl group from methyl-H4MPT (in a reaction catalysed by MtrH) and
    donates it to coenzyme M at the MtrCDE membrane module. MtrA thereby contributes to the
    energy-conserving methyl-H4MPT to methyl-CoM step of methanogenesis from CO2.
  contributes_to_molecular_function:
    id: GO:0030269
    label: tetrahydromethanopterin S-methyltransferase activity
