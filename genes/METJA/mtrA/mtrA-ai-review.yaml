id: Q58261
gene_symbol: mtrA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:243232
  label: Methanocaldococcus jannaschii DSM 2661
description: >-
  mtrA (MJ0851) encodes subunit A of the membrane-bound N5-methyltetrahydromethanopterin:coenzyme M
  methyltransferase (Mtr) of the hydrogenotrophic methanogen Methanocaldococcus jannaschii. Mtr is an
  eight-subunit complex (MtrA-H) that catalyses the penultimate step of methanogenesis from CO2, the
  transfer of a methyl group from methyl-tetrahydromethanopterin (methyl-H4MPT) to coenzyme M. The
  exergonic transfer is coupled to the export of sodium ions, and this is the main Na+-motive,
  energy-conserving step of the pathway. MtrA is the methyl-carrying subunit. Its N-terminal soluble
  domain, a Rossmann-type fold, binds a cobamide prosthetic group (5-hydroxybenzimidazolyl cobamide,
  factor III, in M. jannaschii) in a base-off/His-on mode, with a conserved histidine (His84 in the
  structures) as the lower axial cobalt ligand. A C-terminal transmembrane helix anchors MtrA in the
  membrane-spanning stalk of the complex. In the catalytic cycle MtrH transfers the methyl group from
  methyl-H4MPT to the cob(I)amide of MtrA. The methyl-cob(III)amide is then demethylated by coenzyme M
  in a Na+-dependent reaction at the MtrCDE membrane module, which contains the Na+ binding site. The
  mobile cobamide domain is thought to shuttle between MtrH and MtrCDE and to drive the conformational
  changes of the pump. The soluble domain of M. jannaschii MtrA binds cobalamin in vitro, and its
  apo-structure has been solved.
