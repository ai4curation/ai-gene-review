  - UniPathway:UPA00050
  review:
    action: ACCEPT
    summary: ThrB catalyzes phosphohomoserine formation on the archaeal threonine branch.
    reason: ThrB uses ATP to form phosphohomoserine; direct archaeal substrate-discrimination and 
      structural studies distinguish it from shikimate kinase. This is actual catalytic 
      participation in L-threonine biosynthetic process. The sequence/pathway assignment is 
      independently consistent with this target reaction rather than inferred solely from a generic 
      amino-acid enzyme name.
    supported_by:
