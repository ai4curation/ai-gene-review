id: Q58504
gene_symbol: thrB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:243232
  label: Methanocaldococcus jannaschii DSM 2661
description: 'ThrB (MJ1104) is the ATP-dependent homoserine kinase of Methanocaldococcus jannaschii. This
  GHMP-family enzyme phosphorylates L-homoserine to O-phospho-L-homoserine in threonine biosynthesis.
  Recombinant enzyme assays and substrate-bound structures establish its substrate and nucleotide recognition;
  the distinct archaeal shikimate kinase is a distant GHMP-family relative, not an interchangeable activity.'
existing_annotations:
- term:
    id: GO:0004413
    label: homoserine kinase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - InterPro:IPR000870
  - RHEA:13985
  - EC:2.7.1.39
  - UniRule:UR000084185
  review:
    action: ACCEPT
    summary: Archaeal ThrB phosphorylates homoserine with ATP and strongly discriminates against 
      shikimate.
    reason: 'PMID:11114929 directly compares the archaeal homoserine and shikimate kinases: each shows
      over 1000-fold preference for its own substrate. PMID:11535056 places homoserine and ATP analogues
      in the ThrB active site, with a magnesium-associated nucleotide geometry supporting phosphoryl transfer.
      This is target-specific biochemical/structural evidence, not function inferred merely from the GHMP
      fold.'
    supported_by:
    - reference_id: PMID:11535056
      supporting_text: "The high-resolution structures\nof Methanococcus jannaschii HSK ternary complexes
        with its amino acid substrate\nand ATP analogues have been determined by X-ray crystallography."
    - &id001
      reference_id: PMID:11114929
      supporting_text: "No overlapping activity could be detected between shikimate\nkinase and homoserine
        kinase"
