  review:
    summary: PAINT propagation of CoB--CoM heterodisulfide reductase activity from PANTHER node
      PTN000078336 (PTHR43498, HdrA family). The only with/from donor is P60200 itself, through its
      MENGO IDA row.
    action: MODIFY
    reason: >-
      The claim behind the row, that HdrA belongs to the enzyme that reduces CoM-S-S-CoB, is sound.
      The term is wrong in two ways. (1) GO:0051912 is defined with methanophenazine as the electron
      acceptor. That is the membrane-bound HdrDE reaction (EC 1.8.98.1) of Methanosarcinales, and
      hydrogenotrophic methanogens such as M. jannaschii have no methanophenazine. Their cytoplasmic
      HdrABC reduces the heterodisulfide with electrons from H2 (or formate) and reduces ferredoxin
      at the same time, by flavin-based electron bifurcation. (2) The disulfide is cleaved at the
      noncubane [4Fe-4S] clusters of HdrB, not at HdrA. HdrA is the FAD-containing bifurcation
      subunit, so the activity belongs to the complex and should carry contributes_to, not enables
      (archaea pattern 16). GO has no term for the bifurcating reaction (EC 1.8.98.5), so the
      replacement is the proposed term. The target appearing in its own with/from is expected and
      not circular. However, the IBD rests only on P60200's IDA row, whose cited paper is a
      selenoprotein-labelling study (see the IDA row). The node also propagates to Korarchaeum
      cryptofilum HdrA homologs, and the HdrA family (PTHR43498) includes many non-methanogens.
      The node placement is therefore worth checking with PAINT. That check does not change the
      action for this methanogen target.
