core_functions:
- description: FAD-containing electron-bifurcating subunit of the cytoplasmic heterodisulfide
    reductase (HdrABC, with MvhADG/VhuADGU hydrogenase). It accepts electron pairs from H2 and
    splits them through its four [4Fe-4S] clusters to ferredoxin and, through HdrC, to HdrB, where
    CoM-S-S-CoB is reduced. The complex activity it contributes to (EC 1.8.98.5) has no GO term yet;
    see proposed_new_terms.
  molecular_function:
    id: GO:0009055
    label: electron transfer activity
  directly_involved_in:
  - id: GO:0019386
    label: methanogenesis, from carbon dioxide
  in_complex:
    id: GO:0044678
    label: CoB-CoM heterodisulfide reductase complex
  supported_by:
  - reference_id: PMID:21262829
    supporting_text: electron bifurcation is flavin based and that therefore the FAD harboring
      subunit HdrA is the site of electron bifurcation in the MvhADG/HdrABC complex
  - reference_id: PMID:28818947
    supporting_text: complex that uses flavin-based electron bifurcation to reduce ferredoxin and the
      heterodisulfide of coenzymes M and B
proposed_new_terms:
- proposed_name: H2:CoB-CoM heterodisulfide,ferredoxin reductase activity
  proposed_definition: 'Catalysis of the reaction: 2 H2 + CoM-S-S-CoB + 2 oxidized ferredoxin [iron-sulfur]
    cluster = coenzyme M + coenzyme B + 2 reduced ferredoxin [iron-sulfur] cluster + 4 H+ (EC 1.8.98.5).
    The reaction couples the exergonic reduction of the heterodisulfide with the endergonic reduction
    of ferredoxin by flavin-based electron bifurcation, and is catalysed by the cytoplasmic HdrABC-MvhADG
    complex of hydrogenotrophic methanogens.'
  justification: GO:0051912 is defined only for the methanophenazine-dependent HdrDE reaction, and the
    earlier H2:heterodisulfide term (GO:0045331) was made obsolete because it represented two activities.
    The bifurcating HdrABC reaction, demonstrated for the purified M. marburgensis complex, has no GO
    term. HdrA, HdrB and HdrC subunits across hydrogenotrophic methanogens would carry it with
    contributes_to, and the MvhA/VhuA hydrogenase subunits likewise.
  proposed_parent:
    id: GO:0016667
    label: oxidoreductase activity, acting on a sulfur group of donors
  supported_by:
  - reference_id: PMID:21262829
    supporting_text: It is reported here that the purified complex from Methanothermobacter
      marburgensis catalyzes the CoM-S-S-CoB-dependent reduction of ferredoxin with H 2 .
  - reference_id: PMID:21262829
    supporting_text: Per mole CoM-S-S-CoB added, 1 mol of ferredoxin (Fd) was reduced, indicating
      an electron bifurcation coupling mechanism
suggested_questions:
- question: GO:0051912 'CoB--CoM heterodisulfide reductase activity' is defined with methanophenazine
    as acceptor (EC 1.8.98.1), yet it is annotated to HdrABC subunits of hydrogenotrophic methanogens
    that have no methanophenazine. Should GO generalize the definition (any acceptor) and add children
    for the methanophenazine (EC 1.8.98.1), ferredoxin-bifurcating H2 (EC 1.8.98.5) and formate (EC
    1.8.98.6) reactions? GO:0044678 has the same issue in its definition text.
- question: Should GO have an electron-bifurcation molecular function (for example 'flavin-based electron
    bifurcating activity') for the bifurcating subunits HdrA, EtfAB, NfnB and HydB? Electron transfer
    activity does not say that one electron pair is split between two acceptors.
- question: Does the full text of PMID:9102456 contain any heterodisulfide reductase assay of M. jannaschii
    protein? If not, should the MENGO IDA row be re-evidenced, given that it is the only seed of PAINT
    node PTN000078336?
- question: PTN000078336 propagates GO:0051912 to Korarchaeum cryptofilum HdrA homologs. Do those
    organisms have CoM and CoB? If not, is the node placed too deep in PTHR43498, a family that includes
    many non-methanogen HdrA-like proteins?
suggested_experiments:
- hypothesis: M. jannaschii HdrABC with its hydrogenase couples H2-dependent ferredoxin reduction to
    CoM-S-S-CoB reduction at a 1:1 stoichiometry, and the selenocysteine at position 196 of HdrA is needed
    for full activity.
  description: Purify native or His-tagged Hdr-hydrogenase complex from M. jannaschii (or express it
    in M. maripaludis), assay CoM-S-S-CoB-dependent ferredoxin reduction with H2 as in Kaster et al.
    2011, and compare the wild type with a Sec196Cys variant of HdrA.
