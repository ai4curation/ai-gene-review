      The MODIFY follows from the term, not from second-guessing the curator. GO:0051912 is the
      methanophenazine-dependent HdrDE reaction. M. jannaschii lacks methanophenazine, and in HdrABC
      the disulfide is reduced by HdrB, while HdrA contributes FAD-based electron bifurcation. So for
