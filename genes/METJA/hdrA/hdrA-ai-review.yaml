id: P60200
gene_symbol: hdrA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:243232
  label: Methanocaldococcus jannaschii DSM 2661
description: >-
  hdrA (MJ1190) encodes subunit A of the cytoplasmic heterodisulfide reductase HdrABC of the
  hyperthermophilic, hydrogenotrophic methanogen Methanocaldococcus jannaschii. It is a 657-residue
  iron-sulfur flavoprotein with an FAD-binding Rossmann domain and four ferredoxin-type [4Fe-4S]
  cluster domains, and it carries a probable selenocysteine at position 196. In hydrogenotrophic
  methanogens HdrABC associates with the [NiFe]-hydrogenase MvhADG (or VhuADGU) and, in
  Methanococcales, with formate dehydrogenase and formylmethanofuran dehydrogenase. The complex
  couples the exergonic reduction of the CoM-S-S-CoB heterodisulfide, the last product of
  methanogenesis, to the endergonic reduction of ferredoxin, which drives the first step of
  CO2 reduction. Electrons from H2 enter the FAD of HdrA, which splits them by flavin-based
  electron bifurcation: one branch goes to ferredoxin, the other through HdrC to the noncubane
  [4Fe-4S] clusters of HdrB, where the heterodisulfide is cleaved. HdrA itself is therefore the
  electron-bifurcating and electron-transferring subunit, not the disulfide-reducing one. No
  M. jannaschii HdrA has been purified or assayed; its function is inferred from orthologs in
  Methanothermobacter marburgensis, Methanothermococcus thermolithotrophicus and Methanococcus
  maripaludis.
