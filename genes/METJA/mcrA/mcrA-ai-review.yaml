  review:
    summary: Combined automated annotation (ARBA, InterPro, Rhea/EC) for the MCR alpha-subunit
      activity.
    action: ACCEPT
    reason: The protein falls in the MCR alpha-subunit family (IPR016212), whose methanogen
      members are uniformly the catalytic subunit of methyl-coenzyme M reductase. The
      cross-clade residue comparison finds all 12 annotated active-site positions of
      P11558 conserved, including the F430 axial glutamine, and structures of MCRs
      from other Methanococcales show virtually identical active sites. Same claim
      as the ISS row.
