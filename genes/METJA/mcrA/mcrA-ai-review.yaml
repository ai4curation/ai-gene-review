- id: PMID:31139720
  title: Mechanistic Basis for Ribosomal Peptide Backbone Modifications.
  findings:
  - statement: M. jannaschii lacks TfuA, and its YcaO (MJ1094) alone thioamidates
      a McrA-derived peptide at Gly448, the natural thioglycine site, in an ATP- and
      sulfide-dependent reaction; PDB 6PEU is MjYcaO bound to this McrA peptide.
    supporting_text: a similar peptide derived from MjMcrA with the natural site of
      modification at Gly448
  - statement: YcaO proteins from the two tfuA-lacking hyperthermophiles thioamidate
      their cognate McrA peptides without TfuA.
    supporting_text: these two hyperthermophiles can catalyze thioamidation on the
      cognate McrA peptide in a TfuA-independent fashion.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text cached (PMC6535971). Peptide-level in vitro evidence;
      establishes the Gly448 thioglycine site in Q58256 numbering (checked against
      the sequence, H441-S-R443-L-G445-F-Y-G448). Informs the PTM, not the GO terms
      under review.
- id: PMID:28559298
  title: Phylogenetic and Structural Comparisons of the Three Types of Methyl Coenzyme
    M Reductase from Methanococcales and Methanobacteriales.
  findings:
  - statement: Methanobacteriales and Methanococcales MCRs form three types; type
      III is found only in Methanococcales, and all three types have virtually identical
      active sites.
    supporting_text: virtually identical active site architectures reflecting the
      chemically challenging mechanism of methane formation
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified (J Bacteriol 2017); abstract-only in cache. The
      PMC full text (PMC5527386, read on the web, not cached) places the M. jannaschii
      MCR in type III, which is why the transferred isoenzyme I name does not imply
      strict orthology to M. marburgensis MCR I. Supports transfer of the activity
      across MCR types.
