taxon:
  id: NCBITaxon:243232
  label: Methanocaldococcus jannaschii DSM 2661
description: mcrA (MJ0846) encodes the alpha subunit of methyl-coenzyme M reductase
  (MCR) in Methanocaldococcus jannaschii, a hyperthermophilic, autotrophic methanogen
  of the order Methanococcales that forms methane by reducing CO2 with H2. MCR is
  a cytoplasmic alpha2beta2gamma2 heterohexamer that catalyzes the final, methane-forming
  step of methanogenesis, the reduction of methyl-coenzyme M by coenzyme B to methane
  and the CoM-S-S-CoB heterodisulfide (EC 2.8.4.1). The M. jannaschii protein has
  not been purified or assayed; its function rests on its 72% identity to the biochemically
  and structurally characterized Methanothermobacter marburgensis MCR I alpha subunit
  and on conservation of every annotated active-site residue of that enzyme, including
  the glutamine (Gln150 here) that serves as the axial ligand to the nickel of coenzyme
  F430. Structures of MCRs from other Methanococcales show the same overall fold and
  a virtually identical active site. M. jannaschii also encodes a second, paralogous
  MCR (MCR II, mrtA) and the radical SAM methyltransferase that installs the active-site
  5-methylarginine.
