        structures and virtually identical active site architectures reflecting the chemically
        challenging mechanism of methane formation.
    - reference_id: file:projects/ARCHAEA/mcrA-across-clades/RESULTS.md
      supporting_text: All six methanogen McrA sequences, from four orders, keep the
        F430 axial glutamine, the coenzyme B and coenzyme M contacts, and the residues
        that carry the core modifications.
