taxon:
  id: NCBITaxon:243232
  label: Methanocaldococcus jannaschii DSM 2661
description: mcrA (MJ0846) encodes the alpha subunit of methyl-coenzyme M reductase
  isoenzyme I (MCR I) of the hyperthermophilic, obligately hydrogenotrophic methanogen
  Methanocaldococcus jannaschii, which grows only on H2 plus CO2. MCR is a soluble
  cytoplasmic alpha2beta2gamma2 heterohexamer that catalyzes the final, methane-forming
  step of methanogenesis, the reduction of methyl-coenzyme M by coenzyme B to methane
  and the CoM-S-S-CoB heterodisulfide (EC 2.8.4.1). Each holoenzyme has two active
  sites formed at the alpha, alpha', beta, gamma interface, each holding one non-covalently
  bound nickel porphinoid coenzyme F430; the alpha subunit supplies the axial glutamine
  ligand (Gln150) to the F430 nickel and most coenzyme M and coenzyme B contacts.
  MCR I isolated from M. jannaschii contains the active-site thioglycine common to
  all MCRs; in this organism, which lacks TfuA, the thioamide at Gly448 is installed
  by the YcaO protein MJ1094 alone, and Arg274 is predicted to be C5-methylated by
  the radical SAM methyltransferase MJ0841. The gene lies in the mcrBDCGA operon (MJ0842-MJ0846);
  M. jannaschii also encodes a second isoenzyme, MCR II (mrtBGA, MJ0081-MJ0083).
  Phylogenetically, MCRs of the Methanococcales form a distinct type, so the isoenzyme
  I name is transferred rather than reflecting strict orthology to the Methanothermobacter
  MCR I. Neither isoenzyme gene changes expression with H2 supply in chemostat culture.
