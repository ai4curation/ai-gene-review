proposed_new_terms:
- proposed_name: coenzyme F430 binding
  proposed_definition: Binding to coenzyme F430, a nickel-containing tetrapyrrole
    (hydrocorphinoid) cofactor of methyl-coenzyme M reductase and related alkyl-coenzyme
    M reductases.
  justification: Every MCR alpha subunit binds F430 through an axial glutamine ligand
    to its nickel (Gln150 in Q58256). GO has heme, chlorophyll and cobalamin binding
    under tetrapyrrole binding but no F430 term. Same proposal as in the METAC mcrA
    review.
  proposed_parent:
    id: GO:0046906
    label: tetrapyrrole binding
  supported_by:
  - reference_id: PMID:9367957
    supporting_text: two molecules of the nickel porphinoid coenzyme F430 are embedded
      between the subunits alpha, alpha', beta, and gamma
suggested_questions:
- question: Why does M. jannaschii keep two MCR isoenzymes (mcr and mrt) when, unlike
    Methanothermobacter, neither gene responds to H2 supply in chemostat culture? Do
    the isoenzymes differ in thermostability, sulfite sensitivity or kinetics?
- question: Should GO add a coenzyme F430 binding term (child of tetrapyrrole binding)
    for MCR alpha subunits, rather than relying on generic metal ion or nickel cation
    binding mappings?
- question: Given that Methanococcales MCRs form their own phylogenetic type, should
    UniProt's isoenzyme I and II names for M. jannaschii MCR subunits be qualified
    so that they are not read as orthology to M. marburgensis MCR I and II?
suggested_experiments:
- experiment_type: Biochemical characterization of isoenzymes
  hypothesis: The M. jannaschii mcr and mrt isoenzymes differ in properties relevant
    to hydrothermal vent conditions (temperature, sulfite or O2 exposure) rather than
    in H2-dependent regulation.
  description: Purify MCR I and MCR II from M. jannaschii (or express each operon
    in a genetically tractable methanococcal host), determine subunit composition,
    F430 content and PTM pattern by MS, and compare activity, thermal stability and
    sulfite inhibition.
