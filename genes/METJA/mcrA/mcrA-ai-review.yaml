  - statement: MCR I was isolated from M. jannaschii and, like all MCRs examined,
      contains the active-site thioxo peptide bond; methylation patterns differ between
      methanogens.
    supporting_text: MCRs from all methanogens investigated contain the thioxo peptide
      bond
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
