references:
- id: PMID:39495918
  title: Identification and characterization of the lipoprotein N-acyltransferase in Bacteroides.
  findings:
  - statement: The exact NCTC 9343 BF9343_0945 clone rescues Lnt-depleted E. coli and supports 
      complete lnt deletion in a Δlpp background. A purified Lpp(K58A)-Strep reporter from the Δlnt 
      cells carries N-acylation-specific MALDI-TOF/MS-MS products. This is target-specific cellular 
      functional evidence, not purified-Lnb turnover or a native B. fragilis deletion assay.
    supporting_text: we purified Lpp(K58A)-Strep from the Δlnt strain carrying pBF9343_0945 and 
      analyzed its N-terminal tryptic peptide
  - statement: Reporter MS/MS detects N-acylation-specific fragments after expression of the exact 
      B. fragilis clone in E. coli lacking lnt.
    supporting_text: Triacylation was further confirmed in the MS/MS analyses of parent peak m/z 
      1396, revealing the characteristic fragment ions m/z 813 and 845 indicative of N-acylation
  - statement: The functional evidence supports a distinct Lnb-dependent route; purified lipoprotein
      reporter analysis must not be confused with purification and reconstitution of the enzyme. The
      physiological donor remains unassigned.
    supporting_text: Further studies are required to characterize Lnb at the enzymatic level and 
      within other Bacteroides strains.
  - statement: The B. thetaiotaomicron Lnb model predicts a periplasmic N-terminal domain and five 
      transmembrane helices; this is not a compartment-resolved localization assay. The B. fragilis 
      target has matching Lnb domains and five predicted helices in its own raw sequence record.
    supporting_text: Lnb is predicted to have five transmembrane helices and a periplasmic domain 
      containing a DUF4105
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The full cached primary Results, Discussion and Methods were read. The exact NCTC 
      9343 BF9343_0945 clone rescues Lnt-depleted E. coli and supports complete lnt deletion in a 
      Δlpp background. A purified Lpp(K58A)-Strep reporter from the Δlnt cells carries 
      N-acylation-specific MALDI-TOF/MS-MS products. This is target-specific cellular functional 
      evidence, not purified-Lnb turnover or a native B. fragilis deletion assay. Only the B. 
      thetaiotaomicron protein was tested by C148S/C198S mutagenesis. The paper gives a 398-residue 
      length for its Lnb model, whereas the current Q89ZL3 sequence is395 residues; the four 
      discussed positions H49/N66/C148/C198 nevertheless match that sequence. No cause of the length
      discrepancy is inferred.
