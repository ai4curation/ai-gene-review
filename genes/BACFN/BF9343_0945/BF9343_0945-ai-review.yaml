    action: NEW
    summary: Experimentally established lipoprotein N-acylation represented by the valid 
      acyltransferase genus.
    reason: The exact NCTC 9343 BF9343_0945 clone rescues Lnt-depleted E. coli and supports complete
      lnt deletion in a Δlpp background. A purified Lpp(K58A)-Strep reporter from the Δlnt cells 
      carries N-acylation-specific MALDI-TOF/MS-MS products. This is target-specific cellular 
      functional evidence, not purified-Lnb turnover or a native B. fragilis deletion assay. 
      GO:0016747 captures transfer of a non-amino-acyl group without requiring an identified donor. 
      GO:0016410 is obsolete; GO:0140186 concerns acyl-CoA-dependent lysine N6 acylation, not the 
      observed N-terminal cysteine modification. The broad experimental code does not imply a 
      purified-enzyme assay.
    supported_by:
