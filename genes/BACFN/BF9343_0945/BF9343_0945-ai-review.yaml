    summary: Lnb performs the terminal acylation work of bacterial lipoprotein biosynthesis.
    reason: The exact NCTC 9343 BF9343_0945 clone rescues Lnt-depleted E. coli and supports complete
      lnt deletion in a Δlpp background. A purified Lpp(K58A)-Strep reporter from the Δlnt cells 
      carries N-acylation-specific MALDI-TOF/MS-MS products. This is target-specific cellular 
      functional evidence, not purified-Lnb turnover or a native B. fragilis deletion assay. The 
      product performs the modifying step rather than merely being consumed by it. Exact-term 
      QuickGO comparator queries retain this process on same-role E. coli Lnt (P23930) and KT2440 
      Lnt (Q88DN4), so there is no systematic exclusion of terminal N-acylation catalysts. The 
      zero-row seed has no existing or proposed ancestor/descendant process to duplicate. Growth, 
      morphology, polysaccharide utilization and membrane-protein distribution are downstream 
      consequences and are not added as direct process annotations.
