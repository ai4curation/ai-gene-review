  label: Bacteroides fragilis NCTC 9343
description: Lnb (BF9343_0945) is a lipoprotein N-acyltransferase of Bacteroides fragilis NCTC 9343.
  It promotes addition of an acyl group to the free alpha-amino group of the lipidated N-terminal 
  cysteine of an apolipoprotein, producing the mature triacylated form. The protein has an Lnb 
  N-terminal domain and a predicted multipass membrane domain and is structurally distinct from 
  canonical Lnt. The physiological acyl donor and detailed catalytic mechanism remain unresolved.
