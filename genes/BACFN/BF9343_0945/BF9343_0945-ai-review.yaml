suggested_questions:
- question: Which physiological molecule donates the N-acyl chain to Lnb, and does the enzyme use a 
    covalent acyl intermediate?
- question: Does the predicted periplasmic domain orientation hold in the native membrane, and which
    catalytic residues can be distinguished from folding or stability determinants?
suggested_experiments:
- description: Reconstitute purified Lnb with defined diacylglyceryl lipoprotein acceptors and 
    candidate acyl donors; directly measure product formation and donor consumption.
  experiment_type: in vitro enzyme assay
- description: Measure native membrane topology and compare Lnb mutant abundance/stability with 
    N-acylation activity to distinguish catalytic from structural effects.
  experiment_type: topology and mutagenesis analysis
