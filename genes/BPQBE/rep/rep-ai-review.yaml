core_functions:
- description: >-
    Catalyzes de novo initiation and processive 5'-3' RNA-directed RNA polymerization
    in complex with host Escherichia coli EF-Tu, EF-Ts, and ribosomal protein S1 to
    replicate the viral single-stranded RNA genome via a negative-strand intermediate.
  molecular_function:
    id: GO:0003968
    label: RNA-directed RNA polymerase activity
  directly_involved_in:
  - id: GO:0039694
    label: viral RNA genome replication
  supported_by:
  - reference_id: PMID:20798060
    supporting_text: >-
      Qbeta replicase requires the virus-encoded RNA-dependent RNA polymerase (beta-subunit), and the host-donated translational elongation factors EF-Tu and -Ts, as active core subunits for its RNA polymerization activity.
  - reference_id: PMID:22245970
    supporting_text: >-
      At the elongation stages, the C-terminal region of the β-subunit, assisted by EF-Tu, splits the temporarily double-stranded RNA between the template and nascent RNAs before translocation of the single-stranded template RNA into the exit channel.
  - reference_id: file:BPQBE/rep/rep-uniprot.txt
    record_section: ["CC:FUNCTION"]
    supporting_text: >-
      This is the catalytic subunit of the viral RNA-dependent RNA polymerase complex. This complex is involved in viral RNA replication that produces (+)-stranded genomes via a complementary, (-)-stranded intermediate.
