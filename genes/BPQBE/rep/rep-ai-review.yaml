- id: PMID:20798060
  title: Assembly of Q{beta} viral RNA polymerase with host translational elongation
    factors EF-Tu and -Ts.
  findings:
  - statement: >-
      Crystal structure of the core Qbeta replicase (1:1:1 complex of the viral
      beta-subunit, host EF-Tu, and host EF-Ts) shows that EF-Tu:EF-Ts maintains the
      catalytic core crevasse of the right-handed beta-subunit via hydrophobic
      interactions.
    supporting_text: >-
      The beta-subunit has a right-handed structure, and the EF-Tu:Ts binary complex maintains the structure of the catalytic core crevasse of the beta-subunit through hydrophobic interactions, between the finger and thumb domains of the beta-subunit and domain-2 of EF-Tu and the coiled-coil motif of EF-Ts, respectively.
  - statement: >-
      Qbeta replicase requires the viral RdRp beta-subunit and host EF-Tu and EF-Ts
      for RNA polymerization activity.
    supporting_text: >-
      Qbeta replicase requires the virus-encoded RNA-dependent RNA polymerase (beta-subunit), and the host-donated translational elongation factors EF-Tu and -Ts, as active core subunits for its RNA polymerization activity.
- id: PMID:22245970
  title: Molecular basis for RNA polymerization by Qβ replicase.
  findings:
  - statement: >-
      Crystal structures of Qbeta replicase initiation and elongation complexes show
      that the 3'-adenine of the template RNA provides a platform for de novo
      initiation and that the C-terminal region of the beta-subunit assisted by
      EF-Tu splits the template-nascent RNA duplex.
    supporting_text: >-
      Structural analyses of RNA polymerization by core Qβ replicase reveal that at the initiation stage, the 3'-adenine of the template RNA provides a stable platform for de novo initiation.
  - statement: >-
      The C-terminal region of the beta-subunit and EF-Tu separate the transient
      double-stranded RNA duplex during elongation.
    supporting_text: >-
      At the elongation stages, the C-terminal region of the β-subunit, assisted by EF-Tu, splits the temporarily double-stranded RNA between the template and nascent RNAs before translocation of the single-stranded template RNA into the exit channel.
- id: file:BPQBE/rep/rep-uniprot.txt
  title: UniProtKB entry for BPQBE rep (P14647)
  findings:
  - statement: >-
      Catalytic subunit of the viral RNA-dependent RNA polymerase complex that
      replicates (+)-stranded genomes via a (-)-stranded intermediate and binds RNA
      cooperatively with host ribosomal protein S1.
    record_section: ["CC:FUNCTION"]
    supporting_text: >-
      This is the catalytic subunit of the viral RNA-dependent RNA polymerase complex. This complex is involved in viral RNA replication that produces (+)-stranded genomes via a complementary, (-)-stranded intermediate. Binds RNA cooperatively with the host ribosomal protein S1.
  - statement: >-
      Coordinates two Mg2+ cofactor ions per subunit.
    record_section: ["CC:COFACTOR"]
    supporting_text: >-
      Binds 2 Mg(2+) per subunit, Ca(2+) is used in crystallization to prevent RNA polymerase activity.
suggested_questions:
- question: >-
    How does host ribosomal protein S1 transition from anchoring the long-range M-site
    of positive-strand Qbeta genomic RNA during initiation to releasing the template
    during processive elongation?
suggested_experiments:
- description: >-
    Time-resolved cryo-EM of the complete four-subunit Qbeta replicase holoenzyme
    (beta-subunit, EF-Tu, EF-Ts, and full-length S1) initiating de novo synthesis
    on full-length positive-strand Qbeta genomic RNA.
  hypothesis: >-
    OB-fold domains of S1 transiently dock the internal M-site and 3' end of the
    genomic RNA near the template entrance tunnel and Undock once the nascent
    dinucleotide is formed and translocation begins.
