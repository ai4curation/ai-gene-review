  supporting_entities:
  - UniProtKB:P0A6P1
  review:
    summary: >-
      Although the crystal structure in PMID:20798060 establishes direct hydrophobic
      binding of the beta-subunit thumb domain to host EF-Ts (P0A6P1), bare
      protein binding (GO:0005515) is uninformative and should be removed.
    action: REMOVE
    reason: >-
      The physical interaction with Escherichia coli EF-Ts (UniProtKB:P0A6P1) in the
      core Qbeta replicase complex is genuine and well supported by PMID:20798060,
      but generic GO:0005515 (protein binding) conveys no specific molecular function
      information and is removed per GO curation policy.
    supported_by:
    - reference_id: PMID:20798060
      supporting_text: >-
        The beta-subunit has a right-handed structure, and the EF-Tu:Ts binary complex maintains the structure of the catalytic core crevasse of the beta-subunit through hydrophobic interactions, between the finger and thumb domains of the beta-subunit and domain-2 of EF-Tu and the coiled-coil motif of EF-Ts, respectively.
