id: P14647
gene_symbol: rep
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:39803
  label: Qubevirus durum
description: >-
  Catalytic beta-subunit of the Qubevirus durum (bacteriophage Qbeta) RNA-directed
  RNA polymerase (replicase) holoenzyme. It adopts a right-handed polymerase fold
  with finger, palm, and thumb domains that coordinates two catalytic Mg2+ ions and
  assembles into a tight heterotrimeric core complex with host Escherichia coli
  translation elongation factors EF-Tu and EF-Ts, plus host ribosomal protein S1.
  Together, this complex catalyzes de novo initiation and processive 5'-3' RNA
  polymerization to replicate the positive-sense single-stranded viral RNA genome
  via a complementary negative-strand intermediate.
