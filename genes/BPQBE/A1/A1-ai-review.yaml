  title: UniProtKB entry for BPQBE A1 (Q8LTE1)
  findings:
  - statement: A1 is a minor capsid protein present in 3-10 copies per virion with its read-through extensions located on
      the exterior of the capsid.
    supporting_text: Present in 3-10 copies per virion. The readthrough extensions are probably located on the exterior of
      the capsid.
  - statement: Translated by episodic ribosomal read-through of the UGA termination codon at the end of the capsid protein
      gene.
    supporting_text: This protein is translated as a fusion protein by episodic readthrough of the termination codon at the
      end of the capsid protein. Readthrough of the terminator codon occurs between the codons for Tyr-133 and Trp-134, thereby
      producing the readthrough extension.
suggested_questions:
- question: What is the exact role of the surface-exposed C-terminal read-through domain of A1 during initial F-pilus contact
    or subsequent translocation of the genomic RNA across the host cell envelope?
suggested_experiments:
- description: Single-particle fluorescence tracking and cryo-electron tomography of Qbeta virions containing stoichiometric
    numbers of A1 subunits during adsorption to Escherichia coli F-pili and genome entry.
  hypothesis: The flexible C-terminal read-through domains of A1 mediate weak, reversible electrostatic or pilin-scanning
    interactions along the F-pilus that facilitate productive docking of the single-copy maturation protein A2.
