taxon:
  id: NCBITaxon:39803
  label: Qubevirus durum
description: Essential minor capsid protein (A1 read-through protein) of Qubevirus durum (bacteriophage Qbeta), produced by
  occasional ribosomal read-through of the leaky UGA stop codon at the end of the major coat protein (cp) gene. It consists
  of the 133-amino-acid N-terminal coat domain connected via a flexible linker to a 196-amino-acid C-terminal read-through
  extension. About 3 to 10 copies of A1 replace major coat protein monomers in the T=3 icosahedral capsid, projecting their
  read-through domains on the virion exterior, and are required for virion infectivity.
