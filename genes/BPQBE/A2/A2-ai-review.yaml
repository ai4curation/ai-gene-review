id: Q8LTE2
gene_symbol: A2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:39803
  label: Qubevirus durum
description: >-
  Dual-function maturation and lysis protein (A2) of Qubevirus durum (bacteriophage
  Qbeta). Incorporated as a single copy into the T=3 icosahedral capsid at a two-fold
  axis, its buried alpha-helical region binds the single-stranded viral genomic RNA
  and an internalized coat protein dimer during genome packaging, while its exposed
  beta-region mediates virion adsorption to the host Escherichia coli F-pilus and
  genome entry. Late in infection, A2 triggers host cell lysis by binding the closed
  catalytic cleft of host MurA (UDP-N-acetylglucosamine 1-carboxyvinyltransferase),
  blocking the committed step of peptidoglycan biosynthesis.
