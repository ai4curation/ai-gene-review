  title: Gene Ontology annotation based on UniProtKB/Swiss-Prot keyword mapping
  findings: []
- id: GO_REF:0000120
  title: Combined Automated Annotation using Multiple IEA Methods
  findings: []
- id: PMID:11423662
  title: 'A protein antibiotic in the phage Qbeta virion: diversity in lysis targets.'
  findings:
  - statement: >-
      Qbeta maturation protein A2 induces host lysis by binding and inhibiting
      Escherichia coli MurA, blocking the committed step of peptidoglycan
      biosynthesis in vivo and in vitro.
    supporting_text: >-
      A(2), a capsid protein of RNA phage Qbeta, is also responsible for host lysis. A(2) blocked synthesis of murein precursors in vivo by inhibiting MurA, the catalyst of the committed step of murein biosynthesis.
- id: PMID:11892805
  title: The lysis function of RNA bacteriophage Qbeta is mediated by the maturation
    (A2) protein.
  findings:
  - statement: >-
      Expression of the cloned Qbeta A2 cistron alone is sufficient to trigger
      Escherichia coli cell lysis, and C-terminal or internal deletions in A2
      abolish lysis.
    supporting_text: >-
      Thus, in Qbeta, the A2 protein, in addition to its functions as maturation protein, appears to trigger cell lysis.
- id: PMID:29078304
  title: Structures of Qβ virions, virus-like particles, and the Qβ-MurA complex reveal
    internal coat proteins and the mechanism of host lysis.
  findings:
  - statement: >-
      Cryo-EM structure of the Qbeta-MurA complex shows that the outer surface of
      the beta-region of A2 binds the closed catalytic cleft of substrate-liganded
      host MurA to inhibit peptidoglycan synthesis.
    supporting_text: >-
      For the canonical Allolevivirus Qβ the maturation protein, A2, has an additional role as the lysis protein, by its ability to bind and inhibit MurA, which is involved in peptidoglycan biosynthesis.
  - statement: >-
      The buried alpha-region of A2 binds the viral genomic RNA and interacts with
      an internalized coat protein dimer inside the virion.
    supporting_text: >-
      Unexpectedly, we found a coat protein dimer sequestered in the interior of the virion. This coat protein dimer binds to the gRNA and interacts with the buried α-region of A2, suggesting that it is sequestered during the early stage of capsid formation to promote the gRNA condensation required for genome packaging.
- id: file:BPQBE/A2/A2-uniprot.txt
  title: UniProtKB entry for BPQBE A2 (Q8LTE2)
  findings:
  - statement: >-
      A2 induces host cell lysis by inhibiting host MurA, makes extensive contacts
      with the viral genome, and mediates attachment to the host pilus.
    supporting_text: >-
      Induces host cell lysis (PubMed:11892805, PubMed:29078304). Inhibits host MurA activity thereby blocking the synthesis of murein precursors necessary for the host cell wall biosynthesis (PubMed:11423662, PubMed:29078304). May be responsible for the attachment to the host pilus. Makes extensive contacts with the viral genome (PubMed:28111107).
  - statement: >-
      Present as a single copy in the mature Qbeta virion.
    supporting_text: >-
      A single copy of the maturation protein is present in the virion.
suggested_questions:
- question: >-
    Does free cytoplasmic A2 contribute significantly to MurA inhibition prior to
    virion assembly, or is lysis strictly coupled to the accumulation of assembled
    Qbeta virions displaying the A2 beta-region?
suggested_experiments:
- description: >-
    Compare intracellular MurA inhibition kinetics and lysis timing in Escherichia
    coli cells expressing wild-type A2 versus coat-protein-binding-defective A2
    variants in the presence and absence of Qbeta genomic RNA and coat protein.
  hypothesis: >-
    Assembly of A2 into the virion stabilizes the MurA-binding conformation of its
    exposed beta-region, coupling host lysis timing to virion maturation.
