- id: PMID:16531233
  title: Structural basis of RNA binding discrimination between bacteriophages Qbeta and MS2.
  findings:
  - statement: Qbeta coat protein dimers bind a 3-nucleotide-loop RNA operator hairpin encompassing the replicase start codon
      to repress replicase translation and discriminate against non-cognate phage operators.
    supporting_text: In vivo, a single CP dimer binds to a short RNA stem-loop operator within the viral genome that encompasses
      the start codon for the viral replicase, leading to inhibition of translation.
- id: PMID:19913556
  title: Viral genomic single-stranded RNA directs the pathway toward a T=3 capsid.
  findings:
  - statement: RNA stem-loop binding to coat protein dimers directs quasi-equivalent conformer switching and T=3 capsid assembly
      in ssRNA phages.
    supporting_text: Some support for this idea comes from cryo-electron microscopy (EM) reconstructions of the wild-type
      phages of MS2, Qβ, fr and AP205.
- id: PMID:27671640
  title: Asymmetric cryo-EM structure of the canonical Allolevivirus Qβ reveals a single maturation protein and the genomic
    ssRNA in situ.
  findings:
  - statement: Qbeta virions possess a T=3 icosahedral lattice of coat proteins interacting with a single layer of folded
      genomic ssRNA, including operator-like hairpins.
    supporting_text: Qβ, an ssRNA phage specific for the conjugative F-pilus, has a T = 3 icosahedral lattice of coat proteins
      assembled around its 4,217 nucleotides of genomic RNA (gRNA).
  - statement: Every coat protein copy contacts the outer layer of genomic RNA, with one-third of interactions occurring at
      operator-like hairpins.
    supporting_text: A single layer of RNA directly contacts every copy of the coat protein, with one-third of the interactions
      occurring at operator-like RNA hairpins.
- id: PMID:8943226
  title: The RNA-binding site of bacteriophage Qbeta coat protein.
  findings:
  - statement: Mutational analysis maps the operator RNA-binding site of Qbeta coat protein to its large beta-sheet surface
      and identifies residues governing specificity versus MS2.
    supporting_text: Here we describe the isolation of mutants that define the RNA-binding site of Qbeta coat protein, showing
      that, as with MS2, it resides on the surface of a large beta-sheet.
- id: file:BPQBE/cp/cp-uniprot.txt
  title: UniProtKB entry for BPQBE cp (P03615)
  findings:
  - statement: Qbeta capsid protein self-assembles into a 26 nm T=3 icosahedral capsid of 89 CP dimers and one maturation
      protein, with one CP dimer sequestered inside the virion.
    record_section: ["CC:FUNCTION"]
    supporting_text: Capsid protein self-assembles to form an icosahedral capsid with a T=3 symmetry, about 26 nm in diameter,
      and consisting of 89 capsid proteins dimers (178 capsid proteins) (PubMed:19913556, PubMed:27671640).
  - statement: Represses translation of the viral replicase late in infection by binding the operator hairpin containing the
      replicase ribosome-binding site.
    record_section: ["CC:FUNCTION"]
    supporting_text: Acts as a translational repressor of viral replicase synthesis late in infection. This latter function
      is the result of capsid protein interaction with an RNA hairpin which contains the replicase ribosome-binding site.
suggested_questions:
- question: How is a single coat protein homodimer selectively internalized and bound to the buried alpha-region of A2 and
    the five-way genomic RNA junction during the initiation of Qbeta capsid assembly?
suggested_experiments:
- description: Reconstitute early Qbeta assembly complexes in vitro using purified A2, CP dimers, and the 5'-terminal five-way
    RNA junction fragment, followed by native mass spectrometry and cryo-EM analysis.
  hypothesis: Cooperative binding of A2 and a single CP dimer to the five-way RNA junction forms an asymmetric nucleation
    complex that internalizes that CP dimer as the surrounding T=3 shell closes.
