taxon:
  id: NCBITaxon:39803
  label: Qubevirus durum
description: Major coat protein (CP) of Qubevirus durum (bacteriophage Qbeta) that forms homodimers and self-assembles into
  a T=3 quasi-icosahedral viral capsid around the 4,217-nucleotide single-stranded genomic RNA, with one additional CP dimer
  sequestered in the virion interior bound to the maturation protein A2 and a five-way genomic RNA junction. Beyond its structural
  role in encapsidating the viral genome via operator-like RNA hairpins, a CP dimer binds specifically to the translational
  operator stem-loop spanning the replicase start codon to repress viral replicase translation late in infection.
