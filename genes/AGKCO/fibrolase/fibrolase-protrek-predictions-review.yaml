id: P28891
gene_symbol: fibrolase
taxon:
  id: NCBITaxon:8713
  label: Agkistrodon contortrix contortrix (Southern copperhead)
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for fibrolase, a non-hemorrhagic snake venom zinc metalloproteinase
  with direct fibrinolytic activity. The result is a sharp illustration of within-family over-assignment:
  ranks 1 and 2 assert hemorrhagic envenomation activity that this protein specifically lacks, while
  rank 3 identifies fibrinogenolysis correctly and rank 4 reaches the review's core process (envenomation
  resulting in fibrinolysis). The free-text Function channel is right at rank 1, returning the fibrolase
  comment including 'does not produce hemorrhage'. Assessment: 1 correct novel (COR), 2 nonparalog
  incorrect (NPI).
source_documents:
- projects/PROTREK_EVALUATION/argo139_protrek_hits.tsv
- genes/AGKCO/fibrolase/fibrolase-uniprot.txt
- genes/AGKCO/fibrolase/fibrolase-goa.tsv
predictions:
- source_method: ProTrek
  source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
  source_reference_id: PMID:41039041
  predicted_term:
    id: GO:0044482
    label: envenomation resulting in blood vessel extracellular matrix damage, causing hemorrhagic
      damage in another organism
  predicted_term_type: GO_BP
  review:
    assessment: NPI
    confidence_score: 0
    error_type: PARALOG_OVERANNOTATION
    summary: >-
      Top-ranked hit (score 17.40). Fibrolase is explicitly a non-hemorrhagic P-I class snake venom
      metalloproteinase: it degrades fibrin and fibrinogen without damaging vessel basement membrane,
      which is precisely why it was developed as the therapeutic alfimeprase. This term asserts the
      opposite. It is transferred from the hemorrhagic P-III SVMPs that dominate the venom metalloproteinase
      family in SwissProt. The term is additionally obsolete in the current GO release, so it could
      not be entered even if it were right.
    supported_by:
    - reference_id: file:AGKCO/fibrolase/fibrolase-uniprot.txt
      supporting_text: >-
        Belongs to the venom metalloproteinase (M12B) family. P-I subfamily
- source_method: ProTrek
  source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
  source_reference_id: PMID:41039041
  predicted_term:
    id: GO:0044358
    label: envenomation resulting in hemorrhagic damage in another organism
  predicted_term_type: GO_BP
  review:
    assessment: NPI
    confidence_score: 0
    error_type: PARALOG_OVERANNOTATION
    summary: >-
      Rank 2 (score 16.23), the non-obsolete version of the same wrong claim, and mechanically scored
      MORE_SPECIFIC because it is a descendant of GOA's generic modulation of process of another organism.
      Being a descendant of a correct parent does not make it correct: hemorrhagic damage is the defining
      property fibrolase does not have. This is the clearest case in either cohort where an ontology-closure
      score would count a substantively wrong call as a refinement.
    supported_by:
    - reference_id: file:AGKCO/fibrolase/fibrolase-uniprot.txt
      supporting_text: >-
        Belongs to the venom metalloproteinase (M12B) family. P-I subfamily
- source_method: ProTrek
  source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
  source_reference_id: PMID:41039041
  predicted_term:
    id: GO:0044485
    label: envenomation resulting in fibrinogenolysis in another organism
  predicted_term_type: GO_BP
  review:
    assessment: COR
    confidence_score: 2
    summary: >-
      Rank 3 (score 15.97) and absent from GOA. Fibrinogenolysis is exactly what fibrolase does: it
      cleaves the Aalpha chain of fibrinogen first, then the Bbeta chain, sparing the gamma chain.
      Correct, specific and novel with respect to the existing IEA annotation set, which stops at
      the generic modulation of process of another organism. The review's stated core process, envenomation
      resulting in fibrinolysis, follows at rank 4, so the two correct calls sit immediately below
      two incorrect ones.
    supported_by:
    - reference_id: PMID:1304358
      supporting_text: >-
        Snake venom metalloproteinase fibrolase
