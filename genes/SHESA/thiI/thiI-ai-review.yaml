taxon:
  id: NCBITaxon:94122
  label: Shewanella sp. ANA-3
description: >-
  ThiI of Shewanella sp. ANA-3 is a tRNA-uracil-4 sulfurtransferase of the
  gammaproteobacterial, rhodanese-containing type. It shares the E. coli architecture:
  N-terminal THUMP and ferredoxin-like tRNA-binding domains, a PP-loop (AANH) domain
  that adenylates U8, and a C-terminal rhodanese-like domain with the active-site
  persulfide cysteine (Cys458) and the redox partner cysteine (Cys346), equivalent to
  E. coli Cys456 and Cys344. By homology it makes 4-thiouridine at position 8 of
  tRNA, with sulfur from an IscS-type cysteine desulfurase. Through the rhodanese
  domain and its thiazole-specific C-terminal signature, it is also expected to supply
  sulfur to ThiS for thiazole synthesis. No experimental work exists on this protein;
  every function here is inferred from characterized orthologs.
