    summary: AMA1 directly encodes the alpha-amanitin core peptide; the mature bicyclic
      octapeptide is a potent RNA polymerase II-inhibiting toxin. Toxin activity is
      the core molecular function of the gene product (as for other peptide-toxin precursors).
      RETIRED - this keyword-mapping IEA row is no longer present in the current GOA
      snapshot (2026-10 refresh).
    action: ACCEPT
    reason: Gene-to-toxin link established by Hallen et al. 2007; toxicity mechanism
      established biochemically.
    supported_by:
