id: A8W7M4
gene_symbol: AMA1
taxon:
  id: NCBITaxon:87325
  label: Amanita bisporigera
description: AMA1 encodes the alpha-amanitin proprotein, a 35-residue precursor peptide
  that is the primary substrate for biosynthesis of one of nature's most deadly toxins.
  This MSDIN family gene produces a modular peptide with N-terminal leader (10 aa),
  core toxin (8 aa containing conserved IWGIGCNP motif), and C-terminal follower (17
  aa) regions. Following ribosomal synthesis, the precursor undergoes extensive post-translational
  modifications including proteolytic cleavage by prolyl oligopeptidase B (POPB),
  macrocyclization, and formation of a unique tryptathionine cross-bridge. The mature
  bicyclic octapeptide alpha-amanitin acts as a non-competitive inhibitor of RNA polymerase
  II, drastically slowing transcription elongation and causing fatal hepatotoxicity
  in humans upon mushroom ingestion.
