      supporting_text: Two genes in A. bisporigera, AMA1 and PHA1, directly encode alpha-amanitin,
        an amatoxin, and the related bicyclic heptapeptide phallacidin, a phallotoxin
    - reference_id: PMID:8702941
      supporting_text: The toxin alpha-amanitin is frequently employed to completely
        block RNA synthesis by RNA polymerase II.
