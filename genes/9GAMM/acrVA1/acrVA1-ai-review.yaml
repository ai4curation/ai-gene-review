knowledge_gaps:
- gap_statement: The natural host-element pairing is unestablished. Which mobile element carries acrVA1,
    and which Cas12a system it evolved against, are not determined, so the biological setting in which
    this counter-defence operates is unknown.
  boundary: >-
    Both the biochemistry and the structure were done with Cas12a orthologues chosen for their
    divergence and their use as genome-editing reagents, including enzymes from Lachnospiraceae and
    Acidaminococcus, not with a demonstrated natural host-element pair. An OpenScientist run
    (kgap-acrva1-host-element) answers the two halves of this gap differently: the mobile-element
    question is settled with direct sequence evidence, and the native pairing remains an inference but
    a far tighter one than this boundary assumed. On the element, the gene sits inside a roughly 55.8
    kb prophage on the Moraxella bovoculi 58069 chromosome, and the call rests on enumerated features
    rather than an impression: a tyrosine-type DNA recombinase 453 bp upstream of the gene, a second
    integrase at the element's far edge 147 bp from a tRNA-Val gene, a siphovirus structural module
    comprising tail proteins, tail tube, tail terminator, minor tail protein L, a 1,364-residue tape
    measure protein and a terminase, 55 of 60 coding sequences annotated only as hypothetical, a GC
    content of 43.26 per cent against a 45.52 per cent genomic mean, and codon usage further from the
    genome mean inside the element than outside, with this gene itself at the 94.8th percentile of
    codon deviation. The competing element types are excluded on evidence: no transposase within 92
    kb, no relaxase, mob gene or type IV secretion gene anywhere in the region, which rules out an
    integrative and conjugative element, and the element is chromosomal, which rules out a plasmid.
    The one piece missing is the attachment site, the longest exact direct repeat between the
    left-boundary and tRNA-Val windows being 14 bp and so within chance expectation, so the
    boundaries are inferred from gene content rather than delimited by sequence. On the pairing, the
    same chromosome carries a type V-A CRISPR-Cas locus about 1.57 Mb away whose Cas12a was deposited
    in 2015 as a hypothetical protein, which is why this strain looks CRISPR-free to a keyword search;
    downstream lie a Cas4-size endonuclease, an unannotated gap where cas1 is expected, cas2, and an
    array of 32 repeats carrying the type V-A handle with 31 spacers. Scanning all 31 spacers against
    the whole chromosome returns exactly four extra-array hits and all four fall inside this
    prophage, with spacer 16 matching perfectly behind a canonical TTTA protospacer-adjacent motif
    5.1 kb from this gene. A self-targeting, motif-licensed protospacer in the very element that
    encodes the inhibitor is about as close to a native host-element pair as comparative genomics
    reaches, and it supplies the ecological setting this gap asked for, though it remains an
    inference rather than a measured fitness effect, and the necessity test named in the resolution
    is still the experiment that would close it. Verified here against this entry's own record: the
    ORF name AAX09_07405 and the structure 6NMD both appear in the record, which independently
    confirms the locus tag the run assigns. One correction to the run: it gives the protein as 170
    residues, whereas this entry is 174 residues and the structure covers chain B residues 5 to 174,
    so 170 is the modelled length rather than the protein length. Not reproduced here: the genome
    coordinates and assembly identifiers, the prophage boundaries and feature inventory, the GC and
    codon-usage statistics, the CRISPR array parse and the spacer scan.
  gap_kind:
  - BIOLOGY
  status: NARROWING
  significance: Broad-spectrum inhibition across engineered orthologues is a reagent property. Whether
    AcrVA1 confers a fitness advantage on a mobile element challenged by a Cas12a system in its own ecological
    setting is a separate question, and it is the question that justifies the symbiont-mediated process
    term biologically rather than only mechanistically.
  resolution: Identify the element context of acrVA1 in the Moraxella bovoculi genome, then test whether
    deleting it costs that element persistence in a Cas12a-competent host, which is the necessity test
    that grounded the original anti-CRISPR assignments.
  provenance:
  - reference_id: PMID:30936531
    supporting_text: AcrVA1 blocked dsDNA cleavage by all three Cas12a orthologs
