  label: Moraxella bovoculi
description: AcrVA1 is a Moraxella bovoculi anti-CRISPR protein that binds Cas12a-crRNA complexes and
  inhibits type V-A CRISPR interference. It occupies the PAM-recognition region and promotes Cas12a-dependent
  endonucleolytic cleavage within the guide spacer. The released 3-prime spacer fragment leaves the 5-prime
  handle associated with Cas12a. Multiple turnover allows substoichiometric AcrVA1 to disable existing
  guide-loaded complexes. Inhibition has been demonstrated for several tested Cas12a orthologues; the
  native mobile-element context and physiological target remain less well established.
