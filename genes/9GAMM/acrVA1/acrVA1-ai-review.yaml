- term:
    id: GO:0004521
    label: RNA endonuclease activity
  evidence_type: IC
  original_reference_id: PMID:30936531
  qualifier: enables
  review:
    summary: In the presence of the Cas12a-crRNA complex, AcrVA1 drives endonucleolytic cleavage of
      the bound guide RNA within its spacer, with scissile phosphates mapped to positions five to
      eight, generating an intact 3-prime fragment that the effector then releases. The reaction is
      multiple-turnover and proceeds at sub-stoichiometric AcrVA1 concentrations, so it is catalytic
      rather than stoichiometric. The independent structural study states the same conclusion.
    action: NEW
    reason: Retain the previous conservative IC proposal for Cas12a-dependent RNA endonuclease
      activity. Knott et al. (PMID:30936531) explicitly left the catalytic component unassigned,
      whereas the independent Zhang et al. study (PMID:31155345) attributes cleavage to AcrVA1 and
      reports an RNase active site in helix alpha2. Thus an assertion that no candidate AcrVA1
      catalytic residues have been reported is outdated. Cleavage is conditional on the Cas12a-crRNA
      complex and does not establish autonomous RNase activity on free RNA. Knott et al. found that
      mutation of either known Cas12a nuclease centre (RuvC or pre-crRNA processing) did not prevent
      spacer truncation. Nevertheless, if AcrVA1 instead allosterically licenses another latent Cas12a
      RNase centre, Cas12a would perform the cleavage and AcrVA1 would be its activator; this
      alternative is why the molecular-function proposal remains IC rather than unqualified direct
      evidence of autonomous AcrVA1 catalysis.
    supported_by:
    - reference_id: PMID:30936531
      supporting_text: we show that AcrVA1 triggers multiple turnover endoribonucleolytic cleavage of
        a Cas12a-bound crRNA to truncate the spacer sequence and permanently inactivate the complex
    - reference_id: PMID:30936531
      supporting_text: we mapped the scissile phosphates at positions five to eight within the crRNA
        spacer
    - reference_id: PMID:31155345
      supporting_text: AcrVA1 cleaves crRNA in a Cas12a-dependent manner, inactivating Cas12a-crRNA
        complexes.
    - reference_id: PMID:30936531
      supporting_text: we targeted Cas12a’s nucleases for mutagenesis, the RuvC or pre-crRNA
        processing nuclease, and observed that mutation of either did not prevent AcrVA1-triggered
        spacer truncation
