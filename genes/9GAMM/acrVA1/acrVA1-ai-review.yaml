  review:
    summary: AcrVA1 acts on the Cas12a-crRNA complex, a cytoplasmic ribonucleoprotein
      of the bacterium whose CRISPR system it disables. All published work is on purified
      components or on structures determined in vitro, so the location is inferred
      from the identity of the target rather than measured.
    action: NEW
    reason: AcrVA1 is a mobile-element-encoded counter-defence protein acting on a
      host CRISPR effector, so the host-qualified component term is the appropriate
      one and matches the assignment used for the phage-encoded inhibitors AcrF8,
      gp30 and AcrF3. IC rather than IDA because no localization experiment exists.
      This is the weakest of the four rows proposed here, since the UniProt taxon
      is the bacterium Moraxella bovoculi rather than a phage, so which cell counts
      as the host depends on whether the gene is read as element-borne or chromosomal;
      a reviewer who takes the chromosomal reading should prefer GO:0005737 cytoplasm,
      as was done for the prophage-encoded AcrIIA4 and AcrIIC1 entries.
