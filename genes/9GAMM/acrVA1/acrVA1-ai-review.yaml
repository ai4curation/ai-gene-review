- term:
    id: GO:0004521
    label: RNA endonuclease activity
  evidence_type: IC
  original_reference_id: PMID:30936531
  qualifier: enables
  review:
    summary: In the presence of the Cas12a-crRNA complex, AcrVA1 drives endonucleolytic
      cleavage of the bound guide RNA within its spacer, with scissile phosphates
      mapped to positions five to eight, generating an intact 3-prime fragment that
      the effector then releases. The reaction is multiple-turnover and proceeds at
      sub-stoichiometric AcrVA1 concentrations, so it is catalytic rather than stoichiometric.
      The independent structural study states the same conclusion.
    action: NEW
    reason: Asserted because two independent groups report Cas12a-dependent endoribonucleolytic
      cleavage with multiple turnover, and the balance of published interpretation
      is that AcrVA1 is the nuclease. The assertion carries a real caveat, recorded
      here and as a knowledge gap rather than buried. Knott et al. state in terms
      that they could not identify which component bears the catalytic centre, and
      that AcrVA1 shows no detectable ribonuclease activity by itself; they did exclude
      the two known Cas12a nuclease centres, the RuvC domain and the pre-crRNA processing
      nuclease, by mutagenesis, so the obvious alternatives are ruled out without
      the AcrVA1 attribution being confirmed. If the unexcluded alternative is true,
      namely that AcrVA1 allosterically licenses a latent Cas12a ribonuclease, then
      this term belongs on Cas12a and AcrVA1 would instead be an enzyme activator.
      The evidence code on this row is IC rather than IDA for that reason. What the
      assays show directly is that crRNA is cleaved in the presence of AcrVA1, with
      multiple turnover and sub-stoichiometric inhibitor; attributing the catalysis to
      AcrVA1 rather than to a licensed Cas12a activity is a curator inference from that
      plus the exclusion of both Cas12a nuclease centres, not a direct demonstration.
      The primary work's own wording is "triggers", which is compatible with either
      reading. GO:0043021 carries the part that is certain.
      This review prompted a correction to modules/anti_crispr_suppression.yaml, which
      had asserted GO:0004521 for this annoton as a required_function and so made the
      unestablished attribution a membership criterion for the family. It now carries
      the term as a plain function with this catalyst caveat attached.
    supported_by:
    - reference_id: PMID:30936531
      supporting_text: we show that AcrVA1 triggers multiple turnover endoribonucleolytic
        cleavage of a Cas12a-bound crRNA to truncate the spacer sequence and permanently
        inactivate the complex
    - reference_id: PMID:30936531
      supporting_text: we mapped the scissile phosphates at positions five to eight
        within the crRNA spacer
    - reference_id: PMID:31155345
      supporting_text: AcrVA1 cleaves crRNA in a Cas12a-dependent manner, inactivating
        Cas12a-crRNA complexes.
