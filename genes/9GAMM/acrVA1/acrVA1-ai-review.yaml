  knowledge_gaps:
  - gap_statement: Which entity bears the catalytic centre for the crRNA cleavage
      is undetermined. The activity requires AcrVA1 and the Cas12a-crRNA complex together,
      and AcrVA1 alone has no detectable ribonuclease activity, so the alternative
      that AcrVA1 allosterically licenses a latent Cas12a ribonuclease has not been
      excluded.
    boundary: That the cleavage happens, where it happens in the spacer, what the
      end chemistry is, that it is metal-independent, and that it turns over are all
      established. The two known Cas12a nuclease centres, RuvC and the pre-crRNA processing
      nuclease, were excluded by mutagenesis, so neither obvious alternative survives
      either. What is missing is a positive identification of the catalyst.
    gap_kind:
    - BIOLOGY
    dark_aspect: MF_DARK
    status: OPEN
    significance: The whole classification of AcrVA1 turns on this. If AcrVA1 is the
      nuclease, GO:0004521 belongs on this gene product and AcrVA1 is the module's
      one genuinely catalytic anti-CRISPR. If AcrVA1 instead activates a cryptic Cas12a
      activity, GO:0004521 belongs on Cas12a and AcrVA1 is an enzyme activator, which
      would be a mechanism class the module does not currently have. The two readings
      make the same prediction for every experiment published so far.
    resolution: Identify catalytic residues on AcrVA1 by comprehensive mutagenesis
      of its conserved surface, looking for substitutions that abolish crRNA cleavage
      while preserving Cas12a binding, and test whether any chemically unrelated Cas12a
      surface can be mutated to the same effect. A separation-of-function AcrVA1 variant
      that binds but does not cleave would settle it in favour of AcrVA1 as the catalyst.
    provenance:
    - reference_id: PMID:30936531
      supporting_text: We demonstrated that the nuclease activity is entirely dependent
        on the presence of a Cas12a-crRNA complex and AcrVA1, but our data do not
        describe the identity of the component bearing the catalytic center for the
        observed nuclease activity. It is likely that AcrVA1 is an RNase, however
        we could not detect any RNase
    - reference_id: PMID:30936531
      supporting_text: AcrVA1 had no effect on the integrity of mature or pre-crRNA
        in the absence of Cas12a
knowledge_gaps:
- gap_statement: Which entity bears the catalytic centre for the crRNA cleavage that
    AcrVA1 causes is unestablished. AcrVA1 alone has no detectable ribonuclease activity,
    the primary work states that its data do not identify the component carrying the
    catalytic centre, and no catalytic residues have been reported in any study.
  boundary: That the crRNA is cleaved, with multiple turnover and sub-stoichiometric
    inhibitor, is established and is why GO:0004521 is asserted at all; both known Cas12a
    nuclease centres were excluded by mutagenesis, so the obvious alternatives are gone
    without the AcrVA1 attribution being confirmed. The unexcluded alternative is that
    AcrVA1 allosterically licenses a latent Cas12a ribonuclease, in which case GO:0004521
    belongs on Cas12a and AcrVA1 is an enzyme activator instead.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: The two readings put the same molecular function on different proteins
    and make AcrVA1 a different kind of anti-CRISPR, catalytic rather than activating.
    modules/anti_crispr_suppression.yaml carries no activator mechanism class, so the
    alternative reading would also add one.
  resolution: Identify catalytic residues in AcrVA1 by structure-guided mutagenesis and
    test whether a residue substitution abolishes cleavage without abolishing Cas12a
    binding; conversely test a catalytically dead Cas12a for loss of AcrVA1-dependent
    crRNA cleavage.
- gap_statement: The protein is unreviewed in UniProt, named only "AcrVA1" from a
    PDB deposition, and carries no GO annotations at all, despite a published mechanism
    the discovering authors called a mode of inhibition not previously observed for
    any anti-CRISPR protein.
  boundary: The mechanism class and the structural basis of binding are established
    by two independent studies. What is missing is any curated record of them on the
    accession.
  gap_kind:
  - CURATION
  status: OPEN
  significance: This is the same curation gap recorded in modules/anti_crispr_suppression.yaml
    for the AcrF3 and AcrIIC1 exemplars, and AcrVA1 is the worst instance of it in
    this round, since it is the only one of the three with zero GOA rows. The seeded
    review also inherited a wrong taxon identifier, NCBITaxon:9 for Buchnera aphidicola
    instead of NCBITaxon:386891 for Moraxella bovoculi, which has been corrected here.
  resolution: Nominate A0A5H1ZR47 for Swiss-Prot review with a FUNCTION line citing
    PMID:30936531 and PMID:31155345, and record the catalyst ambiguity in that line
    rather than asserting ribonuclease activity flatly.
  provenance:
  - reference_id: PMID:30936531
    supporting_text: Thus, AcrVA1 activity is multiple-turnover where cleavage of
      a crRNA will permanently inactivate Cas12a-crRNA complexes through a mode of
      inhibition not previously observed for any anti-CRISPR protein.
- gap_statement: The natural host-element pairing is unestablished. Which mobile element
    carries acrVA1, and which Cas12a system it evolved against, are not determined,
    so the biological setting in which this counter-defence operates is unknown.
  boundary: Both the biochemistry and the structure were done with Cas12a orthologues
    chosen for their divergence and their use as genome-editing reagents, including
    enzymes from Lachnospiraceae and Acidaminococcus, not with a demonstrated natural
    host-element pair.
  gap_kind:
  - BIOLOGY
  status: OPEN
  significance: Broad-spectrum inhibition across engineered orthologues is a reagent
    property. Whether AcrVA1 confers a fitness advantage on a mobile element challenged
    by a Cas12a system in its own ecological setting is a separate question, and it
    is the question that justifies the symbiont-mediated process term biologically
    rather than only mechanistically.
  resolution: Identify the element context of acrVA1 in the Moraxella bovoculi genome,
    then test whether deleting it costs that element persistence in a Cas12a-competent
    host, which is the necessity test that grounded the original anti-CRISPR assignments.
  provenance:
  - reference_id: PMID:30936531
    supporting_text: AcrVA1 blocked dsDNA cleavage by all three Cas12a orthologs
suggested_questions:
- question: Is AcrVA1 itself the nuclease, or does it license a cryptic ribonuclease
    activity of Cas12a? Every published experiment is consistent with both readings,
    and the two put the molecular function on different gene products.
  experts:
  - Gavin J. Knott
  - Jennifer A. Doudna
  - Leifu Chang
- question: AcrVA1 inserts into the PAM-binding pocket, which is where the DNA mimics
    AcrIIA4 and AcrIIA2 also act. Is the PAM pocket simply the most accessible route
    to the guide, or is there an element of nucleic acid mimicry in AcrVA1 that has
    not been looked for?
  experts:
  - Leifu Chang
- question: Guide destruction makes inhibition irreversible and catalytic. Does that
    predict that AcrVA1 is expressed at much lower levels than stoichiometric anti-CRISPRs
    in its native element, and is there any evidence of that?
  experts:
  - Joseph Bondy-Denomy
suggested_experiments:
- hypothesis: AcrVA1 bears the catalytic centre, so a variant exists that binds Cas12a-crRNA
    normally but cannot cleave the guide.
  description: Mutate every conserved surface residue of AcrVA1 individually and in
    small combinations, screen each variant for Cas12a-crRNA binding by size-exclusion
    chromatography or mass photometry and for crRNA truncation by denaturing PAGE,
    and look for the separation-of-function class. Recovering a bind-but-not-cleave
    variant would establish AcrVA1 as the nuclease and justify GO:0004521 on this
    gene product without caveat; failing to recover one after saturating the surface,
    while recovering such a variant from a Cas12a mutagenesis done in parallel, would
    move the term to Cas12a and reclassify AcrVA1 as an activator.
  experiment_type: separation-of-function mutagenesis
- hypothesis: The cleavage chemistry is that of a protein ribonuclease active site
    rather than a metal-independent in-line attack templated by the complex.
  description: Determine the end chemistry of both cleavage products precisely by
    mass spectrometry, test for the 2-prime-3-prime cyclic phosphate signature of
    general acid-base RNases, and attempt chemical rescue of candidate active-site
    mutants with imidazole, the approach that confirmed the catalytic histidine of
    the AcrIII-1 ring nuclease. Rescue by a small-molecule surrogate of a specific
    side chain would identify that side chain's owner.
  experiment_type: product end-chemistry and chemical rescue
- hypothesis: acrVA1 is required for its native mobile element to persist in a Cas12a-competent
    host.
  description: Locate acrVA1 in its genomic context in Moraxella bovoculi, construct
    an element lacking it, and compare retention and transfer frequency between hosts
    with an intact type V-A system and an isogenic cas12a deletion, with complementation
    in trans. This is the only experiment here that tests the biological role rather
    than the mechanism, and it is what would ground the symbiont-mediated process
    term in the organism's own ecology.
  experiment_type: element deletion and host-range retention assay
