references:
- id: PMID:30936531
  title: Broad-spectrum enzymatic inhibition of CRISPR-Cas12a.
  full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The enzymology paper, and the source of everything known about the mechanism beyond
      the structure. PubMed-verified. Two limitations are recorded rather than glossed. First, the methods
      give no accession for the AcrVA1 expression construct, saying only that it was made as described
      previously, so the accession-level attribution rests on both studies using the Moraxella bovoculi
      AcrVA1 and on PDB 6NMD mapping to this entry. Second, and more importantly, the paper itself declines
      to assign the catalytic centre, which is why the GO:0004521 row on this entry carries an explicit
      caveat.
  findings:
  - statement: AcrVA1 causes multiple-turnover destruction of the guide spacer in pre-existing Cas12a-crRNA
      complexes.
    supporting_text: AcrVA1 is a multiple-turnover inhibitor that triggers cleavage of the target-recognition
      sequence of the Cas12a-bound guide RNA to irreversibly inactivate the Cas12a complex.
    reference_section_type: ABSTRACT
  - statement: The cleavage is endoribonucleolytic, truncates the spacer, and permanently inactivates
      the complex
    supporting_text: we show that AcrVA1 triggers multiple turnover endoribonucleolytic cleavage of a
      Cas12a-bound crRNA to truncate the spacer sequence and permanently inactivate the complex
    reference_section_type: RESULTS
  - statement: Scissile phosphates lie at positions five to eight of the crRNA spacer
    supporting_text: we mapped the scissile phosphates at positions five to eight within the crRNA spacer
    reference_section_type: RESULTS
  - statement: Catalysis generates an intact 3-prime crRNA fragment that Cas12a then releases
    supporting_text: The activity is that of an endoribonuclease where catalysis generates an intact 3’-fragment
      of the crRNA that is released by Cas12a after AcrVA1-triggered truncation
    reference_section_type: RESULTS
  - statement: Inhibition is sub-stoichiometric and therefore catalytic, which is the basis for separating
      enzymatic from stoichiometric anti-CRISPRs
    supporting_text: Thus, AcrVA1 activity is multiple-turnover where cleavage of a crRNA will permanently
      inactivate Cas12a-crRNA complexes through a mode of inhibition not previously observed for any anti-CRISPR
      protein.
    reference_section_type: RESULTS
  - statement: Inhibition of double-stranded DNA cleavage extends across three divergent Cas12a orthologues
    supporting_text: AcrVA1 blocked dsDNA cleavage by all three Cas12a orthologs
    reference_section_type: RESULTS
  - statement: AcrVA1 also abolishes double-stranded DNA binding to Cas12a
    supporting_text: revealing that AcrVAs abolished dsDNA binding
    reference_section_type: RESULTS
  - statement: AcrVA1 has no ribonuclease activity on crRNA in the absence of Cas12a
    supporting_text: AcrVA1 had no effect on the integrity of mature or pre-crRNA in the absence of Cas12a
    reference_section_type: RESULTS
  - statement: The authors could not identify which component bears the catalytic centre, although they
      consider AcrVA1 the likely nuclease
    supporting_text: We demonstrated that the nuclease activity is entirely dependent on the presence
      of a Cas12a-crRNA complex and AcrVA1, but our data do not describe the identity of the component
      bearing the catalytic center for the observed nuclease activity. It is likely that AcrVA1 is an
      RNase, however we could not detect any RNase
    reference_section_type: DISCUSSION
