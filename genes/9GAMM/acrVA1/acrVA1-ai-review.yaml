knowledge_gaps:
- gap_statement: The natural host-element pairing is unestablished. Which mobile element carries acrVA1,
    and which Cas12a system it evolved against, are not determined, so the biological setting in which
    this counter-defence operates is unknown.
  boundary: Both the biochemistry and the structure were done with Cas12a orthologues chosen for their
    divergence and their use as genome-editing reagents, including enzymes from Lachnospiraceae and Acidaminococcus,
    not with a demonstrated natural host-element pair.
  gap_kind:
  - BIOLOGY
  status: OPEN
  significance: Broad-spectrum inhibition across engineered orthologues is a reagent property. Whether
    AcrVA1 confers a fitness advantage on a mobile element challenged by a Cas12a system in its own ecological
    setting is a separate question, and it is the question that justifies the symbiont-mediated process
    term biologically rather than only mechanistically.
  resolution: Identify the element context of acrVA1 in the Moraxella bovoculi genome, then test whether
    deleting it costs that element persistence in a Cas12a-competent host, which is the necessity test
    that grounded the original anti-CRISPR assignments.
  provenance:
  - reference_id: PMID:30936531
    supporting_text: AcrVA1 blocked dsDNA cleavage by all three Cas12a orthologs
suggested_questions:
- question: Which native mobile element carries this AcrVA1 and which Cas12a system selects for its activity
    in Moraxella bovoculi?
- question: How do the proposed helix-alpha2 catalytic residues distinguish chemical catalysis from positioning
    of the crRNA substrate in the Cas12a-bound complex?
suggested_experiments:
- description: Combine substrate-positioning structures, chemical rescue and binding-controlled mutagenesis
    of proposed AcrVA1 catalytic residues to distinguish direct chemical contributions from RNA positioning.
- description: Identify the native acrVA1 element and compare its persistence after acrVA1 deletion in
    matched Cas12a-positive and Cas12a-negative hosts.
