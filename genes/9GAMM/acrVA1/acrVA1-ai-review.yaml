id: A0A5H1ZR47
gene_symbol: acrVA1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:386891
  label: Moraxella bovoculi
description: AcrVA1 is a 174-residue protein of Moraxella bovoculi that inactivates
  type V-A CRISPR-Cas12a systems, and it is the one characterised anti-CRISPR mechanism
  that destroys a CRISPR component rather than occupying one. It binds the assembled
  Cas12a-crRNA ribonucleoprotein, wedging between the recognition and nuclease lobes
  of the enzyme and inserting into the pocket that reads the protospacer-adjacent motif,
  and this positioning is followed by endonucleolytic cleavage of the bound guide RNA
  within its spacer, between the fifth and eighth nucleotides. The truncated guide
  dissociates and leaves behind an effector that can no longer be programmed to any
  target, so inhibition is irreversible rather than reversible. Because the reaction
  turns over, a single inhibitor molecule disarms many effectors and inhibition is
  achieved at sub-stoichiometric concentrations, which distinguishes it sharply from
  the stoichiometric blockers that must be present in excess of their target. Inhibition
  extends across phylogenetically divergent Cas12a orthologues. The guide-cleaving
  activity appears only when inhibitor and effector complex are both present, and the
  protein shows no ribonuclease activity on its own.
