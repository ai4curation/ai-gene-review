  label: Moraxella bovoculi
description: AcrVA5 is a small acetyl-CoA-dependent protein lysine acetyltransferase encoded in Moraxella
  bovoculi mobile-element-associated genomic regions. It inhibits susceptible type V-A CRISPR-Cas12a effectors
  by acetylating a lysine required for PAM recognition, including Lys635 of MbCas12a, thereby preventing
  productive target-DNA binding and cleavage. Its covalent modification can be reversed by the CobB deacetylase.
  Biochemical work also shows Cas2 acetylation and disruption of Cas1–Cas2-mediated protospacer integration,
  extending its measured targets beyond interference. Broad protein acetylation after heterologous expression
  does not establish every modified protein as a physiological substrate.
