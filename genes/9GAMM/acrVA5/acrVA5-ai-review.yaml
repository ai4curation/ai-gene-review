suggested_questions:
- question: Which Cas2 and non-Cas protein acetylation targets contribute to AcrVA5 fitness effects in
    the native Moraxella mobile-element context? In-vitro Cas2 and heterologous global acetylation do
    not by themselves identify the physiological contribution of each target.
