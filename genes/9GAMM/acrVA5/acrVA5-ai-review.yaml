core_functions:
- description: Acetylates protein lysines using acetyl-CoA; modification of the Cas12a PAM-recognition
    lysine directly suppresses target-DNA binding and CRISPR interference. Susceptibility depends on the
    target lysine and effector context, and deacetylation can restore activity.
