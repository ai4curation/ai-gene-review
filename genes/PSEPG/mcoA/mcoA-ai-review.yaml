core_functions:
- description: Copper-dependent multicopper oxidase that oxidizes Mn(II), and free or
    ligand-complexed Mn(III), to insoluble Mn(III/IV) oxide, presumably coupling this to
    O2 reduction; one of two MCOs each sufficient for Mn oxidation in P. putida GB-1,
    contributing mainly at higher Mn(II) concentrations or where MnxG is limited. Activity
    is inferred from deletion genetics and family membership; the enzyme has not been
    purified.
  proposed_molecular_function: manganese oxidase activity
  supported_by:
  - reference_id: PMID:23124227
    supporting_text: These results suggest that PputGB1_2447 and PputGB1_2665 encode two
      MCOs that are independently capable of oxidizing both Mn(II) and Mn(III).
  - reference_id: PMID:40122939
    supporting_text: McoA contributes to biomineralization under conditions where MnxG activity is restricted.
knowledge_gaps:
- gap_statement: P. putida GB-1 McoA has never been purified, so its copper stoichiometry
    and the number and type of its copper centres are unmeasured, as are its Mn(II) and
    Mn(III) oxidation kinetics (kcat, Km, any substrate inhibition).
  boundary: Deletion genetics establish that McoA alone is sufficient for Mn(II) and Mn(III)
    oxidation in vivo, and Pfam PF07731 plus the PTHR48267:SF1 assignment place it among
    three-domain multicopper oxidases; the GB-1 review counts four conserved copper-binding
    domains. No enzyme has been isolated from GB-1.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: The activity asserted here (GO:0016724, and the proposed manganese oxidase
    activity) rests entirely on genetic sufficiency plus family membership; without enzyme
    data the copper dependence is an inference, and the claim that McoA relieves MnxG
    substrate inhibition at high Mn(II) cannot be grounded in measured affinities.
  resolution: Heterologous expression and purification of GB-1 McoA with copper and kinetic
    characterization, compared with MnxG (see suggested_experiments).
  provenance:
  - reference_id: PMID:42757987
    supporting_text: While the biochemical characteristics of MnxG and McoA from P. putida GB-1 have not been investigated
- gap_statement: Where McoA resides and acts - and whether its hydrophobic N-terminal segment
    is a cleaved Sec signal peptide or an uncleaved membrane anchor - has not been determined
    experimentally.
  boundary: Mn oxides accumulate extracellularly and the GB-1 review reports an N-terminal
    Sec signal peptide, while Phobius calls the same segment a transmembrane helix (residues
    12-33); no fractionation, N-terminal sequencing or tagged-protein localization of McoA
    has been reported.
  gap_kind:
  - BIOLOGY
  dark_aspect: CC_DARK
  status: OPEN
  significance: No cellular component annotation can be made for this protein until the
    compartment is established, and the topology decides whether Mn(II) is oxidized in the
    periplasm or outside the cell.
  resolution: N-terminal sequencing or fractionation of epitope-tagged McoA (see
    suggested_experiments).
  provenance:
  - reference_id: PMID:27084014
    supporting_text: the cellular localization of MnxG and McoA is unknown, although the proteins are likely exported
- gap_statement: Whether P. putida GB-1 McoA needs accessory subunits for activity -
    analogous to the hexameric MnxE3F3 ring that caps Bacillus MnxG - or instead works
    cooperatively with MnxG in the same cells, is unknown.
  boundary: The Bacillus Mnx complex is structurally defined as MnxG capped by alternating
    MnxE and MnxF subunits; in P. putida the wild type oxidizes Mn faster than either single
    deletion strain, and reporter fusions show mnxG and mcoA are induced in different cell
    subpopulations, so cooperation within a cell is consistent with the data but not
    established; the review that raises the question states it needs further investigation.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: It decides whether the activity should be asserted with enables or
    contributes_to, and whether a protein complex term applies.
  resolution: Purification of McoA with and without candidate partners, and co-localization
    or interaction assays with MnxG (see suggested_experiments).
  provenance:
  - reference_id: PMID:42757987
    supporting_text: The structure of the Bacillus Mnx complex raises the question of whether accessory proteins are needed for activity of the MCOs in pseudomonads or whether MnxG and McoA are colocalized and work cooperatively.
proposed_new_terms:
- proposed_name: manganese oxidase activity
  proposed_definition: 'Catalysis of the reaction: 2 Mn(2+) + O2 + 2 H2O = 2 MnO2 + 4 H(+),
    in which soluble Mn(II) is oxidized to insoluble manganese(IV) oxide with molecular oxygen
    as electron acceptor.'
  justification: EC 1.16.3.3 (manganese oxidase; systematic name manganese(II):oxygen
    oxidoreductase), a multicopper-oxidase activity found in many Mn(II)-oxidizing bacteria,
    has no GO term; ec2go maps only EC 1.16.3.1 (ferroxidase) and the generic EC 1.16.3.-
    parent GO:0016724. Bacterial Mn(II)-oxidizing MCOs (Bacillus MnxG, P. putida GB-1 MnxG
    and McoA, Leptothrix MofA, Pedomicrobium MoxA) can currently only be annotated to the
    generic parent; the EC entry lists mnxG, mofA, moxA and cotA among its gene names.
    The definition above states the reaction only. Mechanism is stated separately -
    multicopper oxidases transfer electrons one at a time, so Mn(III) is an intermediate and not the
    product. ExplorEnz accordingly writes the overall reaction 4 Mn(2+) + 2 O2 + 4 H2O =
    4 Mn(IV)O2 + 8 H(+) as the sum of a Mn(II) -> Mn(III) and a Mn(III) -> Mn(IV) step, and
    the Bacillus Mnx structure shows sequential one-electron oxidations ending in MnO2.
    Distinct from GO:0016689 manganese peroxidase activity, which uses H2O2.
  proposed_parent:
    id: GO:0016724
    label: oxidoreductase activity, acting on metal ions, oxygen as acceptor
  supported_by:
  - reference_id: PMID:42757987
    supporting_text: which employ multiple copper centers to transfer electrons one by one (50) from the substrate (Mn) to molecular oxygen.
  - reference_id: PMID:42757987
    supporting_text: Sequential one-electron oxidation reactions occur along the tunnel, with Mn(IV) ultimately condensing into MnO2 nanoparticles
suggested_questions:
- question: Is the N-terminal hydrophobic segment of McoA (Phobius transmembrane helix
    12-33) a cleaved Sec signal peptide or an uncleaved membrane anchor, and where does
    McoA act relative to the cell surface oxides?
- question: Do McoA and MnxG act cooperatively (as suggested by the higher Mn oxidation
    rate of the wild type than of either single mutant), or in different cells?
suggested_experiments:
- description: Heterologous expression and purification of McoA to determine copper
    content and Mn(II)/Mn(III) oxidation kinetics, and comparison of its Mn(II) affinity
    and substrate inhibition with MnxG.
- description: N-terminal sequencing or fractionation of epitope-tagged McoA to test
    signal-peptide cleavage and localization (periplasm, outer membrane, supernatant).
