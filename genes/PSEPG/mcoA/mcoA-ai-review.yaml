      oxidases - CotA laccases, E. coli CueO and FtsP/SufI. The GB-1 review describes four
      conserved copper-binding domains in McoA. Its genetically established Mn oxidase
      activity depends on these centres. No direct copper measurement exists for this
      protein, but the subfamily-level inference is strong.
