gene_symbol: mcoA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:76869
  label: Pseudomonas putida GB-1
description: McoA (locus PputGB1_2665) is a 1,131-aa multicopper oxidase of the
  manganese-oxidizing bacterium Pseudomonas putida GB-1. It has a hydrophobic N-terminal
  segment, described as a Sec signal peptide, a bacterial Ig-like (Big_9) region, and
  C-terminal cupredoxin domains with multicopper oxidase copper-binding motifs whose
  arrangement differs from that of the second GB-1 Mn-oxidizing multicopper oxidase, MnxG.
  Genetic analysis shows that McoA and MnxG are each sufficient for oxidation of soluble
  Mn(II), and of free or ligand-complexed Mn(III), to insoluble Mn(III/IV) oxides, and
  only deletion of both abolishes oxidation under standard conditions; the unrelated
  secreted heme peroxidase MopA is a third, conditional Mn oxidase. mcoA is positively
  regulated by MnxR and is activated at higher Mn(II) concentrations than mnxG, in a
  subset of cells, so that McoA contributes to Mn oxide biomineralization where MnxG
  activity is saturated or inhibited. The purified enzyme has not been characterized and
  its cellular location has not been determined directly.
