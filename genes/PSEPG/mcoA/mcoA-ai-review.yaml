- term:
    id: GO:0016491
    label: oxidoreductase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR011706
  review:
    summary: InterPro2GO transfer of the generic oxidoreductase term from the multicopper
      oxidase C-terminal domain.
    action: MODIFY
    reason: Correct but too general. Deletion genetics show McoA is independently sufficient
      for oxidation of Mn(II) and Mn(III) in GB-1, and strains retaining only McoA oxidize
      Mn(III)-citrate and Mn(III)-DFOB. Multicopper oxidases transfer substrate electrons to
      O2, so the supported specific descendant is GO:0016724 oxidoreductase activity, acting
      on metal ions, oxygen as acceptor (the GO parent of EC 1.16.3.-). A more specific
      "manganese oxidase activity" (EC 1.16.3.3) has no GO term and is proposed in
      proposed_new_terms; the evidence is genetic, not from purified enzyme.
    proposed_replacement_terms:
    - id: GO:0016724
      label: oxidoreductase activity, acting on metal ions, oxygen as acceptor
    supported_by:
    - reference_id: PMID:23124227
      supporting_text: These results suggest that PputGB1_2447 and PputGB1_2665 encode two
        MCOs that are independently capable of oxidizing both Mn(II) and Mn(III).
    - reference_id: PMID:29706936
      supporting_text: mutants expressing only MnxG
        and McoA were able to directly oxidize both species at varying levels
    - reference_id: PMID:42757987
      supporting_text: which employ multiple copper centers to transfer electrons one by one (50) from the substrate (Mn) to molecular oxygen.
