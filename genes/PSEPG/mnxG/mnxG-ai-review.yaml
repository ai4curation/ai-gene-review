core_functions:
- description: Copper-dependent multicopper oxidase that oxidizes Mn(II), and free or
    ligand-complexed Mn(III), to insoluble Mn(IV) oxide, presumably coupling this to
    O2 reduction; one of two MCOs that are each sufficient for Mn oxidation in P. putida
    GB-1, and the one responsible for initial oxide precipitation at low Mn(II). Activity
    is inferred from deletion genetics and family membership; the enzyme has not been
    purified.
  proposed_molecular_function: manganese oxidase activity
  supported_by:
  - reference_id: PMID:23124227
    supporting_text: These results suggest that PputGB1_2447 and PputGB1_2665 encode two
      MCOs that are independently capable of oxidizing both Mn(II) and Mn(III).
  - reference_id: PMID:40122939
    supporting_text: we find that MnxG is responsible for the initial precipitation of Mn oxides
knowledge_gaps:
- gap_statement: P. putida GB-1 MnxG has never been purified, so its copper stoichiometry
    and the number and type of its copper centres are unmeasured, as are its Mn(II) and
    Mn(III) oxidation kinetics (kcat, Km, any substrate inhibition).
  boundary: Deletion genetics establish that MnxG alone is sufficient for Mn(II) and Mn(III)
    oxidation in vivo, and signature matches (PROSITE PS00080, NCBIfam NF041487, IPR048215)
    establish multicopper oxidase family membership. MnxG of Bacillus sp. PL-12 has been
    fully characterized and is the model for how the P. putida enzyme may work.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: The activity asserted here (GO:0016724, and the proposed manganese oxidase
    activity) rests entirely on genetic sufficiency plus family membership; without enzyme
    data the copper dependence is an inference and the kinetic basis of the division of
    labour with McoA cannot be tested.
  resolution: Heterologous expression and purification of GB-1 MnxG with copper and kinetic
    characterization (see suggested_experiments).
  provenance:
  - reference_id: PMID:42757987
    supporting_text: While the biochemical characteristics of MnxG and McoA from P. putida GB-1 have not been investigated
- gap_statement: Where MnxG resides and acts after Sec export - periplasm, outer membrane,
    cell surface or culture supernatant - has not been determined experimentally.
  boundary: Mn oxides accumulate extracellularly, MnxG carries an N-terminal Sec signal
    peptide, and transposon mutants implicate a type II secretion system in export of the
    oxidases; no fractionation or tagged-protein localization of MnxG itself has been reported.
  gap_kind:
  - BIOLOGY
  dark_aspect: CC_DARK
  status: OPEN
  significance: No cellular component annotation can be made for this protein until the
    compartment is established, and the site of oxidation determines whether copper loading
    and Mn(II) access occur in the periplasm or outside the cell.
  resolution: Fractionation or epitope-tagged localization in wild-type and T2SS mutant
    backgrounds (see suggested_experiments).
  provenance:
  - reference_id: PMID:27084014
    supporting_text: the cellular localization of MnxG and McoA is unknown, although the proteins are likely exported
- gap_statement: Whether P. putida GB-1 MnxG needs accessory subunits for activity -
    analogous to the hexameric MnxE3F3 ring that caps Bacillus MnxG - or instead works
    cooperatively with McoA, is unknown.
  boundary: The Bacillus Mnx complex is structurally defined as MnxG capped by alternating
    MnxE and MnxF subunits; in P. putida the wild type oxidizes Mn faster than either single
    deletion strain, which is consistent with cooperation but does not establish it; the
    review that raises the question states it needs further investigation.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: It decides whether the activity should be asserted with enables or
    contributes_to, and whether a protein complex term applies.
  resolution: Purification of MnxG with and without candidate partners from the mnxG operon,
    and co-localization or interaction assays with McoA (see suggested_experiments).
  provenance:
  - reference_id: PMID:42757987
    supporting_text: The structure of the Bacillus Mnx complex raises the question of whether accessory proteins are needed for activity of the MCOs in pseudomonads or whether MnxG and McoA are colocalized and work cooperatively.
proposed_new_terms:
- proposed_name: manganese oxidase activity
  proposed_definition: 'Catalysis of the reaction: 4 Mn(2+) + 2 O2 + 4 H2O = 4 Mn(IV)O2 + 8 H(+),
    in which soluble Mn(II) is oxidized to insoluble manganese(IV) oxide with molecular oxygen
    as electron acceptor.'
  justification: EC 1.16.3.3 (manganese oxidase; systematic name manganese(II):oxygen
    oxidoreductase), a multicopper-oxidase activity found in many Mn(II)-oxidizing bacteria,
    has no GO term; ec2go maps only EC 1.16.3.1 (ferroxidase) and the generic EC 1.16.3.-
    parent GO:0016724. Bacterial Mn(II)-oxidizing MCOs (Bacillus MnxG, P. putida GB-1 MnxG
    and McoA, Leptothrix MofA, Pedomicrobium MoxA) can currently only be annotated to the
    generic parent; the EC entry lists mnxG, mofA, moxA and cotA among its gene names.
    The definition above states the reaction only, in the canonical overall form used by the
    ExplorEnz entry. Mechanism is stated separately - multicopper oxidases transfer electrons
    one at a time, so Mn(III) is an intermediate and not the product. ExplorEnz accordingly
    gives that overall reaction as the sum of a Mn(II) -> Mn(III) step (1a) and a
    Mn(III) -> Mn(IV) step (1b), and the Bacillus Mnx structure shows sequential one-electron
    oxidations ending in MnO2.
    Distinct from GO:0016689 manganese peroxidase activity, which uses H2O2.
  proposed_parent:
    id: GO:0016724
    label: oxidoreductase activity, acting on metal ions, oxygen as acceptor
  supported_by:
  - reference_id: PMID:42757987
    supporting_text: which employ multiple copper centers to transfer electrons one by one (50) from the substrate (Mn) to molecular oxygen.
  - reference_id: PMID:42757987
    supporting_text: Sequential one-electron oxidation reactions occur along the tunnel, with Mn(IV) ultimately condensing into MnO2 nanoparticles
suggested_questions:
- question: Does P. putida GB-1 MnxG require accessory proteins (analogous to Bacillus MnxE/MnxF)
    for activity, and does it act cooperatively with McoA?
- question: Where does MnxG reside after Sec export (periplasm, outer membrane, cell surface),
    and is the type II secretion pathway required for its surface display?
suggested_experiments:
- description: Heterologous expression and purification of P. putida GB-1 MnxG (with
    candidate partners from the mnxG operon, including the SCO1/SenC-like copper chaperone)
    to measure copper content and Mn(II) and Mn(III) oxidation kinetics directly.
- description: Fractionation (periplasm, outer membrane, culture supernatant) or epitope-tagged
    localization of MnxG in wild-type and T2SS mutant backgrounds.
