- term:
    id: GO:0016724
    label: oxidoreductase activity, acting on metal ions, oxygen as acceptor
  evidence_type: IMP
  original_reference_id: PMID:23124227
  review:
    summary: Proposed MF annotation capturing the Mn(II)/Mn(III) oxidase activity of MnxG,
      the parent class of EC 1.16.3.3 (manganese oxidase), which has no specific GO term.
    action: NEW
    reason: In-frame deletion analysis showed that PputGB1_2447 (MnxG) and PputGB1_2665
      (McoA) are each independently sufficient for Mn(II) and Mn(III) oxidation and that
      only the double deletion abolishes it. Strains retaining only MnxG (mcoA and mopA
      deleted) still oxidize Mn(III)-citrate and Mn(III)-DFOB. Combined with MnxG membership
      of the multicopper oxidase family, whose members use O2 as electron acceptor, this
      supports oxidation of a metal ion with oxygen as acceptor. The evidence is genetic;
      the P. putida protein has not been purified and assayed, so a more specific
      "manganese oxidase activity" term is proposed in proposed_new_terms rather than
      asserted here.
    supported_by:
    - reference_id: PMID:23124227
      supporting_text: In-frame deletions of each locus resulted in strains that retained some ability to
        oxidize Mn(II) or Mn(III); loss of oxidation was attained only upon deletion of
        both genes. These results suggest that PputGB1_2447 and PputGB1_2665 encode two
        MCOs that are independently capable of oxidizing both Mn(II) and Mn(III).
    - reference_id: PMID:29706936
      supporting_text: mutants expressing only MnxG
        and McoA were able to directly oxidize both species at varying levels
    - reference_id: PMID:42757987
      supporting_text: which employ multiple copper centers to transfer electrons one by one (50) from the substrate (Mn) to molecular oxygen.
