core_functions:
- description: Copper-dependent multicopper oxidase that oxidizes Mn(II), and free or
    ligand-complexed Mn(III), to insoluble Mn(III/IV) oxide, presumably coupling this to
    O2 reduction; one of two MCOs that are each sufficient for Mn oxidation in P. putida
    GB-1, and the one responsible for initial oxide precipitation at low Mn(II). Activity
    is inferred from deletion genetics and family membership; the enzyme has not been
    purified.
  proposed_molecular_function: manganese oxidase activity
  supported_by:
  - reference_id: PMID:23124227
    supporting_text: These results suggest that PputGB1_2447 and PputGB1_2665 encode two
      MCOs that are independently capable of oxidizing both Mn(II) and Mn(III).
  - reference_id: PMID:40122939
    supporting_text: we find that MnxG is responsible for the initial precipitation of Mn oxides
proposed_new_terms:
- proposed_name: manganese oxidase activity
  proposed_definition: 'Catalysis of the reaction: 2 Mn(2+) + O2 + 2 H2O = 2 MnO2 + 4 H(+),
    proceeding through Mn(III) intermediates, in which soluble Mn(II) is oxidized to insoluble
    manganese(III/IV) oxide with molecular oxygen as electron acceptor.'
  justification: EC 1.16.3.3 (manganese oxidase), a multicopper-oxidase activity found in
    many Mn(II)-oxidizing bacteria, has no GO term; ec2go maps only EC 1.16.3.1 (ferroxidase)
    and the generic EC 1.16.3.- parent GO:0016724. Bacterial Mn(II)-oxidizing MCOs (Bacillus
    MnxG, P. putida GB-1 MnxG and McoA, Leptothrix MofA, Pedomicrobium MoxA) can currently
    only be annotated to the generic parent. Distinct from GO:0016689 manganese peroxidase
    activity, which uses H2O2.
  proposed_parent:
    id: GO:0016724
    label: oxidoreductase activity, acting on metal ions, oxygen as acceptor
  supported_by:
  - reference_id: PMID:42757987
    supporting_text: which employ multiple copper centers to transfer electrons one by one (50) from the substrate (Mn) to molecular oxygen.
suggested_questions:
- question: Does P. putida GB-1 MnxG require accessory proteins (analogous to Bacillus MnxE/MnxF)
    for activity, and does it act cooperatively with McoA?
- question: Where does MnxG reside after Sec export (periplasm, outer membrane, cell surface),
    and is the type II secretion pathway required for its surface display?
suggested_experiments:
- description: Heterologous expression and purification of P. putida GB-1 MnxG (with
    candidate partners from the mnxG operon, including the SCO1/SenC-like copper chaperone)
    to measure copper content and Mn(II) and Mn(III) oxidation kinetics directly.
- description: Fractionation (periplasm, outer membrane, culture supernatant) or epitope-tagged
    localization of MnxG in wild-type and T2SS mutant backgrounds.
