id: B0KQT1
gene_symbol: mnxG
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:76869
  label: Pseudomonas putida GB-1
description: MnxG (locus PputGB1_2447) is a large (1,944 aa) multicopper oxidase of the
  manganese-oxidizing bacterium Pseudomonas putida GB-1, distantly related to the MnxG
  catalytic subunit of the Bacillus sp. PL-12 Mnx complex. It carries an N-terminal Sec
  signal peptide and multiple cupredoxin domains with conserved multicopper oxidase
  copper-binding motifs. Genetic analysis shows that MnxG is one of two multicopper oxidases
  (with McoA, PputGB1_2665) that are each sufficient for oxidation of soluble Mn(II), and of
  free or ligand-complexed Mn(III), to insoluble Mn(IV) oxides; only deletion of both
  genes abolishes oxidation under standard conditions, while a third, unrelated enzyme
  (the secreted animal heme peroxidase MopA) contributes only in particular genetic
  backgrounds. mnxG expression is positively controlled by the MnxS1/MnxS2-MnxR
  two-component system and is activated at low Mn(II) concentrations in a subset of cells;
  MnxG appears to be responsible for the initial precipitation of Mn oxides, which
  accumulate on the cell surface. The purified P. putida enzyme has not been characterized
  biochemically, and its cellular location has not been determined directly.
