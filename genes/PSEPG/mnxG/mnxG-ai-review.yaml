    action: ACCEPT
    reason: Copper binding is intrinsic to the multicopper oxidase mechanism (substrate
      oxidation at the type 1 copper and O2 reduction at the trinuclear cluster). MnxG matches
      the multicopper oxidase copper-binding signature and the MnxG-like family, and the
      review of GB-1 Mn oxidases describes multiple conserved copper-binding domains in MnxG.
      Its Mn(II) oxidase activity, established genetically, requires these copper centres.
      No direct copper measurement has been made on the P. putida protein, but the
      family-level inference is strong and the term is at an appropriate level.
