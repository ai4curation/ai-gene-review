- term:
    id: GO:0015977
    label: carbon fixation
  evidence_type: IDA
  original_reference_id: PMID:17041055
  review:
    summary: MCR catalyses the reduction of malonyl-CoA and of succinyl-CoA, two reductive
      steps of the 3-hydroxypropionate/4-hydroxybutyrate autotrophic CO2-fixation cycle
      of M. sedula. Its activity is about 10-fold induced under autotrophic growth.
    action: NEW
    reason: The enzyme performs two of the cycle's steps directly, so it passes the participation
      test. The comparable enzymes are other catalytic steps of autotrophic carbon-fixation
      cycles, such as RuBisCO and the 3-hydroxypropionate-cycle enzymes, which are annotated
      to carbon-fixation terms. GO:0043427 carbon fixation by 3-hydroxypropionate cycle
      is defined as the Chloroflexus glyoxylate-forming cycle, a different pathway that
      uses an unrelated malonyl-CoA reductase. It is therefore not used here, and a specific
      3HP/4HB-cycle child term is proposed. The parent term GO:0015977 is the most precise
      correct existing term.
    supported_by:
    - reference_id: PMID:17041055
      supporting_text: Extracts of Metallosphaera sedula contained NADPH-specific malonyl-CoA
        reductase activity that was 10-fold up-regulated under autotrophic growth conditions.
    - reference_id: PMID:18079405
      supporting_text: We discovered that an autotrophic member of the archaeal order Sulfolobales,
        Metallosphaera sedula, fixed CO2 with acetyl-coenzyme A (acetyl-CoA)/propionyl-CoA
        carboxylase as the key carboxylating enzyme.
    - reference_id: PMID:19684143
      supporting_text: Succinyl-CoA reduction to succinic semialdehyde is catalyzed by
        malonyl-CoA/succinyl-CoA reductase, a promiscuous NADPH-dependent enzyme that is
        a paralogue of aspartate semialdehyde dehydrogenase.
