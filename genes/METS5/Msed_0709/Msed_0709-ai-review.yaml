  review:
    summary: TreeGrafter transfer of the ancestral aspartate-semialdehyde dehydrogenase
      (ASD) activity from the PANTHER PTHR46718 node onto MCR, a neofunctionalized ASD
      paralog.
    action: REMOVE
    reason: Msed_0709 is the malonyl-CoA/succinyl-CoA reductase, identified by purification
      from M. sedula and by peptide mass fingerprinting (PMID:17041055, PMID:19684143).
      It shares only about 40% identity with ASD, and the genuine asd gene of Sulfolobales
      sits elsewhere in the genome next to threonine synthase and aspartokinase genes
      (PMID:23325803). In M. sedula that paralog is Msed_1700 (A4YHF3), which neighbours
      Msed_1698 threonine synthase and Msed_1699 aspartokinase and matches the archaeal/fungal
      ASD CDD models (cd18130, cd02315), whereas Msed_0709 matches the MCR-type models (cd23940,
      cd24150). Both paralogs carry NCBIfam TIGR00978 (asd_EA), so that signature does not
      separate them (see genes/METS5/Msed_1700/Msed_1700-bioinformatics/RESULTS.md). Structural
      analysis of the ortholog shows the substrate pocket was remodelled to accommodate
      malonyl/succinyl groups that lack the ammonium group of aspartate. No ASD activity
      has been reported for MCR. The PANTHER subfamily (SF1) does not separate the MCR
      clade from true ASDs, so the ancestral activity is propagated to the
      neofunctionalized paralog. This is a paralog over-annotation.
    supported_by:
    - reference_id: PMID:23325803
      supporting_text: The two paralogous MCR and ASD enzymes show ∼40% amino acid sequence
        identity in the same organism, and their genes mcr and asd have different chromosomal
        locations.
    - reference_id: PMID:23325803
      supporting_text: The asd gene clusters together with threonine synthase, aspartokinase,
        and ornithine carbamoyltransferase, among other genes, which is in line with its
        role in the biosynthesis of amino acids of the aspartate family.
    - reference_id: PMID:23325803
      supporting_text: The modified polypeptide surrounding around the absent ammonium
        group in malonate/succinate compared with aspartate provides the structural basis
        for engineering a methylmalonyl-CoA reductase
    - reference_id: PMID:19684143
      supporting_text: Succinyl-CoA reduction to succinic semialdehyde is catalyzed by
        malonyl-CoA/succinyl-CoA reductase, a promiscuous NADPH-dependent enzyme that is
        a paralogue of aspartate semialdehyde dehydrogenase.
