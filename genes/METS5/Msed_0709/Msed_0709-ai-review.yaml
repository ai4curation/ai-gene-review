proposed_new_terms:
- proposed_name: malonyl-CoA reductase (NADP+) activity
  proposed_definition: 'Catalysis of the reaction: malonyl-CoA + NADPH + H+ = 3-oxopropanoate
    (malonate semialdehyde) + CoA + NADP+.'
  justification: This is EC 1.2.1.75 (RHEA:26446), and GO has no term for it; ec2go
    has no mapping for EC 1.2.1.75. GO:0018478 (EC 1.2.1.18) is a different, decarboxylating
    reaction. The activity is the key reductive step of the 3-hydroxypropionate/4-hydroxybutyrate
    cycle in Sulfolobales. Any new term should also cover the unrelated Chloroflexus enzyme's
    first half-reaction.
  proposed_parent:
    id: GO:0016620
    label: oxidoreductase activity, acting on the aldehyde or oxo group of donors, NAD
      or NADP as acceptor
  supported_by:
  - reference_id: PMID:17041055
    supporting_text: 'The enzyme catalyzes the following reaction: malonyl-CoA + NADPH
      + H+ --> malonate-semialdehyde + CoA + NADP+.'
- proposed_name: succinyl-CoA reductase (NADP+) activity
  proposed_definition: 'Catalysis of the reaction: succinyl-CoA + NADPH + H+ = succinate
    semialdehyde + CoA + NADP+.'
  justification: This is EC 1.2.1.76, succinate-semialdehyde dehydrogenase (acylating),
    and GO has no term for it. Existing succinate-semialdehyde dehydrogenase terms (GO:0009013,
    GO:0036243) describe the non-acylating reaction that forms succinate. The activity
    is required in the 3-hydroxypropionate/4-hydroxybutyrate and dicarboxylate/4-hydroxybutyrate
    cycles.
  proposed_parent:
    id: GO:0016620
    label: oxidoreductase activity, acting on the aldehyde or oxo group of donors, NAD
      or NADP as acceptor
  supported_by:
  - reference_id: PMID:19684143
    supporting_text: Succinyl-CoA reduction to succinic semialdehyde is catalyzed by
      malonyl-CoA/succinyl-CoA reductase, a promiscuous NADPH-dependent enzyme that is
      a paralogue of aspartate semialdehyde dehydrogenase.
- proposed_name: carbon fixation by 3-hydroxypropionate/4-hydroxybutyrate cycle
  proposed_definition: An autotrophic carbon dioxide fixation pathway in which acetyl-CoA
    is carboxylated twice by acetyl-CoA/propionyl-CoA carboxylase, and the products are
    reductively converted via 3-hydroxypropionate and succinyl-CoA to 4-hydroxybutyrate.
    4-Hydroxybutyrate is then converted via 4-hydroxybutyryl-CoA dehydratase into two
    molecules of acetyl-CoA. The pathway occurs in autotrophic Sulfolobales and in
    ammonia-oxidizing Thaumarchaeota.
  justification: GO:0043427 carbon fixation by 3-hydroxypropionate cycle is defined
    as the Chloroflexus cycle that releases glyoxylate via malyl-CoA cleavage. The archaeal
    3HP/4HB cycle shares only the first half and regenerates acetyl-CoA via 4-hydroxybutyrate,
    so its enzymes currently have no specific process term.
  proposed_parent:
    id: GO:0015977
    label: carbon fixation
  supported_by:
  - reference_id: PMID:18079405
    supporting_text: This intermediate was reduced to 4-hydroxybutyrate and converted
      into two acetyl-CoA molecules via 4-hydroxybutyryl-CoA dehydratase.
suggested_questions:
- question: Does MCR retain any residual aspartate-semialdehyde dehydrogenase activity,
    and conversely does the true ASD paralog Msed_1700 (A4YHF3, which ARBA names a malonyl-CoA
    reductase) have any malonyl-CoA or succinyl-CoA reductase activity?
- question: Should PANTHER PTHR46718 be split so that the Sulfolobales MCR clade forms
    its own subfamily? That would stop TreeGrafter propagating ASD activity and threonine
    biosynthesis to MCR orthologs.
- question: What is the physiological significance, if any, of the small RNA that co-purifies
    with native MCR?
suggested_experiments:
- hypothesis: Msed_0709 is required for autotrophic but not heterotrophic growth of Metallosphaera
    sedula.
  description: Construct a Msed_0709 deletion, for example with a Sulfolobales genetic
    system, and compare growth on CO2/H2 with growth on yeast extract or peptides. Test
    complementation with Msed_0709 and with the ASD paralog Msed_1700.
- hypothesis: The MCR and ASD paralogs have non-overlapping substrate specificities.
  description: Purify recombinant Msed_0709 and Msed_1700. Assay both with malonyl-CoA,
    succinyl-CoA and L-aspartyl-4-phosphate (forward direction), and with aspartate
    semialdehyde (reverse direction), and determine kcat/Km for each pair.
