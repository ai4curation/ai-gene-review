id: A4YEN2
gene_symbol: Msed_0709
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:399549
  label: Metallosphaera sedula DSM 5348
description: >-
  Msed_0709 encodes the NADPH-dependent malonyl-CoA/succinyl-CoA reductase (MCR) of the
  thermoacidophilic crenarchaeon Metallosphaera sedula, a soluble homotetrameric enzyme of
  the 3-hydroxypropionate/4-hydroxybutyrate autotrophic CO2-fixation cycle of the
  Sulfolobales. It reduces malonyl-CoA, the product of acetyl-CoA carboxylation, to malonate
  semialdehyde with release of CoA (EC 1.2.1.75), and with similar efficiency reduces
  succinyl-CoA to succinate semialdehyde (EC 1.2.1.76) in the second half of the cycle that
  regenerates acetyl-CoA. The activity is NADPH-specific, thiol-dependent (a catalytic
  cysteine forms an acyl-enzyme thioester) and about 10-fold induced under autotrophic
  growth. MCR is a paralog of aspartate-semialdehyde dehydrogenase (about 40% identity)
  that arose by gene duplication and neofunctionalization; structures of the Sulfolobus
  tokodaii ortholog show a remodelled substrate pocket and a single bispecific site that is
  occupied in turn by NADP+ and CoA. It is unrelated to the bifunctional malonyl-CoA
  reductase of Chloroflexus, and has been used to engineer CO2-dependent
  3-hydroxypropionate production in Pyrococcus furiosus.
