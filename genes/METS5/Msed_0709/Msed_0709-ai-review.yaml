- term:
    id: GO:0016620
    label: oxidoreductase activity, acting on the aldehyde or oxo group of donors, NAD
      or NADP as acceptor
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR000534
  - InterPro:IPR012280
  review:
    summary: Correct parent-level activity. MCR interconverts malonyl-CoA plus NADPH and
      malonate semialdehyde plus CoA plus NADP+ (EC 1.2.1.75), and does the same for
      succinyl-CoA and succinate semialdehyde (EC 1.2.1.76). Written in the oxidative
      direction, both are CoA-acylating aldehyde dehydrogenase reactions with NADP+ as
      acceptor.
    action: ACCEPT
    reason: The term is correct, and it is the most specific existing GO term for MCR's
      catalytic activity. GO has no term for EC 1.2.1.75 or EC 1.2.1.76 (the GO ec2go
      mapping has no entry for either, and a QuickGO search found none). GO:0018478
      malonate-semialdehyde dehydrogenase (acetylating) is a different, decarboxylating
      reaction. Specific child terms are proposed in proposed_new_terms. Until GO creates
      them, this term is as precise as GO allows, so it is accepted as the core activity
      term.
    supported_by:
    - reference_id: PMID:17041055
      supporting_text: 'The enzyme catalyzes the following reaction: malonyl-CoA + NADPH
        + H+ --> malonate-semialdehyde + CoA + NADP+.'
    - reference_id: PMID:19684143
      supporting_text: These data showed that malonyl-CoA reductase is a promiscuous enzyme
        and acts nearly equally well with malonyl-CoA and succinyl-CoA.
