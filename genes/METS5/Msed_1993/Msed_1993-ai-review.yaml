- term:
    id: GO:0015977
    label: carbon fixation
  evidence_type: IDA
  original_reference_id: PMID:19684143
  review:
    summary: Msed_1993 catalyses the reduction of malonate semialdehyde to
      3-hydroxypropionate, a step of the 3-hydroxypropionate/4-hydroxybutyrate autotrophic
      CO2-fixation cycle of M. sedula.
    action: NEW
    reason: The enzyme itself catalyses a step of the cycle, so it passes the
      participation test. It was purified from autotrophic cells, its activity is about
      five-fold up-regulated under autotrophic growth, and its gene is near the
      3-hydroxypropionyl-CoA dehydratase gene Msed_2001. When it was co-expressed with the
      cycle's carboxylase and malonyl-CoA reductase in Pyrococcus furiosus, the strain
      fixed CO2 into 3-hydroxypropionate (PMID:23530213). This matches the treatment of the
      other catalytic steps of the cycle (Msed_0709, Msed_1424, Msed_2001), which carry the
      same term. GO:0043427 carbon fixation by 3-hydroxypropionate cycle describes the
      Chloroflexus glyoxylate-forming cycle and is not used. The 3HP/4HB-cycle child term
      is proposed with the same wording as in the Msed_0709 review.
    supported_by:
    - reference_id: PMID:19684143
      supporting_text: The specific activity of this conversion in autotrophically grown
        cells was 1.8 μmol min −1 mg −1 protein, whereas in heterotrophically grown cells
        the specific activity was 0.35 μmol min −1 mg −1 protein.
    - reference_id: PMID:19684143
