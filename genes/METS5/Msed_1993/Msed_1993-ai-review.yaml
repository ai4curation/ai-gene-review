proposed_new_terms:
- proposed_name: carbon fixation by 3-hydroxypropionate/4-hydroxybutyrate cycle
  proposed_definition: An autotrophic carbon dioxide fixation pathway in which acetyl-CoA
    is carboxylated twice by acetyl-CoA/propionyl-CoA carboxylase, and the products are
    reductively converted via 3-hydroxypropionate and succinyl-CoA to 4-hydroxybutyrate.
    4-Hydroxybutyrate is then converted via 4-hydroxybutyryl-CoA dehydratase into two
    molecules of acetyl-CoA. The pathway occurs in autotrophic Sulfolobales and in
    ammonia-oxidizing Thaumarchaeota.
  justification: GO:0043427 carbon fixation by 3-hydroxypropionate cycle is defined as
    the Chloroflexus cycle that releases glyoxylate via malyl-CoA cleavage. The archaeal
    cycle shares only the first half with it, and its malonic semialdehyde reductase
    (Msed_1993) is unrelated to the Chloroflexus enzyme. The same term is proposed in the
    Msed_0709 review.
  proposed_parent:
    id: GO:0015977
    label: carbon fixation
  supported_by:
  - reference_id: PMID:18079405
    supporting_text: This intermediate was reduced to 4-hydroxybutyrate and converted into
      two acetyl-CoA molecules via 4-hydroxybutyryl-CoA dehydratase.
suggested_questions:
- question: Should PANTHER PTHR48075:SF1 (lambda-crystallin homolog) be split so that the
    Sulfolobales malonic semialdehyde reductase clade no longer receives L-gulonate
    3-dehydrogenase activity by TreeGrafter?
- question: Does Msed_1993 retain any 3-hydroxyacyl-CoA dehydrogenase or L-gulonate
    3-dehydrogenase activity, or has the acyl-CoA binding site been lost?
suggested_experiments:
- hypothesis: Msed_1993 is required for autotrophic but not heterotrophic growth of M.
    sedula.
  description: Delete Msed_1993 with a Sulfolobales genetic system and compare growth on
    CO2/H2 with growth on yeast extract, with and without 3-hydroxypropionate
    supplementation.
- hypothesis: Msed_1993 does not act on 3-hydroxyacyl-CoA thioesters or on L-gulonate.
  description: Assay recombinant Msed_1993 with (S)-3-hydroxybutyryl-CoA/acetoacetyl-CoA
    and with L-gulonate/3-dehydro-L-gulonate in both directions, with NAD(H) and
    NADP(H), and solve its structure with malonate semialdehyde or 3-hydroxypropionate
    bound.
