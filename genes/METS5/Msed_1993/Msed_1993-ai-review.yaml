- term:
    id: GO:0050104
    label: L-gulonate 3-dehydrogenase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN000592773
  review:
    summary: TreeGrafter transfer from PANTHER node PTN000592773 (subfamily
      PTHR48075:SF1, lambda-crystallin homolog). L-gulonate 3-dehydrogenase (EC 1.1.1.45)
      is the activity of lambda-crystallin/CRYL1 in the eukaryotic uronate pathway.
    action: REMOVE
    reason: Msed_1993 has a different, experimentally established activity, the NADPH-
      dependent reduction of the C3 oxo acid malonate semialdehyde (PMID:19684143). Its
      substrate range is narrow; succinate semialdehyde and C2-C5 aliphatic aldehydes are
      not used. L-gulonate, a C6 sugar acid, was not tested, and there is no evidence of
      a glucuronate/uronate pathway in which such an activity would act in this
      autotrophic archaeon. The authors note the protein cannot be classified from its
      sequence. The term is a paralog-subfamily transfer of a eukaryotic activity onto a
      neofunctionalized archaeal enzyme (ARCHAEA annotation pattern 1), and should be
      replaced by GO:0035527.
    supported_by:
    - reference_id: PMID:19684143
      supporting_text: Succinic semialdehyde, acetaldehyde, butyraldehyde, propionaldehyde,
        or glutaraldehyde did not serve as a substrate
    - reference_id: PMID:19684143
      supporting_text: This enzyme cannot be classified unambiguously, and no divalent metal
        ion was required.
