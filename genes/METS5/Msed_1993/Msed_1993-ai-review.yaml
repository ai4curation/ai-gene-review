id: A4YI81
gene_symbol: Msed_1993
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:399549
  label: Metallosphaera sedula DSM 5348
description: >-
  Msed_1993 encodes the NADPH-dependent malonic semialdehyde reductase of the
  thermoacidophilic crenarchaeon Metallosphaera sedula. It reduces malonate semialdehyde
  (3-oxopropanoate) to 3-hydroxypropionate, the second reductive step of the
  3-hydroxypropionate/4-hydroxybutyrate autotrophic CO2-fixation cycle of the Sulfolobales,
  immediately after malonyl-CoA reduction by the malonyl-CoA/succinyl-CoA reductase
  Msed_0709. The enzyme was partially purified from autotrophically grown cells, identified
  by peptide mass fingerprinting, and characterized as a recombinant protein. It is a
  homotrimeric, metal-independent member of the 3-hydroxyacyl-CoA dehydrogenase family with
  an N-terminal Rossmann-fold dinucleotide-binding domain. It prefers NADPH (NADH supports
  about 20% of the activity) and is specific for malonate semialdehyde; succinate
  semialdehyde and simple aliphatic aldehydes are not reduced. Its activity is about
  five-fold higher in autotrophically than in heterotrophically grown cells. Expressed
  together with the cycle's carboxylase and malonyl-CoA reductase, it allowed engineered
  Pyrococcus furiosus to make 3-hydroxypropionate from CO2.
existing_annotations:
- term:
    id: GO:0006631
    label: fatty acid metabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR006108
  - InterPro:IPR006176
  - InterPro:IPR006180
  review:
    summary: InterPro2GO mapping from the 3-hydroxyacyl-CoA dehydrogenase family
      signatures, which assume a role in fatty acid beta-oxidation. Msed_1993 is a
      neofunctionalized family member that reduces free malonate semialdehyde in
      autotrophic CO2 fixation.
    action: MARK_AS_OVER_ANNOTATED
    reason: The family-level mapping is right for canonical 3-hydroxyacyl-CoA
      dehydrogenases, which oxidize 3-hydroxyacyl-CoA thioesters in beta-oxidation.
      Msed_1993 has not been shown to act on any acyl-CoA. Its characterized substrate is
      the free aldehyde malonate semialdehyde, and the reaction runs in the reductive,
      anabolic direction in the 3HP/4HB cycle (PMID:19684143). The product,
      3-hydroxypropionate, is a C3 hydroxy acid, so the term is not strictly impossible,
      but it does not describe the role of the enzyme. The same treatment was given to
      the fatty acid beta-oxidation row on the sibling 3-hydroxypropionyl-CoA dehydratase
      Msed_2001. The process is captured by carbon fixation (NEW below).
    supported_by:
    - reference_id: PMID:19684143
      supporting_text: Malonic semialdehyde reductase, a member of the 3-hydroxyacyl-CoA
        dehydrogenase family, reduces malonic semialdehyde with NADPH to 3-hydroxypropionate.
    - reference_id: PMID:19684143
      supporting_text: Also, the NADPH specificity suggests that they function as reductases
        in an anabolic pathway rather than as dehydrogenases in a catabolic pathway.
