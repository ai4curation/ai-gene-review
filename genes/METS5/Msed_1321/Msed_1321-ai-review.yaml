  review:
    summary: Msed_1321 catalyses the 4-hydroxybutyryl-CoA dehydration step of the
      acetyl-CoA-regenerating branch of the 3HP/4HB autotrophic CO2-fixation cycle. The
      branch was reconstituted in vitro with Msed_1321 and three other recombinant
      enzymes, and the gene is about 27-fold induced in autotrophy.
    action: NEW
    reason: The enzyme catalyses a step of the cycle itself, so it passes the
      participation test. Comparators in the same role (catalysts of individual cycle
      steps), namely Msed_0406, Msed_1424, Msed_0709 and Msed_2001, carry GO:0015977 in
      their reviews. GO:0043427 carbon fixation by 3-hydroxypropionate cycle is the
      Chloroflexus glyoxylate-forming cycle, which has no 4-hydroxybutyrate branch, so it
      is not used. GO:0015977 is the most precise correct existing term, and the
      3HP/4HB-cycle child term proposed in the Msed_0709 review is repeated below. The
      in vivo role rests on biochemistry, reconstitution and expression; there is no
      genetic evidence.
    supported_by:
