gene_symbol: Msed_1321
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:399549
  label: Metallosphaera sedula DSM 5348
description: >-
  Msed_1321 encodes the 4-hydroxybutyryl-CoA dehydratase (EC 4.2.1.120) of the
  thermoacidophilic crenarchaeon Metallosphaera sedula. This is the key enzyme of the
  4-hydroxybutyrate part of the 3-hydroxypropionate/4-hydroxybutyrate autotrophic
  CO2-fixation cycle of the Sulfolobales. It dehydrates 4-hydroxybutyryl-CoA to
  crotonyl-CoA, which is then hydrated, oxidised and cleaved into two acetyl-CoA. The
  507-residue protein belongs to the HpaB/PvcC/4-hydroxybutyryl-CoA dehydratase family,
  which has an acyl-CoA dehydrogenase-like fold. By homology with the clostridial
  enzyme, it is expected to carry FAD and a [4Fe-4S] cluster and to use radical
  chemistry. The recombinant enzyme, produced anaerobically in Escherichia coli, is a
  homotetramer with a Km of 0.15 mM for 4-hydroxybutyryl-CoA and a low specific
  activity (about 2.2 U/mg at 70 C). Together with 4-hydroxybutyrate-CoA ligase, it is
  rate-limiting for the acetyl-CoA-regenerating branch. Unlike the clostridial enzyme,
  it is relatively oxygen tolerant, with a half-life of about 4 days in air. Its
  transcript is strongly induced (about 27-fold) under autotrophic growth. The
  submitter's name, vinylacetyl-CoA Delta-isomerase, refers to a partial reaction
  documented for the clostridial homolog but not tested for this protein.
existing_annotations:
- term:
    id: GO:0016627
    label: oxidoreductase activity, acting on the CH-CH group of donors
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR009100
  - InterPro:IPR036250
  - InterPro:IPR046373
  review:
    summary: InterPro2GO mapping from the acyl-CoA dehydrogenase/oxidase-like
      superfamily signatures (IPR009100 N-terminal and middle domain, IPR036250 C-terminal
      domain, IPR046373 middle domain) to oxidoreductase activity acting on CH-CH donors.
    action: REMOVE
    reason: These are fold-level superfamily signatures that are shared by acyl-CoA
      dehydrogenases, acyl-CoA oxidases, HpaB-type flavin monooxygenases and the
      4-hydroxybutyryl-CoA dehydratases. The family-specific InterPro entries
      (IPR004925, IPR024719, IPR024674 HpaB/PvcC/4-BUDH) carry no such mapping. The net
      reaction catalysed by Msed_1321 is the dehydration of 4-hydroxybutyryl-CoA to
      crotonyl-CoA (PMID:24532060). This is a hydro-lyase reaction (GO:0043721, under
      GO:0016836) with no net electron transfer, so it is not a CH-CH oxidoreduction. In
      the clostridial paradigm, FAD only transiently oxidises the substrate within a
      radical mechanism and is regenerated each turnover. No CH-CH dehydrogenase activity
      has been reported for Msed_1321 or for its characterised homologs. This is a
      superfamily-fold over-propagation that contradicts the known reaction class.
    supported_by:
    - reference_id: PMID:24532060
      supporting_text: The reaction rate for the subsequent transformation, the
        dehydration by 4-hydroxybutyryl-CoA dehydratase, is also low (2.2 μmol min −1 mg
        −1 ), and hence, these two reactions form the rate-limiting steps for the
        acetyl-CoA branch.
    - reference_id: PMID:21169482
      supporting_text: 4-Hydroxybutyryl-CoA dehydratase, which catalyzes a mechanistically
        intriguing elimination of water, is well conserved and rightly can be considered
        the key enzyme of these two cycles.
- term:
    id: GO:0050393
    label: vinylacetyl-CoA delta-isomerase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000003
  qualifier: enables
  supporting_entities:
  - EC:5.3.3.3
  review:
    summary: EC2GO mapping from the submitter-assigned EC 5.3.3.3 (vinylacetyl-CoA
      Delta-isomerase) in the EMBL entry, which is also the source of the protein name.
    action: KEEP_AS_NON_CORE
    reason: The isomerase name was carried over from the clostridial paradigm enzyme
      (AbfD of Clostridium aminobutyricum). IUBMB (EC 4.2.1.120) and Rhea describe AbfD
      as having an intrinsic vinylacetyl-CoA Delta3-Delta2-isomerase activity as well as
      the dehydratase activity, because both reactions run through the same radical
      intermediates. The isomerase activity has not been assayed for Msed_1321. Hawkins
      et al. measured only 4-hydroxybutyryl-CoA-dependent crotonyl-CoA formation
      (PMID:24532060). The isomerisation of vinylacetyl-CoA is not a step of the
      3HP/4HB cycle. The activity is plausible as a conserved partial reaction of the
      dehydratase active site, so the row is kept, but as non-core. The physiological
      activity is GO:0043721 4-hydroxybutanoyl-CoA dehydratase activity, added below.
      The clostridial primary paper (Scherf and Buckel 1993) could not be cached during
      this review, because NCBI E-utilities were unavailable.
    supported_by:
    - reference_id: PMID:24532060
      supporting_text: This was likely due to the oxygen sensitivity of the enzyme, based
        on properties of a well-studied homolog from an anaerobic bacterium, Clostridium
        aminobutyricum
- term:
    id: GO:0043721
    label: 4-hydroxybutanoyl-CoA dehydratase activity
  evidence_type: IDA
  original_reference_id: PMID:24532060
  review:
    summary: Recombinant His-tagged Msed_1321 was produced and purified anaerobically.
      Its activity was assayed at 70 C in a coupled assay. Msed_0406 generated
      4-hydroxybutyryl-CoA from 4HB, and crotonyl-CoA formation was read out through
      the NAD+-dependent Msed_0399 hydratase/dehydrogenase. The Km for
      4-hydroxybutyryl-CoA was 0.15 mM and the rate was 2.2 U/mg.
    action: NEW
    reason: This is the defining activity of the gene and is missing from GOA. GO:0043721
      is defined as 4-hydroxybutanoyl-CoA = (2E)-butenoyl-CoA + H2O (verified in OLS,
      under hydro-lyase activity). The evidence is direct, from the purified recombinant
      M. sedula enzyme, and not only by analogy to AbfD. The reaction was initiated by
      adding the dehydratase, and the enzyme supported reconstitution of the whole
      4HB-to-acetyl-CoA branch. The dehydratase activity of autotrophic cell extracts was
      already attributed to this gene (PMID:21169482). Its paralog Msed_1220 lacks
      catalytic residues.
    supported_by:
    - reference_id: PMID:24532060
      supporting_text: This approach resulted in the production of soluble, active enzyme
        that was purified to electrophoretic homogeneity after metal affinity
        chromatography.
    - reference_id: PMID:24532060
      supporting_text: The reaction mixture was preheated for 5 min at 70°C to allow
        accumulation of 4HB-CoA, and then the reaction was initiated by the addition of
        purified 4-hydroxybutyryl-CoA dehydratase.
    - reference_id: PMID:24532060
      supporting_text: Msed_1321 on 4-hydroxybutyryl-CoA, 0.15 mM
    - reference_id: PMID:21169482
      supporting_text: Cell extracts of autotrophic Sulfolobales , Thermoproteales , and
        Desulfurococcales contained high 4-hydroxybutyryl-CoA dehydratase activity
- term:
