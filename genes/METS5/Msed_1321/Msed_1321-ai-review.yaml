proposed_new_terms:
- proposed_name: carbon fixation by 3-hydroxypropionate/4-hydroxybutyrate cycle
  proposed_definition: An autotrophic carbon dioxide fixation pathway in which acetyl-CoA
    is carboxylated twice by acetyl-CoA/propionyl-CoA carboxylase, and the products are
    reductively converted via 3-hydroxypropionate and succinyl-CoA to 4-hydroxybutyrate.
    4-Hydroxybutyrate is then converted via 4-hydroxybutyryl-CoA dehydratase into two
    molecules of acetyl-CoA. The pathway occurs in autotrophic Sulfolobales and in
    ammonia-oxidizing Thaumarchaeota.
  justification: GO:0043427 carbon fixation by 3-hydroxypropionate cycle is defined as
    the Chloroflexus cycle that releases glyoxylate via malyl-CoA cleavage, and it has
    no 4-hydroxybutyrate branch. Msed_1321 catalyses the 4-hydroxybutyryl-CoA dehydratase
    step that defines the archaeal cycle. This proposal repeats the one in the Msed_0709
    review.
  proposed_parent:
    id: GO:0015977
    label: carbon fixation
  supported_by:
  - reference_id: PMID:18079405
    supporting_text: This intermediate was reduced to 4-hydroxybutyrate and converted
      into two acetyl-CoA molecules via 4-hydroxybutyryl-CoA dehydratase.
suggested_questions:
- question: Does Msed_1321 have vinylacetyl-CoA Delta-isomerase activity, as the
    clostridial AbfD does? Should UniProt rename the entry 4-hydroxybutyryl-CoA
    dehydratase (EC 4.2.1.120), with EC 5.3.3.3 kept only as a secondary activity?
- question: Does the M. sedula enzyme contain FAD and a [4Fe-4S] cluster like AbfD, and
    what structural features account for its much greater oxygen tolerance?
- question: Should InterPro2GO stop mapping the acyl-CoA dehydrogenase-like fold
    superfamilies (IPR009100, IPR036250, IPR046373) to GO:0016627, given that they also
    cover the 4-hydroxybutyryl-CoA dehydratase and HpaB monooxygenase families, which
    are not CH-CH oxidoreductases?
suggested_experiments:
- hypothesis: Msed_1321 is bifunctional, with vinylacetyl-CoA Delta-isomerase activity
    as well as 4-hydroxybutyryl-CoA dehydratase activity, and carries FAD and a [4Fe-4S]
    cluster.
  description: Assay purified recombinant Msed_1321 with vinylacetyl-CoA, and follow
    crotonyl-CoA formation by HPLC. Determine flavin and iron/acid-labile sulfide
    content, and record EPR and UV-visible spectra.
- hypothesis: Msed_1321 is essential for autotrophic growth.
  description: Delete or knock down Msed_1321 in M. sedula, or its ortholog in a
    genetically tractable autotrophic Sulfolobales relative. Compare autotrophic and
    heterotrophic growth and measure 4-hydroxybutyryl-CoA dehydratase activity in
    extracts.
