      warranted. It describes substrate binding that is part of the core biotin carboxylase activity
      rather than a separate function, so it is kept as non-core.
    supported_by:
    - reference_id: PMID:12533469
      supporting_text: The ATP-binding residues were found in the biotin carboxylase subunit, whereas
