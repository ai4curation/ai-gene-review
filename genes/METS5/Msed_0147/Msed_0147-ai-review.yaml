core_functions:
- description: Biotin carboxylase subunit of the acetyl-CoA/propionyl-CoA carboxylase. It catalyses
    the ATP-dependent carboxylation of the biotin prosthetic group on the biotin carboxyl carrier
    protein (Msed_0148). This is the first half-reaction of the acetyl-CoA carboxylation that starts
    the 3-hydroxypropionate/4-hydroxybutyrate CO2-fixation cycle.
