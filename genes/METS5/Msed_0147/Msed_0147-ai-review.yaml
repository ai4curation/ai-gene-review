    label: acetyl-CoA carboxylase activity
  evidence_type: IDA
  original_reference_id: PMID:12581213
  qualifier: contributes_to
  review:
    summary: The purified alpha-beta-gamma complex that contains Msed_0147 carboxylates acetyl-CoA to
