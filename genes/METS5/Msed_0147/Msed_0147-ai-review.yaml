id: A4YD22
gene_symbol: Msed_0147
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:399549
  label: Metallosphaera sedula DSM 5348
description: >-
  Msed_0147 encodes the biotin carboxylase (alpha) subunit of the acetyl-CoA/propionyl-CoA
  carboxylase of the thermoacidophilic crenarchaeon Metallosphaera sedula. This biotin-dependent
  enzyme is the carboxylating enzyme of the 3-hydroxypropionate/4-hydroxybutyrate autotrophic
  CO2-fixation cycle of the Sulfolobales. The purified enzyme is a stable complex of about 560 kDa,
  probably (alpha beta gamma)4. It is made of this 57 kDa biotin carboxylase, the 18.6 kDa biotin
  carboxyl carrier protein (Msed_0148) and the 57 kDa carboxyltransferase (Msed_1375). The single
  enzyme carboxylates acetyl-CoA to malonyl-CoA and propionyl-CoA to (S)-methylmalonyl-CoA at
  similar rates, using ATP and bicarbonate. Within the complex the alpha subunit performs the first
  half-reaction: the ATP-dependent carboxylation of the biotin carried on the beta subunit
  (biotin carboxylase, EC 6.3.4.14). It has an N-terminal ATP-grasp biotin carboxylation domain and a
  C-terminal BC domain. The three subunit genes are strongly induced under autotrophic growth. Because
  archaea have no fatty acids, the enzyme serves CO2 fixation rather than lipid synthesis. Together
  with the reductase steps that follow, the M. sedula enzyme has been expressed in Pyrococcus
  furiosus to make 3-hydroxypropionate from CO2.
