  review:
    summary: The same purified complex carboxylates propionyl-CoA to (S)-methylmalonyl-CoA, the second
      CO2-fixing step of the cycle, at a rate similar to acetyl-CoA.
    action: NEW
    reason: The archaeal enzyme is bifunctional, as shown for the purified M. sedula enzyme and for
