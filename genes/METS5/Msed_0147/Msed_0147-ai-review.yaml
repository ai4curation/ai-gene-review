  review:
    summary: InterPro2GO mapping from the ATP-grasp domain (IPR011761), whose members bind Mg2+ (or
      Mn2+) together with ATP.
    action: KEEP_AS_NON_CORE
    reason: ATP-grasp enzymes use divalent cations bound to the ATP phosphates, and the carboxylase
      assays used MgATP. The bound ion has not been identified for the M. sedula enzyme. The UniProt
      Co(2+) cofactor line comes from an ARBA rule with no M. sedula data. No more specific ion term is
