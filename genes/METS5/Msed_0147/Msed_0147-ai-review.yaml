- term:
    id: GO:0004075
    label: biotin carboxylase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000003
  qualifier: enables
  supporting_entities:
  - EC:6.3.4.14
  review:
    summary: EC-to-GO mapping from the UniProt EC 6.3.4.14 on the alpha subunit. This is the first
      half-reaction of the biotin-dependent carboxylase, the ATP-dependent carboxylation of
      biotin-BCCP.
    action: ACCEPT
    reason: Msed_0147 is the alpha (biotin carboxylase) subunit of the purified M. sedula
      acetyl-CoA/propionyl-CoA carboxylase. Biotin carboxylase activity is the subunit's own catalytic
      activity, so it is annotated with enables, unlike the whole-enzyme acyl-CoA carboxylase
      activities, to which the subunit only contributes. The protein carries the complete
      biotin-carboxylation domain (PS50979) with its ATP-grasp subdomain. The gene is induced 7- to
      30-fold under autotrophic growth with the other two subunit genes, and expression of the three
      genes in P. furiosus gives ATP- and bicarbonate-dependent carboxylase activity. No
      isolated-subunit assay of the M. sedula BC has been published, so the half-reaction assignment
      rests on the domain architecture and on the subunit composition of the purified enzyme.
    supported_by:
    - reference_id: PMID:12581213
      supporting_text: The enzyme consists of two large subunits of 57 kDa each representing biotin
        carboxylase (alpha) and carboxytransferase (gamma), respectively, and a small 18.6 kDa biotin
        carrier protein (beta).
    - reference_id: PMID:24532060
      supporting_text: especially the genes encoding acetyl-CoA/propionyl-CoA carboxylase (ACCαβγ)
        (Msed_0147, Msed_0148, Msed_1375; 7- to 30-fold)
    - reference_id: file:METS5/Msed_0147/Msed_0147-uniprot.txt
