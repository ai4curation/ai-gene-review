suggested_questions:
- question: GO:0009317 acetyl-CoA carboxylase complex is defined as catalysing the first step in
    long-chain fatty acid biosynthesis, and GO has no propionyl-CoA carboxylase complex term. Should the
    definition be generalized, or a term created for the archaeal bifunctional acetyl-CoA/propionyl-CoA
    carboxylase complex, so that its three subunits can be annotated to a specific complex?
- question: Which divalent cation does the M. sedula biotin carboxylase use in vivo? The UniProt Co(2+)
    cofactor statement comes from an ARBA rule, not from data on this enzyme.
suggested_experiments:
- hypothesis: The isolated alpha subunit catalyses ATP-dependent carboxylation of free biotin or of the
    biotinylated beta subunit, independently of the carboxyltransferase.
  description: Express Msed_0147 alone and assay bicarbonate-dependent ATP hydrolysis with free D-biotin
    and with BCCP (Msed_0148) biotinylated in vitro by Msed_2010. Measure ADP or phosphate formation,
    with and without acetyl-CoA.
