- term:
    id: GO:0015977
    label: carbon fixation
  evidence_type: IDA
  original_reference_id: PMID:12581213
  qualifier: involved_in
  review:
    summary: The acetyl-CoA/propionyl-CoA carboxylase is the CO2-fixing enzyme of the
      3-hydroxypropionate/4-hydroxybutyrate autotrophic cycle of M. sedula. The BC subunit performs
      the ATP-dependent bicarbonate activation step of both carboxylations.
    action: NEW
    reason: The subunit does part of the work of the process. It catalyses the carboxylation of biotin,
      which brings the fixed bicarbonate into the cycle, so it passes the participation test. The
      comparators are the other catalytic proteins of this cycle, such as the malonyl-CoA/succinyl-CoA
      reductase Msed_0709, which carry GO:0015977 in their reviews. GO:0043427 is the Chloroflexus
      glyoxylate-forming cycle and is not used. A specific child term, carbon fixation by
      3-hydroxypropionate/4-hydroxybutyrate cycle, is proposed in the Msed_0709 review. Until it
      exists, GO:0015977 is the most precise correct term.
    supported_by:
    - reference_id: PMID:18079405
      supporting_text: We discovered that an autotrophic member of the archaeal order Sulfolobales,
        Metallosphaera sedula, fixed CO2 with acetyl-coenzyme A (acetyl-CoA)/propionyl-CoA
        carboxylase as the key carboxylating enzyme.
    - reference_id: PMID:12581213
      supporting_text: Acetyl-CoA/propionyl-CoA carboxylase is considered the main CO2 fixation enzyme
        of autotrophic members of Sulfolobaceae and the sequenced genomes of these Archaea contain the
        respective genes.
    - reference_id: PMID:24532060
      supporting_text: Among the most highly upregulated genes for the HTR versus ACL contrast were
        those directly involved in CO 2 fixation in the 3HP/4HB pathway
