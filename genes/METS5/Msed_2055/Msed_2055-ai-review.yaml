      fixation.
proposed_new_terms:
- proposed_name: carbon fixation by 3-hydroxypropionate/4-hydroxybutyrate cycle
  proposed_definition: An autotrophic carbon dioxide fixation pathway in which acetyl-CoA
    is carboxylated twice by acetyl-CoA/propionyl-CoA carboxylase, and the products are
    reductively converted via 3-hydroxypropionate and succinyl-CoA to 4-hydroxybutyrate.
    4-Hydroxybutyrate is then converted via 4-hydroxybutyryl-CoA dehydratase into two
    molecules of acetyl-CoA. The pathway occurs in autotrophic Sulfolobales and in
    ammonia-oxidizing Thaumarchaeota.
  justification: GO:0043427 carbon fixation by 3-hydroxypropionate cycle is defined
    as the Chloroflexus cycle that releases glyoxylate via malyl-CoA cleavage. The archaeal
    3HP/4HB cycle shares only the first half, which includes the methylmalonyl-CoA mutase
    step, and regenerates acetyl-CoA via 4-hydroxybutyrate. Its enzymes therefore have
    no specific process term. The same term is proposed in the Msed_0709 and Msed_0638
    reviews.
  proposed_parent:
    id: GO:0015977
    label: carbon fixation
  supported_by:
  - reference_id: PMID:18079405
    supporting_text: This intermediate was reduced to 4-hydroxybutyrate and converted
      into two acetyl-CoA molecules via 4-hydroxybutyryl-CoA dehydratase.
suggested_questions:
- question: Should the InterPro2GO mapping from IPR006159 (MCM C-terminal B12-binding
    domain) to isomerase activity be restricted to fused MCM chains, or changed to
    contributes_to, given that in split-subunit mutases such as M. sedula Msed_2055 and
    IcmB the matching protein is a non-catalytic cofactor-binding subunit?
- question: Does the MeaB/ArgK-like G-protein Msed_2056, whose ORF overlaps Msed_2055,
    load adenosylcobalamin onto the beta subunit and protect the mutase from inactivation,
    as MeaB does for bacterial MCM?
suggested_experiments:
- hypothesis: Msed_2055 binds adenosylcobalamin through His33 in the base-off/His-on mode.
  description: Purify Msed_2055 alone or as the reconstituted complex, and measure
    adenosylcobalamin binding by UV-visible and EPR spectroscopy. Compare wild type with
    an H33 mutant, and test whether the H33 mutant complex retains mutase activity.
- hypothesis: Msed_2056 increases cofactor loading or the stability of the
    Msed_0638/Msed_2055 mutase.
  description: Coexpress Msed_0638, Msed_2055 and Msed_2056, and measure activity,
    cofactor occupancy and inactivation rate during turnover, with and without GTP.
