core_functions:
- description: Coenzyme B12-binding (beta) subunit of the adenosylcobalamin-dependent
    methylmalonyl-CoA mutase. With the catalytic subunit Msed_0638 it forms an
    alpha2beta2 heterotetramer that rearranges (R)-methylmalonyl-CoA to succinyl-CoA in
    the 3-hydroxypropionate/4-hydroxybutyrate CO2-fixation cycle. Msed_2055 binds the
    cofactor, with the DXHXXG histidine as the expected axial cobalt ligand, and activity
    requires the partner subunit.
  molecular_function:
