- term:
    id: GO:0046872
    label: metal ion binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR006158
  - InterPro:IPR036724
  review:
    summary: InterPro2GO mapping from the B12-binding domain signatures, reflecting
      coordination of the cobalt of cobalamin by the conserved motif histidine (His33 in
      Msed_2055).
    action: KEEP_AS_NON_CORE
    reason: Not false. In base-off/His-on binding the motif histidine is the axial ligand
      to the cobalt atom (PMID:22803641), so the protein does contact a metal. But the
      cobalt is bound only as part of the corrin cofactor, and cobalamin binding
      (GO:0031419, accepted here) is the informative statement. A free-ion refinement
      such as cobalt ion binding is not proposed, because no evidence exists that the
      subunit binds cobalt outside the cofactor. Kept as a cofactor-level, non-core
      term, as in the human MTR review.
    supported_by:
    - reference_id: PMID:22803641
      supporting_text: Cobalamin is bound to all these enzymes in the “base-off/His-on”
        conformation, in which the side chain of the histidine in a conserved DXHXXG motif,
        serves as the axial ligand to cobalt
    - reference_id: file:METS5/Msed_2055/Msed_2055-bioinformatics/RESULTS.md
      supporting_text: His33 is the candidate lower axial ligand to cobalt
- term:
    id: GO:0015977
    label: carbon fixation
  evidence_type: IDA
  original_reference_id: PMID:22752162
  review:
    summary: The Msed_0638/Msed_2055 mutase rearranges (R)-methylmalonyl-CoA to
      succinyl-CoA, a step of the 3-hydroxypropionate/4-hydroxybutyrate CO2-fixation
      cycle of M. sedula. Msed_2055 transcription is induced under autotrophic growth.
    action: NEW
    reason: Participation test. The mutase step is catalysed by the alpha2beta2 complex,
      and Msed_2055 supplies the cofactor-binding domain that the step depends on, since
      active enzyme needed both subunits (PMID:22752162). This is the cofactor case of
      participation, not mere necessity. Comparator check. The catalytic partner Msed_0638
      and other single-step catalysts of the cycle (Msed_0709, Msed_1424, Msed_0406,
      Msed_2001) carry GO:0015977 in their reviews. GO:0043427 is the Chloroflexus
      glyoxylate-forming cycle and is not used, and a 3HP/4HB-cycle child term is
      proposed below. Caveats are that no genetic evidence exists, and that the activity
      was measured for the recombinant complex.
    supported_by:
    - reference_id: PMID:22752162
      supporting_text: The expression of all three genes was significantly upregulated under
        autotrophic compared to heterotrophic growth conditions, implying a role in CO(2)
        fixation.
    - reference_id: PMID:22752162
      supporting_text: The two enzymes together catalyzed the two-step conversion of (S)-methylmalonyl-CoA
        to succinyl-CoA, consistent with their proposed role in the 3-HP/4-HB cycle.
