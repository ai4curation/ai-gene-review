      supporting_text: MCM is a heterotetramer (α(2)β(2))
    - reference_id: PMID:22803641
      supporting_text: A variant arrangement has been reported for MCM from Metallosphaera
        sedula that exhibits a split organization (Fig. 2) with one subunit being homologous
