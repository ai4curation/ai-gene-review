        the α-subunit of the canonical MCM
- term:
    id: GO:0031419
    label: cobalamin binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR006158
  - InterPro:IPR036724
  review:
    summary: InterPro2GO mapping from the B12-binding domain signatures. Msed_2055 is a
      single B12-binding domain (PROSITE PS51332, residues 20-148) with the
      DXHXXG-SXL-GG motif (DGHDRG at 31-36, SIL at 78, GG at 108), and was named the
      coenzyme B12-binding subunit of the M. sedula mutase.
    action: ACCEPT
    reason: This is the defining activity of the subunit. In split-subunit acyl-CoA
      mutases the B subunit binds adenosylcobalamin, and in class I B12-binding domains
      the histidine of DXHXXG is the axial ligand to cobalt (PMID:22803641). Han et al.
      identified that motif in M. sedula MCM-beta (PMID:22752162). The evidence is
      domain, motif and family based. No binding measurement on the isolated subunit is
      reported in the abstract, and the full text could not be read.
    supported_by:
    - reference_id: PMID:22752162
      supporting_text: the gene for the coenzyme B(12)-binding subunit of MCM (MCM-β) is
        located remotely (Msed_2055)
    - reference_id: PMID:22752162
      supporting_text: The conserved coenzyme B(12)-binding motif (DXHXXG-SXL-GG) was identified
