taxon:
  id: NCBITaxon:399549
  label: Metallosphaera sedula DSM 5348
description: >-
  Msed_2055 encodes the coenzyme B12-binding (beta, small) subunit of the
  adenosylcobalamin-dependent methylmalonyl-CoA mutase (MCM) of the thermoacidophilic
  crenarchaeon Metallosphaera sedula. The 155-residue protein consists of a single
  Rossmann-type B12-binding domain, homologous to the C-terminal cofactor-binding domain
  of canonical bacterial and mitochondrial MCM alpha chains, and carries the conserved
  DXHXXG-SXL-GG motif whose histidine is the expected lower axial ligand to the cobalt of
  adenosylcobalamin. The substrate-binding TIM-barrel domain is supplied by the remotely
  encoded catalytic subunit Msed_0638. The recombinant mutase is soluble and active only
  when both subunits are coexpressed, and forms an alpha2beta2 heterotetramer that
  converts (R)-methylmalonyl-CoA to succinyl-CoA, a step in the
  3-hydroxypropionate/4-hydroxybutyrate autotrophic CO2-fixation cycle. Msed_2055
  transcription is induced under autotrophic growth. The overlapping downstream gene
  Msed_2056 encodes a MeaB/ArgK-like G-protein, a candidate cofactor-loading chaperone.
existing_annotations:
- term:
    id: GO:0016853
    label: isomerase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR006159
  review:
    summary: InterPro2GO mapping from the MCM C-terminal B12-binding domain signature
      (IPR006159, Acid_CoA_mut_C) to the EC 5 isomerase class. Msed_2055 is that domain
      alone, as a separate subunit of the M. sedula alpha2beta2 mutase.
    action: MODIFY
    reason: The essence is right but the term is too general and is placed on the wrong
      unit. Methylmalonyl-CoA mutase (EC 5.4.99.2) is an isomerase, and Msed_2055 does
      part of the work, since it holds the adenosylcobalamin whose radical chemistry
      drives the rearrangement. However, the activity belongs to the alpha2beta2 complex.
      The substrate-binding TIM barrel is on Msed_0638, and active enzyme was obtained
      only when both subunits were coexpressed (PMID:22752162). This is the
      whole-complex-on-one-subunit pattern (ARCHAEA pattern 16). The replacement is the
      specific activity, GO:0004494 methylmalonyl-CoA mutase activity, which this review
      records in core_functions as contributes_to rather than as an independent activity.
      The subunit's own activity is cobalamin binding (GO:0031419).
    proposed_replacement_terms:
    - id: GO:0004494
      label: methylmalonyl-CoA mutase activity
