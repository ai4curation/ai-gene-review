    supporting_text: This intermediate was reduced to 4-hydroxybutyrate and converted into
      two acetyl-CoA molecules via 4-hydroxybutyryl-CoA dehydratase.
  reference_review:
    relevance: MEDIUM
    correctness: MISCITED
    review_notes: PubMed-verified; the cached copy is abstract-only. UniProt cites this paper
      (ECO:0000269) for the Msed_1424 FUNCTION and for EC 1.2.1.76 catalytic activity. The
      abstract establishes the pathway but does not assign any gene to the succinyl-CoA reductase
      step. The later full study (PMID:19684143) identifies Msed_1424 as succinic semialdehyde
      reductase and Msed_0709 as the succinyl-CoA reductase. The supplementary data, which
      might contain a gene assignment, were not checked.
