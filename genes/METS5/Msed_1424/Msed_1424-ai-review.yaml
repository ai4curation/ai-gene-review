id: A4YGN0
gene_symbol: Msed_1424
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:399549
  label: Metallosphaera sedula DSM 5348
description: >-
  Msed_1424 encodes the NADPH-dependent succinic semialdehyde reductase (SSR) of the
  thermoacidophilic crenarchaeon Metallosphaera sedula. It reduces succinate semialdehyde
  to 4-hydroxybutyrate in the second, acetyl-CoA-regenerating half of the
  3-hydroxypropionate/4-hydroxybutyrate autotrophic CO2-fixation cycle of the Sulfolobales.
  The enzyme was purified from autotrophically grown cells, identified by peptide mass
  fingerprinting, and characterized as a recombinant protein. It is a homodimeric
  medium-chain, zinc-containing alcohol dehydrogenase with about two zinc ions per subunit,
  one at a catalytic site and one at a structural site. It strongly prefers NADPH over NADH,
  is specific for succinate semialdehyde (it does not reduce malonic semialdehyde or simple
  aliphatic aldehydes), and its activity is detectable only in autotrophically grown cells.
  The gene lies two genes downstream of the acryloyl-CoA reductase gene. The preceding step,
  reduction of succinyl-CoA to succinate semialdehyde, is catalysed by a different enzyme,
  the malonyl-CoA/succinyl-CoA reductase Msed_0709. Close homologs act as succinic
  semialdehyde reductases in other autotrophic Sulfolobales and in Thermoproteus.
existing_annotations:
- term:
    id: GO:0008270
    label: zinc ion binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR002328
  review:
    summary: InterPro2GO mapping from the zinc-containing alcohol dehydrogenase signature
      (IPR002328, PROSITE PS00059). Msed_1424 is a medium-chain zinc alcohol dehydrogenase,
      and zinc was measured directly in the purified recombinant enzyme.
    action: ACCEPT
    reason: The protein belongs to the zinc-containing alcohol dehydrogenase family, not
      the aldehyde dehydrogenase family, so the InterPro mapping is appropriate. Metal analysis
      of the purified enzyme found 1.9 mol of zinc per monomer and no other metal. The conserved
      catalytic-site ligands (Cys38, the GHE motif at 58-60, Cys165) and the structural-site
      cysteine cluster (Cys89, 92, 95, 103) are present (PMID:19684143), matching the UniProt
      binding-site features. EDTA did not remove the zinc, which the authors attribute to
      the thermostability of the enzyme rather than to a lack of zinc dependence. Zinc binding
      is the cofactor binding that underlies the catalytic activity, so the term is accepted.
    supported_by:
    - reference_id: PMID:19684143
      supporting_text: Metal analysis (27 elements) of succinic semialdehyde reductase using
        plasma emission spectroscopy revealed the presence of 1.9 mol of zinc per mol of
        enzyme monomer, whereas other metals could not be detected.
    - reference_id: PMID:19684143
      supporting_text: Apparently, both zinc binding sites are loaded with zinc since the
        enzyme contains 1.9 mol of zinc per mol of enzyme monomer.
    - reference_id: file:METS5/Msed_1424/Msed_1424-uniprot.txt
      supporting_text: 'SIMILARITY: Belongs to the zinc-containing alcohol dehydrogenase
        family.'
- term:
    id: GO:0016491
    label: oxidoreductase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR002328
  - InterPro:IPR020843
  review:
    summary: Correct but very general. The enzyme catalyses succinate semialdehyde + NADPH
      + H+ = 4-hydroxybutanoate + NADP+ (RHEA:26381), an NADP-dependent alcohol dehydrogenase
      reaction run in the reductive direction.
    action: MODIFY
    reason: The activity has been measured on the purified native and recombinant enzyme
      (PMID:19684143), so a much more specific term is supported. The authors classify the
      enzyme as EC 1.1.1.2, which GO represents as GO:0008106 alcohol dehydrogenase (NADP+)
      activity. 4-Hydroxybutanoate is a primary alcohol and succinate semialdehyde its aldehyde,
      so the reaction is an instance of that term. GO:0047577 4-hydroxybutyrate dehydrogenase
      activity is not suitable, because it is defined with NAD+ as the acceptor, and this
      enzyme strongly prefers NADPH (apparent Km 6 uM, versus 180 uM for NADH). GO has no
      term for the NADP+ reaction (RHEA:26381 has no GO cross-reference), so a child term
      is proposed in proposed_new_terms. Note that UniProt names this protein succinate-semialdehyde
      dehydrogenase (acetylating), EC 1.2.1.76, which is the succinyl-CoA reductase reaction.
      That is the preceding step of the cycle, and it is catalysed by Msed_0709, not by
      Msed_1424; the replacement term deliberately does not follow the UniProt name.
    proposed_replacement_terms:
    - id: GO:0008106
      label: alcohol dehydrogenase (NADP+) activity
    supported_by:
    - reference_id: PMID:19684143
      supporting_text: Succinic semialdehyde is then reduced with NADPH to 4-hydroxybutyrate
        by succinic semialdehyde reductase, an enzyme belonging to the Zn-dependent alcohol
        dehydrogenase family.
    - reference_id: PMID:19684143
      supporting_text: Succinic semialdehyde reductase (EC 1.1.1.2) (Fig. 1 ) strongly prefers
        NADPH as the electron donor and does not act on malonic semialdehyde.
    - reference_id: PMID:19684143
      supporting_text: the apparent K m for succinic semialdehyde (determined with NADPH)
        was 52 ± 8 μM, the apparent K m for NADPH was 6 ± 2 μM, and the apparent K m for
        NADH was 180 ± 25 μM.
- term:
    id: GO:0015977
    label: carbon fixation
  evidence_type: IDA
  original_reference_id: PMID:19684143
  review:
    summary: Msed_1424 catalyses the reduction of succinate semialdehyde to 4-hydroxybutyrate,
      a step of the 3-hydroxypropionate/4-hydroxybutyrate autotrophic CO2-fixation cycle of
      M. sedula. Its activity is detectable only in autotrophically grown cells.
    action: NEW
    reason: The enzyme itself catalyses a step of the cycle, so it passes the participation
      test. The native enzyme was purified from autotrophic cells and identified as Msed_1424.
      Its activity is absent from heterotrophically grown cells, and the gene sits next to
      the acryloyl-CoA reductase gene of the same cycle. This matches the treatment of the
      other catalytic steps of the cycle, such as Msed_0709, which carries the same term.
      GO:0043427 carbon fixation by 3-hydroxypropionate cycle is defined as the Chloroflexus
      glyoxylate-forming cycle, which has no 4-hydroxybutyrate branch. It is therefore not
      used here; the parent term GO:0015977 is the most precise correct existing term. A
      3HP/4HB-cycle child term is proposed, using the same wording as the Msed_0709 review.
    supported_by:
    - reference_id: PMID:19684143
      supporting_text: The best hit was with the gene gi|146304190 (100% identity, 65% coverage)
        annotated as a Zn-dependent alcohol dehydrogenase gene encoding a 37.9-kDa protein
        (Msed_1424; 360 amino acids).
    - reference_id: PMID:19684143
      supporting_text: No (<0.01 μmol min −1 mg −1 of protein) succinic semialdehyde-dependent
        oxidation of NADPH or NADH was observed with heterotrophically grown cells.
    - reference_id: PMID:18079405
      supporting_text: This intermediate was reduced to 4-hydroxybutyrate and converted
        into two acetyl-CoA molecules via 4-hydroxybutyryl-CoA dehydratase.
references:
- id: GO_REF:0000002
  title: Gene Ontology annotation through association of InterPro records with GO
