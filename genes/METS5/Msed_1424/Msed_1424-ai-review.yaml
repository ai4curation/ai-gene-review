core_functions:
- description: NADPH-dependent reduction of succinate semialdehyde to 4-hydroxybutyrate
    (RHEA:26381), the step of the 3-hydroxypropionate/4-hydroxybutyrate CO2-fixation cycle
    that follows succinyl-CoA reduction by Msed_0709. A zinc-containing medium-chain alcohol
    dehydrogenase, specific for succinate semialdehyde and strongly preferring NADPH.
  proposed_molecular_function: succinate-semialdehyde reductase (NADPH) activity
  directly_involved_in:
  - id: GO:0015977
    label: carbon fixation
  substrates:
  - id: CHEBI:57706
    label: succinate semialdehyde
  supported_by:
  - reference_id: PMID:19684143
    supporting_text: Succinic semialdehyde is then reduced with NADPH to 4-hydroxybutyrate
      by succinic semialdehyde reductase, an enzyme belonging to the Zn-dependent alcohol
      dehydrogenase family.
  - reference_id: PMID:19684143
    supporting_text: The succinic semialdehyde reductase gene Msed_1424 was expressed in
      E. coli Rosetta 2(DE3).
proposed_new_terms:
- proposed_name: succinate-semialdehyde reductase (NADPH) activity
  proposed_definition: 'Catalysis of the reaction: succinate semialdehyde + NADPH + H+ =
    4-hydroxybutanoate + NADP+.'
  justification: This reaction is RHEA:26381 (EC 1.1.1.n11), which has no GO term; Rhea writes
    its undirected master reaction in the oxidative direction, and the definition is given in
    the physiological (reductive) direction that the name follows. GO:0047577
    4-hydroxybutyrate dehydrogenase activity covers only the NAD+ reaction (RHEA:23948).
    The NADPH-dependent enzyme catalyses the 4-hydroxybutyrate-forming step of the 3-hydroxypropionate/4-hydroxybutyrate
    and dicarboxylate/4-hydroxybutyrate cycles (M. sedula Msed_1424, T. neutrophilus Tneu_0419).
    An NAD(P)-agnostic grouping term could be considered as a common parent with GO:0047577.
  proposed_parent:
    id: GO:0008106
    label: alcohol dehydrogenase (NADP+) activity
  supported_by:
  - reference_id: PMID:19684143
    supporting_text: Succinic semialdehyde reductase (EC 1.1.1.2) (Fig. 1 ) strongly prefers
      NADPH as the electron donor and does not act on malonic semialdehyde.
- proposed_name: carbon fixation by 3-hydroxypropionate/4-hydroxybutyrate cycle
  proposed_definition: An autotrophic carbon dioxide fixation pathway in which acetyl-CoA
    is carboxylated twice by acetyl-CoA/propionyl-CoA carboxylase, and the products are
    reductively converted via 3-hydroxypropionate and succinyl-CoA to 4-hydroxybutyrate.
    4-Hydroxybutyrate is then converted via 4-hydroxybutyryl-CoA dehydratase into two
    molecules of acetyl-CoA. The pathway occurs in autotrophic Sulfolobales and in ammonia-oxidizing
    Thaumarchaeota.
  justification: GO:0043427 carbon fixation by 3-hydroxypropionate cycle is defined as
    the Chloroflexus cycle that releases glyoxylate via malyl-CoA cleavage. The archaeal
    cycle shares only the first half with it and regenerates acetyl-CoA via 4-hydroxybutyrate,
    the branch to which Msed_1424 belongs. The same term is proposed in the Msed_0709 review.
  proposed_parent:
    id: GO:0015977
    label: carbon fixation
  supported_by:
  - reference_id: PMID:18079405
    supporting_text: This intermediate was reduced to 4-hydroxybutyrate and converted into
      two acetyl-CoA molecules via 4-hydroxybutyryl-CoA dehydratase.
suggested_questions:
- question: Can UniProt correct A4YGN0's name, EC and catalytic activity from succinate-semialdehyde
    dehydrogenase (acetylating), EC 1.2.1.76 (RHEA:26450), to succinic semialdehyde reductase
    (NADPH), RHEA:26381, as shown by PMID:19684143? Do Sulfolobales orthologs named by
    rules carry the same misassignment?
- question: Should GO create a term for RHEA:26381 (NADPH-dependent succinate semialdehyde
    reduction to 4-hydroxybutyrate) rather than leaving such enzymes at GO:0008106 alcohol
    dehydrogenase (NADP+) activity?
- question: Is the structural zinc essential for activity or only for stability, given
    that EDTA did not remove zinc from this thermostable enzyme?
suggested_experiments:
- hypothesis: Msed_1424 is required for autotrophic but not heterotrophic growth of M.
    sedula.
  description: Delete Msed_1424 with a Sulfolobales genetic system and compare growth on
    CO2/H2 with growth on yeast extract. Test whether 4-hydroxybutyrate supplementation or
    complementation with Msed_1424 restores autotrophic growth.
- hypothesis: Both zinc sites are needed, the catalytic site for activity and the structural
    site for stability.
  description: Mutate the catalytic-site ligands (Cys38, His59, Cys165) and the structural-site
    cysteines (Cys89, 92, 95, 103) of recombinant Msed_1424. Measure succinate semialdehyde
    reductase activity, zinc content and thermal stability of each mutant.
