- id: PMID:19684143
  title: 'Malonic semialdehyde reductase, succinic semialdehyde reductase, and succinyl-coenzyme
    A reductase from Metallosphaera sedula: enzymes of the autotrophic 3-hydroxypropionate/4-hydroxybutyrate
    cycle in Sulfolobales.'
  findings:
  - statement: Msed_1424 is the succinic semialdehyde reductase, identified by purification
      from autotrophic M. sedula and peptide mass fingerprinting.
    supporting_text: The best hit was with the gene gi|146304190 (100% identity, 65% coverage)
      annotated as a Zn-dependent alcohol dehydrogenase gene encoding a 37.9-kDa protein
      (Msed_1424; 360 amino acids).
  - statement: The recombinant enzyme is a highly active, homodimeric, NADPH-preferring
      reductase.
    supporting_text: The purified enzyme catalyzed the expected reaction at a rate of 700
      μmol min −1 mg −1 protein at 65°C.
  - statement: The enzyme contains about two zinc ions per monomer.
    supporting_text: Metal analysis (27 elements) of succinic semialdehyde reductase using
      plasma emission spectroscopy revealed the presence of 1.9 mol of zinc per mol of
      enzyme monomer, whereas other metals could not be detected.
  - statement: The succinyl-CoA reductase step is catalysed by Msed_0709, not by Msed_1424.
    supporting_text: Interestingly, succinyl-CoA reductase turned out to be identical to
      malonyl-CoA reductase.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified, full text cached (PMC2753041). This is the primary characterization
      of Msed_1424. It contradicts the UniProt name and EC 1.2.1.76.
