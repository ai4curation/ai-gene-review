  review:
    summary: The acetyl-CoA/propionyl-CoA carboxylase is the CO2-fixing enzyme of the
      3-hydroxypropionate/4-hydroxybutyrate cycle. The gamma subunit makes the C-C bond that attaches the
      fixed carboxyl group to the acyl-CoA.
    action: NEW
    reason: The subunit catalyses the bond-forming step of both carboxylations, so it does the work of
      the fixation step and passes the participation test. The comparators are the other catalytic
      proteins of the cycle, such as Msed_0709, which carry GO:0015977 in their reviews. GO:0043427 is the
      Chloroflexus glyoxylate-forming cycle and is not used. A specific 3HP/4HB-cycle child term is
      proposed in the Msed_0709 review. Until it exists, GO:0015977 is the most precise correct term.
    supported_by:
