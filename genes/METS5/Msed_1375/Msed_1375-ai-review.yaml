  qualifier: enables
  supporting_entities:
  - PANTHER:PTN000523576
  review:
    summary: TreeGrafter transfer of propionyl-CoA carboxylase activity from the PANTHER PCC
      beta-chain family node (PTHR43842) onto the carboxyltransferase subunit.
    action: MARK_AS_OVER_ANNOTATED
    reason: The M. sedula enzyme has propionyl-CoA carboxylase activity, but the full reaction (ATP +
      propionyl-CoA + bicarbonate to methylmalonyl-CoA) is a property of the alpha-beta-gamma complex,
      not of this polypeptide. The gamma subunit carries out only the carboxyl-transfer half-reaction. It
      cannot use ATP or carboxylate biotin itself, and it needs the biotinylated carrier subunit.
      Assigning the whole-enzyme activity to the subunit alone overstates its function. The row is not
      removed, because the subunit does take part in the activity. Its contribution is recorded in
      core_functions as contributes_to GO:0004658, beside the equal acetyl-CoA carboxylase activity
      (NEW row below), which this PCC-beta family node does not capture. The subunit's own activity is a
      carboxyltransferase, proposed as GO:0016743 on the ligase row. This follows the
      treatment of the bacterial AccD carboxyltransferase subunit in genes/PSEPK/accD.
    supported_by:
    - reference_id: PMID:12581213
      supporting_text: The enzyme consists of two large subunits of 57 kDa each representing biotin
        carboxylase (alpha) and carboxytransferase (gamma), respectively, and a small 18.6 kDa biotin
        carrier protein (beta).
    - reference_id: PMID:12533469
      supporting_text: The acyl-CoA-binding site and the carboxybiotin-binding site were found in the
        carboxyltransferase subunit.
