suggested_questions:
- question: GO has no term for the acyl-CoA carboxytransferase half-reaction of biotin-dependent
    carboxylases (carboxybiotin-[carrier protein] + acetyl-CoA or propionyl-CoA = biotin-[carrier
    protein] + malonyl-CoA or methylmalonyl-CoA; EC 2.1.3.15 for acetyl-CoA). Should one be created as a
    child of GO:0016743, by analogy with GO:0004075 for the biotin carboxylase half-reaction?
- question: The PANTHER PCC beta-chain node (PTN000523576) propagates propionyl-CoA carboxylase activity
    with enables to carboxyltransferase subunits. Should TreeGrafter and PAINT annotations of CT subunits
    use contributes_to? And should the archaeal bifunctional clade also carry acetyl-CoA carboxylase
    activity?
- question: Which residues of the gamma subunit allow it to accept acetyl-CoA and propionyl-CoA equally,
    when bacterial AccD/AccA and mitochondrial PCCB are substrate-selective?
suggested_experiments:
- hypothesis: The gamma subunit alone catalyses carboxyl transfer between a carboxylated acyl-CoA and
    biotin, and its own substrate preference matches that of the holoenzyme.
  description: Express soluble Msed_1375 (for example in P. furiosus or Sulfolobus acidocaldarius) and
    assay the reverse half-reaction, malonyl-CoA or methylmalonyl-CoA + free biotin to acyl-CoA +
    carboxybiotin, with kinetic constants for both acyl-CoAs.
