  review:
    summary: InterPro2GO mapping from the CoA carboxyltransferase C-terminal domain (IPR011763) to the
      generic ligase class, reflecting the EC 6.4.1 classification of the whole carboxylase.
    action: MODIFY
    reason: The ATP-coupled ligation in the carboxylase reaction belongs to the biotin carboxylase
      subunit. The CoA carboxyltransferase domains of this subunit catalyse a carboxyl transfer from
      carboxybiotin to acetyl-CoA or propionyl-CoA, which is a transferase reaction (UniProt keyword
      Transferase). For this subunit, the ligase term describes the complex, not the subunit's own
      chemistry. This is a lateral correction. The subunit-level activity is best captured by
      GO:0016743 carboxyl- or carbamoyltransferase activity, because GO has no specific term for the
      acyl-CoA carboxytransferase half-reaction. The whole-enzyme ligase activities are captured by the
      contributes_to rows.
    proposed_replacement_terms:
