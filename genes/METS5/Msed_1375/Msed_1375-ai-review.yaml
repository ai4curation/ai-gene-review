id: A4YGI1
gene_symbol: Msed_1375
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:399549
  label: Metallosphaera sedula DSM 5348
description: >-
  Msed_1375 encodes the carboxyltransferase (gamma) subunit of the acetyl-CoA/propionyl-CoA carboxylase
  of the thermoacidophilic crenarchaeon Metallosphaera sedula. This biotin-dependent enzyme catalyses
  both carboxylations of the 3-hydroxypropionate/4-hydroxybutyrate autotrophic CO2-fixation cycle:
  acetyl-CoA to malonyl-CoA and propionyl-CoA to (S)-methylmalonyl-CoA, at similar rates. The purified
  holoenzyme is a complex of about 560 kDa, probably (alpha beta gamma)4. It is made of the biotin
  carboxylase (Msed_0147), the biotin carboxyl carrier protein (Msed_0148) and this 57 kDa
  carboxyltransferase, which is encoded at a separate locus. The protein is a single-chain
  carboxyltransferase of the propionyl-CoA carboxylase beta type, with N- and C-terminal CoA
  carboxyltransferase domains on a crotonase fold. In the complex it performs the second half-reaction:
  it transfers the carboxyl group from carboxybiotin on the carrier subunit to the acyl-CoA. Sequence
  analysis of the Acidianus brierleyi ortholog places the acyl-CoA and carboxybiotin binding sites in
  this subunit, so it is the subunit that sets the dual acetyl-CoA/propionyl-CoA specificity. The gene
  is strongly induced under autotrophic growth.
existing_annotations:
- term:
    id: GO:0004658
    label: propionyl-CoA carboxylase activity
  evidence_type: IEA
