- id: PMID:34290692
  title: (S)-3-Hydroxybutyryl-CoA Dehydrogenase From the Autotrophic 3-Hydroxypropionate/4-Hydroxybutyrate
    Cycle in Nitrosopumilus maritimus.
  findings:
  - statement: Compares Msed_1423 with the thaumarchaeal enzyme Nmar_1028; Msed_1423 has
      the highest Vmax and lowest Km among the characterised M. sedula enzymes.
    supporting_text: Msed_1423 is the main (S)-3-hydroxybutyryl-CoA dehydrogenase in M.
      sedula with the highest Vmax value (96 U mg–1 protein) and the lowest Km value (5
      μM) to its substrate (Table 3).
  - statement: Msed_1423, Nmar_1028 and the Msed_0399 dehydrogenase domain are
      homologous but are proposed to have been recruited independently.
    supporting_text: It appears that despite their homology, these three proteins
      evolved independently from each other, confirming the proposed convergent
      evolution of HP/HB cycle in Cren- and Thaumarchaeota.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text cached (PMC8287830). Characterises the Nitrosopumilus
      ortholog-level homolog and places Msed_1423 phylogenetically; the Msed_1423
      kinetic values are taken from PMID:32218776.
