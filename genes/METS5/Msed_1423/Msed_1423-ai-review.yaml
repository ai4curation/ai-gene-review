id: A4YGM9
gene_symbol: Msed_1423
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:399549
  label: Metallosphaera sedula DSM 5348
description: >-
  Msed_1423 encodes a 391-residue monofunctional (S)-3-hydroxybutyryl-CoA dehydrogenase
  of the thermoacidophilic crenarchaeon Metallosphaera sedula. It has an N-terminal
  Rossmann-fold NAD-binding domain followed by two 3-hydroxyacyl-CoA dehydrogenase
  C-terminal domains, the architecture of the bacterial Hbd/FadB'-type short-chain
  3-hydroxyacyl-CoA dehydrogenases, and it lacks the enoyl-CoA hydratase domain of its
  bifunctional paralog Msed_0399. The purified recombinant enzyme oxidises
  (S)-3-hydroxybutyryl-CoA to acetoacetyl-CoA with NAD+. It has a very low Km for
  (S)-3-hydroxybutyryl-CoA (about 5 uM) and for NAD+ (about 30 uM). NADP+ is accepted
  only with a Km of about 5 mM, so the enzyme is effectively NAD+-specific, and it is
  inactive with the C8 substrate (S)-3-hydroxyoctanoyl-CoA. Its catalytic efficiency is
  about 20-fold higher than that of Msed_0399, its gene is up-regulated under
  autotrophic and mixotrophic growth, and it lies in a gene cluster with other enzymes
  of the 3-hydroxypropionate/4-hydroxybutyrate CO2-fixation cycle (succinic
  semialdehyde reductase Msed_1424 and acryloyl-CoA reductase Msed_1426). Homologs are
  present in almost all Sulfolobales and are missing only from the heterotrophic
  Sulfolobus acidocaldarius. Msed_1423 is therefore considered the main enzyme for the
  (S)-3-hydroxybutyryl-CoA dehydrogenase step in the acetyl-CoA-regenerating half of
  this cycle. The protein is presumed cytoplasmic.
existing_annotations:
- term:
    id: GO:0003857
    label: (3S)-3-hydroxyacyl-CoA dehydrogenase (NAD+) activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000003
  qualifier: enables
  supporting_entities:
  - EC:1.1.1.35
  review:
    summary: EC-to-GO mapping from the EC 1.1.1.35 number that the genome submission
      gave this protein.
    action: ACCEPT
    reason: Confirmed by direct biochemistry on the purified recombinant protein. It
      catalyses the NAD-dependent oxidation of (S)-3-hydroxybutyryl-CoA to
      acetoacetyl-CoA with a Km of 5 uM, and its Km for NAD+ (0.03 mM) is about
      170-fold lower than for NADP+ (5.1 mM), so its catalytic efficiency with NAD+ is
      about 160-fold higher (PMID:32218776, Table 3). GO:0003857 is defined as a
      (3S)-3-hydroxyacyl-CoA + NAD+ = a 3-oxoacyl-CoA + NADH + H+, which fits both the
      cofactor and the (S) substrate. GO:0008691 3-hydroxybutyryl-CoA dehydrogenase
      activity is not the right alternative, because GO defines it with NADP+ (EC
      1.1.1.157). The enzyme is inactive with the C8 (S)-3-hydroxyacyl-CoA, so its
      substrate range is narrower than the generic term implies. GO has no
      NAD+-specific (S)-3-hydroxybutanoyl-CoA child, so GO:0003857 is as precise as GO
      allows. The (R) stereoisomer was not reported as tested for this enzyme. This is
      the core molecular function, and the same term is used for the paralog Msed_0399
      and for the module's hbdh step.
    supported_by:
    - reference_id: PMID:32218776
      supporting_text: The purified recombinant Msed_0389 and Msed_1423 catalyzed the
        NAD-dependent oxidation of (S)-3-hydroxybutyryl-CoA to acetoacetyl-CoA and were
        highly specific for their substrate (Km 2.6 and 5 μM, respectively; Table 3).
    - reference_id: PMID:32218776
      supporting_text: Both enzymes were not active with (S)-3-hydroxyoctanoyl-CoA.
    - reference_id: PMID:34290692
      supporting_text: Msed_1423 is the main (S)-3-hydroxybutyryl-CoA dehydrogenase in
        M. sedula with the highest Vmax value (96 U mg–1 protein) and the lowest Km
        value (5 μM) to its substrate (Table 3).
- term:
    id: GO:0006631
    label: fatty acid metabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR006108
  - InterPro:IPR006176
  review:
    summary: InterPro2GO mapping of the 3-hydroxyacyl-CoA dehydrogenase NAD-binding
      (IPR006176) and C-terminal (IPR006108) domains to fatty acid metabolic process.
    action: MARK_AS_OVER_ANNOTATED
    reason: This is a family-level transfer from the 3-hydroxyacyl-CoA dehydrogenase
      family, most of whose members act in fatty acid beta-oxidation. The evidence for
      Msed_1423 points the other way. It is inactive with (S)-3-hydroxyoctanoyl-CoA,
      unlike the bifunctional paralog Msed_0399, which is the only M. sedula
      3-hydroxyacyl-CoA dehydrogenase active with C8 substrates (PMID:32218776). Its
      gene lies in a cluster with specific enzymes of the
      3-hydroxypropionate/4-hydroxybutyrate cycle, whereas its paralog Msed_0389
      clusters with beta-oxidation genes. The gene is up-regulated in autotrophic cells
      and is absent only from the heterotroph S. acidocaldarius. Its demonstrated
      physiological process is therefore autotrophic carbon fixation. The enzyme does
      handle a C4 acyl-CoA, and a minor role in short-chain acyl-CoA metabolism during
      heterotrophic growth has not been excluded, so the term is marked as an
      over-annotation rather than removed.
    supported_by:
    - reference_id: PMID:32218776
      supporting_text: Importantly, Msed_0399 is the only 3-hydroxyacyl-CoA dehydrogenase
        that was active with C8 (3-hydroxy)acyl-CoAs (Tables 2, 3), further suggesting
        its participation in heterotrophic metabolism.
    - reference_id: PMID:32218776
      supporting_text: The Msed_0389 gene clustered together with various β-oxidation
        genes in the M. sedula genome. In contrast, msed_1423 clustered with several
        genes encoding specific enzymes of the HP/HB cycle, suggesting its involvement
        in autotrophic CO2 fixation (Figure 2).
