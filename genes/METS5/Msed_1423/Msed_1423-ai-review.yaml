    label: carbon fixation
  evidence_type: IDA
  original_reference_id: PMID:32218776
  review:
    summary: Msed_1423 catalyses the (S)-3-hydroxybutyryl-CoA dehydrogenase step in the
      acetyl-CoA-regenerating half of the 3-hydroxypropionate/4-hydroxybutyrate
      autotrophic CO2-fixation cycle of M. sedula.
    action: NEW
    reason: The enzyme itself catalyses a step of the cycle, so it passes the
      participation test. Its role in the cycle rests on kinetics of the purified
      enzyme, up-regulation in autotrophic cells, clustering with the cycle genes
      Msed_1424 and Msed_1426, and its near-universal distribution in autotrophic
      Sulfolobales (PMID:32218776). It is inferred rather than shown with a mutant.
      Comparators in the same role (catalysts of cycle steps) carry this term in their
      reviews; for example Msed_2001 (crotonyl-CoA hydratase) and Msed_0709
      (malonyl-CoA/succinyl-CoA reductase) both have GO:0015977 as NEW. GO:0043427
      carbon fixation by 3-hydroxypropionate cycle is defined as the Chloroflexus
      glyoxylate-forming cycle, which does not include this step, so it is not used. A
      specific 3HP/4HB-cycle child term is proposed instead, and the parent GO:0015977
      is the most precise correct existing term.
    supported_by:
    - reference_id: PMID:32218776
      supporting_text: show that Msed_1423 is the main (S)-3-hydroxybutyryl-CoA
        dehydrogenase in the HP/HB cycle in Sulfolobales.
    - reference_id: PMID:32218776
      supporting_text: This protein is clustered together with two specific enzymes of
        the HP/HB cycle, succinic semialdehyde reductase Msed_1424 and acryloyl-CoA
        reductase Msed_1426 (Figure 2B), further supporting its involvement in
        autotrophic CO2 fixation.
    - reference_id: PMID:33472982
      supporting_text: in M. sedula, the (S)-3-hydroxybutyryl-CoA dehydrogenase
        reaction is primarily catalyzed by Msed_1423 (which is universally found in
        autotrophic Sulfolobales)
