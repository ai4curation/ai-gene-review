proposed_new_terms:
- proposed_name: carbon fixation by 3-hydroxypropionate/4-hydroxybutyrate cycle
  proposed_definition: An autotrophic carbon dioxide fixation pathway in which acetyl-CoA
    is carboxylated twice by acetyl-CoA/propionyl-CoA carboxylase, and the products are
    reductively converted via 3-hydroxypropionate and succinyl-CoA to 4-hydroxybutyrate.
    4-Hydroxybutyrate is then converted via 4-hydroxybutyryl-CoA dehydratase into two
    molecules of acetyl-CoA. The pathway occurs in autotrophic Sulfolobales and in
    ammonia-oxidizing Thaumarchaeota.
  justification: GO:0043427 carbon fixation by 3-hydroxypropionate cycle is defined as
    the Chloroflexus cycle that releases glyoxylate via malyl-CoA cleavage. The archaeal
    3HP/4HB cycle shares only the first half of that route, uses unrelated enzymes for
    it, and regenerates acetyl-CoA via 4-hydroxybutyrate, crotonyl-CoA and
    (S)-3-hydroxybutyryl-CoA. Msed_1423 catalyses the (S)-3-hydroxybutyryl-CoA
    dehydrogenase step of that regeneration half, which has no counterpart in the
    Chloroflexus cycle. This proposal repeats the one in the Msed_0709 review.
  proposed_parent:
    id: GO:0015977
    label: carbon fixation
  supported_by:
  - reference_id: PMID:18079405
    supporting_text: converted into two acetyl-CoA molecules via 4-hydroxybutyryl-CoA
      dehydratase.
suggested_questions:
- question: Msed_1423 accepts NADP+ with a similar Vmax but a 170-fold higher Km (5.1 mM
    versus 0.03 mM for NAD+). Is the enzyme strictly NAD+-dependent in vivo, given
    cellular NAD+/NADP+ ratios in M. sedula, so that GO:0003857 rather than GO:0008691
    (NADP+-defined) is the correct activity term for the cycle step?
- question: PANTHER places Msed_1423 in PTHR48075:SF5 (3-hydroxybutyryl-CoA
    dehydrogenase), and InterPro2GO maps its domains to fatty acid metabolic process.
    Should the IPR006108/IPR006176 to GO:0006631 mapping be restricted, since many
    archaeal members of this family are short-chain enzymes of autotrophic cycles that
    do not act on fatty acids longer than C4?
suggested_experiments:
- hypothesis: Msed_1423 is required for autotrophic growth but not for heterotrophic
    growth.
  description: Delete the Msed_1423 ortholog in a genetically tractable autotrophic
    Sulfolobales species and compare autotrophic and heterotrophic growth, measuring
    (S)-3-hydroxybutyryl-CoA dehydrogenase activity in extracts of the mutant.
- hypothesis: Msed_1423 is specific for the (S) stereoisomer and for C4 substrates.
  description: Assay purified Msed_1423 with (R)-3-hydroxybutyryl-CoA and with C6
    (S)-3-hydroxyhexanoyl-CoA to define its stereospecificity and chain-length limit.
