- id: PMID:32218776
  title: Enzymes Catalyzing Crotonyl-CoA Conversion to Acetoacetyl-CoA During the Autotrophic
    CO(2) Fixation in Metallosphaera sedula.
  findings:
  - statement: Purified recombinant Msed_1423 oxidises (S)-3-hydroxybutyryl-CoA to
      acetoacetyl-CoA with NAD+, with a Km of 5 uM for the substrate.
    supporting_text: The purified recombinant Msed_0389 and Msed_1423 catalyzed the
      NAD-dependent oxidation of (S)-3-hydroxybutyryl-CoA to acetoacetyl-CoA and were
      highly specific for their substrate (Km 2.6 and 5 μM, respectively; Table 3).
  - statement: Msed_1423 is inactive with the C8 substrate (S)-3-hydroxyoctanoyl-CoA.
    supporting_text: Both enzymes were not active with (S)-3-hydroxyoctanoyl-CoA.
  - statement: Its catalytic efficiency is about 20-fold higher than that of Msed_0399.
    supporting_text: Their kcat/Km values were 3- and 20-fold higher than the
      corresponding value of Msed_0399 in (S)-3-hydroxybutyryl-CoA dehydrogenase
      reaction (Table 3).
  - statement: The gene clusters with specific HP/HB-cycle genes (Msed_1424, Msed_1426).
    supporting_text: This protein is clustered together with two specific enzymes of
      the HP/HB cycle, succinic semialdehyde reductase Msed_1424 and acryloyl-CoA
      reductase Msed_1426 (Figure 2B), further supporting its involvement in
      autotrophic CO2 fixation.
  - statement: Msed_1423 homologs are (almost) universal in Sulfolobales and absent only
      from the heterotroph S. acidocaldarius.
    supporting_text: The only two genes that are (almost) universally distributed in
      Sulfolobales are the crotonase Msed_0566 gene and the dehydrogenase Msed_1423 gene
  - statement: Msed_1423 is the main (S)-3-hydroxybutyryl-CoA dehydrogenase of the cycle.
    supporting_text: show that Msed_1423 is the main (S)-3-hydroxybutyryl-CoA
      dehydrogenase in the HP/HB cycle in Sulfolobales.
  - statement: Msed_1423 is estimated at about 1.7% of total cellular protein.
    supporting_text: Comparison of the activities of the characterized
      (S)-3-hydroxybutyryl-CoA dehydrogenase Msed_1423 and crotonase Msed_0384 with the
      activities of these reactions in cell extract of M. sedula leads to the values 1.7
      and 7.1% of total cellular protein, respectively.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached (PMC7078158). The only experimental characterisation
      of Msed_1423. Table 3 gives Km 0.005 mM for (S)-3-hydroxybutyryl-CoA, 0.03 mM for
      NAD and 5.1 mM for NADP. The in-vivo role is inferred from kinetics, gene context,
      gene distribution and published transcriptomics, not from a mutant. Stereospecificity
      against the (R) isomer was not reported for this enzyme.
