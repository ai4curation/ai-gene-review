proposed_new_terms:
- proposed_name: carbon fixation by 3-hydroxypropionate/4-hydroxybutyrate cycle
  proposed_definition: An autotrophic carbon dioxide fixation pathway in which acetyl-CoA
    is carboxylated twice by acetyl-CoA/propionyl-CoA carboxylase, and the products are
    reductively converted via 3-hydroxypropionate and succinyl-CoA to 4-hydroxybutyrate.
    4-Hydroxybutyrate is then converted via 4-hydroxybutyryl-CoA dehydratase into two
    molecules of acetyl-CoA. The pathway occurs in autotrophic Sulfolobales and in
    ammonia-oxidizing Thaumarchaeota.
  justification: GO:0043427 carbon fixation by 3-hydroxypropionate cycle is defined
    as the Chloroflexus cycle that releases glyoxylate via malyl-CoA cleavage. The archaeal
    3HP/4HB cycle shares only the first half, which includes the methylmalonyl-CoA
    epimerase and mutase steps, and regenerates acetyl-CoA via 4-hydroxybutyrate. Its
    enzymes therefore have no specific process term. The same term is proposed in the
    Msed_0709 review.
  proposed_parent:
    id: GO:0015977
    label: carbon fixation
  supported_by:
  - reference_id: PMID:18079405
    supporting_text: This intermediate was reduced to 4-hydroxybutyrate and converted
      into two acetyl-CoA molecules via 4-hydroxybutyryl-CoA dehydratase.
suggested_questions:
- question: Does the MeaB/ArgK-like G-protein Msed_2056, whose ORF overlaps the MCM-beta
    gene Msed_2055, act as the cofactor-loading and repair chaperone of the M. sedula
    mutase, as MeaB does for bacterial MCM?
- question: Should GO represent the M. sedula mutase as a heteromeric complex, with
    Msed_0638 (catalytic) and Msed_2055 (B12-binding) each annotated as contributing to
    methylmalonyl-CoA mutase activity, given that neither subunit is active alone?
suggested_experiments:
- hypothesis: Methylmalonyl-CoA mutase (Msed_0638/Msed_2055) is required for autotrophic,
    but not heterotrophic, growth of M. sedula.
  description: Delete Msed_0638 or Msed_2055 with a Sulfolobales genetic system, and
    compare growth on CO2/H2 with growth on peptides or yeast extract. Test for
    accumulation of methylmalonyl-CoA under autotrophic conditions.
- hypothesis: Msed_2056 increases MCM activity or protects it from inactivation.
  description: Coexpress Msed_0638, Msed_2055 and Msed_2056. Measure MCM activity,
    adenosylcobalamin loading and the rate of inactivation during turnover, with and
    without GTP.
