  review:
    summary: Msed_0638 is the catalytic subunit (MCM-alpha) of the M. sedula
      methylmalonyl-CoA mutase. Recombinant MCM, coexpressed with the B12-binding subunit
      Msed_2055, is an alpha2beta2 heterotetramer with a specific activity of 2.2
      umol/min/mg at 75 C, and together with the epimerase Msed_0639 converts
      (S)-methylmalonyl-CoA to succinyl-CoA.
    action: ACCEPT
    reason: The electronic annotation is confirmed by direct biochemistry on the M.
      sedula protein (PMID:22752162). Msed_0638 carries the substrate-binding TIM barrel
      that holds the active site, so it is the catalytic subunit. Activity requires the
      partner subunit Msed_2055, which supplies the B12-binding domain; on its own
      Msed_0638 did not give soluble, active enzyme. The activity therefore belongs to the
      heterotetramer, and core_functions records it as a contribution to the complex
      activity. The term itself is the correct and most specific activity term.
    supported_by:
