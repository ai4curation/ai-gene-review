gene_symbol: Msed_0638
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:399549
  label: Metallosphaera sedula DSM 5348
description: >-
  Msed_0638 encodes the catalytic (alpha, large) subunit of the coenzyme B12-dependent
  methylmalonyl-CoA mutase (MCM) of the thermoacidophilic crenarchaeon Metallosphaera
  sedula. The 553-residue protein consists of the substrate-binding TIM-barrel domain of
  the MCM/isobutyryl-CoA mutase family and lacks the C-terminal B12-binding domain that is
  fused to it in bacterial and mitochondrial MCMs. That domain is supplied by a separate,
  remotely encoded subunit, Msed_2055 (MCM-beta), which carries the DXHXXG-SXL-GG
  cobalamin-binding motif. The recombinant enzyme is soluble and active only when both
  subunits are coexpressed, and forms an alpha2beta2 heterotetramer that converts
  (R)-methylmalonyl-CoA to succinyl-CoA. Together with the adjacent methylmalonyl-CoA
  epimerase gene Msed_0639, it converts the (S)-methylmalonyl-CoA formed by propionyl-CoA
  carboxylation into succinyl-CoA, closing the 3-hydroxypropionate half of the
  3-hydroxypropionate/4-hydroxybutyrate autotrophic CO2-fixation cycle. Its transcription
  is induced under autotrophic growth.
