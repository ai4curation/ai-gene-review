core_functions:
- description: Catalytic (alpha) subunit of the adenosylcobalamin-dependent
    methylmalonyl-CoA mutase. With the B12-binding subunit Msed_2055 it forms an alpha2beta2
    heterotetramer that rearranges (R)-methylmalonyl-CoA to succinyl-CoA in the
    3-hydroxypropionate/4-hydroxybutyrate CO2-fixation cycle. Msed_0638 supplies the
    substrate-binding TIM barrel, and activity requires the partner subunit.
