- term:
    id: GO:0031419
    label: cobalamin binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR006098
  - InterPro:IPR006099
  - InterPro:IPR016176
  review:
    summary: InterPro2GO mapping from the MCM catalytic-domain signatures. Msed_0638
      consists of the TIM-barrel domain only. In the M. sedula enzyme the B12-binding
      domain, with the conserved DXHXXG-SXL-GG motif, is a separate subunit (Msed_2055).
    action: KEEP_AS_NON_CORE
    reason: In MCM-family enzymes, adenosylcobalamin binds at the interface between the
      TIM-barrel domain, which contacts the corrin ring and the 5'-deoxyadenosyl group, and
      the Rossmann-type B12-binding domain, which supplies the lower axial histidine. In M.
      sedula that second domain is the separate subunit Msed_2055, which carries the
      B12-binding motif (PMID:22752162). Msed_0638 therefore contributes to cofactor binding
      within the heterotetramer, but is not the B12-binding subunit. This is inferred from
      the domain architecture and from family structures. No cobalamin-binding measurement
      exists for the isolated M. sedula subunit, which was not soluble alone. The term is
      kept as a non-core, cofactor-level annotation and is not proposed as the defining
      function.
    supported_by:
    - reference_id: PMID:22752162
      supporting_text: The conserved coenzyme B(12)-binding motif (DXHXXG-SXL-GG) was identified
        in M. sedula MCM-β.
    - reference_id: file:METS5/Msed_0638/Msed_0638-uniprot.txt
      supporting_text: Methylmalonyl-CoA mutase alpha/beta chain catalytic
- term:
    id: GO:0015977
    label: carbon fixation
  evidence_type: IDA
  original_reference_id: PMID:22752162
  review:
    summary: MCM catalyses the rearrangement of (R)-methylmalonyl-CoA to succinyl-CoA, a
      step of the 3-hydroxypropionate/4-hydroxybutyrate autotrophic CO2-fixation cycle of
      M. sedula. Transcription of Msed_0638 is induced under autotrophic growth.
    action: NEW
    reason: The evidence goes beyond homology. Msed_0638 is the catalytic subunit of the
      recombinantly verified M. sedula mutase, and with the epimerase it converts the
      cycle intermediate (S)-methylmalonyl-CoA to succinyl-CoA. Its transcription rises
      significantly under autotrophic compared with heterotrophic growth (PMID:22752162).
      The enzyme catalyses a step of the cycle, so it passes the participation test.
      Comparators in the same role (catalysts of individual cycle steps), namely Msed_0709,
      Msed_1424, Msed_0406 and Msed_2001, carry GO:0015977 in their reviews. GO:0043427 is
      the Chloroflexus glyoxylate-forming cycle and is not used, and a 3HP/4HB-cycle child
      term is proposed below. Caveats are that no genetic evidence exists, and that the
      cited enzyme activity is for the recombinant complex, not a measurement in cell
      extracts.
    supported_by:
    - reference_id: PMID:22752162
      supporting_text: The expression of all three genes was significantly upregulated under
        autotrophic compared to heterotrophic growth conditions, implying a role in CO(2)
        fixation.
    - reference_id: PMID:22752162
      supporting_text: The two enzymes together catalyzed the two-step conversion of (S)-methylmalonyl-CoA
        to succinyl-CoA, consistent with their proposed role in the 3-HP/4-HB cycle.
    - reference_id: PMID:18079405
      supporting_text: In this system, one acetyl-CoA and two bicarbonate molecules were reductively
        converted via 3-hydroxypropionate to succinyl-CoA.
