id: A4YDT1
gene_symbol: Msed_0406
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:399549
  label: Metallosphaera sedula DSM 5348
description: >-
  Msed_0406 encodes 4-hydroxybutyrate--CoA ligase 1 (HBCL1), an AMP-forming class I
  adenylate-forming acyl-CoA synthetase (ANL superfamily) of the thermoacidophilic
  crenarchaeon Metallosphaera sedula. In the 3-hydroxypropionate/4-hydroxybutyrate
  autotrophic CO2-fixation cycle it activates 4-hydroxybutyrate to 4-hydroxybutyryl-CoA
  using ATP and CoA. This is the first step of the branch that converts
  4-hydroxybutyrate, via 4-hydroxybutyryl-CoA dehydratase, crotonyl-CoA
  hydratase/3-hydroxybutyryl-CoA dehydrogenase and acetoacetyl-CoA thiolase, into two
  molecules of acetyl-CoA. A recombinant enzyme with these three partners converts
  4-hydroxybutyrate to acetyl-CoA in vitro. The enzyme is promiscuous for short
  (C2-C5) carboxylic acids. Its catalytic efficiency in vitro is highest with
  propionate and butyrate, then valerate, acetate and 3-hydroxypropionate, and lowest
  with 4-hydroxybutyrate (Km about 2 mM). Even so, it is the physiologically relevant
  4-hydroxybutyrate-CoA ligase: its rate on 4-hydroxybutyrate is about eightfold higher
  than that of its paralog Msed_0394 (HBCL2), which prefers butyrate and valerate.
  Both genes are constitutively expressed. It is a soluble, crystallised enzyme; the
  single predicted transmembrane segment lies within the conserved N-terminal domain.
