id: A4YDT1
gene_symbol: Msed_0406
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:399549
  label: Metallosphaera sedula DSM 5348
description: >-
  Msed_0406 encodes 4-hydroxybutyrate-CoA ligase (AMP-forming; 4-hydroxybutyrate-CoA
  synthetase), the main enzyme that activates 4-hydroxybutyrate to 4-hydroxybutyryl-CoA in
  the 3-hydroxypropionate/4-hydroxybutyrate CO2-fixation cycle of the thermoacidophilic
  archaeon Metallosphaera sedula. The step opens the branch of the cycle in which
  4-hydroxybutyryl-CoA is dehydrated, hydrated, oxidised and cleaved to two acetyl-CoA,
  regenerating the cycle's starting molecule and supplying acetyl-CoA to biosynthesis. The
  gene is induced during autotrophic growth on H2 and CO2. Msed_0406 is a soluble member of the
  medium-chain acyl-CoA synthetase (ACSM) family of the ANL adenylate-forming superfamily.
  In vitro it has broad short-chain specificity, activating propionate, butyrate, valerate,
  acetate and 3-hydroxybutyrate faster than 4-hydroxybutyrate, but its physiological role is
  defined by the cycle. A second, slower 4-hydroxybutyrate-CoA ligase, Msed_0394, is also
  present.
