- id: PMID:23258541
  title: Role of 4-hydroxybutyrate-CoA synthetase in the CO2 fixation cycle in thermoacidophilic
    archaea.
  findings:
  - statement: Recombinant Msed_0406 and its paralog Msed_0394 both ligate CoA to 4-hydroxybutyrate,
      with similar Km but an eightfold difference in rate.
    supporting_text: Recombinant versions of these enzymes catalyzed the ligation of
      CoA to 4HB
  - statement: Msed_0406 is judged the physiologically relevant 4HB-CoA ligase of the
      cycle.
    supporting_text: 'Conclusion: Msed_0406 is likely the physiologically relevant enzyme
      in the cycle.'
  - statement: In vitro, propionate is the best substrate and 4HB the poorest by kcat/Km;
      the enzyme is a promiscuous short-chain acid ligase.
    supporting_text: It appears that Msed_0406 is primarily a promiscuous propionate-CoA
      synthetase.
  - statement: The substrate range does not extend beyond C5 acids.
    supporting_text: Both Msed_0394 and Msed_0406 were found to have activity on a broad
      range of small organic acid substrates of up to five carbons in length.
  - statement: Whether both paralogs are needed for autotrophy is unknown.
    supporting_text: It is not clear why two synthetases would be required, or whether
      both of them are necessary for autotrophic growth.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified, full text cached (PMC3567653). This is the source of
      all three IDA rows and of the UniProt kinetic data.
