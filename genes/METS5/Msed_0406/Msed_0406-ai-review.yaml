    Metallosphaera sedula 3-hydroxypropionate/4-hydroxybutyrate carbon fixation pathway.
  findings:
  - statement: Msed_0406, with Msed_1321, Msed_0399 and Msed_0656, reconstitutes the final four
      steps of the 3HP/4HB cycle in vitro, converting 4-hydroxybutyrate to acetyl-CoA; the ligase
      step governs flux between the succinate and acetyl-CoA branches.
    supporting_text: Taken together, this work confirms the final four steps of the 3HP/4HB
      pathway
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only in the cache. Names Msed_0406 explicitly as the
      4-hydroxybutyrate-CoA ligase (AMP forming) of the cycle.
