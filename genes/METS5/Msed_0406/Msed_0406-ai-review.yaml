  title: PAINT annotations for PANTHER family PTHR43605 (acyl-coenzyme A synthetase)
  findings:
  - statement: The PTHR43605 root node PTN001944787 carries IBDs for GO:0004321 (seeded only by
      RGD:727928) and GO:0006633 (seeded by MGI:2152200 and MGI:99538).
core_functions:
- description: >-
    ATP-dependent 4-hydroxybutyrate-CoA ligase (AMP-forming) activity, activating
    4-hydroxybutyrate to 4-hydroxybutyryl-CoA in the 4-hydroxybutyrate branch of the
    3-hydroxypropionate/4-hydroxybutyrate autotrophic CO2-fixation cycle. The enzyme has broad
    short-chain acyl-CoA synthetase activity in vitro; the physiological substrate is set by the
    pathway.
  proposed_molecular_function: 4-hydroxybutyrate-CoA ligase activity
  directly_involved_in:
  - id: GO:0015977
    label: carbon fixation
  - id: GO:0006637
    label: acyl-CoA metabolic process
  supported_by:
  - reference_id: file:METS5/Msed_0406/Msed_0406-uniprot.txt
    record_section: ["CC:CATALYTIC ACTIVITY"]
    supporting_text: Reaction=4-hydroxybutanoate + ATP + CoA = 4-hydroxybutanoyl-CoA + AMP +
      diphosphate
  - reference_id: PMID:23258541
    supporting_text: Recombinant versions of these enzymes catalyzed the ligation of CoA to 4HB
    reference_section_type: ABSTRACT
  - reference_id: PMID:24532060
    supporting_text: were produced recombinantly in Escherichia coli, combined in vitro, and
      shown to convert 4HB to acetyl-CoA
    reference_section_type: ABSTRACT
proposed_new_terms:
- proposed_name: 4-hydroxybutyrate-CoA ligase activity
  proposed_definition: >-
    Catalysis of the reaction: 4-hydroxybutanoate + ATP + CoA = 4-hydroxybutanoyl-CoA + AMP +
    diphosphate.
  justification: >-
    EC 6.2.1.40 and RHEA:23128 describe this reaction, the 4-hydroxybutyrate activation step of
    the archaeal 3-hydroxypropionate/4-hydroxybutyrate and dicarboxylate/4-hydroxybutyrate
    CO2-fixation cycles. No GO molecular function term exists for it (QuickGO search,
    2026-11-02). Msed_0406 is an experimentally characterised example.
  proposed_parent:
    id: GO:0031955
    label: short-chain fatty acid-CoA ligase activity
  supported_by:
  - reference_id: file:METS5/Msed_0406/Msed_0406-uniprot.txt
    record_section: ["CC:CATALYTIC ACTIVITY"]
    supporting_text: Xref=Rhea:RHEA:23128
  - reference_id: PMID:23258541
    supporting_text: Recombinant versions of these enzymes catalyzed the ligation of CoA to 4HB
    reference_section_type: ABSTRACT
- proposed_name: carbon fixation by 3-hydroxypropionate/4-hydroxybutyrate cycle
  proposed_definition: >-
    An autotrophic carbon dioxide fixation pathway in which acetyl-CoA is carboxylated twice
    via 3-hydroxypropionate and propionyl-CoA to succinyl-CoA, which is reduced to
    4-hydroxybutyrate; 4-hydroxybutyryl-CoA is then dehydrated and converted via crotonyl-CoA
    and acetoacetyl-CoA to two molecules of acetyl-CoA.
  justification: >-
    The existing GO:0043427 carbon fixation by 3-hydroxypropionate cycle is defined as the
    Chloroflexus pathway ending in malyl-CoA cleavage to glyoxylate, which does not include the
    4-hydroxybutyrate branch used by Sulfolobales and Thaumarchaeota. Enzymes of that branch,
    such as Msed_0406, can currently be annotated only to the generic parent GO:0015977.
  proposed_parent:
    id: GO:0015977
    label: carbon fixation
  supported_by:
  - reference_id: PMID:24532060
    supporting_text: This cycle adds two CO2 molecules to acetyl coenzyme A (acetyl-CoA) to
      generate 4HB, which is then rearranged and cleaved to form two acetyl-CoA molecules.
    reference_section_type: ABSTRACT
suggested_questions:
- question: >-
    Should the PAINT IBDs for GO:0004321 fatty-acyl-CoA synthase activity and GO:0006633 fatty
    acid biosynthetic process on the PTHR43605 root node PTN001944787 be retracted, given that
    the archaeal member Msed_0406 is a 4-hydroxybutyrate-CoA ligase in a CO2-fixation cycle?
- question: >-
    Does the full text of PMID:23258541 report activity of Msed_0406 on C6 or longer fatty acids
    that would justify keeping medium-chain fatty acid-CoA ligase activity as a side activity?
suggested_experiments:
- description: >-
    Delete Msed_0406 (and Msed_0394) in M. sedula and measure autotrophic growth on H2/CO2 and
    intracellular 4-hydroxybutyrate, to test whether Msed_0406 is the dominant
    4-hydroxybutyrate-CoA ligase in vivo and whether its propionate, butyrate and acetate
    activities have any physiological role.
