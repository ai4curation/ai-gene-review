- term:
    id: GO:0031956
    label: medium-chain fatty acid-CoA ligase activity
  evidence_type: IDA
  original_reference_id: PMID:23258541
  qualifier: enables
  review:
    summary: >-
      The underlying measurement is butyrate (and valerate) activation, which UniProt records
      as EC 6.2.1.2 "butyrate--CoA ligase". Butyrate and valerate are short-chain acids under
      the GO definitions, which set medium-chain at 6 to 12 carbons.
    action: MODIFY
    reason: >-
      The essence of the annotation, ATP-dependent CoA ligation of fatty acids, is sound and
      kinetically strong (butyrate kcat 8.4 s-1, Km 0.32 mM). The chain-length category is
      wrong: the curated substrate list and kinetics from this paper contain only C2-C5 acids,
      and GO:0031956 is defined for 6-12-carbon tails. The fitting term is GO:0031955
      short-chain fatty acid-CoA ligase activity, which also covers the physiological
      4-hydroxybutyrate activity. Caveat: the cached paper is abstract-only, so if the full text
      reports activity on C6 or longer acids the medium-chain term would stand as a side
      activity; the UniProt curation of that full text lists none.
    proposed_replacement_terms:
    - id: GO:0031955
      label: short-chain fatty acid-CoA ligase activity
    supported_by:
    - reference_id: file:METS5/Msed_0406/Msed_0406-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: It can also use butyrate, valerate, propionate, acetate and 3-hydroxybutyrate (3HB) as substrates.
    - reference_id: file:METS5/Msed_0406/Msed_0406-uniprot.txt
      record_section: ["CC:BIOPHYSICOCHEMICAL PROPERTIES"]
      supporting_text: KM=320 uM for butyrate {ECO:0000269|PubMed:23258541};
