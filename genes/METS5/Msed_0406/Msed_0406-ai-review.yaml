    supporting_text: For both enzymes, the production of 4HB-CoA from 4HB and CoA was
      confirmed using reversed-phase HPLC.
  - reference_id: PMID:23258541
    supporting_text: 'Conclusion: Msed_0406 is likely the physiologically relevant enzyme
      in the cycle.'
  - reference_id: PMID:24532060
