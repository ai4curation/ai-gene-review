- term:
    id: GO:0015977
    label: carbon fixation
  evidence_type: IDA
  original_reference_id: PMID:24532060
  qualifier: involved_in
  review:
    summary: >-
      Msed_0406 catalyses the 4-hydroxybutyrate-CoA ligase step of the
      3-hydroxypropionate/4-hydroxybutyrate autotrophic CO2-fixation cycle; with the next three
      cycle enzymes it converts 4-hydroxybutyrate to acetyl-CoA in vitro.
    action: NEW
    reason: >-
      Participation: the gene product itself performs a step of the pathway (4-hydroxybutyrate +
      ATP + CoA -> 4-hydroxybutyryl-CoA), shown with recombinant enzyme (PMID:23258541) and in a
      four-enzyme reconstitution of the cycle's final steps (PMID:24532060), and the gene is
      induced under strict autotrophy. Comparator check (QuickGO, 2026-11-02): other M. sedula
      cycle enzymes already carry a carbon-fixation term, Msed_1456 GO:0043427 by IDA
      (PMID:18165310) and Msed_1353 GO:0043427 by IEA, so the absence on Msed_0406 is an
      omission rather than a convention. GO:0043427 "carbon fixation by 3-hydroxypropionate
      cycle" is not used because its definition is the Chloroflexus cycle that ends in malyl-CoA
      cleavage to glyoxylate; the 4-hydroxybutyrate branch where Msed_0406 acts is not part of
      it. The parent GO:0015977 is used, and a specific 3-hydroxypropionate/4-hydroxybutyrate
      cycle term is proposed.
    supported_by:
    - reference_id: PMID:24532060
      supporting_text: were produced recombinantly in Escherichia coli, combined in vitro, and
        shown to convert 4HB to acetyl-CoA
      reference_section_type: ABSTRACT
    - reference_id: PMID:24532060
      supporting_text: flux between the succinate and acetyl-CoA branches in the 3HP/4HB pathway
        is governed by 4-hydroxybutyrate-CoA ligase
      reference_section_type: ABSTRACT
    - reference_id: PMID:23258541
      supporting_text: transcriptomic analysis of cells grown under strict H(2)-CO(2) autotrophy
        was consistent with the involvement of Msed_0406 and Msed_0394
      reference_section_type: ABSTRACT
