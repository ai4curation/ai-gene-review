- term:
    id: GO:0003987
    label: acetyl-CoA synthetase activity
  evidence_type: IDA
  original_reference_id: PMID:23258541
  qualifier: enables
  review:
    summary: >-
      Recombinant Msed_0406 activates acetate to acetyl-CoA in vitro (kcat 6.4 s-1, Km 2.03
      mM, per the curated UniProt kinetics from PMID:23258541). The activity is real but is a
      side activity of a broad-specificity short-chain acyl-CoA synthetase whose physiological
      substrate is 4-hydroxybutyrate.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Measured activity is not automatically function. The acetate activity is kinetically
      respectable, so it is not promiscuous noise and REMOVE is not warranted, and the IDA rests
      on a full text not read here (the cache is abstract-only). Nothing shows that Msed_0406
      activates acetate in vivo: acetate activation is not a step of the
      3-hydroxypropionate/4-hydroxybutyrate cycle, which regenerates acetyl-CoA by thiolysis,
      and M. sedula has a conserved acetate/propionate synthetase, Msed_1353, that can be named
      as the cell's enzyme for this reaction. This is the "in vitro activity, relevance unknown"
      tier of projects/ENZYME_SPECIFICITY.md, not a genuine secondary function.
    supported_by:
    - reference_id: file:METS5/Msed_0406/Msed_0406-uniprot.txt
