proposed_new_terms:
- proposed_name: 4-hydroxybutyrate-CoA ligase activity
  proposed_definition: 'Catalysis of the reaction: 4-hydroxybutanoate + ATP + CoA = 4-hydroxybutanoyl-CoA
    + AMP + diphosphate.'
  justification: This is EC 6.2.1.40 (RHEA:23128), and GO has no term for it (OLS and
    QuickGO searches for 4-hydroxybutyrate and 4-hydroxybutanoyl-CoA ligase terms return
    none). The neighbouring step of the same cycle already has GO:0043955 3-hydroxypropionyl-CoA
    synthetase activity. The activity is required in both archaeal 4-hydroxybutyrate
    CO2-fixation cycles (3HP/4HB in Sulfolobales and Thaumarchaeota, DC/4HB in Thermoproteales
    and Desulfurococcales). 4HB is a hydroxy acid, not a fatty acid, so the parent should
    be CoA-ligase activity rather than short-chain fatty acid-CoA ligase activity.
  proposed_parent:
    id: GO:0016405
    label: CoA-ligase activity
  supported_by:
  - reference_id: PMID:23258541
    supporting_text: Recombinant versions of these enzymes catalyzed the ligation of
      CoA to 4HB
- proposed_name: carbon fixation by 3-hydroxypropionate/4-hydroxybutyrate cycle
  proposed_definition: An autotrophic carbon dioxide fixation pathway in which acetyl-CoA
    is carboxylated twice by acetyl-CoA/propionyl-CoA carboxylase, and the products are
    reductively converted via 3-hydroxypropionate and succinyl-CoA to 4-hydroxybutyrate.
    4-Hydroxybutyrate is then converted via 4-hydroxybutyryl-CoA dehydratase into two
    molecules of acetyl-CoA. The pathway occurs in autotrophic Sulfolobales and in ammonia-oxidizing
    Thaumarchaeota.
  justification: Same proposal as in the Msed_0709 review. GO:0043427 carbon fixation
    by 3-hydroxypropionate cycle is defined as the Chloroflexus cycle that releases glyoxylate
    via malyl-CoA cleavage. The archaeal 3HP/4HB cycle shares only the first half and
    regenerates acetyl-CoA via 4-hydroxybutyrate, and Msed_0406 acts in that 4HB branch.
  proposed_parent:
    id: GO:0015977
    label: carbon fixation
  supported_by:
  - reference_id: PMID:18079405
    supporting_text: This intermediate was reduced to 4-hydroxybutyrate and converted
      into two acetyl-CoA molecules via 4-hydroxybutyryl-CoA dehydratase.
suggested_questions:
- question: Should GO record every measured in-vitro substrate of a promiscuous archaeal
    acyl-CoA ligase as an enables annotation? For Msed_0406 the best in-vitro substrate
    (propionate) is not a cycle intermediate, and the physiological substrate (4HB) is
    the poorest one and has no GO term, so the annotation set currently describes the
    enzyme by its non-physiological activities only.
- question: Should the EC 6.2.1.2 (RHEA:48340) to GO:0031956 mapping be reviewed? EC
    6.2.1.2 covers butanoate and other C4-C11 acids, while GO defines medium-chain as
    C6-C12, so butyrate- and valerate-only activities are mapped to a term whose definition
    excludes them.
- question: Is the GO:0004321 fatty-acyl-CoA synthase activity (EC 2.3.1.86) assignment
    on PANTHER node PTN008683229 (PTHR43605, ACSM-type acyl-CoA synthetases) an error
    to be corrected in PAINT?
suggested_experiments:
- hypothesis: Msed_0406, but not Msed_0394, is required for autotrophic growth of M.
    sedula.
  description: Delete Msed_0406 and Msed_0394 singly and together, for example with
    a Sulfolobales genetic system, and compare growth on H2/CO2 with heterotrophic growth
    on peptides. Measure 4HB-CoA ligase activity and 4HB accumulation in the mutant
    extracts.
- hypothesis: Residues lining the acyl pocket determine the 4HB versus propionate preference
    of Msed_0406.
  description: Using the 8BIQ structure, mutate candidate pocket residues (for example
    Ala249, Lys250, Ala321) and determine kcat/Km for 4HB, propionate and butyrate.
