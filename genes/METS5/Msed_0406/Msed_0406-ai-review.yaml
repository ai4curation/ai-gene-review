- term:
    id: GO:0050218
    label: propionate-CoA ligase activity
  evidence_type: IDA
  original_reference_id: PMID:23258541
  qualifier: enables
  review:
    summary: >-
      Propionate is the best in vitro substrate (kcat 16.2 s-1, Km 0.38 mM), but propionate
      activation is not a step of the enzyme's pathway, and nothing shows it occurs in vivo.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Measured activity is not automatically function. In the
      3-hydroxypropionate/4-hydroxybutyrate cycle propionyl-CoA is formed by reduction of
      acryloyl-CoA, not by activating free propionate, so the cycle gives the ligase no
      propionate to act on. The conserved Sulfolobales acetate/propionate synthetase Msed_1353
      can be named as the cell's enzyme for this reaction. The activity is far above noise and
      the IDA rests on an unread full text, so it is not removed; it is in vitro activity of
      unknown relevance (projects/ENZYME_SPECIFICITY.md), showing that Msed_0406 is a broad
      short-chain acyl-CoA synthetase whose physiological substrate is set by pathway context,
      not by kinetics.
    supported_by:
    - reference_id: file:METS5/Msed_0406/Msed_0406-uniprot.txt
      record_section: ["CC:BIOPHYSICOCHEMICAL PROPERTIES"]
      supporting_text: KM=380 uM for propionate {ECO:0000269|PubMed:23258541};
    - reference_id: PMID:23258541
