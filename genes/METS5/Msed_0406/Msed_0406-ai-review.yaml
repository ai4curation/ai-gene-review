  review:
    summary: Recombinant Msed_0406 ligates CoA to acetate in vitro (Km about 2 mM, Vmax
      6 umol/min/mg), with kcat/Km about 13-fold below propionate.
    action: KEEP_AS_NON_CORE
    reason: The activity was measured and is real, so the curator's IDA stands. It is
      not the physiological role. In the 3HP/4HB cycle acetyl-CoA is regenerated by
      thiolysis of acetoacetyl-CoA, not from free acetate, and the authors conclude
      the enzyme's cycle role is 4HB activation. M. sedula has a separate conserved
      acetate/propionate-CoA synthetase (Msed_1353). Tier choice per projects/ENZYME_SPECIFICITY.md -
      not promiscuous noise, because the acetate activity is a substantial part of a
      broadly promiscuous active site (the authors call the enzyme a promiscuous
      acetate/propionate ligase), not a trace activity far below Msed_1353; and not
      over-annotation, because the activity is a characterised property of the enzyme
      rather than an isolated assay of unknown relevance. Kept as a genuine secondary
      activity, non-core because Msed_1353 owns acetate activation in vivo.
