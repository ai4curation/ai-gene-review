core_functions:
- description: ATP-dependent (AMP-forming) ligation of CoA to 4-hydroxybutyrate to give
    4-hydroxybutyryl-CoA (EC 6.2.1.40, RHEA:23128). This step opens the acetyl-CoA-regenerating
    branch of the 3-hydroxypropionate/4-hydroxybutyrate CO2-fixation cycle. 4HB is a
    kinetically poor substrate (Km about 2 mM), but Msed_0406 is the faster of the two
    M. sedula 4HB-CoA ligases.
  proposed_molecular_function: 4-hydroxybutyrate-CoA ligase activity
  directly_involved_in:
  - id: GO:0015977
    label: carbon fixation
