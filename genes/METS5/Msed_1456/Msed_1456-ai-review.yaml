proposed_new_terms:
- proposed_name: carbon fixation by 3-hydroxypropionate/4-hydroxybutyrate cycle
  proposed_definition: An autotrophic carbon dioxide fixation pathway in which acetyl-CoA
    is carboxylated twice by acetyl-CoA/propionyl-CoA carboxylase, and the products are
    reductively converted via 3-hydroxypropionate and succinyl-CoA to 4-hydroxybutyrate.
    4-Hydroxybutyrate is then converted via 4-hydroxybutyryl-CoA dehydratase into two
    molecules of acetyl-CoA. The pathway occurs in autotrophic Sulfolobales and in
    ammonia-oxidizing Thaumarchaeota.
  justification: GO:0043427 carbon fixation by 3-hydroxypropionate cycle is defined as
    the Chloroflexus cycle that releases glyoxylate via malyl-CoA cleavage. The archaeal
    3HP/4HB cycle shares only the first half and regenerates acetyl-CoA via 4-hydroxybutyrate,
    so its enzymes, including this 3-hydroxypropionyl-CoA synthetase, have no specific
    process term. The same term is proposed in the Msed_0709 review.
  proposed_parent:
    id: GO:0015977
    label: carbon fixation
  supported_by:
  - reference_id: PMID:18079405
    supporting_text: This intermediate was reduced to 4-hydroxybutyrate and converted
      into two acetyl-CoA molecules via 4-hydroxybutyryl-CoA dehydratase.
suggested_questions:
- question: Should GO:0043427 be restricted explicitly to the Chloroflexus bicycle (or
    made a grouping term) and a sibling term created for the 3HP/4HB cycle? Existing GO:0043427
    rows on Sulfolobales enzymes would then need to be moved.
- question: Does free propionate activation by Msed_1456 have a physiological role, for
    example in scavenging propionate during heterotrophic or mixotrophic growth?
- question: Should the acetyl-CoA ligase family signature IPR011904 / TIGR02188 continue
    to map to acetyl-CoA synthetase activity and acetyl-CoA biosynthesis for crenarchaeal
    members whose substrate has diverged, such as 3-hydroxypropionyl-CoA synthetase?
suggested_experiments:
- hypothesis: Msed_1456 and 3-hydroxypropionyl-CoA dehydratase (Msed_2001) form a stable
    complex that channels 3-hydroxypropionyl-CoA.
  description: Co-purify native or co-expressed HPCS and HPCD and test complex formation
    by size-exclusion chromatography with multi-angle light scattering or cross-linking
    mass spectrometry. Compare coupled-assay kinetics with free enzymes and with added
    exogenous 3-hydroxypropionyl-CoA to look for channelling.
- hypothesis: Msed_1456 is required for autotrophic but not heterotrophic growth of M.
    sedula.
  description: Delete or knock down Msed_1456 with a Sulfolobales genetic system and compare
    growth on H2/CO2 with growth on yeast extract or peptides, with complementation.
