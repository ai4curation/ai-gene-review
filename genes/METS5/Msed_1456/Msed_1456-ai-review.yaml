gene_symbol: Msed_1456
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:399549
  label: Metallosphaera sedula DSM 5348
description: >-
  Msed_1456 encodes 3-hydroxypropionyl-CoA synthetase (EC 6.2.1.36) of the
  thermoacidophilic crenarchaeon Metallosphaera sedula. It is an AMP-forming acyl-CoA
  synthetase of the ANL (adenylate-forming) superfamily that works as a homotetramer of
  about 78 kDa subunits. It activates 3-hydroxypropionate to 3-hydroxypropionyl-CoA with
  ATP and CoA, releasing AMP and pyrophosphate. This is the first step of the reductive
  conversion of 3-hydroxypropionate to propionyl-CoA in the
  3-hydroxypropionate/4-hydroxybutyrate autotrophic CO2-fixation cycle of the Sulfolobales.
  The enzyme has high affinity for 3-hydroxypropionate (Km 180 uM) and ATP (Km 45 uM), and
  uses propionate with similar catalytic efficiency. Acrylate is used about 10-fold less
  efficiently, and acetate and butyrate are poor substrates. Its activity is induced about
  eightfold under autotrophic growth. Although it falls in the acetyl-CoA synthetase
  sequence family, acetate activation in M. sedula is carried out mainly by a separate
  paralog. Recombinant M. sedula enzyme is soluble only when co-expressed with the next
  enzyme of the cycle, 3-hydroxypropionyl-CoA dehydratase (Msed_2001), with which it
  interacts in yeast two-hybrid assays.
