    summary: Process term that follows from the family-level acetyl-CoA synthetase assignment.
      Msed_1456 does not make acetyl-CoA in vivo.
    action: REMOVE
    reason: The enzyme's product is 3-hydroxypropionyl-CoA, which is converted via acryloyl-CoA
      to propionyl-CoA in the first half of the 3HP/4HB cycle (PMID:18165310). Acetyl-CoA
