- term:
    id: GO:0043427
    label: carbon fixation by 3-hydroxypropionate cycle
  evidence_type: IDA
  original_reference_id: PMID:18165310
  qualifier: involved_in
  review:
    summary: The experimental basis is sound. The enzyme was purified from autotrophically
      grown M. sedula, catalyses a step of the CO2-fixation cycle, and is induced eightfold
      under autotrophy. However, the GO term names a different pathway.
    action: MODIFY
    reason: GO:0043427 is defined (OLS, checked 2026-10-31) as the cycle that fixes two
      CO2 to form glyoxylate, with malyl-CoA cleaved to acetyl-CoA and glyoxylate. That
      is the Chloroflexus 3-hydroxypropionate bicycle. The same paper reports that M. sedula
      lacks L-malyl-CoA lyase and that the Sulfolobaceae pathway diverges after succinyl-CoA.
      The crenarchaeal pathway is the 3-hydroxypropionate/4-hydroxybutyrate cycle, which
      regenerates acetyl-CoA via 4-hydroxybutyrate (PMID:18079405). The curators' evidence
      that Msed_1456 takes part in autotrophic CO2 fixation is not in question. Only the
      pathway term is mis-scoped. GO has no 3HP/4HB-cycle term, so the row is modified
      to the proposed new term, as in the Msed_0709 review, and to the existing parent
      GO:0015977 carbon fixation until that term exists.
    proposed_replacement_terms:
    - id: NTR
      label: carbon fixation by 3-hydroxypropionate/4-hydroxybutyrate cycle
    - id: GO:0015977
      label: carbon fixation
    supported_by:
    - reference_id: PMID:18165310
      supporting_text: 3-Hydroxypropionyl-CoA synthetase is up-regulated eightfold in autotrophically
        versus heterotrophically grown M. sedula , supporting its proposed role during CO
        2 fixation in this archaeon and possibly other members of the Sulfolobaceae family.
    - reference_id: PMID:18165310
      supporting_text: l -Malyl-CoA lyase activity was not detected in cell extracts of
        M. sedula ( 14 ).
    - reference_id: PMID:18079405
      supporting_text: This intermediate was reduced to 4-hydroxybutyrate and converted
        into two acetyl-CoA molecules via 4-hydroxybutyryl-CoA dehydratase.
