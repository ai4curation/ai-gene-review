      supporting_text: Similarly, it acted as dehydrogenase with both C4 and C8
        (S)-3-hydroxyacyl-CoAs (Table 2).
- term:
    id: GO:0004300
    label: enoyl-CoA hydratase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: enables
  supporting_entities:
  - ARBA:ARBA00086629
  review:
    summary: ARBA machine-learning annotation of enoyl-CoA hydratase activity, from the
      C-terminal crotonase (enoyl-CoA hydratase/isomerase) domain.
    action: MODIFY
    reason: The activity is real. Native and recombinant enzyme hydrate crotonyl-CoA
      (PMID:21169482), and the recombinant enzyme also hydrates (E)-2-octenoyl-CoA and
      acrylyl-CoA (PMID:32218776). All of these are (2E)-enoyl-CoAs, so the specific
      child GO:0018812 3-hydroxyacyl-CoA dehydratase activity is supported. GO:0120092
      (2E)-butenoyl-CoA hydratase activity covers only the C4 reaction, and the enzyme is
      more active on C8. GO:0080023 is the (3R) reaction, and the enzyme is (S)-specific.
      The hydratase is only a minor contributor to crotonyl-CoA hydration in
      autotrophic cells (about 8% of the activity; Msed_2001 supplies about 86%,
      PMID:33472982). The activity is therefore kept, but its share of the cycle flux is
      small. A low in-vivo flux share is not grounds for removing a demonstrated activity.
    proposed_replacement_terms:
    - id: GO:0018812
      label: 3-hydroxyacyl-CoA dehydratase activity
    supported_by:
    - reference_id: PMID:32218776
      supporting_text: In hydratase reaction, Msed_0399 was promiscuous and could hydrate
        not only crotonyl-CoA, but also (E)-2-octenoyl-CoA and acrylyl-CoA (Table 2).
    - reference_id: PMID:33472982
      supporting_text: the latter probably with some contribution of Msed_0399 (8.2%)
- term:
    id: GO:0006631
    label: fatty acid metabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  supporting_entities:
  - ARBA:ARBA00028669
  - InterPro:IPR006108
  - InterPro:IPR006176
  review:
    summary: Combined automated annotation from ARBA and the 3-hydroxyacyl-CoA
      dehydrogenase domains (IPR006108, IPR006176).
    action: KEEP_AS_NON_CORE
    reason: This broad term fits the enzyme's chemistry and its likely physiology. The
      protein acts on C4 and C8 acyl-CoAs and is most active with (E)-2-octenoyl-CoA. It
      is the only M. sedula 3-hydroxyacyl-CoA dehydrogenase tested that is active on C8.
      Its gene lies in a cluster of beta-oxidation homologs. The authors therefore
      suggest that its main role is in fatty acid metabolism rather than CO2 fixation
      (PMID:32218776). The activity is present at similar levels in heterotrophically
      grown cells (PMID:21169482). Growth of M. sedula on fatty acids has not been shown,
      so the role rests on biochemistry and gene context rather than on in-vivo data.
      For that reason the term is kept but not treated as core.
    supported_by:
    - reference_id: PMID:32218776
      supporting_text: Importantly, Msed_0399 is the only 3-hydroxyacyl-CoA dehydrogenase
        that was active with C8 (3-hydroxy)acyl-CoAs (Tables 2, 3), further suggesting
        its participation in heterotrophic metabolism.
    - reference_id: PMID:32218776
      supporting_text: In fact, msed_0399 is located in the cluster with the genes
        homologous to various β-oxidation genes (Figure 2A) and may thus be primarily
        involved in, e.g., fatty acid metabolism rather than CO2 fixation (Table 2).
    - reference_id: PMID:21169482
      supporting_text: The expected bifunctional hydratase/dehydrogenase activity was
        present in similar amounts in extracts of autotrophically and heterotrophically
        grown cells of M. sedula
- term:
    id: GO:0006635
    label: fatty acid beta-oxidation
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN009069900
  - UniPathway:UPA00659
  review:
    summary: Combined automated annotation from PANTHER node PTN009069900 (subfamily
      PTHR23309:SF49, named peroxisomal bifunctional enzyme) and the UniPathway fatty acid
      beta-oxidation pathway.
    action: UNDECIDED
    reason: This is a family-level transfer from the FadB/EHHADH multifunctional-enzyme
      family, but it cannot be dismissed as a pure over-annotation. Msed_0399 hydrates
      (E)-2-octenoyl-CoA and oxidises (S)-3-hydroxyoctanoyl-CoA, its gene clusters with
      beta-oxidation homologs, and Liu et al. propose that it takes part in beta-oxidation
      (PMID:32218776). Some Sulfolobales degrade fatty acids with a dedicated beta-oxidation
      gene cluster (PMID:30948713). Against this, GO:0006635 is defined as the complete
      oxidation of a long-chain fatty acid. No substrate longer than C8 has been tested,
      and growth of M. sedula on fatty acids has not been shown (PMID:32218776). Until
      chain-length range and in-vivo involvement are tested, the row is left undecided.
      The broader GO:0006631 is kept as non-core.
    supported_by:
    - reference_id: PMID:32218776
      supporting_text: Interestingly, the enzyme was most active with octenoyl-CoA, thus
        suggesting that Msed_0399 may participate in β-oxidation, in addition to
        autotrophic CO2 fixation.
    - reference_id: PMID:32218776
      supporting_text: Although the growth of M. sedula on fatty acids has not been shown,
        some Sulfolobales are capable to use these compounds as a sole carbon source
    - reference_id: PMID:30948713
      supporting_text: acting as a repressor of a 30-kb gene cluster comprising 23 open
        reading frames encoding lipases and β-oxidation enzymes.
