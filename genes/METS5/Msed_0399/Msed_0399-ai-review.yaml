id: A4YDS4
gene_symbol: Msed_0399
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:399549
  label: Metallosphaera sedula DSM 5348
description: >-
  Msed_0399 encodes a 70-kDa bifunctional enzyme of the thermoacidophilic crenarchaeon
  Metallosphaera sedula. It has an N-terminal NAD+-dependent (S)-3-hydroxyacyl-CoA
  dehydrogenase region and a C-terminal enoyl-CoA hydratase (crotonase) domain, and it
  belongs to the same multifunctional-enzyme family as bacterial FadB. The purified
  native and recombinant enzyme hydrates crotonyl-CoA to (S)-3-hydroxybutyryl-CoA and
  oxidises that product to acetoacetyl-CoA. It uses NAD+ but not NADP+, and it does
  not act on the (R) stereoisomer. Both activities also work on C8 substrates, and the
  enzyme is most active with (E)-2-octenoyl-CoA. It was first identified as the
  crotonyl-CoA hydratase/(S)-3-hydroxybutyryl-CoA dehydrogenase of the
  3-hydroxypropionate/4-hydroxybutyrate CO2-fixation cycle, and with three other
  enzymes it converts 4-hydroxybutyrate to acetyl-CoA in vitro. Later kinetic,
  proteomic and comparative-genomic work showed that it is not the main enzyme for
  either step in vivo. The separate dehydrogenase Msed_1423 and the promiscuous
  hydratase Msed_2001 carry most of the flux, and the Msed_0399 gene is missing from
  several autotrophic Sulfolobales. The protein is abundant in both autotrophically and
  heterotrophically grown cells, and its gene lies in a cluster of beta-oxidation-like
  genes. Its main physiological role may therefore lie in short- to medium-chain
  acyl-CoA (fatty acid) metabolism, but this has not been tested in vivo.
