    action: ACCEPT
    reason: Confirmed by direct biochemistry. The enzyme purified from M. sedula and the
      recombinant protein oxidise (S)-3-hydroxybutyryl-CoA with NAD+ and do not use
      NADP+ or the (R) isomer (PMID:21169482). The recombinant protein also oxidises the
      C8 (S)-3-hydroxyacyl-CoA (PMID:32218776). GO:0003857 is defined as a
      (3S)-3-hydroxyacyl-CoA + NAD+ = a 3-oxoacyl-CoA + NADH + H+, which fits both the
      cofactor and the stereochemistry. GO:0008691 3-hydroxybutyryl-CoA dehydrogenase
      activity would be wrong, because GO defines it with NADP+ (EC 1.1.1.157), although
      the original paper uses that EC number. This is the core molecular function. Its
      in-vivo share of the 3HP/4HB-cycle step is minor, because Msed_1423 is the main
      (S)-3-hydroxybutyryl-CoA dehydrogenase (PMID:32218776). That bears on the process
      role, not on the activity.
