suggested_questions:
- question: Should Msed_0399 be annotated to carbon fixation (GO:0015977, or the proposed
    'carbon fixation by 3-hydroxypropionate/4-hydroxybutyrate cycle') when Liu et al.
    estimate that it carries a small flux at best, and the gene is absent from several
    autotrophic Sulfolobales? The orthologous fusion protein is the sole candidate for
    these steps in the dicarboxylate/4-hydroxybutyrate cycle of Ignicoccus and
    Pyrobaculum.
- question: Is Msed_0399 a beta-oxidation enzyme in M. sedula? What is its chain-length
    limit beyond C8, and is its gene cluster induced on fatty acids?
- question: UniProt's ARBA00008750 SIMILARITY line places the enoyl-CoA hydratase in the
    N-terminal section, but the Pfam domains (and the original paper) place it
    C-terminally. Should the rule's positional text be corrected for archaeal fusions
    with the reversed (dehydrogenase-first) domain order?
suggested_experiments:
- hypothesis: Msed_0399 is dispensable for autotrophic growth but contributes to fatty
    acid catabolism.
  description: Delete the Msed_0399 ortholog in a genetically tractable Sulfolobales
    species (or in M. sedula if genetics allow). Compare autotrophic growth and growth
    on fatty acids, and measure crotonyl-CoA hydratase and (S)-3-hydroxybutyryl-CoA
    dehydrogenase activities in extracts.
- hypothesis: Msed_0399 acts on long-chain acyl-CoAs.
  description: Assay recombinant Msed_0399 with C10 to C16 (E)-2-enoyl-CoAs and
    (S)-3-hydroxyacyl-CoAs to define its chain-length range. Use quantitative
    proteomics to test whether it is induced on fatty acids.
