  - statement: Msed_0399 carries at most a small flux in the cycle.
    supporting_text: Msed_0399, which was previously thought to be responsible for
      crotonyl-CoA conversion into acetoacetyl-CoA, is responsible for a small flux in
      autotrophically grown M. sedula, at best.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached. Quantitative proteomics combined with Vmax values.
