- id: PMID:32218776
  title: Enzymes Catalyzing Crotonyl-CoA Conversion to Acetoacetyl-CoA During the Autotrophic
    CO(2) Fixation in Metallosphaera sedula.
  findings:
  - statement: Msed_1423, not Msed_0399, is the main (S)-3-hydroxybutyryl-CoA
      dehydrogenase of the cycle in Sulfolobales.
    supporting_text: show that Msed_1423 is the main (S)-3-hydroxybutyryl-CoA
      dehydrogenase in the HP/HB cycle in Sulfolobales.
  - statement: The Msed_0399 gene is absent from several autotrophic Sulfolobales.
    supporting_text: This is corroborated by the fact that its gene is absent in many
      other autotrophic Sulfolobales.
  - statement: Both activities act on C8 substrates, and the hydratase is most active
      on octenoyl-CoA.
    supporting_text: Similarly, it acted as dehydrogenase with both C4 and C8
      (S)-3-hydroxyacyl-CoAs (Table 2).
  - statement: The gene lies in a beta-oxidation-like gene cluster.
    supporting_text: In fact, msed_0399 is located in the cluster with the genes
      homologous to various β-oxidation genes (Figure 2A)
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached (PMC7078158). Key paper for the in-vivo role. Flux
      attribution rests on kinetics, gene distribution and published transcriptomics,
      not on a mutant.
