        )-3-hydroxybutyryl-CoA ( K m 0.2 mM), and NAD + ( K m 0.25 mM).
    - reference_id: PMID:21169482
      supporting_text: NADP + , acryloyl-CoA, 3-hydroxypropionyl-CoA, and the ( R )
