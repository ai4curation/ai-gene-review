- term:
    id: GO:0046983
    label: protein dimerization activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR012280
  review:
    summary: The C-terminal dimerization domain mediates subunit contacts. ASDs of the
      archaeal/fungal branch form GAPDH-like homotetramers (dimers of dimers).
    action: KEEP_AS_NON_CORE
    reason: Self-association is well established for archaeal/fungal-branch ASDs,
      including the M. jannaschii enzyme. In the fungal enzyme, tetramerization is
      required for activity. It has not been shown for Msed_1700 itself, but the domain
      and branch membership make it very likely. Oligomerization is structural rather than
      the protein's biological role, so the term is kept as non-core.
    supported_by:
    - reference_id: PMID:26869335
      supporting_text: Further, our structural analyses and native PAGE results with other
        fungal ASADHs demonstrated that ASADH tetramerization is universal in the archaeal/fungal
        branch.
    - reference_id: PMID:26869335
      supporting_text: Crystal packing analysis was performed for the structures of caASADH
        and mjASADH, which also identified the presence of GAPDH-like homotetramers in
        each of these structures.
- term:
    id: GO:0050661
    label: NADP binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR005676
  review:
    summary: NADP(H) is the cofactor of the ASD reaction defined by GO:0004073. The
      archaeal M. jannaschii homolog binds NADP+ and prefers NADPH.
    action: KEEP_AS_NON_CORE
    reason: The claim is correct. NADP+ is the acceptor in the GO:0004073 reaction, and
      the closest characterised archaeal ASD shows a clear preference for NADPH. Cofactor
      binding is part of the catalytic activity rather than a separate function, so it is
      kept as non-core. No direct binding data exist for Msed_1700.
    supported_by:
    - reference_id: PMID:23325803
      supporting_text: This difference rationalizes its dual specificity for NADPH and
        NADH as electron donor, albeit still with a clear preference for NADPH ( 18 ).
    - reference_id: PMID:23325803
      supporting_text: ADP as major component for NADP + binding has also been experimentally
        verified by ASD of M. jannaschii structurally related to MCR ( 18 ).
- term:
    id: GO:0051287
    label: NAD binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR000534
  review:
    summary: This is a generic InterPro2GO mapping from the semialdehyde dehydrogenase
      Rossmann (NAD-binding) domain, IPR000534. Archaeal-branch ASDs can be dual-specific,
      but Msed_1700's cofactor use is unmeasured.
    action: UNDECIDED
    reason: The archaeal M. jannaschii ASD uses both NAD and NADP, with a preference for
      NADPH. So, unlike the strictly NADPH-specific MCR paralog Msed_0709, where this row
      was removed, NAD binding is plausible for an archaeal ASD. Whether M. sedula ASD
      binds or uses NAD(H) has not been tested, and the IPR000534 mapping is a
      domain-level default that does not record cofactor specificity. The evidence
      supports neither keeping nor removing the row.
    supported_by:
    - reference_id: PMID:16225889
      supporting_text: A new coenzyme-binding conformation and dual NAD/NADP coenzyme
        specificity further distinguish this archaeal branch from the bacterial ASADHs.
