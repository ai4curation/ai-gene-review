- id: PMID:17041055
  title: Malonyl-coenzyme A reductase in the modified 3-hydroxypropionate cycle for
    autotrophic carbon fixation in archaeal Metallosphaera and Sulfolobus spp.
  findings:
  - statement: Malonyl-CoA reductase is an ASD paralog. The full text (read on PMC, not
      cached) assigns the separate S. tokodaii ORF NP_377174 (ST1242), which clusters
      with aspartokinase and threonine synthase, as the true asd, without expressing or
      assaying it. Msed_1700 is not tested.
    supporting_text: Malonyl-CoA reductase has 38% amino acid sequence identity to aspartate-semialdehyde
      dehydrogenase, suggesting a common ancestor for both proteins.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed-verified (E-utilities; PMC1698253). The cached copy is
      abstract-only. The full text was read on the PMC page. Only the S. tokodaii MCR was
      cloned and assayed, and the M. sedula MCR was studied in extracts. There are no
      data on the M. sedula ASD (Msed_1700), because the M. sedula genome was not then
      available. Relevant here for the context-based asd assignment of the ortholog.
- id: PMID:18083856
  title: The genome sequence of the metal-mobilizing, extremely thermoacidophilic archaeon
    Metallosphaera sedula provides insights into bioleaching-associated metabolism.
  findings: []
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Genome paper and UniProt sequence source. It has no functional data on
      Msed_1700. Not cited in the review rows.
- id: PMID:19684143
  title: 'Malonic semialdehyde reductase, succinic semialdehyde reductase, and succinyl-coenzyme
    A reductase from Metallosphaera sedula: enzymes of the autotrophic 3-hydroxypropionate/4-hydroxybutyrate
    cycle in Sulfolobales.'
  findings:
  - statement: Peptide mass fingerprinting of the native succinyl-CoA/malonyl-CoA reductase
      from autotrophic M. sedula matched only Msed_0709, not Msed_1700.
    supporting_text: The only hit was with the gene gi|146303492 (100% identity, 54% coverage)
      annotated as an aspartate-semialdehyde dehydrogenase gene coding for a 39.2-kDa
      protein (Msed_0709; 357 amino acids).
  - statement: The ASD gene was duplicated in the Sulfolobales ancestor, and the two
      copies diverged in function.
    supporting_text: A phylogenetic tree of the gene ( 1 , 9 ) suggests that there was
      duplication of the aspartate semialdehyde dehydrogenase gene in the ancestor of
      the Sulfolobales and that there was independent evolution of the two genes to perform
      different functions.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed-verified, full text cached (Kockelkorn & Fuchs 2009). Msed_1700
      is not mentioned or assayed. The paper is relevant because it attributes the
      malonyl-CoA/succinyl-CoA reductase activity of M. sedula to Msed_0709 alone, which
      contradicts the ARBA naming of Msed_1700.
- id: PMID:23325803
  title: Structural basis for a bispecific NADP+ and CoA binding site in an archaeal
    malonyl-coenzyme A reductase.
  findings:
  - statement: In Sulfolobales the asd gene clusters with threonine synthase and aspartokinase,
      while mcr has no conserved neighbours.
    supporting_text: The asd gene clusters together with threonine synthase, aspartokinase,
      and ornithine carbamoyltransferase, among other genes, which is in line with its
      role in the biosynthesis of amino acids of the aspartate family.
  - statement: The archaeal M. jannaschii ASD binds NADP+ and has dual NADPH/NADH specificity
      with a preference for NADPH.
    supporting_text: This difference rationalizes its dual specificity for NADPH and NADH
      as electron donor, albeit still with a clear preference for NADPH ( 18 ).
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified, full text cached. It gives the genomic-context criterion
      that identifies Msed_1700 as asd. The structures are of the S. tokodaii MCR.
- id: PMID:16225889
  title: 'A new branch in the family: structure of aspartate-beta-semialdehyde dehydrogenase
    from Methanococcus jannaschii.'
  findings:
  - statement: The archaeal ASD branch keeps all the catalytic residues and has dual NAD/NADP
      specificity.
    supporting_text: A new coenzyme-binding conformation and dual NAD/NADP coenzyme specificity
      further distinguish this archaeal branch from the bacterial ASADHs.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed-verified. The cached copy is abstract-only. This is the closest
      characterised archaeal ASD (44% identical to Msed_1700). It is homology support
      only.
- id: PMID:26869335
  title: Structural Insights into the Tetrameric State of Aspartate-β-semialdehyde Dehydrogenases
    from Fungal Species.
  findings:
  - statement: ASDs of the archaeal/fungal branch, including the M. jannaschii enzyme,
      form GAPDH-like homotetramers. Tetramerization is required for activity in the
      fungal enzyme.
    supporting_text: Further, our structural analyses and native PAGE results with other
      fungal ASADHs demonstrated that ASADH tetramerization is universal in the archaeal/fungal
      branch.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: PubMed-verified, full text cached. Branch-level support for the oligomeric
      state; the paper does not study Sulfolobales proteins.
- id: file:METS5/Msed_1700/Msed_1700-uniprot.txt
  title: UniProt record A4YHF3 (A4YHF3_METS5)
  findings:
  - statement: The ARBA-derived name and CATALYTIC ACTIVITY call the protein a malonyl-CoA
      reductase (EC 1.2.1.75). This conflicts with its ASD-type CDD models, its asd
      genomic context, and the experimental assignment of MCR to Msed_0709.
    supporting_text: 'RecName: Full=malonyl CoA reductase (malonate semialdehyde-forming)'
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: The sequence features, active sites and domain cross-references are
      reliable. The ARBA00067001 RecName and ARBA00052213 catalytic activity (EC 1.2.1.75)
      are judged incorrect. Those rules are conditioned only on FunFam
      3.40.50.720:FF:000411 plus taxon Archaea, which covers both the MCR and ASD
      paralogs.
- id: file:METS5/Msed_1700/Msed_1700-bioinformatics/RESULTS.md
  title: Msed_1700 versus MCR paralog and reference ASD comparison
  findings:
  - statement: Msed_1700 is 69% identical to the S. tokodaii asd (ST1242) and about 39-41%
      identical to the MCRs. It carries ASD-type CDD models. About 17 of the 40 archaeal
      UniProt entries named EC 1.2.1.75 are ASD-type.
    supporting_text: Msed_1700 is far closer to the S. tokodaii asd gene product (ST1242)
      than to either MCR.
core_functions:
- description: Aspartate-semialdehyde dehydrogenase. Catalyses the NADPH-dependent
    reductive dephosphorylation of 4-phospho-L-aspartate (from aspartokinase Msed_1699)
    to L-aspartate 4-semialdehyde. This is the branch-point step that feeds homoserine,
    threonine (with threonine synthase Msed_1698) and methionine synthesis, and it uses
    an acyl-thioester intermediate on Cys150. The function is inferred from genomic
    context, orthology and signatures; no experimental data exist for this protein.
  molecular_function:
    id: GO:0004073
    label: aspartate-semialdehyde dehydrogenase (NADP+) activity
  directly_involved_in:
  - id: GO:0009088
    label: L-threonine biosynthetic process
  substrates:
  - id: CHEBI:30407
    label: 4-phospho-L-aspartate
  supported_by:
  - reference_id: PMID:23325803
    supporting_text: The asd gene clusters together with threonine synthase, aspartokinase,
      and ornithine carbamoyltransferase, among other genes, which is in line with its
      role in the biosynthesis of amino acids of the aspartate family.
  - reference_id: file:METS5/Msed_1700/Msed_1700-bioinformatics/RESULTS.md
    supporting_text: Msed_1700 is far closer to the S. tokodaii asd gene product (ST1242)
      than to either MCR.
suggested_questions:
- question: Should UniProt ARBA rules ARBA00067001 (name) and ARBA00052213 (EC 1.2.1.75
    catalytic activity) gain a condition that excludes ASD orthologs? The archaeal/fungal
    ASD CDD models cd18130/cd02315 would work as a negative condition, or the MCR models
    cd23940/cd24150 as a positive one. NCBIfam TIGR00978 does not work, because it is
    present on both paralogs.
- question: Does Msed_1700 retain any malonyl-CoA or succinyl-CoA reductase side activity,
    and does it use NADH as well as NADPH, like the M. jannaschii ASD?
suggested_experiments:
- hypothesis: Msed_1700 is an aspartate-semialdehyde dehydrogenase without significant
    malonyl-CoA reductase activity.
  description: Express Msed_1700 in E. coli, purify it by heat treatment and affinity
    chromatography, and assay ASD activity in both directions (aspartate semialdehyde
    plus phosphate with NADP+ or NAD+; 4-phospho-L-aspartate generated by aspartokinase
    with NADPH). In parallel, assay malonyl-CoA and succinyl-CoA reduction with NADPH,
    using Msed_0709 as a positive control.
- hypothesis: Msed_1700 is essential for growth without exogenous threonine and methionine.
  description: Delete or knock down Msed_1700 (or its Sulfolobus acidocaldarius ortholog,
    which can be manipulated genetically) and test growth in defined medium with and
    without threonine, methionine and homoserine supplements.
