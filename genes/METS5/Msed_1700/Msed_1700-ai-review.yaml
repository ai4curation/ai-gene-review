id: A4YHF3
gene_symbol: Msed_1700
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:399549
  label: Metallosphaera sedula DSM 5348
description: >-
  Msed_1700 encodes the aspartate-semialdehyde dehydrogenase (ASD, EC 1.2.1.11) of the
  thermoacidophilic crenarchaeon Metallosphaera sedula. It is a 348-residue member of the
  archaeal/fungal branch of the ASD family. ASD catalyses the NADPH-dependent reductive
  dephosphorylation of 4-phospho-L-aspartate to L-aspartate 4-semialdehyde, the branch-point
  intermediate for homoserine, threonine and methionine synthesis. The reaction goes
  through a covalent acyl-thioester intermediate on a catalytic cysteine (Cys150), with
  His242 as acid/base. The gene lies next to the genes for aspartokinase (Msed_1699) and
  threonine synthase (Msed_1698), and it carries the archaeal/fungal ASD conserved-domain
  models. It is about 69% identical to the asd gene product of Sulfolobus tokodaii but
  only about 39% identical to its M. sedula paralog Msed_0709. Msed_0709 evolved from an
  ancestral ASD into the malonyl-CoA/succinyl-CoA reductase of the
  3-hydroxypropionate/4-hydroxybutyrate CO2-fixation cycle. By analogy with archaeal
  homologs, the enzyme is expected to be a cytoplasmic homotetramer (a dimer of dimers)
  that may accept NADH as well as NADPH. The protein has not been characterised
  experimentally, and its function is inferred from genomic context, sequence signatures
  and homology.
existing_annotations:
- term:
    id: GO:0004073
    label: aspartate-semialdehyde dehydrogenase (NADP+) activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN000019669
  review:
    summary: TreeGrafter transfer of ASD activity from the PANTHER PTHR46718 ancestral
      node. For Msed_1700 this is the correct core activity.
    action: ACCEPT
    reason: No experiment has tested Msed_1700, so this rests on three independent lines
      of non-experimental evidence. First, genomic context. The gene sits between the
      aspartokinase gene (Msed_1699) and the threonine synthase gene (Msed_1698). This is
      the conserved asd cluster of Sulfolobales (PMID:23325803), and Alber et al. 2006
      used the same cluster to assign the true asd of S. tokodaii (NP_377174/ST1242).
      Second, orthology. Msed_1700 is 69% identical to ST1242 but only about 39-41%
      identical to the MCRs, including its paralog Msed_0709 (bioinformatics RESULTS.md).
      Third, signatures. It carries the archaeal/fungal ASD CDD models (cd18130, cd02315)
      rather than the MCR models carried by Msed_0709. It also keeps the catalytic
      cysteine and histidine (ACT_SITE 150 and 242), the residues the archaeal ASD
      structure shows are conserved (PMID:16225889). This is the ancestral, retained
      function of the duplicated pair, unlike the neofunctionalized Msed_0709, from which
      this term was removed. GO:0004073 is defined with NADP+. The M. jannaschii homolog
      also accepts NAD, but prefers NADPH.
    supported_by:
    - reference_id: PMID:23325803
      supporting_text: The asd gene clusters together with threonine synthase, aspartokinase,
        and ornithine carbamoyltransferase, among other genes, which is in line with its
        role in the biosynthesis of amino acids of the aspartate family.
    - reference_id: PMID:16225889
      supporting_text: However, the entire repertoire of functionally important active
        site amino acid residues is conserved, suggesting an identical catalytic mechanism
        but with lower catalytic efficiency.
    - reference_id: file:METS5/Msed_1700/Msed_1700-uniprot.txt
      supporting_text: 'CDD; cd18130; ASADH_C_arch_fung_like; 1.'
    - reference_id: file:METS5/Msed_1700/Msed_1700-bioinformatics/RESULTS.md
      supporting_text: Msed_1700 is far closer to the S. tokodaii asd gene product (ST1242)
        than to either MCR.
- term:
    id: GO:0008652
    label: amino acid biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR012280
  review:
    summary: InterPro2GO mapping from the semialdehyde dehydrogenase dimerization domain
      (IPR012280). The statement is correct for Msed_1700 but general.
    action: MODIFY
    reason: For this gene the claim is true. ASD makes L-aspartate 4-semialdehyde for the
      aspartate-family amino acids, and Msed_1700 is the M. sedula ASD (see GO:0004073).
      The term is too general, because a more specific process is supported. GO:0009088
      L-threonine biosynthetic process, which the gene already carries by TreeGrafter, is
      a descendant and is backed by the adjacent aspartokinase and threonine synthase
      genes. Note that the IPR012280 mapping itself does not discriminate. The same domain
      is on the MCR paralog Msed_0709, for which this term was removed.
    proposed_replacement_terms:
    - id: GO:0009088
      label: L-threonine biosynthetic process
    supported_by:
    - reference_id: PMID:23325803
      supporting_text: The asd gene clusters together with threonine synthase, aspartokinase,
        and ornithine carbamoyltransferase, among other genes, which is in line with its
        role in the biosynthesis of amino acids of the aspartate family.
- term:
    id: GO:0009088
    label: L-threonine biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000019669
  review:
    summary: TreeGrafter transfer of the ancestral ASD pathway role. ASD catalyses the
      second step from aspartate to threonine (aspartokinase, ASD, homoserine
      dehydrogenase, homoserine kinase, threonine synthase).
    action: ACCEPT
    reason: ASD catalyses a step of the pathway itself, so it passes the participation
      test. In M. sedula the gene is flanked by Msed_1699 aspartokinase (the step before)
      and Msed_1698 threonine synthase (the last step), so the operon-like cluster
      supports this pathway assignment. ASD also supplies homoserine for methionine, so
      threonine is not its only output. No term covering the aspartate-semialdehyde
      branch is a more appropriate single choice. Sulfolobales make lysine by the
      alpha-aminoadipate (LysW) route rather than the diaminopimelate route, so a lysine
      term would not apply. Evidence is genomic context and homology only.
    supported_by:
    - reference_id: PMID:23325803
      supporting_text: The asd gene clusters together with threonine synthase, aspartokinase,
        and ornithine carbamoyltransferase, among other genes, which is in line with its
        role in the biosynthesis of amino acids of the aspartate family.
    - reference_id: file:METS5/Msed_1700/Msed_1700-bioinformatics/RESULTS.md
      supporting_text: The sequence data place Msed_1700 with the archaeal/fungal ASDs,
        consistent with its genomic context (Msed_1698 threonine synthase, Msed_1699 aspartokinase).
