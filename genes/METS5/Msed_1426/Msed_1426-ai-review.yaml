id: A4YGN2
gene_symbol: Msed_1426
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:399549
  label: Metallosphaera sedula DSM 5348
description: >-
  Msed_1426 encodes the NADPH-dependent acryloyl-CoA reductase (EC 1.3.1.84) of the
  thermoacidophilic crenarchaeon Metallosphaera sedula. It reduces acryloyl-CoA to
  propionyl-CoA, the last of three reactions that convert 3-hydroxypropionate to
  propionyl-CoA in the 3-hydroxypropionate/4-hydroxybutyrate autotrophic CO2-fixation cycle
  of the Sulfolobales; the two preceding reactions are catalysed by 3-hydroxypropionyl-CoA
  synthetase (Msed_1456) and 3-hydroxypropionyl-CoA dehydratase (Msed_2001). The enzyme was
  enriched from autotrophically grown cells and identified by peptide mass fingerprinting;
  its activity is more than ten-fold higher in autotrophic than in heterotrophic cells and
  appears to limit the rate of 3-hydroxypropionate reduction. It is a soluble member of the
  medium-chain zinc-containing alcohol dehydrogenase family. The recombinant Sulfolobus
  tokodaii ortholog is a monomer that contains about one zinc per subunit, uses NADPH but not
  NADH, and does not reduce crotonyl-CoA, an intermediate of the second half of the cycle.
  Recombinant M. sedula enzyme, obtained by co-expression with the neighbouring succinic
  semialdehyde reductase Msed_1424, has comparable kinetics. The archaeal enzyme is unrelated
  to the reductase domain of the trifunctional propionyl-CoA synthase of Chloroflexus,
  indicating independent evolution of the two 3-hydroxypropionate-based cycles.
existing_annotations:
- term:
    id: GO:0004022
    label: alcohol dehydrogenase (NAD+) activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN000191633
  review:
    summary: TreeGrafter transfer of the ancestral zinc alcohol dehydrogenase activity from
      PANTHER node PTN000191633 (PTHR42940). Msed_1426 is a medium-chain zinc
      dehydrogenase family member, but it reduces the C=C double bond of an enoyl-CoA
      with NADPH, not an alcohol/aldehyde couple with NAD+.
    action: REMOVE
    reason: The activity is contradicted on two counts. The characterized reaction is
      acryloyl-CoA + NADPH + H+ = propionyl-CoA + NADP+ (EC 1.3.1.84, acting on a CH-CH
      group), not oxidation of an alcohol (EC 1.1.1.1, acting on CH-OH). And the enzyme
      does not use NADH as electron donor at all (PMID:19429610). No alcohol dehydrogenase
      activity has been reported for Msed_1426 or its orthologs. This is a family-level
      over-annotation of a neofunctionalized zinc-ADH-family enzyme (the same family as
      the succinic semialdehyde reductase Msed_1424, which is a genuine NADP-dependent
      alcohol dehydrogenase). The correct activity is already captured by GO:0043957.
    supported_by:
    - reference_id: PMID:19429610
      supporting_text: 'Acryloyl-CoA reductase (E.C. 1.3.1.x) catalyzes the following irreversible
        reaction: acryloyl-CoA + NADPH + H + → propionyl-CoA + NADP + .'
    - reference_id: PMID:19429610
      supporting_text: The enzyme does not require cofactors and does not use NADH as an
        electron donor.
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: located_in
  supporting_entities:
  - PANTHER:PTN000191633
  review:
    summary: The enzyme is soluble, lacks signal peptide and transmembrane segments, and
      acts in a cytoplasmic CO2-fixation pathway with soluble CoA-ester intermediates.
    action: ACCEPT
    reason: Acryloyl-CoA reductase activity was measured in, and enriched from, the
      soluble (100,000 x g supernatant) fraction of M. sedula extracts (PMID:19429610).
      In a prokaryote without internal compartments, cytoplasm is the correct and most
      precise location.
    supported_by:
    - reference_id: PMID:19429610
      supporting_text: Based on the acryloyl-CoA-dependent oxidation of NADPH in the spectrophotometric
        assay, the enzyme that catalyzes acryloyl-CoA reduction to propionyl-CoA was enriched
        from extract of autotrophically grown cells.
- term:
    id: GO:0008270
    label: zinc ion binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR002328
  - InterPro:IPR002364
  review:
    summary: InterPro2GO mapping from the zinc-containing alcohol dehydrogenase signature.
      Zinc was measured in the recombinant S. tokodaii ortholog, and the catalytic and
      structural zinc ligands are conserved in Msed_1426.
    action: ACCEPT
    reason: Metal analysis of the 76%-identical S. tokodaii acryloyl-CoA reductase found
      0.8 mol Zn2+ per monomer and no other metal (PMID:19429610). The catalytic GHE motif
      with flanking Cys38 and Cys146, and a structural-site motif, are conserved, matching
      the UniProt zinc binding-site features. EDTA did not inactivate the enzyme, which
      the authors attribute to poor zinc accessibility or thermostability. Zinc binding is
      the cofactor binding that underlies the catalytic activity.
    supported_by:
    - reference_id: PMID:19429610
      supporting_text: a metal analysis (27 elements) of acryloyl-CoA reductase by plasma
        emission spectroscopy revealed the presence of 0.8 mol of Zn 2+ per mol of enzyme
        monomer, whereas other metals could not be detected.
    - reference_id: PMID:19429610
      supporting_text: An alignment of the acryloyl-CoA reductase with the well-studied horse
        liver alcohol dehydrogenase shows the presence of the strictly conserved sequence
        motif GHE of the catalytic zinc binding side (amino acid position 59 to 61) with
        two flanking cysteines (amino acids 38 and 146).
