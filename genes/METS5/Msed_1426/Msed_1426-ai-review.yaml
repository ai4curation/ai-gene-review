- term:
    id: GO:0043958
    label: acryloyl-CoA reductase (NADH) activity
  evidence_type: IDA
  original_reference_id: PMID:19429610
  qualifier: enables
  review:
    summary: The cited paper shows acryloyl-CoA reductase activity, but it states
      explicitly that the enzyme does not use NADH. The NADH-specific term describes a
      different, flavin-containing Clostridium propionicum enzyme of propionate
      fermentation.
    action: MODIFY
    reason: The full text of PMID:19429610 is cached and was read. Every activity assay
      in it uses NADPH, and the authors state twice that NADH is not used as electron
      donor; they also contrast the Metallosphaera enzyme with the unrelated
      NADH-dependent Clostridium acryloyl-CoA reductase. GO:0043958 is defined as
      propanoyl-CoA + NAD+ = acryloyl-CoA + H+ + NADH (L-alanine fermentation). The
      essence of the annotation (acryloyl-CoA reductase activity) is correct, but the
      cofactor is wrong, so this is a lateral correction to GO:0043957 rather than a
      removal. It is probably a term-selection slip.
    proposed_replacement_terms:
    - id: GO:0043957
      label: acryloyl-CoA reductase (NADPH) activity
    supported_by:
    - reference_id: PMID:19429610
      supporting_text: The enzyme did not act on either NADH or crotonyl-CoA.
    - reference_id: PMID:19429610
      supporting_text: The enzyme does not require cofactors and does not use NADH as an
        electron donor.
    - reference_id: PMID:19429610
      supporting_text: An NADH-dependent, oxygen-sensitive acryloyl-CoA reductase has been
        studied in Clostridium propionicum that is involved in propionate fermentation
- term:
    id: GO:0015977
    label: carbon fixation
  evidence_type: IDA
  original_reference_id: PMID:19429610
  review:
    summary: Msed_1426 catalyses the reduction of acryloyl-CoA to propionyl-CoA, a step of
      the 3-hydroxypropionate/4-hydroxybutyrate autotrophic CO2-fixation cycle of M.
      sedula.
    action: NEW
    reason: The enzyme itself catalyses a step of the cycle, so it passes the
      participation test. Its activity is more than ten-fold up-regulated in autotrophic
      cells and appears rate-limiting for 3-hydroxypropionate reduction in extracts
      (PMID:19429610), and it was used as the acr step in the kinetic reconstruction of the
      cycle (PMID:27771364). Sibling catalytic steps (Msed_0709, Msed_1424, Msed_2001)
      carry the same term. GO:0043427 carbon fixation by 3-hydroxypropionate cycle
      describes the Chloroflexus glyoxylate-forming cycle, whose acryloyl-CoA reduction is
      done by an unrelated domain of propionyl-CoA synthase, so it is not used. A
      3HP/4HB-cycle child term is proposed with the Msed_0709 wording.
    supported_by:
    - reference_id: PMID:19429610
      supporting_text: The reductase activity may limit the conversion rate and clearly is
        more than 10-fold downregulated in heterotrophically grown cells.
    - reference_id: PMID:19429610
      supporting_text: These results are consistent with the proposed function in autotrophic
        CO 2 fixation.
    - reference_id: PMID:27771364
      supporting_text: The genes hpcs (Msed_1456), hpcd (Msed_2001), acr (Msed_1426), mcr
        (Msed_0709), and ssr (Msed_1424) were amplified from genomic DNA using the primers
        listed in Supplementary Table S1.
