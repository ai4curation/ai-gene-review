proposed_new_terms:
- proposed_name: carbon fixation by 3-hydroxypropionate/4-hydroxybutyrate cycle
  proposed_definition: An autotrophic carbon dioxide fixation pathway in which acetyl-CoA
    is carboxylated twice by acetyl-CoA/propionyl-CoA carboxylase, and the products are
    reductively converted via 3-hydroxypropionate and succinyl-CoA to 4-hydroxybutyrate.
    4-Hydroxybutyrate is then converted via 4-hydroxybutyryl-CoA dehydratase into two
    molecules of acetyl-CoA. The pathway occurs in autotrophic Sulfolobales and in
    ammonia-oxidizing Thaumarchaeota.
  justification: GO:0043427 carbon fixation by 3-hydroxypropionate cycle is defined as
    the Chloroflexus cycle that releases glyoxylate via malyl-CoA cleavage. The archaeal
    cycle shares only the first half with it, and even there uses separate, unrelated
    enzymes (such as Msed_1426) in place of the Chloroflexus trifunctional propionyl-CoA
    synthase. The same term is proposed in the Msed_0709 review.
  proposed_parent:
    id: GO:0015977
    label: carbon fixation
  supported_by:
  - reference_id: PMID:19429610
    supporting_text: Acryloyl-CoA reductase, a member of the zinc-containing alcohol dehydrogenase
      family, reduces acryloyl-CoA with NADPH to propionyl-CoA.
suggested_questions:
- question: Can the UniProtKB IDA annotation of A4YGN2 to GO:0043958 acryloyl-CoA reductase
    (NADH) activity be corrected to GO:0043957 (NADPH), given that PMID:19429610 states
    the enzyme does not use NADH?
- question: Should TreeGrafter stop propagating alcohol dehydrogenase (NAD+) activity from
    PTN000191633 to the archaeal acryloyl-CoA reductase clade (InterPro IPR053496, NCBIfam
    NF041172)?
- question: Why is Msed_1426 soluble and active only when co-expressed with Msed_1424 in E.
    coli; does it need a partner or folding factor in vivo?
suggested_experiments:
- hypothesis: Msed_1426 is required for autotrophic but not heterotrophic growth of M.
    sedula.
  description: Delete Msed_1426 with a Sulfolobales genetic system and compare growth on
    CO2/H2 with growth on yeast extract; test complementation and accumulation of
    3-hydroxypropionate or acrylate.
- hypothesis: The catalytic zinc site is required for acryloyl-CoA reduction.
  description: Mutate Cys38, His60 and Cys146 of recombinant Msed_1426, measure zinc
    content by ICP-OES and acryloyl-CoA reductase activity, and solve a structure with
    acryloyl-CoA or propionyl-CoA bound.
