- term:
    id: GO:0043957
    label: acryloyl-CoA reductase (NADPH) activity
  evidence_type: EXP
  original_reference_id: PMID:19429610
  qualifier: enables
  review:
    summary: The NADPH-dependent acryloyl-CoA reductase was enriched over 200-fold from
      autotrophic M. sedula and identified by peptide mass fingerprinting as Msed_1426.
      The recombinant 76%-identical S. tokodaii ortholog reduced acryloyl-CoA with NADPH
      (Km 3 uM acryloyl-CoA, 36 uM NADPH).
    action: ACCEPT
    reason: This is the defining activity of the gene. GO:0043957 is defined as
      acryloyl-CoA + NADPH + H+ = propionyl-CoA + NADP+, exactly the reaction measured.
      The activity of the native M. sedula enzyme is direct; the detailed kinetics are
      from the S. tokodaii ortholog. Recombinant M. sedula Msed_1426 itself was later
      purified and assayed by an independent group (PMID:27771364), which confirms the
      assignment.
    supported_by:
    - reference_id: PMID:19429610
      supporting_text: Reinterpretation of the fingerprint mass spectrometry data identified
        the same gene (Msed_1426) in M. sedula as a best hit (100% identity and 73% coverage).
    - reference_id: PMID:19429610
      supporting_text: 'Acryloyl-CoA reductase (E.C. 1.3.1.x) catalyzes the following irreversible
        reaction: acryloyl-CoA + NADPH + H + → propionyl-CoA + NADP + .'
    - reference_id: PMID:27771364
      supporting_text: Note that although the KM for the recombinant versions of ACR from
        M. sedula and S. tokodaii were comparable, this is the first report of a KM for the
        M. sedula enzyme
