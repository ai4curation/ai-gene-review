- term:
    id: GO:0006635
    label: fatty acid beta-oxidation
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000235214
  review:
    summary: TreeGrafter transfer of fatty acid beta-oxidation from PANTHER node
      PTN000235214. Msed_2001 is placed in subfamily PTHR11941:SF54, named for the
      mitochondrial short-chain enoyl-CoA hydratase (ECHS1), whose role is fatty acid
      beta-oxidation.
    action: MARK_AS_OVER_ANNOTATED
    reason: This is a crotonase-family process carried over to an enzyme that was
      recruited into CO2 fixation. GO:0006635 is defined as the complete oxidation of a
      long-chain fatty acid. Msed_2001 has a small enoyl pocket suited to short-chain
      3-hydroxyacyl-CoAs (PMID:30013155), and it has only been characterised on C3 and C4
      substrates. Both of its activities are accounted for by the 3HP/4HB cycle, in
      which Msed_2001 carries 99% of the cell's 3-hydroxypropionyl-CoA dehydratase
      activity and 86% of its crotonyl-CoA hydratase activity (PMID:33472982). No study
      shows that M. sedula degrades fatty acids or that Msed_2001 takes part in doing
      so. In the related Sulfolobus acidocaldarius, beta-oxidation enzymes are encoded in
      a dedicated FadR-regulated gene cluster (PMID:30948713). By contrast, Msed_2001
      is the cycle enzyme conserved across autotrophic Sulfolobales. Crotonyl-CoA
      hydration is the same chemistry as the last round of beta-oxidation, and activity
      is still present in heterotrophically grown cells (PMID:19429610). A minor
      catabolic role therefore cannot be excluded, so the row is marked as an
      over-annotation rather than removed.
    supported_by:
    - reference_id: PMID:30013155
      supporting_text: Ms3HPCD has a tightly formed α3 helix near the active site, and
        bulky aromatic residues are located at the enoyl-group binding site, resulting
        in the enzyme having an optimal substrate binding site for accepting short-chain
        3-hydroxyacyl-CoA as a substrate.
    - reference_id: PMID:33472982
      supporting_text: Msed_2001 is responsible for 99% of 3-hydroxypropionyl-CoA
        dehydratase activity and for 86% of crotonyl-CoA hydratase activity in M. sedula
    - reference_id: PMID:30948713
      supporting_text: acting as a repressor of a 30-kb gene cluster comprising 23 open
        reading frames encoding lipases and β-oxidation enzymes.
