    reason: Direct biochemical evidence from native and recombinant enzyme. The
      activity was confirmed with independently produced enzyme by Loder et al.
      (PMID:27771364) and Liu et al. (PMID:33472982). It is the defining activity of the
      gene in the 3HP/4HB cycle. GO:0043956 is defined as 3-hydroxypropionyl-CoA =
      acryloyl-CoA + H2O (EC 4.2.1.116, RHEA:26518).
    supported_by:
    - reference_id: PMID:19429610
      supporting_text: The best hit was the Msed_2001 gene annotated as an enoyl-CoA
        hydratase gene (100% identity and 41% coverage) coding for a 28.3-kDa (259 amino
        acids) protein.
    - reference_id: PMID:19429610
      supporting_text: '3-Hydroxypropionyl-CoA dehydratase (E.C.4.2.1.17) catalyzes the
        following reversible reaction: 3-hydroxypropionyl-CoA → acryloyl-CoA + H 2 O.'
