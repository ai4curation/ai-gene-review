gene_symbol: Msed_2001
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:399549
  label: Metallosphaera sedula DSM 5348
description: >-
  Msed_2001 encodes the 3-hydroxypropionyl-CoA dehydratase (EC 4.2.1.116) of the
  thermoacidophilic crenarchaeon Metallosphaera sedula. It is a soluble enzyme of the
  enoyl-CoA hydratase (crotonase) family and works in the
  3-hydroxypropionate/4-hydroxybutyrate autotrophic CO2-fixation cycle of the
  Sulfolobales. In the first half of the cycle it dehydrates 3-hydroxypropionyl-CoA to
  acryloyl-CoA, which acryloyl-CoA reductase then reduces to propionyl-CoA. The same
  active site reversibly hydrates crotonyl-CoA to (S)-3-hydroxybutyryl-CoA at a similar
  rate; it does not use the (R) stereoisomer. Quantitative proteomics and kinetics
  indicate that this promiscuous enzyme carries almost all of the cell's
  3-hydroxypropionyl-CoA dehydratase activity and most of its crotonyl-CoA hydratase
  activity, the latter being a step of the second half of the cycle that regenerates
  acetyl-CoA. The crystal structure with CoA shows the conserved crotonase catalytic
  glutamates (Glu113, Glu133) and a small enoyl pocket lined by bulky aromatic residues,
  suited to short-chain substrates. Reported oligomeric states differ (monomer, hexamer,
  octamer). The enzyme is conserved in autotrophic Sulfolobales and is unrelated to the
  dehydratase domain of the Chloroflexus propionyl-CoA synthase.
