  review:
    summary: The dehydratase was purified from autotrophically grown M. sedula and
      identified by peptide mass fingerprinting as Msed_2001. The recombinant His-tagged
      enzyme dehydrated 3-hydroxypropionyl-CoA to acryloyl-CoA (Km 60 uM, kcat about
