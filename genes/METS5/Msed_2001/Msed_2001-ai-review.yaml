proposed_new_terms:
- proposed_name: carbon fixation by 3-hydroxypropionate/4-hydroxybutyrate cycle
  proposed_definition: An autotrophic carbon dioxide fixation pathway in which acetyl-CoA
    is carboxylated twice by acetyl-CoA/propionyl-CoA carboxylase, and the products are
    reductively converted via 3-hydroxypropionate and succinyl-CoA to 4-hydroxybutyrate.
    4-Hydroxybutyrate is then converted via 4-hydroxybutyryl-CoA dehydratase into two
    molecules of acetyl-CoA. The pathway occurs in autotrophic Sulfolobales and in
    ammonia-oxidizing Thaumarchaeota.
  justification: GO:0043427 carbon fixation by 3-hydroxypropionate cycle is defined as
    the Chloroflexus cycle that releases glyoxylate via malyl-CoA cleavage. The archaeal
    3HP/4HB cycle shares only the first half of that route, uses unrelated enzymes for
    it, and regenerates acetyl-CoA via 4-hydroxybutyrate and crotonyl-CoA. Msed_2001
    catalyses steps in both halves of the archaeal cycle. This proposal repeats the one
    in the Msed_0709 review.
  proposed_parent:
    id: GO:0015977
    label: carbon fixation
  supported_by:
  - reference_id: PMID:18079405
    supporting_text: This intermediate was reduced to 4-hydroxybutyrate and converted
      into two acetyl-CoA molecules via 4-hydroxybutyryl-CoA dehydratase.
suggested_questions:
- question: UniProt annotates the preceding enzyme, Msed_1456, to GO:0043427 carbon
    fixation by 3-hydroxypropionate cycle by IDA, and ARBA spreads the term across
    archaea. Yet the term is defined as the Chloroflexus glyoxylate-forming cycle.
    Should GO broaden GO:0043427, or create a separate 3HP/4HB-cycle term, so that
    enzymes of the two cycles are annotated consistently?
- question: What is the true oligomeric state of Msed_2001? Gel filtration gave a
    monomer, the crystal structure and size exclusion gave a hexamer, and Loder et al.
    reported an octamer. Does it form a complex with 3-hydroxypropionyl-CoA synthetase
    (Msed_1456) in vivo?
- question: Should PANTHER separate the archaeal 3-hydroxypropionyl-CoA dehydratase
    clade from the ECHS1-named subfamily PTHR11941:SF54, so that TreeGrafter stops
    propagating fatty acid beta-oxidation to it?
suggested_experiments:
- hypothesis: Msed_2001 is required for autotrophic growth of M. sedula and is the main
    crotonyl-CoA hydratase in vivo.
  description: Delete Msed_2001 in M. sedula or a genetically tractable Sulfolobales
    relative, for example Sulfolobus acidocaldarius with a reconstituted pathway or its
    ortholog in a related autotroph. Compare autotrophic and heterotrophic growth, and
    measure 3-hydroxypropionyl-CoA dehydratase and crotonyl-CoA hydratase activities in
    extracts.
- hypothesis: Msed_2001 contributes to fatty acid or butyrate catabolism during
    heterotrophic growth.
  description: Test recombinant Msed_2001 with C6 to C16 trans-2-enoyl-CoAs to define
    its chain-length limit. Compare Msed_2001 protein levels and growth of a deletion
    strain on fatty acids versus peptides.
