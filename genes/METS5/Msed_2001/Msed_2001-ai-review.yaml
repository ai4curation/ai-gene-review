- term:
    id: GO:0120092
    label: (2E)-butenoyl-CoA hydratase activity
  evidence_type: IDA
  original_reference_id: PMID:33472982
  review:
    summary: Recombinant Msed_2001 reversibly hydrates crotonyl-CoA to
      (S)-3-hydroxybutyryl-CoA. It is about as active on (S)-3-hydroxybutyryl-CoA as on
      3-hydroxypropionyl-CoA and is inactive on the (R) isomer. Kinetics and
      quantitative proteomics show it carries most of the cell's crotonyl-CoA hydratase
      activity in autotrophic growth.
    action: NEW
    reason: This is a second physiological activity, not a side activity. Crotonyl-CoA
      hydration is a step of the acetyl-CoA-regenerating half of the 3HP/4HB cycle, and
      Liu et al. assign about 86% of that flux in M. sedula to Msed_2001
      (PMID:33472982). GO:0120092 is defined as 3-hydroxybutanoyl-CoA = (2E)-butenoyl-CoA
      + H2O and does not specify stereochemistry. Its Rhea cross-references include
      RHEA:26558, the (3S) reaction, which Rhea links to EC 4.2.1.116. GO:0120092 is
      neither an ancestor nor a descendant of GO:0043956.
    supported_by:
    - reference_id: PMID:19429610
      supporting_text: 3-Hydroxypropionyl-CoA dehydratase acted nearly equally as well
        on ( S )-3-hydroxybutyryl-CoA as on 3-hydroxypropionyl-CoA.
    - reference_id: PMID:19429610
      supporting_text: The enzyme did not convert the ( R )-stereoisomer of
        3-hydroxybutyryl-CoA.
    - reference_id: PMID:33472982
      supporting_text: we conclude that Msed_2001 is a promiscuous 3-hydroxypropionyl-CoA
        dehydratase/crotonyl-CoA hydratase that is responsible for both conversions in
        vivo.
- term:
    id: GO:0015977
    label: carbon fixation
  evidence_type: IDA
  original_reference_id: PMID:19429610
  review:
    summary: Msed_2001 catalyses two steps of the 3-hydroxypropionate/4-hydroxybutyrate
      autotrophic CO2-fixation cycle of M. sedula. These are 3-hydroxypropionyl-CoA
      dehydration in the first half and crotonyl-CoA hydration in the second half.
    action: NEW
    reason: The enzyme catalyses two of the cycle's steps itself, so it passes the
      participation test. Comparators in the same role (catalysts of cycle steps) carry
      carbon-fixation process terms. The 3-hydroxypropionyl-CoA synthetase Msed_1456,
      the preceding enzyme, has GO:0043427 by IDA (PMID:18165310) in GOA, and the
      Msed_0709 review adds GO:0015977 for malonyl-CoA reductase. GO:0043427 carbon
      fixation by 3-hydroxypropionate cycle is defined as the Chloroflexus
      glyoxylate-forming cycle, an independently evolved pathway that uses unrelated
      enzymes for this step (PMID:19429610). It is therefore not used here, consistent
      with the Msed_0709 review. A specific 3HP/4HB-cycle child term is proposed instead,
      and the parent GO:0015977 is the most precise correct existing term.
    supported_by:
    - reference_id: PMID:19429610
      supporting_text: In M. sedula the reaction sequence is catalyzed by three enzymes.
    - reference_id: PMID:33472982
      supporting_text: we conclude that Msed_2001 is a promiscuous 3-hydroxypropionyl-CoA
        dehydratase/crotonyl-CoA hydratase that is responsible for both conversions in
        vivo.
    - reference_id: PMID:18079405
      supporting_text: This intermediate was reduced to 4-hydroxybutyrate and converted
        into two acetyl-CoA molecules via 4-hydroxybutyryl-CoA dehydratase.
