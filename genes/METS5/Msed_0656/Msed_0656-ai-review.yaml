  evidence_type: IDA
  original_reference_id: PMID:24532060
  review:
    summary: Msed_0656 catalyses the last step of the 3HP/4HB autotrophic CO2-fixation
      cycle, the cleavage of acetoacetyl-CoA into two acetyl-CoA, which regenerates the
      CO2 acceptor. The branch was reconstituted in vitro with Msed_0656 and three
      other recombinant enzymes.
    action: NEW
    reason: The enzyme catalyses a step of the cycle itself, so it passes the
      participation test. Comparators in the same role (catalysts of individual cycle
      steps), namely Msed_0406, Msed_1424, Msed_0709 and Msed_2001, carry GO:0015977 in
      their reviews. GO:0043427 is the Chloroflexus glyoxylate-forming cycle and is not
      used. GO:0015977 is the most precise correct existing term, and the 3HP/4HB-cycle
      child term from the Msed_0709 review is repeated below. As a caveat, paralogs such as
      Msed_0386 may share the reaction in vivo (PMID:32218776), and there is no genetic
      evidence.
    supported_by:
