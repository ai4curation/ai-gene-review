proposed_new_terms:
- proposed_name: carbon fixation by 3-hydroxypropionate/4-hydroxybutyrate cycle
  proposed_definition: An autotrophic carbon dioxide fixation pathway in which acetyl-CoA
    is carboxylated twice by acetyl-CoA/propionyl-CoA carboxylase, and the products are
    reductively converted via 3-hydroxypropionate and succinyl-CoA to 4-hydroxybutyrate.
    4-Hydroxybutyrate is then converted via 4-hydroxybutyryl-CoA dehydratase into two
    molecules of acetyl-CoA. The pathway occurs in autotrophic Sulfolobales and in
    ammonia-oxidizing Thaumarchaeota.
  justification: GO:0043427 carbon fixation by 3-hydroxypropionate cycle is defined as
    the Chloroflexus cycle that releases glyoxylate via malyl-CoA cleavage. Msed_0656
    catalyses the acetyl-CoA-regenerating final step of the archaeal cycle, which has no
    counterpart in that term. This proposal repeats the one in the Msed_0709 review.
  proposed_parent:
    id: GO:0015977
    label: carbon fixation
  supported_by:
  - reference_id: PMID:24532060
    supporting_text: were produced recombinantly in Escherichia coli , combined in vitro
      , and shown to convert 4HB to acetyl-CoA
suggested_questions:
- question: How is the acetoacetyl-CoA thiolase flux of autotrophic M. sedula divided
    between Msed_0656 and its paralogs (Msed_0386, Msed_0396, Msed_1647, Msed_1290,
    Msed_0270, Msed_0271)?
- question: Does Msed_0656 also supply acetoacetyl-CoA for the archaeal mevalonate
    pathway, as the ARBA "Isoprene biosynthesis" keyword implies, or does a different
    paralog do so?
suggested_experiments:
- hypothesis: Msed_0656 is the main acetoacetyl-CoA thiolase of the autotrophic cycle.
  description: Quantify the thiolase paralogs by proteomics in autotrophic cells. Assay
    recombinant Msed_0386 and Msed_0396 kinetically, and if genetics allow, delete
    Msed_0656 in a tractable Sulfolobales host and measure acetoacetyl-CoA thiolase
    activity and autotrophic growth.
