product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:399549
  label: Metallosphaera sedula DSM 5348
description: >-
  Msed_0656 encodes an acetoacetyl-CoA beta-ketothiolase (acetyl-CoA
  C-acetyltransferase, EC 2.3.1.9) of the thermoacidophilic crenarchaeon Metallosphaera
  sedula. It is a 395-residue member of the thiolase family with the conserved thiolase
  N- and C-terminal domains. In the 3-hydroxypropionate/4-hydroxybutyrate autotrophic
  CO2-fixation cycle of the Sulfolobales, it catalyses the final step, the
  CoA-dependent thiolytic cleavage of acetoacetyl-CoA into two acetyl-CoA. One acetyl-CoA
  re-enters the cycle as the CO2 acceptor and the other is released for biosynthesis.
  The gene was first assigned by its similarity to bacterial thiolases and by its
  induction under autotrophic growth. The recombinant enzyme cleaves acetoacetyl-CoA
  with a Km of 0.18 mM and a high specific activity (about 140 U/mg at 70 C), making it
  the fastest enzyme of the acetyl-CoA-regenerating branch, and it supports in vitro
  reconstitution of the conversion of 4-hydroxybutyrate to acetyl-CoA. M. sedula has
  several other thiolase paralogs, at least one of which is also induced in autotrophy
  and may contribute to the reaction.
