- term:
    id: GO:0061639
    label: Cdv-dependent cytokinesis
  evidence_type: ISS
  original_reference_id: PMID:32502411
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q4J8Y4
  review:
    summary: >-
      Orthology-based inference from S. acidocaldarius CdvB2 (Saci_1416, Q4J8Y4), whose
      role as a subunit of the constricting ESCRT-III division ring is shown by
      deletion and rescue, imaging and structural work. Msed_1695 has not been tested
      directly.
    action: NEW
    reason: >-
      Orthology: Msed_1695 is in the CdvB1/CdvB2 family (NCBIfam NF041005), is 64.8%
      identical to and the reciprocal best hit of S. acidocaldarius CdvB2, and shares
      five neighbouring-gene arCOGs with the cdvB2 locus and none with cdvB1. Its sister
      paralog Msed_2179 has been independently named M. sedula CdvB1 (PMID:35238034).
      Participation: in S. acidocaldarius, CdvB2 does part of the work of the process. It
      is a structural subunit of the contractile ESCRT-III ring, keeps the ring centred
      during constriction, coats the membrane bridge, and its Vps4-dependent disassembly
      is linked to scission (PMID:32502411, PMID:36921039). It is not merely required or
      a substrate. GO:0061639 was coined for the Cdv machinery, and GO:0000910
      cytokinesis directs prokaryotic annotation to it. Comparator check (QuickGO,
      2026-10-15): GO:0061639 has no annotations on any gene product, including the
      experimentally studied S. acidocaldarius CdvB, CdvB1 and CdvB2. This reflects the
      lack of any GO curation of archaeal Cdv proteins, not a convention against
      annotating them. Evidence is ISS from Q4J8Y4. No M. sedula experiment exists for
      this protein.
    additional_reference_ids:
    - PMID:36921039
    - PMID:32764038
    - PMID:35238034
    - PMID:41543908
    supported_by:
    - reference_id: PMID:32502411
      supporting_text: These data suggested that CdvB2 is recruited (along with CdvB1)
        to the correct position at the cell center by the CdvB ring and functions,
        following the loss of CdvB, to prevent the division ring from slipping as it
        constricts.
    - reference_id: PMID:36921039
      supporting_text: membrane scission depends on disassembly of polymeric CdvB2 from
        the cytokinetic bridge
    - reference_id: PMID:35238034
      supporting_text: The gene for CdvB1 from Metallosphaera sedula (Msed_2179, UniProtID
        A4YIR6) was obtained from the Gen Bank database
    - reference_id: file:METS5/Msed_1695/Msed_1695-bioinformatics/RESULTS.md
      supporting_text: Msed_1695 is the CdvB2 ortholog of M. sedula
