  label: Metallosphaera sedula DSM 5348
description: >-
  Msed_1695 encodes a 221-residue ESCRT-III-family (Snf7-domain) protein of the
  thermoacidophilic crenarchaeon Metallosphaera sedula. It is the ortholog of
  Sulfolobus acidocaldarius CdvB2 (Saci_1416): it belongs to the CdvB1/CdvB2 family of
  archaeal ESCRT-III proteins, is the reciprocal best hit of S. acidocaldarius CdvB2,
  and lies in the conserved cdvB2 gene neighbourhood, while its close paralog Msed_2179
  is CdvB1. The protein has not been studied directly. By orthology it is expected to
  act in the Cdv cell-division machinery of the Sulfolobales. There, CdvB2 is recruited
  with CdvB1 onto a template ring of CdvB at mid-cell. After CdvB is degraded, CdvB2
  forms part of the constricting ESCRT-III polymer that keeps the ring centred, coats the
  narrowing membrane bridge and, when disassembled by the AAA+ ATPase Vps4/CdvC, allows
  membrane scission between the daughter cells. In S. acidocaldarius, CdvB2 binds
  archaeal membranes through short N-terminal amphipathic helices and forms helical
  filaments.
existing_annotations:
- term:
    id: GO:0007034
    label: vacuolar transport
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR005024
  review:
    summary: >-
      Electronic InterPro2GO transfer from the Snf7 family (IPR005024, Pfam PF03357) to
      vacuolar transport. Msed_1695 is an archaeal ESCRT-III protein, the M. sedula
      ortholog of S. acidocaldarius CdvB2, whose known role is in Cdv-dependent cell
      division. Archaea have no vacuole.
    action: REMOVE
    reason: >-
      The mapping encodes the eukaryotic ESCRT-III role in multivesicular body sorting
      and transport to the vacuole/lysosome. M. sedula, like all archaea, has no vacuole
      or endosomal system, so the process cannot occur, and no data link this protein
      or any archaeal ESCRT-III protein to vacuolar transport. The archaeal ESCRT-III
      CdvB1/CdvB2 proteins act in cell division (PMID:32764038, PMID:32502411,
      PMID:36921039). This is not a MODIFY: transport into or within a vacuole is a
      different process from cytokinesis, not a less specific term for it, so the
      division process is proposed separately as a NEW row. The same InterPro2GO
      mapping puts GO:0007034 on 41 archaeal ESCRT-III homologs (QuickGO, 2026-10-15);
      in M. sedula it hits only Msed_1695 because only this paralog also matches the
      Pfam Snf7 model. Restricting the IPR005024 to GO:0007034 mapping to Eukaryota
      would fix the whole set.
