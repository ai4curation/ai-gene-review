core_functions:
- description: >-
    Inferred by orthology to S. acidocaldarius CdvB2, not shown directly for this
    protein. Msed_1695 is expected to be a subunit of the CdvB1:CdvB2 ESCRT-III polymer
    that assembles on the CdvB template ring at the mid-cell division site. There it
    keeps the constricting ring centred and coats the cytokinetic membrane bridge, and
    its Vps4/CdvC-dependent disassembly is linked to the final membrane scission.
