suggested_questions:
- question: Should the InterPro2GO mapping of IPR005024 (Snf7 family) to GO:0007034
    vacuolar transport be restricted to Eukaryota? It currently places vacuolar transport
    on 41 archaeal ESCRT-III homologs, and within one genome it hits CdvB1/B2 paralogs
    inconsistently depending on whether the Pfam Snf7 model matches.
- question: Does M. sedula CdvB2 (Msed_1695) share the S. acidocaldarius CdvB2 role in
    keeping the division ring centred, or have the CdvB1 and CdvB2 roles been partitioned
    differently in Metallosphaera?
suggested_experiments:
- description: Immunolocalize or tag Msed_1695 in M. sedula cells, together with CdvB
    (Msed_1671) and CdvB1 (Msed_2179), to test whether it forms a mid-cell ring that follows
    the CdvB template ring and persists during constriction.
  experiment_type: immunofluorescence microscopy
- description: Purify Msed_1695 and test liposome binding, filament formation and
    depolymerization by M. sedula CdvC, in parallel with the published M. sedula CdvB1
    assays.
  experiment_type: in vitro reconstitution
