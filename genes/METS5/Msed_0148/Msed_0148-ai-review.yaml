gene_symbol: Msed_0148
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:399549
  label: Metallosphaera sedula DSM 5348
description: >-
  Msed_0148 encodes the biotin carboxyl carrier protein (BCCP, beta subunit, 18.6 kDa) of the
  acetyl-CoA/propionyl-CoA carboxylase of the thermoacidophilic crenarchaeon Metallosphaera sedula.
  This bifunctional biotin-dependent enzyme catalyses both carboxylations of the
  3-hydroxypropionate/4-hydroxybutyrate autotrophic CO2-fixation cycle. The holoenzyme is a complex of
  about 560 kDa, probably (alpha beta gamma)4. Its other subunits are the biotin carboxylase
  (Msed_0147, encoded by the gene just upstream and translationally coupled to Msed_0148) and the
  carboxyltransferase (Msed_1375). The C-terminal biotinyl domain carries the covalently attached biotin
  prosthetic group. The biotin carboxylase subunit carboxylates this biotin with ATP and bicarbonate, and
  the carboxybiotin then delivers the carboxyl group to acetyl-CoA or propionyl-CoA at the
  carboxyltransferase site. As in other Sulfolobales, the residue after the biotinylated lysine is a
  serine rather than the usual methionine. The M. sedula biotin protein ligase (Msed_2010) biotinylates
  this subunit in vitro, and poor biotinylation by heterologous ligases limits the activity of the
  recombinant enzyme. The gene is strongly induced under autotrophic growth. Small biotinylated proteins
  of this kind are abundant in autotrophic Sulfolobales but absent from archaea that use other
  CO2-fixation pathways.
existing_annotations:
- term:
    id: GO:0003989
    label: acetyl-CoA carboxylase activity
  evidence_type: IDA
  original_reference_id: PMID:12581213
  qualifier: contributes_to
  review:
    summary: GOA has no annotation for this protein. The purified complex that contains the 18.6 kDa
      biotin carrier subunit carboxylates acetyl-CoA to malonyl-CoA with ATP and bicarbonate.
    action: NEW
    reason: The BCCP subunit has no catalytic site of its own, but it carries the biotin cofactor that
      both half-reactions depend on. It is carboxylated by the biotin carboxylase subunit and donates the
      carboxyl group at the carboxyltransferase site. It therefore contributes to the activity of the
      complex (the cofactor case of the participation test) and does not enable it alone. GO has no
      carboxyl-carrier molecular-function term, so contributes_to the whole-enzyme activity is the most
      informative function annotation available.
    supported_by:
    - reference_id: PMID:12581213
      supporting_text: The enzyme consists of two large subunits of 57 kDa each representing biotin
        carboxylase (alpha) and carboxytransferase (gamma), respectively, and a small 18.6 kDa biotin
        carrier protein (beta).
    - reference_id: PMID:27315782
      supporting_text: BPL is responsible for attaching biotin to ACC-β (BCCP) to create active
        holoenzyme
    - reference_id: PMID:23530213
