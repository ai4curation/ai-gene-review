    covalently bound biotin is carboxylated by the biotin carboxylase subunit (Msed_0147) and carries the
    carboxyl group to acetyl-CoA at the carboxyltransferase subunit (Msed_1375), forming malonyl-CoA in
    the 3-hydroxypropionate/4-hydroxybutyrate CO2-fixation cycle.
