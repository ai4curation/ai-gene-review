suggested_questions:
- question: GO has no molecular-function term for the carboxyl-carrier role of a BCCP (by analogy with
    GO:0000036 acyl carrier activity). Should GO add a "biotin carboxyl carrier activity" term, so that
    BCCP subunits need not be annotated only through contributes_to the whole-enzyme activity?
- question: GO:0009317 acetyl-CoA carboxylase complex is defined by fatty acid biosynthesis. Should it
    be generalized, or a new complex term made, to cover the archaeal bifunctional
    acetyl-CoA/propionyl-CoA carboxylase?
suggested_experiments:
- hypothesis: Lys133, in the AMKS motif, is the single biotinylation site of Msed_0148, and the serine
    at position +1 is what restricts biotinylation to Sulfolobales-type biotin protein ligases.
  description: Biotinylate recombinant Msed_0148 with Msed_2010 and map the modified residue by LC-MS/MS.
    Test K133A and S134M variants for biotinylation by Msed_2010 and by E. coli BirA, and test
    reconstituted holoenzyme activity with acetyl-CoA and propionyl-CoA.
