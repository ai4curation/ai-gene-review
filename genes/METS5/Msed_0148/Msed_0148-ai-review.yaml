- term:
    id: GO:0015977
    label: carbon fixation
  evidence_type: IDA
  original_reference_id: PMID:12581213
  qualifier: involved_in
  review:
    summary: The acetyl-CoA/propionyl-CoA carboxylase is the CO2-fixing enzyme of the
      3-hydroxypropionate/4-hydroxybutyrate cycle. BCCP carries the fixed carboxyl group between the two
      active sites of the enzyme.
    action: NEW
    reason: The protein does part of the work of the fixation step. Its biotin carries the activated
      bicarbonate-derived carboxyl group from the biotin carboxylase site to the acyl-CoA at the
      carboxyltransferase site, so it is a cofactor-carrying participant, not merely a requirement. The
      gene is among the most strongly induced under autotrophic growth. Comparator check - BCCPs are
      annotated to the processes that their carboxylases serve, for example E. coli AccB to fatty acid
      biosynthetic process and malonyl-CoA biosynthetic process. GO:0043427 is the Chloroflexus cycle and
      is not used. A specific 3HP/4HB-cycle child term is proposed in the Msed_0709 review. Until it
      exists, GO:0015977 is the most precise correct term.
    supported_by:
    - reference_id: PMID:9973333
      supporting_text: They contained large amounts of a small biotin-carrying protein, which is most
        likely part of the acetyl-CoA and propionyl-CoA carboxylases.
    - reference_id: PMID:18079405
      supporting_text: We discovered that an autotrophic member of the archaeal order Sulfolobales,
        Metallosphaera sedula, fixed CO2 with acetyl-coenzyme A (acetyl-CoA)/propionyl-CoA
        carboxylase as the key carboxylating enzyme.
    - reference_id: PMID:24532060
      supporting_text: especially the genes encoding acetyl-CoA/propionyl-CoA carboxylase (ACCαβγ)
        (Msed_0147, Msed_0148, Msed_1375; 7- to 30-fold)
