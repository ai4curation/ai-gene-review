proposed_new_terms:
- proposed_name: carbon fixation by 3-hydroxypropionate/4-hydroxybutyrate cycle
  proposed_definition: An autotrophic carbon dioxide fixation pathway in which acetyl-CoA
    is carboxylated twice by acetyl-CoA/propionyl-CoA carboxylase, and the products are
    reductively converted via 3-hydroxypropionate and succinyl-CoA to 4-hydroxybutyrate.
    4-Hydroxybutyrate is then converted via 4-hydroxybutyryl-CoA dehydratase into two
    molecules of acetyl-CoA. The pathway occurs in autotrophic Sulfolobales and in
    ammonia-oxidizing Thaumarchaeota.
  justification: GO:0043427 carbon fixation by 3-hydroxypropionate cycle is defined
    as the Chloroflexus cycle that releases glyoxylate via malyl-CoA cleavage. The archaeal
    3HP/4HB cycle shares only the first half, which includes the methylmalonyl-CoA
    epimerase step, and regenerates acetyl-CoA via 4-hydroxybutyrate. Its enzymes
    therefore have no specific process term. The same term is proposed in the Msed_0709
    review.
  proposed_parent:
    id: GO:0015977
    label: carbon fixation
  supported_by:
  - reference_id: PMID:18079405
    supporting_text: This intermediate was reduced to 4-hydroxybutyrate and converted
      into two acetyl-CoA molecules via 4-hydroxybutyryl-CoA dehydratase.
suggested_questions:
- question: Which divalent metal occupies the VOC-fold active site of M. sedula MCE in
    vivo, given that recombinant enzyme was activated by Ni2+, Co2+ and Mg2+?
- question: Is the epimerase step rate-limiting at physiological temperature, given that
    (S)/(R)-methylmalonyl-CoA also epimerizes non-enzymatically?
suggested_experiments:
- hypothesis: Msed_0639 is required for efficient autotrophic growth of M. sedula.
  description: Delete Msed_0639 and compare growth on CO2/H2 with heterotrophic growth.
    Measure (S)-methylmalonyl-CoA accumulation and the residual rate of conversion to
    succinyl-CoA in extracts.
- hypothesis: MCE uses a specific divalent metal ion bound by conserved VOC-fold residues.
  description: Determine the metal content of the native or anaerobically purified enzyme
    by ICP-MS, and test alanine substitutions of the predicted metal-ligand residues.
