  review:
    summary: TreeGrafter assignment of the family-level process. The epimerase
      interconverts the two methylmalonyl-CoA epimers, so L-methylmalonyl-CoA is its
      substrate or product.
    action: KEEP_AS_NON_CORE
    reason: The term is true, because the enzyme catalyses a reaction of
      L-methylmalonyl-CoA metabolism. The GO definition frames it around odd-chain fatty
      acid oxidation in animals, but in M. sedula the reaction is a step of autotrophic
      CO2 fixation, which is the gene's core process (GO:0015977, added below). The term is
      not a parent of carbon fixation, so it is kept as an accurate, non-core
      metabolite-level process term rather than marked too general.
    supported_by:
    - reference_id: PMID:22752162
      supporting_text: The two enzymes together catalyzed the two-step conversion of (S)-methylmalonyl-CoA
        to succinyl-CoA, consistent with their proposed role in the 3-HP/4-HB cycle.
- term:
    id: GO:0015977
    label: carbon fixation
  evidence_type: IDA
  original_reference_id: PMID:22752162
  review:
    summary: MCE converts (S)-methylmalonyl-CoA, the product of propionyl-CoA
      carboxylation, into (R)-methylmalonyl-CoA for the mutase. This is a step of the
      3-hydroxypropionate/4-hydroxybutyrate autotrophic CO2-fixation cycle of M. sedula,
      and Msed_0639 transcription is induced under autotrophic growth.
    action: NEW
    reason: The evidence goes beyond homology. The recombinant enzyme has the activity,
      performs the cycle step together with MCM, and its gene is significantly upregulated
      under autotrophic compared with heterotrophic growth (PMID:22752162). The enzyme
      catalyses a step of the cycle, so it passes the participation test. Comparators in
      the same role (catalysts of individual cycle steps), namely Msed_0709, Msed_1424,
      Msed_0406 and Msed_2001, carry GO:0015977 in their reviews. GO:0043427 is the
      Chloroflexus glyoxylate-forming cycle and is not used, and a 3HP/4HB-cycle child term
      is proposed below. Caveats are that no genetic evidence exists, and that the activity
      is for the recombinant enzyme, not a measurement in cell extracts.
    supported_by:
    - reference_id: PMID:22752162
      supporting_text: The expression of all three genes was significantly upregulated under
        autotrophic compared to heterotrophic growth conditions, implying a role in CO(2)
        fixation.
    - reference_id: PMID:22752162
      supporting_text: The two enzymes together catalyzed the two-step conversion of (S)-methylmalonyl-CoA
        to succinyl-CoA, consistent with their proposed role in the 3-HP/4-HB cycle.
    - reference_id: PMID:18079405
      supporting_text: In this system, one acetyl-CoA and two bicarbonate molecules were reductively
        converted via 3-hydroxypropionate to succinyl-CoA.
