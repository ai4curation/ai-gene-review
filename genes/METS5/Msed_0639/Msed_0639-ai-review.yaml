  label: Metallosphaera sedula DSM 5348
description: >-
  Msed_0639 encodes the methylmalonyl-CoA epimerase (MCE) of the thermoacidophilic
  crenarchaeon Metallosphaera sedula. It is a 140-residue protein of the vicinal oxygen
  chelate (VOC, glyoxalase-like) fold. The recombinant enzyme is a homodimer that is
  activated by the divalent cations Ni2+, Co2+ and Mg2+, and has a high specific activity
  (218 umol/min/mg at 75 C). It interconverts (S)- and (R)-methylmalonyl-CoA. In the
  3-hydroxypropionate/4-hydroxybutyrate autotrophic CO2-fixation cycle it converts the
  (S)-methylmalonyl-CoA formed by propionyl-CoA carboxylation into the (R)-epimer, which
  the adjacent-gene product, methylmalonyl-CoA mutase (Msed_0638 with Msed_2055), then
  rearranges to succinyl-CoA. Its transcription is induced under autotrophic growth.
  Single copies of the gene are conserved across Sulfolobaceae genomes.
