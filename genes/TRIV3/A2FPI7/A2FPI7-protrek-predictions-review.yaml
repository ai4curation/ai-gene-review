id: A2FPI7
gene_symbol: A2FPI7
taxon:
  id: NCBITaxon:412133
  label: Trichomonas vaginalis G3
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for a 129-aa KilA-N domain protein from Trichomonas
  vaginalis, one of the many laterally-transferred viral/bacterial genes in that genome.
  ProTrek reads the phage provenance rather than the domain function: its top calls are
  plasmid maintenance and extrachromosomal circular DNA, and the Function channel returns
  the Kluyveromyces killer-plasmid and the ICEBs1 excisionase descriptions. That is a
  real signal - KilA-N is a phage protein domain - but it reports the mobile element the
  domain came from instead of what the domain does. The DNA-binding activity that
  KilA-N/APSES domains are defined by, and that this review assigns as the core function,
  is not retrieved in the top 25. ProtNLM2 predicted DNA binding for this protein, which
  the ARGO-ProtNLM-50 evaluation scored as one of its correct novel calls and an
  InterPro2GO coverage gap; ProTrek misses it.
  Assessment: 0 correct (COR/CNN/LSP), 1 uncertain (UNC), 2 incorrect (NPI).
source_documents:
  - projects/PROTREK_EVALUATION/argo50_protrek_hits.tsv
  - genes/TRIV3/A2FPI7/A2FPI7-uniprot.txt
predictions:
  - source_method: ProTrek
    source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
    source_reference_id: PMID:41039041
    predicted_term:
      id: GO:0006276
      label: plasmid maintenance
    predicted_term_type: GO_BP
    review:
      assessment: UNC
      confidence_score: 1
      summary: >-
        Top-ranked hit (score 10.86). KilA-N was first described in bacteriophage and
        plasmid-borne regulatory proteins, so the association is not fabricated - but T.
        vaginalis is a eukaryote with no plasmid, the gene sits in the nuclear genome as a
        lateral transfer, and there is no evidence this protein participates in maintaining
        any replicon. Recorded as uncertain because the retrieval has identified the domain's
        genuine evolutionary origin while saying nothing usable about the protein's function
        in its current host.
      supported_by:
        - reference_id: file:TRIV3/A2FPI7/A2FPI7-uniprot.txt
          supporting_text: KilA-N domain-containing protein
  - source_method: ProTrek
    source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
    source_reference_id: PMID:41039041
    predicted_term:
      id: GO:0005727
      label: extrachromosomal circular DNA
    predicted_term_type: GO_CC
    review:
      assessment: NPI
      confidence_score: 0
      error_type: TAXON_CONSTRAINT_VIOLATION
      summary: >-
        Rank 2 (score 10.33). A cellular-component call placing the protein on an
        extrachromosomal replicon that T. vaginalis does not have. It also mislocalises the
        protein relative to this review's assignment (nucleus), and it compounds the rank-1
        error by turning a provenance signal into a physical location.
      supported_by:
        - reference_id: file:TRIV3/A2FPI7/A2FPI7-uniprot.txt
          supporting_text: KilA-N domain-containing protein
  - source_method: ProTrek
    source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
    source_reference_id: PMID:41039041
    predicted_term:
      id: GO:0030322
      label: stabilization of membrane potential
    predicted_term_type: GO_BP
    review:
      assessment: NPI
      confidence_score: 0
      error_type: FREQUENCY_BIAS
      summary: >-
        Rank 3 (score 9.95), with potassium ion leak channel activity behind it at rank 4.
        Below a score of 10 the list has left the phage neighbourhood and is returning
        unrelated membrane biology; the protein has no transmembrane segment. The useful
        observation for this benchmark is that the transition from "defensible but not
        useful" to "noise" happens within the top five for this query, at almost exactly the
        score-10 boundary seen in the other low-scoring cases.
      supported_by:
        - reference_id: file:TRIV3/A2FPI7/A2FPI7-uniprot.txt
          supporting_text: KilA-N domain-containing protein
