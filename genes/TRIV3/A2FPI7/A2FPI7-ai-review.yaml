taxon:
  id: NCBITaxon:412133
  label: Trichomonas vaginalis G3
description: >-
  A2FPI7 (ORFs TVAG_233530 and TVAG_559790, two identical loci in the G3 draft assembly)
  is a predicted 129-amino-acid protein of the parabasalid parasite Trichomonas vaginalis
  that consists almost entirely of a single KilA-N domain (residues ~19-127). KilA-N is a
  winged helix-turn-helix-like module first defined in proteins of large bacterial and
  eukaryotic DNA viruses and proposed to be a DNA-binding domain; it shares a fold with,
  and is the likely viral ancestor of, the APSES DNA-binding domain of fungal
  transcription factors such as yeast Mbp1 and Swi4. A2FPI7 belongs to PANTHER family
  PTHR48135, a KilA-N lineage of bacteria and phages that has undergone a massive
  lineage-specific expansion in T. vaginalis (over 1,300 of ~1,670 family members are
  T. vaginalis proteins); it is not an ortholog of the characterised fungal APSES factors,
  and no member of its family has been studied experimentally. A2FPI7 is therefore best
  described as a probable, uncharacterised DNA-binding protein; its binding specificity,
  subcellular location, targets and biological role are unknown, and the protein has not
  been detected experimentally (UniProt protein existence level 4, predicted).
existing_annotations:
  - term:
      id: GO:0003677
      label: DNA binding
    evidence_type: ISM
    original_reference_id: file:TRIV3/A2FPI7/A2FPI7-uniprot.txt
    review:
      summary: >-
        GOA has no annotations for A2FPI7; this row is a proposed annotation. A2FPI7 is a
        stand-alone KilA-N domain (Pfam PF04383 24-126, SMART SM01252 28-127, PROSITE
        PS51301 19-124). Iyer et al. (2002) defined KilA-N as a conserved DNA-binding domain
        of viral regulators and argued from fold-level evidence that it is homologous to the
        fungal APSES DNA-binding domain, whose DNA binding is experimentally established
        (Mbp1 crystal structure and MCB-binding assays; see genes/yeast/MBP1). A2FPI7's
        own family (PTHR48135, a phage/bacterial KilA-N lineage expanded in T. vaginalis)
        contains no experimentally characterised member, and A2FPI7 has no
        pairwise-detectable similarity to the Mbp1 APSES domain (z = 1.25), though it is clearly
        similar to the phage P1 KilA KilA-N region (z = 7.4).
      action: NEW
      reason: >-
        Kept as a proposed, domain-level molecular function. DNA binding is the one property
        attributed to the whole KilA-N/APSES superfamily rather than to a particular
        subfamily, and the A2FPI7 protein is nothing but that domain, so the general term
        is appropriate and nothing more specific (sequence-specific binding, cis-regulatory
        region binding, transcription factor activity) is transferable: those properties
        are established only in the fungal APSES families PTHR43828/PTHR47792, which
        A2FPI7 does not belong to. Confidence is moderate; the inference rests on
        superfamily homology, not on an experimental member of PTHR48135. The previous
        version of this row also cited a machine-learning prediction; that has been
        dropped and is not used as evidence.
      supported_by:
        - reference_id: PMID:11897024
          supporting_text: >-
            the amino-terminal module of the D6R/N1R proteins defines a novel, conserved
            DNA-binding domain (the KilA-N domain) that is found in a wide range of proteins
            of large bacterial and eukaryotic DNA viruses
        - reference_id: PMID:11897024
          supporting_text: >-
            The KilA-N domain is suggested to be homologous to the fungal DNA-binding APSES
            domain.
        - reference_id: file:TRIV3/A2FPI7/A2FPI7-uniprot.txt
          supporting_text: >-
            /note="KilA-N"
        - reference_id: file:TRIV3/A2FPI7/A2FPI7-bioinformatics/RESULTS.md
          supporting_text: >-
            DNA binding is a domain-level (superfamily fold) inference; no member of PTHR48135 has
            experimental evidence of DNA binding or of any other molecular function.
references:
  - id: PMID:17218520
    title: "Draft genome sequence of the sexually transmitted pathogen Trichomonas vaginalis"
    findings:
      - statement: >-
          The T. vaginalis genome (~160 Mb) is dominated by repeats and transposable
          elements, reflecting a recent massive expansion of genetic material; lateral gene
          transfer from bacteria and amplification of specific gene families shaped its gene
          complement. (Corrected 2026-10-21: the abstract names bacteria, not viruses, as
          the lateral-transfer source.)
        supporting_text: >-
          Repeats and transposable elements comprise about
          two-thirds of the approximately 160-megabase genome, reflecting a recent massive
          expansion of genetic material.
    reference_review:
      relevance: LOW
      correctness: VERIFIED
      review_notes: >-
        Genome paper for the source assembly (UniProt RN [2]). Background only; it does not
        discuss KilA-N proteins (abstract-only cache). Used for genome-expansion context.
  - id: PMID:11897024
    title: "Extensive domain shuffling in transcription regulators of DNA viruses and implications for the origin of fungal APSES transcription factors"
    findings:
      - statement: >-
          Defines the KilA-N domain as a conserved DNA-binding domain of large bacterial
          and eukaryotic DNA viruses, proposes homology with the fungal APSES DNA-binding
          domain, and argues for a viral origin of the APSES domain.
        supporting_text: >-
          On the basis of
          phyletic pattern analysis we present evidence for a probable viral origin of the
          fungus-specific cell-cycle regulatory transcription factors containing the APSES
          DNA-binding domain.
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: >-
        Founding computational definition of the KilA-N domain (Iyer, Koonin, Aravind;
        Genome Biol 2002); full text cached. Domain-level evidence, not specific to
        T. vaginalis proteins.
  - id: PMID:31600629
    title: "Evolutionary innovation, fungal cell biology, and the lateral gene transfer of a viral KilA-N domain."
    findings:
      - statement: >-
          Review: the fungal Swi4/Mbp1, APSES, Xbp1 and Bqt4 transcription factors derive
          from lateral transfer of a viral KilA-N DNA-binding domain.
        supporting_text: >-
          This review focuses on a
          family of fungal transcription factors (Swi4/Mbp1, APSES, Xbp1, Bqt4) derived
          from the lateral gene transfer of a KilA-N domain commonly found in prokaryotic
          and eukaryotic DNA viruses.
    reference_review:
      relevance: MEDIUM
      correctness: VERIFIED
      review_notes: >-
        Abstract-only cache. Supports the viral/prokaryotic distribution of KilA-N and its
        characterisation as a DNA-binding domain; the fungal regulatory roles it describes
        are subfamily-specific and are not transferred to A2FPI7.
  - id: file:TRIV3/A2FPI7/A2FPI7-deep-research-falcon.md
    title: "Deep research report on A2FPI7 (Falcon/Edison Scientific Literature)"
    findings:
      - statement: >-
          No primary publication directly characterizing A2FPI7 was found. Domain-based
          inference supports classification as a probable DNA-binding regulatory protein
          based on the KilA-N/APSES_HTH domain architecture.
      - statement: >-
          The KilA-N domain is a conserved DNA-binding domain originally defined in large
          DNA viruses and later recognized in cellular proteins; fungal APSES
          transcription-factor DNA-binding domains are homologous to KilA-N.
    reference_review:
      relevance: LOW
      correctness: LOW_QUALITY
      review_notes: >-
        The report states that no contexts were retrieved and that its answer is not
        grounded in evidence. Its quotable text lives in the artifact files, not in this
        main file (the previous review quoted artifact-00 text while citing this file).
        Kept for provenance; no longer used as direct support. Its suggestion that A2FPI7
