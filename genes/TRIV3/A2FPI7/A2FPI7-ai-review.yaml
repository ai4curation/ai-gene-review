  - id: file:TRIV3/A2FPI7/A2FPI7-uniprot.txt
    title: "UniProt entry for A2FPI7 (KilA-N domain-containing protein)"
    findings:
      - statement: >-
          A2FPI7 is a 129-amino-acid predicted protein containing a single KilA-N domain
          (residues 19-124) identified by PROSITE PS51301. Protein existence is PE4
          (Predicted). The entry merges two identical ORFs (EAX93188.1 TVAG_233530 and
          EAX64854.1 TVAG_559790) and is not flagged as a fragment.
        supporting_text: >-
          PE   4: Predicted;
  - id: file:TRIV3/A2FPI7/A2FPI7-bioinformatics/RESULTS.md
    title: "A2FPI7 KilA-N family context analysis"
    findings:
      - statement: >-
          A2FPI7 is a stand-alone KilA-N module in PANTHER PTHR48135:SF1 (weak match,
          4.5e-05, residues 71-127); PTHR48135 has 1,667 members, 1,308 of them in
          T. vaginalis, the rest bacterial or viral; no characterised APSES protein is in
          this family. A2FPI7 aligns significantly to phage P1 KilA (z 7.4) but not to the
          Mbp1 APSES domain (z 1.25).
        supporting_text: >-
          A2FPI7 is a member of a T. vaginalis-expanded, phage/bacteria-derived KilA-N lineage,
          not an ortholog of any characterised fungal APSES transcription factor.
core_functions:
  - description: >-
      Probable DNA binding through a stand-alone KilA-N domain, inferred at the
      superfamily level (KilA-N/APSES fold). Binding specificity, partners and any
      regulatory role are unknown; no member of the A2FPI7 PANTHER family (PTHR48135) has
      been characterised experimentally, so subfamily-specific APSES functions are not
      transferred.
    molecular_function:
      id: GO:0003677
      label: DNA binding
    supported_by:
      - reference_id: PMID:11897024
        supporting_text: >-
          The KilA-N domain is suggested to be homologous to the fungal DNA-binding APSES
          domain.
      - reference_id: file:TRIV3/A2FPI7/A2FPI7-bioinformatics/RESULTS.md
        supporting_text: >-
          DNA binding is a domain-level (superfamily fold) inference; no member of PTHR48135 has
          experimental evidence of DNA binding or of any other molecular function.
suggested_questions:
  - question: >-
      Is A2FPI7 (TVAG_233530/TVAG_559790) expressed at the protein level in T. vaginalis,
      and where in the cell does it localize?
  - question: >-
      Do the >1,300 PTHR48135 KilA-N proteins of T. vaginalis derive from a single
      lateral transfer from a phage or bacterium followed by expansion, and are they
      associated with transposable elements or viral-like genomic segments?
  - question: >-
      Does the A2FPI7 KilA-N domain bind double-stranded DNA, and if so with any sequence
      preference, given that the only experimentally characterised KilA-N-fold domains are
      the fungal APSES domains in different PANTHER families?
suggested_experiments:
  - hypothesis: >-
      A2FPI7 binds double-stranded DNA via its KilA-N domain.
    description: >-
      Express recombinant A2FPI7 and test DNA binding by EMSA with random and designed
      probes, followed by SELEX or protein-binding microarray if binding is observed;
      mutate the predicted recognition helix as a control.
    experiment_type: EMSA
  - hypothesis: >-
      A2FPI7 localizes to the T. vaginalis nucleus.
    description: >-
      Express epitope-tagged A2FPI7 in T. vaginalis and determine localization by
      immunofluorescence with DAPI co-staining.
    experiment_type: fluorescence microscopy
