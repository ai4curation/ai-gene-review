core_functions:
- description: Damage-inducible DNA-directed DNA polymerase inferred to provide synthesis in the ImuA-ImuB-DnaE2
    mutagenic bypass pathway. Native Caulobacter genetics establishes pathway dependence; conserved family
    features and mycobacterial active-site mutations support the catalytic assignment. Exact lesion specificity,
    fidelity and insertion-versus-extension contributions remain unresolved for this target.
  molecular_function:
    id: GO:0003887
    label: DNA-directed DNA polymerase activity
  directly_involved_in:
  - id: GO:0042276
    label: error-prone translesion synthesis
  supported_by:
  - reference_id: file:CAUVC/dnaE2/dnaE2-uniprot.txt
    record_section:
    - CC:SIMILARITY
    supporting_text: Belongs to the DNA polymerase type-C family. DnaE2
  - reference_id: PMID:15886391
    supporting_text: This novel mutational signature, dependent on the activity of the imuAB/dnaE2 operon,
      probably reflects a difference in polymerase preference for nucleotide incorporation during TLS.
  - reference_id: PMID:20615954
    supporting_text: In combination with the prediction that ImuB lacks polymerase activity, this observation
      implies that DnaE2 catalyzes translesion synthesis.
  knowledge_gaps:
  - gap_statement: Purified Caulobacter DnaE2 activity has not been established in the reviewed literature;
      its lesion repertoire, fidelity, insertion-versus-extension role and any PHP-dependent exonuclease
      activity remain unresolved.
    boundary: The genetic requirement for induced mutagenesis and damage tolerance, and the catalytic-residue
      dependence of that requirement in the mycobacterial ortholog, are established.
    significance: Fidelity and lesion specificity determine which mutations the cassette generates, which
      is what makes it a candidate target for limiting resistance evolution.
    gap_kind:
    - BIOLOGY
    dark_aspect: MF_DARK
