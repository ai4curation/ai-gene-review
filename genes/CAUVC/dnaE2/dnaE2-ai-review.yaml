- term:
    id: GO:0008408
    label: 3'-5' exonuclease activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: The broad DnaE/PolC and alpha-subunit domain mapping overstates evidence for an intrinsic
      nuclease subactivity; target activity remains unresolved.
    action: MARK_AS_OVER_ANNOTATED
    reason: 'The traced IEA derives from InterPro IPR004805 (DnaE2/DnaE/PolC family) and IPR011708 (alpha-subunit
      NTPase domain), whose generic descriptions discuss DNA polymerase III exonuclease activity. PMID:20615954
      demonstrates that nuclease-associated residues differ even between M. tuberculosis DnaE1 and DnaE2,
      so the broad classifications do not warrant automatic propagation of this subactivity to a DnaE2
      member. MARK_AS_OVER_ANNOTATED flags that mapping overreach, not demonstrated loss in this target:
      no target-specific residue comparison or negative nuclease assay is claimed. Its actual exonuclease
      activity remains unresolved. Polymerase activity has separate positive support from specific DnaE2
      assignment, native genetic context and ortholog catalytic-site evidence; an error-prone phenotype
      alone does not exclude proofreading.'
    supported_by:
    - reference_id: PMID:20615954
      supporting_text: The corresponding domain of Mtb DnaE1 retains all amino acids associated with exonuclease
        activity ( 34 – 36 ), whereas key residues are absent in DnaE2.
