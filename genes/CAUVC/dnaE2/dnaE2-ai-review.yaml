suggested_questions:
- question: Which lesions can the C. crescentus ImuA-ImuB-DnaE2 complex bypass in vitro, and does reconstitution
    with the beta clamp reproduce the G:C to C:G transversion signature seen in vivo?
suggested_experiments:
- description: Reconstitute purified DnaE2 with ImuA, ImuB and the beta clamp on primer-templates carrying
    defined UV and mitomycin C lesions, measure bypass efficiency and misinsertion spectra, and compare
    with the rpoB mutational signature of the operon mutants.
