core_functions:
  - description: >-
      Damage-inducible type-C DNA polymerase that performs the
      nucleotide-insertion step of synthesis across UV and mitomycin C lesions,
      recruited through the ImuA and ImuB accessory proteins; the resulting
      synthesis is mutagenic and gives the operon-dependent UV mutational
      signature.
    molecular_function:
      id: GO:0003887
      label: DNA-directed DNA polymerase activity
    directly_involved_in:
      - id: GO:0042276
        label: error-prone translesion synthesis
    supported_by:
      - reference_id: file:CAUVC/dnaE2/dnaE2-uniprot.txt
        record_section: ["CC:SIMILARITY"]
        supporting_text: Belongs to the DNA polymerase type-C family. DnaE2
      - reference_id: PMID:15886391
        supporting_text: >-
          This novel mutational signature, dependent on the activity of the
          imuAB/dnaE2 operon, probably reflects a difference in polymerase
          preference for nucleotide incorporation during TLS.
      - reference_id: PMID:20615954
        supporting_text: >-
          In combination with the prediction that ImuB lacks polymerase
          activity, this observation implies that DnaE2 catalyzes translesion
          synthesis.
    knowledge_gaps:
      - gap_statement: >-
          No DnaE2 protein has been purified and assayed, so the lesion spectrum
          it can bypass, its fidelity, and whether it retains any PHP-domain
          exonuclease activity are unknown.
        boundary: >-
          The genetic requirement for induced mutagenesis and damage tolerance,
          and the catalytic-residue dependence of that requirement in the
          mycobacterial ortholog, are established.
        significance: >-
          Fidelity and lesion specificity determine which mutations the cassette
          generates, which is what makes it a candidate target for limiting
          resistance evolution.
        gap_kind:
          - BIOLOGY
        dark_aspect: MF_DARK
proposed_new_terms: []
suggested_questions:
  - question: >-
      Which lesions can the C. crescentus ImuA-ImuB-DnaE2 complex bypass in
      vitro, and does reconstitution with the beta clamp reproduce the
      G:C to C:G transversion signature seen in vivo?
suggested_experiments:
  - description: >-
      Reconstitute purified DnaE2 with ImuA, ImuB and the beta clamp on
      primer-templates carrying defined UV and mitomycin C lesions, measure
      bypass efficiency and misinsertion spectra, and compare with the rpoB
      mutational signature of the operon mutants.
