id: Q9A3J3
gene_symbol: dnaE2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:190650
  label: Caulobacter vibrioides CB15
description: >-
  DnaE2 (CC_3211) is the DNA polymerase of the SOS-regulated imuA-imuB-dnaE2
  operon of Caulobacter crescentus and a member of the DnaE2 subfamily of
  type-C polymerases, distinct from the essential replicative alpha subunit
  DnaE. Deletion of dnaE2 makes cells extremely sensitive to mitomycin C,
  abolishes mitomycin C-induced mutagenesis and strongly reduces UV-induced
  mutagenesis, with a characteristic change in the UV mutational spectrum
  shared with the imuB mutant; the imuB dnaE2 double mutant is no worse than
  either single mutant. DnaE2 therefore supplies the nucleotide-insertion step
  of error-prone synthesis across lesions, acting with the ImuA and ImuB
  accessory proteins rather than in chromosome replication.
existing_annotations:
  - term:
      id: GO:0003676
      label: nucleic acid binding
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    review:
      summary: Template binding is intrinsic to a DNA polymerase, but the term is very broad.
      action: MODIFY
      reason: >-
        True but less specific than the evidence supports, and not an ancestor of
        the activity asserted as core: GO:0003887 has no is_a path to GO:0003676,
        so this is a refinement rather than a TOO_GENERAL case. The row is mapped
        from a generic nucleic-acid-binding domain signature, but this protein's curated activity is
        DNA-templated synthesis on a DNA primer-template, so DNA binding is the
        supported child term.
      proposed_replacement_terms:
        - id: GO:0003677
          label: DNA binding
      supported_by:
        - reference_id: file:CAUVC/dnaE2/dnaE2-uniprot.txt
          record_section: ["CC:SIMILARITY"]
          supporting_text: Belongs to the DNA polymerase type-C family. DnaE2
  - term:
      id: GO:0003824
      label: catalytic activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    review:
      summary: Catalytic activity is true but uninformative.
      action: TOO_GENERAL
      reason: >-
        True of the protein but uninformative: GO:0003887, accepted in this
        review, is an is_a descendant of catalytic activity and so already
        entails it. The claim is not wrong, which is why this is TOO_GENERAL
        rather than an over-annotation.
      supported_by:
        - reference_id: file:CAUVC/dnaE2/dnaE2-uniprot.txt
          record_section: ["CC:CATALYTIC ACTIVITY"]
          supporting_text: 'Reaction=DNA(n) + a 2''-deoxyribonucleoside 5''-triphosphate = DNA(n+1) +'
  - term:
      id: GO:0003887
      label: DNA-directed DNA polymerase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: enables
    review:
      summary: This is the defining catalytic activity of DnaE2.
      action: ACCEPT
      reason: >-
        UniProt places Q9A3J3 in the DnaE2 subfamily of type-C DNA polymerases
        and records the templated nucleotidyl-transfer reaction; in the
        characterized mycobacterial cassette, substituting the DnaE2 catalytic
        residues reproduces the deletion phenotype, which establishes that the
        DnaE2 alpha subunit, and not ImuB, performs the synthesis. The purified
        C. crescentus enzyme has not been assayed, so the activity rests on the
        family assignment plus the ortholog catalytic-residue result.
      supported_by:
        - reference_id: file:CAUVC/dnaE2/dnaE2-uniprot.txt
          record_section: ["CC:SIMILARITY"]
          supporting_text: Belongs to the DNA polymerase type-C family. DnaE2
        - reference_id: PMID:20615954
          supporting_text: >-
            In contrast, replacement of DnaE2 catalytic residues reproduces the
            dnaE2 gene deletion phenotype, strongly implying a direct role for
            the α-subunit in mutagenic lesion bypass.
  - term:
      id: GO:0005737
      label: cytoplasm
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: located_in
    review:
      summary: Cytoplasmic location is consistent with action on the bacterial chromosome.
      action: KEEP_AS_NON_CORE
      reason: >-
        Correct and as precise as a bacterial cytoplasmic protein can be
        annotated, but it is inherited from the UniRule subcellular-location
        line rather than measured here, and it is not what the gene is for.
      supported_by:
        - reference_id: file:CAUVC/dnaE2/dnaE2-uniprot.txt
          record_section: ["CC:SUBCELLULAR LOCATION"]
          supporting_text: 'CC   -!- SUBCELLULAR LOCATION: Cytoplasm {ECO:0000250}.'
  - term:
      id: GO:0006260
      label: DNA replication
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: involved_in
    review:
      summary: >-
        This term conflates DnaE2 with the essential replicative alpha subunit
        it is paralogous to.
      action: MARK_AS_OVER_ANNOTATED
      reason: >-
        The mapping comes from the shared DNA polymerase III alpha domains
        (IPR004805, IPR011708). DnaE2 is dispensable for growth, induced only on
        damage, and lacks the C-terminal region through which the replicative
        alpha subunit engages the clamp loader, so it cannot substitute for
        replicative synthesis; damage-induced lesion bypass is the real process.
      supported_by:
        - reference_id: PMID:20615954
          supporting_text: >-
            All major DNA polymerase IIIα structural/functional domains ( 23 ,
            24 ) are readily identified in DnaE2, except for the very C-terminal
            region which in E. coli has been implicated in the interaction of α
            with the clamp-loader subunit, τ ( 28 , 29 ).
        - reference_id: PMID:15886391
          supporting_text: >-
            DnaE2 orthologs clearly form a distinct branch, including the DnaE2
            from C.crescentus.
  - term:
      id: GO:0006281
      label: DNA repair
    evidence_type: IEA
    original_reference_id: GO_REF:0000104
    qualifier: involved_in
    review:
      summary: >-
        Broad DNA repair does not capture what the deletion experiments show,
        which is mutagenic bypass rather than lesion removal.
      action: MODIFY
      reason: >-
        The row is a UniRule transfer. The C. crescentus genetics show that
        dnaE2 loss abolishes induced mutagenesis while sensitizing cells to the
        damaging agent, which is damage tolerance with an error-prone outcome;
        error-prone translesion synthesis is the specific supported term and is
        annotated from the primary data in this review.
      proposed_replacement_terms:
        - id: GO:0042276
          label: error-prone translesion synthesis
      supported_by:
        - reference_id: PMID:15886391
          supporting_text: >-
            These results indicate that imuB and dnaE2 cooperate in a lesion
            bypass pathway, which has a different specificity than that
            involving umuDC in E.coli.
  - term:
      id: GO:0006974
      label: DNA damage response
    evidence_type: IEA
    original_reference_id: GO_REF:0000117
    qualifier: involved_in
    review:
      summary: DnaE2 is induced by DNA damage and acts on damaged templates.
      action: TOO_GENERAL
      reason: >-
        True, and the induction is real: the operon is upregulated after UV and
        mitomycin C in a recA-dependent way. But GO:0042276, asserted in this
        review, is an is_a descendant of DNA damage response through
        GO:0019985 and GO:0006301, so this term adds nothing beyond it.
      supported_by:
        - reference_id: PMID:15886391
          supporting_text: >-
            The results shown in Figure 5 demonstrate that imuA, imuB and dnaE2
            expression levels are increased similarly in response to UV damage.
  - term:
      id: GO:0008408
      label: 3'-5' exonuclease activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    review:
      summary: >-
        Proofreading chemistry is mapped from domains shared with the
        replicative polymerase, but DnaE2 proteins have lost the residues that
        carry it.
      action: MARK_AS_OVER_ANNOTATED
      reason: >-
        The term comes from the generic DnaE/PHP domain mappings IPR004805 and
        IPR011708. Published comparison of the PHP domains shows that the
        replicative DnaE1 retains the exonuclease residues whereas they are
        absent in DnaE2, and a proofreading activity would also sit awkwardly
        with the error-prone role established genetically. No exonuclease assay
        exists for any DnaE2, so the activity is not asserted here as absent,
        only as unsupported.
      supported_by:
        - reference_id: PMID:20615954
          supporting_text: >-
            The corresponding domain of Mtb DnaE1 retains all amino acids
            associated with exonuclease activity ( 34 – 36 ), whereas key
            residues are absent in DnaE2.
  - term:
      id: GO:0034061
      label: DNA polymerase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000116
    qualifier: enables
    review:
      summary: The parent polymerase term is valid but redundant with its DNA-directed child.
      action: TOO_GENERAL
      reason: >-
        GO:0003887, accepted here as the core molecular function, is an is_a
        child of DNA polymerase activity and entails it, so the parent term is
        true but carries no additional information.
      supported_by:
        - reference_id: file:CAUVC/dnaE2/dnaE2-uniprot.txt
          record_section: ["CC:CATALYTIC ACTIVITY"]
          supporting_text: 'Xref=Rhea:RHEA:22508, Rhea:RHEA-COMP:17339, Rhea:RHEA-'
  - term:
      id: GO:0071897
      label: DNA biosynthetic process
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: involved_in
    review:
      summary: DNA synthesis does occur, but the parent process lacks the damage-bypass context.
      action: TOO_GENERAL
      reason: >-
        A true is_a ancestor of GO:0042276, which is asserted in this review from
        the primary genetics; error-prone translesion synthesis is substantially
        more informative, so this term adds nothing.
      supported_by:
        - reference_id: file:CAUVC/dnaE2/dnaE2-uniprot.txt
          record_section: ["CC:FUNCTION"]
          supporting_text: 'CC   -!- FUNCTION: DNA polymerase involved in damage-induced mutagenesis and'
  - term:
      id: GO:0042276
      label: error-prone translesion synthesis
    evidence_type: IMP
    original_reference_id: PMID:15886391
    qualifier: involved_in
    review:
      summary: >-
        A dnaE2 disruption abolishes mitomycin C-induced mutagenesis, reduces
        UV-induced mutagenesis and changes the UV mutational spectrum, in the
        same pathway as imuB.
      action: NEW
      reason: >-
        This is the process the primary C. crescentus data establish: the
        mutational-signature change shows that the pathway inserts nucleotides
        opposite lesions, the sensitivity shows tolerance, and the epistasis with
        imuB shows one pathway. DnaE2 supplies the catalytic step, so the
        annotation is direct rather than regulatory.
      supported_by:
        - reference_id: PMID:15886391
          supporting_text: >-
            The results show that the dnaE2 operon is upregulated in response to
            DNA damage in a recA-dependent manner, and demonstrate that all
            three genes that compose this expression unit are involved in UV and
            mitomycin C-induced mutagenesis.
        - reference_id: PMID:15886391
          supporting_text: >-
            This novel mutational signature, dependent on the activity of the
            imuAB/dnaE2 operon, probably reflects a difference in polymerase
            preference for nucleotide incorporation during TLS.
        - reference_id: PMID:20615954
          supporting_text: >-
            In combination with the prediction that ImuB lacks polymerase
            activity, this observation implies that DnaE2 catalyzes translesion
            synthesis.
