      a recA-dependent manner, and demonstrate that all three genes that compose this expression unit
      are involved in UV and mitomycin C-induced mutagenesis.
  - statement: C. crescentus DnaE2 falls in a branch distinct from the replicative DnaE polymerases.
    supporting_text: DnaE2 orthologs clearly form a distinct branch, including the DnaE2 from C.crescentus.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached; the primary source for every physiological claim in this review. Experiments
      are in NA1000, a derivative of the sequenced CB15 strain this entry represents.
- id: PMID:20615954
  title: Essential roles for imuA'- and imuB-encoded accessory factors in DnaE2-dependent mutagenesis
    in Mycobacterium tuberculosis.
  findings:
  - statement: In mycobacteria, DnaE2 active-site substitution reproduces the deletion phenotype, supporting
      a catalytic role in mutagenic bypass.
    supporting_text: Point mutations in the DnaE2 active site eliminated induced mutagenesis and damage
      tolerance, reproducing the dnaE2 deletion phenotype.
  - statement: The reported mycobacterial DnaE2 comparison lacks PHP-domain residues retained in DnaE1;
      this does not establish the corresponding residue configuration in Caulobacter.
    supporting_text: The corresponding domain of Mtb DnaE1 retains all amino acids associated with exonuclease
      activity ( 34 – 36 ), whereas key residues are absent in DnaE2.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full cached primary read. Catalytic-mutant and PHP-domain findings concern mycobacteria.
      They inform the conserved polymerase assignment and target experiments, but do not establish Caulobacter
      proofreading loss or a target biochemical assay.
