gene_symbol: dnaE2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:190650
  label: Caulobacter vibrioides CB15
description: DnaE2 (CC_3211) is the type-C DNA polymerase of the SOS-regulated imuA-imuB-dnaE2 operon
  in Caulobacter vibrioides, historically called C. crescentus. It is distinct from the essential replicative
  DnaE paralog. In the CB15-derived NA1000 strain, dnaE2 disruption strongly increases mitomycin C sensitivity
  and reduces damage-induced mutagenesis, with a UV mutation-spectrum change shared with imuB. Conserved
  DnaE2 family features and catalytic-mutant studies in mycobacteria support a polymerase role in mutagenic
  lesion bypass, while its target-specific lesion repertoire, fidelity and proofreading capacity remain
  unresolved.
