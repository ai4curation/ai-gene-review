- term:
    id: GO:0042276
    label: error-prone translesion synthesis
  evidence_type: IMP
  original_reference_id: PMID:15886391
  qualifier: involved_in
  review:
    summary: A dnaE2 disruption abolishes mitomycin C-induced mutagenesis, reduces UV-induced mutagenesis
      and changes the UV mutational spectrum, in the same pathway as imuB.
    action: NEW
    reason: Retain the historical IMP proposal. Native disruption, damage sensitivity, altered rpoB mutation
      spectra and epistasis with imuB support a DnaE2-dependent mutagenic bypass pathway in NA1000, a
      CB15 derivative. These assays do not directly observe incorporation opposite a defined lesion. The
      polymerase assignment is additionally grounded in the specific DnaE2 family and catalytic-mutant
      evidence from mycobacteria; the target lesion repertoire and insertion-versus-extension contributions
      remain unmeasured.
    supported_by:
    - reference_id: PMID:15886391
      supporting_text: The results show that the dnaE2 operon is upregulated in response to DNA damage
        in a recA-dependent manner, and demonstrate that all three genes that compose this expression
        unit are involved in UV and mitomycin C-induced mutagenesis.
    - reference_id: PMID:15886391
      supporting_text: This novel mutational signature, dependent on the activity of the imuAB/dnaE2 operon,
        probably reflects a difference in polymerase preference for nucleotide incorporation during TLS.
    - reference_id: PMID:20615954
      supporting_text: In combination with the prediction that ImuB lacks polymerase activity, this observation
        implies that DnaE2 catalyzes translesion synthesis.
