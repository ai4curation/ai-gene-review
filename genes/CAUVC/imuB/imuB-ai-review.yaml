suggested_questions:
- question: Does C. crescentus ImuB bind DnaN through a clamp-binding motif, and is that interaction required
    for mitomycin C tolerance as it is in M. tuberculosis?
suggested_experiments:
- description: Test pairwise interactions of ImuB with ImuA, DnaE2 and DnaN, then complement the imuB
    deletion with clamp-binding-motif and putative active-site alleles and score mitomycin C survival
    and induced mutation frequency.
