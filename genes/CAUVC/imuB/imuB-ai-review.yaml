id: Q9A3J2
gene_symbol: imuB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:190650
  label: Caulobacter vibrioides CB15
description: ImuB (CC_3212) is an accessory protein of the SOS-regulated imuA-imuB-dnaE2 operon in Caulobacter
  vibrioides, historically called C. crescentus. It belongs to the ImuB branch of the UmuC/Y-family polymerase
  fold and is predicted to serve a nonpolymerase interaction role. In the CB15-derived NA1000 strain,
  imuB loss impairs UV- and mitomycin C-induced mutagenesis and damage tolerance, with a UV mutation spectrum
  and epistasis pattern shared with dnaE2. A macromolecular adaptor role is inferred from this genetic
  context and biochemical studies of ImuB in other bacteria; the direct Caulobacter interaction network
  has not been measured.
existing_annotations:
- term:
    id: GO:0006281
    label: DNA repair
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: The broad damage-processing annotation can be specified as mutagenic lesion bypass.
    action: MODIFY
    reason: 'The source IEA maps ImuB-related sequence features to DNA repair. The current GO:0006281
      definition includes bypass among damage-processing pathways, so the annotation is not rejected simply
      because lesions remain. Caulobacter genetics supports the more informative GO:0042276 error-prone
      translesion synthesis. This is a process-specific correction: current GO places TLS under DNA damage
      tolerance, and it is not an is_a descendant of DNA repair. The inference does not assign catalytic
      lesion removal or DNA polymerase activity to ImuB.'
    proposed_replacement_terms:
    - id: GO:0042276
      label: error-prone translesion synthesis
    supported_by:
    - reference_id: PMID:15886391
      supporting_text: These results indicate that imuB and dnaE2 cooperate in a lesion bypass pathway,
        which has a different specificity than that involving umuDC in E.coli.
- term:
    id: GO:0042276
    label: error-prone translesion synthesis
  evidence_type: IMP
  original_reference_id: PMID:15886391
  qualifier: involved_in
  review:
    summary: An imuB deletion is extremely sensitive to mitomycin C, loses most UV-induced mutagenesis,
      and shifts the surviving UV mutational spectrum exactly as a dnaE2 deletion does.
    action: NEW
    reason: Retain the historical proposal on the combination of native deletion, complementation, epistasis
      with dnaE2 and altered rpoB mutational spectra. These establish participation in mutagenic damage
      tolerance and support the lesion-bypass interpretation. The spectra do not directly measure nucleotide
      insertion opposite a defined lesion, identify which subunit inserts it, or prove physical assembly
      of the proteins. The direct genetic experiments used NA1000, a CB15 derivative.
    supported_by:
    - reference_id: PMID:15886391
      supporting_text: The imuB dnaE2 double mutant does not exhibit an exacerbated phenotype, indicating
        again that these genes cooperate in the same pathway of damage tolerance.
    - reference_id: PMID:15886391
      supporting_text: The mutation signature of UV light is remarkably similar in dnaE2 and imuB strains.
    - reference_id: PMID:15886391
      supporting_text: This novel mutational signature, dependent on the activity of the imuAB/dnaE2 operon,
        probably reflects a difference in polymerase preference for nucleotide incorporation during TLS.
- term:
    id: GO:0030674
    label: protein-macromolecule adaptor activity
  evidence_type: ISS
  original_reference_id: PMID:20615954
  qualifier: enables
  review:
    summary: A macromolecular adaptor role is inferred for Caulobacter ImuB from its specific family placement,
      native genetics and characterized ImuB homologs.
    action: NEW
    reason: The historical ISS proposal is retained as a mechanistic inference, not a target binding assay.
      PMID:15886391 places CC3212 in the ImuB branch distinct from ordinary DinB proteins and shows its
      interdependent genetic role with DnaE2. Mycobacterial ImuB binds cassette partners and the clamp,
      while PMID:38591662 independently demonstrates direct Myxococcus ImuA-ImuB binding. These observations
      support an accessory interaction role beyond generic UmuC-fold similarity. Exact partner affinities,
      clamp recognition, oligomeric state and catalytic-residue configuration have not been mapped in
      Caulobacter, and are not asserted from the Pfam label or family membership alone.
    supported_by:
    - reference_id: PMID:20615954
      supporting_text: Yeast two-hybrid analyses indicate that ImuB interacts with both ImuA' and DnaE2,
        as well as with the beta-clamp.
    - reference_id: PMID:20615954
      supporting_text: Despite retaining structural features characteristic of Y-family members, ImuB
        homologs lack conserved active-site amino acids required for polymerase activity.
    - reference_id: file:CAUVC/imuB/imuB-uniprot.txt
      record_section:
      - DR:Pfam
      supporting_text: DR   Pfam; PF00817; IMS; 1.
    - reference_id: PMID:15886391
      supporting_text: The product of CC3212 and its orthologs form a branch that is distinct from the
        DinB proteins of the same organisms, indicating that this is a divergent DinB/UmuC homolog
    - reference_id: PMID:38591662
      supporting_text: In the absence of DNA, ImuA directly binds ImuB with moderate affinity.
    - reference_id: PMID:38591662
      supporting_text: Here we carry out biochemical characterization of ImuA and a truncation of ImuB
        from Myxococcus xanthus.
