core_functions:
  - description: >-
      Polymerase-inactive UmuC-fold adaptor that couples ImuA and the DnaE2
      polymerase to the replication clamp, allowing error-prone synthesis across
      UV and mitomycin C lesions.
    molecular_function:
      id: GO:0030674
      label: protein-macromolecule adaptor activity
    directly_involved_in:
      - id: GO:0042276
        label: error-prone translesion synthesis
    supported_by:
      - reference_id: PMID:20615954
        supporting_text: >-
          Yeast two-hybrid analyses indicate that ImuB interacts with both ImuA'
          and DnaE2, as well as with the beta-clamp.
      - reference_id: PMID:15886391
        supporting_text: >-
          These results indicate that imuB and dnaE2 cooperate in a lesion
          bypass pathway, which has a different specificity than that involving
          umuDC in E.coli.
    knowledge_gaps:
      - gap_statement: >-
          Whether C. crescentus ImuB itself binds ImuA, DnaE2 and the beta clamp,
          and through which surfaces, has not been tested in this organism.
        boundary: >-
          The genetic requirement in UV and mitomycin C tolerance and induced
          mutagenesis, and the loss of catalytic residues in ImuB proteins, are
          established.
        significance: >-
          The adaptor role is currently inherited from the mycobacterial
          cassette; confirming it here would establish that the architecture is
          conserved across phyla rather than lineage-specific.
        gap_kind:
          - BIOLOGY
        dark_aspect: MF_DARK
proposed_new_terms: []
suggested_questions:
  - question: >-
      Does C. crescentus ImuB bind DnaN through a clamp-binding motif, and is
      that interaction required for mitomycin C tolerance as it is in
      M. tuberculosis?
suggested_experiments:
  - description: >-
      Test pairwise interactions of ImuB with ImuA, DnaE2 and DnaN, then
      complement the imuB deletion with clamp-binding-motif and putative
      active-site alleles and score mitomycin C survival and induced mutation
      frequency.
