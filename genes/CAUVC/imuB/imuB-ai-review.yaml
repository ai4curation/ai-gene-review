    findings:
      - statement: >-
          imuB and dnaE2 act in the same damage-tolerance pathway; the double
          mutant is not more sensitive than either single mutant.
        supporting_text: >-
          The imuB dnaE2 double mutant does not exhibit an exacerbated
          phenotype, indicating again that these genes cooperate in the same
          pathway of damage tolerance.
      - statement: >-
          UV mutational spectra are changed identically in imuB and dnaE2
          mutants, indicating a shared nucleotide-insertion step.
        supporting_text: The mutation signature of UV light is remarkably similar in dnaE2 and imuB strains.
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: >-
        Full text cached; deletion, epistasis and rpoB mutational-spectrum data
