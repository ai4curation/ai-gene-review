id: Q9A3J2
gene_symbol: imuB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:190650
  label: Caulobacter vibrioides CB15
description: >-
  ImuB (CC_3212) is the middle gene of the SOS-regulated imuA-imuB-dnaE2 operon
  of Caulobacter crescentus. It carries a UmuC/Y-family polymerase fold but,
  like other ImuB proteins, lacks the active-site carboxylates needed for
  catalysis, and in the characterized mycobacterial cassette it works as a
  polymerase-inactive adaptor that binds ImuA, DnaE2 and the beta clamp.
  Deletion of C. crescentus imuB sensitizes cells to UV and mitomycin C and
  changes the UV mutational spectrum in the same way as deletion of dnaE2,
  without additivity in the double mutant, so ImuB and DnaE2 act in one
  lesion-bypass pathway distinct from the E. coli umuDC system.
existing_annotations:
  - term:
      id: GO:0006281
      label: DNA repair
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: involved_in
    review:
      summary: >-
        Correct in direction but far broader than the evidence: ImuB does not
        repair lesions, it supports synthesis past them.
      action: MODIFY
      reason: >-
        The row is a UniProt combined-pipeline IEA whose stated basis is the
        UmuC domain IPR001126 plus the TreeGrafter node PANTHER:PTN000118183,
        neither of which resolves beyond generic DNA repair; it is not a PAINT
        IBA. The C. crescentus deletion experiments show lesion tolerance with
        induced mutagenesis, not lesion removal, so error-prone translesion
        synthesis is the term the evidence supports; it sits under DNA damage
        tolerance rather than under DNA repair.
      proposed_replacement_terms:
        - id: GO:0042276
          label: error-prone translesion synthesis
      supported_by:
        - reference_id: PMID:15886391
          supporting_text: >-
            These results indicate that imuB and dnaE2 cooperate in a lesion
            bypass pathway, which has a different specificity than that
            involving umuDC in E.coli.
  - term:
      id: GO:0042276
      label: error-prone translesion synthesis
    evidence_type: IMP
    original_reference_id: PMID:15886391
    qualifier: involved_in
    review:
      summary: >-
        An imuB deletion is extremely sensitive to mitomycin C, loses most
        UV-induced mutagenesis, and shifts the surviving UV mutational spectrum
        exactly as a dnaE2 deletion does.
      action: NEW
      reason: >-
        Deletion, epistasis with dnaE2 and the shared change in mutational
        signature establish participation in damage-tolerant synthesis whose
        output is induced mutation. The mutational-spectrum result is direct
        evidence that the pathway inserts nucleotides opposite lesions rather
        than removing them.
      supported_by:
        - reference_id: PMID:15886391
          supporting_text: >-
            The imuB dnaE2 double mutant does not exhibit an exacerbated
            phenotype, indicating again that these genes cooperate in the same
            pathway of damage tolerance.
        - reference_id: PMID:15886391
          supporting_text: The mutation signature of UV light is remarkably similar in dnaE2 and imuB strains.
        - reference_id: PMID:15886391
          supporting_text: >-
            This novel mutational signature, dependent on the activity of the
            imuAB/dnaE2 operon, probably reflects a difference in polymerase
            preference for nucleotide incorporation during TLS.
  - term:
      id: GO:0030674
      label: protein-macromolecule adaptor activity
    evidence_type: ISS
    original_reference_id: PMID:20615954
    qualifier: enables
    review:
      summary: >-
        ImuB is a noncatalytic interaction hub: the characterized mycobacterial
        ortholog binds ImuA, DnaE2 and the beta clamp, and losing the clamp
        interaction alone destroys cassette function.
      action: NEW
      reason: >-
        The adaptor activity is transferred from the mycobacterial ortholog,
        where it rests on two-hybrid interactions plus a separation-of-function
        clamp-binding allele, and the same paper states that ImuB homologs
        generally lack the catalytic residues, so the fold cannot be read as
        polymerase activity. C. crescentus ImuB keeps the UmuC fold and the
        genetic requirement, so the role transfers, but the interactions have
        not been tested in this organism.
      supported_by:
        - reference_id: PMID:20615954
          supporting_text: >-
            Yeast two-hybrid analyses indicate that ImuB interacts with both
            ImuA' and DnaE2, as well as with the beta-clamp.
        - reference_id: PMID:20615954
          supporting_text: >-
            Despite retaining structural features characteristic of Y-family
            members, ImuB homologs lack conserved active-site amino acids
            required for polymerase activity.
        - reference_id: file:CAUVC/imuB/imuB-uniprot.txt
          record_section: ["DR:Pfam"]
          supporting_text: 'DR   Pfam; PF00817; IMS; 1.'
