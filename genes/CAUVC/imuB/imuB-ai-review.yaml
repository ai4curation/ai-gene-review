  findings:
  - statement: Q9A3J2 carries the UmuC domain and the Pfam IMS signature and is recorded as required,
      with DnaE2 and ImuA, for error-prone processing of DNA lesions.
    record_section:
    - DR:Pfam
    supporting_text: DR   Pfam; PF00817; IMS; 1.
- id: PMID:15886391
  title: An SOS-regulated operon involved in damage-inducible mutagenesis in Caulobacter crescentus.
  findings:
  - statement: imuB and dnaE2 act in the same damage-tolerance pathway; the double mutant is not more
      sensitive than either single mutant.
    supporting_text: The imuB dnaE2 double mutant does not exhibit an exacerbated phenotype, indicating
      again that these genes cooperate in the same pathway of damage tolerance.
  - statement: The similar UV mutation spectra of imuB and dnaE2 mutants support a shared mutagenic pathway;
      they are not a direct assay of the nucleotide-insertion step.
    supporting_text: The mutation signature of UV light is remarkably similar in dnaE2 and imuB strains.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached; deletion, epistasis and rpoB mutational-spectrum data for C. crescentus
      NA1000, a derivative of the CB15 strain this entry represents.
- id: PMID:20615954
  title: Essential roles for imuA'- and imuB-encoded accessory factors in DnaE2-dependent mutagenesis
    in Mycobacterium tuberculosis.
  findings:
  - statement: ImuB binds ImuA', DnaE2 and the beta clamp, and ImuB homologs lack the active-site residues
      required for polymerase activity.
    supporting_text: Yeast two-hybrid analyses indicate that ImuB interacts with both ImuA' and DnaE2,
      as well as with the beta-clamp.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached. Used here as an ortholog source for the adaptor role only; the C.
      crescentus requirement itself comes from PMID:15886391.
- id: PMID:38591662
  title: Myxococcus xanthus translesion DNA synthesis protein ImuA is an ATPase enhanced by DNA.
  findings:
  - statement: Purified Myxococcus ImuA has DNA-stimulated ATPase activity and directly binds ImuB; these
      are comparator results, not measurements on Caulobacter.
    supporting_text: Here we carry out biochemical characterization of ImuA and a truncation of ImuB from
      Myxococcus xanthus.
  - statement: The Myxococcus result supplies a specific experimental hypothesis for Caulobacter without
      proving activity conservation.
    supporting_text: In the absence of DNA, ImuA directly binds ImuB with moderate affinity.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full cached primary inspected. Myxococcus proteins, including an N-terminal ImuB truncation,
      were assayed; no target ATPase, DNA-binding or oligomeric-state annotation is added to Caulobacter.
core_functions:
- description: Inferred macromolecular adaptor supporting DnaE2-dependent mutagenic lesion bypass. Caulobacter
    genetics establishes pathway participation; direct binding of its ImuB to ImuA, DnaE2 and the clamp
    remains to be tested, and no target complex stoichiometry is assigned.
  molecular_function:
    id: GO:0030674
    label: protein-macromolecule adaptor activity
  directly_involved_in:
  - id: GO:0042276
    label: error-prone translesion synthesis
  supported_by:
  - reference_id: PMID:20615954
    supporting_text: Yeast two-hybrid analyses indicate that ImuB interacts with both ImuA' and DnaE2,
      as well as with the beta-clamp.
  - reference_id: PMID:15886391
    supporting_text: These results indicate that imuB and dnaE2 cooperate in a lesion bypass pathway,
      which has a different specificity than that involving umuDC in E.coli.
  knowledge_gaps:
  - gap_statement: Whether C. crescentus ImuB itself binds ImuA, DnaE2 and the beta clamp, and through
      which surfaces, has not been tested in this organism.
    boundary: Native Caulobacter deletion, complementation, epistasis and mutational spectra establish
      damage-tolerance participation. The specific ImuB family branch and homolog interaction experiments
      support an adaptor inference; target interaction surfaces and absence of polymerase chemistry have
      not been independently assayed.
    significance: The adaptor role is currently inherited from the mycobacterial cassette; confirming
      it here would establish that the architecture is conserved across phyla rather than lineage-specific.
    gap_kind:
    - BIOLOGY
    dark_aspect: MF_DARK
