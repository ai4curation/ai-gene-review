id: Q9A3J1
gene_symbol: imuA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:190650
  label: Caulobacter vibrioides CB15
description: >-
  ImuA (CC_3213) is the first gene of the SOS-regulated imuA-imuB-dnaE2 operon
  of Caulobacter crescentus. Deletion of imuA makes cells extremely sensitive
  to mitomycin C and strongly reduces UV- and mitomycin C-induced mutagenesis,
  the same phenotype as deletion of imuB or dnaE2, placing all three products
  in one damage-tolerance pathway that performs error-prone synthesis across
  DNA lesions. ImuA has a RecA-like P-loop fold but no demonstrated catalytic
  or DNA-binding activity of its own; it is an accessory component rather than
  the polymerase of the cassette.
existing_annotations:
  - term:
      id: GO:0009432
      label: SOS response
    evidence_type: EXP
    original_reference_id: PMID:18083815
    qualifier: involved_in
    review:
      summary: >-
        The imuA promoter is one of the experimentally confirmed LexA-dependent
        promoters of the C. crescentus SOS regulon.
      action: KEEP_AS_NON_CORE
      reason: >-
        Correct, and the induction gate is real, but SOS regulon membership is
        the regulatory context rather than what the protein does; error-prone
        translesion synthesis is the effector process and is annotated
        separately in this review.
      supported_by:
        - reference_id: PMID:18083815
          supporting_text: 37 genes regulated in a LexA-dependent manner
        - reference_id: PMID:18083815
          supporting_text: which was confirmed by site-directed mutagenesis studies of the imuA promoter
  - term:
      id: GO:0042276
      label: error-prone translesion synthesis
    evidence_type: IMP
    original_reference_id: PMID:15886391
    qualifier: involved_in
    review:
      summary: >-
        An in-frame imuA deletion abolishes mitomycin C-induced mutagenesis and
        strongly reduces UV-induced mutagenesis while sensitizing cells to both
        agents, and the phenotype is complemented by the wild-type allele.
      action: NEW
      reason: >-
        The deletion genetics establish participation in damage tolerance whose
        output is induced mutation, which is what error-prone translesion
        synthesis describes; single imuA, imuB and dnaE2 mutants share the
        phenotype and imuB dnaE2 double mutants are not additive, so the three
        products act in one lesion-bypass pathway. The experiments were done in
        NA1000, a derivative of the sequenced CB15 strain this entry
        represents, which is also how GOA assigns PMID:18083815 to this
        accession.
      supported_by:
        - reference_id: PMID:15886391
          supporting_text: >-
            The genes imuA and imuB encode previously uncharacterized proteins,
            which are shown here for the first time to be involved in DNA
            damage tolerance.
        - reference_id: PMID:15886391
          supporting_text: >-
            The single mutants imuA, imuB and dnaE2 mutants are extremely
            sensitive to this condition, revealing that this operon plays a
            major role in the tolerance to the mit C-induced DNA lesions.
        - reference_id: PMID:15886391
          supporting_text: >-
            Both the UV and the mit C sensitivity phenotypes of imuA could be
            complemented by vector pMR3213, containing the wild-type imuA
            allele.
