suggested_questions:
- question: Does Caulobacter ImuA share the DNA-stimulated ATPase and direct ImuB-binding activities measured
    for Myxococcus ImuA, and which activity is required for native mutagenic damage tolerance?
suggested_experiments:
- description: Purify ImuA and test ImuB binding, ssDNA binding and nucleotide hydrolysis, then test separation-of-function
    alleles for mitomycin C survival and induced mutagenesis in the imuA deletion background.
