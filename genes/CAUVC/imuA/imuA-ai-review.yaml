  - id: PMID:15886391
    title: An SOS-regulated operon involved in damage-inducible mutagenesis in Caulobacter crescentus.
    findings:
      - statement: >-
          imuA, imuB and dnaE2 are co-expressed from a LexA-regulated operon and
          all three are required for UV- and mitomycin C-induced mutagenesis.
        supporting_text: >-
          The results show that the dnaE2 operon is upregulated in response to
          DNA damage in a recA-dependent manner, and demonstrate that all three
          genes that compose this expression unit are involved in UV and
          mitomycin C-induced mutagenesis.
      - statement: An imuA deletion is extremely sensitive to mitomycin C.
        supporting_text: >-
          The single mutants imuA, imuB and dnaE2 mutants are extremely
          sensitive to this condition, revealing that this operon plays a major
          role in the tolerance to the mit C-induced DNA lesions.
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: >-
        Full text cached; the deletion, complementation, expression and
        mutational-spectrum experiments are all on C. crescentus NA1000.
