core_functions:
  - description: >-
      Accessory component of the ImuA-ImuB-DnaE2 cassette, required for
      damage-tolerant synthesis across UV and mitomycin C lesions and for the
      induced mutations that result from it.
    directly_involved_in:
      - id: GO:0042276
        label: error-prone translesion synthesis
    supported_by:
      - reference_id: PMID:15886391
        supporting_text: >-
          The genes imuA and imuB encode previously uncharacterized proteins,
          which are shown here for the first time to be involved in DNA damage
          tolerance.
      - reference_id: PMID:15886391
        supporting_text: >-
          Altogether, the results shown in Figure 6 demonstrate that the imuAB
          dnaE2 operon is involved in mutagenic repair of UV lesions, and
          suggest that the proteins encoded by this operon cooperate in the
          same pathway, as evidenced by the similar phenotypes of the single
          mutants, and by the epistatic effect of imuB and dnaE2 mutations.
    knowledge_gaps:
      - gap_statement: >-
          No molecular activity has been demonstrated for ImuA: whether it binds
          DNA, binds ImuB directly, or has a nucleotide-dependent activity is
          unknown.
        boundary: >-
          The requirement for ImuA in mitomycin C and UV damage tolerance and in
          induced mutagenesis is established by deletion and complementation.
        significance: >-
          Without an activity the cassette cannot be assigned a molecular
          function term for this subunit, and the step ImuA contributes to the
          bypass reaction remains undefined.
        gap_kind:
          - BIOLOGY
        dark_aspect: MF_DARK
proposed_new_terms: []
suggested_questions:
  - question: >-
      Does C. crescentus ImuA bind ImuB directly, as the mycobacterial ImuA'
      does, and does it bind DNA or nucleotides through its P-loop fold?
suggested_experiments:
  - description: >-
      Purify ImuA and test ImuB binding, ssDNA binding and nucleotide
      hydrolysis, then test separation-of-function alleles for mitomycin C
      survival and induced mutagenesis in the imuA deletion background.
