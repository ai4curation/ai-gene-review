      are comparator results, not measurements on Caulobacter.
    supporting_text: Here we carry out biochemical characterization of ImuA and a truncation of ImuB from
      Myxococcus xanthus.
  - statement: The Myxococcus result supplies a specific experimental hypothesis for Caulobacter without
      proving activity conservation.
    supporting_text: We find that ImuA is an ATPase, with ATPase activity enhanced in the presence of
      DNA.
