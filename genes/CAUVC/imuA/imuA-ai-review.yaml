  label: Caulobacter vibrioides CB15
description: ImuA (CC_3213) is an accessory protein encoded by the SOS-regulated imuA-imuB-dnaE2 operon
  of Caulobacter vibrioides, historically called C. crescentus. In the CB15-derived NA1000 strain, imuA
  deletion strongly sensitizes cells to mitomycin C and reduces damage-induced mutagenesis, placing it
  in the DnaE2-dependent damage-tolerance pathway. ImuA has a RecA-like P-loop fold, but its molecular
  activity and direct interaction partners have not been established in Caulobacter. ATPase and DNA-binding
  activities measured for Myxococcus ImuA are mechanistic leads rather than demonstrated properties of
  this protein.
