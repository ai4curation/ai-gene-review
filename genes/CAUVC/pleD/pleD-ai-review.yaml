  review:
    summary: PleD promotes adhesive development through c-di-GMP synthesis.
    action: MODIFY
    reason: PleD is a signaling cyclase regulating holdfast biogenesis and surface attachment, rather
      than the adhesive material itself. CB15 complementation experiments support positive regulation
      of single-species biofilm formation, which captures its regulatory contribution more accurately
      than execution of cell adhesion.
    supported_by:
    - reference_id: PMID:18455986
      supporting_text: Complementation with pleC wild-type fully restored surface attachment of the ΔpleC
        , but not of the ΔpleC ΔpleD double mutant.
