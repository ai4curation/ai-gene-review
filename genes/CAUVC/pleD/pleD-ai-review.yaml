  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN002895444
  review:
    summary: PleD signaling suppresses motility during polar differentiation.
    action: ACCEPT
    reason: Loss of PleD produces hypermotility and defective flagellar ejection, whereas activation promotes
      the swarmer-to-stalked transition. This is a regulatory role of its c-di-GMP output, not a structural
      flagellar component.
    supported_by:
    - reference_id: PMID:15075296
      supporting_text: Cells that lack a functional PleD protein are hypermotile, are unable to eject
        the flagellum, and fail to synthesize a complete stalk structure
    - *id002
