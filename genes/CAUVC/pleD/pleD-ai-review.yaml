gene_symbol: pleD
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:190650
  label: Caulobacter vibrioides CB15
description: PleD is a phosphorylation-controlled diguanylate cyclase that coordinates the swarmer-to-stalked
  transition in Caulobacter. Its receiver domains accept input from the DivJ/PleC phosphorelay and promote
  dimerization of the GGDEF catalytic domains, which synthesize c-di-GMP from GTP. The soluble protein
  becomes enriched at the differentiating pole, where its output promotes adhesive development and suppresses
  motility. Allosteric c-di-GMP binding provides product feedback.
