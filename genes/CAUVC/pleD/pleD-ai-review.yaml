  original_reference_id: PMID:17697997
  review:
    summary: PleD binds c-di-GMP at an allosteric feedback site.
    action: NEW
    reason: The structure directly demonstrates a noncatalytic c-di-GMP binding site rather than substrate
      binding during synthesis. This activity is absent from the seeded annotations and their replacements.
