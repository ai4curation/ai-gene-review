    summary: Lipoprotein carrier activity supported by LolA-family assignment and construct-bounded functional
      evidence.
    action: NEW
    reason: The native CB15 sequence has LolA domains and limited heterologous carrier complementation.
      Strong complementation requires an E. coli-compatible C terminus. This is an inference to native
      carrier activity, not an IDA claim for the unmodified protein; the ProtNLM name is not used as evidence.
    supported_by:
