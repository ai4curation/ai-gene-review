taxon:
  id: NCBITaxon:190650
  label: Caulobacter vibrioides CB15
description: CC_3705 encodes the LolA-family periplasmic lipoprotein carrier of Caulobacter vibrioides
  CB15. Its fold and heterologous complementation support carriage of mature lipoproteins toward the outer
  membrane. A CB15-derived protein with an E. coli-compatible C terminus also substitutes for LolB in
  a permissive E. coli host, and separation-of-function experiments implicate the retained Caulobacter
  loop in insertion. These results support an inferred bifunctional carrier/insertion role for native
  CC_3705; they do not directly measure lipoprotein delivery or insertion by unmodified CC_3705 in Caulobacter.
