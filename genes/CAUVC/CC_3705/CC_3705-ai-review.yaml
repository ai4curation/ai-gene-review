references:
- id: PMID:36716372
  title: Teasing apart the evolution of lipoprotein trafficking in gram-negative bacteria reveals a bifunctional
    LolA.
  findings:
  - statement: The source is the exact CB15 locus, and the main complementation protein has an engineered
      C terminus.
    supporting_text: cviLolA (CC_3705) from C. vibrioides strain CB15
  - statement: The main experimental construct differs from the native sequence.
    supporting_text: we replaced the final 12 residues of cviLolA with those of ecoLolA
  - statement: Carrier and insertion properties can be separated in the CB15-derived construct.
    supporting_text: This result confirmed that the chaperone activity of cviLolAeco is distinct from
      its OM lipoprotein insertion function and that the latter depends on an intact loop leucine.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full Results, Discussion and Methods read. The robust complementation uses cviLolAeco
      in an E. coli lpp-deletion background. Unmodified native protein is a poor heterologous complement.
      Loop-dependent insertion is established for the construct; native Caulobacter function is inferred.
      The in vitro failure discussed for ecoLolAloop concerns an engineered E. coli chimera, not purified
      native CC_3705. Later discovery of distant Bacteroidota LolB limits the paper's broad absence generalization.
