knowledge_gaps:
- gap_statement: The native client range, delivery efficiency and membrane selectivity of unmodified CC_3705
    in Caulobacter have not been established by the heterologous construct experiments.
  boundary: CB15 identity, LolA architecture and construct-bounded carrier/insertion complementation are
    established; the modified C terminus improves compatibility with E. coli machinery.
  gap_kind:
  - BIOLOGY
  status: OPEN
