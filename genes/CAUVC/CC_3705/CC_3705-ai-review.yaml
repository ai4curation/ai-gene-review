    supporting_text: Lipoprotein trafficking is poorly characterized in C. vibrioides.
proposed_new_terms:
- proposed_name: outer-membrane lipoprotein insertion activity
  proposed_definition: Directly binding a mature lipoprotein and promoting incorporation of its lipid
    anchor into the bacterial outer membrane.
  justification: GO:0140318 provides the protein-binding and delivery genus. GO:0140598 requires movement
    with cargo between locations, whereas GO:0140306 specifies release from the inner membrane; neither
    describes terminal lipid-anchor insertion. GO:0032977 membrane insertase activity requires a transmembrane-domain-containing
    protein client, unlike the lipid-anchored lipoprotein substrate here. The proposed definition does
    not require a separate soluble donor because a bifunctional carrier can also perform the terminal
    step. Gene-specific support and assay limitations remain in the core function and supporting evidence.
  supported_by:
  - reference_id: PMID:36716372
    supporting_text: The C-terminal modification of cviLolAeco was important since native cviLolA was
      very poor at complementing deletion of lolA in E. coli
  - reference_id: PMID:36716372
    supporting_text: This result confirmed that the chaperone activity of cviLolAeco is distinct from
      its OM lipoprotein insertion function and that the latter depends on an intact loop leucine.
