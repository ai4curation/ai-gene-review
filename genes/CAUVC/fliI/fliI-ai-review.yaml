suggested_questions:
- question: >-
    The GO:0046933 and GO:0045259 IBDs sit on PTN008558586, a duplication node
    whose children are the F1-beta clade (PTN008558588) and the FliI/SctN export
    ATPase clade (PTN000390097), which contains the TreeGrafter graft node
    PTN000390110 used for P0CAT8. Should the IBDs move down to PTN008558588, or
    should an IRD/NOT be placed at PTN000390097, so that ATP synthase terms stop
    propagating to type III export ATPases?
- question: >-
    Should UniProt rename P0CAT8 from "Flagellum-specific ATP synthase" (EC
    7.1.2.2, H+-transporting) to "Flagellum-specific ATPase / flagellar export
    ATPase FliI" with EC 7.4.2.8? Should it also drop the "proton translocase"
    clause from the FUNCTION comment, which drives the ATP-synthesis and
    proton-transport keywords?
- question: >-
    Does Caulobacter FliI, like the Salmonella protein, form a FliH12-FliI6-FliJ1
    complex that is recruited to the new pole when the flagellum is assembled
    in the predivisional cell?
suggested_experiments:
- description: >-
    Purify P0CAT8 and measure Mg2+-dependent ATPase kinetics, sensitivity to F-type
    ATPase inhibitors, and hexamer formation with Caulobacter FliJ. Then test
    whether Walker-A/catalytic-glutamate mutants complement a clean fliI
    deletion.
  experiment_type: biochemistry and genetic complementation
- description: >-
    Image a functional fluorescent FliI fusion through the cell cycle to test
    for cell-cycle-dependent polar recruitment to the nascent flagellar basal
    body, and whether that recruitment depends on FliH and the FlhA export gate.
  experiment_type: live-cell fluorescence microscopy
