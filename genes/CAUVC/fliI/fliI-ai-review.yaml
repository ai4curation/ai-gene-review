- id: PMID:9286988
  title: Identification of the fliI and fliJ components of the Caulobacter flagellar
    type III protein secretion system.
  findings:
  - statement: >-
      fliI and fliJ form a class II flagellar operon. fliI mutants block
      flagellar assembly at an early stage and are non-motile. FliI is found in
      the cytoplasm and associated with the membrane. Conserved ATP-binding
      motif residues are required.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The only primary study on Caulobacter FliI. Only the abstract is in the
      cache (full text is at PMC179404). There is no enzymology on purified
      P0CAT8.
- id: PMID:8943245
  title: Enzymatic characterization of FliI. An ATPase involved in flagellar assembly
    in Salmonella typhimurium.
  findings:
  - statement: >-
      Salmonella FliI (ortholog) is a Mg2+-dependent ATPase that is insensitive
      to F-, V- and P-type ATPase inhibitors. Walker mutants block flagellar
      assembly.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Ortholog (Salmonella) biochemistry.
- id: PMID:17202259
  title: Structural similarity between the flagellar type III ATPase FliI and F1-ATPase
    subunits.
  findings:
  - statement: >-
      The Salmonella FliI crystal structure resembles F1 alpha/beta, which
      explains the homology-based ATP synthase labels.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Ortholog structure; establishes the paralogy with F1 subunits.
- id: PMID:21278755
  title: Common architecture of the flagellar type III protein export apparatus and
    F- and V-type ATPases.
  findings:
  - statement: >-
      FliJ is similar to the gamma-subunit coiled coil and binds the centre of
      the FliI hexamer ring.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Ortholog (Salmonella). Supports a rotary-like architecture, but shows no
      proton transport or ATP synthesis by FliI.
- id: PMID:18216858
  title: Distinct roles of the FliI ATPase and proton motive force in bacterial flagellar
    protein export.
  findings:
  - statement: >-
      ATP hydrolysis by FliI releases the FliH-FliI escort after substrate
      entry into the gate. The PMF drives translocation.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Ortholog (Salmonella); abstract only in the cache.
- id: PMID:18216859
  title: Energy source of flagellar type III secretion.
  findings:
  - statement: >-
      The flagellar secretion apparatus is a proton-driven protein exporter.
      ATP hydrolysis by FliI is not essential for export.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Ortholog (Salmonella); abstract only in the cache.
- id: PMID:21934659
  title: An energy transduction mechanism used in bacterial flagellar type III protein
    export.
  findings:
  - statement: >-
      The export gate complex is a proton-protein antiporter. The FliH-FliI
      complex brings about FliJ-FlhA binding, which turns the gate into an
      efficient delta-psi-driven exporter.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Ortholog (Salmonella). Places proton flux in the export gate, not in
      FliI.
- id: PMID:29946050
  title: In Vitro Reconstitution of Functional Type III Protein Export and Insights
    into Flagellar Assembly.
  findings:
  - statement: >-
      In inverted membrane vesicles, export needs Mg-ATP, FliJ and FliH2/FliI.
      ATP hydrolysis by FliI can drive some export without PMF, and FlhA has
      ion-channel activity.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Ortholog (Salmonella); full text in the cache.
