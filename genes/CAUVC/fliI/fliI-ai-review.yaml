- term:
    id: GO:0046034
    label: ATP metabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR004100
  review:
    summary: >-
      This InterPro2GO mapping comes from the F1/V1/A1 alpha/beta N-terminal
      domain (IPR004100), whose mapping reflects rotary ATP synthase
      biology. FliI hydrolyzes ATP only as the energy source for protein export.
      It does not take part in cellular ATP synthesis or ATP turnover as a
      metabolic pathway.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The term is technically true, since FliI hydrolyzes ATP. But GO captures
      energy-coupled ATP hydrolysis through the MF (GO:0016887), not as ATP
      metabolism. The domain-based mapping carries ATP synthase meaning over to
      an export ATPase. It adds no information and implies involvement in ATP
      synthesis.
    supported_by:
    - reference_id: PMID:18216858
      supporting_text: the energy of ATP hydrolysis being used to disassemble and
        release the FliH-FliI complex from the protein about to be exported
- term:
    id: GO:0046933
    label: proton-transporting ATP synthase activity, rotational mechanism
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN000390110
  review:
    summary: >-
      TreeGrafter transferred the F1-beta ATP synthase MF to FliI. PAINT
      asserts GO:0046933 at the F1-beta node PTN008558586, seeded by E. coli
      AtpD, human ATP5F1B, yeast ATP2 and S. pombe atp2. P0CAT8 is classified in
      PTHR15184:SF9 (FliI/SctN type III ATPase subfamily). In the current
      PANTHER tree PTN008558586 is a duplication node whose two children are the
      F1-beta clade (PTN008558588, holding every seed) and the FliI/SctN export
      ATPase clade (PTN000390097, SF9/SF62/SF81); the graft node PTN000390110 sits
      inside the latter. The IBD was therefore placed one node too deep, on the
      paralog-creating duplication, and leaks to a lineage with no Fo partner.
      FliJ is structurally similar to the gamma stalk, and a rotary mechanism
      has been proposed for the FliI6-FliJ ring. Even so, that ring hydrolyzes
      ATP to drive protein export and has no coupled proton channel.
    action: REMOVE
    reason: >-
      The annotation is contradicted by the biology. FliI does not synthesize
      ATP or transport protons. Its ATPase is insensitive to F-type ATPase
      inhibitors, and proton flux in the flagellar export system runs through
      the export gate (a proton-protein antiporter involving FlhA), not through
      FliI. The target descends from the IBD node only through the paralogous
      export-ATPase branch, not the F1-beta branch whose seeds carry the
      function, so this is a paralog over-propagation.
    supported_by:
    - reference_id: PMID:8943245
      supporting_text: The activity was not affected by inhibitors of the F-, V- or
        P-type ATPases
    - reference_id: PMID:21934659
      supporting_text: the export gate complex by itself is a proton-protein antiporter
    - reference_id: PMID:21278755
      supporting_text: FliJ promotes the formation of FliI hexamer rings by binding
        to the center of the ring
- term:
    id: GO:1902600
    label: proton transmembrane transport
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR004100
  review:
    summary: >-
      This row is an InterPro2GO mapping from the F1/V1/A1 alpha/beta N-terminal
      domain. FliI is a soluble peripheral ATPase with no transmembrane segment.
      The flagellar export apparatus as a whole uses the proton motive force,
      but proton translocation happens in the membrane export gate, where FlhA
      has ion-channel activity. FliI's contribution is to promote the FliJ-FlhA
      interaction that lets the gate use the PMF efficiently. That is not
      transmembrane transport of protons by FliI. The UniProt FUNCTION text also
      offers an old alternative: a "proton translocase involved in local
      circuits at the flagellum". No evidence supports it.
    action: REMOVE
    reason: >-
      The domain-based mapping carries a rotary ATP synthase function over to
      an export ATPase. The protons are carried by the export gate
      (FlhA-FlhB-FliPQR), not FliI. Assigning this process to FliI confuses dependence on
      the PMF with participation in proton transport.
    supported_by:
    - reference_id: PMID:29946050
      supporting_text: FlhA has an ion channel activity, and the FlhA-FliJ interaction
        enables effective utilization of PMF for protein export
    - reference_id: PMID:21934659
      supporting_text: the export gate complex by itself is a proton-protein antiporter
- term:
    id: GO:0008564
    label: protein-exporting ATPase activity
  evidence_type: ISS
  original_reference_id: PMID:8943245
  qualifier: enables
  review:
    summary: >-
      FliI hydrolyzes ATP to support export of flagellar proteins through the
      type III export apparatus. The GO definition covers ATP-hydrolyzing
      enzymes of type III secretion pathways. Caulobacter FliI is a component of
      the flagellar type III secretion system, and its ATP-binding motif is
      required for flagellar assembly. Enzymology and the export role are
      established for the Salmonella ortholog.
    action: NEW
    reason: >-
      This is the most specific and informative MF for FliI, and it is missing
      from GOA for P0CAT8. Other FliI entries carry it, for example through the
      EC 7.4.2.8 mapping. It is based on the Caulobacter genetics and fractionation
      together with ortholog biochemistry; the ISS source is the purified
      Salmonella FliI (PMID:8943245).
    supported_by:
    - reference_id: PMID:8943245
      supporting_text: It had an ATPase activity of 0.16 s-1 at 25 degrees C and pH 7
    - reference_id: PMID:9286988
      supporting_text: fliI encodes a 50-kDa polypeptide whose sequence is closely
        related to that of the Salmonella typhimurium FliI protein, an ATPase thought
        to energize the export of flagellar subunits across the cytoplasmic membrane
        through a type III protein secretion system.
    - reference_id: PMID:29946050
      supporting_text: ATP hydrolysis by FliI can drive the protein export without
        PMF.
