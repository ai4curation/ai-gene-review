    label: proton motive force-driven ATP synthesis
  evidence_type: IEA
  original_reference_id: GO_REF:0000108
  qualifier: involved_in
  supporting_entities:
  - GO:0046933
  review:
    summary: >-
      This row is a logical inference from the TreeGrafter GO:0046933 ATP
      synthase row. FliI consumes ATP to support flagellar protein export and
      is not part of an Fo-coupled ATP synthase. In the flagellar export
      system, the proton motive force drives protein translocation through the
      membrane export gate, not ATP synthesis.
    action: REMOVE
