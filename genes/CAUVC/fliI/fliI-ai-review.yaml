id: P0CAT8
gene_symbol: fliI
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:190650
  label: Caulobacter vibrioides CB15
description: >-
  FliI (CC_3040) is the soluble ATPase of the flagellar type III protein export
  apparatus of Caulobacter crescentus CB15. It is encoded with fliJ in a class II
  flagellar operon, and fliI mutants block assembly of the polar flagellum at an
  early stage and are non-motile. FliI is found both in the cytoplasm and
  associated with the membrane, and conserved residues of its Walker-type ATP
  binding motif are required for flagellar assembly. By homology to the
  well-characterized Salmonella protein, FliI forms a hexameric ring around the
  gamma-like stalk FliJ and, with the regulator FliH, docks at the cytoplasmic
  face of the export gate (FlhA, FlhB, FliP, FliQ, FliR). It hydrolyzes ATP to
  deliver axial flagellar proteins (rod, hook, junction, cap and filament
  subunits) and their chaperones to the gate, release the FliH-FliI escort, and
  switch the gate into an efficient proton-motive-force-driven protein exporter.
  Protein translocation itself is powered mainly by proton flux through the
  membrane export gate. FliI is an evolutionary paralog of the F1-ATP synthase
  alpha/beta subunits, but it does not synthesize ATP or conduct protons; the
  UniProt name "Flagellum-specific ATP synthase" and EC 7.1.2.2 reflect that
  homology rather than its function.
