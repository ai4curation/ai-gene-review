  label: Listeria seeligeri
description: AcrVIA1 is the Cas13a inhibitor encoded by gp2 of Listeria phage phiLS46 and represented
  by a Listeria seeligeri protein record. It binds the guide-exposed face of the Cas13a-crRNA complex,
  contacting both protein and guide RNA. This occludes target-RNA engagement and prevents the conformational
  changes that activate Cas13a, suppressing target and collateral RNase activities and the associated
  host growth arrest. Native-host infection and deletion/complementation experiments establish anti-CRISPR
  activity in the tested phiLS46-Listeria system.
