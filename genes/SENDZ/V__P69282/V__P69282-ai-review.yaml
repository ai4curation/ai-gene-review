- id: PMID:10933690
  title: Involvement of the zinc-binding capacity of Sendai virus V protein in viral
    pathogenesis.
  findings:
  - statement: The V-unique C-terminal domain of Sendai virus V binds zinc, and the
      binding depends on seven conserved cysteine residues.
    supporting_text: GST-Vu bound 7.2-fold more zinc than did GST, exhibiting its potential
      zinc-binding capacity
    reference_section_type: RESULTS
  - statement: Recombinant viruses carrying single cysteine substitutions that impair
      zinc binding replicate normally in cultured cells but are strongly attenuated in
      mice, so the zinc site is required for pathogenicity rather than for replication.
    supporting_text: the mutant viruses were strongly attenuated in mice
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified; full text cached. Direct experimental evidence that the Sendai virus
      V protein binds zinc, which is what justifies replacing the generic metal ion binding
      term with zinc ion binding.
- id: PMID:15231393
  title: C and V proteins of Sendai virus target signaling pathways leading to IRF-3
    activation for the negative regulation of interferon-beta production.
  findings:
  - statement: Independently expressed V inhibits double-stranded RNA- and Newcastle
      disease virus-induced activation of IRF-3 and of the interferon-beta promoter.
    supporting_text: C or V inhibited the double-stranded (ds) RNA- or Newcastle disease
      virus
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified; abstract only in the cache. Earlier, independent support for V
      acting on the IRF-3 arm, but it studies C, Y1 and Y2 alongside V and its virus
      mutants disrupt V and W together, so it corroborates rather than establishes the
      V-specific claim.
  full_text_unavailable: true
- id: PMID:22532687
  title: Inhibition of interferon regulatory factor 3 activation by paramyxovirus V
    protein.
  findings:
  - statement: Expressed V protein is dispersed through the host cytosol, whereas the Vu
      fragment is found in both cytosol and nucleus.
    supporting_text: When only the V protein was expressed, it appeared to be dispersed in
      the cytosol.
    reference_section_type: RESULTS
  - statement: V co-immunoprecipitates with host RIG-I, MDA5 and IRF3, and with the
      constitutively active IRF3-5D.
    supporting_text: Here we reproduced those results showing that the SeV V protein
      physically interacted with RIG-I and IRF3 as well as MDA5 by IP-Western blotting
    reference_section_type: RESULTS
  - statement: In Sendai virus-infected, poly(I:C)-stimulated cells, endogenous IRF3
      reaches the nucleus only when V is absent, indicating that V retains IRF3 in the
      cytosol.
    supporting_text: In SeV WT-infected cells, nuclear staining of IRF3 was not observed
    reference_section_type: RESULTS
  - statement: V inhibits IRF3-driven reporter activation even when the stimulus is a
      constitutively active IRF3, placing the block at IRF3 itself.
    supporting_text: When the signal was induced by IRF3-5D, the IRF3 activation was
      restricted in the presence of the V protein but not in the presence of the P/V and Vu
      proteins.
    reference_section_type: RESULTS
  - statement: Mouse genetics argue that MDA5 is not the sensor responsible for the innate
      response that V suppresses in vivo; RIG-I is.
    supporting_text: we infected MDA5-knockout mice with V-deficient SeV and found that
      MDA5 was largely unrelated to the innate immunity that the V protein suppresses in vivo
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified; full text cached. The central paper for this entry and the source of
      three of the four CACAO rows. Its assays are on the Sendai virus Z-strain V protein
      and on the interferon induction arm throughout.
- id: PMID:29321315
  title: Paramyxovirus V Proteins Interact with the RIG-I/TRIM25 Regulatory Complex
    and Inhibit RIG-I Signaling.
  findings:
  - statement: The Sendai virus V protein co-immunoprecipitates with TRIM25 and with
      RIG-I, as do the Nipah, measles and PIV5 V proteins.
    supporting_text: Immunoprecipitation against the V5 tag revealed that the V proteins of
      MeV, NiV, and SeV all coprecipitated with TRIM25, whereas NiV W did not
    reference_section_type: RESULTS
  - statement: V binding to RIG-I and TRIM25 prevents TRIM25-mediated ubiquitination of
      RIG-I and the downstream RIG-I interaction with MAVS; this was demonstrated with the
      Nipah, measles and PIV5 V proteins, not with the Sendai virus protein.
    supporting_text: we show that V interaction with TRIM25 and RIG-I prevents
      TRIM25-mediated ubiquitination of RIG-I and disrupts downstream RIG-I signaling to the
      mitochondrial antiviral signaling protein
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified; full text cached. Correctly cited for the Sendai virus V interaction
      with RIG-I and TRIM25, which is what it assays for this protein. Readers should note
      that the functional ubiquitination and MAVS experiments behind the inhibition claim use
      the Nipah, measles and PIV5 proteins, and that the Sendai construct is from the Cantell
      strain rather than strain Z.
- id: PMID:30021903
  title: Sendai Virus V Protein Inhibits the Secretion of Interleukin-1β by Preventing
    NLRP3 Inflammasome Assembly.
  findings:
  - statement: V binds host NLRP3 and blocks its self-oligomerization and the
      NLRP3-dependent oligomerization of ASC that the inflammasome requires.
    supporting_text: we showed that the V protein of SeV inhibits NLRP3 self-oligomerization
      by interacting with NLRP3 to block the NLRP3-mediated ASC oligomerization required for
      full activation of the inflammasome
    reference_section_type: INTRODUCTION
  - statement: NLRP3 is required for the interleukin-1-beta secretion provoked by
      V-deficient Sendai virus in THP1 macrophages.
    supporting_text: indicating that NLRP3 is required for SeV V
    reference_section_type: RESULTS
  - statement: Inhibition tracks with NLRP3 binding across V truncations, and the
      zinc-site point mutant Vcys retains both.
    supporting_text: Wild-type V and Vcys, but not Vn and Vc, inhibited NLRP3
      inflammasome-dependent IL-1
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified; full text cached. A thorough, Sendai-virus-specific study that fully
      supports the biology behind the CACAO GO:1900226 row; the only correction needed is the
      choice of term, not the evidence.
