id: P69282
gene_symbol: P/V/C
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:11198
  label: Sendai virus (Z)
description: >-
  Protein V is a 384-residue accessory protein of Sendai virus, produced by co-transcriptional
  RNA editing of the P/V/C gene: insertion of one pseudotemplated guanine at position 318
  shifts the reading frame, so V shares residues 1-317 with the polymerase cofactor P and
  carries a unique 67-residue cysteine-rich C terminus (the Vu region) that the unedited P
  mRNA does not encode; the +2G product is W, and the overlapping second reading frame of the
  same gene encodes the unrelated C/Y proteins. V is not part of the replication machinery and
  is dispensable for growth in cultured cells, but it is required for virulence in mice. It is
  a largely intrinsically disordered, cytosolic protein-interaction hub that disables several
  arms of cytosolic innate immune sensing in the host cell. Its best-characterized target is
  the transcription factor IRF3: V binds IRF3, including a constitutively active form, retains
  it in the cytosol and prevents its nuclear translocation and transactivation, so that
  interferon-beta induction fails. V also binds the tandem CARDs of the RNA sensor RIG-I and
  the SPRY domain of the RIG-I regulator TRIM25, a combination that in paramyxovirus V
  proteins generally blocks TRIM25-mediated ubiquitination of RIG-I and the downstream
  RIG-I-MAVS interaction; it binds the related sensor MDA5 through the Vu region; and it binds
  the inflammasome sensor NLRP3, preventing NLRP3 self-oligomerization and NLRP3-dependent ASC
  speck formation and thereby caspase-1-dependent interleukin-1-beta maturation and secretion.
  The Vu region binds zinc through seven conserved cysteines; cysteine substitutions that lose
  zinc binding leave replication in culture intact but attenuate the virus in mice, indicating
  that the metal site is a structural requirement for the immune-antagonist activities rather
  than a catalytic centre.
