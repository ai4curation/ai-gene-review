- term:
    id: GO:0039540
    label: symbiont-mediated suppression of host cytoplasmic pattern recognition receptor
      signaling pathway via inhibition of RIG-I activity
  evidence_type: IDA
  original_reference_id: PMID:29321315
  qualifier: involved_in
  review:
    summary: >-
      SeV V binds both the tandem CARDs of RIG-I and the SPRY domain of TRIM25; in
      paramyxovirus V proteins this combination blocks TRIM25-mediated RIG-I ubiquitination
      and the downstream RIG-I-MAVS interaction, arresting RIG-I signalling.
    action: ACCEPT
    reason: >-
      The claim is sound, but it is worth recording precisely what this paper did with the SeV
      protein as opposed to its relatives. SeV V appears in the interaction experiments only:
      it co-precipitates with TRIM25 (Fig. 3A) and with RIG-I (Fig. 3C). The functional
      experiments that establish the mechanism - the IFN-beta reporter assays, the loss of
      RIG-IN ubiquitination (Fig. 9) and the loss of RIG-I-MAVS association (Fig. 10) - were
      performed with Nipah, measles and PIV5 V proteins, and the authors generalise on the
      strong conservation of the V C-terminal domain that mediates both interactions.
      SeV-specific functional support comes from the companion literature: in PMID:22532687
      the SeV V protein inhibited IRF3 activation driven by a constitutively active RIG-I
      (Fig. 6C), and it interacts with RIG-I there too. Given curated interaction data on the
      SeV protein plus a conserved mechanism and a SeV-specific downstream readout, the row is
      accepted; the interference is with interferon induction, not with signalling downstream
      of the interferon receptor, and GO:0039540 correctly sits in the pattern-recognition
      branch.
    additional_reference_ids:
    - PMID:22532687
    supported_by:
    - reference_id: PMID:29321315
      supporting_text: Immunoprecipitation against the V5 tag revealed that the V proteins of
        MeV, NiV, and SeV all coprecipitated with TRIM25, whereas NiV W did not
      reference_section_type: RESULTS
    - reference_id: PMID:29321315
      supporting_text: Immunoprecipitation revealed that both V proteins coprecipitated with
        RIG-I but not with the empty vector or GFP-Flag
      reference_section_type: RESULTS
    - reference_id: PMID:29321315
      supporting_text: This result indicates that multiple paramyxovirus V proteins can inhibit
        RIG-I ubiquitination, and thus, this is a conserved mechanism.
      reference_section_type: RESULTS
    - reference_id: file:SENDZ/V__P69282/V__P69282-uniprot.txt
      record_section: ["CC:SUBUNIT"]
      supporting_text: Interacts with host RIGI regulatory protein (via CARDs domain) and
        host TRIM25 (via SPRY domain)
- term:
    id: GO:0039548
    label: symbiont-mediated suppression of host cytoplasmic pattern recognition receptor
      signaling pathway via inhibition of IRF3 activity
  evidence_type: IDA
  original_reference_id: PMID:22532687
  qualifier: involved_in
  review:
    summary: >-
      V binds host IRF3 and its constitutively active form IRF3-5D, retains IRF3 in the
      cytosol so that it cannot enter the nucleus, and blocks IRF3-driven reporter activation
      even when the stimulus is active IRF3 itself. This is the best-supported function of the
      protein.
    action: ACCEPT
    reason: >-
      CACAO row, and an exemplary one. The cited paper assays this exact claim on this exact
      protein by direct assay, at the right granularity. Co-immunoprecipitation shows V binds
      IRF3 and IRF3-5D (Fig. 3); immunofluorescence of SeV-infected, poly(I:C)-stimulated
      HeLa cells shows endogenous IRF3 reaching the nucleus only when V is absent (Fig. 5);
      and the p-55C1B reporter assay shows V suppressing IRF3 activation driven by MDA5, by
      constitutively active RIG-I, by constitutively active TRIF and by IRF3-5D (Fig. 6). The
      last of these is the decisive control: blocking a constitutively active IRF3 places the
      lesion at IRF3 itself rather than somewhere upstream, which is precisely what the term
      asserts. The cross-virus comparison in the same paper, where inhibition tracks with IRF3
      binding (measles and Newcastle disease V bind and inhibit; mumps and Nipah V do
      neither), reinforces the mechanism. Independent earlier support in PMID:15231393. The
      term is neither a downstream phenotype nor a parent-level restatement, and it is in the
      pattern-recognition (interferon induction) branch, which is the arm the paper assays.
    additional_reference_ids:
    - PMID:15231393
    supported_by:
    - reference_id: PMID:22532687
      supporting_text: Here we reproduced those results showing that the SeV V protein
        physically interacted with RIG-I and IRF3 as well as MDA5 by IP-Western blotting
      reference_section_type: RESULTS
    - reference_id: PMID:22532687
      supporting_text: In SeV WT-infected cells, nuclear staining of IRF3 was not observed
      reference_section_type: RESULTS
    - reference_id: PMID:22532687
      supporting_text: When the signal was induced by IRF3-5D, the IRF3 activation was
        restricted in the presence of the V protein but not in the presence of the P/V and Vu
        proteins.
      reference_section_type: RESULTS
    - reference_id: PMID:15231393
      supporting_text: C or V inhibited the double-stranded (ds) RNA- or Newcastle disease
        virus
      reference_section_type: ABSTRACT
