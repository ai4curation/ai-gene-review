- term:
    id: GO:0052170
    label: symbiont-mediated suppression of host innate immune response
  evidence_type: IEA
  original_reference_id: GO_REF:0000043
  qualifier: involved_in
  supporting_entities:
  - UniProtKB-KW:KW-1090
  review:
    summary: >-
      Electronic mapping of KW-1090 (Inhibition of host innate immune response by virus). This
      is the apt umbrella term for a protein with several distinct innate-immune targets.
    action: ACCEPT
    reason: >-
      Unlike the two rows above, this term is not merely a vague ancestor: it is the level at
      which V's function is actually stated, because the protein disables several separate
      arms of innate immunity (IRF3, RIG-I/TRIM25, MDA5, the NLRP3 inflammasome) and no single
