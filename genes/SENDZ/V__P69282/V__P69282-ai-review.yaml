      citing PubMed:15231393, PubMed:22532687 and PubMed:29321315, and the in vivo phenotype of
      V-deficient virus supports it directly.
    supported_by:
    - reference_id: PMID:22532687
      supporting_text: The V protein of Sendai virus (SeV) suppresses innate immunity,
        resulting in enhancement of viral growth in mouse lungs and viral pathogenicity.
      reference_section_type: ABSTRACT
- term:
    id: GO:0052170
    label: symbiont-mediated suppression of host innate immune response
  evidence_type: IMP
  original_reference_id: PMID:22532687
  qualifier: involved_in
  review:
    summary: >-
      Recombinant V-deficient Sendai virus is cleared from mouse lungs, is roughly thirtyfold
      less virulent, and provokes markedly more interferon-beta from infected fibroblasts than
      wild-type virus does; the innate response V suppresses is the IRF3-dependent one.
    action: ACCEPT
    reason: >-
      CACAO row, from a mutant-virus (IMP) perturbation. What the paper shows for this gene is
      the in vivo and cellular consequence of deleting V: attenuated growth in mouse lung
      (Fig. 1), a thirtyfold higher MLD50 (Table 1), and greater interferon-beta secretion from
      V-deficient-infected mouse embryonic fibroblasts and L929 cells (Fig. 2). The term
      matches that readout. It is worth being explicit that the readout belongs to the
      interferon production arm, not the interferon signalling arm: nothing in this paper or in
      the rest of this entry's literature assays the interferon receptor or the JAK/STAT
      cascade, which in Sendai virus is antagonised by the C protein rather than by V.
      Pleasingly, neither CACAO nor UniProt placed GO:0039502 on this entry, so the
      production/signalling conflation catalogued elsewhere in this project did not occur here.
      Because GO has no symbiont-mediated counterpart of GO:0032480 (filed under
      proposed_new_terms), GO:0052170 is the most specific available term for a whole-organism
      interferon-production phenotype, and it is retained rather than called a parent-level
      restatement of the IRF3 row.
    supported_by:
    - reference_id: PMID:22532687
      supporting_text: The V protein of Sendai virus (SeV) suppresses innate immunity,
        resulting in enhancement of viral growth in mouse lungs and viral pathogenicity.
      reference_section_type: ABSTRACT
    - reference_id: PMID:22532687
      supporting_text: The V protein may suppress a point in the pathway starting from RIG-I to
        IRF3 activation and IFN-
      reference_section_type: RESULTS
- term:
    id: GO:1900226
    label: negative regulation of NLRP3 inflammasome complex assembly
  evidence_type: IMP
  original_reference_id: PMID:30021903
  qualifier: involved_in
  review:
    summary: >-
      V binds host NLRP3 and prevents its self-oligomerization and NLRP3-dependent ASC speck
      formation, so caspase-1 is not activated and interleukin-1-beta is not matured or
      secreted. The biology is right; the term chosen is the within-organism regulation term
      rather than the host-directed one.
    action: MODIFY
    reason: >-
      CACAO row, and the underlying work is strong and specific to this protein: V-deficient
      virus induces about sevenfold more interleukin-1-beta secretion and visible NLRP3 specks
      in THP1 macrophages where wild-type virus does not (Fig. 1), stable V expression
      suppresses ligand-driven secretion (Fig. 2), V co-immunoprecipitates with NLRP3 (Fig. 3),
      truncation mapping ties inhibition to the binding-competent forms (Fig. 4), and BRET and
      speck assays show the block is on NLRP3 self-oligomerization and NLRP3-ASC association
      (Figs. 5 and 6). So the student read the paper correctly. The problem is ontological.
      GO:1900226 sits under negative regulation of protein-containing complex assembly and
      regulation of NLRP3 inflammasome complex assembly: it describes an organism regulating
      its own inflammasome, whereas V is a viral protein acting on a host complex. GO's
      interspecies branch now carries GO:0141081, symbiont-mediated suppression of host
      inflammasome-mediated signal transduction, which was made a child of GO:0039537 in 2024
      and so did not exist when this annotation was made in 2018. GO:0141081 has no child
      naming the mechanism, unlike the RIG-I and IRF3 cases, so a more precise child is
      proposed in proposed_new_terms; until it exists, GO:0141081 is the right replacement.
    proposed_replacement_terms:
    - id: GO:0141081
      label: symbiont-mediated suppression of host inflammasome-mediated signal transduction
    supported_by:
    - reference_id: PMID:30021903
      supporting_text: we showed that the V protein of SeV inhibits NLRP3 self-oligomerization
        by interacting with NLRP3 to block the NLRP3-mediated ASC oligomerization required for
        full activation of the inflammasome
      reference_section_type: INTRODUCTION
    - reference_id: PMID:30021903
      supporting_text: Wild-type V and Vcys, but not Vn and Vc, inhibited NLRP3
        inflammasome-dependent IL-1
      reference_section_type: RESULTS
    - reference_id: PMID:30021903
      supporting_text: indicating that NLRP3 is required for SeV V
      reference_section_type: RESULTS
- term:
    id: GO:0140311
    label: protein sequestering activity
  evidence_type: IDA
  original_reference_id: PMID:22532687
  qualifier: enables
  review:
    summary: >-
      Proposed molecular function not present in GOA. V's mechanism against each of its host
      targets is to bind the target and withdraw it from the interaction it needs to make:
      IRF3 is held in the cytosol and cannot enter the nucleus even when constitutively
      active, and NLRP3 is prevented from self-oligomerizing and from recruiting ASC. This is
      sequestration, not catalysis, and it is the activity that underlies the process terms
      accepted in this review.
    action: NEW
    reason: >-
      GOA gives this entry no informative molecular function at all - only metal ion binding -
      while all four of its biological-process rows describe consequences of one activity.
      Naming that activity is what the molecular-function aspect is for, and the evidence is
      direct rather than inferential: V binds IRF3 and the constitutively active IRF3-5D and
      prevents its nuclear translocation in both transfected and infected cells
      (PMID:22532687, Figs. 3-6), and it binds NLRP3 and blocks NLRP3 self-oligomerization and
      NLRP3-ASC association by BRET and speck assays (PMID:30021903, Figs. 5 and 6). The
      generic alternative, protein binding, would say nothing about what the binding
      accomplishes. GO:0140311 is deliberately preferred over the broader molecular
      sequestering activity because every demonstrated target is a protein.
    additional_reference_ids:
    - PMID:30021903
    supported_by:
    - reference_id: PMID:22532687
      supporting_text: These results suggest that the V protein also retained IRF3 in the
        cytosol in SeV-infected cells.
      reference_section_type: RESULTS
    - reference_id: PMID:30021903
      supporting_text: we showed that the V protein of SeV inhibits NLRP3 self-oligomerization
        by interacting with NLRP3 to block the NLRP3-mediated ASC oligomerization required for
        full activation of the inflammasome
      reference_section_type: INTRODUCTION
