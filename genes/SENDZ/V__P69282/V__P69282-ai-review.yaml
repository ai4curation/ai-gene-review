proposed_new_terms:
- proposed_name: symbiont-mediated suppression of host inflammasome-mediated signal
    transduction via inhibition of NLRP3 activity
  proposed_definition: >-
    A process in which a symbiont interferes with host inflammasome-mediated signal
    transduction specifically by binding the host sensor NLRP3 and preventing its
    self-oligomerization or its recruitment of the adaptor ASC, so that the inflammasome does
    not assemble. The host is defined as the larger of the organisms involved in a symbiotic
    interaction.
  justification: >-
    GO:0141081 symbiont-mediated suppression of host inflammasome-mediated signal transduction
    has no children, whereas the sibling branch for cytoplasmic pattern-recognition receptor
    signalling names the targeted molecule (GO:0039540 via inhibition of RIG-I, GO:0039548 via
    inhibition of IRF3, GO:0039554 via inhibition of MDA-5). Several unrelated viral proteins
    converge on NLRP3 itself, and distinguishing a sensor-directed block from interference
    further down the inflammasome pathway is exactly the distinction those sibling terms
    already make. Sendai virus V is a clean case: it binds NLRP3 and blocks its
    self-oligomerization, while the within-organism term GO:1900226 negative regulation of
    NLRP3 inflammasome complex assembly, currently used for it, sits under regulation of the
    organism's own complex assembly rather than in the interspecies branch.
  proposed_parent:
    id: GO:0141081
    label: symbiont-mediated suppression of host inflammasome-mediated signal transduction
  supported_by:
  - reference_id: PMID:30021903
    supporting_text: we showed that the V protein of SeV inhibits NLRP3 self-oligomerization by
      interacting with NLRP3 to block the NLRP3-mediated ASC oligomerization required for full
      activation of the inflammasome
    reference_section_type: INTRODUCTION
- proposed_name: symbiont-mediated suppression of host type I interferon production
  proposed_definition: >-
    A process in which a symbiont stops, prevents or reduces the production of type I
    interferons by its host, for example by preventing transcriptional induction of interferon
    genes. This is distinct from suppression of the host type I interferon-mediated signaling
    pathway (GO:0039502), which concerns interference with signalling downstream of the type I
    interferon receptor. The host is defined as the larger of the organisms involved in a
    symbiotic interaction.
  justification: >-
    A second instance of a gap already filed in the Rift Valley fever virus NSs review: GO has
    symbiont-mediated terms for suppression of type I, II and III interferon-mediated
    signalling but no counterpart of GO:0032480 negative regulation of type I interferon
    production. For Sendai virus V every measured readout is an interferon production readout -
    interferon-beta secretion from infected fibroblasts, interferon-beta promoter activity, IRF3
    nuclear translocation - and none touches the interferon receptor or JAK/STAT. The only
    available landing places are either the mechanism-specific receptor-pathway terms, which do
    not capture the output, or the broad GO:0052170. Recording the instance here is useful
    because this entry shows the consequence of the gap without the usual error: nothing was
    annotated to GO:0039502, but there was no correct term for the production phenotype either.
  proposed_parent:
    id: GO:0052170
    label: symbiont-mediated suppression of host innate immune response
  supported_by:
  - reference_id: PMID:15231393
    supporting_text: C or V inhibited the double-stranded (ds) RNA- or Newcastle disease virus
    reference_section_type: ABSTRACT
  - reference_id: PMID:22532687
    supporting_text: The V protein may suppress a point in the pathway starting from RIG-I to
      IRF3 activation and IFN-
    reference_section_type: RESULTS
suggested_questions:
- question: >-
    Does Sendai virus V itself block TRIM25-mediated ubiquitination of RIG-I, as its Nipah,
    measles and PIV5 counterparts do? PMID:29321315 establishes the interactions for the Sendai
    protein but runs the ubiquitination and MAVS-association assays on the other three.
  experts:
  - Megan L. Shaw
  - Adolfo Garcia-Sastre
  - Maria Teresa Sanchez-Aparicio
- question: >-
    V has at least four cytosolic targets (IRF3, RIG-I, TRIM25, MDA5, NLRP3) and is largely
    disordered outside the 67-residue Vu domain. Are these engaged simultaneously by distinct
    surfaces, or competitively by one promiscuous interface whose apparent breadth is partly an
    artefact of overexpression, as the authors of PMID:22532687 themselves raise?
  experts:
  - Takashi Irie
  - Takemasa Sakaguchi
- question: >-
    The zinc-coordinating point mutant Vcys still binds NLRP3 and still inhibits the
    inflammasome, yet cysteine mutant viruses are attenuated in mice. Which of V's activities
    actually requires an intact zinc site, and is attenuation attributable to loss of the IRF3
    or the RIG-I arm rather than the inflammasome arm?
  experts:
  - Takashi Komatsu
  - Bin Gotoh
- question: >-
    Is there any Sendai virus V activity downstream of the type I interferon receptor, or is
    interferon antagonism by this virus cleanly divided between V (induction) and C
    (JAK/STAT signalling)? The answer determines whether any symbiont-mediated
    interferon-signalling term should ever apply to V.
  experts:
  - Bin Gotoh
  - Takemasa Sakaguchi
suggested_experiments:
- hypothesis: >-
    Sendai virus V blocks TRIM25-dependent ubiquitination of RIG-I by the same mechanism
    demonstrated for Nipah, measles and PIV5 V proteins.
  description: >-
    Repeat the GST-RIG-IN pulldown ubiquitination assay and the RIG-IN-MAVS co-precipitation
    assay of PMID:29321315 with the Sendai virus V construct included alongside the Nipah
    control, and in parallel in cells infected with wild-type and V-deficient Sendai virus so
    that the readout is obtained at native expression levels rather than by transfection.
    Include the Vu-deletion and cysteine point mutants to test whether the C-terminal domain
    that mediates the interactions is also required for the ubiquitination block.
- hypothesis: >-
    V's several innate-immune targets are engaged through distinct surfaces rather than one
    promiscuous interface.
  description: >-
    Determine the interaction interfaces by crosslinking mass spectrometry or hydrogen-deuterium
    exchange on V complexed separately with IRF3, the RIG-I CARDs, and NLRP3, then design
    separation-of-function point mutants and test each for loss of one interaction with
    retention of the others. Validate the informative mutants in recombinant virus and measure
    interferon-beta and interleukin-1-beta output and virulence in mice, which would say which
    arm drives the attenuation of V-deficient virus.
- hypothesis: >-
    V suppresses host type I interferon production but has no effect on signalling downstream
    of the interferon receptor.
  description: >-
    In cells expressing V alone, and in cells infected with wild-type or V-deficient virus,
    measure in parallel the induction of interferon-beta after RIG-I ligand stimulation and the
    induction of a panel of interferon-stimulated genes after addition of exogenous recombinant
    interferon-beta, with STAT1 phosphorylation as the proximal readout. Running the two arms
    side by side in one experiment would settle which GO branch applies, and would separate V's
    contribution from that of the C protein, which is the known STAT1 antagonist of this virus.
