- term:
    id: GO:0039554
    label: symbiont-mediated suppression of host cytoplasmic pattern recognition receptor
      signaling pathway via inhibition of MDA-5 activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000043
  qualifier: involved_in
  supporting_entities:
  - UniProtKB-KW:KW-1089
  review:
    summary: >-
      V binds MDA5 through its Vu region and reduces MDA5-driven IRF3 activation in reporter
      assays, but mouse genetics in the same study show MDA5 is not the sensor that matters
      for what V suppresses in vivo.
    action: KEEP_AS_NON_CORE
    reason: >-
      The claim itself is supported for Sendai virus, not merely inferred from the keyword:
      PMID:22532687 shows V co-precipitating with MDA5, maps the interaction to the Vu region,
      and shows that MDA5 overexpression-driven IRF3 activation is reduced by V. It is kept,
      but as non-core rather than core, because the same paper's in vivo experiments argue
      that this arm is peripheral for this virus: V-deficient SeV was as attenuated in
      MDA5-knockout mice as in wild-type mice, whereas RIG-I knockout rescued it, and the
      authors conclude RIG-I is the important sensor. The term is at the correct granularity -
      the issue is importance, not accuracy - so KEEP_AS_NON_CORE rather than MODIFY. Part of
      the UniProt MDA5/LGP2 statement is propagated by similarity from P69280, which is a
      further reason not to treat this as a core activity of the Z-strain protein.
    additional_reference_ids:
    - PMID:22532687
    supported_by:
    - reference_id: PMID:22532687
      supporting_text: Overexpression of MDA5 induced IRF3 activation
      reference_section_type: RESULTS
    - reference_id: PMID:22532687
      supporting_text: The activation was reduced in the presence of the V protein
      reference_section_type: RESULTS
    - reference_id: PMID:22532687
      supporting_text: we infected MDA5-knockout mice with V-deficient SeV and found that MDA5
        was largely unrelated to the innate immunity that the V protein suppresses in vivo
      reference_section_type: ABSTRACT
    - reference_id: PMID:22532687
      supporting_text: However, the present work showed that RIG-I is more important for virus
        pathogenesis in relation to the SeV V protein.
      reference_section_type: DISCUSSION
- term:
    id: GO:0044164
    label: host cell cytosol
  evidence_type: IDA
  original_reference_id: PMID:22532687
  qualifier: part_of
  review:
    summary: >-
      Immunofluorescence of V expressed in cells shows it dispersed in the cytosol; the
      truncated forms localize differently, so the signal is specific to the construct rather
      than a staining artefact.
    action: ACCEPT
    reason: >-
      CACAO row, and well chosen. The paper images the viral protein itself (Fig. 4), which is
      the thing the cellular-component term is about, and the internal comparison - full-length
      V and the P/V fragment cytosolic, the Vu fragment both cytosolic and nuclear - shows the
      assay resolves differences in distribution rather than reporting a default. It is not a
      single-assay localization of the kind that has gone wrong elsewhere in this project,
      because the location is corroborated by UniProt's curated SUBCELLULAR LOCATION from the
      same work and because it is mechanistically required: V's effect on IRF3 is to hold IRF3
      in the cytosol, and NLRP3, RIG-I and MDA5 are cytosolic.
    supported_by:
    - reference_id: PMID:22532687
      supporting_text: When only the V protein was expressed, it appeared to be dispersed in
        the cytosol.
      reference_section_type: RESULTS
    - reference_id: PMID:22532687
      supporting_text: These results suggest that the V protein also retained IRF3 in the
        cytosol in SeV-infected cells.
      reference_section_type: RESULTS
- term:
    id: GO:0046872
    label: metal ion binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - InterPro:IPR024279
  - UniProtKB-KW:KW-0479
  review:
    summary: >-
      The Vu domain binds zinc specifically, through seven conserved cysteines, as shown
      experimentally for the Sendai virus protein; the generic metal ion term understates what
      is known.
    action: MODIFY
    reason: >-
      The signature behind this row (InterPro IPR024279 / Pfam PF13008 zf-Paramyx-P) is the
      paramyxovirus V zinc-finger-like domain, and the metal is identified: a GST-Vu fusion
      bound 65-Zn 7.2-fold above the GST control while the P/V common region did not, and
      individually substituting each of the seven conserved cysteines reduced zinc binding to
      22-68 per cent of wild type (PMID:10933690). UniProt models two Zn(2+) sites over eight
      ligand residues on this entry. Because a specific supported descendant exists, the
      correct action is MODIFY to zinc ion binding rather than keeping the parent. Note the
      activity is structural rather than catalytic: cysteine mutant viruses replicate normally
      in culture but are attenuated in mice.
    proposed_replacement_terms:
    - id: GO:0008270
      label: zinc ion binding
    additional_reference_ids:
    - PMID:10933690
    supported_by:
    - reference_id: PMID:10933690
      supporting_text: GST-Vu bound 7.2-fold more zinc than did GST, exhibiting its potential
        zinc-binding capacity
      reference_section_type: RESULTS
    - reference_id: PMID:10933690
      supporting_text: the zinc-binding capacities of the mutant proteins were greatly impaired
      reference_section_type: ABSTRACT
    - reference_id: file:SENDZ/V__P69282/V__P69282-uniprot.txt
      record_section: ["FT:BINDING"]
      supporting_text: /ligand="Zn(2+)"
    - reference_id: file:SENDZ/V__P69282/V__P69282-uniprot.txt
