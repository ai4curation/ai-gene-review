  review:
    summary: Xis is a winged-helix DNA-binding protein that recognizes the X1, X1.5, and X2 sites within the attR attachment
      region and bends the DNA to assemble the excisive intasome.
    action: ACCEPT
    reason: High-resolution NMR and X-ray crystal structures confirm that Xis directly binds DNA via its winged-helix domain
      to form a curved micronucleoprotein filament at attR.
