- id: PMID:12460578
  title: 'Regulation of directionality in bacteriophage lambda site-specific recombination: structure of the Xis protein.'
  findings:
  - statement: Solution NMR structure of Xis(1-55) reveals an unusual winged-helix fold that functions both as a DNA architectural
      factor and by cooperatively recruiting integrase to an adjacent arm site required for excision.
    supporting_text: A critical regulator of this process is the phage-encoded excisionase (Xis) protein, which functions
      both as a DNA architectural factor and by cooperatively recruiting integrase to an adjacent binding site specifically
      required for excision.
- id: PMID:17275024
  title: Fis targets assembly of the Xis nucleoprotein filament to promote excisive recombination by phage lambda.
  findings:
  - statement: Crystal structure of a single Xis protomer bound to DNA demonstrates major-groove recognition by its alpha-helix
      and minor-groove contact by its beta-hairpin wing.
    supporting_text: Xis is a winged-helix DNA binding protein that cooperatively binds to the attR recombination site to
      generate a curved microfilament, which promotes assembly of the excisive intasome but inhibits formation of an integrative
      intasome.
- id: PMID:17287355
  title: Structure of the cooperative Xis-DNA complex reveals a micronucleoprotein filament that regulates phage lambda intasome
    assembly.
  findings:
  - statement: Crystal structure at 2.6 A resolution shows three Xis monomers bound head-to-tail on a 33-bp attR DNA fragment,
      inducing >72 degrees of curvature to promote excisive intasome assembly.
    supporting_text: Here, we report the 2.6-A crystal structure of the complex between three cooperatively bound Xis proteins
      and a 33-bp DNA containing the regulatory element. Xis binds DNA in a head-to-tail orientation to generate a micronucleoprotein
      filament.
