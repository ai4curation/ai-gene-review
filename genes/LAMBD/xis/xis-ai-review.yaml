suggested_questions:
- question: How does the allosteric interplay between host Fis binding at the F site and Xis binding at X1-X1.5 regulate prophage
    excision efficiency under varying host growth phases?
suggested_experiments:
- description: Measure excisive recombination kinetics and intasome assembly by cryo-EM on native attR substrates containing
    both X1-X2 and Fis-binding sites in the presence of physiological ratios of Xis and Fis.
  hypothesis: Fis binding at the F site substitutes for the X2-bound Xis protomer when Xis concentrations are limiting during
    early prophage induction, stabilizing the same DNA curvature trajectory required to bridge the P2 arm site to the core.
