      supporting_text: Here, we report the 2.6-A crystal structure of the complex between three cooperatively bound Xis proteins
        and a 33-bp DNA containing the regulatory element. Xis binds DNA in a head-to-tail orientation to generate a micronucleoprotein
        filament.
    - reference_id: PMID:17275024
      supporting_text: Xis is a winged-helix DNA binding protein that cooperatively binds to the attR recombination site to
        generate a curved microfilament, which promotes assembly of the excisive intasome but inhibits formation of an integrative
        intasome.
