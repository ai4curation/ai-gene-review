id: P03699
gene_symbol: xis
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:2681611
  label: Escherichia phage Lambda
description: Winged-helix DNA-binding architectural protein and recombination directionality factor (excisionase) required
  for the excision of the bacteriophage lambda prophage from the Escherichia coli chromosome during lytic induction. Cooperatively
  binds in a head-to-tail trimeric micronucleoprotein filament across the X1-X1.5-X2 sites of the attR attachment region,
  bending the DNA by over 70 degrees and recruiting the N-terminal arm-binding domain of lambda integrase (Int) via its C-terminal
  tail to promote excisive intasome assembly while inhibiting reintegration.
