suggested_questions:
- question: Does the C-terminal intramolecular chaperone/autoproteolytic domain conserved in phage long tail fibers undergo
    self-cleavage in Ur-lambda gpStf after gpTfa-assisted trimerization, or does gpTfa remain bound to the mature distal fiber
    tip in infectious virions?
suggested_experiments:
- description: Analyze purified Ur-lambda virions by intact-protein mass spectrometry and cryo-EM focused on the distal C-terminal
    tips of the side tail fibers in complex with purified OmpC nanodiscs.
  hypothesis: gpTfa chaperones the folding of the OmpC-binding C-terminal tip of trimeric gpStf, and high-resolution reconstruction
    of the distal fiber-OmpC interface will reveal whether gpTfa is retained as a structural co-subunit or released upon maturation.
