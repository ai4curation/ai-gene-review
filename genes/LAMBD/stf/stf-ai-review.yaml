gene_symbol: stf
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:2681611
  label: Escherichia phage Lambda
description: Side tail fiber protein gpStf is a structural protein that forms four long, thin, jointed side tail fibers on
  ancestral bacteriophage Ur-lambda virions (disrupted by a laboratory frameshift mutation in lambda PaPa). Twelve copies
  of gpStf assemble with the assistance of the tail fiber assembly chaperone gpTfa, anchoring via their N-terminal domains
  (gpStfN) as a dodecameric collar around the junction between the distal hexameric ring of major tail tube protein (gpV)
  and the hexameric ring of distal tail protein (gpM), while their C-terminal receptor-binding tips reversibly bind the Escherichia
  coli outer membrane porin OmpC to accelerate primary host adsorption and orient the virion for LamB engagement.
