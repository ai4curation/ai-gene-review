suggested_questions:
- question: What is the structural organization and stoichiometry of the soluble gpH-gpG-gpGT chaperone complex prior to gpV polymerization, and how are gpG molecules progressively stripped off gpH as each hexameric gpV ring stacks?
suggested_experiments:
- description: Reconstitute the soluble gpH-gpG-gpGT complex in vitro and analyze its stoichiometry, architecture, and gpV-induced disassembly using native mass spectrometry, SEC-MALS, and cryo-EM.
  hypothesis: Multiple gpG monomers coat the extended alpha-helical shaft of gpH while a single C-terminal T domain of gpGT caps or bridges the complex to recruit incoming gpV subunits, with gpV hexamer closure sterically displacing gpG along the ruler.
