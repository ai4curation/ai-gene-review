- id: PMID:23851014
  title: A balanced ratio of proteins from gene G and frameshift-extended gene GT is required for phage lambda tail assembly.
  findings:
  - statement: Both gpG and the frameshift-extended gpGT protein are essential in a balanced ratio for bacteriophage lambda tail assembly.
    supporting_text: A plasmid system that can direct the efficient synthesis of tails was created and used to show that gpG and gpGT are both essential for correct tail assembly.
  - statement: gpGT is synthesized when 3-4% of ribosomes translating gene G shift into the -1 reading frame at a slippery sequence at the G-T junction.
    supporting_text: The second protein gpGT is made when about 3-4% of the ribosomes reading the G orf shift back one base on the mRNA at a slippery sequence at the G-T junction and continue in the -1 frame to the end of gene T.
  - statement: Genes H, G, and M convert the 15S tail tip precursor (formed by J, I, L, and K) into the 25S initiator of tail shaft polymerization.
    supporting_text: From these studies it was clear that a slow sedimenting (15S) precursor produced by genes J, I, L, and K could be converted by the actions of genes H, G, and M to a faster sedimenting (25S) initiator of tail shaft polymerization
- id: PMID:23911548
  title: Chaperone-protein interactions that mediate assembly of the bacteriophage lambda tail to the correct length.
  findings:
  - statement: The G domains of gpG and gpGT bind along the tape measure protein gpH while the T domain of gpGT binds major tail protein gpV to direct tail shaft polymerization.
    supporting_text: We show that the "G" domains of gpG and gpGT bind to all or parts of tail length tape measure protein gpH and that the "T" domain of gpGT binds to major tail shaft subunit gpV, and present a model for how gpG and gpGT chaperone gpH and direct the polymerization of gpV to form a tail of the correct length.
  - statement: Neither gpG nor gpGT is incorporated into mature bacteriophage lambda tails.
    supporting_text: Although both proteins are required and must be present in the correct ratio for assembly of functional tails, neither is present in mature tails.
