suggested_questions:
- question: What is the exact stoichiometry and symmetry of gpZ within the C6/C12 symmetry-mismatched portal-neck complex
    of mature bacteriophage lambda, and how does gpZ binding alter the conformation of the tape measure protein (gpH*) or
    head completion protein (gpFII) to license DNA ejection?
suggested_experiments:
- description: Determine a symmetry-expanded asymmetric cryo-EM reconstruction focused on the gpFII-gpU-gpZ-gpH* interface
    in wild-type versus gpZ-deficient lambda virions to resolve the exact atomic contacts and stoichiometry of gpZ.
  hypothesis: gpZ bridges the C6 gpU-gpFII rings and stabilizes the N-terminal plug of gpH* within the portal-neck channel,
    priming the conduit for DNA translocation upon receptor binding.
