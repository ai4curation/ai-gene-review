  label: Escherichia phage Lambda
description: Tail completion protein gpZ is a minor structural component of the proximal tail and portal-neck complex of bacteriophage
  lambda. Acting at the late stage of tail morphogenesis after the major tail tube (gpV) has been capped by the tail terminator
  hexamer (gpU), gpZ associates with the proximal end of the tail to stabilize the completed tail and form the functional
  connector interface with the capsid portal-neck complex (gpB, gpW, and gpFII), enabling productive virion assembly and DNA
  delivery.
