suggested_questions:
- question: >-
    What specific mammalian epithelial surface receptor or extracellular matrix ligand
    is recognized by the extracellular loops of the Lom outer membrane beta-barrel?
suggested_experiments:
- description: >-
    Solve the crystal or cryo-EM structure of Lom reconstituted in lipid nanodiscs
    and screen extracellular loop mutants for adhesion to human intestinal epithelial
    monolayers.
  hypothesis: >-
    Exposed extracellular loops of the eight-stranded Lom beta-barrel directly engage
    host cell-surface glycoconjugates or integrins to promote enterobacterial colonization.
