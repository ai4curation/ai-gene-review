id: P03701
gene_symbol: lom
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:2681611
  label: Escherichia phage Lambda
description: >-
  Lysogenic conversion outer membrane protein (Lom) of Escherichia phage lambda that
  is expressed by the integrated prophage during lysogeny in Escherichia coli and
  incorporated into the bacterial host outer membrane. Belonging to the OmpX/PagC/Ail
  family of outer membrane beta-barrel virulence proteins, Lom modifies the host cell
  envelope and contributes to adhesion of lysogenic E. coli to mammalian epithelial
  cells.
existing_annotations:
- term:
    id: GO:0020002
    label: host cell plasma membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  supporting_entities:
  - UniProtKB-SubCell:SL-0376
  review:
    summary: >-
      Lom is an outer membrane beta-barrel protein incorporated specifically into
      the Escherichia coli outer membrane rather than the inner plasma membrane, so
      this annotation should be replaced by GO:0044384 (host outer membrane).
    action: MODIFY
    reason: >-
      Experimental fractionation and sequence homology to enterobacterial outer membrane
      beta-barrel virulence proteins establish that Lom is localized to the bacterial
      host outer membrane [PMID:2144037]. Therefore, GO:0020002 (host cell plasma
      membrane) is modified to the already-annotated specific compartment GO:0044384
      (host outer membrane).
    proposed_replacement_terms:
    - id: GO:0044384
      label: host outer membrane
    supported_by:
    - reference_id: PMID:2144037
      supporting_text: >-
        Here we report that these 'accessory' sequences contain two genes which are
        expressed during lysogeny, and encode host-cell envelope proteins. One of
        these is lom, the product of which is found in the bacterial outer membrane,
        and is homologous to virulence proteins of two other enterobacterial genera.
