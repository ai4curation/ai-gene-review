suggested_questions:
- question: >-
    How does the release of qut DNA by lambda Q upon promoter clearance trigger the conformational
    rearrangement that locks the Q torus around the RNA exit channel?
suggested_experiments:
- description: >-
    Single-molecule magnetic tweezers and FRET assays monitoring the transition of the Q-bound
    +16/+17 paused complex into productive elongation upon NTP addition, comparing wild-type Q
    and zinc-arm hinge mutants.
  hypothesis: >-
    Flexion at the Zn2+-stabilized arm base allows the N-terminal torus domain to transfer from
    the qut DNA element to the RNAP beta-flap/dock rim as nascent RNA extends past +17.
