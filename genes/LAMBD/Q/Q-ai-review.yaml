- id: PMID:18832144
  title: >-
    The bacteriophage lambda Q antiterminator protein contacts the beta-flap domain of RNA
    polymerase.
  findings:
  - statement: >-
      Lambda Q contacts the beta-flap domain of RNA polymerase, competing with sigma70 region 4,
      to render RNAP resistant to pausing and downstream termination signals.
    supporting_text: >-
      Here, we provide an explanation for this requirement by showing that lambdaQ establishes
      direct contact with the beta-flap during the engagement process, thus competing with
      sigma(70) region 4 for access to the beta-flap.
- id: PMID:24440517
  title: >-
    Structure of the DNA-binding and RNA-polymerase-binding region of transcription
    antitermination factor λQ.
  findings:
  - statement: >-
      X-ray crystal structure of lambda Q (residues 62-207) reveals a helix-turn-helix DNA-binding
      fold and an arm stabilized by a zinc ion coordinated by Cys118, Cys121, Cys144, and Cys147.
    supporting_text: >-
      There is also a zinc ion bound at the base of the arm, coordinated by four cysteine
      residues (Cys118, Cys121, Cys144 and Cys147), which may be important for the structural
      integrity and/or flexibility of this arm.
- id: PMID:32313022
  title: >-
    NusA directly interacts with antitermination factor Q from phage λ.
  findings:
  - statement: >-
      Host transcription factor NusA directly binds lambda Q via its N-terminal domain and AR2
      domain, releasing NusA autoinhibition to enhance antitermination.
    supporting_text: >-
      We also provide evidence that multidomain protein NusA interacts directly with λQ via its
      N-terminal domain (NTD) and the acidic repeat (AR) 2 domain, with the λQ:NusA-AR2
      interaction being able to release NusA autoinhibition.
core_functions:
- description: >-
    Binds the qut DNA site at the late promoter PR' and engages the paused RNA polymerase
    beta-flap and host NusA to remodel the RNA exit channel and mediate transcription
    antitermination across the late viral operon.
