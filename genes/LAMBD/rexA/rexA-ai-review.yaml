id: P68924
gene_symbol: rexA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:2681611
  label: Escherichia phage lambda
description: >-
  Cytoplasmic sensor and activator component (279 amino acids) of the two-component RexAB
  superinfection exclusion (abortive infection) system expressed from the lysogenic promoter PRM
  in Escherichia phage lambda prophages. Upon infection of a lambda lysogen by heterologous
  bacteriophages (such as T4 rII mutants) or when overexpressed relative to RexB, RexA is
  activated and interacts at a stoichiometry of at least two RexA subunits with the prophage
  inner-membrane protein RexB to trigger opening of the RexB ion channel pore. The resulting
  depolarization of the Escherichia coli cytoplasmic membrane causes a rapid loss of proton
  motive force and intracellular ATP, halting macromolecular synthesis and inducing cellular
  growth arrest or altruistic death that aborts lytic propagation of the superinfecting virus.
existing_annotations: []
references:
- id: PMID:1372278
  title: >-
    The Rex system of bacteriophage lambda: tolerance and altruistic cell death.
  full_text_unavailable: true
  findings:
  - statement: >-
      The lambda rexA and rexB genes encode a two-component system expressed in lysogens that
      aborts lytic growth of superinfecting bacteriophages by depolarizing the host cytoplasmic
      membrane.
    supporting_text: >-
      The rexA and rexB genes of bacteriophage lambda encode a two-component system that aborts
      lytic growth of bacterial viruses.
- id: PMID:2530135
  title: >-
    The rex genes of bacteriophage lambda can inhibit cell function without phage superinfection.
  full_text_unavailable: true
  findings:
  - statement: >-
      Induction of rexA in the presence of limiting rexB causes an immediate cessation of cell
      growth, halt of macromolecular synthesis and amino acid transport, and drop in
      intracellular ATP levels.
    supporting_text: >-
      However, induction of rexA in the presence of limiting rexB activity caused an immediate
      cessation of cell growth. All macromolecular synthesis abruptly ceased and amino acid
      transport was severely inhibited. Intracellular levels of adenosine 5'-triphosphate also
      dropped.
- id: PMID:6221115
  title: Nucleotide sequence of bacteriophage lambda DNA.
  full_text_unavailable: true
  findings: []
- id: PMID:11790759
  title: Rex-centric mutualism.
  findings:
  - statement: >-
      Direct interaction of at least two cytoplasmic RexA proteins with the inner-membrane RexB
      protein opens the RexB pore, channeling lysogenic cells into a protective growth-arrested
      state that aborts superinfecting phage replication.
    supporting_text: >-
      The model of Parma et al. ( 13 ) predicts that RexB protein forms an inner membrane pore
      that is opened upon direct interaction with at least two RexA proteins
core_functions:
- description: >-
    Senses superinfecting phage replication intermediates in the host cytoplasm and directly
    binds the inner-membrane pore protein RexB to open the channel, collapsing membrane potential
    and ATP levels to abort lytic growth of superinfecting phages.
  supported_by:
  - reference_id: PMID:11790759
    supporting_text: >-
      The model of Parma et al. ( 13 ) predicts that RexB protein forms an inner membrane pore
      that is opened upon direct interaction with at least two RexA proteins
  - reference_id: PMID:2530135
    supporting_text: >-
      The rexA and rexB genes of bacteriophage lambda are expressed from the prophage and cause
      the exclusion of many superinfecting mutant phages.
suggested_questions:
- question: >-
    What is the exact molecular identity of the phage replication or recombination intermediate
    recognized by cytoplasmic RexA during T4 rII superinfection?
suggested_experiments:
- description: >-
    Affinity purification of epitope-tagged RexA from lambda lysogens shortly after infection
    with T4 rII mutant phage, coupled with mass spectrometry and deep sequencing of co-purifying
    nucleic acids.
  hypothesis: >-
    RexA binds branched single-stranded/double-stranded DNA recombination intermediates
    complexed with phage single-stranded DNA-binding proteins, inducing a conformational change
    that exposes its RexB-binding interface.
