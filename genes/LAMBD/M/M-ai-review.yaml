  title: Structural basis of bacteriophage Ur-lambda infection initiation.
  findings:
  - statement: Cryo-EM of the free Ur-lambda tail tip complex resolves the distal tail protein gpM together with gpV and gpJ at 3.37-Å resolution.
    supporting_text: The overall cryo-EM structure of the free Ur-λ tail tip complex, determined at overall resolution 3.37 Å using C3 symmetry (Fig. 2A), reveals the tail tube protein gpV, distal tail protein gpM, and central fiber protein gpJ (residues 1 to 807).
