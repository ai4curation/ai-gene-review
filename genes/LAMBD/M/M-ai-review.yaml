suggested_questions:
- question: How does the C6-symmetric gpM hexamer recognize and dock onto the C3-symmetric gpL-gpI-gpHC hub only after the
    tape measure protein gpH and chaperones gpG/gpGT have engaged the 15S precursor?
suggested_experiments:
- description: Determine the cryo-EM structure of the 15S precursor (gpJ-gpI-gpL-gpK) and compare it to the 25S initiator
    complex (after addition of gpM, gpH, and gpG/gpGT) to visualize the conformational switch that licenses gpM ring assembly
    and subsequent gpV polymerization.
  hypothesis: Engagement of the C-terminus of gpH with the gpI/gpL hub induces a pseudo-hexameric surface on the C3 gpL trimer
    that templates hexamerization of gpM.
