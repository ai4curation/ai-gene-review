taxon:
  id: NCBITaxon:2681611
  label: Escherichia phage Lambda
description: Distal tail protein gpM is a structural component of the bacteriophage lambda tail tip complex that forms a C6-symmetric
  homohexameric adaptor ring bridging the C3-symmetric tail tip hub (gpL and gpI) and the first hexameric ring of the major
  tail tube protein (gpV). During tail morphogenesis, gpM cooperates with the tape measure protein (gpH) and chaperones (gpG/gpGT)
  to convert the 15S tail tip precursor into the 25S initiator complex that nucleates gpV tail tube polymerization, and in
  the mature virion its central pore forms part of the continuous channel for gpH* and viral DNA ejection.
