- description: Distal tail protein that forms a C6-symmetric homohexameric ring at the top of the tail tip complex, converting
    the 15S tail tip precursor into the 25S initiator to nucleate gpV tail tube polymerization and forming the adaptor conduit
    between the tail tube and tail tip hub for viral genome ejection.
