id: P68660
gene_symbol: W
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:2681611
  label: Escherichia phage lambda
description: >-
  Head-to-tail joining adaptor protein (gpW) of Escherichia phage lambda that polymerizes
  as a hexameric ring onto the dodecameric portal vertex (gpB) immediately after viral
  DNA genome packaging. By forming the middle ring of the head-tail connector between
  gpB and gpFII, gpW stabilizes the packaged dsDNA chromosome within the mature capsid
  head to prevent DNA release and provides the structural binding surface required
  for gpFII incorporation and subsequent tail attachment.
existing_annotations:
- term:
    id: GO:0019058
    label: viral life cycle
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  review:
    summary: >-
      The broad InterPro2GO mapping to viral life cycle is true but overly general;
      gpW specifically mediates late head completion and head-tail connector assembly.
    action: MODIFY
    reason: >-
      Biochemical, structural, and genetic studies show that six copies of gpW assemble
      onto the portal vertex (gpB) after DNA packaging to stabilize the packaged genome
      within the head and create the binding site for gpFII prior to tail attachment
      [PMID:14569303, PMID:20660769]. The broad term GO:0019058 (viral life cycle)
      is therefore refined to its specific descendant GO:0019069 (viral capsid assembly).
    proposed_replacement_terms:
    - id: GO:0019069
      label: viral capsid assembly
    supported_by:
    - reference_id: PMID:14569303
      supporting_text: >-
        The stage at which gpW functions and other circumstantial evidence support
        the idea that six molecules of gpW polymerize on the connector before the
        incorporation of six molecules of gpFII and before the tail attaches.
    - reference_id: PMID:20660769
      supporting_text: >-
        Another protein, gpW, is required for the stabilization of the DNA within
        the head and for the addition of gpFII ( 6 , 7 ), suggesting that it may be
        positioned in the connector between gpB and gpFII.
core_functions:
- description: >-
    Forms the hexameric middle ring of the head-tail connector on the capsid portal
    vertex (between gpB and gpFII) after genome packaging, stabilizing the packaged
    dsDNA within the capsid head and enabling gpFII addition and tail attachment.
  directly_involved_in:
  - id: GO:0019069
    label: viral capsid assembly
  supported_by:
  - reference_id: PMID:14569303
    supporting_text: >-
      The product of W (gpW) acts after DNA packaging, but before the addition of
      another phage product, gene product FII, and before the addition of tails.
  - reference_id: PMID:20660769
    supporting_text: >-
      These data strongly support the conclusion that gpW forms the middle ring of
      the λ connector and that gpFII likely interacts with gpW in this region of the
      phage.
references:
- id: GO_REF:0000002
  title: Gene Ontology annotation through association of InterPro records with GO
    terms.
  findings: []
- id: PMID:14569303
  title: 'The product of the bacteriophage lambda W gene: purification and properties.'
  findings:
  - statement: >-
      NMR structure and mutagenesis of gpW show that it acts after DNA packaging to
      stabilize DNA in the head and polymerizes on the portal connector prior to gpFII
      incorporation and tail attachment.
    supporting_text: >-
      The product of W (gpW) acts after DNA packaging, but before the addition of
      another phage product, gene product FII, and before the addition of tails.
  - statement: >-
      Six copies of gpW assemble on the portal connector prior to addition of six
      copies of gpFII.
    supporting_text: >-
      The stage at which gpW functions and other circumstantial evidence support the
      idea that six molecules of gpW polymerize on the connector before the incorporation
      of six molecules of gpFII and before the tail attaches.
- id: PMID:20660769
  title: Phages have adapted the same protein fold to fulfill multiple functions in
    virion assembly.
  findings:
  - statement: >-
      gpW forms the middle ring of the lambda head-tail connector between the portal
      ring (gpB) and gpFII, stabilizing packaged DNA and recruiting gpFII.
    supporting_text: >-
      Another protein, gpW, is required for the stabilization of the DNA within the
      head and for the addition of gpFII ( 6 , 7 ), suggesting that it may be positioned
      in the connector between gpB and gpFII.
  - statement: >-
      Mutational and structural analyses confirm that gpW forms the middle ring of
      the lambda connector and interacts with gpFII.
    supporting_text: >-
      These data strongly support the conclusion that gpW forms the middle ring of
      the λ connector and that gpFII likely interacts with gpW in this region of the
      phage.
- id: file:LAMBD/W/W-uniprot.txt
  title: UniProtKB record for W (P68660)
  findings:
  - statement: >-
      gpW stabilizes packaged DNA within the virion head at the portal vertex and
      enables gpFII binding.
    supporting_text: >-
      Plays a role in morphogenesis of the virion head after genome packaging. Presumably
      interacts with the portal vertex to stabilize the packaged DNA within the head
      after packaging. Probably binds to the head-tail connector protein FII.
suggested_questions:
- question: >-
    How does the C-terminal Leu-Pro-Met-Leu-Arg motif of gpW mechanically gate or
    plug the portal channel after DNA packaging, and how is this plug opened upon
    tail-triggered DNA ejection?
suggested_experiments:
- description: >-
    Determine the high-resolution cryo-EM structure of the complete lambda neck complex
    (gpB12-gpW6-gpFII6-tail) before and after host LamB receptor-triggered DNA ejection.
  hypothesis: >-
    The C-terminal tails of the gpW hexamer project into the portal lumen to arrest
    DNA slippage and retract radially when gpFII and the tail tube engage and trigger
    genome ejection.
