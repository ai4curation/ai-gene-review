- id: PMID:10993723
  title: 'ATPase center of bacteriophage lambda terminase involved in post-cleavage
    stages of DNA packaging: identification of ATP-interactive amino acids.'
  findings:
  - statement: >-
      Residues Y46 and K84 form part of the high-affinity ATPase center in the N-terminal
      domain of gpA that powers post-cos-cleavage stages of lambda DNA packaging.
    supporting_text: >-
      In summary, the results indicate that Y(46) and K(84) are part of the high-affinity
      ATPase center of gpA, and show that this ATPase activity is involved in the
      post-cos cleavage stages of lambda DNA packaging.
- id: PMID:11866517
  title: The large subunit of bacteriophage lambda's terminase plays a role in DNA
    translocation and packaging termination.
  findings:
  - statement: >-
      gpA contains separate functional domains for early cos cleavage and late ATP-driven
      DNA translocation.
    supporting_text: >-
      These results indicate that gpA is actively involved in late stages of packaging,
      including DNA translocation, and that this enzyme contains separate functional
      domains for its early and late packaging activities.
- id: PMID:1534952
  title: Mutations abolishing the endonuclease activity of bacteriophage lambda terminase
    lie in two distinct regions of the A gene, one of which may encode a "leucine
    zipper" DNA-binding domain.
  findings:
  - statement: >-
      Mutations in the C-terminal region of gpA abolish cosN endonuclease activity
      without affecting packaging of pre-cut monomeric mature lambda DNA.
    supporting_text: >-
      The enzyme catalyzes the endonucleolytic cleavage of lambda DNA at a site known
      as cosN and mediates packaging of the phage DNA into empty heads. This work
      describes the characterization of mutations within the A gene which lead to
      the loss of terminase endonuclease activity without affecting the ability of
      the enzyme to package monomeric mature (cut) lambda DNA.
- id: PMID:17870092
  title: The DNA maturation domain of gpA, the DNA packaging motor protein of bacteriophage
    lambda, contains an ATPase site associated with endonuclease activity.
  findings:
  - statement: >-
      The N-terminally truncated construct gpA-DeltaN179 encompasses the folded, soluble
      DNA maturation domain that retains ATP-dependent cosN nuclease activity.
    supporting_text: >-
      Biochemical characterization of gpA-DeltaN179, a construct in which the N-terminal
      179 residues of gpA have been deleted, indicates that this protein encompasses
      the DNA maturation domain of gpA. The construct is folded, soluble and possesses
      an ATP-dependent nuclease activity.
- id: PMID:23134123
  title: The enzymology of a viral genome packaging motor is influenced by the assembly
    state of the motor subunits.
  findings:
  - statement: >-
      gpA (TerL) introduces symmetric nicks at cosN and catalyzes strand separation
      of the nicked 12-base cohesive ends.
    supporting_text: >-
      The endonuclease activity of TerL introduces symmetric nicks into the duplex
      at the cosN sub-site (Figure 1B). Subsequent separation of the nicked duplex,
      catalyzed by the so-called helicase activity of TerL, affords the mature, 12-base
      single-stranded mature left end of the genome (DL) tightly bound by the enzyme.
- id: PMID:2965251
  title: Bacteriophage lambda DNA packaging. The product of the FI gene promotes the
    incorporation of the prohead to the DNA-terminase complex.
  findings:
  - statement: >-
      Terminase binds lambda DNA to form complex I and subsequently recruits proheads
      to form ternary complex II during genome packaging.
    supporting_text: >-
      In a first step, lambda DNA interacts with terminase to form a DNA-enzyme complex,
      called complex I. Upon addition of proheads, in a second step, a ternary complex,
      complex II, containing DNA, terminase and the prohead is formed.
- id: PMID:2970303
  title: 'Mechanism of cos DNA cleavage by bacteriophage lambda terminase: multiple
    roles of ATP.'
  findings:
  - statement: >-
      Lambda terminase catalyzes staggered nicking within the cosN sub-site.
    supporting_text: >-
      In the terminus-generating (ter) reaction of phage lambda, the phage enzyme
      terminase catalyzes the production of staggered nicks within the cohesive-end
      nicking site (cosN).
- id: PMID:30541105
  title: "Evidence that a catalytic glutamate and an 'Arginine Toggle'\u00a0act in\
    \ concert to mediate ATP hydrolysis and mechanochemical coupling in a viral DNA\
    \ packaging motor."
  findings:
  - statement: >-
      Glu179 is the catalytic carboxylate in the gpA packaging ATPase active site
      and acts with Arg101 to couple ATP hydrolysis to DNA translocation.
    supporting_text: >-
      Here we demonstrate that Glu179 serves as the catalytic carboxylate in bacteriophage
      λ terminase and probe its mechanistic role. All changes of Glu179 are lethal:
      non-conservative changes abrogate ATP hydrolysis and DNA translocation, while
      the conservative E179D change attenuates ATP hydrolysis and alters single molecule
      translocation dynamics, consistent with a slowed chemical hydrolysis step.
- id: PMID:7813453
  title: The lambda terminase enzyme measures the point of its endonucleolytic attack
    47 +/- 2 bp away from its site of specific DNA binding, the R site.
  findings:
  - statement: >-
      Review of lambda terminase structure and function as a heterooligomeric, ATP-regulated
      site-specific cos endonuclease and DNA packaging motor.
    supporting_text: >-
      lambda terminase is an ATP-interactive, site-specific endonuclease comprising
      the products of lambda genes Nu1 and A. Terminase binds to cos, at the junction
      of two chromosomes in a concatemer, catalyzes cos cleavage and initiates the
      packaging of lambda DNA into proheads.
- id: PMID:8175794
  title: The in vitro ATPases of bacteriophage lambda terminase and its large subunit,
    gene product A. The relationship with their DNA helicase and packaging activities.
  findings:
  - statement: >-
      Purified gpA exhibits intrinsic ATPase and strand-separation (helicase) activities
      comparable to the terminase holoenzyme.
    supporting_text: >-
      In vitro, the holoenzyme is a site-specific endonuclease, helicase, ATPase,
      and can package lambda DNA into proheads. gpA possesses ATPase and helicase
      activities which are similar to those of the holoenzyme.
- id: PMID:8428984
  title: Physical and kinetic characterization of the DNA packaging enzyme from bacteriophage
    lambda.
  findings:
  - statement: >-
      The terminase reaction strictly requires a divalent metal cation (Mg2+ or Mn2+).
    supporting_text: >-
      Divalent metal ion is strictly required for the reaction and may be satisfied
      by either magnesium or manganese, but not by any of the other metals examined.
- id: PMID:8794874
  title: Mutations affecting the high affinity ATPase center of gpA, the large subunit
    of bacteriophage lambda terminase, inactivate the endonuclease activity of terminase.
  findings:
  - statement: >-
      Mutations in a P-loop-like motif near residue 490 in the C-terminal region of
      gpA impair ATP-stimulated cosN endonuclease activity.
    supporting_text: >-
      The ATP-stimulated endonuclease activity of terminase is located in gpA, the
      large terminase subunit. There is a high affinity ATPase center in gpA, and
      a match to the conserved P-loop of known ATPases is found starting near residue
      490.
- id: file:LAMBD/A/A-uniprot.txt
  title: UniProtKB record for A (P03708)
  findings:
  - statement: >-
      Summary of gpA roles as the ATP-driven DNA translocation motor and cosN endonuclease
      of phage lambda.
    record_section: ["CC:FUNCTION"]
    supporting_text: >-
      The terminase large subunit acts as an ATP driven molecular motor necessary
      for viral DNA translocation into empty capsids and as an endonuclease that cuts
      the viral genome from the concetamer to initiate and to end the packaging reaction
      (PubMed:11866517, PubMed:23134123).
suggested_questions:
- question: >-
    How does the packaged DNA headful signal at the portal vertex trigger the switch
    of the translocating gpA motor back into a site-specific cosN endonuclease at
    the downstream cos site to terminate packaging?
suggested_experiments:
- description: >-
    Perform cryo-EM reconstruction of the active lambda terminase-procapsid packaging
    complex stalled mid-translocation and at the downstream cos termination site.
  hypothesis: >-
    Portal-ring conformational changes at 100% headful density allosterically inhibit
    the N-terminal translocation ATPase of gpA and re-engage the C-terminal nuclease
    domain on the downstream cosN duplex.
