    action: ACCEPT
    reason: >-
      In vitro assays of purified gpA and the terminase holoenzyme demonstrate that
      gpA catalyzes ATP-dependent separation of the nicked cosN duplex to generate
      the mature 12-base single-stranded cohesive ends [PMID:8175794, PMID:23134123].
