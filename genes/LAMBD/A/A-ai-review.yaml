    id: GO:0046872
    label: metal ion binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  review:
    summary: >-
      gpA requires divalent magnesium (or manganese) cations as cofactors for both
      ATP hydrolysis and cosN endonuclease cleavage, so metal ion binding should be
      refined to magnesium ion binding.
    action: MODIFY
    reason: >-
      Biochemical characterization of the terminase reaction shows a strict requirement
      for $\mathrm{Mg^{2+}}$ (or $\mathrm{Mn^{2+}}$) as the physiological divalent
      metal cofactor [PMID:8428984]. Therefore, the general GO:0046872 (metal ion
      binding) annotation is refined to GO:0000287 (magnesium ion binding).
    proposed_replacement_terms:
    - id: GO:0000287
      label: magnesium ion binding
    supported_by:
    - reference_id: PMID:8428984
      supporting_text: >-
        Divalent metal ion is strictly required for the reaction and may be satisfied
        by either magnesium or manganese, but not by any of the other metals examined.
