        activities which are similar to those of the holoenzyme.
    - reference_id: PMID:23134123
      supporting_text: >-
        Subsequent separation of the nicked duplex, catalyzed by the so-called helicase
        activity of TerL, affords the mature, 12-base single-stranded mature left
        end of the genome (DL) tightly bound by the enzyme.
