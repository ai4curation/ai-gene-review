id: P03708
gene_symbol: A
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:2681611
  label: Escherichia phage lambda
description: >-
  Terminase large subunit (gpA) of Escherichia phage lambda that serves as the catalytic
  endonuclease and ATP-driven DNA translocation motor of the viral terminase holoenzyme.
  Its C-terminal maturation domain catalyzes divalent-cation-dependent, site-specific
  staggered nicking at the cosN sub-site of concatemeric phage DNA, while its N-terminal
  motor domain houses a high-affinity ATPase center and strand-separation activity
  that unwinds the nicked 12-base cohesive ends and powers rapid translocation of
  unit-length viral dsDNA into the procapsid through the portal vertex.
