suggested_questions:
- question: Is the predicted ORF64 open reading frame translated into a stable polypeptide during the lytic or lysogenic cycle of bacteriophage lambda?
suggested_experiments:
- description: Analyze ribosome profiling (Ribo-seq) and deep proteomic mass spectrometry datasets of Escherichia coli cells across a time course of bacteriophage lambda prophage induction and lytic infection to test for translation and peptide accumulation from ORF64.
  hypothesis: ORF64 is either a non-coding or incidental reading frame within the phage genome or encodes a small accessory peptide expressed transiently during infection.
