id: P03767
gene_symbol: ninD
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:2681611
  label: Escherichia phage Lambda
description: Uncharacterized 57-amino-acid (6.8 kDa) early protein encoded in the
  translationally coupled ninR region of the bacteriophage lambda pR operon between
  ninC and ninE. Founding member of the conserved lambdoid NinD domain family (Pfam:PF17466,
  InterPro:IPR035346) with 14 binary protein-protein interactions recorded in IntAct,
  although its molecular function and physiological role during phage infection remain
  experimentally uncharacterized.
existing_annotations: []
core_functions:
- description: Uncharacterized early ninR-region protein (57 aa, NinD family PF17466) encoded in the pR operon with no experimentally established molecular function or biological process.
  supported_by:
  - reference_id: file:LAMBD/ninD/ninD-uniprot.txt
    record_section: ["DR:Pfam"]
    supporting_text: 'DR   Pfam; PF17466; NinD; 1.'
references:
- id: file:LAMBD/ninD/ninD-uniprot.txt
  title: UniProtKB entry P03767 (NIND_LAMBD)
  findings:
  - statement: NinD is a 57-residue protein encoded in the ninR region of phage lambda,
      classified in the NinD domain family (PF17466, IPR035346) with 14 recorded interactions
      in IntAct.
    record_section: ["DR:Pfam"]
    supporting_text: 'DR   Pfam; PF17466; NinD; 1.'
suggested_questions:
- question: Which of the 14 binary interactors recorded for NinD in IntAct (P03767)
    represent physiologically relevant host or phage complexes in Escherichia coli
    during early pR transcription?
- question: Does NinD cooperate with neighboring ninR recombination or replication
    accessory proteins (Orf/NinB, Rap/NinG) or modulate host cell physiology?
suggested_experiments:
- description: Perform affinity purification-mass spectrometry (AP-MS) of epitope-tagged
    NinD expressed during bacteriophage lambda infection of Escherichia coli to validate
    its in vivo interaction partners among the 14 IntAct candidates.
- description: Construct a clean single-gene ninD nonsense or deletion mutant (preserving
    translational coupling of downstream ninE) and assay phage burst size, recombination
    frequency, and plating efficiency across diverse Escherichia coli host backgrounds.
