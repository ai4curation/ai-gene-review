  label: Escherichia phage Lambda
description: Putative 525-amino-acid (59.5 kDa) AAA+ ATPase encoded in the nonessential
  b2 region of bacteriophage lambda adjacent to ea31. Contains a P-loop nucleoside
  triphosphate hydrolase and AAA+ ATPase core domain (InterPro:IPR003959, Pfam:PF13304)
  and belongs to the bacterial antiviral defense nuclease / excinuclease ATPase subunit
  family (InterPro:IPR051396, PANTHER:PTHR43581:SF2), supporting ATP binding and ATP
  hydrolysis activity, potentially in conjunction with neighboring b2-region proteins.
