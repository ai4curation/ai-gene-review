suggested_questions:
- question: Does Ea59 form an ATP-regulated nuclease complex with the adjacent HNH
    endonuclease-domain protein Ea31, analogous to two-component OLD/Septu-like ATPase-nuclease
    defense systems?
- question: Is the ATPase activity of Ea59 stimulated by double-stranded DNA, single-stranded
    DNA, or specific phage replication intermediates?
suggested_experiments:
- description: Purify recombinant Ea59 (wild-type and Walker A/B active-site mutants)
    to measure basal and DNA-stimulated ATP hydrolysis kinetics in vitro.
- description: Co-express Ea59 and Ea31 in Escherichia coli and perform size-exclusion
    chromatography and nuclease assays in the presence and absence of ATP to test
    for ATP-regulated complex assembly and DNA cleavage.
