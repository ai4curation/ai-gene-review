core_functions:
- description: Essential cytoplasmic tail assembly factor containing MPN and NlpC/P60 peptidase domains that acts with gpJ, gpI, and gpL to assemble the 15S tail tip precursor complex required to initiate bacteriophage lambda tail morphogenesis.
