id: P03729
gene_symbol: K
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:2681611
  label: Escherichia phage Lambda
description: Tail assembly protein gpK is an essential morphogenetic factor required in the bacterial host cytoplasm for assembly of the 15S distal tail tip precursor complex alongside gpJ, gpI, and gpL. Harboring N-terminal MPN (metallopeptidase-like) and C-terminal NlpC/P60 (cysteine peptidase-like) domains, gpK is required to convert the early tail tip components into an assembly-competent precursor for tail shaft polymerization, but is absent or unresolved in the mature bacteriophage lambda tail tip complex.
