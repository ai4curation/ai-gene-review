suggested_questions:
- question: Why is gpK absent from the cryo-EM structure of the mature bacteriophage lambda tail tip complex despite being strictly required to form the 15S tail tip precursor—does gpK function as the maturation protease that cleaves the tape measure protein gpH into gpH* and gpHC and then dissociate?
suggested_experiments:
- description: Track epitope-tagged gpK across sucrose gradient sedimentation fractions (15S precursor, 25S initiator, completed free tails, and mature virions) by quantitative Western blotting and mass spectrometry, and test whether active-site mutations in the MPN and NlpC/P60 domains block gpH cleavage.
  hypothesis: gpK associates transiently with the 15S/25S tail tip assembly intermediates to catalyze proteolytic processing or structural licensing of the gpI-gpL-gpH junction and is released prior to mature virion completion.
