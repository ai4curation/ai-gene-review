- term:
    id: GO:0045861
    label: negative regulation of proteolysis
  evidence_type: IDA
  original_reference_id: PMID:20734329
  qualifier: involved_in
  review:
    summary: In PMID:20734329, heterodimerization of Rz1 with Rz folds the C-terminal
      periplasmic domain of Rz and sterically shields it from degradation by endogenous
      periplasmic proteases; Rz1 does not function as a regulator of proteolysis.
    action: REMOVE
    reason: Over-annotation of a structural complex-assembly effect. Rz1 is the outer
      membrane subunit of the Rz-Rz1 spanin complex, not a protease inhibitor or regulator
      of proteolytic pathways; protection of its binding partner Rz from periplasmic
      proteolysis is a consequence of quaternary complex formation and disorder-to-helix
      folding.
    supported_by:
    - reference_id: PMID:20734329
      supporting_text: The results indicate that in vivo , Rz1 protects the C-terminal
        domain of Rz from proteolysis by forming a complex that spans the entire periplasm
