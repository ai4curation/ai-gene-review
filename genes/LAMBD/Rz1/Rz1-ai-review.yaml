- id: PMID:20734329
  title: The lambda spanin components Rz and Rz1 undergo tertiary and quaternary rearrangements
    upon complex formation.
  findings:
  - statement: Equimolar mixing of the soluble periplasmic domains of Rz and Rz1 induces
      an unstructured-to-helical conformational rearrangement, and Rz1 binding stabilizes
      Rz against periplasmic proteolysis in vivo.
    supporting_text: The results indicate that in vivo , Rz1 protects the C-terminal
      domain of Rz from proteolysis by forming a complex that spans the entire periplasm
      through the meshwork of the intact PG.
- id: PMID:22904283
  title: The spanin complex is essential for lambda lysis.
  findings:
  - statement: Rz1 is unconditionally required for outer membrane rupture during bacteriophage
      lambda host lysis.
    supporting_text: In both cases, lysis failed to occur in inductions of isogenic
      prophages carrying null mutations in the spanin genes. In both systems, instead
      of an envelope rupture, the induced cells were converted from a rod shape to
      a spherical form.
- id: PMID:23387988
  title: Spanin function requires subunit homodimerization through intermolecular
    disulfide bonds.
  findings:
  - statement: Mature Rz1 is an outer membrane lipoprotein with 25% proline content
      that forms a covalent homodimer via an intermolecular disulfide bond at Cys-29.
    supporting_text: Rz, the inner membrane or i-spanin, has a largely alpha-helical
      periplasmic domain, whereas Rz1, the outer membrane or o-spanin, has a 25% proline
      content with no predicted secondary structure.
- id: PMID:25870259
  title: Membrane fusion during phage lysis.
  findings:
  - statement: The lambda Rz-Rz1 spanin complex mediates fusion of the Escherichia
      coli inner and outer membranes as the terminal step of phage lysis.
    supporting_text: Here we show that the spanins of the paradigm coliphage lambda
      mediate efficient membrane fusion. This supports the notion that the last step
      of lysis is the fusion of the IM and OM.
- id: PMID:28040784
  title: 'Genetic Analysis of the Lambda Spanins Rz and Rz1: Identification of Functional
    Domains.'
  findings:
  - statement: Genetic dissection of Rz and Rz1 defines the C-terminal interaction
      determinants and central proline-rich region of Rz1 required for outer membrane
      disruption.
    supporting_text: Coliphage lambda proteins Rz and Rz1 are the inner membrane
      and outer membrane subunits of the spanin complex-a heterotetramer that bridges
      the periplasm and is essential for the disruption of the outer membrane during
      phage lysis.
- id: PMID:8626053
  title: The Rz1 gene product of bacteriophage lambda is a lipoprotein localized in
    the outer membrane of Escherichia coli.
  findings:
  - statement: Rz1 is processed by signal peptidase II into a lipoprotein that localizes
      almost exclusively to the Escherichia coli outer membrane.
    supporting_text: In induced Escherichia coli lambda lysogens Rz1 was found almost
      exclusively in the outer membrane (OM).
suggested_questions:
- question: How does the central polyproline motif of mature Rz1 promote outer membrane
    curvature or lipid bilayer destabilization during the post-peptidoglycan-cleavage
    fusion step?
- question: What is the structural basis by which a single covalent disulfide bond
    in either the Rz homodimer or the Rz1 homodimer suffices to support spanin-mediated
    membrane fusion?
suggested_experiments:
- description: Use solution NMR and EPR spectroscopy of lipid-anchored Rz1 in outer-membrane-mimetic
    nanodiscs to determine how the proline-rich region interacts with the phospholipid
    headgroups before and after sRz binding.
- description: Perform site-specific photo-cross-linking across the C-terminal residues
    of Rz1 (residues 50-60) in vivo to map the exact contact residues on Rz CC2.
