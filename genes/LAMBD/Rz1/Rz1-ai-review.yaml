core_functions:
- description: Serves as the outer membrane lipoprotein subunit (o-spanin) of the
    periplasm-spanning Rz-Rz1 spanin complex and mediates fusion of the Escherichia
    coli inner and outer membranes after peptidoglycan degradation by endolysin R,
    disrupting the host outer membrane to complete cytolytic viral release.
  directly_involved_in:
  - id: GO:0090680
    label: viral release via disruption of host outer membrane
  - id: GO:0061025
    label: membrane fusion
  - id: GO:0044659
    label: viral release from host cell by cytolysis
  locations:
  - id: GO:0039662
    label: host cell outer membrane
  supported_by:
  - reference_id: PMID:8626053
    supporting_text: In induced Escherichia coli lambda lysogens Rz1 was found almost
      exclusively in the outer membrane (OM).
  - reference_id: PMID:22904283
    supporting_text: A model is proposed in which the spanins carry out the essential
      step of disrupting the outer membrane, in a manner regulated by the state of
      the peptidoglycan layer.
  - reference_id: PMID:25870259
    supporting_text: Here we show that the spanins of the paradigm coliphage lambda
      mediate efficient membrane fusion. This supports the notion that the last step
      of lysis is the fusion of the IM and OM.
