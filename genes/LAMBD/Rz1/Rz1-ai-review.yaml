id: Q37935
gene_symbol: Rz1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:2681611
  label: Escherichia phage Lambda
description: Outer membrane lipoprotein spanin subunit (o-spanin) encoded entirely
  within the +1 reading frame of the Rz gene. Following cleavage of its 19-residue
  signal peptide by signal peptidase II and lipid modification at Cys-20, the mature
  40-residue proline-rich Rz1 lipoprotein is anchored to the inner leaflet of the
  Escherichia coli outer membrane, where it forms a disulfide-linked homodimer via
  Cys-29 and binds the C-terminal periplasmic domain of the inner membrane subunit
  Rz (i-spanin). Once endolysin R degrades the periplasmic peptidoglycan meshwork,
  the periplasm-spanning Rz-Rz1 complex oligomerizes and mediates fusion of the inner
  and outer membranes, rupturing the host outer membrane for progeny phage release.
