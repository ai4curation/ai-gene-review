core_functions:
- description: >-
    Integrates into the host cell inner membrane in lambda lysogens and aborts lytic development
    of superinfecting susceptible bacteriophages, mediating superinfection exclusion.
  locations:
  - id: GO:0033644
    label: host cell membrane
  supported_by:
