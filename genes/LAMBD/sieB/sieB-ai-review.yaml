id: P03762
gene_symbol: sieB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:2681611
  label: Escherichia phage lambda
description: >-
  Integral inner-membrane superinfection exclusion protein (184 amino acids) of Escherichia phage
  lambda that is expressed in lysogens from a rightward promoter located between ral and N
  (counter to PL transcription) and aborts lytic development of superinfecting phages lacking a
  cognate escape (esc) determinant. Contains two N-terminal transmembrane alpha-helices that
  anchor the protein in the host cytoplasmic membrane and is homologous to the SieB exclusion
  protein of Salmonella phage P22. Upon superinfection by susceptible heteroimmune phages, SieB
  triggers premature cessation of macromolecular synthesis and abortive infection, whereas
  phage lambda itself evades SieB-mediated exclusion during lytic growth via expression of an
  overlapping escape factor.
