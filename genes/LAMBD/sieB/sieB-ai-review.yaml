      identified by homology to that of P22 sieB.
suggested_questions:
- question: >-
    How does the truncated Esc polypeptide encoded within the sieB locus interact with full-length
    membrane-bound SieB to neutralize abortive exclusion during homologous lambda infection?
suggested_experiments:
- description: >-
    Bacterial two-hybrid and co-immunoprecipitation assays in Escherichia coli inner-membrane
    fractions testing heterooligomerization between full-length SieB and the in-frame truncated
    Esc polypeptide.
  hypothesis: >-
    Esc forms inactive heteromeric complexes with full-length SieB in the inner membrane,
    preventing SieB pore or effector activation during lytic phage development.
