    label: lysozyme activity
  evidence_type: IDA
  original_reference_id: PMID:4889461
  qualifier: enables
  review:
    summary: Early purification paper named the enzyme lambda lysozyme based on murein
      solubilization, but subsequent biochemical and structural studies established
      that R is a non-hydrolytic peptidoglycan lytic transglycosylase (GO:0008933)
      rather than a hydrolytic lysozyme/muramidase.
    action: MODIFY
    reason: Although R is structurally related to V- and C-type lysozymes and was
      historically termed lambda lysozyme (PMID:4889461), it cleaves peptidoglycan
      via non-hydrolytic intramolecular transglycosylation (EC 4.2.2.n2) rather than
      hydrolytic muramidase activity (GO:0003796, EC 3.2.1.17). Replacing with GO:0008933
      (peptidoglycan lytic transglycosylase activity) reflects its true catalytic
      mechanism.
    proposed_replacement_terms:
    - id: GO:0008933
      label: peptidoglycan lytic transglycosylase activity
    supported_by:
    - reference_id: PMID:10556513
      supporting_text: Phage lambda lysozyme (lambdaL) is structurally related to
        other known lysozymes but its mechanism of action is different from the classical
        lysozyme mechanism, acting as a transglycosidase rather than a hydrolase.
