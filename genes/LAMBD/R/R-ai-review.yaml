taxon:
  id: NCBITaxon:2681611
  label: Escherichia phage Lambda
description: Endolysin (lambda lysozyme, EC 4.2.2.n2) that functions as a non-hydrolytic
  peptidoglycan lytic transglycosylase during bacteriophage lambda host cell lysis.
  Synthesized without a signal peptide, R accumulates in the Escherichia coli cytoplasm
  during late gene expression until the S-105 holin forms micron-scale lesions in
  the inner membrane, allowing R to enter the periplasm and cleave the beta-1,4-glycosidic
  bonds between N-acetylmuramic acid and N-acetylglucosamine via an intramolecular
  transglycosylation mechanism catalyzed by Glu-19, generating 1,6-anhydro-N-acetylmuramic
  acid ends and degrading the murein sacculus to enable spanin-mediated outer membrane
  disruption and virion release.
