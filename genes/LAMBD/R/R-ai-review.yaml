suggested_questions:
- question: Does lambda R act purely as an endo-lytic transglycosylase on cross-linked
    sacculi in vivo, or does it exhibit processive exo-cleavage from glycan termini
    once initial nicking occurs?
- question: How does the local concentration of R escaping through micron-scale S-105
    lesions coordinate spatially with pre-assembled Rz-Rz1 spanin complexes trapped
    in the peptidoglycan meshwork?
suggested_experiments:
- description: Perform high-speed atomic force microscopy (HS-AFM) of purified R acting
    on isolated Escherichia coli peptidoglycan sacculi to determine cleavage directionality,
    processivity, and meshwork pore enlargement kinetics.
- description: Determine cryo-EM or X-ray structures of an catalytically inactive
    R(E19Q) variant bound to cross-linked muropeptide fragments to visualize the closed-state
    interactions of Asp-27, Arg-33, and the C-terminal lip.
