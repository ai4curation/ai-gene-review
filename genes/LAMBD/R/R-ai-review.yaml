      between the two domains.
  - reference_id: PMID:10556513
    supporting_text: Phage lambda lysozyme (lambdaL) is structurally related to other
      known lysozymes but its mechanism of action is different from the classical
      lysozyme mechanism, acting as a transglycosidase rather than a hydrolase.
  - reference_id: PMID:28637001
    supporting_text: At the time predetermined by holin, which controls the phage
      infective cycle, the muralytic enzyme endolysin, encoded by the R gene, accumulates
      in the cytoplasm and escapes through the pore of the IM to digest the peptidoglycan
