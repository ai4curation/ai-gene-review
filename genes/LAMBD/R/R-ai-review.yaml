core_functions:
- description: Catalyzes the non-hydrolytic cleavage of beta-1,4-glycosidic bonds
    between N-acetylmuramic acid and N-acetylglucosamine in the Escherichia coli peptidoglycan
    sacculus via intramolecular transglycosylation (producing 1,6-anhydro-N-acetylmuramic
    acid ends) after escaping from the host cytoplasm through S-105 holin lesions
    into the periplasm, driving peptidoglycan catabolism and cytolytic viral release.
