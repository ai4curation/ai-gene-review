core_functions:
- description: >-
    Forms a homodimer that binds specifically to the OR and OL operator subsites (with highest
    affinity for OR3) to repress transcription from the lysogenic promoter PRM and downregulate
    the early lytic promoters PR and PL, promoting lytic commitment and release from viral latency.
  molecular_function:
    id: GO:0001046
    label: core promoter sequence-specific DNA binding
  directly_involved_in:
  - id: GO:0032897
    label: negative regulation of viral transcription
  - id: GO:0019046
    label: release from viral latency
  - id: GO:0098689
    label: latency-replication decision
  supported_by:
  - reference_id: PMID:17908932
    supporting_text: >-
      In the anti-immune (Cro-dominant) state, Cro is expressed from P R and prevents CI
      expression, presumably by virtue of its high affinity for O R 3, where it can bind to
      repress P RM
  - reference_id: PMID:7500341
    supporting_text: >-
      Based on the distance and dihedral angle constraints derived from the NMR data, the
      three-dimensional solution structure of the lambda-Cro repressor in the dimeric form has
      been calculated by the simulated annealing method.
suggested_questions:
- question: >-
    How does weak monomer-dimer association in wild-type Cro tune the timing limit of OR3
    repression relative to CII accumulation during initial multi-phage infection?
suggested_experiments:
- description: >-
    Single-cell time-lapse fluorescence microscopy comparing wild-type phage lambda and phages
    encoding covalently cross-linked or stabilized Cro dimers across varying multiplicities of
    infection (MOI).
  hypothesis: >-
    Eliminating the monomer-dimer equilibrium threshold causes premature repression of PR and PL
    before sufficient CII accumulates, abolishing lysogenization even at high MOI.
