- term:
    id: GO:0009411
    label: response to UV
  evidence_type: IMP
  original_reference_id: PMID:17908932
  review:
    summary: >-
      Mutational disruption of Cro binding at OR3 impairs UV-induced prophage induction.
    action: KEEP_AS_NON_CORE
    reason: >-
      UV irradiation is sensed by the host SOS/RecA system that stimulates CI autocleavage; Cro
      acts downstream of CI derepression during UV-induced prophage induction, making response
      to UV a peripheral phenotype rather than a direct core function of Cro.
    supported_by:
    - reference_id: PMID:17908932
      supporting_text: >-
        We demonstrate that following inactivation of CI by ultraviolet treatment of lysogens,
        repression of P(RM) by Cro is needed to prevent synthesis of new CI that would otherwise
        significantly impede lytic development.
