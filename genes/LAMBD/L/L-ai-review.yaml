core_functions:
- description: Iron-sulfur ([4Fe-4S]) cluster-binding structural protein of the bacteriophage lambda tail tip complex that
    forms a trimer associated with gpI, gpJ, gpM, and C-terminal gpHC, essential for nucleating viral tail assembly and mediating
    tail tip opening during viral genome ejection.
  molecular_function:
    id: GO:0051539
    label: 4 iron, 4 sulfur cluster binding
