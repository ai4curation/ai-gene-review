- id: PMID:23542343
  title: Tail tip proteins related to bacteriophage λ gpL coordinate an iron-sulfur cluster.
  findings:
  - statement: Four conserved C-terminal cysteine residues (Cys173, Cys182, Cys205, Cys212) in gpL coordinate an iron-sulfur
      cluster and are essential for biological activity.
    supporting_text: Four highly conserved cysteine residues were shown to be required for coordinating the iron-sulfur cluster,
      and substitution of any of these Cys residues with Ser or Ala within the context of λ gpL abolished biological activity.
  - statement: Mutation of Cys173, Cys182, or Cys205 to Ser completely abolishes tail production, while Cys212Ser reduces
      tail production to 4.2% of wild type.
    supporting_text: By contrast, no tails were detected for the conserved cysteine mutants, Cys173Ser, Cys182Ser and Cys205Ser,
      and the Cys212Ser mutant supported production of only 4.2±1.0 % of tails compared to wild type.
- id: PMID:41237242
  title: Structural basis of bacteriophage Ur-lambda infection initiation.
  findings:
  - statement: Three full-length copies of gpL are resolved in the tail tip complex in association with three copies of gpI
      and three copies of C-terminal gpHC (residues 818-849).
    supporting_text: We resolved three full-length copies of the tip attachment protein, gpL (232 residues), and three of
      the baseplate hub protein gpI (residues 134 to 222), which are clearly associated with three copies of residues 818
      to 849 (from 853) of gpH, or in the mature phage, C-terminal residues of gpHC
