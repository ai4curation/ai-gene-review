id: P03738
gene_symbol: L
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:2681611
  label: Escherichia phage Lambda
description: Minor tail protein gpL (tip attachment protein) is an iron-sulfur cluster-containing structural subunit of the
  bacteriophage lambda tail tip complex. Present in three copies per virion, gpL coordinates a [4Fe-4S] cluster via four conserved
  C-terminal cysteine residues (Cys173, Cys182, Cys205, and Cys212) required for proper folding and tail morphogenesis, associates
  with the baseplate hub protein (gpI), central tail fiber (gpJ), and the C-terminal segment of the tape measure protein (gpHC)
  to form the tail tip complex, and transmits receptor-triggered conformational changes that open the tail conduit for viral
  genome ejection.
