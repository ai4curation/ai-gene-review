  label: Escherichia phage Lambda
description: Single-stranded DNA-binding and annealing protein (Red beta, RecT/Redbeta family synaptase) of the bacteriophage lambda Red homologous recombination system. Loaded onto nascent 3'-single-stranded DNA overhangs through direct interaction with the 5'-to-3' exonuclease Exo, it protects single-stranded DNA and catalyzes ATP-independent annealing of complementary DNA strands to drive homologous recombination and late rolling-circle phage DNA replication.
