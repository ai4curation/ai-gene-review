id: P03711
gene_symbol: C
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:2681611
  label: Escherichia phage lambda
description: Bifunctional capsid morphogenesis locus of Escherichia phage lambda that encodes both the full-length procapsid
  maturation serine protease gpC (P03711-1) and, via an internal in-frame translation initiation site, the internal scaffolding
  protein gpNu3 (P03711-2, identical to the C-terminal 145 residues of gpC). During prohead assembly, gpNu3 transiently scaffolds
  the portal (gpB) and major capsid (gpE) subunits while recruiting gpC into the procapsid core; the N-terminal serine protease
  domain of gpC then degrades the gpNu3 scaffold, cleaves the N-terminus of portal protein gpB to gpB*, catalyzes covalent
  fusion and processing of gpC with gpE to generate minor capsid proteins pX1 and pX2, and undergoes autoproteolysis to prime
  the procapsid for viral DNA packaging.
alternative_products:
- id: P03711-1
  name: Protease C
  description: Full-length 439-amino-acid procapsid maturation serine protease (gpC) containing an N-terminal ClpP-like serine
    peptidase domain and a C-terminal scaffolding domain. Catalyzes degradation of the internal scaffolding protein gpNu3,
    N-terminal processing of portal protein gpB to gpB*, covalent fusion with major capsid protein gpE to form minor capsid
    proteins pX1 and pX2, and autoproteolytic maturation of the procapsid.
- id: P03711-2
  name: Scaffolding protein Nu3
  description: Internal 145-amino-acid scaffolding protein (gpNu3) translated from an internal in-frame start codon within
    gene C (corresponding to residues 295-439 of gpC). Forms transient homodimers in the procapsid interior to guide icosahedral
    assembly of gpE and incorporation of the gpB portal ring and gpC protease before being degraded by gpC during procapsid
    maturation.
