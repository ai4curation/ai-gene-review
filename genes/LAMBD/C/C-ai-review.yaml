  review:
    summary: gpC catalyzes proteolytic cleavage of the internal scaffold gpNu3, portal protein gpB, and its own prohead protease
      domain during procapsid maturation.
    action: ACCEPT
    reason: Biochemical and genetic studies demonstrate that gpC degrades gpNu3, cleaves the N-terminus of gpB, and undergoes
