- id: PMID:20620152
  title: 'Assembly and maturation of the bacteriophage lambda procapsid: gpC is the viral protease.'
  findings:
  - statement: gpC is the viral protease required for autoproteolysis, degradation of the internal scaffold gpNu3, and cleavage
      of the portal complex gpB.
    supporting_text: The procapsid protease possesses autoproteolytic activity, it is required for degradation of the internal
      "scaffold" protein required for procapsid self-assembly, and it is responsible for proteolysis of the portal complex.
- id: PMID:21821043
  title: The bacteriophage lambda gpNu3 scaffolding protein is an intrinsically disordered and biologically functional procapsid
    assembly catalyst.
  findings:
  - statement: Analytical ultracentrifugation shows that gpNu3 exists in a monomer-dimer equilibrium in solution.
    supporting_text: This was confirmed by analytical ultracentrifugation studies, which reveal a monomer-dimer equilibrium
  - statement: Purified gpNu3 promotes polymerization of gpE into native-like procapsid shells that incorporate gpC for subsequent
      proteolytic maturation.
    supporting_text: Purified gpNu3 promotes the polymerization of gpE, the λ major capsid protein, into virus-like particles
      that possess a native-like procapsid morphology.
  - statement: gpC is incorporated into the procapsid shell during assembly and matures the procapsid by proteolysis.
    supporting_text: The gpC protease, which is also incorporated into the shell during assembly, then “matures” the procapsid
      by proteolysis (Fig. 1).
- id: PMID:21943085
  title: The protein interaction map of bacteriophage lambda.
  findings:
  - statement: Systematic array-based yeast two-hybrid screening mapped protein-protein interactions across 68 open reading
      frames of bacteriophage lambda, including gpC self-association.
    supporting_text: In order to map lambda's interactions, we have cloned 68 out of 73 lambda open reading frames (the "ORFeome")
      into Gateway vectors and systematically tested all proteins for interactions using exhaustive array-based yeast two-hybrid
      screens.
- id: file:LAMBD/C/C-uniprot.txt
  title: UniProtKB record for C (P03711)
  findings:
  - statement: The protease domain of gpC catalyzes cleavage of the capsid scaffolding protein after procapsid formation,
      while the internal scaffolding protein Nu3 promotes icosahedral procapsid assembly.
    record_section: ["CC:FUNCTION"]
    supporting_text: The protease domain catalyzes the cleavage of the capsid scaffolding protein after complete procapsid
      formation.
suggested_questions:
- question: What is the exact chemical mechanism by which the gpC serine protease catalyzes the transpeptidation/fusion reaction
    between its own C-terminal segment and the major capsid protein gpE to form pX1 and pX2?
suggested_experiments:
- description: Perform mass spectrometry and cryo-EM structural analysis of procapsid intermediates containing acyl-enzyme-trapped
    gpC mutants to visualize the gpC-gpE transpeptidation intermediate.
  hypothesis: The acyl-enzyme intermediate formed during gpC autoproteolysis is nucleophilically attacked by an N-terminal
    amine of an adjacent gpE subunit at the portal or icosahedral vertices.
