id: P03753
gene_symbol: ea31
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:2681611
  label: Escherichia phage Lambda
description: Uncharacterized 296-amino-acid (33.5 kDa) protein encoded in the nonessential
  b2 region of bacteriophage lambda between ea47 and ea59. Contains a conserved C-terminal
  HNH endonuclease domain (HNHc, InterPro:IPR003615, residues 197-244), suggesting
  a putative DNA endonuclease or nicking activity, although its physiological substrate
  and role during phage lambda infection remain experimentally uncharacterized.
existing_annotations: []
core_functions:
- description: Uncharacterized b2-region protein (296 aa) containing a conserved C-terminal HNHc nuclease domain (residues 197-244, IPR003615) with putative endonuclease activity and no experimentally characterized physiological substrate.
  supported_by:
  - reference_id: file:LAMBD/ea31/ea31-uniprot.txt
    record_section: ["DR:InterPro"]
    supporting_text: 'DR   InterPro; IPR003615; HNH_nuc.'
references:
- id: file:LAMBD/ea31/ea31-uniprot.txt
  title: UniProtKB entry P03753 (EA31_LAMBD)
  findings:
  - statement: Ea31 is a 296-residue protein encoded in phage lambda that contains
      a C-terminal HNHc nuclease domain at residues 197-244.
    record_section: ["DR:InterPro"]
    supporting_text: 'DR   InterPro; IPR003615; HNH_nuc.'
suggested_questions:
- question: Does purified lambda Ea31 exhibit divalent metal-dependent DNA endonuclease
    or nicking activity via its C-terminal HNHc motif (residues 197-244), and does
    it recognize a specific DNA sequence or structure?
- question: Does Ea31 physically interact or functionally cooperate with the neighboring
    b2 region AAA+ ATPase Ea59 or Ea47 during superinfection exclusion or anti-defense?
suggested_experiments:
- description: Express and purify wild-type Ea31 and a catalytic His/Asn active-site
    mutant of the HNHc domain (residues 197-244) to assay sequence-specific or non-specific
    endonuclease and nicking activity on phage and host DNA substrates in vitro.
- description: Perform affinity purification coupled to mass spectrometry (AP-MS)
    of epitope-tagged Ea31 during lambda infection of Escherichia coli to determine
    whether Ea31 forms a complex with Ea59 or Ea47.
