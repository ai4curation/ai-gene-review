id: P03755
gene_symbol: ea8.5
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:2681611
  label: Escherichia phage Lambda
description: Early pL-operon protein of 93 amino acids (10.5 kDa) encoded between
  ea22 and exo in bacteriophage lambda. Founding member of the conserved Lambda_ea8_5
  protein family (Pfam:PF20735, InterPro:IPR048531) with a homeodomain/winged-helix-like
  structural classification (Gene3D:1.10.10.1920) and six recorded binary interactions
  in IntAct, although its specific molecular function during phage infection remains
  experimentally uncharacterized.
existing_annotations: []
core_functions:
- description: Early pL-operon accessory protein (93 aa, Lambda_ea8_5 family PF20735) adopting a homeodomain/winged-helix-like structural fold with no experimentally determined physiological target.
