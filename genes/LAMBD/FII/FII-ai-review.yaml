  review:
    summary: >-
      gpFII is synthesized and assembles onto DNA-filled heads in the Escherichia
      coli cytoplasm prior to cell lysis.
    action: ACCEPT
    reason: >-
      Intracellular virion morphogenesis, including gpFII addition to gpW-capped heads
      and subsequent tail attachment, occurs in the host bacterial cytoplasm [PMID:20660769,
      file:LAMBD/FII/FII-uniprot.txt].
    supported_by:
