- term:
    id: GO:0019068
    label: virion assembly
  evidence_type: IMP
  original_reference_id: PMID:20660769
  qualifier: involved_in
  review:
    summary: >-
      Site-directed substitutions and deletions in the head-binding and tail-binding
      surfaces of gpFII abolish phage assembly or cause dominant-negative inhibition
      of virion morphogenesis.
    action: ACCEPT
    reason: >-
      Mutational analysis demonstrates that N-terminal deletions abolish head binding
      whereas substitutions on the bottom surface allow head binding but block tail
      attachment in a dominant-negative manner [PMID:20660769].
    supported_by:
    - reference_id: PMID:20660769
      supporting_text: >-
        Mutants bearing amino acid substitutions or deletions on the putative bottom
        surface displayed dominant-negative phenotypes because they could still bind
        heads and thereby inhibit the assembly of phage even in the presence of WT
        gpFII. By contrast, deletion of the N-terminal region, which is expected to
        be involved in head-binding, caused loss of activity without a dominant-negative
        effect.
