id: P03714
gene_symbol: FII
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:2681611
  label: Escherichia phage Lambda
description: >-
  Head-tail connector protein (gpFII) of Escherichia phage lambda that polymerizes
  as a hexameric ring onto the gpW-capped portal vertex of the DNA-filled capsid at
  the final step of head morphogenesis. Forming the bottom ring of the head-tail connector
  complex (gpB12-gpW6-gpFII6), gpFII uses its N-terminal region to bind the gpW-modified
  head and its bottom surface loops to bind the tail terminator protein gpU of the
  pre-assembled tail, joining the head and tail into an infectious virion.
existing_annotations:
- term:
