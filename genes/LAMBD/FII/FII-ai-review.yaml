    label: virion assembly
  evidence_type: IDA
  original_reference_id: PMID:20660769
  qualifier: involved_in
  review:
    summary: >-
      gpFII forms the bottom ring of the head-tail connector that joins the DNA-filled
      head to the pre-assembled tail at the final step of virion assembly.
    action: ACCEPT
    reason: >-
      Structural and biochemical characterization shows that gpFII binds to gpW-capped
      DNA-filled heads and provides the tail-attachment interface that joins the head
      and tail into a complete virion [PMID:20660769].
    supported_by:
    - reference_id: PMID:20660769
      supporting_text: >-
        The bottom surface of the connector ( Fig. 1 A ), which interacts with the
        tail, is composed of gpFII ( 5 ).
