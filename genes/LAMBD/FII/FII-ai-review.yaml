suggested_questions:
- question: >-
    How does unstructured-to-structured folding of the N-terminal and central loops
    of gpFII upon binding the gpW hexamer expose the complementary binding site for
    the hexameric tail terminator gpU?
suggested_experiments:
- description: >-
    Compare high-resolution cryo-EM reconstructions of gpW-capped heads before and
    after gpFII addition with the solution NMR structure of monomeric gpFII.
  hypothesis: >-
    Docking of the disordered N-terminal tail of gpFII onto the gpW ring allosterically
    orders the bottom-surface loops of the gpFII hexamer to create the tail-binding
    interface, preventing premature binding of free gpFII monomers to unattached tails.
