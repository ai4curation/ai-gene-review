  original_reference_id: PMID:11904406
  qualifier: enables
  review:
    summary: Lambda integrase directly binds both arm-type and core-type DNA sites via distinct structural domains; the NMR solution structure of the N-terminal domain (residues 1-64) demonstrates sequence-specific arm-site DNA binding.
    action: ACCEPT
    reason: Direct structural and biochemical evidence shows that the N-terminal domain of lambda Int (residues Met1-Leu64) binds arm-type DNA sequences, while the core-binding and catalytic domains engage the core recognition sequence.
    supported_by:
    - reference_id: PMID:11904406
      supporting_text: We have determined that residues Met-1 to Leu-64 of Int constitute the minimal arm-type DNA-binding domain (INT-DBD(1-64)) and solved the solution structure by using NMR.
