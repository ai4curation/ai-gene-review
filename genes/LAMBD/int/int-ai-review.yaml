- id: PMID:11904406
  title: 'Arm-site binding by lambda -integrase: solution structure and functional characterization of its amino-terminal domain.'
  findings:
  - statement: Residues Met1 to Leu64 of lambda Int form the minimal arm-type DNA-binding domain, recognizing arm-type sites via a three-stranded antiparallel beta-sheet and disordered N-terminal tail.
    supporting_text: We have determined that residues Met-1 to Leu-64 of Int constitute the minimal arm-type DNA-binding domain (INT-DBD(1-64)) and solved the solution structure by using NMR.
- id: PMID:12832614
  title: Identification of the lambda integrase surface that interacts with Xis reveals a residue that is also critical for Int dimer formation.
  findings:
  - statement: Glu47 in the N-terminal domain of lambda Int is required both for cooperative interaction with Xis and for Int-Int dimer interactions on adjacent arm-type DNA sites.
    supporting_text: The mutant E47A, which was identified by alanine-scanning mutagenesis, abolishes interactions between Int and Xis bound at adjacent binding sites and reduces interactions between Int protomers bound at adjacent arm-type sites.
- id: PMID:15973401
  title: A structural basis for allosteric control of DNA recombination by lambda integrase.
  findings:
  - statement: Crystal structures of tetrameric lambda Int bound to arm- and core-site DNAs and a Holliday junction intermediate show how arm-domain interactions allosterically position the catalytic domains and Tyr342 nucleophile for concerted strand cleavage and exchange.
    supporting_text: The active site of λ -int resembles that of other tyrosine recombinases 19 , 26 , with conserved residues (Arg 212, Lys 235, His 308, Arg 311, His 333) that engage the scissile phosphate and a tyrosine nucleophile (Tyr 342) that forms a 3′ phosphotyrosine linkage with the cleaved DNA
- id: PMID:18001133
  title: DNA recognition via mutual-induced fit by the core-binding domain of bacteriophage lambda integrase.
  findings:
  - statement: The core-binding and catalytic domains of lambda Int form a bipartite DNA-cleaving enzyme that recognizes opposite faces of the core-type DNA site via mutual-induced fit.
    supporting_text: The core-binding and catalytic domains of lambda-Int constitute a bipartite enzyme that mediates site-specific DNA cleavage through their interactions with opposite sides of the recognition sequence.
- id: PMID:19324050
  title: 'NMR structure of the amino-terminal domain of the lambda integrase protein in complex with DNA: immobilization of a flexible tail facilitates beta-sheet recognition of the major groove.'
  findings:
  - statement: Solution NMR structure of the Int(1-64)-P'2 DNA complex shows how immobilization of the flexible N-terminal tail positions the three-stranded beta-sheet in the DNA major groove.
    supporting_text: We have elucidated how Int is able to sequence specifically recognize the arm-type site sequence by determining the solution structure of its amino-terminal domain (Int(N), residues Met1 to Leu64) in complex with its P'2 DNA binding site.
- id: PMID:6444632
  title: Purification and characterization of the integration protein specified by bacteriophage lambda.
  findings: []
- id: file:LAMBD/int/int-uniprot.txt
  title: UniProtKB record for P03700 (VINT_LAMBD)
  findings:
  - statement: Lambda integrase catalyzes phage integration into the host genome and, together with excisionase, prophage excision.
    supporting_text: Integrase is necessary for integration of the phage into the host genome by site-specific recombination. In conjunction with excisionase, integrase is also necessary for excision of the prophage from the host genome.
suggested_questions:
- question: How do thermal fluctuations in the alpha-helical coupler connecting the N-terminal arm-binding domain and central core-binding domain quantitatively gate the isomerization of the Holliday junction intermediate between integrative and excisive intasomes?
suggested_experiments:
- description: Single-molecule FRET and cryo-EM time-resolved analysis of full-length Int-IHF-Xis excisive intasomes during Holliday junction branch migration and second-strand cleavage.
  hypothesis: Cooperative contacts from the Xis microfilament to the Int N-terminal domain bias the conformational equilibrium of the Int tetramer toward the top-strand cleavage-competent state while preventing reversal to the integrative configuration.
