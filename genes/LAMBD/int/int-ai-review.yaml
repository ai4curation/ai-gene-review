id: P03700
gene_symbol: int
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:2681611
  label: Escherichia phage Lambda
description: Heterobivalent tyrosine site-specific recombinase (integrase) that catalyzes both the integration of the bacteriophage lambda genome into the Escherichia coli chromosome during the establishment of lysogeny and, in complex with excisionase (Xis), the excision of the prophage upon lytic induction. Contains an N-terminal arm-type DNA-binding domain, a central core-type DNA-binding domain, and a C-terminal catalytic domain that cleaves and rejoins DNA strands via a transient 3'-phosphotyrosyl covalent intermediate at Tyr342 within higher-order tetrameric intasome complexes.
