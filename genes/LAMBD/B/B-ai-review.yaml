suggested_questions:
- question: What is the functional consequence of removing the N-terminal 22 residues of only a subset (75-90%) of gpB subunits
    in the portal dodecamer during gpC-mediated procapsid maturation?
suggested_experiments:
- description: Perform cryo-EM and single-molecule packaging assays on procapsids assembled with a non-cleavable gpB cleavage-site
    mutant to test whether N-terminal processing of gpB is required for DNA translocation, head expansion, or gpW docking.
  hypothesis: Proteolytic removal of the N-terminal peptide of gpB widens or remodels the internal portal channel to permit
    smooth DNA entry and subsequent head-tail connector assembly.
