  - statement: gpB forms the homododecameric portal vertex involved in head assembly, genome packaging, neck/tail attachment,
      and genome ejection.
    record_section: ["CC:FUNCTION"]
    supporting_text: Forms the portal vertex of the capsid (PubMed:6228056, PubMed:6232391). This portal plays critical roles
