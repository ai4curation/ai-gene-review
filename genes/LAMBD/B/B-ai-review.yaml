id: P03710
gene_symbol: B
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:2681611
  label: Escherichia phage lambda
description: Portal protein (gpB) of Escherichia phage lambda that multimerizes into a 12-fold rotationally symmetric homododecameric
  ring at a single unique vertex of the icosahedral capsid. Processed by the prohead protease gpC via removal of its N-terminal
  22 residues (yielding gpB*), the portal complex forms the central axial channel that nucleates procapsid assembly, docks
  the terminase motor (gpA/gpNu1) for ATP-driven viral DNA packaging, recruits the head-completion proteins gpW and gpFII
  for tail attachment, and serves as the conduit for genome ejection through the long flexible tail into the host cell.
