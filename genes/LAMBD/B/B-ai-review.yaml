- id: PMID:20620152
  title: 'Assembly and maturation of the bacteriophage lambda procapsid: gpC is the viral protease.'
  findings:
  - statement: The procapsid protease gpC cleaves the portal protein gpB during procapsid maturation.
    supporting_text: The procapsid protease possesses autoproteolytic activity, it is required for degradation of the internal
      "scaffold" protein required for procapsid self-assembly, and it is responsible for proteolysis of the portal complex.
- id: PMID:6232391
  title: Bacteriophage lambda preconnectors. Purification and structure.
  findings:
  - statement: gpB forms a 12-fold rotationally symmetric ring polymer (preconnector) that acts as a biologically active intermediate
      in prohead assembly.
    supporting_text: It has been shown previously that extracts prepared from cells infected with a lambda C-E- mutant accumulate
      a gpB polymer, which behaves as a biologically active intermediate in prohead assembly. This gpB activity has been called
      a preconnector , as it is probably a precursor to the head-tail connector.
  - statement: Optical filtration of periodic arrays of preconnectors demonstrates 12-fold rotational symmetry around a central
      channel.
    supporting_text: Optical filtration of periodic arrays of preconnectors showed that the structure has 12-fold rotational
      symmetry.
