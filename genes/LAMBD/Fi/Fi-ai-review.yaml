  review:
    summary: >-
      gpFI acts in the Escherichia coli cytoplasm where procapsids and the terminase-DNA
      complex assemble during lytic infection.
    action: ACCEPT
    reason: >-
      gpFI facilitates the interaction between cytoplasmic proheads and the terminase-DNA
      packaging complex in the infected bacterial host [PMID:22801427].
    supported_by:
    - reference_id: PMID:22801427
      supporting_text: >-
        Given that the C-terminal domain of gpFI binds to gpE and the N-terminal domain
        may bind DNA, we propose that gpFI facilitates the interaction between proheads
        and the terminase-DNA complex.
