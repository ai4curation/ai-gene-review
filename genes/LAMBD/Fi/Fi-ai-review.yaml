- id: GO_REF:0000044
  title: Gene Ontology annotation based on UniProtKB/Swiss-Prot Subcellular Location
    vocabulary mapping, accompanied by conservative changes to GO terms applied by
    UniProt.
  findings: []
- id: PMID:22801427
  title: Structural and biochemical characterization of phage λ FI protein (gpFI)
    reveals a novel mechanism of DNA packaging chaperone activity.
  findings:
  - statement: >-
      gpFI is a two-domain DNA packaging chaperone whose C-terminal domain binds directly
      to the major head protein gpE, an interaction essential for efficient viral
      DNA packaging.
    supporting_text: >-
      In addition to the terminase enzyme, the packaging chaperone, FI protein (gpFI),
      is required for efficient DNA packaging. In this study, we demonstrate an interaction
      between gpFI and the major head protein, gpE. Amino acid substitutions in gpFI
      that reduced the strength of this interaction also decreased the biological
      activity of gpFI, implying that this head binding activity is essential for
      the function of gpFI. We also show that gpFI is a two-domain protein, and the
      C-terminal domain is responsible for the head binding activity.
  - statement: >-
      gpFI bridges proheads and the terminase-DNA complex via its C-terminal gpE-binding
      domain and N-terminal domain.
    supporting_text: >-
      Given that the C-terminal domain of gpFI binds to gpE and the N-terminal domain
      may bind DNA, we propose that gpFI facilitates the interaction between proheads
      and the terminase-DNA complex.
suggested_questions:
- question: >-
    Does the N-terminal domain of gpFI bind non-specifically to viral dsDNA or directly
    to a transiently exposed surface of the terminase holoenzyme to accelerate prohead
    capture?
suggested_experiments:
- description: >-
    Perform fluorescence anisotropy and cross-linking mass spectrometry with purified
    gpFI N-terminal domain, cos-cleaved terminase Complex I, and proheads.
  hypothesis: >-
    Simultaneous weak interactions of the gpFI N-terminal domain with DNA and the
    C-terminal domain with prohead gpE tether Complex I to the prohead surface to
    accelerate portal capture.
