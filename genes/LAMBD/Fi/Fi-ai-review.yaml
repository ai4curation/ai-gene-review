id: P03709
gene_symbol: Fi
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:2681611
  label: Escherichia phage Lambda
description: >-
  DNA-packaging chaperone protein (gpFI) of Escherichia phage lambda that promotes
  efficient viral DNA genome packaging in the host cytoplasm by facilitating the productive
  docking of the terminase-DNA complex (gpA/gpNu1 bound to concatemeric viral DNA)
  onto empty procapsids. Organized as a two-domain protein connected by a flexible
  linker, gpFI uses its C-terminal domain to bind directly to the major capsid protein
  gpE on the prohead shell while its N-terminal domain assists in coordinating the
  terminase-DNA complex.
existing_annotations:
- term:
    id: GO:0019072
    label: viral genome packaging
  evidence_type: IDA
  original_reference_id: PMID:22801427
  qualifier: involved_in
  review:
    summary: >-
      gpFI functions as an essential DNA packaging chaperone that binds the major
      capsid protein gpE to promote docking of the terminase-DNA complex onto proheads;
      because phage lambda is a dsDNA virus, this annotation is refined to viral DNA
      genome packaging.
    action: MODIFY
    reason: >-
      Biochemical and mutational analyses demonstrate that gpFI is a two-domain DNA
      packaging chaperone whose C-terminal domain binds the major head protein gpE
      to facilitate interaction between proheads and the terminase-DNA complex during
      dsDNA genome packaging [PMID:22801427]. Therefore, GO:0019072 (viral genome
      packaging) is refined to its specific descendant GO:0019073 (viral DNA genome
      packaging).
    proposed_replacement_terms:
    - id: GO:0019073
      label: viral DNA genome packaging
    supported_by:
    - reference_id: PMID:22801427
      supporting_text: >-
        In addition to the terminase enzyme, the packaging chaperone, FI protein (gpFI),
        is required for efficient DNA packaging. In this study, we demonstrate an
        interaction between gpFI and the major head protein, gpE. Amino acid substitutions
        in gpFI that reduced the strength of this interaction also decreased the biological
        activity of gpFI, implying that this head binding activity is essential for
        the function of gpFI. We also show that gpFI is a two-domain protein, and
        the C-terminal domain is responsible for the head binding activity.
- term:
