references:
- id: PMID:9811830
  title: lambda Rap protein is a structure-specific endonuclease involved in phage recombination.
  findings:
  - statement: Purified lambda Rap (NinG) acts as a Mn2+-dependent structure-specific endonuclease that cleaves at the branch point of synthetic Holliday junction and D-loop DNA substrates.
    supporting_text: In the presence of manganese ions, Rap acts as an endonuclease that cleaves at the branch point of Holliday and D-loop substrates.
- id: PMID:15223317
  title: Holliday junction binding and resolution by the Rap structure-specific endonuclease of phage lambda.
  findings:
  - statement: Lambda Rap (NinG) mediates symmetrical resolution of 50-bp and chi Holliday junction structures containing homologous cores into nicked duplex products.
    supporting_text: Here, we demonstrate that Rap can mediate symmetrical resolution of 50 bp and chi Holliday structures containing larger homologous cores.
