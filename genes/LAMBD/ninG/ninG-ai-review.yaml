description: Branched-DNA structure-specific endonuclease (NinG / Rap, 204 AA) encoded in the ninR region of bacteriophage lambda. Acts as a phage-encoded Holliday junction and D-loop resolvase functionally analogous to Escherichia coli RuvC that cleaves crossover DNA intermediates during homologous DNA recombination.
