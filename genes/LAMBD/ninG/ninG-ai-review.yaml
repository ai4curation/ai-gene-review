suggested_questions:
- question: What is the structural basis for NinG preference toward three-way D-loops versus symmetric four-way Holliday junctions compared to E. coli RuvC and RusA?
suggested_experiments:
- description: Determine the X-ray crystal or cryo-EM structure of NinG bound to synthetic four-way Holliday junction and three-way D-loop DNA substrates, paired with cleavage mapping across sequence variants.
  hypothesis: The N-terminal cysteine-rich module of NinG recognizes the unpaired single-stranded/double-stranded branch point of D-loops, enabling resolution of early strand-invasion intermediates without requiring RuvAB branch migration.
