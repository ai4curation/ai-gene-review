id: P03732
gene_symbol: U
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:2681611
  label: Escherichia phage Lambda
description: Tail terminator protein gpU is a structural protein that forms a C6-symmetric homohexameric ring capping the
  proximal end of the bacteriophage lambda tail tube. During tail morphogenesis, once the major tail protein (gpV) has polymerized
  along the tape measure protein (gpH) to the required length, gpU binds the terminal gpV ring to arrest further polymerization
  and provides the docking interface for the tail completion protein (gpZ) and head-tail joining protein (gpFII) within the
  portal-neck complex.
