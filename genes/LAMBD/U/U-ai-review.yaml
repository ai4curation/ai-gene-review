suggested_questions:
- question: How does the N-terminal domain of the tape measure protein gpH coordinate with the terminal gpV hexamer to trigger
    cooperative hexamerization of gpU only when the 31st/32nd gpV ring has been added?
suggested_experiments:
- description: Perform single-molecule fluorescence and cryo-EM analysis of in vitro tail polymerization reactions containing
    gpH-gpG/gpGT-basal complexes, gpV, and fluorescently labeled gpU variants with point mutations at the gpU-gpH interface.
  hypothesis: Specific recognition of the N-terminal exposed segment of gpH by gpU is required to nucleate gpU hexamerization
    on the terminal gpV ring and prevent runaway polytail formation.
