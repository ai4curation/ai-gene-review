id: P03752
gene_symbol: ea47
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:2681611
  label: Escherichia phage Lambda
description: Uncharacterized 410-amino-acid (47.7 kDa) protein encoded in the nonessential
  b2 region of bacteriophage lambda adjacent to ea31 and int. Contains two copies
  of the conserved Phage_lambda_Ea47 domain (Pfam:PF26900, InterPro:IPR059638) and
  has recorded binary protein interactions in high-throughput phage interactome screens,
  though its specific molecular function and biological role during lambda infection
  remain experimentally uncharacterized.
existing_annotations: []
core_functions:
- description: Uncharacterized b2-region protein (410 aa) containing two conserved Phage_lambda_Ea47 domains (PF26900) with no experimentally established molecular function or biological process.
  supported_by:
