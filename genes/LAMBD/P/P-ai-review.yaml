  - statement: Lambda P forms a DnaB6:P5 complex that opens the DnaB hexameric ring to load it onto ssDNA at ori lambda and is necessary for bidirectional replication of lambda DNA.
    record_section: ["CC:FUNCTION"]
    supporting_text: Loads (host) replicative DNA helicase DnaB onto single-stranded (ss)DNA at the origin of replication (Probable) (PubMed:30582519). Reconfigures the DnaB hexameric ring, generating an opening large enough to permit ssDNA into the central channel (PubMed:30582519). Necessary for the bidirectional replication of lambda DNA.
suggested_questions:
- question: Which specific P protomers within the asymmetric DnaB6:P5 complex are first engaged by DnaJ and unfolded by DnaK to trigger ring closure around single-stranded origin DNA?
suggested_experiments:
- description: Cryo-EM structural time-course of the ori lambda-bound DnaB6:P5 complex incubated with DnaJ, DnaK, GrpE, and ATP.
  hypothesis: DnaJ selectively recognizes the P protomer bridging the cracked DnaB seam, directing DnaK to extract its C-terminal lasso helix first and allowing the DnaB hexamer to snap closed around ssDNA.
