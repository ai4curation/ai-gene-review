taxon:
  id: NCBITaxon:2681611
  label: Escherichia phage Lambda
description: Replicative helicase loader protein required for the initiation of bidirectional theta-mode replication of bacteriophage lambda DNA. Forms a pentameric complex on the hexameric Escherichia coli DnaB helicase (DnaB6:P5) that cracks open the DnaB ring to load single-stranded DNA into its central channel while suppressing DnaB ATPase activity, and docks onto the origin-bound lambda O initiator (O-some) at ori lambda prior to DnaK/DnaJ/GrpE chaperone-mediated P release and fork activation.
