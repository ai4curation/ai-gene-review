core_functions:
- description: Binds both the host Escherichia coli DnaB replicative helicase (forming a cracked-ring DnaB6:P5 complex in the presence of ssDNA) and the phage O origin-initiator protein to load DnaB onto single-stranded DNA at ori lambda during DNA replication initiation.
  molecular_function:
