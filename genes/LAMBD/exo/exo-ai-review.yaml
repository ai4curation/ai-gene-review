- id: file:LAMBD/exo/exo-uniprot.txt
  title: UniProtKB record for P03697 (EXO_LAMBD)
  findings:
  - statement: Lambda exonuclease is a homotrimeric toroidal 5'-to-3' dsDNA exonuclease (EC 3.1.11.3) that requires Mg2+ and functions in phage homologous recombination and late rolling-circle DNA replication.
    supporting_text: Facilitates phage DNA recombination through the double-strand break repair (DSBR) and single-strand annealing pathways. Also important for the late, rolling-circle mode of lambda DNA replication.
suggested_questions:
- question: How does the stoichiometry of Beta (bet) protomers bound to the lambda Exo homotrimer regulate the handoff of the nascent 3'-ssDNA tail during processive resection?
suggested_experiments:
- description: Single-molecule optical tweezers combined with confocal fluorescence imaging of fluorescently labeled Beta loading onto dsDNA ends actively resected by wild-type vs. Beta-interaction-defective Exo mutants.
  hypothesis: Direct docking of Beta onto the Exo trimer pre-organizes a nucleation ring of Beta at the ssDNA exit channel, accelerating ssDNA filament assembly and preventing premature degradation or secondary structure formation.
