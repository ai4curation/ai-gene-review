  label: Escherichia phage Lambda
description: Homotrimeric toroidal 5'-to-3' double-stranded DNA exonuclease (Red alpha, EC 3.1.11.3) of the bacteriophage lambda Red recombination system. Threading double-stranded DNA ends into its tapered central channel, it processively hydrolyzes the 5'-terminated strand in a Mg2+-dependent manner to release 5'-mononucleotides and extrude a 3'-single-stranded DNA overhang, onto which it loads the partner single-strand annealing protein Beta (bet) to drive homologous recombination via double-strand break repair and single-strand annealing as well as late rolling-circle phage DNA replication.
