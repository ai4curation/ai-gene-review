core_functions:
- description: Trimeric central tail fiber and distal tail tip hub protein that binds the Escherichia coli outer membrane
    maltoporin LamB via its C-terminal receptor-binding domain to mediate entry receptor-dependent virion attachment and trigger
    conformational opening of the tail tip complex for viral genome ejection, while also nucleating 15S tail tip assembly
    during morphogenesis.
  molecular_function:
    id: GO:0046789
    label: host cell surface receptor binding
  directly_involved_in:
  - id: GO:0098670
    label: entry receptor-mediated virion attachment to host cell
  - id: GO:0099001
    label: symbiont genome ejection through host cell envelope, long flexible tail mechanism
  - id: GO:0098003
    label: viral tail assembly
  supported_by:
  - reference_id: PMID:41237242
    supporting_text: The tail tip complex serves as the host-recognition apparatus that binds LamB (31). The overall cryo-EM structure of the free Ur-λ tail tip complex, determined at overall resolution 3.37 Å using C3 symmetry (Fig. 2A), reveals the tail tube protein gpV, distal tail protein gpM, and central fiber protein gpJ (residues 1 to 807).
  - reference_id: PMID:41237242
    supporting_text: We built a model of the infection intermediate by leveraging the cryo-EM structure of the λWT tail complex with LamB (13) and the in situ structure derived from cryo-ET and subtomogram averaging (Fig. 5C). It is evident that the central fiber undergoes a marked conformational change and becomes acutely bent as it transitions from a closed tail tube (mature phage and type I complex) to one where the distal end has an open conformation (type IIa complex infection intermediate) (Fig. 5, C and D).
  - reference_id: PMID:10629200
    supporting_text: Solid-phase binding assays demonstrated that a purified fusion protein comprising only the last 249 residues
      of J could bind to LamB trimers and inhibited recognition by anti-LamB antibodies. Electron microscopy further demonstrated
      that the fusion protein could also bind to LamB at the surface of intact cells. This interaction prevented lambda adsorption
