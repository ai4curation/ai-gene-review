  review:
    summary: Role of gpJ in coupling LamB receptor engagement to opening of the tail tip conduit and viral genome ejection.
    action: ACCEPT
    reason: Engagement of LamB by the C-terminal domains of trimeric gpJ induces large-scale conformational rearrangements
      in the N-terminal hub domains of gpJ that open the distal end of the tail tip complex, allowing gpH* extrusion and viral
      DNA ejection across the host cell envelope.
    supported_by:
    - reference_id: PMID:41237242
      supporting_text: We built a model of the infection intermediate by leveraging the cryo-EM structure of the λWT tail complex with LamB (13) and the in situ structure derived from cryo-ET and subtomogram averaging (Fig. 5C). It is evident that the central fiber undergoes a marked conformational change and becomes acutely bent as it transitions from a closed tail tube (mature phage and type I complex) to one where the distal end has an open conformation (type IIa complex infection intermediate) (Fig. 5, C and D).
