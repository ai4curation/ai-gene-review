id: P03749
gene_symbol: J
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:2681611
  label: Escherichia phage Lambda
description: Host specificity protein gpJ (central tail fiber protein) is a large C3-symmetric homotrimeric structural protein
  forming the distal hub and central receptor-binding fiber of the bacteriophage lambda tail tip complex. During tail morphogenesis,
  the gpJ trimer nucleates assembly of the 15S tail tip precursor with gpI, gpL, and gpK; during infection, the C-terminal
  receptor-binding domains of trimeric gpJ bind directly to the trimeric Escherichia coli outer membrane maltoporin LamB,
  mediating irreversible entry receptor attachment and triggering conformational opening of the tail tip complex for gpH*
  extrusion and viral DNA ejection.
