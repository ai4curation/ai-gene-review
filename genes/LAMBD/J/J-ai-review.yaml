- id: PMID:10629200
  title: The C-terminal portion of the tail fiber protein of bacteriophage lambda is responsible for binding to LamB, its
    receptor at the surface of Escherichia coli K-12.
  findings:
  - statement: A purified fusion protein containing only the C-terminal 249 residues of gpJ binds directly to LamB trimers
      in vitro and on intact Escherichia coli cells, blocking bacteriophage lambda adsorption.
    supporting_text: Solid-phase binding assays demonstrated that a purified fusion protein comprising only the last 249 residues
      of J could bind to LamB trimers and inhibited recognition by anti-LamB antibodies. Electron microscopy further demonstrated
      that the fusion protein could also bind to LamB at the surface of intact cells. This interaction prevented lambda adsorption
- id: PMID:16489764
  title: 'Interaction of bacteriophage lambda with its cell surface receptor: an in vitro study of binding of the viral tail
    protein gpJ to LamB (Maltoporin).'
  findings:
  - statement: The C-terminal region of bacteriophage lambda tail protein gpJ mediates binding to the host outer membrane
      receptor LamB (maltoporin).
    supporting_text: The cell surface receptor for bacteriophage Lambda is LamB (maltoporin). Responsible for phage binding
      to LamB is the C-terminal part, gpJ, of phage tail protein J.
- id: PMID:23851014
  title: A balanced ratio of proteins from gene G and frameshift-extended gene GT is required for phage lambda tail assembly.
  findings:
  - statement: Genes J, I, L, and K form the 15S slow-sedimenting tail tip precursor complex during tail assembly.
    supporting_text: From these studies it was clear that a slow sedimenting (15S) precursor produced by genes J, I, L, and
      K could be converted by the actions of genes H, G, and M to a faster sedimenting (25S) initiator of tail shaft polymerization
- id: PMID:41237242
  title: Structural basis of bacteriophage Ur-lambda infection initiation.
  findings:
  - statement: Cryo-EM resolves the trimeric central fiber protein gpJ (residues 1 to 807) in the free Ur-lambda tail tip
      complex at 3.37-Å resolution.
    supporting_text: The tail tip complex serves as the host-recognition apparatus that binds LamB (31). The overall cryo-EM structure of the free Ur-λ tail tip complex, determined at overall resolution 3.37 Å using C3 symmetry (Fig. 2A), reveals the tail tube protein gpV, distal tail protein gpM, and central fiber protein gpJ (residues 1 to 807).
  - statement: During infection, the central fiber gpJ bound to LamB undergoes an acute conformational bend as the tail tip transitions from a closed conformation to an open infection intermediate for genome ejection.
    supporting_text: We built a model of the infection intermediate by leveraging the cryo-EM structure of the λWT tail complex with LamB (13) and the in situ structure derived from cryo-ET and subtomogram averaging (Fig. 5C). It is evident that the central fiber undergoes a marked conformational change and becomes acutely bent as it transitions from a closed tail tube (mature phage and type I complex) to one where the distal end has an open conformation (type IIa complex infection intermediate) (Fig. 5, C and D).
