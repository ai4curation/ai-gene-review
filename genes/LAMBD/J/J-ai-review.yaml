suggested_questions:
- question: How do adaptive point mutations in the C-terminal receptor-binding domain of gpJ that switch phage tropism from
    LamB to the alternative outer membrane porin OmpF alter the mechanical threshold required to trigger iris-like opening
    of the N-terminal gpJ hub?
suggested_experiments:
- description: Determine cryo-EM structures of evolved OmpF-tropic gpJ variants bound to OmpF proteoliposomes before and after
    DNA ejection and compare the inter-domain hinge angles and activation energy of DNA ejection with wild-type gpJ bound
    to LamB.
  hypothesis: Tropism-switching mutations remodel the distal receptor-binding loops while preserving the allosteric mechanical
    lever between the C-terminal receptor-binding domain and the N-terminal tail tip plug.
