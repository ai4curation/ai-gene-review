- id: PMID:15755448
  title: 'Self-association properties of the bacteriophage lambda terminase holoenzyme:
    implications for the DNA packaging motor.'
  findings:
  - statement: >-
      Purified lambda terminase forms a heterotrimer of one gpA subunit and two gpNu1
      subunits that assembles into a tetramer of heterotrimers and catalyzes IHF-dependent
      cos cleavage and viral DNA packaging.
    supporting_text: >-
      We find that purified, recombinant lambda terminase forms a homogeneous, heterotrimeric
      structure, consisting of one gpA molecule associated with two gpNu1 molecules
      (114.2 kDa).
- id: PMID:16618107
  title: 'Bacteriophage lambda gpNu1 and Escherichia coli IHF proteins cooperatively
    bind and bend viral DNA: implications for the assembly of a genome-packaging motor.'
  findings:
  - statement: >-
      gpNu1 binds multiple recognition elements within cos and introduces a strong
      bend in cos-containing DNA cooperatively with E. coli IHF.
    supporting_text: >-
      Further, circular permutation experiments demonstrate that the viral and host
      proteins each introduce a strong bend in cos-containing DNA, but not nonspecific
      DNA substrates.
- id: PMID:2965248
  title: Prediction of an ATP reactive center in the small subunit, gpNu1, of the
    phage lambda terminase enzyme.
  findings:
  - statement: >-
      Purified gpNu1 contains sequence motifs conserved in ATPases and hydrolyzes
      ATP with a low turnover number.
    supporting_text: >-
      The small subunit of the bacteriophage lambda terminase enzyme, the product
      of the phage's Nu1 gene, is shown to contain amino acid segments homologous
      to those present in a large number of ATPases. In keeping with these predictions,
      the purified protein has been found to hydrolyze ATP with a relatively low turnover
      number.
- id: PMID:8611586
  title: Kinetic and mutational dissection of the two ATPase activities of terminase,
    the DNA packaging enzyme of bacteriophage Chi.
  findings:
  - statement: >-
      Note that the PubMed title prints "Chi" due to an indexing/typesetting error
      for the Greek letter lambda; the abstract and study characterize bacteriophage
      lambda terminase (gpNu1 and gpA) and demonstrate a low-affinity, DNA-stimulated
      ATPase site in gpNu1.
    supporting_text: >-
      In summary, the results indicate the presence of a low-affinity, DNA-stimulated
      ATPase center in gpNul, and a high-affinity site in gpA.
- id: file:LAMBD/Nu1/Nu1-uniprot.txt
  title: UniProtKB record for Nu1 (P03707)
  findings:
  - statement: >-
      gpNu1 is the small subunit of the phage lambda terminase complex responsible
      for recognizing cosB packaging initiation elements.
    record_section: ["CC:FUNCTION"]
    supporting_text: >-
      The small subunit is responsible for the binding to multiple recognition elements
      within the packaging initiation site cos (PubMed:15755448, PubMed:16618107,
      PubMed:2989542).
suggested_questions:
- question: >-
    How does ATP binding and hydrolysis at the low-affinity site in gpNu1 allosterically
    trigger the transition of the terminase holoenzyme from a site-specific cos-cleavage
    complex to a mobile DNA translocation motor?
suggested_experiments:
- description: >-
    Determine high-resolution cryo-EM structures of the full-length lambda terminase
    heterotrimer (gpA1-gpNu1_2) bound to cos DNA and IHF in apo, ATP-analog-bound,
    and post-hydrolysis states to resolve inter-subunit allosteric coupling.
  hypothesis: >-
    Nucleotide occupancy in gpNu1 remodels the gpNu1-cosB interface to release the
    motor after cosN cleavage and allow gpA to initiate processive translocation.
