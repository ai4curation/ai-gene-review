id: P03707
gene_symbol: Nu1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:2681611
  label: Escherichia phage lambda
description: >-
  Terminase small subunit (gpNu1) of Escherichia phage lambda that forms the viral
  DNA recognition and regulatory component of the heterotrimeric terminase holoenzyme
  (one gpA large subunit associated with two gpNu1 small subunits). Using an N-terminal
  winged helix-turn-helix domain, gpNu1 binds and bends specific R elements within
  the cosB sub-site of concatemeric viral DNA cooperatively with host integration
  host factor (IHF), positioning the catalytic gpA subunit at cosN to initiate site-specific
  maturation cleavage and ATP-driven viral DNA packaging into the procapsid. It also
  possesses a low-affinity, DNA-stimulated ATPase activity that modulates cos binding
  and cleavage dynamics.
existing_annotations:
- term:
    id: GO:0000166
    label: nucleotide binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000043
  review:
    summary: >-
      gpNu1 specifically binds and hydrolyzes ATP at a low-affinity nucleotide-binding
      site, so the broad keyword mapping to nucleotide binding should be refined to
      ATP binding.
    action: MODIFY
    reason: >-
      Biochemical and mutational analyses demonstrate that gpNu1 contains a low-affinity,
      DNA-stimulated ATP-binding and hydrolysis center [PMID:2965248, PMID:8611586].
      Because the specific nucleotide bound is ATP (already captured by GO:0005524),
      this general keyword-derived term is refined to GO:0005524 (ATP binding).
    proposed_replacement_terms:
    - id: GO:0005524
      label: ATP binding
    supported_by:
    - reference_id: PMID:8611586
      supporting_text: >-
        In summary, the results indicate the presence of a low-affinity, DNA-stimulated
        ATPase center in gpNul, and a high-affinity site in gpA.
- term:
    id: GO:0003677
    label: DNA binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000043
  review:
    summary: >-
      gpNu1 binds specifically to the R1, R2, and R3 recognition elements of the phage
      lambda cosB site and bends the DNA duplex, so the general DNA binding term should
      be refined to sequence-specific DNA binding, bending.
    action: MODIFY
    reason: >-
      Circular permutation and footprinting assays show that gpNu1 recognizes specific
      elements within cosB and introduces a strong bend in cos-containing DNA [PMID:16618107].
      Accordingly, the general keyword-mapped term GO:0003677 (DNA binding) is refined
      to its specific descendant GO:0044374 (sequence-specific DNA binding, bending).
    proposed_replacement_terms:
    - id: GO:0044374
      label: sequence-specific DNA binding, bending
    supported_by:
    - reference_id: PMID:16618107
      supporting_text: >-
        Further, circular permutation experiments demonstrate that the viral and host
        proteins each introduce a strong bend in cos-containing DNA, but not nonspecific
        DNA substrates.
