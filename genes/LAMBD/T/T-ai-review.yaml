suggested_questions:
- question: Does the C-terminal T domain of gpGT induce a conformational switch in monomeric gpV that lowers the kinetic barrier for gpV hexamerization on the 25S tail tip initiator complex?
suggested_experiments:
- description: Determine the high-resolution structure of the isolated T domain of gpGT bound to monomeric gpV by X-ray crystallography or cryo-EM and compare the conformation of T-bound gpV to free monomeric gpV and polymerized hexameric gpV rings.
  hypothesis: Binding of the T domain of gpGT orders flexible loop regions in gpVN required for inter-subunit ring contacts, converting autoinhibited monomeric gpV into a polymerization-competent state at the growing tail tip.
