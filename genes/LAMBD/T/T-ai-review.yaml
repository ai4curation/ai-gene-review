description: Tail assembly protein gpGT is a non-structural cytoplasmic chaperone produced by programmed -1 ribosomal frameshifting from gene G into the overlapping gene T open reading frame during translation of ~3.5% of G transcripts. Comprising an N-terminal G domain that binds gpG and the tail length tape measure protein (gpH) and a C-terminal T domain that binds the major tail tube subunit (gpV), gpGT bridges the chaperone-coated gpH ruler and incoming gpV monomers to direct tail tube polymerization to the proper length before dissociating prior to virion completion.
