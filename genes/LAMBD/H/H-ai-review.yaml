    summary: Broad keyword-derived annotation for viral entry into the host cell.
    action: MODIFY
    reason: During infection, bacteriophage lambda ejects its genome through the host cell envelope via a long flexible tail
      mechanism in which extruded gpH* forms part of the trans-envelope channel. Replacing GO:0046718 with its more specific
      descendant GO:0099001 (already present on this gene) captures the exact mechanism.
