taxon:
  id: NCBITaxon:2681611
  label: Escherichia phage Lambda
description: Tail length tape measure protein gpH is a multifunctional minor tail protein that acts as a molecular ruler to
  determine the exact length of the bacteriophage lambda tail tube during morphogenesis and subsequently forms part of the
  trans-envelope conduit for viral DNA ejection. Chaperoned by gpG and gpGT during assembly, gpH associates with the tail
  tip complex (gpJ, gpI, gpL, gpK, and gpM) to nucleate polymerization of 31 to 32 hexameric rings of the major tail protein
  (gpV), undergoes proteolytic maturation within the tail lumen into gpH* and C-terminal gpHC, and upon host receptor binding
  is extruded to assemble a hexameric trans-envelope channel across the bacterial cell envelope.
