suggested_questions:
- question: Which protein catalyzes the maturation cleavage of gpH between residues ~760 and 818 into gpH* and gpHC—is it
    autoproteolytic, catalyzed by the tail assembly protein gpK (which contains MPN and NlpC/P60 peptidase domains), or mediated
    by another tail tip component?
suggested_experiments:
- description: Reconstitute tail assembly in vitro or in vivo with catalytic-site point mutants in the MPN and NlpC/P60 domains
    of gpK and around the cleavage junction of gpH, then monitor gpH -> gpH* + gpHC processing by SDS-PAGE and mass spectrometry.
  hypothesis: Either gpK's peptidase domain or an autocatalytic triad formed by gpH and the gpI/gpL hub cleaves gpH once tail
    tube polymerization completes, licensing the tail for head attachment and subsequent gpH* ejection.
