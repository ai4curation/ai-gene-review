id: P26814
gene_symbol: bor
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:2681611
  label: Escherichia phage Lambda
description: >-
  Lysogenic conversion lipoprotein (Bor) of Escherichia phage lambda that is constitutively
  expressed from the integrated prophage during lysogeny in Escherichia coli and anchored
  via an N-terminal lipid-modified cysteine in the bacterial host cell envelope. Highly
  homologous to the plasmid ColV2-K94 Iss serum-resistance virulence protein, Bor
  protects the lysogenic E. coli host cell from complement-mediated serum killing.
existing_annotations:
- term:
    id: GO:0020002
    label: host cell plasma membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  supporting_entities:
  - UniProtKB-SubCell:SL-0375
  review:
    summary: >-
      Bor is a lipid-anchored bacterial cell-envelope lipoprotein expressed during
      lysogeny that localizes to the Escherichia coli host cell membrane/envelope
      to confer serum resistance.
    action: ACCEPT
    reason: >-
      Experimental characterization shows that bor is expressed during lysogeny and
      encodes a lipid-anchored host-cell envelope protein that increases survival
      of the E. coli host in animal serum [PMID:2144037].
    supported_by:
    - reference_id: PMID:2144037
      supporting_text: >-
        Here we report that these 'accessory' sequences contain two genes which are
        expressed during lysogeny, and encode host-cell envelope proteins.
    - reference_id: PMID:2144037
      supporting_text: >-
        The other gene, previously unidentified, we designate bor. Expression of bor
        significantly increases the survival of the Escherichia coli host cell in
        animal serum.
core_functions:
- description: >-
    Localizes as a lipid-anchored lipoprotein in the Escherichia coli host cell envelope
    membrane during lysogeny and confers resistance to complement-mediated animal
    serum killing.
  locations:
  - id: GO:0020002
    label: host cell plasma membrane
  supported_by:
  - reference_id: PMID:2144037
    supporting_text: >-
      Here we report that these 'accessory' sequences contain two genes which are
      expressed during lysogeny, and encode host-cell envelope proteins.
  - reference_id: PMID:2144037
    supporting_text: >-
      The other gene, previously unidentified, we designate bor. Expression of bor
      significantly increases the survival of the Escherichia coli host cell in animal
      serum. This property is a well known bacterial virulence determinant--indeed,
      bor and its adjacent sequences are highly homologous to the iss serum resistance
      locus of the plasmid ColV2-K94, which confers virulence in animals.
