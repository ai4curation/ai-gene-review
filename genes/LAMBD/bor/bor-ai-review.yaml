- id: PMID:2144037
  title: A bacterial virulence determinant encoded by lysogenic coliphage lambda.
  findings:
  - statement: >-
      The prophage accessory genes lom and bor are expressed during lysogeny and encode
      host-cell envelope proteins.
    supporting_text: >-
      Here we report that these 'accessory' sequences contain two genes which are
      expressed during lysogeny, and encode host-cell envelope proteins.
  - statement: >-
      Expression of bor increases survival of the E. coli host cell in animal serum
      and is homologous to the plasmid ColV2-K94 iss serum-resistance determinant.
    supporting_text: >-
      The other gene, previously unidentified, we designate bor. Expression of bor
      significantly increases the survival of the Escherichia coli host cell in animal
      serum. This property is a well known bacterial virulence determinant--indeed,
      bor and its adjacent sequences are highly homologous to the iss serum resistance
      locus of the plasmid ColV2-K94, which confers virulence in animals.
suggested_questions:
- question: >-
    At which step of the host complement cascade (e.g., C3b deposition or C5b-9 membrane
    attack complex insertion) does the outer-membrane-anchored Bor lipoprotein block
    serum-mediated bacteriolysis?
suggested_experiments:
- description: >-
    Quantify C3b, C5b-7, and C9 deposition on isogenic E. coli lysogens (wild-type
    lambda vs. lambda delta-bor) exposed to normal human serum using flow cytometry
    and surface plasmon resonance.
  hypothesis: >-
    Surface-exposed Bor inhibits functional insertion of the terminal C5b-9 membrane
    attack complex into the bacterial outer membrane.
