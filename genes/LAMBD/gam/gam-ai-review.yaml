- id: PMID:126236
  title: The gamma protein specified by bacteriophage gamma. Structure and inhibitory activity for the recBC enzyme of Escherichia coli.
  findings:
  - statement: The lambda gam protein is a specific homodimeric inhibitor of the Escherichia coli RecBC nuclease.
    supporting_text: The protein encoded by the gam gene of bacteriophage lambda ("gamma protein") is a specific inhibitor of the recBC enzyme of Escherichia coli.
- id: PMID:1653221
  title: Lambda Gam protein inhibits the helicase and chi-stimulated recombination activities of Escherichia coli RecBCD enzyme.
  findings:
  - statement: Purified Gam inhibits all known enzymatic activities of RecBCD (ATP-dependent dsDNA and ssDNA exonuclease, ssDNA endonuclease, and helicase) without dissociating the RecBCD heterotrimer.
    supporting_text: 'Gam was shown to inhibit all known enzymatic activities of RecBCD: ATP-dependent single- and double-stranded DNA exonucleases, ATP-independent single-stranded endonuclease, and the ATP-dependent helicase.'
- id: PMID:17544443
  title: The crystal structure of lambda-Gam protein suggests a model for RecBCD inhibition.
  findings:
  - statement: Crystal structure of GamS reveals a homodimeric alpha-helical bundle whose surface carboxylates mimic the phosphate backbone of B-form dsDNA to competitively block DNA binding by RecBCD.
    supporting_text: Gam has been shown to bind to RecBCD and inhibit its helicase and nuclease activities. We show that Gam inhibits RecBCD by preventing it from binding DNA.
- id: PMID:4275917
  title: 'Purification and properties of the gamma-protein specified by bacteriophage lambda: an inhibitor of the host RecBC recombination enzyme.'
  findings:
  - statement: Purified lambda gamma-protein (Gam) directly inhibits the host RecBC DNase in vitro.
    supporting_text: We report here experiments that define the inhibitor as the protein product of the gam gene ("gamma-protein") and that characterize the inhibition reaction with highly purified preparations of gamma-protein and RecBC DNase.
- id: file:LAMBD/gam/gam-uniprot.txt
  title: UniProtKB record for P03702 (GAM_LAMBD)
  findings:
  - statement: Both GamL and GamS isoforms bind host RecBCD and inhibit its nuclease and helicase activities by mimicking DNA, protecting viral DNA ends from degradation.
    supporting_text: Both GamL and GamS bind to host RecBCD nuclease and inhibit its activities, protecting the viral DNA against RecBCD mediated degradation (PubMed:126236, PubMed:1653221, PubMed:17544443, PubMed:2943636, PubMed:4275917). Isoform GamS mimics DNA, preventing RecBCD from binding DNA (PubMed:17544443, PubMed:28009252).
suggested_questions:
- question: What is the physiological role of the 40-residue N-terminal extension present in the full-length GamL isoform compared to the shorter GamS isoform during lytic lambda infection?
suggested_experiments:
- description: Compare phage burst size, concatemer accumulation, and in vivo RecBCD inhibition kinetics in lambda phages engineered to express exclusively GamL (M41I mutant) or exclusively GamS (M1I mutant).
  hypothesis: The N-terminal 40-residue extension of GamL modulates protein turnover by host proteases or couples RecBCD inhibition to the Red Exo-Beta recombination complex during the switch from theta to rolling-circle replication.
