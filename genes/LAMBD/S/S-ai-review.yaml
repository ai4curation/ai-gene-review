- id: PMID:11029427
  title: Dimerization between the holin and holin inhibitor of phage lambda.
  findings:
  - statement: S-105 and S-107 form both homodimers and heterodimers within the Escherichia
      coli inner membrane, and heterodimerization mediates antiholin inhibition of
      lysis.
    supporting_text: Indeed, under oxidative conditions efficient heterodimer formation
      between holin and holin inhibitor was observed, if the membranes contained both
      the effector S105τ94 and the inhibitor S107 (Fig. 4 , lane 6).
- id: PMID:11361346
  title: Functional analysis of the phage T4 holin in a lambda context.
  findings:
  - statement: The lambda S gene encodes the canonical phage holin responsible for
      saltatory inner membrane permeabilization and endolysin release during vegetative
      growth.
    supporting_text: Phage lambda hybrids were constructed by inserting the t gene
      of phage T4 in place of the lambda holin gene, S. Induction of the hybrid phage
      resulted in lysis that was just as abrupt as, but occurred much earlier in the
      vegetative cycle than, that obtained with lambda, indicating that t is indeed
      a holin gene.
- id: PMID:21187415
  title: Holin triggering in real time.
  findings:
  - statement: S-105 accumulates uniformly in the inner membrane until triggering
      into large immobile rafts and >300 nm holes, whereas S-107 prevents S-105 raft
      formation until the membrane is depolarized.
    supporting_text: During λ infections, the holin S105 accumulates harmlessly in
      the membrane until, at an allele-specific time, suddenly triggering to form
      irregular holes of unprecedented size (>300 nm), releasing the endolysin from
      the cytoplasm, resulting in lysis within seconds.
- id: PMID:2137120
  title: Oligomerization of the bacteriophage lambda S protein in the inner membrane
    of Escherichia coli.
  findings:
  - statement: Lambda S protein appears 10 minutes after prophage induction and localizes
      exclusively to the Escherichia coli inner membrane, where it forms SDS-resistant
      oligomers.
    supporting_text: Western blot (immunoblot) analysis of cell extracts from induced
      bacteriophage lambda lysogens probed with S-protein-specific antibody (raised
      against an S--beta-galactosidase fusion protein) demonstrated that the bacteriophage
      lambda S protein begins to appear 10 min after phage induction and is localized
      to the inner membrane at all times during the lytic cycle.
- id: PMID:6213604
  title: Effect of the lambda S gene product on properties of the Escherichia coli
    inner membrane.
  findings:
  - statement: Lambda S localizes to the host inner membrane and increases its permeability
      to small molecules.
    supporting_text: The results of these experiments indicate that the lambda S product
      is present in the inner membrane, that it increased the permeability of the
      membrane for all of the small molecules that were tested, and that its action
      is reversible.
- id: PMID:9573208
  title: Purification and biochemical characterization of the lambda holin.
  findings:
  - statement: Purified S-105 holin permeabilizes liposomes in vitro in the absence
      of other proteins, whereas a lysis-defective S missense mutant is inactive.
    supporting_text: The purified protein was then used to achieve release of fluorescent
      dye loaded in liposomes in vitro, whereas protein from an isogenic construct
      carrying an S mutation known to abolish hole formation was inactive in this
      assay.
suggested_questions:
- question: What is the high-resolution atomic structure of the open micron-scale
    S-105 pore wall in native Escherichia coli inner membranes, and how do the amphipathic
    surfaces of TMD1 and TMD3 pack along the lipid edge?
- question: How do environmental or metabolic shifts in host proton motive force quantitatively
    alter the rate of TMD1 translocation in S-107 during superinfection or energy
    starvation?
suggested_experiments:
- description: Perform cryo-electron tomography and subtomogram averaging of triggered
    S-105 lesions in Escherichia coli minicells or giant unilamellar vesicles to resolve
    the transmembrane helix arrangement lining the >300 nm hole perimeter.
- description: Use single-molecule FRET in proteoliposomes with a tunable transmembrane
    electrical potential to measure the voltage threshold and kinetics of S-107 TMD1
    translocation from the cytoplasmic to the periplasmic leaflet.
