core_functions:
- description: Forms micron-scale (>300 nm) lesions in the Escherichia coli inner
    membrane at an allele-specific triggering time (holin S-105 isoform), collapsing
    the proton motive force and releasing cytoplasmic endolysin R into the periplasm
    to drive viral release by host cell cytolysis, while the N-terminally extended
    antiholin isoform (S-107) heterodimerizes with S-105 to negatively regulate raft
    assembly and premature cytolysis until membrane depolarization occurs.
  molecular_function:
