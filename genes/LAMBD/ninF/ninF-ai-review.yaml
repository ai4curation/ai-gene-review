id: P03769
gene_symbol: ninF
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:2681611
  label: Escherichia phage Lambda
description: Uncharacterized 56-amino-acid (6.4 kDa) early protein encoded in the
  translationally coupled ninR region of the bacteriophage lambda pR operon between
  ninE and ninG (rap). Founding member of the conserved phage NinF domain family (Pfam:PF05810,
  InterPro:IPR008712) with three binary protein-protein interactions recorded in IntAct,
  although its specific molecular function and biological role during lambda infection
  remain experimentally uncharacterized.
existing_annotations: []
core_functions:
- description: Uncharacterized early ninR-region protein (56 aa, NinF family PF05810) encoded in the pR operon upstream of rap (ninG) with no experimentally established molecular function or biological process.
  supported_by:
  - reference_id: file:LAMBD/ninF/ninF-uniprot.txt
    supporting_text: 'DR   Pfam; PF05810; NinF; 1.'
references:
- id: file:LAMBD/ninF/ninF-uniprot.txt
  title: UniProtKB entry P03769 (NINF_LAMBD)
  findings:
  - statement: NinF is a 56-residue protein encoded in the ninR region of phage lambda
      belonging to the NinF domain family (PF05810, IPR008712) with 3 binary interactions
      in IntAct.
    supporting_text: 'DR   Pfam; PF05810; NinF; 1.'
suggested_questions:
- question: Does NinF physically interact with the immediately downstream Holliday
    junction endonuclease Rap (NinG) or with Escherichia coli host proteins identified
    in IntAct (P03769)?
- question: What is the three-dimensional structure of the conserved 56-residue NinF
    domain (PF05810)?
suggested_experiments:
- description: Perform affinity purification-mass spectrometry (AP-MS) of epitope-tagged
    NinF during phage lambda infection of Escherichia coli to validate its in vivo
    binding partners.
- description: Determine the solution structure of recombinant NinF by heteronuclear
    NMR spectroscopy and screen for interaction with Rap (NinG) or DNA recombination
    intermediates.
