id: P03771
gene_symbol: ninH
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:2681611
  label: Escherichia phage Lambda
description: Uncharacterized 68-amino-acid (7.6 kDa) early protein encoded in the
  ninR region of the bacteriophage lambda pR operon between ninG (rap) and ninI. Founding
  member of the conserved lambdoid Phage_NinH domain family (Pfam:PF06322, InterPro:IPR010454),
  although its molecular function and physiological role during phage infection remain
  experimentally uncharacterized.
existing_annotations: []
core_functions:
- description: Uncharacterized early ninR-region protein (68 aa, Phage_NinH family PF06322) encoded in the pR operon between rap (ninG) and ninI with no experimentally established molecular function or biological process.
  supported_by:
  - reference_id: file:LAMBD/ninH/ninH-uniprot.txt
    supporting_text: 'DR   Pfam; PF06322; Phage_NinH; 1.'
references:
- id: file:LAMBD/ninH/ninH-uniprot.txt
  title: UniProtKB entry P03771 (NINH_LAMBD)
  findings:
  - statement: NinH is a 68-residue protein encoded in the ninR region of bacteriophage
      lambda and is the founding member of the Phage_NinH domain family (PF06322,
      IPR010454).
    supporting_text: 'DR   Pfam; PF06322; Phage_NinH; 1.'
suggested_questions:
- question: Does NinH bind DNA or modulate the activity of the flanking ninR enzymes
    Rap (NinG, Holliday junction endonuclease) or NinI (lambda protein phosphatase)?
- question: What is the three-dimensional structure of the Phage_NinH domain (PF06322),
    and does it adopt a helix-turn-helix or winged-helix nucleic-acid-binding fold?
suggested_experiments:
- description: Purify recombinant NinH to determine its solution structure by NMR
    and assay double-stranded and branched DNA binding by electrophoretic mobility
    shift assays (EMSAs).
- description: Perform co-immunoprecipitation and mass spectrometry of epitope-tagged
    NinH during phage lambda infection of Escherichia coli to identify viral or host
    binding partners.
