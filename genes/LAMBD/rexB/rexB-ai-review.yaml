suggested_questions:
- question: >-
    Does membrane-embedded RexB inhibit ClpP-mediated proteolysis by directly sequestering ClpX
    or ClpA unfoldase adaptors at the inner membrane, or by altering membrane bioenergetics
    required for ATP-dependent protease activity?
suggested_experiments:
- description: >-
    Planar lipid bilayer electrophysiology of purified reconstituted RexB liposomes before and
    after addition of purified RexA, combined with pull-down assays testing direct interaction
    between RexB cytoplasmic loops and ClpX/ClpA/ClpP.
  hypothesis: >-
    RexB forms a closed homomeric transmembrane bundle that opens into a non-selective
    cation/proton pore only when bound by at least two RexA molecules, while its cytoplasmic
    loops independently bind ClpX/ClpA to modulate substrate turnover.
