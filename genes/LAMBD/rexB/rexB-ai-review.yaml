id: P03759
gene_symbol: rexB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:2681611
  label: Escherichia phage lambda
description: >-
  Polytopic four-transmembrane inner-membrane protein (144 amino acids) of Escherichia phage
  lambda that forms the pore-forming subunit of the prophage-encoded RexAB superinfection
  exclusion system and also modulates host ClpP-dependent proteolysis. Co-expressed with cI and
  rexA in lambda lysogens, RexB resides in the Escherichia coli cytoplasmic membrane and opens as
  an ion-conducting pore upon binding at least two activated RexA molecules during superinfection
  by susceptible phages (such as T4 rII or lambda ren mutants), depolarizing the membrane and
  depleting ATP to abort lytic infection. In addition, RexB inhibits host ClpP protease-mediated
  degradation of short-lived substrates—including the phage lambda replication initiator O and
  the labile antitoxins Phd and MazE of bacterial toxin-antitoxin systems—thereby protecting the
  lysogenic host from toxin-antitoxin-mediated cell death during nutrient stress.
