        promoter -35 element.
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:20599668
  supporting_entities:
  - UniProtKB:P0AAI3
  review:
    summary: >-
      CII is bound and degraded by the host ATP-dependent metalloprotease FtsH (HflB, P0AAI3).
    action: REMOVE
    reason: >-
      Although the physical interaction between CII and the host protease FtsH (P0AAI3) is real
      and mediates CII proteolysis, bare GO:0005515 (protein binding) carries no informative
      molecular function for CII; removing the bare protein-binding row does not dispute the
      substrate-protease interaction.
    supported_by:
    - reference_id: PMID:20599668
      supporting_text: >-
        These membrane proteins copurify as a tightly bound complex 'HflKC' that inhibits the HflB
        (FtsH)-mediated proteolysis of CII both in vitro and in vivo.
