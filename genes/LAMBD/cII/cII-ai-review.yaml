core_functions:
- description: >-
    Binds as a homotetramer to TTGC-N6-TTGC direct repeats flanking the -35 region of the viral
    PRE, PI, and PaQ promoters to activate transcription of cI, int, and antisense Q RNA, thereby
    establishing viral latency.
