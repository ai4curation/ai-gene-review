suggested_questions:
- question: >-
    Does tetramerization and operator DNA binding shield the C-terminal tail of CII from FtsH
    recognition, or can membrane-localized HflD extract CII from promoter complexes to accelerate
    FtsH-mediated proteolysis?
suggested_experiments:
- description: >-
    In vitro reconstituted proteolysis and gel-shift assays measuring FtsH-dependent degradation
    rates of CII bound to PRE promoter DNA in the presence and absence of purified HflD and RNA
    polymerase holoenzyme.
  hypothesis: >-
    Promoter-bound CII-RNAP ternary complexes are resistant to FtsH degradation unless HflD
    first dissociates CII from the DNA template.
