  review:
    summary: Lambda protein phosphatase specifically coordinates a dinuclear Mn2+ cofactor center (2 Mn2+ ions per subunit) in its active site; refine general metal ion binding to manganese ion binding.
    action: MODIFY
    reason: Structural and biochemical data (PDB:1G5B, PMID:11112522) and the UniProt cofactor record establish that lambda PP binds two Mn2+ ions per subunit at its catalytic center, warranting refinement to GO:0030145 (manganese ion binding).
    proposed_replacement_terms:
    - id: GO:0030145
      label: manganese ion binding
    supported_by:
