suggested_questions:
- question: What are the endogenous Escherichia coli or bacteriophage lambda phosphoprotein substrates dephosphorylated by NinI (lambda PP) during lytic infection?
suggested_experiments:
- description: Perform quantitative phosphoproteomics of E. coli cells infected with wild-type lambda versus a catalytically inactive ninI (H76N) mutant phage across early and late infection time points.
  hypothesis: Lambda phosphatase dephosphorylates host signaling or defense kinases (or phosphorylated transcriptional/translational regulators) to remodel host physiology or disarm phosphorylation-dependent phage defense systems.
