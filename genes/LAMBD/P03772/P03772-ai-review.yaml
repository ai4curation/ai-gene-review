  label: Escherichia phage Lambda
description: Calcineurin-like metallophosphoesterase (lambda protein phosphatase, encoded by ninI / ORF221, EC 3.1.3.16 / EC 3.1.3.48) that catalyzes the Mn2+-dependent dephosphorylation of phosphoserine, phosphothreonine, and phosphotyrosine residues in proteins. Adopts a conserved beta-alpha-beta-alpha-beta core fold housing a dinuclear Mn(II) active-site center that activates a bridging water molecule for direct nucleophilic attack on protein phosphomonoester substrates.
