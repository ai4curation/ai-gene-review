core_functions:
- description: Forms the inner membrane subunit (i-spanin) of the periplasm-spanning
    Rz-Rz1 spanin complex and mediates fusion of the Escherichia coli inner and outer
    membranes following peptidoglycan degradation by endolysin R, disrupting the host
    outer membrane to complete cytolytic viral release.
  directly_involved_in:
  - id: GO:0090680
    label: viral release via disruption of host outer membrane
  - id: GO:0061025
    label: membrane fusion
  - id: GO:0044659
    label: viral release from host cell by cytolysis
  locations:
  - id: GO:0020002
    label: host cell plasma membrane
  supported_by:
  - reference_id: PMID:18713319
    supporting_text: Here we present evidence that an Rz-Rz1 complex that spans the
      periplasm carries out the final step in the process of host lysis.
  - reference_id: PMID:22904283
    supporting_text: A model is proposed in which the spanins carry out the essential
      step of disrupting the outer membrane, in a manner regulated by the state of
      the peptidoglycan layer.
  - reference_id: PMID:25870259
    supporting_text: Here we show that the spanins of the paradigm coliphage lambda
      mediate efficient membrane fusion. This supports the notion that the last step
      of lysis is the fusion of the IM and OM.
references:
- id: GO_REF:0000043
  title: Gene Ontology annotation based on UniProtKB/Swiss-Prot keyword mapping
  findings: []
- id: GO_REF:0000120
  title: Combined Automated Annotation using Multiple IEA Methods
  findings: []
- id: PMID:18713319
  title: 'The final step in the phage infection cycle: the Rz and Rz1 lysis proteins
    link the inner and outer membranes.'
  findings:
  - statement: Rz localizes to the Escherichia coli inner membrane and forms a periplasm-spanning
      complex with the outer membrane lipoprotein Rz1.
    supporting_text: When membranes from these induced lysogens were fractionated
      by isopycnic sucrose gradient centrifugation, Rz was found in the IM fraction,
      distributed identically to NADH oxidase activity (Fig. 2B).
- id: PMID:22904283
  title: The spanin complex is essential for lambda lysis.
  findings:
  - statement: Rz-Rz1 spanin complexes are unconditionally required to rupture the
      host outer membrane after endolysin-mediated peptidoglycan degradation; without
      spanins, rod-shaped cells convert to unlysed spherical cells.
    supporting_text: In both cases, lysis failed to occur in inductions of isogenic
      prophages carrying null mutations in the spanin genes. In both systems, instead
      of an envelope rupture, the induced cells were converted from a rod shape to
      a spherical form.
- id: PMID:25870259
  title: Membrane fusion during phage lysis.
  findings:
  - statement: Lambda Rz and Rz1 mediate fusion between the Escherichia coli inner
      and outer membranes to achieve outer membrane disruption during phage lysis.
    supporting_text: Here we show that the spanins of the paradigm coliphage lambda
      mediate efficient membrane fusion. This supports the notion that the last step
      of lysis is the fusion of the IM and OM.
suggested_questions:
- question: What is the atomic-resolution structure of the C-terminal Rz-Rz1 heterotypic
    binding interface, and how does complex formation trigger the disorder-to-alpha-helix
    transition across the periplasmic coiled coils of Rz?
- question: How many Rz-Rz1 heterotetramers must laterally oligomerize within a peptidoglycan
    lesion to nucleate a productive inner-outer membrane fusion pore?
suggested_experiments:
- description: Determine the X-ray or cryo-EM structure of the soluble periplasmic
    disulfide-linked Rz2:Rz1_2 ectodomain complex before and after thermal or lipid-bilayer-induced
    conformational collapse.
- description: Reconstitute full-length disulfide-dimerized Rz and lipidated Rz1 into
    separate donor and acceptor proteoliposomes to measure lipid mixing and content
    mixing kinetics in a purified two-proteoliposome fusion assay.
