    summary: Null mutations in Rz block outer membrane rupture after holin-endolysin
      action, leaving induced lysogens trapped as fragile spherical cells bounded
      by an intact outer membrane.
    action: ACCEPT
    reason: Core biological process of the Rz-Rz1 spanin complex, directly demonstrated
      by genetic loss-of-function and time-lapse phase-contrast microscopy.
