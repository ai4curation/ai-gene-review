id: P03768
gene_symbol: ninE
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:2681611
  label: Escherichia phage Lambda
description: Uncharacterized 60-amino-acid (7.4 kDa) basic early protein (Nin60) encoded
  in the translationally coupled ninR region of the bacteriophage lambda pR operon
  between ninD and ninF. Founding member of the conserved phage NinE protein family
  (Pfam:PF05322, InterPro:IPR007986) with one binary protein interaction recorded
  in IntAct, although its molecular function and physiological role during lambda
  infection remain experimentally uncharacterized.
existing_annotations: []
core_functions:
- description: Uncharacterized basic early ninR-region protein (60 aa, NinE family PF05322) encoded in the pR operon with no experimentally established molecular function or biological process.
  supported_by:
  - reference_id: file:LAMBD/ninE/ninE-uniprot.txt
    supporting_text: 'DR   Pfam; PF05322; NinE; 1.'
references:
- id: file:LAMBD/ninE/ninE-uniprot.txt
  title: UniProtKB entry P03768 (NINE_LAMBD)
  findings:
  - statement: NinE (Nin60) is a 60-residue protein encoded in the ninR region of
      bacteriophage lambda belonging to the NinE domain family (PF05322, IPR007986).
    supporting_text: 'DR   Pfam; PF05322; NinE; 1.'
suggested_questions:
- question: Does the highly basic 60-residue NinE protein (14 Arg/Lys residues) bind
    nucleic acids (DNA or RNA) or interact with neighboring ninR recombination factors
    such as Orf (NinB) and Rap (NinG)?
- question: What is the physiological relevance of the binary interaction recorded
    for NinE in IntAct (P03768)?
suggested_experiments:
- description: Purify recombinant NinE and test its binding affinity for single-stranded
    DNA, double-stranded DNA, Holliday junctions, and RNA using electrophoretic mobility
    shift assays (EMSAs).
- description: Construct a translationally silent nonsense mutation in ninE within
    an otherwise intact ninR operon to test for phenotypes in phage recombination,
    replication, and host range.
