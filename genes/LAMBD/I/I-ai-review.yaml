  label: Escherichia phage Lambda
description: Minor tail protein gpI (baseplate hub protein) is an essential structural subunit of the bacteriophage lambda tail tip complex. Present as a C3-symmetric trimer in the mature tail tip, gpI assembles with the central tail fiber (gpJ), tip attachment protein (gpL), and gpK to form the 15S tail tip precursor during tail morphogenesis, anchors three copies of the C-terminal cleaved fragment of the tape measure protein (gpHC, residues 818-849) within the tail tip lumen, and participates in the conformational opening of the tail tip conduit during viral genome ejection.
