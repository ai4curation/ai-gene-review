suggested_questions:
- question: What is the conformation and function of the N-terminal 133 residues of gpI (which were not resolved in the C3-averaged cryo-EM density of the free tail tip complex in PMID:41237242), and do they insert into the host outer membrane or periplasm during genome ejection?
suggested_experiments:
- description: Perform asymmetric focused classification and cryo-ET subtomogram averaging of the tail tip-LamB complex before and after DNA ejection using phage variants with site-specific labels or deletions in residues 1-133 of gpI.
  hypothesis: The hydrophobic N-terminal region of gpI is flexibly tethered inside the tail tip cavity in free virions and deploys upon LamB binding to anchor the tail tip to the host outer membrane and guide gpH* channel formation.
