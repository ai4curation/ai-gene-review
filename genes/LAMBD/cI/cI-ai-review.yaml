id: P03034
gene_symbol: cI
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:2681611
  label: Escherichia phage lambda
description: >-
  Master transcriptional regulator and immunity repressor of Escherichia phage lambda that
  establishes and maintains the lysogenic (prophage) state in the Escherichia coli host.
  Binds cooperatively as a homodimer to the multipartite operator regions OR (OR1, OR2, OR3)
  and OL (OL1, OL2, OL3) via an N-terminal helix-turn-helix domain, while its C-terminal domain
  mediates homodimerization, cooperative tetramerization between adjacent operator sites, and
  octamerization that bridges OR and OL across a 3.8 kb DNA loop. At lysogenic concentrations,
  occupancy of OR1-OR2 and OL1-OL2 represses the early lytic promoters PR and PL while CI bound
  at OR2 simultaneously activates transcription of its own gene from the maintenance promoter PRM;
  at higher concentrations, DNA looping facilitates cooperative occupancy of OR3 and OL3 to
  negatively autoregulate PRM. Upon host DNA damage and SOS response activation, interaction with
  activated host RecA filaments (RecA*) stimulates an intrinsic C-terminal serine peptidase active
  site (Ser150-Lys193) to catalyze intramolecular autoproteolysis at the Ala111-Gly112 hinge,
  abolishing cooperative operator binding and triggering prophage induction into the lytic cycle.
