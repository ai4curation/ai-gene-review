    supporting_text: >-
      Purified phage lambda repressor also broke down under similar conditions to yield products
      like those resulting from recA protein action.
  - reference_id: PMID:11711436
    supporting_text: >-
      A mutant defective in this CI negative autoregulation forms a lysogen with elevated CI
      levels that cannot efficiently switch from lysogeny to lytic development.
  - reference_id: file:LAMBD/cI/cI-uniprot.txt
    record_section: ["DR:InterPro"]
    supporting_text: >-
      DR   InterPro; IPR015927; Peptidase_S24_S26A/B/C.
suggested_questions:
- question: >-
    How does the conformational asymmetry observed between the two subunits of the operator-bound
    CI homodimer influence the kinetics of RecA*-stimulated intramolecular autoproteolysis in
    DNA-bound versus free CI monomers?
suggested_experiments:
- description: >-
    Single-molecule fluorescence resonance energy transfer (smFRET) combined with cryo-EM of
    intact CI-OR-OL looped nucleoprotein complexes in the presence of RecA* filaments to
    determine whether octameric DNA-bound CI is directly susceptible to RecA*-mediated cleavage
    or requires transient dissociation into monomers.
  hypothesis: >-
    Cooperative octamerization and DNA binding sterically occlude the Ala111-Gly112 hinge region,
    restricting RecA*-stimulated autocleavage primarily to free CI monomers in solution.
