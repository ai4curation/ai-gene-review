core_functions:
- description: >-
    Binds cooperatively as a homodimer, tetramer, and octamer to the OR and OL operator sites to
    repress lytic transcription from PR and PL while positively and negatively autoregulating its
    own transcription from PRM, thereby maintaining the lysogenic prophage state.
  molecular_function:
    id: GO:0001046
    label: core promoter sequence-specific DNA binding
  directly_involved_in:
  - id: GO:0019044
    label: maintenance of viral latency
  - id: GO:0045892
    label: negative regulation of DNA-templated transcription
  - id: GO:0050434
    label: positive regulation of viral transcription
  - id: GO:0098689
    label: latency-replication decision
  supported_by:
  - reference_id: PMID:17908932
    supporting_text: >-
      In the immune (CI-dominant) state, the CI protein is expressed from the lysogenic promoter
      P RM and binds cooperatively to two operators, O R 1 and O R 2, to repress the P R lytic
      promoter and thus block transcription of the cro gene.
  - reference_id: PMID:18432246
    supporting_text: >-
      Here we present the X-ray crystal structure of the intact lambda cI repressor dimer bound
      to a DNA operator site.
- description: >-
    Catalyzes RecA*-stimulated intramolecular autoproteolysis at the Ala111-Gly112 linker hinge via
    its C-terminal Peptidase S24 serine-lysine catalytic dyad, separating the N-terminal
    DNA-binding domain from the C-terminal oligomerization domain to derepress PR and PL and
    trigger release from viral latency during the host SOS response.
  molecular_function:
