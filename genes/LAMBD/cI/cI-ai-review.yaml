- term:
    id: GO:0019046
    label: release from viral latency
  evidence_type: IMP
  original_reference_id: PMID:11711436
  qualifier: involved_in
  review:
    summary: >-
      RecA*-stimulated autoproteolytic cleavage of CI abolishes cooperative operator binding and
      triggers prophage induction (switching from lysogeny to lytic development).
    action: NEW
    reason: >-
      Inactivation of lambda CI repressor by RecA-stimulated autodigestion in response to host SOS
      DNA damage (PMID:6231641) and negative autoregulation of lysogenic CI levels (PMID:11711436)
      govern efficient prophage induction (release from viral latency).
    supported_by:
