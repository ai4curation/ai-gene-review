- id: PMID:6231641
  title: Autodigestion of lexA and phage lambda repressors.
  findings:
  - statement: >-
      Purified phage lambda CI repressor catalyzes intramolecular autodigestion yielding the same
      cleavage products generated by activated RecA protein.
    supporting_text: >-
      Purified phage lambda repressor also broke down under similar conditions to yield products
      like those resulting from recA protein action.
- id: PMID:11711436
  title: >-
    Octamerization of lambda CI repressor is needed for effective repression of P(RM) and
    efficient switching from lysogeny.
  findings:
  - statement: >-
      CI dimers cooperatively form tetramers at adjacent operator sites and octamers that bridge
      OR and OL across a 3.8 kb DNA loop, which is required to repress PRM at lysogenic CI
      concentrations.
    supporting_text: >-
      Pairs of CI dimers interact to cooperatively occupy adjacent operator sites at O(R) and at
      O(L). These CI tetramers repress the lytic promoters and activate transcription of the cI
      gene from P(RM). CI is also able to octamerize, forming a large DNA loop between O(R) and O(L)
  - statement: >-
      Limiting lysogenic CI concentration through negative autoregulation at OR3 is required for
      efficient prophage induction from lysogeny to lytic development upon UV irradiation.
    supporting_text: >-
      A mutant defective in this CI negative autoregulation forms a lysogen with elevated CI
      levels that cannot efficiently switch from lysogeny to lytic development.
- id: PMID:17908932
  title: >-
    Cro's role in the CI Cro bistable switch is critical for {lambda}'s transition from lysogeny
    to lytic development.
  findings:
  - statement: >-
      CI binds cooperatively to OR1 and OR2 to repress the lytic promoter PR while simultaneously
      activating its own transcription from PRM, maintaining viral latency.
    supporting_text: >-
      In the immune (CI-dominant) state, the CI protein is expressed from the lysogenic promoter
      P RM and binds cooperatively to two operators, O R 1 and O R 2, to repress the P R lytic
      promoter and thus block transcription of the cro gene.
- id: PMID:18432246
  title: >-
    Crystal structure of the lambda repressor and a model for pairwise cooperative operator binding.
  findings:
  - statement: >-
      X-ray crystallography reveals the structure of the full-length lambda CI homodimer bound to
      operator DNA, showing the asymmetric positioning of the N-terminal DNA-binding and
      C-terminal oligomerization domains.
    supporting_text: >-
      Here we present the X-ray crystal structure of the intact lambda cI repressor dimer bound
      to a DNA operator site.
- id: PMID:21873207
  title: >-
    Multilevel autoregulation of λ repressor protein CI by DNA looping in vitro.
  findings:
  - statement: >-
      DNA loops in prophage lambda contain four CI dimers (an octamer bridging OR1-OR2 and
      OL1-OL2) and can recruit an additional dimer pair bridging OR3 and OL3 to repress PRM.
    supporting_text: >-
      Our results confirm that DNA loops in prophage λ are likely to contain, in the absence of
      mutations, four CI dimers (two CI at O R 1 ∼ O R 2 and two at O L 1 ∼ O L 2 forming an
      octamer) or six CI dimers (an additional dimer pair connecting O R 3 and O L 3).
- id: PMID:21943085
  title: >-
    The protein interaction map of bacteriophage lambda.
  findings:
  - statement: >-
      The C-terminal domain of lambda CI self-associates into an octamer that links the OR and OL
      operator regions.
    supporting_text: >-
      Forms octamer that links OR to OL
