id: P03761
gene_symbol: ren
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:2681611
  label: Escherichia phage lambda
description: >-
  Early lytic anti-exclusion protein (96 amino acids) of Escherichia phage lambda, encoded
  immediately downstream of the replication genes O and P in the rightward PR operon, that
  protects lytically replicating phage lambda from self-exclusion by the prophage-encoded RexAB
  abortive infection system. Without functional Ren, lytic lambda DNA replication triggers
  RexA-dependent activation of the RexB inner-membrane pore and premature cessation of phage
  growth; Ren counteracts this pathway so that prophage induction and homoimmune superinfection
  variants can complete the lytic cycle.
existing_annotations: []
references:
- id: PMID:1372278
  title: >-
    The Rex system of bacteriophage lambda: tolerance and altruistic cell death.
  full_text_unavailable: true
  findings:
  - statement: >-
      Lambda ren mutants are excluded by the RexAB system in lambda lysogens, and overexpression
      of RexB suppresses the exclusion of both T4 rII mutants and lambda ren mutants.
    supporting_text: >-
      We have determined that overexpression of RexB in lambda lysogens prevents the exclusion of
      both T4 rII mutants and lambda ren mutants.
- id: PMID:6221115
  title: Nucleotide sequence of bacteriophage lambda DNA.
  full_text_unavailable: true
  findings: []
core_functions:
- description: >-
    Counteracts activation of the prophage-encoded RexAB abortive infection system during lytic
    phage lambda replication, preventing premature membrane depolarization and self-exclusion.
  supported_by:
  - reference_id: PMID:1372278
    supporting_text: >-
      We have determined that overexpression of RexB in lambda lysogens prevents the exclusion of
      both T4 rII mutants and lambda ren mutants.
suggested_questions:
- question: >-
    Does lambda Ren prevent RexAB activation by directly binding and inhibiting cytoplasmic RexA,
    by stabilizing RexB in a closed conformation, or by masking the phage DNA replication
    intermediates that trigger RexA?
suggested_experiments:
- description: >-
    Co-immunoprecipitation and bacterial two-hybrid interaction screens testing binary and
    ternary interactions among Ren, RexA, RexB, and the lambda O/P replication complex in
    Escherichia coli.
  hypothesis: >-
    Ren binds directly to RexA or the RexA-RexB interface to prevent RexA from reaching the
    two-RexA-per-RexB stoichiometry required to open the RexB pore.
