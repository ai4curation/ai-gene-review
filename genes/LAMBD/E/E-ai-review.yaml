  review:
    summary: gpE is the form-determining major structural protein of the lambda head shell, which specifically forms a T=7
      icosahedral viral capsid, so this general term should be refined to GO:0039620.
    action: MODIFY
    reason: Genetic analysis of form-determining gpE mutants [PMID:2141087] and cryo-EM reconstructions [PMID:8411174] establish
      that gpE subunits assemble as hexamers and pentamers on a T=7 icosahedral lattice. Therefore, the general term GO:0019028
      (viral capsid) is refined to its already-annotated specific descendant GO:0039620 (T=7 icosahedral viral capsid).
    proposed_replacement_terms:
    - id: GO:0039620
      label: T=7 icosahedral viral capsid
    supported_by:
    - reference_id: PMID:2141087
      supporting_text: Some mutations in the major capsid protein (gpE) of lambda phage can alter the size and shape of the
        head shell or block the pathway of head maturation.
    - reference_id: PMID:8411174
      supporting_text: The mature lambda capsid contains two major proteins, gpE and gpD, arranged on a T = 7 lattice, with
        gpE arranged as hexamers and pentamers and gpD arranged as trimers.
