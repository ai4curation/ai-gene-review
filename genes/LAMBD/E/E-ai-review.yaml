- id: PMID:2141087
  title: Structure and inherent properties of the bacteriophage lambda head shell. VII. Molecular design of the form-determining
    major capsid protein.
  findings:
  - statement: Mutations in the major capsid protein gpE alter the size and shape of the lambda head shell or block head maturation.
    supporting_text: Some mutations in the major capsid protein (gpE) of lambda phage can alter the size and shape of the
      head shell or block the pathway of head maturation.
- id: PMID:265585
  title: Assembly of biologically active proheads of bacteriophage lambda in vitro.
  findings:
  - statement: Cytoplasmic gpE monomers or small polymers assemble into biologically active proheads in vitro.
    supporting_text: Centrifugation analysis shows that the Nu3- extract contributes gpE, the major capsid protein, to the
      reaction in the form of monomers or small polymers.
- id: PMID:8411174
  title: Structural transitions during maturation of bacteriophage lambda capsids.
  findings:
  - statement: In the mature lambda capsid, gpE forms hexamers and pentamers on a T=7 icosahedral lattice decorated by gpD
      trimers.
    supporting_text: The mature lambda capsid contains two major proteins, gpE and gpD, arranged on a T = 7 lattice, with
      gpE arranged as hexamers and pentamers and gpD arranged as trimers.
  - statement: In the procapsid, gpE forms elongated, skewed hexamers with subunits oriented perpendicularly to the capsid
      surface prior to expansion.
    supporting_text: The procapsid has elongated, irregularly shaped hexamers with gpE subunits set perpendicularly to the
      capsid surface.
suggested_questions:
- question: How does DNA packaging pressure trigger the cooperative rotation and flattening of all 405 gpE subunits across
    the T=7 lattice during procapsid expansion?
suggested_experiments:
- description: Perform time-resolved cryo-EM of in vitro DNA packaging reactions stalled at intermediate filling fractions
    (20%, 30%, 40% genome length) to capture the transition state of gpE lattice expansion.
  hypothesis: Mechanical strain at the portal-adjacent gpE hexamers nucleates a wave of E-loop unfolding and subunit rotation
    that propagates rapidly across the icosahedral shell.
