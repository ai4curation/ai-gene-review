  label: Escherichia phage Lambda
description: Major capsid protein (gpE) of Escherichia phage lambda that self-assembles around the gpNu3 internal scaffold
  and gpB portal complex in the host cytoplasm to form the T=7 icosahedral procapsid shell (60 hexamers and 11 pentamers,
  totaling 405 subunits). During viral DNA genome packaging, the gpE lattice undergoes a large irreversible conformational
  expansion from an angular procapsid to a thin-walled mature T=7 icosahedral capsid, exposing inter-subunit binding sites
  for trimers of the decoration protein gpD; a subset of gpE subunits also undergoesgpC-catalyzed covalent fusion and processing
  to form the minor capsid proteins pX1 and pX2.
