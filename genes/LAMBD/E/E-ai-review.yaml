core_functions:
- description: Forms the hexameric and pentameric capsomeres of the T=7 icosahedral procapsid and mature viral capsid in the
    host cytoplasm, undergoing a large conformational expansion during DNA packaging that thins and stabilizes the head shell
    and exposes binding sites for the gpD decoration protein.
