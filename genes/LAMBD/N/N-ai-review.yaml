id: P03045
gene_symbol: N
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:2681611
  label: Escherichia phage lambda
description: >-
  Intrinsically disordered immediate-early transcription antitermination factor (107 amino acids)
  of Escherichia phage lambda that remodels host bacterial RNA polymerase (RNAP) into a
  processive, termination-resistant elongation complex to allow expression of delayed-early viral
  genes. Its N-terminal arginine-rich motif folds into a bent alpha-helix upon binding the boxB
  RNA stem-loop within the nutL and nutR sites of nascent viral transcripts, while its central
  and C-terminal segments bind directly to host NusA and thread through the bacterial RNAP core
  enzyme alongside host factors NusB, NusE (ribosomal protein S10), and NusG. Within the
  assembled transcription antitermination complex, N stabilizes the RNAP conformation, remodels
  the RNA exit channel to prevent formation of intrinsic termination hairpins, blocks Rho access,
  and contacts upstream duplex DNA to suppress RNAP backtracking and swiveling, enabling readthrough
  of both intrinsic and Rho-dependent terminators downstream of PL and PR.
