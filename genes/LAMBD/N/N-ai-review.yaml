      activating regions for antitermination: a newly identified NusA-binding region (amino acids
      34-47) that suppresses NusA's enhancement of termination, and a carboxy-terminal region
      (amino acids 73-107) that interacts directly with RNA polymerase.
  - reference_id: PMID:30795892
    supporting_text: >-
      Bacteriophage λN protein, a model anti-termination factor, binds nascent RNA and host Nus
      factors, rendering RNA polymerase resistant to all pause and termination signals.
suggested_questions:
- question: >-
    How is the intrinsically disordered C-terminal segment of lambda N threaded into the
    interior of an actively transcribing RNA polymerase elongation complex in vivo without
    requiring complex disassembly?
suggested_experiments:
- description: >-
    Time-resolved cryo-EM and single-molecule fluorescence co-localization tracking the sequential
    recruitment of lambda N, NusA, and NusB-NusE to an elongating RNAP complex as the nut boxA-boxB
    RNA emerges from the RNA exit channel.
  hypothesis: >-
    Anchoring of the N-terminal ARM to boxB and central domain to NusA positions the C-terminal
    segment at the RNAP cleft rim, enabling progressive zipping through the clamp and protrusion
    crevice during a transient transcriptional pause.
