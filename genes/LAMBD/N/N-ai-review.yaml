  original_reference_id: GO_REF:0000043
  review:
    summary: >-
      Electronic annotation for DNA binding from UniProtKB keyword mapping.
    action: KEEP_AS_NON_CORE
    reason: >-
      Cryo-EM structural analysis of the complete lambda N transcription antitermination complex
