- id: PMID:9063900
  title: >-
    Complexes of N antitermination protein of phage lambda with specific and nonspecific RNA target
    sites on the nascent transcript.
  full_text_unavailable: true
  findings:
  - statement: >-
      Lambda N is unstructured in solution or when bound nonspecifically to single-stranded RNA
      (Kd ~ 10^-6 M), but folds into an alpha-helical structure upon forming a tight 1:1 complex
      with its cognate boxB RNA hairpin (Kd ~ 10^-9 M).
    supporting_text: >-
      In contrast N becomes partially folded with at least 16-18 amino acids of ordered
      alpha-helical structure and binds much more tightly (Kd approximately 10(-9) M) on forming
      a highly specific 1:1 complex with its cognate boxB RNA hairpin.
- id: PMID:9659923
  title: >-
    Independent ligand-induced folding of the RNA-binding domain and two functionally distinct
    antitermination regions in the phage lambda N protein.
  full_text_unavailable: true
  findings:
  - statement: >-
      Lambda N comprises an N-terminal RNA-binding domain (residues 1-22), a central NusA-binding
      region (residues 34-47), and a C-terminal RNA polymerase-interacting region (residues 73-107)
      required for processive transcription antitermination.
    supporting_text: >-
      Efficient antitermination by N requires an RNA-binding domain (amino acids 1-22) and two
      activating regions for antitermination: a newly identified NusA-binding region (amino acids
      34-47) that suppresses NusA's enhancement of termination, and a carboxy-terminal region
      (amino acids 73-107) that interacts directly with RNA polymerase.
- id: PMID:28452979
  title: >-
    Structural basis for λN-dependent processive transcription antitermination.
  full_text_unavailable: true
  findings:
  - statement: >-
      Lambda N cooperates with host factors NusA, NusB, NusE, and NusG and the nut RNA site to
      render elongating bacterial RNA polymerase resistant to termination.
    supporting_text: >-
      λN-mediated processive antitermination constitutes a paradigmatic transcription regulatory
      event, during which phage protein λN, host factors NusA, NusB, NusE and NusG, and an RNA
      nut site render elongating RNA polymerase termination-resistant.
- id: PMID:30795892
  title: >-
    Structural Basis for the Action of an All-Purpose Transcription Anti-termination Factor.
  full_text_unavailable: true
  findings:
  - statement: >-
      Cryo-EM structure reveals how lambda N binds nascent RNA and host Nus factors to render RNA
      polymerase resistant to pause and termination signals while lining upstream DNA to reinforce
      NusG anti-backtracking and anti-swiveling.
    supporting_text: >-
      Bacteriophage λN protein, a model anti-termination factor, binds nascent RNA and host Nus
      factors, rendering RNA polymerase resistant to all pause and termination signals.
core_functions:
- description: >-
    Binds specifically to the boxB RNA stem-loop of nascent nutL/nutR viral transcripts via its
    N-terminal arginine-rich motif and simultaneously engages host NusA and the bacterial RNA
    polymerase core enzyme (along with NusB, NusE, and NusG) to remodel the elongation complex
    and mediate transcription antitermination.
