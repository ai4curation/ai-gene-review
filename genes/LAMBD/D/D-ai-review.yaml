- id: PMID:18786402
  title: 'Bacteriophage lambda stabilization by auxiliary protein gpD: timing, location, and mechanism of attachment determined
    by cryo-EM.'
  findings:
  - statement: Cryo-EM reveals gpD trimers at the 3-fold axes of the expanded lambda capsid, where their N-terminal residues
      add a beta-strand to a beta-sheet formed by gpE capsid proteins to stabilize the shell.
    supporting_text: A prominent surface feature at the 3-fold axes corresponds to the cementing protein gpD, which is necessary
      for stabilization of the capsid shell.
  - statement: The N-terminal residues of gpD augment a beta-sheet of the major capsid protein to stabilize the expanded particle.
    supporting_text: The N-terminal residues of gpD are well ordered in the cryo-EM density, adding a strand to a beta-sheet
      formed by the capsid proteins and explaining the mechanism of particle stabilization.
- id: PMID:18801370
  title: 'Packaging of a unit-length viral genome: the role of nucleotides and the gpD decoration protein in stable nucleocapsid
    assembly in bacteriophage lambda.'
  findings:
  - statement: gpD is required to stabilize the fully expanded capsid during packaging of the final 8-10 kb of the unit-length
      lambda genome.
    supporting_text: While not required for DNA translocation into the capsid, the phage lambda capsid decoration protein
      gpD is essential for the packaging of the penultimate 8-10 kb (15-20%) of the viral genome; virtually no DNA is packaged
      in the absence of gpD when large DNA substrates are used, most likely due to a loss of capsid structural integrity.
- id: PMID:25053840
  title: Major capsid reinforcement by a minor protein in herpesviruses and phage.
  findings:
  - statement: AFM nano-indentation demonstrates that binding of gpD trimers at the 3-fold and quasi-3-fold axes stiffens
      and mechanically reinforces the expanded lambda capsid.
    supporting_text: Our data reveal that the loosely formed capsid structure is reinforced post-assembly by the minor capsid
      protein UL25 in HSV-1 and gpD in bacteriophage λ. Using atomic force microscopy nano-indentation analysis, we show that
      the capsid becomes stiffer upon binding of UL25 and gpD due to increased structural stability.
  - statement: Procapsid expansion exposes hydrophobic E-loops between gpE subunits, allowing gpD triplexes to bind at all
      3-fold and quasi-3-fold capsid axes.
    supporting_text: Pressure from the encapsidated DNA triggers an expansion of the procapsid, which exposes the hydrophobic
      E-loops between the gpE subunits (48). This allows binding of the gpD protein, forming a triplex that binds to all 3-fold
      and quasi 3-fold axes on the capsid (Figure 2B).
