    id: GO:0030430
    label: host cell cytoplasm
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  review:
    summary: gpD is synthesized in the Escherichia coli cytoplasm and assembles onto expanding capsids during intracellular
      virion morphogenesis.
    action: ACCEPT
    reason: Capsid expansion and cooperative binding of gpD decoration trimers occur in the bacterial host cytoplasm during
      viral genome packaging [PMID:18801370, file:LAMBD/D/D-uniprot.txt].
