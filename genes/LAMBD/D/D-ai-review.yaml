id: P03712
gene_symbol: D
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:2681611
  label: Escherichia phage lambda
description: Capsid decoration protein (gpD) of Escherichia phage lambda that assembles as homotrimeric spikes at the three-fold
  and quasi-three-fold axes on the exterior surface of the expanded T=7 icosahedral capsid. When DNA packaging triggers procapsid
  expansion, hydrophobic binding sites between major capsid protein (gpE) subunits are exposed and cooperatively bound by
  gpD trimers, whose N-terminal beta-strands augment gpE beta-sheets to mechanically cement the capsid shell against high
  internal DNA pressure and allow packaging of the full-length viral chromosome.
existing_annotations:
- term:
    id: GO:0019028
    label: viral capsid
  evidence_type: IEA
  original_reference_id: GO_REF:0000043
  review:
    summary: gpD specifically forms the exterior decoration layer of the mature viral capsid, so the general viral capsid
      term should be refined to GO:0098021.
    action: MODIFY
    reason: Cryo-EM and atomic force microscopy studies show that gpD trimers bind specifically as decoration spikes at the
      exterior three-fold and quasi-three-fold axes of the expanded capsid [PMID:18786402, PMID:25053840]. The broad term
      GO:0019028 (viral capsid) is therefore refined to its already-annotated specific descendant GO:0098021 (viral capsid,
      decoration).
    proposed_replacement_terms:
    - id: GO:0098021
      label: viral capsid, decoration
    supported_by:
    - reference_id: PMID:18786402
      supporting_text: A prominent surface feature at the 3-fold axes corresponds to the cementing protein gpD, which is necessary
        for stabilization of the capsid shell.
    - reference_id: PMID:25053840
      supporting_text: This allows binding of the gpD protein, forming a triplex that binds to all 3-fold and quasi 3-fold
        axes on the capsid (Figure 2B).
- term:
    id: GO:0019073
    label: viral DNA genome packaging
  evidence_type: IDA
  original_reference_id: PMID:18801370
  review:
    summary: Binding of gpD trimers to the expanded procapsid reinforces the capsid shell so that the terminase motor can
      complete packaging of the penultimate 15-20% of the viral DNA genome without loss of capsid integrity.
    action: ACCEPT
    reason: Defined in vitro DNA packaging assays demonstrate that while gpD is not required for DNA translocation itself,
      gpD decoration stabilizes the fully expanded capsid and is essential for packaging the final 8-10 kb of the unit-length
      viral genome [PMID:18801370].
    supported_by:
    - reference_id: PMID:18801370
      supporting_text: While not required for DNA translocation into the capsid, the phage lambda capsid decoration protein
        gpD is essential for the packaging of the penultimate 8-10 kb (15-20%) of the viral genome; virtually no DNA is packaged
        in the absence of gpD when large DNA substrates are used, most likely due to a loss of capsid structural integrity.
