suggested_questions:
- question: How does the N-terminal arm (residues 1-14) of gpD cooperatively lock into the expanded gpE quasi-threefold interface
    to prevent reversible capsid contraction?
suggested_experiments:
- description: Perform single-molecule optical tweezers packaging and atomic force microscopy nanoindentation on expanded
    proheads decorated with N-terminally truncated gpD mutants.
  hypothesis: The N-terminal 14-residue strand of gpD forms an intermolecular beta-sheet augmentation with adjacent gpE subunits
    that provides the primary mechanical clamp against internal DNA pressure.
