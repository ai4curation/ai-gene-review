  review:
    summary: Cryo-EM reconstruction demonstrates that gpD trimers bind at the 3-fold and quasi-3-fold axes on the expanded
      capsid exterior and add a beta-strand to the gpE shell to stabilize the particle.
    action: ACCEPT
    reason: Direct cryo-EM structural analysis confirms that gpD forms the exterior decoration spikes that cement the expanded
      icosahedral shell [PMID:18786402].
    supported_by:
