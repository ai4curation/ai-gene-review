- id: PMID:23911548
  title: Chaperone-protein interactions that mediate assembly of the bacteriophage lambda tail to the correct length.
  findings:
  - statement: The T domain of the frameshift-extended chaperone gpGT binds directly to the major tail shaft subunit gpV to
      promote gpV polymerization along the gpH tape measure scaffold.
    supporting_text: We show that the "G" domains of gpG and gpGT bind to all or parts of tail length tape measure protein
      gpH and that the "T" domain of gpGT binds to major tail shaft subunit gpV, and present a model for how gpG and gpGT
      chaperone gpH and direct the polymerization of gpV to form a tail of the correct length.
- id: PMID:41237242
  title: Structural basis of bacteriophage Ur-lambda infection initiation.
  findings:
  - statement: Cryo-EM shows that the 132.7-nm bacteriophage Ur-lambda tail tube is composed of 31 stacked hexameric discs
      of gpV.
    supporting_text: The 132.7-nm tail tube is composed of 31 discs of gpV
  - statement: The lumen of the stacked gpV rings encloses the cleaved tape measure protein gpH* and serves as the conduit
      for genome delivery.
    supporting_text: The tail tube is a stack of gpV rings whose lumen contains a cleaved form of gpH, called gpH*; cleavage
      occurs after tail assembly but before its attachment to a head
  - statement: The distal gpV ring abuts the hexameric gpM ring in the tail tip complex.
    supporting_text: The overall cryo-EM structure of the free Ur-λ tail tip complex, determined at overall resolution 3.37
      Å using C3 symmetry (Fig. 2A), reveals the tail tube protein gpV, distal tail protein gpM, and central fiber protein
      gpJ (residues 1 to 807).
