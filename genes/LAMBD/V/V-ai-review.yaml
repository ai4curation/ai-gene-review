suggested_questions:
- question: Does the C-terminal immunoglobulin-like Big2 domain of gpV (gpVC), which projects outward from the tail tube shaft,
    interact transiently with bacterial cell-surface carbohydrates to assist phage positioning prior to LamB engagement?
suggested_experiments:
- description: Measure adsorption kinetics and single-particle surface diffusion on Escherichia coli cells for lambda virions
    carrying full-length gpV versus viable gpVC-deleted tail tube variants in both stf+ (Ur-lambda) and stf- (lambda PaPa)
    backgrounds.
  hypothesis: The surface-exposed Big2 domain (gpVC) mediates weak, reversible interactions with the bacterial outer surface
    that enhance two-dimensional scanning when side tail fibers (gpStf) are absent.
