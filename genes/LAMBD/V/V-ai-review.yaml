id: P03733
gene_symbol: V
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:2681611
  label: Escherichia phage Lambda
description: Major tail protein gpV is the principal structural subunit of the long, flexible, non-contractile tail tube of
  bacteriophage lambda. Comprising an N-terminal tube-forming domain (gpVN) and a C-terminal immunoglobulin-like Big2 domain
  (gpVC), gpV polymerizes upon encountering the tail tip initiation complex (gpM/gpL) and the gpH-gpG-gpGT chaperone-tape
  measure scaffold into a stack of 31 to 32 C6-symmetric hexameric rings that enclose the tape measure protein (gpH*) and
  form the hollow conduit for viral DNA ejection into the host cell.
