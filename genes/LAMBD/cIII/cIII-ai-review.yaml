suggested_questions:
- question: >-
    How does the oligomeric amphipathic alpha-helix of CIII associate with the cytoplasmic basket
    or membrane-proximal pore of the hexameric FtsH AAA+ protease to outcompete CII without being
    rapidly cleared?
suggested_experiments:
- description: >-
    Cryo-EM structural determination of the membrane-reconstituted Escherichia coli FtsH hexamer
    bound to oligomeric lambda CIII peptides in the presence of ATPgammaS.
  hypothesis: >-
    CIII oligomers bind across multiple FtsH protomers near the substrate entry pore, sterically
    blocking C-terminal degron engagement while resisting single-chain translocation into the
    proteolytic chamber.
