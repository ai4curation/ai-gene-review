  label: Escherichia phage lambda
description: >-
  Small oligomeric amphipathic alpha-helical protease inhibitor (54 amino acids) of Escherichia
  phage lambda that promotes the establishment of lysogeny by inhibiting the host ATP-dependent
  membrane metalloprotease FtsH (HflB). Expressed during early infection from the leftward
  promoter PL, CIII binds directly to FtsH and acts as a competitive inhibitor that prevents
  FtsH from binding and degrading the unstable phage transcriptional activator CII (as well as
  the host heat-shock sigma factor sigma32). By extending the half-life of CII, CIII enables
  coordinate activation of the PRE, PI, and PaQ promoters required for prophage integration and
  repression of lytic development.
