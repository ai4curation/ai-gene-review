- id: PMID:6221115
  title: Nucleotide sequence of bacteriophage lambda DNA.
  full_text_unavailable: true
  findings: []
- id: PMID:6458018
  title: The DNA sequence of the phage lambda genome between PL and the gene bet.
  full_text_unavailable: true
  findings:
  - statement: >-
      Determines the DNA sequence of the phage lambda PL operon region containing the kil gene
      between cIII and gam.
    supporting_text: >-
      The sequence thus includes the genes, N, ral, Ea10, cIII, kil and gam, as well as the
      transcription terminators TL1 and TL2.
- id: PMID:24651041
  title: >-
    The Kil peptide of bacteriophage λ blocks Escherichia coli cytokinesis via ZipA-dependent
    inhibition of FtsZ assembly.
  findings:
  - statement: >-
      Expression of bacteriophage lambda kil induces filamentation of Escherichia coli cells by
      rapid, ZipA-dependent inhibition of FtsZ ring assembly at the nascent division site.
    supporting_text: >-
      Here we report that expression of bacteriophage λ kil, either from a resident phage or from a
      plasmid, induces filamentation of Escherichia coli cells by rapid inhibition of FtsZ ring
      formation.
  - statement: >-
      Affinity-tagged Kil interacts directly with both FtsZ and ZipA and inhibits sedimentation of
      FtsZ filament bundles in vitro.
    supporting_text: >-
      An affinity-tagged-Kil derivative interacts with both FtsZ and ZipA, and inhibits
      sedimentation of FtsZ filament bundles in vitro.
