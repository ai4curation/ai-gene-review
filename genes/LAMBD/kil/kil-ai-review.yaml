id: P03758
gene_symbol: kil
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:2681611
  label: Escherichia phage lambda
description: >-
  Delayed-early host-killing and cell-division inhibitor protein of Escherichia phage lambda,
  encoded in the PL operon between cIII and gam. During lytic development, Kil blocks Escherichia
  coli cytokinesis by interfering with ZipA-dependent assembly of the tubulin-like cell division
  protein FtsZ into a contractile Z-ring at midcell, causing host cell filamentation, preventing
  premature septation over replicating phage genomes, and delaying host lysis.
