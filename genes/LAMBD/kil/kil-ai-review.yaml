  title: The DNA sequence of the phage lambda genome between PL and the gene bet.
  full_text_unavailable: true
  findings:
  - statement: >-
      Determines the DNA sequence of the phage lambda PL operon region containing the kil gene
      between cIII and gam.
    supporting_text: >-
      The sequence thus includes the genes, N, ral, Ea10, cIII, kil and gam, as well as the
      transcription terminators TL1 and TL2.
- id: file:genes/LAMBD/kil/kil-notes.md
  title: Curation notes for Escherichia phage lambda kil
  findings:
  - statement: >-
      Lambda Kil blocks host bacterial cell division by inhibiting FtsZ ring assembly in a
      ZipA-dependent manner, resulting in cell filamentation during lytic infection.
    supporting_text: >-
      Lambda Kil interacts with the essential bacterial tubulin-like cytokinesis protein FtsZ (in
      a manner requiring the membrane anchor ZipA in vivo) to disrupt GTP-dependent FtsZ
      protofilament bundling and Z-ring assembly at midcell, blocking cytokinesis during lytic
      infection.
core_functions:
- description: >-
    Interacts with the host cell division machinery (FtsZ/ZipA) in the host cytoplasm to block
    septum formation and cytokinesis during lytic infection.
  supported_by:
  - reference_id: file:genes/LAMBD/kil/kil-notes.md
    supporting_text: >-
      Lambda Kil interacts with the essential bacterial tubulin-like cytokinesis protein FtsZ (in
      a manner requiring the membrane anchor ZipA in vivo) to disrupt GTP-dependent FtsZ
      protofilament bundling and Z-ring assembly at midcell, blocking cytokinesis during lytic
      infection.
suggested_questions:
- question: >-
    What is the structural basis for the requirement of the ZipA C-terminal FtsZ-binding domain
    to recruit lambda Kil to FtsZ protofilaments in vivo?
suggested_experiments:
- description: >-
    Co-sedimentation and cryo-EM analysis of FtsZ polymers assembled on ZipA-decorated lipid
    nanodiscs in the presence and absence of synthetic lambda Kil peptide.
  hypothesis: >-
    ZipA binding to the FtsZ C-terminal peptide creates a composite docking surface that
    increases Kil affinity for the FtsZ protofilament lateral interface.
