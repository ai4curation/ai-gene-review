suggested_questions:
- question: >-
    What is the structural basis for the requirement of the ZipA C-terminal FtsZ-binding domain
    to recruit lambda Kil to FtsZ protofilaments in vivo?
suggested_experiments:
- description: >-
    Co-sedimentation and cryo-EM analysis of FtsZ polymers assembled on ZipA-decorated lipid
    nanodiscs in the presence and absence of synthetic lambda Kil peptide.
  hypothesis: >-
    ZipA binding to the FtsZ C-terminal peptide creates a composite docking surface that
    increases Kil affinity for the FtsZ protofilament lateral interface.
