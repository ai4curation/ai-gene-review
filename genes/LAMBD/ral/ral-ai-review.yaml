references:
- id: GO_REF:0000043
  title: Gene Ontology annotation based on UniProtKB/Swiss-Prot keyword mapping
  findings: []
- id: PMID:3023633
  title: >-
    Modification enhancement by the restriction alleviation protein (Ral) of bacteriophage lambda.
  full_text_unavailable: true
  findings:
  - statement: >-
      Lambda Ral interacts with the HsdM or HsdS subunits of the Escherichia coli K-12 Type I
      restriction-modification enzyme to alleviate restriction and enhance methylation of
      unmodified DNA target sites.
    supporting_text: >-
      Our data support a model in which, as a consequence of the interaction of Ral with either
      the hsdM or the hsdS polypeptide, the conformation of the enzyme is changed and the
      efficiency of methylation of unmodified target sites is enhanced.
