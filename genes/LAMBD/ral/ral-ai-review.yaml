    supporting_text: >-
      The sequence thus includes the genes, N, ral, Ea10, cIII, kil and gam, as well as the
      transcription terminators TL1 and TL2.
core_functions:
- description: >-
    Binds the HsdM/HsdS methyltransferase core of the host EcoKI Type I restriction-modification
    enzyme to inhibit endonucleolytic restriction and stimulate de novo methylation of unmodified
    viral DNA.
  directly_involved_in:
  - id: GO:0099018
    label: symbiont-mediated evasion of host restriction-modification system
  supported_by:
  - reference_id: PMID:3023633
    supporting_text: >-
      Our data support a model in which, as a consequence of the interaction of Ral with either
      the hsdM or the hsdS polypeptide, the conformation of the enzyme is changed and the
      efficiency of methylation of unmodified target sites is enhanced.
suggested_questions:
- question: >-
    What is the structural mechanism by which the small 66-residue Ral protein allosterically
    unlocks EcoKI methyltransferase activity on unmethylated DNA substrates without mimicking
    B-form DNA?
suggested_experiments:
- description: >-
    Cryo-EM structural analysis of the purified Escherichia coli EcoKI methyltransferase trimer
    (HsdM2S1) and holoenzyme (HsdR2M2S1) complexed with recombinant lambda Ral and an unmethylated
    DNA substrate.
  hypothesis: >-
    Ral binds at the HsdM-HsdS hinge interface, stabilizing the closed methylation-competent
    conformation that EcoKI normally adopts only in the presence of a hemimethylated adenine.
