taxon:
  id: NCBITaxon:2681611
  label: Escherichia phage lambda
description: >-
  Early anti-restriction and modification-enhancement protein (66 amino acids) of Escherichia
  phage lambda, encoded in the PL operon between N and cIII, that counteracts the host
  Escherichia coli Type I restriction-modification system (EcoKI, HsdR2M2S1). Rather than acting
  as a DNA mimic, Ral interacts directly with the HsdM/HsdS methyltransferase-specificity core of
  EcoKI to shift its conformational state, inhibiting restriction endonuclease cleavage of
  unmodified viral DNA while stimulating de novo adenine methylation of completely unmethylated
  EcoKI recognition sites so that newly replicated phage genomes become modified and protected.
