  review:
    summary: ORF290 (P03766) contains a conserved Rossmann-like PAPS reductase catalytic domain (InterPro:IPR002500), and because its exact biochemical reaction in phage lambda has not been experimentally determined, catalytic activity is the most specific supported term.
    action: ACCEPT
    reason: Supported by the presence of the conserved PAPS reductase / Rossmann-like enzymatic domain (InterPro:IPR002500, Pfam:PF01507); no more specific substrate or reaction has been experimentally demonstrated for lambda ORF290.
