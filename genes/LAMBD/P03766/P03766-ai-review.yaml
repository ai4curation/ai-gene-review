  label: Escherichia phage Lambda
description: Uncharacterized 290-amino-acid enzyme (ORF290 / NinC) encoded in the ninR region of bacteriophage lambda between ninB and ninF. Contains a conserved Rossmann-like alpha/beta/alpha domain homologous to the phosphoadenosine phosphosulfate (PAPS) reductase / PP-loop ATP pyrophosphatase superfamily (residues 67-252), indicative of an nucleotide- or nucleic-acid-modifying catalytic activity whose physiological substrate during phage infection remains unknown.
