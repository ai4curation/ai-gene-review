suggested_questions:
- question: Does lambda ORF290 (NinC) catalyze ATP-dependent adenylation or sulfur/methyl transfer on nucleic acids or host defense proteins to protect phage DNA from restriction-modification systems?
suggested_experiments:
- description: Purify recombinant lambda ORF290, screen for nucleotide binding and pyrophosphatase/transferase activity in the presence of ATP, PAPS, and phage/host DNA or RNA substrates, and test ninC deletion mutants against panel of E. coli restriction and defense systems.
  hypothesis: ORF290 uses a PP-loop-like mechanism to modify nucleic acid or nucleotide substrates as an accessory anti-defense or recombination-promoting factor in the ninR operon.
