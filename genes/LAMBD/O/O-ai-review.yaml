suggested_questions:
- question: What is the full cryo-EM architecture of the intact four-iteron O-some bound to the P5:DnaB6 helicase loader complex prior to DnaK/DnaJ/GrpE chaperone remodeling?
suggested_experiments:
- description: Determine the single-particle cryo-EM structure of full-length lambda O assembled on the complete four-iteron ori lambda DNA together with P and E. coli DnaB.
  hypothesis: Torsional strain generated by wrapping the four iterons around the O-some core directly melts the adjacent AT-rich element and positions the exposed single-stranded DNA into the cracked central channel of the P5:DnaB6 ring.
