id: P03688
gene_symbol: O
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:2681611
  label: Escherichia phage Lambda
description: Origin-recognition and replication initiator protein required for early bidirectional theta-mode replication of the bacteriophage lambda double-stranded DNA genome. Binds cooperatively via its N-terminal winged-helix domain to four 19-bp iteron repeats within the phage replication origin (ori lambda) to assemble the nucleosome-like O-some complex, and recruits the phage P-host DnaB helicase loader complex via its C-terminal domain to initiate origin unwinding.
