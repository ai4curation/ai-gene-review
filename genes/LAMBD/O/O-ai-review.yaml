    id: GO:0003677
    label: DNA binding
  evidence_type: IDA
  original_reference_id: PMID:2525129
  qualifier: enables
  review:
    summary: Lambda O protein specifically recognizes and binds the four iterons of the lambda replication origin (ori lambda) to form the O-some; refine general DNA binding to DNA replication origin binding.
    action: MODIFY
    reason: Both PMID:2525129 and the UniProt record show that lambda O specifically binds the replication origin (ori lambda) during replication initiation, supporting refinement of GO:0003677 to its descendant GO:0003688 (DNA replication origin binding).
    proposed_replacement_terms:
    - id: GO:0003688
      label: DNA replication origin binding
    supported_by:
    - reference_id: PMID:2525129
      supporting_text: As previously described, the first stage in this process is the binding of multiple copies of the lambda O initiator to the lambda replication origin (ori lambda) to form the nucleosomelike O-some.
    - reference_id: file:LAMBD/O/O-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: It interacts with the ori (origin of replication) region of the genome during the initiation of replication.
