id: P03756
gene_symbol: ea22
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:2681611
  label: Escherichia phage Lambda
description: Early pL-operon protein of 182 amino acids (20.9 kDa) belonging to the
  conserved lambdoid Ead/Ea22 family (Pfam:PF13935, InterPro:IPR025153). Contains
  a central coiled-coil region (residues 63-90) and a C-terminal alpha+beta homodimerization
  domain (residues 102-182) whose solution NMR structure has been determined (PDB:8DSX),
  though its direct molecular target in Escherichia coli remains experimentally uncharacterized.
existing_annotations: []
core_functions:
- description: Early pL-operon accessory protein (182 aa, Ead/Ea22 family PF13935) containing a central coiled-coil region and a C-terminal homodimerization domain (PDB:8DSX) with no experimentally established molecular function in Escherichia phage lambda.
  supported_by:
  - reference_id: file:LAMBD/ea22/ea22-uniprot.txt
    supporting_text: 'DR   PDB; 8DSX; NMR; -; A/B=102-182.'
references:
- id: file:LAMBD/ea22/ea22-uniprot.txt
  title: UniProtKB entry P03756 (EA22_LAMBD)
  findings:
  - statement: Ea22 is a 182-residue Ead/Ea22-family protein (IPR025153, PF13935)
      with a central coiled-coil region (residues 63-90) and a homodimeric C-terminal
      domain (residues 102-182) resolved by solution NMR (PDB:8DSX).
    supporting_text: 'DR   PDB; 8DSX; NMR; -; A/B=102-182.'
suggested_questions:
- question: What host or viral macromolecule binds to the conserved C-terminal homodimeric
    domain (residues 102-182, PDB:8DSX) of lambda Ea22?
- question: Does lambda Ea22 modulate the lytic-lysogenic decision or prophage induction
    threshold in Escherichia coli in a manner similar to Stx-phage Ea22 homologs?
suggested_experiments:
- description: Compare prophage induction kinetics, lysogenization frequency, and
    host survival after UV or mitomycin C treatment between wild-type lambda and an
    isogenic delta-ea22 mutant in Escherichia coli.
- description: Perform affinity pull-down and mass spectrometry using full-length
    Ea22 and its isolated C-terminal domain (residues 102-182) against Escherichia
    coli cell lysates to identify binding partners.
