id: P68658
gene_symbol: ea10
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:2681611
  label: Escherichia phage Lambda
description: Early leftward pL-operon accessory protein Ea10 (122 AA, DUF2528 family) encoded in the non-essential b-N region of bacteriophage lambda. Genetically associated with the Tro phenotype, in which derepressed leftward transcription in cro-deficient, thermolabile cI mutant phages triggers shutoff of host Escherichia coli macromolecular synthesis at restrictive temperatures, although its direct molecular target and biochemical mechanism remain uncharacterized.
existing_annotations: []
core_functions:
- description: Early pL-operon accessory protein (DUF2528 family) associated with the Tro phenotype and shutoff of host macromolecular synthesis in cro-deficient phages.
  supported_by:
  - reference_id: file:LAMBD/ea10/ea10-uniprot.txt
    supporting_text: The ea10 gene protein is believed to be involved in the production of the Tro phenotype. This phenotype is expressed when phages that possess a mutant cro gene and a thermolabile cI repressor gene are unable to propagate at restrictive temperatures. This inability is correlated with the shutoff of host macromolecular synthesis.
references:
- id: file:LAMBD/ea10/ea10-uniprot.txt
  title: UniProtKB record for P68658 (EA10_LAMBD)
  findings:
  - statement: The ea10 gene product is a 122-AA DUF2528-family protein believed to contribute to the Tro phenotype correlated with shutoff of host macromolecular synthesis when cro-mutant, thermolabile cI phages are grown at restrictive temperatures.
    supporting_text: The ea10 gene protein is believed to be involved in the production of the Tro phenotype. This phenotype is expressed when phages that possess a mutant cro gene and a thermolabile cI repressor gene are unable to propagate at restrictive temperatures. This inability is correlated with the shutoff of host macromolecular synthesis.
suggested_questions:
- question: Does purified Ea10 directly bind single-stranded nucleic acids or interact with a specific Escherichia coli translation or transcription factor to mediate the Tro host-shutoff phenotype?
suggested_experiments:
- description: Express individual clean open reading frames from the pL-ea10-ral region in E. coli coupled with affinity purification-mass spectrometry (AP-MS) and metabolic pulse-labeling of DNA, RNA, and protein synthesis.
  hypothesis: Ea10 binds a conserved host macromolecular synthesis factor or nucleic acid intermediate, and its overproduction in the absence of Cro repression contributes to growth arrest.
