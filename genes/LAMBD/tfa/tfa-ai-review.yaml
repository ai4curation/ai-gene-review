  review:
    summary: General keyword-derived annotation for viral tail assembly.
    action: MODIFY
    reason: gpTfa acts specifically in the assembly of the side tail fibers (gpStf) rather than the main tail shaft or baseplate; therefore GO:0098003 (viral tail assembly) should be refined to its more specific descendant GO:0098004 (virus tail fiber assembly), which is already annotated to this gene.
    proposed_replacement_terms:
    - id: GO:0098004
      label: virus tail fiber assembly
    supported_by:
    - reference_id: PMID:1439823
      supporting_text: 'The Ur-lambda virions have thin, jointed tail fibers that are absent from lambda wild type. Two novel proteins of Ur-lambda constitute the fibers: the product of stf, the gene that is disrupted in lambda wild type by the frameshift mutation, and the product of gene tfa, a protein that is implicated in facilitating tail fiber assembly. Relative to lambda wild type, Ur-lambda has expanded receptor specificity and adsorbs to Escherichia coli cells more rapidly.'
