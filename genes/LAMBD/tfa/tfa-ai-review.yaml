  label: Escherichia phage Lambda
description: Tail fiber assembly protein gpTfa is a dedicated chaperone encoded immediately downstream of the side tail fiber gene (stf) in bacteriophage lambda that promotes the folding and assembly of the long, jointed side tail fibers (gpStf) onto the virion tail tip complex.
