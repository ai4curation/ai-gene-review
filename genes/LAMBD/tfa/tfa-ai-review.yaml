suggested_questions:
- question: Does gpTfa act solely as a transient cytoplasmic folding chaperone for the C-terminal OmpC-binding domain of gpStf (analogous to T4 gp38), or does a copy of gpTfa remain capped onto the distal tip of each mature Ur-lambda side tail fiber (analogous to Salmonella phage S16 gp38)?
suggested_experiments:
- description: Co-express His-tagged gpStf and untagged gpTfa in Escherichia coli, purify the resulting trimeric side tail fibers, and determine by SEC-MALS, quantitative mass spectrometry, and X-ray crystallography whether gpTfa dissociates after folding or remains stably bound at the distal receptor-binding tip.
  hypothesis: gpTfa transiently binds the C-terminal beta-helical receptor-binding domain of nascent gpStf monomers to nucleate trimerization and prevent aggregation in the host cytoplasm.
