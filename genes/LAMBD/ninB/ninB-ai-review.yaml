  label: Escherichia phage Lambda
description: Homodimeric single-stranded DNA-binding recombination mediator protein (NinB / Orf, 146 AA) encoded in the ninR region of bacteriophage lambda. Supplies a phage-encoded functional analog of the Escherichia coli RecFOR mediator complex that binds single-stranded DNA via a positively charged central groove (PDB:1PC6) and interacts with host SSB to promote homologous DNA recombination during phage infection.
