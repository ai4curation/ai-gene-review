suggested_questions:
- question: Does lambda NinB directly load phage Red beta (bet) as well as host RecA onto SSB-coated single-stranded DNA overhangs in vivo?
suggested_experiments:
- description: Reconstitute SSB-coated 3'-overhang DNA substrates in vitro with purified NinB, host RecA, and phage Red beta to compare mediator activity toward host vs. phage recombinases.
  hypothesis: NinB remodels the C-terminal tail of E. coli SSB to accelerate displacement of SSB by RecA during early theta-phase recombination repairs before high levels of Red Exo-Beta accumulate.
