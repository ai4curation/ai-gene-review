    summary: NinB (Orf) is a homodimeric single-stranded DNA-binding recombination mediator protein structurally and biochemically characterized in PMID:16076958 (PDB:1PC6).
    action: NEW
    reason: Purified NinB (Orf) directly binds DNA with preference for single-stranded over duplex DNA substrates (PMID:16076958; PDB:1PC6).
