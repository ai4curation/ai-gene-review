  label: Oryza sativa Japonica Group
description: OsFY is a rice WD-repeat protein of the WDR33/Pfs2 family, encoded by the experimentally
  cloned DQ132809 sequence. Its seven WD repeats and C-terminal proline-rich motifs support a conserved
  RNA-processing partner role, and the cloned protein interacts with OsFCA-gamma in yeast two-hybrid assays.
  Its participation in nuclear mRNA 3-prime end processing is inferred from its specific family membership
  and conserved interaction architecture. Direct RNA cleavage, polyadenylation-signal recognition and
  an Arabidopsis-like FLC regulatory circuit have not been demonstrated for this rice clone.
