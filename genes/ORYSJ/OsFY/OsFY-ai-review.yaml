suggested_questions:
- question: Does endogenous OsFY directly recognize polyadenylation signals or contribute to recognition
    only within assembled rice CPSF?
- question: What native rice RNA-processing and heading-date phenotypes follow OsFY depletion, independently
    of Arabidopsis complementation?
suggested_experiments:
- description: Tag the endogenous OsFY locus and combine nuclear localization, partner purification and
    RNA-end profiling after conditional depletion.
