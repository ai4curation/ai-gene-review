  review:
    summary: A direct rice SLAC1 role in response to changing light conditions was not verified.
    action: UNDECIDED
    reason: The annotation is transferred from Arabidopsis SLAC1. General guard-cell physiology
      makes light responsiveness plausible, but the inspected rice sources test channel regulation,
      water loss, and ABA-related mechanisms rather than a light-response experiment attributable to
