  - araport11:AT1G12480.1
  - InterPro:IPR030183
  review:
    summary: OsSLAC1 is a nitrate-selective anion channel.
    action: MODIFY
    reason: The channel mechanism is sound, but the current term label restricts the substrate to
      monoatomic anions. PMID:26481009 explicitly reports nitrate selectivity and no obvious
      chloride permeability. Although the GO textual definition retains older broad-anion wording,
      use the unambiguous nitrate transporter term. Detailed voltage dependence is not independently
      re-adjudicated from the abstract-only source. The parallel channel-activity replacement
      preserves the independently supported pore mechanism without claiming voltage gating from an
      abstract.
    supported_by:
    - *id001
    proposed_replacement_terms:
    - &id002
      id: GO:0015112
      label: nitrate transmembrane transporter activity
    - id: GO:0015267
      label: channel activity
