  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cached full text read. The body locus Os04g18530 is inconsistent with current
      annotation, but the preserved bioinformatics analysis matches published full-length and
      fragment primers to Q7XTX7, with SAPK10 as independent positive control. The promoter primer
