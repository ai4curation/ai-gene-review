- term:
    id: GO:0090332
    label: stomatal closure
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - AGI_LocusCode:AT1G12480
  - PANTHER:PTN000777780
  review:
    summary: OsSLAC1 channel activity supports stomatal closure and water conservation.
    action: ACCEPT
    reason: The PAINT assertion represents inherited SLAC1 effector function, not a weak one-donor
      transfer. Native rice guard-cell expression, plasma-membrane localization and lower water loss
      on overexpression corroborate the channel role, while expression of rice OsSLAC1 rescues
      drought hypersensitivity of Arabidopsis slac1-3. These experiments support the conserved
      closure function without asserting identical substrate preference or every upstream stimulus
      response in rice.
    supported_by:
    - *id003
    - &id007
      reference_id: PMID:31134357
      supporting_text: transgenic rice overexpressing SAPK10 or OsSLAC1 showed significantly less
        water loss than control.
    - &id008
      reference_id: PMID:26481009
      supporting_text: the expression of OsSLAC1 in Arabidopsis slac1-3 (atslac1-3) mutant
        successfully rescued the hypersensitive phenotype of this mutant to drought stress.
