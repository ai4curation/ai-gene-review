- term:
    id: GO:0006873
    label: intracellular monoatomic ion homeostasis
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR030183
  review:
    summary: The channel participates in guard-cell ion balance, but monoatomic-ion homeostasis is
      not established for the rice protein.
    action: MARK_AS_OVER_ANNOTATED
    reason: GO:0006873 explicitly concerns a steady-state level of single-atom ions. The rice
      electrophysiology identifies nitrate, a polyatomic anion, as the permeant substrate and
      reports no obvious chloride permeability. Effects of membrane depolarization on downstream
      potassium channels do not by themselves establish that SLAC1 maintains monoatomic-ion
      homeostasis. Retain the supported nitrate-transport and stomatal functions without equating
      anion conductance with this more specific homeostasis claim.
    supported_by:
    - &id001
      reference_id: PMID:26481009
      supporting_text: OsSLAC1 is a nitrate-selective anion channel without obvious permeability to
        chloride, malate, and sulfate
- term:
    id: GO:0008308
    label: voltage-gated monoatomic anion channel activity
  evidence_type: IEA
