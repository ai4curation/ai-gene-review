  label: Oryza sativa Japonica Group
description: 'SLAC1 is a slow-type anion channel in the plasma membrane of rice guard cells. It preferentially
  conducts nitrate, with no obvious chloride, malate, or sulfate permeability in the reported heterologous
  electrophysiological assay. Its anion conductance contributes to stomatal closure and limits water loss.
  The channel is activated by the ABA-responsive kinase SAPK8 through phosphorylation of its N-terminal
  region and interacts with SAPK10 and the clade A phosphatases PP2C50 and PP2C53. SAPK10 phosphorylates
  the N-terminal region in vitro; these interactions connect the channel to the guard-cell ABA signaling
  network.'
