- id: PMID:26491145
  title: ABA Regulates Subcellular Redistribution of OsABI-LIKE2, a Negative Regulator in ABA Signaling, to
    Control Root Architecture and Drought Resistance in Oryza sativa.
  findings:
  - statement: SAPK10 interacts with the ABA phosphatase ABIL2/PP2C53; target-specific localization is curated
      in UniProt.
    supporting_text: OsABIL2 interacts with OsPYL1, SAPK8 and SAPK10 both in vitro and in vivo
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cached abstract read together with the target-specific curated UniProt statements; no
      negative inference is made from abstract omissions.
- id: PMID:28827170
  title: Modulation of ABA Signaling by Altering VxGΦL Motif of PP2Cs in Oryza sativa.
  findings:
  - statement: Mutations at the PP2C50 receptor interface change rice ABA signaling; SAPK10 participates in
      this regulatory context.
    supporting_text: In rice protoplasts, ABA signaling was altered by mutations in the VxGΦL motif.
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cached abstract read together with the target-specific curated UniProt statements; no
      negative inference is made from abstract omissions.
