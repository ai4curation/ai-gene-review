taxon:
  id: NCBITaxon:39947
  label: Oryza sativa Japonica Group
description: SAPK10 is an ABA- and hyperosmotic-stress-activated subgroup III SnRK2 serine/threonine kinase in
  rice. It acts in nuclear and cytosolic signaling compartments and phosphorylates the guard-cell anion
  channel OsSLAC1. Guard-cell expression and reduced water loss in SAPK10-overexpressing rice support a role
  in stomatal water conservation. Clade A PP2C phosphatases, including PP2C50 and PP2C53, interact with SAPK10
  and restrain this ABA-responsive signaling branch.
