  evidence_type: IMP
  original_reference_id: PMID:24474809
  qualifier: involved_in
  review:
    summary: PYL5 influences physiological responses to abiotic stress through ABA signaling.
    action: KEEP_AS_NON_CORE
    reason: PYL5 overexpression alters stress-responsive transcription and drought, salt and osmotic
      phenotypes (PMID:24474809). These are supported organism-level consequences of its core ABA receptor
      role, not additional catalytic activities.
    supported_by:
