id: Q6I5C3
gene_symbol: PYL5
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:39947
  label: Oryza sativa Japonica Group
description: 'PYL5, also known as RCAR5, is an intracellular abscisic acid receptor in rice that acts in the nucleus
  and cytosol. It binds and inhibits selected clade A PP2C phosphatases, promoting downstream SAPK kinase and bZIP
  transcription-factor signaling. Its receptor activity regulates ABA-responsive gene expression, germination, seedling
  growth and adaptation to water and salt stress. The monomeric receptor can inhibit PP2C06 without added ABA in
  biochemical assays, whereas its signaling output in rice protoplasts depends on ABA concentration and receptor
  abundance.'
