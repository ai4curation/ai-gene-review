gene_symbol: PIN2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:39947
  label: Oryza sativa Japonica Group
description: OsPIN2 is a canonical PIN-family auxin efflux carrier in rice. It localizes asymmetrically
  at the plasma membrane of root epidermal and cortical cells and contributes to auxin redistribution,
  root gravitropic responses and root growth angle. Native mutants and complementation establish
  its developmental transport role; overexpression also alters shoot-to-root auxin distribution
  and tiller architecture. Transport function and homodimeric organization are supported by
  conserved PIN biochemistry, with homodimerization inferred from Arabidopsis PIN1 rather than
  directly measured for rice PIN2.
