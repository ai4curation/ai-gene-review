    CC   -!- FUNCTION: Disease resistance (R) protein. Resistance proteins guard the
    CC       plant against pathogens that contain an appropriate avirulence protein
    CC       via an indirect interaction with this avirulence protein. That triggers
    CC       a defense system including the hypersensitive response, which restricts
    CC       the pathogen growth. Contribution of RGA5 is required to recognize the
    CC       effector avirulence proteins AVR-Pia and AVR1-CO39 from M.oryzae
    CC       (PubMed:21251109, PubMed:23548743). Acts as a constitutively active
    CC       cell death inducer that is repressed by RGA5 (PubMed:25024433). Immune
    CC       response triggered by the RGA4-RGA5 -mediated recognition of AVR1-CO39
    CC       confers resistance to X.oryzae pathovars (PubMed:27289079).
    CC       {ECO:0000269|PubMed:21251109, ECO:0000269|PubMed:23548743,
    CC       ECO:0000269|PubMed:25024433, ECO:0000269|PubMed:27289079}.
    CC   -!- SUBUNIT: Forms homodimer or heterodimer with RGA5 through its coiled
    CC       coil (CC) domain. {ECO:0000269|PubMed:25024433}.
    CC   -!- SUBCELLULAR LOCATION: Cytoplasm {ECO:0000269|PubMed:25024433}.
    CC   -!- TISSUE SPECIFICITY: Expressed in leaves. {ECO:0000269|PubMed:21251109}.
    CC   -!- SIMILARITY: Belongs to the disease resistance NB-LRR family.
    CC       {ECO:0000305}.
