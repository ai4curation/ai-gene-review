    source_reference_id: PMID:41039041
    predicted_term:
      id: GO:0034051
      label: negative regulation of plant-type hypersensitive response
    predicted_term_type: GO_BP
    review:
      assessment: NPI
      confidence_score: 0
      error_type: FREQUENCY_BIAS
      summary: >-
        Top-ranked hit (score 15.60). Nothing links OsRGLG4 to hypersensitive-response
        regulation; the characterised RGLG activities are auxin-transport regulation
        (RGLG2), ABA signalling via PP2CA degradation (RGLG1/RGLG5) and GRXS17
        ubiquitination (AtRGLG4). Plant defence-response terms are among the most heavily
        annotated biological processes in the plant portion of SwissProt, and this looks
        like that prior asserting itself over the RING/vWA architecture the sequence
        actually carries.
      supported_by:
        - reference_id: GO_REF:0000033
          supporting_text: Annotation inferences using phylogenetic trees
