id: Q6YYC5
gene_symbol: OsRGLG4
taxon:
  id: NCBITaxon:39947
  label: Oryza sativa subsp. japonica
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for rice OsRGLG4, a RING-type E3 ubiquitin ligase
  with vWA and copine-related domains. The two ProTrek text channels disagree sharply on
  this protein. Its free-text Function retrieval identifies the family exactly - the top
  three hits are the UniProt FUNCTION comments of Arabidopsis RGLG1/RGLG2/RGLG4,
  including "E3 ubiquitin-protein ligase that mediates the formation of 'Lys-63'-linked
  ubiquitin chains" - while its GO channel returns five plant defence and hormone
  signalling processes and never mentions ubiquitination, ligase activity or the nucleus,
  all of which are already in GOA by IBA. ProtNLM2 on the same protein predicted
  ubiquitin protein ligase activity and K63-linked ubiquitination, matching this review's
  core function. This is the benchmark's most direct demonstration that ProTrek's GO
  index and its free-text index behave as different predictors.
  Assessment: 0 correct (COR/CNN/LSP), 1 uncertain (UNC), 2 incorrect (NPI).
source_documents:
  - projects/PROTREK_EVALUATION/argo50_protrek_hits.tsv
  - genes/ORYSJ/Q6YYC5/Q6YYC5-uniprot.txt
