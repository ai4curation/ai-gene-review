predictions:
  - source_method: ProtNLM2
    source_version: UniProt 2024_06 pilot
    predicted_term:
      id: GO:0070534
      label: protein K63-linked ubiquitination
    predicted_term_type: GO_BP
    review:
      assessment: UNC
      confidence_score: 1
      summary: >-
        Q6YYC5 carries a RING domain and the RGLG4 subfamily assignment, so generic protein
        ubiquitination is supported, and the gene already carries GO:0016567 by IBA. The
        linkage-specific refinement has no direct support. Lys63-linked chain formation in
        vitro was shown for Arabidopsis RGLG2 (PMID:17586653), in the RGLG1/RGLG2 branch,
        whereas Q6YYC5 is sister to RGLG4 by PANTHER placement and by the OpenScientist
        identity and neighbor-joining analysis. The RGLG3/RGLG4 clade has ligase activity
        and drives GRXS17 degradation with the E2 UBC30 (PMID:27497447), but no linkage
        assay exists for it. Degradative outcomes do not separate the branches, because
        RGLG1/RGLG2 also mediate proteasomal degradation of AtERF53 (PMID:22095047). Lys63
        chain formation requires a Ubc13-type E2 heterodimer, so the RING domain alone
        cannot settle linkage. The PANTHER family review scores this term as unresolved and
        the gene review leaves linkage as an open question. The prediction is neither
        supported nor refuted; a linkage assay with the rice cognate E2 would be needed.
      supported_by:
        - reference_id: file:ORYSJ/Q6YYC5/Q6YYC5-uniprot.txt
          supporting_text: >-
            DR   InterPro; IPR001841; Znf_RING. ... DR   PANTHER; PTHR45751:SF16; E3 UBIQUITIN-PROTEIN
            LIGASE RGLG4; 1. ... FT   DOMAIN          356..389 ... FT                   /note="RING-type"
        - reference_id: PMID:17586653
          supporting_text: >-
            It can form Lys-63–linked multiubiquitin chains in an in vitro reaction.
        - reference_id: PMID:17586653
          supporting_text: >-
            The formation of Lys-63–linked chains requires a heterodimeric E2 enzyme, formed by
            canonical E2 Ubc13 and another UBC fold protein
        - reference_id: PMID:27497447
          supporting_text: >-
            pinpoint UBC30 as a cognate E2 UBC capable of interacting with RGLG3 and RGLG4
            and mediating auto-ubiquitination of RGLG3 and ubiquitination of GRXS17 in
            vitro. Accordingly, GRXS17 is ubiquitinated and degraded in an RGLG3- and
            RGLG4-dependent manner in planta.
        - reference_id: PMID:22095047
          supporting_text: >-
            RGLG2 and its closest sequelog, RGLG1, were shown to have E3 ligase activity and
            mediated AtERF53 ubiquitination for proteasome degradation.
        - reference_id: file:ORYSJ/Q6YYC5/Q6YYC5-hypotheses/prediction-k63-linked-ubiquitination/openscientist.md
          supporting_text: >-
            the orthology used to justify it points to RGLG4, the degradative clade
            (F002, F004), not the K63-demonstrated RGLG1/2
  - source_method: ProtNLM2
    source_version: UniProt 2024_06 pilot
    predicted_term:
      id: GO:0061630
      label: ubiquitin protein ligase activity
    predicted_term_type: GO_MF
    review:
      assessment: COR
      confidence_score: 2
      summary: >-
        Q6YYC5 has the RGLG architecture with a C-terminal RING-type domain (residues
        356-389) and is placed in PANTHER subfamily PTHR45751:SF16 with Arabidopsis RGLG4.
        RGLG3 and RGLG4 have experimentally demonstrated ubiquitin ligase activity
        (PMID:22898498), and RGLG4 with UBC30 promotes ubiquitination and degradation of
        GRXS17 (PMID:27497447), which justifies transfer of E3 activity within the
        subfamily as an inference rather than an observation on the rice protein. GOA
        carries only the parent term GO:0004842 ubiquitin-protein transferase activity (IBA
        and IEA), which GO:0061630 is_a; the gene review refines both rows to GO:0061630
        and makes it the core molecular function. The prediction is therefore correct and
        more specific than the existing annotation, without any claim about substrate or
        chain linkage.
      supported_by:
        - reference_id: file:ORYSJ/Q6YYC5/Q6YYC5-uniprot.txt
          supporting_text: >-
            DR   InterPro; IPR001841; Znf_RING. ... DR   PANTHER; PTHR45751:SF16; E3 UBIQUITIN-PROTEIN
            LIGASE RGLG4; 1. ... FT   DOMAIN          356..389 ... FT                   /note="RING-type"
        - reference_id: PMID:22898498
          supporting_text: >-
            Both RGLG3 and RGLG4 possessed ubiquitin ligase activities
        - reference_id: PMID:27497447
          supporting_text: >-
            GRXS17 is ubiquitinated and degraded in an RGLG3- and RGLG4-dependent manner in planta
