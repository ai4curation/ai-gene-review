id: Q6YYC5
gene_symbol: Q6YYC5
taxon:
  id: NCBITaxon:39947
  label: Oryza sativa Japonica Group
status: COMPLETE
description: >-
  Q6YYC5 (Os08g0135400) is a rice RGLG-family RING-type E3 ubiquitin ligase in PANTHER
  subfamily PTHR45751:SF16 with its Arabidopsis ortholog RGLG4. The ProtNLM2 prediction
  of ubiquitin protein ligase activity is a correct refinement of the gene's broader
  ubiquitin-protein transferase activity annotation, supported by transfer from the
  experimentally active RGLG3/RGLG4 clade. The Lys63-linkage-specific process
  prediction is uncertain: K63 chain formation has been shown only for the RGLG1/RGLG2
  branch, chain linkage is set by the E2/E3 pair rather than the RING domain, and no
  linkage assay exists for Q6YYC5 or for the RGLG3/RGLG4 clade.
