description: 'SAPK9 is a subgroup III SnRK2 serine/threonine kinase in rice activated by ABA and hyperosmotic stress.
  It acts in nuclear and cytosolic signaling complexes and phosphorylates transcription factors including BZIP46
  and OsMADS23. PP2C phosphatases restrain its signaling output, whereas ABA receptors relieve phosphatase-mediated
  suppression. SAPK9 couples ABA perception to stress-responsive transcription and can reinforce ABA biosynthesis
  through OsMADS23.'
