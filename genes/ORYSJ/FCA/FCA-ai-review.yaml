suggested_questions:
- question: Which native rice RNAs bind full-length OsFCA, and does OsFCA participate directly in spliceosomal
    assemblies or instead interact transiently with their regulators?
- question: Do endogenous OsFCA loss-of-function alleles alter heading date and seed/cell size in the
