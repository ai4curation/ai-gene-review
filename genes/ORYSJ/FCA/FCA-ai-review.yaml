- id: GO_REF:0000002
  title: Gene Ontology annotation through association of InterPro records with GO terms
  findings: []
- id: GO_REF:0000033
  title: Annotation inferences using phylogenetic trees
  findings: []
- id: GO_REF:0000044
  title: Gene Ontology annotation based on UniProtKB/Swiss-Prot Subcellular Location vocabulary mapping,
    accompanied by conservative changes to GO terms applied by UniProt
  findings: []
- id: GO_REF:0000117
  title: Electronic Gene Ontology annotations created by ARBA machine learning models
  findings: []
- id: PMID:16240176
  title: Conservation and divergence of FCA function between Arabidopsis and rice.
  findings:
  - statement: Rice FCA partially rescues Arabidopsis fca flowering without restoring FLC repression.
    supporting_text: The constitutive expression of OsFCA resulted in no downregulation of FLC
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract inspected; partial heterologous complementation, no FLC downregulation or AtFCA
      autoregulation. Historical absence-of-FLC-homolog wording is not adopted as a modern phylogenetic
      conclusion.
- id: PMID:16820865
  title: OsFY, a homolog of AtFY, encodes a protein that can interact with OsFCA-gamma in rice (Oryza
    sativa L.).
  findings:
  - statement: OsFY and OsFCA-gamma interact in yeast two-hybrid assays.
    supporting_text: The protein-protein interaction between OsFY and OsFCA-gamma
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract and exact clone-linked UniProt entry inspected; yeast two-hybrid binding is
      direct evidence of the conserved interaction, not native rice FLC-network proof.
- id: PMID:17597396
  title: Overexpression of the rFCA RNA recognition motif affects morphologies modifications in rice (Oryza
    sativa L.).
  findings:
  - statement: RRM-fragment expression changes flowering time, cell volume and seed size.
    supporting_text: Two transgenic lines exhibited similar phenotypes, flowering time delay, seed size
      and cell volume of transgenic plants was increased.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract explicitly assays isolated RRM fragments, not full-length knockout. Publisher/author
      searches did not yield accessible full text. Existing growth/flowering claims retained with construct
      limits.
- id: PMID:18854333
  title: Abscisic acid does not disrupt either the Arabidopsis FCA-FY interaction or its rice counterpart
    in vitro.
  findings:
  - statement: ABA did not disrupt the rice FCA-FY complex in vitro.
    supporting_text: we found no disruption of the OsFCA-OsFY complexes by ABA treatment.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract inspected; in vitro ABA treatment did not disrupt either rice or Arabidopsis
      FCA-FY interaction.
- id: PMID:19561057
  title: Survey of rice proteins interacting with OsFCA and OsFY proteins which are homologous to the
    Arabidopsis flowering time proteins, FCA and FY.
  findings:
  - statement: OsFCA binds multiple partners through its WW domain.
    supporting_text: OsFCA could interact with several proteins other than OsFY through its WW domain
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract and publisher preview inspected; PDF returned 403 and article page is purchase-only.
      Nuclear localization is independently publication-linked in reviewed UniProt. Partner binding is
      not direct spliceosome membership.
