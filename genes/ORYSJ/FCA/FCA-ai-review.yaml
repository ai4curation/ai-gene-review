id: Q6K271
gene_symbol: FCA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:39947
  label: Oryza sativa Japonica Group
description: Rice FCA (OsFCA) is a nuclear protein containing two RNA recognition motifs and a WW interaction
  domain. It interacts with OsFY and other RNA-processing proteins, supporting an RNA-regulatory role
  related to that of Arabidopsis FCA. OsFCA transcripts undergo alternative processing. Rice FCA partially
  complements late flowering in Arabidopsis fca mutants without restoring FLC repression or Arabidopsis
  FCA autoregulation. Overexpression of isolated rice FCA RNA-binding domains delays flowering and increases
  cell and seed size. These results distinguish conserved RNA-processing interactions from the downstream
  flowering circuitry in the two plants.
