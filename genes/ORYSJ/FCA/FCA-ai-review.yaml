- term:
    id: GO:0008361
    label: regulation of cell size
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: involved_in
  supporting_entities:
  - ARBA:ARBA00091970
  review:
    summary: Ectopic FCA RNA-binding fragments alter cell size.
    action: KEEP_AS_NON_CORE
    reason: PMID:17597396 directly reports increased cell volume and seed size after constitutive expression
      of isolated RRM1 or RRM2 fragments in rice. Retain the existing phenotype-based regulation claim
      as contextual, with the fragment-overexpression boundary explicit. It does not demonstrate that
      native full-length FCA normally promotes growth, identify a direct cell-growth target, or establish
      knockout necessity. Full text remained inaccessible, so no experimental annotation is rejected on
      the basis of its abstract.
    supported_by:
    - reference_id: PMID:17597396
      supporting_text: Two transgenic lines exhibited similar phenotypes, flowering time delay, seed size
        and cell volume of transgenic plants was increased.
