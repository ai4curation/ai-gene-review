  review:
    summary: The ancestral spliceosomal claim is not resolved by OsFCA interactions with splicing proteins.
    action: UNDECIDED
    reason: The PTN000391532 IBD for this exact term was inspected and is placed at Eukaryota. PMID:19561057
      reports interaction with an SF1-like protein, but interaction alone does not establish membership
      of the spliceosome or participation in intron excision. Alternative processing of OsFCA itself makes
      it a substrate, not necessarily a splicing factor. No target-specific loss or incorrect ancestral
      placement was demonstrated; retain uncertainty rather than infer a false transfer.
