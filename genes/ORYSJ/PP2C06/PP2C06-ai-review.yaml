  label: Oryza sativa Japonica Group
description: 'PP2C06, also called ABIL1, is a clade A serine/threonine protein phosphatase in rice that suppresses
  ABA-responsive signaling. It forms receptor and SAPK9 complexes in the nucleus and cytosol and inhibits the SAPK9–BZIP46
  transcriptional relay. ABA receptor-mediated inhibition of PP2C06 relieves this brake on transcription. Its phosphatase
  chemistry uses divalent-metal cofactors.'
