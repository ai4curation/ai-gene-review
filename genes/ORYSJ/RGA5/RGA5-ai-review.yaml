- term:
    id: GO:0046872
    label: metal ion binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR006121
  review:
    summary: >-
      InterPro2GO mapping from the HMA domain (IPR006121). The RGA5 integrated
