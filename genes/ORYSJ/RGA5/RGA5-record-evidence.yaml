        source: PubMed
        id: '21251109'
      value: Probable disease resistance protein. Resistance proteins guard the plant against pathogens that contain
        an appropriate avirulence protein via an indirect interaction with this avirulence protein. That triggers
        a defense system including the hypersensitive response, which restricts the pathogen growth. At the opposite
        of cultivars Aichi asahi and Sasanishiki, the cultivars Nipponbare, Mokoto and Hitomebore don't recognize
        the effector avirulence protein AVR-Pia from M.oryzae
