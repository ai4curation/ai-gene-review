  label: Oryza sativa Japonica Group
description: 'BZIP46, also known as ABF2, ABF3 or ABL1, is a nuclear basic-leucine-zipper transcription factor in
  rice. It binds ABA-responsive elements and activates stress-responsive genes downstream of ABA-regulated protein
  kinases including SAPK9. Phosphorylation promotes its transcriptional activity, while its inhibitory D domain
  and the interacting regulator MODD constrain activation and stability. BZIP46 integrates ABA signaling with drought,
  salinity and developmental responses.'
