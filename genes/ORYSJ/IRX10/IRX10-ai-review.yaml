description: 'OsIRX10 (LOC_Os01g70200, Os01g0926700; also BRITTLE CULM18, BC18, and FRAGILE
  CULM19, FC19) is the rice glycosyltransferase family 47 (GT47) xylan synthase of the IRX10/XYS1
  clade. It elongates the beta-1,4-xylan backbone of grass glucuronoarabinoxylan in the Golgi:
  recombinant IRX10 extends xylooligosaccharides from UDP-xylose in vitro. In culm internodes
  IRX10 forms the core of a xylan synthase complex with GT43 proteins and the xylan O-acetyltransferase
  XOAT6, which binds IRX10 and promotes chain polymerisation. Loss-of-function mutants (Osirx10,
  bc18, fc19) have less xylan with a lower degree of polymerisation, reduced acetylation,
  disordered cellulose and brittle culms, and their biomass is easier to saccharify.'
