suggested_questions:
- question: Which rice IRX10-clade paralogs (e.g. OsGT47A of Zhang et al. 2014, if a different
    locus) share culm xylan synthesis with LOC_Os01g70200, and which of the six GT43/GT47
    cores reported in rice (PMID:38261531) contain each of them?
- question: Should GO add a glucuronoarabinoxylan biosynthetic process term so grass xylan
    synthases are not annotated only to glucuronoxylan?
suggested_experiments:
- description: Assay recombinant OsIRX10 with and without XOAT6 on acetylated versus unacetylated
    acceptors, and measure processivity.
  hypothesis: XOAT6 promotes IRX10 by a structural interaction rather than by acetylating
    the acceptor.
  experiment_type: in vitro enzyme assay
