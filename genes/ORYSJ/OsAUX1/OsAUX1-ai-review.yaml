  label: Oryza sativa Japonica Group
description: OsAUX1 (Os01g0856500/LOC_Os01g63770) is a rice plasma-membrane auxin influx carrier
  of the AUX/LAX branch of the amino-acid/auxin permease superfamily. Native loss-of-function
  and locus-matched complementation of Arabidopsis aux1 support its role in moving auxin into
  cells. It contributes to lateral-root initiation, root gravitropic growth and the root-hair
  response to low phosphate; its root-hair expression pattern differs from Arabidopsis AUX1.
  Altered cadmium sensitivity reflects auxin and stress physiology and does not establish cadmium
  transport.
