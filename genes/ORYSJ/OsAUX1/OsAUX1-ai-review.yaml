- term:
    id: GO:0010328
    label: auxin influx transmembrane transporter activity
  evidence_type: ISS
  original_reference_id: PMID:29650967
  supporting_entities:
  - UniProtKB:Q96247
  review:
    summary: Propose the independently supported auxin influx transporter activity.
    action: NEW
    reason: This MF is absent from the four seeded rows and is not an ancestor or descendant
      of the amino-acid substrate claims. The exact rice locus Os01g63770 complements Arabidopsis
      aux1, while independent native T-DNA alleles and NAA-bypass phenotypes support auxin influx
      (PMID:29650967; PMID:25311360). ISS records the conserved carrier-function inference,
      corroborated by complementation; it does not assert a direct purified or oocyte OsAUX1
      flux assay. The separate amino-acid IBAs remain unresolved. No redundant new BP is proposed.
    supported_by:
    - *id001
    - *id002
references:
- id: GO_REF:0000033
  title: Annotation inferences using phylogenetic trees
  findings: []
- id: GO_REF:0000044
  title: Gene Ontology annotation based on UniProtKB/Swiss-Prot Subcellular Location vocabulary
    mapping, accompanied by conservative changes to GO terms applied by UniProt
  findings: []
- id: PMID:29650967
  title: Rice auxin influx carrier OsAUX1 facilitates root hair elongation in response to low
    external phosphate.
  findings:
  - statement: Only Os01g63770 complemented Arabidopsis aux1; two native rice T-DNA alleles
      establish its role in low-phosphate root-hair adaptation.
- id: PMID:26140668
  title: The auxin transporter, OsAUX1, is involved in primary root and root hair elongation
    and in Cd stress responses in rice (Oryza sativa L.).
  findings:
  - statement: Native rice localization and root phenotypes support auxin influx; unchanged
      cadmium content does not support a Cd-transport function.
- id: PMID:25311360
  title: OsAUX1 controls lateral root initiation in rice (Oryza sativa L.).
  findings:
  - statement: Native mutants and RNAi reduce lateral-root initiation; rescue by membrane-permeable
      NAA supports influx interpretation.
- id: PMID:29717128
  title: 'Author Correction: Rice auxin influx carrier OsAUX1 facilitates root hair elongation
    in response to low external phosphate.'
  findings:
  - statement: Author correction adds an omitted funding acknowledgement only; it does not change
      biological results.
