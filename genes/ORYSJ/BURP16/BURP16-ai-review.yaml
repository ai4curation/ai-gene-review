description: >-
  OsBURP16 (Os10g0409400) is a rice BURP-domain protein of the polygalacturonase 1
  beta-like (PG1beta-like) family. It is 344 residues long, with a predicted N-terminal
  signal peptide, four predicted N-glycosylation sites and a C-terminal BURP domain
  carrying the four conserved CH motifs. Unlike the tomato PG1 beta subunit, it lacks the
  FTNYG-type repeat region. Its closest relative is the grass in-paralog OsBURP12; eudicot
  PG1beta-like proteins diverged from both at the monocot-eudicot split. The transcript is
  found mainly in young leaves and internodes and is induced by cold, drought and salt.
  The only functional evidence comes from constitutive overexpression in rice. That raised
  leaf polygalacturonase activity, lowered homogalacturonan pectin content and weakened
  cell adhesion and leaf mechanical strength. The plants also lost water faster through
  the cuticle and were more sensitive to cold, salt and drought. No loss-of-function
  mutant has been reported. Its subcellular location, its molecular activity and any
  physical association with a catalytic polygalacturonase have not been tested. The
  description of OsBURP16 as a PG1 beta subunit therefore rests on family membership.
  The ethylene-signalling transcription factor OsEIL2 binds the OsBURP16 promoter and
  activates its transcription.
existing_annotations:
  - term:
      id: GO:0005576
      label: extracellular region
    evidence_type: ISS
    original_reference_id: file:ORYSJ/BURP16/BURP16-bioinformatics/RESULTS.md
    review:
      summary: >-
        OsBURP16 is predicted to be secreted. It has an N-terminal signal peptide, no
        transmembrane segment beyond it, and predicted N-glycosylation sites, and it
        belongs to PANTHER PTHR31458:SF2, whose characterised members are cell-wall
        proteins.
      action: NEW
      reason: >-
        This is a computational location, not an experimental one: the only functional
        paper did not localise the protein and relied on a TMHMM prediction. The broad
        extracellular region term is proposed rather than plant-type cell wall
        (GO:0009505). PAINT placed its cell wall IBD only on the Brassicaceae node
        PTN004827911, which does not include OsBURP16, and OsBURP16 lacks the FTNYG
        repeats that make up most of the mature wall-bound tomato PG1 beta subunit.
      supported_by:
        - reference_id: file:ORYSJ/BURP16/BURP16-uniprot.txt
          supporting_text: FT   SIGNAL          1..25
        - reference_id: file:ORYSJ/BURP16/BURP16-uniprot.txt
          supporting_text: DR   PANTHER; PTHR31458:SF2; POLYGALACTURONASE 1 BETA-LIKE PROTEIN 2; 1.
        - reference_id: PMID:24237159
          supporting_text: >-
            found that the two proteins may both mainly be localized outside the cell
            membrane
        - reference_id: PMID:1392611
          supporting_text: >-
            a cell wall protein that associates with, and apparently regulates, the
            catalytic PG2 polypeptides
references:
  - id: PMID:24237159
    title: Overexpression of stress-inducible OsBURP16, the β subunit of polygalacturonase
      1, decreases pectin content and cell adhesion and increases abiotic stress sensitivity
      in rice.
    findings:
      - statement: >-
          Ubi::OsBURP16 overexpression lines have higher leaf PG activity and lower pectin
          content than wild type.
        supporting_text: Transgenic rice showed enhanced PG activity and reduced pectin content.
      - statement: PG activity in young leaves rose 3- to 6-fold in two overexpression lines.
        supporting_text: >-
          In young leaves of the OE3 and OE4 lines, PG activity was increased by more than
          three- and sixfold, respectively, as compared with PG activity from ZH10
      - statement: >-
          Overexpression lowered high-methyl-ester and total homogalacturonan in roots.
        supporting_text: >-
          the results showed that the total HG content was significantly reduced
      - statement: >-
          Overexpression reduced cell adhesion, increased cuticular transpiration, reduced
          leaf breaking force and increased sensitivity to cold, salt and drought.
        supporting_text: >-
          Young leaves of Ubi::OsBURP16
          transgenic plants showed reduced cell adhesion and increased cuticular
          transpiration rate.
      - statement: No loss-of-function line was obtained.
        supporting_text: >-
          Attempts to generate mutants or RNAi plants of OsBURP16 have so far not been
          successful, but are ongoing.
      - statement: >-
          Localisation was predicted with TMHMM only; no localisation experiment was
          performed.
        supporting_text: >-
          found that the two proteins may both mainly be localized outside the cell
          membrane
      - statement: >-
          Transcripts are found mainly in young leaves, leaf lamina, leaf cushion and
          internodes.
        supporting_text: >-
          OsBURP16 was expressed in various tissues, mainly in leaf lamina, leaf cushion
          and internodes
      - statement: >-
          ABA response is reported inconsistently: the abstract says ABA induces OsBURP16,
          but the results text reports reduced transcription after ABA treatment.
        supporting_text: >-
          Treatment with 100 μm ABA caused a decrease in the transcriptions of OsBURP16
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: >-
        Full text cached (PMC4286026). This is the only functional study of OsBURP16, and
        all of its functional data come from constitutive overexpression. The PG1 beta
        subunit identity in the title is a family-based assumption ("putative PG1β subunit
        precursor"). No protein interaction, localisation or biochemical activity of
        OsBURP16 was measured.
  - id: PMID:19363683
    title: Genome-wide identification of BURP domain-containing genes in rice reveals
      a gene family with diverse structures and responses to abiotic stresses.
    findings:
      - statement: >-
          Defines the 17 rice BURP genes; OsBURP16 transcripts respond to drought, salt,
          cold and ABA treatment.
        supporting_text: >-
          Two genes (OsBURP05
          and OsBURP16) were responsive to all the stress treatments
    reference_review:
      relevance: MEDIUM
      correctness: VERIFIED
      review_notes: >-
        Abstract only in cache. Gene nomenclature and expression only; no functional data.
  - id: PMID:32005373
    title: Ethylene insensitive3-like2 (OsEIL2) confers stress sensitivity by regulating
      OsBURP16, the β subunit of polygalacturonase (PG1β-like) subfamily gene in rice.
    findings:
      - statement: OsEIL2 binds the OsBURP16 promoter and activates its transcription.
        supporting_text: >-
          OsEIL2 binds directly to the promoter of OsBURP14
          and OsBURP16 and activates their transcript levels.
    reference_review:
      relevance: MEDIUM
      correctness: VERIFIED
      review_notes: >-
        Abstract only in cache. Describes regulation of the OsBURP16 gene by OsEIL2, not an
        activity of the OsBURP16 protein. Its OsBURP16 phenotype statement restates
        PMID:24237159.
  - id: PMID:1392611
    title: 'The beta subunit of tomato fruit polygalacturonase isoenzyme 1: isolation,
      characterization, and identification of unique structural features.'
    findings:
      - statement: >-
          The tomato PG1 beta subunit (GP1, PTHR31458:SF2) is a cell wall protein that
          associates with the catalytic PG2 and is built largely from FTNYG-type repeats.
        supporting_text: >-
          a cell wall protein that associates with,
          and apparently regulates, the catalytic PG2 polypeptides
    reference_review:
      relevance: MEDIUM
      correctness: VERIFIED
      review_notes: >-
        Family archetype. GP1 is in the same PANTHER subfamily but joins the OsBURP16
        lineage only at the Mesangiosperma node, and OsBURP16 lacks the FTNYG repeats.
        Used for family-level context only.
  - id: PMID:26106400
    title: AtPGL3 is an Arabidopsis BURP domain protein that is localized to the cell
      wall and promotes cell enlargement.
    findings:
      - statement: >-
          Arabidopsis PGL3 (SF10) is a cell-wall-localised PG1beta-like protein that
          promotes cell enlargement.
        supporting_text: >-
          it localized to the cell wall
    reference_review:
