core_functions:
  - description: >-
      Secreted PG1beta-like BURP-domain protein whose molecular activity is unknown. The
      extracellular location is predicted from the signal peptide and family membership.
      Overexpression in rice raises polygalacturonase activity and lowers pectin. This
      fits a role in promoting pectin breakdown in the wall, but no direct activity,
      partner or localisation has been shown, so no molecular function or process is
      asserted.
    locations:
      - id: GO:0005576
        label: extracellular region
    supported_by:
      - reference_id: file:ORYSJ/BURP16/BURP16-uniprot.txt
        supporting_text: FT   SIGNAL          1..25
      - reference_id: file:ORYSJ/BURP16/BURP16-bioinformatics/RESULTS.md
        supporting_text: >-
          OsBURP16 is a PG1beta-like BURP protein by PANTHER subfamily (SF2) and BURP-domain
          architecture, with a predicted signal peptide, consistent with secretion.
      - reference_id: PMID:24237159
        supporting_text: Transgenic rice showed enhanced PG activity and reduced pectin content.
    knowledge_gaps:
      - gap_statement: >-
          Whether OsBURP16 physically associates with a rice catalytic polygalacturonase,
          or regulates one directly, is undetermined; it lacks the FTNYG repeat region of
          the tomato PG1 beta subunit.
        boundary: >-
          Established: overexpression in rice raises leaf PG activity and lowers pectin
          content. Not established: localisation, binding partners, biochemical activity,
          loss-of-function phenotype.
        gap_kind:
          - BIOLOGY
        dark_aspect: MF_DARK
proposed_new_terms: []
suggested_questions:
  - question: >-
      Does OsBURP16, which lacks the FTNYG repeat region, form a PG1-type complex with a
      rice catalytic polygalacturonase, or does it raise PG activity indirectly
      (for example by loosening pectin or changing PG gene expression)?
  - question: >-
      Is the OsBURP16 protein in the cell wall, and does its loss change pectin content or
      stress tolerance? Only overexpression data exist so far.
  - question: >-
      Does ABA induce or repress OsBURP16? The abstract and results of PMID:24237159
      disagree on this.
suggested_experiments:
  - description: >-
      Make CRISPR/Cas9 knockout lines of OsBURP16, and OsBURP16/OsBURP12 double knockouts
      to deal with redundancy between the in-paralogs. Measure leaf PG activity,
      uronic-acid content, cell adhesion and stress tolerance.
    experiment_type: genetic loss-of-function
  - description: >-
      Localise an OsBURP16-fluorescent protein fusion expressed from its native promoter,
      using plasmolysis to tell cell wall from plasma membrane. Test co-immunoprecipitation
      with candidate rice catalytic polygalacturonases expressed in the same tissues.
    experiment_type: localization and protein interaction
