    CC   -!- FUNCTION: Disease resistance (R) protein that specifically recognizes
    CC       the AVR-Pik effector avirulence protein from M.oryzae. Resistance
    CC       proteins guard the plant against pathogens that contain an appropriate
    CC       avirulence protein via an indirect interaction with this avirulence
    CC       protein. That triggers a defense system including the hypersensitive
    CC       response, which restricts the pathogen growth (PubMed:18940787,
    CC       PubMed:22805093). Contribution of Pikm-2 is required to recognize the
    CC       effector avirulence protein AVR-Pik (PubMed:18940787).
    CC       {ECO:0000269|PubMed:18940787, ECO:0000269|PubMed:22805093}.
    CC   -!- SUBUNIT: Interacts with AVR-Pik through its N-terminal part containing
    CC       the HMA-like domain. {ECO:0000250|UniProtKB:F2VYU4,
    CC       ECO:0000269|PubMed:22805093}.
    CC   -!- TISSUE SPECIFICITY: Constitutively expressed.
    CC       {ECO:0000269|PubMed:18940787}.
    CC   -!- INDUCTION: By M.oryzae pathogen infection.
    CC       {ECO:0000269|PubMed:18940787}.
    CC   -!- DOMAIN: The HMA-like (RATX1) domain is responsible for the specific
    CC       recognition of AVR effectors. {ECO:0000250|UniProtKB:F2VYU4}.
    CC   -!- SIMILARITY: Belongs to the disease resistance NB-LRR family.
    CC       {ECO:0000305}.
