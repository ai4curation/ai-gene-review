  - texts:
    - evidences:
      - evidenceCode: ECO:0000269
        source: PubMed
        id: '18940787'
      - evidenceCode: ECO:0000269
        source: PubMed
        id: '22805093'
      value: Disease resistance (R) protein that specifically recognizes the AVR-Pik effector avirulence protein
        from M.oryzae. Resistance proteins guard the plant against pathogens that contain an appropriate avirulence
        protein via an indirect interaction with this avirulence protein. That triggers a defense system including
        the hypersensitive response, which restricts the pathogen growth (PubMed:18940787, PubMed:22805093). Contribution
        of Pikm-2 is required to recognize the effector avirulence protein AVR-Pik (PubMed:18940787)
    commentType: FUNCTION
  - texts:
