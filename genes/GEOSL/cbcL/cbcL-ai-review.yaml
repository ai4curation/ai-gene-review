core_functions:
- description: >-
    Low-potential inner-membrane electron carrier of extracellular respiration. CbcL's
    periplasmic nonaheme c-type cytochrome domain injects electrons into the periplasmic
    cytochrome network by reducing the triheme cytochrome PpcA, and CbcL is required for
    respiration to Fe(III) oxides and electrodes at or below about -0.1 V vs SHE. The
    electron source is presumed to be menaquinol at the b-heme membrane domain, which
    has not been shown.
  molecular_function:
    id: GO:0009055
    label: electron transfer activity
  directly_involved_in:
