    supporting_text: direct electron transfer from reduced CbcL to oxidized PpcA was
      observed in 1D 1H NMR titrations
  - reference_id: PMID:26407054
    supporting_text: deletion of cbcL, encoding an inner membrane protein consisting of
      b-type and multiheme c-type cytochrome domains, severely affected reduction of
      low potential electron acceptors such as Fe(III)-oxides and electrodes poised at
      -0.1 V vs. SHE
  - reference_id: PMID:35620088
    supporting_text: its nine hemes are low-spin and all coordinated by two histidine
      residues
suggested_questions:
- question: >-
    Does the b-heme membrane domain of CbcL oxidize menaquinol directly, and if so
    should CbcL carry a quinol-oxidizing oxidoreductase term in addition to electron
    transfer activity?
- question: >-
    What sets the redox potential threshold at which cells switch between the ImcH and
    CbcL routes, given that both genes are reported to be constitutively expressed?
suggested_experiments:
- experiment_type: in vitro reconstitution
  description: >-
    Purify full-length CbcL in detergent or proteoliposomes and measure menaquinol (or
    a menaquinol analogue) oxidation coupled to reduction of PpcA, to test the
    presumed quinol:cytochrome oxidoreductase activity and identify the b-heme
    potentials.
- experiment_type: targeted mutagenesis
  description: >-
    Identify the predicted b-heme histidine ligands of the membrane domain by alignment with structurally characterized diheme cytochrome b subunits, mutate them, and measure
    low-potential electrode respiration, to test whether the membrane domain is the
    electron entry point.
