taxon:
  id: NCBITaxon:243231
  label: Geobacter sulfurreducens PCA
description: >-
  CbcL (GSU0274) is a 619-residue inner (cytoplasmic) membrane cytochrome of the
  dissimilatory metal-reducing bacterium Geobacter sulfurreducens, built from two
  domains: a periplasmic multiheme c-type cytochrome domain carrying nine bis-histidine
  coordinated low-spin hemes (nine CXXCH motifs between residues 35 and 262), and a
  C-terminal six-helix membrane domain of the transmembrane diheme cytochrome b type.
  Deletion of cbcL severely impairs respiration to extracellular electron acceptors at or
  below about -0.1 V versus SHE, including Fe(III) (oxyhydr)oxides and low-potential
  electrodes, and complementation restores growth, so CbcL defines the low-potential
  inner-membrane route out of the menaquinone pool that operates alongside the
  high-potential ImcH route and the still lower-potential CbcBA route. Its periplasmic
  domain (apparent midpoint potential about -194 mV) transfers electrons directly to
  the periplasmic triheme cytochrome PpcA, forming a weak redox complex. CbcL is thought
  to oxidize menaquinol, but quinol oxidation has not been demonstrated. Loss of CbcL
  raises growth yield on Fe(III), consistent with the low-potential route conserving
  less energy per electron.
existing_annotations:
- term:
    id: GO:0016491
    label: oxidoreductase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN002858933
  - UniProtKB:P0ABL1
  - UniProtKB:Q8EJI6
  review:
    summary: >-
      PAINT IBA from node PTN002858933 of PTHR35038 (multiheme cytochrome electron
      transporters), seeded by E. coli NrfB (P0ABL1) and S. oneidensis SirA/MccA
      (Q8EJI6). CbcL belongs to the family through its N-terminal nonaheme c-type
      cytochrome domain.
    action: MODIFY
    reason: >-
      CbcL descends from the node through its periplasmic multiheme domain, so its
      placement is not in question, but the generic oxidoreductase term is not the
      activity shown for this protein. The SirA seed is a catalytic sulfite reductase
      whose activity depends on its own active-site heme, and nothing comparable is
      known for CbcL. What has been demonstrated is heme-to-heme electron transfer: the
      reduced periplasmic domain of CbcL directly reduces the triheme cytochrome PpcA,
      the potentials being ordered to allow this (PMID:35620088). That is GO:0009055
      electron transfer activity, which is what GOA gives the comparable
      inner-membrane cytochromes ImcH (Q747K6) and S. oneidensis CymA (Q8E8S0). CbcL is
      often described as a quinone oxidoreductase, and if menaquinol oxidation by the
      b-heme domain is ever shown an oxidoreductase term would apply. But the authors
      who defined the pathway state that this has not been demonstrated
      (PMID:28045456). So this is a lateral correction to the activity the evidence
      supports, not a refinement.
    proposed_replacement_terms:
    - id: GO:0009055
      label: electron transfer activity
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: PANTHER:PTN002858933
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          Node of PTHR35038 carrying the IBD. CbcL descends from it through its
          nonaheme c domain only; its extra b-type membrane domain and its demonstrated
          cytochrome-to-cytochrome electron transfer make electron transfer activity,
          not a catalytic oxidoreductase, the supported function.
      - source_id: UniProtKB:Q8EJI6
        source_label: sirA
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          Seed at the node; a respiratory sulfite reductase, a true catalytic
          oxidoreductase. CbcL is not a sulfite reductase.
      - source_id: UniProtKB:P0ABL1
        source_label: nrfB
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          Seed at the node; a pentaheme electron carrier for the NrfA nitrite reductase,
          functionally closer to CbcL's demonstrated electron transfer role than to a
          catalytic oxidoreductase.
    supported_by:
    - reference_id: file:interpro/panther/PTHR35038/PTHR35038-paint.tsv
      supporting_text: "PTHR35038\tPTN002858933\tGO:0016491\tF\tIBD\tfalse\tUniProtKB:P0ABL1|UniProtKB:Q8EJI6"
    - reference_id: PMID:35620088
      supporting_text: direct electron transfer from reduced CbcL to oxidized PpcA was
        observed in 1D 1H NMR titrations
    - reference_id: PMID:28045456
      supporting_text: direct roles for ImcH and CbcL in the movement of electrons out
        of the quinone pool have not been demonstrated
- term:
    id: GO:0030313
    label: cell envelope
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  supporting_entities:
  - UniProtKB-SubCell:SL-0036
  review:
    summary: >-
      Electronic mapping from an ARBA-predicted UniProt subcellular location ("Cell
      envelope"). CbcL is an inner-membrane protein with six predicted transmembrane
      helices and a periplasmic heme domain.
    action: MODIFY
    reason: >-
      Cell envelope is true but general: the bacterial cell envelope includes the
      cytoplasmic membrane, and the evidence places CbcL in that membrane. Phobius
      predicts six transmembrane helices in the C-terminal domain (residues 286-614)
      after a SignalP signal peptide; the primary genetics and biochemistry papers both
      describe CbcL as an inner-membrane protein (PMID:26407054, PMID:35620088); and its
      function, linking the membrane quinone pool to periplasmic cytochromes, only makes
      sense in the cytoplasmic membrane. GO:0005886 plasma membrane is the term GOA uses
      for the comparable inner-membrane cytochromes ImcH and CymA. The UniProt "Cell
      envelope" statement itself rests only on an ARBA rule, so it is not quoted here.
    proposed_replacement_terms:
    - id: GO:0005886
      label: plasma membrane
    supported_by:
    - reference_id: PMID:26407054
      supporting_text: deletion of cbcL, encoding an inner membrane protein consisting
        of b-type and multiheme c-type cytochrome domains
    - reference_id: PMID:35620088
      supporting_text: CbcL has a transmembranar di-heme b-type cytochrome domain with
        six helices, linked to a periplasmic cytochrome domain with nine c-type heme
        groups
    - reference_id: file:GEOSL/cbcL/cbcL-uniprot.txt
      record_section: ["FT:TRANSMEM"]
      supporting_text: TRANSMEM        286..314
- term:
    id: GO:0020037
    label: heme binding
  evidence_type: IDA
  original_reference_id: PMID:35620088
  qualifier: enables
  review:
    summary: >-
      The purified periplasmic domain of CbcL carries nine low-spin c-type hemes, each
      coordinated by two histidines.
    action: NEW
    reason: >-
      Heme binding is the cofactor basis of every activity proposed for CbcL and is
      shown directly on the recombinant periplasmic domain (residues 30-279) by heme
      quantitation and UV-visible, CD and NMR spectroscopy (PMID:35620088). The nine
      CXXCH motifs in the sequence agree. No row in GOA covers it. The b-type hemes of
      the membrane domain are inferred from its fold and have not been measured.
    supported_by:
    - reference_id: PMID:35620088
      supporting_text: its nine hemes are low-spin and all coordinated by two histidine
        residues
    - reference_id: PMID:35620088
      supporting_text: Residues 30-279 (CbcL periplasmic domain) were amplified from
        genomic DNA
- term:
    id: GO:0019645
    label: anaerobic electron transport chain
  evidence_type: IMP
  original_reference_id: PMID:26407054
  qualifier: involved_in
  review:
    summary: >-
      CbcL carries electrons in the anaerobic respiratory chain that ends at
      extracellular Fe(III) oxides and low-potential electrodes.
    action: NEW
    reason: >-
      Participation, not only necessity: CbcL is itself an electron carrier in the
      chain, and its periplasmic domain passes electrons to the next carrier, PpcA
      (PMID:35620088). Necessity is shown by deletion and complementation: a cbcL
      deletion strain cannot reduce low-potential acceptors and needs about 50 mV more
      driving force to transfer electrons out of the cell, and expression of cbcL in
      trans restores growth (PMID:26407054). With Fe(III)-citrate the mutant stops at
      -0.15 V (PMID:28045456). Comparator check: the inner-membrane cytochromes in the
      same position in the chain, G. sulfurreducens ImcH (Q747K6) and S. oneidensis
      CymA (Q8E8S0), both carry GO:0019645 in GOA (IBA), so the term is the established
      convention for this role. No GO-CAM model in gocams/index.tsv includes CbcL.
    supported_by:
    - reference_id: PMID:26407054
      supporting_text: Expression of cbcL in trans increased growth at low redox potential
        and restored features to cyclic voltammetry
    - reference_id: PMID:26407054
      supporting_text: Catalytic cyclic voltammetry of a ΔcbcL strain growing on poised
        electrodes revealed a 50 mV positive shift in driving force required for electron
        transfer out of the cell
    - reference_id: PMID:35620088
      supporting_text: direct electron transfer from reduced CbcL to oxidized PpcA was
        observed in 1D 1H NMR titrations
    - reference_id: PMID:28045456
      supporting_text: the ΔcbcL mutant strain (lacking the low-potential system) was
        unable to reduce all Fe(III), and the redox potential only lowered to –0.15 V
