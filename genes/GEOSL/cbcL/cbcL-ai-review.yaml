- id: PMID:26407054
  title: Reduction of low potential electron acceptors requires the CbcL inner membrane
    cytochrome of Geobacter sulfurreducens.
  findings:
  - statement: >-
      Deleting cbcL severely impairs reduction of low-potential acceptors (Fe(III)
      oxides, electrodes at -0.1 V vs SHE); complementation in trans restores growth.
    supporting_text: deletion of cbcL, encoding an inner membrane protein consisting of
      b-type and multiheme c-type cytochrome domains, severely affected reduction of
      low potential electron acceptors such as Fe(III)-oxides and electrodes poised at
      -0.1 V vs. SHE
    reference_section_type: ABSTRACT
  - statement: CbcL defines a second inner-membrane electron transfer pathway used at
      or below -0.1 V vs SHE.
    supporting_text: CbcL is a component of a second electron transfer pathway out of
      the G. sulfurreducens inner membrane that dominates when redox potential is at
      or below -0.1 V vs. SHE
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed esearch for cbcL AND Geobacter returns this PMID; title, authors
      (Zacharoff, Chan, Bond) and DOI match the paper that named CbcL. Abstract only in
      the cache.
- id: PMID:35620088
  title: 'Electron Flow From the Inner Membrane Towards the Cell Exterior in Geobacter
    sulfurreducens: Biochemical Characterization of Cytochrome CbcL.'
  findings:
  - statement: >-
      The recombinant periplasmic domain (residues 30-279) holds nine low-spin,
      bis-His coordinated c-type hemes; the membrane domain has six helices and two
      b-type hemes.
    supporting_text: its nine hemes are low-spin and all coordinated by two histidine
      residues
    reference_section_type: ABSTRACT
  - statement: >-
      The CbcL periplasmic domain (-194 mV) is more reducing than PpcA (-138 mV) and
      directly reduces PpcA, forming a low-affinity complex (Kd 57 uM).
    supporting_text: direct electron transfer from reduced CbcL to oxidized PpcA was
      observed in 1D 1H NMR titrations
    reference_section_type: CONCLUSIONS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text cached (PMC9129911); the construct is GSU0274/AAR33608.1, the same
      protein as Q74GH2. Only the soluble periplasmic domain was studied, so the
      quinol-oxidizing role of the membrane domain was not tested.
- id: PMID:28045456
  title: Redox potential as a master variable controlling pathways of metal reduction
    by Geobacter sulfurreducens.
  findings:
  - statement: >-
      The CbcL-dependent pathway is needed to finish reducing Fe(III)-citrate and many
      Fe and Mn (oxyhydr)oxides once the potential drops; cbcL mutants have higher
      growth yield on Fe(III).
    supporting_text: Mutants lacking the low-potential, CbcL-dependent pathway had
      higher growth yields with both soluble and insoluble Fe(III).
    reference_section_type: ABSTRACT
  - statement: A direct role of CbcL in oxidizing the quinone pool has not been shown.
    supporting_text: direct roles for ImcH and CbcL in the movement of electrons out
      of the quinone pool have not been demonstrated
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached (PMC5322298); uses the delta-cbcL strain from Zacharoff
      et al. 2016.
- id: PMID:34423503
  title: Geobacter sulfurreducens inner membrane cytochrome CbcBA controls electron
    transfer and growth yield near the energetic limit of respiration.
  findings:
  - statement: CbcBA is an unrelated third inner-membrane cytochrome; deleting cbcL in
      a delta-cbcBA background raises growth yield further.
    supporting_text: deletion of cbcL (an unrelated bc-cytochrome essential near -0.15
      V) in ΔcbcBA increased yield to 220%
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract only; places CbcL between ImcH and CbcBA in the redox ladder.
- id: PMID:37459687
  title: Cytochrome gene expression shifts in Geobacter sulfurreducens to maximize energy
