- term:
    id: GO:0016485
    label: protein processing
  evidence_type: IDA
  original_reference_id: PMID:36732469
  qualifier: involved_in
  review:
    summary: >-
      OzpA converts the OmcZ precursor into its mature, polymerization-competent form by
      cleaving off a C-terminal region. Purified OzpA performs the cut on native and
      recombinant OmcZ50, and the resulting OmcZ30 self-assembles into filaments
      indistinguishable from native ones. A strain disrupted in ozpA accumulates the
      precursor and makes no mature form.
    action: NEW
    reason: >-
      This is OzpA's one characterised biological role and GOA records nothing of it: all
      five existing rows come from the subtilisin domain signature and would read the same
      for any S8 protease in any organism. The term fits exactly, since GO:0016485 is "any
      protein maturation process achieved by the cleavage of a peptide bond or bonds within
      a protein", which is the OmcZ50 to OmcZ30 cut. The evidence is direct rather than
      inferred: the reaction was run with purified protein, with the mutant phenotype and a
      heterologous lysate as independent support. OzpA does the work of this process
      itself, which is what the term requires, unlike the process terms declined below.
    supported_by:
    - reference_id: PMID:36732469
      supporting_text: We found that purified OzpA cleaves both native and recombinant OmcZ50
        into OmcZ30 which then self-assembled into nanowires
    - reference_id: PMID:33837010
      supporting_text: the ozpA mutant accumulated OmcZL and did not produce OmcZS, which
        is thought to be a mature form that is essential for the extracellular electron transfer
        to the electrode
    - reference_id: PMID:33837010
      supporting_text: These results indicate that OzpA is an essential protease for current
        production via the maturation of OmcZ
