    summary: >-
      Phylogenetic propagation of the subtilisin molecular function from the peptidase S8
      node, seeded by characterised subtilisin-family endopeptidases across eukaryotes and
      bacteria. OzpA now has direct evidence of its own for the same activity.
    action: ACCEPT
    reason: >-
      The term is correct and the propagation has since been confirmed on the target. OzpA
      makes an internal cut in OmcZ50, removing a C-terminal region and leaving a shorter
      chain, which is endopeptidase chemistry rather than exopeptidase trimming, and the
      UniProt record carries the S8 catalytic triad at residues 133, 169 and 322. The
      reaction is demonstrated on purified protein, so this is the gene's core molecular
      function and not merely an inherited guess.
