core_functions:
- description: >-
    Maturation protease for the OmcZ nanowire. OzpA is exported through its signal peptide
    and cuts the OmcZ precursor outside the cell, removing the C-terminal
    immunoglobulin-like region that holds the cytochrome in a soluble, non-polymerizing
    state. The product, OmcZ30, self-assembles into the conductive filaments that carry
    electrons to an electrode, so the single endoproteolytic cut is the switch that
    licenses nanowire assembly. Losing it costs the cell its current as completely as
    losing the cytochrome does, but the protease's own contribution is the cleavage, not
    the electron transfer.
  molecular_function:
    id: GO:0004252
    label: serine-type endopeptidase activity
  directly_involved_in:
  - id: GO:0016485
    label: protein processing
  supported_by:
  - reference_id: PMID:36732469
    supporting_text: We found that purified OzpA cleaves both native and recombinant OmcZ50
      into OmcZ30 which then self-assembled into nanowires
  - reference_id: PMID:33837010
    supporting_text: These results indicate that OzpA is an essential protease for current
      production via the maturation of OmcZ
  knowledge_gaps:
  - gap_statement: >-
      Where OzpA acts is not resolved between the cell surface and the free extracellular
      medium, so it is not known whether maturation is targeted at the point of assembly or
      happens wherever precursor and protease meet.
    boundary: >-
      It is established that OzpA carries a signal peptide and no membrane anchor, and that
      cleaving activity is recovered only from the culture supernatant. What is not
      established is whether the protein is retained at the outer surface or released, which
      is the difference between a licensed assembly site and a diffuse one.
    gap_kind:
    - BIOLOGY
    dark_aspect: CC_DARK
  - gap_statement: >-
      Whether OzpA is specific to OmcZ, or is a general maturation protease with other
      substrates in the cell, is undetermined.
    boundary: >-
      OmcZ is the one substrate demonstrated, in vitro and in vivo. No search for other
      substrates has been reported, and subtilisins are frequently promiscuous.
    gap_kind:
    - BIOLOGY
    dark_aspect: MF_DARK
suggested_questions:
- question: >-
    Is OzpA retained at the cell surface or released into the medium? More was done than
    "exported": PMID:33837010 compared the culture supernatant, the loosely bound outer
    surface and the intracellular fractions, and found OmcZL-cleaving activity in the
    supernatant alone, which excludes an intracellular location and a loosely attached
    surface one. Two things it does not settle remain, and they are what block the
    cellular-component row. Activity in a fraction is not protein in a fraction, since a
    small released pool could account for all of the activity while most of the protein sat
    elsewhere; and a tightly attached surface protein would not appear in a loosely bound
    fraction either. GO:0005576 carries the comment that it "is intended to annotate gene
    products that are not attached to the cell surface", so it turns on exactly the
    distinction the fractionation leaves open.
- question: >-
    Does OzpA have substrates other than OmcZ? Subtilisins are often promiscuous, and a
    protease that matures one surface cytochrome might mature others.
- question: >-
    How should GO represent a protein that is required for a process it does not itself
    perform? Deleting ozpA abolishes current production as completely as deleting omcZ, yet
    OzpA transfers no electrons, and nothing in the annotation records that asymmetry.
suggested_experiments:
- hypothesis: >-
    OzpA is retained at the outer cell surface rather than released, so that maturation is
    localised to the site of filament assembly.
  experiment_type: subcellular fractionation with protease-accessibility controls
  description: >-
    Repeat the published fractionation (PMID:33837010) following the protein rather than the
    activity: raise an antibody or tag the chromosomal copy, fractionate into outer
    membrane, surface-sheared material and spent medium with marker proteins for each, and
    quantify where OzpA itself is, not where OmcZL cleavage happens. Add the step the
    published work could not do with an activity readout, a protease-accessibility test on
    intact cells, which separates a tightly attached surface protein from a released one
    where shearing cannot. Distinguishing retained from released would settle the
    cellular-component row this review declines to propose.
- hypothesis: OzpA matures substrates other than OmcZ.
  experiment_type: substrate capture and comparative proteomics
  description: >-
    Compare the surface and supernatant proteomes of wild type and the ozpA mutant for
    proteins that shift in apparent mass, and run purified OzpA against a panel of the
    organism's secreted multiheme cytochromes, OmcS and OmcE included. A catalytically dead
    triad mutant would serve as the trapping control.
- hypothesis: >-
    The cut is what licenses assembly, rather than OzpA contributing to the filament in any
    other way.
  experiment_type: in vitro reconstitution with a non-cleavable substrate
  description: >-
    Mutate the OmcZ cleavage loop so that OzpA cannot cut it, and test whether the protease
    still promotes any assembly. No assembly from an uncleavable substrate would confirm
    that the protease's whole contribution is the single endoproteolytic step, which is
    what this review annotates and what justifies declining the electron-transfer terms.
