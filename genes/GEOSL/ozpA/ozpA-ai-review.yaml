id: Q74BG6
gene_symbol: ozpA
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:243231
  label: Geobacter sulfurreducens PCA
description: >-
  OzpA (OmcZ protease, locus GSU2075) is a secreted subtilisin-family serine protease of
  Geobacter sulfurreducens that performs the maturation cut on the nanowire cytochrome
  OmcZ. The 485-residue precursor carries a cleavable signal peptide, a peptidase S8
  propeptide region and an S8 catalytic domain with the canonical Asp-His-Ser triad, and
  has no transmembrane segment or lipid anchor. OmcZ is made as a 50 kDa form whose
  C-terminal immunoglobulin-like region prevents it from polymerizing; OzpA removes that
  region to give the 30 kDa form, which then self-assembles into the conductive filaments
  that carry electrons from the cell to an electrode. Purified OzpA performs the cut on
  both native and recombinant substrate, and a lysate of Escherichia coli expressing OzpA
  does the same, so the activity belongs to OzpA itself. A strain disrupted in ozpA
  accumulates the precursor, makes none of the mature form, and produces as little
  current as a strain lacking omcZ altogether. Cleaving activity is recovered only from
  the culture supernatant, so maturation happens outside the cell. The gene lies
  immediately downstream of omcZ and is co-transcribed with it and with a
  peptidyl-prolyl cis-trans isomerase; the pairing of an OmcZ-family cytochrome with a
  serine peptidase recurs across bacteria and archaea, including in the anaerobic
  methanotroph nanowire clusters, which makes the protease part of a conserved
  maturation module rather than a local peculiarity.
