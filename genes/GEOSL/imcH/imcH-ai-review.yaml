- term:
    id: GO:0008121
    label: quinol-cytochrome-c reductase activity
  evidence_type: IDA
  original_reference_id: PMID:37779214
  qualifier: enables
  review:
    summary: >-
      Purified ImcH is reduced by the soluble menaquinone analogue menadiol and transfers
      electrons to the periplasmic triheme cytochrome PpcA, releasing the protons from
      quinol oxidation to the same (periplasmic) side as the electrons.
    action: NEW
    reason: >-
      Both half-reactions of a quinol:cytochrome-c oxidoreductase are shown on the
      purified protein: menadiol reduces ImcH, and electrode-bound ImcH continuously
      reduces PpcA in solution, with surface plasmon resonance and NMR identifying PpcA
      as the preferred partner. The structural model places a quinone-binding site on
      the periplasmic face next to heme 1. In vivo genetics are consistent: loss of imcH
      blocks respiration to every acceptor above about -0.1 V versus SHE while leaving
      fumarate respiration intact. Two limitations are worth stating rather than hiding,
      and they are why this is proposed as a single IDA row rather than as a core
      catalytic claim with kinetics behind it: menadiol reduces only about two of the
      seven hemes, so no single-turnover quinol-to-PpcA assay has been reported, and the
      2017 paper explicitly cautioned that the in vivo quinone-pool step had not then
      been demonstrated directly. The 2023 biochemistry is what now addresses that
      caveat. Two ontology points belong on the record. First, this term is a direct
      is_a child of GO:0009055 electron transfer activity, which the gene already carries
      by IBA, so this row is a refinement of that one and not an orthogonal addition; the
      IBA row is marked TOO_GENERAL above for that reason. Second, the term asserts more
      than ImcH does. Its definition opens "Enables the transfer of a solute or solutes
      from one side of a membrane to the other", and it is is_a GO:0015078 proton
      transmembrane transporter activity and GO:0015453
      oxidoreduction-driven active transmembrane transporter activity, because the
      archetypal quinol-cytochrome-c reductase is the proton-translocating cytochrome bc1
      complex. ImcH has no such mechanism: the quinol-binding site sits on the
      periplasmic (P) face beside heme 1, the acceptor PpcA is periplasmic, and the
      catechol proton assay shows the protons released on quinol oxidation go to the same
      side, so nothing crosses the membrane and the reaction is electroneutral. The
      "2 H+(out)" half of the definition is right for ImcH; the transporter parentage is
      not. The term is nonetheless asserted here because it is the only GO term that names
      both the quinol donor and the cytochrome c acceptor (GO:0016681, the non-transporter
      "cytochrome as acceptor" intermediate, is obsolete, and its surviving genus
      GO:0016679 names no acceptor), the chemistry it describes is what the evidence shows,
      and the defect is in the ontology rather than in this gene's biology. The mismatch is
      raised as a suggested question and as a proposed_new_terms entry for an electroneutral
      menaquinol:cytochrome-c oxidoreductase activity under GO:0016679, and if GOA later
      derives a GO:1902600 proton transmembrane transport row from this term by
      inter-ontology inference (GO_REF:0000108), that row would be an over-annotation for
      ImcH. This is the same resolution reached for the family member CymA, whose
      experimental GO:0008121 rows were kept and whose derived GO:1902600 row was marked
      over-annotated.
    supported_by:
    - reference_id: PMID:37779214
      supporting_text: menadiol, a soluble menaquinone analogue, was used to reduce DDM‐solubilized
        ImcH
    - reference_id: PMID:37779214
      supporting_text: the development of a cathodic peak centered at −170
    - reference_id: PMID:37779214
      supporting_text: that derives from the continuous electron transfer from the electrode‐bound
        ImcH to PpcA
    - reference_id: PMID:37779214
      supporting_text: protons released from MKH 2 oxidation by ImcH are transferred away
        from the electrode
    - reference_id: PMID:37779214
      supporting_text: These results suggest that ImcH is electroneutral since it releases
        electrons and protons to the same side of the membrane.
    - reference_id: PMID:37779214
      supporting_text: the presence of a quinone‐binding site on the P‐side of the membrane
    - reference_id: PMID:25425235
      supporting_text: Since NapC/NirT-family proteins typically transfer electrons from
        the quinone pool to periplasmic acceptors
