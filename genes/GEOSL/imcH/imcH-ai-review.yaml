        heme-c attachment motifs (CXXCH or CXXXCH at residues 132, 157, 206, 312, 429, 449
        and 487), the primary description reports up to seven motifs, and iron
        quantification on purified ImcH gives 6.6 iron atoms per polypeptide. The count in
        the PTM line should therefore read 7; the FT BINDING set needs the same correction,
        with three further heme sites added.
      supported_by:
