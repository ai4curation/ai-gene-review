id: Q747K6
gene_symbol: imcH
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:243231
  label: Geobacter sulfurreducens PCA
description: >-
  ImcH (inner membrane cytochrome H, locus GSU3259) is a 507-residue multiheme c-type
  cytochrome of the NapC/NirT/NrfH superfamily anchored in the cytoplasmic (inner)
  membrane of Geobacter sulfurreducens by three transmembrane helices, with a large
  periplasm-facing domain carrying seven c-type heme motifs. It is one of at least
  three inner-membrane routes by which electrons leave the menaquinol pool on their
  way to acceptors outside the cell, and it is the route used when the terminal
  acceptor has a high redox potential. Cells lacking imcH cannot reduce Fe(III)
  citrate, Fe(III)-EDTA, Mn(IV) oxides or electrodes poised above about -0.1 V versus
  SHE, yet reduce low-potential Fe(III) oxides such as ferrihydrite and goethite
  normally through the CbcL- and CbcBA-dependent pathways; growth on the soluble
  intracellular acceptor fumarate is unaffected. The protein is constitutively
  expressed. Purified ImcH is reduced by the menaquinone analogue menadiol, its hemes
  titrate between -150 and -358 mV, and it transfers electrons to the abundant
  periplasmic triheme cytochrome PpcA, which it binds with higher affinity than PpcA's
  homologues; protons released on quinol oxidation are delivered to the same
  (periplasmic) side as the electrons, so the step is electroneutral, translocating no
  charge and so making no contribution to the membrane potential. Because the protons are
  nonetheless released into the periplasm, the step is proposed to contribute to the pH
  component of the proton motive force, which would make ImcH the only Geobacter
  respiratory membrane protein so far known to do so: the b-type-heme inner-membrane
  oxidoreductases CbcL and CbcBA are expected to release their protons on the cytoplasmic
  side. ImcH homologues occur throughout
  metal-reducing Geobacteraceae and Anaeromyxobacter and in other Fe(III)-reducing
  lineages, and are absent from fermentative and chlororespiratory relatives.
