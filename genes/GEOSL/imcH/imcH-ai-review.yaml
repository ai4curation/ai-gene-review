- id: PMID:25425235
  title: An inner membrane cytochrome required only for reduction of high redox potential
    extracellular electron acceptors.
  findings:
  - statement: >-
      ImcH (GSU3259) is an inner-membrane multiheme c-type cytochrome with NapC/NirT
      homology and up to seven heme-c motifs, identified by transposon mutants unable
      to grow on Fe(III) citrate.
    supporting_text: a region of NapC/NirT homology, and up to 7 c-type heme binding
      motifs
    reference_section_type: RESULTS
  - statement: >-
      A chromosomally His-tagged ImcH was found only in sucrose-gradient fractions with
      succinate dehydrogenase activity, placing it in the inner membrane.
    supporting_text: ImcH was detected only in fractions with SDH activity.
    reference_section_type: RESULTS
  - statement: >-
      Deleting imcH abolishes reduction of high-potential acceptors, including Mn(IV)
      birnessite, while leaving fumarate respiration intact.
    supporting_text: ΔimcH::Kanr cells also could not reduce laboratory-synthesized Mn(IV)
      oxides (birnessite)
    reference_section_type: RESULTS
  - statement: >-
      The authors' model routes electron flux out of the quinone pool through ImcH when
      the external acceptor has a high redox potential.
    supporting_text: cells typically route electron flux out of the quinone pool via an
      ImcH-dependent pathway for reduction of high-potential acceptors
    reference_section_type: DISCUSSION
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text cached (PMC4251993). The paper that named the gene and the source of
      both the Swiss-Prot FUNCTION/SUBCELLULAR LOCATION statements and the EXP plasma
      membrane row. Phenotypes are reported for a clean deletion with complementation,
      on the strain the review is about.
- id: PMID:37779214
  title: Characterization of the inner membrane cytochrome ImcH from Geobacter reveals
    its importance for extracellular electron transfer and energy conservation.
  findings:
  - statement: >-
      Purified recombinant ImcH carries ~7 c-type hemes (6.6 iron atoms per
      polypeptide) and retains its uncleaved N-terminal membrane anchor.
    supporting_text: heme iron quantification determined a 6.6 iron atom to protein ratio
    reference_section_type: RESULTS
  - statement: >-
      Menadiol, a soluble menaquinone analogue, reduces only about two of the seven
      hemes, so quinol reduction of the protein is partial under those conditions.
    supporting_text: reduction was only achieved for approximately two of the seven hemes
      present in the protein
    reference_section_type: RESULTS
  - statement: >-
      All five Ppc triheme cytochromes bind ImcH, PpcA most strongly (K_D about 2.7 µM),
      while the monoheme PccH does not.
    supporting_text: All the Ppc cytochromes interact with ImcH, with PpcA showing the
      highest response
    reference_section_type: RESULTS
  - statement: >-
      Electrode-bound ImcH transfers electrons continuously to PpcA in solution.
    supporting_text: the development of a cathodic peak centered at −170
    reference_section_type: RESULTS
  - statement: >-
      Protons released on menaquinol oxidation leave on the same side as the electrons,
      making the ImcH step electroneutral.
    supporting_text: These results suggest that ImcH is electroneutral since it releases
      electrons and protons to the same side of the membrane.
    reference_section_type: RESULTS
  - statement: >-
      Being electroneutral does not make the step energetically silent: because the
      protons are released into the periplasm, the authors argue that ImcH contributes to
      the pH component of the proton motive force.
    supporting_text: ImcH may contribute to the maintenance of a pmf since it releases
      protons on the P‐side of the membrane
    reference_section_type: DISCUSSION
  - statement: >-
      On the authors' reading ImcH is the only Geobacter respiratory membrane protein so
      far known to maintain a proton motive force, because CbcL and CbcBA are expected to
      oxidise menaquinol on the cytoplasmic side and release their protons there.
    supporting_text: This would make ImcH the only respiratory membrane protein in Geobacter
      known so far that contributes to the maintenance of the pmf
    reference_section_type: DISCUSSION
  - statement: >-
      The protons released on menaquinol oxidation by ImcH move away from the
      quinol-oxidising face's aqueous probe, which is the direct measurement behind the
      electroneutrality conclusion.
    supporting_text: protons released from MKH 2 oxidation by ImcH are transferred away
      from the electrode
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text cached (PMC10601379). The only biochemical characterisation of the
      isolated protein. Caveat recorded in the quinol-cytochrome-c reductase row: the
      protein was produced heterologously in S. oneidensis and the two half-reactions
      were measured separately, not as a single turnover.
