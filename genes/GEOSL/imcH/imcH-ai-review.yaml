  review:
    summary: >-
      A chromosomally His-tagged ImcH allele was fractionated on a sucrose gradient and
      found only in the fractions carrying succinate dehydrogenase activity, the
      inner-membrane marker. In a Gram-negative bacterium the inner membrane is the
      plasma membrane.
    action: ACCEPT
    reason: >-
      This is direct experimental localization of the protein itself, not of a fusion
      expressed elsewhere, and the marker enzyme controls for the obvious confusion
      with the outer membrane, where most of the Geobacter cytochrome mass sits. The
      result also agrees with an independent proteomic survey cited in the same paper
      and with the Swiss-Prot curated statement "Cell inner membrane". GO offers no
      bacterial inner-membrane term under plasma membrane that would make this row more
      specific, so no MODIFY is available; the location is also where the core activity
      happens, so the row is core rather than peripheral.
