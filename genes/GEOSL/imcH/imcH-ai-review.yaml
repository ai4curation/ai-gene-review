proposed_new_terms:
- proposed_name: electroneutral menaquinol:cytochrome c oxidoreductase activity
  proposed_definition: >-
    Catalysis of the reaction: a menaquinol + 2 Fe(III)-cytochrome c = a menaquinone +
    2 Fe(II)-cytochrome c + 2 H+, in which the quinol-oxidising site and the cytochrome c
    acceptor are on the same side of the membrane, so that the protons released on quinol
    oxidation are delivered to that same side and no charge or proton is translocated
    across the membrane.
  proposed_parent:
    id: GO:0016679
    label: oxidoreductase activity, acting on diphenols and related substances as donors
  justification: >-
    The only existing GO term that names both a quinol donor and a cytochrome c acceptor,
    GO:0008121 quinol-cytochrome-c reductase activity, is is_a GO:0015078 proton
    transmembrane transporter activity and GO:0015453 oxidoreduction-driven active
    transmembrane transporter activity, and its definition opens "Enables the transfer of
    a solute or solutes from one side of a membrane to the other". That parentage comes
    from the proton-translocating cytochrome bc1 complex and is wrong for the
    NapC/NirT/NrfH superfamily, whose members hold the quinol site and the cytochrome
    acceptor on the same (periplasmic) face: for ImcH the proton-release side was measured
    directly and the reaction is electroneutral. The non-transporter intermediate that
    would otherwise serve, GO:0016681, is obsolete, and its surviving genus GO:0016679
    names no acceptor. A sibling of GO:0008121 under GO:0016679 without transporter
    parents would let ImcH, CymA, NrfH, TorC, TorY and their homologues be annotated to
    the chemistry they perform without asserting proton translocation they do not perform.
    An acceptable alternative upstream fix would be to loosen GO:0008121 itself by removing
    the transporter parents and creating a proton-translocating child for the bc1 complex.
  supported_by:
  - reference_id: PMID:37779214
    supporting_text: These results suggest that ImcH is electroneutral since it releases
      electrons and protons to the same side of the membrane.
  - reference_id: PMID:37779214
    supporting_text: protons released from MKH 2 oxidation by ImcH are transferred away
      from the electrode
  - reference_id: PMID:37779214
    supporting_text: the presence of a quinone‐binding site on the P‐side of the membrane
suggested_questions:
- question: >-
    How should GO represent an activity that is conditional on the redox potential of
    the terminal acceptor? ImcH, CbcL and CbcBA all oxidise the same menaquinol pool
    and differ only in the potential window in which they operate, and no existing term
    distinguishes them.
- question: >-
    Is PpcA the obligate physiological acceptor of ImcH in vivo, or can any of the five
    Ppc cytochromes substitute, given that they are described as physiologically
    equivalent but differ in expression and heme potentials?
- question: >-
    How much of the proton motive force does ImcH actually build, and in which component?
    The voltammetric evidence makes the step electroneutral, so it adds nothing to the
    membrane potential, yet the same work argues that releasing the protons into the
    periplasm contributes to the pH gradient and would make ImcH the only Geobacter
    respiratory membrane protein known to maintain a pmf. Measuring the two components
    separately would settle whether the energetic advantage of the high-potential pathway
    lies in that proton release, in the larger potential drop available to the acceptor,
    or in the proton-coupled electron transfer of the downstream Ppc cytochromes.
- question: >-
    Should GO:0008121 quinol-cytochrome-c reductase activity keep its transmembrane
    proton-transporter parents? The term is the only one naming both a quinol donor and a
    cytochrome c acceptor, but it is is_a GO:0015078 and GO:0015453 because the archetypal
    enzyme is the proton-translocating cytochrome bc1 complex, and it therefore asserts
    proton translocation for every NapC/NirT/NrfH-family member that holds its quinol site
    and its acceptor on the same face of the membrane. ImcH is measured to be
    electroneutral, so either the term needs an electroneutral sibling under GO:0016679
    (see proposed_new_terms) or the transporter parents should move to a bc1-specific
    child.
suggested_experiments:
- experiment_type: enzyme assay on purified protein
  description: >-
    Reconstitute ImcH into proteoliposomes containing menaquinone and measure
    steady-state menaquinol:PpcA oxidoreductase turnover, so that the two half-reactions
    characterised separately in vitro are shown as a single catalytic cycle, with rates
    comparable to those of CymA and NrfH.
- experiment_type: targeted mutagenesis
  description: >-
    Mutate the conserved protonatable residues of the predicted periplasmic
    quinone-binding pocket and the unusual His/Gln axial pair of heme 1, then test
    menadiol reduction in vitro and growth on high-potential electrodes in vivo, to
    establish whether that site is the quinol-oxidising centre.
- experiment_type: comparative physiology
  description: >-
    Measure H+/e- stoichiometry and growth yield of wild type, ΔimcH and ΔcbcL on
    electrodes poised either side of the -0.1 V threshold, resolving the membrane
    potential and the pH gradient separately, to test directly whether the energetic
    advantage of the ImcH pathway lies in the periplasmic proton release building a pH
    gradient or only in the larger potential drop available to the acceptor.
