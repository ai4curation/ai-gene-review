- term:
    id: GO:0020037
    label: heme binding
  evidence_type: IDA
  original_reference_id: PMID:37779214
  qualifier: enables
  review:
    summary: >-
      ImcH is a multiheme c-type cytochrome; iron quantification on the purified protein
      gives 6.6 iron atoms per polypeptide, matching the seven CXXCH/CXXXCH motifs in
      the sequence.
    action: NEW
    reason: >-
      Heme is the cofactor that every other assertion in this review depends on, it is
      measured directly on purified ImcH, and no GOA row covers it. The covalent c-type
      attachment is also what the family assignment and the PROSITE MULTIHEME_CYTC
      match rest on. This is a cofactor-binding molecular function, neither an ancestor
      nor a descendant of the electron transfer and quinol-cytochrome-c reductase terms
      asserted here.
    supported_by:
    - reference_id: PMID:37779214
      supporting_text: heme iron quantification determined a 6.6 iron atom to protein
        ratio
    - reference_id: PMID:25425235
      supporting_text: a region of NapC/NirT homology, and up to 7 c-type heme binding
        motifs
    source_defects:
    - defect_type: OTHER
      resource: UNIPROT
      record: UniProtKB:Q747K6
      slot: CC:PTM
      requested_change: REPOINT
      asserted_value: '4'
      corrected_value: '7'
      corrected_label: Binds 7 heme c groups covalently per subunit
      confidence: PROBABLE
      explanation: >-
        The Swiss-Prot CC PTM line states "Binds 4 heme c groups covalently per subunit",
