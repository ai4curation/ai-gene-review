  label: Geobacter sulfurreducens PCA
description: PutA from Geobacter sulfurreducens PCA is a class 2A bifunctional proline-catabolic flavoenzyme.
  It couples FAD-dependent oxidation of L-proline to pyrroline-5-carboxylate with NAD-dependent oxidation
  of glutamate semialdehyde to L-glutamate. A tunnel between the active sites supports substrate channeling,
  and the protein forms a domain-swapped dimer. Its quinone-binding site supports a peripheral membrane-associated
  catalytic role. This architecture lacks the N-terminal transcriptional-repressor module found in class 1C
  PutAs.
