core_functions:
- description: Oxidizes L-proline to P5C through the FAD-dependent PRODH module, with quinone reoxidation
    supported using model acceptors. The reaction is coupled by an internal channel to the GSALDH module.
    Direct biochemical evidence is from recombinant PCA Q746X3; the endogenous quinone is not identified.
