- id: PMID:28420730
  title: 'Structure and characterization of a class 3B proline utilization A: Ligand-induced dimerization
    and importance of the C-terminal domain for catalysis.'
  findings:
  - statement: Class3B CfPutA has two catalytic sites, ligand-dependent oligomerization and channeling;
      regulatory class 1C architecture is distinguished.
    supporting_text: Here, we studied PutA from Corynebacterium freiburgense (CfPutA), which belongs to
      the uncharacterized 3B class of PutAs.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full cached paper read. CfPutA is a 1074-residue synthetic codon-optimized protein with
      His8/TEV tag removal. Deposited5UX5 and UniProt include leading GH at PDB -1/0; a native strain or
      genomic accession is not assigned. Model acceptors, recombinant oligomerization and CT-domain deletion
      assays do not establish native regulation or respiratory partners.
- id: PMID:34506758
  title: Probing the function of a ligand-modulated dynamic tunnel in bifunctional proline utilization
    A (PutA).
  findings:
  - statement: The exact PCA/Q746X3 wild-type protein and A206W mutant were examined separately; both
      catalytic modules and coupled turnover were assayed.
    supporting_text: All experiments were performed on PutA from Geobacter sulfurreducens PCA (GsPutA,
      1004 residues, UniProt Q746X3).
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full cached primary study read. Recombinant BL21-AI expression, His-tag cleavage and
      defined model acceptors are explicit. A206W impairs PRODH flavin reduction; its low coupled activity
      is not interpreted as a pure channel-blocking effect.
- id: PMID:24550478
  title: Structures of the PutA peripheral membrane flavoenzyme reveal a dynamic substrate-channeling
    tunnel and the quinone-binding site.
  findings:
  - statement: The target quinone site supports a membrane-approach model and the linked active sites
      support channeling.
    supporting_text: The location of the quinone site implies that the concave surface of the PutA dimer
      approaches the membrane.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Repository cache is abstract-only and preserved. Relevant full-text PMC sections were
      accessible in an initial web retrieval; subsequent requests encountered browser challenge and XML
      retrieval failed. The cached abstract itself supports the quoted membrane-orientation inference.
      Native quinone identity and direct cell-localization assays are not claimed.
