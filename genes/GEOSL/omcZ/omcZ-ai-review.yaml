- id: DOI:10.1038/s41467-026-78976-x
  title: Electrode-associated growth reveals structure of OmcZ-type cytochrome nanowires
    in anaerobic methanotrophic archaea
  findings:
  - statement: >-
      The filament-forming part of G. sulfurreducens OmcZ is 258 residues long and carries
      one heme on a CX14CH motif; an archaeal OmcZ-type cytochrome (OmcZ2 of 'Ca.
      Methanoperedens vercellensis') has eight canonical hemes on a 330-residue
      filament-forming part.
    supporting_text: In contrast, the nanowire-forming part of OmcZGs comprises 258 residues
      and includes one heme bound by a non-canonical motif (CX14CH).
    reference_section_type: RESULTS
  - statement: >-
      Bacterial and archaeal OmcZ share a conserved core architecture, including three
      His-His motifs that link adjacent heme pairs.
    supporting_text: Central to this organization are three conserved histidine-histidine
      (HH) motifs that link adjacent heme pairs in both OmcZ2Mv and OmcZGs together.
    reference_section_type: RESULTS
  - statement: >-
      The C-terminal region removed during maturation is predicted to form two Ig-like
      beta-sandwich domains in G. sulfurreducens OmcZ.
    supporting_text: AlphaFold predictions of full-length OmcZ proteins indicate that the
      cleaved C-terminal regions adopt β-sandwich folds resembling immunoglobulin-like domains,
      with three such domains in OmcZ2Mv and two in OmcZGs
    reference_section_type: RESULTS
  - statement: >-
      G. sulfurreducens OmcZ has only three N-glycosylation motifs and no detectable glycan
      density.
    supporting_text: whereas OmcZGs contains only three such motifs and shows no detectable
      extra densities
    reference_section_type: RESULTS
  - statement: >-
      Bacterial OmcZ homologues form their own phylogenetic group (Group VI), separate
      from archaeal groups I-V.
    supporting_text: Group VI contains bacterial OmcZ homologs
    reference_section_type: RESULTS
  - statement: >-
      G. sulfurreducens OmcZ filaments aggregate into dense networks between cells and
      electrodes, unlike the straighter archaeal filaments.
    supporting_text: Whereas OmcZGs nanowires aggregate extensively and densely fill the extracellular
      space between bacterial cells and electrodes
    reference_section_type: DISCUSSION
  - statement: >-
      Archaea assemble OmcZ filaments with no prolyl isomerase in the gene cluster, which
      calls into question the proposed role of the Geobacter isomerase in OmcZ folding.
    supporting_text: Surprisingly, these archaea assemble OmcZ into nanowires even in the
      apparent absence of prolyl isomerase involved in folding bacterial OmcZ.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Supplied by the requester as the published CC-BY PDF (Nature Communications
      17:11117, published 2026-11-09). Not yet indexed in PubMed, so cached under its DOI
      from the PDF text. The paper is mainly about the archaeal homologue; for G.
      sulfurreducens OmcZ it is comparative (structural alignment with PDB 7LQ5,
      phylogeny, glycosylation motifs) and does not re-test the Geobacter phenotype. Its
      claims about OmcZ in G. sulfurreducens rest on PMID:36732469, PMID:32807967 and
      PMID:33837010.
core_functions:
- description: >-
    Extracellular, filament-based electron conduit for respiration on an anode. OmcZ is
    exported through the PilA-N/PilA-C pilus and cut outside the cell by OzpA. The
    eight-heme OmcZS then polymerizes into filaments embedded in the polysaccharide
    biofilm matrix and concentrated at the electrode surface. Electrons from the
    outer-membrane cytochromes pass along the stacked hemes of the filament toward the
    acceptor, which lets cells many micrometres from the anode respire on it. This is
    why omcZ deletion collapses current density and prevents thick current-producing
    biofilms while leaving growth on soluble acceptors and on Fe(III) oxide intact. The
    same conduit can deliver electrons to soluble metals and quinones in vitro. It
    contributes to electron uptake from Fe(0), and to direct interspecies electron
    transfer from G. metallireducens, in strain backgrounds that lack hydrogen-based
    alternatives.
  molecular_function:
    id: GO:0009055
    label: electron transfer activity
  directly_involved_in:
  - id: GO:0019645
    label: anaerobic electron transport chain
  locations:
  - id: GO:0097311
    label: bacterial biofilm matrix
  supported_by:
  - reference_id: PMID:20400562
    supporting_text: OmcZ(S) transferred electrons in vitro to a diversity of potential extracellular
      electron acceptors, such as Fe(III) citrate, U(VI), Cr(VI), Au(III), Mn(IV) oxide, and
      the humic substance analogue anthraquinone-2,6-disulfonate, but not Fe(III) oxide.
  - reference_id: PMID:19461962
    supporting_text: only deletion of pilA or omcZ severely inhibited current production and
      biofilm formation in current-harvesting mode
  - reference_id: PMID:23761253
    supporting_text: When G. sulfurreducens grew as a biofilm on a graphite electrode that served
      as an anode and the sole electron acceptor for growth, OmcZ was highly concentrated at
      the biofilm-electrode interface.
  - reference_id: PMID:36732469
    supporting_text: In OmcZ, haems I–V and VII form a linear, central, electron transport chain
      whereas haem VI is surface exposed
  - reference_id: PMID:33837010
    supporting_text: the ozpA mutant accumulated OmcZL and did not produce OmcZS, which is thought
      to be a mature form that is essential for the extracellular electron transfer to the electrode
proposed_new_terms:
- proposed_name: extracellular cytochrome filament
  proposed_definition: >-
    A helical, non-membrane-bounded protein polymer that lies outside the cell and is
    built from repeating subunits of a secreted multiheme c-type cytochrome. The hemes
    stack along the filament axis, so electrons can be transferred along its length
    between the cell and extracellular electron acceptors or donors.
  proposed_parent:
    id: GO:0099080
    label: supramolecular complex
  justification: >-
    Cryo-EM structures now exist for extracellular filaments made of the G.
    sulfurreducens cytochromes OmcS, OmcE and OmcZ, and of archaeal OmcZ-type and
    ECN-type cytochromes (Pyrobaculum, Archaeoglobus, 'Ca. Methanoperedens'). GO has no
    component term for them. The available terms describe either the medium they sit in
    (extracellular region, biofilm matrix) or the unrelated pilus (GO:0009289 pilus, a
    proteinaceous hair-like appendage on the surface of bacteria), which would wrongly
    imply a pilin-based appendage. Members of this class differ in heme packing and
    evidently arose more than once, so the term should be defined by structure and
    location, not by homology. A suitable placement is under GO:0099080 supramolecular
    complex, with part_of GO:0005576 extracellular region. The same term is proposed in
    the OmcS review; the narrative case for it, the naming question (the field says
    "extracellular cytochrome nanowire"), and the three further process-term gaps are
    collected in projects/EXTRACELLULAR_CYTOCHROME_NANOWIRES.md.
  supported_by:
  - reference_id: PMID:36062910
    supporting_text: This new structural evidence suggests that conductive cytochrome polymers
      arose independently on more than one occasion from different ancestral multiheme proteins.
  - reference_id: DOI:10.1038/s41467-026-78976-x
    supporting_text: Although their molecular identity was long debated, accumulating evidence
      now supports polymerized MHCs of OmcS25,26 and OmcZ27,28 as the primary components of
      nanowires for EET.
suggested_questions:
- question: >-
    What is OmcZ for outside the laboratory? It is strongly and specifically induced on
    poised anodes, but no natural acceptor or growth condition with a comparable induction
    has been identified, and the omcZ deletion grows normally on Fe(III) oxide in the
    original study.
- question: >-
    Is OmcZ needed for ferrihydrite reduction? Jiang et al. 2023 report an impaired
    ΔomcZ, whereas Nevin et al. 2009 and Gu et al. 2023 report no requirement. Do strain
    background (PCA versus CL-1 or KN400) and the compensating up-regulation of other
    outer-surface cytochromes explain the difference?
- question: >-
    How do OmcZ filaments receive electrons from the outer-membrane porin-cytochrome
    conduits, given that the mature filament is released by cleavage outside the cell and
    no anchor to the outer membrane is known?
- question: >-
    Is the peptidyl-prolyl isomerase GSU2074 in the omcZ operon actually needed for OmcZ
    folding? Archaeal OmcZ-type cytochromes form filaments without an isomerase in the
    cluster.
- question: >-
    Should GO capture conduction along an extracellular cytochrome filament with a
    dedicated activity or component term, rather than generic electron transfer activity
    plus a biofilm-matrix location?
suggested_experiments:
- hypothesis: >-
    OmcZ filaments receive their electrons from a specific outer-membrane
    porin-cytochrome conduit at the cell surface.
  experiment_type: genetic epistasis with electrochemistry
  description: >-
    In a background that makes only OmcZ filaments (omcS, omcE and omcT deleted), delete
    each outer-membrane conduit in turn (extABCD, ombB-omaB-omcB, ombC-omaC-omcC) and
    measure current density and biofilm thickness on a poised anode, with and without
    plasmid-borne complementation. A conduit whose loss phenocopies omcZ deletion while
    OmcZ filaments are still present and correctly localized (checked by immunogold TEM)
    identifies the entry point of electrons into the filament.
- hypothesis: >-
    The conflicting ferrihydrite phenotypes reflect strain background and compensatory
    expression of other outer-surface cytochromes rather than a real difference in what
    OmcZ does.
  experiment_type: comparative mutant phenotyping with transcriptomics
  description: >-
    Build omcZ deletions in the same backgrounds used by the conflicting studies (PCA,
    CL-1, KN400) with a common method, and measure Fe(III) oxide reduction rates side by
    side under identical conditions. In each mutant, measure transcript and protein
    levels of omcS, omcT, omcE and the ext clusters, to test whether the strains that
    tolerate omcZ loss are the ones that up-regulate an alternative.
- hypothesis: >-
    The peptidyl-prolyl isomerase GSU2074 is not required for OmcZ folding or filament
    assembly, despite being co-transcribed with omcZ and ozpA.
  experiment_type: targeted deletion with structural readout
  description: >-
    Delete GSU2074 alone, without disturbing omcZ or ozpA transcription (e.g. by
    in-frame deletion plus in trans complementation controls), and ask whether OmcZS is
    still produced, still assembles into filaments of native morphology by negative-stain
    TEM, and still supports current on an anode. If filaments form normally, the
    isomerase acts on something else, as the archaeal clusters that lack one would
    predict.
- hypothesis: >-
    OmcZ has a natural extracellular acceptor whose reduction has been missed because
    anodes dominate the assay repertoire.
  experiment_type: phenotype screen across acceptors
  description: >-
    Compare wild type and an omcZ deletion for growth and reduction rate across a panel
    of extracellular acceptors that have not been systematically tested, including humic
    substances and their analogues, Mn(IV) oxides of different crystallinity, structural
    Fe(III) in clays, and elemental sulfur, under conditions where omcZ expression is
    first confirmed by RT-qPCR. The point is to find a condition in which omcZ is induced
    to anode-like levels, which no study has yet reported.
