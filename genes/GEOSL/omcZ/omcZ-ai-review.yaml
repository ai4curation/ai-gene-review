id: Q74BG5
gene_symbol: omcZ
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:243231
  label: Geobacter sulfurreducens PCA
description: >-
  OmcZ (outer-surface c-type cytochrome Z, locus GSU2076) is an octaheme c-type
  cytochrome of Geobacter sulfurreducens that polymerizes outside the cell into
  helical filaments ("nanowires"). These filaments carry electrons from the cell to
  extracellular acceptors over distances far greater than a cell length. The 473-residue
  precursor has a signal peptide and is made as a 50 kDa form (OmcZL). The
  subtilisin-like serine protease OzpA, encoded immediately downstream in the same
  operon, cuts it outside the cell into a 30 kDa form (OmcZS, about 258 residues). OmcZS
  keeps all eight hemes, including one attached through a non-canonical CX14CH motif,
  and loses a C-terminal region of Ig-like beta-sandwich domains. Cleaved OmcZS
  assembles spontaneously into filaments. In the cryo-EM structures, seven hemes stack
  into a linear chain along each subunit and an eighth branches off and is exposed to
  solvent; unlike the OmcS and OmcE filaments, subunits are not linked through
  coordination of each other's hemes. The purified protein is very thermostable. Its
  hemes titrate over -420 to -60 mV (midpoint about -220 mV versus SHE), and it delivers
  electrons in vitro to Fe(III) citrate, U(VI), Cr(VI), Au(III), Mn(IV) oxide and a
  humic-acid analogue. Export to the cell surface requires the PilA-N/PilA-C pilus, and
  in the biofilm OmcZ sits in a polysaccharide-anchored extracellular matrix,
  concentrated at the interface between the biofilm and an electrode anode. OmcZ is
  needed for high current density on anodes: deletion cuts current about ten-fold and
  thick, current-producing biofilms are not formed. Growth on fumarate, Fe(III) citrate
  or Fe(III) oxide is unaffected in the original deletion study. Production of OmcZ
  filaments rises when biofilms grow on electrodes or under an applied electric field.
  OmcZ also contributes to electron uptake from metallic iron and to direct
  interspecies electron transfer in some strain backgrounds. Homologues, usually
  encoded next to an OzpA-like serine peptidase, occur in other Geobacteraceae and are
  widespread in anaerobic methanotrophic archaea, where an OmcZ-type cytochrome forms
  the surface filaments of electrode-grown cells.
existing_annotations:
- term:
    id: GO:0009055
    label: electron transfer activity
  evidence_type: IDA
  original_reference_id: PMID:20400562
  qualifier: enables
  review:
    summary: >-
      Purified OmcZS, the mature eight-heme form, passes electrons to a range of
      extracellular acceptors in vitro (Fe(III) citrate, U(VI), Cr(VI), Au(III),
      Mn(IV) oxide, AQDS). Its hemes cover a broad potential window. The cryo-EM
      structures place seven of the hemes in a stacked chain that runs through each
      subunit of the filament.
    action: NEW
    reason: >-
      GOA has no molecular-function annotation for OmcZ, yet carrying electrons is what
      the protein is for. The activity is shown on the purified protein
      (PMID:20400562). It is consistent with the heme chain seen in two independent
      filament structures (PMID:36732469, PMID:36062910), and deleting the solvent-exposed
      heme II loop slows electron transfer to extracellular acceptors (PMID:36732469).
      The term is deliberately the generic carrier term. GO:0016722 oxidoreductase
      activity, acting on metal ions was considered and declined: the in vitro metal
      reductions are single-turnover electron deliveries by the reduced cytochrome, and
      the omcZ deletion does not affect growth on Fe(III) citrate or Fe(III) oxide
      (PMID:19461962), so reducing metals is not shown to be what the protein evolved to
      do. The term also makes no claim about conduction mechanism. The reported
      metallic-like conductivity of OmcZ filaments (PMID:32807967) is disputed
      (PMID:37552847, PMID:38633696), but that dispute concerns how fast and by what
      physics electrons move, not whether OmcZ transfers them.
    supported_by:
    - reference_id: PMID:20400562
      supporting_text: OmcZ(S) transferred electrons in vitro to a diversity of potential
        extracellular electron acceptors, such as Fe(III) citrate, U(VI), Cr(VI), Au(III),
        Mn(IV) oxide, and the humic substance analogue anthraquinone-2,6-disulfonate,
        but not Fe(III) oxide.
    - reference_id: PMID:36732469
      supporting_text: In OmcZ, haems I–V and VII form a linear, central, electron transport
        chain whereas haem VI is surface exposed
    - reference_id: PMID:36732469
      supporting_text: Using reconstituted OmcZ, we find that deletion of the haem II loop
        reduces the rate of electron transfer by OmcZ nanowires to extracellular electron
        acceptors compared with the WT
- term:
    id: GO:0020037
    label: heme binding
  evidence_type: IDA
  original_reference_id: PMID:36732469
  qualifier: enables
  review:
    summary: >-
      OmcZS carries eight covalently bound c-type hemes. All eight are resolved in the
      3.5 Å cryo-EM structure of native filaments and were counted in the purified
      protein. One heme is attached through a non-canonical CX14CH motif.
    action: NEW
    reason: >-
      Heme binding is the cofactor basis of the electron-transfer function and is shown
      directly for this protein. Two independent cryo-EM structures resolve the heme
      chain (PMID:36732469; PMID:36062910), and purified OmcZS retains all eight hemes
      (PMID:20400562). UniProt Q74BG5 records the heme c binding sites from PDB 7LQ5 and
      8D9M. GOA has no row for it. As with other multiheme cytochromes in this
      repository (OmcA, ImcH, CbcL), heme binding is recorded alongside the
      electron-transfer row and is not treated as a separate core function.
    supported_by:
    - reference_id: PMID:36732469
      supporting_text: At this resolution, the backbone density along with many bulky sidechain
        densities, such as aromatic residues and all eight haem densities, are visible
    - reference_id: PMID:20400562
      supporting_text: OmcZ(S) is a cleaved product of OmcZ(L) retaining all 8 hemes, including
        1 heme with the unusual c-type heme-binding motif CX(14)CH
    - reference_id: DOI:10.1038/s41467-026-78976-x
      supporting_text: In contrast, the nanowire-forming part of OmcZGs comprises 258 residues
        and includes one heme bound by a non-canonical motif (CX14CH).
- term:
    id: GO:0097311
    label: bacterial biofilm matrix
  evidence_type: IDA
  original_reference_id: PMID:23761253
  qualifier: located_in
  review:
    summary: >-
      Immunogold labelling places OmcZ throughout the extracellular matrix around
      aggregated cells, and highly concentrated at the biofilm-anode interface in
      current-producing biofilms. Matrix sheared from cells contains OmcZ bound to
      polysaccharide, and a mutant that makes less matrix polysaccharide loses it.
    action: NEW
    reason: >-
      GOA has no cellular-component row for OmcZ. The matrix location is where the
      function is exercised, because the filaments bridge cells and the electrode
      through the biofilm. It is shown directly for the endogenous protein by
      immunolabelling (PMID:23761253) and independently by matrix fractionation, where
      the xap polysaccharide mutant's matrix is nearly free of OmcZ (PMID:21169487).
      Subcellular fractionation agrees that the mature form is extracellular
      (PMID:20400562, PMID:34471289). GO:0097311 is a descendant of GO:0005576
      extracellular region, so a separate extracellular-region row would be redundant.
      GO:0009986 cell surface was not used: the mature form is cut off outside the cell
      and dispersed in the matrix, and no anchoring of OmcZ filaments to the outer
      membrane has been shown. The precursor (OmcZL) is found in the periplasm on its
      way out, and that transit is not annotated.
    supported_by:
    - reference_id: PMID:23761253
      supporting_text: OmcZ was dispersed throughout the extracellular matrix surrounding
        the cells that accumulated at the bottom of the culture tubes of cells grown under
        standard conditions with fumarate as the electron acceptor.
    - reference_id: PMID:23761253
      supporting_text: When G. sulfurreducens grew as a biofilm on a graphite electrode that
        served as an anode and the sole electron acceptor for growth, OmcZ was highly concentrated
        at the biofilm-electrode interface.
    - reference_id: PMID:21169487
      supporting_text: The matrix from the mutant contained 60% less sugar and was nearly
        devoid of c-type cytochromes such as OmcZ.
    - reference_id: PMID:34471289
      supporting_text: Our subcellular localization experiments revealed that both OmcS and
        OmcZ are present in the extracellular fraction of wild-type cells but remain in the
        periplasm for ΔpilA-N cells
- term:
    id: GO:0019645
    label: anaerobic electron transport chain
  evidence_type: IMP
  original_reference_id: PMID:19461962
  qualifier: involved_in
  review:
    summary: >-
      OmcZ is the extracellular end of the respiratory chain that G. sulfurreducens uses
      when an anode is the terminal electron acceptor. Deleting omcZ cuts maximum current
      about ten-fold, and the mutant does not adapt even after more than 50 days.
      Expressing omcZ from a plasmid restores current to wild-type levels. Growth with
      fumarate, Fe(III) citrate or Fe(III) oxide is unaffected.
    action: NEW
    reason: >-
      OmcZ does part of the work of this process, not merely being required for it: the
      protein is itself an electron carrier whose hemes take electrons on and pass them
      on toward the acceptor (GO:0009055 row). The deletion phenotype is therefore read
      together with direct activity rather than on its own. Complementation rules out a
      polar effect on ozpA, and the specificity of the phenotype places OmcZ in the
      electrode-specific, extracellular branch of the chain rather than in the shared
      upstream segment. Comparator check: other terminal extracellular or envelope
      cytochromes of anaerobic chains reviewed in this repository carry the same term
      (S. oneidensis OmcA; G. sulfurreducens ImcH and CbcL). No narrower GO process term
      exists for respiration on an electrode or on another extracellular solid acceptor.
      OmcZ's roles in electron uptake from Fe(0) (PMID:31088920) and in direct
      interspecies electron transfer (PMID:37881251) are strain-background dependent and
      have no fitting GO term, so they are recorded in the notes and the core-function
      description rather than as rows.
    supported_by:
    - reference_id: PMID:19461962
      supporting_text: only deletion of pilA or omcZ severely inhibited current production
        and biofilm formation in current-harvesting mode
    - reference_id: PMID:19461962
      supporting_text: When these mutations were complemented by expressing pilA or omcZ on
        a plasmid, wild type levels of current production were restored (Table 4).
    - reference_id: PMID:19461962
      supporting_text: Deletion of omcZ had no impact on growth with any of these electron
        acceptors (data not shown).
    - reference_id: PMID:33837010
      supporting_text: the ozpA mutant accumulated OmcZL and did not produce OmcZS, which
        is thought to be a mature form that is essential for the extracellular electron transfer
        to the electrode
- term:
    id: GO:0051258
    label: protein polymerization
  evidence_type: IDA
  original_reference_id: PMID:36732469
  qualifier: involved_in
  review:
    summary: >-
      Once OzpA removes the C-terminal region, OmcZ30 self-assembles in vitro into helical
      filaments that are indistinguishable from native filaments. The native filament is
      a homopolymer of OmcZ30 held together by heme and aromatic stacking and hydrophobic
      contacts at the interface between subunits.
    action: NEW
    reason: >-
      The protein assembles its own filament: polymerization is driven by interfaces on
      OmcZ itself, with no inter-subunit metal coordination and no other protein in the
      polymer. So the gene product does the work of the process, not just undergoes it.
      In vitro reconstitution from purified OzpA and OmcZ50 (native and recombinant)
      shows it directly (PMID:36732469). The protease is the switch, not a participant in
      the polymer: uncleaved OmcZ50 does not polymerize. The row is kept at the generic
      process level. GO has no term for assembly of an extracellular cytochrome filament,
      and the corresponding component term is proposed below.
    supported_by:
    - reference_id: PMID:36732469
      supporting_text: We found that purified OzpA cleaves both native and recombinant OmcZ50
        into OmcZ30 which then self-assembled into nanowires
    - reference_id: PMID:36732469
      supporting_text: Notably, reconstituted OmcZ nanowires after proteolytic cleavage had
        structures that were indistinguishable from native nanowires
references:
- id: PMID:19461962
  title: Anode biofilm transcriptomics reveals outer surface components essential for high
    density current production in Geobacter sulfurreducens fuel cells.
  findings:
  - statement: >-
      omcZ is among the most up-regulated genes in current-harvesting biofilms, and of the
      outer-surface genes tested only pilA and omcZ deletions severely inhibit current
      production and current-harvesting biofilm formation.
    supporting_text: only deletion of pilA or omcZ severely inhibited current production
      and biofilm formation in current-harvesting mode
    reference_section_type: ABSTRACT
  - statement: >-
      The omcZ deletion has no effect on biofilm formation when fumarate is the electron
      acceptor.
    supporting_text: In contrast, these gene deletions had no impact on biofilm formation
      on graphite surfaces when fumarate served as the electron acceptor.
    reference_section_type: ABSTRACT
  - statement: Plasmid-borne omcZ restores wild-type current to the deletion mutant.
    supporting_text: When these mutations were complemented by expressing pilA or omcZ on
      a plasmid, wild type levels of current production were restored (Table 4).
    reference_section_type: RESULTS
  - statement: >-
      Deleting omcZ does not affect growth with fumarate, Fe(III) citrate or Fe(III)
      oxide as electron acceptor.
    supporting_text: Deletion of omcZ had no impact on growth with any of these electron
      acceptors (data not shown).
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text cached (PMC2680965). This is the founding genetic study of OmcZ,
      including complementation. The growth result on other acceptors is stated as data
      not shown.
- id: PMID:20400562
  title: Purification and characterization of OmcZ, an outer-surface, octaheme c-type
    cytochrome essential for optimal current production by Geobacter sulfurreducens.
  findings:
  - statement: >-
      The 30 kDa OmcZS is a cleavage product of the 50 kDa OmcZL that retains all eight
      hemes, one of them on a CX14CH motif.
    supporting_text: OmcZ(S) is a cleaved product of OmcZ(L) retaining all 8 hemes, including
      1 heme with the unusual c-type heme-binding motif CX(14)CH
    reference_section_type: ABSTRACT
  - statement: OmcZS hemes span -420 to -60 mV, with a midpoint near -220 mV versus SHE.
    supporting_text: the midpoint reduction potential of OmcZ(S) is approximately -220 mV
      (versus the standard hydrogen electrode [SHE]) with nonequivalent heme groups that
      cover a large reduction potential range (-420 to -60 mV)
    reference_section_type: ABSTRACT
  - statement: >-
      Purified OmcZS transfers electrons to soluble metals, Mn(IV) oxide and AQDS in vitro,
      but not to Fe(III) oxide.
    supporting_text: OmcZ(S) transferred electrons in vitro to a diversity of potential
      extracellular electron acceptors, such as Fe(III) citrate, U(VI), Cr(VI), Au(III),
      Mn(IV) oxide, and the humic substance analogue anthraquinone-2,6-disulfonate, but
      not Fe(III) oxide.
    reference_section_type: ABSTRACT
  - statement: OmcZS is the predominant extracellular form.
    supporting_text: Subcellular-localization studies suggested that OmcZ(S) was the predominant
      extracellular form of OmcZ.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Abstract-only in the cache (PMC2893489 exists but was not retrieved). The abstract
      states heme count, redox potentials, acceptor range and localization directly.
- id: PMID:23761253
  title: Specific localization of the c-type cytochrome OmcZ at the anode surface in current-producing
    biofilms of Geobacter sulfurreducens.
  findings:
  - statement: >-
      Immunogold labelling places OmcZ in the extracellular matrix of fumarate-grown cell
      aggregates.
    supporting_text: OmcZ was dispersed throughout the extracellular matrix surrounding the
      cells that accumulated at the bottom of the culture tubes of cells grown under standard
      conditions with fumarate as the electron acceptor.
    reference_section_type: ABSTRACT
  - statement: >-
      In anode-grown biofilms, OmcZ is concentrated at the biofilm-electrode interface;
      fumarate-grown biofilms on the same graphite do not show this accumulation.
    supporting_text: When G. sulfurreducens grew as a biofilm on a graphite electrode that
      served as an anode and the sole electron acceptor for growth, OmcZ was highly concentrated
      at the biofilm-electrode interface.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Abstract-only in the cache; the abstract states the localization results directly.
      The "electrochemical gate" interpretation is the authors' proposal.
- id: PMID:21169487
  title: Identification of an extracellular polysaccharide network essential for cytochrome
    anchoring and biofilm formation in Geobacter sulfurreducens.
  findings:
  - statement: >-
      Extracellular c-type cytochromes, including OmcZ, are held in a polysaccharide-bound
      matrix that is largely lost from the xap (GSU1501) mutant.
    supporting_text: The matrix from the mutant contained 60% less sugar and was nearly
      devoid of c-type cytochromes such as OmcZ.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Abstract-only in the cache. Independent (Bond lab) support for matrix localization
      of OmcZ; the gene studied is the xap exporter, not omcZ.
- id: PMID:33837010
  title: Proteolytic Maturation of the Outer Membrane c-Type Cytochrome OmcZ by a Subtilisin-Like
    Serine Protease Is Essential for Optimal Current Production by Geobacter sulfurreducens.
  findings:
  - statement: >-
      OzpA (GSU2075) is required to convert OmcZL to OmcZS, and an ozpA mutant produces as
      little current as an omcZ mutant.
    supporting_text: the ozpA mutant accumulated OmcZL and did not produce OmcZS, which is
      thought to be a mature form that is essential for the extracellular electron transfer
      to the electrode
    reference_section_type: ABSTRACT
  - statement: OzpA expressed in E. coli cleaves OmcZL to OmcZS.
    supporting_text: A heterologous expression system cell lysate from an Escherichia coli
      strain producing OzpA cleaved OmcZL and generated OmcZS as the proteolytic product.
    reference_section_type: ABSTRACT
  - statement: OmcZL cleavage activity is found only in the culture supernatant fraction.
    supporting_text: only the culture supernatant protein fraction showed OmcZL cleavage
      activity, indicating that the mature form of OmcZ, OmcZS, can be produced outside
      the cells
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only in the cache; the abstract states each finding directly.
- id: PMID:36732469
  title: Structure of Geobacter cytochrome OmcZ identifies mechanism of nanowire assembly
    and conductivity.
  findings:
  - statement: >-
      A 3.5 Å cryo-EM structure of native OmcZ filaments, purified from an omcS-disrupted
      strain, resolves all eight hemes per subunit.
    supporting_text: At this resolution, the backbone density along with many bulky sidechain
      densities, such as aromatic residues and all eight haem densities, are visible
    reference_section_type: RESULTS
  - statement: Seven hemes form a linear chain and heme VI is surface exposed.
    supporting_text: In OmcZ, haems I–V and VII form a linear, central, electron transport
      chain whereas haem VI is surface exposed
    reference_section_type: RESULTS
  - statement: >-
      Deleting the heme II CX14CH loop slows electron transfer from reconstituted OmcZ
      filaments to extracellular acceptors.
    supporting_text: Using reconstituted OmcZ, we find that deletion of the haem II loop
      reduces the rate of electron transfer by OmcZ nanowires to extracellular electron acceptors
      compared with the WT
    reference_section_type: RESULTS
  - statement: >-
      Purified OzpA cleaves OmcZ50 into OmcZ30, which self-assembles into filaments
      indistinguishable from native ones.
    supporting_text: We found that purified OzpA cleaves both native and recombinant OmcZ50
      into OmcZ30 which then self-assembled into nanowires
    reference_section_type: RESULTS
  - statement: OmcZ is not essential for Fe(III) oxide reduction by cells.
    supporting_text: Despite higher conductivity and solvent exposure of haems, OmcZ is not
      essential for bacterial reduction of Fe(III) oxide, an extracellular electron acceptor
      abundant in soil
    reference_section_type: RESULTS
  - statement: Purified OmcZ filaments do not reduce riboflavin.
    supporting_text: We found that purified OmcZ nanowires do not reduce riboflavin
    reference_section_type: RESULTS
  - statement: >-
      omcZ is co-transcribed with ozpA in an operon that also includes a peptidyl-prolyl
      cis-trans isomerase gene (GSU2074).
    supporting_text: we confirmed co-transcription of omcZ and ozpA in G. sulfurreducens
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text cached. Residue numbers in this paper are on the mature protein (UniProt
      position minus 24): its CX14CH cysteines 53 and 68 are C77 and C92 of Q74BG5, and
      the OzpA-proximal Asn 258 is N282. The structure was solved at pH 10.5; the authors
      report similar CD spectra at pH 7. An author correction exists (PMID:38684912) and
      was not reviewed here.
- id: PMID:36062910
  title: Structure of Geobacter OmcZ filaments suggests extracellular cytochrome polymers
    evolved independently multiple times.
  findings:
  - statement: >-
      An independent cryo-EM structure of OmcZ filaments shows a branched heme arrangement
      with one highly exposed heme per subunit and a heme packing different from OmcS and
      OmcE.
    supporting_text: A branched heme arrangement within OmcZ leads to a highly surface exposed
      heme in every subunit, which may account for the formation of conductive biofilm networks,
      and explain the higher measured conductivity of OmcZ filaments.
    reference_section_type: ABSTRACT
  - statement: Cytochrome filaments appear to have evolved more than once.
    supporting_text: This new structural evidence suggests that conductive cytochrome polymers
      arose independently on more than one occasion from different ancestral multiheme proteins.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text cached (PMC9473688). An independent laboratory (Bond/Egelman) confirms the
      Gu et al. structure; source of PDB 8D9M.
- id: PMID:32807967
  title: Electric field stimulates production of highly conductive microbial OmcZ nanowires.
  findings:
  - statement: >-
      An applied electric field stimulates OmcZ filament production in G. sulfurreducens
      biofilms; the filaments were reported to be about 30 S/cm conductive and stiffer
      than OmcS filaments.
    supporting_text: stimulates production of cytochrome OmcZ nanowires with 1,000-fold higher
      conductivity (30 S cm-1) and threefold higher stiffness (1.5 GPa) than the cytochrome
      OmcS nanowires
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: DISPUTED
    review_notes: >-
      Full text cached. The regulatory observation (more OmcZ filaments under applied
      field or on electrodes) is consistent with other work. The absolute conductivity and
      its interpretation are contested by structure-based calculations (PMID:37552847,
      PMID:38633696). Not used as primary support for any row.
- id: PMID:34471289
  title: Structure of Geobacter pili reveals secretory rather than nanowire behaviour.
  findings:
  - statement: >-
      OmcZ reaches the extracellular fraction of wild-type cells but stays in the
      periplasm without PilA-N, and in trans PilA-N/PilA-C restores secretion.
    supporting_text: Our subcellular localization experiments revealed that both OmcS and
      OmcZ are present in the extracellular fraction of wild-type cells but remain in the
      periplasm for ΔpilA-N cells
    reference_section_type: RESULTS
  - statement: The PilA-N–C filament is needed to export OmcZ.
    supporting_text: Our studies thus show that the unique PilA-N–C filaments are essential
      for the translocation of OmcZ nanowires
    reference_section_type: RESULTS
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Full text cached. Matters for interpreting pilA phenotypes: loss of pili blocks OmcZ
      export, so a pilA mutant also lacks extracellular OmcZ.
- id: PMID:37881251
  title: The varied roles of pilA-N, omcE, omcS, omcT, and omcZ in extracellular electron
    transfer by Geobacter sulfurreducens.
  findings:
  - statement: >-
      ΔomcZ was impaired in ferrihydrite reduction, anode reduction and co-culture with G.
      metallireducens.
    supporting_text: Deletion of omcT, omcZ or pilA-N alone impaired bacterial ability to
      reduce ferrihydrite and anodes and to form the co-culture.
    reference_section_type: ABSTRACT
  - statement: >-
      In a hybL (uptake hydrogenase) mutant background, omcZ deletion alone abolished
      growth in co-culture with G. metallireducens.
    supporting_text: However, deletion of only omcZ or pilA-N or both omcS and omcT abolished
      the ability of G. sulfurreducens without hydrogenase gene hybL to co-culture with G.
      metallireducens
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: DISPUTED
    review_notes: >-
      Full text cached. The ferrihydrite phenotype conflicts with Nevin et al. 2009
      (PMID:19461962; no effect of omcZ deletion on Fe(III) oxide growth) and with Gu et
      al. 2023 (PMID:36732469; OmcZ not essential for Fe(III) oxide reduction). The anode
      and DIET phenotypes are not in conflict with other work.
- id: PMID:31088920
  title: Iron Corrosion via Direct Metal-Microbe Electron Transfer.
  findings:
  - statement: >-
      In strain ACLHF, which cannot use H2, omcZ deletion prevents growth on Fe(0), and
      complementation restores it.
    supporting_text: Deletion of the gene for omcZ prevented growth on Fe(0)
    reference_section_type: RESULTS
  - statement: The authors interpret this as OmcZ taking part in electron uptake from Fe(0).
    supporting_text: These results suggest that OmcZ is also involved in electron transfer
      from Fe(0) into the cell.
    reference_section_type: RESULTS
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Full text cached. The phenotype is specific to the ACLHF background; the authors note
      that in wild-type cells omcZ deletion did not inhibit electron uptake. Recorded as a
      context-dependent role; not annotated, since GO has no term for electron uptake from
      an extracellular donor.
- id: PMID:35164556
  title: Dissecting the Structural and Conductive Functions of Nanowires in Geobacter sulfurreducens
    Electroactive Biofilms.
  findings:
  - statement: >-
      Of the three filament types in G. sulfurreducens, OmcZ contributes to current both
