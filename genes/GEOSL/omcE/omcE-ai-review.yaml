    correctness: VERIFIED
    review_notes: >-
      Full text cached. The systematic side-by-side comparison of all five genes, and the
      independent confirmation that OmcE's role is specific to insoluble iron. Its omcZ
      ferrihydrite result conflicts with other work, as recorded in the OmcZ review, but the
      omcE result agrees with the founding study.
- id: PMID:39278116
  title: 'Specific interaction of resorufin to outer-membrane cytochrome OmcE of Geobacter
    sulfurreducens: A new insight on artificial electron mediators in promoting extracellular
    electron transfer.'
  findings:
  - statement: >-
      The biofilm redox shift of resorufin is lost in an omcE mutant but not in omcS or omcZ
      mutants, indicating a specific interaction with OmcE.
    supporting_text: this shift was attenuated by the mutation of outer-membrane cytochrome
      gene omcE but not by omcS and omcZ mutation, indicating that RR specifically interacted
      with OmcE
    reference_section_type: ABSTRACT
  - statement: Heterologously expressed OmcE binds resorufin with a dissociation constant of 720 nM.
    supporting_text: By using heterologously expressed OmcE monomers in Escherichia coli,
      it was found that RR bonded with OmcE monomers with a moderate intensity (dissociation
      constant of 720 nM)
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Abstract-only in the cache. The only study to work with isolated OmcE protein. It
      establishes binding of an artificial mediator at a heme, not physiological electron
      transfer, so it supports the inferred molecular function without converting it to a
      direct demonstration.
core_functions:
- description: >-
    Surface-exposed tetraheme carrier for respiration on insoluble iron oxide. OmcE is
    secreted, sits on the outer cell surface and can polymerize into a thin extracellular
    filament in which the hemes stack along the fibre and consecutive subunits are joined by
    heme-histidine ligation across the interface. Electrons passed outward from the envelope
    reach an Fe(III) oxide particle through it, which is why losing omcE removes the ability
    to reduce insoluble Fe(III) while leaving soluble acceptors, anode respiration and
    interspecies transfer intact. The narrowness of that phenotype is the distinguishing
    feature: among the three polymerizing cytochromes of this organism, OmcE is the one
    whose established role is confined to insoluble iron.
  molecular_function:
    id: GO:0009055
    label: electron transfer activity
  directly_involved_in:
  - id: GO:0019645
    label: anaerobic electron transport chain
  locations:
  - id: GO:0009986
    label: cell surface
  supported_by:
  - reference_id: PMID:16332857
    supporting_text: When either omcS or omcE was deleted, G. sulfurreducens could no longer
      reduce Fe(III) oxide but could still reduce soluble electron acceptors, including Fe(III)
      citrate.
  - reference_id: PMID:35798889
    supporting_text: Although OmcE and OmcS subunits have no overall sequence or structural
      similarities, upon polymerization both form filaments that share a conserved haem packing
      arrangement in which haems are coordinated by histidines in adjacent subunits.
  - reference_id: PMID:37881251
    supporting_text: Deletion of omcE also impaired bacterial ability to reduce ferrihydrite,
      but its impacts on the ability for anode reduction and the co-culture of G. metallireducens-G.
      sulfurreducens were minimal.
  knowledge_gaps:
  - gap_statement: >-
      Whether OmcE filaments are a normal part of wild-type physiology, or a compensatory
      response to loss of OmcS, is undetermined. The only filaments characterised structurally
      were enriched from omcS-mutant strains.
    boundary: >-
      It is established that OmcE polymerizes into a filament in cells, that the filament has
      a stacked heme chain with cross-subunit histidine ligation, and that omcE is required
      for Fe(III) oxide reduction. What is not established is the abundance or the
      contribution of the filament form in an unperturbed cell, nor whether the Fe(III) oxide
      phenotype is a property of monomeric surface OmcE, of the filament, or of both.
    gap_kind:
    - BIOLOGY
    dark_aspect: MF_DARK
  - gap_statement: >-
      No electron transfer by OmcE has been measured directly. Neither the purified protein's
      reduction of an acceptor nor the filament's conductivity has been assayed.
    boundary: >-
      The heme count, their bis-histidine coordination and their spacing are known from the
      structure, and resorufin binding to isolated OmcE has been measured. What is missing is
      any rate or current attributable to OmcE itself.
    gap_kind:
    - BIOLOGY
    dark_aspect: MF_DARK
suggested_questions:
- question: >-
    Does a wild-type cell make OmcE filaments at all, or only monomeric surface OmcE? The
    structure came from omcS-mutant strains in which the filaments were enriched, and the
    authors read that as compensation.
- question: >-
    Is the Fe(III) oxide phenotype a property of the filament or of monomeric OmcE? A
    polymerization-deficient but folded OmcE would separate the two.
- question: >-
    Why does this organism maintain three unrelated polymerizing cytochromes whose
    deletion phenotypes barely overlap, with OmcE confined to insoluble iron, OmcS covering
    iron and interspecies transfer, and OmcZ owning the electrode?
- question: >-
    Is PANTHER's placement of OmcE in PTHR35038:SF6 defensible? The family is named for a
    dissimilatory sulfite reductase and the subfamily for a decaheme lipoprotein, while OmcE
    is a tetraheme cytochrome with no lipid anchor, and the same subfamily also holds MtrA
    and a hydroxylamine oxidoreductase.
- question: >-
    Are the surface densities on the OmcE filament really glycans, and if so are they
    O-linked? The protein contains no N-X-S/T sequon, so a canonical N-linked modification
    is not available to it.
suggested_experiments:
- hypothesis: >-
    OmcE itself transfers electrons to insoluble Fe(III) oxide, rather than only holding a
    mediator or a partner in place.
  experiment_type: electron transfer assay on purified protein
  description: >-
    Purify OmcE, reduce it with dithionite and follow its reoxidation by Fe(III) oxide,
    Mn(IV) oxide, chelated Fe(III) and AQDS by stopped flow, exactly as was done for OmcS.
    That comparison would convert the molecular-function row here from an inference to a
    measurement and would place OmcE on the same scale as the other two cytochromes.
- hypothesis: >-
    OmcE filaments are a compensatory response to loss of OmcS rather than a constitutive
    feature of wild-type cells.
  experiment_type: quantitative imaging and proteomics across strains
  description: >-
    Compare wild type with the omcS mutants side by side, measuring the abundance of
    filamentous versus monomeric OmcE in sheared surface fractions by quantitative mass
    spectrometry and counting filament species by cryo-EM with DNase treatment throughout.
    If wild-type cells carry few OmcE filaments, the structure describes a stress state and
    the physiological unit is monomeric surface OmcE.
- hypothesis: >-
    Polymerization is required for OmcE to support Fe(III) oxide reduction.
  experiment_type: structure-guided separation-of-function mutagenesis
  description: >-
    Mutate the cross-subunit histidine that ligates the interfacial heme, together with
    other interface residues identified in 7TFS, to produce a folded, heme-loaded OmcE that
    cannot polymerize. Test Fe(III) oxide reduction in that strain. A mutant that keeps its
    hemes but loses the filament and also loses the phenotype would show the polymer is the
    functional unit.
- hypothesis: >-
    The extra densities on the filament surface are O-linked glycans installed by the gene
    cluster downstream of omcE.
  experiment_type: glycoproteomics with targeted deletions
  description: >-
    Determine the modification by mass spectrometry of OmcE purified from wild type and from
    deletions of the glycosyltransferases in the downstream 17-gene cluster, looking
    specifically at S83, N86, N87, N132 and T184. The absence of any N-X-S/T sequon makes
    this worth settling rather than assuming.
