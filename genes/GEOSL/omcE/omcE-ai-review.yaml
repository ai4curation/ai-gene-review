gene_symbol: omcE
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:243231
  label: Geobacter sulfurreducens PCA
description: >-
  OmcE (locus GSU0618) is a tetraheme c-type cytochrome of Geobacter sulfurreducens that
  sits on the outer cell surface and can polymerize into extracellular filaments. The
  232-residue precursor carries a cleavable signal peptide and no transmembrane segment or
  lipid anchor; four CXXCH motifs bind its hemes, the last two forming the paired motif
  recognised as Pfam PF09699. The protein was first recovered, at around 30 kDa, among the
  cytochromes most readily sheared from the outer surface of intact cells. Cryo-electron
  microscopy of filaments later showed OmcE forming an appendage about 40 angstroms across,
  thinner than the OmcS filament, in which hemes stack along the fibre axis and one heme per
  subunit is coordinated by a histidine donated from the neighbouring subunit. That
  arrangement is shared with OmcS even though the two proteins have no detectable sequence
  or backbone similarity, which led to the proposal that conductive bacterial appendages
  form a class defined by heme packing rather than by homology. The filament surface carries
  extra densities, hypothesised but not shown to be glycans. Loss of omcE abolishes
  reduction of insoluble Fe(III) oxide while leaving soluble acceptors, anode respiration
  and interspecies electron transfer essentially unaffected, which sets OmcE apart from
  OmcS and from the electrode-specific OmcZ. OmcE is also the specific target of the
  artificial electron mediator resorufin, which binds the isolated protein with
  submicromolar affinity.
existing_annotations:
- term:
    id: GO:0020037
    label: heme binding
  evidence_type: IDA
  original_reference_id: PMID:35798889
  qualifier: enables
  review:
    summary: >-
      OmcE carries four covalently attached c-type hemes. The cryo-EM structure of the
      filament resolves them, with each heme iron bis-coordinated by histidines, and the
      sequence carries exactly four CXXCH motifs.
    action: NEW
    reason: >-
      GOA holds nothing at all for this protein, and heme binding is the best evidenced
      thing about it. The hemes are resolved in PDB 7TFS and UniProt records the
      corresponding binding sites from that structure; the authors note that of the
      candidate cytochromes considered, only OmcE has the eight histidines needed to
      bis-coordinate four hemes, which is what identified the filament as OmcE in the first
      place. The count is independently consistent with the four CXXCH motifs in the
      sequence and with the tetraheme prediction made when the protein was first described.
    supported_by:
    - reference_id: PMID:35798889
      supporting_text: Of these four cytochromes, only OmcE has eight histidine residues near
        the Fe densities to assemble bis-coordinated hemes
    - reference_id: PMID:16332857
      supporting_text: The other abundant c-type cytochrome sheared from the outer surface
        of G. sulfurreducens, designated OmcE, has a molecular mass of ca. 30 kDa and is predicted
        to be an outer membrane tetraheme c-type cytochrome.
- term:
    id: GO:0009055
    label: electron transfer activity
  evidence_type: IC
  original_reference_id: PMID:35798889
  qualifier: enables
  review:
    summary: >-
      Inferred by the reviewer rather than measured. Three lines converge: the structure
      shows four hemes stacked along the filament with bis-histidine coordination and
      cross-subunit heme ligation, the aligned inter-heme distances match those of the OmcS
      filament, and losing omcE costs the cell its ability to reduce insoluble Fe(III)
      oxide. The artificial mediator resorufin binds the purified protein at a heme.
    action: NEW
    reason: >-
      Recorded as IC, not IDA, and the distinction is the point. Unlike OmcS and OmcZ, OmcE
      has never been purified and shown to reduce an acceptor, and the 2022 structure paper
      did not measure the filament's conductivity either; it inferred similar electron
      transport from matching heme geometry and warned in the same breath that conductivity
      attributed to a particular protein needs treating with caution. What is directly shown
      is a stacked, bis-histidine-coordinated heme chain, which is the structural signature
      of an electron conduit, together with a genetic phenotype that only makes sense if
      electrons reach an extracellular acceptor through this protein. That is a sound
      inference and a weak measurement, so the evidence code says so. An experiment to close
      the gap is suggested below.
    supported_by:
    - reference_id: PMID:35798889
      supporting_text: Although OmcE and OmcS subunits have no overall sequence or structural
        similarities, upon polymerization both form filaments that share a conserved haem
        packing arrangement in which haems are coordinated by histidines in adjacent subunits.
    - reference_id: PMID:16332857
      supporting_text: When either omcS or omcE was deleted, G. sulfurreducens could no longer
        reduce Fe(III) oxide but could still reduce soluble electron acceptors, including
        Fe(III) citrate.
    - reference_id: PMID:39278116
      supporting_text: By using heterologously expressed OmcE monomers in Escherichia coli,
        it was found that RR bonded with OmcE monomers with a moderate intensity (dissociation
        constant of 720 nM)
- term:
    id: GO:0019645
    label: anaerobic electron transport chain
  evidence_type: IMP
  original_reference_id: PMID:16332857
  qualifier: involved_in
  review:
    summary: >-
      Deleting omcE leaves the cell unable to reduce insoluble Fe(III) oxide while growth on
      soluble acceptors including Fe(III) citrate is unaffected, and expressing omcE in trans
      restores the capacity.
    action: NEW
    reason: >-
      The gene product does part of the work rather than merely being required for it: it is
      itself a heme-bearing carrier on the outer surface, so the perturbation result is read
      together with the structure rather than on its own. The specificity of the phenotype is
      what places OmcE in the extracellular branch of the chain rather than upstream, and
      complementation rules out a polar effect. The same term is used across the other
      Geobacter and Shewanella envelope and surface cytochromes reviewed here (ImcH, CbcL,
      OmcS, OmcZ, OmcA), and GO has nothing narrower for respiration on an extracellular
      solid acceptor. Note the contrast with OmcS and OmcZ: the omcE phenotype does not
      extend to anodes or to interspecies transfer.
    supported_by:
    - reference_id: PMID:16332857
      supporting_text: When either omcS or omcE was deleted, G. sulfurreducens could no longer
        reduce Fe(III) oxide but could still reduce soluble electron acceptors, including
        Fe(III) citrate.
    - reference_id: PMID:16332857
      supporting_text: Expressing omcS or omcE in trans restored the capacity for Fe(III) oxide
        reduction.
    - reference_id: PMID:37881251
      supporting_text: Deletion of omcE also impaired bacterial ability to reduce ferrihydrite,
        but its impacts on the ability for anode reduction and the co-culture of G. metallireducens-G.
        sulfurreducens were minimal.
- term:
    id: GO:0051258
    label: protein polymerization
  evidence_type: IDA
  original_reference_id: PMID:35798889
  qualifier: involved_in
  review:
    summary: >-
      OmcE subunits polymerize into an extracellular filament about 40 angstroms across,
      resolved by cryo-EM at 4.3 angstroms. The subunit interface is made by OmcE itself,
      including a heme coordinated by a histidine from the adjacent subunit.
    action: NEW
    reason: >-
      The protein makes its own polymer: the filament contains no other subunit, and the
      contact that holds consecutive subunits together is a heme-histidine ligation across
      the interface, which the authors describe as unique among c-type cytochrome structures.
      One caveat belongs in the record rather than in a footnote. The filaments were enriched
      from strains carrying omcS mutations, and the authors read that as the cell
      compensating for loss of OmcS function, so what is established is that OmcE can
      polymerize and does so in cells, not how much filament a wild-type cell makes. The
      annotation is for the capability, which is directly observed; the abundance question
      is recorded as a knowledge gap and an experiment.
    supported_by:
    - reference_id: PMID:35798889
      supporting_text: Here we report that G. sulfurreducens also produces a second, thinner
        appendage comprised of cytochrome OmcE subunits and solve its structure using cryo-electron
        microscopy at ~4.3 Å resolution.
    - reference_id: PMID:35798889
      supporting_text: To the best of our knowledge, the coordination of a heme in one subunit
        by a histidine in an adjacent subunit in both the OmcE and OmcS filaments seems to
        be unique among all c-type cytochrome structures solved to date.
    - reference_id: PMID:35798889
      supporting_text: a serendipitous outcome was that these omcS mutations resulted in an
        enrichment of extracellular OmcE filaments
- term:
    id: GO:0009986
    label: cell surface
  evidence_type: IDA
  original_reference_id: PMID:16332857
  qualifier: located_in
  review:
    summary: >-
      OmcE was among the most abundant proteins sheared from the outer surfaces of intact
      cells, and the filaments it forms are extracellular.
    action: NEW
    reason: >-
      Shearing intact cells recovers what is accessible on the outside without breaking the
      envelope, and the later structural work took OmcE from extracellular preparations, so
      two methods agree. GO:0009986 covers products attached integrally or loosely to the
      envelope, which is what this is. The outer membrane term GO:0009279 was deliberately
      not proposed: the entry records no transmembrane segment and no lipid anchor, and in
      the OmcS review the equivalent rows were judged over-annotated for the same reasons.
      GO:0005576 extracellular region was also declined, since its GO comment reserves it
      for products not attached to the cell surface.
