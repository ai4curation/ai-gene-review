references:
- id: PMID:16332857
  title: Outer membrane c-type cytochromes required for Fe(III) and Mn(IV) oxide reduction
    in Geobacter sulfurreducens.
  findings:
  - statement: >-
      OmcE was recovered by shearing intact cells, runs at about 30 kDa, and was predicted
      to be a tetraheme outer-membrane cytochrome.
    supporting_text: The other abundant c-type cytochrome sheared from the outer surface of
      G. sulfurreducens, designated OmcE, has a molecular mass of ca. 30 kDa and is predicted
      to be an outer membrane tetraheme c-type cytochrome.
    reference_section_type: ABSTRACT
  - statement: >-
      Deleting omcE abolishes Fe(III) oxide reduction while leaving soluble acceptors
      unaffected.
    supporting_text: When either omcS or omcE was deleted, G. sulfurreducens could no longer
      reduce Fe(III) oxide but could still reduce soluble electron acceptors, including Fe(III)
      citrate.
    reference_section_type: ABSTRACT
  - statement: Expression in trans restores Fe(III) oxide reduction.
    supporting_text: Expressing omcS or omcE in trans restored the capacity for Fe(III) oxide
      reduction.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Abstract-only in the cache. The founding genetic study for both omcS and omcE. As in
      the OmcS review, note that the outer-membrane assignment here is explicitly a
      prediction, which is why no outer-membrane term is proposed.
- id: PMID:35798889
  title: Cryo-EM structure of an extracellular Geobacter OmcE cytochrome filament reveals
    tetrahaem packing.
  findings:
  - statement: >-
      OmcE forms a second, thinner extracellular filament, solved at about 4.3 angstroms.
    supporting_text: Here we report that G. sulfurreducens also produces a second, thinner
      appendage comprised of cytochrome OmcE subunits and solve its structure using cryo-electron
      microscopy at ~4.3 Å resolution.
    reference_section_type: ABSTRACT
  - statement: >-
      OmcE and OmcS share a heme packing arrangement, including cross-subunit histidine
      coordination, despite having no sequence or backbone similarity.
    supporting_text: Although OmcE and OmcS subunits have no overall sequence or structural
      similarities, upon polymerization both form filaments that share a conserved haem packing
      arrangement in which haems are coordinated by histidines in adjacent subunits.
    reference_section_type: ABSTRACT
  - statement: >-
      The authors propose a class of conductive appendages defined by heme packing rather
      than homology.
    supporting_text: We propose that there is a broad class of conductive bacterial appendages
      with conserved haem packing (rather than sequence homology) that enable long-distance
      electron transport to chemicals or other microbial cells.
    reference_section_type: ABSTRACT
  - statement: >-
      The filaments studied came from omcS-mutant strains, in which OmcE filaments were
      enriched, and the authors interpret this as compensation.
    supporting_text: a serendipitous outcome was that these omcS mutations resulted in an
      enrichment of extracellular OmcE filaments
    reference_section_type: INTRODUCTION
  - statement: Cross-subunit heme-histidine ligation appears unique among solved c-type cytochrome structures.
    supporting_text: To the best of our knowledge, the coordination of a heme in one subunit
      by a histidine in an adjacent subunit in both the OmcE and OmcS filaments seems to be
      unique among all c-type cytochrome structures solved to date.
    reference_section_type: RESULTS
  - statement: >-
      Only OmcE among the candidate cytochromes has the histidine complement needed to
      bis-coordinate the observed hemes.
    supporting_text: Of these four cytochromes, only OmcE has eight histidine residues near
      the Fe densities to assemble bis-coordinated hemes
    reference_section_type: RESULTS
  - statement: The surface densities are hypothesised, not demonstrated, to be glycans.
    supporting_text: which we hypothesize are glycosylations
    reference_section_type: RESULTS
  - statement: >-
      The authors caution that conductivity attributed to a single protein is confounded by
      multiple filament species and extracellular DNA.
    supporting_text: means that measures of conductivity attributed to a specific protein
      need to be treated with some caution
    reference_section_type: DISCUSSION
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text cached (PMC9357133). Source of PDB 7TFS. Two things are easy to over-read
      from the abstract alone and are corrected from the full text here: the filaments came
      from omcS-mutant strains rather than wild type, and the glycosylation is a hypothesis
      about unidentified densities, not a determination. No conductivity was measured on
      OmcE filaments.
- id: PMID:19461962
  title: Anode biofilm transcriptomics reveals outer surface components essential for high
