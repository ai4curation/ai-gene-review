core_functions:
- description: >-
    Extracellular, filament-based electron conduit for respiration on insoluble acceptors.
    OmcS is exported through the PilA-N/PilA-C filament and polymerises at the cell surface
    into micrometre-long helical filaments in which its six hemes stack end to end and
    across the subunit interface. Electrons arriving from the outer-membrane cytochromes
    travel along that heme chain to an acceptor the cell cannot internalise, which is why
    deleting omcS abolishes Fe(III) oxide reduction while leaving fumarate and soluble
    Fe(III) citrate respiration intact and why the paralogue OmcT cannot take over. The
    same conduit carries electrons to Mn(IV) oxide and humic substances, and to a
    Geobacter metallireducens partner cell during direct interspecies electron transfer.
