proposed_new_terms:
- proposed_name: extracellular cytochrome filament
  proposed_definition: >-
    A helical, non-membrane-bounded protein polymer that lies outside the cell and is
    built from repeating subunits of a secreted multiheme c-type cytochrome. The hemes
    stack along the filament axis, so electrons can be transferred along its length
    between the cell and extracellular electron acceptors or donors.
  proposed_parent:
    id: GO:0099080
    label: supramolecular complex
  justification: >-
    This is the same term proposed in the review of Geobacter sulfurreducens OmcZ, repeated
    here deliberately rather than cross-referenced, because two independently characterised
    genes needing the same missing term is the argument for creating it. OmcS is the
    better-established case of the two: its filament has two deposited structures (PDB 6EF8,
    6NEF), and dedicated classifications already exist for it elsewhere, as CDD cd21555
    "OmcS-like" and TCDB family 5.B.3.1.1, "the geobacter nanowire electron transfer (g-net)
    family". GO has no component term for such a filament. The terms available describe
    either the surface the filament is attached to (GO:0009986 cell surface) or the
    unrelated pilus (GO:0009289), which would wrongly imply a pilin appendage, and the
    historical confusion of these filaments with type IV pili is precisely what the 2019
    structure corrected. Members differ in heme packing and arose more than once, so the
    class should be defined by structure and location rather than by homology. The
    narrative case for the term, the naming question (the field says "extracellular
    cytochrome nanowire"), and the three further process-term gaps are collected in
    projects/EXTRACELLULAR_CYTOCHROME_NANOWIRES.md.
  supported_by:
  - reference_id: PMID:30951668
    supporting_text: G. sulfurreducens nanowires are assembled by micrometer-long polymerization
      of the hexaheme cytochrome OmcS
  - reference_id: PMID:30951668
    supporting_text: the conductive extracellular appendages of wild-type G. sulfurreducens
      strain are primarily OmcS filaments
suggested_questions:
- question: >-
    How should GO represent direct interspecies electron transfer? OmcS is described as
    essential for DIET and is induced several hundred-fold in cocultures, but there is no
    GO term for the process, and the usual single-organism framing of a biological process
    does not fit a two-cell electrical connection.
- question: >-
    Where does an OmcS filament get its electrons? The filament is released at the cell
    surface with no known anchor to a specific outer-membrane conduit, so the handover from
    the porin-cytochrome complexes is unresolved.
- question: >-
    Is PANTHER's placement of OmcS in PTHR30333:SF1, the NapC subfamily, defensible? OmcS
    lacks the NapC/NirT N-terminal domain that defines that family, and both CDD and TCDB
    give it a dedicated family of its own.
- question: >-
    Why does a Geobacter sulfurreducens cell make two unrelated polymerising cytochromes,
    OmcS and OmcZ, with different acceptor preferences and different conductivities, rather
    than one?
suggested_experiments:
- hypothesis: >-
    OmcS filaments are electrically coupled to a specific outer-membrane porin-cytochrome
    conduit rather than collecting electrons promiscuously.
  experiment_type: genetic epistasis with electrochemistry
  description: >-
    In a background making only OmcS filaments (omcZ, omcE and omcT deleted), delete each
    outer-membrane conduit in turn (extABCD, ombB-omaB-omcB, ombC-omaC-omcC) and measure
    Fe(III) oxide reduction rate, with immunogold TEM to confirm the filaments are still
    made and correctly localised. A conduit whose loss phenocopies omcS deletion while the
    filaments remain identifies the entry point.
- hypothesis: >-
    The outer membrane localisation in UniProt reflects fractionation behaviour rather than
    membrane residence.
  experiment_type: subcellular fractionation with controls
  description: >-
    Fractionate G. sulfurreducens into inner membrane, outer membrane, periplasm and sheared
    surface material, with marker proteins for each compartment, and test whether OmcS
    partitions with an outer-membrane marker or is quantitatively removed by gentle shearing
    before fractionation. Carbonate extraction and phase separation would distinguish a
    peripheral association from integration into the bilayer.
- hypothesis: >-
    OmcS polymerisation is regulated, as OmcZ polymerisation is by the protease OzpA.
  experiment_type: in vitro reconstitution
  description: >-
    Express and purify monomeric OmcS and test whether it self-assembles into filaments
    under physiological conditions without any accessory factor, following the design used
    for OmcZ and OzpA. If assembly needs a partner or a modification, identify it by
    fractionating culture supernatant for the activity that permits polymerisation.
