    summary: >-
      Propagation of the process term from the same node. OmcS occupies the extracellular
      end of the anaerobic respiratory chain, where electrons leave the cell for an
      insoluble acceptor.
    action: ACCEPT
    reason: >-
      OmcS does part of the work of the process rather than merely being required for it:
      it is itself the carrier over the final stretch, as the filament structure and the in
      vitro transfer to Fe(III) and Mn(IV) oxides show. The genetic phenotype is specific in
