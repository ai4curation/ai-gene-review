      segment, since deleting omcS leaves fumarate and Fe(III) citrate respiration intact
      and blocks only Fe(III) oxide. The node carrying this term was assessed SOUND in the
      PTHR30333 family review. Other terminal and envelope cytochromes reviewed here carry
      the same term (ImcH, CbcL, OmcZ, and Shewanella OmcA), and GO offers nothing narrower
      for respiration on an extracellular solid acceptor.
