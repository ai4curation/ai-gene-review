- term:
    id: GO:0020037
    label: heme binding
  evidence_type: IDA
  original_reference_id: PMID:21236241
  qualifier: enables
  review:
    summary: >-
      OmcS carries six covalently bound low-spin c-type hemes, counted in the purified
      protein by mass and spectroscopy and resolved in two independent cryo-EM structures of
      the filament.
    action: NEW
    reason: >-
      Heme binding is the cofactor basis of everything OmcS does and is demonstrated
      directly, yet GOA has no molecular-function row for it beyond the generic carrier
      term. The purified protein was shown to hold six bis-histidinyl hexacoordinated hemes
      (PMID:21236241), the sequence carries exactly six CXXCH motifs, and the filament
      structures resolve the heme chain including inter-subunit stacking and axial
      coordination by a histidine from the neighbouring subunit (PMID:30951668). UniProt
      curates the heme cofactor with experimental evidence. Recorded alongside the
      electron-transfer row rather than as a separate core function, as for the other
      multiheme cytochromes reviewed here.
    supported_by:
    - reference_id: PMID:21236241
      supporting_text: Purified OmcS had a molecular mass of 47015 Da, and six low-spin bis-histidinyl
        hexacoordinated heme groups.
    - reference_id: PMID:30951668
      supporting_text: The inter-subunit interfaces show unique structural elements such as
        inter-subunit parallel-stacked hemes and axial coordination of heme by histidines
        from neighboring subunits.
- term:
    id: GO:0051258
    label: protein polymerization
  evidence_type: IDA
  original_reference_id: PMID:30951668
  qualifier: involved_in
  review:
    summary: >-
      The conductive filaments on the cell surface are homopolymers of OmcS itself, resolved
      by cryo-EM at 3.4 angstroms and extending for micrometres.
    action: NEW
    reason: >-
      OmcS performs the polymerisation rather than merely being its substrate: the filament
      contains no other protein, and the contacts that hold it together are made by OmcS
      surfaces, including hemes stacked across the subunit interface and heme iron
      coordinated by a histidine donated from the adjacent subunit. The polymer is the
      functional form, so this is not incidental aggregation. The same action was taken for
      OmcZ, the other polymerising cytochrome of this organism. The row is kept at the
      generic process level because GO has no term for assembly of an extracellular
      cytochrome filament; the matching component term is proposed below.
    supported_by:
    - reference_id: PMID:30951668
      supporting_text: G. sulfurreducens nanowires are assembled by micrometer-long polymerization
        of the hexaheme cytochrome OmcS
    - reference_id: PMID:30951668
      supporting_text: The inter-subunit interfaces show unique structural elements such as
        inter-subunit parallel-stacked hemes and axial coordination of heme by histidines
        from neighboring subunits.
