id: Q74A86
gene_symbol: omcS
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:243231
  label: Geobacter sulfurreducens PCA
description: >-
  OmcS (locus GSU2504) is a hexaheme c-type cytochrome of Geobacter sulfurreducens that
  polymerizes outside the cell into helical filaments carrying electrons from the cell to
  insoluble acceptors. The 432-residue precursor has a cleavable signal peptide and no
  transmembrane segment or lipid anchor; the mature protein is only loosely held at the
  outer surface and shears off intact cells readily. Purified OmcS is 47 kDa, carries six
  low-spin bis-histidinyl hexacoordinated hemes, has a midpoint potential near -212 mV,
  and is mostly disordered in secondary structure. Cryo-electron microscopy of filaments
  sheared from cells showed that the conductive extracellular appendages long attributed
  to type IV pili are in fact micrometre-long polymers of OmcS, with hemes stacked within
  a few angstroms of each other, inter-subunit heme stacking, and heme iron coordinated
  axially by a histidine from the neighbouring subunit. Reaching the cell exterior
  requires the PilA-N/PilA-C filament: without it OmcS remains in the periplasm. Reduced
  OmcS delivers electrons in vitro to insoluble Fe(III) oxide, Mn(IV) oxide, humic
  substances, chelated Fe(III) and the humic analogue AQDS. Deleting omcS abolishes
  Fe(III) oxide reduction while leaving growth on fumarate and soluble Fe(III) citrate
  intact, and the paralogous hexaheme cytochrome OmcT, encoded immediately downstream and
  62.6% identical, cannot substitute. OmcS is also essential for direct interspecies
  electron transfer to a Geobacter metallireducens partner, in which its transcript rises
  several hundred-fold. The gene is expressed during growth on Fe(III) oxide and on
  fumarate but not on soluble Fe(III) citrate.
