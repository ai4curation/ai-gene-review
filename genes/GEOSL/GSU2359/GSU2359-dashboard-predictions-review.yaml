  findings:
  - statement: PoGH57 is a DUF3536-containing GH57 protein.
    supporting_text: >-
      The GH57 enzyme (further referred to as PoGH57) is predicted to be a DUF3536
      (domain of unknown function)-containing protein when using BLAST.
  - statement: PoGH57 acts on alpha-1,4-glucans as a 4-alpha-glucanotransferase/hydrolase.
    supporting_text: >-
      It can be concluded that the PUL of Pontibacter sp. SGAir0037 contains only one GBE
