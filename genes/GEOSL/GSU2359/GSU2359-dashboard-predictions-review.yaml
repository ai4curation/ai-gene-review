description: >-
  The KBase gene-annotate dashboard (Dark Protein Atlas) LLM call for G. sulfurreducens
  DPAK01000005.1_6 is "Glycoside hydrolase family 57 protein containing a DUF3536 domain,
  substrate specificity undetermined." (tier B). Its GO terms are GO:0016798 hydrolase
  activity, acting on glycosyl bonds (high) and GO:0016052 carbohydrate catabolic process
  (medium). The dashboard sequence is identical over its full 817 residues to GSU2359
  (Q74AJ5; UniParc exact match), so the call is scored on Q74AJ5. The family call is
  right, and the protein is very probably an active enzyme: it keeps the GH57 catalytic
  nucleophile (Glu154) and proton donor (Asp263), as do 582-583 of 583 UniProtKB
  DUF3536 proteins. "Substrate specificity undetermined" is too cautious. CAZy places
  GSU2359 in subfamily GH57_6, whose characterized members all act on alpha-1,4-glucans
  (three alpha-amylases and the Pontibacter PoGH57, which is 49.4% identical to GSU2359
  over 806 residues, shares its DUF3536 domain and acts on amylose and maltodextrin by
  hydrolysis and 4-alpha-glucanotransfer, PMID:38930854). PoGH57 is encoded in a
  TreZ/TreY/TreS/GlgE/GH77 cluster like the one around GSU2359 (treZ GSU2358, GSU2359,
  treY GSU2360, treS-maltokinase GSU2361; conserved in a second G. sulfurreducens genome
  and in G. metallireducens). The trehalose link is lineage-specific, though: across
  1257 species only 9.6% have both treY and treZ within 5 genes of their DUF3536 gene,
  and no GH57/DUF3536 gene in the pangenome is fused to TreY. No characterized GH57 enzyme
  is an alpha-mannosidase; the COG1449 "alpha-mannosidase" label and the GH38 Gene3D hit
  reflect a shared fold with GH38 (PMID:12618437). GO:0016798 is a correct novel term
  (COR). GO:0016052 is not established: whether this enzyme degrades glycogen, trims
  maltooligosaccharides for TreY/TreZ, or remodels alpha-glucan by
  4-alpha-glucanotransfer is untested (UNC). Recommended dashboard verdict: under-called.
  Corrected annotation: "GH57 subfamily 6 (DUF3536-type) alpha-1,4-glucan-active
  glycoside hydrolase/4-alpha-glucanotransferase; catalytic Glu154/Asp263 conserved;
  encoded in a treZ-GSU2359-treY-treS(maltokinase) cluster, so probably acts on
  glycogen-derived maltooligosaccharides alongside the TreY/TreZ trehalose pathway;
  exact reaction untested; not an alpha-mannosidase."
