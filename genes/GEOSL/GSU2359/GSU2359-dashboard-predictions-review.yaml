predictions:
- source_method: gene-annotate dashboard LLM annotation (Dark Protein Atlas)
  source_version: '2026-10-30 snapshot'
  predicted_term:
    id: GO:0016798
    label: hydrolase activity, acting on glycosyl bonds
  predicted_term_type: GO_MF
  review:
    assessment: COR
    confidence_score: 2
    summary: >-
      Correct and not in GOA, which has only the uninformative GO:0003824 catalytic
      activity and GO:0005975 (both InterPro IEA). GSU2359 has a GH57 catalytic domain
      followed by DUF3536 and keeps both GH57 catalytic residues, Glu154 (nucleophile,
      CSR-3) and Asp263 (proton donor, CSR-4), at the HMM positions of the experimentally
      defined T. litoralis and Thermococcus/Thermus enzymes; these residues are conserved
      in essentially all DUF3536 proteins. CAZy places it in GH57_6, whose characterized
      members are alpha-amylases and the 49.4%-identical PoGH57, which acts on amylose and
      maltodextrin (PMID:38930854). The term is true but broad: a more specific
      O-glycosyl hydrolase / alpha-glucan activity is likely, but whether GSU2359
      hydrolyses or transglycosylates is untested, so the family-level term is a fair
      call. It is not an alpha-mannosidase.
    supported_by:
    - reference_id: file:GEOSL/GSU2359/GSU2359-bioinformatics/RESULTS.md
      supporting_text: >-
        GSU2359 keeps both GH57 catalytic residues: Glu154 at the nucleophile position and
        Asp263 at the proton-donor position.
    - reference_id: file:GEOSL/GSU2359/GSU2359-bioinformatics/RESULTS.md
      supporting_text: >-
        CAZy assigns GSU2359 (AAR35733.2), A2cp1_1916 (ACL65258.1) and DVU_2472
        (AAS96944.1) all to subfamily GH57_6.
    - reference_id: PMID:38930854
      supporting_text: >-
        It can be concluded that the PUL of Pontibacter sp. SGAir0037 contains only one
        GBE (in family GH13_9), and the GH57 enzyme acts as an α-1,4-glucanotransferase.
- source_method: gene-annotate dashboard LLM annotation (Dark Protein Atlas)
  source_version: '2026-10-30 snapshot'
  predicted_term:
    id: GO:0016052
    label: carbohydrate catabolic process
  predicted_term_type: GO_BP
  review:
    assessment: UNC
    confidence_score: 1
    summary: >-
      Plausible but not established. The extractor took the term from the words
      "glycoside hydrolase", not from evidence about the pathway. GSU2359 is encoded
      between treZ and treY, with treS-maltokinase downstream; TreY and TreZ convert the
      reducing end of glycogen-derived alpha-1,4-glucans into trehalose, so the cluster as
      a whole could serve glycogen breakdown, trehalose synthesis or maltose-1-phosphate
      supply. The characterized relative PoGH57 acts both hydrolytically and as a
      4-alpha-glucanotransferase, which remodels rather than degrades glucan
      (PMID:38930854). Which of these GSU2359 does in vivo, and whether its net role is
      catabolic or biosynthetic, has not been tested; no mutant or fitness data exist for
      G. sulfurreducens. The term is absent from GOA, which has the broader GO:0005975.
    supported_by:
    - reference_id: file:GEOSL/GSU2359/GSU2359-dashboard-prediction-evidence/dashboard_page.txt
      supporting_text: >-
        For biological process, glycoside hydrolases are involved in the breakdown of
        carbohydrates, supporting 'carbohydrate catabolic process'.
    - reference_id: PMID:38930854
      supporting_text: >-
        It can be concluded that the PUL of Pontibacter sp. SGAir0037 contains only one
        GBE (in family GH13_9), and the GH57 enzyme acts as an α-1,4-glucanotransferase.
