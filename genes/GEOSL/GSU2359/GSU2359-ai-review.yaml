  review:
    summary: >-
      True but uninformative. GSU2359 is a GH57 enzyme with both catalytic residues
      conserved, so a glycosidase term is supported.
    action: MODIFY
    reason: >-
      The InterPro2GO mapping of the GH57 N-terminal domain gives only the root catalytic
      activity term. GSU2359 keeps the GH57 nucleophile (Glu154, CSR-3) and proton donor
      (Asp263, CSR-4) at the HMM positions defined by the T. litoralis
      4-alpha-glucanotransferase structure and the Thermococcus, Thermus and Pyrococcus
      branching enzymes, and these residues are conserved in essentially all DUF3536
      proteins. CAZy places GSU2359 in GH57_6, whose characterized members are
      alpha-amylases and the 49.4%-identical PoGH57, which hydrolyses alpha-1,4-glucans
      (PMID:38930854). Hydrolysis of O-glycosyl bonds (GO:0004553) is therefore
      supported as the activity class. A specific enzyme term (alpha-amylase
      GO:0004556 or 4-alpha-glucanotransferase GO:0004134) would go beyond the
      evidence, since PoGH57 showed both modes and GSU2359 has not been assayed.
    proposed_replacement_terms:
    - id: GO:0004553
      label: hydrolase activity, hydrolyzing O-glycosyl compounds
