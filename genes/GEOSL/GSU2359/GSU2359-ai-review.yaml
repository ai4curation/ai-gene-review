core_functions:
- description: >-
    Retaining GH57 (subfamily 6) glycosidase acting on alpha-1,4-glucosidic bonds of
    alpha-glucans (probably glycogen-derived maltooligosaccharides), by hydrolysis and
    possibly 4-alpha-glucanotransfer, using Glu154 as nucleophile and Asp263 as proton
    donor. Encoded with TreZ and TreY, so probably acts on the substrates or products of
    the TreY/TreZ alpha-glucan-to-trehalose route; the exact reaction is untested.
  molecular_function:
    id: GO:0004553
    label: hydrolase activity, hydrolyzing O-glycosyl compounds
