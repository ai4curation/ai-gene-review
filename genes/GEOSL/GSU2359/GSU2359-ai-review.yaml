      over 806 aligned residues.
  - reference_id: PMID:38930854
    supporting_text: >-
      The combined action of both enzymes indicated that PoGH57 predominantly played a
      hydrolytic role
suggested_questions:
- question: >-
    Does purified GSU2359 hydrolyse alpha-1,4-glucans (amylose, glycogen,
    maltooligosaccharides), disproportionate them as a 4-alpha-glucanotransferase, or act
    on maltooligosyltrehalose, and do E154A and D263A abolish the activity?
- question: >-
    In G. sulfurreducens, does GSU2359 supply TreY with shorter maltooligosaccharides
    from glycogen, or act on TreY/TreZ products, and is it co-transcribed with
    treZ-treY-treS?
- question: What does the DUF3536 domain contribute (substrate binding, specificity, oligomerization)?
suggested_experiments:
- description: >-
    Express GSU2359 and its E154A and D263A mutants; assay on amylose, glycogen,
    maltoheptaose and maltooligosyltrehalose; separate hydrolysis from
    disproportionation products by HPAEC-PAD.
  experiment_type: in vitro enzyme assay with catalytic mutants
- description: >-
    Delete GSU2359, treY and treZ in G. sulfurreducens and measure glycogen, trehalose and
    maltose-1-phosphate pools under osmotic and nutrient stress.
  experiment_type: gene deletion and metabolite profiling
