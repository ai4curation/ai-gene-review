  review:
    summary: >-
      Correct but general. The substrate class is alpha-glucan, so alpha-glucan metabolic
      process is the better term.
    action: MODIFY
    reason: >-
      All characterized GH57_6 enzymes act on alpha-1,4-glucans (starch, amylose,
      maltodextrin), and the 49.4%-identical PoGH57 acts on amylose and maltooligosaccharides
      (PMID:38930854). In G. sulfurreducens the gene sits between treZ and treY, whose
      products convert the reducing end of alpha-1,4-glucans into trehalose
      (PMID:8605217), and the same order is conserved in G. metallireducens and
      Pontibacter. GSU2359 therefore performs a step on alpha-glucan. Whether the net
      process is glycogen degradation, trehalose synthesis or glucan remodelling is not
      known, so neither glycogen catabolic process nor trehalose biosynthetic process is
      proposed.
    proposed_replacement_terms:
    - id: GO:0030978
      label: alpha-glucan metabolic process
    supported_by:
    - reference_id: PMID:38930854
      supporting_text: >-
        Both enzymes exhibited activity on amylose and MD18.
    - reference_id: file:GEOSL/GSU2359/GSU2359-bioinformatics/RESULTS.md
      supporting_text: >-
        In G. sulfurreducens the gene order is treZ (-1), GSU2359, treY (+1), treS/maltokinase
        (+2).
    - reference_id: file:GEOSL/GSU2359/GSU2359-deep-research-claude-code.md
      supporting_text: >-
        TreZ, GSU2359, TreY and TreS–Mak lie on the same strand, almost back to back.
    - reference_id: PMID:8605217
      supporting_text: >-
        encoding maltooligosyltrehalose
        synthase (TreY) and maltooligosyltrehalose trehalohydrolase (TreZ)
