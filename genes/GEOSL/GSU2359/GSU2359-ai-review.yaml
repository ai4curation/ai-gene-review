  label: Geobacter sulfurreducens PCA
description: >-
  GSU2359 is an uncharacterized 817-residue cytoplasmic glycoside hydrolase family 57
  (GH57) protein. It has an N-terminal GH57 catalytic domain, an incomplete
  (beta/alpha)7 barrel, followed by a DUF3536 domain (residues 340-623). CAZy places it
  in GH57 subfamily 6 (GH57_6), whose characterized members act on alpha-1,4-glucans:
  three alpha-amylases and the Pontibacter enzyme PoGH57. PoGH57 is 49.4% identical to
  GSU2359 over its full length, shares the DUF3536 domain, and acts on amylose and
  maltodextrin by hydrolysis and 4-alpha-glucanotransfer. GSU2359 keeps both GH57
  catalytic residues, the nucleophile Glu154 and the proton donor Asp263, so it is very
  probably an active retaining alpha-glucan hydrolase or transglycosylase. Its exact
  reaction and substrate have not been tested. It is encoded between treZ (GSU2358,
  maltooligosyltrehalose trehalohydrolase) and treY (GSU2360, maltooligosyltrehalose
  synthase), followed by a trehalose synthase-maltokinase gene (GSU2361), the same order
  as in G. metallireducens and Pontibacter. It therefore probably acts on glycogen-derived
  maltooligosaccharides in the TreY/TreZ route from alpha-glucan to trehalose or
  maltose-1-phosphate, but whether it trims, degrades or remodels the glucan is unknown.
  It is not an alpha-mannosidase: that word in the COG1449 name reflects the fold GH57
  shares with GH38 alpha-mannosidases.
