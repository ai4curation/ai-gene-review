    - reference_id: file:GEOSL/GSU2359/GSU2359-bioinformatics/RESULTS.md
      supporting_text: >-
        GSU2359 keeps both GH57 catalytic residues: Glu154 at the nucleophile position and
        Asp263 at the proton-donor position.
    - reference_id: file:GEOSL/GSU2359/GSU2359-bioinformatics/RESULTS.md
      supporting_text: >-
        CAZy assigns GSU2359 (AAR35733.2), A2cp1_1916 (ACL65258.1) and DVU_2472
        (AAS96944.1) all to subfamily GH57_6.
    - reference_id: PMID:29998051
      supporting_text: >-
        The family GH57 enzymes employ the retaining reaction mechanism, share five
        typical conserved sequence regions and possess catalytic (β/α)7-barrel succeeded
        by a four-helix bundle with the catalytic machinery consisting of catalytic
        nucleophile and proton donor (glutamic acid and aspartic acid at strands β4 and β7,
        respectively).
    - reference_id: PMID:38930854
      supporting_text: >-
        The combined action of both enzymes indicated that PoGH57 predominantly played a
        hydrolytic role
