proposed_new_terms: []
suggested_questions:
- question: Does rabbit uteroglobin's progesterone binding physiologically buffer progesterone availability to the preimplantation
    blastocyst, or is its principal in vivo role the anti-inflammatory PLA2 inhibition?
- question: Is the controversial LMBR1L interaction a genuine receptor relationship for uteroglobin, or an artefact?
suggested_experiments:
- description: Quantitative binding assays (ITC/fluorescence) measuring progesterone affinity and stoichiometry of the native
    rabbit homodimer versus a disulfide-free monomer to test whether dimerization is required for high-affinity steroid binding.
- description: In vitro PLA2 inhibition assays comparing rabbit uteroglobin with mouse/human SCGB3A2 to quantify and compare
    inhibitory potency across the family.
