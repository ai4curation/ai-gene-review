  label: Oryctolagus cuniculus
description: Rabbit uteroglobin (blastokinin; secretoglobin family 1A member 1) is the founding member of the secretoglobin
  superfamily and the archetypal small secreted steroid-binding protein. The mature ~70-residue chain folds into a four-alpha-helix
  bundle and assembles into a compact antiparallel homodimer joined by two interchain disulfide bonds, enclosing a central
  hydrophobic cavity resolved by high-resolution X-ray crystallography (PDB 1UTG, 2UTG). The protein is secreted by epithelial
  cells of the uterus (and also expressed in lung) into luminal fluid, where it binds progesterone specifically and with high
  affinity within the internal cavity and may buffer the progesterone concentration reaching the preimplantation blastocyst.
  Uteroglobin is also a potent inhibitor of phospholipase A2, an activity shared across the uteroglobin/Clara-cell-protein
  family that underlies its anti-inflammatory character. Its synthesis in the uterus is induced by progesterone.
