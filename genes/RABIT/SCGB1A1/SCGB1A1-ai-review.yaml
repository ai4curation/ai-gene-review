- id: PMID:165837
  title: Binding of progesterone to the proteins of the uterine luminal fluid. Identification
    of uteroglobin as the binding protein.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified primary study (Beato & Baier 1975). Direct equilibrium [3H]-progesterone binding assay
      on rabbit uterine luminal fluid identifying uteroglobin as the binding protein, with saturable 1:1 progesterone binding
      and a measured association constant. This is the direct binding demonstration behind the GO:1990239 steroid-hormone-binding
      NEW annotation (IDA).
- id: PMID:3084897
