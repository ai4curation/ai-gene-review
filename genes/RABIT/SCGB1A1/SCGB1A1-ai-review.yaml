  review:
    summary: Electronic TreeGrafter inference placing uteroglobin in the cytoplasm.
    action: REMOVE
    reason: Over-propagated electronic annotation that conflicts with the established biology. Uteroglobin is a signal-peptide-bearing
      secretory protein whose curated and experimentally supported location is Secreted/extracellular; it has no characterized
      cytoplasmic function. The transient passage of any secreted protein through the cytosol/secretory pathway does not justify
      a standalone cytoplasm annotation, which is captured correctly by the extracellular region term.
