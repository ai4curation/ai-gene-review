    predicted_term_type: GO_CC
    review:
      assessment: CNN
      confidence_score: 2
      summary: >-
        Rank 2 (score 16.97). Not present in GOA and scored NO_OVERLAP mechanically, but it
        is not a novel biological claim: E2 enzymes act in E1-E2-E3 assemblies by definition,
        and UBE2L6 works with UBA7 and HERC5. The term is a weakly-populated cellular
        component that GO annotation practice generally avoids in favour of the activity
        terms already present, so it adds a placement without adding information.
      supported_by:
