id: G1TUN6
gene_symbol: UBE2L6
taxon:
  id: NCBITaxon:9986
  label: Oryctolagus cuniculus
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for rabbit UBE2L6 (UBCH8), the dedicated E2 enzyme
  of the ISG15 conjugation pathway. ProTrek resolves the paralog correctly and at full
  specificity: its top GO hit is ISG15 transferase activity, the exact molecular function
  this review identifies as core, with ubiquitin conjugating enzyme activity and
  ISG15-protein conjugation also in the top five. All three are exact matches to existing
  GOA annotations, so nothing here is novel - but the discrimination is real, because the
  UBC fold is shared by roughly forty human E2 paralogs with different cargo and the
  model picked the ISG15 one first. ProtNLM2 on the same protein returned only
  "transferase activity", four levels more general.
  Assessment: 3 correct not novel (CNN).
source_documents:
  - projects/PROTREK_EVALUATION/argo50_protrek_hits.tsv
