      summary: >-
        Top-ranked hit (score 17.37), an exact match to the GOA annotation and to this
        review's core molecular function. The call requires distinguishing UBE2L6 from the
        other UBC-domain E2 enzymes on sequence alone, which the model does - but the term
        is already annotated (by orthology from human O14933 and mouse Q9QZU9), so the
        prediction is correct rather than novel.
