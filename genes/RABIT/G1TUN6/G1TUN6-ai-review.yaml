  review:
    summary: >-
      Ensembl Compara transfer from human O14933. Human UbcH8 was purified as the
      E2 charged by E1-ISG15 in extracts of interferon-treated cells, and siRNA
      knockdown blocked interferon-induced ISGylation in vivo. PAINT places the
      same process (with GO:0042296) at the Mammalia node PTN000631065, seeded by
      human UBE2L6 and mouse Ube2l6, so the function is inherited across
      mammalian UBE2L6 orthologs rather than specific to humans. UBE2L6 does
      part of the work of this process: it carries the ISG15 thioester and
      transfers it.
    action: ACCEPT
    reason: >-
      This is the core process. Orthology is established by Ensembl Compara and
      CTD 9246, the protein is full length, and the catalytic cysteine is
      conserved. The PAINT ancestral node covers mammalian UBE2L6.
    supported_by:
    - reference_id: PMID:15131269
