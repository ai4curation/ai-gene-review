id: G1TUN6
gene_symbol: UBE2L6
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9986
  label: Oryctolagus cuniculus
description: >-
  UBE2L6 (UbcH8) is a 153-residue E2 conjugating enzyme made of a single UBC
  fold. It carries an active-site cysteine (Cys86) that accepts a ubiquitin-like
  modifier from an E1 enzyme as a thioester and hands it to an E3 ligase for
  attachment to substrate lysines. In mammals it is the main E2 of the
  interferon-induced ISG15 conjugation (ISGylation) pathway. It is charged with
  ISG15 by the ISG15-specific E1 UBA7 (UBE1L) and works with E3 ligases such as
  HERC5 to ISGylate host and viral proteins during the type I interferon
  response. It also works as a ubiquitin E2: it is charged by the ubiquitin E1
  and supports polyubiquitination by HECT and RBR (RING-between-RING) E3 ligases.
  The rabbit protein is a full-length ortholog of human UBE2L6 and keeps the
  catalytic cysteine. No experiments have been done on the rabbit protein, so
  its function is inferred from the human and mouse orthologs.
existing_annotations:
- term:
    id: GO:0005524
    label: ATP binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: enables
  review:
    summary: >-
      UniRule-derived ATP binding (UR000141827), which matches the ATP-binding and
      Nucleotide-binding keywords on the record. E2 enzymes have no nucleotide-binding
      site. ATP is consumed only by the E1 enzyme, which adenylates the modifier
      before passing it on to the E2 cysteine. The reaction UniProt gives for this
      protein is an E1-to-E2 transthioesterification that uses no ATP.
    action: REMOVE
    reason: >-
      This electronic mapping is demonstrably wrong for E2 enzymes. ATP is used by
      the E1 (UBA7 for ISG15, UBA1 for ubiquitin) and not by UBE2L6. In the human
      UbcH8 assays, ATP is supplied to drive the E1 step and the E2 is charged only
      when the E1 is present.
    supported_by:
    - reference_id: PMID:15131269
      supporting_text: ISG15 was covalently linked to UbcH8 only in the presence of E1 ISG15
- term:
    id: GO:0016874
    label: ligase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: enables
  review:
    summary: >-
      UniRule-derived ligase activity (UR000414843). GO places E2 activity under
      transferase activity (GO:0061631 and GO:0042296 are both is_a
      GO:0019787 ubiquitin-like protein transferase activity, under GO:0016740),
      and the EC number for this activity, 2.3.2.23, is a transferase number. The
      historic "E2 ubiquitin ligase" usage is not a ligase (EC 6) activity.
    action: REMOVE
    reason: >-
      Wrong enzyme class. UBE2L6 performs transthioesterification and modifier
      transfer, which GO classifies as transferase activity. It does not join two
      molecules coupled to nucleoside triphosphate hydrolysis.
    supported_by:
    - reference_id: PMID:15131269
      supporting_text: These results indicate that ISG15 was transferred from E1 ISG15 to UbcH8, and that UbcH8 functions as an E2 for ISG15.
- term:
    id: GO:0061631
    label: ubiquitin conjugating enzyme activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000003
  qualifier: enables
  review:
    summary: >-
      EC-mapped ubiquitin E2 activity. Human UbcH8 was first characterised as a
      ubiquitin E2, and the paper that identified it as the ISG15 E2 also showed
      that it supports efficient Rsp5-catalysed polyubiquitination of WBP2. It
      binds RBR E3s (HHARI, H7-AP1). The broad E2 PAINT node PTN002514495, which
      includes the UBE2L3 paralog among its seeds, gives this activity by IBA to
      human UBE2L6. G1TUN6 is a full-length ortholog with the catalytic Cys86
      conserved (bioinformatics RESULTS.md).
    action: ACCEPT
    reason: >-
      This is a correct, precise molecular function. UBE2L6 works with two
      modifiers, ubiquitin and ISG15, and the ubiquitin E2 activity is a
      demonstrated activity of the orthologous enzyme, not a stray family
      transfer. The earlier review kept it as non-core. Here it is accepted as
      the second of two core catalytic activities, while ISG15 transfer remains the
      dominant in vivo role.
    supported_by:
    - reference_id: PMID:15131269
      supporting_text: Rsp5p catalyzed efficient polyubiquitination of WBP2 in the presence of E1 Ub and UbcH8
