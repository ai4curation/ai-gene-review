  findings:
  - statement: Human UbcH8 (UBE2L6) is charged with ISG15 by E1-ISG15 and is a major E2 for ISG15 conjugation in vivo (siRNA).
    supporting_text: We therefore conclude that UbcH8 serves as a major E2 enzyme for ISG15 conjugation in vivo .
