- term:
    id: GO:0042296
    label: ISG15 transferase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: >-
      This is the core molecular function. Human UbcH8 accepts ISG15 from E1-ISG15
      as a DTT-sensitive thioester, and a UbcH8-competent E3 transfers ISG15
      onward to a substrate. Related E2s cannot substitute: UbcH5b forms no
      complex, and UbcH7, the closest paralog, forms only about 5% as much.
      This is why the activity can be transferred only to UBE2L6 orthologs and
      not to the UBE2L3 paralog. PAINT node PTN000631065 (Mammalia) carries this
      term.
    action: ACCEPT
    reason: >-
      This is the most specific supported activity. G1TUN6 is the rabbit UBE2L6
      ortholog, about 80% identical to human UBE2L6 against about 52% for UBE2L3,
      and keeps Cys86.
    supported_by:
    - reference_id: PMID:15131269
      supporting_text: These results indicate that ISG15 was transferred from E1 ISG15 to UbcH8, and that UbcH8 functions as an E2 for ISG15.
    - reference_id: file:RABIT/G1TUN6/G1TUN6-bioinformatics/RESULTS.md
      supporting_text: "| O14933 human UBE2L6 (UbcH8) | 153 | 79.7% over 153 aligned pairs | C86 |"
- term:
    id: GO:0045087
    label: innate immune response
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  review:
    summary: >-
      Ensembl Compara transfer of a human UniProt IDA from PMID:28724761. That
      paper studies ISG15 in hepatitis E virus replication. Its only experimental
      statement about UBE2L6 is negative: loss of UBE2L6 (or UBE1L) did not
      change the virus's sensitivity to type I interferon. When PAINT curators
      placed the UBE2L6-specific functions at node PTN000631065, they propagated
      ISG15 transferase activity and ISG15-protein conjugation but not innate
      immune response. We read that omission as deliberate. ISGylation is an
      interferon-induced antiviral modification, so UBE2L6 contributes to
      interferon-driven defense through GO:0032020. A separate innate immune
      process term adds no participation evidence beyond that.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The donor evidence does not show that UBE2L6 takes part in an innate immune
      response, and the cited paper reports that UBE2L6 loss had no effect in its
      assay. The immunological relevance is captured more accurately by
      ISG15-protein conjugation. This is not REMOVE, because ISGylation is part of
      the interferon antiviral program and other studies may support a role.
    supported_by:
    - reference_id: PMID:28724761
      supporting_text: We also observed that loss of ISGylating enzymes (UBE1L and UBE2L6) did not affect the HEV type I IFN sensitivity.
    - reference_id: file:RABIT/G1TUN6/G1TUN6-bioinformatics/RESULTS.md
      supporting_text: PAINT did not propagate innate immune response at PTN000631065 or at any other
core_functions:
- description: >-
    ISG15-specific E2 activity. UBE2L6 is charged with ISG15 by the E1 UBA7 on its
    active-site Cys86 and transfers ISG15 to substrate proteins with E3 ligases
    such as HERC5. This makes it the principal E2 of the interferon-induced
    ISGylation pathway.
