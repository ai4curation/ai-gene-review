suggested_questions:
- question: >-
    The human O14933 IDA for innate immune response (UniProt, PMID:28724761)
    rests on a paper whose UBE2L6 result is negative. Should the IDA be
    re-examined or replaced with a study that directly shows UBE2L6-dependent
    antiviral defense?
- question: >-
    Does rabbit UBE2L6 show the same strong preference for UBA7 over UBA1 as the
    human enzyme? Which residues determine this E1 selectivity, and are they
    conserved in lagomorphs?
suggested_experiments:
- description: >-
    Run in vitro E1-to-E2 thioester transfer assays with recombinant rabbit
    UBE2L6 (wild type and C86A) and rabbit or human UBA7 and UBA1, comparing
    charging with ISG15 and with ubiquitin.
  experiment_type: biochemical assay
