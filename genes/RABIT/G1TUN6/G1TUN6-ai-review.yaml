    supporting_text: We therefore conclude that UbcH8 serves as a major E2 enzyme for ISG15 conjugation in vivo .
  - reference_id: file:RABIT/G1TUN6/G1TUN6-bioinformatics/RESULTS.md
    supporting_text: "PTN000631065 (taxon Mammalia, 40674): GO:0042296 ISG15 transferase activity and"
- description: >-
    Ubiquitin E2 activity. UBE2L6 is charged with ubiquitin by the ubiquitin E1
    and supports substrate polyubiquitination by HECT and RBR E3 ligases. This
    activity is shared with the broader UBC family.
  molecular_function:
    id: GO:0061631
    label: ubiquitin conjugating enzyme activity
  supported_by:
  - reference_id: PMID:15131269
    supporting_text: Rsp5p catalyzed efficient polyubiquitination of WBP2 in the presence of E1 Ub and UbcH8
