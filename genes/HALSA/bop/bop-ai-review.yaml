- term:
    id: GO:0015078
    label: proton transmembrane transporter activity
  evidence_type: IDA
  original_reference_id: PMID:3288985
  review:
    summary: >-
      Proposed new function annotation that names the ion. Purified bacteriorhodopsin
      (expressed in E. coli and regenerated with retinal) pumps protons, and replacing
      single aspartates on the proton path abolishes or strongly reduces pumping.
    action: NEW
    reason: >-
      GO:0015454 says "light-driven" but not "proton", and it has no proton-specific
      child, so the ion specificity of the core activity is currently missing from GO.
      GO:0015078 is not an ancestor or descendant of GO:0015454, so this adds
      information rather than redundancy. Bacteriorhodopsin itself moves the proton,
      so participation is not in doubt. Other proton transporters carry GO:0015078
      by experimental evidence in GOA, for example V-type ATPase subunits (Atp6v0a2,
      Atp6v1a) and the uncoupling proteins UCP1-3.
    supported_by:
    - reference_id: PMID:3288985
      supporting_text: >-
        The Asp-85----Asn mutant showed not detectable proton pumping, the Asp-96----Asn
        and Asp-212----Glu mutants showed less than 10% and the Asp-115----Glu mutant
        showed approximately equal to 30% of the normal proton pumping.
    - reference_id: PMID:10949309
