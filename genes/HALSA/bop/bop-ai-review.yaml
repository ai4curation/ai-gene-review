proposed_new_terms:
- proposed_name: light-driven proton transmembrane transporter activity
  proposed_definition: >-
    Primary active transport of a proton across a membrane against its electrochemical
    gradient, driven by the energy of absorbed light, for example by a
    retinal-containing microbial rhodopsin.
  justification: >-
    GO:0015454 light-driven active monoatomic ion transmembrane transporter activity has
    no children, so the proton pumps (bacteriorhodopsin, proteorhodopsin,
    xanthorhodopsin) cannot be distinguished from the chloride pump halorhodopsin or
    the sodium-pumping rhodopsins. The activity of bacteriorhodopsin is fully
    characterised; currently the ion specificity has to be expressed by a second term
    (GO:0015078). A proton-specific child of GO:0015454 (and of GO:0015078) would also
    be the natural target for InterPro2GO mappings of the proton-pumping rhodopsin
    families, replacing the incorrect channel mapping.
  proposed_parent:
    id: GO:0015454
    label: light-driven active monoatomic ion transmembrane transporter activity
  supported_by:
  - reference_id: PMID:10949309
    supporting_text: >-
      Here we present an atomic model for structural changes involved in the vectorial,
      light-driven transport of protons by bacteriorhodopsin.
suggested_questions:
- question: >-
    Should the InterPro2GO mapping of IPR018229 (rhodopsin retinal-binding site) to
    GO:0005216 monoatomic ion channel activity be withdrawn? It places channel activity
    on bacteriorhodopsin, halorhodopsins, sensory rhodopsins and proteorhodopsin, none of
    which is a channel; only the eukaryotic channelrhodopsins are.
- question: >-
    Should GO have a cellular component term for the purple membrane, the crystalline
    bacteriorhodopsin-lipid domain of the haloarchaeal cell membrane, or is plasma
    membrane the intended level for such membrane domains?
- question: >-
    Should a light-driven proton pump that generates the proton motive force be
    annotated to GO:0042777 proton motive force-driven plasma membrane ATP synthesis?
    The term definition includes the proton transport that builds the gradient, but
    experimental annotations are on ATP synthase subunits (and Pyrococcus Mbh), so the
    convention appears to restrict the term to the synthase.
suggested_experiments:
- description: >-
    Compare phototrophic growth and ATP levels of an in-frame bop deletion in
    H. salinarum NRC-1 with the parent strain under low oxygen and illumination, to
    give a genetic (IMP) basis for the physiological role that is so far supported
    mainly by biochemistry and by older strain comparisons.
