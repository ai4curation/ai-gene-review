- term:
    id: GO:0007602
    label: phototransduction
  evidence_type: IDA
  original_reference_id: PMID:4517939
  qualifier: involved_in
  review:
    summary: >-
      FlyBase IDA from Oesterhelt and Stoeckenius (1973). The abstract describes
      conversion of light into a proton gradient used for energy coupling, which is
      energy transduction rather than conversion of photons into a signal. Later work
      (Bibikov et al. 1993) showed that bacteriorhodopsin, expressed alone in a strain
      lacking the other three retinal proteins, does support phototactic responses,
      because the cell senses the light-driven change in proton motive force.
    action: KEEP_AS_NON_CORE
    reason: >-
      The cached paper is abstract-only and the curator saw the full text, so I do not
      remove the row. The term is defensible on biological grounds: bacteriorhodopsin
      absorbs the photon and generates the change in proton motive force that the cell
      reads as a photosensory input. It is not the protein's main role, which is
      energy conversion, and in wild-type cells phototaxis is mediated mainly by sensory
      rhodopsins I and II and their transducers. It is therefore kept as non-core.
      GO:0007602 is also not a good container for the core energy role; that role is
      captured by GO:0015454 and the proton transport terms.
    additional_reference_ids:
    - PMID:8415720
    supported_by:
    - reference_id: PMID:8415720
      supporting_text: >-
        We conclude that the BR-mediated photoreception is due to the light-dependent
        generation of delta mu H+.
    - reference_id: PMID:8415720
      supporting_text: >-
        The cells accumulated in a light spot, demonstrating the BR-mediated orientation
        in spatial light gradients.
    - reference_id: PMID:4517939
      supporting_text: >-
        Preliminary results indicate that the gradient in H. halobium plays the central
        role in energy coupling attributed to such electrochemical gradients by
        Mitchell's chemiosmotic theory.
- term:
    id: GO:0015454
    label: light-driven active monoatomic ion transmembrane transporter activity
  evidence_type: IDA
  original_reference_id: PMID:4517939
  qualifier: enables
  review:
    summary: >-
      The founding demonstration of light-driven proton pumping by bacteriorhodopsin:
      light-exposed cells containing purple membrane generate a proton gradient without
      any other energy source, and the pigment releases and takes up protons during its
      photocycle. Later work confirmed this with reconstituted vesicles, mutagenesis of
      the proton path (Asp85, Asp96) and atomic structures of photocycle intermediates.
    action: ACCEPT
    reason: >-
      This is the core molecular function of bacteriorhodopsin and is directly
      demonstrated. GO:0015454 is a leaf term with no proton-specific child, so it is the
      most specific light-driven transporter term available; the ion specificity is
      added by the NEW GO:0015078 row and a new term is proposed below. In all of GOA
      bop is the only gene product annotated to GO:0015454.
    supported_by:
    - reference_id: PMID:4517939
      supporting_text: >-
        We postulate that the light-generated proton gradient arises from a vectorial
        release and uptake of protons by bacteriorhodopsin
    - reference_id: PMID:4524635
      supporting_text: >-
        These results indicate that the purple membrane functions as a lightdriven proton
        pump and the cells use the resulting chemiosmotic gradient for ATP synthesis.
    - reference_id: PMID:10949309
      supporting_text: >-
        Here we present an atomic model for structural changes involved in the
        vectorial, light-driven transport of protons by bacteriorhodopsin.
