id: P02945
gene_symbol: bop
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:64091
  label: Halobacterium salinarum NRC-1
description: >-
  bop encodes bacterio-opsin, the apoprotein of bacteriorhodopsin, the light-driven
  outward proton pump of the extremely halophilic archaeon Halobacterium salinarum.
  The protein is made as a precursor with a 13-residue N-terminal propeptide and
  folds into seven transmembrane helices. Retinal is bound covalently as a protonated
  Schiff base to Lys216 (mature numbering). Bacteriorhodopsin is the only protein of the
  purple membrane, a specialised patch of the cell membrane in which homotrimers form a
  two-dimensional crystalline lattice with archaeal lipids. Light isomerises the
  all-trans retinal to 13-cis and drives a photocycle in which the Schiff base proton is
  passed to Asp85 and released to the outside, and the Schiff base is then reprotonated
  from the cytoplasm through Asp96. Each photocycle moves one proton out of the cell. The
  resulting proton motive force drives ATP synthesis by the cell's ATP synthase and lets
  cells grow phototrophically when oxygen is scarce; bop expression is induced by low
  oxygen and light through the Bat activator. The light-dependent change in proton motive
  force can also be sensed by the cell, so bacteriorhodopsin contributes a secondary
  photoreceptor input to phototaxis. Bacteriorhodopsin is among the most intensively
  studied membrane proteins, with more than a hundred crystal and cryo-EM structures,
  including time-resolved structures of photocycle intermediates.
