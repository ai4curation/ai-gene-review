- term:
    id: GO:0016918
    label: retinal binding
  evidence_type: IDA
  original_reference_id: PMID:6794028
  review:
    summary: >-
      Proposed new function annotation. Retinal is the chromophore of bacteriorhodopsin
      and is bound covalently as a Schiff base to Lys216; the binding site was mapped
      chemically and is seen in every crystal structure.
    action: NEW
    reason: >-
      Retinal binding is the structural basis of light absorption and of the pump
      mechanism (the photocycle starts with retinal isomerisation and the Schiff base
      is the first proton donor). Opsins do carry retinal-binding terms in GO: bovine
      rhodopsin has GO:0005502 11-cis retinal binding by IDA. The parent GO:0016918 is
      used rather than all-trans retinal binding because the bound retinal is all-trans
      in light-adapted and a 13-cis/all-trans mixture in dark-adapted bacteriorhodopsin.
      No archaeal protein currently has any retinal binding annotation in GOA.
    supported_by:
    - reference_id: PMID:6794028
      supporting_text: >-
        After chemical reduction of the retinylidene-lysine Schiff base linkage in
        bacteriorhodopsin, the retinyl residue is covalently attached to Lys-216
    - reference_id: PMID:10452895
      supporting_text: >-
        Near Lys216 where the retinal binds
    - reference_id: PMID:3288985
      supporting_text: >-
        The mutant proteins all regenerated bacteriorhodopsin-like chromophores when
        treated with a detergent-phospholipid mixture and retinal.
core_functions:
- description: >-
    Light-driven outward proton pump of the cell membrane. Absorption of a photon by
    the covalently bound retinal (Schiff base on Lys216) starts a photocycle in which
    the Schiff base proton is transferred to Asp85 and released to the outside, and the
    Schiff base is reprotonated from the cytoplasm via Asp96. One proton is moved out
    per cycle. The resulting proton motive force drives ATP synthesis by ATP synthase
    and supports phototrophic growth when oxygen is low.
