    label: monoatomic ion channel activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR018229
  review:
    summary: >-
      InterPro2GO mapping from IPR018229 (rhodopsin retinal-binding site signature).
      Bacteriorhodopsin is not a channel. It is a light-driven active transporter that
      moves protons outward against the electrochemical gradient, one proton per
      photocycle, through a sequence of protonation changes on the Schiff base, Asp85
      and Asp96.
    action: REMOVE
    reason: >-
      GO:0005216 is defined as energy-independent facilitated diffusion through an
      aqueous pore. Bacteriorhodopsin does the opposite: it uses light energy to pump
      protons uphill and builds a proton gradient in starved or anaerobic cells. Its
      mutants affect pumping, not channel conductance. The mapping is wrong for this
      protein. The same IPR018229 mapping puts channel activity on the halorhodopsins
      (P0DMH7, P15647, P33742), on sensory rhodopsin II (P42196) and on
      proteorhodopsin (Q9F7P4). None of these is a channel; only the algal
      channelrhodopsins are. The correct activity is already captured by the IDA row
      for GO:0015454.
    supported_by:
    - reference_id: PMID:4517939
      supporting_text: >-
        Starved or anaerobic cells containing purple membrane, in the absence of any
        apparent source of energy, generate and maintain a proton gradient across the
