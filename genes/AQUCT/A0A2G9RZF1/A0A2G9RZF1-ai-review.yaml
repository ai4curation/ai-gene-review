    title: "UniProt record A0A2G9RZF1"
existing_annotations: []
core_functions:
  - description: >-
      Gene-level function of bullfrog TLL1, of which A0A2G9RZF1 is a fragment
      covering the C-terminal CUB5 domain only. The complete TLL1 product is a
      secreted BMP-1/tolloid-family zinc metalloendopeptidase. Its mammalian
      ortholog processes procollagen C-propeptides and cleaves chordin. The
      156-aa fragment lacks the astacin protease domain and cannot carry out
      this activity itself. It retains only an extracellular CUB
      protein-interaction module. The assignment rests on TLL1 orthology
      (PANTHER PTHR24251:SF45 orthogroup with human, mouse and Xenopus TLL1;
      99% identity to the complete bullfrog TLL1 model) and on the
      metalloendopeptidase assertion at the PTHR24251 PAINT root. It should not
      be read as an activity of this UniProt entry.
    molecular_function:
      id: GO:0004222
      label: metalloendopeptidase activity
    locations:
      - id: GO:0005576
        label: extracellular region
    knowledge_gaps:
      - gap_statement: >-
          Nothing is known experimentally about amphibian TLL1 substrate
          specificity. In particular it is unknown whether bullfrog TLL1, like
          mammalian TLL-1, processes procollagen and cleaves chordin, and what
          role its C-terminal CUB5 domain plays in substrate recognition.
        boundary: >-
          The fragment identity (TLL1 CUB5) and TLL1 orthology are established
          bioinformatically. Mammalian TLL-1 activities are established
          experimentally.
        gap_kind:
          - BIOLOGY
        significance: >-
          Tolloid paralogs differ in substrate range (TLL-2 lacks procollagen
          processing; mTLD does not cleave chordin), so substrate specificity
          cannot be assumed from family membership.
    supported_by:
      - reference_id: file:AQUCT/A0A2G9RZF1/A0A2G9RZF1-bioinformatics/RESULTS.md
        supporting_text: >-
          A0A2G9RZF1 residues 30-156 are therefore the last 127 residues (CUB5) of
          bullfrog TLL1.
      - reference_id: file:AQUCT/A0A2G9RZF1/A0A2G9RZF1-bioinformatics/RESULTS.md
        supporting_text: >-
          The fragment has no catalytic activity of its own. Any function annotation
          belongs to the TLL1 gene.
      - reference_id: PMID:10479448
        supporting_text: >-
          mTLL-1 is shown to specifically process procollagen C-propeptides at the
          physiologically relevant site
      - reference_id: PMID:10479448
        supporting_text: >-
          BMP-1 and mTLL-1 are shown to cleave Chordin
      - reference_id: PMID:21954942
        supporting_text: >-
          CUB domains are 110-residue protein motifs exhibiting a β-sandwich fold and
          mediating protein-protein interactions in various extracellular proteins
      - reference_id: file:AQUCT/A0A2G9RZF1/A0A2G9RZF1-uniprot.txt
        record_section: ["DR:InterPro"]
        supporting_text: >-
          DR   InterPro; IPR000859; CUB_dom.
suggested_questions:
  - question: >-
      Should UniProt replace or merge the three draft-assembly fragments on
      scaffold KV928989 (A0A2G9RZF1, A0A2G9RZH1, A0A2G9RZI6) with the complete
      TLL1 gene model from the chromosome-level assembly (XP_073462190.1)? Only
      the complete model would warrant metalloendopeptidase annotation.
  - question: >-
      Is PANTHER subfamily assignment for single-domain fragments of multi-domain
      tolloids reliable? This entry falls into the heterogeneous SF37 bin rather
      than the TLL1-containing SF45, and the neighbouring fragments of the same
      gene are split between SF45 and SF53.
suggested_experiments:
  - hypothesis: >-
      Bullfrog TLL1, the gene this fragment belongs to, has procollagen
      C-proteinase and chordinase activity like mammalian TLL-1.
    description: >-
      Express full-length bullfrog TLL1 (XP_073462190.1) recombinantly and assay
      cleavage of procollagen I and chordin. Use a catalytic-glutamate mutant as
      a control, and include a CUB5-deletion variant to test the contribution of
      the domain represented by A0A2G9RZF1.
    experiment_type: biochemistry
