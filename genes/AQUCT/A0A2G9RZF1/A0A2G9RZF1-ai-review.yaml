    title: "Deep research report for A0A2G9RZF1"
    publication_type: DEEP_RESEARCH
    reference_review:
      relevance: LOW
      correctness: UNVERIFIED
      review_notes: >-
        A generic CUB-domain report. It did not identify the protein as a TLL1
        fragment. Re-review 2026-10-21: it is no longer used as support and is
        kept for provenance.
  - id: file:AQUCT/A0A2G9RZF1/A0A2G9RZF1-hypotheses/core-function-1-go-0005201/openscientist.md
    title: "OpenScientist deep research: GO:0005201 as core function of A0A2G9RZF1"
    publication_type: DEEP_RESEARCH
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: >-
        Refuted GO:0005201 and first recognised that the ORF is a tolloid-family
        fragment. It left BMP-1 versus TLL1 open. The re-review analysis
        (bioinformatics RESULTS.md) resolves this as TLL1, with 99% identity to
        XP_073462190.1. The RefSeq accessions and lengths it reports were
        confirmed against NCBI on 2026-10-21.
  - id: PMID:21954942
    title: "Structure and properties of the Ca(2+)-binding CUB domain, a widespread ligand-recognition unit involved in major biological functions"
    reference_review:
      relevance: MEDIUM
      correctness: VERIFIED
      review_notes: >-
        Review of CUB domain biology. It establishes CUB domains as extracellular
        protein-protein interaction modules, which is the only property the
        fragment retains.
  - id: PMID:19801683
    title: "Strong cooperativity and loose geometry between CUB domains are the basis for procollagen C-proteinase enhancer activity"
    reference_review:
      relevance: MEDIUM
      correctness: VERIFIED
      review_notes: >-
        Shows that single PCPE-1 CUB domains lose enhancer activity and substrate
        affinity. It argues against transferring PCPE-like functions to an
        isolated CUB domain.
  - id: PMID:10479448
    title: "Mammalian BMP-1/Tolloid-related metalloproteinases, including novel family member mammalian Tolloid-like 2, have differential enzymatic activities and distributions of expression relevant to patterning and skeletogenesis."
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: >-
        Primary characterization of mammalian TLL-1 protease activity: processing
        of procollagen C-propeptides and cleavage of chordin. Abstract only. It
        supports the function of the complete TLL1 gene, not of this non-catalytic
        fragment.
  - id: file:AQUCT/A0A2G9RZF1/A0A2G9RZF1-bioinformatics/RESULTS.md
    title: "A0A2G9RZF1 bioinformatics: identity of the 156-aa CUB ORF"
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: >-
        Reproducible phmmer comparison against reviewed tolloids and the complete
