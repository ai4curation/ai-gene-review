id: A0A2G9RZF1
gene_symbol: A0A2G9RZF1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:8400
  label: Aquarana catesbeiana
description: >-
  A0A2G9RZF1 (ORF AB205_0007200) is a 156-residue fragmentary gene model from the
  2017 draft genome of the American bullfrog. It corresponds to the C-terminal CUB
  domain (CUB5) of tolloid-like protein 1 (TLL1). Residues 30-156 are 126 of 127
  identical to the last 127 residues of the complete bullfrog TLL1 model
  (XP_073462190.1, 1005 aa), and identity to other tolloids follows the TLL1
  orthogroup (Xenopus TLL1 > mammalian TLL1 > BMP1/TLL2). The fragment lacks the
  signal peptide, the prodomain, the astacin-like zinc metalloprotease domain with
  its catalytic residues, CUB1-CUB4 and both EGF-like domains, so on its own it
  has no catalytic activity. The complete TLL1 gene product is a secreted
  BMP-1/tolloid-family zinc metalloprotease. In mammals it processes procollagen
  C-propeptides and cleaves the BMP antagonist chordin. Its C-terminal CUB
  domains are extracellular protein-interaction modules that bind calcium.
references:
  - id: PMID:29127278
    title: "The North American bullfrog draft genome provides insight into hormonal regulation of long noncoding RNA"
    reference_review:
      relevance: LOW
      correctness: VERIFIED
      review_notes: >-
        UniProt cites this bullfrog draft genome paper for the nucleotide sequence.
        It gives the genomic context but no functional characterization of this
        gene. Its fragmented assembly explains the split TLL1 gene model.
