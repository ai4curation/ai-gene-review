id: A0A2G9RZF1
gene_symbol: A0A2G9RZF1
taxon:
  id: NCBITaxon:8400
  label: Aquarana catesbeiana
status: COMPLETE
description: >-
  A0A2G9RZF1 is a single-CUB fragment from a fragmented Aquarana catesbeiana draft gene model. The
  ProtNLM2 single-fertilization prediction is refuted for the sequence supplied to the model, because
  that sequence lacks the S1 protease domain required for an ovochymase-like egg-envelope protease;
  extracellular-region localization remains plausible but unresolved for the exact short accession.
