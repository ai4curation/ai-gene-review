predictions:
  - source_method: ProtNLM2
    source_version: UniProt 2024_06 pilot
    predicted_term:
      id: GO:0007338
      label: single fertilization
    predicted_term_type: GO_BP
    review:
      assessment: NPI
      error_type: WRONG_INPUT_SEQUENCE
      confidence_score: 0
      summary: >-
        The target sequence is a 156-residue single-CUB ORF from the fragmented 2017 bullfrog assembly,
        not a complete CUB-only paralog whose subfamily should be read as independent evidence for loss
        of ovochymase activity. The existing curated review and its OpenScientist core-function audit found
        that adjacent KV928989 ORFs reconstruct a tolloid-like CUB-EGF-CUB-CUB-EGF-CUB region and that
        the 2024 chromosome-level assembly encodes complete BMP-1 and TLL1 metalloproteases, so this
        accession is best treated as a fragment of an extracellular tolloid-family protease. The fertilization
        prediction is still incorrect for the sequence supplied to ProtNLM2: the ovochymase audit shows
        the short accession lacks any S1 serine-protease domain and the His-Asp-Ser triad required for
        the egg-envelope protease activity underlying GO:0007338. This is therefore a gene-model/input-sequence
        failure rather than paralogous transfer to a genuine stand-alone CUB protein.
      supported_by:
        - reference_id: file:AQUCT/A0A2G9RZF1/A0A2G9RZF1-uniprot.txt
          supporting_text: >-
            ID   A0A2G9RZF1_AQUCT        Unreviewed;       156 AA. ... DR   InterPro; IPR000859; CUB_dom.
            ... DR   PANTHER; PTHR24251:SF37; CUB DOMAIN-CONTAINING PROTEIN; 1. ... FT   DOMAIN          31..147
            ... FT                   /note="CUB"
        - reference_id: PMID:8510165
          supporting_text: >-
            31 copies of an extracellular domain, here called CUB
        - reference_id: file:AQUCT/A0A2G9RZF1/A0A2G9RZF1-hypotheses/prediction-ovochymase-fertilization/openscientist.md
          supporting_text: >-
            with no serine protease domain whatsoever and no catalytic triad.
        - reference_id: file:AQUCT/A0A2G9RZF1/A0A2G9RZF1-hypotheses/core-function-1-go-0005201/openscientist.md
          supporting_text: >-
            The three fragmented ORFs on scaffold KV928989 (156 + 228 + 250 = 634 aa combined) represent
            portions of one of these ~1,000 aa genes, with the N-terminal protease domain and additional
            domains falling in assembly gaps.
        - reference_id: file:AQUCT/A0A2G9RZF1/A0A2G9RZF1-ai-review.yaml
          supporting_text: >-
            A0A2G9RZF1 is a gene prediction fragment from the fragmented draft genome assembly of Aquarana
            catesbeiana
  - source_method: ProtNLM2
    source_version: UniProt 2024_06 pilot
    predicted_term:
      id: GO:0005576
      label: extracellular region
    predicted_term_type: GO_CC
    review:
      assessment: UNC
      confidence_score: 1
      summary: >-
        The sequence contains a nearly complete CUB domain at residues 31-147, and the comparative analysis
        defining CUB domains places this module in extracellular proteins with diverse functions. The existing
        curated review also accepts extracellular region for the draft fragment because a CUB domain from
        a tolloid-family protease is expected to act extracellularly. The focused ovochymase audit nevertheless
        found no signal-peptide confirmation for the exact 156-residue UniProt entry, and the TrEMBL record
        has no FT SIGNAL feature. The broad extracellular-region prediction is therefore plausible and
        aligned with the main review's location inference, but still UNC for the exact short accession rather
        than confirmed from an experimentally supported mature product.
      supported_by:
        - reference_id: file:AQUCT/A0A2G9RZF1/A0A2G9RZF1-uniprot.txt
          supporting_text: >-
            ID   A0A2G9RZF1_AQUCT        Unreviewed;       156 AA. ... DR   InterPro; IPR000859; CUB_dom.
            ... DR   PANTHER; PTHR24251:SF37; CUB DOMAIN-CONTAINING PROTEIN; 1. ... FT   DOMAIN          31..147
            ... FT                   /note="CUB"
        - reference_id: PMID:8510165
          supporting_text: >-
            31 copies of an extracellular domain, here called CUB
        - reference_id: file:AQUCT/A0A2G9RZF1/A0A2G9RZF1-hypotheses/prediction-ovochymase-fertilization/openscientist.md
          supporting_text: >-
            an extracellular-region CC term could be a *lead* if a signal peptide is confirmed, but this
            was not tested and should not be asserted
        - reference_id: file:AQUCT/A0A2G9RZF1/A0A2G9RZF1-ai-review.yaml
          supporting_text: >-
            The fragment contains a single CUB domain (residues 31-147) that mediates protein-protein
            interactions in the extracellular space.
