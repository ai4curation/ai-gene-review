predictions:
  - source_method: ProtNLM2
    source_version: UniProt 2024_06 pilot
    predicted_term:
      id: GO:0007338
      label: single fertilization
    predicted_term_type: GO_BP
    review:
      assessment: NPI
      error_type: DOMAIN_ARCHITECTURE_MISMATCH
      confidence_score: 0
      summary: >-
        The target is a 156-residue fragment of bullfrog TLL1: residues 30-156 match the last 127 residues
        (CUB5) of the complete bullfrog TLL1 model at 126/127 identity, and identity to other tolloids
        follows the TLL1 orthogroup. The sequence supplied to ProtNLM2 carries only a CUB domain, with no S1
        serine-protease domain and no His-Asp-Ser triad, so it cannot support the ovochymase-like
        egg-envelope protease activity that underlies GO:0007338. The complete TLL1 gene product is an
        astacin-type metalloprotease that processes procollagen C-propeptides and cleaves chordin, not a
        fertilization protease, and the PTHR24251 family review finds that single fertilization is not a
        family-wide process. PubMed searches for tolloid-like proteins in fertilization and for bullfrog
        tolloids returned no supporting reports. The prediction is refuted for both the fragment and the
        gene.
      supported_by:
        - reference_id: file:AQUCT/A0A2G9RZF1/A0A2G9RZF1-uniprot.txt
          supporting_text: >-
            ID   A0A2G9RZF1_AQUCT        Unreviewed;       156 AA. ... DR   InterPro; IPR000859; CUB_dom.
            ... DR   PANTHER; PTHR24251:SF37; CUB DOMAIN-CONTAINING PROTEIN; 1. ... FT   DOMAIN          31..147
            ... FT                   /note="CUB"
        - reference_id: PMID:8510165
          supporting_text: >-
            31 copies of an extracellular domain, here called CUB
        - reference_id: file:AQUCT/A0A2G9RZF1/A0A2G9RZF1-hypotheses/prediction-ovochymase-fertilization/openscientist.md
          supporting_text: >-
            with no serine protease domain whatsoever and no catalytic triad.
        - reference_id: file:AQUCT/A0A2G9RZF1/A0A2G9RZF1-hypotheses/core-function-1-go-0005201/openscientist.md
          supporting_text: >-
            The three fragmented ORFs on scaffold KV928989 (156 + 228 + 250 = 634 aa combined) represent
