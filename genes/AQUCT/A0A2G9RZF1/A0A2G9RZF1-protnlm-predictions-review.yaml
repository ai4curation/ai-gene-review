            physiologically relevant site
  - source_method: ProtNLM2
    source_version: UniProt 2024_06 pilot
    predicted_term:
      id: GO:0005576
      label: extracellular region
    predicted_term_type: GO_CC
    review:
      assessment: NPI
      error_type: DOMAIN_ARCHITECTURE_MISMATCH
      confidence_score: 0
      summary: >-
        The sequence ProtNLM2 was given is a 156-residue fragment of bullfrog TLL1. Residues 30-156 are
        the C-terminal CUB5 domain, at 126/127 identity to the last 127 residues of the complete 1005-aa
        bullfrog TLL1 model, and residues 1-29 align to no tolloid model. The fragment lacks the TLL1
        N-terminal signal peptide, the feature that routes the complete product into the secretory
        pathway and so to the extracellular region. Its UniProt record has no signal-peptide or
        transmembrane feature, only the CUB domain at 31-147. Extracellular region is true of the
        complete TLL1 product (human TLL1 activity is measured in the extracellular medium of
        transfected cells, and PANTHER places the term at the tolloid node), but the product encoded by
        this accession has no secretion signal, so the location is not supported for this sequence. GOA
        has no annotation for this accession.
      supported_by:
