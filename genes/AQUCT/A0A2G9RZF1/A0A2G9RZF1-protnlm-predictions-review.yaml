        - reference_id: file:AQUCT/A0A2G9RZF1/A0A2G9RZF1-ai-review.yaml
          supporting_text: >-
            is a 156-residue fragmentary gene model from the 2017 draft genome of the American bullfrog
        - reference_id: file:AQUCT/A0A2G9RZF1/A0A2G9RZF1-bioinformatics/RESULTS.md
          supporting_text: >-
            A0A2G9RZF1 residues 30-156 are therefore the last 127 residues (CUB5) of
            bullfrog TLL1.
        - reference_id: PMID:10479448
          supporting_text: >-
