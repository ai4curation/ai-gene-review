id: A0A2G9RZF1
gene_symbol: A0A2G9RZF1
taxon:
  id: NCBITaxon:8400
  label: Aquarana catesbeiana
status: COMPLETE
description: >-
  A0A2G9RZF1 is a 156-residue fragmentary gene model from the 2017 Aquarana catesbeiana draft genome
  whose residues 30-156 are the C-terminal CUB5 domain of bullfrog tolloid-like protein 1 (TLL1), a
  secreted BMP-1/tolloid-family zinc metalloprotease. The ProtNLM2 single-fertilization prediction is
  refuted: neither the fragment nor the TLL1 gene it belongs to is an ovochymase-like egg-envelope
  serine protease. The extracellular-region prediction is true of the complete TLL1 product but not
  of this accession, which lacks the TLL1 signal peptide.
