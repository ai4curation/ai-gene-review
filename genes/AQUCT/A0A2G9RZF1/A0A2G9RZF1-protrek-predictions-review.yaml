      label: netrin receptor activity
    predicted_term_type: GO_MF
    review:
      assessment: NPI
      confidence_score: 0
      error_type: FREQUENCY_BIAS
      summary: >-
        Top-ranked hit (score 11.14). Netrin receptors are DCC/neogenin and UNC5 family
        transmembrane proteins; this fragment has no transmembrane segment and no
        immunoglobulin or fibronectin III repeats. The connection appears to run through
        neuronal guidance biology rather than through any structural feature. Assigning a
        receptor activity to what is almost certainly one domain of a secreted protease is
        wrong at every level.
      supported_by:
