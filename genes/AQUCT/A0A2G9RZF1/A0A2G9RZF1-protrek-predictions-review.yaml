id: A0A2G9RZF1
gene_symbol: A0A2G9RZF1
taxon:
  id: NCBITaxon:8400
  label: Aquarana catesbeiana
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for a 156-aa single-CUB-domain ORF that this review
  establishes is a gene-prediction fragment: the adjacent ORFs on the same draft scaffold
  reconstruct the C-terminal CUB-EGF region of a tolloid-family metalloprotease, and a
  later chromosome-level assembly resolves the complete BMP-1 and TLL1 genes. The right
  answer for this entry is therefore that no specific function can be assigned. ProTrek
  instead returns netrin receptor activity, Spemann organizer formation and dorsal
  convergence, and its Function channel returns the Xenopus dorsalising-factor
  description - all of which are downstream consequences of BMP-1/tolloid activity in
  amphibian embryos rather than functions of this fragment. The model is reading a real
  signal (CUB domains, chordin-processing biology) and reporting the pathway outcome
  instead of the enzyme, without any indication that the input is a fragment.
  Assessment: 0 correct (COR/CNN/LSP), 1 uncertain (UNC), 2 incorrect (NPI).
