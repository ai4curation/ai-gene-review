          supporting_text: CUB domain-containing protein
  - source_method: ProTrek
    source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
    source_reference_id: PMID:41039041
    predicted_term:
      id: GO:0060062
      label: Spemann organizer formation at the dorsal lip of the blastopore
    predicted_term_type: GO_BP
    review:
      assessment: UNC
      confidence_score: 1
      summary: >-
        Rank 2 (score 11.05). This is the most interesting call for this protein and the
        hardest to score. Tolloid/BMP-1 metalloproteases cleave chordin and so control
        BMP gradients at the Spemann organizer, and the full-length gene this fragment
        belongs to is a tolloid family member - so the retrieval has arguably reached the
        right biology by an indirect route. But it names an embryonic patterning event
        rather than the protein's activity, it is asserted for a 156-aa fragment that cannot
        perform it, and the model gives no sign of the intermediate reasoning. Recorded as
        uncertain: the right pathway, attached to the wrong object.
      supported_by:
        - reference_id: file:AQUCT/A0A2G9RZF1/A0A2G9RZF1-uniprot.txt
          supporting_text: CUB domain-containing protein
