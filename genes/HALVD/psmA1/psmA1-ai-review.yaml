id: Q9V2V6
gene_symbol: psmA1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:309800
  label: Haloferax volcanii DS2
description: >-
  PsmA1 (alpha1, HVO_1091) is the major alpha-type subunit of the 20S proteasome core
  particle of the halophilic archaeon Haloferax volcanii. It is a non-catalytic member
  of the peptidase T1A (Ntn-hydrolase) family: seven alpha1 subunits form each outer
  ring of the four-ring barrel, while the inner rings are formed by the beta subunit
  (PsmB), whose N-terminal threonine carries the proteolytic active sites. Alpha1 and
  beta alone assemble into an active, salt-dependent alpha1-beta proteasome with
  chymotrypsin-like peptidase activity that can also degrade unfolded protein
  substrates; with the second alpha-type subunit (alpha2, PsmC) alpha1 also forms an
  asymmetric alpha1-alpha2-beta proteasome. The alpha1 N terminus forms the gate that
  restricts substrate entry into the catalytic chamber, which in archaea is opened by
  the PAN AAA+ ATPases. Alpha1 is abundant throughout growth and is
  N-terminally acetylated and phosphorylated. Cells lacking alpha1 are viable but
  sensitive to hypo-osmotic and thermal stress, whereas loss of both alpha1 and alpha2
  is lethal. The proteasome is cytoplasmic and degrades proteins in vivo; H. volcanii
  lacks ubiquitin, and the ubiquitin-like SAMP proteins have been linked to
  proteasomal degradation.
existing_annotations:
- term:
    id: GO:0004175
    label: endopeptidase activity
  evidence_type: IDA
  original_reference_id: PMID:10482525
  qualifier: enables
  review:
    summary: Wilson et al. (1999) purified the alpha1-beta 20S proteasome and measured
      peptide- and protein-hydrolyzing (endopeptidase) activity of the complex. The
      catalytic nucleophile is the N-terminal threonine of the beta subunit, exposed
      by propeptide removal; alpha1 is a non-catalytic outer-ring subunit.
    action: MODIFY
    reason: The experimental finding (endopeptidase activity of the alpha1-containing
      core particle) is sound and is not disputed. But the row asserts that alpha1
      itself enables endopeptidase activity, and the same abstract places catalysis
      on the beta subunit's N-terminal threonine. Alpha1 has no catalytic threonine.
      Its contribution to the activity is the GO contributes_to relationship, which
      is recorded in core_functions. The activity alpha1 itself enables is structural,
      so the replacement is GO:0140756 structural constituent of proteasome, as in
      this repository's human PSMA1 review.
    proposed_replacement_terms:
    - id: GO:0140756
      label: structural constituent of proteasome
    supported_by:
    - reference_id: PMID:10482525
      supporting_text: A 20S proteasome, composed of alpha(1) and beta subunits arranged
        in a barrel-shaped structure of four stacked rings, was purified from a halophilic
        archaeon Haloferax volcanii.
    - reference_id: PMID:10482525
      supporting_text: Comparison of the beta-subunit protein sequence with the sequence
        deduced from the gene revealed that a 49-residue propeptide is removed to expose
        a highly conserved N-terminal threonine which is proposed to serve as the catalytic
        nucleophile
