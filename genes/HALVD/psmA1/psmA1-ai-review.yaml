- id: PMID:18931121
  title: Proteasomal components required for cell growth and stress responses in
    the haloarchaeon Haloferax volcanii.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract only in cache. Systematic knockouts of proteasome genes;
      psmA (alpha1) dispensable alone but alpha1 plus alpha2 depletion lethal.
  findings:
