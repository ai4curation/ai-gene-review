- id: PMID:10482525
  title: 'Halophilic 20S proteasomes of the archaeon Haloferax volcanii: purification,
    characterization, and gene sequence analysis.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified (Wilson, Aldrich and Maupin-Furlow 1999, J Bacteriol,
      H. volcanii). Abstract only in cache. Purification of the alpha1-beta 20S proteasome;
      beta N-terminal Thr assigned as nucleophile.
  findings:
  - statement: Alpha1 and beta form a four-ring 20S proteasome that hydrolyzes peptides
      and insulin B-chain; catalysis is assigned to the beta N-terminal threonine.
    supporting_text: The alpha(1)beta-proteasome also hydrolyzed insulin B-chain protein.
