core_functions:
- description: >-
    Alpha1 forms the heptameric outer rings of the 20S proteasome core particle,
    either as symmetric alpha1-beta particles or as one end of asymmetric
    alpha1-alpha2-beta particles. It acts as the structural scaffold and N-terminal
    gate of the core particle and contributes to the threonine-type endopeptidase
    activity, whose catalytic sites lie on the beta subunit, in cytoplasmic proteasomal
    protein degradation.
  molecular_function:
    id: GO:0140756
    label: structural constituent of proteasome
  contributes_to_molecular_function:
    id: GO:0004298
    label: threonine-type endopeptidase activity
  directly_involved_in:
  - id: GO:0010498
    label: proteasomal protein catabolic process
  locations:
  - id: GO:0005737
    label: cytoplasm
  in_complex:
    id: GO:0019773
    label: proteasome core complex, alpha-subunit complex
  supported_by:
  - reference_id: PMID:10482525
    supporting_text: A 20S proteasome, composed of alpha(1) and beta subunits arranged
      in a barrel-shaped structure of four stacked rings, was purified from a halophilic
      archaeon Haloferax volcanii.
  - reference_id: PMID:12486053
    supporting_text: The alpha1 and beta proteins alone form active 20S proteasomes
  - reference_id: PMID:19376868
    supporting_text: unregulated opening of the CP "gate" impairs the ability of cells
      to overcome salt stress
