- id: PMID:19376868
  title: The N-terminal penultimate residue of 20S proteasome alpha1 influences its
    N(alpha) acetylation and protein levels as well as growth rate and stress responses
    of Haloferax volcanii.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: N-alpha acetylation of alpha1 and gate deletion; mostly about a PTM
      of the subunit, but gate-deletion data show alpha1 N terminus restricts CP peptidase
      activity.
  findings:
  - statement: The alpha1 N terminus forms the core particle gate, and its acetylated
      Met1 form dominates in cells.
    supporting_text: Quantitative mass spectrometry revealed this was the dominant
      N-terminal form of alpha1 in H. volcanii cells.
