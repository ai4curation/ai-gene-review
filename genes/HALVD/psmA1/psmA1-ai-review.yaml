suggested_questions:
- question: Should the InterPro2GO mappings of IPR019982 (archaeal proteasome alpha
    subunit) to GO:0004298 threonine-type endopeptidase activity (enables) be dropped
    or converted to contributes_to, given that alpha subunits lack the catalytic
    N-terminal threonine?
- question: Should the InterPro2GO mapping of IPR000426 (proteasome alpha N-terminal
    domain) to GO:0006511 ubiquitin-dependent protein catabolic process be restricted
    to Eukaryota, given that archaea lack ubiquitin?
- question: Does SAMP conjugation directly target substrates to the PAN-20S proteasome
    in H. volcanii, which would make a modification-dependent protein catabolic process
    term appropriate for archaeal proteasome subunits?
suggested_experiments:
- description: Reconstitute PAN-A with alpha1-beta core particles and purified SAMP1
    conjugates in vitro to test whether SAMPylation is sufficient to target a substrate
    for ATP-dependent degradation.
  experiment_type: in vitro reconstitution
- description: Compare substrate degradation by symmetric alpha1-beta and asymmetric
    alpha1-alpha2-beta core particles, with and without PAN-A or PAN-B, to test whether
    the alpha-ring composition determines activator docking or substrate selection.
  experiment_type: biochemical assay
