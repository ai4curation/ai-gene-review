- id: PMID:20054389
  title: Ubiquitin-like small archaeal modifier proteins (SAMPs) in Haloferax volcanii.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text in cache. SAMP1 conjugates accumulate in panA psmA mutants;
      indirect link between SAMPylation and proteasomal degradation. Whether alpha1
      itself is SAMPylated could not be verified from the cached text.
  findings:
  - statement: SAMP1 conjugate levels rise in strains lacking PAN-A and alpha1.
    supporting_text: The enhanced levels of SAMP1-conjugates in the ΔpanA ΔpsmA mutant
