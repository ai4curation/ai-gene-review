- term:
    id: GO:0006511
    label: ubiquitin-dependent protein catabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR000426
  review:
    summary: InterPro2GO mapping from IPR000426 (Proteasome alpha-subunit, N-terminal
      domain) to ubiquitin-dependent protein catabolic process.
    action: REMOVE
    reason: GO:0006511 is defined as protein catabolism initiated by covalent attachment
      of ubiquitin. H. volcanii, like other archaea, has no ubiquitin and no 26S proteasome
      ubiquitin receptors. Its 20S core is capped by PAN ATPases, and the only protein
      modifiers linked to proteasomal degradation are the ubiquitin-like SAMPs. Even
      that link is indirect (SAMP1 conjugates accumulate in a panA psmA mutant), so
      no modification-dependent process term is substituted. This is a taxon-blind InterPro2GO
      mapping. QuickGO shows about 888 archaeal GO:0006511 rows made through IPR000426,
      out of 910 archaeal rows in total. The mapping should be restricted to Eukaryota.
    supported_by:
    - reference_id: PMID:20054389
      supporting_text: The enhanced levels of SAMP1-conjugates in the ΔpanA ΔpsmA mutant
        suggest SAMP1 targets proteins for destruction by proteasomes.
