id: D4GXZ3
gene_symbol: mvaD
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:309800
  label: Haloferax volcanii DS2
description: >-
  mvaD (HVO_1412; UniProt D4GXZ3) encodes phosphomevalonate decarboxylase (PMD, also called
  mevalonate 5-phosphate decarboxylase), a 324-residue GHMP-superfamily enzyme of the
  haloarchaeal alternate mevalonate pathway. It catalyses the ATP-dependent decarboxylation of
  (R)-mevalonate 5-phosphate to isopentenyl phosphate, ADP, CO2 and phosphate; isopentenyl
  phosphate kinase (HVO_2762) then phosphorylates isopentenyl phosphate to isopentenyl
  diphosphate. The recombinant enzyme has a Km of 75 uM for (R)-mevalonate 5-phosphate and 289
  uM for ATP, a kcat of 3.5 per second and a pH optimum near 7.5. It is strongly inhibited by
  6-fluoromevalonate 5-phosphate but hardly by 6-fluoromevalonate 5-diphosphate, the inhibitor
  of classical diphosphomevalonate decarboxylases, which shows a preference for the
  monophosphorylated substrate. The enzyme is homologous to diphosphomevalonate decarboxylase
  and, like it, is thought to phosphorylate the 3-hydroxyl of its substrate with ATP and then
  eliminate that phosphate with the C1 carboxylate. Haloarchaea lack phosphomevalonate kinase,
  so this decarboxylase and isopentenyl phosphate kinase together replace the last two steps of
  the classical pathway and supply the isoprenoid units of archaeal ether lipids. Closely
  related decarboxylases of the same type occur in Chloroflexi bacteria such as Roseiflexus
  castenholzii.
existing_annotations:
- term:
    id: GO:0008299
    label: isoprenoid biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR005935
  review:
    summary: >-
      InterPro2GO mapping from the mevalonate-pathway decarboxylase family IPR005935. The
      H. volcanii enzyme produces isopentenyl phosphate, the precursor of isopentenyl
      diphosphate, which supplies the isoprenoid chains of archaeal lipids.
    action: ACCEPT
    reason: >-
      True and reasonably informative pathway-level process for a mevalonate-pathway enzyme.
      Every member of IPR005935 that has been characterised (diphosphomevalonate, phosphomevalonate
      and bisphosphomevalonate decarboxylases) acts in isoprenoid precursor synthesis, so the
      family-level mapping is sound for this protein. The more specific process,
      GO:0019287 (isopentenyl diphosphate biosynthesis via mevalonate), is added below as a NEW
      row from the gene's own biochemistry; this broader row is kept as accurate context, as in
      the sibling reviews of yeast ERG19 and human MVD.
    supported_by:
    - reference_id: PMID:24375100
      supporting_text: >-
        Mevalonate (MVA) metabolism provides the isoprenoids used in archaeal lipid biosynthesis.
      reference_section_type: ABSTRACT
    - reference_id: file:HALVD/mvaD/mvaD-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: >-
        Functions in an alternate mevalonate (MVA) pathway leading to isopentenyl diphosphate
        (IPP), a key precursor for the biosynthesis of isoprenoid compounds such as archaeal
        membrane lipids.
- term:
    id: GO:0016831
    label: carboxy-lyase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR005935
  review:
    summary: >-
      InterPro2GO mapping from IPR005935 to the generic carboxy-lyase parent. The enzyme is a
      carboxy-lyase (EC 4.1.1.99), so the claim is true.
    action: TOO_GENERAL
    reason: >-
      The term is correct but says only that the protein removes a carboxyl group from something.
      It is entailed by the accepted GO:0090710 phosphomevalonate decarboxylase activity in this
      review, which names the reaction. MODIFY is not appropriate because this row's own
      evidence, the IPR005935 family signature, stops at the general term: that family contains
      diphosphomevalonate decarboxylases (GO:0004163), phosphomevalonate decarboxylases
      (GO:0090710) and the ATP-independent mevalonate 3,5-bisphosphate decarboxylases of the
      Thermoplasmatales, so membership alone cannot select the reaction.
    supported_by:
    - reference_id: file:HALVD/mvaD/mvaD-uniprot.txt
      record_section: ["CC:CATALYTIC ACTIVITY"]
      supporting_text: >-
        Reaction=(R)-5-phosphomevalonate + ATP = isopentenyl phosphate + ADP + CO2 + phosphate;
    - reference_id: PMID:38674651
      supporting_text: >-
        As for homologous GHMP family decarboxylases, haloarchaea-type phosphomevalonate
        decarboxylase (PMD) and eukaryote-type diphosphomevalonate decarboxylase (DMD) are often
        misannotated in the automated annotation workflow
- term:
    id: GO:0090710
    label: phosphomevalonate decarboxylase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - RHEA:40955
  - EC:4.1.1.99
  review:
    summary: >-
      EC/Rhea-based electronic annotation (EC 4.1.1.99, RHEA:40955) to phosphomevalonate
      decarboxylase activity. This is the activity demonstrated for the purified recombinant
      H. volcanii HVO_1412 protein, which converts (R)-mevalonate 5-phosphate and ATP to
      isopentenyl phosphate.
    action: ACCEPT
    reason: >-
      Core molecular function, directly demonstrated for this protein (PMID:24375100), which was
      the first phosphomevalonate decarboxylase characterised from an archaeon. The GO
      definition (R)-5-phosphomevalonate + ATP = ADP + CO2 + isopentenyl phosphate + phosphate
      matches the reaction and its ATP dependence (Km for ATP 289 uM). The enzyme's substrate
      preference for the monophosphate was confirmed by its strong inhibition by
      6-fluoromevalonate 5-phosphate and weak inhibition by the diphosphate analogue, which
      distinguishes it from classical diphosphomevalonate decarboxylases (GO:0004163). Note that
      the cached copy of PMID:24375100 is abstract-only; the kinetic values come from the
      curated UniProt record, which cites that paper with experimental evidence.
    supported_by:
    - reference_id: PMID:24375100
      supporting_text: >-
        It catalyzes the synthesis of isopentenyl phosphate from mevalonate monophosphate, a
        reaction that has been proposed but never demonstrated by direct experimental proof,
        which is provided in this account.
      reference_section_type: ABSTRACT
    - reference_id: PMID:24375100
      supporting_text: >-
        This enzyme, phosphomevalonate decarboxylase (PMD), exhibits strong inhibition by
        6-fluoromevalonate monophosphate but negligible inhibition by 6-fluoromevalonate
        diphosphate (a potent inhibitor of the classical mevalonate pathway), reinforcing its
        selectivity for monophosphorylated ligands.
      reference_section_type: ABSTRACT
    - reference_id: file:HALVD/mvaD/mvaD-uniprot.txt
      record_section: ["CC:BIOPHYSICOCHEMICAL PROPERTIES"]
      supporting_text: KM=289 uM for ATP {ECO:0000269|PubMed:24375100};
- term:
    id: GO:0019287
    label: isopentenyl diphosphate biosynthetic process, mevalonate pathway
  evidence_type: IDA
  original_reference_id: PMID:24375100
  qualifier: involved_in
  review:
    summary: >-
      Proposed new annotation. HVO_1412 catalyses the decarboxylation of mevalonate 5-phosphate
      to isopentenyl phosphate, one of the two terminal reactions (with isopentenyl phosphate
      kinase HVO_2762) of the H. volcanii route from mevalonate to isopentenyl diphosphate.
    action: NEW
    reason: >-
      GO:0019287 is defined as isopentenyl diphosphate formation via the intermediate
      mevalonate, so it covers the haloarchaeal alternate route as well as the classical one.
      Participation test: the protein itself catalyses a step of the process (mevalonate
      5-phosphate to isopentenyl phosphate), so it does part of the work and is not merely
      required for it. Comparator check: enzymes in the same role carry this term, including
      the classical diphosphomevalonate decarboxylases (S. cerevisiae ERG19, human MVD) and
      T. acidophilum mevalonate 3-kinase Ta1305 (Q9HIN1, IDA by UniProt from PMID:24914732),
      a variant-pathway enzyme. The GOA record for this protein carries only the broader
      GO:0008299, and the reaction belongs to this process.
    supported_by:
    - reference_id: PMID:24375100
      supporting_text: >-
        These observations represent the first experimental demonstration in H. volcanii of both
        the phosphomevalonate decarboxylase and isopentenyl phosphate kinase reactions that are
        required for an alternate mevalonate pathway in an archaeon.
      reference_section_type: ABSTRACT
    - reference_id: PMID:24327557
      supporting_text: >-
        Phylogenetic analyses demonstrate that MDDs from the Chloroflexi are distant from those
        of other bacteria but similar to those of the two archaeal classes that also encode an
        IPK but no PMK, the Haloarchaea and Thermoplasmata classes.
