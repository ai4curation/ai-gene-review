suggested_questions:
- question: >-
    Is HVO_1412 the only route from mevalonate 5-phosphate to isopentenyl phosphate in
    H. volcanii, or can the cell bypass it (for example through a classical diphosphomevalonate
    route or an Aeropyrum-type dehydratase/decarboxylase pair)?
- question: >-
    Does HvMPD release a 3-phospho-mevalonate 5-phosphate intermediate, as the R. castenholzii
    enzyme can accept mevalonate 3,5-bisphosphate, or are phosphorylation and decarboxylation
    strictly coupled?
suggested_experiments:
- hypothesis: mvaD is required in vivo for isoprenoid lipid synthesis in H. volcanii.
  description: >-
    Construct a pyrE2-based mvaD deletion (or a tryptophan-inducible conditional allele, since
    the gene may be essential) in H. volcanii and test growth, archaeol lipid content and
    complementation by plasmid-borne mvaD or by a heterologous diphosphomevalonate decarboxylase
    plus phosphomevalonate kinase.
  experiment_type: genetic knockout and complementation
