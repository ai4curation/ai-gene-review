      Recombinant HVO_1412 decarboxylates mevalonate 5-phosphate to isopentenyl phosphate in an
      ATP-dependent reaction and prefers the monophosphorylated substrate, as shown by
      fluoromevalonate-analogue inhibition.
    supporting_text: >-
      The second enzyme exhibits a decarboxylase activity that has never been directly
      attributed to this protein or any homologous protein.
