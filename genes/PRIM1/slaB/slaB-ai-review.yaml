- term:
    id: GO:1902777
    label: 6-sulfoquinovose(1-) catabolic process
  evidence_type: IDA
  original_reference_id: PMID:33036753
  qualifier: involved_in
  review:
    summary: SlaB catalyzes the terminal SLA oxidation step of SQ breakdown in B. megaterium.
    action: NEW
    reason: >-
      SlaB performs a step of SQ catabolism itself (it converts the SQ-derived C3 sulfonate SLA to
      the excreted product SL), so it does some of the work of the process rather than being a
      substrate or a requirement. Comparator check: the analogous terminal SLA reductase YihU of
      the E. coli sulfo-EMP route carries GO:1902777, as do the other E. coli sulfoglycolysis
      enzymes. GO:0061722 sulphoglycolysis is not used because its definition requires DHAP and
      pyruvate as products, whereas the sulfo-TAL route yields fructose 6-phosphate.
    supported_by:
    - reference_id: file:PRIM1/slaB/slaB-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: Part of the sulfo-TAL (or sulfo-SFT) pathway, a D-sulfoquinovose degradation
        pathway that produces sulfolactate (SL)
    - reference_id: PMID:41676062
      supporting_text: it can be oxidized to SL by sulfolactaldehyde dehydrogenase SlaB in aerobic
        Bacillus strains
