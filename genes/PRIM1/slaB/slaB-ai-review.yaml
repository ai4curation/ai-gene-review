proposed_new_terms:
- proposed_name: 3-sulfolactaldehyde dehydrogenase (NAD+) activity
  proposed_definition: 'Catalysis of the reaction: (2S)-3-sulfolactaldehyde + NAD+ + H2O = (2S)-3-sulfolactate
    + NADH + 2 H+.'
  justification: >-
    EC 1.2.1.97 and RHEA:47932 describe this reaction, which is catalyzed by the SLA
    dehydrogenases of the sulfo-ED and sulfo-TAL sulfoquinovose degradation routes, but GO has no
    term for it (OLS search for "sulfolactaldehyde dehydrogenase" and "1.2.1.97" on 2026-11-10
    returned no GO class); only the parent GO:0004029 can currently be used.
  proposed_parent:
    id: GO:0004029
    label: aldehyde dehydrogenase (NAD+) activity
  supported_by:
  - reference_id: file:PRIM1/slaB/slaB-uniprot.txt
    record_section: ["CC:CATALYTIC ACTIVITY"]
    supporting_text: Reaction=(2S)-3-sulfolactaldehyde + NAD(+) + H2O = (2S)-3-sulfolactate + NADH
      + 2 H(+); Xref=Rhea:RHEA:47932
suggested_questions:
- question: >-
    Is B. megaterium SlaB specific for 3-sulfolactaldehyde, or does it, like B. aryabhattai SftD,
    also oxidize glyceraldehyde 3-phosphate, and could that compete with the transaldolase for its
    GAP acceptor in vivo?
suggested_experiments:
- description: >-
    Steady-state kinetics of purified SlaB with enzymatically prepared (2S)-SLA, D-glyceraldehyde
    3-phosphate, erythrose 4-phosphate and (S)-lactaldehyde, with NAD+ versus NADP+, to establish
    substrate and cofactor specificity.
