  review:
    summary: TreeGrafter transfers an archaeal lactaldehyde dehydrogenase function to an SLA
      dehydrogenase.
    action: MODIFY
    reason: >-
      GO:0008911 is defined by the (S)-lactaldehyde to (S)-lactate reaction. In PTHR42991 the only
      PAINT IBD for this term is at PTN008677383, whose sole seed is the Methanocaldococcus
      jannaschii lactaldehyde dehydrogenase MJ1411 (Q58806, F420 biosynthesis); the TreeGrafter row
      cites PTN008677393 within the same subfamily. No lactaldehyde activity has been reported for
      SlaB, whose characterized substrate is the sulfonated analogue 3-sulfolactaldehyde. The genus
      of the claim (NAD+-dependent aldehyde oxidation) is right and the substrate is wrong, so the
      row is corrected laterally to the parent GO:0004029, which the gene already carries from Rhea.
    supported_by:
    - reference_id: file:interpro/panther/PTHR42991/PTHR42991-paint.tsv
      supporting_text: "PTHR42991\tPTN008677383\tGO:0008911\tF\tIBD\tfalse\tUniProtKB:Q58806"
