  review:
    summary: SlaB oxidizes the aldehyde 3-sulfolactaldehyde to the carboxylate sulfolactate with NAD+.
    action: ACCEPT
    reason: >-
      The Rhea2GO mapping is correct. RHEA:47932 ((2S)-3-sulfolactaldehyde + NAD+ + H2O =
      (2S)-3-sulfolactate + NADH + 2 H+) is an instance of the GO:0004029 definition ("an aldehyde
      + H2O + NAD+ = a carboxylate + 2 H+ + NADH"), and UniProt records this reaction for SlaB with
      experimental evidence from PMID:33036753 (abstract-only in our cache; the curated record is
      the accessible statement of that result). GO has no SLA-specific term, so this is the most
      specific existing term for the core activity; a specific term is proposed below.
    supported_by:
