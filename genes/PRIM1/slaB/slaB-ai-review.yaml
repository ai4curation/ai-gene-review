taxon:
  id: NCBITaxon:545693
  label: Priestia megaterium QM B1551
description: >-
  SlaB (BMQ_3643) is the NAD+-dependent 3-sulfolactaldehyde (SLA) dehydrogenase of the
  transaldolase-dependent sulfoglycolytic (sulfo-TAL or sulfo-SFT) pathway of Bacillus
  (Priestia) megaterium. It is encoded in the sulfoquinovose (SQ) catabolic gene cluster with
  the SQ isomerase SqvD and the sulfofructose transaldolase SqvA, and oxidizes the
  (2S)-3-sulfolactaldehyde released by SqvA to (2S)-3-sulfolactate (RHEA:47932, EC 1.2.1.97),
  which the aerobic bacterium excretes, while the non-sulfonated carbon of SQ enters central
  metabolism as fructose 6-phosphate. SlaB is a soluble member of the aldehyde dehydrogenase
  superfamily (Pfam PF00171; PANTHER PTHR42991 subfamily SF1), a functionally mixed clade that also
  contains non-phosphorylating glyceraldehyde-3-phosphate dehydrogenases, archaeal lactaldehyde
  dehydrogenases and sulfoacetaldehyde dehydrogenases.
