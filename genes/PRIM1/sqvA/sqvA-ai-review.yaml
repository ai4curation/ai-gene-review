      6-phosphate + (2S)-3-sulfolactaldehyde;
suggested_questions:
- question: >-
    Does SqvA, like its B. aryabhattai ortholog SftT, also act as a sedoheptulose 7-phosphate
    transaldolase, and does it contribute to the pentose phosphate pathway alongside the
    housekeeping transaldolase?
suggested_experiments:
- description: >-
    Site-directed mutagenesis of the Arg-Trp-Arg sulfonate recognition triad, with kinetics on SF
    versus fructose 6-phosphate and sedoheptulose 7-phosphate donors, to test how sulfonate
    recognition determines donor specificity.
