  label: Priestia megaterium QM B1551
description: >-
  SqvA (BMQ_3648) is the 6-deoxy-6-sulfo-D-fructose transaldolase (sulfofructose transaldolase,
  SF-TAL; EC 2.2.1.14), the signature enzyme of the transaldolase-dependent sulfoglycolytic
  (sulfo-TAL or sulfo-SFT) pathway of Bacillus (Priestia) megaterium. It transfers the
  dihydroxyacetone (glycerone) unit of 6-deoxy-6-sulfo-D-fructose, produced from sulfoquinovose by
  the isomerase SqvD, to D-glyceraldehyde 3-phosphate, forming D-fructose 6-phosphate and
  (2S)-3-sulfolactaldehyde (RHEA:66716); erythrose 4-phosphate can serve as acceptor, giving
  sedoheptulose 7-phosphate (RHEA:66920). The sulfolactaldehyde is then oxidized to sulfolactate
  by SlaB. SqvA is a class I (Schiff-base) transaldolase of the PANTHER PTHR10683 family
  (subfamily SF40) that forms a homodecamer of two pentameric rings; its cryo-EM structure shows a
  covalent Schiff-base intermediate of SF with Lys89 in an Asp-Lys-Glu catalytic triad and an
  Arg-Trp-Arg triad that recognizes the sulfonate.
