proposed_new_terms:
- proposed_name: 6-deoxy-6-sulfo-D-fructose transaldolase activity
  proposed_definition: 'Catalysis of the reaction: 6-deoxy-6-sulfo-D-fructose + D-glyceraldehyde 3-phosphate
    = D-fructose 6-phosphate + (2S)-3-sulfolactaldehyde. D-erythrose 4-phosphate can also act as acceptor,
    forming D-sedoheptulose 7-phosphate.'
  justification: >-
    EC 2.2.1.14 with RHEA:66716 and RHEA:66920 describes the signature reaction of the sulfo-SFT
    pathway, but GO has no corresponding term (OLS searches for "sulfofructose transaldolase",
    "6-deoxy-6-sulfo-D-fructose" and "2.2.1.14" on 2026-11-10 found only GO:0061593). GO:0004801
    transaldolase activity is defined by the sedoheptulose 7-phosphate donor and does not cover it.
  proposed_parent:
    id: GO:0016744
    label: transketolase or transaldolase activity
