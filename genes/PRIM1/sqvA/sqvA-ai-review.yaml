    summary: SqvA catalyzes the C-C cleavage step of SQ breakdown in B. megaterium.
    action: NEW
    reason: >-
      SqvA performs the sulfosugar-cleaving step of SQ catabolism itself. Comparator check: the
      E. coli sulfo-EMP C-C cleavage enzyme YihT (SFP aldolase) carries GO:1902777. GO:0061722
