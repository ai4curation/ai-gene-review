  review:
    summary: Generic carbohydrate metabolism; the actual process is sulfoquinovose catabolism.
    action: MODIFY
    reason: >-
      The TAL/FSA family mapping (IPR001585) is true in a broad sense (SqvA cleaves a sulfosugar and
      forms fructose 6-phosphate), but the characterized role is sulfoquinovose breakdown.
      GO:1902777 6-sulfoquinovose(1-) catabolic process is the informative term; GO places it under
      carbohydrate derivative catabolism, so this is a replacement rather than a strict descendant.
    supported_by:
    - reference_id: PMID:33036753
      supporting_text: in which sulfosugar cleavage is catalyzed by the transaldolase SqvA, which converts
        6-deoxy-6-sulfofructose and glyceraldehyde 3-phosphate into fructose -6-phosphate and (S)-sulfolactaldehyde.
    proposed_replacement_terms:
    - id: GO:1902777
      label: 6-sulfoquinovose(1-) catabolic process
- term:
    id: GO:0016832
    label: aldehyde-lyase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR033919
  review:
    summary: SqvA is a group-transfer transaldolase, not an acceptor-independent aldolase.
    action: MODIFY
    reason: >-
      IPR033919 (TSA/FSA archaeal/bacterial) covers both acceptor-independent fructose-6-phosphate
      aldolases, for which aldehyde-lyase activity is right, and transaldolases. SqvA transfers the
      dihydroxyacetone unit of SF to an aldose phosphate acceptor (EC 2.2.1.14, a transferase), and
      the B. aryabhattai ortholog needs GAP or E4P to cleave SF at all. The essence (Schiff-base C-C
      cleavage of a ketose) is sound but the activity class is wrong, so the row is corrected
      laterally to GO:0016744 transketolase or transaldolase activity ("Catalysis of the transfer of
      an aldehyde or ketonic group from one compound (donor) to another (acceptor)"). GO has no
      term for EC 2.2.1.14 (OLS, 2026-11-10); a specific term is proposed.
    supported_by:
    - reference_id: file:PRIM1/sqvA/sqvA-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: Catalyzes the conversion of 6-deoxy-6-sulfo-D-fructose (SF) and glyceraldehyde
        3-phosphate (GAP) into fructose-6-phosphate (F6P) and 3-sulfolactaldehyde (SLA)
    - reference_id: PMID:36805128
      supporting_text: the namesake enzyme catalyzes the transaldol reaction of SF transferring dihydroxyacetone
        to 3C/4C acceptors to give sulfolactaldehyde and fructose-6-phosphate or sedoheptulose-7-phosphate.
    proposed_replacement_terms:
    - id: GO:0016744
      label: transketolase or transaldolase activity
- term:
    id: GO:0016744
    label: transketolase or transaldolase activity
  evidence_type: IDA
  original_reference_id: PMID:36805128
  qualifier: enables
  review:
    summary: SqvA transfers the dihydroxyacetone unit of sulfofructose to GAP or E4P.
    action: NEW
    reason: >-
      Purified SqvA catalyzes the SF transaldol reaction with GAP or E4P acceptors and forms the
      covalent Schiff-base intermediate with SF (PMID:36805128; also PMID:33036753). This is the
      core activity; GO:0016744 is the most specific existing term because GO:0004801
      transaldolase activity is defined by the sedoheptulose 7-phosphate + GAP reaction and no term
      exists for EC 2.2.1.14. A specific child term is proposed below.
    supported_by:
    - reference_id: PMID:36805128
      supporting_text: the namesake enzyme catalyzes the transaldol reaction of SF transferring dihydroxyacetone
        to 3C/4C acceptors to give sulfolactaldehyde and fructose-6-phosphate or sedoheptulose-7-phosphate.
    - reference_id: PMID:36805128
      supporting_text: We demonstrate a covalent "Schiff base" intermediate formed by reaction of SF with
