suggested_questions:
- question: >-
    How does an L-fucose isomerase-fold enzyme achieve selectivity for the C6-sulfonate of SQ, and
    does SqvD, like its ortholog SftI, also interconvert fructose 6-phosphate and glucose
    6-phosphate?
suggested_experiments:
- description: >-
    Kinetic characterization of purified SqvD with SQ (alpha and beta anomers), glucose
    6-phosphate/fructose 6-phosphate and L-fucose, plus a crystal structure with SF, to define its
    sulfonate-recognition residues and substrate range.
