  review:
    summary: Fold-based transfer of the L-fucose isomerase activity to an SQ isomerase.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      GO:0008736 is defined as L-fucose = L-fuculose. SqvD shares the L-fucose isomerase fold, but
      its demonstrated activity is SQ to SF isomerization, and no L-fucose activity has been
      reported. Its ortholog SftI is somewhat promiscuous (it also isomerizes fructose 6-phosphate),
      so an in vitro fucose activity cannot be excluded, but the claim is untested and not the
      enzyme's function.
    supported_by:
