    label: fucose metabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR015888
  review:
    summary: Fold-based mapping; SqvD acts in sulfoquinovose, not fucose, metabolism.
    action: REMOVE
    reason: >-
      IPR015888 (fucose isomerase C-terminal domain) marks the shared L-fucose isomerase fold, not
      fucose metabolism. SqvD is encoded in an SQ catabolic cluster and its characterized substrate
      is SQ; nothing links it to fucose utilization. The PTHR36120 family and NCBIfam NF048012
      classify it as an SQ isomerase. This is an over-propagated domain-to-process mapping.
    supported_by:
    - reference_id: file:PRIM1/sqvD/sqvD-uniprot.txt
      record_section: ["DR:NCBIfam"]
      supporting_text: NCBIfam; NF048012; SlpQosIsomSftI; 1.
