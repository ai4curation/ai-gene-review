  label: Priestia megaterium QM B1551
description: >-
  SqvD (BMQ_3645) is the sulfoquinovose (SQ) isomerase of the transaldolase-dependent
  sulfoglycolytic (sulfo-TAL or sulfo-SFT) pathway of Bacillus (Priestia) megaterium. It
  isomerizes 6-sulfo-beta-D-quinovose to 6-deoxy-6-sulfo-D-fructose (RHEA:40439, EC 5.3.1.31),
  supplying the donor substrate of the sulfofructose transaldolase SqvA encoded in the same gene
  cluster. SqvD is a soluble enzyme with the L-fucose isomerase-like fold (Pfam Fuc_iso_N and
  Fucose_iso_C) and belongs to the PANTHER PTHR36120 family; it is unrelated in sequence to the
  E. coli sulfo-EMP SQ isomerase YihS (an N-acylglucosamine 2-epimerase-fold protein), and SqvD
  orthologs serve as the SQ isomerase of the sulfo-TAL, sulfo-TK and sulfo-EMP2 routes.
