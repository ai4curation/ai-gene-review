taxon:
  id: NCBITaxon:367830
  label: Staphylococcus aureus subsp. aureus USA300
description: KtrA (also called TrkA; SAUSA300_0988) is the cytoplasmic gating component of the Staphylococcus
  aureus USA300 Ktr potassium uptake system. Its RCK domains regulate the membrane transport machinery,
  and the RCK_C domain directly binds cyclic di-AMP. This nucleotide-dependent gating helps tune potassium
  uptake to ionic and osmotic conditions. KtrA is a regulator of the conducting subunit rather than the
  membrane pore itself.
