  review:
    summary: CpaA regulates its own antiporter through an RCK domain rather than serving as a potassium-channel
      gating subunit.
    action: MODIFY
    reason: The shared RCK-domain rule does not distinguish a separate gating subunit from a fused exchanger.
      KtrA regulates separate KtrB/KtrD conducting proteins, whereas CpaA itself contains the membrane
      antiporter module and has measured antiport activity. Neither the shared RCK domain nor the accessible
      CpaA assay establishes regulation of a potassium channel. Replace with antiporter activity and directly
      demonstrated cyclic-di-AMP binding.
    supported_by:
    - *id001
    - *id002
    proposed_replacement_terms:
    - id: GO:0015297
      label: antiporter activity
    - id: GO:0180001
      label: cyclic-di-AMP binding
