taxon:
  id: NCBITaxon:367830
  label: Staphylococcus aureus subsp. aureus USA300
description: CpaA (SAUSA300_0911) is a Staphylococcus aureus USA300 membrane cation/proton antiporter
  with cytoplasmic RCK regulatory domains. Its RCK_C domain binds cyclic di-AMP, and reconstituted full-length
  protein shows nucleotide-dependent alteration of antiporter activity. The transported cation selectivity
  and physiological direction of this modulation require more specific assay evidence than the accessible
  primary abstract provides.
