id: A0A0H2XFX6
gene_symbol: pde2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:367830
  label: Staphylococcus aureus subsp. aureus USA300
description: Pde2, encoded by SAUSA300_1650 in Staphylococcus aureus USA300, is a cytoplasmic DHH/DHHA1
  phosphodiesterase that preferentially hydrolyzes the linear dinucleotide pApA to AMP. Loss of Pde2 causes
  pApA accumulation, and clearance of this metabolite can relieve inhibition of the upstream c-di-AMP
  phosphodiesterase GdpP. Pde2 can also hydrolyze c-di-AMP weakly in vitro, but the physiological importance
  of that side activity is unresolved. Its pApA hydrolase activity is inhibited by ppGpp in biochemical
  assays.
