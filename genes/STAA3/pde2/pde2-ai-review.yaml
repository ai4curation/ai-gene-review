core_functions:
- description: Hydrolyzes pApA to AMP in the cytoplasm, clearing the linear product of c-di-AMP degradation.
  supported_by:
  - reference_id: PMID:27834680
    supporting_text: Although capable of hydrolyzing c-di-AMP, Pde2 preferentially converts linear 5'-phosphadenylyl-adenosine
      (pApA) to AMP.
  - reference_id: PMID:27834680
    supporting_text: S. aureus produces a second cytoplasmic DHH/DHHA1 PDE Pde2.
  locations:
  - id: GO:0005737
    label: cytoplasm
  proposed_molecular_function: pApA hydrolase activity
proposed_new_terms:
- proposed_name: pApA hydrolase activity
  proposed_definition: 'Catalysis of the reaction: 5''-O-phosphonoadenylyl-(3''-5'')-adenosine (pApA)
    + H2O = 2 AMP.'
  justification: The substrate is the linear dinucleotide pApA, not cyclic di-AMP. GO:0106409 describes
    opening the cyclic substrate to pApA and therefore does not describe this second hydrolysis. The verified
    obsolete GO:0034611 is unsuitable. GO:0008081 supplies the phosphoric-diester hydrolysis parent while
    this proposal preserves the experimentally demonstrated substrate and product. Pde2-mediated pApA
    clearance can relieve product inhibition of GdpP; that regulatory consequence is not part of the reaction
    definition.
  proposed_parent:
    id: GO:0008081
    label: phosphoric diester hydrolase activity
  supported_by:
  - reference_id: PMID:27834680
    supporting_text: Although capable of hydrolyzing c-di-AMP, Pde2 preferentially converts linear 5'-phosphadenylyl-adenosine
      (pApA) to AMP.
suggested_questions:
- question: How much of the in vivo Pde2 substrate flux is pApA clearance, versus turnover of nanoRNA
    or other linear nucleotides under different growth conditions?
