  qualifier: enables
  supporting_entities:
  - InterPro:IPR003156
  review:
    summary: The generic DHHA1-domain inference exceeds the gene-specific evidence for nucleic-acid binding.
    action: MARK_AS_OVER_ANNOTATED
    reason: The DHHA1-domain mapping alone does not establish a distinct nucleic-acid-binding role for
      S. aureus Pde2. Direct assays establish preferential pApA hydrolysis; the physiological contribution
      of nanoRNA or other nucleotide substrates remains unresolved. This is an overextended functional
      inference, not experimental proof that Pde2 cannot interact with RNA.
    supported_by:
    - reference_id: PMID:27834680
      supporting_text: Although capable of hydrolyzing c-di-AMP, Pde2 preferentially converts linear 5'-phosphadenylyl-adenosine
        (pApA) to AMP.
- term:
    id: GO:0003824
    label: catalytic activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: enables
  supporting_entities:
  - ARBA:ARBA00027533
  review:
    summary: Catalysis is correct but the demonstrated hydrolytic activity is more informative.
    action: MODIFY
    reason: Refine the root molecular-function term to the directly characterized substrate-specific activity.
      The proposed term describes pApA-to-AMP hydrolysis; cyclic-di-AMP phosphodiesterase activity would
      describe a different reaction and overstate the physiological role of the weak side activity.
    supported_by:
    - reference_id: PMID:27834680
      supporting_text: Although capable of hydrolyzing c-di-AMP, Pde2 preferentially converts linear 5'-phosphadenylyl-adenosine
        (pApA) to AMP.
    proposed_replacement_terms:
    - id: NTR
      label: pApA hydrolase activity
