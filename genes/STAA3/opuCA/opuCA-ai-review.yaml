taxon:
  id: NCBITaxon:367830
  label: Staphylococcus aureus subsp. aureus USA300
description: OpuCA (SAUSA300_2393) is the ATPase and cyclic di-AMP receptor subunit of the Staphylococcus
  aureus USA300 OpuC compatible-solute importer. It supplies ATP-dependent work to a membrane transport
  complex whose principal demonstrated substrate is carnitine. Paired CBS domains bind cyclic di-AMP,
  and elevated cellular cyclic di-AMP reduces early carnitine accumulation. The isolated ATPase has weak
  activity that was not altered by cyclic di-AMP, leaving the coupling between ligand binding and complex
  transport unresolved.
