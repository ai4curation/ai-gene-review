- id: PMID:27531650
  title: The second messenger c-di-AMP inhibits the osmolyte uptake system OpuC in Staphylococcus aureus.
  findings:
  - statement: Cyclic di-AMP binds the paired CBS region of OpuCA.
    supporting_text: c-di-AMP binds specifically to the C-terminal CBS domains of the S. aureus OpuCA
      protein
  - statement: OpuCA is required for carnitine uptake in the tested USA300 strain.
    supporting_text: accumulation of radiolabelled carnitine was only observed in the WT and opuCA complementation
      strains but not in the ΔopuCA strain
  - statement: Glycine-betaine uptake was unaffected by OpuCA deletion under the tested conditions.
    supporting_text: radiolabelled glycine betaine was taken up at a similar rate by the WT, ΔopuCA, and
      opuCA complementation strains
  - statement: Purified OpuCA displayed weak ATPase activity insensitive to c-di-AMP.
    supporting_text: the protein had very weak ATPase activity, which was not sensitive to the concentration
      of c-di-AMP.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cached primary paper inspected; title and source identity verified.
