    summary: Glycine-betaine transport is not supported as an established OpuCA-dependent process in USA300.
    action: MARK_AS_OVER_ANNOTATED
    reason: 'The InterPro family mapping overstates substrate conservation: the direct WT/deletion/complementation
      experiment found no difference in glycine-betaine uptake, while carnitine uptake depended on OpuCA.
      This condition-specific result does not prove complete inability to transport betaine under every
      condition, so the row is marked over-annotated rather than removed as demonstrably impossible.'
    supported_by:
