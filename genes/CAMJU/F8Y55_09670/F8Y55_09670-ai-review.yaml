suggested_questions:
- question: Which native 81116 clients are preferentially oxidized by DsbA2, and which quinone
    supports CjDsbB recycling in vivo?
- question: >-
    What native-client folding evidence would justify GO:0006457 for this current Campylobacter
    record? Reduced RNase A activity recovery establishes productive oxidative folding by the
    sequence-identical archived 81116 DsbA, so lack of catalytic participation is not the issue. The
    present evidence is an in vitro model-substrate assay transferred across records, with native
    client preferences unresolved. A separate BP proposal is deferred on that target/assay scope,
    unlike BdbD, where direct oxidation chemistry is linked to disulfide-dependent PhoA activity and
    stability in the target strain 168. The upstream absence of GO:0006457 for E. coli DsbA P0AEG4,
    PA14 DsbA Q02DM0 and BdbD O32218 is a shared convention question, not the discriminator between
    these decisions; repository-authored NEW proposals do not establish the upstream convention.
