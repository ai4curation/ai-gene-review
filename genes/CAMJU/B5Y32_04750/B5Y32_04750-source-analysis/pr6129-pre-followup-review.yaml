suggested_questions:
- question: Which native 81116 clients are preferentially oxidized by DsbA1, and which quinone supports
    CjDsbB recycling in vivo?
- question: Why do same-role bacterial DsbA oxidases lack direct protein-folding BP annotations despite
    substrate oxidative-folding assays? The current comparator search found none for E. coli DsbA, PA14
    DsbA or Bacillus BdbD; no new BP is asserted here.
