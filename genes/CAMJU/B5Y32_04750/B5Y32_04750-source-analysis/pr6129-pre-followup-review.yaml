  label: Campylobacter jejuni
description: DsbA1 is a monomeric periplasmic thiol-disulfide oxidoreductase of Campylobacter jejuni,
  structurally related to DsbL. The sequence represented by B5Y32_04750 is identical to the intact C8J_0814
  protein of strain 81116. It introduces protein disulfides during oxidative folding and can be reoxidized
  in preparations containing CjDsbB. Its native client preferences remain incompletely resolved; it lacks
  detectable insulin-reduction activity under the reported assay conditions. Native 81116 enzyme-activity
  studies implicate DsbA1 particularly in maintaining PhoX activity.
