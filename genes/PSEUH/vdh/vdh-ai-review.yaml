  review:
    summary: Recombinant E. coli expressing HR199 vdh oxidized vanillin to vanillate; this is the core activity.
    action: ACCEPT
    reason: >-
      Priefert et al. identified vdh as the structural gene of a vanillin
      dehydrogenase and measured vanillin-to-vanillate conversion by recombinant
      cells. Swiss-Prot cites the full text for the NAD dependence.
    supported_by:
    - reference_id: PMID:9098058
      supporting_text: >-
        High expression of vdh in E. coli was achieved with HE35 cloned in
        pBluescript SK-. The resulting recombinant strains converted vanillin to
        vanillate at a rate of up to 0.3 micromol per min per ml of culture.
    - reference_id: file:PSEUH/vdh/vdh-uniprot.txt
