suggested_questions:
- question: What is the substrate range of purified HR199 Vdh across benzaldehyde, 4-hydroxybenzaldehyde and protocatechualdehyde relative to vanillin?
suggested_experiments:
- description: Purify HR199 Vdh and measure steady-state kinetics with vanillin and related aromatic aldehydes, with NAD+ and NADP+.
  hypothesis: Vdh prefers vanillin and NAD+ but oxidizes other para-hydroxylated benzaldehydes.
  experiment_type: enzyme kinetics
