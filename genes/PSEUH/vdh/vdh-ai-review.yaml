- term:
    id: GO:0042190
    label: vanillin catabolic process
  evidence_type: IC
  original_reference_id: PMID:9098058
  qualifier: involved_in
  review:
    summary: Vdh performs the first step of vanillin breakdown in HR199.
    action: NEW
    reason: >-
      Vdh catalyses the oxidation of vanillin itself, so it does part of the work
      of vanillin catabolism. Transfer of vdh together with vanAB conferred the
      ability to grow on vanillin to bacteria that could not use it. Vanillin
      catabolic process is used rather than ferulate catabolic process because
      the HR199 evidence starts from vanillin.
    supported_by:
    - reference_id: PMID:9098058
      supporting_text: >-
        Transfer of vanA, vanB, and vdh to Alcaligenes eutrophus and to
        different Pseudomonas strains, which were unable to utilize vanillin or
        vanillate as carbon sources, respectively, conferred the ability to grow
        on these substrates to these bacteria.
