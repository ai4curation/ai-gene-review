id: O05619
gene_symbol: vdh
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:86003
  label: Pseudomonas sp. HR199
description: >-
  Vanillin dehydrogenase (Vdh) of Pseudomonas sp. strain HR199 (DSM 7063), an
  NAD-dependent aldehyde dehydrogenase-family enzyme that oxidizes vanillin to
  vanillate. The vdh gene lies downstream of an enoyl-CoA hydratase-like gene
  (the HR199 ech) and near the vanAB vanillate demethylase genes; together these
  convert vanillin via vanillate to protocatechuate, and transfer of vdh and
  vanAB lets heterologous bacteria grow on vanillin. It is the reference
  vanillin dehydrogenase for the ferulate-to-protocatechuate route of
  Pseudomonas.
