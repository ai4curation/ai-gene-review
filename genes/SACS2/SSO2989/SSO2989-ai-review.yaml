  - UniProtKB:P53602
  review:
    summary: >-
      IBA from the PAINT node PTN000104601 (Archaea-Eukaryota), seeded by experimentally
      characterised plant, fungal and mammalian diphosphomevalonate decarboxylases. SSO2989 is a
      leaf directly under that node, as sister to the eukaryotic clade, and its own enzymology
      shows the same activity.
    action: ACCEPT
    reason: >-
      Sound phylogenetic inference that this member confirms. In the PANTHER 19 tree SSO2989
      descends from PTN000104601 and is the only archaeal leaf under it, whereas the haloarchaeal
      and Chloroflexi phosphomevalonate decarboxylases (represented by Halobacterium salinarum
      Q9HRQ4, the UniRef50 cluster-mate of H. volcanii mvaD) sit outside the node
      (file:HALVD/mvaD/mvaD-bioinformatics/RESULTS.md). The target therefore sits inside the
      clade that inherited the function. Target-specific evidence agrees: the recombinant protein
      has DMD activity (PMID:23378249), the curated UniProt reaction is RHEA:23732 with
      experimental evidence, and crystal structures show it binding (R)-mevalonate 5-diphosphate
      with an ATP analogue (PMID:28003359). There is no PAINT loss on this lineage (paint-losses
      check, no IRD or IKR). Core molecular function.
    supported_by:
    - reference_id: PMID:23378249
      supporting_text: >-
        Biochemical characterization using recombinant proteins showed that the orthologues of
        the enzymes catalyzing the late steps of the classical pathway, i.e. MVA kinase, PMK and
        DMD, are all active.
      reference_section_type: ABSTRACT
    - reference_id: file:SACS2/SSO2989/SSO2989-uniprot.txt
      record_section: ["CC:CATALYTIC ACTIVITY"]
      supporting_text: >-
        Reaction=(R)-5-diphosphomevalonate + ATP = isopentenyl diphosphate + ADP + CO2 +
        phosphate;
    - reference_id: file:HALVD/mvaD/mvaD-bioinformatics/RESULTS.md
      supporting_text: >-
        S. solfataricus SSO2989 (Q97UL5) is a leaf of the PANTHER 19 tree and descends from
        PTN000104601, the Archaea-Eukaryota node that carries the diphosphomevalonate
        decarboxylase IBD.
