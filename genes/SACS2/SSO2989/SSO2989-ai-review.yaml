suggested_questions:
- question: >-
    S. solfataricus also encodes isopentenyl phosphate kinase homologs; do they have any role in
    isoprenoid synthesis when the classical pathway through SSO2989 is active, or do they serve
    another purpose?
suggested_experiments:
- hypothesis: >-
    SSO2989 is essential for isoprenoid synthesis in Saccharolobus because the classical pathway
    is the only route to isopentenyl diphosphate.
  description: >-
    Attempt markerless deletion of the SSO2989 ortholog in a genetically tractable
    Saccharolobus strain (for example S. islandicus), with and without a complementing plasmid,
    and measure growth and isoprenoid lipid content; test whether expression of a haloarchaeal
    phosphomevalonate decarboxylase plus isopentenyl phosphate kinase rescues the deletion.
  experiment_type: genetic knockout and complementation
