id: Q97UL5
gene_symbol: SSO2989
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:273057
  label: Saccharolobus solfataricus P2
description: >-
  SSO2989 (UniProt Q97UL5) of the thermoacidophilic crenarchaeon Saccharolobus (Sulfolobus)
  solfataricus encodes diphosphomevalonate decarboxylase (DMD, EC 4.1.1.33), a 325-residue
  GHMP-superfamily enzyme of the classical, eukaryote-type mevalonate pathway. It catalyses the
  ATP-dependent decarboxylation of (R)-mevalonate 5-diphosphate to isopentenyl diphosphate, ADP,
  CO2 and phosphate, the last of the three ATP-dependent steps from mevalonate to isopentenyl
  diphosphate. The reaction proceeds in two half-reactions: ATP phosphorylates the 3-hydroxyl
  of the substrate to give (R)-3-phospho-5-diphosphomevalonate, and the 3-phosphate is then
  eliminated with the C1 carboxylate. Crystal structures with mevalonate 5-diphosphate and an ATP
  analogue, and mutants of Asp281 that phosphorylate the substrate but no longer decarboxylate
  it, showed that this conserved aspartate acts in phosphate elimination and decarboxylation
  rather than in the phosphoryl transfer. The recombinant protein is active, and cell-free extract
  of S. solfataricus converts the classical pathway intermediates but not those of the modified
  archaeal route, so this organism appears to make isopentenyl diphosphate by the classical
  pathway even though it also encodes isopentenyl phosphate kinase homologs. The enzyme is a
  cytosolic homodimer whose subunits are joined by an intersubunit disulfide bond that forms in
  the cell and raises its thermostability.
