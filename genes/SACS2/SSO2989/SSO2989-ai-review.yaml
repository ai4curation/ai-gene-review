- id: PMID:26303832
  title: In Vivo Formation of the Protein Disulfide Bond That Enhances the Thermostability of
    Diphosphomevalonate Decarboxylase, an Intracellular Enzyme from the Hyperthermophilic Archaeon
    Sulfolobus solfataricus.
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Abstract only. First crystal structures of SSO2989 (homodimer with an intersubunit
      disulfide; PDB 4Z7C/4Z7Y per UniProt cross-references) and evidence that the disulfide forms
      in S. solfataricus cells. Supports intracellular location and quaternary structure.
- id: PMID:28003359
  title: A Single Amino Acid Mutation Converts (R)-5-Diphosphomevalonate Decarboxylase into a
    Kinase.
  findings:
  - statement: >-
      Asp281 mutants of SSO2989 keep the 3-kinase half-reaction but lose decarboxylation,
      showing Asp281 acts in phosphate elimination/decarboxylation and proving the
      (R)-3-phospho-5-diphosphomevalonate intermediate.
    supporting_text: >-
      Site-directed mutagenesis on Asp-281 creates mutants that only show diphosphomevalonate
      3-kinase activity, demonstrating that the residue is required in the process of phosphate
      elimination/decarboxylation, rather than in the preceding phosphorylation step.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Abstract only. Substrate/ATP-analogue complex structures (PDB 5GMD/5GME per UniProt) and
      mechanistic mutagenesis on SSO2989; strong direct evidence for the DMD activity and its
      two-step mechanism.
