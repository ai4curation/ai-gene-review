  review:
    summary: >-
      IBA from PTN000104601, seeded by the cytosolic mouse and human enzymes. For an archaeon
      without internal membranes this asserts a soluble intracellular enzyme, which is what
      SSO2989 is.
    action: ACCEPT
    reason: >-
      The inherited location holds for this member. SSO2989 has no signal peptide or
      transmembrane segment, is described by the only cell-based study as a cytosolic
      (intracellular) enzyme, and its intersubunit disulfide bond was detected in whole
      S. solfataricus cells. The node placement is sound for the same reason as the activity IBA.
      The location is where the core activity acts.
    supported_by:
    - reference_id: PMID:26303832
      supporting_text: >-
        These results suggest that the disulfide bond is required for the cytosolic enzyme to
        acquire further thermostability and to exert activity at the growth temperature of S.
        solfataricus.
      reference_section_type: ABSTRACT
    - reference_id: PMID:26303832
      supporting_text: >-
        Western blot analysis combined with nonreducing SDS-PAGE of the whole cells of S.
        solfataricus proved that the disulfide bond was predominantly formed in the cells.
