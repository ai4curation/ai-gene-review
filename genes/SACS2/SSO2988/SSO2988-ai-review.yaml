- term:
    id: GO:0019287
    label: isopentenyl diphosphate biosynthetic process, mevalonate pathway
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - AGI_LocusCode:AT1G31910
  - PANTHER:PTN001274235
  - SGD:S000004833
  review:
    summary: >-
      PAINT process inference from PTN001274235. In S. solfataricus the classical mevalonate
      pathway operates, and this enzyme catalyses its second phosphorylation step.
    action: ACCEPT
    reason: >-
      The kinase performs a step of the pathway itself. Cell-free extracts of S. solfataricus
      convert the classical intermediates but not those of the IPK-dependent modified pathway
      (PMID:23378249; corroborated in PMID:24327557, which notes that IPK activity was
      undetectable in the extracts), so the enzyme acts in the classical route to IPP in vivo.
      No PAINT loss on the lineage.
    supported_by:
    - reference_id: PMID:23378249
      supporting_text: Moreover, in vitro conversion of the intermediates in the classical and modified
        pathways by cell-free extract from S. solfataricus indicated that only the classical pathway
        likely works in the organism.
    - reference_id: PMID:24327557
      supporting_text: A recent publication on the characterization of the classical MVA pathway enzymes
        from crude extracts of S. solfataricus supports the presence of an active classical MVA pathway
        in the order Sulfolobales, consistent with our in vitro results
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: PANTHER:PTN001274235
        source_status: SUPPORTS_TRANSFER
        comment: The organism runs the classical pathway (cell-free extract data), so the process
          inherited from plant and yeast seeds holds for this archaeal member.
