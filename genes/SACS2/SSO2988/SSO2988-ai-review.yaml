gene_symbol: SSO2988
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:273057
  label: Saccharolobus solfataricus P2
description: >-
  SSO2988 encodes the phosphomevalonate kinase (PMK) of the thermoacidophilic crenarchaeon
  Saccharolobus (formerly Sulfolobus) solfataricus, a 323-residue GHMP-family kinase that
  transfers the gamma-phosphate of ATP to (R)-mevalonate 5-phosphate to form (R)-mevalonate
  5-diphosphate (EC 2.7.4.2). It belongs to the ERG8-type GHMP phosphomevalonate kinases shared
  with fungi and plants, not to the unrelated nucleoside-monophosphate-kinase-fold PMK of
  animals. Unlike most archaea, which lack phosphomevalonate kinase and diphosphomevalonate
  decarboxylase and form isopentenyl diphosphate through isopentenyl phosphate, S.
  solfataricus encodes the complete classical mevalonate pathway. The recombinant protein has
  been characterised kinetically by two groups (Km for mevalonate 5-phosphate in the 20-80
  micromolar range), and cell-free extracts of the organism convert only classical-pathway
  intermediates, indicating that this enzyme performs the second phosphorylation of the
  classical route to isopentenyl diphosphate, the precursor of the isoprenoid chains of
  archaeal membrane lipids.
