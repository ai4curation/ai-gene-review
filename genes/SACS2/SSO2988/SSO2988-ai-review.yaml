  qualifier: enables
  supporting_entities:
  - AGI_LocusCode:AT1G31910
  - PANTHER:PTN001274235
  - SGD:S000004833
  review:
    summary: >-
      PAINT inference from PTHR31814 node PTN001274235 (seeds Arabidopsis PMK AT1G31910 and yeast
      ERG8). SSO2988 sits in this GHMP PMK clade, and its recombinant protein has PMK activity in
      two independent studies.
    action: ACCEPT
    reason: >-
      The node is the PMK-activity node of the family and `just paint-losses SACS2 SSO2988`
      finds no IRD or IKR on this lineage. Target-specific biochemistry confirms the inherited
      function: Nishimura et al. found the recombinant S. solfataricus PMK active
      (PMID:23378249; UniProt records Km 77 uM for (R,S)-5-phosphomevalonate), and Dellas et al.
      measured steady-state kinetics for the same protein (gi 15899698 = NP_344303, sequence
      identical to Q97UL6; Km(MVAP) 23.1 uM, kcat 1.98 s-1; PMID:24327557). The archaeal member
      has not diverged from the family's activity.
    supported_by:
    - reference_id: PMID:23378249
      supporting_text: Biochemical characterization using recombinant proteins showed that the orthologues
        of the enzymes catalyzing the late steps of the classical pathway, i.e. MVA kinase, PMK and
        DMD, are all active.
    - reference_id: PMID:24327557
      supporting_text: In our experiments, S. solfataricus PMK and MDD activities were detected in steady-state
        kinetic experiments and GC-MS assays, respectively
    - reference_id: file:SACS2/SSO2988/SSO2988-uniprot.txt
      record_section: ["CC:BIOPHYSICOCHEMICAL PROPERTIES"]
      supporting_text: KM=77 uM for (R,S)-5-phosphomevalonate (at 37 degrees Celsius)
    propagation_review:
      root_cause: NO_FAILURE_CORE
