suggested_questions:
- question: >-
    S. solfataricus also encodes an isopentenyl phosphate kinase homolog that is active in vitro
    but undetectable in cell extracts. Does it serve a salvage role (for example for isopentenyl
    phosphate released by phosphatases), or is it vestigial?
- question: >-
    Did the Sulfolobales acquire their ERG8-type PMK and eukaryote-type DMD by horizontal gene
    transfer, given that most archaea lack both?
suggested_experiments:
- hypothesis: >-
    SSO2988 is essential in Sulfolobales because the classical pathway is the only route to
    isopentenyl diphosphate.
  description: >-
    Attempt a markerless deletion of the SSO2988 ortholog in a genetically tractable relative
    (Saccharolobus islandicus), with and without a complementing copy or a heterologous
    isopentenyl phosphate kinase pathway, and test viability and lipid composition.
  experiment_type: genetic knockout and complementation
