suggested_questions:
- question: >-
    Should PAINT node PTN008498319 (PTHR10353), which carries the SFR2-seeded
    galactosyltransferase IBD and a negated beta-glucosidase IRD, be restricted so
    that archaeal GH1 beta-galactosidases (lacS P22498, bgaS P14288, bglY P50388,
    O52629), which PANTHER HMMs place in subfamily SF209, are excluded?
- question: >-
    Which physiological beta-glycoside substrates (lactose, cello-oligosaccharides or
    other glycosides) does LacS hydrolyse in vivo, given that its kinetic preference
    in vitro is for beta-glucosides and beta-fucosides?
suggested_experiments:
- description: >-
    Construct a clean lacS deletion in an otherwise wild-type background, leaving lacTr
    and xylS intact, and test growth on lactose, cellobiose and other beta-linked
    oligosaccharides, to define the in vivo substrate range of LacS separately from the
    adjacent transporter.
