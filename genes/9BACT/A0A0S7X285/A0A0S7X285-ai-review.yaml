taxon:
  id: NCBITaxon:1703766
  label: Parcubacteria bacterium DG_74_2
description: This Parcubacteria bacterium DG_74_2 SepRS activates O-phosphoserine with ATP and attaches
  it to tRNA(Cys), generating the intermediate of indirect cysteinyl-tRNA synthesis. Activity of the sequence-defined
  recombinant protein is established in vitro. Its paired SepCysS locus supports an indirect cysteine-encoding
  system in this metagenomic context; the DG_74_2 bin contains multiple genomes and does not represent
  a characterized native isolate.
existing_annotations:
- term: &id001
    id: GO:0043816
    label: phosphoserine-tRNA(Cys) ligase activity
  evidence_type: IDA
  original_reference_id: PMID:28487430
  review:
    summary: The sequence-defined recombinant SepRS performs the specific tRNA-dependent reaction.
    action: NEW
    reason: KPJ56532 encodes the experimentally tested SepRS. ATP-dependent phosphoseryl-tRNA formation
      was measured with purified recombinant protein and radiolabeled tRNA substrates. This is not cysteine
      ligation by a conventional CysRS. Current QuickGO retrieval contains no original annotations for
      this inactive UniProt record. This single molecular-function proposal is grounded in the mapped
      experimental construct; it is not redundant with another proposed or existing term. No process annotation
      is manufactured from pathway necessity.
    supported_by: &id002
    - reference_id: PMID:28487430
      supporting_text: Recombinant “Ca. Parcubacteria” SepRS aminoacylated both tRNACysbac and tRNACysarch,
        albeit at a low level (10%)
    - reference_id: file:9BACT/A0A0S7X285/A0A0S7X285-source-analysis/published-methods.txt
      supporting_text: The open reading frames (ORFs) of the SepRS genes of Parcubacteria (KPJ56532) and
        Chloroflexi (3300002966.a:JGI24721J44947_1000093732) were codon-optimized and chemically synthesized.
    - reference_id: file:9BACT/A0A0S7X285/A0A0S7X285-source-analysis/published-methods.txt
      supporting_text: The enzyme concentrations were 1.7 µM and 5.2 µM for Parcubacteria and Chloroflexi
        SepRS, respectively.
