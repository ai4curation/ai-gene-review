suggested_questions:
- question: What are the native cell identity, physiological sulfur donor and growth contribution of this
    pathway in the organism contributing the SepRS–SepCysS contig to the DG_74_2 metagenomic bin?
suggested_experiments:
- description: Reconstitute the matched Parcubacteria SepRS and SepCysS proteins together with the genomically
    associated tRNA(Cys), and determine donor requirements and kinetic coupling without substituting Chloroflexi
    SepRS.
