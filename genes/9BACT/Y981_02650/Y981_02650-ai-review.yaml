taxon:
  id: NCBITaxon:1441628
  label: Leptospirillum ferriphilum YSK
description: >-
  Y981_02650 (A0A059XTE6) of Leptospirillum ferriphilum is a putative
  FAD-dependent sulfide:quinone oxidoreductase (SQR). It is a Type I (SqrA)
  homolog sharing 57.5% identity with the characterized Acidithiobacillus
  ferrooxidans SQR (AFE_1792, B7JBP8) and 41.7% with the Aquifex aeolicus Type
  I enzyme, and it conserves that enzyme's three active-site cysteines
  (Cys128, Cys160 and Cys356 in AFE_1792 numbering). By homology it is
  expected to oxidize hydrogen sulfide to polysulfide or elemental sulfur on
  the cytoplasmic membrane and to pass the electrons through FAD to the
  respiratory quinone pool. Conservation of the full Type I cysteine triad
  supports SQR activity, but the inference is weaker than for close
  Acidithiobacillus orthologs and the protein has not been purified or
  assayed. Leptospirillum ferriphilum is an obligately aerobic iron-oxidizing
  chemoautotroph, so this SQR more likely serves to detoxify endogenous
  sulfide or to supply minor respiratory input than to drive energy-yielding
  sulfur oxidation. No Leptospirillum SQR has been assayed.
existing_annotations:
- term:
    id: GO:0016020
    label: membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  supporting_entities:
  - UniProtKB-SubCell:SL-0162
  review:
    summary: >-
      Location from an ARBA-predicted subcellular location. Correct but general:
      Type I SQRs are monotopic proteins of the cytoplasmic (plasma) membrane,
      where they reduce the quinone pool.
    action: MODIFY
    reason: >-
      The ARBA location is not evidence in itself. The location is supported
      instead by orthology to the characterized Type I SQRs: the A. ferrooxidans
      enzyme (57.5% identical) has C-terminal
      amphipathic membrane-anchoring helices and uses membrane quinone as its
      acceptor. In a Gram-negative bacterium the quinone pool lies in the
      cytoplasmic membrane. These two lines support refining membrane to plasma
      membrane.
    proposed_replacement_terms:
    - id: GO:0005886
      label: plasma membrane
    supported_by:
    - reference_id: PMID:20303979
      supporting_text: The enzyme comprises two tandem Rossmann fold domains and
        a flexible C-terminal domain encompassing two amphipathic helices that
        are thought to provide for membrane anchoring.
    - reference_id: PMID:22542586
      supporting_text: The electrons from sulfides are transferred first to the
        enzyme cofactor, FAD, which, in turn, passes them onto the quinone pool
        in the membrane.
