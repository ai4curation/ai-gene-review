- term:
    id: GO:0070224
    label: sulfide:quinone oxidoreductase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000003
  qualifier: enables
  supporting_entities:
  - EC:1.8.5.4
  review:
    summary: >-
      EC-mapped annotation. The EC number on this TrEMBL entry comes from an
      ARBA rule, but the activity is independently supported by Type I SQR
      orthology and conservation of the catalytic cysteine triad.
    action: ACCEPT
    reason: >-
      The protein is 57.5% identical to B7JBP8, whose SQR activity,
      kinetics and catalytic cysteines (Cys356 and Cys160 for sulfide oxidation
      and FAD reduction, Cys128 for quinone reduction) were established
      experimentally. All three cysteines align to cysteines in this protein, and
      the protein matches the InterPro SQR family signature (IPR052541). It is
      not an FCSD flavoprotein or a Type IV-VI SQR: identity to those references
      is 22-35%. The Leptospirillum protein is a more distant member, so the activity remains an inference that warrants testing.
    supported_by:
    - reference_id: file:ACIF2/AFE_1792/AFE_1792-bioinformatics/RESULTS.md
      supporting_text: 'B7JBP8 (57.5); O67931 (41.7) | C128 / C160 / C354'
    - reference_id: file:9BACT/Y981_02650/Y981_02650-uniprot.txt
      record_section: ["DR:InterPro"]
      supporting_text: InterPro; IPR052541; SQRD.
    - reference_id: PMID:22542586
      supporting_text: The enzymatic reaction proceeds in two steps. The electrons
        from sulfides are transferred first to the enzyme cofactor, FAD, which,
        in turn, passes them onto the quinone pool in the membrane.
