suggested_experiments:
- description: >-
    Express A0A059XTE6 heterologously and measure sulfide:decylubiquinone
    oxidoreductase activity, with Cys-to-Ala variants of the three conserved
    cysteines, to confirm the orthology-based activity assignment for this more distant Leptospirillum homolog.
