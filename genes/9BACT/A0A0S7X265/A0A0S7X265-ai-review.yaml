- term: &id001
    id: GO:0043766
    label: Sep-tRNA:Cys-tRNA synthase activity
  evidence_type: IDA
  original_reference_id: PMID:28487430
  review:
    summary: The sequence-defined recombinant SepCysS performs the specific tRNA-dependent reaction.
    action: NEW
    reason: KPJ56533 encodes the tested SepCysS. The coupled assay supplied Chloroflexi SepRS, not the
      matched Parcubacteria SepRS; it establishes this protein conversion activity without proving native
      pairing or growth physiology. Current QuickGO retrieval contains no original annotations for this
      inactive UniProt record. This single molecular-function proposal is grounded in the mapped experimental
      construct; it is not redundant with another proposed or existing term. No process annotation is
      manufactured from pathway necessity.
    supported_by: &id002
    - reference_id: PMID:28487430
      supporting_text: While conversion was complete in the case of “Ca. Parcubacteria” SepCysS (95 to
        99% of the total Sep-tRNACys intermediate)
    - reference_id: file:9BACT/A0A0S7X285/A0A0S7X285-source-analysis/published-methods.txt
      supporting_text: The ORFs of the SepCysS genes of Parcubacteria (KPJ56533) and Chloroflexi (JGI24721J44947_1000093733)
        were codon-optimized and cloned into pET15 and pET22 vectors for expression in E. coli.
    - reference_id: file:9BACT/A0A0S7X285/A0A0S7X285-source-analysis/published-methods.txt
      supporting_text: Activities of SepCysS enzymes were assayed in a reaction mixture containing 50
        mM Tris pH 7.5, 50 mM NaCl, 10 mM MgCl2, 5 mM DTT, 8 mM ATP, 1 mM phosphoserine, 40 mM sodium
        sulfide, 0.1 mM pyridoxal phosphate, 5 µM Chloroflexi SepRS, and 20 µM Parcubacteria or 40 µM
        Chloroflexi SepCysS.
