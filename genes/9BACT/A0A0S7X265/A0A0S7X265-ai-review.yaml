taxon:
  id: NCBITaxon:1703766
  label: Parcubacteria bacterium DG_74_2
description: This Parcubacteria bacterium DG_74_2 SepCysS converts phosphoseryl-tRNA(Cys) to cysteinyl-tRNA(Cys),
  completing the chemical conversion in an indirect cysteine-encoding pathway. The recombinant enzyme
  is active in anaerobic assays supplied with pyridoxal phosphate and sulfide. It lacks two conserved
  cysteines associated with the iron–sulfur form of some SepCysS homologs, so an obligatory iron–sulfur
  cluster is not inferred. Its sequence derives from a mixed metagenomic bin rather than a cultured native
  isolate.
