    label: protein homodimerization activity
  evidence_type: IDA
  original_reference_id: PMID:20534592
  qualifier: enables
  review:
    summary: Retain the experimentally observed homodimer as a non-core assembly property.
    action: KEEP_AS_NON_CORE
    reason: PMID20534592 resolves the E184-corrected C. jejuni enzyme as a homodimer with an
