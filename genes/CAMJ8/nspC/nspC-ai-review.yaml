- term:
    id: GO:0042803
    label: protein homodimerization activity
  evidence_type: IDA
  original_reference_id: PMID:20534592
  qualifier: enables
  review:
    summary: Represent the activity enabled by homodimer assembly.
    action: MODIFY
    reason: Homodimer formation is a structural property of the decarboxylase; the active site is formed
      across the subunit interface. The specific decarboxylase activity is more informative as the molecular
      function. This refinement retains the observed dimerization in the biological description rather
      than treating it as an independent activity.
    supported_by:
