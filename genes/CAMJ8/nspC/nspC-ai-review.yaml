- term:
    id: GO:0008836
    label: diaminopimelate decarboxylase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN001691017
  review:
    summary: Reject LysA chemistry propagated onto the NspC subfamily.
    action: REMOVE
    reason: The PTHR43727 family contains both LysA and NspC branches; this protein is classified in NspC
      subfamily SF1. Its family review scopes diaminopimelate decarboxylation and lysine biosynthesis
      to SF2 and judges the ancestral PTN000159906 assertions to need pruning before propagation into
      SF1. Experimentally characterized NspC/CAPA homologues differ in carboxypolyamine specificity and
      reject meso-diaminopimelate. This challenges transfer across functional subfamilies, not the donor
      count. The proximate TreeGrafter node PTN001691017 is absent from the inspected PAINT snapshot;
      its assertion is not independently verified. Here direct carboxypolyamine activity of the E184 enzyme
      also distinguishes the functional NspC from LysA.
    supported_by:
    - reference_id: file:CAMJ8/nspC/nspC-uniprot.txt
      supporting_text: NspC subfamily.
      record_section:
      - CC:SIMILARITY
    - reference_id: PMID:19196710
      supporting_text: no activity with l -arginine, l -lysine, and meso -diaminopimelate
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: PANTHER:PTN001691017
        source_status: UNRESOLVED
        comment: TreeGrafter node not exposed in the family PAINT snapshot; SF1 membership contradicts
          LysA transfer.
