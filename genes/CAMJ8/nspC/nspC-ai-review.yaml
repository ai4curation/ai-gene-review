  - *id003
proposed_new_terms:
- proposed_name: carboxyspermidine decarboxylase activity
  proposed_definition: 'Catalysis of the reaction: carboxyspermidine + H+ = spermidine + carbon dioxide.'
  justification: The reaction is represented by RHEA:34095 within EC 4.1.1.96. No specific active decarboxylase
    GO term was found by QuickGO name searches on 2026-11-05. This proposal captures the spermidine-forming
    reaction and does not assert carboxynorspermidine, CAPA or tetramine specificity.
  proposed_parent:
    id: GO:0016831
    label: carboxy-lyase activity
  supported_by:
  - reference_id: PMID:20534592
    supporting_text: Cj CANDC has similar activity on both CANS and carboxyspermidine
suggested_questions:
- question: Should the UniProt reference sequence and kinetic note be corrected to distinguish native
    E184 from the inactive E184K cloning variant described in PMID20534592?
suggested_experiments:
- description: Verify residue 184 in independent 81116 genomic samples and compare E184 and K184 constructs
    under identical kinetic assays.
  experiment_type: sequence verification and enzyme kinetics
