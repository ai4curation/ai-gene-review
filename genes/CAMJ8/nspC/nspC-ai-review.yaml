  - *id002
  - *id003
proposed_new_terms:
- proposed_name: carboxyspermidine/carboxynorspermidine decarboxylase activity
  proposed_definition: Catalysis of the decarboxylation of carboxyspermidine to spermidine or
    carboxynorspermidine to sym-norspermidine.
  justification: Both reactions (RHEA:34095 and RHEA:34099, EC 4.1.1.96) were measured for the
    repaired E184 construct in PMID20534592, with higher catalytic efficiency for
    carboxynorspermidine. The dual-substrate name matches the existing NspC proposal. Native
    spermidine production does not narrow the demonstrated molecular activity; no native
    norspermidine process, CAPA activity or tetramine activity is asserted.
  proposed_parent:
    id: GO:0016831
    label: carboxy-lyase activity
  supported_by:
  - reference_id: PMID:20534592
    supporting_text: Steady-state kinetic analysis for Cj CANSDC was performed using both
      carboxyspermidine ( K m = 4.1 ± 0.36 m m and k cat = 0.24 ± 0.0077 s −1 ) and
      carboxynorspermidine (CANS) ( K m = 2.1 ± 0.13 m m and k cat = 0.58 ± 0.013 s −1 ) as
      substrates.
suggested_questions:
- question: Should the UniProt reference sequence and kinetic note be corrected to distinguish
    native E184 from the inactive E184K cloning variant described in PMID20534592?
suggested_experiments:
- description: Verify residue 184 in independent 81116 genomic samples and compare E184 and K184
    constructs under identical kinetic assays.
  experiment_type: sequence verification and enzyme kinetics
