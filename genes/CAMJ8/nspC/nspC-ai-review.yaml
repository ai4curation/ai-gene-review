  reference_review:
    review_notes: The curated FUNCTION statement correctly distinguishes in-vitro dual substrate acceptance
      from native spermidine production. The canonical sequence contains K184 and the kinetic note calls
      its effect unclear, whereas PMID20534592 explicitly calls E184K a spontaneous cloning mutation causing
      loss of activity and reports its repair before analysis. Preserve the raw record and raise this
      discrepancy with UniProt.
core_functions:
- description: PLP-dependent decarboxylation of carboxyspermidine to spermidine by the functional E184
    NspC homodimer; the current K184 database sequence does not represent the assayed active construct.
  proposed_molecular_function: carboxyspermidine decarboxylase activity
  directly_involved_in:
