id: A8FNH9
gene_symbol: nspC
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:407148
  label: Campylobacter jejuni subsp. jejuni 81116
description: NspC (C8J_1418) is a homodimeric pyridoxal-phosphate-dependent carboxyspermidine decarboxylase
  in Campylobacter jejuni 81116. It catalyses the terminal step of the alternative spermidine biosynthetic
  pathway and is required for normal growth in polyamine-deficient medium. The active enzyme also decarboxylates
  carboxynorspermidine in vitro, although native cells produce spermidine rather than norspermidine. Published
  biochemical and structural experiments used the E184 construct after repair of an inactivating cloning
  mutation; the current reference protein sequence carries K184.
