id: A8FLS4
gene_symbol: dsbB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:407148
  label: Campylobacter jejuni subsp. jejuni 81116
description: DsbB is an inner-membrane thiol-disulfide oxidoreductase of Campylobacter jejuni 81116 that
  recycles the periplasmic DsbA1 and DsbA2 proteins during oxidative folding. Loss of DsbB shifts DsbA1
  toward its reduced form and greatly lowers detectable DsbA2, while a partially purified recombinant
  preparation reoxidizes both proteins. This redox pathway supports activity of exported clients including
  AstA and PhoX. The physiological electron acceptor and detailed kinetics of the DsbB reaction remain
  unresolved.
