- term: &id005
    id: GO:0006457
    label: protein folding
  evidence_type: IC
  original_reference_id: PMID:34948248
  review:
    summary: DsbB contributes to oxidative folding by regenerating the DsbA catalysts.
    action: NEW
    reason: DsbB performs the oxidoreductase-regeneration step, whereas DsbA1/DsbA2 introduce disulfides
      into exported client proteins. Native client-activity phenotypes alone would show necessity, but
      the partner redox-state and reoxidation experiments identify DsbB work in the folding system. GO0006457
      has protein-metabolism/cellular-process ancestry; it is not an ancestor or descendant of another
      proposed BP because no other BP is added. The seed has zero rows. Same-role comparator checks found
      this BP on E. coli DsbB P0A6M2 and PAO1 DsbB P21482/P57701; this is a convention check, not evidence
      for the target. No A8FLS4/C8J_0812 entry was found in the GO-CAM index.
    supported_by:
    - *id001
    - *id002
    - &id007
      reference_id: PMID:25181355
      supporting_text: These results confirm that efficient oxidative folding is critical for C. jejuni
        AstA activity and that the periplasmic CjDsbA2 plays a crucial role in this process, in cooperation
        with the membrane oxidoreductase CjDsbB
