core_functions:
- description: >-
    Loaded with a single mature crRNA and needing no tracrRNA, recognises a 5' TTTN
    protospacer adjacent motif in duplex DNA by combined base and shape readout, unwinds
    the adjacent duplex, forms an R-loop in which the crRNA spacer base-pairs with the
    target strand, and introduces internal breaks in both strands to leave a staggered
    double-strand break with a 4-base 5' overhang 19 and 22 bases downstream of the PAM.
    Both strands are cut in one RuvC-type active site assembled from three dispersed
    motifs, with Mg2+ as cofactor and no HNH domain. The sequence cut is set by the crRNA
    rather than by the protein, so GO's nuclease terms capture the chemistry but not the
    property that defines the enzyme.
