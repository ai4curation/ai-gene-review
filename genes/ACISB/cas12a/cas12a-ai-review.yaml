        for double-stranded DNA cleavage involving a single active site
    - reference_id: PMID:30936531
      supporting_text: Cas12a possesses a single nuclease domain (RuvC) that is activated
        upon a crRNA targeting sequence (or spacer) binding to a complementary
        single-stranded DNA (ssDNA) or
- term:
    id: GO:0000014
    label: single-stranded DNA endonuclease activity
  evidence_type: IDA
  original_reference_id: PMID:30936531
  qualifier: enables
  review:
    summary: >-
      Once AsCas12a has engaged a complementary target it also cleaves unrelated
      single-stranded DNA, from the same RuvC site and with no sequence requirement. This
      is a second, substrate-distinct activity of one active site, not a second enzyme
      activity in a second domain, and it is missing from GOA entirely.
    action: NEW
    reason: >-
      Asserted for this ortholog specifically. The general phenomenon was reported in
      PMID:29449511, whose cache is abstract-only and which does not name the orthologs
      assayed; the Acidaminococcus-specific evidence is in PMID:30936531, where Mb, Lb and
      AsCas12a were assayed side by side on both dsDNA and ssDNA substrates and the
      inhibition pattern was compared between them, which presupposes measurable AsCas12a
      ssDNA cleavage. GO:0000014 single-stranded DNA endonuclease activity is the right
      term: it states the substrate difference from the cis reaction, which is the only
      thing that distinguishes the two, and it does not imply a separate catalytic
      centre. Deliberately NOT accompanied by any annotation relating to nucleic-acid
      detection assays built on this activity; those are reagent applications, not
      functions of the gene in Acidaminococcus.
    supported_by:
    - reference_id: PMID:30936531
      supporting_text: The pattern of inhibition was generally the same for
        Cas12a-mediated ssDNA cleavage but activity was not completely abolished by any
        inhibitor
    - reference_id: PMID:30936531
      supporting_text: AcrVA1 blocked dsDNA cleavage by all three Cas12a orthologs,
        whereas AcrVA4 and AcrVA5 were effective against Moraxella bovoculi (Mb) Cas12a
        and LbCas12a but not Acidaminococcus sp. (As) Cas12a
    - reference_id: PMID:29449511
      supporting_text: Here we show that RNA-guided DNA binding unleashes indiscriminate
        single-stranded DNA (ssDNA) cleavage activity by Cas12a that completely degrades
        ssDNA molecules.
- term:
    id: GO:0004521
    label: RNA endonuclease activity
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: enables
  supporting_entities:
  - UniProtKB:A0Q7Q2
  review:
    summary: >-
      Cas12a enzymes mature their own guide, cleaving precursor crRNA upstream of the
      hairpin formed within the CRISPR repeat, with no tracrRNA and no Cas6-type
      ribonuclease. For this entry the activity is asserted by UniProt as "By similarity"
      from the Francisella ortholog, and this annotation is scoped to match that basis
      rather than claiming direct measurement.
    action: NEW
    reason: >-
      UniProt assigns EC 4.6.1.22 to this entry with ECO:0000250|UniProtKB:A0Q7Q2, and
      the FUNCTION block states "In this CRISPR system correct processing of pre-crRNA
      requires only this protein and the CRISPR locus (By similarity)". The EC-to-GO
      pipeline produced a row only for the DNase EC, so none of the crRNA-maturation
      activity reaches GOA. Evidence is ISS with the same source UniProt used, which is
      honest about what is and is not measured on this protein. GO:0004521 is the right
      level: it is defined without reference to mechanism and descends from GO:0004519
      endonuclease activity and GO:0004540 RNA nuclease activity, whereas its children
      GO:0016891 and GO:0016892 both stipulate a hydrolytic mechanism and the Cas12a
      reaction is a metal-independent transesterification leaving a 2',3'-cyclic
      phosphate.
    supported_by:
    - reference_id: PMID:27096362
      supporting_text: We show that type V-A Cpf1 from Francisella novicida is a
        dual-nuclease that is specific to crRNA biogenesis and target DNA interference.
    - reference_id: PMID:28431230
      supporting_text: Combined, these results demonstrate that pre-crRNA processing by
        FnCas12a proceeds through a metal-independent catalytic mechanism involving a
        nucleophilic attack on the scissile phosphate by the 2’-hydroxyl of the upstream
        ribonucleotide.
    - reference_id: PMID:30936531
      supporting_text: After expression of the CRISPR array and Cas proteins, Cas12a
        catalyzes precursor CRISPR-RNA (pre-crRNA) processing to form a Cas12a-crRNA
        complex (or ribonucleoprotein, RNP)
- term:
    id: GO:0099048
    label: CRISPR-cas system
  evidence_type: IMP
  original_reference_id: PMID:38261981
  qualifier: involved_in
  review:
    summary: >-
      The native biological process. GO:0099048 names three stages - acquisition, crRNA
      biogenesis, and target interference - and Cas12a performs two of them: it matures
      its own guide and it destroys the matching invader. The gene product therefore does
      the work of the process rather than merely being required for it.
    action: NEW
    reason: >-
      GOA holds no biological-process annotation for this entry. GO:0099048 is the term
      GO provides for this system, its definition names the stages explicitly, and it has
      no children, so there is no more specific alternative. Evidence is IMP because the
      demonstration is a comparison of interference by wild-type AsCas12a against a
      catalytically dead variant in a heterologous reconstitution: plaque formation and
      plasmid transformation are reduced by the active enzyme and not by dAsCas12a.
    supported_by:
    - reference_id: PMID:38261981
      supporting_text: the AsCas12a effector provided a reduction in plaque formation with
        variable efficiency for almost all phages tested except T4 (WT)
    - reference_id: PMID:26422227
      supporting_text: the results of the depletion assay clearly indicate that
        heterologously expressed Cpf1 loci are capable of efficient interference with
        plasmid DNA
- term:
    id: GO:0051607
    label: defense response to virus
  evidence_type: IMP
  original_reference_id: PMID:38261981
  qualifier: involved_in
  review:
    summary: >-
      AsCas12a programmed against essential genes of M13mp18, lambda, VpaE1 and T4
      reduces plaque formation by those phages, and a catalytically dead variant does not.
      The escape of wild-type T4, whose genomic cytosines are glycosylated, is itself
      informative: interference requires that the invader's DNA be chemically accessible,
      and T4 variants with hydroxymethyl or unmodified cytosines are targeted efficiently.
    action: NEW
    reason: >-
      Asserted for this ortholog and not for the Francisella one, because only this
      ortholog has phage-challenge data in the cited literature; the Francisella entry has
      plasmid interference only and carries GO:0099048 alone. GO:0051607 is not redundant
      with GO:0099048: the two sit in different branches (GO:0099048 descends from
      GO:0099046 clearance of foreign intracellular nucleic acids under GO:0140546, while
      GO:0051607 descends from GO:0006952 and GO:0009615), one naming the mechanism and
      the other the class of invader resisted. The evidence is from heterologous
      reconstitution in E. coli, which is how this class of system is routinely
      demonstrated and how UniProt records it for this entry.
    supported_by:
    - reference_id: PMID:38261981
      supporting_text: the AsCas12a effector provided a reduction in plaque formation with
        variable efficiency for almost all phages tested except T4 (WT)
    - reference_id: PMID:38261981
      supporting_text: The limited AsCas12a immunity against T4 (WT) is most likely due to
        the naturally occurring glycosylation of cytosines, as the T4 phage variants
        containing hydroxymethyl or unmodified cytosines were efficiently targeted.
