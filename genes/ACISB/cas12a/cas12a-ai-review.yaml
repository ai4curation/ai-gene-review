id: U2UMQ6
gene_symbol: cas12a
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:1111120
  label: Acidaminococcus sp. (strain BV3L6)
description: >-
  Cas12a (Cpf1) is the single-protein effector of the class 2, type V-A CRISPR-Cas
  adaptive immune system of Acidaminococcus sp. BV3L6. The 1307-residue protein is
  bilobed: an alpha-helical recognition lobe and a nuclease lobe, joined by a wedge
  domain assembled from three dispersed segments, enclose a positively charged central
  channel that holds the CRISPR RNA (crRNA) and the crRNA-target DNA heteroduplex.
  Loaded with a single crRNA and needing no tracrRNA, it recognises a 5' T-rich
  protospacer adjacent motif (TTTN in this organism) by a combination of base and shape
  readout, unwinds the adjacent duplex, forms an R-loop in which the crRNA spacer
  base-pairs with the target strand, and cleaves both strands to leave a staggered
  double-strand break with a 4-base 5' overhang 19 and 22 bases downstream of the PAM on
  the non-target and target strands respectively. Cleavage of both strands occurs in a
  single RuvC-type active site, built from three dispersed RuvC motifs and requiring
  Mg2+; the protein has no HNH domain. Once the enzyme is engaged by a complementary
  target it also becomes a substrate-non-specific single-stranded DNase, degrading
  unrelated single-stranded DNA from the same catalytic site. Like other Cas12a enzymes
  it matures its own guide, cleaving precursor crRNA upstream of a hairpin in the CRISPR
  repeat without a dedicated Cas6-type ribonuclease. The biological output is
  spacer-programmed destruction of invading DNA: in a heterologous host the enzyme blocks
  transformation by matching plasmids and reduces plaque formation by several
  bacteriophages, with phages whose genomic cytosines are glycosylated escaping because
  their DNA is not recognised. Because specificity is set by the spacer content of the
  CRISPR array rather than by the protein sequence, it is heritable and can change without
  any change to the enzyme.
existing_annotations:
- term:
    id: GO:0004530
    label: deoxyribonuclease I activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000003
  qualifier: enables
  supporting_entities:
  - EC:3.1.21.1
  review:
    summary: >-
      The automatic EC 3.1.21.1 to GO mapping, firing on an EC number that UniProt
      itself transferred to this entry by similarity. The chemistry is in the right
      family but the term is wrong: GO:0004530 is the GO rendering of deoxyribonuclease
      I, a non-specific nuclease, and its definition carries DNase I's own product
      specification ("endonucleolytic cleavage of DNA to 5'-phosphodinucleotide and
      5'-phosphooligonucleotide end products"), which is not a property of Cas12a.
      Cas12a makes a staggered double-strand break at a PAM-adjacent, crRNA-specified
      position, with a 4-base 5' overhang 19 and 22 bases from the PAM. GO:1990238
      double-stranded DNA endonuclease activity describes that without importing the
      DNase I reaction.
    action: MODIFY
    proposed_replacement_terms:
    - id: GO:1990238
      label: double-stranded DNA endonuclease activity
    reason: >-
      Term substitution only. EC 3.1.21.1 is best read as the closest available EC class
      for an enzyme whose real reaction has no EC entry, not as a claim that Cas12a is a
      DNase I; GO should not inherit that compromise. The guide dependence that makes
      Cas12a what it is has no GO molecular-function term at all and is raised in
      proposed_new_terms rather than approximated by an existing id.
    supported_by:
    - reference_id: PMID:27114038
      supporting_text: AsCpf1 recognizes the crRNA scaffold and the 5′-TTTN-3′ PAM in
        structure- and sequence-dependent manners.
    - reference_id: PMID:26422227
      supporting_text: Cpf1 is a single RNA-guided endonuclease lacking tracrRNA, and it
        utilizes a T-rich protospacer-adjacent motif. Moreover, Cpf1 cleaves DNA via a
        staggered DNA double-stranded break.
    - reference_id: PMID:26422227
      supporting_text: Third, Cpf1 introduces a staggered DNA double stranded break with
        a 4 or 5-nt 5′ overhang.
- term:
    id: GO:0004530
    label: deoxyribonuclease I activity
