  - reference_id: PMID:29449511
    supporting_text: Here we show that RNA-guided DNA binding unleashes indiscriminate
      single-stranded DNA (ssDNA) cleavage activity by Cas12a that completely degrades ssDNA
      molecules.
- description: >-
    Matures its own CRISPR guide, cleaving precursor crRNA upstream of the hairpin formed
    within the CRISPR repeat, with no tracrRNA and no dedicated Cas6-type ribonuclease, at
    a site separate from the DNA-cleaving RuvC site. The chemistry is an intramolecular
    transesterification leaving a 2',3'-cyclic phosphate rather than a hydrolysis. For this
    protein the activity is inferred from the Francisella ortholog on which it was measured;
    UniProt assigns it here with ECO:0000250 and states it as "By similarity".
  molecular_function:
    id: GO:0004521
    label: RNA endonuclease activity
  directly_involved_in:
  - id: GO:0099048
    label: CRISPR-cas system
  supported_by:
  - reference_id: PMID:27096362
    supporting_text: We show that type V-A Cpf1 from Francisella novicida is a dual-nuclease
      that is specific to crRNA biogenesis and target DNA interference.
  - reference_id: PMID:30936531
    supporting_text: After expression of the CRISPR array and Cas proteins, Cas12a catalyzes
      precursor CRISPR-RNA (pre-crRNA) processing to form a Cas12a-crRNA complex (or
      ribonucleoprotein, RNP)
  - reference_id: PMID:28431230
    supporting_text: Combined, these results demonstrate that pre-crRNA processing by
      FnCas12a proceeds through a metal-independent catalytic mechanism involving a
      nucleophilic attack on the scissile phosphate by the 2’-hydroxyl of the upstream
      ribonucleotide.
proposed_new_terms:
- proposed_name: guide RNA-dependent nucleic acid endonuclease activity
  proposed_definition: >-
    Catalysis of the cleavage of ester linkages within a nucleic acid molecule by creating
    internal breaks, where the position of cleavage is determined by base pairing between
    the substrate and a separate guide RNA bound non-covalently by the enzyme. The guide RNA
    is neither substrate nor product; it programs the sequence specificity of an enzyme whose
    active site is otherwise sequence-non-specific, so that the specificity of the catalysis
    is a property of the bound guide rather than of the protein.
  proposed_parent:
    id: GO:0004519
    label: endonuclease activity
  justification: >-
    GO has no molecular-function term for guide-RNA-programmed target recognition or
    cleavage. Checked against the current GO release: no molecular-function label contains
    "RNA-guided", "guide RNA" or "CRISPR". The consequence is that every CRISPR effector,
    and every other guide-dependent nuclease, can only be annotated with a term that
    describes its chemistry (GO:0004520, GO:0004521, GO:0004530, GO:1990238) and is therefore
    indistinguishable in GO from an unguided nuclease of the same chemistry. For Cas12a this
    is the single most important thing about the protein, since the sequence it cuts is set
    by the spacer content of the CRISPR array, is heritable, and changes without any change
    to the protein. Two children are needed, guide RNA-dependent DNA endonuclease activity
    (Cas9 and Cas12 families) and guide RNA-dependent RNA endonuclease activity (Cas13 and
    type III effectors), and the parent would also accommodate class 1 multi-subunit
    effectors through contributes_to. This request is deliberately scoped to the nuclease
    function rather than to recognition in general, so that catalytically dead guide-loaded
    effectors are handled by a binding term instead. This is the same request as in the
    reviews of A0Q7Q2, P0DOC6 and C7NBY4 and should be merged with them.
  supported_by:
  - reference_id: PMID:26422227
    supporting_text: Cpf1 is a single RNA-guided endonuclease lacking tracrRNA, and it
      utilizes a T-rich protospacer-adjacent motif. Moreover, Cpf1 cleaves DNA via a
      staggered DNA double-stranded break.
  - reference_id: PMID:27114038
    supporting_text: AsCpf1 recognizes the crRNA scaffold and the 5′-TTTN-3′ PAM in
      structure- and sequence-dependent manners.
suggested_questions:
- question: >-
    Is the Acidaminococcus sp. BV3L6 type V-A system active in its own host, and what are
    its native spacers? Every interference measurement on this protein has been made in a
    heterologous E. coli reconstitution with engineered spacers, so what this system defends
    against in Acidaminococcus is unknown.
- question: >-
    Does target-activated trans cleavage of single-stranded DNA contribute anything to
    immunity in vivo, or is it only a consequence of leaving an activated RuvC site exposed?
    Because cis and trans cleavage share the active site, a clean separation-of-function
    mutant may not exist, which is what makes the question hard rather than merely untested.
- question: >-
    Why do AcrVA4 and AcrVA5 fail against AsCas12a while inhibiting the Moraxella and
    Lachnospiraceae orthologs? The specificity difference is reported but its structural
    basis is unresolved, and it bears on which Cas12a-carrying hosts a given phage can
    invade.
- question: >-
    Should GO's molecular-function hierarchy acquire a guide-RNA-dependent branch, and
    should the cis and trans activities of one RuvC site be modelled as two functions or as
    one function with two substrate states?
suggested_experiments:
- description: >-
    Delete cas12a and the CRISPR array in Acidaminococcus sp. BV3L6 itself, or in a close
    relative that is genetically tractable, and challenge with phages and conjugative
    plasmids from the same habitat, to establish what the system defends against natively
    rather than what it can be programmed to cut.
- description: >-
    Measure crRNA maturation by purified AsCas12a directly, by incubating it with its own
    in vitro transcribed pre-crRNA and mapping the 5' and 3' ends of the products, to replace
    the current By-similarity assignment of EC 4.6.1.22 with direct evidence.
- description: >-
    Compare phage survival in hosts expressing wild-type AsCas12a against hosts expressing a
    variant with reduced trans-ssDNase but intact cis cleavage, if such a variant can be
    engineered, to test whether collateral cleavage contributes to immunity or is incidental.
- description: >-
    Systematically test AsCas12a interference against phages carrying hypermodified genomes
    beyond T4, to map how broadly DNA modification lets invaders escape type V-A immunity
    and whether the escape is at recognition or at cleavage.
