    summary: >-
      A curator-judged sequence-similarity transfer from the Francisella novicida
      ortholog A0Q7Q2. The transfer itself is sound and is not challenged here: the two
      proteins are members of the same Cas12a family, both are reviewed entries, and the
      activity transferred is directly measured on the source. The term is the problem,
      and it is the same problem at the source as at the target, so the correction has to
      be made in both places rather than by rejecting the propagation.
    action: MODIFY
    proposed_replacement_terms:
    - id: GO:1990238
      label: double-stranded DNA endonuclease activity
    reason: >-
      Same substitution as the IEA row, so that the two GOA rows do not end up asserting
      different things about one activity. Explicitly not marked as a propagation problem:
      A0Q7Q2 is the correct source, the orthology is not in doubt, and the source carries
      experimental evidence (PMID:28431230). Also note that neither GOA row covers the
      second EC number on this entry, EC 4.6.1.22, which is the crRNA-processing activity;
      that gap is filled by the NEW GO:0004521 row below.
    supported_by:
    - reference_id: PMID:28431230
      supporting_text: the R-loop complex structure reveals the strand displacement
