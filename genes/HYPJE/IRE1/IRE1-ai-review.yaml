  review:
    summary: ER-stress apoptotic signaling remains unresolved for the Trichoderma protein.
    action: UNDECIDED
    reason: The prior review inferred impossibility from fungal identity and primary adaptive UPR
      function without target-specific tests. Actual TreeGrafter node PTN001017826 is the
      Sclerotinia A7EHN1 fungal leaf in served PTHR13954 v19; current PAINT places the corresponding
      mammalian IBD at PTN000359344 on a separate branch. That source/release mismatch weakens this
      transfer but does not prove the target lacks a conditional cell-death function or the required
