id: G0RBE3
gene_symbol: IRE1
product_type: PROTEIN
status: IN_PROGRESS
taxon:
  id: NCBITaxon:431241
  label: Hypocrea jecorina (strain QM6a)
description: >-
  IRE1 is a type I endoplasmic-reticulum membrane stress sensor in Trichoderma reesei. Its cytosolic serine/threonine
  kinase undergoes autophosphorylation, while its conserved endoribonuclease domain initiates unconventional
  processing of hac1 mRNA. IRE1 overexpression activates HAC1 processing and induces ER chaperone and
  foldase genes, linking secretory protein-folding stress to the unfolded protein response. The Trichoderma
  protein functionally complements budding-yeast ire1 mutants.
existing_annotations:
- term:
    id: GO:0051082
    label: unfolded protein binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  review:
    summary: IRE1 senses unfolded-protein stress; the obsolete binding term requires a
      sensor-appropriate replacement.
    action: MODIFY
    reason: 'Live QuickGO verifies GO0051082 is obsolete, but its historical definition was simply binding
      to an unfolded protein. The prior assertion that sensors cannot have this binding activity was wrong:
      yeast Ire1 directly binds unfolded proteins (PMID21852455). Trichoderma IRE1 functional rescue and
      UPR activation support detection of unfolded-protein stress. Replace the obsolete MF with GO0002235
      detection of unfolded protein, explicitly a BP describing stimulus-to-signal conversion; do not
      replace it with a folding chaperone or holdase activity. Target direct ligand binding is not established
      by the accessible primary abstract.'
    supported_by:
    - &id001
      reference_id: PMID:15480788
      supporting_text: The data presented demonstrates that the T. reesei genes can complement
        Saccharomyces cerevisiae mutants that are deficient in the corresponding homologues.
    - reference_id: PMID:21852455
      supporting_text: Peptide binding caused Ire1 cLD oligomerization in vitro
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      source_entities:
      - source_id: PANTHER:PTN001017826
        source_status: SUPPORTS_TRANSFER
        comment: Fungal IRE1 relationship and functional complementation support conserved sensing.
          Direct yeast ligand binding does not establish target binding kinetics. The annotation
          needs term-scope migration, not a claim of absent sensor binding.
    proposed_replacement_terms:
    - id: GO:0002235
      label: detection of unfolded protein
