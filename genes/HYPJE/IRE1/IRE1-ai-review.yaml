- id: PMID:15480788
  title: The ire1 and ptc2 genes involved in the unfolded protein response pathway
    in the filamentous fungus Trichoderma reesei.
  findings:
  - statement: T. reesei ire1 complements S. cerevisiae ire1 mutants
    supporting_text: The data presented demonstrates that the T. reesei genes can
      complement Saccharomyces cerevisiae mutants that are deficient in the corresponding
      homologues.
  - statement: T. reesei IRE1 has intrinsic kinase activity (in vitro autophosphorylation)
    supporting_text: The T. reesei IREI protein has intrinsic kinase activity, as
      revealed by an in vitro autophosphorylation assay.
  - statement: Overexpression of ire1 upregulates UPR target genes bip1 and pdi1
    supporting_text: Overexpression of ire1 in a T. reesei strain that expresses a
      foreign protein (laccase 1 from Phlebia radiata), results in up-regulation of
      the UPR pathway, as indicated by the increased expression levels of the known
      UPR target genes bip1 and pdi1.
  - statement: HAC1 mRNA splicing observed upon ire1 overexpression
    supporting_text: Splicing of the mRNA encoding the transcription factor HAC1 is
      also observed.
- id: file:HYPJE/IRE1/IRE1-deep-research-falcon.md
  title: Deep research report on IRE1 (Falcon/Edison Scientific Literature)
  findings:
  - statement: IRE1 in Trichoderma reesei is the ER-resident transmembrane kinase/endoribonuclease
      that senses unfolded ER protein accumulation and initiates the unfolded protein
      response (UPR) by HAC1-mRNA splicing; the canonical ER-stress sensor of the
      fungal UPR.
- id: file:HYPJE/IRE1/IRE1-hypotheses/fungal-stress-death-and-signaling-complex/openscientist.md
  title: Focused OpenScientist report on fungal IRE1 stress-death and TRAF2-ASK1 transfers
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Read in full; directly adjudicates the unresolved mammalian ER-stress
      apoptosis and IRE1-TRAF2-ASK1 complex transfers to fungal IRE1.
- id: PMID:21852455
  title: Unfolded proteins are Ire1-activating ligands that directly induce the unfolded
    protein response.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Yeast Ire1 primary retrieved and read: direct unfolded-protein/peptide
      binding activates sensor oligomerization. This establishes that sensor and ligand
      binding are compatible; target Trichoderma biochemical binding remains an inference.'
