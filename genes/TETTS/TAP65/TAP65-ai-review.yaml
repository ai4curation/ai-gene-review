suggested_questions:
- question: Should p65 also carry GO:0000333 telomerase catalytic core complex? The TERT-TER-p65 ternary
    core is a named, structurally resolved entity in every cryo-EM study, and GO:0000333 is more informative
    than GO:0005697. It was not proposed here because GO:0000333 is a part_of descendant of GO:0005697,
    which the gene already carries nine times by IDA, and CLAUDE.md directs against proposing a term that
    is a descendant of one the gene already holds. A GO-side convention on whether subcomplex and holoenzyme
    CC terms should coexist would settle it.
  experts:
  - Kathleen Collins
  - Juli Feigon
- question: 'Can the 3''-end protection and the stem IV bending functions of p65 be genetically separated?
    The question was posed explicitly when the assembly role was first described and has not been closed:
    are there p65 or TER variants that retain wild-type p65-TER and TERT-TER binding yet abolish p65 enhancement
    of TERT loading?'
  experts:
  - Kathleen Collins
  - Michael D. Stone
- question: Does p65 remain associated with the holoenzyme at telomeres during repeat addition in vivo,
    or is its role confined to biogenesis? This determines whether GO:0000781 chromosome, telomeric region
    is a genuine site of action for p65 or only a property of the complex it builds.
  experts:
  - Kathleen Collins
- question: Does Tetrahymena encode a genuine La protein distinct from p65? A second La-motif locus was
    noted in the macronuclear genome but its expression and identity were never resolved, and the answer
    bears on how family-level RNA-binding inferences should be propagated within ciliates.
  experts:
  - Kathleen Collins
suggested_experiments:
- hypothesis: The 3'-end protection and RNA-folding/TERT-loading activities of p65 are separable functions
    residing in different modules.
  description: Build p65 variants that uncouple the two activities - for example xRRM point mutants such
    as Y407A and R465A that lose stem IV binding while retaining the La-RRM1 clamp on the 3' oligo(U)
    tail, and reciprocal La-motif mutants that retain stem IV bending. Express each at endogenous levels
    in Tetrahymena and score TER accumulation by Northern blot, TER 3'-end integrity by 3' RACE, RNP assembly
    by TERT co-immunoprecipitation, and telomere length over continuous log-phase growth. A variant that
    preserves TER levels but fails TERT loading, or the converse, would establish the two roles as genetically
    distinct.
  experiment_type: Separation-of-function mutagenesis with in vivo complementation
- hypothesis: p65 acts as a true RNA folding chaperone, resolving kinetically trapped misfolded TER rather
    than only shifting a pre-existing conformational equilibrium.
  description: 'Use single-molecule FRET on TER pre-folded into misfolded states under conditions that
    trap them, then add p65 and measure whether it converts trapped molecules into the active conformation
    and whether it is released after folding. Pair this with a chaperone-standard assay: test whether
    substoichiometric p65 can catalytically turn over multiple TER molecules into the TERT-competent fold.
    Catalytic turnover would distinguish chaperone activity from stoichiometric conformational capture
    and would firm up the proposed GO:0140691 annotation.'
  experiment_type: Single-molecule FRET refolding and substoichiometric turnover assay
- hypothesis: p65 is present at telomeres during repeat addition in vivo, not only during RNP biogenesis.
  description: Tag endogenous p65 and TERT with orthogonal epitopes and perform chromatin immunoprecipitation
    against telomeric repeat DNA across the cell cycle, with TER-depleted and TERT-depleted strains as
    controls to separate RNA-dependent from protein-dependent recruitment. Complement with live-cell imaging
    of tagged p65 relative to a telomere marker. A p65 ChIP signal coincident with TERT would justify
    GO:0000781 as a site of action rather than an inference from complex membership.
  experiment_type: Telomeric ChIP and live-cell colocalization
- hypothesis: Tetrahymena encodes a genuine La protein, functionally distinct from p65, acting on RNA
    polymerase III transcripts generally.
  description: Identify the second La-motif locus in the current macronuclear genome assembly, confirm
    it is transcribed by RT-PCR, tag the product and determine its bound RNA repertoire by CLIP or RIP-seq,
    asking specifically whether it binds the nascent 3' oligo(U) ends of 5S rRNA, SRP RNA and U6 while
    excluding TER. This would complete the division of labour that the original p65 paper left open.
  experiment_type: Gene identification plus RIP-seq/CLIP of the candidate La protein
