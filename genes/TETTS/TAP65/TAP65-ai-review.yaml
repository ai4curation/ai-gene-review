- term:
    id: GO:0140691
    label: RNA folding chaperone
  evidence_type: IDA
  original_reference_id: PMID:22705372
  qualifier: enables
  review:
    summary: 'p65 is an RNA folding chaperone: it binds TER and actively remodels it into the conformation
      competent for TERT loading, rescuing misfolded TER variants.'
    action: NEW
    reason: 'GOA captures p65''s binding (GO:0070034), the downstream assembly process (GO:1904868) and
      the stabilization process (GO:0090669), but no molecular function for the chaperone activity itself,
      which is the activity those processes depend on and the one the literature names in exactly these
      words. Participation test: p65 does the folding work itself rather than being folded or merely being
      required - its xRRM helix wedges the GA bulge open and bends the RNA by 105 degrees, and TER variants
      that cannot fold correctly on their own become active when p65 is supplied. Comparator test: QuickGO
      returns 36 experimental annotations to GO:0140691, including WRAP53/TCAB1 (UniProtKB:Q9BUR4, IDA)
      and mouse Wrap53 (UniProtKB:Q8VC51), telomerase-RNP biogenesis factors acting on telomerase RNA,
      as well as Hfq, Lsm2/3/4/8 and IMP3/IMP4; the term is therefore routinely applied to proteins in
      p65''s role and its absence here is a gap rather than a convention. Non-redundancy: GO:0140691 sits
      under GO:0003674 and, via part_of, under the process GO:0034337 RNA folding; it is not a descendant
      of GO:0003723, so it is not entailed by the accepted GO:0070034, nor by the biological-process rows.
      Caveat, stated here so the row is self-contained: the discriminating chaperone test, whether
      substoichiometric p65 turns over multiple TER molecules, has not been done, and p65 stays in the
      assembled RNP as a molecular buttress rather than releasing after folding, which is atypical for a
      chaperone. The activity assay is solid; the catalytic-cycle question is open and is carried in
      suggested_experiments.
      The parent GO:0034337 is deliberately not also proposed.'
