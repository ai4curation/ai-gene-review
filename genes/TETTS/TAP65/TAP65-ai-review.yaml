    summary: Telomeric-chromatin localization inferred by UniProt from its subcellular-location vocabulary;
      plausible for a constitutive holoenzyme subunit, but peripheral to what p65 is shown to do.
    action: KEEP_AS_NON_CORE
    reason: 'This row comes from the UniProtKB-SubCell SL-0276 mapping, which rests on UniProt''s own
      ECO:0000305 inference rather than an observation of p65 on telomeric chromatin. The inference is
      reasonable: p65 is a stable, RNase-resistant subunit of the holoenzyme (PMID:19941821) whose depletion
      shortens telomeres (PMID:15131081), so the particle it belongs to does act at chromosome ends. It
      is retained at this level of precision because nothing finer is warranted. It is marked non-core
      because every assayed p65 activity - 3''-end protection of TER, TER folding, and hierarchical TERT
      loading - belongs to ribonucleoprotein biogenesis, upstream of telomere engagement, and no direct
      localization of Tetrahymena p65 to the telomeric region has been published.'
