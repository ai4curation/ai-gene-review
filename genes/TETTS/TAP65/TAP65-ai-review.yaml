gene_symbol: TAP65
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:312017
  label: Tetrahymena thermophila SB210
description: 'TAP65 (p65) is the La-related protein 7 (LARP7) family subunit of the Tetrahymena thermophila
  telomerase holoenzyme. It is a 542-residue protein built from three RNA-binding modules - an HTH La-type
  domain, a classical RRM, and a C-terminal xRRM that this protein defined structurally - which act together
  to recognise telomerase RNA (TER). p65 is a non-catalytic subunit: together with the reverse transcriptase
  TERT and TER it forms the three-component catalytic core of the holoenzyme, which in the intact enzyme
  is tethered through p50 to an RPA-related Teb1-Teb2-Teb3 heterotrimer and a CST-like p75-p45-p19 heterotrimer.
  Its activity is RNA chaperoning rather than catalysis. The La-type and RRM modules clamp the 3'' oligo(U)
  terminus of the Pol III-transcribed TER precursor and shield it from exonucleolytic degradation, which
  is what sets the cellular level of telomerase RNA; the xRRM then reads the conserved GA bulge of proximal
  stem IV and bends the RNA by about 105 degrees. That bend converts TER from a conformationally heterogeneous
  molecule into the single fold that TERT can engage, so the enzyme assembles in a fixed order - p65 onto
  TER first, then TERT - with roughly thirty-fold higher TERT affinity than for naked TER. p65 remains
  in the assembled particle, holding TER and TERT in their active conformations. Loss of p65 is lethal
  in Tetrahymena: telomerase RNA fails to accumulate, TERT is destabilised in its absence, and telomeres
  become critically short. The protein is specific to telomerase RNA and does not behave as a general
  La protein acting on RNA polymerase III transcripts.'
