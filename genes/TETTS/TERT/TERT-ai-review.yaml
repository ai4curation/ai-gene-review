- id: PMID:19941821
  title: An RPA-related sequence-specific DNA-binding subunit of telomerase holoenzyme
    is required for elongation processivity and telomere maintenance.
  findings:
  - statement: >-
      Seven Tetrahymena telomerase proteins each copurify active RNP and are each required
      for telomere maintenance; the p65-TER-TERT catalytic core is joined by a p75-p45-p19
      subcomplex and the peripheral p82 and p50 subunits.
    supporting_text: The catalytic core (p65-TER-TERT) is assembled with a three-protein
      subcomplex (p75-p45-p19) and two peripheral subunits (p82 and p50).
  - statement: >-
      High repeat-addition processivity of the holoenzyme, relative to the minimal
      catalytic RNP, is attributed to DNA-interacting subunits other than TERT and TER.
    supporting_text: DNA-interacting subunits other than telomerase reverse transcriptase
      (TERT) and telomerase RNA (TER) have been hypothesized to account for high repeat
      addition processivity of telomerase holoenzyme compared to the minimal catalytic RNP.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text cached. Defines the Tetrahymena holoenzyme composition and, crucially for
      this review, assigns processivity to p82/Teb1 rather than to TERT.
