- term:
    id: GO:0003720
    label: telomerase activity
  evidence_type: IDA
  original_reference_id: PMID:10944124
  qualifier: enables
  review:
    summary: >-
      The defining molecular function of TERT. This study reconstituted recombinant
      Tetrahymena telomerase from TERT and TER and measured primer extension directly,
      showing that 54 single substitutions in TERT alter the level and the qualitative
      features of repeat synthesis.
    action: ACCEPT
    reason: >-
      Core function, established in the organism being annotated. GO:0003720 is the right
      level of specificity, since its definition requires catalysis using an internal RNA
      template that encodes the telomeric repeat sequence, which is precisely what
      distinguishes telomerase from the generic DNA-polymerase and
      RNA-directed-DNA-polymerase ancestors. The activity is strictly a property of the
      TERT-TER RNP, but TERT carries the RT active site and determines template use, which
      is why GOA annotates the protein subunit with it.
    supported_by:
    - reference_id: PMID:10944124
      supporting_text: 'Only two telomerase components are known to be essential for
        properly templated telomerase activity assayed on oligonucleotide substrates: the
        telomerase RNA and the telomerase reverse transcriptase (TERT) protein.'
    - reference_id: PMID:10944124
      supporting_text: Our results indicate that TERT contributes directly to RNA template
        definition and the characteristics of template use.
