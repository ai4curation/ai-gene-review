id: O77448
gene_symbol: TERT
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:312017
  label: Tetrahymena thermophila SB210
description: >-
  TERT is the catalytic protein subunit of telomerase, the ribonucleoprotein (RNP)
  reverse transcriptase that extends the single-stranded 3' ends of linear chromosomes
  with telomeric repeats. The 1117-residue protein comprises a telomerase-essential
  N-terminal (TEN) domain, an RNA-binding domain (TRBD), a reverse-transcriptase (RT)
  domain and a C-terminal extension (CTE); the TRBD, RT and CTE form a ring around the
  active-site cavity. Catalysis (EC 2.7.7.49) requires the integral RNA subunit TER,
  which supplies the internal template encoding the Tetrahymena 5'-TTGGGG-3' repeat, so
  the enzyme is an RNA-directed DNA polymerase whose template is part of the enzyme
  rather than a separate substrate. TERT itself determines how that internal template is
  used: single substitutions in the ciliate-specific N-terminal motif CP2 and in RT
  motifs 1, 2, A and D alter the 5' and 3' template boundaries, nucleotide- and
  repeat-addition processivity, and deoxy- versus ribonucleotide selectivity. The TEN
  domain binds the single-stranded telomeric DNA primer sequence-specifically and
  contacts RNA non-specifically, while the TRBD binds TER at the template-boundary
  element and loop 4. In Tetrahymena, TERT, TER and the La-family protein p65/TAP65 form
  the catalytic core of a larger holoenzyme that also contains the p50 hub, an
  RPA-paralogous TEB module (Teb1-Teb2-Teb3) and a CST-paralogous p75-p45-p19 module;
  these accessory modules, not TERT, supply high repeat-addition processivity and the
  physical bridge to the chromosome end. TERT acts in the nucleus at telomeric chromosome
  ends and is required for telomere length maintenance in vivo.
