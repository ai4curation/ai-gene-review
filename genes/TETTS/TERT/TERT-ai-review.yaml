- id: PMID:23552895
  title: The architecture of Tetrahymena telomerase holoenzyme.
  findings:
  - statement: >-
      Electron microscopy of the purified holoenzyme places TERT at the centre of the
      particle, with TERT, TER and p65 forming the RNP catalytic core and p50 acting as a
      hub to the p75-p19-p45 subcomplex and Teb1.
    supporting_text: Fitting with high-resolution structures reveals the organization of
      TERT, TER and p65 in the ribonucleoprotein (RNP) catalytic core.
  - statement: >-
      Eight reciprocally co-purifying, telomerase-specific subunits were established, each
      essential for telomere length maintenance, of which only TERT, TER and p65 are
      required for assembly of a catalytically active RNP in vivo.
    supporting_text: 'Three of these subunits are required for in vivo assembly of a
      catalytically active RNP: TERT, TER, and the La-family protein p65'
  - statement: >-
      The TERT TRBD, RT and CTE domains form a ring encircling the active-site cavity.
    supporting_text: The TERT TRBD, RT domain, and C-terminal extension (CTE) form a ring
      that encircles an active site cavity
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text cached. Primary structural support for TERT's holoenzyme and
      catalytic-core membership, and for assigning the telomere bridge and processivity to
