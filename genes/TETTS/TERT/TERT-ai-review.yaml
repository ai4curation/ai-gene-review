- id: PMID:10944124
  title: Template definition by Tetrahymena telomerase reverse transcriptase.
  findings:
  - statement: >-
      An active recombinant Tetrahymena telomerase RNP is minimally TERT plus the
      telomerase RNA; these are the only two components essential for properly templated
      activity on oligonucleotide substrates.
    supporting_text: 'Only two telomerase components are known to be essential for
      properly templated telomerase activity assayed on oligonucleotide substrates: the
      telomerase RNA and the telomerase reverse transcriptase (TERT) protein.'
  - statement: >-
      Site-directed mutagenesis of 54 TERT residues showed that TERT residues both within
      and beyond the RT motifs set the template boundaries and the characteristics of
      internal template use.
    supporting_text: Our results indicate that TERT contributes directly to RNA template
      definition and the characteristics of template use.
  - statement: >-
      The motif A substitution Y623A abolishes discrimination between dNTPs and rNTPs,
      placing nucleotide selectivity in the TERT active site.
    supporting_text: We conclude that the major qualitative change in activity of the
      Class 5 enzyme derives from a loss of dNTP/rNTP selectivity.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text cached and read. Directly establishes TERT's catalytic role and its
      control of internal template use in Tetrahymena; the primary support for the
      GO:0003720 and GO:0034061 rows cited to it.
- id: PMID:15696174
  title: A telomerase holoenzyme protein enhances telomerase RNA assembly with telomerase
    reverse transcriptase.
  findings:
  - statement: >-
      TERT and TER alone assemble into an active enzyme in rabbit reticulocyte lysate,
      while p65 is required for the physiological in vivo pathway.
    supporting_text: The telomerase reverse transcriptase (TERT) and telomerase RNA (TER)
      alone can assemble into active enzyme in a heterologous cell extract
  - statement: >-
      p65 and TERT associate only in the presence of TER, so the p65-TERT association
      within the holoenzyme is RNA-bridged rather than a direct protein-protein contact.
    supporting_text: These findings demonstrate that in the presence of TER, p65 and TERT
      associate to form a ternary complex.
  - statement: >-
      p65 does not itself add catalytic activity, since primer extension by TERT-TER was
      unchanged by p65 coassembly in rabbit reticulocyte lysate.
    supporting_text: Coassembly of p65 did not affect the primer-extension activity of
      T. thermophila TERT reconstituted with TER in RRL
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text cached and read. Although the paper's subject is p65/TAP65, it directly
      assays TERT-TER assembly and primer-extension activity, which is why UniProt and GOA
      cite it for TERT function and holoenzyme membership.
