- term:
    id: GO:0007004
    label: telomere maintenance via telomerase
  evidence_type: IDA
  original_reference_id: PMID:15696174
  qualifier: involved_in
  review:
    summary: >-
      TERT is the catalytic subunit that synthesises the telomeric repeats by which
