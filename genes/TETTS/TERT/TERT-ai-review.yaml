core_functions:
- description: >-
    Catalytic protein subunit of the telomerase ribonucleoprotein, which processively adds
    TTGGGG telomeric repeats to the single-stranded 3' ends of chromosomes by reverse
    transcription of an internal template within the integral RNA subunit TER. The TRBD,
    RT and CTE domains of TERT form a ring around the active-site cavity; TERT residues
    within and beyond the RT motifs set the 5' and 3' template boundaries, the
    processivity of nucleotide and repeat addition, and selection of deoxy- over
    ribonucleotides.
