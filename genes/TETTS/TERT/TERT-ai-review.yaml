    label: chromosome, telomeric region
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  supporting_entities:
  - UniProtKB-SubCell:SL-0276
  review:
    summary: >-
      Telomerase acts at chromosome ends, and the holoenzyme is physically bridged to
      telomeres by its accessory subunits; TERT travels with it as the catalytic subunit.
      UniProt records Chromosome, telomere for this entry, citing PubMed:16462747
      alongside its rule-based assertion.
    action: ACCEPT
    reason: >-
      Correct site of action. The Tetrahymena-specific support is indirect, resting on
      TEN-domain binding of a single-stranded telomeric primer plus in vivo telomere
      elongation rather than on a microscopy or ChIP localisation in the cached
      literature, but the claim is not in doubt and no more precise component term is
      warranted. Note that the recruitment machinery itself (p50, Teb1/TEB) belongs to
