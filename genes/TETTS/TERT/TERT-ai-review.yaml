suggested_questions:
- question: >-
    Does Tetrahymena TERT localise to the macronucleus, the micronucleus, or both? The
    generic GO:0005634 nucleus term is retained in this review because no cached source
    distinguishes the two nuclei, yet GO:0031039 macronucleus and GO:0031040 micronucleus
    exist and the two nuclei differ radically in telomere number and replication mode.
- question: >-
    Should GO offer a way to record that telomerase activity is a property of the TERT-TER
    ribonucleoprotein rather than of the protein alone? TERT carries the active site but
    cannot catalyse anything without its integral RNA subunit, and the existing
    enables/contributes_to distinction does not capture a protein-RNA holoenzyme cleanly.
- question: >-
    Is the sequence-specific single-stranded telomeric DNA binding of the TERT TEN domain
    an anchor site distinct from the primer-template duplex in the active site, and is it
    retained across non-ciliate TERTs, or is it a ciliate elaboration like the CP2 motif?
- question: >-
    Which Tetrahymena holoenzyme subunit should carry a processivity-related GO term? The
    cached literature assigns high repeat-addition processivity to Teb1/p82 and the p50
    hub rather than to TERT, so a processivity annotation on TERT would misplace the
    function.
suggested_experiments:
- description: >-
    Tag endogenous TERT and image it relative to macronuclear and micronuclear markers
    through the vegetative cell cycle and through conjugation, when new macronuclear
    telomeres are added de novo.
  hypothesis: >-
    TERT is predominantly macronuclear in vegetative cells and is recruited to the
    developing macronucleus during conjugation, which would justify refining GO:0005634
    nucleus to GO:0031039 macronucleus.
- description: >-
    Separate the TEN-domain primer-anchor site from the active site by combining the TEN
    surface-groove substitutions that abolish sequence-specific single-stranded telomeric
    DNA binding with primers whose 3' permutation forces different active-site registers,
    measuring binding by fluorescence anisotropy and activity by direct primer extension.
  hypothesis: >-
    The TEN groove is a separate single-stranded telomeric DNA anchor whose loss reduces
    primer affinity and repeat-addition processivity without altering the chemistry of
    nucleotide addition.
- description: >-
    Reconstitute the full nine-subunit holoenzyme from recombinant parts and
    systematically omit the p50, TEB and CST modules while measuring repeat-addition
    processivity and telomeric-DNA binding of TERT-TER alone versus each partial assembly.
  hypothesis: >-
    Processivity and telomere engagement are contributed by p50, TEB and CST and not by
    TERT, so these functions should be annotated on those subunits rather than on TERT.
