  title: Crystal structure of the essential N-terminal domain of telomerase reverse
    transcriptase.
  findings:
  - statement: >-
      Conserved surface residues in a groove of the Tetrahymena TERT TEN domain are
      required for catalytic activity, and several are required for sequence-specific
      binding of a single-stranded telomeric DNA primer.
    supporting_text: These residues are crucial for telomerase catalytic activity, and
      several of them are required for sequence-specific binding of a single-stranded
      telomeric DNA primer.
  - statement: >-
      The TEN domain's positively charged C terminus binds RNA non-sequence-specifically
