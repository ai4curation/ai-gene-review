- term:
    id: GO:0042162
    label: telomeric repeat DNA binding
  evidence_type: IDA
  original_reference_id: PMID:16462747
  qualifier: enables
  review:
    summary: >-
      The TEN crystal structure paper showed that conserved surface residues of the
      Tetrahymena TERT N-terminal domain are required for sequence-specific binding of a
      single-stranded telomeric DNA primer. What TERT engages is the single-stranded 3'
