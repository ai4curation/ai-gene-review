    label: telomerase catalytic core complex
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: part_of
  supporting_entities:
  - PANTHER:PTN002635846
  review:
    summary: >-
      TERT is a constituent of the minimal catalytic core of telomerase, which in
      Tetrahymena is TERT plus the RNA subunit TER plus the La-family protein p65/TAP65.
      The GO definition of this complex, a catalytic reverse transcriptase subunit
      together with an RNA subunit that provides the template for telomeric DNA addition,
      describes TERT's situation exactly.
    action: ACCEPT
    reason: >-
      The TreeGrafter/PAINT node placement is sound. TERT is by definition the
      reverse-transcriptase subunit of the telomerase catalytic core, and the Tetrahymena
      core has been resolved structurally as TERT-TER-p65. This term is more specific than
      the GO:0005697 holoenzyme rows and is retained as the core complex assignment.
    additional_reference_ids:
