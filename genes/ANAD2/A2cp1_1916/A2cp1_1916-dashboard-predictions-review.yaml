      supported by any fused gene in the pangenome.
- id: PMID:38930854
  title: Characterization of Two Glycoside Hydrolases of Family GH13 and GH57, Present in a Polysaccharide Utilization Locus (PUL) of Pontibacter sp. SGAir0037.
  findings:
  - statement: The characterized GH57_6 member PoGH57 acts on alpha-1,4-glucans.
    supporting_text: >-
      It can be concluded that the PUL of Pontibacter sp. SGAir0037 contains only one GBE
      (in family GH13_9), and the GH57 enzyme acts as an α-1,4-glucanotransferase.
