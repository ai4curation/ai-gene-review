    summary: >-
      Correct and not in GOA, which has only GO:0003824 catalytic activity and GO:0005975
      carbohydrate metabolic process (InterPro IEA). A2cp1_1916 has a GH57 catalytic
      domain followed by DUF3536 and keeps the GH57 nucleophile Glu154 and proton donor
