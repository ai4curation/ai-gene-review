- term:
    id: GO:0005975
    label: carbohydrate metabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR004300
  - InterPro:IPR011330
  review:
    summary: >-
      Correct but general. The substrate class inferred from the subfamily is alpha-glucan,
      so alpha-glucan metabolic process is the better term.
    action: MODIFY
    reason: >-
      Every characterized GH57_6 enzyme acts on alpha-1,4-glucans (alpha-amylases and
      PoGH57, which acts on amylose and maltodextrin; PMID:38930854), and A2cp1_1916 keeps
      the GH57 catalytic residues, so it very probably performs a step in alpha-glucan
      metabolism. The inference rests on subfamily membership alone: A2cp1_1916 has no
      alpha-glucan or trehalose gene nearby, and no specific pathway (glycogen breakdown,
      trehalose synthesis) can be assigned.
    proposed_replacement_terms:
    - id: GO:0030978
      label: alpha-glucan metabolic process
    supported_by:
    - reference_id: PMID:38930854
      supporting_text: >-
        Both enzymes exhibited activity on amylose and MD18.
    - reference_id: file:ANAD2/A2cp1_1916/A2cp1_1916-bioinformatics/RESULTS.md
      supporting_text: >-
        The characterized GH57_6 members are three alpha-amylases (Pcal_0672, Amo45,
        Amy_GH57) and the Pontibacter PoGH57 (EC 2.4.1.25 and 3.2.1.1)
