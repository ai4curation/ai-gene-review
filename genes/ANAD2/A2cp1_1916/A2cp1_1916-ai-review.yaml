suggested_questions:
- question: >-
    What substrate does A2cp1_1916 act on in Anaeromyxobacter, given that it is not in a
    trehalose or glycogen gene cluster, and is it hydrolytic or a 4-alpha-glucanotransferase?
- question: >-
    Do the Geobacter (GSU2359) and Anaeromyxobacter orthologues share a substrate, or has
    the GH57_6 subfamily diversified alongside its varied gene neighbourhoods?
suggested_experiments:
- description: >-
    Express A2cp1_1916 and its E154A and D261A mutants and assay on amylose, glycogen,
    pullulan, maltooligosaccharides and trehalose-capped maltooligosaccharides, separating
    hydrolysis and disproportionation products by HPAEC-PAD.
  experiment_type: in vitro enzyme assay with catalytic mutants
