  label: Anaeromyxobacter dehalogenans 2CP-1
description: >-
  A2cp1_1916 is an uncharacterized 812-residue cytoplasmic glycoside hydrolase family 57
  (GH57) protein. It has an N-terminal GH57 catalytic domain followed by a DUF3536 domain
  (residues 338-621). CAZy places it in GH57 subfamily 6 (GH57_6), whose characterized
  members act on alpha-1,4-glucans: three alpha-amylases and the Pontibacter enzyme
  PoGH57, which hydrolyses amylose and maltodextrin and may act as a
  4-alpha-glucanotransferase. A2cp1_1916 keeps both GH57 catalytic residues, the
  nucleophile Glu154 and the proton donor Asp261, so it is very probably an active
  retaining alpha-glucan hydrolase or transglycosylase. Its nearest characterized relative
  is only 37.6-38.9% identical, and its substrate and reaction have not been tested. Unlike
  its Geobacter orthologue GSU2359 (45.4% identical), it is not encoded next to the
  trehalose genes treY and treZ, or any other alpha-glucan gene, in three Anaeromyxobacter
  genomes, and it is not fused to TreY. Its physiological role is therefore unknown. It is
  not an alpha-mannosidase: that word in the COG1449 name reflects the fold GH57 shares
  with GH38 alpha-mannosidases.
