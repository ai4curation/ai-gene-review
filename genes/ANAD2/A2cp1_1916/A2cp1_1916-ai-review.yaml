  review:
    summary: >-
      True but uninformative. A2cp1_1916 is a GH57 enzyme with both catalytic residues
      conserved, so a glycosidase term is supported.
    action: MODIFY
    reason: >-
      The InterPro2GO mapping gives only the root catalytic activity term. A2cp1_1916 keeps
      the GH57 nucleophile Glu154 (CSR-3) and proton donor Asp261 (CSR-4) at the HMM
      positions defined by experimentally characterized GH57 enzymes, and these residues
      are conserved in essentially all DUF3536 proteins. CAZy places it in GH57_6, whose
      characterized members are alpha-amylases and PoGH57, a mainly hydrolytic
      alpha-1,4-glucan enzyme (PMID:38930854). Hydrolysis of O-glycosyl bonds
      (GO:0004553) is therefore supported as the activity class. A specific enzyme term
      would go beyond the evidence: the nearest characterized relative is under 40%
      identical and has not been assayed alongside A2cp1_1916.
    proposed_replacement_terms:
    - id: GO:0004553
      label: hydrolase activity, hydrolyzing O-glycosyl compounds
