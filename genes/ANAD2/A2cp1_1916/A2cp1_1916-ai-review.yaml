core_functions:
- description: >-
    Retaining GH57 (subfamily 6) glycosidase, probably acting on alpha-1,4-glucosidic
    bonds of alpha-glucans with Glu154 as nucleophile and Asp261 as proton donor; substrate,
    reaction mode (hydrolysis or 4-alpha-glucanotransfer) and pathway untested.
