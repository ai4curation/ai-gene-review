id: P27249
gene_symbol: glnD
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: GlnD is the bifunctional uridylyltransferase/uridylyl-removing enzyme (UTase/UR) of Escherichia
  coli K-12, a soluble single-chain protein of about 95 kDa that acts as the primary nitrogen sensor of
  the cell. Its N-terminal nucleotidyltransferase domain transfers UMP from UTP to a tyrosine residue of
  the PII signal transduction proteins GlnB and GlnK, and its central HD domain hydrolyses PII-UMP back
  to PII and UMP. Glutamine inhibits uridylylation and stimulates deuridylylation, probably via the C-terminal
  ACT domains, so that PII is uridylylated under nitrogen limitation and deuridylylated under nitrogen
  excess. The uridylylation state of PII in turn controls the adenylylation of glutamine synthetase by
  GlnE and the NtrB/NtrC two-component system, making GlnD central to the regulation of nitrogen assimilation
  and nitrogen-regulated gene expression.
