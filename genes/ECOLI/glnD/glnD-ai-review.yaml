proposed_new_terms:
- proposed_name: '[protein-PII]-uridylyl-L-tyrosine hydrolase activity'
  proposed_definition: 'Catalysis of the reaction: [protein-PII]-uridylyl-L-tyrosine + H2O = [protein-PII]-L-tyrosine
    + UMP + H+ (RHEA:48600).'
  justification: The uridylyl-removing activity of GlnD is experimentally established and biochemically
    distinct from its uridylyltransferase activity (separate HD domain, separable by mutagenesis), but
    GO only offers the generic GO:0008081 phosphoric diester hydrolase activity. A specific child of GO:0008081
    would let both halves of the bifunctional enzyme be annotated at equal precision.
  supported_by:
  - reference_id: PMID:6130097
    supporting_text: The purified enzyme catalyzes the uridylylation as well as the deuridylylation of the
      regulatory protein PII
  - reference_id: file:ECOLI/glnD/glnD-uniprot.txt
    record_section:
    - FT:MUTAGEN
    supporting_text: 'HD->AA,QN: Loss of UR activity, while no significant'
suggested_questions:
- question: Where exactly does glutamine bind GlnD, and do the two C-terminal ACT domains act together
    or separately to reciprocally inhibit the UTase and stimulate the UR activity?
- question: How do GlnB and GlnK differ as GlnD substrates in vivo, and does differential uridylylation
    kinetics contribute to their distinct regulatory roles?
- question: Should GO represent the PII substrate relationship via has_input on GlnD activity in GO-CAM
    models rather than through protein binding annotations?
suggested_experiments:
- experiment_type: structural biology
  description: Determine cryo-EM or crystal structures of full-length GlnD in complex with PII/PII-UMP,
    with and without glutamine, to define the glutamine site and the conformational switch between the
    NT and HD active sites.
- experiment_type: site-directed mutagenesis and kinetics
  description: Mutate conserved ACT-domain residues and measure glutamine sensitivity of UTase and UR
    activities with purified GlnB and GlnK to map the sensing mechanism.
