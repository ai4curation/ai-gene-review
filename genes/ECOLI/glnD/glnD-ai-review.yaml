  review:
    summary: Represents the uridylyl-removing (UR) activity, hydrolysis of PII-uridylyl-tyrosine to PII
      and UMP.
    action: ACCEPT
    reason: The UR reaction hydrolyses the phosphodiester linking UMP to Tyr51 of PII, yielding UMP (a phosphomonoester)
      and the free tyrosine hydroxyl, which matches the GO:0008081 definition. No more specific GO term
      for the PII uridylyl-removing reaction (RHEA:48600) exists (checked against the local GO database
      and QuickGO search), so this is as precise as GO currently allows; a new term is proposed below.
      Purified GlnD catalyses deuridylylation, and HD-motif mutations abolish UR activity without affecting
      UTase activity.
    supported_by:
    - reference_id: PMID:6130097
      supporting_text: The purified enzyme catalyzes the uridylylation as well as the deuridylylation of
        the regulatory protein PII, demonstrating that a single bifunctional enzyme is involved in the
        covalent interconversion of PII.
