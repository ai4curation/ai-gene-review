id: P0C7L2
gene_symbol: paaJ
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  PaaJ is the beta-ketothiolase of the aerobic, CoA-thioester-based phenylacetate
  catabolic pathway of Escherichia coli, encoded in the paaABCDEFGHIJK operon. It acts
  twice in the beta-oxidation-like lower part of the pathway. First, it cleaves the
  ring-opening product 3-oxo-5,6-dehydrosuberyl-CoA with CoA, releasing acetyl-CoA and
  a C6 dehydroadipyl-CoA that is then hydrated by PaaF and oxidized by PaaH. Second,
  in the last step of the pathway, it cleaves 3-oxoadipyl-CoA (beta-ketoadipyl-CoA)
  to succinyl-CoA and acetyl-CoA, linking phenylacetate degradation to central
  metabolism. PaaJ belongs to the thiolase family (PcaF-type 3-oxoadipyl-CoA
  thiolases) and acts as a stand-alone enzyme rather than as part of a FadBA-like
  complex. paaJ deletion mutants cannot grow on phenylacetate.
