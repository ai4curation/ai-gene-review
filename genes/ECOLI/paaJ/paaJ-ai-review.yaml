proposed_new_terms:
- proposed_name: 3-oxo-5,6-didehydrosuberyl-CoA thiolase activity
  proposed_definition: 'Catalysis of the reaction: 3-oxo-5,6-didehydrosuberyl-CoA + CoA
    = 2,3-didehydroadipoyl-CoA + acetyl-CoA (EC 2.3.1.223; RHEA:34799).'
  justification: EC 2.3.1.223 and RHEA:34799 describe the PaaJ C8 thiolysis step of
    the aerobic phenylacetate pathway, but GO has no specific term for it; only the
    generic GO:0003988 is available.
  proposed_parent:
    id: GO:0003988
    label: acetyl-CoA C-acyltransferase activity
suggested_questions:
- question: Does E. coli PaaJ itself catalyze the 3,4- to 2,3-dehydroadipyl-CoA
    isomerization, or is this done only by PaaG?
- question: Has the C8 thiolysis activity been measured with the E. coli PaaJ protein
    rather than the Pseudomonas sp. Y2 ortholog?
suggested_experiments:
- description: Assay purified E. coli PaaJ, with and without PaaG, using enzymatically
    generated 3-oxo-5,6-dehydrosuberyl-CoA. Identify the dehydroadipyl-CoA isomer formed
    by NMR and determine kinetics for both the C8 and C6 (3-oxoadipyl-CoA) substrates.
