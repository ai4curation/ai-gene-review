  review:
    summary: Propagation of fatty acid beta-oxidation from eukaryotic and FadA-type
      3-ketoacyl-CoA thiolases to the phenylacetate-pathway thiolase.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The donors (yeast POT1, mammalian ACAA1 and E. coli FadA) are bona fide fatty
      acid beta-oxidation thiolases. E. coli PaaJ, however, belongs to the PcaF-type
      3-oxoadipyl-CoA thiolase group, is encoded in the paa operon, and cleaves
      aromatic-ring-derived dicarboxylic intermediates. It does not associate with PaaF
      and PaaH into a beta-oxidation complex, and no experiment implicates it in fatty
      acid degradation in E. coli. The chemistry is beta-oxidation-like, so the term is
      marked over-annotated rather than removed.
    supported_by:
