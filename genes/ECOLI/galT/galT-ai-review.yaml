suggested_questions:
- question: >-
    Does the interfacial iron site of E. coli GalT have a physiological role, for
    example in dimer stability under oxidative or metal-limited conditions, given
    that it is dispensable for activity in vitro?
- question: >-
    How much of the UDP-galactose used for E. coli surface glycans is made by GalT
    from exogenous galactose rather than by GalE from UDP-glucose under different
    growth conditions?
