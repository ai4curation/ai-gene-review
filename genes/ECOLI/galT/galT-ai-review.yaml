id: P09148
gene_symbol: galT
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  galT encodes galactose-1-phosphate uridylyltransferase (GalT, EC 2.7.7.12), the
  second gene of the galETKM operon of Escherichia coli K-12. GalT is a soluble
  homodimeric member of the histidine triad (HIT) superfamily, galactose-1-phosphate
  uridylyltransferase type 1 family. It catalyses the reversible reaction
  UDP-alpha-D-glucose + alpha-D-galactose 1-phosphate = alpha-D-glucose 1-phosphate +
  UDP-alpha-D-galactose by a double-displacement (ping-pong) mechanism: His166 of
  the conserved His164-Pro165-His166 triad attacks UDP-glucose to form a covalent
  uridylyl-enzyme (a phosphoramidate on His166 Nepsilon2) and release glucose
  1-phosphate, and the UMP is then transferred to galactose 1-phosphate to form
  UDP-galactose. Ser161 and Gln168 orient the phosphoryl groups, and the
  nucleotide-sugar site is built from residues of both subunits. Each subunit binds
  one structural zinc (Cys52, Cys55, His115, His164) that is essential for activity,
  and an iron at the subunit interface that is not required for activity. GalT
  performs the central step of the Leloir pathway of galactose utilization, between
  galactokinase (GalK) and UDP-glucose 4-epimerase (GalE). galT mutants are
  galactose-negative, and the human ortholog GALT is the enzyme deficient in
  classic galactosemia.
