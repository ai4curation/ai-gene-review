- term:
    id: GO:0008198
    label: ferrous iron binding
  evidence_type: IDA
  original_reference_id: PMID:7727423
  qualifier: enables
  review:
    summary: >-
      Metal analysis of purified E. coli GalT found up to 0.7 mol of iron per subunit
      in addition to zinc; the crystal structures place this iron at the subunit
      interface, coordinated by His281, Glu182, His296 and His298.
    action: KEEP_AS_NON_CORE
    reason: >-
      Iron binding is real (metal analysis and crystal structures), but occupancy is
      variable and the iron is not needed for activity: the E182A variant lacks iron
      yet keeps about half of wild-type activity (PMID:10529216). The abstract does
      not state the oxidation state of the bound iron; we defer to the curator on
      "ferrous", which is consistent with the FeSO4 supplementation experiment.
      Structural metal binding peripheral to the transferase function, so non-core.
    supported_by:
    - reference_id: PMID:7727423
      supporting_text: >-
        contains approximately 1.2 mol of tightly bound zinc/mol of
        subunits as well as variable amounts of iron, up to 0.7 mol/mol of subunits
    - reference_id: PMID:10529216
      supporting_text: >-
        It is concluded that the presence of zinc is essential for
        maintaining GalT function, whereas the presence of iron is not essential.
