- term:
    id: GO:0004335
    label: galactokinase activity
  evidence_type: IMP
  original_reference_id: PMID:18263746
  qualifier: enables
  review:
    summary: >-
      Kim et al. (2008) used an E. coli galactokinase (galK) knockout strain
      carrying L-arabinose isomerase to convert galactose to tagatose. The
      galactokinase activity row was attached to galT (GalT) rather than to galK.
    action: REMOVE
    reason: >-
      The abstract states explicitly that the strain studied is a galactose kinase
      gene knockout (DeltagalK), so the mutant phenotype concerns galK, not galT.
      GalT is a galactose-1-phosphate uridylyltransferase, a HIT-superfamily
      nucleotidyltransferase with no kinase domain, and has no reported
      galactokinase activity; galactokinase in E. coli is the GHMP kinase GalK
      (P0A6T3). The function is therefore contradicted for this gene product, not
      merely unverified. The defect is recorded for upstream correction.
    supported_by:
    - reference_id: PMID:18263746
      supporting_text: >-
        An Escherichia coli galactose kinase gene knockout (DeltagalK) strain, which
        contains the l-arabinose isomerase gene (araA) to isomerize d-galactose to
        d-tagatose, showed a high conversion yield of tagatose compared with the
        original galK strain because galactose was not metabolized by endogenous
        galactose kinase.
    - reference_id: PMID:10529216
      supporting_text: >-
        Galactose-1-phosphate uridylyltransferase (GalT) catalyzes the reversible
        transformation of UDP-glucose and galactose-1-phosphate (Gal-1-P) into
        UDP-galactose and glucose-1-phosphate (Glc-1-P) by a double displacement
        mechanism
