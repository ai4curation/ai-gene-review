gene_symbol: proB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  ProB is the cytosolic Escherichia coli glutamate 5-kinase, an
  ATP-dependent enzyme that phosphorylates L-glutamate to L-glutamyl
  5-phosphate in the first committed reaction of the bacterial L-proline
  biosynthetic branch from glutamate to L-glutamate 5-semialdehyde/P5C. Its
  amino-acid-kinase catalytic domain binds ATP, glutamate, and the feedback
  inhibitor proline, while its C-terminal PUA fold and Mg(2+) at the dimer
  interface tune catalytic and regulatory behavior in the oligomeric enzyme.
  ProB may functionally couple to ProA to transfer the unstable L-glutamyl
  5-phosphate intermediate, but direct physiological substrate channeling
  remains unresolved.
