  review:
    summary: >-
      The 1984 purification study reported a native enzyme assembled from
      identical ProB subunits, and later structures refined the oligomer as a
      tetramer formed as a dimer of dimers.
    action: KEEP_AS_NON_CORE
    reason: >-
      ProB clearly self-associates, so identical protein binding is supported
