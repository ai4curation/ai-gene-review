- term:
    id: GO:0003723
    label: RNA binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR002478
  - InterPro:IPR036974
  review:
    summary: >-
      This electronic assertion comes from generic PUA-domain InterPro
      mappings. E. coli ProB does contain a C-terminal PUA fold, but the
      ProB-specific papers assign that domain to modulation of kinase activity
      and oligomeric regulation rather than to RNA binding.
    action: REMOVE
    reason: >-
      The PUA fold is not sufficient evidence that ProB binds RNA. In ProB, the
      PUA domain sits in the enzyme oligomer, contacts the amino-acid-kinase
      domain, and modulates the Mg requirement, proline inhibition, and
      proline-triggered aggregation of the kinase. No ProB-specific RNA-binding
      evidence is present in the reviewed literature or in the UniProt record.
    additional_reference_ids:
    - PMID:16337196
    - PMID:17321544
    supported_by:
    - reference_id: PMID:16337196
      supporting_text: >-
        We propose that the PUA domain modulates the function of the AAK domain
    - reference_id: PMID:17321544
      supporting_text: >-
        The AAK and PUA domains of one subunit associate non-canonically in the
        dimer with the same domains of the other subunit
