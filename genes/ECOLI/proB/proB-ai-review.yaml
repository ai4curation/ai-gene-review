gene_symbol: proB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  ProB is the cytosolic Escherichia coli glutamate 5-kinase that uses ATP and Mg2+ to phosphorylate L-glutamate
  to L-glutamyl 5-phosphate in proline biosynthesis. Its amino-acid-kinase domain binds substrates and
  the feedback inhibitor proline; the C-terminal PUA domain modulates kinase regulation. The tetramer
  consists of functional dimers whose active-center interactions contribute to substrate binding. The
  unstable product feeds ProA without a required channeling complex under tested conditions. Purified
  ProB also binds selected RNA fragments weakly and specifically in vitro, with an unresolved physiological
  role.
