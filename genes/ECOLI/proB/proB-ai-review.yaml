  review:
    summary: >-
      Proline-binding-site and mutagenesis analyses showed that the E. coli
      enzyme has a dimeric functional unit with an intermolecular active-center
      network.
    action: ACCEPT
    reason: >-
      The functional dimer contains an intermolecular hydrogen-bond network connecting active-center cavities
      and contributing to substrate binding (PMID:20970428). This interface is an integral component of
      the oligomeric kinase architecture; retain it as core-associated rather than describing essential
      catalytic assembly as merely peripheral. The full enzyme is a tetramer composed of two dimers, not
      an isolated constitutive dimer.
    additional_reference_ids:
    - PMID:17321544
    supported_by:
    - reference_id: PMID:20970428
      supporting_text: >-
        the functional unit of the E. coli enzyme is dimeric and contains an
        intermolecular hydrogen-bond network that interconnects the
        active-center cavities of the monomers and is important for substrate
        binding.
    - reference_id: PMID:17321544
      supporting_text: >-
        E. coli G5K presents a novel tetrameric (dimer of dimers) architecture.
