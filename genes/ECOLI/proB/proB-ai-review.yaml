  review:
    summary: >-
      Direct in vitro analysis of purified wild-type and PUA-deleted E. coli
      glutamate 5-kinase retained the core kinase activity and tested how the
      PUA domain modulates it.
    action: ACCEPT
    reason: >-
      The paper studied E. coli G5K activity directly and showed that deleting
      the PUA domain leaves an active enzyme while altering Mg dependence and
      proline sensitivity. This is direct support for the glutamate 5-kinase
      molecular function.
    supported_by:
    - reference_id: PMID:16337196
      supporting_text: >-
        G5K lacking the PUA domain remains tetrameric, active, and
        proline-inhibitable, but the Mg requirement and the proline-triggered
        aggregation are greatly diminished and abolished, respectively, and
        more proline is needed for inhibition.
