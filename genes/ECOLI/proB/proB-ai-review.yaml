- id: file:ECOLI/proB/proB-uniprot.txt
  title: UniProtKB P0A7B5 proB Escherichia coli K-12 record
  findings:
  - statement: >-
      UniProt describes ProB as a glutamate 5-kinase that catalyzes
      ATP-dependent phosphorylation of L-glutamate.
    record_section: ["CC:FUNCTION"]
    supporting_text: >-
      Catalyzes the transfer of a phosphate group to glutamate to form
      L-glutamate 5-phosphate.
- id: PMID:16337196
  title: 'Dissection of Escherichia coli glutamate 5-kinase: functional impact of the deletion of the
    PUA domain.'
  findings:
  - statement: The E. coli PUA domain modulates kinase activity, Mg dependence and proline feedback.
    supporting_text: >-
      We show that wild-type G5K requires free Mg for activity, it is
      tetrameric, and it aggregates to higher forms in a proline-dependent
      way.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract available. PUA deletion does not test or exclude RNA binding;
      PMID:37511294 provides a later positive RNA-binding assay.
- id: PMID:17069808
  title: Mapping active site residues in glutamate-5-kinase. The substrate glutamate and the
    feed-back inhibitor proline bind at overlapping sites.
  findings:
  - statement: E. coli ProB mutagenesis identifies residues contributing to substrate binding and
      catalysis.
    supporting_text: >-
      The results support the predicted roles of K10, K217 and T169 in
      catalysis and ATP binding and of D150 in orienting the catalytic
      lysines.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract available. Retain curated Mg binding with independent
      structural/biochemical corroboration rather than inventing the unviewed full-text Mg assay.
- id: PMID:17321544
  title: A novel two-domain architecture within the amino acid kinase enzyme family revealed by the
    crystal structure of Escherichia coli glutamate 5-kinase.
  findings:
  - statement: E. coli ProB has a tetrameric dimer-of-dimers structure with Mg ions at a domain
      interface.
    supporting_text: >-
      leaving a negatively charged hole between them that hosts two Mg ions
      in one crystal, in line with the G5K requirement for free Mg
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract available. The geometry suggested channeling, but this was not a
      demonstrated ProA-ProB complex; newer PMID:39514317 directly challenges that inference. No
      negative RNA-binding assay is reported.
- id: PMID:18304323
  title: Protein abundance profiling of the Escherichia coli cytosol.
  findings:
  - statement: MC4100 cytosolic proteomics supports localization of proteins curated to the soluble
      compartment.
    supporting_text: >-
      Using a combination of LC-MS/MS approaches with protein and peptide
      fractionation steps we identified 1103 proteins from the cytosolic
      fraction of the Escherichia coli strain MC4100.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full main text available. MC4100 is the experimental strain. Target-specific table
      entries are not re-created from the general abstract; existing EcoCyc assignments are
      corroborated by independent ProA/ProB native-locus imaging in PMID:39514317.
- id: PMID:20970428
  title: Molecular mechanisms modulating glutamate kinase activity. Identification of the proline
    feedback inhibitor binding site.
  findings:
  - statement: The E. coli ProB functional dimer connects active-center cavities through an
      intermolecular network.
    supporting_text: the functional unit of the E. coli enzyme is dimeric
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract available; kinetic, mutagenesis, structural and docking methods support
      proline feedback and dimeric functional organization.
- id: PMID:4598010
  title: Proline excretion and indirect suppression in Escherichia coli and Salmonella typhimurium.
  findings:
  - statement: E. coli proB lesions block proline synthesis and can be bypassed through altered
      arginine metabolism.
    supporting_text: >-
      In proline auxotrophs blocked at an early step in proline biosynthesis
      (proA or proB), reversion to prototrophy is often due to a mutation in
      the arginine pathway
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract available; pathway participation is also established by the kinase
      reaction, not inferred solely from auxotrophy.
- id: PMID:6319365
  title: Purification and characteristics of a gamma-glutamyl kinase involved in Escherichia coli
    proline biosynthesis.
  findings:
  - statement: Purified E. coli glutamate kinase uses ATP and glutamate in proline biosynthesis.
    supporting_text: >-
      gamma-Glutamyl kinase, the first enzyme of the proline biosynthetic
      pathway, was purified to homogeneity from an Escherichia coli strain
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract available; the major preparation is a proline-analogue-resistant strain,
      with a sensitive comparator. Do not transfer its 100-fold feedback difference to wild-type
      ProB. Dependence on a ProA-coupled assay does not prove a physical complex, as reconsidered in
      PMID:39514317.
- id: PMID:37511294
  title: Investigating the Prevalence of RNA-Binding Metabolic Enzymes in E. coli.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text read. ProB is a K-12 ASKA-derived pET21a construct with C-terminal His
      tag, expressed in BL21-Gold(DE3). Its positive evidence is SELEX and competition EMSA, not a
      positive ProB iCLIP assay. Estimated KD >>10 micromolar. Transfer to other species is not
      established. The older ProA-complex statement in the discussion is a hypothesis, challenged by
      PMID:39514317.
  findings:
  - statement: K-12 ProB shows specific but weak RNA binding in purified-protein assays; target-site
      identity and native biological role remain unresolved.
    supporting_text: Representative EMSA experiments with one of those sequences confirmed the
      specific binding.
- id: PMID:39514317
  title: 'Challenging a decades-old paradigm: ProB and ProA do not channel the unstable intermediate in
    proline synthesis after all.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full primary text read. His6-ProA from ASKA was purified in engineered BL21(DE3);
      ProB was expressed as tagged/untagged protomers and the SUMO tag removed. Growth
      complementation used BW25113 derivatives, including heterologous proB replacements or
      overexpressed alternative reductases. Native-locus monomeric-GFP fusions support cytoplasmic
      localization. Failed crosslinking alone is not proof of universal absence; diffusion and GP
      lifetime values are calculations, not direct intracellular measurements.
  findings:
  - statement: E. coli ProA and ProB support sequential proline synthesis without a required
      channeling complex under the tested conditions.
    supporting_text: By changing the structures of either the kinase or the reductase, we show that
      channeling is not required to support proline synthesis in vivo.
  - statement: Native-locus monomeric-GFP ProA and ProB fusions distribute throughout the cytoplasm,
      unlike overexpressed GFP fusion aggregates.
    supporting_text: When we express ProB and ProA tagged with monomeric superfolder GFP (msfGFP)
      from a gene integrated into the native locus, both proteins are dispersed throughout the
      cytoplasm
proposed_new_terms: []
suggested_questions:
- question: Do growth conditions outside those tested in PMID:39514317 produce a specific ProA–ProB
    interaction, despite the evidence that channeling is unnecessary for proline synthesis under the
    tested conditions?
suggested_experiments:
- hypothesis: Environmental or metabolic conditions not tested in PMID:39514317 could produce a
    conditional ProA–ProB association without making channeling obligatory.
  description: Extend native-locus interaction and flux measurements to defined osmotic and nutrient
    perturbations, with monomeric reporter tags, expression controls and diffusion-compatible
    kinetic models. Compare any observed association with the non-channeling glucose-growth
    conditions of PMID:39514317 rather than presuming a constitutive complex.
  experiment_type: conditional interaction and metabolic-flux analysis
