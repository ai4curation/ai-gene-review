id: P0AG18
gene_symbol: purE
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: PurE is the class I N5-carboxyaminoimidazole ribonucleotide (N5-CAIR) mutase of Escherichia
  coli, a homooctameric cytosolic enzyme that transfers the carbamate carboxylate of N5-CAIR directly
  to C4 of the imidazole ring to form CAIR. Together with the N5-CAIR synthetase PurK it carries out AIR
  carboxylation, step 6 of de novo IMP biosynthesis; unlike the class II PurE of animals it does not use
  free CO2.
