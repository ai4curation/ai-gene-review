suggested_questions:
- question: Which active-site differences make E. coli class I PurE unable to use free CO2, unlike the
    class II PurE domain of animal PAICS?
suggested_experiments:
- description: Swap residues that differ between class I and class II PurE (for example around the conserved
    histidine) and test the variants for N5-CAIR mutase versus CO2-dependent AIR carboxylase activity.
