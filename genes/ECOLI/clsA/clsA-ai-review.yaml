suggested_questions:
- question: How is ClsA targeted to and retained at the cell poles, and does local cardiolipin synthesis,
    rather than diffusion, create the polar cardiolipin domains?
- question: What is the physiological significance of the N-terminal processing of ClsA from the 53-55
    kDa to the 45-46 kDa form?
suggested_experiments:
- description: Compare polar enrichment of cardiolipin (using a cardiolipin-specific probe) in cells expressing
    wild-type ClsA versus the catalytically inactive H224A/H404A variant complemented by ClsB, to separate
    local synthesis from bulk cardiolipin supply.
