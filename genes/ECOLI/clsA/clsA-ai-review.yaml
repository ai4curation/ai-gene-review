gene_symbol: clsA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: ClsA (Cls) is the major cardiolipin synthase of Escherichia coli. It is a phospholipase D
  (PLD) superfamily enzyme anchored in the inner membrane by two N-terminal transmembrane helices, with
  two cytoplasmic HKD catalytic motifs. It catalyses reversible phosphatidyl transfer between two phosphatidylglycerol
  molecules, giving cardiolipin and glycerol. ClsA is the only cardiolipin synthase active during logarithmic
  growth; its activity rises in stationary phase and at high osmolarity, where ClsB and ClsC also contribute.
  ClsA and its product concentrate at the cell poles, where cardiolipin helps localize membrane proteins
  such as the osmosensing transporter ProP. Purified ClsA is inhibited by cardiolipin and phosphatidate.
