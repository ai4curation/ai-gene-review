- id: PMID:29280215
  title: Cardiolipin synthase A colocalizes with cardiolipin and osmosensing transporter ProP at the poles
    of Escherichia coli cells.
  findings:
  - statement: ClsA is membrane-anchored with two cytoplasmic catalytic domains and is concentrated at
      the poles.
    supporting_text: ClsA was shown to be N-terminally processed and membrane-anchored, with dual, cytoplasmic,
      catalytic domains.
- id: PMID:2982784
  title: Alteration of phospholipid composition by combined defects in phosphatidylserine and cardiolipin
    synthases and physiological consequences in Escherichia coli.
  findings:
  - statement: Combined cls and pss defects alter phospholipid composition.
    supporting_text: The cls pss-1 double mutation caused an unusual accumulation of phosphatidylglycerol
      with an extremely low content of cardiolipin.
- id: PMID:353047
  title: Function of phospholipids in Escherichia coli. Characterization of a mutant deficient in cardiolipin
    synthesis.
  findings:
  - statement: The cls mutant is deficient in cardiolipin.
    supporting_text: Exponentially growing cells show a reduction in cardiolipin content by a factor of
      at least 15
- id: PMID:7918616
  title: The effects of phosphoglycerides on Escherichia coli cardiolipin synthase.
  findings:
  - statement: Purified cardiolipin synthase converts two PG molecules to CL and glycerol and is inhibited
      by CL.
    supporting_text: The enzyme is inhibited by the product of the reaction, cardiolipin, and by phosphatidate.
- id: PMID:22988102
  title: Discovery of a cardiolipin synthase utilizing phosphatidylethanolamine and phosphatidylglycerol
    as substrates.
  findings:
  - statement: Only ClsA contributes cardiolipin during logarithmic growth at low osmolarity.
    supporting_text: However, only ClsA contributes detectible levels of CL at low osmolarity during logarithmic
      growth.
