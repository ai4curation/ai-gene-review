id: P0A812
gene_symbol: ruvB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: RuvB is the ATP-driven motor of the Escherichia coli RuvAB Holliday-junction branch-migration
  complex. It is a AAA+ ATPase that assembles as hexameric rings; two oppositely oriented RuvB rings bind
  the duplex arms of a junction held open by RuvA and, by hydrolyzing ATP, pump DNA through the complex
  so that the crossover point migrates. RuvA supplies junction specificity and loads RuvB, although excess
  RuvB can drive branch migration alone. RuvB also interacts with the RuvC resolvase, stimulating its
  cleavage of the migrated junction within a RuvABC assembly. The ruvAB operon is LexA-repressed and DNA-damage
  inducible, and RuvAB functions in recombinational repair and at reversed replication forks.
