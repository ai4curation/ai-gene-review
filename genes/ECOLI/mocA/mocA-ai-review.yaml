id: Q46810
gene_symbol: mocA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  MocA (formerly YgfJ) is the molybdenum cofactor cytidylyltransferase of Escherichia coli. It
  transfers CMP from CTP to Mo-molybdopterin, forming Mo-molybdopterin cytosine dinucleotide
  (MCD) and pyrophosphate. The reaction requires Mg2+ (Mn2+ substitutes at half efficiency) and
  is specific for CTP; ATP and GTP are not used. MocA is a monomer that binds CTP and Mo-MPT
  1:1 with submicromolar to micromolar affinity; without molybdate it converts MPT to MCD for
  only one turnover, and the product stays bound. MocA is a paralog of the
  guanylyltransferase MobA (22% identity): its N-terminal domain sets nucleotide specificity
  and its C-terminal domain binds the MCD-specific chaperone PaoD. MocA is essential for
  activity of the MCD-containing enzymes, the periplasmic aldehyde oxidoreductase PaoABC
  (YagTSR) and the xanthine dehydrogenases XdhABC and XdhD.
