    label: magnesium ion binding
  evidence_type: IDA
  original_reference_id: PMID:19542235
  qualifier: enables
  review:
    summary: MgCl2 is required for MCD synthesis by MocA in the defined in vitro system; Mn2+ can
      partly replace it.
    action: KEEP_AS_NON_CORE
    reason: Mg2+ is an essential cofactor of the cytidylyl transfer, so metal binding is real but
      subsidiary to the catalytic function (same treatment as MobA).
    supported_by:
    - reference_id: PMID:19542235
      supporting_text: Using a fully defined in vitro assay, we showed that MocA, Mo-MPT, CTP, and
        MgCl2 are required and sufficient for MCD biosynthesis in vitro.
