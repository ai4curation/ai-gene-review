suggested_questions:
- question: Does MocA transfer MCD directly to PaoD (and to the XdhABC/XdhD chaperones), and is
    that handover what releases product and limits the slow turnover measured in vitro?
suggested_experiments:
- hypothesis: PaoD accepts MCD directly from MocA and accelerates MocA turnover.
  description: Measure MocA turnover in the defined assay with and without purified PaoD, and
    follow MCD transfer from MocA to PaoD by size-exclusion separation and cofactor analysis.
