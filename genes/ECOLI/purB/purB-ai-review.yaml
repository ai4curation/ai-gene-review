id: P0AB89
gene_symbol: purB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: 'PurB is the adenylosuccinate lyase of Escherichia coli, a homotetrameric cytosolic enzyme
  of the fumarase/argininosuccinate lyase superfamily. It catalyses two beta-elimination reactions releasing
  fumarate: cleavage of SAICAR to AICAR in de novo IMP biosynthesis, and cleavage of adenylosuccinate
  to AMP in AMP synthesis from IMP. During infection by phages that encode 2-aminoadenine (Z) DNA synthesis,
  it also cleaves the phage-made dZ precursor.'
