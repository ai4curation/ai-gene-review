  evidence_type: IEP
  original_reference_id: PMID:11967071
  qualifier: acts_upstream_of_or_within
  review:
    summary: Transcriptome-wide expression change after mitomycin C, not a role in the DNA damage response.
    action: MARK_AS_OVER_ANNOTATED
    reason: The source is a microarray survey in which nearly 30% of all E. coli genes changed expression
      after mitomycin C treatment. A change in transcript level of a biosynthetic enzyme does not show
      that the enzyme takes part in sensing or repairing DNA damage, and no purine-pathway-specific follow-up
      is reported. Consistent with other E. coli metabolic genes annotated from this study.
    supported_by:
    - reference_id: PMID:11967071
      supporting_text: Changes in gene expression after treatment of Escherichia coli cultures with mitomycin
        C were assessed using gene array technology.
