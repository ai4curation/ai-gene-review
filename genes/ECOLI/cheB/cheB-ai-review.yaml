id: P07330
gene_symbol: cheB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  CheB is the chemotaxis protein-glutamate methylesterase/protein-glutamine glutaminase
  of Escherichia coli, a 349-residue two-domain response regulator of the CheB family.
  Its N-terminal receiver (REC) domain is phosphorylated on Asp56 by the histidine
  kinase CheA, which relieves autoinhibition of the C-terminal CheB-type catalytic
  domain (Ser164/His190/Asp286 catalytic triad). Phospho-CheB hydrolyses the
  glutamyl 5-O-methyl esters that CheR places on the cytoplasmic signalling domains of
  the methyl-accepting chemotaxis receptors (Tar, Tsr, Trg, Tap), releasing
  methanol, and it also irreversibly deamidates specific receptor glutamine residues to
  methyl-accepting glutamates. CheB docks on the C-terminal NWETF pentapeptide of the
  high-abundance receptors and acts on neighbouring receptors within receptor arrays.
  Because CheA activity is stimulated by repellents and inhibited by attractants,
  demethylation is coupled to receptor signalling state, giving the negative feedback
  that underlies sensory adaptation in chemotaxis. CheB is a soluble cytoplasmic
  protein that also partitions with the inner membrane through its association with
  receptors; null mutants tumble incessantly and are non-chemotactic.
