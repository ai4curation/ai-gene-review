    label: cytosol
  supported_by:
  - reference_id: PMID:3280143
    supporting_text: the phosphate group on CheA can be rapidly transferred to CheB,
      a protein involved in adaptation to stimuli
  - reference_id: PMID:2188960
    supporting_text: activation of the methylesterase activity of CheB involves phosphorylation
      of CheB by CheA
  - reference_id: PMID:7578071
    supporting_text: CheB bound to CheA1-233 with a KD of 3.2 microM, and also bound
      to intact CheA with the same affinity.
