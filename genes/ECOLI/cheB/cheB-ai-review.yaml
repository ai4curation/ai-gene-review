  review:
    summary: Li and Hazelbauer assayed CheB-catalysed demethylation and deamidation of
      receptors in membrane vesicles containing Tar and Trg.
    action: MODIFY
    reason: CheB has no transmembrane segment; it is a peripheral protein that acts on
      the cytoplasmic domains of membrane-embedded receptors. Activity on receptors in
      membrane vesicles supports association with the cytoplasmic face of the membrane,
      not residence in the bilayer, so the plasma membrane claim is better expressed
      as cytoplasmic side of plasma membrane (GO:0009898, part_of plasma membrane), whose
      definition includes peripherally associated proteins. This is an in vitro
