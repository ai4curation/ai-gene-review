  review:
    summary: CheB is a two-domain response regulator whose N-terminal receiver domain
      accepts a phosphoryl group from the CheA histidine kinase; phosphorylation activates
      the C-terminal methylesterase. Stewart et al. (1990) showed that CheB variants
      unable to be activated by negative stimuli were not phosphorylated by CheA.
