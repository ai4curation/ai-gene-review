- term:
    id: GO:1990827
    label: deaminase binding
  evidence_type: IDA
  original_reference_id: PMID:15916610
  qualifier: enables
  review:
    summary: CAFA annotation of "deaminase binding" from the receptor-assistance study.
      The paper shows that receptors (Tar) carrying the NWETF pentapeptide assist CheB
      action on neighbouring receptors (Trg).
    action: REMOVE
    reason: GO:1990827 is defined as "Binding to an enzyme that catalyzes the removal
      of an amino group from a substrate, producing ammonia". In this system CheB is
      itself the deamidase; nothing in the paper shows CheB binding another deaminase.
      The only binding implied is the docking of CheB onto the receptor NWETF pentapeptide,
      which would be a property of the receptor (binding a deaminase), not of CheB, and
      for CheB is captured as signaling receptor binding (MODIFY of the PMID:10485883
      row). The term is attached to the wrong participant.
    supported_by:
    - reference_id: PMID:15916610
      supporting_text: only high-abundance receptors carry the carboxyl-terminal pentapeptide
        sequence NWETF that enhances adaptational covalent modification
    - reference_id: PMID:10485883
      supporting_text: the pentapeptide serves as a docking site for the methylesterase/deamidase
    source_defects:
    - defect_type: WRONG_TERM
      resource: CAFA
      slot: GO_ID
      requested_change: CHECK
      asserted_value: GO:1990827
      confidence: PROBABLE
      explanation: >-
        CAFA-assigned IDA from PMID:15916610 gives CheB (P07330) "deaminase binding".
        CheB is the deamidase (EC 3.5.1.44); the binding that the study implies is
        CheB docking on the chemoreceptor C-terminal NWETF pentapeptide. Deaminase
        binding would describe the receptor (Tar, P07017), not CheB. Either delete
        the row or, if a CheB binding claim is intended, use signaling receptor
        binding (GO:0005102), which is better supported by PMID:10485883.
core_functions:
- description: Receptor methylesterase. Phosphorylated (activated) CheB hydrolyses
    glutamyl 5-O-methyl esters placed by CheR on the cytoplasmic signalling domain
    of methyl-accepting chemoreceptors, releasing methanol. CheB docks on the receptor
    C-terminal NWETF pentapeptide and acts on receptors within the array; because
    CheA activity controls CheB phosphorylation, demethylation provides the negative
    feedback for sensory adaptation.
  molecular_function:
    id: GO:0008984
    label: protein-glutamate methylesterase activity
  directly_involved_in:
  - id: GO:0006482
    label: protein demethylation
  - id: GO:0006935
    label: chemotaxis
  locations:
  - id: GO:0009898
    label: cytoplasmic side of plasma membrane
  supported_by:
  - reference_id: PMID:358191
    supporting_text: This enzyme catalyzes the hydrolysis of gamma-glutamyl methyl ester
      residues from membrane-bound 60,000-molecular weight proteins that are essential
      for chemotaxis.
  - reference_id: PMID:2188960
    supporting_text: control the activity of CheB, the enzyme responsible for removing
      receptor methyl ester groups
  - reference_id: PMID:392505
    supporting_text: Both methods showed that addition of attractants causes a transient
      inhibition of MCP demethylation.
  - reference_id: PMID:10485883
    supporting_text: the pentapeptide serves as a docking site for the methylesterase/deamidase
- description: Receptor glutamine deamidase. The same catalytic domain irreversibly
    hydrolyses specific receptor glutamine side chains to glutamate (releasing ammonia),
    creating additional methyl-accepting sites (e.g. Tsr Gln297 and Gln311).
  molecular_function:
    id: GO:0050568
    label: protein-glutamine glutaminase activity
  directly_involved_in:
  - id: GO:0006935
    label: chemotaxis
  locations:
  - id: GO:0009898
    label: cytoplasmic side of plasma membrane
  supported_by:
  - reference_id: PMID:6304723
    supporting_text: suggests that CheB-dependent modification of MCPI is the enzymatic
      deamidation of glutamine to methyl-accepting glutamic acid
  - reference_id: PMID:2033064
    supporting_text: The other two sites are glutamines and two methyl-accepting sites
      are created by two distinct deamidations.
  - reference_id: PMID:10485883
    supporting_text: The esterase is also a deamidase that creates certain methyl-accepting
      glutamyls by hydrolysis of glutamine side chains.
- description: Phosphorelay response regulator. The N-terminal receiver domain binds
    CheA and accepts a phosphoryl group from CheA-P (Asp56), which relieves inhibition
    of the catalytic domain; CheB then autodephosphorylates, making its activity
    track the receptor-controlled kinase activity of CheA.
  molecular_function:
