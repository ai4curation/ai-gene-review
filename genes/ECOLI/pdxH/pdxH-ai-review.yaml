- id: file:interpro/panther/PTHR10851/PTHR10851-paint.tsv
  title: PAINT IBD nodes for PTHR10851
  findings: []
core_functions:
- description: >-
    FMN-dependent O2-linked oxidation of pyridoxine 5'-phosphate (preferred in vivo) and pyridoxamine
    5'-phosphate to pyridoxal 5'-phosphate, the terminal step of de novo PLP synthesis that
    also serves B6 salvage.
  molecular_function:
    id: GO:0004733
    label: pyridoxamine phosphate oxidase activity
  directly_involved_in:
  - id: GO:0042823
    label: pyridoxal 5'-phosphate biosynthetic process
  - id: GO:0036001
    label: '''de novo'' pyridoxal 5''-phosphate biosynthetic process'
  - id: GO:0009443
    label: pyridoxal 5'-phosphate salvage
  supported_by:
  - reference_id: PMID:7860596
    supporting_text: >-
      In the presence of molecular oxygen, the PdxH enzyme uses PNP or PMP as a substrate
      (Km = 2 and 105 microM and kcat = 0.76 and 1.72 s-1 for PNP and PMP, respectively) and
      produces hydrogen peroxide.
  - reference_id: PMID:7860596
    supporting_text: >-
      Comparison of kcat/Km values suggests that PNP rather than PMP is the in vivo substrate
      of E. coli PdxH oxidase.
  - reference_id: PMID:34019876
    supporting_text: >-
      In Escherichia coli, PLP formation is catalyzed by pyridoxine 5'-phosphate oxidase (PNPO),
      a homodimeric FMN-dependent enzyme that is responsible for the last step of PLP biosynthesis
      and is also involved in the PLP salvage pathway.
suggested_questions:
- question: >-
    How much does PLP allosteric inhibition of PdxH contribute to controlling free PLP levels
    in E. coli in vivo?
suggested_experiments:
- hypothesis: Allosteric PLP inhibition of PdxH limits intracellular free PLP.
  description: >-
    Replace chromosomal pdxH with the R23L/R24L/R215L allosteric-site variant and measure
    free and protein-bound PLP and growth on B6-free medium.
