id: P0AFI7
gene_symbol: pdxH
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  PdxH is the pyridoxine/pyridoxamine 5'-phosphate oxidase of Escherichia coli (EC 1.4.3.5).
  This cytoplasmic FMN-containing homodimeric flavoenzyme oxidizes pyridoxine 5'-phosphate
  (PNP) or pyridoxamine 5'-phosphate (PMP) at C4' to pyridoxal 5'-phosphate (PLP), transferring
  a hydride to the bound FMN and reducing O2 to hydrogen peroxide. With PNP as the preferred
  in vivo substrate it catalyses the terminal step of DXP-dependent de novo PLP synthesis,
  and by oxidizing PMP and PNP it also serves vitamin B6 salvage. The enzyme is catalytically
  sluggish and is feedback-inhibited by PLP, which binds an allosteric site at the subunit
  interface.
