evidence:
- reference_id: PMID:37626034
  title: Architecture of the Heme-translocating CcmABCD/E complex required for Cytochrome c maturation.
  source_path: publications/PMID_37626034.md
  sha256: 2db6368394a9377afca9237b91012cb922663efa4b0c573204fe74dbf10d6fd6
  full_text_available: true
  finding: CcmABCD assembly and proposed ATP-coupled floppase
  supporting_text: suggest that this unusual ABC transporter acts as a heme floppase
  limits: Cryo-EM conformations and ATPase-deficient CcmA E154Q support an energy-coupled structural model,
    not a direct purified vectorial flux assay. Operon from pEC86; N-terminal Strep-tag II on CcmA, BL21(DE3)/C43(DE3)
    expression. Expression host is not genomic donor identity. Heme conduit interpretation conflicts with
    40167305.
  roles:
  - ccmA
  - ccmB
  - ccmC
  - ccmD
  - ccmE
- reference_id: PMID:40026579
  title: Complexation of CcmB with CcmACD safeguards heme translocation for cytochrome c maturation.
  source_path: publications/PMID_40026579.md
  sha256: 19eb610f9e013e465bd92800a6ff3ead56e0235126a138f381f9cfdb08a2460d
  full_text_available: true
  finding: CcmB excess causes heme efflux; heterologous E. coli homolog evidence
  supporting_text: Similar results were obtained from E. coli CcmB expressed from the same expression
    system
  limits: Primary S. oneidensis MR-1 deletion and overexpression work; additional E. coli homolog complementation/overexpression
    and E. coli acrB/chuA heme-sensitivity rescue. Supplement Table S2 does not specify E. coli CcmB donor
    strain/accession. Modeled channel and efflux phenotypes do not prove the native P0ABL8 or KT2440 conduit.
    The CcmB interpretation is explicitly disputed by 40167305.
  roles:
  - ccmB
- reference_id: PMID:40167305
  title: Biochemical mapping reveals a conserved heme transport mechanism via CcmCD in System I bacterial
    cytochrome c biogenesis.
  source_path: publications/PMID_40167305.md
  sha256: e533982272fb0b47b2db55356de66764fcc73afea43058ebb6e46c3b80470e13
  full_text_available: true
  finding: CcmCD heme-contact mapping and competing energy-independent transport model
  supporting_text: we conclude that CcmCD-mediated heme transport is energy-independent
  limits: GST:CcmCDE(H130A) biases heme localization; engineered CcmC/CcmD cysteines trap endogenous heme
    contacts; CcmD:FLAG and full-system functional comparisons were used. Contacts and structural conservation
    support the authors model, not purified directional flux. CcmC NP_416703.1 matches frozen E. coli
    P0ABM1 RefSeq cross-reference; no KT2440 direct assay. The authors explicitly reject CcmB-mediated
    acceptance and transmembrane transport.
  roles:
  - ccmA
  - ccmB
  - ccmC
  - ccmD
- reference_id: PMID:16824107
  title: ABC transporter-mediated release of a haem chaperone allows cytochrome c biogenesis.
  source_path: publications/PMID_16824107.md
  sha256: cef9fd74ccc7d6613806c40a17f179a646e0347eb87907421b9407946b2b0283
  full_text_available: false
  finding: ATP-dependent holo-CcmE release
  supporting_text: Expression of CcmA and CcmB facilitates formation of the CcmA2B1C1 complex and ATP-dependent
    release of holoCcmE.
  limits: E. coli functional complex evidence remains valid even though older statements excluding transport
    are not definitive. This is release of a loaded chaperone, not proof of ATP-coupled bilayer crossing.
  roles:
  - ccmA
  - ccmB
- reference_id: PMID:18326572
  title: Topology and function of CcmD in cytochrome c maturation.
  source_path: publications/PMID_18326572.md
  sha256: af6fddde0ab390fd3a2fa5c6435db797b455a3432728d4b1c58692f1fcb662ab
  full_text_available: true
  finding: CcmD contribution to holo-CcmE release
  supporting_text: CcmD is absolutely required for the release of holo-CcmE from the CcmABCD complex.
  limits: E. coli recombinant system in RGK103 delta-ccm; constructs include GST:CcmA, CcmC:6His and CcmD:FLAG.
    Heme transfer to CcmE is distinguished from release. This establishes machinery participation, not
    an isolated CcmD transporter.
  roles:
  - ccmD
- reference_id: PMID:24397552
  title: 'The CcmFH complex is the system I holocytochrome c synthetase: engineering cytochrome c maturation
    independent of CcmABCDE.'
  source_path: publications/PMID_24397552.md
  sha256: fdd3cff53622088b6485df2d75207b5e04a585f79b47fa356fe305d9f48d4040
  full_text_available: true
  finding: CcmFH contribution to covalent heme ligation
  supporting_text: Our findings establish that CcmFH is the system I holocytochrome c synthetase.
  limits: Engineered E. coli CcmFGH-only produces signal-cleaved cytochrome with two covalent heme bonds.
    Increased expression/heme conditions bypass CcmABCDE experimentally; authors do not assert native
    dispensability. GO0004408 is a complex contribution, not autonomous CcmF or CcmH activity.
  roles:
  - ccmF
  - ccmH
- reference_id: PMID:11843181
  title: 'Structural and redox properties of the leaderless DsbE (CcmG) protein: both active-site cysteines
    of the reduced form are involved in its function in the Escherichia coli periplasm.'
  source_path: publications/PMID_11843181.md
  sha256: 89f6bc019b6a1b7991eed785d310ceffcd08f634226898bc0fd9490b0630ba4c
  full_text_available: false
  finding: Direct E. coli DsbE protein-disulfide reduction
  supporting_text: low activity in accelerating the reduction of insulin
  limits: Abstract explicitly describes purified N-terminally truncated DsbE. Weak insulin reduction supports
    reductase chemistry but does not resolve exact physiological partners.
  roles:
  - dsbE
  - ccmG
- reference_id: PMID:28634234
  title: The thioreduction component CcmG confers efficiency and the heme ligation component CcmH ensures
    stereo-specificity during cytochrome c maturation.
  source_path: publications/PMID_28634234.md
  sha256: 7b3bcc3288d3cf3141db1c0af763b32cac82536b3131979ad85a5e552bad8a3c
  full_text_available: true
  finding: R. capsulatus CcmG reduction and mixed-disulfide resolution
  supporting_text: CcmG can efficiently reduce the disulfide bond of apocytochrome c and also resolve
    a mixed disulfide bond
  limits: Full text refreshed by normal fetch. Direct R. capsulatus thiol-exchange assays are comparative
    for E. coli and KT2440. They do not establish E. coli CcmH as a net reductase or an identical fused/unfused
    relay.
  roles:
  - dsbE
  - ccmG
  - ccmH
- reference_id: PMID:23648553
  title: Recognition and binding of apocytochrome c to P. aeruginosa CcmI, a component of cytochrome c
    maturation machinery.
  source_path: publications/PMID_23648553.md
  sha256: 0af3935852e45cbf71433b4390e7b0c81f8c43ea93f4b887dc064f558f69a241
  full_text_available: false
  finding: P. aeruginosa CcmI TPR recognition of apocytochrome
  supporting_text: Binding experiments show that the interaction occurs at the level of the TPR domain
  limits: Abstract-only, explicit periplasmic CcmI construct assays. Frozen KT2440 CycH has InterPro CcmI
    membership and TPR domains, supporting inferred substrate handling beyond a knockout-only process
    argument. No target-specific substrate range or standalone generic folding function is added.
  roles:
  - cycH
- reference_id: PMID:18174132
  title: Multiple phenotypic alterations caused by a c-type cytochrome maturation ccmC gene mutation in
    Pseudomonas aeruginosa.
  source_path: publications/PMID_18174132.md
  sha256: df001da2ac7a1e3409d12dbe4c63df3e10f6b9596911d843ead0a118bac759d0
  full_text_available: false
  finding: P. aeruginosa catalase-production phenotype
  supporting_text: catalase production was undetectable, consistent with the increased sensitivity to
    hydrogen peroxide.
  limits: Abstract-only; publisher full-text request failed403. Cellular catalase loss can be indirect
    and does not establish CcmC catalytic chemistry. PAINT PTN001247822 assertion remains unresolved,
    not rejected because of donor count.
  roles:
  - ccmC
