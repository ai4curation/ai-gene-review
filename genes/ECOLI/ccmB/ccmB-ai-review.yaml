core_functions:
- description: >-
    Integral inner-membrane subunit of the CcmAB(CD) complex that anchors the
    CcmA ATPase and couples its ATP hydrolysis to release of heme-loaded CcmE
    from CcmC, a step required for heme delivery to apocytochrome c in system I
    cytochrome c maturation. No molecular function term is assigned because the
    activity of CcmB itself (as opposed to the complex) is not defined.
  directly_involved_in:
  - id: GO:1903607
    label: cytochrome c biosynthetic process
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:16824107
    supporting_text: >-
      In the absence of CcmA or CcmB, holo(haem)CcmE binds to CcmC in a stable
      dead-end complex, indicating high affinity binding of haem to CcmC.
  - reference_id: PMID:17419738
    supporting_text: >-
      CcmA, which has the features of a soluble ATP hydrolysis subunit, is
      found in a membrane-bound complex only when CcmB is present in the
      membrane.
  - reference_id: PMID:10339610
    supporting_text: >-
      The ΔccmAand ΔccmBmutants, however, could not synthesize
      holocytochromec
proposed_new_terms: []
suggested_questions:
- question: >-
    Does CcmB translocate any substrate, or does it act purely as a
    transmembrane coupling element that transmits CcmA ATPase-driven
    conformational changes to CcmC to release holo-CcmE?
- question: >-
    Should GO provide a cellular component term for the CcmABCD(E) heme
    chaperone release complex (ComplexPortal CPX-3568), distinct from the
    metabolite-transport-defined ABC transporter complex term?
suggested_experiments:
- description: >-
    Map CcmB residues at the CcmB-CcmC interface by targeted mutagenesis and
    crosslinking, and test which are required for ATP-dependent holo-CcmE
    release but not for CcmA membrane recruitment.
  experiment_type: site-directed mutagenesis and holo-CcmE release assay
