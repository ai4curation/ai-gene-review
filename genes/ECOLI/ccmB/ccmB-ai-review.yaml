      of the plasma membrane IDA.
- id: PMID:16824107
  title: ABC transporter-mediated release of a haem chaperone allows cytochrome c
    biogenesis.
  findings:
  - statement: >-
      Without CcmA or CcmB holo-CcmE is trapped on CcmC; CcmAB promote
      formation of a CcmA2B1C1 complex and ATP-dependent holo-CcmE release.
    supporting_text: >-
      Expression of CcmA and CcmB facilitates formation of the CcmA2B1C1
      complex and ATP-dependent release of holoCcmE.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only cache; abstract directly states the CcmB phenotype.
- id: PMID:17419738
  title: Loss of ATP hydrolysis activity by CcmAB results in loss of c-type cytochrome
    synthesis and incomplete processing of CcmE.
  findings:
  - statement: >-
      CcmA is recruited to the membrane only in the presence of CcmB; purified
      CcmAB hydrolyses ATP.
    supporting_text: >-
      CcmA, which has the features of a soluble ATP hydrolysis subunit, is
      found in a membrane-bound complex only when CcmB is present in the
      membrane.
- id: PMID:24044352
  title: Probing heme delivery processes in cytochrome c biogenesis System I.
  findings:
  - statement: >-
      CcmB is proposed to transmit the ATP-driven conformational change of
      CcmA to CcmC to release heme as holo-CcmE; the heme-transporter model is
      described as disproven.
    supporting_text: >-
      An ATP-driven conformational change in CcmA, presumably via CcmB, is
      responsible for removing the heme from CcmC
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text cached. Cited by ComplexPortal for the NAS heme import row,
      although the paper itself rejects the heme-transporter model.
