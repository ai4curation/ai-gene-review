id: P0ABL8
gene_symbol: ccmB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  CcmB is the six-helix integral inner-membrane subunit of the CcmAB complex of
  cytochrome c maturation system I in Escherichia coli. It anchors the
  cytoplasmic ATPase CcmA to the membrane and links it to the heme-handling
  protein CcmC (and CcmD) in a CcmABCD assembly. CcmB is essential for c-type
  cytochrome synthesis: without it, heme-loaded CcmE remains trapped on CcmC
  and is not released for heme delivery to apocytochrome c. CcmB is thought to
  transmit ATP-driven conformational changes from CcmA to CcmC. Although CcmAB
  was historically named a heme exporter, direct tests do not support heme
  export, and no transported substrate has been identified.
aliases:
  - P0ABL8
  - b2200
