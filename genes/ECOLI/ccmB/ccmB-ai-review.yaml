- id: PMID:7635817
  title: Escherichia coli genes required for cytochrome c maturation.
  findings:
  - statement: >-
      A deletion of the E. coli ccmABCDEFGH cluster abolishes maturation of
      indigenous and heterologous c-type cytochromes.
    supporting_text: >-
      The results suggest that the E. coli ccm gene cluster present in the
      aeg-46.5 region is required for a general pathway involved in cytochrome
      c maturation.
- id: PMID:10339610
  title: Heme transfer to the heme chaperone CcmE during cytochrome c maturation requires
    the CcmC protein, which may function independently of the ABC-transporter CcmAB.
  findings:
  - statement: >-
      ccmB in-frame deletion blocks holocytochrome c formation; CcmC
      overproduction bypasses CcmAB only for holo-CcmE formation; evidence
      argues against CcmAB as heme exporter.
    supporting_text: >-
      We report that CcmC is functionally uncoupled from the ABC transporter
      subunits CcmA and CcmB, because it is the only Ccm protein that is
      strictly required for heme transfer and attachment to CcmE.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text cached; E. coli K-12 in-frame ccmB deletion assayed directly.
      Source of the IMP annotation.
- id: PMID:10708391
  title: "Oxidase and periplasmic cytochrome assembly in Escherichia coli K-12: CydDC and CcmAB are not required for haem-membrane association."
  findings:
  - statement: >-
      Haem uptake into everted membrane vesicles is ATP-independent and
      unaffected by ccmA deletion, arguing against CcmAB-mediated heme export.
    supporting_text: >-
      suggesting that the activity of neither the CydDC nor CcmAB
      transporters is essential for haem export to the periplasm
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Abstract-only cache. The mutant tested was delta(ccmA); the conclusion
      is drawn for the CcmAB transporter as a whole.
