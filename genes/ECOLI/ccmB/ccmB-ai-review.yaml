- id: PMID:7635817
  title: Escherichia coli genes required for cytochrome c maturation.
  findings:
  - statement: A deletion of the E. coli ccmABCDEFGH cluster abolishes maturation of indigenous and heterologous
      c-type cytochromes.
    supporting_text: The results suggest that the E. coli ccm gene cluster present in the aeg-46.5 region
      is required for a general pathway involved in cytochrome c maturation.
- id: PMID:10339610
  title: Heme transfer to the heme chaperone CcmE during cytochrome c maturation requires the CcmC protein,
    which may function independently of the ABC-transporter CcmAB.
  findings:
  - statement: ccmB in-frame deletion blocks holocytochrome c formation; CcmC overproduction bypasses
      CcmAB only for holo-CcmE formation; evidence argues against CcmAB as heme exporter.
    supporting_text: We report that CcmC is functionally uncoupled from the ABC transporter subunits CcmA
      and CcmB, because it is the only Ccm protein that is strictly required for heme transfer and attachment
      to CcmE.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Full text cached; E. coli K-12 in-frame ccmB deletion assayed directly. Source of the
      IMP annotation. Historical evidence/model: its positive loading/release findings remain useful,
      but any blanket exclusion of heme transport must be read alongside conflicting PMID:37626034, PMID:40026579
      and PMID:40167305. This audit does not infer a universally proven conduit.'
- id: PMID:10708391
  title: 'Oxidase and periplasmic cytochrome assembly in Escherichia coli K-12: CydDC and CcmAB are not
    required for haem-membrane association.'
  findings:
  - statement: Haem uptake into everted membrane vesicles is ATP-independent and unaffected by ccmA deletion,
      arguing against CcmAB-mediated heme export.
    supporting_text: suggesting that the activity of neither the CydDC nor CcmAB transporters is essential
      for haem export to the periplasm
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Abstract-only cache. The mutant tested was delta(ccmA); the conclusion is drawn for
      the CcmAB transporter as a whole. Historical evidence/model: its positive loading/release findings
      remain useful, but any blanket exclusion of heme transport must be read alongside conflicting PMID:37626034,
      PMID:40026579 and PMID:40167305. This audit does not infer a universally proven conduit.'
- id: PMID:15919996
  title: Global topology analysis of the Escherichia coli inner membrane proteome.
  findings:
  - statement: Experimental C-terminal reporter fusions established topology for 601 E. coli inner membrane
      proteins.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only cache; UniProt cites this paper for CcmB topology. Source of the plasma
      membrane IDA.
- id: PMID:16824107
  title: ABC transporter-mediated release of a haem chaperone allows cytochrome c biogenesis.
  findings:
  - statement: Without CcmA or CcmB holo-CcmE is trapped on CcmC; CcmAB promote formation of a CcmA2B1C1
      complex and ATP-dependent holo-CcmE release.
    supporting_text: Expression of CcmA and CcmB facilitates formation of the CcmA2B1C1 complex and ATP-dependent
      release of holoCcmE.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only cache; abstract directly states the CcmB phenotype.
- id: PMID:17419738
  title: Loss of ATP hydrolysis activity by CcmAB results in loss of c-type cytochrome synthesis and incomplete
    processing of CcmE.
  findings:
  - statement: CcmA is recruited to the membrane only in the presence of CcmB; purified CcmAB hydrolyses
      ATP.
    supporting_text: CcmA, which has the features of a soluble ATP hydrolysis subunit, is found in a membrane-bound
      complex only when CcmB is present in the membrane.
- id: PMID:24044352
  title: Probing heme delivery processes in cytochrome c biogenesis System I.
  findings:
  - statement: CcmB is proposed to transmit the ATP-driven conformational change of CcmA to CcmC to release
      heme as holo-CcmE; the heme-transporter model is described as disproven.
    supporting_text: An ATP-driven conformational change in CcmA, presumably via CcmB, is responsible
      for removing the heme from CcmC
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Full text cached. Cited by ComplexPortal for the NAS heme import row, although the
      paper itself rejects the heme-transporter model. Historical evidence/model: its positive loading/release
      findings remain useful, but any blanket exclusion of heme transport must be read alongside conflicting
      PMID:37626034, PMID:40026579 and PMID:40167305. This audit does not infer a universally proven conduit.'
- id: file:ECOLI/ccmB/ccmB-uniprot.txt
  title: UniProtKB entry P0ABL8 (CCMB_ECOLI)
  findings:
  - statement: Curated location as a multi-pass inner-membrane protein with six predicted transmembrane
      helices; the FUNCTION line still states the legacy heme-export model, which the paired CcmA entry
      has revised.
- id: PMID:40026579
  title: Complexation of CcmB with CcmACD safeguards heme translocation for cytochrome c maturation.
  findings:
  - statement: CcmB overproduction drives heme efflux in S. oneidensis; E. coli CcmB homolog assays support
      heme handling in heterologous systems.
    supporting_text: Similar results were obtained from E. coli CcmB expressed from the same expression
      system
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text and supplementary Table S2 read. Main deletion strains derive from S. oneidensis
      MR-1. Foreign E. coli CcmB complementation/overproduction and E. coli acrB/chuA heme-sensitivity
      assays are not a purified native CcmABCD transport assay. Table S2 lists cloning/conjugation hosts
      but does not resolve the E. coli CcmB donor strain/accession. AlphaFold/docking/MD do not constitute
      an experimentally observed CcmB heme channel. CcmABCD assembly restrains efflux; the CcmB conduit
      interpretation conflicts with PMID:40167305.
- id: PMID:37626034
  title: Architecture of the Heme-translocating CcmABCD/E complex required for Cytochrome c maturation.
  findings:
  - statement: E. coli CcmABCD/E structures support ATP-coupled conformational changes and propose a heme
      floppase mechanism.
    supporting_text: suggest that this unusual ABC transporter acts as a heme floppase
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text read. Recombinant E. coli operon from pEC86; N-terminal Strep-tag II on CcmA,
      expression in BL21(DE3)/C43(DE3). These are expression hosts, not independently established donor
      strains. Detergent structures and ATPase-deficient E154Q states support a model, not a purified
      vectorial heme-flux measurement. The proposed CcmB/CcmC route conflicts with PMID:40167305.
- id: PMID:40167305
  title: Biochemical mapping reveals a conserved heme transport mechanism via CcmCD in System I bacterial
    cytochrome c biogenesis.
  findings:
  - statement: Cysteine/heme crosslinks map a proposed heme acceptance site and transmembrane path through
      E. coli CcmCD.
    supporting_text: do not support a role for CcmB in heme acceptance for System I
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text read. GST:CcmCDE(H130A), engineered CcmC/CcmD cysteine variants and CcmD:FLAG
      trap endogenous-heme contacts; functional maturation is checked in recombinant complete-system assays.
      H130A biases heme occupancy. These are contact/structure-function data, not purified directional
      flux. The authors explicitly reject the CcmB conduit interpretation of PMID:40026579/37626034 and
      propose ATP-independent CcmCD transport plus ATP-dependent CcmE release. Comparative predicted structures
      are not KT2440 functional assays.
