  evidence_type: NAS
  original_reference_id: PMID:24044352
  qualifier: part_of
  review:
    summary: >-
      CcmB is the transmembrane subunit of a complex with ABC-transporter
      architecture, but the complex is not shown to transport a metabolite.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      GO:0043190 is defined as a complex for transport of metabolites into or
      out of the cell. CcmAB has ABC architecture (CcmA ATPase plus membrane
      CcmB) and is named an ABC transporter, so the assignment is not baseless,
      but the cited paper itself states the transporter model was disproven
      and the characterized function is release of holo-CcmE. No GO complex
      term exists for the CcmABCD heme-chaperone release complex (ComplexPortal
      CPX-3568). Action matches the ccmA, ccmC and ccmD reviews.
    supported_by:
    - reference_id: PMID:10339610
      supporting_text: >-
        Our results suggest that the ABC transporter is composed of the
        ATP-binding CcmA subunit plus the membrane-integral CcmB protein.
    - reference_id: PMID:24044352
      supporting_text: >-
        It was thought that CcmABC form a ATP-driven heme transporter,14 but
        this has since been disproven.
