suggested_questions:
- question: Does CcmB translocate any substrate, or does it act purely as a transmembrane coupling element
    that transmits CcmA ATPase-driven conformational changes to CcmC to release holo-CcmE?
- question: Should GO provide a cellular component term for the CcmABCD(E) heme chaperone release complex
    (ComplexPortal CPX-3568), distinct from the metabolite-transport-defined ABC transporter complex term?
suggested_experiments:
- description: Map CcmB residues at the CcmB-CcmC interface by targeted mutagenesis and crosslinking,
    and test which are required for ATP-dependent holo-CcmE release but not for CcmA membrane recruitment.
  experiment_type: site-directed mutagenesis and holo-CcmE release assay
