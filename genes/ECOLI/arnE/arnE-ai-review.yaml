id: Q47377
gene_symbol: arnE
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: ArnE is a small multi-pass inner-membrane subunit of the
  undecaprenyl phosphate-alpha-L-Ara4N flippase. Together with ArnF, ArnE moves
  the lipid-linked 4-amino-4-deoxy-L-arabinose donor from the cytoplasmic leaflet
  to the periplasmic leaflet of the inner membrane, enabling ArnT to transfer
  L-Ara4N onto lipid A and thereby reducing the negative charge of the outer
  membrane lipopolysaccharide during polymyxin-resistance lipid A modification.
