    label: response to iron(III) ion
  evidence_type: IEP
  original_reference_id: PMID:15322361
  qualifier: acts_upstream_of_or_within
  review:
    summary: The arn/yfbE operon is transcriptionally induced by external iron in
      a BasS-BasR-dependent manner, and arnE therefore has expression evidence
      linked to Fe(III). ArnE's direct gene-product role is nevertheless lipid A
      donor flipping, not Fe(III) sensing, detoxification, or transport.
    action: MARK_AS_OVER_ANNOTATED
    reason: This IEP row records a real transcriptional response, but it
      overstates ArnE's function. ArnE is induced as part of the BasS-BasR arn
      regulon and executes the L-Ara4N lipid A modification effector pathway
      downstream; the protein itself does not do the sensing or other direct
      work of the iron response.
    supported_by:
    - reference_id: PMID:15322361
      supporting_text: First we showed that the hypothetical yfbE operon that
        appears to be implicated in the modification of lipopolysaccharides is
        regulated at the level of transcription in response to external iron
    - reference_id: PMID:15322361
      supporting_text: BasS-BasR system is essential for this iron-dependent
        induction of yfbE
- term:
    id: GO:0010041
    label: response to iron(III) ion
