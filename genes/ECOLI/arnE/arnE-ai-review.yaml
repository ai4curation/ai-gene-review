  review:
    summary: The PmrA/PmrB system protects Enterobacteriaceae from Fe(III)-mediated
      toxicity, and in E. coli its BasS-BasR/PmrA homolog induces the arn operon.
      This connects arnE to the Fe(III)-induced lipid A modification regulon
      indirectly rather than making ArnE itself an iron-response protein.
    action: MARK_AS_OVER_ANNOTATED
    reason: The genetic Fe(III) phenotype is mediated through PmrA/PmrB
      regulation of envelope-modification effectors. For arnE, the effector
      activity remains intramembrane flipping of undecaprenyl
      phosphate-alpha-L-Ara4N for L-Ara4N lipid A modification; neither the
      Chamnongpol abstract nor the direct ArnE flippase evidence establishes a
      molecular role in Fe(III) sensing or detoxification.
    supported_by:
