proposed_new_terms:
- proposed_name: undecaprenyl-phosphate-L-Ara4N flippase activity
  proposed_definition: Enables the directional transport of a lipid from one leaflet
    of a membrane to the other leaflet with undecaprenyl phosphate-alpha-L-Ara4N
    as the transported substrate.
  justification: ArnE/ArnF moves undecaprenyl phosphate-alpha-L-Ara4N from the
    cytoplasmic leaflet to the periplasmic leaflet. GO:0140303 is the correct
    existing parent because GO's flippase and floppase terms currently sit under
    ATPase-coupled intramembrane lipid transporter activity and therefore make an
    unsupported ATP-coupling claim for this small SMR/DMT-family system. A child
    for undecaprenyl-phosphate-L-Ara4N flippase activity would capture the
    ArnE/ArnF activity more exactly without asserting a coupling mechanism.
  proposed_parent:
    id: GO:0140303
    label: intramembrane lipid transporter activity
  supported_by:
  - reference_id: PMID:17928292
    supporting_text: PmrL and PmrM could specifically function to flip undecaprenyl
      phosphate-alpha-L-Ara4N from the cytosolic to the periplasmic side of the
      inner membrane, possibly functioning as a heterodimer
