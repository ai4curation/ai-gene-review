  review:
    summary: ArnE is an integral E. coli inner-membrane protein; for a bacterial
      protein this compartment is represented by GO:0005886 'plasma membrane'.
      The phylogenetic annotation is consistent with UniProt's subcellular
      localization and with experimental C-terminal topology analysis of the
      E. coli inner membrane proteome.
