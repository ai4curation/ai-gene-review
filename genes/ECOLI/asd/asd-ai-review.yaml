gene_symbol: asd
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: 'Asd is the cytosolic aspartate-semialdehyde dehydrogenase of Escherichia coli. It uses NADPH
  to reduce 4-phospho-L-aspartate to L-aspartate 4-semialdehyde, releasing phosphate. This reaction supplies
  the diaminopimelate/lysine branch and homoserine-derived threonine and methionine synthesis. The enzyme
  is a homodimer with a catalytic cysteine and strongly favors NADP(H) over NAD(H).'
