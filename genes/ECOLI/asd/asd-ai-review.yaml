- id: PMID:26662025
  title: Mutagenesis of Key Residues in the Binding Center of l-Aspartate-b-Semialdehyde
    Dehydrogenase from Escherichia coli Enhances Utilization of the Cofactor NAD(H).
  findings:
  - statement: Wild-type Asd does not efficiently use NAD; engineered mutants greatly improve that
      cofactor utilization.
    supporting_text: "neither the wild-type protein nor the available mutants could\nutilize NAD(+) efficiently."
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Direct wild-type versus engineered E. coli Asd comparison. Strongly improved NAD
      utilization belongs to Q350N and Q350N/H171A mutants. The cascade product homoserine does not
      mean Asd itself performs the downstream homoserine-dehydrogenase reaction.
- id: PMID:19946135
  title: Cohesion group approach for evolutionary analysis of aspartokinase, an enzyme that feeds a
    branched network of many biochemical pathways.
  findings:
  - statement: The threonine-derived isoleucine branch is described as five reactions beginning with
      threonine dehydratase; this biochemical branch convention does not by itself redefine the
      broad GO process.
    supporting_text: Isoleucine is best known to be derived from threonine in five steps, beginning
      with the formation of 2-ketobutyrate from threonine (catalyzed by threonine dehydratase).
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full comparative review distinguishes the shared aspartate-family network from the
      threonine-to-isoleucine branch and alternative citramalate route. It informs process
      boundaries, not a native Asd loss-of-function experiment or a GO axiom excluding shared
      precursors.
