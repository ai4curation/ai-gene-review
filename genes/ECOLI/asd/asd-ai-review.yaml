    supporting_text: "Changes in gene expression after treatment of Escherichia coli cultures with\nmitomycin
      C were assessed using gene array technology."
    full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Genome-wide expression response to mitomycin C, not a direct DNA-repair enzyme
      assay. The cached abstract does not identify the individual asd result; retain the existing
      curator-assigned expression context without promoting it to a repair mechanism.
- id: PMID:14726201
  title: 'L-cystine inhibits aspartate-beta-semialdehyde dehydrogenase by covalently binding to the essential
    135Cys of the enzyme.'
  findings:
  - statement: Cystine modifies the essential Asd Cys135 in the tested inhibition assay.
    supporting_text: "thus demonstrating that the\nessential 135Cys is the amino acid residue modified
      by the treatment with\ncystine."
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Direct native-enzyme inhibition and labeled-peptide mapping supports catalytic
      Cys135. Lack of protection by NADP/NADPH is not absence of cofactor binding, nor does in-vitro
      cystine inhibition establish a native feedback-regulatory circuit.
- id: PMID:15911532
  title: Localization, annotation, and comparison of the Escherichia coli K-12 proteome under two
    states of growth.
  findings:
  - statement: The native K-12 study assigns protein forms to subcellular fractions; the abstract
      establishes the method but does not identify an individual asd hit.
    supporting_text: 2,160 were annotated and assigned to the cytosol, periplasm, inner membrane,
      and outer membrane by biochemical fractionation followed by two-dimensional gel
      electrophoresis and tandem mass spectrometry.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: This is the original native K-12 proteomics source attached to the asd cytosol
      annotation. Its cached abstract describes fractionation, 2D gels and tandem MS under two
      growth conditions, but does not list the individual asd spot. Detailed protein tables were
      available upon request in the paper; they were not independently reinspected here. Distinct
      from the MC4100 LC-MS/MS study PMID:18304323.
