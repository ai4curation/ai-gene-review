- term:
    id: GO:0071266
    label: '''de novo'' L-methionine biosynthetic process'
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: involved_in
  supporting_entities:
  - UniRule:UR000160033
  review:
    action: ACCEPT
    summary: "Asd catalyzes an aspartate-to-homoserine step explicitly included in de novo methionine
      biosynthesis."
    reason: Retain de novo methionine participation on the same basis in all three Asd reviews. The
      live GO:0071266 definition explicitly includes synthesis from simpler components such as
      L-aspartate or L-homoserine; unlike a salvage-only process, it encompasses the
      aspartate-to-homoserine reactions. This target's curated HAMAP MF_02121 pathway statement
      assigns Asd to step 2/3 of homoserine formation in that de novo route, independently of the
      GOA row itself. Asd performs the precursor-forming chemical reaction, rather than serving as a
      consumed substrate or merely affecting the pathway indirectly. Curated yeast HOM2 methionine
      annotations and its methionine GO-CAM provide a consistent same-role convention. This supports
      the existing term and its use in author-supplied refinements/core functions; it does not
      depend on treating an existing IEA as automatically true. Inherited NEW proposals at other
      PSEPK loci require gene-specific assessment and do not impose a general ban on shared-trunk
      participation. PP_4473 has an untagged curated pathway statement, Hom has an ARBA-only pathway
      statement, and PP_0664 has an uncertain native role; these are not one evidence tier and their
      separate outcomes do not determine this Asd claim.
