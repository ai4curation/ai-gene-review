- term:
    id: GO:1901705
    label: L-isoleucine biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR011534
  review:
    action: MARK_AS_OVER_ANNOTATED
    summary: A distal isoleucine assignment is broader than the conservatively supported Asd process
      scope.
    reason: Asd catalyzes the shared aspartate-to-homoserine precursor reaction; downstream
      threonine can supply isoleucine. The live GO:1901705 definition does not impose a threonine
      starting boundary and its parents include aspartate-family biosynthesis, so this is not a
      claim that GO forbids shared precursor participation. Nevertheless, the specific Ile
      assignment here rests on an InterPro propagation, not separately established target
      participation in the downstream branch. Same-role Bacillus Q04797 and Mycobacterium P9WNX5
      comparators carry only that same electronic mapping; curated yeast HOM2 P13663 instead has
      homoserine/threonine/methionine assignments, and the inspected yeast/PomBase GO-CAMs model
      those nearer processes. Together with the distinct threonine-to-isoleucine branch described in
      PMID:19946135, this supports a conservative over-annotation verdict rather than asserting
      every downstream destination of the shared precursor as a separate Asd process. Upstream
      carbon supply is not denied; the original row is preserved. Apply the same bounded process
      scope to ECOLI, CORGL and PSEPK Asd.
    supported_by:
    - reference_id: file:ECOLI/asd/asd-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: "Catalyzes the NADPH-dependent formation of L-aspartate-\nCC       semialdehyde
        (L-ASA) by the reductive dephosphorylation of L-aspartyl-\nCC       4-phosphate."
    - reference_id: file:ECOLI/asd/asd-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: "Catalyzes the NADPH-dependent formation of L-aspartate-\nCC       semialdehyde
        (L-ASA) by the reductive dephosphorylation of L-aspartyl-\nCC       4-phosphate."
    - reference_id: PMID:19946135
      supporting_text: Isoleucine is best known to be derived from threonine in five steps,
        beginning with the formation of 2-ketobutyrate from threonine (catalyzed by threonine
        dehydratase).
