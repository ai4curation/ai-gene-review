  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR000534
  review:
    action: KEEP_AS_NON_CORE
    summary: NAD binding is retained with the stated scope.
