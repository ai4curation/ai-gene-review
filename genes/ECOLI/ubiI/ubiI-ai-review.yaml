suggested_questions:
- question: >-
    What supplies electrons to UbiI in the soluble Ubi metabolon, and does the
    enzyme use NADPH directly or a reduced flavin from a partner reductase?
suggested_experiments:
- hypothesis: UbiI turns over 2-octaprenylphenol only when bound to UbiJ within the metabolon.
  description: >-
    Reconstitute purified UbiI with and without UbiJ-UbiK and an NAD(P)H source,
    deliver a short-chain 2-polyprenylphenol analogue, and quantify the
    hydroxylated product by LC-MS.
