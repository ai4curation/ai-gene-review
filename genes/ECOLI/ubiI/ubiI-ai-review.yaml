id: P25535
gene_symbol: ubiI
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  UbiI (formerly VisC) is the FAD-dependent monooxygenase that performs the
  first aromatic hydroxylation of aerobic ubiquinone-8 biosynthesis in
  Escherichia coli. It hydroxylates 2-octaprenylphenol at C5 of the future
  quinone ring (C6 of the phenol) to give 2-octaprenyl-6-hydroxyphenol
  (3-octaprenylbenzene-1,2-diol), the substrate of the UbiG O-methyltransferase.
  UbiI belongs to the UbiH/COQ6 family of class A flavoprotein monooxygenases;
  its crystal structure resembles para-hydroxybenzoate hydroxylase, and
  mutation of the flavin-binding pocket abolishes activity. ubiI mutants have
  little ubiquinone aerobically and accumulate the unhydroxylated phenol, but
  synthesise normal ubiquinone anaerobically, when an oxygen-independent
  enzyme system performs the C5 hydroxylation. UbiI is one of the seven proteins
  of the soluble cytoplasmic Ubi metabolon (UbiE, UbiF, UbiG, UbiH, UbiI, UbiJ,
  UbiK), and it partially complements the C5-hydroxylation defect of yeast
  coq6 mutants.
