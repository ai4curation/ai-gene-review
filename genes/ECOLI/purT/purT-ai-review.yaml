  review:
    summary: Formyltransferase class implies folate-type transfer chemistry that PurT does not use.
    action: REMOVE
    reason: PurT is classified as a ligase (EC 6.3.1.21); it activates formate as formyl phosphate rather
      than transferring a one-carbon unit from a carrier. The correct activity is GO:0043815, a ligase-class
      term. Consistent with the P. putida purT review.
    source_defects:
