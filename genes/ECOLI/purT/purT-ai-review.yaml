        related transferase activity places PurT among one-carbon transferases. PurT is a ligase (EC 6.3.1.21)
        that activates free formate as formyl phosphate with ATP; its activity, GO:0043815, is a ligase-class
        term and is not a descendant of GO:0016742. The mapping should be removed for IPR005862.
      supported_by:
      - reference_id: PMID:9184151
        supporting_text: This enzyme differs from the previously known purN encoded enzyme in size, sequence,
