id: P33221
gene_symbol: purT
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: PurT is the formate-dependent glycinamide ribonucleotide (GAR) transformylase of Escherichia
  coli, a cytosolic ATP-grasp enzyme that uses ATP and free formate, via a formyl phosphate intermediate,
  to formylate GAR to FGAR in de novo IMP biosynthesis. It is an alternative to the folate-dependent PurN;
  only purN purT double mutants require purines. Purified PurT also shows side reactions with acetate
  and carbamoyl phosphate.
