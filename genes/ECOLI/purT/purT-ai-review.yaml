- term:
    id: GO:0008776
    label: acetate kinase activity
  evidence_type: EXP
  original_reference_id: PMID:9184151
  qualifier: enables
  review:
    summary: Acetate kinase is a measurable side reaction of the PurT active site, not a physiological
      role.
    action: MARK_AS_OVER_ANNOTATED
    reason: PurT phosphorylates acetate in vitro because its formyl-phosphate site accepts the analogous
      acyl substrate (it also cleaves carbamoyl phosphate). E. coli has dedicated acetate kinases (AckA,
      TdcD), and no physiological role of PurT in acetate metabolism has been shown. The activity is real
      but of unknown relevance.
    supported_by:
    - reference_id: PMID:8117714
      supporting_text: 'Two different purT reactions have been characterized: one producing fGAR from
        ATP, beta-GAR, and formate and the other producing acetyl phosphate and ADP from acetate and ATP.'
