- term:
    id: GO:0016260
    label: L-selenocysteine biosynthetic process
  evidence_type: IDA
  original_reference_id: PMID:1939093
  qualifier: acts_upstream_of_or_within
  review:
    summary: Baron and Bock (1991) showed that purified SerS charges tRNA(Sec) with serine, though less
      efficiently than tRNA(Ser), and that the Ser-tRNA(Sec) is converted by selenocysteine synthase (SelA)
      to selenocysteyl-tRNA.
    action: ACCEPT
    reason: SerS catalyses the first step of bacterial selenocysteine biosynthesis on tRNA(Sec), serylation
      of tRNA(Sec) to Ser-tRNA(Sec), which SelA then converts. SerS does part of the work of the process
      itself, so this is participation and not mere necessity. The tRNA(Sec) charging by SerS was established
      genetically and biochemically (PMID:2963963, PMID:8065908). This is a genuine, conserved second
      role of SerS. Like the PSEPK serS review, it is treated as a core process alongside translation.
    supported_by:
    - &id012
      reference_id: PMID:1939093
      supporting_text: seryl-tRNA synthetase displays 10-fold impaired Km and Kcat values for tRNA(Sec)
        in comparison to tRNA(Ser)
    - reference_id: PMID:1939093
      supporting_text: Both mutant tRNA variants, when charged with L-serine, were able to interact with
        selenocysteine synthase to give rise to selenocysteyl-tRNA
    - reference_id: PMID:2963963
      supporting_text: This tRNA is aminoacylated with L-serine by the seryl-tRNA ligase which also charges
        cognate tRNASer
    - &id007
      reference_id: file:ECOLI/serS/serS-uniprot.txt
      record_section:
      - CC:PATHWAY
      supporting_text: 'L-seryl-tRNA(Sec) from L-serine and tRNA(Sec): step 1/1'
