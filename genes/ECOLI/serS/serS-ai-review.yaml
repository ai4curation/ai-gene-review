id: P0A8L1
gene_symbol: serS
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: serS encodes the seryl-tRNA synthetase (SerRS) of Escherichia coli, a cytosolic homodimeric
  class II aminoacyl-tRNA synthetase. It uses ATP to activate L-serine as seryl-adenylate and transfers
  the seryl group to the five tRNA(Ser) isoacceptors, supplying Ser-tRNA(Ser) for protein synthesis. It
  also charges the selenocysteine-specific tRNA(Sec) (selC product) with serine, less efficiently than
  tRNA(Ser). This forms Ser-tRNA(Sec), which selenocysteine synthase (SelA) converts to selenocysteinyl-tRNA(Sec),
  so SerS provides the first step of bacterial selenocysteine biosynthesis. Each subunit has a C-terminal
  catalytic core and an N-terminal coiled-coil arm. A tRNA binds across the dimer, with its acceptor end
  in the active site of one subunit and its T-loop and long variable arm contacting the arm of the other,
  and the arm is required for efficient aminoacylation and tRNA discrimination.
