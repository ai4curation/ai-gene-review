- term:
    id: GO:0000287
    label: magnesium ion binding
  evidence_type: IDA
  original_reference_id: PMID:17889423
  qualifier: enables
  review:
    summary: Airas (2007) measured how Mg2+ concentration changes the apparent equilibrium constants of
      six E. coli aminoacyl-tRNA synthetase reactions, presumably including SerRS.
    action: MARK_AS_OVER_ANNOTATED
    reason: The cached abstract (full text not available) attributes the Mg2+ dependence to magnesium
      complexes of the substrates and products (PPi, AMP, tRNA and aminoacyl-tRNA), not to a metal site
      on the enzyme. Class II synthetases use Mg-ATP, so Mg2+ is part of the chemistry, but this study
      measures ligand speciation in the reaction equilibrium and does not show that the SerS polypeptide
      binds Mg2+. It is not wrong enough to REMOVE an IDA row whose full text I have not read. It is still
      an over-reading of a thermodynamic study as a protein binding activity, and it is not core.
    supported_by:
    - reference_id: PMID:17889423
      supporting_text: The main reason for the Mg(2+) dependence is the existence of PP(i) as two magnesium
        complexes, but only one of them is the real product.
    - reference_id: PMID:17889423
      supporting_text: Different bindings of the Mg(2+) ions to the substrate tRNA and product aminoacyl-tRNA
        can explain this observation.
