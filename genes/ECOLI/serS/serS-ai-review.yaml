- term:
    id: GO:0042802
    label: identical protein binding
  evidence_type: IPI
  original_reference_id: PMID:16858726
  qualifier: enables
  supporting_entities:
  - UniProtKB:P0A8L1
  review:
    summary: The 2D blue-native/SDS-PAGE complexome detected SerS in a homomultimeric complex.
    action: KEEP_AS_NON_CORE
    reason: SerS is an obligate homodimer, and the dimer is functionally required. The tRNA binds across
      the two subunits, with the acceptor end in the active site of one subunit and the elbow on the coiled-coil
      arm of the other. Heterodimers of two inactive mutants regain activity (PMID:7537870), and the enzyme:tRNA
      crystal shows a tRNA bound across the dimer (PMID:8508916). Identical protein binding is therefore
      a true, informative property and is not bare protein binding. It is structural support for the catalytic
      activity rather than a separate core function, so it is kept as non-core.
    supported_by:
