  label: Escherichia coli K-12
description: >-
  LolE is a four-pass inner-membrane subunit of the Escherichia coli LolCDE lipoprotein-release complex.
  LolE and LolC jointly form lipid-anchor-binding pockets, while a cleft on the LolE periplasmic domain
  contacts a short segment of the cargo polypeptide and promotes efficient release. Two LolD ATPase subunits
  drive the conformational cycle, and LolC recruits the LolA carrier. LolD and LolE can support release
  in a particular in vitro reconstitution, whereas the canonical cellular machinery requires both LolC
  and LolE. Cargo is extracted from the periplasmic leaflet, not translocated through the inner-membrane
  bilayer.
