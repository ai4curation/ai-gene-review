id: P75958
gene_symbol: lolE
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  lolE encodes the cargo-binding integral-membrane subunit of the essential
  Escherichia coli LolCDE complex. LolE, like its paralog LolC, has four
  transmembrane segments and a large periplasmic domain, but it is LolE that
  binds the lipid-anchored outer-membrane lipoprotein (e.g. Pal) in the inner
  membrane; ATP hydrolysis by LolD in the presence of LolA transfers the cargo
  from LolE to LolA. LolD-LolE alone can reconstitute lipoprotein release in
  vitro.
