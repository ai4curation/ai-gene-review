  review:
    summary: The DNA-polymerizing reaction of the holoenzyme is performed by DnaE alpha.
    action: REMOVE
    reason: dnaN performs topological tethering and polymerase processivity; DNA polymerization is catalyzed
      by DnaE alpha. Holoenzyme nucleotide-incorporation assays and shared EC/Rhea labels do not establish
      that this individual subunit polymerizes DNA. Its actual molecular role is retained independently.
    supported_by: &id003
