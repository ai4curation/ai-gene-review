id: P0A988
gene_symbol: dnaN
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: DnaN is the beta sliding clamp of Escherichia coli. A head-to-tail homodimer encircles DNA
  and tethers DNA polymerases, increasing processivity and coordinating exchanges between replication
  and repair enzymes. The clamp loader opens and deposits beta on primed DNA. DnaN also recruits Hda in
  regulatory inactivation of DnaA and supports translesion synthesis. It is a processivity factor, not
  a DNA polymerase or proofreading exonuclease.
