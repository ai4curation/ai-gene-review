  review:
    summary: dnaN expression is induced by mitomycin C; this IEP row records a transcriptional response
      to DNA damage, not a damage-sensing or repair activity of the clamp.
    action: KEEP_AS_NON_CORE
    reason: The Khil and Camerini-Otero array study is abstract-only here and its full text (Wiley) could
      not be retrieved, so the exact dnaN row in its tables was not seen. The underlying claim is,
      however, independently established for this gene by targeted lacZ-fusion work showing that
      mitomycin C induces dnaN expression (PMID:2515428), and later work lists dnaN among the
      DNA damage-inducible replication genes (PMID:7476872). An IEP for GO:0006974 records exactly this
      kind of expression response. It is true but peripheral to the clamp's processivity function, so
      it is kept as non-core rather than accepted.
