    action: ACCEPT
    reason: The beta clamp forms a topological ring around DNA and also contacts primed substrates. The
      broad DNA-binding claim is appropriate because both ssDNA-containing primer junctions and duplex
      DNA interact with the clamp.
    supported_by:
