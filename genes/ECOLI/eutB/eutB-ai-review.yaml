core_functions:
- description: >-
    Catalytic large subunit of adenosylcobalamin-dependent ethanolamine ammonia-lyase within the EutB/EutC
    holoenzyme, carrying the substrate-binding catalytic barrel and contacting the interfacial cobalamin
    cofactor. The complex converts ethanolamine to acetaldehyde and ammonium; autonomous EutB turnover
    and the site of native E. coli catalytic flux are not established by this subunit attribution.
  molecular_function:
    id: GO:0008851
    label: ethanolamine ammonia-lyase activity
