suggested_questions:
- question: Under which ethanolamine- and cobalamin-dependent growth conditions is native E. coli
    EutBC encapsulated, and what fraction remains soluble? Distinguish native K-12 proteins from
    Salmonella proteins expressed in an E. coli host.
suggested_experiments:
- description: Express fluorescently tagged EutB in a eut-expressing K-12 strain (e.g. W3110) grown
    on ethanolamine plus B12 and compare localization with the EutM shell marker, with and without
    the EutC N-terminal targeting peptide.
  experiment_type: fluorescence microscopy and cell fractionation
