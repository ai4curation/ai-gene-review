  review:
    summary: PAINT places cytosolic activity at the EutB family root node, seeded by this protein.
    action: ACCEPT
    reason: >-
      The PAINT assertion at PTN002217393 includes E. coli EutB itself as an experimentally grounded descendant;
      that is not circular evidence. The target has a cytosol-proteomics IDA annotation from MC4100 (PMID:18304323).
      The protein-level supplementary identification was not independently recovered, so this accepts
      the curator-backed location without claiming direct inspection of that table. Fractionation does
      not establish whether native EutBC is outside a microcompartment during ethanolamine utilization.
      The former Salmonella external-EutBC model is neither an E. coli localization experiment nor current
      proof of external localization; later LT2 studies support compartment association and encapsulation.
      No evolutionary loss or faulty-node claim is made.
