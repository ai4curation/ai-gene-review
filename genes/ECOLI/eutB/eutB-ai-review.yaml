  review:
    summary: PAINT places cytosolic activity at the EutB family root node, seeded by this protein.
    action: ACCEPT
    reason: >-
      EutB is a soluble enzyme subunit. Whether it is also enclosed in the Eut
      microcompartment in E. coli is unresolved, and the genetic model of
      Huseby and Roth places EutBC outside the shell, in the cytosol. The IBD
      seed is E. coli EutB itself, whose cytosol location is supported by the
      cytosol proteomics row below; the cytosol claim holds across the family,
      including members such as P. putida KT2440 that encode no shell proteins.
    supported_by:
    - reference_id: PMID:23585538
      supporting_text: >-
        The model predicts that EutBC (ethanolamine-ammonia lyase) lies outside
        the compartment, using external coenzyme B12 and injecting its product,
        acetaldehyde, into the lumen
    - reference_id: file:PSEPK/eutC/eutC-bioinformatics/RESULTS.md
      supporting_text: >-
        KT2440 encodes no BMC-domain or EutN/CcmL-domain protein anywhere in its reference
        proteome, while the same queries recover the complete E. coli Eut shell set.
