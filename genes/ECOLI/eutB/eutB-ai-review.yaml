id: P0AEJ6
gene_symbol: eutB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  EutB is the large (alpha) subunit of adenosylcobalamin (coenzyme B12)-dependent
  ethanolamine ammonia-lyase, which converts ethanolamine into acetaldehyde and
  ammonium in the first step of ethanolamine utilization. Six EutB/EutC
  heterodimers form the alpha6-beta6 holoenzyme; the active site, with the
  substrate-binding residues, lies in the TIM barrel of EutB, and the cobalamin
  cofactor is bound at the interface between the two subunits. The enzyme is
  inactivated during catalysis by Co-C bond cleavage and is reactivated by the
  EutA reactivase. It is encoded with EutC in the eut operon, which also encodes
  the shell proteins of the ethanolamine-utilization microcompartment.
