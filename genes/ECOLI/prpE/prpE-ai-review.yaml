suggested_questions:
- question: >-
    Is PrpE protein actually produced in E. coli K-12 during growth on
    propionate, given that 2D gels failed to detect it and Acs appears to
    substitute?
- question: >-
    Is the Cys128-Cys315 disulfide switch observed in vitro physiologically
    relevant to PrpE activity in vivo?
suggested_experiments:
- description: >-
    Construct prpE, acs and prpE acs mutants of E. coli K-12 and compare growth
    on propionate, propionyl-CoA pools and 2-methylcitrate accumulation; probe
    PrpE abundance by targeted proteomics during propionate growth.
