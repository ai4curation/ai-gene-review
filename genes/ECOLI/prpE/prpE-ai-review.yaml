  label: Escherichia coli K-12
description: >-
  PrpE is the propionyl-CoA synthetase (propionate--CoA ligase) encoded as the
  last gene of the propionate-inducible prpBCDE operon of Escherichia coli K-12.
  A member of the ATP-dependent AMP-binding (ANL) acyl-CoA synthetase
  superfamily closely related to acetyl-CoA synthetase, it activates propionate
  to propionyl-CoA using ATP and CoA (via a propionyl-AMP intermediate),
  supplying the substrate for the 2-methylcitrate cycle that oxidizes propionate
  to pyruvate. The purified E. coli enzyme prefers propionate but also uses
  acetate, and its activity is stimulated in vitro by reduction of a putative
  regulatory disulfide involving Cys128 and Cys315. In vivo its role overlaps
  with acetyl-CoA synthetase (Acs), which can supply propionyl-CoA in its
  absence, so prpE loss has little phenotype in enteric bacteria.
