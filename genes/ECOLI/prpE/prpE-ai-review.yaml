- id: PMID:22834299
  title: E. coli propionyl-CoA synthetase is regulated in vitro by an intramolecular
    disulfide bond.
  findings:
  - statement: Purified E. coli PrpE prefers propionate over acetate.
    supporting_text: Kinetic analyses suggested that the enzyme preferred propionate as substrate but would also use acetate.
  - statement: Activity is redox regulated through Cys128 and Cys315.
    supporting_text: It was revealed that the C128A and C315A mutants had wildtype enzyme activity but were no longer activated by DTT or inhibited by diamide.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only in cache; only direct biochemical study of E. coli PrpE.
- id: PMID:12473114
  title: Oxidation of propionate to pyruvate in Escherichia coli. Involvement of methylcitrate
    dehydratase and aconitase.
  findings:
  - statement: prpE RNA is propionate-specific, but PrpE protein was not detected on 2D gels and may be replaced by acetyl-CoA synthetase.
    supporting_text: 2D gel electrophoresis showed the production of all proteins encoded by the prp operon during growth on propionate as sole carbon and energy source, except PrpE, which seems to be replaced by acetyl-CoA synthetase.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only in cache; E. coli K-12 expression data for PrpE.
- id: PMID:10411265
  title: The prpE gene of Salmonella typhimurium LT2 encodes propionyl-CoA synthetase.
  findings:
  - statement: Salmonella PrpE is an ATP-specific propionyl-CoA synthetase, with Acs compensating for its loss.
    supporting_text: While prpE mutants used propionate as carbon and energy source, prpE mutants that lacked acetyl-CoA synthetase (encoded by acs) did not, indicating that Acs can compensate for the lack of PrpE in prpE mutants.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Salmonella ortholog (P55912); abstract-only. Comparative evidence.
- id: PMID:10482501
  title: Salmonella typhimurium LT2 catabolizes propionate via the 2-methylcitric acid
    cycle.
  findings:
  - statement: PrpE is the propionyl-CoA synthetase step of the Salmonella 2-methylcitric acid cycle.
    supporting_text: In this pathway, PrpE is the propionyl-CoA synthetase ( 13 ) and PrpC is the 2-methylcitrate synthase.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text from PMC; Salmonella pathway paper, comparative for E. coli.
