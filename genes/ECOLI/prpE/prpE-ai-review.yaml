  review:
    summary: Correct core process; PrpE catalyzes the activation of propionate to propionyl-CoA, the entry step of the 2-methylcitrate pathway, and is induced on propionate.
    action: ACCEPT
    reason: >-
      PrpE performs the first enzymatic step of propionate catabolism, so it
      does work in the process. In E. coli prpE transcripts are present
      exclusively during growth on propionate (PMID:12473114), and in the
      closely related Salmonella pathway PrpE is the propionyl-CoA synthetase
      of the 2-methylcitric acid cycle (PMID:10482501). Functional redundancy
      with Acs (PMID:10411265, PMID:12473114) does not negate participation.
    supported_by:
