id: P25889
gene_symbol: preA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  preA (yeiA, b2147) encodes the pyrimidine-reducing subunit of the
  NAD-dependent dihydropyrimidine dehydrogenase of Escherichia coli. PreA and
  PreT form a cytoplasmic heterotetramer that reduces uracil and thymine to
  5,6-dihydrouracil and 5,6-dihydrothymine with NADH. PreA is homologous to the
  C-terminal dihydroorotate-dehydrogenase-like catalytic region of single-chain
  eukaryotic DPYD: it carries the FMN cofactor, the pyrimidine-binding site and
  two [4Fe-4S] ferredoxin motifs, and receives electrons from the NADH-oxidizing
  PreT subunit. The enzyme is required for dihydrouracil production in vivo,
  although E. coli lacks the downstream steps of the reductive pyrimidine
  pathway.
