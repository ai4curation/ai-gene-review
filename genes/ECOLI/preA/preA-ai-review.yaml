suggested_questions:
- question: >-
    Was isolated PreA ever assayed for NADH oxidation, or does the NADH
    dehydrogenase IDA reflect only the PreT-PreA complex?
suggested_experiments:
- description: >-
    Express PreT and PreA separately and assay NADH oxidation with an artificial
    acceptor and uracil reduction with reduced methyl viologen to assign the two
    half-reactions to subunits.
