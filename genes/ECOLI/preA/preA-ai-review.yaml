    label: NADH dehydrogenase activity
  evidence_type: IDA
  original_reference_id: PMID:21169495
  qualifier: enables
  review:
    summary: >-
      The heteromeric enzyme oxidizes NADH, but the NADH/FAD-binding domain
      and the NAD(+)-binding site are on PreT; PreA carries the FMN,
      pyrimidine-binding and dihydroorotate-dehydrogenase-like catalytic
      domain that reduces the pyrimidine ring.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The assay measured the PreT-PreA complex. Domain architecture assigns the
      NADH-oxidizing half-reaction to PreT, so enables NADH dehydrogenase
      activity on PreA likely over-attributes a complex activity to this
      subunit. Not removed because the full text was not available to check
      whether isolated PreA was assayed.
