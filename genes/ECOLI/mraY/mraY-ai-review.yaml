suggested_questions:
  - question: >-
      GO:0008963 carries a stem-peptide-generic name (EC 2.7.8.13) but an
      L-lysine-specific definition, and its meso-diaminopimelate counterpart
      GO:0051992 is a sibling rather than a child. Should GO add a
      stem-peptide-agnostic phospho-MurNAc-pentapeptide translocase parent so
      that MraY family PAINT nodes spanning DAP- and Lys-type bacteria can be
      annotated without implying a substrate? The same gap affects MurF
      (GO:0047480 versus GO:0008766) and MurG (GO:0050511 versus GO:0051991).
  - question: >-
      Does the MraY homodimer seen in the YES complex structure have functional
      significance for catalysis or lipid handling in the uninfected cell, or is
      dimerisation only a crystallographic and complex-forming property?
suggested_experiments:
  - description: >-
      Assay purified E. coli MraY side by side with UDP-MurNAc-pentapeptide
      carrying meso-diaminopimelate and L-lysine at position 3 and report
      kinetic constants for both, to establish quantitatively whether the
      L-lysine reaction is a tolerated side activity of the E. coli enzyme (as
      the historical systematic enzyme name implies) or is physiologically
      irrelevant.
  - description: >-
      Determine whether the active-site residues that contact the stem peptide
      differ systematically between MraY enzymes of DAP-type and Lys-type
      bacteria, by comparing specificity of chimeric enzymes, which would show
      whether stem selectivity resides in MraY at all or is set entirely by MurE.
