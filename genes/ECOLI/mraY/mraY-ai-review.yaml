gene_symbol: mraY
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  MraY is the essential phospho-N-acetylmuramoyl-pentapeptide translocase of
  Escherichia coli, the integral inner-membrane enzyme catalysing the first
  membrane-bound step of peptidoglycan synthesis. Using Mg2+, it transfers
  phospho-MurNAc-pentapeptide from the cytoplasmic nucleotide precursor
  UDP-MurNAc-pentapeptide (the meso-diaminopimelate-containing Park nucleotide)
  onto the lipid carrier undecaprenyl phosphate, releasing UMP and forming
  undecaprenyl-pyrophosphoryl-MurNAc-pentapeptide (lipid I), which MurG then
  converts to lipid II. MraY is a polytopic membrane protein with ten
  transmembrane segments that forms a homodimer with its active site on the
  cytoplasmic face. It belongs to the glycosyltransferase family 4
  polyprenyl-phosphate N-acetylhexosamine-1-phosphate transferase superfamily,
  is inhibited by tunicamycin and nucleoside antibiotics, and is the target of
  the bacteriophage phiX174 lysis protein E, which blocks access of the lipid
  substrate to the active site.
