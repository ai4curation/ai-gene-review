  review:
    summary: Dxr requires a divalent cation, Mn2+ best; Mn2+ is bound at the active site in the crystal structure.
    action: ACCEPT
    reason: Takahashi et al. found that activity required Mn2+, Co2+ or Mg2+, and the full text shows
      Mn2+ gave the highest activity. The structure of E. coli Dxr with Mn2+ and fosmidomycin shows the
      metal coordinated at the active site by the acidic cluster. The metal used in vivo (Mn2+ or Mg2+) is
      not established, but Mn2+ binding itself is demonstrated and is integral to catalysis.
    supported_by:
