suggested_questions:
- question: Which divalent cation, Mg2+ or Mn2+, occupies the Dxr active site in vivo in E. coli, and does
    this change under manganese limitation or oxidative stress?
suggested_experiments:
- description: Determine the metal content of Dxr purified anaerobically from E. coli grown with defined
    Mn2+ and Mg2+ supply (ICP-MS), and compare kinetics of the Mg2+- and Mn2+-loaded enzyme at physiological
    metal concentrations.
