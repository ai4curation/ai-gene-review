    label: identical protein binding
  evidence_type: IDA
  original_reference_id: PMID:9707569
  qualifier: enables
  review:
    summary: Purified Dxr self-associates (gel filtration); a structural property, peripheral to function.
    action: KEEP_AS_NON_CORE
    reason: The full text (PMC21430) reports a native mass of 150 kDa by gel filtration against a 42 kDa
      subunit, which the authors read as a homotetramer, with several bands on native PAGE. The crystal
      structures show a homodimer whose connective domain forms the interface. Self-association is therefore
      real but the oligomeric state in this paper differs from the structures, so the row is not refined to
      homodimerization. The complex is captured by GO:1990065.
    supported_by:
    - reference_id: PMID:11741911
      supporting_text: The structure reveals that the enzyme is present as a homodimer.
