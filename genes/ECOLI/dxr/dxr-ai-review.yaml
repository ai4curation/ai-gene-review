  label: Escherichia coli K-12
description: Dxr (IspC, formerly YaeM; DXP reductoisomerase) is the homodimeric, NADPH- and divalent
  metal-dependent enzyme of Escherichia coli that converts 1-deoxy-D-xylulose 5-phosphate (DXP) into
  2-C-methyl-D-erythritol 4-phosphate (MEP) in a single step, an intramolecular rearrangement followed by
  reduction. This is the first committed step of the methylerythritol phosphate (MEP) pathway that supplies
  isopentenyl and dimethylallyl diphosphate for all isoprenoids in E. coli. Each subunit has an N-terminal
  NADPH-binding dinucleotide domain, a connective domain that forms the dimer interface and most of the
  active site with a Mn2+/Mg2+-binding acidic cluster (Asp150, Glu152, Glu231), and a C-terminal four-helix
  bundle; a flexible loop closes over the bound substrate. NADPH is used with class B (pro-S hydride)
  stereospecificity. Dxr is the target of the antibiotic fosmidomycin, and dxr-deficient mutants require
  2-C-methylerythritol or, in engineered strains, mevalonate for growth.
