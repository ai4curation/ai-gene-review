description: >-
  NCBI PGAP names WP_000026812.1 "(2,3-dihydroxybenzoyl)adenylate synthase EntE" from
  BlastRule NBR012093 and assigns three EC numbers (2.5.1.-, 6.2.1.71, 6.3.2.14) but no
  GO terms. The GO gap comes from how PGAP propagates GO: it passes on GO only from the
  model that names the protein, and NBR012093 carries none. EntE also matches two
  equivalog HMMs with the same product name, NF008192 and TIGR02275, and both carry
  GO:0008668 (2,3-dihydroxybenzoate--[aryl-carrier protein] ligase activity) and
  GO:0019290 (siderophore biosynthetic process). Because a BlastRule outranks them for
  naming, their GO is discarded, so PGAP omits EntE's core molecular function. GOA
  supports that function with five EXP annotations and one IDA annotation. Judged
  against the literature, EC 6.2.1.71 is exactly EntE's activity: ATP-dependent
  adenylation of 2,3-dihydroxybenzoate (DHB) and transfer onto holo-EntB ArCP. EC
  6.3.2.14, the overall enterobactin synthase reaction, is defensible only as a
  component-level assignment, since EntF forms the amide and ester bonds; UniProt makes
  the same assignment. EC 2.5.1.- (transferase of alkyl or aryl groups other than
  methyl) is not supported. DHB transfer onto the phosphopantetheine thiol is an aroyl
  (acyl) transfer, and it is the second half-reaction of EC 6.2.1.71, not a separate
  alkyl/aryl-transferase activity.
