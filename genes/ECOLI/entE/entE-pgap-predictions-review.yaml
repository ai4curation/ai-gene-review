  review:
    assessment: NPI
    confidence_score: 0
    error_type: CURATION_MISTAKE
    summary: >-
      EC 2.5.1 covers transfer of alkyl or aryl groups other than methyl. EntE has no
      such activity. Its second half-reaction moves the 2,3-dihydroxybenzoyl group from
      DHB-AMP onto the phosphopantetheine thiol of holo-EntB. That is an aroyl (acyl)
      transfer, which UniProt records as "S-dihydroxybenzoyltransferase" kinetics with
      no EC number, and it is already part of the EC 6.2.1.71 overall reaction. The
      EC 2.5.1.- assignment looks like an outdated or misclassified label for that
      half-reaction, carried by the naming BlastRule. Its exact provenance is not
      recorded in the evidence files. It should be dropped, not replaced.
