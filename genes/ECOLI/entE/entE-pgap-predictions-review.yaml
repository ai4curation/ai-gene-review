- source_method: NCBI PGAP
  source_version: current WP_ records (wp); GO from WP_ record
  source_reference_id: PMID:33270901
  predicted_term:
    id: EC:6.3.2.14
    label: EC 6.3.2.14
  predicted_term_type: EC
  review:
    assessment: CNN
    confidence_score: 2
    summary: >-
      Defensible as a component-level assignment, not as EntE's own catalytic activity.
      EC 6.3.2.14 (enterobactin synthase) is the overall reaction 3 DHB + 3 L-serine +
      6 ATP -> enterobactin, carried out jointly by EntB, EntD, EntE and EntF. EntF
      makes the amide and ester bonds, using the DHB-loaded holo-EntB that EntE
      produces. UniProt follows a component-level convention here: it assigns the
      synthase EC 6.3.2.14 to each component of the system, EntE included, citing
      experimental evidence. The PGAP prediction therefore matches the existing record
      under that convention, but it should not be read as EntE catalysing the full
      reaction by itself. For GO, this reaction is better
      represented on EntE by GO:0008668 than by GO:0047527.
    supported_by:
