- term:
    id: GO:0047527
    label: 2,3-dihydroxybenzoate-serine ligase activity
  evidence_type: EXP
  original_reference_id: PMID:10688898
  qualifier: enables
  review:
    summary: Experimental annotation to the enterobactin synthetase DHB-serine ligase reaction; EntE catalyses
      only the DHB activation/loading half of this multi-protein reaction.
    action: MODIFY
    reason: GO:0047527 is defined by the product N-(2,3-dihydroxybenzoyl)-L-serine, i.e. the DHB-serine
      amide bond. That bond (and the ester bonds) is made by EntF using DHB-loaded holo-EntB, not by EntE.
      EntE's own experimentally demonstrated reaction is DHB adenylation and transfer onto holo-EntB ArCP
      (GO:0008668). The curators' evidence is sound for EntE's contribution to the enterobactin synthetase
      reaction (EC 6.3.2.14, which UniProt assigns to all synthetase components), so the essence is retained
      and refined to EntE's actual step rather than removed. The same reconstitution study found no stable
