id: P10378
gene_symbol: entE
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: EntE (2,3-dihydroxybenzoate-AMP ligase; enterobactin synthase component E) is the stand-alone
  adenylation enzyme of the Escherichia coli enterobactin nonribosomal peptide synthetase. A soluble cytoplasmic
  member of the ANL (ATP-dependent AMP-binding) superfamily, it uses ATP to activate 2,3-dihydroxybenzoate
  (DHB) as an enzyme-bound DHB-adenylate and then transfers the DHB moiety onto the phosphopantetheine
  arm of the aryl carrier protein domain of holo-EntB (EC 6.2.1.71). DHB-loaded EntB is the aryl donor
  used by EntF, which forms the amide and ester bonds of the cyclic tris(N-2,3-dihydroxybenzoyl-L-serine)
  siderophore. EntE is produced under iron limitation (Fur-regulated); its activity is stimulated by interaction
  with the upstream DHB-producing dehydrogenase EntA, and DHB binding primes complex formation with EntB.
  In the absence of holo-EntB the bound DHB-adenylate can react with ATP to form Ap4A in vitro. A minor
  fraction of the protein associates with membranes.
