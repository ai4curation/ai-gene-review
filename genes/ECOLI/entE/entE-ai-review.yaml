suggested_questions:
- question: Should EntE's experimental GO:0047527 (2,3-dihydroxybenzoate-serine ligase activity) annotations
    be converted to GO:0008668, or to contributes_to GO:0047527, given that EntF, not EntE, forms the
    DHB-serine amide bond?
- question: Does EntE-catalysed Ap4A formation occur at physiologically meaningful levels in iron-starved
    cells when holo-EntB is limiting, and does it feed into Ap4A stress signalling?
- question: Is the minor membrane-associated pool of EntE functionally linked to enterobactin export,
    as proposed from the fractionation data?
suggested_experiments:
- hypothesis: Ap4A produced by EntE contributes to the cellular Ap4A pool under iron starvation.
  description: Measure Ap4A in iron-limited wild type, entE deletion, and entB deletion strains (the last
    expected to raise EntE-dependent Ap4A by removing the acceptor), and complement with catalytically
    inactive EntE.
  experiment_type: metabolite profiling and genetics
