id: P0A6C8
gene_symbol: argB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: ArgB is a cytoplasmic acetylglutamate kinase in Escherichia coli. Its homodimeric enzyme
  phosphorylates the gamma-carboxyl group of N-acetyl-L-glutamate using ATP, forming N-acetylglutamyl
  phosphate for the acetylated-intermediate route to ornithine and arginine. Substrate-bound structures
  and catalytic-site mutagenesis define its phosphoryl-transfer mechanism.
