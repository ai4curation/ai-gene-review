  label: Escherichia coli K-12
description: >-
  FabH is the beta-ketoacyl-[acyl-carrier-protein] synthase III (KAS III) that initiates each round of
  de novo fatty-acid synthesis in Escherichia coli and most bacteria. It condenses an acyl-CoA primer,
  preferentially acetyl-CoA, with malonyl-ACP to give the first beta-ketoacyl-ACP, releasing CoA and carbon
  dioxide; the reaction proceeds through an acyl-enzyme intermediate, so the purified protein shows acyl-CoA:ACP
  transacylase activity as well as condensing activity. Its primer specificity is narrow - acetyl-CoA
  and, less efficiently, propionyl-CoA, but not medium-chain acyl-CoAs or branched primers - and this
  is what makes E. coli produce straight-chain rather than branched-chain fatty acids: Bacillus FabH homologues
  that accept iso- and anteiso-branched primers confer branched-chain synthesis when expressed in E. coli.
  FabH is feedback-inhibited by long-chain acyl-ACPs, the end products of the pathway, so it is a control
  point for the overall rate of fatty-acid synthesis. The enzyme is a cytoplasmic homodimer of the thiolase-like
  superfamily.
