    summary: >-
      Condensing activity assigned from domain signatures, but with the wrong substrate: the KAS III reaction
      uses an acyl-CoA primer, not acyl-ACP.
    action: MODIFY
    reason: >-
      GO:0004315 names the elongation condensation of an acyl-[ACP] with malonyl-[ACP], the reaction of
      the KAS I/KAS II enzymes FabB and FabF. FabH instead condenses an acyl-CoA primer with malonyl-ACP,
      which is a different term, GO:0033818, asserted on seven other rows of this review with experimental,
      phylogenetic and electronic evidence; GO:0033818 is not a descendant of GO:0004315, so this is a
      substrate correction rather than a refinement. The condensing-enzyme essence of the row is sound,
      hence MODIFY rather than REMOVE.
