core_functions:
- description: >-
    Condensation of an acetyl-CoA primer with malonyl-ACP to form the first beta-ketoacyl-ACP of each
    round of de novo fatty-acid synthesis, with a primer specificity that restricts the products to straight-chain
    fatty acids and a feedback inhibition by long-chain acyl-ACP that makes the step a rate control point.
  molecular_function:
    id: GO:0033818
    label: beta-ketoacyl-acyl-carrier-protein synthase III activity
  directly_involved_in:
  - id: GO:0006633
    label: fatty acid biosynthetic process
  - id: GO:0030497
    label: fatty acid elongation
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:8631920
    supporting_text: FabH exhibited a Km of 40 microM for acetyl-CoA and 5 microM for malonyl-ACP.
  - reference_id: PMID:10629181
    supporting_text: >-
      Reconstitution of a complete round of fatty acid synthesis in vitro with purified E. coli proteins
      showed that eFabH was the only E. coli enzyme incapable of using branched-chain substrates.
suggested_questions:
- question: >-
    How much of the control of total fatty-acid synthesis rate in E. coli rests on acyl-ACP feedback at
    FabH rather than at the carboxylase or the elongation condensing enzymes?
suggested_experiments:
- description: >-
    Titrate FabH levels and acyl-ACP pools in vivo and measure flux and acyl-ACP profiles, to separate
    FabH's contribution to rate control from that of acetyl-CoA carboxylase and FabB/FabF.
