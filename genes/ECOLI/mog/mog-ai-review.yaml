suggested_questions:
- question: Is MPT-AMP released by MogA and rebound by MoeA, or transferred directly within the
    molybdopterin-dependent MogA-MoeA complex?
suggested_experiments:
- hypothesis: MogA hands MPT-AMP to MoeA without release into solution.
  description: Follow MPT-AMP partitioning by HPLC in coupled MogA-MoeA reactions with and without
    a competing MPT-AMP-binding trap protein, and test complex formation by crosslinking in the
    presence and absence of MPT.
