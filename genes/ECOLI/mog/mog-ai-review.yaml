id: P0AF03
gene_symbol: mog
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  Mog (MogA) is the molybdopterin adenylyltransferase of Escherichia coli. It transfers AMP
  from ATP to molybdopterin (MPT) in a Mg2+-dependent reaction, forming adenylyl-molybdopterin
  (MPT-AMP), the activated intermediate on which MoeA then inserts molybdate to make
  Mo-molybdopterin, the molybdenum cofactor. MogA is a small soluble homotrimer of the
  MoaB/Mog fold; two aspartate residues (Asp49 and Asp82) in the putative active site are
  essential for activity. It is homologous to the G domain of plant Cnx1 and mammalian
  gephyrin, in which the MogA and MoeA activities are fused. mog (historically chlG) mutants
  make molybdopterin but are deficient in molybdenum incorporation, and in vivo MogA associates
  with MoeA in a molybdopterin-dependent manner.
