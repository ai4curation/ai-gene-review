id: P39288
gene_symbol: queG
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  QueG (formerly YjeS) is the cobalamin- and iron-sulfur-dependent
  epoxyqueuosine reductase of Escherichia coli. It catalyses the last step of
  tRNA queuosine biosynthesis, reducing and deoxygenating epoxyqueuosine (oQ) at
  wobble position 34 of tRNA(Asp), tRNA(Asn), tRNA(His) and tRNA(Tyr) to
  queuosine. QueG is related to the B12-dependent reductive dehalogenases of
  halorespiring bacteria, binds cob(II)alamin and two [4Fe-4S] clusters, and
  acts in the cytoplasm. Deletion of queG causes accumulation of
  epoxyqueuosine and loss of queuosine in tRNA.
