suggested_questions:
- question: What is the physiological electron donor that reduces the QueG cobalamin/[4Fe-4S] chain in E. coli?
suggested_experiments:
- hypothesis: A flavodoxin or ferredoxin supplies electrons to E. coli QueG in vivo.
  description: >-
    Reconstitute purified E. coli QueG with candidate flavodoxin/ferredoxin
    reductase systems and quantify Q formation from oQ-tRNA by LC-MS; test
    candidate donor deletions for oQ accumulation.
