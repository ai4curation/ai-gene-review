- term:
    id: GO:0005048
    label: signal sequence receptor activity
  evidence_type: IDA
  original_reference_id: PMID:17212781
  qualifier: enables
  review:
    summary: TatB is part of the TatBC receptor that binds twin-arginine signal peptides before TatA recruitment.
    action: NEW
    reason: 'SufI copurifies with TatBC only when its signal peptide is present, crosslinking places TatC
      at the twin-arginine motif and TatB downstream of it, and a TatC substitution reduces substrate
      binding. The GO definition (''Binding to a signal sequence, a short stretch of amino acids found
      in a protein that acts as a signal for its proper localization in the cell'') covers this receptor
      activity. The comparator check agrees: SecY, the signal-recognizing subunit of the Sec translocon,
      carries the same term.'
    supported_by:
    - reference_id: file:ECOLI/tatB/tatB-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: Together with TatC, TatB is part of a receptor directly interacting with Tat signal
        peptides.
    - reference_id: PMID:29358647
      supporting_text: TatB interacts with the Tat signal peptide downstream of the RR-consensus motif
        in a proton-motive force independent manner11,14,18.
    - reference_id: PMID:26068441
      supporting_text: TatB and TatC are known to cooperate in binding RR-signal peptides and to form
        higher-order oligomeric structures.
    - reference_id: PMID:17212781
      supporting_text: the Tat substrate protein SufI was found to copurify with the TatBC, but not the
        TatA, complex. This binding required the SufI signal peptide.
