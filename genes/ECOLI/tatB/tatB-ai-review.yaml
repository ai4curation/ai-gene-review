id: P69425
gene_symbol: tatB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: 'TatB is a single-spanning inner-membrane protein of the Escherichia coli twin-arginine translocation
  (Tat) system, homologous to TatA but not interchangeable with it. TatB and TatC form a 1:1 receptor
  complex: TatB links TatC monomers into a circular receptor, contacts the signal peptide downstream of
  the twin-arginine motif and provides a binding platform for the folded mature domain, before TatA is
  recruited for translocation.'
