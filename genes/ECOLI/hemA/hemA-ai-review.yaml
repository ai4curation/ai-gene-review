suggested_questions:
- question: >-
    Was the 45 kDa second Glu-tRNA reductase activity reported in 1991 (PMID:1990004) a
    proteolytic or monomeric form of HemA, or a distinct protein? hemA auxotrophy suggests
    HemA is the only physiologically relevant GluTR in E. coli.
- question: >-
    Is the HemA-HemL complex required for glutamate 1-semialdehyde channeling in vivo, and
    does its disruption cause measurable side-product formation or ALA limitation in cells?
suggested_experiments:
- hypothesis: HemA-HemL complex formation is needed for efficient ALA synthesis in vivo.
  description: >-
    Replace chromosomal hemA with the dimerization-domain truncation (A338Stop) or
    interface point mutants that retain reductase activity in vitro, and measure ALA,
    porphyrin intermediates and heme levels, with exogenous ALA as a rescue control.
