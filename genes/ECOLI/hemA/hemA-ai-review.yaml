- id: PMID:1990004
  title: Two glutamyl-tRNA reductase activities in Escherichia coli.
  full_text_unavailable: true
  findings:
  - statement: Purified E. coli Glu-tRNA reductase has an 85 kDa native mass and reduces
      E. coli Glu-tRNA(2Glu) to glutamate 1-semialdehyde with NADPH.
    supporting_text: In the presence of NADPH both enzyme activities converted E. coli
      Glu-tRNA(2Glu) to glutamate 1-semialdehyde.
  reference_review:
    relevance: MEDIUM
    correctness: DISPUTED
    review_notes: >-
      Early purification (1991). The abstract interprets the 85 kDa native species as a
      monomer, which conflicts with the 418-residue (about 46 kDa) HemA chain and with the
      later homodimer assignment (PMID:12370189); the GOA curator's identical protein
      binding reading is consistent with the later work. The second, 45 kDa activity was
      not assigned to a gene here.
