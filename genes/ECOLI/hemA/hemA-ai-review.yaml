status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  HemA is glutamyl-tRNA reductase (GluTR), the enzyme that catalyses the first committed
  step of tetrapyrrole biosynthesis in Escherichia coli by the C5 (glutamyl-tRNA) route.
  It reduces glutamyl-tRNA(Glu), charged by the glutamyl-tRNA synthetase used for
  translation, with NADPH to glutamate 1-semialdehyde, releasing tRNA(Glu). Catalysis
  proceeds through a thioester between the active-site Cys50 and the glutamate moiety,
  which NADPH then reduces; without NADPH the enzyme only hydrolyses the substrate
  (esterase partial reaction). The soluble enzyme is a V-shaped homodimer with an
  N-terminal catalytic domain, an NADPH-binding domain and a C-terminal dimerization
  domain, and it associates with glutamate-1-semialdehyde 2,1-aminomutase (HemL) so that
  the reactive aldehyde product is channelled to HemL for conversion to
  5-aminolevulinate, the common precursor of heme and siroheme. hemA mutants are
  5-aminolevulinate auxotrophs.
