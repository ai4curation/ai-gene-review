- term:
    id: GO:0033014
    label: tetrapyrrole biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR000343
  - InterPro:IPR015895
  - InterPro:IPR015896
  - InterPro:IPR036343
  - InterPro:IPR036453
  review:
    summary: >-
      InterPro2GO mapping of the GluTR signatures to tetrapyrrole biosynthesis. HemA
      makes glutamate 1-semialdehyde, the immediate precursor of 5-aminolevulinate, the
      first common precursor of all tetrapyrroles.
    action: ACCEPT
    reason: >-
      HemA catalyses the first step of tetrapyrrole biosynthesis in E. coli
      (PMID:12370189), and its product feeds every tetrapyrrole the cell makes (heme b and
      its derivatives, and siroheme). GO defines GO:0033014 as "The chemical reactions and
      pathways leading to the formation of tetrapyrroles, natural pigments containing four
      pyrrole rings joined by one-carbon units linking position 2 of one pyrrole ring to
      position 5 of the next." This is a direct, accurately scoped process term for the
      shared trunk step and matches the verdict for the Pseudomonas putida ortholog
      (genes/PSEPK/hemA).
    supported_by:
    - reference_id: PMID:12370189
      supporting_text: In the first step of tetrapyrrole biosynthesis in Escherichia coli,
        glutamyl-tRNA reductase (GluTR, encoded by hemA) catalyzes the NADPH-dependent
        reduction of glutamyl-tRNA to glutamate-1-semialdehyde.
    - reference_id: PMID:15757895
      supporting_text: In Escherichia coli the first common precursor of all tetrapyrroles,
        5-aminolevulinic acid, is synthesized from glutamyl-tRNA (Glu-tRNA(Glu)) in a
        two-step reaction catalyzed by glutamyl-tRNA reductase (GluTR) and
        glutamate-1-semialdehyde 2,1-aminomutase (GSA-AM).
- term:
    id: GO:0042802
    label: identical protein binding
  evidence_type: IDA
  original_reference_id: PMID:1990004
  qualifier: enables
  review:
    summary: >-
      Native molecular-mass measurement of purified E. coli Glu-tRNA reductase
      (85 kDa by sedimentation and gel filtration). The authors read this as a monomer,
      but the 418-residue HemA chain is about 46 kDa, and later work on recombinant
      E. coli GluTR established a homodimer.
    action: MODIFY
    reason: >-
      Self-association is correct, but GO:0042802 is less specific than the evidence
      supports: E. coli GluTR is a homodimer (PMID:12370189), and its C-terminal
      dimerization domain is required for complex formation with HemL (PMID:15757895).
      GO:0042803 protein homodimerization activity, defined as "Binding to an identical
      protein to form a homodimer.", is an is_a child of identical protein binding and
      states the supported claim. Non-core: dimerization is structural.
    proposed_replacement_terms:
    - id: GO:0042803
      label: protein homodimerization activity
    supported_by:
    - reference_id: PMID:12370189
      supporting_text: Soluble homodimeric E. coli GluTR was made by co-expressing the hemA
        gene and the chaperone genes dnaJK and grpE.
    - reference_id: PMID:15757895
      supporting_text: The analysis of a GluTR mutant truncated in the 80-amino acid
        C-terminal dimerization domain (GluTR-A338Stop) revealed the importance of GluTR
        dimerization for complex formation.
    - reference_id: file:ECOLI/hemA/hemA-uniprot.txt
      record_section: ["CC:SUBUNIT"]
      supporting_text: 'SUBUNIT: Homodimer.'
