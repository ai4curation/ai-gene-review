    summary: >-
      Co-immunoprecipitation and gel-permeation evidence that GluTR forms a complex with
      glutamate-1-semialdehyde 2,1-aminomutase (HemL, P23893), proposed to channel the
      reactive glutamate 1-semialdehyde between the two active sites.
    action: REMOVE
    reason: >-
      The interaction is real and functionally meaningful (metabolic channeling between
      the two C5-pathway enzymes), but bare GO:0005515 carries no functional information
      and is removed under the project's protein-binding policy; removal does not mean the
      interaction is false. No more informative MF term describes being a channeling
      partner; the HemA-HemL association is recorded in the description and notes.
    supported_by:
