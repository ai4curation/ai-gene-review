id: P0AE16
gene_symbol: ampG
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  AmpG is an inner-membrane permease of the major facilitator superfamily that
  imports peptidoglycan turnover products for recycling. It transports the
  disaccharide GlcNAc-1,6-anhydro-MurNAc and GlcNAc-anhydro-MurNAc-peptides from
  the periplasm into the cytoplasm, in a reaction driven by the proton motive
  force. These anhydromuropeptides are generated by lytic transglycosylases
  acting on the sacculus; once inside the cytoplasm they are disassembled by
  NagZ and AmpD and the components re-enter peptidoglycan precursor synthesis.
  Because the imported muropeptides are also the signal for AmpC beta-lactamase
  induction, loss of AmpG blocks both recycling and beta-lactamase induction.
