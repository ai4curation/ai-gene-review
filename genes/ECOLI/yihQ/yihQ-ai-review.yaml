    summary: YihQ hydrolyses sulfoquinovosyl glycerides, a step in sulfolipid breakdown.
    action: MODIFY
    reason: True but general. The process YihQ performs is the hydrolytic breakdown of the sulfoglycolipid
      SQDG and its glycoside SQGro to release sulfoquinovose (PMID:26878550, PMID:30276262). GO has no
      sulfoquinovosyl-glyceride catabolism term (OLS search), so glycolipid catabolic process (GO:0019377)
      is the closest specific descendant. YihQ does not itself break down sulfoquinovose, so GO:1902777
      is not proposed.
    supported_by:
