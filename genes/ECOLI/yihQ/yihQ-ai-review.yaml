  review:
    summary: Mapping from the galactose mutarotase-like superfamily domain; YihQ binds its sulfosugar substrate
      only as part of catalysis.
    action: MARK_AS_OVER_ANNOTATED
    reason: IPR011013 is a structural superfamily signature shared by GH31 N-terminal domains and mutarotases.
