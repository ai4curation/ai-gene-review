  label: Escherichia coli K-12
description: YihQ is the sulfoquinovosidase of Escherichia coli, a glycoside hydrolase family 31 enzyme
  that hydrolyses the alpha-glycosidic bond of sulfoquinovosyl diacylglycerol (the plant and cyanobacterial
  sulfolipid) and of its delipidated glycoside sulfoquinovosyl glycerol, releasing alpha-sulfoquinovose
  and glycerol or diacylglycerol. It uses a retaining Koshland mechanism with Asp405 as nucleophile and
  Asp472 as acid/base, and recognises the substrate sulfonate through an Arg-Trp-Tyr motif that distinguishes
  sulfoquinovosidases from alpha-glucosidases of the same family. The released sulfoquinovose feeds the
  sulfoglycolytic Embden-Meyerhof-Parnas pathway encoded in the same gene cluster, allowing E. coli to
  grow on sulfoquinovosyl glycerol as a carbon source.
