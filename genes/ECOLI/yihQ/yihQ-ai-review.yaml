        (SQ), which is then degraded by E.coli through the SQ Embden-Meyerhof-Parnas (SQ-EMP) sulfoglycolysis
        pathway as a source of carbon and sulfur.
    - reference_id: PMID:30276262
      supporting_text: Collectively, these data reveal that E. coli can utilize SQGro as a sole carbon source,
        enabled by endogenous SQase activity
