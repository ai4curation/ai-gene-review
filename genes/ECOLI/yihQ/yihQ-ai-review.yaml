  title: YihQ is a sulfoquinovosidase that cleaves sulfoquinovosyl diacylglyceride sulfolipids.
  findings:
  - statement: E. coli YihQ is a dedicated sulfoquinovosidase upstream of sulfoglycolysis.
    supporting_text: We have identified Escherichia coli YihQ as the first dedicated sulfoquinovosidase
      and the gateway enzyme to sulfoglycolytic pathways.
    reference_section_type: ABSTRACT
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary characterization of YihQ (structure, mutagenesis, kinetics). Only the abstract
      is cached; enzymatic details are taken from the UniProt curation of this paper and from PMID:30276262.
- id: PMID:30276262
  title: Structural and Biochemical Insights into the Function and Evolution of Sulfoquinovosidases.
  findings:
  - statement: YihQ is a retaining GH31 hydrolase with D405 nucleophile and D472 acid/base.
    supporting_text: revealed that it is a stereochemically retaining glycoside hydrolase that utilizes
      a classical Koshland retaining mechanism involving a catalytic nucleophilic carboxylate (D405) and
      acid/base (D472) residue.
  - statement: YihQ is the only sulfoquinovosidase of E. coli and prefers the natural SQGro diastereomer.
    supporting_text: notably, there are no SQase homologues of YihQ within E. coli, and the upregulation
      of YihQ expression upon growth on SQ3 strongly suggests that all sulfoquinovosidase activity can be
      ascribed to YihQ.
  - statement: SQase activity enables growth of E. coli on SQGro.
    supporting_text: Collectively, these data reveal that E. coli can utilize SQGro as a sole carbon source,
      enabled by endogenous SQase activity
  full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached; direct assays and structures of E. coli YihQ and Agrobacterium SQase.
- id: PMID:33791429
  title: Molecular Basis of Sulfosugar Selectivity in Sulfoglycolysis.
  findings:
  - statement: The alpha-SQ product of YihQ must be mutarotated before the beta-specific isomerase YihS
      acts.
    supporting_text: it ensures that the α-SQ product of the sulfoquinovosidase YihQ can be efficiently
      utilized by the SQ-SF isomerase YihS, which has a clear preference for β-SQ and little-to-no activity
      on α-SQ.
  full_text_unavailable: false
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Pathway context for YihQ's product; YihQ itself is not assayed here.
