core_functions:
- description: >-
    Periplasmic heme chaperone: receives heme from CcmC in the CcmCDE complex,
    binds it covalently via His130 to form holo-CcmE, and after CcmAB-dependent
    release delivers the heme to the CcmF/CcmH synthase for covalent attachment
    to apocytochrome c.
