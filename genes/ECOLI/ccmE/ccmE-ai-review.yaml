  review:
    summary: CcmABCD/E assembly is demonstrated, but its fit to an ATP-binding cassette transporter complex
      remains mechanistically contested.
    action: UNDECIDED
    reason: Structures establish association with the ABC-family machinery, including bound CcmE. GO:0043190
