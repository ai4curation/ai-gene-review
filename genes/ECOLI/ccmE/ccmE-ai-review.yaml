- term:
    id: GO:1904334
    label: heme import across plasma membrane
  evidence_type: NAS
  original_reference_id: PMID:24044352
  qualifier: involved_in
  review:
    summary: The asserted heme import direction is opposite to the system I maturation route.
    action: REMOVE
    reason: The checked GO definition requires movement from outside the cell across the plasma membrane
      into the cytosol. System I handles cytoplasmically synthesized heme for periplasmic maturation.
      Neither competing export model supports cytosolic import. This direction mismatch, rather than a
      blanket rejection of heme transport, is the reason for removal.
    supported_by:
    - reference_id: PMID:24044352
      supporting_text: Heme is also synthesized in the cytoplasm
- term:
    id: GO:0018063
    label: cytochrome c-heme linkage
  evidence_type: IMP
  original_reference_id: PMID:9712585
  qualifier: involved_in
  review:
    summary: CcmE donates its covalently bound heme for attachment to apocytochrome c; the heme-linkage
      process is the precise process in which it acts.
    action: NEW
    reason: 'Argued on its own footing, separately from the protein-heme linkage row (kept as ACCEPT for
      CcmE''s own His130 bond). CcmE does part of the work of the step rather than being merely required:
      it is the heme donor, carrying the cofactor as a covalent His130 adduct and transferring it to the
      CcmF/CcmH ligation site. The system I module models CcmE with this process.'
    supported_by:
    - reference_id: PMID:9712585
      supporting_text: The heme was then released and delivered to apocytochrome c.
    - reference_id: PMID:24044352
      supporting_text: CcmE was found to have the surprising property of binding heme covalently, via
        a conserved histidine residue, before transferring the heme to the apocytochrome.
