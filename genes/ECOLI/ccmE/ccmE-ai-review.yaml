  review:
    summary: >-
      CcmE is itself covalently linked to heme (His130) and delivers that heme
      for covalent attachment to apocytochrome c. The term is correct but
      general.
    action: MODIFY
    reason: >-
      Protein-heme linkage is true but less specific than the evidence
      supports. The physiological purpose of CcmE's heme handling is covalent
      attachment of heme to c-type cytochromes, so the is_a descendant
      cytochrome c-heme linkage (GO:0018063) is the better term and matches
      the system I module annoton for CcmE. CcmE participates in the step: it
      supplies the heme it carries covalently and its His130/Tyr134 adduct
      chemistry is required for transfer.
    proposed_replacement_terms:
    - id: GO:0018063
      label: cytochrome c-heme linkage
    supported_by:
