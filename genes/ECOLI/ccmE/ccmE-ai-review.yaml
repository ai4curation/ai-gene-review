  title: UniProtKB entry P69490 (CcmE, Escherichia coli K-12)
  findings:
  - statement: Curated function, subunit (CcmCD ternary complex, CcmF interaction) and HAMAP family classification
      of CcmE.
- id: PMID:11744735
  title: A bacterial cytochrome c heme lyase. CcmF forms a complex with the heme chaperone CcmE and CcmH
    but not with apocytochrome c.
  findings:
  - statement: CcmF co-immunoprecipitates with CcmE and CcmH, placing holo-CcmE at the CcmFH heme-lyase
      complex.
- id: PMID:15513913
  title: CcmD is involved in complex formation between CcmC and the heme chaperone CcmE during cytochrome
    c maturation.
  findings:
  - statement: CcmC, CcmD and CcmE form a ternary complex during heme delivery to CcmE.
- id: PMID:16364305
  title: The membrane anchors of the heme chaperone CcmE and the periplasmic thioredoxin CcmG are functionally
    important.
  findings:
  - statement: CcmE is a monotopic membrane protein whose anchor is needed for efficient heme receipt
      but not for heme delivery to cytochrome c.
- id: PMID:16824107
  title: ABC transporter-mediated release of a haem chaperone allows cytochrome c biogenesis.
  findings:
  - statement: CcmAB-dependent ATP hydrolysis releases holo-CcmE from CcmC; without CcmA or CcmB holo-CcmE
      is trapped in a dead-end complex.
- id: PMID:19629033
  title: A conserved haem redox and trafficking pathway for cofactor attachment.
  findings:
  - statement: Purified CcmCDE complexes show CcmC His60/His184 as heme axial ligands and CcmE His130
      as the covalent adduct; holo-CcmE heme is oxidized.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached (PMC2735175); E. coli CcmCDE and holo-CcmE purification.
- id: PMID:24044352
  title: Probing heme delivery processes in cytochrome c biogenesis System I.
  findings:
  - statement: Reviews the CcmABCDE heme-delivery model and states that the CcmABC heme-transporter model
      has been disproven.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: ' Historical evidence/model: its positive loading/release findings remain useful, but
      any blanket exclusion of heme transport must be read alongside conflicting PMID:37626034, PMID:40026579
      and PMID:40167305. This audit does not infer a universally proven conduit.'
- id: PMID:9712585
  title: Prototype of a heme chaperone essential for cytochrome c maturation.
  findings:
  - statement: CcmE binds heme covalently via a histidine in the periplasm and delivers it to apocytochrome
      c.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only in cache; founding paper for CcmE heme chaperone function.
- id: PMID:10339610
  title: Heme transfer to the heme chaperone CcmE during cytochrome c maturation requires the CcmC protein,
    which may function independently of the ABC-transporter CcmAB.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: ' Historical evidence/model: its positive loading/release findings remain useful, but
      any blanket exclusion of heme transport must be read alongside conflicting PMID:37626034, PMID:40026579
      and PMID:40167305. This audit does not infer a universally proven conduit.'
- id: PMID:37626034
  title: Architecture of the Heme-translocating CcmABCD/E complex required for Cytochrome c maturation.
  findings:
  - statement: E. coli CcmABCD/E structures support ATP-coupled conformational changes and propose a heme
      floppase mechanism.
    supporting_text: suggest that this unusual ABC transporter acts as a heme floppase
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text read. Recombinant E. coli operon from pEC86; N-terminal Strep-tag II on CcmA,
      expression in BL21(DE3)/C43(DE3). These are expression hosts, not independently established donor
      strains. Detergent structures and ATPase-deficient E154Q states support a model, not a purified
      vectorial heme-flux measurement. The proposed CcmB/CcmC route conflicts with PMID:40167305.
- id: PMID:40167305
  title: Biochemical mapping reveals a conserved heme transport mechanism via CcmCD in System I bacterial
    cytochrome c biogenesis.
  findings:
  - statement: The E. coli biochemical mapping results do not support CcmB as the heme-acceptance component
      of System I; this is evidence against that model, not an MR-1 transport assay.
    supporting_text: do not support a role for CcmB in heme acceptance for System I
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text read. GST:CcmCDE(H130A), engineered CcmC/CcmD cysteine variants and CcmD:FLAG
      trap endogenous-heme contacts; functional maturation is checked in recombinant complete-system assays.
      H130A biases heme occupancy. These are contact/structure-function data, not purified directional
      flux. The authors explicitly reject the CcmB conduit interpretation of PMID:40026579/37626034 and
      propose ATP-independent CcmCD transport plus ATP-dependent CcmE release. Comparative predicted structures
      are not KT2440 functional assays.
