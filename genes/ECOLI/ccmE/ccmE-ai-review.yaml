description: >-
  CcmE is the heme chaperone of the Escherichia coli cytochrome c maturation
  (Ccm) system I. It is a monotopic inner-membrane protein with an N-terminal
  signal-anchor helix and a C-terminal periplasmic OB-fold heme-binding domain.
  In a ternary complex with CcmC and CcmD, CcmE receives heme from CcmC and
  binds it covalently through a single bond between His130 and a heme vinyl
  group, with Tyr134 providing an axial iron ligand, forming holo-CcmE. The
  ATP-hydrolysing CcmAB subcomplex is then needed to release holo-CcmE from
  CcmC, after which CcmE delivers the heme to the CcmF/CcmH holocytochrome c
  synthase for covalent attachment to the CXXCH motifs of periplasmic
  apocytochromes c. CcmE is essential for the formation of all periplasmic
  c-type cytochromes in E. coli.
