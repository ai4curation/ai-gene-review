  review:
    summary: Co-immunoprecipitation work from the Thony-Meyer laboratory placing CcmE in complexes with
      other Ccm components (GOA lists CcmC as the partner). The interaction is real, but generic protein
      binding does not convey CcmE's function.
    action: REMOVE
    reason: Following the protein-binding policy, the bare GO:0005515 term is removed as uninformative;
      this does not dispute the reported CcmE interactions. CcmE's interactions with CcmC (heme loading)
      and CcmF (heme delivery) are steps in its heme-chaperone cycle, which is captured by heme binding
      (GO:0020037) and cytochrome c-heme linkage (GO:0018063). No more informative MF term exists for
      the chaperone-partner contact itself.
    supported_by:
    - reference_id: PMID:11744735
      supporting_text: Co-immunoprecipitation experiments revealed that CcmF interacts directly with the
        heme donor CcmE and with CcmH but not with apocytochrome c.
