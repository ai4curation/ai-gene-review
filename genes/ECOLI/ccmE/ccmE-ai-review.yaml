  review:
    summary: Heme binding is conserved across the CcmE/CycJ family, including plant mitochondrial CCME;
      E. coli CcmE is among the experimental donors.
    action: ACCEPT
    reason: The PAINT node places heme binding at the root of the CcmE family, and E. coli CcmE has direct
      experimental evidence (its own appearance in the WITH/FROM reflects this grounding). Heme binding
      is CcmE's core molecular activity as a heme chaperone.
    supported_by:
    - reference_id: file:ECOLI/ccmE/ccmE-uniprot.txt
      supporting_text: Heme chaperone required for the biogenesis of c-type cytochromes. Transiently binds
