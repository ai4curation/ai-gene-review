suggested_questions:
- question: >-
    How is the covalent His130-heme bond of holo-CcmE broken during transfer to
    apocytochrome c at CcmF/CcmH, and does it require reduction of the heme
    iron by the CcmF b-heme?
- question: >-
    Should GO provide a molecular function term for heme carrier/chaperone
    activity, so that CcmE-like chaperones are not described only by heme
    binding?
suggested_experiments:
- description: >-
    Reconstitute heme transfer from purified holo-CcmE to apocytochrome c with
    purified CcmF/CcmH and CcmG under controlled redox conditions to measure
    transfer kinetics and the requirement for heme iron reduction.
  experiment_type: in vitro heme-transfer reconstitution
