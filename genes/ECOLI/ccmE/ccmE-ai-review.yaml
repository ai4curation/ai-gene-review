  - UniRule:UR000089058
  review:
    summary: CcmE is a monotopic inner (cytoplasmic) membrane protein whose N-terminal helix anchors a
      periplasmic heme-binding domain.
    action: ACCEPT
    reason: Experimental work describes CcmE as a monotopic membrane protein with a periplasmic functional
      domain, and its membrane anchor is functionally important for heme receipt from CcmC. Plasma membrane
      is the correct location term for the E. coli inner membrane.
    supported_by:
    - reference_id: PMID:16364305
      supporting_text: The cytochrome c maturation system of Escherichia coli contains two monotopic membrane
        proteins with periplasmic, functional domains, the heme chaperone CcmE and the thioredoxin CcmG.
- term:
    id: GO:0017003
    label: protein-heme linkage
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR004329
  - InterPro:IPR036127
  - UniRule:UR000089058
  review:
    summary: CcmE is itself covalently linked to heme through His130 before delivering that heme to apocytochrome
      c.
    action: ACCEPT
    reason: CcmE supplies His130 to its covalent heme-protein intermediate before delivering heme downstream.
      The general protein-heme linkage row explicitly captures that chemical participation. GO:0018063
      currently includes other heme proteins as well as cytochromes, so CcmE is not excluded by its name;
      its later donor role in cytochrome maturation is separately represented by the retained linkage
      replacements and historical NEW row. The redundant NEW proposal is preserved as frozen history rather
      than removed during this evidence correction.
    supported_by:
    - reference_id: PMID:9712585
      supporting_text: CcmE, was shown to bind heme in the bacterial periplasm by way of a single covalent
        bond to a histidine.
