gene_symbol: moaC
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  MoaC is the cyclic pyranopterin monophosphate (cPMP) synthase of Escherichia coli, the second
  enzyme of molybdenum cofactor (Moco) biosynthesis. It receives
  (8S)-3',8-cyclo-7,8-dihydroguanosine 5'-triphosphate (3',8-cH2GTP), the product of the radical
  SAM GTP 3',8-cyclase MoaA, and catalyses the complex rearrangement that builds the pyranopterin
  ring and cyclic phosphate of cPMP (precursor Z), releasing diphosphate. cPMP is then converted
  to molybdopterin by the MoaD-MoaE molybdopterin synthase. MoaC is a small cytoplasmic protein
  with a ferredoxin-like fold that assembles as a homohexamer (trimer of dimers); its active site
  lies at the interface between two monomers, and residues such as Asp128, Lys51, His77 and
  Glu112 are required for activity. It is encoded in the anaerobically induced moaABCDE operon
  and is the bacterial counterpart of the human MOCS1B domain.
