suggested_questions:
- question: Is the labile 3',8-cH2GTP intermediate channelled from MoaA to MoaC in E. coli through
    a transient MoaA-MoaC complex, or does it diffuse freely between the enzymes?
suggested_experiments:
- hypothesis: MoaA and MoaC interact transiently to protect 3',8-cH2GTP.
  description: Compare cPMP yields from coupled versus sequential MoaA/MoaC reactions under
    anaerobic conditions and test for a MoaA-MoaC complex by crosslinking or native mass
    spectrometry.
