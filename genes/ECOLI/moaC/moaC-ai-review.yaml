    Cyclic pyranopterin monophosphate synthase: rearranges the MoaA product
    3',8-cH2GTP into cyclic pyranopterin monophosphate (precursor Z) and diphosphate, the second
    step of molybdenum cofactor biosynthesis, acting as a homohexamer with active sites at dimer
    interfaces.
