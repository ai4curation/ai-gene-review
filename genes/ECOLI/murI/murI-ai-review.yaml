core_functions:
- description: >-
    MurI racemizes L-glutamate to D-glutamate, supplying the D-Glu that MurD adds
    to UDP-MurNAc-L-Ala in cytoplasmic peptidoglycan precursor synthesis. Its
    activity is allosterically switched on by UDP-MurNAc-L-Ala, matching D-Glu
    production to precursor demand.
  molecular_function:
    id: GO:0008881
    label: glutamate racemase activity
  directly_involved_in:
  - id: GO:0009252
    label: peptidoglycan biosynthetic process
  supported_by:
  - reference_id: PMID:8098327
    supporting_text: The murI gene product was overproduced and identified as a glutamate
      racemase activity.
  - reference_id: PMID:8172902
    supporting_text: It adjusts the formation of D-glutamic acid to the requirements
      of peptidoglycan synthesis and avoids an excessive racemization of the intracellular
      pool of L-glutamic acid.
proposed_new_terms: []
suggested_questions:
- question: >-
    Does E. coli MurI inhibit DNA gyrase at native expression levels, and is the
    reported effect separable from racemase activity as for mycobacterial MurI?
    Until then, should any GO annotation for gyrase inhibition be made for E. coli
    MurI?
- question: >-
    Is UDP-MurNAc-L-Ala activation conserved across Enterobacterales MurI
    orthologs (relevant to whether module representatives such as PSEPK Q88PW2
    share the regulation)?
suggested_experiments:
- experiment_type: separation-of-function genetics
  description: >-
    Express catalytically dead (C92A/C204A) and activator-site mutant MurI at
    native levels and measure DNA supercoiling, fluoroquinolone sensitivity and
    gyrase activity, to test whether gyrase modulation by E. coli MurI is
    physiological and independent of racemization.
