  label: Escherichia coli K-12
description: >-
  MurI is the glutamate racemase of Escherichia coli, a cofactor-independent
  enzyme of the aspartate/glutamate racemase family that interconverts
  L-glutamate and D-glutamate using two active-site cysteines as proton donor and
  acceptor. It is the source of the D-glutamate that MurD adds to
  UDP-N-acetylmuramoyl-L-alanine at position 2 of the peptidoglycan stem
  peptide, and is essential unless D-glutamate is supplied. The E. coli enzyme is
  a monomer with very low basal activity that is allosterically activated about
  1000-fold by UDP-N-acetylmuramoyl-L-alanine, the substrate of the next pathway
  enzyme, which couples D-glutamate production to peptidoglycan precursor demand
  and protects the cellular L-glutamate pool. An inhibitory effect on DNA gyrase
  has been reported for overproduced E. coli MurI, but its physiological
  significance is unestablished.
