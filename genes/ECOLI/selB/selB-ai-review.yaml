  review:
    summary: >-
      SelB is a specialised translation elongation factor that replaces EF-Tu for Sec-tRNA(Sec) delivery
      at UGA.
    action: ACCEPT
    reason: >-
      Although the GOA row is electronic, the activity is established for E. coli SelB: homology to EF-Tu/IF-2,
      1:1 guanine nucleotide binding, specific complex with Sec-tRNA(Sec), ribosome-stimulated GTP hydrolysis,
      and formation of a SelB-Sec-tRNA-mRNA complex next to the UGA codon. This is the core function.
