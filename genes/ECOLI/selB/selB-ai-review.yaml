suggested_questions:
- question: >-
    Is the SelB-SerC co-purification seen in large-scale AP-MS a specific complex with any role in coordinating
    serine supply to tRNA(Sec), or a non-specific co-purification?
suggested_experiments:
- hypothesis: SelB and SerC do not form a specific complex.
  description: >-
    Test SelB-SerC binding with purified proteins (e.g. ITC or pull-down) and check whether serC mutation
    affects selenoprotein (FdhF) synthesis when serine is supplied.
