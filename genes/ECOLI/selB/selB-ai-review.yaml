id: P14081
gene_symbol: selB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  SelB is the selenocysteine-specific translation elongation factor of Escherichia coli, a GTPase of the
  translation-factor superfamily related to EF-Tu and IF-2. It replaces EF-Tu for the one special aminoacyl-tRNA,
  binding GTP and selenocysteinyl-tRNA(Sec) but not seryl-tRNA(Sec), and recognising the long 8-bp acceptor
  stem of tRNA(Sec). Its C-terminal winged-helix extension binds the loop of the SECIS hairpin that lies
  immediately 3' of the UGA codon in selenoprotein mRNAs such as fdhF, so that a SelB-GTP-Sec-tRNA(Sec)
  complex is positioned on the mRNA at the recoded codon. Intrinsic GTP hydrolysis is low and is stimulated
  by 70S ribosomes and further by the SECIS RNA. SelB is required for UGA-directed insertion of selenocysteine
  but not for synthesis of Sec-tRNA(Sec); it is a cytoplasmic protein present at roughly 1100 copies per
  cell.
existing_annotations:
- term:
    id: GO:0000049
    label: tRNA binding
  evidence_type: IDA
  original_reference_id: PMID:1939093
  qualifier: enables
  review:
    summary: >-
      Purified SelB binds tRNA(Sec); the 8-bp acceptor stem is the determinant for SelB binding and excludes
      EF-Tu.
    action: ACCEPT
    reason: >-
      Direct binding studies with wild-type and acceptor-stem-mutant tRNA(Sec). Binding of the charged
      tRNA is an intrinsic part of SelB elongation-factor function; SelB specifically binds selenocysteinyl-tRNA(Sec)
      and not seryl-tRNA(Sec) (PMID:2531290). No more specific tRNA-binding descendant fits this aminoacyl-tRNA
      (GO:1904678 alpha-aminoacyl-tRNA binding is not under tRNA binding).
    supported_by:
    - &id001
      reference_id: PMID:1939093
      supporting_text: >-
        The aminoacyl-acceptor helix of tRNA(Sec), therefore, is a major determinant directing binding
        to SELB and precluding interaction with EF-Tu
    - &id002
      reference_id: PMID:2531290
      supporting_text: >-
        purified SELB protein binds guanine nucleotides in a 1:1 molar ratio and specifically complexes
        selenocysteyl-tRNAUCA, but does not interact with seryl-tRNAUCA
