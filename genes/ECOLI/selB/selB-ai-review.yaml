- term:
    id: GO:0001514
    label: selenocysteine incorporation
  evidence_type: IMP
  original_reference_id: PMID:2524495
  qualifier: involved_in
  review:
    summary: >-
      In vivo Sec-tRNA formation needs SelA and SelD but not SelB, placing SelB at the decoding step.
    action: ACCEPT
    reason: >-
      The genetic data separate SelB from Sec-tRNA synthesis and, with the earlier sel mutant phenotypes
      (selenoprotein synthesis lost), assign it to the incorporation step. Accepted with the curator,
      who read the full text; the conclusion is fully borne out by later biochemistry.
    supported_by:
    - reference_id: PMID:2524495
      supporting_text: >-
        The formation of selenocysteine depended on the presence of functional products of the selA and
        selD genes but not of the selB gene. The selB gene product, therefore, may have a function in
        the decoding step itself
