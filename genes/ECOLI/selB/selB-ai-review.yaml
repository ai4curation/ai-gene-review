      supporting_text: >-
        Here, we demonstrate that SelB, like EF-Tu, exhibits a low intrinsic GTPase activity in the absence
        of ribosomes. As shown for EF-Tu, GTPase activity of SelB is stimulated by the presence of E.
        coli 70S ribosomes
