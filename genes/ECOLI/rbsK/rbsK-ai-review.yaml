taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: RbsK is the Escherichia coli ribokinase, a homodimeric PfkB-family carbohydrate kinase that
  phosphorylates D-ribose at O-5 with Mg-ATP to give D-ribose 5-phosphate, the final step of ribose catabolism
  after RbsABC import and RbsD-catalyzed pyranose-to-furanose conversion. The enzyme is activated by potassium
  bound adjacent to the active-site anion hole and stimulated by inorganic phosphate. It also phosphorylates
  2-deoxy-D-ribose and, far less efficiently, other furanoses.
