id: P18004
gene_symbol: traC
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli (strain K12)
description: >-
  TraC is an 875-residue F-plasmid protein required to assemble mature F-pilin
  subunits into the extended F pilus, the filament that establishes contact with
  a recipient cell at the start of conjugation. It is not an integral membrane
  protein: expressed alone it is cytoplasmic, and it partitions with the
  membrane only in the presence of the other transfer-region proteins, so its
  association with the inner membrane is peripheral and depends on its partners.
  A mutant that leaves pilin processing intact but abolishes the extended pilus
  places TraC at the assembly step rather than at pilin maturation, and the same
  mutant transfers DNA at greatly reduced frequency, linking the protein to
  conjugative transfer as well as to pilus biogenesis. By position in the
  transfer region and by broad similarity it corresponds to the VirB4-family
  ATPase of other type IV secretion systems, but no nucleotide binding or
  hydrolysis has been demonstrated for the F protein itself.
