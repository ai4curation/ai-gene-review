suggested_questions:
- question: What physical interaction and conformational mechanism lets compatible ACP support the E.
    coli membrane OPG glucosyltransferase system without phosphopantetheine?
- question: Does the original pantothenamide experiment establish AcpP as a participant in a xenobiotic
    response, rather than a chemically modified target?
- question: Which AcpP states transmit lipid-starvation signals to SpoT, and how is their availability
    balanced against acyl-carrier and MukB functions?
suggested_experiments:
- description: Reconstitute OpgH-containing membranes with defined apo-, holo- and mutant E. coli ACP,
    measuring glucan products and direct ACP-partner interactions; compare inhibitory ACPs without inferring
    native pathway absence from incompatibility.
  experiment_type: biochemical reconstitution
