- term:
    id: GO:0009410
    label: response to xenobiotic stimulus
  evidence_type: IMP
  original_reference_id: PMID:15459190
  qualifier: acts_upstream_of_or_within
  review:
    summary: Pantothenamides modify AcpP, but its active participation in a xenobiotic response remains
      uncertain.
    action: UNDECIDED
    reason: PMID:15459190 reports inactive ACP accumulation after pantothenamide exposure, establishing
      a drug target and altered cellular chemistry. GO:0009410 describes a response process; being modified
      by a drug does not by itself establish that ACP executes that response. The original full text was
      not accessible, so the experimental annotation is not rejected. Full PMID:20047918 confirms modified
      ACP but challenges the proposed accumulation mechanism and instead implicates CoA synthesis. Retain
      uncertainty rather than infer resistance, detoxification or a false experimental attribution.
    supported_by:
    - reference_id: PMID:15459190
      supporting_text: because of the covalent modification of ACP
    - reference_id: PMID:20047918
      supporting_text: We report that AcpH readily removes the N5-Pan-modified prosthetic group both in
        vivo and in vitro
- term:
    id: GO:0031177
    label: phosphopantetheine binding
  evidence_type: IMP
  original_reference_id: PMID:16352845
  qualifier: enables
  review:
    summary: AcpP carries a covalently attached phosphopantetheine prosthetic group.
    action: ACCEPT
    reason: The original experimental annotation is consistent with phosphopantetheine association, but
      covalent attachment alone would not satisfy the noncovalent GO:0005488 binding ancestor. Independent
      butyryl-ACP crystallography shows the cavity occupied by the beta-mercaptoethylamine moiety of the
      acylated phosphopantetheine group, supporting noncovalent accommodation of the attached cofactor
      as well as its covalent tether. Retain the curator claim on this combined evidence, without claiming
      the abstract-only mutant paper itself measured free-cofactor affinity. The modification is necessary
      for lipid-carrier chemistry but dispensable for the OPG cofactor role.
    supported_by:
    - reference_id: PMID:16352845
      supporting_text: 'Each of

        the mutants was efficiently modified with the phosphopantetheinyl moiety'
    - reference_id: PMID:3479786
      supporting_text: 'complete removal of the

        phosphopantetheine residue by treatment with a specific phosphodiesterase'
    - reference_id: PMID:12057197
      supporting_text: expanded and occupied by the butyryl and beta-mercaptoethylamine
- term:
    id: GO:0001671
    label: ATPase activator activity
  evidence_type: IC
  original_reference_id: PMID:34795302
  review:
    summary: AcpP binding stimulates MukB ATPase in assembled MukBF/MukBEF assays.
    action: NEW
    reason: Purified-protein depletion/add-back and interface-mutant assays demonstrate binding-dependent
      ATPase stimulation, meeting the exact GO definition. This refers to MukB, not an inferred OpgH enzyme-activator
      activity. The recombinant AcpP construct was expressed from pET28a with a cleavable N-terminal His
      tag; the accessible methods do not supply its donor accession. IC records the reference-protein
      attribution from E. coli AcpP biochemistry and the independent curated target MukB interaction,
      rather than pretending an exact construct-sequence identity proof. No existing carrier or binding
      term entails this activation activity.
    supported_by:
    - &id006
      reference_id: PMID:34795302
      supporting_text: These data support the conclusion that AcpP binding to MukB promotes in vitro ATPase
        activity.
    - reference_id: file:ECOLI/acpP/acpP-uniprot.txt
      supporting_text: Interacts with MukB
    additional_reference_ids:
    - file:ECOLI/acpP/acpP-source-analysis/evidence-scope.md
- term:
    id: GO:1900727
    label: osmoregulated periplasmic glucan biosynthetic process
  evidence_type: IC
  original_reference_id: PMID:2945202
  review:
    summary: AcpP contributes the soluble protein cofactor required by the E. coli OPG glucosyltransferase
      system.
    action: NEW
    reason: Purification of the K-12 cytosolic factor, functional substitution by pure ACP, and antibody
      inhibition/add-back establish direct cofactor work in the reconstituted biosynthetic reaction, beyond
      necessity or growth phenotypes. The membrane fraction was from DF214; these experiments do not assign
      glucosyltransferase catalysis to ACP or prove arbitrary ACP interchangeability. Phosphopantetheine
      removal preserves this function. The eight-species ACP comparison includes inactive/inhibitory proteins
      and therefore limits transfer. The OPG process has no ancestor/descendant redundancy with the existing
      lipid processes. Comparator and source-scope checks are recorded in the accompanying analysis.
    supported_by:
    - &id007
      reference_id: PMID:2945202
      supporting_text: 'ACP of the highest purity has an activity in the transglucosylation system

        indistinguishable from that of the protein independently purified as

        transglucosylation factor.'
    - reference_id: PMID:3479786
      supporting_text: 'the activity of ACP in the synthesis of

        membrane-derived oligosaccharides is not altered'
    - reference_id: PMID:9171419
      supporting_text: 'characterized the proteins as active or inhibitory in the membrane

        glucosyltransferase reaction'
    additional_reference_ids:
    - file:ECOLI/acpP/acpP-source-analysis/evidence-scope.md
