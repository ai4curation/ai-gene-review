  review:
    summary: The acylated ACP cavity binds the lipid-like acyl/prosthetic-group cargo.
    action: ACCEPT
    reason: The original structural claim is supported by the experimentally observed cavity containing
      the butyryl and beta-mercaptoethylamine moieties. Current acyl binding is not a descendant of lipid
      binding, and neither term is a verified ancestor of acyl carrier activity; do not manufacture a
      hierarchy-based refinement. Retain this true binding claim without treating ACP as a membrane lipid
      transporter.
