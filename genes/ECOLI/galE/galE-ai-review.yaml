    id: GO:0052574
    label: UDP-galactose biosynthetic process
  evidence_type: TAS
  original_reference_id: PMID:23339688
  qualifier: involved_in
  review:
    summary: >-
      Proposed annotation: GalE is the enzyme that forms UDP-galactose from
      UDP-glucose, and in cells not supplied with galactose it is the route to the
      UDP-galactose pool used for galactosylated glycans.
    action: NEW
    reason: >-
      Participation test: GalE itself catalyses the step that forms UDP-galactose,
      so it does the work of this biosynthetic process rather than being a substrate
      of it. Comparator check: the UDP-galactose-forming enzymes S. pombe Gal10 and
      Gal7 and fungal GAL10/GAL7 orthologs carry GO:0052574, while bacterial GalE
      orthologs lack it, which reads as a coverage gap rather than a convention. The
      existing galactose-metabolism rows are refined to the Leloir pathway
      (catabolic direction); this term records the anabolic role that E. coli uses
      to supply UDP-galactose to LPS and colanic acid.
    supported_by:
    - reference_id: PMID:23339688
      supporting_text: >-
        All healthy cells produce UDP-gal from uridine(5')diphospho(1)α-D-glucose
        (UDP-glc) by the action of UDP-galactose 4-epimerase (GalE).
    - reference_id: PMID:17158899
      supporting_text: >-
        The GalE, GalT, GalK, and GalU proteins are necessary for modifying galactose
        before it can be assembled into the repeating subunit of the O antigen.
