suggested_questions:
- question: >-
    How is flux through GalE partitioned between the catabolic Leloir direction and
    de novo UDP-galactose supply for LPS and colanic acid, and how does
    galactose-dependent induction of the galETKM operon affect the second role?
- question: >-
    Does the substantial fraction of purified GalE that is trapped as abortive
    E-NADH-UDP-sugar complexes occur in vivo, and is there a cellular mechanism that
    reactivates it?
suggested_experiments:
- experiment_type: metabolomics
  description: >-
    Measure UDP-glucose and UDP-galactose pools and galactose content of LPS and
    colanic acid in wild-type, galE deletion and catalytic-site mutant (Y149F, K153A)
    strains grown on glucose, to quantify GalE's contribution to de novo
    UDP-galactose supply in vivo.
