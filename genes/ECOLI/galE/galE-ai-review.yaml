  review:
    summary: >-
      Markovitz studied regulation of capsular polysaccharide (colanic acid) synthesis
      in mucoid E. coli K-12 mutants. The IEP presumably reflects elevated epimerase
      levels accompanying increased polysaccharide synthesis.
    action: KEEP_AS_NON_CORE
    reason: >-
      The cached record has no abstract, so the specific data could not be checked,
      but the biology is sound. Colanic acid contains galactose, and GalE is the
      cell's route from UDP-glucose to UDP-galactose when galactose is not supplied.
      GalE therefore acts upstream of colanic acid synthesis as a precursor supplier,
      while the polymer is assembled by the wca-encoded glycosyltransferases. Kept as
      non-core and consistent with the IMP row for the same term.
    supported_by:
