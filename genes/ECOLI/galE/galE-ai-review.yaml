core_functions:
- description: >-
    NAD+-dependent UDP-glucose 4-epimerase that reversibly interconverts
    UDP-alpha-D-glucose and UDP-alpha-D-galactose in the cytosol. It completes the
    Leloir pathway of galactose utilization and is the source of UDP-galactose for
    galactosylated glycans when galactose is not supplied.
  molecular_function:
    id: GO:0003978
    label: UDP-glucose 4-epimerase activity
  directly_involved_in:
  - id: GO:0033499
    label: beta-D-galactose catabolic process via UDP-galactose, Leloir pathway
  - id: GO:0052574
    label: UDP-galactose biosynthetic process
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: file:ECOLI/galE/galE-uniprot.txt
    supporting_text: >-
      Catalyzes the conversion of UDP-galactose (UDP-Gal) to UDP-glucose (UDP-Glc)
      through a mechanism involving the transient reduction of NAD.
  - reference_id: PMID:13914787
    supporting_text: >-
      The functions pertaining to the three genetically defined cistrons were found to
      relate, respectively, to the expression of galactokinase, galactose 1-phosphate
      uridyl transferase, and uridine diphosphate galactose 4-epimerase.
  - reference_id: PMID:23339688
    supporting_text: >-
      All healthy cells produce UDP-gal from uridine(5')diphospho(1)α-D-glucose
      (UDP-glc) by the action of UDP-galactose 4-epimerase (GalE).
  - reference_id: PMID:18304323
    supporting_text: >-
