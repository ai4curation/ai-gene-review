id: P09147
gene_symbol: galE
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  galE encodes UDP-glucose 4-epimerase (UDP-galactose 4-epimerase, EC 5.1.3.2), the
  first gene of the galETKM operon of Escherichia coli K-12. The enzyme is a soluble
  cytosolic homodimer of the NAD(P)-dependent epimerase/dehydratase (extended SDR)
  family. Each subunit carries a tightly bound NAD+ in an N-terminal Rossmann domain
  and binds the UDP-sugar in a C-terminal domain. It reversibly interconverts
  UDP-alpha-D-glucose and UDP-alpha-D-galactose: NAD+ transiently oxidizes the sugar
  C4 hydroxyl to a UDP-4-ketopyranose intermediate, the keto sugar rotates, and the
  hydride returns to the opposite face. Tyr149 acts as the catalytic base, while
  Ser124 and Lys153 tune substrate and cofactor reactivity. The wild-type enzyme acts
  only on UDP-glucose and UDP-galactose. GalE performs the last step of the Leloir
  pathway of galactose utilization, regenerating UDP-glucose from the UDP-galactose
  made by GalT; galE mutants cannot use galactose and are galactose-sensitive. In
  cells growing without galactose, GalE is the route by which UDP-galactose is made
  from UDP-glucose, supplying galactosyl donors for cell-surface glycans such as
  lipopolysaccharide and the colanic acid exopolysaccharide.
