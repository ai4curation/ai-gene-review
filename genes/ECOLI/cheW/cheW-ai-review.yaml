core_functions:
- description: Molecular adaptor that physically bridges chemoreceptor cytoplasmic tips and the CheA
    histidine kinase, assembling the receptor-CheW-CheA core signaling unit and placing CheA
    autophosphorylation under receptor control. Binding to receptor and to CheA are each essential
    for active ternary complexes and for chemotaxis.
