suggested_questions:
- question: >-
    Does UbiC hand 4-hydroxybenzoate directly to membrane-bound UbiA, as
    suggested by its tight product retention, and do the two proteins
    associate in vivo?
suggested_experiments:
- hypothesis: UbiC product retention channels 4-hydroxybenzoate to UbiA.
  description: >-
    Test for UbiC-UbiA proximity in vivo (crosslinking or split-reporter
    assays) and compare 4-hydroxybenzoate leakage to the medium in wild type
    and in UbiC variants with weakened product binding.
