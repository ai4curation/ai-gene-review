  review:
    summary: Pyruvate is a by-product of the chorismate lyase reaction, not the purpose of UbiC.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The reaction does release pyruvate, so the term is not strictly false,
      but UbiC is not part of any pathway whose role is to supply pyruvate;
      its biological role is formation of the 4-hydroxybenzoate head group of
      ubiquinone. The UniRule mapping turns a reaction coproduct into a
      process annotation. Treated the same way as the P. putida UbiC review.
    supported_by:
