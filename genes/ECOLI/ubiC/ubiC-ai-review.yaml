id: P26602
gene_symbol: ubiC
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  UbiC is the cytosolic chorismate pyruvate-lyase (chorismate lyase, EC
  4.1.3.40) of Escherichia coli, a 165-residue monomeric enzyme that removes the
  enolpyruvyl side chain of chorismate with concomitant aromatisation of the
  ring, yielding 4-hydroxybenzoate and pyruvate. This is the first committed
  step of ubiquinone biosynthesis, supplying the aromatic head group that the
  membrane prenyltransferase UbiA then polyprenylates; the ubiC and ubiA genes
  form the ubiCA operon. The enzyme needs no metal cofactor, has a micromolar Km
  for chorismate and is strongly inhibited by its product 4-hydroxybenzoate,
  which remains tightly bound and may be handed on to UbiA. Isotope feeding and
  mutant studies show that UbiC is the sole enzymic source of 4-hydroxybenzoate
  in E. coli; ubiC mutants make little ubiquinone unless 4-hydroxybenzoate is
  supplied.
