  review:
    summary: >-
      MurE requires Mg2+ for ATP-dependent ligation; the carbamylated active-site lysine is thought to
      coordinate the Mg2+ that positions the ATP gamma-phosphate.
    action: KEEP_AS_NON_CORE
    reason: >-
      Metal binding is a genuine cofactor property of the Mur-ligase active site (UniProt PTM note, from
      the crystal structure) but is ancillary to the substrate-specific ligase activity that defines MurE.
    supported_by:
