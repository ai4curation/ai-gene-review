id: P22188
gene_symbol: murE
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  MurE is the ATP-dependent UDP-N-acetylmuramoyl-L-alanyl-D-glutamate:meso-2,6-diaminopimelate ligase
  of Escherichia coli (EC 6.3.2.13). It adds meso-diaminopimelate to the D-glutamate of UDP-MurNAc-L-Ala-D-Glu,
  forming UDP-MurNAc-tripeptide, the third step of the cytoplasmic Mur ligase series that builds the peptidoglycan
  stem peptide. The soluble, cytosolic enzyme has three domains, a carbamylated active-site lysine that
  positions Mg2+-ATP, and a C-terminal recognition motif that selects meso-diaminopimelate over L-lysine;
  it accepts some meso-DAP analogues (lanthionine, cystathionine) but not L-lysine. MurE is essential:
  thermosensitive mutants accumulate UDP-MurNAc-dipeptide, fail to make murein and lyse.
