suggested_questions:
- question: >-
    Is the weak L-lysine-adding activity of E. coli MurE ever physiologically relevant, e.g. under DAP
    limitation, or is lysine strictly excluded from the stem peptide in vivo?
- question: >-
    Do the high-throughput MurE interactions with CarA and YdaY reflect any functional coupling of precursor
    synthesis with other metabolism, or are they screening artefacts?
suggested_experiments:
- description: >-
    Measure kcat/Km of purified E. coli MurE for L-lysine versus meso-DAP and test in vivo incorporation
    of lysine into UDP-MurNAc-tripeptide in a dapA background.
  experiment_type: enzyme kinetics and precursor metabolomics
