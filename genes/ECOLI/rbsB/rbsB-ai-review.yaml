  label: Escherichia coli K-12
description: 'RbsB is the periplasmic D-ribose-binding protein of Escherichia coli. The two-domain receptor
  binds beta-D-ribopyranose with sub-micromolar affinity in a cleft between its domains and serves two
  roles: it delivers ribose to the RbsC2/RbsA inner-membrane ABC complex for high-affinity uptake, and,
  in its liganded form, it docks on the chemoreceptor Trg to initiate chemotaxis toward ribose. Surface
  mutagenesis separates the RbsB faces used for transport and for Trg signalling.'
