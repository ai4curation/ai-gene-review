  review:
    summary: Glycerate 3-kinase is the wrong product; GarK forms 2-phosphoglycerate.
    action: MODIFY
    reason: >-
      GO:0008887 is defined by formation of 3-phospho-D-glycerate. An in vivo selection showed that GarK
      produces 2-phosphoglycerate and that E. coli appears to lack glycerate 3-kinase. The essence, ATP-dependent
      glycerate phosphorylation, is right, so this is a lateral correction to glycerate 2-kinase activity
      (GO:0043798). The InterPro2GO mapping of the glycerate-kinase signature IPR004381 to the 3-kinase
      term is wrong for this GarK/GlxK clade.
    proposed_replacement_terms:
