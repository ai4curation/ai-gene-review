- term:
    id: GO:0046392
    label: D-galactarate catabolic process
  evidence_type: IEP
  original_reference_id: PMID:4887503
  qualifier: acts_upstream_of_or_within
  review:
    summary: GarK phosphorylates the glycerate formed from galactarate.
    action: ACCEPT
    reason: >-
      The 1969 abstract reports induction of GK I by glucarate rather than galactarate. Galactarate and
      glucarate share the same downstream GarL, GarR and GarK steps, and GarK is encoded in the garPLRK
      operon, so GarK performs the final step of galactarate catabolism. The curators read the full text;
      the process assignment is accepted.
    supported_by:
    - reference_id: PMID:9772162
      supporting_text: >-
        The genes encoding the enzymes in the (D)-glucarate/galactarate catabolic pathway have been identified
        in the Escherichia coli genome.
    - reference_id: PMID:10762278
      supporting_text: >-
        Genes for D-galactarate (gar) and D-glucarate (gud) metabolism in Escherichia coli are organized
        in three transcriptional units: garD, garPLRK, and gudPD.
