  label: Escherichia coli K-12
description: >-
  GarK is glycerate 2-kinase (glycerate kinase 1, EC 2.7.1.165) of the E. coli galactarate/glucarate (garPLRK)
  operon. It phosphorylates D-glycerate with ATP to (2R)-2-phosphoglycerate, which feeds directly into
  lower glycolysis; this is the final step of the enterobacterial aldarate catabolic route. Early in vitro
  work assigned 3-phosphoglycerate as the product, but an in vivo selection in a phosphoglycerate-mutase-null
  strain showed that both E. coli glycerate kinases, GarK and GlxK, form 2-phosphoglycerate. Deletion
  of garK, but not glxK, severely retards growth on glycerate, glyoxylate or glycolate.
