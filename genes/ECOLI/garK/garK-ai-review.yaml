  review:
    summary: >-
      GK I is induced in glucarate-grown cells; GarK phosphorylates the glycerate formed from glucarate.
    action: ACCEPT
    reason: >-
      The IEP row rests on induction of glycerate kinase I in glucarate-grown cells. Taken alone, induction
      is weak evidence, but the participation is independently established: GarK is encoded in garPLRK
      and catalyses the last step of the glucarate/galactarate pathway, so the enzyme performs a step
      of the process. The source's broad qualifier is retained.
    supported_by:
