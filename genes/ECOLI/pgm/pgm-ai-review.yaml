      pgm null mutants, defective in the first step of UDP-glucose synthesis, are about 25%
      smaller in rich medium; UDP-glucose signals through OpgH to inhibit FtsZ assembly.
    supporting_text: the average cross-sectional area of wild-type E. coli was 5.66 µm2 while pgm mutants were 4.24 µm2, a difference of over 25%.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text cached; Pgm is used as the entry point to UDP-glucose synthesis.
- id: PMID:31589605
  title: Bacillus subtilis PgcA moonlights as a phosphoglucosamine mutase in support of
    peptidoglycan synthesis.
  findings:
  - statement: >-
      Overexpressed E. coli Pgm suppresses a B. subtilis glmR mutant and complements a B.
      subtilis pgcA deletion, suggesting secondary phosphoglucosamine mutase activity.
    supporting_text: These results suggest that E. coli Pgm is also a bifunctional PGM/PNGM when expressed in B. subtilis.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Heterologous genetic evidence only for the E. coli enzyme; not used for a GO annotation.
