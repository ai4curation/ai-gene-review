core_functions:
- description: >-
    Mg2+-dependent phosphoglucomutase that reversibly interconverts glucose 6-phosphate and
    alpha-D-glucose 1-phosphate in the cytosol. In the anabolic direction it supplies
    glucose 1-phosphate to GalU for UDP-glucose (and hence UDP-galactose) synthesis, which
    feeds LPS core, periplasmic glucan and other glucosylation reactions and acts as the
    nutrient signal for OpgH-dependent cell-size control. In the catabolic direction it
    converts glucose 1-phosphate generated by the Leloir pathway (and by
    maltodextrin/glycogen phosphorolysis) into glucose 6-phosphate for glycolysis, and is
    required for normal growth on galactose.
