  evidence_type: IMP
  original_reference_id: PMID:4942754
  qualifier: involved_in
  review:
    summary: >-
      Pgm catalyses the first step of UDP-glucose biosynthesis from glycolytic carbon
      (glucose 6-phosphate to alpha-D-glucose 1-phosphate), which GalU then uridylylates.
      pgm mutants are deficient in UDP-glucose/UDP-galactose synthesis (phage C21
      sensitivity), and pgm and galU knockouts share the UDP-glucose-dependent cell-size
      phenotype.
