suggested_questions:
- question: >-
    Does E. coli Pgm have physiologically relevant phosphoglucosamine mutase activity in
    its native host? Overexpressed E. coli Pgm suppresses a B. subtilis glmR mutant in a
    Ser45-dependent manner, but the activity of the purified E. coli enzyme on glucosamine
    1-phosphate has not been reported.
- question: >-
    Which enzyme accounts for the residual glucose 1-phosphate catabolism in pgm mutants,
    which Adhya and Schwartz found to be strongly depressed but not abolished?
suggested_experiments:
- description: >-
    Measure kcat/Km of purified E. coli Pgm and the S45G variant on glucose 1-phosphate
    and glucosamine 1-phosphate, and test whether pgm deletion sensitizes E. coli glmM
    hypomorphs to cell-wall antibiotics.
  experiment_type: enzyme kinetics and genetic interaction analysis
- description: >-
    Quantify intracellular UDP-glucose, UDP-galactose and glucose 1-phosphate pools in
    wild-type and pgm deletion strains across carbon sources (glucose, galactose, maltose,
    succinate) by LC-MS.
  experiment_type: targeted metabolomics
