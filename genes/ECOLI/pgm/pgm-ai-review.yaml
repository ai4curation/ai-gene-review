id: P36938
gene_symbol: pgm
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  Pgm is the cytosolic alpha-D-phosphohexomutase (phosphoglucomutase, EC 5.4.2.2) of
  Escherichia coli. It catalyses the Mg2+-dependent, reversible interconversion of
  alpha-D-glucose 1-phosphate and glucose 6-phosphate through a phosphoserine enzyme
  intermediate (Ser146), using glucose 1,6-bisphosphate as the activating cofactor in
  the classic ping-pong mechanism of the PGM1-type enzymes. The purified enzyme binds
  one Mg2+ per subunit, has a Km of about 50 uM for glucose 1-phosphate and an alkaline
  pH optimum. Pgm sits at the branch point between glycolysis and nucleotide-sugar
  metabolism. In the anabolic direction it supplies glucose 1-phosphate for
  GalU-dependent UDP-glucose synthesis, and therefore for UDP-galactose,
  lipopolysaccharide core glycosylation, osmoregulated periplasmic glucans and other
  glucosylated envelope components. In the catabolic direction it routes glucose
  1-phosphate from the Leloir pathway (galactose) and from maltodextrin and glycogen
  phosphorolysis into glycolysis. pgm mutants lack most cellular phosphoglucomutase
  activity, grow poorly on galactose, accumulate amylose on maltose, are sensitive to
  phage C21 because of defective UDP-glucose/UDP-galactose synthesis, and are about 25%
  smaller in rich medium, because UDP-glucose acts as a nutrient signal through the
  glucosyltransferase OpgH to delay FtsZ ring assembly. When overexpressed, E. coli Pgm
  also shows secondary phosphoglucosamine mutase activity.
