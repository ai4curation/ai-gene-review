    reason: >-
      Participation test: Pgm itself catalyses a step of the pathway, producing the glucose
      1-phosphate substrate of GalU, so it does part of the work of the process rather than
      merely being required for it. Comparator check: dedicated phosphoglucomutases carry
      UDP-glucose metabolism process terms (S. cerevisiae PGM2 has GO:0006011 by IGI). No
      existing row covers this process.
    additional_reference_ids:
    - PMID:23935518
    supported_by:
    - reference_id: PMID:4942754
      supporting_text: amino acid- or glucose-grown pgm mutants are sensitive to phage C21, indicating a deficiency in the biosynthesis of uridine diphosphoglucose or uridine diphosphogalactose, or both.
