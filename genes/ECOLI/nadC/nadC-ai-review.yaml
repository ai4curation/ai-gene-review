gene_symbol: nadC
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  NadC is the quinolinate phosphoribosyltransferase (decarboxylating) of Escherichia coli K-12. It transfers
  the 5-phosphoribosyl group of 5-phospho-alpha-D-ribose 1-diphosphate (PRPP) to quinolinate with decarboxylation,
  producing nicotinate D-ribonucleotide (NaMN), CO2 and diphosphate. This is the third reaction of de
  novo NAD+ synthesis from L-aspartate and the point at which de novo synthesis joins the Preiss-Handler
  completion steps catalyzed by NadD and NadE. NadC is a soluble cytosolic enzyme with an ordered kinetic
  mechanism in which Mg-PRPP binds before quinolinate.
