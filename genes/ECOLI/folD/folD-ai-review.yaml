id: P24186
gene_symbol: folD
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  folD (b0529) encodes the bifunctional 5,10-methylenetetrahydrofolate
  dehydrogenase / 5,10-methenyltetrahydrofolate cyclohydrolase of Escherichia
  coli, a soluble cytosolic homodimer of 288-residue subunits. The enzyme
  oxidizes 5,10-methylene-tetrahydrofolate to 5,10-methenyl-tetrahydrofolate
  using NADP+ (it is specific for NADP rather than NAD) and then hydrolyses
  5,10-methenyl-tetrahydrofolate to 10-formyl-tetrahydrofolate. Because E. coli
  has no formyltetrahydrofolate synthetase, FolD is the route by which
  one-carbon units entering the folate pool at the methylene oxidation level
  (from serine hydroxymethyltransferase and the glycine cleavage system) are
  oxidized to the formyl level used for purine nucleotide synthesis and for
  formylation of initiator Met-tRNA. Structure-guided mutagenesis shows the two
  activities share an overlapping active site in the N-terminal domain while
  the C-terminal Rossmann domain binds NADP.
