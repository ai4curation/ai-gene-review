suggested_questions:
- question: >-
    How is flux through the FolD dehydrogenase coupled to the cyclohydrolase in
    vivo, i.e. is 5,10-methenyl-THF channelled between the overlapping sites or
    released to solution where it equilibrates non-enzymatically?
suggested_experiments:
- description: >-
    Express the activity-separating K54S (cyclohydrolase-dead) and R191E
    (dehydrogenase-impaired) alleles from the native locus and measure
    10-formyl-THF, purine and fMet-tRNA levels to test whether spontaneous
    methenyl-THF hydrolysis can substitute for the enzymatic cyclohydrolase in
    vivo.
  experiment_type: genetic complementation and folate metabolite profiling
