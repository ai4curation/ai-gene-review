suggested_questions:
- question: >-
    Is the SelA-tRNA(Sec)-SelD ternary complex required in vivo to channel selenophosphate to SelA, and
    is it the predominant form of SelA in cells?
suggested_experiments:
- hypothesis: Selenophosphate is channelled from SelD to SelA within the ternary complex.
  description: >-
    Test whether SelD N-terminal glycine-rich loop mutants that block ternary complex formation reduce
    Sec-tRNA(Sec) formation in vitro at limiting selenide while leaving SelD selenophosphate synthesis
    intact.
