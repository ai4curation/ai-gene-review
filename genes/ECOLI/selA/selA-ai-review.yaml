id: P0A821
gene_symbol: selA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  SelA is the selenocysteine synthase (L-seryl-tRNA(Sec) selenium transferase; EC 2.9.1.1) of Escherichia
  coli. This cytosolic pyridoxal 5'-phosphate enzyme, with PLP bound as a Schiff base to Lys295, converts
  seryl-tRNA(Sec) to selenocysteinyl-tRNA(Sec) while the aminoacyl-tRNA stays bound: serine is dehydrated
  to an enzyme-bound aminoacrylyl-tRNA(Sec) intermediate, and selenium from selenophosphate (made by SelD)
  is then added. SelA does not act on serine-inserting tRNAs, and the phosphate of selenophosphate gives
  it selectivity against sulfur. The enzyme is a homodecamer of two five-membered rings (a pentamer of
  dimers) binding one tRNA(Sec) per dimer, and it can associate with SelD on the tRNA to form a ternary
  complex. selA mutants retain tRNA selenation but cannot make selenoproteins such as the formate dehydrogenases.
