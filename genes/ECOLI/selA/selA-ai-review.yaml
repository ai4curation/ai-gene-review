- term:
    id: GO:0042802
    label: identical protein binding
  evidence_type: IDA
  original_reference_id: PMID:2007584
  qualifier: enables
  review:
    summary: Native SelA is a ~600 kDa homo-oligomer of 50-kDa subunits.
    action: KEEP_AS_NON_CORE
    reason: >-
      Self-association is real: gel filtration gives a native Mr of about 600,000 and electron microscopy
      shows a decamer of 10 subunits in two rings, a pentamer of dimers with one tRNA per dimer. This
      is the quaternary structure that forms the active sites, not the catalytic function itself, and
      no more specific MF term for homodecamer formation exists, so the term is kept as non-core.
    supported_by:
    - reference_id: PMID:2007584
      supporting_text: >-
        Purified native SELA protein migrates in gel filtration experiments with a native Mr of about
        600,000
    - &id007
      reference_id: PMID:1474891
      supporting_text: >-
        The enzyme has a fivefold symmetric structure and consists of 10 monomers arranged in two rings
