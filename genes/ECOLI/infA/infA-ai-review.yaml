suggested_questions:
- question: >-
    Why is IF1 essential in E. coli when its best-characterized activities (A-site
    occlusion, stabilization of IF2/IF3 binding) are kinetic enhancements rather than
    absolute requirements in vitro?
- question: >-
    Does IF1 contribute to selective translation of particular mRNA classes under
    cold shock, given that IF1 levels rise relative to ribosomes after temperature
    downshift?
suggested_experiments:
- description: >-
    Use a conditional infA depletion strain with ribosome profiling of initiating
    ribosomes to define start sites and mRNA classes that depend most on IF1, and
    complement with A-site contact mutants (e.g. residues mapped by NMR 30S titration).
  experiment_type: ribosome profiling and genetic complementation
