- term:
    id: GO:0140517
    label: protein-RNA adaptor activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN002120760
  - UniProtKB:P69222
  review:
    summary: >-
      PAINT IBD at the IF-1 family root node PTN002120760, seeded only by E. coli IF1.
      IF1 contacts both 16S rRNA and IF2, but it is not an adaptor that brings IF2
      to the ribosome.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      GO:0140517 describes a protein whose binding brings another protein and an RNA
      together. IF1 does contact the IF2 N-terminal domain and 16S rRNA, and it
      stabilizes IF2 and IF3 on the 30S subunit, but IF2 and IF3 bind the 30S
      subunit first and independently, and IF1 then joins and stabilizes an existing
      complex. That is cooperative stabilization within the initiation complex, which
      is already captured by translation initiation factor activity, not an adaptor
      bridging function. No current E. coli experimental row to GO:0140517 remains in
      GOA to explain the seed. The node placement itself is not disputed (IF1 is a
      family-wide function); the term is the over-reach.
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - ROLE_CONFLATION
      source_entities:
      - source_id: PANTHER:PTN002120760
        source_status: SOURCE_STALE_OR_MISSING
        comment: IBD seeded only by UniProtKB:P69222, which has no current experimental
          GO:0140517 row in GOA; IF1 stabilizes IF2/IF3 on the 30S subunit but does not
          bridge IF2 to rRNA, since IF2 binds the 30S before IF1 arrives.
    supported_by:
    - reference_id: PMID:22562136
      supporting_text: >-
        IF3 and IF2 are the first factors to arrive, forming an unstable
        30S-IF2-IF3 complex. Subsequently, IF1 joins and locks the factors in a
        kinetically stable 30S PIC
    - reference_id: PMID:21750663
      supporting_text: >-
        The model suggests that the contacts to IF1 and ribosomal protein S12 are
        made by the NTD of IF2
