id: P69222
gene_symbol: infA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  Translation initiation factor IF1 is a small (72-residue) essential protein
  built from a single OB-fold (S1-like) domain, the bacterial homolog of
  archaeal aIF1A and eukaryotic eIF1A. In the cytosol it binds the 30S
  ribosomal subunit at the aminoacyl (A) site, in a cleft formed by the 530
  loop, helix 44 of 16S rRNA and ribosomal protein S12, where it occludes the
  A site and flips out the decoding-centre bases A1492 and A1493. IF1 joins
  the 30S subunit after IF2 and IF3, locks them into a kinetically stable 30S
  pre-initiation complex to which initiator fMet-tRNA(fMet) is recruited,
  and acts with IF2 in recognition of the initiator tRNA formyl group. IF1 is
  released, together with IF2 and IF3, when the 50S subunit joins to form the
  70S initiation complex.
