  label: Escherichia coli K-12
description: LpdA is the FAD-dependent dihydrolipoyl dehydrogenase shared by the E. coli pyruvate dehydrogenase and 2-oxoglutarate dehydrogenase multienzyme complexes and by the glycine cleavage system. In each system it reoxidizes reduced lipoyllysine carrier arms and transfers electrons to NAD+, regenerating the oxidized lipoyl cofactor needed for another catalytic cycle.
