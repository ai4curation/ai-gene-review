  review:
    summary: Zinc binding was detected by a gel-based radioactive Zn(II) screen; no zinc site or zinc role
      is known for LpdA.
    action: MARK_AS_OVER_ANNOTATED
    reason: PMID:11985624 (abstract only in the cache) screened total E. coli proteins on two-dimensional
      gels for radioactive Zn(II) binding; the abstract does not name LpdA among the assigned spots, so the
      curated LpdA call rests on full-text data that cannot be checked here. The assay detects Zn(II) retention
      by denatured, blotted proteins and is prone to non-physiological binding; the E3 fold has no zinc site,
      and the dihydrolipoyl dehydrogenase mechanism uses FAD and a redox-active disulfide, not zinc. The binding
      may be real in vitro but is not evidence of a physiological zinc-binding function.
    supported_by:
