- term:
    id: GO:0006099
    label: tricarboxylic acid cycle
  evidence_type: IDA
  original_reference_id: PMID:17367808
  qualifier: involved_in
  review:
    summary: LpdA participates directly in the TCA-cycle 2-oxoglutarate dehydrogenase reaction as the shared E3 subunit.
    action: ACCEPT
    reason: The OGDH complex contains SucA, SucB and LpdA/E3; LpdA regenerates the oxidized SucB lipoyl group required for conversion of 2-oxoglutarate to succinyl-CoA.
    supported_by:
    - reference_id: PMID:17367808
      supporting_text: 'The OGDH complex is comprised of multiple copies of three
        types of component enzymes: a 2-oxoglutarate decarboxylase dependent
        on thiamine diphosphate (E1o, EC 1.2.4.2), a lipoylated succinyl transferase
        (E2o, EC 2.3.1.6), and a dihydrolipoyl dehydrogenase (E3, EC 1.8.1.4).'
