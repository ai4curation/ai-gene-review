  review:
    summary: Wrong-branch process propagated from the deep citrate synthase node; PrpC metabolizes an organic acid (propionate), not a carbohydrate.
    action: REMOVE
    reason: >-
      The IBA derives from PTN000201223, the ancestral citrate synthase node
      (sole donor human CS, O75390). PrpC is in a distinct 2-methylcitrate
      synthase subclade (PTN002621568) whose experimentally established role is
      propionate degradation via the methylcitrate cycle. Neither propionate
      oxidation nor the minor citrate synthase activity of PrpC is a carbohydrate
      metabolic process; the appropriate process (GO:0019543 propionate
      catabolic process) is already annotated and accepted below. This mirrors
      the decision for the P. putida ortholog (genes/PSEPK/prpC).
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      source_entities:
