id: P31660
gene_symbol: prpC
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  PrpC is the 2-methylcitrate synthase of the propionate-inducible prpBCDE
  operon of Escherichia coli K-12. This soluble, homodimeric member of the
  citrate synthase family catalyzes the Claisen condensation of propionyl-CoA
  with oxaloacetate to form 2-methylcitrate and CoA, the first committed step of
  the 2-methylcitrate cycle that oxidizes propionate to pyruvate (with
  succinate regenerated to oxaloacetate). PrpC also condenses acetyl-CoA with
  oxaloacetate to give citrate, but with lower activity and higher Km than with
  propionyl-CoA; it was first isolated as a dimeric "citrate synthase II" from a
  gltA revertant and is distinct from the hexameric, allosterically regulated
  housekeeping TCA-cycle citrate synthase GltA. Expression is induced by
  propionate (via PrpR) and subject to CRP-dependent catabolite repression.
