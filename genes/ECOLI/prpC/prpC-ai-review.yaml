suggested_questions:
- question: >-
    Does the minor citrate synthase activity of PrpC contribute measurably to
    citrate formation in wild-type E. coli growing on propionate, or only when
    GltA is inactive (as in the K114r4 revertant)?
- question: >-
    What is the true stereochemistry of the 2-methylcitrate produced by PrpC,
    given conflicting (2S,3S) versus (2S,3R)/(2R,3S) assignments?
suggested_experiments:
- description: >-
    Measure citrate and 2-methylcitrate formation by purified PrpC with mixed
    acetyl-CoA and propionyl-CoA pools at physiological concentrations, and
    compare growth of gltA, prpC and gltA prpC mutants on acetate versus
    propionate.
