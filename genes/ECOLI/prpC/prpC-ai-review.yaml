  review:
    summary: Over-annotation from the citrate synthase family; GltA is the TCA-cycle citrate synthase of E. coli, while PrpC is propionate-induced and acts in the methylcitrate cycle.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      PrpC does catalyze the citrate synthase reaction at a low rate and a
      dimeric PrpC-derived citrate synthase could support a gltA-deficient
      revertant (PMID:8508809), so participation in the TCA cycle is not
      impossible. However, PrpC is only induced during growth on propionate,
      whereas the hexameric GltA is constitutive and is the physiological TCA
      citrate synthase (PMID:9579066). The methylcitrate cycle is chemically
      analogous to, but distinct from, the TCA cycle. The TCA-cycle annotation
      therefore overstates PrpC's physiological role.
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: PANTHER:PTN000201223
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          Ancestral citrate synthase node; TCA participation is true of GltA and
          eukaryotic CS donors, but PrpC diverged to a propionate-induced
          methylcitrate-cycle role and retains citrate synthase activity only as
          a minor activity.
    supported_by:
    - reference_id: PMID:9579066
      supporting_text: Whereas the hexameric citrate synthase is constitutively produced, the 2-methylcitrate synthase is induced during growth on propionate
    - reference_id: PMID:8508809
      supporting_text: The dimeric citrate synthase from K114r4 has been purified and shown to be immunologically distinct from the wild-type hexameric enzyme.
