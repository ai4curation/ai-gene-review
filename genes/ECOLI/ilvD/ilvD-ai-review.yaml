knowledge_gaps:
- gap_statement: The type of Fe-S cluster in E. coli dihydroxy-acid dehydratase is
    unresolved. Spectroscopy of the purified E. coli enzyme assigned [4Fe-4S], while
    orthologue structures and the family rule assign a labile [2Fe-2S] cluster.
  boundary: 'Established: a catalytically essential, oxygen-labile Fe-S cluster.
    Unknown: whether the native E. coli cluster is [2Fe-2S] or [4Fe-4S], or whether
    the earlier assignment reflects cluster conversion during purification.'
  gap_kind:
  - BIOLOGY
  status: OPEN
suggested_questions:
- question: Is the native cluster of E. coli IlvD [2Fe-2S], as the IlvD family rule
    and UniProt caution now state, or [4Fe-4S], as the E. coli spectroscopy reported,
    and should the GO 2Fe-2S and 4Fe-4S rows for P05791 be reconciled?
suggested_experiments:
- hypothesis: E. coli IlvD carries a [2Fe-2S] cluster in vivo, like the M. tuberculosis
    and plant enzymes.
  description: Determine the cluster type of anaerobically purified and in-cell E.
    coli IlvD by Mossbauer and EPR spectroscopy of 57Fe-labelled protein, together
    with a holoenzyme crystal structure.
  experiment_type: spectroscopy and structural biology
