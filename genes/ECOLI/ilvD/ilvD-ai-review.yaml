- term:
    id: GO:0051536
    label: iron-sulfur cluster binding
  evidence_type: IDA
  original_reference_id: PMID:8325851
  qualifier: enables
  review:
    summary: Purified E. coli DHAD contains a catalytic Fe-S cluster whose oxidative
      loss inactivates the enzyme.
    action: ACCEPT
    reason: The presence of a catalytically essential Fe-S cluster is undisputed. Because
      the cluster type ([4Fe-4S] in the E. coli spectroscopy, [2Fe-2S] in the family
      rule and orthologues) is contested, this cluster-type-neutral term is the precise
      level the evidence supports and is accepted as a core cofactor property.
    supported_by:
    - reference_id: PMID:8325851
      supporting_text: Dihydroxy-acid dehydratase from E. coli is inactivated by O2
        in vitro and in vivo as a result of oxidative degradation of the [4Fe-4S]cluster.
- term:
    id: GO:0051537
    label: 2 iron, 2 sulfur cluster binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: enables
  supporting_entities:
  - UniRule:UR000001403
  review:
    summary: '[2Fe-2S] assignment by the HAMAP IlvD rule; conflicts with the E. coli
      spectroscopic data.'
    action: KEEP_AS_NON_CORE
    reason: UniProt's curated caution reports that the [4Fe-4S] assignment for E. coli
      DHAD was superseded by a [2Fe-2S] cluster found in the M. tuberculosis enzyme,
      and the HAMAP rule propagates [2Fe-2S] to the whole IlvD family. The only
      E. coli-specific data (UV-visible, EPR, MCD and resonance Raman of the purified
      enzyme) assigned a [4Fe-4S] cluster and contrasted it explicitly with the
      [2Fe-2S] spinach enzyme. Both cluster-type rows are therefore kept as non-core,
      and the core cofactor is stated as the cluster-type-neutral iron-sulfur cluster
      binding that is directly supported. This matches the action taken on the same
      UniRule row for KT2440 IlvD; the cluster-type conflict is recorded as a
      knowledge gap rather than settled here.
    supported_by:
    - reference_id: file:ECOLI/ilvD/ilvD-uniprot.txt
      record_section: ["CC:CAUTION"]
      supporting_text: However, a more recent study in M.tuberculosis has shown that
        this enzyme contains a [2Fe-2S] cluster, which is unstable and subject to degradation.
    - reference_id: PMID:8325851
      supporting_text: indicates that the native enzyme contains a [4Fe-4S]2+,+ cluster,
        in contrast to spinach dihydroxy-acid dehydratase which contains a [2Fe-2S]2+,+
        cluster
