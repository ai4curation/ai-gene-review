id: P05791
gene_symbol: ilvD
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  IlvD is the dihydroxy-acid dehydratase of Escherichia coli, a cytoplasmic
  homodimeric iron-sulfur enzyme of the IlvD/Edd family encoded in the ilvGMEDA
  operon. It catalyses the third step of the shared valine/isoleucine
  biosynthetic trunk, dehydrating (2R)-2,3-dihydroxy-3-methylbutanoate to
  3-methyl-2-oxobutanoate (2-oxoisovalerate, the precursor of valine, leucine
  and pantothenate) and (2R,3R)-2,3-dihydroxy-3-methylpentanoate to
  (S)-3-methyl-2-oxopentanoate (the precursor of isoleucine). Catalysis uses an
  Fe-S cluster as a Lewis acid together with a Mg2+ ion. Spectroscopy of the
  purified E. coli enzyme assigned a [4Fe-4S] cluster, whereas the family rule
  and orthologue studies assign a labile [2Fe-2S] cluster. The cluster is
  destroyed by oxygen and superoxide, so DHAD activity falls under oxidative
  stress and is maintained by superoxide dismutases.
