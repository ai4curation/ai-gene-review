id: P33607
gene_symbol: nuoL
product_type: PROTEIN
status: INITIALIZED
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  NuoL is the largest membrane subunit (613 residues, 16 transmembrane helices) of the
  proton-pumping NADH:quinone oxidoreductase (NDH-1, respiratory complex I) in the
  bacterial cytoplasmic (inner) membrane, and is the homologue of mitochondrial ND5. It is
  the most distal of three homologous antiporter-like subunits (NuoL, NuoM, NuoN) that
  share a fold with Mrp-type Na+/H+ antiporter subunits. Each has two inverted
  five-helix repeats forming half-channels joined by conserved charged residues (Glu-144,
  Lys-229 and His-334/Lys-399 positions in the TM5/TM7/TM8/TM12 sites) along a central
  hydrophilic axis of the membrane arm. A long amphipathic helix (HL), from its C-terminal
  extension, runs along the membrane arm towards NuoN. Cryo-EM of E. coli complex I in
  turnover indicates that pumped protons leave the complex to the periplasm through
  NuoL, and deletion of NuoL or of its C-terminal helix halves the proton-pumping
  stoichiometry. NuoL has no redox cofactors; it contributes the proton-translocation
  part of the proton-pumping NADH:ubiquinone oxidoreductase activity of the assembled
  complex, conserving redox energy as proton-motive force during respiration.
