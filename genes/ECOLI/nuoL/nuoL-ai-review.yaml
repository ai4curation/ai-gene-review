core_functions:
- description: >-
    Distal antiporter-like proton-pumping subunit of the NDH-1 membrane arm. Its two
    inverted half-channels and the conserved charged central-axis residues form a proton
    pathway, and the periplasmic exit of pumped protons runs through NuoL. Its C-terminal
    amphipathic helix HL runs along the membrane arm and is needed for full coupling. NuoL
    thereby contributes the proton-translocation part of the proton-pumping
    NADH:ubiquinone oxidoreductase activity of the assembled complex.
  contributes_to_molecular_function:
    id: GO:0008137
    label: NADH dehydrogenase (ubiquinone) activity
  directly_involved_in:
  - id: GO:0015990
    label: electron transport coupled proton transport
  - id: GO:0022904
    label: respiratory electron transport chain
  in_complex:
    id: GO:0045271
    label: respiratory chain complex I
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:21417432
    supporting_text: Our data suggest that the H+/2e- stoichiometry of the ΔNuoL variant
      is 2
  - reference_id: PMID:36104567
    supporting_text: This mechanism explains why protons exit exclusively from the NuoL
      subunit and is supported by our mutagenesis data.
  - reference_id: PMID:36920092
    supporting_text: ALS share a cation/proton antiporter MRP fold [34] of two inverted
      symmetric five TM repeats forming one half of the putative proton translocating
      channel each
suggested_questions:
- question: Do pumped protons really exit only through NuoL in E. coli complex I under
    physiological membrane potential, or can NuoM and NuoN also release protons to the
    periplasm?
- question: How does the Mrp-like antiporter fold of NuoL, inherited from cation/proton
    antiporters, constrain whether complex I can also move Na+ or K+?
suggested_experiments:
- description: >-
    Measure periplasm-side proton release in proteoliposomes with complex I carrying
    substitutions at the NuoL TM8 histidine and TM12 lysine, together with hydration
    mapping by cryo-EM in turnover, to test the NuoL-only exit model.
- description: >-
    Assay Na+ and K+ transport alongside H+ in reconstituted wild-type and ΔNuoL complex
    I to test for residual cation antiport inherited from the Mrp-type fold.
