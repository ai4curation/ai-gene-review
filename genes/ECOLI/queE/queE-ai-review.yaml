id: P64554
gene_symbol: queE
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  QueE is the cytoplasmic radical S-adenosyl-L-methionine enzyme 7-carboxy-7-deazaguanine
  (CDG) synthase. Using a single [4Fe-4S] cluster that binds and reductively cleaves SAM,
  and a catalytic Mg2+ ion, it catalyses the radical-mediated ring contraction of
  6-carboxy-5,6,7,8-tetrahydropterin (made by QueD) to CDG with release of ammonium. CDG
  is converted by QueC to 7-cyano-7-deazaguanine (preQ0), the precursor of the queuosine
  modification at the wobble position of tRNAs Asp, Asn, His and Tyr; queE deletion mutants
  lack queuosine-modified tRNA. E. coli QueE forms a head-to-tail homodimer and is reduced
  physiologically by flavodoxin. QueE also has a second, catalysis-independent role: when
  strongly induced by the PhoQ/PhoP two-component system (for example by cationic
  antimicrobial peptides or low Mg2+), it localizes to the FtsZ ring and blocks septation,
  causing filamentous growth. The two functions are separable by mutation.
