proposed_new_terms:
- proposed_name: 7-carboxy-7-deazaguanine synthase activity
  proposed_definition: >-
    Catalysis of the reaction: 6-carboxy-5,6,7,8-tetrahydropterin + H+ =
    7-carboxy-7-deazaguanine + NH4+. The reaction is a radical S-adenosyl-L-methionine-initiated
    ring contraction of the pterin to the pyrrolopyrimidine core of 7-deazapurines, and requires
    a Mg2+ ion.
  justification: >-
    This is the activity of QueE (EC 4.3.99.3, RHEA:27974), the step that creates the 7-deazapurine
    core of queuosine, archaeosine and deazapurine antibiotics. GO has no matching term: QuickGO
    searches for "7-carboxy-7-deazaguanine synthase", "carbaguanine" and "CDG synthase", and an
    OLS cross-reference search for RHEA:27974 (checked 2026-10-19), return nothing, so QueE is
    annotated only to the general GO:0016840 carbon-nitrogen lyase activity.
  proposed_parent:
    id: GO:0016840
    label: carbon-nitrogen lyase activity
  proposed_mappings:
  - predicate: skos:exactMatch
    target_term:
      id: RHEA:27974
      label: 6-carboxy-5,6,7,8-tetrahydropterin + H(+) = 7-carboxy-7-carbaguanine + NH4(+)
  supported_by:
  - reference_id: PMID:19354300
    supporting_text: The above observations are consistent with the formation of 7-carboxy-7-deazaguanine
      (CDG) as the product of QueE.
  - reference_id: file:ECOLI/queE/queE-uniprot.txt
    supporting_text: Reaction=6-carboxy-5,6,7,8-tetrahydropterin + H(+) = 7-carboxy-7-
suggested_questions:
- question: Which divisome component does QueE contact to block septation, and why does the
    division block require the E45-W67 region that is absent from Pseudomonas and Bacillus QueE?
- question: Is the moonlighting division-inhibitor role of QueE worth capturing in GO-CAM as a
    separate activity of the same gene product, distinct from its CDG synthase activity?
suggested_experiments:
- hypothesis: QueE inhibits septation by binding a late divisome protein downstream of FtsA/FtsZ.
  description: Bacterial two-hybrid and in vivo crosslinking of wild-type QueE and the division-defective
    E45-W67 deletion against late divisome proteins (FtsQ, FtsL, FtsB, FtsW, FtsI, FtsN), with the
    suppressor alleles ftsA-N170S and ftsZ-D234G as controls.
