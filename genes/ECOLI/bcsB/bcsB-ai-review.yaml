  label: Escherichia coli K-12
description: BcsB is the noncatalytic, membrane-anchored periplasmic partner of the Escherichia coli cellulose
  synthase. Its C-terminal anchor contacts BcsA, and its periplasmic domains assemble into a crown that
  helps organize passage of nascent cellulose toward the outer-membrane channel BcsC. Direct c-di-GMP
  sensing belongs to BcsA and BcsE in characterized enterobacterial complexes. The BcsB protein does not
  contain the glucosyltransferase active site.
