  label: Escherichia coli K-12
description: >-
  GlgC is the glucose-1-phosphate adenylyltransferase (ADP-glucose
  pyrophosphorylase, EC 2.7.7.27) of Escherichia coli. It catalyses the
  Mg2+-dependent synthesis of ADP-alpha-D-glucose and diphosphate from
  alpha-D-glucose 1-phosphate and ATP, producing the activated glucosyl donor
  that glycogen synthase (GlgA) uses to elongate alpha-1,4-glucan chains. GlgC
  is the committed and principal regulatory step of bacterial glycogen
  biosynthesis: it is a homotetramer whose activity is allosterically activated
  by the glycolytic intermediate fructose 1,6-bisphosphate (a signal of high
  glycolytic flux) and inhibited by AMP (a signal of low energy charge),
  coupling glycogen accumulation to cellular carbon and energy status.
