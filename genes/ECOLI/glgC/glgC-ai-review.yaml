      label: magnesium ion binding
    evidence_type: IDA
    original_reference_id: PMID:1648099
    qualifier: enables
    review:
      summary: GlgC requires Mg2+ as the catalytic divalent cation for the adenylyltransferase reaction.
      action: KEEP_AS_NON_CORE
      reason: >-
        Mg2+ is the essential divalent metal of the nucleotidyltransferase
        mechanism; kinetic analysis of the catalytic-site Lys-195 mutants
        measured Mg2+ as a defining ligand of the enzyme. Metal-ion binding
        supports catalysis but is ancillary to the core adenylyltransferase
        identity captured by GO:0008878.
      supported_by:
        - reference_id: PMID:1648099
          supporting_text: "Mg2+, and the allosteric activator, fructose 1,6-bisphosphate, are unchanged"
