  label: Escherichia coli K-12
description: 'DapA (4-hydroxy-tetrahydrodipicolinate synthase, historically called dihydrodipicolinate
  synthase) catalyses the first committed reaction of the diaminopimelate (DAP) pathway of L-lysine biosynthesis
  in Escherichia coli: the Schiff-base (Lys161) dependent condensation of pyruvate and L-aspartate 4-semialdehyde
  to (4S)-4-hydroxy-2,3,4,5-tetrahydro-(2S)-dipicolinate. The soluble cytosolic enzyme is a homotetramer
  (dimer of dimers) and is allosterically feedback-inhibited by L-lysine. Its product is reduced by DapB,
  and the pathway supplies both L-lysine and the meso-diaminopimelate used in peptidoglycan.'
