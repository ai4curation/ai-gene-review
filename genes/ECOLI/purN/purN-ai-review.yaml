id: P08179
gene_symbol: purN
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: PurN is the folate-dependent glycinamide ribonucleotide (GAR) transformylase of Escherichia
  coli, a soluble cytosolic monomer that transfers the formyl group of 10-formyltetrahydrofolate to GAR
  to give N-formylglycinamide ribonucleotide (FGAR), the third step of de novo IMP biosynthesis. E. coli
  has a second, ATP- and formate-dependent GAR transformylase (PurT); only purN purT double mutants require
  purines.
