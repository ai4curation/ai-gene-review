taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: CysC is the Escherichia coli adenylylsulfate kinase that transfers phosphate from ATP to
  APS to produce PAPS. This sulfate-activation step supplies substrate to CysH in the PAPS-dependent assimilatory
  pathway, ultimately providing reduced sulfur for cysteine biosynthesis. Purified CysC forms homooligomers.
