  review:
    summary: CysC phosphorylates APS in the E. coli PAPS-dependent assimilation route.
    action: ACCEPT
    reason: The purified E. coli APS kinase produces PAPS, the substrate of CysH. Its reaction is a direct
      step of sulfate assimilation; this interpretation is specific to this organism and does not equate
      all APS kinases with assimilatory PAPS reduction.
    supported_by:
    - reference_id: PMID:1332767
      supporting_text: APS kinase from Escherichia coli is phosphorylated upon incubation with ATP, yielding
        a protein that can complete the overall reaction through phosphorylation of APS.
