  review:
    summary: The inherited BcsQ-family claim is unresolved for the downstream-start pseudogene product.
    action: UNDECIDED
    reason: PAINT places this sequence in the BcsQ/MinD-related lineage at PTN000344128; no IRD or IKR
      was found. The concern is target-specific record integrity, not donor count. The K-12 stop/repair
      experiments establish disrupted operon expression and restored cellulose output, but do not assay
      intrinsic ATP binding of an expressed 242-residue fragment. Full-length or 1094 BcsQ results cannot
      establish this fragment claim. Neither false intrinsic activity nor a native functional localization
      is asserted; the fragment expression/function question remains open.
