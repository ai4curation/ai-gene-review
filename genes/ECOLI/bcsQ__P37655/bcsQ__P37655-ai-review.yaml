suggested_questions:
- question: Is the downstream-start 242-residue fragment produced in native K-12 cells, and does it bind
    or hydrolyze ATP or associate with synthase partners when expressed?
suggested_experiments:
- description: Use targeted proteomics to distinguish full-length and downstream-start products, then
    assay the isolated fragment and intact BcsQ side by side for nucleotide binding, hydrolysis, partner
    interactions and localization.
  experiment_type: protein-expression and biochemical characterization
