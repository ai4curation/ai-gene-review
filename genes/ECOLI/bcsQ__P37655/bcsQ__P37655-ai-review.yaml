id: P37655
gene_symbol: bcsQ__P37655
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: P37655 is a predicted 242-residue C-terminal fragment of the Escherichia coli K-12 bcsQ locus.
  An early stop codon in the full reading frame precedes the annotated downstream initiation site. Repairing
  the stop in W3110 restores full-length BcsQ expression, downstream operon expression and cellulose production
  in AR3110. The fragment lacks the first eight residues of the intact protein, and its native expression,
  nucleotide activity and localization have not been established independently. Functional full-length
  BcsQ is represented by P0DP92.
