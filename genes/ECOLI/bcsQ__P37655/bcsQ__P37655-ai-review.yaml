- id: PMID:24097954
  title: Cellulose as an architectural element in spatially structured Escherichia coli biofilms.
  findings:
  - statement: The codon 6 stop was repaired in W3110 to create cellulose-producing AR3110.
    supporting_text: For changing codon 6 of bcsQ from TAG(stop) to TTG(leucine) in the chromosomal copy
      of bcsQ in strain W3110
  - statement: BcsA deletion tests cellulose synthesis in the repaired background.
    supporting_text: a precise deletion of the cellulose synthase gene bcsA in AR3110 reconstituted the
      ring-structured morphology previously observed for strain W3110
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text examined. The early stop also has polar effects on downstream expression;
      the study does not assay intrinsic activity of a separately expressed 242-residue fragment.
