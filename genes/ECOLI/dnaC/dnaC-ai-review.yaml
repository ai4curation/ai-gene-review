proposed_new_terms:
- proposed_name: replicative DNA helicase loader activity
  proposed_definition: Facilitating the opening or assembly of a replicative DNA helicase ring and its
    placement around single-stranded DNA, producing a loaded helicase competent for subsequent activation.
  justification: The demonstrated DnaC loading function is distinct from helicase unwinding, sequence-specific
    origin recognition and sliding-clamp loading. No appropriate bacterial helicase-loader GO molecular-function
    term was identified in the current QuickGO search.
  supported_by:
  - *id001
  - reference_id: PMID:30797687
core_functions:
- description: Loads DnaB onto single-stranded DNA through ring remodeling during initiation and fork
    restart; the DnaC ATPase cycle is regulated by DnaB and DNA.
  proposed_molecular_function: replicative DNA helicase loader activity
