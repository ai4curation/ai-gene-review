gene_symbol: dnaC
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: DnaC is the AAA+ helicase loader of Escherichia coli. It binds DnaB, opens its hexameric
  ring and permits single-stranded DNA to enter during origin initiation and replication restart. DnaB
  and DNA stimulate DnaC ATP hydrolysis, coordinating remodeling and release of the loader as the helicase
  becomes active. DnaC is not the Bacillus DnaC helicase and is not a continuously required elongating-replisome
  motor.
