id: P76079
gene_symbol: paaC
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  PaaC is the structural beta subunit of the soluble multicomponent
  phenylacetyl-CoA 1,2-epoxidase (PaaABCE) of Escherichia coli, the
  ring-activating enzyme of the aerobic phenylacetate catabolic pathway
  encoded by the paa operon. PaaC is a paralog of the catalytic alpha subunit
  PaaA (about 17% identity) and shares its ferritin-like four-helix-bundle
  fold, but its helix bundle is packed with side chains, lacks the substrate
  tunnel and does not bind CoA ligands or carry a metal site. PaaC forms a
  stable (PaaAC)2 heterotetramer with PaaA through a hydrophobic interface,
  which keeps the otherwise aggregation-prone PaaA soluble, and also forms a
  heterodimer with the small subunit PaaB, bridging PaaB to the PaaAC core.
  PaaC is required for epoxidase activity in reconstitution assays and for
  ring hydroxylation in vivo; in E. coli its translation is coupled to paaB.
