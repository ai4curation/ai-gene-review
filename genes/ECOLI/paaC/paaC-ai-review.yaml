- term:
    id: GO:0097266
    label: phenylacetyl-CoA 1,2-epoxidase activity
  evidence_type: IDA
  original_reference_id: PMID:21247899
  qualifier: contributes_to
  review:
    summary: >-
      PaaC is the non-catalytic structural beta subunit required for
      epoxidase activity; it scaffolds and solubilizes the catalytic PaaA
      subunit but does not itself bind substrate.
    action: NEW
    reason: >-
      GOA records PaaC as part of the complex but carries no activity row.
      PaaC supplies structure that the catalytic step depends on (PaaA is
      insoluble without it, and activity requires it), so contributes_to the
      complex activity is the appropriate subunit-level function. It is not
      asserted as enables because ligands bind only to PaaA.
    supported_by:
    - reference_id: PMID:21247899
      supporting_text: >-
        In vitro reconstitution of the oxygenase subunits showed that each of
        the PaaA, B, C, and E subunits are necessary for catalysis, whereas
        PaaD is not essential.
    - reference_id: PMID:21247899
      supporting_text: >-
        We hypothesize that like PaaC, the β subunits in other BMMs may be
        essential for structural integrity of the α subunit.
