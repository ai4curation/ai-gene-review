suggested_questions:
- question: >-
    Does PaaC have any role beyond scaffolding PaaA, for example in docking
    PaaB or the PaaE reductase to the PaaAC core?
suggested_experiments:
- description: >-
    Mutate PaaC residues at the PaaB-binding and PaaA-binding interfaces
    (e.g. the Glu-33/Asp-35 salt bridges to PaaA) and measure complex
    assembly and epoxidase activity of the reconstituted PaaABCE system.
