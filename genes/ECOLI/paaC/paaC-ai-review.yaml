core_functions:
- description: >-
    Structural beta subunit of the PaaABCE phenylacetyl-CoA 1,2-epoxidase:
    forms the (PaaAC)2 hydroxylase core with the catalytic PaaA subunit,
    stabilizing PaaA, and bridges the small PaaB subunit to the core, thereby
    contributing to ring epoxidation in aerobic phenylacetate catabolism.
