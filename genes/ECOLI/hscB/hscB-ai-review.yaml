  review:
    summary: >-
      HscB stimulates the ATPase activity of its dedicated Hsp70 partner HscA,
      modestly alone and synergistically (hundreds-fold) together with IscU.
    action: ACCEPT
    reason: >-
      The InterPro HscB family mapping is borne out directly by E. coli
      biochemistry: purified HscB (Hsc20) stimulates HscA (Hsc66) ATPase
      activity and, with IscU, raises it more than 400-fold, while HscB itself
      has no ATPase activity. This is the core molecular activity of HscB.
    supported_by:
