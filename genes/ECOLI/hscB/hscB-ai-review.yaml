- id: PMID:10869428
  title: Interaction of the iron-sulfur cluster assembly protein IscU with the Hsc66/Hsc20
    molecular chaperone system of Escherichia coli.
  findings:
  - statement: >-
      HscB (Hsc20) binds IscU, enhances IscU binding to HscA (Hsc66), and with
      IscU stimulates HscA ATPase activity up to 480-fold; HscB has no
      intrinsic ATPase or chaperone activity.
    supporting_text: >-
      IscU and its iron-sulfur complex (IscU-Fe/S) stimulated the basal
      steady-state ATPase activity of Hsc66 weakly in the absence of Hsc20
      but, in the presence of Hsc20, increased the ATPase activity up to
      480-fold.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text cached; foundational biochemical characterization of the
      HscA-HscB-IscU system in E. coli.
