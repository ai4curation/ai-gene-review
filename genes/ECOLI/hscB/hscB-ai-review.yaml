suggested_questions:
- question: >-
    Does the weak HscB-IscS interaction, on the IscS surface shared with
    ferredoxin and CyaY, have a role in handing IscU from the IscS-IscU
    assembly complex to HscA, or is it incidental?
- question: >-
    Does HscB recognize only cluster-loaded IscU in vivo, or does it also
    deliver apo-IscU to HscA to reset the scaffold?
suggested_experiments:
- description: >-
    Test hscB C-domain patch mutants (L92A/M93A/F153A) and IscS-binding-surface
    mutants for in vivo maturation of [2Fe-2S] and [4Fe-4S] reporter enzymes
    (e.g. ferredoxin, aconitase, SdhB) in an E. coli hscB deletion background.
  experiment_type: genetic complementation with Fe-S enzyme activity assays
- description: >-
    Measure kinetics of [2Fe-2S] cluster transfer from IscU to apo-ferredoxin
    with HscA and wild-type versus mutant HscB to separate targeting from
    ATPase-activation defects.
  experiment_type: in vitro cluster transfer kinetics
