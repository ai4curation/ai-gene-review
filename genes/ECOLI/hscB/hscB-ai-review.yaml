  label: Escherichia coli K-12
description: >-
  HscB (Hsc20) is a 171-residue cytosolic J-type co-chaperone encoded in the
  iscRSUA-hscBA-fdx operon. It has an N-terminal J domain that contacts the
  dedicated Hsp70 HscA (Hsc66) and a three-helix C-terminal domain whose
  conserved hydrophobic and acidic patch binds the Fe-S scaffold protein IscU.
  HscB has no intrinsic chaperone activity of its own; instead it delivers
  IscU (apo or cluster-bound) to HscA, lowers the IscU concentration needed to
  activate HscA, and synergistically stimulates HscA ATP hydrolysis several
  hundred-fold. The resulting HscA-IscU-HscB ternary complex drives the ATP
  cycle that releases and transfers IscU-assembled Fe-S clusters to acceptor
  apoproteins, so HscB acts as the targeting and ATPase-activating component of
  the Isc Fe-S cluster biogenesis machinery. A weak interaction with the
  cysteine desulfurase IscS has also been reported.
