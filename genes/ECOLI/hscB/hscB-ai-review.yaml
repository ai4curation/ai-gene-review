        Addition of both Hsc20 and IscU to Hsc66 resulted in a dramatic
        stimulation, increasing the ATPase activity of Hsc66 ≈100-fold over the
        level observed in the presence of Hsc20 or IscU alone and >400-fold
        over the basal intrinsic activity.
    - reference_id: PMID:10869428
      supporting_text: >-
        purified IscU and Hsc20 alone did not exhibit detectable ATPase
        activity
    - reference_id: PMID:18702525
      supporting_text: >-
        Previous studies have shown that IscU and HscB individually enhance
