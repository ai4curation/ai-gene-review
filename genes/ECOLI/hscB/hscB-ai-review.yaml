- term:
    id: GO:0006457
    label: protein folding
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: involved_in
  supporting_entities:
  - UniRule:UR000065662
  review:
    summary: >-
      HscB is a specialized co-chaperone for the Fe-S scaffold IscU, not a
      general protein-folding factor.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Unlike DnaJ, HscB lacks intrinsic chaperone activity and the C-terminal
      domains that Hsp40 proteins use to bind unfolded polypeptides. The
      HscA-HscB cycle acts on a single substrate, IscU, to release and
      transfer Fe-S clusters; there is no evidence that it folds client
      proteins in general. The specific biological role is captured by
      GO:0044571 [2Fe-2S] cluster assembly. This is consistent with the
      treatment of the P. putida orthologue.
    supported_by:
    - reference_id: PMID:10869428
      supporting_text: >-
        In contrast to DnaJ, however, Hsc20 does not display intrinsic
        chaperone activity and lacks the C-terminal domains necessary for
        Hsp40 interactions with unfolded polypeptides
- term:
    id: GO:0044571
    label: '[2Fe-2S] cluster assembly'
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR004640
  review:
    summary: >-
      HscB acts in Isc-mediated Fe-S cluster biogenesis by targeting
      [2Fe-2S]-loaded IscU to HscA and activating the HscA ATP cycle that
      releases the cluster.
    action: ACCEPT
    reason: >-
      HscB does part of the work of the process (participation, not just
      necessity): it binds IscU and HscA and supplies the ATPase activation
      that drives the cluster-release step. E. coli biochemistry shows that
      HscB enhances IscU-HscA binding and stimulates HscA ATPase with the
      [2Fe-2S]-bound form of IscU. The IscU cluster built in these studies is
      [2Fe-2S], making GO:0044571 an appropriately specific child of
      GO:0016226 iron-sulfur cluster assembly.
    supported_by:
    - reference_id: PMID:10869428
      supporting_text: >-
        These results establish a direct and specific role for the Hsc66/Hsc20
        chaperone system in functioning with isc gene components for the
        assembly of iron-sulfur cluster proteins.
    - reference_id: PMID:10869428
      supporting_text: >-
        In the presence of Hsc20, on the other hand, IscU–Fe/S is very active
        in stimulating Hsc66.
    - reference_id: PMID:18702525
      supporting_text: >-
        The interaction between IscU and HscB is critical for successful
        assembly of iron-sulfur clusters.
