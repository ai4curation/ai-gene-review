id: P0A6C5
gene_symbol: argA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: ArgA is the cytoplasmic N-acetylglutamate synthase that initiates the linear arginine biosynthetic
  pathway in Escherichia coli. It transfers the acetyl group of acetyl-CoA to L-glutamate, producing N-acetylglutamate
  and CoA. The enzyme is feedback inhibited by L-arginine and assembles as a homohexamer; feedback-resistant
  variants increase arginine biosynthesis.
