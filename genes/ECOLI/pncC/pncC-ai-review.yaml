  label: Escherichia coli K-12
description: >-
  PncC (formerly YgaD) is the nicotinamide mononucleotide (NMN) deamidase of Escherichia coli K-12, a
  CinA C-terminal-domain family amidohydrolase that hydrolyzes NMN to nicotinate D-ribonucleotide (NaMN)
  and ammonia. NMN arises from NAD+ consumption, chiefly by NAD-dependent DNA ligase, and PncC returns
  it as NaMN to the NadD/NadE completion steps of the Preiss-Handler route. Of the three CinA-family (PncC-homologous)
  proteins of E. coli, only the ygaD product showed NMN deamidase activity when purified; it has micromolar
  affinity for NMN and was not active on the other substrates tested.
