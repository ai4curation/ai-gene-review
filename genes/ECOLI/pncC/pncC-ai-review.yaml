core_functions:
- description: >-
    Hydrolytic deamidation of NMN to NaMN, returning NMN released by NAD+ consumption to the deamido-NAD
    completion route (NadD then NadE). No process term is proposed: the physiological role in NAD+ salvage
    was confirmed by deletion-mutant phenotypes in Shewanella oneidensis, not in E. coli, and the authors
    also raise NMN detoxification after DNA ligase action as a possible role.
  molecular_function:
    id: GO:0019159
    label: nicotinamide-nucleotide amidase activity
  supported_by:
  - reference_id: PMID:21953451
    supporting_text: >-
      Of the three PncC homologs present in Escherichia coli , NMN deamidase activity was confirmed only
      for the recombinant purified product of the ygaD gene.
  - reference_id: PMID:21953451
    supporting_text: >-
      Enzymatic characterization of the PncC protein, as well as phenotype analysis of deletion mutants,
      confirmed its proposed biochemical and physiological function in S.
suggested_questions:
- question: >-
    Does E. coli PncC contribute measurably to NAD+ salvage flux in vivo, or is its main role keeping
    NMN released by DNA ligase low, and what do the two inactive CinA-family paralogs do?
suggested_experiments:
- description: >-
    Measure NMN, NaMN and NAD+ in pncC deletion and complemented strains under conditions of high DNA
    ligase turnover, and assay the two inactive CinA-family paralogs against alternative substrates.
