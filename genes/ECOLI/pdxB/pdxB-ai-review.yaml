id: P05459
gene_symbol: pdxB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  PdxB is the cytoplasmic erythronate-4-phosphate dehydrogenase (EC 1.1.1.290) of Escherichia
  coli, a homodimeric member of the D-isomer-specific 2-hydroxyacid dehydrogenase family.
  It oxidizes 4-phospho-D-erythronate, the product of Epd, to (R)-3-hydroxy-2-oxo-4-phosphooxybutanoate,
  the second reaction of the DXP-dependent de novo pyridoxal 5'-phosphate pathway; SerC then
  transaminates the product. PdxB is a nicotino-enzyme whose NAD(H) stays tightly bound; free
  NAD+ does not reoxidize the bound NADH, and multiple turnovers instead require an alpha-keto
  acid (2-oxoglutarate, oxaloacetate or pyruvate) as oxidant, which is reduced to the D-2-hydroxy
  acid. pdxB mutants require vitamin B6 (pyridoxine or pyridoxal), and the gene lies upstream
  of truA (hisT) in a complex operon.
