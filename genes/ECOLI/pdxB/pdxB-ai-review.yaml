- term:
    id: GO:0033711
    label: 4-phosphoerythronate dehydrogenase activity
  evidence_type: IDA
  original_reference_id: PMID:20831184
  qualifier: enables
  review:
    summary: Purified PdxB oxidizes 4-phosphoerythronate with tightly bound NAD+.
    action: ACCEPT
    reason: >-
      Coupled assays with SerC and PdxA gave a kcat/Km of 6.7 x 10^6 M-1 s-1 for 4PE. PdxB
      keeps NAD(H) bound and is reoxidized by alpha-keto acids rather than free NAD+, so the
      net in vivo reaction pairs 4PE oxidation with 2-oxo acid reduction; the NAD-dependent
      half-reaction is what GO:0033711 (RHEA:18829) describes, and it is the defining activity.
    supported_by:
    - reference_id: PMID:20831184
      supporting_text: >-
        PdxB catalyzes the second step in the biosynthesis of pyridoxal phosphate by oxidizing
        4-phospho-d-erythronate (4PE) to 2-oxo-3-hydroxy-4-phosphobutanoate (OHPB) with concomitant
        reduction of NAD(+) to NADH.
    - reference_id: PMID:20831184
      supporting_text: >-
        We have solved this mystery by demonstrating that a variety of physiologically available
        α-keto acids serve as oxidants of PdxB to sustain multiple turnovers.
