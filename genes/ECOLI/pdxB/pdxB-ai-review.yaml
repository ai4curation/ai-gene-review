suggested_questions:
- question: >-
    Which alpha-keto acid reoxidizes PdxB-bound NADH in vivo, and is the resulting D-2-hydroxy
    acid (e.g. D-2-hydroxyglutarate) recycled?
suggested_experiments:
- hypothesis: 2-oxoglutarate is the main physiological oxidant of PdxB in vivo.
  description: >-
    Measure D-2-hydroxyglutarate and other D-2-hydroxy acids by LC-MS in strains overexpressing
    or lacking pdxB, with and without pyridoxine supplementation.
