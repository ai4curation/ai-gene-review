  label: Escherichia coli K-12
description: >-
  GutQ is a second D-arabinose 5-phosphate isomerase of Escherichia coli, encoded as the last gene of
  the glucitol (gutAEBDMRQ) operon. Like its paralog KdsD it reversibly interconverts D-ribulose 5-phosphate
  and D-arabinose 5-phosphate, and it can sustain wild-type lipopolysaccharide synthesis through the KDO
  pathway when kdsD is deleted; cells lacking both isomerases depend on exogenous arabinose 5-phosphate
  for growth. GutQ is not needed for glucitol catabolism itself, and its arabinose 5-phosphate product
  is proposed to act as a signal required for full induction of the gut operon. The protein is a homotetramer
  with an SIS domain and two CBS domains.
