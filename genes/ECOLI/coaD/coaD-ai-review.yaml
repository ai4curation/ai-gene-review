gene_symbol: coaD
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  coaD (kdtB, b3634) encodes phosphopantetheine adenylyltransferase (PPAT), which reversibly transfers
  an AMP group from ATP to 4'-phosphopantetheine to form 3'-dephospho-CoA and pyrophosphate, the penultimate
  step of CoA biosynthesis in Escherichia coli. The essential cytoplasmic enzyme is a homohexamer of the
  nucleotidylyltransferase (HIGH-motif) superfamily, follows a random bi-bi mechanism and is feedback-inhibited
  by CoA, which copurifies tightly bound and competes with ATP and both pantetheine-containing substrates.
  PPAT lacks dephospho-CoA kinase activity, so E. coli completes CoA synthesis with a separate CoaE.
