suggested_questions:
- question: >-
    Do the two thermodynamically distinct CoA binding modes of the PPAT hexamer correspond to distinct
    regulatory states in vivo?
suggested_experiments:
- description: >-
    Introduce substitutions that abolish one CoA binding mode and measure CoA and dephospho-CoA pools
    and PPAT inhibition in vivo.
  experiment_type: site-directed mutagenesis with metabolite profiling
