  evidence_type: IDA
  original_reference_id: PMID:10480925
  qualifier: enables
  review:
    summary: CoaD is a homohexamer; identical protein binding is structural.
    action: KEEP_AS_NON_CORE
    reason: >-
      Purified recombinant PPAT is a 108 kDa homohexamer and ligand binding shows half-the-sites behaviour
      across the hexamer. Self-association is a property of the enzyme, not its biological role.
    supported_by:
    - reference_id: PMID:10480925
      supporting_text: Overexpression of coaD yielded highly purified recombinant PPAT, which is a homohexamer
        of 108 kDa.
