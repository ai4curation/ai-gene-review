core_functions:
- description: Fast 5'-3' ATP-dependent DNA helicase motor of RecBCD that translocates on the 5'-ended
    strand of a double-strand end, contributing to the holoenzyme's exonuclease V activity and to end
    processing that initiates homologous recombinational repair.
