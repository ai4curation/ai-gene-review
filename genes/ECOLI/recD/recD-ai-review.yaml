id: P04993
gene_symbol: recD
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: RecD is the 608-residue 5'-3' DNA helicase subunit of the Escherichia coli RecBCD enzyme
  (Exonuclease V), a heterotrimeric helicase-nuclease that processes double-stranded DNA ends for repair
  by homologous recombination and degrades foreign linear DNA. Within RecBCD, RecD is the fast motor that
  translocates on the 5'-ended strand, while RecB is the slow 3'-5' motor and carries the nuclease. RecD
  is an ssDNA-dependent ATPase; it has no nuclease site of its own but stimulates the RecB nuclease and
  holoenzyme processivity and restrains RecA loading until Chi is recognized. E. coli recD null mutants
  lack exonuclease V activity but remain recombination- and repair-proficient, because the RecBC enzyme
  loads RecA constitutively.
