  - *id001
suggested_questions:
- question: How does the RecD motor communicate Chi recognition by RecC to switch the RecB nuclease and
    RecA-loading modes, given that RecD is dispensable for recombination in E. coli but essential in Pseudomonas?
suggested_experiments:
- description: Compare wild-type and RecD Walker A (K177Q) RecBCD in single-molecule unwinding assays
    across Chi to measure how RecD motor activity sets the post-Chi speed and RecA loading.
  experiment_type: single-molecule biochemistry
