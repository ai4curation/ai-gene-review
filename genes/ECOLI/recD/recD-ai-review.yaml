    label: regulation of DNA double-strand break processing
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:2152895
  - PANTHER:PTN008452915
  - UniProtKB:Q8NG08
  review:
    summary: IBA from PTN008452915, seeded only by human HELB and mouse Helb.
    action: MARK_AS_OVER_ANNOTATED
    reason: The regulation of DSB processing IBD reflects HELB, which limits long-range end resection
      in eukaryotes; it is placed too deep and descends onto bacterial RecD. RecD is an executor of RecBCD
      end processing (it is the 5' strand motor), not an external regulator of it. RecD does modulate
      the holoenzyme (it stimulates the RecB nuclease and restrains RecA loading), so a regulatory reading
      is not absurd, but the annotation does not describe RecD's role.
    supported_by:
    - reference_id: file:interpro/panther/PTHR43788/PTHR43788-paint.tsv
