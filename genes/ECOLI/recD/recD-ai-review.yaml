    action: MARK_AS_OVER_ANNOTATED
    reason: HELB limits homologous recombination by restraining resection; that IBD is placed too deep
      and reaches RecD. RecD-containing RecBCD is the enzyme that initiates homologous DSB repair in E.
      coli. UniProt notes that RecD restrains RecA loading by the holoenzyme (recD nulls are recombination-proficient),
