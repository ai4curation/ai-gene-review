    label: double-strand break repair via homologous recombination
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: involved_in
  supporting_entities:
  - UniRule:UR000119538
  review:
    summary: UniRule-based transfer of RecBCD's role in homologous double-strand break repair to RecD.
    action: ACCEPT
    reason: 'RecBCD initiates DSB repair by homologous recombination, and RecD does part of that work:
      it is the fast 5''-3'' motor that unwinds the 5''-ended strand of the broken end. E. coli recD nulls
      remain repair-proficient because RecBC loads RecA constitutively, but that shows RecD is not necessary
      in E. coli, not that it does not participate in the wild-type reaction.'
    supported_by:
    - &id001
      reference_id: PMID:19052323
      supporting_text: The RecBCD enzyme of Escherichia coli is a helicase-nuclease that initiates the
        repair of double-stranded DNA breaks by homologous recombination.
