  review:
    summary: Intended replacement for the two GOA enables GO:0008854 rows (IDA PMID:1618858; IEA GO_REF:0000002), recording that RecD contributes_to the holoenzyme's exodeoxyribonuclease V activity.
    action: NEW
    reason: Exodeoxyribonuclease V activity is reconstituted only when RecB, RecC and RecD are combined, and RecD alone has none. RecD stimulates the RecB nuclease and supplies a motor, but the nuclease site is in RecB, so contributes_to is the correct relation. This follows projects/SDH_GP2TERM_CONTRIBUTES_TO.md and is recorded here pending an upstream qualifier change.
    supported_by:
    - reference_id: PMID:1618858
      supporting_text: The RecB, RecC, and RecD subunits can associate in vitro to give nuclease, helicase, ATPase, and Chi-specific endonuclease activities which are indistinguishable from those of the RecBCD holoenzyme.
    - reference_id: PMID:1618858
      supporting_text: none of the individual RecB, RecC, or RecD subunits have readily detectable activities of the holoenzyme
