  review:
    summary: MlaB binds and stabilizes the MlaF ATPase, allowing MlaF to accumulate and assemble with
      MlaE and MlaD.
    action: NEW
    reason: MlaB itself performs the stabilization by binding the MlaF NBD. MlaF cannot be expressed and
      purified alone but is obtained in good yield when co-expressed with MlaB; without MlaB, MlaF does
