  review:
    summary: PAINT asserts that MlaB enables phospholipid transfer activity; MlaB is
      a cytoplasmic STAS subunit that does not contact lipid.
    action: MARK_AS_OVER_ANNOTATED
    reason: GO:0120014 describes carrying a phospholipid between membranes in a
      hydrophobic pocket. In MlaFEDB the lipid pathway runs through MlaE and the MlaD
      ring, the ATP that drives it is hydrolyzed by MlaF, and MlaB binds the far side of
      MlaF in the cytoplasm. MlaF over-expression suppresses the mlaB deletion, so MlaB
