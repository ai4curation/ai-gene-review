  review:
    summary: PAINT asserts that MlaB enables phospholipid transfer activity; MlaB is a cytoplasmic STAS
      subunit that does not contact lipid.
    action: MARK_AS_OVER_ANNOTATED
    reason: GO:0120014 requires phospholipid removal from a membrane or particle, protection in a hydrophobic
      pocket during aqueous transport, and delivery to an acceptor membrane or particle. MlaB stabilizes
