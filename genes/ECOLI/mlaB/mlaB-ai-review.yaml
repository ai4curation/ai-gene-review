knowledge_gaps:
- gap_statement: Whether MlaB has any role beyond stabilizing MlaF, such as regulation of MlaF ATPase
    activity through phosphorylation of the conserved STAS Thr52, is unknown; T52A abolishes complex ATPase
    activity, yet MlaF over-expression bypasses the mlaB deletion.
  status: OPEN
  gap_kind:
  - BIOLOGY
  significance: Determines whether MlaB is purely a structural/stabilizing subunit or a regulatory input
    that tunes Mla transport flux.
suggested_questions:
- question: Is MlaB Thr52 phosphorylated in vivo, and if so by which kinase and under what envelope-stress
    conditions?
- question: Does the T52A defect in ATPase activity reflect loss of a regulatory signal or a perturbed
    MlaF-MlaB interface that destabilizes the MlaF dimer?
suggested_experiments:
- description: Phosphoproteomic detection of MlaB Thr52 across growth phases and envelope stresses, combined
    with phosphomimetic (T52D/E) and non-phosphorylatable alleles assayed for MlaF levels, MlaFEDB ATPase
    activity and SDS-EDTA resistance.
  experiment_type: phosphoproteomics and site-directed mutagenesis
- description: Measure MlaF half-life in vivo by translational shut-off chase in wild type, mlaB deletion
    and mlaB T52A strains.
  experiment_type: protein stability assay
