core_functions:
- description: STAS-domain accessory subunit of the MlaFEDB ABC transporter that binds the MlaF ATPase
    on the cytoplasmic face of the inner membrane, stabilizing MlaF and enabling its assembly with MlaE
    and MlaD, thereby contributing to the complex's ATP-driven phospholipid transfer activity.
