  label: Escherichia coli K-12
description: 'MlaB (YrbB) is a small (97-residue) cytoplasmic protein consisting of a single STAS (sulfate
  transporter and anti-sigma factor antagonist) domain, encoded as the last gene of the mlaFEDCB operon
  of the Mla (maintenance of lipid asymmetry) intermembrane phospholipid transport system. Two MlaB subunits
  are stoichiometric components of the inner-membrane MlaFEDB ABC transporter complex, each bound to the
  side of the helical subdomain of one MlaF ATPase on the cytoplasmic face of the inner membrane, far
  from the ATP sites and away from the MlaE/MlaD lipid pathway. MlaB binds and stabilizes MlaF: under
  the tested expression conditions, MlaB co-expression increases recoverable MlaF and its assembly with
  MlaE and MlaD. A T52A substitution at the conserved STAS Ser/Thr position, which lies at the MlaF interface,
  leaves complex assembly intact but abolishes complex ATPase activity. Over-expression of MlaF suppresses
  the mlaB deletion, suggesting that the main role of MlaB is to keep MlaF stable and available for MlaFEDB
  assembly; a regulatory role (for example by phosphorylation of Thr52) has been proposed but not demonstrated.
  Loss of MlaB causes outer-membrane lipid asymmetry defects and SDS-EDTA sensitivity.'
