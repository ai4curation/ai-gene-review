taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: 'LysA (diaminopimelate decarboxylase, DAPDC) is a pyridoxal 5-prime-phosphate-dependent fold-type
  III decarboxylase that catalyses the final step of L-lysine biosynthesis in Escherichia coli: the stereospecific
  decarboxylation of meso-2,6-diaminopimelate at its D-centre to give L-lysine and CO2. It is inactive
  on the LL- and DD-isomers, is active as a homodimer, and is the only known D-amino-acid decarboxylase.
  lysA expression is activated by LysR and repressed by lysine.'
