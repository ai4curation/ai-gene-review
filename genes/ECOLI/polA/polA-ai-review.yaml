id: P00582
gene_symbol: polA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: DNA polymerase I is a multifunctional Escherichia coli enzyme with DNA-directed polymerase,
  3′ to 5′ proofreading exonuclease, and 5′ to 3′ nuclease activities. It removes RNA primers and replaces
  them with DNA during lagging-strand maturation, fills gaps during DNA repair, and acts in the cytoplasm.
  Its Klenow region contains polymerase and proofreading functions, whereas the N-terminal region supplies
  the separate 5′ nuclease. It is a maturation and repair polymerase rather than the principal processive
  chromosomal replicase.
