  qualifier: acts_upstream_of_or_within
  review:
    summary: Pol I supplies excision-repair DNA synthesis and nuclease processing.
    action: ACCEPT
    reason: Repair is a major physiological use of Pol I, supported by polA-dependent restitution of incised
      DNA and live-cell repair reactions. The broad DNA-repair term is retained because both nucleotide-excision-type
      and base-excision repair contexts are supported.
    supported_by:
    - reference_id: PMID:169227
      supporting_text: 'This restitution process is ATP independent and N-ethylmaleimide

        insensitive and takes place only in polA+ strains.'
    - reference_id: PMID:23630273
      supporting_text: 'Here, we used photoactivation, localization, and tracking in live

        Escherichia coli to directly visualize single fluorescent labeled DNA polymerase

        I (Pol) and ligase (Lig) molecules searching for DNA gaps and nicks, performing

        transient reactions, and releasing their products.'
