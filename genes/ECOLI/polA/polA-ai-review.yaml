- term:
    id: GO:0006302
    label: double-strand break repair
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - AGI_LocusCode:AT3G20540
  - FB:FBgn0002905
  - MGI:MGI:2155399
  - PANTHER:PTN000015249
  - UniProtKB:O75417
  - UniProtKB:Q7Z5Q5
  review:
    summary: Pol I can contribute repair synthesis at stress-associated DNA double-strand-break repair
      sites.
    action: KEEP_AS_NON_CORE
    reason: 'The PAINT inference is supported by E. coli genetic evidence in PMID20523737: Pol I competes
      with Pol IV for primer termini during the DSB-repair-associated Lac mutagenesis assay. This is conditional
      repair synthesis, not the principal chromosome replication role. The assay supports the authors’
      mechanistic model rather than direct visualization of Pol I at every break. PMID36326440 independently
      links polA to break homeostasis, but break accumulation alone would not prove participation in DSB
      repair.'
    supported_by:
    - reference_id: PMID:20523737
      supporting_text: 'The data support the remaining hypothesis

        that during the acts of DNA double-strand-break (DSB) repair, shown previously

        to underlie stress-induced mutagenesis in the Lac system, there is competition

        of DNA polymerases I, II and III with DNA Pol IV for action at the primer

        terminus.'
    - reference_id: PMID:36326440
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      failure_modes: []
      source_entities:
      - source_id: PANTHER:PTN000015249
        source_status: SUPPORTS_TRANSFER
        comment: The ancestral double-strand-break-repair inference is retained with a non-core conditional
          context, supported independently by E. coli genetic competition between polymerases at repair
          primer termini in PMID20523737.
