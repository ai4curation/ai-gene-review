    reason: The enzyme directly performs primer removal and replacement synthesis, rather than merely
      being required for viability. PMID6262323 uses purified E. coli proteins on phiX174 DNA and explicitly
      presents the reaction as a model of lagging-strand synthesis. Chromosomal context is corroborated
      by the comparative replication review; the activity is not bulk Pol III elongation.
    supported_by:
