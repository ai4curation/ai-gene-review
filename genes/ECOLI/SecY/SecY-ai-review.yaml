id: P0AGA2
gene_symbol: SecY
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli (strain K12)
description: SecY is the pore-forming subunit of the Escherichia coli SecYEG protein-conducting channel
  in the inner membrane. Its ten-transmembrane-helix core forms the gated aqueous pore and lateral gate
  used for post-translational SecA/SecB-dependent export of secretory preproteins and for cotranslational
  insertion of inner-membrane proteins delivered by SRP. SecY directly contacts signal peptides, SecA,
  SecE, SecG, ribosomes, and accessory translocon factors during Sec-dependent protein movement into or
  across the plasma membrane.
