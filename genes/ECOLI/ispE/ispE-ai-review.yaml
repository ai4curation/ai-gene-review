      record_section: ["CC:FUNCTION"]
      supporting_text: 'FUNCTION: Catalyzes the phosphorylation of the position 2 hydroxy group of 4-diphosphocytidyl-2C-methyl-D-erythritol
        (PubMed:10570138, PubMed:10655484, Ref.6).'
