taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: IspE (YchB) is the 4-diphosphocytidyl-2-C-methyl-D-erythritol kinase of Escherichia coli,
  a GHMP-family kinase of the methylerythritol phosphate (MEP) pathway that makes the isoprenoid precursors
  isopentenyl diphosphate and dimethylallyl diphosphate. It uses ATP to phosphorylate the 2-hydroxy group
  of 4-diphosphocytidyl-2-C-methyl-D-erythritol (CDP-ME), the product of IspD, giving CDP-ME 2-phosphate,
  which IspF then cyclises. The enzyme was first described as an isopentenyl monophosphate kinase; that
  activity is real but slow, and its physiological substrate is CDP-ME. Point mutations that inactivate
  it are lethal unless isoprenoid precursors are supplied by a heterologous mevalonate route.
