  - statement: Recombinant peppermint and E. coli YchB kinases phosphorylate isopentenyl monophosphate,
      proposed as the terminal intermediate of the pathway.
    supporting_text: Besides the preferred substrate isopentenyl monophosphate, the recombinant peppermint
      and E. coli kinases also phosphorylate isopentenol
    finding_review:
      finding_status: OVERTURNED
      superseded_by:
      - PMID:10655484
      review_notes: The physiological substrate of E. coli YchB/IspE was shown to be CDP-ME, phosphorylated
        at the 2-hydroxy group; UniProt records that the protein was originally thought to be an isopentenyl
        monophosphate kinase and that it phosphorylates isopentenyl phosphate only at low rates.
      supported_by:
      - reference_id: PMID:10655484
        supporting_text: The reaction product was identified as 4-diphosphocytidyl-2C-methyl-D-erythritol
          2-phosphate by NMR experiments with various (13)C-labeled substrate samples.
  reference_review:
    relevance: MEDIUM
    correctness: DISPUTED
    review_notes: Abstract-only cache (PMC24130 full text could not be retrieved). Correct paper for E.
      coli ychB cloning, but its isopentenyl-monophosphate-kinase interpretation was superseded; it is
      the original reference of the EXP CDP-ME kinase row, which is accepted on the claim.
