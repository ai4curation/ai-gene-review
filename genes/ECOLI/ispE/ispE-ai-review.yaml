suggested_questions:
- question: Where in the E. coli cell does IspE act? No subcellular-location data exist for the protein,
    and it is presumed cytosolic only because it is soluble and has no membrane-targeting features.
- question: Does the slow isopentenyl monophosphate kinase activity of IspE matter in vivo, for example
    when isopentenyl phosphate accumulates?
suggested_experiments:
- description: Localise chromosomally tagged IspE by fractionation with cytosolic and inner-membrane markers
    and by fluorescence microscopy under native expression.
- description: Measure isopentenyl phosphate pools in E. coli and compare the in vitro specificity constants
    of IspE for CDP-ME and isopentenyl phosphate to judge whether the side activity can carry flux.
