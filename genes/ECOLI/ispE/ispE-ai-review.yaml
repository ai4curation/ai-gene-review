    label: 4-(cytidine 5'-diphospho)-2-C-methyl-D-erythritol kinase activity
  evidence_type: EXP
  original_reference_id: PMID:10570138
  qualifier: enables
  review:
    summary: Correct activity; the cited paper itself described the enzyme as an isopentenyl monophosphate
      kinase.
    action: ACCEPT
    reason: Lange and Croteau cloned E. coli ychB and, in the abstract, report it as a kinase phosphorylating
      isopentenyl monophosphate, which they proposed as the terminal MEP pathway step. UniProt nevertheless
      cites this paper for the CDP-ME kinase reaction, and the curator read the full text (abstract-only
      in the cache). The claim the row makes, CDP-ME kinase activity, is established directly by Luttgen
      et al. (PMID:10655484) and is the curated UniProt function, so the row is accepted on the claim.
      The paper's own isopentenyl-monophosphate-kinase interpretation is recorded as overturned in its
      reference entry.
    supported_by:
    - reference_id: PMID:10655484
      supporting_text: The reaction product was identified as 4-diphosphocytidyl-2C-methyl-D-erythritol
        2-phosphate by NMR experiments with various (13)C-labeled substrate samples.
