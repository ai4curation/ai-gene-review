- description: GHMP-family kinase that phosphorylates the 2-hydroxy group of 4-diphosphocytidyl-2-C-methyl-D-erythritol
    with ATP, forming 4-diphosphocytidyl-2-C-methyl-D-erythritol 2-phosphate in the third step of the
    MEP pathway to IPP/DMAPP.
