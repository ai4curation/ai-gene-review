- term:
    id: GO:0030488
    label: tRNA methylation
  evidence_type: IMP
  original_reference_id: PMID:10572129
  qualifier: acts_upstream_of_or_within
  review:
    summary: miaB insertion mutants of S. typhimurium and E. coli accumulate i6A in tRNA and lack
      ms2i6A/ms2io6A; complementation restores the modification.
    action: MODIFY
    reason: The genetic evidence is sound and MiaB does transfer a methyl group from a second SAM
      onto the newly inserted sulfur (PMID:15339930), so the term is not false. But the process MiaB
      performs is methylthiolation (sulfur insertion plus S-methylation) at C2 of i6A37, for which
      GO has the specific term tRNA methylthiolation (GO:0035600). tRNA methylation is not an
      ancestor of GO:0035600, so this is a lateral correction to the precise process the evidence
      supports. Note the paper itself argued (from weak AdoMet-motif similarity) that MiaB acts only
      in thiolation and not methylation; that was later overturned by in vitro reconstitution.
    proposed_replacement_terms:
    - id: GO:0035600
      label: tRNA methylthiolation
    supported_by:
    - reference_id: PMID:10572129
      supporting_text: The tRNA from the E. coli miaB strains showed an accumulation of i 6 A,
        whereas ms 2 i 6 A was absent (data not shown).
    - reference_id: PMID:10572129
      supporting_text: Taken together, the data from both S. typhimurium and E. coli firmly
        identifies f474 as the miaB gene.
    - reference_id: PMID:15339930
      supporting_text: This study demonstrates that MiaB protein is a bifunctional system, involved
        in both thiolation and methylation of i(6)A.
