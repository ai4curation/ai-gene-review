id: P0AEI1
gene_symbol: miaB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: 'MiaB is the cytosolic radical S-adenosyl-L-methionine (SAM) methylthiotransferase of Escherichia
  coli that converts N6-dimethylallyladenosine (i6A) at position 37 of tRNAs reading codons that begin
  with uridine into 2-methylthio-N6-dimethylallyladenosine (ms2i6A). The reaction inserts a sulfur atom
  at C2 of the adenine ring and then methylates it, consuming two SAM: one is reductively cleaved to a
  5''-deoxyadenosyl radical that abstracts the C2 hydrogen, and the other donates the methyl group. MiaB
  is a monomer with an N-terminal MTTase domain, a central radical SAM domain and a C-terminal TRAM domain,
  and binds two [4Fe-4S] clusters: the radical SAM cluster (Cys157, Cys161, Cys164) and an auxiliary cluster
  in the MTTase domain that activates an exogenous sulfur cosubstrate and is not consumed during turnover.
  MiaB acts after the prenyltransferase MiaA; in E. coli ms2i6A is the final product, whereas in Salmonella
  MiaE further hydroxylates it to ms2io6A. The ms2 group stabilises codon-anticodon pairing; miaB mutants
  lack the modification and show an antisuppressor phenotype but no growth defect under standard conditions.
  Fe-S cluster loading of MiaB in vivo depends on the carrier NfuA and the monothiol glutaredoxin GrxD.'
