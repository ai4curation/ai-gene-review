suggested_questions:
- question: 'What is the physiological sulfur donor for MiaB in E. coli: free sulfide/polysulfide, a persulfide
    carrier protein, or something else, and is it shared with RimO?'
- question: Do the GrxD and NfuA interactions reflect first-time cluster loading of the auxiliary
    MTTase-domain cluster, repair after oxidative damage, or both?
suggested_experiments:
- description: Reconstitute E. coli MiaB with 34S-labelled candidate sulfur donors (sulfide,
    polysulfide, persulfidated IscS/TusA-type carriers) and quantify ms2i6A formation and label
    incorporation by LC-MS to identify the physiological sulfur source.
knowledge_gaps:
- gap_statement: The physiological sulfur donor for MiaB-catalysed methylthiolation in vivo is
    unidentified; in vitro, an exogenous sulfur cosubstrate bound to the auxiliary cluster is used,
    but its cellular source is unknown.
  boundary: MiaB is a true catalyst whose two [4Fe-4S] clusters are not sacrificed; sulfur is
    activated at an exchangeable site on the auxiliary cluster; two SAM are consumed per ms2i6A
    formed.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  significance: Determines how ms2i6A formation is coupled to cellular sulfur trafficking and Fe-S
    biogenesis.
  resolution: Isotope-labelled sulfur-donor reconstitution and in vivo labelling in sulfur-carrier
    mutants.
