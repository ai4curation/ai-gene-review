  - UniProtKB:P0AC69
  - UniProtKB:P63020
  review:
    summary: MiaB physically interacts with the monothiol glutaredoxin GrxD (P0AC69) and the Fe-S
      carrier NfuA (P63020); NfuA transfers its cluster to MiaB in vitro.
    action: REMOVE
    reason: 'Generic protein binding is uninformative. The interactions are real and biologically meaningful,
      but they describe Fe-S cluster delivery to MiaB as a client apoprotein: the activity in the interaction
      belongs to the carrier (NfuA cluster transfer), while MiaB is the acceptor. No more specific MiaB
      molecular function follows from the interaction data, so the row is removed rather than modified.
      Removal does not mean the interactions are false.'
    supported_by:
    - reference_id: PMID:23543739
      supporting_text: We show that GrxD and NfuA physically interact with MiaB with affinities
        compatible with an in vivo function.
    - reference_id: PMID:23543739
      supporting_text: We furthermore demonstrate that NfuA is able to transfer its cluster in vitro
        to MiaB, whereas GrxD is unable to do so.
