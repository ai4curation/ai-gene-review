- term:
    id: GO:1904047
    label: S-adenosyl-L-methionine binding
  evidence_type: ISS
  original_reference_id: PMID:15339930
  qualifier: enables
  review:
    summary: MiaB binds S-adenosyl-L-methionine at the unique iron of its radical SAM [4Fe-4S]
      cluster and cleaves it to 5'-deoxyadenosine; a second SAM supplies the methyl group of the
      methylthio product.
    action: NEW
    reason: >-
      Not in GOA. Added per the RADICAL_SAM treatment rule (SAM binding is a core cosubstrate-binding
      function of every radical SAM enzyme whose catalysis is established) and for consistency with the
      human MiaB-subfamily ortholog CDK5RAP1, where the same row was added by ISS from this very paper.
      This is a molecular function, so the participation test is met directly: MiaB itself binds and turns
      over SAM. Purified MiaB reconstituted in vitro converts one AdoMet to 5'-deoxyadenosine and uses
      a second as methyl donor (PMID:15339930). Coded ISS rather than IDA deliberately: the cached record
      of PMID:15339930 is abstract-only and names no source organism, UniProt P0AEI1 does not cite that
      paper at all (its experimental references are PMID:10572129 and PMID:11882645), and PubMed indexes
      it under both Escherichia coli Proteins and Thermotoga maritima, so the reconstituted protein cannot
      be shown from the accessible text to be the E. coli enzyme. What is established for E. coli MiaB
      specifically is the [4Fe-4S] cluster and its requirement for activity (PMID:11882645), together
      with UniProt's curated note of an exchangeable SAM on that cluster; SAM binding follows for this
      protein by similarity to the characterised enzyme. Upgrade to IDA if the full text confirms the
      organism. Comparator check, against GOA rather than against this project's own proposals: GOA does
      annotate GO:1904047 to radical SAM enzymes in exactly this role, by UniRule -- ECOLI/queE (UR000100349),
      ECOLI/moaA and PSEPK/moaA (UR000101305), METEA/pqqE and PSEPK/pqqE (UR000098303). So the absence
      here is patchy UniRule coverage, which rules happen to carry the term, not a GO convention against
      annotating a radical SAM enzyme's own cosubstrate. That is also why those five genes have an existing
      row to ACCEPT or MODIFY while this one needs a NEW row.
