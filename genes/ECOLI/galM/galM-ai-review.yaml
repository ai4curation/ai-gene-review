suggested_questions:
- question: >-
    Does the periplasmic pool of unprocessed GalM reported by Bouffard et al. reflect
    a real export route or leakage during fractionation, and does it contribute to
    mutarotation of periplasmic sugars such as maltose or lactose?
- question: >-
    How much do the other substrates (L-arabinose, D-xylose, maltose, D-glucose)
    depend on GalM in vivo, given that the galETKM operon is induced by galactose?
suggested_experiments:
- experiment_type: subcellular fractionation
  description: >-
    Fractionate wild-type and galM-deleted E. coli K-12 expressing GalM at native
    levels, with cytoplasmic (e.g. GroEL) and periplasmic (e.g. MalE) marker
    controls, to test whether endogenous GalM has a genuine periplasmic pool.
- experiment_type: growth and metabolite assay
  description: >-
    Compare growth and intracellular alpha- and beta-galactose levels of wild-type,
    galM deletion and catalytic-site (H175A or E309A) mutant strains on lactose,
    galactose, arabinose and xylose, to define which carbon sources need GalM
    activity in vivo.
