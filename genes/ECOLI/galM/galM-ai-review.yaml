core_functions:
- description: >-
    Galactose mutarotase (aldose 1-epimerase) that interconverts the beta- and
    alpha-anomers of D-galactose in the cytoplasm. It converts the beta-D-galactose
    released from lactose by beta-galactosidase into alpha-D-galactose, the substrate
    of galactokinase, and so carries out the first step of the Leloir pathway encoded
    by the galETKM operon.
