- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  supporting_entities:
  - PANTHER:PTN000009643
  - UniProtKB:P0A9C3
  review:
    summary: >-
      Phylogenetic inference that members of this aldose 1-epimerase clade act in the
      cytoplasm, seeded by E. coli GalM itself.
    action: ACCEPT
    reason: >-
      GalM is not processed for export, unlike the secreted mutarotases of some other
      bacteria, and the reaction it serves links cytoplasmic beta-galactosidase to
      cytoplasmic galactokinase. Cytoplasm is therefore where the activity acts. A
      periplasmic pool has been reported (PMID:7966338), but no evidence that the
      enzyme functions there. No E. coli assay resolves cytosol from the rest of the
      cytoplasm for GalM, so the row stays at cytoplasm.
    supported_by:
    - reference_id: PMID:7966338
      supporting_text: >-
        the in vivo formation of alpha-D-galactopyranose (the substrate for
        phosphorylation) from beta-D-galactopyranose (generated by beta-galactosidase
        hydrolysis of lactose) is largely dependent upon the presence of the
        mutarotase
