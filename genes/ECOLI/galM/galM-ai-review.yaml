id: P0A9C3
gene_symbol: galM
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  galM encodes aldose 1-epimerase (galactose mutarotase, type-1 mutarotase, EC
  5.1.3.3), the fourth and last cistron of the galETKM operon of Escherichia coli
  K-12. The 346-residue protein belongs to the aldose epimerase (galactose
  mutarotase-like, beta-sandwich) family and catalyses the interconversion of the
  alpha- and beta-anomers of aldoses at C1. Substrates include D-galactose, D-glucose,
  L-arabinose, D-xylose, maltose and lactose. Its physiological role is to supply
  alpha-D-galactose, the anomer that galactokinase (GalK) phosphorylates, from the
  beta-D-galactose released when beta-galactosidase hydrolyses lactose. This makes it
  the first step of the Leloir pathway of galactose utilization. Although sugar
  anomers equilibrate spontaneously in water, in vivo formation of alpha-D-galactose
  from lactose-derived beta-D-galactose depends largely on GalM, and efficient lactose
  metabolism requires the enzyme. GalM has no cleavable signal sequence and acts in
  the cytoplasm, although an unprocessed fraction has been reported in the periplasm
  and, on overexpression, in the culture medium.
