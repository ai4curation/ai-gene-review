taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: MetE is the cobalamin-independent methionine synthase of Escherichia coli K-12. This soluble
  zinc enzyme transfers a methyl group directly from polyglutamyl methyltetrahydrofolate to homocysteine,
  producing methionine and regenerating tetrahydrofolate. Its folate substrate requirement distinguishes
  it from the monoglutamate reaction of MetH. Oxidative glutathionylation at Cys645 can reversibly inhibit
  the enzyme and limit methionine synthesis under the tested stress conditions.
