proposed_new_terms:
- proposed_name: undecaprenyl phosphate biosynthetic process
  proposed_definition: The chemical reactions and pathways resulting in the formation of undecaprenyl
    phosphate (C55-P, bactoprenyl phosphate), the polyprenyl phosphate lipid carrier on which bacterial
    cell-envelope glycans are assembled, by dephosphorylation of undecaprenyl diphosphate made de novo
    or released after glycan transfer.
  justification: GO has a dedicated term for the eukaryotic counterpart, GO:0043048 dolichyl monophosphate
    biosynthetic process ("the formation of dolichyl monophosphate, a phosphorylated dolichol derivative"),
    but none for undecaprenyl phosphate. UppS and UppP are currently annotated to GO:0016094 polyprenol
    biosynthetic process, whose definition covers polyprenols rather than their phosphates. Modelled on
    GO:0043048.
  proposed_parent:
    id: GO:0008654
    label: phospholipid biosynthetic process
  supported_by:
  - reference_id: PMID:15778224
    supporting_text: due to the depletion of the pool of undecaprenyl phosphate and consequent arrest
      of cell wall synthesis
suggested_questions:
- question: With all known E. coli C55-PP phosphatases acting on the periplasmic side, how is C55-PP made
    de novo by cytosolic UppS dephosphorylated, and is BacA also a C55-P flippase?
suggested_experiments:
- description: Reconstitute BacA in proteoliposomes with defined C55-PP orientation and measure dephosphorylation
    and transbilayer movement of C55-P to test whether BacA couples hydrolysis with flipping.
