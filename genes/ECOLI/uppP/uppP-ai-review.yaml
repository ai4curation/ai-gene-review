taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: UppP (BacA) is the principal undecaprenyl-diphosphate phosphatase of Escherichia coli, a
  seven-transmembrane inner-membrane enzyme that hydrolyzes undecaprenyl diphosphate (C55-PP) to undecaprenyl
  phosphate (C55-P), the lipid carrier for peptidoglycan and other cell-envelope glycans. BacA accounts
  for about 75% of the membrane C55-PP phosphatase activity; its conserved active-site residues (Glu21,
  Ser27, Arg174) sit in periplasmic loops, and it requires Mg2+ or Ca2+. It overlaps with the PAP2-family
  phosphatases PgpB, YbjG and LpxT, and its overexpression confers bacitracin resistance by enlarging
  the C55-P pool that bacitracin depletes by sequestering C55-PP.
