- term:
    id: GO:0016094
    label: polyprenol biosynthetic process
  evidence_type: IDA
  original_reference_id: PMID:15138271
  qualifier: involved_in
  review:
    summary: BacA performs the step that forms the C55-P carrier from C55-PP.
    action: NEW
    reason: 'BacA itself catalyzes the dephosphorylation that turns UppS-made C55-PP into the usable C55-P
      carrier: the purified enzyme hydrolyzes C55-PP, its disruption removes about 75% of membrane C55-PP
      phosphatase activity, and loss of BacA together with the PAP2 phosphatases depletes C55-P. It therefore
      does part of the work of carrier synthesis. This is the process GO already uses for UppS (GO:0016094,
      accepted on the ispU review). GO:0016094 is defined as formation of "polyprenols, prenols with more
      than 4 isoprenoid residues". A dedicated term is proposed in proposed_new_terms ("undecaprenyl phosphate
      biosynthetic process", modelled on GO:0043048 dolichyl monophosphate biosynthetic process); GO:0016094
      is used until it exists.'
    supported_by:
    - reference_id: PMID:15138271
      supporting_text: the purified BacA protein exhibited undecaprenyl pyrophosphate phosphatase activity
        but not undecaprenol phosphokinase activity.
    - reference_id: PMID:15778224
      supporting_text: due to the depletion of the pool of undecaprenyl phosphate and consequent arrest
        of cell wall synthesis
