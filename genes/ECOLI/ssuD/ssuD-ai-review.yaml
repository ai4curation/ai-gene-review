- term:
    id: GO:0009408
    label: response to heat
  evidence_type: IMP
  original_reference_id: PMID:24580753
  qualifier: acts_upstream_of_or_within
  review:
    summary: SsuD contributes to survival after heat shock in a native deletion screen.
    action: KEEP_AS_NON_CORE
    reason: 'Full PMID:24580753 Figure 5A explicitly includes ssuD: its deletion reduces heat survival,
      with complementation restoring survival near wild type while the oxidative/osmotic controls differ.
      The figure was inspected directly and retained in source-analysis. This supports a contextual heat-response
      annotation, not a new heat-protection catalytic mechanism or the core purpose of sulfonate oxidation.'
    supported_by:
    - reference_id: PMID:24580753
      supporting_text: For both thermotolerance and osmotic stress resistance, expressing the deleted
        genes from a plasmid reversed the phenotype of all mutants; average survival was 93.3% and 91.7%
        of the wild type for the 23 and 6 complemented mutants, respectively (compared with average 37.4%
        and 67.4% for the deletion mutants) (Figure 5A, B).
    - reference_id: file:ECOLI/ssuD/ssuD-source-analysis/README.md
      supporting_text: The ssuD mutant is the fourth labeled deletion after wild type (following clpS,
        oppA and tig).
