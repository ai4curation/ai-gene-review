  review:
    summary: SsuD forms the homotetrameric monooxygenase assembly.
    action: ACCEPT
    reason: PMID:10480865 reports native homotetrameric SsuD, and the independent structure PMID:12445781
      resolves intersubunit contacts. These support self-association, assembly and complex membership;
      the complex term is not interpreted as a fixed SsuD–SsuE heteromeric stoichiometry.
    supported_by:
    - reference_id: PMID:12445781
      supporting_text: 'The X-ray crystal

        structure of SsuD shows a homotetrameric state for the enzyme, each subunit

        being composed of a TIM-barrel fold enlarged by four insertion regions that

        contribute to intersubunit interactions.'
