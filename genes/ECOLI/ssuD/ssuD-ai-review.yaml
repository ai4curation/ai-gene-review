id: P80645
gene_symbol: ssuD
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: SsuD is the FMNH2-dependent alkanesulfonate monooxygenase of Escherichia coli. It uses reduced
  flavin and molecular oxygen to cleave diverse aliphatic sulfonates into the corresponding aldehydes
  and sulfite, supplying sulfur for assimilation during sulfate or cysteine limitation. SsuD forms a homotetramer
  and interacts with the flavin reductase SsuE; the efficiency of reduced-flavin transfer depends on protein
  interactions and assay conditions. Loss of ssuD also compromises heat-shock survival in a native deletion
  screen, a contextual role distinct from its established desulfonation chemistry.
