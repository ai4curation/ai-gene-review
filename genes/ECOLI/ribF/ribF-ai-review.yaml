id: P0AG40
gene_symbol: ribF
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: ribF (b0025) of Escherichia coli K-12 encodes the bifunctional riboflavin kinase/FMN adenylyltransferase
  RibF. Its C-terminal flavokinase domain phosphorylates riboflavin to FMN, and its N-terminal FAD synthetase
  domain adenylylates FMN to FAD, so the one cytoplasmic protein supplies both flavin cofactors from riboflavin.
  It is the only FAD synthetase in E. coli and is an essential gene product. Its activities are assigned
  from the characterised Corynebacterium ammoniagenes and Bacillus subtilis orthologues; the E. coli protein
  is also one of the experimental seeds of the PAINT riboflavin kinase node.
