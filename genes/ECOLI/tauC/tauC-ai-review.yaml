id: Q47539
gene_symbol: tauC
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  TauC is the polytopic inner-membrane permease of the Escherichia coli TauABC
  taurine importer. Two TauC subunits, each with seven transmembrane helices,
  form the translocation pathway; they receive taurine from the periplasmic
  binding protein TauA and are powered by the cytoplasmic ATPase TauB. The
  tauABCD operon is expressed under sulfate or cysteine starvation and is
  required for growth on taurine as the sole sulfur source; TauABC also imports
  several other short sulfonates. TauC is about one-third identical to SsuC,
  the permease of the alkanesulfonate importer, but the two cannot replace each
  other.
