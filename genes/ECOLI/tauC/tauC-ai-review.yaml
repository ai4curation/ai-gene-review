- term:
    id: GO:0042918
    label: alkanesulfonate transmembrane transport
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: involved_in
  supporting_entities:
  - ARBA:ARBA00034185
  review:
    summary: TauABC also imports several non-taurine alkanesulfonates.
    action: KEEP_AS_NON_CORE
    reason: >-
      The ARBA source is not used as support. Independently, the deletion
      study shows that besides taurine TauABC imports PIPES, isethionate,
      3-aminopropanesulfonate, butanesulfonate and other sulfonates that SsuABC
      also carries. Alkanesulfonate transport is therefore as precise as the
      evidence allows for this broader capability, which is secondary to
      taurine import (GO:0015734, the core process). The same action is taken
      for TauB.
    supported_by:
    - reference_id: file:publications/url_https___pmc.ncbi.nlm.nih.gov_articles_PMC101965_.md
      supporting_text: Some sulfonates were taken up via both the TauABC and the SsuABC systems.
