    action: MODIFY
    reason: CheR does not relay the signal from receptors to the motor; it covalently modifies receptors
      so that their signaling output returns to prestimulus levels during sustained stimulation (sensory
      adaptation). GO:0023058 adaptation of signaling pathway, "the regulation of a signal transduction
      pathway in response to a stimulus upon prolonged exposure to that stimulus", describes this role
      precisely. Replace accordingly.
