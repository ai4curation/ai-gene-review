id: P07364
gene_symbol: cheR
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: CheR is the chemoreceptor methyltransferase of the Escherichia coli chemotaxis adaptation
  system, a 286-aa soluble S-adenosylmethionine-dependent enzyme with a small N-terminal helical domain
  and a larger C-terminal Rossmann-like SAM-binding domain carrying a beta-subdomain. CheR transfers methyl
  groups from S-adenosylmethionine to specific glutamyl residues in the cytoplasmic domains of methyl-accepting
  chemotaxis proteins (Tar, Tsr, Trg, Tap), forming glutamyl 5-methyl esters (EC 2.1.1.80). It docks on
  the C-terminal NWETF pentapeptide of the high-abundance receptors Tar and Tsr, a site distinct from
  the methylation sites, which tethers the enzyme to receptor arrays and allows it to methylate neighbouring
  receptors, including low-abundance receptors that lack the pentapeptide. Opposing CheB-mediated demethylation,
  CheR methylation resets receptor signaling output during sustained stimulation (sensory adaptation);
  cheR mutants cannot adapt, swim smoothly and are non-chemotactic.
