  evidence_type: IMP
  original_reference_id: PMID:365357
  qualifier: acts_upstream_of_or_within
  review:
    summary: 'Goy et al. 1978: cheX (cheR) mutants carry out sensory excitation but fail to adapt and
      are defective in the chemotaxis protein methylation reaction.'
    action: ACCEPT
    reason: CheR is the enzyme that catalyses chemoreceptor glutamate methylation, so it directly participates
      in protein methylation; the mutant phenotype is consistent with that. GO has no current descendant
      for peptidyl-glutamate methylation (the peptidyl-glutamic acid methylation terms are obsolete),
      so protein methylation is as specific as the BP branch allows.
    supported_by:
    - &id008
      reference_id: PMID:365357
      supporting_text: These mutants are also defective in the ability to carry out a protein methylation
        reaction which has previously been implicated in the adaptation process
