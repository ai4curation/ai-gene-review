id: P75817
gene_symbol: rlmC
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: RlmC (RumB/YbjF) is the Escherichia coli K-12 SAM-dependent enzyme assigned to C5 methylation
  of uridine 747 in 23S rRNA. Native gene disruption specifically eliminates m5U747, whereas recombinant
  preparations in the original study were inactive on the tested transcripts and unmethylated 23S rRNA.
  The physiological substrate state and the cause of that in-vitro inactivity remain unresolved. RlmC
  belongs to the RNA m5U methyltransferase family but differs in site specificity from RlmD (23S U1939)
  and TrmA (tRNA U54 and tmRNA U341). Its catalytic cysteine and Fe-S-binding features are curated sequence-based
  inferences, not direct RlmC mechanistic measurements.
