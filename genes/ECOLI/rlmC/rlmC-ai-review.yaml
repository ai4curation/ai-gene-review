core_functions:
- description: SAM-dependent C5 methylation of 23S rRNA U747. The native gene-disruption result establishes
    site specificity; purified-enzyme substrate requirements, catalytic-residue behavior and the role
    of the inferred Fe-S cluster remain experimentally unresolved for RlmC.
  molecular_function:
    id: GO:0070041
    label: rRNA (uridine-C5-)-methyltransferase activity
  directly_involved_in:
  - id: GO:0070475
    label: rRNA base methylation
  supported_by:
  - reference_id: PMID:12907714
    supporting_text: Comparison of the methylation patterns in 23S rRNAs from YbjF(+) and YbjF(-) strains
      showed that the latter differed only in the lack of the m(5)U747 modification
  - reference_id: PMID:12907714
    supporting_text: We were unable to generate a recombinant version of YbjF that retained in vitro activity,
      so the function of this enzyme was defined in vivo by engineering a ybjF knockout strain
suggested_questions:
- question: Which RNA or ribonucleoprotein state supports active RlmC, and did the original recombinant
    purification inactivate the enzyme rather than omit a required substrate state?
- question: Can the HAMAP-inferred RlmC [4Fe-4S] cluster and its ligands be verified directly, and does
    it affect folding, RNA binding or another property? RlmD redox data alone do not answer this.
- question: Under which conditions, if any, does loss of m5U747 alter ribosome function or fitness beyond
    the negative rich/minimal competition results in PMID:12907714?
suggested_experiments:
- description: Compare RlmC preparations with measured Fe-S occupancy and folding against defined 23S
    transcripts, full-length rRNA and assembly particles, using site-resolved mass spectrometry and inactive-enzyme
    controls. A negative assay should be distinguished from loss of enzyme integrity.
