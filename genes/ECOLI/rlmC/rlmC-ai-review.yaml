- id: PMID:12907714
  title: Identifying the methyltransferases for m(5)U747 and m(5)U1939 in 23S rRNA using MALDI mass spectrometry.
  findings:
  - statement: Native rlmC disruption eliminates m5U747 without changing the other observed rRNA methylation
      sites.
    supporting_text: Comparison of the methylation patterns in 23S rRNAs from YbjF(+) and YbjF(-) strains
      showed that the latter differed only in the lack of the m(5)U747 modification
  - statement: Failure of recombinant preparations leaves the physiological substrate state and activity-loss
      mechanism unresolved.
    supporting_text: We were unable to generate a recombinant version of YbjF that retained in vitro activity,
      so the function of this enzyme was defined in vivo by engineering a ybjF knockout strain
  - statement: No competitive growth disadvantage was detected in the reported rich and minimal media;
      this is not universal dispensability.
    supporting_text: in competition experiments run in rich and minimal media, we have not been able to
      detect any growth disadvantage for ybjF ( rumB ) knockout strains compared to the wild type
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text read after normal recovery. Direct native YbjF/RlmC mutant mass spectra establish
      U747 specificity; recombinant activity was not recovered. The paper reports negative competition-growth
      results under its tested rich/minimal conditions.
- id: PMID:21824914
  title: A single methyltransferase YefA (RlmCD) catalyses both m5U747 and m5U1939 modifications in Bacillus
    subtilis 23S rRNA.
  findings:
  - statement: In B. subtilis, a single COG2265 enzyme (YefA/RlmCD) catalyzes both m5U747 and m5U1939
      modifications, whereas E. coli uses separate enzymes RlmC and RlmD for these two sites.
    supporting_text: methylation of U747 and U1939 in B. subtilis rRNA is catalysed by a single enzyme,
      YefA that is a COG2265 member
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Bacillus subtilis RlmCD dual-site evidence is a comparative boundary, not a direct E.
      coli RlmC activity or universal bacterial distribution claim.
- id: PMID:21051506
  title: Specificity shifts in the rRNA and tRNA nucleotide targets of archaeal and bacterial m5U methyltransferases.
  findings:
  - statement: RNA m5U methyltransferases arose in Bacteria and spread to Archaea and Eukaryota by horizontal
      gene transfer. The COG2265 enzymes have undergone target specificity shifts during evolution.
    supporting_text: The RNA m(5)U methyltransferases appear to have arisen in Bacteria and were then
      dispersed by horizontal transfer of an rlmD-type gene to the Archaea and Eukaryota
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Comparative RNA m5U specificity study; substrate preferences of homologs cannot automatically
      be assigned to RlmC.
- id: PMID:30388185
  title: Unveiling the structural features that determine the dual methyltransferase activities of Streptococcus
    pneumoniae RlmCD.
  findings:
  - statement: Structural analysis of S. pneumoniae RlmCD in complex with U747-containing and U1939-containing
      RNA substrates reveals how the dual-specificity enzyme discriminates between the two substrates,
      providing insight into the dedicated specificity of E. coli RlmC for U747.
    supporting_text: RlmC is the dedicated enzyme for m5U747 in Escherichia coli
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Streptococcus pneumoniae RlmCD structural study informs dual-site specificity; its two-site
      activity is not assigned to E. coli RlmC.
- id: PMID:15181002
  title: 'Redox reactions of the iron-sulfur cluster in a ribosomal RNA methyltransferase, RumA: optical
    and EPR studies.'
  findings:
  - statement: RumA/RlmD provides the experimentally established Fe-S comparator; RlmC retains a separate
      curated sequence inference.
    supporting_text: An unprecedented [4Fe-4S] iron-sulfur cluster was found in RumA, the enzyme that
      methylates U1939 in Escherichia coli 23 S ribosomal RNA
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text read. Experimental optical/EPR and redox work is on RumA/RlmD; RumB is a sequence-search
      probe. Use only as comparative mechanistic evidence, not a direct RlmC assay.
- id: PMID:17459887
  title: Amino acid residues of the Escherichia coli tRNA(m5U54)methyltransferase (TrmA) critical for
    stability, covalent binding of tRNA and enzymatic activity.
  findings:
  - statement: Conserved residues in the COG2265 catalytic domain are shared across TrmA, RumA/RlmD, and
      RumB/RlmC, supporting modular evolution with a conserved catalytic domain combined with different
      RNA-binding domains.
    supporting_text: the amino acids F188, Q190, G220, D299, R302, C324 and E358, conserved in the C-terminal
      catalytic domain of several RNA(m5U)methyltransferases of the COG2265 family, are important for
      the formation of the TrmA-tRNA intermediate and/or the enzymatic activity
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text read for the TrmA comparator. Catalytic-residue experiments are on TrmA, not
      RlmC; target residue assignments require explicit inference.
