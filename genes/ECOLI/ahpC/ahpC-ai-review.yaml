suggested_questions:
- question: >-
    Should GO:0102039 NADH-dependent peroxiredoxin activity (EC 1.11.1.26) be
    annotated with `enables` to the peroxide-reducing AhpC subunit, as the EXP
    row from PMID:11717276 and the UniProt EC assignment do, or only as
    `contributes_to` for both AhpC and AhpF, with AhpC itself carrying
    GO:0051920 peroxiredoxin activity?
- question: >-
    Through which oxidation-sensitive step does AhpC support enterobactin
    biosynthesis: protection of EntC, of an upstream chorismate-pathway enzyme,
    or of iron-sulfur or metal cofactors?
suggested_experiments:
- description: >-
    Compare enterobactin and 2,3-dihydroxybenzoate output in delta-ahpC
    complemented with wild-type AhpC, a C47S peroxidatic-cysteine mutant, or
    a heterologous peroxide scavenger (for example katG overexpression), with
    and without anaerobic growth.
  experiment_type: Genetic complementation with catalytic mutants
  hypothesis: >-
    The enterobactin defect of ahpC mutants results from loss of peroxide
    scavenging, so any efficient H2O2 scavenger, but not AhpC C47S, restores
    siderophore production.
