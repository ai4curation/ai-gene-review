  review:
    summary: Seaver and Imlay showed genetically, with katG and katE, that the AhpCF system
      scavenges H2O2 in catalase-null cells. AhpC is the peroxide-reducing subunit, so peroxidase
      activity is correct but general.
    action: MODIFY
    reason: Peroxidase activity is true for AhpC, but the review already supports the more
      specific descendant GO:0051920 peroxiredoxin activity (thiol-based, AhpC/Prx1 family,
      Cys47/Cys166 intersubunit disulfide). Per the refinement rule, the general parent is
      refined to the peroxiredoxin term that the gene already carries. The genetic evidence
      itself is sound.
    proposed_replacement_terms:
    - id: GO:0051920
      label: peroxiredoxin activity
    supported_by:
