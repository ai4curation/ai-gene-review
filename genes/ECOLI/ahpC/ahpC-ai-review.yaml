- term:
    id: GO:0102039
    label: NADH-dependent peroxiredoxin activity
  evidence_type: EXP
  original_reference_id: PMID:11717276
  qualifier: enables
  review:
    summary: >-
      Seaver and Imlay showed in vivo that the AhpC/AhpF system is the primary
      scavenger of endogenous H2O2 and that its turnover is limited by NADH
      supply. The NADH-dependent reaction (EC 1.11.1.26) is a property of the
      AhpC/AhpF pair: AhpC reduces the peroxide and AhpF consumes NADH.
    action: MODIFY
    reason: >-
      The biology is not in doubt; the issue is which gene product the
      molecular function should name. GO:0102039 (a hydroperoxide + NADH + H+ =
      an alcohol + NAD+ + H2O) includes NADH oxidation, which AhpF catalyzes,
      not AhpC. Following the PSEPK ahpC precedent and the ECOLI AhpF review
      (which records GO:0102039 as contributes_to for AhpF), AhpC's own activity
      is refined to its parent GO:0051920 peroxiredoxin activity, and the core
      function records that AhpC contributes to GO:0102039. Whether GO prefers
      the whole-system term on the peroxide-attacking subunit is raised as a
      suggested question rather than settled here.
    proposed_replacement_terms:
    - id: GO:0051920
      label: peroxiredoxin activity
    supported_by:
    - reference_id: file:ECOLI/ahpC/ahpC-uniprot.txt
      supporting_text: The disulfide is subsequently reduced by AhpF.
    - reference_id: PMID:11717276
      supporting_text: >-
        This arrangement is reasonable because the cell cannot provide enough NADH for Ahp to rapidly degrade large amounts of H 2 O 2 .
    - reference_id: PMID:28270505
      supporting_text: >-
        AhpF is a flexible multidomain protein that enables a series of electron transfers among the redox centers by accepting reducing equivalents from NADH.
