    reason: Full PMID:23042987 establishes a specific physiological connection to early enterobactin
      production. It does not identify the biochemical step performed by AhpC. The cysteine-mutant
      experiments show that peroxide-detoxification activity alone is insufficient, so a simple
      indirect peroxide-protection explanation is not established either. The authors consider
      chorismate availability and direct or indirect FMN reduction for chorismate synthesis,
      while noting that EntC itself has no known redox cofactor. Retain uncertainty about
      the precise biosynthetic participation; neither a confident rejection nor a new FMN-reductase
      assertion is warranted.
