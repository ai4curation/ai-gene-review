suggested_questions:
- question: How should the coupled AhpC/AhpF NADH-dependent peroxiredoxin reaction be represented
    alongside the experimentally separated peroxide-reduction and donor-regeneration activities
    in GO-CAM, while preserving the native donor-partner specificity?
- question: 'What biochemical contribution of AhpC supports early enterobactin production
    and distinguishes the resolving-cysteine mutant iron phenotype from peroxide resistance:
    maintenance of chorismate supply, a separate redox reaction, or another interaction?'
suggested_experiments:
- description: Reconstitute chorismate synthesis and EntC-dependent DHB production with defined
    flavin cofactors, AhpC/AhpF, wild-type and resolving-cysteine AhpC variants, and a matched
    independent peroxide-scavenging control. Quantify reduced FMN, chorismate and DHB separately,
    and test whether the in vitro result explains the BW25113 iron-limitation phenotype.
  experiment_type: Biochemical reconstitution and matched genetic complementation
  hypothesis: AhpC may support chorismate supply through a redox contribution distinguishable
    from peroxide scavenging; the existing cysteine-mutant results do not establish the relevant
    reaction.
