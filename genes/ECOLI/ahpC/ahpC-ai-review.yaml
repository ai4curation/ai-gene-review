id: P0AE08
gene_symbol: ahpC
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  ahpC encodes AhpC, the typical 2-Cys peroxiredoxin (AhpC/Prx1 subfamily)
  subunit of the E. coli AhpC/AhpF alkyl hydroperoxide reductase. AhpC forms
  ring-shaped decamers of head-to-tail dimers in the cytosol. Its peroxidatic
  cysteine (Cys47) attacks hydrogen peroxide or an organic hydroperoxide,
  releasing water or the corresponding alcohol, and the resulting sulfenic acid
  condenses with the resolving cysteine (Cys166) of the partner subunit to form
  an intersubunit disulfide. The flavoprotein AhpF reduces this disulfide with
  electrons from NADH, so the AhpC/AhpF pair carries out NADH-dependent
  hydroperoxide reduction. Because AhpC acts efficiently at very low peroxide
  concentrations, it is the main scavenger of endogenously generated hydrogen
  peroxide during aerobic growth, while catalase HPI (KatG) dominates at high
  peroxide levels. ahpCF is part of the OxyR peroxide-stress regulon, and loss
  of ahpC causes hypersensitivity to alkyl hydroperoxides.
