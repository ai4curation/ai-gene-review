  review:
    summary: In E. coli BW25113, ahpC deletion lowers DHB and enterobactin production and
      impairs growth under iron limitation. Extra entC, DHB, shikimate or aromatic end products
      suppress aspects of the phenotype. A resolving-cysteine mutant separates peroxide resistance
      from the iron phenotype.
