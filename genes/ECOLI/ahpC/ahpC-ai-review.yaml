  title: UniProt record for Escherichia coli K-12 ahpC (P0AE08)
  findings:
  - statement: >-
      Curated function, catalytic activity (EC 1.11.1.26, PubMed:11717276),
      decameric subunit structure and Cys47-Cys166 interchain disulfide.
core_functions:
- description: >-
    AhpC is the peroxide-reducing peroxiredoxin subunit of the AhpC/AhpF alkyl
    hydroperoxide reductase. In the cytosol, its peroxidatic Cys47 reduces
    hydrogen peroxide and organic hydroperoxides to water and alcohols, forming
    an intersubunit disulfide with Cys166 that AhpF reduces with NADH. Together
    the pair carries out NADH-dependent peroxide reduction and is the main
    scavenger of endogenous hydrogen peroxide in E. coli.
  supported_by:
  - reference_id: file:ECOLI/ahpC/ahpC-uniprot.txt
    supporting_text: >-
      Thiol-specific peroxidase that catalyzes the reduction of hydrogen
      peroxide and organic hydroperoxides to water and alcohols, respectively.
  - reference_id: file:ECOLI/ahpC/ahpC-uniprot.txt
    supporting_text: Is the primary scavenger for endogenously generated hydrogen peroxides.
  - reference_id: PMID:28270505
    supporting_text: >-
      Peroxide decomposition catalyzed by Ec AhpC in the presence of WT Ec AhpF or linker mutants were measured using the ferrous oxidation xylenol assay
  - reference_id: PMID:25372677
    supporting_text: >-
      its binding to EcAhpC was demonstrated by
      isothermal titration calorimetry.
