- term:
    id: GO:0102039
    label: NADH-dependent peroxiredoxin activity
  evidence_type: EXP
  original_reference_id: PMID:11717276
  qualifier: enables
  review:
    summary: 'Seaver and Imlay showed in vivo that the AhpC/AhpF system is the primary scavenger
      of endogenous H2O2 and that its turnover is limited by NADH supply. The NADH-dependent
      reaction (EC 1.11.1.26) is a property of the AhpC/AhpF pair: AhpC reduces the peroxide
      and AhpF consumes NADH.'
    action: ACCEPT
    reason: Native E. coli genetics and purified EcAhpC/EcAhpF reconstitution support the
      coupled NADH-dependent hydroperoxide-reduction reaction. AhpC performs peroxide reduction
      while AhpF oxidizes NADH and regenerates AhpC; this annotation is accepted for the experimentally
      established enzyme component without asserting that the isolated subunit performs both
      half-reactions. Core functions separately describe the individual chemistry and contribution
      to the overall activity. Ordinary GOA relationship strings are not used to turn this
      supported coupled-system claim into a biological mismatch.
    supported_by:
    - reference_id: file:ECOLI/ahpC/ahpC-uniprot.txt
      record_section:
      - CC:MISCELLANEOUS
      supporting_text: The disulfide is subsequently reduced by AhpF.
    - reference_id: PMID:11717276
      supporting_text: This arrangement is reasonable because the cell cannot provide enough
        NADH for Ahp to rapidly degrade large amounts of H 2 O 2 .
    - reference_id: PMID:28270505
      supporting_text: AhpF is a flexible multidomain protein that enables a series of electron
        transfers among the redox centers by accepting reducing equivalents from NADH.
