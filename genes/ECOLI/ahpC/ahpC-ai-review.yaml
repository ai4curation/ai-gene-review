      either directly or indirectly.
core_functions:
- description: AhpC is the peroxide-reducing peroxiredoxin subunit of the AhpC/AhpF alkyl
    hydroperoxide reductase. In the cytosol, its peroxidatic Cys47 reduces hydrogen peroxide
    and organic hydroperoxides to water and alcohols, forming an intersubunit disulfide with
    Cys166 that AhpF reduces with NADH. Together the pair carries out NADH-dependent peroxide
    reduction and is the main scavenger of endogenous hydrogen peroxide in E. coli.
  supported_by:
  - reference_id: file:ECOLI/ahpC/ahpC-uniprot.txt
    record_section:
    - CC:FUNCTION
    supporting_text: Thiol-specific peroxidase that catalyzes the reduction of hydrogen peroxide
      and organic hydroperoxides to water and alcohols, respectively.
  - reference_id: file:ECOLI/ahpC/ahpC-uniprot.txt
    record_section:
    - CC:FUNCTION
    supporting_text: Is the primary scavenger for endogenously generated hydrogen peroxides.
  - reference_id: PMID:28270505
    supporting_text: Peroxide decomposition catalyzed by Ec AhpC in the presence of WT Ec
      AhpF or linker mutants were measured using the ferrous oxidation xylenol assay
  - reference_id: PMID:25372677
    supporting_text: its binding to EcAhpC was demonstrated by isothermal titration calorimetry.
