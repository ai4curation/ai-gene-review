id: P12282
gene_symbol: moeB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  MoeB is the molybdopterin-synthase sulfur-carrier adenylyltransferase of Escherichia coli, an
  E1-like enzyme of the HesA/MoeB/ThiF family. As a homodimer it binds two MoaD sulfur-carrier
  subunits, forming a transient MoeB2-MoaD2 heterotetramer, and uses ATP to adenylate the
  carboxyl group of the MoaD C-terminal glycine (EC 2.7.7.80). The MoaD acyl-adenylate is then
  converted to a thiocarboxylate by a separate sulfurtransferase system (IscS-dependent), and the
  sulfur-loaded MoaD moves to MoaE to form active molybdopterin synthase. Unlike ubiquitin E1
  enzymes, MoeB forms no thioester with MoaD and does not itself carry sulfur. Each subunit binds
  a structural zinc ion through two cysteine pairs that are required for activity. MoeB is
  cytosolic; moeB (chlN) mutants are deficient in molybdenum cofactor and molybdoenzyme
  activities.
