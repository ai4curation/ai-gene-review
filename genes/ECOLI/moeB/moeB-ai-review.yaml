    action: REMOVE
    reason: >-
      GO:0004792 is "Catalysis of the reaction: thiosulfate + hydrogen cyanide = thiocyanate +
      sulfite + 2 H+". The PAINT IBD for this term at PTN000102040 is seeded only by SGD:S000001153
      (yeast Uba4), a two-domain protein whose C-terminal rhodanese domain carries the
