  label: Escherichia coli (strain K12)
description: SucA is the homodimeric, thiamine-diphosphate- and magnesium-dependent E1o component of the E. coli 2-oxoglutarate dehydrogenase complex. It decarboxylates 2-oxoglutarate and reductively succinylates the lipoyl arm of the SucB E2 core, initiating conversion of 2-oxoglutarate to succinyl-CoA in the tricarboxylic acid cycle.
