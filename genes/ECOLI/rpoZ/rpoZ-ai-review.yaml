- term:
    id: GO:0006879
    label: intracellular iron ion homeostasis
  evidence_type: NAS
  original_reference_id: PMID:12644513
  qualifier: involved_in
  review:
    summary: >-
      Intracellular iron ion homeostasis attributed to the omega subunit from a regulon-level
      source (NAS).
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      RNA polymerase transcribes every gene, so a complex-level statement that it
      transcribes a regulon does not make it part of that regulon's physiology. The
      specificity belongs to the FecI ECF sigma factor that directs transcription
      of the ferric citrate transport genes. The annotation is a downstream consequence,
      not participation by the core subunit.
    supported_by:
    - reference_id: PMID:12644513
      supporting_text: >-
        FecI, an extracytoplasmic-function sigma factor, is required for initiation
        of transcription of the ferric citrate transport genes.
- term:
    id: GO:0008023
    label: transcription elongation factor complex
  evidence_type: NAS
  original_reference_id: PMID:26132790
  qualifier: part_of
  review:
    summary: >-
      RNAP subunit annotated as part of a transcription elongation factor complex.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      GO:0008023 is defined as a complex that interacts with RNA polymerase to change
      its elongation rate. The core subunit is part of the polymerase that such factors
      bind, not of the factor complex itself. Membership in the RNAP complex is captured
      by GO:0000345. MARK_AS_OVER_ANNOTATED rather than REMOVE: RNAP is a component
      of the assemblies in which elongation factors act (for example the rrnTAC),
      so the claim overreaches the term's definition rather than being simply false.
    supported_by:
    - reference_id: PMID:26132790
      supporting_text: >-
        the core enzyme can elongate the RNA chain and terminate transcription guided
        only by nucleic acid signals in vitro
