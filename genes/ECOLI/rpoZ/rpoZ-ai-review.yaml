- term:
    id: GO:0031564
    label: transcription antitermination
  evidence_type: IDA
  original_reference_id: PMID:28452979
  qualifier: involved_in
  review:
    summary: >-
      The omega subunit is an integral part of processive antitermination complexes
      built on RNAP.
    action: KEEP_AS_NON_CORE
    reason: >-
      In lambda N- and rrn-type processive antitermination the regulators and Nus
      factors assemble on elongating RNAP, and RNAP itself is the termination-resistant
      machine that reads through terminators. UniProt records the subunit as part
      of the rrnTAC. Retained as a genuine but specialised, non-core context.
    supported_by:
    - reference_id: PMID:28452979
      supporting_text: >-
        host factors NusA, NusB, NusE and NusG, and an RNA nut site render elongating
        RNA polymerase termination-resistant.
    - reference_id: file:ECOLI/rpoZ/rpoZ-uniprot.txt
      supporting_text: >-
        Part of the processive rRNA transcription and antitermination complex (rrnTAC).
      record_section:
      - CC:FUNCTION
- term:
    id: GO:0032784
    label: regulation of DNA-templated transcription elongation
  evidence_type: NAS
  original_reference_id: PMID:26132790
  qualifier: involved_in
  review:
    summary: >-
      Regulation of elongation attributed to omega from elongation-factor literature.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The cited sources describe elongation factors (NusA, NusG, lambda N) acting
      on RNAP and pausing intrinsic to the active-centre subunits. No omega-specific
      role in modulating elongation is documented there; the complex-level annotation
      is propagated to an assembly subunit.
    supported_by:
    - reference_id: PMID:26132790
      supporting_text: >-
        the core enzyme can elongate the RNA chain and terminate transcription guided
        only by nucleic acid signals in vitro
