id: P0A800
gene_symbol: rpoZ
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  rpoZ (b3649) encodes the omega subunit of Escherichia coli DNA-directed RNA polymerase.
  Omega is a small subunit of the alpha2 beta beta' omega core that binds and latches
  the N- and C-terminal regions of beta-prime, prevents beta-prime aggregation, and
  promotes its incorporation into the alpha2 beta subassembly. It is not catalytic
  and is dispensable for basal polymerase activity, but its loss alters holoenzyme
  composition and sigma-factor competition.
