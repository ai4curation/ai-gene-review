id: P0AES4
gene_symbol: gyrA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: GyrA is the DNA-binding, cleavage-religation and DNA-wrapping subunit of Escherichia coli
  DNA gyrase. Two GyrA and two GyrB subunits form the active enzyme, which introduces negative supercoils
  and relieves positive torsional stress generated during DNA replication and transcription. GyrA supplies
  the catalytic tyrosines that transiently link to DNA; the partner GyrB subunits bind and hydrolyze ATP.
  Gyrase acts on chromosomal and plasmid DNA and is a target of quinolones and the CcdB toxin.
