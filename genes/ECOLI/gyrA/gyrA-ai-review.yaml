  review:
    summary: GyrA associates with chromosomal DNA during topological transactions.
    action: ACCEPT
    reason: The chromosome-associated location reflects a substrate-bound population of gyrase, not a
      claim that all molecules are permanently chromosome bound. Chromosomal supercoiling/segregation
      experiments support this association.
    supported_by:
    - reference_id: PMID:7952188
      supporting_text: 'Both proteins were located

        mainly in the cytoplasm, with typically less than 10% in the nucleoid.'
    - reference_id: PMID:6327603
