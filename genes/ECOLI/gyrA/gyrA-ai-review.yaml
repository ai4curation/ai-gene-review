- term:
    id: GO:2000104
    label: negative regulation of DNA-templated DNA replication
  evidence_type: IDA
  original_reference_id: PMID:9367775
  qualifier: involved_in
  review:
    summary: A CcdB-stabilized gyrase cleavage complex can obstruct polymerase progression.
    action: KEEP_AS_NON_CORE
    reason: 'The cited paper demonstrates toxin-stabilized DNA cleavage complexes that block polymerases.
      Retain the inhibition context as non-core: it depends on CcdB poisoning and does not establish GyrA
      as a normal negative regulator of chromosome replication. The abstract specifically describes transcription
      blockage, so quantitative replication effects are not inferred.'
    supported_by:
    - reference_id: PMID:9367775
      supporting_text: 'We

        conclude that CcdB can stabilise a cleavage complex between DNA gyrase and DNA

        in a manner distinct from quinolones but, like the quinolone-induced cleavage

        complex, the CcdB-stabilised complex can also form a barrier to the passage of

        polymerases.'
