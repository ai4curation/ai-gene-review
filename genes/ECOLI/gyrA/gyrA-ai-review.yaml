  review:
    summary: The reported GyrA interaction does not by itself define an informative molecular activity.
    action: REMOVE
    reason: This row reports interaction of GyrA with UniProtKB:P0AES6 in PMID:15690043. Bare protein
      binding is removed under the project policy, without denying the physical interaction. Assembly
      with its topoisomerase partner, toxin/inhibitor binding, or condensin association is interpreted
      in its own mechanistic context rather than transferring the partner’s activity to GyrA.
    supported_by:
    - reference_id: PMID:15690043
