    label: NAD+ synthase (glutamine-hydrolyzing) activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR003694
  review:
    summary: Wrong nitrogen donor; E. coli NadE is ammonia-dependent and lacks a glutaminase domain.
    action: REMOVE
    reason: >-
      The InterPro2GO mapping assigns the glutamine-hydrolyzing synthase to a signature shared by all
      NAD synthetases. The purified E. coli enzyme has only ammonia-dependent activity, and the 275-residue
      protein lacks the N-terminal nitrilase-like glutaminase domain of glutamine-dependent enzymes. The
      correct activity, GO:0008795, is already annotated.
    supported_by:
    - reference_id: PMID:8195100
      supporting_text: >-
        Glutamine-dependent NAD synthetase activity was found in crude extracts of E. coli but not in
        the purified enzyme, suggesting that it may be catalyzed by an additional subunit.
