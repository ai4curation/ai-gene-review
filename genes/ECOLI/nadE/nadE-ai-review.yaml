  label: Escherichia coli K-12
description: >-
  NadE is the ammonia-dependent NAD+ synthetase of Escherichia coli K-12, an essential homodimeric enzyme
  that catalyzes the final step of NAD+ synthesis: ATP-dependent amidation of deamido-NAD+ (nicotinate
  adenine dinucleotide, NaAD) with ammonia to give NAD+, AMP and diphosphate. The step is shared by the
  L-aspartate de novo route and Preiss-Handler salvage. Crystal structures show two NaAD/NAD sites at
  the dimer interface and an ATP site in each subunit, with magnesium-dependent rearrangements between
  catalytic and exchange states. The purified enzyme lacks glutamine-dependent activity; it is a compact
  single-domain synthetase without the glutaminase domain of NADSYN1-type enzymes. NadE is soluble and
  cytosolic.
