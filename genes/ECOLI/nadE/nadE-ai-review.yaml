    label: magnesium ion binding
  evidence_type: IDA
  original_reference_id: PMID:15699042
  qualifier: enables
  review:
    summary: >-
      Magnesium coordination seen in substrate and product complexes; a cofactor property of the synthetase.
    action: KEEP_AS_NON_CORE
    reason: >-
      Structures show differential magnesium coordination to NaAD and NAD, and the enzyme needs magnesium
      for activity, but metal binding supports rather than defines the function.
    supported_by:
    - reference_id: PMID:15699042
      supporting_text: which may be triggered by differential coordination of a magnesium ion to NAAD
        and NAD
    - reference_id: PMID:10544053
      supporting_text: The enzyme required approximately 1.5 mM magnesium for optimal activity.
- term:
