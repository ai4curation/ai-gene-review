id: P28631
gene_symbol: holB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: HolB is the delta-prime subunit of the Escherichia coli DNA polymerase III clamp loader.
  It organizes the loader and modulates access of the clamp-opening delta subunit to the beta clamp during
  the DnaX-driven ATPase cycle. Its function is a structural and regulatory contribution to clamp loading;
  it is neither the alpha polymerase nor the epsilon proofreading exonuclease.
