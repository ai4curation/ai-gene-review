- term:
    id: GO:0003677
    label: DNA binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR008921
  - InterPro:IPR015199
  review:
    summary: The clamp loader binds DNA, but the examined delta-prime evidence does not resolve an independent
      DNA-contacting activity of HolB.
    action: UNDECIDED
    reason: The clamp loader binds DNA, but the examined delta-prime evidence does not resolve an independent
      DNA-contacting activity of HolB. Do not substitute the direct delta/HolA DNA-cross-linking result
      for an assay of delta-prime.
    supported_by:
    - reference_id: PMID:15364574
    - &id001
      reference_id: PMID:9927437
      supporting_text: The delta' subunit acts as a modulator of the interaction between delta and beta.
- term:
    id: GO:0003689
    label: DNA clamp loader activity
  evidence_type: IDA
  original_reference_id: PMID:9927437
  qualifier: enables
  review:
    summary: Retain the experimentally characterized contribution to the assembled clamp loader.
    action: ACCEPT
    reason: Retain the experimentally characterized contribution to the assembled clamp loader. Delta
      opens beta and delta-prime regulates that interaction; DnaX supplies the ATPase cycle. The core
      therefore uses contributes_to_molecular_function and does not assign independent ATP-driven loading
      to this isolated subunit.
    supported_by:
    - *id001
    - reference_id: PMID:9927437
- term:
    id: GO:0003887
    label: DNA-directed DNA polymerase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - InterPro:IPR004622
  - InterPro:IPR015199
  - EC:2.7.7.7
  review:
    summary: The DNA-polymerizing reaction of the holoenzyme is performed by DnaE alpha.
    action: REMOVE
    reason: holB performs structural organization and regulation of the clamp loader; DNA polymerization
      is catalyzed by DnaE alpha. Holoenzyme nucleotide-incorporation assays and shared EC/Rhea labels
      do not establish that this individual subunit polymerizes DNA. Its actual molecular role is retained
      independently.
    supported_by: &id002
    - *id001
    - &id005
      reference_id: PMID:2997151
    - &id006
      reference_id: PMID:6393125
