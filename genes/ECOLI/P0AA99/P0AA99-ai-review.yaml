  label: Escherichia coli K-12
description: >-
  DpaA (formerly LdtF/YafK) is a periplasmic, Sec-exported YkuD-family cysteine
  enzyme that, despite its structural kinship to the L,D-transpeptidases, acts
  as a hydrolase rather than an acyl-transferase. It is a murein
  L,D-endopeptidase that cleaves the covalent amide bond joining Braun's
  lipoprotein (Lpp) to the meso-diaminopimelate of a peptidoglycan stem,
  detaching Lpp from the sacculus; it also has a glycine-specific
  carboxypeptidase activity on muropeptides bearing a terminal glycine. By
  erasing the outer-membrane-to-peptidoglycan tether it helps the cell cope
  with envelope stress. It is the experimentally characterized exemplar of the
  YafK/LdtF (PTHR36699:SF1) subfamily.
