suggested_questions:
- question: Is the physiological PaaF substrate the (2E) or (2Z) isomer of
    2,3-dehydroadipyl-CoA, and does this justify the (2E)-specific GO:0018812 term?
- question: Does association with PaaG change PaaF kinetics or channel the PaaG product
    to PaaF, or does it only provide proximity?
suggested_experiments:
- description: Purify E. coli PaaF (alone and as the PaaFG complex) and measure kinetics
    with enzymatically generated 2,3-dehydroadipyl-CoA and with crotonyl-CoA. Determine
    the double-bond geometry of the substrate by NMR.
