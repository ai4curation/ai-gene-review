id: P76082
gene_symbol: paaF
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  PaaF is the 2,3-dehydroadipyl-CoA hydratase of the aerobic, CoA-thioester-based
  ("box") phenylacetate catabolic pathway of Escherichia coli, encoded in the
  paaABCDEFGHIJK operon. In the beta-oxidation-like lower part of the pathway it
  reversibly hydrates the C6 dicarboxylic enoyl-CoA 2,3-dehydroadipyl-CoA, produced by
  PaaJ thiolysis and PaaG isomerization, to 3-hydroxyadipyl-CoA, the substrate of the
  PaaH dehydrogenase. PaaF is a crotonase-superfamily (enoyl-CoA hydratase/isomerase
  family) enzyme most similar to mitochondrial enoyl-CoA hydratase, with the two
  catalytic glutamates (Glu-109, Glu-129) conserved. It forms homotrimers that stack
  into a hexamer, which associates with two PaaG trimers to form a stable four-layered
  PaaF-PaaG hydratase-isomerase complex. paaF deletion mutants cannot grow on
  phenylacetate and accumulate delta3-dehydroadipate. Operon expression is repressed by
  PaaX and induced by phenylacetyl-CoA.
