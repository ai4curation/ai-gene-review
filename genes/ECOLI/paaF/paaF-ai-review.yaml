- term:
    id: GO:0004300
    label: enoyl-CoA hydratase activity
  evidence_type: IDA
  original_reference_id: PMID:20660314
  qualifier: enables
  review:
    summary: Core activity. PaaF hydrates 2,3-dehydroadipyl-CoA to 3-hydroxyadipyl-CoA
      in the phenylacetate pathway.
    action: ACCEPT
    reason: Teufel et al. showed that purified PaaF reversibly converts enzymatically
      generated 2,3-dehydroadipyl-CoA into 3-hydroxyadipyl-CoA. The methods state that
      the PaaF protein used was the Pseudomonas sp. strain Y2 ortholog, not E. coli
      PaaF. However, the supplementary methods are not cached and the activity is in any
      case well supported for E. coli PaaF. The E. coli PaaF crystal structure conserves
      the two catalytic glutamates of enoyl-CoA hydratase, and the E. coli paaF mutant
      accumulates the upstream intermediate. The function is accepted; the evidence-code
      concern is recorded as a probable source defect.
    supported_by:
    - reference_id: PMID:20660314
      supporting_text: This analysis identified PaaF as a 2,3-dehydroadipyl-CoA hydratase
    - reference_id: PMID:22961985
      supporting_text: The structurally equivalent residues in PaaF are Glu-109 and
        Glu-129, which suggests that the catalytic mechanism of PaaF is similar to ECH.
    - reference_id: PMID:12846838
      supporting_text: Incubation of the paaF and paaH mutants with phenylacetate yielded
        delta3-dehydroadipate and 3-hydroxyadipate, respectively.
    source_defects:
    - defect_type: WRONG_EVIDENCE_CODE
      resource: UNIPROT
      slot: Evidence_Code
      requested_change: CHECK
      asserted_value: ECO:0000314
      cause: OTHER
      confidence: PROBABLE
      explanation: >-
        PMID:20660314 (Teufel et al. 2010) states in its main-text methods that the
        PaaF used in the enzyme assays was the recombinant Pseudomonas sp. strain Y2
        protein, whereas only PaaZ and PaaH were from E. coli. A direct-assay (IDA)
        annotation to E. coli PaaF (P76082) therefore appears to rest on an ortholog
        assay and would be better coded as ISS/ISO with the Pseudomonas sp. Y2 PaaF as
        WITH/FROM, unless the supplementary material also assayed E. coli PaaF. The
        enzymatic function itself is not in dispute.
      supported_by:
      - reference_id: PMID:20660314
