- term:
    id: GO:0018812
    label: 3-hydroxyacyl-CoA dehydratase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000116
  qualifier: enables
  supporting_entities:
  - RHEA:16105
  review:
    summary: Rhea-derived child of enoyl-CoA hydratase activity specifying a (2E)-enoyl
      substrate; plausible but the stereochemistry of the physiological substrate is
      unresolved.
    action: KEEP_AS_NON_CORE
    reason: >-
      GO:0018812 is a subclass of GO:0004300 restricted to (2E)-enoyl-CoA. UniProt maps
      the PaaF activity to RHEA:16105, and canonical crotonase-family hydratases act on
      trans-2-enoyl-CoAs. However, Teufel et al. state that the configuration of the
      2,3-dehydroadipyl-CoA intermediate has not been determined. Their figure depicts
      it as cis, which would fall outside this term. The term is retained as plausible
      but not used as the core descriptor; GO:0004300 is used instead.
    supported_by:
    - reference_id: PMID:20660314
      supporting_text: Note also that the cis configuration of 2,3-dehydroadipyl-CoA (
        Fig. 1 B , compound VI) is hypothetical, because its stereochemistry has not yet
        been determined.
    - reference_id: file:ECOLI/paaF/paaF-uniprot.txt
