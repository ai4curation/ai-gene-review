- term:
    id: GO:0006635
    label: fatty acid beta-oxidation
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:94871
  - PANTHER:PTN000941828
  - RGD:61892
  - RGD:69330
  - UniProtKB:P30084
  review:
    summary: Family-level propagation of fatty acid beta-oxidation from mitochondrial
      enoyl-CoA hydratases (ECHS1) to the phenylacetate-pathway paralog.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The PAINT node groups PaaF with mitochondrial short-chain enoyl-CoA hydratases,
      and the chemistry is indeed beta-oxidation-like. However, GO:0006635 describes
      complete oxidation of a long-chain fatty acid. E. coli PaaF is encoded in the paa
      operon, acts on the C6 dicarboxylic intermediate 2,3-dehydroadipyl-CoA derived
      from the aromatic ring, and has an active site adapted to Paa-pathway
      intermediates rather than fatty acyl chains. It also does not form a FadBA-like
      beta-oxidation complex with PaaH and PaaJ. No experiment shows that PaaF
      contributes to fatty acid degradation in E. coli, which uses the FadB/FadJ
      multifunctional enzymes for this purpose. The term is not removed outright
      because crotonase-family hydratases often accept short acyl-CoAs in vitro.
    supported_by:
    - reference_id: PMID:22961985
      supporting_text: The active sites of PaaF and PaaG are adapted to accept the
        intermediary components of the Paa pathway, different from those of the fatty
        acid β-oxidation.
    - reference_id: PMID:22961985
      supporting_text: No complex between PaaF, PaaH, and PaaJ, equivalent to the fatty
        acid β-oxidation complex, was detected.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: PANTHER:PTN000941828
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          The node is seeded by mammalian mitochondrial enoyl-CoA hydratases, which
          do act in fatty acid beta-oxidation. E. coli PaaF retains the hydratase
          chemistry but has been recruited to the phenylacetate pathway, where it
          acts on a C6 dicarboxylic aromatic-ring-derived intermediate.
