id: P0AES2
gene_symbol: gudD
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  GudD (GlucD) is a magnesium-dependent glucarate dehydratase of the mandelate
  racemase subgroup of the enolase superfamily. It dehydrates D-glucarate, and
  also L-idarate, to 5-dehydro-4-deoxy-D-glucarate (5-keto-4-deoxy-D-glucarate,
  KDG), the committed entry step of D-glucarate catabolism. It also
  interconverts D-glucarate and L-idarate by epimerization. Crystal structures
  identify Lys207 and His339 as the catalytic bases and Asp235, Glu266 and
  Asn289 as the Mg2+ ligands. In E. coli the KDG product is cleaved by the GarL
  aldolase and its products are funnelled to 2-phosphoglycerate by GarR and
  GarK.
