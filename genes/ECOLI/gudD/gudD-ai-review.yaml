    label: magnesium ion binding
  evidence_type: IDA
  original_reference_id: PMID:11513584
  qualifier: enables
  review:
    summary: GudD binds one catalytic Mg2+ per subunit, shown crystallographically.
    action: ACCEPT
    reason: >-
      Crystal structures of GudD with substrate and inhibitors identify the
      Mg2+ ligands (Asp235, Glu266, Asn289), and the Mg2+ is part of the
      enolase-superfamily catalytic mechanism, binding the substrate
      carboxylate. The metal is an integral catalytic cofactor, so the binding
      annotation is accepted, consistent with the review of the KT2440
      ortholog.
    supported_by:
    - reference_id: PMID:10769114
      supporting_text: >-
        reveal the identities of the ligands for the required Mg(2+)
        (Asp(235), Glu(266), and Asn(289))
