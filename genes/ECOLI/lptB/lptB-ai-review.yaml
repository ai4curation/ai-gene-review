- term:
    id: GO:0055085
    label: transmembrane transport
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR030921
  review:
    summary: InterPro2GO mapping of the LptB family to transmembrane transport, inherited
      from the generic ABC-transporter template.
    action: MODIFY
    reason: GO:0055085 is defined as transport of a solute across a lipid bilayer.
      LptB2FG does not move LPS across the inner membrane (MsbA flips it); it extracts
      LPS laterally out of the outer leaflet of the inner membrane into the periplasmic
      Lpt bridge, and the E. coli structural work explicitly contrasts this with
      classical ABC transporters that translocate substrates across the membrane.
      The essence (LptB powers a transport process) is right, so the better term
      is the specific process GO:0015920 lipopolysaccharide transport, which LptB
      already carries experimentally (not an is_a descendant; a lateral correction).
      This diverges from the P. putida LptB review, which kept GO:0055085 as non-core;
      the E. coli mechanistic evidence argues the transmembrane framing is inaccurate.
    proposed_replacement_terms:
    - id: GO:0015920
      label: lipopolysaccharide transport
    supported_by:
    - reference_id: PMID:30894744
      supporting_text: Unlike most other ABC transporters translocating substrates
        across the membrane, LptB2FG extrudes LPS out of the membrane
    - reference_id: PMID:17056748
      supporting_text: Translocation across the IM requires the ABC transporter MsbA,
        which mediates the flipping from the inner leaflet (the site of the synthesis)
        to the outer leaflet of the IM
