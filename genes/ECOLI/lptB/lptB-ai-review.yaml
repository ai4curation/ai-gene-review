suggested_questions:
- question: Should the LptB2FG complex be given a transporter-class molecular function?
    GO:0140359 ABC-type transporter activity and GO:0042626 are defined as transport
    across a membrane, GO:0015437 lipopolysaccharide floppase activity describes the
    MsbA step, and GO:0140332 lipopolysaccharide transfer activity is currently applied
    to the LPS-binding Lpt pocket proteins. Is a new term for ATP-driven extraction of
    a lipid from a membrane leaflet (an ABC-type lipid extractase) needed, to which
    LptB would contribute?
- question: How is the LptB ATPase cycle timed relative to LPS entry into the LptFG
    cavity and LPS release to LptC, and does LptC-mediated inhibition of ATPase activity
    prevent futile hydrolysis in the absence of substrate?
suggested_experiments:
- experiment_type: single-molecule FRET / transport kinetics
  description: Monitor LptB NBD dimerization and LptFG cavity opening in reconstituted
    LptB2FGC proteoliposomes with and without LPS and LptA, to determine the number of
    ATP molecules hydrolyzed per LPS extracted and when in the cycle LPS is released.
- experiment_type: suppressor and crosslinking mapping
  description: Combine in vivo photocrosslinking at the LptB groove with selection for
    suppressors of coupling-helix defects to define the conformational signal relayed
    from LptB to LptFG during LPS extraction.
