core_functions:
- description: ATPase (nucleotide-binding domain) subunit of the LptB2FG(C) ABC transporter;
    an LptB homodimer on the cytoplasmic face of the inner membrane binds and hydrolyzes
    ATP and, through the LptF/LptG coupling helices bound in its groove, powers extraction
    of LPS from the outer leaflet of the inner membrane into the periplasmic Lpt bridge.
