- term:
    id: GO:0061595
    label: 6-deoxy-6-sulfofructose-1-phosphate aldolase activity
  evidence_type: IDA
  original_reference_id: PMID:24463506
  qualifier: enables
  review:
    summary: YihT cleaves SFP to DHAP and SLA.
    action: ACCEPT
    reason: Denger et al. established SFP aldolase with purified recombinant E. coli enzymes, detecting
      DHAP and SLA in a coupled YihS-YihV-YihT system (PMID:24463506, as described in PMID:33791429). A
      later attempt to assay E. coli YihT alone on synthetic SFP gave no product, and the authors switched
      to the Salmonella ortholog (PMID:33791429); this negative result does not contradict the coupled
      assay or the deletion phenotype, so the curator's IDA is accepted.
    supported_by:
    - reference_id: PMID:24463506
      supporting_text: 'SQ is catabolised through four newly discovered reactions that we established using
        purified, heterologously expressed enzymes: SQ isomerase, 6-deoxy-6-sulphofructose (SF) kinase,
        6-deoxy-6-sulphofructose-1-phosphate (SFP) aldolase, and 3-sulpholactaldehyde (SLA) reductase.'
    - reference_id: PMID:33791429
      supporting_text: Schleheck and co-workers detected the formation of DHAP and SLA in a coupled system
        containing SQ and recombinantly produced YihS, YihV, and YihT, supplemented with ATP and MgCl2.
