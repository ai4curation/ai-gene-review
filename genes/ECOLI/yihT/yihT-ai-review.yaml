  label: Escherichia coli K-12
description: YihT is the 6-deoxy-6-sulfofructose-1-phosphate (SFP) aldolase of Escherichia coli, the third
  enzyme of the sulfoglycolytic Embden-Meyerhof-Parnas pathway. It cleaves SFP into dihydroxyacetone phosphate,
  which enters glycolysis, and (2S)-3-sulfolactaldehyde, which is reduced to 2,3-dihydroxypropane-1-sulfonate
  for excretion; the reaction is reversible in vitro. YihT is a class I aldolase of the (alpha/beta)8-barrel
  LacD/DeoC fold that forms a Schiff base between an active-site lysine and the open-chain substrate,
  carries a sulfonate-binding pocket, does not act on fructose 1,6-bisphosphate, and is a homotetramer.
  Deletion of yihT abolishes growth on sulfoquinovose.
