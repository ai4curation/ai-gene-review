id: P0A6T3
gene_symbol: galK
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  galK encodes galactokinase (EC 2.7.1.6), the third gene of the galETKM operon of
  Escherichia coli K-12. The protein is a soluble cytoplasmic member of the GHMP
  (galacto-, homoserine, mevalonate, phosphomevalonate) kinase family, with an
  N-terminal galactose-binding region, a glycine-rich GHMP ATP-binding motif and a
  C-terminal GHMP domain. It transfers the gamma-phosphate of Mg-ATP to the C1
  hydroxyl of alpha-D-galactose, forming alpha-D-galactose 1-phosphate and ADP.
  This is the first committed step of the Leloir pathway, which converts galactose
  into glucose 1-phosphate through the successive actions of galactokinase (GalK),
  galactose-1-phosphate uridylyltransferase (GalT) and UDP-glucose 4-epimerase
  (GalE). The wild-type enzyme is specific for D-galactose but also phosphorylates
  2-deoxy-D-galactose and D-galactosamine more slowly; single substitutions such as
  Y371H broaden its sugar range, which has made E. coli GalK a tool for
  chemoenzymatic synthesis of sugar 1-phosphates. galK mutants cannot use galactose
  as a carbon source, and galK is widely used as a selectable and counter-selectable
  genetic marker.
