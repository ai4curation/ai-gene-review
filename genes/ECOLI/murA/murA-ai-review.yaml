id: P0A749
gene_symbol: murA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  MurA (formerly MurZ) is the cytosolic UDP-N-acetylglucosamine
  1-carboxyvinyltransferase (UDP-GlcNAc enolpyruvyl transferase, EC 2.5.1.7) of
  Escherichia coli, a member of the EPSP synthase (enolpyruvyl transferase)
  family. It transfers the enolpyruvyl group of phosphoenolpyruvate to the
  3'-hydroxyl of UDP-N-acetylglucosamine, releasing phosphate and forming
  UDP-GlcNAc-enolpyruvate, the first committed step of peptidoglycan precursor
  (UDP-MurNAc) synthesis; MurB then reduces this product to UDP-MurNAc. The
  reaction proceeds by addition-elimination through a tetrahedral intermediate,
  and active-site Cys115 forms a covalent phospholactoyl adduct with PEP. Cys115
  is also the site of covalent inactivation by the antibiotic fosfomycin, which
  requires bound UDP-GlcNAc, and by the fungal product terreic acid. MurA is the
  sole UDP-GlcNAc enolpyruvyl transferase of E. coli and is essential for
  growth. It is competitively inhibited by UDP-GlcNAc 3'-phosphate made by
  PezT-type toxins. MurA also physically associates with the LPS assembly
  scaffold LapB and early lipid A and phospholipid enzymes, which may coordinate
  use of the shared UDP-GlcNAc pool.
