core_functions:
- description: >-
    Transfers the enolpyruvyl group of phosphoenolpyruvate to the 3'-hydroxyl of
    UDP-N-acetylglucosamine (via a covalent Cys115 phospholactoyl intermediate),
    the first committed step of cytosolic peptidoglycan precursor (UDP-MurNAc)
    synthesis; the Cys115 active site is the target of fosfomycin.
  molecular_function:
    id: GO:0008760
    label: UDP-N-acetylglucosamine 1-carboxyvinyltransferase activity
  directly_involved_in:
  - id: GO:0009252
    label: peptidoglycan biosynthetic process
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:1512209
    supporting_text: MurZ protein was purified to near homogeneity and found to have
      the expected UDP-N-acetylglucosamine enolpyruvyl transferase activity.
  - reference_id: PMID:8994972
    supporting_text: UDP-N-acetylglucosamine enolpyruvyl transferase (MurA), catalyses
      the first committed step of bacterial cell wall biosynthesis and is a target
      for the antibiotic fosfomycin.
  - reference_id: PMID:7608103
    supporting_text: We conclude that murZ is an essential gene and encodes the sole
      UDP-N-acetylglucosamine enolpyruvyl transferase of E. coli.
suggested_questions:
- question: >-
    Does binding of MurA to LapB, LpxA, LpxC, LpxD or FabZ alter MurA catalytic
    activity or fosfomycin sensitivity, i.e. is the interaction a regulatory switch
    for partitioning UDP-GlcNAc between peptidoglycan and lipid A synthesis?
- question: >-
    Does E. coli MurA, like Enterobacter cloacae MurA, exist in cells predominantly
    as a dormant Cys115-PEP/UDP-MurNAc complex, and is this the physiological
    feedback mechanism controlling flux into peptidoglycan synthesis?
- question: >-
    Which gene carried the 90-min fosfomycin-resistant temperature-sensitive allele
    of Venkateswaran and Wu (1972), given that murA maps at 69.3 min?
suggested_experiments:
- description: >-
    Measure MurA steady-state kinetics and fosfomycin inactivation rates in the
    presence and absence of purified LapB, LpxA, LpxC, LpxD and FabZ, and test
    interaction-deficient MurA variants for growth and peptidoglycan/LPS balance.
- description: >-
    Quantify UDP-MurNAc-bound and PEP-adducted MurA in E. coli lysates by native
    mass spectrometry across growth phases to test the dormant-complex feedback
    model in vivo.
