    action: ACCEPT
    reason: >-
      The mutant showed lower enzyme affinity for fosfomycin and reduced
      incorporation of diaminopimelic acid into acid-insoluble material at the
      restrictive temperature, a peptidoglycan-synthesis phenotype. Caveat: Brown
      et al. (PMID:7608103) note that this mutation mapped at 90 min, not at the
      69.3 min murA (murZ) locus, so the allele's genetic identity is uncertain
      from the abstract. The process claim itself is well established for MurA by
      essentiality and biochemistry (PMID:7608103, PMID:1512209), and the curator
      had the full text, so the row is accepted.
