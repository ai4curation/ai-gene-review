- term:
    id: GO:0010438
    label: cellular response to sulfur starvation
  evidence_type: NAS
  original_reference_id: PMID:10781534
  qualifier: involved_in
  review:
    summary: TauABC carries out taurine-sulfur scavenging during sulfur limitation.
    action: ACCEPT
    reason: >-
      The authors state that the Tau and Ssu systems are expressed only under
      sulfate or cysteine starvation and scavenge sulfur for growth. TauA does
      part of that work as the substrate-capture subunit. The same term is
      accepted for the sibling SsuA, SsuB and SsuC reviews and for TauB and
      TauC here. It is not a claim that TauA senses starvation or regulates
      the response.
    supported_by:
    - reference_id: file:publications/url_https___pmc.ncbi.nlm.nih.gov_articles_PMC101965_.md
      supporting_text: As documented by the mechanisms regulating gene expression in these systems, they both are involved in scavenging sulfur for growth.
- term:
    id: GO:0015734
    label: taurine transmembrane transport
  evidence_type: IMP
  original_reference_id: PMID:10781534
  qualifier: acts_upstream_of_or_within
  review:
    summary: In-frame tauA deletion abolishes growth on taurine sulfur, and complementation restores it.
    action: ACCEPT
    reason: >-
      The tauA in-frame deletion grows on sulfate but not on taurine as the
      sole sulfur source (Table 3), and the authors conclude that taurine
      enters only through TauABC. TauA is the binding protein of that
      importer, so it does part of the transport work; this is the core
      process.
    supported_by:
    - reference_id: file:publications/url_https___pmc.ncbi.nlm.nih.gov_articles_PMC101965_.md
      supporting_text: The growth data indicate that taurine entered the cell exclusively via the TauABC transporter
    - reference_id: file:publications/url_https___pmc.ncbi.nlm.nih.gov_articles_PMC101965_.md
      supporting_text: Complementation analysis of in-frame deletion mutants confirmed that the growth phenotypes obtained were the result of the in-frame deletions constructed.
- term:
