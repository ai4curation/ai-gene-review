  evidence_type: NAS
  original_reference_id: PMID:10781534
  qualifier: located_in
  review:
    summary: TauA is a soluble periplasmic binding protein, not a membrane protein.
    action: MODIFY
    reason: >-
      TauA has a cleavable signal peptide and no transmembrane segment, and the
      authors assign it to the periplasmic binding proteins. Its association
      with the membrane complex does not make it a membrane protein. The row
      is corrected laterally to the outer membrane-bounded periplasmic space,
      which this gene already carries (ISM), as for SsuA.
    supported_by:
    - reference_id: file:publications/url_https___pmc.ncbi.nlm.nih.gov_articles_PMC101965_.md
      supporting_text: The tauA and ssuA genes encode putative signal sequences, indicating that their products probably function as periplasmic binding proteins.
