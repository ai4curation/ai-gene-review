- term:
    id: GO:0022857
    label: transmembrane transporter activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: TauA contributes to the TauABC taurine transporter activity but cannot transport alone.
    action: MODIFY
    reason: >-
      The OpuAC-type binding-protein domain maps to a generic transporter
      term. A periplasmic binding protein does not cross the membrane and
      cannot transport on its own; it contributes substrate capture to the
      ABC-type taurine transporter (GO:0015411, an is_a descendant), which is
      therefore the correct term with a contributes_to reading. This matches
      the SsuA treatment.
    supported_by:
