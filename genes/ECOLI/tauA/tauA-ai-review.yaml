id: Q47537
gene_symbol: tauA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  TauA is the periplasmic substrate-binding protein of the Escherichia coli
  TauABC taurine importer, encoded first in the sulfate-starvation-induced
  tauABCD operon. It is exported by an N-terminal signal peptide and binds
  taurine with nanomolar affinity, presenting it to the TauC permease for
  ATP-driven import powered by TauB. Deletion of tauA abolishes growth on
  taurine as the sole sulfur source, and TauABC also imports several other
  short sulfonates with partial overlap with the SsuABC system. TauA cannot
  substitute for the SsuA binding protein; each binding protein works only with
  its own permease and ATPase. The imported taurine is desulfonated in the
  cytoplasm by the dioxygenase TauD.
