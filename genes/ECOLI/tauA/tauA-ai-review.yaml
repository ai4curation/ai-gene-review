    summary: TauA belongs to the sulfate-starvation-induced taurine-scavenging system.
    action: ACCEPT
    reason: >-
      The PTHR30024 family review judges this PAINT node TOO_DEEP because it
      reaches osmoprotectant and nitrate binding proteins, but TauA (SF47) is
      inside the sulfonate/taurine branch where the claim is right, and it is
      the node's own seed. The tau operon is expressed only under sulfate or
      cysteine starvation, and TauA carries out part of the resulting
      scavenging of taurine sulfur. The row is consistent with the
      sulfur-starvation rows below.
