id: P0A9Z1
gene_symbol: glnB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: GlnB (PII) is a small homotrimeric cytoplasmic signal transduction protein of the PII family
  that integrates the nitrogen, carbon and energy status of E. coli. Each subunit has an exposed T-loop
  carrying Tyr51, which the bifunctional uridylyltransferase/uridylyl-removing enzyme GlnD reversibly
  uridylylates in response to glutamine, while ATP/ADP and 2-oxoglutarate bind in the inter-subunit clefts.
  Unmodified, effector-bound GlnB binds the kinase domain of the histidine kinase NtrB (NRII), inhibiting
  its kinase and activating its phosphatase toward NtrC-phosphate, thereby shutting down sigma-54-dependent
  Ntr gene transcription, and it stimulates GlnE-catalysed adenylylation (inactivation) of glutamine synthetase;
  GlnB-UMP instead promotes GlnE-catalysed deadenylylation. GlnB also binds and inhibits acetyl-CoA carboxylase
  (BC-BCCP) and stimulates L-aspartase, and can form heterotrimers with its paralog GlnK.
