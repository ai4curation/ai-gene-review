proposed_new_terms:
- proposed_name: 2-oxoglutarate binding
  proposed_definition: Binding to 2-oxoglutarate (alpha-ketoglutarate), the C5 dicarboxylic acid intermediate
    of the tricarboxylic acid cycle.
  justification: PII signal transduction proteins sense carbon/nitrogen status by binding 2-oxoglutarate
    at the inter-subunit ATP site, a well-defined effector-binding activity shared across the PII family.
    GO offers only the generic carboxylic acid binding (GO:0031406), so the PII effector site cannot be
    annotated at the same precision as ATP binding. A specific child of GO:0031406 would close that gap.
  supported_by:
  - reference_id: PMID:7629080
    supporting_text: PII is activated upon binding ATP and either 2-ketoglutarate or glutamate
suggested_questions:
- question: What is the relative in vivo contribution of GlnB-mediated regulation of acetyl-CoA carboxylase
    and of L-aspartase compared with its canonical NtrB and GlnE targets, given that both were characterized
    mainly in vitro?
- question: How do GlnB/GlnK heterotrimers with mixed uridylylation states partition between NtrB, GlnE
    and AmtB in nitrogen-limited cells?
suggested_experiments:
- description: Measure malonyl-CoA levels and fatty acid synthesis rates in glnB null and GlnB T-loop/Y51F
    mutants across nitrogen upshift/downshift to test in vivo ACC regulation.
- description: Quantitative in vivo crosslinking or split-reporter assays of GlnB with NtrB, GlnE, AccB/AccC
    and AspA as a function of 2-oxoglutarate and GlnD activity.
