id: P75853
gene_symbol: ssuA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: SsuA is the periplasmic substrate-binding component of the Escherichia coli SsuABC alkanesulfonate
  importer. It supplies substrate recognition to the SsuC membrane permease and SsuB ATP-binding component,
  supporting uptake of alternative sulfur sources during sulfate limitation. Native deletion and complementation
  experiments distinguish this system from the related taurine transporter; SsuA is not an independently
  ATP-driven membrane pump.
