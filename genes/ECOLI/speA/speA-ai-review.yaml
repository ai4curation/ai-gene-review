id: P21170
gene_symbol: speA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  SpeA is the biosynthetic arginine decarboxylase (ADC) of Escherichia coli, a 658-residue
  fold-type III pyridoxal 5'-phosphate (PLP) enzyme of the Orn/Lys/Arg decarboxylase class-II
  family that decarboxylates L-arginine to agmatine and CO2. Agmatine is hydrolysed by agmatinase
  (SpeB) to putrescine, so SpeA initiates the arginine route to putrescine and, through putrescine,
  to spermidine. The purified enzyme is a Mg2+-dependent homotetramer with a low micromolar
  Km for arginine and is feedback-inhibited by putrescine and spermidine; its activity is
  further restrained post-translationally by antizyme and the ribosomal proteins S20 and L34.
  Cell fractionation placed the processed mature enzyme in the periplasm. SpeA is distinct
  from the acid-inducible biodegradative arginine decarboxylase AdiA.
