suggested_questions:
- question: >-
    Is the periplasmic location of processed SpeA reproducible with modern fractionation markers,
    and how does a periplasmic enzyme supply agmatine to cytosolic SpeB?
suggested_experiments:
- description: >-
    Fractionate wild-type E. coli with periplasmic and cytoplasmic marker controls and localise
    chromosomally tagged SpeA, then test whether agmatine export/import links SpeA to SpeB.
