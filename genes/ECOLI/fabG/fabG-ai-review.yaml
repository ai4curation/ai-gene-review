- term:
    id: GO:0009102
    label: biotin biosynthetic process
  evidence_type: IMP
  original_reference_id: PMID:20693992
  qualifier: acts_upstream_of_or_within
  review:
    summary: >-
      The pimeloyl moiety of biotin is built by a diverted round of fatty-acid elongation that uses FabG;
      a real secondary use of the core activity.
    action: KEEP_AS_NON_CORE
    reason: >-
      Biotin synthesis begins with BioC methylation of a malonyl thioester, which then enters the ordinary
      fatty-acid elongation cycle for two rounds to give pimeloyl-ACP methyl ester. FabG performs the
      ketoreduction in those rounds, so it does participate - this is not a case of being merely required
      - but it is the same catalytic step serving a second pathway rather than a distinct function, so
      the term is non-core.
    supported_by:
    - reference_id: PMID:20693992
      supporting_text: >-
        The malonyl-thioester methyl ester enters fatty acid synthesis as the primer and undergoes two
        reiterations of the fatty acid elongation cycle to give pimeloyl-acyl carrier protein (ACP) methyl
        ester, which is hydrolyzed to pimeloyl-ACP and methanol by BioH.
    - reference_id: PMID:20693992
      supporting_text: >-
        We report in vivo and in vitro evidence that the pimeloyl moiety is synthesized by a modified
        fatty acid synthetic pathway in which the omega-carboxyl group of a malonyl-thioester is methylated
        by BioC, which allows recognition of this atypical substrate by the fatty acid synthetic enzymes.
