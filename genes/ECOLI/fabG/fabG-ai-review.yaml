id: P0AEK2
gene_symbol: fabG
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  FabG is the beta-ketoacyl-[acyl-carrier-protein] reductase of the dissociated (type II) fatty-acid synthase,
  the first reductive step of each elongation cycle: it reduces beta-ketoacyl-ACP to (3R)-hydroxyacyl-ACP
  using NADPH. It is a homotetrameric short-chain dehydrogenase/reductase with a Ser-Tyr-Lys catalytic
  triad that is only assembled into a competent arrangement when the cofactor binds, a rearrangement that
  also creates a proton-relay network and underlies the enzyme's negative cooperativity for NADPH; an
  electropositive, hydrophobic surface patch next to the active-site entrance docks the acyl carrier protein.
  The reaction is essential and non-redundant in Escherichia coli - conditional fabG mutants stop making
  acyl-ACP intermediates and fatty acids at the non-permissive temperature - and the same enzyme is also
  used by the diverted round of elongation that builds the pimeloyl moiety of biotin.
