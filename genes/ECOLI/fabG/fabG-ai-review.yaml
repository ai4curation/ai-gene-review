core_functions:
- description: >-
    NADPH-dependent reduction of beta-ketoacyl-ACP to (3R)-hydroxyacyl-ACP, the first reductive reaction
    of each type II fatty-acid elongation cycle, carried out by a homotetramer whose catalytic triad is
    assembled on cofactor binding and which docks ACP through a surface patch beside the active site.
  molecular_function:
    id: GO:0004316
    label: 3-oxoacyl-[acyl-carrier-protein] reductase (NADPH) activity
  directly_involved_in:
  - id: GO:0006633
    label: fatty acid biosynthetic process
  - id: GO:0030497
    label: fatty acid elongation
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:14996818
    supporting_text: >-
      FabG, beta-ketoacyl-acyl carrier protein (ACP) reductase, performs the NADPH-dependent reduction
      of beta-ketoacyl-ACP substrates to beta-hydroxyacyl-ACP products, the first reductive step in the
      elongation cycle of fatty acid biosynthesis.
  - reference_id: PMID:14527946
    supporting_text: >-
      Enzymatic analysis showed that the mutant enzymes were compromised in their ability to utilize ACP
      thioester substrates but were fully active in assays with a substrate analog.
suggested_questions:
- question: >-
    What is the physiological role of FabG's negative cooperativity for NADPH, and does it couple elongation
    flux to the cellular NADPH/NADP+ ratio?
suggested_experiments:
- description: >-
    Compare acyl-ACP intermediate profiles and fatty-acid synthesis rates of wild-type FabG with variants
    that lose negative cooperativity but retain activity, under varied NADPH availability, to test whether
    cooperativity is a flux-control device.
