- id: PMID:14996818
  title: >-
    Isolation and characterization of beta-ketoacyl-acyl carrier protein reductase (fabG) mutants of Escherichia
    coli and Salmonella enterica serovar Typhimurium.
  findings:
  - statement: >-
      FabG performs the NADPH-dependent reduction of beta-ketoacyl-ACP, the first reductive step of the
      elongation cycle.
