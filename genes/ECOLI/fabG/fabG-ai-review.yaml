- id: PMID:15016358
  title: >-
    Cofactor-induced conformational rearrangements establish a catalytically competent active site and
    a proton relay conduit in FabG.
  findings:
  - statement: >-
      NADP(H) binding repositions the Ser-Tyr-Lys triad and creates a proton relay; Tyr151 is needed for
      high-affinity cofactor binding.
    supporting_text: >-
      The structures of Escherichia coli FabG and the FabG[Y151F] mutant in binary complexes with NADP(H)
      reveal that mechanistically important conformational changes accompany cofactor binding.
    reference_section_type: ABSTRACT
  - statement: The Y151F variant is defective in NADPH binding.
    supporting_text: Biochemical data confirm that FabG[Y151F] is defective in NADPH binding.
