- id: PMID:20693992
  title: Biotin synthesis begins by hijacking the fatty acid synthetic pathway.
  findings:
  - statement: >-
      A BioC-methylated malonyl thioester enters the normal fatty-acid elongation cycle for two rounds
      to give pimeloyl-ACP methyl ester, so the FAS-II enzymes build the biotin pimeloyl moiety.
    supporting_text: >-
      The malonyl-thioester methyl ester enters fatty acid synthesis as the primer and undergoes two reiterations
      of the fatty acid elongation cycle to give pimeloyl-acyl carrier protein (ACP) methyl ester, which
      is hydrolyzed to pimeloyl-ACP and methanol by BioH.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified, full text cached (Lin, Hanson and Cronan, Nat Chem Biol 2010); the basis of the
      biotin row, which is a secondary use of the same elongation chemistry.
