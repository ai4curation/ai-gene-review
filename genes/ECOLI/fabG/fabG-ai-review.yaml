      FabG, beta-ketoacyl-acyl carrier protein (ACP) reductase, performs the NADPH-dependent reduction
      of beta-ketoacyl-ACP substrates to beta-hydroxyacyl-ACP products, the first reductive step in the
      elongation cycle of fatty acid biosynthesis.
    reference_section_type: ABSTRACT
  - statement: >-
