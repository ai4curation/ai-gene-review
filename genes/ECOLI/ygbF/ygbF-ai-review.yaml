- term:
    id: GO:0043571
    label: maintenance of CRISPR repeat elements
  evidence_type: IDA
  original_reference_id: PMID:27899566
  qualifier: involved_in
  review:
    summary: >-
      Direct assay of the purified Cas1-2 complex integrating a protospacer into
      leader-containing CRISPR DNA, annotated from the ComplexPortal CPX-996 complex
      of which Cas2 is a constituent subunit. The term names the DNA-level outcome -
      expansion of the array with duplication of the leader-proximal repeat - and
      that is what the assay measures.
    action: ACCEPT
    reason: >-
      Cas2 is a genuine participant rather than a bystander or a substrate. It is not
      catalytic, but it supplies the structure on which the reaction occurs: the
      bridge between the two Cas1 dimers, and arginines that grip the protospacer
      duplex. That is contribution of structural and positioning activity on which
      the step depends, which is participation in the sense GO requires, and the
      complex rather than Cas1 alone is the efficient integrase.
    supported_by:
    - reference_id: PMID:27899566
      supporting_text: Cas1–2 complex alone is sufficient for the integration of protospacer
        elements
      reference_section_type: DISCUSSION
