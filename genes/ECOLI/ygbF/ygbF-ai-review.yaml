    reference_section_type: ABSTRACT
proposed_new_terms:
- proposed_name: protospacer length determination activity
  proposed_definition: >-
    A molecular function by which a protein or protein assembly selects a
    double-stranded nucleic acid fragment of a defined length by presenting a binding
    surface of fixed dimensions, such that only fragments matching that span are
    productively engaged, thereby setting the length of the product incorporated
    downstream.
  justification: >-
    The behaviour that distinguishes Cas2 from a generic subunit, and the Cas1-Cas2
    complex from Cas1 alone, is dimensional: the bridged surface accepts a 23 bp duplex
    with short 3' single-stranded extensions and thereby fixes the 33 bp spacer length
    that defines this CRISPR system's architecture. GO has no term for this
    molecular-ruler behaviour. GO:0030674 protein-macromolecule adaptor activity, used
    in core_functions, captures the bridging but says nothing about measurement, and no
    nucleic-acid-binding term encodes length selectivity. The crispr_cas_adaptive_immunity
    module records this as a knowledge gap, which it genuinely is; this entry names the
    gap rather than filling it with an ill-fitting identifier. A term would be useful
    beyond CRISPR, since length-measuring assemblies recur in nucleic-acid processing.
    It is proposed as a property of the assembly, so a Cas2 annotation to it would
    properly carry the contributes_to qualifier.
  supported_by:
  - reference_id: PMID:26503043
    supporting_text: Our results uncover the structural basis for foreign DNA capture
      and the mechanism by which Cas1-Cas2 functions as a molecular ruler to dictate
      the sequence architecture of CRISPR loci.
    reference_section_type: ABSTRACT
  - reference_id: PMID:26503043
    supporting_text: Importantly, however, optimal substrates include a central 23 base
      pair helical region flanked by five single-stranded nucleotides on each 3′ end.
    reference_section_type: RESULTS
  - reference_id: PMID:26503043
    supporting_text: Reverse charge mutations of Cas1 R41 and Cas2 R16 and R78 drastically
      reduce spacer acquisition in vivo, whereas the Cas2 R77E mutant functions similar
      to wild-type (WT) Cas2
    reference_section_type: RESULTS
suggested_questions:
- question: >-
    UniProt's recommended name for P45956 is "CRISPR-associated endoribonuclease Cas2",
    with EC 3.1.-.- and the Endonuclease, Nuclease and Hydrolase keywords, yet no
    ribonuclease activity has ever been reported for the E. coli protein; the name
    derives from archaeal Cas2 homologues, a Bacillus halodurans Cas2 that cleaves dsDNA
    rather than RNA, and a PDB deposition annotated as a putative ssRNA endonuclease.
    The conserved E9 "catalytic" residue is dispensable for every adaptation phenotype
    tested. Should the recommended name and the EC/keyword assignments be revised, and
    is any RNA-cleaving function of Cas2 relevant to adaptation in any organism?
  experts:
  - UniProt
  - CRISPR adaptation community
- question: >-
    Is GO:0030674 protein-macromolecule adaptor activity the right molecular function
    for a non-catalytic subunit whose bridging geometry is the element whose removal
    abolishes the complex's activity? The crispr_cas_adaptive_immunity module currently
    asserts no molecular function for Cas2 on the grounds that it is not catalytic. GO's
    molecular-function branch is not restricted to catalysis, and resolving this would
    settle how a large class of structural Cas and non-Cas subunits should be annotated.
  experts:
  - GO molecular function curators
- question: >-
    Does Cas2 contribute anything beyond the Cas1-Cas2 complex? Its structural homology
    to the VapD family of toxin-antitoxin toxins has been noted repeatedly, and a
    CRISPR-independent role would explain why a putative nuclease active site is
    conserved while being dispensable for adaptation.
  experts:
  - toxin-antitoxin community
suggested_experiments:
- hypothesis: >-
    Cas2's contribution to adaptation is geometric: the dimensions of the bridge it
    forms between the two Cas1 dimers set the spacer length.
  description: >-
    Engineer Cas2 variants with insertions or deletions in the bridging surface that
    lengthen or shorten the span between the two Cas1 dimers, reconstitute integration
    in vitro, and sequence the integration products to see whether the selected
    protospacer length shifts predictably. A shift would establish the ruler as a
    property of the Cas2 bridge and would be the decisive evidence for a
    length-determination molecular function.
  experiment_type: biochemical
- hypothesis: >-
    Cas2 has no ribonuclease activity relevant to the E. coli type I-E system, and the
    UniProt name is a family-level holdover.
  description: >-
    Assay purified E. coli Cas2, alone and in the Cas1-Cas2 complex, against a panel of
    single-stranded RNA, double-stranded RNA, single-stranded DNA and double-stranded
    DNA substrates across a range of divalent cations, alongside an archaeal Cas2 as a
    positive control and the E9A variant as a negative. A uniformly negative result on
    the E. coli protein would justify revising the recommended protein name and would
    close off a persistent source of propagated nuclease annotations.
  experiment_type: biochemical
- hypothesis: >-
    Complex assembly, rather than Cas2 protein abundance, is what adaptation requires.
  description: >-
    Titrate expression of wild-type Cas2 against the beta6-beta7 deletion and the E9A
    active-site variant in a cas1 cas2 deletion strain, measuring both Cas1-Cas2
    complex formation and spacer acquisition frequency. If acquisition tracks complex
    formation and is indifferent to the active site across the whole range, the adaptor
    assignment is secure and the nuclease assignment is excluded.
  experiment_type: genetic
