      Same replacement as the PMID:24793649 row, independently supported by a second
      co-crystal series. This paper adds the part that makes the adaptor assignment
      more than a restatement of subunit membership: Cas2's own residues participate
      in positioning the substrate across the bridged surface, so the coordination the
      adaptor term requires is demonstrated rather than assumed.
