core_functions:
- description: >-
    Structural adaptor subunit of the Cas1(4)-Cas2(2) spacer-acquisition complex. The
    Cas2 homodimer bridges two Cas1 dimers and holds them in the orientation that
    creates a continuous protospacer-binding surface spanning all three dimers;
    arginines R16 and R78 contribute to the shared arginine clamp that grips the
    duplex, so that the assembled complex measures protospacer length and sets the
    33 bp spacer size of this system. Cas2 performs no catalysis - its own conserved
    active-site glutamate is dispensable - but complex assembly through its
    C-terminal beta6-beta7 element is required for CRISPR DNA binding and for spacer
    acquisition, and the complex integrates protospacers far more efficiently than
    Cas1 alone.
  molecular_function:
    id: GO:0030674
    label: protein-macromolecule adaptor activity
  contributes_to_molecular_function:
    id: GO:0003677
    label: DNA binding
  directly_involved_in:
