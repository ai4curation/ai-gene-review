      structures show why the bridging matters functionally: Cas2 R16 and R78 join
      Cas1 R41 in an arginine clamp around the middle of the duplex, charge reversal
      at those positions drastically reduces spacer acquisition in vivo, and the
      resulting assembly behaves as a ruler that selects a 23 bp duplex with short 3'
      single-stranded ends.
