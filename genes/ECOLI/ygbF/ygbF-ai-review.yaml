taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  ygbF, also known as cas2, encodes the small CRISPR-associated protein Cas2 of the
  Escherichia coli K-12 type I-E CRISPR-Cas system. Cas1 and Cas2 are the two most
  widely conserved Cas proteins and together constitute the adaptation machinery,
  the stage of CRISPR immunity in which a protospacer captured from invading DNA is
  integrated as a new spacer at the leader-proximal end of a CRISPR array. Cas2 is a
  94-residue ferredoxin-like protein that forms a homodimer. Two Cas1 dimers
  sandwich the Cas2 dimer to build a Cas1(4)-Cas2(2) heterohexamer, within which
  Cas2 is the structural keystone: it is the bridge that holds the two Cas1 dimers
  in a fixed relative orientation, and the protospacer duplex lies across a flat
  surface that runs from one Cas1 dimer, over the Cas2 dimer, to the other. Cas2
  does not perform the integration chemistry. The chemistry is done by Cas1, and
  substituting the conserved glutamate at position 9 that would be Cas2's catalytic
  residue leaves spacer acquisition and in vitro integration unaffected, whereas the
  equivalent substitutions in Cas1 abolish both. What Cas2 contributes instead is
  architecture and measurement: deleting the C-terminal beta6-beta7 element abolishes
  complex assembly, CRISPR DNA binding by the complex, and spacer acquisition;
  arginines R16 and R78 form part of a shared arginine clamp with Cas1 R41 that grips
  the middle of the protospacer duplex, and charge-reversal at those positions
  drastically reduces acquisition in vivo. Together these contacts make the complex a
  molecular ruler that selects a 23 bp duplex with short 3' single-stranded
  extensions and so fixes the 33 bp spacer length characteristic of this system.
  Cas2 shows no DNA binding on its own and contributes nothing to the branched-DNA
  nuclease and disintegration reactions that Cas1 catalyses alone; the complex,
  however, integrates protospacers far more efficiently than Cas1 by itself. Neither
  protein alone supports array expansion in vivo, and co-expression of the two is
  sufficient. The gene is the last gene of the casABCDE-ygbT-ygbF operon, which is
  silenced by H-NS and induced by LeuO and by the BaeSR envelope-stress system, and
  its disruption causes loss of plasmid silencing. Although the protein is named an
  endoribonuclease after RNA-cleaving activities reported for Cas2 homologues from
  other organisms, no nuclease activity has been demonstrated for the E. coli
  protein, and its putative active site is dispensable for every adaptation phenotype
  tested.
existing_annotations:
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:24793649
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q46896
  review:
    summary: >-
      This row reports the Cas1-Cas2 interface seen in the 2.3 A co-crystal structure
      of the heterohexamer, in which the Cas2 dimer is sandwiched between two Cas1
      dimers. For Cas2 this interaction is not incidental - it is the whole of what
      the protein does. Disrupting the interface, including by deleting the
      C-terminal beta6-beta7 element, abolishes complex formation, CRISPR DNA binding
      by the complex, and spacer acquisition in vivo, while the Cas2 active-site
      residue is dispensable. GO:0030674 protein-macromolecule adaptor activity is
      defined as an adaptor activity that brings two or more macromolecules into
      contact so that they can function in a coordinated way, which is a description
      of the Cas2 dimer bridging two Cas1 dimers.
    action: MODIFY
    reason: >-
      The essence is right and the term is the least informative in GO, so the
      project policy on bare protein-binding rows calls for a replacement where the
      evidence supports one. Here it does, and unusually strongly: the literature
      states the adaptor interpretation explicitly, the bridging element is the part
      whose removal abolishes function, and Cas2's own catalytic residue is not. That
      discriminating test is exactly what GO:0030674 is for, and it converts a row
      that says only "touches Cas1" into one that says what the touching accomplishes.
      DNA binding is deliberately not proposed as a replacement: Cas2 does not bind
      DNA alone, so it belongs in contributes_to_molecular_function on the core
      function rather than as an enables assertion here.
    proposed_replacement_terms:
    - id: GO:0030674
      label: protein-macromolecule adaptor activity
    supported_by:
    - reference_id: PMID:24793649
      supporting_text: The overall architecture of the asymmetric unit is a heterohexameric
        complex consisting of two Cas1 dimers (Cas1a-b and Cas1c-d) that sandwich one
        Cas2 dimer
      reference_section_type: RESULTS
    - reference_id: PMID:24793649
      supporting_text: Mutations in either Cas1 or Cas2 that disrupt Cas1–Cas2 complex
        formation in vitro also interfere with spacer acquisition in vivo.
      reference_section_type: ABSTRACT
    - reference_id: PMID:24793649
      supporting_text: In contrast, the catalytic activity of Cas2 is unnecessary for
        integration of sequences into the CRISPR locus in vivo.
      reference_section_type: DISCUSSION
    - reference_id: PMID:26284603
      supporting_text: It is probable that Cas2 acts as an adaptor protein, either bringing
        two Cas1 dimers together or mediating interactions with other components necessary
        for spacer acquisition.
      reference_section_type: INTRODUCTION
