- term:
    id: GO:0043571
    label: maintenance of CRISPR repeat elements
  evidence_type: IMP
  original_reference_id: PMID:22402487
  qualifier: acts_upstream_of_or_within
  review:
    summary: >-
      Genetic evidence from the E. coli adaptation assay: induced expression of Cas1
      together with Cas2 expands the CRISPR array, whereas expression of either
      protein alone does not. Cas2 is therefore required for the process, and the
      requirement is not satisfied by Cas1 at any expression level.
    action: ACCEPT
    reason: >-
      Clean loss-of-function and complementation support, with the cautious
      acts_upstream_of_or_within qualifier that an overexpression phenotype warrants.
      The necessity shown here would not by itself license a process term - necessity
      is also what being a substrate looks like - but Cas2 is not consumed or acted
      upon by integration: the structural work shows it contributing the scaffold and
      the DNA contacts the step runs on, so participation is established
      independently.
    supported_by:
    - reference_id: PMID:22402487
