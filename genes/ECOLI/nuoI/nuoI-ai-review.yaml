- term:
    id: GO:0009055
    label: electron transfer activity
  evidence_type: IMP
  original_reference_id: PMID:22474289
  qualifier: enables
  review:
    summary: Proposed new annotation. NuoI clusters N6a/N6b relay electrons
      from cluster N5 to the terminal cluster N2 within complex I.
    action: NEW
    reason: The specific activity NuoI contributes is intramolecular electron
      transfer through its two [4Fe-4S] clusters. Mutagenesis of E. coli NuoI
      shows that N6a and N6b are essential for NDH-1 electron transfer.
      Electron transfer activity is the GO term for such Fe-S relay subunits and
      is the module-level function of NuoI. GOA has no MF for NuoI beyond
      cofactor binding and the generic or complex-level oxidoreductase terms,
      so this fills a real gap. NuoI's own clusters do the work, so this is not
      substrate-style necessity evidence.
    supported_by:
    - reference_id: PMID:22474289
      supporting_text: biochemical data, including the activity and assembly of
        NDH-1 together with EPR data of the mutants, unequivocally affirmed that
        clusters N6a and N6b are essential for electron transfer of NDH-1.
    - reference_id: PMID:22474289
      supporting_text: plays a role in bridging the electron transfer from cluster
        N5 to the terminal cluster N2
