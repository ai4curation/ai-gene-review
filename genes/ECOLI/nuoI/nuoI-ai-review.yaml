  review:
    summary: Phylogenetic inference that TYKY-family complex I subunits function
      in aerobic respiration.
    action: KEEP_AS_NON_CORE
    reason: True. Complex I is the main NADH entry point to the aerobic
      respiratory chain, and nuo mutants lose NDH-1 activity. In E. coli,
      though, NDH-1 also serves anaerobic respiratory chains, and the
      subunit-level core process is the more specific respiratory electron
