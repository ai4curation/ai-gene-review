id: P0AFD6
gene_symbol: nuoI
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  NuoI is the TYKY-type (NDUFS8/Nqo9-homologous) iron-sulfur subunit of the
  proton-translocating NADH:quinone oxidoreductase NDH-1 (respiratory complex
  I). The 180-residue protein has two tandem 4Fe-4S ferredoxin-type domains
  that bind the [4Fe-4S] clusters N6a and N6b. Within the peripheral arm
  these clusters form the part of the intramolecular electron wire that
  bridges cluster N5 (in NuoG) and the terminal cluster N2 (in NuoB), so NuoI
  relays electrons from NADH oxidation at the FMN of NuoF toward the
  quinone-reduction site. The cluster-ligating cysteines are also needed for
  the structural integrity of the complex. NuoI is a peripheral subunit of the
  cytoplasmic (inner) membrane-bound complex and takes part in the respiratory
  electron transport chain that couples NADH:quinone oxidoreduction to proton
  translocation.
