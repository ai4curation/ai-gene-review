core_functions:
- description: >-
    NuoI carries the [4Fe-4S] clusters N6a and N6b, which relay electrons
    from cluster N5 to the terminal cluster N2 within the peripheral arm of
    the plasma-membrane NDH-1 complex. It thereby contributes to the
    proton-coupled NADH:ubiquinone oxidoreductase activity of complex I in the
    respiratory electron transport chain.
  molecular_function:
    id: GO:0009055
    label: electron transfer activity
  contributes_to_molecular_function:
    id: GO:0008137
    label: NADH dehydrogenase (ubiquinone) activity
  directly_involved_in:
  - id: GO:0022904
    label: respiratory electron transport chain
  locations:
  - id: GO:0005886
    label: plasma membrane
  in_complex:
    id: GO:0045271
    label: respiratory chain complex I
  supported_by:
  - reference_id: PMID:22474289
    supporting_text: Subunit NuoI in the peripheral domain contains two [4Fe-4S]
      clusters (N6a and N6b) and plays a role in bridging the electron transfer
      from cluster N5 to the terminal cluster N2.
- description: >-
    NuoI binds two [4Fe-4S] clusters through cysteine motifs in tandem
    ferredoxin-type domains; the ligating cysteines are also needed for the
    structural integrity of NDH-1.
  molecular_function:
    id: GO:0051539
    label: 4 iron, 4 sulfur cluster binding
  in_complex:
    id: GO:0045271
    label: respiratory chain complex I
  supported_by:
  - reference_id: PMID:22474289
    supporting_text: With the exception of C63S, all mutants had damaged
      architecture of NDH-1, suggesting that Cys-coordinating Fe/S clusters help
      maintain the NDH-1 structure.
suggested_questions:
- question: Do the N6a and N6b clusters of NuoI have distinct midpoint
    potentials in E. coli NDH-1, and does the isopotential arrangement of the
    wire change between the coupled and uncoupled conformations seen by cryo-EM?
suggested_experiments:
- description: Redox-titrated EPR combined with cryo-EM of NuoI cluster-ligand
    variants (such as C63S) to measure the N6a/N6b potentials and test how
    each cluster affects electron flux to N2 and proton-pumping stoichiometry.
