    summary: Phylogenetic inference (with human NDUFS8 and E. coli NuoI as
      descendant evidence) that TYKY-family subunits contribute to the NADH
      dehydrogenase activity of complex I.
    action: MODIFY
    reason: The contributes_to claim is sound, but GO:0003954 is a generic is_a
      ancestor of the activity of the complex that NuoI belongs to, the
      proton-coupled NADH:ubiquinone oxidoreductase (GO:0008137). NuoI has no
      NADH or FMN site; it relays electrons within the complex. Replace with
      contributes_to GO:0008137, the descendant used in this review's core
      function. E. coli NuoI being among the donors is expected and not
      circular.
