id: P0AG86
gene_symbol: SecB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli (strain K12)
description: >-
  SecB is a cytosolic, ATP-independent export chaperone in the Escherichia coli
  general secretory pathway. Its homotetramer binds a subset of newly synthesized
  secretory preproteins through extended hydrophobic grooves, prevents their premature
  folding and aggregation, and maintains them in a translocation-competent state.
  SecB then targets the bound preproteins to membrane-associated SecA for transfer
  into the SecYEG translocon. This combination of antifolding holdase activity and
  delivery to a defined acceptor makes SecB a specialized unfolded-protein carrier-holdase.
