      the carrier function.
    action: MODIFY
    reason: This paper directly establishes SecB antifolding/holdase behavior. The
      carrier-specific scope of GO:0140309 additionally depends on independent studies
      showing delivery of SecB-bound preproteins to SecA at membrane export sites
