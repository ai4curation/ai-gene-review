id: P0AG86
gene_symbol: SecB
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli (strain K12)
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for SecB, the dedicated cytosolic export chaperone of the Sec
  pathway. Ranks 1 to 4 are all exact GOA matches, so nothing is wrong, but the list is generic: protein
  tetramerization, protein transport, protein folding, unfolded protein binding. The unfolded protein
  carrier activity that this review names as the core molecular function - the thing that distinguishes
  SecB from a general chaperone - is not retrieved, and neither is the SecA handoff. The free-text
  channel states the carrier role correctly. Assessment: 1 correct not novel (CNN), 2 less precise
  (LSP).
source_documents:
