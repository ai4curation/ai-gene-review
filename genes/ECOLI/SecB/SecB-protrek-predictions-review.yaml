- genes/ECOLI/SecB/SecB-uniprot.txt
- genes/ECOLI/SecB/SecB-goa.tsv
predictions:
- source_method: ProTrek
  source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
  source_reference_id: PMID:41039041
  predicted_term:
    id: GO:0051262
    label: protein tetramerization
  predicted_term_type: GO_BP
  review:
    assessment: CNN
    confidence_score: 2
    summary: >-
      Top-ranked hit (score 15.23), an exact GOA match. SecB does function as a homotetramer (a dimer
      of dimers) and the oligomeric state is required for substrate wrapping, so the call is correct
      and structurally apt. It says nothing about export, which is the protein's reason for existing.
    supported_by:
    - reference_id: PMID:16962134
      supporting_text: >-
        wraps them around its tetrameric surface
