    label: protein transport
  predicted_term_type: GO_BP
  review:
    assessment: LSP
    confidence_score: 2
    summary: >-
      Rank 2 (score 13.73), an exact GOA match and a general term of which the annotated protein transport
      by the Sec complex is a descendant. Correct and less precise than what GOA already carries;
      scored LSP.
    supported_by:
    - reference_id: file:ECOLI/SecB/SecB-uniprot.txt
      supporting_text: >-
        Protein-export protein SecB
- source_method: ProTrek
  source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
  source_reference_id: PMID:41039041
  predicted_term:
    id: GO:0006457
    label: protein folding
  predicted_term_type: GO_BP
  review:
    assessment: LSP
    confidence_score: 2
    summary: >-
      Rank 3 (score 13.18), an exact GOA match. Protein folding is arguably the wrong emphasis for
      SecB, whose function is antifolding - it holds preproteins in a translocation-competent unfolded
      state precisely so that they do not fold prematurely. The term is annotated and defensible at
      the level of the chaperone class, but a curator reading only this list would take away the opposite
      of SecB's mechanism. Scored LSP rather than an error because the parent chaperone framing is
      right.
    supported_by:
    - reference_id: PMID:2848249
      supporting_text: >-
        maintains them in a translocation-competent state
