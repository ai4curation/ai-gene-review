id: P0AG82
gene_symbol: pstS
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli (strain K12)
description: >-
  PstS is the exported periplasmic solute-binding subunit of the high-affinity
  PstSACB ABC phosphate importer. It binds inorganic phosphate with high
  selectivity in the periplasm and presents liganded phosphate to the PstA/PstC
  membrane subunits for ATP-dependent uptake by the PstB-powered transporter.
