  review:
    summary: PstS is the phosphate-binding subunit of the high-affinity Pst transporter.
    action: KEEP_AS_NON_CORE
    reason: >-
      The PAINT assertion captures the correct inherited role in phosphate
      uptake, and E. coli genetics also places phoS/pstS in P(i) transport.
      This broad parent is retained as non-core because the specific process is
      phosphate ion transmembrane transport.
    supported_by:
    - reference_id: PMID:4570598
      supporting_text: the phoS and phoT genes are primarily involved in P(i) transport
- term:
    id: GO:0006817
    label: phosphate ion transport
  evidence_type: IDA
  original_reference_id: PMID:4570598
  qualifier: acts_upstream_of_or_within
  review:
    summary: phoS/pstS mutants alter phosphate uptake through the Pst system.
    action: KEEP_AS_NON_CORE
    reason: >-
      The early transport genetics correctly implicates phoS/pstS in phosphate
      uptake. The annotation is a correct but broader parent of the more
      precise phosphate ion transmembrane transport process.
    supported_by:
    - reference_id: PMID:4570598
      supporting_text: the phoS and phoT genes are primarily involved in P(i) transport
- term:
    id: GO:0006974
    label: DNA damage response
  evidence_type: IEP
  original_reference_id: PMID:11967071
  qualifier: acts_upstream_of_or_within
  review:
    summary: pstS expression changed in a broad mitomycin C expression survey.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Khil and Camerini-Otero measured global transcript changes after DNA
      damage and found expression changes for nearly one third of E. coli
      genes. This is expression-response evidence rather than evidence that
      PstS directly executes DNA repair or a DNA-damage response step.
    supported_by:
    - reference_id: PMID:11967071
      supporting_text: >-
        a large number of genes (nearly 30% of all genes) displayed significant
        changes in their expression level
- term:
    id: GO:0009314
    label: response to radiation
  evidence_type: IMP
  original_reference_id: PMID:27718375
  qualifier: acts_upstream_of_or_within
  review:
    summary: The pstS deletion was recovered in a radiation-sensitivity screen.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The Keio collection screen can identify mutants that are hypersensitive
      to irradiation for indirect envelope, growth, or homeostasis reasons.
      PstS has a direct role in periplasmic phosphate capture, so a
      radiation-survival phenotype is retained as a secondary perturbation
      rather than a core response-to-radiation function.
    supported_by:
    - reference_id: PMID:27718375
      supporting_text: >-
        A set of 3907 single-gene knockout (Keio collection) strains of
        Escherichia coli K-12 was examined for strains with increased
        susceptibility to killing by X- or UV-radiation.
- term:
    id: GO:0016020
    label: membrane
  evidence_type: NAS
  original_reference_id: PMID:3881386
  qualifier: located_in
  review:
    summary: PstS is a periplasmic binding protein, not an integral membrane protein.
    action: REMOVE
    reason: >-
      PstS participates in a membrane ABC transporter, but the mature E. coli
      protein is exported as a soluble outer membrane-bounded periplasmic
      substrate-binding protein rather than located in the membrane. The precise
      periplasm annotation is already supported by the phoS signal sequence and
      mature-protein assignment.
    supported_by:
    - reference_id: PMID:6321434
      supporting_text: >-
        the structural gene for the phosphate-repressible, periplasmic
        phosphate-binding protein
