suggested_questions:
- question: >-
    Which liganded and unliganded conformations of E. coli PstS productively
    dock onto PstA/PstC during the PstSACB transport cycle?
suggested_experiments:
- experiment_type: in vitro transporter reconstitution
  description: >-
    Reconstitute purified E. coli PstS with PstA/PstC/PstB proteoliposomes and
    compare phosphate binding, PstS docking, ATP hydrolysis, and phosphate
    uptake with binding-site or docking-surface PstS variants.
