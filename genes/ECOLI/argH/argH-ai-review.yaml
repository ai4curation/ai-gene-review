id: P11447
gene_symbol: argH
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: ArgH is the soluble argininosuccinate lyase that completes arginine biosynthesis in Escherichia
  coli. It cleaves argininosuccinate to L-arginine and fumarate. This enzyme belongs to the argininosuccinate-lyase
  branch of the lyase-1 family and is distinct from the acetyltransferase ArgA that initiates the pathway.
