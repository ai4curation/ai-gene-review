id: P00562
gene_symbol: metL
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: 'MetL is the bifunctional aspartokinase II/homoserine dehydrogenase II of Escherichia coli.
  Its kinase and dehydrogenase domains catalyze the first and third reactions from L-aspartate to L-homoserine,
  respectively. Homoserine supplies methionine and threonine synthesis, while the kinase reaction also
  supplies the diaminopimelate/lysine branch. MetL synthesis is methionine repressible; this is distinct
  from direct allosteric feedback inhibition of ThrA or LysC.'
