    label: alcohol dehydrogenase (NAD+) activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000116
  qualifier: enables
  supporting_entities:
  - RHEA:15757
  review:
    action: ACCEPT
    summary: metL supports NAD-dependent homoserine/alcohol oxidation, with homoserine as the
      specified substrate.
    reason: The curated UniProt reaction supports NAD(H)-dependent homoserine chemistry by orthology
      to Q9SA18; matched native NAD/NADP kinetic measurements were not recovered. GO:0004022
      describes alcohol oxidation with NAD+, which includes oxidation of the primary alcohol in
      homoserine to an aldehyde. GO:0004412 explicitly uses NADP+ and is not a cofactor-preserving
      replacement. Retain the available NAD-specific term at the precision currently justified; this
      does not assert ethanol metabolism, broad substrate promiscuity or equal physiological
      cofactor use. This cofactor-dependent capacity is part of the central homoserine-dehydrogenase
      reaction; its inferential support is not a reason to reclassify it as biologically peripheral.
    supported_by:
    - reference_id: file:ECOLI/metL/metL-uniprot.txt
      record_section:
      - CC:CATALYTIC ACTIVITY
      supporting_text: 'Reaction=L-homoserine + NAD(+) = L-aspartate 4-semialdehyde + NADH +

        CC         H(+);'
