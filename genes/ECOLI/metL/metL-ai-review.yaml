  review:
    action: MODIFY
    summary: MetL contributes its aspartokinase and homoserine-dehydrogenase reactions to homoserine
      biosynthesis.
    reason: MetL catalyzes step 1 (aspartate phosphorylation) and step 3 (aspartate-semialdehyde
      reduction) of homoserine formation. Homoserine subsequently enters the threonine and
      methionine branches; the first reaction also supplies DAP/lysine synthesis. The curated
      pathway statements explicitly identify these chemical contributions. PMID:4148765 maps metL
      genetically but is not used as biochemical proof of pathway membership. Refine the broad
      amino-acid process to the supported existing biosynthetic descendants.
    supported_by:
    - reference_id: file:ECOLI/metL/metL-uniprot.txt
      record_section:
      - CC:PATHWAY
      supporting_text: 'L-threonine biosynthesis; L-threonine

        CC       from L-aspartate: step 3/5.'
    - reference_id: file:ECOLI/metL/metL-uniprot.txt
      record_section:
      - CC:PATHWAY
      supporting_text: 'L-methionine biosynthesis via de novo

        CC       pathway; L-homoserine from L-aspartate: step 3/3.'
