      NAD-dependent homoserine reaction. GO:0004412 currently specifies NADP+, so replacing this row with
      that term would erase the cofactor distinction. Retain as the available NAD-dependent claim, based
      on curated orthology to Q9SA18, not evidence of ethanol metabolism or equal physiological cofactor
      use.
