- term:
    id: GO:0009243
    label: O antigen biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000041
  qualifier: involved_in
  supporting_entities:
  - UniPathway:UPA00281
  review:
    summary: >-
      dTDP-L-rhamnose made by the rfb-cluster enzymes is a building block of the O16 antigen.
    action: KEEP_AS_NON_CORE
    reason: >-
      The K-12 rfb cluster encodes the O16 antigen, whose repeat unit contains L-rhamnose, and RfbA supplies
      the first intermediate of the rhamnose donor. The term is correct as product context but the enzyme
      acts on the soluble sugar-nucleotide branch, not on repeat-unit assembly; most K-12 lines are O-antigen
      negative because of downstream lesions.
    supported_by:
    - reference_id: PMID:7517391
      supporting_text: >-
        Four rhamnose pathway genes are identified by similarity to those of other strains
    - reference_id: file:ECOLI/rfbA/rfbA-uniprot.txt
      record_section: ["CC:PATHWAY"]
      supporting_text: >-
        PATHWAY: Bacterial outer membrane biogenesis; LPS O-antigen biosynthesis. {ECO:0000269|PubMed:11697907}.
