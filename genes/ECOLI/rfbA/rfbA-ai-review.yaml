id: P37744
gene_symbol: rfbA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  rfbA (rmlA, b2039) encodes glucose-1-phosphate thymidylyltransferase 1 (RmlA), the first enzyme of the
  four-step RmlABCD route to dTDP-L-rhamnose in Escherichia coli K-12. The Mg(2+)-dependent homotetrameric
  enzyme condenses dTTP with alpha-D-glucose 1-phosphate to give dTDP-alpha-D-glucose and diphosphate,
  and also catalyses the reverse pyrophosphorolysis, both by a sequential ordered bi-bi mechanism. The
  gene lies in the rfb (O16 antigen) cluster and the dTDP-L-rhamnose it helps to make is incorporated
  into the O16 O-antigen repeat unit, although most laboratory K-12 lines carry rfb-50 or rfb-51 lesions
  and make no O antigen. A second thymidylyltransferase, RffH (glucose-1-phosphate thymidylyltransferase
  2), is encoded in the enterobacterial common antigen cluster.
