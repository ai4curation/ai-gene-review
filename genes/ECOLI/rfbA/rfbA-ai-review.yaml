suggested_questions:
- question: >-
    How is flux divided between RfbA (RmlA1) and the ECA-cluster paralog RffH (RmlA2) for the shared dTDP-glucose
    pool in K-12?
suggested_experiments:
- description: >-
    Measure dTDP-glucose and dTDP-L-rhamnose pools in rfbA, rffH and double deletion strains to determine
    whether either thymidylyltransferase can supply both the O16 and ECA branches.
