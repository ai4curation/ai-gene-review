- term:
    id: GO:0004096
    label: catalase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN001247822
  - UniProtKB:Q9I3N5
  review:
    summary: >-
      Catalase activity propagated to E. coli CcmC from a single Pseudomonas
      aeruginosa CcmC (Q9I3N5) donor; CcmC is a polytopic heme-handling
      membrane protein without a catalase active site.
    action: REMOVE
    reason: >-
      Catalase (H2O2 dismutation) is carried out by dedicated heme-b enzymes
      (KatE/KatG in E. coli), not by Ccm membrane proteins. The donor annotation
      on P. aeruginosa CcmC is a mutant-phenotype (IMP) annotation, and a loss of
      cellular catalase activity in a cytochrome c maturation mutant is an
      indirect, pleiotropic consequence of disrupted heme handling rather than
      evidence that CcmC catalyses peroxide dismutation. All direct biochemical
      work on CcmC describes heme binding and heme transfer to CcmE, with no
      catalytic activity on hydrogen peroxide. The PAINT node otherwise
      correctly places CcmC in cytochrome c biogenesis; this particular
      function should not have been propagated.
    supported_by:
    - reference_id: PMID:29518410
      supporting_text: We conclude that CcmC trafficks heme via its WWD domain and
        propose the structural basis for stereochemical attachment of heme.
    - reference_id: PMID:10339610
      supporting_text: it is the only Ccm protein that is strictly required for
        heme transfer and attachment to CcmE
    propagation_review:
      root_cause: SOURCE_BAD
      failure_modes:
      - SOURCE_EVIDENCE_WEAK
      source_entities:
      - source_id: PANTHER:PTN001247822
        source_status: SOURCE_WEAK_OR_INFERRED
        comment: >-
          The CcmC-family node is correctly placed for cytochrome c biogenesis,
          but its catalase assertion rests on a single donor mutant phenotype.
      - source_id: UniProtKB:Q9I3N5
        source_label: ccmC
        source_status: SOURCE_BAD
        comment: >-
          P. aeruginosa CcmC catalase annotation is an IMP mutant phenotype,
          indirect for a heme-trafficking membrane protein; not a catalytic
          activity of CcmC.
