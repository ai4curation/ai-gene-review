  review:
    summary: >-
      CcmC moves heme from its WWD-domain binding site onto CcmE, a form of
      directed heme trafficking.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Heme handling by CcmC is real, but the heme transport term derives from
