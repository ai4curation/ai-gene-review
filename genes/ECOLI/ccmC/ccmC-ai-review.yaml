    label: cytochrome c biosynthetic process
  - id: GO:0017003
    label: protein-heme linkage
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:19629033
    supporting_text: Haem in this holoCcmCDE complex is bound using periplasmic axial
      ligands His60 and His184 of CcmC, establishing that CcmC binds haem
  - reference_id: PMID:29518410
    supporting_text: For holoCcmE this trafficking culminates in the covalent attachment
      of the 2-vinyl of heme to the CcmE His130 residue.
  - reference_id: PMID:10339610
    supporting_text: it is the only Ccm protein that is strictly required for heme
      transfer and attachment to CcmE
suggested_questions:
- question: >-
    How does heme reach the periplasmic WWD domain of CcmC: through CcmC itself,
    through another membrane protein, or by diffusion through the membrane?
- question: >-
    What conformational change in CcmC, driven by CcmAB ATP hydrolysis, releases
    the His60/His184 axial ligands so that holo-CcmE can leave the complex?
suggested_experiments:
- description: >-
    Track the entry route of heme into CcmC using cysteine/heme crosslinking
    variants placed along the transmembrane helices, in strains with and without
    CcmAB, to test whether heme traverses CcmC.
  experiment_type: in vivo heme crosslinking
- description: >-
    Determine cryo-EM structures of CcmCDE with bound heme before and after
    CcmAB-dependent ATP hydrolysis to define the release mechanism.
  experiment_type: structural biology
