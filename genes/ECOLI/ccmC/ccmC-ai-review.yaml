- term:
    id: GO:1904334
    label: heme import across plasma membrane
  evidence_type: NAS
  original_reference_id: PMID:24044352
  qualifier: involved_in
  review:
    summary: >-
      Statement-based assignment of heme import across the plasma membrane,
      which the cited paper itself contradicts.
    action: REMOVE
    reason: >-
      GO:1904334 describes movement of heme from outside the cell across the
      plasma membrane into the cytosol, the opposite direction to any proposed
      Ccm heme route (cytoplasm to periplasm). The cited paper states that
      heme is synthesized in the cytoplasm and that the ATP-driven CcmABC heme
      transporter model has been disproven. No evidence supports CcmC importing
      heme into the cytosol.
    supported_by:
    - reference_id: PMID:24044352
      supporting_text: It was thought that CcmABC form a ATP-driven heme transporter,14
        but this has since been disproven.
