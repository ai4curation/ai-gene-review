- id: PMID:16824107
  title: ABC transporter-mediated release of a haem chaperone allows cytochrome c biogenesis.
  findings:
  - statement: Without CcmA or CcmB, holo-CcmE is trapped on CcmC; CcmAB and ATP
      are needed for its release from a CcmA2B1C1 complex.
    supporting_text: In the absence of CcmA or CcmB, holo(haem)CcmE binds to CcmC
      in a stable dead-end complex, indicating high affinity binding of haem to CcmC.
- id: PMID:17419738
  title: Loss of ATP hydrolysis activity by CcmAB results in loss of c-type cytochrome
    synthesis and incomplete processing of CcmE.
  findings:
  - statement: CcmAB ATPase is not needed for heme attachment to CcmE but for subsequent
      handling of holo-CcmE.
    supporting_text: Our results suggest a role for CcmAB in the handling of heme
      by CcmE
- id: PMID:18326572
  title: Topology and function of CcmD in cytochrome c maturation.
  findings:
  - statement: CcmD is a component of the CcmABCD complex and is required for holo-CcmE
      release, but not for CcmC-dependent heme transfer to CcmE.
    supporting_text: CcmD is not necessary for the CcmC-dependent transfer of heme
      to CcmE in the periplasm or for interaction of CcmE with CcmABC.
- id: PMID:19629033
  title: A conserved haem redox and trafficking pathway for cofactor attachment.
  findings:
  - statement: CcmC His60 and His184 are the axial ligands of heme in the purified
      CcmCDE complex, defining the CcmC external heme-binding domain.
    supporting_text: Haem in this holoCcmCDE complex is bound using periplasmic axial
      ligands His60 and His184 of CcmC, establishing that CcmC binds haem
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached; first purification of heme-containing CcmCDE complexes.
- id: PMID:24044352
  title: Probing heme delivery processes in cytochrome c biogenesis System I.
  findings:
  - statement: The CcmABC heme-transporter model is described as disproven.
    supporting_text: It was thought that CcmABC form a ATP-driven heme transporter,14
      but this has since been disproven.
- id: PMID:29518410
  title: Structurally Mapping Endogenous Heme in the CcmCDE Membrane Complex for Cytochrome
    c Biogenesis.
  findings:
  - statement: Heme binds directly to the CcmC WWD domain in a specific orientation
      for covalent attachment to CcmE His130.
    supporting_text: proof that heme directly binds to the WWD domain of CcmC with
      a specific orientation
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached; in vivo heme crosslinking and coevolution-based CcmCDE model.
core_functions:
- description: >-
    Binds heme in its periplasmic WWD domain via axial ligands His60 and His184
    and positions it for covalent attachment to His130 of the heme chaperone
    CcmE, forming holo-CcmE within the CcmCDE complex during system I
    cytochrome c maturation.
