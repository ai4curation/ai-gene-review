    label: catalase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN001247822
  - UniProtKB:Q9I3N5
  review:
    summary: The CcmC-associated catalase phenotype does not resolve intrinsic catalase or direct oxidant-detoxification
      activity.
    action: UNDECIDED
    reason: The PAINT assertion at PTN001247822 is a phylogenetic claim, not weakened by donor count.
      The traceable P. aeruginosa source PMID:18174132 reports undetectable catalase production in a ccmC
      mutant alongside broad heme-related phenotypes. This is compatible with indirect impairment of catalases
      and does not establish CcmC catalysis. Full text could not be accessed, so the previous confident
      source-defect/removal is replaced by uncertainty. The dependent oxidant-detoxification inference
      is likewise unresolved.
    supported_by:
    - reference_id: PMID:18174132
      supporting_text: catalase production was undetectable, consistent with the increased sensitivity
        to hydrogen peroxide.
    propagation_review:
      root_cause: UNRESOLVED
      source_entities:
      - source_id: PANTHER:PTN001247822
        source_status: UNRESOLVED
        comment: This node carries the catalase IBD; no lineage IRD/IKR was reported. The unresolved issue
          is whether the underlying phenotype supports intrinsic catalase chemistry, not donor count or
          family membership.
      - source_id: UniProtKB:Q9I3N5
        source_status: UNRESOLVED
        comment: PMID:18174132 explicitly reports loss of cellular catalase production in a P. aeruginosa
          ccmC mutant. Full source inspection failed; intrinsic enzyme activity cannot be adjudicated
          from this phenotype alone.
