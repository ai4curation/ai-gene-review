- id: PMID:10339610
  title: Heme transfer to the heme chaperone CcmE during cytochrome c maturation requires
    the CcmC protein, which may function independently of the ABC-transporter CcmAB.
  findings:
  - statement: CcmC is the only Ccm protein strictly required for heme attachment
      to CcmE, and is sufficient for it when overexpressed.
    supporting_text: it is the only Ccm protein that is strictly required for heme
      transfer and attachment to CcmE
  - statement: Conserved histidines H60 and H184 are required for CcmC function.
    supporting_text: Both H60 and H184 of CcmC were found to be required for the
      incorporation of heme into CcmE
  - statement: Evidence questions CcmAB as a heme exporter.
    supporting_text: We also present evidence that questions the role of CcmAB as
      a heme exporter; yet, the transported substrate remains unknown.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached; foundational genetic dissection of CcmC versus CcmAB function in E. coli.
- id: PMID:10708391
  title: 'Oxidase and periplasmic cytochrome assembly in Escherichia coli K-12: CydDC
    and CcmAB are not required for haem-membrane association.'
  findings:
  - statement: ccmA deletion does not alter haem uptake kinetics into everted membrane
      vesicles, arguing against CcmAB-mediated haem export.
    supporting_text: suggesting that the activity of neither the CydDC nor CcmAB transporters
      is essential for haem export to the periplasm
- id: PMID:10998170
  title: New insights into the role of CcmC, CcmD and CcmE in the haem delivery pathway
    during cytochrome c maturation by a complete mutational analysis of the conserved
    tryptophan-rich motif of CcmC.
  findings:
  - statement: The tryptophan-rich WGXXWXWD motif in the second periplasmic loop of
      CcmC is required for covalent haem incorporation into CcmE.
    supporting_text: Our results demonstrate the functional importance of the tryptophan-rich
      motif for haem transfer to CcmE.
- id: PMID:11384983
  title: Physical interaction of CcmC with heme and the heme chaperone CcmE during
    cytochrome c maturation.
  findings:
  - statement: CcmC binds heme directly and co-immunoprecipitates with CcmE.
    supporting_text: Here, we report that the CcmC protein directly interacts with
      heme. We further show that CcmC co-immunoprecipitates with CcmE.
