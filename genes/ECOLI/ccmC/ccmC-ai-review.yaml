- term:
    id: GO:0017003
    label: protein-heme linkage
  evidence_type: IDA
  original_reference_id: PMID:29518410
  qualifier: involved_in
  review:
    summary: CcmC positions heme in its WWD domain so that the heme 2-vinyl group is covalently attached
      to His130 of CcmE.
    action: ACCEPT
    reason: Direct crosslinking and structural mapping show heme bound in the CcmC WWD domain in a specific
      orientation for covalent attachment to CcmE; CcmC is necessary and sufficient for covalent heme
      incorporation into CcmE. CcmC therefore does part of the work of forming the heme-protein covalent
      bond (positioning the heme as an active site), not merely being required for it. CcmE is not a cytochrome,
      so the general protein-heme linkage term is the right level rather than cytochrome c-heme linkage.
    supported_by:
    - reference_id: PMID:29518410
      supporting_text: proof that heme directly binds to the WWD domain of CcmC with a specific orientation
    - reference_id: PMID:29518410
      supporting_text: For holoCcmE this trafficking culminates in the covalent attachment of the 2-vinyl
        of heme to the CcmE His130 residue.
    - reference_id: PMID:19629033
      supporting_text: delineating the ‘external haem-binding domain' of CcmC, clearly the active site
        for holoCcmE adduct formation
- term:
    id: GO:0017004
    label: cytochrome complex assembly
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR003557
  - InterPro:IPR045062
  review:
    summary: CcmC participates in c-type cytochrome biogenesis.
    action: MODIFY
    reason: The InterPro mapping captures the right pathway at the wrong term. Cytochrome complex assembly
      describes assembling a complex that contains a cytochrome; CcmC acts upstream, loading heme onto
      CcmE for the synthesis of holocytochrome c. GO:1903607 cytochrome c biosynthetic process, already
      carried with IMP and IBA support, is the appropriate process. The descendant GO:0018063 cytochrome
      c-heme linkage is not chosen because CcmC does not attach heme to apocytochrome c itself (that is
      done by CcmF/CcmH).
    proposed_replacement_terms:
    - id: GO:1903607
      label: cytochrome c biosynthetic process
    supported_by:
    - reference_id: PMID:10339610
      supporting_text: it is the only Ccm protein that is strictly required for heme transfer and attachment
        to CcmE
