- term:
    id: GO:0043190
    label: ATP-binding cassette (ABC) transporter complex
  evidence_type: NAS
  original_reference_id: PMID:24044352
  qualifier: part_of
  review:
    summary: >-
      CcmC is the membrane partner of CcmAB in an ABC-type CcmA2B1C1(D)
      complex that releases holo-CcmE in an ATP-dependent manner.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Membership of CcmC in an ABC-transporter-family complex with CcmA and
      CcmB is experimentally established (copurification and co-IP;
      PMID:16824107, PMID:18326572), so the assignment is not baseless.
      However, GO:0043190 is defined as a complex for transport of metabolites
      into or out of the cell, the cited paper states the transporter model was
      disproven, and the complex's established output is ATP-dependent release
      of holo-CcmE. No GO complex term exists for the CcmABCD heme-chaperone
      release complex (ComplexPortal CPX-3568), so this is flagged as
      over-annotation rather than replaced. Action matches the ccmA, ccmB and
      ccmD reviews.
    supported_by:
    - reference_id: PMID:24044352
      supporting_text: CcmAB has features of an ATP-binding cassette (ABC) protein
        and forms a complex with the membrane protein CcmC.
    - reference_id: PMID:16824107
      supporting_text: Expression of CcmA and CcmB facilitates formation of the
        CcmA2B1C1 complex and ATP-dependent release of holoCcmE.
