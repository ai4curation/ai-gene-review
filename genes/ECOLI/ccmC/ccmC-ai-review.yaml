- term:
    id: GO:0015232
    label: heme transmembrane transporter activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR003557
  review:
    summary: >-
      InterPro2GO assignment reflecting the historical "heme exporter" name of
      the CcmC family.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      CcmC directly binds heme in its periplasmic WWD domain and transfers it
      to CcmE, and later work speaks of CcmC "trafficking" heme. But
      translocation of heme across the membrane by CcmC has never been
      demonstrated: the ABC-transporter heme-export model was questioned by
      direct experiments (PMID:10339610, PMID:10708391) and is described as
      disproven (PMID:24044352). The source of periplasmic heme for CcmC
      remains unresolved, so the transporter MF is not refuted outright but
      overstates current evidence; heme binding (GO:0020037) is the supported
      MF. No E. coli experimental annotation asserts transporter activity. Not
      REMOVE, because CcmC's direct heme contact on the periplasmic side leaves
      a CcmC-mediated membrane passage open as an unproven hypothesis.
    supported_by:
    - reference_id: PMID:24044352
      supporting_text: It was thought that CcmABC form a ATP-driven heme transporter,14
        but this has since been disproven.
    - reference_id: PMID:10339610
      supporting_text: We also present evidence that questions the role of CcmAB
        as a heme exporter; yet, the transported substrate remains unknown.
    - reference_id: PMID:29518410
      supporting_text: System I is composed of eight integral membrane proteins
        (CcmA-H) and is proposed to transport heme via CcmC to an external "WWD"
        domain for presentation to the membrane-tethered heme chaperone, CcmE.
- term:
    id: GO:0015886
    label: heme transport
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
