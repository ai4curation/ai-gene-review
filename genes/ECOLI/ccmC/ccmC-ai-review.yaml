- id: PMID:10339610
  title: Heme transfer to the heme chaperone CcmE during cytochrome c maturation requires the CcmC protein,
    which may function independently of the ABC-transporter CcmAB.
  findings:
  - statement: CcmC is the only Ccm protein strictly required for heme attachment to CcmE, and is sufficient
      for it when overexpressed.
    supporting_text: it is the only Ccm protein that is strictly required for heme transfer and attachment
      to CcmE
  - statement: Conserved histidines H60 and H184 are required for CcmC function.
    supporting_text: Both H60 and H184 of CcmC were found to be required for the incorporation of heme
      into CcmE
  - statement: Evidence questions CcmAB as a heme exporter.
    supporting_text: We also present evidence that questions the role of CcmAB as a heme exporter; yet,
      the transported substrate remains unknown.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Full text cached; foundational genetic dissection of CcmC versus CcmAB function in
      E. coli. Historical evidence/model: its positive loading/release findings remain useful, but any
      blanket exclusion of heme transport must be read alongside conflicting PMID:37626034, PMID:40026579
      and PMID:40167305. This audit does not infer a universally proven conduit.'
- id: PMID:10708391
  title: 'Oxidase and periplasmic cytochrome assembly in Escherichia coli K-12: CydDC and CcmAB are not
    required for haem-membrane association.'
  findings:
  - statement: ccmA deletion does not alter haem uptake kinetics into everted membrane vesicles, arguing
      against CcmAB-mediated haem export.
    supporting_text: suggesting that the activity of neither the CydDC nor CcmAB transporters is essential
      for haem export to the periplasm
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: ' Historical evidence/model: its positive loading/release findings remain useful, but
      any blanket exclusion of heme transport must be read alongside conflicting PMID:37626034, PMID:40026579
      and PMID:40167305. This audit does not infer a universally proven conduit.'
- id: PMID:10998170
  title: New insights into the role of CcmC, CcmD and CcmE in the haem delivery pathway during cytochrome
    c maturation by a complete mutational analysis of the conserved tryptophan-rich motif of CcmC.
  findings:
  - statement: The tryptophan-rich WGXXWXWD motif in the second periplasmic loop of CcmC is required for
      covalent haem incorporation into CcmE.
    supporting_text: Our results demonstrate the functional importance of the tryptophan-rich motif for
      haem transfer to CcmE.
- id: PMID:11384983
  title: Physical interaction of CcmC with heme and the heme chaperone CcmE during cytochrome c maturation.
  findings:
  - statement: CcmC binds heme directly and co-immunoprecipitates with CcmE.
    supporting_text: Here, we report that the CcmC protein directly interacts with heme. We further show
      that CcmC co-immunoprecipitates with CcmE.
- id: PMID:11744735
  title: A bacterial cytochrome c heme lyase. CcmF forms a complex with the heme chaperone CcmE and CcmH
    but not with apocytochrome c.
  findings: []
- id: PMID:15513913
  title: CcmD is involved in complex formation between CcmC and the heme chaperone CcmE during cytochrome
    c maturation.
  findings:
  - statement: CcmC, CcmD and CcmE form a ternary complex.
    supporting_text: We demonstrate the formation of a ternary complex consisting of CcmCDE.
- id: PMID:15919996
  title: Global topology analysis of the Escherichia coli inner membrane proteome.
  findings: []
- id: PMID:16364305
  title: The membrane anchors of the heme chaperone CcmE and the periplasmic thioredoxin CcmG are functionally
    important.
  findings: []
- id: PMID:16824107
  title: ABC transporter-mediated release of a haem chaperone allows cytochrome c biogenesis.
  findings:
  - statement: Without CcmA or CcmB, holo-CcmE is trapped on CcmC; CcmAB and ATP are needed for its release
      from a CcmA2B1C1 complex.
    supporting_text: In the absence of CcmA or CcmB, holo(haem)CcmE binds to CcmC in a stable dead-end
      complex, indicating high affinity binding of haem to CcmC.
- id: PMID:17419738
  title: Loss of ATP hydrolysis activity by CcmAB results in loss of c-type cytochrome synthesis and incomplete
    processing of CcmE.
  findings:
  - statement: CcmAB ATPase is not needed for heme attachment to CcmE but for subsequent handling of holo-CcmE.
    supporting_text: Our results suggest a role for CcmAB in the handling of heme by CcmE
- id: PMID:18326572
  title: Topology and function of CcmD in cytochrome c maturation.
  findings:
  - statement: CcmD is a component of the CcmABCD complex and is required for holo-CcmE release, but not
      for CcmC-dependent heme transfer to CcmE.
    supporting_text: CcmD is not necessary for the CcmC-dependent transfer of heme to CcmE in the periplasm
      or for interaction of CcmE with CcmABC.
- id: PMID:19629033
  title: A conserved haem redox and trafficking pathway for cofactor attachment.
  findings:
  - statement: CcmC His60 and His184 are the axial ligands of heme in the purified CcmCDE complex, defining
      the CcmC external heme-binding domain.
    supporting_text: Haem in this holoCcmCDE complex is bound using periplasmic axial ligands His60 and
      His184 of CcmC, establishing that CcmC binds haem
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached; first purification of heme-containing CcmCDE complexes.
- id: PMID:24044352
  title: Probing heme delivery processes in cytochrome c biogenesis System I.
  findings:
  - statement: The CcmABC heme-transporter model is described as disproven.
    supporting_text: It was thought that CcmABC form a ATP-driven heme transporter,14 but this has since
      been disproven.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: ' Historical evidence/model: its positive loading/release findings remain useful, but
      any blanket exclusion of heme transport must be read alongside conflicting PMID:37626034, PMID:40026579
      and PMID:40167305. This audit does not infer a universally proven conduit.'
- id: PMID:29518410
  title: Structurally Mapping Endogenous Heme in the CcmCDE Membrane Complex for Cytochrome c Biogenesis.
  findings:
  - statement: Heme binds directly to the CcmC WWD domain in a specific orientation for covalent attachment
      to CcmE His130.
    supporting_text: proof that heme directly binds to the WWD domain of CcmC with a specific orientation
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached; in vivo heme crosslinking and coevolution-based CcmCDE model.
- id: PMID:37626034
  title: Architecture of the Heme-translocating CcmABCD/E complex required for Cytochrome c maturation.
  findings:
  - statement: E. coli CcmABCD/E structures support ATP-coupled conformational changes and propose a heme
      floppase mechanism.
    supporting_text: suggest that this unusual ABC transporter acts as a heme floppase
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text read. Recombinant E. coli operon from pEC86; N-terminal Strep-tag II on CcmA,
      expression in BL21(DE3)/C43(DE3). These are expression hosts, not independently established donor
      strains. Detergent structures and ATPase-deficient E154Q states support a model, not a purified
      vectorial heme-flux measurement. The proposed CcmB/CcmC route conflicts with PMID:40167305.
- id: PMID:40167305
  title: Biochemical mapping reveals a conserved heme transport mechanism via CcmCD in System I bacterial
    cytochrome c biogenesis.
  findings:
  - statement: Cysteine/heme crosslinks map a proposed heme acceptance site and transmembrane path through
      E. coli CcmCD.
    supporting_text: do not support a role for CcmB in heme acceptance for System I
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text read. GST:CcmCDE(H130A), engineered CcmC/CcmD cysteine variants and CcmD:FLAG
      trap endogenous-heme contacts; functional maturation is checked in recombinant complete-system assays.
      H130A biases heme occupancy. These are contact/structure-function data, not purified directional
      flux. The authors explicitly reject the CcmB conduit interpretation of PMID:40026579/37626034 and
      propose ATP-independent CcmCD transport plus ATP-dependent CcmE release. Comparative predicted structures
      are not KT2440 functional assays.
- id: PMID:40026579
  title: Complexation of CcmB with CcmACD safeguards heme translocation for cytochrome c maturation.
  findings:
  - statement: CcmB overproduction drives heme efflux in S. oneidensis; E. coli CcmB homolog assays support
      heme handling in heterologous systems.
    supporting_text: Similar results were obtained from E. coli CcmB expressed from the same expression
      system
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text and supplementary Table S2 read. Main deletion strains derive from S. oneidensis
      MR-1. Foreign E. coli CcmB complementation/overproduction and E. coli acrB/chuA heme-sensitivity
      assays are not a purified native CcmABCD transport assay. Table S2 lists cloning/conjugation hosts
      but does not resolve the E. coli CcmB donor strain/accession. AlphaFold/docking/MD do not constitute
      an experimentally observed CcmB heme channel. CcmABCD assembly restrains efflux; the CcmB conduit
      interpretation conflicts with PMID:40167305.
- id: PMID:18174132
  title: Multiple phenotypic alterations caused by a c-type cytochrome maturation ccmC gene mutation in
    Pseudomonas aeruginosa.
  findings:
  - statement: A P. aeruginosa ccmC mutation eliminates detectable catalase production among several pleiotropic
      phenotypes.
    supporting_text: catalase production was undetectable, consistent with the increased sensitivity to
      hydrogen peroxide.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only. The publisher full-text endpoint was attempted but returned403. Loss
      of cellular catalase production does not establish catalase catalysis by CcmC. The full assay and
      PAINT source interpretation remain unresolved; no purified-enzyme negative result is claimed.
