suggested_questions:
- question: 'How does heme reach the periplasmic WWD domain of CcmC: through CcmC itself, through another
    membrane protein, or by diffusion through the membrane?'
- question: What conformational change in CcmC, driven by CcmAB ATP hydrolysis, releases the His60/His184
    axial ligands so that holo-CcmE can leave the complex?
suggested_experiments:
- description: Track the entry route of heme into CcmC using cysteine/heme crosslinking variants placed
    along the transmembrane helices, in strains with and without CcmAB, to test whether heme traverses
    CcmC.
  experiment_type: in vivo heme crosslinking
- description: Determine cryo-EM structures of CcmCDE with bound heme before and after CcmAB-dependent
    ATP hydrolysis to define the release mechanism.
