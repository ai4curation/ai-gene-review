      heme onto CcmE (protein-heme linkage, GO:0017003) within cytochrome c
      biosynthesis (GO:1903607). Marked as over-annotated for consistency with
      the transporter MF row and with the reviewed P. putida ortholog.
    supported_by:
    - reference_id: PMID:29518410
      supporting_text: We conclude that CcmC trafficks heme via its WWD domain and
        propose the structural basis for stereochemical attachment of heme.
