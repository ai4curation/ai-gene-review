suggested_questions:
- question: >-
    Does fusing the TrpC and TrpF domains in TrpCF give any kinetic advantage, such as substrate channelling
    of the labile CdRP, over the separate enzymes of Pseudomonas or yeast?
suggested_experiments:
- description: >-
    Compare the coupled PRAI-IGPS flux of intact TrpCF with an equimolar mixture of the excised domains,
    measuring transient CdRP accumulation.
  experiment_type: enzyme kinetics
