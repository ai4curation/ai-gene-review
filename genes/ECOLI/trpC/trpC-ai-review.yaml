  label: Escherichia coli K-12
description: >-
  trpC of Escherichia coli K-12 encodes the bifunctional TrpCF protein (453 residues), a monomer with
  two (beta/alpha)8-barrel domains for consecutive steps of L-tryptophan biosynthesis. The C-terminal
  TrpF domain (phosphoribosylanthranilate isomerase, EC 5.3.1.24) catalyses the Amadori rearrangement
  of N-(5'-phosphoribosyl)-anthranilate to 1-(2-carboxyphenylamino)-1-deoxy-D-ribulose 5-phosphate (CdRP),
  step 3. The N-terminal TrpC domain (indole-3-glycerol-phosphate synthase, EC 4.1.1.48) converts CdRP
  to indole-3-glycerol phosphate with release of CO2, step 4. The two domains keep their activities when
  excised. The enzyme is the archetype of the TrpC-TrpF fusion found in enteric bacteria.
