    summary: TusE binds the TusBCD complex.
    action: KEEP_AS_NON_CORE
    reason: The interaction is real and functionally important, but TusE is not one of the stoichiometric
      subunits of the TusBCD heterohexamer solved by crystallography; it associates with TusBCD and separately
      with the MnmA-tRNA complex while shuttling sulfur. Part_of the sulfurtransferase complex is therefore
