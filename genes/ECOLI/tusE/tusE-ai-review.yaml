- id: PMID:16387657
  title: Mechanistic insights into sulfur relay by multiple sulfur mediators involved in thiouridine biosynthesis
    at tRNA wobble positions.
  findings:
  - statement: TusE promotes transfer within TusBCD and interacts with MnmA–tRNA; this does not directly
      demonstrate covalent loading of MnmA.
    supporting_text: TusE binds TusBCD complex and stimulates sulfur transfer from TusA to TusD. TusE
      also interacts with an MnmA-tRNA complex.
  - statement: Recombinant E. coli sulfur-relay components reconstitute U34 thiolation; the result supports
      participation beyond mutant necessity.
    supporting_text: Efficient 2-thiouridine formation in vitro was reconstituted with recombinant TusA,
      a TusBCD complex, TusE, and previously identified IscS and MnmA.
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cached abstract consulted; original full text was not recovered. Existing curator assignments
      are not rejected because of inaccessible details.
- id: PMID:39660893
  title: '2-Thiouridine formation in Escherichia coli: a critical review.'
  findings:
  - statement: The 2025 critical review identifies the terminal TusE-to-MnmA covalent handoff as unresolved.
    supporting_text: Consequently, proof that TusE transfers the persulfide directly to MnmA in E. coli
      remains to be definitively provided.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full cached primary/review text consulted. This critical review bounds terminal E. coli
      sulfur chemistry and disputed Fe-S dependence; it is not a new target assay.
core_functions:
- description: TusE is a cytoplasmic sulfur-relay protein involved in C2 thiolation of tRNA wobble uridine.
    It interacts with TusBCD, stimulates sulfur transfer from TusA to TusD, and associates with the MnmA–tRNA
    reaction. Its sulfur-carrier role is supported, while direct transfer of a TusE persulfide onto an
    MnmA cysteine has not been conclusively demonstrated.
