  label: Escherichia coli K-12
description: TusE is a small cytoplasmic sulfur carrier of the DsrC/TusE family and the last carrier of
  the IscS-TusA-TusBCD-TusE-MnmA relay that forms the 2-thio group of 5-methylaminomethyl-2-thiouridine
  (mnm5s2U) at wobble position 34 of tRNA. TusE binds the TusBCD complex, stimulates sulfur transfer from
  TusA to TusD, accepts sulfur from TusD on its C-terminal Cys108, and interacts with the MnmA-tRNA complex
  to deliver sulfur for uridine 2-thiolation.
