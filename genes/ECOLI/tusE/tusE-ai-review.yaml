gene_symbol: tusE
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: TusE is a cytoplasmic sulfur-relay protein involved in C2 thiolation of tRNA wobble uridine.
  It interacts with TusBCD, stimulates sulfur transfer from TusA to TusD, and associates with the MnmA–tRNA
  reaction. Its sulfur-carrier role is supported, while direct transfer of a TusE persulfide onto an MnmA
  cysteine has not been conclusively demonstrated.
