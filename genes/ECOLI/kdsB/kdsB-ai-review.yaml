id: P04951
gene_symbol: kdsB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  KdsB is the CTP:CMP-3-deoxy-D-manno-octulosonate cytidylyltransferase (CMP-KDO synthetase) of Escherichia
  coli. It couples free KDO to CMP from CTP, releasing diphosphate, to give CMP-KDO, the activated sugar
  donor that the Kdo transferase WaaA uses to attach KDO to lipid A in the lipopolysaccharide inner core.
  Crystal structures show that KDO binding closes the active site and positions CTP with Mg2+ ions in
  an arrangement resembling DNA/RNA polymerases. The enzyme is cytosolic and is the last step of the CMP-KDO
  pathway.
