- term:
    id: GO:0019294
    label: keto-3-deoxy-D-manno-octulosonic acid biosynthetic process
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000486365
  - UniProtKB:P04951
  review:
    summary: PAINT places KDO biosynthetic process at PTN000486365.
    action: MODIFY
    reason: >-
      KdsB consumes KDO rather than forming it. GO:0019294 is defined as the pathways "resulting in the
      formation of keto-3-deoxy-D-manno-octulosonic acid", whereas KdsB's reaction is the subject of GO:0033468,
      the formation of CMP-KDO, which is not a descendant of GO:0019294. The gene already carries GO:0033468.
      Lateral correction, not refinement.
    proposed_replacement_terms:
    - id: GO:0033468
      label: CMP-keto-3-deoxy-D-manno-octulosonic acid biosynthetic process
    supported_by:
    - reference_id: file:ECOLI/kdsB/kdsB-uniprot.txt
      record_section: ["CC:PATHWAY"]
      supporting_text: CMP-3-deoxy-D-manno-octulosonate from 3-deoxy-D-manno-octulosonate and CTP
    source_defects:
    - defect_type: WRONG_TERM
      resource: GO_CENTRAL
      record: PANTHER:PTN000486365
      requested_change: REPOINT
      asserted_value: GO:0019294
      corrected_value: GO:0033468
      corrected_label: CMP-keto-3-deoxy-D-manno-octulosonic acid biosynthetic process
      cause: SCOPE_OVER_REACH
      confidence: PROBABLE
      explanation: >-
        The PAINT IBD for GO:0019294 (KDO biosynthetic process) at PTN000486365, seeded by E. coli KdsB,
        propagates to all proteobacterial CMP-KDO synthetases. These enzymes use KDO as a substrate and
        form CMP-KDO, which GO:0033468 describes; GO:0033468 is not a descendant of GO:0019294. The plant
        branch of the same family already carries GO:0033468 at PTN008676269.
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - ROLE_CONFLATION
      source_entities:
      - source_id: PANTHER:PTN000486365
        source_label: PANTHER:PTN000486365
        source_status: SOURCE_BAD
        comment: >-
          The node carries KDO biosynthetic process although its members form CMP-KDO from KDO; GO:0033468
          is the fitting term.
      - source_id: UniProtKB:P04951
        source_label: KdsB
        source_status: SOURCE_BAD
        comment: >-
          The seed is KdsB itself, whose own GO:0019294 row (PMID:2989246) has the same scoping problem.
