id: P23721
gene_symbol: serC
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  SerC (also PdxF/PdxC) is the cytoplasmic, homodimeric, pyridoxal 5'-phosphate-dependent
  class-V aminotransferase (EC 2.6.1.52) of Escherichia coli that serves two biosynthetic
  pathways. In the phosphorylated pathway of L-serine biosynthesis it reversibly transaminates
  3-phosphooxypyruvate with L-glutamate to O-phospho-L-serine. In the DXP-dependent de novo
  pyridoxal 5'-phosphate pathway it transaminates (R)-3-hydroxy-2-oxo-4-phosphooxybutanoate,
  the PdxB product, to 4-(phosphooxy)-L-threonine, the PdxA substrate. Only phosphorylated
  substrates are used. serC insertion mutants require serine, pyridoxine and aromatic compounds,
  the last because serC is the first gene of the serC-aroA operon.
