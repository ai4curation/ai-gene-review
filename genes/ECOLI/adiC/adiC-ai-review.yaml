taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: AdiC (YjdE) is the arginine:agmatine antiporter of the arginine-dependent extreme acid resistance
  system of Escherichia coli. It is a 12-transmembrane-helix inner-membrane protein of the APC (amino
  acid-polyamine-organocation) superfamily that exchanges extracellular L-arginine for agmatine, the product
  of the cytoplasmic arginine decarboxylase AdiA. Because decarboxylation consumes a cytoplasmic proton,
  the coupled AdiA-AdiC cycle acts as a "virtual proton pump" that keeps the cytoplasm above pH 5 during
  extreme acid challenge. AdiC is a homodimer in which each subunit transports independently, and its
  crystal structures (apo, arginine- and agmatine-bound) made it the main structural paradigm of the APC
  superfamily (LeuT-like 5+5 inverted-repeat fold).
