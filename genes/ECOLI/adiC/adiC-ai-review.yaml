- term:
    id: GO:1990451
    label: cellular stress response to acidic pH
  evidence_type: IMP
  original_reference_id: PMID:12867448
  qualifier: involved_in
  review:
    summary: adiC mutants are defective in arginine-dependent acid resistance; complementation restores
      it.
    action: ACCEPT
    reason: 'AdiC does part of the work of the acid response: it imports the AdiA substrate and exports
      the proton-consuming decarboxylation product, which is how the system keeps the cytoplasm above
      pH 5. Mutant and complementation data plus the mechanism support this as the core biological process.'
    supported_by:
    - reference_id: PMID:12867448
      supporting_text: A series of adiC mutants isolated by random mutagenesis and by targeted deletion
        were shown to be defective in arginine-dependent acid resistance. This defect was restored upon
        introduction of an adiC(+)-containing plasmid.
    - reference_id: PMID:14594828
      supporting_text: Strains from which this gene is deleted fail to mount arginine-dependent XAR, and
        they cannot perform coupled transport of arginine and agmatine.
    - reference_id: PMID:19578361
      supporting_text: This multiprotein system keeps the cytoplasm above pH 5 during acid challenge by
        continually pumping protons out of the cell using the free energy of arginine decarboxylation.
