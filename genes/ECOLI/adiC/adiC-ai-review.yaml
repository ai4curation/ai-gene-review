core_functions:
- description: Strictly coupled exchange of extracellular L-arginine for cytoplasmic agmatine across the
    inner membrane, supplying substrate to and removing product from the AdiA arginine decarboxylase so
    that the system exports a virtual proton per cycle during extreme acid stress.
