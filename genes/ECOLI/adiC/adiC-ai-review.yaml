suggested_questions:
- question: How does AdiC select the rare carboxylate-deprotonated Arg+1 species over Arg+2 at pH below
    2, and is the agmatine-releasing outward-open state distinct from the arginine-binding state?
suggested_experiments:
- description: Solve inward-facing structures of AdiC with arginine and agmatine and measure pH-dependent
    exchange kinetics in proteoliposomes to test the dual outward-open mechanism.
  experiment_type: structural biology and reconstituted transport assay
