  label: Escherichia coli K-12
description: MnmA is the cytoplasmic tRNA-specific 2-thiouridylase of the MnmA/TRMU family, an ATP-dependent
  PP-loop enzyme that converts uridine 34 of tRNA(Lys), tRNA(Glu) and tRNA(Gln) to 2-thiouridine (s2U34),
  the first step of 5-methylaminomethyl-2-thiouridine (mnm5s2U34) synthesis. MnmA binds substrate tRNA
  through the anticodon region, activates the uridine C2 by adenylation with ATP, and incorporates sulfur
  supplied by IscS through the TusA-TusBCD-TusE relay, using catalytic Cys102 and the persulfide-bearing
  Cys199. The wobble 2-thio group stabilizes the anticodon and restricts wobble decoding; mnmA mutants
  are viable but show antisuppressor and stress-sensitivity phenotypes.
