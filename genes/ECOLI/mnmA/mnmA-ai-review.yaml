- id: PMID:39660893
  title: '2-Thiouridine formation in Escherichia coli: a critical review.'
  findings:
  - statement: The 2025 critical review identifies the terminal TusE-to-MnmA covalent handoff as unresolved.
    supporting_text: Consequently, proof that TusE transfers the persulfide directly to MnmA in E. coli
      remains to be definitively provided.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full cached primary/review text consulted. This critical review bounds terminal E. coli
      sulfur chemistry and disputed Fe-S dependence; it is not a new target assay.
core_functions:
- description: MnmA is a cytosolic ATP-dependent tRNA-uridine 2-sulfurtransferase that incorporates sulfur
    at C2 of wobble uridine in tRNAs for lysine, glutamate and glutamine. It activates U34 by adenylation
    and couples sulfur utilization to the IscS/Tus sulfur-relay system. The physiological requirement
    for an iron-sulfur cofactor in this D-type MnmA and the chemistry of the terminal sulfur handoff remain
    unresolved.
