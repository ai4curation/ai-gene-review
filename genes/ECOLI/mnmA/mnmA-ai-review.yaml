id: P25745
gene_symbol: mnmA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: MnmA is a cytosolic ATP-dependent tRNA-uridine 2-sulfurtransferase that incorporates sulfur
  at C2 of wobble uridine in tRNAs for lysine, glutamate and glutamine. It activates U34 by adenylation
  and couples sulfur utilization to the IscS/Tus sulfur-relay system. The physiological requirement for
  an iron-sulfur cofactor in this D-type MnmA and the chemistry of the terminal sulfur handoff remain
  unresolved.
