core_functions:
- description: ATP-dependent 2-thiolation of uridine 34 in tRNA(Lys), tRNA(Glu) and tRNA(Gln) via an adenylated
    intermediate, using relay sulfur delivered by TusE on catalytic Cys199.
  supported_by:
  - reference_id: PMID:12549933
    supporting_text: The activity requires MnmA, Mg-ATP, l-cysteine, and the cysteine desulfurase IscS.
  - reference_id: PMID:16871210
    supporting_text: The adenylated RNA intermediate is trapped.
