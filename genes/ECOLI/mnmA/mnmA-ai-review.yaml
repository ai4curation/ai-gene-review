suggested_questions:
- question: Does MnmA accept sulfur from TusE directly onto Cys199, or from IscS persulfide when the Tus
    relay is absent?
suggested_experiments:
- description: Measure s2U34 formation by MnmA with IscS persulfide alone versus the full Tus relay, using
    C199A and TusE C108S variants.
  experiment_type: in vitro reconstitution
