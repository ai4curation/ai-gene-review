suggested_questions:
- question: >-
    Do HemC and HemD (encoded by adjacent genes) associate in E. coli to pass the unstable
    hydroxymethylbilane directly, preventing non-enzymatic cyclization to uroporphyrinogen I?
suggested_experiments:
- hypothesis: HemC and HemD form a transient complex that channels hydroxymethylbilane.
  description: >-
    Test HemC-HemD association by co-purification or crosslinking from E. coli lysates and
    measure the uroporphyrinogen III to I ratio in coupled assays with free versus
    tethered enzymes.
