  label: Escherichia coli K-12
description: >-
  HemC is porphobilinogen deaminase (hydroxymethylbilane synthase) of Escherichia coli. It
  links four molecules of the monopyrrole porphobilinogen head-to-tail, releasing ammonia
  at each step, to form the linear tetrapyrrole hydroxymethylbilane (pre-uroporphyrinogen),
  which HemD then cyclizes to uroporphyrinogen III, the branch point for heme and siroheme.
  The enzyme is a soluble cytosolic monomer that carries its own covalently attached
  dipyrromethane cofactor, assembled from two porphobilinogen units on Cys242; substrate
  units are added to this primer through the ES, ES2 and ES3 intermediates before the
  hexapyrrole is hydrolysed to release hydroxymethylbilane. hemC mutants accumulate
  porphobilinogen and are heme-deficient.
