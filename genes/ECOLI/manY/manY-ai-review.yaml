suggested_questions:
- question: What is the precise substrate specificity profile of ManY compared to other EIIC components?
    Are there additional substrates beyond mannose, glucose, fructose, and GlcNAc?
- question: Is there a more specific GO CC term than "transmembrane transporter complex" (GO:1902495)
    that could capture the specific Man-PTS complex architecture?
- question: What is the relative contribution of the Man-PTS versus PtsG for glucose uptake under physiological
    conditions?
- question: How does the ManY-dependent lambda entry determinant differ mechanistically from sugar recognition
    and from system-level sugar taxis?
suggested_experiments:
- description: Systematic substrate specificity profiling of the ManYZ channel using purified reconstituted
    proteoliposomes to determine the full range of transported sugars.
  hypothesis: The Man-PTS may transport additional sugar substrates beyond mannose, glucose, fructose,
    and N-acetylglucosamine.
- description: Higher resolution cryo-EM structures of ManYZ in different conformational states (with
    and without substrate) to understand the transport mechanism and substrate binding in ManY.
  hypothesis: ManY undergoes conformational changes during substrate translocation that can be captured
    by structural studies.
