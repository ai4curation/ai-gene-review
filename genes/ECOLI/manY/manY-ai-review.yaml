core_functions:
- description: ManY contributes the substrate-binding and membrane-translocation machinery of the assembled
    ManXYZ transporter. The ManYZ structure and counterflow assay establish direct transport work; ManX
    provides the sugar-phosphorylation chemistry. This core does not assign autonomous histidyl phosphotransfer
    to ManY.
