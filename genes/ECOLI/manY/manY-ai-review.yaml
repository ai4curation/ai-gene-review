- id: file:ECOLI/manY/manY-deep-research-falcon.md
  title: 'Falcon (Edison Scientific) deep research report: manY (UniProt P69801), PTS system mannose-specific
    EIIC component in E. coli K-12'
  findings:
  - statement: Seip et al. (1994) explicitly map the E. coli mannose-PTS genes to subunits, confirming
      manY encodes the IIC_Man membrane permease subunit.
    supporting_text: manX, manY, and manZ, genes encoding IIAB\_Man, IIC\_Man, and IID\_Man, respectively.
    reference_section_type: OTHER
  - statement: ManY (IIC_Man) together with ManZ (IID_Man) forms the membrane channel and substrate-binding/translocation
      machinery; both IIC and IID subunits are required for functional membrane transport and certain
      receptor functions.
    supporting_text: forms the **membrane channel and substrate-binding/translocation machinery** responsible
      for selectively transporting sugars across the inner membrane during PTS-mediated uptake
    reference_section_type: OTHER
  - statement: The mannose-family PTS couples transport to phosphorylation in a single group-translocation
      step, with phosphate relayed from PEP through EI->HPr->EIIA->EIIB to the incoming sugar.
    supporting_text: so that **transport and phosphorylation occur in a coupled process**
    reference_section_type: OTHER
  - statement: The ManXYZ/ManY transporter has broad substrate specificity beyond mannose, including glucose,
      mannosamine, N-acetylglucosamine and 2-deoxyglucose, with poor tolerance for substitutions at C-4
      and C-6.
    supporting_text: ManXYZ/ManY is described as mediating PTS uptake/phosphorylation of **mannose** and
      several other sugars/analogs including **glucose**, **mannosamine**, and **N-acetylglucosamine**,
      and it can accommodate certain substitutions (e.g., transport/phosphorylation of **2-deoxyglucose**;
      poor tolerance of substitutions at C-4 and C-6).
    reference_section_type: OTHER
  - statement: ManY requires ManZ for stable, functional membrane complex formation; ManY is thought to
      be unstable in the absence of ManZ, and manY-alone overexpression gives only modest uptake effects.
    supporting_text: authors note **ManY is thought to be unstable in the absence of ManZ**
    reference_section_type: OTHER
  - statement: The cryo-EM ManYZ-microcin E492 structure shows a threefold-symmetric 3:3 assembly with
      mannose localized mid-membrane, supporting ManY as a core inner-membrane structural component of
      the transporter complex.
    supporting_text: 'The complex assembles with **threefold symmetry** and a **3:3 stoichiometry** (3
      MccE492 : 3 ManYZ), with **mannose localized mid-membrane** in the complex.'
    reference_section_type: OTHER
  - statement: The ManYZ (IIC/IID) membrane complex serves as an inner-membrane receptor/gateway, being
      used by the pore-forming bacteriocin microcin E492 in a Trojan-horse entry mechanism.
    supporting_text: Microcin E492** inserts into the cytoplasmic membrane and associates with ManYZ,
      using ManYZ as a receptor in a Trojan-horse entry mechanism
    reference_section_type: OTHER
  - statement: The ManYZ complex is implicated as the inner-membrane receptor for bacteriophage lambda
      entry.
    supporting_text: The ManYZ complex is implicated as an inner-membrane receptor involved in **bacteriophage
      λ** entry
    reference_section_type: OTHER
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Existing genuine Falcon provider report read and preserved. Used for literature leads
      and contextual synthesis; primary publications and structural identity establish core claims independently.
- id: file:analysis/module_audits/bacterial_mannose_pts/ecoli-consultation/evidence.md
  title: E. coli ManXYZ source and construct assessment
  findings:
  - statement: Primary source scope and exact6K1H sequence bridge distinguish catalytic ManX from ManYZ
      binding/translocation, structural counterflow from coupled PTS chemistry, and historical nomenclature
      from modern subunits.
    supporting_text: CoreY and CoreZ clamp the substrate to form the Core domain
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Manual source analysis with primary URLs, acquisition hashes, access limitations and
      independently reproduced sequence comparisons.
