id: P69801
gene_symbol: manY
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: ManY is the EIIC integral inner-membrane subunit of the mannose-family phosphotransferase
  system in Escherichia coli K-12. Together with ManZ, it forms the substrate-binding and translocation
  machinery of the ManYZ membrane complex, which assembles as a trimer of heterodimers. Both membrane
  subunits contribute to the sugar-binding pocket. ManX supplies the histidyl phosphotransfer chemistry
  that couples uptake to sugar phosphorylation in the complete transporter. The system accepts mannose
  and additional hexoses or amino sugars, including glucose, fructose and N-acetylglucosamine. ManYZ also
  supports lambda DNA penetration, independently of the complete sugar-phosphorylation machinery; sugar
  chemotaxis is a separate system-level context.
references:
- id: PMID:2951378
  title: The mannose permease of Escherichia coli consists of three different proteins. Amino acid sequence
    and function in sugar transport, sugar phosphorylation, and penetration of phage lambda DNA.
  findings:
  - statement: The mannose permease consists of three subunits (IIIMan/ManX, II-PMan/ManY, II-MMan/ManZ)
      that are all required for sugar transport and phosphorylation.
    supporting_text: The permease consists of three different subunits, IIIMan, II-PMan, and II-MMan,
      which are encoded in a single transcriptional unit ptsLPM
  - statement: ManY (II-PMan) is very hydrophobic and is an integral membrane protein that forms the transmembrane
      channel together with ManZ (II-MMan).
    supporting_text: II-PMan (28 kDa) is very hydrophobic...Both are integral membrane proteins and most
      likely form the transmembrane channel
  - statement: ManY and ManZ alone are sufficient for lambda DNA penetration.
    supporting_text: II-PMan and II-MMan alone are sufficient for penetration of lambda DNA
  - statement: The Man-PTS mediates sugar transport concomitant with phosphorylation and also functions
      as a chemoreceptor and phage lambda pore.
    supporting_text: The mannose permease of the bacterial phosphotransferase system mediates sugar transport
      across the cytoplasmic membrane concomitant with sugar phosphorylation. It also functions as a receptor
      for bacterial chemotaxis and is required for infection of the cell by bacteriophage lambda where
      it most likely functions as a pore for penetration of lambda DNA
