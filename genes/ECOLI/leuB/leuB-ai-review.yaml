  review:
    summary: >-
      Purified E. coli IPMDH depends on a divalent cation, and Mg2+ is one of
      the two cations that support activity.
    action: KEEP_AS_NON_CORE
    reason: >-
      The cation is a catalytic cofactor of the dehydrogenase rather than an
      independent function. Mn2+ is the preferred cation, so Mg2+ binding is
      retained as non-core cofactor information, as in the PSEPK leuB, yeast
      LEU2 and S. pombe leu1 reviews.
