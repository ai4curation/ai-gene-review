id: P30125
gene_symbol: leuB
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  leuB encodes 3-isopropylmalate dehydrogenase (IPMDH, EC 1.1.1.85), the
  third enzyme of the leucine-specific branch of branched-chain amino acid
  biosynthesis. The soluble, homodimeric enzyme oxidizes
  (2R,3S)-3-isopropylmalate with NAD+ to an unstable 2-oxo acid that
  decarboxylates to 4-methyl-2-oxopentanoate (2-ketoisocaproate), the
  precursor transaminated to L-leucine. Activity requires a divalent cation
  (Mn2+ preferred over Mg2+) and is stimulated by K+. LeuB belongs to the
  isocitrate/isopropylmalate dehydrogenase family (LeuB type 1 subfamily) and
  is encoded in the leuABCD operon. The purified enzyme also oxidizes
  D-malate at a much lower turnover, a promiscuous activity that can support
  growth on D-malate when the enzyme is upregulated.
