- term:
    id: GO:0034198
    label: cellular response to amino acid starvation
  evidence_type: IMP
  original_reference_id: PMID:10220423
  qualifier: acts_upstream_of_or_within
  review:
    summary: >-
      This study used a leuB auxotrophic allele as a reversion reporter to
      show that leucine starvation derepresses the leu operon and raises
      leuB- reversion rates.
    action: REMOVE
    reason: >-
      The abstract states the design explicitly: the measured outputs are leu
      operon derepression, leuB mRNA abundance and reversion of a leuB- allele
      in an auxotroph. The starvation response is executed by ppGpp
      signalling and attenuation acting on the operon; the LeuB enzyme does no
      part of it, and the mutant gene is the object being transcribed and
      mutated, not a participant. The annotation therefore attributes to the
      gene product a property of its DNA locus.
    supported_by:
    - reference_id: PMID:10220423
      supporting_text: >-
        A quantitative correlation was
        established between leuB mRNA abundance and leuB- reversion rates.
    - reference_id: PMID:10220423
      supporting_text: >-
        starvation for leucine in an Escherichia
        coli auxotroph triggers metabolic activities that specifically target the leu
        operon for derepression, increased rates of transcription, and mutation.
