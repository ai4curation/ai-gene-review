- term:
    id: GO:0005524
    label: ATP binding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN001607041
  - UniProtKB:P9WG47
  - UniProtKB:Q8I0X3
  review:
    summary: The established ATP-binding site belongs to ParE, not the ParC DNA-cleavage subunit.
    action: REMOVE
    reason: ParC supplies DNA recognition and cleavage-religation within the complex; the experimentally
      mapped nucleotide-binding/ATPase machinery is on ParE. Whole-enzyme ATP dependence does not establish
      ATP binding by this separate A-type subunit. The IBA at PTN001607041 and electronic family mappings
      overextend the nucleotide-binding claim to the E. coli A-type chain; this is a target architecture
      argument, not a judgment based on donor count. No IRD/IKR lineage loss was found.
    supported_by:
    - reference_id: PMID:15105144
      supporting_text: 'Here, we report the crystal structures of a 43-kDa N-terminal

        fragment of Escherichia coli topoisomerase IV ParE subunit complexed with

        adenylyl-imidodiphosphate at 2.0-A resolution'
    - reference_id: PMID:8227000
      supporting_text: 'The native forms of ParC and ParE were a dimer

        and a monomer, respectively; whereas the active form of Topo IV was a

        heterotetramer, ParC2ParE2.'
    source_defects:
    - defect_type: WRONG_TERM
      resource: GO_CENTRAL
      asserted_value: GO:0005524
      requested_change: CHECK
      cause: SCOPE_OVER_REACH
      confidence: PROBABLE
      explanation: Check propagation of intrinsic ATP binding onto E. coli ParC. Its partner ParE contains
        the experimentally established nucleotide-binding machinery; ATP-dependent activity of the assembled
        topoisomerase is not a subunit ATP-binding assay.
      supported_by:
      - reference_id: PMID:15105144
        supporting_text: 'Here, we report the crystal structures of a 43-kDa N-terminal

          fragment of Escherichia coli topoisomerase IV ParE subunit complexed with

          adenylyl-imidodiphosphate at 2.0-A resolution'
      - reference_id: PMID:8227000
        supporting_text: 'The native forms of ParC and ParE were a dimer

          and a monomer, respectively; whereas the active form of Topo IV was a

          heterotetramer, ParC2ParE2.'
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - ROLE_CONFLATION
      source_entities:
      - source_status: UNRESOLVED
        comment: The ATP-binding assertion descends from this real A-subunit family node. In E. coli the
          ATP-binding machinery resides on the separate B/E subunit; the ancestral evidence needs re-examination
          for complex-to-subunit conflation. This review does not infer an evolutionary loss or judge
          donor-list length.
        source_id: PANTHER:PTN001607041
