- term:
    id: GO:0005694
    label: chromosome
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: located_in
  supporting_entities:
  - InterPro:IPR005742
  review:
    summary: ParC associates with chromosomal DNA during topological transactions.
    action: ACCEPT
    reason: The chromosome-associated location reflects a substrate-bound population of topoisomerase
      IV, not a claim that all molecules are permanently chromosome bound. Chromosomal supercoiling/segregation
      experiments support this association.
    supported_by:
    - reference_id: PMID:18765793
      supporting_text: 'Impairment of TopoIV prevents segregation of

        newly replicated sister loci and bulk chromosome segregation, whereas modest

        increases in TopoIV decrease the cohesion time substantially.'
    - reference_id: PMID:12535532
