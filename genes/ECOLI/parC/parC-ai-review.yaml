- term:
    id: GO:0003916
    label: DNA topoisomerase activity
  evidence_type: IDA
  original_reference_id: PMID:1334483
  qualifier: contributes_to
  review:
    summary: ParC contributes to ATP-dependent double-strand passage by the assembled topoisomerase IV
      complex.
    action: MODIFY
    reason: The complete type IIA topoisomerase activity is established by reconstitution with both subunits,
      not by ParC alone. ParC and ParE together relax and decatenate DNA. Topo IV is not assigned the
      negative-supercoiling activity characteristic of E. coli gyrase. Core functions explicitly record
      the subunit as contributing to the complex activity. The original evidence is corroborated by independent
      reconstitution.
    supported_by:
    - reference_id: PMID:1334483
      supporting_text: 'They revealed type II topoisomerase activity only when they were

        combined with each other.'
    - reference_id: PMID:8227000
      supporting_text: 'The native forms of ParC and ParE were a dimer

        and a monomer, respectively; whereas the active form of Topo IV was a

        heterotetramer, ParC2ParE2.'
    - reference_id: PMID:1334483
    proposed_replacement_terms:
    - id: GO:0003918
      label: DNA topoisomerase type II (double strand cut, ATP-hydrolyzing) activity
