    reason: 'The original PMID is a confirmed citation error: its abstract concerns patients undergoing
      endobronchial ultrasound for metastatic lung tumors. DNA binding by ParC is independently supported
      by PMID:16023670, which EcoliWiki already cites on a second IDA row for the same term, so the
      biological claim is retained while the incorrect reference is flagged. The machine-sourced
      reference identifier is preserved.'
    supported_by:
    - reference_id: PMID:16023670
      supporting_text: 'The N-terminal DNA binding region of ParC is highly similar to that

        of GyrA, but the ParC dimer adopts a markedly different conformation.'
    - reference_id: PMID:18023670
      supporting_text: 'EBUS-TBNA was performed in 60 lymph nodes (37 mediastinal and 23

        hilar nodes) from 43 patients.'
    source_defects:
