id: P0AFI2
gene_symbol: parC
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: ParC is the DNA-binding and cleavage-religation subunit of Escherichia coli topoisomerase
  IV. The ParC2ParE2 complex removes DNA interlinks between replicated sister chromosomes and relaxes
  supercoils, enabling chromosome segregation. ParC contacts DNA and the condensin MukB, while ParE supplies
  the nucleotide-binding and ATPase machinery. ParC is a soluble nucleoid-associated protein with experimentally
  reported conditional association with the inner membrane in the presence of DNA.
