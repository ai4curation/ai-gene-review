    - reference_id: PMID:12975365
      supporting_text: >-
        Single turnover experiments with oxygen-loaded HemF under anaerobic conditions demonstrated electron
        acceptor function for oxygen during the oxidative decarboxylation reaction with the concomitant
        formation of H2O2.
