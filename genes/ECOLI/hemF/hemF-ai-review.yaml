    label: tetrapyrrole binding
  evidence_type: IMP
  original_reference_id: PMID:12975365
  qualifier: enables
  review:
    summary: >-
      EcoCyc IMP for tetrapyrrole binding from the Breckau et al. study, in which HemF acts on coproporphyrinogen
      III, discriminates against protoporphyrinogen IX and coproporphyrin III, and is inhibited by protoporphyrin
      IX.
    action: KEEP_AS_NON_CORE
    reason: >-
      HemF necessarily binds its tetrapyrrole substrate and is inhibited by the tetrapyrrole protoporphyrin
      IX, so the claim is true; it is substrate and inhibitor binding entailed by the oxidase activity
      rather than an independent function.
    supported_by:
    - reference_id: PMID:12975365
      supporting_text: >-
        HemF does not utilize protoporphyrinogen IX or coproporphyrin III as substrates and is inhibited
        by protoporphyrin IX.
