- description: >-
    Oxygen-dependent coproporphyrinogen III oxidase in the cytoplasm: uses O2 as electron acceptor to
    convert coproporphyrinogen III to protoporphyrinogen IX in heme b synthesis, the aerobic and peroxide-stress
    counterpart of HemN.
