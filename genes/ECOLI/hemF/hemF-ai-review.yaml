  label: Escherichia coli K-12
description: >-
  HemF is the oxygen-dependent coproporphyrinogen III oxidase of Escherichia coli K-12 (EC 1.3.3.3), a
  soluble cytoplasmic homodimer. It uses molecular oxygen as electron acceptor to oxidatively decarboxylate
  the propionate side chains of rings A and B of coproporphyrinogen III to vinyl groups, forming protoporphyrinogen
  IX and hydrogen peroxide in the heme b biosynthetic pathway. Activity is lost after metal chelation
  and restored only by manganese, with four conserved histidines implicated in manganese coordination.
  E. coli also has the structurally unrelated, oxygen-independent radical SAM enzyme HemN for the same
  step; either suffices in unstressed aerobic cells, but hemF is induced by the OxyR regulon during hydrogen
  peroxide stress, when this manganese enzyme becomes the critical isozyme for sustaining heme synthesis
  and catalase activation.
