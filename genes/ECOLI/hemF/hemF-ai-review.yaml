    supporting_text: >-
      Single turnover experiments with oxygen-loaded HemF under anaerobic conditions demonstrated electron
      acceptor function for oxygen during the oxidative decarboxylation reaction with the concomitant
      formation of H2O2.
- description: >-
    Binds manganese, the metal that restores activity after chelation and is coordinated by conserved
    histidines.
  molecular_function:
    id: GO:0030145
    label: manganese ion binding
  supported_by:
  - reference_id: PMID:12975365
    supporting_text: >-
      Metal chelator treatment inactivated E. coli HemF. Only the addition of manganese fully restored
      coproporphyrinogen III oxidase activity.
suggested_questions:
- question: >-
    Is manganese a catalytic cofactor of E. coli HemF or a stimulatory/structural metal, given that the
    paper proposes both metal-dependent and metal-independent routes?
suggested_experiments:
- hypothesis: >-
    Mn(2+) bound by His96/His106/His145/His175 is present in HemF isolated from peroxide-stressed cells
    and is required for turnover.
  description: >-
    Determine the metal content (ICP-MS) and activity of HemF purified from wild-type and OxyR-induced
    cells grown with defined Mn and Fe, and of His-to-Ala variants.
