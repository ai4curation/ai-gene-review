  review:
    summary: >-
      Breckau et al. 2003 purified recombinant E. coli HemF and measured coproporphyrinogen III oxidase
      activity (Km 2.6 uM, kcat 0.17 min-1, pH optimum 6), showed that O2 is essential and acts as electron
      acceptor with formation of H2O2, and that the enzyme does not use protoporphyrinogen IX or coproporphyrin
      III.
    action: ACCEPT
