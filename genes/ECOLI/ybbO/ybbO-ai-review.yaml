- term:
    id: GO:0052650
    label: all-trans-retinol dehydrogenase (NADP+) activity
  evidence_type: IMP
  original_reference_id: PMID:25726762
  review:
    summary: >-
      In E. coli engineered to make retinal from beta-carotene, retinol formation was
      traced to ybbO, and ybbO overexpression increased the retinol share of retinoids.
      An independent group found that deleting ybbO stopped reduction of retinal to
      retinol and raised retinal and retinoic acid titres (PMID:34361955), and a third
      that knocking out ybbO prevents retinal loss (PMID:41093029).
    action: NEW
    reason: >-
      Three independent groups attribute cellular retinal-to-retinol reduction to ybbO by
      deletion and overexpression, and YbbO is used as a heterologous retinal reductase in
      yeast. This is the characteristic activity of the vertebrate SDR9C retinol
      dehydrogenases (RDH16, RDH5) in the same PANTHER family, so it is a plausible
      family-level capability rather than an artefact. The NADPH cofactor is inferred
      from YbbO's demonstrated strict NADPH dependence with other aldehydes
      (PMID:25108218); retinal reduction has not been assayed with the purified enzyme.
      E. coli makes no retinoids, so this is a substrate capacity, not a physiological
      role; it is not proposed as a core function or process.
    supported_by:
    - reference_id: PMID:25726762
      supporting_text: Retinol was produced by the ybbO gene of E. coli which encodes oxidoreductase
    - reference_id: PMID:25726762
      supporting_text: The composition of retinol, a commercially important retinoid, was
        significantly increased by the overexpression of ybbO gene
    - reference_id: PMID:34361955
      supporting_text: deletion of the ybbO gene, which decreased retinoic acid titer through
        the reduction of retinal to retinol
    - reference_id: PMID:41093029
      supporting_text: knocking out aldehyde reductase ybbO could prevent retinal loss
