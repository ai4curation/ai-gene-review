    label: alcohol dehydrogenase (NADP+) activity
  evidence_type: IDA
  original_reference_id: PMID:25108218
  qualifier: enables
  review:
    summary: >-
      Purified YbbO reduced C2-C10 aldehydes (acetaldehyde, isobutyraldehyde, hexanal,
      octanal, decanal) with NADPH but not NADH, highest on hexanal and octanal.
    action: ACCEPT
    reason: >-
      Direct in vitro assay of the purified enzyme showing NADPH-dependent aldehyde
      reduction, the reverse direction of GO:0008106. The activity was about 10-fold lower
      than that of DkgA and YahK, so short and medium-chain aldehydes are probably not the
      preferred substrates (long-chain aldehydes are better, PMID:27134112), but the
      molecular function is directly demonstrated and is the core activity of the protein.
    supported_by:
