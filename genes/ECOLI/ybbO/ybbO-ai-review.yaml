core_functions:
- description: >-
    NADPH-dependent reduction of aliphatic aldehydes to primary alcohols, broad chain-length
    range with preference for long-chain (C16-C18) fatty aldehydes; also reduces
    all-trans-retinal in engineered cells. Physiological substrate unknown.
  molecular_function:
    id: GO:0008106
    label: alcohol dehydrogenase (NADP+) activity
  supported_by:
  - reference_id: PMID:25108218
    supporting_text: Enzymes were also tested for cofactor specificity (NADH and NADPH),
      and all five appear to be strictly NADPH dependent with the substrates tested.
  - reference_id: PMID:27134112
    supporting_text: Enzyme kinetic study revealed that YbbO has wide substrate specificity
      ranging from C6 to C18 aldehyde, with maximum affinity and efficiency for C18 and C16
      chain length aldehyde, respectively.
suggested_questions:
- question: >-
    What is the physiological substrate of YbbO? All activity data come from engineered
    strains overproducing fatty aldehydes or retinal. Does YbbO reduce endogenous
    lipid-derived aldehydes (for example from phospholipid or acyl-CoA turnover, given the
    adjacent tesA), or act on a hydroxysteroid-like secondary alcohol as other SDR9C members
    do?
- question: >-
    Is the 13-residue N-terminal extension of P0AFP4 (MTHKATEILTGKV) translated? Most
    Enterobacterales orthologues, including Salmonella STM0505, start at the equivalent of
    Met14.
suggested_experiments:
- description: >-
    Kinetic analysis of purified YbbO with all-trans-retinal, 4-hydroxynonenal and other
    lipid-peroxidation aldehydes, and C16/C18 fatty aldehydes, in both reductive (NADPH) and
    oxidative (NADP+) directions; combined with untargeted metabolomics of a ybbO deletion
    strain to find accumulating endogenous aldehydes.
  experiment_type: biochemical assay and metabolomics
- description: >-
    N-terminal proteomics (or start-codon mutagenesis with a C-terminal tag) to determine
    whether translation of ybbO begins at Met1 or Met14.
  experiment_type: proteomics
