- term:
    id: GO:0008106
    label: alcohol dehydrogenase (NADP+) activity
  evidence_type: IDA
  original_reference_id: PMID:27134112
  qualifier: enables
  review:
    summary: >-
      Kinetic characterisation of YbbO as an NADP(H)-dependent aldehyde reductase with
      C6-C18 aldehydes, best affinity for C18 and best efficiency for C16; deletion removed
      >90% of long-chain fatty alcohol production in engineered strains, restored by
      plasmid-borne ybbO.
    action: ACCEPT
    reason: >-
      Independent enzymological evidence for the same activity, extending the substrate
      range to long-chain fatty aldehydes, where YbbO performs best. Only the abstract is
      cached, but it states the kinetic study and the cofactor dependence directly, and it
      agrees with PMID:25108218. Core function.
    supported_by:
