id: P0AFP4
gene_symbol: ybbO
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  YbbO is a cytoplasmic classical short-chain dehydrogenase/reductase (SDR) of the SDR9C
  (17beta-hydroxysteroid/retinol dehydrogenase-like) family, with a Rossmann-fold
  NAD(P)-binding domain and the conserved Asn-Ser-Tyr-Lys catalytic tetrad (proton acceptor
  Tyr159). Purified YbbO is a strictly NADPH-dependent aldehyde reductase that reduces a
  broad range of aliphatic aldehydes (C2 to C18) to primary alcohols, with low turnover on
  short and medium chains and the highest affinity and efficiency for long-chain (C16-C18)
  fatty aldehydes; deletion of ybbO abolishes most long-chain fatty alcohol formation in
  engineered strains. YbbO also reduces all-trans-retinal to retinol in vivo, consistent with
  the retinol dehydrogenase activity of its vertebrate SDR9C relatives. Its physiological
  substrate and biological role in E. coli are unknown; it is not required for
  glutaraldehyde tolerance. The ybbO gene lies between cnoX (ybbN) and tesA and is conserved
  as a one-to-one orthologue across Enterobacterales.
