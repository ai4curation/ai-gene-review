suggested_questions:
- question: What is the in vivo stoichiometry of LptA in a functional Lpt bridge,
    one LptA, two head-to-tail molecules, or a variable number, and does it change
    with periplasm width?
- question: How does LptA abundance or turnover sense whether the bridge is assembled
    (LptA is degraded when LptC or a correctly assembled LptDE is missing), and
    which protease is responsible?
suggested_experiments:
- experiment_type: in situ structural analysis
  description: Use cryo-electron tomography or in-cell crosslinking mass spectrometry
    with LptA variants of defined length to determine how many LptA molecules span
    the periplasm in native cells.
- experiment_type: protease genetics
  description: Screen periplasmic protease mutants for stabilization of LptA in
    LptC- or LptD-defective backgrounds to identify the quality-control pathway that
    degrades unbridged LptA.
