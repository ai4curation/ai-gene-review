- term:
    id: GO:0009279
    label: cell outer membrane
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  supporting_entities:
  - PANTHER:PTN002194456
  - UniProtKB:P0ADV1
  review:
    summary: Phylogenetic propagation of outer-membrane association, with E. coli
      LptA itself among the descendant evidence. Native-level E. coli LptA co-fractionates
      with outer-membrane fractions because it docks on the periplasmic N-terminal
      domain of LptD.
    action: KEEP_AS_NON_CORE
    reason: LptA has no membrane anchor and is a periplasmic bridge protein, but
      at native levels it is membrane-associated and fractionates with the OM through
      its LptD contact (PMID:20446753). The term is therefore not wrong for its
      peripheral association, but the defining location of LptA is the periplasm
      (GO:0030288), so outer-membrane association is kept as non-core. This differs
      from the P. putida orthologue review, where the same term arrived only by
      IEA without organism-specific fractionation evidence.
    supported_by:
    - reference_id: PMID:20446753
      supporting_text: Remarkably, LptA was also found to co-fractionate almost exclusively
        with these OM fractions (Figure 2B).
    - reference_id: PMID:22668317
      supporting_text: This protein has been proposed to physically link the IM and
        the OM because it is the only periplasmic Lpt component without a membrane
        tether and because it fractionates with both membranes.
