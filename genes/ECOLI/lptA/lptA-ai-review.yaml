core_functions:
- description: Periplasmic beta-jellyroll bridge protein that receives LPS from
    the inner-membrane LptC and conveys it along a continuous protein bridge to the
    N-terminal domain of the outer-membrane translocon LptD, enabling ATP-driven
    LPS delivery to the cell surface.
  molecular_function:
    id: GO:0140332
    label: lipopolysaccharide transfer activity
