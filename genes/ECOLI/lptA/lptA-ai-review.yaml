    label: lipopolysaccharide transport system
  supported_by:
  - reference_id: PMID:29449493
    supporting_text: This complex uses ATP hydrolysis to extract LPS from the outer
      leaflet of the inner membrane and transfer it to LptC and then to a periplasmic
      protein LptA
  - reference_id: PMID:20720015
    supporting_text: In vitro, LptA can displace lipopolysaccharide from LptC (but
      not vice versa), consistent with their locations and their proposed placement
      in a unidirectional export pathway.
  - reference_id: PMID:22668317
    supporting_text: We have shown how periplasmic LptA contacts both LptC at the
      IM and the N-terminal domain of LptD at the OM, creating a continuous bridge
      of anti-parallel β-strands between the membranes
  - reference_id: PMID:18480051
