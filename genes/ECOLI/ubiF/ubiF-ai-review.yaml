suggested_questions:
- question: >-
    Why does E. coli use the flavin enzyme UbiF while many other proteobacteria
    (for example Pseudomonas) use the di-iron Coq7 for the same hydroxylation,
    and do organisms carrying both ever use them under different oxygen regimes?
suggested_experiments:
- hypothesis: UbiF and Coq7 are functionally interchangeable inside the E. coli Ubi metabolon.
  description: >-
    Replace ubiF with P. aeruginosa coq7 at the native locus, measure Q8 and
    demethoxy-Q8 levels, and test whether Coq7 co-purifies with the Ubi complex.
