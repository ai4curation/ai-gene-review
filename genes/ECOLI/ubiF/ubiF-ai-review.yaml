id: P75728
gene_symbol: ubiF
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  UbiF is the FAD-dependent monooxygenase that performs the last ring
  hydroxylation of aerobic ubiquinone-8 biosynthesis in Escherichia coli. It
  hydroxylates 2-octaprenyl-3-methyl-6-methoxy-1,4-benzoquinol
  (demethoxyubiquinol-8, the UbiE product) at the remaining free ring carbon
  (C6 in ubiquinone numbering, often called C5 in older E. coli literature) to
  give 3-demethylubiquinol-8, which UbiG then O-methylates to ubiquinol-8. UbiF
  is a paralogue of UbiH and UbiI in the UbiH/COQ6 family of class A
  flavoprotein monooxygenases and is unrelated to the di-iron Coq7 enzymes that
  catalyse the same reaction in many other proteobacteria and in mitochondria.
  ubiF mutants accumulate 2-octaprenyl-3-methyl-6-methoxy-1,4-benzoquinone and
  fail to grow on succinate. UbiF is one of the seven proteins of the soluble
  cytoplasmic Ubi metabolon (UbiE, UbiF, UbiG, UbiH, UbiI, UbiJ, UbiK).
