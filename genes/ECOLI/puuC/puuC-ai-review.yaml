  label: Escherichia coli K-12
description: >-
  PuuC (AldH) is a broad-specificity NAD(P)+-dependent aldehyde dehydrogenase of Escherichia coli K-12
  and the third enzyme of the Puu putrescine utilization pathway. It oxidizes 4-(gamma-L-glutamylamino)butanal
  to 4-(gamma-L-glutamylamino)butanoate, and it also oxidizes the other aldehydes of putrescine catabolism,
  4-aminobutanal (redundantly with PatD) and succinate semialdehyde (redundantly with GabD). NAD+ is preferred
  over NADP+. In vitro it acts on many aliphatic and aromatic aldehydes, with 3-hydroxypropanal the best
  substrate tested. It is a member of the ALDH superfamily with the conserved catalytic cysteine nucleophile
  and glutamate general base.
