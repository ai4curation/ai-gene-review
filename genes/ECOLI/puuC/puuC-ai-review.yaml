- id: PMID:22636776
  title: Pathway and enzyme redundancy in putrescine catabolism in Escherichia coli.
  findings:
  - statement: >-
      PuuC oxidizes all aldehydes of putrescine catabolism and is redundant with PatD (gamma-aminobutyraldehyde)
      and GabD (succinic semialdehyde).
    supporting_text: >-
      PuuC is a nonspecific aldehyde dehydrogenase that oxidizes all the aldehydes in putrescine catabolism.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Genetic and biochemical analysis of pathway redundancy; abstract cached.
