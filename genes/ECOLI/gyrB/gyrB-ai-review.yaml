  review:
    summary: GyrB-dependent DNA topology influences transcription from chromosomal templates.
    action: KEEP_AS_NON_CORE
    reason: The transcriptional role is a template-topology contribution of gyrase, not RNA polymerase
      catalysis. PMID15535863 experimentally examines transcription after loss of chromosomal supercoiling.
