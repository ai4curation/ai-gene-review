- term:
    id: GO:0016887
    label: ATP hydrolysis activity
  evidence_type: IC
  original_reference_id: PMID:6094559
  review:
    summary: gyrB supplies ATP hydrolysis that powers the topoisomerase cycle.
    action: NEW
    reason: The intrinsic nucleotide-processing activity is missing from the seeded annotations and is
      distinct from contributing to the complete DNA strand-passage reaction. Isolated GyrB has measurable
      ATPase activity, strongly stimulated by GyrA and DNA, and mutation separates hydrolysis from binding.
    supported_by:
    - reference_id: PMID:6094559
      supporting_text: 'In the absence of DNA we show that the gyrase B protein alone

        has a very low level of ATPase activity which can be increased many-fold by

        pretreatment of the B protein with heat or urea.'
    - reference_id: PMID:9756859
      supporting_text: 'Mutation of Glu42 to Ala in the B subunit of DNA gyrase abolishes ATP hydrolysis

        but not nucleotide binding.'
