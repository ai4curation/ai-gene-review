- term:
    id: GO:0003918
    label: DNA topoisomerase type II (double strand cut, ATP-hydrolyzing) activity
  evidence_type: EXP
  original_reference_id: PMID:12051842
  qualifier: enables
  review:
    summary: GyrB contributes to ATP-dependent double-strand passage by the assembled gyrase complex.
    action: ACCEPT
    reason: The complete type IIA topoisomerase activity is established by reconstitution with both subunits,
      not by GyrB alone. Gyrase both introduces negative supercoils and relaxes supercoils; the type-II
      activity term is retained to cover this catalytic repertoire rather than reducing every assay to
      negative supercoiling. Core functions explicitly record the subunit as contributing to the complex
      activity. The original evidence is corroborated by independent reconstitution.
    supported_by:
    - reference_id: PMID:347446
      supporting_text: 'The same ratio of subunits gives efficient reconstitution

        of the reactions intrinsic to DNA gyrase, including catalysis of supercoiling of

        closed duplex DNA, relaxation of supercoiled DNA in the absence of ATP, and

        site-specific cleavage of DNA induced by sodium dodecyl sulfate.'
    - reference_id: PMID:12051842
