- term:
    id: GO:0006261
    label: DNA-templated DNA replication
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: involved_in
  supporting_entities:
  - UniRule:UR000056593
  review:
    summary: GyrB supports replication by resolving torsional stress through gyrase.
    action: ACCEPT
    reason: Gyrase directly performs the topological transformations needed for replication fork progression.
      Reconstituted replication distinguishes its relief of positive supercoiling from the decatenation
      role preferentially executed by Topo IV.
    supported_by:
    - reference_id: PMID:8104339
      supporting_text: 'These results suggest that during DNA replication, gyrase acts

        primarily to relieve accumulated positive supercoiling and Topo IV acts to

        segregate the daughter chromosomes.'
    - reference_id: PMID:42133467
