id: P0AES6
gene_symbol: gyrB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: GyrB is the ATPase and TOPRIM-containing subunit of Escherichia coli DNA gyrase. It assembles
  with GyrA into an A2B2 enzyme that introduces negative supercoils and relieves positive supercoiling
  during chromosome replication and transcription. GyrB binds and hydrolyzes ATP, coordinates catalytic
  metal ions, and supports DNA engagement and cleavage-religation within the complex. The intrinsic ATPase
  is strongly stimulated by GyrA and DNA; GyrB alone does not execute the complete topoisomerase reaction.
