  label: Escherichia coli K-12
description: 'ThrB is the ATP-dependent homoserine kinase of Escherichia coli, producing O-phospho-L-homoserine
  for threonine synthesis. It is a soluble GHMP-family enzyme and is competitively inhibited by threonine
  at the homoserine-binding site. It can phosphorylate some homoserine analogues in vitro, but neither
  L-threonine nor L-serine is its native substrate.'
existing_annotations:
- term:
    id: GO:0004413
    label: homoserine kinase activity
  evidence_type: IDA
  original_reference_id: PMID:177283
  qualifier: enables
  review:
    action: ACCEPT
    summary: ThrB transfers the terminal phosphate of ATP to L-homoserine.
    reason: PMID:177283 purifies native E. coli homoserine kinase and measures homoserine/threonine 
      competition and magnesium effects. Threonine inhibition is competitive rather than cooperative
      allostery. Together with the target reaction characterization in PMID:8973190, this 
      establishes ATP-dependent phosphohomoserine formation.
    supported_by:
    - reference_id: PMID:8973190
      supporting_text: "Homoserine kinase, an enzyme in the aspartate pathway of amino acid biosynthesis\n\
        in Escherichia coli, catalyzes the conversion of L-homoserine to L-homoserine\nphosphate."
    - reference_id: PMID:177283
      supporting_text: L-Threonine is a competitive inhibitor of the substrate L-homoserine; this 
        inhibition is straighforward and shows no sign of co-operativity.
