  review:
    action: ACCEPT
    summary: ThrB has a curator-assigned cytosolic localization from the native K-12 proteome study.
    reason: PMID:15911532 examines native E. coli K-12 under two growth conditions using biochemical
      fractionation, two-dimensional gels and tandem mass spectrometry. The cached abstract
      documents that method but does not name thrB or show its individual protein spot. The target
      cytosol assignment is retained as an experimentally curated native localization, corroborated
      by the separate PMID:18304323 annotation; the target identification table was not
      independently reinspected. The quote below supports the original study context, not a newly
      verified target-specific hit.
    supported_by:
    - reference_id: PMID:15911532
      supporting_text: 2,160 were annotated and assigned to the cytosol, periplasm, inner membrane,
