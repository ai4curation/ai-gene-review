  label: Escherichia coli K-12
description: 'ThrB is the ATP-dependent homoserine kinase of Escherichia coli, producing O-phospho-L-homoserine
  for threonine synthesis. It is a soluble GHMP-family enzyme and is competitively inhibited by threonine at
  the homoserine-binding site. It can phosphorylate some homoserine analogues in vitro, but neither L-threonine
  nor L-serine is its native substrate.'
