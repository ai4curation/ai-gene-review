    action: MODIFY
    summary: ThrB phosphorylates homoserine during threonine biosynthesis.
    reason: The curated pathway places ThrB at step 4 of threonine synthesis from aspartate. Its
      homoserine-kinase reaction produces O-phosphohomoserine for threonine synthase, supporting the
      biosynthetic descendant rather than an unspecified threonine metabolic role.
