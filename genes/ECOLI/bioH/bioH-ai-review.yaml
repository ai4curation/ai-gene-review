core_functions:
- description: >-
    BioH hydrolyses the methyl ester of pimeloyl-ACP methyl ester (installed by
    BioC) to give pimeloyl-ACP and methanol, completing the BioC-BioH route that
    supplies the seven-carbon pimelate precursor for de novo biotin biosynthesis.
  molecular_function:
    id: GO:0090499
    label: pimelyl-[acyl-carrier protein] methyl ester esterase activity
  directly_involved_in:
  - id: GO:0009102
    label: biotin biosynthetic process
  supported_by:
  - reference_id: file:ECOLI/bioH/bioH-uniprot.txt
    supporting_text: >-
      The physiological role of BioH is to remove the methyl group introduced by
      BioC when the pimeloyl moiety is complete.
  - reference_id: PMID:20693992
    supporting_text: >-
      which is hydrolyzed to pimeloyl-ACP and methanol by BioH.
