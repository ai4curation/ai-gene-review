  label: Escherichia coli K-12
description: >-
  BioH is the pimeloyl-[acyl-carrier protein] methyl ester esterase
  (EC 3.1.1.85) of Escherichia coli K-12, a cytoplasmic alpha/beta-hydrolase
  (AB hydrolase superfamily) with a Ser82-His235-Asp207 catalytic triad. It
  hydrolyses the methyl ester that BioC installs, converting pimeloyl-ACP methyl
  ester to pimeloyl-ACP and methanol once the seven-carbon pimelate chain has
  been assembled by the fatty-acid synthase. This demethylation is the second
  pathway-specific step of the BioC-BioH route that supplies the pimeloyl-ACP
  precursor for de novo biotin biosynthesis. Purified BioH also acts as a broad
  short-chain carboxylesterase on surrogate substrates (p-nitrophenyl esters,
  and the simvastatin-pathway thioester DMB-S-MMP), reflecting the same catalytic
  triad acting on non-physiological substrates. BioH is a monomer; its gene lies
  outside the bioABFCD operon.
