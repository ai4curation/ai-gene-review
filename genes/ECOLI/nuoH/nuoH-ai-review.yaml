core_functions:
- description: Eight-helix membrane subunit of proton-pumping NDH-1 (complex I) that
    anchors the peripheral arm to the membrane arm, frames the entry of the enclosed
    quinone-binding chamber and forms the first half-channel of the glutamate-rich
    E-channel proton pathway. It thereby contributes to the NADH:ubiquinone oxidoreductase
    activity of the assembled complex and to coupling quinone reduction with proton
    translocation across the cytoplasmic membrane in aerobic respiration.
  contributes_to_molecular_function:
    id: GO:0008137
    label: NADH dehydrogenase (ubiquinone) activity
  directly_involved_in:
