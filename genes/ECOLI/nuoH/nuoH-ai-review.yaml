gene_symbol: nuoH
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  NuoH (NADH-quinone oxidoreductase subunit H; ND1/Nqo8 homologue) is a
  325-residue, eight-transmembrane-helix integral cytoplasmic-membrane subunit
  of the proton-pumping NADH:quinone oxidoreductase NDH-1 (respiratory complex
  I). It is the most conserved membrane subunit of complex I and forms the main
  contact between the peripheral arm (NuoB, NuoCD) and the membrane arm. NuoH
  frames the entry of the enclosed quinone-binding chamber, and a hydrophilic
  cavity runs from the quinone site into its centre, ending at an invariant
  glutamate; despite lacking clear sequence homology it contains a five-helix
  structural repeat like the antiporter-like subunits and forms the first
  half-channel of the glutamate-rich "E-channel", the proton pathway closest to
  the quinone site that is completed by NuoJ/NuoK. NuoH has no redox cofactors;
  within the assembled complex it contributes to the coupling of NADH-to-quinone
  (ubiquinone-8 or menaquinone-8) electron transfer with proton translocation
  across the cytoplasmic membrane, and nuo mutants lack complex I-dependent
  respiration.
