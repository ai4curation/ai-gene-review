    supporting_text: Membrane-embedded NuoH mediates interaction with the peripheral
      arm and also contains five-helix structural repeat found in antiporter-like subunits
  - reference_id: PMID:23417064
    supporting_text: Thus, the first half-channel formed by Nqo8 is linked to the second
      half-channel in Nqo10/11
  - reference_id: PMID:10587449
    supporting_text: The preparation comprises all subunits and known cofactors and
      exhibits a high enzymatic activity and inhibitor sensitivity.
suggested_questions:
- question: Does NuoH directly bind the quinone headgroup or tail during catalysis
    (UniProt notes that this subunit may bind ubiquinone), and does it discriminate
    between ubiquinone-8 and menaquinone-8 in E. coli?
- question: Does the invariant NuoH Glu157 exchange protons with bound quinol, and
    is protonation of this residue part of the coupling step that drives the E-channel?
suggested_experiments:
- description: Chromosomal site-directed mutagenesis of NuoH Glu157 and the E. coli-specific
    His208, with measurement of deamino-NADH:decylubiquinone activity, proton pumping
    in inverted membrane vesicles and photo-affinity quinone-analogue labelling, to
    test whether NuoH contributes to quinone binding and to proton exchange with
    the Q-site.
