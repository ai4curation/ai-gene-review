suggested_questions:
- question: Which native E. coli exported proteins are most dependent on SecD and the PMF-coupled SecDF-YajC
    accessory route rather than on SecA alone?
suggested_experiments:
- description: Quantitatively compare precursor accumulation and export kinetics after acute SecD depletion
    across defined periplasmic and outer-membrane substrates.
  hypothesis: SecDF-YajC dependence is strongest for a substrate-specific subset whose late translocation
    is vulnerable to backsliding at low PMF.
  experiment_type: acute depletion export kinetics
