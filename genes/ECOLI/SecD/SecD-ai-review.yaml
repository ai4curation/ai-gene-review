  supporting_entities:
  - InterPro:IPR005791
  review:
    summary: SecD contributes to PMF-coupled translocation rather than ATP hydrolysis.
    action: MODIFY
    reason: 'The InterPro ATPase mapping is mechanistically wrong for SecD/SecF: SecA hydrolyzes ATP,
      while SecD and SecF contribute to a PMF-dependent transporter activity in the accessory complex.'
    proposed_replacement_terms:
    - id: GO:0009977
      label: proton motive force dependent protein transmembrane transporter activity
    supported_by:
    - reference_id: PMID:21562494
      supporting_text: we have shown that SecDF is a component of the Sec machinery that utilizes the
        PMF to complete protein translocation after the ATP-dependent SecA function
    - reference_id: PMID:29718185
      supporting_text: SecDF is a protein-translocation factor, which is different from the ATP-driven
        SecA motor
