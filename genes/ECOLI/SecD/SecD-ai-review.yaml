taxon:
  id: NCBITaxon:83333
  label: Escherichia coli (strain K12)
description: SecD is the large multi-pass inner-membrane subunit of the E. coli SecDF-YajC accessory assembly.
  Together with SecF, it couples proton-motive-force-dependent conformational changes to late completion
  of SecYEG-mediated protein translocation after the ATP-driven SecA stage.
