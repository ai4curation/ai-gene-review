  supporting_entities:
  - UniProtKB:P07395
  review:
    summary: The row records a physical interaction, but GO:0005515 protein binding is too generic to
      describe SecDF-YajC accessory function.
    action: REMOVE
    reason: The SecD interaction itself is not rejected, but GO:0005515 does not describe the PMF-coupled
      SecDF-YajC accessory role. This generic interaction row should be removed in favor of the more informative
      Sec transport and Sec-complex annotations.
    supported_by:
    - reference_id: file:ECOLI/SecD/SecD-notes.md
      supporting_text: Generic protein-binding IPI rows for SecD should be removed as uninformative interaction
        records, not because the reported interactions are false.
