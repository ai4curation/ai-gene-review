  - SGD:S000005654
  - UniProtKB:P09029
  review:
    summary: PurK makes N5-CAIR; it does not carboxylate AIR to CAIR directly.
    action: MODIFY
    reason: GO:0004638 is the direct, ATP-independent AIR + CO2 = CAIR reaction of class II PurE. E. coli
      PurK catalyses only the ATP-dependent formation of N5-CAIR from AIR and bicarbonate; PurE then makes
      CAIR. The pathway position is right but the chemistry is wrong, so the row is corrected to the N5-CAIR
      synthetase activity, as in the P. putida purK review and the PTHR11609 family review.
    proposed_replacement_terms:
    - id: GO:0034028
      label: 5-(carboxyamino)imidazole ribonucleotide synthase activity
    supported_by:
    - reference_id: PMID:8117684
      supporting_text: PurK is shown, by NMR spectroscopy, to catalyze the conversion of AIR in the presence
        of HCO3- and ATP to ADP, P(i), and the carbamate of AIR (designated N5-CAIR).
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
