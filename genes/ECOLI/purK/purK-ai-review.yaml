id: P09029
gene_symbol: purK
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: PurK is the N5-carboxyaminoimidazole ribonucleotide (N5-CAIR) synthetase of Escherichia coli,
  a homodimeric ATP-grasp enzyme that uses MgATP and bicarbonate to carboxylate the exocyclic amine of
  aminoimidazole ribonucleotide (AIR), forming N5-CAIR. PurE then rearranges N5-CAIR to CAIR; together
  the two enzymes perform AIR carboxylation, step 6 of de novo IMP biosynthesis. PurK has no counterpart
  in animals.
