  label: Escherichia coli K-12
description: >-
  NagZ is a cytoplasmic glycoside hydrolase family 3 beta-N-acetylglucosaminidase
  that acts in peptidoglycan recycling. It cleaves the terminal beta-1,4-linked
  N-acetylglucosamine from the GlcNAc-1,6-anhydro-MurNAc(-peptide) muropeptides
  that are released by lytic transglycosylases and imported into the cytoplasm,
  releasing free GlcNAc and the 1,6-anhydro-MurNAc-peptide. This step separates
  the amino-sugar components of the imported fragment and, together with the
  AmpD amidase, feeds the downstream sugar- and peptide-salvage arms. Because the
  anhydro-MurNAc-peptide product is the signalling effector for AmpC beta-lactamase
  induction, NagZ activity modulates inducible beta-lactam resistance.
