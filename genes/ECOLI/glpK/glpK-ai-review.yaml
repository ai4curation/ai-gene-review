id: P0A6F3
gene_symbol: glpK
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  glpK encodes the soluble cytosolic glycerol kinase of Escherichia coli K-12 (EC 2.7.1.30). This FGGY-family
  ATP-dependent kinase phosphorylates glycerol to form sn-glycerol 3-phosphate and ADP, trapping glycerol
  that enters the cell through the GlpF facilitator and supplying the substrate that GlpD oxidizes to
  dihydroxyacetone phosphate. Purified E. coli enzyme also phosphorylates dihydroxyacetone and L-glyceraldehyde
  in vitro with lower affinity than glycerol; D-glyceraldehyde instead stimulates ATP cleavage without
  detectable stable D-glyceraldehyde 3-phosphate. GlpK exists as functional dimers in reversible equilibrium
  with tetramers. Its activity is the control point for glucose repression of glycerol use: fructose 1,6-bisphosphate
  binds the tetramer and inhibits it, and unphosphorylated EIIA-Glc of the glucose phosphotransferase
  system binds both dimer and tetramer and inhibits their activity (inducer exclusion). A Zn(II) ion bridging
  an EIIA-Glc histidine pair and a GlpK glutamate strengthens that regulatory complex.
