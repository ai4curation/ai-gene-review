- term:
    id: GO:0046872
    label: metal ion binding
  evidence_type: IDA
  original_reference_id: PMID:5335908
  qualifier: enables
  review:
    summary: >-
      EcoCyc metal ion binding row from the 1967 purification paper. Divalent
      metal is bound in two places in E. coli GlpK structures: Mg(II) or Mn(II)
      with the nucleotide in the catalytic site, and Zn(II) at the
      EIIA-Glc interface.
    action: KEEP_AS_NON_CORE
    reason: >-
      The 1967 paper predates the zinc structure (1994) and its cache is
      metadata only, so the cation it tested cannot be read here; it was
      almost certainly the divalent cation required with ATP. The structures
      show Mg (1BWF, 1GLC) or Mn (1GLD) bound with the nucleotide in the
      catalytic site, checked against RCSB. Because Mg and Mn both occupy that
      site and the separate zinc site is interfacial, metal ion binding is as
      precise as the evidence allows: MODIFY to zinc ion binding would assign
      the 1967 result to a site discovered later, and magnesium ion binding is
      not specific to the deposited structures. The metal is the cofactor of
      the ATP substrate and does not define the function, so the row is kept
      as non-core.
    supported_by:
    - reference_id: file:ECOLI/glpK/glpK-hypotheses/function-hypothesis-go-0008270/openscientist.md
      supporting_text: the catalytic divalent metal observed is magnesium (or manganese), never zinc.
    - reference_id: PMID:8170944
      supporting_text: |-
        The zinc is coordinated by the two active-site histidines of
        IIIGlc, a glutamate of glycerol kinase, and a water molecule.
