- term:
    id: GO:0008270
    label: zinc ion binding
  evidence_type: IDA
  original_reference_id: PMID:8170944
  qualifier: enables
  review:
    summary: >-
      Zn(II) stabilizes the regulatory complex between GlpK and
      unphosphorylated EIIA-Glc, with GlpK supplying a single glutamate ligand
      to an intermolecular zinc site.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The crystal structure shows that the zinc site exists only in the
      GlpK-EIIA-Glc complex: EIIA-Glc supplies two histidines, GlpK one
      glutamate (UniProt FT BINDING 479, "ligand shared with EIIA-Glc"). Free
      GlpK is not a zinc-binding protein, and catalysis is Mg-ATP dependent.
      The OpenScientist PDB census (checked here against RCSB for 1BWF, 1GLC
      and 1GLD) finds zinc only in the two complex structures. Zinc ion
      binding as a standalone GlpK activity therefore goes beyond the evidence;
      the zinc is a property of the regulatory interface.
    supported_by:
    - reference_id: PMID:8170944
      supporting_text: |-
        Structural and kinetic analyses
        show that the complex of IIIGlc with glycerol kinase creates an intermolecular
        Zn(II) binding site with ligation identical to that of the zinc peptidase
        thermolysin.
    - reference_id: PMID:8170944
      supporting_text: |-
        The zinc is coordinated by the two active-site histidines of
        IIIGlc, a glutamate of glycerol kinase, and a water molecule.
    - reference_id: file:ECOLI/glpK/glpK-hypotheses/function-hypothesis-go-0008270/openscientist.md
      supporting_text: zinc appears **only** in the two GlpK·IIAGlc complex structures and **never** in standalone GlpK
