- term:
    id: GO:0046872
    label: metal ion binding
  evidence_type: IDA
  original_reference_id: PMID:5335908
  qualifier: enables
  review:
    summary: Refine general metal binding to catalytic magnesium and conditional regulatory zinc binding.
    action: MODIFY
    reason: Magnesium supports the glycerol-kinase reaction, and independent structural/kinetic studies
      establish a zinc-binding regulatory interface to which GlpK contributes a glutamate ligand. These
      two supported metal-binding roles refine the broad term. The 1967 enzyme assay also reports manganese
      substitution, and PDB1GLD contains manganese; neither result establishes an evolved manganese-binding
      role. The manganese descendant is omitted from this refinement without denying measured occupancy
      or in-vitro substitution. Regulatory zinc is conditional on the EIIA-Glc complex and is not reinterpreted
      as the catalytic cofactor.
