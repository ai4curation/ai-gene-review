- description: >-
    ATP-dependent glycerol kinase catalyzing phosphorylation of cytosolic
    glycerol to sn-glycerol 3-phosphate, the committed intracellular step of
    bacterial glycerol catabolism; the activity is allosterically inhibited by
    fructose 1,6-bisphosphate and by unphosphorylated EIIA-Glc.
  supported_by:
  - reference_id: PMID:8631672
    supporting_text: |-
      Escherichia coli glycerol kinase (EC 2.7.1.30; ATP:glycerol
      3-phosphotransferase) is a key element in glucose control of glycerol
      metabolism.
  - reference_id: PMID:8631672
    supporting_text: |-
      Its catalytic activity is inhibited allosterically by the glycolytic
      intermediate, fructose 1,6-biphosphate, and by the phosphotransferase system
      phosphocarrier protein, IIIGlc (also known as IIAGlc).
  - reference_id: PMID:8432702
    supporting_text: The glycerol facilitator is thought to act as a carrier or to form a selective pore in the cytoplasmic membrane, whereas the kinase traps the glycerol inside the cell as sn-glycerol-3-phosphate.
  - reference_id: file:ECOLI/glpK/glpK-uniprot.txt
