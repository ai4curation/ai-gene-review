taxon:
  id: NCBITaxon:83333
  label: Escherichia coli (strain K12)
description: >-
  glpK encodes the soluble cytosolic glycerol kinase of Escherichia coli K-12.
  This FGGY-family ATP-dependent kinase phosphorylates glycerol to form
  sn-glycerol 3-phosphate and ADP, trapping imported glycerol and committing it
  to the GlpD branch of glycerol catabolism. E. coli GlpK is an allosteric
  dimer/tetramer whose catalytic activity is inhibited by fructose
  1,6-bisphosphate and by the unphosphorylated glucose phosphotransferase
  system protein EIIA-Glc, coupling glycerol utilization to central carbon
  status.
