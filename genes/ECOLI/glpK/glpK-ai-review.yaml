      cation.
suggested_questions:
- question: >-
    Is the GlpK-EIIA-Glc zinc site occupied at physiological free Zn(II)
    concentrations in E. coli, or is it a crystallization/assay phenomenon that
    only strengthens inducer exclusion in vitro?
- question: >-
    Does the stimulation of GlpK by the GlpF facilitator reported from uptake
    kinetics reflect a direct, stable GlpF-GlpK interaction at the inner
    membrane?
suggested_experiments:
- description: >-
    Measure EIIA-Glc inhibition of GlpK in vivo in strains with altered zinc
    homeostasis (e.g. znuABC or zntA mutants), combined with GlpK Glu479Ala (UniProt P0A6F3 numbering,
    the zinc ligand at FT BINDING 479), to test
    whether the interfacial zinc contributes to inducer exclusion in cells.
  experiment_type: genetic and biochemical assay
