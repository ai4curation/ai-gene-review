core_functions:
- description: Processive 3'-to-5' phosphorolytic degradation of RNA in mRNA decay and RNA quality control,
    as part of the RNase E degradosome.
  molecular_function:
    id: GO:0004654
    label: polyribonucleotide nucleotidyltransferase activity
  directly_involved_in:
  - id: GO:0006402
    label: mRNA catabolic process
  - id: GO:0006401
    label: RNA catabolic process
  locations:
  - id: GO:0005829
    label: cytosol
  in_complex:
    id: GO:1990061
    label: bacterial degradosome
  supported_by:
  - reference_id: file:ECOLI/pnp/pnp-uniprot.txt
    record_section: ["CC:FUNCTION"]
    supporting_text: Catalyzes the phosphorolysis of single-stranded polyribonucleotides processively
      in the 3'- to 5'- direction.
  - reference_id: PMID:18812438
    supporting_text: 'the constricted central channel and the basic-charged residues in the

      channel necks of PNPase play crucial roles in trapping RNA for processive

      exonucleolytic degradation'
suggested_questions:
- question: GO:0000175 3'-5'-RNA exonuclease activity is_a GO:0016896 (hydrolysis yielding 5'-phosphomonoesters),
    yet it is the community-standard term for phosphorolytic PNPases (bacterial pnp, human PNPT1) and
    RNase PH. Should GO make GO:0000175 mechanism-neutral (moving the hydrolysis parent to a hydrolytic
    child), or should phosphorolytic exoribonucleases be annotated only to GO:0004654? This review modifies
    GO:0000175 to GO:0004654 pending that decision; the human PNPT1 review currently accepts GO:0000175.
suggested_experiments:
- hypothesis: Degradosome-bound and free PNPase pools differ in substrate class.
  description: Compare PNPase CLIP targets in wild type and an RNase E mutant lacking the PNPase-binding
    microdomain.
