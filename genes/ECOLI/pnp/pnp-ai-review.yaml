id: P05055
gene_symbol: pnp
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: Polynucleotide phosphorylase (PNPase, pnp) is a homotrimeric, ring-shaped 3'-to-5' exoribonuclease
  of Escherichia coli that degrades single-stranded RNA processively by phosphorolysis, releasing nucleoside
  diphosphates, and can also act as a polymerase. It is a core component of the RNA degradosome, bound
  to the C-terminal scaffold of RNase E and assisted by the RhlB helicase on structured substrates, and
  it contributes to mRNA decay, rRNA quality control, small-RNA turnover and 3' maturation of tRNA precursors.
existing_annotations:
- term:
    id: GO:0000175
    label: 3'-5'-RNA exonuclease activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - AGI_LocusCode:AT3G03710
  - AGI_LocusCode:AT5G14580
  - PANTHER:PTN000134193
  - UniProtKB:P05055
  - UniProtKB:Q8TCS8
  review:
    summary: PAINT IBA (PTN000134193) for 3'-5'-RNA exonuclease activity.
    action: MODIFY
    reason: PNPase degrades RNA 3'->5' by phosphorolysis (RNA(n+1) + phosphate -> RNA(n) + NDP). GO:0000175
      is_a GO:0016896 'RNA exonuclease activity, producing 5'-phosphomonoesters', defined as 'Catalysis
      of the hydrolysis of ester linkages within ribonucleic acids by removing nucleotide residues from
      the 3' or 5' end to yield 5' phosphomonoesters', so the term asserts a hydrolytic mechanism PNPase
      does not use. The correct term, GO:0004654 polyribonucleotide nucleotidyltransferase activity, is
      already accepted in this review. GO:0000175 is the community-standard term for PNPases, so this
      is an ontology question for GO (see suggested_questions), not an annotator error.
    proposed_replacement_terms:
    - id: GO:0004654
      label: polyribonucleotide nucleotidyltransferase activity
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - ROLE_CONFLATION
      source_entities:
      - source_id: PANTHER:PTN000134193
        source_label: PANTHER:PTN000134193
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: The node correctly asserts PNPase catalysis; the hydrolytic exonuclease term mis-scopes
          the phosphorolytic mechanism for every descendant.
      - source_id: UniProtKB:P05055
        source_label: UniProtKB:P05055
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: E. coli PNPase is itself an experimental seed (IDA PMID:7509797); its activity is phosphorolytic.
    supported_by:
    - reference_id: file:ECOLI/pnp/pnp-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: Catalyzes the phosphorolysis of single-stranded polyribonucleotides processively
        in the 3'- to 5'- direction.
    - reference_id: file:ECOLI/pnp/pnp-uniprot.txt
      record_section: ["CC:CATALYTIC ACTIVITY"]
      supporting_text: RNA(n+1) + phosphate = RNA(n) + a ribonucleoside 5'- diphosphate
