    action: REMOVE
    reason: The IPR022894 mapping reflects the shared DnaQ-like fold with oligoribonuclease, not substrate
      specificity. Exonuclease I is characterized as a single-strand DNA-specific enzyme (PMID:23609540,
      PMID:11101894) and no RNA exonuclease activity has been reported for it; the mapping over-propagates
      an RNase activity to a DNA-specific member of the superfamily.
