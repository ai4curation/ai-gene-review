- term:
    id: GO:0051575
    label: 5'-deoxyribose-5-phosphate lyase activity
  evidence_type: IDA
  original_reference_id: PMID:1329027
  qualifier: enables
  review:
    summary: Purified ExoI carries a deoxyribophosphodiesterase (dRpase) activity that releases sugar-phosphate
      remnants from incised AP sites.
    action: MARK_AS_OVER_ANNOTATED
    reason: The dRpase activity was measured on purified ExoI and is genetically linked to sbcB, so it
      is real in vitro. However, GO:0051575 describes a beta-elimination lyase acting on a 5'-terminal
      deoxyribose phosphate, whereas ExoI is a hydrolytic Mg2+-dependent 3'-5' exonuclease of the DnaQ
      superfamily, and the abstract does not establish a lyase mechanism. Its physiological importance
      in base excision repair has not been shown, and ExoI is not the only enzyme reported to remove such
      residues. Retained as an in vitro activity of uncertain relevance rather than a core function.
    supported_by:
    - reference_id: PMID:1329027
      supporting_text: a major dRpase activity in E. coli is associated with the exonuclease I protein
    - reference_id: PMID:1329027
      supporting_text: it catalyzes the release of deoxyribose-5-phosphate from an AP site incised with
        endonuclease IV of E. coli
    - reference_id: file:ECOLI/sbcB/sbcB-uniprot.txt
      record_section:
      - CC:FUNCTION
      supporting_text: Also functions as a DNA deoxyribophosphodiesterase that releases deoxyribose-phosphate
        moieties following the cleavage of DNA at an apurinic/apyrimidinic (AP) site
