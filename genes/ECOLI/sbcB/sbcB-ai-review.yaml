id: P04995
gene_symbol: sbcB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: Exonuclease I (ExoI, SbcB) is a monomeric, Mg2+-dependent 3'-to-5' exonuclease of Escherichia
  coli that processively degrades single-stranded DNA to 5'-mononucleotides. A C-shaped three-domain structure
  (a DnaQ-like nuclease domain, an SH3-like domain and a helical domain) encloses the ssDNA under a crossover
  loop. ExoI is recruited to ssDNA by the C-terminal tail of single-stranded DNA-binding protein. It is
  one of the redundant exonucleases that excise the error-containing strand in methyl-directed mismatch
  repair, acting when the strand break lies 3' to the mismatch. It also processes intermediates in recombination
  and in the completion of chromosome replication at converging forks, and suppresses the RecF recombination
  pathway (sbcB mutations).
