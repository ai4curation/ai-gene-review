  review:
    summary: 'IBA from PTN000534381: DNA endonuclease activity, seeded only by M. tuberculosis RecA (P9WHJ3).'
    action: REMOVE
    reason: The only seed, P9WHJ3, is translated as a precursor carrying the PI-MtuI intein, a self-splicing
      homing endonuclease; the measured endonuclease activity belongs to the excised intein, not to the
      recombinase. The PTHR45900 family review assesses this node assignment as WRONG_NODE and the term
      as NOT_APPLICABLE to any RecA. E. coli RecA has no intein and no reported nuclease activity; its
      curated activities are ssDNA binding, ATP hydrolysis, pairing and strand exchange. The IBA is therefore
      wrong for E. coli.
