id: P0A7G6
gene_symbol: recA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: RecA is the Escherichia coli homologous recombinase and the central regulator of the SOS
  DNA-damage response. The protein binds single-stranded DNA and, in its ATP-bound form, polymerizes into
  a helical nucleoprotein filament (the presynaptic filament) that is loaded onto ssDNA by RecBCD at chi
  sites on broken DNA ends or by RecFOR at postreplication gaps, displacing SSB. The filament searches
  for homology and catalyses ATP-dependent homologous pairing and DNA strand exchange, driven by DNA-stimulated
  ATP hydrolysis, which underlies recombinational repair of double-strand breaks, collapsed forks and
  daughter-strand gaps as well as conjugational and transductional recombination. The activated filament
  (RecA*) also acts as a co-protease that stimulates autocleavage of the LexA repressor, derepressing
  the SOS regulon, and later of UmuD (to UmuD') and the phage lambda cI repressor. RecA-ATP transferred
  from the 3' end of RecA* is a subunit of the active DNA polymerase V mutasome (UmuD'2C-RecA-ATP) that
  performs mutagenic translesion synthesis. RecA is a soluble cytoplasmic protein; it also contributes
  to swarming motility independently of SOS induction.
