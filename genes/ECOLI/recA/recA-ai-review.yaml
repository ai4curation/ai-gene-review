- term:
    id: GO:0000730
    label: DNA recombinase assembly
  evidence_type: IDA
  original_reference_id: PMID:9230304
  qualifier: involved_in
  review:
    summary: RecA polymerizes on ssDNA to form the presynaptic filament, including the RecBCD-directed
      loading at Chi; this row is not in GOA and is proposed here.
    action: NEW
    reason: GO defines DNA recombinase assembly as the aggregation of strand exchange proteins into
      higher-order oligomers on single-stranded DNA. RecA is the recombinase, and it does part of the
      work, because its ATP-dependent nucleation and polymerization build the filament. RecBCD or RecFOR
      only direct where nucleation occurs. GO annotates recombinases that assemble themselves to this
      term as well as their mediators, for example S. pombe rad51 and dmc1 by IDA. The module's
      RecA tail-binding annoton asserts this process.
