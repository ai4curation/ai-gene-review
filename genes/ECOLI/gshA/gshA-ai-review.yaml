  label: Escherichia coli K-12
description: >-
  Glutamate--cysteine ligase (gamma-glutamylcysteine synthetase, GshA) of Escherichia coli,
  a 518-residue cytosolic type-1 enzyme of the glutamine-synthetase-like fold. It catalyses
  the ATP-dependent ligation of L-glutamate and L-cysteine to gamma-L-glutamyl-L-cysteine,
  the first and rate-limiting step of glutathione synthesis; GshB then adds glycine. The
  purified enzyme binds two active-site divalent metal ions, is feedback-inhibited by
  glutathione and, unlike eukaryotic GCLC, lacks an active-site thiol and is relatively
  resistant to buthionine sulfoximine. gshA mutants lack glutathione but grow normally in
  minimal medium; they are sensitised to chemical stresses such as mercury and arsenite and
  are impaired in osmotolerance at high osmolarity. GshA is unrelated in sequence to the
  eukaryotic GCLC family.
