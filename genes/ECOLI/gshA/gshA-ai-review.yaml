suggested_questions:
- question: >-
    Which divalent cation occupies each of the two GshA metal sites in vivo, and does the
    weaker site regulate amino-acid substrate binding under physiological Mg2+/Mn2+ ratios?
suggested_experiments:
- hypothesis: The second, weaker GshA metal site is occupied by Mn2+ under manganese-replete conditions and tunes cysteine selectivity.
  description: >-
    Measure metal occupancy of GshA purified from cells grown in defined Mg2+/Mn2+ media
    (ICP-MS) and compare kinetic selectivity for cysteine versus poor substrates.
