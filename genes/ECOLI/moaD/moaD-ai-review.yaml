suggested_questions:
- question: Which sulfurtransferase route (IscS directly, or IscS via TusA or another persulfide
    carrier) thiocarboxylates MoaD-AMP in E. coli under aerobic and anaerobic growth?
suggested_experiments:
- hypothesis: Different sulfur relay proteins load MoaD under aerobic and anaerobic conditions.
  description: Measure MoaD thiocarboxylation and MPT levels in iscS, tusA and related mutants
    grown aerobically and anaerobically, using mass spectrometry of affinity-purified MoaD.
