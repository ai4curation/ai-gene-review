id: P30748
gene_symbol: moaD
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  MoaD is the small sulfur-carrier subunit of molybdopterin (MPT) synthase in Escherichia coli,
  an 81-residue protein with a ubiquitin-like beta-grasp fold and a conserved C-terminal Gly-Gly
  motif. Its terminal Gly81 is first adenylated by the E1-like enzyme MoeB, within a transient
  MoeB2-MoaD2 heterotetramer, and the acyl-adenylate is then converted to a thiocarboxylate by a
  sulfurtransferase system supplied by the cysteine desulfurase IscS. Thiocarboxylated MoaD then
  binds MoaE to form the MoaD2-MoaE2 MPT synthase, inserting its C terminus into the MoaE active
  site, and donates the two sulfurs that form the dithiolene of molybdopterin from cyclic
  pyranopterin monophosphate (precursor Z). MoaD therefore shuttles between the MoeB and MoaE
  complexes during catalysis. It acts in the cytosol, is encoded in the moaABCDE operon
  (historical alleles chlM/chlA4), and is the bacterial counterpart of human MOCS2A.
