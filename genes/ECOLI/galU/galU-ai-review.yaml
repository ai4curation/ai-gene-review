core_functions:
- description: >-
    Cytosolic homotetrameric UTP--glucose-1-phosphate uridylyltransferase that forms
    UDP-alpha-D-glucose and pyrophosphate from UTP and alpha-D-glucose 1-phosphate.
    It is the cell's source of UDP-glucose, the glucosyl donor for the LPS core,
    osmoregulated periplasmic glucans, trehalose and colanic acid, and the
    co-substrate of the Leloir pathway.
  molecular_function:
    id: GO:0003983
    label: UTP:glucose-1-phosphate uridylyltransferase activity
  directly_involved_in:
  - id: GO:0120530
    label: UDP-alpha-D-glucose biosynthetic process
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:7961613
    supporting_text: >-
      The recombinant enzyme overproduced in E. coli cells and purified to homogeneity
      catalyzed the synthesis and pyrophosphorolysis of UDP-glucose by a sequential
      mechanism.
  - reference_id: PMID:17322528
    supporting_text: >-
      Glucose-1-phosphate uridylyltransferase, also referred to as UDP-glucose
      pyrophosphorylase or UGPase, catalyzes the formation of UDP-glucose from
      glucose-1-phosphate and UTP.
  - reference_id: PMID:330527
    supporting_text: >-
      Mutants unable to synthesize UDP-glucose do not contain significant amounts of
      the membrane-derived oligosaccharides.
  - reference_id: PMID:18304323
    supporting_text: >-
      we identified 1103 proteins from the cytosolic fraction of the Escherichia coli
      strain MC4100
proposed_new_terms: []
suggested_questions:
- question: >-
    Does GalF form mixed oligomers with GalU in E. coli K-12, and does it change GalU
    kinetics or UDP-glucose levels under osmotic or stationary-phase stress?
- question: >-
    How is the UDP-glucose made by GalU partitioned among LPS core, OPG, trehalose,
    colanic acid and galactose metabolism, and does GalU activity limit any of these
    fluxes?
- question: >-
    Which residues coordinate Mg2+ in E. coli GalU, and does the disordered,
    positively charged Glu83-Arg88 loop contribute to the active site of the
    neighbouring subunit?
suggested_experiments:
- experiment_type: structural biology
  description: >-
    Determine GalU crystal or cryo-EM structures with UTP-Mg2+, glucose 1-phosphate
    and UDP-glucose bound, and test the predicted Gln109, Asp137, Glu201, Lys202 and
    loop-83-88 residues by site-directed mutagenesis and steady-state kinetics.
- experiment_type: metabolomics
  description: >-
    Quantify UDP-glucose pools and downstream products (LPS core, OPG, trehalose,
    colanic acid) in wild-type, galU, galF and galU galF strains under osmotic stress
    and in stationary phase.
