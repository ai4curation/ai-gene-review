- id: PMID:26617591
  title: On the Ancestral UDP-Glucose Pyrophosphorylase Activity of GalF from Escherichia
    coli.
  findings:
  - statement: >-
      GalF derives from a catalytic ancestor and retains residual UDP-glucose
      pyrophosphorylase activity, very low compared to GalU.
    supporting_text: >-
      We demonstrated that GalF has some residual UDP-glucose pyrophosphorylase
      activity by in vitro and in vivo experiments
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Abstract and full text verified; supersedes the 1996 claim that GalF is
      catalytically inactive (PMID:8971705) and agrees with the PTHR43197 family
      review.
- id: PMID:8971705
  title: The GalF protein of Escherichia coli is not a UDP-glucose pyrophosphorylase
    but interacts with the GalU protein possibly to regulate cellular levels of UDP-glucose.
  full_text_unavailable: true
  findings:
  - statement: >-
      Extracts of a galU mutant that produces only GalF showed no UDP-glucose
      pyrophosphorylase activity, and GalF plasmids did not complement galU
      (E. coli O7:K1).
    supporting_text: >-
      GalF-expressing plasmids cannot complement the phenotype of a galU mutant
      and extracts from this mutant which only produces GalF are enzymatically
      inactive
    finding_review:
      finding_status: DISPUTED
      superseded_by:
      - PMID:26617591
      review_notes: >-
        The later study detects low residual GalF activity in vitro and in vivo
        (complementation on over-expression), so GalF is near-inactive rather
        than catalytically dead.
      supported_by:
      - reference_id: PMID:26617591
        supporting_text: >-
          We demonstrated that GalF has some residual UDP-glucose pyrophosphorylase
          activity by in vitro and in vivo experiments
  - statement: >-
      GalF interacts physically with GalU and modulates UDP-glucose
      pyrophosphorylase properties (E. coli O7:K1).
    supporting_text: >-
      The physical interaction of GalU and GalF was demonstrated in vivo by the
      co-expression of both proteins as fusion products using a yeast two-hybrid
      system.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Abstract verified; strain O7:K1, not K-12. Its inactivity finding is
      disputed by PMID:26617591 (see finding_review).
