gene_symbol: galU
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  galU encodes UTP--glucose-1-phosphate uridylyltransferase (UDP-glucose
  pyrophosphorylase, UGPase, EC 2.7.7.9), the enzyme that makes UDP-alpha-D-glucose
  in Escherichia coli K-12. GalU is a soluble cytosolic homotetramer (a dimer of
  dimers) of the prokaryotic UGPase family, which shares the nucleotidyltransferase
  fold of RmlA glucose-1-phosphate thymidylyltransferase and is unrelated in sequence
  and structure to eukaryotic UDP-glucose pyrophosphorylases. It transfers UMP from
  Mg-UTP to alpha-D-glucose 1-phosphate, releasing pyrophosphate, by a sequential
  mechanism. The reaction is reversible in vitro, and the enzyme is inhibited by free
  UTP and pyrophosphate; purified GalU also accepts several other sugar
  1-phosphates. GalU is the only significant source of UDP-glucose in the cell, so
  galU mutants lack it. UDP-glucose is the glucosyl donor for the lipopolysaccharide
  core (galU mutants are deep rough), membrane-derived (osmoregulated periplasmic)
  oligosaccharides, osmoprotective trehalose, and the colanic acid exopolysaccharide.
  It is also the catalytic co-substrate of the Leloir pathway, so galU mutants cannot
  ferment galactose. UDP-glucose levels set by GalU have also been linked to
  regulation of the stationary-phase sigma factor RpoS. The paralog GalF, which
  retains only very low residual UDP-glucose pyrophosphorylase activity, can
  associate with GalU and modulate its activity.
