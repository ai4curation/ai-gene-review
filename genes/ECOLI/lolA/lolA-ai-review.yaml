id: P61316
gene_symbol: lolA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  lolA encodes the soluble periplasmic outer-membrane lipoprotein carrier of
  Escherichia coli. LolA is recruited by the LolC subunit of the inner-membrane
  LolCDE ABC complex, accepts mature outer-membrane-destined lipoproteins
  released by LolCDE, shields their lipid anchor in a hydrophobic cavity while
  crossing the periplasm, and transfers them mouth-to-mouth to the
  outer-membrane receptor LolB, which incorporates them into the outer
  membrane. Lipoproteins carrying the Asp+2 inner-membrane retention signal are
  not released to LolA.
