id: P16456
gene_symbol: selD
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  SelD is the selenophosphate synthetase (selenide, water dikinase; EC 2.7.9.3) of Escherichia coli. This
  soluble cytosolic enzyme uses selenide, ATP and water, with Mg2+ and K+, to form selenophosphate, AMP
  and orthophosphate, transferring the ATP gamma-phosphate to selenium. Selenophosphate is the activated
  selenium donor used by SelA to convert seryl-tRNA(Sec) to selenocysteinyl-tRNA(Sec), and by the 2-selenouridine
  synthase SelU to make 5-methylaminomethyl-2-selenouridine in tRNA; selD mutants are defective in both
  selenoprotein synthesis and tRNA selenation. Crystal structures show a homodimer with a flexible glycine-rich
  N-terminal loop carrying the catalytic Cys17 and a Mg2+ site built from conserved aspartates.
