  review:
    summary: >-
      Leinfelder et al. 1990 cloned selD, showed it is required for Sec and 2-selenouridine formation,
      and reconstituted Sec-tRNA synthesis in vitro with SelD- and SelA-enriched extracts.
    action: ACCEPT
    reason: >-
      The paper predates identification of selenophosphate, and the cached abstract only shows SelD acting
      as "a donor of reduced selenium" in a reconstituted system; the full text was read by the curator.
      The activity itself is firmly established for this protein by the later purified-enzyme and structural
      work (PMID:1606960, PMID:22081394), and UniProt cites this paper as experimental evidence for the
      reaction, so the row is accepted.
