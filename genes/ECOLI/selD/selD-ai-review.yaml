  evidence_type: IDA
  original_reference_id: PMID:22081394
  qualifier: enables
  review:
    summary: >-
      The EcSPS(C17S) crystal structure shows one Mg2+ bound per active site by conserved aspartates,
      and alanine substitution of these ligands abolishes activity.
    action: ACCEPT
    reason: >-
      Direct structural evidence for Mg2+ coordination (D51, D91, D227; PDB 3U0O) with a mutational demonstration
      that the metal site is essential for AMP production. Mg2+ is an obligate cofactor of the selenophosphate
      synthetase reaction, so the binding term is accurate and functionally meaningful as part of the
      catalytic site.
    supported_by:
