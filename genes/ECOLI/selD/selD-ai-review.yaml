suggested_questions:
- question: >-
    Is native wild-type E. coli SelD a monomer (as reported for the purified enzyme in 1992) or a homodimer
    (as in the C17S crystal structure and AUC), and does the oligomeric state change on ATP or selenide
    binding?
- question: >-
    What is the physiological selenide carrier that delivers reduced selenium to SelD in vivo (free selenide,
    persulfide/perselenide of a cysteine desulfurase such as CsdB/IscS, or another protein)?
suggested_experiments:
- hypothesis: >-
    SelD receives selenium from a protein-bound perselenide rather than free selenide in vivo.
  description: >-
    Compare SelD selenophosphate production with free selenide versus a selenocysteine-lyase-generated
    perselenide donor, and test direct complex formation by pull-down or crosslinking.
