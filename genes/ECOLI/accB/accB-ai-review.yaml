core_functions:
- description: >-
    Biotinylated carboxyl carrier subunit of acetyl-CoA carboxylase. Its biotinyllysine arm is carboxylated
    by AccC at the expense of ATP and then delivers the carboxyl group to the AccA/AccD carboxyltransferase
    active site, where it is transferred to acetyl-CoA. AccB performs no chemistry itself; it binds and
    shuttles the activated one-carbon unit between the two half-reactions of the complex. GO has no term
    for this biotin-dependent carrier role, so the activity is given as a proposed new term rather than
    flattened onto the very broad GO:0140104 molecular carrier activity; the holoenzyme term GO:0003989
    is recorded as a contribution, not as an activity of this subunit.
