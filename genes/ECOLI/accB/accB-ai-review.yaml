- term:
    id: GO:0060090
    label: molecular adaptor activity
  evidence_type: EXP
  original_reference_id: PMID:23499019
  qualifier: enables
  review:
    summary: >-
      The experiment shows BCCP docking on the biotin carboxylase dimer, but AccB's function is to carry
      the activated carboxyl group between two active sites, which is molecular carrier activity rather
      than adaptor activity.
    action: MODIFY
    reason: >-
      A molecular adaptor brings two molecules together non-covalently so that they can act in a coordinated
      way; AccB does something different and more specific. Biotin is covalently attached to Lys122 of
      its biotinyl-binding domain, that biotin is carboxylated by AccC in the first half-reaction, and
      the carboxybiotinyl arm then delivers the carboxyl group to the carboxyltransferase active site
      in the second. The protein is the vehicle for the transferred group, not a bridge between two other
      molecules. GO:0140104 molecular carrier activity ("directly binding to a specific ion or molecule
      and delivering it either to an acceptor molecule or to a specific location") is the correct genus,
      and it is the same place in the ontology where the analogous covalent carriers sit (acyl carrier
      activity for ACP). This is a lateral correction, so the replacement is not a descendant of GO:0060090.
      GO has no biotin-specific child of GO:0140104 yet; a proposed term is recorded in proposed_new_terms.
    proposed_replacement_terms:
    - id: GO:0140104
      label: molecular carrier activity
    supported_by:
    - reference_id: PMID:23499019
      supporting_text: >-
        BC and BCCP participate in the first half-reaction, whereas carboxyltransferase and BCCP are involved
        in the second.
    - reference_id: PMID:23499019
      supporting_text: >-
        The protein-protein complex shows a unique quaternary structure and two distinct interfaces for
        each BCCP monomer.
    - reference_id: file:ECOLI/accB/accB-uniprot.txt
      record_section: ["FT:MOD_RES"]
      supporting_text: N6-biotinyllysine
