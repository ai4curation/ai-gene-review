proposed_new_terms:
- proposed_name: biotin-dependent carboxyl carrier activity
  proposed_definition: >-
    Binding a carboxyl group through a covalently attached biotin prosthetic group and delivering it to
    an acceptor molecule or to the active site of a cognate enzyme. The biotin carboxyl carrier protein
    (or biotinylated domain) of a biotin-dependent carboxylase is carboxylated by a biotin carboxylase
    component and then presents the carboxybiotin to a carboxyltransferase component.
  justification: >-
    GO has specific carrier terms for the analogous phosphopantetheine-dependent carriers (GO:0000036
    acyl carrier activity, GO:0036370 D-alanyl carrier activity, GO:0140414 phosphopantetheine-dependent
    carrier activity) but none for the biotin-dependent carboxyl carriers, which are an equally well defined,
    structurally conserved class covering the BCCP subunits and the biotinylated domains of acetyl-CoA,
    propionyl-CoA, pyruvate and methylcrotonyl-CoA carboxylases. Without such a term the only options
    are the holoenzyme activity GO:0003989, which the carrier does not enable, or the very broad GO:0140104.
