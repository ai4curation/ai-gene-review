gene_symbol: accB
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  AccB (BCCP, also called FabE) is the biotin carboxyl carrier protein of the heteromeric bacterial acetyl-CoA
  carboxylase. Biotin is attached covalently by biotin protein ligase (BirA) to a lysine in its conserved
  biotinyl-binding domain, and the resulting biotinyllysine arm acts as a swinging prosthetic group: it
  is carboxylated at the expense of ATP by the biotin carboxylase subunit (AccC) in the first half-reaction,
  then delivers the carboxyl group to the carboxyltransferase (AccA/AccD) in the second half-reaction,
  where it is transferred to acetyl-CoA to give malonyl-CoA. AccB has no catalytic activity of its own;
  its function is to bind the activated one-carbon unit and shuttle it between the two spatially separate
  active sites of the complex, and the degree to which it is biotinylated also serves as the signal that
  controls biotin biosynthesis through BirA.
