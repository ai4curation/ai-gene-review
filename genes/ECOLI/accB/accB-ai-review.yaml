      first, biotin carboxylase catalyzes the carboxylation of the carrier protein and then the transcarboxylase
      transfers the carboxyl group to form malonyl-CoA.
suggested_questions:
- question: >-
    How is the biotinylated arm of AccB partitioned between the AccC and AccA/AccD active sites in the
    intact holoenzyme, and is that partitioning regulated?
- question: >-
    AccB biotinylation status is the signal BirA uses to regulate biotin synthesis; is the unbiotinylated
    apo form ever abundant enough in wild-type cells to limit ACC activity, or only when subunit stoichiometry
    is disturbed?
suggested_experiments:
- description: >-
    Measure the fraction of AccB that is biotinylated across growth rates and carbon sources by mass spectrometry,
    and correlate it with ACC activity and malonyl-CoA pools, to test whether carrier loading ever limits
    flux in unperturbed cells.
- description: >-
    Vary the length and flexibility of the linker that tethers the biotinyl-binding domain of AccB and
    measure both half-reaction rates in a reconstituted holoenzyme, to quantify how carrier geometry constrains
    carboxyl transfer between the two active sites.
