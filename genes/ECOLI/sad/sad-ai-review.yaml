id: P76149
gene_symbol: sad
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: Sad (YneI, b1525) is a homodimeric aldehyde dehydrogenase of Escherichia coli K-12 that oxidizes
  succinate semialdehyde to succinate. Purified enzyme works preferentially with NAD+
  but also reduces NADP+, so its activity is best described as cofactor-general succinate-semialdehyde
  dehydrogenase. It is one of two E. coli succinate-semialdehyde dehydrogenases, and the division of labour
  between them is clear. The NADP-specific GabD serves the GABA shunt during nitrogen limitation, whereas
  Sad is induced by succinate semialdehyde itself and by putrescine and acts chiefly as a valve that prevents
  toxic accumulation of this aldehyde. Through that reaction Sad supplies succinate from gamma-aminobutyrate
  derived from putrescine and arginine catabolism.
