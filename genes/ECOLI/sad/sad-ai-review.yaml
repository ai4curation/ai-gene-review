proposed_new_terms: []
suggested_questions:
- question: What fraction of succinate-semialdehyde flux passes through Sad rather than GabD during growth
    on putrescine, arginine or GABA, and does the split follow the NAD/NADP ratio of the cell?
- question: Is the aldehyde-detoxification role of Sad specific to succinate semialdehyde, or does the
    enzyme also protect against other reactive aldehydes in vivo?
suggested_experiments:
- hypothesis: Sad acts primarily as a succinate-semialdehyde safety valve, whereas GabD carries catabolic
    flux, so the two enzymes are not interchangeable under the same conditions.
  description: Measure intracellular succinate semialdehyde and 13C flux through the GABA shunt in wild
    type and in single and double sad and gabD deletions during growth on putrescine, arginine and GABA,
    with matched NAD(H) and NADP(H) pool measurements.
- hypothesis: The in vivo acceptor used by Sad is NAD, despite measurable NADP activity in vitro.
  description: Determine steady-state kinetics of purified Sad with both acceptors at physiological cofactor
    concentrations and pH, and test whether an acceptor-switching active-site variant changes the putrescine
    growth phenotype.
