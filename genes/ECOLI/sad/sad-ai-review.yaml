  review:
    summary: Sad supplies succinate to the TCA cycle but catalyses no step of that cycle.
    action: REMOVE
    reason: This IBA descends from a node seeded by Mycobacterium tuberculosis GabD1 (P9WNX9). In mycobacteria
      the GABA shunt is read as a bypass of the oxidative decarboxylation segment of the TCA cycle, which
      makes the seed annotation intelligible for that lineage. E. coli K-12 has a complete oxidative TCA
      cycle, and the Sad reaction from succinate semialdehyde to succinate is a GABA-shunt step that feeds
      the cycle intermediate pool from outside it. Being the supplier of a cycle metabolite is not participation
      in the cycle, so the phylogenetic transfer carries over a lineage-specific pathway reading rather
      than an inherited function. The succinate-semialdehyde chemistry itself is retained elsewhere in
      this review.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
