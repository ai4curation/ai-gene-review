  review:
    summary: The detoxification role is sound, but the toxic species removed is an aldehyde, not a nitrogen
      compound.
    action: MODIFY
    reason: The paper's conclusion is that the yneI-encoded activity works primarily as a valve preventing
      toxic accumulation of succinate semialdehyde, and UniProt carries that statement for this accession.
      The argument turns on the two definitions, read from live QuickGO on 2026-11-02. GO:0070458 is "Any
      cellular process that reduces or removes the toxicity of nitrogenous compounds which are dangerous
      or toxic", whereas GO:0110095 is "Any process carried out at the cellular level that reduces or
      removes the toxicity of an aldehyde". Succinate semialdehyde is an aldehyde and contains no nitrogen;
      it merely arises downstream of nitrogen-compound catabolism, which is probably why the nitrogen-compound
      term was chosen. GO:0110095 also takes aldehyde (CHEBI:17478) as its has-input class, so it is the
      term that matches the removed metabolite. This is a lateral correction of the substrate class, not
      a refinement, so the replacement is not a descendant of the original term.
