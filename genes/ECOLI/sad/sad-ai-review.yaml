core_functions:
- description: NAD-preferring, cofactor-general oxidation of succinate semialdehyde to succinate in the
    E. coli cytoplasm. The reaction removes a reactive aldehyde and delivers succinate to central metabolism,
    serving both as a detoxification valve for succinate semialdehyde and as the terminal step of gamma-aminobutyrate
    degradation fed by putrescine and arginine catabolism.
