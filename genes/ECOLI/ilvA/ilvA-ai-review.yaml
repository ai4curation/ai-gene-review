id: P04968
gene_symbol: ilvA
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  IlvA is the biosynthetic L-threonine dehydratase (threonine deaminase) of
  Escherichia coli, a soluble homotetrameric pyridoxal 5'-phosphate enzyme
  encoded at the end of the ilvGMEDA operon. It deaminates L-threonine to
  2-oxobutanoate (2-ketobutyrate) and ammonia through an enamine/imine
  intermediate, catalysing the committed step of L-isoleucine biosynthesis. An
  N-terminal PLP catalytic domain is followed by two C-terminal ACT-like
  regulatory domains: L-isoleucine, the end product, inhibits the enzyme
  cooperatively and L-valine activates it, making IlvA the main point of
  feedback control on isoleucine synthesis. E. coli also has a separate
  AMP-activated biodegradative threonine dehydratase, TdcB. Like other
  biosynthetic IlvA enzymes, IlvA also acts on L-serine, releasing the reactive
  enamine 2-aminoacrylate, which RidA detoxifies.
