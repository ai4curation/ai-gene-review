    id: GO:0006566
    label: L-threonine metabolic process
  evidence_type: IDA
  original_reference_id: PMID:13405870
  qualifier: involved_in
  review:
    summary: IlvA consumes L-threonine as the first step of isoleucine synthesis; the
      metabolic (not catabolic) term is the right level.
    action: KEEP_AS_NON_CORE
    reason: The IlvA reaction converts L-threonine to 2-oxobutanoate, so IlvA takes
      part in L-threonine metabolism. The child term L-threonine catabolic process
      (GO:0006567) is not proposed. In E. coli, threonine degradation is carried out
      by dedicated catabolic enzymes, including the biodegradative dehydratase TdcB
      that PMID:13405870 distinguishes from IlvA, and IlvA's threonine consumption feeds isoleucine biosynthesis. The
      PTHR48078 family review likewise limits GO:0006567 to the catabolic dehydratases,
      allowing the biosynthetic subfamily only a minor non-core contribution (yeast
      ILV1 keeps it non-core). The core process is captured by L-isoleucine biosynthetic
      process, so this row is non-core. The cached record of PMID:13405870 has no
      abstract; UniProt cites it (ECO:0000269) for the IlvA threonine dehydratase function.
    supported_by:
    - reference_id: file:ECOLI/ilvA/ilvA-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: Catalyzes the anaerobic formation of alpha-ketobutyrate and
        ammonia from threonine in a two-step reaction.
