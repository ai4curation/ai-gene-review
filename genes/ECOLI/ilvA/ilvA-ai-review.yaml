suggested_questions:
- question: Does PMID:5321308 (AMP-activated threonine dehydrase) describe IlvA at
    all, or only the biodegradative TdcB, and should the IlvA PLP-binding IDA row
    and UniProt COFACTOR evidence be re-pointed?
- question: How much 2-aminoacrylate does E. coli IlvA produce from serine in vivo
    relative to the dedicated serine dehydratases SdaA, SdaB and TdcG, and does this
    side reaction matter physiologically in a ridA background?
suggested_experiments:
- hypothesis: The serine reaction of IlvA is a damaging side reaction rather than
    a serine-degradation route in E. coli.
  description: Measure kcat/Km of purified IlvA for L-serine versus L-threonine, and
    compare serine-dependent 2-aminoacrylate damage (IlvE inactivation) in ridA, ridA
    ilvA(feedback-resistant) and ridA sdaA sdaB tdcG strains.
  experiment_type: enzyme kinetics and genetics
