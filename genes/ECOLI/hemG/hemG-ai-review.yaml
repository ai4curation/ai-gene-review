core_functions:
- description: >-
    FMN-dependent protoporphyrinogen IX dehydrogenase: oxidises protoporphyrinogen IX to protoporphyrin
    IX, the ferrochelatase substrate, using menaquinone (anaerobic) or ubiquinone (aerobic) rather than
    O2 as electron acceptor, so that the electrons enter the respiratory chains.
  molecular_function:
    id: GO:0070819
    label: protoporphyrinogen oxidase activity, quinone as acceptor
  directly_involved_in:
  - id: GO:0006785
    label: heme B biosynthetic process
  locations:
  - id: GO:0009898
    label: cytoplasmic side of plasma membrane
  supported_by:
  - reference_id: PMID:19583219
    supporting_text: >-
      Herein, purified recombinant HemG was shown to be capable of a menadione-dependent conversion of
      protoporphyrinogen IX to protoporphyrin IX.
  - reference_id: PMID:20484676
    supporting_text: >-
      Under anaerobic conditions electrons are transferred via menaquinone, fumarate (Frd) and nitrate
      reductase (Nar).
- description: Binds FMN non-covalently as the redox cofactor of the dehydrogenase reaction.
  molecular_function:
    id: GO:0010181
    label: FMN binding
  supported_by:
  - reference_id: PMID:19583219
    supporting_text: The cofactor was determined to be similar in size to FMN by ESI MS.
suggested_questions:
- question: >-
    How does the 22-residue HemG-specific insertion confer protoporphyrinogen binding and dehydrogenase
    activity on the flavodoxin fold?
- question: >-
    Should GO:0004729 be dropped from the InterPro2GO mapping of IPR044264, leaving only the quinone-acceptor
    term GO:0070819?
suggested_experiments:
- hypothesis: The HemG-specific insertion forms the protoporphyrinogen-binding site adjacent to the FMN.
  description: >-
    Determine a structure of HemG with protoporphyrin IX or a substrate analog and test insertion-residue
    variants for substrate binding and menadione-dependent turnover.
