id: P0ACB4
gene_symbol: hemG
product_type: PROTEIN
aliases:
- yihB
- b3850
- JW3827
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  HemG is the oxygen-independent protoporphyrinogen IX dehydrogenase of Escherichia coli K-12 (EC 1.3.5.3),
  a small long-chain flavodoxin-family protein that binds FMN non-covalently. It removes six electrons
  from protoporphyrinogen IX to form protoporphyrin IX, the substrate of ferrochelatase, and passes them
  to the quinone pool rather than to molecular oxygen: menaquinone under anaerobic conditions and ubiquinone
  aerobically. From the quinones the electrons flow to fumarate or nitrate reductase, or to the cytochrome
  bo3 and bd oxidases, so this heme-biosynthetic step feeds the respiratory chains. HemG is associated
  with the cytoplasmic face of the inner membrane and co-purifies with fumarate reductase. A HemG-specific
  22-residue segment confers protoporphyrinogen dehydrogenase activity on a flavodoxin scaffold; HemG-type
  enzymes are characteristic of gamma-proteobacteria and allow heme synthesis with or without oxygen.
  hemG mutants lack the activity, accumulate porphyrins and grow poorly without heme.
existing_annotations:
- term:
    id: GO:0004729
    label: protoporphyrinogen oxidase activity, oxygen as acceptor
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR044264
  review:
    summary: >-
      InterPro2GO mapping of IPR044264 (Protoporphyrinogen IX dehydrogenase [quinone] HemG) to GO:0004729,
      defined as "3 O2 + protoporphyrinogen IX = 3 H2O2 + protoporphyrin IX". That is the reaction of
      the FAD-dependent HemY/PPOX enzymes, not of HemG.
    action: MODIFY
    reason: >-
      The step is right but the acceptor is wrong. HemG is a flavodoxin-type enzyme that does not use
      oxygen as electron acceptor: purified HemG needs a quinone (menadione), and aerobic protoporphyrin
      IX formation in extracts requires the respiratory oxidases to reoxidise the quinol. The correct
      term is GO:0070819 protoporphyrinogen oxidase activity, quinone as acceptor ("protoporphyrinogen
      IX + 3 a quinone = protoporphyrin IX + 3 a quinol"), which the gene already carries by IDA, IBA
      and IEA. The same InterPro entry is also mapped to GO:0070819, so the O2 mapping should be dropped.
    proposed_replacement_terms:
    - id: GO:0070819
      label: protoporphyrinogen oxidase activity, quinone as acceptor
    supported_by:
    - reference_id: PMID:19583219
      supporting_text: >-
        These findings reveal a previously unidentified class of PPO enzymes that do not utilize oxygen
        as an electron acceptor, thereby allowing gamma-proteobacteria to synthesize heme in both aerobic
        and anaerobic environments.
    - reference_id: file:ECOLI/hemG/hemG-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: >-
        In cell free extracts deletion of both cytochrome oxidases prevents formation of protoporphyrin
        IX (PubMed:20484676).
    source_defects:
    - defect_type: WRONG_TERM
      resource: OTHER
      slot: interpro2go
      requested_change: DELETE_VALUE
      asserted_value: GO:0004729
      cause: OTHER
      confidence: CONFIRMED
      explanation: >-
        InterPro's interpro2go maps IPR044264 (HemG) to both GO:0004729 (oxygen as acceptor) and GO:0070819
        (quinone as acceptor). HemG-family enzymes are quinone-dependent and do not use O2 as electron
        acceptor (PMID:19583219; PMID:20484676), so the GO:0004729 mapping is wrong for every member and
        should be removed, leaving GO:0070819.
      supported_by:
      - reference_id: PMID:19583219
        supporting_text: >-
          These findings reveal a previously unidentified class of PPO enzymes that do not utilize oxygen
          as an electron acceptor
