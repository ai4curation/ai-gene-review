    label: electron transfer activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR001226
  review:
    summary: >-
      InterPro2GO mapping of the flavodoxin conserved-site signature (IPR001226) to electron transfer
      activity.
    action: KEEP_AS_NON_CORE
    reason: >-
      True for HemG: its FMN accepts electrons from protoporphyrinogen and passes them to quinones, and
      through them to fumarate and nitrate reductase and the terminal oxidases, as reconstituted in vitro.
      GO:0009055 ("the directed movement of electrons from one molecular entity to another") describes
      this electron hand-off, but the defining activity is the quinone-dependent protoporphyrinogen dehydrogenase,
      so the row is non-core. Flavodoxin homology alone would not justify it: E. coli flavodoxin A does
      not complement a hemG mutant.
    supported_by:
    - reference_id: PMID:20484676
      supporting_text: >-
        The FMN enzyme protoporphyrinogen IX oxidase (HemG) of Escherichia coli abstracts six electrons
        from its substrate and transfers them via ubiquinone, cytochrome bo(3) (Cyo) and cytochrome bd
        (Cyd) oxidase to oxygen.
