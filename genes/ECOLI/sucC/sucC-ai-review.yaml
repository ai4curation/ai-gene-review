gene_symbol: sucC
product_type: PROTEIN
status: INITIALIZED
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: SucC is the beta subunit of succinyl-CoA synthetase (succinate-CoA ligase) of Escherichia coli, an
  alpha2beta2 heterotetramer formed with the alpha subunit SucD. The enzyme carries out the substrate-level phosphorylation
  step of the tricarboxylic acid cycle, converting succinyl-CoA, a nucleoside diphosphate and phosphate to succinate,
  CoA and a nucleoside triphosphate through a phosphohistidine intermediate on the alpha subunit, and it runs in
  reverse to supply succinyl-CoA for biosynthesis. The beta subunit binds the nucleotide-Mg complex in its N-terminal
  ATP-grasp domain and binds succinate in its C-terminal domain. The enzyme prefers ATP but also uses GTP, with
  about a tenth of the catalytic efficiency. sucC is the third gene of the sucABCD operon, co-regulated with 2-oxoglutarate
  dehydrogenase. Bacteria have a single beta subunit; the separate ADP- and GDP-specific beta subunits of animals
  arose by a later duplication in eukaryotes.
