suggested_questions:
- question: Is GTP formation by E. coli succinyl-CoA synthetase used in vivo, or is the secondary activity a tolerated
    by-product of a nucleotide site that does not exclude guanine?
- question: Was the ancestral succinyl-CoA synthetase dual-specific like the E. coli and Thermus enzymes, with strict
    ATP or GTP specificity arising later in eukaryotes?
suggested_experiments:
- hypothesis: The ancestral bacterial enzyme accepted both nucleotides, and strict specificity is derived.
  description: Reconstruct ancestral beta-subunit sequences at the bacterial and eukaryotic root nodes, express
    them with a matching alpha subunit, and measure kcat/Km with ADP and GDP alongside the E. coli enzyme.
