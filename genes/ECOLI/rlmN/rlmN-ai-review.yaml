  review:
    summary: RlmN also methylates C2 of A37 in a subset of tRNAs. The deletion mutant lacks m2A in tRNA,
      plasmid expression restores it, and purified RlmN makes m2A37 on a tRNA chimera in vitro (PMID:22891362).
