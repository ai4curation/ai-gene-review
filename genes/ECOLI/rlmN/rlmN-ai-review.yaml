suggested_questions:
- question: Is the higher UAG read-through of the rlmN deletion caused directly by loss of m2A2503 at
    the peptidyl transferase centre, or partly by loss of m2A37 in tRNA?
- question: How does one RlmN active site recognise two structurally different substrates (the A2503 region
    of 23S rRNA and the tRNA anticodon loop), and does it modify 23S rRNA at a defined stage of 50S assembly
    in vivo?
suggested_experiments:
- hypothesis: The fidelity phenotype comes from the rRNA modification, not the tRNA modification.
  description: Measure stop-codon read-through and missense reporters in strains whose 23S rRNA carries
    an A2503G substitution, or that express RlmN variants which keep tRNA activity but lose rRNA activity,
    and compare them with the full deletion.
