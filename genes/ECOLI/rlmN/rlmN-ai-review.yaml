id: P36979
gene_symbol: rlmN
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: 'RlmN is the dual-specificity RNA methyltransferase of Escherichia coli that installs 2-methyladenosine
  at A2503 of 23S rRNA, in the peptidyl transferase centre at the entrance to the nascent peptide exit
  tunnel, and at A37 next to the anticodon of a subset of tRNAs. It is a radical S-adenosyl-L-methionine
  (SAM) enzyme with a single [4Fe-4S] cluster bound by a CxxxCxxC motif. Catalysis is a ping-pong reaction:
  one SAM methylates Cys355 by SN2 transfer, a second SAM is reductively cleaved to a 5''-deoxyadenosyl
  radical that abstracts a hydrogen from the Cys355 methyl, and the resulting methylene radical adds to
  C2 of the adenine to form a covalent protein-RNA intermediate that is resolved with the help of Cys118.
  RlmN acts on protein-free 23S rRNA, implying modification during ribosome assembly, and on nearly mature
  tRNA, unfolding the anticodon stem-loop to reach A37. Loss of RlmN abolishes m2A in both RNAs, reduces
  competitive fitness, increases UAG stop-codon read-through and slightly raises susceptibility to some
  peptidyl transferase inhibitors. Its paralog Cfr methylates C8 of the same adenosine and confers multidrug
  resistance.'
