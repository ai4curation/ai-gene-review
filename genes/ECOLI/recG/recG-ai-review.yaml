    label: Holliday junction helicase complex
  evidence_type: IDA
  original_reference_id: PMID:8428576
  qualifier: part_of
  review:
    summary: RecG binds and dissociates synthetic Holliday junctions.
    action: MARK_AS_OVER_ANNOTATED
    reason: The assay shows RecG junction binding and ATP-dependent junction dissociation, i.e. the activity,
      not membership of a multisubunit helicase complex. GO:0009379 is defined around the RuvAB complex,
      whereas RecG is a monomer in solution and acts as a monomer on junction DNA. The annotation over-reads
      a protein-DNA complex as a helicase complex. The abstract-only cache does not show the full-text
      figure behind the row, so this is not removed.
    supported_by:
    - reference_id: PMID:10871364
      supporting_text: These data suggest that RecG functions as a monomer to unwind junction DNA
    - reference_id: PMID:8428576
      supporting_text: in the presence of ATP and Mg2+, RecG dissociates these junctions to duplex products,
        like RuvAB
