id: P24230
gene_symbol: recG
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: RecG is a monomeric, ATP-dependent superfamily 2 DNA helicase of Escherichia coli that is
  specific for branched DNA. An N-terminal wedge domain engages the branch point of forks and Holliday
  junctions, and the C-terminal helicase domains translocate with 3'-5' polarity. RecG branch-migrates
  Holliday junctions independently of RuvAB, providing an alternative route in recombination and DNA repair,
  and regresses stalled replication forks into Holliday junctions that RuvC or RusA can resolve. It also
  unwinds R-loops. recG mutants are sensitive to UV, ionizing radiation and mitomycin C, and ruv recG
  double mutants are severely repair deficient.
