id: P32143
gene_symbol: yihV
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: YihV is the 6-deoxy-6-sulfofructose (SF) kinase of Escherichia coli, the second enzyme of
  the sulfoglycolytic Embden-Meyerhof-Parnas pathway. This cytoplasmic PfkB-family carbohydrate kinase
  transfers the gamma-phosphate of ATP to the C1 hydroxyl of SF to form 6-deoxy-6-sulfofructose 1-phosphate,
  the substrate of the aldolase YihT, and recognises the substrate sulfonate through a conserved Lys27-Asn109-Arg138
  triad. It does not phosphorylate fructose 6-phosphate. YihV is a homodimer joined by a beta-clasp lid
  domain, and its activity is modulated by sulfoglycolytic and central metabolites (activated by sulfoquinovose,
  sulfolactaldehyde, dihydroxyacetone phosphate, fructose 6-phosphate, fructose 1,6-bisphosphate, phosphoenolpyruvate
  and citrate, strongly inhibited by ADP), making it a control point for flux through the pathway. Deletion
  of yihV abolishes growth on sulfoquinovose.
