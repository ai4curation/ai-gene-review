  review:
    summary: YihV is a soluble cytoplasmic kinase acting on intracellular sulfofructose.
    action: ACCEPT
    reason: PAINT placed cytosol at PTN000061929, the PfkB ribokinase-group ancestor seeded by E. coli RbsK;
      YihV descends from it through PTN000061922 (the sulfofructose kinase node, where only the ribokinase
      activity was negated). YihV has no transmembrane segment or signal peptide, was purified as a soluble
      dimer, and acts on SQ-derived intermediates generated inside the cell after import (PMID:33791429),
      so the inherited cytosolic location holds.
    supported_by:
    - reference_id: PMID:33791429
      supporting_text: It was initially described in Escherichia coli and involves the importation of SQ
        and its glycosides (which undergo intracellular hydrolysis to liberate SQ), catabolic enzymes to
        produce dihydroxyacetone phosphate (DHAP) and sulfolactaldehyde (SLA)
    - reference_id: PMID:33791429
      supporting_text: EcYihV forms a dimeric assembly, and SEC-MALS analysis of EcYihV revealed a mixture
        of solution states with the major peak corresponding to a dimer (>60%)
