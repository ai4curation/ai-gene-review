id: P07117
gene_symbol: putP
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: putP encodes PutP, the sodium/proline symporter of the Escherichia coli cytoplasmic (inner)
  membrane, a 502-residue, 13-transmembrane-helix member of the sodium:solute symporter (SSS, TC 2.A.21)
  family. PutP catalyses high-affinity (low micromolar Km) uptake of extracellular L-proline coupled to
  inward movement of Na+ (or Li+) with roughly 1:1 stoichiometry, and is the proline entry route for the
  put system, in which PutA oxidises imported proline to glutamate so that proline can serve as a carbon
  and nitrogen source. Genetic and expression data also implicate PutP in propionate uptake.
