suggested_questions:
- question: Does PutP transport propionate directly, and if so is it Na+-coupled and with what affinity
    relative to L-proline?
- question: What fraction of PutP-mediated proline uptake serves catabolism (with PutA) versus osmoprotection
    under high osmolarity, given the separate ProP and ProU systems?
suggested_experiments:
- description: Measure [14C]propionate uptake in right-side-out vesicles or proteoliposomes containing
    purified PutP, with and without a Na+ gradient and with proline as competitor.
  experiment_type: membrane transport assay
- description: Compare growth on proline as sole carbon/nitrogen source and proline uptake kinetics in
    putP, proP and proVWX single and combined deletions.
  experiment_type: genetic interaction and transport kinetics
