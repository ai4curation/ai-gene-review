core_functions:
- description: Binds sodium as the coupling ion and imports extracellular L-proline across the inner membrane,
    supplying proline for PutA-dependent catabolism. Reconstituted E. coli PutP supports Na+-coupled uptake;
    Li+ can substitute in vitro.
