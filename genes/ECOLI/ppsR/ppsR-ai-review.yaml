  review:
    summary: Bare protein binding from an interaction screen (RluD); uninformative.
    action: REMOVE
    reason: >-
      Bare protein binding identifies no function. The partner (RluD, a 23S rRNA pseudouridine synthase) has no known connection to PEP synthase regulation, and no functional consequence was shown. Removed under the protein-binding policy; removal does not mean the interaction is false.
