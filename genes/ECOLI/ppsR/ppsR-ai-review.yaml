proposed_new_terms:
- proposed_name: '[pyruvate, water dikinase]-phosphate phosphotransferase activity'
  proposed_definition: >-
    Catalysis of the reaction: [pyruvate, water dikinase]-phosphate + phosphate
    + H+ = [pyruvate, water dikinase] + diphosphate.
  justification: >-
    RHEA:48580 / EC 2.7.4.28 has no GO term; it can only be expressed by the
    broad GO:0016776. The hydrolase term GO:0004721 propagated by PAINT is the
    wrong reaction class.
  proposed_parent:
    id: GO:0016776
    label: phosphotransferase activity, phosphate group as acceptor
  supported_by:
  - reference_id: PMID:20044937
    supporting_text: a Pi-dependent pyrophosphorylation reaction in bacteria
- proposed_name: '[pyruvate, water dikinase] kinase activity'
  proposed_definition: >-
    Catalysis of the reaction: [pyruvate, water dikinase] + ADP = [pyruvate,
    water dikinase]-phosphate + AMP + H+.
  justification: >-
    RHEA:46020 / EC 2.7.11.33 has no GO term. GO:0004674 is defined with ATP as
    donor and does not cover the ADP-dependent reaction; only GO:0004672 fits.
  proposed_parent:
    id: GO:0004672
    label: protein kinase activity
  supported_by:
  - reference_id: PMID:20044937
    supporting_text: first report of a bifunctional regulatory enzyme catalysing an ADP-dependent phosphorylation
suggested_questions:
- question: >-
    Which residue of E. coli PEP synthase does PpsR phosphorylate, and is
    pyrophosphate the measured product of the Pi-dependent reactivation, as for
    the maize PDRP?
suggested_experiments:
- description: >-
    Identify the PpsR-dependent phosphosite on PpsA by mass spectrometry and
    quantify AMP and PPi formed in the ADP-dependent and Pi-dependent reactions;
    test growth on pyruvate or lactate of a ppsR deletion.
