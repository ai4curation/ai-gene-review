    id: GO:0005524
    label: ATP binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR005177
  review:
    summary: Nucleotide substrate is ADP; ATP binding is not shown.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The InterPro family mapping infers ATP binding from the P-loop of the PDRP/PSRP family. The E. coli enzyme uses ADP as the phosphoryl donor (captured by the ADP binding row), and no ATP binding or ATP-dependent activity of PpsR has been reported; ATP acts on PEP synthase rather than on PpsR in the regulatory scheme. The annotation is plausible for a P-loop protein but exceeds the evidence.
