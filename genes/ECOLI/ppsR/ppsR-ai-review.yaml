  review:
    summary: Core phosphorylase activity, Pi-dependent reactivation of PEP synthase releasing PPi (RHEA:48580).
    action: ACCEPT
    reason: >-
      PpsR reactivates phosphorylated PEP synthase in a Pi-dependent reaction that the author describes as a pyrophosphorylation (phosphoryl transfer from the phosphoprotein to inorganic phosphate, yielding PPi; EC 2.7.4.28). This is a phosphotransferase reaction with phosphate as acceptor, so GO:0016776 is the correct and most specific existing term; a specific term is proposed. PPi formation is inferred from the activity assays and the PDRP precedent rather than measured for the E. coli enzyme.
