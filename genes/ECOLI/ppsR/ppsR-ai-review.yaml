  - AGI_LocusCode:AT4G21210
  - PANTHER:PTN008639298
  review:
    summary: ADP-dependent phosphorylation (inactivation) of PEP synthase; core kinase activity.
    action: ACCEPT
    reason: >-
      PpsR inactivates PEP synthase by ADP-dependent phosphorylation (RHEA:46020). GO:0004672 protein kinase activity, whose definition allows donors other than ATP, is the most specific existing term that fits the ADP donor. The IBD node is seeded by the Arabidopsis PDRPs, characterised regulatory proteins of the same family, and E. coli PpsR has its own experimental support.
    supported_by:
    - reference_id: PMID:20044937
      supporting_text: establishes that E. coli DUF299 catalyzes both the ADP-dependent inactivation and the Pi-dependent activation of PEPS.
- term:
    id: GO:0004674
    label: protein serine/threonine kinase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: enables
  supporting_entities:
  - UniRule:UR000100579
  review:
    summary: Donor mismatch; GO:0004674 is defined with ATP, PpsR uses ADP.
    action: MODIFY
    reason: >-
      GO:0004674 is defined as ATP + protein Ser/Thr = ADP + phosphoprotein. PpsR phosphorylates PEP synthase with ADP as donor, releasing AMP (EC 2.7.11.33), and the threonine acceptor is inferred from the plant PDRP rather than shown for E. coli. The kinase claim is sound, but the term is over-specific in donor; generalised to protein kinase activity (GO:0004672), which the gene carries by IBA and whose definition permits non-ATP donors.
    proposed_replacement_terms:
    - id: GO:0004672
      label: protein kinase activity
    supported_by:
    - reference_id: PMID:20044937
      supporting_text: first report of a bifunctional regulatory enzyme catalysing an ADP-dependent phosphorylation
- term:
    id: GO:0004721
    label: phosphoprotein phosphatase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - AGI_LocusCode:AT4G21210
  - PANTHER:PTN008639298
  review:
    summary: Wrong reaction class; reactivation is a Pi-dependent phosphorolysis, not hydrolysis.
    action: MODIFY
    reason: >-
      Phosphoprotein phosphatase activity is a hydrolase activity (water as acceptor). PpsR, like the plant PDRP that seeds this node, removes the regulatory phosphate with inorganic phosphate, producing pyrophosphate (EC 2.7.4.28, RHEA:48580); no water is consumed. The essence (reactivating dephosphorylation of the target) is right, so the row is corrected laterally to phosphotransferase activity, phosphate group as acceptor (GO:0016776), which the gene already carries.
    proposed_replacement_terms:
    - id: GO:0016776
      label: phosphotransferase activity, phosphate group as acceptor
    supported_by:
    - reference_id: PMID:20044937
      supporting_text: a Pi-dependent pyrophosphorylation reaction in bacteria
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - ROLE_CONFLATION
      source_entities:
      - source_id: PANTHER:PTN008639298
        source_label: PANTHER:PTN008639298
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          Node over the PDRP/PSRP family. The reactivating activity is real
          across the family, but it is a Pi-dependent pyrophosphorylation, so
          the hydrolase term misnames it for the seed and the target alike.
      - source_id: AGI_LocusCode:AT4G21210
        source_label: Arabidopsis PDRP (RP1)
        source_status: UNRESOLVED
        comment: Seed papers not read here; PDRP chemistry (Pi to PPi) is the established mechanism.
    source_defects:
    - defect_type: WRONG_TERM
      resource: PANTHER
      record: PANTHER:PTN008639298
      slot: IBD term
      requested_change: REPOINT
      asserted_value: GO:0004721
      corrected_value: GO:0016776
      corrected_label: phosphotransferase activity, phosphate group as acceptor
      cause: OTHER
      confidence: PROBABLE
      explanation: >-
        The PAINT node asserts a hydrolytic phosphoprotein phosphatase activity,
        but the characterised family members (maize/Arabidopsis PDRP, E. coli
        PSRP) reactivate their target by Pi-dependent pyrophosphorylation (EC
        2.7.4.27/2.7.4.28), a phosphoryl transfer to phosphate. Based on the
        E. coli paper's abstract-level statement and the EC/Rhea definitions; the
        Arabidopsis seed papers were not read.
