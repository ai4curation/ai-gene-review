taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  PpsR (PSRP, formerly DUF299/YdiA) is the phosphoenolpyruvate synthase
  regulatory protein of Escherichia coli, a cytoplasmic, homotetrameric
  bifunctional enzyme that controls PEP synthase (PpsA), the enzyme that
  converts pyruvate to phosphoenolpyruvate for gluconeogenesis. PpsR
  inactivates PEP synthase by an ADP-dependent phosphorylation (ADP as
  phosphoryl donor, AMP released), which requires prior phosphorylation of
  the PEP synthase catalytic histidine and is therefore inhibited by
  pyruvate. It reactivates PEP synthase by a Pi-dependent
  pyrophosphorylation (phosphorolysis) that releases pyrophosphate. By
  analogy with the plant pyruvate, phosphate dikinase regulatory protein, the
  modified residue is a threonine adjacent to the catalytic histidine. PpsR
  belongs to the pyruvate, phosphate/water dikinase regulatory protein family,
  which is unrelated to Hanks-type protein kinases.
