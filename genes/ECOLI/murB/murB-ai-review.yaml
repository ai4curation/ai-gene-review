core_functions:
- description: >-
    FAD-dependent, NADPH-driven reduction of UDP-GlcNAc-enolpyruvate (the MurA
    product) to UDP-N-acetylmuramate, the second committed step of cytosolic
    peptidoglycan precursor synthesis; the hydride passes from NADPH to bound FAD
    and then to the substrate, with Ser229 as proton donor.
  molecular_function:
    id: GO:0008762
    label: UDP-N-acetylmuramate dehydrogenase activity
  directly_involved_in:
  - id: GO:0009252
    label: peptidoglycan biosynthetic process
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:8448160
    supporting_text: The enzyme utilizes the 4-pro-S hydrogen of NADPH to reduce the
      enolpyruvyl group of UDP-N-acetylglucosamine enolpyruvate to the lactyl ether
      in UDP-N-acetylmuramic acid.
  - reference_id: PMID:9020778
    supporting_text: MurB catalyzes the second committed step in the synthesis of
      peptidoglycan, a key component of the bacterial cell wall.
suggested_questions:
- question: >-
    Is MurB flux in E. coli limited by NADPH supply or by feedback from UDP-MurNAc
    (via the dormant MurA-UDP-MurNAc complex), and does MurB physically associate
    with MurA or MurC to channel UDP-GlcNAc-enolpyruvate?
- question: >-
    Should GOA's IMP rows from PMID:16436710 (cell shape, cell wall organization,
    peptidoglycan biosynthesis) and the IDA cytoplasm row be re-evidenced, given
    that the paper's whole-cell assay used Staphylococcus epidermidis?
suggested_experiments:
- description: >-
    Construct a MurB depletion strain in E. coli K-12 and quantify
    UDP-GlcNAc-enolpyruvate accumulation, peptidoglycan synthesis rate and cell morphology,
    to provide genuine E. coli in vivo evidence for MurB's process role.
