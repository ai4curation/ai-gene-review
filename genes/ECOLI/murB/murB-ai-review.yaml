  evidence_type: IMP
  original_reference_id: PMID:16436710
  qualifier: acts_upstream_of_or_within
  review:
    summary: Over-annotation; MurB makes a peptidoglycan precursor and does not
      regulate cell shape. The cited inhibitor study reports no E. coli shape
      phenotype in its abstract.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      MurB catalyses a single biosynthetic step upstream of peptidoglycan
      polymerisation; any shape defect upon its loss is an indirect consequence of
      precursor depletion, not regulation of shape. The cited paper's whole-cell
      peptidoglycan experiments used Staphylococcus epidermidis, and its E. coli
      work concerned purified-enzyme inhibition and crystallography. Because the
      full text is not cached and the curator may have had additional reasoning,
      the row is marked over-annotated rather than removed. The specific process,
      peptidoglycan biosynthetic process (GO:0009252), is accepted elsewhere.
    supported_by:
    - reference_id: PMID:16436710
