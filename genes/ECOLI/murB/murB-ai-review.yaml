id: P08373
gene_symbol: murB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  MurB is the cytosolic UDP-N-acetylenolpyruvoylglucosamine reductase
  (UDP-N-acetylmuramate dehydrogenase, EC 1.3.1.98) of Escherichia coli, a
  monomeric flavoenzyme of the MurB family with a PCMH-type FAD-binding domain.
  It catalyses the second committed step of peptidoglycan precursor synthesis:
  NADPH-dependent reduction of the enolpyruvyl ether of UDP-GlcNAc-enolpyruvate
  (the MurA product) to the D-lactyl ether of UDP-N-acetylmuramic acid
  (UDP-MurNAc), the substrate of MurC. The enzyme carries stoichiometric
  tightly bound FAD and follows a ping-pong mechanism: NADPH (not NADH) delivers
  its 4-pro-S hydride to FAD, NADP+ leaves, and the enolpyruvyl substrate binds
  in the same pocket and is reduced by FADH2. Ser229 is the proton donor for
  that second half-reaction. Monovalent cations such as K+ activate the enzyme.
  Substrate binding closes a mobile domain over the active site, with Tyr190
  contacting the nucleotide alpha-phosphate.
