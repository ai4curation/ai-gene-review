id: P37758
gene_symbol: narU
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: NarU is a multipass nitrate/nitrite transporter of the major facilitator superfamily in the
  Escherichia coli inner membrane. It supports nitrate uptake and nitrite uptake and export, with a particular
  physiological advantage during nutrient starvation or slow growth. NarU can supply substrate for cytoplasmic
  respiratory nitrate reduction; nitrate reduction and subsequent nitrite reduction require separate enzymes.
  Its precise transport coupling mechanism remains unresolved.
