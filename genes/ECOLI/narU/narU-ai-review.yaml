- term:
    id: GO:0015112
    label: nitrate transmembrane transporter activity
  evidence_type: EXP
  original_reference_id: PMID:11967075
  qualifier: enables
  review:
    action: ACCEPT
    summary: NarU transports nitrate across the cytoplasmic membrane.
    reason: Isogenic strains retaining NarU but lacking NarK support nitrate-dependent anaerobic growth
      and nitrate uptake; the double mutant is defective. Mutagenesis and structural work corroborate
      substrate transport. NarU performs transport rather than nitrate reduction.
    supported_by:
    - reference_id: PMID:11967075
      supporting_text: Single mutants that lack either NarK or NarU were competent for nitrate-dependent
        anaerobic growth on a non-fermentable carbon source, glycerol.
    - reference_id: PMID:18691156
      supporting_text: NarK and NarU, catalyse nitrate uptake, nitrite export and nitrite uptake across
        the Escherichia coli cytoplasmic membrane by an unknown mechanism.
