  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR004737
  review:
    action: ACCEPT
    summary: NarU transports nitrite in both directions.
    reason: The native transport study supports nitrite uptake as well as export. Refinement only to the
      existing efflux term would discard the supported uptake component, so the direction-neutral nitrite
      transporter term remains informative.
    supported_by:
    - reference_id: PMID:18691156
      supporting_text: NarK and NarU, catalyse nitrate uptake, nitrite export and nitrite uptake across
        the Escherichia coli cytoplasmic membrane by an unknown mechanism.
    - reference_id: PMID:18691156
      supporting_text: We propose that NarU functions as a single channel for nitrate uptake and nitrite
        expulsion, either as a nitrate-nitrite antiporter, or more likely as a nitrate/H+ or nitrite/H+
        channel.
- term:
    id: GO:0015291
    label: secondary active transmembrane transporter activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: enables
  supporting_entities:
  - ARBA:ARBA00028018
  review:
    action: UNDECIDED
    summary: The exact energy-coupling mechanism of NarU remains unresolved.
    reason: The native study considered nitrate/nitrite exchange and proton-associated transport, while
      recent molecular simulations explicitly describe the mechanism as unresolved. MFS family membership
      and measured uptake alone do not establish secondary active coupling; the ARBA assignment cannot
      presently be resolved without direct coupling measurements.
    supported_by:
    - reference_id: PMID:18691156
      supporting_text: We propose that NarU functions as a single channel for nitrate uptake and nitrite
        expulsion, either as a nitrate-nitrite antiporter, or more likely as a nitrate/H+ or nitrite/H+
        channel.
    - reference_id: PMID:41649193
      supporting_text: NarK operates as a nitrate/nitrite antiporter, whereas NarU's mechanism remains
        unresolved, with evidence suggesting potential symport activity.
