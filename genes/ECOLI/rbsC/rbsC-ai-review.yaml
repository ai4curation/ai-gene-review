taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: RbsC is the integral inner-membrane permease subunit of the Escherichia coli RbsABC D-ribose
  importer. A homodimer of six-transmembrane-helix RbsC subunits, with cytoplasmic N and C termini, forms
  the translocation pathway; it binds ribose-loaded RbsB on the periplasmic side and the RbsA ATPase on
  the cytoplasmic side. RbsC is also exploited as an entry route by a contact-dependent growth inhibition
  toxin from Dickeya dadantii.
