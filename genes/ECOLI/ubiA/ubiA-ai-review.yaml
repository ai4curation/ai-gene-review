      buffer or detergent treatment.
suggested_questions:
- question: >-
    How is 4-hydroxybenzoate delivered from cytosolic UbiC, which retains its
    product tightly, to the membrane active site of UbiA?
suggested_experiments:
- hypothesis: UbiA activity determines side-chain length selectivity only through substrate availability.
  description: >-
    Express ubiA in strains producing different polyprenyl diphosphate chain
    lengths (IspB variants) and quantify the resulting ubiquinone species.
