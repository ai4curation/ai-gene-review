  label: Escherichia coli K-12
description: >-
  UbiA is the 4-hydroxybenzoate octaprenyltransferase of Escherichia coli (EC
  2.5.1.39), a polytopic inner-membrane enzyme of the UbiA prenyltransferase
  family with eight predicted transmembrane helices. Using Mg2+, it condenses
  the all-trans octaprenyl diphosphate side chain with 4-hydroxybenzoate
  supplied by the chorismate lyase UbiC, releasing diphosphate and forming
  3-octaprenyl-4-hydroxybenzoate, the first membrane-bound intermediate of
  ubiquinone-8 biosynthesis. The enzyme is tightly membrane-bound, cannot be
  solubilised by detergent without loss of activity, and in vitro also accepts
  geranyl, farnesyl and solanesyl diphosphates but not cis-configured
  polyprenyl diphosphates. ubiA mutants cannot prenylate 4-hydroxybenzoate and
  are ubiquinone-deficient. ubiA is co-transcribed with ubiC in the ubiCA
  operon, and the enzyme is the bacterial counterpart of eukaryotic COQ2.
