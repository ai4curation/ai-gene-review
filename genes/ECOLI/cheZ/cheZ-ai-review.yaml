suggested_questions:
- question: >-
    Should the CheZ-type phosphatase activity on response-regulator
    phosphoaspartate be represented by a specific child of phosphoprotein
    phosphatase activity (e.g. a protein-aspartyl-phosphate phosphatase term),
    distinguishing it from serine/threonine, tyrosine and histidine
    phosphatases?
- question: >-
    Is CheZ considered a participant in GO:0000160 phosphorelay signal
    transduction system (as the signal-terminating enzyme acting on the
    response regulator), or only in its regulation?
suggested_experiments:
- description: >-
    Quantify the fraction of CheZ activity that occurs at polar arrays versus in
    the cytosol in vivo (e.g. FRET with localization-defective CheZ mutants such
    as L90S/F117S) to establish how much the polar pool contributes to setting
    CheY-P levels.
