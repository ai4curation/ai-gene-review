      acts on CheY-P before CheY-P reaches the motor and is not a part of the
      flagellar structure. The mapping conflates "flagellar rotation/chemotaxis"
      with the organelle; it is demonstrably wrong for E. coli CheZ, and no CheZ
      family member is known to be a flagellar component.
