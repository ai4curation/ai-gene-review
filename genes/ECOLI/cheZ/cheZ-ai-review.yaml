id: P0A9H9
gene_symbol: cheZ
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  CheZ is the phosphatase of the Escherichia coli chemotaxis signal transduction
  pathway. It accelerates dephosphorylation of the phosphorylated response
  regulator CheY (CheY-P), the diffusible signal that binds the flagellar motor
  switch and promotes clockwise rotation (tumbling). CheZ is a homodimer whose
  core is a long four-helix bundle built from two helices of each subunit; each
  dimer carries two active sites. CheY-P binds the CheZ C-terminal region with
  far higher affinity than unphosphorylated CheY, and the side chain of Gln147
  inserts into the CheY active site, where it is thought to position a water
  molecule for attack on the aspartyl phosphate. Steady-state CheZ kinetics are
  sigmoidal with respect to CheY-P (kcat about 5 per second), giving
  autoregulation by the substrate. CheZ is a soluble cytoplasmic protein, but a
  fraction is recruited to the polar chemoreceptor arrays through binding to the
  short CheA isoform (CheA-S, via helix E of its truncated P1 domain); CheA-S
  binding also enhances CheZ activity. Loss of CheZ gives very high tumbling
  rates and abolishes chemotaxis, while CheZ abundance sets the basal tumble bias,
  which E. coli lowers during swarming by stabilising CheZ.
