core_functions:
- description: >-
    CheY-P phosphatase: the CheZ homodimer binds phosphorylated CheY via its
    C-terminal region and accelerates hydrolysis of the CheY aspartyl phosphate,
    with Gln147 inserted into the CheY active site; this terminates the
    clockwise (tumble) signal and sets steady-state CheY-P levels in the
    chemotaxis pathway. Dephosphorylation of CheY-P in the bulk cytoplasm is
    the dominant mode; a fraction of CheZ is also recruited to polar
    chemoreceptor arrays by CheA-S, which stimulates its activity, so the
    array association and cell-pole location are recorded as non-core rows
    rather than as the venue of the core activity.
  molecular_function:
    id: GO:0004721
    label: phosphoprotein phosphatase activity
  directly_involved_in:
