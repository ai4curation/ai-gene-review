      displayed marked sigmoidicity with respect to CheYp concentration and a k(cat)
      of 4.9 s(-1).
  - reference_id: PMID:12080332
    supporting_text: The side chain of Gln 147 of CheZ inserts into the CheY active
      site and is essential to the dephosphorylation activity of CheZ.
  - reference_id: PMID:8820640
    supporting_text: Finally, the CheAS/CheZ complex formed in vitro shows a greater
      dephosphorylating activity on CheY-P than does free CheZ.
  - reference_id: PMID:353036
    supporting_text: Mutants defective in cheA, cheW, cheX, or cheY function swam
      smoothly, with little or no tumbling, whereas cheB or cheZ mutants exhibited
      very high tumbling rates.
