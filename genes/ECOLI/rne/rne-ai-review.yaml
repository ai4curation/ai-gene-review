- term:
    id: GO:0000287
    label: magnesium ion binding
  evidence_type: IMP
  original_reference_id: PMID:25404697
  qualifier: enables
  review:
    summary: Mutation of a Mg2+-chelating aspartate abolishes Mg2+-dependent activity.
    action: KEEP_AS_NON_CORE
    reason: The D346C mutant shows that Mg2+ coordination by the active site supports catalysis; cofactor
      binding is ancillary to the core activity.
    supported_by:
    - reference_id: PMID:25404697
      supporting_text: A mutation to one of the residues known to chelate Mg(2+), D346C, led to almost
        complete loss of activity dependent on Mg(2+)
    - reference_id: file:ECOLI/rne/rne-uniprot.txt
      record_section: ["CC:COFACTOR"]
      supporting_text: Binds 1 Mg(2+) ion per subunit.
- term:
    id: GO:0000967
    label: rRNA 5'-end processing
  evidence_type: IMP
  original_reference_id: PMID:10329633
  qualifier: acts_upstream_of_or_within
  review:
    summary: RNase E acts with RNase G in 5'-end maturation of 16S rRNA.
    action: ACCEPT
    reason: Genetic inactivation slows 16S 5' maturation and purified RNase E processes the precursor
      in vitro; the acts_upstream_of_or_within qualifier is conservative.
    supported_by:
    - reference_id: PMID:10329633
      supporting_text: inactivation of the endoribonuclease RNase E slows down in vivo maturation of 16S
        RNA from the 17S RNase III cleavage product
    - reference_id: PMID:10329633
      supporting_text: Precursors also can be processed in vitro by RNase E and CafA.
    - reference_id: file:ECOLI/rne/rne-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: Required for the maturation of 5S and 16S rRNAs and the majority of tRNAs.
