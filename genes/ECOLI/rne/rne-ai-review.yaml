id: P21513
gene_symbol: rne
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: RNase E (rne) is the essential, membrane-associated endoribonuclease that initiates decay
  of most mRNAs and processes rRNA and tRNA precursors in Escherichia coli. Its conserved N-terminal half
  forms a Zn-linked homotetramer whose 5'-sensor pocket favours 5'-monophosphorylated single-stranded
  substrates, cleaving in A/U-rich regions. Its natively disordered C-terminal half binds the inner membrane,
  RNA, and the degradosome partners RhlB, enolase and PNPase, acting as the scaffold of the RNA degradosome.
