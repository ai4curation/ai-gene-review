suggested_questions:
- question: >-
    How much do Alr and the catabolic racemase DadX each contribute to the
    cytoplasmic D-alanine pool for peptidoglycan synthesis under different growth
    conditions, given that only the double mutant is strictly D-alanine
    dependent?
- question: >-
    Is the monomer-dimer equilibrium of E. coli Alr used physiologically to tune
    racemase activity, or is it simply a property of the purified enzyme?
suggested_experiments:
- experiment_type: genetic and metabolite analysis
  description: >-
    Measure intracellular D-alanine, UDP-MurNAc-pentapeptide and growth of
    single alr, single dadX and double mutants in minimal and alanine-rich media,
    with and without D-cycloserine, to apportion D-alanine supply between the
    two racemases.
