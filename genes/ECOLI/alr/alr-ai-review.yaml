id: P0A6B4
gene_symbol: alr
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  Alr is the constitutive, biosynthetic alanine racemase of Escherichia coli, a
  pyridoxal 5'-phosphate (PLP)-dependent enzyme that interconverts L-alanine and
  D-alanine. The PLP cofactor is bound as a Schiff base to Lys34, and the active
  site is built at the interface of two subunits, with residues of the
  opposite monomer (Arg280, Arg300) cooperating with Asp164 and Glu165 at the
  substrate entryway to orient the substrate. Alr acts in the cytoplasm, where
  it supplies the D-alanine that D-alanine-D-alanine ligase joins into the
  D-Ala-D-Ala dipeptide added by MurF to the peptidoglycan precursor. E. coli
  has a second, catabolic alanine racemase, DadX, so cells become strictly
  D-alanine dependent only when both alr and dadX are inactivated. Alr is a
  target of the antibiotic D-cycloserine. The enzyme exists in a dynamic
  monomer-dimer equilibrium, and its high dimerization constant correlates with
  high catalytic activity.
