  review:
    summary: Gel filtration, native PAGE and analytical ultracentrifugation show
      E. coli Alr (among seven alanine racemases) in monomer-dimer equilibrium.
    action: KEEP_AS_NON_CORE
    reason: >-
      Directly measured self-association, and dimerization is mechanistically
      relevant (two-subunit active site; association constant tracks Vmax). It
      is nonetheless an architectural property supporting the racemase activity,
      not the activity itself, so non-core.
    supported_by:
    - reference_id: PMID:20971724
      supporting_text: All alanine racemases were proved to be in a dynamic equilibrium
        between monomeric and dimeric form with every methods used in this study.
    - reference_id: PMID:20971724
      supporting_text: In both biosynthetic and catabolic alanine racemases, association
        constants for dimerization were high for the enzymes with high V(max) values.
