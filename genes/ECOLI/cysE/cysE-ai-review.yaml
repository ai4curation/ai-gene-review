    label: response to X-ray
  evidence_type: IMP
  original_reference_id: PMID:27718375
  qualifier: acts_upstream_of_or_within
  review:
    summary: >-
      A Keio-collection screen listed the cysE deletion among mutants with
      increased radiation sensitivity.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The phenotype comes from a genome-wide knockout screen, which reports the
      cysE mutant only as one of 33 uncommon hits, without mechanism. CysE
      does none of the work of an X-ray response; the sensitivity most
      plausibly follows indirectly from reduced cysteine (and so glutathione
      and thiol) supply. The finding is real, but it is not a process the
      enzyme participates in.
    supported_by:
    - reference_id: PMID:27718375
      supporting_text: >-
        Our 76 genes includes 43 common genes and 33 uncommon (potentially
        novel) genes, i.e., appY, atoS, betB, bglJ, clpP, cpxA, cysB, cysE,
        ddlA
