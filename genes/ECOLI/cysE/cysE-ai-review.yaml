taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  CysE is the serine O-acetyltransferase (SAT, EC 2.3.1.30) of Escherichia coli.
  This cytosolic hexapeptide-repeat acyltransferase transfers the acetyl group
  of acetyl-CoA to L-serine, forming O-acetyl-L-serine, the substrate that
  O-acetylserine sulfhydrylase (CysK or CysM) sulfhydrylates to L-cysteine. The
  enzyme is a hexamer (a dimer of homotrimers) and is feedback-inhibited by
  L-cysteine; a feedback-insensitive point mutant causes cysteine excretion.
  Its C terminus docks into the active site of CysK to form the bienzyme
  cysteine synthase complex, in which CysE remains active while the bound CysK
  is inhibited.
