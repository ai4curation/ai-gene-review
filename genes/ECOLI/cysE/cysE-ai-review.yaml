suggested_questions:
- question: >-
    Does the cysteine synthase complex mainly stabilise CysE and protect it
    from cold inactivation, or does it set flux by sequestering CysK in vivo?
- question: >-
    Is the radiation sensitivity of the cysE knockout fully reversed by
    cysteine or glutathione supplementation, confirming an indirect effect?
suggested_experiments:
- description: >-
    Compare growth, intracellular O-acetyl-L-serine and cysteine in cysE
    strains complemented with wild-type CysE or a C-terminal-truncated variant
    that cannot dock into CysK, to separate catalysis from complex formation.
  experiment_type: genetic complementation and metabolite profiling
- description: >-
    Repeat X-ray survival assays of the cysE deletion with and without
    cysteine or glutathione supplementation.
  experiment_type: phenotypic rescue
