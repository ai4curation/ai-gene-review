    label: periplasmic side of plasma membrane
  evidence_type: NAS
  original_reference_id: PMID:10518736
  qualifier: located_in
  review:
    summary: This term places TolC on the periplasmic face of the plasma membrane, that is the
      inner membrane. TolC is an integral outer-membrane protein and is never in the inner membrane.
      The cited papers concern the inner-membrane transporters of the tripartite pumps, where
      the location is correct for the partner and wrong for TolC.
    action: REMOVE
    reason: Removed, and this is not second-guessing an experimental annotation whose full text
      is unavailable. It is a mislocation to the wrong membrane of a two-membrane machine, contradicted
      by eight direct-evidence rows for the outer membrane, and asserted here only by non-traceable
      author statement, the weakest code available. The periplasmic-side-of-outer-membrane term
      would not fit either, since TolC spans the membrane rather than occupying one leaflet.
