id: P02930
gene_symbol: tolC
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli (strain K12)
description: 'TolC is a homotrimeric outer-membrane protein of Escherichia coli that forms a gated
  exit duct for material leaving the cell. The three subunits build a single continuous conduit
  over 140 angstroms long: each contributes four strands to a shared twelve-stranded barrel in
  the outer membrane, which then continues into the periplasm as a long alpha-helical tunnel.
  The periplasmic end is sealed in the resting state by packed coiled coils, so the duct is closed
  until a partner opens it. TolC carries no energising component, no substrate-binding site and
  no catalytic activity; both specificity and energy come from an inner-membrane transporter,
  which a periplasmic adaptor protein bridges to TolC. Because the duct itself is generic, it
  is shared across transporter superfamilies: the same protein serves the RND pump AcrAB, the
  ABC pump MacAB and the major-facilitator pump EmrAB, with different affinities for their respective
  adaptors. Its substrates span structurally unrelated antibiotics, dyes and steroids, and also
  endogenous compounds, including the siderophore enterobactin, for which TolC appears to be the
  only route out of the periplasm, and protoporphyrin IX, which accumulates in its absence. The
  same duct conducts protein cargo in type I secretion, where it is specifically required for
  hemolysin export through a channel that forms only when substrate engages the inner-membrane
  translocase and then reverts. It also works in reverse as the entry route for colicin E1, which
  is recognised through the colicin''s N-terminal translocation domain.'
