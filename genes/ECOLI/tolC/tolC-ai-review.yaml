      protein from other references, so this is the same assertion misdirected to the partner's
      membrane.
    proposed_replacement_terms: *id001
core_functions:
- description: Shared gated exit duct of the outer membrane. TolC supplies the outer-membrane
    passage for tripartite efflux pumps, opening its sealed periplasmic entrance when a periplasmic
    adaptor recruits it to an inner-membrane transporter, and closing again afterwards. It contributes
    the conduit rather than the selectivity or the driving force, which is why one duct serves
    RND, ABC and major-facilitator transporters indifferently. This single molecular step accounts
    for both the drug-resistance phenotypes and the export of endogenous substrates such as enterobactin
    and protoporphyrin IX; only the partner and the cargo change.
  molecular_function:
    id: GO:0015562
    label: efflux transmembrane transporter activity
  directly_involved_in:
  - id: GO:0140317
    label: export across cell outer membrane
  - id: GO:0140330
    label: xenobiotic detoxification by transmembrane export across the cell outer membrane
  in_complex:
    id: GO:1990281
    label: efflux pump complex
  locations:
  - id: GO:0009279
    label: cell outer membrane
  supported_by:
  - reference_id: PMID:10879525
    supporting_text: Three TolC protomers assemble to form a continuous, solvent-accessible conduit--a
      'channel-tunnel' over 140 A long that spans both the outer membrane and periplasmic space.
  - reference_id: PMID:10879525
    supporting_text: The periplasmic or proximal end of the tunnel is sealed by sets of coiled
      helices.
  - reference_id: PMID:19805313
    supporting_text: The affinity of TolC to MFPs decreases in the order MacA > EmrA > AcrA.
  knowledge_gaps:
  - gap_statement: 'No GO molecular function distinguishes a gated outer-membrane exit duct from
      a passive general-diffusion porin. The efflux transporter term is the closest available
      and is what the whole outer-membrane-factor family carries, but it does not express the
      gating, the dependence on a partner to open the channel, or the absence of selectivity.
      The gap is why porin activity keeps attaching to this family, which is the opposite of the
      biology: disrupting tolC increases outer-membrane permeability rather than decreasing it.'
    boundary: Keep the efflux transporter term as the molecular function and mark the porin rows
      over-annotated rather than removing them, since they follow a family-wide convention rather
      than a TolC-specific error.
    gap_kind:
    - ONTOLOGY
  - gap_statement: The inner-membrane partner for enterobactin export is unidentified. All seven
      candidate RND transporters were excluded, yet export across the outer membrane still requires
      TolC, so the transporter that delivers enterobactin to the duct is unknown.
    boundary: Annotate the enterobactin transporter function and process on TolC, which the exclusive
      genetics support, and assert nothing about the partner.
    gap_kind:
    - BIOLOGY
- description: 'Outer-membrane conduit for type I protein secretion. The same duct conducts polypeptide
    cargo, and here the assembly is conditional rather than standing: the inner-membrane translocase
    contacts TolC only once substrate engages it, forming one contiguous channel without ATP hydrolysis
    at the outer membrane, after which the bridge reverts. This is mechanistically distinct from
    the drug pumps, which assemble constitutively whether or not substrate is present, and is
    kept separate so that the efflux annotations do not absorb it.'
  molecular_function:
    id: GO:0015562
    label: efflux transmembrane transporter activity
  directly_involved_in:
  - id: GO:0140317
    label: export across cell outer membrane
  locations:
  - id: GO:0009279
    label: cell outer membrane
  supported_by:
  - reference_id: PMID:2112747
    supporting_text: an E. coli outer membrane protein, the TolC protein, encoded by a gene not
      located in the hly cluster, is specifically required for hemolysin secretion
  - reference_id: PMID:9822594
    supporting_text: Export thus occurs via a contiguous channel which is formed, without traffic
      ATPase ATP hydrolysis, by substrate-induced, reversible bridging of the IM translocase to
      the OM export pore.
  knowledge_gaps:
  - gap_statement: The protein-secretion use has no machine-readable home on this protein. No
      outer-membrane factor anywhere carries the type I secretion process term, and in all of
      GO only two experimental annotations to it exist, both from one paper and both on other
      components, the cargo HlyA and the adaptor HlyD. Curators who annotated the hemolysin system
      chose not to annotate the duct.
    boundary: 'Do not propose the type I secretion process term for TolC. The systematic absence
      across every outer-membrane factor is a convention to identify rather than a gap to fill,
      and the capability is recorded in this core function''s prose instead. A second reason points
      the same way: the hly locus is not present in K-12, so the capability was demonstrated by
      supplying the partners to a K-12 host.'
    gap_kind:
    - CURATION
    - ONTOLOGY
- description: 'Entry route for colicin E1, the one case in which cargo moves inward through the
    duct. The toxin is recognised through its own N-terminal translocation domain, and the interaction
    occurs at the periplasmic face of the channel and depends on a transmembrane potential. The
    specificity is genuine rather than incidental: colicins E3 and N do not occlude TolC at any
    potential, and colicin E1 does not affect OmpF.'
  molecular_function:
    id: GO:0042912
    label: colicin transmembrane transporter activity
  locations:
  - id: GO:0009279
    label: cell outer membrane
  supported_by:
  - reference_id: PMID:15465872
    supporting_text: The OmpF recognition sites of colicins E3 and N, and the TolC recognition
      site of colicin E1, were found to reside in the N-terminal translocation domains.
  - reference_id: PMID:15465872
    supporting_text: This implies that the N-terminal segment, residues 1 – 180, containing the
      T-domain, mediates the interaction of colicin E1 with TolC.
  knowledge_gaps:
  - gap_statement: Whether colicin E1 is actually translocated through TolC or merely plugs it
      is unresolved. The bilayer work shows occlusion from the periplasmic side, and newer structural
      work frames the interaction as the colicin opening its hinge to plug the channel, which
      is not the same as threading through it.
    boundary: Assert the colicin transporter function, following the precedent that the equivalent
      translocator OmpF carries it for colicins E3 and N, and record the plug-versus-thread question
      rather than choosing between the models.
    gap_kind:
    - BIOLOGY
suggested_questions:
- question: Should a molecular function be created for outer-membrane-factor exit-duct activity?
    TolC, PrtF and AprF all carry only the generic efflux transporter term, which cannot express
    gating, partner-dependent opening, or the fact that the duct selects nothing. The absence
    is also why porin activity keeps being applied to this family.
- question: Why does no outer-membrane factor carry the type I secretion process term, when the
    duct is an obligatory component of every such system? Only two experimental annotations to
    that term exist in all of GO, on the cargo and the adaptor of one system. Clarifying whether
    this is deliberate would settle how the protein-export use of TolC should be recorded.
- question: Is the efflux transporter term intended to cover protein cargo? Two rows on TolC rest
    on hemolysin secretion rather than on small-molecule efflux. The term's definition does cover
    a protein substrate, but using one term for both cargo classes makes the two uses indistinguishable
    to anything reading the annotations.
- question: Which inner-membrane transporter delivers enterobactin to TolC? All seven RND transporters
    were excluded while the TolC requirement remained absolute, so a partner is missing from the
    model.
suggested_experiments:
- description: Identify the inner-membrane partner for enterobactin export by screening transporter
    deletions outside the RND family, which were excluded, for the TolC-dependent excretion defect.
    This would complete the one TolC-dependent route whose machine is still unnamed.
- description: Determine whether colicin E1 translocates through TolC or plugs it, for instance
    by testing whether a tagged colicin reaches the cytoplasm in a strain whose TolC periplasmic
    gate is locked open or shut. The result decides whether the colicin transporter molecular
    function proposed here is accurate or should become a binding or receptor assertion.
- description: Compare the single-channel behaviour of TolC in isolation against TolC engaged
    by each of its three adaptor classes in the same bilayer system. Showing that conductance
    depends on which partner opens the duct would give the gating a measurable signature, which
    is what a new exit-duct molecular function would need in order to be defined.
