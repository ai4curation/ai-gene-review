- id: PMID:10518736
  title: Role of multiple efflux pumps in Escherichia coli in indole expulsion.
  findings:
  - statement: AcrEF, one of the TolC-dependent RND efflux systems, exports the endogenous tryptophan
      metabolite indole; deleting acrEF reduced excretion and raised intracellular indole, and
      reintroducing the gene restored excretion.
    supporting_text: Defined inactivation of the acrEF gene, the product of which is known as
      an energy-dependent multiple drug efflux pump, decreased indole excretion while reintroduction
      of the acrEF gene restored it.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Verified against the cached abstract. The study is about AcrEF and does not
      examine TolC. It is adequate support for the efflux pump complex and export process assertions,
      since AcrEF requires TolC, but it supports no claim about TolC's own location, and the periplasmic-side-of-plasma-membrane
      row drawn from it is removed in this review.
- id: PMID:10806384
  title: Proteomic analysis of the Escherichia coli outer membrane.
  findings:
  - statement: A dedicated outer-membrane proteomic survey of E. coli K-12 recovered most predicted
      integral outer-membrane proteins, including TolC.
    supporting_text: Applying this method to examine E. coli K-12 cells grown in minimal media
      we identified 21 out of 26 (80%) of the predicted integral OMPs that are annotated in SWISS-PROT
      release 37
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: 'Verified against the cached abstract. An inventory paper: sound support for
      the outer-membrane location but carrying no functional claim about TolC.'
- id: PMID:10879525
  title: Crystal structure of the bacterial membrane protein TolC central to multidrug efflux
    and protein export.
  findings:
  - statement: Three TolC protomers form a single continuous channel-tunnel over 140 Angstroms
      long spanning the outer membrane and the periplasm, with the periplasmic end sealed by coiled
      helices that must be untwisted allosterically to open the duct.
    supporting_text: Three TolC protomers assemble to form a continuous, solvent-accessible conduit--a
      'channel-tunnel' over 140 A long that spans both the outer membrane and periplasmic space.
  - statement: The closed resting state is the basis for treating TolC as a gated duct rather
      than a porin.
    supporting_text: The periplasmic or proximal end of the tunnel is sealed by sets of coiled
      helices.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The defining structural reference for this gene, cited by UniProt for the DOMAIN
      description. Cached record is abstract-only but the abstract itself states both the trimeric
      assembly and the sealed periplasmic end.
- id: PMID:11544226
  title: Novel macrolide-specific ABC-type efflux transporter in Escherichia coli.
  findings:
  - statement: 'MacAB is a macrolide-specific ABC-type efflux system that is strictly dependent
      on TolC: a TolC-deficient host carrying the macAB plasmid gained no macrolide resistance.'
    supporting_text: TolC-deficient E. coli ZK796 was transformed with pUCmacAB. The resulting
      transformed cells showed no increase in resistance (Table 2 ), indicating that the MacAB
      system depends on TolC.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text available and read. Establishes the TolC dependence of MacAB directly.
      The GO:1990961 annotation drawn from it places the export across the plasma membrane, which
      this review modifies to the outer-membrane term; the reference itself makes no such claim
      and correctly calls TolC an outer membrane channel.
- id: PMID:12501312
  title: Growth phase-dependent transcription of emrKY, a homolog of multidrug efflux emrAB genes
    of Escherichia coli, is induced by tetracycline.
  findings:
  - statement: EmrK and EmrY are close homologues of the EmrA adaptor and EmrB transporter and
      together constitute a multidrug efflux pump, one of the major-facilitator systems that use
      TolC.
    supporting_text: EmrK and EmrY are 50.4 and 63.3% identical in amino acid sequences to EmrA
      and EmrB, respectively, which together make up a multidrug resistant pump.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Verified against the cached abstract. The paper concerns transcriptional induction
      of emrKY and does not examine TolC. Weak but consistent support for efflux pump complex
      membership; the location row drawn from it is removed.
- id: PMID:12923103
  title: 'Efflux of cytoplasmically acting antibiotics from gram-negative bacteria: periplasmic
    substrate capture by multicomponent efflux pumps inferred from their cooperative action with
    single-component transporters.'
  findings:
  - statement: Multiplicative resistance when single- and multi-component pumps are co-expressed
      can only be explained if the multicomponent pump captures its substrate in the periplasm
      rather than the cytosol.
    supporting_text: this cooperative effect can be accounted for only if substrate capture by
      the multicomponent efflux transporter occurs in the periplasm but not the cytosol
  reference_review:
    relevance: LOW
    correctness: MISCITED
    review_notes: Correctly identified paper, but it does not support the annotation it is cited
      for. It is a theoretical analysis of where the inner-membrane transporter picks up substrate
      and makes no claim about TolC's membrane; the periplasmic-side-of-plasma-membrane row drawn
      from it misattributes the partner's location to TolC and is removed.
- id: PMID:15155734
  title: AcrA, AcrB, and TolC of Escherichia coli Form a Stable Intermembrane Multidrug Efflux
    Complex.
  findings:
  - statement: The assembled AcrA-AcrB-TolC complex is stable through separation of the two membranes
      and subsequent purification, with all three components co-purifying regardless of which
      carries the affinity tag.
    supporting_text: All three components of the complex co-purify when the affinity tag is attached
      to either of the proteins suggesting bi-partite interactions between AcrA, AcrB, and TolC.
  - statement: Substrate antibiotics stabilise interactions within the complex, and assembly requires
      no energy input.
    supporting_text: We show that antibiotics, the substrates of AcrAB-TolC, stabilize interactions
      within the complex.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Verified against the cached abstract; full text not cached. Directly supports
      the complex-membership and contributes_to efflux annotations. The generic protein binding
      row drawn from it is removed as uninformative, not as wrong.
- id: PMID:15228545
  title: Interactions underlying assembly of the Escherichia coli AcrAB-TolC multidrug efflux
    system.
  findings:
  - statement: In vivo cross-linking showed AcrB and AcrA joined to the outer-membrane TolC exit
      duct in one contiguous complex spanning the cell envelope, with AcrA the component that
      couples the transporter to the duct.
    supporting_text: the antiporter AcrB and the adaptor AcrA, which form a translocase in the
      inner membrane, interact with the outer membrane TolC exit duct to form a contiguous proteinaceous
      complex spanning the bacterial cell envelope
  - statement: Drug-pump assembly is constitutive, which the authors contrast explicitly with
      the substrate-induced assembly of the TolC-dependent protein export machinery.
    supporting_text: Assembly of the pump appeared to be constitutive, occurring in the presence
      and absence of drug efflux substrate.
  - statement: Calorimetry detected no AcrB-TolC interaction but energetically favourable AcrA
      interactions with both, establishing the adaptor as the obligatory link.
    supporting_text: calorimetry demonstrated energetically favourable interactions of AcrA with
      both AcrB and TolC proteins
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Verified against the cached abstract; cited by UniProt for function, interaction,
      subunit, location and disruption phenotype. The single most informative reference in this
      set for distinguishing TolC's two modes of use.
- id: PMID:15465872
  title: 'Colicin occlusion of OmpF and TolC channels: outer membrane translocons for colicin
    import.'
  findings:
  - statement: Colicin E1 added to the trans side of a bilayer occludes TolC channels in a potential-dependent,
      reversible manner; colicins E3 and N do not occlude TolC at any potential, and colicin E1
      does not affect OmpF.
    supporting_text: OmpF and TolC channels in planar bilayers were occluded by colicins E3 and
      E1, respectively, from the trans- side of the membrane.
  - statement: The TolC recognition element lies in the colicin's N-terminal translocation domain,
      narrowed to residues 1-180.
    supporting_text: This implies that the N-terminal segment, residues 1 – 180, containing the
      T-domain, mediates the interaction of colicin E1 with TolC.
  - statement: TolC with BtuB is proposed to form a two-receptor translocon for colicin E1 import.
    supporting_text: A similar translocon could be formed by BtuB, TolC, and colicin E1
  - statement: TolC conducts ions in planar bilayers with a main state of 80 pS in 1 M KCl; this
      conductance is the readout used to detect colicin binding.
    supporting_text: In the planar bilayer experiments, TolC shows an asymmetric channel conductance
      that is dependent on transmembrane potential polarity, with a main conductance state of
      80 pS at cis -positive potentials in 1 M KCl, pH 7.0, and 20 pS in 0.1M KCl
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Full text available and read. Supports the colicin E1 interaction and the bilayer
      ion conductance. Note that the four GOA rows drawn from it span three different claims of
      very unequal physiological weight: the colicin relationship is a genuine function, while
      the ion channel and ion transport rows record an assay readout and are flagged as over-annotated
      here.'
- id: PMID:15576805
  title: Interaction between the TolC and AcrA proteins of a multidrug efflux system of Escherichia
    coli.
  findings:
  - statement: Cross-linking gave independent biochemical evidence for a direct TolC-AcrA interaction,
      independent of efflux substrate and of AcrB, consistent with genetics in which suppressors
      of a mutant tolC strain mapped to acrA.
    supporting_text: This paper provides the biochemical evidence for physical interactions between
      the outer membrane component, TolC, and the membrane fusion protein component, AcrA, of
      the major antibiotic efflux pump of Escherichia coli.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text available. A clean independent corroboration of adaptor-mediated recruitment.
      Its only GOA row is generic protein binding, which this review removes as uninformative;
      the finding itself is sound and is retained here.
- id: PMID:15743938
  title: Aminoglycosides are captured from both periplasm and cytoplasm by the AcrD multidrug
    efflux transporter of Escherichia coli.
  findings:
  - statement: Reconstituted AcrD can capture aminoglycosides from the periplasmic side and extrude
      them, acting as a periplasmic vacuum cleaner, and its activity requires the adaptor AcrA.
    supporting_text: This result suggested that AcrD can also capture aminoglycosides from the
      periplasm to extrude them into the medium in intact cells, acting as a "periplasmic vacuum
      cleaner."
  - statement: The requirement for AcrA within the proteoliposomes illustrates the adaptor-mediated
      architecture by which TolC is recruited.
    supporting_text: This activity required the presence of AcrA within the proteoliposomes.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: 'Full text available. The two rows drawn from it are adjudicated differently
      in this review: the detoxification process and efflux pump complex assertions follow soundly
      from AcrD''s TolC dependence, while the periplasmic-side-of-plasma-membrane location describes
      AcrD rather than TolC and is removed.'
- id: PMID:15911532
  title: Localization, annotation, and comparison of the Escherichia coli K-12 proteome under
    two states of growth.
  findings:
  - statement: Fractionation-based proteomic survey assigning 2,160 protein forms to the cytosol,
      periplasm, inner membrane or outer membrane.
    supporting_text: 2,160 were annotated and assigned to the cytosol, periplasm, inner membrane,
      and outer membrane by biochemical fractionation followed by two-dimensional gel electrophoresis
      and tandem mass spectrometry
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Verified against the cached abstract. A localisation inventory consistent with
      the curated outer-membrane assignment; no functional content.
- id: PMID:16079137
  title: Protein complexes of the Escherichia coli cell envelope.
  findings:
  - statement: Blue native PAGE of separated inner and outer membranes, with second-dimension
      SDS-PAGE and mass spectrometry, identified 43 distinct envelope complexes; UniProt cites
      this work for TolC's homotrimeric state and outer-membrane location.
    supporting_text: we have optimized the blue native-PAGE technique for the study of membrane
      protein complexes in the inner and outer membranes of Escherichia coli
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: 'Cached record is abstract-only and does not name TolC, so the trimer and location
      assignments rest on the curator''s reading of the full text. That is not a reason to doubt
      them: both are independently established by crystallography and by direct purification from
      the outer membrane.'
- id: PMID:16101295
  title: Direct interaction of multidrug efflux transporter AcrB and outer membrane channel TolC
    detected via site-directed disulfide cross-linking.
  findings:
  - statement: Site-directed disulfide cross-linking detected an AcrB-TolC adduct between the
      tips of the AcrB hairpins and the bottoms of the TolC coiled coils, interpreted as a transient
      tip-to-tip encounter and unaffected by AcrA or substrate.
    supporting_text: The AcrB-TolC complex formed through disulfide cross-linking was detected
      when a specific pair of mutants was coexpressed in E. coli.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Verified against the cached abstract. The interaction is real but transient,
      and both the calorimetry and the nanodisc reconstitution in other references found no stable
      direct AcrB-TolC association; UniProt records that TolC is thought not to contact AcrB stably.
- id: PMID:16166532
  title: TolC is involved in enterobactin efflux across the outer membrane of Escherichia coli.
  findings:
  - statement: TolC but none of the seven RND transporters is essential for enterobactin export
      across the outer membrane.
    supporting_text: the outer membrane channel tunnel protein TolC but none of the respective
      seven resistance nodulation cell division (RND) proteins CusA, AcrB, AcrD, AcrF, MdtF (YhiV),
      or the twin RND MdtBC (YegNO) was essential for enterobactin export across the outer membrane
  - statement: The tolC mutant excreted no detectable enterobactin and grew poorly under iron
      depletion, whereas RND deletions had no such effect.
    supporting_text: Strains with deletion of tolC or entS , but not with deletion of genes encoding
      RND transporters, excreted very little enterobactin into the growth medium.
  - statement: TolC appears to be the only route out of the periplasm for enterobactin.
    supporting_text: it seems that TolC forms the only pathway for enterobactin to leave the periplasm
      to the outside
  - statement: tolC expression is not iron-responsive, so the fur background used in the genetic
      analysis deregulates enterobactin synthesis rather than controlling tolC.
    supporting_text: Quantitative reverse transcription-PCR analysis of gene-specific transcripts
      showed no significant changes in tolC expression upon iron depletion.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text available and read. The strongest evidence in the set that TolC serves
      endogenous physiology rather than only drug resistance, and the reason the enterobactin-specific
      terms are accepted while the bile acid ones are flagged. Note that the inner-membrane partner
      remains unidentified, which is recorded as a knowledge gap.
- id: PMID:17210767
  title: Substrate competition studies using whole-cell accumulation assays with the major tripartite
    multidrug efflux pumps of Escherichia coli.
  findings:
  - statement: AcrAB-TolC is the major constitutive tripartite pump of E. coli and recognises
      structurally unrelated substrates including many antibiotics, dyes and steroids; substrate
      competition failed to raise cell-associated levels, indicating a large simultaneous handling
      capacity.
    supporting_text: AcrAB-TolC is the major, constitutively expressed tripartite multidrug efflux
      system in Escherichia coli that recognizes various structurally unrelated molecules, including
      many antibiotics, dyes, and steroids.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text available. The best documentation in the set of substrate breadth,
      which is the behaviour expected of a conduit with no substrate site of its own. Its process
      row is accepted; its periplasmic-side-of-plasma-membrane location row is removed, as the
      paper makes no localisation claim for TolC.
- id: PMID:17309111
  title: Comparison of SDS- and methanol-assisted protein solubilization and digestion methods
    for Escherichia coli membrane proteome analysis by 2-D LC-MS/MS.
  findings:
  - statement: A methodological comparison of solubilisation approaches applied to the inner membrane
      fraction of an E. coli K-12 lysate.
    supporting_text: two methods of protein solubilization, namely using 60% methanol or 1% SDS,
      to dissolve and analyze the inner membrane fraction of an Escherichia coli K12 cell lysate
      were compared
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Verified against the cached abstract. Weak support for the cell outer membrane
      row it underpins, since the fraction analysed was the inner membrane; recovering TolC there
      reflects imperfect envelope separation. Accepted only because the location is settled by
      stronger rows.
- id: PMID:18955484
  title: MacB ABC transporter is a dimer whose ATPase activity and macrolide-binding capacity
    are regulated by the membrane fusion protein MacA.
  findings:
  - statement: MacA, the membrane-fusion protein of the MacAB-TolC pump, interacts with both MacB
      and TolC, and regulates MacB ATPase activity and macrolide binding.
    supporting_text: MacA interacts with both MacB and TolC.
  - statement: TolC is organised as a homotrimer within the assembled pump.
    supporting_text: AcrB and TolC are organized as homotrimers.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text available and read; cited by UniProt for TolC's function in the MacAB-TolC
      system and for the MacA interaction. Supports the MacAB-TolC complex row; the generic protein
      binding row from it is removed as redundant with that.
- id: PMID:19171121
  title: The multidrug resistance efflux complex, EmrAB from Escherichia coli forms a dimer in
    vitro.
  findings:
  - statement: EmrAB-TolC is a tripartite system comprising the major-facilitator transporter
      EmrB, the membrane-fusion protein EmrA and the outer-membrane channel TolC; reconstituted
      EmrAB appeared dimeric, in contrast to the trimeric AcrAB-TolC arrangement.
    supporting_text: Previous work has indicated that EmrAB-TolC from Escherichia coli is such
      a tripartite system, comprised of EmrB an MFS transporter, EmrA, a membrane fusion protein
      and TolC, an outer membrane channel.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Verified against the cached abstract. States the complex composition explicitly,
      including TolC, which makes it the best-grounded of the NAS rows for efflux pump complex.
- id: PMID:19721076
  title: Induction of multidrug resistance mechanism in Escherichia coli biofilms by interplay
    between tetracycline and ampicillin resistance genes.
  findings:
  - statement: Plasmid-borne tetracycline and ampicillin resistance markers in biofilms induced
      chromosomal efflux systems, notably EmrY/K, one of the major-facilitator pumps that use
      TolC.
    supporting_text: the induction of the efflux systems on the bacterial chromosome, especially
      the EmrY/K and EvgA/S pumps
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: 'Full text available. The weakest support in the set for the detoxification
      process row: the study concerns plasmid marker interplay in biofilms and does not examine
      TolC. Accepted only because six better-evidenced rows carry the same term.'
- id: PMID:19805313
  title: Kinetic control of TolC recruitment by multidrug efflux complexes.
  findings:
  - statement: Surface plasmon resonance compared TolC binding to AcrA, MacA and EmrA, the adaptors
      of RND, ABC and major-facilitator transporters respectively, establishing that one duct
      serves three transporter superfamilies.
    supporting_text: we reconstituted interactions and compared binding kinetics of the E. coli
      TolC with AcrA, MacA, and EmrA, the periplasmic MFPs that function in multidrug efflux with
      transporters from the RND, ABC, and MF superfamilies, respectively
  - statement: TolC-adaptor interactions are dynamic and pH-sensitive, with affinity ranked MacA
      above EmrA above AcrA, and recruitment governed jointly by these kinetics and by adaptor
      oligomerisation.
    supporting_text: The affinity of TolC to MFPs decreases in the order MacA > EmrA > AcrA.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text available and read. The clearest direct evidence for the shared-duct
      architecture that defines this gene, and the basis for the first core function. Its only
      GOA rows are two generic protein binding entries, which capture almost none of this; both
      are removed as uninformative while the findings are retained here.
- id: PMID:20038594
  title: Multidrug efflux pump MdtBC of Escherichia coli is active only as a B2C heterotrimer.
  findings:
  - statement: MdtBC is active only as a B2C heterotrimer, with the proton translocation pathway
      functional in MdtB alone; RND transporters of this family pump a wide range of inhibitors
      and biocides and require TolC for the outer-membrane step.
    supporting_text: RND (resistance-nodulation-division) family transporters in Gram-negative
      bacteria frequently pump out a wide range of inhibitors and often contribute to multidrug
      resistance to antibiotics and biocides.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Full text available. Concerns the inner-membrane transporter pair; TolC is not
      examined. Weak but consistent support for the process and complex rows, and no support at
      all for the location row, which is removed.
- id: PMID:2112747
  title: TolC, an Escherichia coli outer membrane protein required for hemolysin secretion.
  findings:
  - statement: TolC, encoded outside the hly cluster, is specifically required for secretion of
      alpha-hemolysin, a protein exported without cleavage of an N-terminal signal peptide by
      an apparatus otherwise composed of the inner-membrane HlyB and HlyD.
    supporting_text: an E. coli outer membrane protein, the TolC protein, encoded by a gene not
      located in the hly cluster, is specifically required for hemolysin secretion
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Verified against the cached abstract. The founding evidence for the type I protein
      secretion use of the duct, and one of only two references in the set that address protein
      rather than small-molecule cargo. Note that the hly determinant is not native to K-12, so
      the result is obtained in a reconstituted setting.
- id: PMID:21245342
  title: Structures of sequential open states in a symmetrical opening transition of the TolC
    exit duct.
  findings:
  - statement: The TolC periplasmic entrance is closed by densely packed coiled coils constrained
      by a hydrogen bond network, and crystal structures of two sequential open states show that
      full dilation of the pore constriction is entirely symmetrical across the three protomers.
    supporting_text: The TolC periplasmic entrance is closed by densely packed α-helical coiled
      coils, inner H7/H8, and outer H3/H4, constrained by a hydrogen bond network.
  - statement: The duct is recruited by an inner-membrane transporter and periplasmic adaptor
      and projects an alpha-helical tunnel across the periplasm.
    supporting_text: In bacterial drug resistance and virulence pumps, an inner membrane (IM)
      transporter and periplasmic adaptor recruit an outer membrane (OM) trimeric TolC exit duct
      that projects an α-helical tunnel across the periplasm.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Verified against the cached abstract. The key reference for gating, and the
      reason self-association is treated as a functional rather than merely architectural property:
      opening requires concerted movement between protomers.'
- id: PMID:22534293
  title: Comparative analysis of envelope proteomes in Escherichia coli B and K-12 strains.
  findings:
  - statement: Comparative envelope proteome maps of E. coli BL21(DE3) and MG1655 showed the envelope
      to be dominated by channel proteins and lipoproteins.
    supporting_text: The reference envelope proteome maps showed that E. coli envelope mainly
      contained channel proteins and lipoproteins.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Verified against the cached abstract. An envelope inventory consistent with
      the curated location; no functional content.
- id: PMID:25218435
  title: 'Structure-function of cyanobacterial outer-membrane protein, Slr1270: homolog of Escherichia
    coli drug export/colicin import protein, TolC.'
  findings:
  - statement: E. coli TolC is described as having a trimeric antiparallel beta-barrel channel
      domain in the outer membrane connected to a trans-periplasmic trimeric alpha-helical tunnel;
      this is background in a study whose experiments are on the cyanobacterial homologue Slr1270.
    supporting_text: E. coli TolC differs uniquely in having a trimeric antiparallel β-barrel
      channel domain embedded in the OM, which is connected to a trans-periplasmic trimeric α-helical
      tunnel domain
  reference_review:
    relevance: LOW
    correctness: MISCITED
    review_notes: 'Correctly identified paper, but it does not supply the evidence it is cited
      for. Full text read: all experiments are on Synechocystis Slr1270, and the only TolC content
      is cited background plus literature conductance values used for comparison. The identical
      protein binding row drawn from it is accepted because the homotrimer is true and established
      by three other rows, not because this reference demonstrates it.'
- id: PMID:25257218
  title: Protoporphyrin (PPIX) efflux by the MacAB-TolC pump in Escherichia coli.
  findings:
  - statement: Protoporphyrin IX, the immediate heme precursor, is expelled by the MacAB-TolC
      pump; tolC and macAB mutants accumulate PPIX and become sensitive to photo-inactivation.
    supporting_text: The E. coli macAB and tolC mutants accumulate PPIX and are sensitive to photo-inactivation.
  - statement: PPIX is proposed to be an endogenous substrate of the pump, produced when heme
      homeostasis is disrupted by iron shortage.
    supporting_text: We propose that PPIX is an endogenous substrate of the MacAB-TolC pump in
      E. coli and S. typhimurium
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text available and read; cited by UniProt for function and disruption phenotype.
      Together with the enterobactin work, this is what establishes TolC as part of normal metabolism
      rather than only of drug resistance.
- id: PMID:26867482
  title: Tripartite assembly of RND multidrug efflux pumps.
  findings:
  - statement: Native AcrAB-TolC and MexAB-OprM reconstituted in lipid nanodiscs showed the inner
      and outer membrane components linked through the periplasmic adaptor, and the components
      self-assembled into a working interspecies AcrA-MexB-TolC complex.
    supporting_text: Single-particle analysis by electron microscopy reveals the inner and outer
      membrane protein components linked together via the periplasmic adaptor protein.
  - statement: The adaptor forms part of the exit duct and there is no physical interaction between
      the inner and outer membrane components.
    supporting_text: Projection structures of all three complexes emphasize the role of the periplasmic
      adaptor protein as part of the exit duct with no physical interaction between the inner
      and outer membrane components.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text available. The interspecies hybrid is strong evidence that the duct's
      recruitment interface is generic, which is the structural basis of the shared-duct core
      function. Its generic protein binding row is removed; its efflux pump complex row is accepted.
- id: PMID:28355133
  title: An allosteric transport mechanism for the AcrAB-TolC multidrug efflux pump.
  findings:
  - statement: Near-atomic cryo-EM structures of AcrAB-TolC in resting and drug-transport states
      reveal a quaternary structural switch that allosterically couples ligand binding to opening
      of the TolC channel, which stays open while the pump cycles through three conformations.
    supporting_text: we report the near-atomic resolution cryoEM structures of the Escherichia
      coli AcrAB-TolC multidrug efflux pump in resting and drug transport states, revealing a
      quaternary structural switch that allosterically couples and synchronizes initial ligand
      binding with channel opening
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text available; cited by UniProt for function and subunit composition.
      The best account of how the gate is operated from the transporter end, which is why opening
      is treated here as a property of the assembly rather than of TolC alone.
- id: PMID:28504659
  title: Structure of the MacAB-TolC ABC-type tripartite multidrug efflux pump.
  findings:
  - statement: A MacA hexamer bridges the TolC trimer in the outer membrane to a MacB dimer in
      the inner membrane, generating a quaternary structure with a central channel for substrate
      translocation.
    supporting_text: A hexamer of the periplasmic protein MacA bridges between a TolC trimer in
      the outer membrane and a MacB dimer in the inner membrane, generating a quaternary structure
      with a central channel for substrate translocation.
  - statement: The assembly extrudes both macrolide antibiotics and polypeptide virulence factors,
      so one pump handles small-molecule and protein cargo.
    supporting_text: The MacA-MacB-TolC assembly of Escherichia coli is a transmembrane machine
      that spans the cell envelope and actively extrudes substrates, including macrolide antibiotics
      and polypeptide virulence factors.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text available and read; cited by UniProt for function and subunit. The
      definitive structure of the MacAB-TolC complex, and the clearest demonstration that the
      duct's two cargo classes pass through the same assembly.
- id: PMID:29109272
  title: Structure and mechanotransmission mechanism of the MacB ABC transporter superfamily.
  findings:
  - statement: MacB collaborates with MacA and the TolC exit duct to drive efflux of antibiotics
      and the enterotoxin STII; its transmembrane domain has no central cavity and instead transmits
      conformational change across the membrane.
    supporting_text: MacB is an ABC transporter that collaborates with the MacA adaptor protein
      and TolC exit duct to drive efflux of antibiotics and enterotoxin STII out of the bacterial
      cell.
  - statement: The assembled pump is proposed to act as a molecular bellows propelling substrate
      through the TolC duct, so the energising and propulsive work belongs to MacB and the conduit
      to TolC.
    supporting_text: We propose that the assembled tripartite pump acts as a molecular bellows
      to propel substrates through the TolC exit duct, driven by MacB mechanotransmission.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text available and read. Explicitly separates the pump's energising component
      from its conduit, which is the clearest justification in the set for annotating TolC's efflux
      activity with contributes_to rather than enables.
- id: PMID:33065135
  title: Structural characterization of the EmrAB-TolC efflux complex from E. coli.
  findings:
  - statement: The EmrAB-TolC major-facilitator tripartite complex forms a 33 nm assembly in which
      TolC and the adaptor EmrA form an extended periplasmic canal, with overall dimensions similar
      to AcrAB-TolC and a probable tip-to-tip EmrA-TolC contact.
    supporting_text: Comparison of projection structures of EmrAB-TolC and AcrAB-TolC indicates
      that the outer membrane protein TolC linked to the periplasmic adaptor EmrA protein form
      an extended periplasmic canal.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Verified against the cached abstract. Direct structural evidence that the same
      duct serves a third transporter superfamily, which supports the shared-duct framing rather
      than any new claim about TolC itself.
- id: PMID:35061668
  title: A noncanonical chaperone interacts with drug efflux pumps during their assembly into
    bacterial outer membranes.
  findings:
  - statement: Assembly of outer-membrane conduit subunits uses the chaperone TAM to organise
      the membrane-embedded staves of the barrel, demonstrated with TolC as the model substrate.
    supporting_text: Using TolC as a model protein, we demonstrate that assembly of conduit subunits
      into the outer membrane uses the chaperone TAM to physically organise the membrane-embedded
      staves of the conduit subunit of the efflux pump.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text available and read. Establishes a genuine TolC-TamA relationship,
      but one in which TolC is the chaperone's client rather than a participant in assembly, so
      it licenses no molecular function or process annotation on TolC. The generic protein binding
      row from it is removed and no replacement proposed.
- id: PMID:40083904
  title: Transporter excess and clustering facilitate adaptor protein shuttling for bacterial
    efflux.
  findings:
  - statement: MacB, MacA and TolC form a MacA6:MacB2:TolC3 assembly that extrudes antibiotics
      and virulence factors; live-cell single-molecule imaging shows MacB and TolC in large excess
      over the limiting adaptor MacA, which shuttles between assemblies.
    supporting_text: the ATP-binding cassette (ABC)-family transporter MacB, the adaptor protein
      MacA, and the outer membrane protein TolC form the MacA6:MacB2:TolC3 assembly to extrude
      antibiotics and virulence factors
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Full text available and read; cited by UniProt for function and subunit. The
      cellular excess of TolC over its adaptors is a quantitative confirmation of the shared-duct
      architecture: the duct waits to be recruited rather than belonging to one pump.'
- id: PMID:40461577
  title: In situ structure and assembly of the ABC-type tripartite pump MacAB-TolC.
  findings:
  - statement: Cryo-electron tomography and subtomogram averaging resolved the MacAB-TolC pump
      in situ in E. coli, with the fully assembled pump present in untreated cells and additional
      partial assemblies after erythromycin treatment.
    supporting_text: we resolve the in situ structures of the MacAB-TolC efflux pump in Escherichia
      coli by electron cryo-tomography and subtomogram averaging
  - statement: A MacA-TolC bipartite subcomplex persists as a stable entity in cells, indicating
      that the duct assembles with its adaptor before the transporter is recruited.
    supporting_text: MacA-TolC subcomplex can exist as a stable entity in cells.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text available and read; cited by UniProt for function and subunit. The
      strongest form of the evidence for the efflux annotations, since the TolC-containing machine
      is imaged in place in unperturbed cells.
- id: PMID:4933702
  title: The tolC locus in Escherichia coli K12.
  findings: []
  full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: UNVERIFIED
    review_notes: 'The cached record contains neither an abstract nor full text, only the citation
      stub, so nothing can be quoted from it and no finding is recorded. The 1971 genetic definition
      of the locus is presumably sound, and the row drawn from it is modified on granularity grounds
      that do not depend on reading it: GO:0009636 is a literal ancestor of the specific term
      the gene already carries.'
- id: PMID:6337123
  title: Identification and characterization of the TolC protein, an outer membrane protein from
    Escherichia coli.
  findings:
  - statement: The tolC gene product was identified as a 52 kDa cell envelope protein and localised
      to the outer membrane in an aggregated state; unlike OmpC and OmpF under the same conditions
      it was not peptidoglycan-associated, and these properties were used to purify it.
    supporting_text: The protein seen in cell envelopes of whole cells (TolC protein) was found
      to exist in an aggregated state in the outer membrane
  - statement: The outer-membrane location was taken to be consistent with the function proposed
      for the gene product.
    supporting_text: The location of the TolC protein in the outer membrane was consistent with
      the proposed function for the tolC gene product as a processing protein in the outer membrane.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Verified against the cached abstract; cited by UniProt for function and subcellular
      location. The founding characterisation, and the earliest signal that TolC behaves unlike
      the classical porins.
- id: PMID:7688606
  title: TolC of Escherichia coli functions as an outer membrane channel.
  findings:
  - statement: Only the oligomeric form of purified TolC raised the conductance of artificial
      bilayers, establishing the oligomer as the conducting unit.
    supporting_text: The oligomeric but not the monomeric form of the protein was able to increase
      the specific conductance of artificial lipid bilayer membranes.
  - statement: The single-channel conductance of 80 pS in 1 M KCl is roughly nineteen-fold below
      that of the general diffusion pores of the E. coli outer membrane, distinguishing TolC from
      a porin.
    supporting_text: The channels of 80 pS in 1 M KCl had a much smaller single-channel conductance
      than the general diffusion pores of E. coli outer membrane (1500 pS).
  - statement: Peptide titration reduced conductance dose-dependently, implying a peptide binding
      site, and the authors concluded TolC is an outer membrane channel for peptides.
    supporting_text: The results are consistent with the assumption that TolC acts as an outer
      membrane channel for peptides.
  reference_review:
    relevance: HIGH
    correctness: MISCITED
    review_notes: 'Correctly identified paper, and an important one, but it does not support the
      porin activity annotation it is cited for: its own conductance comparison distinguishes
      TolC from the general diffusion pores by an order of magnitude, and its stated conclusion
      is the narrower claim of a peptide channel. Its genuine contribution, that the oligomer
      and not the monomer conducts, is used here to support the identical protein binding rows
      instead.'
- id: PMID:9044294
  title: Structure of TolC, the outer membrane component of the bacterial type I efflux system,
    derived from two-dimensional crystals.
  findings:
  - statement: TolC is required for export of virulence proteins and toxic compounds without a
      periplasmic intermediate, and is an integral part of the translocator rather than a passive
      pore, since it is needed for export from sphaeroplasts as well as from intact cells.
    supporting_text: TolC is an outer membrane protein required for the export of virulence proteins
      and toxic compounds without a periplasmic intermediate.
  - statement: The protein was purified from the outer membrane as a trimer and crystallised in
      two dimensions; each monomer comprises a predicted beta-barrel membrane domain and a C-terminal
      periplasmic domain, with protease accessibility establishing the periplasmic orientation
      of the latter.
    supporting_text: The combined data suggest that TolC is a trimeric outer membrane protein
      with each monomer comprising a membrane domain, predicted to be beta-barrel, and a C-terminal
      periplasmic domain.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Verified against the cached abstract; cited by UniProt for subunit and subcellular
      location. Notable for stating both uses of the duct, protein and small-molecule export,
      before the crystal structure was available.
- id: PMID:8824631
  title: Evidence that TolC is required for functioning of the Mar/AcrAB efflux pump of Escherichia
    coli.
  findings:
  - statement: Functional TolC is required for operation of the AcrAB efflux system and for expression
      of the Mar multidrug-resistance phenotype.
    supporting_text: functional TolC is required for the operation of the AcrAB efflux system
      and for the expression of the Mar phenotype
  - statement: 'The requirement is not transcriptional: a tolC::Tn10 insertion does not alter
      expression of an acrA-lacZ reporter fusion, so TolC acts as a component of the pump rather
      than as a regulator of it.'
    supporting_text: That the effect of TolC on the AcrAB pump is not regulatory in nature is
      shown by studies measuring the influence of a tolC::Tn10 insertion mutation on the expression
      of an acrA::lacZ reporter fusion.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Verified against the cached abstract; full text not cached. The ruling-out of
      a regulatory role is the useful result and is quotable. Four GOA rows are drawn from this
      one reference, including bile acid transporter activity and bile acid transport; the cached
      abstract reports no bile-acid assay, which is recorded as a reason for flagging those two
      rows rather than for removing them, since the curator will have read the full text.
- id: PMID:9822594
  title: 'Substrate-induced assembly of a contiguous channel for protein export from E.coli: reversible
    bridging of an inner-membrane translocase to an outer membrane exit pore.'
  findings:
  - statement: HlyB and HlyD pre-assemble in the inner membrane; engaging the substrate HlyA drives
      that complex to contact TolC with conformational change in all three components.
    supporting_text: Both engaged HlyA, inducing the IM complex to contact TolC, concomitant with
      conformational change in all three exporter components.
  - statement: Export occurs through a contiguous channel formed by substrate-induced, reversible
      bridging of the inner-membrane translocase to the outer-membrane exit pore, without ATP
      hydrolysis by the traffic ATPase; a bound-but-non-hydrolysing HlyB leaves the substrate
      stalled inside the channel.
    supporting_text: Export thus occurs via a contiguous channel which is formed, without traffic
      ATPase ATP hydrolysis, by substrate-induced, reversible bridging of the IM translocase to
      the OM export pore.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Verified against the cached abstract, which is detailed. The best evidence in
      the whole set that cargo physically traverses TolC rather than merely requiring it, since
      a substrate can be caught stalled inside the channel, and the basis for treating protein
      secretion as a separate core function. Also cited by modules/bacterial_type_i_secretion.yaml
      for the substrate-induced bridging that it models as the adaptor causally opening the duct.
