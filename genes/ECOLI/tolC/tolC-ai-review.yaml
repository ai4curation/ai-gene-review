- term:
    id: GO:0005216
    label: monoatomic ion channel activity
  evidence_type: IDA
  original_reference_id: PMID:15465872
  qualifier: enables
  review:
    summary: The conductance is directly observed, but in a planar lipid bilayer, and it is the
      assay readout used to detect colicin occlusion rather than evidence of a role in ion movement.
      TolC is closed at its periplasmic end in the resting state and has no part in ion homeostasis.
    action: MARK_AS_OVER_ANNOTATED
    reason: Not false, since the channel does conduct ions in vitro, but the term implies an ion-channel
      identity that TolC does not have. Its single-channel conductance is roughly nineteen-fold
      below a general diffusion pore of the same membrane, and the paper's own conclusion is the
      narrower one, that TolC acts as an outer membrane channel for peptides. Flagged rather than
      removed because the observation is real and the same curation habit applies to OmpF from
      this reference.
