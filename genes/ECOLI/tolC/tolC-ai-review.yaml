- term:
    id: GO:0015125
    label: bile acid transmembrane transporter activity
  evidence_type: IMP
  original_reference_id: PMID:8824631
  qualifier: enables
  review:
    summary: TolC genuinely participates in bile-salt export, as the duct of the AcrAB-TolC pump,
      so the term is not false. It nonetheless imputes a bile-acid-specific transporter identity
      to a component that selects no substrate.
    action: MARK_AS_OVER_ANNOTATED
    reason: Marked rather than removed. Substrate specificity in this machine belongs to the inner-membrane
      transporter, and the substrate-general terms already annotated state TolC's actual contribution
      without implying it recognises bile acids. The cited reference reports no bile-acid assay
      in its abstract and its full text is unavailable, so the stronger action is not warranted.
- term:
    id: GO:0015288
    label: porin activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN002011530
  - UniProtKB:P02930
  review:
    summary: TolC is a gated channel-tunnel, closed at its periplasmic end by packed coiled coils
      until a partner opens it, not a general diffusion pore. The very reference annotated for
      the direct row measures a single-channel conductance roughly nineteen-fold below a real
      diffusion pore of this membrane.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Marked rather than removed, and the propagation itself is not the problem. The node is well
      placed and TolC is its own exemplar, so this is a term-scoping issue: porin activity is
      applied family-wide and the outer-membrane domain genuinely is a beta-strand barrel that
      conducts solutes, but the term implies passive general-diffusion permeability, which is
      the opposite of a duct held closed until a partner opens it. Disrupting tolC increases outer-membrane
      permeability rather than decreasing it.
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - GRANULARITY_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN002011530
        source_label: PANTHER:PTN002011530
        source_status: SUPPORTS_TRANSFER
        comment: >-
          The ancestral node is sound and TolC is one of its own exemplars, so the node placement
          is not what is wrong here. Arguing with an inferred-from-descendant assertion means
          arguing with where the curator placed the function, and that placement survives the
          test.
      - source_id: UniProtKB:P02930
        source_label: TolC
        source_status: SUPPORTS_TRANSFER
        comment: >-
          The target appearing in its own WITH/FROM is expected rather than circular: TolC carries
          a direct-assay annotation to this term, so it is one of the descendant evidences behind
          the node, and the inferred row then says the additional thing that the property is inherited
          rather than lineage-specific.
