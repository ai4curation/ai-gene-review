- term:
    id: GO:1990961
    label: xenobiotic detoxification by transmembrane export across the plasma membrane
  evidence_type: IDA
  original_reference_id: PMID:11544226
  qualifier: involved_in
  review:
    summary: The same detoxification-by-export process, but asserted across the plasma membrane.
      TolC exports across the outer membrane; the plasma membrane is where its partner MacB sits.
    action: MODIFY
    reason: Corrected rather than removed, because the biology is right and only the membrane
