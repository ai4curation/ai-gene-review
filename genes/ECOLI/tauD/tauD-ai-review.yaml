id: P37610
gene_symbol: tauD
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  TauD is the cytoplasmic Fe(II)- and 2-oxoglutarate-dependent taurine
  dioxygenase of Escherichia coli. It hydroxylates taurine
  (2-aminoethanesulfonate), and the unstable product breaks down to sulfite and aminoacetaldehyde while
  2-oxoglutarate is decarboxylated to succinate and CO2. The enzyme binds one
  ferrous iron per subunit and is a
  homotetramer (a dimer of dimers) in solution and in crystals. tauD is the last
  gene of the sulfate-starvation-induced tauABCD operon, whose TauABC ABC
  importer supplies taurine; TauD is required for growth on taurine as the sole
  sulfur source. TauD also desulfonates some other short sulfonates in vitro,
  but taurine is the preferred substrate. It is a widely used model enzyme for
  the Fe(II)/2-oxoglutarate-dependent oxygenase superfamily.
