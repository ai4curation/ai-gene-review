id: P12281
gene_symbol: moeA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  MoeA is the molybdopterin molybdotransferase of Escherichia coli, the enzyme that completes
  the metal-insertion step of molybdenum cofactor (Moco) biosynthesis. It takes adenylylated
  molybdopterin (MPT-AMP), produced by MogA, and inserts molybdate into the dithiolene of
  molybdopterin with release of AMP, forming Mo-molybdopterin; it also ligates tungstate
  in vitro, less efficiently. MoeA is a soluble, elongated four-domain protein that is active
  as a homodimer, with a putative active-site cleft between domain II of one subunit and
  domains III and IV of the other; domain III is related to MogA, and in eukaryotes the two
  activities are fused in Cnx1 and gephyrin. moeA (historically chlE) mutants make
  molybdopterin but fail to incorporate molybdenum, so they lack active nitrate reductase,
  formate dehydrogenase and other molybdoenzymes. In vivo MoeA associates with MogA, MobA
  and MobB in molybdopterin-dependent complexes.
