suggested_questions:
- question: Does E. coli MoeA bind molybdate (or tungstate) before MPT-AMP arrives, and is AMP
    release coupled to metal insertion within the single active site formed across the dimer?
- question: Is MPT-AMP handed directly from MogA to MoeA within the molybdopterin-dependent
    MogA-MoeA complex seen in vivo?
suggested_experiments:
- hypothesis: MoeA binds molybdate in the interdomain cleft and requires MPT-AMP for Mo insertion.
  description: Measure molybdate and tungstate binding to purified MoeA by isothermal titration
    calorimetry, and compare Mo-MPT formation from MPT-AMP versus MPT, with and without MogA, in the
    defined reconstitution assay.
