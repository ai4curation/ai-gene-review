core_functions:
- description: Stabilize the periplasmic LptD beta-taco domain and its connection with the Lpt bridge
    as a structural accessory of the outer-membrane translocon. This is complex-level support inferred
    from direct binding/structure and conditional cellular phenotypes, not an autonomous transfer
    activity or an obligatory component in every bacterial lineage.
