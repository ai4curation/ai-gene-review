  review:
    summary: Mature YedD/LptY functions at the outer-membrane Lpt translocon.
    action: MODIFY
    reason: The seeded IEA derives from the older UniProt cell-membrane assignment based on a lipoprotein
      rule. Full-primary identification, co-purification and structural placement now locate mature
      YedD/LptY at the outer-membrane LptDE translocon. Correct the functional compartment to cell
      outer membrane; this is a lateral localization correction, not an is_a refinement or a claim
      that the protein never passes through the inner membrane during biogenesis.
