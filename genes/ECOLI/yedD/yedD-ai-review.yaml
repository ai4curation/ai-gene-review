  label: Escherichia coli K-12
description: YedD, renamed LptY, is an Escherichia coli outer-membrane lipoprotein associated with the LptDE LPS translocon. It binds and stabilizes the periplasmic beta-taco domain of LptD and its connection to the transenvelope Lpt bridge. LptY and LptM occupy different regions of LptD and can associate independently. LptY supports translocon function especially when LptD oxidative maturation or bridge connectivity is perturbed.
