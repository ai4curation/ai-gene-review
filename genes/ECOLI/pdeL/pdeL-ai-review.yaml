id: P21514
gene_symbol: pdeL
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: PdeL (YahA) is a soluble Escherichia coli protein combining a LuxR-like DNA-binding domain
  with an EAL phosphodiesterase domain. It hydrolyzes c-di-GMP to pGpG and acts as a transcriptional activator
  of its own gene, coupling second-messenger turnover to positive transcriptional feedback. Substrate
  binding and EAL-domain dimerization are linked to catalytic activation; activated variants lower c-di-GMP
  and shift motility and biofilm outputs.
