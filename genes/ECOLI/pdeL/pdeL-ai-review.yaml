  review:
    summary: The membrane IBA is questionable for the DNA-binding/EAL architecture; direct localization
      remains unresolved.
    action: MARK_AS_OVER_ANNOTATED
    reason: The available abstract of PMID:26553851 demonstrates transcriptional autoregulation, but does
      not directly localize PdeL or explicitly describe it as soluble/cytoplasmic. Its LuxR-like DNA-binding/EAL
      architecture and transcription-factor activity make the inherited plasma-membrane assignment questionable;
      this is an architectural and functional inference, not proof of a cytoplasmic location. The PAINT
      assertion at PTN002105365 was checked and no lineage IRD/IKR was found. Mark the specific location
      as over-annotated rather than replacing it with an unproven compartment or claiming it is experimentally
      contradicted.
    supported_by:
    - reference_id: PMID:26553851
      supporting_text: We demonstrated that this protein acts as a transcription factor to control its
        own expression.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - COMPARTMENT_OR_COMPLEX_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN002105365
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: The current PAINT IBD source places GO:0005886 at PTN002105365 (20260529); the disputed
          step is inheritance of that location by pdeL. The target DNA-binding/EAL architecture and transcription-factor
          activity raise a compartment-specific concern, but the available abstract does not provide a
          localization assay. This does not challenge membrane evidence on other descendants or use donor
          count as evidence against the inference.
