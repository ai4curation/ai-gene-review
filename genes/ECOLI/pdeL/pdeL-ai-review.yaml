    label: protein homodimerization activity
  evidence_type: IDA
  original_reference_id: PMID:24451384
  qualifier: enables
  review:
    summary: PdeL EAL-domain dimerization is coupled to catalysis.
    action: ACCEPT
    reason: Biophysical measurements show a monomer-dimer equilibrium with the dimeric state catalytically
      active. This direct evidence supersedes the earlier suggestion that oligomerization was irrelevant;
      the original activity annotation remains sound.
    supported_by:
    - &id004
      reference_id: PMID:24451384
      supporting_text: the isolated EAL domain of a PDE from Escherichia coli (YahA) is in a fast thermodynamic
        monomer-dimer equilibrium, and that the domain is active only in its dimeric state.
