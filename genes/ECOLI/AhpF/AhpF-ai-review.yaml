      supporting_text: >-
        The AhpF component (521 amino-acid residues, 56.2 kDa) belongs to the
        family of pyridine nucleotide-disulfide oxidoreductases and channels
        electrons from NAD(P)H via a series of disulfides towards the AhpC
        component, which finally reduces the hydro-peroxide substrates.
    - reference_id: PMID:28270505
      supporting_text: >-
