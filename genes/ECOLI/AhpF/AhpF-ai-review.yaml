  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR012081
  review:
    summary: >-
      AhpF is a dedicated bacterial AhpC reductase that accepts reducing
      equivalents from NADH and transfers them to the peroxiredoxin AhpC for
      detoxification of hydrogen peroxide, organic hydroperoxides, and
      peroxynitrite.
    action: KEEP_AS_NON_CORE
    reason: >-
      The InterPro family-level response-to-reactive-oxygen-species mapping is
      broad, but it is biologically correct for AhpF because AhpF executes the
      reductase half of the AhpC/AhpF antioxidant system and is required for
      continuous peroxide detoxification by AhpC. The specific cellular oxidant
      detoxification annotation better captures AhpF's core process.
    additional_reference_ids:
    - PMID:28270505
    supported_by:
    - reference_id: PMID:28270505
      supporting_text: >-
        In many bacteria, a dedicated peroxiredoxin reductase, alkyl
        hydroperoxide reductase subunit F (AhpF), catalyzes the rapid reduction
        of the redox-active disulfide center of the antioxidant protein
        peroxiredoxin (AhpC) to detoxify ROS such as hydrogen peroxide, organic
        hydroperoxide, and peroxynitrite.
