    summary: >-
      AhpF is mechanistically adjacent to thioredoxin reductases, but the
      E. coli enzyme reduces oxidized AhpC using NADH-derived electrons rather
      than functioning as a NADPH-linked thioredoxin-disulfide reductase.
    action: MODIFY
    reason: >-
      This PAINT row transfers the canonical thioredoxin-disulfide reductase
      activity from PANTHER:PTN005133404 across a broad PTHR48105
      FAD/NAD(P)-binding family that also contains AhpF peroxiredoxin
      reductases. E. coli AhpF is experimentally characterized as the AhpC
