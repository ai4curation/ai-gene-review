- term:
    id: GO:0042744
    label: hydrogen peroxide catabolic process
  evidence_type: IDA
  original_reference_id: PMID:28270505
  qualifier: involved_in
  review:
    summary: >-
      AhpF participates in hydrogen peroxide catabolism by regenerating reduced
      AhpC with NADH-derived electrons, enabling continued AhpC peroxidase
      turnover.
    action: ACCEPT
    reason: >-
      AhpC performs the peroxide attack, but AhpF does part of the work of this
      two-subunit process: it accepts electrons from NADH and transfers them
      through its redox centers to oxidized AhpC, and AhpF linker mutants reduce
      H2O2 less effectively in the AhpF-AhpC ensemble.
    supported_by:
    - reference_id: PMID:28270505
      supporting_text: >-
        The mutants also exhibited a decrease in H2O2 reduction by the
        AhpF-AhpC ensemble. We propose that a concerted movement involving the
        NTD, C-terminal NADH, and FAD domains, and the flexible linker between
        them is essential for optimal intra-domain cross-talk and for efficient
        electron transfer to the redox partner AhpC required for peroxidation.
