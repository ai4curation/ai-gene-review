core_functions:
- description: >-
    AhpF reduces oxidized AhpC using NADH-derived electrons. Its C-terminal
    domain binds FAD and NADH and passes reducing equivalents through
    redox-active disulfides to the N-terminal domain, which contacts AhpC in the
    alkyl hydroperoxide reductase complex and regenerates the AhpC peroxiredoxin
    for hydrogen peroxide and organic hydroperoxide detoxification.
  molecular_function:
    id: GO:0047134
    label: protein-disulfide reductase [NAD(P)H] activity
  contributes_to_molecular_function:
    id: GO:0102039
    label: NADH-dependent peroxiredoxin activity
  directly_involved_in:
  - id: GO:0098869
    label: cellular oxidant detoxification
  - id: GO:0042744
    label: hydrogen peroxide catabolic process
  locations:
  - id: GO:0005829
    label: cytosol
  in_complex:
    id: GO:0009321
    label: alkyl hydroperoxide reductase complex
  supported_by:
  - reference_id: PMID:10666639
    supporting_text: >-
      The AhpF component (521 amino-acid residues, 56.2 kDa) belongs to the
      family of pyridine nucleotide-disulfide oxidoreductases and channels
      electrons from NAD(P)H via a series of disulfides towards the AhpC
      component, which finally reduces the hydro-peroxide substrates.
  - reference_id: PMID:25372677
    supporting_text: >-
      Solution X-ray scattering analysis of EcAhpF unravels the flexibility of
      its N-terminal domain, and its binding to EcAhpC was demonstrated by
      isothermal titration calorimetry.
  - reference_id: PMID:28270505
    supporting_text: >-
      The mutants also exhibited a decrease in H2O2 reduction by the
      AhpF-AhpC ensemble. We propose that a concerted movement involving the
      NTD, C-terminal NADH, and FAD domains, and the flexible linker between
      them is essential for optimal intra-domain cross-talk and for efficient
      electron transfer to the redox partner AhpC required for peroxidation.
proposed_new_terms:
- proposed_name: NADH-dependent peroxiredoxin reductase activity
  proposed_definition: >-
    Catalysis of the NADH-dependent reduction of an oxidized peroxiredoxin,
    regenerating its peroxide-reducing cysteine residues.
  justification: >-
    AhpF is not the EC 1.11.1.26 peroxiredoxin that reduces hydroperoxide;
    it is the dedicated flavoprotein-disulfide reductase that accepts reducing
    equivalents from NADH and transfers them to the oxidized AhpC
    peroxiredoxin. Existing GO:0047134 captures the broader EC 1.8.1.8
    chemistry but not the dedicated peroxiredoxin acceptor.
  proposed_parent:
    id: GO:0047134
    label: protein-disulfide reductase [NAD(P)H] activity
  supported_by:
  - reference_id: PMID:28270505
    supporting_text: >-
      AhpF is a flexible multidomain protein that enables a series of electron
      transfers among the redox centers by accepting reducing equivalents from
      NADH.
suggested_questions:
- question: >-
    Under which oxidative-stress regimes does E. coli AhpC/AhpF primarily
    detoxify hydrogen peroxide versus organic hydroperoxides or peroxynitrite
    in vivo?
- question: >-
    How much does the E. coli AhpF cycle use NADPH in vivo, if at all, compared
    with its biochemically characterized NADH-linked AhpC reductase activity?
suggested_experiments:
- description: >-
    Compare peroxide clearance and AhpC redox-state recovery in wild-type E.
    coli and separation-of-function ahpF mutants with impaired NADH binding,
    FAD reduction, linker motion, or N-terminal AhpC reduction after defined
    hydrogen peroxide and organic hydroperoxide challenges.
  experiment_type: Redox proteomics and targeted complementation
  hypothesis: >-
    Mutations that trap AhpF in a CTD-facing state will specifically delay
    AhpC reduction and sensitize cells to peroxides even when AhpC itself is
    present.
