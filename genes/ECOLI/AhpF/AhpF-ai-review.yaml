id: P35340
gene_symbol: AhpF
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli (strain K12)
description: >-
  AhpF is the soluble flavoprotein reductase subunit of the E. coli
  AhpC/AhpF alkyl hydroperoxide reductase system. It accepts electrons from
  NADH through a C-terminal FAD/NADH-binding module and relays them via
  redox-active disulfides to its N-terminal AhpC-facing domain, regenerating
  oxidized AhpC for continuous hydrogen peroxide and organic hydroperoxide
  detoxification in the cytosol.
