id: P61320
gene_symbol: lolB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  lolB encodes an essential outer-membrane lipoprotein of Escherichia coli,
  anchored by its own N-terminal lipid moiety to the periplasmic face of the
  outer membrane. LolB is the terminal acceptor of the Lol pathway: it receives
  mature lipoproteins from the periplasmic carrier LolA through a
  mouth-to-mouth hand-over between their structurally similar hydrophobic
  cavities and incorporates them into the outer membrane. The gene was
  originally named hemM from a proposed role in 5-aminolevulinic acid
  synthesis, which was not borne out.
