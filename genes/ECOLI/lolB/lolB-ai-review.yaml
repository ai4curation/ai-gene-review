proposed_new_terms:
- proposed_name: outer-membrane lipoprotein insertion activity
  proposed_definition: >-
    Accepting a mature lipoprotein from a periplasmic carrier and promoting
    incorporation of its lipid anchor into the bacterial outer membrane.
  justification: >-
    GO has lipoprotein carrier activity (GO:0140598) for LolA and lipoprotein
    releasing activity (GO:0140306) for LolCDE, but no molecular-function term
    for the terminal acceptance and insertion step performed by LolB.
  proposed_parent:
    id: GO:0003674
    label: molecular_function
  supported_by:
  - reference_id: PMID:9384574
    supporting_text: When the Lpp-LolA complex was incubated with a water-soluble LolB derivative, Lpp was transferred from LolA to LolB.
suggested_questions:
- question: >-
    How does LolB transfer the lipid anchor of the cargo from its cavity into
    the inner leaflet of the outer membrane, and does it require any other
    outer-membrane factor?
suggested_experiments:
- description: >-
    Reconstitute LolA-to-LolB transfer with LolB in proteoliposomes and assay
    membrane insertion of cargo with cavity-lining and membrane-proximal LolB
    mutants.
  experiment_type: in vitro reconstitution
