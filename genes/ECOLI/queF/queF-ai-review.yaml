  label: Escherichia coli K-12
description: >-
  QueF (formerly YqcD) is the cytoplasmic NADPH-dependent 7-cyano-7-deazaguanine
  reductase of Escherichia coli. It reduces the nitrile group of preQ0
  (7-cyano-7-deazaguanine) to the primary amine of preQ1
  (7-aminomethyl-7-deazaguanine) in a four-electron reduction that consumes two
  NADPH, a late step of tRNA queuosine biosynthesis. The enzyme is highly
  specific for preQ0, is a homodimer of the type 2 (unimodular, two-domain)
  QueF subfamily that is distantly related to GTP cyclohydrolase I, and
  supplies preQ1 for base exchange into tRNA(Asp), tRNA(Asn), tRNA(His) and
  tRNA(Tyr) by tRNA-guanine transglycosylase.
