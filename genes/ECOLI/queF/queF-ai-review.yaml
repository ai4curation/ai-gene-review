suggested_questions:
- question: >-
    Does E. coli QueF activity limit preQ1 supply when preQ0 is imported by
    YhhQ rather than made de novo?
suggested_experiments:
- hypothesis: QueF is required for queuosine formation from exogenous preQ0 but not from exogenous preQ1.
  description: >-
    Feed preQ0 or preQ1 to a queC/queF double mutant and quantify Q-tRNA by
    LC-MS or APB-gel northern blotting.
