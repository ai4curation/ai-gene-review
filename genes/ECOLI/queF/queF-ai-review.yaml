    summary: Generic tRNA modification should be narrowed to queuosine biosynthesis.
    action: MODIFY
    reason: >-
      QueF acts on the free base preQ0, not on tRNA, but its product preQ1 is
      the dedicated substrate inserted by Tgt in tRNA queuosine synthesis.
      GO:0008616 captures that pathway role precisely, as for the P. putida
      ortholog.
