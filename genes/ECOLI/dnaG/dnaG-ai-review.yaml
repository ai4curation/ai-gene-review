gene_symbol: dnaG
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: DnaG is the zinc-containing replicative primase of Escherichia coli. It synthesizes short
  RNA primers on single-stranded DNA templates, providing the 3′ hydroxyl ends needed by DNA polymerase
  III. Interactions with DnaB helicase and SSB coordinate primer synthesis with fork progression, primer
  handoff and replication restart. DnaG is a DNA-directed RNA polymerase specialized for priming, rather
  than the multisubunit transcription RNA polymerase.
