id: P0A9Q5
gene_symbol: accD
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  AccD is the beta subunit of the carboxyltransferase component of bacterial acetyl-CoA carboxylase (ACC),
  the enzyme system that makes malonyl-CoA and so commits carbon to fatty-acid synthesis. Two AccD and
  two AccA subunits form an alpha2beta2 carboxyltransferase with two active sites at the alpha/beta interfaces;
  it accepts the carboxyl group from the carboxybiotin of the biotin carboxyl carrier protein AccB, which
  the biotin carboxylase AccC charges with bicarbonate at the expense of ATP, and transfers it to acetyl-CoA.
  Neither carboxyltransferase subunit catalyses the transfer alone. AccD carries a zinc domain, absent
  from eukaryotic carboxyltransferases, that binds nucleic acid: the carboxyltransferase binds the coding
  regions of its own accA and accD mRNAs and inhibits their translation, while mRNA binding reciprocally
  inhibits catalysis, and acetyl-CoA relieves the repression - a reciprocal switch that couples subunit
  production to the acetyl-CoA supply.
existing_annotations:
- term:
    id: GO:0003677
    label: DNA binding
  evidence_type: IMP
  original_reference_id: PMID:19965770
  qualifier: enables
  review:
    summary: >-
      Nonspecific DNA binding measured in vitro; the physiological nucleic-acid ligand of the carboxyltransferase
      is its own mRNA.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The carboxyltransferase does bind DNA in vitro, with half-maximal saturation at 0.5-1.0 uM, but
      the binding is explicitly cooperative and nonspecific, it is competed by the enzyme's own substrates,
      and single-stranded DNA and heparin act as competitive inhibitors of catalysis - the profile of
      a positively charged nucleic-acid-binding surface engaged by any polyanion. The same zinc domain's
      physiological ligand is the accA and accD mRNA, which is annotated separately and is where the regulatory
      function lies. So the row is not false but reads an in vitro property of unknown physiological relevance
      as a function; it is marked over-annotated rather than removed.
    supported_by:
    - reference_id: PMID:18156466
      supporting_text: >-
        Half-maximal saturation of different single-stranded or double-stranded DNA constructs is seen
        at 0.5-1.0 muM, and binding is cooperative and nonspecific.
    - reference_id: PMID:19965770
      supporting_text: >-
        Carboxyltransferase binds the coding regions of both subunit mRNAs and inhibits translation, an
        inhibition that is relieved by the substrate acetyl-CoA.
- term:
    id: GO:0003729
    label: mRNA binding
  evidence_type: IDA
  original_reference_id: PMID:19965770
  qualifier: enables
  review:
    summary: >-
      mRNA binding by the carboxyltransferase, mediated by the AccD zinc finger; the basis of its translational
      autoregulation.
    action: ACCEPT
    reason: >-
      Directly demonstrated and specific to this protein's zinc domain: the carboxyltransferase binds
      the coding regions of both subunit mRNAs, the interaction is mediated by the beta-subunit zinc finger,
      and mutating its four cysteines to alanine reduced nucleic-acid binding and catalytic activity.
      Preferential binding to RNA over DNA in situ was shown by FRET, which also distinguishes this row
      from the nonspecific DNA binding above.
    supported_by:
    - reference_id: PMID:19965770
      supporting_text: >-
        This interaction is mediated by a zinc finger on the beta-subunit; mutation of the four cysteines
        to alanine diminished nucleic acid binding and catalytic activity.
    - reference_id: PMID:19965770
      supporting_text: >-
        Preferential binding of carboxyltransferase to RNA in situ was shown using fluorescence resonance
        energy transfer.
- term:
    id: GO:0003989
    label: acetyl-CoA carboxylase activity
  evidence_type: IDA
  original_reference_id: PMID:10893421
  qualifier: enables
  review:
    summary: >-
      The complete acetyl-CoA carboxylase reaction, which needs all four subunits; AccD contributes one
      half-site of the carboxyltransferase.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      GO:0003989 is the full reaction ATP + acetyl-CoA + hydrogencarbonate = ADP + phosphate + malonyl-CoA.
      In E. coli that requires AccC to carboxylate the biotin of AccB with ATP and then the AccA/AccD
      carboxyltransferase to transfer the carboxyl group to acetyl-CoA; the cited study measured the activity
      after co-expressing all four subunits in equimolar amounts, not AccD alone. AccD therefore contributes
      to rather than enables this activity, and the review records it as `contributes_to_molecular_function`
      with `in_complex` GO:0009317 - the same treatment given to AccA, AccB and AccC.
    supported_by:
    - reference_id: PMID:10893421
      supporting_text: >-
        The genes encoding the four subunits of E. coli ACC were cloned in a single plasmid under the
        control of a bacteriophage T7 promoter.
    - reference_id: PMID:1355089
      supporting_text: >-
        Peptide mapping of the purified enzyme component indicates that the carboxyltransferase component
        is a complex of two nonidentical subunits, a 35-kDa alpha subunit and a 33-kDa beta subunit.
