  review:
    summary: >-
      Phylogenetic assignment of translational repression, the autoregulatory role of the carboxyltransferase.
    action: ACCEPT
    reason: >-
      The repression is mediated by the zinc finger of the beta subunit binding the coding regions of
      the accA and accD mRNAs, a mechanism tied to a domain that is conserved in bacterial carboxyltransferases
      and absent from eukaryotic ones, so an ancestral assignment within that clade is reasonable. Non-core
      relative to carboxyl transfer but a real, direct role, so the term is accepted on both rows rather
      than downgraded.
    supported_by:
