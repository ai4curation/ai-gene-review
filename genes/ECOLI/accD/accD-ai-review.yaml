suggested_questions:
- question: >-
    Does carboxyltransferase autoregulation operate at physiological acetyl-CoA concentrations in vivo,
    and does it explain how AccA and AccD are kept equimolar despite being transcribed from unlinked genes?
suggested_experiments:
- description: >-
    Measure AccA and AccD protein levels, malonyl-CoA and acetyl-CoA pools in strains carrying the zinc-finger
    cysteine-to-alanine variant, which separates nucleic-acid binding from catalysis only partially, together
    with mRNA variants altered in the bound coding region, to test the dimmer-switch model in vivo.
