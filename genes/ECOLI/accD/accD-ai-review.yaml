        its subunits.
    - reference_id: PMID:19965770
      supporting_text: >-
        Carboxyltransferase binds the coding regions of both subunit mRNAs and inhibits translation, an
        inhibition that is relieved by the substrate acetyl-CoA.
- term:
    id: GO:0017148
    label: negative regulation of translation
  evidence_type: IDA
  original_reference_id: PMID:19965770
  qualifier: acts_upstream_of_or_within
  review:
    summary: >-
      Direct evidence that the carboxyltransferase represses translation of its own subunit mRNAs, with
      acetyl-CoA relieving the repression.
    action: ACCEPT
    reason: >-
      AccD itself performs the repression: its zinc finger binds the mRNA, inhibition is relieved by acetyl-CoA,
      and mRNA binding reciprocally inhibits catalysis - the authors' "dimmer switch" coupling subunit
      production to metabolic state. This is participation, not a downstream consequence, so the term
      is accepted; the GOA `acts_upstream_of_or_within` qualifier is weaker than the evidence warrants.
    supported_by:
    - reference_id: PMID:19965770
      supporting_text: >-
        Carboxyltransferase binds the coding regions of both subunit mRNAs and inhibits translation, an
        inhibition that is relieved by the substrate acetyl-CoA.
    - reference_id: PMID:19965770
      supporting_text: >-
        We propose an unusual regulatory mechanism by which carboxyltransferase acts as a 'dimmer switch'
        to regulate protein production and catalytic activity, while sensing the metabolic state of the
        cell through acetyl-CoA concentration.
- term:
    id: GO:0042759
    label: long-chain fatty acid biosynthetic process
  evidence_type: NAS
  original_reference_id: PMID:18156466
  qualifier: acts_upstream_of_or_within
  review:
    summary: >-
      A pathway-outcome phrase rather than an annotation: ACC supplies malonyl-CoA for every chain length,
      not specifically long-chain products.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The cited statement that ACC catalyses the first committed step in the synthesis of long-chain fatty
      acids is an introductory framing, not a finding about chain-length specificity. Malonyl-CoA is the
      extender unit of every elongation cycle, so AccD stands equally upstream of short-, medium- and
      long-chain acyl-ACPs; singling out long-chain products asserts a specificity the enzyme does not
      have. The well-supported process terms for this gene, GO:2001295 and GO:0006633, are retained, which
      is also how the AccA review handles this row.
    supported_by:
    - reference_id: PMID:18156466
      supporting_text: >-
        Acetyl-CoA carboxylase (ACC) catalyzes the first committed step in the synthesis of long-chain
        fatty acids.
    - reference_id: PMID:19965770
      supporting_text: Acetyl-CoA Carboxylase catalyzes the first committed step in fatty acid synthesis.
