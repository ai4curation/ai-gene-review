  source_reference_id: PMID:41039041
  predicted_term:
    id: GO:0097436
    label: entry into dormancy
  predicted_term_type: GO_BP
  review:
    assessment: NPI
    confidence_score: 0
    error_type: FREQUENCY_BIAS
    summary: >-
      Rank 3 (score 13.92), a refinement of the rank-1 dormancy error, with two biofilm terms behind
      it at ranks 4 and 5. Four of the five calls are physiological states rather than molecular activities,
      none is annotated, and the chaperone function that defines the protein is absent. For a 161-residue
      protein with a solved structure and IDA-supported chaperone activity, this is the GO channel
      failing on an easy case while the free-text channel succeeds.
    supported_by:
    - reference_id: PMID:21317898
      supporting_text: >-
