    label: dormancy process
  predicted_term_type: GO_BP
  review:
    assessment: NPI
    confidence_score: 0
    error_type: FREQUENCY_BIAS
    summary: >-
      Top-ranked hit (score 14.23). Dormancy is a sporulation- and persister-associated process term;
      E. coli Spy has no dormancy phenotype and this review describes it as a stress-induced holdase
      that lets substrates fold on its surface. The same term appears in CpxP's top five, so it is
      a family-level attractor rather than a call about this protein.
    supported_by:
    - reference_id: PMID:21317898
      supporting_text: >-
        Spy is an ATP-independent periplasmic chaperone that suppresses protein aggregation and aids
        protein refolding
- source_method: ProTrek
  source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
  source_reference_id: PMID:41039041
  predicted_term:
    id: GO:0036460
    label: cellular response to cell envelope stress
  predicted_term_type: GO_BP
  review:
    assessment: UNC
    confidence_score: 1
    summary: >-
      Rank 2 (score 13.94) and absent from GOA. This is the one defensible call: spy is among the
      most strongly induced genes of the Bae and Cpx envelope stress responses, reaching 25 to 50
      per cent of periplasmic protein, so a cellular response to cell envelope stress is genuinely
      part of its biology. It is left uncertain rather than scored correct because it describes the
      regulation of the gene rather than the activity of the protein, and because GOA and this review
      both frame Spy by what it does (chaperone) rather than by what induces it.
    supported_by:
    - reference_id: file:ECOLI/Spy/Spy-uniprot.txt
      supporting_text: >-
        Belongs to the CpxP/Spy family
- source_method: ProTrek
