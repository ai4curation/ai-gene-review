id: P77754
gene_symbol: Spy
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli (strain K12)
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for Spy, the ATP-independent periplasmic chaperone massively
  induced by envelope stress. The GO channel misses completely: its top five are dormancy, biofilm
  formation and envelope-stress response terms at scores from 14.2 to 13.7, and none of the annotated
  chaperone biology - protein folding chaperone by IDA, unfolded protein binding by IDA and IBA, protein
  folding by IDA - appears. Its own free-text channel returns the Spy description verbatim at 18.07
  ('An ATP-independent periplasmic chaperone, decreases protein aggregation and helps protein refolding').
  Spy and its paralog CpxP both draw the same dormancy and biofilm cluster, which suggests the CpxP/Spy
  family text in SwissProt is dominated by envelope-stress regulon context rather than by chaperone
  function. Assessment: 1 uncertain (UNC), 2 nonparalog incorrect (NPI).
source_documents:
