proposed_new_terms:
- proposed_name: holdase chaperone activity
  proposed_definition: Binding to an unfolded or misfolded protein to prevent its
    aggregation without actively catalyzing refolding. The holdase maintains the client
    protein in a soluble, folding-competent state.
  justification: Spy directly prevents aggregation of non-native clients in the
    periplasm. Obsolete GO:0051082 captures binding only, while carrier-specific
    GO:0140309 requires escort to an acceptor or location not demonstrated for Spy.
    Spy's separate ability to support folding is represented by GO:0044183.
  proposed_parent:
    id: GO:0003674
    label: molecular_function
  supported_by:
  - reference_id: PMID:21317898
    supporting_text: In vitro studies demonstrate that the Spy protein is an effective
      ATP-independent chaperone that suppresses protein aggregation and aids protein
      refolding.
suggested_questions:
- question: Which native periplasmic proteins are the principal Spy clients under
    each Bae- or Cpx-inducing stress, rather than model substrates used in vitro?
- question: Does Spy ever hand a client to a defined downstream acceptor, or do clients
    fold and dissociate without a directed delivery step?
suggested_experiments:
- experiment_type: native-client trapping proteomics
  description: Use substrate-binding and release-altered Spy variants with in vivo
    periplasmic crosslinking during distinct envelope stresses to identify direct
    clients and measure their aggregation and recovery.
- experiment_type: single-client folding and release kinetics
  description: Monitor conformational state, Spy occupancy, aggregation, and release
    for native periplasmic clients to separate in-situ holdase protection from folding
    assistance and test for any defined acceptor-mediated handoff.
