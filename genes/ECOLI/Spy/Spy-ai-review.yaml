id: P77754
gene_symbol: Spy
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli (strain K12)
description: Spy (spheroplast protein Y) is a stress-induced, ATP-independent
  chaperone in the Escherichia coli periplasm. Its elongated antiparallel homodimer
  forms a flexible cradle that binds non-native client proteins, suppresses their
  aggregation, and increases productive refolding. Spy is unusual in allowing the
  model client Im7 to traverse unfolded, intermediate, and native conformations while
  remaining associated with the chaperone surface. Bae and Cpx envelope-stress pathways
  strongly induce Spy during conditions such as tannin, butanol, and ethanol exposure.
