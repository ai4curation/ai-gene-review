gene_symbol: fadB
aliases:
- b3846
- oldB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  fadB encodes the alpha subunit of the cytoplasmic alpha2beta2 FadBA fatty acid oxidation complex of
  Escherichia coli. The N-terminal crotonase domain hydrates trans-2-enoyl-CoA to (3S)-3-hydroxyacyl-CoA
  and also carries delta3-cis-delta2-trans-enoyl-CoA isomerase activity and, by dehydration/rehydration,
  3-hydroxyacyl-CoA epimerase activity; the C-terminal NAD-dependent dehydrogenase domain (catalytic His450)
  oxidises (3S)-3-hydroxyacyl-CoA to 3-oxoacyl-CoA, which the FadA subunit then cleaves. FadB thus performs
  the second and third reactions of each turn of aerobic beta-oxidation, plus the isomerase step needed
  for unsaturated fatty acids. Under anaerobic conditions the paralogous FadJ (YfcX) takes its place.
