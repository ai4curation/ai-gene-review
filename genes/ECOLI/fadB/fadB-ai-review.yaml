      which is unable to grow on long-chain fatty acids as the sole carbon source
  full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract checked.
- id: PMID:8454629
  title: >-
    Association of both enoyl coenzyme A hydratase and 3-hydroxyacyl coenzyme A epimerase with an active
    site in the amino-terminal domain of the multifunctional fatty acid oxidation protein from Escherichia
    coli.
  findings:
  - statement: G116F abolishes hydratase and epimerase but not dehydrogenase, thiolase or isomerase.
