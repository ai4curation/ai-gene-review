  evidence_type: IDA
  original_reference_id: PMID:8454629
  qualifier: enables
  review:
    summary: Epimerase activity of the purified complex.
    action: KEEP_AS_NON_CORE
    reason: >-
      Kept as a genuine secondary activity because of its physiological payoff: by dehydrating D-3-hydroxyacyl-CoA
      to trans-2-enoyl-CoA and rehydrating it to the L isomer, FadB lets D-3-hydroxyacyl-CoA intermediates
      enter the spiral. UniProt records, from experiment, that FadB can use D-3-hydroxyacyl-CoA as a substrate.
      It is non-core because the main spiral runs through the L isomer.
    supported_by:
    - reference_id: file:ECOLI/fadB/fadB-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: >-
        Catalyzes the formation of 3-oxoacyl-CoA from enoyl-CoA via L-3-hydroxyacyl-CoA. It can also use
        D-3-hydroxyacyl-CoA and cis-3-enoyl-CoA as substrate.
    - reference_id: PMID:8454629
      supporting_text: >-
        Thus the E. coli hydratase and epimerase activities represent two functions of a unique crotonase
        that converts both L- and D-3-hydroxyacyl-CoAs to 2-trans-enoyl-CoAs.
