- id: PMID:3286611
  title: >-
    Evidence that the fadB gene of the fadAB operon of Escherichia coli encodes 3-hydroxyacyl-coenzyme
    A (CoA) epimerase, delta 3-cis-delta 2-trans-enoyl-CoA isomerase, and enoyl-CoA hydratase in addition
    to 3-hydroxyacyl-CoA dehydrogenase.
  findings:
  - statement: All four alpha-subunit activities are encoded by fadB.
    supporting_text: >-
      lead to the conclusion that 3-hydroxyacyl-CoA epimerase, delta 3-cis-delta 2-trans-enoyl-CoA isomerase,
      and enoyl-CoA hydratase in addition to 3-hydroxyacyl-CoA dehydrogenase are encoded by the fadB gene.
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract checked.
- id: PMID:368024
  title: >-
    Five different enzymatic activities are associated with the multienzyme complex of fatty acid oxidation
    from Escherichia coli.
  findings:
  - statement: Five activities in one two-subunit complex.
    supporting_text: >-
      Evidence is presented in support of the proposed association of all five enzyme activities with
      one protein which apparently is composed of two types of subunits and which can exist in several
      aggregated forms.
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract matches PubMed.
