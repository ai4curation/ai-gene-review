      supporting_text: Purification of ATP sulfurylase to homogeneity reveals that the enzyme is composed
        of two types of subunits which are encoded by cysD and cysN.
    - reference_id: PMID:8003495
      supporting_text: The stoichiometry of GTP hydrolysis to APS synthesis is 1:1
