id: P23845
gene_symbol: cysN
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: CysN is the GTPase subunit of the Escherichia coli CysDN ATP sulfurylase. Its GTP hydrolysis
  is energetically coupled to sulfate adenylation by CysD, producing APS for the sulfate-assimilation
  pathway. CysN therefore contributes to ATP sulfurylase activity through energy coupling rather than
  performing the sulfate adenyl-transfer reaction independently.
