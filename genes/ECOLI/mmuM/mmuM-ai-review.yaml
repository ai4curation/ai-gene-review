    summary: SAM-dependent homocysteine methylation is supported as an additional MmuM reaction.
    action: KEEP_AS_NON_CORE
    reason: The purified E. coli YagD study explicitly reports SAM as a donor. Later work emphasizes
      preference for the damaged(R,S) SAM stereoisomer; preference does not establish that every
      alternative stereoisomer has zero activity. The precise stereochemical composition of the older
      donor preparation was not independently recovered. Preserve the curated molecular activity
      with those limits, rather than interpreting the engineered delta-metK/SAM-transporter strain
      as normal native SAM uptake or a self-sustaining complete cycle.
