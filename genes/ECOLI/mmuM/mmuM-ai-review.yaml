      assignment.
- id: PMID:9882684
  title: S-methylmethionine metabolism in Escherichia coli.
  findings:
  - statement: In K-12 KL19-derived strains, removal of yagD/mmuM abolishes SMM-supported growth
      when the two folate-dependent synthases are absent; this is imported-substrate utilization,
      not proof of an endogenous SMM cycle.
    supporting_text: Mutants in yagD which also possess defects in metE and metH are unable to utilize
      S-methylmethionine for growth
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Full cached primary inspected: KL19-derived mutant physiology and naming connect
      yagD to mmuM. Purified-enzyme results cited by this paper originate in the companion10026151
      study.'
- id: PMID:23912937
  title: Cell division, one-carbon metabolism and methionine synthesis in a metK-deficient Escherichia
    coli mutant, and a role for MmuM.
  findings:
  - statement: The engineered K-12 delta-metK strain expresses a rickettsial SAM transporter and
      uses supplied SAM; this is not evidence of normal SAM uptake or autonomous complete-cycle regeneration
      by MmuM.
    supporting_text: It uses the externally provided (R)-enantiomer of SAM as methyl donor to produce
      most but not all of its methionine
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cached abstract inspected; no exact unreported construct or kinetic details are
