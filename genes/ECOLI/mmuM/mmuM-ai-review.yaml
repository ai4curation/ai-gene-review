id: Q47690
gene_symbol: mmuM
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: MmuM, formerly YagD, is a zinc-dependent homocysteine S-methyltransferase of Escherichia
  coli K-12. It transfers a methyl group from S-methylmethionine to homocysteine, yielding two methionine
  molecules, and enables utilization of imported S-methylmethionine when folate-dependent methionine
  synthesis is unavailable. Purified MmuM also accepts SAM as a donor and selenium-containing acceptors.
  SAM-dependent activity has been linked to use of damaged SAM stereoisomers in distinct experimental
  contexts. These reactions do not by themselves establish a complete endogenous S-methylmethionine
  cycle.
