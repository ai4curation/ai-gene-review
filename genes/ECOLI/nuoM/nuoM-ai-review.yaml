- term:
    id: GO:0048039
    label: ubiquinone binding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN000511780
  - UniProtKB:P0AFE8
  review:
    summary: >-
      Propagated from the E. coli NuoM photoaffinity-labelling result. Structures of
      complex I place the quinone-binding site at the interface of the peripheral arm
      and NuoH (Nqo4/6/8), distant from the antiporter-like subunits, so intrinsic
      ubiquinone binding as a function of NuoM is likely an over-annotation.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The only seed is the E. coli NuoM IDA (PMID:12730198), in which an azido-Q
      analogue labelled NuoM. Subsequent crystal and cryo-EM structures of bacterial
      complex I locate the catalytic quinone-binding site at the junction of NuoCD
      (Nqo4), NuoB (Nqo6) and NuoH (Nqo8), with no cofactors in the membrane arm and
      the antiporter-like subunits distant from the hydrophilic domain. Mutant NuoM
      enzymes retained one tightly bound ubiquinone per FMN, also arguing against a
      NuoM-specific quinone site. Binding of the photoreactive analogue may reflect
      non-catalytic or hydrophobic interactions. The assertion is therefore not
      demonstrably wrong but overstates a physiological ubiquinone-binding function
      for NuoM and for its family-wide descendants.
    propagation_review:
      root_cause: SOURCE_WEAK_OR_INFERRED
      failure_modes:
      - SOURCE_EVIDENCE_WEAK
      - ROLE_CONFLATION
      source_entities:
      - source_id: PANTHER:PTN000511780
        source_label: PTN000511780
        source_status: SOURCE_WEAK_OR_INFERRED
        comment: Sole seed is the E. coli NuoM azido-Q photoaffinity IDA (PMID:12730198);
          later structures place the catalytic quinone site at NuoCD/NuoB/NuoH,
          so a whole-complex property is attributed to an antiporter-like subunit.
    supported_by:
    - reference_id: PMID:23417064
      supporting_text: there are no cofactors in the membrane and the antiporter-like
        subunits
    - reference_id: PMID:18590697
      supporting_text: Complex I from all these mutants contained 1 mol tightly bound
        ubiquinone per mol FMN like wild type enzyme.
- term:
    id: GO:0048039
    label: ubiquinone binding
  evidence_type: IDA
  original_reference_id: PMID:12730198
  qualifier: enables
  review:
    summary: >-
      A tritiated azido-ubiquinone photoaffinity probe heavily labelled NuoM in
      purified E. coli complex I, and a labelled NuoM peptide (residues 184-193) was
      identified; the authors proposed that NuoM houses the Q-binding site.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The experiment is sound as a demonstration that a quinone analogue can be
      cross-linked to NuoM, and it is not removed. However, the interpretation that
      NuoM houses the catalytic ubiquinone-binding site has been superseded by
      structures placing the quinone-binding chamber at the interface of Nqo4, Nqo6
      and Nqo8 (NuoCD, NuoB, NuoH), with no cofactors in the membrane arm. NuoM
      mutants that lost activity still retained bound ubiquinone. Ubiquinone binding
      is thus not a characteristic function of NuoM, and the annotation is best
      flagged as over-annotation rather than core.
    supported_by:
    - reference_id: PMID:12730198
      supporting_text: subunit NuoM was heavily labeled, suggesting that this protein
        houses the Q-binding site
    - reference_id: PMID:23417064
      supporting_text: there are no cofactors in the membrane and the antiporter-like
        subunits
