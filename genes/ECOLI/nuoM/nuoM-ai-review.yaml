  qualifier: contributes_to
  review:
    summary: >-
      Overproduced, purified E. coli complex I containing all subunits catalyses
      inhibitor-sensitive NADH:ubiquinone oxidoreduction; NuoM contributes to this
      complex-level activity.
    action: ACCEPT
    reason: >-
      NADH:ubiquinone oxidoreductase activity coupled to proton translocation is the
      defining activity of NDH-1. NuoM is an obligate membrane-arm subunit that
