core_functions:
- description: >-
    Antiporter-like membrane-arm subunit of NDH-1 (complex I) that provides one of
    the proton-translocation pathways of the enzyme, contributing to NADH:quinone
    oxidoreduction coupled to proton pumping across the cytoplasmic membrane.
  contributes_to_molecular_function:
    id: GO:0008137
    label: NADH dehydrogenase (ubiquinone) activity
  directly_involved_in:
  - id: GO:0015990
    label: electron transport coupled proton transport
  - id: GO:0022904
    label: respiratory electron transport chain
  in_complex:
    id: GO:0045271
    label: respiratory chain complex I
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:21822288
    supporting_text: Each repeat includes a discontinuous transmembrane helix and forms
      half of a channel across the membrane.
  - reference_id: PMID:18590697
    supporting_text: The quinone reductase activity was practically lost in K234A,
      K234R and E144A
  - reference_id: file:ECOLI/nuoM/nuoM-uniprot.txt
    supporting_text: Couples the redox reaction to proton translocation (for every
      two electrons transferred, four hydrogen ions are translocated across the
      cytoplasmic membrane), and thus conserves the redox energy in a proton gradient.
suggested_questions:
- question: >-
    Does NuoM translocate a proton per turnover through its own half-channels, or do
    protons exit only via NuoL as proposed from turnover cryo-EM structures, with
    NuoM acting as a conformational/electrostatic relay?
- question: >-
    What does the azido-ubiquinone labelling of NuoM residues 184-193 represent:
    a second, non-catalytic quinone or lipid site, or a nonspecific hydrophobic
    cross-link?
- question: >-
    Does the physiological acceptor (ubiquinone-8 versus menaquinone-8 under
    different growth conditions) alter the coupling stoichiometry contributed by the
    antiporter-like subunits?
suggested_experiments:
- description: >-
    Reconstitute NuoM point mutants in the second half-channel (e.g. Glu407 and
    Lys265) into proteoliposomes and measure H+/2e- stoichiometry, to determine
    whether NuoM contributes one proton per cycle.
  experiment_type: site-directed mutagenesis with proton-pumping stoichiometry assays
- description: >-
    Repeat the azido-quinone photoaffinity labelling on the high-resolution cryo-EM
    sample and map cross-links by mass spectrometry, testing whether NuoM labelling
    reflects a defined binding pocket.
  experiment_type: photoaffinity labelling with cross-linking mass spectrometry
