id: P0AFE8
gene_symbol: nuoM
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  NuoM is a 14-transmembrane-helix integral inner (cytoplasmic) membrane subunit of
  the proton-translocating NADH:quinone oxidoreductase NDH-1 (respiratory complex I),
  the homologue of mitochondrial ND4 (complex I subunit 4 family). It is the middle of
  three homologous antiporter-like subunits (NuoL, NuoM, NuoN) that form the distal
  part of the membrane arm. Each antiporter-like subunit is built from two inverted
  five-helix repeats that each form a half-channel, connected by a network of
  conserved polar residues, with conserved lysines (and in NuoM a glutamate in the
  second half-channel) acting as key elements of the proton pump. NuoM carries no
  redox cofactor; electrons pass from NADH via FMN and the iron-sulfur chain of the
  peripheral arm to quinone bound at the peripheral/membrane-arm interface, and the
  redox energy released there is transmitted by conformational and electrostatic
  coupling along the membrane arm to drive proton translocation through the
  antiporter-like subunits. The assembled complex translocates four protons per two
  electrons, conserving the energy of NADH oxidation as a proton-motive force for
  aerobic respiration. NuoM is required for assembly of a functional complex.
