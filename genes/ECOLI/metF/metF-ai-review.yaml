suggested_questions:
- question: >-
    Lacking the AdoMet regulatory domain of eukaryotic MTHFRs, how is MetF flux
    controlled post-translationally in E. coli, if at all, beyond MetJ-mediated
    transcriptional repression?
suggested_experiments:
- description: >-
    Measure intracellular 5-methyl-THF and methylene-THF pools and MetF enzyme
    activity in wild-type and metJ strains across methionine-replete and
    methionine-limited growth to test whether MetF is regulated only at the
    transcriptional level.
  experiment_type: metabolite profiling and enzyme activity in regulatory mutants
