- term:
    id: GO:0051087
    label: protein-folding chaperone binding
  evidence_type: IPI
  original_reference_id: PMID:16051146
  qualifier: enables
  supporting_entities:
  - UniProtKB:P0A6F5
  review:
    summary: >-
      Proteome-wide identification of GroEL (P0A6F5) substrates; MetF, a
      TIM-barrel protein, was captured as a GroEL interactor. The cached record is
      abstract-only and does not name MetF.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The interaction is plausibly real, but it reflects MetF being a folding
      client (substrate) of the chaperonin, not a molecular function that MetF
      performs. Annotating a chaperone substrate with "protein-folding chaperone
      binding" overstates the role; the interaction is better captured as a
      GroEL substrate relationship (GroEL has the activity, MetF is its input).
      I defer to the curator that the interaction was observed, hence not
      REMOVE.
    supported_by:
    - reference_id: PMID:16051146
      supporting_text: substantially enriched among the GroEL substrates are proteins
        with (betaalpha)8 TIM-barrel domains
    - reference_id: PMID:19610625
      supporting_text: The enzyme is a tetramer of 33 kDa subunits, each monomer
        a β8α8 barrel.
