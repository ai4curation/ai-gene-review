gene_symbol: metF
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  metF (b3941) encodes 5,10-methylenetetrahydrofolate reductase (MTHFR) of
  Escherichia coli, a soluble cytosolic flavoprotein built as a homotetramer of
  33-kDa beta8alpha8-barrel subunits, each carrying one noncovalently bound FAD.
  MetF reduces 5,10-methylene-tetrahydrofolate to 5-methyl-tetrahydrofolate
  using NADH as the preferred reductant (NADPH is used much less efficiently),
  by a ping-pong mechanism in which NADH and the folate substrate bind in turn at
  overlapping sites on the si face of the flavin. The product,
  5-methyl-tetrahydrofolate, is the methyl donor used by the methionine synthases
  MetE and MetH to methylate homocysteine, so MetF supplies the methyl group for
  de novo L-methionine biosynthesis; metF is part of the methionine regulon and
  is repressed by methionine. Unlike eukaryotic MTHFRs, the E. coli enzyme
  consists of the catalytic domain only and lacks the S-adenosylmethionine
  regulatory domain.
