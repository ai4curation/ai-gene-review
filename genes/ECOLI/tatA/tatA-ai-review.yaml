id: P69428
gene_symbol: tatA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: 'TatA is the most abundant component of the Escherichia coli twin-arginine translocation
  (Tat) system, a single-spanning inner-membrane protein with an amphipathic helix. After a folded precursor
  carrying a twin-arginine signal peptide binds the TatBC receptor, TatA protomers are recruited in a
  proton-motive-force-dependent manner and oligomerize into the assembly that moves the substrate across
  the cytoplasmic membrane without ATP. TatA and its late paralog TatE have overlapping roles: export
  is fully blocked only when both are inactivated.'
