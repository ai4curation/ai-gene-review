- term:
    id: GO:0008320
    label: transmembrane protein transporter activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN002452729
  - UniProtKB:P0A843
  - UniProtKB:P69428
  - UniProtKB:Q9HUB5
  review:
    summary: TatA is an essential subunit of the Tat translocase; the transporter activity belongs to
      the assembled TatABC complex.
    action: MARK_AS_OVER_ANNOTATED
    reason: 'TatA is required for Tat transport and is recruited to the substrate-bound TatBC receptor
      to form the translocating assembly, but it does not move substrate on its own: reconstituted transport
      needs TatA, TatB and TatC together, and whether TatA assemblies form a pore or locally destabilize
      the membrane is still open (the cited sources say TatA ''could'' form the channel). The ''enables''
      qualifier therefore attributes the whole-complex activity to one subunit, as for TatB and TatC;
      the core function records it as contributes_to with the TatA-specific activity proposed as a new
      term. This IBA is inherited from PAINT node PTN002452729 in PTHR42982, whose IBD seeds include the
      experimentally characterized E. coli subunit.'
    supported_by:
    - reference_id: file:ECOLI/tatA/tatA-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: TatA could form the protein-conducting channel of the Tat system.
    - reference_id: file:ECOLI/tatA/tatA-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: Part of the twin-arginine translocation (Tat) system that transports large folded
        proteins containing a characteristic twin-arginine motif in their signal peptide across membranes.
