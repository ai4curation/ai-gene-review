core_functions:
- description: TatA is the abundant single-spanning subunit that is recruited, in a proton-motive-force-dependent
    manner, to substrate-bound TatBC and oligomerizes into the assembly through which folded Tat substrates
    cross the cytoplasmic membrane.
  supported_by:
  - reference_id: file:ECOLI/tatA/tatA-uniprot.txt
    record_section: ["CC:FUNCTION"]
    supporting_text: Part of the twin-arginine translocation (Tat) system that transports large folded
      proteins containing a characteristic twin-arginine motif in their signal peptide across membranes.
  - reference_id: file:ECOLI/tatA/tatA-uniprot.txt
    record_section: ["CC:FUNCTION"]
    supporting_text: TatA could form the protein-conducting channel of the Tat system.
  - reference_id: PMID:11350936
    supporting_text: requires TatABC, an intact membrane potential and the twin-arginine targeting motif
  - reference_id: PMID:16027357
    supporting_text: This morphology strongly supports the proposal that TatA forms the protein-conducting
      channel of the Tat system.
  - reference_id: PMID:29358647
    supporting_text: Depending on the proton-motive force, TatA associates with the TatBC complex23 and
      the signal peptide14,24.
  contributes_to_molecular_function:
    id: GO:0009977
    label: proton motive force dependent protein transmembrane transporter activity
  proposed_molecular_function: Tat translocon conduit assembly activity
  directly_involved_in:
  - id: GO:0043953
    label: protein transport by the Tat complex
  locations:
  - id: GO:0005886
    label: plasma membrane
  in_complex:
    id: GO:0033281
    label: TAT protein transport complex
proposed_new_terms:
- proposed_name: Tat translocon conduit assembly activity
  proposed_definition: Associating, in a proton-motive-force-dependent manner, with a substrate-bound
    TatBC receptor and homo-oligomerizing into the membrane assembly through which a folded twin-arginine-signal
    protein crosses the membrane, whether by forming a conduit or by locally weakening the bilayer.
  justification: TatA does the translocating step of Tat transport but does not transport substrate without
    TatB and TatC, so GO:0009977 is recorded as contributes_to. GO has no term for the subunit's own activity;
    signal sequence receptor activity (TatB, TatC) does not fit, and the exact physical mechanism (pore
    versus membrane weakening) is unresolved, so the definition covers both.
  proposed_parent:
    id: GO:0140318
    label: protein transporter activity
  supported_by:
  - reference_id: file:ECOLI/tatA/tatA-uniprot.txt
    record_section: ["CC:FUNCTION"]
    supporting_text: TatA could form the protein-conducting channel of the Tat system.
  - reference_id: PMID:29358647
    supporting_text: Depending on the proton-motive force, TatA associates with the TatBC complex23 and
      the signal peptide14,24.
  - reference_id: PMID:16027357
    supporting_text: TatA forms ring-shaped structures of variable diameter in which the internal channels
      are large enough to accommodate known Tat substrate proteins.
suggested_questions:
- question: Does TatA form a size-matched protein-conducting pore or act by locally destabilizing the
    membrane?
suggested_experiments:
- description: Resolve TatA assemblies on an active, substrate-engaged translocon by cryo-EM in native
    membranes and correlate assembly size with substrate size.
  experiment_type: structural biology
