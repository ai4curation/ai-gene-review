id: P38038
gene_symbol: cysJ
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: CysJ is the flavoprotein electron-input component of Escherichia coli assimilatory NADPH-sulfite
  reductase. It transfers electrons from NADPH through FAD and FMN to the siroheme/[4Fe-4S] catalytic
  component CysI, enabling sulfide production for cysteine biosynthesis. The soluble CysJ protein also
  reduces free flavins and participates with YcbX in detoxification of N-hydroxylated base analogs independently
  of CysI.
