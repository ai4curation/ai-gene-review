id: P07102
gene_symbol: appA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli (strain K12)
description: >-
  appA encodes a Sec-exported periplasmic histidine acid phosphatase best
  characterised as the E. coli AppA phytase. The mature enzyme acts in the
  outer membrane-bounded periplasm, where it hydrolyses phytate and lower
  inositol phosphates stepwise to release inorganic phosphate. The same active
  site can hydrolyse other acidic phosphatase substrates in vitro, including
  GTP, ppGpp, p-nitrophenyl phosphate, 2,3-bisphosphoglycerate, fructose
  1,6-bisphosphate, and tripolyphosphate. AppA synthesis increases on entry
  into stationary phase and is induced prematurely by inorganic-phosphate
  starvation, consistent with a nutrient-scavenging role for periplasmic
  organophosphate hydrolysis.
