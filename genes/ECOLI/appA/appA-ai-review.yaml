- term:
    id: GO:0016036
    label: cellular response to phosphate starvation
  evidence_type: IDA
  original_reference_id: PMID:6282821
  qualifier: acts_upstream_of_or_within
  review:
    summary: >-
      AppA synthesis was induced early by inorganic-phosphate starvation, and
      the enzyme releases Pi from periplasmic phytate/inositol phosphate
      substrates.
    action: ACCEPT
    reason: >-
      Correct. AppA is not merely transcriptionally responsive to phosphate
      limitation; its periplasmic phosphatase chemistry can liberate inorganic
      phosphate from organic substrates as an effector branch of phosphate
      scavenging.
    supported_by:
    - reference_id: PMID:6282821
      supporting_text: >-
        A starvation for inorganic phosphate resulted in a premature full
        induction, while carbon, nitrogen, and sulfur limitations were
        inefficient.
    - reference_id: PMID:8387749
      supporting_text: >-
        Because of the kinetic parameters it would be better to denote this
        enzyme as a phytase.
- term:
    id: GO:0016311
    label: dephosphorylation
  evidence_type: IDA
  original_reference_id: PMID:6282821
  qualifier: acts_upstream_of_or_within
  review:
    summary: >-
      Purified AppA removes phosphoryl groups from phosphoanhydrides and from
      several phosphomonoesters.
    action: KEEP_AS_NON_CORE
    reason: >-
      The process is true as a generic description of AppA's phosphatase
      chemistry. It is retained as a broad umbrella term; more informative
      molecular-function rows capture the substrates and the enzyme's
      phytase-focused physiological role.
    supported_by:
    - reference_id: PMID:6282821
      supporting_text: >-
        The enzyme did not split most phosphomonoesters with the exception of
        the synthetic substrate p-nitrophenyl phosphate (Km = 2.7 mM),
        2,3-bisphosphoglycerate (Km = 5 mM), and fructose 1,6-bisphosphate (Km
        = 5 mM).
