    label: GTPase activity
  evidence_type: EXP
  original_reference_id: PMID:6282821
  qualifier: enables
  review:
    summary: >-
      Purified AppA hydrolysed the gamma-phosphoryl residue of GTP, one of the
      phosphoanhydride substrates preferred by the pH 2.5 acid phosphatase.
    action: KEEP_AS_NON_CORE
    reason: >-
      Correct as a measured in-vitro hydrolysis reaction, but it is not AppA's
      physiological core. AppA is a periplasmic phytase/acid phosphatase; GTP
      and ppGpp hydrolysis were part of the purified enzyme's acidic
      phosphoanhydride substrate profile.
    supported_by:
    - reference_id: PMID:6282821
      supporting_text: >-
        It had predominantly a phosphoanhydride phosphatase activity and
        preferentially hydrolyzed the gamma-phosphoryl residue of GTP (Km =
        0.35 mM) and the 5'-beta-phosphoryl residue of ppGpp (Km = 1.8 mM).
