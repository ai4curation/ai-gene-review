- term:
    id: GO:0071454
    label: cellular response to anoxia
  evidence_type: IDA
  original_reference_id: PMID:6282821
  qualifier: acts_upstream_of_or_within
  review:
    summary: >-
      AppA activity accumulated after cultures were shifted to anaerobic
      conditions, but the cached evidence addresses induction rather than a
      demonstrated AppA effector role in anoxia adaptation.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The enzyme is induced by anaerobiosis, yet all direct chemistry points to
      periplasmic phosphate scavenging. Induced expression is not, by itself,
      enough to show that the mature AppA enzyme executes a cellular response
      to anoxia.
    supported_by:
    - reference_id: PMID:6282821
      supporting_text: >-
        In the presence of nonlimiting amounts of inorganic phosphate, however,
        the transfer of the culture to anaerobic conditions led to an immediate
        accumulation of the acid phosphatase.
core_functions:
- description: >-
    Periplasmic AppA hydrolyses phytate and lower myo-inositol phosphates as an
    acid histidine phosphatase, releasing inorganic phosphate from
    organophosphate substrates in the outer membrane-bounded periplasm during
    phosphate scavenging.
  molecular_function:
    id: GO:0052745
    label: inositol phosphate phosphatase activity
  locations:
  - id: GO:0030288
    label: outer membrane-bounded periplasmic space
  directly_involved_in:
  - id: GO:0016036
    label: cellular response to phosphate starvation
  supported_by:
  - reference_id: PMID:11035187
    supporting_text: >-
      Using a combination of high-performance ion chromatography analysis and
      kinetic studies, the stereospecificity of myo-inositol hexakisphosphate
      dephosphorylation by the phytate-degrading enzyme P2 of Escherichia coli
      was established.
  - reference_id: PMID:8387749
    supporting_text: >-
      Two periplasmatic phytases, called P1 and P2, were purified about
      16,500-fold to an apparent homogeneity with a recovery of 7 and 18%,
      respectively.
proposed_new_terms: []
suggested_questions:
- question: >-
    Do AppA's in-vitro GTPase, ppGpp phosphohydrolase, and tripolyphosphatase
    activities correspond to any extracellular-facing physiological substrates,
    or are they incidental activities of the phytase active site?
- question: >-
    Which environmental organophosphate pools supply AppA-dependent phosphate to
    E. coli under natural phosphate limitation, and how much of that flux is
    through phytate rather than other acidic phosphomonoesters?
suggested_experiments:
- hypothesis: >-
    AppA contributes to phosphate acquisition primarily when phytate or lower
    myo-inositol phosphates are the accessible organophosphate source.
  description: >-
    Compare wild type, delta-appA, delta-phoA, and double mutants for growth and
    extracellular phosphate release in phosphate-limited medium supplied with
    phytate, defined lower myo-inositol phosphates, GTP, ppGpp, or fructose
    1,6-bisphosphate as the sole phosphorus source.
  experiment_type: bacterial growth and enzymology
