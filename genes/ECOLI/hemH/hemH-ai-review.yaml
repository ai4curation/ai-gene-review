suggested_questions:
- question: >-
    How does HemH obtain ferrous iron when Dps sequesters iron during H2O2 stress, and is a dedicated
    iron donor involved?
suggested_experiments:
- hypothesis: >-
    Raising HemH levels compensates for reduced iron availability rather than for loss of HemH activity.
  description: >-
    Compare heme b formation, protoporphyrin IX accumulation and catalase activity in hemH promoter variants
    with and without dps under H2O2 stress, with defined iron supply.
