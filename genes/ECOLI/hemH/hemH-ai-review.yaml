    summary: >-
      McConville and Charles 1979 isolated haemin-requiring E. coli mutants, one group of which was judged
      defective in ferrochelatase.
    action: ACCEPT
    reason: >-
      Heme auxotrophy of ferrochelatase-deficient mutants supports involvement in heme biosynthesis; the
      abstract does not map these mutations to hemH explicitly, so the attribution is deferred to the
      EcoCyc curator, and the claim is in any case directly established by the later work.
    supported_by:
    - reference_id: PMID:387909
      supporting_text: >-
        According to their growth responses to haem precursors and their patterns of porphyrin accumulation,
        the 55 mutants fell into three groups which were judged to have defects in 5-aminolaevulinate
        dehydratase, ferrochelatase, and uroporphyrinogen III cosynthase or uroporphyrinogen decarboxylase.
- term:
    id: GO:0009416
    label: response to light stimulus
  evidence_type: IMP
  original_reference_id: PMID:1835790
  qualifier: acts_upstream_of_or_within
  review:
    summary: >-
      EcoliWiki IMP for response to light stimulus, from the visible-light killing of visA mutants.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The light sensitivity is an indirect consequence of the enzyme defect, not a role of HemH in responding
      to light: in the mutant, accumulated protoporphyrin IX acts as a photosensitiser generating reactive
      oxygen, and other heme-pathway mutations that prevent its accumulation cure the phenotype. Wild-type
      HemH performs no step of a light-response process; the phenotype reflects its ferrochelatase activity,
      which is captured by the activity and heme B rows.
    supported_by:
    - reference_id: PMID:1835790
      supporting_text: >-
        Since other mutations in the genes involved in the biosynthesis of heme can cure the photosensitivity,
        the light-induced cell death appears to be brought about by the accumulation of protoporphyrin
        IX, one of the substrates of ferrochelatase.
- term:
