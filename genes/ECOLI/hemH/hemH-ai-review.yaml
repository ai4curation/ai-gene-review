  label: Escherichia coli K-12
description: >-
  HemH is the ferrochelatase of Escherichia coli K-12 (EC 4.98.1.1), a monomeric cytoplasmic enzyme of
  about 35 kDa that catalyses the terminal step of heme biosynthesis, insertion of ferrous iron into protoporphyrin
  IX to form protoheme (heme b). The gene was first identified as visA: mutants lacking ferrochelatase
  accumulate protoporphyrin IX, which photosensitises the cells so that they are killed by visible light,
  a bacterial counterpart of human protoporphyria. hemH transcription is induced by OxyR during hydrogen
  peroxide stress, which helps sustain heme synthesis and catalase activation when the iron-storage protein
  Dps limits iron availability.
