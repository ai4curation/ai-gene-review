      in a response to light.
    supported_by:
    - reference_id: PMID:2051480
      supporting_text: These mutant strains of bacteria are killed by illumination with visible light.
    - reference_id: PMID:1397280
      supporting_text: >-
        These results confirm the hypothesis that the sensitivity of the visA mutants to light is caused
        by the abnormal accumulation of Proto IX, a substrate of ferrochelatase, as the result of a genetic
        defect in the gene for ferrochelatase.
