  review:
    summary: AcnA is induced by SoxRS during superoxide stress and, unlike AcnB, retains activity in vivo
      in SOD- or catalase-deficient cells; acn mutants are hypersensitive to H2O2 and methyl viologen,
      and apo-AcnA stabilises sodA mRNA.
