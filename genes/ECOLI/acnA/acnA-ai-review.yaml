    isomerisation of citrate to isocitrate via cis-aconitate in the cytosol, using a [4Fe-4S] cluster
    that is unusually resistant to oxidants and iron chelation in vivo, so that TCA-cycle flux is maintained
    when the labile housekeeping isozyme AcnB is inactivated.
