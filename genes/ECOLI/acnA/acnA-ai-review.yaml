gene_symbol: acnA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: 'acnA encodes aconitase A (aconitate hydratase A, EC 4.2.1.3), a monomeric ~97 kDa cytosolic
  [4Fe-4S] enzyme of the aconitase/IRP family that catalyses the reversible isomerisation of citrate to
  isocitrate via cis-aconitate in the tricarboxylic acid cycle. E. coli has two major aconitases: AcnB
  is the main housekeeping enzyme during exponential growth, whereas AcnA is an aerobic stationary-phase
  isozyme induced by iron (Fur), sigma-38 and redox stress (SoxRS), and repressed by catabolite repression
  and anaerobically by ArcA/FNR. AcnA has a higher affinity for citrate, is active over a broad pH range
  and, unlike AcnB, retains its cluster and activity in vivo during superoxide and peroxide stress and
  iron chelation, allowing it to sustain TCA-cycle flux when AcnB is inactivated. Like vertebrate IRP1,
  cluster-free apo-AcnA binds the 3'' untranslated regions of acnA and acnB mRNAs, stabilising them and
  increasing aconitase synthesis (a post-transcriptional positive autoregulatory switch), and it also
  enhances stability of the sodA transcript. acn mutants are hypersensitive to H2O2 and methyl viologen.
  The 2-methyl-cis-aconitate hydratase step of the 2-methylcitrate (propionate) cycle has been attributed
  to AcnB rather than AcnA.'
