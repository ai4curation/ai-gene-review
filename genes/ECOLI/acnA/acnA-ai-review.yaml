  review:
    summary: Annotation of AcnA to anaerobic respiration from Varghese et al. (2003). In that study anaerobic
      cultures and extracts were used as an experimental device to protect clusters from oxidation (e.g.
      iron-chelator treatment of anaerobic cells), not to test a role in anaerobic respiration.
    action: REMOVE
    reason: The full text (available in the cache) contains no evidence that AcnA participates in anaerobic
      respiration; anaerobic conditions are an assay condition. AcnA is an aerobic stationary-phase enzyme
      whose synthesis is repressed anaerobically by ArcA and FNR, and aconitase is not a component of
      anaerobic respiratory electron transport. The annotation appears to conflate experimental growth
      conditions with biological process.
    additional_reference_ids:
    - PMID:8000525
    - PMID:9421904
    supported_by:
    - reference_id: PMID:12486059
      supporting_text: AcnB activity was rapidly lost (t 1/2 < 5 min) when dipyridyl, a cell-permeable
        iron chelator, was added to anaerobic acnA mutant cells (data not shown). AcnA (in the acnB mutant)
        was completely resistant to this treatment.
    - reference_id: PMID:8000525
      supporting_text: the acnA gene resembles other citric acid cycle genes in being subject to CRP-mediated
        catabolite repression and ArcA-mediated anaerobic repression
