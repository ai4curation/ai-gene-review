suggested_questions:
- question: Does E. coli AcnA hydrate 2-methyl-cis-aconitate to 2-methylisocitrate (EC 4.2.1.99) in vitro
    or contribute to the 2-methylcitrate cycle in vivo, given that Brock et al. (2002) purified only AcnB
    as the 2-methylaconitate hydratase from propionate-grown cells?
- question: Should the apo-AcnA mRNA-stabilising activity on acnA/acnB and sodA transcripts be captured
    as a process term (e.g. regulation of translation or mRNA stabilization), as was done for AcnB from
    the same study?
- question: What is the uncharacterised cell-extract factor that protects the AcnA [4Fe-4S] cluster from
    superoxide and H2O2 in vivo, while purified AcnA is oxidant-sensitive?
suggested_experiments:
- description: Assay purified holo-AcnA and AcnB side by side with cis-aconitate and synthetic 2-methyl-cis-aconitate,
    and test propionate growth of acnA, acnB and acnAB (with acnC background) mutants to determine whether
    AcnA contributes to the 2-methylcitrate cycle.
- description: Fractionate E. coli extracts to identify the factor that confers oxidant resistance on
    AcnA, and test candidates (e.g. YggX-family proteins) by reconstitution with purified AcnA under superoxide
    and H2O2 challenge.
- description: Map the AcnA-binding elements in the acnA, acnB and sodA 3'UTRs (e.g. by RNase footprinting
    or CLIP-seq of apo-AcnA in vivo) to define the bacterial counterpart of the eukaryotic IRE.
