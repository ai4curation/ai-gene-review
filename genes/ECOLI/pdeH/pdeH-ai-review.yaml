taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: PdeH (YhjH) is a highly active EAL-domain phosphodiesterase that hydrolyzes c-di-GMP to pGpG
  in Escherichia coli. Its expression is linked to the flagellar program. By maintaining a low global
  c-di-GMP concentration, PdeH relieves YcgR-mediated motor braking and restrains biofilm-matrix induction,
  while allowing specific cyclases to signal locally to their targets.
