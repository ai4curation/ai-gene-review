  review:
    summary: A membrane location is not established for the stand-alone EAL-domain PDE.
    action: MARK_AS_OVER_ANNOTATED
    reason: The available PMID:26553851 cache is abstract-only and does not explicitly establish PdeH
      solubility or localization. The frozen UniProt record identifies its EAL domain; the compact stand-alone
      architecture makes inheritance of the specific plasma-membrane location questionable, but architecture
      is not a localization assay. PMID:29018125 establishes drainage of the global c-di-GMP pool, which
      likewise does not resolve the compartment. The PTN002105365 placement was checked and no lineage
      IRD/IKR was found. Mark the location as over-annotated without asserting an unmeasured replacement
      compartment or challenging donor count.
    supported_by:
