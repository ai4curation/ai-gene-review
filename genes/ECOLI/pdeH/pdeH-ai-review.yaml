      resource: UNIPROT
      record: UniProtKB:P37646
      slot: CC:DISRUPTION PHENOTYPE
      requested_change: CHECK
      asserted_value: Also leads to a severe reduction in swarm size and swimming velocity, and 80% reduced
        concentrations of c-di-GMP.
      confidence: CONFIRMED
      explanation: 'The direction of the c-di-GMP change is reversed: deleting the c-di-GMP phosphodiesterase
        PdeH/YhjH elevates the messenger, as directly measured in PMID:29018125 and stated for yhjH mutants
        in PMID:20346719. Retain the motility phenotype but check and correct the nucleotide-concentration
        clause; the quantitative 80% value should be traced to the original experiment.'
      supported_by:
      - reference_id: PMID:20346719
        supporting_text: yhjH mutants have elevated c-di-GMP levels and require YcgR, a c-di-GMP-binding
          protein, for motility inhibition.
      report_status: NOT_REPORTED
  findings:
  - statement: The source disruption comment has a reversed c-di-GMP concentration direction; the review
      follows the primary measurements.
- id: PMID:20346719
  title: The c-di-GMP binding protein YcgR controls flagellar motor direction and speed to affect chemotaxis
    by a "backstop brake" mechanism.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text confirms elevated c-di-GMP in yhjH mutants and YcgR-dependent motility inhibition.
  findings:
