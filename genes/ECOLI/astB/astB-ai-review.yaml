id: P76216
gene_symbol: astB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  astB (b1745) encodes N-succinylarginine dihydrolase (EC 3.5.3.23), the second
  enzyme of the ammonia-producing arginine succinyltransferase (AST) pathway of
  Escherichia coli. The homodimeric cytoplasmic enzyme has a pseudo-5-fold
  alpha/beta propeller fold of the amidinotransferase superfamily with a
  Cys-His-Glu catalytic triad, and hydrolyzes N2-succinyl-L-arginine in two
  cycles of hydrolysis and ammonia release to N2-succinyl-L-ornithine, two
  ammonium and CO2. It is required for growth on arginine as a nitrogen source
  but not for ornithine catabolism.
