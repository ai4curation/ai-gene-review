taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: BcsC forms the Escherichia coli outer-membrane cellulose export channel. Its C-terminal beta-barrel
  is connected to a long periplasmic TPR-rich region that contacts BcsB and helps guide the nascent polymer
  toward the outer membrane. It contributes to cellulose production by export rather than by glucose polymerization.
  Recombinant structures include a truncated barrel construct and engineered BcsB-TPR assemblies; these
  do not establish native transport rates or identical architecture under every growth condition.
