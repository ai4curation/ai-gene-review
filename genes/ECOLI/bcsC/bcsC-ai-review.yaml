- id: PMID:32127419
  title: Systematic Localization of Escherichia coli Membrane Proteins.
  findings:
  - statement: The fractionation study examines an MG1655-derived E. coli strain.
    supporting_text: The wild-type strain used in this study is Escherichia coli K-12 MG1655
  reference_review:
    relevance: HIGH
