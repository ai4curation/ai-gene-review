      claim of inspecting the target-specific supplemental profile is made.
- id: PMID:39394223
  title: Structural basis for synthase activation and cellulose modification in the E. coli Type II Bcs
    secretion system.
  findings:
  - statement: E. coli structures distinguish catalytic BcsA, membrane-anchored BcsB and cytosolic BcsQ
      stabilization.
    supporting_text: BcsQ buttresses the PilZ domain, likely stabilizing the catalytically competent state.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Native phenotype assays in PMID:39394223 used E. coli 1094; recombinant assembly used
      a bcs-deleted BL21*(DE3) host. The 2021 BcsRQ study also used 1094 genes and recombinant complexes.
      Protein identity/structure correspondence does not turn these into native K-12 experiments.
- id: PMID:39242554
  title: Insights into phosphoethanolamine cellulose synthesis and secretion across the Gram-negative
    cell envelope.
  findings:
  - statement: BcsB and BcsC connect cellulose synthesis with outer-membrane secretion.
    supporting_text: BcsC interacts with the terminal BcsB subunit of the semicircle to establish an envelope-spanning
      complex.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text examined. Detailed BcsB-BcsC interface used an engineered TPR/BcsB fusion;
      other experiments used a Rhodobacter/E. coli BcsA chimera. Native full-complex geometry is not inferred
      from every construct.
- id: PMID:31604608
  title: Architecture of the Cellulose Synthase Outer Membrane Channel and Its Association with the Periplasmic
    TPR Domain.
  findings:
  - statement: The E. coli BcsC 710-1157 construct resolves its final TPR and outer-membrane barrel.
    supporting_text: The membrane-integrated porin domain of BcsC forms a kidney-shaped 16-stranded β-barrel
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text examined; PDB 6TZK maps to P37650. Structure and secretion evidence support
      the channel function, without a measurement of native flux.
