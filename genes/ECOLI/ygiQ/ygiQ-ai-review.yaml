    reductively cleaved by the [4Fe-4S] cluster to the 5'-deoxyadenosyl radical, which
    abstracts the 5'(S) hydrogen; the methyl group is delivered from methylcobalamin, which
    is regenerated by a second SAM. The substrate is naked 23S rRNA, with domain V as the
    minimum efficient substrate, so the modification is installed early in 50S assembly.
