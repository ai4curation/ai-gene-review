proposed_new_terms:
- proposed_name: 23S rRNA (dihydrouridine(2449)/cytidine(2498)-ribose-5'-C)-methyltransferase
    activity
  proposed_definition: >-
    Catalysis of the stereoselective transfer of a methyl group to carbon 5'(S) of the
    ribose moiety of dihydrouridine at position 2449 and of cytidine at position 2498 of
    bacterial 23S ribosomal RNA, using methylcobalamin as the immediate methyl donor and
    S-adenosyl-L-methionine both as the source of the 5'-deoxyadenosyl radical that
    abstracts the 5'(S) hydrogen and as the methyl donor that regenerates methylcobalamin.
  justification: >-
    Ishiguro et al. show that E. coli RlmX (YgiQ, Q46861) methylates the ribose C5' position
    of 23S rRNA D2449 and C2498, the first RNA ribose modification described outside the 2'
    position. GO has no molecular-function term for ribose C5' methylation of RNA: every
    ribose methyltransferase term in GO is a 2'-O-ribose term (GO:0008650, GO:0070039,
    GO:0070677, GO:0030743, GO:0090486, GO:0180021 and the tRNA series), and the children of
    GO:0008649 rRNA methyltransferase activity are base-specific terms (GO:0016433,
    GO:0016434, GO:0016435, GO:0016436, GO:0070037). Annotating this activity with a
    2'-O-methyltransferase term would assert the wrong chemistry, and GO:0008649 alone loses
    both the position and the stereochemistry. GO:0008649 is the right parent because its
    definition already admits the ribose group as the methyl acceptor. No EC number or RHEA
    reaction has been assigned to this activity.
