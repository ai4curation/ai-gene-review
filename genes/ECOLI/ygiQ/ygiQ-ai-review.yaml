knowledge_gaps:
- gap_statement: >-
    The reaction, substrate and cofactors of YgiQ are unknown; it is unsettled whether YgiQ
    is the cobalamin-dependent rRNA ribose methyltransferase RlmX or has another activity.
  boundary: >-
    Established: YgiQ has the radical SAM core with an intact CxxxCxxC motif and is
    co-expressed with translation genes. An E. coli gene named rlmX encodes a
    cobalamin-dependent radical SAM methyltransferase that makes the two PTC ribose
    methylations of 23S rRNA under anaerobiosis, but the accessible text of that work does
    not identify rlmX with ygiQ, and InterPro reports no cobalamin-binding domain in YgiQ.
  gap_kind:
  - BIOLOGY
  dark_aspect: WHOLLY_DARK
  status: OPEN
  significance: >-
    If YgiQ is RlmX, the UPF0313 family becomes a cobalamin-dependent rRNA backbone
    methylase family that tunes the peptidyl-transferase centre for anaerobic growth, which
    would assign a function to thousands of uncharacterised family members.
  resolution: >-
    Quantify the two PTC ribose methylations in 23S rRNA from wild-type, ygiQ-deleted and
    complemented cells grown anaerobically, and assay purified, reconstituted YgiQ with
    methylcobalamin, SAM and 23S rRNA.
  provenance:
  - reference_id: PMID:41380683
    supporting_text: We identified the rlmX gene, encoding a cobalamin-dependent radical
  - reference_id: PMID:30698741
    supporting_text: they are generally associated with protein translation
  - reference_id: file:ECOLI/ygiQ/ygiQ-deep-research-openscientist.md
    supporting_text: 'The once-"uncharacterized" E. coli UPF0313 protein **YgiQ (Q46861) is RlmX**'
suggested_questions:
- question: >-
    Is rlmX, the gene for the cobalamin-dependent ribose C5'-methyltransferase acting on
    23S rRNA nucleotides 2449 and 2498, the same gene as ygiQ (b4469)?
  experts:
  - Tsutomu Suzuki
  - Kensuke Ishiguro
- question: >-
    Which part of YgiQ binds cobalamin, given that InterPro recognises no B12-binding
    domain, and is the N-terminal UPF0313 domain a divergent cobalamin-binding domain?
  experts:
  - Squire J Booker
  - Tsutomu Suzuki
suggested_experiments:
- hypothesis: YgiQ is RlmX and installs the two ribose C5' methylations of the 23S rRNA PTC.
  description: >-
    Grow wild-type, ygiQ-deleted and plasmid-complemented E. coli K-12 anaerobically, digest
    23S rRNA and quantify the modified nucleosides at positions 2449 and 2498 by LC-MS,
    including a radical SAM motif mutant (C386A) in the complementation test.
  experiment_type: genetics with RNA modification mass spectrometry
- hypothesis: YgiQ is a cobalamin-dependent radical SAM methyltransferase.
  description: >-
    Purify YgiQ anaerobically, reconstitute its iron-sulfur cluster and determine cluster
    stoichiometry by iron and sulfide quantitation with UV-visible and EPR spectroscopy;
    test binding of methylcobalamin and SAM, and assay reductive SAM cleavage in the
    presence and absence of candidate substrates.
  experiment_type: anaerobic enzymology and spectroscopy
