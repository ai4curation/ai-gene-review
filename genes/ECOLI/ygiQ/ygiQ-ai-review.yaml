    correctness: UNVERIFIED
    review_notes: >-
      Machine-generated report, checked against primary sources. Its central claim rests on
      PMID:41380683, whose abstract does not name ygiQ and whose full text was not
      accessible; the report's further statements that the paper formally renamed ygiQ and
      that deletion of ygiQ abolishes the modifications could not be found in any accessible
      text. Its assertion of a second [4Fe-4S] cluster at Cys453/458/464 is its own
      inference and conflicts with a published summary describing RlmX as having one
      cluster. Used only as the source of a hypothesis recorded in knowledge_gaps; nothing
      is annotated from it.
