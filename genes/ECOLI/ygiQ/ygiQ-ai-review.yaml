- gap_statement: >-
    The physiological electron donor that re-reduces cobalamin(II) during each RlmX turnover
    in E. coli is unknown.
  boundary: >-
    Established: in vitro, methyl viologen serves as the electron carrier for the cobalamin
    redox cycle, and the reaction fails without it. Flavodoxin, flavodoxin reductase and
    NADPH are suggested by analogy with other cobalamin-dependent radical SAM
    methyltransferases but were not tested here.
  gap_kind:
  - BIOLOGY
  status: OPEN
  significance: >-
    Identifying the donor would complete the pathway and would say whether the anaerobic
    induction of these modifications is partly a property of the reducing system rather than
    of RlmX itself.
  resolution: >-
    Reconstitute RlmX turnover with purified E. coli flavodoxin, flavodoxin-NADP+ reductase
    and NADPH in place of methyl viologen, and test whether the modifications are lost in
    strains depleted of those components under anaerobic growth.
