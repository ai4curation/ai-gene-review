- gap_statement: >-
    How RlmX activity is raised under hypoxia is unknown: rlmX mRNA levels do not change
    between aerobic and anaerobic growth, yet the modifications and the protein increase,
    and at equal induced expression the modification level is still much higher
    anaerobically.
  boundary: >-
    Established: RNA-seq shows no change in rlmX mRNA, proteomics shows more RlmX protein
    anaerobically, and arabinose-titrated expression gives more D-5S-m2449 anaerobically
    than aerobically at the same inducer concentration. Proposed but untested: that the
    oxygen sensitivity of the [4Fe-4S] cluster limits activity in air, with
    post-transcriptional regulation or protein stabilisation raising protein levels.
