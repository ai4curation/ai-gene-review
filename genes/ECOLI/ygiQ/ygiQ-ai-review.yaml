knowledge_gaps:
- gap_statement: >-
    Whether the RlmX-specific surface cysteine triad Cys453, Cys458 and Cys464 binds zinc,
    and what it actually does, is unresolved. All three residues are essential for
    methylation, and the authors attribute the triad to RNA recognition through zinc binding
    by analogy to earlier work, but no metal was measured on RlmX and the triad could
    instead contact rRNA directly or hold the protein fold.
  boundary: >-
    Established: the triad is RlmX-specific, conserved across bacterial homologues, located
    on the protein surface in the AlphaFold2 model, and each single alanine substitution
    abolishes 5'(S)-methylation in vivo. Also established: iron quantification gives one
    [4Fe-4S] cluster at about 92% occupancy, so the triad is not a second iron-sulfur
    cluster. Not established: the metal content of the triad, and whether it contacts rRNA.
  gap_kind:
  - BIOLOGY
  status: OPEN
  significance: >-
    A zinc site would be the first metal-dependent RNA-recognition module described in a
    cobalamin-dependent radical SAM methyltransferase and would explain how this family
    selects a single ribose in a folded rRNA domain; if the triad instead ligates rRNA or
    supports the fold, the zinc attribution carried over from earlier work should not be
    propagated to UPF0313 family members.
  resolution: >-
    Quantify zinc and other metals in reconstituted RlmX, and test rRNA binding and
    methylation by the triad mutants separately so that loss of binding can be distinguished
    from loss of catalysis.
