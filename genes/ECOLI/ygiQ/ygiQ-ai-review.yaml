suggested_questions:
- question: >-
    UniProt Q46861 and NCBI Gene 948963 still carry no rlmX gene name and no function,
    although Ishiguro et al. rename ygiQ as rlmX and establish its activity. Can the gene
    name, protein name and function be synchronised, and should the UPF0313 family
    description be updated to a cobalamin-dependent radical SAM rRNA ribose
    C5'-methyltransferase family? Until then the gene symbol used in this repository stays
    ygiQ.
  experts:
  - UniProt curation team
  - Tsutomu Suzuki
- question: >-
    Should GO add a molecular-function term for ribose C5' methylation of RNA, as proposed
    here under GO:0008649, and a matching process term distinguishing ribose backbone
    methylation from 2'-O-methylation and base methylation under GO:0031167?
  experts:
  - GO ontology editors
- question: >-
    Does the RlmX-specific cysteine triad Cys453, Cys458 and Cys464 bind zinc, and is the
    zinc attribution transferable to other UPF0313 members?
  experts:
  - Squire J Booker
  - Kensuke Ishiguro
- question: >-
    Do RlmX homologues in other bacteria and in archaea modify the equivalent
    peptidyl-transferase-centre riboses, and is the hypoxia induction conserved?
  experts:
  - Tsutomu Suzuki
  - Jaanus Remme
suggested_experiments:
- hypothesis: >-
    The RlmX-specific cysteine triad is a zinc site that mediates rRNA binding rather than
    catalysis.
  description: >-
    Quantify zinc, iron and other metals in anaerobically reconstituted wild-type RlmX and
    in the C453A, C458A and C464A variants by ICP-MS, and measure domain V rRNA binding
    (filter binding or MST) and methylation rate separately for each variant, so that a
    binding defect can be distinguished from a catalytic one.
  experiment_type: metal analysis with RNA binding and kinetic assays
- hypothesis: >-
    Flavodoxin and flavodoxin-NADP+ reductase are the physiological reductants of the
    cobalamin cofactor of RlmX.
  description: >-
    Replace methyl viologen in the reconstituted methylation assay with purified E. coli
    flavodoxin, flavodoxin-NADP+ reductase and NADPH, and measure D-5S-m2449 and C-5S-m2498
    formation by RNA-MS; in parallel, quantify the modifications in strains depleted of fldA
    or fpr grown anaerobically.
  experiment_type: anaerobic enzymology with RNA mass spectrometry
- hypothesis: >-
    RlmX activity, rather than rlmX expression, is limited by oxygen through the lability of
