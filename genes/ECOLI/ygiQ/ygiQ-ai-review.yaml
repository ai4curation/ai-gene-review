  label: Escherichia coli K-12
description: >-
  YgiQ is a 739-residue member of the radical S-adenosyl-L-methionine (SAM) superfamily and
  the E. coli representative of the UPF0313 family. It has an N-terminal UPF0313 domain, a
  central radical SAM domain carrying the CxxxCxxC motif (Cys386, Cys390, Cys393) predicted
  to bind a SAM-cleaving [4Fe-4S] cluster, a C-terminal DUF3362 domain and a disordered,
  basic C-terminal tail. No reaction, substrate or cofactor content has been demonstrated
  for the protein, and no phenotype of a ygiQ mutant has been described in work that names
  the gene. In expression compendia ygiQ clusters with genes for ribosomal proteins,
  translation factors and tRNA-associated proteins. A cobalamin-dependent radical SAM
  methyltransferase named RlmX has been reported to methylate the 5'(S) carbon of the
  ribose of two 23S rRNA nucleotides in the peptidyl-transferase centre of E. coli grown
  anaerobically; YgiQ is a plausible candidate for that enzyme on family grounds, but the
  correspondence between rlmX and ygiQ is not confirmed in accessible sources.
