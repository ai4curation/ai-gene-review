id: Q46861
gene_symbol: ygiQ
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  YgiQ, also named RlmX, is a 739-residue cobalamin-dependent radical
  S-adenosyl-L-methionine (SAM) methyltransferase of the UPF0313 family and the enzyme that
  installs a stereoselective methyl group on carbon 5'(S) of the ribose of two 23S rRNA
  residues in the peptidyl-transferase centre of the 50S subunit: dihydrouridine 2449,
  giving D-5S-m2449, and cytidine 2498, giving Cm-5S-m2498 once RlmM has added the 2'-O
  methyl. This is a methylation of the sugar-phosphate backbone at C5' rather than the
  familiar 2'-O-methylation, and is the first RNA ribose modification described outside the
  2' position. The protein combines an N-terminal cobalamin-binding domain, a radical SAM
  domain carrying one [4Fe-4S] cluster ligated by Cys386, Cys390 and Cys393, and a
  C-terminal DUF3362 domain, plus an enzyme-specific surface cysteine triad (Cys453,
  Cys458, Cys464) that is essential for activity and has been attributed to RNA recognition
  through zinc binding. Catalysis consumes two SAM per methyl group transferred: one is
  reductively cleaved by the cluster to the 5'-deoxyadenosyl radical that abstracts the
  5'(S) hydrogen of the target ribose, and the second remethylates cobalamin, which is the
  immediate methyl donor. The enzyme acts on naked 23S rRNA early in 50S assembly, not on
  the mature subunit, and recognises domain V as its minimum efficient substrate. Both
  modifications, together with the RlhA-dependent 5-hydroxycytidine at position 2501, rise
  sharply during anaerobic growth, when RlmX protein levels and activity increase; they
  stabilise the P site and the peptidyl-transferase centre and raise the rate of peptide
  bond formation, so that cells lacking both RlmX and RlhA grow slowly without oxygen.
  Activity requires ferric iron and cobalamin supplied from the medium. RlmX homologues are
  widespread in bacteria and present in some archaea.
