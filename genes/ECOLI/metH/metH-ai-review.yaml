id: P13009
gene_symbol: metH
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: MetH is the cytosolic cobalamin-dependent methionine synthase of Escherichia coli K-12. It
  transfers a methyl group from methyltetrahydrofolate through enzyme-bound cobalamin to zinc-activated
  homocysteine, producing methionine and regenerating tetrahydrofolate. Distinct domains bind homocysteine,
  folate, cobalamin and SAM. Occasional oxidation of the cofactor requires reductive reactivation using
  reduced E. coli flavodoxin and SAM; this partner interaction has biochemical specificity. Activity depends
  on available cobalamin and does not imply endogenous vitamin B12 synthesis.
