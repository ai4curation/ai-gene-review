    label: cobalamin binding
  evidence_type: IDA
  original_reference_id: PMID:2271698
  qualifier: enables
  review:
    summary: MetH binds the cobalamin cofactor that mediates methyl transfer.
    action: ACCEPT
    reason: The bound cofactor cycles between methylcobalamin and cob(I)alamin, and occasional oxidation
      requires reductive remethylation. Accept this central catalytic cofactor-binding function alongside
      the complete reaction; external cobalamin availability is a route condition, not proof of universal
      vitamin supply.
    supported_by:
    - reference_id: PMID:2271698
      supporting_text: The kinetic mechanism of the reaction catalyzed by cobalamin-dependent methionine
        synthase from Escherichia coli K12 has been investigated by both steady-state and pre-steady-state
        kinetic analyses.
    - &id002
      reference_id: PMID:2271698
      supporting_text: Enzyme-bound methylcobalamin then donates its methyl group to homocysteine to generate
        methionine and cob(I)alamin.
