- term:
    id: GO:0008270
    label: zinc ion binding
  evidence_type: IDA
  original_reference_id: PMID:9398304
  qualifier: enables
  review:
    summary: MetH binds catalytic zinc at its homocysteine-activation site.
    action: ACCEPT
    reason: Metal measurements, cysteine substitutions and zinc removal/reconstitution directly establish
      the zinc site. Cobalt within the cobalamin prosthetic group is not treated as evidence of a separate
      free-cobalt-binding function. Zinc activates the homocysteine substrate and is required for this
      catalytic half-reaction, so this precise binding function is core rather than peripheral.
    supported_by:
    - reference_id: PMID:9398304
      supporting_text: both MetH holoenzyme and a truncated MetH(2-649) protein, which lacks a cobalamin
        prosthetic group, contain 0.9 equiv of zinc
    - &id001
      reference_id: PMID:9398304
      supporting_text: Further evidence that zinc is required for catalytic activity comes from experiments
        in which the zinc is removed from MetH(2-1227).
