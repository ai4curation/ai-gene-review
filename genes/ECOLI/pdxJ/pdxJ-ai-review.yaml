id: P0A794
gene_symbol: pdxJ
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  PdxJ is the pyridoxine 5'-phosphate synthase of Escherichia coli (EC 2.6.99.2). This cytoplasmic
  TIM-barrel enzyme catalyses the ring-closing condensation of 3-amino-2-oxopropyl phosphate
  (the PdxA product) with 1-deoxy-D-xylulose 5-phosphate (DXP), releasing phosphate and water
  and forming pyridoxine 5'-phosphate (PNP), the first B6 vitamer of the DXP-dependent de
  novo pyridoxal 5'-phosphate pathway; PdxH then oxidizes PNP to PLP. PdxJ assembles as a
  homooctamer (a tetramer of dimers). pdxJ is the first gene of the two-gene pdxJ-dpj operon
  and pdxJ mutants require vitamin B6.
