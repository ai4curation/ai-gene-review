- term:
    id: GO:0008615
    label: pyridoxine biosynthetic process
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000765245
  - UniProtKB:P0A794
  review:
    summary: PAINT pyridoxine biosynthesis node seeded by this protein.
    action: ACCEPT
    reason: >-
      Seeded by P0A794's own experimental annotation at the Bacteria-level PdxJ node. GO has
      no 'pyridoxine 5'-phosphate biosynthetic process' term; GO:0008615 is the process used
      for the branch that builds the pyridoxine ring, and PdxJ catalyses its final, ring-forming
      step (UniPathway UPA00244 step 5/5). The vitamer formed is PNP rather than free pyridoxine
      (PMID:10225425), so the term is used in its vitamin-B6-branch sense. Same action as
      on PdxA and on P. putida PdxJ.
    supported_by:
    - reference_id: file:interpro/panther/PTHR30456/PTHR30456-paint.tsv
      supporting_text: "PTHR30456\tPTN000765245\tGO:0008615\tP\tIBD\tfalse\tUniProtKB:P0A794"
    - reference_id: PMID:10225425
      supporting_text: >-
        Here we show that incubation of PdxJ with PdxA, 4-(phosphohydroxy)-L-threonine, NAD
        and 1-deoxy-D-xylulose-5-phosphate, but not 1-deoxy-D-xylulose, results in the formation
        of PNP.
