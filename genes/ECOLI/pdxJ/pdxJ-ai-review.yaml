suggested_questions:
- question: >-
    Does PdxJ receive 3-amino-2-oxopropyl phosphate by channelling from PdxA, given that the
    aminoketone is unstable in solution?
- question: >-
    How does the PdxJ G194S variant bypass the requirement for PdxH, and does PdxJ release
    any pyridoxal-level vitamer?
suggested_experiments:
- hypothesis: PdxA and PdxJ form a transient complex that channels AHAP.
  description: >-
    Test PdxA-PdxJ association by crosslinking or native MS, and compare coupled-assay PNP
    formation with and without an AHAP-trapping reagent.
