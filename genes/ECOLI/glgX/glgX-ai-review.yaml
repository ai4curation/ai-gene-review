id: P15067
gene_symbol: glgX
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli (strain K12)
description: GlgX is a cytosolic glycoside hydrolase family 13 glycogen debranching enzyme that hydrolyzes alpha-1,6-linked short branches from glycogen phosphorylase limit dextrin, preferentially releasing maltotriose and maltotetraose branches. It acts during bacterial glycogen mobilization after GlgP has shortened outer linear chains, preventing accumulation of highly branched residual glycogen.
