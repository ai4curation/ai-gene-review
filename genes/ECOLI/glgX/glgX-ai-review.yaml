  full_text_unavailable: true
  findings:
  - statement: Mitomycin-C treatment changes transcript levels for nearly 30 percent of E. coli genes.
    supporting_text: number of genes (nearly 30% of all genes) displayed significant changes in their expression level
  reference_review:
