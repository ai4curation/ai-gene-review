    correctness: VERIFIED
    review_notes: Supports only a broad transcriptome-wide DNA-damage perturbation context; changed glgX expression in this high-coverage array does not establish that GlgX acts in the DNA damage response.
- id: PMID:779849
  title: Purification and properties of a debranching enzyme from Escherichia coli.
  full_text_unavailable: true
  findings:
  - statement: A purified E. coli debranching activity hydrolyzed alpha-1,6 linkages in phosphorylase and beta-amylase limit dextrins.
    supporting_text: The enzyme hydrolyzed 1,6-alpha-glucosidic linkages in phosphorylase and beta-amylase limit dextrins
  - statement: The 1976 enzyme preparation was reported to have very low activity on glycogen and therefore to differ from other bacterial isoamylases.
    supporting_text: differs from the bacterial isoamylases described in other studies because of its inability to hydrolyze glycogen
    finding_review:
      finding_status: DISPUTED
      superseded_by:
      - PMID:15687211
      review_notes: >-
        The pre-cloning preparation is consistent with limit-dextrin hydrolase
        activity but predates assignment of the activity to glgX; the later
        deletion/substrate-specificity study showed that the GlgX gene encodes
        an isoamylase-type debranching enzyme involved in glycogen catabolism.
  reference_review:
    relevance: MEDIUM
    correctness: DISPUTED
    review_notes: >-
      The identifier is correct and the abstract reports limit-dextrin
      alpha-1,6 hydrolysis, but the 1976 purified activity was not assigned to
      glgX and its weak glycogen activity conflicts with the later GlgX deletion
      and substrate-specificity work.
- id: PMID:8576033
  title: Coordinate genetic regulation of glycogen catabolism and biosynthesis in Escherichia coli via the CsrA gene product.
  full_text_unavailable: true
  findings:
  - statement: The glycogen debranching enzyme was assigned to glgX while testing CsrA control of glycogen synthesis and mobilization genes.
    supporting_text: which is now shown to be encoded by the gene glgX
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Supports the glgX gene-to-glycogen-debranching-enzyme assignment, not a direct substrate-specificity assay.
