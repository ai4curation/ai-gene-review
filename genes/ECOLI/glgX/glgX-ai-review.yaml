references:
- id: PMID:15687211
  title: Role of the Escherichia coli glgX gene in glycogen metabolism.
  findings:
  - statement: Defined deletions in glgX showed that GlgX encodes a glycogen debranching enzyme that preferentially hydrolyzes short DP3-DP4 alpha-1,6 branches and functions mainly in glycogen catabolism.
    supporting_text: GlgX protein is predominantly involved in glycogen catabolism by selectively debranching the polysaccharide outer chains
  - statement: E. coli GlgX preferentially hydrolyzes chains of three or four glucose residues.
    supporting_text: debranching enzyme with high specificity for hydrolysis of chains consisting of three or four glucose residues
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Establishes the E. coli glgX deletion phenotype, short-branch substrate preference, and main glycogen-catabolic role.
  full_text_unavailable: true
