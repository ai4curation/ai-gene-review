  label: Escherichia coli K-12
description: >-
  gloA (b1651) of Escherichia coli K-12 encodes glyoxalase I (lactoylglutathione lyase, EC 4.4.1.5), a
  135-residue homodimeric enzyme of the Ni2+-activated glyoxalase I class. It is inactive with Zn2+, the
  metal of the human and yeast enzymes, and is maximally active with Ni2+, with metal bound between the
  subunits. It isomerises the hemithioacetal formed spontaneously from methylglyoxal and glutathione to
  (R)-S-lactoylglutathione, which GloB (or the accessory GloC) hydrolyses to D-lactate and glutathione.
  Deletion makes cells more sensitive to methylglyoxal and to hypochlorous acid.
