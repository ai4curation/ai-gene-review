- term:
    id: GO:0051536
    label: iron-sulfur cluster binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR009051
  review:
    summary: >-
      Iron-sulfur cluster binding from the helical ferredoxin-like domain
      signature.
    action: MODIFY
    reason: >-
      Correct but general. GlcF carries two 4Fe-4S ferredoxin-type domains
      with the full complement of eight cluster-ligating cysteines (PROSITE
      PRU00711), and its similarity to iron-sulfur proteins was noted when
      the gene was identified. The specific descendant GO:0051539 4 iron,
      4 sulfur cluster binding is warranted. The CCG domains may bind
      additional, non-cubane clusters, which the general term would also
      cover; no cluster has been characterized spectroscopically in GlcF.
    proposed_replacement_terms:
    - id: GO:0051539
      label: 4 iron, 4 sulfur cluster binding
    supported_by:
