proposed_new_terms: []
suggested_questions:
- question: >-
    Does GlcF anchor GlcDEF to the membrane and transfer electrons to the
    quinone pool, and what clusters do its CCG domains bind?
- question: >-
    The GO:0009339 glycolate oxidase complex definition describes an FMN,
    O2-dependent, cytoplasmic enzyme while citing the E. coli GlcDEF papers;
    should it be revised to describe the FAD/Fe-S, membrane-associated
    glycolate dehydrogenase (EC 1.1.99.14)?
suggested_experiments:
- experiment_type: EPR spectroscopy and quinone reductase assays
  description: >-
    Characterize the iron-sulfur clusters of purified GlcF/GlcDEF by EPR and
    iron/sulfide analysis, and test glycolate-dependent reduction of
    ubiquinone and menaquinone analogues in membranes from wild-type and
    glcF mutant strains.
