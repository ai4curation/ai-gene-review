id: P52074
gene_symbol: glcF
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  GlcF is the iron-sulfur subunit of the heterotrimeric, membrane-associated
  glycolate dehydrogenase GlcDEF (historically called glycolate oxidase or
  glycolate oxidoreductase), which oxidizes glycolate to glyoxylate as the
  first committed step of glycolate utilization. GlcF has an N-terminal
  domain with two 4Fe-4S ferredoxin-type cluster-binding motifs and two
  C-terminal cysteine-rich CCG domains, an architecture shared with other
  membrane-associated electron-transfer subunits such as GlpC of anaerobic
  glycerol-3-phosphate dehydrogenase. It is presumed to accept electrons
  from the FAD-containing catalytic subunit GlcD and to pass them toward the
  respiratory chain; the enzyme does not react with O2 directly and the
  physiological acceptor is unknown. GlcF is found only in the membrane
  fraction, and its loss abolishes glycolate oxidase activity and growth on
  glycolate as sole carbon source. The complex also oxidizes D-lactate in
  vitro.
