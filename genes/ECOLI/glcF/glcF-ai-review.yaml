      record_section: ["CC:COFACTOR"]
      supporting_text: Note=Binds 2 [4Fe-4S] clusters. {ECO:0000255|PROSITE-ProRule:PRU00711};
    - reference_id: PMID:8606183
      supporting_text: the one from glcF was found to be similar to iron-sulfur proteins
