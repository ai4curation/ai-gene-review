- term:
    id: GO:0033232
    label: ABC-type D-methionine transporter activity
  evidence_type: EXP
  original_reference_id: PMID:12169620
  qualifier: enables
  review:
    summary: metD (metNIQ) is the D-methionine uptake locus; a genuine but secondary substrate.
    action: KEEP_AS_NON_CORE
    reason: >-
      The metD locus, defined genetically by D-methionine utilisation, is the
      metNIQ cluster, so MetNIQ does import D-methionine. L-methionine is the
      high-affinity physiological substrate and D-methionine is transported
      as part of the system's broader specificity, so the D-specific term is
      kept as non-core. MetN contributes the ATPase to this complex activity.
    supported_by:
    - reference_id: PMID:12169620
      supporting_text: The metD D-methionine transporter locus of Escherichia coli was identified as the abc-yaeE-yaeC cluster
