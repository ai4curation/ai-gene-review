id: P30750
gene_symbol: metN
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  MetN is the nucleotide-binding (ATPase) subunit of MetNIQ (MetD), the
  high-affinity ATP-binding cassette importer for methionine in Escherichia
  coli. Two MetN subunits sit on the cytoplasmic face of the inner membrane
  bound to a dimer of the transmembrane permease MetI, with the periplasmic
  binding protein MetQ delivering substrate. MetN hydrolyses ATP to power
  uptake of L-methionine with high affinity and of D-methionine and other
  methionine derivatives with broader specificity. Besides its ABC
  nucleotide-binding domain, MetN carries a C-terminal regulatory (C2,
  ferredoxin-like, NIL/ACT-like) domain. The C2 domains dimerise and bind
  intracellular L-methionine, stabilising an inward-facing, ATPase-inactive
  state of the transporter (transinhibition). Expression of metNIQ is
  repressed by MetJ as part of the methionine regulon.
