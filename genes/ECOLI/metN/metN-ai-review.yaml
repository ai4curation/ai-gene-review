- term:
    id: GO:0015191
    label: L-methionine transmembrane transporter activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN000657052
  - UniProtKB:P30750
  review:
    summary: L-methionine transport by the MetNIQ complex; MetN contributes the ATPase.
    action: ACCEPT
    reason: >-
      The MetN-clade node is grounded on E. coli MetN itself. L-methionine is
      the high-affinity physiological substrate of MetNIQ. The transport
      activity belongs to the assembled MetNIQ complex; MetN energises it but
      does not translocate substrate alone, so the precise relation for MetN is
      contributes_to, as recorded in core_functions. No ABC-type L-methionine
      transporter term exists (GO:0033232 is D-methionine only), so this is
      the most specific available L-methionine term.
    source_defects:
    - defect_type: WRONG_QUALIFIER
      resource: GO_CENTRAL
      slot: qualifier
      requested_change: CHECK
      asserted_value: enables
      corrected_value: contributes_to
      cause: OTHER
      confidence: SUSPECTED
      explanation: >-
        Transporter activity of an ABC importer is a complex activity; the
        nucleotide-binding subunit MetN contributes ATP hydrolysis but neither
        binds nor translocates methionine in the transport sense. The
        qualifier for the NBD would strictly be contributes_to. Many GOA ABC
        NBD rows use enables, so this is recorded as a query about practice,
        not an error claim.
