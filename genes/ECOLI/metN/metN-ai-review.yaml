core_functions:
- description: >-
    ATP hydrolysis by the nucleotide-binding subunit of the MetNIQ ABC importer,
    energising high-affinity uptake of L-methionine (and, with broader
    specificity, D-methionine) across the inner membrane; MetN contributes to,
    but does not alone carry out, the complex's transporter activity.
  molecular_function:
    id: GO:0016887
    label: ATP hydrolysis activity
  contributes_to_molecular_function:
    id: GO:0015191
    label: L-methionine transmembrane transporter activity
  directly_involved_in:
  - id: GO:1903692
    label: methionine import across plasma membrane
  locations:
  - id: GO:0005886
    label: plasma membrane
  in_complex:
    id: GO:1990197
    label: methionine-importing ABC transporter complex
  supported_by:
  - reference_id: PMID:18621668
    supporting_text: two copies of the adenosine triphosphatase (ATPase) MetN in complex with two copies of the transmembrane domain MetI
  - reference_id: PMID:30352853
    supporting_text: exhibits both high-affinity transport toward l-methionine and broad specificity toward methionine derivatives, including d-methionine
  - reference_id: file:ECOLI/metN/metN-uniprot.txt
    record_section: ["CC:FUNCTION"]
    supporting_text: Responsible for energy coupling to the transport system
proposed_new_terms:
- proposed_name: ABC-type L-methionine transporter activity
  proposed_definition: >-
    Enables the transfer of a solute or solutes from one side of a membrane to
    the other according to the reaction: ATP + H2O + L-methionine(out) = ADP +
    phosphate + L-methionine(in).
  justification: >-
    RHEA:29779 (the MetNIQ L-methionine reaction) has no matching GO term; the
    only ABC-type methionine term, GO:0033232, is D-methionine-specific, so
    L-methionine import by MetNIQ can only be expressed by combining
    GO:0015191 with GO:0042626. A sibling of GO:0033232 under GO:0015424 and
    GO:0015191 (or a generic ABC-type methionine transporter parent, RHEA:32827)
    would fill the gap.
  proposed_parent:
    id: GO:0015191
    label: L-methionine transmembrane transporter activity
  supported_by:
  - reference_id: PMID:12819857
    supporting_text: An ABC-type transporter in Escherichia coli that transports both L- and D-methionine
suggested_questions:
- question: >-
    Should GOA rows assigning substrate-specific ABC transporter activities to
    the nucleotide-binding subunit (MetN) use contributes_to rather than
    enables, given that the subunit alone neither binds nor translocates the
    substrate?
