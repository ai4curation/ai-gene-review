id: P0AG16
gene_symbol: purF
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: 'PurF is the glutamine phosphoribosylpyrophosphate (PRPP) amidotransferase of Escherichia
  coli, a cytosolic homotetramer that catalyses the committed first step of de novo IMP biosynthesis:
  transfer of the glutamine amide nitrogen, generated in an N-terminal Ntn glutaminase domain with an
  N-terminal cysteine nucleophile, through an ammonia channel to PRPP in a C-terminal phosphoribosyltransferase
  domain, giving 5-phosphoribosylamine. It is feedback-inhibited by AMP and GMP and is also inhibited
  by the stringent-response alarmone ppGpp.'
