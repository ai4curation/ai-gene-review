taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  SerB is the phosphoserine phosphatase (EC 3.1.3.3) of Escherichia coli, a cytoplasmic,
  Mg2+-dependent member of the HAD-like hydrolase superfamily (SerB family, subfamily IB). It
  catalyses the last step of the phosphorylated pathway of L-serine biosynthesis, the hydrolysis
  of O-phospho-L-serine to L-serine and phosphate, using an active-site aspartate nucleophile
  that forms a phosphoenzyme intermediate. Purified SerB has high affinity for phosphoserine and
  also hydrolyses phosphothreonine, D-phosphoserine and small phosphodonors in vitro.
