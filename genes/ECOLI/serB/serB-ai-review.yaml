suggested_questions:
- question: >-
    Do the in vitro secondary substrates of SerB (phosphothreonine, D-phosphoserine, acetyl
    phosphate) contribute to any physiological dephosphorylation in E. coli?
suggested_experiments:
- description: >-
    Metabolomic comparison of serB-null and catalytically dead SerB (D-to-N nucleophile)
    strains grown with serine supplementation, to detect accumulation of non-phosphoserine
    substrates.
