id: P0AFD1
gene_symbol: nuoE
product_type: PROTEIN
status: INITIALIZED
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  NuoE is the small (166-residue) [2Fe-2S] subunit of the proton-pumping
  NADH:quinone oxidoreductase NDH-1 (respiratory complex I), the bacterial
  counterpart of the mitochondrial 24 kDa subunit NDUFV2 (Nqo2 in Thermus and
  Paracoccus). It has a thioredoxin-like fold and binds one binuclear iron-sulfur
  cluster, N1a, through four conserved cysteines. Together with the NADH- and
  FMN-binding subunit NuoF and the multi-cluster subunit NuoG it forms the soluble
  NADH dehydrogenase fragment (N module) at the distal tip of the peripheral arm,
  which is attached through NuoB and the fused NuoCD to the membrane arm in the
  cytoplasmic membrane. Cluster N1a sits within electron-transfer distance of the
  FMN on the side opposite the main iron-sulfur wire; it is reduced rapidly by
  NADH via the flavin but lies on a side path rather than on the route that
  carries electrons to the quinone site, and has been proposed to limit reactive
  oxygen species production at the flavin. NuoE is required for assembly and
  stability of the N module (loss of its cluster also depletes cluster N1b on
  NuoG) and therefore for NADH:quinone oxidoreduction coupled to proton
  translocation by the whole complex during aerobic and anaerobic respiration.
