    label: FMN binding
  evidence_type: IDA
  original_reference_id: PMID:7607227
  qualifier: contributes_to
  review:
    summary: >-
      The isolated complex and its three-subunit NADH dehydrogenase fragment contain
      one non-covalently bound FMN.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The abstract assigns the FMN to only one of the three N-module subunits ("one
      of them bearing FMN"), and that subunit is NuoF: E95 of NuoF tunes the FMN
      midpoint potential (PMID:19061856) and in the Thermus peripheral-arm structure
      the flavin sits in Nqo1 (the NuoF orthologue), with the NuoE-orthologue cluster
      N1a merely within electron-transfer distance (PMID:16469879). NuoE contributes
      no FMN ligands, so even a contributes_to FMN binding claim overstates its role.
      Not removed, because the curator read the full text and the subunit packs
      against the flavin-binding subunit.
    supported_by:
    - reference_id: PMID:7607227
      supporting_text: composed of three subunits bearing at least four iron-sulfur
        clusters (N1b, N1c, N3 and N4) that can be reduced with NADH, one of them
        bearing FMN
    - reference_id: PMID:19061856
      supporting_text: Replacement of glutamate 95 for glutamine in the NADH- and
        FMN-binding NuoF subunit of E. coli Complex I
