core_functions:
- description: >-
    Small [2Fe-2S] (cluster N1a) subunit of the NADH dehydrogenase (N) module of
    NDH-1. Its cluster exchanges electrons with the reduced FMN of NuoF, and the
    subunit is required for assembly and stability of the NADH-oxidising module, so
    it contributes to proton-translocating NADH:quinone oxidoreduction by the
    complex at the cytoplasmic membrane.
  molecular_function:
    id: GO:0009055
    label: electron transfer activity
  contributes_to_molecular_function:
    id: GO:0008137
    label: NADH dehydrogenase (ubiquinone) activity
  directly_involved_in:
  - id: GO:0022904
    label: respiratory electron transport chain
  locations:
  - id: GO:0005886
    label: plasma membrane
  in_complex:
    id: GO:0045271
    label: respiratory chain complex I
  supported_by:
  - reference_id: PMID:18316732
    supporting_text: The major part of N1a undergoes very fast reduction with a time
      constant
  - reference_id: PMID:15922336
    supporting_text: These clusters were assigned to clusters N3 and N1a,
      respectively.
  - reference_id: PMID:22063474
    supporting_text: Mutants, in which each of the nuo-genes was individually disrupted
      by the insertion of a resistance cartridge were unable to assemble a functional
      complex I.
suggested_questions:
- question: >-
    What is the physiological role of the off-pathway cluster N1a on NuoE: an
    electron sink that limits superoxide or hydrogen peroxide production by the
    reduced flavin, a reservoir that buffers the two-electron to one-electron
    transition at FMN, or principally a structural element needed to stabilise the N
    module (and cluster N1b on NuoG)?
- question: >-
    Is the much higher midpoint potential of N1a in E. coli than in the bovine
    enzyme functionally significant for ROS suppression or for turnover under
    menaquinone-reducing (anaerobic) conditions?
suggested_experiments:
- description: >-
    Compare superoxide and hydrogen peroxide production by purified wild-type and
    N1a-ligand-variant E. coli complex I (e.g. the purifiable C97A variant) under
    matched NADH:decylubiquinone turnover, to test the antioxidant hypothesis for
    N1a.
  experiment_type: biochemical
- description: >-
    Time-resolved EPR/optical kinetics of NuoE ligand variants that retain an
    altered N1a, to determine whether N1a redox state changes the rate of FMN
    reoxidation or N3 reduction.
  experiment_type: biophysical
