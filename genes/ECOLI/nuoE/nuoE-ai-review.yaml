- term:
    id: GO:0003954
    label: NADH dehydrogenase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: contributes_to
  supporting_entities:
  - PANTHER:PTN000042735
  - UniProtKB:P0AFD1
  - UniProtKB:P19404
  review:
    summary: >-
      Phylogenetic contributes_to assertion of NADH dehydrogenase activity, placed by
      PAINT at the root node of the 24 kDa subunit family (PTN000042735) and seeded
      by E. coli NuoE and human NDUFV2.
    action: ACCEPT
    reason: >-
      NuoE has no NADH- or FMN-binding site of its own (both are on NuoF), so it does
      not enable NADH oxidation independently, but it is an obligate component of
      the NADH dehydrogenase fragment (NuoE, NuoF, NuoG) that carries out the
      NADH:acceptor half-reaction, and its N1a cluster is reduced by NADH through the
      flavin within microseconds. The PAINT contributes_to qualifier expresses
      exactly that weaker claim. GO:0003954 (acceptor unspecified) is the right term
      for the N-module activity, which is measurable with artificial acceptors such
      as ferricyanide independently of quinone; the quinone-specific complex activity
      is captured separately by the GO:0008137 row. E. coli NuoE appearing in its own
      WITH/FROM list reflects its own experimental annotation (PMID:3122832), not
      circularity.
    supported_by:
    - reference_id: PMID:7607227
      supporting_text: One of these fragments is a water-soluble NADH dehydrogenase
        fragment which is composed of three subunits bearing at least four iron-sulfur
        clusters (N1b, N1c, N3 and N4) that can be reduced with NADH, one of them
        bearing FMN.
    - reference_id: PMID:18316732
      supporting_text: The major part of N1a undergoes very fast reduction with a
        time constant
