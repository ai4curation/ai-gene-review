- term:
    id: GO:0008137
    label: NADH dehydrogenase (ubiquinone) activity
  evidence_type: IDA
  original_reference_id: PMID:10587449
  qualifier: contributes_to
  review:
    summary: >-
      Purified, overproduced E. coli complex I containing all subunits and cofactors
      catalyses inhibitor-sensitive NADH:ubiquinone oxidoreduction.
    action: ACCEPT
    reason: >-
      The NADH:ubiquinone (proton-translocating) reaction is a property of the
      assembled NDH-1, to which NuoE contributes as an obligate subunit; individual
      disruption of any nuo gene abolishes complex I activity (PMID:22063474).
      contributes_to is the correct relationship. In E. coli the physiological
      acceptors include ubiquinone-8 and, under anaerobic conditions, menaquinone-8;
      the ubiquinone-named term describes the measured activity.
    supported_by:
    - reference_id: PMID:10587449
      supporting_text: The preparation comprises all subunits and known cofactors and
        exhibits a high enzymatic activity and inhibitor sensitivity.
    - reference_id: PMID:22063474
      supporting_text: Each disruption resulted in the loss of complex I-mediated
        activity and the failure to extract a structurally intact complex.
- term:
