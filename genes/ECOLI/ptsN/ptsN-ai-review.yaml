- term:
    id: GO:0008982
    label: protein-N(PI)-phosphohistidine-carbohydrate phosphotransferase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR006320
  review:
    summary: IIA(Ntr) has no sugar-transporting EII partner and does not phosphorylate sugar.
    action: REMOVE
    reason: GO:0008982 is a PEP-dependent sugar transport activity of EII complexes. IIA(Ntr) is the terminal
      phosphoacceptor of a regulatory chain parallel to the transport PTS; its outputs are protein-protein
      regulation of TrkA and KdpD.
    supported_by:
    - reference_id: PMID:19400808
      supporting_text: Proteins EI(Ntr), NPr and IIA(Ntr) form a phosphoryl group transfer chain (Ntr-PTS)
        working in parallel to the phosphoenolpyruvate:carbohydrate phosphotransferase system (transport-PTS)
        in Escherichia coli.
    source_defects:
    - defect_type: WRONG_TERM
      resource: OTHER
      requested_change: DELETE_ROW
      confidence: CONFIRMED
      explanation: InterPro2GO maps IPR006320 (PTS_Nitro_regul, PTS IIA-like nitrogen-regulatory protein
        PtsN) to a sugar-PTS term. IPR006320 is the entry for the regulatory EIIA(Ntr) family, whose members
        act in a phosphorelay parallel to the transport PTS and have no EIIB/EIIC partner, so the mapping
        is wrong for every member of the entry and should be removed (InterPro2GO).
      asserted_value: GO:0008982
