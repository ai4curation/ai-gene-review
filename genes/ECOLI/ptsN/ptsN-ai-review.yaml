- term:
    id: GO:1901379
    label: regulation of potassium ion transmembrane transport
  evidence_type: IMP
  original_reference_id: PMID:17289841
  qualifier: involved_in
  review:
    summary: IIA(Ntr) limits K+ accumulation by inhibiting TrkA and modulates KdpFABC expression through
      KdpD.
    action: NEW
    reason: The TrkA paper shows that loss of ptsN raises intracellular K+ and that dephosphorylated IIA(Ntr)
      binds TrkA to inhibit K+ accumulation; IIA(Ntr) itself performs the regulatory step by binding the
      transporter subunit, so this is participation, not mere necessity.
    supported_by:
    - reference_id: PMID:17289841
      supporting_text: We demonstrate that dephosphorylated EIIA(Ntr), but not its phosphorylated form,
        forms a tight complex with TrkA that inhibits the accumulation of high intracellular concentrations
        of K(+).
- term:
    id: GO:0035556
    label: intracellular signal transduction
  evidence_type: IDA
  original_reference_id: PMID:19400808
  qualifier: involved_in
  review:
    summary: IIA(Ntr) is the output stage of the PTS(Ntr) phosphorelay, translating its phosphorylation
      state into KdpD and TrkA regulation.
    action: NEW
    reason: The phosphorylation state of IIA(Ntr), set by the upstream EI(Ntr)-NPr chain and by carbon
      source, determines whether it binds and activates KdpD; IIA(Ntr) performs the signal-relaying step
      itself (receiving phosphate and engaging the target), which is participation in intracellular signal
      transduction.
    supported_by:
    - reference_id: PMID:19400808
      supporting_text: Expression is enhanced, when cells utilize preferred carbohydrates like glucose,
        which results in preferential dephosphorylation of the transport-PTS and also of IIA(Ntr).
    - reference_id: PMID:19400808
      supporting_text: The data suggest that exclusively dephosphorylated IIA(Ntr) binds and activates
        KdpD.
