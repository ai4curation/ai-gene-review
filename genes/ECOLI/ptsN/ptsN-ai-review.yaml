id: P69829
gene_symbol: ptsN
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: PtsN (enzyme IIA-Ntr) is the cytosolic terminal phosphoacceptor and regulatory effector of
  the E. coli PtsP–NPr phosphorelay. Its phosphorylation state controls interactions with potassium-homeostasis
  proteins. The unphosphorylated form inhibits Trk-mediated potassium uptake through interaction with
  TrkA, stimulates the sensor kinase KdpD, and inhibits the potassium/proton antiporter YcgO. These partner-specific
  effects connect metabolic input signals to potassium handling; PtsN is not itself a sugar permease or
  a KdpD-like kinase.
