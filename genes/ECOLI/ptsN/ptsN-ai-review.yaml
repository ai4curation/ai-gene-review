- term:
    id: GO:0008982
    label: protein-N(PI)-phosphohistidine-carbohydrate phosphotransferase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR006320
  review:
    summary: Remove the coupled transmembrane carbohydrate activity from the soluble Ntr effector.
    action: REMOVE
    reason: 'GO:0008982 denotes coupled carbohydrate transmembrane transport and phosphorylation. The
      characterized PtsN role is protein phosphotransfer and regulatory interaction, not a permease-associated
      sugar-transporter activity. Purified exchange with PTS proteins does not establish this complete
      activity. The domain-to-transporter mapping is wrong for this effector. The action discriminator
      is target evidence, not species labels or donor count: P. putida has a native sugar-independent
      route and a documented failure of PtsN to replace fructose EIIA; Caulobacter separates its Ntr effectors
      from sugar permeases and its mannose assignments originate in an incorrect transporter EC mapping.
      E. coli has measured cross-system phosphate exchange in vitro but lacks demonstrated native sugar-uptake
      participation for the Ntr branch, so physiological process assignment is over-annotation rather
      than an absolute negative. Bona fide E. coli/Bacillus HPr controls retain the sugar process because
      they feed sugar-specific EIIA proteins in the native carbohydrate route; common ancestry at PTN002135312
      does not erase this functional divergence.'
    supported_by:
    - reference_id: PMID:7876255
      supporting_text: 'Purified IIANtr and NPr exchange phosphate appropriately with Enzyme I, HPr, and
        Enzyme IIA proteins of the phosphoenolpyruvate: sugar phosphotransferase system.'
    - reference_id: PMID:41870250
      supporting_text: Instead of a sugar substrate, the PTSNtr appears to carry out its regulatory roles
        through protein-protein interactions that primarily involve PtsN, although relatively few PtsN
        protein targets have been characterized.
    - reference_id: PMID:17289841
      supporting_text: dephosphorylated EIIA Ntr interacts with TrkA, resulting in the inhibition of Trk-mediated
        K + uptake.
