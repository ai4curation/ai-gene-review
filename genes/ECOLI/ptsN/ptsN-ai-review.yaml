  review:
    summary: Dephosphorylated IIA(Ntr) inhibits the TrkA potassium transporter subunit.
    action: MODIFY
    reason: The activity is real but TrkA is the NAD-binding regulatory subunit of the Trk K+ uptake system,
      not an enzyme; GO:0004857 is defined as reducing a catalytic activity. Transporter inhibitor activity
      (GO:0141110, "Binds to and stops, prevents, or reduces the activity of a transporter.") describes
      the IIA(Ntr)-TrkA effect.
