id: P69829
gene_symbol: ptsN
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: PtsN (EIIA(Ntr)) is the terminal, regulatory protein of the nitrogen-regulatory phosphotransferase
  system (PTS(Ntr)) of Escherichia coli, a soluble EIIA type-2 domain protein encoded in the rpoN operon.
  It receives phosphate on His73 from NPr (PtsO), which is phosphorylated by enzyme I(Ntr) (PtsP); the
  chain transports no sugar. Dephosphorylated PtsN binds and inhibits TrkA, limiting K+ accumulation,
  and binds and stimulates the KdpD sensor kinase, raising expression of the KdpFABC K+ transporter; through
  these interactions the PTS(Ntr) links potassium homeostasis to carbon and nitrogen status.
