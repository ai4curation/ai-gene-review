  review:
    summary: In-vitro phosphate exchange does not establish a native sugar-uptake process.
    action: MARK_AS_OVER_ANNOTATED
    reason: Domain ancestry and in-vitro exchange with carbohydrate proteins are real, but do not alone
      demonstrate native coupled sugar uptake by the Ntr effector. PtsN regulates other proteins, including
      potassium transporters and KdpD. A physiological sugar-transport contribution cannot be established
