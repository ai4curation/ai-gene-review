id: P0ADC3
gene_symbol: lolC
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  lolC encodes one of the two integral-membrane subunits of the essential
  Escherichia coli LolCDE complex, a type VII ABC-superfamily machine that
  extracts mature outer-membrane-destined lipoproteins from the outer leaflet of
  the inner membrane and hands them to the periplasmic carrier LolA. LolC has
  four transmembrane segments and a large periplasmic domain whose Hook and Pad
  elements recruit LolA and prime it to receive cargo; its partner subunit LolE
  binds the lipoprotein, and two copies of the ATPase LolD power release.
  LolCDE does not transport its substrate across the membrane.
