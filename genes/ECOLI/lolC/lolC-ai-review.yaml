suggested_questions:
- question: >-
    Is LolC dispensable for release in vivo under any condition, given that
    LolD-LolE alone reconstitutes release activity in vitro?
suggested_experiments:
- description: >-
    Compare release kinetics and LolA loading of LolCDE and LolDE
    proteoliposomes, and test whether LolC Hook/Pad mutants are rescued by
    excess LolA.
