    id: GO:0009331
    label: glycerol-3-phosphate dehydrogenase (FAD) complex
  evidence_type: IDA
  original_reference_id: PMID:18296637
  qualifier: part_of
  review:
    summary: >-
      Crystal structures of full-length, active E. coli GlpD show a
      physiological homodimer, and GO defines this complex term to include the
      aerobic GlpD homodimer.
    action: ACCEPT
    reason: >-
      GO:0009331 is defined as "An enzyme complex that catalyzes the oxidation
      of sn-glycerol 3-phosphate to dihydroxyacetone phosphate, with concurrent
      reduction of flavin adenine dinucleotide (FAD) to FADH2. In E. coli, the
      complex is either a GlpA-GlpB-GlpC heterotrimer that functions in
      anaerobic conditions, or a GlpD homodimer that functions in aerobic
      conditions." The structures contain GlpD dimers with a buried interface
      of about 1,600 Å2, well above the homodimer threshold. The active site is
      formed partly at the dimer interface. The term therefore applies to P13035
      as written; it does not imply GlpB/GlpC partners. The same term is
      accepted for the P. putida ortholog.
    supported_by:
    - reference_id: PMID:18296637
      supporting_text: >-
