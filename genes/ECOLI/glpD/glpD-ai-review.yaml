id: P13035
gene_symbol: glpD
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  glpD encodes the FAD-dependent aerobic sn-glycerol-3-phosphate dehydrogenase of Escherichia coli K-12.
  The enzyme is a monotopic homodimer that embeds into the cytoplasmic face of the inner membrane. It
  oxidizes sn-glycerol 3-phosphate to dihydroxyacetone phosphate and transfers electrons through FAD to
  the respiratory ubiquinone pool, with a hydrophobic plateau next to the active site serving as the likely
  quinone-docking surface. A soluble pool also exists, but full activity requires its membrane environment
  or suitable lipids/detergent in vitro. GlpD performs the final oxidation in the GlpF/GlpK/GlpD glycerol
  catabolic route under aerobic conditions and can feed nitrate respiration during anaerobic growth. The
  separate GlpABC dehydrogenase is the fumarate-coupled anaerobic glycerol-3-phosphate dehydrogenase.
  The small membrane protein AzuC binds GlpD and promotes its membrane association and activity.
