core_functions:
- description: >-
    FAD-dependent sn-glycerol-3-phosphate:quinone dehydrogenase activity. As a
    monotopic homodimer on the cytoplasmic membrane, GlpD oxidizes
    sn-glycerol 3-phosphate to dihydroxyacetone phosphate in the aerobic
    glycerol degradation route and reduces the respiratory ubiquinone pool.
  molecular_function:
    id: GO:0004368
    label: glycerol-3-phosphate dehydrogenase (quinone) activity
  directly_involved_in:
  - id: GO:0046168
    label: glycerol-3-phosphate catabolic process
  - id: GO:0019563
    label: glycerol catabolic process
  locations:
  - id: GO:0005886
    label: plasma membrane
  in_complex:
    id: GO:0009331
    label: glycerol-3-phosphate dehydrogenase (FAD) complex
  supported_by:
  - reference_id: PMID:18296637
    supporting_text: >-
      GlpD catalyzes the oxidation of G3P to dihydroxyacetone phosphate
      (DHAP), with concurrent reduction of flavin adenine dinucleotide (FAD)
      to FADH 2 , and passes electrons on to ubiquinone (UQ) and ultimately to
      oxygen or nitrate
  - reference_id: PMID:18296637
    supporting_text: >-
      GlpD is localized to the cytoplasmic membrane in E. coli and may
      constitute as much as 10% of the inner membrane proteins in constitutive
      strains, exhibiting membrane-dependency for activity
  - reference_id: PMID:340460
    supporting_text: >-
      A simple purification for the membrane-associated, flavin-linked,
      glycerol-3-phosphate dehydrogenase of Escherichia coli has been
      developed which yields homogeneous enzyme in a detergent-solubilized
      state.
  - reference_id: file:ECOLI/glpD/glpD-uniprot.txt
    record_section:
    - CC:PATHWAY
    supporting_text: >-
      PATHWAY: Polyol metabolism; glycerol degradation via glycerol kinase
      pathway; glycerone phosphate from sn-glycerol 3-phosphate (aerobic
      route): step 1/1.
