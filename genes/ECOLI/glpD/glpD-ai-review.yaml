- term:
    id: GO:0046168
    label: glycerol-3-phosphate catabolic process
  evidence_type: IMP
  original_reference_id: PMID:5321485
  qualifier: involved_in
  review:
    summary: >-
      Genetic loss of the glycerol-3-phosphate dehydrogenase step blocks
      growth on glycerol or glycerol-3-phosphate and lets the intermediate
      accumulate.
    action: ACCEPT
    reason: >-
      The mutant physiology supports assigning GlpD to glycerol-3-phosphate
      catabolism. Cells unable to carry out the dehydrogenase step could not use
      intracellular L-alpha-glycerophosphate, the GlpD substrate. GlpD is the
      catalyst of this breakdown step, so the IMP necessity evidence is
      consistent with direct participation.
    supported_by:
    - reference_id: PMID:5321485
      supporting_text: >-
        intracellular l-alpha-glycerophosphate is an intermediate whose further
        metabolism depends upon a dehydrogenase. When this enzyme is lost by
        mutation, the cells not only fail to grow on glycerol or
        l-alpha-glycerophosphate
