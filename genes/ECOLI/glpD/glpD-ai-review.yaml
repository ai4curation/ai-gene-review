suggested_questions:
- question: Can UniProt add the experimentally supported monotopic inner-membrane location alongside
    the genuine soluble cytoplasmic pool, distinguishing the primary active site from reversible
    redistribution?
suggested_experiments:
- hypothesis: >-
    AzuC raises GlpD activity by shifting GlpD from its soluble pool to the
    inner membrane, rather than by changing its catalytic constants.
  description: >-
    Measure GlpD kinetics with ubiquinone analogues in membrane vesicles and in
    the soluble fraction from wild-type, azuCR-deleted and AzuC-overexpressing
    cells. Quantify the membrane-bound and soluble GlpD fractions by
    fractionation and immunoblotting.
  experiment_type: biochemical fractionation and enzyme kinetics
