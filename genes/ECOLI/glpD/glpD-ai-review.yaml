- term:
    id: GO:0019563
    label: glycerol catabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000041
  qualifier: involved_in
  supporting_entities:
  - UniPathway:UPA00618
  review:
    summary: >-
      UniPathway mapping (GO_REF:0000041, UPA00618 glycerol degradation via
