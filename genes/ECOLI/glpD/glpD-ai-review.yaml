taxon:
  id: NCBITaxon:83333
  label: Escherichia coli (strain K12)
description: >-
  glpD encodes the FAD-dependent aerobic sn-glycerol-3-phosphate
  dehydrogenase of Escherichia coli K-12. The enzyme is a monotopic homodimer
  associated with the cytoplasmic membrane, oxidizes sn-glycerol 3-phosphate
  to dihydroxyacetone phosphate, and transfers electrons through FAD to the
  respiratory quinone pool. GlpD performs the final oxidation in the
  GlpF/GlpK/GlpD glycerol catabolic route under aerobic conditions and can
  feed nitrate respiration during anaerobic growth, whereas the separate
  GlpABC dehydrogenase is the fumarate-coupled anaerobic glycerol-3-phosphate
  dehydrogenase system.
