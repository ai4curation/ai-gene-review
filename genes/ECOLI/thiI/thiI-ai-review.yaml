- term:
    id: GO:0097163
    label: sulfur carrier activity
  evidence_type: IDA
  original_reference_id: PMID:10753862
  qualifier: enables
  review:
    summary: The Cys456 persulfide is a catalytic intermediate of the sulfurtransferase, not a carrier function.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      ThiI does covalently hold the sulfur as a persulfide before passing it to tRNA,
      which matches the wording of the definition. But that persulfide is the
      sulfurtransferase's own catalytic intermediate, as in rhodanese, and the sulfur
      goes onto tRNA in the same catalytic cycle. Carrier activity describes proteins
      such as ThiS and TusA that shuttle sulfur between enzymes. The activity is
      captured by GO:0140741.
    supported_by:
    - reference_id: PMID:10722656
      supporting_text: Cys-456 of ThiI aligns with the active site cysteine residue of rhodanese that transiently forms a persulfide during catalysis
