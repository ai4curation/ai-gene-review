core_functions:
- description: >-
    ATP-dependent tRNA-uracil-4 sulfurtransferase. It adenylates U8 and transfers
    IscS-derived persulfide sulfur via Cys456 to make 4-thiouridine at position 8 of
    tRNA.
  molecular_function:
    id: GO:0140741
    label: tRNA-uracil-4 sulfurtransferase activity
  directly_involved_in:
  - id: GO:0002937
    label: tRNA 4-thiouridine biosynthesis
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:15037613
    supporting_text: IscS catalyzes sulfur transfer from l-cysteine to ThiI, which utilizes Mg-ATP to activate uridine 8 in tRNA and transfers sulfur to give s4U
  - reference_id: PMID:9592144
    supporting_text: A gene involved in the conversion of uridine at position 8 into 4-thiouridine has been identified by genetic screening
- description: >-
    Sulfur transfer to the sulfur carrier ThiS, forming ThiS-thiocarboxylate, the
    sulfur donor for the thiazole moiety of thiamin.
  proposed_molecular_function: ThiS sulfur-carrier protein sulfurtransferase activity
  directly_involved_in:
  - id: GO:0052837
    label: thiazole biosynthetic process
  supported_by:
  - reference_id: PMID:9632726
    supporting_text: The thiI gene plays an essential role in the formation of the thiocarboxylate because ThiS isolated from a thiI- strain does not contain this modification
  - reference_id: PMID:21724998
    supporting_text: the C-terminal rhodanese domain of ThiI was sufficient for thiazole synthesis in vivo
proposed_new_terms:
- proposed_name: ThiS sulfur-carrier protein sulfurtransferase activity
  proposed_definition: >-
    Catalysis of the reaction: [ThiS sulfur-carrier protein]-C-terminal Gly-Gly-AMP +
    S-sulfanyl-L-cysteinyl-[cysteine desulfurase] + AH2 = [ThiS sulfur-carrier
    protein]-C-terminal-Gly-aminoethanethioate + L-cysteinyl-[cysteine desulfurase] + A
    + AMP + 2 H+.
  justification: >-
    The second ThiI reaction (RHEA:43340) has no GO term; GOA can only say
    sulfurtransferase activity. The same proposal is in genes/PSEPK/thiI.
  proposed_parent:
    id: GO:0016783
    label: sulfurtransferase activity
  supported_by:
  - reference_id: PMID:9632726
    supporting_text: ThiS isolated from a thiI- strain does not contain this modification
suggested_questions:
- question: >-
    Does E. coli ThiI transfer sulfur to ThiS through the same Cys456 persulfide used
    for s4U, or through a separate path, as the Salmonella separation-of-function
    mutants suggest?
suggested_experiments:
- description: >-
    Separation-of-function E. coli thiI alleles (PP-loop versus rhodanese Cys456),
    scoring tRNA s4U by LC-MS and ThiS-thiocarboxylate by mass spectrometry.
  experiment_type: mutant analysis
