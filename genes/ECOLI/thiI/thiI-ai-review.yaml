- id: PMID:15037613
  title: Substrate specificity for 4-thiouridine modification in Escherichia coli.
  findings:
  - statement: >-
      s4U synthesis in E. coli needs IscS and ThiI. IscS moves sulfur from L-cysteine
      to ThiI; ThiI uses Mg-ATP to activate U8 of tRNA and transfers the sulfur to give
      s4U.
    reference_section_type: ABSTRACT
    supporting_text: IscS catalyzes sulfur transfer from l-cysteine to ThiI, which utilizes Mg-ATP to activate uridine 8 in tRNA and transfers sulfur to give s4U
  - statement: >-
      The minimal ThiI substrate is a mini-helix of the stacked acceptor and T stems
      with a bulged loop of at least 4 nt whose first nucleotide is the target
      uridine.
    reference_section_type: ABSTRACT
    supporting_text: the minimum substrate for s4U modification is a mini-helix comprising the stacked acceptor and T stems containing an internal bulged region
  - statement: >-
      Removing the 3'-terminal ACCA abolishes activity (<0.1%), and a single overhanging
      base restores it.
    reference_section_type: ABSTRACT
    supporting_text: An unmodified tRNA(Phe) transcript in which the 3'-terminal ACCA sequence is removed to give a blunt terminus has <0.1% activity
  - statement: >-
      ThiI recognizes no primary sequence outside U8; secondary and tertiary structure
      alone restrict s4U to tRNA.
    reference_section_type: ABSTRACT
