id: P77718
gene_symbol: thiI
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  ThiI is a cytosolic, bifunctional sulfur-transfer enzyme. Its main activity is
  tRNA-uracil-4 sulfurtransferase: it installs 4-thiouridine (s4U) at position 8 of
  tRNA, the modification that makes tRNA a near-UV photosensor. The cysteine
  desulfurase IscS mobilizes sulfur from L-cysteine and passes it as a persulfide to
  ThiI. ThiI uses Mg-ATP to adenylate U8 through its PP-loop (AANH) pyrophosphatase
  domain, and transfers the sulfur through a persulfide on Cys456 in its C-terminal
  rhodanese-like domain; Cys344 and Cys456 form a disulfide during turnover. The
  N-terminal THUMP and ferredoxin-like domains bind the tRNA acceptor stem. The
  minimal substrate is a mini-helix of the stacked acceptor and T stems with a bulge
  starting at the target uridine; no primary sequence outside U8 is recognized. ThiI
  is also required for thiamin biosynthesis: without it, the sulfur carrier ThiS is
  not converted to ThiS-thiocarboxylate, the sulfur donor for the thiazole moiety.
  Work in Salmonella shows that the rhodanese domain alone suffices for this
  thiazole role, which is mechanistically separate from s4U synthesis.
