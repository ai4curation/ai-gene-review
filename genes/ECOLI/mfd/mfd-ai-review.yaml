core_functions:
- description: >-
    ATP-driven duplex DNA translocase that engages RNA polymerase stalled at a
    template-strand lesion, pushes it forward or releases it with its transcript, and then
    recruits UvrA(2)B to the exposed lesion to initiate transcription-coupled
    nucleotide-excision repair.
  molecular_function:
    id: GO:0015616
    label: DNA translocase activity
  directly_involved_in:
  - id: GO:0000716
    label: transcription-coupled nucleotide-excision repair, DNA damage recognition
  - id: GO:0006283
    label: transcription-coupled nucleotide-excision repair
  locations:
  - id: GO:0005737
    label: cytoplasm
  supported_by:
  - reference_id: PMID:22960746
    supporting_text: >-
      Bacterial transcription-coupled repair is initiated when RNA polymerase stalled at a
      DNA lesion is removed by Mfd, an ATP-dependent DNA translocase.
  - reference_id: PMID:8465200
    supporting_text: >-
      Mfd appears to target the transcribed strand for repair by recognizing a stalled
      RNAP and actively recruiting the repair enzyme to the transcription blocking lesion
      as it dissociates the stalled RNAP.
  - reference_id: PMID:29224782
    supporting_text: discovered that Mfd translocates autonomously on DNA
- description: >-
    Binds the beta subunit of RNA polymerase core through its RNAP-interacting domain,
    which targets Mfd to stalled elongation complexes and keeps displaced RNAP associated
    with the translocating Mfd.
  molecular_function:
    id: GO:0043175
    label: RNA polymerase core enzyme binding
  directly_involved_in:
  - id: GO:0000716
    label: transcription-coupled nucleotide-excision repair, DNA damage recognition
  supported_by:
  - reference_id: PMID:33480355
    supporting_text: Mfd binds to the RNAP β subunit via its RNAP-Interacting Domain RID
  - reference_id: PMID:25961799
    supporting_text: >-
      Displacement of stalled RNAP by Mfd results in loss of nascent RNA but not of RNAP,
      which remains associated with Mfd as a long-lived complex on the DNA.
proposed_new_terms: []
suggested_questions:
- question: >-
    Should GO:1990250 (TC-NER DNA damage recognition complex) be used by ComplexPortal for
    the TRCF-UvrA assembly instead of the generic GO:1990391 DNA repair complex, given that
    GO:1990250's definition cites the TRCF-UvrA structure paper?
- question: >-
    Does Mfd's role in resolving transcription-replication conflicts and promoting
    mutagenesis (beyond TC-NER) warrant a separate process annotation in E. coli?
suggested_experiments:
- description: >-
    Single-molecule tracking of Mfd-UvrA-UvrB handoff on lesion-containing templates with
    Mfd mutants defective in UvrA binding versus translocation, to separate the
    recruitment and motor contributions to TC-NER initiation in vivo.
  hypothesis: UvrA recruitment and DNA translocation are separable, both required for accelerated transcribed-strand repair.
  experiment_type: single-molecule biochemistry and genetics
