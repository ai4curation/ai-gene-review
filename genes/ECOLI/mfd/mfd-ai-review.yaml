id: P30958
gene_symbol: mfd
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  Mfd (transcription-repair coupling factor, TRCF) is a 130-kDa monomeric superfamily 2
  ATPase of the bacterial nucleoid that links transcription to nucleotide-excision
  repair. Its N-terminal UvrB-homology module binds UvrA, a central RNA polymerase
  interacting domain contacts the beta subunit of RNA polymerase, and a C-terminal
  RecG-like motor translocates on upstream duplex DNA using ATP hydrolysis without
  unwinding it. When RNA polymerase stalls at a template-strand lesion, Mfd pushes it
  forward and, if elongation cannot resume, releases the polymerase and its truncated
  transcript, then recruits UvrA(2)B to the exposed lesion, so that the transcribed
  strand of active genes is repaired preferentially (mutation frequency decline). The
  same motor rescues backtracked or arrested elongation complexes and clears RNA
  polymerase blocked by nucleotide starvation or bound proteins, giving Mfd a broader
  role in resolving transcription conflicts.
