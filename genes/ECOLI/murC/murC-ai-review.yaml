suggested_questions:
- question: >-
    Does the monomer-dimer equilibrium of E. coli MurC (Kd about 1 uM, near the
    estimated cellular concentration of ~600 copies) have any regulatory or
    channelling significance, given that both forms are equally active in vitro?
- question: >-
    Is the in vitro activity with L-serine and glycine ever physiologically relevant
    in E. coli, for example under alanine limitation?
suggested_experiments:
- description: >-
    Measure UDP-MurNAc-Ser/Gly stem-peptide formation in vivo by muropeptide LC-MS of
    cells grown under L-alanine limitation or expressing an alanine racemase/
    transaminase-deficient background.
