id: P17952
gene_symbol: murC
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  MurC is the cytoplasmic UDP-N-acetylmuramate--L-alanine ligase (EC 6.3.2.8) of
  Escherichia coli, the first of the four ATP-dependent Mur amide ligases that
  assemble the peptide stem of the peptidoglycan precursor. It couples ATP hydrolysis
  to ADP and phosphate to the formation of an amide bond between the lactyl carboxylate
  of UDP-N-acetylmuramate and L-alanine, proceeding through an acyl-phosphate
  intermediate. L-alanine is the physiological acceptor; L-serine and glycine are used
  in vitro with much lower efficiency. The Mg2+-dependent enzyme has the three-domain
  Mur ligase fold and exists in a monomer-dimer equilibrium, with both forms equally
  active. The gene is essential, and temperature-sensitive murC mutants lose
  L-alanine-adding activity and lyse.
