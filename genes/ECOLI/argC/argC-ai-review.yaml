id: P11446
gene_symbol: argC
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: ArgC is the cytoplasmic type-1 N-acetyl-gamma-glutamyl-phosphate reductase of Escherichia
  coli. It uses NADPH to reduce N-acetylglutamyl phosphate to N-acetylglutamate semialdehyde, releasing
  phosphate. This reaction supplies the carbon skeleton subsequently transaminated to N-acetylornithine
  during arginine biosynthesis.
