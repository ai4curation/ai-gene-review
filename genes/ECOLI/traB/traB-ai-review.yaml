suggested_questions:
- question: >-
    Should GO:0009297 pilus assembly be annotated to F TraB? UniProt states that
    the protein is involved in F pilus assembly, but GOA carries no biological
    process annotation for it at all, so the statement has never been captured.
- question: >-
    Does F TraB span both membranes? The core-complex structure places its
    beta-barrels in the outer membrane, while VirB10-family proteins are
    generally anchored in the inner membrane and reach the outer one. No
    subcellular location is annotated for P41067 from an F-specific experiment.
- question: >-
    How many other GOA rows on conjugative plasmid gene products have been
    attributed across plasmids because Tra symbols are reused? This annotation was
    found by checking one protein; the same collision pattern could affect others,
    TraC and TraB on F and pKM101 being the clearest pair.
suggested_experiments:
- description: >-
    Test directly whether purified F TraB (P41067) hydrolyses ATP, under both the
    membrane-derived and soluble preparations that gave different answers for the
    pKM101 VirB4 homologue. A negative result on the F protein would close the
    question this review had to settle by sequence and family argument alone.
- description: >-
    Determine the subcellular topology of F TraB by protease accessibility or
    fractionation in an F-plasmid-bearing K-12 strain, to establish whether it is
    anchored in the inner membrane as VirB10-family proteins are while
    contributing beta-barrels to the outer-membrane cone.
