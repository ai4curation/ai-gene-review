id: P41067
gene_symbol: traB
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli (strain K12)
description: >-
  TraB is a structural subunit of the outer-membrane core complex of the F-type
  type IV secretion system, encoded on the F plasmid and on the related IncFII
  plasmid ColB2 rather than on the chromosome. It is the VirB10 counterpart of
  that machine. In the cryo-EM structure of an F-family core complex, TraB forms
  the central cone as a seventeen-fold symmetrical ring of beta-barrels, seated
  inside an outer ring built from TraK and TraV; the cone is the passage through
  which the machine's substrate and its pilus reach the cell surface. TraB is
  required for assembly of the F pilus, the extracellular filament that
  establishes contact with a recipient cell, and so for conjugative transfer.
  Its role is architectural: it holds the core complex together across the
  symmetry mismatch between the outer ring and the cone, and it contributes no
  catalytic activity of its own.
references:
- id: PMID:35046412
  title: Structure of a type IV secretion system core complex encoded by multi-drug
    resistance F plasmids.
  findings:
  - statement: >-
      The F-type outer-membrane core complex is built from an outer ring of TraK
      and TraV C-terminal domains and a central cone made entirely of TraB
      beta-barrels, establishing TraB as a structural subunit of the complex.
    supporting_text: The OMCCF consists of a 13-fold symmetrical outer ring complex
      (ORC) built from 26 copies of TraK and TraV C-terminal domains, and a 17-fold
      symmetrical central cone (CC) composed of 17 copies of TraB β-barrels.
  - statement: >-
      TraB's domains are functionally load-bearing for the secretion system, not
      incidental to it.
    supporting_text: define the importance of TraK, TraV and TraB domains to T4SSF
      function
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Verified against the cached record. The structure was solved for pED208, an
      F-family plasmid, so it establishes the role for the F-type system rather
      than for this exact polypeptide; that scope limit is stated in the notes and
      in the core function's reason.
- id: PMID:7915817
  title: Analysis of the sequence and gene products of the transfer region of the F
    sex factor.
  findings:
  - statement: >-
      The F transfer region is the reference conjugation system, and its genes
      cover pilus synthesis, mating-pair stabilization, surface exclusion, DNA
      nicking and transfer, and regulation. TraB belongs to the pilus-synthesis
      group.
    supporting_text: These are involved in the synthesis of pili, extracellular filaments
      which establish contact between donor and recipient cells; mating-pair stabilization;
      prevention of mating between similar donor cells in a process termed surface
      exclusions; DNA nicking and transfer during conjugation; and the regulation
      of expression of these functions.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      The standard compendium of the F transfer region, used here for the
      system-level context rather than for a TraB-specific claim. Cached record is
      abstract-only.
- id: PMID:20172994
  title: Biochemical dissection of the ATPase TraB, the VirB4 homologue of the Escherichia
    coli pKM101 conjugation machinery.
  findings:
  - statement: >-
      The protein characterized in this paper is the VirB4 homologue of the pKM101
      conjugation system, not the F-plasmid TraB that carries accession P41067.
    supporting_text: a VirB4 homologue from the pKM101 conjugation
  - statement: >-
      Even for the pKM101 protein, ATP hydrolysis depended on how the protein was
      prepared: the membrane-derived form did not hydrolyse ATP and only the
      soluble hexamer did.
    supporting_text: TraB can form hexamers capable of hydrolyzing ATP.
  reference_review:
    relevance: LOW
    correctness: MISCITED
    review_notes: >-
      Correct identifier and title, but the paper does not support the claim made
      for this gene product. Its subject is the pKM101 VirB4 homologue, which has
      its own UniProt entry Q46698 (866 aa, TrbE/VirB4 family). P41067 is 475 aa,
      belongs to the TraB family, and is encoded on plasmid F and ColB2; F's own
      VirB4-family ATPase is the separate gene product TraC (P18004). The two
      proteins share only a gene symbol, because Tra symbols are not stable
      between conjugative plasmids.
existing_annotations:
- term:
    id: GO:0016887
    label: ATP hydrolysis activity
  evidence_type: IDA
  original_reference_id: PMID:20172994
  qualifier: enables
  review:
    summary: >-
      This annotation is attributed to the wrong protein. The cited paper
      characterizes the VirB4 homologue of the pKM101 conjugation system, which
      its abstract states outright, and that protein has its own UniProt entry
      (Q46698, 866 aa, TrbE/VirB4 family). P41067 is the 475 aa TraB of plasmid F
      and ColB2, assigned by UniProt to the TraB family, and the F plasmid's own
      VirB4-family ATPase is a different gene product, TraC (P18004). The
      structural evidence for P41067 places it in the outer-membrane core complex
      as the central-cone beta-barrel subunit, a role with no ATPase activity. The
      collision is nomenclatural: on pKM101 the symbol TraB names the protein that
      on F is called TraC.
    action: REMOVE
    reason: >-
      Removal here is not second-guessing an assay whose full text is
      unavailable, which is the case that calls for UNDECIDED. The cached abstract
      explicitly names the plasmid and the protein family, which is the condition
      under which a reference-scope objection is warranted, and four independent
      facts separate the two proteins: plasmid of origin, protein family, length,
      and the fact that F already assigns the VirB4-family role to TraC. Retaining
      the annotation would give a structural subunit a catalytic activity that no
      experiment on it supports, and would leave the F-type core complex looking
      as though it contained two VirB4-family ATPases.
- term:
    id: GO:0005198
    label: structural molecule activity
  evidence_type: ISS
  original_reference_id: PMID:35046412
  qualifier: enables
  review:
    summary: >-
      The cryo-EM structure of an F-family outer-membrane core complex resolves
      TraB as a seventeen-fold ring of beta-barrels forming the central cone, with
      no catalytic role. A structural molecular function is the accurate
      description of what this protein does.
    action: NEW
    reason: >-
      Proposed rather than asserted from a direct assay on this polypeptide. The
      structure was solved for pED208, an F-family plasmid, so the evidence code
      is ISS rather than IDA. The protein currently has no correct molecular
      function annotation at all, its one GOA row being an ATPase activity
      attributed from a different plasmid's protein, so this fills a real gap
      rather than adding a redundant term.
- term:
    id: GO:0043684
    label: type IV secretion system complex
  evidence_type: ISS
  original_reference_id: PMID:35046412
  qualifier: part_of
  review:
    summary: >-
      TraB is one of the three proteins that build the F-type outer-membrane core
      complex, contributing the central cone within the TraK and TraV outer ring.
    action: NEW
    reason: >-
      Complex membership is read directly off the solved architecture of the
