- term:
    id: GO:0009279
    label: cell outer membrane
  evidence_type: ISS
  original_reference_id: PMID:35046412
  qualifier: located_in
  review:
    summary: >-
      The structure places TraB's beta-barrels in the outer-membrane core complex.
      No subcellular location is currently annotated for this protein from any
      source.
    action: NEW
    reason: >-
      Proposed conservatively and as the only location asserted. VirB10-family
      proteins are generally also anchored in the inner membrane, but no
      F-specific experiment establishes that for this protein, so a second
      location is left for the suggested experiments rather than annotated here.
- term:
    id: GO:0044097
    label: secretion by the type IV secretion system
  evidence_type: ISS
  original_reference_id: PMID:35046412
  qualifier: involved_in
  review:
    summary: >-
      TraB's domains are functionally important to the F-type secretion system,
      and it contributes the cone through which the machine reaches the surface.
    action: NEW
    reason: >-
      The cargo-agnostic parent term is used deliberately in preference to
      GO:0009291 unidirectional conjugation. The structural evidence supports
      TraB's participation in the secretion machinery; attributing the conjugation
      outcome to it would need F-specific mutant data, which is raised as a
      question instead.
core_functions:
- description: >-
    Structural subunit of the outer-membrane core complex of the F-type type IV
    secretion system. TraB oligomerizes into the seventeen-fold central cone of
    beta-barrels that sits within the TraK and TraV outer ring, holding the
    complex together across the symmetry mismatch between the two substructures
    and forming the passage through which the machine reaches the cell surface.
    This architectural contribution is what makes the assembled apparatus, and
    hence conjugative transfer, possible; TraB itself performs no chemistry.
