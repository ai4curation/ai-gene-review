    reason: >-
      Brock et al. find that, besides (2S,3S)-methylcitrate, PrpD catalyses only
      the hydration of cis-aconitate, at a five-fold lower rate. This is a
      genuine but secondary aconitase-type activity; consistent with the other
      rows for this term.
