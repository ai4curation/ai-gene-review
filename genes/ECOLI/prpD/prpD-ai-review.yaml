- id: PMID:11782506
  title: AcnC of Escherichia coli is a 2-methylcitrate dehydratase (PrpD) that can
    use citrate and isocitrate as substrates.
  findings:
  - statement: PrpD is identical to the minor aconitase AcnC and is most active with 2-methylcitrate.
    supporting_text: Here it is shown that a 2-methylcitrate dehydratase (PrpD) encoded by the prpD gene of the propionate catabolic operon (prpRBCDE) is identical to AcnC.
  - statement: Purified PrpD is a monomeric [2Fe-2S] protein.
    supporting_text: Purified PrpD was shown to be a monomeric iron-sulphur protein (M(r) 54000) having one unstable [2Fe-2S] cluster per monomer
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only in cache; primary E. coli K-12 biochemistry and genetics.
- id: PMID:12473114
  title: Oxidation of propionate to pyruvate in Escherichia coli. Involvement of methylcitrate
    dehydratase and aconitase.
  findings:
  - statement: PrpD and AcnB together convert 2-methylcitrate to 2-methylisocitrate; PrpD is specific for (2S,3S)-methylcitrate.
    supporting_text: PrpD is specific for (2S,3S)-methylcitrate (Km = 440 micro m) and catalyses in addition only the hydration of cis-aconitate at a rate that is five times lower.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only in cache. Note the apparent disagreement with PMID:11782506 on cis-aconitate hydration.
- id: PMID:11294638
  title: 'In vitro conversion of propionate to pyruvate by Salmonella enterica enzymes:
    2-methylcitrate dehydratase (PrpD) and aconitase Enzymes catalyze the conversion
    of 2-methylcitrate to 2-methylisocitrate.'
  findings:
  - statement: Salmonella PrpD is a 2-methylcitrate dehydratase without an iron-sulfur center.
    supporting_text: Homogeneous PrpD enzyme did not contain an iron-sulfur center, displayed no requirements for metal cations or reducing agents for activity
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Salmonella enterica ortholog; abstract-only. Used as comparative evidence on cofactor requirement.
- id: PMID:28956599
  title: First Biochemical Characterization of a Methylcitric Acid Cycle from Bacillus
    subtilis Strain 168.
  findings:
  - statement: E. coli PrpD is not stereospecific among 2-methylcitrate diastereomers.
    supporting_text: We also showed for the first time that the E. coli homologue PrpD exhibited the same lack of stereospecificity.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only; mainly B. subtilis, but explicitly tests E. coli PrpD.
