- term:
    id: GO:0051537
    label: 2 iron, 2 sulfur cluster binding
  evidence_type: IDA
  original_reference_id: PMID:11782506
  qualifier: enables
  review:
    summary: Reported for purified E. coli PrpD (one unstable [2Fe-2S] cluster per monomer), but not a defining property of the enzyme family; kept as non-core.
    action: KEEP_AS_NON_CORE
    reason: >-
      Blank et al. report a labile [2Fe-2S] cluster needed for maximal
      activity. The curator annotation is accepted, but the finding is not
      general: Salmonella PrpD (a close ortholog) was purified without an
      iron-sulfur center and required no metal cations or reducing agents
      (PMID:11294638), and Brock et al. describe PrpD as unrelated in sequence
      to any enzyme of known function. Cluster binding is therefore treated as
      a possible accessory property rather than the core catalytic function.
    supported_by:
    - reference_id: PMID:11782506
      supporting_text: Purified PrpD was shown to be a monomeric iron-sulphur protein (M(r) 54000) having one unstable [2Fe-2S] cluster per monomer, which is needed for maximum catalytic activity
    - reference_id: PMID:11294638
      supporting_text: Homogeneous PrpD enzyme did not contain an iron-sulfur center, displayed no requirements for metal cations or reducing agents for activity
