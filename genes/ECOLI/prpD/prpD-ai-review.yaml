id: P77243
gene_symbol: prpD
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  PrpD is the 2-methylcitrate dehydratase of the propionate-inducible prpBCDE
  operon of Escherichia coli K-12. This monomeric (about 54 kDa) member of the
  MmgE/PrpD family catalyzes the dehydration of 2-methylcitrate, formed by PrpC,
  to 2-methyl-cis-aconitate via an unusual syn elimination; the aconitase AcnB
  then hydrates this intermediate to 2-methylisocitrate, which PrpB cleaves to
  pyruvate and succinate in the 2-methylcitrate cycle of propionate oxidation.
  PrpD has broad hydroxy-acid dehydratase specificity and also acts on citrate
  and isocitrate at lower rates, accounting for the minor "AcnC" aconitase
  activity that remains in acnAB-null strains. The purified E. coli enzyme was
  reported to carry one labile [2Fe-2S] cluster per monomer needed for maximal
  activity, whereas the Salmonella ortholog was purified without an iron-sulfur
  center. Expression is induced by propionate and subject to catabolite
  repression.
