suggested_questions:
- question: >-
    Does E. coli PrpD genuinely require a [2Fe-2S] cluster, given that the
    Salmonella ortholog is active without any iron-sulfur center?
- question: >-
    Can PrpD hydrate cis-aconitate (reported by Brock et al.) or not (reported
    by Blank et al.), and which assay conditions explain the discrepancy?
suggested_experiments:
- description: >-
    Purify E. coli PrpD anaerobically and aerobically, quantify iron and
    sulfide, and compare 2-methylcitrate dehydratase kinetics of apo- and
    reconstituted enzyme; examine the 1SZQ structure for a plausible cluster
    binding site.
