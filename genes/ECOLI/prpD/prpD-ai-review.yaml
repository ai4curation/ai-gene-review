    label: aconitate hydratase activity
  evidence_type: EXP
  original_reference_id: PMID:11782506
  qualifier: enables
  review:
    summary: Real but minor secondary activity; PrpD dehydrates citrate and isocitrate and accounts for the residual AcnC aconitase activity of acnAB mutants.
    action: KEEP_AS_NON_CORE
    reason: >-
      Blank et al. show prpD inactivation abolishes the residual aconitase
      (AcnC) activity of an acnAB-null strain and that purified PrpD dehydrates
      citrate and isocitrate, but is most active with 2-methylcitrate. AcnC
      represents no more than 5% of wild-type aconitase activity, so the
      aconitase activity is genuine but peripheral to PrpD's role in the
      methylcitrate cycle.
    supported_by:
    - reference_id: PMID:11782506
      supporting_text: Inactivation of prpD abolished the residual aconitase activity of an AcnAB-null strain
    - reference_id: PMID:11782506
      supporting_text: Purified PrpD catalysed the dehydration of citrate and isocitrate but was most active with 2-methylcitrate.
