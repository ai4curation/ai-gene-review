  review:
    summary: Over-annotation; PrpD's aconitase activity contributes at most a few percent of cellular aconitase, and its physiological role is in the methylcitrate cycle.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The UniPathway TCA mapping derives from the secondary citrate/isocitrate
      dehydratase activity. AcnA and AcnB are the TCA-cycle aconitases; PrpD
      (AcnC) represents no more than 5% of total aconitase activity and its RNA
      is present only during growth on propionate (PMID:12473114). PrpD does
      not substitute for the TCA aconitases under normal conditions.
    supported_by:
    - reference_id: PMID:11782506
      supporting_text: Escherichia coli possesses two well-characterized aconitases (AcnA and AcnB) and a minor activity (designated AcnC) that is retained by acnAB double mutants and represents no more than 5% of total wild-type aconitase activity.
    - reference_id: PMID:12473114
      supporting_text: the RNA of enzymes of the prp operon (PrpE, a propionyl-CoA synthetase, and PrpD) was exclusively present during growth on propionate.
