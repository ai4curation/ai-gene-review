- id: PMID:20693992
  title: Biotin synthesis begins by hijacking the fatty acid synthetic pathway.
  findings:
  - statement: >-
      A BioC-methylated malonyl thioester goes twice round the fatty-acid elongation cycle to give pimeloyl-ACP
      methyl ester, so the FAS-II enzymes build the biotin pimeloyl moiety.
    supporting_text: >-
      The malonyl-thioester methyl ester enters fatty acid synthesis as the primer and undergoes two reiterations
      of the fatty acid elongation cycle to give pimeloyl-acyl carrier protein (ACP) methyl ester, which
      is hydrolyzed to pimeloyl-ACP and methanol by BioH.
    reference_section_type: ABSTRACT
  - statement: >-
      Triclosan blocks dethiobiotin synthesis through FabI specifically, since triclosan-resistant FabV
      restores it.
    supporting_text: >-
      Moreover, the effects of triclosan were shown to be due to inhibition of FabI because addition of
      purified Vibrio cholerae FabV, a naturally triclosan-resistant enoyl-ACP reductase24, largely restored
      DTB synthesis to triclosan-treated extracts.
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified, full text cached (Lin, Hanson and Cronan, Nat Chem Biol 2010); the basis of both
      biotin rows.
