    NADH-dependent reduction of trans-2-enoyl-ACP to saturated acyl-ACP, the last reaction of each type
    II elongation cycle and the step that drives the cycle forward against an unfavourable dehydratase
    equilibrium; the only enzyme in E. coli that performs it.
