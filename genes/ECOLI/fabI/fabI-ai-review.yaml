suggested_questions:
- question: >-
    Does the NADPH-dependent turnover of FabI contribute measurably to elongation flux in vivo, or is
    NADH the only physiologically relevant reductant?
- question: >-
    Is palmitoyl-CoA inhibition of FabI a genuine feedback device when exogenous fatty acids are available,
    alongside the acyl-ACP inhibition of FabH?
suggested_experiments:
- description: >-
    Compare acyl-ACP profiles and elongation flux in strains whose FabI is replaced by cofactor-specificity
    variants, under conditions that shift the NADH/NADPH ratio, to test whether the NADPH activity has
    any physiological role.
