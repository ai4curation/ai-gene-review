  review:
    summary: >-
      Membrane localization from a complexome gel survey; FabI is a soluble cytosolic enzyme.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The source separated cytosolic and membrane protein complexes by two-dimensional blue native/SDS-PAGE
      and identified partners by LC-MS/MS, a method in which soluble enzymes of abundant complexes are
      readily detected in membrane preparations. FabI has no transmembrane segment or lipid anchor, is
      purified as a soluble protein, works on the soluble ACP pool, and is assigned to the cytosol by
      two independent proteomes, so a membrane residence is not supported. The row is marked as over-annotated
      rather than removed because the cached abstract does not state which fraction FabI was found in,
      so a genuine peripheral association with the membrane-bound steps of lipid synthesis cannot be excluded.
    supported_by:
