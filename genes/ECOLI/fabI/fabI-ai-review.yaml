- id: PMID:9022698
  title: >-
    The enoyl-[acyl-carrier-protein] reductase (FabI) of Escherichia coli, which catalyzes a key regulatory
    step in fatty acid biosynthesis, accepts NADH and NADPH as cofactors and is inhibited by palmitoyl-CoA.
  findings:
  - statement: >-
      Both the NADH- and the NADPH-dependent enoyl-ACP reductase activities of E. coli reside in FabI.
    supporting_text: We now demonstrate that both enoyl-ACP reductase activities reside in FabI.
    reference_section_type: ABSTRACT
  - statement: >-
      The NADPH-dependent activity is about eightfold more diazaborine-resistant than the NADH-dependent
      one.
    supporting_text: >-
      The NADPH-dependent enoyl-ACP reductase activity, however, turned out to be approximately eight
      times more resistant to diazaborine.
    reference_section_type: ABSTRACT
  - statement: >-
      Both activities are inhibited by physiologically relevant palmitoyl-CoA concentrations.
    supporting_text: >-
      Both reductase activities of the FabI protein are inhibited by physiologically relevant concentrations
      of palmitoyl-CoA, which might be important in regulating endogenous fatty acid biosynthesis in E.
      coli in the presence of exogenous fatty acids.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Bergler et al., Eur J Biochem 1996); the source of the dual-cofactor result discussed
