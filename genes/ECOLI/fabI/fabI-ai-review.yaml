id: P0AEK4
gene_symbol: fabI
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  FabI (formerly EnvM) is the enoyl-[acyl-carrier-protein] reductase of the dissociated (type II) fatty-acid
  synthase of Escherichia coli, and the only enzyme in that organism able to carry out the step: it reduces
  the trans-2 double bond of enoyl-ACP to give saturated acyl-ACP, completing each elongation cycle and
  committing the intermediate to the next round. It is a homotetrameric Rossmann-fold reductase with a
  Tyr-(Xaa)6-Lys catalytic architecture, prefers NADH although the purified enzyme also turns over with
  NADPH, and is feedback-inhibited by long-chain acyl thioesters. Because the reduction is the step that
  pulls the thermodynamically unfavourable dehydratase equilibrium forward, the amount of FabI determines
  how much saturated product the cycle makes, and the enzyme is the cellular target of the biocide triclosan,
  of the diazaborines, and (in mycobacteria, through the InhA orthologue) of isoniazid; triclosan acts
  by forming a stable enzyme-NAD(+)-inhibitor ternary complex. The same reductase also serves the diverted
  rounds of elongation that build the pimeloyl moiety of biotin.
