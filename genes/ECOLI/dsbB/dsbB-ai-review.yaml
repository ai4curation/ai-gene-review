  - term:
      id: GO:0015035
      label: protein-disulfide reductase activity
    evidence_type: IBA
    original_reference_id: GO_REF:0000033
    qualifier: enables
    supporting_entities:
      - PANTHER:PTN002195183
      - UniProtKB:P0A6M2
    review:
      summary: >-
        The reversible protein-disulfide oxidoreductase definition is
        compatible with DsbA reoxidation but less informative than DsbB's
        quinone-linked electron transfer.
      action: KEEP_AS_NON_CORE
      reason: >-
        DsbB oxidizes the reduced active-site dithiol of DsbA. GO:0015035 is
        direction-neutral by definition and compatible with this protein
        disulfide exchange, but the core DsbB chemistry is better captured by
        electron transfer toward quinone.
      supported_by:
        - reference_id: PMID:12853466
          supporting_text: >-
            The membrane protein DsbB from Escherichia coli is essential for
            disulfide bond formation and catalyses the oxidation of the
            periplasmic dithiol oxidase DsbA by ubiquinone.
