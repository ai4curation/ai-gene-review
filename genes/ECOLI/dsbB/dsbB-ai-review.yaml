- term:
    id: GO:0009055
    label: electron transfer activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: enables
  supporting_entities:
  - UniRule:UR000083131
  review:
    summary: DsbB directs electron transfer from DsbA to the quinone pool.
    action: ACCEPT
    reason: The current definition of electron transfer activity includes enzyme-mediated directed electron
      movement, which is the DsbB redox relay itself. GO:0016672 is not an is_a/part_of descendant of
      this term; no supported narrower descendant is established here. Retain the core electron-transfer
      claim while the catalytic core specifies sulfur donor and quinone acceptor.
    supported_by:
    - reference_id: PMID:10428033
      supporting_text: DsbB uses quinones as electron acceptors, allowing various choices for electron
        transport to support disulfide bond formation.
