  review:
    summary: The DsbB-DsbA crystal structure supports DsbA oxidation rather than a generic protein-binding
      function.
    action: MODIFY
    reason: 'DsbB forms a specific reaction complex with DsbA, and the physical interaction is real. GO:0005515
      is nevertheless uninformative for the redox role: DsbB''s function is to reoxidize DsbA and move
      electrons to quinone.'
