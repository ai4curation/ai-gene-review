- term:
    id: GO:0015035
    label: protein-disulfide reductase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN002195183
  - UniProtKB:P0A6M2
  review:
    summary: DsbB oxidizes the protein substrate DsbA through thiol-disulfide exchange.
    action: ACCEPT
    reason: The reversible GO:0015035 definition includes conversion of reduced protein sulfides to disulfides.
      Reduced DsbA is the protein electron donor; quinone is the terminal acceptor of the DsbB catalytic
      reaction. GO:0016672 describes the acceptor axis and is not an ontology descendant of GO:0015035,
      so substituting it as a granularity refinement would erase a compatible protein-substrate claim.
      Both describe the core reaction.
    supported_by:
    - &id001
      reference_id: PMID:12853466
      supporting_text: The membrane protein DsbB from Escherichia coli is essential for disulfide bond
        formation and catalyses the oxidation of the periplasmic dithiol oxidase DsbA by ubiquinone.
