taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: DsbB is a multi-pass inner-membrane redox protein that sustains periplasmic oxidative protein
  folding in Escherichia coli. It reoxidizes reduced periplasmic DsbA through its essential cysteine pairs
  and transfers the electrons to respiratory quinones, thereby coupling exported-protein disulfide formation
  to the membrane quinone pool.
