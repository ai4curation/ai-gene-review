id: P0AF12
gene_symbol: pfs
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli (strain K12)
description: >-
  Pfs/MtnN is a cytosolic homodimeric
  5'-methylthioadenosine/S-adenosylhomocysteine nucleosidase. It hydrolyzes
  S-adenosylhomocysteine to S-ribosylhomocysteine and adenine in the bacterial
  activated methyl cycle, hydrolyzes 5'-methylthioadenosine, and can clear the
  radical-SAM byproduct 5'-deoxyadenosine.
existing_annotations:
