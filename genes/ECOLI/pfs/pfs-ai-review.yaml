    label: nucleoside metabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR000845
  - InterPro:IPR035994
  review:
    summary: >-
      Nucleoside metabolic process is a very broad InterPro projection from a
      nucleoside-phosphorylase-related fold.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The term is not false because Pfs acts on adenosyl nucleosides, but it
      says almost nothing beyond the exact SAH and MTA nucleosidase molecular
      functions already supported for this gene.
- term:
    id: GO:0009164
    label: nucleoside catabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR010049
  review:
    summary: >-
      The IPR010049 process projection is directionally related to Pfs
      hydrolase chemistry but too generic to be useful.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Pfs hydrolyzes specific thioadenosine substrates in the activated methyl
      cycle rather than serving as a general nucleoside catabolic enzyme; the
      exact molecular-function annotations capture the biology more cleanly.
- term:
