        dimer
- term:
    id: GO:0042803
    label: protein homodimerization activity
  evidence_type: IDA
  original_reference_id: PMID:22239413
  qualifier: enables
  review:
    summary: >-
      Native mass spectrometry directly observed dimeric EcMTAN.
    action: KEEP_AS_NON_CORE
    reason: >-
      Homodimerization is real structural context for MtnN/Pfs, but the core
      molecular functions are the two nucleosidase reactions rather than
      self-assembly itself.
    supported_by:
    - reference_id: PMID:22239413
      supporting_text: >-
        EcMTAN is a homodimer with a calculated monomer molecular weight of
        26029.7 Da.
- term:
    id: GO:0046124
    label: purine deoxyribonucleoside catabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: involved_in
  supporting_entities:
  - UniRule:UR000084108
  review:
    summary: >-
      This UniRule transfer miscasts Pfs' 5'-deoxyadenosine repair reaction as
      canonical purine deoxyribonucleoside catabolism.
    action: REMOVE
    reason: >-
      The relevant substrate is 5'-deoxyadenosine generated by radical-SAM
      enzymes, not a 2'-deoxypurine nucleoside routed from DNA or nucleotide
      catabolism. Pfs repair of 5'-deoxyadenosine is better represented by the
      existing toxic metabolite repair row until GO has an exact molecular
      function for 5'-deoxyadenosine nucleosidase activity.
    supported_by:
    - reference_id: PMID:15911379
      supporting_text: >-
        5'-deoxyadenosine, a new substrate of the pfs-encoded nucleosidase.
- term:
    id: GO:0110052
    label: toxic metabolite repair
  evidence_type: IMP
  original_reference_id: PMID:15911379
  qualifier: involved_in
  review:
    summary: >-
      Loss of Pfs causes 5'-deoxyadenosine accumulation and inhibits radical-SAM
      enzymes in vivo.
    action: KEEP_AS_NON_CORE
    reason: >-
      Pfs directly clears 5'-deoxyadenosine, a toxic radical-SAM byproduct, and
      supports BioB and LipA function by preventing product accumulation. This
      is a real auxiliary repair role alongside the canonical MTA/SAH
      nucleosidase activities.
    supported_by:
    - reference_id: PMID:15911379
      supporting_text: >-
        5'-deoxyadenosine, a new substrate of the pfs-encoded nucleosidase.
    - reference_id: PMID:15911379
      supporting_text: >-
        Physiological experiments indicate that lipoic acid synthase, another
        SAM radical enzyme, is also inhibited by 5'-deoxyadenosine
        accumulation.
