    label: catalytic activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR000845
  - InterPro:IPR035994
  review:
    summary: >-
      The InterPro root catalytic-activity mapping is correct but far less
      informative than Pfs' two natural nucleosidase activities.
    action: MODIFY
    reason: >-
      Purified native enzyme and recombinant pfs assays show that this enzyme
      hydrolyzes both S-adenosylhomocysteine and 5'-methylthioadenosine, so the
      exact GO:0008782 and GO:0008930 terms should replace GO:0003824.
    proposed_replacement_terms:
    - id: GO:0008782
      label: adenosylhomocysteine nucleosidase activity
    - id: GO:0008930
      label: methylthioadenosine nucleosidase activity
    supported_by:
    - reference_id: PMID:3911944
      supporting_text: >-
        The enzyme, responsible for the cleavage of the glycosidic bond of both
        S-adenosylhomocysteine and 5'-methylthioadenosine, was partially
        characterized.
    - reference_id: PMID:9524204
      supporting_text: >-
        From this biochemical evidence we confirm our original assignment of
        the pfs gene as encoding MTA/SAH nucleosidase.
