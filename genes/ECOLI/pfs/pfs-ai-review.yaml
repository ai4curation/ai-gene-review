    action: MODIFY
    reason: >-
      E. coli MTA/SAH nucleosidase functions as a dimer, so GO:0042803 is the
      more specific molecular-function term for the self-interaction.
    proposed_replacement_terms:
    - id: GO:0042803
      label: protein homodimerization activity
    supported_by:
    - reference_id: PMID:11591349
