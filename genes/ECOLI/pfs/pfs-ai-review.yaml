- id: PMID:15911379
  title: A nucleosidase required for in vivo function of the S-adenosyl-L-methionine
    radical enzyme, biotin synthase.
  findings:
  - statement: >-
      5'-deoxyadenosine is a Pfs substrate whose accumulation inhibits radical
      SAM enzymes in vivo.
    supporting_text: >-
      We report that Escherichia coli strains lacking the
      5'-methylthioadenosine/S-adenosylhomocysteine nucleosidase encoded by the
      pfs gene are deficient in biotin synthase activity due to accumulation of
      5'-deoxyadenosine, a new substrate of the pfs-encoded nucleosidase.
