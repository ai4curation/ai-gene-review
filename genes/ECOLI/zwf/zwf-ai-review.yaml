suggested_questions:
- question: >-
    Is the EDF pentapeptide actually released from Zwf by proteolysis in vivo, and does this occur at
    physiologically meaningful levels relative to the catalytic pool of the enzyme?
suggested_experiments:
- description: >-
    Express a Zwf variant in which the NNWNN-encoding codons are altered while preserving G6PDH activity,
    and test EDF production and mazEF-dependent death separately from NADPH supply.
