description: >-
  zwf encodes the sole glucose-6-phosphate 1-dehydrogenase (G6PDH, EC 1.1.1.49) of Escherichia coli. The
  soluble cytosolic enzyme oxidizes D-glucose 6-phosphate with NADP+ to 6-phospho-D-glucono-1,5-lactone
  and NADPH, the first and committing step of the oxidative pentose phosphate pathway and the entry point
  to the Entner-Doudoroff route. Classical zwf mutants lack detectable G6PDH activity yet grow on glucose
  at near wild-type rates, because flux is rerouted through glycolysis and the non-oxidative pentose phosphate
  branch, and 13C flux analyses show that the transhydrogenase/TCA cycle compensates for the lost NADPH.
  zwf expression is coupled to growth rate and induced by superoxide-generating agents. A pentapeptide
  matching an internal Zwf sequence (NNWNN) has been proposed as the extracellular death factor that stimulates
  MazF-mediated cell death, and zwf is required for its production in some K-12 strains.
