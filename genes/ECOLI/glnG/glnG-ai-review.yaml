suggested_questions:
- question: Which genes in the E. coli ntr regulon are direct NtrC-bound targets in vivo, and which respond
    indirectly (e.g. via Nac)?
- question: How do phosphorylation-independent oligomers of NtrC (formed via the C-terminal domain) contribute,
    if at all, to transcription activation or repression at glnLp?
- question: What is the stoichiometry and architecture of the active NtrC oligomer on the glnAp2 enhancer
    during sigma-54 remodelling?
suggested_experiments:
- description: ChIP-seq of NtrC under nitrogen-limited versus nitrogen-replete growth combined with RNA-seq
    of glnG and rpoN mutants.
  hypothesis: A defined set of sigma-54 promoters is directly bound and activated by NtrC-P, while other
    nitrogen-responsive genes are indirect targets.
  experiment_type: ChIP-seq/RNA-seq
- description: Compare D54A (phospho-defective), Walker B ATPase-dead and C-terminal DNA-binding mutants
    for ATPase activity, oligomerization and open complex formation in vitro.
  hypothesis: Phosphorylation-driven oligomerization is required to activate ATP hydrolysis, which is
    in turn necessary for sigma-54 open complex formation.
  experiment_type: Mutagenesis with in vitro ATPase and transcription assays
