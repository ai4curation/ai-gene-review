  label: Escherichia coli K-12
description: Nitrogen regulator I (NRI, NtrC) of Escherichia coli is the response regulator of the NtrB/NtrC
  two-component system and a sigma-54-dependent bacterial enhancer-binding transcriptional activator.
  It has an N-terminal receiver domain phosphorylated on Asp54 by the histidine kinase NtrB, a central
  AAA+ (sigma-54 interaction) domain that hydrolyzes ATP and contacts sigma-54 RNA polymerase, and a C-terminal
  Fis-type helix-turn-helix DNA-binding and dimerization domain. Under nitrogen limitation, phosphorylated
  NtrC oligomerizes on enhancer-like sites located upstream of promoters such as glnAp2 and uses ATP hydrolysis
  to catalyze open complex formation by sigma-54 RNA polymerase, activating glnA (glutamine synthetase)
  and many genes for nitrogen transport and catabolism. NtrC-phosphate is inactivated by autodephosphorylation
  and by PII-stimulated NtrB phosphatase activity.
