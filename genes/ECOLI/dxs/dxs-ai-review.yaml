    label: isopentenyl diphosphate biosynthetic process, methylerythritol phosphate pathway
  - id: GO:0009228
    label: thiamine biosynthetic process
  - id: GO:0008615
    label: pyridoxine biosynthetic process
  locations:
  - id: GO:0005829
