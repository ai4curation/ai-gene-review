core_functions:
- description: Cytosolic, homodimeric ThDP- and Mg2+-dependent DXP synthase that condenses pyruvate with
    D-glyceraldehyde 3-phosphate to 1-deoxy-D-xylulose 5-phosphate. This is the first and rate-limiting
    step of the MEP pathway to IPP/DMAPP, and DXP also supplies carbon to the thiamine thiazole and to
    pyridoxine.
  molecular_function:
    id: GO:0008661
    label: 1-deoxy-D-xylulose-5-phosphate synthase activity
  directly_involved_in:
