id: P77488
gene_symbol: dxs
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: Dxs (DXP synthase, DXPS) is the cytosolic, thiamine diphosphate- and Mg2+-dependent enzyme of
  Escherichia coli that condenses pyruvate with D-glyceraldehyde 3-phosphate, with loss of CO2, to form
  1-deoxy-D-xylulose 5-phosphate (DXP). It is a homodimeric member of the transketolase family whose three
  domains resemble those of transketolase and pyruvate dehydrogenase E1, but whose active site lies between
  domains I and II of a single subunit. DXP is a branch-point metabolite in E. coli; it is the entry substrate
  of the methylerythritol phosphate (MEP) pathway that makes isopentenyl and dimethylallyl diphosphate for
  all cellular isoprenoids (quinone side chains, undecaprenyl phosphate), and it also supplies carbon to the
  thiazole moiety of thiamine and to pyridoxine (vitamin B6). Dxs catalyses the first, rate-limiting step of
  the MEP pathway.
