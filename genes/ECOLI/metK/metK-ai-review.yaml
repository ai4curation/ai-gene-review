  review:
    summary: MetK regenerates SAM at the methionine-to-SAM step of the methionine cycle.
    action: ACCEPT
    reason: The current cycle definition includes conversion of methionine to SAM. MetK performs
      that chemical step itself; the claim therefore rests on catalysis together with K-12 metK genetics,
      rather than on generic necessity for methylation.
    supported_by:
    - reference_id: PMID:11952912
      supporting_text: We show here that the metK gene is essential to the growth of Escherichia
        coli K-12 and can be deleted only in the presence of a rescue plasmid carrying a functional
        metK gene.
    - reference_id: PMID:10551856
      supporting_text: Initially the sulfur of methionine displaces the intact tripolyphosphate chain
        (PPP(i)) from ATP, and subsequently PPP(i) is hydrolyzed to PP(i) and P(i) before product
        release.
