id: P0A817
gene_symbol: metK
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: MetK is the cytosolic S-adenosylmethionine synthetase of Escherichia coli K-12. Its
  functional homotetramer contains intersubunit active sites that join methionine to ATP and hydrolyze
  the released tripolyphosphate before product release. Catalysis uses divalent metal ions and is
  activated by potassium. MetK supplies SAM for methyl-group transfer and other SAM-dependent chemistry
  and participates directly in methionine cycling. Tagged-cell studies reveal both diffuse cytoplasmic
  signal and focal distributions.
