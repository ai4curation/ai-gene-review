  review:
    summary: MetK self-association builds the functional dimer-of-dimers enzyme.
    action: MODIFY
    reason: Purified and structural E. coli evidence establishes a homotetramer containing two tightly
      bound dimers with intersubunit active sites. Refine identical-protein binding to the supported
      homodimer-forming interaction; the dimers further associate into a tetramer. This does not
      substitute the biological-process term homotetramerization for a molecular function. The complexomic
      abstract is accessible; the target-level assignment is retained with independent MetK localization/oligomer
      evidence rather than claiming an uninspected supplementary-table match.
    supported_by:
    - reference_id: PMID:8611562
      supporting_text: Each dimer has two active sites which are located between the subunits.
    proposed_replacement_terms:
    - id: GO:0042803
      label: protein homodimerization activity
