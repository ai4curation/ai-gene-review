  review:
    summary: ParE contributes to separation of replicated chromosomes through Topo IV decatenation.
    action: ACCEPT
    reason: The product itself contributes to the catalytic removal of DNA interlinks, not merely to viability.
      Reconstituted daughter-DNA resolution and cellular sister-locus segregation phenotypes support this
      process.
    supported_by:
    - reference_id: PMID:8104339
      supporting_text: 'These results suggest that during DNA replication, gyrase acts

        primarily to relieve accumulated positive supercoiling and Topo IV acts to

        segregate the daughter chromosomes.'
    - reference_id: PMID:18765793
      supporting_text: 'Impairment of TopoIV prevents segregation of

        newly replicated sister loci and bulk chromosome segregation, whereas modest

        increases in TopoIV decrease the cohesion time substantially.'
- term:
    id: GO:0007062
    label: sister chromatid cohesion
  evidence_type: IMP
  original_reference_id: PMID:18765793
  qualifier: acts_upstream_of_or_within
  review:
    summary: ParE-containing Topo IV releases sister-DNA cohesion by removing interlinks.
    action: MODIFY
    reason: Current GO:0007062 describes sisters becoming tethered. PMID18765793 instead shows that Topo
      IV impairment prolongs cohesion and increased activity shortens it. Replace the tethering claim
      with the chromosome-segregation process supported by the same experiment. This is a process correction,
      not a descendant refinement, and does not deny the measured effect on cohesion duration.
    supported_by:
    - reference_id: PMID:18765793
      supporting_text: 'Impairment of TopoIV prevents segregation of

        newly replicated sister loci and bulk chromosome segregation, whereas modest

        increases in TopoIV decrease the cohesion time substantially.'
    proposed_replacement_terms:
    - id: GO:0007059
      label: chromosome segregation
