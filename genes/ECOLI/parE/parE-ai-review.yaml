- term:
    id: GO:0016887
    label: ATP hydrolysis activity
  evidence_type: IC
  original_reference_id: PMID:15105144
  review:
    summary: parE supplies ATP hydrolysis that powers the topoisomerase cycle.
    action: NEW
    reason: The intrinsic nucleotide-processing activity is missing from the seeded annotations and is
      distinct from contributing to the complete DNA strand-passage reaction. The ATP-analogue-bound ParE
      domain identifies the nucleotide pocket, and ParE active-site substitutions change ATP kinetic parameters
      of the reconstituted enzyme. IC records this domain-to-catalysis synthesis without claiming that
      an isolated ParE fragment was shown to decatenate DNA.
    supported_by:
    - reference_id: PMID:15105144
      supporting_text: 'Here, we report the crystal structures of a 43-kDa N-terminal

        fragment of Escherichia coli topoisomerase IV ParE subunit complexed with

        adenylyl-imidodiphosphate at 2.0-A resolution'
    - reference_id: PMID:15105144
      supporting_text: 'These data demonstrate that the ParE M74 and GyrB I78 side

        chains impart opposite effects on the enzyme''s substrate affinity and catalytic

        efficiency.'
