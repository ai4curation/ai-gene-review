  review:
    summary: ParE engages DNA within the topoisomerase IV reaction.
    action: ACCEPT
    reason: ParE participates in DNA engagement within the topoisomerase IV DNA gate. The curated experimentally
      supported metal-coordination statement places the ParE-bound catalytic ions between protein and
      DNA, and reconstitution establishes the active ParC2ParE2 assembly. Retain DNA binding at this mechanistic
      resolution without claiming an independently measured isolated-ParE affinity.
