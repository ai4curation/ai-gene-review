id: P20083
gene_symbol: parE
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: ParE is the nucleotide-binding and ATPase subunit of Escherichia coli topoisomerase IV. Two
  ParE and two ParC subunits assemble the active type IIA topoisomerase, which removes precatenanes and
  catenanes from replicated DNA and permits daughter chromosome separation. ParE couples ATP turnover
  to strand passage and contributes to the DNA gate; ParC supplies DNA cleavage-religation and substrate-recognition
  functions. Topoisomerase IV also relaxes supercoils and acts on replicated plasmids.
