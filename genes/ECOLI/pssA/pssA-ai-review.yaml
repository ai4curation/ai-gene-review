id: P23830
gene_symbol: pssA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  pssA encodes CDP-diacylglycerol--serine O-phosphatidyltransferase
  (phosphatidylserine synthase), a type-I phosphatidylserine synthase of the
  phospholipase D superfamily. It transfers the phosphatidyl group of
  CDP-diacylglycerol to L-serine, through a covalent phosphatidyl-enzyme
  intermediate formed at its two HKD motifs, producing phosphatidylserine and
  CMP. Phosphatidylserine is then decarboxylated by Psd, so PssA catalyzes the
  first step of phosphatidylethanolamine biosynthesis, the major membrane
  phospholipid of E. coli. PssA is a peripheral membrane protein: the monomer
  binds the cytoplasmic face of the inner membrane, with binding promoted by
  anionic lipids, and this membrane-bound form is the active one, whereas the
  cytosolic monomer-dimer pool is inactive.
