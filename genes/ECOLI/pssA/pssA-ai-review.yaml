suggested_questions:
- question: >-
    The PAINT cytosol row for the type-I PssA node uses is_active_in, but the
    cytosolic pool of E. coli PssA is reported to be catalytically inactive;
    should the node carry located_in cytosol and is_active_in plasma membrane
    instead?
suggested_experiments:
- description: >-
    Measure phosphatidylserine synthase activity of membrane-bound versus
    cytosolic PssA fractions under controlled anionic-lipid content to test
    whether only the membrane-associated monomer is active in vivo.
