status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  HemW (formerly YggW) is a cytoplasmic heme chaperone of Escherichia coli. It is a radical
  S-adenosyl-L-methionine (SAM) superfamily protein in the HemW subfamily of the
  HemN-like (anaerobic coproporphyrinogen III oxidase) family, and the bacterial
  counterpart of human RSAD1. Like other radical SAM proteins it has a radical SAM core
  domain whose three cysteines (Cys16, Cys20 and Cys23) and a SAM ligate a [4Fe-4S]
  cluster, followed by a C-terminal HemN_C domain. Purified HemW binds one heme b per
  subunit, apparently covalently. Heme binding does not need the cluster, but the intact
  cluster promotes dimerization and is required for heme transfer. In bacterial two-hybrid
  assays HemW interacts with the bacterioferritins, which are its likely heme donors, and
  with NarI, the heme b-containing membrane subunit of the respiratory nitrate reductase
  NarGHI. Heme-loaded HemW transfers its heme to heme-depleted, inactive NarGHI in
  membranes from a heme-deficient strain and restores more than half of its
  nitrate-reducing activity. HemW is not a coproporphyrinogen III dehydrogenase: it cannot
  replace HemN in a hemN mutant, despite its sequence similarity and historical
  annotation. A hemW mutant grows only slightly worse under nitrate-respiring conditions,
  which suggests that a second route of heme delivery exists. HemW binds SAM and cleaves
  it only at a low, HemN-like background rate, and it is not known whether radical SAM
  chemistry contributes to heme transfer.
