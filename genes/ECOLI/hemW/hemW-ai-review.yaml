- id: file:ECOLI/hemW/hemW-uniprot.txt
  title: UniProtKB entry P52062 (HEMW_ECOLI)
  findings:
  - statement: >-
      UniProt curates HemW as a probable heme chaperone for NarI that binds one heme per
      monomer, has no coproporphyrinogen III dehydrogenase activity, is cytoplasmic, and
      dimerizes when the cluster is bound.
    supporting_text: Probably acts as a heme chaperone, transferring heme to the
      NarI subunit of the respiratory enzyme nitrate reductase
- id: PMID:29282292
  title: The radical SAM protein HemW is a heme chaperone.
  findings:
  - statement: >-
      E. coli HemW binds one heme per subunit, needs an intact [4Fe-4S] cluster for
      dimerization and heme transfer but not for heme binding, interacts with
      bacterioferritins and NarI, and transfers bound heme to heme-depleted nitrate
      reductase, restoring its activity.
    supporting_text: heme that was covalently bound to HemW was actively transferred to a
      heme-depleted, catalytically inactive nitrate reductase
  - statement: >-
      Full text (PMC5818191): E. coli hemW fails to complement the anaerobic growth defect
      of a hemN deletion strain, so HemW lacks coproporphyrinogen III dehydrogenase
      activity. HemW binds [14C]SAM but cleaves it only at a background rate. SAM did not
      affect heme transfer. A hemW mutant shows a slight, reproducible growth defect under
      nitrate respiration.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (J Biol Chem 293:2558-72). This is the primary characterization of E.
      coli HemW and the reference for GOA's IDA rows. The cached copy has only the abstract,
      so quotes come from it. Full-text findings (complementation, SAM assays, mutant
      phenotype) were read on PMC and are stated without quotes.
- id: PMID:22142238
  title: Lactococcus lactis HemW (HemN) is a haem-binding protein with a putative role
    in haem trafficking.
  findings:
  - statement: >-
      L. lactis HemW, the ISS donor, lacks coproporphyrinogen III dehydrogenase activity in
      vivo and in vitro, contains an Fe-S cluster, binds heme b covalently (one per
      monomer), and has cytosolic and membrane-associated forms. HemW-like proteins form a
      distinct clade.
    supporting_text: showed that it is devoid of CPDH activity in vivo and in vitro
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Biochem J 442:335-43). The cached copy has only the abstract. It
      is the source of the ISS donor annotations.
- id: PMID:37101575
  title: Radical SAM Enzymes Involved in Tetrapyrrole Biosynthesis and Insertion.
  findings:
  - statement: >-
      Review: HemW is the cytoplasmic heme chaperone that inserts heme b into NarGHI; the
      cluster is needed for transfer; the radical SAM mechanism of transfer is unresolved.
    supporting_text: heme is inserted into enzymes by the cytoplasmic heme chaperone HemW
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text available in the cache. Authoritative review from the Layer and Jahn groups.
