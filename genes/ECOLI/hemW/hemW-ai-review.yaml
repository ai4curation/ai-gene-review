- term:
    id: GO:0006779
    label: porphyrin-containing compound biosynthetic process
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000358281
  - UniProtKB:P54304
  - UniProtKB:P73245
  - UniProtKB:P74132
  - UniProtKB:P77915
  review:
    summary: >-
      Phylogenetic inference that HemW takes part in tetrapyrrole biosynthesis. It comes
      from the same ancestral node, PTN000358281, that gave this row to human RSAD1, and
      that node's descendant evidence comes from HemN-type biosynthetic enzymes. E. coli
      HemW performs no biosynthetic step: it cannot replace HemN, has no coproporphyrinogen
      III dehydrogenase activity, and acts on finished heme b, delivering it to the
      nitrate reductase (PMID:29282292).
    action: REMOVE
    reason: >-
      This disputes where the node was placed, not how many donors it has. The PAINT tree
      itself separates the two clades for the molecular function: coproporphyrinogen
      dehydrogenase activity (GO:0051989) sits on the HemN-clade node PTN000358335 and
      reaches E. coli HemN but not HemW. Only the biosynthetic process term was placed
      deeper, at a node that also covers the HemW subfamily. HemW is outside the clade that
      performs the biosynthetic step, which was shown for this very protein. Its heme
      chaperone role acts downstream on the finished cofactor, so it does none of the work
      of making a porphyrin. This is the same decision and reasoning as for RSAD1
      (genes/human/RSAD1).
    supported_by:
    - reference_id: file:ECOLI/hemW/hemW-uniprot.txt
      supporting_text: Does not have coproporphyrinogen
        III dehydrogenase activity in vitro (PubMed:29282292).
    - reference_id: PMID:29282292
      supporting_text: indicate that the radical SAM protein family HemW/RSAD1 is a heme chaperone
    - reference_id: PMID:22142238
      supporting_text: HemW-like proteins form a distinct phylogenetic clade that has not previously
        been recognized
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - PSEUDO_OR_SUBACTIVITY_LOSS
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: PANTHER:PTN000358281
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          The node's descendant evidence is HemN-type coproporphyrinogen dehydrogenase
          activity, which is genuinely biosynthetic in those donors. The process term is
          placed too deep, because the HemW subfamily descending from this node was shown
          experimentally (E. coli and L. lactis) to lack that chemistry and to act on
          finished heme instead. The molecular-function counterpart was placed correctly,
          at the HemN-only node PTN000358335.
