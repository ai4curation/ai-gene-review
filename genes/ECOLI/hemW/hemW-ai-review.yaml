core_functions:
- description: >-
    Cytoplasmic heme chaperone: binds one heme b per subunit (heme probably comes from
    bacterioferritin) and, in a step that needs its intact [4Fe-4S] cluster, transfers the
    heme to the apo form of NarI, the cytochrome b subunit of respiratory nitrate reductase
    NarGHI, restoring nitrate reductase activity. GO has no molecular function term for
    delivering heme to a protein, so a new term is proposed.
  proposed_molecular_function: heme chaperone activity
  locations:
  - id: GO:0005737
    label: cytoplasm
  supported_by:
  - reference_id: PMID:29282292
    supporting_text: heme that was covalently bound to HemW was actively transferred to a
      heme-depleted, catalytically inactive nitrate reductase, restoring its
      nitrate-reducing enzyme activity
  - reference_id: PMID:37101575
    supporting_text: The E. coli HemW was then demonstrated to be a heme chaperone catalyzing the
      insertion of heme b into the nitrate reductase NarGHI
- description: >-
    Binds heme b with one heme per subunit, whether or not the [4Fe-4S] cluster is present.
    This is the existing GO term that captures the cargo-binding half of the chaperone
    function.
  molecular_function:
    id: GO:0020037
    label: heme binding
  locations:
  - id: GO:0005737
    label: cytoplasm
  supported_by:
  - reference_id: PMID:29282292
    supporting_text: we observed one heme per subunit of HemW
proposed_new_terms:
- proposed_name: heme chaperone activity
  proposed_definition: >-
    Binding to heme and delivering it to a specific acceptor protein, typically an
    apo-hemoprotein, into which the heme is incorporated as a cofactor.
  justification: >-
    HemW is the clearest case of a protein whose function is to deliver heme to a client
    hemoprotein. E. coli HemW passes bound heme to heme-depleted nitrate reductase and
    restores its activity, in a cluster-dependent way (PMID:29282292). GO has no term
    for this. QuickGO searches for "heme chaperone", "heme transfer", "heme insertion",
    "heme delivery", "heme carrier" and "heme incorporation" (checked 2026-10-19) return
    only heme binding (GO:0020037), membrane transport terms (GO:0015886 heme transport,
    GO:0015232 heme transmembrane transporter activity) and GO:0017003 protein-heme
    linkage. GO:0017003 is a process for covalent heme attachment, whereas the NarI heme
    b is bound non-covalently. GO:0016530 metallochaperone activity is restricted to metal
    ions, and heme is a metal complex, not an ion. The new term would sit under
    GO:0140104 molecular carrier activity, beside metallochaperone activity, and would
    also suit other heme chaperones such as CcmE and PGRMC proteins.
  proposed_parent:
    id: GO:0140104
    label: molecular carrier activity
  supported_by:
  - reference_id: PMID:29282292
    supporting_text: indicate that the radical SAM protein family HemW/RSAD1 is a heme chaperone
      catalyzing the insertion of heme into hemoproteins
knowledge_gaps:
- gap_statement: >-
    How the [4Fe-4S] cluster enables heme transfer, and whether SAM cleavage or radical
    chemistry takes part, is unknown. HemW binds SAM and cleaves it only at a
    low background rate, and SAM did not affect heme transfer in vitro.
  boundary: >-
    Established: the cluster is ligated by three cysteines and a SAM; it is not needed for
    heme binding but is needed for dimerization and for heme transfer to NarGHI.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: >-
    Determines whether HemW is a radical SAM enzyme in any functional sense or a radical
    SAM-fold protein that uses its cluster structurally, which also decides how its human
    orthologue RSAD1 should be annotated.
  resolution: >-
    Quantify 5'-deoxyadenosine formation by reduced, heme-loaded HemW in the presence of
    apo-NarGHI membranes, and compare transfer by SAM-site and cluster-ligand variants.
  provenance:
  - reference_id: PMID:37101575
    supporting_text: The exact radical
      SAM-based mechanism of heme transfer remains to be determined
- gap_statement: >-
    The client range of HemW beyond NarGHI, and the identity of the backup heme-delivery
    route that lets a hemW mutant grow almost normally, are unknown.
  boundary: >-
    Established: HemW interacts with NarI and the bacterioferritins and restores heme to
    NarGHI in vitro. A hemW mutant shows only a slight growth defect on glycerol with
    nitrate.
  gap_kind:
  - BIOLOGY
  dark_aspect: BP_DARK
  status: OPEN
  significance: >-
    Without a clear in vivo phenotype, HemW's place in respiratory hemoprotein maturation,
    and therefore its biological process, cannot be fixed.
  resolution: >-
    Measure heme content and activity of nitrate reductase, cytochrome bo3 and bd oxidases,
    and other b-type hemoproteins in hemW single and combined mutants, and identify HemW
    partners by in vivo crosslinking.
  provenance:
  - reference_id: file:ECOLI/hemW/hemW-uniprot.txt
    supporting_text: 'DISRUPTION PHENOTYPE: Very slightly decreased anaerobic growth in
      minimal medium with KNO(3) and glycerol.'
suggested_questions:
- question: >-
    Should HemW carry a biological process term for its role in nitrate reductase
    maturation, for example GO:0017004 cytochrome complex assembly, given that its client
    NarI is a cytochrome b? The in vivo phenotype is slight, so no such term is asserted
    here.
- question: >-
    HemW binds SAM (shown with [14C]SAM) but no SAM-dependent reaction has been shown.
    Should GO:1904047 S-adenosyl-L-methionine binding be asserted for it, as it is for
    the catalytic radical SAM enzymes?
- question: >-
    Can the InterPro2GO mappings of IPR004559 (HemW-like) to GO:0004109 and GO:0006779
    be withdrawn, and the PAINT annotation of GO:0006779 be moved from PTN000358281 to the
    HemN-clade node PTN000358335, where coproporphyrinogen dehydrogenase activity already
    sits?
- question: >-
    Is the L. lactis HemW (Q9CGF7) IDA to porphyrin-containing compound biosynthetic
    process (PMID:22142238) intended, given that the paper reports no coproporphyrinogen
    dehydrogenase activity?
  experts:
  - Marc Solioz
  - Dieter Jahn
suggested_experiments:
- hypothesis: HemW is the main heme delivery route to NarI under nitrate respiration in vivo.
  description: >-
    Compare heme b content and specific activity of NarGHI purified from wild-type and hemW
    strains, and from strains that also lack the bacterioferritins, grown anaerobically on
    glycerol with nitrate.
  experiment_type: genetics with biochemical phenotyping
- hypothesis: The HemW-bound heme is covalently attached through a specific residue.
  description: >-
    Map the heme attachment site of heme-loaded HemW by proteolysis and LC-MS/MS of
    heme-containing peptides, then test whether mutating that residue blocks binding or
    only transfer.
  experiment_type: mass spectrometry / mutagenesis
