  label: Escherichia coli (strain K12)
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for E. coli DnaJ (Hsp40), the founding J-domain co-chaperone.
  The top four calls are all exact GOA matches - heat shock protein binding, response to heat, protein
  folding, DNA replication - which between them span the chaperone, stress-response and replication-initiation
  roles this review describes. Nothing in the top four is wrong, and nothing is new. Scores are modest
  (14.0 down to 12.9) despite the protein being unambiguous, and the sigma factor antagonist activity
  that forms this review's second core function is not retrieved; BioReason-SFT did recover it. Assessment:
  3 correct not novel (CNN).
