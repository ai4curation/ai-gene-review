      DnaK and does not mention DnaJ or an unfolded client. DnaJ's valid chaperone
      activity is captured by other evidence-backed rows.
  qualifier: enables
- term:
    id: GO:0051087
    label: protein-folding chaperone binding
  evidence_type: IPI
  original_reference_id: PMID:9103205
  supporting_entities:
  - UniProtKB:P0A6Y8
  review:
    summary: IPI with DnaK (P0A6Y8) from CAFA. DnaJ binds the protein-folding chaperone
      DnaK. While PMID:9103205 is about the GrpE-DnaK structure, the DnaJ-DnaK interaction
      is well-established. This is an appropriate and informative MF annotation.
    action: MARK_AS_OVER_ANNOTATED
    reason: The DnaJ-DnaK interaction is biologically well established elsewhere,
      but this CAFA IPI is miscited. PMID:9103205 assays GrpE bound to DnaK and does
      not report DnaJ. Multiple correctly cited DnaK IPI rows support GO:0051087,
      so the biological term is retained through those sources rather than this row.
    supported_by:
    - reference_id: PMID:9860950
      supporting_text: Chaperones of the Hsp70 family bind to unfolded or partially
        folded polypeptides to facilitate many cellular processes. ATP hydrolysis
        and substrate binding, the two key molecular activities of this chaperone,
        are modulated by the cochaperone DnaJ.
  qualifier: enables
- term:
    id: GO:0065003
    label: protein-containing complex assembly
  evidence_type: IDA
  original_reference_id: PMID:9103205
  review:
    summary: IDA from CAFA. DnaJ participates in the assembly of the DnaK/DnaJ/GrpE
      chaperone complex and also in the assembly/disassembly of replication initiation
      complexes. While somewhat general, DnaJ does facilitate complex assembly as
      part of its chaperone function.
    action: MARK_AS_OVER_ANNOTATED
    reason: DnaJ participates in assembly and remodeling events during its chaperone
      cycle, but PMID:9103205 establishes assembly of a GrpE-DnaK complex, not a
      DnaJ-containing complex. The CAFA row therefore overstates what this source
      establishes without making the broader DnaJ biology false.
  qualifier: involved_in
- term:
    id: GO:0005829
    label: cytosol
  evidence_type: IDA
  original_reference_id: PMID:6220698
  review:
    summary: IDA from EcoCyc. Zylicz et al. (1983) identified DnaJ in minicells. DnaJ
      is primarily a cytoplasmic/cytosolic protein. The cytosol annotation is appropriate
      and consistent with UniProt subcellular location.
    action: ACCEPT
    reason: Experimentally supported localization. DnaJ is a soluble cytoplasmic protein.
    supported_by:
    - reference_id: PMID:6220698
      supporting_text: Escherichia coli dnaJ- and dnaK-gene products have been identified
