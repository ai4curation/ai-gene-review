core_functions:
- description: DnaJ functions as the primary co-chaperone of the DnaK (Hsp70) chaperone
    system. It binds unfolded or misfolded substrates via its C-terminal domain and
    delivers them to DnaK, stimulating DnaK ATPase activity through the conserved
    HPD motif in its J-domain. Together with GrpE (nucleotide exchange factor), the
    DnaK/DnaJ/GrpE system refolds stress-denatured proteins and converts stably misfolded
    proteins into intermediates that spontaneously refold to the native state (PMID:20953191).
    DnaJ is the founding member of the J-domain protein family.
  molecular_function:
    id: GO:0044183
    label: protein folding chaperone
  directly_involved_in:
  - id: GO:0006457
    label: protein folding
  - id: GO:0042026
    label: protein refolding
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:20953191
    supporting_text: Hsp70-Hsp40-NEF and possibly Hsp100 are the only known molecular
      chaperones that can use the energy of ATP to convert stably pre-aggregated polypeptides
      into natively refolded proteins.
  - reference_id: PMID:12941935
    supporting_text: it appears that zinc center II mutant proteins lack a necessary
      additional interaction site with DnaK, which seems to be crucial for locking-in
      substrate proteins onto DnaK.
- description: DnaJ binds DnaK through its conserved HPD-containing J domain and
    activates hydrolysis of DnaK-bound ATP, shifting DnaK into its high-affinity
    client-bound state. DnaJ alone accelerates DnaK ATP hydrolysis, and together
    with GrpE can strongly stimulate ATPase cycling; this activator activity is the
    defining mechanistic link between DnaJ client delivery and the DnaK folding cycle.
  molecular_function:
    id: GO:0001671
    label: ATPase activator activity
  directly_involved_in:
  - id: GO:0006457
    label: protein folding
  - id: GO:0042026
    label: protein refolding
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:1826368
    supporting_text: The action of the DnaJ and GrpE proteins may be sequential,
      since the presence of DnaJ alone leads to an acceleration in the rate of hydrolysis
      of the DnaK-bound ATP.
- description: DnaJ cooperates with DnaK to inactivate sigma32 (the heat shock transcription
    factor) by direct binding, constituting a negative feedback loop in the heat shock
    response. DnaJ binds free sigma32 with Kd 20 nM (PMID:8599944) and mediates efficient
    DnaK binding to sigma32, cooperatively inhibiting its transcriptional activity.
  molecular_function:
    id: GO:0016989
    label: sigma factor antagonist activity
  directly_involved_in:
  - id: GO:0045892
    label: negative regulation of DNA-templated transcription
  - id: GO:0009408
    label: response to heat
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:8599944
    supporting_text: DnaK and DnaJ cooperatively inhibit sigma32 activity in heat
      shock gene transcription and GrpE partially reverses this inhibition.
proposed_new_terms: []
suggested_questions:
- question: Which endogenous clients depend on DnaJ's autonomous DnaK-independent
    chaperone activity, and which require transfer into the DnaK-GrpE cycle?
- question: Does DnaJ's thiol-disulfide reductase activity make a measurable
    physiological contribution in the reducing E. coli cytosol?
- question: >-
    What explains the experimentally observed membrane-associated DnaJ pool: regulated
    recruitment to membrane clients, stable membrane affinity, or enrichment introduced
    by the historical fractionation conditions?
suggested_experiments:
- experiment_type: separation-of-function client proteomics
  description: Compare substrate-trapping proteomes and aggregation phenotypes of
    J-domain, client-binding, and zinc-center mutants under basal and heat-stress
    conditions to distinguish autonomous protection from DnaK-dependent transfer.
- experiment_type: in vivo redox activity assay
  description: Quantify cysteine redox states and folding of candidate cytosolic
    clients in wild-type and oxidoreductase-defective DnaJ strains while preserving
    J-domain co-chaperone activity.
- experiment_type: localization-resolved interaction mapping
  description: Combine cytosol-membrane fractionation controls with in vivo
    crosslinking to determine whether the membrane-associated pool contains specific
    DnaJ clients or DnaK complexes.
