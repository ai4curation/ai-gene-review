  qualifier: located_in
- term:
    id: GO:0043335
    label: protein unfolding
  evidence_type: IDA
  original_reference_id: PMID:20953191
  review:
    summary: IDA from EcoCyc. Sharma et al. (2010) demonstrated that the Hsp70 (DnaK)-Hsp40
      (DnaJ)-NEF (GrpE) system acts as a polypeptide unfoldase, converting stably
      misfolded proteins into intermediates that spontaneously refold to native state.
      DnaJ acts upstream of or within this process by delivering substrates to DnaK.
    action: ACCEPT
    reason: The DnaK/DnaJ/GrpE system functions as an unfoldase to convert misfolded
      proteins into refoldable intermediates. DnaJ is essential to this process. Supported
      by direct experimental evidence from PMID:20953191.
    supported_by:
    - reference_id: PMID:20953191
      supporting_text: one Hsp70 molecule consumed five ATPs to effectively unfold
        a single misfolded protein into an intermediate that, upon chaperone dissociation,
        spontaneously refolded to the native state
  qualifier: acts_upstream_of_or_within
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:18995833
  supporting_entities:
  - UniProtKB:P0AGB3
  review:
    summary: IPI with sigma32 (P0AGB3). Rodriguez et al. (2008) identified two distinct
      binding sites in sigma32 for DnaK and DnaJ. DnaJ binding destabilizes a distant
      region of sigma32. This is a functionally important interaction for heat shock
      regulation. Better captured by GO:0016989 "sigma factor antagonist activity"
      which is already annotated.
    action: MODIFY
    reason: '"Protein binding" is uninformative. The DnaJ-sigma32 interaction represents
      sigma factor antagonist activity (GO:0016989), already annotated from PMID:8599944.
      Alternatively, GO:0051087 "protein-folding chaperone binding" could apply if
      considering sigma32 as a chaperone substrate.'
    proposed_replacement_terms:
    - id: GO:0016989
      label: sigma factor antagonist activity
    supported_by:
    - reference_id: PMID:18995833
      supporting_text: Here we identified two distinct sites in sigma(32) as binding
        sites for DnaK and DnaJ. DnaJ binding destabilizes a distant region of sigma(32)
        in close spatial vicinity of the DnaK-binding site
  qualifier: enables
- term:
    id: GO:0015035
    label: protein-disulfide reductase activity
  evidence_type: IDA
  original_reference_id: PMID:11732919
  review:
    summary: IDA from EcoCyc. Tang and Wang (2001) showed DnaJ possesses reductase
      and oxidase activity mediated by the -C183PHC186- motif in zinc center 2. The
      C-terminal fragment (Q181-R376) shows full enzymatic activity. This is a secondary
      function dependent on the zinc finger cysteines.
    action: KEEP_AS_NON_CORE
    reason: Experimentally demonstrated (PMID:11732919) but represents a secondary,
      non-core function of DnaJ. The thiol-disulfide oxidoreductase activity is mediated
      by the zinc finger cysteines and is distinct from the primary co-chaperone function.
      The physiological significance in vivo remains unclear.
    supported_by:
    - reference_id: PMID:11732919
      supporting_text: DnaJ shows reductase activity and oxidase activity but little,
        if any, isomerase activity. The reductase activity is reversibly inhibited
        by EDTA. Zn2 is important for the enzymatic activity, and only -C(183)PHC(186)-
        among the four motifs of -CXXC- functions as the active site of the enzyme.
  qualifier: enables
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:9860950
  supporting_entities:
  - UniProtKB:P0A6Y8
  review:
    summary: 'IPI with DnaK (P0A6Y8). Suh et al. (1998) provided genetic and biochemical
      evidence that DnaJ binds to at least two sites on DnaK: under the ATPase domain
      and near the substrate-binding pocket. This is the foundational DnaK-DnaJ interaction
      paper. Better captured by GO:0051087.'
    action: MODIFY
    reason: '"Protein binding" is uninformative. This key paper characterizes the
      DnaJ-DnaK co-chaperone interaction. GO:0051087 "protein-folding chaperone binding"
      is the appropriate specific term.'
    proposed_replacement_terms:
    - id: GO:0051087
      label: protein-folding chaperone binding
    supported_by:
    - reference_id: PMID:9860950
      supporting_text: By using both genetic and biochemical approaches, we provide
        evidence that DnaJ binds to at least two sites on the Escherichia coli Hsp70
        family member DnaK
  qualifier: enables
- term:
    id: GO:0016989
    label: sigma factor antagonist activity
  evidence_type: IDA
  original_reference_id: PMID:8599944
  review:
    summary: IDA from EcoCyc. Gamer et al. (1996) demonstrated that DnaK and DnaJ
      cooperatively inhibit sigma32 transcriptional activity. DnaJ binds free sigma32
      with a Kd of 20 nM and mediates efficient binding of DnaK to sigma32. This is
      a well-established regulatory function of the DnaK/DnaJ system.
    action: ACCEPT
    reason: Well-supported by direct experimental evidence. DnaJ binds sigma32 and
      cooperates with DnaK to inhibit its transcriptional activity. This is a specialized
      core regulatory output of DnaJ's co-chaperone mechanism on the native client
      sigma32, rather than an unrelated biochemical activity.
    supported_by:
    - reference_id: PMID:8599944
      supporting_text: DnaJ and DnaK bind free, but not RNA polymerase-bound, sigma32
        with dissociation constants of 20 nM and 5 muM respectively.
    - reference_id: PMID:8599944
      supporting_text: DnaK and DnaJ cooperatively inhibit sigma32 activity in heat
        shock gene transcription and GrpE partially reverses this inhibition.
  qualifier: enables
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:1534276
  supporting_entities:
  - UniProtKB:P0AGB3
  review:
    summary: IPI with sigma32 (P0AGB3). Gamer et al. (1992) demonstrated physical
      interaction between DnaK, DnaJ, GrpE and sigma32 in vivo, with DnaJ-sigma32
      association being distinct from DnaK-sigma32 interaction (resistant to ATP).
      This is better captured by the sigma factor antagonist activity annotation.
    action: MODIFY
    reason: '"Protein binding" is uninformative. The DnaJ-sigma32 interaction represents
      a functionally characterized regulatory interaction. GO:0016989 "sigma factor
      antagonist activity" is already annotated for this function.'
    proposed_replacement_terms:
    - id: GO:0016989
      label: sigma factor antagonist activity
    supported_by:
    - reference_id: PMID:1534276
      supporting_text: 'an interaction of DnaJ with sigma 32 exists that is distinguishable
        from an interaction of DnaK and GrpE with sigma 32: addition of ATP disrupts
        the association of DnaK and GrpE with sigma 32, but not the association of
        DnaJ with sigma 32.'
  qualifier: enables
- term:
    id: GO:0009408
    label: response to heat
  evidence_type: IMP
  original_reference_id: PMID:2144273
  review:
    summary: IMP from EcoCyc. Sell et al. (1990) showed that dnaJ null mutants did
      not grow well above 30C, formed progressively smaller colonies at higher temperatures,
      and could not grow at 43C. This demonstrates DnaJ is required for growth at
      elevated temperatures, directly supporting response to heat.
    action: ACCEPT
    reason: Direct mutant phenotype evidence. DnaJ null mutants are heat-sensitive,
      demonstrating DnaJ is essential for the heat shock response above 42C.
    supported_by:
    - reference_id: PMID:2144273
      supporting_text: dnaJ-insertion mutants did not grow as well as the wild type
        at temperatures above 30 degrees C, although they blocked lambda DNA replication
        at all temperatures. The dnaJ-insertion mutants formed progressively smaller
        colonies at higher temperatures, up to 42 degrees C, and did not form colonies
        at 43 degrees C.
  qualifier: acts_upstream_of_or_within
- term:
    id: GO:0016032
    label: viral process
  evidence_type: IDA
  original_reference_id: PMID:1361234
  review:
    summary: IDA from EcoCyc. Hoffmann et al. (1992) demonstrated that the DnaK/DnaJ/GrpE
      chaperone complex is required for initiating phage lambda DNA replication by
      sequestering and releasing lambda P protein from the preprimosomal complex.
      DnaJ forms an ATP-dependent ternary complex with DnaK and lambda P.
    action: KEEP_AS_NON_CORE
    reason: DnaJ participates in phage lambda DNA replication as part of the chaperone
      system that releases lambda P protein. This is a well-established but non-core
      function representing the chaperone system being co-opted by phage.
    supported_by:
    - reference_id: PMID:1361234
      supporting_text: We have discovered an ATP-dependent ternary interaction between
        P, DnaK, and DnaJ; this P.DnaK.DnaJ complex is dissociated by GrpE.
  qualifier: acts_upstream_of_or_within
- term:
    id: GO:0016032
    label: viral process
  evidence_type: IMP
  original_reference_id: PMID:2144273
  review:
    summary: IMP from EcoCyc. Sell et al. (1990) showed that dnaJ null mutants blocked
      lambda phage growth at all temperatures. None of the suppressor mutations that
      restored bacterial growth also restored lambda phage propagation.
    action: KEEP_AS_NON_CORE
    reason: DnaJ is required for phage lambda DNA replication. Mutant phenotype evidence
      is strong (PMID:2144273). Non-core because this is the phage co-opting the host
      chaperone system.
    supported_by:
    - reference_id: PMID:2144273
      supporting_text: they blocked lambda DNA replication at all temperatures...None
        of these suppressor mutations restored the ability of the host to propagate
        phage lambda.
  qualifier: acts_upstream_of_or_within
- term:
    id: GO:0016032
    label: viral process
  evidence_type: IDA
  original_reference_id: PMID:3889001
  review:
    summary: IDA from EcoCyc. Zylicz et al. (1985) purified DnaJ and showed it is
      required at a very early step in lambda DNA replication using an in vitro complementation
      assay. This is the original biochemical characterization of DnaJ function.
    action: KEEP_AS_NON_CORE
    reason: Historical paper demonstrating DnaJ function in lambda DNA replication.
      Non-core as this is phage co-opting host chaperone function.
    supported_by:
    - reference_id: PMID:3889001
      supporting_text: we have shown that the dnaJ protein is required at a very early
        step in the DNA replication process.
  qualifier: acts_upstream_of_or_within
- term:
    id: GO:0042803
    label: protein homodimerization activity
  evidence_type: IDA
  original_reference_id: PMID:3889001
  review:
    summary: IDA from EcoCyc. Zylicz et al. (1985) determined that DnaJ has a native
      Mr of 76,000 under non-denaturing conditions versus 37,000 under denaturing
      conditions, indicating it exists as a homodimer. UniProt confirms DnaJ is a
      homodimer.
    action: KEEP_AS_NON_CORE
    reason: The native molecular mass supports homodimerization, so the annotation
      is retained. Oligomeric state is structural context rather than a direct core
      chaperone or regulatory activity.
    supported_by:
    - reference_id: PMID:3889001
      supporting_text: a basic (pI 8.5), yet hydrophobic, protein of Mr 37,000 and
        76,000 under denaturing and native conditions, respectively
  qualifier: enables
- term:
    id: GO:0009408
    label: response to heat
  evidence_type: IEP
  original_reference_id: PMID:8349564
  review:
    summary: IEP from EcoliWiki. Chuang and Blattner (1993) characterized heat shock
      genes including DnaJ, showing heat-induced expression kinetics similar to other
      major heat shock proteins (DnaK, GroEL, GroES). DnaJ expression is induced by
      heat shock.
    action: ACCEPT
    reason: DnaJ is a well-known heat shock protein (HSP40) induced by heat stress.
      Expression evidence is consistent with IMP evidence from PMID:2144273 and UniProt
      annotation of heat-shock induction under HtpR control.
    supported_by:
    - reference_id: PMID:8349564
      supporting_text: In vivo expression kinetics of seven of eight examined new
        proteins were found to be similar to those of the four most studied heat shock
        proteins, DnaK, DnaJ, GroEL (MopA), and GroES (MopB).
  qualifier: acts_upstream_of_or_within
- term:
    id: GO:0006260
    label: DNA replication
  evidence_type: IMP
  original_reference_id: PMID:2144273
  review:
    summary: IMP from EcoliWiki. Sell et al. (1990) showed dnaJ null mutants blocked
      lambda DNA replication at all temperatures. DnaJ is required for the initiation
      of phage lambda DNA replication as part of the chaperone system.
    action: MODIFY
    reason: The experiment demonstrates a host chaperone requirement for bacteriophage
      lambda genome replication, not generic cellular DNA replication. GO:0044829
      captures DnaJ promoting viral genome replication without implying a core host
      replisome function.
    proposed_replacement_terms:
    - id: GO:0044829
      label: host-mediated activation of viral genome replication
    supported_by:
    - reference_id: PMID:2144273
      supporting_text: they blocked lambda DNA replication at all temperatures
  qualifier: acts_upstream_of_or_within
- term:
    id: GO:0008270
    label: zinc ion binding
  evidence_type: IDA
  original_reference_id: PMID:8662861
  review:
    summary: IDA from EcoliWiki. Banecki et al. (1996) demonstrated that two Zn(II)
      ions interact with each DnaJ monomer using quantitative zinc release assays
      and atomic absorption. The zinc finger region is important for DnaK-substrate
      complex stabilization.
    action: ACCEPT
    reason: Direct experimental demonstration of zinc binding. DnaJ has two zinc centers
      with distinct functional roles (PMID:8662861, PMID:12941935).
    supported_by:
    - reference_id: PMID:8662861
      supporting_text: Quantitation of the released Zn(II) ions, upon challenge with
        p-hydroxymercuriphenylsulfonic acid, and by atomic absorption showed that
        two Zn(II) ions interact with each monomer of DnaJ.
  qualifier: enables
- term:
    id: GO:0016020
    label: membrane
  evidence_type: IDA
  original_reference_id: PMID:3889001
  review:
    summary: IDA from EcoliWiki. Zylicz et al. (1985) purified DnaJ from the membrane
      fraction of an overproducing strain. DnaJ is described as hydrophobic and membrane-associated.
      However, DnaJ is primarily a cytoplasmic/cytosolic protein. The membrane association
      may be due to DnaJ interacting with membrane-associated substrates or its hydrophobic
      Gly/Phe-rich region.
    action: KEEP_AS_NON_CORE
    reason: DnaJ was purified from the membrane fraction and shown to have membrane
      affinity. UniProt lists subcellular location as Cytoplasm, but early studies
      consistently found membrane association (PMID:3889001, PMID:6220698). This likely
      represents a secondary localization or substrate interaction.
    supported_by:
    - reference_id: PMID:3889001
      supporting_text: we purified the dnaJ protein to homogeneity from the membrane
        fraction of an overproducing strain of bacteria. The purified dnaJ protein
        was shown to be a basic (pI 8.5), yet hydrophobic, protein
  qualifier: located_in
- term:
    id: GO:0008270
    label: zinc ion binding
  evidence_type: IDA
  original_reference_id: PMID:11985624
  review:
    summary: IDA from EcoliWiki. Katayama et al. (2002) performed a systematic search
      for zinc-binding proteins in E. coli using radioactive Zn(II) binding assays.
      DnaJ was identified as a known zinc-binding protein in this screen.
    action: ACCEPT
    reason: Confirms DnaJ zinc binding by an independent experimental approach. Consistent
      with other IDA evidence for zinc ion binding (PMID:8662861).
  qualifier: enables
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IDA
  original_reference_id: PMID:6220698
  review:
    summary: IDA from EcoliWiki. Zylicz et al. (1983) identified DnaJ in minicells
      and showed it has membrane affinity. The cytoplasm annotation is appropriate
      as DnaJ is primarily cytoplasmic. Consistent with IBA and IEA annotations.
    action: ACCEPT
    reason: Direct experimental evidence. DnaJ identified in minicells as a cytoplasmic
      protein with membrane affinity (PMID:6220698).
    supported_by:
    - reference_id: PMID:6220698
      supporting_text: Escherichia coli dnaJ- and dnaK-gene products have been identified
        in a system of minicells infected with the appropriate transducing lambda
        phages.
  qualifier: located_in
- term:
    id: GO:0016020
    label: membrane
  evidence_type: IDA
  original_reference_id: PMID:6220698
  review:
    summary: IDA from EcoliWiki. Zylicz et al. (1983) showed both DnaJ and DnaK are
      membrane-bound using equilibrium sedimentation in metrizamide density gradients.
    action: KEEP_AS_NON_CORE
    reason: Experimentally demonstrated membrane association. DnaJ shows membrane
      affinity, consistent with its hydrophobic character and membrane fraction purification
      (PMID:3889001).
    supported_by:
    - reference_id: PMID:6220698
      supporting_text: Equilibrium sedimentation of minicell lysates in metrizamide
        density gradients has revealed that both these host proteins, indispensable
        for lambda DNA replication, are membrane-bound.
  qualifier: located_in
- term:
    id: GO:0003756
    label: protein disulfide isomerase activity
  evidence_type: IDA
  original_reference_id: PMID:7559385
  review:
    summary: IDA from EcoliWiki. de Crouy-Chanel et al. (1995) showed DnaJ catalyzes
      protein disulfide formation, reduction, and isomerization (refolding of randomly
      oxidized RNase). However, Tang and Wang (2001, PMID:11732919) found that DnaJ
      shows reductase and oxidase activity but "little, if any, isomerase activity."
      The isomerase annotation may be an over-interpretation.
    action: MODIFY
    reason: While PMID:7559385 initially reported disulfide isomerase activity, the
      more detailed follow-up study (PMID:11732919) found DnaJ has "little, if any,
      isomerase activity" and primarily shows reductase and oxidase activities. GO:0015035
      "protein-disulfide reductase activity" is already annotated and is the more
      accurate term. The isomerase activity claim was not confirmed.
    proposed_replacement_terms:
    - id: GO:0015035
      label: protein-disulfide reductase activity
    additional_reference_ids:
    - PMID:11732919
    supported_by:
    - reference_id: PMID:11732919
      supporting_text: DnaJ shows reductase activity and oxidase activity but little,
        if any, isomerase activity.
    - reference_id: PMID:7559385
      supporting_text: DnaJ, like thioredoxin, protein-disulfide isomerase, and DsbA,
        possesses an active dithiol/disulfide group and catalyzes protein disulfide
        formation (oxidative renaturation of reduced RNase), reduction (reduction
        of insulin disulfides), and isomerization (refolding of randomly oxidized
        RNase).
  qualifier: enables
- term:
    id: GO:0006457
    label: protein folding
  evidence_type: IDA
  original_reference_id: PMID:7559385
  review:
    summary: IDA from EcoliWiki. de Crouy-Chanel et al. (1995) demonstrated DnaJ involvement
      in protein folding and renaturation after stress. This is a core function.
    action: ACCEPT
    reason: Core biological process for DnaJ. Well-supported experimental evidence.
    supported_by:
    - reference_id: PMID:7559385
      supporting_text: The DnaJ protein of Escherichia coli and the DnaJ-like proteins
        of eukaryotes are known as molecular chaperones and specific regulators of
        DnaK-like proteins and are involved in protein folding and renaturation after
        stress.
  qualifier: acts_upstream_of_or_within
- term:
    id: GO:0008270
    label: zinc ion binding
  evidence_type: IMP
  original_reference_id: PMID:12941935
  review:
    summary: IMP from EcoliWiki. Linke et al. (2003) showed that mutating zinc-coordinating
      cysteines to serine in either zinc center 1 (C144S/C147S/C197S/C200S) or zinc
      center 2 (C161S/C164S/C183S/C186S) had distinct functional effects, demonstrating
      the importance of zinc binding for DnaJ activity.
    action: ACCEPT
    reason: Mutant phenotype evidence confirming the functional importance of zinc
      binding. Zinc center 1 is required for DnaK-independent chaperone activity,
      while zinc center 2 is essential for DnaK interaction and overall function.
    supported_by:
    - reference_id: PMID:12941935
      supporting_text: in the absence of zinc center I, the autonomous, DnaK-independent
        chaperone activity of DnaJ is dramatically reduced...The DnaJ zinc center
        II, on the other hand, was found to be absolutely essential for the in vivo
        and in vitro function of DnaJ.
  qualifier: enables
- term:
    id: GO:0042026
    label: protein refolding
  evidence_type: IDA
  original_reference_id: PMID:7559385
  review:
    summary: IDA from EcoliWiki. de Crouy-Chanel et al. (1995) demonstrated DnaJ involvement
      in protein renaturation (refolding) after stress, including refolding of randomly
      oxidized RNase. This is a core function of the DnaK/DnaJ/GrpE system.
    action: ACCEPT
    reason: Core function. DnaJ participates in refolding of stress-denatured proteins
      as part of the DnaK/DnaJ/GrpE chaperone system. Experimentally demonstrated.
    supported_by:
    - reference_id: PMID:7559385
      supporting_text: DnaJ-like proteins of eukaryotes are known as molecular chaperones
        and specific regulators of DnaK-like proteins and are involved in protein
        folding and renaturation after stress.
  qualifier: acts_upstream_of_or_within
- term:
    id: GO:0051082
    label: unfolded protein binding
  evidence_type: IDA
  original_reference_id: PMID:7559385
  review:
    summary: IDA from EcoliWiki. de Crouy-Chanel et al. (1995) showed DnaJ binds unfolded
      proteins as part of its chaperone function. However, GO:0051082 is now formally
      obsolete. DnaJ binding to unfolded substrates is part of the chaperone cycle,
      not an independent binding function.
    action: MODIFY
    reason: GO:0051082 is now formally obsolete. DnaJ binds unfolded proteins in the
      context of co-chaperone activity. GO:0044183 "protein folding chaperone" is
      the appropriate interim replacement, capturing the functional context of this
      binding.
    proposed_replacement_terms:
    - id: GO:0044183
      label: protein folding chaperone
    supported_by:
    - reference_id: PMID:7559385
      supporting_text: DnaJ, like thioredoxin, protein-disulfide isomerase, and DsbA,
        possesses an active dithiol/disulfide group and catalyzes protein disulfide
        formation
  qualifier: enables
- term:
    id: GO:0001671
    label: ATPase activator activity
  evidence_type: EXP
  original_reference_id: PMID:1826368
  qualifier: enables
  review:
    summary: Proposed annotation for DnaJ's direct stimulation of DnaK ATP hydrolysis
      through its conserved J-domain HPD motif.
    action: NEW
    reason: PMID:1826368 shows that DnaJ alone accelerates hydrolysis of DnaK-bound
      ATP. GO:0001671 is the current specific molecular-function term for binding
      to and increasing an ATP hydrolysis activity and captures this defining
      co-chaperone mechanism.
    supported_by:
    - reference_id: PMID:1826368
      supporting_text: The action of the DnaJ and GrpE proteins may be sequential,
        since the presence of DnaJ alone leads to an acceleration in the rate of
        hydrolysis of the DnaK-bound ATP.
