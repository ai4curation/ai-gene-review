- term:
    id: GO:0051082
    label: unfolded protein binding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  supporting_entities:
  - PANTHER:PTN002454318
  - SGD:S000001878
  - UniProtKB:P08622
  review:
    summary: DnaJ does bind unfolded proteins via its C-terminal domain and delivers
      them to DnaK. However, GO:0051082 "unfolded protein binding" is now formally
      obsolete, and DnaJ is better described as a protein folding chaperone (GO:0044183)
      since its binding to unfolded proteins is in the context of the chaperone folding
      cycle, not as an independent binding function. DnaJ is a co-chaperone, not an
      independent foldase.
    action: MODIFY
    reason: GO:0051082 is now formally obsolete. DnaJ binds unfolded substrates as
      part of the DnaK/DnaJ/GrpE chaperone cycle, not as an independent unfolded-protein
      binder. GO:0044183 "protein folding chaperone" better captures this co-chaperone
      function. Note that GO:0003767 "co-chaperone activity" is obsolete, so GO:0044183
      is the pragmatic interim term.
    proposed_replacement_terms:
    - id: GO:0044183
      label: protein folding chaperone
