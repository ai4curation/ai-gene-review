  review:
    summary: EDTA inactivation and Mn2+ reactivation show a metal requirement; non-core.
    action: KEEP_AS_NON_CORE
    reason: The cited paper shows EDTA inactivation reversed by Mn2+, which supports a metal ion requirement
      but does not identify which metal binds where. The iron is accounted for by the [4Fe-4S] cluster
