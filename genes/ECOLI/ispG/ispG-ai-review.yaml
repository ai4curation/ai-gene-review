suggested_questions:
- question: Should GO add a carrier-neutral parent, 4-hydroxy-3-methylbut-2-enyl diphosphate synthase activity,
    over GO:0046429 (ferredoxin) and GO:0141197 (flavodoxin), so that InterPro and PAINT can annotate the
    whole IspG family without asserting an electron carrier?
- question: Which PTHR30454 lineages use ferredoxin rather than flavodoxin, and where on the tree should
    GO:0046429 and GO:0141197 be placed?
suggested_experiments:
- description: Compare kcat/Km of purified E. coli IspG with FldA versus E. coli Fdx and plant-type [2Fe-2S]
    ferredoxin under anaerobic conditions, to test whether the enzyme discriminates between carriers or
    whether the cellular supply of reduced FldA alone dictates the donor.
