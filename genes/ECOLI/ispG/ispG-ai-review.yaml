- description: Cytosolic [4Fe-4S] enzyme that uses electrons from reduced flavodoxin I to convert 2-C-methyl-D-erythritol
    2,4-cyclodiphosphate into (E)-4-hydroxy-3-methylbut-2-enyl diphosphate, step 5 of the MEP pathway
    to isopentenyl and dimethylallyl diphosphate.
