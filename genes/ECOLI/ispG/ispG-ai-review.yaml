id: P62620
gene_symbol: ispG
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: IspG (GcpE) is the cytosolic [4Fe-4S] enzyme that catalyses the fifth step of the
  2-C-methyl-D-erythritol 4-phosphate (MEP) pathway of isoprenoid precursor biosynthesis in Escherichia
  coli. It reductively opens the cyclic diphosphate ring of 2-C-methyl-D-erythritol 2,4-cyclodiphosphate
  to form (E)-4-hydroxy-3-methylbut-2-enyl diphosphate (HMBPP), the substrate of IspH. The two electrons
  are supplied by flavodoxin I (FldA), kept reduced by flavodoxin reductase and NADPH; the cluster is
  held by three conserved cysteines and is assembled with help of the isc machinery. The gene is essential
  because the MEP pathway is the only source of isopentenyl and dimethylallyl diphosphate in E. coli.
