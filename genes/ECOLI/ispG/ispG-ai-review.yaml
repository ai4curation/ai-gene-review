- term:
    id: GO:0046429
    label: 4-hydroxy-3-methylbut-2-en-1-yl diphosphate synthase activity (ferredoxin)
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - AGI_LocusCode:AT5G60600
  - PANTHER:PTN000765215
  - UniProtKB:P62620
  review:
    summary: The HMBPP synthase reaction is right, but the ferredoxin-specific term is wrong for the flavodoxin-coupled
      E. coli enzyme.
    action: MODIFY
    reason: 'GO:0046429 is defined with ferredoxin as electron acceptor (EC 1.17.7.1), whereas GO:0141197
      is the same C5 reaction with flavodoxin (EC 1.17.7.3); the two are siblings under GO:0052592, so this
      is a lateral correction of electron-carrier specificity, not a refinement. PAINT placed GO:0046429
      at the Bacteria root node PTN000765215 (2017, before GO:0141197 existed) from two seeds: the plastid
      Arabidopsis enzyme AT5G60600, which is ferredoxin dependent, and P62620, whose own IDA row used the
      only term then available although the assay used flavodoxin. The E. coli enzyme is reduced by flavodoxin
      in vitro and the essential flavodoxin FldA is required for HMBPP formation in vivo. The target''s
      appearance among the seeds is expected; the problem is the carrier-specific term at a node spanning
      flavodoxin- and ferredoxin-using lineages.'
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - LINEAGE_OR_TAXON_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN000765215
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Bacteria root node of PTHR30454 carrying the ferredoxin-specific term (IBD 2017); the
          HMBPP synthase reaction holds family-wide, the electron carrier does not.
      - source_id: AGI_LocusCode:AT5G60600
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Plastid Arabidopsis HDS, a ferredoxin-coupled enzyme; valid for the plant clade only.
      - source_id: UniProtKB:P62620
        source_status: SOURCE_BAD
        comment: The target's own IDA seed (PMID:16268586) used GO:0046429 for an assay run with flavodoxin;
          the seed should be GO:0141197. Its presence among the seeds is expected, not circular.
    proposed_replacement_terms:
    - id: GO:0141197
      label: 4-hydroxy-3-methylbut-2-enyl-diphosphate synthase activity (flavodoxin)
    supported_by:
    - reference_id: PMID:16268586
      supporting_text: With a mixture of flavodoxin, flavodoxin reductase, and NADPH as the reducing agent,
        stringent assay methods based on photometry or on 13C NMR detection of multiply 13C-labeled substrate/product
        ratios afforded catalytic activities greater than 60 nmol mg(-1) min(-1)
    - reference_id: PMID:15978585
      supporting_text: Disruption of fldA abrogated mevalonate-independent growth and dramatically decreased
        HMBPP levels.
    source_defects:
    - defect_type: WRONG_TERM
      resource: GO_CENTRAL
      record: PANTHER:PTN000765215
      requested_change: CHECK
      asserted_value: GO:0046429
      corrected_value: GO:0141197
      corrected_label: 4-hydroxy-3-methylbut-2-enyl-diphosphate synthase activity (flavodoxin)
      cause: SCOPE_OVER_REACH
      confidence: PROBABLE
      explanation: The ferredoxin-specific HMBPP synthase term sits on the Bacteria root node PTN000765215,
        so it propagates to flavodoxin-coupled proteobacterial IspG enzymes such as E. coli P62620. Consider
        restricting GO:0046429 to the plastid/ferredoxin clade (e.g. PTN000765210, which already carries
        chloroplast from AT5G60600) and placing GO:0141197 (created after the 2017 IBD) on the proteobacterial
        node PTN000765227, seeded by P62620 once its IDA row is repointed.
      supported_by:
      - reference_id: PMID:15978585
        supporting_text: the essential role for flavodoxin I in E. coli is in the MEP pathway for isoprenoid
          biosynthesis.
