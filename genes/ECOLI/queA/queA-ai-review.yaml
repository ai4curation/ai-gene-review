id: P0A7F9
gene_symbol: queA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  QueA is the cytoplasmic S-adenosylmethionine:tRNA ribosyltransferase-isomerase
  of Escherichia coli. Acting on preQ1-modified tRNA made by Tgt, it transfers
  the ribosyl moiety of S-adenosyl-L-methionine to the 7-aminomethyl group of
  preQ1 at position 34 and rearranges it into the epoxycyclopentanediol ring of
  epoxyqueuosine, releasing adenine and L-methionine. The monomeric enzyme
  follows an ordered sequential bi-ter mechanism in which preQ1-tRNA binds
  first. Its epoxyqueuosine-tRNA product is reduced to queuosine by QueG. queA
  mutants accumulate preQ1-tRNA and lack queuosine.
