suggested_questions:
- question: >-
    Is the radiation sensitivity of the queA knockout shared by tgt and queG
    knockouts, i.e. a consequence of queuosine loss rather than of QueA itself?
suggested_experiments:
- hypothesis: Radiation sensitivity of queA mutants results from the absence of tRNA queuosine.
  description: >-
    Compare UV and X-ray survival of queA, tgt and queG deletions and of a queA
    mutant complemented with catalytically inactive QueA.
