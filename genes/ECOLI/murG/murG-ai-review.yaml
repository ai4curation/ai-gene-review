id: P17443
gene_symbol: murG
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  MurG is the essential UDP-N-acetylglucosamine:lipid I N-acetylglucosaminyl
  transferase of Escherichia coli peptidoglycan synthesis. A glycosyltransferase
  family 28 (GT-B fold) enzyme, it transfers GlcNAc from UDP-GlcNAc to
  undecaprenyl-pyrophosphoryl-MurNAc-pentapeptide (lipid I, meso-diaminopimelate
  type) to form lipid II, the complete disaccharide-pentapeptide building block
  that is then flipped across the inner membrane by MurJ. MurG is a peripheral
  membrane protein bound to the cytoplasmic face of the inner membrane through
  its N-terminal acceptor-binding domain; it is distributed along the cell
  envelope with enrichment at the division site and associates with MraY and
  MreB, consistent with local supply of lipid II to the elongation and division
  peptidoglycan synthases. Loss of MurG rapidly halts peptidoglycan synthesis and
  causes lysis.
