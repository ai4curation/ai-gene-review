- term:
    id: GO:0050511
    label: undecaprenyldiphospho-muramoylpentapeptide beta-N-acetylglucosaminyltransferase
      activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN000470572
  - UniProtKB:P17443
  review:
    summary: PAINT propagates lipid I N-acetylglucosaminyltransferase activity across
      the MurG clade.
    action: MODIFY
    reason: >-
      The node placement is sound: E. coli MurG is inside the MurG clade and is
      itself an experimental seed for it (its presence in WITH/FROM is expected,
      not circular). However, GO:0050511 is defined on the L-lysine stem peptide
      (Gram-positive lipid I), whereas E. coli lipid I carries
      meso-diaminopimelate. The correct E. coli term is the sibling GO:0051991,
      which this gene already carries by EXP. The issue is the term's stem-peptide
      specificity at a node spanning both DAP- and Lys-type bacteria, not the
      inferred activity.
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - LINEAGE_OR_TAXON_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN000470572
        source_status: SUPPORTS_TRANSFER
        comment: >-
          The MurG clade node correctly carries lipid I GlcNAc transferase
          activity, but the chosen term is the L-Lys stem-peptide variant; the
          clade includes meso-diaminopimelate-type Gram-negative bacteria such as
          E. coli, for which the sibling GO:0051991 applies.
      - source_id: UniProtKB:P17443
        source_status: SUPPORTS_TRANSFER
        comment: >-
          E. coli MurG is an experimental seed for the node; its own data are for
          meso-diaminopimelate lipid I.
    proposed_replacement_terms:
    - id: GO:0051991
      label: UDP-N-acetyl-D-glucosamine:N-acetylmuramoyl-L-alanyl-D-glutamyl-meso-2,6-diaminopimelyl-D-alanyl-D-alanine-diphosphoundecaprenol
        4-beta-N-acetylglucosaminlytransferase activity
    supported_by:
    - reference_id: file:ECOLI/murG/murG-uniprot.txt
      supporting_text: Xref=Rhea:RHEA:31227
