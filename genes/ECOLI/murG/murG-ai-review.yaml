  title: Manual notes on Escherichia coli murG
  findings: []
core_functions:
- description: >-
    MurG transfers GlcNAc from UDP-GlcNAc to lipid I
    (undecaprenyl-PP-MurNAc-pentapeptide carrying meso-diaminopimelate) to form
    lipid II, the last cytoplasmic-face step of peptidoglycan subunit assembly.
    It acts as a peripheral protein on the cytoplasmic face of the inner
    membrane.
  molecular_function:
    id: GO:0051991
    label: UDP-N-acetyl-D-glucosamine:N-acetylmuramoyl-L-alanyl-D-glutamyl-meso-2,6-diaminopimelyl-D-alanyl-D-alanine-diphosphoundecaprenol
      4-beta-N-acetylglucosaminlytransferase activity
  directly_involved_in:
  - id: GO:0009252
    label: peptidoglycan biosynthetic process
  locations:
  - id: GO:0009898
    label: cytoplasmic side of plasma membrane
  supported_by:
  - reference_id: PMID:1649817
    supporting_text: In vitro assays for phospho-MurNAc-pentapeptide translocase and
      N-acetylglucosaminyl transferase activities finally confirm the identification
      of the murG gene product as the transferase that catalyzes the conversion of
      lipid intermediate I to lipid intermediate II in the peptidoglycan synthesis
      pathway.
  - reference_id: PMID:8449890
    supporting_text: we show that this enzyme is peripherally associated with the
      inner face of the cytoplasmic membrane
proposed_new_terms: []
suggested_questions:
- question: >-
    GO:0050511 (L-Lys lipid I) and GO:0051991 (meso-diaminopimelate lipid I) are
    siblings with no common MurG-specific parent, so a PAINT node spanning
    DAP- and Lys-type bacteria (PTN000470572) has to choose one stem-peptide
    variant. Should GO add a stem-peptide-agnostic lipid I
    N-acetylglucosaminyltransferase parent (EC 2.4.1.227 level) so MurG family
    nodes and modules can be annotated without implying a substrate?
- question: >-
    Is the division-site enrichment of MurG mediated by direct contacts with
    divisome proteins, by MraY, or by lipid I availability, and does MurG form
    distinct elongasome- and divisome-associated pools?
suggested_experiments:
- experiment_type: in vivo crosslinking and single-molecule imaging
  description: >-
    Map direct MurG contacts with MraY, MreB and late divisome proteins by
    site-specific photocrosslinking, and track MurG dynamics at midcell versus
    lateral wall in divisome- and MreB-depleted cells.
