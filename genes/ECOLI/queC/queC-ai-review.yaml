    label: zinc ion binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: enables
  supporting_entities:
  - UniRule:UR000081052
  review:
    summary: QueC enzymes bind one zinc ion per subunit.
    action: KEEP_AS_NON_CORE
    reason: The zinc site is conserved across the QueC family (HAMAP MF_01633) and zinc was found
      in the B. subtilis QueC structure and in purified enzyme; it is a cofactor-binding property of
