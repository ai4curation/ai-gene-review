    summary: Genetic analysis places E. coli QueC at a step leading to preQ0, the first
      deazapurine intermediate of queuosine synthesis.
    action: MODIFY
    reason: The claim is correct and the experiment was on the E. coli gene. GO:0008616 also
      covers queuine salvage; QueC acts only in de novo synthesis from GTP, which is the child term
      GO:0160253. The paper's own evidence (a queC deletion and complementation in a strain that
      makes queuosine from GTP) supports the de novo term. This follows the queE review in this
      repository.
