proposed_new_terms:
- proposed_name: 7-cyano-7-deazaguanine synthase activity
  proposed_definition: >-
    Catalysis of the reaction: 7-carboxy-7-deazaguanine + NH4(+) + 2 ATP = 7-cyano-7-deazaguanine
    + 2 AMP + 2 diphosphate + 2 H(+). The carboxylate is activated as an adenylate, converted to an
    amide with ammonia, re-adenylated and dehydrated to the nitrile (preQ0); the enzyme binds a
    structural zinc ion.
  justification: >-
    This is the activity of QueC (EC 6.3.4.20, RHEA:27982), the step that forms the nitrile of
    preQ0 in deazapurine/queuosine biosynthesis. GO has no matching molecular-function term: an OLS
    search for "7-cyano-7-deazaguanine synthase" returns only the process term GO:0097288, so QueC
    is annotated only to the general GO:0016879 carbon-nitrogen ligase class (checked 2026-11-24).
  proposed_parent:
    id: GO:0016879
    label: ligase activity, forming carbon-nitrogen bonds
  proposed_mappings:
  - predicate: skos:exactMatch
    target_term:
      id: RHEA:27982
      label: 7-carboxy-7-carbaguanine + NH4(+) + 2 ATP = 7-cyano-7-carbaguanine + 2 AMP + 2
        diphosphate + 2 H(+)
  supported_by:
  - reference_id: PMID:26391327
    supporting_text: 7-Cyano-7-deazaguanine synthase (E.C. 6.3.4.20) is an enzyme that catalyzes
      the formation of a nitrile from a carboxylic acid and ammonia at the expense of ATP.
suggested_questions:
- question: GO:0097288 (7-cyano-7-deazaguanine biosynthetic process) has no annotations in any
    species, yet QueC, QueD and QueE together make preQ0. Should the de novo queuosine genes be
    annotated to it, or should it be obsoleted in favour of GO:0160253?
suggested_experiments:
- hypothesis: E. coli QueC, like its Geobacillus and Bacillus orthologs, requires a structural
    zinc ion for folding and catalysis.
  description: Inductively coupled plasma analysis of purified recombinant E. coli QueC for zinc
    stoichiometry, with activity assays of the apo- and zinc-reconstituted enzyme.
