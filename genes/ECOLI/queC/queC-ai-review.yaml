  review:
    summary: High-throughput tandem-affinity co-purification of QueC with the elongation factor
      EF-Tu (TufA).
    action: REMOVE
    reason: Bare protein binding identifies no function. The partner, EF-Tu, is one of the most
      abundant proteins in E. coli and a frequent co-purifying protein in large affinity
      purification screens, and no functional consequence for preQ0 synthesis has been reported.
      Removed under the protein-binding policy.
