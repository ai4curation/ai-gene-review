id: P77756
gene_symbol: queC
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  QueC is the cytoplasmic 7-cyano-7-deazaguanine (preQ0) synthase of Escherichia coli, a
  zinc-containing enzyme of the PP-loop ATPase-like QueC family. It converts
  7-carboxy-7-deazaguanine (CDG), made from GTP by FolE, QueD and QueE, into the nitrile preQ0,
  using ammonium as the nitrogen donor and consuming two ATP, which are cleaved to AMP and
  pyrophosphate in two successive adenylation steps through a 7-amido-7-deazaguanine
  intermediate. preQ0 is then reduced by QueF to preQ1, which tRNA-guanine transglycosylase
  inserts at the wobble position 34 of tRNAs Asp, Asn, His and Tyr before maturation to
  queuosine. queC mutants lack queuosine-modified tRNA.
