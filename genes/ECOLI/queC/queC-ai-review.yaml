    id: GO:0005524
    label: ATP binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: enables
  supporting_entities:
  - UniRule:UR000081052
  review:
    summary: QueC binds ATP, which it consumes to activate the carboxylate of CDG.
    action: KEEP_AS_NON_CORE
    reason: ATP is a cosubstrate of the core reaction (two ATP are cleaved to AMP and
      pyrophosphate per preQ0 formed), and QueC carries the PP-loop ATP-binding motif. The binding
      is part of the catalytic activity rather than a separate function.
    supported_by:
    - reference_id: PMID:19354300
      supporting_text: ATP (2 mM) was required for the QueC and ToyM.
    - reference_id: PMID:26391327
