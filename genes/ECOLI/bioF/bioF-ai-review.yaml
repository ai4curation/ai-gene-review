id: P12998
gene_symbol: bioF
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  BioF is the 8-amino-7-oxononanoate synthase (AONS, also called KAPA synthase; EC 2.3.1.47) of
  Escherichia coli K-12. This cytoplasmic pyridoxal 5'-phosphate (PLP)-dependent enzyme belongs
  to the alpha-oxoamine synthase subfamily of class-II aminotransferase-fold enzymes, with
  5-aminolevulinate synthase, serine palmitoyltransferase and 2-amino-3-ketobutyrate CoA
  ligase. It catalyses the decarboxylative condensation of L-alanine with a pimeloyl thioester to
  give (8S)-8-amino-7-oxononanoate, CO2 and the free carrier. This is the first committed step of
  biotin ring assembly. Pimeloyl-ACP, made by the BioC-BioH modified fatty-acid synthesis
  route, is believed to be the physiological substrate, although the enzyme also uses
  pimeloyl-CoA in vitro. BioF is a symmetrical homodimer whose PLP is bound as an internal
  aldimine to Lys236. Crystal structures of the holoenzyme, the apoenzyme and the product
  external aldimine define its catalytic mechanism. The gene lies in the bioABFCD operon.
