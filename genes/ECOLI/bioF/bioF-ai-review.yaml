- term:
    id: GO:0008710
    label: 8-amino-7-oxononanoate synthase activity
  evidence_type: IDA
  original_reference_id: PMID:10642176
  qualifier: enables
  review:
    summary: >-
      Direct spectroscopic, kinetic and crystallographic characterisation of purified E. coli
      AONS with L-alanine and pimeloyl-CoA.
    action: ACCEPT
    reason: >-
      The defining activity, assayed on the purified enzyme. GO:0008710 is defined as "Catalysis
      of the reaction: L-alanine + H+ + pimelyl-CoA = 8-amino-7-oxononanoate + CO2 + CoA", which
      is exactly the reaction measured. The physiological acyl donor is probably pimeloyl-ACP,
      which BioF also uses; GO has no separate ACP-donor term, so the CoA-defined term is the
      best available (raised in suggested_questions).
    supported_by:
    - reference_id: PMID:10642176
      supporting_text: >-
        The first step in the reaction, L-alanine external aldimine formation, is rapid
    - reference_id: PMID:10642176
      supporting_text: >-
        Significant substrate quinonoid formation only occurs upon addition of pimeloyl-CoA to the
        preformed L-alanine external aldimine complex
    - reference_id: file:ECOLI/bioF/bioF-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: >-
        Can also use pimeloyl-CoA instead of pimeloyl-ACP as substrate, but it is believed that
        pimeloyl-ACP rather than pimeloyl-CoA is the physiological substrate of BioF.
