- term:
    id: GO:0042803
    label: protein homodimerization activity
  evidence_type: IDA
  original_reference_id: PMID:9813126
  qualifier: enables
  review:
    summary: >-
      Crystal structure showing that AONS is a symmetrical homodimer; UniProt also records the
      homodimer from three experimental papers.
    action: KEEP_AS_NON_CORE
    reason: >-
      Correct and experimentally shown. GO:0042803 is defined as "Binding to an identical
      protein to form a homodimer". Dimerisation is the structural context for the PLP active
      site, typical of fold-type I PLP enzymes, rather than the function the enzyme evolved for,
      so it is kept as non-core.
    supported_by:
    - reference_id: PMID:9813126
      supporting_text: >-
        The protein is a symmetrical homodimer with a tertiary structure and active site
        organisation similar to, but distinct from, those of other PLP-dependent enzymes whose
        three-dimensional structures are known.
