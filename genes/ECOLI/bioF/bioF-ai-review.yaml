- description: >-
    BioF catalyses the PLP-dependent decarboxylative condensation of L-alanine with pimeloyl-ACP
    (or pimeloyl-CoA) to (8S)-8-amino-7-oxononanoate, the first committed step of biotin ring
    assembly in E. coli.
