suggested_questions:
- question: >-
    GO:0008710 is defined with pimelyl-CoA as the acyl donor, but pimeloyl-ACP is thought to be
    the physiological substrate of E. coli BioF (RHEA:42288). Should the term definition be
    broadened to a pimeloyl thioester, or an ACP-donor term created?
