id: P30147
gene_symbol: hyi
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  hyi (also called gip or ybbG) encodes hydroxypyruvate isomerase, a cofactor-independent,
  homodimeric enzyme of the xylose isomerase-like TIM-barrel (Hyi/Gip) family. It catalyzes
  the reversible isomerization of 3-hydroxypyruvate and 2-hydroxy-3-oxopropanoate
  (tartronate semialdehyde) and is highly specific for this pair of substrates, showing no
  sugar isomerase or amino/hydroxy acid racemase activity. The gene lies immediately
  downstream of glyoxylate carboligase (gcl), whose product condenses two glyoxylate
  molecules into tartronate semialdehyde, and the protein is glyoxylate-inducible; Hyi
  therefore connects the tartronate semialdehyde node of glyoxylate catabolism with the
  hydroxypyruvate pool. The enzyme is presumably cytoplasmic. Its physiological direction
  and necessity are not established, since disruption of the gene does not prevent growth
  on glyoxylate or glycolate.
