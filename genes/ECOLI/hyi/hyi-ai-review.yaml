    label: protein homodimerization activity
  evidence_type: IDA
  original_reference_id: PMID:10561547
  qualifier: enables
  review:
    summary: The purified native enzyme (58 kDa) consists of two identical subunits, i.e.
      a homodimer. True, but a structural property rather than the enzyme's function.
    action: KEEP_AS_NON_CORE
    reason: >-
      The quaternary structure is directly reported in the cited paper and recorded in
      UniProt (SUBUNIT: Homodimer). Homodimerization is a structural feature of the
      active enzyme and does not describe its biological role, so it is kept as non-core
      in line with how homodimerization is treated for other E. coli enzymes in this
