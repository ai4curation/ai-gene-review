suggested_questions:
- question: In which direction does Hyi operate in vivo, i.e. does it divert tartronate
    semialdehyde from glyoxylate catabolism toward hydroxypyruvate, or channel
    hydroxypyruvate (e.g. from serine or other sources) into the glycerate pathway?
- question: Given that hyi is dispensable for growth on glyoxylate and glycolate, under
    what conditions does Hyi activity contribute to fitness?
suggested_experiments:
- description: >-
    Metabolomic flux analysis (13C-glyoxylate or 13C-hydroxypyruvate labeling) in
    wild-type and hyi deletion strains to determine the physiological direction and flux
    through the Hyi reaction.
  experiment_type: isotope tracing metabolomics
- description: >-
    Growth and competition assays of a hyi deletion mutant on hydroxypyruvate, serine or
    glycerate as carbon source, and in combination with glxR or garK deletions, to reveal
    conditions where Hyi becomes necessary.
  experiment_type: genetic interaction / phenotypic profiling
