  review:
    summary: Hyi interconverts hydroxypyruvate with tartronate semialdehyde, an
      intermediate of glyoxylate catabolism, and is encoded in the gcl locus.
    action: ACCEPT
    reason: >-
      The direct evidence is enzymatic (activity on tartronate semialdehyde, the
      glyoxylate-carboligase product) plus genomic context and glyoxylate induction.
      Together these place Hyi in glyoxylate metabolism at the pathway level, consistent
      with the IBA row for the same term. A knockout of orf258/hyi still grows on
      glyoxylate, so Hyi is a dispensable branch of the pathway rather than an essential
      step.
    supported_by:
