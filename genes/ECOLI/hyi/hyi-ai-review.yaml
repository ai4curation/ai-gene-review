- term:
    id: GO:0046487
    label: glyoxylate metabolic process
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN001740130
  - UniProtKB:P30147
  review:
    summary: Phylogenetic inference placing hydroxypyruvate isomerases in glyoxylate
      metabolism; consistent with the gcl-hyi gene arrangement and glyoxylate induction
      in E. coli.
    action: ACCEPT
    reason: >-
      Hyi acts on tartronate semialdehyde, the product of glyoxylate carboligase in the
      glycerate pathway of glyoxylate catabolism, and is encoded directly downstream of
      gcl. This pathway-level process is the appropriate level of specificity: the
      physiological direction of the Hyi reaction is not known, so a more specific
      catabolic term would over-commit. The process is not essential for growth on
      glyoxylate (disruption phenotype), which is noted but does not contradict
      participation; the main glyoxylate route proceeds via tartronate semialdehyde
      reductase (GlxR) rather than via hydroxypyruvate.
    supported_by:
    - reference_id: PMID:8440684
      supporting_text: catalyzes the condensation of two molecules of glyoxylate to give
        tartronic semialdehyde, a key intermediate in glyoxylate catabolism
    - reference_id: PMID:10561547
      supporting_text: which is located downstream of the glyoxylate carboligase gene
