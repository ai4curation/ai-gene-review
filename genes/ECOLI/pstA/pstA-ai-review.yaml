id: P07654
gene_symbol: pstA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli (strain K12)
description: >-
  PstA is a multi-pass inner-membrane permease subunit of the high-affinity
  PstSACB ABC phosphate importer. Together with the homologous PstC subunit it
  forms the transmembrane pathway that receives phosphate from periplasmic PstS
  and translocates it across the cytoplasmic membrane using the ATP-dependent
  power stroke supplied by PstB.
existing_annotations:
- term:
    id: GO:0005315
    label: phosphate transmembrane transporter activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN000764533
  - UniProtKB:P07654
  review:
    summary: PstA is a permease subunit of an assembled phosphate transporter.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      PAINT correctly places the PstA family in Pst phosphate transport, but the
      GO:0005315 term describes the assembled PstSACB transporter activity. A
      single PstA permease subunit contributes to that activity rather than
      independently enabling phosphate translocation; the correct contributes_to
      relationship is captured in core_functions.
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - ROLE_CONFLATION
      source_entities:
      - source_id: PANTHER:PTN000764533
        source_label: PANTHER:PTN000764533
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          The node-level inference supports the PstA permease family as part of
          phosphate import, but transfers the assembled transporter's enables
          relationship onto an individual permease subunit.
- term:
    id: GO:0005315
    label: phosphate transmembrane transporter activity
  evidence_type: IDA
  original_reference_id: PMID:3881386
  qualifier: enables
  review:
    summary: The pst region encodes PstA as an integral membrane part of the phosphate-specific system.
