suggested_questions:
- question: >-
    Which PstA helices contact PstS and PstC during ligand-gated phosphate
    passage through the E. coli PstSACB transporter?
suggested_experiments:
- experiment_type: structure-function mutagenesis
  description: >-
    Combine PstA helix-interface substitutions with reconstituted phosphate
    uptake and PstS docking assays to assign PstA residues to permease gating,
    PstC partnering, and PstS coupling.
