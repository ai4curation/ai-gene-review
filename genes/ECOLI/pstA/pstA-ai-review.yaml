    reason: >-
      Genetic complementation and sequence analysis support PstA as a
      phosphate-transport component, but GO:0005315 is enabled by the complete
      PstSACB complex; PstA contributes the transmembrane pathway with PstC, as
      recorded in core_functions.
    supported_by:
    - reference_id: PMID:3881386
      supporting_text: The pstA gene product appears to be an integral membrane protein.
