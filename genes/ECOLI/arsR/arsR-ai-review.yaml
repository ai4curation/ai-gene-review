- term:
    id: GO:0006351
    label: DNA-templated transcription
  evidence_type: EXP
  original_reference_id: PMID:8576202
  qualifier: acts_upstream_of_or_within
  review:
    summary: >-
      PMID:8576202 mapped the ars transcription start site and showed ArsR
      represses the operon in trans. ArsR does not carry out transcription; its
      experimentally shown role is negative regulation of transcription from the
      ars promoter.
    action: MODIFY
    reason: >-
      The underlying observation (ArsR controls ars transcription) is sound, but
      DNA-templated transcription describes the act of RNA synthesis by RNA
      polymerase. The precise claim the paper supports is negative regulation of
      DNA-templated transcription (GO:0045892), which the curator's own IDA row
      for regulation (GO:0006355) also points to. This is a lateral correction,
      not a rejection of the curator's evidence.
    proposed_replacement_terms:
    - id: GO:0045892
      label: negative regulation of DNA-templated transcription
    supported_by:
    - reference_id: PMID:8576202
      supporting_text: >-
        it was shown that ArsR is a trans-acting repressor that regulates
        expression of the chromosomal ars operon
