core_functions:
- description: >-
    Homodimeric As(III)/Sb(III)-responsive repressor of the arsRBC operon. ArsR
    binds the ars operator overlapping the -35 promoter element and represses
    transcription of its own gene and of arsB and arsC; binding of the
    trivalent metalloid to its Cys32/Cys34(/Cys37) site releases ArsR from DNA
    and derepresses the operon, so that arsenite exposure induces the arsenic
    detoxification genes.
