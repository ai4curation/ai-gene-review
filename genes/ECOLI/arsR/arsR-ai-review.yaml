- id: PMID:8576202
  title: The chromosomal arsR gene of Escherichia coli encodes a trans-acting metalloregulatory
    protein.
  findings:
  - statement: Purified ArsR binds a 33-nt operator over the -35 element and represses
      the chromosomal ars operon in trans; cross-regulates with R773 ArsR.
    supporting_text: >-
      the chromosomally-encoded repressor can regulate expression of the ars
      operon of plasmid R773, and the R773 repressor can cross-regulate
      expression from the chromosomal operon
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only cache; abstract directly describes K-12 ArsR DNA binding
      and repression.
- id: PMID:8764681
  title: Expression of the Escherichia coli chromosomal ars operon.
  findings:
  - statement: ars operon is induced by arsenite and negatively regulated by ArsR;
      transcribed as a single ~2100-nt mRNA.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only cache.
- id: PMID:9188467
  title: Dimerization is essential for DNA binding and repression by the ArsR metalloregulatory
    protein of Escherichia coli.
  findings:
  - statement: ArsR is a homodimer; dimerization is required for promoter binding
      and inducer response; an ~80-residue core suffices.
    supporting_text: >-
      These results suggest that a core sequence of about 80 residues has all
      of the information necessary for dimerization, repression, and metal
      recognition.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only cache; title says "ArsR metalloregulatory protein
      of Escherichia coli" and abstract refers to the ars operon of E. coli; the
      construct background (chromosomal vs R773) is not stated in the abstract.
- id: PMID:8621591
  title: The role of arsenic-thiol interactions in metalloregulation of the ars operon.
  findings:
  - statement: In R773 ArsR, As(III) is coordinated by Cys32, Cys34 and Cys37 (AsS3);
      Cys32 and Cys34 are required for induction. The same cysteine motif is present
      in K-12 ArsR (ELCVCDLC).
    supporting_text: >-
      These results suggest that all three cysteine thiolates are arsenic
      ligands
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Study of the plasmid R773 ArsR, not the chromosomal K-12 protein;
      used only as homology support for the metalloid-sensing mechanism.
- id: PMID:41562852
  title: 'Beyond Repression: ArsR Functions as a Global Activator of Metabolic and
    Redox Responses in Escherichia coli.'
  findings:
  - statement: Proteomics of arsRBC-deleted vs arsR-complemented K-12 suggests broader,
      possibly indirect, ArsR-dependent effects on metabolic and redox proteins.
    supporting_text: >-
      Our study shows that ArsR influences proteomic networks beyond the ars
      operon
  reference_review:
    relevance: MEDIUM
    correctness: LOW_QUALITY
    review_notes: Protein-abundance correlations only; no direct binding or promoter
      evidence for an activator role, so not used to support GO terms.
