- term:
    id: GO:0046685
    label: response to arsenic-containing substance
  evidence_type: IDA
  original_reference_id: PMID:7721697
  qualifier: acts_upstream_of_or_within
  review:
    summary: >-
      The chromosomal arsRBC operon is induced by arsenite at low
      concentrations and is required for arsenite/arsenate resistance. ArsR is
      the arsenite-sensing component that couples arsenic exposure to
      derepression of the operon.
    action: ACCEPT
    reason: >-
      ArsR is the As(III) sensor of the ars system, so its role in the cellular
      response to arsenic is core. The broad term is appropriate because the
      operon responds to arsenite and is needed for resistance to both arsenite
      and arsenate; ArsR also responds to antimonite, which a narrower
      arsenite-ion term would not cover.
    supported_by:
    - reference_id: PMID:7721697
      supporting_text: >-
        we have identified an Escherichia coli operon whose expression is
        induced by cellular exposure to sodium arsenite
    - reference_id: PMID:8764681
      supporting_text: >-
        the operon was rapidly induced by sodium arsenite and negatively
        regulated by the trans-acting arsR gene product
