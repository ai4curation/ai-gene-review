  label: Escherichia coli K-12
description: >-
  ArsR is the 117-residue transcriptional repressor of the chromosomal arsRBC
  arsenical resistance operon of Escherichia coli, a member of the ArsR/SmtB
  family of winged helix-turn-helix metalloregulators. ArsR binds as a homodimer
  to a 33-nucleotide operator overlapping the -35 element of the ars promoter,
  repressing its own transcription together with that of arsB (arsenite efflux
  permease) and arsC (arsenate reductase). Trivalent metalloids (arsenite and
  antimonite) are the inducers; by homology with the plasmid R773 repressor,
  As(III) is bound by the thiolates of the conserved Cys32/Cys34/Cys37 motif,
  and binding to Cys32 and Cys34 triggers the conformational change that
  releases ArsR from DNA. Derepression of the operon on arsenite exposure
  confers low-level resistance to arsenite and arsenate. Proteomic data suggest
  additional, possibly indirect, effects of ArsR on metabolic and redox
  proteins beyond the ars operon.
