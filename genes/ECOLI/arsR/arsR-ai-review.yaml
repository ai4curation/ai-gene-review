suggested_questions:
- question: >-
    Does the chromosomal K-12 ArsR use the same Cys32/Cys34/Cys37 As(III)
    site as the R773 repressor, and does it respond to arsenate directly or only
    after ArsC reduces it to arsenite?
  experts:
  - bacterial metalloregulation biochemist
- question: >-
    Are the ArsR-dependent proteome changes reported in arsR-complemented
    strains direct (ArsR operator sites outside the ars operon) or secondary
    to ars operon expression and arsenic handling?
  experts:
  - bacterial transcriptional regulation specialist
suggested_experiments:
- description: >-
    Site-directed mutagenesis of Cys32, Cys34 and Cys37 in the chromosomal
    K-12 ArsR, with in vitro DNA-release assays and X-ray absorption
    spectroscopy, to confirm the metalloid-binding site directly in this
    protein.
  experiment_type: site-directed mutagenesis
- description: >-
    ChIP-seq of ArsR in K-12 with and without arsenite to determine whether
    ArsR binds any operators outside the arsRBC promoter, testing the proposed
    global regulatory role.
  experiment_type: ChIP-seq
