description: >-
  NCBI PGAP made no GO or EC predictions for WP_000008957.1, so the predictions
  list is empty. PGAP takes a protein's GO terms only from the single evidence
  model that assigns its name. Here the name "As(III)-sensing metalloregulatory
  transcriptional repressor ArsR" comes from BlastRule NBR009015, and that rule
  carries no GO terms. The protein also matches the NCBIfam ArsR/SmtB family
  models NF007528 and NF033788 and the ArsR HTH domain model NF013209, each of
  which carries GO:0003700 DNA-binding transcription factor activity and
  GO:0006355 regulation of DNA-templated transcription, but because none of them
  named the protein their GO terms are discarded. Given the review of this gene,
  the absence is a recall failure. ArsR is an experimentally characterised
  DNA-binding repressor of the arsRBC operon (PMID:8576202, PMID:8764681), so
  both discarded family terms are true. They are general: the review refines
  them to GO:0141096 ligand-modulated transcription repressor activity and
  GO:0045892 negative regulation of DNA-templated transcription. Even so,
  passing them on would have given correct annotations at no precision cost,
  while the more specific naming rule (whose product name already states
  "transcriptional repressor" and "As(III)-sensing") has no GO terms at all. A
  GO mapping on NBR009015 to GO:0141096 (or at least GO:0001217 DNA-binding
  transcription repressor activity) and GO:0046685 response to
  arsenic-containing substance would recover the core function.
