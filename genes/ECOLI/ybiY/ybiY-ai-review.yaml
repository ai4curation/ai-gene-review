core_functions:
- description: >-
    Predicted activase for the glycyl radical enzyme YbiW (1,5-anhydroglucitol-6-phosphate
    C-O lyase). YbiY would install the glycyl radical on the YbiW Gly loop by reductive
    cleavage of S-adenosyl-L-methionine on its radical SAM [4Fe-4S] cluster. Inferred from
    family membership and from the coupling of ybiY to ybiW, not directly demonstrated.
  molecular_function:
    id: GO:0043364
    label: glycyl-radical enzyme activating activity
  locations:
  - id: GO:0005737
    label: cytoplasm
  supported_by:
  - reference_id: file:ECOLI/pflC/pflC-bioinformatics/RESULTS.md
    supporting_text: ybiY starts 5 bp after ybiW
  - reference_id: PMID:39283600
    supporting_text: YbiW and PflD catalyze ring-opening C-O cleavage of
      1,5-anhydroglucitol-6-phosphate (AG6P) and 1,5-anhydromannitol-6-phosphate
      (AM6P), respectively
knowledge_gaps:
- gap_statement: >-
    It is unknown whether YbiY activates YbiW in vivo, and whether it is the only activase
    able to do so: PflC, which serves the YbiW paralogue PflD, could also act on YbiW,
    since the two lyases share an identical Gly loop.
  boundary: >-
    YbiW is an established glycyl radical C-O lyase of 1,5-anhydroglucitol 6-phosphate.
    ybiY is directly downstream of ybiW. YbiY and PflC are paralogous activases (37%
    identity), and YbiW and PflD share the Gly-loop heptamer RVAGYSA. YbiY has not been
    purified, its cluster content has not been measured, and no deletion phenotype has
    been reported.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: >-
    This decides whether YbiW activation in vivo depends on YbiY specifically, on PflC, or
    on redundancy between them, which matters for engineering anhydroglycolysis and for
    interpreting ybiY deletions.
  resolution: >-
    Purify YbiY anaerobically, reconstitute its [4Fe-4S] cluster, and assay SAM-dependent
    glycyl-radical installation on YbiW by EPR and activity. Test ybiY and pflC single and
    double deletions for anaerobic growth on 1,5-anhydroglucitol and 1,5-anhydromannitol.
  provenance:
  - reference_id: file:ECOLI/pflC/pflC-bioinformatics/RESULTS.md
    supporting_text: PflD and YbiW share one Gly-loop heptamer, RVAGYSA
suggested_questions:
- question: >-
    Which activase installed the glycyl radical on YbiW in the anhydroglycolysis study
    (PMID:39283600): YbiY, PflC, or a non-native activase? The very low in vitro radical
    loading (0.02 per monomer) may reflect use of a non-cognate activase.
- question: >-
    Can YbiY and PflC cross-activate YbiW and PflD, given that the two lyases share the
    Gly-loop heptamer RVAGYSA?
suggested_experiments:
- hypothesis: YbiY is the cognate activase of YbiW and installs its glycyl radical.
  description: >-
    Mix anaerobically reconstituted YbiY with YbiW plus SAM, reduced flavodoxin and a
    reductant. Detect the YbiW glycyl radical by EPR and assay 1,5-anhydroglucitol-6-phosphate
    C-O lyase activity, comparing YbiY, PflC and PflA as the activase.
  experiment_type: in vitro enzymology
- hypothesis: YbiY is required for anaerobic growth on 1,5-anhydroglucitol.
  description: >-
    Construct ybiY, pflC and ybiY pflC deletions and test anaerobic growth on
    1,5-anhydroglucitol and 1,5-anhydromannitol as sole carbon source.
  experiment_type: genetic
