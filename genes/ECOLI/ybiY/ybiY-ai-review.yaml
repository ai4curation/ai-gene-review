- term:
    id: GO:0043365
    label: '[formate-C-acetyltransferase]-activating enzyme activity'
  evidence_type: IEA
  original_reference_id: GO_REF:0000003
  qualifier: enables
  supporting_entities:
  - EC:1.97.1.4
  review:
    summary: >-
      EC-to-GO mapping from UniProt's EC 1.97.1.4. That EC rests on the historical name
      "pyruvate formate-lyase 3" for the partner, and the function line is by similarity
      only. GO:0043365 is the PFL-specific child of GO:0043364 and names [formate
      C-acetyltransferase]-glycine as its substrate.
    action: REMOVE
    reason: >-
      Wrong substrate: a demonstrably incorrect EC/IEA mapping. The partner GRE YbiW is a
      C-O lyase of 1,5-anhydroglucitol 6-phosphate, not a formate C-acetyltransferase
      (PMID:39283600); its Gly loop (RVAGYSA) differs from the PFL/TdcE loop (RVSGYAV), and
      activase specificity follows the Gly loop (PMID:42361324). No experiment shows YbiY
      activating PFL, which is served by PflA. Aligned with the pflA/nrdG reviews
      (GO:0043365 is correct only when the substrate is PflB): the PflB-specific child is
      removed, and the correct general activase activity GO:0043364 is retained on the IBA
      and Rhea rows.
    supported_by:
    - reference_id: PMID:39283600
      supporting_text: The model bacterium Escherichia coli MG1655 contains two GREs of
        unknown function, YbiW and PflD
    - reference_id: PMID:42361324
      supporting_text: These results suggest that GRE-AE specificity for its partner GRE
        is dependent upon Gly loop sequence.
    - reference_id: file:ECOLI/pflC/pflC-bioinformatics/RESULTS.md
      supporting_text: PflD and YbiW share one Gly-loop heptamer, RVAGYSA, which differs
        from the PFL/TdcE loop (RVSGYAV) at three of seven positions.
    - reference_id: file:ECOLI/ybiY/ybiY-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: 'FUNCTION: Activation of pyruvate formate-lyase 2 under anaerobic
        conditions by generation of an organic free radical'
