id: P75794
gene_symbol: ybiY
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  YbiY is a cytoplasmic radical S-adenosyl-L-methionine (SAM) enzyme of the
  glycyl-radical-enzyme activase family, a paralogue of the pyruvate formate-lyase
  activating enzyme PflA and of PflC. It has a radical SAM domain with the CX3CX2C
  [4Fe-4S] cluster-binding motif. ybiY is encoded immediately downstream of, and on the
  same strand as, ybiW in a two-gene unit. YbiW is a glycyl radical enzyme that catalyses
  ring-opening C-O cleavage of 1,5-anhydroglucitol 6-phosphate to 1-deoxyfructose
  6-phosphate, the first step of an anaerobic "anhydroglycolysis" pathway that lets
  E. coli grow on 1,5-anhydroglucitol. By analogy with PflA and its family, YbiY is
  expected to install the glycyl radical on YbiW, by reductive cleavage of SAM to a
  5'-deoxyadenosyl radical that abstracts a hydrogen atom from the YbiW Gly-loop glycine.
  YbiY and PflC are the paralogous activases of the two paralogous
  anhydrohexitol-phosphate lyases YbiW and PflD, which share a Gly-loop sequence distinct
  from that of pyruvate formate-lyase. No activity of YbiY itself has been demonstrated,
  and there is no evidence that it activates pyruvate formate-lyase.
