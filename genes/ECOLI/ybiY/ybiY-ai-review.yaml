  review:
    summary: >-
      PAINT IBA from PTN001251485 in PTHR30352, grounded in E. coli PflA (P0A9N4) and NrdG
      (P0A9N8), both with established activase activity. The node asserts only the general
      activity (generation of a glycyl radical on a partner GRE), not a particular substrate
      GRE.
    action: ACCEPT
    reason: >-
      The node placement is sound. Every characterised member of this family is a GRE
      activase, and YbiY is inside the clade with no sign of loss: the radical SAM cysteine
      triad and SAM-binding residues are conserved. Genome context fits: ybiY is directly
      downstream of the GRE gene ybiW on the same strand, the arrangement of pflB-pflA and
      nrdD-nrdG (file:ECOLI/pflC/pflC-bioinformatics/RESULTS.md). YbiW is a bona fide GRE
      whose radical-dependent C-O lyase activity was demonstrated (PMID:39283600). The term
      names no substrate, so it is the right level. YbiY's activase activity has not been
      directly shown, but this inference is as strong as sequence and context can make it.
