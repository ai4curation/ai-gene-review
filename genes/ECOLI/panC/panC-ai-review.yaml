id: P31663
gene_symbol: panC
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  panC (b0133) encodes pantothenate synthetase (pantoate--beta-alanine ligase), which condenses (R)-pantoate
  with beta-alanine in an ATP-dependent reaction through an enzyme-bound pantoyl-adenylate intermediate,
  forming (R)-pantothenate (vitamin B5). The E. coli enzyme is a soluble cytosolic homodimer whose N-terminal
  Rossmann-fold domain belongs to the cytidylyltransferase (HIGH-motif) superfamily and carries the active
  site, with a C-terminal hinged lid domain. panC mutants lack pantothenate synthetase and require pantothenate
  for growth. Pantoate binding to the ATP site underlies homotropic substrate inhibition.
