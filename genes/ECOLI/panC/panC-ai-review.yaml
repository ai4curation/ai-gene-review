- term:
    id: GO:0042802
    label: identical protein binding
  evidence_type: IPI
  original_reference_id: PMID:16858726
  qualifier: enables
  supporting_entities:
  - UniProtKB:P31663
  review:
    summary: PanC is a homodimer; identical protein binding is true but structural rather than catalytic.
    action: KEEP_AS_NON_CORE
    reason: >-
      The crystal structure and the NMR/X-ray study of the N-terminal domain show a dimeric enzyme, and
      self-interaction was also recovered in complexome and E. coli interolog screens. Self-association
      is a property of the enzyme, not its biological activity.
    supported_by: &id005
    - reference_id: PMID:11377204
      supporting_text: The enzyme is dimeric, with two well-defined domains per protomer
    - reference_id: PMID:20059543
      supporting_text: The tertiary structure of the dimeric N-terminal domain of Escherichia coli pantothenate
        synthetase
