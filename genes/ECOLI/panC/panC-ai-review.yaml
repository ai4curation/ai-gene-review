suggested_questions:
- question: >-
    Does homotropic inhibition by pantoate binding in the ATP site limit pantothenate flux in vivo at
    physiological pantoate concentrations?
suggested_experiments:
- description: >-
    Engineer an ATP-site variant that excludes pantoate without impairing ATP binding and test whether
    it raises pantothenate output in E. coli.
  experiment_type: site-directed mutagenesis with metabolite profiling
