- term:
    id: GO:0062077
    label: phenylacetyl-CoA 1,2-epoxidase complex
  evidence_type: IPI
  original_reference_id: PMID:21247899
  qualifier: part_of
  review:
    summary: >-
      PaaE is the reductase component of the epoxidase system. In the cited
      E. coli study PaaE was required for activity but no stable complex
      between MBP-PaaE and PaaABC was detected; in the Pseudomonas sp. Y2
      ortholog system PaaE co-purified with PaaABC.
    action: ACCEPT
    reason: >-
      Membership of PaaE in the functional epoxidase system is well supported
      (required for activity; co-purifies with PaaA, PaaB and PaaC in the
      Y2 ortholog). The E. coli association is probably transient, as is
      usual for reductase components of multicomponent monooxygenases; the
      curator's experimental annotation is retained.
    supported_by:
    - reference_id: PMID:20660314
      supporting_text: >-
        Subunits PaaB, PaaC, and PaaE copurified with PaaA, whereas PaaD, a
        suspected subunit of this complex, eluted separately.
    - reference_id: PMID:21247899
      supporting_text: >-
        In vitro reconstitution of the oxygenase subunits showed that each of
        the PaaA, B, C, and E subunits are necessary for catalysis, whereas
        PaaD is not essential.
