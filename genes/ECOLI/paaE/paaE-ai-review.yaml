suggested_questions:
- question: >-
    Does PaaE transfer electrons directly to the PaaA di-iron centre (which
    lies close to the surface in the PaaAC structure), or via PaaB, and how
    transient is the PaaE-PaaABC association in E. coli?
suggested_experiments:
- description: >-
    Express PaaE untagged (or with a cleavable tag) together with PaaD, then
    measure stopped-flow electron transfer from NADPH-reduced PaaE to
    PaaABC and test PaaE-PaaABC association by crosslinking or native MS.
