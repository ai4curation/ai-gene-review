gene_symbol: paaE
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  PaaE is the reductase component of the multicomponent phenylacetyl-CoA
  1,2-epoxidase (PaaABCE) of Escherichia coli, the ring-activating enzyme of
  the aerobic phenylacetate catabolic pathway encoded by the paa operon. It
  is a class IA reductase with an N-terminal FAD-binding/NAD(P)-binding
  ferredoxin-reductase module and a C-terminal plant-type [2Fe-2S]
  ferredoxin domain, an arrangement unlike the class IB or class III
  reductases of other bacterial multicomponent monooxygenases. PaaE
  oxidizes NAD(P)H, preferring NADPH and FAD, and is thought to pass
  electrons via its flavin and [2Fe-2S] cluster to the di-iron centre of
  the catalytic PaaA subunit; it can also reduce cytochrome c in vitro.
  PaaE is required for epoxidase activity in reconstitution assays and for
  efficient ring hydroxylation and growth on phenylacetate in vivo.
