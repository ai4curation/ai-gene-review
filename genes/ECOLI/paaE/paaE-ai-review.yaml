  - UniProtKB:Q9HTF3
  review:
    summary: >-
      Correct but very general. PaaE is an NAD(P)H-oxidizing reductase
      (NADPH preferred) shown experimentally to reduce cytochrome c and
      required to drive the PaaA oxygenase.
    action: MODIFY
    reason: >-
      The evidence supports the more specific descendant GO:0016651
      oxidoreductase activity, acting on NAD(P)H: PaaE activity depends on
      NADPH (8.5-fold over NADH) and it reduces cytochrome c. No GO term
      exists for the physiological electron transfer to the PaaA di-iron
      site, so the NAD(P)H-acting parent is the most specific accurate
      term.
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - GRANULARITY_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN005342051
        source_status: SUPPORTS_TRANSFER
        comment: >-
          The ancestral node correctly places PaaE among NAD(P)H-dependent
          FAD/ferredoxin reductases; the transferred term is only less
          specific than PaaE's own experimental data support.
    proposed_replacement_terms:
    - id: GO:0016651
      label: oxidoreductase activity, acting on NAD(P)H
    supported_by:
    - reference_id: PMID:21247899
      supporting_text: >-
        The PaaE subunit is a reductase with a preference for NADPH and FAD,
        capable of reducing cytochrome c
    - reference_id: PMID:21247899
      supporting_text: >-
        The measured activity was 8.5 times higher in the presence of NADPH
        than in the presence of NADH and 3 times higher in the presence of FAD
        than in the presence of FMN
