- term:
    id: GO:0032790
    label: ribosome disassembly
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: involved_in
  supporting_entities:
  - ARBA:ARBA00085926
  review:
    summary: >-
      ARBA prediction; experimentally supported in E. coli, where IF3 stabilizes
      subunits split by RRF and EF-G.
    action: KEEP_AS_NON_CORE
    reason: >-
      IF3 does part of the work of stable 70S dissociation after termination: it
      binds the transiently released 30S subunit and blocks re-association, and the
      amount of IF3 determines the extent of dissociation. RRF and EF-G perform the
      splitting itself, and IF3 alone dissociates 70S only under non-physiological
      conditions, so this is a genuine but secondary role relative to initiation
      (the anti-association activity serves both).
    supported_by:
    - reference_id: PMID:16043510
      supporting_text: >-
        IF3 stabilizes the dissociation by binding to the transiently formed 30S
        subunits, preventing re-association back to 70S ribosomes.
    - reference_id: PMID:16043510
      supporting_text: >-
        The ribosome dissociation activity of IF3 by itself can be observed only
        under nonphysiological conditions
