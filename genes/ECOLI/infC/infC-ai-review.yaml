- term:
    id: GO:1990145
    label: maintenance of translational fidelity
  evidence_type: IMP
  original_reference_id: PMID:8858589
  qualifier: involved_in
  review:
    summary: >-
      Proposed: IF3 suppresses initiation errors, discriminating against
      non-canonical start codons in vivo and against non-initiator tRNAs in vitro.
    action: NEW
    reason: >-
      IF3 itself performs the discrimination step: it destabilizes 30S complexes with
      any tRNA, so that only the correct initiator codon-anticodon pairing survives,
      and IF3 mutants increase initiation at class II codons 3-5-fold in vivo. The
      participation test is met (IF3 does the work; Y107/K110 30S-binding mutants
      lose fMet-tRNA selection). Comparator check: yeast eIF1 (SUI1, P32911), the
      eukaryotic start-codon fidelity factor, carries GO:1990145 by IMP (QuickGO,
      2026-11-13), so the term is used for this role. No term in GOA for infC
      expresses this function, and it is not an ancestor or descendant of
      translational initiation.
    supported_by:
    - reference_id: PMID:8858589
      supporting_text: >-
        Therefore, IF3 is generally able to discriminate between efficient and
        inefficient codons in vivo, consistent with earlier in vitro observations.
    - reference_id: PMID:16857585
      supporting_text: >-
        uniform destabilization of the binding of all tRNAs to the 30S subunit by
        IF3
    - reference_id: PMID:1457399
      supporting_text: >-
        dissociation of complexes containing noninitiator tRNAs requires prior
        binding of IF3 to the ribosomes
