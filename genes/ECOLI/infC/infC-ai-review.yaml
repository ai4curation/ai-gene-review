id: P0A707
gene_symbol: infC
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  Translation initiation factor IF3 is a 180-residue, two-domain protein (N- and
  C-terminal domains joined by a flexible linker) that binds the 30S ribosomal
  subunit in the cytosol. Its C-terminal domain sits on the 30S platform at the
  position occupied by 23S rRNA helix 69 in the 70S ribosome, so IF3 acts as an
  anti-association factor that keeps 30S and 50S subunits apart and maintains the
  pool of free 30S subunits on which initiation begins; after termination it
  binds 30S subunits transiently released by RRF and EF-G and prevents their
  re-association during ribosome recycling. Its N-terminal domain lies near the
  E site and initiator tRNA. IF3 is the principal fidelity factor of bacterial
  initiation: it destabilizes 30S complexes carrying non-initiator tRNAs or
  non-canonical start codons, so that efficient start codons (AUG, GUG, UUG) are
  selected; its own gene begins with the poor start codon AUU, which limits IF3
  expression. IF3 also strongly favours translation of cold-shock mRNAs after
  temperature downshift. IF3 has no orthologue in archaea or in the eukaryotic
  cytosol (where eIF1 plays an analogous but unrelated start-codon role), but its
  family includes the mitochondrial (MTIF3) and chloroplast IF3 proteins of
  eukaryotes.
