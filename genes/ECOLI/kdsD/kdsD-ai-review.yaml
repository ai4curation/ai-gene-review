gene_symbol: kdsD
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  KdsD (formerly YrbH) is the housekeeping D-arabinose 5-phosphate isomerase of Escherichia coli. It reversibly
  interconverts D-ribulose 5-phosphate and D-arabinose 5-phosphate, supplying the first dedicated intermediate
  of 3-deoxy-D-manno-octulosonate (KDO) biosynthesis, which feeds the KDO residues of the lipopolysaccharide
  inner core. The protein has an N-terminal SIS sugar-isomerase domain and two C-terminal CBS domains,
  forms a homotetramer, and is inhibited by low micromolar zinc. KdsD is not essential because the paralogous
  isomerase GutQ can supply arabinose 5-phosphate.
