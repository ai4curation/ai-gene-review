  label: Escherichia coli K-12
description: >-
  PncB is the nicotinate phosphoribosyltransferase (NAPRTase) of Escherichia coli K-12. It transfers the
  phosphoribosyl group of 5-phospho-alpha-D-ribose 1-diphosphate (PRPP) to nicotinate, forming nicotinate
  D-ribonucleotide (NaMN), with ATP hydrolysis coupled to the reaction through a transient phosphohistidine
  intermediate. PncB is the entry step of the Preiss-Handler salvage route, which recycles nicotinate
  made from nicotinamide by the nicotinamidase PncA, and its NaMN product is completed to NAD+ by NadD
  and NadE. Raising PncB activity increases intracellular NAD levels, and nicotinate represses its expression.
