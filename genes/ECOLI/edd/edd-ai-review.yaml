- id: PMID:1846355
  title: Superoxide sensitivity of the Escherichia coli 6-phosphogluconate dehydratase.
  full_text_unavailable: true
  findings:
  - statement: >-
      E. coli 6-phosphogluconate dehydratase is rapidly inactivated by superoxide, iron chelators
      and oxidants, consistent with an exposed iron-sulfur cluster.
    supporting_text: >-
      Iron chelators, thiol-reactive reagents, and oxidants, including nitrite and diamide,
      inactivated the enzyme.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract checked; direct assays of the E. coli enzyme.
- id: PMID:5337844
  title: Glucose and gluconate metabolism in a mutant of Escherichia coli lacking
    gluconate-6-phosphate dehydrase.
  full_text_unavailable: true
  findings:
  - statement: >-
      An edd mutant lacks the dehydrase, metabolizes gluconate only by the hexose monophosphate
      shunt and grows more slowly on gluconate, but normally on glucose.
    supporting_text: >-
      The mutant grew on gluconate with a doubling time of 155 min, compared with the parent
      strain's 56 min.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract checked; establishes the in vivo role of edd in gluconate catabolism.
- id: PMID:1624451
  title: 'Molecular characterization of the Entner-Doudoroff pathway in Escherichia coli:
    sequence analysis and localization of promoters for the edd-eda operon.'
  full_text_unavailable: true
  findings:
  - statement: >-
      edd and eda form an operon induced on gluconate from the GntR-regulated P1 promoter.
    supporting_text: >-
      P1, located upstream of edd, appears to be the primary gluconate-responsive promoter of
      the edd-eda operon, responsible for induction of the Entner-Doudoroff pathway, as
      mediated by the gntR product.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract checked.
