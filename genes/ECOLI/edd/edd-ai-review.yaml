    id: GO:0051539
    label: 4 iron, 4 sulfur cluster binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: enables
  supporting_entities:
  - UniRule:UR000683091
  review:
    summary: >-
      Edd binds one [4Fe-4S] cluster, the catalytic cofactor of IlvD/Edd dehydratases.
    action: ACCEPT
    reason: >-
      The cluster ligands are conserved with E. coli IlvD, and the biochemistry of Edd matches an
      exposed Fe-S cluster: inactivation by superoxide, iron chelators and oxidants, and
      membership of the H2O2-sensitive [4Fe-4S] dehydratase family. The cluster is required for
      the dehydration chemistry, so this binding is part of the catalytic function.
    supported_by:
    - reference_id: PMID:1846355
      supporting_text: >-
        The O2(-)-sensitive target site is proposed to be an iron-sulfur cluster which is
        readily destroyed by oxidation.
    - reference_id: file:ECOLI/edd/edd-uniprot.txt
      record_section: ["CC:COFACTOR"]
      supporting_text: Note=Binds 1 [4Fe-4S] cluster.
