  label: Escherichia coli K-12
description: >-
  edd (b1851) encodes 6-phosphogluconate dehydratase, the first enzyme of the Entner-Doudoroff
  pathway in Escherichia coli. This cytosolic member of the IlvD/Edd family of [4Fe-4S]
  hydro-lyases dehydrates 6-phospho-D-gluconate to 2-dehydro-3-deoxy-6-phospho-D-gluconate
  (KDPG), which the next enzyme, Eda, cleaves to pyruvate and glyceraldehyde 3-phosphate. edd
  is cotranscribed with eda and induced by growth on gluconate under GntR control. In E. coli
  the pathway serves gluconate catabolism rather than glucose catabolism; an edd mutant routes
  gluconate through the oxidative pentose phosphate pathway and grows about three times slower
  on gluconate. The exposed iron-sulfur cluster makes the enzyme highly sensitive to
  inactivation by superoxide and by micromolar hydrogen peroxide.
