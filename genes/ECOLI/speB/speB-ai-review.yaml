  review:
    summary: SpeB requires bound Mn2+ for activity.
    action: KEEP_AS_NON_CORE
    reason: >-
      Metal-free enzyme was active only with added Mn2+, and EDTA-treated enzyme retained
      about one Mn2+ per subunit, supporting manganese binding at a binuclear site. Cofactor
      binding supports the core activity rather than being the function itself.
    supported_by:
