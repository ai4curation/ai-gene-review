  label: Escherichia coli K-12
description: >-
  SpeB is the agmatinase (agmatine ureohydrolase, EC 3.5.3.11) of Escherichia coli, a binuclear-manganese
  ureohydrolase of the arginase family that hydrolyses agmatine to putrescine and urea. Acting
  on the agmatine made by biosynthetic arginine decarboxylase (SpeA), it completes the two-reaction
  arginine route to putrescine, the precursor of spermidine. The purified enzyme has a millimolar
  Km for agmatine, requires Mn2+ for activity, and forms hexamers in solution and in its crystal
  structure. It is a soluble cytosolic protein whose expression is induced by agmatine and
  repressed by cAMP-CRP.
