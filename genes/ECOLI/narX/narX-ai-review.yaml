id: P0AFA2
gene_symbol: narX
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  NarX is a sensor histidine kinase anchored in the E. coli inner membrane by
  two transmembrane helices, and one of two nitrate/nitrite sensors (with the
  paralog NarQ) of the Nar two-component regulatory system that controls
  anaerobic respiratory and fermentative gene expression. Its periplasmic
  four-helix-bundle sensor domain, built around the conserved P-box, binds
  nitrate at the dimer interface; ligand binding produces a piston-type
  displacement of the sensor helices that is relayed through the HAMP domain to
  the cytoplasmic HisKA_3 dimerization/phosphotransfer and HATPase_c catalytic
  domains. Nitrate (strongly) and nitrite (more weakly) stimulate ATP-dependent
  autophosphorylation of the conserved histidine, and the phosphoryl group is
  transferred to the receiver aspartate of the response regulator NarL (and
  NarP), activating NarL-dependent transcription of genes such as narGHJI and
  narK. In the absence of stimulus NarX acts as a transmitter phosphatase that
  accelerates dephosphorylation of NarL-phosphate, a reaction that depends on a
  conserved DxxxQ motif adjacent to the phospho-accepting histidine. NarX and
  NarQ are functionally redundant for nitrate-dependent regulation but differ in
  how they discriminate nitrate from nitrite.
