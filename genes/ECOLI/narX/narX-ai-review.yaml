- term:
    id: GO:0042803
    label: protein homodimerization activity
  evidence_type: IDA
  original_reference_id: PMID:19217390
  qualifier: enables
  review:
    summary: >-
      Crystal structures of the NarX periplasmic sensor domain show a
      nitrate-bound dimer with nitrate at the dimer interface.
    action: KEEP_AS_NON_CORE
    reason: >-
      The sensor domain crystallises as a symmetric dimer with an extensive
      P-box interface that binds nitrate, consistent with the homodimeric
