proposed_new_terms:
- proposed_name: phospho-response regulator phosphatase activity
  proposed_definition: >-
    Catalysis of the hydrolysis of the phosphoryl group from the phosphorylated
    aspartate residue of a two-component response regulator receiver domain,
    when performed by the cognate sensor (transmitter phosphatase activity).
  justification: >-
    Two-component sensors such as NarX and EnvZ have a well-characterised,
    mutationally separable transmitter phosphatase activity toward their
    phospho-aspartyl response regulators. GO currently offers only the generic
    GO:0004721 phosphoprotein phosphatase activity, whose descendants cover
    serine/threonine, tyrosine, histidine and arginine phosphatases but not
    phospho-aspartate on a receiver domain. The gap is not specific to
    sensors: the dedicated response-regulator phosphatase CheZ (E. coli
    P0A9H9), which dephosphorylates CheY-P, is likewise annotated only to the
    generic GO:0004721 (IDA and IBA in QuickGO, checked 2026-11-01).
  proposed_parent:
    id: GO:0004721
    label: phosphoprotein phosphatase activity
  supported_by:
  - reference_id: PMID:21078995
    supporting_text: >-
      Thus, two-component sensors likely use similar mechanisms for receiver
      domain dephosphorylation.
suggested_questions:
- question: >-
    How does nitrite binding in the NarX P-box differ structurally from
    nitrate binding, such that nitrite is a weaker agonist for NarX than for
    NarQ?
- question: >-
    Is the switch between NarX kinase and phosphatase states controlled solely
    by ligand occupancy of the periplasmic domain, or also by cytoplasmic
    signals relayed through the HAMP domain?
suggested_experiments:
- experiment_type: structural biology
  description: >-
    Determine structures of the NarX periplasmic domain bound to nitrite, and
    of P-box discrimination variants (K49I, H45E, R59K) bound to nitrate and
    nitrite, to relate ligand geometry to signalling output.
- experiment_type: in vitro reconstitution
  description: >-
    Reconstitute full-length NarX in nanodiscs and measure autokinase,
    phosphotransfer and NarL-P phosphatase rates as a function of nitrate and
    nitrite concentration, with DxxxQ Gln variants as phosphatase-null controls.
