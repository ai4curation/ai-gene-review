      (about threefold) and isolated P-box variants (H45E, R59K) that respond
      normally to nitrate but fail to respond to nitrite, directly implicating
      NarX in sensing nitrite.
    supported_by:
    - reference_id: PMID:9426129
      supporting_text: >-
        Other changes (H45E and R59K) resulted in proteins that responded
        normally to nitrate but were unable to respond to nitrite.
