- term:
    id: GO:0006974
    label: DNA damage response
  evidence_type: IEP
  original_reference_id: PMID:1197071
  qualifier: acts_upstream_of_or_within
  review:
    summary: >-
      Expression-pattern annotation keyed to an unrelated clinical paper; at
      best reflects a genome-wide transcript change after mitomycin C.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The cited PMID:1197071 is a 1975 Polish clinical study of serum calcium
      after thyroid surgery and cannot support any E. coli annotation; it is
      very probably a mis-keyed PMID:11967071 (Khil and Camerini-Otero 2002),
      the mitomycin C transcriptome study that the same source (EcoliWiki)
      cites for this term on other E. coli genes. Even with the intended
      paper, the evidence is a transcript-level change shared by nearly a
      third of all genes, not evidence that NarX executes any step of a DNA
      damage response. NarX is a nitrate/nitrite sensor kinase with no known
      DNA repair or damage-signalling function. Treated as over-annotation,
      consistent with how the same EcoliWiki IEP rows are handled in other E.
      coli reviews (e.g. pstS).
    additional_reference_ids:
    - PMID:11967071
    supported_by:
    - reference_id: PMID:11967071
      supporting_text: >-
        a large number of genes (nearly 30% of all genes) displayed significant
        changes in their expression level
    source_defects:
    - defect_type: WRONG_REFERENCE
      resource: OTHER
      slot: DB:Reference
      requested_change: REPOINT
      asserted_value: PMID:1197071
      corrected_value: PMID:11967071
      corrected_label: >-
        Khil PP, Camerini-Otero RD (2002) Over 1000 genes are involved in the
        DNA damage response of Escherichia coli. Mol Microbiol.
      cause: IDENTIFIER_TRANSPOSITION
      confidence: PROBABLE
      explanation: >-
        Resource is EcoliWiki (assigned_by EcoliWiki, 2010-07-21). The GAF row
        P0AFA2 (narX) GO:0006974 IEP cites PMID:1197071, which is "[Total and
        ionized serum calcium levels following surgery on the thyroid gland]"
        (Pol Tyg Lek 1975), unrelated to E. coli. The intended reference is
        very likely PMID:11967071 (a missing digit), the mitomycin C
        microarray study that EcoliWiki cites for GO:0006974 IEP on glgX,
        glpK, pstA and pstS. Whether narX was among the significantly changed
        genes in that dataset could not be verified here; if it was not, the
        row should be deleted.
      supported_by:
      - reference_id: PMID:11967071
        supporting_text: >-
          Changes in gene expression after treatment of Escherichia coli
          cultures with mitomycin C were assessed using gene array technology.
