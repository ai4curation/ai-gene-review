- term:
    id: GO:0004721
    label: phosphoprotein phosphatase activity
  evidence_type: IDA
  original_reference_id: PMID:8473280
  qualifier: enables
  review:
    summary: >-
      NarX accelerates dephosphorylation of NarL-phosphate in vitro
      (transmitter phosphatase activity).
    action: ACCEPT
    reason: >-
      Dephosphorylation of isolated NarL-phosphate required NarX, and later
      mutagenesis identified the conserved DxxxQ motif Gln as critical for the
      transmitter phosphatase activity without being needed for autokinase or
      phosphotransfer, establishing this as a distinct, intrinsic activity of
      NarX. GO has no more specific term for dephosphorylation of a
      phospho-aspartyl response regulator receiver domain (the descendants of
      GO:0004721 are serine/threonine, tyrosine, histidine, arginine and
      substrate-named phosphatases), so this term is as specific as currently
      possible; a new term is proposed.
    supported_by:
    - reference_id: PMID:8473280
      supporting_text: >-
        Dephosphorylation of the isolated NarL-phosphate required the addition
        of both Mg2+ and the NarX protein.
    - reference_id: PMID:21078995
      supporting_text: >-
        Results show that the Gln residue is critical for transmitter
        phosphatase activity, but is not essential for autokinase or
        phosphotransfer activities.
