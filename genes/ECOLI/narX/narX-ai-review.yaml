core_functions:
- description: >-
    Nitrate/nitrite-stimulated sensor histidine kinase in the inner membrane:
    ligand binding to the periplasmic P-box sensor domain stimulates
    ATP-dependent autophosphorylation of the conserved histidine, and the
    phosphoryl group is transferred to the response regulator NarL (and NarP),
    activating nitrate-responsive transcription.
