suggested_questions:
- question: >-
    Which structural features of the UvrA dimer (the two DNA-binding regions, the
    insertion domains) read out helix distortion, and how does the nucleotide state of the
    proximal and distal ATPase sites gate damaged versus undamaged DNA?
- question: >-
    Do Mfd and Atl compete with UvrB for the same UvrA surface, and how is the choice of
    partner made at a lesion?
suggested_experiments:
- experiment_type: single-molecule imaging
  hypothesis: >-
    Hydrolysis at the proximal versus distal ATPase site has distinct roles in lesion
    search and UvrB handoff.
  description: >-
    Track fluorescently labelled UvrA site-specific Walker A/B mutants on DNA tightropes
    containing defined lesions, with and without UvrB, and measure dwell time and UvrB
    loading.
