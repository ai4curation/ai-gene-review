- term:
    id: GO:0009381
    label: excinuclease ABC activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: enables
  supporting_entities:
  - UniRule:UR000101266
  review:
    summary: >-
      Excinuclease ABC activity is the dual-incision chemistry of the UvrBC incision
      complex; UvrA is needed catalytically to load UvrB but is absent from the incision
      complex.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      UvrA contributes to the excinuclease reaction (contributes_to is appropriate, and is
      recorded in core_functions), but `enables` overstates its role: the incision complex
      contains only UvrB and UvrC.
    supported_by:
    - reference_id: PMID:2546148
      supporting_text: >-
        Addition of UvrC protein to purified UvrB-DNA complexes results in rapid incision
        of the DNA, presumably catalyzed by an excision nuclease containing only UvrB and
        UvrC subunits.
