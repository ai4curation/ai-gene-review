- term:
    id: GO:0000715
    label: nucleotide-excision repair, DNA damage recognition
  evidence_type: IDA
  original_reference_id: PMID:2546148
  qualifier: involved_in
  review:
    summary: >-
      Hydrodynamic and DNA-binding studies with purified Uvr proteins show that UvrA acts
      catalytically to place UvrB at damaged sites, the damage-recognition step of NER.
    action: ACCEPT
    reason: >-
      Damage recognition is the defining biological role of UvrA. UvrA does the work of this
      step: it binds damaged DNA itself and loads UvrB at the lesion, after which it leaves.
      This is the most specific process term for UvrA's contribution to NER.
    supported_by:
    - reference_id: PMID:2546148
      supporting_text: >-
        Under conditions of saturating UvrB protein approximately one UvrB molecule binds
        to DNA per damaged site in a reaction that requires catalytic amounts of UvrA
        subunit.
    - reference_id: PMID:19183285
      supporting_text: >-
        The UvrAB complex scans the DNA in search of damage, with UvrA detecting a
        distortion in the DNA and UvrB verifying the presence of the lesion.
