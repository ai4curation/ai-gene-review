id: P0A698
gene_symbol: uvrA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  UvrA is the DNA-damage-sensing ATPase of the bacterial nucleotide excision repair (NER)
  UvrABC system. A dimer of UvrA associates with two UvrB subunits to form the UvrA2B2
  complex that scans duplex DNA for helix-distorting lesions, including UV photoproducts,
  bulky chemical adducts, and some oxidative lesions such as thymine glycol and abasic
  sites. UvrA binds DNA preferentially at damaged sites, and its ATPase cycle, driven by
  two tandem ABC-type nucleotide-binding cassettes per monomer, controls dimerization,
  discrimination of damaged from undamaged DNA, and loading of UvrB. After UvrB has
  verified the lesion, UvrA hydrolyzes ATP and dissociates, leaving the UvrB-DNA
  preincision complex for UvrC to make the dual incision; UvrA is therefore needed only
  catalytically and is not part of the incision complex. UvrA is also the docking point for
  the transcription-repair coupling factor Mfd, which recruits NER to lesions that stall RNA
  polymerase, and for the alkyltransferase-like protein Atl. It binds about two zinc ions
  through C4-type zinc fingers. UvrA is cytosolic, and uvrA is induced as part of the
  LexA-controlled SOS response.
