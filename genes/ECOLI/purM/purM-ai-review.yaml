id: P08178
gene_symbol: purM
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: PurM is the aminoimidazole ribonucleotide (AIR) synthetase of Escherichia coli, a soluble
  homodimeric ATP-dependent cyclo-ligase that closes the imidazole ring of formylglycinamidine ribonucleotide
  (FGAM) to form AIR, the fifth step of de novo IMP biosynthesis. It is a standalone enzyme; in animals
  and fungi the same activity is a domain of multifunctional GART or ADE5,7-type proteins.
