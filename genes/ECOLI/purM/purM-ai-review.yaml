  - RGD:1308717
  review:
    summary: GAR synthetase activity belongs to the GARS domain of eukaryotic fusions, which PurM lacks.
    action: REMOVE
    reason: 'The PTHR10520 family review assesses this IBD at PTN000055158 as TOO_DEEP: its seeds are
      eukaryotic fusion proteins whose GAR synthetase activity sits in an N-terminal GARS (ATP-grasp)
      domain that is not homologous to the AIRS domain. E. coli PurM has only AIRS and AIRS_C domains,
      and E. coli has a separate GAR synthetase, PurD. The P. putida purM review removes the same inference.'
    supported_by:
    - reference_id: file:interpro/panther/PTHR10520/PTHR10520-review.yaml
      supporting_text: That domain is not homologous to the AIRS domain that defines this family.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: PANTHER:PTN000055158
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Seeds are GART/ADE5,7-type fusions carrying a GARS domain absent from standalone PurM.
