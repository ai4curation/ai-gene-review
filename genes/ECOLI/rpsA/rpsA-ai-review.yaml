suggested_questions:
- question: Does S1's binding to tmRNA contribute to trans-translation in vivo? In vitro S1-free systems
    support trans-translation (PMID:17376482) while other work reports S1 is needed for the mRNA-like
    function of tmRNA (PMID:17392345).
- question: Is there a suitable GO MF for the ATP-independent RNA-unwinding/unfolding (RNA chaperone)
    activity of S1 on mRNA 5' structures? GO:0140691 RNA folding chaperone is defined as assisting folding,
    not unfolding.
- question: For transfer to other bS1 orthologs (PTHR10724:SF7), e.g. Deinococcus Q9RSY6 and Gram-positive
    bS1 homologs with fewer S1 domains, which E. coli functions depend on the N-terminal uS2-binding domains
    that are lineage-variable?
suggested_experiments:
- description: Ribosome profiling after controlled S1 depletion or replacement with S1 domain-deletion
    variants to map which mRNA 5' features determine S1 dependence genome-wide.
