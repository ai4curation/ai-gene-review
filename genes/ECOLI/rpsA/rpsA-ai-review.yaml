id: P0AG67
gene_symbol: rpsA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: 'rpsA encodes ribosomal protein bS1 (S1), the largest protein of the E. coli 30S ribosomal
  subunit (557 aa), built from six tandem S1-type OB-fold domains. S1 is loosely and reversibly bound
  to the 30S: its two N-terminal domains anchor it to uS2 at the junction of the head, platform and body
  near the mRNA exit channel, while the C-terminal domains face solvent and bind RNA. S1 binds single-stranded,
  pyrimidine-rich RNA, including mRNA sequences upstream of the Shine-Dalgarno sequence, and unwinds structured
  5'' regions by capturing transiently exposed single strands, acting as an RNA chaperone that docks and
  unfolds structured mRNAs onto the 30S and positions the start codon for initiation. It is essential
  for growth and for translation of most natural mRNAs, though dispensable for leaderless mRNAs and for
  mRNAs with strong SD and little 5'' structure. S1 represses translation of its own mRNA, binds tmRNA
  and several small RNAs, and is co-opted by bacteriophages, notably as a subunit of the Qbeta RNA replicase.'
