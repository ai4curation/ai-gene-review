- term:
    id: GO:0000028
    label: ribosomal small subunit assembly
  evidence_type: IDA
  original_reference_id: PMID:3297162
  qualifier: involved_in
  review:
    summary: The cited study characterises the tertiary structure of salt-extracted E. coli ribosomal
      proteins by 1H-NMR and limited proteolysis; it is not an assembly assay. S1 is a loosely and reversibly
      bound, late-binding 30S component whose association requires uS2; S1-depleted 30S subunits form
      and translate leaderless mRNA.
    action: MARK_AS_OVER_ANNOTATED
    reason: 'Nothing in the accessible abstract addresses 30S assembly, and the biology argues against
      S1 doing any work in assembling the subunit: S1 docks onto an already assembled 30S via uS2 (PMID:12068815,
      PMID:22412910), exchanges between ribosomes during isolation (PMID:342903), and S1-free 30S/70S
      particles exist and function on leaderless mRNA. Requirement of S1 for ribosome activity is not
      participation in subunit assembly. Full text was not available, so rather than REMOVE this is flagged
      as an over-annotation.'
    supported_by:
    - reference_id: PMID:3297162
      supporting_text: Their tertiary structure has been explored by two techniques, proton magnetic resonance
        and limited proteolysis.
    - reference_id: PMID:12068815
      supporting_text: demonstrating that S2 is essential for binding of S1 to the 30S ribosomal subunit
    - reference_id: PMID:12068815
      supporting_text: S1 is indeed dispensable for translation of leaderless mRNAs
