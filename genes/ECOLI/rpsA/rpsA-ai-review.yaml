- term:
    id: GO:0006413
    label: translational initiation
  evidence_type: IDA
  original_reference_id: PMID:24339747
  review:
    summary: S1 on the 30S subunit binds structured mRNAs, unfolds them (RNA chaperone activity) and is
      needed for docking and correct positioning of the initiation codon in the decoding channel; toeprinting
      with S1-depleted 30S subunits shows defective initiation complex formation on structured mRNAs.
    action: NEW
    reason: 'Participation test: S1 itself performs a step of initiation (mRNA capture and unfolding on
      the 30S platform so the start codon can be accommodated); this is the work of the protein, not mere
      necessity. Supported by S1-dependence of initiation on structured and SD-weak mRNAs (PMID:24339747,
      PMID:22908248) and S1 contacting mRNA upstream of the SD (PMID:11593008). S1 is dispensable for
      leaderless mRNAs (PMID:12068815), consistent with an initiation-specific role. GOA currently has
      only general translation terms for this gene.'
    supported_by:
    - reference_id: PMID:24339747
      supporting_text: We demonstrate that r-protein S1 endows the 30S with an RNA chaperone activity
        that is essential for the docking and the unfolding of structured mRNAs, and for the correct positioning
        of the initiation codon inside the decoding channel.
    - reference_id: PMID:11593008
      supporting_text: explains the protein's role in the recognition of the 5' region of mRNA
