taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  PuuD is the gamma-glutamyl-gamma-aminobutyrate hydrolase (EC 3.5.1.94) of Escherichia coli K-12, a homodimeric
  class I glutamine amidotransferase-like (peptidase C26) enzyme with catalytic Cys-114. It hydrolyses
  the gamma-glutamyl linkage of 4-(gamma-L-glutamylamino)butanoate, releasing 4-aminobutanoate (GABA)
  and L-glutamate, the final step of the gamma-glutamyl (Puu) segment of putrescine catabolism before
  GABA enters the GABA shunt. It is induced by putrescine and repressed by PuuR, and puuD mutants accumulate
  gamma-glutamyl-GABA and cannot use putrescine as sole nitrogen source.
