suggested_questions:
- question: >-
    What is the physiological contribution of CheY autoacetylation relative to
    Acs-mediated and acetyl-phosphate-driven acetylation, and does it change motor bias in
    vivo?
- question: Does the CheA phosphohistidine-to-CheY phosphotransfer followed by intrinsic CheY
    autohydrolysis support GO:0101006 as a separate CheY molecular function, and what
    target-specific evidence justifies the scope of the PAINT ancestral assertion?
suggested_experiments:
- description: >-
    Compare CheY lysine acetylation stoichiometry in wild-type, delta-acs and
    acetyl-phosphate-deficient (pta ackA) strains by quantitative mass spectrometry, and
    measure motor CW bias in each, to separate enzymatic, autocatalytic and non-enzymatic
    acetylation.
