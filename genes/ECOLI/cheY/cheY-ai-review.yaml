- term:
    id: GO:0101006
    label: protein histidine phosphatase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - AGI_LocusCode:AT3G04280
  - PANTHER:PTN001981629
  review:
    summary: >-
      The ancestral histidine-phosphatase assignment needs interpretation of net phosphotransfer/hydrolysis,
      not rejection from receiver identity alone.
    action: UNDECIDED
    reason: >-
      PAINT places GO:0101006 at PTN001981629, with ARR22 experimental grounding; donor count and plant
      identity alone do not invalidate that ancestral judgement. E. coli CheY accepts phosphate from CheA
      phosphohistidine onto Asp57 and intrinsically hydrolyses its own aspartyl phosphate (PMID3280143,
      PMID2404281, PMID7623663). These coupled steps can give net phosphohistidine dephosphorylation,
      so the familiar receiver-domain role is not evidence that the GO reaction is absent. PMID2832069
      also describes CheA dephosphorylation by CheY but its abstract does not resolve net turnover versus
      transfer alone. No target-specific loss or IRD/IKR was found. The available evidence does not establish
      whether this net chemistry warrants a separate phosphatase-function assignment for E. coli CheY;
      retain UNDECIDED rather than claim a demonstrated plant-only activity. The family review likewise
      leaves the ancestral assignment UNRESOLVED. The physiological roles are asymmetric: E. coli CheY
      is the motor-directed signal carrier, and hydrolysis of its own Asp57-phosphate terminates that
      signal. Sinorhizobium CheY1 instead serves as a dedicated phosphate sink downstream of CheY2-to-CheA
      retrotransfer (PMID9485379, PMID22194454); there the net phosphate-drainage description has direct
      physiological grounding. This contrast makes the net-reaction interpretation more compelling for
      the sink, but does not by itself prove catalytic absence in the E. coli carrier or warrant a new
      CheY1 histidine-phosphatase assertion.
    supported_by:
    - reference_id: PMID:2404281
      supporting_text: >-
        The CheY protein is phosphorylated by CheA and dephosphorylated by CheZ as part of
        the chemotactic signal transduction pathway in Escherichia coli.
    - reference_id: PMID:2404281
      supporting_text: >-
        consistent with the hypothesis that Asp-57 is the normal site of acyl phosphate
        formation.
    - reference_id: file:ECOLI/cheY/cheY-uniprot.txt
      record_section: ["FT:MOD_RES"]
      supporting_text: 4-aspartylphosphate
    - reference_id: PMID:7623663
      supporting_text: The dephosphorylation rate is controlled by the intrinsic autohydrolytic
        activity of phospho-CheY and by the CheZ protein, which accelerates dephosphorylation.
    - reference_id: PMID:22194454
      supporting_text: a second response regulator, CheY1, serves as a sink for surplus phosphoryl
        groups from CheA-P.
    propagation_review:
      root_cause: UNRESOLVED
      source_entities:
      - source_id: PANTHER:PTN001981629
        source_status: UNRESOLVED
