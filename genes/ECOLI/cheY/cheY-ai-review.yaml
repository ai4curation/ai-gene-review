- description: >-
    Single-domain phosphorelay response regulator of chemotaxis: docks on the P2 domain of
    the histidine kinase CheA and accepts its phosphoryl group on Asp57 (Mg2+-dependent);
    CheY-P diffuses through the cytosol to the flagellar switch.
  molecular_function:
    id: GO:0000156
