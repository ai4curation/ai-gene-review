id: P0AE67
gene_symbol: cheY
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  CheY is a small (129 residues), soluble, single-domain response regulator (receiver/REC domain) that
  carries the output signal of the Escherichia coli chemotaxis pathway from the receptor-associated histidine
  kinase CheA to the flagellar motors. CheA, autophosphorylated on its P1 histidine, docks CheY through
  its P2 domain and transfers the phosphoryl group to CheY Asp57 in an Mg2+-dependent reaction (Mg2+ coordinated
  by Asp12, Asp57 and the Asn59 backbone). Phosphorylation shifts CheY into its active conformation, increasing
  its affinity for the N-terminus of the switch protein FliM in the cytoplasmic C ring of the flagellar
  basal body; CheY-P binding to FliM (and FliN) promotes clockwise rotation and hence tumbling. The signal
  is terminated by CheY's own autodephosphorylation, strongly accelerated by the phosphatase CheZ. Loss
  of CheY gives smooth-swimming, non-chemotactic cells, while CheY overexpression drives clockwise rotation
  even without the rest of the pathway. CheY is therefore the common output of chemotaxis, aerotaxis and
  thermotaxis signalling in E. coli. CheY is also acetylated on Lys92 and Lys109. Acetyl-CoA synthetase
  (Acs)-mediated acetylation and in-vitro autoacetylation with acetyl-CoA have been reported; the native
  contribution of the latter remains unresolved; acetylation reduces its binding to CheA, CheZ and FliM
  and is proposed to tune the fraction of signalling-competent CheY according to metabolic state.
