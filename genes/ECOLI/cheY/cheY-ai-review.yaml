    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      PMID16630631 explicitly reports autoacetylation with acetyl-CoA in the absence of Acs, at a rate
      similar to Acs-mediated acetylation. Treat that observed in-vitro activity as real, rather than
      rejecting self-modification as catalysis. The abstract suggests a chemotactic role but does not
      establish that the native acetylated pool is produced by CheY self-catalysis. The original full
      text remains inaccessible, so catalytic controls and the mechanistic distinction from chemically
      driven acetyl transfer cannot be independently reassessed. Applying the measured-activity policy
      to the reported result, MARK_AS_OVER_ANNOTATED records real in-vitro activity with unresolved physiological
      relevance; it is not a claim that the activity is noise or disproven. The later chemical-acetylation
      experiment (PMID20398208) does not resolve these questions.
    supported_by:
