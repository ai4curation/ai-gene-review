    supporting_text: >-
      the primary docking site is FliM, that the extent of CheY binding to FliM is dependent
      upon the phosphorylation level of CheY
  - reference_id: PMID:1737035
    supporting_text: >-
      It is concluded that nonphosphorylated CheY can interact with the flagellar switch and
      cause CW rotation, but that this activity is increased by at least 2 orders of
      magnitude by phosphorylation.
  - reference_id: PMID:3553150
    supporting_text: >-
      Thus, CheY both enhances clockwise rotation and couples the transducers to the
      flagella.
