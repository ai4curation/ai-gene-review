    reason: >-
      CheY is the prototypical single-domain phosphorelay response regulator: CheA
      transfers its phosphoryl group to CheY Asp57 and CheY-P then changes flagellar
      motor behaviour. The IBA is consistent with the direct experimental evidence on this
      protein (PMID:3280143, PMID:2404281); the gene appearing in its own WITH/FROM marks
      experimental grounding on the target. No PAINT loss lies on the cheY lineage.
    supported_by:
    - reference_id: PMID:3280143
      supporting_text: >-
        the phosphate group on CheA can be rapidly transferred to CheB, a protein involved
        in adaptation to stimuli, or to CheY, a protein involved in the excitation response.
