      formation.
  - reference_id: PMID:16176121
    supporting_text: >-
      at 10 s we detect only phosphorylation of CheY and CheB (Figure 4F).
- description: >-
    Output of the receiver: phosphorylated CheY binds the N-terminus of FliM in the flagellar C ring and
    switches the motor from counterclockwise to clockwise rotation, generating tumbles. Association with
    the motor switch is transient, rather than constitutive incorporation into its structural core.
  molecular_function:
    id: GO:0000156
    label: phosphorelay response regulator activity
  directly_involved_in:
  - id: GO:1902021
    label: regulation of bacterial-type flagellum-dependent cell motility
  - id: GO:0006935
    label: chemotaxis
  supported_by:
