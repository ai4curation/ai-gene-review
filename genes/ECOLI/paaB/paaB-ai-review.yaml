suggested_questions:
- question: >-
    Does PaaB act as an effector that controls PaaA-PaaE interaction (like
    the regulatory subunits of soluble methane monooxygenase), or does it
    participate directly in electron transfer to the PaaA di-iron centre?
suggested_experiments:
- description: >-
    Measure NADPH oxidation coupling and single-turnover epoxidation of
    reduced PaaAC with and without PaaB, and map the PaaB binding surface on
    PaaAC by crosslinking-MS or cryo-EM of the PaaABC(E) complex.
