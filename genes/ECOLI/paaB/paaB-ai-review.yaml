id: P76078
gene_symbol: paaB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  PaaB is a small (95-residue) essential subunit of the soluble
  multicomponent phenylacetyl-CoA 1,2-epoxidase (PaaABCE) of Escherichia
  coli, the ring-activating enzyme of the aerobic phenylacetate catabolic
  pathway encoded by the paa operon. PaaB has no detectable sequence
  similarity to subunits of other bacterial multicomponent monooxygenases.
  Purified PaaB is trimeric; it forms a salt-sensitive heterodimer with the
  structural beta subunit PaaC and a more stable PaaABC complex with the
  PaaAC hydroxylase core. In reconstitution assays omitting PaaB reduces
  epoxidation more than 100-fold, but its precise role is unresolved: it has
  been proposed to act as an effector/regulatory protein analogous to the
  regulatory subunits of other multicomponent monooxygenases, or to
  participate in electron transfer from the PaaE reductase to PaaA. In E.
  coli paaC lacks a consensus ribosome-binding site and is translationally
  coupled to paaB.
