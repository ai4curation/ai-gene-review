- term:
    id: GO:0097266
    label: phenylacetyl-CoA 1,2-epoxidase activity
  evidence_type: IDA
  original_reference_id: PMID:21247899
  qualifier: contributes_to
  review:
    summary: >-
      PaaB is an essential non-catalytic subunit of the epoxidase; omitting
      it from the reconstituted E. coli enzyme reduces product formation more
      than 100-fold.
    action: NEW
    reason: >-
      GOA records PaaB as part of the epoxidase complex but has no activity
      row. Because PaaB is required for catalytic turnover of the purified
      enzyme (not merely for expression), contributes_to the complex activity
      is the appropriate subunit-level molecular function. Its exact
      mechanistic role (effector/regulatory versus electron transfer) remains
      unknown, so no more specific activity is asserted.
    supported_by:
    - reference_id: PMID:21247899
      supporting_text: >-
        Absence of PaaB leads to a more than 100-fold drop in the product
        concentration.
    - reference_id: PMID:21247899
      supporting_text: >-
        In vitro reconstitution of the oxygenase subunits showed that each of
        the PaaA, B, C, and E subunits are necessary for catalysis, whereas
        PaaD is not essential.
