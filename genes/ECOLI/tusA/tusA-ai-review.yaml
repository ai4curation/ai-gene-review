- term:
    id: GO:0006777
    label: Mo-molybdopterin cofactor biosynthetic process
  evidence_type: IMP
  original_reference_id: PMID:23281480
  qualifier: acts_upstream_of_or_within
  review:
    summary: tusA deletion lowers molybdopterin content and molybdoenzyme activity.
    action: KEEP_AS_NON_CORE
    reason: The annotation is acts_upstream_of_or_within, which fits the phenotype. TusA is proposed to
      deliver sulfur for molybdopterin synthesis but is not essential for it, and the authors model the
      effect partly as redistribution of IscS among its sulfur acceptors. A real but secondary role.
    supported_by:
    - reference_id: PMID:23281480
      supporting_text: Under anaerobic conditions the activity of nitrate reductase was reduced by only
        50%, showing that TusA is not essential for molybdenum cofactor biosynthesis.
    - reference_id: file:ECOLI/tusA/tusA-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: Also appears to be involved in sulfur transfer for the biosynthesis of molybdopterin
        (PubMed:23281480).
- term:
    id: GO:0016226
    label: iron-sulfur cluster assembly
  evidence_type: IMP
  original_reference_id: PMID:38916309
  qualifier: involved_in
  review:
    summary: tusA deletion alters Fe-S cluster assembly via reduced fur translation.
    action: MARK_AS_OVER_ANNOTATED
    reason: The study attributes the Fe-S phenotype of the tusA mutant to reduced translation of fur (itself
      plausibly a consequence of missing tRNA thiolation) and to IscS availability, not to TusA acting
      in cluster assembly. The effect is indirect, so involved_in iron-sulfur cluster assembly overstates
      TusA's role.
    supported_by:
    - reference_id: PMID:38916309
      supporting_text: We show that the absence of TusA reduces the translation of fur, thereby leading
        to pleiotropic cellular effects, which we dissect in detail in this study.
