gene_symbol: tusA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: TusA is a small cytosolic sulfur-carrier protein that accepts persulfide sulfur from the
  cysteine desulfurase IscS and supplies the TusBCD/TusE relay for C2 thiolation of tRNA wobble uridine.
  Binding of TusA stimulates IscS activity. TusA also helps direct sulfur toward molybdenum-cofactor biosynthesis;
  its effects on iron-sulfur cluster abundance and iron homeostasis include indirect changes in Fur translation
  and sulfur-mobilization regulation.
