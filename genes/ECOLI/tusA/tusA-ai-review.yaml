  label: Escherichia coli K-12
description: 'TusA is a small cytoplasmic sulfur carrier protein (TusA family, SirA-like fold) with a
  CPxP-motif cysteine (Cys19) that accepts persulfide sulfur from the cysteine desulfurase IscS. TusA
  binds IscS, stimulates its desulfurase activity, and commits IscS-derived sulfur to the Tus relay: it
  transfers the sulfur to TusD of the TusBCD complex, from which it passes via TusE to MnmA for 2-thiolation
  of 5-methylaminomethyl-2-thiouridine (mnm5s2U) at wobble position 34 of tRNA. Deletion of tusA abolishes
  mnm5s2U 2-thiolation and causes pleiotropic phenotypes, including filamentation in rich medium, reduced
  molybdoenzyme activity and altered iron-sulfur cluster homeostasis, which are attributed to redistribution
  of IscS sulfur among its other acceptors and to reduced fur translation.'
