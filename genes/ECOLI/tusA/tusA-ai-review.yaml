- id: PMID:38916309
  title: TusA influences Fe-S cluster assembly and iron homeostasis in E. coli by reducing the translation
    efficiency of Fur.
  findings:
  - statement: TusA-dependent iron phenotypes include a causal change in Fur translation, rather than
      demonstrating direct cluster incorporation by TusA.
    supporting_text: We were able to reveal that the increased iron levels in the ∆tusA mutant strain
      are mainly due to the reduced translation of fur mRNA, the main regulator of Fe homeostasis in E.
      coli.
