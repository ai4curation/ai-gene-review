suggested_questions:
- question: How much of the tusA pleiotropy (filamentation, Moco and Fe-S effects) is secondary to loss
    of mnm5s2U-dependent decoding rather than to a direct sulfur-delivery role outside tRNA thiolation?
suggested_experiments:
- description: Compare ribosome profiling and molybdoenzyme activity in tusA, tusBCD and mnmA deletions
    to separate effects of missing tRNA thiolation from a direct TusA role in molybdopterin sulfur delivery.
  experiment_type: comparative mutant phenotyping
