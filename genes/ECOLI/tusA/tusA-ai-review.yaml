- term:
    id: GO:0006777
    label: Mo-molybdopterin cofactor biosynthetic process
  evidence_type: IMP
  original_reference_id: PMID:23281480
  qualifier: acts_upstream_of_or_within
  review:
    summary: Retain the supported Mo-molybdopterin cofactor biosynthetic process annotation.
    action: ACCEPT
    reason: TusA has a supported sulfur-distribution role in molybdenum-cofactor biosynthesis, supported
      by MPT/cPMP and molybdoenzyme phenotypes together with its IscS sulfur-carrier chemistry. The full
      PMID:23281480 study explicitly leaves direct donation to MoeB/MoaD versus an intervening carrier
      unresolved; it does not establish an obligatory TusA-only route. The later iron-regulatory effects
      do not negate the supported sulfur-distribution role.
    supported_by:
    - *id002
    - &id004
      reference_id: PMID:23281480
      supporting_text: Whether TusA acts as a direct sulfur donor to provide the sulfur to MoeB/MoaD for
        Moco biosynthesis or other proteins like YnjE are involved as mediators in this reaction has to
        be investigated further in future studies.
- term:
    id: GO:0016226
    label: iron-sulfur cluster assembly
  evidence_type: IMP
  original_reference_id: PMID:38916309
  qualifier: involved_in
  review:
    summary: The full PMID:38916309 study establishes effects of TusA loss on Fe-S abundance and iron
      homeostasis, but traces them through reduced Fur translation, iron accumulation and changes in sulfur-mobilization
      regulation.
    action: MARK_AS_OVER_ANNOTATED
    reason: The full PMID:38916309 study establishes effects of TusA loss on Fe-S abundance and iron homeostasis,
      but traces them through reduced Fur translation, iron accumulation and changes in sulfur-mobilization
      regulation. GO:0016226 describes incorporation of iron and sulfur into a cluster. A pleiotropic
      requirement and modulation of IscS availability do not establish that TusA performs that incorporation
      step. This is an overextended process assignment, not a claim that the experimental phenotype is
      false or that TusA can never affect assembly.
    supported_by:
    - reference_id: PMID:38916309
      supporting_text: We were able to reveal that the increased iron levels in the ∆tusA mutant strain
        are mainly due to the reduced translation of fur mRNA, the main regulator of Fe homeostasis in
        E. coli.
