knowledge_gaps:
- gap_statement: >-
    The oligomeric state in which LipA turns over is undetermined. Purification gives a
    monomer/dimer mixture, the early stoichiometric work was read as an obligate homodimer,
    and the one defined catalytic complex measured is a 1:1 LipA-NfuA heterodimer; which
    of these is the species that converts octanoyl-H protein in the cell is not known.
  boundary: >-
    The chemistry is settled: both sulfur atoms of one lipoyl group come from the auxiliary
    [4Fe-4S] cluster of a single LipA polypeptide, and two AdoMet are cleaved irreversibly
    per lipoyl group. The unknown is the quaternary structure, not the reaction.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    It decides how the GO:0042803 row should be read, and whether the catalytically relevant
    partner-bound form is a heterodimer with a cluster carrier rather than any homo-oligomer.
    It also bears on whether the destroyed auxiliary cluster is rebuilt in place within one
    LipA molecule or requires exchange between subunits.
  resolution: >-
    Determine the mass and stoichiometry of LipA under turnover conditions, with and without
    NfuA, by a method that reports on the solution species rather than the purified protein.
  provenance:
  - reference_id: file:ECOLI/lipA/lipA-uniprot.txt
    record_section: ["CC:SUBUNIT"]
    supporting_text: Monomer or homodimer.
  - reference_id: PMID:15740115
    supporting_text: each lipoyl synthase polypeptide contributes both of the sulfur atoms to the
      intact cofactor
- gap_statement: >-
    Which iron-sulfur carrier rebuilds the LipA auxiliary [4Fe-4S] cluster in vivo, and
    whether NfuA is the physiological donor or one of several able to substitute, is
    undetermined. NfuA was shown to reconstitute the cluster efficiently in vitro; the
    in vivo route and whether IscU, ErpA or SUF components can take over is not established.
  boundary: >-
    That the auxiliary cluster is sacrificed as the sulfur source, and so must be rebuilt
    for each turnover, is firmly established, as is that NfuA can rebuild it in a step that
    is not rate-limiting in vitro.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    This is the same question recorded for ECOLI/bioB, whose [2Fe-2S] cluster is consumed
    in the analogous way, and it governs how many lipoyl groups one LipA molecule can make.
    A dedicated carrier would make cluster delivery part of the lipoylation mechanism rather
    than general Fe-S housekeeping.
  resolution: >-
    Measure lipoylation output per LipA molecule in vivo across carrier deletion backgrounds
    and follow labelled sulfur from defined cluster donors into the lipoyl group.
  provenance:
  - reference_id: PMID:29051382
    supporting_text: We found that the Escherichia coli iron-sulfur (Fe-S) cluster carrier protein
      NfuA efficiently reconstitutes the auxiliary cluster during LipA catalysis in a step that is
      not rate-limiting.
suggested_questions:
- question: >-
    Which species of LipA carries out catalysis in the cell -- a monomer, a homodimer, or a
    complex with an iron-sulfur carrier -- and does the oligomeric state change over the
    course of a turnover cycle as the auxiliary cluster is consumed and rebuilt?
- question: >-
    Is NfuA the physiological donor that rebuilds the LipA auxiliary cluster in vivo, or can
    IscU-HscA/HscB, ErpA or SUF components substitute, and does the identity of the donor set
    how many lipoyl groups one LipA molecule can make before it is degraded?
- question: >-
    Does LipA discriminate between the lipoyl domains of its several substrate proteins (the
    2-oxoacid dehydrogenase E2 subunits and the glycine cleavage H protein), and if so, is the
    selectivity in the domain fold or in the surrounding sequence?
suggested_experiments:
- hypothesis: The catalytically relevant form of LipA is a 1:1 complex with an iron-sulfur
    carrier rather than a LipA homo-oligomer.
  description: >-
    Follow the solution mass of LipA during single-turnover and multiple-turnover reactions
    with octanoyl-H protein, with and without NfuA, by native mass spectrometry and
    mass photometry, and compare against the resting enzyme. Test whether a covalently
    enforced LipA dimer is active and whether a monomer tethered away from any partner is.
  experiment_type: biophysical analysis
- hypothesis: NfuA is the physiological auxiliary-cluster donor, with a redundant pathway able
    to substitute.
  description: >-
    Quantify lipoylated H protein and E2 subunits per LipA molecule in vivo, in strains
    expressing tagged LipA at defined levels, across nfuA, iscU, hscA, erpA and suf deletion
    backgrounds and their combinations, and follow 34S from labelled cluster donors into the
    lipoyl group by mass spectrometry.
  experiment_type: genetics and isotope labelling
- hypothesis: LipA selects its substrate lipoyl domains by recognising features outside the
    conserved domain fold.
  description: >-
    Measure lipoylation rates on isolated octanoylated lipoyl domains from each E. coli
    substrate protein and on chimeras that swap the domain core against its flanking sequence.
  experiment_type: biochemical analysis
