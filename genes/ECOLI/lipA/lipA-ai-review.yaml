  supported_by:
  - reference_id: PMID:15157071
    supporting_text: our data indicate that 2 equiv of AdoMet are cleaved irreversibly in forming 1 equiv of ... H-protein
  - reference_id: PMID:11106496
    supporting_text: When sodium dithionite-reduced LipA was incubated with octanoyl-ACP, LipB,
      apo-PDC, and S-adenosyl methionine (AdoMet), lipoylated PDC was formed.
  - reference_id: file:ECOLI/lipA/lipA-uniprot.txt
    record_section: ["CC:FUNCTION"]
    supporting_text: Catalyzes the radical-mediated insertion of two sulfur atoms into the C-6 and
      C-8 positions of the octanoyl moiety bound to the lipoyl domains of lipoate-dependent enzymes
  - reference_id: file:ECOLI/lipA/lipA-uniprot.txt
    record_section: ["CC:FUNCTION"]
    supporting_text: Free octanoate is not a substrate for LipA.
- description: >-
    Binds two [4Fe-4S] clusters per subunit. The radical SAM cluster, on the CX3CX2C motif, reductively
    cleaves SAM to the 5'-deoxyadenosyl radical that abstracts each hydrogen; the auxiliary cluster is
    the source of both sulfur atoms that end up in the lipoyl ring and is degraded in supplying them,
    which is why the enzyme needs NfuA to rebuild it between turnovers. The second cluster is therefore
    a substrate as much as a cofactor.
  molecular_function: *id004
