- term:
    id: GO:0042803
    label: protein homodimerization activity
  evidence_type: IDA
  original_reference_id: PMID:11106496
  qualifier: enables
  review:
    summary: >-
      Rests on LipA purifying as a mixture of monomeric and dimeric species. Not an established functional
      homodimer.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Not false -- dimeric species were seen -- but an over-annotation of what was observed, which is
      a monomer/dimer mixture on purification rather than a defined oligomer. The earlier literature did
      read a homodimer into this: PMID:10747808 states flatly that 'Biotin synthase and lipoate synthase
      are homodimers' and reports cluster content per dimer, and PMID:15157071 found its AdoMet and sulfur
      stoichiometries 'consistent with a model in which two LipA proteins are required to synthesize one
      lipoyl group'. Those reports are superseded on this point, and the later work is what this row should
      be read against. PMID:15740115 showed that each lipoyl synthase polypeptide supplies both sulfur
      atoms of one lipoyl group, which retires the inter-subunit sulfur-sharing rationale that made the
      1:2 LipA:product stoichiometry look like evidence for an obligate dimer -- though it does not by
      itself exclude a homodimer whose subunits each run a complete reaction. What the row rests on instead
      is that no defined homodimer has been established: UniProt still declines to choose, recording 'Monomer
      or homodimer', and the one defined complex measured for catalysis is a 1:1 LipA-NfuA heterodimer,
      not a LipA homodimer. Marked rather than REMOVEd because the IDA observation stands; it is the functional
      reading that overreaches. The oligomeric state is recorded as an open knowledge gap below.
    supported_by:
    - reference_id: PMID:11106496
      supporting_text: The proteins were purified as a mixture of monomeric and dimeric species that
        contain approximately four iron atoms per LipA polypeptide and a similar amount of
        acid-labile sulfide.
    - reference_id: PMID:10747808
      supporting_text: Biotin synthase and lipoate synthase are homodimers
    - reference_id: PMID:15157071
      supporting_text: consistent with a model in which two LipA proteins are required to synthesize one
        lipoyl group
    - reference_id: PMID:15740115
      supporting_text: each lipoyl synthase polypeptide contributes both of the sulfur atoms to the
        intact cofactor
    - reference_id: PMID:29051382
      supporting_text: The sample containing both LipA and NfuA (solid trace) shows an elution at 54.6
        mL, corresponding to an experimentally calculated mass of 67.2 kDa, suggesting a 1:1 heterodimer
        of LipA and NfuA
    - reference_id: file:ECOLI/lipA/lipA-uniprot.txt
      record_section: ["CC:SUBUNIT"]
      supporting_text: Monomer or homodimer.
