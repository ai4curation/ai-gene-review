- term:
    id: GO:1904047
    label: S-adenosyl-L-methionine binding
  evidence_type: IC
  original_reference_id: file:ECOLI/lipA/lipA-uniprot.txt
  qualifier: enables
  review:
    summary: >-
      LipA binds S-adenosyl-L-methionine at the unique iron of its radical SAM [4Fe-4S] cluster and cleaves
      it to the 5'-deoxyadenosyl radical; two are consumed per lipoyl group, one for each of the C-6 and
      C-8 hydrogen abstractions.
    action: NEW
    reason: >-
      Not in GOA. Added under the RADICAL_SAM treatment rule, which treats GO:1904047 as a core cosubstrate-binding
      function of every radical SAM enzyme whose catalysis is established. This is a molecular function
      the protein itself performs, so the participation test is met directly: LipA binds SAM and cleaves
      it, rather than merely being required for a process that consumes it. UniProt's HAMAP-curated cofactor
      note records the exchangeable S-adenosyl-L-methionine on the radical SAM cluster, and the measured
      stoichiometry is two SAM cleaved irreversibly per lipoyl group. Coded IC because the inference is
      the reviewer's, drawn from that curated content and the established reaction rather than from a
      SAM-binding assay on this protein; the independent physiological evidence that LipA is inhibited
      by accumulating 5'-deoxyadenosine, the product of that cleavage, points the same way. Comparator
      check, against GOA rather than against this project's own proposals: GOA does annotate GO:1904047
      to radical SAM enzymes in exactly this role, by UniRule -- ECOLI/queE (UR000100349), ECOLI/moaA
      and PSEPK/moaA (UR000101305), METEA/pqqE and PSEPK/pqqE (UR000098303). So the absence here is patchy
      UniRule coverage, which rules happen to carry the term, not a GO convention against annotating a
      radical SAM enzyme's own cosubstrate.
    supported_by:
    - reference_id: file:ECOLI/lipA/lipA-uniprot.txt
      record_section: ["CC:COFACTOR"]
      supporting_text: Note=Binds 2 [4Fe-4S] clusters per subunit. One cluster is coordinated with 3
        cysteines and an exchangeable S-adenosyl-L-methionine.
    - reference_id: PMID:15157071
      supporting_text: our data indicate that 2 equiv of AdoMet are cleaved irreversibly in forming 1 equiv of ... H-protein
    - reference_id: PMID:15911379
      supporting_text: Physiological experiments indicate that lipoic acid synthase, another SAM
        radical enzyme, is also inhibited by 5'-deoxyadenosine accumulation.
