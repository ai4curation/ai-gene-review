id: P60716
gene_symbol: lipA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  LipA is the lipoyl synthase of Escherichia coli, the enzyme that completes biosynthesis of the lipoyl
  cofactor. Acting on an octanoyl chain that LipB has already transferred onto the lipoyl-domain lysine
  of a target protein, it inserts sulfur atoms at the unactivated C-6 and C-8 positions to give the dithiolane
  ring of lipoate. It is a radical SAM enzyme: a [4Fe-4S] cluster reductively cleaves S-adenosyl-L-methionine
  to a 5'-deoxyadenosyl radical that abstracts each hydrogen, and two SAM are consumed per lipoyl group.
  A second [4Fe-4S] cluster supplies both sulfur atoms and is destroyed in doing so, so continued turnover
  depends on the iron-sulfur carrier NfuA rebuilding it. Because free octanoate is not a substrate, the
  cofactor is assembled in place on its carrier; the physiological targets are the E2 subunits of the
  pyruvate and 2-oxoglutarate dehydrogenase complexes and the H protein of the glycine cleavage system,
  which cannot function without lipoylation. The protein is cytosolic, and cells lacking lipA cannot grow
  on glucose minimal medium unless lipoate is supplied.
