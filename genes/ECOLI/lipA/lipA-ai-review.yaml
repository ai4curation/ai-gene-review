core_functions:
- description: >-
    Lipoyl synthase, the second and final enzyme of endogenous lipoate assembly: it inserts sulfur at
    C-6 and C-8 of an octanoyl chain already amide-linked to the lipoyl-domain lysine of its target, converting
    the octanoylated domain into the lipoyl cofactor. The targets are the E2 subunits of the pyruvate
    and 2-oxoglutarate dehydrogenase complexes and the glycine cleavage H protein. Free octanoate is not
    a substrate, so the cofactor is built in place on the carrier rather than made free and then attached.
  molecular_function: *id003
  directly_involved_in:
