- term:
    id: GO:1902201
    label: negative regulation of bacterial-type flagellum-dependent cell motility
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN002895351
  - UniProtKB:P46139
  - UniProtKB:P76236
  - UniProtKB:P76237
  - UniProtKB:P76330
  review:
    summary: DgcZ can reduce flagellum-dependent motility through c-di-GMP.
    action: KEEP_AS_NON_CORE
    reason: The target-specific overexpression experiments demonstrate a c-di-GMP-dependent motility effect.
      Retain as a supported output, while the best-established native role is control of PGA production
      and surface attachment; do not turn this into a universal property of all GGDEF proteins.
    supported_by:
    - reference_id: PMID:18713317
      supporting_text: Phenotypic characterization revealed that both proteins are involved in the regulation
        of motility in a c-di-GMP-dependent manner.
- term:
    id: GO:1902209
    label: negative regulation of bacterial-type flagellum assembly
  evidence_type: IMP
  original_reference_id: PMID:18713317
  qualifier: acts_upstream_of_or_within
  review:
    summary: DgcZ overexpression reduces flagellar abundance.
    action: KEEP_AS_NON_CORE
    reason: The original study directly observes fewer flagella when ydeH is overexpressed. Retain this
      condition-dependent regulatory phenotype without claiming that DgcZ is a flagellar assembly protein
      or that the effect defines its primary physiological role.
    supported_by:
    - reference_id: PMID:18713317
      supporting_text: Overexpression of pBADydeH resulted in a clear reduction in the abundance of flagella
