  review:
    summary: DgcZ regulates adhesive biofilm development by supplying c-di-GMP.
    action: MODIFY
    reason: DgcZ produces a signaling molecule that activates the Pga machinery; it does not itself form
      the adhesin. Replace the adhesion-execution term with positive regulation of single-species biofilm
      formation. The IBA and IMP rows describe the same biological claim and receive the same refinement.
    supported_by:
    - &id002
      reference_id: PMID:19460094
      supporting_text: Maximal induction of PgaD and poly-GlcNAc synthesis requires the production of
        c-di-GMP by the dedicated diguanylate cyclase YdeH.
    - &id003
      reference_id: PMID:27402625
      supporting_text: the negative effect of a cpxR mutation and the positive effect of nlpE overexpression
        on biofilm formation both depend on DgcZ.
    proposed_replacement_terms:
