  review:
    summary: The interaction is real but generic protein binding does not describe DgcZ function.
    action: REMOVE
    reason: The original study reports FrdB association with DgcZ using coimmunoprecipitation and a bacterial
      two-hybrid assay. No distinct adaptor or enzyme-regulator molecular activity is established by this
      interaction alone. Remove the uninformative term under the protein-binding policy without disputing
      the experimental interaction.
    supported_by:
    - reference_id: PMID:27402625
      supporting_text: Interaction with FrdB, a subunit of the fumarate reductase complex (FRD) involved
        in anaerobic respiration and in control of flagellum assembly, was further supported by a bacterial-two-hybrid
        assay.
