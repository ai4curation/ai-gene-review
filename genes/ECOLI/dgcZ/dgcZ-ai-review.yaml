id: P31129
gene_symbol: dgcZ
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: DgcZ (YdeH) is a homodimeric Escherichia coli diguanylate cyclase with an N-terminal chemoreceptor
  zinc-binding domain and a C-terminal GGDEF catalytic domain. It supplies c-di-GMP for activation of
  poly-N-acetylglucosamine production and surface-associated biofilm development. Zinc binding restrains
  catalytic-domain motion and inhibits the enzyme. The protein is dispersed in the cytoplasm during growth
  and can accumulate at a cell pole under alkaline starvation conditions.
