  - UniProtKB:P76237
  - UniProtKB:P76330
  review:
    summary: Membrane residence is not established for DgcZ.
    action: MARK_AS_OVER_ANNOTATED
    reason: The PAINT assertion at PTN002895351 includes DGCs with membrane architectures, whereas DgcZ
      has a soluble CZB-GGDEF architecture and is observed dispersed in the cytoplasm or in polar foci.
      These target-specific data do not establish plasma-membrane residence. The lineage-loss check reports
      no IRD/IKR; the concern is localization granularity and architectural divergence, not donor count.
    supported_by:
    - &id006
      reference_id: PMID:27402625
      supporting_text: The protein was evenly distributed in the cytoplasm in transition phase (9 h),
        while in stationary phase (24 and 48 h) it localized almost entirely at one cell pole
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - COMPARTMENT_OR_COMPLEX_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN002895351
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: The current PAINT IBD source places GO:0005886 at PTN002895351 (20180209); the disputed
          step is descent of that location onto dgcZ. The target-specific studies summarized in the reason
          describe soluble/cytoplasmic behavior rather than a membrane-resident architecture. This does
          not challenge the membrane evidence on other descendants or infer weakness from donor count.
