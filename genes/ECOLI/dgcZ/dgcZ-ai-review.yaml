- term:
    id: GO:0060187
    label: cell pole
  evidence_type: IDA
  original_reference_id: PMID:27402625
  qualifier: located_in
  review:
    summary: DgcZ conditionally accumulates at one cell pole.
    action: KEEP_AS_NON_CORE
    reason: The mVENUS localization assay shows polar enrichment under alkaline pH/carbon starvation and
      dispersed cytoplasmic protein during growth. Polar localization is not required to infer the catalytic
      activity and is retained as a conditional location rather than the universal site of catalysis.
    supported_by:
    - *id006
