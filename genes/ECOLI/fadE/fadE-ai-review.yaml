    action: MODIFY
    summary: Acyl-CoA oxidation is supported, but the term explicitly assumes an unverified ETF acceptor.
    reason: The active GO definition names oxidized and reduced electron-transfer flavoprotein. Primary
      enterobacterial genetic/physiological work establishes FadE-dependent acyl-CoA oxidation, while
      the physiological electron relay remains unresolved. This correction does not deny chain-length
      capability or demonstrate that ETF is impossible. The 2002 short-chain growth test uses a fadR background;
      the 1977 extract assay predates gene identification. Long- and medium-chain turnover and relative
      efficiency remain assay-qualified. The PAINT inference at PTN002535634 supports shared acyl-CoA
      oxidation; the objection concerns the term's acceptor specificity, not donor count or family membership.
