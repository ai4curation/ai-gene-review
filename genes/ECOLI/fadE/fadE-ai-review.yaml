product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: FadE is the FAD-dependent acyl-CoA dehydrogenase that forms trans-2-enoyl-CoA at the entry
  to each fatty acid beta-oxidation turn in Escherichia coli K-12. Its physiological electron acceptor
  remains unresolved; a separate ETF partner has not been established. FadE is repressed by FadR and induced
  during fatty acid utilization. Genetic and extract assays support a range of acyl-chain substrates,
  but growth on shorter free fatty acids requires appropriate regulatory backgrounds and does not demonstrate
  complete conversion of every activated chain to acetyl-CoA.
