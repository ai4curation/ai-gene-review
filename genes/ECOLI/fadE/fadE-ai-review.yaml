  review:
    summary: >-
      PAINT places acyl-CoA dehydrogenase activity at the PTHR48083 root node PTN002535634, with E. coli
      FadE (Q47146) among its experimental seeds.
    action: ACCEPT
    reason: >-
      FadE (SF18) descends from the node and is itself a seed, so the IBA restates an activity shown for
      this protein and records that it is inherited across the family. FadE is the only acyl-CoA dehydrogenase
      of the E. coli fad regulon; its loss abolishes growth on medium- and long-chain fatty acids. The
      general acyl-CoA dehydrogenase term is kept beside the chain-length-specific terms because it names
      the reaction class shared by both and is the term the beta-oxidation module uses for this step.
    supported_by:
