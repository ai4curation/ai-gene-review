gene_symbol: fadE
aliases:
- b0221
- yafH
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  fadE (formerly yafH) encodes the FAD-dependent acyl-CoA dehydrogenase of the Escherichia coli fatty
  acid degradation (fad) regulon. FadE catalyses the first reaction of each turn of aerobic beta-oxidation,
  oxidising medium- and long-chain acyl-CoAs to trans-2-enoyl-CoAs and passing the electrons to electron-transfer
  flavoprotein. It belongs to the bacterial FadE clade of the acyl-CoA dehydrogenase family, which carries
  a C-terminal extension (FadE_C). fadE is repressed by FadR and induced by fatty acids, and fadE mutants
  cannot grow on octanoate, decanoate, dodecanoate or oleate.
