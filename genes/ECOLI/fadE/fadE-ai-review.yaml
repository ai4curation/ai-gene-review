core_functions:
- description: Oxidizes saturated acyl-CoA to trans-2-enoyl-CoA at the first beta-oxidation reaction.
    Medium- and long-chain substrate use is supported in enterobacterial genetic/physiological assays;
    exact kinetic breadth and the physiological electron acceptor remain unresolved. C8/C10 growth phenotypes
    require explicit fadR context, and intermediate accumulation prevents a claim of universal complete
    oxidation.
  proposed_molecular_function: acyl-CoA dehydrogenase activity (acceptor unspecified)
  directly_involved_in:
  - id: GO:0033539
    label: fatty acid beta-oxidation using acyl-CoA dehydrogenase
  locations:
  - id: GO:0005737
    label: cytoplasm
  supported_by: *id001
proposed_new_terms:
- proposed_name: acyl-CoA dehydrogenase activity (acceptor unspecified)
  proposed_definition: Catalysis of the oxidation of a 2,3-saturated acyl-CoA to the corresponding trans-(2E)-enoyl-CoA,
    with transfer of reducing equivalents to an electron acceptor whose molecular identity is not specified.
  justification: The existing acyl-CoA dehydrogenase GO terms explicitly require ETF. Enterobacterial
    reaction chemistry is established, but the physiological electron acceptor has not been resolved;
    no term asserting ETF or oxygen directly is substituted.
  proposed_parent:
    id: GO:0016627
    label: oxidoreductase activity, acting on the CH-CH group of donors
  supported_by: *id001
suggested_questions:
- question: Which respiratory partner reoxidizes FadE, and does productive turnover require transient
    membrane association?
suggested_experiments:
- description: Reconstitute purified FadE with candidate respiratory acceptors and measure sustained turnover
    across a defined acyl-CoA chain-length panel; verify any proposed ETF interaction directly rather
    than presupposing a native ETF partner. Localize a functional fusion by controlled fractionation and
    microscopy.
  experiment_type: enzymology and subcellular fractionation
knowledge_gaps:
- gap_statement: The physiological electron acceptor and route by which reduced FadE is reoxidized are
    unresolved.
  boundary: FadE-dependent acyl-CoA oxidation and fatty-acid utilization are established. This gap concerns
    electron transfer, not the existence of the dehydrogenation reaction.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  resolution: Reconstitute purified target FadE with candidate respiratory partners and directly follow
    electron transfer and sustained catalytic turnover.
  provenance:
  - reference_id: file:genes/ECOLI/fadE/fadE-source-analysis/enterobacterial-evidence.md
    supporting_text: However, our array analysis and prior genetic analysis give no candidates for an
      ETF homologue in the FadR regulon.
