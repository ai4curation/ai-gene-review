  review:
    summary: >-
      A heme-requiring E. coli mutant lacking ALA dehydratase activity was complemented by
      the cloned hemB gene, which raised ALA dehydratase synthesis 20- to 30-fold.
    action: ACCEPT
    reason: >-
      Genetic evidence linking loss and restoration of PBGS activity to hemB, consistent
      with the biochemical rows. The mutant also lacked porphobilinogen deaminase
      activity, which was restored only to normal levels, so the hemB-specific
      overproduction of ALA dehydratase is the informative result.
    supported_by:
    - reference_id: PMID:3276659
