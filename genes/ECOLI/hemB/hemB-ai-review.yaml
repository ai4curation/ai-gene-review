        detectable 5-aminolevulinate dehydratase or porphobilinogen deaminase activities.
    - reference_id: PMID:3276659
      supporting_text: The gene which complemented this mutation was cloned to a
        high-copy-number plasmid, and porphobilinogen deaminase activity was restored to
        normal levels, but the synthesis of 5-aminolevulinate dehydratase increased 20- to
        30-fold.
