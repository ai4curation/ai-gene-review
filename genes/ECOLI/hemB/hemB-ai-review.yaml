  label: Escherichia coli K-12
description: >-
  HemB is porphobilinogen synthase (5-aminolevulinate dehydratase, ALAD) of Escherichia
  coli. It binds two molecules of 5-aminolevulinate (ALA) per subunit at distinct sites,
  forms Schiff-base intermediates with active-site lysines, and condenses them into the
  monopyrrole porphobilinogen, the building block of all tetrapyrroles, so it acts in the
  common trunk of heme (and siroheme) biosynthesis. The soluble cytosolic enzyme is a
  homo-octamer and a zinc metalloenzyme that requires catalytic Zn(II) bound by a
  cysteine-rich site; unlike mammalian ALAD it is also allosterically stimulated by a
  separate Mg(II) site, which lowers the Km for ALA and raises Vmax. hemB mutants lack ALA
  dehydratase activity and require heme.
