suggested_questions:
- question: >-
    Does the allosteric Mg(II) site of E. coli PBGS act as a physiological regulator of
    porphobilinogen flux, given that it is predicted to be saturated at cellular Mg(II)?
suggested_experiments:
- hypothesis: The Mg(II) allosteric site contributes to heme synthesis capacity in vivo.
  description: >-
    Replace chromosomal hemB with a Mg-site variant (residue 232) and measure ALA
    accumulation, porphyrin intermediates and heme content across a range of Mg2+ supply.
