core_functions:
- description: 'Acetate--CoA ligase (AMP-forming). Acs is the high-affinity acetate-activating enzyme of
    E. coli, condensing acetate with CoA at the expense of ATP via an enzyme-bound acetyl-adenylate
    intermediate to yield acetyl-CoA, AMP and diphosphate in the cytoplasm. This is the committed step
    that lets the cell assimilate and oxidise environmental or self-excreted acetate at low
    concentrations, feeding the TCA cycle and the glyoxylate shunt.'
