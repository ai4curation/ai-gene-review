      review_notes: The paper's own title attributes the acetylation to acetyladenylate or its
        derivative, that is to the small-molecule intermediate Acs generates, which is exactly the
        ambiguity that later work on non-enzymatic acetyl-phosphate-driven acetylation makes central
        (PMID:23830618). The observation stands; its attribution to Acs as an enzyme does not follow
        from it.
