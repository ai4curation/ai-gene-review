  review:
    action: ACCEPT
    summary: Acs catalyses the committed activation step of acetate utilisation, so it executes a step
      of acetate breakdown; the knockout growth phenotype is the in-vivo confirmation, not the whole
      argument.
    reason: 'This row passes the participation test on the enzymology rather than on the phenotype: the
      entity that performs the acetate to acetyl-CoA conversion is Acs itself, and everything downstream
      (TCA cycle, glyoxylate shunt) consumes the product. The genetics add the physiological scope - a
      single acs deletion grows poorly below about 10 mM acetate while an acs ackA pta triple deletion
      cannot grow on acetate at all, which locates Acs as the high-affinity arm of acetate activation
      alongside the low-affinity AckA-Pta arm. This is therefore not the fabY-style pattern in which a
      metabolic knockout''s downstream consequences become separate process terms; acetate catabolism
      is the pathway whose first step Acs catalyses. Core function.'
