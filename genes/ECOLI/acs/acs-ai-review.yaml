    label: peptidyl-lysine acetylation
  evidence_type: IDA
  original_reference_id: PMID:15327942
  qualifier: involved_in
  review:
    action: KEEP_AS_NON_CORE
    summary: Purified Acs acetylates CheY, and the modified residues were mapped by mass spectrometry to
      specific lysines, so the term fits the assay; but it is a peripheral, in-vitro-defined activity
      and acetyl-donor supply is not separated from catalysis.
    reason: 'CACAO row. What the paper shows for acs: Acs was overproduced and purified, then shown to
      acetylate CheY using either acetate (via acetyl-adenylate) or acetyl-CoA as the acetyl donor;
      anti-acetyl-lysine Western blotting, MALDI-TOF and ESI mass spectrometry, and tryptic peptide
      fingerprinting mapped the modification to CheY Lys91, 92, 109, 119, 122 and 126, and also showed
      Acs autoacetylation. The CACAO term matches that evidence at the right granularity -
      peptidyl-lysine acetylation is precisely what was measured, not a downstream phenotype - so this
      is not the phenotype-as-process pattern. Three reasons it is kept as non-core rather than
      accepted as core: (a) the assay is in vitro with purified components; (b) Acs manufactures
      acetyl-adenylate and acetyl-CoA, and acyl-donor concentration alone drives non-enzymatic lysine
      acetylation in E. coli (PMID:23830618), so an Acs-dependent rise in CheY acetylation does not by
      itself establish Acs as the catalyst; (c) the same lab showed CheY is acetylated in a Δacs strain
      and autoacetylates from acetyl-CoA at a comparable rate (PMID:16630631), and the dedicated
      E. coli protein acetyltransferase is PatZ, with Acs as its substrate rather than its peer
      (PMID:15236963, PMID:40498448). Per the curator-deference rule this experimental row is not
      removed on the strength of an abstract.'
