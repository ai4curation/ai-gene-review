suggested_questions:
- question: Is Acs genuinely a protein-lysine acetyltransferase, or does it increase CheY acetylation by
    supplying acetyl-adenylate and acetyl-CoA for non-enzymatic modification? If the latter, should the
    CheY-related GO annotations on Acs be retired altogether rather than re-levelled?
  experts:
  - Michael Eisenbach
  - Alan J. Wolfe
- question: Why do the two published chemotaxis phenotypes of an acs deletion disagree (PMID:11359578
    versus PMID:20345663), and under which conditions can they be reconciled?
  experts:
  - Michael Eisenbach
  - Jiao-Yu Deng
- question: Should the UniRule that propagates GO:0006935 chemotaxis to bacterial AcsA orthologues be
    narrowed or withdrawn, given that the underlying observation is an E. coli-specific, contested
    regulatory effect rather than a step of chemotaxis performed by the enzyme?
  experts: []
- question: In vivo, how much propionyl-CoA is made by Acs versus PrpE, and does Lys609 acetylation
    regulate the two acyl substrates equivalently?
  experts:
  - Jiao-Yu Deng
  - Jorge C. Escalante-Semerena
suggested_experiments:
- hypothesis: Acs raises CheY lysine acetylation by producing reactive acetyl donors rather than by
    catalysing acetyl transfer onto CheY.
  description: Construct Acs variants that separate the two half reactions - one that forms
    acetyl-adenylate but cannot transfer the acetyl group to a thiol or amine acceptor, and one with the
    adenylation site disabled - and assay CheY acetylation by anti-acetyl-lysine Western blotting and
    quantitative mass spectrometry, with acetyl-adenylate and acetyl-CoA concentrations held constant by
    exogenous addition. If CheY acetylation tracks donor concentration rather than Acs catalytic
    competence, the acetyltransferase assignment should be withdrawn.
  experiment_type: structure-function mutagenesis with quantitative acetylation proteomics
- hypothesis: The chemotaxis phenotype of an acs deletion depends on acetate availability and strain
    background rather than on CheY acetylation as such.
  description: Test the acs-deletion strains of both laboratories (the AJW series and the W3110-derived
    strains) side by side in tethering, capillary and semi-solid-agar assays across a range of acetate
    and glucose concentrations, measuring CheY acetylation stoichiometry by mass spectrometry in each
    condition and including patZ and cobB deletions and cheY lysine-to-arginine substitutions as
    controls.
  experiment_type: comparative phenotyping with site-level PTM quantification
- hypothesis: Acs contributes a defined fraction of propionyl-CoA flux in vivo, regulated by Lys609
    acetylation.
  description: Grow wild type, acs, prpE and double deletions and an acs K609R/K609Q pair on
    13C-labelled propionate and quantify propionyl-CoA and 2-methylcitrate-cycle intermediates by
    LC-MS/MS, alongside in-vitro propionate- and acetate-activation kinetics on enzymatically acetylated
    and CobB-deacetylated Acs.
  experiment_type: 13C metabolic flux analysis with parallel enzyme kinetics
