- term:
    id: GO:0033558
    label: protein lysine deacetylase activity
  evidence_type: IDA
  original_reference_id: PMID:16630631
  qualifier: enables
  review:
    action: MODIFY
    summary: The paper does report that Acs removes acetyl groups from CheY, but that is the reverse of
      Acs's own acetyl-transfer reaction rather than hydrolysis, and GO:0033558 inherits a hydrolytic
      definition Acs cannot satisfy. The transferase term covers both directions of the one reversible
      reaction.
    reason: 'CACAO row. What the paper shows for acs: CheY purified from a Δacs mutant was still
      partially acetylated, and [14C]acetyl-CoA labelling in the absence of Acs demonstrated CheY
      autoacetylation; the sentence the annotation rests on is that autoacetylated CheY, like
      Acs-acetylated CheY, could be deacetylated by Acs. So the claim is in the abstract and is about
      the right protein - this is not a paper-not-about-the-gene case. The problem is chemistry, which
      only the term definition exposes: GO:0033558 is_a GO:0019213 deacetylase activity, defined as
      catalysis of the hydrolysis of an acetyl group from a substrate molecule, and its grandparent
      GO:0160215 deacylase activity writes the reaction with water as co-substrate (both checked
      against OLS on 2026-10-29). Acs has no hydrolase chemistry; it is an adenylate-forming ligase
      whose acetyl transfer onto CheY PMID:15327942 explicitly reports as reversible, i.e. the acetyl
      group is handed back to CoA or AMP rather than released as free acetate by hydrolysis. By GO
      convention a reversible transferase is annotated to the transferase term, so the row is modified
      to GO:0061733 protein-lysine-acetyltransferase activity - the molecular function that carries
      both directions of this reaction, and one GOA otherwise lacks for Acs despite the two acetylation
      process rows. The same in-vitro and donor-supply caveats as the GO:0018394 row apply, so the
      replacement is not proposed as a core function.'
    proposed_replacement_terms:
    - id: GO:0061733
      label: protein-lysine-acetyltransferase activity
    additional_reference_ids:
    - PMID:15327942
    supported_by:
    - reference_id: PMID:16630631
      supporting_text: Like CheY acetylated by Acs, autoacetylated CheY could be deacetylated by Acs
    - reference_id: PMID:15327942
      supporting_text: The Acs-catalyzed acetylation of CheY was reversible
    - reference_id: PMID:16630631
      supporting_text: this protein is partially acetylated in spite of the absence of Acs, suggesting
