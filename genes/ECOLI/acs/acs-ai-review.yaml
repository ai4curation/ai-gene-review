knowledge_gaps:
- gap_statement: Whether Acs is a true protein-lysine acetyltransferase acting on CheY, or whether it
    raises CheY acetylation indirectly by supplying acetyl-adenylate and acetyl-CoA for non-enzymatic
    modification, has never been resolved. No reported experiment separates catalysis by Acs from
    acetyl-donor production by Acs.
  boundary: It is firmly established that purified Acs increases CheY lysine acetylation in vitro using
    acetate or acetyl-CoA as donor, that the modified residues are CheY Lys91, 92, 109, 119, 122 and
    126, that the reaction is reversible, and that CheY also autoacetylates from acetyl-CoA in the
    absence of Acs (PMID:15327942, PMID:16630631). It is equally established that acetyl-phosphate
    drives non-enzymatic lysine acetylation globally in E. coli (PMID:23830618) and that PatZ, not Acs,
    is the organism's dedicated protein acetyltransferase (PMID:15236963).
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  significance: The answer decides whether GO should carry any protein-acetyltransferase molecular
    function for Acs at all, and whether the CheY and chemotaxis link is a regulatory mechanism or a
    metabolic side effect. It also bears on how the many Acs orthologues inheriting the UniRule
    chemotaxis annotation should be treated.
  resolution: An Acs variant that is catalytically dead for acetyl transfer onto protein but still
    produces acetyl-adenylate, or the converse, assayed for CheY acetylation alongside wild type with
    acetyl-donor concentrations clamped.
  provenance:
  - reference_id: PMID:15327942
    supporting_text: is involved in Escherichia coli chemotaxis, but its function is obscure
  - reference_id: PMID:23830618
    supporting_text: suggesting that AcP may acetylate proteins nonenzymatically in cells
  - reference_id: PMID:16630631
    supporting_text: this protein is partially acetylated in spite of the absence of Acs, suggesting that
      CheY can be post-translationally acetylated in vivo by additional means
- gap_statement: The conflict between the two reported chemotaxis phenotypes of an acs deletion is
    unexplained; it is not known whether the difference is strain background, assay format, or the
    acetate concentration at which Acs is the dominant acetate-activating route.
  boundary: PMID:11359578 reports much reduced chemotactic sensitivity for the acs deletion in
    tethering, ring-forming, plug and capillary assays, while PMID:20345663 reports it indistinguishable
    from wild type on semi-solid agar in two independent strain backgrounds and attributes the
    chemotaxis effect to CobB instead.
  gap_kind:
