- id: PMID:1390767
  title: Acetyladenylate or its derivative acetylates the chemotaxis protein CheY in vitro and increases
    its activity at the flagellar switch.
  full_text_unavailable: true
  findings:
  - statement: Producing acetyladenylate inside cytoplasm-free bacterial envelopes containing purified
