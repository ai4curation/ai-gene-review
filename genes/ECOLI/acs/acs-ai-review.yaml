id: P27550
gene_symbol: acs
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: 'Acs is the cytoplasmic acetyl-coenzyme A synthetase (acetate--CoA ligase, AMP-forming;
  EC 6.2.1.1) of Escherichia coli, a member of the ATP-dependent AMP-binding (ANL) enzyme superfamily.
  It ligates acetate to coenzyme A at the expense of ATP in two half reactions through a covalently
  bound acetyl-adenylate intermediate, yielding acetyl-CoA, AMP and diphosphate. Acs is the
  high-affinity arm of acetate activation, scavenging acetate at low external concentrations where the
  low-affinity acetate kinase/phosphotransacetylase route cannot, and so allows the cell to use acetate
  as a carbon and energy source through the TCA cycle and the glyoxylate shunt. The same active site
  also activates propionate to propionyl-CoA, and acs is required for growth on propionate. Acs is
  itself a target of reversible lysine acetylation: the GNAT acetyltransferase Pat/PatZ acetylates its
  active-site Lys609 and inactivates it, and the sirtuin CobB deacetylates Lys609 and reactivates it.
  A separate body of work from one group reports that purified Acs can acetylate lysines of the
  chemotaxis response regulator CheY in vitro, and reverse that modification; the physiological
  significance of this is contested.'
