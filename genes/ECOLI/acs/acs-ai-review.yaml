- term:
    id: GO:0006935
    label: chemotaxis
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: involved_in
  review:
    action: MODIFY
    summary: Acs executes no step of chemotaxis - it neither senses a gradient nor moves the cell. Its
      only reported connection is covalent modification of the response regulator CheY, which is a
      regulatory input, so the regulation term is the correct level.
    reason: 'Two problems with the term as written. (i) Relation and granularity: the curated
      experimental basis is that Acs acetylates CheY, altering CheY clockwise bias at the flagellar
      switch (PMID:1390767, PMID:15327942). Modifying a signalling component is regulation of the
      process, not participation in it - the cell''s chemotaxis is performed by the receptor, CheA,
      CheY and the flagellar motor. Replacing GO:0006935 with GO:0050920 regulation of chemotaxis keeps
      the biological claim and corrects the relation; this is a lateral correction rather than a
      refinement, so the replacement is not a descendant. (ii) Over-propagation: this is a UniRule IEA,
      so the term is asserted for every bacterial AcsA from a lineage-specific and contested E. coli
      observation. The contest is real - Li et al. repeated the semi-solid-agar chemotaxis assay in two
      strain backgrounds and found the acs deletion behaved like wild type (PMID:20345663), against
      PMID:11359578. Kept at the regulation level rather than removed because UniProt curates the
      CheY-acetylation statement with experimental evidence, but deliberately excluded from
      core_functions.'
