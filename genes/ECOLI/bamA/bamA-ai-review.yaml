- term:
    id: GO:0032977
    label: membrane insertase activity
  evidence_type: IDA
  original_reference_id: PMID:20378773
  qualifier: enables
  review:
    summary: >-
      The activity BamA is known for, and the one thing the GOA molecular
      function aspect does not record. Purified Bam complex in proteoliposomes
      folded and inserted the beta-barrel substrate OmpT, which became
      resistant to carbonate extraction and therefore integrated into the
      bilayer, with no energy source required. Structures place the insertion
      step in BamA itself: the barrel lumen binds and partially folds the
      substrate, which is then released laterally through the seam between the
      first and last strands, and a late folding intermediate shows a substrate
      strand hydrogen-bonded into that gate as a continuous beta-sheet. The
      isolated BamA membrane domain alone forms a variable-conductance pore in
      planar bilayers.
    action: NEW
    reason: >-
      The term definition, binds transmembrane domain-containing proteins and
      mediates their integration into a membrane, describes this with no
      stretching, and a search of the ontology finds no more specific
      molecular-function term for beta-barrel insertion. The comparator check
      shows the absence from GOA is a gap rather than a convention: yeast
      SAM50, the Omp85-family beta-barrel insertase of the mitochondrial outer
      membrane and the closest functional homologue of BamA, carries GO:0032977
      by IMP, and E. coli YidC carries it by IMP and IDA, so the term is in
      routine use for insertases in this organism. SAM50's annotation was never
      propagated as an IBD, which explains why no IBA brought the term to BamA.
      Asserted as enables rather than contributes_to, following how GO treats
      SAM50 and YidC, both of which also function only within larger machines
      yet hold the term in their own right: BamA is the essential central
      subunit whose own barrel is the conduit, and the lipoproteins set
      efficiency and drive the conformational cycle without supplying the
      insertion step. The evidence code reflects the reconstitution, which is a
      direct assay of the purified machine rather than an inference.
    additional_reference_ids:
    - PMID:24914988
    - PMID:24619089
    - PMID:39218969
    - PMID:16829683
    - PMID:26901871
    supported_by:
    - reference_id: PMID:20378773
      supporting_text: The folded OmpT was resistant to extraction from the pellet
        by incubation in 100 mM sodium carbonate for 30 minutes, suggesting that the
        folded protein had been integrated into the membrane.
    - reference_id: PMID:20378773
      supporting_text: clearly the Bam complex can assemble a β-barrel protein in the
        membrane without an input of energy
    - reference_id: PMID:24914988
      supporting_text: These findings strongly support a mechanism of OMP biogenesis
        in which substrates are partially folded inside the barrel cavity and are
        subsequently released laterally into the lipid bilayer.
    - reference_id: PMID:24619089
      supporting_text: the transmembrane β strands of OMP substrates may integrate
        into the outer membrane at the interface of the first and last β strands of
        the EcBamA barrel
    - reference_id: PMID:39218969
      supporting_text: BamA lateral gate forms a continuous β-sheet with residues in
        the C-terminal region of OmpX
    - reference_id: PMID:16829683
      supporting_text: The full length YaeT and the isolated membrane domain induce
        pores when reconstituted in planar lipid membranes.
