    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:15851030
  qualifier: enables
  supporting_entities:
  - EcoliWiki:nlpB
  - EcoliWiki:yfgL
  - EcoliWiki:yfiO
  review:
    summary: >-
      The founding paper for the complex, reporting that BamA (YaeT) assembles
      with the lipoproteins NlpB/BamC, YfgL/BamB and YfiO/BamD into a
      multiprotein machine required for outer-membrane protein assembly. The
      interactions are real, but the annotation records only that BamA touches
      three other proteins.
    action: REMOVE
    reason: >-
      Uninformative rather than wrong. The biological content of these
      interactions is that BamA is the central subunit of a defined complex,
      and that is already asserted by the GO:1990063 Bam protein complex rows,
      including one derived from this same reference. No more specific
      molecular function can be promoted from the interaction itself: holding
      the lipoproteins is not BamA's activity, it is what the lipoproteins do
      to BamA. Removal does not question the reported interactions.
    supported_by:
    - reference_id: PMID:15851030
      supporting_text: We describe the identification of a multiprotein complex required
        for the assembly of proteins in the OM of Escherichia coli.
