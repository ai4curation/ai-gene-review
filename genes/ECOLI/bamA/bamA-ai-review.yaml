core_functions:
- description: >-
    Beta-barrel insertase of the outer membrane and the central, essential
    subunit of the BAM complex. BamA receives unfolded outer-membrane proteins
    handed over by the periplasmic chaperone SurA at its POTRA 1 domain, holds
    and partially folds them in the lumen of its own sixteen-stranded barrel,
    and releases them sideways into the lipid bilayer through the weakly
    hydrogen-bonded seam between the barrel's first and last strands, so that
    each substrate strand is templated on BamA's gate as it enters the membrane.
    The reaction requires no ATP. The four lipoproteins BamB to BamE dock on the
    POTRA domains and rotate against the barrel to drive its conformational
    cycle, setting the rate and efficiency of the reaction without performing
    the insertion step; only BamA and BamD are essential. Beyond canonical
    beta-barrel porins and transporters, the same machine engages
    autotransporter passenger domains during their passage outward and threads
    the non-barrel lipoprotein RcsF through partner barrels for surface display,
    which makes BAM throughput the quantity the Rcs envelope-stress phosphorelay
    monitors.
  molecular_function:
    id: GO:0032977
    label: membrane insertase activity
  directly_involved_in:
  - id: GO:0051205
    label: protein insertion into membrane
  - id: GO:0043165
    label: Gram-negative-bacterium-type cell outer membrane assembly
  locations:
  - id: GO:0009279
    label: cell outer membrane
  in_complex:
    id: GO:1990063
    label: Bam protein complex
  supported_by:
  - reference_id: PMID:20378773
    supporting_text: We purified the components that fold and insert Escherichia coli
      outer membrane proteins and reconstituted beta-barrel protein assembly in proteoliposomes
      using the enzymatic activity of a protein substrate to report on its folding
      state.
  - reference_id: PMID:20378773
    supporting_text: The folded OmpT was resistant to extraction from the pellet by
      incubation in 100 mM sodium carbonate for 30 minutes, suggesting that the folded
      protein had been integrated into the membrane.
  - reference_id: PMID:24914988
    supporting_text: These findings strongly support a mechanism of OMP biogenesis in
      which substrates are partially folded inside the barrel cavity and are subsequently
      released laterally into the lipid bilayer.
  - reference_id: PMID:39218969
    supporting_text: BamA lateral gate forms a continuous β-sheet with residues in the
      C-terminal region of OmpX
  - reference_id: PMID:26901871
    supporting_text: these subunits rotate with respect to the integral membrane β-barrel
      of BamA to induce movement of the β-strands of the barrel and promote insertion
      of the nascent OMP
  - reference_id: PMID:26749448
    supporting_text: Of the five BAM subunits, only BamA and BamD are essential for
      cell viability.
  knowledge_gaps:
  - gap_statement: >-
      GOA records no molecular function for BamA beyond protein binding and
      chaperone binding, leaving the insertase activity expressed only through
      process and component terms. This review proposes GO:0032977, which the
      comparator check supports: yeast SAM50, the Omp85-family beta-barrel
      insertase of the mitochondrial outer membrane, carries the term by IMP,
      and E. coli YidC carries it by IMP and IDA. The gap appears to be a
      propagation failure rather than a curatorial judgment, since SAM50's
      annotation was never placed as an ancestral IBD and so no IBA reached the
      bacterial clade. Human SAMM50 and E. coli TamA are in the same position,
      with only protein binding in the molecular function aspect.
    boundary: >-
      Assert GO:0032977 as enables for BamA, on the strength of the
      proteoliposome reconstitution plus the structural evidence that the
      substrate strand pairs with BamA's own lateral gate. Do not assert it for
      the complex as an undifferentiated whole, and do not weaken it to
      contributes_to, since GO places the same term on SAM50 and YidC in their
      own right despite both working only within larger machines.
    gap_kind:
    - CURATION
    dark_aspect: MF_DARK
    significance: >-
      Two curation modules depend on this call. The absence of an insertase
      molecular function in GOA forced modules/bacterial_type_v_secretion.yaml to
      assert GO:0032977 for BamA as an explicit curator synthesis and flag the
      discrepancy; the same would apply to any pathway model of outer-membrane
      protein biogenesis. Settling the term on the gene removes the need for the
      synthesis.
  - gap_statement: >-
      No GO molecular function covers what BamA does to RcsF. RcsF has no
      transmembrane domain, so GO:0032977 does not apply to it on the term's own
      definition, yet RcsF binds the lumen of the BamA barrel at the very regions
      that open during barrel-substrate insertion and is exported by being
      assembled into a partner barrel. The activity is neither insertion of a
      transmembrane protein nor simple transport, and no term describes threading
      a lipoprotein through a partner barrel to the cell surface.
    boundary: >-
      Assert the insertase activity for the transmembrane substrates it is
      defined for, and record the RcsF route in prose. Do not stretch GO:0032977
      to cover RcsF, and do not fall back on a generic binding term, which is why
      the two RcsF protein binding rows are removed rather than modified.
    gap_kind:
    - ONTOLOGY
  - gap_statement: >-
      BamA's role as the receptor for CdiA-type contact-dependent growth
      inhibition effectors has no GO representation, and arguably should not
      have one on this gene. BamA is the epitope the attacking cell's CdiA
      recognises, and its own extracellular loops 6 and 7 determine target
      range, but it performs no step of the inhibition process. GO also has no
      contact-dependent-growth-inhibition term at all; the nearest comparator is
      FhuA, the colicin M and phage T1 receptor, which carries only the plain
      binding terms GO:0015643 and GO:0046790.
    boundary: >-
      Assert nothing for this role. Being recognised by a process is not
      participating in it, and importing a toxic-substance-binding term would
      reproduce the uninformativeness of the protein binding rows this review
      removes.
    gap_kind:
    - ONTOLOGY
    - BIOLOGY
suggested_questions:
- question: >-
    Should GO:0032977 membrane insertase activity be propagated across the Omp85
    superfamily as an ancestral assertion? Yeast SAM50 holds it by IMP but it was
    never placed as an IBD, so neither BamA, nor human SAMM50, nor TamA receives
    it, and all three carry only protein binding in the molecular function aspect
    despite being the catalytic barrel of their respective machines.
  experts:
  - PAINT curators
  - GO molecular function ontology editors
- question: >-
    Is a molecular function term needed for barrel-mediated export of a
    non-transmembrane substrate? BamA threads the lipoprotein RcsF through a
    partner barrel using the same lumen and gate regions that beta-barrel
    substrates use, but GO:0032977 is defined for transmembrane-domain-containing
    substrates and so excludes it by construction.
  experts:
  - GO molecular function ontology editors
  - bacterial cell envelope curators
- question: >-
    Are BAM and TAM redundant, sequential or substrate-specific for a given type
    V secretion substrate? The BamA literature reviewed here does not address the
    question: none of the twenty-two seeded references mentions TamA or TamB. What
    exists is BAM competence on one autotransporter, EspP, by crosslinking, and
    absolute TAM dependence for another, Antigen 43, in a reconstituted membrane,
    with no head-to-head comparison in one strain background.
  experts:
  - outer membrane protein biogenesis researchers
- question: >-
    Does GO need a term for contact-dependent growth inhibition, and if so should
    receptor proteins such as BamA be annotated to it at all? BamA is the
    best-characterised CDI receptor and its surface-loop polymorphism sets target
    range, yet it performs no step of the process, and the receptor comparators in
    E. coli carry only generic binding terms.
  experts:
  - GO biological process ontology editors
  - bacterial competition and CDI researchers
suggested_experiments:
- description: >-
    Assay a minimal BamA-only proteoliposome for insertase activity against a
    model beta-barrel substrate, titrating BamD and then the remaining
    lipoproteins back in. The existing reconstitution compared the five-protein
    complex with BamAB and BamACDE but never with BamA alone, so the question of
    whether BamA has intrinsic insertase activity or strictly requires BamD has
    not been answered directly. A positive result would settle whether enables or
    contributes_to is the right qualifier for GO:0032977 on this gene.
- description: >-
    Deplete bamA conditionally and delete tamA in the same strain background, and
    score surface display of a panel of type V substrates including EspP and
    Antigen 43 in each. This is the head-to-head comparison that the current
    literature lacks, and it is what would let
    modules/bacterial_type_v_secretion.yaml narrow its insertase axis from
    ONE_OR_MORE to something substrate-specific.
- description: >-
    Reconstitute RcsF export in the proteoliposome system using purified BAM and
    a partner barrel such as OmpA, and test whether a substrate lacking any
    transmembrane segment can be threaded out with no component other than BAM
    present. This would establish whether the lipoprotein route is the same
    activity applied to an unusual substrate or a mechanistically distinct one,
    which is what determines whether a new molecular function term is warranted.
