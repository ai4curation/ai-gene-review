id: P0A940
gene_symbol: bamA
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  BamA, also known as Omp85 or YaeT, is the essential central subunit of the
  beta-barrel assembly machinery of the Gram-negative outer membrane. It is
  built in two halves: a periplasmic N-terminal region carrying five POTRA
  domains, and a C-terminal discontinuous sixteen-stranded transmembrane
  beta-barrel whose first and last strands meet at a weakly hydrogen-bonded
  seam. Unfolded outer-membrane proteins delivered across the periplasm by the
  chaperone SurA are received at POTRA 1, pass into the barrel lumen where they
  partially fold, and leave sideways through the seam, so that each substrate
  strand is templated on BamA's own gate as it enters the lipid bilayer. The
  four lipoproteins BamB, BamC, BamD and BamE dock on the POTRA domains to form
  a periplasmic brim beneath the barrel crown and set the efficiency and
  conformational cycling of the machine without supplying the insertion step
  themselves. The reaction consumes no ATP, which is what allows outer-membrane
  protein biogenesis to proceed in a compartment that has no energy source.
  Beyond the canonical beta-barrel porins and transporters, BamA also engages
  autotransporter passenger domains during their passage to the cell surface
  and threads the lipoprotein stress sensor RcsF through partner barrels for
  surface display, making the machine's throughput the signal the Rcs
  phosphorelay monitors. Loss of BamA is lethal and depletion causes
  accumulation of unassembled outer-membrane proteins. Its outward-facing loops
  6 and 7 are additionally exploited as the species-specific receptor epitope
  for CdiA-type contact-dependent growth inhibition effectors.
