- id: PMID:15851030
  title: Identification of a multicomponent complex required for outer membrane biogenesis
    in Escherichia coli.
  findings:
  - statement: >-
      The founding identification of the Bam complex as a multiprotein machine
      required for outer-membrane protein assembly in E. coli.
    supporting_text: We describe the identification of a multiprotein complex required
      for the assembly of proteins in the OM of Escherichia coli.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Cached record is abstract-only. UniProt cites it for SUBUNIT and DISRUPTION
      PHENOTYPE. Source of three protein binding rows and one process row; the
      process row is accepted and the binding rows removed as uninformative.
- id: PMID:16079137
  title: Protein complexes of the Escherichia coli cell envelope.
  findings:
  - statement: >-
      Blue-native PAGE of inner and outer membrane complexes, with
      second-dimension SDS-PAGE and mass spectrometry, resolved 43 distinct
      envelope complexes.
    supporting_text: we have optimized the blue native-PAGE technique for the study
      of membrane protein complexes in the inner and outer membranes of Escherichia
      coli
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Cached record is abstract-only and does not name YaeT/BamA; the identification
      is in the full text and tables. UniProt cites it for SUBUNIT and SUBCELLULAR
      LOCATION, which corroborates the curator's reading. Supports the complex row
      as accepted and the over-general membrane row, which is proposed for
      replacement by cell outer membrane.
- id: PMID:16824102
  title: YfiO stabilizes the YaeT complex and is essential for outer membrane protein
    assembly in Escherichia coli.
  findings:
  - statement: >-
      BamD (YfiO) and BamB (YfgL) interact directly with BamA, while BamC (NlpB)
      reaches the complex through BamD.
    supporting_text: We demonstrate that YfiO and YfgL directly interact with YaeT
      in vitro, while NlpB interacts directly with YfiO.
  - statement: >-
      The complex is defined as the machine that targets and folds beta-barrel
      outer-membrane proteins.
    supporting_text: identification of a multicomponent YaeT complex in the outer membrane
      (OM) of Gram-negative bacteria that is involved in the targeting and folding
      of beta-barrel outer membrane proteins (OMPs)
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Cached record is abstract-only. Establishes the topology of lipoprotein
      attachment to BamA and that BamD depletion phenocopies BamA depletion.
- id: PMID:16829683
  title: Characterization of pores formed by YaeT (Omp85) from Escherichia coli.
  findings:
  - statement: >-
      Both full-length BamA and its isolated C-terminal membrane domain form
      pores in planar lipid bilayers, establishing the domain as
      membrane-integral and channel-forming.
    supporting_text: The full length YaeT and the isolated membrane domain induce pores
      when reconstituted in planar lipid membranes.
  - statement: >-
      The variable conductance of the pore was interpreted as the signature of a
      laterally opening channel that releases substrate proteins into the outer
      membrane.
    supporting_text: which could be an essential property of a lateral opening channel
      releasing proteins into the bacterial outer membrane
  - statement: >-
      The periplasmic N-terminal domain is required for BamA function in vivo,
      so the substrate-reception half is not dispensable.
    supporting_text: We could further show that the periplasmic domain proves to be
      essential for in vivo function of YaeT.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Cached record is abstract-only. Important to the insertase assignment because
      it shows the conduit is within BamA itself rather than at an interface with a
      partner subunit.
- id: PMID:17404237
  title: Lipoprotein SmpA is a component of the YaeT complex that assembles outer
    membrane proteins in Escherichia coli.
  findings:
  - statement: >-
      Identifies SmpA/BamE as the fifth component of the complex and shows it
      contributes to complex stability.
    supporting_text: Here, we report another component of the YaeT complex, the OM
      lipoprotein small protein A (SmpA).
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
