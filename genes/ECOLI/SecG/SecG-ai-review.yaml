suggested_questions:
- question: Which SecG conformational movements are required for SecA-driven transport of native E. coli substrates, and
    which substrates can be transported by SecYE without SecG?
suggested_experiments:
- description: Reconstitute SecYEG complexes carrying topology-inversion-defective SecG variants and compare their
    kinetics against SecYE and wild-type SecYEG with a panel of native preproteins.
  hypothesis: SecG topological rearrangement increases translocation efficiency for a substrate-specific subset rather
    than supplying an obligatory pore function.
  experiment_type: reconstituted preprotein translocation assay
