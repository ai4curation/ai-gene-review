id: P0AG99
gene_symbol: SecG
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: SecG is a small inner-membrane accessory subunit of the Escherichia coli SecYEG protein-conducting channel.
  It associates with SecY, contributes to SecYEG-dependent protein transmembrane transporter activity, stimulates
  efficient preprotein translocation, and undergoes SecA-linked topological rearrangements during the translocation
  cycle without supplying the ATPase activity, which resides in SecA.
