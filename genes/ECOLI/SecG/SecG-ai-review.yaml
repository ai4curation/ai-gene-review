    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:12359079
  qualifier: enables
  supporting_entities:
  - UniProtKB:P10408
  review:
    summary: The row records a physical interaction, but GO:0005515 protein binding is too generic to describe the Sec
      component activity.
    action: REMOVE
    reason: The interaction itself is not rejected. The problem is that GO:0005515 does not say whether the gene product
      is the SecA motor, the SecY pore, a SecYEG clamp/accessory subunit, or an export precursor. This row should be
      removed in favor of the more informative Sec molecular-function and process annotations.
    supported_by:
    - reference_id: file:ECOLI/SecG/SecG-notes.md
      supporting_text: Generic GO:0005515 protein-binding rows for SecG should be removed as uninformative interaction
        records.
    - reference_id: PMID:7650029
      supporting_text: These data establish that SecY, SecE, and SecG constitute the integral membrane domain of
        preprotein translocase.
