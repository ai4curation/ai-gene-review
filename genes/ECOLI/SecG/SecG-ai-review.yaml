    label: SRP-dependent cotranslational protein targeting to membrane, translocation
  evidence_type: IDA
  original_reference_id: PMID:10397756
  qualifier: acts_upstream_of_or_within
  review:
    summary: SecG contributes to the SecYEG pore used by the SRP cotranslational insertion route.
    action: ACCEPT
    reason: SecG is part of the SecYEG channel engaged by SRP-delivered nascent inner-membrane proteins.
    supported_by:
    - reference_id: file:ECOLI/SecG/SecG-notes.md
      supporting_text: Like SecY and SecE, SecG acts in the SecYEG pore used by both SecA/SecB post-translational export
        and SRP-dependent cotranslational insertion.
    - reference_id: PMID:10397756
      supporting_text: Both targeting pathways intersect at the translocation pore because they are equally affected by
        a blocked translocation channel.
