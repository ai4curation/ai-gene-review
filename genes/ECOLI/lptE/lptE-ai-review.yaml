        source_label: PANTHER:PTN002866256
        source_status: SUPPORTS_TRANSFER
        comment: The LptE-family node correctly places membership of a transporter complex; only the granularity is coarse, as the complex is the LPS transport system.
      - source_id: UniProtKB:P0ADC1
