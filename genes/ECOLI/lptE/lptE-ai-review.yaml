- term:
    id: GO:1990351
    label: transporter complex
  evidence_type: IDA
  original_reference_id: PMID:29449493
  qualifier: part_of
  review:
    summary: >-
      Sherman et al. 2018 reconstituted LPS transport from LptB2FGC
      proteoliposomes, across an LptA bridge, to outer-membrane proteoliposomes
      containing purified LptDE. Transport required all seven Lpt proteins.
    action: MODIFY
    reason: >-
      This row's evidence is the reconstituted trans-envelope Lpt bridge, not the
      LptDE subcomplex alone. GO:0062051 lipopolysaccharide transport system is an
      is_a child of transporter complex, and its definition cites this very paper,
      so it is the more specific term for what the experiment shows. This is
      consistent with the E. coli lptB and lptD reviews.
    proposed_replacement_terms:
    - id: GO:0062051
      label: lipopolysaccharide transport system
    supported_by:
    - reference_id: PMID:29449493
      supporting_text: Thus, all seven Lpt proteins and ATP are necessary and sufficient
        for membrane-to-membrane transport to occur.
- term:
    id: GO:0015221
    label: lipopolysaccharide transmembrane transporter activity
  evidence_type: IDA
  original_reference_id: PMID:24938785
  qualifier: contributes_to
  review:
    summary: >-
      Proposed contributes_to annotation. LptE is the luminal plug and
      LPS-binding subunit of the LptDE translocon, which moves LPS across the
      outer membrane into its outer leaflet. Purified LptE binds and
      disaggregates LPS, and mutating its LPS-binding site impairs
      outer-membrane biogenesis.
    action: NEW
    reason: >-
      The translocation activity belongs to the LptDE complex, not to LptE alone,
      so contributes_to is used. LptE does part of the work: it binds the LPS
      substrate and is proposed to act as an LPS transfer protein within the
      translocon. GO:0140332 lipopolysaccharide transfer activity was rejected
      because its definition describes aqueous-phase carriage between membranes,
      the bridge activity of LptC and LptA. This matches the PSEPK orthologue
      core function and the parallel NEW row on E. coli LptD.
    additional_reference_ids:
    - PMID:29449493
    supported_by:
    - reference_id: PMID:24938785
      supporting_text: We propose a model in which LptE functions as an LPS transfer
        protein in the OM translocon by disaggregating LPS during transport to allow
        for its insertion into the OM.
    - reference_id: PMID:29449493
      supporting_text: LptDE inserts LPS into the outer leaflet of the outer membrane
