  evidence_type: IDA
  original_reference_id: PMID:24938785
  qualifier: enables
  review:
    summary: >-
      Malojcic et al. 2014 solved the LptE crystal structure, predicted an
      LPS-binding site from homology to arthropod LPS-binding proteins, and
      confirmed binding by surface plasmon resonance. LptE also disaggregated
      LPS in vitro.
    action: ACCEPT
    reason: >-
      This is direct biophysical evidence of specific LPS binding by purified E.
      coli LptE, independently reported by Chng et al. 2010 (PMID:20203010).
      Mutating the binding site causes outer-membrane biogenesis defects,
      tying the binding to LptE's role in vivo.
    supported_by:
    - reference_id: PMID:24938785
      supporting_text: In vitro binding experiments established that LptE binds LPS,
        is able to interfere with LPS–LPS interactions, and affects LPS’s aggregation
        state.
    - reference_id: PMID:20203010
      supporting_text: We also demonstrate that LptE binds LPS specifically and may
        serve as a substrate recognition site at the OM.
