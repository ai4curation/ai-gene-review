suggested_questions:
- question: >-
    Is E. coli DdlB a monomer or a dimer in solution at physiological concentrations? The
    UniProt SUBUNIT line (monomer) and the GO IDA homodimerization row conflict.
- question: >-
    Why does E. coli retain two D-Ala-D-Ala ligases, and under what conditions does DdlA compensate
    for loss of DdlB?
suggested_experiments:
- experiment_type: biophysical characterization
  description: >-
    Determine the oligomeric state of purified DdlB across concentrations and ligand states
    by SEC-MALS and analytical ultracentrifugation to resolve the monomer/homodimer conflict.
