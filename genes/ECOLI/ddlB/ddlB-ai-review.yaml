  qualifier: enables
  review:
    summary: Homodimerization annotated from the 1991 DdlA/DdlB purification paper; not adjudicable here.
    action: UNDECIDED
    reason: >-
      The cached copy of PMID:1993184 is abstract-only and does not describe any
      oligomeric-state measurement, so the evidence behind this IDA cannot be seen. The
      curated UniProt entry records DdlB as a monomer, with no evidence tag. The crystal
      structures do not settle it: RCSB entries 1IOV, 1IOW and 2DLN contain a single DdlB
