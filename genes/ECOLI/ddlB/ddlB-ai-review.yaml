  evidence_type: IMP
  original_reference_id: PMID:8756703
  qualifier: enables
  review:
    summary: >-
      DdlB active-site mutants (Y216F, S150A, E15Q) altered substrate selection and gained
      depsipeptide or regio-isomeric ligase activities.
    action: ACCEPT
    reason: >-
      Mutating the Y216/S150/E15 triad that orients D-Ala1 changes the ligase reaction, a
      mutational dissection of the D-Ala-D-Ala ligase active site of this gene product. The
      gained D-Ala-D-Lac activity is an engineered property of mutants, not of wild-type DdlB,
      so no depsipeptide ligase term is proposed.
    supported_by:
    - reference_id: PMID:8756703
      supporting_text: >-
        Y216, S150, and E15 form a hydrogen-bonding triad that orients an omega-loop to close
        over the active site and also to orient substrate D-Ala1.
    - reference_id: PMID:8756703
      supporting_text: >-
        three E. coli DdlB active-site mutants that we made previously based on X-ray structure/function
        predictions have gained interesting new ligase activities
