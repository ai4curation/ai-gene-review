gene_symbol: ddlB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  DdlB is the principal D-alanine-D-alanine ligase of Escherichia coli, encoded by the classical
  ddl gene. It is an ATP-grasp enzyme that phosphorylates one D-alanine to an acylphosphate
  and condenses it with a second D-alanine, giving D-alanyl-D-alanine, ADP and phosphate,
  using two magnesium ions per subunit. The dipeptide is added by MurF to UDP-N-acetylmuramoyl-tripeptide
  to complete the cytoplasmic peptidoglycan precursor UDP-MurNAc-pentapeptide. A temperature-sensitive
  ddl mutant accumulates UDP-MurNAc-tripeptide, has reduced murein synthesis and lyses unless
  osmotically protected. A Glu15-Ser150-Tyr216 hydrogen-bonding triad orients an omega-loop
  over the active site and the first D-alanine; single mutations in this triad confer VanA-like
  D-Ala-D-lactate ligase activity. DdlB is a target of D-cycloserine and phosphinate inhibitors
  and is partly redundant with the paralogous DdlA.
