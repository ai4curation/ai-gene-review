id: P37773
gene_symbol: mpl
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  Mpl (murein peptide ligase, formerly YjfG) is the ATP- and Mg2+-dependent UDP-N-acetylmuramate:L-alanyl-gamma-D-glutamyl-meso-diaminopimelate
  ligase of Escherichia coli (EC 6.3.2.45). A paralog of MurC within the Mur ligase family, it works in
  the cytoplasmic arm of peptidoglycan recycling: it attaches the intact stem peptide recovered from imported
  muropeptides (L-Ala-gamma-D-Glu-meso-DAP, and also the tetra- and pentapeptides) directly to UDP-MurNAc,
  regenerating UDP-MurNAc-peptides that re-enter the MurF/MraY steps of wall synthesis without the MurC-MurE
  steps. Peptides with L-lysine in place of meso-DAP are poor substrates. The mpl gene is not essential,
  but it accounts for a large share of stem-peptide reuse. Mpl also binds the alarmone ppGpp in vitro.
