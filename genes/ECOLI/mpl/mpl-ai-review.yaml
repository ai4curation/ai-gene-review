suggested_questions:
- question: >-
    Does ppGpp binding modulate Mpl activity, linking peptidoglycan recycling to the stringent response?
- question: >-
    What fraction of E. coli stem peptides is recycled via Mpl versus degraded via LdcA/MpaA routes under
    different growth conditions?
suggested_experiments:
- description: >-
    Assay purified Mpl activity with increasing ppGpp and pppGpp, and compare UDP-MurNAc-peptide pools
    in wild type and relA spoT backgrounds with and without mpl.
  experiment_type: enzyme kinetics and metabolomics
