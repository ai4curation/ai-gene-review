  review:
    summary: >-
      Mpl consumes ATP in forming the amide bond between UDP-MurNAc and the recovered peptide.
    action: KEEP_AS_NON_CORE
    reason: >-
      Correct: ATP is a co-substrate of the ligase reaction. It is a property ancillary to the ligase
      activity rather than a separate function, shared by all Mur ligases. ATP binding is not an ancestor of the catalytic term, so nothing entails it, but it is
      peripheral to the core function, so non-core.
