  label: Escherichia coli K-12
description: 'ThrC is the pyridoxal-phosphate-dependent threonine synthase of Escherichia coli. It converts
  O-phospho-L-homoserine and water into L-threonine and phosphate, completing threonine biosynthesis. The catalytic
  cycle includes phosphate elimination and water addition. Slow side reactions with threonine or serine observed
  in vitro do not establish a principal catabolic role.'
