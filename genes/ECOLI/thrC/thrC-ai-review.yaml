- id: PMID:15911532
  title: Localization, annotation, and comparison of the Escherichia coli K-12 proteome under two
    states of growth.
  findings:
  - statement: The native K-12 study assigns protein forms to subcellular fractions; the abstract
      establishes the method but does not identify an individual thrC hit.
    supporting_text: 2,160 were annotated and assigned to the cytosol, periplasm, inner membrane,
      and outer membrane by biochemical fractionation followed by two-dimensional gel
      electrophoresis and tandem mass spectrometry.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: This is the original native K-12 proteomics source attached to the thrC cytosol
      annotation. Its cached abstract describes fractionation, 2D gels and tandem MS under two
      growth conditions, but does not list the individual thrC spot. Detailed protein tables were
      available upon request in the paper; they were not independently reinspected here. Distinct
      from the MC4100 LC-MS/MS study PMID:18304323.
- id: PMID:18304323
  title: Protein abundance profiling of the Escherichia coli cytosol.
  findings:
  - statement: The study identified proteins from the native MC4100 cytosolic fraction using
      complementary mass-spectrometry approaches.
    supporting_text: "we identified 1103 proteins from the cytosolic fraction of the Escherichia coli\n\
      strain MC4100."
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Native E. coli MC4100 fractionation and LC-MS/MS cytosolic proteomics. The full
      article establishes the study method; individual target peptide assignments in the
      supplemental table were not independently reinspected. Preserve the curator-assigned target
      localization without presenting the paper-wide quote as a newly checked target hit.
- id: PMID:4148765
  title: Mapping of the structural genes of the three aspartokinases and of the two homoserine
    dehydrogenases of Escherichia coli K-12.
  findings:
  - statement: Native mutants possessing one of the three aspartokinases connect the isofunctional
      enzymes to shared threonine/methionine/diaminopimelate requirements.
    supporting_text: "Mutants requiring threonine plus methionine (or homoserine), or threonine plus\n\
      methionine plus diaminopimelate (or homoserine plus diaminopimelate) have been\nisolated from strains
      possessing only one of the three isofunctional\naspartokinases."
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Native K-12 mutants were classified by enzyme defects and mapped. Supports
      isofunctional kinase and bifunctional dehydrogenase gene assignments and shared precursor
      physiology, not detailed purified-enzyme kinetics.
- id: PMID:4364333
  title: 'Threonine locus of Escherichia coli K-12: genetic structure and evidence for an operon.'
  findings:
  - statement: The native thrABC locus encodes the bifunctional kinase/dehydrogenase, homoserine
      kinase and threonine synthase.
    supporting_text: "thrA, thrB, and thrC specify the\nenzymes aspartokinase I-homoserine dehydrogenase
      I, homoserine kinase, and\nthreonine synthetase, respectively."
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Native K-12 genetic complementation establishes the thrABC assignments and
      separate functional regions in the single ThrA polypeptide. It does not establish physical
      substrate channeling between pathway enzymes.
- id: PMID:6316258
  title: 'Nucleotide sequence of thrC and of the transcription termination region of the threonine operon
    in Escherichia coli K12.'
  findings:
  - statement: The native thrC initiation site was identified using the threonine synthase
      N-terminal sequence.
    supporting_text: The translation initiation codon was identified by sequencing the N-terminal
      part of threonine synthase, the thrC gene product.
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Native thrC cloning and sequence-to-protein identity study. The N-terminal
      sequence connects the gene to the enzyme; detailed PLP chemistry is independently established
      by PMID7907888, not inferred from this sequencing paper.
- id: file:ECOLI/thrC/thrC-uniprot.txt
  title: UniProt record for ECOLI thrC
  findings: []
- id: PMID:7907888
  title: Mechanisms of interaction of Escherichia coli threonine synthase with substrates and
    inhibitors.
  findings:
  - statement: The primary ThrC reaction produces threonine from phosphohomoserine; serine
      beta-elimination was much less efficient under the tested conditions.
    supporting_text: "catalyzes L-threonine formation from L-homoserine phosphate (HSerP; Km = 0.5 mM,\n\
      V = 440 min-1) and DL-vinylglycine."
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Direct E. coli threonine synthase kinetics and mechanistic substrate/inhibitor
      study. The large kinetic difference between homoserine-phosphate turnover and serine
      beta-elimination limits physiological interpretation of the side reaction. No native catabolic
      role or new side-activity annotation is inferred.
