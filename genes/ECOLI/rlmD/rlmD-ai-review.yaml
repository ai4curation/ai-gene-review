core_functions:
- description: SAM-dependent C5 methylation of uridine 1939 in 23S rRNA. RlmD can act on defined short
    RNA substrates; its rRNA-binding architecture and experimentally established Fe-S cluster are integral
    biochemical features, distinct from a hypothesized physiological redox-regulatory function.
  molecular_function:
