- id: PMID:11779873
  title: Characterization of the 23 S ribosomal RNA m5U1939 methyltransferase from Escherichia coli.
  findings:
  - statement: Purified RlmD distinguishes 23S rRNA from tested 16S rRNA and tRNA.
    supporting_text: The purified enzyme catalyzed the AdoMet-dependent methylation of 23 S rRNA but did
      not act upon 16 S rRNA or tRNA.
  - statement: Site-specific RNA assays establish U1939 as the target.
    supporting_text: The enzyme specifically methylated U1939 as determined by a nuclease protection assay
      and by methylation assays using site-specific mutants of 23 S rRNA.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Original target characterization; abstract inspected after normal forced retrieval remained
      abstract-only. It explicitly reports purified enzyme, RNA substrate discrimination, U1939 mapping
      and kinetic assays.
- id: PMID:15181002
  title: 'Redox reactions of the iron-sulfur cluster in a ribosomal RNA methyltransferase, RumA: optical
    and EPR studies.'
  findings:
  - statement: RumA contains a directly measured iron-sulfur cluster.
    supporting_text: An unprecedented [4Fe-4S] iron-sulfur cluster was found in RumA, the enzyme that
      methylates U1939 in Escherichia coli 23 S ribosomal RNA
  - statement: Oxidative decomposition suggests, but does not demonstrate, physiological regulation.
    supporting_text: Oxidation of the cluster leads to its decomposition and that could be a mechanism
      for regulating the activity of RumA under conditions of oxidative stress in the cell.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text read. Direct RumA optical/EPR characterization and redox chemistry; proposed
      physiological regulation remains untested.
- id: PMID:12907714
  title: Identifying the methyltransferases for m(5)U747 and m(5)U1939 in 23S rRNA using MALDI mass spectrometry.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full independent mass-spectrometric study read. It confirms recombinant YgcA/RlmD U1939
      methylation and distinguishes inactive recombinant YbjF/RlmC.
  findings:
  - statement: A recombinant RlmD transcript assay confirms the dedicated U1939 reaction.
    supporting_text: A purified recombinant version of YgcA retains its activity and specificity, and
      methylates U1939 in an RNA transcript in vitro.
- id: PMID:15016356
  title: Crystal structure of RumA, an iron-sulfur cluster containing E. coli ribosomal RNA 5-methyluridine
    methyltransferase.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Accessible structural abstract and publication-linked UniProt features support the three-domain
