id: P55135
gene_symbol: rlmD
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: RlmD (RumA/YgcA) is an Escherichia coli K-12 SAM-dependent methyltransferase that converts
  U1939 of 23S rRNA to 5-methyluridine. Purified enzyme methylates 23S rRNA and short U1939-containing
  transcripts, but not the tested 16S rRNA or tRNA substrates. Its RNA-binding region recognizes and remodels
  the target RNA around a catalytic Cys389-containing methyltransferase domain. An experimentally characterized
  [4Fe-4S] cluster is associated with the RNA-binding region; the methyl-transfer reaction is not a radical-SAM
  redox reaction, and a physiological oxidative-stress regulatory role remains a hypothesis.
