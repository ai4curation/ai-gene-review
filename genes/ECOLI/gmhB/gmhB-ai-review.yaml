- id: PMID:11751812
  title: Biosynthesis pathway of ADP-L-glycero-beta-D-manno-heptose in Escherichia coli.
  findings:
  - statement: Purified E. coli GmhB hydrolyzes the heptose 1,7-bisphosphate intermediate and a gmhB deletion
      alters the LPS core.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Full text: direct E. coli HldE and GmhB biochemistry and gmhB mutant LPS phenotype.
      The preparative first isomerization uses A. thermoaerophilus GmhA, so this experiment is not a purified
      E. coli GmhA assay or a Pseudomonas HldD assay.'
- id: PMID:16990279
  title: Genome-wide analysis of substrate specificities of the Escherichia coli haloacid dehalogenase-like
    phosphatase family.
  findings:
  - statement: GmhB was included in a direct biochemical substrate-specificity screen of soluble E. coli
      HAD phosphatases.
  full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: 'Abstract-only cache: E. coli HAD-family substrate screen. The existing exact GmhB activity
      is independently demonstrated in PMID11751812 and PMID20050615; the abstract foregrounding other
      HADs does not invalidate this experimental annotation.'
- id: PMID:18304323
  title: Protein abundance profiling of the Escherichia coli cytosol.
  findings:
  - statement: Cytosolic protein abundance study cited by the GOA cytosol row.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text describes E. coli cytosolic proteomics. Retain curator-assigned target localization;
      a target-specific peptide measurement was not independently recovered. The cohort-level sentence
      is not quoted as direct support for GmhB localization.
- id: PMID:20050614
  title: Structural determinants of substrate recognition in the HAD superfamily member D-glycero-D-manno-heptose-1,7-bisphosphate
    phosphatase (GmhB) .
  findings:
  - statement: X-ray structures of E. coli GmhB with Mg, substrate, and Zn-binding loop mutants established
      the structural basis of HBP specificity.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text directly studies E. coli GmhB structures and mutations, distinguishing catalytic
      magnesium from the zinc-coordinating substrate-recognition loop. The article includes an apparent
      accession typo P63288; target identity is confirmed by E. coli K-12 sequence/structures and the
      other GmhB studies.
- id: PMID:20050615
  title: 'Divergence of biochemical function in the HAD superfamily: D-glycero-D-manno-heptose-1,7-bisphosphate
    phosphatase (GmhB).'
  findings:
  - statement: Kinetic and NMR assays showed that E. coli GmhB is selective for D-glycero-D-manno-heptose
      1-beta,7-bisphosphate and removes the C-7 phosphate.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Full text: biochemical and NMR characterization of E. coli GmhB establishes C7-specific
      dephosphorylation and approximately 100-fold beta versus alpha catalytic-efficiency preference.
      Comparative ortholog results must not be treated as identical anomeric preferences.'
- id: PMID:20050699
  title: Structural and kinetic characterization of the LPS biosynthetic enzyme D-alpha,beta-D-heptose-1,7-bisphosphate
    phosphatase (GmhB) from Escherichia coli.
  findings:
  - statement: Abstract-only cached structural/kinetic study that is cited by GOA for Mg and Zn binding
      and by UniProt for the GmhB crystal structures.
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Abstract-only cache: direct E. coli GmhB structural/kinetic study. Detailed metal assignments
      are independently corroborated by full-text PMID20050614 and curated UniProt; no inference of absence
      from this abstract.'
- id: PMID:31449400
  title: Biosynthesis of GDP-d-glycero-α-d-manno-heptose for the Capsular Polysaccharide of Campylobacter
    jejuni.
  findings:
  - statement: Direct E. coli GmhB use in preparative GDP-alpha-heptose synthesis documents alpha-anomer
      substrate promiscuity rather than a native E. coli GDP-heptose pathway.
    supporting_text: 'GmhB from E. coli was used as a substitute for Cj1152 in large-scale reactions.
      The gene for GmhB (Uniprot ID: P63228) was amplified from the genomic DNA of E. coli K12'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text explicitly clones E. coli K12 GmhB, accession P63228, as an alpha-anomer phosphatase
      substitute for Cj1152. It corroborates genuine activity despite a Campylobacter-focused title; it
      does not establish a native E. coli GDP-heptose pathway.
