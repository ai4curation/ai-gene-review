id: P63228
gene_symbol: gmhB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: GmhB is a soluble HAD-family D-glycero-beta-D-manno-heptose 1,7-bisphosphate 7-phosphatase
  in the ADP-heptose pathway. It removes the C-7 phosphate from D-glycero-beta-D-manno-heptose 1,7-bisphosphate
  to form D-glycero-beta-D-manno-heptose 1-phosphate, which HldE then adenylylates en route to the ADP-L-glycero-beta-D-manno-heptose
  donor used for LPS inner-core assembly. GmhB strongly prefers the beta-HBP anomer but can also turn
  over alpha-HBP in vitro. Catalytic magnesium supports phosphoryl transfer through an aspartyl-phosphate
  intermediate, while a separate zinc-coordinating loop helps recognize the substrate.
