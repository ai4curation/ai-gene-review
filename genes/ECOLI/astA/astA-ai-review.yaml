- term:
    id: GO:0009015
    label: N-succinylarginine dihydrolase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN000764516
  - UniProtKB:P76216
  review:
    summary: >-
      PAINT IBA of the AstB reaction onto AstA. The only seed is E. coli AstB
      (P76216), but the node PTN000764516 also covers the AstA transferase
      subfamily, so the dihydrolase activity leaks onto transferases.
    action: REMOVE
    reason: >-
      AstA is an acyl-CoA N-acyltransferase (Pfam AstA, IPR016181), not an
      amidinotransferase-fold dihydrolase like AstB; it catalyzes the preceding
      step and its product is the dihydrolase substrate. E. coli encodes a separate
      dihydrolase, AstB, whose disruption alone eliminates the activity. The
      dihydrolase IBD belongs on the SF2 (AstB) clade, not on the node shared with
      SF1. Recorded as a PAINT node defect.
    supported_by:
    - reference_id: file:ECOLI/astA/astA-uniprot.txt
      record_section: ["CC:SIMILARITY"]
      supporting_text: >-
        SIMILARITY: Belongs to the arginine N-succinyltransferase family.
    - reference_id: file:ECOLI/astA/astA-uniprot.txt
      record_section: ["DR:Pfam"]
      supporting_text: Pfam; PF04958; AstA; 1.
    - reference_id: PMID:9696779
      supporting_text: Disruption of astB eliminated succinylarginine dihydrolase activity
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - ROLE_CONFLATION
      source_entities:
      - source_id: PANTHER:PTN000764516
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          The seed (E. coli AstB, P76216) is a genuine dihydrolase, but the node also
          covers the SF1 transferases; the IBD sits too deep for this term.
      - source_id: UniProtKB:P76216
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: AstB catalyzes the next pathway step with an unrelated fold.
    source_defects:
    - defect_type: WRONG_TERM
      resource: GO_CENTRAL
      record: PANTHER:PTN000764516
      requested_change: CHECK
      asserted_value: GO:0009015
      cause: OVER_PROPAGATION
      confidence: CONFIRMED
      explanation: >-
        The GO:0009015 IBD at PTN000764516 is seeded only by E. coli AstB (P76216),
        but the node also covers PTHR30420:SF1, the arginine N-succinyltransferases
        (E. coli AstA P0AE37, P. aeruginosa AruF P80357 and AruG P80358), which
        receive the dihydrolase activity by IBA. Move the IBD to the SF2
        (N-succinylarginine dihydrolase) clade or add an IKR/NOT block for the SF1
        transferase clade.
