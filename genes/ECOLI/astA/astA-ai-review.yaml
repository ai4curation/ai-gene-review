id: P0AE37
gene_symbol: astA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  astA (b1747) encodes the single-chain arginine N-succinyltransferase of
  Escherichia coli (EC 2.3.1.109), a cytoplasmic acyl-CoA N-acyltransferase
  (GNAT-like) enzyme that transfers the succinyl group of succinyl-CoA to the
  alpha-amino group of L-arginine to form N2-succinyl-L-arginine. This is the
  first of five reactions of the ammonia-producing arginine succinyltransferase
  (AST) pathway, encoded by the astCADBE operon, which E. coli and related
  enterobacteria use to catabolize arginine as a nitrogen source; the operon is
  induced by nitrogen limitation and, in stationary phase, by sigma S.
  Pseudomonads carry out the same reaction with a two-chain (AruF/AruG,
  AstA-II/AstA-I) heterotetrameric enzyme whose chains are paralogs of this
  single-chain protein.
