  review:
    summary: The specific catalytic activity of AstA, from HAMAP/InterPro/EC mapping.
    action: ACCEPT
    reason: >-
      E. coli AstA is a single-chain enzyme (no partner chain is encoded in the
      astCADBE operon), so enables is the correct qualifier here, unlike the split
      Pseudomonas chains. UniProt's FUNCTION statement rests on the E. coli
      genetics paper that defined the operon.
