- id: PMID:1618807
  title: Redesigned purification yields a fully functional PutA protein dimer from Escherichia coli.
  findings:
  - statement: Purified native PutA is a dimer with copurifying PRODH and P5CDH activities, binds put
      DNA and reconstitutes onto inverted membrane vesicles.
    supporting_text: We showed copurification of proline and delta 1-pyrroline-5-carboxylate dehydrogenase
      activities
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only in cache; abstract supports both activities, DNA binding, inverted-vesicle
      membrane association and dimer state.
- id: PMID:6321477
  title: Proline dehydrogenase from Escherichia coli K12. Reconstitution of a functional membrane association.
  findings:
  - statement: Soluble and membrane-associated PutA forms differ kinetically; membrane-bound enzyme feeds
      the respiratory chain.
    supporting_text: The membrane-associated enzyme transfers electrons from L-proline to O2 via the respiratory
      chain
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only; classic membrane-reconstitution study of E. coli K12 PutA.
- id: PMID:11294639
  title: Redox properties of the PutA protein from Escherichia coli and the influence of the flavin redox
    state on PutA-DNA interactions.
  findings:
  - statement: PutA-bound FAD redox potential determined; FAD redox state only modestly affects DNA binding.
    supporting_text: PutA represses transcription of the putA and putP genes by binding to the control
      region DNA of the put regulon
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only; direct DNA-binding measurements with put intergenic DNA.
- id: PMID:12009917
  title: Electrochemical and functional characterization of the proline dehydrogenase domain of the PutA
    flavoprotein from Escherichia coli.
  findings:
  - statement: PutA669 (residues 1-669) is a dimeric PRODH lacking P5CDH and membrane binding but retaining
      specific DNA binding.
    supporting_text: PutA(669) lacks P5CDH activity
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only; domain dissection study.
- id: PMID:12514740
  title: Structure of the proline dehydrogenase domain of the multifunctional PutA flavoprotein.
  findings:
  - statement: 'First PutA/PRODH crystal structure: domain-swapped dimer with beta/alpha-barrel PRODH
      domain.'
    supporting_text: The structure is a domain-swapped dimer
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only; structural study of E. coli PutA669.
- id: PMID:15155740
  title: Identification and characterization of the DNA-binding domain of the multifunctional PutA flavoenzyme.
  findings:
  - statement: DNA-binding RHH domain mapped to residues 1-47; PutA90 and PutA47 repress in vivo.
    supporting_text: Cell-based transcriptional assays demonstrate that PutA90 functions as a transcriptional
      repressor in vivo
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only; defines repressor domain.
- id: PMID:18586269
  title: Structural basis of the transcriptional regulation of the proline utilization regulon by multifunctional
    PutA.
  findings:
  - statement: Five GTTGCA operators mapped; PutA52-DNA crystal structure; operator-specific repression
      of putA vs putP.
    supporting_text: Three of the sites are shown to be critical for repression of putA, whereas the two
      other sites are important for repression of putP
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only in cache (PMC2665032 exists).
- id: PMID:19140736
  title: A conserved active site tyrosine residue of proline dehydrogenase helps enforce the preference
    for proline over hydroxyproline as the substrate.
  findings:
  - statement: Tyr540 in the PRODH active site enforces proline over hydroxyproline specificity.
    supporting_text: Mutation of Tyr540 increases the catalytic efficiency for hydroxyproline 3-fold and
      decreases the specificity for proline
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text cached; mutational/structural study of E. coli PutA PRODH domain.
- id: PMID:22040654
  title: Steady-state kinetic mechanism of the proline:ubiquinone oxidoreductase activity of proline utilization
    A (PutA) from Escherichia coli.
  findings:
  - statement: Proline:ubiquinone oxidoreductase activity follows a two-site ping-pong mechanism.
    supporting_text: the oxidation of proline is coupled to the reduction of ubiquinone (CoQ) by the PRODH
      domain
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached; establishes ubiquinone as acceptor for E. coli PutA PRODH.
- id: PMID:25384482
  title: Proline metabolism increases katG expression and oxidative stress resistance in Escherichia coli.
  findings:
  - statement: putA loss increases oxidative stress sensitivity; proline oxidation produces H2O2 and induces
      katG.
    supporting_text: Proline oxidative metabolism was shown to generate hydrogen peroxide
    full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only; physiological, indirect role.
- id: PMID:28712849
  title: Structure, function, and mechanism of proline utilization A (PutA).
  findings:
  - statement: Family review of PutA structure and functional switching, with E. coli PutA as the model.
    supporting_text: When the flavin cofactor is oxidized, EcPutA is cytosolic and functions as a transcriptional
      repressor of the put regulon via the N-terminal RHH domain.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached; authoritative review from the Becker/Tanner groups.
