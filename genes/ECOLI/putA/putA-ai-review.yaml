id: P09546
gene_symbol: putA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: putA encodes the trifunctional proline utilization A (PutA) flavoprotein of Escherichia coli.
  Its N-terminal ribbon-helix-helix domain binds GTTGCA operator sites in the putA-putP intergenic control
  region and represses both genes; its FAD-dependent proline dehydrogenase domain oxidizes L-proline to
  1-pyrroline-5-carboxylate, passing electrons to ubiquinone in the respiratory chain; and its C-terminal
  NAD+-dependent L-glutamate gamma-semialdehyde (P5C) dehydrogenase domain oxidizes the hydrolysed intermediate
  to L-glutamate, with substrate channeling between the two active sites. When proline is scarce the flavin
  is oxidized and the dimeric protein is cytosolic and acts as a repressor; reduction of the flavin by
  proline triggers a conformational switch that moves PutA to the cytoplasmic face of the inner membrane,
  where it catabolizes proline for use as a carbon, nitrogen and energy source and relieves repression
  of the put genes.
