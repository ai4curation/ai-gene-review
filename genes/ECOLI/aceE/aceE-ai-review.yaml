suggested_questions:
- question: How is E1p activity partitioned among the 24 E1p dimers bound to the E2p octahedral core during
    steady-state turnover, and does active-site communication between the two E1p catalytic centres limit
    flux in vivo?
suggested_experiments:
- description: Measure pyruvate-dependent reductive acetylation of isolated E2p lipoyl domains by wild-type
    and inner-loop variant E1p in reconstituted complexes with defined E1p:E2p stoichiometry.
  experiment_type: enzyme kinetics with reconstituted complexes
