product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: AceE (E1p) is the thiamine diphosphate- and Mg2+-dependent pyruvate dehydrogenase E1 component
  of the Escherichia coli pyruvate dehydrogenase multienzyme complex. The homodimeric enzyme decarboxylates
  pyruvate at active centres formed between its two subunits and transfers the resulting acetyl group
  reductively to the lipoyl domains of the AceF (E2p) core, the first committed step in the cytosolic
  oxidative conversion of pyruvate to acetyl-CoA, CO2 and NADH by the AceE-AceF-LpdA complex.
