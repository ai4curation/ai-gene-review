- term:
    id: GO:0060090
    label: molecular adaptor activity
  evidence_type: EXP
  original_reference_id: PMID:11955070
  qualifier: enables
  review:
    summary: Molecular adaptor activity does not describe the catalytic E1p subunit.
    action: MARK_AS_OVER_ANNOTATED
    reason: GO:0060090 is a binding activity that brings molecules together without catalysis. The cited
      structure describes a catalytic homodimeric E1 whose binding to E2p serves its own reaction (reductive
      acetylation of the E2p lipoyl domains), so E2p binding is part of the E1p catalytic activity rather
      than an adaptor function. The cached paper is abstract-only, so the row is flagged rather than removed.
    supported_by:
    - reference_id: PMID:11955070
      supporting_text: These differences may be responsible for reported alternative E1p binding modes
        to E2 components within the respective complexes.
