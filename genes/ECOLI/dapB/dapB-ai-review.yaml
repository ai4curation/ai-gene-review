id: P04036
gene_symbol: dapB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: DapB (4-hydroxy-tetrahydrodipicolinate reductase, historically dihydrodipicolinate reductase)
  catalyses the second step of the diaminopimelate (DAP) pathway of L-lysine biosynthesis in Escherichia
  coli. It converts the DapA product (4S)-4-hydroxy-tetrahydrodipicolinate to (S)-2,3,4,5-tetrahydrodipicolinate
  by a combined dehydration and NAD(P)H-dependent reduction, with NADH preferred over NADPH. The cytosolic
  enzyme is a homotetramer, and dapB transcription is activated by ArgP and repressed by lysine.
