core_functions:
- description: >-
    The experimentally grounded function of YrhB is ATP-independent chaperone-like
    refolding assistance: it prevents heat-induced aggregation of a client protein and
    promotes refolding of uridine phosphorylase without ATP in vitro. Because the K12
    and BL21(DE3) proteins are 100% identical, this direct evidence applies to the K12
    reference protein. A predicted Imm35 peptidase-inhibitor / polymorphic-toxin immunity
    role has no experimental support in any Imm35 family member and no adjacent toxin
    gene in K12, so it should not be asserted as a GO annotation.
  molecular_function:
    id: GO:0044183
    label: protein folding chaperone
  directly_involved_in:
    - id: GO:0042026
      label: protein refolding
  locations:
