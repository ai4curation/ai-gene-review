id: P46857
gene_symbol: yrhB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  YrhB is a small (94 aa, 10.6 kDa) uncharacterized protein in E. coli K12 encoded by b3446.
  It belongs to the Imm35 (Immunity protein 35) family (Pfam PF15567 / InterPro IPR029082),
  which was identified computationally as part of the polymorphic toxin system immunity
  protein repertoire (Zhang et al. 2012, PMID:22731697). Direct in vitro assays
  (Ahn et al. 2012, PMID:22569261) demonstrate
  ATP-independent chaperone-like activity for YrhB (preventing heat-induced client
  aggregation and promoting refolding); because the K12 and BL21(DE3) proteins are 100%
  identical, this experimental evidence applies to the K12 reference protein. The Imm35
  assignment is consistent with a predicted polymorphic-toxin immunity fold, but an
  independent fold-assignment review found no experimental immunity support in any Imm35
  family member and no adjacent cognate toxin gene in K12.
  The protein remains at UniProt evidence level PE 4 (Predicted).
  Notably, DeepECTF (a deep learning enzyme function predictor) incorrectly predicted
  EC 4.1.2.50 (6-carboxytetrahydropterin synthase) for YrhB (de Crecy-Lagard et al. 2025,
  PMID:40703034). This is a logic error because E. coli already encodes the bona fide
  6-carboxytetrahydropterin synthase as QueD (b2765), and a queD mutant lacks this
  activity entirely, proving there is no functional redundancy with YrhB.
tags:
  - uncharacterized
  - polymorphic-toxin-system
  - ML-misannotation-case-study
existing_annotations:
# NOTE: The GOA file for yrhB (P46857) returned 0 annotations from QuickGO.
# This is consistent with UniProt PE level 4 (Predicted) and RecName "Uncharacterized protein YrhB".
# There are no existing GO annotations to review.
# Below we propose annotations based on the experimentally supported chaperone literature.

- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IC
  original_reference_id: PMID:22569261
  review:
    summary: >-
      YrhB is most likely cytoplasmic because it is a small protein with no annotated
      signal peptide or transmembrane segment and its experimentally observed activity
      is ATP-independent refolding assistance for soluble client proteins.
    action: NEW
    reason: >-
      Cytoplasm is the expected location for a 94-aa K-12 protein with no UniProt-annotated
      signal peptide or transmembrane segment that has been purified and assayed as an
      ATP-independent chaperone-like protein for soluble clients. The unsupported Imm35
      immunity hypothesis is not used to justify this localization.
    additional_reference_ids:
      - PMID:22569261
      - file:ECOLI/yrhB/yrhB-uniprot.txt
    supported_by:
      - reference_id: PMID:22569261
        supporting_text: >-
          Escherichia coli YrhB (10.6 kDa) from strain BL21(DE3) that is commonly used for
          protein overexpression is a stable chaperone-like protein and indispensable for
          supporting the growth of BL21(DE3) at 48 °C but not defined as conventional heat
          shock protein (HSP)
      - reference_id: file:ECOLI/yrhB/yrhB-uniprot.txt
        supporting_text: FT   CHAIN           1..94

- term:
    id: GO:0044183
    label: protein folding chaperone
  evidence_type: IDA
  original_reference_id: PMID:22569261
  review:
    summary: >-
      Ahn et al. (2012) showed by direct in vitro assays that YrhB is an ATP-independent
      chaperone-like protein: it prevents heat-induced aggregation of PurK and promotes
      refolding of uridine phosphorylase. OpenScientist confirmed the Imm35 fold (AlphaFold
      pLDDT 95.2, Foldseek) but established that the K12 and BL21(DE3) proteins are 100%
      identical, so this direct evidence applies to K12. GO:0044183 captures the
      refolding-assistance activity; the aggregation-prevention assay shows client binding but
      should not be recast as a generic obsolete-term replacement.
    action: NEW
    reason: >-
      This is the best-supported molecular function for YrhB. It rests on direct in vitro
      assays (IDA, Ahn et al. 2012) of aggregation prevention and ATP-independent refolding,
      which apply to K12 because the K12 and BL21(DE3) sequences are 100% identical. Unlike the
      ISS-only Imm35 immunity prediction, this function is experimentally demonstrated, so the
      OpenScientist analysis recommends assigning GO:0044183 rather than GO:0030414/GO:0030153.
      GO:0044183 is used rather than its ATP-dependent child GO:0140662 because Ahn et al.
      demonstrated refolding in the absence of ATP.
    additional_reference_ids:
      - PMID:22569261
    supported_by:
      - reference_id: PMID:22569261
        supporting_text: >-
          YrhB effectively prevented heat-induced aggregation of ribonucleotide synthetase (PurK).
      - reference_id: file:ECOLI/yrhB/yrhB-hypotheses/fold-assignment-imm35/openscientist.md
        supporting_text: >-
          YrhB functions as a chaperone-like protein with multiple validated activities, using
          a protein 100% identical between the BL21(DE3) strain used in the study and the K12
          reference strain.

- term:
    id: GO:0042026
    label: protein refolding
  evidence_type: IDA
  original_reference_id: PMID:22569261
  review:
    summary: >-
      Ahn et al. (2012) demonstrated that, without ATP, YrhB alone promoted in vitro refolding
      of uridine phosphorylase and protected the refolded enzyme from thermal denaturation. The
      K12 and BL21(DE3) proteins are 100% identical (OpenScientist), so this applies to K12.
    action: NEW
    reason: >-
      Direct in vitro refolding activity (IDA, Ahn et al. 2012) supports protein refolding as a
      biological process for YrhB, the process counterpart of its GO:0044183 chaperone molecular
      function.
    additional_reference_ids:
      - PMID:22569261
    supported_by:
      - reference_id: PMID:22569261
        supporting_text: >-
          Without ATP, YrhB alone promoted in vitro refolding of uridine phosphorylase (UDP) and
          protected thermal denaturation of the refolded UDP.

references:
- id: PMID:22731697
  title: >-
    Polymorphic toxin systems: Comprehensive characterization of trafficking modes,
    processing, mechanisms of action, immunity and ecology using comparative genomics.
  findings:
    - statement: >-
        Imm35 (PF15567) was identified as an immunity protein family in bacterial
        polymorphic toxin systems, specifically associated with the papain-like peptidase
        Tox-PL1 toxin domain.
      supporting_text: >-
        Imm35 is specifically associated only with the papain-like peptide Tox-PL1,
        suggesting that it functions specifically as a peptidase inhibitor
    - statement: >-
        Over 90 families of immunity proteins were identified in polymorphic toxin systems,
        neutralizing between one and at least 27 distinct types of toxin domains.
      supporting_text: >-
        Over 90 families of immunity proteins might neutralize anywhere between a single
        to at least 27 distinct types of toxin domains
- id: PMID:22569261
  title: >-
    YrhB is a highly stable small protein with unique chaperone-like activity in
    Escherichia coli BL21(DE3).
  findings:
    - statement: >-
        YrhB from E. coli BL21(DE3) showed chaperone-like activity: it prevented
        heat-induced aggregation of PurK, promoted in vitro refolding of uridine
        phosphorylase, and reduced inclusion body formation. YrhB was upregulated
        only under heat shock. However, this was demonstrated in BL21(DE3), not K12.
      supporting_text: >-
        Escherichia coli YrhB (10.6 kDa) from strain BL21(DE3) that is commonly used for
        protein overexpression is a stable chaperone-like protein and indispensable for
        supporting the growth of BL21(DE3) at 48 °C but not defined as conventional heat
        shock protein (HSP)
- id: DOI:10.1007/978-0-8176-4747-1
  title: Identification and characterization of Zn(II)-responsive genes and proteins
    in E. coli.
  full_text_unavailable: true
  reference_review:
    relevance: LOW
    correctness: WRONG_IDENTIFIER
    review_notes: >-
      This DOI resolves to a Birkhäuser book rather than to the Easton 2007 TPEN
      transcriptomics dataset cited by the deleted finding, so the metal-chelation
      expression lead is left unverified and is not used for GO assertions.
  findings: []
- id: PMID:40703034
  title: >-
    Limitations of current machine learning models in predicting enzymatic functions
    for uncharacterized proteins.
  findings:
    - statement: >-
        DeepECTF incorrectly predicted EC 4.1.2.50 (6-carboxytetrahydropterin synthase)
        for YrhB. This is a logic error because E. coli already encodes this enzyme
        as QueD (b2765), and a queD mutant lacks the activity entirely.
      supporting_text: >-
        YrhB/b3446 is predicted to be a 6-carboxytetrahydropterin synthase (EC 4.1.2.50),
        but E. coli already encodes this enzyme (QueD/b2765) and a queD mutant lacks
        this activity (Zallot et al. 2017)
    - statement: >-
        This exemplifies how ML models can ignore existing gene-function assignments
        in the organism, leading to logically impossible predictions.
      supporting_text: >-
        current ML methods not only mostly fail to make novel predictions but also make
        basic logic errors in their predictions that human annotators avoid by leveraging
        the available knowledge base
