- id: file:ECOLI/yrhB/yrhB-hypotheses/fold-assignment-imm35/openscientist.md
  title: >-
    OpenScientist hypothesis run: YrhB Imm35 fold vs function (immunity / peptidase-inhibitor
    over-annotation)
  findings:
    - statement: >-
        Compute-driven analysis confirmed the Imm35 fold (AlphaFold pLDDT 95.2, Foldseek) but
        found the ISS immunity / peptidase-inhibitor annotations over-annotated (no Imm35 member
