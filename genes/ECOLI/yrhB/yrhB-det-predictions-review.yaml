id: P46857
gene_symbol: yrhB
locus_tag: b3446
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
status: COMPLETE
description: >-
  YrhB DeepECTF prediction review. The DeepECTF prediction of 6-carboxytetrahydropterin
  synthase (EC 4.1.2.50) is incorrect. This activity is already catalyzed by QueD/b2765
  in E. coli, and queD mutants lack this activity entirely, demonstrating no redundancy.
  YrhB adopts the Imm35 fold but is experimentally supported as an ATP-independent
  chaperone-like protein, a function unrelated to EC:4.1.2.50.
references:
  - id: PMID:37963869
    title: Functional annotation of enzyme-encoding genes using deep learning with transformer layers.
  - id: PMID:40703034
    title: Limitations of current machine learning models in predicting enzymatic functions for uncharacterized
      proteins.
  - id: PMID:22569261
    title: YrhB is a highly stable small protein with unique chaperone-like activity in Escherichia coli
      BL21(DE3).
  - id: file:ECOLI/yrhB/yrhB-hypotheses/fold-assignment-imm35/openscientist.md
    title: 'OpenScientist hypothesis run: YrhB Imm35 fold vs function'
    publication_type: DEEP_RESEARCH
    findings:
    - statement: OpenScientist confirmed the Imm35 fold but found that chaperone activity, not bacteriocin
        immunity or peptidase inhibition, is the supported YrhB function.
      supporting_text: The ISS-based immunity annotations should not be assigned; instead, **GO:0044183
        (protein folding chaperone)** is the best-supported molecular function term.
