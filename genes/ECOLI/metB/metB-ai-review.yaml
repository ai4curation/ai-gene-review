      of substrate specificity.
  findings:
  - statement: MetB catalyses PLP-dependent gamma-replacement of O-succinyl-L-homoserine and L-cysteine and crystallises
      as an alpha4 tetramer.
    supporting_text: catalyses the pyridoxal 5'-phosphate (PLP)-dependent gamma-replacement of O-succinyl-L-homoserine
      and L-cysteine, yielding L-cystathionine
- id: PMID:14503880
  title: Escherichia coli cystathionine gamma-synthase does not obey ping-pong kinetics. Novel continuous assays
    for the elimination and substitution reactions.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract checked. Gives kcat/Km for replacement (9.8 x 10^4 M-1 s-1) and for the competing gamma-elimination
      (1350 M-1 s-1), the basis for treating elimination as a minor side reaction.
  findings:
  - statement: Ordered replacement mechanism with O-succinyl-L-homoserine binding first; competing gamma-elimination
      is about 70-fold less efficient.
    supporting_text: The enzyme also catalyzes a competing gamma-elimination reaction, in which L-OSHS is hydrolyzed
      to succinate, NH(3), and alpha-ketobutyrate
- id: PMID:22855027
  title: Exploration of the active site of Escherichia coli cystathionine γ-synthase.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract checked. Site-directed mutagenesis of active-site residues; describes the elimination
