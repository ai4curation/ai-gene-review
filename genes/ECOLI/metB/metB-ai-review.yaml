  review:
    summary: PAINT IBA from node PTN000211591 (cystathionine gamma-lyase seeds) for L-cysteine biosynthesis, i.e.
      reverse trans-sulfuration from homocysteine to cysteine.
    action: REMOVE
    reason: Wrong direction for E. coli MetB. MetB consumes L-cysteine, condensing it with O-succinyl-L-homoserine
      to make cystathionine on the forward route to homocysteine and methionine. E. coli makes cysteine by sulfhydrylation
      of O-acetylserine (CysK/CysM) and lacks the reverse trans-sulfuration enzymes. The cysteine-biosynthesis claim
      is valid for the gamma-lyase seeds but is over-propagated to the bacterial gamma-synthase branch.
