      cofactor per monomer.
  - statement: MetB also catalyses gamma-elimination of O-succinyl-L-homoserine.
    supporting_text: The Km value for the elimination reaction with O-succinyl-L-homoserine was calculated to be
      0.33 mM with maximal velocity of 460 min-1.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract checked against PubMed. Primary biochemical characterisation of purified E. coli MetB
      (tetramer, one PLP per subunit, replacement and elimination kinetics). Basis of the IDA rows.
