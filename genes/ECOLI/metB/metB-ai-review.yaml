  review:
    summary: PAINT IBA from node PTN000211591, seeded by cystathionine gamma-lyases (mouse and human CTH, yeast
      CYS3, Aspergillus C8VM61, B. subtilis O05394) and M. tuberculosis MetB. The node joins the reverse trans-sulfuration
      gamma-lyases with bacterial gamma-synthases, so the lyase activity is propagated into the E. coli MetB branch.
    action: MARK_AS_OVER_ANNOTATED
    reason: Cystathionine gamma-lyase (cleavage of cystathionine to cysteine, 2-oxobutanoate and ammonia) is the
      second step of the fungal and animal reverse trans-sulfuration pathway. E. coli has no reverse trans-sulfuration
      (no cystathionine beta-synthase), and its cystathionine-degrading enzyme is the beta-lyase MetC. No measurement
      of cystathionine gamma-cleavage by E. coli MetB is in the papers examined; the characterised side reaction
      of MetB is the gamma-elimination of O-succinyl-L-homoserine, which is a different reaction. Because CGS and
      CGL share mechanism and a weak lyase activity cannot be excluded, but nothing shows it is used, this is marked
      as over-annotation rather than removed (promiscuous-activity tier "relevance unknown").
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - ROLE_CONFLATION
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: PANTHER:PTN000211591
        source_label: PTN000211591
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: The seeds are genuine gamma-lyases (and Mtb MetB, reported to have both activities), but the node
          also covers the enterobacterial gamma-synthase branch, where the forward synthase is the evolved activity.
    supported_by:
    - reference_id: PMID:19370061
      supporting_text: Cystathionine gamma-synthase (CGS) and cystathionine beta-lyase (CBL), which comprise the
        transsulfuration pathway of bacteria and plants, and cystathionine gamma-lyase (CGL), the second enzyme
        of the fungal and animal reverse transsulfuration pathway
    - reference_id: PMID:14503880
      supporting_text: The enzyme also catalyzes a competing gamma-elimination reaction, in which L-OSHS is hydrolyzed
        to succinate, NH(3), and alpha-ketobutyrate
