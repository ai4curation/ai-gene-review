id: P00935
gene_symbol: metB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: metB (b3939) encodes cystathionine gamma-synthase (CGS), a cytoplasmic, homotetrameric pyridoxal 5'-phosphate-dependent
  enzyme of the trans-sulfuration (Cys/Met metabolism PLP-dependent) family. It catalyses the gamma-replacement
  of the succinyl group of O-succinyl-L-homoserine (made by the homoserine O-succinyltransferase MetA) by the thiol
  of L-cysteine to form L-cystathionine and succinate. This is the first step of bacterial forward trans-sulfuration;
  cystathionine is then cleaved by the beta-lyase MetC to L-homocysteine, which MetE or MetH methylates to L-methionine.
  The PLP cofactor is bound as a Schiff base to Lys198. In the absence of cysteine the enzyme also catalyses a futile
  alpha,gamma-elimination of O-succinyl-L-homoserine to succinate, 2-oxobutanoate and ammonia, with a catalytic
  efficiency about 70-fold lower than the replacement reaction. metB lies in the metBL operon under MetJ/S-adenosylmethionine
  repression, and metB mutants require methionine.
