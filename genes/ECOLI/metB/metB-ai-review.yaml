suggested_questions:
- question: Does E. coli MetB cleave L-cystathionine at the gamma position at any measurable rate, or is the cystathionine
    gamma-lyase IBA inherited from PTN000211591 purely a family-level artefact for the enterobacterial CGS branch
    (which would justify a PAINT loss annotation at the bacterial CGS node)?
- question: Is the gamma-elimination of O-succinyl-L-homoserine physiologically relevant (for example as a 2-oxobutanoate
    source under cysteine limitation), or only a futile side reaction?
suggested_experiments:
- description: Assay purified MetB with L-cystathionine as sole substrate (coupled 2-oxobutanoate detection) and
    compare with S. cerevisiae CYS3 to settle the gamma-lyase IBA.
