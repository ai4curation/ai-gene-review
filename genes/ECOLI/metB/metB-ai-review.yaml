  title: Purification and properties of cystathionine gamma-synthase from overproducing strains of Escherichia coli.
  findings:
  - statement: Purified MetB catalyses the gamma-replacement reaction with O-succinyl-L-homoserine and L-cysteine.
    supporting_text: The Km values for the replacement reaction were calculated to be 1.0 mM for O-succinyl-L-homoserine
