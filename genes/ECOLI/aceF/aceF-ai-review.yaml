core_functions:
- description: Lipoyl-domain-bearing E2p acetyltransferase that transfers the acetyl group from the acetyl-dihydrolipoyl
    arm to coenzyme A and forms the structural core that organises the E1p and E3 subunits of the pyruvate
    dehydrogenase complex.
  molecular_function:
    id: GO:0004742
    label: dihydrolipoyllysine-residue acetyltransferase activity
  directly_involved_in:
  - id: GO:0006086
    label: pyruvate decarboxylation to acetyl-CoA
  locations:
  - id: GO:0005829
    label: cytosol
  in_complex:
    id: GO:0045254
    label: pyruvate dehydrogenase complex
  supported_by:
  - reference_id: PMID:12651118
    supporting_text: The purified 1-lip E2 and E3 proteins were functionally active according to the overall
      PDHc activity measurement.
  - reference_id: PMID:3903169
    supporting_text: These lipoyl domains are in turn linked to a much larger (about 300 residues) subunit-binding
      domain of the E2p chain that aggregates to form the octahedral inner core of the complex and also
      contains the acetyltransferase active site.
suggested_questions:
- question: Why does E. coli E2p retain three lipoyl domains per chain when complexes with one or two
    lipoyl domains show near-normal overall activity?
suggested_experiments:
- description: Compare growth yield and acetyl-CoA flux of aceF strains encoding one, two or three lipoyl
    domains under fluctuating pyruvate supply to test whether extra lipoyl domains confer a fitness advantage
    not seen in steady-state enzyme assays.
  experiment_type: competitive growth and metabolic flux analysis
