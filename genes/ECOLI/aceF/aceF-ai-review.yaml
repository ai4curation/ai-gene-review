  label: Escherichia coli K-12
description: AceF (E2p) is the dihydrolipoyllysine-residue acetyltransferase core of the Escherichia coli
  pyruvate dehydrogenase complex. Each chain carries three N-terminal lipoyl domains, a peripheral subunit-binding
  domain that docks E1p (AceE) and E3 (LpdA), and a C-terminal catalytic domain whose 24 copies assemble
  into the octahedral inner core. The lipoyl arms shuttle the acetyl group from E1p to the acetyltransferase
  site, where it is transferred to coenzyme A to form acetyl-CoA, and then carry reducing equivalents
  to E3 for reoxidation.
