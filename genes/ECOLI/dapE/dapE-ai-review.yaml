  label: Escherichia coli K-12
description: 'DapE (N-succinyl-L,L-diaminopimelate desuccinylase) is a dinuclear zinc/cobalt metallohydrolase
  of the peptidase M20A family that hydrolyses N-succinyl-LL-2,6-diaminopimelate to LL-diaminopimelate
  and succinate, the last step of the succinylase branch of the diaminopimelate (DAP) pathway in Escherichia
  coli. It is highly specific for its natural substrate and essential for growth, supplying both L-lysine
  and the meso-DAP of peptidoglycan. DapE also has a secondary role in cell division: it is recruited
  to the Z ring by ZapB and strengthens the Ter-linked positive signal for Z-ring formation.'
