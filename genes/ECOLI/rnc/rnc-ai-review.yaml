- term:
    id: GO:0000287
    label: magnesium ion binding
  evidence_type: IDA
  original_reference_id: PMID:15699182
  qualifier: enables
  review:
    summary: >-
      Well grounded and unusually precise for a metal-binding annotation. The Mg(2+)
      dependence was quantified rather than assumed: the Hill coefficient for the
      Mg(2+) dependence of cleavage under single-turnover conditions is 2.0, and an
      inhibitor specific for two-metal-ion ribonuclease active sites blocks the
      reaction non-competitively, so it acts on catalysis rather than on substrate
      binding. UniProt places metal ligands at residues 41, 114 and 117.
    action: ACCEPT
    supported_by:
    - reference_id: PMID:15699182
      supporting_text: The measured Hill coefficient (n (H)) is 2.0 +/- 0.1, indicative
        of the involvement of two Mg2+ ions in phosphodiester hydrolysis.
      reference_section_type: ABSTRACT
    - reference_id: PMID:15699182
      supporting_text: E.coli RNase III requires a divalent metal ion for activity, with
        Mg2+ as the preferred species.
      reference_section_type: ABSTRACT
