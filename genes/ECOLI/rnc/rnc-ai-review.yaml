core_functions:
- description: >-
    Double-strand-specific endoribonuclease that makes the initial cleavages excising the
    16S and 23S rRNA precursors from the single 30S primary transcript, the committing
    step of ribosome biogenesis downstream of transcription. The enzyme recognises duplex
    elements of around 20 base pairs within otherwise single-stranded substrates and
    cleaves site-specifically using two Mg(2+) ions, leaving 5'-phosphate and 3'-hydroxyl
    ends. Loss of the enzyme abolishes 23S maturation entirely, although the extended 23S
    species still assemble into functional 50S subunits, which is why the gene is
    dispensable for growth.
  molecular_function:
    id: GO:0004525
    label: ribonuclease III activity
  directly_involved_in:
  - id: GO:0006364
    label: rRNA processing
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:6364133
    supporting_text: RNase III makes the initial cleavages that excise Escherichia coli
      precursor 16S and 23S rRNA from a single large primary transcript.
    reference_section_type: ABSTRACT
  - reference_id: PMID:6364133
    supporting_text: In mutants deficient in RNase III, no species cleaved by RNase III
      are detected and the processing of 23S rRNA precursors to form mature 23S rRNA fails
      entirely.
    reference_section_type: ABSTRACT
  - reference_id: PMID:15699182
    supporting_text: The measured Hill coefficient (n (H)) is 2.0 +/- 0.1, indicative of
      the involvement of two Mg2+ ions in phosphodiester hydrolysis.
    reference_section_type: ABSTRACT
- description: >-
    The same endoribonuclease activity applied to messenger RNAs, where a single cleavage
    in a structured 5' leader commits the transcript to turnover and thereby sets its
    abundance. The pnp message encoding polynucleotide phosphorylase is the archetype -
    its half-life rises from 1.5 minutes to over 40 minutes in an RNase III-deficient
    strain, with PNPase 10-fold over-expressed and the synthesis rate barely changed - and
    the enzyme processes its own transcript the same way. The enzyme also processes phage
    polycistronic transcripts, notably T7 early mRNA.
  molecular_function:
    id: GO:0004525
    label: ribonuclease III activity
  directly_involved_in:
  - id: GO:0006397
    label: mRNA processing
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:3308454
    supporting_text: the sequence involved in the stabilization of the pnp mRNA is located
      at the 5' end of the message and that the RNase III processing triggers the decay of
      the transcripts downstream
    reference_section_type: ABSTRACT
  - reference_id: PMID:4587248
    supporting_text: the normal pathway for producing the T7 early messenger RNAs in vivo
      appears to involve endonucleolytic cleavage by RNase III
    reference_section_type: ABSTRACT
- description: >-
    Obligate homodimerization, which is what builds the catalytic unit rather than merely
    an oligomeric state. Each 226-residue subunit contributes an N-terminal nuclease
    domain and a C-terminal double-stranded RNA-binding domain; the two nuclease domains
    together form the composite centre that makes the staggered double-strand cut with a
    2-nucleotide 3' overhang defining ribonuclease III activity.
  molecular_function:
    id: GO:0042803
    label: protein homodimerization activity
  contributes_to_molecular_function:
    id: GO:0004525
    label: ribonuclease III activity
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:932008
    supporting_text: Chromatography on Sephadex G-100 is consistent with a molecular weight
      of 50,000, suggesting that the native enzyme is a dimer.
    reference_section_type: ABSTRACT
  - reference_id: PMID:15699182
    supporting_text: E.coli RNase III functions as a homodimer, with the subunit
      polypeptide (226 amino acids) containing an N-terminal nuclease domain and a
      C-terminal dsRNA-binding domain (dsRBD)
    reference_section_type: INTRODUCTION
suggested_questions:
- question: >-
    Should RNase III carry GO:0006402 mRNA catabolic process alongside GO:0006397 mRNA
    processing? It makes the committing endonucleolytic cleavage of pnp mRNA turnover
    itself, and RNase E (P21513) carries GO:0006402 and GO:0006401 for the same kind of
    decay-initiating role. The complication is that GO:0010468, already annotated here by
    IBA, is an ancestor of GO:0006402, so this is a refinement of an existing row for a
    curator to make rather than a missing annotation.
  experts: []
- question: >-
    Does RNase III have any role in CRISPR-Cas immunity in Escherichia coli K-12 itself?
    The enzyme can substitute for the Streptococcus RNase III when a type II system is
    transplanted into E. coli, but E. coli K-12's native system is type I-E and processes
    pre-crRNA with the Cas6e/CasE subunit of Cascade, so no CRISPR process term is
    annotated here. A negative result - showing that an rnc deletion leaves type I-E
    immunity intact in K-12 - would settle it definitively.
  experts:
  - Virginijus Siksnys
  - Emmanuelle Charpentier
- question: >-
    How many of the roughly two dozen transcripts stabilised in an rnc null are direct
    substrates rather than secondary consequences of disturbed ribosome biogenesis? The
    distinction decides how much of the regulation of gene expression annotation reflects
    direct cleavage.
  experts: []
- question: >-
    What determines which duplex elements of around 20 base pairs are cleaved and which
    are merely bound? The ionic-strength dependence of site fidelity suggests that
    specificity is partly thermodynamic rather than encoded in sequence, which would
    explain how the enzyme can be borrowed by a heterologous pathway such as type II
    crRNA maturation.
  experts:
  - Allen W. Nicholson
suggested_experiments:
- hypothesis: >-
    E. coli K-12's native type I-E CRISPR immunity is fully independent of RNase III,
    because Cas6e performs the repeat cleavage that RNase III performs in type II systems.
  description: >-
    Delete rnc in a K-12 derivative with an active type I-E system and an engineered
    anti-lambda spacer array, then measure plaque formation and plasmid curing against an
    isogenic rnc+ control. A null result here is the direct negative control the
    heterologous-host experiments lack, and would close out the question of whether the
    E. coli protein has any native CRISPR role.
  experiment_type: deletion phenotype in the native type I-E system
- hypothesis: >-
    Most transcripts stabilised in an rnc null are indirect, and the set of direct
    substrates is considerably smaller than the set of affected messages.
  description: >-
    Map cleavage sites transcriptome-wide by sequencing 5'-monophosphate ends in rnc+ and
    rnc- strains, and separately capture bound RNA by crosslinking and immunoprecipitation
    of a catalytically dead D45N variant. Direct substrates should appear in both the
    bound set and the end-mapped set; transcripts stabilised without either signature are
    indirect.
  experiment_type: transcriptome-wide 5'-end mapping plus dead-enzyme crosslinking
- hypothesis: >-
    The YmdB-bound state of RNase III is catalytically competent but blocked at substrate
    engagement, rather than being an allosterically inactivated active site.
  description: >-
    Compare substrate binding and cleavage of the R1.1 model substrate by RNase III alone
    and in complex with purified YmdB, separating the two steps by using a
    non-hydrolysable condition or a catalytically dead variant for the binding
    measurement. Unchanged affinity with abolished turnover would point to an active-site
    effect; reduced affinity to occlusion of the dsRBD.
  experiment_type: binding versus cleavage separation with a purified regulator
