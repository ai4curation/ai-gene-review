      Each 226-residue subunit supplies an N-terminal nuclease domain and a C-terminal
      dsRBD, and the two nuclease domains together form the composite centre that makes
      the staggered double-strand cut defining ribonuclease III activity, with its 2-nt
      3' overhang. The 1976 study established the dimer by a mass discrepancy between
      denaturing and native chromatography: around 25 kDa by SDS-PAGE against 50 kDa by
      gel filtration.
