- term:
    id: GO:0004525
    label: ribonuclease III activity
  evidence_type: IDA
  original_reference_id: PMID:1091644
  qualifier: enables
  review:
    summary: >-
      The direct biochemical grounding for the activity, and a careful one. The study
      resolved the activities present in RNase III preparations and showed that the
      dsRNA-cleaving activity and the T7 polycistronic mRNA processing activity are one
      and the same enzyme, while a separable activity against the RNA strand of DNA:RNA
      hybrids is a contaminant - which is why UniProt states that the enzyme digests
      duplex RNA but not RNA-DNA hybrids. The product chemistry required by the GO term,
      5'-phosphomonoesters and 3'-OH termini, was measured directly.
    action: ACCEPT
    reason: >-
      The cached record is abstract-only, but the abstract itself states both the
      activity-identity result and the end chemistry, so the annotation is verifiable
      from what is available.
    supported_by:
    - reference_id: PMID:1091644
      supporting_text: Direct analysis shows that both activities cleave RNA chains to
        yield 5'-phosphate and 3'-hydroxyl termini.
      reference_section_type: ABSTRACT
    - reference_id: PMID:1091644
      supporting_text: the activity which cleaves RNA:RNA duplexes and that responsible
        for specific processing of phage T7 polycistronic mRNA appear to be identical by
        several biochemical criteria
      reference_section_type: ABSTRACT
