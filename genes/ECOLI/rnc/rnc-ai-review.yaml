gene_symbol: rnc
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  Ribonuclease III (RNase III, gene rnc, EC 3.1.26.3) is the founding member of the
  RNase III superfamily that also contains the eukaryotic enzymes Dicer and Drosha. The
  226-residue Escherichia coli protein is a homodimer in which each subunit contributes
  an N-terminal nuclease domain (residues 6-128, catalytic Asp45 and Glu117) and a
  C-terminal double-stranded RNA-binding domain (155-225); the two half-sites form a
  composite catalytic centre that uses two Mg(2+) ions per phosphodiester hydrolysis.
  The enzyme is a double-strand-specific endoribonuclease: it cleaves duplex RNA
  elements of roughly 20 base pairs formed within otherwise single-stranded substrates,
  leaving 5'-phosphate and 3'-hydroxyl ends, and does not act on RNA-DNA hybrids. Its
  central housekeeping role is ribosome biogenesis - it makes the first cuts that excise
  the 16S and 23S precursors from the single 30S primary rRNA transcript, a step that is
  obligate for 23S maturation although ribosomes carrying unprocessed 23S still support
  growth. It also processes phage transcripts (notably the T7 early polycistronic mRNA),
  at least one tRNA, and a set of cellular mRNAs, where cleavage of the 5' leader
  initiates decay and thereby sets transcript abundance; the pnp message encoding
  polynucleotide phosphorylase is the archetype, and the enzyme processes its own
  transcript as well. RNase III is cytoplasmic and loosely ribosome-associated, is
  encoded in the rnc-era-recO operon, and is itself regulated: the macrodomain protein
  YmdB binds its catalytic region and down-regulates cleavage during cold shock, with a
  separate YmdB-independent mechanism operating on entry into stationary phase. Loss of
  the gene is tolerated, giving slow growth, transient accumulation of the 30S rRNA
  precursor, extended 23S rRNA in the ribosome and stabilisation of its mRNA substrates.
  Being a widely conserved host enzyme that acts on any duplex RNA presented to it, RNase
  III is also recruited by pathways that do not encode their own nuclease: type II
  CRISPR-Cas systems of other bacteria use the host enzyme to cut the
  pre-crRNA:tracrRNA duplex during guide RNA maturation.
