- term:
    id: GO:0016491
    label: oxidoreductase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR023867
  review:
    summary: >-
      Oxidoreductase activity mapped from the sulfatase-maturase radical SAM signature
      (IPR023867). Characterised family members are oxidoreductases: they oxidise a
      sulfatase active-site cysteine or serine to formylglycine (PMID:16766528,
      PMID:14749327). AslB keeps the full catalytic machinery, so the same class of
      chemistry is plausible, but no oxidation by AslB, and no substrate, has been shown.
    action: UNDECIDED
    reason: >-
      A family-level prediction of reaction class. The substrate-defining function of the
      family (sulfatase maturation) was not confirmed for AslB in K-12 deletion mutants
      (PMID:17303125), and the one positive report measures only sulfatase activity after
      overexpression in E. coli B (PMID:28882567). Without an assay of AslB itself the
      reaction class cannot be confirmed or excluded, so this row is neither accepted nor
      removed.
    supported_by:
    - reference_id: PMID:14749327
      supporting_text: AtsB oxidizes serine to FGly by a radical mechanism that is initiated through reductive cleavage of SAM
    - reference_id: PMID:17303125
      supporting_text: these putative anSME are not involved in Cys-type sulfatase maturation
