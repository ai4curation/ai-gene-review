- term:
    id: GO:0051604
    label: protein maturation
  evidence_type: ISS
  original_reference_id: PMID:16766528
  qualifier: acts_upstream_of_or_within
  review:
    summary: >-
      Sequence-similarity transfer of protein maturation from the C. perfringens Cys-type
      anSME, the founding member of the family (PMID:16766528). For E. coli AslB the
      evidence conflicts. In K-12, deleting aslB, ydeM and yidF did not impair maturation
      of heterologous Cys-type sulfatases, which occurred only aerobically
      (PMID:17303125). In E. coli BL21(DE3), overproduced AslB raised the activity of
      co-expressed human IDS 4.6-fold and of GALNS 1.5 to 2-fold (PMID:28882567), but
      formylglycine was not measured in that abstract. The natural candidate substrate,
      the adjacent Ser-type putative sulfatase AslA, has never been tested.
    action: UNDECIDED
    reason: >-
      The cited paper does not assay E. coli AslB, the only in vivo test in K-12 was
      negative for Cys-type substrates, and the positive report is an overexpression
      activity readout in a different strain. Ser-type maturation, the activity of the most
      similar characterised enzyme (Klebsiella AtsB, 44.7% identical), remains untested.
      The evidence neither establishes nor refutes a protein-maturation role, so the row
      is left undecided rather than removed.
    supported_by:
    - reference_id: PMID:17303125
      supporting_text: knocking-out of aslB, ydeM and yidF does not impair Cys-type sulfatase maturation
    - reference_id: PMID:28882567
      supporting_text: IDS activity was increased in 4.6-fold when co-expressed with AslB
    - reference_id: file:ECOLI/aslB/aslB-uniprot.txt
      record_section: ["CC:CAUTION"]
      supporting_text: it is not involved in Cys-type sulfatase maturation in vivo
core_functions: []
knowledge_gaps:
- gap_statement: >-
    The substrate and reaction of AslB are unknown: it is not established whether it
    converts the active-site serine of its neighbour AslA, or of any other protein, to
    formylglycine, or whether it acts on a different substrate altogether.
  boundary: >-
    Established: AslB keeps all cluster-ligand cysteines, SAM-contact residues and the
    catalytic aspartate of the structurally characterised C. perfringens anSME, and is most
    similar to the Ser-type maturase AtsB. Deleting aslB, ydeM and yidF does not block
    maturation of heterologous Cys-type sulfatases in E. coli K-12. Ser-type maturation and
    the activity of purified AslB have not been tested.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: >-
    E. coli K-12 carries two intact anSME-family enzymes (AslB and YdeM) but has no detectable sulfatase activity; whether AslB is
    a dormant sulfatase maturase or has been repurposed decides how the whole anSME-like
    SPASM group in enterobacteria should be annotated.
  resolution: >-
    Reconstitute purified AslB anaerobically and assay formylglycine formation on AslA
    peptides containing Ser136, measuring 5'-deoxyadenosine release; in parallel, test
    whether aslB deletion abolishes formylglycine in AslA expressed under anaerobic,
    sulfur-limited conditions.
  provenance:
  - reference_id: PMID:17303125
    supporting_text: these putative anSME are not involved in Cys-type sulfatase maturation
  - reference_id: file:ECOLI/aslB/aslB-bioinformatics/RESULTS.md
    supporting_text: AslB is closer to the Ser-type AtsB (44.7%) than YdeM is (36.4%)
suggested_questions:
- question: >-
    Does E. coli AslB convert Ser136 of its neighbour AslA to formylglycine under anaerobic
    conditions, and is aslA ever expressed in an active form?
  experts:
  - Olivier Berteau
  - Thomas Dierks
  - Squire J Booker
- question: >-
    Is the increased human sulfatase activity seen when AslB is overproduced in E. coli B
    due to formylglycine formation by AslB, or to an indirect effect on the endogenous
    oxygen-dependent maturation system?
  experts:
  - Olivier Berteau
suggested_experiments:
- hypothesis: AslB is a serine-type anaerobic sulfatase-maturating enzyme for AslA.
  description: >-
    Express AslA (wild type and S136A) in wild-type and aslB-deleted E. coli K-12 under
    anaerobic, sulfate-limited conditions; detect formylglycine at position 136 by mass
    spectrometry and measure arylsulfatase activity. In vitro, assay reconstituted AslB
    with an AslA peptide spanning the (C/S)XPXR motif for SAM-dependent formylglycine and
    5'-deoxyadenosine formation.
  experiment_type: genetic and in vitro enzymology
- hypothesis: AslB acts on a non-sulfatase substrate, as other SPASM-domain enzymes do.
  description: >-
    Compare the proteome and metabolome of wild-type and aslB-deleted cells grown
    anaerobically, and search purified, reconstituted AslB for SAM cleavage stimulated by
    candidate peptides from proteins whose genes co-occur with aslB across enterobacteria.
  experiment_type: comparative omics and enzymology
