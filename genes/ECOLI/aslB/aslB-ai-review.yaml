- id: PMID:16766528
  title: A new type of bacterial sulfatase reveals a novel maturation pathway in prokaryotes.
  findings:
  - statement: >-
      Defines the anSME family from a Firmicutes enzyme that converts the critical cysteine
      of a sulfatase to formylglycine under anaerobic conditions.
    supporting_text: we have also identified a new Cys-type sulfatase-maturating enzyme that catalyzes the conversion of cysteine into FGly, in anaerobic conditions
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Abstract only. This is the GOA reference for the ISS protein maturation row; it
      characterises the C. perfringens enzyme, not E. coli AslB, so it supports the family
      function only.
- id: PMID:17303125
  title: First evidences for a third sulfatase maturation system in prokaryotes from E.
    coli aslB and ydeM deletion mutants.
  findings:
  - statement: >-
      E. coli K-12 matures heterologous Cys-type sulfatases only aerobically, and deleting
      aslB, ydeM and yidF does not impair that maturation.
    supporting_text: knocking-out of aslB, ydeM and yidF does not impair Cys-type sulfatase maturation
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Abstract only; the key in vivo test of the E. coli paralogs and the basis of UniProt's
      caution note. Ser-type substrates are not mentioned in the abstract.
- id: PMID:28882567
  title: Anaerobic sulfatase maturase AslB from Escherichia coli activates human recombinant
    iduronate-2-sulfate sulfatase (IDS) and N-acetylgalactosamine-6-sulfate sulfatase
    (GALNS).
  findings:
  - statement: >-
      Co-expression of AslB in E. coli BL21(DE3) increased the activity of co-expressed
      human sulfatases IDS (4.6-fold) and GALNS (1.5 to 2-fold).
    supporting_text: IDS activity was increased in 4.6-fold when co-expressed with AslB
  reference_review:
    relevance: MEDIUM
    correctness: LOW_QUALITY
    review_notes: >-
      Abstract only. Activity readout after overexpression in a B strain, with docking;
      formylglycine formation is not reported in the abstract, so a direct AslB activity is
      not shown.
- id: PMID:14749327
  title: Post-translational formylglycine modification of bacterial sulfatases by the
    radical S-adenosylmethionine protein AtsB.
  findings:
  - statement: >-
      Klebsiella AtsB, the closest characterised homolog of AslB, needs SAM and all three of
      its FeS centres to convert sulfatase serine to formylglycine.
    supporting_text: SAM is the critical co-factor for formation of a functional AtsB.SAM.sulfatase complex and for FGly formation by AtsB
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract only; characterises the Klebsiella homolog, used for family context.
