id: P25550
gene_symbol: aslB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  AslB (AtsB) is a 411-residue radical S-adenosyl-L-methionine (SAM) protein of
  the anaerobic sulfatase-maturating enzyme (anSME) family, encoded next to aslA, a gene for
  a putative periplasmic serine-type sulfatase. It has a radical SAM core with the CxxxCxxC
  motif that binds the SAM-cleaving [4Fe-4S] cluster, followed by a C-terminal SPASM domain
  whose cysteines are predicted to hold two auxiliary [4Fe-4S] clusters; all of these
  cluster ligands, the SAM-contact residues and the catalytic aspartate of the structurally
  characterised Clostridium perfringens enzyme are conserved. Characterised anSMEs oxidise
  the active-site cysteine or serine of sulfatases to C-alpha-formylglycine, the residue
  sulfatases need for catalysis. For AslB this role has not been established. Deleting
  aslB, together with ydeM and yidF, does not prevent E. coli K-12 from
  maturing heterologous cysteine-type sulfatases, which it does only under aerobic
  conditions by an unidentified oxygen-dependent system. Overproduced AslB modestly raised
  the activity of two human sulfatases co-expressed in E. coli B, but formylglycine
  formation was not shown. Whether AslB matures its neighbour AslA, a serine-type substrate
  that was never tested, or acts on some other protein is unknown, and no reaction of the
  purified protein has been reported.
