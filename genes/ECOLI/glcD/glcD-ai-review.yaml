id: P0AEP9
gene_symbol: glcD
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  GlcD is the FAD-dependent catalytic subunit of the heterotrimeric
  glycolate dehydrogenase GlcDEF (historically called glycolate oxidase or
  glycolate oxidoreductase). The enzyme is associated with the cytoplasmic
  (inner) membrane and oxidizes glycolate to glyoxylate, the first committed
  step of glycolate utilization; glyoxylate is then condensed with acetyl-CoA
  by malate synthase G (GlcB), encoded in the same glcDEFGB operon. The
  enzyme does not use molecular oxygen as electron acceptor: in vitro it
  reduces artificial dyes (DCIP, PMS), and its physiological acceptor is
  unknown, although transfer to the respiratory chain via the iron-sulfur
  subunit GlcF is presumed. The partially purified enzyme also oxidizes
  D-lactate at a similar rate but with lower affinity (Km 0.7 mM versus
  40 uM for glycolate). GlcD belongs to the FAD-binding
  oxidoreductase/transferase type 4 (PCMH/VAO) family, carrying both the
  FAD-binding and the FAD-linked oxidase C-terminal domains. Loss of GlcD
  abolishes glycolate oxidase activity and growth on glycolate as sole carbon
  source.
