suggested_questions:
- question: >-
    The GO:0009339 glycolate oxidase complex definition (an FMN flavoprotein
    producing H2O2, part of cytoplasm, capable of O2-dependent
    (S)-2-hydroxy-acid oxidase activity) cites the E. coli GlcDEF papers, yet
    the E. coli enzyme is FAD-linked, membrane-associated and does not react
    directly with O2. Should the definition be revised to a glycolate
    dehydrogenase complex (EC 1.1.99.14) and the InterPro2GO mapping of
    IPR004490 to GO:0003973 be removed?
- question: >-
    What is the physiological electron acceptor of GlcDEF in E. coli (for
    example ubiquinone/menaquinone via GlcF), and is the flavin of GlcD
    covalently attached?
suggested_experiments:
- experiment_type: protein purification and biochemistry
  description: >-
    Purify GlcDEF from an overexpressing strain, determine subunit
    stoichiometry, flavin content and covalency (GlcD and GlcE), and measure
    glycolate and D-lactate oxidation with quinone acceptors in proteoliposomes
    to define the physiological electron acceptor and substrate preference.
