      H2O2).
    action: MODIFY
    reason: >-
      The substrate class (a 2-hydroxy acid oxidized to a 2-oxo acid) is
      right, but the acceptor is wrong. The GO term is defined with dioxygen
      as acceptor and H2O2 as product, which describes the peroxisomal FMN
      glycolate oxidases (EC 1.1.3.15). The E. coli GlcDEF enzyme does not
      link directly to O2 and reduces artificial acceptors such as DCIP and
      PMS (Lord 1972, as curated by UniProt), i.e. it is a dehydrogenase (EC
      1.1.99.14). The correct activity is GO:0019154 glycolate dehydrogenase
      activity. The mapping likely follows from the GO:0009339 complex term
      definition, which itself wrongly describes an O2/FMN enzyme (see
      suggested_questions).
