- id: PMID:21711450
  title: The KdpC subunit of the Escherichia coli K+-transporting KdpB P-type ATPase
    acts as a catalytic chaperone.
  findings:
  - statement: Biochemical evidence that KdpC binds ATP via a conserved glutamine and transiently associates with the KdpB nucleotide-binding loop.
    supporting_text: the KdpC subunit was shown to interact with the nucleotide-binding loop of
      KdpB in an ATP-dependent manner
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: >-
      Abstract-only cache. The catalytic-chaperone model assumed a cytoplasmic KdpC
      soluble domain; later crystal and cryo-EM structures (PMID:28636601,
      PMID:30478378) place it in the periplasm.
