core_functions:
- description: >-
    KdpC is an essential single-pass accessory subunit of the KdpFABC K+ pump. Its
    periplasmic soluble domain packs against KdpA near the selectivity-filter
    entrance and, with KdpF, stabilizes the KdpA-KdpB assembly, contributing to the
    complex's ATP-driven K+ uptake activity without itself catalysing ATP hydrolysis
    or forming the K+ pathway.
