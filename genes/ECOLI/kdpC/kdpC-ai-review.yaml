      ATP binding to KdpC was reported biochemically (abstract-only cache), but
      every KdpFABC structure places the KdpC soluble domain in the periplasm, which
      contains no ATP and is on the opposite side of the membrane from the
      nucleotide-binding domain of KdpB. KdpB is the ATP-binding and -hydrolyzing
      subunit. The ATP-binding claim for KdpC is therefore contested and should not
      be propagated as a molecular function of the subunit.
