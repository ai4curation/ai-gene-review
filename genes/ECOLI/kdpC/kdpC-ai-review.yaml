  title: The K+-translocating Kdp-ATPase from Escherichia coli. Purification, enzymatic
    properties and production of complex- and subunit-specific antisera.
  findings:
  - statement: KdpC co-purifies in the membrane KdpABC ATPase; anti-KdpC serum does not inhibit ATPase activity.
    supporting_text: the anti-KdpC serum did not inhibit enzyme activity
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only cache.
- id: PMID:28636601
  title: Crystal structure of the potassium-importing KdpFABC membrane complex.
  findings:
  - statement: KdpC has one TM helix with its soluble domain on the periplasmic side, inverted relative to earlier models.
    supporting_text: KdpC has a single transmembrane helix (cM1), but the topology is inverted relative
      to previous models (Extended Data Fig. 1d). This topology puts the soluble domain, which appears
      to have a novel fold, on the periplasmic side of the membrane.
  - statement: The KdpC soluble domain is held by periplasmic loops of KdpA and might occlude the KdpA filter.
    supporting_text: the soluble domain of KdpC is held nearby by two loops from D2 and D3 repeats
      of KdpA
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
- id: PMID:30478378
  title: Cryo-EM structures of KdpFABC suggest a K(+) transport mechanism via two
    inter-subunit half-channels.
  findings:
  - statement: KdpC is a periplasmically oriented single-TM subunit whose periplasmic domain could cap the KdpA pore.
    supporting_text: the periplasmic domain of KdpC could function as extracellular gate capping
      the pore of KdpA4
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
- id: PMID:34272288
  title: Structural basis for potassium transport in prokaryotes by KdpFABC.
  findings:
  - statement: KdpC and KdpF are accessory subunits that stabilize the KdpA-KdpB partnership and stay static during the cycle.
    supporting_text: This partnership appears to be stabilized by accessory subunits, KdpC and KdpF,
      as well as by a lipid molecule that fills a crucial gap at the subunit interface.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
