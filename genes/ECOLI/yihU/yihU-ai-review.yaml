suggested_questions:
- question: Does YihU contribute measurably to succinic semialdehyde detoxification at physiological SSA
    concentrations, given its 42,000-fold preference for sulfolactaldehyde?
- question: Should GO broaden the definition of GO:0061722 sulphoglycolysis, which currently ends at
    DHAP and pyruvate, to include the terminal reduction of 3-sulfolactaldehyde to DHPS (or add a
    sibling term for that branch), so that YihU can carry the pathway term alongside YihS, YihV and
    YihT rather than the broader GO:1902777?
