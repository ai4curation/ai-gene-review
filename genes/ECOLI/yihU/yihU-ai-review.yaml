id: P0A9V8
gene_symbol: yihU
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: YihU is the NADH-dependent 3-sulfolactaldehyde (SLA) reductase of Escherichia coli, the terminal
  enzyme of the sulfoglycolytic Embden-Meyerhof-Parnas pathway. It reduces the C3 organosulfonate SLA, released
  by the aldolase YihT, to 2,3-dihydroxypropane-1-sulfonate (DHPS), which is excreted, and in doing so
  regenerates NAD+ for the fermentative cell. YihU belongs to the 3-hydroxyisobutyrate dehydrogenase (HIBADH)-related
  family of NAD(P)-binding Rossmann-fold beta-hydroxyacid dehydrogenases, forms a homotetramer (dimer of
  dimers), and is induced during growth on sulfoquinovose. It also reduces succinic semialdehyde to 4-hydroxybutyrate
  with far lower catalytic efficiency, and its deletion reduces tolerance of E. coli to exogenous succinic
  semialdehyde.
