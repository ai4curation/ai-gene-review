    summary: The yihU deletion mutant is more sensitive to exogenous succinic semialdehyde.
    action: MODIFY
    reason: The phenotype is real (PMID:19372223), but succinic semialdehyde is a reactive metabolite aldehyde,
      not a toxin in the GO sense (a poisonous compound, typically a protein, produced by an organism to cause
      disease). The observation is better captured as cellular detoxification of aldehyde (GO:0110095),
      a non-core role given the 42,000-fold preference of YihU for SLA over SSA (UniProt, Ref.6).
