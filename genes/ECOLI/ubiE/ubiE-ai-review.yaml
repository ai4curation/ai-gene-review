suggested_questions:
- question: >-
    Does UbiE methylate demethylmenaquinol as a free enzyme or while bound in the
    Ubi metabolon, and how is the UbiE pool partitioned between the two quinone
    pathways under aerobic versus anaerobic growth?
suggested_experiments:
- hypothesis: Menaquinone C-methylation does not require the other Ubi metabolon proteins.
  description: >-
    Measure MK8/DMK8 ratios in ubiJ, ubiK and ubiG deletion strains grown
    anaerobically, and assay purified free UbiE versus purified Ubi complex with
    demethylmenaquinol analogues.
