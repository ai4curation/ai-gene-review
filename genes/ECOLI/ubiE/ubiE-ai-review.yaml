id: P0A887
gene_symbol: ubiE
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  UbiE is the S-adenosyl-L-methionine-dependent ring C-methyltransferase shared
  by the ubiquinone and menaquinone pathways of Escherichia coli. In ubiquinone-8
  biosynthesis it methylates 2-octaprenyl-6-methoxy-1,4-benzoquinol (DDMQH2) at
  the ring carbon to give 2-octaprenyl-3-methyl-6-methoxy-1,4-benzoquinol
  (DMQH2), the substrate of the UbiF hydroxylase; in menaquinone-8 biosynthesis
  it methylates demethylmenaquinol to menaquinol, the last step of that pathway.
  ubiE mutants lack both ubiquinone and menaquinone and accumulate
  2-octaprenyl-6-methoxy-1,4-benzoquinone and demethylmenaquinone. UbiE is a
  class I SAM methyltransferase of the MenG/UbiE family and is one of the seven
  proteins of the soluble cytoplasmic Ubi metabolon (UbiE, UbiF, UbiG, UbiH,
  UbiI, UbiJ, UbiK). In vitro it can also methylate demethylphylloquinol, the
  plant and cyanobacterial phylloquinone intermediate.
