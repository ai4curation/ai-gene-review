description: >-
  DsbE (CcmG) is a membrane-anchored thioredoxin-like thiol-disulfide
  oxidoreductase of cytochrome c maturation system I in Escherichia coli. A
  single N-terminal transmembrane helix anchors it in the inner membrane, and
  its C-terminal thioredoxin domain, carrying a WCPTC active site, faces the
  periplasm. DsbE acts as a highly specific disulfide reductase in the late,
  reductive steps of c-type cytochrome assembly: it keeps the cysteines of the
  apocytochrome CXXCH heme-binding motif reduced, either by reducing
  apocytochrome disulfides directly or by resolving mixed disulfides between
  apocytochrome c and CcmH, so that heme can be covalently attached by the
  CcmF/CcmH synthase. DsbE is itself kept reduced by direct disulfide exchange
  with the N-terminal periplasmic domain of the transmembrane electron
  transporter DsbD, which delivers reducing equivalents from cytoplasmic
  thioredoxin. Deletion of dsbE abolishes formation of all c-type cytochromes.
