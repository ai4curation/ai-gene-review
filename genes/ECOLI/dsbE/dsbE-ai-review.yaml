  supporting_entities:
  - UniProtKB:P36655
  review:
    summary: >-
      CcmG forms a disulfide-linked reaction complex with the N-terminal
      periplasmic domain of DsbD, whose crystal structure was solved.
    action: REMOVE
    reason: >-
      The DsbD-CcmG interaction is a genuine redox-reaction intermediate:
      DsbD reduces CcmG by direct disulfide exchange. Generic protein binding
      conveys none of this; the functional content is captured by CcmG's
      protein-disulfide reductase activity and its role in cytochrome c-heme
      linkage. Removal does not dispute the interaction.
    supported_by:
    - reference_id: PMID:16004871
      supporting_text: We determined the crystal structure of the disulfide-linked
        complex between nDsbD and the soluble part of CcmG at 1.94 A resolution.
