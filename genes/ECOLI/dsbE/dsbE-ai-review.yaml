core_functions:
- description: >-
    Periplasmic, membrane-anchored thioredoxin-like disulfide reductase that
    keeps apocytochrome c CXXCH cysteines reduced for heme ligation, by reducing
    apocytochrome disulfides and resolving CcmH-apocytochrome mixed disulfides;
    it is itself re-reduced by DsbD.
