suggested_questions:
- question: >-
    In E. coli, is the physiological substrate of DsbE the apocytochrome
    disulfide itself or the CcmH-apocytochrome mixed disulfide, and does this
    differ between cytochromes (e.g. NrfA, NapB, TorC)?
- question: >-
    How does a weak reductant (E0' about -0.18 V) achieve high specificity and
    efficiency toward apocytochromes in the oxidizing periplasm?
suggested_experiments:
- description: >-
    Trap DsbE-substrate mixed disulfides in vivo with a resolving-cysteine
    (C83S) DsbE variant and identify partners by mass spectrometry under
    anaerobic nitrite or TMAO growth.
  experiment_type: in vivo substrate trapping
