- term:
    id: GO:0006457
    label: protein folding
  evidence_type: IDA
  original_reference_id: PMID:10625618
  qualifier: involved_in
  review:
    summary: >-
      Purified IF2 (and EF-G) promoted refolding of urea-denatured citrate
      synthase and alpha-glucosidase and suppressed citrate synthase aggregation
      in vitro.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The chaperone-like activity is real in vitro on model substrates, at
      concentrations below cellular IF2 levels, but the authors themselves frame
      a cellular role as a possibility ("might be implicated"). No cellular
      client of IF2-assisted folding has been identified, and the activity is
      shared with EF-G, suggesting a generic property of large translational
      GTPases rather than an evolved folding function. This is the tier of real
      in vitro activity of unknown physiological relevance, so it is marked as an
      over-annotation rather than removed.
    supported_by:
    - reference_id: PMID:10625618
      supporting_text: EF-G and IF2 promote the functional folding of citrate synthase
        and alpha-glucosidase after urea denaturation.
    - reference_id: PMID:10625618
      supporting_text: These results suggest that EF-G and IF2, in addition to their
        role in translation, might be implicated in protein folding and protection
        from stress.
