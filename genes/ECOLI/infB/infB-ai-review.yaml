id: P0A705
gene_symbol: infB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  infB encodes translation initiation factor IF2, an essential, ribosome-dependent
  translational GTPase of the TRAFAC classic translation factor family and the
  bacterial ortholog of archaeal and eukaryotic aIF5B/eIF5B (PANTHER PTHR43381).
  The 890-residue protein has a long, intrinsically disordered N-terminal region,
  a central tr-type G domain followed by an EF-Tu/EF-G-like beta-barrel domain,
  and C-terminal domains that contact the acceptor end of initiator tRNA. Three
  in-frame isoforms (alpha, beta, beta') arise from alternative translation start
  codons, and both alpha and beta forms are needed for optimal growth. In the
  cytosol, GTP-bound IF2 joins the 30S subunit early, together with IF3 and then
  IF1, anchoring through its N-domain and engaging the subunit through its
  domain II; ribosome-bound IF2 recruits and positions N-formylmethionyl-tRNA(fMet)
  in the P site of the 30S preinitiation complex. On 50S subunit joining, IF2
  hydrolyses GTP and the factors are released, leaving a 70S initiation complex
  ready for elongation. IF2 also binds the alarmone ppGpp at its GTP site with
  similar affinity, which inhibits initiation-complex formation and couples
  initiation to the stringent response. After cold shock IF2 levels rise
  relative to ribosomes, the extra IF2 associates with immature ribosomal
  subunits, and the N-terminal disordered region drives reversible, RNA-dependent
  condensate formation and is required for growth in the cold. Purified IF2 also
  shows GTP-stimulated chaperone-like refolding activity on model substrates in
  vitro.
