proposed_new_terms: []
suggested_questions:
- question: Does the chaperone-like refolding activity of IF2 act on any physiological
    client, such as ribosomal proteins or rRNA folding intermediates during cold-shock
    ribosome assembly, or is it a generic in vitro property of large translational
    GTPases?
- question: What RNAs and proteins are contained in cold-induced IF2 condensates,
    and do the condensates sequester initiation complexes to shut down translation
    in the cold?
- question: Does ppGpp binding to IF2 regulate initiation in vivo during the stringent
    response at physiological ppGpp/GTP ratios?
suggested_experiments:
- description: Separate the initiation and ribosome-maturation roles of IF2 at low
    temperature using IDR or G-domain variants that retain normal initiation kinetics,
    then profile ribosome assembly intermediates by cryo-EM after cold shock.
  experiment_type: genetics and structural biology
- description: Purify cold-induced IF2 condensates (or proximity-label IF2 in cold-shocked
    cells) and identify their RNA and protein contents.
  experiment_type: proteomics and RNA sequencing
