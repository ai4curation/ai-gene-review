      supporting_text: ppGpp interferes with IF2-dependent initiation complex formation,
        severely inhibits initiation dipeptide formation, and blocks the initiation
        step of translation.
- term:
    id: GO:0097216
    label: guanosine tetraphosphate binding
  evidence_type: IDA
  original_reference_id: PMID:30559427
  qualifier: enables
  review:
    summary: >-
      IF2 was captured by a ppGpp capture-compound affinity proteomics screen,
      alongside other translational GTPases.
    action: KEEP_AS_NON_CORE
    reason: >-
      An independent proteome-wide capture consistent with the earlier direct
      binding study (PMID:16968770). Same claim as the other ppGpp binding row;
      non-core regulatory ligand binding.
    supported_by:
    - reference_id: PMID:30559427
      supporting_text: For EF-G, EF-Tu, and IF2, the binding of ppGpp instead of GTP
        disrupts translation in vitro
- term:
    id: GO:0140693
    label: molecular condensate scaffold activity
  evidence_type: IMP
  original_reference_id: PMID:39975289
  qualifier: enables
  review:
    summary: >-
      The N-terminal IDR of IF2 drives phase separation with total RNA in vitro,
      most strongly in the cold, and IF2 forms reversible puncta in cold-shocked
      cells; deletion of the IDR reduces cold fitness.
    action: KEEP_AS_NON_CORE
    reason: >-
      The cited work is a bioRxiv preprint. Purified IF2 forms condensates with
      RNA, the IDR is required, and fixed-cell immunofluorescence shows
      cold-induced reversible foci, which together fit the term definition of
      bringing macromolecules together to organise a condensate. The cellular
      contents of the condensates are unknown and the function they serve is
      not yet defined, so this conditional, cold-specific activity is retained as
      non-core pending peer-reviewed confirmation.
    supported_by:
    - reference_id: PMID:39975289
      supporting_text: We discovered that IF2's N-terminal IDR drives phase separation
        in E. coli and C. crescentus, suggesting that IF2 condensation is a conserved
        property.
    - reference_id: PMID:39975289
      supporting_text: At the standard growth temperature, we observed that IF2 was
        diffuse across the cytoplasm, however, when cells were cold-shocked for 1-hour
        we observed that IF2 localized into distinct puncta
- term:
    id: GO:1990856
    label: methionyl-initiator methionine tRNA binding
  evidence_type: IDA
  original_reference_id: PMID:4943554
  qualifier: enables
  review:
    summary: >-
      IF2 binds the initiator fMet-tRNA(fMet), forming an IF2-GTP-fMet-tRNA
      complex in solution and recruiting the initiator tRNA when bound to the
      30S subunit.
    action: NEW
    reason: >-
      Initiator tRNA binding is a defining activity of IF2 that is not captured
      by any existing row (translation initiation factor activity does not
      entail it). The ternary complex is unstable in solution and on the
      preferred pathway ribosome-bound IF2 recruits the tRNA (PMID:20224578), but
      binding to fMet-tRNA is directly shown. The same term is used for the
      initiator-tRNA binding of eukaryotic eIF2 gamma.
    supported_by:
    - reference_id: PMID:4943554
      supporting_text: Evidence is presented that suggests the formation of a complex
        between polypeptide chain-initiation factor IF 2, GTP, and fMet-tRNA(f).
    - reference_id: PMID:20224578
      supporting_text: Ribosome-bound IF2 might accelerate the recruitment of fMet-tRNA(fMet)
        to the 30S initiation complex by providing anchoring interactions or inducing
        a favourable ribosome conformation.
