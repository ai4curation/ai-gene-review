- id: file:yeast/LSC2/LSC2-bioinformatics/RESULTS.md
  title: Evolution of the succinyl-CoA synthetase subunit families (LSC1 / LSC2)
  findings:
  - statement: E. coli SucC has Pro at position 20 of the mature beta subunit, the position where the pig GTP-specific
      enzyme has Gln.
    supporting_text: Position 20 of the mature beta subunit is Pro in E. coli SucC and Gln in pig GTP-specific SCS
  - statement: Position 20 does not predict nucleotide specificity. What the E. coli enzyme shares with the ADP-forming
      eukaryotic lineage is ADP use, not ADP specificity.
    supporting_text: E. coli SCS has Pro20 and uses both nucleotides, with a preference for ADP (PMID:22751660),
      so what the A-type lineage shares with the bacterial enzyme is ADP use, not ADP specificity.
  - statement: S. cerevisiae has a single beta subunit of the A type, so its alpha subunit LSC1 has no SUCLG2-type
      partner. Some early-diverging fungi keep a SUCLG2-type beta gene, so this is not a property of all fungi.
    supporting_text: S. cerevisiae and S. pombe each encode one beta subunit, of the A type, so their alpha subunits
      have no SUCLG2-type partner.
