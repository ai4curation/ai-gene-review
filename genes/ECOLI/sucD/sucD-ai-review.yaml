    id: GO:0046777
    label: protein autophosphorylation
  evidence_type: IMP
  original_reference_id: PMID:1986797
  qualifier: acts_upstream_of_or_within
  review:
    summary: Substitution of the active-site histidine with aspartate abolishes phosphorylation of the enzyme and
      the overall reaction.
    action: MARK_AS_OVER_ANNOTATED
    reason: 'The experiment is sound and is not disputed. What it shows is the phosphohistidine catalytic intermediate
      of the ligase reaction: His246 is transiently phosphorylated by ATP or by succinyl phosphate and passes the
      phosphoryl group on within each turnover. The term fits its definition literally, but the phosphohistidine is
      a transient covalent enzyme intermediate formed and discharged in every turnover, a step of the molecular
      function already captured by GO:0004775, not a modification of the protein as a process. GO usage is mixed:
      comparable phosphoenzyme intermediates (E. coli ndk, gpmA, ptsI and ppsA; human SUCLG1 and ACLY) carry no
      autophosphorylation row, while E. coli ppk and glmM and P. aeruginosa SucC do.'
    supported_by:
    - reference_id: PMID:1986797
      supporting_text: As expected, the His-246 alpha----Asp mutant is incapable of undergoing phosphorylation.
    - reference_id: PMID:1986797
      supporting_text: has no ability to catalyze the overall reaction
    - reference_id: PMID:8144675
      supporting_text: This phosphohistidine, a catalytic intermediate, is stabilized by two helix dipoles
