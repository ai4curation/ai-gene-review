  title: Functional consequences of substitution of the active site (phospho)histidine residue of Escherichia coli
    succinyl-CoA synthetase.
  findings:
  - statement: Replacing His246 of the alpha subunit with Asp abolishes phosphorylation of the enzyme and the overall
      reaction without affecting subunit assembly.
    supporting_text: As expected, the His-246 alpha----Asp mutant is incapable of undergoing phosphorylation.
  - statement: The paper places the ADP and ATP sites in the alpha subunit and the CoA site in the beta subunit.
    supporting_text: The site of phosphorylation (His-246) and the binding sites for the substrates ADP and ATP
      are located in the alpha subunit, and the succinate and CoA binding sites are in beta.
    finding_review:
      finding_status: OVERTURNED
      superseded_by:
      - PMID:8144675
      - PMID:10625475
      review_notes: The nucleotide and CoA assignments are overturned by the crystal structures (CoA on alpha, nucleotide
        on beta). The succinate assignment to the beta subunit and the phosphohistidine assignment stand; the succinate
        assignment is recorded as a separate finding.
      supported_by:
      - reference_id: PMID:8144675
        supporting_text: One molecule of coenzyme A is bound to each alpha-subunit at a typical nucleotide-binding
          motif, and His-246 of each alpha-subunit is phosphorylated.
      - reference_id: PMID:10625475
        supporting_text: X-ray diffraction data revealed an ADP-Mg(2+) complex bound in the ATP-grasp fold of the
          N-terminal domain of each beta-subunit
  - statement: The paper places the succinate site in the beta subunit.
    supporting_text: the succinate and CoA binding sites are in beta
    finding_review:
      finding_status: CORROBORATED
      review_notes: The succinate assignment stands. The structure of the pig GTP-specific enzyme with succinate
        bound shows the site in the C-terminal domain of the beta subunit.
      supported_by:
      - reference_id: PMID:27487822
        supporting_text: Succinate binds in the carboxy-terminal domain of the β-subunit.
  reference_review:
