- id: file:ECOLI/sucD/sucD-deep-research-openscientist.md
  title: OpenScientist deep research report for E. coli sucD
  findings:
  - statement: The report describes the alpha subunit as carrying the phosphohistidine and the CoA site in a soluble cytoplasmic heterotetramer, and E. coli as preferring ADP/ATP while using GDP/GTP.
    supporting_text: soluble, cytoplasmic (αβ)₂ heterotetramer
  reference_review:
    relevance: MEDIUM
    correctness: UNVERIFIED
    review_notes: 'Errors found on a later check. The mechanism scheme in the report places the succinate site
      on the alpha subunit, whereas succinate binds the C-terminal domain of the beta subunit (PMID:27487822, pig
      enzyme). The report also lists tetrapyrrole and heme synthesis among the uses of succinyl-CoA, but E. coli
      makes 5-aminolevulinate from glutamate by the five-carbon route (PMID:2254275). Neither point is used in
      this review. Earlier note follows.
      Read in full after the review was written; it agrees with every action and prompted no change. Run with the gene named, so it is a second reading of the public literature, not independent evidence. Its quotes from PMID:8144675, PMID:10625475, PMID:10353839, PMID:22751660 and PMID:3543212 were checked against cached abstracts, and PMID:2548486, PMID:9209026, PMID:3002435, PMID:17642514 and PMID:9917402 were cached and their titles and the quoted passages checked. Not checked - PMID:10873456 and PMID:9720032. It does not discuss the autophosphorylation annotation or GO terms row by row.'
