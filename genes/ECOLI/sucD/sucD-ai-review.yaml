taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: SucD is the alpha subunit of succinyl-CoA synthetase (succinate-CoA ligase) of Escherichia coli, an
  alpha2beta2 heterotetramer formed with the beta subunit SucC. The enzyme carries out the substrate-level phosphorylation
  step of the tricarboxylic acid cycle, converting succinyl-CoA, a nucleoside diphosphate and phosphate to succinate,
  CoA and a nucleoside triphosphate, and it runs in reverse to supply succinyl-CoA for biosynthesis. The alpha subunit
  binds CoA and carries the catalytic histidine, which is transiently phosphorylated and moves about 35 angstroms
  between the CoA and succinate site and the nucleotide site on the beta subunit. The enzyme prefers ATP but also
  uses GTP; that choice is made by the beta subunit. sucD is the last gene of the sucABCD operon. The alpha subunit
  is conserved from bacteria to animals; in animals a single alpha subunit serves separate ADP- and GDP-specific
  beta subunits.
