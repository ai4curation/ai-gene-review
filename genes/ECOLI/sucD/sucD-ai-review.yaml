- term:
    id: GO:0004776
    label: succinate-CoA ligase (GDP-forming) activity
  evidence_type: EXP
  original_reference_id: PMID:10353839
  qualifier: enables
  review:
    summary: The purified enzyme uses GTP, with a higher Km and lower kcat than for ATP.
    action: KEEP_AS_NON_CORE
    reason: 'A genuine secondary activity, kept as non-core. The E. coli enzyme uses GTP as well as ATP but prefers
      ATP: the Km for GTP is 394 uM against 70 uM for ATP and kcat is about half, so catalytic efficiency with GTP
      is roughly a tenth of that with ATP. The enzyme has a single beta subunit with Pro at the position where GTP-specific
      animal subunits have Gln, and a Pro20-to-Gln change lowers the Km for GTP more than fivefold. This is the
      dual-specificity bacterial state, distinct from the dedicated GDP-forming enzyme of animals. For the alpha
      subunit the term holds because its only beta partner accepts GTP; fungal alpha subunits, whose partner does
      not, are the case where the same family-level annotation fails.'
    supported_by:
    - reference_id: file:ECOLI/sucC/sucC-uniprot.txt
      record_section: ["CC:BIOPHYSICOCHEMICAL PROPERTIES"]
      supporting_text: KM=70 uM for ATP {ECO:0000269|PubMed:10353839};
    - reference_id: file:ECOLI/sucC/sucC-uniprot.txt
      record_section: ["CC:BIOPHYSICOCHEMICAL PROPERTIES"]
      supporting_text: KM=394 uM for GTP {ECO:0000269|PubMed:10353839};
    - reference_id: PMID:10353839
      supporting_text: A mutant protein designed to probe nucleotide specificity (P20betaQ) had a Km(app) for GTP
