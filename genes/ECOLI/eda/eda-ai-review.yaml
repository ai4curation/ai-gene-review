      Eda performs a step of the pathway itself (the aldol cleavage named in the GO:0061678
      definition), so this is participation, not mere necessity. Comparator: edd, the first
      enzyme of the same pathway, carries GO:0061678. eda mutants cannot use gluconate, the
      Entner-Doudoroff substrate in E. coli, and edd and eda form the Entner-Doudoroff operon.
    supported_by:
    - reference_id: PMID:4945194
      supporting_text: >-
        the hexose monophosphate shunt might be used, as happens in mutants blocked in the
        previous step, edd, of the Entner-Doudoroff pathway
    - reference_id: PMID:1624451
      supporting_text: >-
        The nucleotide sequence of the entire Escherichia coli edd-eda region that encodes the
        enzymes of the Entner-Doudoroff pathway was determined.
    - reference_id: PMID:11274385
      supporting_text: >-
        KDPG aldolase catalyzes the reversible cleavage of KDPG to pyruvate and
        glyceraldehyde-3-phosphate.
- term:
    id: GO:0042840
    label: D-glucuronate catabolic process
  evidence_type: IMP
  original_reference_id: PMID:4945194
  review:
    summary: >-
      Eda cleaves KDPG, the last intermediate of the glucuronate (Ashwell) pathway, and eda
      mutants cannot grow on glucuronate.
    action: NEW
    reason: >-
      Eda catalyses the terminal step of D-glucuronate catabolism (KDG kinase KdgK forms KDPG,
      Eda cleaves it). Comparator: the preceding enzymes of this pathway in E. coli, uxaC, uxuA,
      uxuB and kdgK, all carry GO:0042840 by IMP or IDA. Eda is on the sole route and its
      mutants fail to grow on the uronic acids, and eda induction on glucuronate is mediated by
      KdgR.
    supported_by:
    - reference_id: PMID:4945194
      supporting_text: >-
        The inability to grow on the uronic acids was expected, because the aldolase is on the
        sole known pathway of their metabolism.
    - reference_id: PMID:15659677
      supporting_text: >-
        P2 controls eda induction on glucuronate and galacturonate and is regulated by KdgR.
