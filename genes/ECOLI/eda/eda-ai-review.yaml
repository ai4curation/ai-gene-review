id: P0A955
gene_symbol: eda
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  eda (b1850) encodes 2-keto-3-deoxy-6-phosphogluconate (KDPG) aldolase, the cytosolic class I
  aldolase that performs the second and last step of the Entner-Doudoroff pathway in
  Escherichia coli. The homotrimeric (alpha/beta)8-barrel enzyme reversibly cleaves KDPG to
  pyruvate and D-glyceraldehyde 3-phosphate through a Schiff base between Lys133 and the
  substrate, with Glu45 acting as the general base. KDPG is the convergence point of gluconate
  catabolism (via Edd) and of glucuronate and galacturonate catabolism (via KdgK). eda mutants
  lack KDPG aldolase activity and cannot grow on gluconate or the hexuronates. The same active
  site also cleaves (4S)-4-hydroxy-2-oxoglutarate to pyruvate and glyoxylate (the enzyme was
  first purified as "KHG aldolase") and decarboxylates oxaloacetate in vitro. eda is expressed
  from several promoters controlled by GntR, KdgR and PhoB, giving a high basal level plus
  induction on sugar acids and under phosphate or carbon starvation.
