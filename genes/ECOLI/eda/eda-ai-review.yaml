    label: (R,S)-4-hydroxy-2-oxoglutarate aldolase activity
  evidence_type: IDA
  original_reference_id: PMID:17981470
  qualifier: enables
  review:
    summary: >-
      Eda does cleave 4-hydroxy-2-oxoglutarate, but it is selective for the (4S) enantiomer, and
      the cited paper does not assay this substrate.
    action: MODIFY
    reason: >-
      GO:0008700 means an enzyme that acts on both the (4R) and (4S) enantiomers. The E. coli
      enzyme is stereoselective for (4S)-4-hydroxy-2-oxoglutarate (PubMed:1098660,
      PubMed:4560498, as curated by UniProt), which is GO:0106009, already carried by this gene
      by EXP, IDA, IBA and IEA. This is a lateral stereospecificity correction, not a
      refinement to a descendant. The cached full text of PMID:17981470 compares KDPG and
      KDPGal aldolases and contains no 4-hydroxy-2-oxoglutarate assay, so the reference is
      also flagged as a probable source error.
    proposed_replacement_terms:
    - id: GO:0106009
      label: (4S)-4-hydroxy-2-oxoglutarate aldolase activity
    supported_by:
    - reference_id: file:ECOLI/eda/eda-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: stereoselective for the S-enantiomer of KHG
    source_defects:
    - defect_type: WRONG_REFERENCE
      resource: UNIPROT
      slot: DB:Reference
      requested_change: CHECK
      asserted_value: PMID:17981470
      confidence: PROBABLE
      explanation: >-
        This IDA row gives Eda (P0A955) GO:0008700 (R,S)-4-hydroxy-2-oxoglutarate aldolase
        activity citing PMID:17981470, which characterizes KDPGal aldolase and compares the
        KDPG/KDPGal stereoselectivity of the two enzymes; it reports no
