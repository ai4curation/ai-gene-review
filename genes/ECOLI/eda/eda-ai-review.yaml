suggested_questions:
- question: >-
    Does the (4S)-4-hydroxy-2-oxoglutarate aldolase activity of Eda serve glyoxylate
    detoxification or another physiological role in E. coli, for example under phosphate or
    carbon starvation when eda is induced?
suggested_experiments:
- description: >-
    Compare glyoxylate tolerance and intracellular 4-hydroxy-2-oxoglutarate in wild-type, eda
    and a KHG-selective eda point mutant under starvation conditions that induce eda.
