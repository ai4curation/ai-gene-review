- description: >-
    Class I (Schiff base) KDPG aldolase that reversibly cleaves 2-keto-3-deoxy-6-phosphogluconate
    to pyruvate and D-glyceraldehyde 3-phosphate, the final step of the Entner-Doudoroff pathway
    and of glucuronate and galacturonate catabolism in the cytosol.
