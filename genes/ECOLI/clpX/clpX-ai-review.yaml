id: P0A6H1
gene_symbol: clpX
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: ClpX is the AAA+ ATPase subunit of the cytoplasmic ClpXP protease of Escherichia coli. Six
  ClpX subunits form a ring, stabilised by ATP and by an N-terminal C4 zinc-binding domain, that docks
  onto one or both ends of the ClpP tetradecameric peptidase and activates it. ClpX selects substrates
  through short degrons (for example the SsrA tag added to stalled nascent chains) directly or with the
  help of adaptors such as SspB, then uses cycles of ATP binding and hydrolysis to unfold the substrate
  mechanically and translocate it through its central pore into the ClpP chamber for degradation. Substrates
  include SsrA-tagged proteins, the cytoplasmic RseA fragment (releasing sigma-E for the extracytoplasmic
  stress response), FtsZ (modulating cell division), UvrA and phage lambda O. Without ClpP, ClpX acts
  as an ATP-dependent remodelling chaperone, for example disassembling the phage Mu transpososome.
