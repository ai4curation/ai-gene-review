suggested_questions:
- question: Should GO add an 'ATP-dependent protein unfoldase activity' MF for AAA+ unfoldases such as
    ClpX, HslU and ClpA, rather than relying on ATP hydrolysis activity or ATP-dependent protein folding
    chaperone?
- question: Should ClpX's GO:0004176 ATP-dependent peptidase activity rows carry contributes_to, given
    that the catalytic sites lie in ClpP?
- question: Is the GO:0009376 HslUV protease complex IBA on PTN000137358 seeded only by the mis-assigned
    CAFA ClpX row, and should the PAINT node be revisited?
suggested_experiments:
- description: Identify the additional ClpXP-degraded division protein(s) suggested by slower FtsZ turnover
    in delta-minC cells, using ClpXP-trap capture in division mutants followed by mass spectrometry.
