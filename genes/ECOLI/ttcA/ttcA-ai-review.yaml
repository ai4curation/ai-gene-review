proposed_new_terms:
- proposed_name: tRNA-cytidine(32) 2-sulfurtransferase activity
  proposed_definition: >-
    Catalysis of the reaction: cytidine(32) in tRNA + S-sulfanyl-L-cysteinyl-[cysteine
    desulfurase] + AH2 + ATP = 2-thiocytidine(32) in tRNA + L-cysteinyl-[cysteine
    desulfurase] + A + AMP + diphosphate + H+.
  justification: >-
    RHEA:57048 defines the TtcA reaction, which currently maps only to the broad
    GO:0016783 sulfurtransferase activity. Its uridine counterparts already have
    terms (GO:0103016 tRNA-uridine 2-sulfurtransferase activity, GO:0140741
    tRNA-uracil-4 sulfurtransferase activity), both under GO:0016783 and
    GO:0140101 catalytic activity, acting on a tRNA; the cytidine(32) reaction
    should be their sibling.
  proposed_parent:
    id: GO:0016783
    label: sulfurtransferase activity
  supported_by:
  - reference_id: PMID:24914049
    supporting_text: the reconstituted 6his-TtcA was able to convert C32 into s2C32 in an enzyme-dependent manner
suggested_questions:
- question: >-
    Does the free iron site of the TtcA [4Fe-4S] cluster form a
    [4Fe-5S] intermediate carrying the IscS-derived sulfide, and is a
    specific reductant (AH2 in RHEA:57048) required in vivo?
suggested_experiments:
- description: >-
    Trap and characterise the sulfide-bound cluster intermediate of TtcA
    (Mossbauer/EPR, 34S labelling) during single-turnover reactions with IscS
    persulfide and adenylated tRNA.
