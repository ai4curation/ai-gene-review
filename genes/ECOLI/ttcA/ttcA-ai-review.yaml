taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  TtcA is the tRNA-cytidine(32) 2-sulfurtransferase of Escherichia coli. This
  cytoplasmic PP-loop ATPase-family enzyme forms 2-thiocytidine at position 32
  (s2C32) in the anticodon loop of a small set of tRNAs (tRNA-Arg isoacceptors
  among them). It activates C32 with ATP and inserts a sulfur atom delivered as
  a persulfide by the cysteine desulfurase IscS. The active homodimer carries one
  oxygen-sensitive [4Fe-4S] cluster per subunit, ligated by only three cysteines;
  the free iron site is thought to bind the incoming sulfide. The cluster is
  essential for catalysis but not for tRNA binding, making TtcA an iron-sulfur
  enzyme that catalyses a non-redox thiolation. The s2C32 modification tunes
  decoding at the ribosomal A site (for example restricting reading of AGG by
  tRNA-Arg), but loss of TtcA has no detectable growth defect in the laboratory.
