- term:
    id: GO:0006400
    label: tRNA modification
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR005839
  review:
    summary: InterPro2GO mapping from the MTTase family signature IPR005839 to tRNA modification.
    action: REMOVE
    reason: 'Demonstrably wrong for this protein. IPR005839 covers the whole methylthiotransferase family,
      whose other subfamilies (MiaB, MtaB, CDKAL1) modify tRNA, and the InterPro2GO mapping carries the
      tRNA process to every member. RimO is the one subfamily that modifies a protein: its substrate is
      Asp88 of ribosomal protein uS12, and it is the only known enzyme that methylthiolates a protein.
      There is no evidence that RimO modifies any tRNA. The narrower RimO signature (IPR005840) and the
      RimO-specific PAINT node PTN000228840 carry no tRNA term. Contrast miaB, where the same mapping
      is correct and is refined rather than removed.'
    supported_by:
    - reference_id: PMID:19736993
      supporting_text: To date, it is the only enzyme known to catalyze methylthiolation of a protein
        substrate; the four other naturally occurring methylthio modifications have been observed on tRNA.
    - reference_id: PMID:18252828
      supporting_text: we predict that RimO is unique among these subgroups in its modification of protein
        as opposed to tRNA
    - reference_id: PMID:23542644
      supporting_text: The methylthiotransferases MiaB and RimO catalyze sulfur insertion into tRNAs and
        ribosomal protein S12, respectively.
