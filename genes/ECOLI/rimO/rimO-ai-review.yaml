suggested_questions:
- question: GO:0103039 protein methylthiotransferase activity (the RHEA:37087 uS12 Asp89 reaction) and
    GO:0035599 aspartic acid methylthiotransferase activity (peptidyl-Asp beta-methylthiolation) are siblings
    under GO:0035596. Should GO:0103039 be is_a GO:0035599, and should GO:0035599 be is_a GO:0140096 catalytic
    activity, acting on a protein? Should one be merged into the other?
- question: 'With GO:0018339 (peptidyl-L-beta-methylthioaspartic acid biosynthesis) obsoleted as a pathway
    variant, what biological process, if any, should RimO carry: a generic protein modification process
    term, or a ribosome biogenesis/maturation term if modification is shown to occur during subunit assembly?'
- question: 'What does YcaO contribute to uS12 methylthiolation: is it a sulfur-delivery or substrate-presenting
    partner of RimO, or does it act indirectly?'
suggested_experiments:
- description: Assay purified RimO on isolated uS12, 30S subunits, assembly intermediates and 70S ribosomes
    (with and without YcaO) to define the physiological substrate and achieve full turnover in vitro.
- description: Compare decoding accuracy, ribosome assembly and streptomycin sensitivity of wild-type,
    rimO deletion and uS12 D88 substitution strains to find the function of the methylthio-Asp modification.
knowledge_gaps:
- gap_statement: The physiological substrate state of uS12 for RimO (free protein, assembly intermediate
    or mature subunit), the role of YcaO, and the functional consequence of Asp88 beta-methylthiolation
    for the ribosome are unknown.
  boundary: RimO is the methylthiotransferase for uS12 Asp88; purified RimO modifies an Asp88-loop peptide
    with SAM cleavage; rimO and ycaO deletions impair the modification in vivo.
  gap_kind:
  - BIOLOGY
  dark_aspect: BP_DARK
  significance: The modification sits at a universally conserved residue near the decoding center, but
    no phenotype in translation has been tied to it.
  resolution: In vitro assays on defined ribosomal substrates and translation-fidelity/assembly phenotyping
    of rimO and uS12 D88 mutants.
  provenance:
  - reference_id: PMID:21169565
    supporting_text: For example, to date it is currently unknown if RimO requires other proteins to modify
      or recognize S12 and if the modification reaction in vivo occurs when S12 is in an isolated state
      or part of the ribosome.
  - reference_id: PMID:19736993
    supporting_text: Currently it is not known whether RimO modifies protein S12 in an unfolded state,
