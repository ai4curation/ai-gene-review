taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: 'RimO is the radical S-adenosyl-L-methionine (SAM) methylthiotransferase of Escherichia coli
  that attaches a methylthio group to the beta-carbon of the universally conserved Asp88 (Asp89 counting
  the initiator methionine) of the small-subunit ribosomal protein uS12 (S12). It is the only known enzyme
  that methylthiolates a protein; the other members of the methylthiotransferase family, such as MiaB,
  modify tRNA. Despite this, RimO keeps the family''s domain architecture: an N-terminal MTTase domain,
  a radical SAM domain and a C-terminal TRAM domain. It binds two [4Fe-4S] clusters, a radical SAM cluster
  that cleaves SAM to a 5''-deoxyadenosyl radical and an auxiliary cluster that activates an exogenous
  sulfur cosubstrate; by analogy with MiaB, a second SAM is thought to supply the methyl group. RimO is
  cytosolic, and modification appears to occur on uS12 assembled into a ribosomal subunit; the YcaO protein
  is needed for efficient modification. rimO mutants lack uS12 methylthiolation and show altered transcription
  of a subset of genes. The function of the modification, which sits near the ribosome decoding center,
  is not known.'
