suggested_questions:
- question: Does MobA guanylylate Mo-MPT bound to the target apo-enzyme or its chaperone, and how
    does its C-terminal domain select DMSO-reductase-family clients?
- question: What is the role of the MobA-MobB interaction, given that MobB is dispensable for in
    vitro bis-MGD assembly?
suggested_experiments:
- hypothesis: The MobA C-terminal domain docks onto specific Moco chaperones or apo-enzymes.
  description: Map MobA interactions with TorD, NapD and other DMSO-reductase-family chaperones by
    pull-down with N/C-domain chimeras of MobA and MocA, and measure bis-MGD insertion into each
    apo-enzyme.
