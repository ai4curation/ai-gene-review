id: P32173
gene_symbol: mobA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  MobA is the molybdenum cofactor guanylyltransferase (GTP:Mo-molybdopterin
  guanylyltransferase) of Escherichia coli. It transfers GMP from GTP to the C4' phosphate of
  Mo-molybdopterin, forming Mo-molybdopterin guanine dinucleotide (MGD) and pyrophosphate,
  and it takes part in assembling the bis(MGD)molybdenum cofactor used by the DMSO
  reductase family of molybdoenzymes, such as nitrate reductase and formate dehydrogenase.
  The reaction needs Mg2+ (Mn2+ works equally well in vitro) and is specific for GTP. MobA is
  a small cytoplasmic protein with a Rossmann-like N-terminal half that binds GTP and
  determines nucleotide specificity, and a C-terminal half that binds molybdopterin and
  determines recognition of the target molybdoenzyme. MobA, Mo-molybdopterin, GTP and MgCl2
  are sufficient to activate apo-DMSO reductase in vitro without a chaperone. mobA (chlB)
  mutants are chlorate resistant, lack MGD and accumulate molybdopterin.
