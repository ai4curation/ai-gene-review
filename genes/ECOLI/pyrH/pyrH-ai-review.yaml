taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: UMP kinase (PyrH, also known as SmbA) phosphorylates UMP to UDP using ATP, the step that
  links de novo UMP synthesis to UTP and CTP. It belongs to the amino-acid kinase (aspartokinase) fold
  and is unrelated to the adenylate-kinase-fold UMP/CMP kinases of eukaryotes. The enzyme is a homohexamer
  that is allosterically activated by GTP and inhibited by UTP; in Gram-negative bacteria UTP acts at
  a site overlapping the catalytic centre. It is a soluble cytoplasmic protein that also forms dynamic
  foci, some close to the membrane.
