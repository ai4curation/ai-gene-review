suggested_questions:
- question: What is the physiological basis of PyrH foci near the membrane, and do they relate to the
    reported smbA chromosome-partitioning phenotype or to UDP-sugar synthesis?
suggested_experiments:
- description: Test whether a catalytically inactive PyrH point mutant still forms membrane-proximal foci
    and complements smbA partitioning defects when UDP is supplied by another route, to separate the enzymatic
    and any non-enzymatic roles.
