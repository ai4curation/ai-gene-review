  - InterPro:IPR001967
  - InterPro:IPR018044
  review:
    summary: InterPro2GO maps the S11 D-Ala-D-Ala carboxypeptidase signature to the carboxypeptidase term.
    action: MODIFY
    reason: >-
      The S11 signature is shared by D,D-carboxypeptidases (DacA/PBP5) and by the
      PBP7 endopeptidases. The activity demonstrated for PBP7 is the
      D,D-endopeptidase reaction on sacculi, so the essence (a serine-acyl
      D,D-peptidase acting on peptidoglycan) is retained by replacing the term
      with GO:0061785, as in the KT2440 PbpG review.
