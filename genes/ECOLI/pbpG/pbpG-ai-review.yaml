  label: Escherichia coli K-12
description: >-
  PbpG is penicillin-binding protein 7 (PBP7), a low-molecular-mass
  penicillin-binding protein of the peptidase S11 family. It is exported to the
  periplasm by a cleavable signal peptide, is released from whole cells by osmotic
  shock and is only loosely associated with membranes; PBP8 is a proteolytic
  product of PBP7. PBP7 is a D,D-endopeptidase that hydrolyses the
  D-Ala-meso-diaminopimelate 4-3 crosslinks of high-molecular-mass murein sacculi
  but not of isolated dimeric muropeptides. It plays a secondary role, after
  PBP4, in daughter-cell separation, binds the soluble lytic transglycosylase
  Slt70, and is one of the peptidoglycan endopeptidases scaffolded by the
  outer-membrane lipoprotein NlpI.
