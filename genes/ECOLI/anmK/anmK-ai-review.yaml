taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  AnmK is an ATP-dependent anhydro-N-acetylmuramic acid kinase that acts in
  peptidoglycan recycling. It carries out a single unusual reaction: the
  simultaneous hydrolytic opening of the 1,6-anhydro ring of
  1,6-anhydro-N-acetylmuramic acid and phosphorylation of the sugar, converting
  anhMurNAc to N-acetylmuramate 6-phosphate (MurNAc-6-P). anhMurNAc is generated
  by lytic transglycosylase cleavage of the sacculus and liberated from imported
  muropeptides by NagZ and AmpD; AnmK commits this recovered sugar to downstream
  salvage, feeding either the MurQ etherase (catabolic) route in E. coli or, in
  bacteria that possess it, the MupP/AmgK/MurU anabolic shortcut back to
  UDP-MurNAc.
