- id: PMID:31209249
  title: Structure of the mannose transporter of the bacterial phosphotransferase system.
  findings:
  - statement: Cryo-EM structure reveals the ManYZ complex (ManY/EIIC + ManZ/EIID) as a multi-domain transmembrane
      transporter that uses an elevator mechanism for mannose transport, with CoreZ, VmotifZ, and ArmZ
      domains in ManZ.
    supporting_text: we have solved the cryo-EM structure of ManYZ at the inward-facing conformational
      state. Man-PTS transporters use an elevator mechanism for substrate transportation, in which the
      substrate-binding Core domain can undergo a rigid-body rotation across the cell membrane.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: External complete PMC article and publisher supplement read; protected cache omits much
      of main text. PDB 6K1H sequence identity checked. ManYZ counterflow and structure are direct; they
      are not a complete PEP-driven ManXYZ reconstitution.
