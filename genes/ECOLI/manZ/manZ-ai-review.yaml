references:
- id: file:ECOLI/manZ/manZ-deep-research-falcon.md
  title: Falcon (Edison Scientific) deep research report on E. coli manZ (PTS system mannose-specific
    EIID component, UniProt P69805)
  findings:
  - statement: ManZ (EIID-Man) partners with ManY (EIIC) to form the inner-membrane translocation module
      of the mannose PTS; it is not a phosphoryl-transfer domain but is required for transport and forms
      part of the pore/translocation apparatus.
    supporting_text: ManZ is the **EIID** subunit that partners with ManY (EIIC) to form the membrane
      translocation module. Foundational work describes the PTS chemical steps (phosphate transfer through
      ManX domains to the sugar at the membrane-embedded IIC module), while positioning ManZ as a critical
      membrane component that is not a classic phosphoryl-transfer domain but is required for transport
      and forms part of the **pore/translocation** apparatus.
    reference_section_type: OTHER
  - statement: ManZ is an inner (cytoplasmic) membrane protein of the ManXYZ complex.
    supporting_text: ManZ is an **inner (cytoplasmic) membrane** protein in the ManXYZ complex.
    reference_section_type: OTHER
  - statement: The ManXYZ (EIIMan) system is a broad-specificity PTS transporter whose primary biological
      output is inner-membrane import of mannose-family substrates coupled to phosphorylation.
    supporting_text: Together, these sources support that ManZ’s primary biological role is as part of
      a **PTS permease complex** whose functional output is **inner-membrane import of mannose-family
      substrates coupled to phosphorylation**, supporting growth on these sugars and contributing to global
      carbon uptake under varying conditions.
    reference_section_type: OTHER
  - statement: ManXYZ transports mannose as principal substrate and is relatively promiscuous, also transporting
      glucose, 2-deoxyglucose, N-acetylglucosamine, N-acetylmannosamine, and galactosamine.
    supporting_text: EcoSal Plus summarizes that ManXYZ transports **mannose** and is “relatively promiscuous,”
      transporting **glucose**, **2-deoxyglucose**, **N-acetylglucosamine**, **N-acetylmannosamine**,
      and **galactosamine**.
    reference_section_type: OTHER
  - statement: The mannose PTS shows relatively high affinity for glucose (Km ~15 uM), acting as an alternative
      glucose transport route in E. coli.
    supporting_text: A 2023 review focusing on *E. coli* glucose transport states that the **mannose PTS**
      shows **relatively high affinity for glucose (Km ≈ 15 µM)** and notes that E. coli encodes **15
      distinct EII PTS complexes**.
    reference_section_type: OTHER
  - statement: The ManY/ManZ (IIC/IID) inner-membrane subcomplex is sufficient for phage lambda DNA penetration
      across the inner membrane, reinforcing a pore-like function for ManZ.
    supporting_text: '**ManY (EIICMan)** and **ManZ (EIIDMan)**: inner-membrane components forming a tight
      complex; the **IIC/IID subcomplex** is sufficient for **phage DNA penetration** across the inner
      membrane.'
    reference_section_type: OTHER
  - statement: The EIIDMan (ManZ) component is unusual and required not only for mannose transport but
      also for uptake/penetration of phage lambda DNA.
    supporting_text: EcoSal Plus (2005) provides an expert synthesis emphasizing that the **EIIDMan (ManZ)**
      component is “unusual” and required not only for mannose transport but also for **uptake/penetration
      of phage λ DNA**, strongly implying a specialized role in the membrane translocation apparatus beyond
      canonical PTS phosphorylation logic.
    reference_section_type: OTHER
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Existing genuine Falcon provider report read and preserved. Used for literature leads
      and contextual synthesis; primary publications and structural identity establish core claims independently.
