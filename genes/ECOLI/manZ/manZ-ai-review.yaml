- id: PMID:2951378
  title: The mannose permease of Escherichia coli consists of three different proteins. Amino acid sequence
    and function in sugar transport, sugar phosphorylation, and penetration of phage lambda DNA.
  findings:
  - statement: 'The mannose permease consists of three subunits: IIIMan (ManX), II-PMan (ManY), and II-MMan
      (ManZ). All three are required for sugar transport and phosphorylation. ManY and ManZ alone are
      sufficient for lambda DNA penetration.'
    supporting_text: All three subunits are required for sugar transport and phosphorylation; II-PMan
      and II-MMan alone are sufficient for penetration of lambda DNA.
  - statement: II-PMan and II-MMan are integral membrane proteins that most likely form the transmembrane
      channel.
    supporting_text: II-PMan (28 kDa) is very hydrophobic; II-MMan (31 kDa) is moderately hydrophobic.
      Both are integral membrane proteins and most likely form the transmembrane channel.
  reference_review:
