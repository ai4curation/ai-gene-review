suggested_questions:
- question: >-
    Does E. coli LeuD contribute catalytic residues to the shared active site,
    as the swivel domain does in aconitase, or only position the substrate?
suggested_experiments:
- description: >-
    Mutate conserved LeuD residues predicted to line the LeuC-LeuD active
    site and measure isomerase kcat and Km of the reconstituted complex.
  experiment_type: site-directed mutagenesis and enzyme kinetics
