id: P30126
gene_symbol: leuD
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  leuD encodes the small subunit of isopropylmalate isomerase
  (3-isopropylmalate dehydratase, EC 4.2.1.33), the second enzyme of the
  leucine-specific branch of branched-chain amino acid biosynthesis. LeuD
  corresponds to the C-terminal swivel domain of aconitase-family enzymes and
  forms an obligate heterodimer with the [4Fe-4S]-containing large subunit
  LeuC; the LeuC-LeuD complex interconverts 2-isopropylmalate and
  3-isopropylmalate. LeuD has no cofactor and no activity of its own, and the
  cytosolic complex is required for leucine prototrophy.
existing_annotations:
- term:
    id: GO:0003861
    label: 3-isopropylmalate dehydratase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  review:
    summary: >-
      PAINT node PTN002879868 places 3-isopropylmalate dehydratase activity on
      the LeuD small-subunit clade, seeded by Salmonella LeuD (P04787) and
      plant small subunits.
    action: ACCEPT
    reason: >-
      E. coli LeuD is inside the clade, and the Salmonella ortholog's EXP
      evidence grounds the node. The term is right for the LeuC-LeuD enzyme,
      but the activity belongs to the heterodimer: the isomerase is a
      two-subunit enzyme and leuC and leuD mutant extracts complement each
      other in vitro (PMID:7026530). The `enables` qualifier should be
      `contributes_to`, recorded as a source defect, consistently across all
      GO:0003861 rows of LeuD.
    supported_by:
    - reference_id: PMID:7026530
      supporting_text: >-
        It is a complex enzyme composed of two
        subunits which are coded for by two genes of the leucine operon, leuC and leuD.
    - reference_id: PMID:374346
      supporting_text: isomerase, a complex of the leuC and leuD gene product.
    source_defects:
    - defect_type: WRONG_QUALIFIER
      resource: GO_CENTRAL
      slot: Qualifier
      requested_change: REPOINT
      asserted_value: enables
      corrected_value: contributes_to
      cause: OTHER
      confidence: CONFIRMED
      explanation: >-
        GO:0003861 is the activity of the heterodimeric LeuC-LeuD
        isopropylmalate isomerase (GO:0009316). LeuD is the small subunit,
        has no catalytic cofactor and is inactive alone, so it contributes to
        rather than independently enables the activity. The IBD at
        PTN002879868 could carry contributes_to.
