id: P0ABG1
gene_symbol: cdsA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: CdsA is the CDP-diacylglycerol synthase of Escherichia coli, a polytopic protein of
  the inner (cytoplasmic) membrane that activates phosphatidic acid with CTP to give
  CDP-diacylglycerol and pyrophosphate. This is the single committed step between phosphatidic
  acid, the end point of de novo fatty-acid esterification onto glycerol 3-phosphate, and the
  liponucleotide from which every bacterial phospholipid head group is built, so flux through
  phosphatidylglycerol, cardiolipin and phosphatidylethanolamine all pass through it. The enzyme
  works on membrane-embedded substrate and shows surface-dilution kinetics with a sequential
  rather than ping-pong mechanism; it accepts dCTP as well as CTP, making dCDP-diacylglycerol
  alongside CDP-diacylglycerol, and prefers phosphatidic acids carrying at least one unsaturated
  acyl chain. The reaction is reversible in vitro, but the physiological direction is activation
  of phosphatidic acid. The gene is essential and cannot be deleted; conditional mutants stop
  making phosphatidylethanolamine and phosphatidylglycerol and accumulate phosphatidic acid to
  about a third of the membrane lipid. Beyond bulk phospholipid, CdsA also supplies the
  diacylglycerol-pyrophosphate unit of MPIase, the glycolipid that drives membrane protein
  integration at the inner membrane, and its paralogue YnbB backs up that branch specifically.
  CdsA belongs to the prokaryotic-type CDS family (Pfam PF01148), which is distinct in lineage
  though not in chemistry from the mitochondrial Tam41-type CDP-diacylglycerol synthases.
