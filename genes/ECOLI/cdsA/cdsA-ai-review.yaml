knowledge_gaps:
- gap_statement: It is not known whether wild-type CdsA itself catalyses the transfer of
    N-acetylglucosamine 1-phosphate onto the diacylglycerol-pyrophosphate unit to make the first
    MPIase intermediate, or whether it only supplies CDP-diacylglycerol to a separate transferase,
    with the paralogue YnbB carrying the dedicated activity.
  boundary: What is established is that depleting CdsA abolishes detectable MPIase, that
    overproducing it raises MPIase, and that inverted vesicles from overproducers and partially
    purified CdsA8 form the intermediate from phosphatidic acid, CTP and
    N-acetylglucosamine 1-phosphate, with CDP-diacylglycerol apparently not released. What is not
    established is the same chemistry on purified wild-type enzyme under physiological conditions,
    since the clean in vitro demonstration used the Y207H CdsA8 mutant at a non-permissive high pH,
    and the separate finding that YnbB restores MPIase but not phospholipid synthesis leaves open
    which paralogue performs the step in a normally growing cell.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: This decides whether CdsA has one molecular function or two. If the transfer happens
    on CdsA, a GO molecular function term for the activity is needed, because no existing term
    describes it, and the MPIase branch would be a second catalytic activity of an enzyme otherwise
    treated as doing one thing. If it does not, the correct picture is that CdsA supplies the
    precursor and the process annotation should eventually be narrowed or moved. The review asserts
    the process term and deliberately proposes no molecular function term until this is settled.
  resolution: Reconstitute purified wild-type CdsA, purified YnbB and the two chimeras in
    proteoliposomes and measure formation of the intermediate from defined substrates at
    physiological pH, with and without added N-acetylglucosamine 1-phosphate, testing directly
    whether CDP-diacylglycerol is released as a free intermediate.
  provenance:
  - reference_id: PMID:30718729
    supporting_text: These observations strongly suggest that CDP-DAG is synthesized and then
      converted to compound I on CdsA.
  - reference_id: PMID:30718729
    supporting_text: Sequencing of the cdsA8 allele revealed that this mutation comprises an amino
      acid substitution of Tyr 207 to His
  - reference_id: PMID:30739787
    supporting_text: the role of YnbB seems to be as a backup for MPIase biosynthesis
- gap_statement: The catalytic site of CdsA has not been localised to a face of the inner membrane,
    and no catalytic residues or metal requirement have been identified for the E. coli enzyme.
  boundary: What is established is that the protein is polytopic, with eight predicted helices and
    an experimentally determined periplasmic C-terminus, and that the reaction is sequential with
    surface-dilution kinetics, so catalysis occurs at the lipid interface. What is not established
    is which residues form the active site, on which side of the bilayer the nucleotide binds, or
    whether a divalent metal is required; the UniProt entry carries no binding, metal or active-site
    feature, and the only metal-related observation is an unexplained physical effect of EDTA during
    purification.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: Both substrates are charged and one is cytoplasmic while the lipid is bilayer-
    embedded, so the geometry constrains how phosphatidic acid reaches the site and whether the
    enzyme is a candidate for the kind of side-specific component term GO can express. It also bears
    on whether a cofactor annotation is warranted; this review asserts none.
  resolution: Determine a structure of E. coli CdsA with CTP and a phosphatidic acid analogue, or
    map the site by cysteine-scanning accessibility and mutagenesis of candidate residues, and test
    the divalent metal requirement of purified enzyme with chelators and defined metal add-back.
  provenance:
  - reference_id: PMID:2995359
    supporting_text: The pure enzyme displays surface dilution kinetics when assayed in the presence
      of Triton X-100.
  - reference_id: file:ECOLI/cdsA/cdsA-uniprot.txt
    supporting_text: Multi-pass membrane protein
suggested_questions:
- question: How should integral versus peripheral membrane topology now be expressed, given that
    GO:0005887 integral component of plasma membrane and GO:0016021 integral component of membrane
    have been merged away into GO:0005886 and GO:0016020? CdsA is polytopic in the inner membrane,
    with its C-terminus placed in the periplasm experimentally, eight predicted transmembrane
    helices and purification that needed a different detergent at every step, yet after the
    topology merge the ontology offers no term that distinguishes this from a peripherally
    associated plasma-membrane protein.
  experts:
  - GO cellular component curators
- question: Does GO want a molecular function term for formation of the N-acetylglucosamine
    pyrophosphoryl-diacylglycerol unit of MPIase, and should such a term wait until it is clear
    whether CdsA, YnbB or a separate transferase performs the step in vivo?
  experts:
  - GO molecular function curators
  - bacterial membrane biogenesis researchers
- question: Should the glycolipid MPIase have process terms of its own, given that it is a
    characterised E. coli glycolipid with a dedicated biosynthetic branch and a defined role in
    membrane protein integration, rather than being annotated only through the generic glycolipid
    biosynthesis term?
  experts:
  - GO biological process curators
  - protein translocation researchers
- question: Should EcoCyc's two CDP-diacylglycerol biosynthesis rows for this gene be requalified
    from acts_upstream_of_or_within to involved_in, given that the gene product catalyses the
    reaction that constitutes the process?
  experts:
  - EcoCyc curators
  - GO Consortium biocurators
suggested_experiments:
- hypothesis: Wild-type CdsA forms the first MPIase intermediate on the enzyme without releasing
    CDP-diacylglycerol, rather than merely supplying CDP-diacylglycerol to a separate transferase.
  description: Purify wild-type CdsA, the CdsA8 mutant, YnbB and the two reciprocal chimeras,
    reconstitute each into proteoliposomes of defined composition, and follow formation of
    CDP-diacylglycerol and of the N-acetylglucosamine pyrophosphoryl-diacylglycerol intermediate
    from radiolabelled phosphatidic acid at physiological pH, including pulse-chase and trapping
    experiments that test whether free CDP-diacylglycerol is an obligatory released intermediate.
  experiment_type: reconstitution of purified enzymes in proteoliposomes with radiolabelled
    substrates
- hypothesis: CdsA requires a divalent metal ion for catalysis, as the EDTA sensitivity observed
    during purification suggests.
  description: Assay purified CdsA after dialysis against chelator, then add back magnesium,
    manganese and calcium individually over a concentration range, measuring initial rates with
    defined phosphatidic acid and CTP concentrations in mixed micelles, and determine by inductively
    coupled plasma mass spectrometry whether the purified enzyme carries bound metal.
  experiment_type: enzyme kinetics with chelator treatment and metal add-back
- hypothesis: The active site of CdsA faces the cytoplasm, as required if cytoplasmic CTP is a
    substrate.
  description: Use substituted-cysteine accessibility mapping on a cysteine-less CdsA background,
    probing from each side of the inner membrane in intact cells, spheroplasts and inverted
    vesicles, to assign the loops that carry the conserved family motif to one face, and test
    candidate catalytic residues by mutagenesis with complementation of a cdsA depletion strain.
  experiment_type: substituted-cysteine accessibility mapping with complementation assays
