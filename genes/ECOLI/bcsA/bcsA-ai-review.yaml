id: P37653
gene_symbol: bcsA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: BcsA is the catalytic cellulose synthase of Escherichia coli. Its cytosolic glycosyltransferase
  domain extends beta-1,4-glucan using UDP-glucose while its membrane region conducts the growing chain
  across the inner membrane. A PilZ domain senses c-di-GMP, and additional enterobacterial partners help
  maintain the active complex. BcsA is functional in cellulose-producing strains and in the repaired K-12
  derivative AR3110; its presence alone does not establish cellulose output in every K-12 background or
  condition.
