- term:
    id: GO:0006011
    label: UDP-alpha-D-glucose metabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR003919
  review:
    summary: BcsA directly consumes UDP-alpha-D-glucose during cellulose polymerization.
    action: ACCEPT
    reason: GO:0006011 describes chemical reactions and pathways involving UDP-alpha-D-glucose. Catalytic
      BcsA directly transfers glucose from this donor to the growing cellulose chain and releases UDP,
      so it performs a reaction of UDP-glucose metabolism. This core substrate-metabolism claim remains
      true alongside cellulose biosynthesis; the product-pathway term is not its descendant and does not
      replace it. The IPR003919 mapping is supported for this catalytic subunit, consistently with other
      catalytic BcsA exemplars.
    supported_by:
    - reference_id: PMID:39394223
      supporting_text: Bacterial BcsA orthologs are processive GT2 family synthases with a single cytosolic
        GT domain that uses UDP-glucose as substrate in an inverting, divalent metal ion-dependent mechanism
        of glycan polymerization
