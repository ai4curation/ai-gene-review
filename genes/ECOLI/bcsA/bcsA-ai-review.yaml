  findings:
  - statement: The abstract reports MG1655 under ectopic csgD expression, with bcsA deletion altering
      the cellulose-dependent phenotype.
    supporting_text: deletion of the bcsA gene, necessary for cellulose production
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only source. Conditions differ from W3110 stop-repair experiments; exact genotype
      reconciliation remains unresolved, not evidence for rejecting the process claim.
  full_text_unavailable: true
- id: PMID:24097954
  title: Cellulose as an architectural element in spatially structured Escherichia coli biofilms.
  findings:
  - statement: The codon 6 stop was repaired in W3110 to create cellulose-producing AR3110.
    supporting_text: For changing codon 6 of bcsQ from TAG(stop) to TTG(leucine) in the chromosomal copy
      of bcsQ in strain W3110
  - statement: BcsA deletion tests cellulose synthesis in the repaired background.
    supporting_text: a precise deletion of the cellulose synthase gene bcsA in AR3110 reconstituted the
      ring-structured morphology previously observed for strain W3110
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text examined. The early stop also has polar effects on downstream expression;
      the study does not assay intrinsic activity of a separately expressed 242-residue fragment.
- id: PMID:39394223
  title: Structural basis for synthase activation and cellulose modification in the E. coli Type II Bcs
    secretion system.
  findings:
  - statement: E. coli structures distinguish catalytic BcsA, membrane-anchored BcsB and cytosolic BcsQ
      stabilization.
    supporting_text: Bacterial BcsA orthologs are processive GT2 family synthases with a single cytosolic
      GT domain that uses UDP-glucose as substrate
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Native phenotype assays in PMID:39394223 used E. coli 1094; recombinant assembly used
      a bcs-deleted BL21*(DE3) host. The 2021 BcsRQ study also used 1094 genes and recombinant complexes.
      Protein identity/structure correspondence does not turn these into native K-12 experiments.
