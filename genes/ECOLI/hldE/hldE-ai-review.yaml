        supporting_text: Catalyzes the phosphorylation of D-glycero-D-manno-heptose 7-
  - description: >-
      HldE C-terminal D-glycero-beta-D-manno-heptose 1-phosphate
      adenylyltransferase transfers AMP from ATP to the beta-heptose
      1-phosphate, generating ADP-D-glycero-beta-D-manno-heptose for HldD
      epimerization.
    molecular_function:
