taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  HldE is a bifunctional ADP-heptose biosynthetic enzyme that supplies the
  activated heptose donor for assembly of the Escherichia coli LPS inner core.
  Its N-terminal kinase domain phosphorylates D-glycero-beta-D-manno-heptose
  7-phosphate at C-1, and its C-terminal adenylyltransferase domain transfers
  AMP from ATP to D-glycero-beta-D-manno-heptose 1-phosphate to form
  ADP-D-glycero-beta-D-manno-heptose. HldD then epimerizes this D,D-heptose
  nucleotide sugar to ADP-L-glycero-beta-D-manno-heptose.
