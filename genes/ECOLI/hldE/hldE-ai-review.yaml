- id: PMID:10629197
  title: The rfaE gene from Escherichia coli encodes a bifunctional protein involved in biosynthesis of
    the lipopolysaccharide core precursor ADP-L-glycero-D-manno-heptose.
  findings:
  - statement: E. coli rfaE/hldE has separable kinase-related and adenylyltransferase-related domains
      and is required to avoid a heptoseless LPS phenotype.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Full text: E. coli rfaE disruption gives heptoseless LPS and separately expressed domains
      provide distinct complementation activities. Direct target genetic evidence; the later biochemical
      reconstruction establishes exact reactions.'
- id: PMID:11751812
  title: Biosynthesis pathway of ADP-L-glycero-beta-D-manno-heptose in Escherichia coli.
  findings:
  - statement: Purified E. coli HldE supplies both beta-heptose kinase and adenylyltransferase activities;
      GmhB provides the intervening phosphatase step.
    supporting_text: Our results demonstrate that the synthesis of ADP- d -β- d -heptose in Escherichia
      coli requires three proteins, GmhA (sedoheptulose 7-phosphate isomerase), HldE (bifunctional d -β-
      d -heptose 7-phosphate kinase/ d -β- d -heptose 1-phosphate adenylyltransferase), and GmhB ( d ,
      d -heptose 1,7-bisphosphate phosphatase), as well as ATP and the ketose phosphate precursor sedoheptulose
      7-phosphate.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Full text: direct E. coli HldE and GmhB biochemistry and gmhB mutant LPS phenotype.
      The preparative first isomerization uses A. thermoaerophilus GmhA, so this experiment is not a purified
      E. coli GmhA assay or a Pseudomonas HldD assay.'
- id: PMID:15911532
  title: Localization, annotation, and comparison of the Escherichia coli K-12 proteome under two states
    of growth.
  findings:
  - statement: Large-scale proteomics study cited by the GOA cytosol row.
  full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract describes biochemical fractionation and proteomic localization; target-specific
      supplementary row was not independently retrieved. Existing curated cytosol assignment agrees with
      the independent cytosolic proteomics annotation and soluble enzyme biology.
- id: PMID:16030223
  title: Functional analysis of the glycero-manno-heptose 7-phosphate kinase domain from the bifunctional
    HldE protein, which is involved in ADP-L-glycero-D-manno-heptose biosynthesis.
  findings:
  - statement: The kinase-domain dimer is the functional unit supported by interaction and mutational
      experiments.
    supporting_text: Altogether, our data support the notions that the HldE functional unit is a dimer
      and that structural components present in each HldE1 monomer are required for enzymatic activity.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Full text: ATP-site mutagenesis, dominant-negative phenotypes, co-purification and
      size-exclusion analysis support an HldE dimer assembled through the kinase domain.'
