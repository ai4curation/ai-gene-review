    summary: Automated UniProt rules correctly associate LuxS-family enzymes with AI-2 quorum-sensing
      signal biosynthesis.
    action: ACCEPT
    reason: LuxS performs signal-production chemistry rather than perception. PMID11514505 used
      K-12 W3110 and its luxS::Tc derivative MDAI2 with conditioned media differing in AI-2
