  review:
    summary: LuxS directly releases homocysteine from S-ribosylhomocysteine in the bacterial
      two-step SAH-processing route of the activated methyl cycle.
    action: NEW
    reason: Retain the historical proposal and IDA source unchanged. Full PMID11489131 uses
