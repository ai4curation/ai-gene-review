id: P45578
gene_symbol: luxS
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  LuxS is the cytosolic S-ribosylhomocysteine lyase of the bacterial activated
  methyl cycle. It cleaves S-ribosylhomocysteine to L-homocysteine and
  4,5-dihydroxy-2,3-pentadione, regenerating homocysteine for methionine
  recycling and producing the precursor that spontaneously cyclizes to the AI-2
  quorum-sensing signal.
existing_annotations:
- term:
    id: GO:0005506
    label: iron ion binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR003815
  - InterPro:IPR037005
  review:
    summary: >-
      The family-level InterPro inference that LuxS binds iron is consistent
      with the conserved LuxS metalloenzyme fold.
    action: KEEP_AS_NON_CORE
    reason: >-
      LuxS-family S-ribosylhomocysteine lyases use a divalent metal center, and
      UniProt records this E. coli enzyme as binding one Fe cation per subunit.
      The cofactor binding is real but supports the catalytic lyase activity
      rather than constituting a separate core molecular function.
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:15690043
  qualifier: enables
  supporting_entities:
  - UniProtKB:P0A6Y8
  review:
    summary: >-
      The DnaK interaction comes from a large-scale affinity-purification/mass
      spectrometry network and does not identify a specific LuxS activity.
    action: REMOVE
    reason: >-
      The reported physical interaction is not evidence for a narrower
      molecular function than the low-information parent term protein binding,
      and LuxS is a metabolic lyase rather than a DnaK co-chaperone or
      dedicated adaptor.
    supported_by:
    - reference_id: PMID:15690043
      supporting_text: >-
        affinity-tagged alleles of 1,000 open reading frames (approximately 23%
        of the genome)
