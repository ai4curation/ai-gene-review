id: P45578
gene_symbol: luxS
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: LuxS is a cytosolic S-ribosylhomocysteine lyase that releases L-homocysteine and
  4,5-dihydroxy-2,3-pentadione in the Pfs/LuxS arm of the activated methyl cycle. The latter
  product gives rise to AI-2 signaling molecules, allowing LuxS to perform signal-production
  work in characterized E. coli quorum responses. Metabolic turnover, signal production and
  downstream signal perception are distinct functions; LuxS itself is not the signal receptor.
