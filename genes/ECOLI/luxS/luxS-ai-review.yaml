- term:
    id: GO:0033353
    label: L-methionine cycle
  evidence_type: IDA
  original_reference_id: PMID:11489131
  qualifier: involved_in
  review:
    summary: >-
      LuxS directly releases homocysteine from S-ribosylhomocysteine in the
      bacterial two-step SAH-processing route of the activated methyl cycle.
    action: NEW
    reason: >-
      LuxS catalyzes the second MtnN/Pfs-LuxS route step, producing
      L-homocysteine that can be remethylated to regenerate L-methionine after
      SAM-dependent methyl transfer.
    supported_by:
    - reference_id: PMID:11489131
      supporting_text: >-
        We show here that LuxS is the AI-2 synthase and that AI-2 is produced
        from S-adenosylmethionine in three enzymatic steps.
references:
- id: GO_REF:0000002
  title: Gene Ontology annotation through association of InterPro records with GO
    terms
