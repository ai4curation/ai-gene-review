  title: Annotation inferences using phylogenetic trees
  findings: []
- id: GO_REF:0000120
  title: Combined Automated Annotation using Multiple IEA Methods
  findings: []
- id: PMID:11489131
  title: 'The LuxS family of bacterial autoinducers: biosynthesis of a novel quorum-sensing
    signal molecule.'
  findings:
  - statement: >-
      LuxS cleaves S-ribosylhomocysteine to homocysteine and the AI-2
      precursor/product in a pathway from S-adenosylmethionine.
    supporting_text: >-
      We show here that LuxS is the AI-2 synthase and that AI-2 is produced from
      S-adenosylmethionine in three enzymatic steps. The substrate for LuxS is
      S-ribosylhomocysteine, which is cleaved to form two products, one of
      which is homocysteine, and the other is AI-2.
- id: PMID:11514505
  title: DNA microarray-based identification of genes controlled by autoinducer 2-stimulated
    quorum sensing in Escherichia coli.
  findings:
  - statement: >-
      An E. coli luxS mutant that could not synthesize AI-2 was used to assay
      AI-2-dependent transcriptional responses.
    supporting_text: >-
      We investigated global changes in mRNA abundance elicited by the AI-2
      signaling molecule through the use of a luxS mutant that was unable to
      synthesize AI-2.
- id: PMID:15690043
  title: Interaction network containing conserved and essential protein complexes
    in Escherichia coli.
  findings:
  - statement: >-
      The source of the DnaK IPI was a chromosome-scale affinity purification
      survey rather than a LuxS-directed mechanistic study.
    supporting_text: >-
      A total of 857 proteins, including 198 of the most highly conserved,
      soluble non-ribosomal proteins essential in at least one bacterial
      species, were tagged successfully, whereas 648 could be purified to
      homogeneity and their interacting protein partners identified by mass
      spectrometry.
- id: PMID:15911532
  title: Localization, annotation, and comparison of the Escherichia coli K-12 proteome
    under two states of growth.
  findings:
  - statement: >-
      This proteomics study assigned E. coli K-12 protein forms to cytosolic,
      periplasmic, inner-membrane, and outer-membrane fractions.
    supporting_text: >-
      2,160 were annotated and assigned to the cytosol, periplasm, inner
      membrane, and outer membrane by biochemical fractionation followed by
      two-dimensional gel electrophoresis and tandem mass spectrometry.
- id: PMID:18304323
  title: Protein abundance profiling of the Escherichia coli cytosol.
  findings:
  - statement: >-
      Ishihama et al. identified more than a thousand proteins by mass
      spectrometry from E. coli cytosolic fractions.
    supporting_text: >-
      Using a combination of LC-MS/MS approaches with protein and peptide
      fractionation steps we identified 1103 proteins from the cytosolic
      fraction of the Escherichia coli strain MC4100.
- id: PMID:9990077
  title: 'Quorum sensing in Escherichia coli, Salmonella typhimurium, and Vibrio harveyi:
    a new family of genes responsible for autoinducer production.'
  findings:
  - statement: >-
      The luxS genes from E. coli, S. typhimurium, and V. harveyi were
      identified as a homologous AI-2 production gene family.
    supporting_text: >-
      Here we report the identification and analysis of the gene responsible for
      AI-2 production in V. harveyi, S. typhimurium, and E. coli.
