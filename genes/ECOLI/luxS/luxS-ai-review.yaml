- term:
    id: GO:0009372
    label: quorum sensing
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  supporting_entities:
  - ARBA:ARBA00034397
  - InterPro:IPR003815
  - InterPro:IPR037005
  - UniRule:UR000076351
  review:
    summary: >-
      Automated UniProt rules correctly associate LuxS-family enzymes with
      AI-2 quorum-sensing signal biosynthesis.
    action: ACCEPT
    reason: >-
      LuxS participates in quorum sensing by generating
      4,5-dihydroxy-2,3-pentadione, the precursor that yields AI-2 signal
      molecules; this process role is a direct consequence of its
      S-ribosylhomocysteine lyase activity.
- term:
    id: GO:0009372
    label: quorum sensing
  evidence_type: IMP
  original_reference_id: PMID:11514505
  qualifier: acts_upstream_of_or_within
  review:
    summary: >-
      An E. coli luxS mutant unable to synthesize AI-2 was used to define
      AI-2-responsive transcription.
    action: ACCEPT
    reason: >-
      Loss of luxS blocks synthesis of the AI-2 signal and thereby places LuxS
      upstream of the quorum-sensing response. LuxS performs the AI-2 producer
      step rather than signal detection, but production of the extracellular
      signal is part of the quorum-sensing process.
    supported_by:
    - reference_id: PMID:11514505
      supporting_text: >-
        We investigated global changes in mRNA abundance elicited by the AI-2
        signaling molecule through the use of a luxS mutant that was unable to
        synthesize AI-2.
