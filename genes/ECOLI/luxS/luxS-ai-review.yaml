- id: PMID:11489131
  title: 'The LuxS family of bacterial autoinducers: biosynthesis of a novel quorum-sensing
    signal molecule.'
  findings:
  - statement: LuxS cleaves S-ribosylhomocysteine to homocysteine and the AI-2 precursor/product
      in a pathway from S-adenosylmethionine.
    supporting_text: We show here that LuxS is the AI-2 synthase and that AI-2 is produced from
      S-adenosylmethionine in three enzymatic steps. The substrate for LuxS is S-ribosylhomocysteine,
      which is cleaved to form two products, one of which is homocysteine, and the other is
      AI-2.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Full publisher Methods and Results inspected externally: MG1655 GST constructs,
      BL21 expression, sequential reactions and homocysteine detection. The protected cache
      remains abstract-only; see scoped consultation provenance.'
- id: PMID:11514505
  title: DNA microarray-based identification of genes controlled by autoinducer 2-stimulated
    quorum sensing in Escherichia coli.
  findings:
  - statement: An E. coli luxS mutant that could not synthesize AI-2 was used to assay AI-2-dependent
      transcriptional responses.
    supporting_text: We investigated global changes in mRNA abundance elicited by the AI-2 signaling
      molecule through the use of a luxS mutant that was unable to synthesize AI-2.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full cached text inspected. W3110/MDAI2 conditioned-medium experiments support
      a strain/condition-specific producer role; do not generalize every luxS-dependent metabolic
      phenotype to quorum signaling.
