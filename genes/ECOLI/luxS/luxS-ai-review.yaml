  review:
    summary: >-
      The PAINT cytosol assertion fits the soluble, cytosolic activated methyl
      cycle chemistry performed by LuxS.
    action: ACCEPT
    reason: >-
      LuxS has its own curated cytosol evidence in E. coli and belongs to a
      bacterial S-ribosylhomocysteine lyase clade whose activity is inherited
      from the same cytosolic state; the target's presence in the IBA
      WITH/FROM is expected because target-specific evidence helped seed the
      PAINT node.
