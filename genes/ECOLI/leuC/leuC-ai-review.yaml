- term:
    id: GO:0051539
    label: 4 iron, 4 sulfur cluster binding
  evidence_type: IC
  original_reference_id: PMID:17102132
  qualifier: enables
  review:
    summary: >-
      Isopropylmalate isomerase is a [4Fe-4S] dehydratase whose
      solvent-exposed cluster is oxidized by H2O2 to an inactive [3Fe-4S]
      form; LeuC carries the three cluster-binding cysteines.
    action: KEEP_AS_NON_CORE
    reason: >-
      The cluster is the catalytic cofactor of the isomerase, so its binding
      is retained as non-core cofactor information, as in the PSEPK leuC,
      yeast LEU1 and S. pombe leu2 reviews. LeuC rather than LeuD binds it.
    supported_by:
    - reference_id: PMID:17102132
      supporting_text: >-
        The defect was tracked to the inactivation of isopropylmalate
        isomerase. This enzyme belongs to a family of [4Fe-4S] dehydratases
    - reference_id: file:ECOLI/leuC/leuC-uniprot.txt
      record_section: ["CC:COFACTOR"]
      supporting_text: Binds 1 [4Fe-4S] cluster per subunit.
