suggested_questions:
- question: >-
    Which residues of LeuD complete the LeuC active site, and does LeuD
    contribute catalytic groups or only substrate binding?
suggested_experiments:
- description: >-
    Reconstitute purified E. coli LeuC and LeuD separately and together under
    anaerobic conditions, measure isomerase activity and cluster content, and
    test LeuD point mutants at residues predicted to face the LeuC cluster.
  experiment_type: in vitro reconstitution and mutagenesis
