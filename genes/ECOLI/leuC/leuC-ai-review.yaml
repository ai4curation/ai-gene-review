id: P0A6A6
gene_symbol: leuC
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  leuC encodes the large subunit of isopropylmalate isomerase
  (3-isopropylmalate dehydratase, EC 4.2.1.33), the second enzyme of the
  leucine-specific branch of branched-chain amino acid biosynthesis. LeuC is
  an aconitase-family protein that carries the [4Fe-4S] cluster, bound by
  three conserved cysteines, and forms an obligate heterodimer with the small
  subunit LeuD; the LeuC-LeuD complex interconverts 2-isopropylmalate and
  3-isopropylmalate by dehydration to 2-isopropylmaleate and rehydration. The
  enzyme is cytosolic and, like other solvent-exposed [4Fe-4S] dehydratases,
  is inactivated by low micromolar hydrogen peroxide, which converts its
  cluster to an inactive [3Fe-4S] form and blocks leucine synthesis.
existing_annotations:
- term:
    id: GO:0003861
    label: 3-isopropylmalate dehydratase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: >-
      This is the specific activity of the LeuC-LeuD isomerase; LeuC
      contributes the [4Fe-4S]-containing catalytic core.
    action: ACCEPT
    reason: >-
      HAMAP MF_01026, the LeuC-specific InterPro signature, Rhea 32287 and EC
      4.2.1.33 agree on the activity, so the term is right. The activity is a
      property of the LeuC-LeuD heterodimer: the isomerase copurifies as two
      subunits and activity is reconstituted by mixing leuC and leuD mutant
      extracts (PMID:7026530, Salmonella). The machine-sourced `enables`
      qualifier should therefore be `contributes_to`, recorded below as a
      source defect, as in the PSEPK leuC review.
    supported_by:
    - reference_id: file:ECOLI/leuC/leuC-uniprot.txt
      record_section: ["CC:SUBUNIT"]
      supporting_text: Heterodimer of LeuC and LeuD.
    - reference_id: PMID:23636690
      supporting_text: >-
        leuC and leuD, encoding the heterodimeric iron-sulfur cluster protein,
        isopropylmalate isomerase, can complement the S. cerevisiae leu1 auxotrophy.
    source_defects:
    - defect_type: WRONG_QUALIFIER
      resource: UNIPROT
      slot: Qualifier
      requested_change: REPOINT
      asserted_value: enables
      corrected_value: contributes_to
      cause: OTHER
      confidence: CONFIRMED
      explanation: >-
        GO:0003861 is the activity of the heterodimeric LeuC-LeuD
        isopropylmalate isomerase (GO:0009316). LeuC is the large subunit
        and needs LeuD for activity, so it contributes to rather than
        independently enables the activity.
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:24561554
  qualifier: enables
  review:
    summary: >-
      A genome-scale yeast two-hybrid screen detected the LeuC-LeuD
      interaction.
    action: REMOVE
    reason: >-
      The interaction is real and expected, but bare protein binding carries
      no functional information. The LeuC-LeuD association is captured
      informatively by the 3-isopropylmalate dehydratase complex (GO:0009316)
      rows accepted in this review. Removal does not dispute the interaction.
