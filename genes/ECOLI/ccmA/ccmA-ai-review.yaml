      CcmA and CcmB form a CcmA2B1C1 complex with CcmC that mediates
      ATP-dependent release of holo-CcmE; without CcmA or CcmB holo-CcmE is
      trapped on CcmC.
    supporting_text: >-
      Expression of CcmA and CcmB facilitates formation of the CcmA2B1C1
      complex and ATP-dependent release of holoCcmE.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only cache; abstract directly states the release function.
- id: PMID:17419738
  title: Loss of ATP hydrolysis activity by CcmAB results in loss of c-type cytochrome
