- id: PMID:7635817
  title: Escherichia coli genes required for cytochrome c maturation.
  findings:
  - statement: >-
      A deletion of the E. coli ccmABCDEFGH cluster abolishes maturation of
      indigenous and heterologous c-type cytochromes.
    supporting_text: >-
      The results suggest that the E. coli ccm gene cluster present in the
      aeg-46.5 region is required for a general pathway involved in cytochrome
      c maturation.
- id: PMID:10339610
  title: Heme transfer to the heme chaperone CcmE during cytochrome c maturation requires
    the CcmC protein, which may function independently of the ABC-transporter CcmAB.
  findings:
  - statement: >-
      CcmC, not CcmAB, is strictly required for heme loading onto CcmE; ccmA
      and ccmB deletions block holocytochrome c formation; evidence argues
      against CcmAB as heme exporter.
    supporting_text: >-
      We report that CcmC is functionally uncoupled from the ABC transporter
      subunits CcmA and CcmB, because it is the only Ccm protein that is
      strictly required for heme transfer and attachment to CcmE.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text cached; E. coli K-12 in-frame ccmA/ccmB deletions assayed
      directly. Source of the IMP annotation.
