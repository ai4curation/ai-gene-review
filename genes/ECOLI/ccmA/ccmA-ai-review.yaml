suggested_questions:
- question: >-
    Does CcmAB translocate any substrate across the membrane, or is its ATPase
    cycle purely a conformational energy-coupling mechanism for releasing
    holo-CcmE from CcmC?
- question: >-
    Should GO provide a cellular component term for the CcmABCD(E) heme
    chaperone release complex (ComplexPortal CPX-3568), so that CcmA/CcmB need
    not be placed in the metabolite-transport-defined ABC transporter complex
    term?
suggested_experiments:
- description: >-
