- term:
    id: GO:0015439
    label: ABC-type heme transporter activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - RHEA:19261
  - EC:7.6.2.5
  review:
    summary: ATP-dependent CcmE release is established; coupling ATP hydrolysis to membrane-crossing heme
      transport remains disputed.
    action: UNDECIDED
    reason: GO:0015439 specifically couples ATP hydrolysis to movement of heme across the membrane. The
      2023 E. coli structures propose a floppase, whereas the 2025 CcmCD mapping supports energy-independent
      heme passage and ATP-dependent release. Earlier bypass/vesicle results limit a compulsory ATP-driven
      transport model but do not prove that CcmAB can never contribute to transport. The broader transporter
      claims inherit the same unresolved mechanism. ATPase chemistry remains accepted independently. The
      E. coli evidence is distinguished from heterologous ortholog assays and engineered expression constructs.
    supported_by:
    - reference_id: PMID:37626034
      supporting_text: suggest that this unusual ABC transporter acts as a heme floppase
    - reference_id: PMID:40167305
      supporting_text: do not support a role for CcmB in heme acceptance for System I
    - reference_id: PMID:17419738
      supporting_text: We have purified a complex of these proteins, and found it to have ATP hydrolysis
        activity.
