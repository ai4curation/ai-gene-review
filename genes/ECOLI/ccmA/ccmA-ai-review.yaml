suggested_questions:
- question: Does CcmAB translocate any substrate across the membrane, or is its ATPase cycle purely a
    conformational energy-coupling mechanism for releasing holo-CcmE from CcmC?
- question: Should GO provide a cellular component term for the CcmABCD(E) heme chaperone release complex
    (ComplexPortal CPX-3568), so that CcmA/CcmB need not be placed in the metabolite-transport-defined
    ABC transporter complex term?
suggested_experiments:
- description: Reconstitute purified CcmABCD with heme-loaded CcmE in proteoliposomes and measure ATP-dependent
    holo-CcmE release with wild-type versus K40D CcmA, while testing for vectorial movement of candidate
    small molecules.
  experiment_type: in vitro reconstitution
