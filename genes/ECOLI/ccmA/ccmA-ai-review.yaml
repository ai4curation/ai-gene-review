      supporting_text: >-
        We propose that the CcmA2B1C1 complex represents a new subgroup within
        the ABC transporter superfamily that functions to release a chaperone.
- term:
    id: GO:0043190
    label: ATP-binding cassette (ABC) transporter complex
  evidence_type: NAS
  original_reference_id: PMID:24044352
  qualifier: part_of
  review:
    summary: >-
      CcmA is the nucleotide-binding subunit of a complex with ABC-transporter
      architecture (CcmA plus integral membrane CcmB, joined by CcmC/CcmD),
      but the complex is not shown to transport a metabolite.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      GO:0043190 is defined as a complex for transport of metabolites into or
      out of the cell. CcmAB does have ABC architecture and is described as an
      ABC transporter by name, so the assignment is not baseless, but the cited
      paper itself states the transporter model was disproven and the
      characterized function is holo-CcmE release. No GO complex term exists
      for the CcmABCD heme-chaperone release complex (ComplexPortal
      CPX-3568), so this is flagged as over-annotation rather than replaced.
    supported_by:
    - reference_id: PMID:10339610
      supporting_text: >-
        Our results suggest that the ABC transporter is composed of the
        ATP-binding CcmA subunit plus the membrane-integral CcmB protein.
    - reference_id: PMID:24044352
      supporting_text: >-
        It was thought that CcmABC form a ATP-driven heme transporter,14 but
        this has since been disproven.
