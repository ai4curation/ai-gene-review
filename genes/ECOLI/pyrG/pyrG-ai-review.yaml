gene_symbol: pyrG
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: CTP synthase (CtpS/PyrG) catalyses the final step of de novo pyrimidine nucleotide synthesis,
  the ATP-dependent amination of UTP to CTP. Each subunit has an N-terminal amidoligase domain that binds
  ATP and UTP and a C-terminal class I glutamine amidotransferase domain whose Cys379 hydrolyses glutamine;
  the released ammonia travels through an internal channel to the amidoligase site, and exogenous ammonia
  can also be used. Activity requires nucleotide-driven assembly of dimers into homotetramers, is allosterically
  activated by GTP for the glutamine reaction, needs free Mg2+, and is feedback-inhibited by CTP. In E.
  coli cells the enzyme is cytosolic and also polymerises into filaments; CTP promotes this polymerisation,
  which inhibits activity and helps hold intracellular CTP levels in check.
