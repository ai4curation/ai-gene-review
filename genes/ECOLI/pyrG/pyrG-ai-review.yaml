core_functions:
- description: 'Glutamine-dependent CTP synthase: ATP-dependent amination of UTP to CTP, with ammonia
    generated by the C-terminal glutaminase domain and channelled to the amidoligase site; the final step
    of de novo CTP synthesis, regulated by tetramerisation, GTP activation, CTP feedback inhibition and
    filament formation.'
  molecular_function:
    id: GO:0003883
    label: CTP synthase activity
  directly_involved_in:
  - id: GO:0044210
    label: '''de novo'' CTP biosynthetic process'
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: file:ECOLI/pyrG/pyrG-uniprot.txt
    record_section:
    - CC:FUNCTION
    supporting_text: Catalyzes the ATP-dependent amination of UTP to CTP with either L-glutamine or ammonia
      as the source of nitrogen
  - reference_id: PMID:11336655
    supporting_text: Cytidine 5'-triphosphate synthase catalyses the ATP-dependent formation of CTP from
      UTP with either ammonia or glutamine as the source of nitrogen
  - reference_id: file:ECOLI/pyrG/pyrG-uniprot.txt
    record_section:
    - CC:PATHWAY
    supporting_text: 'PATHWAY: Pyrimidine metabolism; CTP biosynthesis via de novo pathway;'
  - reference_id: PMID:15911532
    supporting_text: assigned to the cytosol, periplasm, inner membrane, and outer membrane by biochemical
      fractionation
suggested_questions:
- question: Do E. coli CtpS filaments in stationary-phase cells correspond to the eukaryotic cytoophidium,
    and should PAINT propagate GO:0097268 to bacterial PyrG?
suggested_experiments:
- description: Compare growth and nucleotide pools of a polymerisation-defective pyrG allele across nutrient
    shifts to quantify how much CTP homeostasis depends on filament-mediated inhibition versus CTP feedback
    at the active site.
