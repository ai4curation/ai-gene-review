  review:
    summary: UniProt records localization to the cytoophidium in E. coli BL21 cells from this paper; independent
      work shows E. coli CtpS filaments in vivo.
    action: KEEP_AS_NON_CORE
    reason: E. coli CtpS forms filaments in vivo (PMID:20639870), and polymerisation is a regulatory state
      that inhibits activity (PMID:25030911). PAINT does not propagate cytoophidium to bacteria, but this
      is direct evidence on the gene; kept as non-core because the filament is a storage/regulatory state,
      not where catalysis happens.
    supported_by:
    - reference_id: file:ECOLI/pyrG/pyrG-uniprot.txt
      record_section:
      - CC:SUBCELLULAR LOCATION
      supporting_text: Localizes to the cytoophidium, a subcellular filamentary structure where CTP synthase
        is compartmentalized
    - reference_id: PMID:20639870
      supporting_text: Here we demonstrate that CtpS forms filaments both in vivo and in vitro, and that
        filamentation is conserved in Caulobacter and E. coli
    - reference_id: PMID:25030911
      supporting_text: CTP binding and higher enzyme concentration further stimulates reversible formation
        of inhibited polymeric filaments, which can be disassembled by ATP/UTP
