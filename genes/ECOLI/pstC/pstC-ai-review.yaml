    label: phosphate transmembrane transporter activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR011864
  review:
    summary: The PstC family maps to the phosphate permease activity of PstSACB.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      PstC is a necessary transmembrane subunit of the phosphate transporter,
      but GO:0005315 is enabled by the assembled PstSACB complex. PstC
      contributes to that complex-level activity rather than independently
      enabling phosphate transmembrane transport, and that relationship is
      captured in core_functions.
