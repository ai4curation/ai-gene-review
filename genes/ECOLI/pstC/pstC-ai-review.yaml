  evidence_type: IMP
  original_reference_id: PMID:2646285
  qualifier: acts_upstream_of_or_within
  review:
    summary: PstC Arg237 and Glu240 substitutions abolish Pst phosphate transport.
    action: ACCEPT
    reason: >-
      Site-directed mutations in conserved PstC residues cause loss of
      phosphate transport through the Pst system, directly supporting the role
      of PstC in transmembrane phosphate uptake.
    supported_by:
    - reference_id: PMID:2646285
      supporting_text: >-
        The amino acid substitutions resulting from the pstC gene mutations,
        Arg-237----Gln, Glu-240----Gln, or a combination of both, caused the
        loss of phosphate transport through the Pst system
