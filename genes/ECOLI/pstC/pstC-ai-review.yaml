suggested_questions:
- question: >-
    How do PstC and PstA divide substrate gating, PstS docking, and PstB
    coupling in the E. coli PstSACB conformational cycle?
suggested_experiments:
- experiment_type: transporter reconstitution with paired permease mutants
  description: >-
    Reconstitute PstSACB complexes carrying PstC and PstA interface mutations
    to measure phosphate uptake, ATP hydrolysis, and PstS-stimulated gating.
