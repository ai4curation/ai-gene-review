taxon:
  id: NCBITaxon:83333
  label: Escherichia coli (strain K12)
description: >-
  PstC is a multi-pass inner-membrane permease subunit of the high-affinity
  PstSACB ABC phosphate importer. It partners with PstA to form the
  phosphate-translocation pathway that is gated by periplasmic PstS and powered
  by the cytoplasmic PstB ATPase dimer.
existing_annotations:
