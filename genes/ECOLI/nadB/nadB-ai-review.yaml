taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  NadB is the FAD-containing L-aspartate oxidase of Escherichia coli K-12 and catalyzes the first reaction
  of de novo NAD+ biosynthesis from L-aspartate: oxidation of L-aspartate to the unstable intermediate
  iminoaspartate (iminosuccinate). The reduced flavin can be reoxidized by molecular oxygen, yielding
  hydrogen peroxide, or by fumarate, yielding succinate, so the enzyme functions under aerobic and anaerobic
  conditions. Iminoaspartate is condensed with dihydroxyacetone phosphate by quinolinate synthase NadA
  to form quinolinate. NadB is a soluble monomeric cytosolic flavoprotein related to the flavoprotein
  subunit of fumarate reductase and succinate dehydrogenase.
