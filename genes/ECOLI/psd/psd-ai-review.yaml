- term:
    id: GO:0005886
    label: plasma membrane
  evidence_type: EXP
  original_reference_id: PMID:4598120
  qualifier: located_in
  review:
    summary: >-
      UniProt records the cell-membrane location from the purification paper
      and, by HAMAP rule, describes Psd as a peripheral membrane protein.
    action: ACCEPT
    reason: >-
      Membrane location of the active enzyme is core to its function. The
      sources differ on the mode of attachment: UniProt says peripheral
      (HAMAP plus PMID:4598120), PMID:7011377 calls the purified enzyme an
      intrinsic membrane protein, and the crystal structure (PMID:32402247)
      shows an N-terminal hydrophobic helical region used for membrane
      binding, consistent with a monotopic enzyme anchored without
      transmembrane helices. All three agree on the plasma (inner) membrane,
      which is what this term asserts.
    supported_by:
    - reference_id: file:ECOLI/psd/psd-uniprot.txt
      record_section: ["CC:SUBCELLULAR LOCATION"]
      supporting_text: >-
        SUBCELLULAR LOCATION: Cell membrane {ECO:0000255|HAMAP-Rule:MF_00662,
        ECO:0000269|PubMed:4598120}; Peripheral membrane protein
