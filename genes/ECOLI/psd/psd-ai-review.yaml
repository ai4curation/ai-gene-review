suggested_questions:
- question: >-
    Is the membrane-embedded form of E. coli Psd a dimer, as in the crystal
    structure, or a higher oligomer, as suggested by detergent kinetics?
suggested_experiments:
- description: >-
    Determine the oligomeric state of Psd in native membranes (for example by
    in-membrane crosslinking or native mass spectrometry of nanodisc-embedded
    enzyme) and test whether dimer-interface mutants lose activity.
