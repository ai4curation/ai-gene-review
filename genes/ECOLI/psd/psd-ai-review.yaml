id: P0A8K1
gene_symbol: psd
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  psd encodes phosphatidylserine decarboxylase, a pyruvoyl-dependent enzyme
  that catalyzes the second and last step of phosphatidylethanolamine
  biosynthesis, decarboxylating phosphatidylserine made by PssA to
  phosphatidylethanolamine and CO2. It is made as an inactive proenzyme that
  cleaves itself between Gly-253 and Ser-254; the serine becomes the
  pyruvoyl prosthetic group at the N-terminus of the small alpha chain, which
  stays associated with the large beta chain. The mature enzyme is bound to
  the cytoplasmic (inner) membrane through an N-terminal hydrophobic helical
  region, acts only on the lipid-linked serine moiety, and crystallizes as a
  homodimer.
