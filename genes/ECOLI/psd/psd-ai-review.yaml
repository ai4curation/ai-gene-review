- term:
    id: GO:0016540
    label: protein autoprocessing
  evidence_type: IMP
  original_reference_id: PMID:2406271
  qualifier: acts_upstream_of_or_within
  review:
    summary: >-
      Ser-254 substitutions slow or abolish cleavage of the proenzyme between
      Gly-253 and Ser-254, which generates the pyruvoyl group.
    action: KEEP_AS_NON_CORE
    reason: >-
      Psd cleaves itself to generate its own catalytic prosthetic group. This
      self-maturation is required for an active enzyme but is a property of
      the enzyme rather than its core function (phosphatidylserine
      decarboxylation), so it is kept as non-core, consistent with the
      zymogen activation row for the same event.
    supported_by:
    - reference_id: PMID:2406271
      supporting_text: >-
        These results are consistent with the hydroxyl group of Ser-254 playing
        a critical role in the cleavage of the peptide bond between Gly-253 and
        Ser-254 of the prophosphatidylserine decarboxylase
- term:
    id: GO:0031638
    label: zymogen activation
  evidence_type: IMP
  original_reference_id: PMID:2406271
  qualifier: acts_upstream_of_or_within
  review:
    summary: >-
      The proenzyme is inactive and becomes active by self-cleavage; S254A
      blocks processing and activity.
    action: KEEP_AS_NON_CORE
    reason: >-
      Correct: GO:0031638 is defined as "The proteolytic processing of an
      inactive enzyme to an active form", which describes Psd self-maturation.
      It is kept as non-core because it describes the enzyme's own activation
      rather than its catalytic role in phosphatidylethanolamine synthesis,
      the same status as the protein autoprocessing row for this event.
    supported_by:
    - reference_id: PMID:2406271
      supporting_text: >-
        When Ser-254 is changed to cysteine (S254C), threonine (S254T), or
        alanine (S254A) by site-directed mutagenesis, the rate of processing of
        the proenzyme and the production of the functional enzyme are
        drastically affected.
