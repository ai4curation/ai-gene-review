- term:
    id: GO:0009249
    label: protein lipoylation
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR000544
  - InterPro:IPR020605
  review:
    summary: Protein lipoylation from InterPro octanoyltransferase signatures.
    action: ACCEPT
    reason: 'Core process. LipB performs step 1 of the endogenous lipoylation route itself: it forms the
      amide bond between octanoate and the lipoyl-domain lysine, the substrate on which LipA then builds
      the dithiolane ring. This is participation, not mere requirement.'
    supported_by:
    - *id002
    - *id003
- term:
    id: GO:0010629
    label: negative regulation of gene expression
  evidence_type: IMP
  original_reference_id: PMID:11072067
  qualifier: acts_upstream_of_or_within
  review:
    summary: A lipB insertion (cde-4) raised activity of the dam P2 promoter; complementation by LipB
      restored it.
    action: KEEP_AS_NON_CORE
    reason: 'Retained, deferring to the curator. The IMP rests on a paper whose full text is not available
      here: the cached record is abstract-only, the publisher page (ScienceDirect) returned 403, and there
      is no PMC copy. The abstract reports the promoter phenotype and its complementation but not the
      mechanism, so it cannot be judged whether the effect is direct. Under the rule not to overrule experimental
      annotations from incomplete evidence, the row is kept. It is non-core: the claim is peripheral to
      the defining function of LipB, octanoyl transfer from octanoyl-ACP to lipoyl domains.'
    supported_by:
    - reference_id: PMID:11072067
      supporting_text: The unlinked cde-4::miniTn10 insertion also results in severalfold higher activity
        of the dam P2 promoter, suggesting that this mutation resulted in the loss of a putative dam P2
        repressor.
