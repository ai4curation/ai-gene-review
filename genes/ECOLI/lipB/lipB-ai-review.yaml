gene_symbol: lipB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: LipB is the octanoyltransferase that starts endogenous lipoic acid assembly in Escherichia
  coli. It transfers an octanoyl chain, made by type II fatty acid synthesis as a thioester on acyl carrier
  protein, onto the conserved lysine of lipoyl domains in the E2 subunits of the pyruvate and 2-oxoglutarate
  dehydrogenase complexes and the H protein of the glycine cleavage system, through a covalent acyl-thioester
  intermediate on Cys169. The octanoylated domain is then the substrate of lipoyl synthase LipA, which
  inserts the two sulfur atoms, so lipoate is built in place on the carrier protein. LipB is a soluble
  cytoplasmic member of the BPL/LPL catalytic domain superfamily; it also accepts lipoyl-ACP in vitro
  and associates with ACP and with the intact 2-oxoacid dehydrogenase complexes. Cells lacking LipB retain
  low lipoylation through the LplA salvage ligase when lipoate is available.
