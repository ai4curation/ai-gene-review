- term:
    id: GO:0009106
    label: lipoate metabolic process
  evidence_type: IMP
  original_reference_id: PMID:1655709
  qualifier: acts_upstream_of_or_within
  review:
    summary: Null-mutant genetics placing lipB in lipoic acid formation.
    action: MODIFY
    reason: 'The genetics is sound (the 1991 transposon screen defined lipA and lipB as the two lip loci),
      but lipoate metabolic process describes chemistry of free lipoic acid. LipB never handles free lipoate:
      it moves an octanoyl chain from ACP onto the target lysine, which is the first step of protein lipoylation.
      GO:0009249 is the accurate process term and the one the gene already carries; it is a lateral correction
      rather than a descendant, the same correction applied to the obsolete GO:0009107 rows of E. coli
      lipA.'
    proposed_replacement_terms:
    - &id001
      id: GO:0009249
      label: protein lipoylation
    supported_by:
    - reference_id: PMID:1655709
      supporting_text: The Tn10dTc and Tn1000dKn mutations define two genes, lipA and lipB, involved in
        lipoic acid biosynthesis.
    - &id002
      reference_id: file:ECOLI/lipB/lipB-uniprot.txt
      record_section:
      - CC:PATHWAY
      supporting_text: 'Protein modification; protein lipoylation via endogenous pathway; protein N(6)-(lipoyl)lysine
        from octanoyl-[acyl-carrier-protein]: step 1/2.'
- term:
