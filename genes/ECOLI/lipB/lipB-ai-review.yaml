  qualifier: acts_upstream_of_or_within
  review:
    summary: Obsolete lipoate biosynthetic process term from the lipA/lipB sequencing and phenotype study.
    action: MODIFY
    reason: GO:0009107 is obsolete and GO replaced it with GO:0009249 protein lipoylation, which is biologically
      correct here because the endogenous pathway assembles lipoate on the carrier protein. Same action
      as the E. coli lipA and human LIAS rows on this term. The abstract also notes the residual lipoylation
