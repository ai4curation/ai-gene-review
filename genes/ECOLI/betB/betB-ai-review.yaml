  label: Escherichia coli K-12
description: betB (b0312) encodes the NAD-dependent betaine-aldehyde dehydrogenase of Escherichia coli,
  a soluble cytosolic enzyme of the aldehyde dehydrogenase superfamily. It oxidizes betaine aldehyde,
  made from choline by the membrane-bound BetA choline dehydrogenase, to the osmoprotectant glycine betaine.
  The purified enzyme is a homotetramer of 55 kDa subunits that is highly specific for betaine aldehyde,
  prefers NAD over NADP, and stays active at the high K+ concentrations found in osmotically stressed
  cells. betB is the middle gene of the betIBA operon, which is induced by osmotic stress and choline.
