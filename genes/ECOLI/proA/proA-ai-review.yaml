suggested_questions:
- question: >-
    Does E. coli ProA form a physiologically stable complex with ProB that
    channels the unstable L-glutamyl 5-phosphate intermediate?
suggested_experiments:
- hypothesis: >-
    ProA and ProB directly associate to transfer L-glutamyl 5-phosphate between
    the glutamate 5-kinase and gamma-glutamyl phosphate reductase active sites.
  description: >-
    Reconstitute purified E. coli ProA and ProB with wild-type and
    interface-disrupting mutants, then combine coupled-enzyme kinetics with
    crosslinking or co-purification assays to test whether physical association
    improves L-glutamyl 5-phosphate transfer from ProB to ProA.
  experiment_type: in vitro biochemistry
