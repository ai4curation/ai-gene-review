- id: PMID:6337636
  title: Proline biosynthesis in Escherichia coli. Kinetic and mechanistic properties of glutamate
    semialdehyde dehydrogenase.
  findings:
  - statement: NADP+- and phosphate-dependent oxidation of glutamate semialdehyde characterizes the
      reverse ProA reaction.
    supporting_text: >-
      The kinetics of the NADP+- and phosphate-dependent oxidation of
      glutamic acid 5-semialdehyde are consistent with a rapid-equilibrium
      random order mechanism.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary kinetics; abstract available. This is consistent with physiological
      NADPH-dependent reduction.
- id: PMID:7034716
  title: Proline biosynthesis in Escherichia coli. Stoichiometry and end-product identification of
    the reaction catalysed by glutamate semialdehyde dehydrogenase.
  findings:
  - statement: Stoichiometry establishes the reversible ProA redox reaction.
    supporting_text: >-
      The stoichiometry of the oxidative phosphorylation of glutamic acid
      5-semialdehyde by gamma-glutamyl phosphate reductase (glutamate
      semialdehyde dehydrogenase) has been established.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary stoichiometry evidence; abstract available.
- id: PMID:7035170
  title: Proline biosynthesis in Escherichia coli. Purification and characterisation of
    glutamate-semialdehyde dehydrogenase.
  findings:
  - statement: Purified E. coli ProA performs the physiological reduction of glutamyl phosphate to
