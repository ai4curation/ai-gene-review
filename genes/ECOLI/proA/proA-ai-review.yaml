id: P07004
gene_symbol: proA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  ProA is the cytosolic NADPH-dependent gamma-glutamyl phosphate reductase of Escherichia coli L-proline
  biosynthesis. It reduces L-glutamyl 5-phosphate to L-glutamate 5-semialdehyde and phosphate; the semialdehyde
  then cyclizes spontaneously to 1-pyrroline-5-carboxylate, which ProC reduces to proline. The homo-oligomeric
  enzyme catalyzes the reversible glutamate-5-semialdehyde/glutamyl-5-phosphate reaction with NADP+/NADPH.
  Sequential catalysis with ProB does not require a stable channeling complex under experimentally tested
  growth conditions.
