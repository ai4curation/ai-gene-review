- id: PMID:39514317
  title: 'Challenging a decades-old paradigm: ProB and ProA do not channel the unstable intermediate in
    proline synthesis after all.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full primary text read. His6-ProA from ASKA was purified in engineered BL21(DE3);
      ProB was expressed as tagged/untagged protomers and the SUMO tag removed. Growth
      complementation used BW25113 derivatives, including heterologous proB replacements or
      overexpressed alternative reductases. Native-locus monomeric-GFP fusions support cytoplasmic
      localization. Failed crosslinking alone is not proof of universal absence; diffusion and GP
      lifetime values are calculations, not direct intracellular measurements.
  findings:
  - statement: E. coli ProA and ProB support sequential proline synthesis without a required
      channeling complex under the tested conditions.
    supporting_text: By changing the structures of either the kinase or the reductase, we show that
      channeling is not required to support proline synthesis in vivo.
  - statement: Native-locus monomeric-GFP ProA and ProB fusions distribute throughout the cytoplasm,
      unlike overexpressed GFP fusion aggregates.
    supporting_text: When we express ProB and ProA tagged with monomeric superfolder GFP (msfGFP)
      from a gene integrated into the native locus, both proteins are dispersed throughout the
      cytoplasm
