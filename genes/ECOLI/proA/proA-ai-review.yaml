- term:
    id: GO:0055129
    label: L-proline biosynthetic process
  evidence_type: IMP
  original_reference_id: PMID:791096
  qualifier: acts_upstream_of_or_within
  review:
    summary: >-
      Genetic isolation of proline-requiring mutants mapped proA to the
      glutamyl gamma-phosphate-to-glutamic gamma-semialdehyde step.
    action: ACCEPT
    reason: >-
      Loss of the proA locus blocked conversion of the ProB product toward the
      ProC substrate, directly supporting a role for ProA in the L-proline
      biosynthetic process.
