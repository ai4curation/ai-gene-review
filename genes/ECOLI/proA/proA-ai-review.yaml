suggested_questions:
- question: Do growth conditions outside those tested in PMID:39514317 produce a specific ProA–ProB
    interaction, despite the evidence that channeling is unnecessary for proline synthesis under the
    tested conditions?
suggested_experiments:
- hypothesis: Environmental or metabolic conditions not tested in PMID:39514317 could produce a
    conditional ProA–ProB association without making channeling obligatory.
  description: Extend native-locus interaction and flux measurements to defined osmotic and nutrient
    perturbations, with monomeric reporter tags, expression controls and diffusion-compatible
    kinetic models. Compare any observed association with the non-channeling glucose-growth
    conditions of PMID:39514317 rather than presuming a constitutive complex.
