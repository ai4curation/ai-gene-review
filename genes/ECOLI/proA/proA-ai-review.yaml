- id: PMID:6319365
  title: Purification and characteristics of a gamma-glutamyl kinase involved in Escherichia coli
    proline biosynthesis.
  findings:
  - statement: Purified E. coli glutamate kinase uses ATP and glutamate in proline biosynthesis.
    supporting_text: >-
      Enzymatic activity of the protein was detectable only in assays
      containing highly purified gamma-glutamyl phosphate reductase, the
      second enzyme of the proline pathway.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract available; the major preparation is a proline-analogue-resistant strain,
