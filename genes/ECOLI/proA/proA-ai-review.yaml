id: P07004
gene_symbol: proA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  ProA is the NADPH-dependent gamma-glutamyl phosphate reductase of the
  cytosolic Escherichia coli L-proline biosynthetic pathway. It reduces the
  ProB product L-glutamate 5-phosphate to L-glutamate 5-semialdehyde, which
  cyclizes to 1-pyrroline-5-carboxylate for subsequent reduction to L-proline
  by ProC. Purified ProA is a homo-oligomeric glutamate-semialdehyde
  dehydrogenase that uses NADPH/NADP+ chemistry specific for the
  P5C/glutamate 5-semialdehyde substrate pair. ProA may functionally couple to
  ProB to receive the unstable L-glutamyl 5-phosphate intermediate, but direct
  physiological substrate channeling remains unresolved.
