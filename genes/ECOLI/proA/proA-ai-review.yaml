- term:
    id: GO:0042802
    label: identical protein binding
  evidence_type: IDA
  original_reference_id: PMID:7035170
  qualifier: enables
  review:
    summary: >-
      Purified E. coli ProA behaves as an oligomer of identical subunits,
      supporting self-association of the enzyme.
    action: ACCEPT
    reason: >-
      Purification supports an enzyme assembled from identical subunits. Retain self-association as a
      feature of the native catalytic architecture; a more specific binding function is not established
      here. This does not imply a ProA-ProB complex or demonstrate that every oligomeric state has equal
      activity.
    supported_by:
    - reference_id: PMID:7035170
      supporting_text: >-
        The protein has a molecular weight of 1.89 X 10(5) and consists of four
        identical subunits of molecular weight 4.7 X 10(4) each.
- term:
    id: GO:0050661
    label: NADP binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR012134
  review:
    summary: >-
      NADPH/NADP+ binding is integral to ProA redox catalysis.
    action: ACCEPT
    reason: >-
      GO:0050661 explicitly includes binding of either NADP+ or NADPH. ProA uses NADPH for biosynthetic
      acyl-phosphate reduction and NADP+ in the reverse reaction, so this binding supports its core chemistry.
      Purified E. coli ProA kinetics directly establish NADP+ dependence.
    supported_by:
    - reference_id: PMID:6337636
      supporting_text: >-
        The Km for DL-pyrroline-5-carboxylic acid is 2.5 mM, for NADP+ is 0.05
        mM and for phosphate is 0.35 mM.
