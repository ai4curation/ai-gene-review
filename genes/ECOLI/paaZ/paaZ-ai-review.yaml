id: P77455
gene_symbol: paaZ
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  PaaZ (formerly MaoC) is the bifunctional ring-opening enzyme of the
  Escherichia coli aerobic phenylacetate catabolic pathway, encoded in its own
  transcription unit divergent from the paaABCDEFGHIJK operon. It fuses an
  N-terminal NADP+-dependent aldehyde dehydrogenase domain to a C-terminal
  MaoC-like (hotdog-fold, (R)-specific enoyl-CoA hydratase-type) domain. The
  C-terminal domain hydrolytically cleaves the seven-membered enol-ether ring of
  oxepin-CoA (formed by PaaG) to the reactive open-chain 3-oxo-5,6-dehydrosuberyl-CoA
  semialdehyde (EC 3.3.2.12), and the N-terminal domain immediately oxidizes this
  aldehyde with NADP+ to 3-oxo-5,6-dehydrosuberyl-CoA (EC 1.2.1.91), which enters
  the beta-oxidation-like steps catalyzed by PaaJ, PaaF and PaaH. The
  semialdehyde is channelled between the two active sites; if it escapes it
  cyclizes to a dead-end tropone-like CoA ester. Cryo-EM structures show a
  trilobed homohexamer built from three domain-swapped dimers, with conserved
  basic residues proposed to pivot the CoA moiety between active sites. In vitro
  the hydratase domain also hydrates crotonyl-CoA. paaZ mutants cannot grow on
  phenylacetate and convert it to 2-hydroxyphenylacetate.
existing_annotations:
- term:
    id: GO:0004300
    label: enoyl-CoA hydratase activity
  evidence_type: IDA
  original_reference_id: PMID:12949091
  qualifier: enables
  review:
    summary: >-
      In vitro crotonyl-CoA hydratase activity of MaoC (= PaaZ); real but with no
      shown physiological use, so over-annotated.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Purified MaoC (PaaZ) hydrates crotonyl-CoA and can feed (R)-3-hydroxyacyl-CoA
      to PHA synthesis in engineered fadB strains. This reflects the
      (R)-specific hydratase chemistry of the C-terminal MaoC domain, but the
      physiological substrate is oxepin-CoA, whose hydration results in ring
      cleavage. The activity is real, but E. coli FadB and FadJ own crotonyl-CoA
      hydration (which is why a fadB-deficient background was needed) and nothing
      shows PaaZ uses it in vivo, so this is a tier-2 promiscuous activity
      (projects/ENZYME_SPECIFICITY.md) marked over-annotated. Note that GO:0004300
      is defined with (3S)-hydroxyacyl-CoA specificity whereas MaoC-type enzymes
      are (R)-specific; no R-specific term exists.
    supported_by:
    - reference_id: PMID:12949091
      supporting_text: Enzymatic analysis of tagged MaoC showed that MaoC has enoyl-CoA
        hydratase activity toward crotonyl-CoA.
