- term:
    id: GO:0016803
    label: ether hydrolase activity
  evidence_type: IDA
  original_reference_id: PMID:21296885
  qualifier: enables
  review:
    summary: Hydrolytic cleavage of the oxepin-CoA enol-ether ring by the C-terminal MaoC-like domain.
    action: ACCEPT
    reason: >-
      Oxepin-CoA hydrolase (EC 3.3.2.12) is classified with the ether
      hydrolases; the reaction adds water across the side-chain double bond and
      breaks the ring C-O (ether) bond. No GO term exists for the specific
      reaction, so GO:0016803 is the most precise available term (a specific
      term is proposed).
    supported_by:
    - reference_id: PMID:21296885
      supporting_text: Here we characterize the hydrolytic oxepin-CoA ring cleavage catalyzed
        by the bifunctional fusion protein PaaZ.
    - reference_id: PMID:20660314
      supporting_text: The proton of the attached hydroxyl group dissociates, thus forming
        a keto group with concomitant ring cleavage between C3 and the ether O atom.
- term:
    id: GO:0016823
    label: hydrolase activity, acting on carbon-carbon bonds, in ketonic substances
  evidence_type: IDA
  original_reference_id: PMID:21296885
  qualifier: enables
  review:
    summary: The hydrolytic ring-opening activity is real, but the bond cleaved is a C-O ether bond, not a C-C bond.
    action: MODIFY
    reason: >-
      Oxepin-CoA ring opening cleaves the bond between C3 and the ring ether
      oxygen; no carbon-carbon bond is hydrolysed (EC 3.3.2.12 is an ether
      hydrolase, not an EC 3.7.1 C-C hydrolase). The essence of the annotation
      (a hydrolytic ring-cleaving activity shown with purified PaaZ) is sound,
      so it is refocused onto GO:0016803 ether hydrolase activity, which the
      gene already carries from the same paper.
    proposed_replacement_terms:
    - id: GO:0016803
      label: ether hydrolase activity
    supported_by:
    - reference_id: PMID:20660314
      supporting_text: The proton of the attached hydroxyl group dissociates, thus forming
        a keto group with concomitant ring cleavage between C3 and the ether O atom.
    source_defects:
    - defect_type: WRONG_TERM
      resource: UNIPROT
      slot: GO_ID
      requested_change: CHECK
      asserted_value: GO:0016823
      corrected_value: GO:0016803
      corrected_label: ether hydrolase activity
      confidence: PROBABLE
      explanation: >-
        PaaZ (P77455) oxepin-CoA hydrolase (EC 3.3.2.12) cleaves the ring C-O
        ether bond of 2-oxepin-2(3H)-ylideneacetyl-CoA; no C-C bond in a ketonic
        substance is hydrolysed. GO:0016803 ether hydrolase activity (already
        annotated by EcoCyc from the same paper) is the appropriate term; the
        GO:0016823 row appears redundant and mis-classified.
