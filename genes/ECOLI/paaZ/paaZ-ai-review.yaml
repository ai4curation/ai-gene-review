proposed_new_terms:
- proposed_name: oxepin-CoA hydrolase activity
  proposed_definition: >-
    Catalysis of the reaction: 2-oxepin-2(3H)-ylideneacetyl-CoA + H2O =
    3-oxo-5,6-dehydrosuberyl-CoA semialdehyde (EC 3.3.2.12; RHEA:31755).
  justification: >-
    Experimentally characterized ring-opening activity of PaaZ with an EC number
    and Rhea reaction but no GO term; currently only the generic ether hydrolase
    parent can be used.
- proposed_name: 3-oxo-5,6-dehydrosuberyl-CoA semialdehyde dehydrogenase (NADP+) activity
  proposed_definition: >-
    Catalysis of the reaction: 3-oxo-5,6-dehydrosuberyl-CoA semialdehyde +
    NADP+ + H2O = 3-oxo-5,6-didehydrosuberyl-CoA + NADPH + 2 H+ (EC 1.2.1.91;
    RHEA:31747).
  justification: >-
    Experimentally characterized activity of the PaaZ ALDH domain (and of
    NAD-dependent PaaN-type orthologs) with EC and Rhea entries but no GO term.
suggested_questions:
- question: >-
    How efficiently is the semialdehyde channelled in vivo, and does leakage to the
    cyclic dead-end CoA ester feed tropolone/tropodithietic-acid-type secondary
    metabolism in other bacteria?
suggested_experiments:
- description: >-
    Quantify the dead-end cyclic CoA ester in E. coli expressing PaaZ variants
    with mutated CoA-pivoting basic residues, to test the electrostatic
    channeling model in vivo.
