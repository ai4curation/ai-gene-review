id: P45532
gene_symbol: tusD
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: TusD is the sulfur-bearing subunit of the cytosolic TusBCD heterohexamer, which mediates
  sulfur transfer during C2 thiolation of tRNA wobble uridine. Sulfur from TusA enters the complex through
  the functionally implicated TusD Cys78 and proceeds through the TusE-dependent terminal reaction with
  MnmA and tRNA.
