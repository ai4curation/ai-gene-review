- term:
    id: GO:0016783
    label: sulfurtransferase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - InterPro:IPR017463
  - UniRule:UR000084195
  review:
    summary: UniRule/InterPro mapping to sulfurtransferase activity.
    action: MODIFY
    reason: TusD carries relay sulfur as a Cys78 persulfide and hands it on, which is what GO:0097163
      sulfur carrier activity ("Covalently binding to sulfur and delivering it to an acceptor molecule")
      describes; the gene already has that term by IDA. GO:0016783 is defined as catalysis of sulfur transfer
      between a donor and an acceptor compound, which overstates TusD as a catalyst acting on separate
      substrates. A lateral correction to the carrier term is proposed.
    proposed_replacement_terms:
    - id: GO:0097163
      label: sulfur carrier activity
    supported_by:
    - reference_id: PMID:16472754
      supporting_text: Since the single Cys acts as a catalytic residue, we proposed that TusBCD mediates
        sulfur relay via a putative persulfide state of the TusD subunit.
