  label: Escherichia coli K-12
description: TusD is the sulfur-carrying subunit of the heterohexameric TusBCD complex, a dimer of TusB-TusC-TusD
  heterotrimers of the DsrEFH-like fold. In the IscS-TusA-TusBCD-TusE-MnmA sulfur relay that forms the
  2-thio group of 5-methylaminomethyl-2-thiouridine (mnm5s2U) at wobble position 34 of tRNA(Lys), tRNA(Glu)
  and tRNA(Gln), TusD accepts persulfide sulfur from TusA on Cys78 and passes it on to TusE. Cys78 is
  the only TusBCD cysteine required for sulfur transfer in vivo.
