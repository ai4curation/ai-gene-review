- id: PMID:10671556
  title: Catalytic sites for 3' and 5' incision of Escherichia coli nucleotide excision repair are both located
    in UvrC.
  findings:
  - statement: The R42A substitution in the N-terminal GIY-YIG region abolishes 3' incision without affecting UvrBC-DNA
      complex formation or 5' incision, placing the 3' catalytic site in UvrC.
    supporting_text: Here we show that the catalytic site for incision on the 3' side is in this protein as well,
      because substitution R42A abolishes 3' incision, whereas formation of the UvrBC-DNA complex and the 5' incision
      reaction are unaffected.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only in cache; matches the UniProt MUTAGEN R42 feature that cites this PMID.
- id: PMID:1387639
  title: Active site of (A)BC excinuclease. I. Evidence for 5' incision by UvrC through a catalytic site involving
    Asp399, Asp438, Asp466, and His538 residues.
  findings:
  - statement: D399, D438, D466 and H538 are required for the 5' incision; mutants retain 3' incision and confer
      extreme UV sensitivity.
    supporting_text: Enzyme reconstituted with these mutant proteins carried out normal 3' incision but was completely
      defective in 5' incision activity.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only; cited by the UniProt MUTAGEN features at these residues.
- id: PMID:12145219
  title: The presence of two UvrB subunits in the UvrAB complex ensures damage detection in both DNA strands.
  findings:
  - statement: UvrC association with the UvrB2 preincision complex releases one UvrB monomer, forming the UvrB-UvrC
      incision complex.
    supporting_text: After association with the UvrC protein, one of the UvrB monomers is released.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Scanning force microscopy study; supports the IDA/IPI complex rows. Abstract-only in cache.
