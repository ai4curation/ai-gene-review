  review:
    summary: UvrC is the catalytic subunit of the UvrABC excinuclease and contains both incision active sites.
    action: ACCEPT
    reason: GO:0009381 (is_a GO:0004520) is defined as hydrolysis of DNA ester bonds flanking the damage bound by
      the Uvr ABC complexes. Both incisions are catalysed by UvrC (R42 in the GIY-YIG half; D399, D438, D466, H538
      in the RNase H-like half), so UvrC is the subunit that executes this activity, with UvrB positioning the lesion.
      This is the most specific correct MF for UvrC.
