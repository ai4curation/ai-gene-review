description: 'UvrC (UvrABC system protein C, excinuclease ABC subunit C) is the nuclease subunit of the bacterial
  UvrABC nucleotide excision repair system. After UvrA and UvrB locate a bulky, helix-distorting lesion and leave
  UvrB bound at the damage, UvrC is recruited through its UVR domain to form the UvrB-UvrC-DNA incision complex
  and makes two incisions in the damaged strand: the N-terminal GIY-YIG nuclease domain cleaves on the 3'' side
  and the C-terminal RNase H-like domain on the 5'' side, releasing a 12-13 nucleotide lesion-containing oligonucleotide
  that UvrD helicase removes before DNA polymerase I and ligase restore the strand. A C-terminal tandem helix-hairpin-helix
  module binds DNA. UvrC acts on the chromosome in the cytoplasm and, unlike uvrA and uvrB, is expressed constitutively
  rather than as part of the SOS response.'
