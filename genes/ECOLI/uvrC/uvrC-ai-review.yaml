      that binds UvrB and the C-terminal (HhH)2 DNA-binding domain.
    supporting_text: UvrC is a dual endonuclease recruited to the UvrB•DNA pre-incision complex to introduce incisions
      on either side of the lesion [23].
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached; Kraithong et al. 2021 review.
