- id: PMID:3295776
  title: Regulation of the Escherichia coli excision repair gene uvrC. Overlap between the uvrC structural gene
    and the region coding for a 24 kD protein.
  findings:
  - statement: Chromosomal uvrC transcription from both mapped promoters is not inducible by UV damage.
    supporting_text: We show that transcription from both promoters on the chromosome is not inducible by UV damage.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Cited in the UniProt record; supports treating SOS response as an over-annotation for uvrC.
- id: PMID:11818552
  title: Cho, a second endonuclease involved in Escherichia coli nucleotide excision repair.
  findings:
  - statement: The SOS-inducible UvrC paralog Cho (ydjQ) makes an alternative 3' incision; UvrC still makes the
      5' incision.
    supporting_text: The genome of E. coli contains an SOS-inducible gene (ydjQ) encoding a protein that is homologous
      to the N-terminal half of UvrC.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Defines the SF10 Cho paralog that seeds the PTN000778007 endonuclease IBD.
- id: PMID:33477956
  title: A Peek Inside the Machines of Bacterial Nucleotide Excision Repair.
  findings:
