suggested_questions:
- question: How do UvrC and Cho partition 3' incision in vivo, and which lesion classes depend on Cho's more distal
    incision site?
- question: Should GO-CAM models of bacterial NER represent UvrC as enabling GO:0009381 excinuclease ABC activity
    (both active sites are in UvrC) or as contributing to a complex-level activity?
suggested_experiments:
- description: Compare survival and incision product spectra of uvrC R42A, uvrC D399A and cho deletion strains after
    treatment with lesions poorly incised by UvrC, to define in vivo division of labour between UvrC and Cho.
