- term:
    id: GO:0043364
    label: glycyl-radical enzyme activating activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN001251485
  - UniProtKB:P0A9N4
  - UniProtKB:P0A9N8
  review:
    summary: >-
      PAINT IBA from PTN001251485 in PTHR30352 (pyruvate formate-lyase-activating enzyme
      family), grounded in E. coli PflA (P0A9N4) and NrdG (P0A9N8). Both have established
      activase activity, on PFL and on the anaerobic RNR respectively. The node asserts only
      the general activity, generation of a glycyl radical on a partner GRE, not a
      particular substrate GRE.
    action: ACCEPT
    reason: >-
      The node placement is sound. Every characterised member of this family is a GRE
      activase, and PflC is inside the clade with no sign of loss: the radical SAM cysteine
      triad and SAM-binding residues are conserved. Genome context fits. pflC overlaps the
      3' end of the GRE gene pflD on the same strand, the arrangement of pflB-pflA and
      nrdD-nrdG (file:ECOLI/pflC/pflC-bioinformatics/RESULTS.md). PflD is a bona fide GRE
      whose radical-dependent C-O lyase activity was demonstrated (PMID:39283600). The term
      does not name a substrate, so it is the right level for PflC. Activase activity of
      PflC itself has not been directly demonstrated, but this inference is as strong as
      sequence and context can make it.
    supported_by:
    - reference_id: file:ECOLI/pflC/pflC-bioinformatics/RESULTS.md
      supporting_text: pflC overlaps the 3' end of pflD by 35 bp
