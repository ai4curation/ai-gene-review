core_functions:
- description: >-
    Predicted activase for the glycyl radical enzyme PflD (1,5-anhydromannitol-6-phosphate
    C-O lyase). PflC would install the glycyl radical on the PflD Gly loop by reductive
    cleavage of S-adenosyl-L-methionine on its radical SAM [4Fe-4S] cluster. Inferred from
    family membership and translational coupling of pflC to pflD, not directly shown.
  molecular_function:
    id: GO:0043364
    label: glycyl-radical enzyme activating activity
  locations:
  - id: GO:0005737
    label: cytoplasm
  supported_by:
  - reference_id: file:ECOLI/pflC/pflC-bioinformatics/RESULTS.md
    supporting_text: pflC overlaps the 3' end of pflD by 35 bp
  - reference_id: PMID:39283600
    supporting_text: YbiW and PflD catalyze ring-opening C-O cleavage of
      1,5-anhydroglucitol-6-phosphate (AG6P) and 1,5-anhydromannitol-6-phosphate
      (AM6P), respectively
knowledge_gaps:
- gap_statement: >-
    It is unknown whether PflC activates PflD in vivo, and whether it is the only
    activase able to do so: YbiY, which serves the PflD paralogue YbiW, could also act
    on PflD, since the two lyases share an identical Gly loop.
  boundary: >-
    PflD is an established glycyl radical C-O lyase of 1,5-anhydromannitol 6-phosphate.
    pflC is translationally coupled to pflD. PflC and YbiY are paralogous activases (37%
    identity), and PflD and YbiW share the Gly-loop heptamer RVAGYSA. PflC has not been
    purified, its cluster content has not been measured, and no deletion phenotype has
    been reported.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: >-
    This decides whether PflD activation in vivo depends on PflC specifically, on YbiY,
    or on redundancy between them, which matters for engineering the anhydroglycolysis
    pathway and for interpreting pflC deletions.
  resolution: >-
    Purify PflC anaerobically, reconstitute its [4Fe-4S] cluster, and assay
    SAM-dependent glycyl-radical installation on PflD by EPR and activity. Test pflC and
    ybiY single and double deletions for anaerobic growth on 1,5-anhydromannitol and
    1,5-anhydroglucitol.
  provenance:
  - reference_id: file:ECOLI/pflC/pflC-bioinformatics/RESULTS.md
    supporting_text: PflD and YbiW share one Gly-loop heptamer, RVAGYSA
suggested_questions:
- question: >-
    Which activase installed the glycyl radical on PflD in the anhydroglycolysis study
    (PMID:39283600): PflC, YbiY, or a non-native activase? The low in vitro radical
    loading (0.06 per monomer) may reflect use of a non-cognate activase.
- question: >-
    Can PflC and YbiY cross-activate PflD and YbiW, given that the two lyases share the
    Gly-loop heptamer RVAGYSA?
suggested_experiments:
- hypothesis: PflC is the cognate activase of PflD and installs its glycyl radical.
  description: >-
    Co-express or mix anaerobically reconstituted PflC with PflD plus SAM, reduced
    flavodoxin and a reductant. Detect the PflD glycyl radical by EPR and assay
    1,5-anhydromannitol-6-phosphate C-O lyase activity, comparing PflC, YbiY and PflA as
    the activase.
  experiment_type: in vitro enzymology
- hypothesis: PflC is required for anaerobic growth on 1,5-anhydromannitol.
  description: >-
    Construct pflC, ybiY and pflC ybiY deletions and test anaerobic growth on
    1,5-anhydromannitol and 1,5-anhydroglucitol as sole carbon source.
  experiment_type: genetic
