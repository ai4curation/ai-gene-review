- term:
    id: GO:0043365
    label: '[formate-C-acetyltransferase]-activating enzyme activity'
  evidence_type: IEA
  original_reference_id: GO_REF:0000003
  qualifier: enables
  supporting_entities:
  - EC:1.97.1.4
  review:
    summary: >-
      EC-to-GO mapping from UniProt's EC 1.97.1.4 on this entry. That EC rests on the
      historical name "pyruvate formate-lyase 2" for the partner GRE PflD, and the
      function line is by similarity only (ECO:0000250). GO:0043365 is the PFL-specific
      child of GO:0043364; its definition names [formate C-acetyltransferase]-glycine as
      the substrate.
    action: REMOVE
    reason: >-
      Wrong substrate: this is a demonstrably incorrect EC/IEA mapping. The partner GRE
      PflD is a C-O lyase of 1,5-anhydromannitol 6-phosphate, not a formate
      C-acetyltransferase (PMID:39283600); its Gly loop (RVAGYSA) differs from the PFL/TdcE
      loop (RVSGYAV), and activase specificity follows the Gly-loop sequence (PMID:42361324;
      file:ECOLI/pflC/pflC-bioinformatics/RESULTS.md). No experiment shows PflC activating
      PFL, and PFL is served by PflA. Aligned with the pflA/nrdG reviews (GO:0043365 is
      correct only when the substrate is PflB): the PflB-specific child is removed here, and
      the correct general activase activity GO:0043364 is retained on the IBA and Rhea rows.
    supported_by:
    - reference_id: PMID:39283600
      supporting_text: The model bacterium Escherichia coli MG1655 contains two GREs of
        unknown function, YbiW and PflD
    - reference_id: PMID:42361324
      supporting_text: These results suggest that GRE-AE specificity for its partner GRE
        is dependent upon Gly loop sequence.
    - reference_id: file:ECOLI/pflC/pflC-bioinformatics/RESULTS.md
      supporting_text: PflD and YbiW share one Gly-loop heptamer, RVAGYSA, which differs
        from the PFL/TdcE loop (RVSGYAV) at three of seven positions.
    - reference_id: file:ECOLI/pflC/pflC-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: 'FUNCTION: Activation of pyruvate formate-lyase 2 under anaerobic
        conditions by generation of an organic free radical'
    source_defects:
    - defect_type: WRONG_TERM
      resource: UNIPROT
      record: UniProtKB:P32675
      slot: DE
      requested_change: DELETE_VALUE
      asserted_value: EC:1.97.1.4
      cause: LEGACY_ALIAS
      confidence: PROBABLE
      explanation: >-
        UniProtKB P32675 (PflC) carries EC 1.97.1.4,
        [formate-C-acetyltransferase]-activating enzyme, which propagates into GOA as the
        PFL-specific GO:0043365 through the EC-to-GO mapping (GO_REF:0000003). The EC
        number rests on the legacy name "pyruvate formate-lyase 2" for the partner enzyme
        PflD (P32674), which Ma et al. 2024 (PMID:39283600) show is a C-O lyase acting on
        1,5-anhydromannitol 6-phosphate rather than a formate C-acetyltransferase. No
        experiment places PflC on pyruvate formate-lyase, which is activated by PflA.
        Since PflC's activase activity has not been demonstrated on any substrate, we ask
        that the substrate-specific EC number be removed rather than replaced; the
        generic EC 1.97.1.- would fit the evidence. The same applies to UniProtKB P75794
        (YbiY), whose partner YbiW is the corresponding anhydroglucitol-phosphate lyase.
      supported_by:
      - reference_id: file:ECOLI/pflC/pflC-uniprot.txt
        supporting_text: EC=1.97.1.4
      - reference_id: PMID:39283600
        supporting_text: The model bacterium Escherichia coli MG1655 contains two GREs of
          unknown function, YbiW and PflD
