id: P32675
gene_symbol: pflC
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  PflC (YijM) is a cytoplasmic radical S-adenosyl-L-methionine (SAM) enzyme of the
  glycyl-radical-enzyme activase family, a paralogue of the pyruvate formate-lyase
  activating enzyme PflA. Besides the radical SAM domain with its CX3CX2C [4Fe-4S]
  cluster-binding motif, it has one ferredoxin-like domain that is absent from PflA.
  pflC is encoded directly downstream of, and overlapping, pflD in the frw gene cluster.
  PflD is a glycyl radical enzyme long called "pyruvate formate-lyase 2", but it
  catalyses ring-opening C-O cleavage of 1,5-anhydromannitol 6-phosphate to
  1-deoxyfructose 6-phosphate, the first step of an anaerobic "anhydroglycolysis"
  pathway. By analogy with PflA and the other members of its family, PflC is expected to
  install the glycyl radical on PflD, by reductive cleavage of SAM to a 5'-deoxyadenosyl
  radical that abstracts a hydrogen atom from the PflD Gly-loop glycine. PflC and its
  paralogue YbiY are each paired with one of the two paralogous anhydrohexitol-phosphate
  lyases, PflD and YbiW, which share a Gly-loop sequence distinct from that of pyruvate
  formate-lyase. No activity of PflC itself has yet been demonstrated, and there is no
  evidence that it activates pyruvate formate-lyase.
