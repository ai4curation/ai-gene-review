- id: PMID:2407723
  title: Analysis of the Escherichia coli gene encoding L-asparaginase II, ansB, and its regulation by
    cyclic AMP receptor and FNR proteins.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cache is abstract-only or bibliographic; exact access limitations are retained in the
      annotation reasons. PMID:1821783 directly recovers active recombinant AnsB by osmotic shock from
      the periplasm; PMID:2407723 confirms the 22-residue signal peptide and cAMP/FNR regulation. PMID:25309524
      demonstrates refolding into active tetramers, independently supporting the assembly/binding claims
      also annotated from complexomics and mutant structures. Periplasm is bounded by the bacterial outer
      membrane, not a fungal cell wall. No native anticancer BP is inferred from clinical use.
  findings: []
