  label: Escherichia coli K-12
description: AnsB is the periplasmic L-asparaginase II of Escherichia coli. After export and signal-peptide
  cleavage, the enzyme assembles into a homotetramer that hydrolyzes L-asparagine to L-aspartate and ammonium.
  Its expression is responsive to cAMP and oxygen availability.
