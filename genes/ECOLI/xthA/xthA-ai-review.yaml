taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: xthA encodes exonuclease III, the major apurinic/apyrimidinic (AP) endonuclease of Escherichia
  coli and the founding member of the exonuclease III/APE1 family of DNA repair nucleases. This Mg2+-dependent
  enzyme incises the DNA backbone 5' to abasic sites, removes 3'-blocking groups such as 3'-phosphoglycolates
  and 3'-phosphates left by oxidative damage, and has double-stranded DNA 3'-5' exonuclease and RNase
  H activities. It thereby primes repair synthesis by DNA polymerase I in base-excision repair, and xth
  mutants are hypersensitive to hydrogen peroxide. It is a soluble cytosolic monomer.
