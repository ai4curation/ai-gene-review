suggested_questions:
- question: >-
    The GO:0046933 and GO:0045259 IBDs are placed at PTN008558586, a duplication
    node whose children are the F1-beta clade (PTN008558588) and the bacterial
    FliI/SctN type III ATPase clade (PTN000390097; PTHR15184:SF9, SF62, SF81).
    All seeds are F1-beta proteins. Should the IBDs move down to PTN008558588,
    or should a NOT be placed at PTN000390097, so that ATP synthase terms stop
    propagating to FliI and SctN?
- question: >-
    Should UniProt rename P52612 from "Flagellum-specific ATP synthase"
    (EC 7.1.2.2, H+-transporting) to "Flagellum-specific ATPase / flagellar
    export ATPase FliI" with EC 7.4.2.8? Should it also drop the "proton
    translocase involved in local circuits" clause from the FUNCTION comment?
- question: >-
    Do E. coli K-12 FliI kinetics, FliH regulation and FliJ-dependent
    hexamerization match the Salmonella ortholog? No direct enzymology exists
    for P52612.
suggested_experiments:
- description: >-
    Purify P52612 and measure Mg2+-dependent ATPase kinetics, sensitivity to
    F-type ATPase inhibitors (azide, DCCD, efrapeptin), stimulation by
    phospholipids, and hexamer formation with E. coli FliJ and FliH.
  experiment_type: biochemistry
- description: >-
    Complement a clean E. coli K-12 fliI deletion with Walker-A and
    catalytic-glutamate mutants, and measure hook and flagellin export and
    swimming motility.
  experiment_type: genetic complementation
