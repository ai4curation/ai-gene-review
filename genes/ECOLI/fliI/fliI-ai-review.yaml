  review:
    summary: >-
      PAINT placed the IBD for this term at PTN008558586. Every seed is an
      F1-ATP synthase beta subunit (E. coli AtpD, human ATP5F1B, yeast ATP2,
      S. pombe atp2, and plant, rat and bovine F1 subunits). PTN008558586 is a
      duplication node. One child (PTN008558588) is the F1-beta clade. The other
      child (PTN000390097) is the bacterial FliI/SctN type III ATPase clade
      (PTHR15184 subfamilies SF9, SF62 and SF81), which includes P52612 (SF81).
      The IBD therefore sits one node too deep and covers a paralog clade in
      which no member has shown ATP synthase activity or membership of an Fo-F1
      complex. FliI forms a separate FliH12-FliI6-FliJ1 ATPase ring on the
      flagellar export apparatus.
    action: REMOVE
    reason: >-
      Paralog over-propagation from a misplaced IBD. P52612 is outside the
      F1-beta clade that carries the function. The Salmonella ortholog is
      structurally related to F1 alpha/beta but is part of the flagellar export
      apparatus, not an ATP synthase. The IBD should move to PTN008558588, or
      a NOT/IRD should be placed at PTN000390097.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - WRONG_ORTHOLOG_OR_PARALOG
      - COMPARTMENT_OR_COMPLEX_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN008558586
        source_label: PTN008558586
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Duplication node spanning the F1-beta clade (PTN008558588) and the
          FliI/SctN type III ATPase clade (PTN000390097); all seeds are F1-beta subunits.
    supported_by:
    - reference_id: PMID:17202259
      supporting_text: FliI consists of three domains, and the whole structure shows
        extensive similarities to the alpha and beta subunits of F0F1-ATPsynthase
    - reference_id: PMID:31337100
      supporting_text: FliH, FliI and FliJ form the cytoplasmic ATPase ring complex
        with a 12 FliH to 6 FliI to 1 FliJ stoichiometry
- term:
    id: GO:0046933
    label: proton-transporting ATP synthase activity, rotational mechanism
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: contributes_to
  supporting_entities:
  - PANTHER:PTN008558586
  - PomBase:SPAC222.12c
  - SGD:S000003882
  - UniProtKB:P06576
  - UniProtKB:P0ABB4
  review:
    summary: >-
      The IBD at PTN008558586 is seeded only by F1-beta subunits (E. coli AtpD,
      human ATP5F1B, yeast ATP2, S. pombe atp2). It is placed at a duplication
      node that also contains the FliI/SctN clade (PTN000390097; SF9, SF62,
      SF81), where P52612 sits. FliJ resembles the gamma stalk, and a rotary
      mechanism has been proposed for the FliI6-FliJ ring. But that ring
      hydrolyzes ATP to drive protein export and has no coupled proton channel.
      The proton flux of flagellar export runs through the export gate, a
      proton-protein antiporter in which FlhA has ion-channel activity. It does
      not run through FliI.
    action: REMOVE
    reason: >-
      Contradicted by the biology. FliI does not synthesize ATP or transport
      protons, and the ortholog ATPase is insensitive to F-type ATPase
      inhibitors. The target lies in a paralog clade outside the F1-beta clade
      whose seeds carry the function, so this is a node-placement error.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - WRONG_ORTHOLOG_OR_PARALOG
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: PANTHER:PTN008558586
        source_label: PTN008558586
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Duplication node spanning the F1-beta clade (PTN008558588) and the
          FliI/SctN type III ATPase clade (PTN000390097); all seeds are F1-beta subunits.
    supported_by:
    - reference_id: PMID:8943245
      supporting_text: The activity was not affected by inhibitors of the F-, V- or
        P-type ATPases
    - reference_id: PMID:21934659
      supporting_text: the export gate complex by itself is a proton-protein antiporter
    - reference_id: PMID:29946050
      supporting_text: FlhA has an ion channel activity, and the FlhA-FliJ interaction
        enables effective utilization of PMF for protein export
    - reference_id: PMID:21278755
      supporting_text: FliJ promotes the formation of FliI hexamer rings by binding
        to the center of the ring
