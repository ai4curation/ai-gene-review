  findings:
  - statement: >-
      In vitro, ATP hydrolysis by FliI can drive export without bulk PMF. FlhA
      has ion-channel activity.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Ortholog (Salmonella); full text in the cache.
