  title: 'Intrinsic membrane targeting of the flagellar export ATPase FliI: interaction
    with acidic phospholipids and FliH.'
  findings:
  - statement: >-
      Salmonella FliI and FliH are peripheral inner membrane proteins. They
      form a FliH2-FliI heterotrimer, FliH down-regulates the ATPase, and
      acidic phospholipids stimulate it.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Ortholog (Salmonella).
- id: PMID:12787361
  title: Oligomerization and activation of the FliI ATPase central to bacterial flagellum
    assembly.
  findings:
  - statement: >-
      Salmonella FliI forms ATP-promoted hexameric rings, and its ATPase
      activity is cooperative.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Ortholog (Salmonella FliI, Hughes lab). E. coli phospholipids were used
      only as a reagent.
- id: PMID:17202259
  title: Structural similarity between the flagellar type III ATPase FliI and F1-ATPase
    subunits.
  findings:
  - statement: >-
      The FliI crystal structure resembles F1 alpha/beta, which explains the
      homology-based ATP synthase labels.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Ortholog (Salmonella) structure.
- id: PMID:21278755
  title: Common architecture of the flagellar type III protein export apparatus and
    F- and V-type ATPases.
  findings:
  - statement: >-
      FliJ is gamma-like and binds the centre of the FliI hexamer ring.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Ortholog (Salmonella). It shows a rotary-like architecture but no proton
      transport by FliI.
- id: PMID:18216858
  title: Distinct roles of the FliI ATPase and proton motive force in bacterial flagellar
    protein export.
  findings:
  - statement: >-
      ATP hydrolysis by FliI releases the FliH-FliI escort. The PMF drives
      translocation.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Ortholog (Salmonella); abstract only in the cache.
- id: PMID:18216859
  title: Energy source of flagellar type III secretion.
  findings:
  - statement: >-
      The flagellar secretion apparatus is a proton-driven protein exporter.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Ortholog (Salmonella); abstract only in the cache.
- id: PMID:21934659
  title: An energy transduction mechanism used in bacterial flagellar type III protein
    export.
  findings:
  - statement: >-
      The export gate complex is a proton-protein antiporter.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Ortholog (Salmonella). Places proton flux in the gate, not in FliI.
- id: PMID:29946050
  title: In Vitro Reconstitution of Functional Type III Protein Export and Insights
