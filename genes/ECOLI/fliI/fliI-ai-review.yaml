id: P52612
gene_symbol: fliI
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  FliI (b1941) is the soluble ATPase of the flagellar type III protein export
  apparatus of Escherichia coli. It is a Walker-type P-loop ATPase that is
  structurally related to the F1-ATP synthase alpha/beta subunits. Most of what
  is known about its mechanism comes from the nearly identical Salmonella
  ortholog. In the cytoplasm FliI forms a FliH2-FliI carrier complex that binds
  flagellar export substrates and chaperone-substrate complexes. At the
  cytoplasmic face of the basal body, six FliI subunits form a ring around the
  gamma-like stalk protein FliJ, and FliH tethers this ring to the C-ring protein
  FliN and the export gate protein FlhA. ATP hydrolysis by FliI delivers the
  axial flagellar proteins (rod, hook, junction, cap and filament subunits) to
  the gate, releases the escort complex, and switches the membrane export gate
  (FlhA, FlhB, FliP, FliQ, FliR) into an efficient proton-motive-force-driven
  protein exporter. Protein translocation itself is powered mainly by proton
  flux through the export gate, not through FliI. FliI self-associates, and
  E. coli FliI-FliI interactions have been detected in yeast two-hybrid screens.
  FliI does not synthesize ATP or conduct protons. The UniProt name
  "Flagellum-specific ATP synthase" and EC 7.1.2.2 reflect its homology to F1
  subunits rather than its function.
