    ATP-hydrolyzing component of the flagellar type III protein export
    apparatus that delivers substrates and activates the export gate. With FliH
    and FliJ it works at the cytoplasmic face of the basal body to export axial
    flagellar subunits during flagellum assembly. The mechanism is inferred from
    the Salmonella ortholog.
