- term: &id016
    id: GO:0005543
    label: phospholipid binding
  evidence_type: IDA
  original_reference_id: PMID:19414018
  qualifier: enables
  review:
    summary: FtsY binds anionic phospholipids through two amphipathic helices (helix 1, the first 14 residues,
      and helix 2 at the A/N-domain interface), giving a peripheral membrane contact as stable as a transmembrane
      anchor.
    action: NEW
    reason: Direct binding is demonstrated by site-directed cross-linking and binding assays (PMID:19414018),
      by phosphatidylethanolamine-dependent membrane assembly (PMID:11353766), and by a lipid-density-triggered
      coil-helix switch of the membrane-targeting sequence (PMID:21543314); UniProt curates two lipid-binding
      sites. GO:0005543 (binding to a phospholipid) is chosen over GO:1901611 phosphatidylglycerol binding
      because the evidence covers both PG and PE. GOA lacks any lipid-binding term for FtsY.
    supported_by:
