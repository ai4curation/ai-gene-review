id: P0AC28
gene_symbol: ygfA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  ygfA (b2912) encodes the 5-formyltetrahydrofolate cyclo-ligase (5-FCL,
  methenyltetrahydrofolate synthetase) of Escherichia coli, a small soluble
  cytoplasmic enzyme of 182 residues. It catalyses the ATP-dependent, effectively
  irreversible cyclization of 5-formyl-tetrahydrofolate (5-CHO-THF, folinic acid)
  to 5,10-methenyl-tetrahydrofolate. 5-CHO-THF arises from a side reaction of
  serine hydroxymethyltransferase, is not a one-carbon donor and inhibits several
  folate-dependent enzymes, so YgfA returns this dead-end folate to the active
  one-carbon pool. ygfA deletion mutants accumulate 5-CHO-THF and grow poorly when
  glycine is the sole nitrogen source, a defect attributed to inhibition of serine
  hydroxymethyltransferase and the glycine cleavage system. The gene lies
  downstream of, and is co-transcribed with, the 6S RNA gene ssrS; deletion also
  lowers the level of antibiotic-tolerant persister cells.
