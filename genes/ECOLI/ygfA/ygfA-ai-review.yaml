- term:
    id: GO:0022611
    label: dormancy process
  evidence_type: IMP
  original_reference_id: PMID:18519731
  qualifier: acts_upstream_of_or_within
  review:
    summary: >-
      Knockout-library screen: ygfA deletion lowered the ofloxacin-tolerant
      persister fraction, and overexpression increased tolerance.
    action: KEEP_AS_NON_CORE
    reason: >-
      The phenotype is experimental and the acts_upstream_of_or_within qualifier
      already marks it as indirect. The proposed mechanism (depletion of folate
      pools) is speculative, and persistence is downstream of, not part of, the
      enzyme's folate salvage function, so it is kept as non-core.
    supported_by:
    - reference_id: PMID:18519731
      supporting_text: the overexpression of both genes produced increased tolerance
