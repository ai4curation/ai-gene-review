  review:
    summary: SsuABC uptake supplies organosulfur compounds for cellular sulfur metabolism.
    action: ACCEPT
    reason: The original operon-deletion phenotype in PMID:10506196 is complemented by the component-resolved
      uptake genetics in PMID:10781534. ssuC performs the membrane translocation pathway in the sulfur-scavenging
      system, rather than merely being consumed by it. Retain the informative pathway-level sulfur-metabolism
      claim; uptake does not itself establish a bond-cleaving catabolic activity for this subunit.
    supported_by:
    - &id003
      reference_id: file:publications/url_https___pmc.ncbi.nlm.nih.gov_articles_PMC101965_.md
      supporting_text: Based on the results from growth experiments and on sequence data, we postulate
        that TauABC and SsuABC form two distinct ABC transporters for uptake of alkanesulfonates.
    - reference_id: file:publications/url_https___pmc.ncbi.nlm.nih.gov_articles_PMC101965_.md
      supporting_text: As documented by the mechanisms regulating gene expression in these systems, they
        both are involved in scavenging sulfur for growth.
