id: P75851
gene_symbol: ssuC
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: SsuC is the multipass inner-membrane permease component of the Escherichia coli SsuABC alkanesulfonate
  importer. It provides the transmembrane pathway in conjunction with the SsuB ATP-binding component and
  periplasmic SsuA substrate-binding protein. The system imports a range of aliphatic sulfonates for sulfur
  scavenging during sulfate limitation and is functionally distinct from the TauABC taurine transporter.
