      supporting_text: NDH-1 shuttles electrons from NADH, via FMN and iron-sulfur
        (Fe-S) centers, to quinones in the respiratory chain.
    - reference_id: file:ECOLI/nuoF/nuoF-uniprot.txt
      supporting_text: Belongs to the complex I 51 kDa subunit family.
- term:
    id: GO:0009060
    label: aerobic respiration
  evidence_type: IMP
  original_reference_id: PMID:9495756
  qualifier: involved_in
  review:
    summary: >-
      nuo mutants, including a nuoF insertion, were complex I deficient and unable
      to use acetate effectively as sole carbon source or grow rapidly in tryptone
      broth beyond mid-exponential phase.
    action: ACCEPT
    reason: >-
      The full text shows that every nuo mutation tested, including
      nuoF::miniTn10Cm, abolishes complex I and impairs aerobic growth on acetate,
      a non-fermentable substrate that requires respiration; NDH-1 is a primary
      NADH dehydrogenase of the aerobic respiratory chain. NuoF does part of the
      work (it oxidises the NADH whose electrons enter the chain). The insertion is
      polar on downstream nuo genes, so the phenotype reflects loss of the complex,
      which is acceptable for a subunit-level process annotation.
    supported_by:
    - reference_id: PMID:9495756
      supporting_text: a mutation in any one of the nuo genes tested causes a complex
        I deficiency
    - reference_id: PMID:9495756
      supporting_text: to use acetate effectively as a sole carbon source
