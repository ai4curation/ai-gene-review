  findings: []
core_functions:
- description: >-
    NADH-oxidising flavoprotein subunit of NDH-1: binds NADH and FMN, accepts a
    hydride from NADH on the flavin and passes electrons via its [4Fe-4S] cluster N3
    into the peripheral-arm iron-sulfur wire, providing the entry step of
    proton-translocating NADH:quinone oxidoreduction by complex I at the cytoplasmic
    membrane.
  molecular_function:
    id: GO:0003954
    label: NADH dehydrogenase activity
  contributes_to_molecular_function:
    id: GO:0008137
    label: NADH dehydrogenase (ubiquinone) activity
  directly_involved_in:
  - id: GO:0022904
    label: respiratory electron transport chain
  locations:
  - id: GO:0005886
    label: plasma membrane
  in_complex:
    id: GO:0045271
    label: respiratory chain complex I
  supported_by:
  - reference_id: PMID:19061856
    supporting_text: Replacement of glutamate 95 for glutamine in the NADH- and
      FMN-binding NuoF subunit of E. coli Complex I decreased NADH oxidation activity
      2.5-4.8 times
  - reference_id: PMID:15922336
    supporting_text: we identified that cluster N3 is ligated to the
      351Cx2Cx2Cx40C398 motif
  - reference_id: PMID:18316732
    supporting_text: two electrons move via the FMN cofactor to the iron
suggested_questions:
- question: >-
    How much of the superoxide and hydrogen peroxide produced by E. coli NDH-1
    arises from the reduced NuoF flavin versus downstream sites, and does the
    menaquinone-reducing (anaerobic) mode change the flavin redox poise?
- question: >-
    Does NuoF discriminate NADH from NADPH and deamino-NADH by the same residues as
    the mitochondrial 51 kDa subunit, and how does this compare with its hydrogenase
    homologues (HoxF, HndC) that reduce NAD+ or NADP+?
suggested_experiments:
- description: >-
    Stopped-flow and EPR comparison of wild-type and Glu95 or glycine-loop NuoF
    variants in purified complex I to separate effects on hydride transfer, NAD+
    release and N3 reduction.
  experiment_type: biochemical
- description: >-
    Measure H2O2/superoxide production of membranes from strains carrying NuoF
    flavin-site variants under aerobic and fumarate-respiring conditions to assess
    the flavin's contribution to ROS in vivo.
  experiment_type: physiological
