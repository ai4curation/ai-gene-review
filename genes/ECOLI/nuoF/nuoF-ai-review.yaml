id: P31979
gene_symbol: nuoF
product_type: PROTEIN
status: INITIALIZED
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  NuoF is the 445-residue NADH-oxidising flavoprotein of the proton-pumping
  NADH:quinone oxidoreductase NDH-1 (respiratory complex I), orthologous to the
  mitochondrial 51 kDa subunit NDUFV1 and Thermus/Paracoccus Nqo1. It carries the
  NADH-binding site (a Rossmann-type glycine-rich nucleotide loop), one
  non-covalently bound FMN, and one [4Fe-4S] cluster (N3) ligated by
  Cys351/354/357/398. NADH transfers a hydride to the FMN, which then passes
  electrons one at a time to N3 and on down the iron-sulfur wire of the peripheral
  arm to the quinone-binding site, where quinone reduction drives proton pumping by
  the membrane arm; the flavin also passes electrons to the side cluster N1a on
  NuoE. An invariant glutamate (Glu95) near the nucleotide site tunes the FMN
  midpoint potential and speeds NAD+ release. With NuoE and NuoG, NuoF forms the
  soluble NADH dehydrogenase fragment (N module) at the tip of the peripheral arm,
  which is attached to the cytoplasmic face of the inner membrane through the
  rest of the complex. NuoF is thus the electron-entry subunit of NDH-1, which
  feeds NADH-derived electrons to ubiquinone or menaquinone and is needed for
  efficient aerobic growth on non-fermentable substrates such as acetate.
existing_annotations:
- term:
    id: GO:0003954
    label: NADH dehydrogenase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: contributes_to
  supporting_entities:
  - PANTHER:PTN000207323
  - UniProtKB:P31979
  review:
    summary: >-
      PAINT assertion of NADH dehydrogenase activity at the bacterial node
      PTN000207323, seeded by E. coli NuoF itself.
    action: ACCEPT
    reason: >-
      NuoF is the subunit that performs the NADH-oxidation half-reaction: it binds
      NADH and FMN, and replacing its Glu95 changes both NADH oxidation kinetics and
      the FMN midpoint potential. GO:0003954 (acceptor unspecified) is exactly the
      chemistry attributable to this subunit, as opposed to the quinone-reducing,
      proton-pumping reaction of the whole complex (GO:0008137). This is the core
      molecular function of NuoF. The single seed being the target itself is the
      expected shape when the target carries its own experimental annotation, not
      circularity.
    supported_by:
    - reference_id: PMID:19061856
      supporting_text: Replacement of glutamate 95 for glutamine in the NADH- and
        FMN-binding NuoF subunit of E. coli Complex I decreased NADH oxidation
        activity 2.5-4.8 times
    - reference_id: PMID:15922336
      supporting_text: The NuoF subunit, which harbors NADH-binding site, of
        Escherichia coli NADH-quinone oxidoreductase (NDH-1)
- term:
    id: GO:0003954
    label: NADH dehydrogenase activity
  evidence_type: IDA
  original_reference_id: PMID:3122832
  qualifier: contributes_to
  review:
    summary: >-
      Membrane NADH and deamino-NADH oxidoreductase activities in E. coli that
      distinguished the proton-translocating NADH dehydrogenase I (NDH-1) from the
      non-electrogenic NDH-2.
    action: ACCEPT
    reason: >-
      NADH dh I in this paper is NDH-1, whose NADH-oxidising site is on NuoF. The
      membrane-level activity measurement supports the term for the NuoF-containing
      enzyme; the subunit attribution is the curator's (abstract-only cache) and is
      consistent with the structural and mutational evidence placing the NADH site
      on NuoF.
    supported_by:
    - reference_id: PMID:3122832
      supporting_text: an enzyme (NADH dh I) that reacts with deamino-NADH or NADH
        whose turnover leads to generation of a H+ electrochemical gradient at a site
        between the primary dehydrogenase and ubiquinone
