- term:
    id: GO:0008137
    label: NADH dehydrogenase (ubiquinone) activity
  evidence_type: IDA
  original_reference_id: PMID:10587449
  qualifier: contributes_to
  review:
    summary: >-
      Purified overproduced complex I catalyses inhibitor-sensitive NADH:ubiquinone
      oxidoreduction.
    action: ACCEPT
    reason: >-
      The proton-translocating NADH:ubiquinone reaction belongs to the assembled
      complex; NuoF contributes the NADH-oxidising step and is required for activity
      (PMID:22063474). contributes_to is the right relationship. In E. coli both
      ubiquinone-8 and menaquinone-8 serve as acceptors physiologically.
    supported_by:
    - reference_id: PMID:10587449
      supporting_text: The preparation comprises all subunits and known cofactors and
        exhibits a high enzymatic activity and inhibitor sensitivity.
    - reference_id: PMID:22063474
      supporting_text: Each disruption resulted in the loss of complex I-mediated
        activity and the failure to extract a structurally intact complex.
- term:
    id: GO:0008137
    label: NADH dehydrogenase (ubiquinone) activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR001949
  review:
    summary: >-
      InterPro2GO mapping from the complex I 51 kDa subunit signature (IPR001949) to
      the complex-level NADH:ubiquinone activity.
    action: ACCEPT
    reason: >-
      The term is correct for the complex NuoF belongs to and agrees with the
      accepted IDA row for the same term; NuoF's contribution is the NADH-oxidation
      half-reaction, while quinone reduction and proton pumping need the rest of the
      complex, so the claim should be read as a contribution (the subunit-specific
      activity is GO:0003954). The signature is diagnostic of the complex I 51 kDa
      subunit family, which in E. coli is the NDH-1 subunit.
    supported_by:
