- term:
    id: GO:1902600
    label: proton transmembrane transport
  evidence_type: IEA
  original_reference_id: GO_REF:0000108
  qualifier: involved_in
  supporting_entities:
  - GO:0008137
  review:
    summary: >-
      Logical inference from GO:0008137 (a proton-translocating activity) to proton
      transmembrane transport.
    action: KEEP_AS_NON_CORE
    reason: >-
      Protons are moved by the membrane arm, not by NuoF, which has no
      transmembrane segment. NuoF nevertheless supplies the input of the coupled
      reaction (the NADH-derived electrons whose transfer to quinone drives
      pumping), so as a subunit of the redox-driven proton pump it is involved in
      the process in a peripheral, energy-supplying role rather than as a
      translocating element. Kept, but not core.
    supported_by:
    - reference_id: file:ECOLI/nuoF/nuoF-uniprot.txt
      supporting_text: Couples the redox reaction to proton translocation (for every
        two electrons transferred, four hydrogen ions are translocated across the
        cytoplasmic membrane), and thus conserves the redox energy in a proton
        gradient.
