    label: porphyrin-containing compound biosynthetic process
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000358281
  - UniProtKB:P54304
  - UniProtKB:P73245
  - UniProtKB:P74132
  - UniProtKB:P77915
  review:
    summary: >-
      Phylogenetic inference that HemN takes part in porphyrin biosynthesis. For E. coli
      HemN this is directly true: it catalyses the coproporphyrinogen III to
      protoporphyrinogen IX step of heme biosynthesis (PMID:14633981; PMID:15967800). The
      node PTN000358281 also spans the HemW subfamily, for which this process is wrong
      (see genes/ECOLI/hemW and genes/human/RSAD1), but HemN sits in the catalytic clade,
      so the transfer to this target is sound.
    action: MODIFY
    reason: >-
      Correct but general. In E. coli the protoporphyrinogen IX that HemN makes is used to
      make protoheme (heme b, and from it hemes o and d); siroheme branches off earlier at
      uroporphyrinogen III and does not pass through this step. The specific endpoint is
      GO:0006785 heme B biosynthetic process, an is_a descendant of GO:0006779 via heme
      biosynthetic process; this matches the refinement made for P. putida HemN
      (genes/PSEPK/hemN). The term for the step itself, protoporphyrinogen IX
      biosynthetic process (GO:0006782), is obsolete.
    proposed_replacement_terms:
    - id: GO:0006785
      label: heme B biosynthetic process
    supported_by:
    - reference_id: PMID:14633981
      supporting_text: HemN catalyzes the essential conversion of coproporphyrinogen III to
        protoporphyrinogen IX during heme biosynthesis
    - reference_id: file:ECOLI/hemN/hemN-uniprot.txt
      record_section: ["CC:PATHWAY"]
      supporting_text: 'protoporphyrin-IX biosynthesis; protoporphyrinogen-IX from coproporphyrinogen-III
        (AdoMet route): step 1/1.'
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - GRANULARITY_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN000358281
        source_status: SUPPORTS_TRANSFER
        comment: >-
          For HemN the node's biosynthetic claim is right: the donors are HemN-type
          coproporphyrinogen dehydrogenases, and E. coli HemN is itself one. A node this
          deep can only state the general porphyrin-biosynthesis parent, so the row is
          refined to the heme B endpoint rather than removed. The same node is placed too
          deep for the HemW subfamily, which descends from it but lacks the activity.
