taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  HemN (also called CgdH) is the oxygen-independent coproporphyrinogen III dehydrogenase
  of Escherichia coli, a cytoplasmic, monomeric radical S-adenosyl-L-methionine (SAM)
  enzyme that converts coproporphyrinogen III to protoporphyrinogen IX in the late,
  shared part of heme biosynthesis. It oxidatively decarboxylates the propionate side
  chains of pyrrole rings A and B to vinyl groups without using molecular oxygen, and
  so provides this step under anaerobic conditions, where the oxygen-dependent
  isoenzyme HemF cannot act. A [4Fe-4S] cluster ligated by the three cysteines of the
  CX3CX2C motif binds one SAM at its unique iron; reductive cleavage of that SAM yields
  a 5'-deoxyadenosyl radical, and a second SAM bound alongside acts as a radical relay,
  so that two SAM are consumed for each protoporphyrinogen IX formed. Catalysis
  proceeds through stereospecific abstraction of the pro-S hydrogen at the beta carbon
  of a propionate side chain, giving an allylic substrate radical that then loses CO2.
  The 2.07 A crystal structure of E. coli HemN was the first structure of any radical
  SAM enzyme. HemN is the founding member of a family whose sister subfamily, HemW,
  lacks this activity and instead acts as a heme chaperone.
