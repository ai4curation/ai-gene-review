- term:
    id: GO:1904047
    label: S-adenosyl-L-methionine binding
  evidence_type: IDA
  original_reference_id: PMID:14633981
  qualifier: enables
  review:
    summary: >-
      HemN binds two SAM molecules. In the crystal structure one SAM coordinates the unique
      iron of the [4Fe-4S] cluster and a second binds immediately beside it
      (PMID:14633981). Spectroscopy shows SAM binding changes the unique iron, and
      mutating the second SAM site abolishes catalysis (PMID:15967800).
    action: NEW
    reason: >-
      GOA has no SAM-binding row for HemN, although the RADICAL_SAM project treats GO:1904047 as a core
      cosubstrate-binding function of every active radical SAM enzyme. This is a molecular function the
      protein itself performs, so the participation test is met directly. HemN has the most direct evidence
      possible: SAM is resolved in its crystal structure (PDB 1OLT). Comparator check, against GOA rather
      than against this project's own proposals: GOA does annotate GO:1904047 to radical SAM enzymes in
      exactly this role, by UniRule -- ECOLI/queE (UR000100349), ECOLI/moaA and PSEPK/moaA (UR000101305),
      METEA/pqqE and PSEPK/pqqE (UR000098303). So the absence here is patchy UniRule coverage, which rules
      happen to carry the term, not a GO convention against annotating a radical SAM enzyme's own cosubstrate.
      That is also why those five genes have an existing row to ACCEPT or MODIFY while this one needs
      a NEW row.
    supported_by:
    - reference_id: PMID:14633981
      supporting_text: A juxtaposed SAM coordinates the fourth Fe ion through its amide nitrogen and
        carboxylate oxygen
    - reference_id: PMID:14633981
      supporting_text: HemN, strikingly, binds a second SAM immediately adjacent to the first
    - reference_id: PMID:15967800
      supporting_text: However, all mutants lost their overall catalytic ability indicating a
        functional role for AdoMet2 in HemN catalysis
core_functions:
- description: >-
    Oxygen-independent radical SAM coproporphyrinogen III dehydrogenase in the cytoplasm:
    converts coproporphyrinogen III to protoporphyrinogen IX by oxidatively decarboxylating
    the ring A and B propionates to vinyl groups, consuming two SAM per turnover. This
    makes the step possible under anoxia in heme B biosynthesis.
