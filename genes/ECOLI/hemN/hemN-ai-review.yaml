suggested_questions:
- question: >-
    What is the physiological electron donor that reduces the HemN [4Fe-4S] cluster in E.
    coli? In vitro activity needs NAD(P)H and unidentified cytoplasmic components.
  experts:
  - Gunhild Layer
  - Dieter Jahn
- question: >-
    Can the IPR004558 InterPro2GO mapping be changed from GO:0004109 (oxygen-dependent
    coproporphyrinogen oxidase) to GO:0051989 (coproporphyrinogen dehydrogenase), which is
    the reaction HemN-family proteins actually carry out?
suggested_experiments:
- hypothesis: >-
    With coproporphyrinogen III bound, the second SAM moves close enough to SAM1 for
    hydrogen abstraction by the 5'-deoxyadenosyl radical.
  description: >-
    Determine an anaerobic structure of HemN in complex with coproporphyrinogen III, or a
    stable analogue, and both SAMs, to measure the SAM1 C5' to SAM2 methyl distance (about
    7 A in the substrate-free structure).
  experiment_type: anaerobic X-ray crystallography / cryo-EM
- hypothesis: >-
    A specific flavodoxin/flavodoxin reductase system is the physiological reductant of
    HemN.
  description: >-
    Fractionate E. coli cytoplasm for the activity needed to support HemN turnover, and test
    purified flavodoxin (FldA) with flavodoxin-NADP+ reductase (Fpr) in place of crude
    extract.
  experiment_type: biochemical reconstitution
