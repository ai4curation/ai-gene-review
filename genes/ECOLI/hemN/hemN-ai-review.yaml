- id: PMID:15967800
  title: 'Radical S-adenosylmethionine enzyme coproporphyrinogen III oxidase HemN: functional features
    of the [4Fe-4S] cluster and the two bound S-adenosyl-L-methionines.'
  findings:
  - statement: >-
      EPR and Mossbauer spectroscopy show a [4Fe-4S] cluster with three cysteine-ligated
