suggested_questions:
- question: How is formaldehyde flux partitioned between FrmA-dependent oxidation and other aldehyde-detoxifying
    routes when frmRAB is fully induced?
suggested_experiments:
- description: Measure intracellular S-(hydroxymethyl)glutathione, GSNO and formate in frmA, frmB yeiG
    and frmA frmB yeiG mutants after formaldehyde or nitrosative challenge, to separate the formaldehyde
    and GSNO roles of FrmA in vivo.
