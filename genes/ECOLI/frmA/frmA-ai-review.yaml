  label: Escherichia coli K-12
description: FrmA (AdhC) is the Escherichia coli class III zinc alcohol dehydrogenase, a cytosolic homodimer
  with two zinc ions per subunit. Its physiological activity is the NAD+-dependent oxidation of S-(hydroxymethyl)glutathione,
  the spontaneous adduct of formaldehyde and glutathione, to S-formylglutathione, which the S-formylglutathione
  hydrolases FrmB and YeiG convert to formate and glutathione. The frmRAB operon is induced by formaldehyde
  and repressed by FrmR. The same enzyme reduces S-nitrosoglutathione with NADH (GSNO reductase) and,
  without glutathione, slowly oxidizes long-chain primary alcohols and other hemithioacetals.
