  label: Escherichia coli K-12
description: YihS is the sulfoquinovose isomerase of Escherichia coli, the first enzyme of the sulfoglycolytic
  Embden-Meyerhof-Parnas (sulfo-EMP) pathway. It reversibly isomerizes beta-sulfoquinovose (6-deoxy-6-sulfo-D-glucose)
  to the ketose 6-deoxy-6-sulfo-D-fructose, and also forms 6-deoxy-6-sulfo-D-rhamnose, a sugar that derepresses
  the pathway regulator CsqR. The cofactor-independent enzyme has the (alpha/alpha)6-barrel fold of the N-acylglucosamine
  2-epimerase family, uses His248 and His383 for ring opening and proton transfer through a cis-enediol
  intermediate, binds the substrate sulfonate in a positively charged pocket, and assembles as a homohexamer.
  It has no N-acylglucosamine 2-epimerase activity and only weak activity on mannose, fructose, glucose,
  lyxose and xylulose in vitro. Deletion of yihS abolishes growth on sulfoquinovose.
