  review:
    summary: Weak in vitro mannose-fructose isomerization measured before the physiological substrate was
      known.
    action: MARK_AS_OVER_ANNOTATED
    reason: PMID:18328504 measured real mannose isomerization by purified YihS, but with a KM of 108 mM; sulfoquinovose
      is a 178-fold better substrate by kcat/KM (PMID:33791429), and the enzyme is induced and required only
      for sulfoquinovose catabolism (PMID:24463506). This is genuine in vitro activity of unknown physiological
      relevance (promiscuous-activity tier 2), so it is kept but flagged as an over-annotation rather than
      a function.
    supported_by:
    - reference_id: PMID:18328504
      supporting_text: Both proteins were found to show no AGE activity but showed cofactor-independent aldose-ketose
        isomerase activity involved in the interconversion of monosaccharides, mannose, fructose, and glucose,
        or lyxose and xylulose.
    - reference_id: PMID:33791429
      supporting_text: Comparison of this data with that for d-mannose reported by Itoh and co-workers20
        shows that SQ is 178-fold better as a substrate for EcYihS (in terms of kcat/KM).
