  label: Escherichia coli K-12
description: YeiG is a constitutively expressed S-formylglutathione hydrolase of Escherichia coli, a homotetrameric
  esterase D-family alpha/beta hydrolase whose Ser145-Asp233-His256 catalytic triad is required for activity.
  It hydrolyzes S-formylglutathione to formate and glutathione, providing a formaldehyde-independent baseline
  of the activity supplied by the inducible paralog FrmB; only the double frmB yeiG deletion sensitizes
  cells to formaldehyde. Purified YeiG also hydrolyzes short-chain p-nitrophenyl esters, alpha-naphthyl
  acetate, palmitoyl-CoA and S-lactoylglutathione.
