    label: hydroxyacylglutathione hydrolase activity
  evidence_type: IDA
  original_reference_id: PMID:16567800
  qualifier: enables
  review:
    summary: Purified YeiG hydrolyzes S-lactoylglutathione (an S-(2-hydroxyacyl)glutathione) in addition
      to S-formylglutathione.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Over-annotation of a real in vitro side activity: purified YeiG does
      hydrolyze S-lactoylglutathione, so the claim is not false, but its
      physiological relevance is unknown. YeiG's highest activity is toward
      S-formylglutathione, and E. coli has dedicated glyoxalase II enzymes for
      S-lactoylglutathione, so this activity should not be read as a
      glyoxalase II function of YeiG.
