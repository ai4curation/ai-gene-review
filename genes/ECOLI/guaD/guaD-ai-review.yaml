- id: PMID:10913105
  title: Identification, expression, and characterization of Escherichia coli guanine
    deaminase.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The cached full text directly establishes purified E. coli GuaD guanine
      deaminase kinetics and zinc association.
  findings:
  - statement: >-
      b2883/ygfP encodes a 439-residue E. coli protein whose purified product
      catalyzes guanine deamination to xanthine with micromolar substrate
      affinity.
    supporting_text: >-
      The purified protein catalyzed the conversion of guanine to xanthine
      having a K m of 15.4 ± 1.8 μM and a V max of 3,795 ± 135 nmol/min per mg
      of protein and a k cat of 3.18 ± 0.12 s −1 .
    reference_section_type: RESULTS
  - statement: >-
      E. coli GuaD contains a conserved His-X-His metal-binding motif and
      approximately one zinc atom per monomer.
    supporting_text: >-
      These analyses revealed there to be approximately 1 atom of zinc (0.69
      atom of zinc versus less than 0.1 atom of manganese) per monomer guanine
      deaminase.
    reference_section_type: RESULTS
- id: PMID:20023034
  title: Bacterial ammeline metabolism via guanine deaminase.
  full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Only the abstract is cached locally, but it directly states the E. coli
      guaD deletion phenotype for ammeline deamination and frames the activity
      as promiscuous.
  findings:
  - statement: >-
      E. coli guaD is genetically required for ammeline deamination in vivo.
    supporting_text: >-
      An E. coli guanine deaminase deletion mutant was deficient in ammeline
      deaminase activity, supporting the role of guanine deaminase in this
      reaction.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: >-
      The authors interpreted ammeline deamination as a promiscuous activity of
      widespread guanine deaminases.
    supporting_text: >-
      The present study indicated that widespread guanine deaminases have a
      promiscuous activity allowing them to catalyze a key reaction in the
      bacterial transformation of melamine to cyanuric acid
    reference_section_type: ABSTRACT
    full_text_unavailable: true
- id: PMID:31283204
  title: Structural Determinants for Substrate Selectivity in Guanine Deaminase
    Enzymes of the Amidohydrolase Superfamily.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified full-text cache; directly supports purified EcGuaD
      guanine deaminase structure, active-site mutagenesis, and secondary
      ammeline deaminase activity.
  findings:
  - statement: >-
      Purified EcGuaD has secondary ammeline deaminase activity in addition to
      its primary guanine deaminase activity.
    supporting_text: >-
      Interestingly, both EcGuaD and Gud1 also exhibit secondary ammeline
      deaminase activity.
    reference_section_type: ABSTRACT
  - statement: >-
      EcGuaD and yeast Gud1 structures retain the amidohydrolase-family TIM
      barrel and a single active-site zinc ion.
    supporting_text: >-
      EcGuaD and Gud1 retain the overall TIM barrel tertiary structure conserved
      among amidohydrolase enzymes.
    reference_section_type: ABSTRACT
