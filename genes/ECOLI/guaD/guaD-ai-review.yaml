taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  GuaD is a soluble zinc-dependent guanine deaminase of the amidohydrolase
  superfamily that hydrolyzes guanine to xanthine and ammonium in purine-base
  catabolism. The purified E. coli K-12 enzyme catalyzes guanine deamination,
  binds approximately one zinc ion per subunit, and has a weak secondary
  ammeline-deamination activity detected with purified EcGuaD at roughly
  16-fold lower catalytic efficiency than guanine.
