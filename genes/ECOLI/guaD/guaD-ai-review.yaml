- term:
    id: GO:0018756
    label: ammeline aminohydrolase activity
  evidence_type: IMP
  original_reference_id: PMID:20023034
  qualifier: enables
  review:
    summary: >-
      Loss of E. coli guaD blocks in-vivo ammeline deamination, and other
      purified GuaD orthologs deaminate ammeline in vitro.
    action: KEEP_AS_NON_CORE
    reason: >-
      The experimental row is credible and should be retained: the cached
      abstract reports that an E. coli guaD deletion is deficient in ammeline
      deaminase activity, and later work directly detected secondary ammeline
      deaminase activity for purified EcGuaD. Ammeline is a melamine-pathway
      xenobiotic rather than the purine substrate GuaD evolved to process, so
      this is best represented as a non-core promiscuous molecular activity.
    supported_by:
    - reference_id: PMID:20023034
      supporting_text: >-
        An E. coli guanine deaminase deletion mutant was deficient in ammeline
        deaminase activity, supporting the role of guanine deaminase in this
        reaction.
    - reference_id: PMID:20023034
      supporting_text: >-
        The present study indicated that widespread guanine deaminases have a
        promiscuous activity allowing them to catalyze a key reaction in the
        bacterial transformation of melamine to cyanuric acid
    - reference_id: PMID:31283204
      supporting_text: >-
        Interestingly, both EcGuaD and Gud1 also exhibit secondary ammeline
        deaminase activity.
