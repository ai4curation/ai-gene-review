suggested_questions:
- question: >-
    Does ammeline deamination make a measurable contribution to E. coli
    physiology outside experimental melamine-pathway assays, or is it only a
    permissive promiscuous activity of the guanine deaminase active site?
  experts:
  - melamine biodegradation experts
  - bacterial purine-catabolism experts
suggested_experiments:
- description: >-
    Purify wild-type and catalytic-site mutant E. coli GuaD and compare
    steady-state kinetics for guanine versus ammeline under matched conditions.
  experiment_type: enzyme activity assay
- description: >-
    Complement an E. coli guaD deletion with catalytically active or inactive
    GuaD variants and measure guanine and ammeline deamination in cell extracts
    and intact cells.
  experiment_type: genetic rescue
