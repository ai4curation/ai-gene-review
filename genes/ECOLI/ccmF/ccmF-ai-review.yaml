  supporting_entities:
  - InterPro:IPR003567
  - InterPro:IPR003568
  review:
    summary: >-
      InterPro2GO mapping from the cytochrome c biogenesis protein family
      signatures; no evidence that CcmF moves heme across the membrane.
    action: REMOVE
    reason: >-
      The heme that CcmF attaches to apocytochrome c is delivered on the
      periplasmic side by holo-CcmE, and CcmF's own b-heme is a stable,
      stoichiometric cofactor, not a transported substrate. There are no
      experimental annotations for transport activity on E. coli CcmF, and the
      CcmFGH-only experiments show heme attachment by CcmFH without any
      dedicated transporter role being demonstrated for CcmF. The family-level
      IEA mapping (which also covers system II CcsA/CcsBA, a genuine heme
      export-and-attachment protein) is over-propagated to CcmF.
    supported_by:
    - reference_id: PMID:19629033
      supporting_text: This haem is shown not to arise from holoCcmE, which is
        the haem moiety that is covalently attached to the CXXCH of apocytochromes
        c at the CcmF/H active site
    - reference_id: PMID:19629033
      supporting_text: Rather, the b -haem is a stable component of the CcmF protein
        in a 1:1 (molar) stoichiometry.
