  review:
    summary: CcmF receives and ligates heme, but a membrane-crossing transporter assignment exceeds the
      demonstrated activity.
    action: MARK_AS_OVER_ANNOTATED
    reason: Direct CcmFGH-only product formation establishes heme ligation. Heme binding and proposed
      lateral membrane access do not establish transport across the bilayer. The broader heme-handling
      family includes proteins with distinct transport architectures, so neither the family designation
      nor CcmF transmembrane helices establish this specific activity. This is not a claim that all possible
      CcmF heme movement has been experimentally excluded. The E. coli evidence is distinguished from
      heterologous ortholog assays and engineered expression constructs.
    supported_by:
    - reference_id: PMID:24397552
      supporting_text: Our findings establish that CcmFH is the system I holocytochrome c synthetase.
    - reference_id: PMID:37626034
      supporting_text: suggest that this unusual ABC transporter acts as a heme floppase
