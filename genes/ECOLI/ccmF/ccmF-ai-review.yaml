suggested_questions:
- question: >-
    What is the physiological electron donor for the CcmF b-heme, given that
    the proposed NPF quinone site is dispensable in vivo?
- question: >-
    Does CcmF alone catalyse thioether bond formation, or is CcmH required for
    catalysis rather than only for presenting reduced apocytochrome?
suggested_experiments:
- description: >-
    Determine a structure of the E. coli CcmF/H complex with bound holo-CcmE
    or apocytochrome to locate the WWD-domain heme site relative to the b-heme.
  experiment_type: cryo-EM structure determination
- description: >-
    Test in vitro holocytochrome c formation by purified CcmF alone versus
    CcmF/H with defined apocytochrome and heme donors.
  experiment_type: in vitro reconstitution
