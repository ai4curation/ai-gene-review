  evidence_type: IDA
  original_reference_id: PMID:19629033
  qualifier: enables
  review:
    summary: >-
      The CcmF b-heme is reduced by ubiquinol-1 and dimethylquinone in vitro,
      leading to the proposal that CcmF is a quinol:heme oxidoreductase that
      reduces holo-CcmE heme before ligation.
    action: KEEP_AS_NON_CORE
    reason: >-
      The in vitro quinol reduction of the CcmF b-heme is direct evidence, and
      the term is as precise as warranted. However, the physiological role is
      uncertain: mutating the proposed NPF quinone-binding site did not abolish
      cytochrome c production, so the in vivo electron donor is unresolved.
      Heme reduction is likely part of the synthase mechanism, but the quinol
      donor specificity is kept as non-core.
    supported_by:
    - reference_id: PMID:19629033
      supporting_text: The CcmF cytochrome b is reduced by ubiquinol 1
    - reference_id: PMID:24044352
      supporting_text: In neither
        case was cytochrome c production abolished, suggesting
        that interaction with quinols/quinones at this site is not essential
        for the function of CcmF.
