core_functions:
- description: >-
    Heme-binding integral membrane subunit of the CcmF/CcmH holocytochrome c
    synthase: binds a stable b-heme and receives heme from holo-CcmE, and
    together with CcmH (and reduced apocytochrome supplied via CcmG) covalently
    attaches heme to apocytochrome CXXCH motifs in the periplasm.
  molecular_function:
    id: GO:0020037
    label: heme binding
  contributes_to_molecular_function:
    id: GO:0004408
    label: holocytochrome-c synthase activity
  directly_involved_in:
  - id: GO:0018063
    label: cytochrome c-heme linkage
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:24397552
    supporting_text: Our findings establish that CcmFH is the system I holocytochrome
      c synthetase.
  - reference_id: PMID:19629033
    supporting_text: These results prove that the b -haem is associated with
      CcmF and that it is not derived from holoCcmE.
