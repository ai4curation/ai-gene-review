- id: PMID:11744735
  title: A bacterial cytochrome c heme lyase. CcmF forms a complex with the heme chaperone CcmE and CcmH
    but not with apocytochrome c.
  findings:
  - statement: Conserved CcmF histidines and the WWD motif are required; CcmF co-immunoprecipitates with
      CcmE and CcmH, defining a CcmFH heme-lyase complex.
- id: PMID:15044727
  title: Experimentally based topology models for E. coli inner membrane proteins.
  findings: []
- id: PMID:15919996
  title: Global topology analysis of the Escherichia coli inner membrane proteome.
  findings: []
- id: PMID:19629033
  title: A conserved haem redox and trafficking pathway for cofactor attachment.
  findings:
  - statement: CcmF is a cytochrome b with a stoichiometric b-heme liganded by His261; CcmH co-purifies
      with CcmF; the b-heme is reduced by quinols in vitro.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached (PMC2735175); E. coli CcmF/H purification and spectroscopy.
- id: PMID:22066495
  title: Heme ligand identification and redox properties of the cytochrome c synthetase, CcmF.
  findings:
  - statement: His261 and His491 are b-heme ligands; the b-heme is low-spin hexacoordinate with Em7 of
      -147 mV and is conserved across CcmF proteins.
- id: PMID:24044352
  title: Probing heme delivery processes in cytochrome c biogenesis System I.
  findings:
  - statement: The proposed CcmF quinone-binding NPF site is not essential for cytochrome c production;
      CcmF H173 and H261 are important.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: ' Historical evidence/model: its positive loading/release findings remain useful, but
      any blanket exclusion of heme transport must be read alongside conflicting PMID:37626034, PMID:40026579
      and PMID:40167305. This audit does not infer a universally proven conduit.'
- id: PMID:24397552
  title: 'The CcmFH complex is the system I holocytochrome c synthetase: engineering cytochrome c maturation
    independent of CcmABCDE.'
  findings:
  - statement: Engineered E. coli CcmFGH-only produces covalently matured cytochrome c, establishing synthase
      function of CcmFH.
    supporting_text: Our findings establish that CcmFH is the system I holocytochrome c synthetase.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text read. Engineered bypass with increased expression/heme availability and product
      characterization distinguishes covalent heme attachment from mere necessity. CcmF histidines and
      CcmG/H cysteines are required. It does not establish that native cells dispense with CcmABCDE or
      that an isolated subunit enables the complete synthase reaction.
- id: PMID:9237661
  title: Escherichia coli ccm in-frame deletion mutants can produce periplasmic cytochrome b but not cytochrome
    c.
  findings:
  - statement: ccmF deletion mutants make apocytochrome c-550 but no holocytochrome c.
- id: PMID:37626034
  title: Architecture of the Heme-translocating CcmABCD/E complex required for Cytochrome c maturation.
  findings:
  - statement: E. coli CcmABCD/E structures support ATP-coupled conformational changes and propose a heme
      floppase mechanism.
    supporting_text: suggest that this unusual ABC transporter acts as a heme floppase
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text read. Recombinant E. coli operon from pEC86; N-terminal Strep-tag II on CcmA,
      expression in BL21(DE3)/C43(DE3). These are expression hosts, not independently established donor
      strains. Detergent structures and ATPase-deficient E154Q states support a model, not a purified
      vectorial heme-flux measurement. The proposed CcmB/CcmC route conflicts with PMID:40167305.
