description: >-
  CcmF is the large polytopic inner-membrane subunit of the cytochrome c
  synthetase of the Escherichia coli cytochrome c maturation (Ccm) system I.
  It has about 13 transmembrane segments, a periplasmic tryptophan-rich WWD
  domain flanked by conserved periplasmic histidines that is proposed to
  receive heme from the chaperone holo-CcmE, and a stably bound b-type heme
  ligated by conserved transmembrane histidines (His261, His491). CcmF forms a
  complex with CcmH and interacts with holo-CcmE; together with CcmH and the
  thioredoxin-like CcmG, CcmF is sufficient to attach heme covalently to the
  CXXCH motifs of periplasmic apocytochromes c when heme is available. In
  vitro its b-heme is reduced by quinols, suggesting a role in reducing the
  heme iron before thioether bond formation, although the proposed quinone
  site is not essential in vivo. CcmF is required for all periplasmic c-type
  cytochrome synthesis in E. coli.
