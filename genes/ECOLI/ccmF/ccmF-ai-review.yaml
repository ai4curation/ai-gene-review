  review:
    summary: The CcmF b-heme is reduced by ubiquinol-1 and dimethylquinone in vitro, leading to the proposal
      that CcmF is a quinol:heme oxidoreductase that reduces holo-CcmE heme before ligation.
    action: KEEP_AS_NON_CORE
    reason: 'The in vitro quinol reduction of the CcmF b-heme is direct evidence, and the term is as precise
      as warranted. However, the physiological role is uncertain: mutating the proposed NPF quinone-binding
      site did not abolish cytochrome c production, so the in vivo electron donor is unresolved. Heme
      reduction is likely part of the synthase mechanism, but the quinol donor specificity is kept as
      non-core.'
    supported_by:
