    label: glyoxylate metabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR006398
  review:
    summary: Glyoxylate metabolism belongs to the GlxR paralog; no GarR-specific evidence.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The InterPro tartronate semialdehyde reductase signature (IPR006398) covers both E. coli paralogs
      and maps to glyoxylate metabolism, which is the role of GlxR in the gcl-hyi-glxR glycerate pathway.
      GarR is encoded in the garPLRK operon and assigned to galactarate degradation. It may reduce tartronate
      semialdehyde from glyoxylate when overexpressed, but no cached evidence shows that GarR contributes
      to glyoxylate metabolism.
    supported_by:
