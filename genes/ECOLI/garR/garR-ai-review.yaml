  label: Escherichia coli K-12
description: >-
  GarR is the tartronate semialdehyde reductase (2-hydroxy-3-oxopropionate reductase, EC 1.1.1.60) of
  the E. coli galactarate/glucarate (gar) operon. It is an NAD(P)H-dependent beta-hydroxyacid dehydrogenase
  of the HIBADH-related family. GarR reduces the tartronate semialdehyde released by the GarL aldolase
  to D-glycerate, which GarK then phosphorylates to 2-phosphoglycerate. The garR gene is co-transcribed
  in garPLRK and induced by galactarate, D-glucarate and D-glycerate. GarR is a paralog of GlxR, the tartronate
  semialdehyde reductase of the glyoxylate (gcl-hyi-glxR) pathway.
