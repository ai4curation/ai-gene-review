suggested_questions:
- question: How does IlvN binding near the IlvB FAD site couple valine occupancy of its ACT domain to
    the cooperative inhibition unique to AHAS I?
- question: Should the PAINT assertion of enables GO:0003984 on PTN000767018 be changed to contributes_to,
    given that the seeds are holoenzyme assays?
suggested_experiments:
- description: Compare IlvB activity, valine sensitivity and cooperativity with wild-type IlvN and ACT-domain
    valine-site mutants in reconstituted AHAS I.
  experiment_type: enzyme reconstitution and site-directed mutagenesis
