taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: IlvN is the small (96-residue), regulatory subunit of acetohydroxy-acid synthase isozyme
  I (AHAS I, IlvBN) of Escherichia coli, one of three AHAS isozymes of the species and, with AHAS III,
  one of the two expressed in strain K-12. A single ACT domain, it binds the FAD-binding region of the
  thiamine-diphosphate-dependent catalytic subunit IlvB, stimulates its activity and confers cooperative
  feedback inhibition by L-valine. The cytosolic IlvB-IlvN holoenzyme catalyses the first committed step
  of branched-chain amino acid biosynthesis, condensing two pyruvate to 2-acetolactate (valine and leucine
  route) or pyruvate and 2-oxobutanoate to 2-aceto-2-hydroxybutanoate (isoleucine route); unlike the other
  isozymes AHAS I shows no preference for the isoleucine-route product.
