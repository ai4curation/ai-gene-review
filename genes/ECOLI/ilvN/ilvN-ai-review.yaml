    supporting_text: We have cloned the two subunits, ilvB and ilvN, of this Escherichia coli isoenzyme
      and examined the enzymatic properties of the purified holoenzyme and the enzyme reconstituted from
      purified subunits.
  - statement: AHAS I shows cooperative valine feedback inhibition.
    supporting_text: Unlike other AHASs, AHAS I demonstrates cooperative feedback inhibition by valine
  - statement: AHAS I does not prefer acetohydroxybutyrate formation.
    supporting_text: the absence of a preference for forming acetohydroxybutyrate
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only. Holoenzyme and reconstitution study of E. coli AHAS I; supports complex
      activity and valine regulation, not catalysis by IlvN alone.
