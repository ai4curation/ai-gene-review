  review:
    summary: The AcrB co-crystal reports a YajC contact but GO:0005515 is uninformative and the physiological
      connection is unresolved.
    action: REMOVE
    reason: The AcrB contact does not establish a Sec activity or a direct role in multidrug export, and
      the paper itself could not conclusively attribute the weak phenotype to loss of AcrB-YajC binding.
    supported_by:
    - reference_id: file:ECOLI/YajC/YajC-notes.md
      supporting_text: The generic protein-binding row should therefore be removed as an uninformative
        and biologically unsettled interaction record.
