suggested_questions:
- question: Does YajC make a substrate-specific or assembly-specific contribution to SecDF-YajC/HTL activity
    in E. coli, or is it dispensable under standard protein-export assays?
suggested_experiments:
- description: Compare native HTL abundance, SecDF stability, and substrate-specific export after deleting
    yajC while monitoring SecD, SecF, YidC, SecYEG, and precursor accumulation.
  hypothesis: YajC tunes SecDF-YajC or HTL assembly for a limited substrate set rather than providing
    an independent transporter activity.
  experiment_type: complex assembly and export phenotyping
