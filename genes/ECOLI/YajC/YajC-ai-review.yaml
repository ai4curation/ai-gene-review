  label: Escherichia coli K-12
description: YajC is a small single-pass inner-membrane protein in the conserved YajC family. It occurs
  in SecDF-YajC and bacterial SecYEG-SecDF-YajC-YidC holo-translocon assemblies, while its individual
  mechanistic contribution to Sec-dependent export remains unresolved.
