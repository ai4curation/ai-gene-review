  qualifier: part_of
  review:
    summary: YajC is a SecDF-YajC/holo-translocon component.
    action: ACCEPT
    reason: Structural and interaction evidence place YajC in the E. coli SecDF-YajC accessory complex
      and in purified SecYEG-SecDF-YajC-YidC HTL.
    supported_by:
    - reference_id: PMID:27924919
      supporting_text: The conserved SecYEG protein-conducting channel and the accessory proteins SecDF-YajC
        and YidC constitute the bacterial holo-translocon (HTL), capable of protein-secretion and membrane-protein
        insertion
- term:
    id: GO:0043952
    label: protein transport by the Sec complex
  evidence_type: IDA
  original_reference_id: PMID:24550475
  qualifier: involved_in
  review:
    summary: YajC is present in an active purified bacterial Sec holo-translocon.
    action: KEEP_AS_NON_CORE
    reason: The HTL evidence supports involvement of the YajC-containing complex in Sec transport, but
      direct E. coli genetics and follow-up YajC work leave the individual YajC mechanism unresolved,
      so the core YajC assertion should remain complex membership rather than an independent transport
      activity.
    supported_by:
    - reference_id: PMID:24550475
      supporting_text: SecYEG interacts with the highly conserved YidC and SecDF-YajC subcomplex, which
        facilitates translocation into and across the membrane
    - reference_id: file:ECOLI/YajC/YajC-notes.md
      supporting_text: No independent molecular function should be assigned to YajC from the available
        evidence.
