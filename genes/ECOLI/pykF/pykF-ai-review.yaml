      Lys(382) is involved in both activator binding and allosteric transition mechanism.
suggested_questions:
- question: How do FBP activation, HPr binding and Lys382 lactylation combine to set PykF flux during
    glucose pulses, and do they act at the same allosteric interface?
suggested_experiments:
- description: Measure PykF kinetics with FBP and non-phosphorylated HPr on wild-type, K382Q and lactylated
    enzyme to test whether HPr activation depends on the FBP site.
  experiment_type: enzyme kinetics
