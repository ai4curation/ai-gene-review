  label: Escherichia coli K-12
description: PykF is the fructose 1,6-bisphosphate-activated type I pyruvate kinase of Escherichia coli,
  a cytosolic homotetramer that transfers the phosphoryl group of phosphoenolpyruvate to ADP, forming
  pyruvate and ATP in the final, physiologically irreversible step of glycolysis. Its activity is governed
  by an allosteric T-to-R transition driven by phosphoenolpyruvate and fructose 1,6-bisphosphate, and
  it is further modulated by non-phosphorylated HPr of the phosphotransferase system and by lysine lactylation.
  PykF and the AMP-activated isoenzyme PykA together supply pyruvate from glycolysis.
