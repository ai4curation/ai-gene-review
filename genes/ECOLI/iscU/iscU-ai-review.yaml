- id: PMID:32131593
  title: Molecular Mechanism of ISC Iron-Sulfur Cluster Biogenesis Revealed by High-Resolution Native
    Mass Spectrometry.
  findings:
  - statement: Anaerobic native mass spectrometry of E. coli IscS/IscU detects Fe(II) binding to IscU
      and iron-promoted sulfur transfer.
    supporting_text: Fe(II) ions bind to the IscU active site cysteine residues and another lower affinity
      binding site and promote the intermolecular sulfur transfer reaction from IscS to IscU.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text read. Methods explicitly specify E. coli IscS and IscU, with expression/purification
      delegated to prior work; no unverified exact strain or recombinant sequence equality is asserted.
      These assays establish capability under anaerobic conditions, not an exclusive physiological reaction
      order.
- id: PMID:36605734
  title: Native mass spectrometric studies of IscSU reveal a concerted, sulfur-initiated mechanism of
    iron-sulfur cluster assembly.
  findings:
  - statement: E. coli IscU can retain Fe(II) and support cluster assembly after desalting, although the
      authors favor a sulfur-initiated rather than obligatory iron-first mechanism.
    supporting_text: IscU pre-loaded with excess Fe2+ ions retained 0.68 (±0.06) Fe2+/IscU post-desalting,
      and supported Fe–S cluster assembly in the presence of 5 μM IscS and 2 mM l-cysteine.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text read. All proteins are E. coli; His-GST fusion tags were cleaved. Metal loading,
      zinc occupancy and anaerobic solution conditions constrain comparison with older negative assays.
- id: PMID:38452854
  title: Iron-sulfur cluster assembly scaffold protein IscU is required for activation of ferric uptake
    regulator (Fur) in Escherichiacoli.
  findings:
  - statement: IscU-dependent cluster assembly activates E. coli Fur, connecting scaffold chemistry with
      iron-regulatory output.
    supporting_text: IscU promotes the [2Fe-2S] cluster assembly in apo-form Fur and restores its Fur-box
      binding activity in vitro.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text read. Native experiments use MC4100 and an in-frame iscU deletion, with expressed
      Fur; purified-component reconstitution also restores Fur-box binding. In vitro Fur could not be
      cleanly re-purified from IscU, so spectral overlap is addressed in the paper and is not ignored.
      This is a specific Fur-client context, not a universal effect on every Fe-S protein.
core_functions:
- description: Cytosolic scaffold and carrier that accepts IscS-derived sulfur and iron, assembles transient
    Fe-S clusters, and delivers cluster cargo to acceptor proteins. Multiple-turnover [2Fe-2S] transfer
    is measured; [4Fe-4S] formation is demonstrated under reductive reconstitution conditions without
    establishing a universal native delivery route.
  molecular_function:
    id: GO:0140132
    label: iron-sulfur cluster chaperone activity
  directly_involved_in:
  - id: GO:0016226
    label: iron-sulfur cluster assembly
  locations:
  - id: GO:0005829
    label: cytosol
  in_complex:
    id: GO:1990330
    label: IscS-IscU complex
  supported_by:
  - reference_id: PMID:15964837
    supporting_text: Kinetic studies further showed that cluster transfer exhibits Michaelis-Menten behavior
      indicative of complex formation of holo-IscU and holo-IscA with apoferredoxin
  - reference_id: file:ECOLI/iscU/iscU-uniprot.txt
    record_section: ["CC:FUNCTION"]
    supporting_text: Converts to the S-state when an Fe-S cluster is assembled, which helps it dissociate
      from IscS to transfer the Fe-S to an acceptor.
  - reference_id: PMID:11577100
    supporting_text: IscS catalyzed transfer of (35)S from [(35)S]cysteine to IscU in the absence of additional
      thiol reagents, suggesting that transfer can occur directly and without involvement of an intermediate
      carrier.
proposed_new_terms: []
suggested_questions:
- question: How is the choice between [2Fe-2S] and [4Fe-4S] cargo on IscU controlled in vivo, and which
    acceptors receive each cluster type directly from IscU versus via A-type carriers (IscA, ErpA) or
    NfuA?
- question: Which of the proposed iron donors (CyaY, IscX, IscA, YtfE, or free Fe2+) supplies iron to
    IscU under physiological aerobic and anaerobic conditions?
- question: Should the IscU-IscS stimulation of cysteine desulfurase activity be captured on IscU (for
    example as an enzyme activator activity) or only via the IscS-IscU complex?
suggested_experiments:
- description: In vivo crosslinking/pull-down of holo-IscU under HscA ATPase-dead conditions combined
    with acceptor proteomics to define the set of apo-proteins receiving clusters directly from IscU.
  experiment_type: in vivo crosslinking proteomics
- description: Mossbauer analysis of IscU isolated from cells (wild type versus cyaY, iscX, iscA/sufA
    and ytfE deletions) to determine the cellular iron source and cluster type carried by IscU.
  experiment_type: whole-cell Mossbauer spectroscopy
