core_functions:
- description: >-
    Transient scaffold that assembles [2Fe-2S] (and, reductively, [4Fe-4S])
    clusters from IscS-derived persulfide sulfur and donated iron while bound
    to IscS, then, as the HscB/HscA client, delivers the cluster to
    apo-acceptor proteins such as ferredoxin over multiple turnovers.
  molecular_function:
    id: GO:0140132
    label: iron-sulfur cluster chaperone activity
  directly_involved_in:
  - id: GO:0016226
    label: iron-sulfur cluster assembly
  locations:
  - id: GO:0005829
    label: cytosol
  in_complex:
    id: GO:1990330
    label: IscS-IscU complex
  supported_by:
  - reference_id: PMID:15964837
    supporting_text: >-
      Kinetic studies further showed
      that cluster transfer exhibits Michaelis-Menten behavior indicative of
      complex formation of holo-IscU and holo-IscA with apoferredoxin
  - reference_id: file:ECOLI/iscU/iscU-uniprot.txt
    supporting_text: >-
      Converts to the S-state when
      an Fe-S cluster is assembled, which helps it dissociate from IscS to
      transfer the Fe-S to an acceptor.
  - reference_id: PMID:11577100
    supporting_text: >-
      IscS
      catalyzed transfer of (35)S from [(35)S]cysteine to IscU in the absence of
      additional thiol reagents, suggesting that transfer can occur directly and
      without involvement of an intermediate carrier.
proposed_new_terms: []
suggested_questions:
- question: >-
    How is the choice between [2Fe-2S] and [4Fe-4S] cargo on IscU controlled in
    vivo, and which acceptors receive each cluster type directly from IscU
    versus via A-type carriers (IscA, ErpA) or NfuA?
- question: >-
    Which of the proposed iron donors (CyaY, IscX, IscA, YtfE, or free Fe2+)
    supplies iron to IscU under physiological aerobic and anaerobic conditions?
- question: >-
    Should the IscU-IscS stimulation of cysteine desulfurase activity be
    captured on IscU (for example as an enzyme activator activity) or only via
    the IscS-IscU complex?
suggested_experiments:
- description: >-
    In vivo crosslinking/pull-down of holo-IscU under HscA ATPase-dead
    conditions combined with acceptor proteomics to define the set of
    apo-proteins receiving clusters directly from IscU.
  experiment_type: in vivo crosslinking proteomics
- description: >-
    Mossbauer analysis of IscU isolated from cells (wild type versus cyaY,
    iscX, iscA/sufA and ytfE deletions) to determine the cellular iron source
    and cluster type carried by IscU.
  experiment_type: whole-cell Mossbauer spectroscopy
