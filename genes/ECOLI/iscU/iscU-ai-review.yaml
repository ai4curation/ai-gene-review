  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR002871
  - InterPro:IPR011339
  review:
    summary: >-
      InterPro-mapped generic iron-ion binding. IscU coordinates iron only as
      part of a nascent Fe-S cluster; purified IscU does not stably bind free
      iron and fails to bind iron in vivo, unlike IscA.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Iron atoms are present in the IscU-bound cluster, so the term is not
      wholly wrong, but there is direct E. coli evidence against IscU being a
      free-iron-binding protein, and the informative activity (cluster assembly
      and handoff) is captured by 2Fe-2S cluster binding and Fe-S cluster
      chaperone activity. Consistent with the treatment of the P. putida
      orthologue.
    supported_by:
    - reference_id: PMID:15153099
      supporting_text: >-
        Monomeric E. coli IscU is able to provide a scaffold for Iron-sulfur
        cluster assembly, but has no direct interaction with either Fe(II) or
        Fe(III) ions, suggesting the need of further partners to achieve a
        stable interaction.
    - reference_id: PMID:20942799
      supporting_text: >-
        In contrast, IscU, an iron-sulfur cluster assembly scaffold protein, or
        CyaY, a bacterial frataxin homologue, fails to bind any iron in E. coli
        cells under the same experimental conditions.
