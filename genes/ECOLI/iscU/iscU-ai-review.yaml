  review:
    summary: IscU contributes to coupled cysteine desulfuration by accepting persulfide sulfur and stimulating
      IscS turnover.
    action: KEEP_AS_NON_CORE
    reason: IscS catalyzes cysteine-to-alanine conversion; IscU is not an autonomous cysteine desulfurase.
      PMID11972033 nevertheless identifies the Cys328–Cys63 sulfur-transfer interface and a sixfold increase
      in IscS activity with IscU. In this coupled carrier/cofactor role IscU does work in the desulfuration
      reaction, rather than being only a required downstream recipient. Retain the existing process claim
      as peripheral to its principal cluster-assembly role, without generalizing in-vitro stimulation
      into a separate native cysteine-degradation pathway.
    supported_by:
    - reference_id: PMID:11972033
      supporting_text: IscS catalyzes the desulfurization of L-cysteine to produce L-alanine and sulfur.
    - reference_id: PMID:11972033
      supporting_text: IscU induced a six-fold increase in the cysteine desulfurase activity of IscS
