taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: IscU is the small cytosolic scaffold of the E. coli Isc iron-sulfur cluster assembly machinery.
  It docks onto IscS, accepts persulfide sulfur through conserved cysteines, binds ferrous iron under
  reconstitution conditions, and assembles transient clusters. Native mass spectrometry supports both
  iron-loaded and sulfur-loaded intermediates; the obligatory physiological order and principal native
  iron-delivery route remain unresolved. Purified IscU carries [2Fe-2S] clusters and can form [4Fe-4S]
  clusters under reductive assembly conditions. Its structured and dynamically disordered conformations
  are recognized differently by IscS, HscB and HscA. HscB targets cluster-loaded IscU to HscA, whose ATPase
  cycle promotes cluster transfer to acceptor proteins. IscU performs repeated cluster-transfer cycles
  in vitro and supports maturation of defined native clients, including the Fur iron regulator. Zinc stabilizes
  the scaffold but can inhibit iron loading, and copper can disrupt its assembly chemistry.
