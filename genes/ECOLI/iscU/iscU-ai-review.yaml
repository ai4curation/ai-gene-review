  review:
    summary: >-
      Phylogenetic transfer from eukaryotic ISCU/Isu1/Isu2, whose loss perturbs
      cellular iron regulation.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      In eukaryotes the iron-homeostasis phenotype of ISCU/Isu loss arises
      downstream of Fe-S cluster deficiency (e.g. via iron-regulatory Fe-S
      proteins), so it is an indirect consequence of the scaffold function
      rather than a separate role. There is no E. coli evidence that IscU
      itself regulates or performs iron homeostasis; its direct process is
      iron-sulfur cluster assembly. Not demonstrably wrong as an inherited
      consequence, but an over-annotation for the bacterial protein.
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - ROLE_CONFLATION
      - CONTEXT_OR_TISSUE_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN000009661
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          Eukaryotic donors (yeast Isu1/Isu2, human ISCU) show iron-regulation
          phenotypes downstream of Fe-S deficiency; no bacterial donor.
    supported_by:
    - reference_id: file:ECOLI/iscU/iscU-uniprot.txt
      supporting_text: >-
        A scaffold on which IscS assembles Fe-S clusters.
