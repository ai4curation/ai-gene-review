- term:
    id: GO:0008270
    label: zinc ion binding
  evidence_type: IDA
  original_reference_id: PMID:14487220
  qualifier: enables
  review:
    summary: From the 1962 paper that identified E. coli alkaline phosphatase as a zinc metalloenzyme
      -- the work that first established the metal dependence now known to be shared across
      the whole family.
    action: ACCEPT
    reason: 'Core to the catalytic function rather than incidental metal association: the
      binuclear zinc centre polarises the substrate phosphate and activates the serine nucleophile.
