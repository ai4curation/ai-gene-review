    label: alkaline phosphatase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  review:
    summary: The core molecular function, from the unrestricted PAINT node PTN000174527 that
      carries this term for the whole alkaline phosphatase family. phoA is one of the seventeen
      seeds behind that node, so its own experimental annotations are part of what placed
      the assertion.
    action: ACCEPT
    reason: 'Correct and ancestral. Reviewing the family (PANTHER:PTHR11596) found the catalytic
      serine present in all twenty-seven reviewed members with no pseudo-enzyme branch, so
      this term is safe family-wide and needs no clade restriction. phoA appearing in its
      own node''s WITH/FROM list is expected rather than circular: it has direct experimental
      evidence for the activity, which is why the curator could use it as a descendant evidence.'
