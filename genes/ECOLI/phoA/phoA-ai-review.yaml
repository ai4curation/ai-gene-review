- term:
    id: GO:0033748
    label: hydrogenase (acceptor) activity
  evidence_type: IDA
  original_reference_id: PMID:15148399
  qualifier: enables
  review:
    summary: 'The term is pointed the wrong way round. GO:0033748 is defined as catalysis
      of H2 + A = AH2, that is, hydrogen as the electron donor being consumed. What the cited
      paper demonstrates is the opposite: BAP oxidises phosphite and evolves molecular hydrogen
      as a product, which the authors describe as a Pt-dependent, H2-evolving hydrogenase.'
    action: MODIFY
    reason: The same experiment is already annotated, correctly, to GO:0030613 oxidoreductase
      activity acting on phosphorus or arsenic in donors, which captures the reaction in the
      direction it actually runs and names phosphite as the donor. Collapsing this row into
      that one removes a directional error without losing any evidence. A biological process
      term for hydrogen biosynthesis (GO:1902422) would also be defensible on this data, but
      given how slow the activity is relative to the phosphatase reaction, adding a process
      term would overstate its physiological weight. Note that EC treats hydrogenase reactions
      as reversible, which is probably how the term was chosen; GO's definition is not written
      reversibly.
    proposed_replacement_terms:
    - id: GO:0030613
      label: oxidoreductase activity, acting on phosphorus or arsenic in donors
    supported_by:
    - reference_id: PMID:15148399
      supporting_text: Surprisingly, BAP catalyzes the oxidation of Pt to phosphate and molecular
        H2.
- term:
    id: GO:0016036
    label: cellular response to phosphate starvation
  evidence_type: IEP
  original_reference_id: PMID:2241934
  qualifier: involved_in
  review:
    summary: 'Proposed new annotation, and the one that fills the real gap in this gene''s
      record. GOA gives phoA only GO:0016311 dephosphorylation as a biological process, which
      restates the chemistry and says nothing about why the cell makes the enzyme. phoA is
      the canonical effector of the Pho regulon: its transcription is repressed by high environmental
      phosphate and induced under phosphate limitation through the PhoR/PhoB two-component
      system, and the enzyme then scavenges phosphate from organic phosphomonoesters in the
      periplasm.'
    action: NEW
    reason: 'This is the physiological purpose of the enzyme and the reason its expression
      is regulated at all, so its absence leaves the gene''s process annotation essentially
      empty. The term is well precedented in this organism and for this class of gene: E.
      coli phoR carries GO:0016036 with IEP evidence, and appA, another secreted phosphatase
      effector of the same regulon, carries it with IDA. IEP is the correct code here because
      the evidence is the expression response -- phoA transcription tracking environmental
      phosphate -- rather than a direct assay of the protein. Note the annotation is about
      the cell''s response that phoA participates in as an effector, not a claim that phoA
      senses phosphate; sensing is done by PhoR, and the deep research is explicit that phoA
      is a regulon effector rather than a sensor.'
    additional_reference_ids:
    - PMID:31520469
    - file:ECOLI/phoA/phoA-deep-research-falcon.md
    supported_by:
    - reference_id: PMID:2241934
      supporting_text: The repression of phoA (the gene encoding alkaline phosphatase) by
        high Pi concentrations in the medium requires the presence of an intact Pst operon
        (pstS, pstC, pstA, pstB and phoU) and phoR.
    - reference_id: file:ECOLI/phoA/phoA-deep-research-falcon.md
      supporting_text: PhoA is an **effector enzyme of the Pho phosphate-starvation regulon**.
- term:
    id: GO:0042803
    label: protein homodimerization activity
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: enables
  review:
    summary: Proposed new annotation. E. coli alkaline phosphatase is an obligate homodimer
      -- UniProt records isozymes 1 and 3 as dimers of identical chains -- and the dimer is
      resolved in the refined crystal structure. GOA gives phoA no oligomerisation term.
    action: NEW
    reason: 'Proposed for consistency with the family review, which records the dimer as functionally
      load-bearing across the whole family rather than incidental: in the human placental
      paralogue the crystal structure attributes mammalian-specific allostery to the interface,
      in human ALPL monomeric mutants are catalytically dead and act dominant-negatively,
      and in human ALPI disease alleles act partly by impairing dimerization. phoA is where
      that quaternary arrangement is ancestral. The evidence code is ISS rather than IDA because
      the dimer is asserted here from UniProt''s subunit record and the family-level structural
      argument rather than from a specific cached paper demonstrating it for phoA; a curator
      with the structure paper to hand could strengthen it.'
core_functions:
- description: 'Bacterial alkaline phosphatase is a homodimeric Zn/Zn/Mg metalloenzyme that
    folds in the periplasm after Sec-dependent export and hydrolyses phosphate monoesters
    non-specifically through a covalent phosphoseryl intermediate. Its physiological role
    is phosphate scavenging: under phosphate limitation it liberates inorganic phosphate from
    organic phosphomonoesters in the periplasm, where the released phosphate can be taken
    up. It is the ancestral reference point for the family, and the catalytic serine and metal
    ligands it carries are conserved unchanged in the human isozymes.'
  molecular_function:
    id: GO:0004035
    label: alkaline phosphatase activity
  locations:
  - id: GO:0030288
    label: outer membrane-bounded periplasmic space
  supported_by:
  - reference_id: PMID:14487220
    supporting_text: 'Alkaline phosphatase of Escherichia coli: a zinc metalloenzyme.'
  - reference_id: PMID:15148399
    supporting_text: Highly purified BAP catalyzed Pt oxidation with specific activities of
      62-242 milliunits/mg and phosphate ester hydrolysis with specific activities of 41-61
      units/mg.
  - reference_id: file:ECOLI/phoA/phoA-deep-research-falcon.md
    supporting_text: Thus, PhoA is an extracellular-facing nutrient-scavenging enzyme in physiological
      terms, but it is not normally a freely secreted extracellular enzyme.
  directly_involved_in:
  - id: GO:0016036
    label: cellular response to phosphate starvation
proposed_new_terms: []
suggested_questions:
- question: Does E. coli alkaline phosphatase have any physiological protein-phosphatase role,
    or is the GO:0004721 annotation an artefact of the enzyme's use as a laboratory dephosphorylation
    reagent? The distinction matters beyond this gene, because alkaline phosphatase is used
    as a reagent in thousands of papers and each is a potential source of the same annotation
    error.
- question: Is the phosphite-oxidising, hydrogen-evolving side activity of any physiological
    consequence to E. coli, or purely a laboratory observation on purified enzyme? Its specific
    activity is two to three orders of magnitude below the phosphatase reaction, but phosphite
    is a real environmental phosphorus source and the phn pathway exists to use it.
- question: Why has the periplasmic arrangement been retained across Enterobacteriaceae while
    the eukaryotic lineages relocated the same enzyme to the vacuole membrane and the cell
    surface? The compartment changed three times in this family while the chemistry did not,
    which makes it a good system for asking what constrains enzyme localisation independently
    of catalysis.
suggested_experiments:
- hypothesis: The GO:0004721 phosphoprotein phosphatase annotation rests on the use of alkaline
    phosphatase as a reagent rather than on a directed assay of phoA against a protein substrate.
  description: Retrieve the full text of PMID:8634266 and determine whether alkaline phosphatase
    appears as an assay subject or as a dephosphorylation reagent for the neurofilament tail
    domains. If the latter, the two annotations drawn from it should be re-sourced -- GO:0004035
    to PMID:13826559, which supports it properly, and GO:0004721 withdrawn. This is a records
    check rather than a laboratory experiment, and it is the single highest-value action on
    this gene's annotation.
  experiment_type: literature verification
- hypothesis: Phosphite oxidation by BAP is measurable in vivo under phosphate limitation
    and contributes to phosphorus acquisition when phosphite is the sole P source.
  description: Compare growth and hydrogen evolution of phn-deleted E. coli carrying or lacking
    phoA on phosphite as sole phosphorus source, under phosphate starvation conditions that
    induce the pho regulon. This would establish whether the activity reported on purified
    enzyme has any physiological weight, and would settle whether a hydrogen biosynthesis
    process term is warranted.
  experiment_type: bacterial growth and genetics
