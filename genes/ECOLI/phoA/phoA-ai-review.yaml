- term:
    id: GO:0004035
    label: alkaline phosphatase activity
  evidence_type: IDA
  original_reference_id: PMID:8634266
  qualifier: enables
  review:
    summary: The term is unimpeachable but the citation is almost certainly wrong. The cited
      paper is an infrared spectroscopy study of coiled-coil recognition in intermediate filament
      proteins -- desmin, neurofilament L and H -- and the string "alkaline phosphatase" does
      not occur anywhere in the cached record. Its only contact with phosphatases is that
      neurofilament tail domains were examined in phosphorylated and dephosphorylated forms,
      which in that era would routinely have been achieved using alkaline phosphatase as a
      reagent.
    action: ACCEPT
    reason: Accepted because the assertion is beyond doubt for this protein and is independently
      supported by PMID:13826559, by the EC mapping and by the IBA, so nothing rests on this
      citation. The row is nonetheless a citation problem rather than a functional one, and
      it is recorded as such in the reference review. If the paper did use alkaline phosphatase
      as a dephosphorylation reagent, that is using the enzyme as a tool, which is thin ground
      for an IDA even though it technically demonstrates the activity.
- term:
    id: GO:0004721
    label: phosphoprotein phosphatase activity
  evidence_type: IDA
  original_reference_id: PMID:8634266
  qualifier: enables
  review:
    summary: 'The same coiled-coil infrared spectroscopy paper, and here it is the sole support
      for a substantive functional claim: that E. coli alkaline phosphatase acts as a protein
      phosphatase. That claim is not trivial. BAP is a broad-specificity small-molecule phosphomonoesterase,
      and treating a phosphoprotein with it in vitro is a standard laboratory manipulation
      rather than evidence of a physiological protein-phosphatase role.'
    action: UNDECIDED
    reason: This is exactly the case the undecided action exists for. The cached record is
      abstract-only and never mentions alkaline phosphatase, so I cannot verify what was done;
      the project's standard forbids removing an experimental annotation on that basis. But
      unlike the alkaline phosphatase activity row above, this term has no independent support
      for phoA, so accepting it would leave a functional claim resting entirely on a citation
      I cannot confirm. A curator with the full text should check whether the paper contains
      a direct assay of phoA against a phosphoprotein or merely used it as a reagent; the
      two justify very different annotations, and only the first would justify this term.
