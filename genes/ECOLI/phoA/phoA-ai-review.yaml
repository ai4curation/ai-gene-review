- id: PMID:8634266
  title: 'Specific recognition of coiled coils by infrared spectroscopy: analysis of the three
    structural domains of type III intermediate filament proteins.'
  findings: []
  reference_review:
    relevance: NONE
    correctness: UNVERIFIED
    review_notes: 'The most serious citation problem in this gene''s record. Cited as the
      IDA source for two molecular function terms on E. coli alkaline phosphatase, but the
      paper is an infrared spectroscopy study of coiled-coil structure in desmin and neurofilament
      proteins, and the string "alkaline phosphatase" does not appear anywhere in the cached
      record. Its only contact with phosphatases is that neurofilament tail domains were examined
      in phosphorylated and dephosphorylated forms, which in 1996 would routinely have been
