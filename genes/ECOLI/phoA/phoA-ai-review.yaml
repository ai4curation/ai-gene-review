id: P00634
gene_symbol: phoA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli (strain K12)
description: 'phoA encodes bacterial alkaline phosphatase (BAP), the founding and best-characterised
  member of the alkaline phosphatase family and one of the most intensively studied enzymes
  in molecular biology. It is a homodimeric zinc metalloenzyme carrying two Zn(2+) and one
  Mg(2+) per active site, which hydrolyses phosphate monoesters non-specifically through a
  covalent phosphoseryl intermediate on Ser102 of the mature protein. Unlike its animal relatives
  it is not membrane-anchored: it is synthesised with a cleavable signal peptide, exported
  across the inner membrane by the Sec translocase and folded in the periplasm, where it can
  be released by lysozyme spheroplasting. Its physiological role is phosphate scavenging under
  phosphate limitation, liberating inorganic phosphate from organic phosphomonoesters in the
  periplasm for uptake.

  The protein is a workhorse of methodology as much as of physiology. Its signal sequence
  is the canonical model substrate for studying Sec-dependent export, its crystal structure
  defined the family fold and metal centre, and its use as a reporter and as a dephosphorylation
  reagent is ubiquitous. That last role is a hazard for its own annotation: several entries
  in its GO record trace to papers that used alkaline phosphatase as a laboratory tool rather
  than studying it. BAP also carries a genuinely surprising side activity, oxidising phosphite
  to phosphate with evolution of molecular hydrogen, though two to three orders of magnitude
  more slowly than it hydrolyses phosphate esters.'
