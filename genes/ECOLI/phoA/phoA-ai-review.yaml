- term:
    id: GO:0030613
    label: oxidoreductase activity, acting on phosphorus or arsenic in donors
  evidence_type: IDA
  original_reference_id: PMID:15148399
  qualifier: enables
  review:
    summary: 'From the discovery that BAP is responsible for the phn-independent phosphite
      oxidation pathway in E. coli. Highly purified enzyme, confirmed as BAP by N-terminal
      sequencing, oxidises phosphite to phosphate with evolution of molecular hydrogen. The
      term is the right description of the chemistry: phosphite, a phosphorus-containing group,
      acts as the electron donor.'
    action: KEEP_AS_NON_CORE
    reason: 'Genuine and directly demonstrated, so it should not be removed, but it is firmly
      a side activity rather than a core function. The paper''s own numbers make the point:
      phosphite oxidation runs at 62-242 milliunits per milligram while phosphate ester hydrolysis
      on the same preparation runs at 41-61 units per milligram, two to three orders of magnitude
      faster. This is catalytic promiscuity in an enzyme with a permissive active site, notable
      enough that the authors called it unprecedented, and it does not displace phosphomonoester
      hydrolysis as what the enzyme is for.'
    supported_by:
    - reference_id: PMID:15148399
      supporting_text: Highly purified BAP catalyzed Pt oxidation with specific activities
        of 62-242 milliunits/mg and phosphate ester hydrolysis with specific activities of
        41-61 units/mg.
