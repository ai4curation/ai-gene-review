  review:
    summary: Acetyltransferase activity assigned by UniRule UR000083172 (HAMAP MF_00295). E. coli MetA is
      succinyl-CoA-specific and cannot use acetyl-CoA, so the term is wrong.
    action: REMOVE
    reason: Contradicted by direct biochemistry (UniProt records that the enzyme cannot use acetyl-CoA,
      ECO:0000269 PubMed:10572016) and by four experimental succinyltransferase rows. The UniRule cause is a
      swap of GO cross-references between two case rules of UR000083172 (retrieved from rest.uniprot.org
      2026-11-13); the succinyl case, which assigns the succinyl reaction, EC 2.3.1.46, gene name metAS and
      the O-succinylhomoserine pathway to this entry, carries GO:0004414, while the acetyl (metAA) case
      carries GO:0008899. The same rule therefore gives every succinyl MetA a false acetyltransferase term,
      and every acetyl MetA a false succinyltransferase term.
    supported_by:
    - reference_id: file:ECOLI/metA/metA-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: Cannot use acetyl-CoA (PubMed:10572016).
    - reference_id: PMID:10572016
      supporting_text: In Escherichia coli, this activation is accomplished via a succinylation reaction catalyzed
        by homoserine transsuccinylase.
    source_defects:
    - defect_type: WRONG_TERM
      resource: UNIPROT
      record: UniRule:UR000083172
      requested_change: REPOINT
      asserted_value: GO:0004414
      corrected_value: GO:0008899
      corrected_label: homoserine O-succinyltransferase activity
      cause: OTHER
      confidence: CONFIRMED
      explanation: >-
        In UniRule UR000083172 (HAMAP MF_00295, MetA family), the case rule that annotates
        "Homoserine O-succinyltransferase" (EC 2.3.1.46, gene metAS, succinyl-CoA reaction RHEA:22008) lists
        GO:0004414 homoserine O-acetyltransferase activity, and the case rule that annotates "Homoserine
        O-acetyltransferase" (EC 2.3.1.31, gene metAA) lists GO:0008899 homoserine O-succinyltransferase
        activity. The GO cross-references of the two cases appear swapped; the companion rule UR000083175
        (MF_00296) pairs them correctly. Effect on E. coli MetA (P07623), which cannot use acetyl-CoA
        (PMID:10572016), is a false GO:0004414 IEA (GO_REF:0000104).
