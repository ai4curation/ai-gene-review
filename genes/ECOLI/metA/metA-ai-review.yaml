- id: PMID:10572016
  title: 'Enzyme-catalyzed acylation of homoserine: mechanistic characterization of
    the Escherichia coli metA-encoded homoserine transsuccinylase.'
  findings:
  - statement: E. coli MetA succinylates homoserine from succinyl-CoA by a ping-pong mechanism through an
      active-site cysteine.
    supporting_text: This suggests the presence of an active site cysteine which forms a succinyl-cysteine
      intermediate during enzymatic turnover.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only cache. Defining kinetic study; the "cannot use acetyl-CoA" result is from the
      full text as recorded by UniProt (ECO:0000269).
- id: PMID:17302437
  title: Identification of catalytic cysteine, histidine, and lysine residues in Escherichia
    coli homoserine transsuccinylase.
  findings:
  - statement: Cys142 is the catalytic nucleophile, His235 is essential, and Lys47 acts in the first half
      reaction.
    supporting_text: Mutation of cysteine-142 to serine or alanine eliminated all measurable activity, suggesting
      this amino acid acts as the catalytic nucleophile.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only cache; mutagenesis plus kinetics on purified E. coli enzyme.
- id: PMID:17442255
  title: Assessing the roles of essential functional groups in the mechanism of homoserine succinyltransferase.
  findings:
  - statement: Defines the Cys-His-Glu catalytic triad and residues that bind homoserine and succinyl-CoA.
    supporting_text: An active site arginine orients the carboxyl moiety of homoserine, while the carboxyl moiety
      of succinyl-CoA is positioned for catalysis by a lysine residue.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only cache.
- id: PMID:28581482
  title: Parallel evolution of non-homologous isofunctional enzymes in methionine biosynthesis.
  findings:
  - statement: MetA and MetX families are phylogenetically unrelated and acyl-donor use does not follow family
      membership.
    supporting_text: Members of these families are prone to incorrect annotation because MetX and MetA enzymes
      are assumed to always use acetyl-CoA and succinyl-CoA, respectively.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only cache. E. coli MetA served as a succinyl-CoA reference; gene-level detail taken
      from UniProt's citation.
- id: PMID:12453224
  title: In vivo aggregation of a single enzyme limits growth of Escherichia coli at elevated temperatures.
  findings:
  - statement: MetA aggregates above 44 degrees C in vitro and in vivo, and this aggregation limits growth at
      high temperature in minimal medium.
    supporting_text: Homoserine trans-succinylase (HTS), the first enzyme in the methionine biosynthetic pathway,
      aggregates at temperatures higher than 44 degrees C in vitro.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only cache. Physiological significance of MetA thermolability.
- id: PMID:35084172
  title: Rational Engineering of Homoserine O-Succinyltransferase from Escherichia coli for Reduced Feedback
    Inhibition by Methionine.
  findings:
  - statement: E. coli HST is noncompetitively inhibited by methionine (Ki 2.44 mM); the crystal structure
      shows the homoserine and succinyl-CoA sites.
    supporting_text: The enzyme kinetic experiments of EcHST revealed that the enzyme is noncompetitively inhibited
      by methionine with a Ki value of 2.44 mM
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only cache. Supports feedback inhibition by methionine.
