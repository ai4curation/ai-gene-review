suggested_questions:
- question: Is thermal aggregation of MetA a regulated control of methionine flux under heat or oxidative stress,
    or only an incidental weakness of the protein?
- question: Which bacterial lineages below the PTHR20919 PAINT node PTN000467771 carry acetyl-CoA-specific MetA,
    and should the IBD for homoserine O-succinyltransferase activity be placed lower in the tree?
suggested_experiments:
- description: Compare growth at 37 and 44 degrees C, and methionine pools, of E. coli strains expressing wild-type
    MetA or stabilised MetA variants, with and without methionine supplementation.
  experiment_type: genetics and metabolite measurement
