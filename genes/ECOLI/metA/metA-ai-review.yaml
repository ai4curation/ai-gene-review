  label: Escherichia coli K-12
description: >-
  metA (metAS, b4013) encodes homoserine O-succinyltransferase (homoserine transsuccinylase,
  EC 2.3.1.46) of Escherichia coli, the founding member of the MetA family, a fold unrelated to the
  alpha/beta-hydrolase MetX acyltransferases. The cytoplasmic homodimer transfers the succinyl group of
  succinyl-CoA to the gamma-hydroxyl of L-homoserine by a ping-pong mechanism through a succinyl-cysteine
  intermediate (Cys142, with His235 and Glu237 completing the catalytic triad), forming O-succinyl-L-homoserine,
  the first committed step of methionine biosynthesis; the product is converted to cystathionine by MetB.
  The enzyme does not use acetyl-CoA. MetA is a key control point of the pathway. It is feedback-inhibited by
  methionine, its transcription is repressed by methionine, and the protein is intrinsically thermolabile,
  aggregating above about 44 degrees C in a way that limits growth of E. coli in minimal medium at elevated
  temperature.
