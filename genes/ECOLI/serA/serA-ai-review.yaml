- id: PMID:29494135
  title: Elucidation of a Self-Sustaining Cycle in Escherichia coli l-Serine Biosynthesis
    That Results in the Conservation of the Coenzyme, NAD<sup/>.
  findings:
  - statement: >-
      E. coli PGDH couples 3-phosphoglycerate oxidation to 2-oxoglutarate reduction, with SerC
      regenerating 2-oxoglutarate, so NAD+ is conserved during serine synthesis without an
      exogenous coenzyme pool.
    supporting_text: >-
      the cycle can be maintained by production of αKG by the second enzyme in the pathway,
      PSAT, and does not require any additional enzymes.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only; establishes the physiological role of the 2-oxoglutarate reductase activity.
- id: PMID:7719856
  title: The allosteric ligand site in the Vmax-type cooperative enzyme phosphoglycerate
    dehydrogenase.
  findings:
  - statement: Crystal structure of E. coli PGDH; three domains, tetramer, serine sites in the
      regulatory domain.
    supporting_text: >-
      the serine effector site is provided by the regulatory domain of each of two subunits.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
- id: PMID:8550422
  title: A novel alpha-ketoglutarate reductase activity of the serA-encoded 3-phosphoglycerate
    dehydrogenase of Escherichia coli K-12 and its possible implications for human
    2-hydroxyglutaric aciduria.
  findings:
  - statement: >-
      Purified SerA catalyses 3-phosphoglycerate oxidation and, at a comparable rate,
      2-oxoglutarate reduction to 2-hydroxyglutarate.
    supporting_text: >-
      were the major in vitro activities of the SerA enzyme.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only cache; kinetic constants also recorded in UniProt with this PMID.
- id: PMID:8771194
  title: A model for the regulation of D-3-phosphoglycerate dehydrogenase, a Vmax-type
    allosteric enzyme.
  findings:
