- term:
    id: GO:0120568
    label: (R)-2-hydroxyglutarate (NAD+) dehydrogenase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - RHEA:49612
  - EC:1.1.1.399
  review:
    summary: Electronic (R)-2-hydroxyglutarate dehydrogenase / 2-oxoglutarate reductase activity.
    action: KEEP_AS_NON_CORE
    reason: >-
      Experimentally established for E. coli SerA: 2-oxoglutarate reduction (kcat 33.3 s-1,
      Km 88 uM) is as fast as the physiological 3-phosphooxypyruvate reduction, D-2-hydroxyglutarate
      is the preferred hydroxyglutarate isomer, and the reaction is coupled to SerC in an
      NAD-conserving cycle during serine synthesis. It is a genuine secondary activity of the
      enzyme, not its pathway role, so it is kept as non-core.
    supported_by:
    - reference_id: PMID:8550422
      supporting_text: >-
        Unexpectedly, we found that the SerA enzyme catalyzes a previously undetected reduction
        of alpha-ketoglutarate (alpha KG) to 2-hydroxyglutaric acid
