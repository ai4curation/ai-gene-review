- term:
    id: GO:0047545
    label: (S)-2-hydroxyglutarate dehydrogenase activity
  evidence_type: IDA
  original_reference_id: PMID:8550422
  qualifier: enables
  review:
    summary: L-2-hydroxyglutarate is oxidized by purified SerA, but weakly.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Both hydroxyglutarate isomers were substrates of the purified enzyme, so the activity is
      real in vitro. The (S)-isomer reaction is poor (Km 2.9 mM, kcat 0.25 s-1, against Km 0.37
      mM for the (R)-isomer), and the physiologically meaningful side reaction is 2-oxoglutarate
      reduction, captured by GO:0120568. In vitro activity of unknown relevance is marked as an
      over-annotation rather than removed, since the curator's assay is sound.
    supported_by:
