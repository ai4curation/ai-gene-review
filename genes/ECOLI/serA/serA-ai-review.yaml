gene_symbol: serA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  SerA is the NAD+-dependent D-3-phosphoglycerate dehydrogenase (EC 1.1.1.95) of Escherichia
  coli, a cytosolic homotetramer of the D-isomer-specific 2-hydroxyacid dehydrogenase family
  with substrate-binding, nucleotide-binding and C-terminal ACT regulatory domains. It catalyses
  the first, committed step of the phosphorylated pathway of L-serine biosynthesis, the
  oxidation of 3-phospho-D-glycerate to 3-phosphooxypyruvate, a reaction whose equilibrium lies
  far toward 3-phosphoglycerate and is pulled forward by the downstream transaminase SerC. L-serine
  binds at the interface of adjacent ACT domains and inhibits the enzyme allosterically by
  lowering Vmax, making SerA the classic V-type feedback-regulated enzyme. SerA also reduces
  2-oxoglutarate to 2-hydroxyglutarate at rates comparable to its physiological reaction; coupled
  to SerC, which regenerates 2-oxoglutarate, this lets the enzyme recycle tightly bound NADH
  during serine synthesis.
