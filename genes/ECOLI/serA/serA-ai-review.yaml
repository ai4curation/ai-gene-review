suggested_questions:
- question: >-
    How much of in vivo SerA flux runs through the 2-oxoglutarate/NADH recycling cycle, and does
    E. coli accumulate D-2-hydroxyglutarate when SerC is limiting?
suggested_experiments:
- description: >-
    Measure intracellular D- and L-2-hydroxyglutarate in wild-type, serA ACT-domain
    (serine-insensitive) and serC-limited strains by chiral LC-MS to test whether the SerA
    2-oxoglutarate reductase activity operates in vivo.
