taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: PtsO (NPr) is a soluble histidine phosphocarrier in the E. coli nitrogen-regulatory PTS.
  It receives phosphate from PtsP and transfers it to a histidine in PtsN, coupling the PEP-fed entry
  reaction to phosphostate-dependent regulatory outputs. Phosphate exchange with carbohydrate-PTS proteins
  has also been demonstrated in vitro. Dephosphorylated NPr interacts with the lipid A biosynthetic enzyme
  LpxD, linking its phosphostate to an additional regulatory output whose catalytic mechanism is less
  directly established than the relay.
