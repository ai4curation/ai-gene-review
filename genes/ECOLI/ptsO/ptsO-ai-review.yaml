suggested_questions:
- question: Is LpxD inhibition by dephosphorylated NPr conserved outside the enterobacteria, for example
    in Pseudomonas, where NPr also feeds PtsN?
suggested_experiments:
- description: Measure LpxD acyltransferase activity in vitro with purified NPr, phospho-NPr and an H16A
    NPr variant to test direct, phosphostate-dependent inhibition.
  experiment_type: enzyme inhibition assay
proposed_new_terms:
- proposed_name: PTS histidyl phosphocarrier activity
  proposed_definition: Accepting a phosphoryl group on an active-site histidine from a phosphoenolpyruvate-dependent
    enzyme I-type protein and transferring it to the histidine of an EIIA-type domain, as performed by
    HPr-family phosphocarriers of the phosphoenolpyruvate-dependent phosphotransferase system, including
    the NPr carrier of the nitrogen-regulatory branch.
  justification: GO has no molecular-function term for the HPr/NPr phosphocarrier step; the generic GO:0016775
    (phosphotransferase activity, nitrogenous group as acceptor) is used as a stand-in. A dedicated term
    would let HPr and NPr carry an informative activity without implying sugar transport.
  proposed_parent:
    id: GO:0016775
    label: phosphotransferase activity, nitrogenous group as acceptor
  supported_by:
  - reference_id: PMID:7876255
    supporting_text: 'Purified IIANtr and NPr exchange phosphate appropriately with Enzyme I, HPr, and
      Enzyme IIA proteins of the phosphoenolpyruvate: sugar phosphotransferase system.'
