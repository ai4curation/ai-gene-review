taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: PtsO (NPr) is the HPr-family phosphocarrier of the nitrogen-regulatory phosphotransferase
  system (PTS(Ntr)) of Escherichia coli, encoded in the rpoN operon. It is phosphorylated on His16 by
  enzyme I(Ntr) (PtsP), which does not phosphorylate HPr, and transfers the phosphoryl group to the regulatory
  EIIA(Ntr) protein PtsN. The chain runs in parallel to the sugar-transport PTS; NPr can exchange phosphate
  with sugar-PTS proteins in vitro but has no sugar-transport role. In its dephosphorylated form NPr also
  binds LpxD and is proposed to restrain lipid A synthesis.
