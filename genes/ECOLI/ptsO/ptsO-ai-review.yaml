- term:
    id: GO:0009401
    label: phosphoenolpyruvate-dependent sugar phosphotransferase system
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN002135312
  - UniProtKB:O50515
  - UniProtKB:P0AA04
  review:
    summary: In-vitro phosphate exchange does not establish a native sugar-uptake process.
    action: MARK_AS_OVER_ANNOTATED
    reason: 'PTN002135312 is the cached sugar-PTS IBD. Purified NPr can exchange phosphate with carbohydrate
      components, so an absolute absence claim would be unwarranted. The characterized native role is
      the PtsP–NPr–PtsN relay; in-vitro cross-reactivity does not alone establish coupled sugar uptake
      in vivo. The retrieved tree places P0A9N0/PTN002135339 under this35-leaf IBD alongside carbohydrate-HPr
      lineages. Native quantitative contribution is not established as a physiological role; no cached
      negative assertion or invented loss node is used. The action discriminator is target evidence, not
      species labels or donor count: P. putida has a native sugar-independent route and a documented failure
      of PtsN to replace fructose EIIA; Caulobacter separates its Ntr effectors from sugar permeases and
      its mannose assignments originate in an incorrect transporter EC mapping. E. coli has measured cross-system
      phosphate exchange in vitro but lacks demonstrated native sugar-uptake participation for the Ntr
      branch, so physiological process assignment is over-annotation rather than an absolute negative.
      Bona fide E. coli/Bacillus HPr controls retain the sugar process because they feed sugar-specific
      EIIA proteins in the native carbohydrate route; common ancestry at PTN002135312 does not erase this
      functional divergence.'
    supported_by:
    - reference_id: PMID:7876255
      supporting_text: 'Purified IIANtr and NPr exchange phosphate appropriately with Enzyme I, HPr, and
        Enzyme IIA proteins of the phosphoenolpyruvate: sugar phosphotransferase system.'
    - reference_id: PMID:10473571
      supporting_text: EI(Ntr) was shown to phosphorylate NPr in vitro using either a [(32)P]PEP-dependent
        protein phosphorylation assay or a quantitative sugar phosphorylation assay.
    propagation_review:
      root_cause: UNRESOLVED
