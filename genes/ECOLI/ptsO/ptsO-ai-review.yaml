  review:
    summary: Dephosphorylated NPr binds LpxD; the bare binding term is replaced by the regulatory activity
      the paper proposes.
    action: MODIFY
    reason: 'Per the protein-binding policy the uninformative GO:0005515 row is replaced. The paper reports
      a direct NPr-LpxD interaction and, in its own words, "our data suggest" that unphosphorylated NPr
      inhibits LpxD (UDP-3-O-acyl-glucosamine N-acyltransferase): the conclusion rests on the interaction
      plus the increased rifampin resistance and LPS synthesis of a ptsO deletion, not on a direct LpxD
      activity assay in the cached abstract. The inhibitor term is therefore a hedged, accessory, phosphorylation-state-dependent
      output of NPr, not its core relay function.'
    proposed_replacement_terms:
