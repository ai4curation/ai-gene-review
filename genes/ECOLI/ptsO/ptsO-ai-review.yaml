  review:
    summary: Dephosphorylated NPr binds LpxD; the bare binding term is replaced by the regulatory
      activity the paper proposes.
    action: MODIFY
    reason: "Per the protein-binding policy the uninformative GO:0005515 row is replaced. The paper reports
      a direct NPr-LpxD interaction and, in its own words, \"our data suggest\" that unphosphorylated
      NPr inhibits LpxD (UDP-3-O-acyl-glucosamine N-acyltransferase): the conclusion rests on the interaction
      plus the increased rifampin resistance and LPS synthesis of a ptsO deletion, not on a direct LpxD
      activity assay in the cached abstract. The inhibitor term is therefore a hedged, accessory, phosphorylation-state-dependent
      output of NPr, not its core relay function. This refinement follows the functional interpretation
      made by this row's own publication. It is not described as a purified-enzyme inhibition assay or
      promoted into the core phosphocarrier function; the complete article remains unavailable here."
    proposed_replacement_terms:
    - id: GO:0004857
      label: enzyme inhibitor activity
    supported_by:
    - reference_id: PMID:21605551
      supporting_text: Taken together, our data suggest that unphosphorylated NPr decreases lipid A
        biosynthesis by inhibiting LpxD activity.
