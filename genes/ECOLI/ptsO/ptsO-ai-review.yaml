suggested_questions:
- question: What fraction of native phosphotransfer follows the canonical PtsP–NPr–PtsN route versus
    condition-dependent cross-system exchange, and how does this affect the target-specific
    regulatory outputs?
- question: Does NPr directly inhibit purified LpxD catalysis, and what interaction/phosphostate
    determinants separate that output from phosphate transfer to PtsN?
proposed_new_terms:
- proposed_name: PTS histidyl phosphocarrier activity
  proposed_definition: Accepting a phosphoryl group on an active-site histidine from a
    phosphoenolpyruvate-dependent enzyme I-type protein and transferring it to the histidine of an
    EIIA-type domain, as performed by HPr-family phosphocarriers of the
    phosphoenolpyruvate-dependent phosphotransferase system, including the NPr carrier of the
    nitrogen-regulatory branch.
  justification: GO has no molecular-function term for the HPr/NPr phosphocarrier step; the generic
    GO:0016775 (phosphotransferase activity, nitrogenous group as acceptor) is used as a stand-in. A
    dedicated term would let HPr and NPr carry an informative activity without implying sugar
    transport.
  proposed_parent:
    id: GO:0016775
    label: phosphotransferase activity, nitrogenous group as acceptor
  supported_by:
  - reference_id: PMID:7876255
    supporting_text: 'Purified IIANtr and NPr exchange phosphate appropriately with Enzyme I, HPr, and
      Enzyme IIA proteins of the phosphoenolpyruvate: sugar phosphotransferase system.'
