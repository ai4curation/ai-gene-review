- description: 'Provide structural and conformational support to the LptDE translocon: promote LptD
    oxidative maturation and stabilize gate/domain states compatible with LPS insertion. This is a
    contribution of the assembled complex, not autonomous LPS flux or disulfide catalysis; physiological
    importance is conditional on the cellular background.'
