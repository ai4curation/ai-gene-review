    summary: LptM promotes oxidative maturation and assembly of the LptDE translocon.
    action: ACCEPT
    reason: Direct BW25113-derived biochemical and cellular assays show stabilized LptD conformations,
      native disulfide maturation and altered BAM residence after lptM loss. LptM supplies structural/conformational
      work in outer-membrane assembly; it is not merely a substrate whose absence prevents an outcome.
      The later mature-translocon role adds to, rather than negates, this assembly function.
