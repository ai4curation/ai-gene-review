  label: Escherichia coli K-12
description: LptM (formerly YifL) is an Escherichia coli outer-membrane lipoprotein that associates with LptD and LptE. It stabilizes a translocon conformation favorable for LptD disulfide maturation and efficient release from the BAM assembly machinery. In the mature translocon, its lipidated N-terminal region contacts the LptD lateral gate and promotes conformational changes that facilitate LPS access. Its contribution becomes especially important when oxidative folding or Lpt-bridge function is perturbed.
