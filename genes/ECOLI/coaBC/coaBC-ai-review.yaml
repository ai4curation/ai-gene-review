- description: >-
    Compare coupled and uncoupled turnover of full-length CoaBC with mixtures of separately expressed
    CoaB and CoaC domains using labeled 4'-phosphopantothenoylcysteine as a competing intermediate.
  experiment_type: enzyme kinetics with isotope dilution
