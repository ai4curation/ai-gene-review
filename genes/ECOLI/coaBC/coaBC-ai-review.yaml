  review:
    summary: >-
      CoaBC uses a pantothenate-derived intermediate in CoA biosynthesis; it does not break down pantothenate.
    action: REMOVE
    reason: >-
      GO:0015941 pantothenate catabolic process is defined as the breakdown of pantothenate. CoaBC elongates
