id: P0ABQ0
gene_symbol: coaBC
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  coaBC (dfp, b3639) encodes the bifunctional flavoprotein that converts 4'-phosphopantothenate to 4'-phosphopantetheine,
  the second and third steps of CoA biosynthesis in Escherichia coli. Its C-terminal CoaB domain is a
  CTP-dependent phosphopantothenate--cysteine ligase that forms 4'-phosphopantothenoylcysteine via a 4'-phosphopantothenoyl-CMP
  intermediate, and its N-terminal CoaC domain is an FMN-dependent homo-oligomeric flavin-containing cysteine
  decarboxylase (HFCD family) that decarboxylates the product to 4'-phosphopantetheine. The cytosolic
  protein forms a homododecamer assembled by the CoaC domain and binds one FMN per subunit. coaBC is essential;
  the conditional dfp-707 allele, first found as a DNA-synthesis mutant, destabilizes the protein, and
  pantethine can bypass coaBC loss in E. coli.
