- question: Does the carboxylesterase activity of FrmB toward short-chain esters have any physiological
    substrate, or is it incidental to the S-formylglutathione hydrolase active site?
suggested_experiments:
- description: Metabolomic profiling of frmB, yeiG and frmB yeiG mutants with and without formaldehyde,
