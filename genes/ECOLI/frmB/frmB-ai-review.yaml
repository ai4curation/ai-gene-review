  label: Escherichia coli K-12
description: FrmB (YaiM) is a cytosolic S-formylglutathione hydrolase of Escherichia coli, an esterase
  D-family alpha/beta hydrolase with a Ser-His-Asp catalytic triad. It hydrolyzes S-formylglutathione,
  the product of the class III alcohol dehydrogenase FrmA, to formate and glutathione, completing glutathione-dependent
  formaldehyde detoxification and regenerating the glutathione carrier. frmB lies in the frmRAB operon
  and is strongly induced by formaldehyde; the constitutive paralog YeiG provides a redundant activity,
  and both genes must be deleted to sensitize cells to formaldehyde. Purified FrmB also hydrolyzes short-chain
  p-nitrophenyl esters and alpha-naphthyl acetate.
