suggested_questions:
- question: >-
    Is hemD essential in E. coli, or can strains lacking it survive on spontaneous
    cyclization products plus exogenous heme, given that siroheme also depends on
    uroporphyrinogen III?
suggested_experiments:
- hypothesis: Loss of HemD causes uroporphyrin I accumulation and combined heme and siroheme deficiency.
  description: >-
    Construct a conditional hemD depletion strain and measure uroporphyrin I/III isomers,
    heme content and sulfite reductase (siroheme-dependent) activity, with heme and
    cysteine supplementation as controls.
