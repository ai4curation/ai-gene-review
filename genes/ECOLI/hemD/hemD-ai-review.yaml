  label: Escherichia coli K-12
description: >-
  HemD is uroporphyrinogen-III synthase (co-synthase) of Escherichia coli. It takes the
  linear tetrapyrrole hydroxymethylbilane (pre-uroporphyrinogen) made by porphobilinogen
  deaminase (HemC, encoded by the adjacent gene) and cyclizes it with inversion of the
  terminal D ring, producing the asymmetric macrocycle uroporphyrinogen III rather than
  the uroporphyrinogen I isomer that forms spontaneously without the enzyme.
  Uroporphyrinogen III is the last common intermediate of all E. coli tetrapyrroles: it is
  decarboxylated by HemE toward protoporphyrin IX and heme, or methylated by CysG toward
  siroheme. The enzyme is a soluble monomer of about 28 kDa with high affinity for its
  substrate.
