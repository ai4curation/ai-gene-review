    correctness: VERIFIED
    review_notes: Abstract-only cache; establishes the UMPylase activity and Mn2+ dependence with
      the YdiU protein and crystal structures (6K20, 6LNA). Mechanistic work in Salmonella, but
      activity confirmed for the conserved domain.
- id: PMID:35532215
  title: Switching off Bacterial Flagellar Biogenesis by YdiU-Mediated UMPylation of FlhDC.
  findings:
  - statement: YdiU UMPylates FlhC Ser31, abolishing FlhDC DNA binding and flagellar gene
      expression; E. coli FlhDC was used for the in vitro UMPylation.
    supporting_text: YdiU efficiently catalyzed the UMPylation of FlhC
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text; FlhDC and FlhC mutants from E. coli K-12 MG1655 used in vitro,
      so the UMPylase activity is demonstrated on an E. coli substrate.
- id: PMID:35532216
  title: Salmonella Facilitates Iron Acquisition through UMPylation of Ferric Uptake Regulator.
  findings:
  - statement: YdiU UMPylates Fur His118, disrupting Fur dimers and derepressing iron uptake;
      the in vitro assay used E. coli YdiU and E. coli Fur.
    supporting_text: we used the E. coli homologous proteins (Fur and YdiU) for in vitro
      validation
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text; explicitly validates UMPylation with E. coli YdiU and Fur, which is
      why this review treats the UMPylase activity as established for P77649.
