  title: The YdiU Domain Modulates Bacterial Stress Signaling through Mn(2+)-Dependent
    UMPylation.
  findings:
  - statement: YdiU/SelO catalyses Mn2+-dependent UMPylation of protein Tyr/His residues; auto-
      AMPylation padlocks the chaperone-UMPylation activity.
