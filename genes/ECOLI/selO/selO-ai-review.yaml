  label: Escherichia coli K-12
description: >-
  SelO (YdiU) is a conserved protein nucleotidyltransferase with a protein-kinase-like fold in
  which ATP is bound in a flipped orientation; it is a catalytically active pseudokinase. It
  transfers a nucleotidyl group from a nucleoside triphosphate to hydroxyl or imidazole side
  chains of target proteins. With ATP and Mg2+ it AMPylates Ser, Thr and Tyr residues (for example
  auto-AMPylation and AMPylation of SucA and the glutaredoxin GrxA), linking it to redox
  homeostasis and the oxidative-stress response. With UTP and Mn2+ it instead UMPylates Tyr, His
  and Ser residues; characterised UMPylation targets include the chaperones GroEL, DnaK, HtpG and
  ClpB, the flagellar master regulator FlhDC (FlhC Ser31) and the ferric-uptake regulator Fur
  (His118), through which it reprogrammes stress signalling, motility and iron acquisition.
  Auto-AMPylation switches off its chaperone-UMPylation activity.
