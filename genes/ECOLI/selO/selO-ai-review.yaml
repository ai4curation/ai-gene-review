proposed_new_terms:
- proposed_name: protein UMPylase activity (protein uridylyltransferase)
  proposed_definition: >-
    Catalysis of the transfer of a UMP (uridine 5'-monophosphate) group from UTP to a hydroxyl
    (Ser, Thr, Tyr) or imidazole (His) side chain of a protein substrate, releasing diphosphate
    (protein UMPylation / uridylylation). Distinct from [protein-PII] uridylyltransferase activity
    (GO:0008773), which is specific to the PII nitrogen-regulatory protein.
  justification: >-
    SelO/YdiU catalyses protein UMPylation (RHEA:64604 Ser, RHEA:83887 Tyr, RHEA:83891 His), a
    general protein-modifying uridylyltransferase activity with no matching GO term. GO:0008773 is
    PII-specific (glutamine-synthetase signalling) and GO:0070733 AMPylase is the ATP-donor
    sibling, so neither fits. Requested as a child of GO:0070569 uridylyltransferase activity,
    parallel to AMPylase activity (GO:0070733).
  proposed_parent:
    id: GO:0070569
    label: uridylyltransferase activity
  proposed_mappings:
  - predicate: skos:broadMatch
    target_term:
      id: RHEA:64604
      label: 'L-seryl-[protein] + UTP = O-(5''-uridylyl)-L-seryl-[protein] + diphosphate'
  supported_by:
  - reference_id: PMID:32966796
    supporting_text: YdiU as an enzyme that catalyzes the covalent attachment of
      uridine-5'-monophosphate to a protein tyrosine/histidine residue, an unusual modification
      defined as UMPylation
suggested_questions:
- question: Which E. coli proteins are the physiological AMPylation versus UMPylation targets, and
    how does the Mg2+/ATP versus Mn2+/UTP balance in the cell switch SelO between its two
    activities in vivo?
suggested_experiments:
- hypothesis: E. coli SelO regulates motility and iron uptake through UMPylation of FlhDC and Fur
    in its native host, as shown in Salmonella.
  description: Compare flagellar gene expression, motility and iron-uptake gene transcription in
    E. coli wild-type, ydiU deletion and a catalytically dead ydiU (D-to-A) strain under oxidative
    and iron-limiting stress, with mass-spectrometric mapping of endogenous UMPylation sites.
