core_functions:
- description: >-
    MurNAc 6-phosphate etherase: cleaves the D-lactyl ether of MurNAc 6-phosphate to give
    GlcNAc 6-phosphate and D-lactate, the shared step of catabolism of external MurNAc
    (after MurP uptake) and of recycled 1,6-anhydro-MurNAc from the cell's own
    peptidoglycan (after AnmK phosphorylation).
  proposed_molecular_function: N-acetylmuramic acid 6-phosphate etherase activity
  directly_involved_in:
  - id: GO:0097173
    label: N-acetylmuramic acid catabolic process
  - id: GO:0097175
    label: 1,6-anhydro-N-acetyl-beta-muramic acid catabolic process
  - id: GO:0009254
    label: peptidoglycan turnover
  substrates:
  - id: CHEBI:58722
    label: N-acetylmuramate 6-phosphate
  supported_by:
  - reference_id: PMID:15983044
    supporting_text: Purified MurQ-His6 fusion protein and extracts of cells expressing
      murQ both catalyze the cleavage of MurNAc 6-phosphate, with GlcNAc 6-phosphate and
      D-lactate being the primary products.
  - reference_id: PMID:16452451
    supporting_text: MurQ and AnmK kinase are required for utilization of anhydro-MurNAc
      derived either from cell wall murein or imported from the medium.
proposed_new_terms:
- proposed_name: N-acetylmuramic acid 6-phosphate etherase activity
  proposed_definition: >-
    Catalysis of the reaction: N-acetyl-D-muramate 6-phosphate + H2O =
    N-acetyl-D-glucosamine 6-phosphate + (R)-lactate.
  justification: >-
    MurQ (EC 4.2.1.126, RHEA:26410) is a well-characterized enzyme of bacterial
    peptidoglycan recycling and MurNAc catabolism, found in many bacteria (HAMAP
    MF_00068, NCBIfam TIGR00274), but GO has no term for it; annotations currently fall
    back to ether hydrolase activity or carbon-oxygen lyase activity. EC places the
    reaction under hydro-lyases, but the mechanism is elimination of lactate followed by
    hydration rather than release of water, so carbon-oxygen lyase activity
    (GO:0016835) is proposed as the parent.
  proposed_parent:
    id: GO:0016835
