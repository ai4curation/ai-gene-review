  label: Escherichia coli K-12
description: >-
  MurQ is the N-acetylmuramic acid 6-phosphate (MurNAc 6-phosphate) etherase of E. coli
  (EC 4.2.1.126), a cytoplasmic homodimeric enzyme with a SIS-type sugar-phosphate
  binding fold related to the N-terminal domain of glucokinase regulatory protein. It
  cleaves the D-lactyl ether substituent at C3 of MurNAc 6-phosphate, giving
  N-acetylglucosamine 6-phosphate (GlcNAc 6-phosphate) and D-lactate, by syn elimination
  of lactate to an unsaturated aldehyde intermediate followed by addition of water; Glu83
  and Glu114 are essential catalytic residues. MurQ is the only MurNAc 6-phosphate
  etherase in E. coli and is the point where two pathways merge: catabolism of external
  MurNAc taken up and phosphorylated by the PTS transporter MurP, and recycling of
  1,6-anhydro-MurNAc released from the cell's own peptidoglycan and phosphorylated by
  the kinase AnmK. The GlcNAc 6-phosphate produced feeds the nag pathway to fructose
  6-phosphate or amino sugar reuse. murQ is the first gene of the murQP operon, repressed
  by MurR and induced by MurNAc 6-phosphate, with additional activation by cAMP-CAP; low
  basal expression suffices for recycling, whereas growth on MurNAc as sole carbon source
  requires induction.
