- id: PMID:18723630
  title: The transcriptional factors MurR and catabolite activator protein regulate
    N-acetylmuramic acid catabolism in Escherichia coli.
  findings:
  - statement: Cell wall recycling and MurNAc utilization merge at MurNAc 6-phosphate,
      and MurQ is required for both.
