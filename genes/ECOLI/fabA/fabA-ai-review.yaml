- id: PMID:7592873
  title: Enoyl-acyl carrier protein reductase (fabI) plays a determinant role in completing
    cycles of fatty acid elongation in Escherichia coli.
  findings:
  - statement: >-
      Purified FabA dehydrates beta-hydroxybutyryl-ACP to crotonyl-ACP, but the
      equilibrium favours the hydroxyacyl substrate, so FabI pulls the cycle.
    supporting_text: >-
      Unlike the other enzymes in the cycle, FabA did not efficiently convert its
      substrate beta-hydroxybutyryl-ACP to crotonyl-ACP, but rather the equilibrium
      favored formation of beta-hydroxybutyryl-ACP over crotonyl-ACP by a ratio of 9:1.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: In vitro reconstitution with purified FAS-II enzymes including FabA (abstract only).
- id: PMID:8805534
  title: 'Structure of a dehydratase-isomerase from the bacterial pathway for biosynthesis
    of unsaturated fatty acids: two catalytic activities in one active site.'
  findings:
  - statement: >-
      FabA is a symmetric hot-dog-fold dimer whose two active sites lie between the
      subunits; a histidine and an aspartate catalyse both reactions.
    supporting_text: >-
      Dehydrase is a symmetric dimer with an unusual alpha+beta 'hot dog' fold. Each
      of the two independent active sites is located between the two subunits of the
      enzyme
  - statement: A two-base mechanism catalyses dehydration and isomerisation in one active site.
    supporting_text: >-
      A two-base mechanism by which the histidine and aspartic acid together catalyze
      dehydration and isomerization reactions is consistent with the active-site
      structure.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Crystal structure of E. coli FabA, free and inactivator-modified (abstract only).
- id: PMID:8910376
  title: Roles of the FabA and FabZ beta-hydroxyacyl-acyl carrier protein dehydratases
    in Escherichia coli fatty acid biosynthesis.
  findings:
  - statement: FabA dehydrates saturated beta-hydroxyacyl-ACPs of short to long chain length.
    supporting_text: >-
      FabA was most active on intermediate chain length beta-hydroxyacyl-ACPs and
      also possessed significant activity toward both short and long chain saturated
      beta-hydroxyacyl-ACPs.
  - statement: FabA is virtually inactive on long-chain unsaturated beta-hydroxyacyl-ACP.
    supporting_text: >-
      FabA was virtually inactive in the dehydration of long chain unsaturated
      beta-hydroxyacyl-ACP.
  - statement: FabA introduces the double bond at C10, detected only with FabB present.
    supporting_text: >-
      The introduction of the double bond at the 10-carbon stage of fatty acid
      synthesis by FabA was only detected in the presence of beta-ketoacyl-ACP
      synthase I (FabB).
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Reconstitution of FAS-II with purified FabA and FabZ (abstract only).
