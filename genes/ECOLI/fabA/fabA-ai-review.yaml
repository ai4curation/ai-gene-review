- id: PMID:2195995
  title: Escherichia coli beta-hydroxydecanoyl thioester dehydrase reacts with native
    C10 acyl-acyl-carrier proteins of plant and bacterial origin.
  findings:
  - statement: >-
      Purified FabA (dehydrase) interconverts beta-hydroxydecanoyl-, trans-2-decenoyl-
      and cis-3-decenoyl-ACP, reaching the same equilibrium from each substrate.
    supporting_text: >-
      Both E. coli acyl-ACP and recombinant acyl-ACP-I as cosubstrates with beta-OH
      10:0, trans-2 10:1, or cis-3 10:1 yielded about equal amounts (37 mol%) of the
      two monoenes regardless of the initial substrate.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Direct assay of both FabA reactions on native C10 acyl-ACPs (abstract only).
