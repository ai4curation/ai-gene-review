suggested_questions:
- question: >-
    How is the partition of trans-2-decenoyl-ACP between FabA isomerisation and FabI
    reduction set in vivo, and how much of the control lies in FabB's affinity for
    cis-3-decenoyl-ACP rather than in FabA itself?
suggested_experiments:
- description: >-
    Measure in vivo acyl-ACP pools and unsaturated/saturated fatty acid ratios in
    strains with titrated FabA, FabB and FabI levels to determine which enzyme
    controls flux into the unsaturated branch.
