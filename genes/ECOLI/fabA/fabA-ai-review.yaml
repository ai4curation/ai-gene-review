id: P0A6Q3
gene_symbol: fabA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  FabA is the 3-hydroxydecanoyl-[acyl-carrier-protein] dehydratase/isomerase
  (beta-hydroxydecanoyl thioester dehydrase) of the dissociated type II fatty
  acid synthase of Escherichia coli. It is a soluble cytosolic homodimer with the
  hot-dog fold, in which each of the two active sites is formed between the
  subunits and contains a histidine from one subunit and an aspartate from the
  other. FabA has two activities in the same active site. It dehydrates
  (3R)-hydroxyacyl-ACP intermediates to (2E)-enoyl-ACP (EC 4.2.1.59), being most
  active on intermediate chain lengths and active on saturated substrates up to
  C16 but virtually inactive on long-chain unsaturated substrates, a role shared
  with the second dehydratase FabZ. Uniquely, it also isomerises
  (2E)-decenoyl-ACP to (3Z)-decenoyl-ACP (EC 5.3.3.14), the branch point that
  introduces the cis double bond of the unsaturated fatty acids. The
  cis-3-decenoyl-ACP product is then elongated by FabB, and fabA mutants are
  auxotrophic for unsaturated fatty acids. fabA transcription is activated by
  FadR and repressed by FabR, and the enzyme is irreversibly inactivated by the
  mechanism-based inhibitor 3-decynoyl-N-acetylcysteamine.
