id: P30749
gene_symbol: moaE
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  MoaE is the large, catalytic subunit of molybdopterin (MPT) synthase in Escherichia coli. Two
  MoaE subunits form a central dimer to which two MoaD sulfur-carrier subunits bind, giving the
  MoaD2-MoaE2 heterotetramer in which the C terminus of each MoaD is inserted into a MoaE active
  site. Using the C-terminal thiocarboxylates of two MoaD subunits as sulfur donors, MoaE converts
  cyclic pyranopterin monophosphate (cPMP, precursor Z) into molybdopterin by forming its
  cis-dithiolene, the group that later ligates molybdenum (EC 2.8.1.12). Precursor Z binds in a
  conserved pocket at the MoaE dimer interface; Lys119 is essential for activity. MoaE is
  cytoplasmic, is stable as a homodimer between catalytic cycles, and is encoded in the moaABCDE
  operon (historical allele chlA5). It is the bacterial counterpart of human MOCS2B.
