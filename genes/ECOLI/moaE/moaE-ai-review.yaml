suggested_questions:
- question: How does MoaE coordinate the two sequential sulfur transfers (C-2' then C-1') from
    the two MoaD subunits, and is a monosulfurated intermediate released between them in vivo?
suggested_experiments:
- hypothesis: MPT synthase uses both MoaD subunits sequentially on one precursor Z molecule.
  description: Mix wild-type and Gly81-variant MoaD in heterotetramers with MoaE and follow
    intermediate and MPT formation by HPLC and mass spectrometry.
