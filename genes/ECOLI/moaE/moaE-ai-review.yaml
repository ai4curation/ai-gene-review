    Catalytic subunit of molybdopterin synthase: within the MoaD2-MoaE2 heterotetramer, MoaE binds
    precursor Z (cPMP) at its dimer interface and uses the thiocarboxylated C termini of two MoaD
    subunits to form the cis-dithiolene of molybdopterin.
