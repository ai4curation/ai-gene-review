id: P13016
gene_symbol: ampD
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  AmpD is a cytoplasmic zinc-dependent amidase that acts in peptidoglycan
  recycling. It specifically hydrolyses the amide bond between the lactyl group
  of 1,6-anhydro-N-acetylmuramic acid and the alpha-amino group of L-alanine in
  the anhydromuropeptides that are produced by lytic transglycosylases and
  imported into the cytoplasm by AmpG. By releasing the stem peptide from the
  anhydro-sugar, AmpD separates the two salvage arms of recycling and, because
  the resulting muropeptide pool is the effector for AmpC beta-lactamase
  induction in many Gram-negative bacteria, loss of AmpD causes cytoplasmic
  anhydromuropeptide accumulation and derepressed beta-lactamase expression.
