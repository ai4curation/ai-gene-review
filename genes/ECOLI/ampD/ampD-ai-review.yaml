  review:
    summary: AmpD is a soluble cytoplasmic enzyme that processes imported muropeptides.
    action: ACCEPT
    reason: >-
      AmpD acts on anhydromuropeptides after their AmpG-mediated import into the
      cytoplasm, so cytoplasmic localization is the compartment of its activity.
      UniProt records an experimentally supported cytoplasmic location
      (ECO:0000305|PubMed:19309146) and the sequence carries no signal peptide or
      transmembrane segment, consistent with a soluble cytoplasmic amidase.
