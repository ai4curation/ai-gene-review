      supported_by:
        - reference_id: PMID:7487336
          supporting_text: >-
            Both DsbA and the recently described DipZ protein were shown to be
            essential for cytochrome c synthesis, suggesting that they act
            sequentially in a pathway for cytochrome c assembly in the E. coli
            periplasm.
