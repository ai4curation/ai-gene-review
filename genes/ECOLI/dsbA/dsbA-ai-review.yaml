      - reference_id: PMID:19766568
        supporting_text: >-
          Our visualization of the steps of co-translational formation of the
          disulfide bond provides direct evidence that disulfide bond formation
          by a thioredoxin superfamily member proceeds through a
          mixed-disulfide complex between the enzyme and its folding substrate
          in vivo.
