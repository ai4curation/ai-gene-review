status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: DsbA is the major periplasmic thiol-disulfide oxidoreductase that introduces disulfide bonds
  into newly exported Escherichia coli proteins. The mature enzyme resides in the periplasm, donates its
  active-site disulfide to pairs of cysteines in substrate proteins during oxidative folding, and is regenerated
  by the inner-membrane redox protein DsbB.
existing_annotations:
- term:
    id: GO:0003756
    label: protein disulfide isomerase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN002185589
  - UniProtKB:P0AEG4
  review:
    summary: Reduced DsbA has measured disulfide-isomerization activity outside its principal oxidative
      role.
    action: KEEP_AS_NON_CORE
    reason: GO:0003756 describes rearrangement, and PMID:8155639 directly measured breaking and re-forming
      two disulfides in misfolded IGF-I by reduced DsbA (Km 43 microM; kcat 0.2 min-1; uncatalyzed rate
      undetectable). This is a genuine, condition-dependent molecular capability, not merely a historical
      isomerase name or an insulin-reduction proxy. Native E. coli division of labor assigns DsbA chiefly
      to oxidation and DsbC to isomerization, so retain this precise activity outside the core. The original
      PMID:1934062 full text remains inaccessible; its abstract explicitly supports insulin reduction,
      while the independent quantitative assay establishes the isomerization claim.
    supported_by:
    - &id001
      reference_id: PMID:8155639
      supporting_text: DsbA can catalyze the conversion of a stable misfolded protein, misfolded IGF-I
        (mis-IGF-I), to its correctly folded conformation under physiological conditions. This conversion
        is the result of breaking and re-forming two disulfide bonds.
    - &id002
      reference_id: PMID:8155639
      supporting_text: Kinetic analysis of the reaction yielded a Km of 43 microM and a kcat of 0.2 min-1.
    - &id003
      reference_id: PMID:8917542
      supporting_text: our data suggest that the enzymes DsbA and DsbC play distinct roles in the cell
        in disulfide bond formation and isomerization, respectively.
