      label: protein binding
    evidence_type: IPI
    original_reference_id: PMID:17110337
    qualifier: enables
    supporting_entities:
      - UniProtKB:P0A6M2
    review:
      summary: >-
        The DsbB-DsbA structure captures a true reaction complex, but generic
        protein binding does not describe DsbA's catalytic role.
      action: REMOVE
      reason: >-
        This crystal structure supports the DsbA-DsbB redox relay and is not
        being rejected as a physical interaction. GO:0005515 is removed because
        a generic binding row loses the biochemical content: in this complex,
        DsbA is the reduced product/substrate of the inner-membrane DsbB
        electron-transfer enzyme.
      supported_by:
        - reference_id: PMID:17110337
          supporting_text: >-
            DsbB is an E. coli membrane protein that oxidizes DsbA, a
            periplasmic dithiol oxidase.
  - term:
      id: GO:0005515
      label: protein binding
    evidence_type: IPI
    original_reference_id: PMID:18775700
    qualifier: enables
    supporting_entities:
      - UniProtKB:P0A6M2
    review:
      summary: >-
        A trapped ternary DsbB-quinone-DsbA intermediate supports DsbA-DsbB
        electron transfer rather than generic protein binding as a function.
      action: REMOVE
      reason: >-
        The DsbA-DsbB association detected here is a covalent reaction
        intermediate in DsbB-dependent reoxidation of DsbA. The binding
        observation is real, but GO:0005515 is mechanistically uninformative
        and should not be retained as a DsbA molecular function.
      supported_by:
        - reference_id: PMID:18775700
          supporting_text: >-
            Here, we report the preparation of a kinetically stable ternary
            complex between wild-type DsbB, containing all essential cysteines,
            Q8 and DsbA covalently bound to DsbB.
