proposed_new_terms:
- proposed_name: tRNA uridine(34) hydroxylase activity
  proposed_definition: >-
    Catalysis of the reaction: uridine(34) in tRNA + AH2 + O2 = 5-hydroxyuridine(34) in tRNA + A +
    H2O. The wobble uridine of tRNA is hydroxylated at C5 using molecular oxygen as the oxygen-atom
    donor, forming ho5U34, the first intermediate of 5-carboxymethoxyuridine (cmo5U) biosynthesis.
  justification: >-
    This is the activity of TrhO (RHEA:64224) and the TrhP-independent aerobic route to ho5U34.
    GO has no specific term: an OLS search for "tRNA 5-hydroxyuridine" returns no molecular-function
    class, so TrhO is annotated only to the general GO:0016705 (checked 2026-11-24). Requested as a
    child of GO:0016705 and of catalytic activity acting on a tRNA.
  proposed_parent:
    id: GO:0016705
    label: oxidoreductase activity, acting on paired donors, with incorporation or reduction of
      molecular oxygen
  proposed_mappings:
  - predicate: skos:exactMatch
    target_term:
      id: RHEA:64224
      label: uridine(34) in tRNA + AH2 + O2 = 5-hydroxyuridine(34) in tRNA + A + H2O
  supported_by:
  - reference_id: file:ECOLI/trhO/trhO-uniprot.txt
    record_section: ["CC:CATALYTIC ACTIVITY"]
    supporting_text: Reaction=uridine(34) in tRNA + AH2 + O2 = 5-hydroxyuridine(34) in tRNA
suggested_questions:
- question: What is the physiological reductant (AH2) and the precise role of the rhodanese
    active-site cysteine persulfide in the TrhO hydroxylation mechanism, given that it is not a
    canonical Fe(II)/2-oxoglutarate dioxygenase?
suggested_experiments:
- hypothesis: The active-site cysteine persulfide of TrhO is directly involved in O2 activation
    for U34 hydroxylation.
  description: Reconstitute ho5U formation with wild-type and C200A/C200S TrhO under 18O2, tracking
    hydroxyl-oxygen incorporation by RNA mass spectrometry, and test candidate reductants.
