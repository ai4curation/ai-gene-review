id: P24188
gene_symbol: trhO
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  TrhO (formerly YceA) is a cytoplasmic rhodanese-family tRNA uridine(34) hydroxylase of
  Escherichia coli. It catalyses the oxygen-dependent conversion of the wobble uridine (U34) of
  certain tRNAs to 5-hydroxyuridine (ho5U), using molecular O2 as the source of the hydroxyl
  oxygen; ho5U34 is the first step in the biosynthesis of 5-carboxymethoxyuridine (cmo5U) and its
  methyl ester (mcmo5U). It has a rhodanese domain with an active-site cysteine that forms a
  persulfide intermediate. TrhO works in parallel with the prephenate-dependent enzyme TrhP: each
  can make ho5U34, and only loss of both abolishes cmo5U, which causes a temperature-sensitive
  growth defect and inefficient decoding of G-ending codons. TrhO provides the aerobic route.
