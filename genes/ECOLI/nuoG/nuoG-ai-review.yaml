- term:
    id: GO:0010181
    label: FMN binding
  evidence_type: IDA
  original_reference_id: PMID:7607227
  qualifier: contributes_to
  review:
    summary: >-
      Complex I contains one non-covalently bound FMN, but the FMN site is in
      NuoF, not NuoG.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The paper shows FMN in the purified complex and in the three-subunit
      NADH dehydrogenase fragment (NuoE, F, G), "one of them bearing FMN".
      Structural work places the FMN in NuoF. FMN binding is a binding
      function of NuoF, and contributes_to a binding activity is not a
      meaningful claim for a neighbouring subunit. Not removed because it is an
      experimental row from a paper whose full text is not cached, but it
      overstates NuoG's role.
    supported_by:
    - reference_id: PMID:7607227
      supporting_text: One of these fragments is a water-soluble NADH
        dehydrogenase fragment which is composed of three subunits bearing at
        least four iron-sulfur clusters (N1b, N1c, N3 and N4) that can be
        reduced with NADH, one of them bearing FMN.
    - reference_id: PMID:18603533
      supporting_text: The primary electron acceptor of complex I is a
        noncovalently bound flavin mononucleotide (FMN) located in the NuoF
        subunit.
