suggested_questions:
- question: >-
    Did the cofactor-free molybdopterin-like C-terminal domain of NuoG retain any
    function (structural scaffolding, assembly) beyond its evolutionary origin
    from a formate dehydrogenase-like ancestor?
- question: >-
    What is the reduction potential of the His(Cys)3-ligated cluster N5 in the
    intact E. coli complex, and does it limit electron flux?
suggested_experiments:
- description: >-
    Delete or swap the C-terminal molybdopterin-like domain and the E. coli
    G-loop of NuoG and measure complex I assembly, stability and NADH:quinone
    activity in membranes.
  experiment_type: domain deletion mutagenesis
