- term:
    id: GO:1902600
    label: proton transmembrane transport
  evidence_type: IEA
  original_reference_id: GO_REF:0000108
  qualifier: involved_in
  supporting_entities:
  - GO:0008137
  review:
    summary: >-
      Inferred from the proton-pumping complex I activity; NuoG supplies
      electrons that drive coupled proton translocation by the membrane arm.
    action: MODIFY
    reason: >-
      The proton transport of complex I is driven by electron transfer, which
      GO represents as GO:0015990 electron transport coupled proton transport
      (is_a descendant of GO:1902600). NuoG is a peripheral, non-membrane
      subunit and contributes the electron-transfer side of the coupling; the
      more specific process describes that role better.
    proposed_replacement_terms:
    - id: GO:0015990
      label: electron transport coupled proton transport
    supported_by:
    - reference_id: file:ECOLI/nuoG/nuoG-uniprot.txt
      supporting_text: Couples the redox reaction to proton translocation (for
        every two electrons transferred, four hydrogen ions are translocated
        across the cytoplasmic membrane), and thus conserves the redox energy in
        a proton gradient.
