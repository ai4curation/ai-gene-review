core_functions:
- description: >-
    Relays electrons from the FMN site of NuoF through its [2Fe-2S] (N1b) and
    [4Fe-4S] (N4, N5) clusters towards NuoI and NuoB within the peripheral arm
    of plasma-membrane complex I, contributing to proton-pumping
    NADH:ubiquinone oxidoreduction.
  molecular_function:
    id: GO:0009055
    label: electron transfer activity
  contributes_to_molecular_function:
    id: GO:0008137
    label: NADH dehydrogenase (ubiquinone) activity
  directly_involved_in:
