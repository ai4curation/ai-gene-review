  qualifier: enables
  review:
    summary: >-
      NuoG's clusters N1b, N4 and N5 form part of the main intramolecular
      electron-transfer path of complex I.
    action: NEW
    reason: >-
      Relaying electrons between the FMN site of NuoF and NuoI/NuoB through its
      own iron-sulfur clusters is the subunit's direct molecular activity, and
      the module uses electron transfer activity as NuoG's leaf function. GOA
      carries cluster binding and the complex activity but not this
      subunit-level activity. Cluster N7 is excluded from this role
      (PMID:17489563).
    supported_by:
