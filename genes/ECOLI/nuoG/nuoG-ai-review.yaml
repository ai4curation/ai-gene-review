id: P33602
gene_symbol: nuoG
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  NuoG is the largest subunit (75 kDa family; NDUFS1/Nqo3 type) of the
  peripheral NADH dehydrogenase (N) module of proton-pumping NADH:quinone
  oxidoreductase (NDH-1, respiratory complex I), which projects from the
  cytoplasmic face of the inner membrane. Its N-terminal region binds one
  [2Fe-2S] cluster (N1b) and three [4Fe-4S] clusters: N4 and the
  His(Cys)3-ligated N5 lie on the main electron-transfer path that carries
  electrons from the FMN of NuoF towards NuoI and the terminal cluster N2 of
  NuoB, whereas cluster N7, specific to some bacteria including E. coli, lies
  off the path and is needed for complex stability rather than electron
  transfer. The C-terminal region is homologous to the molybdopterin-binding
  domains of formate dehydrogenase/nitrate reductase-type enzymes but carries
  no molybdenum cofactor, and in E. coli an additional insertion loop
  stabilises the peripheral-arm interfaces. NuoG is essential for complex I
  assembly and activity.
