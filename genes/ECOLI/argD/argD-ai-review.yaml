id: P18335
gene_symbol: argD
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: 'ArgD is a bifunctional PLP-dependent class-III aminotransferase of Escherichia coli with
  N-acetylornithine aminotransferase (ACOAT) activity in L-arginine biosynthesis and N-succinyl-LL-diaminopimelate
  aminotransferase (SDAP-AT, the activity historically assigned to dapC) activity in the succinylated
  diaminopimelate route of L-lysine biosynthesis, with similar specificity constants for both substrates.
  Both activities are redundant in vivo: AstC, GabT and PuuE also act as ACOATs, and AstC and SerC as
  SDAP-ATs. The soluble enzyme is a homodimer.'
