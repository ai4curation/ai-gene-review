core_functions:
- description: >-
    Non-catalytic accessory component of the cytosolic Ubi metabolon: as the
    UbiJ-UbiK2 heterotrimer with the SCP2-domain lipid-binding protein UbiJ,
    UbiK supports assembly and efficient operation of the complex that
    performs the late, aerobic ring-tailoring reactions of ubiquinone
    biosynthesis.
