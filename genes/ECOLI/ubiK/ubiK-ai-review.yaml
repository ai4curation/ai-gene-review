suggested_questions:
- question: >-
    What is the molecular contribution of UbiK within the UbiJ-UbiK2
    heterotrimer: does it dock the metabolon onto the inner membrane, position
    UbiJ's C-terminal helix, or recruit specific Ubi enzymes?
- question: >-
    Why is UbiK dispensable for anaerobic ubiquinone synthesis when it is
    still expressed under anaerobiosis?
suggested_experiments:
- hypothesis: UbiK is required for assembly of the 1-MDa Ubi complex.
  description: >-
    Compare the size and composition of the Ubi complex purified from wild
    type and ubiK cytoplasmic extracts by native size-exclusion chromatography
    and quantitative proteomics, and test whether UbiK mutations that break
    the UbiJ interaction phenocopy the deletion.
- hypothesis: The UbiJ-UbiK2 heterotrimer mediates contact of the metabolon with the inner membrane.
  description: >-
    Measure binding of purified UbiJ-UbiK2 (and UbiJ alone) to liposomes of E.
    coli inner-membrane lipid composition, and test the membrane-proximal
    residues predicted by modelling by mutagenesis and UQ8 quantification.
