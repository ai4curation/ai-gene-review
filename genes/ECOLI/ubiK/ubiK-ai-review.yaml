    summary: >-
      Interactions of UbiK with UbiJ and with other Ubi proteins (UbiE, UbiX,
      UbiG, UbiH, UbiI, UbiF) reported by Loiseau et al. 2017.
    action: REMOVE
    reason: >-
      The interactions are real and biologically meaningful: UbiK forms a
      complex with the C-terminal part of UbiJ and associates with the Ubi
      enzymes. But bare GO:0005515 protein binding carries no functional
      information, and no more informative molecular function term is
      established for UbiK (its biochemical role is described by the authors as
      unknown). Following the protein-binding policy the row is removed; the
      biological content is captured instead by the ubiquinone biosynthesis
      complex (GO:0110142) membership row. Removal does not mean the reported
      interactions are false.
