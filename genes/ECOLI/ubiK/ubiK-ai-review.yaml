id: Q46868
gene_symbol: ubiK
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  UbiK (formerly YqiC) is a small (96-residue), soluble coiled-coil protein of
  Escherichia coli that is required for efficient aerobic ubiquinone (coenzyme
  Q8) biosynthesis but has no known catalytic activity. It forms homotrimers on
  its own and, in cells, a UbiJ-UbiK2 heterotrimer with the C-terminal part of
  the SCP2-domain protein UbiJ; this heterotrimer is one of the two accessory
  components of the roughly 1-MDa cytosolic Ubi metabolon that also contains
  the ring-tailoring enzymes UbiE, UbiF, UbiG, UbiH and UbiI and carries out the
  last six reactions of the pathway. ubiK mutants accumulate the early
  intermediate octaprenylphenol and lose most ubiquinone under aerobiosis, but
  UbiK is dispensable for anaerobic ubiquinone synthesis and for menaquinone
  synthesis. UbiK is proposed to act as an assembly or targeting factor, and
  modelling places the UbiJ-UbiK2 heterotrimer at the interface between the
  metabolon and the inner membrane. In Salmonella, ubiK is required for
  proliferation in macrophages and virulence in mice.
