- term:
    id: GO:0016020
    label: membrane
  evidence_type: IDA
  original_reference_id: PMID:30686758
  qualifier: located_in
  review:
    summary: >-
      Membrane association of UbiK reported in the Ubi metabolon paper
      (full text not cached; abstract stresses the soluble fraction).
    action: KEEP_AS_NON_CORE
    reason: >-
      The cached abstract emphasises that UbiK and the Ubi complex are soluble,
      but the EcoCyc curator read the full text, where a membrane-associated
      fraction was recorded; we defer to that experimental call rather than
      remove it. Multiscale modelling independently places the UbiJ-UbiK2
      heterotrimer in close contact with the membrane, as the probable
      interface for release of newly made UQ into the membrane. A peripheral
      membrane association is therefore plausible but secondary to the
      cytosolic location where the metabolon operates. GO:0016020 is not made
      more specific because neither source shows an integral or inner-membrane
      residence.
    supported_by:
    - reference_id: PMID:36142227
      supporting_text: >-
        Our data show that UbiJ-UbiK2 interacts closely with the membrane and
        suggests possible pathways to enable the release of UQ into the
        membrane.
