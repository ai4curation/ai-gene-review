gene_symbol: nirB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: NirB is the catalytic large subunit of the soluble cytoplasmic NADH-dependent nitrite reductase
  NirBD in Escherichia coli. It uses FAD, siroheme and iron-sulfur centers to reduce nitrite to ammonium.
  In anaerobic nitrate-fed growth, upstream respiratory nitrate reduction supplies nitrite and NirBD can
  provide ammonium for nitrogen assimilation. NirBD also supports fermentative ammonification and limits
  nitrite-associated nitrosative stress. These functions are distinct from the nitrate-to-nitrite reaction
  itself.
