- id: PMID:11243831
  title: 'Acetohydroxyacid synthase: a proposed structure for regulatory subunits supported by evidence
    from mutagenesis.'
  findings:
  - statement: IlvH associates with IlvI and is required for full catalytic activity and valine sensitivity.
    supporting_text: The SSU (encoded by ilvH) associates with the large subunit and is required for full
      catalytic activity and valine sensitivity.
  - statement: IlvI alone has 3-5% of holoenzyme activity and is valine-insensitive.
    supporting_text: Its large subunit (encoded by ilvI) by itself has 3-5 % activity of the holoenzyme
      and is not sensitive to inhibition by valine.
  - statement: Isolated IlvH binds valine.
    supporting_text: The isolated SSU binds valine.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only. Mutagenesis and reconstitution of the E. coli AHAS III small subunit;
      the key evidence for its regulator role.
