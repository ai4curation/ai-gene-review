taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: IlvH is the small, regulatory subunit of acetohydroxy-acid synthase isozyme III (AHAS III,
  IlvIH) of Escherichia coli, one of three AHAS isozymes of the species and, with AHAS I, one of the two
  expressed in strain K-12. It has an N-terminal ACT domain that binds L-valine and a C-terminal domain,
  associates with the thiamine-diphosphate-dependent catalytic subunit IlvI, is required for full catalytic
  activity (IlvI alone has a few percent of holoenzyme activity) and confers valine feedback inhibition.
  The cytosolic IlvI-IlvH holoenzyme catalyses the first committed step of branched-chain amino acid biosynthesis,
  forming 2-acetolactate from pyruvate or, with a strong preference, 2-aceto-2-hydroxybutanoate from pyruvate
  and 2-oxobutanoate for isoleucine synthesis.
