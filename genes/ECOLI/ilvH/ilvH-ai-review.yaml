suggested_questions:
- question: What is the role of the IlvH C-terminal domain, absent from IlvN, in binding IlvI and in transmitting
    valine inhibition?
- question: Should the PAINT assertion of enables GO:0003984 on PTN000767018 be changed to contributes_to,
    given that the seeds are holoenzyme assays?
suggested_experiments:
- description: Reconstitute IlvI with IlvH truncations lacking the C-terminal domain and measure activation,
    valine binding and valine inhibition.
  experiment_type: enzyme reconstitution and domain truncation
