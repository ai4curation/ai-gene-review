- id: PMID:2675968
  title: Kinetics and mechanism of acetohydroxy acid synthase isozyme III from Escherichia coli.
  findings:
  - statement: AHAS III forms acetohydroxybutyrate about 40-fold more readily than acetolactate at equal
      substrate concentrations.
    supporting_text: was found to be 40 +/- 3 under a wide variety of conditions
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only (truncated). Kinetics of the AHAS III holoenzyme; activity belongs to
      the IlvIH complex, not to IlvH alone.
- id: PMID:4612003
  title: Structural genes for a newly recognized acetolactate synthase in Escherichia coli K-12.
  findings:
  - statement: ilvH mutations make the IlvIH acetolactate synthase valine-resistant, and the ilvH product
      restores valine sensitivity to purified IlvI enzyme.
    supporting_text: The activity of the ilvH gene product has been measured by adding an extract containing
      it to a purified ilvI acetolactate synthase, which, upon incubation, became more sensitive to valine
      inhibition.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only. Genetic identification of ilvIH as AHAS III and of ilvH as the valine-sensitivity
      determinant.
