    summary: As part of AHAS III (IlvIH), ilvH contributes to the first step of L-isoleucine biosynthesis
      (2-acetohydroxybutyrate formation).
    action: NEW
    reason: UniProt places the complex at step 1/4 of isoleucine biosynthesis and the IBA/IEA rows already
      assert the parallel valine step; GOA lacks the isoleucine process. The small subunit is an integral,
      required component of the enzyme that performs the step, consistent with the PTHR30239 family review,
      which extends its valine reasoning to GO:1901705, and with the P. putida IlvH review. AHAS III strongly
      favours acetohydroxybutyrate formation over acetolactate (R about 40), making it a major isoleucine-branch
      isozyme.
    supported_by:
