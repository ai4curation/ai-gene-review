  review:
    summary: ilvH is the non-catalytic regulatory subunit of AHAS III (IlvIH); it activates and confers
      valine sensitivity on the IlvI catalytic subunit.
    action: MODIFY
    reason: ilvH encodes the small ACT-domain subunit of AHAS III (IlvIH); the thiamine-diphosphate and
      FAD-dependent catalytic site is in the large subunit IlvI, and the small subunit stimulates that
      activity and confers valine feedback inhibition. "Enables acetolactate synthase activity" therefore
      transfers the holoenzyme's catalysis to a non-catalytic subunit (complex-activity transfer). The
      essence of the row, that the subunit is required for and shapes acetolactate formation, is sound,
      so the row is modified to the specific regulator activity the gene already carries (GO:1990610);
      the core function records contributes_to GO:0003984 for the holoenzyme. This reconciles the P. putida
      IlvH review (catalysis resides in the large subunit) and the yeast ILV6 review (regulator MF with
      contributes_to acetolactate synthase activity), and is applied identically to E. coli ilvN and ilvH.
      The PAINT node PTN000767018 is seeded by the experimental rows of E. coli IlvH and IlvN themselves
      (not circular); the PTHR30239 family review keeps the node placement but flags the "enables" qualifier
      as unresolved for exactly this reason.
