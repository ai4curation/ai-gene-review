  review:
    summary: ilvH contributes to the first step of branched-chain amino acid synthesis as part of AHAS
      III (IlvIH).
    action: MODIFY
    reason: Correct but general. The AHAS holoenzyme, of which this subunit is an integral and required
      component, catalyses the first step of both the valine (acetolactate) and the isoleucine (acetohydroxybutyrate)
      routes, so both specific descendants are listed; L-valine biosynthesis is already carried and L-isoleucine
      biosynthesis is added as NEW. The subunit does part of the work of the step (it is required for
      full holoenzyme activity), so this is participation, not mere regulation from outside.
