suggested_questions:
- question: Does E. coli RNase R associate with RNase E under cold or stationary conditions, as RNase
    R does in the Pseudomonas syringae degradosome?
suggested_experiments:
- hypothesis: RNase R binds the RNase E scaffold in E. coli at low temperature.
  description: Co-immunoprecipitate RNase R with RNase E from cells grown at 15 C and 37 C, with pnp deletion
    as a sensitising background.
