id: P21499
gene_symbol: rnr
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: RNase R (rnr, formerly vacB) is a processive, hydrolytic 3'-to-5' exoribonuclease of the
  RNase II/R family in Escherichia coli that releases 5'-nucleoside monophosphates and, unlike RNase II,
  digests through extensive RNA secondary structure when a single-stranded 3' extension is available.
  It removes structured mRNA decay fragments (e.g. REP-containing), acts with PNPase in rRNA quality control,
  contributes to maturation of tmRNA and other structured RNAs, and is strongly induced and stabilized
  under cold shock and other stresses. It also has an RNase-independent helicase activity in vitro.
