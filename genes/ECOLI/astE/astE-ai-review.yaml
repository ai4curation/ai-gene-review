id: P76215
gene_symbol: astE
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  astE (b1744) encodes succinylglutamate desuccinylase (EC 3.5.1.96) of Escherichia coli, a zinc-dependent
  amidohydrolase of the AspA/AstE family. It hydrolyzes N-succinyl-L-glutamate to L-glutamate and succinate,
  the fifth and last reaction of the ammonia-producing arginine succinyltransferase (AST) pathway encoded
  by the nitrogen- and sigma S-regulated astCADBE operon, returning the succinyl carrier as succinate
  and releasing glutamate.
