  review:
    summary: >-
      Ester-bond hydrolase activity from InterPro IPR055438 (AstE/AspA catalytic domain) via UniRule.
    action: REMOVE
    reason: >-
      AstE cleaves the C-N amide bond of N-succinyl-L-glutamate, not an ester bond; the mapping is chemically
      wrong for this enzyme and for the AstE family. Treated identically on the KT2440 AstE review.
    supported_by:
    - *id002
    source_defects:
    - defect_type: WRONG_TERM
      resource: UNIPROT
      record: UniRule:UR000100077
      requested_change: DELETE_VALUE
      asserted_value: GO:0016788
      corrected_value: GO:0016811
      corrected_label: >-
        hydrolase activity, acting on carbon-nitrogen (but not peptide) bonds, in linear amides
      cause: OTHER
      confidence: CONFIRMED
      explanation: >-
        Succinylglutamate desuccinylase (EC 3.5.1.96, RHEA:15169) hydrolyzes an amide bond. The ester-bond
        hydrolase GO term attached through UniRule UR000100077 / InterPro IPR055438 contradicts the EC
        class 3.5 reaction and should be dropped or replaced by GO:0016811.
