- term:
    id: GO:0004365
    label: glyceraldehyde-3-phosphate dehydrogenase (NAD+) (phosphorylating) activity
  evidence_type: IDA
  original_reference_id: PMID:9182530
  qualifier: enables
  review:
    summary: >-
      The assay is accepted, but the measured phosphorylating GAPDH activity is a
      noise-level side activity, not the function of Epd.
    action: REMOVE
    reason: >-
      PMID:9182530 does measure phosphorylating oxidation of glyceraldehyde
      3-phosphate by Epd, but describes it as low: 0.12 s-1, at least 2000-fold
      less efficient than erythrose-4-phosphate oxidation, and limited by
      hydride transfer because the substrate is positioned unproductively. All
      the criteria of the promiscuous-noise tier apply: E. coli has a dedicated
      major GAPDH (GapA), the rate gap is over three orders of magnitude, Epd is
      in a distinct subfamily, and no in vivo GAPDH role of Epd has been
      reported (the genetic work implicates Epd in PLP synthesis instead).
      REMOVE here does not dispute the measurement; it judges the activity not
      to be the gene's function (CLAUDE.md, measured activity is not
      automatically function). The paper's real finding, efficient
      non-phosphorylating erythrose-4-phosphate oxidation, is captured by
      GO:0048001.
    supported_by:
    - reference_id: PMID:9182530
      supporting_text: >-
        This enzyme shows an efficient non-phosphorylating
        erythrose-4-phosphate dehydrogenase activity (Zhao, G., Pease, A. J., Bharani,
        N., and Winkler, M. E. (1995) J. Bacteriol. 177, 2804-2812) but a low
        phosphorylating glyceraldehyde-3-phosphate dehydrogenase activity
    - reference_id: PMID:9182530
      supporting_text: >-
        The rate of oxidation of glyceraldehyde 3-phosphate is 0.12 s-1
        and is hydride transfer limiting, at least 2000-fold less efficient compared
        with that of erythrose 4-phosphate.
    - reference_id: PMID:7751290
      supporting_text: >-
        gapA (gap1) encodes the major D-glyceraldehyde-3-phosphate
        dehydrogenase (GA3PDH).
