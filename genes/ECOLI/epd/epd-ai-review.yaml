gene_symbol: epd
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  Epd (formerly GapB) is the cytoplasmic NAD-dependent D-erythrose-4-phosphate
  dehydrogenase (EC 1.2.1.72) of Escherichia coli. It oxidizes D-erythrose
  4-phosphate to 4-phospho-D-erythronate by a non-phosphorylating mechanism, in
  which a covalent thioacyl intermediate on the catalytic cysteine is hydrolysed
  rather than phosphorolysed. This is the first reaction of the
  erythrose-4-phosphate branch of the DXP-dependent de novo pyridoxal
  5'-phosphate (vitamin B6) pathway (Epd, PdxB, SerC, PdxA, PdxJ, PdxH). Epd is
  a homotetrameric member of the glyceraldehyde-3-phosphate dehydrogenase
  family, but it oxidizes glyceraldehyde 3-phosphate thousands of times less
  efficiently than erythrose 4-phosphate; glycolytic GAPDH activity in E. coli
  belongs to GapA. epd mutants contain less PLP and PMP, and gapA epd double
  mutants require pyridoxine.
