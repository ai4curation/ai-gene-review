id: P75957
gene_symbol: lolD
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  lolD encodes the cytoplasmic nucleotide-binding (ATPase) subunit of the
  essential Escherichia coli LolCDE complex. Two LolD copies associate with the
  membrane subunits LolC and LolE on the inner surface of the inner membrane;
  ATP binding to LolD weakens LolCDE-lipoprotein contacts and ATP hydrolysis
  drives release of outer-membrane-destined lipoproteins to the periplasmic
  carrier LolA. LolCDE belongs to the ABC superfamily but does not transport
  its substrate across the membrane.
