  - PANTHER:PTN000655654
  - UniProtKB:P9WQL7
  review:
    summary: >-
      LolCDE moves lipoproteins off the membrane surface to LolA; it does not
      transfer substrate from one side of the membrane to the other.
    action: MODIFY
    reason: >-
      The defining paper states that LolCDE is not involved in transmembrane
      transport, so the transporter claim is wrong in its transmembrane sense
      (and GO:0140359 ABC-type transporter activity likewise requires transport
      across a membrane). The specific activity that LolD contributes to is
      lipoprotein releasing activity (a protein transporter activity), for
      which LolD has direct evidence.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: PANTHER:PTN000655654
        source_label: PTN000655654
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          Deep PTHR24220 node spanning substrate-translocating ABC ATPases and
          mechanotransmission ATPases (LolD, FtsE); the transmembrane claim
          holds for some seeds but not for the LolD clade.
    proposed_replacement_terms:
    - id: GO:0140306
      label: lipoprotein releasing activity
    supported_by:
    - reference_id: PMID:10783239
      supporting_text: The LolCDE complex differs mechanistically from all other ABC transporters as it is not involved in the transmembrane transport of substrates.
