taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  gloB (b0212, formerly yafR) of Escherichia coli K-12 encodes the main glyoxalase II (hydroxyacylglutathione
  hydrolase, EC 3.1.2.6), a monomeric metallo-beta-lactamase-fold thiolesterase with a binuclear zinc
  site. It hydrolyses (R)-S-lactoylglutathione, made from methylglyoxal and glutathione by glyoxalase
  I (GloA), to D-lactate and glutathione. GloB is more efficient than the accessory isozyme GloC (YcbL);
  the two act additively, and a gloB gloC double mutant is almost unable to tolerate exogenous methylglyoxal.
