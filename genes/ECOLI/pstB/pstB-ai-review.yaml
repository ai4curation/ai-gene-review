        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          The node-level inference supports PstB-family ATPases as Pst phosphate
          importer components, but transfers the assembled transporter's enables
          relationship onto an individual cytoplasmic ATPase subunit.
