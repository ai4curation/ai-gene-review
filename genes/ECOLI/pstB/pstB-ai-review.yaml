  review:
    summary: PstB is the ATPase subunit of an assembled phosphate transporter.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The PstB PAINT node correctly supports phosphate transport by this
      protein family, but PstB contributes ATP hydrolysis to the PstSACB
      transporter rather than independently enabling phosphate transmembrane
      transporter activity; the correct contributes_to relationship is captured
      in core_functions.
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
