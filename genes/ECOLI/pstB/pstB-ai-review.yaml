  review:
    summary: PstB physically interacts with PhoU in the phosphate-signaling complex.
    action: REMOVE
    reason: >-
      Gardner et al. support a real PstB-PhoU interaction, but generic protein
      binding is not a useful molecular-function annotation and the paper does
      not by itself establish a more specific PstB molecular function. PstB's
      core activity is ATP hydrolysis in the PstSACB transporter; the PhoU
      interaction belongs to phosphate signaling rather than the transport
