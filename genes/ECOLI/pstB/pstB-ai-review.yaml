suggested_questions:
- question: >-
    Which PstB conformational or nucleotide states are sensed by PhoU and PhoR
    during phosphate-replete versus phosphate-starved signaling?
suggested_experiments:
- experiment_type: nucleotide-state crosslinking
  description: >-
    Combine PstB ATPase-site mutants, nucleotide analogs, PhoU interaction
    assays, and reconstituted PstSACB transport measurements to separate
    ATPase-driven import from the PstB conformations used in Pho signaling.
