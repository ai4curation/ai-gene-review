id: P0AAH0
gene_symbol: pstB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  PstB is the cytoplasmic nucleotide-binding ATPase subunit of the E. coli
  high-affinity PstSACB ABC phosphate importer. A PstB dimer associates
  peripherally with the inner-membrane PstA/PstC permease and hydrolyzes ATP to
  energize phosphate uptake, while also contacting PhoU in the adjacent
  phosphate-signaling complex.
