id: P0A715
gene_symbol: kdsA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  KdsA is the cytosolic 3-deoxy-D-manno-octulosonate 8-phosphate (KDO8P) synthase of Escherichia coli.
  It condenses phosphoenolpyruvate with D-arabinose 5-phosphate to form KDO8P and inorganic phosphate,
  the second reaction of KDO biosynthesis. KDO8P is dephosphorylated by KdsC and the resulting KDO is
  activated by KdsB to CMP-KDO, the donor that attaches KDO to lipid A in the inner core of lipopolysaccharide.
  The enzyme is a TIM-barrel member of the class-I DAHP synthase family; the crystal structure shows a
  homotetramer.
