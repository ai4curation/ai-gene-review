  review:
    summary: >-
      Regulation of ubiquinone synthesis, based on the hypothesis that UbiB is
      a protein kinase regulating UbiI.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The regulatory claim rests on the protein-kinase model, which the
      biochemistry of the family does not support: no phosphorylation target,
      including UbiI, has been identified, and UbiB family members lack trans
      protein kinase activity. UbiB is required for the pathway
      (GO:0006744 captures that), but a regulatory role is not established.
      Treated the same way as in the P. putida UbiB review.
    supported_by:
    - reference_id: file:ECOLI/ubiB/ubiB-uniprot.txt
      supporting_text: >-
        Is probably a protein kinase regulator of UbiI activity which is
        involved in aerobic coenzyme Q (ubiquinone) biosynthesis.
      record_section:
      - CC:FUNCTION
    - reference_id: PMID:27499294
      supporting_text: >-
        Screening potential protein substrates for COQ8A and Coq8p further
        demonstrated their lack of trans protein kinase activity.
- term:
    id: GO:0016887
    label: ATP hydrolysis activity
  evidence_type: IDA
  original_reference_id: PMID:29198567
  qualifier: enables
  review:
    summary: >-
      Purified soluble E. coli UbiB (MBP-UbiB lacking the C-terminal
      transmembrane segment) hydrolyses ATP, and the activity is enhanced by
      CoQ-precursor-like 2-alkylphenols.
    action: NEW
    reason: >-
      Reidenbach et al. assayed E. coli UbiB directly alongside yeast Coq8p and
      human COQ8A and found a conserved, phenol-stimulated ATPase activity;
      the same protein copurifies with the pathway intermediates
      octaprenylphenol and octaprenylhydroxybenzoate in an active-site
      dependent way. This is the only molecular activity demonstrated for
      UbiB. The activity is low and its coupling to the pathway is not
      known, but its conservation from bacteria to humans, its stimulation by
      substrate-like phenols and its dependence on the UbiB-specific motifs in
      Coq8 argue that it is a genuine, evolved activity rather than noise.
      Comparator check: yeast COQ8 and human COQ8A, in the same accessory role,
      carry ATP hydrolysis activity from these studies, and the P. putida UbiB
      review uses the same core term.
    supported_by:
    - reference_id: PMID:29198567
      supporting_text: >-
        We found that ATPase activity is an evolutionarily conserved feature of
        COQ8 orthologs from E. coli to humans that is enhanced by phenolic
        compounds resembling CoQ biosynthetic precursors.
    - reference_id: PMID:29198567
      supporting_text: >-
        Furthermore, the activation by 2-alkylphenols with Triton X-100 is
        conserved in UbiB, Coq8p, and COQ8A, mirroring the conservation of CoQ
        precursor binding
