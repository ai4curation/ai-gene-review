knowledge_gaps:
- gap_statement: >-
    The step of ubiquinone biosynthesis that UbiB's ATPase activity drives is
    unknown; whether UbiB extracts octaprenylphenol or other intermediates
    from the membrane for the Ubi metabolon, or acts on a protein, has not been
    tested in E. coli.
  boundary: >-
    It is established that ubiB disruption abolishes ubiquinone and causes
    octaprenylphenol accumulation (PMID:10960098), and that purified UbiB binds
    octaprenylphenol and octaprenylhydroxybenzoate and has 2-alkylphenol
    stimulated ATPase activity (PMID:29198567).
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  resolution: >-
    In vitro reconstitution of intermediate transfer from liposomes to the
    purified Ubi complex with and without UbiB and ATP, combined with
    ATPase-dead UbiB complementation of a ubiB mutant.
  provenance:
  - reference_id: PMID:29198567
    supporting_text: >-
      the specific biochemical activities, regulation, and direct roles of UbiB
      proteins in cellular processes remain largely unclear
suggested_questions:
- question: >-
    Does UbiB use ATP hydrolysis to move octaprenylphenol from the inner
    membrane to the cytosolic Ubi metabolon for hydroxylation by UbiI?
suggested_experiments:
- hypothesis: UbiB ATPase activity is required in vivo.
  description: >-
    Complement a ubiB deletion with UbiB variants in the ATP-binding site,
    the proton-acceptor residue (Asp288) and the KxGQ motif, and quantify UQ8
    and octaprenylphenol by LC-MS.
