core_functions:
- description: >-
    Inner-membrane-anchored UbiB-family atypical kinase-like ATPase that binds
    early lipid intermediates of ubiquinone biosynthesis and is required for
    aerobic ubiquinone synthesis; how its phenol-stimulated ATP hydrolysis is
    coupled to the pathway is unknown.
