  label: Escherichia coli K-12
description: >-
  UbiB (formerly YigR, ortholog of Providencia stuartii AarF) is a 546-residue
  inner-membrane protein of Escherichia coli and the founding bacterial member
  of the UbiB family of atypical, protein-kinase-like proteins, which also
  includes the mitochondrial COQ8/ABC1 proteins of eukaryotes. It has a
  cytoplasmic kinase-like domain with conserved ATP-binding and catalytic
  residues and is anchored in the membrane by two C-terminal transmembrane
  helices. UbiB is required for aerobic ubiquinone (coenzyme Q8) biosynthesis:
  ubiB disruption mutants lack ubiquinone and accumulate octaprenylphenol, the
  substrate of the first ring hydroxylation. The soluble domain of E. coli
  UbiB copurifies with the pathway intermediates octaprenylphenol and
  3-octaprenyl-4-hydroxybenzoate and has a low ATPase activity that is
  stimulated by 2-alkylphenols resembling these intermediates, as for the
  eukaryotic COQ8 proteins, which lack protein kinase activity in trans. How
  UbiB's ATPase activity supports the pathway, for example by moving lipid
  intermediates out of the membrane to the Ubi enzymes, remains unresolved;
  UbiB is not a component of the soluble Ubi metabolon. ubiB lies in the
  ubiE-ubiJ-ubiB operon.
existing_annotations:
- term:
    id: GO:0004672
    label: protein kinase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: enables
  supporting_entities:
  - UniRule:UR000059578
  review:
    summary: >-
      Protein kinase activity transferred from the UbiB UniRule on the basis of
      the kinase-like fold; no protein substrate has been found for any UbiB
      family member, and E. coli UbiB itself has ATPase activity.
    action: MODIFY
    reason: >-
      The UbiB family has a protein-kinase-like fold, but trans protein kinase
      activity has never been demonstrated: COQ8A and yeast Coq8p fail to
      phosphorylate protein substrates, including COQ proteins. The activity
      that has been measured, directly on purified E. coli UbiB, is ATP
      hydrolysis stimulated by CoQ-precursor-like 2-alkylphenols. The
      essence of the annotation (an ATP-using kinase-fold activity) is sound,
      so the row is modified to ATP hydrolysis activity (GO:0016887), as in
      the P. putida UbiB review, rather than removed.
    proposed_replacement_terms:
    - id: GO:0016887
      label: ATP hydrolysis activity
    supported_by:
    - reference_id: PMID:27499294
      supporting_text: >-
        Screening potential protein substrates for COQ8A and Coq8p further
        demonstrated their lack of trans protein kinase activity.
    - reference_id: PMID:29198567
      supporting_text: >-
        demonstrating that 2-alkylphenols with Triton X-100 increase the ATPase
        activity of UbiB family members
