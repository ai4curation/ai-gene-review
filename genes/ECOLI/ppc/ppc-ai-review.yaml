- term:
    id: GO:0006094
    label: gluconeogenesis
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000776118
  - UniProtKB:P00864
  review:
    summary: Ppc consumes PEP for anaplerosis and opposes, rather than performs, gluconeogenesis.
    action: MARK_AS_OVER_ANNOTATED
    reason: Gluconeogenesis forms PEP from oxaloacetate (via PckA) or pyruvate (via PpsA); Ppc runs the
      opposite, PEP-consuming direction. The IMP evidence shows that an FBP-insensitive Ppc causes futile
      cycling at the PEP node on gluconeogenic substrates, i.e. Ppc must be switched off for gluconeogenesis
      to proceed. The phenotype is real but Ppc does none of the work of gluconeogenesis.
    supported_by: &id001
    - reference_id: PMID:22522319
      supporting_text: they fail to build up PEP upon glucose removal, grow poorly when glucose availability
        oscillates and suffer from futile cycling at the PEP node on gluconeogenic substrates.
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - ROLE_CONFLATION
      source_entities:
      - source_id: PANTHER:PTN000776118
        source_status: SOURCE_WEAK_OR_INFERRED
        comment: The IBD rests on the E. coli Ppc IMP row, a futile-cycling phenotype on gluconeogenic
          substrates that shows Ppc must be inactive during gluconeogenesis rather than that it performs
          a gluconeogenic step.
