core_functions:
- description: Mg2+-dependent carboxylation of phosphoenolpyruvate by bicarbonate to oxaloacetate, the
    anaplerotic entry of C4 units into the TCA cycle, under allosteric control by acetyl-CoA, fructose
    1,6-bisphosphate, aspartate and malate.
  molecular_function:
    id: GO:0008964
    label: phosphoenolpyruvate carboxylase activity
  directly_involved_in:
  - id: GO:0006107
    label: oxaloacetate metabolic process
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:1765093
    supporting_text: Mutation of His138 to asparagine (H138N) produced a protein which did not show carboxylase
      activity.
  - reference_id: PMID:22522319
    supporting_text: The switch-like termination of anapleurosis results from depletion of fructose-1,6-bisphosphate
      (FBP), an ultrasensitive allosteric activator of PEP carboxylase.
suggested_questions:
- question: Which allosteric input dominates Ppc flux control during transitions between glycolytic and
    gluconeogenic carbon sources in vivo, given that FBP, acetyl-CoA, aspartate and malate change together?
suggested_experiments:
- description: Quantify PEP-to-oxaloacetate flux by 13C tracing in strains carrying single effector-site
    Ppc variants (FBP-, acetyl-CoA- or aspartate-insensitive) during glucose upshift and downshift.
  experiment_type: 13C metabolic flux analysis
