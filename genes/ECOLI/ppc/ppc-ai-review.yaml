  - InterPro:IPR022805
  review:
    summary: Ppc feeds the TCA cycle but catalyses none of its steps.
    action: REMOVE
    reason: The InterPro2GO mapping places PEP carboxylase in the TCA cycle, but the GO definition is
      the cyclic oxidation of acetyl-CoA via citrate through oxaloacetate; Ppc replenishes oxaloacetate
      from PEP (anaplerosis) and catalyses no step of the cycle, which is captured by oxaloacetate metabolic
      process.
    supported_by:
