  label: Escherichia coli K-12
description: 'Ppc is the Escherichia coli type-1 phosphoenolpyruvate carboxylase, a cytosolic homotetramer
  that carboxylates phosphoenolpyruvate with bicarbonate to form oxaloacetate and phosphate. This is the
  main anaplerotic reaction that replenishes tricarboxylic acid cycle four-carbon intermediates in E.
  coli growing on glycolytic substrates. The enzyme is strongly allosterically controlled: acetyl-CoA
  is the dominant activator, fructose 1,6-bisphosphate and GTP act synergistically with it, and L-aspartate
  and L-malate inhibit it, letting the cell rapidly switch PEP consumption off when glucose is withdrawn.'
