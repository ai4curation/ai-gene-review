  evidence_type: IMP
  original_reference_id: PMID:4864413
  qualifier: acts_upstream_of_or_within
  review:
    summary: >-
      Mutant-phenotype annotation from a 1967 genetic study: bioC mutants of
      E. coli K-12 are biotin auxotrophs. The cached record is abstract-only.
    action: ACCEPT
    reason: >-
      The requirement of bioC for biotin biosynthesis is independently
      established by the later in vivo and in vitro reconstitution of the
      pathway, in which loss of bioC blocks pimeloyl moiety synthesis. Accepted
      with deference to the curator.
    supported_by:
    - reference_id: PMID:20693992
      supporting_text: >-
        Genetic analysis in Escherichia coli identified only two genes of unknown
        function required for pimelate synthesis, bioC and bioH.
