  label: Escherichia coli K-12
description: >-
  BioC is the malonyl-[acyl-carrier protein] O-methyltransferase (EC 2.1.1.197)
  of Escherichia coli K-12, a cytoplasmic S-adenosyl-L-methionine
  (SAM)-dependent methyltransferase of the Rossmann-fold (class I)
  methyltransferase superfamily. It transfers a methyl group from SAM to the
  free omega-carboxyl group of a malonyl-thioester, producing the methyl ester
  and S-adenosyl-L-homocysteine. This methylation disguises the dicarboxylic
  precursor as an ordinary fatty acyl chain so that it can be accepted and
  elongated by the fatty-acid synthase machinery; after two rounds of elongation
  the resulting pimeloyl-ACP methyl ester is hydrolysed by BioH to pimeloyl-ACP,
  the seven-carbon precursor that BioF commits to biotin ring assembly. BioC
  therefore performs the first dedicated step of de novo biotin biosynthesis.
  The gene lies in the E. coli bio operon.
