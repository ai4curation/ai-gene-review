core_functions:
- description: >-
    BioC methylates the free omega-carboxyl group of a malonyl-thioester
    (malonyl-ACP) using S-adenosyl-L-methionine, masking it so the pimelate
    precursor can be built by the fatty-acid synthase elongation cycle; this is
    the first dedicated step of de novo biotin biosynthesis.
