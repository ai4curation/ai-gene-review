suggested_questions:
- question: >-
    What is the physiological electron donor (reductase) that re-reduces Fdx
    in E. coli, and is it shared with other ferredoxin-dependent pathways?
- question: >-
    Does Fdx also supply electrons for reductive coupling of [2Fe-2S] into
    [4Fe-4S] clusters on IscU or on A-type carriers, in addition to persulfide
    reduction on IscS?
suggested_experiments:
- description: >-
    Screen E. coli flavoprotein reductase mutants (e.g. fpr) for loss of Fdx
    re-reduction and for Fe-S enzyme defects that phenocopy fdx deletion, and
    reconstitute candidate reductase-Fdx-IscS electron flow in vitro.
  experiment_type: genetics and in vitro reconstitution
- description: >-
    Test whether reduced Fdx drives [4Fe-4S] cluster formation from
    [2Fe-2S]-IscU dimers in vitro, monitored by Mossbauer and UV-visible
    spectroscopy.
  experiment_type: spectroscopy
