gene_symbol: fdx
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  Fdx is a small (111-residue) cytosolic [2Fe-2S] ferredoxin of the
  adrenodoxin/putidaredoxin family, encoded as the last structural gene of the
  iscRSUA-hscBA-fdx operon. Its single [2Fe-2S] cluster is ligated by four
  cysteines, and the cluster can itself be supplied by the Isc system (for
  example from holo-IscA). Fdx acts as a one-electron carrier for Fe-S cluster
  biogenesis: it binds the cysteine desulfurase IscS near the active-site
  Cys328 loop, on a surface that overlaps the binding sites of IscU and the
  frataxin CyaY, and reduced Fdx donates an electron to the IscS persulfide
  formed during cysteine turnover, a step needed for [2Fe-2S] cluster
  formation on IscU. Loss of fdx causes Fe-S enzyme defects similar to those
  of iscU, hscB and hscA mutants. Its physiological electron donor in E. coli
  has not been firmly established.
