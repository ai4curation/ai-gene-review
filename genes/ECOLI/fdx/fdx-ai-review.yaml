  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR001055
  - InterPro:IPR018298
  review:
    summary: >-
      Adrenodoxin-family InterPro mapping to P450 electron transport;
      E. coli K-12 has no cytochrome P450.
    action: REMOVE
    reason: >-
      The InterPro2GO mapping reflects the mitochondrial adrenodoxin/
      putidaredoxin role of delivering electrons to P450s. E. coli K-12
      encodes no cytochrome P450, and its Fdx delivers electrons to the
      cysteine desulfurase IscS for Fe-S cluster assembly. The electronic
      inference is wrong for this organism.
    supported_by:
    - reference_id: PMID:23682711
      supporting_text: >-
        Although it has been proposed that Fdx supplies electrons to reduce
        sulfane sulfur (S(0)) produced by the cysteine desulfurase (IscS) to
        sulfide (S(2-)) as required for the assembly of Fe-S clusters on the
        scaffold protein (IscU), direct experimental evidence for the role of
        Fdx has been lacking.
