  review:
    summary: >-
      The electron transport chain term (under generation of precursor
      metabolites and energy) is propagated from adrenodoxin and plant
      mitochondrial ferredoxins acting in reductase-ferredoxin chains to
      P450s and other acceptors.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      E. coli Fdx is an electron donor for the IscS persulfide in Fe-S
      cluster biosynthesis; there is no evidence that it acts in a multistep
      electron transport chain or in energy metabolism, and its physiological
      reductase is not established. Its electron-transfer role is captured by
      GO:0009055 plus GO:0016226. Marked as over-annotated rather than removed
      because a reductase-Fdx-IscS relay is formally a short electron transfer
      chain. Consistent with the P. putida orthologue.
    supported_by:
    - reference_id: PMID:23682711
      supporting_text: >-
        These results (1) show that reduced Fdx supplies one electron to the
