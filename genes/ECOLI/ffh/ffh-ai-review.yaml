taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: Ffh (fifty-four homolog) is the protein subunit of the Escherichia coli signal recognition
  particle (SRP), a ribonucleoprotein formed with the 4.5S RNA encoded by ffs. Its N domain contacts the
  ribosome near ribosomal protein L23, its central G domain is a GTPase, and its C-terminal M domain binds
  both the 4.5S RNA and the hydrophobic signal or signal-anchor sequence of a nascent membrane protein
  as it emerges from the ribosome. The SRP-ribosome-nascent-chain complex is delivered to the membrane-associated
  SRP receptor FtsY; Ffh and FtsY then form a GTP-dependent heterodimer in which each stimulates the other's
  GTP hydrolysis, transferring the nascent chain to the SecYEG translocon and dissociating the targeting
  factors for reuse. Ffh is essential for viability and for inner-membrane protein biogenesis. SRP also
  binds the heat-shock sigma factor sigma32 and contributes to its membrane association and homeostatic
  control.
