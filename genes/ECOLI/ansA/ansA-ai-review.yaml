description: AnsA is the cytosolic, low-affinity L-asparaginase I of Escherichia coli. It hydrolyzes L-asparagine
  to L-aspartate and ammonium and forms a homotetramer with cooperative substrate activation, linking
  intracellular asparagine utilization to nitrogen metabolism.
