  label: Escherichia coli K-12
description: >-
  NadA is the quinolinate synthase of Escherichia coli K-12, a [4Fe-4S] cluster-containing enzyme that
  condenses iminoaspartate (iminosuccinate), made by L-aspartate oxidase NadB, with dihydroxyacetone phosphate
  to form quinolinate, the pyridine-ring precursor of NAD+. The cluster, ligated by Cys113, Cys200 and
  Cys297, is required for activity and is degraded on exposure to air. NadA is a soluble cytosolic enzyme;
  together with NadB it is sufficient to make quinolinate from L-aspartate, dihydroxyacetone phosphate
  and O2 in vitro.
