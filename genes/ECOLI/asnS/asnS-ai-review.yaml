taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: AsnS is the cytoplasmic, homodimeric class II asparaginyl-tRNA synthetase of Escherichia
  coli K-12. It activates L-asparagine with ATP and transfers the amino acid to tRNA(Asn), supplying Asn-tRNA
  for protein synthesis. Mutations in conserved catalytic regions impair ATP or asparagine recognition
  and can produce temperature-sensitive translation.
