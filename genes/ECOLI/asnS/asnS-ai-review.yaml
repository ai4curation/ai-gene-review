      by peptide/gene sequence and complemented N4316 temperature-sensitive translation. Its observed
      homodimer supports assembly, without asserting that ribosomal elution makes it a structural ribosomal
      subunit.
    supporting_text: the purified protein is a homodimer of 54 kDa.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary E. coli evidence. The cached abstract was read; it explicitly reports the result
      used here. Full experimental details were not available and no additional moonlighting role is inferred.
- id: PMID:1544480
  title: Asparaginyl-tRNA synthetase from the Escherichia coli temperature-sensitive strain HO202. A proline
