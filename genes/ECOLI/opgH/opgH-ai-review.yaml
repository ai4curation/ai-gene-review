  label: Escherichia coli K-12
description: OpgH is a multipass inner-membrane GT2 glucosyltransferase required for osmoregulated periplasmic
  glucan synthesis in Escherichia coli. The associated membrane enzyme system uses UDP-glucose and acyl
  carrier protein to elongate beta-1,2-glucan chains. OpgH also regulates nutrient-dependent cell size
  through its cytoplasmic N-terminal domain, which inhibits FtsZ assembly and the accompanying GTPase
  activity. This division-regulatory function is separable from glucan production. Translocation of nascent
  glucan through OpgH is a proposed role rather than independently demonstrated transport chemistry.
