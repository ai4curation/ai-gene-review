core_functions:
- description: Transfers glucosyl residues from UDP-glucose as the membrane glucosyltransferase component
    of the OPG biosynthetic system. Membrane-system evidence supports beta-1,2-glucan elongation with
    ACP and additional assay requirements; it does not establish OpgH-alone sufficiency or a separately
    demonstrated translocation activity.
