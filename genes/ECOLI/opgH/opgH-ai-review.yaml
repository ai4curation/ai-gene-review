- term:
    id: GO:0008361
    label: regulation of cell size
  evidence_type: IMP
  original_reference_id: PMID:23935518
  qualifier: acts_upstream_of_or_within
  review:
    summary: OpgH directly contributes to nutrient-dependent cell-size control through FtsZ inhibition.
    action: ACCEPT
    reason: MG1655 mutant and complementation phenotypes, domain assays and purified N-terminal inhibition
      support a genuine moonlighting regulatory function. Size effects were separated from OPG deficiency
      and Rcs activation, rather than inferred solely from downstream envelope stress. The exact physiological
      UDP-glucose conformational switch remains a model.
    supported_by:
    - &id007
      reference_id: PMID:23935518
      supporting_text: Our data shows that OpgH's role in size modulation is independent of OPG synthesis
        or activation of the Rcs system.
    - reference_id: PMID:23935518
      supporting_text: OpgHN inhibited FtsZ assembly in a dose-dependent fashion
    - reference_id: PMID:23935518
      supporting_text: Wild-type MG1655 cells had an average area of 5.66 µm2.
