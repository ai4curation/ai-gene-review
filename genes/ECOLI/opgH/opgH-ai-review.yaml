suggested_questions:
- question: Can purified OpgH with defined ACP and membrane components reconstitute synthesis and independently
    establish the proposed glucan translocation step?
suggested_experiments:
- description: Reconstitute OpgH in a defined membrane with UDP-glucose and ACP; resolve glycosidic linkage
    chemistry and compartmentalize the acceptor to distinguish synthesis from transport.
  experiment_type: biochemistry and genetic complementation
