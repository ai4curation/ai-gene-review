- id: PMID:23935518
  title: A moonlighting enzyme links Escherichia coli cell size with central metabolism.
  findings:
  - statement: The OpgH N-terminal domain directly inhibits FtsZ assembly and assembly-coupled GTP hydrolysis,
      supporting independent cell-size regulation.
    supporting_text: OpgHN reduced FtsZ's intrinsic GTP hydrolysis activity in a dose-dependent manner.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Direct MG1655 cell-size genetics and purified untagged OpgH1–138/FtsZ assays. Full-length
      thioredoxin/His and GFP constructs support regulatory phenotypes; in vitro inhibition uses the isolated
      domain. Swarming complementation is a proxy for glucan function, not a purified glucosyltransferase
      assay. No transfer of Caulobacter essentiality is made.
- id: PMID:6238027
  title: Biosynthesis of membrane-derived oligosaccharides. Novel glucosyltransferase system from Escherichia
    coli for the elongation of beta 1----2-linked polyglucose chains.
  findings:
  - statement: A multicomponent membrane enzyme system makes beta-1,2-linked glucose oligomers.
    supporting_text: 'Oligomers containing 6-10

      glucose units (about the same size as MDO) that are joined by beta 1----2

      linkages are major products of the enzyme system.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract supports beta-1,2-glucan synthesis by a membrane-plus-soluble-factor system
      and a defective mdoA locus. It predates opgGH separation; do not assign purified OpgG catalysis
      or autonomous OpgH activity from it.
- id: PMID:6365896
  title: Mapping of a locus (mdoA) that affects the biosynthesis of membrane-derived oligosaccharides
    in Escherichia coli.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Early mdoA locus mapping, abstract only. The phenotype predates gene-specific resolution;
      later opgGH evidence supports the pathway annotation without pretending this reference assays each
      purified subunit.
- id: PMID:9352918
  title: Topological analysis of the membrane-bound glucosyltransferase, MdoH, required for osmoregulated
    periplasmic glucan synthesis in Escherichia coli.
  findings:
  - statement: Reporter-fusion topology places OpgH across the inner membrane; glucan translocation is
      proposed.
    supporting_text: 'Analysis of 51 different MdoH-beta-lactamase

      fusions suggested that the MdoH protein crosses the cytoplasmic membrane eight

      times, with the N and C termini in the cytoplasm.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cached abstract examined. Exact target-level table/peptide details and complete strain/construct
      metadata were not independently verified from full text; independently grounded biological claims
      are retained.
- id: PMID:7934824
  title: Homology between a genetic locus (mdoA) involved in the osmoregulated biosynthesis of periplasmic
    glucans in Escherichia coli and a genetic locus (hrpM) controlling pathogenicity of Pseudomonas syringae.
  findings:
  - statement: Gene-specific resolution assigns OpgG to the periplasm and OpgH to the membrane glucosyltransferase
      system.
    supporting_text: 'MdoH, whose presence was shown to be necessary for normal

      glucosyl transferase activity, is a 97 kDa protein spanning the cytoplasmic

      membrane.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cached abstract examined. Exact target-level table/peptide details and complete strain/construct
      metadata were not independently verified from full text; independently grounded biological claims
      are retained.
- id: PMID:1827116
  title: Biosynthesis of membrane-derived oligosaccharides. Membrane-bound glucosyltransferase system
    from Escherichia coli requires polyprenyl phosphate.
  findings:
  - statement: The membrane glucan system requires UDP-glucose and ACP; stimulation does not establish
      an obligatory polyprenyl-P-glucose intermediate.
    supporting_text: 'The synthesis of the beta-1,2-glucan backbone of MDO is catalyzed by

      a membrane-bound glucosyltransferase system previously shown to require

      UDP-glucose and (surprisingly) acyl carrier protein'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract supports UDP-glucose/ACP-dependent membrane glucan synthesis and polyprenyl-phosphate
      stimulation. No ACP- or UDP-linked glucan intermediates detected; polyprenyl-P-glucose was not an
      obligatory intermediate. Not an OpgH-alone reconstitution.
- id: PMID:9171419
  title: Domains of Escherichia coli acyl carrier protein important for membrane-derived-oligosaccharide
    biosynthesis.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract separates ACP cofactor function in the membrane glucan system from phosphopantetheine-dependent
      acyl transfer. Precise molecular role remains unknown; no acyl chemistry is assigned to OpgH.
- id: PMID:37735577
  title: Identification of enzymatic functions of osmo-regulated periplasmic glucan biosynthesis proteins
    from Escherichia coli reveals a novel glycoside hydrolase family.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Direct BL21(DE3)-derived signal-deleted, C-terminal His6 OpgG/OpgD assays. CAQ precursors
      exactly match frozen K-12 targets. OpgG activity is low (0.11 U/mg; 0.79% of OpgD under the specified
      comparison), not absent. OpgD hydrolysis is strong and specific; native OPG trimming is inferred.
      OpgG cofactor/branching hypotheses remain open. Table D378N differs from methods/PDB D388N; use
      the latter for OpgD construct identity.
- id: PMID:39145657
  title: OpgH is an essential regulator of Caulobacter morphology.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Direct Caulobacter crescentus evidence, used only as a comparative limit: essentiality
      and morphogenetic network effects do not establish the E. coli FtsZ mechanism in every OpgH homolog.'
