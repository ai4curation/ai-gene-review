- term:
    id: GO:0008320
    label: transmembrane protein transporter activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: enables
  supporting_entities:
  - UniRule:UR000066696
  review:
    summary: TatC is an essential receptor subunit of the Tat translocase; the transporter activity belongs
      to the assembled TatABC complex.
    action: MARK_AS_OVER_ANNOTATED
    reason: The TatC subunit is required for Tat transport (reconstitution needs TatA, TatB and TatC together),
      but TatC binds the signal peptide and recruits TatA rather than translocating the substrate itself.
      The 'enables' qualifier attributes the whole-complex transporter activity to the single subunit;
      the core function records it as contributes_to, and the subunit's own activity is captured by GO:0005048
      signal sequence receptor activity. This electronic row rests on the HAMAP/UniRule family assignment
      for the subunit.
    supported_by:
    - reference_id: file:ECOLI/tatC/tatC-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: Together with TatB, TatC is part of a receptor directly interacting with Tat signal
        peptides.
    - reference_id: file:ECOLI/tatC/tatC-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: Part of the twin-arginine translocation (Tat) system that transports large folded
        proteins containing a characteristic twin-arginine motif in their signal peptide across membranes.
    - reference_id: PMID:11350936
      supporting_text: requires TatABC, an intact membrane potential and the twin-arginine targeting motif
    source_defects:
    - defect_type: WRONG_QUALIFIER
      resource: UNIPROT
      slot: Qualifier
      requested_change: CHECK
      asserted_value: enables
      corrected_value: contributes_to
      cause: SCOPE_OVER_REACH
      confidence: PROBABLE
      explanation: TatC is a receptor subunit of the TatABC translocase; the protein transmembrane transporter
        activity is a property of the assembled complex (transport needs TatA, TatB and TatC together).
        The row should use contributes_to rather than enables for this subunit.
