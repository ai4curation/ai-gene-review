id: P69423
gene_symbol: tatC
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: TatC is the six-transmembrane-helix core subunit of the Escherichia coli twin-arginine translocation
  (Tat) system. It is the primary docking site for Tat signal peptides, directly recognizing the RR consensus
  motif, and together with TatB forms the receptor complex that binds folded precursors and then recruits
  TatA. Loss of TatC blocks export of the redox-cofactor-containing Tat substrates without affecting the
  Sec pathway.
