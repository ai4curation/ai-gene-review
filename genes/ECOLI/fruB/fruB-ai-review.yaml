  review:
    summary: UniProt places FPr in the cytoplasm by curator inference; the protein has no transmembrane
      segment and carries only soluble EIIA, M and HPr domains.
    action: ACCEPT
    reason: FPr is a soluble phosphocarrier that works on the cytoplasmic side of the PTS. The cytoplasm
      is the correct location for its EIIA and HPr-like domains; its peripheral association with FruA
      does not make it a membrane protein.
