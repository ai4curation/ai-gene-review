  review:
    summary: Interactome and bacterial two-hybrid data place FruB with FruA and with other PTS permeases
      (MtlA, NagE) in the inner membrane.
    action: REMOVE
    reason: Generic protein binding carries no functional information. The FruB-FruA contact reflects
      the cognate EIIA-to-EIIB phosphotransfer captured by the proposed relay activity, and the contacts
      with other Enzyme II complexes are regulatory observations whose mechanism is not established. Removal
      follows the project protein-binding policy and does not deny the interactions; E. coli FruA's matching
      row is removed on the same grounds.
