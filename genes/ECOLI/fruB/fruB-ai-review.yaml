      fructose phosphotransferase system has been found in Escherichia coli grown on fructose.
proposed_new_terms:
- proposed_name: PTS EIIA-to-EIIB phosphotransferase activity
  proposed_definition: Catalysis of phosphate transfer from the phosphorylated histidine of a phosphoenolpyruvate-dependent
    sugar phosphotransferase system EIIA domain to the cognate EIIB phosphoacceptor.
  justification: GO:0022877 and GO:0090563 describe the terminal transport-coupled transfer to the sugar,
    catalysed by the EIIB-EIIC permease; no term covers the EIIA-to-EIIB protein-to-protein step that
    FPr performs. The same term is proposed for the fused FruB proteins of Pseudomonas putida and is defined
    identically here.
  proposed_parent:
    id: GO:0016772
    label: transferase activity, transferring phosphorus-containing groups
  supported_by:
  - reference_id: file:ECOLI/fruB/fruB-uniprot.txt
    record_section:
    - CC:DOMAIN
    supporting_text: The PTS EIIA type-2 domain is phosphorylated by phospho-HPr on a histidyl residue.
      Then, it transfers the phosphoryl group to the PTS EIIB type-2 domain.
suggested_questions:
- question: Does the M domain between the EIIA and HPr-like domains of FPr have a catalytic or docking
    role in phosphotransfer to FruA, or is it a linker?
suggested_experiments:
- description: Assay purified FPr variants lacking the M domain, or with His62 or His299 replaced, for
    enzyme I-dependent phosphorylation and for PEP-dependent fructose phosphorylation with FruA membranes,
    to separate the HPr-like and EIIA relay steps.
  experiment_type: in vitro phosphotransfer reconstitution
