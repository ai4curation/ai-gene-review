core_functions:
- description: Soluble multiphosphoryl transfer protein of the E. coli fructose PTS. Its HPr-like domain
    is phosphorylated by enzyme I, and its fructose-type EIIA domain then phosphorylates the EIIB domains
    of the FruA permease, supplying the phosphoryl group for fructose import with formation of fructose
    1-phosphate.
  proposed_molecular_function: PTS EIIA-to-EIIB phosphotransferase activity
  directly_involved_in:
