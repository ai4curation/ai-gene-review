  label: Escherichia coli K-12
description: 'fruB (fpr, fruF) of Escherichia coli K-12 encodes FPr, the fructose-inducible multiphosphoryl
  transfer protein of the fructose phosphoenolpyruvate-dependent phosphotransferase system (PTS). The
  376-residue soluble protein fuses an N-terminal fructose-type EIIA domain (phosphohistidine His62),
  a central M domain and a C-terminal HPr-like domain (phosphohistidine His299). FPr lacks an enzyme I
  region: the general enzyme I (PtsI) phosphorylates its HPr-like domain, which passes phosphate to the
  EIIA domain, and EIIA then phosphorylates the EIIB domains of the membrane permease FruA. FPr thereby
  replaces HPr in the fructose system and supplies the phosphoryl donor for fructose uptake with concomitant
  formation of fructose 1-phosphate. It associates peripherally with the cytoplasmic face of the membrane-bound
  FruA permease.'
