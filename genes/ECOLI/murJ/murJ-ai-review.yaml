core_functions:
- description: >-
    MurJ is the lipid II flippase: an alternating-access MOP-superfamily
    transporter in the inner membrane that moves lipid II from the cytoplasmic
    to the periplasmic leaflet, making the peptidoglycan building block available
    to periplasmic glycosyltransferases and transpeptidases. Activity requires
    membrane potential.
