gene_symbol: murJ
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  MurJ (formerly MviN) is the essential lipid II flippase of Escherichia coli. A
  14-transmembrane-segment inner-membrane protein of the MOP
  (multidrug/oligosaccharidyl-lipid/polysaccharide) exporter superfamily, it
  translocates the lipid-linked peptidoglycan precursor lipid II from the
  cytoplasmic to the periplasmic leaflet of the inner membrane so that the
  disaccharide-pentapeptide can be polymerized and cross-linked into the cell
  wall. MurJ binds lipid II in a cationic central cavity and cycles between
  inward- and outward-facing conformations in a membrane-potential-dependent
  alternating-access mechanism. It is found throughout the lateral membrane and is
  recruited to the division site with the late divisome and the lipid II
  synthesis enzymes. Depletion or chemical inactivation of MurJ causes
  accumulation of lipid II, cessation of peptidoglycan synthesis and lysis.
