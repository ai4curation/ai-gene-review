suggested_questions:
- question: >-
    Can lipid II flipping by purified E. coli MurJ be reconstituted in
    proteoliposomes, and if so, is it driven by membrane potential and by which
    counter-ion, as structural work on Thermosipho africanus MurJ suggests?
- question: >-
    Does cardiolipin binding modulate MurJ activity in vivo, for example at the
    cell poles or division site where cardiolipin is enriched?
- question: >-
    Is the FtsW-dependent midcell recruitment of MurJ due to a direct
    FtsW-MurJ contact that channels lipid II to the septal synthase?
knowledge_gaps:
- gap_statement: >-
    The lipid II flippase activity of MurJ rests on in vivo protection assays,
    binding and structures; transport by purified, reconstituted MurJ and its
    energetic coupling have not been demonstrated.
  gap_kind:
  - BIOLOGY
suggested_experiments:
- experiment_type: reconstituted flippase assay
  description: >-
    Reconstitute purified E. coli MurJ in proteoliposomes containing
    fluorescent or biotinylated lipid II and measure transbilayer movement under
    imposed membrane potential and ion gradients, comparing with FtsW and with
    cavity mutants (R18A, R24A, D39A, R52C, R270A).
