suggested_questions:
- question: How is PgsA activity or abundance coupled to the membrane content of anionic phospholipids,
    given that a pgsA defect also lowers phosphatidylethanolamine synthesis?
suggested_experiments:
- description: Titrate pgsA expression from a tunable promoter in a pgsA null background and measure phosphatidylglycerol
    phosphate, phosphatidylglycerol, cardiolipin and phosphatidylethanolamine by quantitative lipidomics.
