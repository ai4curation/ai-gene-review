taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: 'PgsA (phosphatidylglycerophosphate synthase) is an essential multi-pass inner-membrane CDP-alcohol
  phosphatidyltransferase of Escherichia coli. It transfers the phosphatidyl group of CDP-diacylglycerol
  to sn-glycerol 3-phosphate, forming phosphatidylglycerol phosphate and CMP. This is the committed step
  of anionic phospholipid synthesis: phosphatidylglycerol phosphate is dephosphorylated to phosphatidylglycerol,
  which is in turn the precursor of cardiolipin. PgsA thereby sets the balance between anionic and zwitterionic
  membrane phospholipids.'
