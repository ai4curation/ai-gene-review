    label: phosphorelay sensor kinase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN000504218
  - UniProtKB:P07363
  review:
    summary: PAINT propagation of phosphorelay sensor kinase activity to CheA from
      the CheA clade node PTN000504218; E. coli CheA itself is the experimental seed
      used to place it.
    action: MODIFY
    reason: The node placement is sound (CheA is inside the clade and the kinase and
      phosphotransfer chemistry is conserved), and the kinase half of the term is
      fully supported (autophosphorylation on His48, transfer to CheY and CheB).
      GO:0000155 is the more specific term, an is_a child of both GO:0004673 protein
      histidine kinase activity and GO:0140299 molecular sensor activity, and its
      definition requires the kinase to act "in response to detection of an
      extracellular signal". CheA itself detects no signal; detection is performed by
      the methyl-accepting chemoreceptors, which control CheA through CheW in the
      ternary complex (PMID:1326408). The sensor component is therefore a role
      conflation, and the correct MF for CheA is the parent GO:0004673, which the gene
      already carries by IDA and IEA.
    proposed_replacement_terms:
    - id: GO:0004673
      label: protein histidine kinase activity
    source_defects:
    - defect_type: WRONG_TERM
      resource: GO_CENTRAL
      asserted_value: GO:0000155
      corrected_value: GO:0004673
      requested_change: CHECK
      confidence: SUSPECTED
      explanation: PTN000504218 (CheA clade) asserts phosphorelay sensor kinase
        activity, whose definition and molecular sensor activity parent imply signal
        detection by the kinase. CheA-family kinases are receptor-coupled cytoplasmic
        kinases that do not detect signals themselves; please consider asserting
        GO:0004673 protein histidine kinase activity at this node instead.
    propagation_review:
