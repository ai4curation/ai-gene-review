      CheA does not perform, signal detection, which the sensor component of
      GO:0000155 (also is_a GO:0140299 molecular sensor activity) asserts; detection
      is done by the chemoreceptors that regulate CheA. Same verdict as the IBA and
      IEA rows of this term.
