  review:
    summary: CheA kinase chemistry is supported; the inherited molecular-sensor role needs correction.
    action: MODIFY
    reason: 'QuickGO checked 2026-11-06 confirms GO:0000155 is_a GO:0140299 molecular sensor activity,
      as well as GO:0004673. The sensor parent describes ligand binding with an activity change in response
      to intracellular ligand level. Receptor-controlled histidine phosphorylation is established, but
      the experiments do not establish that sensor activity on CheA itself: chemoreceptors detect the
      stimulus and control CheA through the coupling complex. The child definition alone had obscured
      this inherited requirement. Retain the demonstrated kinase chemistry as GO:0004673 and the receptor-controlled
      phosphorelay in the process/core description; ask GO to resolve the term-scope mismatch rather than
      asserting an experimentally disproven kinase or a wrong PAINT node. Purified CheA autophosphorylation
      and preferential transfer to CheY/CheB are established by PMID:3280143 and PMID:16176121; PMID:1326408
      separates receptor ligand binding from CheA kinase regulation.'
    supported_by:
    - reference_id: PMID:1326408
      supporting_text: These observations in combination with our previous identification of a CheW-CheA
        complex suggest that CheW physically links the kinase to the receptor.
    - reference_id: PMID:1326408
      supporting_text: Stability is not significantly altered by changes associated with attractant or
        repellent binding to the receptor. Such binding greatly modulates the kinase activity of CheA.
    - reference_id: PMID:3280143
      supporting_text: We show that in vitro the CheA protein becomes autophosphorylated in the presence
        of ATP. In addition, the phosphate group on CheA can be rapidly transferred to CheB, a protein
        involved in adaptation to stimuli, or to CheY, a protein involved in the excitation response.
    - reference_id: PMID:1326408
      supporting_text: Such binding greatly modulates the kinase activity of CheA.
