core_functions:
- description: CheA is the histidine autokinase of the chemotaxis phosphorelay. Within
    receptor-CheW-CheA signalling complexes at the cytoplasmic face of the inner
    membrane, CheA(L) autophosphorylates His48 using ATP, at a rate controlled by
    chemoreceptor occupancy and methylation, and transfers the phosphoryl group to
    the response regulators CheY (excitation, flagellar switching) and CheB
    (adaptation).
  molecular_function:
    id: GO:0004673
    label: protein histidine kinase activity
  directly_involved_in:
  - id: GO:0000160
    label: phosphorelay signal transduction system
  - id: GO:0006935
    label: chemotaxis
  - id: GO:0050920
    label: regulation of chemotaxis
  locations:
  - id: GO:0009898
    label: cytoplasmic side of plasma membrane
  - id: GO:0060187
    label: cell pole
  in_complex:
    id: GO:0098561
    label: methyl accepting chemotaxis protein complex
  supported_by:
  - reference_id: PMID:3280143
    supporting_text: We show that in vitro the CheA protein becomes autophosphorylated
      in the presence of ATP. In addition, the phosphate group on CheA can be rapidly
      transferred to CheB, a protein involved in adaptation to stimuli, or to CheY,
      a protein involved in the excitation response.
  - reference_id: PMID:1326408
    supporting_text: Such binding greatly modulates the kinase activity of CheA.
  - reference_id: PMID:2068106
    supporting_text: The autophosphorylation rate of CheAL is much greater when CheAL
      and CheAS are complexed with CheW.
  - reference_id: PMID:16176121
    supporting_text: At 1 h, CheA shows phosphotransfer to seven response regulators,
      including CheY and CheB (Figure 4E), but at 10 s we detect only phosphorylation
      of CheY and CheB (Figure 4F).
  - reference_id: PMID:8456299
    supporting_text: The transduction of the chemotaxis signal is initiated by a chemoreceptor-CheW-CheA
      ternary complex at the inner membrane.
- description: The short isoform CheA(S), which lacks most of the P1 phosphotransfer
    domain, binds the CheY-P phosphatase CheZ through helix E of its truncated P1
    region and recruits CheZ to the polar receptor arrays.
  molecular_function:
    id: GO:0019903
    label: protein phosphatase binding
  locations:
  - id: GO:0060187
    label: cell pole
  supported_by:
  - reference_id: PMID:19502407
    supporting_text: CheA-short interacts with CheZ to localize CheZ to cell poles.
  - reference_id: PMID:19581362
    supporting_text: Both L123 and L126 are buried in CheA-long (CheA(L)), providing
      an explanation for why CheA(L) fails to bind CheZ.
suggested_questions:
- question: Should the CheA clade node PTN000504218 assert GO:0004673 protein histidine
    kinase activity rather than GO:0000155 phosphorelay sensor kinase activity, given
    that CheA-family kinases do not themselves detect signals but are controlled by
    separate chemoreceptors?
- question: Is the in vitro inhibition of CheY and Acs acetylation by CheA physiologically
    relevant in vivo?
suggested_experiments:
- description: Measure CheY acetylation levels in vivo in cheA deletion and catalytically
    inactive cheA (H48Q) backgrounds to test whether CheA protein, independent of its
    kinase activity, modulates CheY acetylation.
