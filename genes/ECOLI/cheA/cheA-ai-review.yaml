  review:
    summary: Skerker et al. performed phosphotransfer profiling of purified E. coli
      CheA against all 32 E. coli response regulators and found a strong kinetic
      preference for CheY and CheB.
    action: MODIFY
    reason: The assay demonstrates histidine kinase autophosphorylation and
      phosphotransfer to the cognate response regulators, i.e. GO:0004673 protein
