id: P07363
gene_symbol: cheA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: 'CheA is the cytoplasmic histidine autokinase at the centre of the Escherichia coli chemotaxis
  phosphorelay. It is a multidomain homodimer: an N-terminal histidine phosphotransfer (P1/HPt) domain
  carrying the phosphorylated His48, a CheY/CheB-docking (P2) domain, a dimerization (P3) domain, an ATP-binding
  HATPase_c catalytic (P4) domain and a C-terminal CheW-like regulatory (P5) domain. Through P5, CheA
  binds the coupling protein CheW and the cytoplasmic tips of methyl-accepting chemoreceptors (Tar, Tsr
  and others), forming ternary receptor-CheW-CheA core units (two receptor trimers of dimers, two CheW,
  one CheA dimer) that pack into large arrays at the cytoplasmic face of the inner membrane, predominantly
  at the cell poles. Within these complexes CheA activity is stimulated several-hundredfold and controlled
  by receptor occupancy and methylation state: attractant binding inhibits and repellent binding stimulates
  autophosphorylation. Phosphoryl groups are transferred from His48 to the response regulators CheY (which
  binds the flagellar switch to promote clockwise rotation and tumbling) and CheB (the methylesterase/deamidase
  that mediates sensory adaptation). Alternative translation initiation produces a long form, CheA(L),
  and a short form, CheA(S), lacking most of P1; CheA(S) cannot autophosphorylate on His48 but binds the
  CheY-P phosphatase CheZ and recruits it to the polar receptor arrays.'
