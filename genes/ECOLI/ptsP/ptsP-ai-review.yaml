  - InterPro:IPR008731
  - InterPro:IPR036618
  review:
    summary: In-vitro phosphate exchange does not establish a native sugar-uptake process.
    action: MARK_AS_OVER_ANNOTATED
    reason: The domain mapping joins a regulatory relay enzyme to the coupled carbohydrate uptake process.
      Native PtsP preferentially serves NPr, but in-vitro coupling assays and exchange between PTS components
      preclude using specialization as proof that all sugar-related participation is impossible. A target-specific
      physiological sugar-transport role is not established by the present evidence. Demonstrated cross-system
      chemistry involving this target supports MARK_AS_OVER_ANNOTATED, while native sugar transport remains
      unestablished.
    supported_by:
    - reference_id: PMID:10473571
      supporting_text: EI(Ntr) was shown to phosphorylate NPr in vitro using either a [(32)P]PEP-dependent
        protein phosphorylation assay or a quantitative sugar phosphorylation assay.
    - reference_id: PMID:7876255
      supporting_text: 'Purified IIANtr and NPr exchange phosphate appropriately with Enzyme I, HPr, and
        Enzyme IIA proteins of the phosphoenolpyruvate: sugar phosphotransferase system.'
    - reference_id: PMID:41870250
      supporting_text: Instead of a sugar substrate, the PTSNtr appears to carry out its regulatory roles
        through protein-protein interactions that primarily involve PtsN, although relatively few PtsN
        protein targets have been characterized.
- term:
    id: GO:0015764
    label: N-acetylglucosamine transport
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000532509
  - UniProtKB:Q9HXN5
  review:
    summary: The NPr-specific entry enzyme does not establish the inherited GlcNAc transport role.
    action: REMOVE
    reason: The source IBD spans related PEP-transfer enzymes, but the target primary assay reports that
      EINtr phosphorylated NPr but not HPr. Native substrate specificity separates this regulatory relay
      from the canonical HPr-to-sugar route. The GlcNAc-specific process propagated from the broader entry-enzyme
      ancestor is therefore inappropriate for this target. This does not deny purified assay coupling
      through engineered partner combinations or invalidate the same process in the carbohydrate EI control.
    supported_by:
    - reference_id: PMID:10473571
      supporting_text: EI(Ntr) was shown to phosphorylate NPr in vitro using either a [(32)P]PEP-dependent
        protein phosphorylation assay or a quantitative sugar phosphorylation assay.
