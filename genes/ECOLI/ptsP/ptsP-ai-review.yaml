      - ROLE_CONFLATION
      source_entities:
      - source_id: PANTHER:PTN000532509
        source_label: PANTHER:PTN000532509
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          PTHR46244 PAINT places GO:0015764 on the root bacterial node, which also
