      - source_id: UniProtKB:Q9HXN5
        source_label: PA3760
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          P. aeruginosa multiphosphoryl transfer protein of a sugar PTS; its transport
          role does not transfer to the NPr-specific EI(Ntr) paralogue.
    reason: >-
      The only seed is the Pseudomonas aeruginosa multiphosphoryl transfer protein
      PA3760 (Q9HXN5, 842 aa, EI-HPr-EIIA fusion), but the term is placed on the same
      root bacterial node PTN000532509 as the generic phosphotransferase activity.
      EI(Ntr) proteins below that node phosphorylate only NPr and take no part in any
      sugar transport, so the transport term does not descend to them.
    supported_by:
    - reference_id: PMID:10473571
      supporting_text: >-
        The results suggest that E. coli possesses at least two distinct PTS
        phosphoryl transfer chains, EI(Ntr) --> NPr --> IIA(Ntr) and EI --> HPr -->
        IIA(sugar).
    source_defects:
    - defect_type: WRONG_TERM
      resource: GO_CENTRAL
      requested_change: CHECK
      asserted_value: GO:0015764
      confidence: PROBABLE
      explanation: >-
        PAINT IBD for N-acetylglucosamine transport at PTN000532509 (PTHR46244) is
        seeded by a single P. aeruginosa multiphosphoryl transfer protein and
        descends to the EI(Ntr) subfamily PTHR46244:SF1 (E. coli and Salmonella
        PtsP), which does not participate in sugar transport. Move the IBD to the
        clade containing the seed or add an IRD at the EI(Ntr) clade.
