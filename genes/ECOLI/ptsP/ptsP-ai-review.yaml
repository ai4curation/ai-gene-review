  label: Escherichia coli K-12
description: 'PtsP (enzyme I-Ntr) is the soluble phosphoenolpyruvate-dependent entry enzyme of the E.
  coli nitrogen-regulatory PTS. It transfers phosphate through its phosphohistidine intermediate to NPr/PtsO,
  which passes it to the PtsN regulatory effector. Its N-terminal GAF domain couples this relay to glutamine
  and alpha-ketoglutarate: in the characterized E. coli system glutamine inhibits and alpha-ketoglutarate
  stimulates PtsP autophosphorylation. The relay regulates protein targets rather than constituting a
  sugar-specific membrane uptake complex.'
