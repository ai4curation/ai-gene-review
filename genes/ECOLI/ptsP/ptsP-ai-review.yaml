id: P37177
gene_symbol: ptsP
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  PtsP is enzyme I(Ntr), the GAF-domain-containing paralogue of PTS enzyme I that
  starts the nitrogen-regulatory phosphotransferase system (PTS(Ntr)) of Escherichia
  coli. It autophosphorylates from phosphoenolpyruvate and transfers the phosphoryl
  group specifically to the phosphocarrier NPr (PtsO), not to HPr; NPr then
  phosphorylates the regulatory EIIA(Ntr) protein PtsN. Glutamine and
  2-oxoglutarate act on its autophosphorylation through the N-terminal GAF domain,
  so the phosphorylation state of the chain reports nitrogen availability. The
  chain is a soluble cytoplasmic signalling relay that runs in parallel to the
  sugar-transport PTS and transports no sugar.
