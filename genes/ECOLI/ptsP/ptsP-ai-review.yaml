- term:
    id: GO:0009401
    label: phosphoenolpyruvate-dependent sugar phosphotransferase system
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR008731
  - InterPro:IPR036618
  review:
    summary: EI(Ntr) feeds a regulatory chain, not sugar uptake and phosphorylation.
    action: REMOVE
    reason: >-
      GO:0009401 is defined as the uptake and phosphorylation of carbohydrates
      through EI, HPr and a sugar-specific EII. EI(Ntr) does not phosphorylate HPr,
      and its chain runs in parallel to the transport PTS and ends in the regulatory
      IIA(Ntr), which has no EIIB/EIIC partner. The InterPro2GO mapping of the EI
      N-terminal domain cannot separate EI(Ntr) from sugar-PTS enzyme I.
    supported_by:
    - reference_id: PMID:10473571
      supporting_text: >-
        EI(Ntr) phosphorylated NPr but not HPr, whereas Enzyme I exhibited a strong
        preference for HPr.
    - reference_id: PMID:19400808
      supporting_text: >-
        Proteins EI(Ntr), NPr and IIA(Ntr) form a phosphoryl group transfer chain
        (Ntr-PTS) working in parallel to the phosphoenolpyruvate:carbohydrate
        phosphotransferase system (transport-PTS) in Escherichia coli.
    source_defects:
    - defect_type: WRONG_TERM
      resource: OTHER
      slot: GO term
      requested_change: CHECK
      asserted_value: GO:0009401
      confidence: PROBABLE
      explanation: >-
        InterPro2GO maps IPR008731 (PTS_EIN) and IPR036618 (PtsI_HPr-bd_sf) to the
        sugar PTS process. These domains are shared by EI(Ntr) (PtsP), which does not
        participate in sugar transport; the mapping should be restricted (for example
        by excluding NCBIfam NF008283 ptsP members) or dropped in favour of the
        molecular function.
