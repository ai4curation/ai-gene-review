suggested_questions:
- question: >-
    Do glutamine and 2-oxoglutarate bind the GAF domain directly, and is the same
    signal pair used by EI(Ntr) proteins outside the enterobacteria (for example
    Pseudomonas PtsP)?
suggested_experiments:
- description: >-
    Measure ligand binding to the isolated E. coli PtsP GAF domain (ITC or thermal
    shift) for glutamine and 2-oxoglutarate, and test GAF-domain point mutants for
    loss of regulation of PEP-dependent NPr phosphorylation.
  experiment_type: ligand binding and enzyme regulation
