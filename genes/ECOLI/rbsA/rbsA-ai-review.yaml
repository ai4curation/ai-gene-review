  - UniProtKB:P0AAF3
  review:
    summary: PAINT propagation of L-arabinose transporter activity from a node seeded by AraG.
    action: MARK_AS_OVER_ANNOTATED
    reason: The only experimental source in WITH/FROM is AraG (P0AAF3), the ATPase of the L-arabinose
      importer. RbsA sits in the ribose-importer clade (HAMAP MF_01716, NCBIfam rbsA) and all transport
      evidence for RbsABC concerns D-ribose; no study shows L-arabinose import by RbsABC. The arabinose
      specificity is a property of the AraFGH system that does not transfer across the substrate-diversified
      family.
