id: P04983
gene_symbol: rbsA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: RbsA is the cytoplasmic ATP-binding cassette subunit of the high-affinity RbsABC D-ribose
  importer of Escherichia coli. Its two fused nucleotide-binding domains hydrolyze ATP at the inner face
  of the cytoplasmic membrane to energize translocation of periplasmic RbsB-bound D-ribose through the
  RbsC2 permease dimer. RbsA associates with RbsC in an ADP-bound state and with RbsB and RbsC in the
  full RbsABC2 complex trapped with ATP, Mg2+ and vanadate. Mutants lacking RbsA lose high-affinity ribose
  transport but can grow on high ribose concentrations through a second, low-affinity uptake route.
