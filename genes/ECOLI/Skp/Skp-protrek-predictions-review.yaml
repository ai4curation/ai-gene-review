id: P0AEU7
gene_symbol: Skp
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli (strain K12)
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for Skp, the trimeric periplasmic chaperone that ferries unfolded
  outer membrane proteins to the BAM complex. Rank 1 is correct and novel - protein localization to
  outer membrane is absent from GOA and is exactly what Skp does - but two of the five top calls resolve
  to obsoleted GO terms and the rest describe membrane-complex assembly rather than chaperoning. None
  of this review's three core functions (unfolded protein carrier activity, homotrimerization, LPS
  binding) is retrieved, though the free-text channel describes the carrier role precisely. Assessment:
  1 correct novel (COR), 1 uncertain (UNC), 1 nonparalog incorrect (NPI).
