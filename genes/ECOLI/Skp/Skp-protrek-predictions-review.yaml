- source_method: ProTrek
  source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
  source_reference_id: PMID:41039041
  predicted_term:
    id: GO:0089705
    label: protein localization to outer membrane
  predicted_term_type: GO_BP
  review:
    assessment: COR
    confidence_score: 2
    summary: >-
      Top-ranked hit (score 15.22) and absent from GOA. Skp captures OMPs as they emerge from the
      Sec translocon and maintains their solubility across the periplasm until BAM inserts them, so
      protein localization to the outer membrane is a correct and specific description of its job.
      GOA carries the outcome (Gram-negative-bacterium-type cell outer membrane assembly, EXP/IDA/IGI/IPI)
      but not the localization process. Correct and novel.
    supported_by:
    - reference_id: PMID:19181847
      supporting_text: >-
        Skp captures them and maintains their solubility during transit through the periplasm to the
        BAM complex
- source_method: ProTrek
  source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
  source_reference_id: PMID:41039041
  predicted_term:
    id: GO:0032978
    label: protein insertion into membrane from inner side
  predicted_term_type: GO_BP
  review:
    assessment: UNC
    confidence_score: 1
    summary: >-
      Rank 2 (score 15.10). Directionally right - Skp receives substrates on the periplasmic side
      after inner-membrane translocation and delivers them for outer-membrane insertion - but the
      term is obsolete in the current GO release and so cannot be used, and it also implies Skp performs
      the insertion, which is BAM's role. Recorded as uncertain on the ontology-drift ground rather
      than scored as a biological error.
    supported_by:
