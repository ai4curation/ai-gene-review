- source_method: ProTrek
  source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
  source_reference_id: PMID:41039041
  predicted_term:
    id: GO:0046931
    label: pore complex assembly
  predicted_term_type: GO_BP
  review:
    assessment: NPI
    confidence_score: 0
    error_type: PARALOG_OVERANNOTATION
    summary: >-
      Rank 3 (score 13.20). Pore complex assembly describes building a pore-forming structure; Skp
      is a soluble periplasmic carrier that never enters the membrane and does not catalyse beta-barrel
      folding or insertion. The retrieval has followed its OMP substrates to their destination and
      annotated the chaperone with the substrate's fate - the same confusion as rank 2 but without
      the ontology excuse. Rank 4 (plasma membrane protein complex) continues it.
    supported_by:
    - reference_id: PMID:17908933
      supporting_text: >-
        Skp functions in a parallel chaperone pathway with DegP, serving as a backup to the primary
        SurA pathway
