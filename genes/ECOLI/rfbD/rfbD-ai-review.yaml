  review:
    summary: >-
      Precursor-supply enzyme annotated to the downstream polymer process (polysaccharide biosynthetic
      process).
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      RfbD is a soluble C4 reductase acting on a dTDP-keto-sugar; it forms no glycosidic bond and adds
      nothing to the growing O-antigen or LPS chain, which is assembled by glycosyltransferases such as
      the WbbL rhamnosyltransferase. Supplying the dTDP-L-rhamnose donor is upstream of the polymer, and
      the accurate process, dTDP-rhamnose biosynthesis (GO:0019305), is carried separately. This matches
      the project decision for the PSEPK RmlC paralogs (TreeGrafter re-review batch 07). The genetic dependence
      of O16 synthesis on the rfb cluster is kept on the experimental acts_upstream_of_or_within rows
      where they exist.
    supported_by:
    - reference_id: PMID:7517391
      supporting_text: >-
        Four rhamnose pathway genes are identified by similarity to those of other strains, the rhamnose
        transferase gene is identified by assay of its product
