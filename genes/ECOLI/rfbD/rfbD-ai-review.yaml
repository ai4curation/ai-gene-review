- term:
    id: GO:0009243
    label: O antigen biosynthetic process
  evidence_type: EXP
  original_reference_id: PMID:7512872
  qualifier: acts_upstream_of_or_within
  review:
    summary: Complementing the rfb-50 lesion restores O16 antigen in K-12.
    action: KEEP_AS_NON_CORE
    reason: >-
      The rfb cluster, including rfbD, is needed for O16 synthesis, and the acts_upstream_of_or_within
      qualifier reflects that genetic dependence. dTDP-L-rhamnose is a donor consumed by the rhamnosyltransferase,
      so the O-antigen process is product context; the reductase's core process is dTDP-rhamnose biosynthesis.
    supported_by:
    - reference_id: PMID:7512872
      supporting_text: >-
        the rough phenotype of this strain is due to the presence of one of two independent mutations
        in the rfb gene cluster
