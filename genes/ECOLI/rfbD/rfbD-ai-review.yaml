- term:
    id: GO:0009243
    label: O antigen biosynthetic process
  evidence_type: EXP
  original_reference_id: PMID:7512872
  qualifier: acts_upstream_of_or_within
  review:
    summary: >-
      Complementing the rfb-50 lesion restores O16 antigen; the complementing gene is not rfbD.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The abstract reports that a single gene cloned from strain WG1 complements rfb-50 (an IS5 insertion
      at the downstream end of rfb, in the rhamnosyltransferase region), so the experiment tests that
      gene, not rfbD. It shows that the K-12 rfb cluster is required for O16 synthesis but does not show
      rfbD doing any step of O-antigen assembly; RfbD supplies the dTDP-L-rhamnose donor, and its accurate
      process is dTDP-rhamnose biosynthesis (GO:0019305). Treated like the other polymer-level rows on
      the rfb enzymes.
    supported_by:
    - reference_id: PMID:7512872
      supporting_text: >-
        A gene cloned from strain WG1 could complement the rfb-50 mutation in strain EMG2, and the complemented
        strain produced O antigen which was typed as O16 with cross reaction to O17.
