id: P37760
gene_symbol: rfbD
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  rfbD (rmlD, b2040) encodes dTDP-4-dehydrorhamnose reductase (RmlD) of Escherichia coli K-12, a Mg(2+)-dependent
  homodimeric extended short-chain dehydrogenase/reductase. It reduces the C4 keto group of dTDP-4-dehydro-beta-L-rhamnose
  with NAD(P)H to give dTDP-beta-L-rhamnose, the final step of the RmlABCD pathway; the Salmonella ortholog
  uses NADH and NADPH about equally. The gene is in the rfb (O16 antigen) cluster, and the dTDP-L-rhamnose
  it produces is the donor for the alpha-L-rhamnose residue of the O16 repeat unit. Restoring the rfb
  cluster of K-12 restores O16 synthesis, whereas most laboratory K-12 lines carry rfb-50 (an IS5 insertion
  in the rhamnosyltransferase gene wbbL) or rfb-51 and are O-antigen negative.
