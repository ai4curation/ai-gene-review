core_functions:
  - description: >-
      RodA/MrdB is the SEDS peptidoglycan glycosyltransferase for lateral-wall
      synthesis. In the inner membrane, RodA polymerizes Lipid II-derived glycan
      strands while its cognate class-B PBP, MrdA/PBP2, catalyzes peptide
      crosslinking; together the RodA/PBP2 pair supports peptidoglycan
      biosynthesis and peptidoglycan-based organization of the cylindrical cell
      wall.
