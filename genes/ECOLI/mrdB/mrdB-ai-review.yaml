id: P0ABG7
gene_symbol: mrdB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli (strain K12)
description: >-
  MrdB, also called RodA, is the SEDS-family peptidoglycan glycosyltransferase
  of the E. coli Rod system. It is a ten-pass inner-membrane glycan polymerase
  that partners with the class-B penicillin-binding protein MrdA/PBP2 during
  lateral cell-wall elongation. RodA supplies the Lipid II polymerization
  activity of the RodA/PBP2 synthase pair, PBP2 supplies the cognate
  D,D-transpeptidase activity, and the pair supports cylindrical peptidoglycan
  synthesis needed to maintain rod shape.
