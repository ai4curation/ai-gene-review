suggested_questions:
- question: >-
    Why do ubiH mutants accumulate mainly 2-octaprenylphenol (the UbiI substrate)
    rather than the UbiH substrate 2-octaprenyl-6-methoxyphenol? Does loss of UbiH
    destabilise the Ubi metabolon or UbiI activity?
suggested_experiments:
- hypothesis: UbiH is required for Ubi complex stability, explaining accumulation of upstream intermediates in ubiH mutants.
  description: >-
    Purify the Ubi complex from a ubiH deletion and from a catalytically inactive
    ubiH point mutant, compare complex composition, and assay purified UbiH with
    a farnesylated 2-methoxy-6-polyprenylphenol analogue and NADPH.
