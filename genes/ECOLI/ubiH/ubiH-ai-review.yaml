id: P25534
gene_symbol: ubiH
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  UbiH (also called VisB) is the FAD-dependent monooxygenase that performs the
  C1 hydroxylation of aerobic ubiquinone-8 biosynthesis in Escherichia coli. It
  introduces the hydroxyl group para to the existing ring hydroxyl of
  2-octaprenyl-6-methoxyphenol, the product of the UbiI and first UbiG steps,
  giving 2-octaprenyl-6-methoxy-1,4-benzoquinol, which UbiE then C-methylates.
  UbiH belongs to the UbiH/COQ6 family of class A flavoprotein monooxygenases
  together with the C5 hydroxylase UbiI and the C6 hydroxylase UbiF. ubiH
  mutants cannot grow on nonfermentable carbon sources, lack ubiquinone and
  accumulate 2-octaprenylphenol and 2-octaprenyl-6-methoxyphenol; the
  accumulated phenolic intermediates make the cells sensitive to visible light.
  UbiH is one of the seven proteins of the soluble cytoplasmic Ubi metabolon
  (UbiE, UbiF, UbiG, UbiH, UbiI, UbiJ, UbiK).
