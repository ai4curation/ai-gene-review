- term:
    id: GO:0006833
    label: water transport
  evidence_type: IDA
  original_reference_id: PMID:8584435
  qualifier: involved_in
  negated: true
  review:
    summary: >-
      NOT annotation asserting that GlpF is not involved in water transport,
      from the same oocyte study as the NOT water-transporter row. Later
      reconstitution and structural work shows GlpF conducts water through its
      pore, at a much lower rate than glycerol.
    action: REMOVE
    reason: >-
      Treated the same as the NOT GO:0005372 row from the same paper. GO:0006833 water transport is "The
      directed movement of water (H2O) into, out of or within a cell, or between cells, by means of some
      agent such as a transporter or pore." GlpF is such a pore for water, though a poor one: UniProt's
      curated function text says it is "less well permeated by water" (PMID:11226336), and the structure/simulation
      study shows a water single file in the channel and a mutant with increased water permeability (PMID:11964478).
      Reconstituted GlpF raises proteoliposome water permeability up to 10-fold, and the PL->FW pore mutant
      loses detectable water permeability (PMID:11226336). The negation is contradicted. The measured
      secondary water permeability is distinct from the established physiological glycerol-uptake role;
      no water-transport process core is asserted.
    additional_reference_ids:
    - PMID:11964478
    - PMID:11226336
    supported_by:
    - reference_id: file:ECOLI/glpF/glpF-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: >-
        Is highly permeable to glycerol, but less well permeated by water
        (PubMed:11226336).
    - reference_id: PMID:11226336
      supporting_text: >-
        Reconstitution of affinity-purified GlpF into proteoliposomes increases
        glycerol permeability more than 100-fold and water permeability up to
        10-fold compared with control liposomes.
    - reference_id: file:ECOLI/glpF/glpF-uniprot.txt
      record_section: ["FT:MUTAGEN"]
      supporting_text: >-
        PL->FW: No detectable water or glycerol permeability.
    - reference_id: file:ECOLI/glpF/glpF-uniprot.txt
      record_section: ["CC:MISCELLANEOUS"]
      supporting_text: >-
        this dictates opposite orientations of water molecules in the two
        halves of the channel, and thus prevents the formation of a 'proton
        wire', while permitting rapid water diffusion.
    - reference_id: PMID:11964478
      supporting_text: >-
        Both simulations and observations revealed a more regular
        distribution of channel water and an increased water permeability for
        the W48F/F200T mutant.
    source_defects:
    - defect_type: OTHER
      resource: UNIPROT
      requested_change: CHECK
      asserted_value: GO:0006833
      confidence: PROBABLE
      explanation: >-
        NOT|involved_in GO:0006833 water transport on P0AER0 from PMID:8584435
        conflicts with the entry's curated FUNCTION text ("less well permeated
        by water", PMID:11226336) and MISCELLANEOUS text ("permitting rapid
        water diffusion", PMID:11964478). Please re-check whether the negation
