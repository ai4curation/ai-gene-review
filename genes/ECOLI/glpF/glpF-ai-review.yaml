- term:
    id: GO:0071288
    label: cellular response to mercury ion
  evidence_type: IDA
  original_reference_id: PMID:8584435
  qualifier: involved_in
  review:
    summary: Mercurial inhibition is established, but the cited GlpF mercury-response experiment remains
      unresolved.
    action: UNDECIDED
    reason: GO:0071288 describes a mercury-induced change in cell state or activity. Mercury inhibition
      of a transporter does not by itself show that the protein performs work in a cellular response, and
      no adaptive mercury-response role is asserted here. PMID:8584435 measures AQP/GlpF-dependent glycerol
      movement in Xenopus oocytes, but its accessible abstract does not describe the target-specific mercury
      experiment underlying this IDA. The full target experiment and its annotation rationale were not recovered.
      The independently curated inhibition evidence is from PMID:7512955, not a substitute for that missing
      experiment. Retain UNDECIDED rather than declaring an experimentally curated mapping demonstrably
      wrong from an incomplete source; neither the heterologous host alone nor absence of an adaptive-response
      mechanism proves the annotation false.
    supported_by:
    - reference_id: PMID:8584435
      supporting_text: we have further investigated the permeation pathway of glycerol through human AQP1
        (hAQP1) by the use of mutants (C189S, H180A, H209A) and inhibitors such as P-chloromercuribenzene
        sulphonate (pCMBS), CuSO4 or phloretin, in comparison with other AQP-MIP
    - reference_id: file:ECOLI/glpF/glpF-uniprot.txt
      record_section:
      - CC:ACTIVITY REGULATION
      supporting_text: 'ACTIVITY REGULATION: Transport of glycerol is blocked by mercuric ions (Hg(2+))
        but not N-ethylmaleimide. {ECO:0000269|PubMed:7512955}.'
