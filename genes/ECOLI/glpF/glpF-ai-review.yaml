      Classic glpF/glpK genetics separated GlpF-mediated facilitated entry of
      glycerol from GlpK-mediated trapping; glpF+ cells grow much faster at
      millimolar glycerol.
    action: ACCEPT
    reason: >-
      GlpF performs the facilitated membrane passage itself, directly contributing to the glycerol transport
      process. Classical mutant and permeability data distinguish that step from downstream GlpK-mediated
      intracellular trapping.
    supported_by:
    - reference_id: PMID:4563976
      supporting_text: >-
        Wild-type Escherichia coli possesses an inducible permeation system
        which catalyzes facilitated diffusion of glycerol into the cell.
    - reference_id: PMID:4563976
      supporting_text: >-
        at millimolar concentrations of glycerol, cells carrying the glpF(+)
        allele grow much faster than glpF genotypes.
