id: P0AER0
gene_symbol: glpF
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  glpF encodes the glycerol uptake facilitator, an aquaglyceroporin of the
  MIP/aquaporin family located in the cytoplasmic (inner) membrane. The
  homotetrameric channel conducts glycerol passively down its concentration
  gradient through an amphipathic, ion-excluding pore in which glycerol moves in
  single file; it also passes a few related small polyols, urea and glycine, the
  trivalent metalloids arsenite and antimonite, and water at a much lower rate
  than glycerol. Imported glycerol is trapped inside the cell by ATP-dependent
  phosphorylation by glycerol kinase (GlpK) and oxidized by the quinone-linked
  sn-glycerol-3-phosphate dehydrogenase GlpD. glpF is co-transcribed with glpK
  in the glpFK operon, which is repressed by GlpR and activated by cAMP-CRP.
existing_annotations:
- term:
    id: GO:0005372
    label: water transmembrane transporter activity
  evidence_type: IDA
  original_reference_id: PMID:8584435
  qualifier: enables
  negated: true
  review:
    summary: >-
      NOT annotation asserting that GlpF lacks water transmembrane transporter
      activity, from an oocyte study of glycerol permeation through AQP-MIP
      proteins. The cached abstract reports only GlpF glycerol-flux data. Later
      work on purified, reconstituted GlpF and on GlpF structures shows that the
      channel does conduct water, although much less well than glycerol.
    action: REMOVE
    reason: >-
      GO:0005372 is defined as "Enables the transfer of water (H2O) from one side of a membrane to the
      other"; it has no rate threshold. UniProt's curated function text (ECO:0000269, PMID:11226336) states
      that GlpF is "less well permeated by water", i.e. permeated, and reconstitution of purified GlpF
      into proteoliposomes raised water permeability up to 10-fold over protein-free liposomes (PMID:11226336),
      and the PL->FW pore mutant was reported to have no detectable water or glycerol permeability, a
      loss that presupposes water permeability in the wild type. The GlpF structure with bound water (PMID:11964478)
      shows a single file of water in the pore, a mechanism "permitting rapid water diffusion", and an
      engineered mutant with increased water permeability, which presupposes measurable water permeability
      in the native channel. The 1996 oocyte assay could reflect low sensitivity rather than absent activity.
      The negative claim is therefore contradicted by later, more direct evidence. The observed secondary
      water conduction is retained in the biological synthesis. Its contribution to native water homeostasis,
      rather than the existence of intrinsic permeability, remains an open question.
    additional_reference_ids:
    - PMID:11964478
    - PMID:11226336
    supported_by:
    - reference_id: file:ECOLI/glpF/glpF-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: >-
        Is highly permeable to glycerol, but less well permeated by water
        (PubMed:11226336).
    - reference_id: PMID:11226336
      supporting_text: >-
        Reconstitution of affinity-purified GlpF into proteoliposomes increases
        glycerol permeability more than 100-fold and water permeability up to
        10-fold compared with control liposomes.
    - reference_id: file:ECOLI/glpF/glpF-uniprot.txt
      record_section: ["FT:MUTAGEN"]
      supporting_text: >-
        PL->FW: No detectable water or glycerol permeability.
    - reference_id: PMID:11964478
      supporting_text: >-
        carried out 12-nanosecond molecular dynamics simulations that define
        the spatial and temporal probability distribution and orientation of a
        single file of seven to nine water molecules inside the channel.
    - reference_id: PMID:11964478
      supporting_text: >-
        Both simulations and observations revealed a more regular
        distribution of channel water and an increased water permeability for
        the W48F/F200T mutant.
    source_defects:
    - defect_type: OTHER
      resource: UNIPROT
      requested_change: CHECK
      asserted_value: GO:0005372
      confidence: PROBABLE
      explanation: >-
        NOT|enables GO:0005372 water transmembrane transporter activity on
        P0AER0 from PMID:8584435 conflicts with the entry's own curated
        FUNCTION text ("less well permeated by water", PMID:11226336) and with
        PMID:11964478 (water single file in the GlpF pore; increased water
        permeability of the W48F/F200T mutant relative to native). Purified
        GlpF reconstituted in proteoliposomes increased water permeability up
        to 10-fold (PMID:11226336). Please re-check whether the negation should
        be withdrawn; GlpF has low, but non-zero, water permeability.
