description: >-
  glpF encodes the inner-membrane aquaglyceroporin glycerol facilitator. The
  homotetrameric channel passively conducts glycerol across the cytoplasmic
  membrane through a selective pore, supplying intracellular glycerol to GlpK
  for phosphorylation and entry into aerobic glycerol catabolism.
