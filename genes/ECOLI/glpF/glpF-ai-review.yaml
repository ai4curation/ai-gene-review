  review:
    summary: >-
      This is a negated water-channel annotation. The cached abstract of the
      cited oocyte study documents glycerol flux assays with GlpF but does not
      expose the water-permeability measurements needed to independently verify
      the NOT assertion.
    action: UNDECIDED
    reason: >-
      GlpF is curated chiefly as a glycerol channel, but this early NOT-water
      annotation should be rechecked against later GlpF structures that show
      ordered water in the pore before deciding whether the oocyte result
