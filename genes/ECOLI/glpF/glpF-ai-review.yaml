- term:
    id: GO:0071288
    label: cellular response to mercury ion
  evidence_type: IDA
  original_reference_id: PMID:8584435
  qualifier: involved_in
  review:
    summary: >-
      The cited study used mercurial compounds as channel inhibitors in
      Xenopus oocyte glycerol-flux experiments.
    action: REMOVE
    reason: >-
      Chemical inhibition of GlpF-mediated glycerol uptake does not establish
      that the E. coli channel executes a cellular response to mercury ions.
      GlpF's supported activity in this assay is glycerol channel activity.
    supported_by:
    - reference_id: PMID:8584435
      supporting_text: >-
        inhibitors such as P-chloromercuribenzene sulphonate
