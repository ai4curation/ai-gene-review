suggested_questions:
- question: >-
    How much does the measured secondary water permeability of GlpF contribute to native E. coli water
    homeostasis alongside AqpZ? The in-vitro activity itself is established; a low rate is not evidence
    of absence.
- question: >-
    Does GlpF-mediated uptake of arsenite and antimonite warrant a metalloid
    transport annotation, given that it is a side activity of the glycerol
    pore that makes cells more sensitive to these toxicants?
suggested_experiments:
- hypothesis: >-
    GlpF conducts water at a low but physiologically meaningful rate in vivo.
  description: >-
    Compare osmotic water permeability (stopped-flow light scattering) of
    E. coli wild-type, aqpZ, glpF and aqpZ glpF deletion strains, and of
    proteoliposomes with defined GlpF:lipid ratios, to measure GlpF's unit water
    permeability alongside AqpZ.
  experiment_type: membrane permeability assay
