id: P0AE85
gene_symbol: CpxP
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli (strain K12)
description: CpxP is a homodimeric periplasmic auxiliary protein of the Escherichia
  coli Cpx envelope-stress system. Under basal conditions it binds the periplasmic
  sensor domain of CpxA and inhibits CpxA autophosphorylation. High salt or misfolded
  PapE disrupts this interaction, allowing Cpx signaling. CpxP also recognizes a
  subset of misfolded periplasmic proteins and acts as a substrate adaptor for their
  DegP-dependent proteolysis, during which CpxP is degraded with the client. CpxP
  has weak chaperone activity in vitro; its characterized client recognition is
  coupled to DegP-dependent degradation rather than in-situ aggregation prevention.
