suggested_questions:
- question: Which endogenous misfolded periplasmic proteins are direct CpxP clients
    beyond P-pilus subunits, and how broad is this substrate set under native stress
    conditions?
- question: Does CpxP simultaneously contact DegP and a misfolded client, and which
    surfaces determine substrate selection versus CpxA inhibition?
suggested_experiments:
- experiment_type: in vivo adaptor-complex mapping
  description: Use stress-resolved crosslinking proteomics with separation-of-function
    CpxP mutants to identify ternary CpxP-DegP-client complexes and distinguish direct
    adaptor substrates from downstream stress phenotypes.
- experiment_type: aggregation and degradation kinetics
  description: Compare client aggregation, DegP-dependent degradation, and CpxA
    signaling in matched wild-type, cpxP-null, and adaptor-defective strains to test
    whether weak chaperone activity has an independent physiological contribution.
