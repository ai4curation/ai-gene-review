- genes/ECOLI/CpxP/CpxP-uniprot.txt
- genes/ECOLI/CpxP/CpxP-goa.tsv
predictions:
- source_method: ProTrek
  source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
  source_reference_id: PMID:41039041
  predicted_term:
    id: GO:0036460
    label: cellular response to cell envelope stress
  predicted_term_type: GO_BP
  review:
    assessment: COR
    confidence_score: 2
    summary: >-
      Top-ranked hit (score 13.33), absent from GOA and a strict descendant of the annotated response
      to stress. Cellular response to cell envelope stress is the correct and much more specific framing
      for a protein whose whole role is modulating the Cpx envelope stress response. Correct and novel.
      What it does not capture is the direction - CpxP inhibits CpxA autophosphorylation, which is
      this review's core function as signaling receptor inhibitor activity - and no molecular-function
      call appears in the top five.
    supported_by:
