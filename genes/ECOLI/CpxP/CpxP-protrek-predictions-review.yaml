    label: pyocyanine biosynthetic process
  predicted_term_type: GO_BP
  review:
    assessment: NPI
    confidence_score: 0
    error_type: TAXON_CONSTRAINT_VIOLATION
    summary: >-
      Rank 2 (score 13.12). Pyocyanine is the redox-active phenazine pigment of Pseudomonas aeruginosa;
      E. coli does not make it and has no phenazine biosynthetic genes. There is a thin thematic link
      - envelope stress and secondary metabolism are both stress-associated - but nothing in the sequence
      supports it.
    supported_by:
