id: P0AE85
gene_symbol: CpxP
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli (strain K12)
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for CpxP, the periplasmic accessory protein that inhibits the
  CpxA sensor kinase. Rank 1 is correct and novel; the rest of the list leaves E. coli entirely, offering
  Pseudomonas pyocyanin biosynthesis, biofilm formation and dormancy at scores clustered within 0.4
  units. Scores are low throughout (13.3 to 12.9). The free-text channel identifies the protein exactly,
  naming CpxA inhibition. Assessment: 1 correct novel (COR), 1 uncertain (UNC), 1 nonparalog incorrect
  (NPI).
