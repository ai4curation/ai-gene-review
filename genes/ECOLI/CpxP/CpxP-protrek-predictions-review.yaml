  source_reference_id: PMID:41039041
  predicted_term:
    id: GO:0044010
    label: single-species biofilm formation
  predicted_term_type: GO_BP
  review:
    assessment: UNC
    confidence_score: 1
    summary: >-
      Rank 3 (score 13.09). The Cpx system does influence biofilm formation and surface attachment
      in E. coli, so a biofilm connection for CpxP is not implausible, and cpxP is among the most
      strongly Cpx-induced genes. But no biofilm phenotype is annotated or reviewed for CpxP itself,
      and at a score of 13.1 in a list whose other members are Pseudomonas metabolism and dormancy,
      this reads as neighbourhood noise rather than inference. Left uncertain.
    supported_by:
    - reference_id: file:ECOLI/CpxP/CpxP-uniprot.txt
      supporting_text: >-
        Periplasmic protein CpxP
