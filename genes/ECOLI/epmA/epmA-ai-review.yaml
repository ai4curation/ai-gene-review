- term:
    id: GO:0071468
    label: cellular response to acidic pH
  evidence_type: IMP
  original_reference_id: PMID:27826291
  qualifier: acts_upstream_of_or_within
  review:
    summary: An epmA deletion grows poorly at pH 4.5, a defect confirmed by in-frame deletion and complementation
      and linked to reduced CadA (lysine decarboxylase) production.
    action: KEEP_AS_NON_CORE
    reason: The phenotype is real and the acts_upstream_of_or_within qualifier is apt, but it is indirect.
      EpmA activates EF-P, which is needed to translate the polyproline-containing acid-stress regulator
      CadC (PMID:23239623); the cadBA response then follows. EpmA does none of the work of the acid response
      itself, so it is kept as a non-core downstream consequence of EF-P modification.
    supported_by:
    - reference_id: PMID:27826291
      supporting_text: For mnmE, apaH, epmA, and waaC, de novo in frame deletion and genetic complementation
        confirmed their role in low pH growth
    - reference_id: PMID:27826291
      supporting_text: encoding the transcriptional regulator LeuO and the elongation factor P-β-lysine
        ligase EpmA, can be linked to CadA production
    - reference_id: PMID:23239623
      supporting_text: we demonstrate the physiological relevance of EF-P to fine-tune the expression of
        the polyproline-containing pH receptor CadC to levels necessary for an appropriate stress response
