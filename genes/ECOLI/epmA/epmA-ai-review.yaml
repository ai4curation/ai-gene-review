- term:
    id: GO:0016880
    label: acid-ammonia (or amide) ligase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: enables
  supporting_entities:
  - UniRule:UR000001264
  review:
    summary: Acid-ammonia (or amide) ligase activity, from the HAMAP/UniRule EpmA rule.
    action: MODIFY
    reason: 'The essence is right: EpmA is an ATP-dependent ligase that forms an amide (isopeptide) bond
      between the carboxyl of (R)-beta-lysine and the epsilon-amino group of EF-P Lys34. But the acid-ammonia
      class does not describe a protein-modifying reaction, and GO has an exact term for this reaction:
      GO:0052868 protein-lysine lysyltransferase activity, whose definition is the RHEA:83435 equation
      and which EpmA already carries by IDA. This is a lateral replacement; GO:0052868 sits under aminoacyltransferase
      activity, not under this ligase term.'
    proposed_replacement_terms:
    - id: GO:0052868
      label: protein-lysine lysyltransferase activity
    supported_by:
    - reference_id: file:ECOLI/epmA/epmA-uniprot.txt
      supporting_text: Reaction=D-beta-lysine + L-lysyl-[protein] + ATP
- term:
    id: GO:0042803
    label: protein homodimerization activity
  evidence_type: IDA
  original_reference_id: PMID:20729861
  qualifier: enables
  review:
    summary: EpmA forms a homodimer, as shown by the crystal structures and supported by the crystallization
      study (UniProt subunit, experimental evidence from PMID:20729861 and PMID:20823541).
    action: KEEP_AS_NON_CORE
    reason: Homodimerization is a structural property inherited from the class II aaRS fold, whose active
      site is built at the dimer; it is real but is not the evolved function. The cached Yanagisawa paper
      is abstract-only, so the curated UniProt subunit line tied to it is quoted and the curator's IDA
      is kept.
    supported_by:
    - reference_id: file:ECOLI/epmA/epmA-uniprot.txt
      record_section: ["CC:SUBUNIT"]
      supporting_text: 'SUBUNIT: Homodimer.'
- term:
    id: GO:0043687
    label: post-translational protein modification
  evidence_type: RCA
  original_reference_id: PMID:20070887
  qualifier: acts_upstream_of_or_within
  review:
    summary: Post-translational protein modification, from the comparative-genomics prediction that YjeA
      and YjeK modify EF-P (PMID:20070887), since confirmed biochemically (PMID:20729861, PMID:21841797,
      PMID:22128152).
    action: ACCEPT
    reason: 'EpmA performs the covalent step itself: it ligates (R)-beta-lysine to Lys34 of fully translated,
      free EF-P, which is what this term covers (modification after release from the ribosome). This differs
      from EpmB, whose identical RCA row was marked over-annotated because EpmB only supplies the free
      donor and does not modify the protein; EpmA is the enzyme that does the work, so the term is core
      here. No more specific GO process exists for EF-P beta-lysylation.'
    supported_by:
    - reference_id: PMID:20070887
      supporting_text: we predict that the YjeA and YjeK families of proteins are involved in EF-P modification
        in a subset of bacterial species
    - reference_id: PMID:20729861
      supporting_text: it specifically aminoacylates EF-P with lysine
    - reference_id: PMID:22128152
      supporting_text: indicating that both enzymes, YjeA and YjeK, are required for β-lysylation of EF-P
