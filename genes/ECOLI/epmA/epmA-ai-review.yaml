id: P0A8N7
gene_symbol: epmA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: EpmA (also called GenX, PoxA or YjeA) is a cytoplasmic, homodimeric paralog of class II
  lysyl-tRNA synthetase that has lost the N-terminal anticodon-binding domain and does not aminoacylate
  tRNA. Instead it uses its retained class II catalytic core to activate (R)-beta-lysine, made by the
  aminomutase EpmB, with ATP as a beta-lysyl-adenylate, and transfers the beta-lysyl group to the
  epsilon-amino group of Lys34 of translation elongation factor P (EF-P), a protein that mimics the
  shape of tRNA and docks on EpmA much as tRNA(Lys) docks on LysRS. (R)-beta-lysine is preferred about
  100-fold over (S)-beta-lysine or L-alpha-lysine. The beta-lysylated residue is then hydroxylated by
  EpmC. Modified EF-P is the active form that relieves ribosome stalling at polyproline stretches, so
  loss of EpmA reduces expression of polyproline-containing proteins such as the acid-stress regulator
  CadC, causing slow growth at low pH, loss of lysine decarboxylase induction and, in Salmonella,
  pleiotropic stress-sensitivity and virulence defects.
