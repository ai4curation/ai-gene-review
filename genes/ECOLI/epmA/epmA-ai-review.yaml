core_functions:
- description: ATP-dependent (R)-beta-lysine ligase that activates (R)-beta-lysine as an adenylate and
    transfers it to the epsilon-amino group of Lys34 of elongation factor P, the activating modification
    of EF-P.
  molecular_function:
