suggested_questions:
- question: Should PAINT record a loss of tRNA binding, lysine-tRNA ligase activity and lysyl-tRNA aminoacylation
    at the EpmA subfamily node of PTHR42918, so that these LysRS functions stop propagating to EpmA orthologs?
- question: Should the InterPro2GO mappings of IPR004525 (EpmA) to lysine-tRNA ligase activity and lysyl-tRNA
    aminoacylation be withdrawn, given that the family is defined by EF-P beta-lysylation?
- question: Does GO need a process term for EF-P lysine beta-lysylation (analogous to peptidyl-hypusine
    biosynthesis for eIF5A), to replace the general post-translational protein modification term for EpmA
    and EpmC?
suggested_experiments:
- hypothesis: The residues that select (R)-beta-lysine over L-alpha-lysine lie in the amino-acid pocket
    that EpmA shares with LysRS.
  description: Solve EpmA structures with (R)- and (S)-beta-lysine adenylate analogs and test pocket mutants
    for altered enantiomer and alpha/beta selectivity by ATP-PPi exchange and EF-P modification assays.
