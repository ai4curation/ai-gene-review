  label: Escherichia coli K-12
description: >-
  IspB is the essential octaprenyl diphosphate synthase of Escherichia coli, a
  homodimeric trans-prenyltransferase of the FPP/GGPP synthase family. It
  condenses five isopentenyl diphosphate units onto (2E,6E)-farnesyl
  diphosphate to make all-trans-octaprenyl diphosphate (C40), the precursor of
  the side chains of ubiquinone-8 and menaquinone-8, which UbiA and MenA then
  transfer to their aromatic head groups. Product chain length is set by
  residues lining the elongation cavity (for example Tyr38, Ala79 and Arg321)
  and by the dimer: substitutions there yield shorter Q-5 to Q-7 side chains,
  and an inactive A79Y subunit shortens the product of a heterodimer with the
  wild-type enzyme. The enzyme needs Mg2+, releases its long hydrophobic
  product slowly, and is detected in the soluble cytosolic fraction.
