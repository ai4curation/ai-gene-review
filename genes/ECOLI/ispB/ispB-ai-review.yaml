- term:
    id: GO:0006744
    label: ubiquinone biosynthetic process
  evidence_type: IMP
  original_reference_id: PMID:11108713
  qualifier: acts_upstream_of_or_within
  review:
    summary: IspB point mutants change the side-chain length of ubiquinone made in vivo.
    action: ACCEPT
    reason: >-
      IspB makes the C40 tail that UbiA attaches to 4-hydroxybenzoate, and its
      mutants change the ubiquinone made (Q-5 to Q-7 instead of Q-8). The tail
      synthase is the chain-length-determining part of the ubiquinone pathway in
      the module. Core process.
    supported_by:
    - reference_id: PMID:11108713
      supporting_text: >-
        The Y38A and R321V mutants produced Q-6 and Q-7, and the Y38A/R321V double
        mutant produced Q-5 and Q-6, indicating that these residues are involved
        in the determination of chain length.
