suggested_questions:
- question: >-
    How is octaprenyl diphosphate handed from cytosolic IspB to the
    membrane-embedded UbiA and MenA prenyltransferases, given the slow product
    release of IspB in vitro?
suggested_experiments:
- hypothesis: Product release from IspB is accelerated by membranes or by the downstream prenyltransferases.
  description: >-
    Measure single-turnover and steady-state IspB rates with liposomes, with
    purified UbiA in proteoliposomes, and with detergent, and test IspB-UbiA
    association by crosslinking in vivo.
