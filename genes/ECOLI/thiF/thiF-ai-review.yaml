id: P30138
gene_symbol: thiF
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  ThiF is the sulfur carrier protein ThiS adenylyltransferase of Escherichia coli (EC 2.7.7.73), an
  E1-like enzyme of the HesA/MoeB/ThiF family that supplies the sulfur for the thiazole moiety of
  thiamine. As a homodimer it binds the ubiquitin-fold carrier ThiS and uses ATP to adenylate the
  carboxyl group of the ThiS C-terminal glycine. The ThiS acyl-adenylate then receives sulfur from a
  persulfide donor (the IscS-ThiI system), and ThiF Cys184 forms a transient ThiS-ThiF acyl-disulfide
  conjugate; the resulting ThiS thiocarboxylate is the immediate sulfur donor for thiazole synthase
  ThiG. Unlike ubiquitin E1 enzymes, ThiF does not form an ATP-driven thioester with its carrier.
  Each subunit binds one structural zinc ion. ThiF is cytosolic, and thiF mutants require thiazole
  for growth.
