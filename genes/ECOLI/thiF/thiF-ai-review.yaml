core_functions:
- description: >-
    Sulfur carrier protein ThiS adenylyltransferase: as a homodimer bound to ThiS, ThiF uses ATP to
    adenylate the C-terminal glycine of ThiS, activating it for sulfur transfer from the ThiI
    persulfide, and its Cys184 then forms the ThiS-ThiF acyl-disulfide that supplies sulfur for
    thiazole synthesis.
