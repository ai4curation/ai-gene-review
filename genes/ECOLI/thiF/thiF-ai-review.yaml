- term:
    id: GO:0008641
    label: ubiquitin-like modifier activating enzyme activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR035985
  review:
    summary: InterPro superfamily mapping (Ubiquitin-activating enzyme E1-like fold) to E1 activity.
    action: REMOVE
    reason: >-
      GO:0008641 is "Catalysis of the activation of small proteins, such as ubiquitin or
      ubiquitin-like proteins, through the formation of an ATP-dependent high-energy thiolester
      bond". ThiF does activate the ubiquitin-fold carrier ThiS by adenylation, but the
      ATP-dependent step yields an acyl-adenylate, not a thiolester. The covalent ThiS-ThiF
      conjugate on Cys184 is an acyl-disulfide that forms after sulfur has been added to ThiS: the
      ThiI persulfide displaces AMP to give a ThiS-ThiI acyl disulfide, and disulfide interchange
      then moves ThiS onto ThiF Cys184. That conjugate is analogous to, but chemically distinct
      from, the E1 thioester, and its formation is not ATP-driven. The activation step that ThiF
      catalyses is captured by GO:0070566 adenylyltransferase activity. The fold-level InterPro
      mapping over-reaches for ThiF/MoeB members; same action and source defect as
      genes/ECOLI/moeB.
    supported_by:
    - reference_id: PMID:16388576
      supporting_text: ThiF catalyzes the
        adenylation of the carboxy terminus of ThiS and the subsequent displacement of
        AMP catalyzed by ThiI-persulfide to give a ThiS-ThiI acyl disulfide. Disulfide
        interchange, involving Cys184 on ThiF, then generates the ThiS-ThiF acyl
        disulfide, which functions as the sulfur donor for thiazole formation.
    - reference_id: PMID:11438688
      supporting_text: This ThiF/ThiS conjugate is the
        first characterized example of a unique acyldisulfide intermediate in a
        biosynthetic system.
    source_defects:
    - defect_type: WRONG_TERM
      resource: INTERPRO
      slot: GO_ID
      requested_change: CHECK
      asserted_value: GO:0008641
      cause: SCOPE_OVER_REACH
      confidence: PROBABLE
      explanation: The InterPro2GO mapping of IPR035985 (Ubiquitin-activating enzyme E1-like
        superfamily) to GO:0008641, which requires an ATP-dependent thiolester, is applied to
        ThiF/MoeB family members such as E. coli ThiF (P30138). ThiF adenylates ThiS; its covalent
        ThiS conjugate is an acyl-disulfide formed by disulfide interchange, not an ATP-driven
        thioester. Please consider restricting the mapping to E1 families.
      supported_by:
      - reference_id: PMID:16388576
        supporting_text: Disulfide
          interchange, involving Cys184 on ThiF, then generates the ThiS-ThiF acyl
          disulfide, which functions as the sulfur donor for thiazole formation.
