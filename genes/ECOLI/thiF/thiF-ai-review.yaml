proposed_new_terms:
- proposed_name: sulfur carrier protein ThiS adenylyltransferase activity
  proposed_definition: >-
    Catalysis of the reaction: [ThiS sulfur-carrier protein]-C-terminal Gly-Gly + ATP + H+ =
    [ThiS sulfur-carrier protein]-C-terminal Gly-Gly-AMP + diphosphate.
  justification: >-
    EC 2.7.7.73 (RHEA:43344) has no GO term, whereas the parallel MoaD reaction (EC 2.7.7.80) has
    GO:0061605. ThiF is currently annotated with the mis-specified AMPylase activity (Ser/Thr/Tyr
    AMPylation) and the thioester-defined GO:0008641; a specific child of GO:0070566 would give the
    ThiF subfamily (PTHR10953:SF240) and thiamine pathway models an exact term.
  proposed_parent:
    id: GO:0070566
    label: adenylyltransferase activity
  supported_by:
  - reference_id: PMID:9632726
    supporting_text: ThiF catalyzes the adenylation by ATP of the carboxyl-terminal glycine of ThiS.
suggested_questions:
- question: Is the ThiS-ThiF Cys184 acyl-disulfide the species that hands sulfur to ThiG in vivo,
    or a protective or off-pathway intermediate, given that ThiS thiocarboxylate forms in vitro with
    ThiF C184S?
suggested_experiments:
- hypothesis: The ThiS-ThiF acyl-disulfide is a required sulfur-transfer intermediate rather than a
    storage form.
  description: Reconstitute thiazole formation with ThiF, ThiF C184S, ThiS, ThiI, IscS and ThiG, and
    compare rates and ThiS thiocarboxylate accumulation; trap and quantify the acyl-disulfide by
    intact-protein mass spectrometry.
