- term:
    id: GO:0006974
    label: DNA damage response
  evidence_type: IEP
  original_reference_id: PMID:11967071
  qualifier: acts_upstream_of_or_within
  review:
    summary: pflA transcript level changed after mitomycin C treatment in a genome-wide
      microarray study in which about 30% of genes changed expression.
    action: MARK_AS_OVER_ANNOTATED
    reason: A transcriptional change in a global stress profile does not show that PflA does any
      of the work of the DNA damage response. The study reports expression changes in nearly 30%
      of all genes, and PflA has no known activity on DNA or in repair or signalling. Its only
      established function is PFL activation. The row reflects expression, not participation.
    supported_by:
    - reference_id: PMID:11967071
      supporting_text: Unexpectedly, a large number of genes (nearly 30% of all genes) displayed
        significant changes in their expression level.
