core_functions:
- description: Pyruvate formate-lyase activase. Using reduced flavodoxin and SAM, PflA generates a
    5'-deoxyadenosyl radical that abstracts the pro-S hydrogen of PflB Gly734, converting
    inactive pyruvate formate-lyase into its active glycyl-radical form.
  molecular_function:
    id: GO:0043365
    label: '[formate-C-acetyltransferase]-activating enzyme activity'
  directly_involved_in:
  - id: GO:0018201
    label: peptidyl-glycine modification
  - id: GO:0051604
    label: protein maturation
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:6364987
    supporting_text: The catalytically active form (Ea) of pyruvate formate-lyase in Escherichia
      coli cells is generated from an inactive form of the enzyme (Ei) through a post-translational
      process that requires a distinct activating enzyme and is linked to the cleavage of
      adenosylmethionine to methionine and 5'-deoxyadenosine.
  - reference_id: PMID:8175649
    supporting_text: Our results show that the radical in pyruvate formatelyase is produced
      by stereospecific abstraction of the pro-S hydrogen of glycine 734 by the 5'-dAdo radical
      generated in the active center of PFL activase.
- description: Binding of the radical SAM [4Fe-4S] cluster through the three cysteines of the
    CxxxCxxC motif. Only the reduced [4Fe-4S]+ state is active.
  molecular_function:
    id: GO:0051539
    label: 4 iron, 4 sulfur cluster binding
  supported_by:
  - reference_id: PMID:9478932
    supporting_text: Cys --> Ser replacements by site-directed mutagenesis determined Cys-29,
      Cys-33, and Cys-36 to be essential to yield active holoenzyme.
  - reference_id: PMID:19711960
    supporting_text: Purified PFL-AE contains an oxygen-sensitive, labile [4Fe-4S] cluster that
      undergoes cluster interconversions in vitro, with only the [4Fe-4S](+) cluster state being
      catalytically active.
- description: S-adenosyl-L-methionine binding at the unique iron of the cluster as the
    radical-generating cosubstrate.
  molecular_function:
    id: GO:1904047
    label: S-adenosyl-L-methionine binding
  supported_by:
  - reference_id: PMID:9478932
    supporting_text: The iron-sulfur cluster complement proved to be a prerequisite for effective
      binding of adenosylmethionine
suggested_questions:
- question: Does the K+ dependence of PFL-AE make PFL activation sensitive to intracellular
    potassium or ammonium levels under physiological anaerobic conditions?
- question: How does PFL-AE gain access to Gly734, which is buried in the PFL dimer, and is a
    large conformational change of the PflB glycyl radical loop required in vivo?
suggested_experiments:
- hypothesis: Intracellular K+ modulates PFL activation in vivo through the PFL-AE monovalent
    cation site.
  description: Compare the PFL glycyl radical content (whole-cell EPR) of anaerobic cells
    expressing wild-type PFL-AE or a cation-site variant across a range of external K+
    concentrations in a K+-uptake-deficient background.
