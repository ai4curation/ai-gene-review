  label: Escherichia coli K-12
description: >-
  PflA is the pyruvate formate-lyase activating enzyme (PFL-AE, PFL activase; EC 1.97.1.4) of
  Escherichia coli, the founding member of the radical SAM activases that install glycyl
  radicals on glycyl radical enzymes. It is a monomeric cytosolic protein of about 28 kDa with a
  single [4Fe-4S] cluster bound by three cysteines of a CxxxCxxC motif. S-adenosyl-L-methionine
  (SAM) chelates the fourth, unique iron, and a monovalent cation (K+ gives maximal activity) is
  bound beside the SAM carboxylate. Reduced flavodoxin reduces the cluster to the active
  [4Fe-4S]+ state, which cleaves SAM to methionine and a 5'-deoxyadenosyl radical. That radical
  stereospecifically abstracts the pro-S hydrogen of Gly734 of pyruvate formate-lyase (PflB),
  converting the inactive enzyme into its active glycyl-radical form. Crystal structures with a
  Gly734-loop peptide show how the activase reaches the buried glycine. This post-translational
  activation switches on pyruvate formate-lyase for anaerobic glucose fermentation, and the
  oxygen-labile cluster interconverts in cells according to oxygen status.
