- term:
    id: GO:0030955
    label: potassium ion binding
  evidence_type: IDA
  original_reference_id: PMID:28768413
  qualifier: enables
  review:
    summary: PFL-AE binds a catalytically essential monovalent cation at its active site, and
      activity is maximal with K+ (NH4+ nearly as good).
    action: KEEP_AS_NON_CORE
    reason: The monovalent cation site is real and needed for activity. A SAM carboxylate oxygen
      ligates the cation, which tunes the SAM-cluster interaction. It is an activating cofactor
      site, not a separate function, so it is kept as non-core. The crystal structures contain
      Na+, but K+ is the activating ion. Potassium ion binding is as precise as the data
      allow.
    supported_by:
    - reference_id: PMID:28768413
      supporting_text: We show that PFL-AE binds a catalytically essential monovalent cation at
        its active site
    - reference_id: PMID:28768413
      supporting_text: PFL-AE activity sharply maximizes at K+, with NH4+ closely matching the
        efficacy of K+.
