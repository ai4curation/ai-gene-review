taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: PtsI is the general enzyme I of the Escherichia coli carbohydrate phosphotransferase system.
  The soluble homodimer uses phosphoenolpyruvate to phosphorylate HPr through a histidyl intermediate,
  supplying phosphate to sugar-specific transport systems. TmaR-dependent polar sequestration modulates
  the availability of active enzyme I.
