id: P08839
gene_symbol: ptsI
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: ptsI of Escherichia coli K-12 encodes enzyme I (EI), the general, non-sugar-specific first
  component of the phosphoenolpyruvate (PEP)-dependent sugar phosphotransferase system (PTS). The cytoplasmic
  homodimer has an N-terminal HPr-binding domain, a central domain carrying the phosphorylated His189
  and a C-terminal PEP-binding domain. EI autophosphorylates from PEP in an Mg(2+)-dependent reaction
  and transfers the phosphoryl group to His15 of HPr, which feeds the sugar-specific Enzyme II complexes.
  EI also phosphorylates the HPr-like domain of the fructose multiphosphoryl transfer protein FPr, so
  it initiates fructose PTS uptake as well as uptake of glucose and other PTS sugars. EI concentrates
  near the cell pole, where the pole-localizer TmaR sequesters it and so modulates sugar uptake.
