suggested_questions:
- question: Does EI phosphorylate the HPr-like domain of FPr with kinetics comparable to HPr in vivo,
    and does TmaR-mediated polar sequestration of EI change fructose uptake relative to glucose uptake?
suggested_experiments:
- description: Compare fructose and glucose PTS uptake rates in tmaR deletion and overexpression strains,
    and measure EI-to-FPr versus EI-to-HPr phosphotransfer rates with purified proteins.
  experiment_type: transport assay and in vitro phosphotransfer kinetics
