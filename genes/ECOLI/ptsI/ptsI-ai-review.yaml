  review:
    action: ACCEPT
    summary: PtsI initiates the carbohydrate PTS phosphotransfer chain.
    reason: The target directly performs the phosphate-entry step used for coupled sugar uptake and phosphorylation.
      It is neither the membrane permease nor a sugar-specific EII protein, but its catalytic participation
      supports the process annotation.
    supported_by:
    - reference_id: PMID:17053069
      supporting_text: Sugar translocation initiates with the Mg(2+)-dependent phosphorylation of enzyme
        I (EI) by PEP.
    - reference_id: file:ECOLI/ptsI/ptsI-uniprot.txt
- term:
    id: GO:0015764
    label: N-acetylglucosamine transport
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000532509
  - UniProtKB:Q9HXN5
  review:
    action: KEEP_AS_NON_CORE
    summary: N-acetylglucosamine uptake is one substrate-specific use of the general PTS phosphate donor.
    reason: The inherited transport claim is compatible with native EI-HPr-EII phosphate flow. PtsI supplies
      a catalytic step shared by multiple sugar systems; this term does not make it the N-acetylglucosamine
      permease or establish substrate specificity. Retain the sugar-specific physiological context as
      non-core. No PAINT node loss or misplacement is asserted. The incoming family-root TOO_DEEP assessment
      is compatible with excluding regulatory EI(Ntr), but does not by itself negate the native EI-HPr-NagE
      phosphate path in this target. Absence of the sugar-specific term on HPr is a useful comparator,
      not negative functional evidence against this existing PtsI claim. No new sugar-specific annotation
      is proposed.
    supported_by:
    - reference_id: file:ECOLI/ptsI/ptsI-uniprot.txt
    - reference_id: PMID:26784570
