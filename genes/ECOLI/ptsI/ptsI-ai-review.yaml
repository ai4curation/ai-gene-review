- term:
    id: GO:0015764
    label: N-acetylglucosamine transport
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000532509
  - UniProtKB:Q9HXN5
  review:
    summary: PAINT places N-acetylglucosamine transport at root node PTN000532509, seeded only by Pseudomonas
      aeruginosa PA3760 (Q9HXN5), a fused EI-HPr-EIIA protein.
    action: KEEP_AS_NON_CORE
    reason: 'Unlike EI(Ntr), E. coli EI is the general PTS enzyme I: through HPr it supplies phosphate
      to every sugar-specific Enzyme II, including the N-acetylglucosamine permease, so it does part of
      the work of PTS N-acetylglucosamine uptake. The term is true for this protein but names one of many
      PTS substrates; the core process is the general PTS. The node is deep for a substrate-specific term
      (it also covers EI(Ntr), for which the term is wrong), but the transfer to this sugar-PTS enzyme
      I holds. The PTHR46244 family review assesses this node as TOO_DEEP for the term; the row is retained
      here because the claim holds for the general enzyme I on independent grounds, not because the node
      placement is right.'
    supported_by:
    - reference_id: file:ECOLI/ptsI/ptsI-uniprot.txt
      record_section:
      - CC:FUNCTION
      supporting_text: General (non sugar-specific) component of the phosphoenolpyruvate-dependent sugar
        phosphotransferase system (sugar PTS).
    - reference_id: PMID:31751341
      supporting_text: Enzyme I, (EI, PtsI; TC# 8.A.7.1.1 in the Transporter Classification Database,
        TCDB (www.tcdb.org)) and HPr (HPr, PtsH; TC# 8.A.8.1.1)
