core_functions:
- description: General enzyme I of the sugar PTS. Autophosphorylates on His189 from phosphoenolpyruvate
    and transfers the phosphoryl group to HPr, and to the HPr-like domain of FPr in the fructose system,
    initiating the phosphorelay that drives sugar uptake with concomitant phosphorylation.
