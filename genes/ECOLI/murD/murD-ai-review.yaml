suggested_questions:
- question: >-
    How strictly does E. coli MurD discriminate D-glutamate from L-glutamate in vivo,
    given the much larger cellular L-glutamate pool?
- question: >-
    Does the strong phosphate stimulation of purified MurD reflect a regulatory anion
    site or a buffer/ionic-strength effect?
suggested_experiments:
- description: >-
    Determine kcat/Km for D- versus L-glutamate with purified MurD and test for
    L-Glu-containing UDP-MurNAc dipeptide in murI-depleted cells by LC-MS.
