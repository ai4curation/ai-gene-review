id: P14900
gene_symbol: murD
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  MurD is the cytoplasmic UDP-N-acetylmuramoyl-L-alanine--D-glutamate ligase
  (EC 6.3.2.9) of Escherichia coli, the second of the four ATP-dependent Mur amide
  ligases that build the peptide stem of the peptidoglycan precursor. It adds
  D-glutamate to UDP-N-acetylmuramoyl-L-alanine, the product of MurC, hydrolysing ATP
  to ADP and phosphate via an acyl-phosphate intermediate. The purified enzyme
  requires Mg2+ and is stimulated by phosphate; it also catalyses the reverse reaction.
  Crystal structures show three domains with nucleotide-binding-fold topologies whose
  C-terminal domain closes over the active site on substrate binding. murD lies in the
  division and cell wall (dcw) gene cluster and is essential.
