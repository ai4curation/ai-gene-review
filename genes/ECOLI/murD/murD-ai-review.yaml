  review:
    summary: Self-interaction detected in a proteome-scale yeast two-hybrid screen.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The only support is a high-throughput Y2H homomeric hit. Biochemical and
      structural work on E. coli MurD describes a single-chain, three-domain enzyme, and
      deposited E. coli MurD structures (e.g. 5A5E) are assigned a monomeric biological
      unit; no functional MurD homo-oligomer has been reported. The interaction is not
      refuted, but annotating MurD with self-binding over-states its biology.
