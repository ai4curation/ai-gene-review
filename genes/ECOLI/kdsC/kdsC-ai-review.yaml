id: P0ABZ4
gene_symbol: kdsC
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  KdsC (formerly YrbI) is the 3-deoxy-D-manno-octulosonate 8-phosphate (KDO 8-P) phosphatase of Escherichia
  coli. This small (188-residue) HAD-superfamily hydrolase requires a divalent metal such as Mg2+ and
  is highly specific for KDO 8-P, which it hydrolyses to free KDO and inorganic phosphate in the third
  step of KDO biosynthesis. The KDO is then activated by KdsB for transfer to lipid A in the lipopolysaccharide
  inner core. The enzyme is a cytosolic tetramer. kdsC is not essential, so another phosphatase can perform
  this step.
