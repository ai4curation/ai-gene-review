- id: file:ECOLI/lptD/lptD-uniprot.txt
  title: UniProtKB reviewed entry for E. coli lptD (P31554)
  findings:
  - statement: UniProt curates LptD as a cell outer membrane LPS-assembly protein that
      interacts with LptE and LptA and contains two intramolecular disulfide bonds.
core_functions:
- description: >-
    LptD is the outer-membrane beta-barrel subunit of the LptDE translocon. Its
    N-terminal periplasmic beta-jellyroll docks LptA and receives LPS from the
    periplasmic Lpt bridge. The barrel, plugged by LptE, then moves LPS across
    the outer membrane: the sugar moieties pass through the lumen and lipid A
    enters the outer leaflet laterally. This builds the LPS outer leaflet of the
    Gram-negative outer membrane.
  contributes_to_molecular_function:
    id: GO:0015221
    label: lipopolysaccharide transmembrane transporter activity
  directly_involved_in:
  - id: GO:0015920
    label: lipopolysaccharide transport
  - id: GO:0043165
    label: Gram-negative-bacterium-type cell outer membrane assembly
  locations:
  - id: GO:0009279
    label: cell outer membrane
  in_complex:
    id: GO:0062051
    label: lipopolysaccharide transport system
  supported_by:
  - reference_id: PMID:29449493
    supporting_text: LptDE inserts LPS into the outer leaflet of the outer membrane
  - reference_id: PMID:16861298
    supporting_text: These data clearly show that in the absence of Imp or RlpB de
      novo synthesized LPS does not reach the outer leaflet of the OM.
  - reference_id: PMID:24990744
    supporting_text: LptD forms a novel 26-stranded β-barrel, which is to our knowledge
      the largest β-barrel reported so far.
  - reference_id: PMID:26370939
    supporting_text: As predicted, the LptD N-terminal domain consists of two sheets
      of 11 antiparallel beta-strands exhibiting the beta-jellyroll fold found in LptA
      and LptC
proposed_new_terms: []
suggested_questions:
- question: >-
    Should GO add a specific term for the LptDE outer-membrane translocon as a
    subcomplex (part_of GO:0062051 lipopolysaccharide transport system), so that
    the stable LptDE complex can be distinguished from the transient
    trans-envelope bridge?
- question: >-
    Does LPS move through the LptD lumen and lateral beta1-beta26 gate as a
    single coordinated event in E. coli, and what triggers opening of the lateral
    gate?
- question: >-
    How does the disulfide rearrangement in LptD, gated by LptE and assisted by
    LptM, couple translocon maturation to docking of the LptA bridge?
suggested_experiments:
- experiment_type: in vivo crosslinking of the lateral gate
  description: >-
    Introduce cysteine pairs that lock strands beta1 and beta26 of E. coli LptD
    together and use pulse-labelling with PagP or surface-exposure assays to
    test whether newly made LPS still reaches the outer leaflet. This would
    establish that the lateral gate is required for insertion in vivo.
- experiment_type: single-molecule reconstitution
  description: >-
    Use proteoliposomes with LptB2FGC, LptA and LptDE and orientation-specific
    probes of the outer leaflet to measure LPS insertion kinetics and
    leaflet-specific delivery directly, comparing wild-type LptD with gate or
    jellyroll mutants.
