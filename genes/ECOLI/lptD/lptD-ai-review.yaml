  review:
    summary: >-
      Wu et al. 2006 copurified Imp (LptD) with RlpB (LptE) and confirmed the
      interaction by reciprocal immunoprecipitation. This was the founding
      identification of the LptDE complex.
    action: REMOVE
    reason: >-
      The LptD-LptE interaction is real and central to LptD biology. However,
      bare protein binding carries no functional information, and the
      repository's protein-binding policy removes it. The paper does not support
      a more specific binding molecular function, and complex membership is
      already captured by GO:1990351 transporter complex. Removal does not mean
      the interaction is false.
