- term:
    id: GO:0015221
    label: lipopolysaccharide transmembrane transporter activity
  evidence_type: IDA
  original_reference_id: PMID:29449493
  qualifier: contributes_to
  review:
    summary: >-
      Proposed contributes_to annotation. LptD is the beta-barrel of the
      two-subunit LptDE translocon, which moves LPS from the periplasmic side of
      the outer membrane to its outer leaflet. In reconstituted proteoliposomes,
      LPS is delivered directly to LptD.
    action: NEW
    reason: >-
      LptD has no informative existing MF annotation. GO:0140332 lipopolysaccharide
      transfer activity was considered and rejected: its definition describes
      carrying LPS through the aqueous phase from a donor membrane to an acceptor
      membrane, which is the bridge activity of LptC and LptA, not barrel-mediated
      insertion. GO:0015221 (transfer of LPS from one side of a membrane to the
      other) fits the translocon. The core and O-antigen pass through the LptD
      lumen to the cell surface, and lipid A enters the outer leaflet through the
      lateral beta1-beta26 gate. The activity belongs to the LptDE complex, with
      LptE as the plug and LPS-binding partner, so contributes_to is used. This
      matches the PSEPK orthologue core function.
    additional_reference_ids:
    - PMID:24990744
    - PMID:24990751
    - PMID:16861298
    supported_by:
    - reference_id: PMID:29449493
      supporting_text: LptDE inserts LPS into the outer leaflet of the outer membrane
    - reference_id: PMID:24990744
      supporting_text: the hydrophilic O-antigen and the core oligosaccharide of the
        LPS may pass through the barrel and the lipid A of the LPS may be inserted
        into the outer leaflet of the outer membrane through a lateral opening between
        strands β1 and β26 of LptD
    - reference_id: PMID:16861298
      supporting_text: the Imp/RlpB complex is responsible for LPS reaching the outer
        surface of the outer membrane.
