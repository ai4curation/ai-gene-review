- term:
    id: GO:0043165
    label: Gram-negative-bacterium-type cell outer membrane assembly
  evidence_type: IMP
  original_reference_id: PMID:16861298
  qualifier: involved_in
  review:
    summary: >-
      Depleting Imp (LptD) raises outer-membrane density and total cellular LPS,
      causes extra membrane to accumulate in the periplasm, lets phospholipids
      into the outer leaflet (shown by PagP modification), and stops new LPS
      from reaching the cell surface.
    action: ACCEPT
    reason: >-
      Direct mutant-phenotype evidence in E. coli shows that LptD is required to
      assemble the LPS outer leaflet. LptD does part of the work of this process
      itself: it is the barrel through which LPS is inserted, not merely a
      required factor. This matches the historical imp ("increased membrane
      permeability") and ostA (organic solvent tolerance) phenotypes, which come
      from defective outer-membrane assembly.
    supported_by:
    - reference_id: PMID:16861298
      supporting_text: Cells depleted of Imp or RlpB have similar phenotypes; the
        density of the OM is altered, total cellular LPS is increased, abnormal membrane
        structures accumulate in the periplasm, and phospholipids appear in the outer
        leaflet of the OM.
    - reference_id: PMID:2547691
      supporting_text: The mutations alter the permeability of the outer membrane
        resulting in increased sensitivity to detergents, antibiotics and dyes.
