suggested_questions:
- question: Does E. coli RhlE associate with RNase E in vivo under any growth condition (e.g. cold), or
    is its degradosome activity limited to reconstitution?
suggested_experiments:
- hypothesis: RhlE joins the RNase E scaffold in vivo at low temperature.
  description: Affinity-purify FLAG-RNase E from cells grown at 15-37 C and quantify RhlE by MudPIT, comparing
    wild type with the 791-843 deletion that abolishes RhlE binding.
