id: P25888
gene_symbol: rhlE
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: RhlE is a DEAD-box ATP-dependent RNA helicase of Escherichia coli whose ATPase is stimulated
  by both long RNAs and short oligoribonucleotides and which unwinds short RNA duplexes with low processivity.
  It cosediments with ribosomes and acts as a ribosome assembly factor that genetically modulates the
  DeaD and SrmB helicases. RhlE binds the RNase E scaffold at a site distinct from RhlB and can replace
  RhlB in a reconstituted degradosome to aid PNPase degradation of structured RNA, although it is not
  a stable degradosome component in E. coli.
