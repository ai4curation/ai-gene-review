  review:
    summary: >-
      CoaA binds ATP as its phosphoryl donor; the binding term is true but subsidiary to the kinase activity.
    action: KEEP_AS_NON_CORE
    reason: >-
      Kinetics revealed two cooperative ATP sites on the dimer, and the K101M P-loop mutant fails to bind
      an ATP analog. ATP binding is part of the pantothenate kinase reaction already captured by GO:0004594.
    supported_by:
    - reference_id: PMID:7929447
      supporting_text: >-
        Kinetic analysis indicated the presence of two ATP binding sites that exhibited positive cooperativity
        with a Hill coefficient of 1.46.
