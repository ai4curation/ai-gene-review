id: P0A6I3
gene_symbol: coaA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  coaA (b3974) encodes the type I (prokaryotic, P-loop) pantothenate kinase of Escherichia coli, which
  phosphorylates (R)-pantothenate with ATP to 4'-phosphopantothenate in the first and rate-controlling
  step of CoA biosynthesis from pantothenate. The cytoplasmic enzyme is a homodimer with two cooperative
  ATP sites; CoA and its thioesters inhibit it by competing at the ATP site, giving the main feedback
  control of the CoA pool. CoaA also phosphorylates pantetheine and N-substituted pantothenamides, which
  lets E. coli salvage pantethine and is exploited for chemo-enzymatic synthesis of CoA analogs. coaA
  temperature-sensitive mutants lose pantothenate kinase activity and fail to convert pantothenate to
  CoA.
