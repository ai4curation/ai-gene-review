- term:
    id: GO:0042803
    label: protein homodimerization activity
  evidence_type: IDA
  original_reference_id: PMID:7929447
  qualifier: enables
  review:
    summary: CoaA is a homodimer; dimerization is structural rather than catalytic.
    action: KEEP_AS_NON_CORE
    reason: >-
      The purified enzyme is a homodimer and active/inactive heterodimers abolish cooperative ATP binding,
      so dimerization shapes regulation, but it is a property of the kinase rather than a separate function.
    supported_by:
    - reference_id: PMID:7929447
      supporting_text: Kinetic analysis of the chimeric heterodimers showed the absence of cooperative
        ATP interactions
- term:
    id: GO:0050165
    label: pantetheine kinase activity
  evidence_type: IDA
  original_reference_id: PMID:16357994
  qualifier: enables
  review:
    summary: >-
      CoaA also phosphorylates pantetheine and pantetheine analogs, a genuine secondary activity used
      in pantethine salvage.
    action: KEEP_AS_NON_CORE
    reason: >-
      The chemo-enzymatic route uses E. coli CoaA to convert activated pantothenate/pantetheine analogs
      into CoA analogs, and in vivo E. coli metabolizes pantethine to bypass coaBC because of the substrate
      range of its CoaA. Pantetheine phosphorylation is a real, physiologically usable secondary activity,
      but pantothenate phosphorylation in de novo CoA synthesis remains the core role.
    supported_by:
    - reference_id: PMID:16357994
      supporting_text: biosynthetic conversion to the coenzyme A (CoA) analog
    - reference_id: PMID:21551303
      supporting_text: E. coli can effectively metabolize pantethine to bypass the requirement for coaBC
    - reference_id: PMID:21551303
      supporting_text: >-
        the differential characteristics of pantethine utilization in these two microorganisms are due
        to the different substrate specificities associated with endogenous pantothenate kinase
