- term:
    id: GO:0019840
    label: isoprenoid binding
  evidence_type: IDA
  original_reference_id: PMID:30686758
  qualifier: enables
  review:
    summary: The UbiJ SCP2 domain binds polyprenylated ubiquinone intermediates.
    action: NEW
    reason: >-
      Hajj Chehade et al. showed that the SCP2 domain of UbiJ forms a
      hydrophobic cavity that binds UQ biosynthetic intermediates (polyprenyl
      phenols, i.e. isoprenoid compounds by the GO definition) inside the Ubi
      complex. This is UbiJ's only demonstrated molecular activity and the
      basis of its role in the metabolon. Comparator check: the analogous
      lipid-presenting accessory factor of the mitochondrial CoQ synthome,
      human COQ9, carries GO:0019840 isoprenoid binding by IDA, so the term is
      used by GO for exactly this role. GO:0048039 ubiquinone binding is not
      used because the bound species are pathway intermediates rather than
      ubiquinone itself.
    supported_by:
    - reference_id: PMID:30686758
      supporting_text: >-
        The SCP2 domain of UbiJ forms an extended hydrophobic cavity that binds
        UQ intermediates inside the 1-MDa Ubi complex.
    - reference_id: file:ECOLI/ubiJ/ubiJ-uniprot.txt
      supporting_text: >-
        Binds hydrophobic ubiquinone biosynthetic intermediates via its SCP2
        domain
      record_section:
      - CC:FUNCTION
