taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  UbiJ (formerly YigP) is a 201-residue soluble accessory protein of
  Escherichia coli required for aerobic ubiquinone (coenzyme Q8) biosynthesis.
  Its N-terminal sterol carrier protein 2 (SCP2) domain forms an extended
  hydrophobic cavity that binds polyprenylated ubiquinone biosynthetic
  intermediates, and its C-terminal region forms a UbiJ-UbiK2 heterotrimer
  with the coiled-coil protein UbiK. UbiJ is essential for the stability of the
  roughly 1-MDa cytosolic Ubi metabolon, which groups UbiJ and UbiK with the
  ring-tailoring enzymes UbiE, UbiF, UbiG, UbiH and UbiI and carries out the
  last six reactions of the pathway; it is proposed to be the docking platform
  on which these enzymes access their lipid-bound substrates. ubiJ mutants are
  impaired for ubiquinone synthesis and growth in rich medium under aerobiosis
  and accumulate octaprenylphenol, but have no defect anaerobically. The gene
  lies in the ubiE-ubiJ-ubiB operon, and in Salmonella ubiJ is required for
  proliferation in macrophages.
