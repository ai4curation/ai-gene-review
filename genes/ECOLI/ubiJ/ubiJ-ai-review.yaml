core_functions:
- description: >-
    Lipid-binding scaffold of the cytosolic Ubi metabolon: the SCP2 domain
    binds and shields the hydrophobic polyprenylated intermediates of the late
    ring-tailoring steps, while the C-terminal region, with UbiK, holds the
    complex together, allowing the soluble Ubi enzymes to modify their
    substrates in an aqueous environment.
  molecular_function:
    id: GO:0019840
    label: isoprenoid binding
  directly_involved_in:
  - id: GO:0006744
    label: ubiquinone biosynthetic process
  locations:
  - id: GO:0005829
    label: cytosol
  in_complex:
    id: GO:0110142
    label: ubiquinone biosynthesis complex
  supported_by:
  - reference_id: PMID:30686758
    supporting_text: >-
      The SCP2 domain of UbiJ forms an extended hydrophobic cavity that binds
      UQ intermediates inside the 1-MDa Ubi complex.
  - reference_id: file:ECOLI/ubiJ/ubiJ-uniprot.txt
    supporting_text: >-
      May constitute a docking platform where Ubi enzymes assemble and access
      their SCP2-bound polyprenyl substrates (PubMed:30686758).
    record_section:
    - CC:FUNCTION
suggested_questions:
- question: >-
    How is newly made ubiquinone transferred from the UbiJ SCP2 cavity in the
    cytosolic metabolon to the inner membrane, and is UbiK required for that
    step?
- question: >-
    Why is the UbiJ C-terminal segment alone sufficient to restore Q8
    synthesis in the ubiJ mutant, whereas the SCP2 domain is reported to bind
    the intermediates?
suggested_experiments:
- hypothesis: SCP2-domain lipid binding is required for UbiJ function in vivo.
  description: >-
    Introduce cavity-lining substitutions in the UbiJ SCP2 domain, confirm loss
    of intermediate binding with purified protein and lipidomics of copurified
    ligands, and measure UQ8 and intermediate accumulation in complemented
    ubiJ cells.
