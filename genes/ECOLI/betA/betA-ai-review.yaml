- id: PMID:3512525
  title: Choline-glycine betaine pathway confers a high level of osmotic tolerance in Escherichia
    coli.
  findings:
  - statement: Crude E. coli membrane preparations were reported to oxidize choline to betaine
      aldehyde and aldehyde to glycine betaine at nearly the same rate; a separate soluble
      NAD-dependent enzyme oxidized betaine aldehyde. Attribution of both membrane activities to
      purified BetA is disputed by later enzymology.
    supporting_text: "A membrane-bound, O2-dependent,\nand electron transfer-linked dehydrogenase was
      found which oxidized choline to\nglycine betaine aldehyde and aldehyde to glycine betaine at nearly
      the same\nrate."
    finding_review:
      finding_status: DISPUTED
      superseded_by:
      - PMID:39510372
      review_notes: 'The old crude-membrane observation is not erased. What is disputed is assignment
        of its second reaction to BetA itself: the newer purified enzyme failed to oxidize betaine aldehyde.
        Accessible text does not resolve every strain/assay difference, so OVERTURNED would overstate
        the comparison. The soluble NAD-linked reaction remains a separate BetB result.'
      supported_by:
      - reference_id: PMID:39510372
        supporting_text: "highly pure E. coli CHDH could only oxidize choline to betaine\naldehyde but
          failed to further oxidize betaine aldehyde to betaine"
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract read. The crude-membrane activity also oxidized betaine aldehyde; the
      NAD-dependent kinetics belong to the soluble enzyme (BetB).
  full_text_unavailable: true
