- id: PMID:34431198
  title: 'The choline dehydrogenase BetA of Acinetobacter baumannii: a flavoprotein responsible for osmotic
    stress protection.'
  findings:
  - statement: A. baumannii BetA is a membrane-associated flavoprotein choline dehydrogenase that also
      oxidizes betaine aldehyde in vitro.
  - statement: The external full-text assay uses PMS as primary electron acceptor, with oxygen consumed
      upon its reoxidation; no NAD-dependent aldehyde reaction is established by this assay.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full publisher article consulted externally at https://enviromicro-journals.onlinelibrary.wiley.com/doi/10.1111/1462-2920.15741;
      local cache remains abstract-only. Source is A. baumannii ATCC19606 HMPREF0010_01460, recombinantly
      expressed with a His tag in E. coli. Results and coupled-assay methods explicitly use PMS as primary
      acceptor; oxygen consumption follows PMS reoxidation. The enriched preparation also contained a
      peptidyl-prolyl isomerase. Aldehyde turnover is an in vitro capability, not evidence of NAD reduction,
      native BetB dispensability, or KT2440 secondary activity.
  full_text_unavailable: true
