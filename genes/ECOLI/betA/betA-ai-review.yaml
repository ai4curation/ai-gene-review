suggested_questions:
- question: Which physiological electron acceptor receives electrons from this BetA, and under which membrane/assay
    conditions, if any, does it oxidize betaine aldehyde?
- question: If sequence-verified BetA shows betaine-aldehyde oxidation with a respiratory acceptor
    under particular conditions, should GO add a betaine-aldehyde dehydrogenase (acceptor) term? The
    NAD-specific GO:0008802 does not represent that chemistry; the older crude-membrane activity
    alone does not establish this BetA capability.
