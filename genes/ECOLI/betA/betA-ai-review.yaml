id: P17444
gene_symbol: betA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: betA (b0311) encodes the FAD-dependent choline dehydrogenase of Escherichia coli, a peripheral
  protein of the cytoplasmic membrane in the glucose-methanol-choline (GMC) oxidoreductase family. It
  oxidizes imported choline to betaine aldehyde with a respiratory (non-NAD) electron acceptor, the first
  of two steps by which E. coli makes the osmoprotectant glycine betaine from choline; the soluble NAD-dependent
  BetB enzyme performs the second step. The betIBA operon and the divergent betT choline-transporter gene
  are induced by osmotic stress and choline and repressed anaerobically by ArcA. betA mutants cannot use
  choline for osmoprotection but are rescued by glycine betaine. Crude membrane preparations also oxidized
  betaine aldehyde, but the purified enzyme oxidizes only choline.
