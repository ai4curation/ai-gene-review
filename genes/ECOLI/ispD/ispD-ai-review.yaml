    supporting_text: catalyzes the conversion of 2-C-methyl-D-erythritol 4-phosphate (MEP) and cytidine
      triphosphate (CTP) to 4-diphosphocytidyl-2-C-methylerythritol (CDPME)
  - reference_id: PMID:10518523
    supporting_text: The radiolabeled 4-diphosphocytidyl-2-C-methylerythritol was shown to be efficiently
      incorporated into carotenoids by isolated chromoplasts of Capsicum annuum.
  - reference_id: PMID:18304323
    supporting_text: we identified 1103 proteins from the cytosolic fraction of the Escherichia coli strain
      MC4100
suggested_questions:
- question: Does E. coli IspD associate physically with IspF (encoded in the same operon) or IspE in vivo,
    as the IspDF fusion proteins of other bacteria might suggest, and would such an association change
    pathway flux?
suggested_experiments:
- description: Test for an IspD-IspF or IspD-IspE complex in E. coli by chromosomal affinity tagging under
    native expression, followed by co-purification and crosslinking mass spectrometry, and measure CDP-ME
    accumulation in strains where the two genes are expressed from separate loci.
