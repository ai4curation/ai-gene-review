id: Q46893
gene_symbol: ispD
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: IspD (YgbP) is the 2-C-methyl-D-erythritol 4-phosphate cytidylyltransferase of Escherichia
  coli, a soluble cytosolic homodimeric enzyme of the methylerythritol phosphate (MEP) pathway, the
  organism's only route to the isoprenoid precursors isopentenyl diphosphate and dimethylallyl diphosphate.
  It catalyses the second step of the pathway, transferring CMP from CTP to 2-C-methyl-D-erythritol 4-phosphate
  (MEP) to give 4-diphosphocytidyl-2-C-methyl-D-erythritol (CDP-ME) and diphosphate by an ordered mechanism
  in which CTP binds first. Lys27 and Lys213 stabilise the pentacoordinate phosphate transition state, and
  Mg2+ is required as the CTP-Mg2+ complex rather than as a protein-bound metal. The gene lies in an operon
  with ispF, and point mutations that inactivate it are lethal unless isoprenoid precursors are supplied
  by a heterologous mevalonate route.
existing_annotations:
- term:
    id: GO:0000287
    label: magnesium ion binding
  evidence_type: IDA
  original_reference_id: PMID:10518523
  qualifier: enables
  review:
    summary: Mg2+ is needed for catalysis but is carried by the CTP substrate, not coordinated by the protein.
    action: MARK_AS_OVER_ANNOTATED
    reason: The cytidylyltransferase reaction is Mg2+ dependent, which the curator read in the full text
      of Rohdich et al. (abstract-only in the cache). Crystal structures of E. coli IspD solved with CTP-Mg2+
      and CDP-ME-Mg2+ show the metal bound to the nucleotide, and the curated UniProt record notes that no
      coordination bond between IspD and magnesium is seen in any complex. A metal requirement met by the
      Mg-nucleotide substrate is part of the catalytic activity, not a separate magnesium-binding function
      of the protein, so the row over-states what was measured.
    supported_by:
    - reference_id: file:ECOLI/ispD/ispD-uniprot.txt
      record_section: ["CC:MISCELLANEOUS"]
      supporting_text: There are no coordination bonds that occur between IspD and magnesium in any of
        the complexes examined to date.
    - reference_id: PMID:11427897
      supporting_text: complexed with both CTP-Mg2+ and CDP-ME-Mg2+
