core_functions:
- description: Cytosolic homodimeric MEP cytidylyltransferase that transfers CMP from CTP (as CTP-Mg2+)
    to 2-C-methyl-D-erythritol 4-phosphate, forming 4-diphosphocytidyl-2-C-methyl-D-erythritol and diphosphate
    in the second step of the MEP pathway to IPP/DMAPP.
  molecular_function:
    id: GO:0050518
    label: 2-C-methyl-D-erythritol 4-phosphate cytidylyltransferase activity
  directly_involved_in:
