- term:
    id: GO:0008270
    label: zinc ion binding
  evidence_type: IDA
  original_reference_id: PMID:7893665
  qualifier: enables
  review:
    summary: Tgt binds one structural zinc per subunit.
    action: KEEP_AS_NON_CORE
    reason: >-
      Atomic emission spectrometry and mutagenesis show about one zinc per
      subunit coordinated by Cys302, Cys304, Cys307 and His317, needed for
      trimer formation and tRNA binding. The term is as precise as warranted
      but describes a structural cofactor rather than the catalytic function.
    supported_by:
    - reference_id: PMID:7893665
      supporting_text: >-
        wild-type TGT contains ca. 0.8 mol of zinc/mol of subunit, determined by
        atomic emission spectrometry
    - reference_id: PMID:7893665
      supporting_text: >-
        cysteines 302, 304, and 307 and histidine 317 are the ligands to the
        zinc
