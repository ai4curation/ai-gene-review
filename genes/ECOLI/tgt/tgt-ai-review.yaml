id: P0A847
gene_symbol: tgt
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  Tgt is the cytoplasmic queuine tRNA-ribosyltransferase (tRNA-guanine
  transglycosylase) of Escherichia coli. This zinc-containing enzyme exchanges
  guanine 34, the anticodon wobble base of tRNA(Asp), tRNA(Asn), tRNA(His) and
  tRNA(Tyr), for the queuine precursor preQ1 (7-aminomethyl-7-deazaguanine)
  through a double-displacement mechanism with a covalent enzyme-RNA
  intermediate. The preQ1-tRNA product is then converted on the tRNA by QueA and
  QueG to queuosine. Loss of Tgt abolishes queuosine in tRNA without a growth
  defect under laboratory conditions, but reduces viability under unfavourable
  conditions.
