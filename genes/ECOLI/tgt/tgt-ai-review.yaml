proposed_new_terms:
- proposed_name: bacterial tRNA-guanosine(34) preQ1 transglycosylase activity
  proposed_definition: >-
    Catalysis of the exchange of guanine at position 34 in a target tRNA with
    7-aminomethyl-7-deazaguanine (preQ1), producing preQ1-modified tRNA and free
    guanine.
  justification: >-
    Bacterial Tgt performs RHEA:24104 with preQ1, whereas the GO:0008479
    definition specifies the free-queuine reaction RHEA:16633 of eukaryotic
    QTRT1/QTRT2. Same proposal as for the P. putida ortholog.
  proposed_parent:
    id: GO:0016763
    label: pentosyltransferase activity
  supported_by:
  - reference_id: file:ECOLI/tgt/tgt-uniprot.txt
    record_section: ["CC:CATALYTIC ACTIVITY"]
    supporting_text: "Xref=Rhea:RHEA:24104"
suggested_questions:
- question: >-
    Should bacterial preQ1-inserting Tgt receive a GO molecular-function term
    distinct from eukaryotic free-queuine insertion (GO:0008479)?
suggested_experiments:
- hypothesis: E. coli Tgt discriminates against free queuine relative to preQ1.
  description: >-
    Compare steady-state kinetics of guanine exchange into tRNA(Tyr) with
    radiolabelled preQ1 versus queuine.
