  evidence_type: IMP
  original_reference_id: PMID:16000837
  qualifier: enables
  review:
    summary: OASS-B was identified as one of five E. coli proteins with L-cysteine desulfhydrase activity,
      and cysM disruption increased cysteine accumulation.
    action: KEEP_AS_NON_CORE
    reason: Cysteine beta-elimination is a genuine secondary activity of the O-acetylserine sulfhydrylase
      fold (a degradative branch through the PLP-bound aminoacrylate intermediate), and the disruption
      study shows it contributes to cysteine degradation in vivo. The authors conclude that tryptophanase
      is the primary cysteine-degrading enzyme, so the activity is peripheral to CysM's biosynthetic role.
    supported_by:
    - reference_id: PMID:16000837
      supporting_text: three additional proteins having L-cysteine desulfhydrase activity were identified
        as O-acetylserine sulfhydrylase-A, O-acetylserine sulfhydrylase-B, and MalY protein
    - reference_id: PMID:16000837
      supporting_text: Growth phenotype and transcriptional analyses suggest that tryptophanase contributes
        primarily to L-cysteine degradation.
