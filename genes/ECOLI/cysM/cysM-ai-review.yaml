suggested_questions:
- question: How much native flux passes through CysM-dependent S-sulfocysteine and Grx/NrdH reduction,
    versus CysM-independent thiosulfate assimilation, outside the engineered cysteine-overproduction conditions?
- question: Does CysM's cysteine desulfhydrase side reaction have any physiological role in sulfide supply
    (for example to Fe-S assembly) when the ISC and SUF cysteine desulfurases are limiting?
suggested_experiments:
- description: Measure kinetics of purified CysM with thiosulfate versus sulfide, and compare growth and
    intracellular S-sulfocysteine of cysK, cysM and cysK cysM mutants on sulfate versus thiosulfate as
    the sole sulfur source.
  experiment_type: enzyme kinetics and genetic epistasis
