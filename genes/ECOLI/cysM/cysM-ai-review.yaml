gene_symbol: cysM
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: CysM (O-acetylserine sulfhydrylase B, cysteine synthase B) is one of the two pyridoxal 5'-phosphate-dependent
  O-acetylserine sulfhydrylase isoenzymes of Escherichia coli K-12. This soluble, homodimeric cytosolic
  enzyme condenses O-acetyl-L-serine with sulfide to form L-cysteine and acetate, the terminal step of
  de novo cysteine biosynthesis. It can also use thiosulfate in place of sulfide, giving S-sulfo-L-cysteine,
  which suits it to the thiosulfate branch of sulfur assimilation; its gene lies at the end of the cysPUWAM
  sulfate/thiosulfate transport operon. Unlike the CysK isoenzyme, CysM does not form the cysteine synthase
  complex with serine acetyltransferase (CysE). Through beta-elimination of cysteine, CysM also shows
  a secondary L-cysteine desulfhydrase activity that contributes modestly to cysteine degradation, and
  in crude-extract reconstitutions it can release cysteine sulfur used for in vitro Fe-S cluster formation.
