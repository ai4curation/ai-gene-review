proposed_new_terms:
- proposed_name: S-sulfo-L-cysteine synthase (O-acetyl-L-serine-dependent) activity
  proposed_definition: 'Catalysis of the reaction: O-acetyl-L-serine + thiosulfate = S-sulfo-L-cysteine
    + acetate.'
  justification: S-sulfocysteine formation is a chemically distinct reaction from GO:0004124 sulfide-dependent
    cysteine synthesis. The curated P16703 FUNCTION supplies the target reaction; BW25113 cysM genetics
    in PMID:22607201 supports the physiological branch. That paper directly assays downstream reductases,
    not purified CysM thiosulfate turnover. No direct target kinetic constant is inferred. The same proposed
    MF is used for independently assayed PAO1 CysM; the proposed term does not make this branch universally
    necessary.
