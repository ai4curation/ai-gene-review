    label: iron-sulfur cluster assembly
  evidence_type: IDA
  original_reference_id: PMID:8663055
  qualifier: acts_upstream_of_or_within
  review:
    summary: In crude-extract reconstitution, purified OASS-A and OASS-B mobilized sulfur from cysteine
      that could be used for in vitro Fe-S cluster formation on apo-dihydroxy-acid dehydratase.
    action: MARK_AS_OVER_ANNOTATED
    reason: The in-vitro reconstitution shows that CysM can mobilize cysteine sulfur for Fe-S cluster
      formation, and efficient use of that sulfur depends on unidentified crude-extract factors (PMID:8663055).
      Sulfur mobilization is real catalytic work, so the concern is not that CysM is merely required or
      is an inert substrate. The unresolved issue is whether this side reaction is an evolved physiological
      Fe-S biogenesis function rather than a promiscuous sulfur supply route in the assay. The paper does
      not establish a native CysM-dependent Fe-S assembly pathway, while dedicated ISC/SUF sulfur-mobilization
      systems are characterized. Retain MARK_AS_OVER_ANNOTATED for this physiological process claim, without
      rejecting the observed reconstitution or overriding it from a title/abstract mismatch. Secondary
      cysteine degradation remains separately supported by PMID:16000837.
    supported_by:
    - reference_id: PMID:8663055
      supporting_text: Four enzymatic activities in the crude extract of E. coli were found that can provide
        sulfur for Fe-S cluster synthesis in vitro by mobilizing the sulfur from cysteine.
    - reference_id: PMID:8663055
      supporting_text: Once sulfur is mobilized by these enzymes, its efficient use in Fe-S cluster synthesis
        seems to be affected by the presence of yet unidentified factors present in crude extract.
