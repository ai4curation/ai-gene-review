  review:
    summary: The named reciprocal GOGAT subunit supports a specific heterodimerization function.
    action: MODIFY
    reason: The original annotation names GltB (UniProtKB:P09831) as the interaction partner.
      Independent curated subunit evidence and native gltBDF genetics establish the large/small-chain
      GOGAT heterodimer, supporting GO:0046982 rather than generic protein binding. The original
      screen-specific assay details remain unrecovered; the functional interpretation rests
      on the independently established enzyme assembly, not on an invented account of those
      assays. Higher-order association of catalytic heterodimers is distinct from this large/small-chain
      interface.
