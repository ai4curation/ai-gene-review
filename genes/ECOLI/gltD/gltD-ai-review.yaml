id: P09832
gene_symbol: gltD
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: GltD is the small electron-transfer subunit of cytosolic NADPH-dependent glutamate synthase
  in Escherichia coli K-12. Its flavin/nucleotide-binding and iron–sulfur architecture supplies reducing
  equivalents from NADPH to the GltB catalytic subunit. The assembled complex converts L-glutamine and
  2-oxoglutarate into two L-glutamate molecules and works with glutamine synthetase in ammonium assimilation.
