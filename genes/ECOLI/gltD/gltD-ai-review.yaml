- id: PMID:18304323
  title: Protein abundance profiling of the Escherichia coli cytosol.
  findings:
  - statement: Native cytosolic fraction was extensively characterized.
    supporting_text: we identified 1103 proteins from the cytosolic fraction of the Escherichia coli strain
      MC4100.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Full article read: native E. coli MC4100 cytosolic proteomics. Target identities are
      in supplementary data unavailable through attempted downloads; the quoted passage establishes assay
      scope, not an independently inspected target-specific table row. The existing curator-assigned target
      location is retained in agreement with the soluble metabolic function.'
- id: PMID:4565085
  title: Glutamate synthase from Escherichia coli. An iron-sulfide flavoprotein.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The cached record has no abstract and publisher full text was unavailable. UniProt explicitly
      links the functional reaction and heterodimeric complex to this paper and identifies its strain
      as E. coli W, not K-12. Those curated statements support the conserved holoenzyme role together
      with K-12 genetics; no quotation from the unread paper or K-12-specific kinetic measurement is fabricated.
- id: file:ECOLI/gltD/gltD-uniprot.txt
  title: UniProt record for E. coli K-12 gltD
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Immutable target UniProt record. Curated functional text, publication-linked complex
      evidence and non-ARBA domain assignments are used with their stated evidence scope. Legacy subunit-site
      assignments are assessed separately in the notes.
- id: PMID:2448295
  title: gltBDF operon of Escherichia coli.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Native E. coli genetics identifies gltB and gltD as the large and small GOGAT subunits.
      The abstract also separates the polar gltB insertion phenotype from gltF-associated nitrogen-utilization
      defects; the whole insertion phenotype is not assigned as a direct regulatory activity of either
      enzyme subunit.
  findings:
  - statement: The operon encodes the large and small glutamate synthase subunits.
    supporting_text: The existence of a gltBDF operon encoding the large (gltB) and small (gltD) subunits
      of glutamate synthase and a regulatory peptide (gltF) at 69 min of the E. coli linkage map was deduced
      from complementation analysis.
  - statement: gltB complementation restores enzyme activity.
    supporting_text: plasmids carrying gltB+ only complemented cells for glutamate synthase activity.
- id: PMID:10785395
  title: Functional properties of recombinant Azospirillum brasilense glutamate synthase, a complex iron-sulfur
    flavoprotein.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary Azospirillum brasilense biochemical evidence, not native E. coli enzyme measurements;
      E. coli BL21 is the expression host. FAD/NADPH is assigned to beta and FMN/2-oxoglutarate to alpha.
      This paper explicitly leaves the two [4Fe-4S] clusters unlocalized.
  findings:
  - statement: The NADPH-linked FAD site lies in beta.
    supporting_text: one FAD (at Site 1, the pyridine nucleotide site within the beta subunit)
  - statement: The FMN-associated glutamate-forming site lies in alpha.
    supporting_text: one FMN (at Site 2, the 2-oxoglutarate/L-glutamate site in the alpha subunit)
- id: PMID:31473159
  title: Cryo-EM Structures of Azospirillum brasilense Glutamate Synthase in Its Oligomeric Assemblies.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Azospirillum cryo-EM evidence localizes FAD and both [4Fe-4S] centers to the beta chain.
      This corroborates the conserved electron-relay architecture; it is not an exact-target E. coli cluster-count
      measurement.
  findings:
  - statement: The beta-chain cofactor locations are structurally resolved.
    supporting_text: allows unequivocal location of the FAD cofactor and of two electron transfer [4Fe-4S]+1,+2
      clusters within βGltS.
- id: PMID:10357231
  title: 'Glutamate synthase: a complex iron-sulfur flavoprotein.'
  reference_review:
