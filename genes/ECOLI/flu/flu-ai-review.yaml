  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  supporting_entities:
  - UniProtKB-SubCell:SL-0200
  review:
    summary: >-
      Correct but transient. UniProt assigns the periplasm to the uncleaved
      precursor only, and by similarity rather than from experiment, so this
      describes the protein in transit between the inner-membrane signal-peptide
      cleavage and barrel insertion in the outer membrane.
    action: KEEP_AS_NON_CORE
    reason: >-
      A biosynthetic intermediate rather than a functional location. Keeping it
      records the route the protein takes, which is genuinely part of the type V
