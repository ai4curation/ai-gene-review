  knowledge_gaps:
  - gap_statement: >-
      Whether Antigen 43 has autotransporter activity is unresolved, and the
      question is about the term rather than about this protein. GO:0015474
      defines the activity as transporting a passenger whose porin is the
      C-terminal region of the same protein, which matches the architecture
      exactly, but it also asserts that the protein does the transporting. The
      references that establish the architecture propose instead that
      autotransporters are substrates of a secretion machine rather than
      autonomous transporters.
    boundary: >-
      Assert the type V secretion process and no molecular function. Do not
      propose GO:0015474 for this protein, since doing so would commit the review
      to the autonomous model on exactly the point its own best references
      dispute.
    gap_kind:
    - ONTOLOGY
    - BIOLOGY
    dark_aspect: MF_DARK
    significance: >-
      This is the paradigm classical autotransporter, so whatever molecular
      function it is given will propagate to the family by similarity. The term's
      definition encodes a mechanistic model that the insertase literature has
      moved away from.
proposed_new_terms:
- proposed_name: self-associating adhesin activity
  proposed_definition: >-
    Enables adhesion between two cells through a homotypic interaction between copies of the same
    surface-displayed protein presented on each of the two cells.
  justification: >-
    No existing molecular function expresses what a self-associating adhesin does. The
    distinguishing feature is that the interaction partner is another copy of the same protein,
    and that is established directly for Antigen 43 rather than inferred from the aggregation
    phenotype: the protein is characterised as a self-recognizing adhesin, the region responsible
    for self-association has been localised to the N-terminal third of the passenger domain by
    linker insertion mutagenesis and by domain swapping between naturally occurring clumping and
    non-clumping variants, and the interaction is described as taking place between interacting
    pairs of passenger domains. The chemistry proposed for that pairing, ionic contacts between
    charged residues, is hedged in the source; the homotypic character of the interaction is not.
    The terms available describe binding a named partner, which names the interactor without
    naming the function. Several aggregation-mediating surface proteins share this property, so
    the gap is not specific to Antigen 43. Pending such a term, this review asserts the
    aggregation process and the surface location and no existing molecular function term, naming
    the proposed activity on the core function instead of reaching for a binding term.
  proposed_parent:
    id: GO:0098632
    label: cell-cell adhesion mediator activity
  supported_by:
  - reference_id: PMID:14651628
    supporting_text: Antigen 43 (Ag43) is a self-recognizing surface adhesin found in most
      Escherichia coli strains.
  - reference_id: PMID:14651628
    supporting_text: Our data suggest that ionic interactions between charged residues
      residing in interacting pairs of Ag43alpha domains may be important for the
      self-recognition process.
  - reference_id: PMID:14651628
    supporting_text: Several novel variants were identified and characterized that were
      unable to promote cell-cell aggregation.
  - reference_id: PMID:16804184
    supporting_text: Here, it has been demonstrated for the first time that Ag43-mediated
      aggregation can inhibit bacterial motility.
suggested_questions:
- question: >-
    Should GO:0015474 autotransporter activity be revised, or deprecated in
    favour of describing these proteins as substrates? Its definition asserts
    that the passenger-bearing protein does the transporting, which the
    translocation and assembly module literature disputes.
- question: >-
    Does Antigen 43 use BAM as well as TAM? TamA and BamA are both
    Omp85-family insertases, and the type V secretion module currently models
    installation as BAM-dependent. Whether the two routes are redundant,
    sequential or substrate-specific for this protein is not established here.
- question: >-
    Is a molecular function term needed for homotypic self-association? Several
    aggregation-mediating surface proteins share the property that their
    interaction partner is another copy of themselves on a different cell, and no
    current term expresses it. For Antigen 43 the property is characterised to the
    level of a passenger subregion, so a term would have evidence to hang on.
suggested_experiments:
- description: >-
    Test Antigen 43 barrel insertion in a bamA conditional depletion and in a
    tamA deletion side by side, in the same strain background, scoring surface
    display and autoaggregation. This would establish whether the two insertases
    are redundant for this substrate or whether TAM dependence is absolute, which
    is the question the type V secretion module currently cannot answer.
- description: >-
    Reconstitute passenger translocation, as distinct from barrel insertion, in
    the supported-bilayer system already used for Ag43 and TamA. Observing whether
    the passenger crosses with no component other than the barrel present would
    test the autonomous-transporter model directly and settle whether
    autotransporter activity is the right molecular function.
