      surface as a description of where Antigen 43 acts.
- term:
    id: GO:0046819
    label: protein secretion by the type V secretion system
  evidence_type: IDA
  original_reference_id: PMID:25341963
  qualifier: involved_in
  review:
    summary: >-
      Antigen 43 reaches the cell surface by the type V route, and the
      outer-membrane step of that route has been observed directly in a
      reconstituted system: Ag43 enters the membrane layer only when the
      translocation and assembly module is present, and TamA alone is sufficient
      to initiate the penetration.
    action: NEW
    reason: >-
      GOA carries no biological process annotation for this gene at all, which
      for the textbook classical autotransporter of this organism is a plain
      gap. The evidence code reflects what was actually assayed, namely the
      membrane-insertion step of the protein's own secretion in a reconstituted
      bilayer, rather than the whole pathway; the reconstitution is nonetheless a
      direct observation of Ag43 and not an inference from relatives.
- term:
    id: GO:0098743
    label: cell aggregation
  evidence_type: IMP
  original_reference_id: PMID:16804184
  qualifier: involved_in
  review:
    summary: >-
      Displayed Antigen 43 self-associates between cells, clustering them into
      aggregates that settle out of suspension. The phenotype is strong enough to
      override flagellar motility, and it was demonstrated in naturally occurring
      phase variants that do and do not express the protein as well as by
      manipulating expression.
    action: NEW
    reason: >-
      The GO definition of cell aggregation, the clustering together and adhesion
      of initially separate cells to form an aggregate, describes what Antigen 43
      does with no stretching, and explicitly includes the clustering of
      unicellular organisms. Antigen 43 performs the adhesion itself through its
      displayed passenger rather than being merely required for it, which is the
      test that matters before asserting a process term. Biofilm terms are not
      proposed: the contribution of this protein to biofilm is real but is
      downstream of the aggregation step annotated here, and would need its own
      evidence.
