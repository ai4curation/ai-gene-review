- description: >-
    Substrate of the type V secretion route, carrying its own outer-membrane
    translocator domain. The C-terminal beta chain forms the barrel through which
    the N-terminal passenger crosses the outer membrane, after which the two
    chains are cleaved apart but remain associated. Insertion of the barrel
    requires the translocation and assembly module: the protein does not enter a
    membrane lacking it, and the outer-membrane subunit TamA is sufficient to
    initiate entry while the inner-membrane subunit TamB regulates the step.
