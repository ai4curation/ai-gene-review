taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  Antigen 43 is a surface-displayed protein of Escherichia coli and the
  classical example of the type V secretion architecture: a single precursor
  whose N-terminal passenger is presented on the cell surface and whose
  C-terminal beta chain forms the outer-membrane barrel through which the
  passenger reaches it. The two chains are produced in equal stoichiometry and
  remain associated with the cell after cleavage, with the surface component
  releasable by mild heat treatment. Insertion of its barrel into the outer
  membrane requires the translocation and assembly module, whose outer-membrane
  subunit TamA is sufficient to initiate penetration of the membrane and whose
  inner-membrane subunit TamB regulates that step. Once displayed, the passenger
  is self-recognizing, associating with another copy of itself on a neighbouring
  cell through a region in its N-terminal third, so expression drives
  autoaggregation and settling strongly enough to override flagellar motility.
  Natural variants exist that are displayed normally but cannot aggregate cells,
  and the gene is subject to phase variation that gives rise to colony form
  variation in a clonal population.
