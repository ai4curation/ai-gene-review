    summary: >-
      Correct in the loose sense but imprecise. The passenger chain is
      surface-displayed and remains tightly associated with the cell after
      cleavage; only a fraction is released, and then by mild heat treatment.
      The cell surface term, which is separately annotated with experimental
      support, is the accurate location.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Not wrong, since some passenger is released, but the term places the
      protein in the medium when its defining property is that it stays on the
      cell and glues cells together. Retaining it unqualified alongside cell
      surface invites an aggregating adhesin to be read as a secreted product.
      No replacement is proposed because the accurate term is already present.
