- id: PMID:22466966
  title: Discovery of an archetypal protein transport system in bacterial outer membranes.
  findings:
  - statement: >-
      The translocation and assembly module, TamA in the outer membrane with TamB
      in the inner membrane, was discovered because it promotes secretion of
      autotransporters, which places a dedicated insertase upstream of Antigen 43.
    supporting_text: We have discovered a new translocation and assembly module (TAM) that
      promotes efficient secretion of autotransporters in proteobacteria.
  - statement: >-
      TamA is an Omp85-family protein, the same family as BamA, so the module is a
      parallel insertase rather than an alternative to beta-barrel assembly as such.
    supporting_text: it consists of an Omp85-family protein, TamA, in the outer membrane and
      TamB in the inner membrane of diverse bacterial species
  - statement: >-
      The paper questions whether autotransporters transport themselves at all,
      proposing instead that they are substrates of a secretion machine. This is the
      reason the autotransporter molecular function is not asserted in this review.
    supporting_text: Mounting evidence suggests that autotransporters might be substrates to
      be secreted, not an autonomous transporter system.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Cached record is abstract-only and does not name Antigen 43, although UniProt
      cites it for the surface location of the passenger chain and GOA uses it for
      an EXP cell-surface annotation. Treated as sound on the curator's reading of
      the full text. Its load-bearing contribution here is the TAM discovery and the
      challenge to autotransporter autonomy, both of which are in the abstract.
- id: PMID:25341963
  title: Reconstitution of a nanomachine driving the assembly of proteins into bacterial
    outer membranes.
  findings:
  - statement: Antigen 43 depends on the TAM for efficient assembly in vivo.
    supporting_text: In vivo, the efficient assembly of the β-barrel protein Ag43 depends on
      the TAM
  - statement: >-
      The dependence is specific, not a lipid affinity: Ag43 shows no significant
      association with a membrane that lacks the TAM.
    supporting_text: QCM-D measurements confirmed there was no significant association of
      Ag43 with the membrane observed in the absence of the TAM
  - statement: >-
      TamA alone is necessary and sufficient to start Ag43 entering the membrane,
      with TamB regulating the step.
    supporting_text: We conclude that TamA is necessary and sufficient to initiate the
      penetration of Ag43 into a membrane layer, and that TamB regulates this activity of
      TamA.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text available in the cache. The strongest evidence in this review, and
      the basis for adding a TAM route to the type V secretion module, which
      previously modelled outer-membrane installation as BAM-dependent only.
- id: PMID:3301815
  title: Identification and partial characterization of a novel bipartite protein antigen
    associated with the outer membrane of Escherichia coli.
  findings:
  - statement: >-
      Antigen 43 is a surface-expressed complex of two chemically distinct
      polypeptides, alpha and beta, present in equal stoichiometry.
    supporting_text: Immunoprecipitation experiments conducted with specific antiserum
      revealed that the complex was expressed on the cell surface and that it contained, in
      equal stoichiometry, two chemically distinct polypeptides termed alpha and beta (Mrs
      of 60,000 and 53,000, respectively).
  - statement: Both chains fractionate with the outer membrane.
    supporting_text: Analysis of fractions obtained following cell disruption, isopycnic
      centrifugation, and detergent extraction indicated that both alpha and beta
      polypeptides were components of the outer membrane.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The original characterisation, and the evidence behind the IDA outer-membrane
      annotation. Cached record is abstract-only. Notable for establishing the
      bipartite architecture before the autotransporter concept existed.
- id: PMID:16804184
  title: Antigen-43-mediated autoaggregation impairs motility in Escherichia coli.
  findings:
  - statement: >-
      Ag43-mediated aggregation inhibits bacterial motility, demonstrating that the
      displayed passenger drives cell-cell clustering.
    supporting_text: Here, it has been demonstrated for the first time that Ag43-mediated
      aggregation can inhibit bacterial motility.
  - statement: >-
      The aggregation phenotype is dose-dependent and dominant over motility when
      flagellation is low.
    supporting_text: Ag43 overexpression produces a dominant aggregation phenotype that
      overrides motility in the presence of low levels of flagella.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Cached record is abstract-only. Supports the cell aggregation annotation
      proposed here, using phase variants as well as expression manipulation. An
      erratum was published (Erratum in: Microbiology. 2006 Sep;152(Pt 9):2865,
      recorded in the MEDLINE record for this paper); it is not separately indexed
      with a PMID and its content is not in the cached record, so the findings taken
      from this reference here are limited to the abstract statements quoted above.
      The homotypic mechanism of the interaction is not in this paper at all and is
      cited to PMID:14651628 instead.
- id: PMID:14651628
  title: Structure-function analysis of the self-recognizing Antigen 43 autotransporter
    protein from Escherichia coli.
  findings:
  - statement: >-
      Antigen 43 is a self-recognizing adhesin: its interaction partner is another
      copy of itself, not a separate receptor, which is what distinguishes the
      activity from adhesins named for the partner they bind.
    supporting_text: Antigen 43 (Ag43) is a self-recognizing surface adhesin found in most
      Escherichia coli strains.
  - statement: >-
      The determinant of self-association sits in the N-terminal third of the
      passenger domain, localised by linker insertion mutagenesis and by domain
      swapping between naturally occurring clumping and non-clumping variants.
    supporting_text: we have pinpointed the region of the protein responsible for
      autoaggregation to be located within the N-terminal one-third of the passenger domain
  - statement: >-
      Variants that keep the autotransporter architecture but cannot aggregate cells
      occur naturally, so self-association is a separable property of a region of the
      passenger rather than a consequence of surface display as such.
    supporting_text: Several novel variants were identified and characterized that were
      unable to promote cell-cell aggregation.
  - statement: >-
      The interaction is between paired passenger domains, although the chemistry
      proposed for it, ionic contacts between charged residues, is an inference from
      the mutagenesis rather than a measured interaction.
    supporting_text: Our data suggest that ionic interactions between charged residues
      residing in interacting pairs of Ag43alpha domains may be important for the
      self-recognition process.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified: Klemm P, Hjerrild L, Gjermansen M, Schembri MA, Mol Microbiol
      2004;51(1):283-96, doi 10.1046/j.1365-2958.2003.03833.x. Cached record is
      abstract-only. This is the reference that carries the homotypic character of
      the interaction, which the aggregation-phenotype papers do not: the variant
      family and the domain swaps between clumping and non-clumping variants place
      self-recognition in a defined region of the passenger. The molecular basis
      proposed for the pairing is hedged in the source ("may be important") and is
      reported here as proposed rather than settled.
core_functions:
- description: >-
    Self-associating surface adhesin. The protein is self-recognizing: the
    passenger chain displayed on the cell surface is bound by another copy of
    itself on a neighbouring cell, with the region responsible located in the
    N-terminal third of the passenger, clustering initially separate cells into
    aggregates that settle out of suspension. The effect is strong enough to
    override flagellar motility when flagellation is low, and because the gene is
    phase-variable, a clonal population splits into aggregating and
    non-aggregating subpopulations.
  proposed_molecular_function: self-associating adhesin activity
