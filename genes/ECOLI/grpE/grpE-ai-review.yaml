      DnaK
- description: GrpE binds DnaK as its cognate protein-folding-chaperone partner.
    This direct binding targets the DnaK nucleotide-binding domain and is required
    for GrpE's control of the Hsp70 ATPase cycle, including both client folding and
    sigma32 feedback regulation.
  molecular_function:
