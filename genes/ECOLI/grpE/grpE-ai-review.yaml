    the dynamics of the chaperone substrate binding domain.
  findings:
  - statement: The N-terminal region of GrpE contributes to DnaK binding and regulates
      GrpE nucleotide-exchange activity.
- id: PMID:1826368
  title: Escherichia coli DnaJ and GrpE heat shock proteins jointly stimulate ATPase
    activity of DnaK.
  findings:
  - statement: GrpE accelerates DnaK nucleotide release; together with DnaJ it strongly
      stimulates DnaK ATPase cycling.
- id: PMID:18304323
  title: Protein abundance profiling of the Escherichia coli cytosol.
  findings:
  - statement: Quantitative proteomics identified GrpE in the E. coli cytosolic fraction.
- id: PMID:19402753
  title: Global functional atlas of Escherichia coli encompassing previously uncharacterized
    proteins.
  findings:
  - statement: Systems-scale affinity-tagging study that produced a generic GrpE-MntH
      interaction row.
- id: PMID:20953191
  title: The kinetic parameters and energy cost of the Hsp70 chaperone as a polypeptide
    unfoldase.
  findings:
  - statement: Bacterial Hsp70-Hsp40-NEF systems can use ATP to unfold stably misfolded
      proteins into intermediates that refold after release.
- id: PMID:24561554
  title: The binary protein-protein interaction landscape of Escherichia coli.
  findings:
  - statement: Large-scale yeast-two-hybrid study that produced a generic GrpE-GroEL
      interaction row.
- id: PMID:2522091
  title: Escherichia coli DnaK and GrpE heat shock proteins interact both in vivo
    and in vitro.
  findings:
  - statement: DnaK and GrpE interact in vivo and in vitro, including by coimmunoprecipitation.
- id: PMID:8349564
  title: Characterization of twenty-six new heat shock genes of Escherichia coli.
  findings:
  - statement: Characterizes grpE among E. coli heat-shock genes.
- id: PMID:8444859
  title: Initiation of lambda DNA replication. The Escherichia coli small heat shock
    proteins, DnaJ and GrpE, increase DnaK's affinity for the lambda P protein.
  findings:
  - statement: DnaJ and GrpE modulate DnaK binding to lambda P in a phage replication-remodeling
      reaction.
- id: PMID:8599944
  title: A cycle of binding and release of the DnaK, DnaJ and GrpE chaperones regulates
    activity of the Escherichia coli heat shock transcription factor sigma32.
  findings:
  - statement: GrpE stimulates nucleotide release from DnaK-DnaJ-sigma32 complexes
      and thereby promotes complex dissociation by ATP.
- id: PMID:9103205
  title: Crystal structure of the nucleotide exchange factor GrpE bound to the ATPase
    domain of the molecular chaperone DnaK.
  findings:
  - statement: Crystal structure of a GrpE dimer bound asymmetrically to the DnaK
      ATPase domain.
core_functions:
- description: GrpE is the adenyl-nucleotide exchange factor of the DnaK/DnaJ/GrpE
    Hsp70 chaperone system. The GrpE dimer binds the DnaK nucleotide-binding domain
    and accelerates release of bound ADP or ATP, allowing ATP rebinding and substrate
    release during repeated cycles of DnaK-mediated folding, refolding, and polypeptide
    remodeling. That nucleotide-exchange reaction is the GrpE-catalyzed step of
    the ATP-driven DnaK-DnaJ-GrpE unfolding cycle.
  molecular_function:
    id: GO:0000774
    label: adenyl-nucleotide exchange factor activity
