id: P09372
gene_symbol: grpE
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli (strain K12)
description: GrpE is the nucleotide-exchange co-chaperone for the E. coli DnaK
  Hsp70 chaperone system. It functions as a cytosolic homodimer that binds the
  DnaK nucleotide-binding domain and accelerates ADP release, allowing ATP
  rebinding and substrate release during iterative DnaK/DnaJ/GrpE folding,
  refolding, and remodeling cycles. GrpE also acts in DnaK-dependent negative
  feedback on the heat-shock sigma factor RpoH/sigma32 and in phage-lambda
  replication-complex remodeling. The coiled-coil portion of GrpE undergoes a
  reversible thermal transition in the heat-shock range that lowers nucleotide
  exchange at high temperature and biases DnaK toward its high-affinity
  ADP-bound state.
