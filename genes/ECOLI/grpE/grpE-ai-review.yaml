      with anti-DnaK antibodies demonstrated their interaction in vitro.
  - reference_id: PMID:8599944
    supporting_text: GrpE binding to these complexes stimulates nucleotide release
      and subsequent complex dissociation by ATP.
proposed_new_terms: []
suggested_questions:
- question: Which native E. coli DnaK clients are most sensitive to heat-tuned changes
    in GrpE nucleotide-exchange rate?
- question: Do the GroEL and MntH interactions detected in broad screens represent
    reproducible, condition-specific biology or capture artifacts?
suggested_experiments:
- experiment_type: client-resolved NEF perturbation
  description: Compare DnaK substrate occupancy and refolding efficiency in temperature-sensitive
    grpE interface mutants across basal and heat-shock temperatures.
- experiment_type: targeted interaction validation
  description: Test the reported GrpE-GroEL and GrpE-MntH interactions by reciprocal
    pull-downs or in vivo crosslinking under heat shock and metal-stress conditions.
