id: P0AF93
gene_symbol: RidA
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli (strain K12)
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for RidA, the E. coli enamine/imine deaminase. Ranks 1, 3 and
  4 are all exact GOA matches and between them give the enzyme's full substrate range, matching this
  review's core molecular function. This is a SwissProt-reviewed protein, so its own GO sentences
  are in the index being searched and these matches are recall rather than prediction. The conditional
  HOCl-activated holdase moonlighting function is not reached, which is arguably correct given this
  review's insistence that it is a stress-activated secondary role. Assessment: 2 correct not novel
  (CNN), 1 less precise (LSP).
