gene_symbol: RidA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli (strain K12)
description: >-
  RidA (formerly YjgF) is a cytosolic homotrimeric
  2-iminobutanoate/2-iminopropanoate deaminase (EC 3.5.99.10) that accelerates
  ammonia release from reactive enamine/imine intermediates generated by
  pyridoxal-phosphate-dependent enzymes such as threonine dehydratase (IlvA),
  thereby protecting amino-acid metabolism. During hypochlorous-acid stress,
  reversible N-chlorination converts RidA into an ATP-independent holdase that
  binds unfolded cytosolic proteins and prevents their aggregation. This
  antiaggregation activity is modification-dependent: untreated RidA does not
  suppress IlvA aggregation.
