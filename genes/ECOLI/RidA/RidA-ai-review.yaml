  evidence_type: IDA
  original_reference_id: PMID:25517874
  review:
    summary: PMID:25517874 directly demonstrates that N-chlorinated RidA binds unfolded
      clients and prevents their aggregation without ATP. The activity is a genuine,
      reversible stress-activated holdase function, but GO:0051082 is obsolete and
      does not express aggregation prevention.
    action: MODIFY
    reason: Retain the demonstrated biology but replace the obsolete binding term
      with the project's general holdase chaperone activity NTR. GO:0140309 does
      not fit because the experiment shows in-situ aggregation prevention without
      escort to a defined acceptor or destination. The evidence is explicitly
      conditional on HOCl- or chloramine-mediated N-chlorination; untreated RidA
      did not prevent IlvA aggregation. See go-ontology#30962 and
      file:projects/UNFOLDED_PROTEIN_BINDING.md.
    proposed_replacement_terms:
    - id: NTR
      label: holdase chaperone activity (NTR needed; GO:0140309 does not fit -- carrier-specific)
    supported_by:
    - reference_id: PMID:25517874
      supporting_text: The addition of ATP did not enhance chaperone activity, consistent
        with a holdase function of HOCl-treated RidA
    - reference_id: PMID:25517874
      supporting_text: In contrast, incubation of IlvA with a 10-fold molar excess
        of untreated RidA had no effect on IlvA’s aggregation behaviour
    - reference_id: file:projects/UNFOLDED_PROTEIN_BINDING.md
      supporting_text: GO:0051082 is now formally obsolete
