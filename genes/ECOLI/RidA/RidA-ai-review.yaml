core_functions:
- molecular_function:
    id: GO:0120241
    label: 2-iminobutanoate/2-iminopropanoate deaminase activity
  directly_involved_in:
  - id: GO:1901705
    label: L-isoleucine biosynthetic process
  locations:
  - id: GO:0005829
    label: cytosol
  description: RidA deaminates reactive enamine/imine intermediates from PLP-dependent
    enzymes, particularly threonine dehydratase (IlvA), converting 2-iminobutanoate
    to 2-oxobutanoate and 2-iminopropanoate to pyruvate. This detoxification function
    supports isoleucine biosynthesis and protects against reactive intermediate toxicity.
  supported_by:
  - reference_id: PMID:22094463
    supporting_text: Our data support the conclusion that YjgF proteins have enamine/imine
      deaminase activity and accelerate the release of ammonia from reactive enamine/imine
      intermediates of the pyridoxal 5'-phosphate-dependent threonine dehydratase
      (IlvA).
proposed_new_terms:
- proposed_name: holdase chaperone activity
  proposed_definition: Binding to an unfolded or misfolded protein to prevent its
    aggregation without actively catalyzing refolding. The holdase maintains the client
    protein in a soluble, folding-competent state.
  justification: N-chlorinated RidA directly prevents aggregation of chemically denatured
    citrate synthase and IlvA without ATP. Obsolete GO:0051082 records binding but not
    aggregation prevention, while GO:0140309 requires escort to a defined acceptor or
    location that is not demonstrated for RidA.
  proposed_parent:
    id: GO:0003674
    label: molecular_function
  supported_by:
  - reference_id: PMID:25517874
    supporting_text: The addition of ATP did not enhance chaperone activity, consistent
      with a holdase function of HOCl-treated RidA
suggested_questions:
- question: Which physiological HOCl or chloramine exposures produce sufficient reversible
    RidA N-chlorination for its holdase activity in E. coli cells?
- question: How should a modification-dependent moonlighting holdase activity be represented
    once the general holdase chaperone activity NTR is created?
