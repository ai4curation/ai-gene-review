  review:
    summary: The isolated untagged RecB30 nuclease domain cleaves circular single- and double-stranded
      DNA, i.e. it acts endonucleolytically as well as exonucleolytically.
    action: KEEP_AS_NON_CORE
    reason: A genuine secondary activity of the RecB nuclease active site. In the holoenzyme the
      same active site nicks the 3'-ended strand near Chi and cuts single-stranded DNA endonucleolytically
      (the GO definition of the exodeoxyribonuclease V complex states it "acts endonucleolytically
      on single-stranded circular DNA"), but the dsDNA endonuclease seen with the isolated domain
      is restrained in RecBCD. The core nuclease function is exodeoxyribonuclease V activity, so
      this row is kept as non-core. The term is as specific as the assay supports (both ss and
      ds circular DNA were cut).
    supported_by:
