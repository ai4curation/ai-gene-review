- term:
    id: GO:0044355
    label: clearance of foreign intracellular DNA
  evidence_type: IMP
  original_reference_id: PMID:123277
  qualifier: involved_in
  review:
    summary: Transfection of rec+ versus recB/recC spheroplasts shows the recBC nuclease limits
      infection by nuclease-sensitive (linear) phage DNA, mainly through its double-strand exonuclease.
    action: ACCEPT
    reason: RecBCD destroys linear DNA that cannot recombine, including unprotected phage genomes,
      which is why phages such as lambda encode the Gam inhibitor. The RecB nuclease performs the
      degradation, so RecB does the work of this defence process. Core biological role alongside
      DSB repair.
    supported_by:
    - reference_id: PMID:123277
      supporting_text: Through analysis of results with other DNA structures, we found that in
        vivo the effects of the double-strand exonucleolytic activity of the recBC nuclease predominated.
    - reference_id: PMID:19052323
      supporting_text: It also degrades linear double-stranded DNA, protecting the bacteria from
        phages and extraneous chromosomal DNA.
- term:
    id: GO:0000730
    label: DNA recombinase assembly
  evidence_type: IDA
  original_reference_id: PMID:9230304
  qualifier: involved_in
  review:
    summary: RecB loads RecA onto the 3'-ended ssDNA that RecBCD produces at Chi; this row is not in
      GOA and is proposed here.
    action: NEW
    reason: RecB passes the participation test for this process because it does the loading. Its
      C-terminal nuclease domain binds RecA and directs RecA onto the single-stranded DNA produced
      downstream of Chi; it is not just a precondition for filament assembly. GO annotates other
      recombinase mediators that load a recombinase onto ssDNA to this term (BRCA2, yeast Rad52 and
      Rad55/Rad57). The module's RecA-loading annoton for RecB asserts this process.
    supported_by:
    - reference_id: PMID:9230304
      supporting_text: we demonstrate that the translocating RecBCD enzyme, which has been activated by
        chi, coordinates the preferential loading of the homologous pairing protein, RecA, onto the resultant
        single-stranded DNA downstream of chi
    - reference_id: PMID:16483938
      supporting_text: Here, we establish that the C-terminal nuclease domain of the RecB subunit (RecBnuc)
        forms stable complexes with RecA.
    - reference_id: PMID:16483938
      supporting_text: RecBnuc also interacts with and loads noncognate DNA strand exchange proteins.
core_functions:
- description: ATP-dependent 3'-5' DNA helicase and single-stranded DNA translocase motor of the
    RecBCD holoenzyme. Moving on the 3'-ended strand opposite the RecD 5'-3' motor, it unwinds
    DNA from a double-strand end to initiate repair of the break by homologous recombination.
  supported_by:
  - reference_id: PMID:12815437
    supporting_text: RecD is a fast helicase acting on the 5'-ended strand and RecB is a slow helicase
      acting on the 3'-ended strand on which the single-stranded loop accumulates
  - reference_id: PMID:9150267
    supporting_text: In this model, the RecB molecule binds to single-stranded DNA and then translocates
      along it, one base at a time, in the 3' to 5' direction
  molecular_function:
    id: GO:0043138
    label: 3'-5' DNA helicase activity
  directly_involved_in:
  - id: GO:0000724
    label: double-strand break repair via homologous recombination
  in_complex:
    id: GO:0009338
    label: exodeoxyribonuclease V complex
- description: Mg2+-dependent Exonuclease V nuclease of the RecBCD holoenzyme, located in the RecB
    C-terminal PD-(D/E)XK domain. It degrades the unwound strands, is attenuated and redirected
    after Chi recognition to leave a 3' single-stranded tail onto which RecB loads RecA, and destroys
    linear foreign DNA.
  supported_by:
  - reference_id: PMID:16388588
    supporting_text: These results provide direct evidence that RecB30 is the universal nuclease
      domain of RecBCD.
  - reference_id: PMID:19052323
    supporting_text: Interaction with Chi causes an attenuation of the RecBCD enzyme's vigorous
      nuclease activity
