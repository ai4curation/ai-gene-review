id: P08394
gene_symbol: recB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: RecB is the largest subunit of the heterotrimeric RecBCD enzyme (Exonuclease V),
  the helicase-nuclease that initiates the major pathway of homologous recombination and
  double-strand break repair in Escherichia coli. Its N-terminal UvrD-like superfamily 1
  domains form a slow ATP-dependent 3'-5' DNA helicase/translocase that moves on the 3'-ended
  strand while the RecD motor moves on the 5'-ended strand, together unwinding DNA from a
  blunt double-strand end at high speed and processivity. Its tethered C-terminal PD-(D/E)XK
  domain is the only nuclease active site of the holoenzyme and requires Mg2+; it degrades
  the unwound strands until RecC recognizes a Chi sequence (5'-GCTGGTGG-3'), after which the
  attenuated enzyme leaves a 3' single-stranded tail and the RecB nuclease domain loads RecA
  onto it. RecBCD also destroys linear foreign DNA such as unprotected phage genomes, and recB
  mutants are recombination-deficient and sensitive to UV light.
