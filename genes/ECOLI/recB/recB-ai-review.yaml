suggested_questions:
- question: Which RecB nuclease-domain surface contacts RecA during Chi-dependent RecA loading,
    and should GO have a molecular function term that describes this loading activity?
- question: How much of the radiation sensitivity of recB mutants reflects loss of the nuclease
    versus loss of the 3'-5' motor, given that nuclease-dead RecB (D1080A) also abolishes RecA
    loading?
suggested_experiments:
- description: Single-molecule imaging of RecBCD carrying separation-of-function RecB alleles
    (K29Q motor-dead, D1080A nuclease-dead) on Chi-containing DNA to quantify how each RecB activity
    contributes to RecA filament nucleation after Chi.
