- term:
    id: GO:0008137
    label: NADH dehydrogenase (ubiquinone) activity
  evidence_type: IMP
  original_reference_id: PMID:15996109
  qualifier: enables
  review:
    summary: >-
      Kao et al. (2005) mutated conserved NuoK residues on the chromosome. All mutants
      assembled NDH-1, but Glu-36 mutants lost almost all coupled electron transfer
      and could not build an electrochemical gradient. Glu-72 and the paired Arg-25/
      Arg-26 mutants were also strongly impaired.
    action: ACCEPT
    reason: >-
      Direct mutational evidence that NuoK is required for the coupled NADH:quinone
      oxidoreductase (proton-pumping) activity of the assembled complex. The activity
      belongs to the whole complex; NuoK contributes to it through the E-channel
      glutamates. The term is right and is accepted together with the IDA row; it is
      the core contributed activity.
    supported_by:
    - reference_id: PMID:15996109
      supporting_text: All point mutants examined had fully assembled NDH-1 as detected
        by blue-native gel electrophoresis and immunostaining.
    - reference_id: PMID:15996109
      supporting_text: These results may suggest that both membrane-embedded acidic residues
        are important for the coupling mechanism of NDH-1.
    - reference_id: file:ECOLI/nuoK/nuoK-uniprot.txt
      supporting_text: Couples the redox reaction to proton translocation (for every two
        electrons transferred, four hydrogen ions are translocated across the cytoplasmic
        membrane), and thus conserves the redox energy in a proton gradient.
