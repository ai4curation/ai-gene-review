id: P0AFE4
gene_symbol: nuoK
product_type: PROTEIN
status: INITIALIZED
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  NuoK is the smallest subunit (100 residues, three transmembrane helices) of the
  proton-pumping NADH:quinone oxidoreductase (NDH-1, respiratory complex I) in the
  bacterial cytoplasmic (inner) membrane, and is the homologue of mitochondrial ND4L.
  It sits in the proximal part of the membrane arm, where together with NuoA, NuoJ and
  part of NuoH it forms the so-called E-channel, the proton-translocation pathway
  closest to the quinone-binding site. Two membrane-embedded glutamates (Glu-36 and
  Glu-72) are essential for coupling electron transfer from NADH to quinone with proton
  translocation: their mutation leaves an assembled complex that can no longer build an
  electrochemical proton gradient. NuoK has no redox cofactor of its own; it contributes
  to the overall NADH:ubiquinone oxidoreductase (proton-pumping) activity of the
  assembled complex, which conserves redox energy as proton-motive force during
  respiration. Its insertion into the membrane depends on the YidC insertase.
