- id: file:ECOLI/nuoK/nuoK-uniprot.txt
  title: UniProtKB/Swiss-Prot entry P0AFE4 (NuoK, Escherichia coli K-12)
  findings: []
core_functions:
- description: >-
    Small three-helix membrane subunit of the proximal membrane arm of NDH-1 (respiratory
    complex I). With NuoA, NuoJ and part of NuoH it forms the E-channel proton pathway
    next to the quinone site. Its membrane-embedded Glu-36 and Glu-72 are required to
    couple NADH:quinone electron transfer to proton pumping, so NuoK contributes to the
    proton-translocating NADH:ubiquinone oxidoreductase activity of the assembled complex.
  contributes_to_molecular_function:
    id: GO:0008137
    label: NADH dehydrogenase (ubiquinone) activity
  directly_involved_in:
  - id: GO:0015990
    label: electron transport coupled proton transport
  - id: GO:0022904
    label: respiratory electron transport chain
  in_complex:
    id: GO:0045271
    label: respiratory chain complex I
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:15996109
    supporting_text: Mutations of nearly perfectly conserved Glu-36 lead to almost null
      activities of coupled electron transfer with a concomitant loss of generation
      of electrochemical gradient.
  - reference_id: PMID:36920092
    supporting_text: It is followed by three small subunits, ND3/NuoA, ND6/NuoJ and ND4L/NuoK,
      which form, together with part of ND1, the E-channel containing key glutamates
  - reference_id: PMID:17722886
    supporting_text: After reconstitution in proteoliposomes it couples the electron
      transfer with proton translocation in an inhibitor sensitive manner
suggested_questions:
- question: Does Glu-36 of NuoK act as a proton-transfer element of the E-channel during
    each turnover, or mainly as an electrostatic coupling element between the quinone
    cavity and NuoN?
- question: Is the E. coli NDH-1 coupling stoichiometry (4 H+/2 e-) kept when menaquinone
    rather than ubiquinone is the acceptor under anaerobic growth, and does NuoK
    contribute equally in both modes?
suggested_experiments:
- description: >-
    Measure proton-pumping stoichiometry and quinone reductase activity in proteoliposomes
    with purified complex I carrying single NuoK E36Q or E72Q substitutions, alongside
    cryo-EM of turnover states, to locate where the coupling defect arises in the
    E-channel.
- description: >-
    Compare the H+/e- ratio of wild-type and NuoK-variant complexes reconstituted with
    ubiquinone-8 versus menaquinone-8.
