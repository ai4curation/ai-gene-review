  review:
    summary: >-
      UniRule-derived assignment of NADH dehydrogenase (quinone) (non-electrogenic)
      activity (RHEA:46160, NADH + H+ + a quinone = NAD+ + a quinol, with no proton
      translocation).
    action: REMOVE
    reason: >-
      The mapping is demonstrably wrong for NDH-1. GO:0050136 is the non-electrogenic
      reaction typical of type II NADH dehydrogenases such as E. coli NDH-2. NuoK
      belongs to the electrogenic, proton-pumping NDH-1, whose reaction (4 H+
