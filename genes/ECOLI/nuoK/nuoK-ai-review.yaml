    label: NADH dehydrogenase activity
  evidence_type: IDA
  original_reference_id: PMID:3122832
  qualifier: contributes_to
  review:
    summary: >-
      Matsushita et al. (1987) distinguished, in E. coli membranes, a deamino-NADH-reactive,
      proton-gradient-generating NADH dehydrogenase I (NDH-1, the nuo-encoded complex I)
      from the non-electrogenic NDH-2. The generic NADH dehydrogenase activity is correct
      for the complex to which NuoK contributes, but the more specific proton-pumping
      NADH:ubiquinone oxidoreductase term is supported and already present in this review.
    action: MODIFY
    reason: >-
      GO:0003954 is an is_a ancestor of GO:0008137 NADH dehydrogenase (ubiquinone)
      activity, which this gene already carries (IDA, PMID:10587449). The membrane assay
      measured electrogenic NADH dh I activity with ubiquinone-1 as acceptor, which is
      exactly GO:0008137. The contributes_to qualifier is right because NuoK is a membrane
      subunit without cofactors; NADH is oxidized at the FMN of the peripheral arm.
      Refine to GO:0008137 (contributes_to). The abstract does not assay NuoK
      individually; the curator mapped the whole-complex activity to each subunit.
    proposed_replacement_terms:
    - id: GO:0008137
      label: NADH dehydrogenase (ubiquinone) activity
    supported_by:
    - reference_id: PMID:3122832
      supporting_text: an enzyme (NADH dh I) that reacts with deamino-NADH or NADH whose
        turnover leads to generation of a H+ electrochemical gradient at a site between
        the primary dehydrogenase and ubiquinone
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:19959836
  qualifier: enables
  supporting_entities:
  - UniProtKB:P25714
  review:
    summary: >-
      Price and Driessen (2010) showed that membrane insertion of NuoK depends on the
      YidC insertase (P25714), and that the dependence comes from the two conserved
      transmembrane glutamates. The interaction is a biogenesis interaction of a
      substrate with its insertase, not a functional binding activity of NuoK.
    action: REMOVE
    reason: >-
      Bare protein binding gives no functional information (protein-binding policy).
      The reported NuoK-YidC interaction is real, but it is the insertase acting on its
      substrate; NuoK has no informative molecular function here that could replace the
      term. Removing the row does not mean the interaction is false.
    supported_by:
    - reference_id: PMID:19959836
      supporting_text: Here we show that YidC is essential for the insertion of subunit
        K of the NADH:ubiquinone oxidoreductase and that the dependence is due to the
        presence of two conserved glutamate residues in the transmembrane segments of
        subunit K.
