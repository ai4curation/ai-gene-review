id: P10443
gene_symbol: dnaE
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: DnaE is the catalytic alpha subunit of Escherichia coli DNA polymerase III. It extends a
  DNA primer on a DNA template and synthesizes both nascent chromosome strands as part of the replisome.
  The beta sliding clamp provides high processivity, while DnaX organizes the polymerase cores. E. coli
  alpha lacks intrinsic 3′ to 5′ proofreading exonuclease activity; the separate DnaQ epsilon subunit
  provides editing.
