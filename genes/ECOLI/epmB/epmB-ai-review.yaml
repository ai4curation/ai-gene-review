      supporting_text: indicating that both enzymes, YjeA and YjeK, are required for β-lysylation of EF-P
    - *id004
    - reference_id: PMID:20070887
      supporting_text: we predict that the YjeA and YjeK families of proteins are involved in EF-P modification
