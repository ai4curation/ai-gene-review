- term:
    id: GO:0043687
    label: post-translational protein modification
  evidence_type: RCA
  original_reference_id: PMID:20070887
  qualifier: acts_upstream_of_or_within
  review:
    summary: 'Post-translational protein modification, from the comparative-genomics prediction that YjeK
      and YjeA modify EF-P (PMID:20070887); later confirmed: both are needed for beta-lysyl-EF-P (PMID:22128152).'
    action: MARK_AS_OVER_ANNOTATED
    reason: 'EpmB is required for EF-P beta-lysylation, but it does not perform the covalent step: it
      makes free (R)-beta-lysine, which EpmA then ligates to EF-P Lys34 (PMID:21841797), and EpmC hydroxylates
      it. Requirement as the donor''s supplier is necessity, not participation in modifying the protein.
      Comparator check (QuickGO): EpmA and EpmC carry GO:0043687, whereas biotin synthase BioB carries
      biotin biosynthetic process but not protein biotinylation. The term is not false in spirit, since
      EpmB serves only this pathway, so it is marked over-annotated rather than removed.'
    supported_by:
