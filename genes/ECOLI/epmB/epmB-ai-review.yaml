proposed_new_terms:
- proposed_name: L-lysine 2,3-aminomutase ((R)-beta-lysine-forming) activity
  proposed_definition: 'Catalysis of the reaction: L-lysine = (3R)-3,6-diaminohexanoate (D-beta-lysine).
    A radical SAM, pyridoxal 5''-phosphate-dependent migration of the alpha-amino group to C3 that gives
    the (R) product.'
  justification: This is the activity of E. coli EpmB (RHEA:44148). The existing GO:0050066 L-lysine 2,3-aminomutase
    activity is defined as forming the (3S) product made by the clostridial enzyme, so it does not describe
    EpmB, whose (R) product is the one EpmA uses on EF-P. Rhea lists no GO term for RHEA:44148 (checked
    2026-10-19).
  proposed_parent:
    id: GO:0016869
    label: intramolecular aminotransferase activity
  proposed_mappings:
  - predicate: skos:exactMatch
    target_term:
      id: RHEA:44148
      label: L-lysine = D-beta-lysine
  supported_by:
  - *id002
  - *id003
suggested_questions:
- question: Should GO add a beta-lysine biosynthetic process term, so that EpmB can be given its own process
    rather than the EF-P modification term, which belongs to EpmA and EpmC?
- question: How does the EpmB active site impose (R) rather than (S) stereochemistry, given the shared
    KamA fold with the clostridial enzyme?
suggested_experiments:
- hypothesis: A few active-site residues set the (R) product stereochemistry.
  description: Solve an EpmB structure with lysine bound, swap candidate residues with those of the clostridial
    enzyme, and measure the product enantiomer by chiral chromatography.
