id: P39280
gene_symbol: epmB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: EpmB (formerly YjeK) is a cytoplasmic radical S-adenosyl-L-methionine (SAM) enzyme of the
  KamA lysine 2,3-aminomutase family. Using a [4Fe-4S] cluster and pyridoxal 5'-phosphate, it moves the
  alpha-amino group of L-lysine to C3, forming (R)-beta-lysine, the opposite enantiomer to the (S)-beta-lysine
  made by the clostridial enzyme in lysine fermentation. Its turnover is slow (about 0.1% of the clostridial
  enzyme). (R)-beta-lysine is the donor that the lysyl-tRNA synthetase paralog EpmA attaches to Lys34
  of translation elongation factor P (EF-P), after which EpmC hydroxylates the modified residue. The beta-lysylated
  EF-P is the active form that relieves ribosome stalling at polyproline stretches, and loss of EpmB,
  like loss of EpmA, causes pleiotropic stress and virulence defects in Salmonella.
