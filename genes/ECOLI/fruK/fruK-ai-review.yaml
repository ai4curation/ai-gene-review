  review:
    summary: True of FruK but uninformative here. PAINT placed the substrate-generic GO:0008443 at PTN001317471, a PTHR46566 node whose IBD seeds are the FruK 1-phosphofructokinase P0AEW9 and the PfkB-type 6-phosphofructokinases P06999 and P9WID3; at that node the generic term is the correct common denominator. P0AEW9 appearing among its own seeds reflects its experimental activity and is expected, not circular.
    action: TOO_GENERAL
    reason: The node placement is sound for the seeded FruK and PfkB clades (the PTHR46566 family review leaves inheritance by the tagatose-phosphate kinase members unresolved), but for FruK the experimentally supported child GO:0008662 1-phosphofructokinase activity is accepted in this review and entails GO:0008443. UniProt records the enzyme as specific for fructose 1-phosphate, so the substrate-generic parent adds nothing. Action aligned with the ARBA GO:0008443 row and with the P. putida FruK review.
    supported_by:
    - reference_id: file:ECOLI/fruK/fruK-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: Is specific for fructose-l-phosphate (Ref.6).
