taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: FruK is the soluble 1-phosphofructokinase of the Escherichia coli fructose-utilization
  operon. It uses ATP to convert fructose 1-phosphate from fructose-PTS uptake into fructose
  1,6-bisphosphate for central carbon metabolism. The curated enzyme is a divalent-cation-dependent
  homodimer. Studies of related E. coli experimental constructs also show reverse kinase chemistry
  and physical interaction with Cra; the quantitative transfer of these findings to canonical
  K-12 FruK and their contribution to native transcriptional regulation remain unresolved.
