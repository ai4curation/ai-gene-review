  label: Escherichia coli (strain K12)
description: FruK is the soluble 1-phosphofructokinase of the E. coli fructose-utilization operon. It phosphorylates beta-D-fructose 1-phosphate, the phosphorylated import product of the FruA/FruB fructose phosphotransferase system, using ATP to form beta-D-fructose 1,6-bisphosphate for entry into central carbon metabolism.
