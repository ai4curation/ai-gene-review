suggested_questions:
- question: What allosteric and ion-dependent controls tune FruK flux in vivo during growth
    on fructose?
- question: Does sequence-verified P0AEW9 reproduce the reverse-reaction activity and Cra-binding
    affinity measured for the pET3a variant in PMID38723750?
- question: Does FruK–Cra association directly alter promoter occupancy or transcription in
    native K-12, independently of altered F1P production?
suggested_experiments:
- hypothesis: FruK activity prevents FruA/FruB-derived fructose 1-phosphate from accumulating
    to inhibitory concentrations after the fruBKA operon is induced.
  description: Measure fructose 1-phosphate and fructose 1,6-bisphosphate by targeted metabolomics
    in wild type, a fruK deletion mutant, and an active-site fruK complement across a fructose
    concentration series.
  experiment_type: targeted metabolomics and genetic complementation
