suggested_questions:
- question: What allosteric and ion-dependent controls tune FruK flux in vivo during growth on fructose?
suggested_experiments:
- hypothesis: FruK activity prevents FruA/FruB-derived fructose 1-phosphate from accumulating to inhibitory concentrations after the fruBKA operon is induced.
  description: Measure fructose 1-phosphate and fructose 1,6-bisphosphate by targeted metabolomics in wild type, a fruK deletion mutant, and an active-site fruK complement across a fructose concentration series.
  experiment_type: targeted metabolomics and genetic complementation
