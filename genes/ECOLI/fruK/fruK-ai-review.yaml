- id: PMID:38723750
  title: Fructose-1-kinase has pleiotropic roles in Escherichia coli.
  findings:
  - statement: The purified pET3a construct differs from canonical P0AEW9 and matches reported
      Salmonella FruK sequences; exact target identity limits quantitative transfer.
    supporting_text: The pET3a FruK sequence has 100% identity with each of the three sequences
      reported for Salmonella FruK.
  - statement: The protein interaction with Cra is experimentally supported, while direct transcriptional
      mechanisms remain hypotheses.
    supporting_text: FruK alone did not bind to fruB DNA directly
  - statement: Native BW25113 genetics and EHEC complementation are separate from the purified
      variant assays.
    supporting_text: pHG165a (vector) and pHG165a-fruK (from EHEC) were transformed into BW25113
      (WT) or ΔfruK724::kanR (ΔfruK).
  - statement: The purified variant catalyzes ATP formation from ADP and fructose 1,6-bisphosphate,
      consistent with the reverse kinase reaction; native canonical-K12 reverse flux is not
      measured.
    supporting_text: ATP generation was detectable in a concentration-dependent manner across
      a range of physiological F-1,6-BP substrate concentrations
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text read. Purified pET3a FruK derives from the 2000 expression construct,
      differs from P0AEW9 and matches reported Salmonella sequences; other constructs are EHEC.
      Native growth uses BW25113/Keio with documented secondary variants, while endogenous pull-down
      uses strain3.300. Do not assign direct canonical-K12 quantitative reverse kinetics, DNA
      binding or a defined transcription co-regulator activity from these results.
core_functions:
- description: FruK uses ATP to phosphorylate beta-D-fructose 1-phosphate to beta-D-fructose
    1,6-bisphosphate in the cytosol, processing the product of FruA-mediated fructose PTS uptake.
    The established forward catabolic role is distinct from the proposed physiological importance
    of reverse catalysis and Cra association.
