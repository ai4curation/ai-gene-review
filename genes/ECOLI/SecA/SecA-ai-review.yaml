- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IDA
  original_reference_id: PMID:1837021
  qualifier: located_in
  review:
    summary: SecA has a soluble cytoplasmic pool in addition to its SecYEG-associated membrane pool.
    action: ACCEPT
    reason: Cell fractionation showed that SecA partitions between cytoplasm and inner membrane; both pools are
      consistent with its precursor-targeting and translocase motor cycle.
    supported_by:
    - reference_id: file:ECOLI/SecA/SecA-notes.md
      supporting_text: SecA is partitioned between cytosol and inner membrane, and the membrane-associated fraction is
        functionally relevant.
    - reference_id: PMID:1837021
      supporting_text: In a wild-type strain approximately half of the cellular SecA content was found to be associated
        with the inner membrane, while the remainder was soluble.
