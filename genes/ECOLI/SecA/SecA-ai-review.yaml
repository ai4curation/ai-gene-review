suggested_questions:
- question: Which E. coli inner-membrane substrates use SecA-ribosome cotranslational targeting rather than SRP-mediated
    targeting or the canonical SecB/SecA post-translational route?
suggested_experiments:
- description: Combine ribosome profiling, SecA pulldown of ribosome-nascent-chain complexes, and acute SecA
    ribosome-binding mutants to map native substrates of the SecA cotranslational route.
  hypothesis: Only a defined subset of inner-membrane proteins uses direct SecA-ribosome targeting in vivo.
  experiment_type: ribosome-nascent-chain complex profiling
