id: P10408
gene_symbol: SecA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli (strain K12)
description: SecA is the peripheral ATP-hydrolyzing motor of the Escherichia coli Sec translocase. It binds
  SecB-delivered and other signal-peptide-bearing preproteins at the cytoplasmic face of the inner-membrane SecYEG
  channel, recognizes preprotein signal and mature regions, engages the SecY pore, and couples ATP binding and
  hydrolysis to stepwise polypeptide movement across the plasma membrane. A soluble SecA pool exchanges with the
  membrane-associated translocase, a C-terminal zinc site stabilizes its SecB-binding region, and ribosome binding can
  support cotranslational targeting of at least a subset of substrates.
existing_annotations:
