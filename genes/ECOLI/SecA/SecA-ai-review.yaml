    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:15690043
  qualifier: enables
  supporting_entities:
  - UniProtKB:P0AG86
  review:
    summary: The row records a physical interaction, but GO:0005515 protein binding is too generic to describe the Sec
      component activity.
    action: REMOVE
    reason: The interaction itself is not rejected. The problem is that GO:0005515 does not say whether the gene product
      is the SecA motor, the SecY pore, a SecYEG clamp/accessory subunit, or an export precursor. This row should be
      removed in favor of the more informative Sec molecular-function and process annotations.
    supported_by:
    - reference_id: file:ECOLI/SecA/SecA-notes.md
      supporting_text: Generic protein-binding IPI rows for SecA should be removed as uninformative interaction records,
        not because the reported interactions are false.
    - reference_id: PMID:2542029
      supporting_text: These data show that the SecA protein has a central role in coupling the hydrolysis of ATP to the
        transfer of pre-secretory proteins across the membrane.
