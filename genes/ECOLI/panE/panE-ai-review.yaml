- term:
    id: GO:0050661
    label: NADP binding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN002464833
  - UniProtKB:P0A9J4
  review:
    summary: NADP(H) is the cosubstrate of PanE; binding is true but subsidiary to the reductase activity.
    action: KEEP_AS_NON_CORE
    reason: >-
      Kinetic analysis shows ordered binding of NADPH before ketopantoate, so the enzyme binds NADP(H)
      directly. The binding is part of the catalytic reaction already captured by GO:0008677 and is not
      a separate role.
    supported_by: &id004
    - reference_id: PMID:10736170
      supporting_text: an ordered sequential kinetic mechanism in which NADPH binding is followed by ketopantoate
        binding
