taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  panE (apbA, b0425) encodes 2-dehydropantoate 2-reductase (ketopantoate reductase, KPR), a monomeric
  NADPH-dependent oxidoreductase that reduces 2-dehydropantoate (ketopantoate) to (R)-pantoate, the second
  step of the pantoate branch of pantothenate biosynthesis in Escherichia coli. The enzyme follows an
  ordered sequential mechanism with NADPH binding first, transfers the pro-S hydride of NADPH, and uses
  Lys176 as the general acid and Glu256 in substrate binding. The acetohydroxy acid isomeroreductase IlvC
  also reduces ketopantoate, so only an ilvC panE double mutant entirely lacks ketopantoate reductase
  activity.
