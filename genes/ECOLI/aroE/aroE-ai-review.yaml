- term:
    id: GO:0009073
    label: aromatic amino acid biosynthetic process
  evidence_type: IMP
  original_reference_id: PMID:5326114
  qualifier: acts_upstream_of_or_within
  review:
    summary: >-
      Pittard and Wallace (1966) characterised aromatic auxotrophs of E. coli K-12, assigned
      their enzymatic defects and mapped structural genes of the common pathway, aroE included.
    action: KEEP_AS_NON_CORE
    reason: >-
      Correct: aroE mutants cannot make the aromatic amino acids. In GO, however, chorismate
      biosynthetic process (GO:0009423) is not a descendant of this term, so MODIFY does not
      apply. AroE's own step is in the common chorismate pathway, and the aromatic amino acids
      are only some of the end products of chorismate. The amino acid term is therefore true but
      downstream of where the enzyme acts, and the core process is captured by GO:0009423.
    supported_by:
    - reference_id: PMID:5326114
      supporting_text: Structural genes for five of the enzymes of the common pathway leading to
        chorismate and for the two enzymes converting chorismate to phenylpyruvate and
        p-hydroxyphenylpyruvate, respectively, were identified.
