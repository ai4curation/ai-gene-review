suggested_questions:
- question: >-
    Under which conditions, if any, does the catabolic paralog YdiB contribute to biosynthetic
    shikimate formation in an aroE mutant, and does it account for any leakiness of aroE
    auxotrophs?
suggested_experiments:
- description: >-
    Grow aroE, ydiB and aroE ydiB deletion strains on minimal medium with and without aromatic
    supplements, and with quinate or shikimate as carbon source. This would quantify
    YdiB's ability to complement the biosynthetic step in vivo.
