  review:
    summary: >-
      Michel et al. (2003) solved the AroE crystal structure with bound NADP(H) at 1.5 A and
      defined the dinucleotide-binding domain and its cofactor specificity. The nucleotide
      bound is specifically NADP.
    action: MODIFY
    reason: >-
      The claim is correct but general. The structure and kinetics show a specific dinucleotide,
      NADP(H), bound by the Rossmann-fold domain, and UniProt records NADP-only activity. The
      appropriate descendant is GO:0050661 NADP binding, which the gene already carries (IEA,
      InterPro2GO), so the replacement aligns both rows.
