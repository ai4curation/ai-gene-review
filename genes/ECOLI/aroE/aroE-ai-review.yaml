id: P15770
gene_symbol: aroE
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  AroE is the biosynthetic shikimate dehydrogenase (EC 1.1.1.25) of Escherichia coli. It is a
  soluble, monomeric 272-residue cytosolic enzyme that catalyses the fourth step of the
  shikimate pathway, the reversible NADPH-dependent reduction of 3-dehydroshikimate to
  shikimate. It is strictly NADP(H)-specific and shows no activity with NAD. The protein has
  two alpha/beta domains: an N-terminal substrate-binding domain and a C-terminal
  Rossmann-fold dinucleotide-binding domain whose glycine-rich loop and 2'-phosphate-binding
  residues determine the NADP preference. Shikimate produced by AroE is phosphorylated by
  shikimate kinase and carried on to chorismate, the branch-point precursor of phenylalanine,
  tyrosine, tryptophan, folate, ubiquinone, menaquinone and enterobactin; aroE mutants block
  the pathway and accumulate 3-dehydroshikimate. E. coli also encodes a paralog, YdiB, a dual
  quinate/shikimate dehydrogenase using NAD or NADP that acts in quinate/shikimate catabolism
  rather than in the biosynthetic pathway.
