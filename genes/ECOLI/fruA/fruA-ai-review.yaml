references:
- id: GO_REF:0000002
  title: Gene Ontology annotation through association of InterPro records with GO
    terms
  findings:
  - statement: >-
      InterPro2GO provides the PTS EIIB/EIIC-derived FruA annotations; the
      fructose-PTS calls are supported, while the IPR006327 proton-symporter
      mapping is not appropriate for a PEP-dependent PTS group-translocation
      permease.
- id: GO_REF:0000033
  title: Annotation inferences using phylogenetic trees
  findings:
  - statement: >-
      PAINT node PTN002021020 propagates the broad fructose-family
      phosphocysteine-sugar PTS activity, the general PEP-dependent PTS process,
      and plasma-membrane localization to E. coli FruA.
- id: GO_REF:0000108
  title: Automatic assignment of GO terms using logical inference, based on on inter-ontology
    links
  findings:
  - statement: >-
      The proton-transmembrane-transport row is a logical consequence of the
      InterPro-derived carbohydrate:proton symporter activity and should fall
      with that unsupported MF assertion.
- id: GO_REF:0000120
  title: Combined Automated Annotation using Multiple IEA Methods
  findings:
