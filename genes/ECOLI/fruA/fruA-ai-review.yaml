  findings:
  - statement: >-
      E. coli FruA/FruB'BC has a duplicated noncatalytic B' domain plus the
      catalytic B and membrane C domains of the fructose Enzyme II permease.
    supporting_text: >-
      The fructose permease of Escherichia coli, the fructose-specific Enzyme
      II of the phosphoenolpyruvate-dependent phosphotransferase system (PTS),
      contains a duplicated IIB domain.
  - statement: >-
      Cys112 in FruA's B domain is essential for phosphocarrier and fructose
      transport activity.
