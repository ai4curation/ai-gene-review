id: P20966
gene_symbol: fruA
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli (strain K12)
description: >-
  fruA encodes the integral inner-membrane EIIB'BC component of the Escherichia
  coli fructose phosphotransferase system. FruA receives phosphoryl groups from
  the FruB EIIA-FPr relay through its EIIB cysteine and couples D-fructose
  translocation across the plasma membrane to formation of intracellular
  D-fructose 1-phosphate; its duplicated N-terminal EIIB' domain improves
  phosphoryl transfer from FruB but is not the catalytic phosphoacceptor.
