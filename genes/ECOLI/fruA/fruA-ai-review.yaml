- term:
    id: GO:0005351
    label: carbohydrate:proton symporter activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR006327
  review:
    summary: >-
      Remove this InterPro2GO symporter assignment. FruA is a PEP-dependent
      fructose PTS group-translocation permease, not a carbohydrate:proton
      symporter.
    action: REMOVE
    reason: >-
      IPR006327 covers the fructose-family EIIC domain, but the characterized
      E. coli protein couples fructose uptake to phosphoryl transfer through
      FruB and FruA's EIIB cysteine. The 1988 fruA paper describes uptake with
      concomitant phosphorylation to fructose 1-phosphate, and the general PTS
      mechanism is group translocation in which IIB-P transfers phosphate to
      the incoming sugar; neither mechanism invokes proton symport.
    supported_by:
    - reference_id: PMID:3076173
      supporting_text: >-
        The Enzyme IIfru of the phosphoenolpyruvate- (PEP-) dependent
        phosphotransferase system (PTS), which catalyses the uptake of fructose
        and its concomitant phosphorylation to fructose 1-phosphate by
        Escherichia coli, is specified by a gene designated fruA.
    - reference_id: PMID:31751341
      supporting_text: >-
        In these coupled sugar transport/phosphorylation reactions, called
        "group translocation," the phosphoryl moiety of IIB-P is transferred to
        the incoming sugar to yield a cytoplasmic sugar phosphate
