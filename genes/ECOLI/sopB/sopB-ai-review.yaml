- term:
    id: GO:0043273
    label: CTPase activity
  evidence_type: IDA
  original_reference_id: PMID:34286695
  review:
    summary: Purified SopB (ParB of F) hydrolyses CTP, stimulated by sopC DNA.
    action: NEW
    reason: >-
      Direct measurement on the F plasmid protein, called ParBF in the paper
      (the F system is SopA/B/C). Hydrolysis is specific for CTP and follows
      Michaelis-Menten kinetics, with the maximum rate raised about threefold
      by sopC DNA. CTP promotes loading of multiple SopB molecules onto
      sopC-containing DNA, the clamp behaviour shared with chromosomal ParB.
    supported_by:
    - reference_id: PMID:34286695
      supporting_text: using F-plasmid ParAFBFSF (also called SopA/B/C) as a model system
    - reference_id: PMID:34286695
      supporting_text: ParBF had negligible activity for all NTPs other than CTP
- term:
    id: GO:0001671
    label: ATPase activator activity
  evidence_type: IDA
  original_reference_id: PMID:19740757
  review:
    summary: SopB stimulates SopA ATP hydrolysis through an arginine finger.
    action: NEW
    reason: >-
      SopB does not bind ATP itself but stimulates the ATPase of its partner:
      purified SopB raises SopA ATP hydrolysis above the DNA-stimulated level,
      and it provides the catalytic arginine finger. This is the coupling
      between the two partition roles, and the activity that drives
      separation of the partition complexes.
    supported_by:
    - reference_id: PMID:1406581
      supporting_text: The ATPase activity in the presence of DNA was further stimulated by addition of
        the SopB protein.
    - reference_id: PMID:19740757
      supporting_text: which we show here to provide an arginine-finger motif
