    label: plasmid partitioning
  evidence_type: IMP
  original_reference_id: PMID:10395819
  review:
    summary: SopB is required for F plasmid partition.
    action: NEW
    reason: >-
      SopB does work in the process: it forms the partition complex at sopC
      and activates SopA. sopB missense mutants were isolated by screening for
      unstable inheritance of mini-F.
    supported_by:
    - reference_id: PMID:10395819
      supporting_text: We have isolated sop mutants by screening for unstable inheritance of mutagenized
        mini-F DNA.
    - reference_id: PMID:10395819
      supporting_text: Four of the mutants resulted from different missense mutations in sopB.
- term:
    id: GO:0045892
    label: negative regulation of DNA-templated transcription
  evidence_type: IMP
  original_reference_id: PMID:9529520
  review:
    summary: SopB, with SopA, represses the sopAB operon.
    action: NEW
    reason: >-
      Repression needs SopA and SopB together; SopB alone does not bind the
      operator but enhances SopA binding there, and sopC strengthens the
      repression. Non-core: it keeps Sop protein levels in the range that
      partition needs.
    supported_by:
    - reference_id: PMID:9529520
      supporting_text: the sopAB operon is repressed by the cooperative action of SopA and SopB
    - reference_id: PMID:10395819
      supporting_text: it interacts with SopA to repress transcription of the sopAB operon
