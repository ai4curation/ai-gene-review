  review:
    summary: SopB binds DNA; its defining activity is sequence-specific binding to the sopC centromere.
    action: MODIFY
    reason: >-
      True but less specific than the evidence. Purified SopB binds the sopC
      repeats specifically, and crystal structures show SopB bound to its
      site. It also coats non-specific DNA, but recognition of sopC is the
      activity that defines it. Sequence-specific DNA binding (GO:0043565) is
      a descendant of DNA binding and is the term used for chromosomal ParB.
