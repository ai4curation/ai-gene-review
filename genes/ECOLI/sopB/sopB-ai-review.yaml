  label: Escherichia coli K-12
description: >-
  SopB is the centromere-binding protein of the F plasmid partition system.
  It binds the sopC centromere, a cluster of 43-bp repeats, through an
  all-helical DNA-binding domain attached to a dimerization domain, and
  coats flanking DNA to form the partition complex. SopB is a CTPase whose
  activity is stimulated by sopC DNA, and CTP promotes loading of multiple
  SopB molecules onto sopC-containing DNA. Bound at sopC, SopB recruits the
  partition ATPase SopA and stimulates its ATP hydrolysis by contributing an
  arginine finger, which drives positioning and separation of plasmid
  copies. SopB also acts with SopA to repress the sopAB operon and silences
  genes near sopC.
