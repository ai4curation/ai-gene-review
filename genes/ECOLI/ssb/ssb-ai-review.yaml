  review:
    summary: SSB directly organizes exposed ssDNA and interacting repair/recombination enzymes.
    action: ACCEPT
    reason: SSB directly organizes exposed ssDNA and interacting repair/recombination enzymes. These are
      established genome-maintenance functions, not merely indirect consequences of defective replication;
      the review explicitly describes mismatch and recombinational repair.
    supported_by:
