id: P0AGE0
gene_symbol: ssb
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: Escherichia coli SSB forms a homotetramer that binds exposed single-stranded DNA cooperatively,
  protects it and prevents inappropriate annealing during replication, repair and recombination. Its flexible
  C-terminal tails recruit genome-maintenance proteins and can stimulate their activities, including exonuclease
  I. SSB therefore combines DNA protection with organization of productive DNA-processing assemblies.
