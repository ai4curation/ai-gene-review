- term:
    id: GO:0008615
    label: pyridoxine biosynthetic process
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN002408757
  - UniProtKB:P19624
  review:
    summary: PAINT pyridoxine biosynthesis node seeded by this protein.
    action: ACCEPT
    reason: >-
      PTN002408757 sits at the Proteobacteria level of PTHR30004 and is seeded by E. coli
      PdxA itself; its presence in its own WITH/FROM reflects its experimental (IMP) grounding.
      GO has no 'pyridoxine 5'-phosphate biosynthetic process' term; GO:0008615 is the process
      used for the erythrose 4-phosphate/DXP branch that forms the pyridoxine ring (UniPathway
      UPA00244 pyridoxine 5'-phosphate biosynthesis). PdxA catalyses step 4 of that branch
      and pdxA mutants require pyridoxine. The ring is made as PNP rather than free pyridoxine
      (PMID:10225425), so the term is used in its vitamin-B6-branch sense; this is a pathway
      claim the gene directly participates in and is kept.
    supported_by:
    - reference_id: file:interpro/panther/PTHR30004/PTHR30004-paint.tsv
      supporting_text: "PTHR30004\tPTN002408757\tGO:0008615\tP\tIBD\tfalse\tUniProtKB:P19624"
    - reference_id: PMID:2670894
      supporting_text: >-
        We report that pdxA, which is required for de novo biosynthesis of pyridoxine (vitamin
        B6) and pyridoxal phosphate, belongs to an unusual, multifunctional operon.
