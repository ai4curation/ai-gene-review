    reason: >-
      The enzyme uses NAD(P)+ as co-substrate and is predicted to bind it like isocitrate
      dehydrogenase; cofactor binding is real but secondary to the GO:0050570 activity, which
      already names NAD+ as a participant.
    supported_by:
    - reference_id: PMID:12896974
      supporting_text: >-
        This divalent metal ion-dependent enzyme has a strict requirement for the phosphate
        ester form of the substrate HTP, but can utilize either NADP+ or NAD+ as redox cofactor.
    - reference_id: PMID:12896974
      supporting_text: >-
        suggest that the cofactor binding mode of PdxA is very similar to that of the other
        two enzymes
