  qualifier: enables
  supporting_entities:
  - UniRule:UR000094090
  review:
    summary: Mg2+ is one of the alternative divalent metal cofactors of PdxA.
    action: KEEP_AS_NON_CORE
    reason: >-
      UniProt records Zn2+, Mg2+ and Co2+ as alternative cofactors with experimental evidence
      on this protein (PMID:12896974 and the 1998 Cane-group JACS paper, Ref.5), and the crystal
      structure shows one metal per active site coordinated by histidines from both subunits.
      The metal is required for catalysis but metal binding is a cofactor property secondary
      to the defining dehydrogenase activity, so the row is kept as non-core.
    supported_by:
    - reference_id: file:ECOLI/pdxA/pdxA-uniprot.txt
      record_section:
      - CC:COFACTOR
      supporting_text: >-
        Binds 1 divalent metal cation per subunit. Can use ions such as Zn(2+), Mg(2+) or
        Co(2+).
    - reference_id: PMID:12896974
      supporting_text: >-
        This divalent metal ion-dependent enzyme has a strict requirement for the phosphate
        ester form of the substrate HTP, but can utilize either NADP+ or NAD+ as redox cofactor.
