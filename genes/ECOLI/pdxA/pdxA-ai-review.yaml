core_functions:
- description: >-
    NAD(P)+-dependent oxidation of 4-(phosphooxy)-L-threonine to 3-amino-2-oxopropyl phosphate
    (via spontaneous decarboxylation), supplying the aminoketone that PdxJ condenses with
    DXP to form pyridoxine 5'-phosphate in de novo PLP synthesis.
  molecular_function:
    id: GO:0050570
    label: 4-hydroxythreonine-4-phosphate dehydrogenase activity
  directly_involved_in:
  - id: GO:0036001
    label: '''de novo'' pyridoxal 5''-phosphate biosynthetic process'
  - id: GO:0008615
    label: pyridoxine biosynthetic process
  supported_by:
  - reference_id: PMID:15026039
    supporting_text: >-
      Use of negative ion electrospray ionization mass spectrometry (ESI-MS) and tandem mass
      spectrometric analysis (MS-MS) confirms that AHAP is the product of the PdxA-catalyzed
      reaction.
  - reference_id: file:ECOLI/pdxA/pdxA-uniprot.txt
    record_section:
    - CC:FUNCTION
    supporting_text: >-
      Catalyzes the NAD(P)-dependent oxidation of 4-(phosphooxy)-L-threonine (HTP) into 2-amino-3-oxo-4-(phosphooxy)butyric
      acid which spontaneously decarboxylates to form 3-amino-2-oxopropyl phosphate (AHAP).
  - reference_id: PMID:12896974
    supporting_text: >-
      The fourth step is catalyzed by 4-hydroxythreonine-4-phosphate dehydrogenase (PdxA,
      E.C. 1.1.1.262), which converts 4-hydroxy-l-threonine phosphate (HTP) to 3-amino-2-oxopropyl
      phosphate.
suggested_questions:
- question: >-
    Is 2-amino-3-oxo-4-(phosphooxy)butyrate released and decarboxylated non-enzymatically,
    or does PdxA catalyse the decarboxylation within the active site as the ICDH-like fold
    suggests?
- question: >-
    Which divalent metal occupies the PdxA active site in vivo in E. coli, given that Zn2+,
    Mg2+ and Co2+ all support activity in vitro?
suggested_experiments:
- hypothesis: PdxA performs the decarboxylation step enzymatically.
  description: >-
    Rapid-quench or stopped-flow kinetics with 13C-labelled HTP to detect free 2-amino-3-oxo
    intermediate versus direct AHAP release.
