- term:
    id: GO:0042823
    label: pyridoxal 5'-phosphate biosynthetic process
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN002408757
  - UniProtKB:P19624
  review:
    summary: PAINT PLP biosynthesis node seeded by this protein; refine to de novo.
    action: MODIFY
    reason: >-
      The PAINT node placement (Proteobacteria PdxA clade, seeded by P19624) is sound. PdxA
      catalyses a step that occurs only in de novo PLP synthesis (it makes the aminoketone
      that PdxJ uses to build the ring); it has no role in PLP salvage. The more specific
      child GO:0036001 'de novo' pyridoxal 5'-phosphate biosynthetic process (is_a GO:0042823)
      states the pathway exactly and is the core process of this review, matching the de novo
      PLP module.
    proposed_replacement_terms:
    - id: GO:0036001
      label: '''de novo'' pyridoxal 5''-phosphate biosynthetic process'
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - GRANULARITY_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN002408757
        source_status: SUPPORTS_TRANSFER
        comment: >-
          Proteobacteria PdxA node seeded by P19624; the PLP-synthesis claim transfers correctly,
          but PdxA acts only in the de novo route, so the de novo child term is more precise.
    supported_by:
    - reference_id: file:interpro/panther/PTHR30004/PTHR30004-paint.tsv
      supporting_text: "PTHR30004\tPTN002408757\tGO:0042823\tP\tIBD\tfalse\tUniProtKB:P19624"
    - reference_id: PMID:12896974
      supporting_text: >-
        The fourth step is catalyzed by 4-hydroxythreonine-4-phosphate dehydrogenase (PdxA,
        E.C. 1.1.1.262), which converts 4-hydroxy-l-threonine phosphate (HTP) to 3-amino-2-oxopropyl
        phosphate.
