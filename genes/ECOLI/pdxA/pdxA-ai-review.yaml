id: P19624
gene_symbol: pdxA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  PdxA is the cytoplasmic 4-hydroxythreonine-4-phosphate dehydrogenase of Escherichia coli
  (EC 1.1.1.262). It catalyses the NAD(P)+-dependent oxidation of 4-(phosphooxy)-L-threonine
  to an unstable 2-amino-3-oxo intermediate that decarboxylates to 3-amino-2-oxopropyl phosphate,
  the fourth step of the DXP-dependent de novo pathway of pyridoxal 5'-phosphate (vitamin
  B6) synthesis; PdxJ then condenses this aminoketone with 1-deoxy-D-xylulose 5-phosphate
  to form pyridoxine 5'-phosphate. PdxA is a tight homodimer with an isocitrate/isopropylmalate
  dehydrogenase-like fold whose active site lies at the dimer interface and holds one divalent
  metal ion (Zn2+, or Mg2+ or Co2+) coordinated by histidines from both subunits. pdxA mutants
  require pyridoxine or pyridoxal for growth.
