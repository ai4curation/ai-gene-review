id: P17854
gene_symbol: cysH
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: CysH is the soluble cytoplasmic PAPS reductase of Escherichia coli. It uses reducing equivalents
  from thioredoxin to convert PAPS into sulfite and PAP during assimilatory sulfur metabolism. Catalytic
  Cys239 forms an S-sulfocysteine intermediate that is resolved through interaction with thioredoxin.
  This PAPS-specific enzyme is distinct from the APS-reducing CysH homologs of some other bacteria and
  from glutathione-dependent plant APR fusions.
