      resource: UNIPROT
      slot: GO_ID
      requested_change: CHECK
      asserted_value: GO:0032026
      cause: SCOPE_OVER_REACH
      confidence: PROBABLE
      explanation: The PgpA (P18200) row GO:0032026 response to magnesium ion (IDA, PMID:21148555) appears
        to encode the Mg2+ cofactor requirement of the purified phosphatase. A metal cofactor requirement
