    id: GO:0032026
    label: response to magnesium ion
  evidence_type: IDA
  original_reference_id: PMID:21148555
  qualifier: involved_in
  review:
    summary: A Mg2+ cofactor requirement of the enzyme has been recorded as a cellular response to magnesium.
    action: MARK_AS_OVER_ANNOTATED
    reason: GO:0032026 is defined as "Any process that results in a change in state or activity of a cell
      or an organism (in terms of movement, secretion, enzyme production, gene expression, etc.) as a
      result of a magnesium ion stimulus." The only Mg2+ finding UniProt cites from this paper is that
      the enzyme uses Mg2+ as a cofactor. An in vitro metal requirement of a phosphatase is a property
      of the catalytic activity, not a cellular process that responds to a magnesium stimulus. The full
      text is not cached, so the row is marked as an over-annotation rather than removed. It is recorded
      as a probable wrong-term source defect.
    supported_by:
