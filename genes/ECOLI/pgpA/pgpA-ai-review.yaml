suggested_questions:
- question: Why does E. coli keep three unrelated PGP phosphatases (PgpA, PgpB, PgpC)? Do they act on
    distinct PGP pools, for example on different membrane leaflets or in different growth conditions?
- question: Should GO:0008962 phosphatidylglycerophosphatase activity be placed under GO:0042577 lipid
    phosphatase activity? GO:0042577 is defined as "a phospholipid + H2O = a lipid + phosphate", which
    PGP hydrolysis satisfies, but GO:0008962 currently has only phosphatase activity as its parent, so
    lipid phosphatase annotations to PgpA cannot be recognized as broader forms of its specific activity.
suggested_experiments:
- description: Measure PGP and PG turnover with pulse-chase labelling in pgpB pgpC double mutants carrying
    only pgpA, across growth phase and Mg2+ concentration, to define the physiological share of PgpA.
