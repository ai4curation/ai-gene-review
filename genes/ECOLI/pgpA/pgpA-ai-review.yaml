id: P18200
gene_symbol: pgpA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: 'PgpA is one of three structurally distinct phosphatidylglycerol-phosphate (PGP) phosphatases
  of the Escherichia coli inner membrane (with PgpB and PgpC). It is a small Mg2+-dependent multi-pass
  membrane enzyme of the PgpA/YutG family that hydrolyses the terminal phosphate of PGP to give phosphatidylglycerol,
  the second and last step of phosphatidylglycerol synthesis from CDP-diacylglycerol. PgpA is specific
  for PGP, unlike PgpB, which also dephosphorylates phosphatidic acid and lysophosphatidic acid. The three
  phosphatases are redundant: loss of PgpA alone raises the PGP pool, and only the triple deletion is
  lethal. Mitochondrially targeted PgpA restores cardiolipin synthesis in yeast lacking the unrelated
  PGP phosphatase Gep4.'
