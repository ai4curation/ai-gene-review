suggested_questions:
- question: Does MEP activation of IspF, and FDP inhibition of the IspF-MEP complex, occur at physiological
    metabolite concentrations in E. coli and contribute to control of MEP-pathway flux?
- question: Does the hydrophobic cavity on the IspF trimer axis bind downstream prenyl diphosphates in
    vivo?
- question: Which divalent cation occupies the second (phosphate-bridging) metal site of IspF in vivo,
    and is IspF located only in the cytosol?
suggested_experiments:
- description: Measure MEP, ME-cPP and FDP pools together with IspF activity in E. coli strains with
    altered Dxr or IspA expression, and test IspF variants defective in MEP activation for their effect
    on pathway flux.
