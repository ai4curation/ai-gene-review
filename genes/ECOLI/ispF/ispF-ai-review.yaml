- description: Zinc-containing homotrimeric ME-cPP synthase that cyclises 4-diphosphocytidyl-2-C-methyl-D-erythritol
    2-phosphate to 2-C-methyl-D-erythritol 2,4-cyclodiphosphate with release of CMP, the fourth step of
    the MEP pathway to IPP/DMAPP.
