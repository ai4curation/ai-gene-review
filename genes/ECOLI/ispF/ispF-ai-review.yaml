- term:
    id: GO:0030145
    label: manganese ion binding
  evidence_type: IDA
  original_reference_id: PMID:10694574
  qualifier: enables
  review:
    summary: Mn2+ supports catalysis and binds between the substrate phosphates in crystal structures; the
      in vivo ion may be Mg2+.
    action: KEEP_AS_NON_CORE
    reason: The reaction requires Mn2+ or Mg2+, and crystal structures of E. coli IspF contain bound Mn2+,
      octahedrally coordinated between the alpha and beta phosphates where it acts with the Zn2+ to polarise
      the substrate. Binding is real, but which second cation is used in vivo is not established and it
      is held largely through the substrate; the row is kept as true but non-core.
    supported_by:
    - reference_id: PMID:10694574
      supporting_text: The enzyme-catalyzed reaction requires Mn(2+) or Mg(2+) but no other cofactors.
    - reference_id: PMID:11997478
      supporting_text: A Mn(2+), with octahedral geometry, is positioned between the alpha and beta phosphates
        acting in concert with the Zn(2+) to align and polarize the substrate for catalysis.
