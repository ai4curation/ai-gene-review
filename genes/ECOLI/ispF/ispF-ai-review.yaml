taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: IspF (YgbB) is the 2-C-methyl-D-erythritol 2,4-cyclodiphosphate (ME-cPP) synthase of Escherichia
  coli, an essential enzyme of the methylerythritol phosphate (MEP) pathway that makes the isoprenoid
  precursors isopentenyl diphosphate and dimethylallyl diphosphate. It converts 4-diphosphocytidyl-2-C-methyl-D-erythritol
  2-phosphate (CDP-ME2P), the product of IspE, into ME-cPP and CMP by intramolecular attack of the 2-phosphate
  on the beta-phosphate. The enzyme is a homotrimer built around a central hydrophobic cavity, with three
  active sites at the subunit interfaces; each carries a tightly bound, tetrahedrally coordinated Zn2+
  (Asp8, His10, His42) plus a second divalent cation (Mg2+ or Mn2+) that bridges the substrate phosphates.
  In vitro its activity is enhanced and sustained by the pathway intermediate MEP, and the MEP-bound enzyme
  is inhibited by farnesyl diphosphate. ispF lies in an operon with ispD, and depleting IspF stops growth
  and causes filamentation.
