id: P0AAI1
gene_symbol: ssuB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: SsuB is the ATP-binding component of the Escherichia coli SsuABC alkanesulfonate importer.
  Its conserved ABC nucleotide-binding machinery supplies the energy-coupling role at the inner membrane,
  working with SsuC and the periplasmic substrate-binding protein SsuA to acquire alternative sulfur sources
  during sulfate limitation. Transport specificity is a property of the assembled system rather than SsuB
  alone.
