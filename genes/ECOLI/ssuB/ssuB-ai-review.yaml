  findings:
  - statement: Deletion of the ssuEADCB operon compromises use of sulfur from aliphatic sulfonates.
    supporting_text: 'The growth properties of an Escherichia coli strain carrying a chromosomal

      deletion of the ssuEADCB genes (formerly designated ycbPONME) indicated that the

      products of this gene cluster are required for the utilization of sulfur from

      aliphatic sulfonates.'
