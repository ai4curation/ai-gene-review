  review:
    summary: The gph knockout accumulates 2-phosphoglycolate and recovers more slowly
      after bleomycin, but its DNA damage and survival are unchanged; Gph clears a
      repair by-product rather than performing repair.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The full text of PMID:13129953 is available and was read. The mutant phenotype is
      metabolic (2-phosphoglycolate accumulation, no glycolate formation, delayed
      resumption of growth). DNA damage levels and survival were indistinguishable from
      the parent. The authors frame the enzyme as a salvage enzyme for a DNA-repair
      by-product. Gph does no step of the repair process itself, so this broad process
      over-states its role; the same judgment applies to the IBA row.
    supported_by:
    - reference_id: PMID:13129953
