    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text cached (PMC193966). Purification, kinetics, specificity, magnesium and chloride
      dependence, monomeric structure, constitutive expression and the in vivo
      bleomycin experiments establishing the 2-phosphoglycolate salvage role. Also shows
      that the gph mutation does not change bleomycin/H2O2 susceptibility.
  findings:
  - statement: Gph is a highly specific 2-phosphoglycolate phosphatase (Km 210 uM,
      kcat 94 s-1) requiring Mg2+ and Cl- cooperatively.
    supporting_text: The enzyme was highly specific for 2-phosphoglycolate
  - statement: In vivo, Gph converts DNA-repair-derived 2-phosphoglycolate to glycolate;
      gph mutants accumulate 2-phosphoglycolate after bleomycin treatment.
    supporting_text: We thus provide evidence for a salvage function of
      2-phosphoglycolate phosphatase in the metabolism of a two-carbon compound
      generated by the cellular DNA repair machinery.
  - statement: The native enzyme is a monomer.
    supporting_text: indicates a monomeric structure for this enzyme
