id: P32662
gene_symbol: gph
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  gph (yhfE) encodes 2-phosphoglycolate phosphatase (PGPase), a monomeric 27 kDa member
  of the HAD-like hydrolase superfamily (subfamily IA, CbbY/CbbZ/Gph/YieH family) with
  the conserved N-terminal DxD motif whose first aspartate acts as the nucleophile. The
  enzyme hydrolyzes 2-phosphoglycolate to glycolate and inorganic phosphate with high
  specificity and catalytic efficiency (Km about 0.2 mM, kcat about 94 per second), and
  requires Mg2+ and chloride, which act cooperatively. Gph is a constitutively expressed,
  presumably cytosolic housekeeping enzyme encoded in the dam-containing superoperon. In
  non-autotrophic bacteria its physiological role is the salvage of free 2-phosphoglycolate
  released when DNA strand breaks bearing 3'-phosphoglycolate termini (for example those
  produced by bleomycin or oxidative damage) are repaired; the glycolate produced feeds
  into glycolate/glyoxylate metabolism via the glc operon. In a broad substrate screen of
  E. coli HAD phosphatases the enzyme also showed weak secondary activity toward small
  phosphodonors such as acetyl phosphate.
