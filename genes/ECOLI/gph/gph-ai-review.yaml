  review:
    summary: Purified Gph requires Mg2+ together with chloride for maximal activity;
      Mg2+ is the catalytic metal of HAD-superfamily phosphatases.
    action: KEEP_AS_NON_CORE
    reason: >-
      Pellicer et al. show maximal activity only with MgCl2 and a cooperative dependence
      on Mg2+ and Cl-. Binding of the catalytic Mg2+ at the DxD motif (Asp13, Asp15,
      Asp192 by similarity) is integral to HAD-type catalysis, but metal binding is a
      cofactor property rather than the enzyme's distinguishing function, so it is kept
      as non-core.
