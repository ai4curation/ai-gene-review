  review:
    summary: Gph metabolizes free 2-phosphoglycolate released after repair of
      3'-phosphoglycolate DNA ends; it acts downstream of, rather than within, DNA
      repair.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The node evidence is E. coli Gph itself (PMID:13129953). That study shows Gph
      dephosphorylates the 2-phosphoglycolate liberated by the repair machinery, so the
      glycolate can be salvaged into central metabolism. Gph does not act on DNA, and the
      gph mutant showed the same DNA damage and survival after bleomycin or H2O2
      treatment as the parent strain; the only difference was 2-phosphoglycolate
      accumulation, loss of glycolate formation and slower regrowth. That is a
      metabolite-salvage role coupled to repair, not participation in the repair
      process. The association is real, so the row is flagged as over-annotation rather
      than removed; glycolate biosynthetic process describes the actual role.
