suggested_questions:
- question: Is DNA-repair-derived 2-phosphoglycolate the main physiological substrate of
    Gph under normal aerobic growth, or are there other intracellular sources (for
    example from oxidative sugar damage or side reactions of other enzymes)?
- question: Is 2-phosphoglycolate accumulation toxic in E. coli (for example through
    inhibition of triose-phosphate isomerase or phosphofructokinase, as reported in other
    organisms), which would explain the delayed regrowth of gph mutants after bleomycin?
- question: Do any of the secondary HAD-screen activities of Gph (acetyl phosphate,
    imidodiphosphate) have physiological relevance?
suggested_experiments:
- description: >-
    Untargeted metabolomics of gph deletion versus wild type under aerobic growth,
    oxidative stress and bleomycin treatment to detect 2-phosphoglycolate and other
    accumulating phosphometabolites, and test for inhibition of glycolytic enzymes.
  experiment_type: metabolomics
- description: >-
    Determine the crystal structure of E. coli Gph with 2-phosphoglycolate or a
    transition-state analog bound to define the basis of its high specificity and the
    chloride-binding site.
  experiment_type: structural biology
