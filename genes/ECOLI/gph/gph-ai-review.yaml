    Mg2+- and chloride-dependent hydrolysis of 2-phosphoglycolate to glycolate and
    phosphate in the cytosol, salvaging the 2-phosphoglycolate released during repair of
    3'-phosphoglycolate DNA strand ends so that its carbon enters glycolate/glyoxylate
    metabolism.
