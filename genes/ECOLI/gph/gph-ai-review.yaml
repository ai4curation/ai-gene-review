- term:
    id: GO:0005975
    label: carbohydrate metabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  review:
    summary: InterPro2GO mapping from the prokaryotic PGPase family; neither the
      substrate (2-phosphoglycolate) nor the product (glycolate) is a carbohydrate.
    action: REMOVE
    reason: >-
      Gph is highly specific for 2-phosphoglycolate and does not dephosphorylate sugar
      phosphates (no activity on ribose-5-phosphate, fructose-6-phosphate,
      fructose-1,6-bisphosphate or phosphoglycerates). Glycolate is a two-carbon hydroxy
      acid, and GO places glycolate biosynthetic process under organic acid / alcohol
      metabolism, not carbohydrate metabolism. In E. coli the substrate arises from DNA
      repair, not from the Calvin cycle. The broad InterPro mapping therefore asserts a
      process the enzyme does not take part in; the accurate process is captured by
      glycolate biosynthetic process.
    supported_by:
    - reference_id: PMID:13129953
      supporting_text: 'No phosphatase activity was detected on the following phosphorylated
        compounds tested at concentrations of up to 5 mM: d -2 phosphoglycerate, d -3-phosphoglycerate,
        glycerol-3-phosphate, phosphoenolpyruvate, d -ribose-5-phosphate, d -fructose-6-phosphate,
        and d -fructose-1,6-bisphosphate.'
- term:
