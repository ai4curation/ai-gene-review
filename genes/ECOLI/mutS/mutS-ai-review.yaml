- term:
    id: GO:0000018
    label: regulation of DNA recombination
  evidence_type: IMP
  original_reference_id: PMID:2555716
  qualifier: acts_upstream_of_or_within
  review:
    summary: mutS mutants lose the barrier to recombination between diverged (homeologous) sequences,
      so MutS restrains rather than generally regulates recombination.
    action: MODIFY
    reason: 'The direction of the effect is known: loss of MutS relaxes the homology requirement and allows
      E. coli x Salmonella intergeneric recombination (PMID:2555716), and every MMR-null MutS allele also
      fails to block homeologous recombination (PMID:12606120). The informative term is negative regulation
      of DNA recombination, an is_a descendant of the annotated term. This anti-recombination role is
      a genuine but secondary output of the same MutS-MutL signalling used in mismatch repair.'
    proposed_replacement_terms:
    - id: GO:0045910
      label: negative regulation of DNA recombination
    supported_by:
    - reference_id: PMID:2555716
      supporting_text: The requirement for DNA sequence homology in generalized genetic recombination
        is greatly relaxed in bacterial mutL, mutS and mutH mutants deficient in mismatch repair
    - reference_id: PMID:12606120
      supporting_text: every mutation that abolishes mismatch repair is deficient in blocking homeologous
        recombination
