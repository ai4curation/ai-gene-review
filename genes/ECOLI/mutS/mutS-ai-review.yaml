id: P23909
gene_symbol: mutS
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: MutS is the mismatch-recognition ATPase of Escherichia coli methyl-directed DNA mismatch
  repair. A homodimer (and higher oligomers) scans duplex DNA, and one subunit specifically recognizes
  base-base mismatches and small insertion/deletion loops by minor-groove contacts that kink the DNA.
  Mismatch binding licenses an ATP-dependent conformational change into a sliding clamp that recruits
  MutL, which in turn activates the MutH endonuclease at hemimethylated GATC sites and loads the UvrD
  helicase for excision. The same MutS-MutL signalling suppresses recombination between diverged sequences.
  MutS is a soluble cytosolic protein acting on the nucleoid.
