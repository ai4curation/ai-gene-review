suggested_questions:
- question: Does the MutS-mediated barrier to homeologous recombination require the same MutL handoff
    as mismatch repair, or a distinct MutS ATPase state?
- question: How do the two non-equivalent MutS dimers in tetramers divide mismatch holding and strand-signal
    search in vivo?
suggested_experiments:
- hypothesis: Tetramerization-defective MutS supports mismatch binding but not efficient MutH activation
    in vivo.
  description: Compare mutation rates and homeologous recombination in strains carrying a C-terminal tetramerization-defective
    mutS allele versus wild type, with single-molecule imaging of clamp formation.
  experiment_type: genetics and single-molecule imaging
