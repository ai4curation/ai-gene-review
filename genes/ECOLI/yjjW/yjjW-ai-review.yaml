core_functions:
- description: >-
    Predicted activase for the glycyl radical enzyme YjjI. YjjW would install the glycyl
    radical on YjjI by reductive cleavage of S-adenosyl-L-methionine on its radical SAM
    [4Fe-4S] cluster. Inferred from family membership (its own NCBIfam family TIGR04041
    describes the YjjW-YjjI pair) and from the translational coupling of yjjW to yjjI; not
    directly demonstrated, and the reaction catalysed by YjjI is unknown.
  molecular_function:
    id: GO:0043364
    label: glycyl-radical enzyme activating activity
  supported_by:
  - reference_id: file:ECOLI/pflC/pflC-bioinformatics/RESULTS.md
    supporting_text: yjjW overlaps the 3' end of yjjI by 29 bp
  - reference_id: file:ECOLI/yjjW/yjjW-uniprot.txt
    supporting_text: Belongs to the organic radical-activating enzymes family.
knowledge_gaps:
- gap_statement: >-
    The reaction catalysed by the YjjW-activated glycyl radical enzyme YjjI is unknown, so
    the physiological process that YjjW's activase activity serves cannot be named.
  boundary: >-
    YjjW is a radical SAM protein of the dedicated YjjW activase family (TIGR04041),
    coupled to yjjI. YjjI is a glycyl-radical-enzyme-family protein with an internal
    Gly-loop motif and no assigned substrate or reaction. Neither protein has been
    purified or assayed, and no deletion phenotype has been reported.
  gap_kind:
  - BIOLOGY
  dark_aspect: BP_DARK
  status: OPEN
  significance: >-
    Identifying the YjjI reaction would reveal a new anaerobic glycyl-radical metabolic
    capability of E. coli and its relatives, and would let YjjW's activase role be placed
    in a pathway.
  resolution: >-
    Purify YjjI and YjjW anaerobically, reconstitute clusters, and use YjjW to install the
    YjjI glycyl radical (EPR). Screen candidate substrates (e.g. amino acids, sugars, sugar
    phosphates) for YjjI turnover by LC-MS, guided by its active-site residues, and test
    yjjIW deletion phenotypes under anaerobic conditions.
  provenance:
  - reference_id: file:ECOLI/pflC/pflC-bioinformatics/RESULTS.md
    supporting_text: YjjW's partner YjjI is a truncated, GRE-like protein with an internal
      Gly loop and unknown function.
suggested_questions:
- question: >-
    What reaction does YjjI catalyse, and is YjjW its dedicated and sole activase?
- question: >-
    Are yjjW and yjjI co-transcribed and co-regulated, and under what growth conditions is
    the pair expressed?
suggested_experiments:
- hypothesis: YjjW installs a glycyl radical on YjjI.
  description: >-
    Reconstitute YjjW and YjjI anaerobically and test SAM-dependent glycyl-radical
    installation on YjjI by EPR, with reduced flavodoxin and a reductant.
  experiment_type: in vitro enzymology
- hypothesis: YjjI catalyses a specific, identifiable radical reaction.
  description: >-
    Screen activated YjjI against candidate substrate classes by LC-MS and NMR, informed by
    homology modelling of its active site, to identify the reaction whose activase is YjjW.
  experiment_type: substrate screening
