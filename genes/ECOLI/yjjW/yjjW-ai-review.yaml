id: P39409
gene_symbol: yjjW
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  YjjW is a radical S-adenosyl-L-methionine (SAM) enzyme of the glycyl-radical-enzyme
  activase family, the founding member of its own subfamily (NCBIfam TIGR04041, "YjjW
  family glycine radical enzyme activase"). It has a radical SAM domain with the CX3CX2C
  [4Fe-4S] cluster-binding motif and two additional ferredoxin-type domains that may
  carry further iron-sulfur clusters. yjjW is encoded immediately downstream of, and
  overlapping, yjjI on the same strand, the standard arrangement of a glycyl radical
  enzyme and its dedicated activase. YjjI is a glycyl-radical-enzyme-family protein of
  unknown function, carrying a glycine-loop motif but no assigned reaction. By analogy
  with the characterised activases PflA and NrdG, YjjW is expected to install the glycyl
  radical on YjjI by reductive cleavage of SAM to a 5'-deoxyadenosyl radical that
  abstracts a hydrogen atom from the YjjI glycine. No activity of YjjW has been
  demonstrated, and the reaction catalysed by its partner YjjI is not known; despite the
  family's historical name, there is no evidence that YjjW activates pyruvate
  formate-lyase.
