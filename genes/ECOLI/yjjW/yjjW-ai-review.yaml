- term:
    id: GO:0043364
    label: glycyl-radical enzyme activating activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN001251485
  - UniProtKB:P0A9N4
  - UniProtKB:P0A9N8
  review:
    summary: >-
      PAINT IBA from PTN001251485 in PTHR30352, grounded in E. coli PflA (P0A9N4) and NrdG
      (P0A9N8), both with established activase activity. The node asserts only the general
      activity (generation of a glycyl radical on a partner GRE), not a particular substrate
      GRE.
    action: ACCEPT
    reason: >-
      The node placement is sound. Every characterised member of the family is a GRE
      activase, and YjjW is inside the clade: it keeps the radical SAM cysteine triad and
      SAM-binding residues. Genome context fits strongly: yjjW overlaps the 3' end of the
      GRE gene yjjI on the same strand (file:ECOLI/pflC/pflC-bioinformatics/RESULTS.md), and
      the dedicated NCBIfam family TIGR04041 describes exactly this YjjW-YjjI pair. The term
      names no substrate, so it is the right level even though YjjI's reaction is unknown.
      YjjW's activase activity has not been directly shown, but the inference is as strong
      as sequence and context allow.
    supported_by:
    - reference_id: file:ECOLI/pflC/pflC-bioinformatics/RESULTS.md
      supporting_text: yjjW overlaps the 3' end of yjjI by 29 bp
    - reference_id: file:ECOLI/yjjW/yjjW-uniprot.txt
      supporting_text: /evidence="ECO:0000250|UniProtKB:P0A9N4"
    - reference_id: PMID:42361324
      supporting_text: radical is post-translationally installed by GRE activating enzymes
        (GRE-AEs), all of which are members of the radical S-adenosyl-L-methionine (RS) superfamily of enzymes.
