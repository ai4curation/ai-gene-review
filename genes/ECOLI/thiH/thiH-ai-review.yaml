suggested_questions:
- question: Is ThiH folded and active without ThiG, and does ThiG simply sequester the unstable
    dehydroglycine product (which hydrolyses to glyoxylate and ammonium) or also tune ThiH
    catalysis?
- question: What is the physiological reductant of the ThiH radical SAM cluster in E. coli
    (flavodoxin FldA with flavodoxin reductase, or another donor)?
- question: Should the ThiGH heterodimer be annotated to the thiazole synthase complex (GO:1902507)
    as well as the 2-iminoacetate synthase complex (GO:1902508), given that it carries both
    activities?
suggested_experiments:
- hypothesis: ThiG is required for ThiH folding or for coupling tyrosine cleavage to product
    channelling.
  description: Express ThiH alone and with catalytically inactive ThiG variants; compare cluster
    content, SAM cleavage, p-cresol formation and glyoxylate release (uncoupled dehydroglycine
    hydrolysis) under anaerobic conditions.
