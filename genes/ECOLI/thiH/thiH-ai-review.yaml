- term:
    id: GO:1904047
    label: S-adenosyl-L-methionine binding
  evidence_type: IDA
  original_reference_id: PMID:17403671
  qualifier: enables
  review:
    summary: ThiH binds SAM at its [4Fe-4S] cluster and cleaves it to 5'-deoxyadenosine and
      methionine, with one SAM consumed per tyrosine cleaved.
    action: NEW
    reason: >-
      GOA has no SAM-binding row for ThiH, although the RADICAL_SAM project treats GO:1904047 as a core
      cosubstrate-binding function of every active radical SAM enzyme. This is a molecular function that
      ThiH itself performs, so the participation test is met directly. Spectroscopy of ThiGH shows SAM
      binding to the cluster, and SAM is consumed stoichiometrically with tyrosine. Comparator check,
      against GOA rather than against this project's own proposals: GOA does annotate GO:1904047 to radical
      SAM enzymes in exactly this role, by UniRule -- ECOLI/queE (UR000100349), ECOLI/moaA and PSEPK/moaA
      (UR000101305), METEA/pqqE and PSEPK/pqqE (UR000098303). So the absence here is patchy UniRule coverage,
      which rules happen to carry the term, not a GO convention against annotating a radical SAM enzyme's
      own cosubstrate. That is also why those five genes have an existing row to ACCEPT or MODIFY while
      this one needs a NEW row.
    supported_by:
    - reference_id: PMID:17403671
      supporting_text: Spectroscopic studies with ThiGH strongly suggested that S-adenosylmethionine
        (AdoMet) bound to the [4Fe-4S] cluster, which became more susceptible to reduction to the +1
        state.
    - reference_id: PMID:17403671
      supporting_text: for each mole of thiazole-P formed, 1 eq of AdoMet and 1 eq of tyrosine were
        utilized, and 1 eq of 5'-deoxyadenosine was produced.
