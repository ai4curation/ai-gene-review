id: P30140
gene_symbol: thiH
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  ThiH is the radical S-adenosyl-L-methionine 2-iminoacetate synthase (tyrosine lyase) of
  the thiamine thiazole branch in Escherichia coli and other facultative and obligate
  anaerobes. Using a single [4Fe-4S] cluster that binds and reductively cleaves SAM to a
  5'-deoxyadenosyl radical, ThiH cleaves the Calpha-Cbeta bond of L-tyrosine to give
  2-iminoacetate (dehydroglycine) and 4-methylphenol (p-cresol). ThiH forms a tight
  heterodimeric complex with ThiG, the thiazole synthase, which condenses the dehydroglycine
  with 1-deoxy-D-xylulose 5-phosphate and the thiocarboxylated sulfur carrier ThiS (made by
  ThiF and the IscS/ThiI sulfur relay) to form the thiazole phosphate moiety of thiamine.
  ThiH supplies the C2-N3 unit of the thiazole; it does not itself carry out the thiazole
  cyclization. thiH mutants require the thiazole for thiamine synthesis. In aerobes such as
  Bacillus subtilis the oxygen-dependent glycine oxidase ThiO replaces ThiH.
