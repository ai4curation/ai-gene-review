  review:
    summary: The catalytic nitrilase domain occupies the periplasm above the membrane anchor.
    action: ACCEPT
    reason: Retain the experimentally supported periplasmic-domain localization. GO:0030288 names the
      region between the two membranes and does not require a freely soluble protein. The earlier fusion
