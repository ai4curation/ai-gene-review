references:
- id: GO_REF:0000002
  title: Gene Ontology annotation through association of InterPro records with GO terms
  findings:
  - statement: InterPro IPR004563 recognizes the Lnt family and supports membrane localization, but the row is less specific than plasma membrane for E. coli Lnt.
- id: GO_REF:0000033
  title: Annotation inferences using phylogenetic trees
  findings:
  - statement: PAINT places conserved inner-membrane localization and lipoprotein biosynthetic process on the Lnt family.
- id: GO_REF:0000120
  title: Combined Automated Annotation using Multiple IEA Methods
  findings:
  - statement: Combined UniProt, ARBA, UniRule, and InterPro evidence supports Lnt plasma-membrane localization, broad acyltransferase activity, and lipoprotein biosynthetic process.
- id: PMID:15513925
  title: Depletion of apolipoprotein N-acyltransferase causes mislocalization of outer membrane lipoproteins in Escherichia coli.
  findings:
  - statement: Conditional E. coli lnt depletion caused apoLpp and other outer-membrane lipoproteins to accumulate in the plasma membrane and mapped Lnt as a multi-pass membrane protein.
- id: PMID:15690043
  title: Interaction network containing conserved and essential protein complexes in Escherichia coli.
  findings:
  - statement: This affinity-tag interactome paper supports only a generic high-throughput physical interaction row for Lnt, not Lnt's catalytic activity.
- id: PMID:15919996
  title: Global topology analysis of the Escherichia coli inner membrane proteome.
  findings:
  - statement: This large-scale topology paper supports Lnt as part of the E. coli inner-membrane proteome.
- id: PMID:17309111
  title: Comparison of SDS- and methanol-assisted protein solubilization and digestion methods for Escherichia coli membrane proteome analysis by 2-D LC-MS/MS.
  findings:
  - statement: This membrane-fraction proteomics study is consistent with later Lnt-specific inner-membrane localization.
- id: PMID:2032623
  title: Identification and subcellular localization of apolipoprotein N-acyltransferase in Escherichia coli.
  findings:
  - statement: Gupta and Wu identified E. coli apolipoprotein N-acyltransferase activity, assayed conversion of apolipoprotein to mature lipoprotein, and localized the activity to inner-membrane-enriched fractions.
- id: PMID:21676878
  title: Kinetics and phospholipid specificity of apolipoprotein N-acyltransferase.
  findings:
  - statement: Hillmann et al. purified E. coli Lnt and showed in vitro thioester acyl-enzyme formation and N-acylation of apolipoprotein substrate.
- id: PMID:24561554
  title: The binary protein-protein interaction landscape of Escherichia coli.
  findings:
  - statement: This yeast-two-hybrid interactome paper supports only a generic high-throughput physical interaction row for Lnt, not Lnt's catalytic activity.
- id: PMID:28675161
  title: Structural insights into the mechanism of the membrane integral N-acyltransferase step in bacterial lipoprotein synthesis.
  findings:
  - statement: This structural study solved E. coli and Pseudomonas aeruginosa Lnt structures and placed the nitrilase-like catalytic domain on a membrane domain.
- id: PMID:28885614
  title: Crystal structure of E. coli apolipoprotein N-acyl transferase.
  findings:
  - statement: Lu et al. solved E. coli Lnt and characterized its transmembrane and periplasmic nitrilase-domain organization.
- id: file:ECOLI/lnt/lnt-uniprot.txt
  title: UniProtKB reviewed entry for E. coli lnt
  findings:
  - statement: UniProtKB summarizes Lnt as a multi-pass cell inner membrane EC 2.3.1.269 apolipoprotein N-acyltransferase in the lipoprotein biosynthesis N-acyl transfer pathway.
- id: file:ECOLI/lnt/lnt-deep-research-manual.md
  title: Manual deep research for E. coli lnt
  findings:
  - statement: Manual synthesis of the cached Lnt literature supports the terminal apolipoprotein N-acyltransferase reaction, inner-membrane localization, and removal of uninformative protein-binding rows.
