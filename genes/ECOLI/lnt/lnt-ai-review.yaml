proposed_new_terms:
- proposed_name: apolipoprotein N-acyltransferase activity
  proposed_definition: Catalysis of the phospholipid-dependent N-acylation of the N-terminal S-diacylglyceryl-L-cysteine
    of a bacterial lipoprotein.
  justification: 'GO:0016747 is the best valid current parent term, but it does not capture Lnt''s defined
    lipoprotein acceptor, phospholipid donor, or EC 2.3.1.269 reaction. GO:0016410 N-acyltransferase activity
    is obsolete in current GO and replaced by GO:0016747. GO:0140186 is not an alternative: its reaction
    requires an acyl-CoA donor and lysine-N6 acceptor, unlike Lnt.'
  proposed_parent:
    id: GO:0016747
    label: acyltransferase activity, transferring groups other than amino-acyl groups
  supported_by:
  - reference_id: PMID:21676878
    supporting_text: It then transfers the acyl chain to the α-amino group of the N-terminal diacylglyceryl-modified
      cysteine of apolipoprotein
suggested_questions:
- question: Should GO add an apolipoprotein N-acyltransferase activity term for Lnt/EC 2.3.1.269 now that
    GO:0016410 is obsolete?
  experts:
  - GO molecular function curators
- question: Which E. coli outer-membrane lipoproteins are most sensitive to partial loss of Lnt-mediated
    N-acylation?
suggested_experiments:
- description: Quantify diacylated and triacylated lipoprotein forms in conditional E. coli lnt depletion
    strains by envelope-fraction lipoproteomics.
  experiment_type: conditional depletion and lipoproteomics
- description: Reconstitute E. coli Lnt with a panel of native apolipoprotein acceptors and glycerophospholipid
    donors to measure acceptor and acyl-donor specificity.
  experiment_type: in vitro acyltransferase assay
