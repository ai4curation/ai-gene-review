references:
- id: GO_REF:0000002
  title: Gene Ontology annotation through association of InterPro records with GO terms
  findings:
  - statement: InterPro IPR004563 recognizes the Lnt family and supports membrane localization, but the
      row is less specific than plasma membrane for E. coli Lnt.
- id: GO_REF:0000033
  title: Annotation inferences using phylogenetic trees
  findings:
  - statement: PAINT places conserved inner-membrane localization and lipoprotein biosynthetic process
      on the Lnt family.
- id: GO_REF:0000120
  title: Combined Automated Annotation using Multiple IEA Methods
  findings:
  - statement: The source combines automatic mappings; independent Lnt topology, primary chemistry and
      specific family assignment support the reviewed claims. ARBA alone is not used as positive evidence.
- id: PMID:15513925
  title: Depletion of apolipoprotein N-acyltransferase causes mislocalization of outer membrane lipoproteins
    in Escherichia coli.
  findings:
  - statement: Conditional E. coli lnt depletion caused apoLpp and other outer-membrane lipoproteins to
      accumulate in the plasma membrane and mapped Lnt as a multi-pass membrane protein.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Protected cache is abstract-only; the reported experiment is retained where corroborated
      by enzyme-specific evidence. No uninspected supplementary target table or exact strain sequence
      is claimed.
