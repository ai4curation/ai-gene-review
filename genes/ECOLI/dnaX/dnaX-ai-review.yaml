  review:
    summary: Tau provides a functional tether between replicative polymerases and helicase.
    action: MODIFY
    reason: Domain-mapping experiments identify the tau-specific helicase-binding region and support coordinated
      polymerase–helicase tethering. Protein complex scaffold activity captures this architectural function
      more specifically than bare binding. The full-length tau role is not assigned to the shorter gamma
      product.
    proposed_replacement_terms:
    - &id007
      id: GO:0140378
      label: protein complex scaffold activity
    supported_by:
    - &id008
      reference_id: PMID:11078744
      supporting_text: both the leading and lagging strand polymerases are tethered to the DnaB helicase
        via dimeric tau.
