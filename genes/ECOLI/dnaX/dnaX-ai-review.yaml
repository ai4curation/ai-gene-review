id: P06710
gene_symbol: dnaX
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: The Escherichia coli dnaX gene produces full-length tau and a shorter gamma protein through
  programmed ribosomal frameshifting. Their shared N-terminal ATPase and oligomerization domains form
  the motor of the clamp-loading complex, which opens and deposits beta sliding clamps on primed DNA.
  Tau-specific C-terminal domains additionally connect polymerase cores and DnaB helicase, organizing
  coupled chromosome replication. Neither product is the DNA-polymerizing subunit.
alternative_products:
- name: tau
  id: P06710-1
- name: gamma
  id: P06710-2
  sequence_note: VSP_042848, VSP_042849
existing_annotations:
- term:
    id: GO:0003677
    label: DNA binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR008921
  review:
    summary: DnaX-containing clamp loaders directly engage primer-template DNA during clamp deposition.
    action: ACCEPT
    reason: DnaX-containing clamp loaders directly engage primer-template DNA during clamp deposition.
      The DNA-contacting ATPase architecture is consistent with the electronic domain annotation; no sequence-specific
      origin recognition is claimed.
    supported_by:
    - reference_id: PMID:9927437
- term:
    id: GO:0003887
    label: DNA-directed DNA polymerase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - InterPro:IPR012763
  - InterPro:IPR021029
  - InterPro:IPR022754
  - EC:2.7.7.7
  review:
    summary: The DNA-polymerizing reaction of the holoenzyme is performed by DnaE alpha.
    action: REMOVE
    reason: dnaX performs ATP-driven clamp-loader assembly and tau-mediated replisome organization; DNA
      polymerization is catalyzed by DnaE alpha. Holoenzyme nucleotide-incorporation assays and shared
      EC/Rhea labels do not establish that this individual subunit polymerizes DNA. Its actual molecular
      role is retained independently.
    supported_by: &id001
    - &id002
      reference_id: PMID:9927437
      supporting_text: The gamma complex uses ATP to open the beta clamp and assemble it onto DNA.
    - &id004
      reference_id: PMID:2997151
    - &id005
      reference_id: PMID:6393125
    source_defects:
    - defect_type: WRONG_TERM
      resource: UNIPROT
      requested_change: CHECK
      asserted_value: GO:0003887
      cause: SCOPE_OVER_REACH
      confidence: PROBABLE
      explanation: The GO_REF:0000120 mapping assigns holoenzyme catalytic chemistry to dnaX. The target's
        experimentally supported role is separately documented in this row; inspect the rule/signature
        or reaction mapping to distinguish individual catalytic subunits from accessory components.
      supported_by: *id001
