- term:
    id: GO:0009898
    label: cytoplasmic side of plasma membrane
  evidence_type: IC
  original_reference_id: PMID:769831
  qualifier: located_in
  review:
    summary: >-
      1976 partial purification concluded the O-methyltransferase acts at the inner
      surface of the cytoplasmic membrane.
    action: KEEP_AS_NON_CORE
    reason: >-
      The original inference was that the enzyme is not firmly membrane-bound but
      has membrane affinity. Later work supports a peripheral membrane interaction:
      UbiG binds phosphatidylglycerol- and cardiolipin-containing liposomes through
      a conserved insertion needed in vivo (PMID:26251450). The main site of
      catalysis is, however, the soluble cytoplasmic Ubi metabolon
      (PMID:30686758), which challenges a membrane-associated pathway. Peripheral
      association with the cytoplasmic face is plausible but not where the core
      activity is shown to occur, so the row is kept as non-core.
    supported_by:
    - reference_id: PMID:769831
      supporting_text: >-
        It is concluded that in vivo, the methyltransferase reaction probably occurs
        at the internal surface of the cytoplasmic membrane.
    - reference_id: PMID:26251450
      supporting_text: >-
        Escherichia coli UbiG binds specifically to liposomes containing PG
        (phosphatidylglycerol) or CL (cardiolipin, or diphosphatidylglycerol), two
        major lipid components of the E. coli plasma membrane
    - reference_id: PMID:30686758
      supporting_text: >-
        challenging the current thinking of a membrane-associated biosynthetic
        process
- term:
    id: GO:0010420
    label: polyprenyldihydroxybenzoate methyltransferase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR010233
  review:
    summary: InterPro2GO maps the UbiG/Coq3 family to the eukaryotic first O-methylation (of 3,4-dihydroxy-5-polyprenylbenzoate).
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      GO:0010420 is the methylation of a 3,4-dihydroxy-5-polyprenylbenzoate, the
      Coq3 substrate in mitochondria, where hydroxylation precedes
      decarboxylation. In E. coli UbiD decarboxylates first, so the physiological
      first O-methylation substrate is 2-polyprenyl-6-hydroxyphenol
      (GO:0102208). E. coli lysates did methylate the farnesylated eukaryotic
      analogue 3,4-dihydroxy-5-farnesylbenzoate in vitro, so the activity is
      real but has no physiological substrate in the bacterium. This is the same
      call as for P. putida UbiG and matches the PTHR43464 family review, which
      scopes GO:0010420 to the eukaryotic first O-methylation.
    supported_by:
    - reference_id: PMID:8703953
      supporting_text: >-
        UbiG methylates both the derivative of the eukaryotic intermediate,
        3,4-dihydroxy-5-farnesylbenzoate, as well as that of the E. coli
        intermediate, 2-farnesyl-6-hydroxyphenol.
    - reference_id: PMID:8703953
      supporting_text: >-
        In Escherichia coli, 2-polyprenyl-6-hydroxyphenol is the predicted
        substrate
- term:
    id: GO:0042538
    label: hyperosmotic salinity response
  evidence_type: IMP
  original_reference_id: PMID:24509820
  qualifier: acts_upstream_of_or_within
  review:
    summary: Ubiquinone-8 deficient mutants are osmosensitive; Q8 stabilises the membrane under salt stress.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The phenotype reflects a property of the end product: Q8 accumulates under
      salt stress and mechanically stabilises the membrane, and nonrespiratory Q8
      analogues rescue tolerance. UbiG contributes only by making Q8; it performs
      no step of the stress response itself, so the process term is a pleiotropic
      downstream effect of the biosynthetic function.
    supported_by:
    - reference_id: PMID:24509820
      supporting_text: >-
        We then demonstrated that Q8 is necessary for acute and sustained
        osmotic-stress tolerance using Q8 mutants and tolerance rescue through
        feeding nonrespiratory Q8 analogs.
