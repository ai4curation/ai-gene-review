id: P17993
gene_symbol: ubiG
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  UbiG is the S-adenosyl-L-methionine-dependent O-methyltransferase of
  ubiquinone-8 biosynthesis in Escherichia coli. A single class I SAM
  methyltransferase performs both O-methylations of the aromatic ring: the
  early methylation of 2-octaprenyl-6-hydroxyphenol (3-octaprenylbenzene-1,2-diol)
  to 2-octaprenyl-6-methoxyphenol, after UbiI-dependent C5 hydroxylation, and
  the final methylation of 3-demethylubiquinol-8 to ubiquinol-8, after the UbiF
  hydroxylation. UbiG is one of the seven proteins (UbiE, UbiF, UbiG, UbiH,
  UbiI, UbiJ, UbiK) of the soluble Ubi metabolon that carries out the last six
  reactions of the pathway in the cytoplasm. The protein also binds
  phosphatidylglycerol- and cardiolipin-containing membranes through a conserved
  insertion between strand beta5 and helix alpha10, which is needed for
  function in vivo. Purified UbiG also methylates the eukaryotic intermediate
  analogue 3,4-dihydroxy-5-farnesylbenzoate in vitro, reflecting its homology to
  mitochondrial Coq3, but this substrate does not arise in the bacterial
  pathway, where decarboxylation precedes the first hydroxylation.
