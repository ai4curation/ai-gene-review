id: P0AF28
gene_symbol: narL
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  NarL is the cytoplasmic response regulator of the nitrate/nitrite-responsive
  NarX/NarQ-NarL two-component system of Escherichia coli. It consists of an
  N-terminal CheY-like receiver domain that is phosphorylated on Asp59 by the
  membrane sensor kinases NarX or NarQ (and dephosphorylated chiefly through the
  phosphatase activity of NarX), joined by a linker to a C-terminal LuxR/FixJ-type
  helix-turn-helix DNA-binding domain. In unphosphorylated NarL the receiver
  domain packs against the output domain and occludes its DNA-recognition
  surface; phosphorylation releases the output domain, which dimerizes on DNA and
  binds TACYYMT heptamer sequences, preferentially arranged as 7-2-7 inverted
  repeats but also in other arrangements. Phospho-NarL is a dual-function
  transcription factor that, during anaerobic growth in the presence of nitrate
  or nitrite and often together with FNR, activates operons for nitrate
  respiration such as narGHJI (nitrate reductase), fdnGHI (formate
  dehydrogenase-N) and nirBDC (NADH-nitrite reductase), and represses operons for
  alternative anaerobic respiratory pathways such as frdABCD (fumarate
  reductase), dmsABC (DMSO/TMAO reductase) and ynfEFGHI, thereby directing
  electron flow to nitrate as the preferred anaerobic terminal acceptor.
