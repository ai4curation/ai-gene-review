suggested_questions:
- question: >-
    What structural features allow NarL, but not its paralog NarP, to recognise
    heptamers outside the canonical 7-2-7 arrangement, and how does this shape the
    NarL-specific regulon?
- question: >-
    Is repression by NarL at promoters such as ynfE generally achieved by trapping
    FNR-RNA polymerase complexes rather than occluding RNA polymerase binding?
suggested_experiments:
- description: >-
    Genome-wide ChIP-seq of NarL in wild-type, narX narQ, and NarL D59N backgrounds
    under anaerobic growth with nitrate or nitrite, combined with RNA-seq, to define
    the phosphorylation-dependent direct regulon and separate activation from
    repression targets.
  experiment_type: ChIP-seq / RNA-seq
- description: >-
    Single-molecule or in vitro transcription assays at ynfE and dmsA promoters
    with phospho-NarL, FNR and RNA polymerase to determine the step of initiation
    blocked by NarL.
  experiment_type: in vitro transcription
