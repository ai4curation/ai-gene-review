- term:
    id: GO:0000156
    label: phosphorelay response regulator activity
  evidence_type: IDA
  original_reference_id: PMID:8051011
  qualifier: enables
  review:
    summary: >-
      NarL accepts phosphoryl groups from the autophosphorylated cytoplasmic
      transmitter domains of NarX and NarQ in vitro, is dephosphorylated by
      NarX, and autophosphorylates with acetyl phosphate; mutation of the
      conserved receiver phosphorylation site Asp59 to Asn gives a null allele.
    action: NEW
    reason: >-
      The defining molecular activity of NarL's receiver domain is absent from
      GOA. Direct biochemical evidence (phosphotransfer from NarX and NarQ to
      purified NarL in two independent studies) and genetic evidence that Asp59
      is essential and that NarL requires phosphorylation for activation
      establish phosphorelay response regulator activity. NarL does the work of
      this step (it is the phosphoacceptor whose phosphorylation switches its own
      output), so this is not a substrate-only relationship; the same term is
      carried by other characterised response regulators (e.g. KdpE, CheY) in
      this repository.
    supported_by:
    - reference_id: PMID:8051011
      supporting_text: Each protein transferred its phosphoryl group to purified NarL protein
    - reference_id: PMID:8051011
      supporting_text: In addition, NarL was autophosphorylated with acetyl phosphate but not with ATP as a substrate.
    - reference_id: PMID:8473280
      supporting_text: Incubation of the labeled NarX with purified NarL resulted in the transient phosphorylation of NarL.
    - reference_id: PMID:2066339
      supporting_text: This change, narL502(D59N), was a recessive null allele, which is consistent with the hypothesis that NarL requires phosphorylation for activation.
