    summary: >-
      InterPro receiver-domain mapping placing NarL in a two-component phosphorelay.
      NarL is the response regulator of the NarX/NarQ-NarL system; it is
      phosphorylated by the cytoplasmic transmitter domains of NarX and NarQ and
