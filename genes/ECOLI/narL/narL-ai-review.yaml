core_functions:
- description: >-
    Receiver-domain phosphoacceptor of the NarX/NarQ-NarL two-component system:
    Asp59 is phosphorylated by the nitrate/nitrite sensor kinases NarX and NarQ
    (and dephosphorylated via NarX phosphatase activity), switching NarL from an
    autoinhibited state to its DNA-binding form.
