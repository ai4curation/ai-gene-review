core_functions:
- description: Five-helix membrane subunit of proton-pumping NDH-1 (complex I) in
    the proximal membrane arm. With NuoK it forms the second half-channel of the
    E-channel proton pathway and borders the N/K/J/A proton channel; conserved
    residues (Val65) are required for energy-coupled electron transfer and proton
    translocation, so NuoJ contributes to the NADH:ubiquinone oxidoreductase activity
    of the assembled complex and to proton transport across the cytoplasmic membrane.
  contributes_to_molecular_function:
    id: GO:0008137
    label: NADH dehydrogenase (ubiquinone) activity
  directly_involved_in:
  - id: GO:0022904
    label: respiratory electron transport chain
  - id: GO:1902600
    label: proton transmembrane transport
  in_complex:
    id: GO:0045271
    label: respiratory chain complex I
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:15736965
    supporting_text: mutants of the Val-65 residue that is located in the most conserved
      transmembrane segment significantly lost the coupled electron-transfer activities
      and exhibited diminished membrane potential and proton translocation
  - reference_id: PMID:23417064
    supporting_text: Thus, the first half-channel formed by Nqo8 is linked to the second
      half-channel in Nqo10/11
suggested_questions:
- question: Is the rotation of the cytoplasmic half of NuoJ TMH3, seen in mammalian
    ND6 between active and deactive states, also part of the catalytic cycle of
    bacterial NDH-1, and does it gate the E-channel?
suggested_experiments:
- description: Cross-link or cysteine-accessibility analysis of NuoJ TMH3 residues
    in purified E. coli complex I under turnover versus resting conditions, combined
    with proton-pumping assays in proteoliposomes, to test whether TMH3 movement
    is required for coupling.
