  label: Escherichia coli K-12
description: >-
  NuoJ (NADH-quinone oxidoreductase subunit J; ND6/Nqo10 homologue) is a
  184-residue, five-transmembrane-helix integral cytoplasmic-membrane subunit
  of the proton-pumping NADH:quinone oxidoreductase NDH-1 (respiratory complex
  I). It lies in the proximal part of the membrane arm between NuoH and the
  antiporter-like subunit NuoN, together with NuoK forming the second
  half-channel of the glutamate-rich E-channel proton pathway that links the
  quinone site to the membrane, and it borders the putative proton channel at
  the NuoN/NuoK/NuoJ/NuoA interface. Its third transmembrane helix contains a
  conformationally mobile segment implicated in coupling. NuoJ has no redox
  cofactor and is not needed for assembly of NDH-1 per se, but conserved
  residues such as Val65 in its most conserved transmembrane segment are
  required for energy-coupled NADH:quinone oxidoreduction, membrane-potential
  generation and proton translocation by the complex.
