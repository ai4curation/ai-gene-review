suggested_questions:
- question: >-
    Is the positive cooperativity of E. coli KPHMT toward ketopantoate and tetrahydrofolate used physiologically
    to tune flux into pantothenate together with feedback inhibition by pantoate, pantothenate and CoA?
suggested_experiments:
- description: >-
    Measure in vivo flux through PanB in strains carrying feedback-insensitive PanB variants and quantify
    intracellular pantothenate and CoA pools.
  experiment_type: metabolic flux analysis
