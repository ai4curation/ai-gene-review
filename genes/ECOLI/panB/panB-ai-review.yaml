  review:
    summary: >-
      Mg2+ is the required metal cofactor of PanB; the binding term is true but supports rather than defines
      the catalytic function.
    action: KEEP_AS_NON_CORE
    reason: >-
      Purified E. coli KPHMT requires Mg2+ for activity, with Mn2+, Co2+ and Zn2+ progressively less active.
      The IBA from PAINT node PTN000466854 agrees with the direct biochemistry. Metal binding is a cofactor
      property of the hydroxymethyltransferase rather than a separate role.
    supported_by: &id001
