id: P31057
gene_symbol: panB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  panB (b0134) encodes ketopantoate hydroxymethyltransferase (3-methyl-2-oxobutanoate hydroxymethyltransferase,
  KPHMT), the first committed enzyme of pantothenate biosynthesis in Escherichia coli. The Mg2+-dependent
  class II aldolase-type enzyme is a soluble cytosolic homodecamer that reversibly transfers a hydroxymethyl
  group from 5,10-methylenetetrahydrofolate to 3-methyl-2-oxobutanoate (alpha-ketoisovalerate), forming
  2-dehydropantoate (ketopantoate), which PanE reduces to pantoate. panB mutants are pantothenate auxotrophs
  that lack this activity, and the enzyme is feedback-inhibited by pantoate, pantothenate and CoA.
