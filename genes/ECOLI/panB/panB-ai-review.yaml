- term:
    id: GO:0016020
    label: membrane
  evidence_type: HDA
  original_reference_id: PMID:16858726
  qualifier: located_in
  review:
    summary: >-
      The membrane row comes from a complexome survey of combined cytosolic and membrane fractions; PanB
      is a soluble cytosolic enzyme.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      PanB has no transmembrane segment or signal peptide and is repeatedly recovered in the soluble cytosolic
      fraction. The blue-native complexome study separated both cytosolic and membrane complexes, and
      the cached abstract does not show a PanB-specific membrane fraction, so this high-throughput membrane
      assignment most likely reflects carry-over of the abundant homodecamer rather than a membrane location.
    supported_by:
    - reference_id: PMID:16858726
      supporting_text: the cytosolic and membrane protein complexes of Escherichia coli were separated
    - reference_id: PMID:18304323
      supporting_text: we identified 1103 proteins from the cytosolic fraction of the Escherichia coli
- term:
    id: GO:0042802
    label: identical protein binding
  evidence_type: IDA
  original_reference_id: PMID:6463
  qualifier: enables
  review:
    summary: >-
      PanB self-associates into a homodecamer; identical protein binding is true but structural rather
      than the catalytic function.
    action: KEEP_AS_NON_CORE
    reason: >-
      Sedimentation and subunit analysis show ten identical subunits in the native enzyme. The homo-oligomeric
      assembly is a property of the enzyme, not its biological activity.
    supported_by:
    - reference_id: PMID:6463
      supporting_text: both procedures indicate the presence of 10 identical subunits
