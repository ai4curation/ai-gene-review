- term:
    id: GO:0003864
    label: 3-methyl-2-oxobutanoate hydroxymethyltransferase activity
  evidence_type: EXP
  original_reference_id: PMID:6463
  qualifier: enables
  review:
    summary: >-
      Ketopantoate hydroxymethyltransferase is the core activity of E. coli PanB, measured directly on
      the purified enzyme.
    action: ACCEPT
    reason: >-
      Teller, Powers and Snell purified KPHMT 2400-fold from E. coli K-12 and showed it is absent from
      a ketopantoate auxotroph; Powers and Snell characterized its reversible reaction and kinetics. The
      IBA (PAINT node PTN000466854) and the IEA (InterPro/HAMAP UniRule) rows describe the same activity
      and are consistent with this direct evidence.
    supported_by: &id002
    - reference_id: PMID:776976
      supporting_text: It thus appears to be the enzyme responsible for catalysis of ketopantoate formation
        in vivo.
    - reference_id: PMID:6463
      supporting_text: >-
        This enzyme catalyzes the reversible synthesis of ketopantoate (Reaction 1), an essential precursor
        of pantothenic acid.
    - reference_id: file:ECOLI/panB/panB-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: >-
        Catalyzes the reversible reaction in which hydroxymethyl group from 5,10-methylenetetrahydrofolate
        is transferred onto alpha-ketoisovalerate to form ketopantoate.
