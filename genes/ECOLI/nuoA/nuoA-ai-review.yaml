id: P0AFC3
gene_symbol: nuoA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  NuoA (NADH-quinone oxidoreductase subunit A; ND3/Nqo7 homologue) is a small
  (147-residue) integral cytoplasmic-membrane subunit of the proton-pumping
  NADH:quinone oxidoreductase NDH-1 (respiratory complex I), encoded first in
  the 14-gene nuo operon. It has three transmembrane helices, with its C
  terminus in the cytoplasm, and sits at the junction between the peripheral
  (NADH-oxidising, quinone-reducing) arm and the membrane arm. Its conserved
  first cytoplasmic loop wraps around NuoH and plugs a crevice between NuoB,
  NuoD and NuoH near the quinone-binding chamber, stabilising the arm interface,
  and NuoA lines the fourth putative proton-translocation channel together with
  NuoN, NuoK and NuoJ. NuoA has no catalytic site of its own; it is required for
  assembly of a functional complex I, which couples electron transfer from NADH
  to ubiquinone-8 or menaquinone-8 with translocation of four protons across
  the membrane, generating proton-motive force in the respiratory chain.
