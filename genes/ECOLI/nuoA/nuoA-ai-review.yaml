core_functions:
- description: Small three-helix membrane subunit of proton-pumping NDH-1 (complex
    I) at the junction of the peripheral and membrane arms. It contributes to the
    NADH:ubiquinone oxidoreductase activity of the assembled complex by stabilising
    the quinone-site interface (its conserved TMH1-TMH2 loop plugs the NuoB/NuoD/NuoH
    crevice) and by lining the fourth proton-translocation pathway with NuoN, NuoK
    and NuoJ, so that electron transfer from NADH to quinone is coupled to proton
    translocation across the cytoplasmic membrane.
  contributes_to_molecular_function:
    id: GO:0008137
    label: NADH dehydrogenase (ubiquinone) activity
  directly_involved_in:
  - id: GO:0022904
    label: respiratory electron transport chain
  - id: GO:1902600
    label: proton transmembrane transport
  in_complex:
    id: GO:0045271
    label: respiratory chain complex I
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:34308841
    supporting_text: The conserved region of the NuoA TMH1-TMH2 loop forms a plug,
      which fills a crevice between the subunits NuoD, NuoB, and NuoH.
  - reference_id: PMID:21822288
    supporting_text: The fourth probable proton-translocation channel is at the interface
      of subunits N, K, J and A.
  - reference_id: PMID:22063474
    supporting_text: Thus, all nuo-genes are required either for the assembly or the
      stability of a functional E. coli complex I.
suggested_questions:
- question: Does NuoA contribute ionisable residues directly to proton translocation
    through the N/K/J/A channel, or is its role purely structural (stabilising the
    peripheral-arm/membrane-arm interface and the quinone chamber)?
- question: Does the NuoA TMH1-TMH2 loop plug participate in the conformational
    switching between coupled and uncoupled (open/closed) states of the quinone site?
suggested_experiments:
- description: Site-directed mutagenesis of conserved NuoA loop and transmembrane
    residues in the chromosomal nuo operon (as done for NuoJ and NuoK), followed by
    measurement of deamino-NADH:quinone activity, proton pumping in inverted vesicles
    and complex assembly by BN-PAGE, to separate structural from coupling roles.
