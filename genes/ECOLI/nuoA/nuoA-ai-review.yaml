  review:
    summary: UniRule-derived mapping to the non-electrogenic NADH:quinone reductase
      activity.
    action: REMOVE
    reason: GO:0050136 is defined by the non-pumping reaction NADH + H+ + a quinone
      = NAD+ + a quinol and is labelled non-electrogenic (the NDH-2 type activity).
      NuoA is a membrane subunit of the electrogenic, proton-translocating NDH-1,
      whose reaction (and the UniProt catalytic activity, RHEA:57888) includes vectorial
      proton translocation; E. coli explicitly separates the two enzymes, NDH-1 generating
      a proton gradient and NDH-2 not. The mapping is demonstrably wrong for this
      complex; GO:0008137 is the correct activity.
    supported_by:
