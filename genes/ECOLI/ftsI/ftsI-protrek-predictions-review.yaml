id: P0AD68
gene_symbol: ftsI
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli (strain K12)
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for FtsI (PBP3), the septal D,D-transpeptidase. The model places
  the protein in septal peptidoglycan synthesis and the divisome correctly, but its top call names
  the wrong transpeptidation chemistry and its second inverts the sign of FtsI's role in division.
  Rank 3 is a correct and novel complex assignment. The free-text channel states the function exactly
  ('Catalyzes cross-linking of the peptidoglycan cell wall at the division septum... Binds penicillin').
  Assessment: 1 correct novel (COR), 1 paralog incorrect (PLI), 1 nonparalog incorrect (NPI).
source_documents:
- projects/PROTREK_EVALUATION/argo139_protrek_hits.tsv
- genes/ECOLI/ftsI/ftsI-uniprot.txt
- genes/ECOLI/ftsI/ftsI-goa.tsv
predictions:
- source_method: ProTrek
  source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
  source_reference_id: PMID:41039041
  predicted_term:
    id: GO:0018104
    label: peptidoglycan-protein cross-linking
  predicted_term_type: GO_BP
  review:
    assessment: PLI
    confidence_score: 0
    error_type: PARALOG_OVERANNOTATION
    summary: >-
      Top-ranked hit (score 15.55). Peptidoglycan-protein cross-linking is the L,D-transpeptidase
      reaction that attaches Braun's lipoprotein to the peptidoglycan, carried out by the Ldt enzymes.
      FtsI is a class B monofunctional D,D-transpeptidase making 4-3 peptide cross-links between glycan
      strands; GOA carries no L,D-transpeptidase annotation for it, unlike MrdA. Same substrate polymer,
      different chemistry and different enzyme family. Scored MORE_SPECIFIC by closure, so an ontology-only
      score would credit it.
    supported_by:
    - reference_id: file:ECOLI/ftsI/ftsI-uniprot.txt
      supporting_text: >-
        Belongs to the transpeptidase family. FtsI subfamily
- source_method: ProTrek
  source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
  source_reference_id: PMID:41039041
  predicted_term:
    id: GO:2000245
    label: negative regulation of FtsZ-dependent cytokinesis
  predicted_term_type: GO_BP
  review:
    assessment: NPI
    confidence_score: 0
    error_type: PARALOG_OVERANNOTATION
    summary: >-
      Rank 2 (score 15.25). FtsI is recruited to the Z ring and is required for septal cross-linking;
      it does not negatively regulate FtsZ-dependent cytokinesis. Negative regulators of FtsZ in E.
      coli are MinC, SlmA and SulA. The retrieval has found the division-machinery neighbourhood and
      taken a term from the inhibitor side of it - the same directional error made for COP1 and Git.
    supported_by:
    - reference_id: file:ECOLI/ftsI/ftsI-uniprot.txt
      supporting_text: >-
        Peptidoglycan D,D-transpeptidase FtsI
- source_method: ProTrek
  source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
  source_reference_id: PMID:41039041
  predicted_term:
    id: GO:1990586
    label: divisome complex
  predicted_term_type: GO_CC
  review:
    assessment: COR
    confidence_score: 2
    summary: >-
      Rank 3 (score 14.96) and absent from GOA, which places FtsI at the cell division site but records
      no complex. FtsI is a core divisome component, forming a subcomplex with FtsW and interacting
      with FtsQ, FtsL, FtsN and PBP1b as this review describes. Correct, specific and novel; rank
      4 (FtsQBL complex) narrows further to a complex FtsI associates with rather than belongs to.
    supported_by:
    - reference_id: file:ECOLI/ftsI/ftsI-uniprot.txt
      supporting_text: >-
        Peptidoglycan D,D-transpeptidase FtsI
