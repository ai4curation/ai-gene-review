    evidence_type: IEA
    original_reference_id: GO_REF:0000043
    qualifier: involved_in
    review:
      summary: FtsI septal synthesis contributes directly to the shape of new poles.
      action: ACCEPT
      reason: The GO definition is modulation of cell surface configuration, not exclusively
        rod-shape maintenance during elongation. PMID:3049550 connects an FtsI substitution and
        partial PBP3 inhibition to pointed polar caps and altered local surface synthesis. Combined
        with its direct septal cross-linking function, this supports morphogenesis; the earlier
        argument that only PBP2 controls any cell shape was too restrictive.
      supported_by:
