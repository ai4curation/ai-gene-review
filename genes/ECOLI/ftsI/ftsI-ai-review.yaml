id: P0AD68
gene_symbol: ftsI
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: FtsI (PBP3) is the inner-membrane-anchored class-B penicillin-binding protein that
  cross-links septal peptidoglycan in Escherichia coli. Its catalytic domain faces the periplasm and
  forms D,D peptide cross-links while its partner FtsW polymerizes glycan strands. This coordinated
  synthesis builds the division septum and shapes new cell poles. Beta-lactam antibiotics acylate
  its active site and inhibit division. Purified anchor-free FtsI also hydrolyzes synthetic
  thioesters and transfers their acyl groups to amino acceptors; these model-substrate reactions are
  distinct from its physiological septal cross-linking role.
