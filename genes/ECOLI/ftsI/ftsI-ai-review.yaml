      label: carboxypeptidase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000043
    qualifier: enables
    review:
      summary: FtsI performs D,D-transpeptidation; the hydrolytic peptidase mapping does not express
        that net reaction.
      action: MODIFY
      reason: This is a reaction-class correction, not an is_a refinement. GO:0009002 specifies
        water-dependent hydrolysis of an acetylated Lys-D-Ala-D-Ala substrate; carboxypeptidase and
        peptidase parents also require hydrolysis. The retrieved full PMID:9324244 postprint reports
        no detectable activity of anchor-free G57-V577 PBP3 on that peptide, but demonstrates
        synthetic-thioester hydrolysis and aminolysis. The latter does not prove peptide-bond
        hydrolysis. Cellular cross-linking evidence supports D,D acyl transfer to an amino acceptor
        (PMID:3531167). Replace the historical EC-derived hydrolytic proxy with the existing
        proposed D,D-transpeptidase term, without claiming a universal absence of all hydrolytic
        side reactions or treating the truncated assay as intact native FtsI.
      supported_by:
