  - term:
      id: GO:0008955
      label: peptidoglycan glycosyltransferase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    review:
      summary: FtsI is the peptide-cross-linking component of the FtsWI pair, not its glycan
        polymerase.
      action: REMOVE
      reason: The 1981 PMID:7030331 paper historically assigned both activities; its full text could
        not be obtained here, so no contaminant or misidentified gene is alleged. The independently
        retrieved primary PMID:9324244 tested radiolabeled lipid II in two protocols with active
        PBP1b controls and detected no polymerization by folded anchor-free PBP3; the construct
        limitation is explicit. The followup synthesis PMID:9614966, the distinct class-B domain
        architecture, the curated UniProt caution and the later assignment of polymerization to FtsW
        converge against intrinsic FtsI glycosyltransferase activity. PMID:6450748 measured septal
        murein incorporation after PBP3 inhibition, which does not distinguish glycan polymerization
        from cross-linking. FtsI-dependent activation or coordination of a partner polymerase is not
        possession of that partner's catalytic activity. This rejects the common function claim
        consistently across IEA, IMP and IDA rather than rejecting an assay merely because it is
        old.
      supported_by:
        - &id007
          reference_id: PMID:9614966
          supporting_text: It has no detectable transglycosylase activity with lipid II as
            substrate.
        - *id003
        - reference_id: file:ECOLI/ftsI/ftsI-source-analysis/catalytic-specificity.md
      source_defects:
        - defect_type: WRONG_TERM
          resource: INTERPRO
          record: InterPro:IPR037532
          slot: GO term mapping
          requested_change: DELETE_VALUE
          asserted_value: GO:0008955
          cause: SCOPE_OVER_REACH
          confidence: CONFIRMED
          explanation: The frozen GOA row is assigned by InterPro through IPR037532 (Peptidoglycan
            D,D-transpeptidase FtsI), GO_REF:0000002. This class-B PBP mapping assigns the
            glycan-polymerase chemistry performed by its FtsW partner. Primary biochemical
            reassessment and domain architecture support peptide transpeptidation rather than
            intrinsic FtsI glycosyltransferase activity. Correct this specific mapping; no blanket
            defect is asserted for all penicillin-binding proteins or for historical experimental
            records.
          supported_by:
            - reference_id: PMID:9614966
              supporting_text: It has no detectable transglycosylase activity with lipid II as
