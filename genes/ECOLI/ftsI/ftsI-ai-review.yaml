core_functions:
  - description: FtsI cross-links peptidoglycan peptide stems at the division septum through
      serine-dependent D,D-transpeptidation, paired with FtsW glycan polymerization. E. coli
      cellular evidence supports septal cross-linking; soluble G57-V577 PBP3 aminolysis assays
      support the acyl-transfer chemistry but do not reconstitute the complete natural septal
      reaction. The catalytic region acts on the periplasmic face of the inner membrane.
    proposed_molecular_function: serine-type peptidoglycan D,D-transpeptidase activity
    directly_involved_in:
      - id: GO:0009252
        label: peptidoglycan biosynthetic process
      - id: GO:0000917
        label: division septum assembly
      - id: GO:0043093
        label: FtsZ-dependent cytokinesis
    locations:
      - id: GO:0005886
        label: plasma membrane
      - id: GO:0032153
        label: cell division site
    supported_by:
      - *id003
      - *id002
      - *id006
      - reference_id: PMID:20847002
        supporting_text: These proteins are able to form a discrete complex independently of the
          other cell-division proteins.
    in_complex:
      id: GO:1990586
      label: divisome complex
proposed_new_terms:
  - proposed_name: serine-type peptidoglycan D,D-transpeptidase activity
    proposed_definition: >-
      Catalysis of peptide crosslink formation in peptidoglycan by a serine-dependent D,D-transpeptidase:
      transfer of the donor D-Ala4 acyl group from a pentapeptide stem to an amino acceptor on another
      stem or its peptide bridge, with release of terminal D-Ala5. This forms a D,D (4-to-3) crosslink
      rather than an L,D (3-to-3) crosslink; the acceptor amino group and bridge depend on the organism.
    justification: >-
      The current GO search contains peptidoglycan L,D-transpeptidase activity but no exact D,D-transpeptidase
      term. GO:0009002 specifies net hydrolysis with water, not merely the first half of a cross-linking
      reaction. A peptide amino acceptor instead resolves the FtsI acyl-enzyme to form a D,D cross-link.
      The synthetic-thioester assays support transfer chemistry, while cellular septal peptidoglycan analysis
      supports the physiological role; these evidence levels are distinguished. Round-1 QuickGO search
      found no exact D,D-specific peptidoglycan transpeptidase term; GO:0016755 is the verified aminoacyl-transfer
      parent. The shared definition does not standardize the organism-specific acceptor chemistry or upgrade
      inferential linkage evidence.
    proposed_parent:
      id: GO:0016755
      label: aminoacyltransferase activity
    supported_by:
      - reference_id: PMID:3531167
        supporting_text: The peptidoglycan transpeptidase activity of penicillin-binding protein 3
          appears to use either nascent or exogenously added UDP-N-acetylmuramyl tripeptide-derived
          substrates as acceptors
aliases:
  - PBP3
  - PbpB
  - b0084
  - JW0082
suggested_questions:
  - question: Which E. coli FtsI interactions directly activate FtsW polymerase independently of
      transpeptidation, and under what FtsQLB/FtsN state? Ortholog activation and complex formation
      alone do not establish every target-specific activation mechanism.
