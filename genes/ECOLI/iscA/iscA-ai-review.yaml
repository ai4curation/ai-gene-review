- description: >-
    High-affinity iron binding through Cys35/Cys99/Cys101 and donation of
    iron for IscS-dependent cluster assembly on IscU, particularly when free
    iron is limiting and under aerobic growth.
  molecular_function:
    id: GO:0034986
    label: iron chaperone activity
  directly_involved_in:
  - id: GO:0016226
    label: iron-sulfur cluster assembly
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:15247288
    supporting_text: >-
      Remarkably, IscA, an iron-sulfur cluster assembly
      protein with an iron association constant of 3.0 x 10(19) m(-1), is able to
      overcome the iron limitation due to sodium citrate and deliver iron for the
      IscS-mediated iron-sulfur cluster assembly in IscU.
  - reference_id: PMID:20942799
    supporting_text: >-
      In the present paper we report the in vivo evidence
      demonstrating the iron-binding activity of IscA in Escherichia coli cells.
proposed_new_terms: []
suggested_questions:
- question: >-
    Under physiological conditions does IscA act chiefly as an iron donor to
    IscU or as an A-type carrier of preformed clusters (from IscU) to
    [4Fe-4S] acceptor proteins, and does the answer change between aerobic and
    anaerobic growth?
- question: >-
    Which acceptor proteins depend specifically on IscA rather than on its
    paralogue SufA or the A-type carrier ErpA?
suggested_experiments:
- description: >-
    Compare Fe-S enzyme activities and holo-protein levels in iscA, sufA, erpA
    single and combined mutants under aerobic and anaerobic growth, with
    complementation by Cys99Ser/Cys101Ser variants, to separate iron-donor
    from cluster-carrier roles.
  experiment_type: genetic epistasis and enzyme activity assays
- description: >-
    Whole-cell Mossbauer or EPR of IscA purified rapidly from cells grown
    aerobically versus anaerobically to determine whether it carries
    mononuclear iron, [2Fe-2S] or [4Fe-4S] clusters in vivo.
  experiment_type: spectroscopy of in vivo isolated protein
