  review:
    summary: >-
      IscA binds iron with very high affinity via Cys35/Cys99/Cys101, in vitro
      and in vivo.
    action: ACCEPT
    reason: >-
      Iron binding is a defining experimentally established property of E.
      coli IscA and the basis of its iron-chaperone role. The generic term is
      kept at this level rather than refined, because the bound iron is
      ferric in aerobically grown cells (oxygen oxidises bound ferrous iron),
      while the in vitro loading experiments used ferrous iron.
    supported_by:
    - reference_id: PMID:14720122
      supporting_text: >-
        Here we show that IscA is an iron binding protein with an apparent iron
        association constant of 3.0x10(19)
        M(-1)
    - reference_id: PMID:20942799
      supporting_text: >-
        Additional studies indicate that oxygen in the medium promotes the iron
        binding in IscA by oxidizing ferrous iron to ferric iron in the iron
        binding site of IscA
