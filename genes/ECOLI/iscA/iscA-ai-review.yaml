id: P0AAC8
gene_symbol: iscA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  IscA is a small (107-residue) cytosolic A-type iron-sulfur cluster carrier
  protein of the HesB/IscA family, encoded in the E. coli
  iscRSUA-hscBA-fdx-iscX operon. It forms dimers and tetramers whose three
  invariant cysteines (Cys35, Cys99, Cys101) bind either mononuclear iron or a
  [2Fe-2S] cluster bridged between subunits. Purified IscA binds iron with very
  high affinity and can donate it for IscS-dependent cluster assembly on the
  scaffold IscU when free iron is limiting; in cells it is iron-loaded under
  aerobic growth, where oxygen promotes iron binding. IscA can also assemble a
  [2Fe-2S] cluster and transfer it, over multiple turnovers, to apo-ferredoxin,
  with which holo-IscA forms a specific complex. Genetically IscA is
  partially redundant with its SufA paralogue (and the A-type carrier ErpA);
  the iscA/sufA pair is needed for Fe-S cluster assembly under aerobic but not
  anaerobic growth. Copper binds IscA and blocks cluster biogenesis under
  anaerobic copper stress.
