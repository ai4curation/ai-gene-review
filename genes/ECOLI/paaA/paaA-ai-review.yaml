id: P76077
gene_symbol: paaA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  PaaA is the catalytic alpha subunit of the soluble multicomponent
  phenylacetyl-CoA 1,2-epoxidase (PaaABCE) of Escherichia coli, the ring-activating
  enzyme of the aerobic "hybrid" phenylacetate catabolic pathway
  encoded by the paa operon. PaaA has a ferritin-like four-helix-bundle
  monooxygenase fold distantly related to the alpha (hydroxylase) subunits of
  bacterial di-iron multicomponent monooxygenases. It forms a stable (PaaAC)2
  heterotetramer with the structural beta subunit PaaC; within this core,
  PaaA alone binds phenylacetyl-CoA, with the CoA moiety threaded through a
  long tunnel and the aromatic ring positioned over the predicted di-iron
  site, where one atom of O2 is inserted to form ring 1,2-epoxyphenylacetyl-CoA.
  Activity additionally requires the small subunit PaaB and the NADPH-dependent
  FAD/[2Fe-2S] reductase PaaE. The epoxide is subsequently
  isomerized by PaaG and cleaved hydrolytically by PaaZ, and the pathway
  yields acetyl-CoA and succinyl-CoA.
