core_functions:
- description: >-
    Catalytic alpha subunit of the PaaABCE phenylacetyl-CoA 1,2-epoxidase:
    binds phenylacetyl-CoA in a tunnel ending at a predicted di-iron site and
    inserts one atom of O2 across the C1-C2 ring bond, with electrons from
    the PaaE reductase, initiating aerobic phenylacetate catabolism in the
    cytosol.
  molecular_function:
    id: GO:0097266
    label: phenylacetyl-CoA 1,2-epoxidase activity
