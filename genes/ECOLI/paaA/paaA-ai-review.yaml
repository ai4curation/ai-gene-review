      one atom of molecular oxygen into phenylacetyl-CoA.
suggested_questions:
- question: >-
    How is the di-iron centre of PaaA loaded in vivo, given that iron addition
    aggregates purified PaaAC, and does PaaD act as a maturation factor for it?
- question: >-
    Where on PaaA does the PaaE reductase dock, given that PaaA lacks the
    hydrogen-bond network used for electron transfer in other bacterial
    multicomponent monooxygenases?
suggested_experiments:
- description: >-
    Determine the structure of iron-loaded PaaABC (or PaaABCE) and measure
    single-turnover epoxidation with PaaA di-iron ligand variants (Glu-42,
    Glu-72, His-75, Asp-126, Glu-155, His-158) to confirm the predicted
    metal site.
