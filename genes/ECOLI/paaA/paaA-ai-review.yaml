- term:
    id: GO:0097266
    label: phenylacetyl-CoA 1,2-epoxidase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: >-
      PaaA is the catalytic subunit: it alone binds phenylacetyl-CoA in the
      PaaAC structure and carries the predicted di-iron site at which one O2
      atom is inserted. The full NADPH-dependent reaction needs PaaB, PaaC
      and the reductase PaaE.
    action: ACCEPT
    reason: >-
      GO practice allows the subunit that contains the active site of a
      multisubunit enzyme to be annotated as enabling the activity, with
      accessory subunits annotated contributes_to. PaaA is that subunit:
      substrate binds only to PaaA, the iron site lies in PaaA, and UniProt
      curates PaaA as the subunit that incorporates the oxygen atom. The
      activity was demonstrated for the reconstituted complex
      (PMID:21247899; PMID:20660314, the latter using the Pseudomonas sp. Y2
      enzyme).
    supported_by:
    - reference_id: file:ECOLI/paaA/paaA-uniprot.txt
      supporting_text: >-
        The subunit A is the catalytic subunit involved in the incorporation
        of one atom of molecular oxygen into phenylacetyl-CoA.
    - reference_id: PMID:21247899
      supporting_text: The ligands bind only to the PaaA subunit
    - reference_id: PMID:21247899
      supporting_text: >-
