      with PaaA being the catalytic α subunit and PaaC, the structural β
      subunit.
  - reference_id: PMID:20660314
    supporting_text: >-
      PaaABC(D)E thus functions as a ring 1,2-phenylacetyl-CoA epoxidase.
  - reference_id: file:ECOLI/paaA/paaA-uniprot.txt
