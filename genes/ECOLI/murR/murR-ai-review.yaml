- id: PMID:18723630
  title: The transcriptional factors MurR and catabolite activator protein regulate
    N-acetylmuramic acid catabolism in Escherichia coli.
  findings:
  - statement: Deletion of murR derepresses murQ-lacZ 20-fold and removes the lag of
      growth on MurNAc.
    supporting_text: Deleting murR abolished the extensive lag phase observed for E. coli
      grown on MurNAc and enhanced murQ transcription some 20-fold.
  - statement: MurR binds, as a multimer, two adjacent inverted repeats over the murQ
      promoter (EMSA of truncated fragments and DNase I footprint).
    supporting_text: MurR forms a stable multimer (most likely a tetramer) and binds to
      two adjacent inverted repeats within an operator region.
  - statement: MurNAc 6-phosphate releases MurR from the operator.
    supporting_text: MurNAc-6-phosphate, the substrate of MurQ, was identified as a specific
      inducer that weakens binding of MurR to the operator.
  - statement: At the concentrations tested (up to 5 mM), GlcNAc 6-phosphate and other
      amino sugar intermediates did not affect MurR-DNA binding.
    supporting_text: neither GlcNAc-6-P (up to 5 mM final concentration), GlcNAc (9 mM),
      anhydroMurNAc (0.2 mM), MurNAc (up to 6.82 mM), nor muramyl dipeptide (0.4 mM) had
      an effect on MurR binding to the operator site
    finding_review:
      finding_status: CORROBORATED
      superseded_by:
      - PMID:35640608
      review_notes: >-
        Zhang et al. (2022) also saw negligible release by GlcNAc-6-P at the
        concentrations that release MurR with MurNAc-6-P, and no derepression in a
        cell-free reporter or in cells. They do show that GlcNAc-6-P binds MurR (ITC Kd
        17.6 uM) and partly releases it from DNA at 40 mM, so "no effect" holds for the
        physiological question (inducer) but not for binding per se.
      supported_by:
      - reference_id: PMID:35640608
        supporting_text: In contrast, the relief of the retardation was negligible when
          the same concentration of GlcNAc-6-P was added
  - statement: cAMP-CAP activates murQ from a class I site; MurR and CAP both repress
      murR, whose promoter faces the murQ promoter.
    supporting_text: While MurR inactivates and cAMP-CAP activates murQ expression, both
      regulators inactivate murR expression, presumably by acting as a roadblock for RNA
      polymerase.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text read (PMC2566201). Primary characterization of MurR: deletion phenotype,
      transcription start sites, reporter fusions, EMSA, DNase I footprint, effector.
- id: PMID:35640608
  title: Molecular basis for cell-wall recycling regulation by transcriptional repressor
    MurR in Escherichia coli.
  findings:
  - statement: MurNAc 6-phosphate binds MurR (ITC Kd 4.3 uM) and releases it from the
      promoter DNA.
    supporting_text: In this work, we revealed that MurNAc-6-P directly binds to MurR to
      induce the dissociation of MurR from the promoter DNA, leading to the derepression
      of the murPQ pathway.
  - statement: GlcNAc 6-phosphate binds MurR more weakly and does not relieve repression
      in a cell-free reporter or in cells.
    supporting_text: Taken together, in the tested conditions, MurNAc-6-P, but not GlcNAc-6-P,
      could alleviate the binding of MurR with the operator DNA.
  - statement: murR deletion raises murQ, murP and pbp4B transcripts.
    supporting_text: the deletion of murR evidently increased the transcription levels
      of all three genes
  - statement: MurR is a tetramer in solution.
    supporting_text: MurR forms a tetramer (125 KDa) rather than a dimer (62 KDa) in solution
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text read (PMC9177960). Crystal structures of the SIS domain apo (7EN6) and
      with MurNAc 6-phosphate (7EN7) or GlcNAc 6-phosphate (7EN5); ligand-site mutants
      lose MurNAc 6-phosphate response in vitro and impair growth on MurNAc. Refines the
      2008 conclusion on GlcNAc 6-phosphate (binds, but is not an inducer).
- id: PMID:19897902
  title: Two modes of autoregulation of the murR repressor in Escherichia coli.
  findings:
  - statement: MurR represses its own gene and murR is stimulated in rich medium in a
      MurR- and PTS-dependent way.
    supporting_text: MurR also represses its own expression.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Abstract only in cache. Confirms autorepression; the proposed auto-induction by an
      "activated form of MurR" is a hypothesis from the abstract and is not used for any
      annotation.
