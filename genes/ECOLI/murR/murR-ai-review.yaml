core_functions:
- description: >-
    Ligand-modulated transcriptional repressor of N-acetylmuramic acid catabolism. MurR
    binds as a tetramer to two adjacent inverted repeats overlapping the murQ promoter,
    repressing the murQP(-pbp4B) operon and its own divergent gene; binding of MurNAc
    6-phosphate to the SIS domain releases MurR from the operator and induces the
    operon.
  molecular_function:
    id: GO:0141096
    label: ligand-modulated transcription repressor activity
  directly_involved_in:
  - id: GO:0045892
    label: negative regulation of DNA-templated transcription
  - id: GO:0180068
    label: negative regulation of carbohydrate utilization
  supported_by:
  - reference_id: PMID:18723630
    supporting_text: In this way MurR represses transcription from the murQ promoter and
      also interferes with its own transcription.
  - reference_id: PMID:18723630
    supporting_text: MurNAc-6-phosphate, the substrate of MurQ, was identified as a specific
      inducer that weakens binding of MurR to the operator.
  - reference_id: PMID:35640608
    supporting_text: In this work, we revealed that MurNAc-6-P directly binds to MurR to
      induce the dissociation of MurR from the promoter DNA, leading to the derepression
      of the murPQ pathway.
proposed_new_terms:
- proposed_name: negative regulation of N-acetylmuramic acid catabolic process
  proposed_definition: >-
    Any process that stops, prevents or reduces the frequency, rate or extent of
    N-acetylmuramic acid catabolic process.
  justification: >-
    GO has GO:0160159 positive regulation of N-acetylmuramic acid catabolic process but
    no negative or unsigned regulation term. E. coli MurR, the best characterized member,
    directly represses the murQP operon encoding the MurNAc PTS transporter and the
    MurNAc 6-phosphate etherase, and B. subtilis MurR (ybbH) represses its ortholog
    operon. Because GO:0097173 is classified under carboxylic acid catabolic process,
    the existing GO:0043470 regulation of carbohydrate catabolic process does not cover
    it. Same request as in the ybbH review.
  proposed_parent:
    id: GO:0009895
    label: negative regulation of catabolic process
  supported_by:
  - reference_id: PMID:18723630
    supporting_text: Hence, inactivation of murR markedly increases growth on MurNAc,
      indicating that MurR functions as a repressor of the MurNAc pathway.
suggested_questions:
- question: >-
    Should GO:0097173 N-acetylmuramic acid catabolic process also be classified under
    amino sugar (or carbohydrate derivative) catabolic process? It currently sits only
    under carboxylic acid catabolic process, so regulation and pathway terms for
    carbohydrate catabolism do not group it.
- question: >-
    PMID:19897902 reports MurR- and PTS-dependent stimulation of murR in rich medium. Is
    there a positive (activator) mode of MurR, and what ligand or partner would trigger
    it?
tags:
- ecoli
