- term:
    id: GO:1901135
    label: carbohydrate derivative metabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR001347
  - InterPro:IPR046348
  review:
    summary: >-
      InterPro2GO mapping from the SIS domain, which is shared by sugar-phosphate
      isomerases and by RpiR-family regulators. MurR has no catalytic activity.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      MurR performs no step of carbohydrate derivative metabolism; it binds a pathway
      intermediate and regulates expression of the enzymes (MurQ) and transporter (MurP)
      that do. The SIS mapping fits SIS enzymes but over-annotates SIS regulators. The
      regulatory role is captured by GO:0045892 and the proposed negative regulation of
      N-acetylmuramic acid catabolic process. Same action as in the ybbH review.
    supported_by:
    - reference_id: PMID:18723630
      supporting_text: Further metabolism within the cytoplasm requires the MurNAc
        etherase MurQ, a unique lyase/hydrolase which catalyzes a β-elimination reaction
        to cleave the lactyl ether bond of MurNAc-6-P
- term:
    id: GO:0180068
    label: negative regulation of carbohydrate utilization
  evidence_type: IMP
  original_reference_id: PMID:18723630
  qualifier: involved_in
  review:
    summary: >-
      A murR deletion grows on MurNAc as sole carbon source with a sixfold shorter lag
      and a twofold shorter doubling time than wild type, because murQP is derepressed;
      growth on GlcNAc is unaffected (PMID:35640608). MurR thus holds back use of an
      alternative carbon source until its inducer, MurNAc 6-phosphate, accumulates.
      Repression is combined with cAMP-CAP dependence, so the operon is also off while
      glucose is present.
    action: NEW
    reason: >-
      MurR itself does the regulatory work (it occupies the murQP operator), so the
      participation test is met. GO:0180068 is the closest existing term until the
      requested negative regulation of N-acetylmuramic acid catabolic process exists;
      it matches the annotation made for the B. subtilis ortholog ybbH.
    supported_by:
    - reference_id: PMID:18723630
      supporting_text: Hence, inactivation of murR markedly increases growth on MurNAc,
        indicating that MurR functions as a repressor of the MurNAc pathway.
    - reference_id: PMID:35640608
      supporting_text: This result indicated that the pathway regulated by MurR showed
        substrate specificity toward different saccharides.
