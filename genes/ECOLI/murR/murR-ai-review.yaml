- term:
    id: GO:0043470
    label: regulation of carbohydrate catabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: involved_in
  supporting_entities:
  - UniRule:UR000160055
  review:
    summary: >-
      UniRule (HAMAP MF_02108 MurR) transfer. MurR represses the murQP operon, whose
      products import MurNAc as MurNAc 6-phosphate and cleave it to GlcNAc 6-phosphate,
      so MurR does regulate catabolism of a sugar derivative. The term is unsigned,
      however, and GO places GO:0097173 N-acetylmuramic acid catabolic process under
