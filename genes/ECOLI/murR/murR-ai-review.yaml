- term:
    id: GO:0097173
    label: N-acetylmuramic acid catabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000041
  qualifier: involved_in
  supporting_entities:
  - UniPathway:UPA00342
  review:
    summary: >-
      UniPathway2GO mapping. The UniProt PATHWAY line for MurR is "N-acetylmuramate
      degradation [regulation]"; the mapping dropped the regulation qualifier and
      assigned the pathway itself. MurR catalyses no step of MurNAc breakdown; MurP
      imports and phosphorylates MurNAc and MurQ cleaves MurNAc 6-phosphate.
    action: MODIFY
    reason: >-
      MurR does not participate in MurNAc catabolism; it regulates it. This is a lateral
      correction from the process to its (negative) regulation. The exact term is
      requested as an NTR; GO:0180068 negative regulation of carbohydrate utilization is
      the existing term used meanwhile.
    proposed_replacement_terms:
    - id: NTR
      label: negative regulation of N-acetylmuramic acid catabolic process
    - id: GO:0180068
      label: negative regulation of carbohydrate utilization
    supported_by:
    - reference_id: file:ECOLI/murR/murR-uniprot.txt
      supporting_text: 'PATHWAY: Amino-sugar metabolism; N-acetylmuramate degradation
        [regulation].'
    source_defects:
    - defect_type: WRONG_TERM
      resource: UNIPROT
      record: UniPathway:UPA00342
      slot: unipathway2go
      requested_change: CHECK
      asserted_value: GO:0097173
      cause: OTHER
      confidence: PROBABLE
      explanation: >-
        The UniPathway2GO pipeline (GO_REF:0000041) appears to map a PATHWAY line marked
        "[regulation]" to the pathway process itself, giving a transcriptional regulator
