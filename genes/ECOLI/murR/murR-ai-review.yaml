      this term is not an ancestor of what MurR actually regulates.
    action: MODIFY
    reason: >-
      The essence (MurR controls MurNAc catabolism) is right, but the term is unsigned
      and names a process that does not include MurNAc catabolism in GO. The precise
      claim is negative regulation of N-acetylmuramic acid catabolic process, which does
      not exist (GO has only GO:0160159 positive regulation); it is requested below, as
      in the ybbH review. The existing term that captures the physiology is GO:0180068
      negative regulation of carbohydrate utilization: MurR keeps the MurNAc uptake and
      catabolic genes off until MurNAc 6-phosphate appears, and its loss removes the long
      lag of growth on MurNAc as sole carbon source.
