taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  MurR (formerly YfeT) is a cytoplasmic one-component transcriptional repressor of the
  RpiR/AlsR family that controls catabolism of N-acetylmuramic acid (MurNAc), the cell
  wall sugar that E. coli obtains from the environment or from recycling of its own
  peptidoglycan. It has an N-terminal HTH_RpiR winged helix-turn-helix DNA-binding
  domain and a C-terminal SIS sugar-phosphate-binding domain and forms a homotetramer.
  murR is transcribed divergently from the murQP operon, which encodes the MurNAc
  6-phosphate etherase MurQ and the MurNAc-specific PTS transporter MurP; the two
  promoters face each other within the intergenic region. MurR binds with nanomolar
  affinity to an operator of two adjacent inverted repeats that overlaps the murQ
  promoter, blocking murQP transcription, and it also represses its own gene. MurNAc
  6-phosphate, the product of MurP-mediated uptake and the substrate of MurQ, binds the
  SIS domain (crystal structures with MurNAc 6-phosphate and GlcNAc 6-phosphate are
  known) and releases MurR from the operator, inducing the operon. GlcNAc 6-phosphate
  binds more weakly and does not induce in cells. Expression of murQP also requires
  activation by cAMP-CAP. Deletion of murR raises murQ, murP and pbp4B transcription and
  removes the long lag phase of growth on MurNAc as sole carbon source.
