  review:
    summary: CcmABCD/E assembly is demonstrated, but its fit to an ATP-binding cassette transporter complex
      remains mechanistically contested.
    action: UNDECIDED
    reason: Structures establish association with the ABC-family machinery, including bound CcmE. GO:0043190
      describes a metabolite-transport complex, not just ABC architecture. The 2023 floppase interpretation
      and 2025 ATP-independent CcmCD/ATP-dependent release interpretation disagree about coupling and
      conduit. Retain uncertainty about this functional complex class rather than treating the older rejection
      or the newer architecture as decisive.
    supported_by:
