- term:
    id: GO:0043190
    label: ATP-binding cassette (ABC) transporter complex
  evidence_type: NAS
  original_reference_id: PMID:24044352
  qualifier: part_of
  review:
    summary: >-
      CcmD is a subunit of the CcmABCD complex, which has ABC-transporter
      architecture but is not shown to transport a metabolite.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Membership is experimentally established in E. coli (copurification of
      CcmD with CcmC and CcmA), so the assignment is not baseless. However,
      GO:0043190 is defined as a complex for transport of metabolites into or
      out of the cell, literal heme export is not established, and the
      complex's characterized output is ATP-dependent release of holo-CcmE. No
      GO complex term exists for the CcmABCD heme-chaperone release complex
      (ComplexPortal CPX-3568), so this is flagged as over-annotation rather
      than replaced. Action matches the ccmA, ccmB and ccmC reviews.
    supported_by:
    - reference_id: PMID:18326572
      supporting_text: Here it is shown that CcmD is a component of the CcmABC
        ATP-binding cassette transporter complex.
    - reference_id: PMID:18326572
      supporting_text: CcmD is absolutely required for the release of holo-CcmE
        from the CcmABCD complex.
