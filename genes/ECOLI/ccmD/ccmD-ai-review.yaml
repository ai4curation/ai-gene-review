- id: PMID:10339610
  title: Heme transfer to the heme chaperone CcmE during cytochrome c maturation requires
    the CcmC protein, which may function independently of the ABC-transporter CcmAB.
  findings:
  - statement: CcmD was proposed to stabilise CcmE in the membrane.
    supporting_text: CcmD was found to be involved in stabilizing the heme chaperone
      CcmE in the membrane.
    finding_review:
      finding_status: DISPUTED
      superseded_by:
      - PMID:18326572
      review_notes: >-
        Richard-Fogal et al. 2008 found equal total CcmE with or without CcmD
        and attributed the lower holo-CcmE level to loss of holo-CcmE release
        and recycling; they assign CcmD an essential role in holo-CcmE release
        instead.
      supported_by:
      - reference_id: PMID:18326572
        supporting_text: we conclude that CcmD is not essential for heme transfer
          to CcmE or for the stability or membrane insertion of CcmE
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached; first genetic analysis of ccmD in E. coli.
- id: PMID:15513913
  title: CcmD is involved in complex formation between CcmC and the heme chaperone
    CcmE during cytochrome c maturation.
  findings:
  - statement: CcmD forms a ternary complex with CcmC and CcmE and does not detectably
      bind heme.
    supporting_text: Interactions of CcmD with either ferrochelatase, the last heme
      biosynthetic enzyme, or directly with heme were not detectable.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Abstract-only cache. Its N-in/C-in topology for His-tagged CcmD was
      later attributed to the tag (PMID:18326572).
- id: PMID:18326572
  title: Topology and function of CcmD in cytochrome c maturation.
  findings:
  - statement: CcmD is a subunit of the CcmABCD complex and is essential for release
      of holo-CcmE, but not for heme transfer from CcmC to CcmE.
    supporting_text: CcmD is absolutely required for the release of holo-CcmE from
      the CcmABCD complex.
  - statement: CcmD has a periplasmic N terminus, one transmembrane helix and a cytoplasmic
      C terminus.
    supporting_text: Evidence is presented that the topology of CcmD in the cytoplasmic
      membrane is the N terminus outside and the C terminus inside with one transmembrane
      domain.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached; defines the essential release function of CcmD.
- id: PMID:24044352
  title: Probing heme delivery processes in cytochrome c biogenesis System I.
  findings:
  - statement: CcmD assists CcmC in transferring heme to CcmE; the CcmABC heme transporter
      model is described as disproven.
    supporting_text: CcmC, with the assistance of CcmD, interacts with the heme chaperone
      CcmE
- id: PMID:29518410
  title: Structurally Mapping Endogenous Heme in the CcmCDE Membrane Complex for Cytochrome
    c Biogenesis.
  findings:
  - statement: CcmD interacts with CcmC and is required for holo-CcmE release.
    supporting_text: The small CcmD protein with a single transmembrane domain interacts
      CcmC and is required for holoCcmE release
core_functions:
- description: >-
    Accessory single-pass membrane subunit of the CcmCDE heme-loading complex
    and the ABC-type CcmABCD assembly; binds CcmC and is essential for the
    ATP-dependent release of holo-CcmE, thereby supplying the heme donor for
    holocytochrome c synthesis. No intrinsic molecular activity is defined.
  directly_involved_in:
