- term:
    id: GO:0015886
    label: heme transport
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR007078
  review:
    summary: >-
      InterPro2GO assignment reflecting the historical "heme exporter" name of
      the CcmD family.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      CcmD has no detectable heme binding and is not needed for heme transfer
      from CcmC to CcmE; its essential role is release of holo-CcmE from the
      CcmABCD complex. The heme-export model behind the family name is not
      supported, so heme transport overstates CcmD's role. Not REMOVE, because
      CcmD is part of the machinery that moves heme (as holo-CcmE) onward in
      the pathway.
    supported_by:
    - reference_id: PMID:15513913
      supporting_text: Interactions of CcmD with either ferrochelatase, the last
        heme biosynthetic enzyme, or directly with heme were not detectable.
    - reference_id: PMID:18326572
      supporting_text: CcmD is not necessary for the CcmC-dependent transfer of
        heme to CcmE in the periplasm or for interaction of CcmE with CcmABC.
