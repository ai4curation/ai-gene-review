suggested_questions:
- question: What is the molecular role of the conserved periplasmic GXY motif and Tyr17 of CcmD in releasing
    holo-CcmE from CcmC?
- question: Does CcmD transmit the CcmAB ATP-hydrolysis-driven conformational change to the CcmC WWD domain,
    or does it contact holo-CcmE directly?
suggested_experiments:
- description: Mutate the conserved N-terminal GXY motif of CcmD and measure periplasmic release of soluble
    holo-CcmE and cytochrome c production.
  experiment_type: mutagenesis with holo-CcmE release assay
- description: Crosslink CcmD to CcmC, CcmB and CcmE in ATP-bound versus post-hydrolysis states to map
    its contacts during the release cycle.
  experiment_type: site-specific crosslinking
