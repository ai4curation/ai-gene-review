  title: UniProtKB entry for E. coli CcmD (P0ABM5)
  findings:
  - statement: Curated record gives CcmD/CycX/HelD family membership and a single predicted transmembrane
      helix.
    supporting_text: Belongs to the CcmD/CycX/HelD family.
- id: PMID:10339610
  title: Heme transfer to the heme chaperone CcmE during cytochrome c maturation requires the CcmC protein,
    which may function independently of the ABC-transporter CcmAB.
  findings:
  - statement: CcmD was proposed to stabilise CcmE in the membrane.
    supporting_text: CcmD was found to be involved in stabilizing the heme chaperone CcmE in the membrane.
    finding_review:
      finding_status: DISPUTED
      superseded_by:
      - PMID:18326572
      review_notes: Richard-Fogal et al. 2008 found equal total CcmE with or without CcmD and attributed
        the lower holo-CcmE level to loss of holo-CcmE release and recycling; they assign CcmD an essential
        role in holo-CcmE release instead.
      supported_by:
      - reference_id: PMID:18326572
        supporting_text: we conclude that CcmD is not essential for heme transfer to CcmE or for the stability
          or membrane insertion of CcmE
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Full text cached; first genetic analysis of ccmD in E. coli. Historical evidence/model:
      its positive loading/release findings remain useful, but any blanket exclusion of heme transport
      must be read alongside conflicting PMID:37626034, PMID:40026579 and PMID:40167305. This audit does
      not infer a universally proven conduit.'
- id: PMID:15513913
  title: CcmD is involved in complex formation between CcmC and the heme chaperone CcmE during cytochrome
    c maturation.
  findings:
  - statement: CcmD forms a ternary complex with CcmC and CcmE and does not detectably bind heme.
    supporting_text: Interactions of CcmD with either ferrochelatase, the last heme biosynthetic enzyme,
      or directly with heme were not detectable.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only cache. Its N-in/C-in topology for His-tagged CcmD was later attributed
      to the tag (PMID:18326572).
- id: PMID:18326572
  title: Topology and function of CcmD in cytochrome c maturation.
  findings:
  - statement: CcmD is a subunit of the CcmABCD complex and is essential for release of holo-CcmE, but
      not for heme transfer from CcmC to CcmE.
    supporting_text: CcmD is absolutely required for the release of holo-CcmE from the CcmABCD complex.
  - statement: CcmD has a periplasmic N terminus, one transmembrane helix and a cytoplasmic C terminus.
    supporting_text: Evidence is presented that the topology of CcmD in the cytoplasmic membrane is the
      N terminus outside and the C terminus inside with one transmembrane domain.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached; defines the essential release function of CcmD.
- id: PMID:24044352
  title: Probing heme delivery processes in cytochrome c biogenesis System I.
  findings:
  - statement: CcmD assists CcmC in transferring heme to CcmE; the CcmABC heme transporter model is described
      as disproven.
    supporting_text: CcmC, with the assistance of CcmD, interacts with the heme chaperone CcmE
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: ' Historical evidence/model: its positive loading/release findings remain useful, but
      any blanket exclusion of heme transport must be read alongside conflicting PMID:37626034, PMID:40026579
      and PMID:40167305. This audit does not infer a universally proven conduit.'
- id: PMID:29518410
  title: Structurally Mapping Endogenous Heme in the CcmCDE Membrane Complex for Cytochrome c Biogenesis.
  findings:
  - statement: CcmD interacts with CcmC and is required for holo-CcmE release.
    supporting_text: The small CcmD protein with a single transmembrane domain interacts CcmC and is required
      for holoCcmE release
- id: PMID:40026579
  title: Complexation of CcmB with CcmACD safeguards heme translocation for cytochrome c maturation.
  findings:
  - statement: CcmB overproduction drives heme efflux in S. oneidensis; E. coli CcmB homolog assays support
      heme handling in heterologous systems.
    supporting_text: Similar results were obtained from E. coli CcmB expressed from the same expression
      system
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text and supplementary Table S2 read. Main deletion strains derive from S. oneidensis
      MR-1. Foreign E. coli CcmB complementation/overproduction and E. coli acrB/chuA heme-sensitivity
      assays are not a purified native CcmABCD transport assay. Table S2 lists cloning/conjugation hosts
      but does not resolve the E. coli CcmB donor strain/accession. AlphaFold/docking/MD do not constitute
      an experimentally observed CcmB heme channel. CcmABCD assembly restrains efflux; the CcmB conduit
      interpretation conflicts with PMID:40167305.
- id: PMID:37626034
  title: Architecture of the Heme-translocating CcmABCD/E complex required for Cytochrome c maturation.
  findings:
  - statement: E. coli CcmABCD/E structures support ATP-coupled conformational changes and propose a heme
      floppase mechanism.
    supporting_text: suggest that this unusual ABC transporter acts as a heme floppase
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text read. Recombinant E. coli operon from pEC86; N-terminal Strep-tag II on CcmA,
      expression in BL21(DE3)/C43(DE3). These are expression hosts, not independently established donor
      strains. Detergent structures and ATPase-deficient E154Q states support a model, not a purified
      vectorial heme-flux measurement. The proposed CcmB/CcmC route conflicts with PMID:40167305.
- id: PMID:40167305
  title: Biochemical mapping reveals a conserved heme transport mechanism via CcmCD in System I bacterial
    cytochrome c biogenesis.
  findings:
  - statement: Cysteine/heme crosslinks map a proposed heme acceptance site and transmembrane path through
      E. coli CcmCD.
    supporting_text: do not support a role for CcmB in heme acceptance for System I
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text read. GST:CcmCDE(H130A), engineered CcmC/CcmD cysteine variants and CcmD:FLAG
      trap endogenous-heme contacts; functional maturation is checked in recombinant complete-system assays.
      H130A biases heme occupancy. These are contact/structure-function data, not purified directional
      flux. The authors explicitly reject the CcmB conduit interpretation of PMID:40026579/37626034 and
      propose ATP-independent CcmCD transport plus ATP-dependent CcmE release. Comparative predicted structures
      are not KT2440 functional assays.
core_functions:
- description: Supports assembly and release of heme-loaded CcmE within the CcmABCD membrane machinery.
    CcmCD heme-acceptance contacts provide an additional proposed role, without proving a conserved individual
    transport activity.
