- term:
    id: GO:0035556
    label: intracellular signal transduction
  evidence_type: IMP
  original_reference_id: PMID:15916610
  qualifier: involved_in
  review:
    summary: Tar controls the intracellular chemotaxis phosphorelay through its receptor-CheW-CheA
      complex.
    action: MODIFY
    reason: >-
      QuickGO checked on 2026-11-06 places GO:0000160 beneath GO:0035556 through is_a/part_of ancestry,
      so this is a supported refinement, not a lateral move. Tar directly controls the intracellular phosphorelay
      through the cytoplasmic signaling surface of the receptor–CheW–CheA complex: ligand-dependent receptor
      output modulates CheA kinase activity (PMID1326408). Participation in this process does not require
      every component to catalyze phosphotransfer; Tar supplies the regulatory receptor step. No kinase
      or phosphoryl-acceptor molecular function is assigned to Tar. PMID15916610 demonstrates receptor-neighborhood
      adaptation and is not the sole evidence for the phosphorelay claim.
    supported_by:
