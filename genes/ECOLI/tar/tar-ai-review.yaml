id: P07017
gene_symbol: tar
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: Tar (methyl-accepting chemotaxis protein II, MCP-II; aspartate chemoreceptor) is a
  homodimeric two-pass inner-membrane chemoreceptor of Escherichia coli. Its periplasmic
  four-helix-bundle domain binds L-aspartate and related amino and dicarboxylic acids, and also the
  maltose-loaded periplasmic maltose-binding protein MalE, while Tar also mediates repellent
  responses to Ni2+ and Co2+. Ligand binding drives a conformational signal across the membrane
  through the transmembrane helices and HAMP domain to the cytoplasmic methyl-accepting signaling
  domain. There, receptor dimers form trimers of dimers that, with the adaptor CheW and the
  histidine kinase CheA, assemble into core signaling units and extended polar arrays, so that
  attractant binding inhibits CheA autophosphorylation and thereby phosphotransfer to CheY, biasing
  flagellar rotation toward counterclockwise (smooth swimming). Sensory adaptation is mediated by
  reversible methylation of specific glutamate residues in the cytoplasmic domain by CheR and
  demethylation/deamidation by CheB, recruited in part through Tar's C-terminal NWETF pentapeptide,
  which also lets Tar assist modification of low-abundance receptors.
