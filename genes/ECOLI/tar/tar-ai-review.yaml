    reason: 'Tar is the founding example of an MCP chemoreceptor: a homodimeric two-pass membrane protein
      whose periplasmic domain binds L-aspartate (and the maltose-binding protein) and whose cytoplasmic
      domain controls the CheA kinase, so ligand binding outside is converted into a signal inside (GO:0004888
      definition: transmitting the signal from one side of the membrane to the other). Tar is itself one
