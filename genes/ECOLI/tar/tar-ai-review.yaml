core_functions:
- description: 'Tar is the transmembrane chemoreceptor for L-aspartate (and, via the maltose-binding protein,
    maltose; repellents Ni2+/Co2+): ligand binding to its periplasmic domain is transmitted across the
    inner membrane to the cytoplasmic signaling domain, which, within CheW-CheA core signaling units at
    polar receptor arrays, controls CheA kinase activity and hence chemotaxis.'
