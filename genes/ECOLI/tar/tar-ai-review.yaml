- id: PMID:11923283
  title: CheW binding interactions with CheA and Tar. Importance for chemotaxis signaling in
    Escherichia coli.
  findings:
  - statement: CheW binds both CheA and Tar and these interactions are required for active ternary
      complexes and chemotaxis.
    supporting_text: Our results indicate that mutations which eliminate CheW binding to Tar (V36M)
      or to CheA (G57D) result in a complete inability to form active ternary complexes in vitro and
      render the CheW protein incapable of mediating chemotaxis in vivo.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
- id: PMID:1326408
  title: Assembly of an MCP receptor, CheW, and kinase CheA complex in the bacterial chemotaxis
    signal transduction pathway.
  findings:
  - statement: Receptors (Tsr, Tar) bind CheW directly and CheA via CheW, forming a stable ternary
      complex whose kinase activity is modulated by ligand without dissociation.
    supporting_text: This suggests that the receptor signal is transduced through conformational
      changes in the ternary complex rather than through changes in the association of the kinase
      CheA with receptor and/or CheW.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
- id: PMID:15916610
  title: Adaptational assistance in clusters of bacterial chemoreceptors.
  findings:
  - statement: High-abundance Tar assists methylation, demethylation and deamidation of
      low-abundance Trg in membranes, defining stable receptor neighbourhoods.
    supporting_text: 'Using membrane vesicles containing both high-abundance receptor Tar and low-abundance
      receptor Trg, we observed effective assistance in vitro for all three adaptational modifications:
      methylation, demethylation and deamidation.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
