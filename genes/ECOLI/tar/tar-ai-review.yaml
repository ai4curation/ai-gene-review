suggested_questions:
- question: Should the direct binding of L-aspartate by Tar's periplasmic domain be captured as an
    MF annotation (e.g. GO:0070335 aspartate binding) alongside transmembrane signaling receptor
    activity, given the crystal structures of the ligand-bound domain?
- question: How is the asymmetric binding of one aspartate per Tar dimer (negative cooperativity)
    converted into the piston-like TM2 displacement and HAMP conformational change that inhibits
    CheA in the array?
suggested_experiments:
- description: Quantify Tar-mediated kinase inhibition and methylation in nanodisc core units
    carrying defined TM2 or HAMP substitutions, with in vivo FRET (CheY-P/CheZ) readouts, to map how
    ligand occupancy propagates to the kinase-control region.
  experiment_type: in vitro reconstitution and in vivo FRET
