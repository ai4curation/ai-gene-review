suggested_questions:
- question: Which physiological reductant (flavodoxin FldA or another electron donor) reduces the
    radical SAM cluster of E. coli MoaA in vivo, and is MoaA physically channelled to MoaC to
    protect the labile 3',8-cH2GTP intermediate?
suggested_experiments:
- hypothesis: MoaA and MoaC form a transient complex in E. coli that channels 3',8-cH2GTP.
  description: Test MoaA-MoaC interaction by anaerobic pull-down or crosslinking, and compare cPMP
    yield from coupled versus separately incubated enzymes with E. coli flavodoxin/flavodoxin
    reductase as reductant.
