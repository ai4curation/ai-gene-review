id: P30745
gene_symbol: moaA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  MoaA is the radical S-adenosyl-L-methionine GTP 3',8-cyclase that catalyses the first
  step of molybdenum cofactor biosynthesis in Escherichia coli. It carries two [4Fe-4S]
  clusters: an N-terminal radical SAM cluster that binds and reductively cleaves SAM to a
  5'-deoxyadenosyl radical, and a C-terminal auxiliary cluster that binds the guanine of
  the GTP substrate. MoaA converts GTP to (8S)-3',8-cyclo-7,8-dihydroguanosine
  5'-triphosphate (3',8-cH2GTP), which MoaC then rearranges to cyclic pyranopterin
  monophosphate (cPMP, precursor Z); cPMP is subsequently converted to molybdopterin and
  Mo-molybdopterin for nitrate reductase, formate dehydrogenase and other molybdoenzymes.
  The [4Fe-4S] clusters are delivered by the A-type carriers ErpA and IscA, and moaA
  mutants (historically chlA) lack the molybdenum cofactor.
