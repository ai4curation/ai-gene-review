- term:
    id: GO:0061799
    label: cyclic pyranopterin monophosphate synthase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - MGI:MGI:1928904
  - PANTHER:PTN000539172
  - UniProtKB:Q9NZB8
  review:
    summary: cPMP synthase activity is the MoaC reaction, not the MoaA reaction.
    action: REMOVE
    reason: The donors are human MOCS1 and mouse Mocs1, bifunctional fusion proteins whose
      C-terminal MOCS1B domain is a MoaC homolog that carries the cPMP synthase activity. The
      IBA was placed at the MoaA/MOCS1A node (PTN000539172), so the MOCS1B activity propagates to
      single-domain MoaA proteins that lack any MoaC domain. E. coli MoaA (329 aa) has only the
      radical SAM core and twitch domains; the rearrangement to cPMP is carried out by the separate
      MoaC protein, and MoaA cannot perform it. Same action as PSEPK/moaA.
    supported_by:
    - reference_id: PMID:23627491
      supporting_text: In contrast to GTP cyclohydrolases I, MoaA is incapable of catalyzing the
        rearrangement reactions, presumably due to the lack of appropriate amino acid residues
        in the active-site.
    - reference_id: PMID:23627491
      supporting_text: Instead, 3′,8-cH2GTP is transferred to MoaC where a complex rearrangement
        reaction proceeds.
