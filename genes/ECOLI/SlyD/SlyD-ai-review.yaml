core_functions:
- molecular_function:
    id: GO:0003755
    label: peptidyl-prolyl cis-trans isomerase activity
  directly_involved_in:
  - id: GO:0042026
    label: protein refolding
  locations:
  - id: GO:0005829
    label: cytosol
  description: SlyD is an FKBP-type PPIase that catalyzes the cis-trans isomerization
    of Xaa-Pro peptide bonds with high efficiency (kcat/Km approximately 10^6 M-1
    s-1 for protein substrates). The PPIase activity is carried in the N-terminal
    FKBP domain and is reversibly inhibited by Ni2+ binding to the C-terminal region.
    Together with the chaperone holdase function of the IF domain, the PPIase accelerates
    slow steps of protein folding.
  supported_by:
  - reference_id: PMID:9188461
    supporting_text: For Suc-Ala-Phe-Pro-Arg-4-nitroanilide as substrate, kcat/Km
      of 29,600 M-1 s-1 for SlyD
  - reference_id: PMID:16388577
    supporting_text: All SlyD variants catalyze the proline-limited refolding of ribonuclease
      T1 with very high efficiencies
- molecular_function:
    id: GO:0170061
    label: nickel chaperone activity
  directly_involved_in:
  - id: GO:0051604
    label: protein maturation
  locations:
  - id: GO:0005829
    label: cytosol
  description: SlyD functions as a nickel metallochaperone in the [NiFe]-hydrogenase
    maturation pathway. It binds up to 7 Ni(II) ions in its C-terminal histidine/cysteine-rich
    domain, interacts with HypB to stimulate nickel release, and directly interacts
    with the hydrogenase large subunit HycE to deliver nickel for metallocenter assembly.
    This function requires the chaperone domain and C-terminal metal-binding tail
    but NOT the PPIase activity.
  supported_by:
  - reference_id: PMID:15569666
    supporting_text: These experiments demonstrate that SlyD has a role in the nickel
      insertion step of the hydrogenase maturation pathway
  - reference_id: PMID:17426034
    supporting_text: SlyD stimulates release of nickel from the high affinity Ni(II)-binding
      site of HypB
- description: >-
    The insert-in-flap (IF) domain gives SlyD an ATP-independent, in-situ
    holdase activity that binds non-native proteins and slows their aggregation. This
    client-recognition surface is spatially separate from the FKBP catalytic site.
    No current GO molecular-function term precisely represents this general holdase
    activity: GO:0051082 is obsolete, and GO:0140309 would additionally assert escort
    to an acceptor molecule or specific location.
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:19356587
    supporting_text: NMR titration experiments revealed that the IF domain recognizes
      and binds unfolded or partially folded proteins and peptides
  - reference_id: PMID:16388577
    supporting_text: SlyD also exhibits pronounced chaperone properties. Permanently
      unfolded proteins bind with high affinity to SlyD
proposed_new_terms:
- proposed_name: holdase chaperone activity
  proposed_definition: Binding to an unfolded or misfolded protein to prevent its
    aggregation without actively catalyzing refolding. The holdase maintains the client
    in a soluble, folding-competent state.
  justification: SlyD's IF domain binds non-native clients and slows insulin aggregation
    in situ. Obsolete GO:0051082 represented binding only, whereas GO:0140309 requires
    carrier-like escort to an acceptor or location that is not established for this
    general SlyD activity.
  proposed_parent:
    id: GO:0003674
    label: molecular_function
  supported_by:
  - reference_id: PMID:19356587
    supporting_text: Insulin aggregation is markedly slowed by SlyD* as evidenced
      by two-dimensional NMR spectroscopy in real time, probably due to SlyD* binding
      to denatured insulin.
suggested_questions:
- question: Which native cytosolic proteins are the principal clients of SlyD's IF-domain
    holdase activity under normal growth and heat stress?
- question: Does SlyD transfer nickel directly to HycE, or does its interaction with
    HypB and HycE regulate a multi-protein handoff intermediate?
- question: What is the physiological significance of the reported YdiV-SlyD-Fur
    interaction relative to SlyD's established folding and hydrogenase-maturation roles?
suggested_experiments:
- description: Identify native SlyD clients by quantitative crosslinking proteomics
    comparing wild-type SlyD with an IF-domain client-binding mutant under basal and
    heat-stress conditions.
- description: Reconstitute HypB-SlyD-HycE nickel transfer with isotope-traced nickel
    and time-resolved metal occupancy measurements to distinguish direct transfer from
    allosteric release and capture.
