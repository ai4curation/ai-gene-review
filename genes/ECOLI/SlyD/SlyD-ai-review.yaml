- term:
    id: GO:0170061
    label: nickel chaperone activity
  evidence_type: IMP
  original_reference_id: PMID:15569666
  review:
    summary: NEW annotation for nickel chaperone activity. SlyD functions as a nickel
      metallochaperone that participates in the nickel insertion step of [NiFe]-hydrogenase
      metallocenter assembly. Deletion of slyD results in reduced hydrogenase activity,
      which is rescued by excess nickel but not zinc (PMID:15569666). SlyD interacts
      with HypB and stimulates nickel release from HypB's high-affinity Ni(II)-binding
      site (PMID:17426034). SlyD also directly interacts with HycE, the hydrogenase
      3 large subunit (PMID:21185288).
    action: NEW
    reason: Nickel metallochaperone activity is one of SlyD's most well-characterized
      and biologically important functions. GO:0170061 "nickel chaperone activity"
      (defined as "Directly binding to and delivering nickel ions to a target protein")
      precisely describes SlyD's role in delivering nickel to [NiFe]-hydrogenase.
      This function is supported by multiple studies (PMID:15569666, PMID:17426034,
      PMID:21185288, PMID:22047179) and requires the chaperone domain and C-terminal
      metal-binding tail but not the PPIase activity (PMID:17720786). IMP is used
      because the anchor paper establishes the activity through slyD deletion, metal
      rescue, and hydrogenase phenotypes; the delivery mechanism is a synthesis across
      complementary biochemical and interaction studies rather than a single direct
      visualization of nickel transfer.
    supported_by:
    - reference_id: PMID:15569666
      supporting_text: These experiments demonstrate that SlyD has a role in the nickel
        insertion step of the hydrogenase maturation pathway
    - reference_id: PMID:17426034
      supporting_text: SlyD stimulates release of nickel from the high affinity Ni(II)-binding
        site of HypB, an activity that is also disrupted by mutations that affect
        complex formation.
    additional_reference_ids:
    - PMID:17426034
    - PMID:21185288
    - PMID:22047179
  qualifier: enables
