    label: protein maturation
  evidence_type: IMP
  original_reference_id: PMID:17426034
  review:
    summary: IMP annotation for protein maturation from Leach et al. (2007). Mutations
      in SlyD that disrupt complex formation with HypB result in deficient hydrogenase
      production in vivo. SlyD stimulates release of nickel from HypB's high-affinity
      Ni(II)-binding site, and a SlyD truncation lacking the C-terminal metal-binding
      tail is not functional in vivo for hydrogenase maturation.
    action: ACCEPT
    reason: Well-supported by mutant phenotype evidence. SlyD is required for proper
      maturation of the [NiFe]-hydrogenase metallocenter. This is a core in vivo function.
    supported_by:
    - reference_id: PMID:17426034
      supporting_text: Mutations in either protein that disrupt complex formation
