- source_method: ProTrek
  source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
  source_reference_id: PMID:41039041
  predicted_term:
    id: GO:0010045
    label: response to nickel cation
  predicted_term_type: GO_BP
  review:
    assessment: LSP
    confidence_score: 2
    summary: >-
      Rank 2 (score 13.62) and absent from GOA. SlyD binds up to seven Ni(II) ions through its histidine/cysteine-rich
      C-terminal tail and works with HypB in hydrogenase maturation, so a nickel connection is right;
      but response to nickel cation frames the protein as a stress responder rather than as the metallochaperone
      this review describes, and GOA already carries the specific nickel cation binding by IDA. Correct-adjacent
      and less precise; scored LSP.
    supported_by:
    - reference_id: PMID:19947632
      supporting_text: >-
        binds up to 7 nickel ions as well as zinc, copper, and cobalt
- source_method: ProTrek
  source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
  source_reference_id: PMID:41039041
  predicted_term:
    id: GO:0016530
    label: metallochaperone activity
  predicted_term_type: GO_MF
  review:
    assessment: COR
    confidence_score: 2
    summary: >-
      Rank 3 (score 13.47) and absent from GOA, whose metal terms stop at ion binding. Metallochaperone
      activity is exactly this review's second core function - SlyD delivers nickel in the [NiFe]-hydrogenase
      maturation pathway and stimulates nickel release from HypB - and it states a delivery role rather
      than a binding property. Correct and novel; the most useful single call ProTrek makes on this
      gene.
    supported_by:
    - reference_id: PMID:22047179
      supporting_text: >-
        SlyD functions as a nickel metallochaperone in the [NiFe]-hydrogenase maturation pathway
