  label: Escherichia coli (strain K12)
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for SlyD, the trifunctional FKBP PPIase, holdase and nickel metallochaperone.
  The GO channel commits entirely to the metal arm: all five top calls concern nickel binding, transport
  or metallochaperone activity, and neither the PPIase activity (IDA, IMP, IBA in GOA and this review's
  first core function) nor the holdase activity appears. That is a defensible one-third of the protein,
  and it is the third that the BioReason-SFT review of this same gene flagged as its key gap - so
  the two models are complementary here rather than agreeing. The free-text channel describes both
  the chaperone and PPIase activities at 19.57. Assessment: 1 correct novel (COR), 2 less precise
  (LSP).
