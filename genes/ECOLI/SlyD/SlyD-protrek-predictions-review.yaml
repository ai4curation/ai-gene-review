    confidence_score: 2
    summary: >-
      Top-ranked hit (score 13.87) and absent from GOA. SlyD does oligomerize, but complex oligomerization
      is a generic process term that says nothing about which of SlyD's three activities is at work;
      GOA already records the specific metal-binding and PPIase functions. Correct at best trivially
      and much less precise than what exists. Scored LSP.
