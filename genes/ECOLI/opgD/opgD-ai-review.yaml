core_functions:
- description: Hydrolyzes internal beta-1,2-glucosidic linkages in glucan by an anomer-inverting GH186
    mechanism. Sequence-matched recombinant biochemistry establishes the MF; periplasmic OPG chain-length
    maturation is supported by genetics and inferred native substrate processing, not an obligatory requirement
    for all OPG synthesis.
