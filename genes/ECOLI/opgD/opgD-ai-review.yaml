id: P40120
gene_symbol: opgD
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: OpgD is a Tat-exported periplasmic GH186 beta-1,2-glucan hydrolase in Escherichia coli. Purified
  sequence-identical BL21-derived protein specifically cleaves beta-1,2-glucans by an anomer-inverting
  mechanism. Loss of OpgD changes the chain-length distribution of osmoregulated periplasmic glucans,
  supporting a role in glucan maturation rather than an obligatory requirement for all glucan synthesis.
  Direct trimming of native branched glucan intermediates is a mechanistic interpretation supported by
  the biochemical and genetic evidence.
