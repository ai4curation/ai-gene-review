suggested_questions:
- question: Does mature OpgD directly trim native branched OPG precursors in vivo, and what determines
    the final chain-length distribution?
suggested_experiments:
- description: Compare product-resolved hydrolysis of native branched OPG intermediates with synthetic
    linear beta-1,2-glucan, and rescue a K-12 deletion with catalytic-site mutants.
  experiment_type: biochemistry and genetic complementation
