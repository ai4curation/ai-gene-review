id: Q46899
gene_symbol: casC
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: CasC (also called Cas7 or Cse4) is the backbone subunit of Cascade, the
  405-kDa CRISPR RNA-guided surveillance complex of the Escherichia coli K-12 type
  I-E CRISPR-Cas system, and the only subunit present in multiple copies in the
  catalytic core - six per complex. Each CasC adopts a hand-like fold of a modified
  RNA recognition motif palm, a helical fingers domain and a 30-residue thumb loop;
  the thumb of one subunit folds over the crRNA and inserts into a basic crease on
  the palm of the next, so that the six copies polymerise into a helical filament
  wrapped around the guide. CasC binds the crRNA through its phosphate backbone
  without sequence specificity, introducing a kink every six nucleotides, which
  divides the guide into six segments of five solvent-exposed bases presented in a
  pseudo A-form geometry. The arrangement simultaneously shields the guide from
  cellular nucleases and keeps it available for base pairing, and the bases at the
  kinks are flipped out of the helix so they do not participate in target
  recognition. When a target strand invades, CasC fingers and thumbs contact both
  strands of the resulting guide-target hybrid across the minor groove, stabilising
  its unusual ribbon conformation, and lysine-rich helices on the two
  PAM-proximal subunits engage the duplex during target search. CasC is required for
  resistance to bacteriophage lambda and for plasmid silencing, but not for
  maturation of the crRNA guide. It also associates with the adaptation nuclease
  Cas1 (YgbT) outside the Cascade complex.
