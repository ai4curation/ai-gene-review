  review:
    summary: A reproducible physical association between CasC and the adaptation
      nuclease Cas1 (YgbT), detected by affinity purification and confirmed
      reciprocally with tagged CasC as the bait and by co-immunoprecipitation. No
      functional consequence has been demonstrated for CasC in particular - the
      inhibition experiment in that paper used CasE - and the authors themselves
      frame the significance as a suggestion that Cascade might contribute to spacer
      integration.
    action: REMOVE
    reason: Removal reflects the emptiness of the term, not doubt about the
      observation. The CasC-Cas1 association is real and was validated reciprocally
      and by co-immunoprecipitation, and it belongs in an interaction database
      (IntAct/ComplexPortal), but GO:0005515 protein binding conveys no functional
      information and per the project curation guidelines should not be retained.
      Unlike CasC's contacts inside Cascade, which are MODIFYed to GO:0005198
      structural molecule activity, this association is not a structural contribution
      to any defined complex, and no functional consequence has been demonstrated for
      CasC - the inhibition assay in that paper used CasE, not CasC - so there is no
      evidence-backed replacement term to propose. The membership observation itself
      is retained by the part_of row from the same reference, and the possible link
      between interference and primed spacer acquisition is raised in
      suggested_questions.
