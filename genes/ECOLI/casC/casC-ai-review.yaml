proposed_new_terms:
- proposed_name: CRISPR RNA-guided surveillance complex
  proposed_definition: A ribonucleoprotein complex composed of CRISPR-associated (Cas)
    proteins assembled around a single mature CRISPR RNA (crRNA), which uses the crRNA
    as a guide to locate nucleic acid complementary to its spacer sequence. In type I
    systems the complex additionally recognises a protospacer-adjacent motif, forms an
    R-loop at the target, and recruits a trans-acting nuclease for target destruction.
    The Escherichia coli type I-E complex, Cascade, has the composition
    Cas8e(1)/Cse2(2)/Cas7(6)/Cas5(1)/Cas6e(1) with one crRNA; the type I-F equivalent
    is the Csy complex.
  proposed_parent:
    id: GO:1990904
    label: ribonucleoprotein complex
  justification: GO's entire CRISPR vocabulary is five biological-process terms
    (GO:0099048, GO:0043571, GO:0098672 and the obsolete GO:0110132 and GO:0110133),
    with no cellular-component term, so every subunit of every CRISPR surveillance
    complex can currently only be placed on the bare GO:0032991 root or on its generic
    ancestor GO:1990904. The complex is a well-defined, stoichiometrically determined,
    structurally solved entity that ComplexPortal already models (CPX-1005, Cascade
    complex, cross-referenced from this UniProt entry), and the Cas7 backbone in
    particular is the surface targeted by several families of phage-encoded
    anti-CRISPR proteins, so a specific term would make a large body of structural and
    counter-defence curation expressible.
  supported_by:
  - reference_id: PMID:25103409
    supporting_text: both assemblies consist of 11 protein subunits and a single 61-nt
      crRNA that traverses the length of the complex
  - reference_id: PMID:23079036
    supporting_text: The E. coli Cascade complex is a 405 KDa ribonucleoprotein complex
      assembled from crRNA and five functionally essential Cse proteins
suggested_questions:
- question: GO has no molecular-function term for crRNA-guided target recognition, so
    the backbone subunit that actually displays the guide for base pairing can only be
    annotated with generic RNA binding and DNA/RNA hybrid binding, indistinguishable
    from an unguided nucleic-acid-binding protein. Should a guide-RNA-dependent
    nucleic acid recognition term be requested?
  experts: []
- question: Does the reproducible CasC-Cas1 association have a role in primed spacer
    acquisition, as the original authors suggested but did not test? If so, is the
    relevant entity Cascade as a whole or CasC specifically?
  experts:
  - Mohan Babu
  - Andrew Emili
  - Alexander Savchenko
- question: Every sixth base of the guide is flipped out under a CasC thumb and does
    not base pair with the target. Is this a tolerated cost of the backbone
    architecture, or is the periodic interruption itself functional - for example in
    setting the fidelity threshold or in licensing primed acquisition from mismatched
    targets?
  experts:
  - Blake Wiedenheft
  - Scott Bailey
suggested_experiments:
- hypothesis: The CasC thumb residues that order each guide segment set the mismatch
    tolerance of target recognition.
  description: Substitute the base-stacking thumb and palm residues identified in the
    structure (W199, F200, T201, L214 and the segment-ordering M166) singly and in
    combination, and for each variant measure Cascade assembly, dissociation constants
    for fully complementary targets and for targets mismatched at the fifth, sixth and
    seventh positions of each segment, Cas3-dependent degradation, and phage lambda
    resistance.
  experiment_type: structure-guided mutagenesis with quantitative binding assays
- hypothesis: The CasC filament protects the crRNA from cellular ribonucleases in vivo.
  description: Measure mature crRNA half-life by pulse-chase northern blotting in
    strains expressing full Cascade, CasCDE subcomplexes, and CasC thumb variants that
    fail to oligomerise, in otherwise isogenic backgrounds and in nuclease-deficient
    backgrounds, to separate protection from assembly.
  experiment_type: crRNA stability measurement
- hypothesis: The CasC-Cas1 interaction is a genuine physical link between
    interference and adaptation.
  description: Reconstitute purified Cas1-Cas2 with purified Cascade and with
    CasC-containing subcomplexes, measure binding by surface plasmon resonance,
    determine whether Cascade bound to a partially matched target enhances Cas1-Cas2
    integration into a CRISPR array in vitro, and test in vivo with CasC interface
    variants that retain interference but lose Cas1 binding.
  experiment_type: in vitro reconstitution and in vivo priming assay
