- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IDA
  original_reference_id: PMID:25103409
  qualifier: enables
  review:
    summary: The interaction recorded here is the CasC-CasC thumb-into-palm contact
      that builds the helical backbone, together with the contacts CasC makes with
      the CasB dimer, with CasD at the tail and with CasE at the head. These are the
      interactions that constitute the complex, so the informative statement is a
      structural one.
    action: MODIFY
    reason: The term "protein binding" conveys nothing about function, and for CasC
      the underlying observation is self-association into the backbone filament of
      Cascade plus contacts to every other subunit. GO:0005198 structural molecule
      activity ("The action of a molecule that contributes to the structural
      integrity of a complex") is the honest subunit-level function; GO has no child
      of it for a non-ribosomal ribonucleoprotein, so the parent is the correct
      level. The same replacement is used for the equivalent intra-complex rows on
      casA, casB, casD and casE so that the five subunits are treated consistently.
