- term:
    id: GO:0006298
    label: mismatch repair
  evidence_type: IDA
  original_reference_id: PMID:10986118
  qualifier: involved_in
  review:
    summary: >-
      The cited study shows that loss of Exonucleases I and VII stimulates
      hairpin-templated mutation at a thyA quasipalindrome; purified-system and
      genetic studies place ExoVII among the redundant mismatch-repair
      excision exonucleases.
    action: ACCEPT
    reason: >-
      Same judgment as for the XseA row: ExoVII excises the error-containing
      strand in methyl-directed repair, redundantly with RecJ, ExoI and ExoX,
      and the small subunit is required for the enzyme. The curator's
      annotation is kept.
    supported_by:
    - reference_id: PMID:11418610
      supporting_text: >-
        Whereas extracts of all possible single, double, and triple exonuclease
        mutants displayed significant residual mismatch repair, extracts
        deficient in RecJ, ExoI, ExoVII, and ExoX exonucleases were devoid of
        normal repair activity.
    - reference_id: PMID:11381137
      supporting_text: >-
        These observations confirm involvement of the four exonucleases in
        methyl-directed mismatch repair in vivo
