  review:
    summary: >-
      The ExoVII complex reconstituted with XseB is active and binds DNA, while
      XseA alone or XseB alone does not bind DNA; deletions in XseA's
      XseB-binding helices abolish activity.
    action: ACCEPT
    reason: >-
      XseB carries no catalytic residues, but the activity requires it as an
      integral subunit. The curator's enables annotation is kept; the core
      function records it as a contribution to the complex activity, as in
      the PSEPK XseB review.
    supported_by:
    - reference_id: PMID:22718974
      supporting_text: >-
        While deletions of individual helices in XseA only decreased the XseB
        binding, they all abolished the nuclease activity of ExoVII.
    - reference_id: PMID:22718974
      supporting_text: >-
        Additionally, the filter-binding assay revealed that the full-length
        XseA alone or XseB alone are also unable to bind DNA
