  label: Escherichia coli K-12
description: >-
  xseB encodes the 80-residue small subunit of exodeoxyribonuclease VII
  (ExoVII). Several XseB molecules associate, through a coiled-coil interface,
  with the helical region of one catalytic XseA large subunit to form the
  cytoplasmic holoenzyme. XseB has no catalytic residues of its own, but it is
  a structural gene for the enzyme: xseB mutations reduce ExoVII activity and
  make it heat labile, and DNA binding is seen only with the assembled
  complex. The XseA-XseB enzyme degrades single-stranded DNA bidirectionally
  without a metal cofactor and is one of several redundant single-stranded DNA
  exonucleases that excise the error-containing strand during mismatch
  repair.
