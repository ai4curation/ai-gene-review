    summary: >-
      The NMN adenylyltransferase activity is inherited from a deep node spanning NadD and eukaryotic
      NMNATs, but E. coli NadD strongly prefers NaMN.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The PAINT node PTN000247701 is seeded largely by eukaryotic NMNATs, which use NMN and NaMN. Purified
      E. coli NadD adenylylates NMN at least 20-fold more slowly than NaMN, so NMN adenylylation is real
      in vitro but of unknown physiological relevance. E. coli completes NMN-derived NAD+ through other
      enzymes, for example after NMN deamidation by PncC.
