  label: Escherichia coli K-12
description: >-
  NadD is the nicotinate mononucleotide adenylyltransferase of Escherichia coli K-12. It transfers the
  adenylyl group of ATP to nicotinate D-ribonucleotide (NaMN), forming deamido-NAD+ (nicotinate adenine
  dinucleotide, NaAD) and diphosphate, the penultimate step of NAD+ synthesis shared by the L-aspartate
  de novo route and Preiss-Handler salvage. The reaction is reversible and subject to product inhibition,
  and NaMN is adenylylated at least 20-fold faster than NMN. His-19, Arg-46 and Asp-109 were assigned
  to the active site, and nadD is essential for growth; hypomorphic alleles such as nadD72 (formerly fusB)
  lower NAD+ and NADPH synthesis and cause pleiotropic growth defects.
