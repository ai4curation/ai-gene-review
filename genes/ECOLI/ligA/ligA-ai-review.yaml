taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: LigA is the essential NAD-dependent DNA ligase of Escherichia coli. It seals adjacent 3′
  hydroxyl and 5′ phosphate DNA ends through an enzyme-adenylate intermediate, using NAD+ as the adenylate
  donor. LigA joins nicks after Okazaki-fragment maturation and during DNA repair, acting in the cytoplasm
  on chromosomal DNA. Its BRCT domain assists DNA binding but is not indispensable for nick sealing.
