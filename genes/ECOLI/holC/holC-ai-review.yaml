id: P28905
gene_symbol: holC
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: HolC is the chi accessory subunit of the Escherichia coli DNA polymerase III clamp loader.
  Together with psi, it links the loader to SSB-coated DNA and stabilizes productive replisome organization.
  Chi–SSB binding affects coupled strand synthesis and replisome stability, although it is not an obligatory
  step for every primer-utilization event. HolC also associates with the YoaA helicase in DNA-damage tolerance.
  It has no established intrinsic DNA-polymerizing activity.
