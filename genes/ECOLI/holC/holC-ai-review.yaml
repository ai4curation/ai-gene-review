    id: GO:0003887
    label: DNA-directed DNA polymerase activity
  evidence_type: IDA
  original_reference_id: PMID:9989506
  qualifier: enables
  review:
    summary: The DNA-polymerizing reaction of the holoenzyme is performed by DnaE alpha.
    action: REMOVE
    reason: PMID:9989506 assigns chi a primase-displacement/SSB-binding role that permits clamp assembly
      and subsequent polymerization by the holoenzyme. It does not identify chi as the nucleotide-incorporating
      enzyme. The later chi–SSB interface experiments support an accessory structural role. Remove the
      intrinsic polymerase claim while retaining direct replication participation and the SSB–loader adaptor
      function.
    supported_by:
    - reference_id: PMID:9989506
    - reference_id: PMID:21857649
    - reference_id: PMID:2997151
