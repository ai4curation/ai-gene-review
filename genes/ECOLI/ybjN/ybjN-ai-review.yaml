    label: negative regulation of single-species biofilm formation on inanimate substrate
  evidence_type: IMP
  original_reference_id: PMID:21980417
  qualifier: involved_in
  review:
    summary: >-
      CACAO IMP, and a good one. Crystal violet staining of 48 h biofilms on
      polyvinyl chloride microtitre plates (Fig. 6A, quantified in Fig. 6B)
      shows the ybjN deletion forming ~3-fold more biofilm than wild type and
      multicopy ybjN roughly halving it.
    action: ACCEPT
    reason: >-
      CACAO row, assessed against the paper. The term matches the assay on every
      axis: a pure culture of Escherichia coli (single species), an abiotic PVC
      surface (inanimate substrate), and a deletion mutant that makes more
      biofilm, which is what negative regulation means. The direction is taken
      from the loss-of-function strain, not from overexpression, so the
      dosage-artefact objection that defeats the growth row does not apply here,
