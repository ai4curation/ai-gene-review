id: P0AAY6
gene_symbol: ybjN
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  YbjN is a small (158 aa) cytoplasmic protein of Escherichia coli K-12 whose
  orthologs are confined to the Enterobacteriaceae and whose biochemistry is
  unknown. It carries no catalytic motif, no transmembrane segment and no
  signal peptide, and is classified only as a putative sensory transduction
  regulator (Pfam PF10722 YbjN, InterPro IPR019660). The one solved structure
  of the family, the Erwinia amylovora ortholog AmyR, is a homodimer with a
  class I type III secretion chaperone-like fold and no evidence of a secretion
  or catalytic role, suggesting that YbjN proteins act through specific
  protein-protein interactions. Functionally, YbjN behaves as a dosage-sensitive
  negative regulator of the Escherichia coli multicellular and surface-appendage
  programme: loss of ybjN raises type 1 fimbriation, swimming motility,
  flagellar gene expression (fliA and the FliA-dependent flgB, flgD, flgE, fliL,
  fliM), colanic acid capsule production and biofilm formation on abiotic
  surfaces, while extra copies of ybjN suppress all of these. The gene was
  originally isolated as a multicopy suppressor of the temperature-sensitive
  coaA (pantothenate kinase) allele in the ts9 strain, which led to the proposal
  that it stabilizes unstable proteins, and its expression is growth-phase- and
  temperature-dependent and induced under many stresses. Deletion of ybjN also
  causes a modest loss of survival after high-dose ionizing radiation. Whether
  YbjN works as a chaperone, as an adaptor feeding into the Rcs phosphorelay, or
  by some other route is not established.
