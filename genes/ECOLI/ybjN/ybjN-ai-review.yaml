    label: pilus assembly
  evidence_type: IMP
  original_reference_id: PMID:21980417
  qualifier: involved_in
  review:
    summary: >-
      CACAO IMP. The cited paper shows the opposite of what this term asserts:
      the ybjN deletion makes about three times MORE type 1 fimbriae than wild
      type by transmission electron microscopy (Fig. 3C), with fimD up 8-fold
      (Fig. 3D), while multicopy ybjN abolishes pili entirely. YbjN suppresses
      pilus formation; it is not part of the assembly machinery.
    action: MODIFY
    reason: >-
      CACAO row, assessed against the paper. The assay is the right one for an
      IMP and is unambiguously about this gene: Fig. 3C is TEM of BW25113,
      the ybjN mutant and the overexpression strain, Fig. 3D the matching fimD
      qRT-PCR, and the microarray (Table 1) adds fimC, fimD and fimG. But the
      direction is inverted. `involved_in pilus assembly` places YbjN among the
      proteins that build the pilus - the chaperone-usher components FimC and
      FimD - whereas the paper's own conclusion is that YbjN negatively
      regulates fimbriae formation by suppressing fimbrial gene expression. This
      is the taxonomy's "sign inverted" shape, and it cannot be repaired by
      substituting an existing term: GO has `GO:0009297 pilus assembly` and
      `GO:0140623 type I pilus assembly`, and regulation terms only for type IV
      pili (`GO:1903656`/`GO:1903657`), with no `regulation of pilus assembly`
      anywhere. The replacement is therefore proposed as a new term (see
      proposed_new_terms). `GO:0010629 negative regulation of gene expression`
      would be literally true of the fimD/fimC/fimG result but loses the pilus,
      and YbjN has never been shown to act on transcription directly, so it is
      not proposed.
