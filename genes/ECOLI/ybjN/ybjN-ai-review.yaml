    label: negative regulation of bacterial-type flagellum-dependent cell motility
  evidence_type: IMP
  original_reference_id: PMID:21980417
  qualifier: acts_upstream_of_or_within
  review:
    summary: >-
      EcoCyc IMP. Soft-agar (0.25%) migration assays (Fig. 4A, 4B) give
      migration diameters of 0.84 mm for wild type, 1.88 mm for the ybjN
      deletion and 0.41 mm for the overexpression strain, so loss of ybjN
      increases swimming motility.
    action: ACCEPT
    reason: >-
      Directly supported by the loss-of-function assay, with a reciprocal
      overexpression control and a mechanistic correlate in the 12.5- and
      11.3-fold induction of fliA and flgD in the mutant. The term's granularity
