- term:
    id: GO:1901914
    label: negative regulation of capsule organization
  evidence_type: IMP
  original_reference_id: PMID:21980417
  qualifier: involved_in
  review:
    summary: >-
      Proposed new annotation. On LB plus 700 mM NaCl the ybjN deletion is
      strongly mucoid, characteristic of colanic acid over-production, while
      multicopy ybjN makes colonies non-mucoid and additionally suppresses the
      mucoid phenotype of ackA and ackA/rcsC mutants (Fig. 5A, 5B). The authors
      conclude that YbjN negatively regulates capsule formation.
    action: NEW
    reason: >-
      This is the one well-supported phenotype from the ybjN paper that no GOA
      row captures, and it is of exactly the same kind and strength as the
      biofilm and flagellar rows that are accepted above: a loss-of-function
      mucoidy phenotype with a reciprocal multicopy control, plus a genetic
      epistasis test in which extra ybjN suppresses the constitutive mucoidy of
      ackA and ackA/rcsC. On the participation test, YbjN is being annotated as
      a regulator and not as a biosynthetic enzyme, which is what
      `GO:1901914 negative regulation of capsule organization` asserts; the
      colanic acid synthases themselves carry the biosynthetic terms. The sign
      is independently reproduced in the ortholog: deleting ybjN/amyR in Erwinia
      amylovora raises amylovoran exopolysaccharide about eight-fold. The more
      specific `GO:0062084 regulation of capsule polysaccharide biosynthetic
      process` has only a positive child, so `GO:1901914` is the most specific
      term of the right sign available. Kept deliberately at capsule
      organization rather than asserting a mechanism, since whether YbjN acts
      through RcsB phosphorylation is speculation in the paper.
    supported_by:
    - &capsule
      reference_id: PMID:21980417
      supporting_text: >-
        These observations indicate that YbjN negatively regulates capsule
        formation.
      reference_section_type: RESULTS
    - &amyr
      reference_id: PMID:23028751
      supporting_text: >-
        a mutation of ybjN gene in E. amylovora, an ortholog of E. coli ybjN
        gene, results in about eight-fold more amylovoran than that of the wild
        type strain, suggesting that this gene may act as a negative regulator
        of amylovoran production
      reference_section_type: INTRODUCTION
    additional_reference_ids:
    - PMID:23028751
