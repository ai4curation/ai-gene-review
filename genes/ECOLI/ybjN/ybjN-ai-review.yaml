core_functions:
- description: >-
    Dosage-dependent negative regulator of the Escherichia coli surface-appendage
    programme: YbjN restrains expression of the flagellar regulon (fliA and the
    FliA-dependent structural and assembly genes) and of the fim chaperone-usher
    genes, so loss of ybjN raises flagellar gene expression, swimming motility
    and type 1 fimbriation, and extra copies abolish them. The molecular activity
    through which it does this is unknown, so no molecular function term is
    asserted; the fimbrial arm of this activity needs the proposed
    "negative regulation of pilus assembly" term.
  directly_involved_in:
  - id: GO:1902209
    label: negative regulation of bacterial-type flagellum assembly
  - id: GO:1902201
    label: negative regulation of bacterial-type flagellum-dependent cell motility
  supported_by:
  - *fimneg
  - *fligconc
  - *motilityconc
  - *flistruct
- description: >-
    Negative regulation of the Escherichia coli extracellular-matrix programme:
    YbjN suppresses colanic acid capsule production and biofilm formation on
    abiotic surfaces, and multicopy ybjN overrides even the constitutive mucoidy
    of ackA and ackA/rcsC mutants, placing it upstream of or parallel to the Rcs
    phosphorelay output.
  directly_involved_in:
  - id: GO:1900232
    label: negative regulation of single-species biofilm formation on inanimate substrate
  - id: GO:1901914
    label: negative regulation of capsule organization
  supported_by:
  - *biofilmconc
  - *capsule
  - *amyr
proposed_new_terms:
- proposed_name: negative regulation of pilus assembly
  proposed_definition: >-
    Any process that stops, prevents or reduces the frequency, rate or extent of
    pilus assembly, the assembly of a pilus or fimbria on the surface of a
    bacterial cell.
  justification: >-
    GO has `GO:0009297 pilus assembly` and `GO:0140623 type I pilus assembly`,
    but regulation terms exist only for type IV pili
    (`GO:1903656 regulation of type IV pilus biogenesis` and its positive and
    negative children). There is therefore no term for a protein that suppresses
    chaperone-usher (type 1) fimbriation, which is what E. coli YbjN does:
    deleting ybjN gives about three times more fimbriae by TEM and raises fimC,
    fimD and fimG, while multicopy ybjN abolishes pili. The absence of such a
    term is why the existing annotation landed on the unregulated parent
    `GO:0009297`, asserting the opposite of the observed phenotype. A term at
    the general `pilus assembly` level is proposed rather than a type-1-specific
    one so that it can also serve the regulators of other chaperone-usher and
    curli-type appendages; if GO prefers the specific level, a sibling
    "negative regulation of type I pilus assembly" under `GO:0140623` would also
    fit this gene.
  proposed_parent:
    id: GO:0051129
    label: negative regulation of cellular component organization
  supported_by:
  - *fimbriae
  - *nopili
  - *fimneg
  - *fimgenes
suggested_questions:
- question: >-
    Does YbjN act as a chaperone or holdase on specific partner proteins, as the
    class I type III secretion chaperone-like fold of its Erwinia ortholog AmyR
    and the multicopy suppression of unstable CoaA alleles both suggest, and if
    so what are its clients in Escherichia coli?
  experts:
  - Stefano Benini
  - Joseph D Bartho
  - Bing Zhou
- question: >-
    Is the suppression of fimbrial, flagellar and colanic acid gene expression
    by YbjN exerted through the Rcs phosphorelay - for example by affecting RcsB
    phosphorylation, as proposed from the suppression of ackA/rcsC mucoidy - or
    through an independent route?
  experts:
  - Youfu Zhao
  - Dongping Wang
- question: >-
    How much of the YbjN overexpression phenotype (slowed growth, acid
    susceptibility, induction of mqsR/ygiT and relE/relB) reflects a genuine
    physiological activity at native dosage, and how much is titration of a
    partner by excess YbjN?
  experts:
  - Youfu Zhao
- question: >-
    By what mechanism does loss of ybjN reduce survival of high-dose ionizing
    radiation, given that no DNA-repair or oxidative-defence activity has been
    assigned to YbjN and the effect is modest?
  experts:
  - Michael M Cox
  - Robert T Byrne
- question: >-
    Is the two-hybrid interaction between YbjN and the YpjF toxin
    (UniProtKB:Q46953) physiologically relevant, and does it explain the
    toxin-antitoxin induction seen on ybjN overexpression?
  experts:
  - Peter Uetz
  - Seesandra V Rajagopala
suggested_experiments:
- hypothesis: >-
    YbjN acts as a chaperone-like protein that binds and stabilizes one or a few
    specific partner proteins, and its regulatory effects on fimbriae, flagella
    and capsule are indirect consequences of that binding.
  description: >-
    Identify YbjN's in vivo partners without relying on two-hybrid: express
    chromosomally tagged YbjN at native levels in Escherichia coli K-12 and
    perform affinity purification followed by mass spectrometry, in parallel
    with in vivo crosslinking (for example DSSO or photo-crosslinking with an
    incorporated unnatural amino acid) to capture transient clients, under both
    unstressed and stress conditions where ybjN is induced. Validate candidates
    by reciprocal pull-down and by testing whether purified YbjN suppresses
    thermal aggregation of the candidate in vitro.
  experiment_type: affinity purification mass spectrometry and in vivo crosslinking
- hypothesis: >-
    YbjN suppresses the fimbrial, flagellar and colanic acid regulons by acting
    on the Rcs phosphorelay rather than by binding DNA.
  description: >-
    Combine a ybjN deletion and a multicopy ybjN plasmid with rcsB, rcsC, rcsD
    and rcsF deletions and measure mucoidy, fimD/fliA/wca transcript levels and
    biofilm formation in each background, to establish whether the YbjN effect
    requires the Rcs system. In the same strains, measure RcsB phosphorylation
    directly by Phos-tag electrophoresis, and test whether YbjN binds RcsB or
    RcsD by purified-protein assays. Independently, run ChIP-seq on tagged YbjN
    to test for the direct DNA binding that a "sensory transduction regulator"
    name implies but that has never been demonstrated.
  experiment_type: epistasis analysis with phosphorylation and ChIP-seq readouts
- hypothesis: >-
    The slowed growth seen on multicopy ybjN is a titration artefact of excess
    protein, not a physiological growth-regulatory function of YbjN.
  description: >-
    Replace the multicopy plasmid with a chromosomally integrated, titratable
    promoter (for example an arabinose-inducible single copy) and measure growth
    rate, toxin-antitoxin transcript levels and fimbriation as a continuous
    function of YbjN level, including levels within the physiological range
    observed between log and stationary phase and between 28 and 42 degrees. If
    the growth effect appears only above the natural maximum while fimbrial and
    flagellar suppression tracks the physiological range, the growth phenotype
    is a dosage artefact.
  experiment_type: titratable single-copy expression series
- hypothesis: >-
    Escherichia coli YbjN has the same fold and dimerization behaviour as
    Erwinia amylovora AmyR, and the surface residues that differ between them
    determine partner specificity.
  description: >-
    Solve the structure of E. coli YbjN itself by crystallography or cryo-EM and
    compare it with AmyR (PDB 5FRK), then test the functional importance of the
    divergent surface residues and the dimer interface by mutating them in the
    chromosomal copy and scoring fimbriation, motility, mucoidy and biofilm
    formation, together with cross-complementation between the E. coli and
    E. amylovora orthologs.
  experiment_type: structure determination with structure-guided mutagenesis
