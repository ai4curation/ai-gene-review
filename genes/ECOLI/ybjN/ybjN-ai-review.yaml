- term:
    id: GO:0010212
    label: response to ionizing radiation
  evidence_type: IMP
  original_reference_id: PMID:25049088
  qualifier: acts_upstream_of_or_within
  review:
    summary: >-
      EcoCyc IMP. Byrne et al. identified ybjN by transposon-directed insertion
      sequencing as required for survival of high-dose ionizing radiation and
      validated it with a clean deletion and survival curves, where it falls in
      the mildest validated class (group 1, under ~1 log loss at 2,000 Gy).
    action: KEEP_AS_NON_CORE
    reason: >-
      This is genuine loss-of-function evidence from a professional curation
      source: the gene was both screened and individually validated (Fig. 2),
      and the paper explicitly flags it as one of the uncharacterized genes for
      which this is the first phenotype. `acts_upstream_of_or_within` is the
      right relation for a survival phenotype whose mechanism is unknown, and
      the term is at the granularity the data support. It is kept as non-core
      rather than accepted because the effect is at the bottom of the validated
      range and is one of several stress-survival phenotypes of a gene that is
      induced under many stresses; the defining, reproducible role of YbjN is
      dosage-dependent negative regulation of the surface-appendage and
      multicellular programme, not a radiation-specific function. No DNA-repair
      or oxidative-defence activity has been shown for YbjN, and the paper's own
      framing is a broad stress role.
    supported_by:
    - &irgroup1
      reference_id: PMID:25049088
      supporting_text: >-
        The genes in group 1 ( rdgC , ftsP , radA , rsxB , topB , recX , speA ,
        yabI , yhgF , ybjN , tolA , and ompA ) exhibit relatively modest effects
        when deleted, with a decline in survival of just over an order of
        magnitude or less at 2,000 Gy.
      reference_section_type: RESULTS
    - &irmodest
      reference_id: PMID:25049088
      supporting_text: >-
        In three cases ( yabI , yhgF , and ybjN ), elimination of gene function
        has just a modest effect on IR survival and the genes fall into group 1.
      reference_section_type: DISCUSSION
- term:
    id: GO:0030308
    label: negative regulation of cell growth
  evidence_type: IMP
  original_reference_id: PMID:21980417
  qualifier: involved_in
  review:
    summary: >-
      CACAO IMP. The growth experiment (Fig. 2A) shows the ybjN deletion growing
      indistinguishably from wild type (rate constants 2.28 vs 2.26); only the
      multicopy overexpression strain is slowed (1.72). The claim rests entirely
      on a gene-dosage artefact, and the process measured is population growth
      rate, not cell growth in GO's sense.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      CACAO row, assessed against the paper. Two problems compound. First, the
      evidence code is IMP (ECO:0000315, mutant phenotype) but the mutant has no
      phenotype here: the authors state that BW and the ybjN mutant have similar
      growth curves, and the only effect comes from ~20-fold overexpression off
      a multicopy plasmid, which also induces the mqsR/ygiT and relE/relB
      toxin-antitoxin pairs 15.8-, 9.9-, 5.6- and 3.1-fold, so the authors
      themselves attribute the slowing to a toxin-antitoxin imbalance rather
      than to a physiological YbjN activity. Second, `GO:0030308` regulates
      `GO:0016049 cell growth`, the increase in cell size or mass, whereas the
      assay measures OD600 and exponential-phase rate constants, i.e.
      population proliferation; even taken at face value the measurement would
      fit `GO:0045967 negative regulation of growth rate` rather than this term.
      MARK_AS_OVER_ANNOTATED rather than REMOVE because YbjN does restrain
      growth-coupled processes when present at elevated levels and the
      over-expression observation is real; but no replacement term is proposed,
      since nothing in the loss-of-function data supports a growth-regulatory
      role for YbjN at native dosage. For the CACAO taxonomy this is a shape not
      previously catalogued: an overexpression-only phenotype annotated as the
      gene's process on a mutant-phenotype evidence code.
    supported_by:
    - &growthsame
      reference_id: PMID:21980417
      supporting_text: >-
        both BW and ybjN mutant showed a similar growth curves and growth rate
        constants for BW and the ybjN mutant were 2.26 and 2.28, respectively,
        compared to 1.72 for ybjN over-expressing strains grown in LB broth
      reference_section_type: RESULTS
    - &growthoe
      reference_id: PMID:21980417
      supporting_text: >-
        These results indicate that over-expression of ybjN slowed bacterial
        growth in E. coli.
      reference_section_type: RESULTS
- term:
