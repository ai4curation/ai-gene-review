gene_symbol: nuoN
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  NuoN is a 14-transmembrane-helix integral inner (cytoplasmic) membrane subunit of
  the proton-translocating NADH:quinone oxidoreductase NDH-1 (respiratory complex I),
  the homologue of mitochondrial ND2 (complex I subunit 2 family). It is the
  antiporter-like subunit closest to the junction of the membrane and peripheral
  arms, flanked by the small membrane subunits NuoA/J/K on one side and NuoM on the
  other. Like NuoL and NuoM it is built from two inverted five-helix repeats that
  each form a proton half-channel, linked by conserved charged residues (including
  a key lysine, Lys395, in the second half-channel and Glu133 in the first). NuoN
  carries no redox cofactor; it transmits the conformational and electrostatic
  signal generated by quinone reduction at the peripheral/membrane-arm interface
  along the membrane arm and contributes to proton translocation, so that the
  complex pumps four protons per two electrons transferred from NADH to quinone.
  NuoN also interacts with the long lateral helix of NuoL and is required for
  assembly of a functional complex and for efficient respiratory growth.
