- term:
    id: GO:0050136
    label: NADH dehydrogenase (quinone) (non-electrogenic) activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: enables
  supporting_entities:
  - UniRule:UR000060644
  review:
    summary: >-
      The non-electrogenic NADH:quinone oxidoreductase term contradicts the defining
      property of NDH-1, which couples quinone reduction to proton translocation.
    action: REMOVE
    reason: >-
      GO:0050136 (RHEA:46160, NADH + H+ + a quinone = NAD+ + a quinol) is the
      non-electrogenic reaction, typified in E. coli by the separate type II NADH
      dehydrogenase (NDH-2, Ndh), whose turnover does not generate a proton gradient.
      NDH-1, of which NuoN is a subunit, is electrogenic and translocates four protons
      per two electrons, the reaction captured by GO:0008137 (RHEA:29091). The
      UniRule mapping to GO:0050136 is therefore demonstrably wrong for this complex
      and the electrogenic activity is already represented by the GO:0008137 rows.
    supported_by:
    - reference_id: PMID:3122832
      supporting_text: an enzyme (NADH dh II) that reacts with NADH exclusively whose
        turnover does not lead to generation of a H+ electrochemical gradient
    - reference_id: file:ECOLI/nuoN/nuoN-uniprot.txt
      supporting_text: Couples the redox reaction to proton translocation (for every
        two electrons transferred, four hydrogen ions are translocated across the
        cytoplasmic membrane), and thus conserves the redox energy in a proton gradient.
