    label: electron transport coupled proton transport
  - id: GO:0022904
    label: respiratory electron transport chain
  in_complex:
    id: GO:0045271
    label: respiratory chain complex I
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:23864658
    supporting_text: Our mutation study on NLys(395) suggests that this residue participates
      in the proton translocation.
  - reference_id: PMID:12718520
    supporting_text: the gene for subunit N was disrupted by a 163 bp deletion in the
      chromosome, resulting in the loss of Complex I function, as measured by
      deamino-NADH oxidase activity
  - reference_id: PMID:21822288
    supporting_text: Each repeat includes a discontinuous transmembrane helix and forms
      half of a channel across the membrane.
suggested_questions:
- question: >-
    Do protons pumped through NuoN exit via its own periplasmic half-channel, or is
    NuoN's role primarily to relay electrostatic changes toward NuoL, from which
    protons have been proposed to exit exclusively?
- question: >-
    Does NuoN interact directly with quinone, as suggested by increased
    decylubiquinone inhibition of NuoN point mutants, or is that effect indirect via
    long-range coupling to the quinone site?
