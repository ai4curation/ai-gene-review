    Antiporter-like membrane-arm subunit of NDH-1 (complex I), adjacent to the
    arm junction, that contributes a proton-translocation module and relays
    redox-driven conformational/electrostatic changes along the membrane arm,
    contributing to NADH:quinone oxidoreduction coupled to proton pumping.
  contributes_to_molecular_function:
    id: GO:0008137
    label: NADH dehydrogenase (ubiquinone) activity
  directly_involved_in:
