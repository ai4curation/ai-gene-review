id: P0A6I9
gene_symbol: coaE
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  coaE (yacE, b0103) encodes dephospho-CoA kinase, a P-loop nucleotide kinase that phosphorylates the
  3'-hydroxyl of the ribose of 3'-dephospho-CoA with ATP to form coenzyme A, the final step of CoA biosynthesis
  in Escherichia coli. The recombinant enzyme is a 22.6 kDa monomer that can also form trimers; it has
  low side activity toward adenosine, AMP and adenosine phosphosulfate. coaE was identified by homology
  to the purified Corynebacterium ammoniagenes enzyme, and E. coli PPAT lacks this activity, so the last
  two CoA steps are carried out by separate CoaD and CoaE proteins.
