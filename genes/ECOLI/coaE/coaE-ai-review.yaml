suggested_questions:
- question: >-
    Is dephospho-CoA kinase activity limiting for CoA synthesis in E. coli given its relatively high Km
    for dephospho-CoA?
suggested_experiments:
- description: >-
    Titrate coaE expression in a regulated strain and measure dephospho-CoA accumulation and CoA pools
    to determine whether CoaE controls flux.
  experiment_type: regulated expression with metabolomics
