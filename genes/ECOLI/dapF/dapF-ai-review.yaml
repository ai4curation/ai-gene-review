taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: DapF (diaminopimelate epimerase) is a cofactor-independent, two-cysteine racemase-family
  enzyme that catalyses the stereoinversion of LL-2,6-diaminopimelate to meso-2,6-diaminopimelate in Escherichia
  coli. meso-DAP is both the substrate of LysA in the terminal step of L-lysine biosynthesis and a component
  of the peptidoglycan stem peptide. The cytosolic enzyme is a functional homodimer. DapF also binds the
  RNA pyrophosphohydrolase RppH and stimulates its activity, a secondary role in mRNA turnover.
