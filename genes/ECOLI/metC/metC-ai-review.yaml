suggested_questions:
- question: Under what physiological conditions (cysteine excess, oxidative stress, metJ derepression)
    do the cysteine desulfhydrase and alanine racemase side activities of MetC carry significant flux in
    wild-type E. coli, compared with tryptophanase and Alr/DadX?
- question: Is the L-cystine-cleaving activity of MetC, whose Vmax is similar to that with cystathionine,
    used in vivo, for example in cystine detoxification or sulfide production?
suggested_experiments:
- description: Compare kcat/KM of purified MetC for L-cystathionine, L-cysteine, L-cystine and L-alanine
