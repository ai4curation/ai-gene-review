id: P06721
gene_symbol: metC
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  metC (b3008) encodes cystathionine beta-lyase (beta-cystathionase, EC 4.4.1.13), a cytoplasmic
  pyridoxal 5'-phosphate-dependent enzyme of the gamma-family of PLP enzymes (trans-sulfuration
  enzyme family). MetC catalyses the second step of forward trans-sulfuration in de novo L-methionine
  biosynthesis, cleaving the C(beta)-S bond of L-cystathionine to give L-homocysteine, pyruvate and
  ammonium; homocysteine is then methylated to methionine by MetE or MetH. The enzyme acts on a range
  of S-substituted L-cysteines, including L-cystine with a Vmax similar to that for cystathionine, and
  is competitively inhibited by L-cysteine. Each subunit binds PLP as a Schiff base with Lys210, and
  the protein is a homotetramer (dimer of dimers) whose N-terminal domain contributes to the active
  site of the neighbouring subunit. metC belongs to the MetJ-repressed methionine regulon and is
  homologous to cystathionine gamma-synthase MetB, which catalyses the preceding step. MetC also has
  side activities with in vivo consequences. It releases sulfide from L-cysteine (cysteine
  desulfhydrase), contributing with tryptophanase and other enzymes to cysteine degradation, and it
  has alanine racemase and serine dehydratase activities in vitro. When overproduced in a metJ mutant,
  its alanine racemase activity can replace the dedicated racemases Alr and DadX for D-alanine supply.
