- id: PMID:7049234
  title: Cloning, purification, and characterization of beta-cystathionase from Escherichia coli.
  findings:
  - statement: Purified MetC (specific activity 215 IU/mg) is a PLP enzyme whose substrate specificity
      and kinetics were characterised; the native protein was estimated at 280 kDa.
    supporting_text: This enzyme is characterized as to molecular weight (280 000), number of subunits
      (six), pyridoxal phosphate binding
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only cache. The kinetics (KM cystathionine 0.04 mM, cystine 0.25 mM) are taken
      from the UniProt record, which cites this paper with ECO:0000269. The six-subunit estimate is superseded
      by the tetrameric crystal structure (PMID:8831789).
- id: PMID:3513164
  title: 'Evolution in biosynthetic pathways: two enzymes catalyzing consecutive steps in methionine biosynthesis
    originate from a common ancestor and possess a similar regulatory region.'
  findings:
  - statement: metC encodes a 395-residue beta-cystathionase homologous to MetB and preceded by a MetJ-regulated
      Met box.
    supporting_text: The deduced amino acid sequence of beta-cystathionase showed extensive homology with
      that of the MetB protein (cystathionine gamma-synthase) that catalyzes the preceding step in methionine
      biosynthesis.
    full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only cache; PMC322971 is a scanned article with no extractable text. Supports
      gene identity. The oligomer and activity claims behind its GOA rows are not visible in the abstract.
- id: PMID:8831789
  title: Crystal structure of the pyridoxal-5'-phosphate dependent cystathionine beta-lyase from Escherichia
    coli at 1.83 A.
  findings:
  - statement: MetC is a homotetramer of three-domain subunits with PLP bound at Lys210; the N-terminal
      domain completes the neighbouring active site, and the enzyme cleaves C(beta)-S bonds of many substrates.
    supporting_text: Cystathionine beta-lyase (CBL) is a member of the gamma-family of PLP-dependent enzymes,
      that cleaves C beta-S bonds of a broad variety of substrates.
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
- id: PMID:8663055
  title: Studies on the synthesis of the Fe-S cluster of dihydroxy-acid dehydratase in escherichia coli
    crude extract. Isolation of O-acetylserine sulfhydrylases A and B and beta-cystathionase based on their
    ability to mobilize sulfur from cysteine and to participate in Fe-S cluster synthesis.
  findings:
  - statement: Beta-cystathionase mobilises sulfide from L-cysteine in vitro, as a minor variation of its
      cystathionine cleavage reaction.
    supporting_text: Sulfur mobilization by beta-cystathionase does not require a nucleophile
    full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: In vitro sulfur-mobilisation study. It does not show that MetC supplies sulfur for Fe-S
      clusters in vivo, so no Fe-S assembly process is proposed.
- id: PMID:12883870
  title: Effect of cysteine desulfhydrase gene disruption on L-cysteine overproduction in Escherichia coli.
  findings:
  - statement: metC disruption removes one of two cysteine desulfhydrase activities and increases L-cysteine
