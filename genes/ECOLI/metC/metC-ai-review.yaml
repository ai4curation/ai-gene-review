- term:
    id: GO:0008784
    label: alanine racemase activity
  evidence_type: IDA
  original_reference_id: PMID:29592871
  qualifier: enables
  review:
    summary: Miyamoto et al. (2018) showed that purified MetC (and MalY) racemise amino acids, produce
      non-canonical D-amino acids and also have D-/L-serine dehydratase and cysteine lyase activity.
      Independently, Kang et al. (2011) found that metJ point mutations that derepress the methionine
      regulon allow an alr dadX double mutant to grow without D-alanine, attributing this to alanine
      racemase coactivity of MetC.
    action: KEEP_AS_NON_CORE
    reason: Judged with the promiscuous-activity tiers. The activity is real (two independent groups,
      in vitro and in vivo) and has a demonstrated in vivo consequence, so it is not noise and REMOVE
      is not warranted. It is not the evolved function, however. E. coli has two dedicated alanine
      racemases (Alr, DadX), and the MetC racemase activity only becomes growth-relevant when both are
      deleted and MetC is derepressed. This is a genuine but latent (underground) secondary activity,
      kept as non-core rather than marked over-annotated because the physiological rescue shows it can
      carry flux. The cached abstracts do not give a rate relative to the dedicated racemases.
    supported_by:
    - reference_id: PMID:29592871
      supporting_text: We characterised amino acid racemase, Ser dehydratase and cysteine lyase activities,
        and all were higher for MetC.
    - reference_id: PMID:21193606
      supporting_text: provide evidence for significant alanine racemase coactivity of the E. coli cystathionine
        beta-lyase (MetC)
    - reference_id: PMID:21193606
      supporting_text: D-Alanine synthesis in Escherichia coli is carried out by two different alanine
        racemases encoded by the alr and dadX genes.
