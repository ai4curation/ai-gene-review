core_functions:
- description: PLP-dependent cystathionine beta-lyase (EC 4.4.1.13), which cleaves L-cystathionine
    to L-homocysteine, pyruvate and NH4+. This is the second step of forward trans-sulfuration, supplying
    homocysteine for de novo methionine synthesis in the cytoplasm. The enzyme is a homotetramer and
    also acts on other S-substituted L-cysteines, including L-cystine.
