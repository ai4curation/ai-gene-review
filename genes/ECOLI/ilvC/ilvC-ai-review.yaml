id: P05793
gene_symbol: ilvC
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  IlvC is the ketol-acid reductoisomerase (KARI, acetohydroxy acid
  isomeroreductase) of Escherichia coli, a cytoplasmic homotetrameric enzyme of
  the long (class II) form, with an N-terminal Rossmann NADPH-binding domain and
  a duplicated C-terminal knotted domain. It catalyses the second step of the
  shared valine/isoleucine biosynthetic trunk at a single active site: a
  Mg2+-dependent alkyl migration followed by NADPH-dependent reduction, turning
  (S)-2-acetolactate into (R)-2,3-dihydroxyisovalerate and
  2-aceto-2-hydroxybutanoate into (2R,3R)-2,3-dihydroxy-3-methylpentanoate. The
  isomerisation requires two Mg2+ ions bridged by a hydroxide. Its reductase
  half-reaction accepts other 2-keto acids, including 2-ketopantoate, so IlvC
  also contributes ketopantoate reductase activity to pantothenate synthesis
  alongside the dedicated PanE. Expression is activated by IlvY in the presence
  of its substrates.
