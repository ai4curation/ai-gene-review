- term:
    id: GO:0008677
    label: 2-dehydropantoate 2-reductase activity
  evidence_type: IDA
  original_reference_id: PMID:15654896
  qualifier: enables
  review:
    summary: The reductase half-reaction of IlvC reduces 2-ketopantoate, a genuine secondary
      activity.
    action: KEEP_AS_NON_CORE
    reason: Purified E. coli KARI reduces 2-ketopantoate with a Km (0.17 mM) comparable
      to that for acetolactate but about ten-fold lower Vmax. Genetics show the activity
      matters in vivo, since only an ilvC panE double mutant lacks ketopantoate reductase
      activity (PMID:10553653). This is a real secondary activity that supplements
      the dedicated PanE, not the evolved function, hence non-core rather than over-annotated.
    supported_by:
    - reference_id: PMID:15654896
      supporting_text: The reductase activity is shown to be relatively nonspecific
        and is capable of utilizing a variety of 2-ketoacids.
    - reference_id: file:ECOLI/ilvC/ilvC-uniprot.txt
      record_section: ["CC:BIOPHYSICOCHEMICAL PROPERTIES"]
      supporting_text: KM=0.17 mM for 2-ketopantoate (at pH 8 and 37 degrees Celsius)
    - reference_id: PMID:10553653
