taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: 'LysC is the monofunctional, lysine-sensitive aspartokinase III of Escherichia coli. It phosphorylates
  L-aspartate with ATP to produce 4-phospho-L-aspartate, supplying the shared pathway toward diaminopimelate/lysine
  and homoserine-derived amino acids. The active enzyme is dimeric; lysine promotes an inhibitory conformational
  transition and tetramer formation. Its regulation differs from that of the ThrA and MetL bifunctional isozymes.'
