- id: PMID:14623187
  title: Site-directed mutagenesis of Escherichia coli acetylglutamate kinase and aspartokinase III
    probes the catalytic and substrate-binding mechanisms of these amino acid kinase family enzymes
    and allows three-dimensional modelling of aspartokinase.
  findings:
  - statement: AKIII is a lysine-inhibited homodimer; C-terminal truncation disrupts its assembly
      and activity.
    supporting_text: "AKIII is\nhomodimeric and is inhibited by lysine."
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Direct E. coli AKIII experiments are distinguished from parallel N-acetylglutamate
      kinase experiments in this abstract. The native AKIII truncation supports an assembly
      requirement; residues belonging to NAGK must not be transferred wholesale.
- id: PMID:18304323
  title: Protein abundance profiling of the Escherichia coli cytosol.
  findings:
  - statement: The study identified proteins from the native MC4100 cytosolic fraction using
      complementary mass-spectrometry approaches.
    supporting_text: "we identified 1103 proteins from the cytosolic fraction of the Escherichia coli\n\
      strain MC4100."
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Native E. coli MC4100 fractionation and LC-MS/MS cytosolic proteomics. The full
      article establishes the study method; individual target peptide assignments in the
      supplemental table were not independently reinspected. Preserve the curator-assigned target
      localization without presenting the paper-wide quote as a newly checked target hit.
- id: PMID:4360904
  title: 'Subunit structure of aspartokinase 3 of Escherichia coli K12.'
  findings: []
  reference_review:
    relevance: HIGH
    correctness: UNVERIFIED
    review_notes: Correct native AKIII subunit-structure citation, but only bibliographic
      information is cached. Assembly conclusions are independently supported by PMID14623187 and
      PMID16905770 rather than reconstructed from the title.
- id: PMID:6249791
  title: 'Regulation of aspartokinase III synthesis in Escherichia coli: isolation of mutants containing
    lysC-lac fusions.'
  findings:
  - statement: Expression from lysC-lac fusions responds to lysine and arginine.
    supporting_text: In these, the expression of beta-galactosidase was regulated by lysine (and
      arginine), as previously described for aspartokinase III.
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Native lysC-lac fusion experiment establishes regulation of synthesis. It is not a
      purified-enzyme kinetic or direct allosteric-binding assay; shared precursor catalysis has
      independent support.
- id: PMID:16905770
  title: Structures of R- and T-state Escherichia coli aspartokinase III. Mechanisms of the
    allosteric transition and inhibition by lysine.
  findings:
  - statement: Lysine feedback drives a regulatory transition involving the T-state tetramer.
    supporting_text: "Lysine-induced allosteric transition in AKIII involves both destabilizing the\n\
      R-state and stabilizing the T-state tetramer."
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Direct E. coli AKIII structures distinguish substrate/product-bound R state from
      lysine-bound T state. Tetramerization belongs to the inhibited transition and must not replace
      the active homodimer with an obligatorily active tetramer.
