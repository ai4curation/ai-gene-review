  review:
    action: MODIFY
    summary: LysC phosphorylates aspartate before the lysine and homoserine biosynthetic branches
      diverge.
    reason: The aspartokinase reaction characterized in PMID:16905770 produces aspartyl phosphate at
      the shared entry to the aspartate pathway. Lysine feedback identifies the regulated isozyme,
      not an exclusively lysine-directed product. The retained lysine and homoserine biosynthesis
      terms describe the specific branches served by this reaction.
    supported_by:
    - reference_id: PMID:16905770
      supporting_text: "Aspartokinase III (AKIII) from Escherichia coli catalyzes an initial commitment\n\
        step of the aspartate pathway, giving biosynthesis of certain amino acids\nincluding lysine."
    proposed_replacement_terms:
    - id: GO:0009090
      label: L-homoserine biosynthetic process
    - id: GO:0009085
      label: L-lysine biosynthetic process
