id: P06610
gene_symbol: btuE
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  BtuE is a 183-residue, selenium-independent member of the glutathione peroxidase
  (GPX) fold family (PANTHER PTHR11592, subfamily SF40 "thioredoxin/glutathione
  peroxidase BtuE"; HAMAP MF_02061) that functions as a thiol-dependent peroxide
  reductase. It carries the GPX active-site motif with a peroxidatic cysteine
  (Cys37) in place of the selenocysteine of animal GPX1-4. Purified BtuE reduces
  hydrogen peroxide and organic hydroperoxides (cumene hydroperoxide, tert-butyl
  hydroperoxide, linoleic acid hydroperoxide), using thioredoxin A or C as the
  preferred electron donor; glutathione can also serve as reductant, but less
  effectively. It is most active, relative to the peroxiredoxin Bcp, on the fatty
  acid hydroperoxide, suggesting lipid hydroperoxides as physiological substrates.
  btuE expression rises in stationary phase and on exposure to tellurite,
  menadione and H2O2. Loss of btuE raises intracellular ROS, protein carbonylation
  and lipid peroxidation and sensitises cells to tellurite, chromate and H2O2,
  most clearly in a catalase/AhpC-deficient (Hpx-) background under aerobic
  growth; overproduction has the opposite effect. Although btuE lies between
  btuC and btuD in the btuCED operon, nonpolar in-frame deletions show it is
  not needed for vitamin B12 transport or utilisation. Its subcellular location
  is unsettled: early fractionation released part of the protein by osmotic
  shock, but the sequence lacks a signal peptide and its preferred reductants
  are cytoplasmic thioredoxins.
existing_annotations:
- term:
    id: GO:0000302
    label: response to reactive oxygen species
  evidence_type: IMP
  original_reference_id: PMID:21264338
  qualifier: acts_upstream_of_or_within
  review:
    summary: >-
      Arenas et al. 2011 showed that a btuE deletion raises intracellular ROS,
      protein carbonyls and lipid peroxidation products and increases
      sensitivity to tellurite, chromate and H2O2; complementation restores
      resistance and overexpression lowers ROS.
    action: ACCEPT
    reason: >-
      The loss-of-function and complementation data are direct, in-species
      evidence that BtuE contributes to the cellular defence against ROS. This
      fits its demonstrated peroxide-reductase activity: BtuE itself removes
      the oxidant, so this is participation, not just a downstream phenotype.
      The more precise process term for the enzyme's own work is cellular
      oxidant detoxification (GO:0098869), which is also accepted below. This
      term is kept because it records the mutant phenotype evidence.
    supported_by:
    - reference_id: PMID:21264338
      supporting_text: Genetic complementation of E. coli ΔbtuE restored toxicant resistance to
        levels exhibited by the wild type strain.
    - reference_id: PMID:21264338
      supporting_text: Similar results were observed when protein carbonylation was assessed
        (Table 3), suggesting that BtuE could participate in the response to oxidative stress
        by lowering cytoplasmic ROS levels.
