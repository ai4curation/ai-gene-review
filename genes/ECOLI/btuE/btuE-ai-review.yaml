suggested_questions:
- question: Is BtuE cytoplasmic or periplasmic? It lacks a signal peptide and uses cytoplasmic
    thioredoxins, yet early maxicell fractionation released part of it by osmotic shock.
- question: Does BtuE use a peroxidatic/resolving cysteine pair (Cys37 with Cys84 or Cys65) like
    the thioredoxin-dependent yeast GPX-like peroxiredoxins, and what are its kinetic constants
    toward lipid hydroperoxides versus H2O2?
- question: Is btuE induction by H2O2 OxyR-dependent, as the putative OxyR box in its promoter suggests?
suggested_experiments:
- hypothesis: BtuE is a cytoplasmic enzyme.
  description: Fractionate chromosomally tagged BtuE (native expression) into cytoplasmic and periplasmic
    fractions with compartment markers, or use PhoA/GFP fusion topology reporters.
  experiment_type: subcellular fractionation
- hypothesis: Cys37 is the peroxidatic cysteine and a second cysteine resolves it in a thioredoxin-dependent
    atypical 2-Cys mechanism.
  description: Measure steady-state kinetics of wild-type and Cys-to-Ser BtuE variants with TrxA/TrxB/NADPH
    and with GSH/GorA, and map the oxidised-form disulfide by mass spectrometry.
  experiment_type: site-directed mutagenesis / enzyme kinetics
