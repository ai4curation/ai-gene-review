- term:
    id: GO:0004602
    label: glutathione peroxidase activity
  evidence_type: IDA
  original_reference_id: PMID:20621065
  qualifier: enables
  review:
    summary: >-
      Purified BtuE decomposes H2O2 in a glutathione-dependent manner (Arenas et
      al. 2010), but the same study found thioredoxins A and C to be the
      preferred reductants for every peroxide tested.
    action: KEEP_AS_NON_CORE
    reason: >-
      Glutathione-supported activity was observed directly and is not
      contradicted, so the annotation stands. But glutathione is the less
      effective donor in vitro, and like other Cys-GPX-fold enzymes BtuE is
      better described as a thioredoxin-dependent peroxiredoxin. The core
      activity is therefore GO:0140824, and GSH peroxidase activity is a
      secondary in vitro capability whose physiological weight is unknown. This
      is a lateral distinction (different electron donor), not a
      general-to-specific refinement, so MODIFY is not appropriate.
    supported_by:
    - reference_id: PMID:20621065
      supporting_text: Purified BtuE decomposes in vitro hydrogen peroxide in a glutathione-dependent
        manner.
    - reference_id: PMID:20621065
      supporting_text: Figure 2 shows that BtuE uses preferentially thioredoxins A or C as reducing
        agents irrespective of the peroxide substrate.
