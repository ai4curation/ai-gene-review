- term:
    id: GO:0008379
    label: obsolete thioredoxin peroxidase activity
  evidence_type: IDA
  original_reference_id: PMID:20621065
  qualifier: enables
  review:
    summary: >-
      Thioredoxin-supported peroxide reduction by purified BtuE is well
      supported. GOA/QuickGO list this term as obsolete; its obsoletion comment
      says it was redundant with GO:0140824 (thioredoxin-dependent
      peroxiredoxin activity), which uses any hydroperoxide. OLS still showed it
      as active when checked, so the GO services disagree. The same activity is
      also the PAINT IBD placed at the gammaproteobacterial BtuE node
      PTN000173904, seeded by this protein.
    action: MODIFY
    reason: >-
      The biology is right, but the term is obsolete in the GO release behind
      GOA. Its scope (H2O2 only) is also narrower than what was shown: BtuE
      reduces H2O2, cumene, tert-butyl and linoleic acid hydroperoxides with
      thioredoxin. Replace with GO:0140824, which BtuE already carries by EXP.
    proposed_replacement_terms:
    - id: GO:0140824
      label: thioredoxin-dependent peroxiredoxin activity
    supported_by:
    - reference_id: PMID:20621065
      supporting_text: BtuE also utilizes preferentially thioredoxin A to decompose hydrogen peroxide
        as well as cumene-, tert-butyl-, and linoleic acid hydroperoxides
- term:
    id: GO:0015889
    label: cobalamin transport
  evidence_type: IMP
  original_reference_id: PMID:3528128
  qualifier: acts_upstream_of_or_within
  negated: true
  review:
    summary: >-
      NOT annotation: BtuE does not take part in vitamin B12 transport despite
      its position in the btuCED operon. The cited 1986 paper (abstract only in
      our cache) originally attributed a B12 transport defect to btuE
      insertions, which were later recognised as polar. Rioux and Kadner (1989)
      then built nonpolar in-frame deletions removing 20% or 82% of btuE and
      found no effect on B12 binding, transport or utilisation.
    action: ACCEPT
    reason: >-
      The negative claim is well supported by the definitive nonpolar-deletion
      study and by the curated UniProt caution. Accept the NOT. The specific
      1986 reference reported insertion phenotypes that the 1989 work
      reinterpreted, so PMID:2671656 is the stronger support. Keeping the NOT
      matters for this gene: the operon context and the "btu" name otherwise
      invite a mistaken transport annotation.
    additional_reference_ids:
    - PMID:2671656
    supported_by:
    - reference_id: PMID:2671656
      supporting_text: Thus, despite its genetic location in the transport operon, the btuE product
        plays no essential role in vitamin B12 transport.
    - reference_id: PMID:2671656
      supporting_text: These nonpolar deletions had little effect on vitamin B12 binding (whole
        cells or periplasmic fraction) and transport.
