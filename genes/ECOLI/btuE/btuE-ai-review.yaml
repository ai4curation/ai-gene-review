    label: thioredoxin-dependent peroxiredoxin activity
  evidence_type: EXP
  original_reference_id: PMID:20621065
  qualifier: enables
  review:
    summary: >-
      Purified BtuE reduces H2O2 and organic hydroperoxides (cumene, tert-butyl
