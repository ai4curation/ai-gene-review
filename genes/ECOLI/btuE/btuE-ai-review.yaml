- term:
    id: GO:0042597
    label: periplasmic space
  evidence_type: IDA
  original_reference_id: PMID:3528128
  qualifier: located_in
  review:
    summary: >-
      Based on maxicell fractionation in 1986: part of the overproduced BtuE was
      released by osmotic shock or spheroplasting. The companion sequence paper
      notes that BtuE has the hydropathy of a soluble protein but lacks an
      obvious signal sequence.
    action: UNDECIDED
    reason: >-
      The observation is real but weak and ambiguous: only a portion of the
      protein was released, from plasmid-overexpressing maxicells, and that
      fractionation can release overproduced cytoplasmic proteins. Against a
      periplasmic location, BtuE has no signal peptide, its preferred
      reductants (TrxA, TrxC) are cytoplasmic, and overexpression lowers
      cytoplasmic ROS and protein oxidation. No modern localisation study
      exists. The full 1986 text is not in our cache, so the curator's call is
      not overruled; it is flagged for a modern fractionation or
      reporter-fusion test.
    supported_by:
    - reference_id: PMID:3528128
      supporting_text: A portion of the BtuE protein was released from maxicells by osmotic shock
        or spheroplast formation.
    - reference_id: PMID:3528129
      supporting_text: It has the mean hydropathy of a soluble protein but lacks an obvious signal
        sequence.
