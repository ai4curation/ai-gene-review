core_functions:
- description: >-
    Thioredoxin-dependent reduction of hydrogen peroxide and organic
    hydroperoxides (cumene, tert-butyl and linoleic acid hydroperoxides) to
    water or the corresponding alcohols. Thioredoxin A or C is the preferred
    reductant, and glutathione is a weaker alternative. Established
    biochemically with purified E. coli BtuE. The peroxidatic Cys37 and the
    redox mechanism are inferred from the GPX-fold signature, not tested
    experimentally.
