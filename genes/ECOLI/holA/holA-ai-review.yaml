- description: Opens and removes DNA-bound beta clamps as free delta without ATP, allowing their recycling.
  directly_involved_in:
  - id: GO:0006261
    label: DNA-templated DNA replication
  supported_by:
  - reference_id: PMID:10924523
    supporting_text: unlike gamma complex and pol III*, delta does not require ATP to catalyze clamp unloading.
  proposed_molecular_function: ATP-independent DNA clamp unloader activity
proposed_new_terms:
- proposed_name: ATP-independent DNA clamp unloader activity
  proposed_definition: Facilitating opening of a DNA sliding-clamp ring and its removal from a DNA duplex
    without ATP hydrolysis.
  justification: Purified E. coli delta independently unloads beta clamps without ATP. Current GO:0061860
    explicitly requires ATP hydrolysis and therefore does not describe this experimentally established
    activity.
  supported_by:
  - reference_id: PMID:10924523
    supporting_text: unlike gamma complex and pol III*, delta does not require ATP to catalyze clamp unloading.
