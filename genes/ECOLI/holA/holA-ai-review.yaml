id: P28630
gene_symbol: holA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: HolA is the delta subunit of the Escherichia coli DNA polymerase III clamp loader. It binds
  and opens the beta sliding clamp, while DnaX ATPase cycling and the other loader subunits coordinate
  loading onto primer-template DNA. Free delta can also unload beta clamps without ATP, allowing clamp
  recycling. HolA is a mechanical clamp-opening component rather than a DNA polymerase.
existing_annotations:
- term:
    id: GO:0003677
    label: DNA binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR005790
  - InterPro:IPR008921
  - InterPro:IPR010372
  review:
    summary: Delta directly contacts the primer-template junction; cross-linking and mass spectrometry
      localize a DNA-contacting site in its C-terminal domain..
    action: ACCEPT
    reason: Delta directly contacts the primer-template junction; cross-linking and mass spectrometry
      localize a DNA-contacting site in its C-terminal domain.
    supported_by:
    - reference_id: PMID:15364574
      supporting_text: the delta subunit in the gamma complex makes close contact with the primer-template
        junction.
- term:
    id: GO:0003689
    label: DNA clamp loader activity
  evidence_type: IDA
  original_reference_id: PMID:9927437
  qualifier: enables
  review:
    summary: Retain the experimentally characterized contribution to the assembled clamp loader.
    action: ACCEPT
    reason: Retain the experimentally characterized contribution to the assembled clamp loader. Delta
      opens beta and delta-prime regulates that interaction; DnaX supplies the ATPase cycle. The core
      therefore uses contributes_to_molecular_function and does not assign independent ATP-driven loading
      to this isolated subunit.
    supported_by:
    - &id001
      reference_id: PMID:9927437
      supporting_text: The function of ATP is to regulate the activity of one subunit, delta, which opens
        the clamp simply by binding to it.
    - reference_id: PMID:9927437
- term:
    id: GO:0003887
    label: DNA-directed DNA polymerase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - InterPro:IPR010372
  - EC:2.7.7.7
  review:
    summary: The DNA-polymerizing reaction of the holoenzyme is performed by DnaE alpha.
    action: REMOVE
    reason: holA performs mechanical beta-clamp opening and recycling; DNA polymerization is catalyzed
      by DnaE alpha. Holoenzyme nucleotide-incorporation assays and shared EC/Rhea labels do not establish
      that this individual subunit polymerizes DNA. Its actual molecular role is retained independently.
    supported_by: &id002
    - *id001
    - &id004
      reference_id: PMID:2997151
    - &id005
      reference_id: PMID:6393125
    source_defects:
    - defect_type: WRONG_TERM
      resource: UNIPROT
      requested_change: CHECK
      asserted_value: GO:0003887
      cause: SCOPE_OVER_REACH
      confidence: PROBABLE
      explanation: The GO_REF:0000120 mapping assigns holoenzyme catalytic chemistry to holA. The target's
        experimentally supported role is separately documented in this row; inspect the rule/signature
        or reaction mapping to distinguish individual catalytic subunits from accessory components.
      supported_by: *id002
