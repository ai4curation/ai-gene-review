  label: Escherichia coli K-12
description: PpsA is the phosphoenolpyruvate synthase (pyruvate, water dikinase) of Escherichia coli,
  a cytoplasmic homodimer that converts pyruvate, ATP and water to phosphoenolpyruvate, AMP and phosphate
  through a phosphohistidine enzyme intermediate. It supplies phosphoenolpyruvate for gluconeogenesis
  when cells grow on three-carbon substrates such as pyruvate or lactate. Its activity is switched off
  by ADP-dependent phosphorylation and restored by phosphate-dependent pyrophosphorolysis of a regulatory
  threonine, both catalysed by the bifunctional regulator PpsR.
