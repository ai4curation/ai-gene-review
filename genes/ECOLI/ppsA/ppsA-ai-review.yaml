suggested_questions:
- question: How rapidly does PpsR-mediated inactivation of PpsA respond to the ADP/ATP ratio during glycolytic-to-gluconeogenic
    shifts, and does it prevent PEP-pyruvate futile cycling with PykF in vivo?
suggested_experiments:
- description: Compare PEP-pyruvate cycling flux (13C) in wild-type, ΔppsR and phosphomimetic/non-phosphorylatable
