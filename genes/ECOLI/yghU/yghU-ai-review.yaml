  label: Escherichia coli K-12
description: YghU is a soluble Nu-class glutathione-dependent oxidoreductase from Escherichia coli K-12.
  Its homodimer binds two glutathione molecules per active site and efficiently reduces the model disulfide
  2-hydroxyethyl disulfide. It has lower activities toward selected organic hydroperoxides and the electrophile
  CDNB; its physiological substrate remains unidentified. YghU from the related DH5alpha laboratory strain
  can deglutathionylate GS-HPV in vitro and complement a missing deglutathionylation step in another bacterium,
  but this does not establish a native E. coli lignin-dimer pathway.
