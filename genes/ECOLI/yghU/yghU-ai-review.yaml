  review:
    action: ACCEPT
    summary: Retain the phylogenetically inferred intracellular location of a soluble Nu-class oxidoreductase.
    reason: The PAINT cytoplasm assignment is consistent with the soluble glutathione-dependent redox
      function and the absence of an annotated export signal or membrane segment in the reviewed K-12
      sequence. No target-specific evidence of relocalization contradicts the inherited location. The
      protein was studied by soluble purification and crystallography, not direct cellular localization,
      so those assays are not presented as microscopy or fractionation evidence. The current PAINT-losses
      query found no IRD or IKR on this lineage.
