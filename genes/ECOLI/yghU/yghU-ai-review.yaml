- id: PMID:29449375
  title: Novosphingobium aromaticivorans uses a Nu-class glutathione S-transferase as a glutathione lyase
    in breaking the β-aryl ether bond of lignin.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The yghU construct in this study was cloned from DH5alpha and expressed in B834. GS-HPV
      activity and heterologous F199 complementation are kept as a strain-qualified comparison; no sequence-equivalence
      or native K-12 lignin-catabolic assignment is asserted.
  findings:
  - statement: An isolated Nu-class deglutathionylation capacity does not establish the upstream beta-etherase
      pathway.
    supporting_text: Nu-class GSTs from organisms lacking the β-etherase pathway can also act as glutathione
      lyases
core_functions:
- description: Glutathione-dependent disulfide oxidoreductase activity of the soluble homodimer, demonstrated
    directly with K-12-derived protein and 2-hydroxyethyl disulfide. The endogenous substrate is unresolved.
    Low CDNB/peroxide activities and DH5alpha-derived GS-HPV turnover are not recast as its established
    physiological specialization.
  molecular_function:
    id: GO:0015036
    label: disulfide oxidoreductase activity
  supported_by:
