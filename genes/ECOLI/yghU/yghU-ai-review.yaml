  review:
    action: KEEP_AS_NON_CORE
    summary: A measured CDNB conjugation side activity supports the glutathione transferase claim.
    reason: 'The PAINT inference is retained as biochemically true: purified K-12 YghU catalyzes GSH conjugation
      to CDNB, which is the halide-displacement reaction specified by GO:0004364. Its low turnover and
      poor activity on most other tested electrophiles make this peripheral to the substantially stronger
      disulfide-reductase activity; it is not rejected merely because YghU belongs to the Nu rather than
      a conventional GST class. The current PAINT-losses query found no IRD or IKR on the Q46845 lineage.
      No native lignin-catabolic process follows from this annotation.'
    supported_by:
    - reference_id: PMID:21222452
      supporting_text: With these potential substrates, YghU exhibited measurable activity only with CDNB.
