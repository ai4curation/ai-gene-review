    supporting_text: We conclude that the two structures represent reduced and oxidized forms of GSH-dependent
      disulfide-bond oxidoreductases that are distantly related to glutaredoxin 2.
suggested_questions:
- question: Which endogenous disulfide or organic hydroperoxide is the physiological substrate of K-12
    YghU, and does GS-HPV deglutathionylation reflect only promiscuous activity?
