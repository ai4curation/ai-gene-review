  review:
    action: ACCEPT
    summary: Solution behavior and the crystal structure establish a homodimer.
    reason: The purified single-gene product behaves as a dimer by gel filtration and is structurally
      characterized as the dimeric enzyme. This assembly is consistent with its active-site architecture
      and is not generic uninformative protein binding.
    supported_by:
