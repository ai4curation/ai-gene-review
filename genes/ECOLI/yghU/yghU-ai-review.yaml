  qualifier: enables
  review:
    action: ACCEPT
    summary: Direct K-12 biochemistry demonstrates glutathione-dependent disulfide reduction.
    reason: PMID:21222452 cloned yghU from K-12 genomic DNA and measured efficient GSH-dependent reduction
      of 2-hydroxyethyl disulfide. Structural observation of two adjacent GSH molecules supports the redox
      mechanism. This specific activity class is core, while the physiological disulfide substrate remains
      unknown; the synthetic assay substrate is not assumed to occur in the cell.
    supported_by:
    - reference_id: PMID:21222452
      supporting_text: We conclude that the two structures represent reduced and oxidized forms of GSH-dependent
        disulfide-bond oxidoreductases that are distantly related to glutaredoxin 2.
