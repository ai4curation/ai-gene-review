taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: PurL is the large single-chain formylglycinamide ribonucleotide (FGAM) synthetase of Escherichia
  coli, a 1295-residue cytosolic monomer that uses an internal glutaminase domain and ATP to convert formylglycinamide
  ribonucleotide (FGAR) into formylglycinamidine ribonucleotide (FGAM), the fourth step of de novo IMP
  biosynthesis. Ammonia can replace glutamine as nitrogen donor in vitro. The E. coli gene was historically
  named purG.
