  evidence_type: IDA
  original_reference_id: PMID:2659070
  qualifier: acts_upstream_of_or_within
  review:
    summary: Glutamine is the amide-nitrogen donor of the reaction.
    action: KEEP_AS_NON_CORE
    reason: PurL consumes glutamine (and has a low uncoupled glutaminase activity), so it takes part in
      glutamine metabolism, but only as the nitrogen donor for purine synthesis.
    supported_by:
    - reference_id: PMID:2659070
      supporting_text: The purified protein exhibits glutaminase activity of 0.02% the normal turnover
- term:
    id: GO:0016887
    label: ATP hydrolysis activity
  evidence_type: IDA
  original_reference_id: PMID:2659070
  qualifier: enables
  review:
    summary: ATP is consumed by phosphoryl transfer within the ligase reaction, not hydrolysed by water.
    action: MARK_AS_OVER_ANNOTATED
    reason: 'Transfer of the FGAR carbonyl 18O to Pi indicates that PurL phosphorylates its substrate (an
      iminophosphate intermediate) and the phosphate leaves from that intermediate: ATP is used by phosphoryl
      transfer, and the water-dependent ATP hydrolysis reaction of GO:0016887 is not demonstrated. The
      ATP use is fully captured by the ligase activity GO:0004642, so this row over-annotates the same
      reaction.'
    supported_by:
    - reference_id: PMID:2659070
      supporting_text: Incubation of [18O]FGAR with enzyme, ATP, and glutamine results in quantitative
        transfer of the 18O to Pi.
