suggested_questions:
- question: How is ammonia channelled from the PurL glutaminase domain to the FGAR site, and does the
    E. coli enzyme bind ADP in an auxiliary site as proposed for Salmonella PurL?
suggested_experiments:
- description: Solve structures of E. coli PurL with FGAR and a glutamine analogue to map the ammonia
    channel, and test channel mutants for uncoupled glutaminase activity.
