    label: glyoxylate cycle
  evidence_type: NAS
  original_reference_id: PMID:10589714
  qualifier: acts_upstream_of_or_within
  review:
    summary: >-
      Author-statement annotation placing AcnB in the glyoxylate cycle. The
      glyoxylate cycle is a modification of the TCA cycle that shares the
      citrate-to-isocitrate step catalysed by aconitase.
    action: KEEP_AS_NON_CORE
    reason: >-
      The aconitase reaction supplies isocitrate to isocitrate lyase during growth
      on acetate and fatty acids, so AcnB does catalyse a step of the glyoxylate
      cycle. However, the cached abstract does not discuss the glyoxylate cycle,
      and AcnB's established core process is the TCA cycle; the glyoxylate-cycle
      role is a shared step rather than a distinct function, so it is kept as
      non-core.
    supported_by:
