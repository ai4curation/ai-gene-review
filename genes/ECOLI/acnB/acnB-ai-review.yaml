- term:
    id: GO:0006417
    label: regulation of translation
  evidence_type: IDA
  original_reference_id: PMID:10589714
  qualifier: acts_upstream_of_or_within
  review:
    summary: >-
      Apo-AcnB enhanced AcnA and AcnB synthesis in in vitro
      transcription-translation in a 3'UTR-dependent manner, interpreted by the
      authors as post-transcriptional modulation of translation via mRNA binding.
    action: KEEP_AS_NON_CORE
    reason: >-
      The effect on protein output is real and 3'UTR-dependent, but the authors
      attribute it mainly to stabilization of the bound mRNA rather than to a
      direct effect on the translation machinery, and the more mechanistically
      apt process is regulation of mRNA stability (proposed below as NEW). The
      translational readout is retained as a non-core consequence of AcnB's mRNA
      binding.
    supported_by:
    - reference_id: PMID:10589714
      supporting_text: >-
        AcnA and AcnB synthesis was enhanced in vitro by the apoaconitases and this
        enhancement was abolished by 3'UTR deletion from the DNA templates,
        presumably by loss of acn-mRNA stabilization by bound apoaconitase.
    - reference_id: PMID:10589714
      supporting_text: >-
        Thus by modulating translation via site-specific interactions between
        apo-enzyme and relevant transcripts, the aconitases provide a new and
        rapidly reacting component of the bacterial oxidative stress response.
