  evidence_type: IDA
  original_reference_id: PMID:10589714
  review:
    summary: >-
      Apo-AcnB binds acn mRNA 3'UTRs and stabilizes acnB mRNA, and lowers the
      stability of the sodA transcript, so AcnB itself modulates the stability of
      specific mRNAs.
    action: NEW
    reason: >-
      AcnB performs the regulatory step directly: it binds the target transcripts
      and alters their stability (positively for acn mRNAs, negatively for sodA),
      so this is participation rather than mere necessity. The existing
      regulation of translation annotation captures only the downstream readout.
      The comparator check is consistent: other bacterial post-transcriptional
      regulators that act by binding and altering transcript turnover (e.g. CsrA,
      Hfq) are annotated to mRNA stability processes. Because the effect is
      bidirectional, the parent regulation of mRNA stability is used rather than a
      positive or negative child term.
    supported_by:
    - reference_id: PMID:10589714
      supporting_text: >-
        In vivo studies showed that although total aconitase activity is lowered
        during oxidative stress, synthesis of the AcnA and AcnB proteins and the
        stabilities of acnA and acnB mRNAs both increase, suggesting that inactive
        aconitase mediates a post-transcriptional positive autoregulatory switch.
    - reference_id: PMID:11932448
      supporting_text: >-
        Quantitative Northern blotting indicated that AcnA enhances the stability of
        the sodA transcript, whereas AcnB lowers its stability.
