  review:
    summary: >-
      Tang and Guest showed by affinity chromatography and gel retardation that
      apo-AcnB binds acnA and acnB mRNA specifically within their 3' untranslated
      regions.
    action: ACCEPT
    reason: >-
      The binding is real and direct. This paper localizes it to the 3'UTRs of
      the acn transcripts, which is captured separately by the accepted mRNA
      3'-UTR binding (GO:0003730) row from the same paper. mRNA binding is kept
      as the general statement of AcnB's RNA-binding regulatory activity, because
      other AcnB targets (sodA, ftsH) have not been localized to the 3'UTR, and it
      is kept consistent with the accepted mRNA binding row from PMID:15882410.
    supported_by:
    - reference_id: PMID:10589714
      supporting_text: >-
        Affinity chromatography and gel retardation analysis showed that the AcnA
        and AcnB apo-proteins each interact with the 3' untranslated regions
        (3'UTRs) of acnA and acnB mRNA at physiologically significant protein
        concentrations.
