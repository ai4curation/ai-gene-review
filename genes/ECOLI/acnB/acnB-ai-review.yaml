suggested_questions:
- question: >-
    Which region of the ftsH transcript does apo-AcnB bind, and is binding to the
    3'UTR (as for acn mRNAs) or to the coding region?
- question: >-
    Does iron-dependent homodimerization of AcnB through its HEAT-like domain
    directly gate mRNA binding in vivo in E. coli, and what fraction of cellular
    AcnB is in the apo/regulatory form under normal aerobic growth?
- question: >-
    Is the association of AcnB with thioredoxin a redox-repair interaction that
    controls the catalytic/regulatory switch?
suggested_experiments:
- description: >-
    Transcriptome-wide CLIP-seq or RIP-seq of apo-AcnB in E. coli under iron
    limitation and oxidative stress to define its mRNA targets and binding motifs.
- description: >-
    Measure target mRNA half-lives (acnA, acnB, sodA, ftsH) in wild type versus
    strains expressing cluster-free but RNA-binding-competent AcnB variants, to
    separate catalytic and regulatory contributions.
