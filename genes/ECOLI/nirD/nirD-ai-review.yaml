- term:
    id: GO:0042128
    label: nitrate assimilation
  evidence_type: IC
  original_reference_id: PMID:34323689
  qualifier: involved_in
  review:
    action: NEW
    summary: NirD participates in nitrate-nitrogen assimilation through the downstream NirBD nitrite-reduction
      step.
    reason: The small subunit is a functional component of the enzyme converting nitrate-derived nitrite
      to ammonium, which supplies cellular nitrogen under the native anaerobic nitrate-fed conditions.
      The E50K separation-of-function allele retains nitrite-reductase function while losing RelA interaction,
      distinguishing this enzyme participation from its separate regulatory role. This process proposal
      combines the native functional result and nitrogen-use context; it does not assign nitrate reductase
      activity to NirD or make NarU/NirBD an autonomous nitrate-to-ammonium route. Upstream respiratory
      nitrate reduction is required. Negative small-subunit comparator annotations are not evidence of
      a curator oversight; the proposal rests on the demonstrated component role. No ancestor/descendant
      process duplication or target GO-CAM record was found.
    supported_by:
    - reference_id: PMID:34323689
      supporting_text: Under nitrate respiration, nitrate is converted to nitrite, which is subsequently
        converted to ammonium (NH4) by the cytosolic NADH-dependent nitrite reductase NirBD.
    - reference_id: PMID:34323689
      supporting_text: Bacteria can then utilize NH4 as nitrogen source.
    - reference_id: PMID:34323689
      supporting_text: a chromosomal encoded nirDE50K mutant, which is functional for the nitrite reductase
        activity (Figure 3—figure supplement 1C) but failed to interact with RelA
