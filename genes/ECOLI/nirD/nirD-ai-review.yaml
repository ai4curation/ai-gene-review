taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: NirD is the small cytoplasmic subunit of the Escherichia coli NADH-dependent nitrite reductase
  NirBD. It associates with NirB and supports physiological reduction of nitrite to ammonium, including
  nitrogen assimilation downstream of respiratory nitrate reduction. Separately, NirD directly binds the
  catalytic region of RelA and inhibits (p)ppGpp synthesis, restraining the stringent response. This regulatory
  interaction can be separated experimentally from its role in nitrite reductase.
