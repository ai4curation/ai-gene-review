- term:
    id: GO:0051537
    label: 2 iron, 2 sulfur cluster binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR036922
  review:
    action: MARK_AS_OVER_ANNOTATED
    summary: A Rieske-like fold does not establish iron-sulfur binding by E. coli NirD.
    reason: The proximate IPR036922 source is a structural superfamily. The characterized M. tuberculosis
      NirD homolog retains a Rieske-related fold without an Fe-S center; this is comparative evidence,
      not an E. coli cofactor assay. The E. coli record has NirD-specific family assignments but no cofactor
      assignment. Propagating cluster binding solely from the fold exceeds the support; the [2Fe-2S] center
      demonstrated for NirBD is assigned to NirB. The target has three cysteines (8, 20, 84) and three
      histidines (35, 62, 94), so totals do not exclude a canonical two-Cys/two-His set as for PSEPK NirD.
      Counts do not establish site geometry or occupancy; the annotation therefore remains over-annotated
      rather than demonstrably impossible from this sequence check.
    supported_by:
    - reference_id: PMID:22965870
      supporting_text: NirD is related in three-dimensional structure and sequence to the Rieske proteins;
        however, it does not contain any Fe-S cluster or other cofactors that might be involved in electron
        transfer.
