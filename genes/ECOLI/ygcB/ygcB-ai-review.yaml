      failure_modes:
      - GRANULARITY_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN002776767
        source_label: PANTHER ancestral node (PTHR47963 lineage)
        source_status: SUPPORTS_TRANSFER
        comment: >-
          The ancestral RNA-binding capability does carry over to Cas3, even though the
          RNA helicase activity propagated from the same node does not.
- term:
    id: GO:0003724
    label: RNA helicase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN002776767
  - UniProtKB:P0A9P6
  - UniProtKB:P96614
  - UniProtKB:Q55804
  review:
    summary: >-
      This is the one annotation in the set that does not survive scrutiny. GO:0003724
      requires unwinding of an RNA helix, and no reported Cas3 activity acts on an RNA
      duplex. What was measured is ATP-driven unwinding of the RNA strand out of an
      RNA:DNA hybrid, which is GO:0033677 DNA/RNA helicase activity - a sibling of
      GO:0003724 under helicase activity, not a descendant of it. The ancestral function
      being propagated is duplex-RNA unwinding by a DEAD-box helicase: the donors are
      genuine DEAD-box RNA helicases (P0A9P6 is E. coli DeaD/CsdA), and the PANTHER
      family that places Cas3 in that lineage is PTHR47963 "DEAD-box ATP-dependent RNA
      helicase 47, mitochondrial", with Cas3 isolated in subfamily SF9. The Cas3
      helicase module is a repurposed superfamily-2 helicase whose substrate specificity
      has diverged, so the right action is to retarget the term to the reaction the
      protein performs rather than to delete a real helicase activity.
    action: MODIFY
    reason: >-
      Argued at the node, not on similarity score: the inherited activity is duplex-RNA
      unwinding, Cas3's demonstrated activity is RNA:DNA hybrid unwinding, and the two
      terms are siblings rather than parent and child, so neither subsumes the other. The
      replacement term is already independently supported for this protein by IDA.
    proposed_replacement_terms:
    - id: GO:0033677
      label: DNA/RNA helicase activity
    supported_by:
    - reference_id: PMID:21699496
      supporting_text: ATP abolishes Cas3 R-loop formation and instead powers Cas3 helicase
        unwinding of the invading RNA strand of a model R-loop substrate
      reference_section_type: ABSTRACT
    - reference_id: PMID:18703739
      supporting_text: cas3 (predicted HD-nuclease fused to a DEAD-box helicase)
      reference_section_type: RESULTS
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: PANTHER:PTN002776767
        source_label: PANTHER ancestral node (PTHR47963 lineage)
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          The node groups the Cas3 helicase module with DEAD-box RNA helicases. The
          ancestral unwinding activity transfers; the RNA-duplex substrate specificity
          does not.
      - source_id: UniProtKB:P0A9P6
        source_label: deaD (Escherichia coli K-12 DEAD-box RNA helicase CsdA)
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          A sound source annotation for a bona fide RNA helicase. The problem is the
          scope of the transferred term for this target, not the quality of the donor.
