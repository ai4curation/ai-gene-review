  - statement: The module annoton cas3_target_degradation cites GO:0008296 as its own
      evidence and should instead cite PMID:22521689, and its function id should be
      GO:0000014 or GO:0008310 rather than the generic GO:0008296
core_functions:
- description: >-
    Metal-dependent HD-domain single-strand endonuclease that nicks the Cascade-licensed
    target. Recruited by the Cascade large subunit Cse1/CasA once an R-loop has formed at
    a PAM-flanked protospacer, Cas3 cleaves within the displaced single strand. This is
    the committed, immunity-essential step of type I-E interference: HD-domain point
    mutants H74A, D75A, K78A and D452N abolish lambda immunity and plasmid curing in vivo.
  molecular_function:
    id: GO:0000014
    label: single-stranded DNA endonuclease activity
  directly_involved_in:
  - id: GO:0099048
    label: CRISPR-cas system
  - id: GO:0051607
    label: defense response to virus
  supported_by:
  - reference_id: PMID:22521689
    supporting_text: After Cascade-mediated R loop formation, the Cse1 subunit recruits
      Cas3, which catalyzes nicking of target DNA through its HD-nuclease domain.
    reference_section_type: ABSTRACT
  - reference_id: PMID:22521689
    supporting_text: reveals that Cas3 has endonuclease and 3′ to 5′ exonuclease activity
      on the single stranded region of the DNA substrate
    reference_section_type: RESULTS
- description: >-
    ATP-dependent RNA:DNA hybrid helicase. The superfamily-2 helicase module unwinds the
    RNA strand out of an R-loop in an ATP-driven reaction, feeding single-stranded DNA to
    the HD nuclease. Unwinding is separable from nicking: the Walker A mutant K320N still
    nicks the target plasmid but can no longer degrade it, and H455L in the DEAH box loses
    R-loop unwinding.
  molecular_function:
    id: GO:0033677
    label: DNA/RNA helicase activity
  directly_involved_in:
  - id: GO:0099048
    label: CRISPR-cas system
  supported_by:
  - reference_id: PMID:21699496
    supporting_text: ATP abolishes Cas3 R-loop formation and instead powers Cas3 helicase
      unwinding of the invading RNA strand of a model R-loop substrate
    reference_section_type: ABSTRACT
  - reference_id: PMID:22521689
    supporting_text: The target is then progressively unwound and cleaved by the joint
      ATP-dependent helicase activity and Mg(2+)-dependent HD-nuclease activity of Cas3,
      leading to complete target DNA degradation and invader neutralization.
    reference_section_type: ABSTRACT
- description: >-
    Processive 3'-to-5' exonucleolytic degradation of the unwound target strand, which is
    what converts a nicked plasmid or phage genome into complete destruction. Measured
    cleavage is restricted to single-stranded regions of the substrate and requires
    Mg(2+); the direction matches that of the separately encoded archaeal Cas3 nuclease
    module.
  molecular_function:
    id: GO:0008310
    label: single-stranded DNA 3'-5' DNA exonuclease activity
  directly_involved_in:
  - id: GO:0099048
    label: CRISPR-cas system
  - id: GO:0051607
    label: defense response to virus
  supported_by:
  - reference_id: PMID:22521689
    supporting_text: reveals that Cas3 has endonuclease and 3′ to 5′ exonuclease activity
      on the single stranded region of the DNA substrate
    reference_section_type: RESULTS
  - reference_id: PMID:22521689
    supporting_text: Altogether, these data demonstrate that during type I CRISPR-interference
      in E. coli target DNA recognition by Cascade is followed by Cas3-mediated DNA nicking
      and progressive ATP-dependent degradation of target DNA in the 3′ to 5′ direction.
    reference_section_type: RESULTS
suggested_questions:
- question: >-
    Does the ATP-independent RNA:DNA annealing activity of purified Cas3 have any role
    in vivo, or is it simply the reverse of the helicase reaction observed under
    conditions where ATP is absent? Cascade forms R-loops on its own, which leaves no
    obvious requirement for Cas3 to do so.
  experts:
  - Edward L. Bolt
  - Ivana Ivancic-Bace
- question: >-
    Should GO add a molecular-function term for crRNA-guided, PAM-licensed target
    recognition? Cas3 itself needs no such term - all three of its activities map onto
    existing ids - but the Cascade subunits that recruit it currently have to stand in
    double-stranded DNA binding for that function.
  experts: []
- question: >-
    Is the single-strand restriction of the Cas3 nuclease absolute in the physiological
    reaction, or does the enzyme acquire activity on duplex DNA once engaged with Cascade
    at a licensed target? The distinction decides whether GO:0008310 or the broader
    GO:0008296 is the right annotation for Cas3 in situ.
  experts:
  - Stan J. J. Brouns
  - John van der Oost
suggested_experiments:
- hypothesis: >-
    The Cas3 helicase module has lost the ability to unwind duplex RNA that its DEAD-box
    relatives retain, which would confirm that the GO:0003724 IBA reflects family-level
    lumping rather than a conserved activity.
  description: >-
    Assay purified E. coli Cas3 side by side with E. coli DeaD/CsdA (P0A9P6) on a matched
    panel of substrates - a blunt and a 3'-overhang RNA duplex, an RNA:DNA hybrid, and a
    duplex DNA fork - under identical ATP and Mg(2+) conditions, scoring unwinding by gel
    shift. A clean split, with DeaD active on the RNA duplex and Cas3 active only on the
    hybrid, settles the term choice directly.
  experiment_type: in vitro helicase substrate panel
- hypothesis: >-
    Nicking and processive degradation are catalysed by the same HD active site but gated
    by the helicase, so helicase-dead and nuclease-dead alleles should fail at different
    points in the same reaction.
  description: >-
    Reconstitute Cascade with wild-type Cas3, the HD mutant D452N and the Walker A mutant
    K320N on a negatively supercoiled plasmid target, and follow the reaction by
    time-resolved topology mapping plus sequencing of the 3' ends generated. This gives
    the position of the initiating nick and the extent of exonucleolytic resection for
    each allele separately.
  experiment_type: reconstituted interference assay with end mapping
- hypothesis: >-
    The single-strand preference of the Cas3 nuclease is what restricts degradation to
    the displaced strand of the R-loop, making the PAM-licensed strand asymmetry the
    determinant of which strand is destroyed first.
  description: >-
    Build R-loop mimics in which the displaced strand is either single-stranded or
    sequestered by a complementary oligonucleotide, add Cascade-Cas3, and measure which
    strand is cleaved and when, using strand-specific labels. Sequestering the displaced
    strand should block the initiating nick without affecting Cascade binding.
  experiment_type: strand-resolved cleavage assay on R-loop mimics
