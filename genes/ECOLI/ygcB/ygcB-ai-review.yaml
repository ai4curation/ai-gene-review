id: P38036
gene_symbol: ygcB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli (strain K12)
aliases:
- cas3
description: >-
  Cas3 (gene ygcB/cas3) is the 888-residue helicase-nuclease of the Escherichia coli
  K-12 type I-E CRISPR-Cas system and the enzyme that destroys the invading DNA. It is
  a two-module protein: an N-terminal metal-dependent HD nuclease domain (residues
  20-231, with Mg(2+) ligands at His75 and Asp160) fused to a superfamily-2
  helicase/ATPase module (ATP-binding domain 301-504 with a Walker A motif at 314-321
  and a DEAH box at 452-455, plus a helicase C-terminal domain 556-735). Cas3 does not
  find its own targets. The crRNA-loaded Cascade surveillance complex locates a
  protospacer in negatively supercoiled DNA, verifies the adjacent PAM and forms an
  R-loop; the Cascade large subunit Cse1/CasA then recruits Cas3 to the licensed site.
  The HD domain nicks the displaced single strand, and the ATP-driven helicase and the
  Mg(2+)-dependent nuclease then act together to unwind the duplex and degrade the
  target processively in the 3'-to-5' direction, giving complete destruction of phage
  and plasmid DNA. On model substrates the purified enzyme shows endonucleolytic and
  3'-to-5' exonucleolytic cleavage restricted to single-stranded regions, ATP-dependent
  unwinding of the RNA strand of an RNA:DNA hybrid, and, in the absence of ATP, the
  reverse reaction of annealing RNA into duplex DNA to form R-loops. Cas3 is required
  together with Cascade for resistance to bacteriophage lambda and for curing of
  plasmids carrying a protospacer; HD-domain and helicase-motif point mutants abolish
  immunity in vivo, and the helicase mutant K320N uncouples nicking from degradation.
  The protein has no known activity outside CRISPR interference.
