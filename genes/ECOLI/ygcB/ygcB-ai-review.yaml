- term:
    id: GO:0097098
    label: DNA/RNA hybrid annealing activity
  evidence_type: IDA
  original_reference_id: PMID:21699496
  qualifier: enables
  review:
    summary: >-
      Directly observed with purified protein: in the absence of ATP Cas3 catalyses
      annealing of RNA into duplex DNA to form R-loops, and this reaction requires
      Mg(2+) and is lost on mutagenesis of a conserved motif. It is retained as a real
      activity but is not placed among the core functions, because the authors
      themselves frame annealing and ATP-driven unwinding as apparently antagonistic,
      Cascade independently forms R-loops in vivo, and no in vivo role for Cas3-mediated
      annealing has been established.
    action: KEEP_AS_NON_CORE
    supported_by:
