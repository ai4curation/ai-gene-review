  review:
    summary: >-
      Directly measured. The Cas3 HD domain introduces the nick that commits a
      Cascade-licensed target, and in the defined assay the endonucleolytic cleavage is
      confined to the single-stranded portion of the substrate, so the single-strand
      restriction in the term is earned rather than assumed. This is the
