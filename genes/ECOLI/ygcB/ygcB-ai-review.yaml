- term:
    id: GO:0003676
    label: nucleic acid binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR011545
  review:
    summary: >-
      True but uninformative. The term comes from the generic DEAD/DEAH-box helicase
      domain signature (IPR011545) and sits at the root of the nucleic-acid-binding
      branch. Cas3's binding is characterised to a much finer grain: it binds duplex
      DNA directly, and the specific substrate it engages catalytically is the
      RNA:DNA hybrid of an R-loop. The double-stranded DNA binding term already held by
      this entry by IDA supersedes it.
    action: MODIFY
    reason: >-
      Parent-level term retained from a domain signature; replaced by the specific
      binding activity that was experimentally demonstrated for this protein.
    proposed_replacement_terms:
    - id: GO:0003690
      label: double-stranded DNA binding
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - GRANULARITY_MISMATCH
      source_entities:
      - source_id: InterPro:IPR011545
        source_label: DEAD/DEAH box helicase domain
        source_status: SUPPORTS_TRANSFER
        comment: >-
          Domain-level signature shared with DEAD-box RNA helicases. The transfer itself
          is valid; the term is simply too general to say which nucleic acid Cas3 binds.
- term:
    id: GO:0003690
    label: double-stranded DNA binding
  evidence_type: IDA
  original_reference_id: PMID:21699496
  qualifier: enables
  review:
    summary: >-
      Duplex DNA binding is the substrate-engagement step that precedes both the
      annealing and the unwinding reactions: Cas3 forms R-loops by base-pairing an RNA
      strand into duplex DNA, which requires binding that duplex. UniProt records
      DNA-BINDING as one of the experimental findings of this paper, and the K78L mutant
      is reported to bind DNA normally while losing R-loop formation, which is a
      binding measurement independent of the catalytic assay.
    action: ACCEPT
    reason: >-
      The cached record for this reference is abstract-only, so the binding assay itself
      cannot be quoted here; the EcoCyc curator read the full text and the UniProt
      curators annotated DNA-BINDING from the same paper. Deferred to on that basis.
    supported_by:
    - reference_id: PMID:21699496
      supporting_text: purified E. coli Cas3 catalyses ATP-independent annealing of RNA
        with DNA forming R-loops, hybrids of RNA base-paired into duplex DNA
      reference_section_type: ABSTRACT
- term:
    id: GO:0003723
    label: RNA binding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - AGI_LocusCode:AT1G12770
  - PANTHER:PTN002776767
  - UniProtKB:P0A9P6
  - UniProtKB:P96614
  - UniProtKB:Q55804
  review:
    summary: >-
      Defensible but not core. Unlike the sibling RNA helicase propagation from the same
      ancestral node, this one survives contact with Cas3's own biology: Cas3 anneals an
      RNA strand into duplex DNA and then unwinds that same strand, both of which
      require engaging RNA. It is kept as a non-core capability because it is a
      consequence of the hybrid-directed activities rather than an independent function,
      and because the specific terms for those activities (DNA/RNA hybrid annealing
      activity, DNA/RNA helicase activity) say far more.
    action: KEEP_AS_NON_CORE
    supported_by:
    - reference_id: PMID:21699496
