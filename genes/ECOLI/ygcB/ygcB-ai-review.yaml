- term:
    id: GO:0099048
    label: CRISPR-cas system
  evidence_type: IDA
  original_reference_id: PMID:22521689
  qualifier: involved_in
  review:
    summary: >-
      Proposed addition. Cas3 is the only protein of the Escherichia coli K-12 type I-E
      cas locus that lacks this term, although it is the enzyme that carries out the
      destruction step of the process. It does the work rather than merely being
      required for it: it nicks the licensed target, unwinds it and degrades it
      processively.
    action: NEW
    reason: >-
      Comparator check passes decisively. A QuickGO annotation query on GO:0099048
      returns 33 annotations, including every other cas gene of this same system -
      Q46901 casA, P76632 casB, Q46899 casC, Q46898 casD, Q46897 casE, Q46896 ygbT/cas1
      and P45956 ygbF/cas2 - all involved_in and all IDA, plus the Cascade complex
      itself (ComplexPortal:CPX-1005). P38036 is absent. The comparators stand in the
      same role (participants in the three-stage CRISPR process), were annotated from
      the same body of work, and the entity that performs the interference step is Cas3
      itself, so this is a curation gap rather than a convention. The term is also not
      redundant with the defense response to virus annotations the entry already has:
      QuickGO ancestor queries place GO:0099048 under GO:0098542/GO:0099046 and
      GO:0051607 under GO:0009615, with neither an ancestor of the other, and GO:0099048
      adds the CRISPR-specific pathway identity that GO:0051607 does not carry. Evidence
      is IDA from the reconstituted Cascade-Cas3 degradation experiments rather than IEA,
      since no electronic pipeline asserted it.
    supported_by:
    - reference_id: PMID:22521689
      supporting_text: Altogether, these data demonstrate that during type I CRISPR-interference
        in E. coli target DNA recognition by Cascade is followed by Cas3-mediated DNA
        nicking and progressive ATP-dependent degradation of target DNA in the 3′ to
        5′ direction.
      reference_section_type: RESULTS
    - reference_id: PMID:22521689
      supporting_text: After Cascade-mediated R loop formation, the Cse1 subunit recruits
        Cas3, which catalyzes nicking of target DNA through its HD-nuclease domain.
      reference_section_type: ABSTRACT
    - reference_id: PMID:18703739
      supporting_text: proving that both Cascade and Cas3 are required in this process
      reference_section_type: RESULTS
