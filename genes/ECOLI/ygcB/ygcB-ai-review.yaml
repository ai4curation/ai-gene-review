- term:
    id: GO:0051607
    label: defense response to virus
  evidence_type: IDA
  original_reference_id: PMID:18703739
  qualifier: acts_upstream_of_or_within
  review:
    summary: >-
      Correct and core. Plaque assays with engineered anti-lambda CRISPR arrays show
      that Cascade alone confers no protection, that Cascade plus Cas3 makes the host
      dramatically less sensitive to lambda-vir, and that removing either component
      abolishes resistance. Cas3 is the effector that neutralises the invading genome, so
      a more direct qualifier than acts_upstream_of_or_within would be justified, but the
      term itself is right.
