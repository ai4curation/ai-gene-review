id: P76134
gene_symbol: ydeM
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  YdeM is a 385-residue radical S-adenosyl-L-methionine (SAM) protein of the anaerobic
  sulfatase-maturating enzyme (anSME) family and a paralog of AslB. It consists of a
  radical SAM core, carrying the CxxxCxxC motif that binds the SAM-cleaving [4Fe-4S]
  cluster, and a C-terminal SPASM domain predicted to hold two auxiliary [4Fe-4S] clusters.
  Every cluster-ligand cysteine, SAM-contact residue and the catalytic aspartate of the
  structurally characterised Clostridium perfringens anSME are conserved, so the protein
  is expected to be catalytically competent. Characterised anSMEs convert the active-site
  cysteine or serine of sulfatases to C-alpha-formylglycine. The gene lies next to ydeN,
  which encodes an uncharacterised sulfatase-family protein predicted to carry a serine at
  the formylglycine position. Deleting ydeM, together with aslB and yidF, does not prevent
  E. coli K-12 from maturing heterologous cysteine-type sulfatases, so YdeM is not needed
  for that reaction; whether it matures YdeN or any other serine-type substrate, or acts on
  something else, is unknown. No activity of the purified protein has been reported.
