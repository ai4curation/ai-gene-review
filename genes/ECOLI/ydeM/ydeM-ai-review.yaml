- term:
    id: GO:0051604
    label: protein maturation
  evidence_type: ISS
  original_reference_id: PMID:16766528
  qualifier: acts_upstream_of_or_within
  review:
    summary: >-
      Sequence-similarity transfer of protein maturation from the C. perfringens Cys-type
      anSME that founded the family (PMID:16766528). In E. coli K-12, deleting ydeM, aslB
      and yidF did not impair maturation of heterologous Cys-type sulfatases
      (PMID:17303125), and UniProt records that YdeM is not involved in Cys-type sulfatase
      maturation in vivo. Ser-type maturation was not tested, and ydeM sits next to ydeN,
      whose product is a predicted Ser-type sulfatase (UniProt P77318), so a maturation
      role for that kind of substrate remains possible.
    action: UNDECIDED
    reason: >-
      The cited paper does not assay YdeM. The in vivo test in K-12 refutes the specific
      transferred activity (Cys-type sulfatase maturation) but not maturation of a Ser-type
      sulfatase such as the neighbouring YdeN, and the catalytic machinery is fully intact.
      The term is therefore neither supported nor excluded; the same judgement is made for
      the paralog aslB.
    supported_by:
    - reference_id: PMID:17303125
      supporting_text: knocking-out of aslB, ydeM and yidF does not impair Cys-type sulfatase maturation
    - reference_id: file:ECOLI/ydeM/ydeM-uniprot.txt
      record_section: ["CC:CAUTION"]
      supporting_text: it is not involved in Cys-type sulfatase maturation in vivo
    - reference_id: file:ECOLI/aslB/aslB-bioinformatics/RESULTS.md
      supporting_text: YdeM is likewise encoded next to a predicted Ser-type sulfatase, YdeN
core_functions: []
knowledge_gaps:
- gap_statement: >-
    The substrate and reaction of YdeM are unknown: it is not established whether it
    converts the active-site serine of the neighbouring YdeN, or of any other protein, to
    formylglycine, or acts on a different substrate.
  boundary: >-
    Established: YdeM keeps every cluster-ligand cysteine, SAM-contact residue and the
    catalytic aspartate of the C. perfringens anSME. Deleting ydeM, aslB and yidF does not
    block maturation of heterologous Cys-type sulfatases in E. coli K-12. Ser-type
    maturation and the activity of purified YdeM have not been tested.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: >-
    Together with AslB, YdeM is one of two intact anSME-family enzymes in a bacterium with
    no detectable sulfatase activity; identifying their substrates would show whether these
    are latent sulfatase maturases or enzymes repurposed for another modification.
  resolution: >-
    Assay anaerobically reconstituted YdeM for SAM-dependent formylglycine formation on
    YdeN peptides spanning Ser132, and test formylglycine in YdeN expressed in wild-type and
    ydeM-deleted cells under anaerobic, sulfate-limited growth.
  provenance:
  - reference_id: PMID:17303125
    supporting_text: these putative anSME are not involved in Cys-type sulfatase maturation
  - reference_id: file:ECOLI/aslB/aslB-bioinformatics/RESULTS.md
    supporting_text: 'YdeM keeps all 17 reference features: 11 cluster cysteines'
suggested_questions:
- question: >-
    Is YdeN, the predicted Ser-type sulfatase encoded next to ydeM, a substrate of YdeM,
    and are AslB and YdeM each dedicated to their neighbouring sulfatase or redundant?
  experts:
  - Olivier Berteau
  - Thomas Dierks
- question: >-
    Under which conditions is ydeM expressed, and is it co-regulated with ydeN?
  experts:
  - Olivier Berteau
suggested_experiments:
- hypothesis: YdeM is a serine-type anaerobic sulfatase-maturating enzyme for YdeN.
  description: >-
    Express YdeN (wild type and S132A) in wild-type, ydeM-deleted and aslB ydeM
    double-deleted E. coli K-12 under anaerobic conditions; detect formylglycine at
    position 132 by mass spectrometry and measure sulfatase activity on aryl sulfate
    substrates. In vitro, assay reconstituted YdeM with a YdeN motif peptide for
    SAM-dependent formylglycine and 5'-deoxyadenosine formation.
  experiment_type: genetic and in vitro enzymology
