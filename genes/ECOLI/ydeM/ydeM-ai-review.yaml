- term:
    id: GO:0006974
    label: DNA damage response
  evidence_type: IEP
  original_reference_id: PMID:11967071
  qualifier: acts_upstream_of_or_within
  review:
    summary: >-
      Inferred from expression pattern: ydeM is one of the roughly 30% of E. coli genes
      whose transcript level changed after mitomycin C treatment in a genome-wide array
      study (PMID:11967071). No study links YdeM protein activity to DNA repair, damage
      tolerance or the SOS response.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      A change in transcript level within a response that touches nearly a third of the
      genome shows only that ydeM expression is affected by DNA damage, not that YdeM does
      any of the work of responding to it. The row is retained as data about expression but
      marked as over-annotation of the gene's function, consistent with how other E. coli
      reviews in this repository treat rows from this study.
    supported_by:
    - reference_id: PMID:11967071
      supporting_text: a large number of genes (nearly 30% of all genes) displayed significant changes in their expression level
- term:
    id: GO:0016491
    label: oxidoreductase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR023867
  review:
    summary: >-
      Oxidoreductase activity mapped from the sulfatase-maturase radical SAM signature.
      Characterised anSMEs oxidise a sulfatase cysteine or serine to formylglycine
      (PMID:16766528, PMID:14749327), and YdeM keeps their catalytic machinery, but no
      oxidation by YdeM, and no substrate, has been shown.
    action: UNDECIDED
    reason: >-
      A family-level prediction of reaction class. The family function was not observed
      for YdeM in K-12 deletion mutants with Cys-type substrates (PMID:17303125), and no
      assay of YdeM itself exists, so the reaction class can be neither confirmed nor
      excluded.
    supported_by:
    - reference_id: PMID:14749327
      supporting_text: AtsB oxidizes serine to FGly by a radical mechanism that is initiated through reductive cleavage of SAM
    - reference_id: PMID:17303125
      supporting_text: these putative anSME are not involved in Cys-type sulfatase maturation
