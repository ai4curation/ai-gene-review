  label: Escherichia coli K-12
description: This record represents full-length, functional BcsQ, including the repaired K-12 allele in
  strain AR3110. BcsQ is a cytosolic SIMIBI-family nucleotide-binding accessory protein that associates
  with BcsR, BcsE and cellulose synthase, helping stabilize the active assembly. The close strain 1094
  allele forms ATP-loaded BcsRQ dimers and exhibits weak, regulated ATP hydrolysis in vitro. The precise
  coupling of hydrolysis to cellulose production remains unresolved. The native K-12 downstream-start
  pseudogene prediction is represented separately by P37655.
