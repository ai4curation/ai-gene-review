- id: PMID:19400787
  title: BcsQ is an essential component of the Escherichia coli cellulose biosynthesis apparatus that
    localizes at the bacterial cell pole.
  findings:
  - statement: The study identifies BcsQ as a polar cellulose-biosynthesis accessory.
    supporting_text: we demonstrate that BcsQ, a MinD homologue, displays a polar localization
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only; use curated target statements and later structures to support the reviewed
      location. Distinguish 1094 and repaired K-12 from the native fragment.
  full_text_unavailable: true
- id: PMID:24097954
  title: Cellulose as an architectural element in spatially structured Escherichia coli biofilms.
  findings:
  - statement: The codon 6 stop was repaired in W3110 to create cellulose-producing AR3110.
    supporting_text: For changing codon 6 of bcsQ from TAG(stop) to TTG(leucine) in the chromosomal copy
      of bcsQ in strain W3110
  - statement: BcsA deletion tests cellulose synthesis in the repaired background.
    supporting_text: a precise deletion of the cellulose synthase gene bcsA in AR3110 reconstituted the
      ring-structured morphology previously observed for strain W3110
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text examined. The early stop also has polar effects on downstream expression;
      the study does not assay intrinsic activity of a separately expressed 242-residue fragment.
- id: PMID:39394223
  title: Structural basis for synthase activation and cellulose modification in the E. coli Type II Bcs
    secretion system.
  findings:
  - statement: E. coli structures distinguish catalytic BcsA, membrane-anchored BcsB and cytosolic BcsQ
      stabilization.
    supporting_text: BcsQ buttresses the PilZ domain, likely stabilizing the catalytically competent state.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Native phenotype assays in PMID:39394223 used E. coli 1094; recombinant assembly used
      a bcs-deleted BL21*(DE3) host. The 2021 BcsRQ study also used 1094 genes and recombinant complexes.
      Protein identity/structure correspondence does not turn these into native K-12 experiments.
- id: PMID:33563593
  title: Architecture and regulation of an enterobacterial cellulose secretion system.
  findings:
  - statement: BcsRQ forms nucleotide-loaded dimers in structures.
    supporting_text: BcsRQ crystallized as ATP-bound “sandwich” or “tango” dimers of heterodimers.
  - statement: Wild-type hydrolysis is weak and regulated; downstream coupling remains a model.
    supporting_text: the BcsHisRQWT complex exhibited only weak adenosine triphosphatase (ATPase) activity
      in vitro
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text examined. Source genes are from 1094; the P0DP92 sequence records an A249K
      strain variant. ATP binding and structural stabilization are established, while efficient ATP-driven
      cellulose transport is not.
