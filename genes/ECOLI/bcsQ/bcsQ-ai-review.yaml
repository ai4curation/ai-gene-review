- term:
    id: GO:0090540
    label: bacterial cellulose biosynthetic process
  evidence_type: IC
  original_reference_id: PMID:24097954
  review:
    summary: Full-length BcsQ participates in cellulose production by supporting the active synthase assembly.
    action: NEW
    reason: Full-length BcsQ participates in cellulose production by supporting the active synthase assembly.
      Repaired K-12 genetics establish pathway relevance and 1094 structures show the protein itself buttressing
      BcsA, providing structural participation beyond deletion necessity. No process term is added to
      the native pseudogene fragment. Same-role BcsQ comparators Q8Z292, Q8ZLB6 and Q88JL5 lack this process
      annotation in the checked QuickGO snapshot. That absence is not used to argue a gap; the proposal
      is based on direct structural participation by BcsQ plus K-12 repair genetics, with no matching
      existing GO-CAM role found in the local index.
    supported_by:
    - reference_id: PMID:24097954
      supporting_text: For changing codon 6 of bcsQ from TAG(stop) to TTG(leucine) in the chromosomal
        copy of bcsQ in strain W3110
