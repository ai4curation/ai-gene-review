    label: NADH dehydrogenase activity
  evidence_type: IDA
  original_reference_id: PMID:3122832
  qualifier: contributes_to
  review:
    summary: >-
      Membrane NADH/ubiquinone-1 and deamino-NADH oxidoreductase activities that
      define the proton-pumping NADH dehydrogenase I (NDH-1), to which NuoB
      contributes as a subunit.
    action: MODIFY
    reason: >-
      Matsushita et al. (1987) distinguished the energy-coupling NADH
      dehydrogenase I from the non-coupling NADH dehydrogenase II in E. coli
      membranes, before the nuo genes were assigned. The activity measured is
      quinone reduction coupled to proton-gradient formation, which GO captures
      as GO:0008137 NADH dehydrogenase (ubiquinone) activity, an is_a descendant
      of the generic GO:0003954 that this review already accepts on three other
      rows. The contributes_to sense is retained: NuoB carries no NADH-binding
      site and contributes cluster N2 to the complex-level reaction.
    proposed_replacement_terms:
    - id: GO:0008137
      label: NADH dehydrogenase (ubiquinone) activity
    supported_by:
    - reference_id: PMID:3122832
      supporting_text: an enzyme (NADH dh I) that reacts with deamino-NADH or NADH
        whose turnover leads to generation of a H+ electrochemical gradient at a
        site between the primary dehydrogenase and ubiquinone
