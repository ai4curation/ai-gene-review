core_functions:
- description: >-
    Carries the terminal [4Fe-4S] cluster N2 of the complex I electron-transfer
    chain and passes electrons to quinone at the NuoB/NuoCD quinone site,
    contributing to proton-pumping NADH:ubiquinone oxidoreduction by
    plasma-membrane NDH-1.
