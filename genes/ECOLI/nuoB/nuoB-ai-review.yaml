- term:
    id: GO:0015990
    label: electron transport coupled proton transport
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000242188
  - UniProtKB:P0AFC7
  review:
    summary: >-
      NDH-1 couples NADH:quinone electron transfer to proton translocation; NuoB
      carries the terminal cluster N2 at the coupling site.
    action: ACCEPT
    reason: >-
      The PAINT node includes E. coli NuoB itself, which has direct experimental
      support (IMP row, PMID:16807239) for a role of NuoB acidic residues in
      redox-linked protonation at cluster N2. Complex I translocates protons
      across the cytoplasmic membrane driven by electron transfer, which is
      exactly this process.
    supported_by:
    - reference_id: file:ECOLI/nuoB/nuoB-uniprot.txt
      supporting_text: Couples the redox reaction to proton translocation (for
        every two electrons transferred, four hydrogen ions are translocated
        across the cytoplasmic membrane), and thus conserves the redox energy in
        a proton gradient.
