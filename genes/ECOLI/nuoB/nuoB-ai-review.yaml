suggested_questions:
- question: >-
    How do the redox-linked protonation of NuoB acidic residues (E67, D77, D94)
    near cluster N2 and quinone reduction propagate conformational or
    electrostatic signals to the antiporter-like membrane subunits?
- question: >-
    Does E. coli NuoB-N2 transfer electrons to menaquinone-8 and
    demethylmenaquinone with the same kinetics as to ubiquinone-8 under
    anaerobic growth?
suggested_experiments:
- description: >-
    Time-resolved freeze-quench EPR combined with proton-pumping measurements in
    proteoliposomes on NuoB E67Q/D77N variants to separate electron transfer to
    quinone from coupling.
  experiment_type: site-directed mutagenesis with spectroscopy
