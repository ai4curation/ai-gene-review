id: P0AFC7
gene_symbol: nuoB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  NuoB is the 20 kDa-family (PSST/NDUFS7-type) iron-sulfur subunit of the
  proton-pumping NADH:quinone oxidoreductase (NDH-1, respiratory complex I). It
  sits in the connecting (Q) module of the peripheral arm on the cytoplasmic face
  of the inner membrane and binds the terminal [4Fe-4S] cluster N2, the last
  centre of the intramolecular electron-transfer chain that delivers electrons
  from FMN-bound NADH oxidation in NuoF to the quinone bound in the cavity formed
  between NuoB and NuoCD. Conserved acidic residues near cluster N2 are needed for
  catalysis and are implicated in the coupling of quinone reduction to proton
  translocation by the membrane arm, so the subunit is required for
  energy-conserving NADH:quinone oxidoreduction in aerobic respiration.
