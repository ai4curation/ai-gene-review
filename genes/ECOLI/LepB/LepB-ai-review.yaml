suggested_questions:
- question: Which native E. coli type I signal-peptide substrates place the strongest kinetic constraints
    on LepB in vivo?
suggested_experiments:
- description: Profile signal-peptide cleavage intermediates after acute LepB inhibition or depletion
    using N-terminomics and Sec-substrate reporters.
  hypothesis: LepB has substrate-specific cleavage bottlenecks that become visible before global Sec precursor
    accumulation.
  experiment_type: N-terminomics after acute depletion
