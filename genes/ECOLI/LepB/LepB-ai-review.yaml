  label: Escherichia coli K-12
description: LepB is the E. coli type I signal peptidase. This multi-pass plasma-membrane serine-lysine
  peptidase cleaves N-terminal signal peptides from non-lipoprotein secretory and membrane precursors
  after or during their Sec-dependent translocation across the inner membrane.
