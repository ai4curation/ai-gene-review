- term:
    id: GO:0010165
    label: response to X-ray
  evidence_type: IMP
  original_reference_id: PMID:27718375
  qualifier: acts_upstream_of_or_within
  review:
    summary: >-
      The Keio ddlA deletion was among 33 "uncommon" hits with increased radiation sensitivity
      in a genome-wide survival screen.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      A single hit in a genome-wide knockout screen, reported without mechanism. DdlA does
      none of the work of responding to X-rays; any sensitivity of the deletion is most plausibly
      an indirect consequence of perturbed cell-wall precursor supply. The phenotype is not
      wrong as a phenotype, but as a GO process it over-states the gene's role. Same action
      as the cysE and betB rows from this screen.
    supported_by:
    - reference_id: PMID:27718375
      supporting_text: >-
        Our 76 genes includes 43 common genes and 33 uncommon (potentially novel) genes, i.e.,
        appY, atoS, betB, bglJ, clpP, cpxA, cysB, cysE, ddlA
