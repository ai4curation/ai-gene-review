suggested_questions:
- question: >-
    What is the physiological division of labour between DdlA and DdlB in E. coli: is DdlA
    expressed and contributing under standard growth, or only under specific conditions, given
    that the classical ddl mutant maps to ddlB?
- question: >-
    Is the radiation sensitivity of the Keio ddlA deletion reproducible and attributable to
    loss of DdlA rather than a polar or secondary effect?
suggested_experiments:
- experiment_type: genetic and expression analysis
  description: >-
    Compare growth, D-cycloserine sensitivity and UDP-MurNAc-tripeptide accumulation of ddlA,
    ddlB and ddlA ddlB (with D-Ala-D-Ala supplementation) strains, and measure DdlA and DdlB
    protein levels across growth conditions, to define the contribution of DdlA.
