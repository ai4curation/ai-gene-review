  label: Escherichia coli K-12
description: >-
  DdlA is one of two D-alanine-D-alanine ligases of Escherichia coli, an ATP-grasp enzyme
  that joins two D-alanine molecules into the dipeptide D-alanyl-D-alanine with hydrolysis
  of ATP to ADP and phosphate, using two magnesium (or manganese) ions per subunit. The D-Ala-D-Ala
  it makes is added by MurF to UDP-N-acetylmuramoyl-tripeptide to complete the pentapeptide
  stem of the cytoplasmic peptidoglycan precursor. DdlA is a soluble cytosolic protein, distinct
  from and partly redundant with the paralogous DdlB (the classical ddl gene product); either
  gene restores ligase activity to a ligase-deficient mutant. The relative physiological contribution
  of the two ligases is not well defined.
