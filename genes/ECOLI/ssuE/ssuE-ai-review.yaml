      supporting_text: The results showed that His-tagged SsuD and native SsuE coeluted from the column
        with 300 mM imidazole buffer (Fig. 2 , lane 4).
    - reference_id: PMID:26634408
      supporting_text: 'The results from these studies suggest that optimal transfer of reduced flavin

        from SsuE to SsuD requires defined protein-protein interactions, but diffusion

        can occur under specified conditions.'
