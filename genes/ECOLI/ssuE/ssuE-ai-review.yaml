  evidence_type: IEP
  original_reference_id: PMID:8774726
  qualifier: acts_upstream_of_or_within
  review:
    summary: The Ssu system supplies usable sulfur during sulfate limitation.
    action: ACCEPT
    reason: PMID:10480865 directly connects sulfur-limited expression with the characterized flavin-reduction/desulfonation
      activities. The older proteomic source PMID:8774726 identified SSI4 before sequence assignment;
      the target UniProt reference provenance and later SsuE characterization connect that protein to
      ssuE. This is the metabolic execution of an adaptive response, not transcriptional regulation by
      SsuE.
