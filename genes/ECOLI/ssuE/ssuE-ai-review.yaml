id: P80644
gene_symbol: ssuE
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: SsuE is the FMN reductase of the Escherichia coli two-component alkanesulfonate monooxygenase
  system. It uses either NADH or NADPH with comparable measured steady-state kinetics to generate FMNH2
  for the SsuD oxygenase, which releases sulfite from alkanesulfonates. SsuE also reduces FAD and riboflavin
  under biochemical assay conditions. Its active site spans a dimer, and a solution dimer–tetramer equilibrium
  shifts toward dimers upon FMN binding. SsuE–SsuD interactions promote efficient flavin transfer, while
  diffusion can support desulfonation under particular assay conditions.
