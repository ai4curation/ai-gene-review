- term:
    id: GO:0042803
    label: protein homodimerization activity
  evidence_type: IDA
  original_reference_id: PMID:10480865
  qualifier: enables
  review:
    summary: SsuE forms catalytically relevant dimers within a dimer–tetramer equilibrium.
    action: ACCEPT
    reason: The original homodimer characterization is refined by PMID:24816272, which directly reports
      solution dimer–tetramer equilibrium, FMN-favored dimers and active-site residues contributed by
      both subunits. Thus dimerization and FMN-reductase complex membership remain true; a tetrameric
      crystal is not evidence against the dimeric functional unit. The PAINT claim is corroborated on
      the target itself.
    supported_by:
    - &id006
      reference_id: PMID:24816272
      supporting_text: 'Analytical ultracentrifugation studies of SsuE confirm a

        dimer-tetramer equilibrium exists in solution, with FMN binding favoring the

        dimer. As the active site includes residues from both subunits, at least a

        dimeric association is required for the function of SsuE.'
- term:
    id: GO:0046306
    label: alkanesulfonate catabolic process
  evidence_type: IDA
  original_reference_id: PMID:10480865
  qualifier: involved_in
  review:
    summary: SsuD-mediated desulfonation is supplied with reduced flavin by SsuE.
    action: ACCEPT
    reason: SsuE performs the reductive half-reaction supplying FMNH2 to the oxygenase, so it actively
      contributes catalytic co-substrate production to the characterized catabolic system. The existing
      process assertion is not inferred solely from knockout necessity. Reductase redundancy demonstrated
      in S-313 is not imported as an E. coli deletion result.
    supported_by:
    - *id004
    - &id005
      reference_id: PMID:10480865
      supporting_text: 'The pure enzyme catalyzed the conversion of pentanesulfonic acid

        to sulfite and pentaldehyde and was able to desulfonate a wide range of

        sulfonated substrates including C-2 to C-10 unsubstituted linear

        alkanesulfonates, substituted ethanesulfonic acids and sulfonated buffers.'
