  review:
    summary: SsuD and SsuE form a specific enzyme–enzyme interaction.
    action: MODIFY
    reason: PMID:16997955 directly detects pair-specific coelution, cross-linking and fluorescence changes
      between the purified catalytic partners. Enzyme binding is a supported informative descendant of
      bare protein binding. PMID:26634408 further connects the interface to efficient flavin transfer
      but permits diffusion under specified conditions; binding is not equated with an obligatory permanent
      channel.
