      The measured NADH reaction also supports the GO:0052874 child. No redundant NEW descendant is proposed
      because the existing dual-donor GO:0008752 annotation already represents both measured activities;
      the NADPH sibling is retained because it is an existing annotation, not evidence of NADH inactivity.'
