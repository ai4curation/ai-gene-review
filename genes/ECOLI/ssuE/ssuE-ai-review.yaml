  review:
    summary: A transcript-level response to mitomycin C does not make SsuE a participant in the DNA damage
      response.
    action: MARK_AS_OVER_ANNOTATED
    reason: PMID:11967071 is a genome-wide expression survey in which nearly 30% of all genes changed
      significantly after mitomycin C treatment, so inclusion in its response set does not identify a
      role in DNA repair or damage signalling. SsuE is the FMN reductase of the alkanesulfonate desulfonation
      system and no assay links its activity to DNA damage chemistry. The now-recovered PAINT slice shows
      node PTN001577184 is seeded solely by this same P80644 expression annotation, so the IBA propagates
      that single weak expression phenotype rather than adding independent support. The term is not flatly
      false, since the gene does respond, but it over-reads a survey-level expression change; this matches
      how the same study's rows are treated for other E. coli genes.
