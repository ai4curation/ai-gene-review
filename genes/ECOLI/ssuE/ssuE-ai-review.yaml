- term:
    id: GO:0042803
    label: protein homodimerization activity
  evidence_type: IDA
  original_reference_id: PMID:10480865
  qualifier: enables
  review:
    summary: SsuE forms catalytically relevant dimers within a dimer–tetramer equilibrium.
    action: ACCEPT
    reason: The original homodimer characterization is refined by PMID:24816272, which directly reports
      solution dimer–tetramer equilibrium, FMN-favored dimers and active-site residues contributed by
      both subunits. Thus dimerization and FMN-reductase complex membership remain true; a tetrameric
      crystal is not evidence against the dimeric functional unit. The PAINT claim is corroborated on
      the target itself.
    supported_by:
    - &id006
      reference_id: PMID:24816272
      supporting_text: 'Analytical ultracentrifugation studies of SsuE confirm a

        dimer-tetramer equilibrium exists in solution, with FMN binding favoring the

        dimer. As the active site includes residues from both subunits, at least a

        dimeric association is required for the function of SsuE.'
