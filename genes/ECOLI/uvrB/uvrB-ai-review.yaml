    supporting_text: The nucleotide directly behind the beta-hairpin is flipped out and inserted into a small, highly conserved
      pocket in UvrB.
suggested_questions:
- question: Is a more specific ATP-dependent DNA term (for example an ATP-dependent DNA damage sensor or translocase activity)
    appropriate for UvrB, given that its ATPase drives local strand separation and movement on DNA rather than processive
    unwinding?
suggested_experiments:
- description: Single-molecule tracking of wild-type and Walker B mutant UvrB with UvrA on lesion-containing DNA to separate
    the ATP-hydrolysis-dependent steps (strand opening, hairpin insertion, handoff) from ATP-binding-dependent steps.
