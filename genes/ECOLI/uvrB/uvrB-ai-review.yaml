gene_symbol: uvrB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: UvrB (UvrABC system protein B) is the DNA damage-verification subunit of the bacterial nucleotide excision repair
  system. It is a superfamily 2 helicase-like ATPase with two RecA-like domains, a damage-sensing beta-hairpin, and a C-terminal
  UVR domain that contacts UvrC. Two UvrB subunits associate with a UvrA dimer to form the UvrA2B2 complex that scans DNA;
  at a putative lesion the DNA wraps around one UvrB, the beta-hairpin inserts between the strands, and UvrB probes one strand
  for damage. UvrB's DNA-dependent ATPase, cryptic in the free protein, is activated in the UvrAB complex and is required
  to form the stable UvrB-DNA preincision complex. UvrA then dissociates and the preincision complex recruits UvrC, which
  makes the incisions on both sides of the lesion; ATP binding by UvrB is needed for the 3' incision. UvrB acts on the nucleoid
  in the cytoplasm, and in E. coli its gene is LexA-repressed and induced as part of the SOS response.
