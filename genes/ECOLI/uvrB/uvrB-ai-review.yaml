core_functions:
- description: DNA-dependent ATP hydrolysis by UvrB, activated in the UvrA2B2 complex on DNA, drives beta-hairpin insertion,
    strand probing and formation of the stable UvrB-DNA preincision complex.
  molecular_function:
    id: GO:0016887
    label: ATP hydrolysis activity
  directly_involved_in:
