    summary: >-
      Mutant evidence: temperature-sensitive transacylase mutants are conditionally defective for fatty-acid
      synthesis.
    action: ACCEPT
    reason: >-
      The classical fabD mutants are temperature-sensitive for malonyl-CoA:ACP transacylase and for growth,
      which places the gene in the pathway; FabD itself catalyses one of its reactions, so this is participation
      rather than mere requirement, and the GOA `acts_upstream_of_or_within` qualifier understates it
      without making the term wrong. The cached record for this 1974 paper is a citation only, so the
      quotes used here come from the cloning study that complemented the same thermosensitive allele and
      from the curated UniProt pathway line.
