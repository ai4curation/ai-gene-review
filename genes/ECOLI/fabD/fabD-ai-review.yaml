    summary: >-
      Transacylase activity of the cloned gene product: overexpression raised MCAT activity about a thousandfold.
    action: ACCEPT
    reason: >-
      The gene was cloned by complementing a thermosensitive fabD mutant, and expressing it gave MCAT
      protein up to 10% of soluble protein with an approximately 1,000-fold increase in MCAT activity,
      which ties this activity to this gene product. UniProt cites this paper as the experimental evidence
      for the curated reaction.
    supported_by:
    - reference_id: PMID:1314802
      supporting_text: >-
        Expression of the fabD gene in an appropriate E. coli expression vector resulted in an accumulation
        of the MCT protein of up to 10% of total soluble protein, which was accompanied by an approximately
        1,000-fold increase in the MCT activity.
    - reference_id: PMID:1314802
      supporting_text: >-
        The Escherichia coli fabD gene encoding malonyl coenzyme A-acyl carrier protein transacylase (MCT)
        was cloned by complementation of a thermosensitive E. coli fabD mutant (fabD89).
