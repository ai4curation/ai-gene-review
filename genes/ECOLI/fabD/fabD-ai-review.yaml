suggested_questions:
- question: >-
    Is the malonyl-ACP pool set by FabD activity or by acetyl-CoA carboxylase flux, and does FabD ever
    become limiting in vivo?
suggested_experiments:
- description: >-
    Titrate FabD levels in vivo while measuring malonyl-ACP, malonyl-CoA and acyl-ACP pools, to locate
    the step that sets the malonyl-ACP supply for initiation and elongation.
