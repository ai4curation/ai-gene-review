taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  FabD is the malonyl-CoA:[acyl-carrier-protein] transacylase (MCAT) of the dissociated (type II) fatty-acid
  synthase. It transfers the malonyl group from malonyl-CoA onto the free thiol of the phosphopantetheine
  arm of holo-ACP, releasing CoA, and so converts the product of acetyl-CoA carboxylase into malonyl-ACP,
  the two-carbon donor consumed by every condensation of chain initiation and elongation. The reaction
  proceeds through a malonyl-enzyme intermediate on an active-site serine of an alpha/beta-hydrolase-like
  fold. The gene is essential and non-redundant in Escherichia coli - conditional fabD mutants are temperature-sensitive
  for growth and for transacylase activity - and it sits in a fatty-acid synthesis operon with the condensing
  enzyme and ketoreductase genes. Homologous mitochondrial transacylases (yeast Mct1, human MCAT) supply
  malonyl-ACP to the mitochondrial FAS II system.
