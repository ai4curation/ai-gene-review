  evidence_type: IEA
  original_reference_id: GO_REF:0000108
  review:
    summary: This IEA annotation is inferred from GO:0016989 (sigma factor antagonist
      activity) via logical inference. DnaK binds and inactivates sigma32, which represses
      heat shock gene transcription (PMID:8599944). The inference is sound since antagonizing
      sigma32 leads to negative regulation of sigma32-dependent transcription.
    action: ACCEPT
