- term:
    id: GO:0051082
    label: unfolded protein binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  review:
    summary: IEA annotation from InterPro (IPR012725). GO:0051082 is now formally
      obsolete (go-ontology#30962). DnaK does bind unfolded proteins, but this binding
      is in the context of its foldase activity, not as a passive binder. The function
      is better captured by GO:0044183 (protein folding chaperone) or GO:0140662 (ATP-dependent
      protein folding chaperone), both of which DnaK already has.
    action: MODIFY
    reason: GO:0051082 is now formally obsolete. DnaK's binding of unfolded proteins
      is mechanistically part of its ATP-dependent foldase cycle, not passive binding.
      The correct MF is GO:0044183 or its child GO:0140662. DnaK can also function
      as a holdase in some contexts (PMID:2203539, ATP-independent protection from
      aggregation), but the holdase NTR has not yet been created.
    proposed_replacement_terms:
    - id: GO:0044183
      label: protein folding chaperone
    supported_by:
