core_functions:
- molecular_function:
    id: GO:0140662
    label: ATP-dependent protein folding chaperone
  description: DnaK is the E. coli HSP70 homolog that functions as an ATP-dependent
    protein folding chaperone (foldase). It binds unfolded polypeptide segments, undergoes
    ATP hydrolysis- driven conformational changes (with DnaJ and GrpE co-chaperones),
    and releases substrates to allow folding. Multiple rounds of binding and release
    are required for efficient folding of most substrates (PMID:7937953). DnaK also
    protects proteins from heat inactivation (holdase function, ATP-independent; PMID:2203539)
    and cooperates with trigger factor to chaperone nascent polypeptides (PMID:10380927).
  directly_involved_in:
  - id: GO:0042026
    label: protein refolding
  - id: GO:0006457
    label: protein folding
  - id: GO:0034620
    label: cellular response to unfolded protein
  - id: GO:0009408
    label: response to heat
  - id: GO:0043335
    label: protein unfolding
  locations:
  - id: GO:0005829
    label: cytosol
  - id: GO:0016234
    label: inclusion body
  supported_by:
  - reference_id: PMID:7937953
    supporting_text: Several rounds of ATP-dependent interaction with DnaK and DnaJ
      are required for fully efficient folding
  - reference_id: PMID:10380927
    supporting_text: DnaK transiently associates with a wide variety of nascent and
      newly synthesized polypeptides, with a preference for chains larger than 30
      kDa
- molecular_function:
    id: GO:0016989
    label: sigma factor antagonist activity
  description: DnaK inhibits sigma32 (RpoH) transcriptional activity by direct binding,
    constituting the chaperone-mediated negative feedback loop of the heat shock response.
    DnaK and DnaJ cooperatively sequester free sigma32, preventing its association
    with RNA polymerase. GrpE and ATP drive the release cycle (PMID:8599944).
  directly_involved_in:
  - id: GO:0045892
    label: negative regulation of DNA-templated transcription
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:8599944
    supporting_text: DnaK and DnaJ cooperatively inhibit sigma32 activity in heat
      shock gene transcription
proposed_new_terms:
- proposed_name: holdase chaperone activity
  proposed_definition: Binding to an unfolded or misfolded protein to prevent its
    aggregation without actively catalyzing refolding. The holdase maintains the client
    protein in a soluble, folding-competent state.
  justification: DnaK directly protects heat-stressed RNA polymerase in an ATP-independent
    reaction, a general in-situ aggregation-prevention activity distinct from its
    ATP-dependent foldase cycle. Obsolete GO:0051082 describes binding only, whereas
    carrier-specific GO:0140309 requires escort to an acceptor or location that has
    not been demonstrated for this activity.
  proposed_parent:
    id: GO:0003674
    label: molecular_function
  supported_by:
  - reference_id: PMID:2203539
    supporting_text: the dnaK gene product, protects the host RNA polymerase enzyme
      from heat inactivation in an ATP-independent reaction
suggested_questions:
- question: How does DnaK's holdase activity (ATP-independent aggregation prevention)
    relate to its foldase activity? Should both be annotated once the holdase NTR
    is created?
- question: Does DnaK have a genuine disaggregase function independent of ClpB, or
    is it solely a co-factor for ClpB-mediated disaggregation?
- question: Under which conditions does DnaK bind Zn(II) in vivo, at what site and
    affinity, and does binding alter its ATPase or client-remodeling activity?
suggested_experiments:
- experiment_type: zinc-binding mechanism and physiology
  description: Map the Zn(II)-binding site and affinity with purified DnaK, then test
    site-directed mutants for ATPase, client-folding, and fitness phenotypes across
    controlled zinc concentrations.
- experiment_type: holdase-foldase separation assay
  description: Quantify ATP-independent protection from aggregation and ATP-dependent
    refolding for RNA polymerase and additional physiological clients using nucleotide-cycle
    and substrate-binding mutants to separate the two activities.
- experiment_type: disaggregation pathway reconstitution
  description: Compare DnaK alone with the DnaK-DnaJ-GrpE system and DnaK-DnaJ-GrpE-ClpB
    on preformed aggregates to define which disaggregation steps require ClpB.
