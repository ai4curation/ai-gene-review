- term:
    id: GO:0006260
    label: DNA replication
  evidence_type: IEA
  original_reference_id: GO_REF:0000043
  review:
    summary: IEA annotation from UniProt keyword mapping (KW-0235 DNA replication).
      UniProt describes DnaK as essential for phage lambda DNA replication and involved
      in chromosomal DNA replication through interaction with DnaA. This reflects
      a genuine but non-core function.
    action: KEEP_AS_NON_CORE
    reason: DnaK's role in DNA replication is well-documented for phage lambda (releasing
      lambda O and P from the preprimosomal complex) and proposed for chromosomal
      replication via DnaA interaction. However, this is not DnaK's primary evolved
      function -- it reflects chaperone activity applied to replication machinery,
      not a direct replication function.
  qualifier: involved_in
