description: >-
  ProTrek sequence-to-text retrieval for DnaK, the E. coli HSP70. Ranks 1 to 4 are all exact GOA matches
  and rank 1 is this review's core molecular function. Nothing is wrong until rank 5. The striking
  feature is the score: 11.94 at rank 1, among the lowest top-1 scores in the cohort, for the most
  canonical chaperone in bacteriology. High conservation appears to work against this retrieval -
  HSP70 GO sentences are spread across hundreds of organisms and no single one sits close to the query
  embedding - so score cannot be read as a proxy for how well-characterised a protein is. Assessment:
  3 correct not novel (CNN).
