id: P33599
gene_symbol: nuoC
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  NuoC (NuoCD) is the fused C/D subunit of the proton-translocating
  NADH:quinone oxidoreductase NDH-1 (respiratory complex I). A single
  596-residue polypeptide carries an N-terminal segment homologous to the
  30-kDa subunit (NuoC/Nqo5/NDUFS3) and a C-terminal segment homologous to the
  49-kDa subunit (NuoD/Nqo4/NDUFS2), joined by a short linker. It is the only
  peripheral-arm subunit without a redox cofactor. Together with NuoB (which
  carries the terminal [4Fe-4S] cluster N2) and the membrane subunit NuoH, the
  NuoD segment lines the long, enclosed quinone-binding cavity of complex I;
  conserved NuoD residues (Tyr273 and His224 in E. coli, equivalent to Tyr87
  and His38 of Thermus Nqo4) point at the quinone head group near cluster N2,
  where ubiquinone or menaquinone is reduced. The NuoC segment is required for
  the structural integrity and assembly of the complex. NuoCD sits on the
  cytoplasmic side of the inner (plasma) membrane in the peripheral arm, and
  its activity is part of the complex-level reaction in which NADH oxidation
  and quinone reduction are coupled to proton translocation across the
  membrane in the aerobic and anaerobic respiratory chains.
