core_functions:
- description: >-
    The NuoD (49-kDa) segment of the fused NuoCD polypeptide forms, with NuoB
    and NuoH, the quinone-binding site of the peripheral arm of NDH-1. Its
    conserved Tyr273 and His224 ligate the quinone head group next to cluster
    N2, so NuoCD contributes to the proton-coupled NADH:ubiquinone (and
    menaquinone) oxidoreductase activity of the plasma-membrane complex I.
  molecular_function:
    id: GO:0048038
    label: quinone binding
  contributes_to_molecular_function:
    id: GO:0008137
    label: NADH dehydrogenase (ubiquinone) activity
  directly_involved_in:
  - id: GO:0022904
    label: respiratory electron transport chain
  - id: GO:1902600
    label: proton transmembrane transport
  locations:
  - id: GO:0005886
    label: plasma membrane
  in_complex:
    id: GO:0045271
    label: respiratory chain complex I
  supported_by:
  - reference_id: PMID:34308841
    supporting_text: Both DTyr273 and DHis224, found in the proximity of bound
      decylubiquinone (Baradaran et al., 2013) are conserved in E. coli and point
      toward the quinone binding site
  - reference_id: PMID:25545070
    supporting_text: residues Tyr273 and His224 were considered candidates for
      having important interactions with the quinone headgroup
  - reference_id: PMID:23417064
    supporting_text: The quinone headgroup binds at the deep end of this chamber,
      near iron-sulphur cluster N2.
suggested_questions:
- question: Does the E. coli NuoD segment bind ubiquinone-8 and menaquinone-8 with
    the same head-group ligation (Tyr273/His224), or do the two physiological
    quinones occupy different positions in the Q-cavity?
- question: What is the specific function of the NuoC (30-kDa) segment beyond
    structural stabilisation, and does the C/D fusion linker affect the
    coupling of quinone reduction to proton pumping compared with organisms
    that have separate NuoC and NuoD subunits?
suggested_experiments:
- description: Cryo-EM of E. coli complex I under turnover with ubiquinone-8 or
    menaquinone-8 analogues, combined with Tyr273F/His224 variants, to resolve
    head-group ligation and its effect on proton-pumping stoichiometry.
- description: Split the nuoCD fusion into separate nuoC and nuoD genes on the
    chromosome and measure assembly, NADH:quinone activity and proton
    translocation to test whether the fusion matters for function.
