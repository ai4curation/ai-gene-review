    action: ACCEPT
    reason: NDH-1 couples quinone reduction to proton translocation, and the
      quinone-reduction step at the NuoCD/NuoB/NuoH site is thought to drive
      the conformational and electrostatic coupling to the membrane-arm proton
      pumps. NuoCD is a peripheral, non-membrane subunit and is not itself a
      proton channel, but it does part of the work of the coupled process
      through the energy-transducing step it hosts.
