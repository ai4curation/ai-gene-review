    label: NADH dehydrogenase activity
  evidence_type: IDA
  original_reference_id: PMID:3122832
  qualifier: contributes_to
  review:
    summary: Matsushita et al. (1987) distinguished in E. coli membranes the
      proton-gradient-generating NADH dehydrogenase I (NDH-1, the nuo-encoded
      complex I) from the non-electrogenic NDH-2. NuoCD contributes to this
      complex-level NADH:quinone oxidoreductase activity.
    action: MODIFY
    reason: The contributes_to claim is sound, but GO:0003954 (NADH + H+ +
      acceptor = NAD+ + reduced acceptor) is a generic is_a ancestor of the
      activity actually measured, the proton-coupled NADH:ubiquinone reaction of
      NDH-1 (GO:0008137, which is_a GO:0003954). This review already accepts
      contributes_to GO:0008137 from the IBA, IDA and IMP rows, so the specific
      descendant is the appropriate replacement. NuoCD itself has no NADH site
      (NADH is oxidised at the FMN of NuoF), so the term must stay a
      contributes_to assertion.
