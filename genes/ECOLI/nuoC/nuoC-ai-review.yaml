- term:
    id: GO:0048038
    label: quinone binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR001135
  review:
    summary: InterPro2GO from the NuoD/49-kDa signature. The NuoD segment lines
      the quinone-binding cavity, and its conserved Tyr273 and His224 point at
      the quinone head group.
    action: ACCEPT
    reason: Structural and mutational evidence supports quinone binding by the
      NuoD segment. In the Thermus thermophilus structure the decylubiquinone
      head group is hydrogen-bonded by Nqo4 Tyr87 and His38. The equivalent
      E. coli residues Tyr273 and His224 are conserved and point toward the
      quinone site in the E. coli cryo-EM structure. Mutation of Tyr273
      changes inhibitor sensitivity, and mutation of the Gly217-Phe227 loop
      abolishes activity. NuoB and NuoH also contribute to the cavity, but
      the head-group ligands are on NuoD, so quinone binding is a fair
      description of the NuoCD activity. This is the core molecular function.
    supported_by:
    - reference_id: PMID:23417064
      supporting_text: hydrogen-bonded to 4_Tyr87, while another interacts,
        unexpectedly, with 4_His38
    - reference_id: PMID:34308841
      supporting_text: Both DTyr273 and DHis224, found in the proximity of bound
        decylubiquinone (Baradaran et al., 2013) are conserved in E. coli and
        point toward the quinone binding site
    - reference_id: PMID:25545070
      supporting_text: The three-dimensional structural model of NDH-1 suggests
        that the NuoD segment, together with the neighboring subunits,
        constitutes a putative quinone binding cavity.
