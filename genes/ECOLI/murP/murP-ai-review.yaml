    supporting_text: MurP lacks an EIIA domain and was found to require the activity of
      the crr-encoded enzyme IIA-glucose (EIIA(Glc)), a component of the major glucose
      transport system for growth on MurNAc.
  - reference_id: PMID:18723630
    supporting_text: The PTS translocates the amino sugar across the cell membrane while
      phosphorylating it, receiving the phosphate ultimately from phosphoenolpyruvate and
      yielding intracellular MurNAc-6-phosphate (MurNAc-6-P).
suggested_questions:
- question: >-
    How does MurP take up 1,6-anhydro-MurNAc without phosphorylating it: by facilitated
    diffusion through the EIIC channel, and does this contribute measurably to
    anhMurNAc recycling in vivo compared with AmpG import of GlcNAc-anhMurNAc peptides?
