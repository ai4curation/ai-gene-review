description: >-
  MurP is the N-acetylmuramic acid (MurNAc)-specific enzyme IIBC of the
  phosphoenolpyruvate-dependent sugar phosphotransferase system (PTS) in E. coli. It is
  a polytopic inner membrane protein of the glucose PTS family with an N-terminal
  cytoplasmic EIIB domain (active-site Cys29, phosphorylated as phosphocysteine) and a
  C-terminal EIIC translocation domain; it lacks its own EIIA domain and receives
  phosphoryl groups from the glucose-specific EIIA (Crr), which is phosphorylated via
  enzyme I and HPr from phosphoenolpyruvate. MurP imports MurNAc and phosphorylates it
  during translocation to give cytoplasmic MurNAc 6-phosphate, which the etherase MurQ
  converts to GlcNAc 6-phosphate; it is required for growth on MurNAc as sole carbon
  source. MurP can also take up 1,6-anhydro-MurNAc, which it cannot phosphorylate and
  which is instead phosphorylated by AnmK. murP is the second gene of the murQP operon,
  repressed by MurR, induced by MurNAc 6-phosphate and activated by cAMP-CAP.
