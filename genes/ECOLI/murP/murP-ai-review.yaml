core_functions:
- description: >-
    MurNAc-specific PTS enzyme IIBC: imports N-acetylmuramic acid across the inner
    membrane and phosphorylates it to MurNAc 6-phosphate, using phosphoryl groups passed
    from phosphoenolpyruvate via enzyme I, HPr and EIIA-Glc (Crr) to its EIIB Cys29;
    the first step of MurNAc catabolism.
  molecular_function:
