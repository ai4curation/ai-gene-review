id: P23908
gene_symbol: argE
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: ArgE is a cytoplasmic metal-dependent N-acetylornithine deacetylase in Escherichia coli.
  It hydrolyzes N-acetylornithine to ornithine and acetate in the linear arginine biosynthetic pathway.
  The homodimer also hydrolyzes other N-acyl amino acids in vitro. Purified enzyme contains zinc, and
  additional zinc or cobalt can enhance activity; cobalt activation in an assay does not establish cobalt
  as its normal cellular cofactor.
