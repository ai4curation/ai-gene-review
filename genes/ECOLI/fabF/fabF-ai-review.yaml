gene_symbol: fabF
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  FabF is 3-oxoacyl-[acyl-carrier-protein] synthase II (beta-ketoacyl-ACP synthase
  II, KAS II) of the dissociated type II fatty acid synthase of Escherichia coli. It
  is a soluble homodimeric condensing enzyme with the thiolase fold whose
  active-site nucleophile Cys163 sits at the bottom of a hydrophobic acyl pocket.
  FabF condenses saturated and unsaturated acyl-ACPs of about C6 to C16 with
  malonyl-ACP, adding two carbons per cycle, and, unlike FabB, can also use
  CoA-linked substrates in vitro. Its distinctive role is the efficient elongation
  of palmitoleoyl-ACP (cis-9-hexadecenoyl-ACP) to cis-vaccenoyl-ACP. Because its
  activity rises at low growth temperature, FabF increases the proportion of
  cis-vaccenate in membrane phospholipids in the cold, making it the effector of
  the temperature control of fatty acid composition; fabF mutants lack
  cis-vaccenate and this thermal response but grow normally unless fabB is also
  defective. FabF is a target of cerulenin, platensimycin and platencin.
