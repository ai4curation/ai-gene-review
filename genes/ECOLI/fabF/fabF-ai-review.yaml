suggested_questions:
- question: >-
    Is the cold-induced rise in FabF-dependent cis-vaccenate synthesis due solely to
    the intrinsic temperature dependence of KAS II kinetics, or also to changes in
    FabF abundance or acyl-ACP pool composition?
suggested_experiments:
- description: >-
    Express FabF from a temperature-independent promoter in a fabF-null strain and
    measure cis-vaccenate content and acyl-ACP pools at 15, 30 and 42 C, alongside
    in vitro palmitoleoyl-ACP elongation kinetics at the same temperatures.
