core_functions:
- description: >-
    3-oxoacyl-ACP synthase II (KAS II) of type II fatty acid elongation: condenses
    saturated and unsaturated acyl-ACPs (about C6-C16) with malonyl-ACP via active-site
    Cys163, and specifically elongates palmitoleoyl-ACP to cis-vaccenoyl-ACP; its
    temperature-dependent activity sets the cis-vaccenate content of membrane lipids.
