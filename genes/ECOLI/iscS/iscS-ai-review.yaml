- term:
    id: GO:0009589
    label: detection of UV
  evidence_type: NAS
  original_reference_id: PMID:10753862
  qualifier: involved_in
  review:
    summary: >-
      The cited paper concerns sulfur transfer from IscS to ThiI for tRNA s4U
      synthesis; s4U in tRNA is the near-UV chromophore, but IscS itself plays
      no part in detecting UV.
    action: REMOVE
    reason: >-
      This non-traceable statement extrapolates from IscS's role in making s4U
      to the downstream photobiology of s4U-containing tRNA. IscS neither
      absorbs UV nor transduces a UV signal; at most it acts far upstream. The
      cited abstract contains no UV-detection data.
    supported_by:
    - reference_id: PMID:10753862
