    label: tRNA wobble position uridine thiolation
  evidence_type: IDA
  original_reference_id: PMID:16387657
  qualifier: involved_in
  review:
    summary: >-
      In the reconstituted mnm5s2U34 2-thiolation system, IscS desulfurizes
      cysteine and transfers its persulfide sulfur to TusA, the first carrier
      of the Tus relay that ends at MnmA.
    action: ACCEPT
    reason: >-
      IscS performs the first chemical step of the process (sulfur
      mobilization from cysteine and persulfide transfer to TusA), so it
      participates in, rather than merely being required for, wobble uridine
      thiolation. This is one of the major sulfur-donor branches of IscS.
    supported_by:
    - reference_id: PMID:16387657
      supporting_text: >-
        Efficient 2-thiouridine formation in vitro was reconstituted with
        recombinant TusA, a TusBCD complex, TusE, and previously identified IscS
        and MnmA.
    - reference_id: PMID:16387657
      supporting_text: IscS transfers the persulfide sulfur to TusA.
- term:
    id: GO:0002937
    label: tRNA 4-thiouridine biosynthesis
  evidence_type: IMP
  original_reference_id: PMID:10781607
  qualifier: acts_upstream_of_or_within
  review:
    summary: >-
      Deletion of iscS abolishes tRNA s4U and the tRNA sulfurtransferase
      activity of cell extracts; biochemically, IscS supplies the sulfane
      sulfur that ThiI then transfers to U8 of tRNA.
    action: ACCEPT
    reason: >-
      Genetic loss-of-function and complementation, together with
      reconstitution showing sulfur moves IscS -> ThiI -> tRNA, establish IscS
      as the sulfur-mobilizing enzyme of s4U biosynthesis. IscS does part of the
      work of the process (sulfur mobilization and transpersulfidation to ThiI
      Cys456).
    supported_by:
    - reference_id: PMID:10781607
      supporting_text: >-
        In frame deletion of the iscS gene in Escherichia coli results in a
        mutant strain that lacks s(4)U in its tRNA.
    - reference_id: PMID:10753862
      supporting_text: >-
        the sulfane sulfur generated by IscS is transferred sequentially to ThiI
        and then to tRNA during the in vitro synthesis of s(4)U.
