proposed_new_terms: []
suggested_questions:
- question: >-
    How is IscS persulfide flux partitioned between IscU, TusA, ThiI and FdhD in
    vivo, and does competition for the shared Cys328 binding surface set that
    partition under iron limitation or oxidative stress?
- question: >-
    Is the [2Fe-2S] cluster bridged between IscS Cys328 and IscU a productive
    on-pathway intermediate in E. coli or an artefact of in vitro reconstitution?
- question: >-
    Does IscS contribute selenium for selenophosphate synthesis under
    physiological selenium levels, or is that role mainly fulfilled by CsdB/SufS?
suggested_experiments:
- description: >-
    Quantify persulfide occupancy on IscU, TusA, ThiI and FdhD in cells
    expressing IscS surface variants that selectively block individual partner
    binding, using persulfide-specific proteomics.
  experiment_type: persulfide proteomics
- description: >-
    Time-resolved spectroscopy (Mossbauer/EPR) of IscS-IscU-CyaY-Fdx complexes
    to determine whether IscS Cys328 directly ligates the nascent [2Fe-2S]
    cluster.
  experiment_type: spectroscopy
