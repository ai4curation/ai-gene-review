id: P0A6B7
gene_symbol: iscS
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  IscS is the housekeeping pyridoxal 5'-phosphate (PLP)-dependent cysteine
  desulfurase of Escherichia coli, a cytosolic homodimer encoded in the
  iscRSUA-hscBA-fdx operon. It converts L-cysteine to L-alanine and carries the
  released sulfane sulfur as a persulfide on its active-site Cys328, located on
  a flexible surface loop. From this persulfide IscS delivers sulfur to a range
  of acceptor proteins that bind one at a time around Cys328: the scaffold IscU
  for assembly of [2Fe-2S] and [4Fe-4S] clusters (with frataxin/CyaY, IscX and
  ferredoxin acting as modulators of the IscS-IscU complex); ThiI for
  4-thiouridine formation in tRNA and for thiazole/thiamine biosynthesis; TusA,
  the entry point of the Tus relay that leads to MnmA-catalysed
  2-thiolation of the wobble uridine; and FdhD for maturation of molybdenum
  formate dehydrogenases. IscS also degrades L-selenocysteine in vitro and has
  been implicated in selenium delivery for selenophosphate synthesis. Loss of
  IscS abolishes tRNA s4U and causes thiamine and nicotinic acid auxotrophy and
  slow growth.
