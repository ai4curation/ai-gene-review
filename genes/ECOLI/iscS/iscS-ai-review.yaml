- term:
    id: GO:0072348
    label: sulfur compound transport
  evidence_type: IDA
  original_reference_id: PMID:10739946
  qualifier: involved_in
  review:
    summary: >-
      The cited work characterizes cysteine desulfurase and selenocysteine
      lyase kinetics of purified IscS; it does not measure movement of sulfur
      compounds across or within compartments.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      GO transport terms describe directed movement of a substance by a
      transporter or pore. IscS mobilizes sulfur as a protein persulfide and
      hands it to acceptor proteins; that is captured by sulfur carrier
      activity (GO:0097163), not by a transport process. The term over-reads
      the sulfur-delivery biology.
    supported_by:
    - reference_id: PMID:10753862
      supporting_text: >-
        The enzyme converts L-cysteine to L-alanine and sulfane sulfur (S(0)) in
        the form of a cysteine persulfide in its active site.
