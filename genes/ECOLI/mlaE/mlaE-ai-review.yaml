  review:
    summary: >-
      Phylogenetic inference of phospholipid transport for the MlaE permease clade;
      E. coli MlaE is one of the experimental descendants grounding the node.
    action: MODIFY
    reason: >-
      Correct but general. MlaE moves phospholipid between the inner membrane and
      the periplasmic MlaD/MlaC lipid-binding sites as part of the Mla
      intermembrane transport system, which is precisely GO:0120010 intermembrane
      phospholipid transfer (an is_a child of phospholipid transport), a term
      already annotated to this gene. GO:0120010 is direction-neutral, appropriate
      given the debate over anterograde versus retrograde net flux.
    proposed_replacement_terms:
    - id: GO:0120010
      label: intermembrane phospholipid transfer
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - GRANULARITY_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN000766204
        source_status: SUPPORTS_TRANSFER
        comment: >-
          The PAINT node correctly places phospholipid transport in the MlaE
          permease clade; the only issue is that the more specific intermembrane
          transfer term is warranted for E. coli MlaE.
      - source_id: UniProtKB:P64606
        source_status: SUPPORTS_TRANSFER
        comment: >-
