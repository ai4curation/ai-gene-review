suggested_questions:
- question: >-
    Is the net physiological direction of MlaFEDB-mediated phospholipid flux
    retrograde under all growth conditions, or can MlaE operate anterogradely,
    for example during envelope stress?
- question: >-
    How do the two phospholipids observed in the MlaE pocket move into the MlaD
    pore, and does lipid reorientation (head-group flipping) occur within MlaE?
suggested_experiments:
- description: >-
    Combine MlaE pocket-residue substitutions (e.g. Leu70, Tyr81, Leu99, Arg97)
    with nanodisc point-to-point transfer assays using radiolabelled
    phospholipids to determine which residues control binding versus ATP-coupled
    translocation.
  experiment_type: mutagenesis with reconstituted phospholipid-transfer assay
