- term:
    id: GO:1990531
    label: phospholipid-translocating ATPase complex
  evidence_type: IPI
  original_reference_id: PMID:27529189
  qualifier: part_of
  review:
    summary: >-
      Thong et al. showed that MlaF, MlaE, MlaD and MlaB co-purify as a stable
      inner-membrane ABC transporter complex.
    action: MODIFY
    reason: >-
      Complex membership is well supported, but GO:1990531 is defined as a complex
      that functions as a phospholipid-translocating P-type ATPase (the P4-ATPase
      flippase family). MlaFEDB is an ATP-binding cassette transporter, not a
      P-type ATPase, so the appropriate complex term is GO:0043190 ATP-binding
      cassette (ABC) transporter complex, already annotated to this gene.
    proposed_replacement_terms:
    - id: GO:0043190
      label: ATP-binding cassette (ABC) transporter complex
    supported_by:
    - reference_id: PMID:27529189
      supporting_text: >-
        MlaE and MlaF constitute TMDs and NBDs of a canonical ABC transporter,
        respectively (Malinverni and Silhavy, 2009).
- term:
    id: GO:0005543
    label: phospholipid binding
  evidence_type: IDA
  original_reference_id: PMID:33236984
  qualifier: enables
  review:
    summary: >-
      Cryo-EM of E. coli MlaFEDB resolves two diacyl phospholipids bound in an
      outward-open pocket of the MlaE dimer, and in vivo photocrosslinking with
      p-benzoyl-phenylalanine at five MlaE pocket residues captures radiolabelled
      phospholipid.
    action: NEW
    reason: >-
      Direct structural and in vivo crosslinking evidence that MlaE itself binds
      phospholipid substrate in its pocket, independently corroborated by the
      E. coli structure of Tang et al. This substrate-binding activity is not in
      GOA for MlaE. It is a molecular function of MlaE, not an inference from
      necessity.
    supported_by:
    - reference_id: PMID:33236984
      supporting_text: >-
        Additional density was apparent in the outward-open pocket of MlaE, which
        is the right size and shape to accommodate two diacyl phospholipids
    - reference_id: PMID:33236984
      supporting_text: >-
        Thus, the phospholipid-binding site observed in our MlaFEDB structure is
        occupied by phospholipids in vivo.
