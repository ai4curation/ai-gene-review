gene_symbol: mlaE
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  MlaE (YrbE) is the integral inner-membrane permease (transmembrane domain)
  subunit of the MlaFEDB ATP-binding cassette complex of the Mla (maintenance of
  outer membrane lipid asymmetry) intermembrane phospholipid transport system.
  Two MlaE protomers form the membrane core of the MlaF2E2D6B2 complex, with the
  MlaF ATPases on the cytoplasmic face and the hexameric MlaD MCE ring sitting on
  the periplasmic face. Cryo-EM structures show an outward-open hydrophobic
  pocket in the MlaE dimer that binds diacyl phospholipids and lines up with the
  central pore of the MlaD ring, forming a continuous lipid pathway into the
  periplasm; in vivo photocrosslinking confirms phospholipid occupancy of this
  pocket. ATP-driven conformational change of MlaE is thought to collapse the
  pocket and move lipid between the inner membrane and MlaD/MlaC. Together with
  the periplasmic carrier MlaC and the outer-membrane MlaA-OmpC/F complex, the
  system moves glycerophospholipids between the inner and outer membranes, with
  reconstitution data favouring net retrograde (outer-to-inner membrane)
  transport; loss of MlaE leads to phospholipid accumulation in the outer leaflet
  of the outer membrane and sensitivity to SDS-EDTA.
