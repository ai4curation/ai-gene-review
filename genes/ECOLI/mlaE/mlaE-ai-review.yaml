core_functions:
- description: >-
    Integral inner-membrane permease subunit of the MlaFEDB ABC transporter that
    binds glycerophospholipid in an outward-open pocket of the MlaE dimer and,
    driven by MlaF ATP hydrolysis, moves it between the inner membrane and the
    periplasmic MlaD/MlaC lipid-binding sites, contributing to the phospholipid
    transfer activity of the complex.
