      hydrophobic pocket formed by TMs 1, 2, and 5 of LptF and LptG
  - reference_id: PMID:30894744
    supporting_text: The negatively charged 1-PO4 group is accommodated by a
      cluster of positively charged residues from LptG
  - reference_id: PMID:18375759
