- term:
    id: GO:0140332
    label: lipopolysaccharide transfer activity
  evidence_type: IDA
  original_reference_id: PMID:30894744
  qualifier: contributes_to
  review:
    summary: LptG and LptF transmembrane helices together form the LPS-binding
      cavity of LptB2FG, which captures LPS from the outer leaflet of the inner
      membrane and expels it toward the LptC beta-jellyroll; LptG contributes
      the positively charged cluster that binds the lipid A 1-phosphate.
    action: NEW
    reason: GO:0140332 (removes LPS from the outer leaflet of a donor membrane,
      moves it through the aqueous phase in a hydrophobic pocket and delivers
      it to the outer leaflet of an acceptor membrane) is the activity of the
      Lpt bridge as a whole. LptG performs part of it, extraction from the
      donor membrane, as one half of the LPS-binding cavity, so the
      contributes_to qualifier is used. GO:0015221
      lipopolysaccharide transmembrane transporter activity is not used, because
      E. coli structures show LptB2FG extrudes LPS out of the membrane rather
      than across it. The comparator LptC carries GO:0140332, and the
      P. putida LptG review uses the same contributes_to GO:0140332 core term.
    supported_by:
    - reference_id: PMID:30894744
      supporting_text: LptB2FGC captures LPS from the membrane outer leaflet,
        using a large outward-open cavity.
    - reference_id: PMID:30894744
      supporting_text: In summary, the cavity inside the TMDs is highly
        complementary in both shape and surface properties to accommodate an LPS
        molecule.
    - reference_id: PMID:29449493
      supporting_text: In our model, LptBFGC extracts LPS molecules from the
        inner membrane and loads them into the bridge.
core_functions:
- description: Transmembrane domain subunit of the LptB2FG ABC transporter that,
    with LptG, forms the outward-open cavity that captures LPS from the outer
    leaflet of the inner membrane and, powered by ATP hydrolysis by LptB,
    expels it into the periplasmic Lpt bridge via the LptF/LptC
    beta-jellyrolls; LptG supplies the lysine/arginine cluster that binds the
    lipid A 1-phosphate.
  contributes_to_molecular_function:
    id: GO:0140332
    label: lipopolysaccharide transfer activity
  directly_involved_in:
