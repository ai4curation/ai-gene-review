suggested_questions:
- question: Do LptF and LptG make distinct, non-interchangeable contributions to
    LPS capture and expulsion (for example, LptF Arg33 contacting the inner core
    versus the LptG lysine cluster binding the 1-phosphate), or are their roles
    largely symmetric apart from LptC docking on the LptF beta-jellyroll?
- question: GO currently has no term for extraction of a lipid from a membrane
    leaflet by an ABC transporter; is contributes_to lipopolysaccharide transfer
    activity (GO:0140332) the intended way to capture the TMD subunits of
    LptB2FG, or should the ontology add an ATP-dependent LPS extraction
    (extractase) activity?
suggested_experiments:
- experiment_type: site-directed crosslinking in vivo
  description: Incorporate photo-crosslinkable amino acids along TM1-TM3 and
    the beta-jellyroll of LptG and map LPS and LptC crosslinks across the
    ATPase cycle (wild type versus LptB E163Q) to test the order of LPS entry,
    LptC TM displacement and expulsion predicted by the cryo-EM model.
- experiment_type: domain-swap complementation
  description: Exchange beta-jellyroll domains between LptF and LptG and test
    complementation of LptF/LptG depletion strains and LPS transport in
    reconstituted proteoliposomes to determine what role the LptG periplasmic
    domain plays, given that LptC docks on the LptF beta-jellyroll.
