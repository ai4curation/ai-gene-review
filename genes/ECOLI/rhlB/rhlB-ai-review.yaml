taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: RhlB is a DEAD-box ATP-dependent RNA helicase of Escherichia coli and a core component of
  the RNA degradosome. It binds the disordered C-terminal scaffold of RNase E, which stimulates its RNA-dependent
  ATPase, and unwinds structured RNA so that PNPase and RNase E can degrade it. RhlB can also bind PNPase
  directly and form homodimers.
