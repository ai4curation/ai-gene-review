id: P45530
gene_symbol: tusB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: TusB is a structural subunit of the cytoplasmic TusBCD sulfur-relay complex that participates
  in C2 thiolation of tRNA wobble uridine. Two copies each of TusB, TusC and TusD form a heterohexamer.
  TusB supports the sulfur-transfer assembly, whereas the experimentally implicated sulfur-bearing cysteine
  is on TusD.
