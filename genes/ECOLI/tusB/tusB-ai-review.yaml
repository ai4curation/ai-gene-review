  review:
    summary: Retain the supported tRNA wobble position uridine thiolation annotation.
    action: ACCEPT
    reason: The protein participates in the reconstituted U34 C2-thiolation mechanism, beyond the original
      necessity phenotype. Its contribution is the positively characterized TusBCD assembly; the sulfur-bearing
      residue identified by mutagenesis is on TusD, so no autonomous carrier activity is inferred for
      this subunit. The recorded ancestral source PANTHER:PTN002206503 is assessed as an inherited functional
      claim, not a pairwise donor count; self-inclusion among descendant evidence is not circular. The
      lineage-loss check and target-specific source scope are recorded in the consultation.
    supported_by:
    - &id001
      reference_id: PMID:16387657
      supporting_text: Efficient 2-thiouridine formation in vitro was reconstituted with recombinant TusA,
        a TusBCD complex, TusE, and previously identified IscS and MnmA.
    - &id002
      reference_id: PMID:16472754
      supporting_text: Here, we solved the 2.15 angstroms crystal structure of the E. coli TusBCD complex,
        a sulfur transfer mediator, forming a heterohexamer composed of a dimer of the heterotrimer.
    - &id003
      reference_id: PMID:16472754
      supporting_text: In vivo mutant analyses revealed that only Cys78, in the TusD subunit, participates
        in sulfur transfer during the s2U modification process.
