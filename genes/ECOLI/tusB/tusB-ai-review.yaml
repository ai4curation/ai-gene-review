  label: Escherichia coli K-12
description: TusB is a small cytoplasmic protein of the DsrH/TusB family and one of the three subunits
  of the heterohexameric TusBCD complex (a dimer of TusB-TusC-TusD heterotrimers). TusBCD relays persulfide
  sulfur from TusA to TusE in the IscS-TusA-TusBCD-TusE-MnmA pathway that installs the 2-thio group of
  5-methylaminomethyl-2-thiouridine (mnm5s2U) at wobble position 34 of tRNA(Lys), tRNA(Glu) and tRNA(Gln).
  TusB carries no catalytic cysteine of its own; the sulfur-carrying residue of the complex is TusD Cys78,
  and TusB is required as a structural subunit of the relay complex.
