id: P60472
gene_symbol: ispU
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: IspU (UppS, formerly Rth/YaeS) is the soluble, homodimeric cis-prenyltransferase of Escherichia
  coli that makes undecaprenyl diphosphate (C55-PP). It condenses eight isopentenyl diphosphate units
  onto (2E,6E)-farnesyl diphosphate within a hydrophobic active-site tunnel whose floor residues limit
  elongation to C55, in a magnesium-dependent reaction. Its product is dephosphorylated to undecaprenyl
  phosphate, the lipid carrier on which peptidoglycan, lipopolysaccharide O-antigen, enterobacterial common
  antigen and other envelope glycans are assembled; the gene is essential and temperature-sensitive mutants
  lose undecaprenyl phosphate, swell and lyse.
