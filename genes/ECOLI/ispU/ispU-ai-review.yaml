suggested_questions:
- question: How does soluble UppS hand its hydrophobic C55-PP product to the membrane, and does it associate
    peripherally with the inner membrane or with UppP in vivo?
suggested_experiments:
- description: Track the membrane partitioning of UppS and newly made C55-PP in vivo (fractionation with
    membrane markers plus lipidomics after UppS depletion) to determine where product release occurs.
