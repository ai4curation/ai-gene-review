- description: Cytosolic homodimeric cis-prenyltransferase that condenses eight isopentenyl diphosphates
    onto (2E,6E)-farnesyl diphosphate to make di-trans,octa-cis-undecaprenyl diphosphate, the precursor
    of the undecaprenyl-phosphate carrier lipid used for envelope glycan assembly.
