  label: Escherichia coli K-12
description: >-
  PaaK is the cytoplasmic phenylacetate-CoA ligase (EC 6.2.1.30) of Escherichia
  coli, an ATP-dependent member of the ANL (acyl-CoA synthetase/adenylate-forming)
  superfamily encoded at the end of the paaABCDEFGHIJK operon. It activates
  phenylacetate to phenylacetyl-CoA with release of AMP and pyrophosphate, the
  first and committed step of the aerobic hybrid phenylacetate catabolic pathway
  in which all subsequent intermediates are processed as CoA thioesters
  (epoxidation by PaaABCE, isomerization by PaaG, hydrolytic ring opening by PaaZ
  and beta-oxidation-like steps to succinyl-CoA and acetyl-CoA). Its product,
  phenylacetyl-CoA, is also the inducer that relieves PaaX repression of the paa
  genes, so PaaK activity couples substrate availability to pathway expression.
