suggested_questions:
- question: >-
    Is E. coli PaaK post-translationally regulated, for example by PaaY-mediated
    acetylation as proposed by analogy to anaerobic benzoate-CoA ligase?
suggested_experiments:
- description: >-
    Test whether PaaY acetylates PaaK in vitro and whether acetylation (or a
    paaY deletion) alters phenylacetate-CoA ligase activity and phenylacetyl-CoA
    pools in vivo.
