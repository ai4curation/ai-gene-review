    id: GO:0008047
    label: enzyme activator activity
  evidence_type: IDA
  original_reference_id: PMID:9334229
  qualifier: enables
  review:
    action: ACCEPT
    summary: HPr directly activates glycogen phosphorylase.
    reason: Binding and coupled enzyme assays support allosteric activation, with greater activity for
      unphosphorylated HPr. The native effect is species-specific and is not transferred to all HPr/NPr
      homologs. This term is retained at the specificity supported for the measured activator role.
    supported_by:
    - reference_id: PMID:9334229
      supporting_text: 'HPr binding increases GP activity to 250% of the level in control

        assays.'
