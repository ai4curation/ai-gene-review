id: P0AA04
gene_symbol: ptsH
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: HPr is a soluble phosphocarrier in the Escherichia coli carbohydrate phosphotransferase system,
  relaying phosphate from enzyme I to sugar-specific EIIA proteins. Its phosphorylation state also controls
  interactions with metabolic enzymes, the AI-2 kinase LsrK and the antisigma factor Rsd, linking carbohydrate
  supply to enzyme activity and transcription.
