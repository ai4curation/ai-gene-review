- term:
    id: GO:0016775
    label: phosphotransferase activity, nitrogenous group as acceptor
  evidence_type: TAS
  original_reference_id: PMID:8246840
  qualifier: enables
  review:
    action: ACCEPT
    summary: The acceptor histidine nitrogen defines the phosphate-transfer chemistry of HPr.
    reason: HPr transfers its histidyl phosphate to the histidine acceptor of EIIA. This molecular-function
      genus is chemically appropriate and avoids incorrectly specifying ATP as the phosphate donor. The
      curated native PTS function and partner-complex structures substantiate the review annotation.
    supported_by:
    - reference_id: file:ECOLI/ptsH/ptsH-uniprot.txt
    - reference_id: PMID:11060015
- term:
    id: GO:0018106
    label: peptidyl-histidine phosphorylation
  evidence_type: IDA
  original_reference_id: PMID:5545082
  qualifier: acts_upstream_of_or_within
  review:
    action: ACCEPT
    summary: HPr directly phosphorylates histidine residues on partner EIIA proteins.
    reason: This is catalytic participation in histidyl phosphate transfer, rather than an annotation
      based only on HPr being phosphorylated. Native phosphotransfer-complex evidence independently supports
      the older experimental assignment even though its cached isolation-paper record has no accessible
      abstract.
    supported_by:
    - reference_id: PMID:11060015
    - reference_id: PMID:22673508
    - reference_id: file:ECOLI/ptsH/ptsH-uniprot.txt
- term:
    id: GO:0030234
    label: enzyme regulator activity
  evidence_type: IDA
  original_reference_id: PMID:28634232
  qualifier: enables
  review:
    action: MODIFY
    summary: The target study resolves activation of several metabolic enzymes and inhibition of adenylate
      kinase.
    reason: HPr activates PykF, PfkB and NagB, whereas phosphorylated HPr inhibits Adk. Refine the general
      enzyme-regulator term to both supported activity classes; choosing only one would erase the opposite
      phosphostate-dependent effect. These directions are not automatically assigned to NPr paralogs.
    supported_by:
    - reference_id: PMID:28634232
    proposed_replacement_terms:
    - id: GO:0008047
      label: enzyme activator activity
    - id: GO:0019210
      label: kinase inhibitor activity
- term:
    id: GO:0043609
    label: regulation of carbon utilization
  evidence_type: IDA
  original_reference_id: PMID:26784570
  qualifier: acts_upstream_of_or_within
  review:
    action: ACCEPT
    summary: HPr couples available PTS phosphate flux to carbon utilization.
    reason: Retain the curated experimental assignment. The accessible single-cell study supports competition
      between sugar-uptake systems but does not expose every target-specific perturbation; independent
      HPr biochemical evidence establishes its native phosphate-distribution and metabolic-regulator roles.
      No detailed unseen HPr assay is claimed.
    supported_by:
    - reference_id: PMID:26784570
    - reference_id: PMID:28634232
    - reference_id: file:ECOLI/ptsH/ptsH-uniprot.txt
- term:
    id: GO:0045152
    label: antisigma factor binding
  evidence_type: IPI
  original_reference_id: PMID:24324139
  qualifier: enables
  supporting_entities:
  - UniProtKB:P0AFX4
  review:
    action: ACCEPT
    summary: Dephosphorylated HPr binds the antisigma factor Rsd.
    reason: Native binding and transcription experiments show that HPr interferes with Rsd-sigma70 complex
      formation. This specific binding term captures an established regulatory partner class, unlike uninformative
      generic protein binding.
    supported_by:
    - reference_id: PMID:24324139
      supporting_text: 'Only the dephosphorylated form of HPr formed a tight complex with

        Rsd'
- term:
    id: GO:0045819
    label: positive regulation of glycogen catabolic process
  evidence_type: IDA
  original_reference_id: PMID:9334229
  qualifier: acts_upstream_of_or_within
  review:
    action: ACCEPT
    summary: Allosteric activation of glycogen phosphorylase promotes glycogen breakdown.
    reason: HPr itself performs the regulatory step through direct binding and activation of the native
      catabolic enzyme. This is an experimentally grounded regulatory process, not a NEW pathway annotation
      inferred from a growth phenotype.
    supported_by:
    - reference_id: PMID:9334229
