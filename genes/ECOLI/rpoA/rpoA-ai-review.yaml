id: P0A7Z4
gene_symbol: rpoA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  rpoA (b3295) encodes the alpha subunit of Escherichia coli DNA-directed RNA polymerase.
  Two alpha subunits form the dimeric platform on which beta and beta-prime assemble
  into the alpha2 beta beta' omega core enzyme. The alpha N-terminal domain mediates
  dimerization and assembly, while the flexibly tethered C-terminal domain binds UP
  promoter elements and contacts activators such as CRP and the elongation factor
  NusA. Alpha does not contribute active-site residues to the polymerase.
