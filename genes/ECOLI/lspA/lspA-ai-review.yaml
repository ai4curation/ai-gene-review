references:
- id: GO_REF:0000002
  title: Gene Ontology annotation through association of InterPro records with GO terms
  findings:
  - statement: InterPro IPR001872 recognizes the lipoprotein signal peptidase family but maps it to generic proteolysis and membrane terms that are less informative for E. coli LspA than lipoprotein biosynthetic process and plasma membrane.
- id: GO_REF:0000033
  title: Annotation inferences using phylogenetic trees
  findings:
  - statement: PAINT places conserved endopeptidase activity and plasma-membrane localization on the LspA family; the activity row needs a more specific available child term.
- id: GO_REF:0000120
  title: Combined Automated Annotation using Multiple IEA Methods
  findings:
  - statement: Combined automated UniProt, InterPro, EC, and UniRule evidence maps LspA to aspartic-type endopeptidase activity and plasma membrane.
- id: PMID:11894915
  title: Prolipoprotein signal peptidase of Escherichia coli requires a cysteine residue at the cleavage site.
  findings:
  - statement: This abstract-only cached paper supports prolipoprotein signal peptide cleavage at the glycine-cysteine lipobox boundary.
- id: PMID:15919996
  title: Global topology analysis of the Escherichia coli inner membrane proteome.
  findings:
  - statement: This large-scale topology paper supports LspA as part of the E. coli inner-membrane proteome.
- id: PMID:1894646
  title: Membrane topology of Escherichia coli prolipoprotein signal peptidase (signal peptidase II).
  findings:
  - statement: lsp-phoA and lsp-lacZ fusions showed that E. coli signal peptidase II spans the cytoplasmic membrane four times.
- id: PMID:6363408
  title: Apolipoprotein, an intermediate in the processing of the major lipoprotein of the Escherichia coli outer membrane.
  findings:
  - statement: This paper identified apolipoprotein as the intermediate generated after lipoprotein signal peptide cleavage and before final N-acylation.
- id: PMID:6368552
  title: Prolipoprotein modification and processing enzymes in Escherichia coli.
  findings:
  - statement: This paper characterized E. coli prolipoprotein signal peptidase as an inner-cytoplasmic-membrane endopeptidase recognizing glycyl-glyceride cysteine.
- id: PMID:6374664
  title: Nucleotide sequence of the Escherichia coli prolipoprotein signal peptidase (lsp) gene.
  findings:
  - statement: This paper sequenced lsp and linked it to prolipoprotein signal peptidase activity.
- id: file:ECOLI/lspA/lspA-uniprot.txt
  title: UniProtKB reviewed entry for E. coli lspA
  findings:
  - statement: UniProtKB summarizes LspA as cell inner membrane EC 3.4.23.36 lipoprotein signal peptidase in the lipoprotein biosynthesis signal-peptide cleavage pathway.
- id: file:ECOLI/lspA/lspA-deep-research-manual.md
  title: Manual deep research for E. coli lspA
  findings:
  - statement: Manual synthesis of the cached LspA literature supports signal peptidase II as the inner-membrane cleavage step between Lgt lipidation and Lnt N-acylation.
