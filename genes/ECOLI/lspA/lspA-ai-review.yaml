description: lspA encodes lipoprotein signal peptidase II, a multi-pass inner-membrane aspartyl protease
  that removes signal peptides from diacylglyceryl-modified bacterial prolipoproteins after the Lgt lipidation
  step and before Lnt-dependent terminal N-acylation.
