references:
- id: GO_REF:0000002
  title: Gene Ontology annotation through association of InterPro records with GO terms
  findings:
  - statement: InterPro supports proteolytic membrane-enzyme biology; protein processing refines proteolysis,
      while plasma membrane refines membrane. Lipoprotein biosynthesis is separate pathway context.
- id: GO_REF:0000033
  title: Annotation inferences using phylogenetic trees
  findings:
  - statement: PAINT places conserved endopeptidase activity and plasma-membrane localization on the LspA
      family; the activity row needs a more specific available child term.
- id: GO_REF:0000120
  title: Combined Automated Annotation using Multiple IEA Methods
  findings:
  - statement: Combined automated UniProt, InterPro, EC, and UniRule evidence maps LspA to aspartic-type
      endopeptidase activity and plasma membrane.
- id: PMID:11894915
  title: Prolipoprotein signal peptidase of Escherichia coli requires a cysteine residue at the cleavage
    site.
  findings:
  - statement: This abstract-only cached paper supports prolipoprotein signal peptide cleavage at the
      glycine-cysteine lipobox boundary.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Protected cache is abstract-only; the reported experiment is retained where corroborated
      by enzyme-specific evidence. No uninspected supplementary target table or exact strain sequence
      is claimed.
- id: PMID:15919996
  title: Global topology analysis of the Escherichia coli inner membrane proteome.
  findings:
  - statement: The existing curator-assigned IDA membrane annotation is retained with independent enzyme-specific
      topology corroboration; the target-level supplementary entry was not independently inspected.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Protected cache is abstract-only; the reported experiment is retained where corroborated
      by enzyme-specific evidence. No uninspected supplementary target table or exact strain sequence
      is claimed.
- id: PMID:1894646
  title: Membrane topology of Escherichia coli prolipoprotein signal peptidase (signal peptidase II).
  findings:
  - statement: lsp-phoA and lsp-lacZ fusions showed that E. coli signal peptidase II spans the cytoplasmic
      membrane four times.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Protected cache is abstract-only; the reported experiment is retained where corroborated
      by enzyme-specific evidence. No uninspected supplementary target table or exact strain sequence
      is claimed.
- id: PMID:6363408
  title: Apolipoprotein, an intermediate in the processing of the major lipoprotein of the Escherichia
    coli outer membrane.
  findings:
  - statement: This paper identified apolipoprotein as the intermediate generated after lipoprotein signal
      peptide cleavage and before final N-acylation.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Protected cache is abstract-only; the reported experiment is retained where corroborated
      by enzyme-specific evidence. No uninspected supplementary target table or exact strain sequence
      is claimed.
- id: PMID:6368552
  title: Prolipoprotein modification and processing enzymes in Escherichia coli.
  findings:
  - statement: This paper characterized E. coli prolipoprotein signal peptidase as an inner-cytoplasmic-membrane
      endopeptidase recognizing glycyl-glyceride cysteine.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Protected cache is abstract-only; the reported experiment is retained where corroborated
      by enzyme-specific evidence. No uninspected supplementary target table or exact strain sequence
      is claimed.
- id: PMID:6374664
  title: Nucleotide sequence of the Escherichia coli prolipoprotein signal peptidase (lsp) gene.
  findings:
  - statement: This paper sequenced lsp and linked it to prolipoprotein signal peptidase activity.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Protected cache is abstract-only; the reported experiment is retained where corroborated
      by enzyme-specific evidence. No uninspected supplementary target table or exact strain sequence
      is claimed.
- id: file:ECOLI/lspA/lspA-uniprot.txt
  title: UniProtKB reviewed entry for E. coli lspA
  findings:
  - statement: UniProtKB summarizes LspA as cell inner membrane EC 3.4.23.36 lipoprotein signal peptidase
      in the lipoprotein biosynthesis signal-peptide cleavage pathway.
- id: file:ECOLI/lspA/lspA-deep-research-manual.md
  title: Manual deep research for E. coli lspA
  findings:
  - statement: Manual synthesis of the cached LspA literature supports signal peptidase II as the inner-membrane
      cleavage step between Lgt lipidation and Lnt N-acylation.
- id: file:analysis/module_audits/bacterial_lipoprotein_maturation/ecoli-bacsu-consultation/evidence.md
  title: Primary-source, ontology and construct scope for E. coli and Bacillus lipoprotein maturation
    enzymes
  findings:
  - statement: Independent primary, ontology and sequence checks distinguish biochemical chemistry, construct
      evidence and native pathway scope.
- id: PMID:10497172
  title: The potential active site of the lipoprotein-specific (type II) signal peptidase of Bacillus
    subtilis.
  findings:
  - statement: Bacillus LspA mutagenesis supports the aspartic-mechanism interpretation of peptidase-A8
      homologs, with Asp102/Asp129 explicitly proposed as catalytic.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Comparative Bacillus primary abstract, not an E. coli catalytic-residue assay; exact
      target chemistry is independently supported.
