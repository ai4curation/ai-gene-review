proposed_new_terms:
- proposed_name: lipoprotein signal peptidase activity
  proposed_definition: Catalysis of the hydrolysis of the signal peptide from a bacterial membrane diacylglyceryl-prolipoprotein,
    cleaving immediately N-terminal to the lipid-modified lipobox cysteine.
  justification: GO:0009003 is an active signal-peptidase genus, and GO:0004190 captures the aspartic
    mechanism. Neither alone captures the diacylglyceryl-prolipoprotein substrate and cleavage immediately
    before lipidated cysteine. The proposal concerns this residual type-II/lipoprotein specificity, not
    absence of any signal-peptidase term.
  proposed_parent:
    id: GO:0004190
    label: aspartic-type endopeptidase activity
  supported_by:
  - reference_id: file:ECOLI/lspA/lspA-uniprot.txt
    record_section:
    - CC:FUNCTION
    supporting_text: This protein specifically catalyzes the removal of signal
  - reference_id: PMID:11894915
    supporting_text: cleaves off the signal peptide at the bond
suggested_questions:
- question: Should GO add a specific lipoprotein signal peptidase activity term for bacterial LspA/signal
    peptidase II?
  experts:
  - GO molecular function curators
- question: Which native E. coli lipoprotein substrates accumulate as diacylglyceryl-prolipoproteins after
    partial LspA depletion or globomycin inhibition?
suggested_experiments:
- description: Pair conditional lspA depletion or globomycin treatment with targeted lipoproteomics to
    quantify accumulation of uncleaved diacylglyceryl-prolipoproteins.
  experiment_type: conditional depletion and lipoproteomics
- description: Reconstitute purified E. coli LspA in membrane mimetics with native diacylglyceryl-prolipoprotein
    peptides and test cleavage kinetics across lipobox variants.
  experiment_type: in vitro peptidase assay
