suggested_questions:
- question: Does the unstable PurF product phosphoribosylamine reach PurD by free diffusion in E. coli,
    or by transient PurF-PurD association?
suggested_experiments:
- description: Test for PurF-PurD interaction in vivo by crosslinking or bacterial two-hybrid assays,
    and measure GAR formation from PRPP in coupled assays with and without crowding agents.
