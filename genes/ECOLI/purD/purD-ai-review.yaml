id: P15640
gene_symbol: purD
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: PurD is the glycinamide ribonucleotide (GAR) synthetase of Escherichia coli, a monomeric
  ATP-grasp enzyme that ligates glycine to 5-phosphoribosylamine with MgATP hydrolysis to form GAR, the
  second step of de novo IMP biosynthesis. The enzyme is highly specific for glycine and is encoded in
  the purHD operon.
