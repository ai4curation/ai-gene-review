  qualifier: enables
  review:
    summary: ATP hydrolysis drives the ligation.
    action: KEEP_AS_NON_CORE
    reason: Transfer of 18O from glycine to Pi shows ATP hydrolysis coupled to amide formation. GO intends
      this term for ATP hydrolysis that drives a reaction, alongside the specific ATP-dependent activity,
      so it is kept as a non-core companion of GO:0004637.
    supported_by:
    - reference_id: PMID:2182115
      supporting_text: Incubation of [18O]glycine, ATP, and PRA results in quantitative transfer of the
        18O to Pi.
