- term:
    id: GO:0043571
    label: maintenance of CRISPR repeat elements
  evidence_type: IMP
  original_reference_id: PMID:18703739
  qualifier: involved_in
  review:
    summary: CasE performs the cleavage within each CRISPR repeat that converts the
      array transcript into mature single-spacer guides, a step that GO:0043571
      explicitly covers ("transcription of the CRISPR repeat arrays into RNA and
      processing"). Deletion of casE leaves an unprocessed precursor and no mature
      guide; reconstitution in a host lacking cas genes shows casE is the only subunit
      whose omission has this effect; and purified CasE cleaves its cognate substrate
      alone.
    action: NEW
    reason: Proposed after running the checks required before any NEW term. First, the
      entity that performs the step is CasE itself - purified protein acting alone on
      its cognate RNA, not a necessity argument from a knockout. Second, the comparator
      check supports it rather than warning against it - of the 14 non-IEA annotations
      to GO:0043571 in QuickGO, two are Cas6-family processing enzymes
      (UniProtKB:Q02MM2 cas6f by IMP, UniProtKB:Q8U1S4 cas6 by IDA), and within this
      repository genes/PSEAB/cas6f ACCEPTs the same term, so casE's absence is an
      uncurated gap in a populated term rather than a convention that excludes
      processing enzymes. Third, GO:0043571 is neither an ancestor nor a descendant of
      GO:0006396 or GO:0099048, which casE already carries, so this is added coverage
      and not redundancy. Fourth, the mirror test is applied in the opposite direction
      on casD, whose IEA row for this same term is marked KEEP_AS_NON_CORE precisely
      because casD does not perform the cleavage. Evidence is IMP from the knockout and
      reconstitution experiments.
    supported_by:
    - reference_id: PMID:18703739
      supporting_text: the small crRNA was absent only in the strain that lacked casE
    - reference_id: PMID:18703739
      supporting_text: showing that CasE is an unusual endoribonuclease that does not
        require the other Cascade subunits
    - reference_id: PMID:18703739
      supporting_text: These mature crRNAs contain the antiviral spacer unit flanked
        by short RNA sequences derived from the repeat on either side termed the 5′
        and 3′ handle
