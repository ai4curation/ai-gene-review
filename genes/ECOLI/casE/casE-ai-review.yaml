- question: Does the in vitro inhibition of Cas1 Holliday-junction cleavage by CasE
    have a physiological role - for example throttling Cas1's recombination-associated
    activity when Cascade is engaged - or is it an artefact of the concentrations used?
  experts:
  - Mohan Babu
  - Andrew Emili
  - Alexander Savchenko
- question: Is CasE catalytically active only once per guide, or does it turn over? The
    enzyme stays bound to its product, which implies product inhibition, yet a single
    CasE must process a multi-repeat array.
  experts:
  - Stan J J Brouns
  - John van der Oost
  - Blake Wiedenheft
suggested_experiments:
- hypothesis: CasE turns over on a multi-repeat array despite remaining bound to each
    product, because downstream Cas7 loading displaces it onto the assembling complex.
  description: Measure single-turnover and multiple-turnover kinetics of purified CasE
    on substrates containing one, two and four repeat-spacer units, with and without
    stoichiometric CasC and CasD, and follow product release directly by fluorescence
    anisotropy of a labelled hairpin. If Cas7 loading is what frees the enzyme, turnover
    should depend on CasC concentration.
  experiment_type: enzyme kinetics with product-release readout
- hypothesis: The CasE active-site histidine is required for immunity only through
    processing, not through any role in the assembled complex.
  description: Complement a casE deletion with the H20A allele while supplying mature
    crRNA from a separate, pre-processed transcript that needs no cleavage, then test
    phage lambda resistance and target dsDNA binding. Restoration of immunity would
    confirm that the histidine's only essential role is catalytic.
  experiment_type: genetic complementation with bypass substrate
- hypothesis: The CasE-Cas1 interaction regulates Cas1 activity in vivo during primed
    acquisition.
  description: Map the CasE surface that contacts Cas1 by crosslinking mass
    spectrometry, generate separation-of-function CasE variants that retain processing
    and Cascade assembly but lose Cas1 binding, and compare them with wild type for
    rates of primed spacer acquisition, chromosomal integrity, and sensitivity to DNA
    damaging agents.
  experiment_type: interface mapping and separation-of-function genetics
