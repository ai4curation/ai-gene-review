  label: Escherichia coli K-12
description: 'ThrA is the bifunctional aspartokinase I/homoserine dehydrogenase I of Escherichia coli.
  Its N-terminal kinase domain uses ATP to phosphorylate L-aspartate, and its C-terminal dehydrogenase
  domain reduces aspartate semialdehyde to homoserine. These reactions feed the aspartate-family amino
  acid pathways. Both activities are threonine regulated. The protein assembles into oligomers, with active
  dimeric and tetrameric dehydrogenase forms observed under the tested conditions.'
