  review:
    action: ACCEPT
    summary: thrA supports NAD-dependent homoserine/alcohol oxidation, with homoserine as the
      specified substrate.
    reason: The NAD(H)-linked RHEA:15757 reaction has curated ECO:0000250 sequence-similarity
      support from UniProtKB:Q9SA18, rather than an ARBA-only reaction prediction. This supports
      conserved homoserine oxidation with NAD+ while matched native NAD/NADP kinetics remain
      unavailable. GO:0004022 covers oxidation of the primary alcohol in homoserine to an aldehyde;
      it does not imply ethanol metabolism or broad substrate promiscuity. The live QuickGO
      definition of GO:0004412 specifies NADP+, so that term would not preserve this supported NAD-
      specific capacity. This differs from PSEPK/hom, where only the ARBA-derived NAD claim is
      corrected to independently supported NADP-linked chemistry, and CORGL/hom, where experimental
      citation attribution remains unresolved. See the three-gene evidence comparison in thrA-
      notes.md. Neither equal physiological cofactor use nor independently verified strict orthology
      is asserted.
