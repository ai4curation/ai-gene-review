- id: PMID:11368768
  title: 'An integrated study of threonine-pathway enzyme kinetics in Escherichia coli.'
  findings:
  - statement: The E. coli threonine-pathway steps were studied under one physiologically relevant
      experimental regime.
    supporting_text: We have determined the kinetic parameters of the individual steps of the
      threonine pathway from aspartate in Escherichia coli under a single set of experimental
      conditions chosen to be physiologically relevant.
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Native E. coli pathway study supports the sequence of enzyme reactions under a
      common assay regime. The current cache is only an abstract/HTML PDF-link wrapper, despite its
      full_text_html metadata; no numerical kinetics or complete Methods are claimed from this
      cache.
- id: PMID:204643
  title: 'Aspartokinase I-homoserine dehydrogenase I of Escherichia coli K12. Concentration-dependent
    dissociation to dimers in the presence of L-threonine.'
  findings:
  - statement: Both dimeric and tetrameric ThrA forms retain dehydrogenase activity under the tested
      conditions.
    supporting_text: "Both the dimeric and tetrameric forms of the enzyme\npossess dehydrogenase activity."
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Native K-12 purified-protein association study. Abstract specifies the tested
      concentration, threonine and salt conditions; it supports active dimer/tetramer forms rather
      than an invariant tetramer.
