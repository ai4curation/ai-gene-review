description: >-
  ProTrek sequence-to-text retrieval for GroEL, the E. coli chaperonin. The top three are all exact
  GOA matches and cover this review's core function completely: the GroEL-GroES complex, protein refolding,
  and ATP-dependent protein folding chaperone activity. Rank 4 (isomerase activity) is also an exact
  match and reflects the EC 5.6.1.7 classification of chaperonins. As with DnaK the scores are modest
  (14.9 to 12.1) for an unambiguous protein, and as with DnaK this is a SwissProt entry whose own
  annotations are in the searched index. Assessment: 3 correct not novel (CNN).
