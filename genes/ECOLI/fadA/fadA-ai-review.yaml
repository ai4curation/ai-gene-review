  label: Escherichia coli K-12
description: FadA is the beta-subunit 3-ketoacyl-CoA thiolase of the cytoplasmic FadBA fatty acid oxidation
  complex in Escherichia coli K-12. It catalyzes CoA-dependent cleavage of a 3-oxoacyl-CoA to acetyl-CoA
  and an acyl-CoA shortened by two carbons. FadB supplies the preceding hydration and dehydrogenation
  reactions. The native pathway can accumulate shorter acyl-CoA intermediates, so the presence of the
  four spiral reactions does not guarantee complete conversion of an input chain to acetyl-CoA. The related
  FadI thiolase supports an alternative pathway in particular conditions.
