- term:
    id: GO:0006780
    label: uroporphyrinogen III biosynthetic process
  evidence_type: IMP
  original_reference_id: PMID:1104578
  qualifier: acts_upstream_of_or_within
  review:
    summary: >-
      EcoliWiki IMP assigning HemE to uroporphyrinogen III biosynthesis ("The chemical reactions and pathways
      resulting in the formation of uroporphyrinogen III") from the same mutant study.
    action: REMOVE
    reason: >-
      Contradicted by the cited paper itself. HemE consumes uroporphyrinogen III; it does not make it.
      The abstract reports that SASQ85 extracts still convert ALA and porphobilinogen to uroporphyrinogen,
      and that uroporphyrinogen synthetase activity is present, so the mutation does not affect uroporphyrinogen
      III biosynthesis even under the broad acts_upstream_of_or_within qualifier. The paper's real finding
      is captured by the uroporphyrinogen decarboxylase activity and heme B biosynthesis rows.
    supported_by:
    - reference_id: PMID:1104578
      supporting_text: >-
        Cell-free extracts of SASQ85 were able to convert 5-aminolevulinic acid and porphobilinogen to
        uroporphyrinogen, but not to copro- or protoporphyrinogen.
    - reference_id: PMID:1104578
      supporting_text: indicating the presence of uroporphyrinogen synthetase activity in the extracts
    source_defects:
