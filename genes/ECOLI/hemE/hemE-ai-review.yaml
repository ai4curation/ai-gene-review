  label: Escherichia coli K-12
description: >-
  HemE is the cytoplasmic uroporphyrinogen decarboxylase of Escherichia coli K-12 (EC 4.1.1.37). It removes
  the carboxyl groups of the four acetate side chains of uroporphyrinogen III, without an external cofactor,
  to give coproporphyrinogen III. This is the first reaction after the uroporphyrinogen III branch point
  that commits the tetrapyrrole to protoheme (heme b) rather than siroheme; coproporphyrinogen III is
  then converted by the oxygen-dependent HemF or oxygen-independent HemN, by HemG and by the ferrochelatase
  HemH. hemE mutants lack uroporphyrinogen decarboxylase activity, accumulate uroporphyrin and are catalase-deficient,
  and their defect is complemented by a cyanobacterial hemE gene.
