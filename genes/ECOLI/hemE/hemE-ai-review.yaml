- question: >-
    Is E. coli HemE activity rate-limiting for heme B synthesis under any growth condition, given that
    hemE appears not to be regulated by hemin?
suggested_experiments:
- hypothesis: >-
    Purified E. coli HemE decarboxylates uroporphyrinogen III in the ordered clockwise sequence reported
    for the human enzyme.
  description: >-
    Purify recombinant HemE and follow the hepta-, hexa- and pentacarboxylate intermediates by HPLC to
    determine kinetic parameters and decarboxylation order.
