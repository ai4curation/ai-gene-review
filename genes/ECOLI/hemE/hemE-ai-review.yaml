  evidence_type: IMP
  original_reference_id: PMID:1104578
  qualifier: enables
  review:
    summary: >-
      Sasarman et al. 1975 isolated SASQ85, a uroporphyrin-accumulating, catalase-deficient E. coli K-12
      mutant whose cell-free extracts made uroporphyrinogen from ALA and porphobilinogen but not copro-
      or protoporphyrinogen, and mapped the hemE locus near thiA. The cached record is abstract-only.
    action: ACCEPT
    reason: >-
      Loss of the conversion of uroporphyrinogen to coproporphyrinogen in mutant extracts, with uroporphyrinogen
      synthesis intact, localizes the defect to uroporphyrinogen decarboxylase; the activity is the accepted
      function of HemE. An IMP for a molecular function is indirect, but here it agrees with the family
      assignment and with the complementation data of PMID:7849561, so the curator's call is accepted.
    supported_by:
    - reference_id: PMID:1104578
      supporting_text: >-
        Cell-free extracts of SASQ85 were able to convert 5-aminolevulinic acid and porphobilinogen to
        uroporphyrinogen, but not to copro- or protoporphyrinogen.
    - reference_id: PMID:1104578
      supporting_text: >-
        The results indicate a deficient uroporphyrinogen decarboxylase activity of SASQ85 which is thus
        the first uroporphyrinogen decarboxylase-deficient mutant isolated in E. coli K-12.
