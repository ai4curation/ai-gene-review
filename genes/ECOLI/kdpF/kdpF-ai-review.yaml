suggested_questions:
- question: Does KdpF contribute to KdpFABC stability or assembly in vivo under stress conditions (e.g.
    low K+ combined with membrane perturbation), given that lipids can substitute for it in vitro?
suggested_experiments:
- description: Compare KdpFABC abundance, turnover and K+ uptake kinetics in wild-type and kdpF in-frame
    deletion strains under K+ limitation and membrane stress.
  experiment_type: genetic deletion with membrane-complex stability assay
