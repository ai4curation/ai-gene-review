core_functions:
- description: KdpF is a small membrane subunit that contributes to KdpFABC ATP-driven K+ uptake by stabilizing
    the assembled pump. Purified KdpF restores activity to the detergent-solubilized complex lacking it;
    lipids also compensate. The contribution is structural and does not imply that KdpF is obligatory
    for native membrane activity or independently transports ions.
