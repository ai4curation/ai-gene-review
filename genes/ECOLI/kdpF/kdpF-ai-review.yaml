- term:
    id: GO:0008556
    label: P-type potassium transmembrane transporter activity
  evidence_type: IDA
  original_reference_id: PMID:9789555
  qualifier: enables
  review:
    summary: P-type potassium transporter activity belongs to the KdpFABC pump (KdpB ATPase plus KdpA
      K+ pathway), not to the KdpF peptide.
    action: MARK_AS_OVER_ANNOTATED
    reason: The cited study measured electrogenic K+ transport by the purified Kdp complex and showed
      that KdpF stabilises it, not that KdpF carries the transporter activity. KdpF is a 29-residue single
      transmembrane helix that neither hydrolyses ATP nor forms the K+ pathway; it is dispensable for
      growth on low K+ and for membrane-bound ATPase activity, and acts as a stabilising element of the
      isolated complex. Asserting that KdpF enables P-type potassium transporter activity overstates its
      role; its relationship to the pump is captured by GO:0031004 complex membership.
    supported_by:
    - &id002
      reference_id: PMID:10608856
      supporting_text: Although KdpF is not essential for the function of the Kdp complex in vivo, it
        is part of the complex and functions as a stabilizing element in vitro.
    - &id003
      reference_id: PMID:10608856
      supporting_text: In the absence of KdpF, the ATPase activity of the membrane-bound Kdp complex was
        almost indistinguishable from that of the wild type.
    - &id004
      reference_id: PMID:9789555
      supporting_text: This clearly demonstrates that the KdpF subunit is stabilizing the transport complex.
