    reason: The complexomic source surveys native protein assemblies. Independent direct cryo-EM evidence
      in PMID:40849408 and PDB 8V22 establishes a GlnA dodecamer composed of two hexameric rings. The
      deposited construct contains the complete P0A9C5 sequence plus five N-terminal residues; this is
      recombinant AMPylated GlnA expressed in BL21, not an in-cell K-12 stoichiometry measurement. The
      UniProt CC:SUBUNIT sentence itself remains an ECO:0000250 transfer from P0A1P6, whereas its DR:PDB
      cross-reference points to the direct target structure. Identical-protein binding describes the
      functional GS homooligomer rather than an unspecified interactome edge.
