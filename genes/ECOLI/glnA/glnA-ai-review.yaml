    correctness: VERIFIED
    review_notes: 'Inspected PAINT family evidence: PTN000464923 membrane IBD is seeded by mouse MGI:2672844
      (Lgsn). The node and seed are traced rather than judged by donor count. This is a family evidence
      table, not a GOA file.'
