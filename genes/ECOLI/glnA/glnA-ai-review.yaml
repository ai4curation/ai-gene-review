id: P0A9C5
gene_symbol: glnA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: GlnA is the type I glutamine synthetase of Escherichia coli K-12. It uses ATP to incorporate
  ammonium into L-glutamate, producing L-glutamine in the cytosol. This reaction supplies biosynthetic
  glutamine and initiates the glutamine synthetase–glutamate synthase route of ammonium assimilation.
  The enzyme forms a homooligomeric assembly and its activity is regulated by reversible adenylylation
  in response to nitrogen status.
