- term:
    id: GO:0016020
    label: membrane
  evidence_type: HDA
  original_reference_id: PMID:16858726
  qualifier: located_in
  review:
    summary: A high-throughput proteomic fractionation of E. coli recorded GlnA in a membrane-associated
      complex fraction. GlnA is a soluble cytosolic dodecamer, so a membrane location is likely an over-annotation.
    action: MARK_AS_OVER_ANNOTATED
    reason: The row records where GlnA was detected in a proteome-wide separation of cytosolic and membrane
      protein complexes. The detection is not disputed and the row is not removed, but a single high-throughput
      fractionation of a large, abundant soluble dodecamer is most simply explained by co-fractionation, and
      no targeted experiment places E. coli GlnA at the membrane. Only the abstract is cached. The same judgement
      applies to the IBA row on this term.
    supported_by:
    - reference_id: PMID:16858726
      supporting_text: the cytosolic and membrane protein complexes of Escherichia coli were separated.
- term:
    id: GO:0016020
    label: membrane
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  supporting_entities:
  - MGI:MGI:2672844
  - PANTHER:PTN000464923
  review:
    summary: The IBA asserts that GlnA is active at the membrane, propagated from a root PAINT node whose
      only membrane seed is mouse lengsin. E. coli GlnA catalyses as a soluble cytosolic dodecamer.
    action: MARK_AS_OVER_ANNOTATED
    reason: is_active_in claims that catalysis happens at the membrane, which nothing for E. coli GlnA supports;
      the enzyme's functional form is the cytosolic dodecamer. The PAINT IBD at PTN000464923 rests on a
      single vertebrate seed, mouse lengsin, whose lens-fiber membrane association is a lineage-specific
      specialization of a protein that has lost glutamine synthetase activity. Propagating that to the bacterial
      enzymes over-annotates them. The HDA row on this term is marked the same way.
    supported_by:
    - reference_id: PMID:18178558
      supporting_text: Lengsin (green) appeared to be localized around the margins of the fiber cells,
        apparently lining the plasma membrane.
    - reference_id: file:interpro/panther/PTHR43407/PTHR43407-paint.tsv
      supporting_text: "PTHR43407\tPTN000464923\tGO:0016020\tC\tIBD\tfalse\tMGI:MGI:2672844"
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      - LINEAGE_OR_TAXON_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN000464923
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: The ancestral membrane IBD is seeded only by mouse lengsin, a vertebrate member below a
          loss node for glutamine synthetase activity; its membrane association is a lineage-specific specialization
          and does not make membrane a site of activity for the bacterial enzymes.
      - source_id: MGI:2672844
        source_label: Lgsn
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Mouse lengsin has lens-fiber membrane/cytoskeletal localization in PMID:18178558; this
          does not independently establish E. coli GlnA membrane association.
