- id: PMID:15911532
  title: Localization, annotation, and comparison of the Escherichia coli K-12 proteome under two states
    of growth.
  findings:
  - statement: Localization was measured by fractionation and proteomics.
    supporting_text: assigned to the cytosol, periplasm, inner membrane, and outer membrane by biochemical
      fractionation
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract read. Native E. coli fractionation study supports the curated cytosol assignment;
      individual target rows and their fractionation controls were not available. No exclusive absence
      from membranes is inferred.
- id: PMID:16858726
  title: A complexomic study of Escherichia coli using two-dimensional blue native/SDS polyacrylamide
    gel electrophoresis.
  findings:
  - statement: The experiment separated both cytosolic and membrane complexes.
    supporting_text: the cytosolic and membrane protein complexes of Escherichia coli were separated.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract read; full text unavailable after acquisition attempts. Cytosolic and membrane
      complexes were analyzed, but the abstract does not resolve the GlnA fraction or distinguish membrane
      recruitment from carryover. Homooligomerization and cytosolic localization are independently supported;
      the membrane row remains unresolved.
- id: PMID:18304323
  title: Protein abundance profiling of the Escherichia coli cytosol.
  findings:
  - statement: Native cytosolic fraction was extensively characterized.
    supporting_text: we identified 1103 proteins from the cytosolic fraction of the Escherichia coli strain
      MC4100.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Full article read: native E. coli MC4100 cytosolic proteomics. Target identities are
      in supplementary data unavailable through attempted downloads; the quoted passage establishes assay
      scope, not an independently inspected target-specific table row. The existing curator-assigned target
      location is retained in agreement with the soluble metabolic function.'
- id: PMID:27718375
  title: Screen for genes involved in radiation survival of Escherichia coli and construction of a reference
    database.
  findings:
  - statement: glnA appears among the radiation-sensitive mutant genes.
    supporting_text: eutK, fadD, glnA, groL, guaB, intF, prpR, queA, rplY, seqA, sufC,yadG, yagJ,
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract explicitly identifies glnA in the radiation-sensitive Keio mutant set, sufficient
      for the existing broad response-to-radiation phenotype. It does not identify GlnA as a DNA repair
      enzyme or specify whether this particular mutant is sensitive to X-rays, UV, or both.
- id: PMID:6102984
  title: Purification of glutamine synthetase from a variety of bacteria.
  findings:
  - statement: Glutamine synthetase was purified from E. coli among multiple bacterial species.
    supporting_text: We used the PEG procedure to purify GS from Klebsiella aerogenes, K. pneumoniae,
      Escherichia coli
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The accessible abstract explicitly reports purification of E. coli glutamine synthetase.
      The PMC landing-page acquisition also contains only abstract and references; it is not treated as
      full methods or as a strain-resolved kinetic assay.
- id: file:ECOLI/glnA/glnA-uniprot.txt
  title: UniProt record for E. coli K-12 glnA
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Immutable target UniProt record. The CC:FUNCTION, CC:SUBUNIT and cytoplasmic statements
      carry curated orthology-transfer evidence; the CC:SUBUNIT sentence cites P0A1P6. Separately, the
      DR:PDB entry for 8V22 identifies direct cryo-EM evidence for the full-length P0A9C5 sequence in a
      dodecamer. Its recombinant AMPylated preparation is documented in PMID:40849408; this is direct
      target structural evidence, not a native K-12 kinetic or in-cell localization measurement.
- id: PMID:40849408
  title: A repurposed AMP binding domain reveals mitochondrial protein AMPylation as a regulator of cellular metabolism.
  findings:
  - statement: Direct cryo-EM analysis resolves recombinant AMPylated E. coli GlnA as a dodecamer with two hexameric rings.
    supporting_text: GlnA forms a dodecamer composed of two hexameric rings that is ideal for cryo-electron microscopy (cryo-EM) analysis
  - statement: The GlnA structural preparation was recombinantly expressed in E. coli BL21.
    supporting_text: BL21 cells were transformed with GlnA ppSumo and grown in LB media
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full-text GlnA results and expression, purification and cryo-EM methods read. Despite
      the mitochondrial focus of the title, the paper directly analyzes E. coli GlnA as an AMPylated
      model substrate. RCSB identifies this as the primary citation for 8V22 and maps its full GlnA
      sequence to P0A9C5. The 474-residue deposited entity consists of an extra N-terminal SEFEL segment
      followed by all 469 target residues, verified by direct sequence comparison. The 2.2-Angstrom
      GlnA reconstruction supports homooligomerization; it does not establish native K-12 localization
      or physiological significance of the engineered hinT H101N enrichment interaction.
- id: url:https://www.rcsb.org/structure/8V22
  title: 'RCSB PDB - 8V22: GlnA dodecamer with AMPylation'
  findings:
  - statement: The experimentally determined biological assembly is a GlnA homododecamer.
    supporting_text: 'Global Stoichiometry: Homo 12-mer - A12'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Normally cached RCSB deposition page inspected together with the entry, polymer-entity
      and assembly APIs. The authors assign the biological assembly from electron microscopy; SIFTS
      maps entity residues 6-474 to P0A9C5 residues 1-469 without mutations. The extra N-terminal
      sequence is SEFEL. PMID:40849408 is the linked primary citation. The database assembly assignment
      and the paper describe the same experiment, not independent replications.
- id: PMID:18178558
  title: A role for lengsin, a recruited enzyme, in terminal differentiation in the vertebrate lens.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full mouse lens study read to evaluate the actual PAINT seed. Lgsn is a noncatalytic
      GS-superfamily member recruited to lens cytoskeletal function; its location does not establish bacterial
      GlnA membrane attachment.
  findings:
  - statement: The PAINT source protein has a specialized lens membrane association.
    supporting_text: Lengsin (green) appeared to be localized around the margins of the fiber cells, apparently
      lining the plasma membrane.
- id: file:interpro/panther/PTHR43407/PTHR43407-paint.tsv
  title: PTHR43407 PAINT ancestral-node evidence
  reference_review:
