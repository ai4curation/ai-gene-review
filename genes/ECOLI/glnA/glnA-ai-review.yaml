- term:
    id: GO:0016020
    label: membrane
  evidence_type: HDA
  original_reference_id: PMID:16858726
  qualifier: located_in
  review:
    summary: A membrane-associated GlnA pool remains unresolved.
    action: UNDECIDED
    reason: The PMID:16858726 abstract confirms fractionation of cytosolic and membrane complexes but
      does not resolve GlnA-specific localization or carryover; the full experimental evidence could not
      be recovered. The actual PAINT membrane IBD at PTN000464923 uses mouse Lgsn (MGI:2672844), whose
      lens-fiber membrane association is established in PMID:18178558 but is specialized relative to bacterial
      catalytic GlnA. Neither soluble architecture nor absence of membrane-spanning segments disproves
      peripheral membrane attachment. Both rows therefore remain unresolved; the mouse evidence is not
      used to overturn the unavailable native experiment.
    supported_by:
    - reference_id: PMID:16858726
      supporting_text: the cytosolic and membrane protein complexes of Escherichia coli were separated.
    - reference_id: PMID:18178558
      supporting_text: Lengsin (green) appeared to be localized around the margins of the fiber cells,
        apparently lining the plasma membrane.
