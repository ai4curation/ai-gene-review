  - RGD:69330
  - UniProtKB:P30084
  review:
    summary: Over-propagated from mitochondrial enoyl-CoA hydratases/isomerases; PaaG acts on phenylacetate-pathway intermediates.
    action: REMOVE
    reason: >-
      The IBA is seeded by mammalian fatty acid beta-oxidation enzymes (ECHS1
      and relatives). PaaG is a specialized paa-pathway isomerase: its active
      site is adapted to the epoxide and dehydroadipyl intermediates and
      sterically excludes the acyl-chain conformations used by fatty acid
      enoyl-CoA hydratases/isomerases. E. coli fatty acid beta-oxidation is
      carried out by FadB/FadJ, and there is no evidence PaaG participates.
      The "beta-oxidation-like" steps of the paa pathway are part of
      phenylacetate catabolism, already annotated.
    supported_by:
    - reference_id: PMID:22961985
      supporting_text: Interestingly, these conformations of an octanoyl moiety (after
        C γ ) are not possible in PaaG because of steric hindrance
    - reference_id: PMID:22961985
      supporting_text: The active sites of PaaF and PaaG are adapted to accept the intermediary
        components of the Paa pathway, different from those of the fatty acid β-oxidation
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: PANTHER:PTN000941828
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
