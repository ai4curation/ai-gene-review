id: P77467
gene_symbol: paaG
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  PaaG is a cytoplasmic crotonase-superfamily (enoyl-CoA hydratase/isomerase
  fold) enzyme of the Escherichia coli aerobic phenylacetate catabolic pathway.
  It catalyzes the reversible isomerization of the unstable ring
  1,2-epoxyphenylacetyl-CoA, produced by the PaaABCE monooxygenase, into the
  seven-membered O-heterocyclic enol ether 2-oxepin-2(3H)-ylideneacetyl-CoA
  (oxepin-CoA; EC 5.3.3.18), the substrate for hydrolytic ring opening by PaaZ.
  Like delta3,delta2-enoyl-CoA isomerases it uses a single catalytic aspartate
  (Asp-144) as a proton relay, and it is probably also responsible for the
  later 3,4- to 2,3-dehydroadipyl-CoA double-bond shift in the beta-oxidation-like
  part of the pathway. PaaG forms homotrimeric discs that pack onto a PaaF
  (enoyl-CoA hydratase) hexamer to form a stable four-layered PaaF-PaaG complex.
  paaG mutants cannot grow on phenylacetate and divert the epoxide into
  dead-end products such as 2-hydroxyphenylacetate.
