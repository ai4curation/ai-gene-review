core_functions:
- description: >-
    Reversible isomerization of ring 1,2-epoxyphenylacetyl-CoA to oxepin-CoA
    (2-oxepin-2(3H)-ylideneacetyl-CoA), committing the unstable epoxide to the
    hydrolytic ring-opening branch of aerobic phenylacetate catabolism; probably
    also shifts the double bond of 3,4-dehydroadipyl-CoA to the 2,3 position.
  molecular_function:
    id: GO:0016863
    label: intramolecular oxidoreductase activity, transposing C=C bonds
  directly_involved_in:
  - id: GO:0010124
    label: phenylacetate catabolic process
  supported_by:
  - reference_id: PMID:20660314
    supporting_text: PaaG therefore acted as a ring 1,2-epoxyphenylacetyl-CoA isomerase
      (oxepin-CoA–forming).
  - reference_id: PMID:22961985
    supporting_text: The PaaG active site contains the catalytic Asp-144
proposed_new_terms:
- proposed_name: 1,2-epoxyphenylacetyl-CoA isomerase activity
  proposed_definition: >-
    Catalysis of the reaction: 2-(1,2-epoxy-1,2-dihydrophenyl)acetyl-CoA =
    2-oxepin-2(3H)-ylideneacetyl-CoA (EC 5.3.3.18; RHEA:31843).
  justification: >-
    PaaG has a well-defined, experimentally demonstrated activity with an EC
    number and Rhea reaction but no corresponding GO term; current annotation
    can only use the generic EC 5.3.3 parent GO:0016863.
suggested_questions:
- question: >-
    Does PaaG itself catalyze the 3,4- to 2,3-dehydroadipyl-CoA isomerization in
    the lower pathway, or does PaaJ thiolase carry intrinsic isomerase activity?
- question: >-
    Does assembly into the PaaF-PaaG complex change PaaG kinetics or protect
    cells from epoxide and oxepin intermediates in vivo?
suggested_experiments:
- description: >-
    Assay purified PaaG (and Asp-144 variants) with synthetic 3,4-dehydroadipyl-CoA
    in the absence of PaaJ, monitoring 2,3-dehydroadipyl-CoA formation by HPLC/NMR.
