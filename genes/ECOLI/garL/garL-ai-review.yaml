id: P23522
gene_symbol: garL
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  GarL is the 5-keto-4-deoxy-D-glucarate (KDG) aldolase of E. coli, a Mg2+-dependent class II aldolase
  of the HpcH/HpaI family that forms a homohexamer (trimer of dimers). It catalyses the reversible retro-aldol
  cleavage of 5-dehydro-4-deoxy-D-glucarate, the common product of glucarate dehydratase GudD and galactarate
  dehydratase GarD, into pyruvate and tartronate semialdehyde (2-hydroxy-3-oxopropanoate). It also cleaves
  2-dehydro-3-deoxy-D-glucarate. This aldolase step defines the enterobacterial route of aldarate catabolism.
  Tartronate semialdehyde is then reduced by GarR and phosphorylated by GarK to 2-phosphoglycerate. In
  vitro GarL also condenses pyruvate or hydroxypyruvate with D-glyceraldehyde.
