  review:
    summary: UbiX and UbiD are both required for decarboxylation of 4-hydroxy-3-octaprenyl-benzoate.
    action: ACCEPT
    reason: >-
      The ubiX-ubiD genetic relationship reflects the biochemical one later
      resolved: UbiX makes the prFMN cofactor that UbiD needs to decarboxylate
      the prenylated intermediate. UbiX contributes the cofactor on which the
      UbiD step depends, so it does work for the pathway.
    supported_by:
    - reference_id: PMID:17889824
