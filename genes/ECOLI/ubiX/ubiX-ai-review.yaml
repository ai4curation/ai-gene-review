suggested_questions:
- question: >-
    Why do ubiX mutants recover near-normal Q8 levels in stationary phase: is
    there an alternative source of prFMN (for example another UbiX-like
    enzyme) or a prFMN-independent route?
suggested_experiments:
- hypothesis: A second prFMN source supports UbiD in stationary phase.
  description: >-
    Quantify prFMN and UbiD holo-enzyme in wild type and deltaubiX cells across
    growth phases, and test double mutants with other UbiX/PAD1-family genes
    present in the strain for loss of stationary-phase Q8.
