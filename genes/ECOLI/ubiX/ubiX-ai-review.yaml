  review:
    summary: ubiX overexpression complements the Q-deficient ubiG mutant IS16.
    action: ACCEPT
    reason: >-
      The genetic interaction with ubiG is indirect (its mechanism is not
      explained), but the process claim it supports, UbiX acting in
      ubiquinone biosynthesis, is correct and is established more directly by
      the ubiX deletion phenotype and by UbiX supplying the prFMN cofactor of
      the pathway decarboxylase UbiD. PAINT also places ubiquinone
      biosynthesis on the UbiX node. Consistent with the other GO:0006744 rows.
    supported_by:
    - reference_id: PMID:16923914
      supporting_text: >-
        Complementation of IS16 with either ubiG or ubiX(K-12) reverses this
        phenotype, suggesting that UbiX may interact with UbiG.
