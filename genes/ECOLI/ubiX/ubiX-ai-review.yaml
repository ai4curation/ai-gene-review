  label: Escherichia coli K-12
description: >-
  UbiX is the flavin prenyltransferase of Escherichia coli (EC 2.5.1.129), a
  189-residue FMN-binding flavoprotein of the UbiX/PAD1 family. It transfers
  the dimethylallyl group of dimethylallyl monophosphate onto the N5 and C6
  atoms of reduced FMN, in a metal-independent reaction that produces the
  prenylated FMN (prFMN) cofactor. prFMN is taken up by the UbiD family of
  reversible decarboxylases, whose E. coli member UbiD decarboxylates
  3-octaprenyl-4-hydroxybenzoate in ubiquinone biosynthesis; UbiX is not
  itself a decarboxylase. ubiX deletion mutants make very little coenzyme Q8
  during logarithmic growth, grow slowly on succinate and accumulate
  3-octaprenyl-4-hydroxybenzoate, and E. coli UbiX can supply the cofactor to
  the fungal ferulic acid decarboxylase Fdc1, as its yeast ortholog PAD1 can
  replace UbiX in E. coli.
