- term:
    id: GO:0016831
    label: carboxy-lyase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN000764671
  - SGD:S000002946
  review:
    summary: >-
      Stale PAINT propagation of decarboxylase activity from the yeast PAD1
      seed; UbiX/PAD1 proteins are cofactor-synthesising prenyltransferases,
      not decarboxylases.
    action: REMOVE
    reason: >-
      The idea that UbiX and PAD1 are decarboxylases predates the discovery of
      prFMN. Purified PAD1 was shown to contain FMN but not to function as a
      decarboxylase; instead it makes a diffusible cofactor required by the
      true decarboxylase, and Fdc1/UbiD alone carries the decarboxylase
      activity. The current PTHR43374 PAINT file (2026-06-17) no longer
      carries carboxy-lyase activity on PTN000764671; that node now asserts
      flavin prenyltransferase activity (seeded by E. coli UbiX and P.
      aeruginosa UbiX) and ubiquinone biosynthesis, so the GOA IBA row is a
      leftover of the withdrawn assertion. The decarboxylase activity belongs
      to UbiD (GO:0008694), not UbiX.
    propagation_review:
      root_cause: SOURCE_STALE_OR_MISSING
      failure_modes:
      - ROLE_CONFLATION
      source_entities:
      - source_id: PANTHER:PTN000764671
        source_status: SOURCE_STALE_OR_MISSING
        comment: >-
          The current PAINT file for this node carries flavin prenyltransferase
          activity and ubiquinone biosynthesis, not carboxy-lyase activity.
      - source_id: SGD:S000002946
        source_label: PAD1
        source_status: SOURCE_BAD
        comment: >-
          The yeast PAD1 decarboxylase annotation predates the demonstration
          that PAD1 makes the prFMN cofactor and is not itself a decarboxylase.
    supported_by:
    - reference_id: PMID:25647642
      supporting_text: >-
        We demonstrate that PAD1 is a flavin mononucleotide (FMN)-containing
        protein. However, it does not function as a decarboxylase. Rather,
        PAD1 catalyzes the formation of a novel, diffusible cofactor required
        by FDC for decarboxylase activity.
    - reference_id: PMID:26083754
      supporting_text: >-
        Here we show that Fdc1 is solely responsible for the reversible
        decarboxylase activity, and that it requires a new type of cofactor: a
        prenylated flavin synthesized by the associated UbiX/Pad1.
    - reference_id: file:interpro/panther/PTHR43374/PTHR43374-paint.tsv
      supporting_text: "PTHR43374\tPTN000764671\tGO:0106141\tF\tIBD\tfalse\tUniProtKB:P0AG03|UniProtKB:Q9HX08"
