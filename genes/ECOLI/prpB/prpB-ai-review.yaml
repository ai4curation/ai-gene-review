- term:
    id: GO:0019543
    label: propionate catabolic process
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN001855076
  - UniProtKB:Q56062
  review:
    summary: >-
      PAINT IBA from node PTN001855076, seeded by Salmonella PrpB (Q56062).
    action: ACCEPT
    reason: >-
      PrpB catalyses a step of propionate catabolism: the last reaction of the
      2-methylcitrate cycle, which converts propionate-derived
      2-methylisocitrate to pyruvate and succinate (PMID:11422389,
      PMID:12706720). The enzyme performs this step, so the process annotation
      passes the participation test. The 2-methylcitrate cycle process terms in
      GO are obsolete, so propionate catabolic process is the most precise
      valid term. E. coli PrpB is inside the clade of the PAINT node, and the
      E. coli enzyme is itself characterized.
    supported_by:
    - reference_id: PMID:11422389
      supporting_text: In Escherichia coli and Aspergillus nidulans, propionate is oxidized
        to pyruvate via the methylcitrate cycle. The last step of this cycle, the cleavage
        of 2-methylisocitrate to succinate and pyruvate is catalysed by 2-methylisocitrate
        lyase.
    - reference_id: PMID:12706720
      supporting_text: The enzyme 2-methylisocitrate lyase (PrpB) from Escherichia coli
        catalysing the last step of this cycle, the cleavage of 2-methylisocitrate to
        pyruvate and succinate
