id: P77541
gene_symbol: prpB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  PrpB is the 2-methylisocitrate lyase of Escherichia coli, encoded in the
  prpBCDE operon for propionate oxidation. It catalyses the last step of the
  2-methylcitrate cycle, the Mg2+-dependent retro-aldol cleavage of
  (2R,3S)-2-methylisocitrate (threo-2-methylisocitrate) to pyruvate and
  succinate, and shows no measurable activity with isocitrate, which binds as
  an inhibitor. PrpB is a soluble homotetramer (dimer of dimers) of about
  32 kDa subunits in the isocitrate lyase/PEP mutase superfamily. Catalysis
  requires Mg2+, which is bound in the active site together with the pyruvate
  product, and an essential cysteine (Cys123; the C123S variant is inactive).
  Substrate binding closes a mobile active-site loop that shields the
  reactants from solvent.
