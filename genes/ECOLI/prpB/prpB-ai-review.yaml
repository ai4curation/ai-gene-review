- term:
    id: GO:0046421
    label: methylisocitrate lyase activity
  evidence_type: IDA
  original_reference_id: PMID:11422389
  qualifier: enables
  review:
    summary: >-
      Purified E. coli PrpB cleaves chemically synthesized
      threo-2-methylisocitrate to succinate and pyruvate, has no measurable
      activity with isocitrate, and can synthesize the active stereoisomer in
      the reverse direction.
    action: ACCEPT
    reason: >-
      This is the founding biochemical identification of PrpB as
      2-methylisocitrate lyase. GO:0046421 is defined as the cleavage of
      (2S,3R)-3-hydroxybutane-1,2,3-tricarboxylate (2-methylisocitrate) to
      pyruvate and succinate, which is exactly the assayed reaction. The cached
      record is abstract-only, but the abstract states the activity, the
      substrate stereospecificity and the lack of isocitrate lyase activity
      directly; UniProt also cites this paper for the curated catalytic
      activity and kinetics.
    supported_by:
    - reference_id: PMID:11422389
      supporting_text: The enzymes from both organisms were assayed with chemically synthesized
        threo-2-methylisocitrate; the erythro-diastereomer was not active.
    - reference_id: PMID:11422389
      supporting_text: The enzymes show no measurable activity with isocitrate.
    - reference_id: file:ECOLI/prpB/prpB-uniprot.txt
      supporting_text: KM=19 uM for threo-2-methylisocitrate
- term:
    id: GO:0046421
    label: methylisocitrate lyase activity
  evidence_type: IDA
  original_reference_id: PMID:15723538
  qualifier: enables
  review:
    summary: >-
      Structures of PrpB C123S with bound products (Mg2+-pyruvate and
      succinate) and with an isocitrate inhibitor, together with solution
      assays of potential substrates, define the stringent substrate
      specificity and propose an alpha-carboxy-carbanion mechanism.
    action: ACCEPT
    reason: >-
      Independent experimental support for the same core activity, with the
      specificity verified in solution. The paper also reports the catalytic
      parameters that UniProt cites (kcat 12 s-1). Consistent with the other
      GO:0046421 rows.
    supported_by:
    - reference_id: PMID:15723538
      supporting_text: The binding modes reveal the determinants of substrate specificity
        and stereoselectivity, and the stringent specificity is verified in solution using
        various potential substrates.
    - reference_id: PMID:15723538
      supporting_text: We propose a catalytic mechanism involving an alpha-carboxy-carbanion
        intermediate/transition state
