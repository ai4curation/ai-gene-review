suggested_questions:
- question: >-
    How does active-site loop closure contribute to discriminating
    2-methylisocitrate from isocitrate, given that isocitrate binds but is not
    cleaved?
suggested_experiments:
- description: >-
    Measure growth on propionate and 2-methylcitrate-cycle intermediate
    accumulation in an E. coli K-12 prpB deletion complemented with wild-type
    PrpB or active-site-loop variants, to connect the in vitro specificity
    determinants to in vivo flux.
  experiment_type: gene deletion, complementation and metabolite profiling
