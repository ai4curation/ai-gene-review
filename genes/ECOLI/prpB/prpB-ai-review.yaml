  review:
    summary: >-
      The 1.9 A crystal structure of E. coli PrpB contains a bound Mg2+ ion and
      the enzyme strictly depends on Mg2+ for catalysis.
    action: KEEP_AS_NON_CORE
    reason: >-
      Mg2+ binding is directly observed in the PrpB structure and is required
      for catalysis, so the annotation is correct. It is a cofactor-binding
      property that serves the core methylisocitrate lyase activity rather than
      a function in its own right, so it is kept as non-core. The term is as
      specific as GO allows for this metal.
