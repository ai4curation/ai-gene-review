taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  BioA is the adenosylmethionine-8-amino-7-oxononanoate aminotransferase
  (DAPA aminotransferase; EC 2.6.1.62) of Escherichia coli K-12, a cytoplasmic
  pyridoxal 5'-phosphate (PLP)-dependent transaminase of the class-III
  aminotransferase fold. It transfers the alpha-amino group of
  S-adenosyl-L-methionine (SAM) to 8-amino-7-oxononanoate (KAPA), producing
  7,8-diaminononanoate (DAPA) and S-adenosyl-4-methylsulfanyl-2-oxobutanoate.
  This is the unusual third step of biotin ring assembly: BioA is the only known
  aminotransferase that uses SAM as the amino donor. The enzyme is a symmetrical
  homodimer with the PLP active site at the subunit interface; its structure and
  kinetics are well characterised. The gene lies in the E. coli bio operon
  (bioA is divergently transcribed from bioBFCD).
