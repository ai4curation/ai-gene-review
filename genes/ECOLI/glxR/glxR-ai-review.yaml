    label: NADP binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR006115
  review:
    summary: >-
      Predicted from the 6-phosphogluconate dehydrogenase-type NAD(P)-binding Rossmann
      domain. UniProt records both NADP- and NAD-linked reactions for EC 1.1.1.60, but the
      characterized E. coli enzyme was assayed with NAD+/NADH.
    action: KEEP_AS_NON_CORE
    reason: >-
      The NAD(P)-binding Rossmann fold makes dinucleotide binding certain, and NADP use is
      part of the EC 1.1.1.60 reaction as curated by UniProt, but the only direct
      biochemistry (PMID:10978349) reports NAD-dependent activity, so the NADP preference
      of GlxR is not established. Kept as non-core cofactor binding.
    supported_by:
    - reference_id: file:ECOLI/glxR/glxR-uniprot.txt
      supporting_text: "Reaction=(R)-glycerate + NADP(+) = 2-hydroxy-3-oxopropanoate + NADPH +"
    - reference_id: file:ECOLI/glxR/glxR-uniprot.txt
      supporting_text: "DR   InterPro; IPR006115; 6PGDH_NADP-bd."
