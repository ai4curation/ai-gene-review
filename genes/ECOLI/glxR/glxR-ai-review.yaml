suggested_questions:
- question: >-
    What are the relative kinetic preferences of GlxR for NADH versus NADPH, and does this
    distinguish it physiologically from its paralog GarR in the galactarate pathway?
- question: >-
    Can GarR compensate for GlxR in vivo when glyoxylate is the carbon source, or are the
    two reductases strictly partitioned by operon-specific induction?
suggested_experiments:
- description: >-
    Measure steady-state kinetics of purified GlxR and GarR with tartronate semialdehyde
    and NADH or NADPH, and test growth of glxR, garR and double mutants on glyoxylate,
    glycolate and galactarate.
  experiment_type: Enzyme kinetics and genetic complementation
