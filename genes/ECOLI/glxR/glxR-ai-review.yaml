id: P77161
gene_symbol: glxR
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  glxR encodes tartronate semialdehyde reductase (2-hydroxy-3-oxopropionate reductase,
  EC 1.1.1.60), a member of the 3-hydroxyisobutyrate dehydrogenase (HIBADH)-related
  family of beta-hydroxyacid dehydrogenases with an N-terminal NAD(P)-binding
  Rossmann domain. The purified enzyme specifically reduces tartronate semialdehyde to
  D-glycerate with NADH and catalyzes the reverse NAD+-dependent oxidation of
  D-glycerate. It acts as the second step of the glycerate pathway, between glyoxylate
  carboligase (Gcl), which forms tartronate semialdehyde from glyoxylate, and glycerate
  kinase, which forms the glycolytic intermediate 3-phosphoglycerate; glxR mutants lack
  the reductase activity and cannot use glyoxylate. glxR lies downstream of gcl and hyi
  in a glyoxylate- and allantoin-inducible operon within the AllR-repressed allantoin
  utilization gene cluster. E. coli carries a paralogous tartronate semialdehyde
  reductase, GarR, in the galactarate/glucarate pathway.
existing_annotations:
- term:
    id: GO:0006974
    label: DNA damage response
  evidence_type: IEP
  original_reference_id: PMID:11967071
  qualifier: acts_upstream_of_or_within
  review:
    summary: >-
      Derived from a genome-wide microarray study in which nearly 30% of all E. coli genes
      changed expression after mitomycin C treatment. A transcript-level change of a
      glycerate-pathway enzyme does not show that GlxR performs any step of the DNA damage
      response.
    action: REMOVE
    reason: >-
      Expression-pattern evidence only; the study itself reports changes in roughly a third
      of the genome, many attributable to general stress and growth effects. GlxR is a
      metabolic dehydrogenase with no known role in sensing or repairing DNA damage, and
      nothing in the abstract singles out glxR. Being transcriptionally responsive is not
      participation in the process.
    supported_by:
    - reference_id: PMID:11967071
      supporting_text: Unexpectedly, a large number of genes (nearly 30% of all genes) displayed significant changes in their expression level.
    - reference_id: PMID:10978349
      supporting_text: identifying this protein as a tartronate semialdehyde reductase
