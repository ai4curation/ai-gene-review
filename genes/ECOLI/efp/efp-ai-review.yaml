- term:
    id: GO:2001125
    label: negative regulation of translational frameshifting
  evidence_type: IMP
  original_reference_id: PMID:26009254
  qualifier: acts_upstream_of_or_within
  review:
    summary: EF-P suppresses +1 frameshifting at slippery CC[C/U]-[C/U] proline codons, most strongly at
      the second codon.
    action: KEEP_AS_NON_CORE
    reason: Gamper et al. show, in vivo with lacZ reporters and with kinetic assays on purified components,
      that EF-P together with m1G37-modified tRNA(Pro) suppresses +1 frameshifting at CCC-C motifs. This
      is a real but secondary result of EF-P stabilizing the P-site tRNA(Pro) and speeding up peptidyl transfer.
      It is kept as non-core.
    supported_by:
    - reference_id: PMID:26009254
