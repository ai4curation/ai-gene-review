- term:
    id: GO:0043022
    label: ribosome binding
  evidence_type: IDA
  original_reference_id: PMID:18201202
  qualifier: enables
  review:
    summary: EF-P binds the 70S ribosome, as shown by footprinting of 16S and 23S rRNA.
    action: KEEP_AS_NON_CORE
    reason: Chemical footprinting shows that EF-P protects 16S and 23S rRNA, which is direct evidence that
      it binds the ribosome. The cryo-EM structure (PMID:29100052) places it at the E-site of stalled 70S
      ribosomes. Binding is a necessary part of how EF-P works, but the core activity is captured by translation
      elongation factor activity, so this term is non-core. The site interpretation in this 2008 paper (A-site
      protection, a possible role in fidelity) was later revised by structural work showing E-site binding.
      The binding claim itself stands.
    supported_by:
    - reference_id: PMID:18201202
      supporting_text: We report that EF-P protects 16S rRNA near the G526 streptomycin and the S12 and mRNA
        binding sites (30S T-site).
    - reference_id: file:ECOLI/efp/efp-uniprot.txt
      record_section: ["CC:SUBUNIT"]
      supporting_text: In stalled 70S ribosomes binds in the tRNA E-site, stabilizing the peptidyl-tRNA
