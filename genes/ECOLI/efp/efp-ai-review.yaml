id: P0A6N4
gene_symbol: efp
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: efp encodes elongation factor P (EF-P), a soluble cytoplasmic translation factor of about
  20 kDa that is structurally related to archaeal and eukaryotic initiation factor 5A. EF-P binds the
  70S ribosome between the peptidyl-tRNA (P) site and the exit (E) site and stimulates peptide-bond
  formation. Its main role is to relieve ribosome stalling during synthesis of proteins that contain
  consecutive proline residues (for example PPP and PPG motifs), by stabilizing the P-site peptidyl-tRNA
  so that the nascent chain takes a geometry favourable for peptidyl transfer. In E. coli, EF-P becomes
  active only after Lys34 is modified with (R)-beta-lysine by the lysyl-tRNA synthetase paralog EpmA,
  using (R)-beta-lysine made by EpmB, and is then hydroxylated by EpmC. The modified residue reaches
  toward the peptidyl-transferase center and contacts the CCA end of the P-site tRNA. EF-P also suppresses
  +1 frameshifting at slippery proline codons near the start of reading frames. Loss of efp is lethal
  or causes very slow growth, and its function partly overlaps with the paralog EfpL (YeiP) and the
  ABCF ATPase Uup.
