suggested_questions:
- question: How much of EF-P's rescue activity on the full range of arrest motifs, including the non-di-Pro
    motifs found by ribosome profiling, depends on EpmC hydroxylation compared with beta-lysylation alone?
- question: Given that EF-P can itself induce pauses, which genes show EF-P-dependent pausing in vivo,
    and does that pausing have a physiological role?
suggested_experiments:
- description: Ribosome profiling of efp, efpL and uup single and double mutants, and of strains expressing
    EF-P K34 variants, to separate the arrest motifs that need modified EF-P from those that partner factors
    can resolve.
