  title: Interactions of elongation factor EF-P with the Escherichia coli ribosome.
  findings:
  - statement: Footprinting shows that EF-P binds and protects 16S and 23S rRNA on the 70S ribosome.
    supporting_text: EF-P also protects domain V of the 23S rRNA proximal to the A-site (50S T-site) and
      more strongly the A-site of 70S ribosomes.
