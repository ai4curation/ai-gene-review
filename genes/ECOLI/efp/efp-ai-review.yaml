- id: PMID:29100052
  title: Structural Basis for Polyproline-Mediated Ribosome Stalling and Rescue by the Translation Elongation
    Factor EF-P.
  findings:
  - statement: Cryo-EM of polyproline-stalled ribosomes with modified EF-P shows that EF-P stabilizes the
      P-site tRNA through its modification and the CCA end, allowing a geometry that supports peptide-bond
      formation.
    supporting_text: Binding of EF-P stabilizes the P-site tRNA, particularly via interactions between its
      modification and the CCA end, thereby enforcing an alternative conformation of the polyproline-containing
      nascent chain, which allows a favorable substrate geometry for peptide bond formation.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only cache. Structural mechanism of EF-P rescue on E. coli ribosomes.
