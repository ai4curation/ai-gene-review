id: P11880
gene_symbol: murF
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  MurF is the ATP-dependent UDP-N-acetylmuramoyl-tripeptide:D-alanyl-D-alanine ligase of Escherichia coli
  (EC 6.3.2.10). This monomeric, soluble cytosolic enzyme catalyses the last cytoplasmic step of peptidoglycan
  precursor synthesis, adding the D-Ala-D-Ala dipeptide made by Ddl to UDP-MurNAc-L-Ala-gamma-D-Glu-meso-diaminopimelate
  to form UDP-MurNAc-pentapeptide, the substrate of MraY. Its third-position specificity is relaxed: it
  acts with similar kinetics on DAP-analogue tripeptides and, in vitro, on the L-lysine tripeptide typical
  of Gram-positive bacteria, although in E. coli only the meso-DAP tripeptide is made. Thermosensitive
  murF mutants accumulate UDP-MurNAc-tripeptide, fail to make murein and lyse.
