- term:
    id: GO:0047480
    label: UDP-N-acetylmuramoyl-tripeptide-D-alanyl-D-alanine ligase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN000566380
  - UniProtKB:P11880
  - UniProtKB:Q2FWH4
  review:
    summary: >-
      L-Lys-tripeptide form of the MurF activity propagated at PTN000566380, with S. aureus MurF (a Lys-type
      enzyme) among the seeds.
    action: KEEP_AS_NON_CORE
    reason: >-
      GO:0047480 is defined on the L-lysine-containing tripeptide (UDP-MurNAc-L-Ala-D-Glu-L-Lys), the
      Gram-positive substrate; its sibling GO:0008766 is defined on the meso-DAP tripeptide, which is
      the physiological substrate in E. coli (Rhea 28374 in UniProt). E. coli MurF tolerates variation
      at the third position: kinetics are very similar with DAP and DAP analogues, and the Barreteau et
      al. 2008 review (PMID:18266853, web full text; abstract-only in cache) states that the meso-A2pm
      and L-Lys tripeptides are equally effective substrates. The L-Lys ligation is therefore a real in
      vitro activity, but E. coli never makes a Lys-tripeptide because MurE excludes L-lysine, so it is
      non-core. The PAINT node correctly places both forms at the MurF ancestor; E. coli MurF is within
      the clade and retains the broad third-position tolerance.
    supported_by:
    - reference_id: PMID:8021219
      supporting_text: >-
        The kinetic parameters of the MurF synthetase catalyzing the addition of D-alanyl-D-alanine were
        very similar for the meso-A2pm-,L-allo-cystathionine-, and meso-lanthionine-containing UDP-MurNAc
        tripeptides.
    - reference_id: PMID:2186811
      supporting_text: >-
        catalyzes the final cytoplasmic step in the biosynthesis of the bacterial peptidoglycan precursor
        UDP-N-acetylmuramyl-L-Ala-gamma-D-Glu-meso-diaminopimelyl-D-Ala-D- Ala
