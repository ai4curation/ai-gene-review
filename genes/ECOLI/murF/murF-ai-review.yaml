suggested_questions:
- question: >-
    Should the peptidoglycan precursor module use GO:0008766 (meso-DAP tripeptide) rather than GO:0047480
    (L-Lys tripeptide) for DAP-type MurF orthologs such as E. coli and P. putida, or model the third-residue
    variants as the MurE node does?
- question: >-
    Does the strong substrate inhibition of MurF by UDP-MurNAc-tripeptide contribute to flux control of
    the cytoplasmic Mur pathway in vivo?
suggested_experiments:
- description: >-
    Side-by-side steady-state kinetics of purified E. coli MurF with meso-DAP and L-Lys UDP-MurNAc-tripeptides,
    to quantify the in vitro Lys activity behind GO:0047480.
  experiment_type: enzyme kinetics
