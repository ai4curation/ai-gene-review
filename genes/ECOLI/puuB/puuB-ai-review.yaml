      Xref=Rhea:RHEA:28414
suggested_questions:
- question: >-
    What are the kinetic parameters and flavin stoichiometry of purified PuuB, and does it oxidize unmodified
    putrescine or other gamma-glutamyl amines?
suggested_experiments:
- description: >-
    Purify PuuB, identify the bound flavin, and measure activity with gamma-glutamylputrescine, putrescine
    and gamma-glutamyl-spermidine, monitoring O2 consumption and H2O2 formation.
  experiment_type: enzyme kinetics
