core_functions:
- description: >-
    Oxygen-dependent oxidative deamination of gamma-L-glutamylputrescine to 4-(gamma-L-glutamylamino)butanal,
    ammonium and hydrogen peroxide, the second step of the gamma-glutamyl putrescine catabolic pathway.
    GO has no substrate-specific term, so the CH-NH2-donor oxidase parent is used and a new term is proposed.
  molecular_function:
    id: GO:0016641
    label: oxidoreductase activity, acting on the CH-NH2 group of donors, oxygen as acceptor
