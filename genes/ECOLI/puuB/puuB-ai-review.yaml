  label: Escherichia coli K-12
description: >-
  PuuB is the gamma-glutamylputrescine oxidoreductase of Escherichia coli K-12, a soluble FAD-dependent
  oxidoreductase of the D-amino acid oxidase (DAO) fold. In the Puu putrescine utilization pathway it
  oxidatively deaminates gamma-L-glutamylputrescine, using O2, to 4-(gamma-L-glutamylamino)butanal with
  release of ammonium and hydrogen peroxide, the second enzymatic step after PuuA. puuB is clustered and
  co-regulated with the other puu genes, and putrescine accumulates in puuB mutants.
