proposed_new_terms:
- proposed_name: gamma-glutamylputrescine oxidase activity
  proposed_definition: >-
    Catalysis of the reaction: gamma-L-glutamylputrescine + O2 + H2O = 4-(gamma-L-glutamylamino)butanal
    + H2O2 + NH4+.
  justification: >-
    RHEA:28414 describes the PuuB reaction but GO has no corresponding molecular function; the closest
    existing term is the class parent GO:0016641.
  supported_by:
  - reference_id: file:ECOLI/puuB/puuB-uniprot.txt
