id: P03004
gene_symbol: dnaA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: DnaA is the ATP-regulated initiator of Escherichia coli chromosome replication. It recognizes
  DnaA boxes at oriC, assembles an oligomeric origin complex, opens the DNA-unwinding element and recruits
  the DnaB helicase. Conversion of ATP-DnaA to ADP-DnaA helps prevent reinitiation. DnaA also binds other
  chromosomal regulatory sites and autoregulates its transcription. It is predominantly associated with
  cytoplasmic DNA, with a smaller peripheral inner-membrane-associated population implicated in nucleotide
  exchange.
