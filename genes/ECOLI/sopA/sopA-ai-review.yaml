  label: Escherichia coli K-12
description: >-
  SopA is the partition ATPase of the F plasmid, encoded with SopB in the
  sopAB operon next to the sopC centromere. It is a deviant Walker-type
  (ParA family) ATPase. ATP-bound SopA binds DNA non-specifically and
  associates with the host nucleoid; its weak intrinsic ATPase is stimulated
  by DNA and further by SopB bound at sopC, which supplies an arginine
  finger. Cycles of nucleoid binding and SopB-stimulated release position
  and separate the SopB-sopC partition complexes, so that each daughter cell
  inherits a plasmid copy. SopA also polymerizes in an ATP-dependent manner
  in vitro. Separately, SopA binds CTTTGC repeats in the sopAB
  promoter-operator and, together with SopB, represses the operon, keeping
  Sop protein levels in the range that partition needs.
existing_annotations:
- term:
    id: GO:0016887
    label: ATP hydrolysis activity
  evidence_type: IDA
  original_reference_id: PMID:1406581
  review:
    summary: Purified SopA hydrolyses ATP, stimulated by DNA and further by SopB.
    action: NEW
    reason: >-
      GOA has no annotation of any kind for SopA. Purified SopA has a
      magnesium-dependent ATPase that DNA stimulates and SopB stimulates
      further. Later work shows that the stimulation needs direct DNA binding
      by SopA and an arginine finger contributed by SopB. This is the core
      activity of the partition ATPase.
    supported_by:
    - reference_id: PMID:1406581
      supporting_text: The SopA protein showed a modest magnesium ion-dependent ATPase activity and this
        activity was stimulated in the presence of DNA.
    - reference_id: PMID:19740757
      supporting_text: we have found that the intrinsic ability of SopA to hydrolyze ATP requires direct
        DNA binding by SopA but not by SopB.
- term:
    id: GO:0003677
    label: DNA binding
  evidence_type: IDA
  original_reference_id: PMID:18826408
  review:
    summary: SopA binds DNA non-specifically in an ATP-dependent manner, which is required for partition.
    action: NEW
    reason: >-
      The non-specific, ATP-dependent DNA binding that tethers SopA to the
      nucleoid is part of the partition mechanism: a K340A substitution that
      cuts this binding more than 100-fold abolishes plasmid stabilization.
      There is no GO term for non-specific DNA binding, so the general term is
      used; the sequence-specific operator binding is a separate row.
    supported_by:
    - reference_id: PMID:18826408
      supporting_text: we have found that mutation of codon 340 (lysine to alanine) reduces ATP-dependent
        DNA binding > 100-fold
    - reference_id: PMID:19740757
      supporting_text: through its ATP-dependent nonspecific DNA binding domain
- term:
    id: GO:0030541
    label: plasmid partitioning
  evidence_type: IMP
  original_reference_id: PMID:18826408
  review:
    summary: SopA is the motor of F plasmid partition.
    action: NEW
    reason: >-
      SopA does work in the process: it is the ATPase that positions and
      separates the partition complexes. A SopA mutant defective only in
      non-specific DNA binding loses plasmid stabilization, and SopA locked
      into static polymers in vivo blocks plasmid segregation.
    supported_by:
    - reference_id: PMID:18826408
      supporting_text: The K340A mutant retained all other SopA properties tested except plasmid stabilization
    - reference_id: PMID:16306264
      supporting_text: mutations that lock SopA into a static polymer in the cell inhibit plasmid segregation
- term:
    id: GO:0043590
    label: bacterial nucleoid
  evidence_type: IDA
  original_reference_id: PMID:9529520
  review:
    summary: SopA colocalizes with the nucleoid.
    action: NEW
    reason: >-
      Immunofluorescence shows SopA over the nucleoid when produced alone,
      consistent with its ATP-dependent non-specific DNA binding. In the
      presence of SopB and sopC it forms foci with the partition complex.
    supported_by:
    - reference_id: PMID:9529520
      supporting_text: SopA was exclusively found to colocalize with nucleoids in cells that produced only
        SopA
- term:
    id: GO:0001217
    label: DNA-binding transcription repressor activity
  evidence_type: IDA
  original_reference_id: PMID:2670941
  review:
    summary: SopA binds the sopAB operator and, with SopB, represses the operon.
    action: NEW
    reason: >-
      SopA binds four CTTTGC repeats in the sopAB promoter-operator, and SopB
      enhances that binding. Reporter assays show the operon is repressed by
      SopA and SopB together. This autoregulation keeps Sop protein levels in
      the narrow range partition needs; it is a real but peripheral activity.
    supported_by:
    - reference_id: PMID:2670941
      supporting_text: SopA binds to four repeated sequences (CTTTGC) located in the promoter-operator region
        of the sopAB operon.
    - reference_id: PMID:9529520
      supporting_text: the sopAB operon is repressed by the cooperative action of SopA and SopB
- term:
    id: GO:0045892
    label: negative regulation of DNA-templated transcription
  evidence_type: IMP
  original_reference_id: PMID:9529520
  review:
    summary: SopA and SopB repress transcription of the sopAB operon.
    action: NEW
    reason: >-
      The process that the operator-binding activity serves. Non-core, for the
      same reason.
    supported_by:
    - reference_id: PMID:9529520
      supporting_text: the sopAB operon is repressed by the cooperative action of SopA and SopB
