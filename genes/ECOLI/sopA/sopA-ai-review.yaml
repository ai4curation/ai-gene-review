suggested_questions:
- question: Does SopA act in partition as dynamic polymers, as a diffusion-ratchet gradient of nucleoid-bound
    dimers, or both under different conditions?
suggested_experiments:
- description: Track single SopB-sopC complexes and nucleoid-bound SopA in vivo with SopA variants
    separated for polymerization and for non-specific DNA binding.
  hypothesis: Partition requires nucleoid binding and SopB-stimulated release, but not filament formation.
  experiment_type: live-cell single-molecule imaging
