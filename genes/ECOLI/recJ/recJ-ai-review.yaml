suggested_questions:
- question: Does RecJ physically associate with MutL or UvrD at mismatch-repair excision tracts, or is
    it recruited only through SSB?
suggested_experiments:
- hypothesis: RecJ is the predominant 5'-3' excision nuclease for mismatch repair from 5' strand signals
    in vivo.
  description: Measure repair of plasmid heteroduplexes with defined 5' versus 3' nicks in recJ, xseA
    and recJ xseA strains, alongside single-molecule imaging of RecJ recruitment to MutL-UvrD tracts.
  experiment_type: genetics and single-molecule imaging
