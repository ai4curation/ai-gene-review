id: P21893
gene_symbol: recJ
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: RecJ is the single-stranded-DNA-specific 5'-to-3' exonuclease of Escherichia coli, a DHH-family
  phosphoesterase that degrades linear ssDNA and the 5' single-stranded tails of duplexes but has no activity
  on double-stranded DNA. It is required for RecF-pathway recombination and recombinational repair of
  daughter-strand gaps, where it resects DNA to expose ssDNA for RecA, and it is one of the redundant
  exonucleases that excise the error-containing strand in methyl-directed mismatch repair when the strand
  break lies 5' to the mismatch.
