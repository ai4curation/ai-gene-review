  review:
    summary: >-
      Lord (1972) characterized the E. coli glycolate oxidoreductase
      activity (Km 40 uM glycolate, no direct reaction with O2, DCIP/PMS as
      acceptors).
    action: ACCEPT
    reason: >-
      The measured activity is that of the GlcDEF complex, of which GlcE is
      a required subunit; UniProt curates this paper as experimental evidence
      for the activity of each subunit. The annotation is accepted, noting
      that a contributes_to qualifier would describe GlcE's role more
      precisely, since GlcE lacks the oxidase C-terminal domain of the
      catalytic subunit GlcD.
