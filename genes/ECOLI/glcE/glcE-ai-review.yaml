- term:
    id: GO:0019154
    label: glycolate dehydrogenase activity
  evidence_type: IMP
  original_reference_id: PMID:8606183
  qualifier: enables
  review:
    summary: >-
      A cassette insertion in glcE abolished glycolate oxidase activity.
    action: ACCEPT
    reason: >-
      Shows GlcE is required for the activity and, with its flavoenzyme
      similarity, that it is a subunit of the enzyme. Because insertions in
      an operon can be polar, the abolition of activity in a glcE mutant
      may partly reflect reduced glcF expression; the subunit assignment
      nevertheless rests also on sequence similarity and operon structure.
    supported_by:
    - reference_id: PMID:8606183
      supporting_text: The insertional mutation by a chloramphenicol acetyltransferase cassette in either glcD, glcE, or glcF abolished glycolate oxidase activity, indicating that presumably these proteins are subunits of this enzyme.
