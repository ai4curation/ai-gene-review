    summary: >-
      GlcE is one of the three subunits (GlcD, GlcE, GlcF) of the E. coli
      glycolate oxidase/dehydrogenase complex; GlcD carries this annotation
      but GlcE does not.
    action: NEW
    reason: >-
      Insertion mutants in each of glcD, glcE and glcF abolish glycolate
      oxidase activity, and UniProt records the enzyme as a GlcDEF
      heterotrimer. GO:0009339 is the complex term whose definition cites
      these E. coli papers (its text definition needs revision, see
      suggested_questions). Physical association of GlcE with GlcD and GlcF
      has not been demonstrated biochemically, so this rests on genetic and
      operon evidence.
