id: P52073
gene_symbol: glcE
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  GlcE is a flavoprotein subunit of the heterotrimeric, membrane-associated
  glycolate dehydrogenase GlcDEF (historically called glycolate oxidase or
  glycolate oxidoreductase), which oxidizes glycolate to glyoxylate as the
  first committed step of glycolate utilization. GlcE consists of an
  N-terminal PCMH-type FAD-binding domain related to that of the catalytic
  subunit GlcD, but lacks the FAD-linked oxidase C-terminal domain that GlcD
  carries; its precise contribution to catalysis (second flavin, structural
  partner of GlcD, or electron relay toward the iron-sulfur subunit GlcF) is
  not known. The complex does not use O2 as acceptor, reduces artificial dyes
  in vitro, and also oxidizes D-lactate. Loss of GlcE abolishes glycolate
  oxidase activity and growth on glycolate as sole carbon source. glcE lies
  in the glycolate-inducible glcDEFGB operon, controlled by the activator
  GlcC.
