proposed_new_terms: []
suggested_questions:
- question: >-
    Does GlcE bind FAD, and does it participate directly in electron
    transfer between GlcD and GlcF, or does it serve mainly as a structural
    partner of GlcD?
- question: >-
    The GO:0009339 glycolate oxidase complex definition describes an FMN,
    O2-dependent, cytoplasmic enzyme while citing the E. coli GlcDEF papers;
    should it be revised to describe the FAD/Fe-S, membrane-associated
    glycolate dehydrogenase (EC 1.1.99.14)?
suggested_experiments:
- experiment_type: complementation and protein biochemistry
  description: >-
    Construct an in-frame, non-polar glcE deletion and complement in trans
    to exclude polar effects on glcF; co-purify tagged GlcDEF to confirm
    stable association and determine flavin content of GlcE.
