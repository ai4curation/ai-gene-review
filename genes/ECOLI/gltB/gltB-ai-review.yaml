- term:
    id: GO:0004355
    label: glutamate synthase (NADPH) activity
  evidence_type: IDA
  original_reference_id: PMID:4565085
  qualifier: enables
  review:
    summary: GltB contributes to the coupled NADPH-dependent glutamate synthase reaction.
    action: ACCEPT
    reason: The large chain is a constituent of the catalytic GltB–GltD complex. PMID:2448295 identifies
      both subunits genetically, and publication-linked UniProt curation retains the reaction measured
      for E. coli strain W in PMID:4565085. The complete reaction requires both chains; this acceptance
      does not claim that an isolated chain performs the entire physiological turnover.
    supported_by:
    - reference_id: file:ECOLI/gltB/gltB-uniprot.txt
      record_section:
      - CC:FUNCTION
      supporting_text: Catalyzes the conversion of L-glutamine and 2-oxoglutarate
    - reference_id: file:ECOLI/gltB/gltB-uniprot.txt
      record_section:
      - CC:FUNCTION
      supporting_text: into two molecules of L-glutamate. {ECO:0000269|PubMed:4565085}.
    - reference_id: PMID:2448295
      supporting_text: The existence of a gltBDF operon encoding the large (gltB) and small (gltD) subunits
        of glutamate synthase and a regulatory peptide (gltF) at 69 min of the E. coli linkage map was
        deduced from complementation analysis.
    - reference_id: PMID:10785395
