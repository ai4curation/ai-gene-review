id: P09831
gene_symbol: gltB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: GltB is the large catalytic subunit of cytosolic NADPH-dependent glutamate synthase in Escherichia
  coli K-12. Its glutamine amidotransferase center releases ammonia from L-glutamine, and an FMN-associated
  center uses that nitrogen to convert 2-oxoglutarate into a second L-glutamate. Coupling to the GltD
  electron-transfer subunit links these reactions to NADPH oxidation. Together with glutamine synthetase,
  the complex assimilates ammonium and supplies cellular glutamate.
