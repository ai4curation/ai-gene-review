      details were not accessible. Independent evidence establishes the GltB–GltD enzyme complex, without
      proving that this particular screen row describes that interaction. Generic protein binding is uninformative,
      but the standing unavailable-evidence rule prevents an experimental REMOVE or an unsupported specific
      replacement.
