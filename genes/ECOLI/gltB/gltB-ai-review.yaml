    reason: The coupled reaction converts the glutamine produced by GlnA plus 2-oxoglutarate into two
      glutamates. This chain directly participates as the glutamine-processing and FMN-dependent catalytic
      component. The pathway assignment follows the reaction and complex membership, not the polar gltF-associated
      phenotype in PMID:2448295.
