proposed_new_terms:
- proposed_name: azobenzene reductase (NADH) activity
  proposed_definition: >-
    Catalysis of the NADH-dependent reductive cleavage of an aromatic azo compound to the
    corresponding amines: for example, N,N-dimethyl-1,4-phenylenediamine + anthranilate + 2 NAD(+)
    = 2-(4-dimethylaminophenyl)diazenylbenzoate + 2 NADH + 2 H(+). Distinct from azobenzene
    reductase (NADP+) activity (GO:0050446, EC 1.7.1.6), which uses NADPH.
  justification: >-
    This is the azoreductase activity of AzoR (EC 1.7.1.17, RHEA:55872). GO has only the
    NADP+-specific GO:0050446 (EC 1.7.1.6), which does not fit an NADH enzyme (OLS/QuickGO have no
    NADH azoreductase term, checked 2026-11-24). Requested as a child of GO:0046857 (oxidoreductase
    acting on other nitrogenous compounds as donors, with NAD or NADP as acceptor), parallel to the
    NADP+ term.
  proposed_parent:
    id: GO:0046857
    label: oxidoreductase activity, acting on other nitrogenous compounds as donors, with NAD or
      NADP as acceptor
  proposed_mappings:
  - predicate: skos:exactMatch
    target_term:
      id: RHEA:55872
      label: N,N-dimethyl-1,4-phenylenediamine + anthranilate + 2 NAD(+) =
        2-(4-dimethylaminophenyl)diazenylbenzoate + 2 NADH + 2 H(+)
  supported_by:
  - reference_id: PMID:11583992
    supporting_text: The reaction followed a ping-pong mechanism requiring 2 mol of NADH to reduce
      1 mol of methyl red
suggested_questions:
- question: Is the azoreductase activity of AzoR an incidental consequence of its broad
    quinone-reductase active site, or does it have a physiological role in reducing endogenous or
    environmental azo/nitro compounds?
suggested_experiments:
- hypothesis: AzoR's primary cellular substrates are endogenous and environmental quinones rather
    than azo dyes.
  description: Metabolomic comparison of wild-type and azoR-deletion E. coli under electrophilic
    quinone stress, with in vitro kinetic profiling of candidate physiological quinone substrates
    against methyl red.
