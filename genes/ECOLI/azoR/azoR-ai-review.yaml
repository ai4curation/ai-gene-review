  review:
    summary: AzoR reductively cleaves azo dyes (methyl red); the annotated term specifies NADP+,
      but the assayed and physiological cofactor is NADH.
    action: MODIFY
    reason: The azoreductase activity is genuine and directly assayed, but GO:0050446 is the
      NADP+-dependent azobenzene reductase (EC 1.7.1.6), whereas AzoR is the FMN-dependent
