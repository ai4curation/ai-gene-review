id: P41407
gene_symbol: azoR
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  AzoR (the acpD gene product) is a soluble, FMN-dependent NADH:quinone oxidoreductase of
  Escherichia coli with a flavodoxin-like fold that functions as an obligate homodimer, each of
  its two active sites being built from both subunits. Using NADH as electron donor and a bound
  FMN, it reduces electrophilic benzo-, naphtho- and anthraquinones by a ping-pong mechanism and
  so protects the cell against thiol-specific oxidative stress caused by such quinones; its
  expression is induced by electrophiles. The same catalytic machinery reductively cleaves the azo
  bond of aromatic azo dyes such as methyl red (an NADH-azoreductase activity, EC 1.7.1.17, that
  gave the enzyme its name) and reduces some nitroaromatic compounds, although quinones are the
  better, physiologically relevant substrates.
