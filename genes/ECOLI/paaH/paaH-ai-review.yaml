      3-hydroxyadipyl-CoA and NAD+, and no data show that it uses 3-hydroxybutyryl-CoA
      or NADP+. PaaH appears here as a donor only because of its own GO:0008691 IDA row,
      which itself rests on the NAD+/3-hydroxyadipyl-CoA assay. The accurate term at
      this node for the PaaH clade is GO:0003857.
