    summary: The 3-hydroxybutyryl-CoA (NADP+) activity term does not match the
      demonstrated NAD+-dependent 3-hydroxyadipyl-CoA dehydrogenase activity.
    action: MODIFY
    reason: >-
      GO:0008691 is defined as (S)-3-hydroxybutanoyl-CoA + NADP+ = acetoacetyl-CoA +
