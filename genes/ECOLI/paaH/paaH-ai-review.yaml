suggested_questions:
- question: Does PaaH show measurable activity with 3-hydroxybutyryl-CoA or with NADP+,
    which would justify the 3-hydroxybutyryl-CoA dehydrogenase label used by PANTHER and
    the PDB 3MOG entry?
suggested_experiments:
- description: Determine the steady-state kinetics of purified E. coli PaaH with
    (S)- and (R)-3-hydroxyadipyl-CoA and with 3-hydroxybutyryl-CoA, using NAD+ and
    NADP+, to define its stereospecificity and cofactor and substrate preferences.
