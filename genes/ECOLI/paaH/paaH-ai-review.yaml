  review:
    summary: Phylogenetic propagation of fatty acid beta-oxidation to the
      phenylacetate-pathway 3-hydroxyadipyl-CoA dehydrogenase.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      GO:0006635 describes complete oxidation of long-chain fatty acids. E. coli PaaH
      is encoded in the paa operon and oxidizes the aromatic-ring-derived C6
      dicarboxylic intermediate 3-hydroxyadipyl-CoA. It does not associate with PaaF
      or PaaJ into a beta-oxidation-type multienzyme complex, and no experiment
