id: P76083
gene_symbol: paaH
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  PaaH is the NAD+-dependent 3-hydroxyadipyl-CoA dehydrogenase of the aerobic,
  CoA-thioester-based phenylacetate catabolic pathway of Escherichia coli, encoded in
  the paaABCDEFGHIJK operon. In the beta-oxidation-like lower part of the pathway it
  oxidizes 3-hydroxyadipyl-CoA, made by the PaaF hydratase, to 3-oxoadipyl-CoA, which
  the PaaJ thiolase then cleaves to succinyl-CoA and acetyl-CoA. PaaH belongs to the
  3-hydroxyacyl-CoA dehydrogenase family, with an N-terminal NAD-binding Rossmann
  domain and C-terminal 3-hydroxyacyl-CoA dehydrogenase domains, and acts as a
  stand-alone enzyme rather than as part of a FadBA-like multienzyme complex. paaH
  deletion mutants cannot grow on phenylacetate and accumulate 3-hydroxyadipate.
