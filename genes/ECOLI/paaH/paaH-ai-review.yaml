    summary: Generic family-level process mapping from 3-hydroxyacyl-CoA dehydrogenase
      domain signatures.
    action: MARK_AS_OVER_ANNOTATED
    reason: The 3-hydroxyacyl-CoA dehydrogenase domains are shared with fatty acid
      beta-oxidation enzymes. However, PaaH acts on 3-hydroxyadipyl-CoA, a C6
