  review:
    summary: Epsilon proofreads DNA through 3′–5′ DNA exonucleolysis.
    action: MODIFY
    reason: Purified epsilon directly edits DNA through 3′ to 5′ exonucleolysis; dnaQ mutants have defective
      editing and greatly increased mutation rates. The activity and proofreading process are independently
