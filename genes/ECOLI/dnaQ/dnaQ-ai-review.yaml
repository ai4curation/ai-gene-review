id: P03007
gene_symbol: dnaQ
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: DnaQ is the epsilon proofreading subunit of Escherichia coli DNA polymerase III. Its 3′ to
  5′ exonuclease removes incorrectly incorporated terminal nucleotides and promotes replication fidelity.
  Epsilon associates with the DnaE alpha polymerase and HolE theta subunit in the polymerase core and
  also improves productive DNA synthesis. Polymerization and proofreading are catalyzed by different subunits.
