- question: Which endogenous E. coli substrates most strongly depend on GroES capping
    rather than GroEL binding alone?
- question: Is the mycobacterial Cpn10 metal-binding PAINT source a lineage-specific
    activity, a condition-specific observation, or a source annotation that should
    be retired?
