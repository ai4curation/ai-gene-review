core_functions:
- description: GroES directly binds the GroEL protein-folding chaperone as a heptameric
    co-chaperonin and contributes to ATP-dependent protein folding by the GroEL-GroES
    chamber. GroES capping reorients the GroEL apical domains, buries hydrophobic
    peptide-binding residues, and stabilizes the hydrophilic folding chamber in which
    non-native polypeptides are released and assisted toward their native fold.
  molecular_function:
    id: GO:0051087
    label: protein-folding chaperone binding
  contributes_to_molecular_function:
    id: GO:0140662
    label: ATP-dependent protein folding chaperone
  directly_involved_in:
