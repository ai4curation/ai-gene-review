- term:
    id: GO:0005524
    label: ATP binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR018369
  - InterPro:IPR020818
  review:
    summary: InterPro2GO-derived ATP-binding row for the GroES/Cpn10 family, likely
      reflecting the historical azido-ATP-labeling report for GroES.
    action: REMOVE
    reason: Martin et al. reported azido-ATP labeling of GroES Tyr71, so the
      electronic mapping has a primary-paper provenance. However, ATP/ADP binding
      in productive GroEL-GroES structures is assigned to the GroEL rings, and
      UniProt does not curate a nucleotide-binding feature on E. coli GroES. The
      accepted nucleotide-dependent role of GroES is regulation of GroEL chamber
      closure and ATPase cycling by partner binding, not a conserved ATP-binding
      molecular function on the GroES lid itself.
    supported_by:
    - reference_id: PMID:7901771
      supporting_text: Surprisingly, GroES also binds ATP cooperatively and with an
        affinity comparable to that of GroEL.
    - reference_id: PMID:9285585
      supporting_text: The structure of the GroEL-GroES-(ADP)7 complex reveals how
        large en bloc movements of the cis ring's intermediate and apical domains
        enable bound GroES to stabilize a folding chamber with ADP confined to the
        cis ring.
