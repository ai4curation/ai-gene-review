gene_symbol: groS
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: GroS, also called GroES or Cpn10, is the small heptameric co-chaperonin
  lid of the essential E. coli GroEL-GroES chaperonin. Each GroES ring binds the
  apical surface of a GroEL heptamer and caps the cis GroEL chamber, allowing
  ATP-driven encapsulation of non-native proteins in a protected hydrophilic cage
  that promotes folding and prevents aggregation. GroES cycles on and off GroEL
  during assisted protein folding in the bacterial cytosol and is also required
  as a host chaperonin factor for assembly of several bacteriophages.
