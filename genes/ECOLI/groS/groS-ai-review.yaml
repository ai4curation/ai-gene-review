    summary: PAINT metal-ion-binding assertion placed at the broad GroES/Cpn10-family
      node from a mycobacterial descendant.
    action: REMOVE
    reason: Metal ion binding is not an established molecular function of E. coli
      GroES, which lacks a UniProt metal-binding feature and is functionally curated
      as the heptameric GroEL lid. The same PTHR10772 root appropriately carries
      conserved folding and chaperone-binding terms, but the mycobacterial metal-binding
      observation has not been shown to mark an ancestral GroES-family function
      inherited by E. coli GroES.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: PANTHER:PTN000080668
        source_label: PANTHER:PTN000080668
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: This is the same broad PTHR10772 node used for conserved GroES folding
          terms, but metal binding appears to be source-specific and is unsafe for
          E. coli GroES.
      - source_id: UniProtKB:P9WPE5
        source_label: UniProtKB:P9WPE5
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: The listed mycobacterial descendant may support a local metal-binding
          source annotation, but it does not establish that metal binding arose at
          the GroES-family node inherited by E. coli GroES.
