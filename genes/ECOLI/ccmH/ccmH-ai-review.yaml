- term:
    id: GO:0015035
    label: protein-disulfide reductase activity
  evidence_type: ISM
  original_reference_id: PMID:9914305
  qualifier: enables
  review:
    summary: >-
      The N-terminal CcmH domain has a conserved CXXC motif whose cysteines
      are required for cytochrome c maturation; the mutant defect is rescued
      by an exogenous thiol, supporting a reducing role on apocytochrome c.
    action: ACCEPT
    reason: >-
      In E. coli, deletion analysis showed that only the CXXC-containing
      N-terminal domain is needed, cysteine substitutions block maturation, and
      2-mercaptoethanesulfonate complements the point mutants, indicating a
      thiol-reducing function directed at the apocytochrome heme-binding site.
      Biochemistry with the Rhodobacter capsulatus orthologs shows that CcmH
      engages apocytochrome c in thiol-disulfide exchange (a CcmH-apocytochrome
      mixed disulfide that CcmG resolves). This is a gene-level call grounded in
      the E. coli CcmH evidence; the PTHR47870 family review leaves
      GO:0015035 UNRESOLVED only at family scope, because SF2/SF4 members lack
      the redox motif. Protein-disulfide reductase activity
      is therefore an appropriate subunit-level activity for CcmH within the
      CcmG/CcmH redox relay, although the CcmH reaction is less fully
      characterized than that of CcmG.
    supported_by:
    - reference_id: PMID:9914305
      supporting_text: This confirmed that only the N-terminal domain containing a
        conserved CXXC motif is required in E. coli.
    - reference_id: PMID:9914305
      supporting_text: The deficiency of the point mutants was complemented when
        2-mercapto-ethanesulfonic acid was added to growing cells
    - reference_id: PMID:9914305
      supporting_text: We propose a model for the reaction sequence in which CcmH
        keeps the heme binding site of apocytochrome c in a reduced form for subsequent
        heme ligation.
    - reference_id: PMID:28634234
      supporting_text: CcmG can efficiently reduce the disulfide bond of apocytochrome
        c and also resolve a mixed disulfide bond formed between apocytochrome c and
        CcmH
