core_functions:
- description: >-
    Redox-active subunit of the CcmF/CcmH holocytochrome c synthase at the
    periplasmic face of the inner membrane. Its N-terminal CXXC domain keeps
    the apocytochrome CXXCH heme-binding site reduced through thiol-disulfide
    exchange (with CcmG as partner in the redox relay), and in complex with
    CcmF it contributes to stereospecific covalent attachment of heme to
    apocytochromes c.
  molecular_function:
