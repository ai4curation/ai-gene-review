- term:
    id: GO:0017004
    label: cytochrome complex assembly
  evidence_type: IDA
  original_reference_id: PMID:19629033
  qualifier: involved_in
  review:
    summary: CcmH is a subunit of the purified CcmF/CcmH cytochrome c synthetase that attaches heme to
      apocytochromes c.
    action: MODIFY
    reason: The annotation is sound but GO:0017004 is a broad parent. The CcmF/CcmH complex performs covalent
      attachment of heme to the CXXCH motif, which is precisely GO:0018063 cytochrome c-heme linkage,
      an is_a descendant of GO:0017004. Unlike CcmG, which only reduces the apocytochrome before ligation
      and is refined to GO:1903607, CcmH is a subunit of the CcmF/CcmH synthase that forms the heme linkage,
      so the linkage term applies.
    proposed_replacement_terms:
    - id: GO:0018063
      label: cytochrome c-heme linkage
    supported_by:
    - reference_id: PMID:19629033
      supporting_text: Thus, the final CcmF/H complex is even more complicated than originally envisioned,
        functioning as a cytochrome c synthetase and as a quinol:haem oxidoreductase.
