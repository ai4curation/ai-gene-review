- id: PMID:9914305
  title: Characterization of the Escherichia coli CcmH protein reveals new insights into the redox pathway
    required for cytochrome c maturation.
  findings:
  - statement: ccmH deletion abolishes c-type cytochromes; only the N-terminal CXXC domain is required;
      thiol rescue of cysteine mutants supports a reducing role.
    supporting_text: This confirmed that only the N-terminal domain containing a conserved CXXC motif
      is required in E. coli.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only in cache; primary E. coli CcmH characterization.
- id: PMID:28634234
  title: The thioreduction component CcmG confers efficiency and the heme ligation component CcmH ensures
    stereo-specificity during cytochrome c maturation.
  findings:
  - statement: R. capsulatus CcmG reduces apocytochrome disulfides and resolves CcmH-apocytochrome mixed
      disulfides.
    supporting_text: CcmG can efficiently reduce the disulfide bond of apocytochrome c and also resolve
      a mixed disulfide bond
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Refreshed full text read. Direct thiol-exchange kinetics and complex interactions concern
      R. capsulatus, whose CcmH and CcmI are separate. Exact substrate and cysteine-partner assignments
      cannot be silently treated as direct E. coli or KT2440 evidence. CcmH stereospecific mixed-disulfide
      chemistry differs from calling CcmH a demonstrated net reductase.
- id: PMID:7635817
  title: Escherichia coli genes required for cytochrome c maturation.
  findings:
  - statement: The E. coli ccmABCDEFGH cluster is required for maturation of all indigenous and foreign
      c-type cytochromes.
    supporting_text: the E. coli ccm gene cluster present in the aeg-46.5 region is required for a general
      pathway involved in cytochrome c maturation
- id: file:ECOLI/ccmH/ccmH-uniprot.txt
  title: UniProtKB entry for E. coli CcmH (P0ABM9)
  findings:
  - statement: Curated inner-membrane location, CcmF interaction, and CcmH/CycL/Ccl2/NrfF family membership
      with C-terminal TPR repeats.
- id: PMID:24397552
  title: 'The CcmFH complex is the system I holocytochrome c synthetase: engineering cytochrome c maturation
    independent of CcmABCDE.'
  findings:
  - statement: Engineered E. coli CcmFGH-only produces covalently matured cytochrome c, establishing synthase
      function of CcmFH.
    supporting_text: Our findings establish that CcmFH is the system I holocytochrome c synthetase.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text read. Engineered bypass with increased expression/heme availability and product
      characterization distinguishes covalent heme attachment from mere necessity. CcmF histidines and
      CcmG/H cysteines are required. It does not establish that native cells dispense with CcmABCDE or
      that an isolated subunit enables the complete synthase reaction.
