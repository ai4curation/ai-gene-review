  title: A conserved haem redox and trafficking pathway for cofactor attachment.
  findings:
  - statement: E. coli CcmF/CcmH complex purified; CcmF carries a b-haem and the complex acts as cytochrome
      c synthetase and quinol:haem oxidoreductase.
    supporting_text: Thus, the final CcmF/H complex is even more complicated than originally envisioned,
      functioning as a cytochrome c synthetase and as a quinol:haem oxidoreductase.
  reference_review:
