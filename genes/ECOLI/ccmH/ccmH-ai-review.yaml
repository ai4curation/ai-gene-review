suggested_questions:
- question: >-
    Does E. coli CcmH directly reduce apocytochrome c disulfides, or does it
    mainly trap the apocytochrome as a mixed disulfide that CcmG resolves, as
    shown for the Rhodobacter capsulatus proteins?
- question: >-
    What, if anything, does the dispensable C-terminal CycH-like TPR domain of
    E. coli CcmH contribute under conditions other than those tested (e.g.
    specific multiheme cytochromes such as NrfA)?
suggested_experiments:
- description: >-
    Measure thiol-disulfide exchange rates between purified E. coli CcmH
    N-terminal domain, CcmG and apocytochrome c variants, and trap mixed
    disulfides with single-cysteine CcmH mutants.
  experiment_type: in vitro thiol-disulfide exchange kinetics
