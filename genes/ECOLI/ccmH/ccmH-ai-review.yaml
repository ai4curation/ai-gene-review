  review:
    summary: CcmH thiol-disulfide participation is established, but net protein-disulfide reduction by
      E. coli CcmH remains unresolved.
    action: UNDECIDED
    reason: CXXC substitutions and thiol rescue in PMID:9914305 support redox involvement and motivated
      a reduction model, but do not directly demonstrate the net reductase reaction. R. capsulatus assays
      assign direct reduction and mixed-disulfide resolution to CcmG, while CcmH participates in stereospecific
      mixed-disulfide chemistry. This is not evidence for net reduction by the E. coli fusion protein.
      Retain synthase contribution without forcing this precise molecular activity.
    supported_by:
    - reference_id: PMID:28634234
      supporting_text: CcmG can efficiently reduce the disulfide bond of apocytochrome c and also resolve
        a mixed disulfide bond
    - reference_id: PMID:24397552
      supporting_text: Our findings establish that CcmFH is the system I holocytochrome c synthetase.
