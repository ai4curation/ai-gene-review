description: >-
  CcmH is an inner-membrane component of cytochrome c maturation system I in
  Escherichia coli. The 350-residue precursor carries an N-terminal periplasmic
  CcmH/CycL/NrfF domain with a conserved CXXC (RCPKC) thiol motif, two
  transmembrane segments, and a C-terminal periplasmic tetratricopeptide-repeat
  domain homologous to the separate CcmI/CycH protein of other Gram-negative
  bacteria; in E. coli only the N-terminal redox domain is required for
  cytochrome c maturation. Both cysteines of the CXXC motif are needed for
  holocytochrome c formation, and their loss is bypassed by an exogenous thiol,
  consistent with CcmH keeping the apocytochrome CXXCH heme-binding site
  reduced through thiol-disulfide exchange. CcmH associates with the heme-binding
  membrane protein CcmF, and the purified CcmF/CcmH complex forms the
  holocytochrome c synthase (heme lyase) that receives heme from holo-CcmE and
  covalently attaches it to apocytochromes c in the periplasm. Loss of ccmH
  abolishes formation of all c-type cytochromes.
