  review:
    summary: >-
      Co-immunoprecipitation shows that CcmH associates with CcmF, the
      heme-binding membrane subunit of the cytochrome c heme lyase.
    action: REMOVE
    reason: >-
      The CcmF-CcmH interaction is real and functionally important (it defines
      the CcmF/CcmH holocytochrome c synthase complex), but a bare protein
      binding term carries no functional information. The biologically
      meaningful content is captured in this review by the contribution of
      CcmH to holocytochrome-c synthase activity (core function) and by the
      process term cytochrome c-heme linkage. Removal does not dispute the
      reported interaction.
    supported_by:
    - reference_id: PMID:11744735
      supporting_text: Co-immunoprecipitation experiments revealed that CcmF interacts
        directly with the heme donor CcmE and with CcmH but not with apocytochrome
        c.
    - reference_id: PMID:11744735
      supporting_text: We propose that CcmFH forms a bacterial heme lyase complex
        for the transfer of heme from CcmE to apocytochrome c.
