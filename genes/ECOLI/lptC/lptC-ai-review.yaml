suggested_questions:
- question: How does insertion of the LptC transmembrane helix between LptF and
    LptG regulate LptB2FG ATPase activity in vivo, and is this regulation coupled
    to LptA docking at the LptC C-terminal edge?
- question: Since the LptC transmembrane helix is dispensable for viability, is
    LptC membrane anchoring required for efficient LPS flux, or mainly for complex
    stability?
suggested_experiments:
- experiment_type: in vivo transport kinetics
  description: Measure LPS transport rates (e.g. pulse-chase delivery to the outer
    membrane or site-specific photocrosslinking flux) in strains carrying LptC lacking
    its transmembrane helix or with LptA-binding-edge mutations, to separate the
    regulatory and transfer roles of LptC.
- experiment_type: structural biology
  description: Determine cryo-EM structures of LptB2FGC bound to LptA, with LPS
    trapped in the LptC-LptA interface, to define the handoff mechanism.
