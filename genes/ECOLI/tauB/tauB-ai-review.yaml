id: Q47538
gene_symbol: tauB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  TauB is the ATP-binding cassette subunit of the Escherichia coli TauABC
  taurine importer. Two TauB subunits sit on the cytoplasmic face of the inner
  membrane, bound to the two TauC permease subunits, and hydrolyse ATP to drive
  import of taurine delivered by the periplasmic binding protein TauA. The
  tauABCD operon is expressed under sulfate or cysteine starvation and is
  needed for growth on taurine as the sole sulfur source; TauABC also imports
  several other short sulfonates. TauB does not work with the SsuC permease of
  the related alkanesulfonate importer, so the two systems cannot form hybrid
  transporters.
