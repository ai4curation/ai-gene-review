- id: file:ECOLI/manX/manX-deep-research-falcon.md
  title: 'Falcon (Edison Scientific) deep research report: Functional annotation of manX (UniProt P69797)
    in Escherichia coli K-12'
  findings:
  - statement: Falcon corroborates ManX as the cytosolic EIIAB phosphotransfer subunit of the mannose-family
      PTS, distinct from the membrane permease subunits ManY/ManZ.
    reference_section_type: OTHER
    supporting_text: ManX** is the **mannose-family PTS EIIAB subunit**. In curated annotations, it is
      associated with the inner-membrane system but is itself annotated as a **cytosolic component (IM,
      C)**, consistent with a cytosolic phosphotransfer function that operates in conjunction with inner-membrane
      permease components.
  - statement: Falcon corroborates the manXYZ operon organization, with manY and manZ encoding the membrane
      permease subunits of the complex.
    reference_section_type: OTHER
    supporting_text: Multiple sources explicitly place **manX** with **manY** and **manZ** in the **manXYZ**
      locus, where manY and manZ encode the membrane permease subunits.
  - statement: Falcon corroborates the broad/promiscuous substrate range of the Man-PTS beyond mannose,
      consistent with the secondary glucose, fructose, and N-acetylglucosamine transport annotations marked
      non-core in this review.
    reference_section_type: OTHER
    supporting_text: the mannose-family PTS can be **promiscuous** in substrate handling beyond mannose
  - statement: Falcon corroborates a substrate set including mannose, glucose, 2-deoxyglucose, fructose,
      and amino sugars (GlcNAc/GlcN) for the ManXYZ PTS system.
    reference_section_type: OTHER
    supporting_text: lists substrates associated with the ManXYZ PTS system including **mannose, glucose,
      2-deoxyglucose, fructose**, and amino sugars (including **GlcNAc/GlcN**)
  - statement: Falcon corroborates the dual localization of ManX as a cytosolic/peripheral phosphotransfer
      component associated with the inner membrane complex.
    reference_section_type: OTHER
    supporting_text: ManX is annotated as **IM, C**, consistent with a **cytosolic/peripheral phosphotransfer
      component associated with the inner membrane complex**.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Existing genuine Falcon provider report read and preserved. Used for literature leads
      and contextual synthesis; primary publications and structural identity establish core claims independently.
