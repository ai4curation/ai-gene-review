id: P69797
gene_symbol: manX
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: ManX is the soluble and peripheral inner-membrane EIIAB phosphotransfer subunit of the mannose-family
  PTS in Escherichia coli K-12. Its N-terminal EIIA domain receives phosphate from HPr at His10; its C-terminal
  EIIB domain carries His175 and transfers phosphate to incoming sugar in the assembled ManXYZ transporter.
  Phosphotransfer occurs both within one polypeptide and between subunits of the ManX homodimer. ManY
  and ManZ provide the membrane translocation machinery. The complex imports and phosphorylates mannose
  and also accepts glucose, fructose and amino sugars. Sugar taxis is an additional system-level context;
  lambda DNA penetration is mediated by the membrane components and does not require ManX.
existing_annotations:
- term:
    id: GO:0008982
    label: protein-N(PI)-phosphohistidine-sugar phosphotransferase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  review:
    summary: ManX catalyses histidyl-phosphate transfer during coupled import of mannose and other supported
      sugars.
    action: MODIFY
    reason: 'The broad phosphotransfer claim is sound, not an over-annotation merely because ManX is not
      an ATP-dependent kinase. Its EIIB His175 directly donates phosphate to transported sugar with the
      membrane partners present (PMID:2681202). Refine to the existing mannose PTS activity. GO:0022870
      is a verified descendant of this general function. The catalytic assignment does not claim isolated
      ManX transports sugar across a bilayer. PAINT lineage inspection found no IRD/IKR blocking this
      target; the more precise target chemistry does not challenge the conserved ancestral phosphotransfer
      function. The refinement retains all four substrate contexts already supported in this review: mannose,
      glucose, fructose and N-acetylglucosamine. Current GO glucose/fructose PTS definitions do not specify
      a phosphate position; GO:0022880 does require GlcNAc6-phosphate, independently documented in PMID:9864311
      Figure1. This is biochemical/pathway synthesis rather than claiming the 2019 ManYZ counterflow assay
      measured every coupled reaction. The core records contribution to assembled transport, preserving
      the direct ManX catalytic role.'
    supported_by:
    - reference_id: PMID:2681202
      supporting_text: In the presence of the IIMan subunits, the phosphoryl group is directly transferred
        from His-175 of P20 to the sugar substrates of the permease.
    - reference_id: file:analysis/module_audits/bacterial_mannose_pts/ecoli-consultation/evidence.md
      supporting_text: The mannose transporter of E. coli has a broad substrate specificity, including
        glucose, mannose, fructose, glucosamine, N-acetylglucosamine, and N-acetylmannosamine
    - reference_id: file:analysis/module_audits/bacterial_mannose_pts/ecoli-consultation/core-contribution-followup/substrate-evidence.md
      supporting_text: GlcNAc is transported by both the manXYZ -encoded transporter and its own specific
        transporter, encoded by nagE , producing intracellular GlcNAc-6-P
    proposed_replacement_terms:
    - id: GO:0022870
      label: protein-N(PI)-phosphohistidine-mannose phosphotransferase system transporter activity
    - id: GO:0022855
      label: protein-N(PI)-phosphohistidine-glucose phosphotransferase system transporter activity
    - id: GO:0022877
      label: protein-N(PI)-phosphohistidine-fructose phosphotransferase system transporter activity
    - id: GO:0022880
      label: protein-N(PI)-phosphohistidine-N-acetylglucosamine phosphotransferase system transporter
        activity
- term:
    id: GO:0009401
    label: phosphoenolpyruvate-dependent sugar phosphotransferase system
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: ManX participates directly in PEP-dependent sugar group translocation.
    action: ACCEPT
    reason: ManX performs the EIIAB phosphoryl-transfer relay and sugar phosphorylation in ManXYZ. The
      resolved three-subunit study establishes coupled transport/phosphorylation. This is core pathway
      work, not a generic inference from growth or mere coexpression. The PAINT-loss check found no blocking
      IRD/IKR on the target lineage; no new ancestral gain/loss assertion is authored.
    supported_by:
    - reference_id: PMID:2951378
      supporting_text: All three subunits are required for sugar transport and phosphorylation
- term:
    id: GO:1902495
    label: transmembrane transporter complex
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: part_of
  review:
    summary: ManX belongs to the mannose PTS transporter assembly.
    action: ACCEPT
    reason: ManX associates functionally with ManY/ManZ and is the soluble catalytic unit of the transporter.
      Its own homodimer is distinct from the threefold ManYZ membrane architecture; a fixed complete-complex
      stoichiometry is not inferred.
