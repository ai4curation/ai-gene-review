- term:
    id: GO:0015764
    label: N-acetylglucosamine transport
  evidence_type: EXP
  original_reference_id: PMID:6252281
  qualifier: acts_upstream_of_or_within
  review:
    summary: ManX supports N-acetylglucosamine uptake through the broad-substrate ManXYZ system.
    action: KEEP_AS_NON_CORE
    reason: N-acetylglucosamine is a supported physiological substrate context of ManXYZ, retained beside
      the mannose-centered core rather than denied because another transporter exists. PMID:6252281 explicitly
      describes PtsM as one of two N-acetylglucosamine PTS routes and reports utilization as sole carbon
      source. No universal substrate preference or quantitative contribution in every growth condition
      is inferred.
    supported_by:
    - reference_id: PMID:6252281
      supporting_text: Strains with either of these components of the phosphotransferase system will utilize
        N-acetylglucosamine as sole carbon source.
