- id: PMID:2951378
  title: The mannose permease of Escherichia coli consists of three different proteins. Amino acid sequence
    and function in sugar transport, sugar phosphorylation, and penetration of phage lambda DNA.
  findings:
  - statement: Demonstrated that the mannose permease consists of three subunits (IIIMan/ManX, II-PMan/ManY,
      II-MMan/ManZ) encoded in a single transcriptional unit. All three are required for sugar transport
      and phosphorylation. ManX (IIIMan, 35 kDa) is a hydrophilic protein that is transiently phosphorylated
      and contains the active site for sugar phosphorylation. The permease also functions as a receptor
      for bacterial chemotaxis and is required for bacteriophage lambda DNA penetration (II-PMan and II-MMan
      are sufficient for lambda DNA penetration).
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Protected publication cache is abstract-only or bibliographic-only. Curated experimental
      claims are not rejected from abstract silence; no unseen target-specific tables or constructs are
