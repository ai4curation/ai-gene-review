    - reference_id: PMID:2951378
      supporting_text: All three subunits are required for sugar transport and phosphorylation
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: located_in
  review:
    summary: Soluble ManX occupies the cytosol and can associate with the inner membrane.
    action: MODIFY
    reason: The cytoplasm claim is correct. The biochemical isolation of free soluble IIIMan/ManX and
      its cytoplasmic phosphotransfer reactions support the more specific existing cytosol term. Membrane-associated
      ManX is retained separately; this refinement does not turn ManX into a transmembrane protein.
