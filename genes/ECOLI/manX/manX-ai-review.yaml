- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:16606699
  qualifier: enables
  review:
    summary: IPI annotation for protein binding based on large-scale pull-down assay (PMID:16606699).
      The interacting partner is CytR (P0ACN7) per the GOA WITH column. Per curation guidelines, GO:0005515
      (protein binding) is uninformative and should be removed. ManX has well-characterized specific interactions
      (homodimerization, interaction with HPr) that are captured by more specific terms.
    action: REMOVE
    reason: Per curation guidelines, "protein binding" (GO:0005515) is uninformative and does not convey
      meaningful functional information about ManX. The large-scale pull-down study (PMID:16606699) identifies
      interactions but the generic "protein binding" term does not add useful annotation. More specific
      interaction terms like GO:0042803 (protein homodimerization activity) are already annotated.
    supported_by:
    - reference_id: PMID:16606699
      supporting_text: A large-scale comprehensive pull-down assay was performed using a His-tagged Escherichia
        coli ORF clone library
