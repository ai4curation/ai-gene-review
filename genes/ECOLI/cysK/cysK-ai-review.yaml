  review:
    summary: CysK directly activates the UPEC536 CdiA-CT tRNase independently of cysteine synthase catalysis.
    action: NEW
    reason: Purified CysK activates otherwise latent CdiA-CT tRNA cleavage; catalytically inactive CysK
