taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: CysK (O-acetylserine sulfhydrylase A, OASS-A) is the major cytosolic pyridoxal 5'-phosphate-dependent
  cysteine synthase of Escherichia coli. The homodimeric enzyme condenses O-acetyl-L-serine with sulfide
  to form L-cysteine and acetate, the second and final step of cysteine biosynthesis from serine. It associates
  with serine acetyltransferase (CysE), whose C-terminal tail docks into the CysK active site, to form
  the cysteine synthase complex; this is a regulatory and structural association, because complex formation
  lowers the activity of the bound CysK, so the productive sulfhydrylase is the free enzyme in excess
  over CysE. CysK also shows secondary L-cysteine desulfhydrase activity and, during contact-dependent
  growth inhibition by uropathogenic E. coli, binds and activates the tRNase toxin CdiA-CT independently
  of its catalytic activity. The paralog CysM (OASS-B) provides a second O-acetylserine sulfhydrylase
  that also uses thiosulfate.
