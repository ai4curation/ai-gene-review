core_functions:
- description: PLP-dependent condensation of O-acetyl-L-serine with sulfide to form L-cysteine and acetate,
    the terminal step of cysteine biosynthesis, carried out by free cytosolic CysK; the CysK bound in
    the cysteine synthase complex with CysE is a regulatory reservoir whose activity is lowered by complex
    formation.
  molecular_function:
    id: GO:0004124
    label: cysteine synthase activity
  directly_involved_in:
  - id: GO:0019344
    label: L-cysteine biosynthetic process
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - *id001
  - *id003
  - *id002
- description: Acts as a noncatalytic activating partner for the UPEC536 CdiA-CT tRNase in susceptible
    target cells, stabilizing its active fold and enabling substrate binding independently of cysteine
    synthase catalysis.
  molecular_function:
    id: GO:0170054
    label: ribonuclease activator activity
  supported_by: *id007
suggested_questions:
- question: What fraction of cellular cysteine synthesis is carried by free CysK versus CysK bound in
    the cysteine synthase complex under sulfate-limited growth, given that complex formation inhibits
    CysK?
- question: Does the CysK desulfhydrase side activity contribute measurably to sulfide or Fe-S cluster
    sulfur supply in vivo, or only under cysteine excess?
- question: Is CdiA-CT activation a moonlighting use of the CysE-binding site only, or does toxin binding
    also perturb cysteine synthesis in CDI target cells?
suggested_experiments:
- description: Compare cysteine synthesis flux and O-acetylserine pools in strains expressing wild-type
    CysE versus a CysE C-terminal truncation that cannot bind CysK, with cysM deleted, under sulfate and
    thiosulfate.
  experiment_type: metabolic flux and genetic analysis
