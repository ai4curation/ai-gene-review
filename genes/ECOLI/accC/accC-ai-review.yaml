- term:
    id: GO:0006633
    label: fatty acid biosynthetic process
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - AGI_LocusCode:AT5G35360
  - PANTHER:PTN002449506
  - UniProtKB:P24182
  review:
    summary: >-
      Phylogenetic propagation of the fatty acid biosynthesis role to the biotin
      carboxylase clade; correct and core for E. coli AccC.
    action: ACCEPT
    reason: >-
      The carboxybiotin that AccC makes is the carboxyl donor for malonyl-CoA synthesis,
      the committed step of fatty acid synthesis, and overproducing ACC raises the fatty
      acid synthesis rate sixfold in E. coli (PMID:10893421). No IRD or IKR loss lies on
      this gene's lineage. Biotin carboxylase modules also serve other biotin-dependent
      carboxylases in other organisms, but in E. coli accC has no such alternative partner.
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: PANTHER:PTN002449506
        source_status: SUPPORTS_TRANSFER
        comment: >-
          Ancestral biotin carboxylase node; in the bacterial ACC clade the role is fatty
          acid biosynthesis and the E. coli branch retains it.
      - source_id: AGI_LocusCode:AT5G35360
        source_status: SUPPORTS_TRANSFER
        comment: >-
          Arabidopsis plastid heteromeric ACC biotin carboxylase; same pathway role in a
          different compartment.
      - source_id: UniProtKB:P24182
        source_status: SUPPORTS_TRANSFER
        comment: >-
          AccC itself is descendant experimental evidence for the node, as expected in the
          WITH/FROM of an IBA it receives.
    supported_by:
    - reference_id: PMID:10893421
      supporting_text: >-
        Under these conditions ACC overproduction resulted in a 6-fold increase in the
        rate of fatty acid synthesis.
