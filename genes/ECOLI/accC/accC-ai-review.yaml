core_functions:
- description: >-
    ATP-grasp biotin carboxylase that carboxylates the biotinyllysine prosthetic
    group of AccB using bicarbonate and ATP, with magnesium at the active site. This
    is the first half-reaction of acetyl-CoA carboxylation; the carboxybiotin
    produced is handed to the AccA/AccD carboxyltransferase, which makes
    malonyl-CoA. AccC functions as a homodimer within the ACC holoenzyme.
  molecular_function:
    id: GO:0004075
    label: biotin carboxylase activity
  contributes_to_molecular_function:
    id: GO:0003989
    label: acetyl-CoA carboxylase activity
  directly_involved_in:
  - id: GO:2001295
    label: malonyl-CoA biosynthetic process
  - id: GO:0006633
    label: fatty acid biosynthetic process
  locations:
  - id: GO:0005829
    label: cytosol
  in_complex:
    id: GO:0009317
    label: acetyl-CoA carboxylase complex
  supported_by:
  - reference_id: file:ECOLI/accC/accC-uniprot.txt
    supporting_text: 'Reaction=N(6)-biotinyl-L-lysyl-[protein] + hydrogencarbonate + ATP ='
  - reference_id: PMID:19213731
    supporting_text: >-
      These enzymes share a conserved biotin carboxylase (BC) component, which catalyzes
      the ATP-dependent carboxylation of biotin using bicarbonate as the donor.
  - reference_id: PMID:22037404
    supporting_text: We conclude that BC must be dimeric to fulfill its physiological function.
suggested_questions:
- question: >-
    How is the two-site chemistry coordinated in the holoenzyme: does the BCCP arm
    shuttle between fixed BC and carboxyltransferase sites, or does the complex
    rearrange between half-reactions?
- question: >-
    Why has no stable, fully assembled E. coli ACC holoenzyme been isolated, and is the
    weak association of the biotin carboxylase and carboxyltransferase components
    functionally meaningful rather than a purification artefact?
suggested_experiments:
- description: >-
    Reconstitute AccC with AccB, AccA and AccD and measure malonyl-CoA formation while
    titrating AccC dimer-interface mutants, to separate the catalytic and assembly
    contributions of dimerization in the intact holoenzyme.
- description: >-
    Use cryo-electron microscopy or crosslinking mass spectrometry on a stabilised
    AccABCD assembly to determine whether the biotin carboxylase and carboxyltransferase
    active sites are held at a fixed distance compatible with the BCCP linker length.
