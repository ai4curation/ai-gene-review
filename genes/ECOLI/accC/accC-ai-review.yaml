- term:
    id: GO:0003989
    label: acetyl-CoA carboxylase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - AGI_LocusCode:AT5G35360
  - PANTHER:PTN002449506
  - UniProtKB:P96890
  review:
    summary: >-
      The holoenzyme reaction is correctly assigned to the biotin carboxylase clade, but
      AccC alone catalyses only the first half-reaction; it cannot carboxylate acetyl-CoA.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      GO:0003989 denotes the complete reaction ATP + acetyl-CoA + HCO3- = ADP + phosphate
      + malonyl-CoA. AccC's own, directly measured activity is GO:0004075 biotin
      carboxylase activity (EC 6.3.4.14), which is accepted below; malonyl-CoA formation
      additionally requires AccB as carrier and the AccA/AccD carboxyltransferase. The
      propagation is sound at the clade level - the sources are biotin carboxylase
      components of multisubunit and multidomain ACCs - so this is a term scoping problem,
      recorded as a contribution plus complex membership. The same judgement is applied to
      the GO:0003989 rows of accA, accB and accD.
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - ROLE_CONFLATION
      - GRANULARITY_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN002449506
        source_status: SUPPORTS_TRANSFER
        comment: >-
          Ancestral biotin carboxylase node; descent is not in doubt and no PAINT loss
          lies on the E. coli branch, but the term placed there is the activity of the
          whole carboxylase rather than of the BC component.
      - source_id: AGI_LocusCode:AT5G35360
        source_status: SUPPORTS_TRANSFER
        comment: >-
          Arabidopsis biotin carboxylase (plastid heteromeric ACC) descendant evidence; it
          shares the subunit-versus-holoenzyme scoping rather than correcting it.
      - source_id: UniProtKB:P96890
        source_status: SUPPORTS_TRANSFER
        comment: >-
          Descendant evidence listed in the GOA WITH/FROM for the node; a biotin
          carboxylase component in another bacterium, so the same reading applies.
    supported_by:
