id: P24182
gene_symbol: accC
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  AccC is the biotin carboxylase subunit of the heteromeric bacterial acetyl-CoA
  carboxylase. It is an ATP-grasp enzyme that catalyses the first half-reaction
  of acetyl-CoA carboxylation: using bicarbonate as the carboxyl donor and ATP
  as the energy source, it carboxylates the biotinyllysine prosthetic group of
  the biotin carboxyl carrier protein (AccB), forming carboxybiotinyl-AccB, ADP
  and phosphate. Catalysis proceeds through a carboxyphosphate intermediate and
  an enolate biotin intermediate, with divalent magnesium (or manganese) ions
  required at the active site. The carboxybiotin produced is then handed to the
  AccA/AccD carboxyltransferase, which transfers the carboxyl group to
  acetyl-CoA to give malonyl-CoA, the committed precursor for de novo fatty acid
  synthesis. AccC is a homodimer, and dimerization is required for its
  physiological function even though isolated monomeric mutants retain partial
  activity in vitro. The same biotin carboxylase module is conserved as a domain
  of the multidomain eukaryotic acetyl-CoA carboxylases and of other
  biotin-dependent carboxylases.
