- term:
    id: GO:0042803
    label: protein homodimerization activity
  evidence_type: IDA
  original_reference_id: PMID:22037404
  qualifier: enables
  review:
    summary: >-
      AccC is a homodimer and dimerization is required for its function in vivo, but
      dimerization supports the catalytic activity rather than being the core function.
    action: KEEP_AS_NON_CORE
    reason: >-
      The claim is well supported and specific: BC is isolated as a dimer, interface
      mutants that are monomeric fail to support growth unless highly overexpressed, and
      the dimer is seen crystallographically. It is kept, but the gene's core molecular
      function is GO:0004075; homodimerization is a structural property that the activity
      depends on.
    supported_by:
    - reference_id: PMID:22037404
      supporting_text: >-
        We have tested the abilities of three BC mutant proteins deficient in dimerization
        to support growth and report that the two BC proteins most deficient in
        dimerization fail to support growth unless expressed at high levels.
    - reference_id: PMID:22037404
      supporting_text: We conclude that BC must be dimeric to fulfill its physiological function.
- term:
    id: GO:0045717
    label: negative regulation of fatty acid biosynthetic process
  evidence_type: IMP
  original_reference_id: PMID:17056747
  qualifier: acts_upstream_of_or_within
  review:
    summary: >-
      What the cited experiment shows is that unbalanced AccC overproduction sequesters
      AccB and leaves it underbiotinylated, which down-regulates biotin synthesis; it is
      not a regulatory function of AccC in fatty acid biosynthesis.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The paper's finding is that excess AccC forms an AccB complex that is a poor
      substrate for BirA-mediated biotinylation, so bio operon expression falls and AccB
      is underbiotinylated; co-overexpressing AccB abolishes the effect. The consequences
      for fatty acid synthesis are an indirect result of imposed subunit imbalance, and in
      wild-type cells AccC is a positive, not a negative, element of the pathway - raising
      all four subunits increases the synthesis rate (PMID:10893421). Reading this as
      negative regulation of fatty acid biosynthesis inverts the sign of the gene's
      physiological role, so the row is kept only as an over-annotation; the regulatory
      phenomenon actually measured concerns biotin synthesis and protein biotinylation.
    supported_by:
    - reference_id: PMID:17056747
      supporting_text: >-
        We report here that bio operon expression is down-regulated by overproduction of
        AccC, another acetyl-CoA carboxylase subunit known to form a complex with AccB.
    - reference_id: PMID:17056747
      supporting_text: >-
        These findings can be explained by a model in which excess AccC sequesters AccB in
        a complex that is a poor substrate for biotinylation.
