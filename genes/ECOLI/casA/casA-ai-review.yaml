    summary: The interaction recorded here is the contact between the C-terminal
      four-helix bundle of CasA and the CasB (Cse2) dimer seen in the Cascade crystal
      structure. That contact is what closes the structural circuit between the tail
      and the head of the complex, so the informative statement is a structural one
      rather than a bare binding one.
