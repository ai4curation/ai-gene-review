- term:
    id: GO:0030674
    label: protein-macromolecule adaptor activity
  evidence_type: IPI
  original_reference_id: PMID:22521689
  qualifier: enables
  supporting_entities:
  - UniProtKB:P38036
  review:
    summary: CasA is the subunit that brings the trans-acting helicase-nuclease Cas3
      into contact with the target-bound Cascade complex. Bimolecular fluorescence
      complementation shows no Cascade-Cas3 interaction in the absence of invading
      DNA and a specific CasA-Cas3 proximity after protospacer recognition during
      phage infection; the ssDNA-bound crystal structure independently maps the Cas3
      footprint to the CasA four-helix bundle and base. CasA itself performs this
      step - it provides the docking surface - which is what GO:0030674 describes.
    action: NEW
    reason: GOA expresses nothing about Cas3 recruitment, which is the one function
      that distinguishes CasA from the other four Cascade subunits, and recording it
      as 'protein binding' would lose it. GO:0030674 protein-macromolecule adaptor
      activity is defined as "An adaptor activity that brings together two or more
      macromolecules in contact, permitting those molecules to function in a
      coordinated way", which is exactly the step CasA carries out. Comparator check,
      as required before any NEW term - QuickGO shows the type I-F large subunit
      Cas8f/Csy1 (UniProtKB:Q02ML9) carries only two annotations, both GO:0005515,
      and no Cas8-family protein anywhere carries an adaptor or recruitment term; but
      GO:0030674 is well used in E. coli for proteins of this kind (bamE, nlpI, mipA,
      acrA, by IDA/IPI), so the absence reads as an uncurated gap rather than a
      convention that excludes nuclease-recruiting subunits. Evidence is IPI with
      Cas3 (UniProtKB:P38036) as the interacting partner, from the in vivo BiFC
      experiments, not IDA, because the recruitment itself was not reconstituted as a
      purified activity.
    supported_by:
    - reference_id: PMID:22521689
      supporting_text: The BiFC analysis reveals that Cascade does not interact with
        Cas3 in the absence of invading DNA
    - reference_id: PMID:22521689
      supporting_text: This shows that Cascade and Cas3 specifically interact during
        infection upon protospacer recognition and that Cse1 and Cas3 are in close
        proximity of each other in the Cascade-Cas3 binary effector complex.
    - reference_id: PMID:22521689
      supporting_text: The existence of these fusion proteins suggests that stand-alone
        Cas3 also directly interacts with Cascade in vivo, and that the Cse1 subunit
        may provide a docking site for such an association.
    - reference_id: PMID:25123481
      supporting_text: Negative stain reconstruction of a complex between dsDNA-bound
        Cascade and Cas3 revealed Cas3 binds Cascade between the four-helix bundle
        and the base of Cse1
