      strand must first loop around the four-helix bundle of Cse1 to gain access to
      the groove
  - reference_id: PMID:22521689
    supporting_text: Furthermore, efficient target binding requires that the target
      sequence is flanked by a Protospacer Adjacent Motif (PAM), with PAM recognition
      taking place exclusively in the targeted strand of the DNA.
