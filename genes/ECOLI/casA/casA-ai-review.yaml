proposed_new_terms:
- proposed_name: CRISPR RNA-guided surveillance complex
  proposed_definition: A ribonucleoprotein complex composed of CRISPR-associated (Cas)
    proteins assembled around a single mature CRISPR RNA (crRNA), which uses the crRNA
    as a guide to locate nucleic acid complementary to its spacer sequence. In type I
    systems the complex additionally recognises a protospacer-adjacent motif, forms an
    R-loop at the target, and recruits a trans-acting nuclease for target destruction.
    The Escherichia coli type I-E complex, Cascade, has the composition
    Cas8e(1)/Cse2(2)/Cas7(6)/Cas5(1)/Cas6e(1) with one crRNA; the type I-F equivalent
    is the Csy complex.
  proposed_parent:
    id: GO:1990904
    label: ribonucleoprotein complex
  justification: GO's entire CRISPR vocabulary is five biological-process terms
    (GO:0099048, GO:0043571, GO:0098672 and the obsolete GO:0110132 and GO:0110133),
    with no cellular-component term, so every subunit of every CRISPR surveillance
    complex can currently only be placed on the bare GO:0032991 root or on its generic
    ancestor GO:1990904. The complex is a well-defined, stoichiometrically determined,
    structurally solved entity that ComplexPortal already models (CPX-1005, Cascade
    complex), and its subunits are the direct targets of a whole family of
    phage-encoded anti-CRISPR proteins, so a specific term would make a large body of
    structural and counter-defence curation expressible.
  supported_by:
  - reference_id: PMID:25103409
    supporting_text: both assemblies consist of 11 protein subunits and a single 61-nt
      crRNA that traverses the length of the complex
  - reference_id: PMID:23079036
    supporting_text: The E. coli Cascade complex is a 405 KDa ribonucleoprotein complex
      assembled from crRNA and five functionally essential Cse proteins
suggested_questions:
- question: GO has no molecular-function term for crRNA-guided, PAM-licensed target
    recognition, so CasA's defining activity has to be recorded as generic DNA binding,
    indistinguishable from that of an unguided DNA-binding protein. Should a
    guide-RNA-dependent nucleic acid recognition term be requested, with children for
    RNA-guided DNA and RNA-guided RNA recognition?
  experts: []
- question: Is the four-cysteine metal site in CasA (C140, C143, C250, C253) occupied
    by zinc? The crystal structure reports only "a metal-ion", and UniProt annotates
    no metal-binding feature, yet GOA carries zinc ion binding by IDA from that
    structure.
  experts:
  - Ryan N Jackson
  - Blake Wiedenheft
- question: Is CasA's recruitment of Cas3 best modelled as a molecular adaptor
    activity on CasA, or should the Cascade-Cas3 effector complex be curated as its
    own assembly with CasA as part_of? No Cas8-family protein in any organism
    currently carries an adaptor or recruitment term.
  experts:
  - Edze R Westra
  - John van der Oost
suggested_experiments:
- hypothesis: The CasA Cys4 site is a structural zinc site required for L1 loop
    positioning and therefore for PAM reading.
  description: Determine the metal content of purified CasA and of intact Cascade by
    inductively coupled plasma mass spectrometry, and collect anomalous diffraction
    data at the Zn K-edge on an existing Cascade crystal form. Pair this with
    cysteine-to-serine substitutions at C140, C143, C250 and C253, assaying target
    dsDNA affinity and phage lambda resistance.
  experiment_type: metal analysis and site-directed mutagenesis
- hypothesis: Cas3 recruitment is mediated by a discrete CasA surface that is occluded
    in apo-Cascade and exposed by R-loop formation.
  description: Mutate the candidate Cas3-contacting residues mapped onto the CasA
    surface (Glu192, Glu280, Asn376, Thr383 and the loops at residues 288-294 and
    318-323) and measure, for each variant, Cascade assembly, target dsDNA affinity,
    Cas3 co-recruitment by bimolecular fluorescence complementation, in vitro Cas3
    nicking of a bound target, and phage lambda resistance. Variants that retain
    target binding but lose Cas3 recruitment would separate the adaptor function from
    the recognition function.
  experiment_type: structure-guided mutagenesis with in vivo and in vitro readouts
- hypothesis: The order of events is PAM reading by CasA, then R-loop propagation,
    then Cas3 capture.
  description: Use single-molecule FRET or magnetic-tweezer assays on negatively
    supercoiled targets with dye-labelled CasA and Cas3 to time PAM engagement,
    R-loop extension and Cas3 arrival on the same molecule, comparing wild-type CasA
    with the PAM-blind F129A variant.
  experiment_type: single-molecule kinetics
