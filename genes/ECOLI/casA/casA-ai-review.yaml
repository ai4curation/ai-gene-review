core_functions:
- description: Scans double-stranded DNA for a three-nucleotide protospacer-adjacent
    motif and, on finding one, licenses crRNA strand invasion and holds the displaced
    non-target strand, so that foreign sequence is distinguished from self sequence
    within the CRISPR array. This is the discriminating step of type I-E interference
    and is carried out by the CasA subunit within Cascade.
  molecular_function:
