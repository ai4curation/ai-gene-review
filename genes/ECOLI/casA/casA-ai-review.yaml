      action of a molecule that contributes to the structural integrity of a
      complex"). The same replacement is used for the equivalent intra-complex rows
      on casB, casC, casD and casE so that the five subunits come out consistent.
      CasA is not required for Cascade assembly, so this is a contribution to the
      integrity of the assembled complex rather than a nucleating role.
