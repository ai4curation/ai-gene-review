id: P0AG96
gene_symbol: SecE
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli (strain K12)
description: SecE is an essential integral inner-membrane subunit of the Escherichia coli SecYEG channel.
  It clamps the two halves of pore-forming SecY, makes stabilizing SecY contacts on both the cytosolic
  and periplasmic sides of the channel, and thereby contributes to the SecYEG protein transmembrane transporter
  that serves SecA/SecB post-translational export and SRP-dependent cotranslational membrane-protein insertion.
