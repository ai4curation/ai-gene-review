    summary: RecC is an obligate subunit of RecBCD, which initiates repair of double-strand breaks by
      homologous recombination.
    action: ACCEPT
    reason: 'RecBCD binds a double-strand DNA end, unwinds and resects it, and after Chi recognition (a
      RecC function) loads RecA onto the 3'' tail. RecC does part of that work: it splits the duplex,
