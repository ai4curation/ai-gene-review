id: P07648
gene_symbol: recC
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: RecC (exonuclease V gamma chain) is the largest subunit of the RecBCD helicase-nuclease,
  the enzyme that processes double-strand DNA ends in Escherichia coli. RecC has helicase-like folds but
  no ATPase motor or nuclease active site; it forms the structural core that binds the DNA end, splits
  the duplex and channels the 3' strand through a tunnel towards RecB, stimulates RecB helicase processivity,
  and recognises the Chi sequence (5'-GCTGGTGG-3') in that strand. Chi recognition by RecC attenuates
  the RecB nuclease and switches the enzyme to producing a 3' single-stranded tail onto which RecA is
  loaded, initiating double-strand break repair and conjugational recombination by homologous recombination.
  RecBCD without Chi degrades linear DNA, which protects the cell against phage and foreign DNA.
