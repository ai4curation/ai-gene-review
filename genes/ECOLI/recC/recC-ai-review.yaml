core_functions:
- description: 'Non-motor scaffold and DNA-engagement subunit of RecBCD: binds and splits the double-strand
    DNA end, channels the 3'' strand through its tunnel, stimulates RecB helicase processivity and recognises
    Chi, thereby contributing to exonuclease V activity and to the switch from DNA degradation to RecA
    loading.'
  molecular_function:
    id: GO:0045027
    label: DNA end binding
  contributes_to_molecular_function:
    id: GO:0008854
    label: exodeoxyribonuclease V activity
  directly_involved_in:
  - id: GO:0000724
    label: double-strand break repair via homologous recombination
  - id: GO:0044355
    label: clearance of foreign intracellular DNA
  in_complex:
    id: GO:0009338
    label: exodeoxyribonuclease V complex
  supported_by:
  - reference_id: PMID:15538360
    supporting_text: In this initiation complex, the DNA duplex has been split across the RecC subunit
      to create a fork with the separated strands each heading towards different helicase motor subunits
  - reference_id: PMID:16126227
    supporting_text: These data suggest that both RecBC and RecBCD helicases can destabilize or "melt
      out" six base-pairs upon binding to a blunt DNA duplex end in the absence of ATP
  - reference_id: PMID:1618858
    supporting_text: The RecB, RecC, and RecD subunits can associate in vitro to give nuclease, helicase,
      ATPase, and Chi-specific endonuclease activities which are indistinguishable from those of the RecBCD
      holoenzyme
  - reference_id: PMID:19052323
    supporting_text: It also degrades linear double-stranded DNA, protecting the bacteria from phages
      and extraneous chromosomal DNA
suggested_questions:
- question: Should Chi recognition by RecC be represented by a GO molecular function (sequence-specific
    single-stranded DNA binding of a regulatory recombination signal), given that it is lineage-specific
    and absent from Pseudomonas RecBCD?
- question: Should the RecC UniRule and InterPro2GO mappings carry exodeoxyribonuclease V and helicase
    terms with contributes_to rather than enables, and drop ATP binding?
suggested_experiments:
- description: Measure Chi-containing versus non-Chi single-stranded DNA binding by isolated RecC and
    by RecBC carrying RecC tunnel mutations (e.g. L64A) to separate RecC's own sequence recognition from
    holoenzyme translocation.
  experiment_type: biochemical binding assay
