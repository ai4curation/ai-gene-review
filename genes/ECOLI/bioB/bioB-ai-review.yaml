- term:
    id: GO:0051537
    label: 2 iron, 2 sulfur cluster binding
  evidence_type: IDA
  original_reference_id: PMID:14967041
  qualifier: enables
  review:
    summary: Cosper et al. 2004 used UV-visible, resonance Raman and Mossbauer spectroscopy
      to show a [2Fe-2S] cluster site with partial non-cysteinyl ligation in E. coli BioB,
      present in vivo.
    action: ACCEPT
    reason: >-
      Core cofactor binding. The [2Fe-2S] cluster is the immediate sulfur donor: it
      is destroyed during a single turnover while the [4Fe-4S] cluster survives
      (PMID:11444982, PMID:12873140), and it lies next to dethiobiotin in the crystal
      structure (PMID:14704425). Without it there is no sulfur insertion, so it is
      part of the core catalytic function, not a peripheral feature.
    supported_by:
    - reference_id: PMID:14967041
      supporting_text: One site accommodates a [2Fe-2S](2+) cluster with partial noncysteinyl
        ligation
    - reference_id: PMID:11444982
      supporting_text: during catalysis the [4Fe-4S](2+) cluster is preserved while
        the [2Fe-2S](2+) cluster is destroyed
    - reference_id: PMID:12873140
      supporting_text: the (2Fe-2S)(2+) is the sulfur source for biotin
