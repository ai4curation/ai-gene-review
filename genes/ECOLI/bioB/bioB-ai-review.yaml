id: P12996
gene_symbol: bioB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  BioB is biotin synthase (EC 2.8.1.6), the radical S-adenosyl-L-methionine (SAM)
  enzyme that catalyses the last step of biotin biosynthesis: insertion of a sulfur
  atom between the C6 and C9 carbons of dethiobiotin to close the thiophane ring of
  biotin. It is a soluble homodimer of 346-residue subunits, each carrying two
  iron-sulfur clusters. A radical SAM [4Fe-4S] cluster (Cys53, Cys57, Cys60) binds
  SAM at its unique iron and, after one-electron reduction by the flavodoxin system,
  cleaves it to methionine and a 5'-deoxyadenosyl radical; two such radicals are used
  per biotin, abstracting hydrogen atoms first from C9 and then from C6. An auxiliary
  [2Fe-2S] cluster (Cys97, Cys128, Cys188, Arg260), buried next to the dethiobiotin
  site, supplies the sulfur atom and is destroyed in the reaction, passing through a
  9-mercaptodethiobiotin intermediate. In vitro the enzyme therefore makes less than
  one biotin per polypeptide, but in cells it is catalytic, relying on the ISC
  iron-sulfur assembly machinery (the HscA chaperone and IscU scaffold) to rebuild
  the [2Fe-2S] cluster, and on the Pfs nucleosidase to clear the inhibitory
  5'-deoxyadenosine product. Turnover also exposes the protein to proteolytic
  destruction.
