  review:
    summary: PAINT IBA for biotin synthase activity from the biotin synthase node PTN000540961,
      with E. coli BioB itself, yeast BIO2, S. pombe bio2 and M. tuberculosis BioB among
      the experimental descendants.
    action: ACCEPT
    reason: >-
      Biotin synthase activity is the defining function of the BioB family. E. coli
      BioB sits inside the clade, keeps the CxxxCxxC radical SAM motif and all three
      cysteines plus Arg260 of the [2Fe-2S] site, and has its own direct biochemical
      evidence (PMID:8142361, PMID:17014080). Its appearance among the IBA sources
      reflects that experimental grounding.
    supported_by:
