- term:
    id: GO:1904047
    label: S-adenosyl-L-methionine binding
  evidence_type: IDA
  original_reference_id: PMID:14704425
  qualifier: enables
  review:
    summary: The E. coli BioB crystal structure was solved with SAM bound, coordinated to
      the unique iron of the radical SAM cluster; spectroscopy shows the same SAM-cluster
      interaction in solution.
    action: NEW
    reason: >-
      GOA has no SAM-binding row for BioB, although the RADICAL_SAM project treats
      GO:1904047 as a core cosubstrate-binding function of every active radical SAM
      enzyme. This is a molecular function, not a process, so the participation test
      is met directly: BioB itself binds SAM and cleaves it (two equivalents per
      biotin). Direct evidence: the co-crystal structure with SAM (PMID:14704425) and
      Mossbauer evidence for SAM bound at the unique cluster iron (PMID:14967041).
      Comparator check: the reviewed lipoyl synthases (human LIAS, E. coli LipA) and
      other radical SAM members in this project carry this term.
    supported_by:
    - reference_id: PMID:14704425
      supporting_text: The crystal structure of biotin synthase from Escherichia coli
        in complex with S-adenosyl-L-methionine and dethiobiotin has been determined
        to 3.4 angstrom resolution.
    - reference_id: PMID:14967041
      supporting_text: binds S-adenosylmethionine (SAM) at a unique Fe site of the [4Fe-4S](2+)
        cluster
