- term:
    id: GO:0043571
    label: maintenance of CRISPR repeat elements
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR021124
  review:
    summary: Electronic transfer from InterPro IPR021124 (CRISPR-associated protein,
      Cas5). GO:0043571 is defined broadly enough to include crRNA biogenesis -
      "transcription of the CRISPR repeat arrays into RNA and processing" - and CasD
      does bind and stabilise the mature 5' handle, with crRNA levels falling when
      casD is disrupted. But the pre-crRNA cleavage step itself is performed by CasE
      alone, which was established by reconstituting Cascade subunit by subunit in a
      host lacking cas genes.
    action: KEEP_AS_NON_CORE
    reason: Not wrong, and within family convention - a QuickGO query for non-IEA
      annotations to GO:0043571 returns 14 rows which include UniProtKB:D4GQN7 cas5
      by IMP, so Cas5-family proteins do carry this term experimentally and the IEA is
      not an out-of-family mis-mapping. It is nonetheless not CasD's core role. The
      original crRNA loss seen in a casD knockout was explicitly flagged as confounded
      by the overlap of casD and casE, and reconstitution in a cas-free host showed
      mature crRNA was lost only when casE was omitted; UniProt accordingly records
      the casD phenotype as decreased crRNA rather than failure of cleavage. CasD's
      core job is interference - capping the guide and building the tail of Cascade -
      so the array-maintenance term is retained as non-core rather than accepted as
      core or removed. For the same reason GO:0043571 is proposed as a NEW annotation
      for casE, which performs the cleavage, but not for casD.
    supported_by:
