id: Q46898
gene_symbol: casD
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli (strain K12)
description: CasD (also called Cas5e) is the single Cas5 subunit of Cascade, the
  405-kDa CRISPR RNA-guided surveillance complex of the Escherichia coli K-12 type
  I-E CRISPR-Cas system, and it caps the 5' end of the guide at the tail of the
  complex. Its fold is a right-handed fist built on a modified RNA recognition
  motif, with a 50-residue insertion forming a thumb that arches over the top. CasD
  recognises the repeat-derived 8-nucleotide 5' handle of the mature crRNA
  sequence-specifically, threading the last seven nucleotides along the arch of its
  thumb into base-specific pockets on a glycine-rich helix, and flipping the
  terminal base out of the helical display in the same way a CasC thumb does. Three
  structural consequences follow. Cas7 oligomerisation stops at the 5' end of the
  guide rather than running off it, the finger domain of the adjacent CasC subunit
  is rotated to open a channel wide enough for duplex DNA, and the arch creates a
  pore that the CasA L1 helix plugs into, so CasD is the platform on which CasA is
  recruited to the tail. CasD thumb residues also make van der Waals contacts with
  the first, PAM-proximal segment of the crRNA-DNA hybrid, the seed region where
  complementarity matters most. CasD is required for resistance to bacteriophage
  lambda and for plasmid silencing, and its loss lowers mature crRNA levels, but it
  is not the subunit that cleaves pre-crRNA.
