proposed_new_terms:
- proposed_name: CRISPR RNA-guided surveillance complex
  proposed_definition: A ribonucleoprotein complex composed of CRISPR-associated (Cas)
    proteins assembled around a single mature CRISPR RNA (crRNA), which uses the crRNA
    as a guide to locate nucleic acid complementary to its spacer sequence. In type I
    systems the complex additionally recognises a protospacer-adjacent motif, forms an
    R-loop at the target, and recruits a trans-acting nuclease for target destruction.
    The Escherichia coli type I-E complex, Cascade, has the composition
    Cas8e(1)/Cse2(2)/Cas7(6)/Cas5(1)/Cas6e(1) with one crRNA; the type I-F equivalent
    is the Csy complex.
  proposed_parent:
    id: GO:1990904
    label: ribonucleoprotein complex
  justification: GO's entire CRISPR vocabulary is five biological-process terms
    (GO:0099048, GO:0043571, GO:0098672 and the obsolete GO:0110132 and GO:0110133),
    with no cellular-component term, so every subunit of every CRISPR surveillance
    complex can currently only be placed on the bare GO:0032991 root or on its generic
    ancestor GO:1990904. The complex is a well-defined, stoichiometrically determined,
    structurally solved entity that ComplexPortal already models (CPX-1005, Cascade
    complex), and its subunits are the direct targets of a whole family of
    phage-encoded anti-CRISPR proteins, so a specific term would make a large body of
    structural and counter-defence curation expressible.
  supported_by:
  - reference_id: PMID:25103409
    supporting_text: both assemblies consist of 11 protein subunits and a single 61-nt
      crRNA that traverses the length of the complex
  - reference_id: PMID:23079036
    supporting_text: The E. coli Cascade complex is a 405 KDa ribonucleoprotein complex
      assembled from crRNA and five functionally essential Cse proteins
suggested_questions:
- question: GO has no molecular-function term for crRNA-guided target recognition, so
    the subunit that anchors the guide and stabilises the seed segment of the hybrid
    can only carry generic RNA binding and DNA/RNA hybrid binding terms. Should a
    guide-RNA-dependent nucleic acid recognition term be requested?
  experts: []
- question: Is GO:0043571 maintenance of CRISPR repeat elements the right process term
    for a Cas5 protein that binds the mature 5' handle but does not cleave the array?
    Its definition stretches from spacer acquisition to array transcription and
    processing, and it is applied to Cas1, Cas2, Cas3, Cas5, Cas6, Cas7 and Cas9 alike,
    which makes it hard to use as a statement about any one subunit.
  experts: []
- question: Why do mature crRNA levels fall when casD is disrupted, given that CasE
    alone is sufficient for cleavage? Is CasD required to release or stabilise the
    cleaved product, or is the effect a consequence of the casD-casE gene overlap?
  experts:
  - Stan J J Brouns
  - John van der Oost
suggested_experiments:
- hypothesis: CasD stabilises mature crRNA after cleavage rather than contributing to
    cleavage itself.
  description: Express pre-crRNA with defined subsets of Cascade subunits in a
    cas-free host and measure, in parallel, cleavage of pre-crRNA (northern blot for
    precursor and product) and the half-life of the mature product by pulse-chase, for
    CasE alone, CasCE, CasCDE and full Cascade. Separating a cleavage defect from a
    stability defect would settle why casD disruption lowers crRNA.
  experiment_type: reconstitution and RNA stability measurement
- hypothesis: The CasD base-specific pockets for the 5'-handle nucleotides enforce
    loading of repeat-derived guides only.
  description: Substitute the residues lining the -8A, -7U and -6A pockets on the
    glycine-rich helix, and the thumb residue Arg108 that hydrogen-bonds C7, and test
    whether the resulting complexes can be loaded with a chimeric guide carrying a
    non-cognate 5' handle; read out complex assembly, target dsDNA affinity, and phage
    lambda resistance.
  experiment_type: structure-guided mutagenesis and guide-swap assay
- hypothesis: CasD thumb contacts with the seed segment set the fidelity threshold for
    target discrimination.
  description: Mutate CasD Tyr85 and Gln105 and measure dissociation constants for
    targets mismatched at individual seed positions (1 to 5) against a fully
    complementary control, together with Cas3-dependent degradation and the rate of
    primed spacer acquisition from mismatched targets.
  experiment_type: quantitative binding and interference assays
