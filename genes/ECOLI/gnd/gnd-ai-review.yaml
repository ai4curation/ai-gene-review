description: >-
  gnd encodes the 6-phosphogluconate dehydrogenase (decarboxylating; EC 1.1.1.44) of Escherichia coli.
  The cytosolic homodimeric enzyme catalyses the NADP+-dependent oxidative decarboxylation of 6-phospho-D-gluconate
  to D-ribulose 5-phosphate and CO2, the third and final step of the oxidative pentose phosphate pathway,
  producing the second NADPH of the branch. Crystal structures of the E. coli enzyme with substrate and
  NADPH show a cofactor-induced closure of the coenzyme-binding domain in one subunit of the dimer, consistent
  with an ordered, alternating-site mechanism. gnd mutants lacking 6-phosphogluconate dehydrogenase activity grow on glucose at rates
  similar to the wild type. Gnd also binds the
  stringent-response alarmone ppGpp.
