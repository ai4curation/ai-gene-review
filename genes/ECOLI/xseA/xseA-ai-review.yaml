id: P04994
gene_symbol: xseA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  xseA encodes the large subunit of exodeoxyribonuclease VII (ExoVII), a
  cytoplasmic heterooligomer of one XseA and several small XseB subunits. XseA
  carries an N-terminal OB-fold domain, a central catalytic domain whose
  residues D155, R205, H238 and D241 are required for nuclease activity, and a
  helical region that binds XseB. The XseA-XseB complex processively degrades
  single-stranded DNA in either the 5'-to-3' or 3'-to-5' direction without a
  metal cofactor, releasing oligonucleotides. ExoVII is one of several
  partially redundant single-stranded DNA exonucleases (with RecJ, Exonuclease
  I and Exonuclease X) that excise the error-containing strand in
  methyl-directed mismatch repair, and it also contributes to mutation
  avoidance at quasipalindromes and to processing of retron msDNA.
existing_annotations:
- term:
    id: GO:0003676
    label: nucleic acid binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR025824
  review:
    summary: >-
      InterPro2GO assigns generic nucleic acid binding from the XseA N-terminal
      OB-fold signature. DNA binding is a property of the XseA-XseB complex:
      XseA alone does not bind DNA.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The domain-based term is not false for the holoenzyme, which binds
      single-stranded DNA, but the direct filter-binding data show that the
      isolated large subunit does not form a complex with DNA. The substrate
      binding is already implied by the exodeoxyribonuclease VII activity row,
      so a separate generic binding claim for the subunit overstates what is
      known. This matches the decision on the PSEPK XseA ortholog.
    supported_by:
    - reference_id: PMID:22718974
      supporting_text: >-
        Surprisingly, the full-length XseA alone (without XseB) does not form a
        complex with DNA, while inactive ExoVII variants (with substitutions in
        the XseA catalytic domain, and in the presence of XseB) are able to bind
        DNA.
