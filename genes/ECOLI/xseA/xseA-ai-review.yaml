- term:
    id: GO:0006298
    label: mismatch repair
  evidence_type: IDA
  original_reference_id: PMID:10986118
  qualifier: involved_in
  review:
    summary: >-
      The cited study shows that loss of Exonucleases I and VII strongly
      stimulates hairpin-templated mutation at a thyA quasipalindrome; the
      direct case for ExoVII in mismatch repair comes from purified-system and
      genetic studies of methyl-directed repair.
    action: ACCEPT
    reason: >-
      ExoVII is one of the redundant single-strand exonucleases that excise the
      error-containing strand in methyl-directed mismatch repair. Repair in
      extracts requires at least one of RecJ, ExoI, ExoVII or ExoX, and the
      quadruple mutant phenotypes are suppressed by mutS, mutL, mutH or uvrD
      mutations. The cited paper is more about quasipalindrome mutation
      avoidance, but the process claim is sound and the curator's IDA is kept.
      Excision is the step ExoVII itself performs, so this is a core process.
    supported_by:
    - reference_id: PMID:11418610
      supporting_text: >-
        Whereas extracts of all possible single, double, and triple exonuclease
        mutants displayed significant residual mismatch repair, extracts
        deficient in RecJ, ExoI, ExoVII, and ExoX exonucleases were devoid of
        normal repair activity.
    - reference_id: PMID:11381137
      supporting_text: >-
        These observations confirm involvement of the four exonucleases in
        methyl-directed mismatch repair in vivo
    - reference_id: PMID:10986118
      supporting_text: >-
        We find that the mutational hotspot in thyA is dramatically stimulated
        by inactivation of exonucleases I and VII, which degrade single-strand
        DNA with a common 3'-5' polarity.
