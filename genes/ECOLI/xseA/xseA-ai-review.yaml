- term:
    id: GO:0008855
    label: exodeoxyribonuclease VII activity
  evidence_type: EXP
  original_reference_id: PMID:22718974
  qualifier: enables
  review:
    summary: >-
      Site-directed mutagenesis shows that XseA residues D155, R205, H238 and
      D241 are essential for ExoVII nuclease activity, which places the
      catalytic centre on the large subunit.
    action: ACCEPT
    reason: >-
      XseA is the catalytic subunit of ExoVII. The holoenzyme activity needs
      XseB as well, but the active-site residues belong to XseA, so enables is
      appropriate for this subunit. This is the defining molecular function of
      the gene.
    supported_by:
    - reference_id: PMID:22718974
      supporting_text: >-
        We demonstrated that residues D155, R205, H238 and D241 are essential
        for the nuclease activity of E.
    - reference_id: PMID:22718974
      supporting_text: >-
        The in vitro activity assay revealed that ExoVII variants: D155A, R205A,
        H238A, D241A lost nucleolytic activity (Figure 5).
