      Cascade or any other CRISPR surveillance complex; a QuickGO ontology search for
      CRISPR returns only five terms, all biological_process, so GO:1990904 is the
      most specific existing term and the missing one is proposed in
      proposed_new_terms. Applied consistently across all five Cascade subunits.
