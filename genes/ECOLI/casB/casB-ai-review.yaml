- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IDA
  original_reference_id: PMID:18703739
  qualifier: enables
  review:
    summary: The observation behind this row is that CasB co-purifies as a component
      of Cascade when any other subunit is used as bait, i.e. it is held in the
      complex by protein-protein contacts. The informative statement is CasB's
      structural contribution to the complex, not a bare binding activity.
    action: MODIFY
    reason: The term "protein binding" conveys nothing about function. CasB is present
      in two copies as a head-to-tail dimer that connects the head and tail of
      Cascade along the belly and contacts the CasC backbone, which is structural
      molecule activity (GO:0005198, "The action of a molecule that contributes to
      the structural integrity of a complex"). There is no GO child of GO:0005198 for
      a non-ribosomal ribonucleoprotein, so the parent is the correct level. The same
      replacement is applied to the equivalent intra-complex rows on casA, casC, casD
      and casE so that the five subunits of one complex are treated consistently.
    proposed_replacement_terms:
    - id: GO:0005198
      label: structural molecule activity
    supported_by:
    - reference_id: PMID:18703739
      supporting_text: The complex, denoted Cascade (CRISPR-associated complex for
        antiviral defense), could be isolated from E. coli lysates using any of the
        tagged subunits of the complex as bait, except for CasA.
    - reference_id: PMID:25103409
      supporting_text: The head and tail of the complex are connected along the belly
        by two Cse2 subunits and by a helical backbone of six Cas7 proteins
