id: P76632
gene_symbol: casB
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: CasB (also called Cse2) is a small, all-helical subunit of Cascade, the
  405-kDa CRISPR RNA-guided surveillance complex of the Escherichia coli K-12 type
  I-E CRISPR-Cas system. Two copies of CasB form a head-to-tail dimer that runs
  along the belly of the complex, contacting the thumb and web surfaces of the CasC
  (Cas7) backbone and connecting the CasE-capped head to the CasA tail. CasB is a
  non-sequence-specific nucleic acid binding protein that engages both duplex DNA
  and single-stranded RNA through a conserved basic surface patch, with a preference
  for duplex nucleic acid. Within the complex this surface serves target
  interrogation and R-loop stabilisation rather than guide binding. When crRNA
  invades a protospacer, CasB residues stack with and hydrogen-bond to individual
  nucleotides of the displaced non-target strand, and the CasB dimer forms one wall
  of the basic groove that accommodates that strand; target binding also repositions
  the CasB subunits, which unblocks the distal end of the guide for base pairing.
  CasB is required for resistance to bacteriophage lambda and for plasmid silencing,
  but not for maturation of the crRNA guide.
