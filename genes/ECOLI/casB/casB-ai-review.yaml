  review:
    summary: CasB is a subunit of Cascade, which was defined by affinity purification
      of individually tagged Cas proteins from Escherichia coli K-12 lysates. Cascade
      carries a mature crRNA as an integral component, so it is a ribonucleoprotein
      complex.
    action: MODIFY
    reason: GO:0032991 is the root of the complex branch and conveys almost nothing.
      Cascade co-purifies with its guide RNA and is explicitly a ribonucleoprotein of
      defined composition, so GO:1990904 ribonucleoprotein complex is both more
