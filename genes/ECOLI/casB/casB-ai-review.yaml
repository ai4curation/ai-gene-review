proposed_new_terms:
- proposed_name: CRISPR RNA-guided surveillance complex
  proposed_definition: A ribonucleoprotein complex composed of CRISPR-associated (Cas)
    proteins assembled around a single mature CRISPR RNA (crRNA), which uses the crRNA
    as a guide to locate nucleic acid complementary to its spacer sequence. In type I
    systems the complex additionally recognises a protospacer-adjacent motif, forms an
    R-loop at the target, and recruits a trans-acting nuclease for target destruction.
    The Escherichia coli type I-E complex, Cascade, has the composition
    Cas8e(1)/Cse2(2)/Cas7(6)/Cas5(1)/Cas6e(1) with one crRNA; the type I-F equivalent
    is the Csy complex.
  proposed_parent:
    id: GO:1990904
    label: ribonucleoprotein complex
  justification: GO's entire CRISPR vocabulary is five biological-process terms
    (GO:0099048, GO:0043571, GO:0098672 and the obsolete GO:0110132 and GO:0110133),
    with no cellular-component term, so every subunit of every CRISPR surveillance
    complex can currently only be placed on the bare GO:0032991 root or on its generic
    ancestor GO:1990904. The complex is a well-defined, stoichiometrically determined,
    structurally solved entity that ComplexPortal already models (CPX-1005, Cascade
    complex), and its subunits are the direct targets of a whole family of
    phage-encoded anti-CRISPR proteins, so a specific term would make a large body of
    structural and counter-defence curation expressible.
  supported_by:
  - reference_id: PMID:25103409
    supporting_text: both assemblies consist of 11 protein subunits and a single 61-nt
      crRNA that traverses the length of the complex
  - reference_id: PMID:23079036
    supporting_text: The E. coli Cascade complex is a 405 KDa ribonucleoprotein complex
      assembled from crRNA and five functionally essential Cse proteins
suggested_questions:
- question: CasB's specific contribution is stabilisation of the displaced strand of
    an R-loop, for which GO has no term - neither a molecular function for
    crRNA-guided target recognition nor a process term for R-loop formation by a
    guide-RNA effector. Should such terms be requested, and if so should R-loop
    stabilisation be a function of the subunit or only of the complex?
  experts: []
- question: The crystal structure states that CasB makes no direct contact with the
    crRNA, whereas the UniProt SUBUNIT annotation for P76632, based on earlier
    biochemistry, records a direct crRNA interaction. Is the apparent crRNA contact an
    artefact of crosslinking or subcomplex assays, or is it a state not captured in
    the crystal?
  experts:
  - Ryan N Jackson
  - Blake Wiedenheft
  - Ailong Ke
- question: CasB over-accumulates mature crRNA when deleted. Does CasB contribute to
    crRNA turnover or to release of mature crRNA from the processing subcomplex, or is
    the effect purely a consequence of failing to assemble functional Cascade?
  experts:
  - Stan J J Brouns
  - John van der Oost
suggested_experiments:
- hypothesis: The conserved basic patch of CasB is required specifically for R-loop
    stabilisation, not for Cascade assembly.
  description: Introduce the E. coli equivalents of the CasB basic-patch alanine
    substitutions characterised in Thermobifida fusca (the Arg/Lys clusters
    corresponding to R45/R46, R130/K131/R132 and R148/R150) into P76632, then measure
    for each variant Cascade assembly and stoichiometry by size exclusion
    chromatography, affinity for a PAM-flanked dsDNA target, R-loop formation on a
    negatively supercoiled plasmid, Cas3-dependent degradation, and phage lambda
    resistance.
  experiment_type: structure-guided mutagenesis with assembly, binding and in vivo
    readouts
- hypothesis: CasB repositioning on target binding is the step that unblocks the
    PAM-distal end of the guide.
  description: Use single-molecule FRET with dyes on the two CasB subunits and on the
    PAM-distal end of the crRNA to follow the conformational change during R-loop
    propagation on targets with mismatches placed at increasing distance from the PAM,
    testing whether CasB motion precedes or follows distal base pairing.
  experiment_type: single-molecule FRET
- hypothesis: CasB contacts the displaced strand in vivo and protects it from
    cellular single-strand nucleases.
  description: Perform in vivo crosslinking of tagged CasB followed by sequencing of
    the crosslinked DNA to map the displaced-strand footprint at a chromosomal
    protospacer, comparing wild-type CasB with basic-patch variants and comparing
    strains with and without Cas3.
  experiment_type: in vivo crosslinking and sequencing
