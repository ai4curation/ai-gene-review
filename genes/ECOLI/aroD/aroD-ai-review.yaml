taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  AroD is the type I 3-dehydroquinate dehydratase (3-dehydroquinase, EC 4.2.1.10) of
  Escherichia coli, the only 3-dehydroquinase of this organism. It catalyses the third step
  of the shikimate (chorismate) pathway, the reversible dehydration of 3-dehydroquinate to
  3-dehydroshikimate, which introduces the first double bond of the future aromatic ring.
  Catalysis proceeds by a syn elimination through a covalent Schiff base (imine) formed
  between the substrate keto group and Lys-170, with His-143 acting as the general base and
  also assisting Schiff base formation and hydrolysis; the K170A and H143A mutants lose about
  10^6-fold activity while still binding ligand. The enzyme is a soluble cytosolic homodimer
  of 27.5 kDa subunits with a TIM-barrel (class I aldolase) fold, Km for 3-dehydroquinate of
  about 17-18 uM and kcat of about 140 s-1. Through chorismate it supplies the precursor of
  the aromatic amino acids, folate, ubiquinone, menaquinone and the enterobactin siderophore.
