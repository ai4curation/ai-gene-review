- term:
    id: GO:0046279
    label: 3,4-dihydroxybenzoate biosynthetic process
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000472499
  - UniProtKB:P05194
  - UniProtKB:P58687
  review:
    summary: PAINT IBA from PTN000472499 asserting 3,4-dihydroxybenzoate (protocatechuate)
      biosynthesis, with E. coli AroD (P05194) and Salmonella Typhimurium AroD (P58687) in
      the WITH/FROM.
    action: MARK_AS_OVER_ANNOTATED
    reason: The term means formation of 3,4-dihydroxybenzoate. DHQase makes
      3-dehydroshikimate, which becomes protocatechuate only through a separate
      3-dehydroshikimate dehydratase (EC 4.2.1.118, AroZ/QuiC/AsbF); E. coli K-12 encodes
      none, so in this organism AroD's product goes to chorismate, not protocatechuate. The
      seed annotations measured 3-dehydroquinate dehydration, not 3,4-dihydroxybenzoate
      formation. The term is defensible only for type I DHQases in organisms with an AroZ
      route, so propagating it across the clade over-annotates. Kept consistent with the
      IDA and IEA rows on the same term.
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - LINEAGE_OR_TAXON_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN000472499
        source_status: SOURCE_WEAK_OR_INFERRED
        comment: The IBD on GO:0046279 is seeded by experimental rows on E. coli AroD
          (P05194) and Salmonella Typhimurium AroD (P58687); the E. coli papers measured
          3-dehydroquinate dehydration only (the Salmonella source was not inspected), and
          protocatechuate formation needs a 3-dehydroshikimate dehydratase that E. coli
          K-12 lacks.
    supported_by:
    - reference_id: file:ECOLI/aroD/aroD-notes.md
      supporting_text: returned no entries, i.e. no E. coli K-12 protein carries EC 4.2.1.118
    - reference_id: file:ECOLI/aroD/aroD-notes.md
      supporting_text: E. coli K-12 therefore has no known route from 3-dehydroshikimate to
        protocatechuate
