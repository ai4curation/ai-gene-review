  - statement: Purified IlvE transaminates L-isoleucine, L-leucine and L-valine with 2-oxoglutarate, and
      phenylalanine and tyrosine only weakly.
    supporting_text: Purified transaminase B catalyzed transamination between alpha-ketoglutarate and
      l-isoleucine, l-leucine, l-valine, and, to a lesser extent, l-phenylalanine and l-tyrosine
  - statement: IlvE is a hexamer of identical subunits.
    supporting_text: was confirmed to be that of a hexamer with a molecular weight of about 182,000 and
      apparently identical subunits
  - statement: There is no separate valine transaminase in E. coli.
    supporting_text: These observations argue against the existence of a separate valine-alpha-ketoglutarate
      transaminase.
  - statement: The purified enzyme has no aspartate transaminase activity.
    supporting_text: The enzyme was free of aspartate transaminase and of transaminase C.
