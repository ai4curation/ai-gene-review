  title: Escherichia coli mutants deficient in the aspartate and aromatic amino acid aminotransferases.
  findings:
  - statement: AspC and TyrB carry aspartate and aromatic transamination; in ilvE- strains either suffices
      for growth without aspartate.
    supporting_text: the presence of either the tyrosine-repressible aminotransferase or the aspartate
      aminotransferase is sufficient for growth in the absence of exogenous tyrosine, phenylalanine, or
      aspartate
  - statement: IlvE alone can satisfy a phenylalanine requirement.
    supporting_text: The ilvE gene product alone can reverse a phenylalanine requirement.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only; source of the IGI aspartate-biosynthesis row with aspC and tyrB. The
      abstract shows aspartate transamination resides mainly in AspC/TyrB, so the IlvE contribution is
      treated as non-core.
