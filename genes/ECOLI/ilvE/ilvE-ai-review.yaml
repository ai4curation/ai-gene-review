  review:
    summary: Genetic-interaction evidence links ilvE with aspC and tyrB, but aspartate synthesis is carried
      by AspC and TyrB.
    action: MARK_AS_OVER_ANNOTATED
    reason: The acts_upstream_of_or_within IGI comes from a study of aspC/tyrB/ilvE mutant combinations
      (abstract only; Europe PMC has no full text for PMC235221). The abstract shows that either AspC
      or TyrB alone suffices for aspartate prototrophy in an ilvE- background, and purified IlvE has no
      aspartate transaminase activity (PMID:378964). Any IlvE contribution to aspartate synthesis is therefore
      at most a minor overlap visible only in multiple-mutant backgrounds. The curator saw the full text,
      so the row is not removed, but the term over-states the role of a branched-chain aminotransferase.
    supported_by:
    - reference_id: PMID:15983
