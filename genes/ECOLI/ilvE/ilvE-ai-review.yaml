id: P0AB80
gene_symbol: ilvE
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: IlvE (transaminase B) is the branched-chain amino acid aminotransferase of Escherichia coli,
  a cytosolic, pyridoxal 5'-phosphate-dependent fold-type IV enzyme that forms a homohexamer of identical
  subunits. It reversibly transfers the amino group of glutamate to the 2-oxoacid precursors of L-isoleucine,
  L-leucine and L-valine, catalysing the final step of all three branched-chain amino acid biosynthetic
  routes, and is the only branched-chain transaminase of the organism (there is no separate valine transaminase).
  It also acts weakly on phenylalanine and tyrosine and can partially substitute for the aromatic aminotransferases.
