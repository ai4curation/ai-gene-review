suggested_questions:
- question: What is the in vivo contribution of IlvE to aspartate and phenylalanine synthesis relative
    to AspC and TyrB, and does the PAINT L-aspartate biosynthesis assertion on PTN000214714 rest only
    on the PMID:15983 genetic interaction?
