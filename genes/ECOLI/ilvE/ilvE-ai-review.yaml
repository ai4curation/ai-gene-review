- description: Measure aspartate and phenylalanine prototrophy of aspC tyrB double mutants with and without
    ilvE, and assay purified IlvE with oxaloacetate/glutamate to quantify any residual aspartate aminotransferase
    activity.
  experiment_type: genetic epistasis and enzyme kinetics
