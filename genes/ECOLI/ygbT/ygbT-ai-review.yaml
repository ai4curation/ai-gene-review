- term:
    id: GO:0006974
    label: DNA damage response
  evidence_type: IMP
  original_reference_id: PMID:21219465
  qualifier: acts_upstream_of_or_within
  review:
    summary: >-
      Based on a real phenotype: a ygbT deletion is hypersensitive to mitomycin C
      and UV, shows impaired chromosome segregation, and gives alleviating genetic
      interactions with ruvABC together with synthetic-sick interactions with recBC,
      with Cas1 relocalising to nucleoid foci after damage.
    action: KEEP_AS_NON_CORE
    reason: >-
      Kept, with the weak qualifier the curator chose. The phenotype has not been
      contradicted and I have not read the full text behind every panel, so REMOVE
      would be overruling an experimental annotation on incomplete evidence. But it
      is not a core function: no step of DNA repair has been shown to be performed by
      Cas1, and the RecBCD link was later re-read in the opposite direction, with
      RecBCD supplying the DNA fragments Cas1 captures rather than Cas1 contributing
      to repair chemistry. That makes the damage sensitivity plausibly a downstream
      consequence of a shared substrate pool - necessity rather than participation.
    supported_by:
    - reference_id: PMID:21219465
      supporting_text: Genome-wide screens show that YgbT physically and genetically
        interacts with key components of DNA repair systems, including recB, recC and
        ruvB.
      reference_section_type: ABSTRACT
    - reference_id: PMID:26284603
      supporting_text: the E. coli RecBCD helicase–nuclease complex, which processes
        DNA double-strand breaks for recombination and degrades foreign DNA, is implicated
        in the generation of viral DNA fragments captured by Cas1 and incorporated
        into the CRISPR locus as new spacers
      reference_section_type: INTRODUCTION
- term:
    id: GO:0008821
    label: crossover junction DNA endonuclease activity
  evidence_type: IDA
  original_reference_id: PMID:21219465
  qualifier: enables
  review:
    summary: >-
      A genuine direct assay, not a domain-based inference: purified Cas1 cleaves a
      static four-way junction and yields a nicked, ligatable duplex of the same
      mobility as the RuvC product. The GO definition requires only endonucleolytic
      cleavage at a Holliday junction and carries no exclusivity clause, so the term
      fits the observation.
    action: KEEP_AS_NON_CORE
    reason: >-
      Definitionally sound and experimentally direct, so it is not an over-annotation
      and not a candidate for REMOVE. It is non-core because it is the integrase
      active site acting on a surrogate branch-point substrate in vitro: Cas1
      catalyses transesterification at branch points as the reverse of integration,
      which is what a junction or flap substrate presents to it. No
      Holliday-junction resolvase role for Cas1 has been established in vivo, and
      E. coli resolves junctions with RuvABC.
    supported_by:
    - reference_id: PMID:21219465
      supporting_text: purified YgbT displayed significant activity against the HJ1
        substrate, producing a nicked duplex with electrophoretic mobility similar
        to that of the RuvC product
      reference_section_type: RESULTS
    - reference_id: PMID:26284603
      supporting_text: It is likely that the TES reaction catalyzed by Cas1 with branched
        DNA substrates in vitro represents the reverse or disintegration of an integration
        intermediate
      reference_section_type: RESULTS
- term:
    id: GO:0017108
    label: 5'-flap endonuclease activity
  evidence_type: IDA
  original_reference_id: PMID:21219465
  qualifier: enables
  review:
    summary: >-
      The observation behind this IDA is real - purified Cas1 cleaves a 5'-flap
      substrate - but the term is the wrong one for it. GO:0017108 is defined as
      "Catalysis of the cleavage of a 5' flap structure in DNA, but not other DNA
      structures; processes the 5' ends of Okazaki fragments in lagging strand DNA
      synthesis", and both halves of that definition are contradicted. The same
      figures in the same paper show cleavage of Holliday junctions, 3'-flaps,
      splayed arms and replication forks, so the exclusivity clause fails; and Cas1
      has no role in Okazaki fragment processing, which in bacteria is carried out by
      the 5'-3' exonuclease domain of DNA polymerase I.
    action: MODIFY
    reason: >-
      A term-fit problem, not a doubt about the experiment, so the fix is to
      generalize rather than to remove. GO:0004520 DNA endonuclease activity states
      what was actually measured without asserting a specificity the protein does not
      have or a replication role it does not play. The underlying activity is in any
      case the integrase active site catalysing transesterification at a branch
      point, which is what a 5'-flap substrate presents to it.
    proposed_replacement_terms:
    - id: GO:0004520
      label: DNA endonuclease activity
    supported_by:
    - reference_id: PMID:21219465
      supporting_text: Analysis of the cleavage products by denaturing PAGE revealed
        that YgbT introduced a limited number of cuts into the replication fork and
        5′-flap structures, but produced multiple cleavage products with the HJ3, 3′-flap,
        and splayed arm substrates
      reference_section_type: RESULTS
    - reference_id: PMID:21219465
      supporting_text: YgbT cleaves in vitro a broad range of branched DNA substrates
        (asymmetrical Holliday junction, replication fork, 5′-flap, 3′-flap and splayed
        arm substrates)
      reference_section_type: DISCUSSION
    - reference_id: PMID:26284603
      supporting_text: Efficient TES of branched DNA substrates with a 5′-flap or duplex
        arm is clearly possible for both S. solfataricus and E. coli Cas1 in vitro.
      reference_section_type: DISCUSSION
