core_functions:
- description: >-
    Metal-dependent DNA strand-transfer (integrase) activity carried out as the
    catalytic subunit of the Cas1(4)-Cas2(2) adaptation complex: Cas1 cleaves the
    phosphodiester backbone at the leader-proximal CRISPR repeat and, in the same
    concerted transesterification chemistry, joins the 3'-hydroxyl ends of a captured
    protospacer to the resulting repeat 5'-ends, producing the staggered nicked
    intermediate that host replication converts into a new spacer plus a duplicated
    repeat. The reaction requires a divalent cation and an active site built from
    E141, H208 and D221, and runs in reverse as a disintegration reaction in vitro.
  molecular_function:
    id: GO:0004520
    label: DNA endonuclease activity
  directly_involved_in:
  - id: GO:0043571
    label: maintenance of CRISPR repeat elements
  - id: GO:0099048
    label: CRISPR-cas system
  locations:
  - id: GO:0005737
    label: cytoplasm
  supported_by:
  - reference_id: PMID:25707795
    supporting_text: Cas1 is the catalytic subunit and Cas2 substantially increases
      integration activity.
    reference_section_type: ABSTRACT
  - reference_id: PMID:25707795
    supporting_text: Here we show that the purified Cas1-Cas2 complex integrates oligonucleotide
      DNA substrates into acceptor DNA to yield products similar to those generated
      by retroviral integrases and transposases.
    reference_section_type: ABSTRACT
  - reference_id: PMID:25707795
    supporting_text: Consistent with these data, Cas1 active site mutants H208A and
      D221A were defective for protospacer integration in vitro, whereas the Cas2 E9Q
      active-site mutant supported integration
    reference_section_type: RESULTS
  - reference_id: PMID:24920831
    supporting_text: the non-template strand is nicked at the leader-repeat junction
      with subsequent joining of the resulting 5′-end of the first repeat with the 3′-end
      of the incoming spacer
    reference_section_type: RESULTS
  - reference_id: PMID:26284603
    supporting_text: the 3′-end of one strand of the incoming DNA is joined to the end
      of the CRISPR repeat in a trans-esterification (TES) reaction
    reference_section_type: INTRODUCTION
proposed_new_terms:
- proposed_name: protospacer integrase activity
  proposed_definition: >-
    Catalysis of the integration of a double-stranded protospacer DNA fragment into a
    CRISPR array, by concerted transesterification in which the 3'-hydroxyl ends of the
    protospacer attack phosphodiester bonds at the boundaries of a CRISPR repeat,
    cleaving the target strands and covalently joining the protospacer ends to the
    resulting repeat 5'-phosphates. Requires a divalent metal cation.
  justification: >-
    GO has no molecular-function term for the strand-transfer chemistry that Cas1
    performs. GO:0004520 DNA endonuclease activity, the term currently used, captures
    only the cleavage half of a concerted cleave-and-join reaction, and joining is what
    distinguishes integration from degradation and is what the in vitro assays actually
    measure. The nearest existing alternative, GO:0008907 integrase activity, is scoped
    to phage and retroviral integrases, and Cas1 is explicitly not a member of that
    superfamily - it lacks the RNase H fold - so it would be a wrong-family assertion
    rather than a parent. A dedicated term would also give the disintegration activity,
    the active-site mutant phenotypes and the Cas1-Cas2 molecular-ruler behaviour a
    single function to attach to. Until such a term exists, GO:0004520 is retained in
    core_functions as a true but partial statement rather than leaving the slot empty.
  supported_by:
  - reference_id: PMID:25707795
    supporting_text: Here we show that the purified Cas1-Cas2 complex integrates oligonucleotide
      DNA substrates into acceptor DNA to yield products similar to those generated
      by retroviral integrases and transposases.
    reference_section_type: ABSTRACT
  - reference_id: PMID:25707795
    supporting_text: CRISPR spacer integration shares mechanistic similarities with
      retroviral integration and DNA transposition
    reference_section_type: DISCUSSION
  - reference_id: PMID:26284603
    supporting_text: Many integrases process the ends of the integrated DNA using a
      nuclease activity, which occurs at the same active site as the integrase activity
    reference_section_type: DISCUSSION
  - reference_id: PMID:26284603
    supporting_text: the 3′-end of one strand of the incoming DNA is joined to the end
      of the CRISPR repeat in a trans-esterification (TES) reaction
    reference_section_type: INTRODUCTION
suggested_questions:
- question: >-
    GO:0017108 5'-flap endonuclease activity is defined as cleaving a 5' flap "but not
    other DNA structures" and as processing Okazaki fragments. The IDA on Cas1 comes
    from a paper that in the same figures shows cleavage of Holliday junctions,
    3'-flaps, splayed arms and replication forks. Should the term's exclusivity clause
    be treated as binding on annotation, and if so are there other promiscuous
    branch-DNA nucleases carrying it that need the same treatment?
  experts:
  - GO molecular function curators
  - EcoCyc
- question: >-
    Is the DNA-damage-sensitivity phenotype of a ygbT deletion a consequence of Cas1
    participating in repair, or of CRISPR adaptation and RecBCD-dependent repair
    competing for the same pool of DNA fragments? The distinction decides whether
    GO:0006974 should be retained at all, and it has been open since 2011.
  experts:
  - DNA repair / recombination community
- question: >-
    Does Cas1 retain any catalytic role outside adaptation in organisms whose Cas1 is
    fused to a reverse transcriptase or to a transposase, and would a protospacer
    integrase activity term need to be defined broadly enough to cover those?
  experts:
  - CRISPR evolution community
suggested_experiments:
- hypothesis: >-
    The branched-DNA cleavage activities annotated as GO:0008821 and GO:0017108 are the
    integrase active site running in reverse, not separate resolvase or flap-endonuclease
    functions.
  description: >-
    Assay purified Cas1 side by side on a static Holliday junction, a 5'-flap and a
    half-site integration intermediate, with and without a free 3'-hydroxyl at the
    branch point, and compare the active-site mutant series (E141A, H208A, D221A) across
    all three. If every activity requires the same residues and a 3'-OH nucleophile at
    the branch point, the three GO terms describe one activity and should be consolidated.
  experiment_type: biochemical
- hypothesis: >-
    Cas1's DNA-damage phenotype requires an intact CRISPR array because adaptation, not
    repair, is the activity involved.
  description: >-
    Measure mitomycin C and UV sensitivity of a ygbT deletion complemented with
    wild-type Cas1 versus the D221A active-site variant, in strains with and without
    CRISPR arrays and with and without cas2. If the phenotype tracks adaptation
    competence rather than Cas1 protein presence, GO:0006974 is a downstream consequence
    rather than a process Cas1 acts in.
  experiment_type: genetic
- hypothesis: >-
    Spacer length is set by the Cas1-Cas2 assembly acting as a ruler rather than by
    Cas1's catalytic preferences.
  description: >-
    Reconstitute integration with Cas1 paired against Cas2 variants engineered to
    lengthen or shorten the bridging surface, and sequence the resulting integration
    products to see whether the 33 bp spacer size shifts predictably with the dimension
    of the Cas2 bridge.
  experiment_type: biochemical
