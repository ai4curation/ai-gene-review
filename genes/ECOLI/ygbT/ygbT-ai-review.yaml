- term:
    id: GO:0004520
    label: DNA endonuclease activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR019851
  review:
    summary: >-
      The closest existing molecular-function term to what Cas1 actually does.
      Integration proceeds by Cas1-catalysed cleavage of the phosphodiester backbone
      at the leader-repeat junction concerted with joining of the protospacer
      3'-hydroxyl ends, and active-site substitutions abolish both the in vitro
      reaction and in vivo spacer acquisition.
    action: ACCEPT
    reason: >-
      Correct and well grounded experimentally, despite arriving by an electronic
      route. It captures the cleavage half of the chemistry; the joining half has no
      GO term, which is raised separately in proposed_new_terms rather than being
      forced into an ill-fitting id.
    supported_by:
    - reference_id: PMID:25707795
      supporting_text: Bacteria expressing Cas1 active-site mutants, but not active-site
        mutants of Cas2, are incapable of acquiring new spacers in vivo, demonstrating
        the catalytic role of Cas1 during spacer acquisition
      reference_section_type: INTRODUCTION
    - reference_id: PMID:22402487
      supporting_text: no expansion of the array was detected when pCas1+2 was mutated
        to encode Cas1D221A
      reference_section_type: RESULTS
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:21219465
  qualifier: enables
  supporting_entities:
  - UniProtKB:P07648
  - UniProtKB:P08394
  - UniProtKB:P0A812
  - UniProtKB:Q46897
  - UniProtKB:Q46899
  review:
    summary: >-
      Co-purification of SPA-tagged Cas1 with RecB, RecC, RuvB and two other Cas
      proteins, validated by reciprocal pull-downs in the same study. The
      interactions are real but the row collapses five mechanistically unrelated
      partners into the least informative molecular-function term in GO.
    action: REMOVE
    reason: >-
      Removed because the row carries no functional information, not because the
      interactions are false - the pull-downs were reciprocally validated and are
      not in dispute. No single informative molecular function covers a
      nuclease-helicase, a branch-migration motor and two Cascade subunits at once,
      so MODIFY has no honest target: the recombination contacts have never been
      assigned a mechanism, and the Cascade contacts describe regulation of Cas1
      rather than an activity of it. The biologically meaningful content is retained
      where it belongs - the recombination link in the GO:0006974 row, the Cascade
      link in the gene notes - and the interactions themselves remain recorded in
      IntAct and EcoCyc.
    supported_by:
    - reference_id: PMID:21219465
      supporting_text: YgbT physically interacts with several key repair proteins including
        RecB, RecC and RuvB
      reference_section_type: ABSTRACT
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:24561554
  qualifier: enables
  supporting_entities:
  - UniProtKB:P76339
  review:
    summary: >-
      A single pair from a genome-scale yeast two-hybrid map, reporting Cas1 with
      HprS, an envelope-stress sensor histidine kinase. The cached full text does
      not expose this pair at the gene level, there is no follow-up anywhere in the
      Cas1 literature, and no mechanistic rationale connects a cytoplasmic integrase
      to a membrane sensor kinase.
    action: UNDECIDED
    reason: >-
      I can neither verify nor refute it. The screen is a legitimate experiment and
      IntAct records the pair, so asserting it is wrong would be second-guessing
      data I cannot see; but nothing in the cached record lets me judge whether the
      interaction is physiological, and a single unreplicated two-hybrid hit is the
      canonical case for deferring. Left UNDECIDED per the enum rather than
      downgraded or removed.
    supported_by:
    - reference_id: PMID:24561554
      supporting_text: we performed yeast two-hybrid screens of 3,305 baits against
        3,606 preys
      reference_section_type: ABSTRACT
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:24793649
  qualifier: enables
  supporting_entities:
  - UniProtKB:P45956
  review:
    summary: >-
      The Cas1-Cas2 interface, from the 2.3 A co-crystal structure of the
      heterohexamer. This is the best-characterised interaction Cas1 makes and is
      required for spacer acquisition in vivo, but the term records only that a
      contact exists.
    action: REMOVE
    reason: >-
      The interaction is structurally certain and functionally necessary; removal
      reflects only that the term records a contact rather than a function. MODIFY
      has no target on this side of the interface: the bridging role that would
      justify an adaptor term belongs to Cas2, which is the subunit that brings two
      Cas1 dimers together, and Cas1's own contribution to the complex is the
      catalysis already stated by GO:0004520. Complex membership is captured by
      ComplexPortal CPX-996 and the interaction by IntAct, so nothing is lost.
    supported_by:
    - reference_id: PMID:24793649
      supporting_text: The overall architecture of the asymmetric unit is a heterohexameric
        complex consisting of two Cas1 dimers (Cas1a-b and Cas1c-d) that sandwich one
        Cas2 dimer
      reference_section_type: RESULTS
    - reference_id: PMID:24793649
      supporting_text: Mutations in either Cas1 or Cas2 that disrupt Cas1–Cas2 complex
        formation in vitro also interfere with spacer acquisition in vivo.
      reference_section_type: ABSTRACT
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:26503043
  qualifier: enables
  supporting_entities:
  - UniProtKB:P45956
  review:
    summary: >-
      The same Cas1-Cas2 interface, now seen in the DNA-bound state, where Cas1 and
      Cas2 arginines jointly clamp the protospacer duplex and set its length.
    action: REMOVE
    reason: >-
      Independently confirmed by a second co-crystal series, so the interaction is
