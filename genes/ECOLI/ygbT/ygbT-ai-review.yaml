- term:
    id: GO:0042803
    label: protein homodimerization activity
  evidence_type: IDA
  original_reference_id: PMID:21219465
  qualifier: enables
  review:
    summary: >-
      The 1.95 A crystal structure of full-length Cas1 is a homodimer, and every
      subsequent Cas1-Cas2 and Cas1-Cas2-DNA structure contains two Cas1 dimers.
      Dimerization builds the composite DNA-binding surface and brings the two
      active sites into the geometry needed for the paired transesterifications at
      the two repeat ends.
    action: ACCEPT
    reason: >-
      Direct structural evidence, and the oligomeric state is not incidental: the
      hexamer that performs integration is assembled from Cas1 dimers, so this is
      the one self-association term worth keeping at face value.
    supported_by:
    - reference_id: PMID:21219465
      supporting_text: The structure of the full-length YgbT showed that this protein
