- term:
    id: GO:0003676
    label: nucleic acid binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR002729
  - InterPro:IPR033641
  review:
    summary: >-
      Cas1 does bind nucleic acid, but the InterPro-to-GO mapping lands one level
      too high. The physiological ligand is DNA - non-specifically as the isolated
      protein, and selectively at CRISPR-locus leader/repeat sequences as part of
      the Cas1-Cas2 complex - and UniProt carries the DNA-binding keyword for this
      entry.
    action: MODIFY
    reason: >-
      The generic parent is replaced by GO:0003677 DNA binding, which is what the
      binding and structural data actually support. RNA binding is seen only as a
      weak in vitro side activity on single-stranded substrates and does not justify
      retaining the nucleic-acid-level parent.
    proposed_replacement_terms:
    - id: GO:0003677
      label: DNA binding
    supported_by:
    - reference_id: PMID:21219465
      supporting_text: Purified YgbT also bound to 5′-flaps structures, HJs, ssDNAs
        and ssRNAs, and produced oligomeric complexes, as detected using mobility
        shift assays
      reference_section_type: RESULTS
    - reference_id: PMID:26503043
      supporting_text: 'The Arginine Clamp interacts with the middle of the duplex
        region where four Arg residues coordinate each DNA strand: Cas1 R41 and Cas2
        R16, R77, R78'
      reference_section_type: RESULTS
- term:
    id: GO:0004519
    label: endonuclease activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN002154454
  - UniProtKB:Q46896
  review:
    summary: >-
      A sound phylogenetic assertion at too coarse a granularity. The Cas1 nuclease
      active site is family-defining and present in essentially every CRISPR-Cas
      system, so placing the function at an ancestral node is reasonable; the
      objection is only that GO:0004520 DNA endonuclease activity is available and
      is the substrate-appropriate child.
    action: MODIFY
    reason: >-
      MODIFY on granularity, not on the propagation. Q46896 appearing in its own
      WITH/FROM is expected rather than circular - its experimental annotations are
      among the descendant evidences behind the PAINT curator's IBD, and the IBA
      adds the further statement that the activity is inherited rather than
      lineage-specific. The replacement term is the one the crispr_cas_adaptive_immunity
      module requires for the Cas1 annoton.
    proposed_replacement_terms:
    - id: GO:0004520
      label: DNA endonuclease activity
    supported_by:
    - reference_id: PMID:25707795
      supporting_text: Consistent with these data, Cas1 active site mutants H208A and
        D221A were defective for protospacer integration in vitro, whereas the Cas2
        E9Q active-site mutant supported integration
      reference_section_type: RESULTS
    - reference_id: PMID:24920831
      supporting_text: The results obtained from the Southern blots presented above
        indicated a site-specific nicking at the first repeat in which the catalytic
        center of the Cas1 protein is involved.
      reference_section_type: RESULTS
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - GRANULARITY_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN002154454
        source_label: Cas1 ancestral node
        source_status: SUPPORTS_TRANSFER
        comment: >-
          The node assignment is sound. Cas1 is the most universally conserved Cas
          protein and its metal-dependent nuclease active site is family-defining, so
          placing the activity at an ancestral node and inheriting it to E. coli Cas1
          is a defensible phylogenetic judgment. Nothing about the node placement is
          being challenged here.
      - source_id: UniProtKB:Q46896
        source_label: ygbT / cas1 (Escherichia coli K-12)
        source_status: SUPPORTS_TRANSFER
        comment: >-
          The target appearing among its own WITH/FROM sources is expected, not
          circular: Cas1's own experimental annotations are part of the descendant
          evidence the PAINT curator used to place the IBD, and their presence here
          marks that the inherited function also has direct grounding on the target.
      residue_claims_not_applicable: >-
          No residue-level claim is at issue. The objection is purely to the
          granularity of the transferred term, and the catalytic residues (E141, H208,
          D221) are present and experimentally validated in the target.
