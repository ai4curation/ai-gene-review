id: Q46896
gene_symbol: ygbT
aliases:
- cas1
- b2755
- JW2725
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli (strain K12)
description: >-
  ygbT, also known as cas1, encodes the CRISPR-associated protein Cas1 of the
  Escherichia coli K-12 type I-E CRISPR-Cas system. Cas1 and Cas2 are the two most
  widely conserved Cas proteins and together constitute the adaptation machinery
  that gives CRISPR immunity its heritable, adaptive character. Cas1 is a
  metal-dependent homodimer; two Cas1 dimers sandwich a Cas2 dimer to form a
  Cas1(4)-Cas2(2) heterohexamer that binds a protospacer duplex across a flat
  surface spanning all three dimers. Within that complex Cas1 is the catalytic
  subunit: it executes the integration chemistry itself as a pair of
  transesterification reactions, in which 3'-hydroxyl ends of the captured
  protospacer attack the phosphodiester backbone at the leader-proximal CRISPR
  repeat, producing a staggered, nicked intermediate that host replication
  machinery repairs into a new spacer flanked by a duplicated repeat. The reaction
  resembles retroviral integration and DNA transposition in mechanism and in the
  reverse (disintegration) activity it displays in vitro, although Cas1 does not
  share the RNase H fold of the retroviral integrase superfamily. It requires a
  divalent cation, with Mg(2+) used in vivo and Mn(2+) or Co(2+) also supporting the
  chemistry in vitro, and the active site is built from E141, H208 and D221 within a
  cluster of conserved basic residues. Sequence and structural preferences
  intrinsic to Cas1, together with the Cas1-Cas2 complex acting as a ruler for
  duplex length, direct integration to the first repeat and set the 33 bp spacer
  size; the host nucleoid-associated protein IHF bends the leader to orient the
  complex, which is what makes integration unidirectional. In vitro the purified
  protein also cleaves single-stranded nucleic acids and a broad range of branched
  DNA structures, including Holliday junctions, replication forks, 5'-flaps,
  3'-flaps and splayed arms; this reflects the integrase active site acting on
  surrogate branch-point substrates rather than a separate resolvase activity. Cas1
  is cytoplasmic, localizes to discrete nucleoid foci in a minority of cells after
  DNA damage, interacts physically and genetically with the RecBC and RuvAB
  recombination machinery, and a ygbT deletion is viable but hypersensitive to
  mitomycin C and UV with impaired chromosome segregation; the mechanistic basis of
  that phenotype remains unresolved, and RecBCD is independently implicated as the
  source of the DNA fragments Cas1 captures. The gene is the penultimate gene of the
  casABCDE-ygbT-ygbF operon, which is silenced by H-NS and induced by LeuO and by
  the BaeSR envelope-stress system.
