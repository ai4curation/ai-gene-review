id: P0AEP7
gene_symbol: gcl
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  gcl encodes glyoxylate carboligase (tartronate-semialdehyde synthase, EC 4.1.1.47),
  a homotetrameric thiamine diphosphate (ThDP)- and Mg2+-dependent enzyme of the
  acetohydroxyacid synthase/pyruvate oxidase branch of the TPP-enzyme family. It
  decarboxylates one glyoxylate and condenses the resulting ThDP-bound carbanion with
  a second glyoxylate to give tartronate semialdehyde (2-hydroxy-3-oxopropanoate) and
  CO2. This is the first, committed step of the glycerate pathway, in which tartronate
  semialdehyde reductase (GlxR) and glycerate kinase then convert tartronate
  semialdehyde to 3-phosphoglycerate, allowing glyoxylate derived from glycolate or
  from allantoin degradation to be used as a carbon source. Like the anabolic
  acetohydroxyacid synthases it binds FAD, although the reaction involves no net redox
  change. Its crystal structure revealed that a valine replaces the glutamate that
  interacts with the N1' atom of ThDP in nearly all other ThDP enzymes. The gene lies in
  the glyoxylate-inducible gcl-hyi-glxR operon of the allantoin/glyoxylate gene cluster
  repressed by AllR.
