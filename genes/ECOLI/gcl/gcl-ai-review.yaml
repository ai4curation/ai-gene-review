    summary: >-
      Mg2+ is the divalent cation that anchors the diphosphate of ThDP in TPP-family
      enzymes; UniProt records one Mg2+ per Gcl subunit (by similarity), and the coupled
      Gcl assay used for E. coli includes MgCl2 with ThDP.
    action: ACCEPT
    reason: >-
      Mg2+ binding is an integral part of the ThDP-dependent catalytic machinery of
      glyoxylate carboligase, inferred from the conserved TPP-enzyme domains (InterPro)
      and consistent with the assay requirements used for the E. coli enzyme. The term
      is at the right level of specificity for a metal cofactor.
