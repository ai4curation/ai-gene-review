suggested_questions:
- question: 'Which native glycan reaction and any required cofactor explain OpgG-dependent OPG production:
    hydrolysis, transglycosylation or another contribution?'
suggested_experiments:
- description: Combine native-expression catalytic-site mutants with product-resolved OPG analysis and
    assays of hydrolysis versus beta-1,6 transfer; test candidate cofactors without assuming OpgH is the
    partner.
  experiment_type: biochemistry and genetic complementation
