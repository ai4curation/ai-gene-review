- term:
    id: GO:0033913
    label: glucan endo-1,2-beta-glucosidase activity
  evidence_type: IDA
  original_reference_id: PMID:37735577
  qualifier: enables
  review:
    summary: Purified OpgG has low but demonstrable substrate-specific beta-1,2-glucan hydrolysis.
    action: NEW
    reason: 'The sequence-identical BL21-derived mature protein hydrolyzes beta-1,2-glucan; the substrate-selective
      reaction and catalytic-pocket structure support intrinsic GH186 chemistry, not an inferred transfer
      from OpgD or random promiscuity. Specific activity is 0.11 U/mg, with 0.79% of OpgD activity at
      8 mg/mL glucan in the reported comparison. This conservative molecular-activity annotation does
      not identify the evolved native step: cofactor-enhanced activity and beta-1,6 transglycosylation
      remain open. Hydrolysis is therefore not used as a physiological core requirement.'
    supported_by:
    - &id006
      reference_id: PMID:37735577
      supporting_text: EcOpgG was found to hydrolyze β-1,2-glucans; however, the catalytic velocity was
        very low
    - reference_id: PMID:37735577
      supporting_text: Overall, EcOpgG is intrinsically a GH (glycoside hydrolase) enzyme but may require
        a cofactor to display greater specific activity.
    - *id005
