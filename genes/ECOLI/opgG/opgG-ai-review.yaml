  label: Escherichia coli K-12
description: 'OpgG is a Sec-exported periplasmic GH186-family protein that contributes to osmoregulated
  periplasmic glucan production in Escherichia coli. It binds beta-1,2-glucans and purified sequence-identical
  BL21-derived protein has low intrinsic beta-1,2-glucan hydrolase activity. Its physiological reaction
  remains unresolved: hydrolytic processing, cofactor-enhanced catalysis and a proposed beta-1,6 transglycosylation
  role have not been discriminated. OpgG is distinct from the much more active hydrolase OpgD and from
  the membrane glucosyltransferase OpgH.'
