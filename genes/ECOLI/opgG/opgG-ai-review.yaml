  title: Biosynthesis of membrane-derived oligosaccharides. Novel glucosyltransferase system from Escherichia
    coli for the elongation of beta 1----2-linked polyglucose chains.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract supports beta-1,2-glucan synthesis by a membrane-plus-soluble-factor system
      and a defective mdoA locus. It predates opgGH separation; do not assign purified OpgG catalysis
      or autonomous OpgH activity from it.
- id: PMID:6365896
  title: Mapping of a locus (mdoA) that affects the biosynthesis of membrane-derived oligosaccharides
    in Escherichia coli.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Early mdoA locus mapping, abstract only. The phenotype predates gene-specific resolution;
      later opgGH evidence supports the pathway annotation without pretending this reference assays each
      purified subunit.
- id: PMID:7934824
  title: Homology between a genetic locus (mdoA) involved in the osmoregulated biosynthesis of periplasmic
    glucans in Escherichia coli and a genetic locus (hrpM) controlling pathogenicity of Pseudomonas syringae.
  findings:
  - statement: Gene-specific resolution assigns OpgG to the periplasm and OpgH to the membrane glucosyltransferase
      system.
    supporting_text: 'The two genes forming the mdoGH operon are necessary for the synthesis

      of MDO.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cached abstract examined. Exact target-level table/peptide details and complete strain/construct
      metadata were not independently verified from full text; independently grounded biological claims
      are retained.
- id: PMID:37735577
  title: Identification of enzymatic functions of osmo-regulated periplasmic glucan biosynthesis proteins
    from Escherichia coli reveals a novel glycoside hydrolase family.
  findings:
  - statement: Sequence-matched recombinant assays distinguish substantial OpgD hydrolysis from weak intrinsic
      OpgG hydrolysis; native processing remains interpreted.
    supporting_text: In the catalytic pocket of the complex, the electron density of a Sop16 molecule
      was observed
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Direct BL21(DE3)-derived signal-deleted, C-terminal His6 OpgG/OpgD assays. CAQ precursors
      exactly match frozen K-12 targets. OpgG activity is low (0.11 U/mg; 0.79% of OpgD under the specified
      comparison), not absent. OpgD hydrolysis is strong and specific; native OPG trimming is inferred.
      OpgG cofactor/branching hypotheses remain open. Table D378N differs from methods/PDB D388N; use
      the latter for OpgD construct identity.
- id: file:ECOLI/opgG/opgG-source-analysis/sequence-bridge.md
  title: Exact BL21-to-K-12 OpgG/OpgD sequence and structure-numbering bridge
  findings:
  - statement: The assay-source precursors match the frozen K-12 sequences exactly, with recombinant construct
      limits retained.
    supporting_text: The complete BL21(DE3) precursor CAQ31569.1 is identical to the frozen K-12 P33136
      sequence (511 residues). The complete BL21(DE3) precursor CAQ31910.2 is identical to frozen K-12
      P40120 (551 residues).
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Exact precursor sequence equality and deposited structure numbering checked against
      frozen raw records; recombinant construct and physiological limits stated.
- id: PMID:15313617
  title: Structural analysis of Escherichia coli OpgG, a protein required for the biosynthesis of osmoregulated
    periplasmic glucans.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract describes ligand-free OpgG structure and proposes branching; it does not demonstrate
      beta-1,6 transglycosylation. The proposal remains unresolved in the 2023 biochemical study.
