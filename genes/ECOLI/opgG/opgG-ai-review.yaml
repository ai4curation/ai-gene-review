- description: 'Contributes to production of osmoregulated periplasmic glucans. The native molecular reaction
    remains unresolved: direct binding and slow intrinsic beta-1,2-glucan hydrolysis are established,
    but neither physiological hydrolytic trimming nor beta-1,6 branching is assigned as the required OpgG
    step.'
