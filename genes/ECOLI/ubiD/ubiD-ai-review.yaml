gene_symbol: ubiD
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  UbiD is the 3-octaprenyl-4-hydroxybenzoate carboxy-lyase of Escherichia coli
  (EC 4.1.1.98), the founding member of the UbiD family of reversible
  decarboxylases that use the prenylated FMN (prFMN) cofactor made by the flavin
  prenyltransferase UbiX together with a Mn2+ ion. It catalyses the third
  reaction of bacterial ubiquinone biosynthesis, decarboxylating
  3-octaprenyl-4-hydroxybenzoate to 2-octaprenylphenol, which is then
  hydroxylated by UbiI. The enzyme is a homohexamer of 497-residue subunits that
  binds one prFMN per subunit; recombinant UbiD is isolated as an inactive
  apoenzyme and must be reconstituted with reduced prFMN, which matures only
  slowly to the active oxidised iminium form in vitro. Classical work showed
  that ubiD mutants accumulate 3-octaprenyl-4-hydroxybenzoate and lack the
  decarboxylase activity, which is stimulated by phospholipid and is found both
  in soluble and membrane fractions of cell extracts, consistent with a
  cytosolic enzyme acting on a membrane-associated substrate.
