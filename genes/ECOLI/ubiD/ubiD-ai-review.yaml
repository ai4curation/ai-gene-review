  - InterPro:IPR023677
  - UniProtKB-SubCell:SL-0039
  - UniRule:UR000081062
  review:
    summary: >-
      Peripheral cell-membrane location inferred by UniProt/HAMAP from the
      phospholipid requirement of the 1976 activity.
    action: KEEP_AS_NON_CORE
    reason: >-
      UniProt records the cell-membrane location as an inference (ECO:0000305)
      from Leppik et al., who found the activity stimulated by phospholipid and
      partly membrane-associated, and proposed that it functions at the
      cytoplasmic membrane because its substrate is membrane-bound. A
      peripheral, substrate-driven association with the inner membrane is
      plausible but has not been shown for the purified protein, which is
      soluble; the core location is cytosol.
    supported_by:
    - reference_id: PMID:782527
      supporting_text: >-
        The fact that the substrate of the carboxy-lyase is membrane-bound and
        the enzyme is stimulated by phospholipid suggests that it normally
        functions in association with the cytoplasmic membrane in vivo.
    - reference_id: file:ECOLI/ubiD/ubiD-uniprot.txt
