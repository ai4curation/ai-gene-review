  title: Oxidative Maturation and Structural Characterization of Prenylated FMN Binding
    by UbiD, a Decarboxylase Involved in Bacterial Ubiquinone Biosynthesis.
  findings:
  - statement: >-
      Recombinant UbiD was not active on tested para-hydroxybenzoate substrates,
      and its open active site lacks an obvious pocket for the octaprenyl tail.
    supporting_text: >-
      the lack of an obvious hydrophobic binding pocket for the octaprenyl tail
      of the proposed ubiquinone precursor substrate does suggest UbiD might act
      on a non-prenylated precursor
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Abstract cached (PMC5377778); structural and cofactor work on E. coli
      UbiD. Its suggestion that UbiD might act on a non-prenylated precursor
      conflicts with the genetic accumulation of the octaprenylated substrate in
      ubiD mutants and remains unresolved.
