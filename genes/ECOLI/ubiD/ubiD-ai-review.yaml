  qualifier: enables
  review:
    summary: Assay and partial purification of 3-octaprenyl-4-hydroxybenzoate carboxy-lyase from E. coli.
    action: ACCEPT
    reason: >-
      Direct assay of the activity in E. coli extracts and partially purified
      enzyme (Mn2+-dependent, about 340 kDa, i.e. hexameric), tied to ubiD by
      the mutant extracts that lack it. The modern recombinant enzyme has not
      yet been shown to turn over the octaprenylated substrate in vitro, but
      it binds the prFMN cofactor and Mn2+ expected for the reaction, so the
      activity assignment stands.
    supported_by:
    - reference_id: PMID:782527
      supporting_text: >-
        A sensitive and quantitative assay for 3-octaprenyl-4-hydroxybenzoate
        carboxy-lyase has been developed.
    - reference_id: PMID:782527
      supporting_text: >-
        For optimal activity the carboxy-lase was shown to require Mn2+, washed
        membranes or an extract of phospholipids, and an unidentified heat
        stable factor of molecular weight less than 10 000.
