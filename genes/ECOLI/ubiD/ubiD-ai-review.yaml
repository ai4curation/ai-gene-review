suggested_questions:
- question: >-
    Does UbiD act on 3-octaprenyl-4-hydroxybenzoate itself or, as its
    structure suggests, on a less hydrophobic precursor, and is a partner
    (membrane or a lipid-binding protein) needed to present the prenylated
    substrate?
suggested_experiments:
- hypothesis: Fully matured holoUbiD decarboxylates a polyprenylated 4-hydroxybenzoate presented in detergent or liposomes.
  description: >-
    Reconstitute apoUbiD with reduced prFMN from UbiX, mature it to the
    iminium form, and assay short- and long-chain 3-prenyl-4-hydroxybenzoates
    in micelles or liposomes, monitoring 2-prenylphenol formation by LC-MS.
