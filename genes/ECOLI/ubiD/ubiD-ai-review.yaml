- description: >-
    prFMN- and Mn2+-dependent decarboxylation of 3-octaprenyl-4-hydroxybenzoate
    to 2-octaprenylphenol, the third step of bacterial ubiquinone
    biosynthesis, using the prenylated flavin cofactor supplied by UbiX.
