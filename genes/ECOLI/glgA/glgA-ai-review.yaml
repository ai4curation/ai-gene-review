taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  GlgA is the glycogen synthase of Escherichia coli (EC 2.4.1.21), the
  retaining GT-B glycosyltransferase that elongates alpha-1,4-glucan chains by
  transferring glucosyl units from ADP-glucose to the non-reducing end of a
  growing glucan primer. It is a soluble, cytosolic enzyme that acts downstream
  of the ADP-glucose pyrophosphorylase GlgC and upstream of the branching
  enzyme GlgB in the glgBXCAP operon, together building the branched glycogen
  that serves as the cell's carbon and energy store. In E. coli, as in most
  Enterobacteria, the glucosyl donor is ADP-glucose rather than the UDP-glucose
  used by eukaryotic and some other bacterial glycogen synthases.
existing_annotations:
  - term:
      id: GO:0004373
      label: alpha-1,4-glucan glucosyltransferase (UDP-glucose donor) activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    review:
      summary: Wrong nucleotide-sugar donor; E. coli GlgA uses ADP-glucose, not UDP-glucose.
      action: REMOVE
      reason: >-
        This term comes from the donor-blind InterPro2GO mapping of the generic
        glycogen/starch synthase signature IPR011835 (GS/SS), which does not
        distinguish the nucleotide-sugar donor. E. coli GlgA is an
        ADP-glucose-dependent synthase: its curated FUNCTION states it
        synthesizes alpha-1,4-glucan using ADP-glucose, the catalytic-activity
        statement uses ADP-alpha-D-glucose (EC 2.4.1.21, RHEA:18189), and the
        ADP-glucose donor activity GO:0009011 is separately supported by direct
        assay (PMID:8226921). The UDP-glucose donor activity is therefore the
        wrong donor-specific sibling for this enzyme.
      supported_by:
        - reference_id: file:ECOLI/glgA/glgA-uniprot.txt
          record_section: ["CC:FUNCTION"]
          supporting_text: "Synthesizes alpha-1,4-glucan chains using ADP-glucose."
        - reference_id: file:ECOLI/glgA/glgA-uniprot.txt
          record_section: ["CC:CATALYTIC ACTIVITY"]
          supporting_text: "ADP-alpha-D-glucose = [(1->4)-"
