  - term:
      id: GO:0009011
      label: alpha-1,4-glucan glucosyltransferase (ADP-glucose donor) activity
    evidence_type: IDA
    original_reference_id: PMID:8226921
    qualifier: enables
    review:
      summary: Direct mutagenesis of the ADP-glucose-binding site establishes the activity.
      action: ACCEPT
      reason: >-
        Mutational analysis of the conserved Lys-X-Gly-Gly motif at the
        ADP-glucose-binding site of E. coli glycogen synthase directly
        characterises the ADP-glucose-dependent chain-elongation activity. This
        is the gene's core catalytic function.
      supported_by:
        - reference_id: PMID:8226921
          supporting_text: "Role of the conserved Lys-X-Gly-Gly sequence at the ADP-glucose-binding site"
