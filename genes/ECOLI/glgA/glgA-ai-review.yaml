      id: GO:0005978
      label: glycogen biosynthetic process
    evidence_type: IMP
    original_reference_id: PMID:17719035
    qualifier: acts_upstream_of_or_within
    review:
      summary: Genetic/biochemical analysis links GlgA to glycogen biosynthesis.
      action: ACCEPT
      reason: >-
        Work on ADP-glucose sources linked to glycogen biosynthesis in E. coli
        and Salmonella supports GlgA's participation in making glycogen from the
        ADP-glucose pool.
      supported_by:
        - reference_id: PMID:17719035
          supporting_text: "Occurrence of more than one important source of ADPglucose linked to glycogen"
  - term:
      id: GO:0006974
      label: DNA damage response
    evidence_type: IEP
    original_reference_id: PMID:11967071
    qualifier: acts_upstream_of_or_within
    review:
      summary: Expression-correlation artefact from a genome-wide stress screen; not a GlgA function.
      action: MARK_AS_OVER_ANNOTATED
      reason: >-
        This IEP derives from a transcriptomic screen that reported over a
        thousand E. coli genes with altered expression after DNA damage. GlgA is
        a glycogen synthase; a change in its transcript level under stress
        reflects global carbon-storage remodelling, not participation in the DNA
        damage response. The gene product does none of the work of that process,
        so the term is an over-annotation.
      supported_by:
        - reference_id: PMID:11967071
          supporting_text: "Over 1000 genes are involved in the DNA damage response of Escherichia coli."
