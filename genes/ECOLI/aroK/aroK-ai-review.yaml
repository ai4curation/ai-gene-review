core_functions:
- description: >-
    Constitutively expressed shikimate kinase that phosphorylates the 3-hydroxyl of shikimate
    with Mg-ATP to give shikimate 3-phosphate (step 5 of the shikimate pathway) in the cytosol.
    It works redundantly with the higher-affinity, regulated isozyme AroL to supply chorismate
    biosynthesis.
  molecular_function:
    id: GO:0004765
    label: shikimate kinase activity
  directly_involved_in:
  - id: GO:0009423
    label: chorismate biosynthetic process
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:1309529
    supporting_text: The auxotrophic requirements of a strain mutant for both urf1 and aroL
      (encoding shikimate kinase II) are consistent with shikimate kinase deficiency. We propose
      that urf1 encodes shikimate kinase I and that it be designated aroK.
  - reference_id: PMID:27558633
    supporting_text: In contrast to AroL, the activity of AroK in the cell is independent of both
      the amount of extracellular aromatic amino acids and the level of tyrR gene product67.
proposed_new_terms: []
knowledge_gaps:
- gap_statement: >-
    AroK has a second activity, genetically separable from shikimate kinase activity and
    dependent on ppGpp, that confers mecillinam sensitivity and may relate to cell division
    regulation. Its molecular nature, partners and mechanism are unknown.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  provenance:
  - reference_id: PMID:8682786
    supporting_text: We were able to separate the AroK activities mutationally with an aroK mutant
      allele lacking shikimate kinase activity but still able to confer mecillinam sensitivity.
suggested_questions:
- question: >-
    What is the second, shikimate kinase-independent activity of AroK that confers mecillinam
    sensitivity? Does it involve binding to a cell-division or ppGpp-metabolism protein?
- question: >-
    Under which growth conditions does constitutive AroK, rather than TyrR/TrpR-repressible
    AroL, carry most of the shikimate kinase flux?
suggested_experiments:
- description: >-
    Map the mecillinam-sensitivity function using the kinase-dead but mecillinam-sensitising aroK
    allele. Use pull-down/MS or bacterial two-hybrid screens for AroK partners, and test the
    effect on PBP2-independent division and on ppGpp levels.
- description: >-
    Quantify the in vivo flux through each isozyme with aroK and aroL single mutants grown with
    and without aromatic supplements, measuring intracellular shikimate and S3P.
