- term:
    id: GO:0046677
    label: response to antibiotic
  evidence_type: IMP
  original_reference_id: PMID:25294881
  qualifier: acts_upstream_of_or_within
  review:
    summary: >-
      Weatherspoon-Griffin et al. (2014) found that aroK, a CpxR-dependent gene, facilitates
      resistance to the cationic antimicrobial peptide protamine. The effect is apparently
      mediated by aromatic pathway metabolites such as indole, which stimulate Cpx-regulated
      genes.
    action: KEEP_AS_NON_CORE
    reason: >-
      The mutant phenotype is real but peripheral. In the protamine case AroK acts through the
      metabolites its pathway supplies, not as part of a response mechanism. AroK also affects
      mecillinam sensitivity through a separate, uncharacterised activity (PMID:8682786), so
      antibiotic phenotypes are a recurrent feature of the gene. Neither establishes a defined
      role in a response pathway, so the term is kept as non-core context.
    supported_by:
    - reference_id: PMID:25294881
      supporting_text: aroK, a CpxR-dependent gene that encodes a shikimate kinase in the
        tryptophan biosynthesis pathway, was also found to facilitate protamine resistance.
    - reference_id: PMID:8682786
      supporting_text: Instead, we conclude that the AroK protein has a second activity, possibly
        related to cell division regulation, which confers mecillinam sensitivity.
