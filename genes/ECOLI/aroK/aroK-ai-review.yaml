id: P0A6D7
gene_symbol: aroK
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  AroK is shikimate kinase I (EC 2.7.1.71) of Escherichia coli, one of two shikimate kinase
  isozymes, the other being AroL (shikimate kinase II). It is a small, soluble, monomeric
  cytosolic P-loop kinase of the shikimate kinase family. In the fifth step of the shikimate
  pathway it phosphorylates the 3-hydroxyl group of shikimate with Mg(2+)-ATP, forming
  shikimate 3-phosphate, which is carried on to chorismate. A LID domain closes over the
  active site when ATP binds. aroK is transcribed constitutively with aroB, unlike the
  TyrR/TrpR-repressible aroL. AroK has a much higher Km for shikimate (about 20 mM) than AroL
  (about 200 uM), so AroL is considered the main biosynthetic isozyme under aromatic
  limitation. Still, either enzyme alone supports aromatic prototrophy, and only the aroK aroL
  double mutant is auxotrophic. Genetic studies also point to a second, uncharacterised AroK
  activity, separable from shikimate kinase activity and dependent on ppGpp: it makes cells
  sensitive to the PBP2-specific beta-lactam mecillinam and may relate to cell division control.
