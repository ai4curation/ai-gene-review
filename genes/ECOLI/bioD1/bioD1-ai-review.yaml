taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  BioD (dethiobiotin synthetase, DTBS; EC 6.3.3.3) of Escherichia coli K-12 is a
  cytosolic, Mg2+- and ATP-dependent carboxylase/synthetase of the P-loop NTPase
  fold. It closes the ureido ring of the biotin precursor by inserting CO2
  between the N7 and N8 nitrogen atoms of 7,8-diaminononanoate (DAPA),
  consuming ATP to give (4R,5S)-dethiobiotin, ADP and phosphate. This is the
  fourth step of biotin ring assembly, immediately before the radical-SAM
  sulfur insertion by BioB. The enzyme is a homodimer with a Mg2+ ion per
  subunit; its catalytic mechanism, proceeding through an N7-carbamate and a
  mixed carbamic-phosphoric anhydride, is defined by extensive kinetic and
  crystallographic work. The gene lies in the E. coli bio operon.
