id: P0A814
gene_symbol: ruvC
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: RuvC is the Holliday-junction resolvase of Escherichia coli. A homodimeric, magnesium-dependent
  endonuclease with an RNase H-like fold and four acidic catalytic residues, it binds four-way junctions
  independently of sequence and cleaves two strands of like polarity at symmetrical positions, preferentially
  at 5'-(A/T)TT(G/C)-3' sites, leaving ligatable nicked duplexes with 5'-phosphate and 3'-hydroxyl ends.
  RuvC acts with the RuvAB branch-migration complex, which translocates junctions to cleavable sites and
  forms a RuvABC assembly, completing homologous recombination and recombinational repair and cleaving
  junctions formed at reversed replication forks.
