id: P00904
gene_symbol: trpD
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  trpD of Escherichia coli K-12 encodes the bifunctional TrpGD protein (531 residues). Its N-terminal
  class-I glutamine amidotransferase (TrpG) domain is anthranilate synthase component II: it hydrolyses
  L-glutamine and supplies ammonia to TrpE (component I), which aminates chorismate to anthranilate. Its
  C-terminal anthranilate phosphoribosyltransferase (TrpD) domain transfers the phosphoribosyl group of
  PRPP to anthranilate to give N-(5'-phosphoribosyl)-anthranilate. TrpE and TrpGD form the anthranilate
  synthase complex ("anthranilate aggregate"), in which both activities are cooperatively feedback-inhibited
  by L-tryptophan bound at a single class of sites. TrpGD therefore performs steps 1 (with TrpE) and 2
  of L-tryptophan biosynthesis from chorismate.
