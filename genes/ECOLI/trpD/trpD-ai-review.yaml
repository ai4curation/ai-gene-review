- term:
    id: GO:0002047
    label: phenazine biosynthetic process
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000230115
  - UniProtKB:P09786
  review:
    summary: >-
      PAINT node PTN000230115 carries phenazine biosynthesis, seeded only by P. aeruginosa PhnB (P09786),
      the pyocyanin-specific anthranilate synthase component II. E. coli K-12 makes no phenazines.
    action: REMOVE
    reason: >-
      This is a lineage-specific process propagated across the node. PhnB feeds anthranilate into the
      Pseudomonas phenazine (pyocyanin) pathway, which E. coli lacks. E. coli TrpGD channels its anthranilate
      into tryptophan, as its curated function and the tryptophan inhibition of the aggregate show. The
      IBA is an over-propagation from a single phenazine-specific paralog seed and is false for this gene.
    supported_by:
    - reference_id: file:interpro/panther/PTHR43418/PTHR43418-paint.tsv
      supporting_text: "PTHR43418\tPTN000230115\tGO:0002047\tP\tIBD\tfalse\tUniProtKB:P09786"
    - reference_id: file:ECOLI/trpD/trpD-uniprot.txt
