- id: PMID:2428387
  title: >-
    The anthranilate aggregate of Escherichia coli: kinetics of inhibition by tryptophan of phosphoribosyltransferase.
  findings:
  - statement: >-
      The aggregate's phosphoribosyltransferase follows a rapid-equilibrium random bi bi mechanism. One
      class of tryptophan sites couples feedback inhibition of both activities.
    supporting_text: The aggregate contains only one class of tryptophan sites.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Abstract cached; direct kinetics of the TrpGD phosphoribosyltransferase within the complex.
