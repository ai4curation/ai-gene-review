- id: PMID:4886289
  title: >-
    Anthranilate synthetase, an enzyme specified by the tryptophan operon of Escherichia coli: purification
    and characterization of component I.
  findings:
  - statement: >-
      Purified component I (TrpE) uses ammonia but not glutamine, so the glutamine-dependent reaction
      needs component II (TrpGD).
    supporting_text: Purified anthranilate synthetase component I cannot use glutamine as substrate
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract cached; centred on TrpE, informative for TrpGD by implication.
- id: PMID:4886290
  title: >-
    Anthranilate synthetase, an enzyme specified by the tryptophan operon of Escherichia coli: Comparative
    studies on the complex and the subunits.
  findings:
  - statement: >-
      Component II (TrpGD) activates component I for the anthranilate synthase reaction and carries the
      transferase activity, which is tryptophan-sensitive only within the complex.
    supporting_text: >-
      the transferase activity of component II is only inhibitable by l-tryptophan when the component
      is in the complex
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract cached; direct comparison of the complex and isolated TrpE and TrpGD.
