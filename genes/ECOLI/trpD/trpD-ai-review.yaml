      supporting_text: >-
        In addition to synthesizing anthranilate, it also catalyzes the second step of the pathway, the
        transfer of the phosphoribosyl group
    - reference_id: PMID:2428387
      supporting_text: >-
        Thus the first tryptophan molecule bound to the aggregate maximally inhibits both phosphoribosyltransferase
        active centers and one of the two anthranilate synthase catalytic sites.
