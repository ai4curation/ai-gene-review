core_functions:
- description: >-
    N-terminal TrpG glutamine amidotransferase domain. It supplies ammonia from L-glutamine to TrpE in
    the TrpE-TrpGD anthranilate synthase complex, contributing to the conversion of chorismate to anthranilate.
  contributes_to_molecular_function:
    id: GO:0004049
    label: anthranilate synthase activity
  directly_involved_in:
  - id: GO:0000162
    label: L-tryptophan biosynthetic process
  in_complex:
    id: GO:0005950
    label: anthranilate synthase complex
  supported_by:
  - reference_id: file:ECOLI/trpD/trpD-uniprot.txt
    record_section: ["CC:FUNCTION"]
    supporting_text: >-
      In the first step, the glutamine-binding beta subunit (TrpG) of anthranilate synthase (AS) provides
      the glutamine amidotransferase activity which generates ammonia as a substrate that, along with
      chorismate, is used in the second step, catalyzed by the large alpha subunit of AS (TrpE) to produce
      anthranilate.
  - reference_id: PMID:4886289
    supporting_text: >-
      Purified anthranilate synthetase component I cannot use glutamine as substrate and thus has no activity
      in the reaction of chorismate + l-glutamine --> anthranilate; however, it is active when ammonium
      sulfate is provided as amino donor.
- description: >-
    C-terminal anthranilate phosphoribosyltransferase domain. It transfers the phosphoribosyl group of
    PRPP to anthranilate, giving N-(5'-phosphoribosyl)-anthranilate, and is feedback-inhibited by L-tryptophan
    within the complex.
  molecular_function:
    id: GO:0004048
    label: anthranilate phosphoribosyltransferase activity
  directly_involved_in:
  - id: GO:0000162
    label: L-tryptophan biosynthetic process
  in_complex:
    id: GO:0005950
    label: anthranilate synthase complex
  supported_by:
  - reference_id: PMID:2428387
    supporting_text: >-
      The kinetic mechanism of the phosphoribosyltransferase reaction is shown to be rapid equilibrium
      random bi bi with an enzyme-anthranilate-pyrophosphate abortive complex.
  - reference_id: PMID:4886290
    supporting_text: >-
      the transferase activity of component II is only inhibitable by l-tryptophan when the component
      is in the complex
suggested_questions:
- question: >-
    How is the single class of tryptophan sites in the TrpE-TrpGD aggregate shared between the two subunits,
    and why does the TrpD domain become tryptophan-sensitive only in the complex?
suggested_experiments:
- description: >-
    Solve the structure of the E. coli TrpE2-TrpGD2 complex with and without L-tryptophan to locate the
    shared regulatory site.
  experiment_type: structural biology
