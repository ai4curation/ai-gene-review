proposed_new_terms: []
suggested_questions:
- question: Under native growth and envelope-stress conditions, which unfolded
    beta-barrel OMPs are direct DegP protease substrates and which, if any, are
    protected by the DegP chaperone mode long enough to re-enter productive BAM
    assembly?
- question: How much of DegP activity occurs in soluble periplasmic cages versus
    lipid-associated bowl-like oligomers at the periplasmic face of the inner
    membrane?
suggested_experiments:
- description: Use pulse-chase OMP biogenesis assays with catalytically inactive
    and chaperone-biased DegP variants to separate direct proteolytic clearance
    of unfolded OMPs from productive rescue into BAM-mediated assembly.
- description: Combine site-specific photocrosslinking of native OMP substrates
    with DegP oligomer-state mutants to map whether client identity biases DegP
    toward chaperone cages, protease cages, or membrane-associated bowl states.
