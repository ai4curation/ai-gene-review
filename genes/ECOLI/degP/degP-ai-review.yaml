      self-binding assertions.
- id: GO_REF:0000120
  title: Combined Automated Annotation using Multiple IEA Methods
  findings:
  - statement: Combined automated support for DegP serine endopeptidase activity
      and proteolysis.
- id: PMID:10319814
  title: A temperature-dependent switch from chaperone to protease in a widely conserved
    heat shock protein.
  findings:
  - statement: DegP combines molecular chaperone and protease functions, with
      chaperone activity favored at low temperature and proteolysis at elevated
      temperature.
    supporting_text: The chaperone function dominates at low temperatures, while
      the proteolytic activity is present at elevated temperatures.
    finding_review:
      finding_status: DISPUTED
      superseded_by:
      - PMID:24373465
      review_notes: >-
        The purified-protein temperature switch remains valid in vitro, but
        later in-cell photo-crosslinking found that OMPs are major native DegP
        substrates and that DegP primarily eliminates unfolded OMPs
        proteolytically at both low and high temperature.
      supported_by:
      - reference_id: PMID:24373465
        supporting_text: DegP primarily functions as a protease, at both low and
          high temperatures, to eliminate unfolded OMPs
- id: PMID:10417648
  title: PDZ domains determine the native oligomeric structure of the DegP (HtrA)
    protease.
  findings:
  - statement: DegP is a periplasmic heat-shock serine protease and its PDZ
      domains support native oligomerization.
    supporting_text: the purified DegP exists as a hexamer
- id: PMID:10517331
  title: The Escherichia coli heat shock protease HtrA participates in defense against
    oxidative stress.
  findings:
  - statement: HtrA/DegP protects against envelope-associated oxidative damage and
      localizes to the periplasmic face of the inner membrane.
    supporting_text: HtrA plays a role in defense against oxidative shock and support
      the hypothesis that HtrA participates in the degradation of oxidatively damaged
      proteins localized in the cell envelope
- id: PMID:11919638
  title: Crystal structure of DegP (HtrA) reveals a new protease-chaperone machine.
  findings:
  - statement: The DegP resting structure is a hexamer of trimeric rings with
      internally sequestered protease active sites and PDZ-domain sidewalls.
    supporting_text: The DegP hexamer is formed by staggered association of trimeric
      rings.
- id: PMID:17908933
  title: Defining the roles of the periplasmic chaperones SurA, Skp, and DegP in Escherichia
    coli.
  findings:
  - statement: SurA is the major OMP transit chaperone; Skp and DegP have a
      rescue role when OMPs fall off the SurA pathway.
    supporting_text: Evidence presented suggests that DegP/Skp function to rescue
      OMPs that fall off the SurA pathway.
- id: PMID:18496527
  title: Structural basis for the regulated protease and chaperone function of DegP.
  findings:
  - statement: Misfolded protein binding converts DegP hexamers into active 12-
      and 24-mers; folded OMP protomer encapsulation may support safe transit
      whereas misfolded substrates are eliminated.
    supporting_text: binding of misfolded proteins transforms hexameric DegP into
      large, catalytically active 12-meric and 24-meric multimers.
- id: PMID:18505836
  title: Interplay of PDZ and protease domain of DegP ensures efficient elimination
    of misfolded proteins.
  findings:
  - statement: DegP PDZ1 captures misfolded substrates and activates processive
      serine endoproteolysis into oligopeptides.
    supporting_text: PDZ1 functions as the primary substrate binding site that
      captures the C-terminal Z-motif of misfolded proteins and reaction
      intermediates and presents the N-terminal segment to the protease domain.
- id: PMID:18697939
  title: Activation of DegP chaperone-protease via formation of large cage-like oligomers
    upon binding to substrate proteins.
  findings:
  - statement: DegP forms 12- and 24-mer cages from trimeric building blocks upon
      substrate binding.
    supporting_text: both oligomers are consistently assembled by blocks of DegP
      trimers
- id: PMID:19255437
  title: Bowl-shaped oligomeric structures on membranes as DegP's new functional forms
    in protein quality control.
  findings:
  - statement: DegP can form membrane-associated bowl-like oligomers with enhanced
      protease and reduced chaperone activity.
    supporting_text: they exhibit higher proteolytic and lower chaperone-like
      activities than DegP in solution.
- id: PMID:20581825
  title: HtrA proteases have a conserved activation mechanism that can be triggered
    by distinct molecular cues.
  findings:
  - statement: Peptide binding to DegP PDZ domains triggers conversion from resting
      DegP6 to proteolytically active DegP12/DegP24.
    supporting_text: effector-peptide binding to the PDZ domain of DegP induces
      oligomer conversion from resting hexameric DegP6 into proteolytically active
      12-mers and 24-mers
- id: PMID:20581826
  title: Determinants of structural and functional plasticity of a widely conserved
    protease chaperone complex.
  findings:
  - statement: Mutational and refolding experiments identify how PDZ1 peptide
      binding is transmitted allosterically to the protease-domain substrate pocket.
    supporting_text: Binding of specific peptides to PDZ domain-1 causes a local
      rearrangement that is allosterically transmitted to the substrate-binding
      pocket of the protease domain.
- id: PMID:21458668
  title: Covalent linkage of distinct substrate degrons controls assembly and disassembly
    of DegP proteolytic cages.
  findings:
  - statement: Linked active-site and PDZ1 degrons in substrates drive cooperative
      assembly of active DegP cages that remain assembled until substrate is
      depleted.
    supporting_text: active cages assemble rapidly in a reaction that is positively
      cooperative in substrate concentration, remain stably assembled while
      uncleaved substrate is present, and dissociate once degradation is complete.
- id: PMID:2180903
  title: The HtrA (DegP) protein, essential for Escherichia coli survival at high
    temperatures, is an endopeptidase.
  findings:
  - statement: Purified DegP/HtrA is a DFP-sensitive serine endopeptidase processed
      from a precursor.
    supporting_text: The HtrA protein was shown to be a specific endopeptidase
      which was inhibited by diisopropylfluorophosphate, suggesting that HtrA is
      a serine protease.
- id: PMID:21893291
  title: Characterization of the structure and function of Escherichia coli DegQ as
    a representative of the DegQ-like proteases of bacterial HtrA family proteins.
  findings:
  - statement: DegQ-family context for E. coli HtrA protease oligomerization; the
      cached abstract does not expose the DegP self-interaction row directly.
- id: PMID:24373465
  title: DegP primarily functions as a protease for the biogenesis of β-barrel outer
    membrane proteins in the Gram-negative bacterium Escherichia coli.
  findings:
  - statement: OMPs are major natural DegP substrates, and DegP's dominant in vivo
      role is proteolytic clearance of unfolded OMPs.
    supporting_text: We also demonstrated that DegP primarily functions as a protease,
      at both low and high temperatures, to eliminate unfolded OMPs
- id: PMID:24373769
  title: Substrate occupancy at the onset of oligomeric transitions of DegP.
  findings:
  - statement: Native mass spectrometry showed that substrate-mimicking peptide
      ligands bind the resting 6-mer before active-state transition.
    supporting_text: binding of multiple substrate-mimicking peptide ligands to
      the DegP resting state occurs prior to the transition to an active
      conformation.
- id: PMID:2537822
  title: Identification, characterization, and mapping of the Escherichia coli htrA
    gene, whose product is essential for bacterial growth only at elevated temperatures.
  findings:
  - statement: htrA transposon mutants grow at 30 C but fail above 42 C.
    supporting_text: transposon insertions in it allowed E. coli growth at 30
      degrees C but prevented growth at elevated temperatures
- id: PMID:25525882
  title: Detecting envelope stress by monitoring β-barrel assembly.
  findings:
  - statement: OmpA/BamA/RcsF envelope-stress study carrying a generic OmpA
      interaction in GOA; the cached abstract does not expose a DegP-specific
      function.
- id: PMID:28642151
  title: The role of the LB structural loop and its interactions with the PDZ domain
    of the human HtrA3 protease.
  findings:
  - statement: Human HtrA3 study that should not support E. coli DegP protein
      binding to beta-casein.
    supporting_text: Human HtrA3 protease is a proapoptotic protein
- id: PMID:3278319
  title: An Escherichia coli mutation preventing degradation of abnormal periplasmic
    proteins.
  findings:
  - statement: degP mutants fail to degrade an abnormal membrane-bound alkaline
      phosphatase fusion and several abnormal periplasmic proteins.
    supporting_text: One mutant is also defective in breakdown of five other abnormal
      periplasmic proteins but not of two cytoplasmic proteins.
- id: PMID:7557477
  title: Site-directed mutagenesis of the HtrA (DegP) serine protease, whose proteolytic
    activity is indispensable for Escherichia coli survival at elevated temperatures.
  findings:
  - statement: Ser210 and His105 active-site substitutions eliminate DegP protease
      activity and complementation of htrA thermosensitivity.
    supporting_text: Mutational alteration of Ser210 eliminated proteolytic activity
      of HtrA. An identical effect was observed when His105 was mutated.
- id: PMID:9041651
  title: Evidence for PDZ domains in bacteria, yeast, and plants.
  findings:
  - statement: Sequence analysis recognized two PDZ domains in bacterial HtrA/DegP.
    supporting_text: two PDZ domains occur in bacterial high-temperature requirement
      A (htrA)
- id: PMID:9083020
  title: HtrA heat shock protease interacts with phospholipid membranes and undergoes
    conformational changes.
  findings:
  - statement: HtrA/DegP associates peripherally with the inner membrane and its
      activity is affected by phospholipids.
    supporting_text: HtrA is a peripheral membrane protein, localized on the
      periplasmic side of the inner membrane.
