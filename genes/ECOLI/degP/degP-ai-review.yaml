gene_symbol: degP
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli (strain K12)
description: DegP is an HtrA-family periplasmic protein-quality-control factor in
  Escherichia coli. Its mature protease-chaperone core contains a trypsin-like
  serine endoprotease domain followed by two PDZ domains that regulate substrate
  binding, allosteric activation, and the conversion of resting hexamers into
  larger active cages. DegP processively degrades misfolded proteins, including
  unfolded beta-barrel outer-membrane proteins, during envelope stress and after
  heat shock. It can also act as a temperature-switched chaperone, with
  chaperone activity favored at lower temperature and proteolysis favored at
  elevated temperature, and can associate peripherally with the periplasmic face
  of the inner membrane.
