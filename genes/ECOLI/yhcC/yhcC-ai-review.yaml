core_functions:
- description: >-
    YhcC removes the carboxymethyl moiety from 5-carboxymethylaminomethyl-2-thiouridine at
    position 34 of tRNA, giving 5-aminomethyl-2-thiouridine, using radical SAM chemistry: its
    [4Fe-4S] cluster reductively cleaves SAM to the 5'-deoxyadenosyl radical. The product is
    then methylated by the MnmC2 domain to the mature wobble modification mnm5s2U. Because
    the alternative MnmC1 flavin route requires oxygen, this is the route cells use under
    anaerobic growth.
