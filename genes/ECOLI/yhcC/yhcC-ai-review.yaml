proposed_new_terms:
- proposed_name: tRNA 5-carboxymethylaminomethyl-2-thiouridine(34) demodifying activity
  proposed_definition: >-
    Catalysis of the removal of the carboxymethyl group from
    5-carboxymethylaminomethyl-2-thiouridine at position 34 of a tRNA, converting it to
    5-aminomethyl-2-thiouridine(34). The reaction requires S-adenosyl-L-methionine and a
    [4Fe-4S] cluster: the cluster reductively cleaves S-adenosyl-L-methionine to
    L-methionine and a 5'-deoxyadenosyl radical, which initiates cleavage of the
    carbon-nitrogen bond of the substrate side chain. The full stoichiometry and the
    identity of the released carbon fragment have not been determined.
  justification: >-
    This is the reaction of E. coli YhcC and of its Gram-positive orthologue MnmL, the
    oxygen-independent route to the wobble modification mnm5s2U. GO has no matching term:
    QuickGO and OLS searches (2026-10-19) for "carboxymethylaminomethyl",
    "5-aminomethyl-2-thiouridine", "cmnm5" and "methylaminomethyl" return only GO:0004808,
    the subsequent MnmC2 methylation, and GO:0141102, an unrelated ribose
    methyltransferase. The enzyme that performs the same demodification aerobically, the
    MnmC1 domain of E. coli MnmC, is annotated only to the broad class GO:0016645
    oxidoreductase activity, acting on the CH-NH group of donors, which does not fit a
    radical SAM enzyme using SAM rather than a flavin and an electron acceptor. The term
    should sit under GO:0140101 catalytic activity, acting on a tRNA.
  proposed_parent:
    id: GO:0140101
    label: catalytic activity, acting on a tRNA
  proposed_mappings:
  - predicate: skos:closeMatch
    target_term:
      id: RHEA:72279
      label: 5-carboxymethylaminomethyl-2-thiouridine(34) in tRNA + A + H2O = 5-aminomethyl-2-thiouridine(34)
        in tRNA + glyoxylate + AH2
  supported_by:
  - reference_id: PMID:42239373
    supporting_text: providing direct in vitro evidence that YhcC catalyzes the cmnm5s2U to nm5s2U reaction on tRNA
  - reference_id: PMID:38551342
    supporting_text: a member of the YtqA subgroup of the radical Sam superfamily was found to be involved in the synthesis of mnm5s2U in both Bacillus subtilis and Streptococcus mutans
knowledge_gaps:
- gap_statement: >-
    The chemical mechanism of the YhcC reaction is not established: what happens to the
    carbon fragment removed from the cmnm5s2U side chain, how many equivalents of SAM are
    consumed per turnover, and whether the released product is glyoxylate as in the
    flavin-dependent MnmC1 route are all unknown.
  boundary: >-
    Established: purified, [4Fe-4S]-reconstituted YhcC converts cmnm5s2U(34) to nm5s2U on
    tRNA in a SAM-dependent reaction, binds tRNA with a dissociation constant near
    5 micromolar, and cleaves SAM to methionine and 5'-deoxyadenosine with a chemical
    reductant. No product other than the modified tRNA has been identified and no kinetic
    or isotope-labelling analysis has been reported.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: >-
    The stoichiometry decides whether YhcC is a true catalyst or consumes SAM per turnover,
    and identifying the released fragment would show how a radical enzyme accomplishes a
    transformation that the aerobic route performs by flavin-dependent oxidation.
  resolution: >-
    Quantify 5'-deoxyadenosine, methionine and candidate small products such as glyoxylate
    or formaldehyde per nm5s2U formed, using isotopically labelled substrate tRNA and the
    reconstituted enzyme, and determine steady-state kinetics.
  provenance:
  - reference_id: PMID:42239373
    supporting_text: These reactions showed a clear YhcC- and SAM-dependent consumption of substrate cmnm5s2U over time
- gap_statement: >-
    The physiological consequence of losing the anaerobic route is not defined: no growth or
    translational-fidelity phenotype of a yhcC single mutant has been reported, so it is
    unknown what the modification contributes to anaerobic life beyond its presence.
  boundary: >-
    Established: yhcC is FNR-activated and is required for mnm5s2U synthesis under anoxic
    growth, while aerobically grown yhcC mutants make mnm5s2U normally. Reported phenotypes
    concern the modification profile, not fitness or decoding.
  gap_kind:
  - BIOLOGY
  dark_aspect: BP_DARK
  status: OPEN
  significance: >-
    Wobble modifications tune decoding of split codon boxes; whether their loss specifically
    impairs anaerobic growth, motility or stress survival would show why E. coli maintains a
    second, oxygen-independent enzyme for this step.
  resolution: >-
    Compete yhcC mutants against wild type under anaerobic and fermentative conditions, and
    measure frameshifting, missense suppression and proteome-wide translation rates in the
    mutant grown anaerobically.
  provenance:
  - reference_id: PMID:42239373
    supporting_text: is positively regulated by the FNR (fumarate and nitrate reductase regulation) transcription factor in anaerobic growth
suggested_questions:
- question: >-
    What is the fate of the carbon fragment removed from cmnm5s2U by YhcC, and how many
    equivalents of S-adenosyl-L-methionine are consumed per modified tRNA?
  experts:
  - Patricia C Dos Santos
  - Jeffrey S Mugridge
  - Squire J Booker
- question: >-
    Does YhcC act on a defined subset of tRNAs, and does it require the 2-thio group of the
    substrate, given that only thiolated species were detected in vivo?
  experts:
  - Valerie de Crecy-Lagard
  - Jeffrey S Mugridge
- question: >-
    Should the gene be renamed mnmL, as the authors propose, and is the E. coli enzyme
    functionally interchangeable with B. subtilis MnmL in vivo?
  experts:
  - Valerie de Crecy-Lagard
suggested_experiments:
- hypothesis: YhcC catalyses carbon-nitrogen bond cleavage of the cmnm5s2U side chain with
    release of a two-carbon fragment.
  description: >-
    React reconstituted YhcC with tRNA carrying cmnm5s2U labelled in the carboxymethyl
    group, and quantify 5'-deoxyadenosine, methionine and labelled small molecules by
    LC-MS and NMR, establishing stoichiometry and the identity of the released fragment.
  experiment_type: anaerobic enzymology with isotope labelling
- hypothesis: The anaerobic route via YhcC is needed for fitness and accurate decoding
    without oxygen.
  description: >-
    Grow wild-type, yhcC, mnmC and double mutants anaerobically in competition and in
    defined media, and measure growth rate, codon-specific translational fidelity with
    reporter assays and ribosome profiling.
  experiment_type: competitive fitness and translational fidelity assays
- hypothesis: YhcC selects substrate tRNAs by recognising the anticodon stem loop and the
    2-thio group.
  description: >-
    Measure binding and turnover of reconstituted YhcC with individual in vitro transcribed
    tRNAs bearing cmnm5U or cmnm5s2U and with anticodon-loop variants, to define substrate
    specificity.
  experiment_type: in vitro substrate specificity profiling
