gene_symbol: yhcC
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  YhcC is a 309-residue radical S-adenosyl-L-methionine (SAM) enzyme of the Elp3/MiaB/NifB-like
  clan and the E. coli orthologue of the Gram-positive tRNA-modifying enzyme MnmL. It binds
  one [4Fe-4S] cluster through three cysteines (Cys33, Cys45, Cys48) and reductively cleaves
  SAM to methionine and 5'-deoxyadenosine. YhcC acts in the biosynthesis of the wobble-base
  modification 5-methylaminomethyl-2-thiouridine (mnm5s2U) of tRNA: it binds tRNA and
  converts the MnmEG product 5-carboxymethylaminomethyl-2-thiouridine at position 34
  (cmnm5s2U) into 5-aminomethyl-2-thiouridine (nm5s2U), which the MnmC2 methyltransferase
  domain then methylates to mnm5s2U. This route operates anaerobically: the flavin-dependent
  MnmC1 domain that performs the same demodification needs molecular oxygen, so cells grown
  without oxygen depend on YhcC, whose gene is activated by the anaerobic regulator FNR,
  while aerobically grown cells lacking YhcC are unaffected. The enzyme is cytoplasmic and
  its oxygen-sensitive cluster chemistry provides E. coli with an oxygen-independent
  counterpart to a flavoenzyme step, a pattern it also uses in heme and deoxyribonucleotide
  synthesis. On the strength of this assignment the gene has been proposed for renaming to
  mnmL.
