id: P37759
gene_symbol: rfbB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  rfbB (rmlB, b2041) encodes dTDP-glucose 4,6-dehydratase 1 (RmlB) of Escherichia coli K-12, an NAD(+)-dependent
  member of the extended short-chain dehydrogenase/reductase (NAD(P)-dependent epimerase/dehydratase)
  family. It converts dTDP-alpha-D-glucose to dTDP-4-dehydro-6-deoxy-alpha-D-glucose through a tightly
  bound NAD(+) that oxidises C4, allows elimination of water across C5-C6 and re-reduces the intermediate.
  This is the second step of dTDP-L-rhamnose biosynthesis, and the 4-keto-6-deoxy product is also the
  branch-point precursor of other 6-deoxy and 4-amino-4,6-dideoxy dTDP-sugars. RfbB is encoded in the
  rfb (O16 antigen) cluster; a paralogous dehydratase, RffG, is encoded in the enterobacterial common
  antigen cluster.
