    summary: >-
      Rank 3 (score 12.75). This is the same term that was clearly wrong for FtsI, and for MrdA it
      is genuinely harder: GOA carries peptidoglycan L,D-transpeptidase activity for MrdA by IBA and
      IDA, and L,D-transpeptidases perform both 3-3 cross-links and peptidoglycan-protein attachment.
      So an L,D-type reaction is on the record for this protein even though this review treats the
