  predicted_term_type: GO_BP
  review:
    assessment: NPI
    confidence_score: 0
    error_type: PARALOG_OVERANNOTATION
    summary: >-
      Top-ranked hit (score 13.42). MrdA binds beta-lactams covalently at Ser330 and is inhibited
      by them; it does not metabolise penicillin. Penicillin metabolic process belongs to beta-lactamases
      and penicillin biosynthetic enzymes. Being a drug target is not the same as acting on the drug,
      and the distinction matters because it is exactly what separates PBPs from resistance enzymes.
