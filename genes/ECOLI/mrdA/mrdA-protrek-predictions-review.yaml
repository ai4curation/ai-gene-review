  label: Escherichia coli (strain K12)
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for MrdA (PBP2), the elongasome D,D-transpeptidase that determines
  rod shape. Rank 2 is the exact core molecular function and rank 5 the annotated process, so the
  enzymology is recovered; rank 1 mistakes penicillin binding for penicillin metabolism, which is
  the beta-lactamase function rather than the PBP one. Scores are low throughout (13.4 to 12.3), and
  ProTrek's own free-text top hit is a PBP 'with an unknown catalytic activity' that discusses beta-lactamases
  - the same conflation. Assessment: 1 correct not novel (CNN), 1 uncertain (UNC), 1 nonparalog incorrect
  (NPI).
