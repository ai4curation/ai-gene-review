        comment: >-
          The NrdG-clade node is correctly placed for clade membership, but its process
          assertion rests on the nrdG knockout (necessity) and attributes the reductase
          subunit's process to the activase that modifies it.
      - source_id: UniProtKB:P0A9N8
        source_status: SOURCE_WEAK_OR_INFERRED
