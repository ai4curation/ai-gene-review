proposed_new_terms:
- proposed_name: '[anaerobic ribonucleoside-triphosphate reductase]-activating enzyme activity'
  proposed_definition: >-
    Catalyzes the activation of anaerobic (class III) ribonucleoside-triphosphate reductase by
    generating an organic free radical on a specific glycine residue of the reductase, via
    homolytic cleavage of S-adenosyl-L-methionine, in the reaction S-adenosyl-L-methionine +
    reduced flavodoxin + [anaerobic ribonucleoside-triphosphate reductase]-glycine =
    5'-deoxyadenosine + L-methionine + flavodoxin semiquinone + [anaerobic
    ribonucleoside-triphosphate reductase]-glycin-2-yl radical + H+.
  justification: >-
    GO:0043364 glycyl-radical enzyme activating activity has substrate-specific children for the
    pyruvate formate-lyase activase (GO:0043365) and the choline trimethylamine-lyase activase
    (GO:0140111), but none for NrdG, the activase of the class III ribonucleotide reductase and
    the second founding member of the family (QuickGO children of GO:0043364, checked
    2026-10-19). The missing sibling leaves NrdG annotated only to the generic parent and
    encourages InterPro2GO to map the NrdG family signature to the PFL activase term instead.
  proposed_parent:
    id: GO:0043364
    label: glycyl-radical enzyme activating activity
suggested_questions:
- question: Does NrdG remain bound to NrdD during ribonucleotide reduction in vivo, or does it
    dissociate after radical installation as the catalytic activation in vitro suggests?
- question: How does NrdG distinguish NrdD Gly681 from the glycyl radical sites of PflB and the
    other E. coli glycyl radical enzymes, given its homology to the PflA activase?
suggested_experiments:
- hypothesis: NrdG acts catalytically in vivo, so cellular NrdG is substoichiometric to NrdD and
    the two dissociate after activation.
  description: Quantify NrdD and NrdG copy numbers in anaerobic cells by targeted proteomics, and
    test by in-cell crosslinking or co-immunoprecipitation whether NrdG stays bound to glycyl
    radical-bearing NrdD.
