- term:
    id: GO:0009265
    label: 2'-deoxyribonucleotide biosynthetic process
  evidence_type: NAS
  original_reference_id: PMID:8954104
  qualifier: involved_in
  review:
    summary: Author statement that nrdDG encodes the anaerobic ribonucleotide reductase, used to
      place NrdG in deoxyribonucleotide synthesis.
    action: MARK_AS_OVER_ANNOTATED
    reason: NrdG is necessary for anaerobic deoxyribonucleotide supply, but it does none of the
      work of the process. NrdD binds the ribonucleotides and reduces them, while NrdG installs
      the glycyl radical cofactor on NrdD and is not needed for each turnover. One NrdG
      activates several NrdD molecules (PMID:10531327). By the participation test, NrdG acts
      upstream, as a protein-modifying enzyme, of the process NrdD carries out. Its own
      process is the modification of NrdD (GO:0018201 peptidyl-glycine modification and
      GO:0051604 protein maturation, added as NEW rows). The comparator check agrees. PflA, the
      founding activase, carries no pyruvate fermentation term in GOA. NrdI, which activates the
      class Ib reductase cofactor, carries no deoxyribonucleotide biosynthesis term (QuickGO,
      checked 2026-10-19). The claim is not false at the level of the NrdDG system, so the row
      is marked as an over-annotation rather than removed.
    supported_by:
    - reference_id: PMID:10531327
      supporting_text: 'The enzyme system consists of two proteins: protein alpha, on which ribonucleotides
        bind and are reduced, and protein beta, of which the function is to introduce a catalytically
        essential glycyl radical on protein alpha.'
    - reference_id: PMID:8954104
      supporting_text: The aerobic enzyme is coded by the nrdAB genes, the anaerobic enzyme by
        nrdDG.
