  review:
    summary: NrdG converts inactive NrdD into its catalytically active glycyl-radical form.
    action: NEW
    reason: Radical installation is the step by which NrdD attains its full functional capacity,
      which matches the definition of GO:0051604. PAINT places protein maturation on the PflA
      activase node and PflA carries it by IDA, so adding it here keeps the two founding
