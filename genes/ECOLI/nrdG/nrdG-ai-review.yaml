    summary: NrdG converts Gly681 of NrdD into a glycyl radical, a post-translational
      modification of a peptidyl-glycine.
    action: NEW
    reason: GO has no glycyl radical formation term, and the modification is represented by
      GO:0018201 peptidyl-glycine modification. PAINT places this term on the PflA activase node
      (PTN002018048) and PflA carries it by IDA, but NrdG has no row for it. Participation test.
      NrdG is the enzyme that performs the modification, abstracting the Gly681 hydrogen via the
      5'-deoxyadenosyl radical it generates, so it does the work of the process rather than
      being its substrate. Comparator check. The paralogous activase PflA, in the same role
      toward PflB Gly734, carries this term (IBA and IDA), and the substrate proteins (NrdD,
      PflB) would not qualify. The term is neither an ancestor nor a descendant of GO:0051604.
    supported_by:
    - reference_id: PMID:9305874
      supporting_text: Here, we demonstrate that AdoMet is directly reduced by the Fe-S center
        of beta2 during the activation of the enzyme, resulting in methionine and glycyl radical
        formation.
    - reference_id: PMID:8621608
      supporting_text: with a stable, oxygen-sensitive radical located at Gly-681 of the 80-kDa
        polypeptide chain
