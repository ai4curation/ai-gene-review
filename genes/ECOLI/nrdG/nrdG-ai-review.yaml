  review:
    summary: PAINT inference placing the NrdG clade in nucleotide interconversion, seeded by the
      nrdG knockout annotation.
    action: MARK_AS_OVER_ANNOTATED
    reason: NrdG lies inside the NrdG clade (PTN001576428), so the node placement is not the
      issue. The issue is the term. The node asserts that the activase takes part in converting
      ribonucleotides to deoxyribonucleotides, which is NrdD's chemistry. NrdG acts upstream of
