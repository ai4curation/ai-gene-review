  review:
    summary: Contributes-to annotation of class I/II ribonucleoside-diphosphate reductase
      (thioredoxin) activity, based on the anaerobic growth defect of an nrdG knockout.
    action: REMOVE
    reason: This term is wrong for the class III system on two counts. First, NrdD is a
      ribonucleoside-triphosphate reductase, distinct from the aerobic ribonucleoside-diphosphate
      reductase that GO:0004748 describes (PMID:1460049). Second, NrdG does not contribute to
      the reduction chemistry. It is a catalytic activase that installs the glycyl radical on
      NrdD and can activate several NrdD molecules (PMID:10531327), so even the correct
      ribonucleoside-triphosphate reductase term would belong to NrdD. The knockout result
      (PMID:8954104) shows that nrdG is necessary for anaerobic growth, not which activity it
      has. NrdG's own activity is captured by GO:0043364.
    supported_by:
