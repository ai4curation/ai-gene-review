id: P0A9N8
gene_symbol: nrdG
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  NrdG is the activating enzyme (activase) of the class III anaerobic ribonucleotide reductase
  of Escherichia coli. It is a small cytoplasmic radical SAM protein of the organic
  radical-activating enzyme family that carries one oxygen-labile [4Fe-4S] cluster, ligated by
  the three cysteines of a CxxxCxxC motif with S-adenosyl-L-methionine (SAM) bound at the fourth
  iron. Using reduced flavodoxin as electron donor, the reduced cluster cleaves SAM to
  methionine and a 5'-deoxyadenosyl radical, which abstracts a hydrogen atom from Gly681 of the
  catalytic subunit NrdD and so installs the stable glycyl radical that NrdD needs to reduce
  ribonucleoside triphosphates to deoxyribonucleoside triphosphates. NrdG binds NrdD tightly in
  an alpha2beta2 assembly but acts catalytically, one NrdG activating several NrdD molecules.
  The nrdDG system supplies deoxyribonucleotides during strict anaerobic growth, and nrdG null
  mutants cannot grow without oxygen.
