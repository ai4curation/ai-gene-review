id: P76440
gene_symbol: preT
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  preT (yeiT, b2146) encodes the electron-input subunit of the NAD-dependent
  dihydropyrimidine dehydrogenase of Escherichia coli. PreT and PreA form a
  cytoplasmic heterotetramer (two PreT, two PreA) that reduces uracil and
  thymine to 5,6-dihydrouracil and 5,6-dihydrothymine with NADH, and catalyses
  the reverse dehydrogenation. PreT is homologous to the N-terminal NAD(P)H/FAD
  and iron-sulfur region of single-chain eukaryotic DPYD: it carries an
  FAD/NAD-binding domain, the dihydropyrimidine dehydrogenase domain II and a
  helical ferredoxin-like iron-sulfur region that pass electrons from NADH to
  the FMN- and pyrimidine-binding PreA subunit. The enzyme is required for
  dihydrouracil production in vivo, although E. coli lacks the downstream
  dihydropyrimidinase and beta-ureidopropionase steps of the reductive
  pathway, so its physiological role is in pyrimidine pool control rather than
  pyrimidine-base utilization.
