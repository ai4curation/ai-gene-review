suggested_questions:
- question: >-
    Given that E. coli lacks dihydropyrimidinase and beta-ureidopropionase, what
    is the fate of the 5,6-dihydrouracil that PreT-PreA produces, and does it
    explain the swarming phenotype reported for preA mutants?
suggested_experiments:
- description: >-
    Metabolite profiling of preT and preA deletion strains for uracil,
    dihydrouracil and downstream products under swarming and planktonic growth.
  experiment_type: metabolomics
