id: P0ACB0
gene_symbol: dnaB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: DnaB is the hexameric replicative DNA helicase of Escherichia coli. Nucleoside-triphosphate
  hydrolysis powers movement along single-stranded DNA in the 5′ to 3′ direction, separating parental
  strands ahead of the replication machinery. DnaC loads DnaB at initiation and during replication restart.
  DnaB also organizes and stimulates DnaG primase, coupling template unwinding to RNA-primer synthesis.
