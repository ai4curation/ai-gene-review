  label: Escherichia coli K-12
description: >-
  panD (b0131) encodes L-aspartate 1-decarboxylase (aspartate alpha-decarboxylase), the pyruvoyl-dependent
  enzyme that converts L-aspartate to beta-alanine and CO2 and so supplies the beta-alanine moiety of
  pantothenate in Escherichia coli. PanD is made as an inactive pi-proenzyme that self-cleaves at a Gly-Ser
  bond to give a beta-subunit and an alpha-subunit carrying an N-terminal pyruvoyl group formed from the
  serine; the active enzyme is a cytosolic tetramer of alpha/beta pairs. Processing and activity are stimulated
  and regulated by the CoA-binding protein PanZ, which couples beta-alanine supply to CoA levels. panD
  mutants are defective in beta-alanine synthesis and require beta-alanine or pantothenate.
