- term:
    id: GO:0016540
    label: protein autoprocessing
  evidence_type: IDA
  original_reference_id: PMID:9169598
  qualifier: acts_upstream_of_or_within
  review:
    summary: PanD self-cleaves from an inactive pi-proenzyme to form its pyruvoyl cofactor.
    action: KEEP_AS_NON_CORE
    reason: >-
      Autocatalytic serinolysis of the proenzyme generates the active alpha and beta subunits and the
      N-terminal pyruvoyl group; the protein itself performs this processing, so GO:0016540 protein autoprocessing
      is correct. It is a maturation step that enables, rather than constitutes, the decarboxylase function.
    supported_by:
    - reference_id: PMID:9169598
      supporting_text: >-
        which is proteolytically cleaved at a specific X-Ser bond to produce a beta-subunit with XOH at
        its C-terminus and an alpha-subunit with a pyruvoyl group at its N-terminus, derived from the
        serine
    - reference_id: file:ECOLI/panD/panD-uniprot.txt
      record_section: ["CC:PTM"]
      supporting_text: >-
        Is synthesized initially as an inactive proenzyme, which is activated by self-cleavage at a specific
        serine bond
