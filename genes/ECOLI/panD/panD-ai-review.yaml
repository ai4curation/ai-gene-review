  review:
    summary: >-
      Aspartate 1-decarboxylase is the core activity of PanD, assayed directly in E. coli extracts and
      on the purified recombinant enzyme.
    action: ACCEPT
    reason: >-
      Aspartate decarboxylation to beta-alanine was detected in E. coli extracts and is absent from panD
      mutants, and the recombinant enzyme was purified, kinetically characterized and shown to carry pyruvoyl
      groups. IBA (PAINT node PTN000470402) and IEA (InterPro/HAMAP) rows agree.
    supported_by: &id001
