- term:
    id: GO:0006523
    label: alanine biosynthetic process
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000470402
  - UniProtKB:P9WIL3
  review:
    summary: >-
      PanD makes beta-alanine, not alpha-alanine; the alanine term should be the beta-alanine biosynthetic
      process.
    action: MODIFY
    reason: >-
      GO:0006523 alanine biosynthetic process is defined as formation of alanine, 2-aminopropanoic acid
      (the alpha-amino acid). PanD forms beta-alanine (3-aminopropanoic acid), which GO represents separately
      as GO:0019483 beta-alanine biosynthetic process, a sibling under non-proteinogenic amino acid biosynthesis
      rather than a child of alanine biosynthesis. The IBA and InterPro2GO rows therefore carry the wrong
      amino acid isomer.
    proposed_replacement_terms: &id005
    - id: GO:0019483
      label: beta-alanine biosynthetic process
    propagation_review: &id006
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
