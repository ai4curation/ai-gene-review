suggested_questions:
- question: Is FAICAR channelled between the transformylase and cyclohydrolase sites of E. coli PurH,
    as proposed for the avian and human ATIC dimers?
suggested_experiments:
- description: Purify E. coli PurH and measure each half-reaction separately with site-directed mutants
    to test whether FAICAR is released or channelled.
