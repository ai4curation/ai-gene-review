id: P15639
gene_symbol: purH
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: 'PurH is the bifunctional AICAR transformylase/IMP cyclohydrolase of Escherichia coli, a
  soluble cytosolic enzyme that catalyses the last two steps of de novo IMP biosynthesis: formylation
  of 5-aminoimidazole-4-carboxamide ribonucleotide (AICAR) with 10-formyltetrahydrofolate to FAICAR, and
  cyclodehydration of FAICAR to IMP. It is encoded with purD in the purHD operon.'
