id: P62623
gene_symbol: ispH
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: IspH (LytB) is the cytosolic, homodimeric [4Fe-4S] enzyme that catalyses the last step of
  the 2-C-methyl-D-erythritol 4-phosphate (MEP) pathway in Escherichia coli. It reductively dehydroxylates
  (E)-4-hydroxy-3-methylbut-2-enyl diphosphate (HMBPP), made by IspG, into a roughly 5:1 mixture of
  isopentenyl diphosphate (IPP) and dimethylallyl diphosphate (DMAPP), the universal C5 building blocks
  of isoprenoids such as quinone side chains and the undecaprenyl carrier lipid. The substrate's hydroxyl
  coordinates the unique iron of the cluster held by Cys12, Cys96 and Cys197; electrons come from the flavodoxin
  system, and Glu126 donates the proton for water elimination. The cluster readily degrades to a [3Fe-4S]
  form in air. The gene is essential; mutants survive only when given a mevalonate bypass.
