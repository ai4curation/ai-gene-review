  review:
    summary: A [3Fe-4S] cluster was seen in purified and crystallized IspH, but it is the oxygen-degraded
      form of the catalytic [4Fe-4S] cluster.
    action: MARK_AS_OVER_ANNOTATED
    reason: The 2009 structure (title-only cache) and earlier EPR resolved a [3Fe-4S] cluster, which is
      a real observation. Later structures show substrate bound to a [4Fe-4S] cluster, with [3Fe-4S] forms
      seen only in product or pyrophosphate complexes, and UniProt records that the [4Fe-4S] cluster degrades
      in the presence of oxygen. The functional cofactor is the [4Fe-4S] cluster (GO:0051539, accepted);
      the [3Fe-4S] binding is real in vitro but not the activity the enzyme evolved for. Not removed because
      it rests on direct experimental observation.
