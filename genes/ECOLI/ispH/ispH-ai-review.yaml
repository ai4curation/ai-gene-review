suggested_questions:
- question: GO:0051745 is defined with [2Fe-2S] ferredoxin as electron donor, but E. coli IspH is reduced
    by the flavodoxin system. Should the definition be made carrier-neutral (matching its label), or should
    a flavodoxin-specific sibling be created as was done for IspG (GO:0141197)?
- question: Is flavodoxin I (FldA) the sole physiological electron donor to IspH in vivo, as it is for
    IspG, or can E. coli ferredoxin substitute?
suggested_experiments:
- description: Measure IspH activity in extracts or with purified proteins from fldA-depleted strains carrying
    an HMBPP-supplying bypass, with and without added FldA or Fdx, to establish the physiological electron
    donor of IspH.
