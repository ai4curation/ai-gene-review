- term:
    id: GO:0046961
    label: proton-transporting ATPase activity, rotational mechanism
  evidence_type: IMP
  original_reference_id: PMID:158358
  qualifier: enables
  review:
    summary: uncD mutant membranes lack ATPase activity (four of five alleles) and are uncoupled. The
      F1Fo complex can run in reverse, hydrolysing ATP to pump protons when the PMF is low.
    action: KEEP_AS_NON_CORE
    reason: A real, retained capacity of the complex, used in E. coli when respiration is not available,
      but the reverse of the main physiological direction. Consistent with the PTHR15184 family review,
      which treats ATP hydrolysis as a retained non-core F-type capacity.
    supported_by:
    - reference_id: PMID:158358
      supporting_text: ATPase activity was absent in the other four strains and the abnormal beta-subunits
        were tightly bound to the membranes.
    - reference_id: PMID:21602818
      supporting_text: Rotational coupling is reversible and, if PMF drops below the energetic threshold
        needed to drive ATP synthesis, net ATP hydrolysis by the alternating catalytic sites on F1 can
        drive reverse rotation of γ and the c–ring of FO, thus pumping protons across the membrane in
        the opposite direction.
