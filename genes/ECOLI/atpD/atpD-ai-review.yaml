core_functions:
- description: Catalytic subunit of the F1 sector of the inner-membrane F1Fo ATP synthase. Beta carries
    the catalytic nucleotide sites of the alpha3beta3 hexamer; gamma rotation driven by proton flow through
    Fo cycles the three beta subunits through the binding-change states to make ATP from ADP and phosphate.
  molecular_function:
