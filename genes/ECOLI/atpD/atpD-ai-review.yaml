taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: 'AtpD (uncD, b3732) is the beta subunit of the F1Fo ATP synthase of Escherichia coli, the
  catalytic subunit of the enzyme. Three beta subunits alternate with three alpha subunits (AtpA) in the
  alpha3beta3 hexamer of the F1 sector, which is attached to the cytoplasmic face of the inner membrane
  through the central (gamma, epsilon) and peripheral (delta, b2) stalks. Each catalytic site lies at
  an alpha/beta interface and is formed mainly by beta, including the Walker A lysine and threonine (Lys155,
  Thr156), the catalytic glutamate Glu181 and the adenine-stacking Tyr331. Proton flow through Fo rotates
  the gamma subunit inside the hexamer, which drives each beta in turn through the conformations of the
  binding-change cycle, coupling the proton motive force to ATP synthesis; crosslinking of the beta DELSEED
  loop to gamma gave early biochemical proof of this rotation in E. coli F1. The reaction is reversible:
  when the proton motive force is low, ATP hydrolysis by beta drives reverse rotation and proton pumping.
  Beta is also needed for assembly of the alpha3beta3gamma core, and its catalysis is inhibited in the
  bacterial enzyme by the extended C-terminal domain of epsilon.'
