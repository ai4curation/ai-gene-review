    label: proton-transporting ATP synthase complex
  supported_by:
  - reference_id: PMID:21602818
    supporting_text: Subunit γ forms the main, asymmetric shaft of F1’s rotor, and transport-driven rotation
      of γ relative to the surrounding α3β3 complex of F1 drives alternating conformational changes in
      the three catalytic β subunits to drive net synthesis of ATP1–3.
  - reference_id: PMID:7479919
    supporting_text: The results demonstrate that gamma subunit rotates relative to the beta subunits
      during catalysis.
  - reference_id: PMID:1832155
    supporting_text: a beta Thr156----Ala or Cys mutation impaired ATPase activity, suggesting that the
      hydroxyl moiety at position 156 is essential for the catalytic activity
