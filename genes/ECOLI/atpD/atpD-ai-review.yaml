    id: GO:0005524
    label: ATP binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - InterPro:IPR000194
  - InterPro:IPR020003
  - UniRule:UR000101855
  review:
    summary: Walker A motif GGAGVGKT (UniProt 150-157); beta binds Mg-nucleotide at the catalytic sites.
    action: ACCEPT
    reason: Nucleotide binding at the catalytic site is a direct property of beta. Replacing the Walker
      A threonine (Thr156, literature numbering) impairs ATPase activity (PMID:1832155), its hydroxyl being essential for catalysis, and uncD mutations
      change the affinity of the first catalytic site for ATP (PMID:2859284).
    supported_by:
    - reference_id: PMID:1832155
      supporting_text: a beta Thr156----Ala or Cys mutation impaired ATPase activity, suggesting that
        the hydroxyl moiety at position 156 is essential for the catalytic activity
    - reference_id: PMID:2859284
      supporting_text: Both mutant enzymes showed reduced affinity for ATP at the first catalytic site.
