- term:
    id: GO:0006355
    label: regulation of DNA-templated transcription
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR013767
  review:
    summary: InterPro PAS fold mapping to regulation of DNA-templated transcription.
    action: KEEP_AS_NON_CORE
    reason: NtrB controls transcription of ntr genes only indirectly, by setting the phosphorylation state
      of the DNA-binding activator NtrC; NtrB itself does not bind DNA. The process is biologically accurate
      in the broad sense (NRII is required for glnAp2 transcription in vitro) but peripheral to its molecular
      role, which is better captured by phosphorelay signal transduction system and signal transduction
      involved in regulation of gene expression.
    supported_by:
    - &id007
      reference_id: PMID:2874557
      supporting_text: On the basis of this evidence, we propose that NRI-phosphate activates transcription
        from nitrogen-regulated promoters and that the role of NRII is control of the formation and breakdown
        of NRI-phosphate in response to cellular signals of nitrogen availability.
    - reference_id: PMID:3536843
      supporting_text: In vitro transcription of the nitrogen-regulated promoter glnAp2 by purified components
        of Escherichia coli required NRII or NRII2302 when the template DNA was linear.
