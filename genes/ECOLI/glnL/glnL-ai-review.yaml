suggested_questions:
- question: Is NtrB a true NtrC-P phosphatase with its own catalytic chemistry, or does PII-bound NtrB
    act mainly by stimulating the intrinsic autodephosphorylation of the NtrC receiver domain?
- question: What, if any, signal is sensed by the N-terminal PAS domain of NtrB, independently of PII?
- question: Does GlnK regulate NtrB as effectively as GlnB in vivo, and under what nitrogen conditions
    does each PII paralog dominate control of NtrB?
suggested_experiments:
- description: Compare dephosphorylation of NtrC-P by wild-type NtrB versus H139 and HATPase_c point mutants,
    with and without GlnB and 2-ketoglutarate, using rapid-quench kinetics.
  hypothesis: PII-stimulated NtrC-P dephosphorylation requires specific transmitter-domain residues, distinguishing
    a catalytic phosphatase from a passive stimulator of receiver autodephosphorylation.
  experiment_type: In vitro enzyme kinetics with site-directed mutants
- description: Screen for small-molecule ligands of the purified NtrB PAS domain and test PAS-domain mutants
    for altered ntr gene expression in vivo.
  hypothesis: The PAS domain modulates NtrB activity through a signal or ligand independent of PII.
  experiment_type: Ligand screening and reporter assays
