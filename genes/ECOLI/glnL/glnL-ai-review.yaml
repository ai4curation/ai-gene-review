id: P0AFB5
gene_symbol: glnL
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: Nitrogen regulator II (NRII, NtrB) of Escherichia coli is the soluble cytoplasmic sensor
  histidine kinase/phosphatase of the NtrB/NtrC two-component system that controls nitrogen-regulated
  (ntr) gene expression. It contains an N-terminal PAS domain and a C-terminal transmitter (HisKA dimerisation/phosphoacceptor
  domain with His139, and HATPase_c ATP-binding domain). Under nitrogen limitation NtrB autophosphorylates
  on His139 using ATP and transfers the phosphoryl group to Asp54 of the response regulator NtrC (NRI),
  whose phosphorylated form activates sigma-54-dependent transcription of glnA and other ntr genes. When
  nitrogen is sufficient, the unmodified PII signal transduction protein GlnB (and GlnK) binds the NtrB
  kinase domain, inhibiting autophosphorylation and stimulating dephosphorylation of NtrC-phosphate; this
  interaction is allosterically controlled by 2-ketoglutarate and prevented by PII uridylylation, so NtrB
  couples the cellular glutamine/2-ketoglutarate signal to NtrC activity.
