id: P39829
gene_symbol: garD
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  GarD is the iron-dependent galactarate dehydratase (L-threo-forming) of E.
  coli. It dehydrates galactarate (mucate) to 5-dehydro-4-deoxy-D-glucarate
  (5-keto-4-deoxy-D-glucarate, KDG), the committed entry step of galactarate
  catabolism. KDG is the same intermediate that glucarate dehydratase GudD
  produces. GarD belongs to the UxaA (altronate/galactarate dehydratase)
  family; its structure was described as that of an unusual enolase with a
  novel protein fold, distinct from the enolase-superfamily fold of GudD. It is a homodimer;
  each subunit has an N-terminal SAF beta-clip domain, a dimerization domain
  and a C-terminal catalytic domain with a novel Rossmann-like fold. The garD
  gene is induced by galactarate, D-glucarate and D-glycerate through the SdaR
  regulator.
