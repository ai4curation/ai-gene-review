    label: ferrous iron binding
  evidence_type: IDA
  original_reference_id: PMID:9772162
  qualifier: enables
  review:
    summary: GarD requires Fe2+ as its catalytic metal cofactor.
    action: ACCEPT
    reason: >-
      UniProt records Fe(2+) as the experimentally determined cofactor, and the
      later structural study confirmed activity only under reducing conditions
      in the presence of iron. The cached 1998 abstract does not mention iron,
      but the curators read the full text, and the iron dependence is
      independently corroborated, so the cofactor-binding annotation is
      accepted.
    supported_by:
    - reference_id: PMID:31811683
      supporting_text: >-
        The activity of GarD was corroborated by
        the production of 5-keto-4-deoxy-D-glucarate under reducing conditions and in
        the presence of iron.
