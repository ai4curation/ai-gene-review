  label: Escherichia coli K-12
description: >-
  betT (b0314) encodes the high-affinity choline transporter of Escherichia coli, a secondary carrier
  of the betaine/choline/carnitine transporter (BCCT) family driven by the proton-motive force. It has
  12 transmembrane segments in the cytoplasmic membrane, with a short cytoplasmic N-terminus and a long
  cytoplasmic C-terminal domain. BetT activity rises about tenfold on hyperosmotic upshock, and C-terminal
  truncations block this activation. BetT supplies intracellular choline to the BetA-BetB pathway that
  makes the osmoprotectant glycine betaine. betT is transcribed divergently from betIBA, and both transcripts
  are induced by osmotic stress and choline.
