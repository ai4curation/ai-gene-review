id: P19636
gene_symbol: eutC
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  EutC is the small (beta) subunit of adenosylcobalamin (coenzyme B12)-dependent
  ethanolamine ammonia-lyase, which converts ethanolamine into acetaldehyde and
  ammonium in the first step of ethanolamine utilization. Six EutB/EutC
  heterodimers form the alpha6-beta6 holoenzyme. EutC carries no active site of
  its own: the catalytic barrel is in EutB, and EutC covers the lower face of
  the cobalamin cofactor bound at the subunit interface, contributing direct
  cofactor contacts. Its N-terminal segment is dispensable for catalysis and, in
  the Salmonella ortholog, acts as a signal that targets the enzyme to the
  ethanolamine-utilization microcompartment through the shell protein EutS.
