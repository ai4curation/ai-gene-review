id: P19636
gene_symbol: eutC
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  EutC is the small (beta) subunit of adenosylcobalamin-dependent ethanolamine ammonia-lyase, which converts
  ethanolamine to acetaldehyde and ammonium. Six EutB/EutC heterodimers form the alpha6-beta6 holoenzyme.
  The substrate-binding catalytic barrel lies in EutB, while EutC covers the lower cobalamin face and
  contributes direct cofactor contacts at the subunit interface. N-terminal truncation can preserve activity
  of the recombinant E. coli complex. In the Salmonella ortholog, the N-terminal peptide participates
  in microcompartment targeting; the localization of native E. coli EutBC remains condition-dependent
  and incompletely resolved.
