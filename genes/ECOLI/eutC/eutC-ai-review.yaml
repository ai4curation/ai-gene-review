- term:
    id: GO:0008851
    label: ethanolamine ammonia-lyase activity
  evidence_type: EXP
  original_reference_id: PMID:15466038
  qualifier: enables
  review:
    summary: Activity of the E. coli EutB/EutC holoenzyme assayed in cells, extracts and in vitro;
      EutC contributes to it as the non-catalytic small subunit.
    action: ACCEPT
    reason: >-
      Accept the activity term for EutC participation in the assayed EutB/EutC holoenzyme. E. coli structures
      place the substrate-binding catalytic barrel in EutB while EutC covers the lower cobalamin face
      and contributes direct cofactor contacts. The synthesis therefore uses contributes_to for the EutC
      core. The existing enables qualifier is a probable source-specific representation concern, not a
      confirmed biochemical error: whole-complex assays and active-site placement do not alone prove autonomous
      EutC catalysis impossible or exclude a legitimate component-level annotation convention. The original
      qualifier is preserved pending source clarification.
    supported_by:
    - reference_id: PMID:15466038
      supporting_text: >-
        The holoenzyme of adenosylcobalamin-dependent ethanolamine ammonia lyase
        undergoes suicidal inactivation during catalysis as well as inactivation
        in the absence of substrate.
    - reference_id: PMID:20519496
      supporting_text: >-
        The active site is in the (beta/alpha)(8) barrel of the alpha-subunit;
        the beta-subunit covers the lower part of the cobalamin that is bound in
        the interface of the alpha- and beta-subunits.
    source_defects:
    - defect_type: WRONG_QUALIFIER
      resource: UNIPROT
      slot: Qualifier
      requested_change: REPOINT
      asserted_value: enables
      corrected_value: contributes_to
      confidence: PROBABLE
      explanation: >-
        This source attributes whole-holoenzyme ethanolamine ammonia-lyase activity to EutC with enables.
        EutC supplies the small-subunit cofactor interface, whereas the substrate-binding catalytic barrel
