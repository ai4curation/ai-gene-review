core_functions:
- description: >-
    Cofactor-binding small subunit of adenosylcobalamin-dependent ethanolamine ammonia-lyase. EutC completes
    the interfacial cobalamin environment and contributes to the EutB/EutC holoenzyme's conversion of
    ethanolamine to acetaldehyde and ammonium; the substrate-binding catalytic barrel is in EutB.
  contributes_to_molecular_function:
    id: GO:0008851
    label: ethanolamine ammonia-lyase activity
  directly_involved_in:
  - id: GO:0046336
    label: ethanolamine catabolic process
  in_complex:
    id: GO:0009350
    label: ethanolamine ammonia-lyase complex
  supported_by:
  - reference_id: PMID:19762342
    supporting_text: >-
      The eutB and eutC genes in the eut operon encoded the large and small
      subunits of the enzyme, respectively.
  - reference_id: PMID:20519496
    supporting_text: >-
      the beta-subunit covers the lower part of the cobalamin that is bound in
      the interface of the alpha- and beta-subunits
proposed_new_terms: []
