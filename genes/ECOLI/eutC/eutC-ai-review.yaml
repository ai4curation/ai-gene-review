  findings:
  - statement: EAL holoenzyme undergoes suicide inactivation and is reactivated by EutA with ATP,
      Mg2+ and AdoCbl.
    supporting_text: >-
      It was demonstrated with purified recombinant EutA that both the
      suicidally inactivated and O2-inactivated holoethanolamine ammonia lyase
      underwent rapid reactivation in vitro by EutA in the presence of
      adenosylcobalamin, ATP, and Mg2+.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only in cache; E. coli eut-encoded EAL activity assays; supports the EXP
      activity rows.
