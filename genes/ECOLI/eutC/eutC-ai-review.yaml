  - UniRule:UR000033396
  review:
    summary: Conditional Eut microcompartment localization inferred for E. coli; comparative
      Salmonella evidence is distinguished from native target assays.
    action: KEEP_AS_NON_CORE
    reason: >-
      Retain the specific conditional location as an inference from the E. coli eut shell inventory and
      the compartment-targeting mechanism characterized in Salmonella. PMID:27450681 expressed Salmonella
      LT2 shell proteins and EutC1-19 cargo fusions in an E. coli host; it did not localize native E.
      coli EutBC. Native LT2 immunogold localization (PMID:35785499) and cargo/shell imaging with encapsulation-peptide
      perturbations (PMID:41032589) supersede use of the 2013 external-EutBC model as established counterevidence.
      These results do not constitute an E. coli localization assay. KEEP_AS_NON_CORE records a condition-dependent
      compartment assignment outside the minimal enzyme chemistry; the core does not claim an experimentally
      resolved site of E. coli catalytic flux.
    supported_by:
    - reference_id: PMID:27450681
      supporting_text: >-
        the signal sequence EutC1-19 targets cargo to the interior of
        nanocompartments via a hydrophobic interaction with a helix on shell
        protein EutS
