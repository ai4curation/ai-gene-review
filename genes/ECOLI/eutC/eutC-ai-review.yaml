- term:
    id: GO:0031471
    label: ethanolamine degradation polyhedral organelle
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: located_in
  supporting_entities:
  - UniRule:UR000033396
  review:
    summary: UniRule transfer of the Eut microcompartment location.
    action: KEEP_AS_NON_CORE
    reason: >-
      E. coli K-12 encodes a complete Eut shell set, and the N-terminal 1-19
      peptide of the Salmonella ortholog targets cargo into recombinant Eut
      compartments via EutS, so EutC-mediated encapsulation of EAL is
      plausible. It is not established for the native enzyme: the Salmonella
      genetic model places EutBC outside the shell, and no localization of
      E. coli EutC has been reported. Kept as a non-core, conditional location.
    supported_by:
    - reference_id: PMID:27450681
      supporting_text: >-
        the signal sequence EutC1-19 targets cargo to the interior of
        nanocompartments via a hydrophobic interaction with a helix on shell
        protein EutS
    - reference_id: PMID:23585538
      supporting_text: >-
        The model predicts that EutBC (ethanolamine-ammonia lyase) lies outside
        the compartment, using external coenzyme B12 and injecting its product,
        acetaldehyde, into the lumen
    - reference_id: file:PSEPK/eutC/eutC-bioinformatics/RESULTS.md
      supporting_text: >-
