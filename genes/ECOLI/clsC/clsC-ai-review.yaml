  label: Escherichia coli (strain K12)
description: >-
  ClsC is an Escherichia coli phospholipase D-family cardiolipin synthase that
  works with the adjacent YmdB protein to transfer a phosphatidyl group from
  phosphatidylethanolamine to phosphatidylglycerol, producing cardiolipin and
  ethanolamine under stationary-phase and osmotic-stress-associated conditions.
existing_annotations:
- term:
    id: GO:0003824
    label: catalytic activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR001736
  review:
    summary: Generic catalytic activity is true but much less informative than
      the ClsC-specific phosphatidyltransferase reaction.
    action: MODIFY
    reason: >-
      IPR001736 identifies the broad phospholipase D/transphosphatidylase fold.
      Direct biochemical work shows that ClsC is the catalytic component of the
      YmdB-ClsC system that forms cardiolipin from phosphatidylglycerol and
      phosphatidylethanolamine, so GO:0090483 is the appropriate molecular
      function.
    proposed_replacement_terms:
    - id: GO:0090483
      label: phosphatidylglycerol-phosphatidylethanolamine phosphatidyltransferase
        activity
    supported_by:
    - reference_id: PMID:22988102
      supporting_text: >-
        the combined YmdB-ClsC used PE as the phosphatidyl donor to PG to form CL
    - reference_id: file:ECOLI/clsC/clsC-goa.tsv
      supporting_text: "GO:0003824\tcatalytic activity"
