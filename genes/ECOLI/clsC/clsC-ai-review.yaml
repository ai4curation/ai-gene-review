suggested_questions:
- question: >-
    What is the molecular mechanism by which YmdB enables high ClsC-dependent
    cardiolipin production from the same operon?
- question: >-
    Is the 2025 RNase III activation phenotype coupled to ClsC's HKD catalytic
    sites, to its phospholipid products, or to a separable RNase III-binding
    surface?
suggested_experiments:
- experiment_type: reconstituted ClsC-YmdB lipidomics
  description: >-
    Reconstitute purified ClsC with and without YmdB on PG/PE liposomes, assay
    cardiolipin formation by targeted LC-MS/MS, and repeat with HKD mutants and
    YmdB variants to distinguish direct catalytic activation from indirect
    assembly effects.
- experiment_type: RNase III activation structure-function series
  description: >-
    Compare RNase III binding and RNA-cleavage activation by wild-type ClsC,
    HKD-mutant ClsC, I466 variants, and membrane-binding-defective variants in
    vitro and in E. coli reporters to test whether RNA-processing regulation is
    mechanistically tied to cardiolipin synthesis.
