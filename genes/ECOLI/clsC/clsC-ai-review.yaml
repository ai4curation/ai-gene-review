  review:
    summary: Accept the direct ClsC PE-plus-PG phosphatidyltransferase
      molecular-function annotation.
    action: ACCEPT
    reason: >-
      The 2012 biochemical assays showed that membrane fractions expressing
      YmdB-ClsC make cardiolipin from phosphatidylglycerol plus
      phosphatidylethanolamine, not from phosphatidylglycerol plus phosphatidic
      acid or either phospholipid alone. His130Ala and His369Ala changes in the
      PLD HKD motifs eliminated cardiolipin formation, supporting ClsC as the
      catalytic component.
