- term:
    id: GO:0050685
    label: positive regulation of mRNA processing
  evidence_type: IMP
  original_reference_id: PMID:39842605
  qualifier: acts_upstream_of_or_within
  review:
    summary: >-
      Retain the EcoCyc IMP annotation for ClsC-dependent positive regulation
      of RNase III RNA processing as a secondary, non-core regulatory role.
    action: KEEP_AS_NON_CORE
    reason: >-
      Only the abstract of the 2025 paper is locally available, but it reports
      in vivo stimulation of RNase III-targeted lacZ reporters, antagonism of
      YmdB inhibition, in vitro RNase III cleavage assays with ClsC, and a
      physical interaction with RNase III. That is sufficient to defer to the
      EcoCyc experimental annotation while keeping the RNA-processing role
      outside ClsC's core membrane-lipid synthase activity.
    supported_by:
    - reference_id: PMID:39842605
      supporting_text: >-
        Overexpression of clsC in vivo stimulated the cleavage of RNase
        III-targeted lacZ fusions and antagonized the inhibition of RNase III by
        YmdB.
    - reference_id: PMID:39842605
      supporting_text: >-
        Additional in vitro cleavage assays of RNase III-targeted RNAs using
        RNase III and ClsC confirmed this activity.
