- term:
    id: GO:0008808
    label: cardiolipin synthase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN000478698
  - UniProtKB:P0A6H8
  - UniProtKB:P0AA84
  - UniProtKB:P45865
  - UniProtKB:P71040
  - UniProtKB:Q584D1
  review:
    summary: >-
      The IBA places the two-phosphatidylglycerol cardiolipin synthase term on
      ClsC, but E. coli ClsC uses phosphatidylethanolamine as the phosphatidyl
      donor.
    action: MODIFY
    reason: >-
      GO:0008808 is the ClsA/ClsB-style reaction in which one
      phosphatidylglycerol transfers a phosphatidyl group to another
      phosphatidylglycerol. Tan et al. showed that the YmdB-ClsC system instead
      uses phosphatidylethanolamine plus phosphatidylglycerol and found that
      PG-plus-PE, but not PG-plus-PA or either lipid alone, yielded the expected
      ClsC-dependent cardiolipin product. The IBA is therefore a family-node
      overgeneralization from PG-plus-PG cardiolipin synthases to the
      substrate-diverged ClsC subfamily.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: PANTHER:PTN000478698
        source_label: PANTHER:PTN000478698
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          This ancestral assertion transfers the PG-plus-PG reaction across
          the PTHR21248 cardiolipin-synthase family despite the distinct
          PG-plus-PE chemistry of the ClsC subfamily.
    proposed_replacement_terms:
    - id: GO:0090483
      label: phosphatidylglycerol-phosphatidylethanolamine phosphatidyltransferase
        activity
    supported_by:
    - reference_id: PMID:22988102
      supporting_text: >-
        The absence of signal with other combinations of exogenous phospholipids
        indicates that CL synthesis was dependent on ClsC with PG and PE as
        cosubstrates.
