  title: Discovery of a cardiolipin synthase utilizing phosphatidylethanolamine and
    phosphatidylglycerol as substrates.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text is cached and directly establishes clsC/ymdC as the
      YmdB-dependent ClsC cardiolipin synthase using PG plus PE.
  findings:
  - statement: >-
      The YmdB-ClsC system forms cardiolipin by transferring a phosphatidyl
      group from phosphatidylethanolamine to phosphatidylglycerol.
    supporting_text: >-
      the combined YmdB-ClsC used PE as the phosphatidyl donor to PG to form CL
  - statement: >-
      Combined deletion of all three E. coli cardiolipin synthase genes
      eliminated detectable cardiolipin.
    supporting_text: >-
      Triple deletions of clsA , clsB , and clsC resulted in the complete
      depletion of CL in E. coli cells.
  - statement: >-
      Mutation of either ClsC HKD motif abolished cardiolipin formation,
      supporting ClsC as the catalytic component.
    supporting_text: Mutation of the putative catalytic motif of ClsC prevents CL
      formation.
