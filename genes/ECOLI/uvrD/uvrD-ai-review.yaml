  review:
    summary: PAINT IBA from PTN000116141 assigning recombinational repair to the whole UvrD/RecB/PcrA family.
    action: MARK_AS_OVER_ANNOTATED
    reason: The PTN000116141 recombinational-repair node is seeded only by RecB, yeast Srs2 and Fbh1 orthologs,
      which act directly on recombination intermediates. E. coli UvrD has no established role in executing strand
      exchange-dependent repair; its best-characterised recombination-related activity is the opposite, removing
      RecA from blocked replication forks (anti-recombinase), and its RecF-pathway role is described as undefined.
      The term is not entirely wrong for a helicase that shapes recombination outcomes, but it over-states UvrD's
      participation; replication fork processing (GO:0031297) captures the supported role. See the PTHR11070 family
      review, where this node is assessed as TOO_DEEP.
