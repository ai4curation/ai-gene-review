core_functions:
- description: ATP-dependent 3'-to-5' unwinding of duplex DNA by UvrD, used after UvrBC incision to release the
    lesion-containing oligonucleotide in nucleotide excision repair and, when loaded by MutL, to unwind the error-containing
    strand in methyl-directed mismatch repair.
  molecular_function:
    id: GO:0043138
    label: 3'-5' DNA helicase activity
  directly_involved_in:
  - id: GO:0006289
    label: nucleotide-excision repair
  - id: GO:0006298
    label: mismatch repair
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - *id002
  - *id011
  - *id029
  - *id010
  - *id008
- description: ATP-driven 3'-to-5' translocation of UvrD along single-stranded DNA, used to strip RecA from blocked
    replication forks so they can be reversed and restarted, and to push lesion-stalled RNA polymerase backwards.
  molecular_function:
    id: GO:0015616
    label: DNA translocase activity
  directly_involved_in:
  - id: GO:0031297
    label: replication fork processing
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - *id011
  - *id022
  - *id021
  - *id004
suggested_questions:
- question: How much of UvrD's in vivo contribution to nucleotide excision repair comes from post-incision oligonucleotide
    release versus backtracking of lesion-stalled RNA polymerase?
- question: Should UvrD's anti-RecA activity at blocked forks be captured as negative regulation of DNA recombination
    (GO:0045910) rather than through recombinational repair (GO:0000725)?
suggested_experiments:
- hypothesis: UvrD-mediated RNA polymerase backtracking contributes to repair of transcribed-strand lesions independently
    of Mfd.
  description: Measure strand-specific CPD removal in uvrD, mfd and double mutants with separation-of-function uvrD
    alleles defective in RNA polymerase binding but retaining helicase activity.
  experiment_type: genetic and genomic repair mapping
