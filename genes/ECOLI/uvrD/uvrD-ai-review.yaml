id: P03018
gene_symbol: uvrD
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: UvrD (DNA helicase II) is an Escherichia coli superfamily 1A DNA helicase and single-stranded DNA translocase
  that couples ATP hydrolysis to movement along DNA with 3'-to-5' polarity. A monomer translocates on single-stranded
  DNA, while processive duplex unwinding requires a second UvrD molecule or a partner such as MutL. UvrD acts in
  the post-incision step of nucleotide excision repair, releasing the lesion-containing oligonucleotide and UvrC
  after UvrBC dual incision, and can backtrack lesion-stalled RNA polymerase to give the repair machinery access
  to damage. In methyl-directed mismatch repair it is loaded by MutL at the MutH-generated strand break and unwinds
  the error-containing strand. UvrD also removes RecA from blocked replication forks, acting as an anti-recombinase
  that permits fork reversal, and is the replicative helicase of several rolling-circle plasmids. uvrD mutants are
  UV sensitive and mutators. The protein is cytosolic and its expression is induced by DNA damage.
