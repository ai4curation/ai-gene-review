proposed_new_terms: []
suggested_questions:
- question: How does Lgt couple membrane-embedded lipid access to prolipoprotein recognition on the extracytoplasmic
    side, and what caused the earlier extractable cytoplasmic-side activity?
  experts:
  - E. coli envelope biogenesis curators
- question: Which E. coli prolipoprotein substrates are most sensitive to partial Lgt depletion, and does
    Lgt show substrate preferences beyond the lipobox cysteine context?
suggested_experiments:
- description: Quantitatively compare prolipoprotein lipidation and envelope localization in wild-type
    and conditional lgt-depletion E. coli by targeted lipoproteomics.
  experiment_type: conditional depletion and lipoproteomics
- description: Reconstitute purified E. coli Lgt with a panel of native lipobox peptides and phosphatidylglycerol
    species to measure sequence and lipid-donor preferences.
  experiment_type: in vitro enzyme assay
