suggested_questions:
- question: Should Lgt topology annotations continue to retain cytoplasmic-side-specific localization after the seven-transmembrane topology and crystal structures, or should the annotation be narrowed to plasma membrane only?
  experts:
  - E. coli envelope biogenesis curators
- question: Which E. coli prolipoprotein substrates are most sensitive to partial Lgt depletion, and does Lgt show substrate preferences beyond the lipobox cysteine context?
suggested_experiments:
- description: Quantitatively compare prolipoprotein lipidation and envelope localization in wild-type and conditional lgt-depletion E. coli by targeted lipoproteomics.
  experiment_type: conditional depletion and lipoproteomics
- description: Reconstitute purified E. coli Lgt with a panel of native lipobox peptides and phosphatidylglycerol species to measure sequence and lipid-donor preferences.
  experiment_type: in vitro enzyme assay
