references:
- id: GO_REF:0000033
  title: Annotation inferences using phylogenetic trees
  findings:
  - statement: The PAINT annotations place the conserved Lgt transferase activity, plasma-membrane localization,
      and lipoprotein biosynthetic process on the Lgt family.
- id: GO_REF:0000120
  title: Combined Automated Annotation using Multiple IEA Methods
  findings:
  - statement: Combined automated UniProt, InterPro, UniRule, EC, and Rhea evidence maps E. coli Lgt to
      the same inner-membrane diacylglyceryl transferase role.
- id: PMID:15919996
  title: Global topology analysis of the Escherichia coli inner membrane proteome.
  findings:
  - statement: The existing curator-assigned IDA membrane annotation is retained with independent enzyme-specific
      topology corroboration; the target-level supplementary entry was not independently inspected.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Protected cache is abstract-only; the reported experiment is retained where corroborated
      by enzyme-specific evidence. No uninspected supplementary target table or exact strain sequence
      is claimed.
- id: PMID:18602442
  title: Localization and characterization of prolipoprotein diacylglyceryl transferase (Lgt) critical
    in bacterial lipoprotein biosynthesis.
  findings:
  - statement: pT7GT-expressing BL21(DE3) vesicle extraction produced a water-soluble activity fraction,
      with preparation/overexpression artifacts acknowledged. Later seven-span topology conflicts with
      the peripheral interpretation; the original native sided-location claim remains unresolved.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Protected cache remains abstract-only; full primary article read through public Academia
      rendering, with method excerpts/provenance in the consultation. S. aureus was the lipid-donor source,
      not the assayed enzyme. Do not equate host identity with an independently verified full pT7GT insert
      sequence.
- id: PMID:22287519
  title: Phosphatidylglycerol::prolipoprotein diacylglyceryl transferase (Lgt) of Escherichia coli has
    seven transmembrane segments, and its essential residues are embedded in the membrane.
  findings:
  - statement: This paper experimentally localizes Lgt to the inner membrane, maps seven transmembrane
      segments, and tests essential residues by lgt depletion complementation.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text inspected for relevant biochemical or topology evidence.
- id: PMID:2644208
  title: Identification and genetic mapping of the structural gene for an essential Escherichia coli membrane
    protein.
  findings:
  - statement: This early mapping paper is part of the evidence path that identified the essential membrane
      protein later established as Lgt.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Protected cache is abstract-only; the reported experiment is retained where corroborated
      by enzyme-specific evidence. No uninspected supplementary target table or exact strain sequence
      is claimed.
- id: PMID:26729647
  title: Crystal structure of E. coli lipoprotein diacylglyceryl transferase.
  findings:
  - statement: This full-text structural and biochemical study resolved E. coli Lgt in complex with phosphatidylglycerol/palmitic
      acid and confirmed in vivo and in vitro diacylglyceryl transferase activity.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text inspected for relevant biochemical or topology evidence.
- id: PMID:7896715
  title: The umpA gene of Escherichia coli encodes phosphatidylglycerol:prolipoprotein diacylglyceryl
    transferase (lgt) and regulates thymidylate synthase levels through translational coupling.
  findings:
  - statement: This paper assigned E. coli umpA/lgt to the essential phosphatidylglycerol-prolipoprotein
      diacylglyceryl transferase function.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Protected cache is abstract-only; the reported experiment is retained where corroborated
      by enzyme-specific evidence. No uninspected supplementary target table or exact strain sequence
      is claimed.
- id: PMID:8051048
  title: Lipid modification of bacterial prolipoprotein. Transfer of diacylglyceryl moiety from phosphatidylglycerol.
  findings:
  - statement: Sankaran and Wu established direct diacylglyceryl transfer from phosphatidylglycerol to
      prolipoprotein cysteine and defined the three-step bacterial lipoprotein-biogenesis pathway.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Protected cache is abstract-only; the reported experiment is retained where corroborated
      by enzyme-specific evidence. No uninspected supplementary target table or exact strain sequence
      is claimed.
- id: file:ECOLI/lgt/lgt-uniprot.txt
  title: UniProtKB reviewed entry for E. coli lgt
  findings:
  - statement: UniProtKB summarizes Lgt as a multi-pass cell inner membrane EC 2.5.1.145 phosphatidylglycerol--prolipoprotein
      diacylglyceryl transferase in the lipoprotein biosynthesis pathway.
- id: file:ECOLI/lgt/lgt-deep-research-manual.md
  title: Manual deep research for E. coli lgt
  findings:
  - statement: Manual synthesis of the cached Lgt literature supports the phosphatidylglycerol-prolipoprotein
      diacylglyceryl transferase core function and the inner-membrane localization assessment.
- id: file:analysis/module_audits/bacterial_lipoprotein_maturation/ecoli-bacsu-consultation/evidence.md
  title: Primary-source, ontology and construct scope for E. coli and Bacillus lipoprotein maturation
    enzymes
  findings:
  - statement: Independent primary, ontology and sequence checks distinguish biochemical chemistry, construct
      evidence and native pathway scope.
- id: PMID:42126242
  title: Arm and head domain in highly conserved lipoprotein modification enzyme Lgt determine functional
    diversity among bacterial pathogens.
  findings:
  - statement: Heterologous complementation depends on Lpp load, homolog and protein production; shared
      Lgt chemistry does not establish arbitrary cross-species substrate compatibility. B. subtilis was
      not a directly tested complementation donor.
    supporting_text: some Lgt homologs are less efficient in modifying E. coli lipoproteins
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Full-text Results and Methods inspected: SLEC67 Δlgt versus SLEC68 ΔlgtΔlpp, inducible
      low-copy constructs and protein-detection controls. This is a host/substrate compatibility study,
      not a negative native Bacillus assay or demonstration of uniform enzymatic kinetics.'
