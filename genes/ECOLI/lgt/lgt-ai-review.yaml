- term:
    id: GO:0009898
    label: cytoplasmic side of plasma membrane
  evidence_type: IDA
  original_reference_id: PMID:18602442
  qualifier: located_in
  review:
    summary: The legacy sided-location claim remains unresolved after conflicting extraction and topology
      results.
    action: UNDECIDED
    reason: The original PMID:18602442 study extracted activity from inverted membrane vesicles of pT7GT-overexpressing
      BL21(DE3), reporting approximately 95% water-extractable activity and acknowledging possible preparation
      or overexpression artifacts. PMID:22287519 subsequently established seven membrane spans and argued
      that the earlier soluble fraction could contain membrane-associated aggregates. GO:0009898 includes
      embedded proteins, so integral topology does not by itself refute cytoplasmic-leaflet presence.
      Conversely, a cytoplasmic C terminus alone does not resolve the original whole-protein localization
      interpretation. Keep the experimental row unresolved rather than treating either interpretation
      as a direct native sided-location assay. Plasma-membrane localization remains supported in the core.
    supported_by:
    - reference_id: PMID:18602442
      supporting_text: 'Lgt''s ready extraction

        with water or low ionic strength solutions from inverted vesicles'
    - reference_id: PMID:22287519
      supporting_text: Overexpression of lgt from a strong promoter on a high-copy-number plasmid probably
        resulted in small, membrane-associated aggregates in the reported study.
