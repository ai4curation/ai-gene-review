references:
- id: GO_REF:0000033
  title: Annotation inferences using phylogenetic trees
  findings:
  - statement: The PAINT annotations place the conserved Lgt transferase activity, plasma-membrane localization, and lipoprotein biosynthetic process on the Lgt family.
- id: GO_REF:0000120
  title: Combined Automated Annotation using Multiple IEA Methods
  findings:
  - statement: Combined automated UniProt, InterPro, UniRule, EC, and Rhea evidence maps E. coli Lgt to the same inner-membrane diacylglyceryl transferase role.
- id: PMID:15919996
  title: Global topology analysis of the Escherichia coli inner membrane proteome.
  findings:
  - statement: This large-scale topology paper supports Lgt as part of the E. coli inner-membrane proteome.
- id: PMID:18602442
  title: Localization and characterization of prolipoprotein diacylglyceryl transferase (Lgt) critical in bacterial lipoprotein biosynthesis.
  findings:
  - statement: This abstract-only cached paper reports biochemical localization and cytosolic-side extraction behavior for E. coli Lgt; later topology and crystal structures refine Lgt as a multi-pass inner-membrane enzyme.
- id: PMID:22287519
  title: Phosphatidylglycerol::prolipoprotein diacylglyceryl transferase (Lgt) of Escherichia coli has seven transmembrane segments, and its essential residues are embedded in the membrane.
  findings:
  - statement: This paper experimentally localizes Lgt to the inner membrane, maps seven transmembrane segments, and tests essential residues by lgt depletion complementation.
- id: PMID:2644208
  title: Identification and genetic mapping of the structural gene for an essential Escherichia coli membrane protein.
  findings:
  - statement: This early mapping paper is part of the evidence path that identified the essential membrane protein later established as Lgt.
- id: PMID:26729647
  title: Crystal structure of E. coli lipoprotein diacylglyceryl transferase.
  findings:
  - statement: This full-text structural and biochemical study resolved E. coli Lgt in complex with phosphatidylglycerol/palmitic acid and confirmed in vivo and in vitro diacylglyceryl transferase activity.
- id: PMID:7896715
  title: The umpA gene of Escherichia coli encodes phosphatidylglycerol:prolipoprotein diacylglyceryl transferase (lgt) and regulates thymidylate synthase levels through translational coupling.
  findings:
  - statement: This paper assigned E. coli umpA/lgt to the essential phosphatidylglycerol-prolipoprotein diacylglyceryl transferase function.
- id: PMID:8051048
  title: Lipid modification of bacterial prolipoprotein. Transfer of diacylglyceryl moiety from phosphatidylglycerol.
  findings:
  - statement: Sankaran and Wu established direct diacylglyceryl transfer from phosphatidylglycerol to prolipoprotein cysteine and defined the three-step bacterial lipoprotein-biogenesis pathway.
- id: file:ECOLI/lgt/lgt-uniprot.txt
  title: UniProtKB reviewed entry for E. coli lgt
  findings:
  - statement: UniProtKB summarizes Lgt as a multi-pass cell inner membrane EC 2.5.1.145 phosphatidylglycerol--prolipoprotein diacylglyceryl transferase in the lipoprotein biosynthesis pathway.
- id: file:ECOLI/lgt/lgt-deep-research-manual.md
  title: Manual deep research for E. coli lgt
  findings:
  - statement: Manual synthesis of the cached Lgt literature supports the phosphatidylglycerol-prolipoprotein diacylglyceryl transferase core function and the inner-membrane localization assessment.
