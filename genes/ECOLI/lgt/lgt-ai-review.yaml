  evidence_type: IDA
  original_reference_id: PMID:18602442
  qualifier: located_in
  review:
    summary: The cytoplasmic-side annotation over-specifies Lgt topology relative to stronger integral inner-membrane evidence.
    action: MARK_AS_OVER_ANNOTATED
    reason: Selvan and Sankaran reported extraction behavior interpreted as cytosolic-side membrane association, but this does not establish a whole-protein GO cellular-component localization for a polytopic enzyme. Later Lgt-specific topology and crystal-structure studies establish a seven-transmembrane integral enzyme with key catalytic features toward the periplasmic half of the membrane, so GO:0009898 is likely over-specified while GO:0005886 captures the supported inner-membrane localization.
