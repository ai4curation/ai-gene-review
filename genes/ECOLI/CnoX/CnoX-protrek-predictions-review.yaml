predictions:
- source_method: ProTrek
  source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
  source_reference_id: PMID:41039041
  predicted_term:
    id: GO:0015036
    label: disulfide oxidoreductase activity
  predicted_term_type: GO_MF
  review:
    assessment: NPI
    confidence_score: 0
    error_type: PSEUDOENZYME_OVERANNOTATION
    summary: >-
      Top-ranked hit (score 15.70). CnoX carries a thioredoxin fold but not a thioredoxin active site:
      this review states explicitly that the N-terminal domain lacks the canonical CXXC motif and
      is therefore not a functional oxidoreductase. Its redox role is forming mixed disulfides with
      clients through Cys-63, which is substrate protection rather than catalysis. Assigning the ancestral
      oxidoreductase activity to a degenerate domain is the pseudoenzyme trap, and it recurs at ranks
      3 and 5 (peroxide sensor activity, peptidyl-cysteine oxidation).
    supported_by:
    - reference_id: PMID:29754824
      supporting_text: >-
        CnoX functions as an efficient holdase, binding unfolded client proteins to prevent their
        aggregation
- source_method: ProTrek
  source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
  source_reference_id: PMID:41039041
  predicted_term:
    id: GO:0140597
    label: protein carrier chaperone
  predicted_term_type: GO_MF
  review:
    assessment: COR
    confidence_score: 2
    summary: >-
      Rank 2 (score 15.39), absent from GOA and an exact match to this review's core molecular function.
      Protein carrier chaperone is precisely right for CnoX: it holds unfolded clients during HOCl
      stress and then hands them to GroEL/GroES and DnaK/DnaJ/GrpE for refolding. GOA records the
      holdase phenotypes (unfolded protein binding, maintenance of unfolded protein, protein refolding,
      all IDA) but not this carrier function, so the call fills a real gap. GO-GPT did not reach it
      either.
    supported_by:
    - reference_id: PMID:29754824
      supporting_text: >-
        CnoX also protects its bound substrates from irreversible oxidation by forming mixed disulfide
        bonds via Cys-63
