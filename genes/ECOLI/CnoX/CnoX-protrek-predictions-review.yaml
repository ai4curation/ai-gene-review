id: P77395
gene_symbol: CnoX
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli (strain K12)
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for CnoX, the E. coli chaperedoxin that combines ATP-independent
  holdase activity with redox protection of its clients. The result is unusually good on the hard
  part: rank 2 is protein carrier chaperone, exactly this review's core molecular function and absent
  from GOA. The surrounding calls all assume a functional thioredoxin oxidoreductase, which CnoX is
  not - its thioredoxin-like domain lacks the canonical CXXC active site. Assessment: 1 correct novel
  (COR), 2 nonparalog incorrect (NPI).
