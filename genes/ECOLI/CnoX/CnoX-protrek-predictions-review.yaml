    error_type: PSEUDOENZYME_OVERANNOTATION
    summary: >-
      Rank 3 (score 15.22). Peroxide sensor activity belongs to OxyR-type redox-sensing regulators.
      CnoX is activated by hypochlorous acid through chlorination of its TPR domain rather than by
      peroxide sensing, and it is not a transcriptional regulator. Same root cause as rank 1: the
      thioredoxin fold pulls the retrieval toward the redox-enzyme neighbourhood and away from the
      holdase biology that the free-text channel states correctly at 20.63.
    supported_by:
    - reference_id: PMID:29754824
