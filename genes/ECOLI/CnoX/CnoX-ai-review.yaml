      via chlorination, functions as an efficient holdase, protecting the substrates
      of the major folding systems GroEL/ES and DnaK/J/GrpE.
  - reference_id: file:ECOLI/CnoX/CnoX-deep-research-falcon.md
    supporting_text: 'CnoX is a bifunctional protein-folding factor'
    reference_section_type: OTHER
- description: >-
    GroEL-associated redox quality-control plugin. CnoX binds the GroEL apical domain
    outside the client-binding site through a conserved C-terminal helix, captures
    oxidized GroEL clients in mixed disulfides, and is released when GroES binds.
  molecular_function:
