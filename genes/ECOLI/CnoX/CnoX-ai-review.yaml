proposed_new_terms:
- proposed_name: holdase chaperone activity
  proposed_definition: >-
    Binding to an unfolded or misfolded protein to prevent its aggregation without
    actively catalyzing refolding. The holdase maintains the client in a soluble,
    folding-competent state.
  justification: >-
    CnoX directly prevents aggregation of non-native cytosolic clients and maintains
    them for later refolding. Obsolete GO:0051082 represented binding only, whereas
    GO:0140309 additionally requires escort to an acceptor or specific location.
  proposed_parent:
    id: GO:0003674
    label: molecular_function
  supported_by:
  - reference_id: PMID:29754824
    supporting_text: functions as an efficient holdase, protecting the substrates
      of the major folding systems GroEL/ES and DnaK/J/GrpE.
suggested_questions:
- question: >-
    Which endogenous proteins are the principal CnoX clients during HOCl stress,
    and what features determine capture by its holdase and thiol-protection surfaces?
- question: >-
    Does transfer of held clients to DnaK satisfy carrier-specific GO:0140309, or
    is CnoX released before a direct client-acceptor handoff?
- question: >-
    How broadly is the stable GroEL-plugin mechanism conserved among bacterial and
    eukaryotic thioredoxin-TPR proteins?
suggested_experiments:
- experiment_type: client-trapping proteomics
  description: >-
    Compare time-resolved CnoX client capture and release in wild type, C63A, and
    TPR-surface mutants during and after defined HOCl pulses, with parallel aggregation
    and cysteine-oxidation proteomics.
- experiment_type: chaperone handoff assay
  description: >-
    Reconstitute fluorescent client transfer from CnoX to GroEL/GroES and DnaK/DnaJ/GrpE
    at single-turnover resolution to distinguish direct carrier-like handoff from
    release-and-recapture.
- experiment_type: genetic complementation
  description: >-
    Test separation-of-function CnoX variants defective in N-chlorination activation,
    client mixed-disulfide formation, or GroEL binding for HOCl survival and recovery
    of client solubility in vivo.
