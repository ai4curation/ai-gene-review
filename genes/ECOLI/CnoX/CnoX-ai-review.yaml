  label: Escherichia coli (strain K12)
description: >-
  CnoX (formerly YbbN) is a cytosolic chaperedoxin that combines ATP-independent
  holdase activity with protection of client cysteines from irreversible oxidation.
  Hypochlorous acid activates its tetratricopeptide-repeat region by N-chlorination,
  enabling CnoX to bind non-native proteins and suppress their aggregation while its
  thioredoxin-like domain forms reversible mixed disulfides with oxidized clients.
  CnoX subsequently cooperates with the GroEL/GroES and DnaK/DnaJ/GrpE folding systems.
  It also binds stably to the apical domain of GroEL outside the substrate-binding site;
  GroES binding releases CnoX, coupling redox protection to chaperonin-assisted folding.
