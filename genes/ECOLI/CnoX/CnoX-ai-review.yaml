core_functions:
- description: >-
    HOCl-activated, ATP-independent holdase and redox-protective chaperedoxin. CnoX
    binds non-native clients to prevent aggregation and forms reversible mixed
    disulfides that protect client cysteines from irreversible oxidation. It maintains
    clients for subsequent GroEL/GroES- or DnaK/DnaJ/GrpE-assisted refolding. No
    current GO molecular-function term precisely represents this general holdase:
    GO:0051082 is obsolete, and GO:0140309 additionally asserts carrier-like escort.
  directly_involved_in:
