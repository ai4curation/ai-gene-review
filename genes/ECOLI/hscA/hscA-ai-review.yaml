    label: iron-sulfur cluster assembly
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:15485839
    supporting_text: >-
      When present together, IscU and HscB synergistically stimulate both
      k(hyd) (approximately = 500-fold) and k(T-->R) (approximately =
      60-fold), leading to enhanced formation of the HscA.ADP-IscU complex
      (substrate capture).
proposed_new_terms: []
suggested_questions:
- question: >-
    Is GO:0140662 ATP-dependent protein folding chaperone the right MF for
    HscA, whose ATP-driven action remodels a cluster-loaded scaffold to
    release its cofactor rather than folding a client, or would a dedicated
    ATP-dependent iron-sulfur cluster transfer chaperone term be warranted?
- question: >-
    Does HscA bind acceptor apoproteins other than biotin synthase, and does
    such binding direct IscU-bound clusters to specific acceptors in vivo?
suggested_experiments:
- description: >-
    Reconstitute HscA-HscB-IscU-catalyzed cluster transfer to a panel of
    [2Fe-2S] and [4Fe-4S] apoproteins (Fdx, BioB, IscA, aconitase) and measure
    transfer rates with wild-type versus ATPase-dead (T212V) and
    substrate-binding-domain mutant HscA.
  experiment_type: in vitro cluster transfer kinetics
- description: >-
    Use in vivo crosslinking or proximity labelling of HscA in E. coli to
    identify acceptor apoproteins captured with IscU under iron limitation.
  experiment_type: proteomics
