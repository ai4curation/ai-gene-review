id: P0A6Z1
gene_symbol: hscA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: HscA (Hsc66) is a specialized cytosolic Hsp70-family chaperone encoded with its J-type co-chaperone
  HscB in the iscRSUA-hscBA-fdx operon. It has a low intrinsic ATPase activity, limited by ATP hydrolysis
  rather than nucleotide exchange, and needs no GrpE-type exchange factor. Its substrate-binding domain
  recognizes a conserved LPPVK loop of the Fe-S scaffold protein IscU, and HscB delivers IscU to the ATP-bound
  state of HscA; together IscU and HscB stimulate HscA ATP hydrolysis about 500-fold, trapping IscU in
  the ADP-bound complex. ATP hydrolysis by the 1:1:1 HscA-HscB-IscU[2Fe-2S] complex distorts the IscU-bound
  cluster and accelerates [2Fe-2S] cluster transfer to acceptor apoproteins such as ferredoxin, so HscA
  acts as the ATP-driven engine of cluster release in Isc-mediated Fe-S protein maturation. HscA also
  binds cluster-deficient biotin synthase and improves its in vivo [2Fe-2S] cluster assembly, and its
  expression is induced by cold shock. Direct conformational measurements show preferential stabilization
  of disordered IscU, consistent with a holdase-like mechanism; a general folding or refolding role is
  not established by these cluster-transfer experiments.
