suggested_questions:
- question: Is GO:0140662 ATP-dependent protein folding chaperone the right MF for HscA, whose ATP-driven
    action remodels a cluster-loaded scaffold to release its cofactor rather than folding a client, or
    would a dedicated ATP-dependent iron-sulfur cluster transfer chaperone term be warranted?
- question: Does HscA bind acceptor apoproteins other than biotin synthase, and does such binding direct
    IscU-bound clusters to specific acceptors in vivo?
