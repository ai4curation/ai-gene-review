- term:
    id: GO:0016226
    label: iron-sulfur cluster assembly
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR010236
  review:
    summary: >-
      HscA, with HscB and ATP, catalyzes the transfer of [2Fe-2S] clusters
      from holo-IscU to acceptor apoproteins and improves in vivo cluster
      assembly on biotin synthase.
    action: ACCEPT
    reason: >-
      HscA does part of the work of the process: its ATP hydrolysis drives
      the structural change in the IscU-bound cluster that accelerates
      transfer, and an ATPase-dead HscA cannot accelerate transfer. This is
      the core biological process of HscA. GO:0016226 is kept at this level
      (rather than [2Fe-2S] cluster assembly) because the Isc pathway that
      HscA serves matures acceptors carrying several cluster types.
    supported_by:
    - reference_id: PMID:18986169
      supporting_text: >-
        HscA-mediated acceleration of [2Fe2S] cluster transfer exhibited an
        absolute requirement for both HscB and ATP. A mutant form of HscA
        lacking ATPase activity, HscA(T212V), was unable to accelerate cluster
        transfer
    - reference_id: PMID:19821612
      supporting_text: >-
        In this work, we show that in Escherichia coli, HscA significantly
        improves the efficiency of the in vivo assembly of the [2Fe-2S](2+)
        cluster on BioB under conditions of low to moderate iron.
