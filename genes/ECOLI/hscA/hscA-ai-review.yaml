  review:
    summary: HscA, with HscB and ATP, catalyzes the transfer of [2Fe-2S] clusters from holo-IscU to acceptor
      apoproteins and improves in vivo cluster assembly on biotin synthase.
    action: ACCEPT
    reason: 'HscA does part of the work of the process: its ATP hydrolysis drives the structural change
      in the IscU-bound cluster that accelerates transfer, and an ATPase-dead HscA cannot accelerate transfer.
