core_functions:
- description: >-
    Specialized Hsp70 chaperone that binds the LPPVK loop of the Fe-S scaffold
    IscU delivered by HscB and, through HscB/IscU-stimulated ATP hydrolysis,
    remodels the IscU-[2Fe-2S] complex to accelerate cluster transfer to
    acceptor apoproteins.
