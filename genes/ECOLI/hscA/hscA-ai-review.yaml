        to accelerate cluster transfer
    - reference_id: PMID:19821612
      supporting_text: In this work, we show that in Escherichia coli, HscA significantly improves the
        efficiency of the in vivo assembly of the [2Fe-2S](2+) cluster on BioB under conditions of low
