core_functions:
- description: Specialized ATPase that recognizes IscU and is synergistically activated by IscU and HscB.
    ATP hydrolysis and nucleotide-dependent scaffold binding drive efficient [2Fe-2S] transfer to acceptor
    proteins; disordered-state stabilization is demonstrated, without equating this with client folding
    or refolding.
