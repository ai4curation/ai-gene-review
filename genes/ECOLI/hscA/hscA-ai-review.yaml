  review:
    summary: >-
      Generic protein folding overstates HscA's role; it is a
      substrate-dedicated Hsp70 whose client is IscU and whose output is Fe-S cluster
      release.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      HscA forms a specialized chaperone system that selectively binds IscU,
      and it does not substitute for DnaK in general protein folding. Its
      ATP-driven action on IscU remodels the cluster-bound scaffold to
      accelerate cluster transfer, which is captured by GO:0016226
      iron-sulfur cluster assembly. The MF term GO:0140662 is used for the
      ATP-driven chaperone activity per the Hsp70 convention, but the
      biological process is Fe-S cluster biogenesis rather than folding of
      client proteins in general. Consistent with the P. putida orthologue.
    supported_by:
    - reference_id: PMID:12871959
      supporting_text: >-
        Hsc66 (HscA) and Hsc20 (HscB) from Escherichia coli comprise a
        specialized chaperone system that selectively binds the iron-sulfur
        cluster template protein IscU.
    - reference_id: PMID:18986169
      supporting_text: >-
        These results suggest that acceleration of iron-sulfur cluster
        transfer involves a structural change in the IscU(2)[2Fe2S] complex
        during the T --> R transition of HscA accompanying ATP hydrolysis.
