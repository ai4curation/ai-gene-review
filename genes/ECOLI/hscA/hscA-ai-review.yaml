    label: cytosol
  in_complex:
    id: GO:1990230
    label: iron-sulfur cluster transfer complex
  supported_by:
  - reference_id: PMID:18986169
    supporting_text: >-
      HscA-mediated acceleration of [2Fe2S] cluster transfer exhibited an
      absolute requirement for both HscB and ATP.
  - reference_id: PMID:15485839
    supporting_text: >-
      IscU behaves as a substrate for HscA, and HscB enhances the binding of
      IscU to HscA.
  - reference_id: PMID:12871959
    supporting_text: >-
      Hsc66 interacts with peptides corresponding to a discrete region of IscU
      including residues 99-103 (LPPVK)
- description: >-
    ATP hydrolysis activity that is intrinsically slow and rate-limiting, and
    is synergistically stimulated by HscB and IscU to drive substrate capture
    and the T-to-R conformational transition.
  molecular_function:
    id: GO:0016887
    label: ATP hydrolysis activity
  directly_involved_in:
