  qualifier: involved_in
  review:
    summary: >-
      Assays of the isolated E. coli carboxyltransferase measure malonyl-CoA turnover and map inhibitor
      resistance to accA, directly placing AccA in malonyl-CoA synthesis.
    action: ACCEPT
    reason: >-
      Moiramide B inhibits the carboxyltransferase reaction competitively with respect to malonyl-CoA,
      and resistant E. coli mutants carry changes in AccA or AccD. That the drug target is the AccA/AccD
      reaction, and that the reaction is scored as malonyl-CoA formation, is direct evidence for this
      process term; it is also the source of UniProt's ECO:0000269 kinetic parameters for AccA.
    supported_by:
    - reference_id: PMID:15066985
      supporting_text: >-
        Moiramide B targets the carboxyltransferase reaction of this enzyme with a competitive inhibition
        pattern versus malonyl-CoA (K(i) value = 5 nm).
    - reference_id: PMID:15066985
      supporting_text: >-
        We isolated pyrrolidine dione-resistant strains of E. coli, S. aureus, and Bacillus subtilis,
        which contain mutations within the carboxyltransferase subunits AccA or AccD.
