- term:
    id: GO:0003989
    label: acetyl-CoA carboxylase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR001095
  review:
    summary: >-
      The overall ATP-dependent carboxylation of acetyl-CoA is a holoenzyme reaction; AccA supplies only
      the alpha half of the carboxyltransferase active site and cannot carry out the reaction alone.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      GO:0003989 is defined as the complete reaction ATP + acetyl-CoA + HCO3- = ADP + phosphate + malonyl-CoA.
      In E. coli this requires all four subunits: AccC carboxylates the biotin of AccB using ATP, and
      only then does the AccA/AccD carboxyltransferase transfer the carboxyl group to acetyl-CoA. AccA
      therefore contributes to, rather than enables, this activity, and the review records it as contributes_to_molecular_function
      in core_functions. The same judgement is applied to the GO:0003989 rows of accB, accC and accD.
    supported_by:
    - reference_id: file:ECOLI/accA/accA-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: >-
        First, biotin carboxylase catalyzes the carboxylation of biotin on its carrier protein (BCCP)
        and then the CO(2) group is transferred by the carboxyltransferase to acetyl-CoA to form malonyl-CoA.
    - reference_id: file:ECOLI/accA/accA-uniprot.txt
      record_section: ["CC:SUBUNIT"]
      supporting_text: >-
        Acetyl-CoA carboxylase is a heterohexamer composed of biotin carboxyl carrier protein (AccB),
        biotin carboxylase (AccC) and two subunits each of ACCase subunit alpha (AccA) and ACCase subunit
        beta (AccD).
