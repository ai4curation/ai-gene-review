core_functions:
- description: >-
    Alpha subunit of the alpha2beta2 carboxyltransferase of acetyl-CoA carboxylase. With AccD it forms
    the active site that transfers the carboxyl group from carboxybiotinyl-AccB to acetyl-CoA, the committed
    step that produces the malonyl-CoA used by type II fatty acid synthesis. AccA has no catalytic activity
    in isolation.
  contributes_to_molecular_function:
    id: GO:0003989
    label: acetyl-CoA carboxylase activity
  directly_involved_in:
  - id: GO:2001295
    label: malonyl-CoA biosynthetic process
  - id: GO:0006633
    label: fatty acid biosynthetic process
  locations:
  - id: GO:0005829
    label: cytosol
  in_complex:
    id: GO:0009317
    label: acetyl-CoA carboxylase complex
  supported_by:
  - reference_id: file:ECOLI/accA/accA-uniprot.txt
    record_section: ["CC:FUNCTION"]
    supporting_text: >-
      First, biotin carboxylase catalyzes the carboxylation of biotin on its carrier protein (BCCP) and
      then the CO(2) group is transferred by the carboxyltransferase to acetyl-CoA to form malonyl-CoA.
  - reference_id: PMID:1355089
    supporting_text: >-
      Peptide mapping of the purified enzyme component indicates that the carboxyltransferase component
      is a complex of two nonidentical subunits, a 35-kDa alpha subunit and a 33-kDa beta subunit.
  - reference_id: PMID:15066985
    supporting_text: >-
      We isolated pyrrolidine dione-resistant strains of E. coli, S. aureus, and Bacillus subtilis, which
      contain mutations within the carboxyltransferase subunits AccA or AccD.
suggested_questions:
- question: >-
    Is the two-site communication seen in the isolated carboxyltransferase (substrate binding at one alphabeta
    pair affecting the other) used physiologically to tune malonyl-CoA output, or is it an artefact of
    the isolated component?
- question: >-
    Does AccA contribute any of the nucleic-acid binding surface of the carboxyltransferase, or is translational
    autoregulation entirely a property of the AccD zinc domain even though accA mRNA is one of the targets?
suggested_experiments:
- description: >-
    Reconstitute AccA and AccD separately and together with AccB and AccC and measure malonyl-CoA formation,
    to quantify how much activity each isolated subunit retains and confirm that carboxyl transfer requires
    the alpha/beta interface.
- description: >-
    Use RNA crosslinking of the reconstituted alpha2beta2 carboxyltransferase with accA and accD mRNA,
    with and without the AccD zinc-domain cysteine substitutions, to test whether AccA residues contact
    the mRNA that the complex represses.
