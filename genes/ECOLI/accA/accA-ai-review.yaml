id: P0ABD5
gene_symbol: accA
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  AccA is the alpha subunit of the carboxyltransferase component of the heteromeric (bacterial-type) acetyl-CoA
  carboxylase. Two AccA and two AccD subunits form an alpha2beta2 carboxyltransferase that catalyses the
  second half-reaction of acetyl-CoA carboxylation: transfer of the carboxyl group from the carboxybiotinyl
  prosthetic group of the biotin carboxyl carrier protein (AccB) to acetyl-CoA, yielding malonyl-CoA.
  Together with the biotin carboxylase (AccC) and AccB subunits it constitutes the cytosolic acetyl-CoA
  carboxylase holoenzyme that performs the first committed, rate-influencing step of de novo fatty acid
  synthesis, supplying the malonyl-CoA that is transferred to acyl carrier protein and extended by the
  type II fatty acid synthase. The carboxyltransferase active site lies at the AccA/AccD interface, which
  is why resistance to carboxyltransferase-directed antibacterials such as moiramide B maps to mutations
  in either subunit.
