suggested_questions:
- question: >-
    What sets the division of labour between FabZ and FabA in vivo across growth conditions, given their
    overlapping chain-length specificities and the single distinguishing step (long-chain unsaturated
    substrates)?
suggested_experiments:
- description: >-
    Measure acyl-ACP intermediate pools and membrane fatty-acid composition in strains with graded FabZ
    and FabA levels, to test whether the (3R)-hydroxymyristoyl-ACP pool that links FabZ to lipid A is
    set by dehydratase capacity or by the condensing enzymes.
