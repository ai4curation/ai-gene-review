      dehydrase activity as much as 170-fold, suggesting that orf17 is the structural gene for the dehydrase.
    reference_section_type: ABSTRACT
  - statement: >-
      Mutations in fabZ suppress a temperature-sensitive lipid A acyltransferase lesion, probably by raising
      the (3R)-hydroxymyristoyl-ACP pool.
    supporting_text: >-
      We suggest that bypass of the lpxA2 phenotype by mutations in orf17 may be due to an increased (3R)-hydroxymyristoyl-ACP
      pool.
    reference_section_type: ABSTRACT
