gene_symbol: fabZ
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  FabZ is one of the two (3R)-hydroxyacyl-[acyl-carrier-protein] dehydratases of the dissociated (type
  II) fatty-acid synthase of Escherichia coli and most other bacteria. It removes water from the (3R)-hydroxyacyl-ACP
  made by the ketoreductase FabG to give trans-2-enoyl-ACP, the third reaction of each elongation cycle.
  FabZ has a broad chain length preference and, unlike its paralogue FabA, efficiently dehydrates short-chain
  and long-chain beta-hydroxyacyl-ACPs including long-chain unsaturated species, so it handles the rounds
  of elongation that FabA cannot; FabA in turn carries the isomerase activity that introduces cis unsaturation.
  The (3R)-hydroxymyristoyl-ACP pool that FabZ governs is also the acyl donor for lipid A, which is how
  the gene was discovered: loss of FabZ activity suppresses a temperature-sensitive lesion in the first
  lipid A acyltransferase. The protein is a cytoplasmic oligomer of the hotdog-fold thioester dehydratase
  family.
