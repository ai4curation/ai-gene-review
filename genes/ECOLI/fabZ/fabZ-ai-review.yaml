  review:
    summary: >-
      Lipid A biosynthesis depends on the (3R)-hydroxymyristoyl-ACP pool that FabZ dehydrates; a real
      but secondary role of the same catalytic step.
    action: KEEP_AS_NON_CORE
    reason: >-
      The gene was identified because mutations in it suppress a temperature-sensitive lesion in LpxA,
      the first lipid A acyltransferase, with the suppression attributed to a raised (3R)-hydroxymyristoyl-ACP
      pool; overproduction of the protein raised (3R)-hydroxymyristoyl-ACP dehydrase activity up to 170-fold.
      FabZ therefore competes for, and sets the level of, the lipid A acyl donor rather than performing
      a step of lipid A assembly, so the term is kept as non-core context, exactly as in the P. putida
      fabZ review.
    supported_by:
    - reference_id: PMID:7806516
      supporting_text: >-
        Wild-type cells that overproduced the protein encoded by orf17 overproduced (3R)-hydroxymyristoyl-ACP
        dehydrase activity as much as 170-fold, suggesting that orf17 is the structural gene for the dehydrase.
    - reference_id: PMID:7806516
      supporting_text: >-
        We suggest that bypass of the lpxA2 phenotype by mutations in orf17 may be due to an increased
        (3R)-hydroxymyristoyl-ACP pool.
