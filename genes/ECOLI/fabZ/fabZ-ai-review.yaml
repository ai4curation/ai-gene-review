- id: PMID:8910376
  title: >-
    Roles of the FabA and FabZ beta-hydroxyacyl-acyl carrier protein dehydratases in Escherichia coli
    fatty acid biosynthesis.
  findings:
  - statement: >-
      Purified FabZ dehydrates short-chain and long-chain saturated and unsaturated beta-hydroxyacyl-ACPs
      in reconstituted elongation cycles.
    supporting_text: >-
      The FabZ dehydratase efficiently catalyzed the dehydration of short chain beta-hydroxyacyl-ACPs
      and long chain saturated and unsaturated beta-hydroxyacyl-ACPs.
    reference_section_type: ABSTRACT
  - statement: >-
      FabA is nearly inactive on long-chain unsaturated substrates, which is why the two dehydratases
      are not interchangeable.
    supporting_text: >-
      Significantly, FabA was virtually inactive in the dehydration of long chain unsaturated beta-hydroxyacyl-ACP.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
