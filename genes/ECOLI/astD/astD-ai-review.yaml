id: P76217
gene_symbol: astD
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  astD (b1746) encodes N-succinylglutamate 5-semialdehyde dehydrogenase (EC 1.2.1.71) of Escherichia coli,
  an NAD-dependent member of the aldehyde dehydrogenase superfamily (AstD subfamily). In the ammonia-producing
  arginine succinyltransferase (AST) pathway, encoded by the nitrogen-regulated astCADBE operon, it oxidizes
  N-succinyl-L-glutamate 5-semialdehyde, the product of AstC, to N-succinyl-L-glutamate, the substrate
  of AstE. Purified AstD also oxidizes model aldehydes such as decanal and succinic semialdehyde with
  NAD but not NADP.
