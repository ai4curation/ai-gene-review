    review_notes: >-
      Curated record; its FUNCTION sentence calls the reaction a reduction although EC 1.2.1.71 oxidizes
      the semialdehyde (recorded as a source defect). The quote is used for the substrate and product
      it names.
    source_defects:
    - defect_type: WRONG_STATEMENT
      resource: UNIPROT
      record: UniProtKB:P76217
      slot: CC:FUNCTION
      requested_change: CHECK
      asserted_value: >-
        Catalyzes the NAD-dependent reduction of succinylglutamate semialdehyde into succinylglutamate
        (Probable).
      confidence: CONFIRMED
      explanation: >-
        N-succinylglutamate 5-semialdehyde dehydrogenase (EC 1.2.1.71, RHEA:10812, listed in the same
        entry) oxidizes the aldehyde to the carboxylate with NAD+ as acceptor; the sentence should say
        oxidation.
      supported_by:
      - reference_id: file:ECOLI/astD/astD-uniprot.txt
        record_section: ["CC:CATALYTIC ACTIVITY"]
        supporting_text: >-
          Reaction=N-succinyl-L-glutamate 5-semialdehyde + NAD(+) + H2O = N-succinyl-L-glutamate + NADH
          + 2 H(+)
