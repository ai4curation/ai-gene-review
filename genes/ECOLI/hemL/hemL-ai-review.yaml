  label: Escherichia coli K-12
description: >-
  HemL is glutamate-1-semialdehyde 2,1-aminomutase (GSA aminotransferase), the second
  enzyme of the C5 route to 5-aminolevulinate (ALA) in Escherichia coli. This pyridoxal
  5'-phosphate (PLP)-dependent enzyme of the class-III aminotransferase family moves the
  amino group of glutamate 1-semialdehyde from C2 to C1, forming ALA, the first common
  precursor of heme and siroheme. Catalysis is an intramolecular transamination that cycles
  the cofactor between its PLP and pyridoxamine 5'-phosphate forms through the
  4,5-diaminovalerate and 4,5-dioxovalerate intermediates, with Lys265 forming the internal
  aldimine. The soluble cytoplasmic enzyme is a homodimer that associates with
  glutamyl-tRNA reductase (HemA), allowing the reactive aldehyde substrate to be channelled
  between the two active sites. hemL mutants require ALA for growth.
