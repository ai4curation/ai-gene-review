suggested_questions:
- question: >-
    Does PhoP-dependent induction of hemL under Mg2+ limitation change ALA flux, and is
    HemL or HemA rate-limiting for ALA synthesis in E. coli?
suggested_experiments:
- hypothesis: HemL abundance limits ALA synthesis under PhoQ/PhoP-inducing conditions.
  description: >-
    Compare ALA, porphyrin intermediates and heme in wild type, phoP and hemL-overexpressing
    strains grown at low and high Mg2+, with HemL and HemA quantified by targeted
    proteomics.
