    CC   -!- FUNCTION: Conjugative DNA transfer (CDT) is the unidirectional
    CC       transfer of ssDNA plasmid from a donor to a recipient cell. It is
    CC       the central mechanism by which antibiotic resistance and virulence
    CC       factors are propagated in bacterial populations. Couples the
    CC       transferosome to a type IV secretion system. Probably forms a pore
    CC       through which single-stranded plasmid DNA is transferred to the
    CC       secretion system. The last 37 residues are important for
    CC       determining plasmid specificity and transfer efficiency, with
    CC       additional specificity conferred by the TraD-TraM pair.
    CC       {ECO:0000269|PubMed:9811665}.
    CC   -!- SUBUNIT: Interacts with relaxosome component TraM. May form a
    CC       hexamer in the membrane. {ECO:0000269|PubMed:15995191,
    CC       ECO:0000269|PubMed:18717787, ECO:0000269|PubMed:9324263}.
