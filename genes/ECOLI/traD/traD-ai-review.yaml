id: P09130
gene_symbol: traD
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  TraD is the type IV coupling protein of the F plasmid, a 717-residue inner
  membrane protein that connects the relaxosome to the secretion apparatus
  during conjugative DNA transfer. It is defined by what it joins rather than by
  a reaction it performs on its own: the relaxosome processes plasmid DNA at the
  origin of transfer, and TraD delivers that nucleoprotein complex to the
  membrane-spanning machine that translocates it into the recipient cell. The
  protein assembles into a hexameric ring that forms the cytoplasmic face of the
  conjugative pore, and it contacts the relaxosome through its C-terminal tail,
  which binds the relaxosome component TraM in grooves on a TraM tetramer. That
  tail is also the specificity determinant: shortening it lets TraD serve a
  broader range of mobilizable plasmids while reducing transfer of F itself. It
  belongs to the coupling-protein family whose other members include TrwB of
  R388, TraG of RP4 and VirD4 of the Agrobacterium T-DNA system.
references:
- id: GO_REF:0000044
  title: Gene Ontology annotation based on UniProtKB/Swiss-Prot Subcellular Location
    vocabulary mapping, accompanied by conservative changes to GO terms applied by UniProt
  findings: []
- id: PMID:18717787
  title: Structural basis of specific TraD-TraM recognition during F plasmid-mediated
    bacterial conjugation.
  findings:
  - statement: >-
      The TraD C-terminal peptide binds four symmetry-related grooves on a TraM
      tetramer, the first structural evidence of a relaxosome-coupling protein
      interaction.
    supporting_text: The structure reveals the TraD C-terminal peptide bound to each of four
      symmetry-related grooves on the surface of the TraM tetramer.
  - statement: >-
      The TraD-TraM interaction is specific and required for efficient F
      conjugation in vivo, which is the evidence behind the existing conjugation
      annotation.
    supporting_text: Mutational analysis indicates that these interactions are specific and
      required for efficient F conjugation in vivo.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Cached record is abstract-only. The abstract also characterises TraD as a
      hexameric ring ATPase forming the cytoplasmic face of the conjugative pore,
      which is treated here as a traceable statement rather than as an assay
      reported in this paper.
- id: PMID:9811665
  title: The carboxyl terminus of protein TraD adds specificity and efficiency to F-plasmid
    conjugative transfer.
  findings:
  - statement: >-
      TraD belongs to the coupling-protein family that also contains TrwB of
      R388, TraG of RP4 and VirD4 of Agrobacterium, whose members share
      transmembrane domains and nucleotide-binding sequence signatures.
    supporting_text: Proteins encoded by these genes, which are termed the TraG protein
      family, show significant similarities among their amino acid sequences and share
      transmembrane domains and sequence signatures for nucleoside triphosphate binding
  - statement: >-
      The C-terminal tail is the specificity determinant: truncating it broadens
      the range of relaxosomes TraD will serve while reducing F transfer
      efficiency.
    supporting_text: The change in specificity was due to a loss of some amino acids in the
      carboxyl terminus of TraD that resulted in a broadening of the range of mobilizable
      relaxosomes at the expense of a decrease in the efficiency of F-plasmid transfer.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text available in the cache. The clearest statement of the
      coupling-protein concept and of the family correspondence used by the type
      IV secretion module.
- id: PMID:9324263
  title: The cytoplasmic DNA-binding protein TraM binds to the inner membrane protein TraD
    in vitro.
  findings:
  - statement: >-
      TraM binds TraD in vitro, demonstrated by overlay assay and affinity
      chromatography. This is the first evidence of the relaxosome contact later
      resolved structurally.
    supporting_text: the affinity of TraM to TraD was studied in vitro by an overlay assay
      and by affinity chromatography.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Cached record is abstract-only. This is the reference UniProt cites for the
      inner-membrane location of P09130.
- id: PMID:15919815
  title: TrwB, the coupling protein involved in DNA transport during bacterial conjugation,
    is a DNA-dependent ATPase.
  findings:
  - statement: >-
      TrwB, the R388 coupling protein and a member of the same family as TraD,
      has a characterised DNA-dependent ATPase activity. This is the basis for
      inferring ATP hydrolysis for TraD.
    supporting_text: In this work, we characterize a DNA-dependent ATPase activity for
      TrwBDeltaN70.
  - statement: >-
      The soluble domain of TrwB crystallises as a hexamer with a central
      channel, matching the hexameric ring architecture attributed to TraD.
    supporting_text: TrwBDeltaN70 crystallographic structure revealed a hexamer with six
      equivalent subunits and a central channel.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Cited for a family member, not for TraD itself. That scope is stated on the
      annotation it supports, which carries an ISS evidence code with Q04230 in
      the supporting entities.
- id: PMID:11214325
  title: The bacterial conjugation protein TrwB resembles ring helicases and F1-ATPase.
  findings:
  - statement: >-
      TrwB recruits the relaxosome, the same role TraD performs for F, so the
      family correspondence is functional and not merely one of sequence.
    supporting_text: This large multimeric protein is responsible for recruiting the
      relaxosome DNA-protein complex
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Background for the family inference. Establishes the ring-helicase and
      F1-ATPase resemblance of the coupling-protein fold.
existing_annotations:
- term:
