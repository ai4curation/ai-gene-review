  knowledge_gaps:
  - gap_statement: >-
      ATP hydrolysis by F TraD has not been demonstrated directly. The inference
      rests on TrwB, which is well characterised, but the two proteins differ in
      their C-terminal specificity regions and no F-specific kinetics exist.
    boundary: >-
      Keep the ISS evidence code and the supporting entity on the annotation so
      the inference is visible, and do not upgrade it without an assay of TraD.
    gap_kind:
    - BIOLOGY
proposed_new_terms:
- proposed_name: type IV secretion coupling protein activity
  proposed_definition: >-
    Enables the selective recruitment of a nucleoprotein complex to a type IV secretion apparatus,
    determining which substrates that apparatus accepts.
  justification: >-
    No existing molecular function expresses the coupling-protein role, which is the recruitment
    of one complex to another with plasmid-level selectivity. ATP hydrolysis is the activity the
    coupling protein enables, but it does not capture what the protein is for, and the C-terminal
    specificity determinant has no representation at all. The role is shared across a defined
    family whose members include TraD of F, TrwB of R388, TraG of RP4 and VirD4 of the Agrobacterium
    T-DNA system, so a term would serve more than one gene. Pending such a term, this review asserts
    ATP hydrolysis as the molecular function and records the recruitment and specificity roles
    in the description and process terms, rather than reaching for a binding term that would name
    the partner without naming the function.
  proposed_parent:
    id: GO:0140597
    label: protein carrier activity
  supported_by:
  - reference_id: PMID:9811665
    supporting_text: Proteins encoded by these genes, which are termed the TraG protein
      family, show significant similarities among their amino acid sequences and share
      transmembrane domains and sequence signatures for nucleoside triphosphate binding
  - reference_id: PMID:9811665
    supporting_text: The change in specificity was due to a loss of some amino acids in the
      carboxyl terminus of TraD that resulted in a broadening of the range of mobilizable
      relaxosomes at the expense of a decrease in the efficiency of F-plasmid transfer.
suggested_questions:
- question: >-
    Can a molecular function be defined for coupling-protein activity? TraD,
    TrwB, TraG and VirD4 share a role that no current GO term expresses: they
    recruit a specific nucleoprotein complex to a translocation apparatus. ATP
    hydrolysis is what they enable, not what distinguishes them.
- question: >-
    Does F TraD hydrolyse ATP, and is the activity DNA-dependent as it is for
    TrwB? The inference is standard but has not been tested for this protein.
- question: >-
    Should the TraD-TraI interaction be curated alongside TraD-TraM? UniProt and
    the literature both note an in vivo TraD-TraI contact, but only the TraM
    interaction is structurally resolved and annotated.
suggested_experiments:
- description: >-
    Assay purified F TraD, or its soluble cytoplasmic domain, for ATP binding and
    hydrolysis in the presence and absence of single-stranded DNA, following the
    design used for the TrwB soluble domain. This would convert the ISS annotation
    proposed here into direct evidence or refute it.
- description: >-
    Determine whether the C-terminal specificity tail affects ATP hydrolysis as
    well as relaxosome selection, by comparing the activity of full-length TraD
    with the truncations that broaden relaxosome range. A coupling between
    selection and catalysis would explain why broadened specificity costs F
    transfer efficiency.
