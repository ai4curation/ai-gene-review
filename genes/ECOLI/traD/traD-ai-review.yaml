    label: plasma membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  supporting_entities:
  - UniProtKB-SubCell:SL-0037
  review:
    summary: >-
      Correct. Unlike many annotations of this class, the underlying location is
      experimentally supported rather than only inferred from the
      subcellular-location vocabulary: UniProt cites PMID:9324263 for the inner
      membrane assignment, and TraD is an integral membrane protein, not a
      peripheral one.
    action: ACCEPT
    reason: >-
      The term matches the experimentally supported location. No more specific
      child is warranted, and the hexameric assembly at the cytoplasmic face of
      the pore is captured by the complex annotation instead.
- term:
    id: GO:0009291
    label: unidirectional conjugation
  evidence_type: IMP
  original_reference_id: PMID:18717787
  qualifier: involved_in
  review:
    summary: >-
      Well supported. Mutations in the TraD-TraM interface are specific and
      required for efficient F conjugation in vivo, so the phenotype bears
      directly on TraD's contribution to conjugation rather than on a downstream
      consequence.
    action: ACCEPT
    reason: >-
      This is the right process term for a coupling protein, and the mutant
      evidence is specific to the interaction surface rather than to loss of the
      whole protein, which makes it unusually well targeted. Retained as a core
      annotation.
- term:
    id: GO:0016887
    label: ATP hydrolysis activity
  evidence_type: ISS
  original_reference_id: PMID:15919815
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q04230
  review:
    summary: >-
      Proposed from the characterised family member rather than from an assay of
      TraD. TrwB, the R388 coupling protein, is a DNA-dependent ATPase that
      crystallises as a hexamer with a central channel, and it performs the same
      relaxosome-recruitment role for its plasmid that TraD performs for F.
    action: NEW
    reason: >-
      The evidence code is ISS on purpose and the supporting entity names the
      family member the inference comes from, so the basis stays explicit rather
      than being laundered into an apparent direct observation. No assay of F
      TraD's own nucleotide binding or hydrolysis was found. The inference is
      stronger here than the comparable one for F TraC, which is why a molecular
      function is proposed for this protein and withheld for that one: the
      coupling-protein family has a biochemically characterised member whose
      functional role matches TraD's, and the hexameric architecture is shared.
- term:
    id: GO:0043684
    label: type IV secretion system complex
  evidence_type: TAS
  original_reference_id: PMID:18717787
  qualifier: part_of
  review:
    summary: >-
      TraD forms the cytoplasmic face of the conjugative pore, the entry point of
      the F-type secretion apparatus. UniProt independently records that it may
      form a hexamer and that it couples the transferosome to the type IV
      secretion system.
    action: NEW
    reason: >-
      Recorded with a traceable-author-statement code because the cited paper
      asserts the architecture as established background rather than determining
      the assembled machine itself; its own structure covers the TraD-TraM
      interface. Complex membership is nonetheless not in doubt, and GOA carries
      no cellular component for this protein beyond the membrane.
- term:
    id: GO:0044097
    label: secretion by the type IV secretion system
  evidence_type: IMP
  original_reference_id: PMID:9811665
  qualifier: involved_in
  review:
    summary: >-
      C-terminal truncations of TraD change which relaxosomes it will serve and
      reduce the efficiency of F transfer, which is a direct mutant-phenotype
      demonstration that TraD acts in substrate delivery to the secretion system.
    action: NEW
    reason: >-
      The cargo-agnostic process term is proposed alongside, not instead of,
      unidirectional conjugation. The two capture different things: conjugation is
      the outcome for the plasmid, while this term is what TraD contributes to
      mechanistically, and the specificity-switching phenotype is evidence about
      the secretion step rather than about transfer success as such.
core_functions:
- description: >-
    Type IV coupling protein of the F plasmid. TraD assembles into a hexameric
    ring in the inner membrane that forms the cytoplasmic face of the conjugative
    pore, and it recruits the relaxosome to that pore by binding the relaxosome
    component TraM through its C-terminal tail. The same tail sets which
    relaxosomes the protein will accept, so TraD is the component that makes the
    otherwise generic secretion apparatus specific to its own plasmid. ATP
    hydrolysis is inferred from the characterised family member TrwB rather than
    assayed for TraD itself.
