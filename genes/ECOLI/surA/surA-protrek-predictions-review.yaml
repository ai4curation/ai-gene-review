  source_reference_id: PMID:41039041
  predicted_term:
    id: GO:0089705
    label: protein localization to outer membrane
  predicted_term_type: GO_BP
  review:
    assessment: COR
    confidence_score: 2
    summary: >-
      Top-ranked hit (score 15.43) and absent from GOA. SurA is the main pathway delivering unfolded
      OMPs across the periplasm to BAM, so protein localization to the outer membrane is a correct
      and specific statement of its role; GOA records the outcome (outer membrane assembly) but not
      the localization process. Correct and novel. The same term was ProTrek's correct rank-1 call
      for Skp, the parallel-pathway chaperone, so the model is consistent across the two.
    supported_by:
    - reference_id: file:ECOLI/surA/surA-uniprot.txt
      supporting_text: >-
        Chaperone SurA
