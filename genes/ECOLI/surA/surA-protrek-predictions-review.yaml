id: P0ABZ6
gene_symbol: surA
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli (strain K12)
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for SurA, the primary periplasmic chaperone of outer membrane
  protein biogenesis. Rank 1 is correct and novel, and ranks 2 to 5 are four consecutive exact GOA
  matches spanning stabilization, compartment, outer membrane assembly and folding. Nothing in the
  top five is wrong - one of only a handful of genes in the cohort where that is true. The PPIase
  activity that this review records as a real but dispensable second function is not retrieved, which
  matches the review's own judgement of its importance. Assessment: 1 correct novel (COR), 2 correct
  not novel (CNN).
