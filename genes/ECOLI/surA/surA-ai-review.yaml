- term:
    id: GO:0006457
    label: protein folding
  evidence_type: IMP
  original_reference_id: PMID:8626309
  qualifier: involved_in
  review:
    summary: >-
      Lazar and Kolter (PMID:8626309) used trypsin sensitivity as a folding assay
      and demonstrated that the efficient folding of three outer membrane proteins
      (OmpA, OmpF, and LamB) requires SurA in vivo, while folding of four periplasmic
      proteins was independent of SurA.
    action: ACCEPT
    reason: >-
      Strong experimental evidence (IMP) directly demonstrating SurA's role in
      protein folding. The trypsin sensitivity assay is a validated approach for
      assessing protein conformation, and the specificity for OMPs over periplasmic
      proteins is informative.
    supported_by:
      - reference_id: PMID:8626309
        supporting_text: "We determined that the efficient folding of three outer membrane proteins (OmpA, OmpF, and LamB) requires SurA in vivo, while the folding of four periplasmic proteins was independent of SurA."
