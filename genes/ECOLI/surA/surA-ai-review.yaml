    summary: >-
      Behrens et al. (PMID:11226178) showed that SurA exhibits chaperone activity
      and interacts preferentially with in vitro synthesized porins (OmpA/P02931,
      OmpF/P02932, LamB/P02943) with >50-fold selectivity over other proteins. The
      interaction is mediated by the N-terminal and C-terminal domains, independent
