  label: Escherichia coli K-12
description: >-
  astC (b1748; also cstC, argM) encodes succinylornithine transaminase (SOAT, EC 2.6.1.81) of Escherichia
  coli, a dimeric, cytoplasmic pyridoxal 5'-phosphate-dependent class-III aminotransferase. It transaminates
  N2-succinyl-L-ornithine with 2-oxoglutarate to N-succinyl-L-glutamate 5-semialdehyde and L-glutamate,
  the third reaction of the ammonia-producing arginine succinyltransferase (AST) pathway, and is the first
  gene of the nitrogen- and sigma S-regulated astCADBE operon. Loss of AstC abolishes growth on arginine
  as nitrogen source and impairs ornithine utilization. AstC also has N-acetylornithine transaminase activity
  and is one of several redundant enzymes that can supply that step of arginine biosynthesis, although
  ArgD is the main biosynthetic enzyme.
