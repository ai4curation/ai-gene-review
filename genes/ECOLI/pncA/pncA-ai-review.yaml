taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  PncA is the nicotinamidase (nicotinamide deamidase) of Escherichia coli K-12, an isochorismatase-family
  cysteine hydrolase that deamidates nicotinamide to nicotinate and ammonia. Nicotinamide released by
  NAD+-consuming enzymes such as DNA ligase and the sirtuin CobB is thereby returned to the Preiss-Handler
  salvage route, in which nicotinate phosphoribosyltransferase PncB converts nicotinate to NaMN. The enzyme
  is expressed constitutively at low level and is soluble. Removal of nicotinamide by PncA also limits
  product inhibition of CobB, and a pncA deletion strain behaves similarly to a cobB deletion strain.
  PncA can hydrolyze pyrazinamide in vitro, which is not considered physiologically relevant.
