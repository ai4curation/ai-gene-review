  supporting_entities:
  - RHEA:35063
  review:
    summary: >-
      The row derives from the pyrazinamide-hydrolysis reaction (RHEA:35063), an in vitro side activity
      that UniProt does not consider physiologically relevant.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The GOA row is a Rhea-based IEA whose source reaction is pyrazinamide hydrolysis to pyrazinoate,
      not the nicotinamidase reaction. Pyrazinamide is an antitubercular drug, not a physiological E.
      coli substrate, and the activity is recorded only as an in vitro capability. Following the promiscuous-activity
      tiers, real in vitro activity with no shown use is marked as over-annotated rather than removed.
      Amidase activity is also an is_a ancestor of nicotinamidase activity (GO:0008936 is_a GO:0004040),
      so the physiological amidase function of PncA is captured by the accepted GO:0008936 rows; this
      row is not a duplicate of them because its basis is the drug reaction.
    supported_by:
    - reference_id: file:ECOLI/pncA/pncA-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: >-
        Is also able to hydrolyze the first-line antituberculous drug pyrazinamide (PZA) into pyrazinoic
        acid in vitro, but this reaction is not considered to be physiologically relevant.
