id: P21156
gene_symbol: cysD
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: CysD is the small catalytic subunit of Escherichia coli ATP sulfurylase. Together with the
  GTPase CysN, it converts sulfate and ATP to adenosine 5'-phosphosulfate (APS), initiating sulfate activation
  for the PAPS-dependent assimilatory pathway. CysN-coupled GTP hydrolysis drives this energetically unfavorable
  reaction. CysD-dependent sulfur metabolism also contributes to oxidative-stress resistance, without
  establishing direct peroxide-reductase activity.
