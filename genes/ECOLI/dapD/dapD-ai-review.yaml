taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: DapD (type 1 2,3,4,5-tetrahydropyridine-2,6-dicarboxylate N-succinyltransferase) catalyses
  the first step of the succinylase branch of the diaminopimelate (DAP) pathway of L-lysine biosynthesis
  in Escherichia coli. It uses succinyl-CoA to open and N-succinylate the tetrahydrodipicolinate ring,
  giving N-succinyl-2-amino-6-oxo-L-pimelate and CoA, which is then transaminated by DapC/ArgD. The soluble
  cytosolic enzyme is a trimeric hexapeptide-repeat (left-handed beta-helix) acyltransferase and is a
  sulfhydryl enzyme.
