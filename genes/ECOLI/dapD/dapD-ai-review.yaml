    label: nucleotidyltransferase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN001452257
  - UniProtKB:O67379
  - UniProtKB:P32173
  - UniProtKB:Q58517
  - UniProtKB:Q5JDA9
  review:
    action: REMOVE
    summary: Nucleotidyltransferase activity is over-propagated to DapD from the MobA/CobY/IPC-transferase
      part of PTHR19136.
    reason: The IBD at PTN001452257 is seeded only by nucleotidyltransferases (E. coli MobA P32173, archaeal
      CobY Q58517 and bifunctional IPC transferase/DIPP synthases O67379 and Q5JDA9) and sits deep in
      the heterogeneous PTHR19136 family. E. coli DapD is in the separate SF52 subfamily, consists of
      the tetrahydrodipicolinate succinyltransferase N-terminal domain plus a left-handed beta-helix hexapeptide
      acyltransferase domain, and its only demonstrated chemistry is succinyl transfer from succinyl-CoA.
      No nucleotidyl transfer has been reported for any DapD.
    supported_by:
    - *id002
