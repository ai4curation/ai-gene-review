- id: file:ECOLI/allF/allF-bioinformatics/RESULTS.md
  title: 'AllF: where the succinyl-CoA synthetase catalytic histidine went (sequence, profile and structure analysis)'
  findings:
  - statement: AllF has no histidine at the position of the SucD catalytic phosphohistidine.
    supporting_text: AllF has no histidine at the position of the SucD catalytic histidine.
  - statement: The Pfam PF00549 profile puts glutamine at the histidine column in AllF, Salmonella FdrA and YahF.
    supporting_text: By the Pfam PF00549 profile, SucD His247 is on match column 102, and that column holds Gln467
      in AllF, Gln466 in Salmonella FdrA and Gln483 in YahF.
  - statement: By superposition on PDB 3DMY the histidine loop is absent from AllF and Gln467 is not its structural
      equivalent.
    supporting_text: The SucD segment 242-251 (GKRMGHAGAI), which carries the catalytic histidine, has no AllF
      counterpart, and Gln467 superposes on SucD Lys262 (1.5-1.8 A), 18 A from the superposed histidine.
  - statement: Val293 is not the equivalent of the catalytic histidine.
    supporting_text: Val293 is not the equivalent of the catalytic histidine by either method.
  - statement: Met391 occupies the place of the histidine side chain in the second lobe.
    supporting_text: In lobe 2 the position of the histidine side chain is taken by Met391
  - statement: His389, in a family-specific insert, is the nearest histidine.
    supporting_text: Its CA is 9.0-9.4 A from the superposed His247 CA and its closest atom is 4.5-5.0 A from
      the superposed NE2.
  - statement: The distance of His389 from the histidine position depends on the superposition frame; it is
      larger in the dimer frame.
    supporting_text: In the dimer frame of result 9, with the histidine placed through lobe 1 of chain A, His389
      of chain B has its CA 15.1-15.4 A and its closest atom 9.5-9.8 A from the superposed histidine.
  - statement: The His389 side chain is next to the N-terminus of the lobe 2 phosphate-binding helix.
    supporting_text: Within each AllF chain, without any superposition, the His389 side chain is 3.2-3.4 A from
      the carbonyl oxygen of Thr338 and 5.3-5.6 A, 5.8-6.2 A and 8.4-8.8 A from the backbone nitrogens of Gly339,
      Gly340 and Thr341, the N-terminus of the lobe 2 power helix.
  - statement: The N-terminus of the phosphate-binding helix is kept in both lobes.
    supporting_text: SucD Ser154-Gly155-Thr156 superposes on AllF Ser202-Gly203-Thr204 (0.6-1.4 A) and on AllF
      Gly339-Gly340-Thr341 (0.5-1.1 A).
  - statement: In the crystal dimer of AllF, lobe 1 of one chain and lobe 2 of the other resemble, in trans, the
      arrangement of the alpha and beta C-terminal domains of succinyl-CoA synthetase (TM-score 0.63-0.64, RMSD
      3.8-3.9 A; similar, not identical).
    supporting_text: In the 3DMY homodimer, lobe 1 of one chain and lobe 2 of the other together superpose on the
      SucD C-terminal domain plus SucC C-terminal domain pair
  - statement: CoA in its SucD pose clashes with the ligand-free AllF structure.
    supporting_text: CoA carried over rigidly from the SucD structures then has 14-16 of its 48 atoms within 2.2
      A of an AllF atom, against 0-1 in its own site.
  - statement: Succinyl-CoA synthetase alpha subunits all have the histidine; AllF-family proteins mostly have glutamine
      at the profile column.
    supporting_text: Of the 951 UniProtKB entries of InterPro IPR061301 (AllF family), 764 have glutamine, 7 have
      histidine
  - statement: The His389 motif is a family character.
    supporting_text: The motif G[KR]PHPM that carries His389 is present in 884 of the 951 AllF-family entries and
      in none of the 53 succinyl-CoA synthetase alpha entries.
  - statement: AllG and AllF domains occur in one polypeptide in 150 UniProtKB entries.
    supporting_text: Of 1769 UniProtKB entries with the AllG domain PF06545, 150 also carry the CoA-ligase domain
      PF00549, 119 the CoA-binding domain PF02629 and 149 the AllF N-terminal domain PF27530; 1 carries the AllH
      domain PF11392.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Analysis written for this gene and run on 2026-11-22 (script catalytic_his_mapping.py, output results.yaml,
      all data fetched at run time). It reproduces results first obtained by three independent checks of the two
      OpenScientist reports. Informatics only; one superposition program, one AllF structure without AllG or AllH.
      It establishes the absence of the catalytic histidine and nothing about catalysis, ligand binding or
      the place of the active site.
- id: file:ECOLI/allF/allF-hypotheses/carbamoyltransferase-site-not-in-allf/openscientist.md
  title: 'OpenScientist report: is the carbamoyltransferase site of AllFGH in AllG or AllH and not in AllF? (fold assignment)'
  findings:
  - statement: The report maps the SucD catalytic histidine to AllF Val293.
    supporting_text: AllF holds Val293 at the SucD His247 catalytic position.
    finding_review:
      finding_status: OVERTURNED
      superseded_by:
      - file:ECOLI/allF/allF-bioinformatics/RESULTS.md
      review_notes: Residue 293 is valine, but it is not the equivalent of SucD His247. It lies outside the PF00549
        domain, and in a superposition of the SucD C-terminal domain on PDB 3DMY its CA is 26 A from the superposed
        histidine. The conclusion drawn from it, that AllF has no histidine at the catalytic position, is correct
        for another reason, which is that the loop carrying the histidine is absent.
      supported_by:
      - reference_id: file:ECOLI/allF/allF-bioinformatics/RESULTS.md
        supporting_text: It lies outside the PF00549 domain (AllF 336-491), and in the superposition its CA is 26
          A from the superposed His247 CA.
  - statement: AllG and AllF domains occur in one polypeptide in 119 to 150 UniProtKB entries.
    supporting_text: 119 entries carry both PF06545 (AllG) and PF02629 (AllF CoA-binding) in one chain, 150 carry
      PF06545 with PF00549 (AllF CoA-ligase), and 149 carry PF06545 with PF27530 (AllF HMA N-terminal).
    finding_review:
      finding_status: CORROBORATED
      review_notes: The counts were reproduced exactly on UniProt release 2026_04, together with one entry carrying
        the AllG and AllH domains.
      supported_by:
      - reference_id: file:ECOLI/allF/allF-bioinformatics/RESULTS.md
        supporting_text: Of 1769 UniProtKB entries with the AllG domain PF06545, 150 also carry the CoA-ligase domain
          PF00549, 119 the CoA-binding domain PF02629 and 149 the AllF N-terminal domain PF27530; 1 carries the
          AllH domain PF11392.
  reference_review:
    relevance: MEDIUM
    correctness: DISPUTED
    review_notes: 'Provider output (OpenScientist, run of 2026-11-22), not literature; nothing in it is used here
      without an independent check. Checked and confirmed: the UniProtKB domain co-occurrence counts (119, 150, 149
      and 1); the Pfam identifiers and that AllG (P77129) carries PF06545 and AllH (P0AAS5) PF11392; that YahF, YahG
      and YahE (b0320, b0321, b0319) are an adjacent paralogous set; and that AllF has no histidine at the catalytic
      position. Checked and refuted: the mapping of SucD His247 to AllF Val293, which the report uses as a line of
      evidence in several places. Not checked, and not used in this review: the Foldseek fold assignments of AllG
      and AllH, the absence of a carbamoyltransferase or carbamate kinase fold in them, the AllK positive control,
      the STRING scores, the statement that the phosphate loop of PF02629 is intact in AllF, the invariant D170-D171
      loop of AllH proposed as a metal or anion site, and the taxonomic spread of the fusions. The source-defect
      mechanism was not used for the wrong mapping: the report is a one-off run output with no upstream record
      to correct.'
- id: file:ECOLI/allF/allF-hypotheses/sca-alpha-phosphohistidine-retained/openscientist.md
  title: 'OpenScientist report: does AllF retain the catalytic phosphohistidine and CoA site of succinyl-CoA synthetase
    alpha? (profile and structure mapping)'
  findings:
  - statement: The report places Gln467 of AllF at the PF00549 column of the SucD catalytic histidine.
    supporting_text: PF00549 match column 102 holds SucD His247. At that column AllF has Gln467, YahF Gln483 and
      FdrA Gln466.
    finding_review:
      finding_status: CORROBORATED
      review_notes: Reproduced with pyhmmer against the same Pfam model. This is a statement about the profile
        alignment, not about the structure.
      supported_by:
      - reference_id: file:ECOLI/allF/allF-bioinformatics/RESULTS.md
        supporting_text: By the Pfam PF00549 profile, SucD His247 is on match column 102, and that column holds
          Gln467 in AllF, Gln466 in Salmonella FdrA and Gln483 in YahF.
  - statement: The report reads the histidine loop as substituted, GHAGA to QQIAT.
    supporting_text: 'The whole loop changes: SucD 246-250 GHAGA becomes AllF 466-470 QQIAT, YahF 482-486 QQSQM
      and FdrA 465-469 QQIAA.'
    finding_review:
      finding_status: DISPUTED
      superseded_by:
      - file:ECOLI/allF/allF-bioinformatics/RESULTS.md
      review_notes: By superposition on PDB 3DMY the loop is absent from AllF and not substituted. AllF 462-476,
        which contains QQIAT, pairs with SucD 257-271, fifteen residues after the histidine, and Gln467 is 18 A
        from the histidine position. The profile register is what the report says; it is not the structural
        equivalence the report takes it for. The superposition used one program and one AllF structure.
      supported_by:
      - reference_id: file:ECOLI/allF/allF-bioinformatics/RESULTS.md
        supporting_text: AllF 462-476 (QCRSQQIATLEDAGI) pairs residue by residue with SucD 257-271 (GTADEKFAALEAAGV).
  - statement: The report finds Met391 at the histidine position and His389 as the nearest histidine.
    supporting_text: The canonical histidine position in AllF is occupied by Met391 SE, 3.7 Å from where SucD His247
      NE2 superposes.
    finding_review:
