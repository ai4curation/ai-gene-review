id: Q47208
gene_symbol: allF
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: AllF (formerly FdrA) is one of the three subunits of oxamate carbamoyltransferase (oxamic transcarbamylase),
  the AllF-AllG-AllH enzyme of Escherichia coli. The enzyme acts in the oxamate branch of anaerobic allantoin utilization,
  where it converts oxalurate and phosphate to oxamate, a dead-end product that is excreted, and carbamoyl phosphate,
  from which carbamate kinase AllK then forms ATP and ammonia. This lets the cell recover nitrogen from allantoin,
  which E. coli can use as sole nitrogen source only anaerobically. The activity requires all three subunits and
  magnesium; AllF alone is inactive, and which subunit carries the active site is not known. allF is the first gene
  of the allFGHK operon, which is induced by allantoin under anaerobiosis through the regulators AllS and ArcA.
  AllF is a 555-residue protein homologous to the alpha subunit of succinyl-CoA synthetase, with CoA-binding and
  CoA-ligase domains and an additional N-terminal domain, but it is not a succinyl-CoA synthetase subunit and the
  enzyme is unrelated to the classical transcarbamylases. The gene was first named fdrA because a truncated fragment,
  in multicopy, suppressed dominant-negative ftsH mutations.
