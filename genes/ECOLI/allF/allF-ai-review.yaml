- id: PMID:38888336
  title: Oxamic transcarbamylase of Escherichia coli is encoded by the three genes allFGH (formerly fdrA, ylbE,
    and ylbF).
  findings:
  - statement: allF, allG and allH (formerly fdrA, ylbE and ylbF) encode oxamate carbamoyltransferase.
    supporting_text: This study discovered that allFGH (fdrA, ylbE, and ylbF) are the genes that encode the global
      orphan enzyme OXTCase.
  - statement: The activity was measured with purified recombinant AllF-AllG-AllH.
    supporting_text: The OXTCase activity and kinetics were successfully determined with purified recombinant AllF-AllG-AllH
      (FdrA-YlbE-YlbF)
  - statement: AllF alone has no detectable activity.
    supporting_text: However, the activity of OXTCase was not detected when only FdrA was present.
  - statement: The reaction product was identified as oxalurate by mass spectrometry.
    supporting_text: The mass of the new peak was analyzed by LC-MS as 131.0084, which corresponds to the molecular
      weight of oxalurate (Fig. 2D).
  - statement: The stoichiometry of the complex was assumed and not measured.
    supporting_text: the molecular mass of OXTCase was assumed to be 139 kDa, which was calculated considering it
      as a heterotrimer composed of three monomers
  - statement: The three genes form an operon with allK.
    supporting_text: The three genes form an operon together with allK (ybcF), encoding catabolic carbamate kinase.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Full text cached and read. The defining paper for the function: genetics, complementation, purification
      and kinetics. The assay ran in the direction of oxalurate synthesis. Subunit stoichiometry is assumed; the
      complex formula printed in the text and in Table 5 repeats AllG where AllH is probably meant. Substrate binding
      was only modelled by docking.'
- id: PMID:34494882
