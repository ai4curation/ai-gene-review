    Production Due to Changes in Allantoin Degradation.
  findings:
  - statement: fdrA is induced under anaerobic allantoin degradation and is needed for oxamate production.
    supporting_text: Transcription of fdrA was induced under anaerobic allantoin degradation conditions, and FdrA
      was shown to play a crucial role in oxamate production.
  - statement: The deletion strain makes no oxamate.
    supporting_text: the ΔfdrA strain could not produce oxamate in allantoin degradation analysis (Table 4), indicating
      that fdrA encodes an enzyme producing and not degrading oxamate.
  - statement: No succinyl-CoA synthetase activity was detected from FdrA (data not shown).
    supporting_text: We detected no SCS activity from FdrA expressed by pCA245N::fdrA (overexpression) or pNTR-SD::fdrA
      (complementation) using an SCS activity colorimetric assay kit (Sigma) (data not shown).
  - statement: The D296Y variant increases oxamate production.
    supporting_text: The FdrAD296Y variant increased glyoxylate conversion to malate by accelerating oxamate production
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached and read. First evidence that FdrA makes oxamate, from genetics and metabolite
      analysis; the enzyme was not purified here. The negative succinyl-CoA synthetase assay is reported as data
      not shown.
