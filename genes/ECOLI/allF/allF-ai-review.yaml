    review_notes: 'Provider output (OpenScientist, run of 2026-11-22), not literature; nothing in it is used here
      without an independent check. Checked and confirmed: the literal sequence segments; Gln467, Gln466 and Gln483
      at PF00549 column 102; the absence of the active-site signature IPR017440 (PROSITE PS00399) from AllF, YahF
      and Salmonella FdrA and its presence on SucD; Met391 at the histidine position; His389 in a family-specific
      insert after column 34; the retained helix N-terminus Thr338-Gly339-Gly340-Thr341. Confirmed in part:
      that His389 is close to the ancestral histidine position (side chain about 5 A, CA 9 A, in the lobe 2 frame
      only; 9-10 A in the dimer frame) and that CoA in its
      SucD pose clashes with PDB 3DMY (a rigid transplant on a ligand-free structure). Refuted by superposition:
      that Gln467 is the structural equivalent of the histidine and that the loop GHAGA became QQIAT; the loop is
      absent. The report rejected whole-chain structural superposition (it reports a TM-score of 0.439) and relied
      on profile columns alone; domain-wise superposition gives TM-scores of 0.62-0.64 and a different register.
      Its family percentages come from 125 sequences; on all 951 UniProtKB members of IPR061301 the His389 motif
      is in 884 and glutamine at column 102 in 764, not in all. Not checked, and not used in this review: the
      individual CoA-contact substitutions, the conservation percentages of the helix residues, the proposal
      that Gln467 or His389 contacts the substrate, and the model in which AllF carries the carbamoyl phosphate
      subsite, which the report itself labels a lead. The source-defect mechanism was not used for the disputed
      statement: the report is a one-off run output with no upstream record to correct.'
