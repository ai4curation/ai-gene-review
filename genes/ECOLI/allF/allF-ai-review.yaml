- term:
    id: GO:0000256
    label: allantoin catabolic process
  evidence_type: IDA
  original_reference_id: PMID:38888336
  qualifier: involved_in
  review:
    summary: EcoCyc IDA from the paper that identified AllF-AllG-AllH as oxamate carbamoyltransferase.
    action: ACCEPT
    reason: 'Core process. AllF is a subunit of the enzyme that carries out a step of anaerobic allantoin breakdown:
      the conversion of oxalurate to oxamate and carbamoyl phosphate. The gene product does part of the work of
      the process (it is part of the catalyst), so this is participation and not mere necessity. The deletion mutant
      makes no oxamate from allantoin and the purified three-subunit enzyme catalyses the reaction. GO:0000256 has
      no more specific descendant for the oxamate branch.'
    supported_by:
    - reference_id: PMID:38888336
      supporting_text: Taken together, these findings indicate that the oxamate-producing step catalyzed by OXTCase
        involves an enzyme encoded by the three genes allF, allG, and allH.
    - reference_id: PMID:38888336
      supporting_text: after oxidation of ureidoglycolate to oxalurate, it is converted to carbamoyl phosphate (CP)
        with the dead-end product oxamate by an oxamic transcarbamylase (OXTCase)
    - reference_id: PMID:38888336
      supporting_text: The OXTCase activity and kinetics were successfully determined with purified recombinant
        AllF-AllG-AllH (FdrA-YlbE-YlbF)
    - reference_id: PMID:34494882
      supporting_text: the ΔfdrA strain could not produce oxamate in allantoin degradation analysis (Table 4), indicating
        that fdrA encodes an enzyme producing and not degrading oxamate.
