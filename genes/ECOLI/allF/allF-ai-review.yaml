suggested_questions:
- question: AllF has lost the phosphohistidine of the succinyl-CoA synthetase alpha subunit. Does the oxamate carbamoyltransferase
    reaction nevertheless use a phosphorylated or carbamoylated enzyme intermediate, and does His389 of AllF, a
    family-specific histidine whose side chain is within 3.2-6.2 A of the retained N-terminus of a phosphate-binding
    helix (Thr338-Gly339-Gly340), take part in catalysis or in binding
    carbamoyl phosphate, or is AllF a non-catalytic scaffold for AllG and AllH?
- question: Do the proteins that carry AllG and AllF domains in one polypeptide (150 UniProtKB entries) have oxamate
    carbamoyltransferase activity, and do they need an AllH homolog for it?
- question: Should PAINT block the four succinyl-CoA synthetase terms (GO:0004775, GO:0004776, GO:0006099, GO:0009361)
    for the whole SF24 clade at PTN001671414, given that only AllF has assay data, Salmonella FdrA is 83% identical
    to it, and YahF is an uncharacterised and more divergent paralog?
- question: Is the SF24 clade really an enterobacterial duplicate of SucD, as the PANTHER tree draws it, or an older
    lineage placed there by its long branch? allFGH homologs are reported outside Enterobacteriaceae.
- question: Does the fdrA deletion appear in Table 1 of the swarming screen (PMID:17122336), and does the phenotype
    survive a non-polar deletion and complementation?
suggested_experiments:
- hypothesis: AllF carries part of the active site and the reaction passes through a covalent enzyme intermediate.
  description: Purify AllF, AllG and AllH separately, reconstitute all pairwise and triple combinations, and assay
    each. Incubate the enzyme with 32P-labelled carbamoyl phosphate and look for a labelled subunit. AllF has no
    histidine at the ancestral phosphohistidine position, so mutate the candidates that structure analysis points
    to and measure activity and labelling.
  experiment_type: Reconstitution, radiolabelling and site-directed mutagenesis
- hypothesis: His389 of AllF and the phosphate-binding helix N-terminus next to it in the crystal structure
    (Thr338-Gly339-Gly340-Thr341; side chain 3.2-6.2 A from residues 338-340) form part of the carbamoyl phosphate
    site.
  description: Make AllF H389A, H389Q and T341A in the co-expression construct, purify the three-subunit enzyme,
    confirm by gel filtration that the complex still assembles, and measure kinetics for carbamoyl phosphate and
    oxamate. Include S202A and T204A, the equivalent helix N-terminus of the first lobe. Loss of activity with
    assembly intact
    would place part of the active site on AllF; unchanged activity would point to AllG or AllH.
  experiment_type: Site-directed mutagenesis and enzyme kinetics
- hypothesis: AllF and AllG together form the catalytic unit.
  description: Express a natural protein that carries AllG and AllF domains in one polypeptide, with and without
    the AllH homolog of the same organism if it has one, and assay oxamate carbamoyltransferase activity.
  experiment_type: Heterologous expression and enzyme assay
- hypothesis: The enzyme has a defined subunit stoichiometry that differs from a 1:1:1 heterotrimer.
  description: Determine the mass of the purified enzyme by native mass spectrometry or SEC-MALS and solve its structure
    with oxamate and carbamoyl phosphate bound, which would also show which subunits bind the substrates.
  experiment_type: Native mass spectrometry and structure determination
- hypothesis: D296Y raises the catalytic rate or substrate affinity of the enzyme and not its abundance or assembly.
  description: Purify the complex containing AllF D296Y and compare its kinetics, yield and subunit ratio with the
    wild-type enzyme.
  experiment_type: Enzyme kinetics
- hypothesis: The enzyme works in the physiological direction with kinetics suited to oxalurate cleavage.
  description: Synthesize oxalurate and assay oxamate and carbamoyl phosphate formation from oxalurate and phosphate,
    alone and coupled to AllK.
  experiment_type: Enzyme assay
- hypothesis: AllF has no succinyl-CoA synthetase activity even with a beta subunit present.
  description: Co-express AllF with SucC and assay succinyl-CoA synthetase activity with ADP and GDP, with SucCD
    as the positive control, so that the negative result reported as data not shown is on record with the partner
    question addressed.
  experiment_type: Enzyme assay
- hypothesis: The swarming defect attributed to the fdrA deletion is a polar or indirect effect.
  description: Make an in-frame non-polar allF deletion, test swarming and swimming on the screen's medium, and
    complement with allF alone and with the whole operon.
  experiment_type: Genetic complementation
