      was confirmed by SDS-PAGE
  - reference_id: file:ECOLI/allF/allF-uniprot.txt
    record_section: ["CC:SUBUNIT"]
    supporting_text: The OXTCase is composed of 3 subunits, AllF, AllG and AllH.
knowledge_gaps:
- gap_statement: 'Whether AllF keeps any of the chemistry of the succinyl-CoA synthetase alpha subunit from which
    it descends is unknown: whether the reaction goes through a phosphorylated enzyme intermediate, and whether
    the CoA-binding domain still binds CoA or another ligand.'
  boundary: AllF has the CoA-binding and CoA-ligase domains of the succinyl-CoA synthetase alpha family, the oxamate
    carbamoyltransferase assay contains no CoA and no nucleotide, and no succinyl-CoA synthetase activity was detected
    from the protein. Whether a histidine equivalent to the catalytic phosphohistidine of SucD is conserved has
    not been established, and no phosphoenzyme experiment has been reported.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: It would show how a carbamoyl-transfer enzyme arose from a CoA ligase scaffold and whether the family's
    phosphohistidine mechanism was reused for carbamoyl phosphate.
  resolution: Labelling of the enzyme with 32P-carbamoyl phosphate, mutagenesis of conserved histidines of AllF,
    and CoA and nucleotide binding and dependence tests on the purified enzyme.
  provenance:
  - reference_id: PMID:38888336
    supporting_text: fdrA had been annotated as a gene encoding a putative acyl-CoA synthetase, oxamate:CoA ligase
      (Pfam 00549), or multicopy suppressor of dominant negative ftsH mutations
  - reference_id: PMID:38888336
    supporting_text: the OXTCase encoded by the three genes is a novel transcarbamylase that shows no similarity
      with known enzymes of the transcarbamylase family
- gap_statement: The subunit stoichiometry and architecture of oxamate carbamoyltransferase are not known.
  boundary: Untagged AllG co-elutes with His-tagged AllF and AllH-His from a construct tagged on both; with a tag on AllH alone, AllF and AllG were washed out (data not shown), so a stable AllF-AllH association has not been demonstrated. A 1:1:1 heterotrimer was assumed to calculate kcat; structure prediction
    suggests AllF and AllG dimers, and an unpublished crystal structure of an AllF fragment (PDB 3DMY, residues
    82-555) is a dimer.
  gap_kind:
  - BIOLOGY
  dark_aspect: CC_DARK
  status: OPEN
  resolution: Native mass spectrometry or SEC-MALS of the purified enzyme, and a cryo-EM or crystal structure of
    the complex.
  provenance:
  - reference_id: PMID:38888336
    supporting_text: it is difficult to predict how many dimers or monomers (AllF)2, (AllG)2, or (AllH)1 form the
      OXTCase
  - reference_id: PMID:38888336
    supporting_text: the molecular mass of OXTCase was assumed to be 139 kDa, which was calculated considering it
      as a heterotrimer composed of three monomers
- gap_statement: How an N-terminally truncated FdrA fragment in multicopy suppresses the protein-export and membrane-topology
    defects caused by dominant-negative FtsH is unexplained, and it is unknown whether the intact protein has any
    related activity.
  boundary: The suppression was reported in 1995 for a truncated fragment. The intact protein has since been shown
    to be an oxamate carbamoyltransferase subunit, a function with no evident link to FtsH or protein export.
  gap_kind:
  - BIOLOGY
  dark_aspect: BP_DARK
  status: OPEN
  resolution: Repeat the suppression with the intact gene and with the fragment in strains lacking allG and allH,
    and identify what the fragment binds.
  provenance:
  - reference_id: PMID:7500942
    supporting_text: One of the multicopy suppressor clones contained an N-terminally truncated version of a new
      gene that was designated fdrA.
  - reference_id: PMID:7500942
    supporting_text: The FdrA fragment suppressed both of the phenotypes--increased abnormal translocation of a
      normally cytoplasmic domain of a model membrane protein and retardation of protein export--caused by dominant
      negative FtsH proteins.
suggested_questions:
- question: Does the oxamate carbamoyltransferase reaction use a phosphorylated or carbamoylated enzyme intermediate
    on AllF, as the succinyl-CoA synthetase alpha subunit uses a phosphohistidine, or is AllF a non-catalytic scaffold
    for AllG and AllH?
- question: Should PAINT block the four succinyl-CoA synthetase terms (GO:0004775, GO:0004776, GO:0006099, GO:0009361)
    for the whole SF24 clade at PTN001671414, given that only AllF has assay data, Salmonella FdrA is 83% identical
    to it, and YahF is an uncharacterised and more divergent paralog?
- question: Is the SF24 clade really an enterobacterial duplicate of SucD, as the PANTHER tree draws it, or an older
    lineage placed there by its long branch? allFGH homologs are reported outside Enterobacteriaceae.
- question: Does the fdrA deletion appear in Table 1 of the swarming screen (PMID:17122336), and does the phenotype
    survive a non-polar deletion and complementation?
suggested_experiments:
- hypothesis: AllF carries part of the active site and the reaction passes through a covalent enzyme intermediate.
  description: Purify AllF, AllG and AllH separately, reconstitute all pairwise and triple combinations, and assay
    each. Incubate the enzyme with 32P-labelled carbamoyl phosphate and look for a labelled subunit. Mutate the
    conserved histidines of AllF and measure activity and labelling.
  experiment_type: Reconstitution, radiolabelling and site-directed mutagenesis
- hypothesis: The enzyme has a defined subunit stoichiometry that differs from a 1:1:1 heterotrimer.
  description: Determine the mass of the purified enzyme by native mass spectrometry or SEC-MALS and solve its structure
    with oxamate and carbamoyl phosphate bound, which would also show which subunits bind the substrates.
  experiment_type: Native mass spectrometry and structure determination
- hypothesis: D296Y raises the catalytic rate or substrate affinity of the enzyme and not its abundance or assembly.
  description: Purify the complex containing AllF D296Y and compare its kinetics, yield and subunit ratio with the
    wild-type enzyme.
  experiment_type: Enzyme kinetics
- hypothesis: The enzyme works in the physiological direction with kinetics suited to oxalurate cleavage.
  description: Synthesize oxalurate and assay oxamate and carbamoyl phosphate formation from oxalurate and phosphate,
    alone and coupled to AllK.
  experiment_type: Enzyme assay
- hypothesis: AllF has no succinyl-CoA synthetase activity even with a beta subunit present.
  description: Co-express AllF with SucC and assay succinyl-CoA synthetase activity with ADP and GDP, with SucCD
    as the positive control, so that the negative result reported as data not shown is on record with the partner
    question addressed.
  experiment_type: Enzyme assay
- hypothesis: The swarming defect attributed to the fdrA deletion is a polar or indirect effect.
  description: Make an in-frame non-polar allF deletion, test swarming and swimming on the screen's medium, and
    complement with allF alone and with the whole operon.
  experiment_type: Genetic complementation
