id: Q47208
gene_symbol: allF
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: AllF (formerly FdrA) is one of the three subunits of oxamate carbamoyltransferase (oxamic transcarbamylase),
  the AllF-AllG-AllH enzyme of Escherichia coli. The enzyme acts in the oxamate branch of anaerobic allantoin utilization,
  where it converts oxalurate and phosphate to oxamate, a dead-end product that is excreted, and carbamoyl phosphate,
  from which carbamate kinase AllK then forms ATP and ammonia. This lets the cell recover nitrogen from allantoin,
  which E. coli can use as sole nitrogen source only anaerobically. The activity requires all three subunits and
  magnesium; AllF alone is inactive, and which subunit carries the active site is not known. allF is the first gene
  of the allFGHK operon, which is induced by allantoin under anaerobiosis through the regulators AllS and ArcA.
  AllF is a 555-residue protein homologous to the alpha subunit of succinyl-CoA synthetase, with CoA-binding and
  CoA-ligase domains and an additional N-terminal domain, but it lacks a counterpart of the histidine that is phosphorylated during
  catalysis in succinyl-CoA synthetase alpha subunits, it is not a succinyl-CoA synthetase subunit, and the
  enzyme is unrelated to the classical transcarbamylases. The gene was first named fdrA because a truncated fragment,
  in multicopy, suppressed dominant-negative ftsH mutations.
existing_annotations:
- term:
    id: GO:0000256
    label: allantoin catabolic process
  evidence_type: IDA
  original_reference_id: PMID:38888336
  qualifier: involved_in
  review:
    summary: EcoCyc IDA from the paper that identified AllF-AllG-AllH as oxamate carbamoyltransferase.
    action: ACCEPT
    reason: 'Core process. AllF is a subunit of the enzyme that carries out a step of anaerobic allantoin breakdown:
      the conversion of oxalurate to oxamate and carbamoyl phosphate. The gene product does part of the work of
      the process (it is part of the catalyst), so this is participation and not mere necessity. The deletion mutant
      makes no oxamate from allantoin and the purified three-subunit enzyme catalyses the reaction. GO:0000256 has
      no more specific descendant for the oxamate branch.'
    supported_by:
    - reference_id: PMID:38888336
      supporting_text: Taken together, these findings indicate that the oxamate-producing step catalyzed by OXTCase
        involves an enzyme encoded by the three genes allF, allG, and allH.
    - reference_id: PMID:38888336
      supporting_text: after oxidation of ureidoglycolate to oxalurate, it is converted to carbamoyl phosphate (CP)
        with the dead-end product oxamate by an oxamic transcarbamylase (OXTCase)
    - reference_id: PMID:38888336
      supporting_text: The OXTCase activity and kinetics were successfully determined with purified recombinant
        AllF-AllG-AllH (FdrA-YlbE-YlbF)
    - reference_id: PMID:34494882
      supporting_text: the ΔfdrA strain could not produce oxamate in allantoin degradation analysis (Table 4), indicating
        that fdrA encodes an enzyme producing and not degrading oxamate.
