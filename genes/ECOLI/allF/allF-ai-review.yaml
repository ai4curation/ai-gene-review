core_functions:
- description: Subunit of oxamate carbamoyltransferase (AllF-AllG-AllH), which converts oxalurate and phosphate
    to oxamate and carbamoyl phosphate in the oxamate branch of anaerobic allantoin utilization. AllF alone is inactive;
    its own contribution to catalysis is not known.
  contributes_to_molecular_function:
    id: GO:0050205
    label: oxamate carbamoyltransferase activity
  directly_involved_in:
  - id: GO:0000256
    label: allantoin catabolic process
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:38888336
    supporting_text: The OXTCase activity and kinetics were successfully determined with purified recombinant AllF-AllG-AllH
      (FdrA-YlbE-YlbF)
  - reference_id: PMID:38888336
    supporting_text: However, the activity of OXTCase was not detected when only FdrA was present.
  - reference_id: PMID:38888336
    supporting_text: Taken together, these findings indicate that the oxamate-producing step catalyzed by OXTCase
      involves an enzyme encoded by the three genes allF, allG, and allH.
  - reference_id: PMID:38888336
    supporting_text: after oxidation of ureidoglycolate to oxalurate, it is converted to carbamoyl phosphate (CP)
      with the dead-end product oxamate by an oxamic transcarbamylase (OXTCase)
  - reference_id: file:ECOLI/allF/allF-uniprot.txt
    record_section: ["CC:SUBUNIT"]
    supporting_text: The OXTCase is composed of 3 subunits, AllF, AllG and AllH.
  knowledge_gaps:
  - gap_statement: 'What AllF itself does in the enzyme is undetermined: which of AllF, AllG and AllH carries the
      active site, which binds oxalurate, carbamoyl phosphate and magnesium, and whether AllF is catalytic or structural.'
    boundary: The three-subunit enzyme is active when purified, all three genes are required in vivo, and AllF alone
      has no detectable activity. Substrate binding has only been modelled by docking to each subunit separately;
      no mutagenesis or structure of the complex exists. Sequence and structure analysis of AllF alone narrows the
      question without answering it. AllF has no histidine at the position of the catalytic phosphohistidine of the
      succinyl-CoA synthetase alpha subunit, so whatever it contributes is not done through that residue. It keeps
      the N-terminus of a phosphate-binding helix in each of its two SucD-like lobes (Ser202-Gly203-Thr204 and
      Gly339-Gly340-Thr341),
      and in the crystal dimer of AllF (PDB 3DMY) lobe 1 of one chain and lobe 2 of the other are arranged like
      the C-terminal domains of the alpha and beta subunits of succinyl-CoA synthetase. His389, a histidine in a
      motif found in 884 of 951 AllF-family sequences and in no succinyl-CoA synthetase alpha subunit surveyed,
      lies about 5 A from where the ancestral histidine side chain would be when the SucD C-terminal domain is
      superposed on lobe 2 of the same chain, and 9-10 A from it in the dimer frame, in which lobe 1 of the other
      chain takes the alpha role. In 150 UniProtKB entries the AllG
      domain is in one polypeptide with AllF domains, against one entry with the AllH domain. These are positions
      in a structure of AllF without its partners and counts of domain co-occurrence. They make a phosphate or
      carbamoyl phosphate site on AllF, perhaps completed by AllG, a hypothesis to test; they are not evidence
      of binding or catalysis, and they say nothing about AllH.
    gap_kind:
    - BIOLOGY
    dark_aspect: MF_DARK
    status: OPEN
    significance: Without it AllF can only be annotated as contributing to the activity of the complex, and no residue-level
      rule can separate this clade from succinyl-CoA synthetase alpha subunits.
    resolution: Reconstitution from separately purified subunits and pairwise combinations, a structure of AllF-AllG-AllH
      with substrates, and site-directed mutagenesis of conserved residues in each subunit, starting in AllF with
      His389 and Thr341 and with assembly of the complex checked for each variant.
    provenance:
    - reference_id: PMID:38888336
      supporting_text: However, the activity of OXTCase was not detected when only FdrA was present.
    - reference_id: PMID:38888336
      supporting_text: Subsequent studies on its protein structure will soon be conducted.
    - reference_id: file:ECOLI/allF/allF-bioinformatics/RESULTS.md
      supporting_text: Nothing here says where AllG and AllH bind, which subunit holds the carbamoyltransferase
        site, or whether the dimer seen in the crystal exists in the enzyme.
    - reference_id: file:ECOLI/allF/allF-bioinformatics/RESULTS.md
      supporting_text: That no phosphoenzyme forms, and whether His389 or the power helices take part in catalysis,
        are not shown.
proposed_new_terms:
- proposed_name: oxamate carbamoyltransferase complex
  proposed_definition: A protein complex that catalyses the reaction carbamoyl phosphate + oxamate = oxalurate +
    phosphate. In Escherichia coli it consists of the AllF, AllG and AllH subunits; the stoichiometry is not known.
  justification: AllF, AllG and AllH are jointly required for oxamate carbamoyltransferase activity in vivo and the activity was measured on a preparation containing all three (AllG untagged, co-eluting with tagged AllF and AllH); AllF alone is inactive. Physical association of all three has not been shown directly (a single tag on AllH did not retain AllF and AllG). GO has no complex term to record their association. The only carbamoyltransferase
    complex in GO is GO:0009347 aspartate carbamoyltransferase complex.
  proposed_parent:
    id: GO:1990234
    label: transferase complex
  supported_by:
  - reference_id: PMID:38888336
    supporting_text: only a small fraction of the His-tagged AllH was detected, indicating that AllF and AllG were
      washed out (data not shown)
  - reference_id: PMID:38888336
    supporting_text: The OXTCase activity and kinetics were successfully determined with purified recombinant AllF-AllG-AllH
      (FdrA-YlbE-YlbF)
  - reference_id: PMID:38888336
    supporting_text: The successful overproduction of 6×His-AllF (62 kDa), AllG (46 kDa), and AllH-6×His (31 kDa)
      was confirmed by SDS-PAGE
  - reference_id: file:ECOLI/allF/allF-uniprot.txt
    record_section: ["CC:SUBUNIT"]
    supporting_text: The OXTCase is composed of 3 subunits, AllF, AllG and AllH.
knowledge_gaps:
- gap_statement: 'Whether the oxamate carbamoyltransferase reaction passes through a covalent enzyme intermediate
    is unknown, and so is whether the domains AllF inherited from the succinyl-CoA synthetase alpha subunit still
    bind a ligand: CoA, phosphate or carbamoyl phosphate.'
  boundary: AllF has the CoA-binding and CoA-ligase domains of the succinyl-CoA synthetase alpha family, the oxamate
    carbamoyltransferase assay contains no CoA and no nucleotide, and no succinyl-CoA synthetase activity was detected
    from the protein. Sequence and structure analysis establishes that AllF has no histidine at the position of
    the catalytic phosphohistidine of E. coli SucD (His247; His246 in the numbering of the crystal structures).
    In superpositions on the AllF crystal structure (PDB 3DMY, residues 101-555, no ligand) the ten-residue SucD
    segment that carries the histidine has no counterpart in either of the two SucD-like lobes of AllF, and in
    the second lobe the place of the histidine side chain is taken by Met391. The Pfam PF00549 profile puts Gln467
    of AllF at the column of the histidine, but by superposition Gln467 lies 18 A from the histidine position,
    so the loop is absent and not substituted. A phosphohistidine at the ancestral position is therefore excluded.
    A covalent intermediate on another residue is not excluded. His389, in an insert specific to the AllF family,
    is the nearest histidine. Its closest atom is about 5 A from the ancestral histidine position when the SucD
    C-terminal domain is superposed on the second lobe, and 9-10 A from it when the histidine is placed through
    the first lobe of the other chain of the crystal dimer. Within one chain its side chain is 3.2-3.4 A from
    the carbonyl oxygen of Thr338 and 5-6 A from the backbone nitrogens of Gly339 and Gly340, at the retained
    N-terminus of the phosphate-binding helix of the second lobe. CoA placed rigidly in its SucD pose
    clashes with the ligand-free AllF structure, whose Rossmann-like domain has a permuted chain order; that shows
    the SucD pose is blocked in this crystal form, not that CoA cannot bind. No phosphoenzyme, carbamoyl-enzyme
    or ligand-binding experiment has been reported.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: It would show how a carbamoyl-transfer enzyme arose from a CoA ligase scaffold, and whether a covalent
    mechanism survived the loss of the phosphohistidine of the family, on another residue or on another subunit.
  resolution: Labelling of the purified enzyme with 32P-carbamoyl phosphate and with 14C-carbamoyl phosphate, with
