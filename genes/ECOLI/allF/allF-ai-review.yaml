  review:
    summary: IBA from the LUCA node of the succinyl-CoA synthetase alpha-subunit family (PTN000122012).
    action: REMOVE
    reason: 'AllF is not a succinyl-CoA synthetase subunit. Its assayed function is as one of three subunits of
      oxamate carbamoyltransferase, which splits oxalurate into oxamate and carbamoyl phosphate with no CoA and
      no nucleotide in the reaction. Its partners are AllG and AllH, neither of which belongs to the succinyl-CoA
      synthetase beta-subunit family (PTHR11815), so AllF has no nucleotide-binding beta partner in its complex.
      The laboratory that characterised the enzyme reports that it detected no succinyl-CoA synthetase activity
      from FdrA (data not shown in the paper, so supporting and not decisive on its own). E. coli has a dedicated
      succinyl-CoA synthetase, SucCD. The IBD at the LUCA node PTN000122012 is well placed for the succinyl-CoA
      synthetase alpha subunits, and this row is not an argument against that placement. The fault is that the SF24
      clade (PTN001671414: AllF, its paralog YahF and Salmonella FdrA) descends from the node and inherits the term.
      In the PANTHER tree the clade sits on a branch of length 1.587, more than ten times that of its sister clade
      containing E. coli SucD (0.116), and AllF is 555 residues against 289 for SucD, with an N-terminal domain
      that SucD lacks. The family review of PTHR11117 already marks this node NEEDS_PRUNING for SF24. A loss at
      PTN001671414 would fix the row.
      Sequence and structure analysis adds a residue-level reason. AllF has no histidine at the position of the
      catalytic phosphohistidine of the alpha subunit (His247 of E. coli SucD): on the AllF crystal structure (PDB
      3DMY) the ten-residue SucD segment that carries the histidine has no counterpart in either of the two SucD-like
      lobes of AllF, whereas all 53 reviewed succinyl-CoA synthetase alpha subunits surveyed have the histidine. At
      the Pfam PF00549 profile column of that histidine AllF, YahF and Salmonella FdrA all have glutamine. This shows
      that the residue is absent; that AllF forms no phosphoenzyme has not been tested.'
    supported_by:
