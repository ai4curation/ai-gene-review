  review:
    summary: IBA from the enterobacterial SF24 node PTN001671414, seeded by the paralog YahF (P77187).
    action: ACCEPT
    reason: 'Accepted as the site of the core activity, on indirect grounds. The node is the right one for a claim
      about this clade: it covers only AllF, YahF and Salmonella FdrA, and AllF is inside it. No experiment has
      located AllF itself. The support is that AllF is a soluble enzyme with no signal peptide or transmembrane
      segment recorded in UniProt, that the recombinant AllF-AllG-AllH enzyme is recovered from the supernatant
      of a cleared lysate (the lysis buffer contained 0.5% Triton X-100, so this alone does not exclude membrane
      association), and that its substrates and the neighbouring enzymes of the pathway are cytoplasmic. The seed
      is YahF''s EcoCyc IDA from PMID:17309111, a proteomic analysis of an inner-membrane fraction that is cached
      as abstract only; how it supports a cytosol annotation for YahF was not checked, so the seed is left unresolved
      here. Cytosol is not a root organelle term, so the organelle policy does not apply.'
    supported_by:
