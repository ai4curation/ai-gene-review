gene_symbol: dacB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  DacB is penicillin-binding protein 4 (PBP4), a low-molecular-mass
  penicillin-binding protein of the peptidase S13 family. It is exported to the
  periplasm by a cleavable signal peptide and associates loosely with the inner
  membrane. PBP4 is a bifunctional peptidoglycan hydrolase: it acts as a
  D,D-endopeptidase that cleaves D-Ala-mDAP 4-3 crosslinks between stem peptides
  and as a D,D-carboxypeptidase that removes the terminal D-alanine from
  pentapeptide stems; it does not perform transpeptidation. The penicillin-binding
  domain carries the serine-acyl active site, and an insertion of about 188
  residues between the SXXK and SXN motifs forms additional domains of unique
  fold. PBP4 is dispensable for growth, but together with the amidases (above all
  AmiC) and PBP7 it contributes to daughter-cell separation and normal cell shape,
  and it binds the outer-membrane lipoprotein NlpI, which scaffolds peptidoglycan
  endopeptidases with peptidoglycan synthases.
