- term:
    id: GO:0043093
    label: FtsZ-dependent cytokinesis
  evidence_type: IGI
  original_reference_id: PMID:16855223
  qualifier: acts_upstream_of_or_within
  review:
    summary: Deleting dacB in an amiC mutant produces chains of unseparated cells.
    action: MODIFY
    reason: >-
      The genetic interaction shows PBP4 contributes, redundantly with the
      amidases and PBP7, to separating daughter cells at the end of division: the
      phenotype is chains of unseparated cells after constriction, which is
      downstream of the FtsZ-dependent constriction step. GO:0000920 septum
      digestion after cytokinesis is defined as "The process of physically
      separating the septal cell wall material by enzymatic digestion, that occurs
      after daughter cells are separated by cytokinesis", which matches the assay
      and the enzyme's hydrolase role better than FtsZ-dependent cytokinesis. The
      role is peripheral to the core hydrolase activity, and the
      acts_upstream_of_or_within qualifier is kept.
    proposed_replacement_terms:
    - id: GO:0000920
      label: septum digestion after cytokinesis
    supported_by:
    - reference_id: PMID:16855223
      supporting_text: >-
        We show here that deleting the endopeptidase PBP 4 from strains lacking
        AmiC produces long chains of unseparated cells, indicating that PBP 4
        collaborates with the major peptidoglycan amidases during cell separation.
