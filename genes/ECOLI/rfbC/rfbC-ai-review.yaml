id: P37745
gene_symbol: rfbC
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  rfbC (rmlC, b2038) encodes dTDP-4-dehydrorhamnose 3,5-epimerase (RmlC) of Escherichia coli K-12, a small
  cupin-fold homodimeric enzyme. It inverts the configuration at C3 and C5 of dTDP-4-dehydro-6-deoxy-alpha-D-glucose
  to give dTDP-4-dehydro-beta-L-rhamnose, the third step of dTDP-L-rhamnose biosynthesis, without a cofactor,
  using an active-site His/Tyr acid-base pair inferred from structures of orthologs. The gene lies in
  the rfb (O16 antigen) cluster, and the dTDP-L-rhamnose it helps produce is a component of the O16 repeat
  unit. In genome-wide screens rfbC deletion mutants of K-12 are hypersensitive to several stresses, an
  indirect phenotype likely linked to envelope or sugar-nucleotide perturbation.
