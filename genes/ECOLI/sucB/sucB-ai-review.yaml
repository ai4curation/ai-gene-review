  label: Escherichia coli (strain K12)
description: SucB is the lipoylated E2o core of the E. coli 2-oxoglutarate dehydrogenase complex. Its dihydrolipoyllysine-residue succinyltransferase active domain accepts the succinyl group generated by SucA on a covalently lipoylated lysine and transfers it to coenzyme A, producing succinyl-CoA in the tricarboxylic acid cycle.
