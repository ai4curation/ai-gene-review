    label: intermembrane phospholipid transfer
  evidence_type: IDA
  original_reference_id: PMID:28388411
  qualifier: acts_upstream_of_or_within
  review:
    summary: >-
      Ekiert et al. 2017 solved the lipid-bound MlaC structure and showed MlaC
      binds both the inner-membrane MlaFEDB and outer-membrane MlaA-OmpF
      complexes, supporting MlaC as the lipid ferry between membranes.
    action: ACCEPT
