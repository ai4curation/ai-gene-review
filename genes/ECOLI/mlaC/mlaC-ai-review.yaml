core_functions:
- description: >-
    Periplasmic phospholipid carrier: receives a diacyl phospholipid into its
    hydrophobic pocket at one envelope membrane complex (MlaA-OmpC/F in the
    outer membrane or MlaD of MlaFEDB in the inner membrane), carries it across
    the aqueous periplasm and delivers it to the other, with ATP hydrolysis by
    MlaFEDB driving net retrograde flow into the inner membrane.
