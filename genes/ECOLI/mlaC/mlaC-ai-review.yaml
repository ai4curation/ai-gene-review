      Consistent with the IBA row and with subsequent direct transfer assays;
      MlaC is the defining participant of the process.
    supported_by:
    - reference_id: PMID:28388411
      supporting_text: These results demonstrate that MlaC is capable of binding to both the IM and OM complexes, supporting a model where MlaC plays a central role in transferring a lipid substrate from one membrane to another.
- term:
    id: GO:0120014
    label: phospholipid transfer activity
  evidence_type: IDA
  original_reference_id: PMID:34873038
  qualifier: enables
  review:
    summary: >-
      Point-to-point transfer assays with [14C]-labelled phospholipids show
      purified MlaC delivers phospholipid to MlaFEDB nanodiscs and receives
      phospholipid from MlaFEDB, i.e. it carries phospholipid through the
      aqueous phase between membrane-associated donor and acceptor sites.
    action: NEW
    reason: >-
      MlaC's molecular activity is not represented in GOA. GO:0120014 (removes a
      phospholipid from a membrane, transports it through the aqueous phase
      while protected in a hydrophobic pocket, delivers it to an acceptor
      membrane) matches MlaC exactly: lipid sits in a hydrophobic pocket
      (PMID:28388411), MlaC transfers to MlaFEDB (PMID:34873038), and MlaD
      transfers to MlaC (PMID:30284446). This is a molecular function directly
      demonstrated with purified protein, not an inference from necessity.
    supported_by:
    - reference_id: PMID:34873038
      supporting_text: Here, we develop a sensitive point-to-point in vitro lipid transfer assay that allows direct tracking of [14C]-labeled PLs between the periplasmic chaperone MlaC and MlaFEDB reconstituted into nanodiscs.
    - reference_id: PMID:30284446
      supporting_text: we demonstrated using purified proteins that MlaD spontaneously transfers PLs to MlaC, suggesting that the latter has a higher affinity for PLs.
- term:
    id: GO:0005543
    label: phospholipid binding
  evidence_type: IDA
  original_reference_id: PMID:28388411
  qualifier: enables
  review:
    summary: >-
      The 1.5 Å crystal structure of E. coli MlaC contains a diacyl phospholipid
      (modelled as phosphatidic acid) bound with both acyl chains buried in a
      deep hydrophobic pocket.
    action: NEW
    reason: >-
      Direct structural evidence for phospholipid binding by E. coli MlaC; the
      binding state is the basis of its carrier activity and is reported
      independently by co-purification and apo/holo structures (PMID:31235958).
      Not redundant with GO:0120014, which is not an is_a descendant of
      phospholipid binding in GO.
    supported_by:
    - reference_id: PMID:28388411
      supporting_text: The two acyl chains of the lipid insert snugly into the protein core where they are protected from solvent (Figure 4C), while the head group is almost entirely solvent exposed and makes only minor contacts with the protein (Figure 4E).
