suggested_questions:
- question: >-
    What is the stoichiometry and head-group/acyl-chain preference of
    phospholipid loading by E. coli MlaC in vivo (one versus two diacyl
    phospholipids, cardiolipin)?
- question: >-
    How is lipid release from MlaC at MlaD coupled to MlaFEDB ATP hydrolysis,
    given that MlaC alone does not stimulate the transporter ATPase?
suggested_experiments:
- description: >-
    Native mass spectrometry and lipidomics of MlaC purified from the periplasm
    of wild-type versus mlaA and mlaFEDB mutant strains, to define which
    phospholipids MlaC carries in vivo and from which membrane they originate.
  experiment_type: native MS / lipidomics
