gene_symbol: mlaC
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  MlaC (formerly YrbC) is the soluble periplasmic phospholipid carrier of the
  Mla (maintenance of lipid asymmetry) intermembrane phospholipid transport
  system. Exported by a cleaved N-terminal signal peptide, it adopts a mixed
  alpha/beta fold related to the NTF2/cystatin superfamily, with a deep
  hydrophobic pocket that accommodates the two acyl chains of a diacyl
  phospholipid while leaving the head group solvent-exposed, so binding shows
  little head-group selectivity; a pivoting beta-sheet opens and closes the
  pocket between apo and lipid-loaded states. MlaC docks transiently on the
  periplasmic base of the outer-membrane MlaA-OmpC/OmpF complex and on the MlaD
  hexamer of the inner-membrane ABC transporter MlaFEDB, and shuttles
  phospholipid across the aqueous periplasm between them. Purified MlaC
  exchanges phospholipids spontaneously with MlaD/MlaFEDB, and ATP hydrolysis
  by MlaFEDB drives net movement from MlaC into the inner membrane, the
  retrograde direction that removes phospholipids mislocalized in the outer
  leaflet of the outer membrane. Loss of MlaC causes phospholipid accumulation
  in the outer leaflet, increased outer membrane permeability and sensitivity
  to SDS-EDTA.
