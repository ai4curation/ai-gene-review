- id: PMID:19383799
  title: An ABC transport system that maintains lipid asymmetry in the gram-negative
    outer membrane.
  findings:
  - statement: Defines the Mla pathway, with components in each envelope compartment, as preventing outer-leaflet phospholipid accumulation.
    supporting_text: This highly conserved pathway, which we have termed the Mla pathway for its role in preserving OM lipid asymmetry, is composed of at least 6 proteins and contains at least 1 component in each cellular compartment.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Founding Mla paper; abstract only cached. UniProt cites it
      (ECO:0000269) for the mlaC disruption phenotype.
- id: PMID:28388411
  title: Architectures of Lipid Transport Systems for the Bacterial Outer Membrane.
  findings:
  - statement: 1.5 Å crystal structure of MlaC with a diacyl lipid in a hydrophobic pocket; predicted broad head-group tolerance.
    supporting_text: Due to the small size of the hydrophobic cavity and the lack of head group interactions, we predict that MlaC is capable of binding to a wide range of diacyl lipids with little head group specificity.
  - statement: MlaC binds MlaFEDB, MlaD and MlaA-OmpF by biolayer interferometry.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Ekiert et al. 2017 Cell; full text cached.
- id: PMID:34873038
  title: ATP disrupts lipid-binding equilibrium to drive retrograde transport critical
    for bacterial outer membrane asymmetry.
  findings:
  - statement: MlaC transfers phospholipid to MlaFEDB spontaneously and ATP hydrolysis drives net retrograde transfer; reverse transfer is abolished by ATP.
    supporting_text: Therefore, we have shown that PLs equilibrate between MlaC and MlaFEDB, and ATP hydrolysis drives overall transport in the retrograde direction.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Low, Thong & Chng 2021 PNAS; full text cached.
