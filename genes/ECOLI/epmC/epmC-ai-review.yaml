      of the three IDA rows. Abstract-only in cache, so reaction details are quoted from the UniProt
      entry, whose catalytic activity and function lines cite this paper (ECO:0000269).
- id: PMID:25274739
  title: The non-canonical hydroxylase structure of YfcM reveals a metal ion-coordination motif required
    for EF-P hydroxylation.
  findings:
  - statement: Crystal structure of EpmC shows a YbeY-like fold with a His59/His63/Glu98 metal site;
      Fe binds the protein and the motif is required for hydroxylation of beta-lysylated EF-P.
    supporting_text: Our findings showed that the metal ion-coordinating motif of YfcM plays an essential
      role in the hydroxylation of the β-lysylated lysine residue of EF-P.
  - statement: Hydroxylation does not affect beta-lysyl-EF-P activity in polyproline protein synthesis,
      though it stimulates reactivity with puromycin.
    supporting_text: This modification does not affect the activity of β-lysylated EF-P in the synthesis
      of proteins containing poly-prolines (3), although it stimulates the reactivity with puromycin
      (18).
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified (Kobayashi et al. 2014 Nucleic Acids Res); full text cached. Source
      of the metal ion binding IDA.
