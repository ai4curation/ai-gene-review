suggested_questions:
- question: Is the EpmC hydroxyl group placed at C5 or C4 of Lys34 in vivo, and is the reaction stereospecific?
- question: What is the role of NADPH in an enzyme whose active site resembles a non-heme iron 2-His-1-carboxylate
    site, and is there an unidentified small-molecule cofactor (the original assay needed a protein-free
    cell filtrate)?
- question: Should GO have a specific molecular function term for EF-P (beta-lysyl)lysine hydroxylase
    activity (RHEA:83439), analogous to deoxyhypusine monooxygenase activity for eIF5A?
suggested_experiments:
- hypothesis: The hydroxyl on Lys34 contributes to EF-P function only under specific conditions.
  description: Compare polyproline reporter output, growth and stress phenotypes of epmC deletion and
    epmA deletion strains under a panel of conditions, and quantify the +128 versus +144 Da EF-P forms
    by mass spectrometry.
- hypothesis: EpmC needs a defined reductant or cofactor in addition to NADPH.
  description: Fractionate the protein-free E. coli filtrate required for in vitro activity, identify
    the active small molecule, and reconstitute hydroxylation with defined components under controlled
    O2 and Fe(II).
