core_functions:
- description: >-
    NADPH-stimulated, O2-dependent hydroxylase that adds one oxygen atom to the side chain of the
    beta-lysylated Lys34 of EF-P, the final step of EF-P modification. The activity depends on an iron
    ion held by a 2-His-1-carboxylate site (His59, His63, Glu98). Fe binds YfcM directly, the chelator
    2,2'-bipyridine lowers hydroxylation, and the site mutants fall to background level, so that iron
    binding (GO:0005506, retained as an annotation) is cofactor binding integral to this activity
    rather than a second, independent core function.
