references:
- id: PMID:22706199
  title: Lys34 of translation elongation factor EF-P is hydroxylated by YfcM.
  findings:
  - statement: EpmC (YfcM) performs the final hydroxylation step of E. coli EF-P Lys34 modification,
      after beta-lysylation by YjeK (EpmB) and YjeA (EpmA).
    supporting_text: lacks a final hydroxylation step mediated by YfcM
  reference_review:
    relevance: HIGH
