gene_symbol: epmC
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: EpmC (formerly YfcM) is a small cytoplasmic hydroxylase that performs the last step of
  the post-translational modification of translation elongation factor P (EF-P). After EpmB makes (R)-beta-lysine
  and EpmA ligates it to Lys34 of EF-P, EpmC adds one oxygen atom to the side chain of the modified Lys34
  (reported at C5, with C4 also considered), turning the +128 Da beta-lysyl modification into the +144
  Da hydroxylated form. The reaction is stimulated by NADPH and inhibited by NADP+. EpmC has a fold related
  to that of the YbeY (UPF0054) ribonuclease and is unrelated to deoxyhypusine hydroxylase, which performs
  the analogous step on eukaryotic eIF5A. Its active site is a 2-His-1-carboxylate metal-binding motif
  (His59, His63, Glu98) that binds iron and is required for activity. Hydroxylation is a minor contribution
  to EF-P activity; the beta-lysyl modification itself is what EF-P needs to relieve ribosome stalling
  at polyproline stretches.
