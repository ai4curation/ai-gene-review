  - UniProtKB-SubCell:SL-0142
  review:
    summary: Motor association does not by itself establish E. coli YcgR residence in the basal body.
    action: MARK_AS_OVER_ANNOTATED
    reason: The electronic basal-body assignment is more specific than the E. coli evidence establishes.
      Motor-protein binding and inhibition establish an interaction with the apparatus, not stable incorporation
      or residence in its envelope-embedded basal-body substructure. PMID:20346719 includes fluorescent
      localization in Salmonella, which is not a direct localization assay of this E. coli protein. No
      replacement compartment is asserted without suitable localization evidence.
    supported_by:
