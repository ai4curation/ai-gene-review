id: P76010
gene_symbol: ycgR
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: YcgR is an Escherichia coli c-di-GMP receptor that controls the flagellar rotary motor. Its
  PilZ domain binds the second messenger, enabling contacts with motor proteins at the MotA–FliG interface
  and with switch-complex components. These interactions reduce motor output and alter rotational bias,
  connecting elevated c-di-GMP to reduced swimming and the motile-to-sessile transition.
