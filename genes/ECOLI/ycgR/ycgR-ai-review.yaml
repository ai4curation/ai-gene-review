    reason: Refine generic protein binding to molecular function inhibitor activity. The reported motor-protein
      contacts, integrated with the direct motor-braking experiments in PMID:20303158, establish inhibition
      by non-covalent binding without modification of the target. The MotA–FliG interface and switch-complex
      contacts implement this one inhibitory mechanism; they are not independent unspecified binding functions.
