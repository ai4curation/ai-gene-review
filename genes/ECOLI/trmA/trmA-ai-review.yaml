id: P23003
gene_symbol: trmA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: TrmA is an Escherichia coli K-12 RNA methyltransferase that uses SAM to form m5U54 in tRNA
  and m5U341 in the tRNA-like domain of tmRNA. It also promotes tRNA folding independently of methyl-group
  transfer through its RNA-binding domain. TrmA forms stable covalent complexes with undermodified tRNAs
  and with a 3-prime fragment of 16S rRNA; this latter association does not establish rRNA methylation
  or stable ribosomal membership. Cytosolic localization is supported by independently curated fractionation/proteomic
  experiments. The physiological consequences of catalysis and RNA-chaperone function depend on growth
  conditions and are not interchangeable with an absolute essentiality claim.
