taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: 'Glutathione synthetase (GshB) of Escherichia coli, a 316-residue cytosolic ATP-grasp enzyme
  of the prokaryotic GSH synthase family. It catalyses the ATP-dependent addition of glycine to gamma-L-glutamyl-L-cysteine,
  the second and final step of glutathione synthesis, after GshA has formed the dipeptide. The purified
  enzyme is a homotetramer of 38-kDa subunits that requires a divalent cation (Mg2+, Mn2+ or Co2+) and
  is inhibited by oxidized glutathione. gshB mutants contain almost no glutathione and accumulate gamma-glutamylcysteine
  but grow normally. Bacterial GshB is unrelated in sequence to eukaryotic glutathione synthetase (GSS/GSH2)
  and instead belongs to the RimK-like ATP-grasp glutamate-ligase family.'
