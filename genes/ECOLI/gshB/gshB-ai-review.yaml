suggested_questions:
- question: Why did bacteria recruit a RimK-like ATP-grasp ligase for glutathione synthesis, and 
    which active-site residues distinguish GshB glycine/gamma-Glu-Cys selectivity from RimK 
    glutamate/bS6 selectivity within PTHR21621?
suggested_experiments:
- hypothesis: A small set of active-site residues switches PTHR21621 ligases between glutathione 
    synthetase and RimK-type glutamylation.
  description: Swap candidate specificity residues between E. coli GshB and RimK, and assay each 
    variant for glutathione formation and bS6 glutamylation.
