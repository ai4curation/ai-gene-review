  label: Escherichia coli K-12
description: 'aroA (b0908) encodes 5-enolpyruvylshikimate-3-phosphate (EPSP) synthase, a monomeric, soluble
  cytosolic enzyme of 427 residues that catalyses the sixth step of the shikimate pathway: transfer of
  the enolpyruvyl group of phosphoenolpyruvate to the 5-hydroxyl of shikimate 3-phosphate, giving EPSP
  and inorganic phosphate. EPSP is converted by chorismate synthase to chorismate, the common precursor
  of phenylalanine, tyrosine, tryptophan, folate, ubiquinone, menaquinone and enterobactin. The protein
  has the two-domain inside-out alpha/beta enolpyruvyl transferase fold shared with MurA; it closes on
  binding shikimate 3-phosphate to form the active site in the interdomain cleft, and the reaction proceeds
  by addition-elimination through a tetrahedral intermediate, with Asp313 acting as the catalytic base.
  E. coli AroA is a class I EPSP synthase and the classic model for the action of the herbicide glyphosate,
  which binds in the PEP site; active-site substitutions such as G96A, P101S and T97I/P101S give glyphosate-insensitive
  enzymes used to engineer herbicide-tolerant crops.'
