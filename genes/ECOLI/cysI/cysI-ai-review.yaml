id: P17846
gene_symbol: cysI
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: CysI is the hemoprotein catalytic component of Escherichia coli assimilatory sulfite reductase.
  Its coupled siroheme and [4Fe-4S] center carries out the six-electron reduction of sulfite to sulfide,
  supplying reduced sulfur for cysteine biosynthesis. The NADPH-dependent reaction requires electrons
  delivered through the FAD/FMN component CysJ; CysI itself is not the NADPH-binding subunit. Its N-terminal
  region mediates assembly with CysJ.
