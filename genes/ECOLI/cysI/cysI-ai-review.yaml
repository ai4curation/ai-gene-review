  review:
    summary: NADP binding is assigned to the wrong subunit by the CysI domain mapping.
    action: REMOVE
    reason: The proximate electronic source is InterPro:IPR011786 (CysI). Direct E. coli structural/biochemical
      work assigns the NADPH-binding FNR module to CysJ, whereas CysI contains siroheme and [4Fe-4S] and
      receives electrons from CysJ. The complete NADPH-dependent enzyme reaction does not establish nucleotide
      binding by CysI. This is a subunit-role conflation, not a conclusion from a missing annotation.
    supported_by:
    - reference_id: PMID:6257697
      supporting_text: The beta-subunits each contain one siroheme and a tetranuclear iron-sulfur center
        (Fe4S4).
    - reference_id: PMID:10860732
      supporting_text: a variant of the classical pyridine dinucleotide binding fold which binds NADPH.
    - reference_id: PMID:10860732
      supporting_text: The FAD gets electrons from NADPH, and the FMN transfers the electrons to the metal
        centers of the beta-subunit for sulfite reduction.
    - reference_id: PMID:40140349
      supporting_text: a 43 kDa monomer that contains just the NADPH- and FAD-binding NADP+ ferredoxin
        reductase (FNR) domain
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - ROLE_CONFLATION
      source_entities:
      - source_id: InterPro:IPR011786
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: IPR011786 identifies the CysI hemoprotein family, not the CysJ NADPH-binding FNR module.
          The mapping conflates the nucleotide requirement of the holoenzyme with binding by this subunit.
    additional_reference_ids:
    - PMID:26088143
    - PMID:40140349
