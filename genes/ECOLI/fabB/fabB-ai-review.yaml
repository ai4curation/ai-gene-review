suggested_questions:
- question: >-
    What structural features let FabB, but not FabF, efficiently elongate
    cis-3-decenoyl-ACP before FabI can reduce trans-2-decenoyl-ACP?
suggested_experiments:
- description: >-
    Swap active-site and acyl-pocket residues between FabB and FabF and test which
    variants complement a fabB-null strain for unsaturated fatty acid synthesis and
    elongate cis-3-decenoyl-ACP in vitro.
