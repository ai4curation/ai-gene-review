- id: PMID:19679654
  title: 'Escherichia coli unsaturated fatty acid synthesis: complex transcription
    of the fabA gene and in vivo identification of the essential reaction catalyzed
    by FabB.'
  findings:
  - statement: The essential UFA reaction of FabB is elongation of FabA-derived cis-3-decenoyl-ACP.
    supporting_text: >-
      These data indicate that the key reaction in UFA synthesis catalyzed by FabB is
      elongation of the cis-3-decenoyl-ACP produced by FabA.
  - statement: fabB-null strains are unsaturated fatty acid auxotrophs.
    supporting_text: >-
      Strains lacking FabB are UFA auxotrophs indicating that the enzyme catalyzes an
      essential step in UFA synthesis.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: In vivo identification of the FabB UFA reaction (abstract only).
