id: P0A953
gene_symbol: fabB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  FabB is 3-oxoacyl-[acyl-carrier-protein] synthase I (beta-ketoacyl-ACP synthase
  I, KAS I) of the dissociated type II fatty acid synthase of Escherichia coli. It
  is a soluble cytosolic homodimer with the thiolase fold, and uses an active-site
  cysteine to accept an acyl group from acyl-ACP and condense it with malonyl-ACP,
  extending the chain by two carbons with release of CO2. FabB elongates saturated
  and cis-unsaturated acyl-ACPs of about C6 to C14 and has an absolute requirement
  for ACP as the acyl donor carrier. Its unique, essential role is to elongate the
  cis-3-decenoyl-ACP produced by the FabA isomerase, which commits that
  intermediate to the cis-unsaturated fatty acids palmitoleate and cis-vaccenate;
  fabB mutants are therefore auxotrophic for unsaturated fatty acids. fabB
  expression is activated by FadR and repressed by FabR, and FabB is the target of
  the antibiotic thiolactomycin in E. coli.
