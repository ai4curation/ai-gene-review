core_functions:
- description: >-
    3-oxoacyl-ACP synthase I (KAS I) of type II fatty acid elongation: condenses
    saturated and cis-unsaturated acyl-ACPs (about C6-C14) with malonyl-ACP via an
    active-site cysteine, and uniquely elongates the FabA product cis-3-decenoyl-ACP,
    the committed step toward palmitoleate and cis-vaccenate.
