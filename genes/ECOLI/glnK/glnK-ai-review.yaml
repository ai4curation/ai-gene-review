core_functions:
- description: Inhibits the AmtB ammonia channel by inserting its T-loop into the cytoplasmic pore exit
    when deuridylylated, controlling ammonium influx according to nitrogen status.
  molecular_function: *id001
  directly_involved_in:
  - *id005
  locations:
  - *id003
  supported_by:
  - reference_id: PMID:17190799
    supporting_text: The complex formed between AmtB and inhibitory GlnK at 1.96-A resolution shows that
      the trimeric channel is blocked directly by GlnK
  - reference_id: PMID:17220269
    supporting_text: GlnK interacts with AmtB almost exclusively via a long surface loop containing Y51
      (T-loop), the tip of which inserts deeply into the cytoplasmic pore exit, blocking ammonia conduction.
  - reference_id: PMID:14668330
    supporting_text: We have now shown that Escherichia coli AmtB is inactivated by formation of a membrane-bound
      complex with GlnK.
  - reference_id: PMID:11847102
    supporting_text: AmtB activity increases in the absence of GlnK, indicating that GlnK acts as a negative
      regulator of the transporter.
- description: Senses energy and carbon status by binding ATP/ADP and 2-oxoglutarate, which modulate its
    association with AmtB.
  molecular_function:
    id: GO:0005524
    label: ATP binding
  locations:
  - *id002
  supported_by:
  - reference_id: PMID:16864585
    supporting_text: The interaction of GlnK with AmtB is dependent on ATP and is also sensitive to 2-oxoglutarate.
  - reference_id: PMID:17190799
    supporting_text: The hydrolyzed product, adenosine 5'-diphosphate orients the surface of GlnK for
      AmtB blockade.
- description: Activates GlnE-catalysed adenylylation of glutamine synthetase, partly redundantly with
    GlnB.
  molecular_function: *id004
  directly_involved_in:
  - *id005
  locations:
  - *id002
  supported_by:
  - reference_id: PMID:8843440
    supporting_text: Like PII, purified GlnK can activate the adenylylation of glutamine synthetase in
      vitro, and, in vivo, the GlnK protein is uridylylated in a glnD-dependent fashion.
suggested_questions:
- question: Does GlnK regulate the NtrB phosphatase directly in vivo during prolonged nitrogen starvation,
    or does its limiting effect on Ntr gene expression operate mainly through heterotrimers with GlnB?
- question: What is the relative importance of GlnK uridylylation versus 2-oxoglutarate and ATP/ADP binding
    in controlling AmtB-GlnK complex formation in vivo?
suggested_experiments:
- description: Reconstitute purified NtrB/NtrC with homotrimeric GlnK, GlnK-UMP and GlnB/GlnK heterotrimers
    to measure NtrB phosphatase stimulation and kinase inhibition across 2-oxoglutarate concentrations.
- description: Measure AmtB conductance in proteoliposomes with GlnK bound to ATP versus ADP and titrated
    2-oxoglutarate to define the effector dependence of channel blockade.
