id: P0AC55
gene_symbol: glnK
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: 'GlnK is a homotrimeric PII-family signal transduction protein of E. coli, paralogous to
  GlnB and encoded in the nitrogen-regulated glnK-amtB operon, so it is expressed mainly under nitrogen
  limitation. Like GlnB it binds ATP, ADP and 2-oxoglutarate and is reversibly uridylylated on T-loop
  Tyr51 by GlnD. Its principal role is control of the AmtB ammonia channel: when extracellular ammonium
  rises, GlnK is deuridylylated and binds the cytoplasmic face of AmtB, inserting its T-loop into the
  pore exit to block ammonia conduction and sequestering GlnK at the inner membrane. GlnK can also activate
  GlnE-catalysed adenylylation of glutamine synthetase, forms heterotrimers with GlnB, and limits Ntr
  gene expression during nitrogen starvation, which is important for recovery from starvation.'
