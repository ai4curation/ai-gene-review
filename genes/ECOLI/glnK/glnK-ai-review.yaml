- term:
    id: GO:0005886
    label: plasma membrane
  evidence_type: EXP
  original_reference_id: PMID:11847102
  qualifier: located_in
  review:
    summary: GlnK is not an integral membrane protein; it is sequestered to the inner (plasma) membrane
      by binding the cytoplasmic face of AmtB, reversibly and in response to ammonium.
    action: MODIFY
    reason: Correct but general. GlnK is peripherally bound on the cytoplasmic face of AmtB, so the precise
      location is cytoplasmic side of plasma membrane (GO:0009898), a part_of descendant of plasma membrane.
    proposed_replacement_terms:
    - &id003
      id: GO:0009898
      label: cytoplasmic side of plasma membrane
    supported_by:
    - reference_id: PMID:11847102
      supporting_text: When the cellular nitrogen status changes, e.g. as a consequence of a sudden rise
        in the availability of extracellular ammonium, GlnK is deuridylylated rapidly and the unmodified
        form of the protein then associates tightly with AmtB in the inner membrane.
    - reference_id: PMID:17220269
      supporting_text: GlnK interacts with AmtB almost exclusively via a long surface loop containing
        Y51 (T-loop), the tip of which inserts deeply into the cytoplasmic pore exit, blocking ammonia
        conduction.
