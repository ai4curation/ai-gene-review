    action: MODIFY
    reason: 'GlnK is clearly involved in regulating nitrogen utilization, but the reported effect is not
      simply positive: GlnK is required to limit (negatively regulate) Ntr gene expression during starvation
      while enabling recovery of growth. The parent term regulation of nitrogen utilization (GO:0006808),
      already annotated, describes the finding without imposing a sign.'
    proposed_replacement_terms:
    - &id005
      id: GO:0006808
      label: regulation of nitrogen utilization
    supported_by:
    - reference_id: PMID:12366843
      supporting_text: Thus, one specific role of GlnK is to regulate the expression of Ntr genes during
        nitrogen starvation.
    - reference_id: PMID:12366843
      supporting_text: GlnK was unable to limit glnALG expression in cells adapted to growth on ammonia,
        but was required to limit expression of the glnK and nac promoters during nitrogen starvation.
- term:
    id: GO:0043531
    label: ADP binding
  evidence_type: IDA
  original_reference_id: PMID:17190799
  review:
    summary: ADP is bound in the GlnK effector sites in the AmtB-GlnK complex structures and orients the
      GlnK surface for AmtB blockade.
    action: NEW
    reason: ADP binding is structurally demonstrated (PDB 2NS1, 2NUU) and functionally relevant (ADP-bound
      GlnK blocks AmtB); the ATP/ADP ratio is part of the energy signal sensed by PII proteins. Not currently
      annotated.
    supported_by:
    - reference_id: PMID:17190799
      supporting_text: The hydrolyzed product, adenosine 5'-diphosphate orients the surface of GlnK for
        AmtB blockade.
