  review:
    summary: 'GlnK regulates nitrogen assimilation: it controls AmtB-mediated ammonium uptake, contributes
      to GlnE-dependent glutamine synthetase regulation, and limits Ntr gene expression during nitrogen
      starvation.'
    action: ACCEPT
    reason: Regulation of nitrogen utilization is the core process of GlnK, supported experimentally in
      E. coli.
