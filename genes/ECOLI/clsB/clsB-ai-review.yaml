id: P0AA84
gene_symbol: clsB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: ClsB is a minor, peripheral-membrane cardiolipin synthase of Escherichia coli in the phospholipase
  D superfamily. It has two HKD motifs and, unlike ClsA, no N-terminal transmembrane anchor. In vitro
  it transfers a phosphatidyl group from one phosphatidylglycerol to another to form cardiolipin and glycerol,
  and it can also transfer the phosphatidyl group to water, forming phosphatidate. In vivo, ClsB contributes
  cardiolipin only in stationary phase. It can also make phosphatidylglycerol from phosphatidylethanolamine
  and glycerol, a PgsA-independent route that is revealed when glycerol is supplied. Activity is stimulated
  by phosphate and inhibited by cardiolipin and phosphatidate.
