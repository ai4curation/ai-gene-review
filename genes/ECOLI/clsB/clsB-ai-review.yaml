- term:
    id: GO:0004630
    label: D-type glycerophospholipase activity
  evidence_type: IDA
  original_reference_id: PMID:10634942
  qualifier: enables
  review:
    summary: ClsB can transfer the phosphatidyl group to water (phospholipase D-type hydrolysis), forming
      phosphatidate.
    action: KEEP_AS_NON_CORE
    reason: GO:0004630 is defined as "A glycerophospholipase activity that cleaves the second phosphodiester
      bond between the phosphate and phospholipid, releasing a phosphatidic acid." UniProt records, from
      this paper, that ClsB can transfer the phosphatidyl group to water to form phosphatidate. Hydrolysis
      is the water-acceptor variant of the same PLD-superfamily phosphatidyl-transfer chemistry, so it
      is a genuine secondary activity of the enzyme. The cardiolipin and phosphatidylglycerol synthase
      reactions remain the primary functions.
    supported_by:
