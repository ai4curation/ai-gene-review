suggested_questions:
- question: Under which natural conditions does the ClsB-catalysed conversion of phosphatidylethanolamine
    and glycerol to phosphatidylglycerol contribute to the phosphatidylglycerol pool, and is there a GO
    term for this phosphatidyl transfer?
suggested_experiments:
- description: Quantify ClsB-dependent phosphatidylglycerol and cardiolipin synthesis in clsA clsC pgsA-depleted
    backgrounds across growth phase and glycerol supply, using stable-isotope glycerol and lipidomics.
