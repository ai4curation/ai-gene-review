id: P0A809
gene_symbol: ruvA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: RuvA is the Holliday-junction recognition subunit of the Escherichia coli RuvAB branch-migration
  complex. A RuvA homotetramer binds the four-way junction through helix-hairpin-helix motifs, holds it
  in an open, square-planar conformation and targets two oppositely oriented RuvB hexameric ATPase rings
  to the junction. RuvA has no ATPase activity; it gives the RuvAB helicase its junction specificity,
  while RuvB supplies the motor. RuvA also forms RuvABC-junction complexes with the RuvC resolvase, which
  cleaves the migrated junction. The ruvAB operon is LexA-repressed and induced as part of the SOS response,
  and RuvAB acts in recombinational repair and in processing of reversed replication forks.
