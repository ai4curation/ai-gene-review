id: P07639
gene_symbol: aroB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  AroB is the 3-dehydroquinate synthase (DHQS, EC 4.2.3.4) of Escherichia coli, a member of
  the sugar phosphate cyclase superfamily. It catalyses the second step of the shikimate
  (chorismate) pathway, converting 3-deoxy-D-arabino-heptulosonate 7-phosphate (DAHP) to
  3-dehydroquinate and inorganic phosphate. The reaction is a multistep sequence carried out
  in one active site: transient NAD+-dependent oxidation at C-5, elimination of phosphate,
  reduction back by the bound NADH, ring opening and an intramolecular aldol cyclisation.
  The enzyme is a soluble cytoplasmic monomer of about 39 kDa that binds one tightly held
  NAD+ (Km 80 nM) and one divalent metal ion; the purified enzyme carries Co(2+), while
  Zn(2+), which also restores activity, is probably the physiological metal. Its product
  feeds the pathway to chorismate, the common precursor of the aromatic amino acids,
  folate, ubiquinone, menaquinone and enterobactin.
