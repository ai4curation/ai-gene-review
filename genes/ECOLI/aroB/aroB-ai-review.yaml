- term:
    id: GO:0070403
    label: NAD+ binding
  evidence_type: IDA
  original_reference_id: PMID:2514789
  qualifier: enables
  review:
    summary: The purified enzyme binds 1 mol NAD+ per mol, with a dissociation rate of 0.024
      min-1 and a Km for NAD+ of 80 nM; NAD+ is essential for activity.
    action: ACCEPT
    reason: NAD+ is a tightly bound catalytic cofactor that is transiently reduced and
      reoxidised during each turnover, so NAD+ binding is an integral part of the DHQS
      activity, directly measured on the E. coli enzyme.
    supported_by:
    - reference_id: PMID:2514789
      supporting_text: Dehydroquinate synthase also binds 1 mol of NAD+, the presence of
        which is essential for catalytic activity.
