suggested_questions:
- question: Which divalent metal occupies the E. coli DHQS active site in vivo, given that the
    enzyme as purified carries Co(II) but Zn(II) is proposed to be the physiological metal?
suggested_experiments:
- description: Determine the metal content of AroB purified from cells grown in defined
    trace-metal media (ICP-MS), and compare activity of Zn- and Co-loaded enzyme, to settle
    the physiological metal cofactor.
