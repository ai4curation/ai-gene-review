- term:
    id: GO:0008270
    label: zinc ion binding
  evidence_type: IDA
  original_reference_id: PMID:2514789
  qualifier: enables
  review:
    summary: The metal-depleted apoenzyme is reactivated by Zn(II) (53% of the Co(II) level),
      and Zn(II) is proposed to be the in vivo metal; one divalent metal binds per subunit.
    action: ACCEPT
    reason: The bound divalent metal is required for catalysis (EDTA inactivates, metal
      reconstitution restores activity), and reconstitution with Zn(II) shows the enzyme
      binds zinc functionally. The enzyme as isolated carries Co(II), so the physiological
      metal is not settled, but zinc binding itself is directly shown and is part of the
      catalytic machinery.
    supported_by:
    - reference_id: PMID:2514789
      supporting_text: Reconstitution of the apoenzyme with Zn(II) (which is probably the
        functioning metal in vivo) restores activity to 53% of the level observed with the
        Co(II)-holoenzyme.
