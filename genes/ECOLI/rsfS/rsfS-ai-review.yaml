suggested_questions:
- question: Is RsfS primarily a hibernation (translation-silencing) factor acting on mature
    50S subunits in stationary phase, or a late 50S biogenesis/quality-control factor acting
    on pre-50S particles, and should it carry GO:0141014 cytosolic ribosome hibernation (currently
    not used for any E. coli hibernation factor)?
- question: Does RsfS stimulation of ObgE GTPase activity justify a GTPase activator activity
    MF annotation, and is it required for ObgE function on pre-50S?
- question: Given that the HAMAP/UniRule MF_01477 maps to GO:0042256 cytosolic ribosome assembly
    while RsfS antagonises subunit joining, should the rule mapping be changed to ribosomal
    large subunit assembly?
suggested_experiments:
- description: Quantify RsfS occupancy on pre-50S versus mature 50S across growth phases (exponential,
    stationary, rich-to-poor shift) by cryo-EM or crosslinking-MS, and test whether uL14-binding
    mutants (D81A, W77A) separate silencing from biogenesis roles.
  experiment_type: structural and genetic analysis
- description: Measure ObgE GTPase activity on pre-50S particles with and without RsfS (and
    uL14-interface mutants) to establish whether RsfS is a bona fide GTPase activator.
  experiment_type: biochemical assay
