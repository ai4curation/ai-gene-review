id: P0AAT6
gene_symbol: rsfS
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: RsfS (YbeB, RsfA; Iojap/RsfS family) is a small, conserved cytosolic protein
  of Escherichia coli that binds the large (50S) ribosomal subunit by docking onto ribosomal
  protein uL14 at the subunit interface, where it blocks formation of intersubunit bridge
  B8 and sterically prevents joining of the 30S subunit. Added to 50S subunits it inhibits
  70S formation and translation in vitro without affecting already-formed elongating ribosomes,
  and in vivo it represses protein synthesis in stationary phase and after a shift from rich
  to poor medium; deletion mutants lose viability in stationary phase and show a long lag
  after nutrient downshift. RsfS also binds late-stage pre-50S particles as part of a biogenesis-factor
  network with the GTPase ObgE, the pseudouridine synthase RluD and DarP (YjgA), contacting
  ObgE and stimulating its GTPase activity, and accumulates on pre-50S and 50S subunits when
  30S maturation is delayed, keeping immature or unpartnered large subunits out of translation.
  Orthologs include human mitochondrial MALSU1 and plant chloroplast Iojap, which perform
  equivalent functions on organellar ribosomes.
