  - *id018
suggested_questions:
- question: Which kinase phosphorylates KdpB Ser162, under what conditions, and is it dephosphorylated
    when K+ limitation returns?
- question: Should GO represent KdpB as enabling GO:0008556 or as contributing to it, given that KdpA
    supplies the selectivity filter but KdpB supplies both energy coupling and the cytoplasmic release
    site?
suggested_experiments:
- description: Identify the Ser162 kinase by screening kinase deletion strains for loss of KdpB phosphorylation
    after return to high K+, and test S162A/S162D effects on growth during K+ upshift.
  experiment_type: genetic screen with phosphoproteomics
