- term:
    id: GO:0008556
    label: P-type potassium transmembrane transporter activity
  evidence_type: EXP
  original_reference_id: PMID:2849541
  qualifier: enables
  review:
    summary: P-type potassium transmembrane transporter activity (ATP + H2O + K+(out) = ADP + phosphate
      + K+(in)) is the activity of the KdpFABC complex, in which KdpB is the catalytic, phosphorylated
      energy-coupling subunit.
    action: ACCEPT
    reason: The purified KdpABC complex showed K+-dependent, vanadate-sensitive ATPase activity, and anti-KdpB
      serum inhibited it. KdpB hydrolyses ATP via an aspartyl-phosphate (Asp307) intermediate, and recent
      structures place the cytoplasmic K+ release site in KdpB, so KdpB does part of the transport work
      and not only the energisation. The activity is a complex activity (KdpA supplies the selectivity
      filter), so core_functions records KdpB as enabling ATP hydrolysis and contributing to GO:0008556;
      the GOA 'enables' row is accepted because the term is the correct functional characterisation of
      the pump that KdpB catalyses.
    supported_by:
    - reference_id: PMID:2849541
      supporting_text: The Kdp system from Escherichia coli is a derepressible high-affinity K+-uptake
        ATPase.
    - *id007
