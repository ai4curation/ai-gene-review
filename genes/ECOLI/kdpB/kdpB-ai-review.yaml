      inner membrane proteins
- id: PMID:17994765
  title: The conserved dipole in transmembrane helix 5 of KdpB in the Escherichia coli KdpFABC P-type
    ATPase is crucial for coupling and the electrogenic K+-translocation step.
  findings:
  - statement: The D583/K586 dipole in TM5 of KdpB is required for coupling ATP hydrolysis to K+ transport.
    supporting_text: led to an uncoupling of ATP hydrolysis and K+ transport
- id: PMID:21711450
  title: The KdpC subunit of the Escherichia coli K+-transporting KdpB P-type ATPase acts as a catalytic
    chaperone.
  findings:
  - statement: KdpB is the ATP-hydrolysing subunit that defines KdpFABC as a type IA P-type ATPase.
    supporting_text: On the basis of the biochemical properties of the ATP-hydrolyzing subunit KdpB, the
      transport complex is classified as type IA P-type ATPase.
  - statement: KdpC interacts with the KdpB nucleotide-binding loop in an ATP-dependent manner.
    supporting_text: the KdpC subunit was shown to interact with the nucleotide-binding loop of KdpB in
      an ATP-dependent manner around the ATP-binding pocket
- id: PMID:2849541
  title: The K+-translocating Kdp-ATPase from Escherichia coli. Purification, enzymatic properties and
    production of complex- and subunit-specific antisera.
  findings:
  - statement: Purified Kdp-ATPase is a high-affinity K+-uptake ATPase using Mg-ATP.
    supporting_text: The Kdp system from Escherichia coli is a derepressible high-affinity K+-uptake ATPase.
  - statement: Anti-KdpB antibodies inhibit membrane-bound and purified ATPase activity.
    supporting_text: the anti-KdpABC and anti-KdpB sera impaired ATPase activity in the membrane-bound
      as well as in the purified state of the enzyme
- id: PMID:28636601
  title: Crystal structure of the potassium-importing KdpFABC membrane complex.
  findings:
  - statement: ATP energy is harnessed by KdpB while K+ moves through KdpA.
    supporting_text: the energy of ATP is harnessed by KdpB
  - statement: K+ in KdpA should trigger Asp307 phosphorylation of KdpB.
    supporting_text: the presence or absence of K+ in KdpA should initiate autophosphorylation of Asp307
      in KdpB
  - statement: Ser162 phosphorylation of KdpB inversely correlates with, and inhibits, ATPase activity.
    supporting_text: the inverse correlation between the relative levels of Ser162 phosphorylation and
      ATPase activity supports the inhibitory nature of this modification
- id: PMID:30478378
  title: Cryo-EM structures of KdpFABC suggest a K(+) transport mechanism via two inter-subunit half-channels.
  findings:
  - statement: ATP hydrolysis is carried out by KdpB.
    supporting_text: While ATP hydrolysis is accomplished by the P-type ATPase subunit KdpB
  - statement: K+ translocation runs via two inter-subunit half-channels, integrating KdpB in transport.
    supporting_text: integrating KdpB directly in the transport process
  - statement: Ser162 is phosphorylated in both E1 and E2 cryo-EM states.
    supporting_text: Ser162 (TGES; A domain of KdpB) appears to be phosphorylated in both states
- id: PMID:34272288
  title: Structural basis for potassium transport in prokaryotes by KdpFABC.
  findings:
  - statement: KdpB harnesses ATP energy to drive uphill K+ transport.
    supporting_text: KdpB, on the other hand, harnesses the energy of ATP to drive transport of K + against
      a concentration gradient
  - statement: ATP hydrolysis is coupled to K+ transfer between KdpB sites and release to the cytoplasm.
    supporting_text: Our structures suggest a mechanism where ATP hydrolysis is coupled to K+ transfer
      between alternative sites in KdpB, ultimately reaching a low-affinity site where a water-filled
      pathway allows release of K+ to the cytoplasm.
- id: PMID:356049
  title: Identification of the structural proteins of an ATP-driven potassium transport system in Escherichia
    coli.
  findings:
  - statement: KdpA, KdpB and KdpC are inner membrane proteins.
    supporting_text: have been identified and found to be located in the inner membrane
- id: PMID:6146979
  title: Sequence homology between two membrane transport ATPases, the Kdp-ATPase of Escherichia coli
    and the Ca2+-ATPase of sarcoplasmic reticulum.
  findings:
  - statement: KdpB, the phosphorylated subunit, is homologous to SERCA Ca2+-ATPase.
    supporting_text: Regions of the predicted amino acid sequence of KdpB, the phosphorylated protein
      of the system, are homologous to regions of the Ca2+-ATPase of rabbit sarcoplasmic reticulum.
- id: PMID:7896809
  title: Genetic evidence for two sequentially occupied K+ binding sites in the Kdp transport ATPase.
  findings:
  - statement: Energy coupling is mediated by KdpB, a different subunit from the transporting KdpA.
    supporting_text: Energy coupling in Kdp, mediated by the KdpB subunit, is performed by a different
      subunit from the one that mediates transport.
- id: PMID:8499455
  title: ATP-driven potassium transport in right-side-out membrane vesicles via the Kdp system of Escherichia
    coli.
  findings:
  - statement: ATP drives K+ uptake into right-side-out vesicles via the Kdp-ATPase.
    supporting_text: This ATP level was sufficient to drive uptake of potassium ions via the Kdp-ATPase.
- id: PMID:9789555
  title: Structure and function of the Kdp-ATPase of Escherichia coli.
  findings:
  - statement: The purified Kdp-ATPase transports K+ electrogenically.
    supporting_text: These data clearly indicate that the Kdp-ATPase transports K+ in an electrogenic
      manner.
