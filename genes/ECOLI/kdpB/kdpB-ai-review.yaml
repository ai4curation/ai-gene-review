core_functions:
- description: 'Catalytic P-type ATPase subunit of KdpFABC: binds Mg-ATP, forms the Asp307 phosphoenzyme
    and hydrolyses ATP, coupling this to uphill K+ uptake through KdpA and K+ release from KdpB to the
    cytoplasm (contributing to the complex''s P-type potassium transporter activity).'
  molecular_function:
    id: GO:0016887
    label: ATP hydrolysis activity
  contributes_to_molecular_function:
    id: GO:0008556
    label: P-type potassium transmembrane transporter activity
