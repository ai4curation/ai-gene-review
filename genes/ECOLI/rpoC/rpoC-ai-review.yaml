  qualifier: involved_in
  review:
    summary: >-
      Regulation of initiation attributed to the beta-prime subunit from sigma-holoenzyme
      studies.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The cited studies show promoter selection by alternative sigma factors bound
      to core RNAP. The regulatory work is done by sigma (and by activators acting
