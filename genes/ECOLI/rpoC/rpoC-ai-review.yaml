suggested_questions:
- question: >-
    Should complex-level ComplexPortal process annotations for E. coli RNA polymerase
    (regulon-level physiology such as iron homeostasis, motility or biofilm formation)
    continue to be propagated to each core subunit, given that the specificity lies
    with sigma factors and regulators?
