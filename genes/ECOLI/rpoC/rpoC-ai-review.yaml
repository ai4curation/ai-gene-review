- term:
    id: GO:0006352
    label: DNA-templated transcription initiation
  evidence_type: IDA
  original_reference_id: PMID:2644646
  qualifier: involved_in
  review:
    summary: >-
      Holoenzymes containing the beta-prime subunit initiate promoter-specific transcription.
    action: ACCEPT
    reason: >-
      The beta-prime subunit forms the DNA-binding cleft that holds the melted promoter
      in the open complex and synthesises the first phosphodiester bonds. Experimental
      holoenzyme work in E. coli supports the annotation.
    supported_by:
    - reference_id: file:ECOLI/rpoC/rpoC-uniprot.txt
      supporting_text: >-
        When a sigma factor is associated with the core the holoenzyme is formed,
        which can initiate transcription.
      record_section:
      - CC:SUBUNIT
    - reference_id: PMID:2644646
      supporting_text: >-
        This peptide behaves as a secondary sigma factor--designated sigma F--because
        it restores specific tar transcription activity when added to core RNA polymerase.
