id: P0A8T7
gene_symbol: rpoC
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  rpoC (b3988) encodes the beta-prime subunit, the largest subunit of Escherichia
  coli DNA-directed RNA polymerase. Beta-prime forms the active-centre cleft with
  beta and carries the catalytic Mg(2+) site, two structural Zn(2+) sites, the clamp,
  the bridge helix and the trigger loop. It therefore takes part directly in nucleotide
  addition, pausing and translocation by the alpha2 beta beta' omega core enzyme.
