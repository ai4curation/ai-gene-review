  review:
    summary: >-
      Glutamine synthetase activity is transferred from the GS-fold InterPro signatures; PuuA is a GS
      homolog whose characterized amine substrate is putrescine.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      PuuA shares the GS N-terminal and catalytic domains and the dodecameric architecture, so the InterPro2GO
      mapping is a fold-level call. The characterized and physiological reaction is glutamate-putrescine
      ligation, and E. coli has a dedicated glutamine synthetase (GlnA, in the separate PTHR43407 family).
      No cached assay tests ammonium, so the activity is not refuted, but it is not the evolved function.
    supported_by:
    - reference_id: PMID:18495664
      supporting_text: The amino acid sequences of PuuA and glutamine synthetase (GS) show high similarity.
