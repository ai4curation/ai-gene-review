      Putrescine accumulates in puuA, puuB and puuC mutants, and the GP and transaminase pathways are
      partly redundant for nitrogen.
    supporting_text: putrescine accumulates in puuA, puuB, and puuC mutants but not in any other mutant
  reference_review:
