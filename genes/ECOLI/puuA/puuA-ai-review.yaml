- id: PMID:18495664
  title: gamma-Glutamylputrescine synthetase in the putrescine utilization pathway of Escherichia coli
    K-12.
  findings:
  - statement: >-
      Purified PuuA catalyses ATP-dependent gamma-glutamylation of putrescine with Km values of 2.07 mM
      (glutamate), 2.35 mM (ATP) and 44.6 mM (putrescine).
    supporting_text: Purified non-tagged PuuA catalyzed the ATP-dependent gamma-glutamylation of putrescine.
  - statement: >-
      puuA deletion shows the Puu pathway is the more critical of the two E. coli putrescine utilization
      routes.
    supporting_text: >-
      Gene deletion experiments of puuA, however, indicated that the Puu pathway was more critical in
      utilizing putrescine as a sole carbon or nitrogen source.
  - statement: PuuA is a glutamine synthetase homolog that forms a dodecamer.
    supporting_text: PuuA exists as a dodecamer as does GS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
