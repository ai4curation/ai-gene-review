  label: Escherichia coli K-12
description: >-
  PuuA is the gamma-glutamylputrescine synthetase (glutamate-putrescine ligase, EC 6.3.1.11) of Escherichia
  coli K-12. It catalyses the ATP- and Mg2+-dependent ligation of L-glutamate to putrescine to form gamma-L-glutamylputrescine,
  the committed first enzymatic step of the Puu pathway, which converts putrescine through gamma-glutamylated
  intermediates to 4-aminobutanoate (GABA) and then succinate. PuuA is a cytoplasmic dodecamer of the
  glutamine synthetase fold that is induced by putrescine and repressed by PuuR. Loss of puuA impairs
  growth on putrescine as sole carbon or nitrogen source and causes putrescine to accumulate, so the enzyme
  also limits intracellular putrescine. A parallel transaminase-initiated route (PatA/PatD) can partly
  substitute under nitrogen limitation.
