id: P0ABG4
gene_symbol: ftsW
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli (strain K12)
description: >-
  FtsW is an essential SEDS-family multipass inner-membrane peptidoglycan
  glycosyltransferase that acts at the division septum. Together with its
  cognate class-B penicillin-binding protein FtsI/PBP3, FtsW forms the septal
  SEDS-bPBP synthase module of the E. coli divisome and supplies the glycan
  polymerase activity for new peptidoglycan made during FtsZ-dependent
  cytokinesis. FtsW localizes late to the cell division site, helps recruit
  FtsI, and functions in septal peptidoglycan synthesis rather than in the
  D,D-transpeptidase reaction catalyzed by FtsI.
