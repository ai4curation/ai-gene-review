core_functions:
  - description: >-
      FtsW is the septal SEDS peptidoglycan glycosyltransferase. In the inner
      membrane at the FtsZ-dependent division site, it polymerizes lipid
      II-derived glycan strands as the glycan-polymerase half of the FtsW/FtsI
      divisome synthase pair; FtsI/PBP3 supplies the cognate D,D-transpeptidase
      activity. The polymerase assignment is supported by purified FtsW-family
      orthologs and by the conserved E. coli FtsW/FtsI septal synthase context.
    molecular_function:
      id: GO:0008955
      label: peptidoglycan glycosyltransferase activity
    directly_involved_in:
      - id: GO:0000917
        label: division septum assembly
      - id: GO:0009252
        label: peptidoglycan biosynthetic process
      - id: GO:0043093
        label: FtsZ-dependent cytokinesis
    locations:
      - id: GO:0005886
        label: plasma membrane
      - id: GO:0032153
        label: cell division site
    in_complex:
      id: GO:1990586
      label: divisome complex
    supported_by:
      - reference_id: PMID:30692671
        supporting_text: "We conclude that FtsW is a peptidoglycan polymerase that requires divalent cations and the presence of a bPBP for activity."
      - reference_id: file:ECOLI/ftsW/ftsW-notes.md
        supporting_text: "FtsW is the SEDS-family membrane polymerase paired with FtsI/PBP3 for septal peptidoglycan synthesis; it should be curated for glycan polymerization, division-site localization, divisome function, and peptidoglycan biosynthesis, not for D,D-transpeptidase activity."
