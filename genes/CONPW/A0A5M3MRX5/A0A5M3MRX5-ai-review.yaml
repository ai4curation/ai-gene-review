suggested_questions:
- question: Which C. puteana MDH isozyme supplies the oxaloacetate that is hydrolysed to oxalate? Is it
    this mitochondrial enzyme, the PTS1-bearing paralog A0A5M3MC96, or an unidentified cytosolic MDH?
    And is oxaloacetate hydrolase cytosolic in brown-rot basidiomycetes, as it is in Aspergillus niger?
suggested_experiments:
- description: Fractionate oxalate-producing C. puteana mycelium, with mitochondrial, peroxisomal and
    cytosolic markers, and assign MDH activity and the A0A5M3MRX5 and A0A5M3MC96 proteins (by proteomics
    or tagged expression) to compartments. Confirm presequence cleavage by N-terminal sequencing of the
    mature protein.
