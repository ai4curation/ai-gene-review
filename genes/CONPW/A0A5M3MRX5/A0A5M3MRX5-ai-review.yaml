  title: A physiological role for oxalic acid biosynthesis in the wood-rotting basidiomycete Fomitopsis
    palustris.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text read. In another brown-rot fungus, MDH has the highest activity of 12 enzymes
      in whole-cell extracts; isozymes are not separated. The authors' model places oxalate-precursor
      oxaloacetate formation outside mitochondria, from exported malate. Context only for a mitochondrial
      MDH.
  findings:
  - statement: MDH activity is very high in oxalate-producing F. palustris extracts.
    supporting_text: 'the greatest activity was found for MDH: 5,840 nmol'
  - statement: Malate, not oxaloacetate, is proposed to leave mitochondria and be oxidized to oxaloacetate
      for oxalate synthesis.
    supporting_text: oxaloacetate cannot be shuttled through the membrane system of mitochondria and
      glyoxysomes, and not oxaloacetate but malate may flow out from Cycle A or B to be oxidized to form
      oxaloacetate
