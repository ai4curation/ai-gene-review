  review:
    summary: Proposed mitochondrial matrix location, beside the accepted mitochondrion rows.
    action: NEW
    reason: 'The root-organelle policy asks for at least two independent lines before adding a sub-compartment,
      and two are present. (1) Sequence: a presequence-like, Arg-rich N-terminal extension with no acidic
      residues and no transmembrane segment; the yeast ortholog''s equivalent extension is a cleaved matrix-targeting
      presequence. (2) Function: the NAD-MDH step of the TCA cycle runs in the matrix, where the NAD+/NADH
      pool and the other cycle enzymes are; a protein of the mitochondrial-MDH clade (PAINT PTN000899458:
      mitochondrion and TCA cycle) has no plausible role on another side of the inner membrane. The row
      is an inference (IC) with no direct assay.'
