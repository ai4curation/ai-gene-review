- term:
    id: GO:0005739
    label: mitochondrion
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: located_in
  supporting_entities:
  - PANTHER:PTN000899503
  review:
    summary: Mitochondrion from TreeGrafter, inherited from the PAINT node PTN000899458, which also carries
      the TCA cycle.
    action: ACCEPT
    reason: Following the root-organelle policy, I checked the basis of this synthesis row. PAINT asserts
      mitochondrion at PTN000899458, the mitochondrial-MDH clade from which the target's TreeGrafter node
      PTN000899503 descends. Three independent sequence lines agree with that placement. (1) The target
      has a 32-residue segment before the conserved GxGGxG motif; it carries 5 Arg/Lys, no Asp/Glu and
      10 Ser/Thr, the composition of a matrix-targeting presequence. Yeast Mdh1p, the experimentally
      mitochondrial ortholog (identity 0.63), has an equivalent 17-residue presequence. (2) The protein
      lacks a PTS1, whereas the C. puteana paralog A0A5M3MC96 ends in SKL. (3) CDD places it in cd01337
      (MDH_glyoxysomal_mitochondrial) and PANTHER in the mitochondrial subfamily SF73. No experimental
      localization exists for a C. puteana MDH, so the claim is inferential, but it holds.
    supported_by:
    - &paintmito
      reference_id: file:interpro/panther/PTHR11540/PTHR11540-paint.tsv
      supporting_text: "PTHR11540\tPTN000899458\tGO:0005739\tC\tIBD\tfalse"
    - &presequence
      reference_id: file:CONPW/A0A5M3MRX5/A0A5M3MRX5-bioinformatics/RESULTS.md
      supporting_text: This is the composition of a mitochondrial matrix-targeting presequence, and it
