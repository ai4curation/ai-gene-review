product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:741705
  label: Coniophora puteana RWD-64-598 SS2
description: 'Type-1 NAD-dependent malate dehydrogenase (EC 1.1.1.37) of the brown-rot basidiomycete
  Coniophora puteana (strain RWD-64-598 SS2), most likely the mitochondrial isozyme. The 339-residue
  protein has the lactate/malate dehydrogenase NAD-binding Rossmann and C-terminal catalytic domains,
  with a predicted proton-acceptor histidine and conserved NAD(+)- and substrate-binding residues (NCBIfam
  TIGR01772, PIRSF000102, CDD cd01337, PANTHER PTHR11540:SF73). It is inferred to catalyse the reversible
  NAD(+)-dependent oxidation of (S)-malate to oxaloacetate. An N-terminal extension of about 25 residues,
  rich in arginine, serine and alanine and lacking acidic residues, resembles the mitochondrial presequence
  of yeast Mdh1p. The protein has no peroxisomal PTS1. It is therefore expected to act in the mitochondrial
  matrix as the malate-to-oxaloacetate step of the tricarboxylic acid cycle. The only other type-1 MDH
  in the proteome (A0A5M3MC96) has no presequence and ends in a PTS1 (SKL). Brown-rot fungi secrete
  oxalic acid made largely by hydrolysis of oxaloacetate. A mitochondrial MDH would feed that pool only
  indirectly, because in current models malate rather than oxaloacetate leaves the mitochondria. The
  protein has not been characterized experimentally; all functional statements rest on sequence family
  membership.'
