core_functions:
- description: NAD(+)-dependent oxidation of (S)-malate to oxaloacetate (EC 1.1.1.37) as the TCA-cycle
    malate dehydrogenase of the mitochondrion, inferred from family membership and a presequence-like
    N-terminus. Any contribution to the oxaloacetate hydrolysed to secreted oxalate would be indirect
    and is untested.
