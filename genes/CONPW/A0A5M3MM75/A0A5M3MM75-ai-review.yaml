core_functions:
- description: >-
    Metal-dependent cleavage of an alpha-oxycarboxylate substrate by the
    lyase/hydrolase branch of the phosphoenolpyruvate mutase/isocitrate lyase
    superfamily. The reaction is inferred from the complete conserved active
    site; the substrate is not established, so no more specific molecular
    function is asserted.
  molecular_function:
    id: GO:0003824
    label: catalytic activity
  supported_by:
  - reference_id: file:CONPW/A0A5M3MM75/A0A5M3MM75-bioinformatics/RESULTS.md
    supporting_text: the metal ligands Asp-126, Asp-155, Asp-157, Glu-184
knowledge_gaps:
- gap_statement: >-
    Whether this enzyme is an oxaloacetate acetylhydrolase is unknown. It is
    the only PF13714 protein of Coniophora puteana and carries the serine that
    marks oxaloacetate acetylhydrolase rather than 2,3-dimethylmalate lyase, so
    sequence points towards oxaloacetase, but that marker was derived and
    tested on ascomycete and plant proteins and no basidiomycete member of this
    branch has been purified and assayed. Only enzymology on the protein, or
    loss of oxalate on deleting the gene, can settle it.
  gap_kind:
  - BIOLOGY
suggested_questions:
- question: >-
    Is the serine-carrying PF13714 protein of brown-rot basidiomycetes the
    oxaloacetase whose expression tracks the hyphal front in Postia placenta and
    Gloeophyllum trabeum? This protein is 78.8% identical to the G. trabeum
    serine-carrying protein S7Q6Y6, so one characterisation would go a long
    way towards settling the family.
- question: >-
    Does the marker serine retain its predictive value outside the ascomycete and
    plant proteins in which it was derived and tested? Within the ascomycetes it
    holds up: the Penicillium paralog Pc18g05100, which conferred no oxalate
    production on yeast, has proline rather than serine at that position.
suggested_experiments:
- description: >-
    Express and purify the protein and measure activity against oxaloacetate,
    (2R,3S)-dimethylmalate, 2-methylisocitrate and D-threo-isocitrate with Mg2+
    and Mn2+. This is the experiment that would replace the removed EC 4.1.3.1
    with a real assignment.
- description: >-
    Delete or silence CONPUDRAFT_105298 in Coniophora puteana and measure
    secreted oxalate during wood or mineral-substrate colonisation; loss of
    oxalate would identify the gene as the basidiomycete oxaloacetase and would
    also test the pathway that CMMMech's humboldtine and malachite records
    assume.
