taxon:
  id: NCBITaxon:741705
  label: Coniophora puteana RWD-64-598-SS2
description: >-
  Uncharacterised metal-dependent enzyme of the phosphoenolpyruvate
  mutase/isocitrate lyase superfamily (Pfam PF13714) from the brown-rot
  basidiomycete Coniophora puteana, encoded by locus CONPUDRAFT_105298 and the
  only PF13714 protein in the reference proteome; the organism's isocitrate
  lyases, which belong to the same superfamily, are separate PF00463 proteins.
  Members of the
  superfamily act on alpha-oxycarboxylate substrates, cleaving or forming C-C or
  P-C bonds in an (alpha/beta)8 barrel whose active site is covered by a mobile
  gating loop and requires Mg2+ or Mn2+. The protein retains the complete
  catalytic set of the lyase/hydrolase branch, including the gating-loop lysine
  and the catalytic cysteine, together with the serine that marks oxaloacetate
  acetylhydrolase rather than 2,3-dimethylmalate lyase or 2-methylisocitrate
  lyase, so the sequence evidence points to oxaloacetate acetylhydrolase. Its
  closest relative with a known physiological context is the serine-carrying
  PF13714 protein of another brown-rot fungus, Gloeophyllum trabeum, in which
  oxaloacetase expression rises at the advancing hyphal front during wood
  decay. The substrate of this protein has not been determined experimentally,
  and no basidiomycete enzyme of this branch has been characterised as a
  purified protein.
existing_annotations:
- term:
    id: GO:0003824
    label: catalytic activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - ARBA:ARBA00027533
  - InterPro:IPR018523
  - InterPro:IPR039556
  review:
    summary: >-
      Root-level catalytic activity from the combined automatic (InterPro-based)
      annotation of the PEP mutase/isocitrate lyase superfamily signatures. It is as specific as the
      available evidence allows for this protein.
    action: ACCEPT
    reason: >-
      The protein is a functional enzyme of the superfamily rather than a
      degenerate member: aligned to the Cryphonectria parasitica oxaloacetase
      structure it retains every named catalytic and metal-binding residue
      (Asp-126, Asp-155, Asp-157, Glu-184, the invariant gating-loop Lys-190,
      the catalytic Cys-192, Glu-259, Asn-282 and the Tyr-111/His-182 pair).
      The evidence leans towards oxaloacetase: the protein has Ser at the
      Ser-308 position, the one residue shown to switch oxaloacetase and
      dimethylmalate lyase activity, where A. niger dimethylmalate lyase and
      the inactive Penicillium paralog Pc18g05100 have Pro, and in Gloeophyllum
      trabeum the same Ser/Pro split separates its two PF13714 proteins, with
      this protein on the Ser side. Its higher global identity to A. niger
      dimethylmalate lyase than to characterised oxaloacetases is a weak signal
      across the basidiomycete-ascomycete distance and no tree was built, so it
      does not argue against that. But the marker was derived on ascomycete and
      plant proteins and no basidiomycete member of this branch has been
      assayed, so oxaloacetase activity remains a prediction from one residue.
      No more specific molecular function is asserted in this review, and this
      term is retained rather than marked too general.
    supported_by:
    - reference_id: file:CONPW/A0A5M3MM75/A0A5M3MM75-bioinformatics/RESULTS.md
      supporting_text: the metal ligands Asp-126, Asp-155, Asp-157, Glu-184
    - reference_id: PMID:20558740
      supporting_text: All PEPM/ICL superfamily members require Mg 2+ or Mn 2+ for
        activity
    - reference_id: file:CONPW/A0A5M3MM75/A0A5M3MM75-bioinformatics/RESULTS.md
      supporting_text: The same Ser/Pro split runs inside a single
        basidiomycete genome
- term:
    id: GO:0004451
    label: isocitrate lyase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000003
  qualifier: enables
  supporting_entities:
  - EC:4.1.3.1
  review:
    summary: >-
      Electronic EC-to-GO mapping of the EC 4.1.3.1 that PROSITE-ProRule
      PRU10119 placed on this entry. The signature behind that rule is the
      catalytic-cysteine motif of the whole superfamily and does not identify
      isocitrate lyase.
    action: REMOVE
    reason: >-
      The isocitrate lyase claim is contradicted on three independent grounds.
      (i) Domain architecture: isocitrate lyases carry Pfam PF00463 and are
      428-590 residues, whereas this protein is 364 residues with PF13714 only.
      (ii) Gene content: Coniophora puteana has its own PF00463 isocitrate
      lyases, A0A5M3N7P6 (552 aa) and A0A5M3MQD7 (539 aa), so the
      glyoxylate-cycle enzyme is elsewhere and this assignment is a second,
      spurious one. (iii) Sequence: identity to genuine isocitrate lyases is
      background-level (31.0% to Aspergillus nidulans AcuD, 30.3% to
      Mycobacterium tuberculosis Icl1) against 43.5-44.1% to characterised
      oxaloacetases, and the protein carries the oxaloacetase marker serine at
      the position equivalent to Ser-308 of the C. parasitica structure. The
      PS00161 pattern K-[KR]-C-G-H-[LMQR] that drives the rule matched
      2,3-dimethylmalate lyase, 2-methylisocitrate lyase and the petal death
      protein in the same analysis, so it cannot carry an EC assignment. This
      is a demonstrably wrong automatic mapping, not a curator judgement.
      Removing it leaves the superfamily-level catalytic activity in place; no
      replacement EC is proposed: the evidence that excludes isocitrate lyase
      points towards oxaloacetase but rests, for the substrate, on a single
      marker residue that has not been tested in any basidiomycete enzyme.
    supported_by:
    - reference_id: file:CONPW/A0A5M3MM75/A0A5M3MM75-bioinformatics/RESULTS.md
      supporting_text: True isocitrate lyases carry Pfam PF00463 (ICL) and are 428-590
        residues long.
    - reference_id: file:CONPW/A0A5M3MM75/A0A5M3MM75-bioinformatics/RESULTS.md
      supporting_text: So a PS00161 hit cannot distinguish isocitrate lyase from oxaloacetase,
        dimethylmalate lyase or methylisocitrate lyase.
    source_defects:
    - defect_type: WRONG_TERM
      resource: UNIPROT
      requested_change: DELETE_VALUE
      asserted_value: EC:4.1.3.1
      cause: OTHER
      confidence: CONFIRMED
      explanation: >-
        UniProtKB:A0A5M3MM75 is named "Isocitrate lyase (EC 4.1.3.1)" with
        evidence ECO:0000256|PROSITE-ProRule:PRU10119, and the EC propagates
        into GOA as GO:0004451. The protein carries Pfam PF13714 but not the
        isocitrate lyase domain PF00463, is 364 aa where isocitrate lyases are
        428-590 aa, and is only about 30% identical to characterised isocitrate
        lyases while being 43-44% identical to characterised fungal
        oxaloacetases. Coniophora puteana's own isocitrate lyases are
        UniProtKB:A0A5M3N7P6 and UniProtKB:A0A5M3MQD7 (PF00463, 552 and 539 aa).
        The name and EC should be withdrawn. The likely replacement is
        oxaloacetate acetylhydrolase: the protein carries the oxaloacetase
        marker serine at the Ser-308-equivalent position, where
        2,3-dimethylmalate lyase has proline. Because no basidiomycete enzyme of
        this branch has been characterised and the assignment would rest on that
        one residue, a cautious name such as "probable oxaloacetate
        acetylhydrolase" or a superfamily-level description is preferable to
        a firm EC 3.7.1.1.
    - defect_type: WRONG_TERM
      resource: OTHER
      slot: prosite_prorule
      requested_change: CHECK
      asserted_value: EC:4.1.3.1
      cause: OTHER
      confidence: CONFIRMED
      explanation: >-
        PROSITE rule PRU10119 / pattern PS00161 (ISOCITRATE_LYASE,
        K-[KR]-C-G-H-[LMQR]) assigns the name "Isocitrate lyase" and EC 4.1.3.1
        to every match, and also places an ACT_SITE feature (residue 186 in this
        entry) that is simply the catalytic cysteine of the motif. The pattern
        covers the catalytic cysteine of the entire PEP mutase/isocitrate lyase
        superfamily: in this analysis it matched Aspergillus niger
        2,3-dimethylmalate lyase (PDB 3FA3), Escherichia coli
        2-methylisocitrate lyase (P77541) and the Dianthus petal death protein
        (Q05957) as well as three characterised oxaloacetases, and PROSITE marks
        the site as active_site(?). Applying the rule to sequences lacking the
        isocitrate lyase domain PF00463 mis-names the fungal oxaloacetase family
        (this entry, UniProtKB:F8PSW8, UniProtKB:B6HR98 and others). The rule
        should require the ICL domain, or assign only a superfamily-level
        description.
