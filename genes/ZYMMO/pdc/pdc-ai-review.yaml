taxon:
  id: NCBITaxon:264203
  label: Zymomonas mobilis subsp. mobilis ZM4 = ATCC 31821
description: Pyruvate decarboxylase catalyzes the thiamine diphosphate- and magnesium-dependent conversion
  of pyruvate to acetaldehyde and carbon dioxide in Zymomonas mobilis. The acetaldehyde supplies the two
  alcohol dehydrogenase isozymes for ethanol formation during sugar fermentation. The enzyme forms a homotetramer
  with cofactor-binding sites at subunit interfaces and, unlike yeast pyruvate decarboxylases, does not
  require substrate-dependent allosteric activation.
