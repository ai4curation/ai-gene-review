taxon:
  id: NCBITaxon:264203
  label: Zymomonas mobilis subsp. mobilis ZM4 = ATCC 31821
description: AdhB is the iron-dependent alcohol dehydrogenase II of Zymomonas mobilis. It catalyzes reversible
  NAD-linked ethanol/acetaldehyde interconversion and supports ethanol production through acetaldehyde
  reduction. The catalytic iron lies near the nicotinamide cofactor. This enzyme is distinct from the
  zinc-dependent AdhA isozyme; zinc inhibits AdhB, while iron or cobalt can support its activity during
  purification.
