taxon:
  id: NCBITaxon:264203
  label: Zymomonas mobilis subsp. mobilis ZM4 = ATCC 31821
description: AdhA is the zinc-dependent alcohol dehydrogenase I of Zymomonas mobilis. It catalyzes reversible
  NAD-linked interconversion of ethanol and acetaldehyde, with acetaldehyde reduction regenerating NAD+
  during ethanol fermentation. It is structurally distinct from the iron-dependent AdhB isozyme and makes
  a substantial contribution to physiological acetaldehyde reduction.
