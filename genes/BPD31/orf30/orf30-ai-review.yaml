  review:
    summary: The cryo-EM structure places a copy of gp30 inside the assembled crRNA-loaded Csy surveillance
      complex, wedged between the N-terminal hook of Cas8f and the thumb of Cas7f. The entity bound is
      therefore a ribonucleoprotein, and mutation of residues in either Cas7f or Cas8f at that interface
      abolishes AcrF2 binding.
    action: NEW
    reason: GOA holds no molecular function term for Q6TM72. GO:0043021 is asserted because it is literally
      true, checkable against the deposited coordinates (PDB 5UZ9 and 6B47 both contain this accession),
      and is the same term used for the analogous type I-F inhibitor AcrF8 in genes/BPZF4/AcrF8. It is
      deliberately not offered as the core activity, because it records the entity bound and not the DNA
      mimicry that makes the binding inhibitory; the core activity is carried by the proposed term instead.
      GO:0005515 protein binding is avoided as uninformative.
