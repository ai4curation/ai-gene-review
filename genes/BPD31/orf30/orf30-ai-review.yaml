proposed_new_terms:
- proposed_name: nucleic acid mimicry-based competitive inhibitor activity
  proposed_definition: A molecular function inhibitor activity in which a protein
    presents a surface whose shape and charge distribution imitate those of a nucleic
    acid, and thereby binds competitively to the nucleic-acid-binding site of a target
    protein or protein-containing complex, occluding that site so that the target
    cannot engage its genuine nucleic acid ligand. The inhibitor is not itself a nucleic
    acid, and because the mechanism is competitive occupancy rather than catalysis,
    inhibition is reversible and requires the inhibitor at or above the concentration
    of its target.
  justification: AcrF2 is the case that makes this term's scope clear, because its
    mimicked ligand is a whole double-stranded DNA duplex approaching a multi-subunit
    ribonucleoprotein, whereas the AcrIIA4 and AcrIIA2 cases mimic a short PAM duplex
    approaching a single-protein effector. One term covers both, which no existing
    term does. GO:0043021 ribonucleoprotein complex binding, asserted separately on
    this entry, records what is bound but not that the binding is inhibitory or competitive.
    GO:0140721 nuclease inhibitor activity is the wrong shape here, since the Csy
    complex itself is not the nuclease, Cas3 is, and AcrF2 never touches it. The generic
    GO:0140678 molecular function inhibitor activity cannot distinguish a mimic from
    a domain blocker or a catalytic inhibitor, which is the distinction that governs
    whether substrate excess defeats the inhibitor. Three sequence-unrelated families
    curated in this round would use the term at once, namely AcrF2 here, AcrIIA4 (UniProtKB:A0A247D711)
    and AcrIIA2 (UniProtKB:A0A059T5F6), and they attack two different CRISPR classes,
    which is the argument that the mechanism rather than the family is the reusable
    unit.
  proposed_parent:
    id: GO:0140678
    label: molecular function inhibitor activity
  supported_by:
  - reference_id: PMID:28340349
    supporting_text: these results suggest that AcrF2 is a double-stranded DNA mimic
      that blocks target recognition by competing for a critical DNA binding site
  - reference_id: PMID:28340349
    supporting_text: we did noticed a pseudo-helical display of acidic residues on
      the surface of AcrF2 mimics the negative charge distribution on the helical
      backbone of a DNA duplex
  - reference_id: PMID:29497118
    supporting_text: which was also found in AcrF2 proteins inhibiting the subtype
      I-F effector complex
knowledge_gaps:
- gap_statement: GO has no molecular-function term for mimicry-based competitive inhibition,
    so the activity that defines the AcrF2 family cannot be asserted with an existing
    identifier.
  boundary: The blocked surface is now established by two independent cryo-EM studies,
    and the process term GO:0098672 fits exactly. What cannot be expressed is that
    occupancy of that surface works by imitating double-stranded DNA and is therefore
    competitive with it.
  gap_kind:
  - ONTOLOGY
  status: OPEN
  significance: Anti-CRISPR families share no sequence homology, so mechanism is the
    only axis on which they can be compared. Until the term exists, the module annoton
    for this family must either assert no molecular function, as it currently does,
    or flatten the mimicry into a binding term that loses it.
  resolution: Create the proposed term nucleic acid mimicry-based competitive inhibitor
    activity under GO:0140678, then move its identifier into the molecular_function
    slot here and in genes/LISMN/acrIIA4 and genes/9CAUD/acrIIA2.
  provenance:
  - reference_id: PMID:28340349
    supporting_text: we did noticed a pseudo-helical display of acidic residues on
      the surface of AcrF2 mimics the negative charge distribution on the helical
      backbone of a DNA duplex
- gap_statement: It is undetermined whether a single copy of gp30 is sufficient to
    disable a Csy complex, or whether inhibition requires occupancy of more than one
    site, and consequently what intracellular concentration the phage must reach for
    the mechanism to work.
  boundary: The structures establish the binding site and the competition. What they
    do not give is the stoichiometry of inhibition in solution or the inhibitory concentration
    relative to the host Csy pool.
  gap_kind:
  - BIOLOGY
  status: OPEN
  significance: A stoichiometric blocker, unlike a catalytic one, must be present
    in excess of its target. Without the stoichiometry, the kinetic race between phage
    gene expression and host interference cannot be modelled, and the distinction
    between the module's stoichiometric and enzymatic parts stays qualitative.
  resolution: Titrate purified gp30 against reconstituted Csy complex with a quantitative
    DNA-binding readout, and separately quantify gp30 and Csy subunit copies per cell
    through a D3112 infection cycle.
  provenance:
  - reference_id: PMID:28340349
    supporting_text: AcrF2 is a small acidic protein wedged between positively charged
      residues in the N-terminal hook of Cas8 and the thumb of Cas7.6f
suggested_questions:
- question: Is there any residual selective advantage to AcrF2 once the host Csy complex
    has been engaged, or does the type I-E result mean the family is locked to a single
    effector architecture and cannot be repurposed by point mutation?
  experts:
  - Blake Wiedenheft
  - Alan R. Davidson
- question: PDB 8DFS places an AcrIF2 in a type I-C Cascade, yet the original genetics
    found no inhibition of the related type I-E system. Does AcrF2 bind type I-C productively
    in vivo, and if so what makes I-E the exception?
  experts:
  - Blake Wiedenheft
- question: Does gp30 occupancy of the Cas8f hook pocket also block primed spacer
    acquisition, as was shown for the Cas3-binding inhibitor AcrF3, or only interference?
  experts:
  - Karen L. Maxwell
suggested_experiments:
- hypothesis: gp30 inhibition is competitive with target DNA and can therefore be
    overcome by DNA excess, which is the operational signature that separates a mimic
    from a catalytic or allosteric inhibitor.
  description: Measure Csy-complex target-DNA binding by electrophoretic mobility
    shift or fluorescence anisotropy across a matrix of gp30 and target duplex concentrations,
    and fit the surface to competitive and non-competitive models. A clean competitive
    fit, with apparent gp30 potency falling as duplex concentration rises, is the
    prediction; failure to see that would mean the structural mimicry does not translate
    into kinetic competition and the proposed molecular function would need rewording.
  experiment_type: competitive binding isotherm analysis
- hypothesis: The pseudo-helical acidic array, and not the fold, is the inhibitory
    determinant.
  description: Neutralise the surface acidic residues identified in the cryo-EM interface
    singly and in combination, verify folding by circular dichroism or by the 1.34
    Å crystal form, then assay Csy binding and in vivo plaquing rescue. If charge
    rather than shape carries the function, potency should scale with the number of
    carboxylates removed irrespective of which ones.
  experiment_type: charge-neutralisation mutagenesis with paired in vitro and in vivo
    readouts
- hypothesis: AcrF2 blocks primed spacer acquisition as well as interference, because
    the Cas8f hook pocket it occupies is required for the initial target capture that
    priming depends on.
  description: Score new spacer acquisition in a Pseudomonas aeruginosa PA14 host
    challenged with a partially mismatched protospacer-bearing plasmid, with and without
    induced gp30, by deep sequencing of the CRISPR arrays. The Cas3-binding inhibitor
    AcrF3 was shown to block priming, so the comparison also tests whether the two
    mechanism classes differ in this respect.
  experiment_type: CRISPR array deep sequencing for primed acquisition
