    supporting_text: which was also found in AcrF2 proteins inhibiting the subtype I-F effector complex
knowledge_gaps:
- gap_statement: The intracellular occupancy and timing needed for AcrIF2 protection during native D3112
    infection remain incompletely quantified.
  boundary: Structural studies establish the target-binding sites and inhibition mechanism; they do not
    measure native inhibitor and effector copy numbers throughout infection.
  gap_kind:
  - BIOLOGY
  status: OPEN
  significance: Affinity, target availability and expression timing determine protection; stoichiometric
    binding alone does not establish a universal requirement for molar excess.
  resolution: Measure inhibitor and effector abundance through infection and relate occupancy to target-DNA
    recognition kinetics.
  provenance:
  - reference_id: PMID:28340349
  - reference_id: PMID:36805026
suggested_questions:
- question: Which target-interface features determine why this AcrIF2 inhibits the tested type I-F and
    type I-C systems but not the tested type I-E system?
- question: How does AcrIF2 inhibition of target recognition affect primed spacer acquisition during native
    D3112 infection?
suggested_experiments:
- description: Measure inhibitor occupancy and target-DNA binding with varied order of addition in matched
    type I-F and type I-C systems, allowing for slow dissociation and nonequilibrium trapping.
- description: Compare primed spacer acquisition during infection with wild-type D3112, an acrIF2 deletion
    and a complemented virus.
