id: Q6TM72
gene_symbol: orf30
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:2907964
  label: Pseudomonas phage D3112
description: The 90-residue gene product 30 of Pseudomonas phage D3112 is AcrIF2 (AcrF2), an acidic DNA-mimicking
  anti-CRISPR protein. It occupies the target-DNA capture pocket of the type I-F Csy surveillance complex,
  preventing PAM recognition and R-loop formation. The same protein also binds and inhibits the tested
  Desulfovibrio vulgaris type I-C Cascade through a related PAM-blocking mechanism. Its specificity therefore
  spans these tested systems rather than being restricted to all and only type I-F systems.
existing_annotations:
- term:
    id: GO:0039504
    label: symbiont-mediated suppression of host adaptive immune response
  evidence_type: IEA
  original_reference_id: GO_REF:0000043
  qualifier: involved_in
  supporting_entities:
  - UniProtKB-KW:KW-1080
  review:
    summary: Mapped electronically from Swiss-Prot keyword KW-1080 (Inhibition of host adaptive immune
      response by virus). The essence is right, in that gp30 suppresses a host immune system, but GO:0039504
      is defined for antigen-receptor-based adaptive immunity with somatic diversification and immunological
      memory, which Pseudomonas aeruginosa does not have. GO:0098672 is the term that means what the keyword
      was trying to say.
    action: MODIFY
    reason: This is a definitional mismatch in a keyword-to-term mapping, not a disagreement about the
      biology. CRISPR-Cas is routinely called an adaptive immune system in the primary literature, including
      in the discovery paper cited here, and KW-1080 encodes that loose usage. The GO term, however, is
      explicitly about directed amplification of specific antigen receptors produced by somatic diversification,
      which is a vertebrate-style mechanism absent from bacteria. A QuickGO ancestor query confirms GO:0039504
      is not an ancestor of GO:0098672, so this is a parallel wrong-branch assertion rather than a harmless
      generalisation. MODIFY rather than REMOVE because the intended claim is correct and the right term
      exists. This review prompted a correction to modules/anti_crispr_suppression.yaml, which had carried
      GO:0039504 for this annoton on the strength of this GOA row; the term is now deliberately absent
      there, for the reason given above.
    proposed_replacement_terms:
    - id: GO:0098672
      label: symbiont-mediated suppression of host CRISPR-cas system
    supported_by:
    - reference_id: PMID:23242138
      supporting_text: Here we describe the first examples of genes that mediate the inhibition of a CRISPR/Cas
        system. Five distinct 'anti-CRISPR' genes were found in the genomes of bacteriophages infecting
        Pseudomonas aeruginosa.
