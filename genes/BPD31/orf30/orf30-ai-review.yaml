- description: Competitively occupies the lysine-rich target-DNA capture pocket formed
    between the Cas8f N-terminal hook and the Cas7f thumb of the assembled crRNA-loaded
    type I-F Csy surveillance complex, by presenting a pseudo-helical array of acidic
    residues that reproduces the charge distribution of a double-stranded DNA backbone,
    thereby excluding target DNA and preventing target recognition while leaving crRNA
    biogenesis, Cas protein levels and the downstream nuclease chemistry untouched
  proposed_molecular_function: nucleic acid mimicry-based competitive inhibitor activity
