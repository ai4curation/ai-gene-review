id: Q6TM72
gene_symbol: orf30
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:2907964
  label: Pseudomonas phage D3112
description: Gene product 30 (gp30) of the Pseudomonas aeruginosa transposable phage
  D3112 is a 90-residue acidic protein and the founding member of the AcrF2 (AcrIF2)
  anti-CRISPR family. It allows the phage to replicate in hosts carrying an intact
  type I-F CRISPR-Cas system by disabling the crRNA-guided surveillance complex, the
  Csy complex, after that complex has assembled. The protein is a double-stranded
  DNA mimic. A pseudo-helical array of acidic residues on its surface reproduces the
  spacing and charge of the phosphate backbone of a DNA duplex, and the protein wedges
  into the lysine-rich pocket formed between the N-terminal hook of Cas8f and the
  thumb of Cas7f, which is the site at which incoming target DNA is captured. Occupying
  that pocket competitively excludes target DNA, wrenches the Cas8f hook away from
  its DNA-bound conformation, and so prevents target recognition without touching
  crRNA biogenesis, Cas protein levels or the nuclease chemistry of the pathway. Inhibition
  is stoichiometric and specific to type I-F systems, extending not even to the closely
  related type I-E. Convergence on this mechanism by sequence-unrelated inhibitors
  of other CRISPR classes makes the family a reference case for mimicry-based counter-defence.
