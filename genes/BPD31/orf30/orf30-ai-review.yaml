  review:
    summary: Mapped electronically from Swiss-Prot keyword KW-1080 (Inhibition of
      host adaptive immune response by virus). The essence is right, in that gp30
      suppresses a host immune system, but GO:0039504 is defined for antigen-receptor-based
      adaptive immunity with somatic diversification and immunological memory, which
      Pseudomonas aeruginosa does not have. GO:0098672 is the term that means what
      the keyword was trying to say.
    action: MODIFY
    reason: This is a definitional mismatch in a keyword-to-term mapping, not a disagreement
      about the biology. CRISPR-Cas is routinely called an adaptive immune system
      in the primary literature, including in the discovery paper cited here, and
      KW-1080 encodes that loose usage. The GO term, however, is explicitly about
      directed amplification of specific antigen receptors produced by somatic diversification,
      which is a vertebrate-style mechanism absent from bacteria. A QuickGO ancestor
      query confirms GO:0039504 is not an ancestor of GO:0098672, so this is a parallel
      wrong-branch assertion rather than a harmless generalisation. MODIFY rather
      than REMOVE because the intended claim is correct and the right term exists.
      This review prompted a correction to modules/anti_crispr_suppression.yaml, which
      had carried GO:0039504 for this annoton on the strength of this GOA row; the term
