- L104115
- plasmalogen synthase PlsA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:272623
  label: Lactococcus lactis subsp. lactis Il1403
description: >-
  yxcA encodes the single-chain anaerobic-type plasmalogen synthase PlsA of
  Lactococcus lactis. The 1436-residue cytoplasmic protein fuses all four
  modules of the PlsA/PlsR system first defined in Clostridium perfringens: two
  BadF/BadG/BcrA/BcrD-type ATPase activation domains (Act1, Act2), a DUF2229
  reduction/dehydration domain (Red1) and a C-terminal PlsR-like domain (Red2).
  It belongs to the benzoyl-CoA reductase / 2-hydroxyacyl-CoA dehydratase
  (BCR/HAD) radical enzyme family. PlsA converts diacyl glycerophospholipids
  into plasmalogens (1-alk-1'-enyl-2-acyl lipids) by reducing the sn-1 ester
  bond, rather than by the oxygen-dependent desaturation of an ether used in
  aerobes. By analogy with the BCR/HAD family, the activation domains are
  thought to couple ATP hydrolysis to electron transfer through iron-sulfur
  clusters, making the difficult one-electron ester reduction possible.
  A Lactococcus cremoris ortholog (96.6% identical) confers plasmalogen
  synthesis on Escherichia coli, and it does so even in air, unlike the
  oxygen-sensitive PlsA proteins of other lactic acid bacteria and clostridia.
  The ProtNLM-derived name "2-hydroxyglutaryl-CoA dehydratase" and the eggNOG
  name hgdC reflect family membership only. The protein is not a
  2-hydroxyglutaryl-CoA dehydratase or its activator.
existing_annotations:
- term:
    id: GO:0008611
    label: ether lipid biosynthetic process
  evidence_type: ISS
  original_reference_id: PMID:41427725
  review:
    summary: >-
      Plasmalogen (vinyl-ether phospholipid) biosynthesis. The 96.6%-identical
      L. cremoris PlsA is sufficient to produce plasmalogens in E. coli, and
      4 of 5 L. cremoris strains tested make plasmalogens natively.
    action: NEW
    reason: >-
      GOA has no annotations for Q9CDI2. Expressing L. cremoris ATCC BAA-493
      plsA (LACR_2543) in E. coli gave plasmalogens, and the empty vector gave
      none (PMID:41427725). The E. faecalis single-chain PlsA (67.3% identical)
      and the C. perfringens PlsA/PlsR pair behave the same way, and the
      C. perfringens operon deletion abolishes plasmalogens (PMID:33350306).
      The protein performs the step that forms the defining vinyl-ether bond,
      so it participates in the process; it is not merely required for it.
      This is the same footing on which the aerobic vinyl-ether-forming enzyme
      CarF of Myxococcus xanthus carries this term. GO has no plasmalogen-specific
      biosynthesis term (the only child of GO:0008611 is PAF biosynthesis), so
      the ether lipid term is the most specific available. One caveat: the
      L. cremoris type strain JCM16167T makes no plasmalogen although it
      carries a plsA homolog (RU89_GL001778), and no L. lactis subsp. lactis
      strain was tested (PMID:41427725). Strain-level non-production is most
      likely regulatory: facultative anaerobes carry a conserved TetR/AcrR-like
      regulator directly upstream of pls (EF1326 in E. faecalis;
      PMID:33350306). It does not affect the activity of the enzyme, which
      the heterologous expression shows directly.
    supported_by:
    - reference_id: PMID:41427725
      supporting_text: Both PlsLc and PlsBs produced plasmalogens, as evidenced
        by the detection of aldehydes in the lipid extracts after acid hydrolysis
    - reference_id: PMID:41427725
      supporting_text: Notably, of the five L. cremoris strains tested, only the
        type strain JCM16167T did not produce plasmalogen.
    - reference_id: PMID:33350306
      supporting_text: a TetR/AcrR-like transcriptional regulator (EF1326) directly
        upstream of the pls gene (EF1327)
    - reference_id: PMID:41427725
      supporting_text: These were named plsAK4 (4,248 bp), plsABAA493 (4,311 bp),
        and plsAsuis (4,920 bp), respectively.
    - reference_id: PMID:33350306
      supporting_text: we observed plasmalogen production in E. coli harboring
        the pPlsEF plasmid
    - reference_id: file:LACLA/yxcA/yxcA-bioinformatics/RESULTS.md
      supporting_text: Q9CDI2 is a full-length, single-chain plasmalogen synthase
        (PlsA/PlsAR architecture Act1-Act2-Red1-Red2).
- term:
    id: GO:0051539
    label: 4 iron, 4 sulfur cluster binding
  evidence_type: ISS
  original_reference_id: PMID:33350306
  review:
    summary: >-
      Predicted [4Fe-4S] cluster binding by the Act domains. This is a
      BCR/HAD family property, and the ligating cysteines are conserved, but
      no cluster has been observed on any PlsA.
    action: NEW
    reason: >-
      BCR/HAD activators (component A) bind a [4Fe-4S] cluster that mediates
      the ATP-coupled electron transfer. PlsA Act1 and Act2 conserve the
      cysteines used for cluster ligation (PMID:33350306). In Q9CDI2, 8 of the
      9 cysteines in residues 1-620 are conserved in both E. faecalis and
      C. perfringens PlsA. In Megasphaera elsdenii MeHAD, a combined mutant
      of the four predicted cluster-ligand cysteines (Cys125, Cys164, Cys445
      and Cys484) makes no plasmalogen (PMID:37348645). These correspond to
      the conserved C126, C165, C445 and C484 of Q9CDI2. It is proposed as a
      supporting annotation and is not part of core_functions: no
      spectroscopic or structural evidence of the cluster exists for any
      PlsA.
    supported_by:
    - reference_id: PMID:33350306
      supporting_text: Act1 and Act2 also share conserved cysteines for iron–sulfur
        cluster ligation with HAD and BCR activation domains
    - reference_id: PMID:37348645
      supporting_text: The four-cysteine (Cys125, Cys164, Cys445 and Cys484) site-mutant
        of MeHAD, which were predicted binding to the [4Fe-4S] cluster, was unable
        to synthesize plasmalogens
    - reference_id: file:LACLA/yxcA/yxcA-bioinformatics/RESULTS.md
      supporting_text: All four Q9CDI2 positions are among the eight Act-region
        cysteines conserved in EF1327 and *C. perfringens* PlsA
    - reference_id: file:LACLA/yxcA/yxcA-bioinformatics/RESULTS.md
      supporting_text: both EF1327 and *C. perfringens* PlsA (C126, C165, C445, C449,
        C484, C606, C609, C613)
    - reference_id: file:LACLA/yxcA/yxcA-bioinformatics/RESULTS.md
      supporting_text: Of the nine cysteines in Q9CDI2 residues 1-620, eight align
        to cysteine in both EF1327 and *C. perfringens* PlsA
core_functions:
- description: >-
    Anaerobic plasmalogen synthase. Converts the sn-1 acyl ester of diacyl
    glycerophospholipids into the 1-alk-1'-enyl ether of plasmalogens, with
    all activation and reduction/dehydration domains in one polypeptide. The
    proposed mechanism is ATP-dependent radical reduction followed by
    dehydration, by analogy with the BCR/HAD family.
  proposed_molecular_function: plasmalogen-forming diacylglycerophospholipid reductase
    activity
  directly_involved_in:
  - id: GO:0008611
    label: ether lipid biosynthetic process
  supported_by:
  - reference_id: PMID:41427725
    supporting_text: Both PlsLc and PlsBs produced plasmalogens, as evidenced by
      the detection of aldehydes in the lipid extracts after acid hydrolysis
  - reference_id: PMID:33350306
    supporting_text: anaerobic plasmalogen biosynthesis uses the reductive conversion
      of an ester to an aldehyde equivalent
  - reference_id: PMID:36452453
    supporting_text: The recent discovery of two genes encoding reductases that convert
      diacyl lipids to 1-alk-1′-enyl 2-acyl lipids
  - reference_id: file:LACLA/yxcA/yxcA-bioinformatics/RESULTS.md
    supporting_text: It is essentially the same protein (96.6% identity) as the
      *L. cremoris* PlsA shown to confer plasmalogen synthesis on *E. coli*.
  knowledge_gaps:
  - gap_statement: >-
      The physiological electron donor, the ATP stoichiometry, and the
      phospholipid substrate preference (head group, acyl chain) of PlsA are
      unknown, and the reduction-then-dehydration mechanism has not been
      demonstrated.
    boundary: >-
      Heterologous expression establishes that PlsA alone converts host
      diacyl phospholipids into plasmalogens. No PlsA has been purified and
      assayed in vitro.
    gap_kind:
    - BIOLOGY
    resolution: >-
      Anaerobic purification and reconstitution of PlsA with candidate
      reductants, ATP and defined diacyl phospholipid substrates.
proposed_new_terms:
- proposed_name: plasmalogen-forming diacylglycerophospholipid reductase activity
  proposed_definition: >-
    Catalysis of the reduction of the sn-1 acyl ester of a
    1,2-diacyl-sn-glycero-3-phospholipid to a 1-(1Z-alkenyl) ether, forming
    the corresponding 1-(1Z-alkenyl)-2-acyl-sn-glycero-3-phospholipid
    (plasmalogen).
  proposed_parent:
    id: GO:0016491
    label: oxidoreductase activity
  justification: >-
    The anaerobic bacterial plasmalogen synthases (PlsA/PlsR, single-chain
    PlsA) form the vinyl-ether bond reductively from an ester. This is
    chemically distinct from both existing related terms: GO:0047159
    "plasmalogen synthase activity" is an acyl-CoA acyltransferase reaction
    (EC 2.3.1.25), and the aerobic plasmanylethanolamine desaturase acts on an
    ether, not an ester. These enzymes are widespread in gut anaerobes and
    lactic acid bacteria, and they currently have no specific MF term. The
    definition describes only the overall conversion, which heterologous
    expression demonstrates. The proposed mechanism (an ATP-dependent
    one-electron reduction to a ketyl radical, a second reduction, then
    dehydration, by analogy with BCR/HAD enzymes) belongs in a term comment.
    The electron donor and the stoichiometry are unknown, and no Rhea reaction
    or EC number exists. Matching GO new-term and GO:0047159 relabelling
    requests have been drafted.
  supported_by:
  - reference_id: PMID:33350306
    supporting_text: anaerobic plasmalogen biosynthesis uses the reductive conversion
      of an ester to an aldehyde equivalent
  - reference_id: PMID:36452453
    supporting_text: The recent discovery of two genes encoding reductases that convert
      diacyl lipids to 1-alk-1′-enyl 2-acyl lipids
suggested_questions:
- question: >-
    Should GO add an MF term for reductive, ester-to-vinyl-ether plasmalogen
    synthase activity (PlsA/PlsR)? The existing GO:0047159 "plasmalogen synthase
    activity" names an unrelated acyltransferase reaction, and electronic
    pipelines may map PlsA onto it by name.
  experts:
  - GO editors (lipid metabolism)
- question: >-
    Is the oxygen tolerance of Lactococcus PlsA (aerobic plasmalogen
    production in E. coli) a property of the enzyme's iron-sulfur cluster
    environment, and does L. lactis subsp. lactis make plasmalogens during
    aerobic growth?
  experts:
  - Iron-sulfur enzyme biochemists
  - Lactic acid bacteria physiologists
suggested_experiments:
- experiment_type: Gene deletion and lipidomics
  description: >-
    Delete yxcA in L. lactis IL1403 and measure plasmalogens (DMA by GC-MS,
    LC-MS/MS of plasmenyl species) under aerobic and anaerobic growth. This
    would establish that this ortholog is required in its native host, rather
    than inferring it from heterologous expression of the L. cremoris gene.
- experiment_type: In vitro enzyme assay
  description: >-
    Purify PlsA anaerobically, characterize the iron-sulfur clusters (EPR,
    Mossbauer), and reconstitute activity on diacyl phosphatidylethanolamine
    with ATP and reduced ferredoxin or Ti(III) citrate. This would define the
    electron donor, the ATP stoichiometry and the substrate scope.
references:
- id: PMID:33350306
  title: 'Plasmalogen Biosynthesis by Anaerobic Bacteria: Identification of a Two-Gene
    Operon Responsible for Plasmalogen Production in Clostridium perfringens.'
  findings:
  - statement: >-
      The anaerobic plasmalogen pathway converts an ester to a vinyl ether
      reductively.
    supporting_text: anaerobic plasmalogen biosynthesis uses the reductive conversion
      of an ester to an aldehyde equivalent
  - statement: >-
      E. faecalis EF1327 is a single-chain PlsA with all domains, and it alone
      confers plasmalogen synthesis on E. coli.
    supporting_text: The E. faecalis gene EF1327 encodes all activation and reduction/dehydration
      domains as a single polypeptide (PlsA)
  - statement: Proposed mechanism, by analogy to BCR/HAD enzymes.
    supporting_text: The sequence would involve an initial reduction of the sn-1
      linked ester to a ketyl radical anion, protonation, a second reduction-protonation
      sequence, and a final dehydration
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text cached. Defines the PlsA/PlsR system (operon deletion,
      heterologous expression) and the single-chain E. faecalis PlsA, 67.3%
      identical to Q9CDI2.
- id: PMID:41427725
  title: Characterization of plasmalogen production in facultative anaerobic bacteria
    and aerobic synthesis in recombinant Escherichia coli expressing anaerobic bacterium-derived
    plasmalogen synthase genes.
  findings:
  - statement: >-
      Lactococcus cremoris strains produce plasmalogens. The cloned
      L. cremoris ATCC BAA-493 plsA (LACR_2543), 96.6% identical to Q9CDI2,
      confers plasmalogen synthesis on E. coli under both aerobic and
      anaerobic conditions.
    supporting_text: Both PlsLc and PlsBs produced plasmalogens, as evidenced by
      the detection of aldehydes in the lipid extracts after acid hydrolysis
  - statement: The L. cremoris enzyme is unusually productive under aerobic conditions.
    supporting_text: the PlsLc strain produced more than three times the amount of
      plasmalogen as the other strains, even under aerobic conditions
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text cached. This is the closest experimental evidence for this
      protein: an ortholog from the sister subspecies. The ROS and osmotic
      stress phenotypes are effects of plasmalogens in a heterologous host
      and are not annotated. The oxygen-tolerance mechanism rests on
      AlphaFold3 models only.
- id: PMID:37348645
  title: Characterization and heterologous expression of plasmalogen synthase MeHAD
    from Megasphaera elsdenii.
  findings:
  - statement: >-
      The single-chain plasmalogen synthase MeHAD (M. elsdenii MELS_0169) is
      sufficient for plasmalogen synthesis in E. coli. A combined mutant of
      its four predicted [4Fe-4S] ligand cysteines is inactive. These
      cysteines align to Q9CDI2 C126, C165, C445 and C484.
    supporting_text: The four-cysteine (Cys125, Cys164, Cys445 and Cys484) site-mutant
      of MeHAD, which were predicted binding to the [4Fe-4S] cluster, was unable
      to synthesize plasmalogens
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PMID and title checked against the cached PubMed record. The cache is
      abstract-only (full_text_available false). The mutant result is known
      only from the abstract, so the assay, whether the four mutations were
      tested singly, and whether cluster occupancy was checked are all
      unknown. This is part of why GO:0051539 stays outside core_functions.
      The residue mapping to Q9CDI2 is computed in
      yxcA-bioinformatics/RESULTS.md.
- id: PMID:38456674
  title: Plasmalogen, a glycerophospholipid crucial for Streptococcus mutans acid
    tolerance and colonization.
  findings:
  - statement: >-
      S. mutans SMU_438c, a single-chain PlsA, is required for plasmalogen
      production and is sufficient for it in a plasmalogen-negative
      streptococcus. (Its PANTHER subfamily, shared with Q9CDI2, comes from
      yxcA-bioinformatics, not from this paper.)
    supporting_text: The heterologous expression of SMU_438c in a plasmalogen-negative
      strain, Streptococcus sanguinis, resulted in the production of plasmalogen,
      indicating that this enzyme is sufficient for plasmalogen production
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PMID and title checked against the cached PubMed record. The cache is
      abstract-only. This paper supports SMU_438c as a characterized
      single-chain plasmalogen synthase, cited in the notes and in the
      PANTHER lookup of yxcA-bioinformatics. It does not study Lactococcus.
- id: PMID:36452453
  title: Plasmalogens in bacteria, sixty years on.
  findings:
  - statement: >-
      Review confirming that bacterial plasmalogens derive from diacyl lipids
      via the PlsA/PlsR reductases.
    supporting_text: The recent discovery of two genes encoding reductases that convert
      diacyl lipids to 1-alk-1′-enyl 2-acyl lipids
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Review article; background only.
- id: file:LACLA/yxcA/yxcA-bioinformatics/RESULTS.md
  title: yxcA (Q9CDI2) sequence comparison with characterized plasmalogen synthases
  findings:
  - statement: >-
      Q9CDI2 is 96.6% identical to L. cremoris LACR_2543 and 67.3% identical
      to E. faecalis EF1327. Its residues 1011-1411 align to C. perfringens
      PlsR (Red2) at 41.3%, so the C-terminus is a fused Red2 domain that
      Pfam's HGD-D model misses.
    supporting_text: The local alignment of Q9CDI2 residues 1011-1411 to PlsR (41.3%
      identity over 402 columns) is the direct evidence that the C-terminal ~430
      residues are the Red2 domain
  - statement: >-
      The four MeHAD (G0VRE7) cysteines whose combined mutation abolishes
      plasmalogen synthesis (PMID:37348645) align to Q9CDI2 C126, C165, C445
      and C484 in a global alignment (48.7% identity). All four are among the
      Act-region cysteines conserved in EF1327 and C. perfringens PlsA.
    supporting_text: All four Q9CDI2 positions are among the eight Act-region
      cysteines conserved in EF1327 and *C. perfringens* PlsA
