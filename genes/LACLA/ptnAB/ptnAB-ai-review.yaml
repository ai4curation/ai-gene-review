id: Q9CEX8
gene_symbol: ptnAB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:272623
  label: Lactococcus lactis subsp. lactis Il1403
description: PtnAB is the fused soluble EIIA/EIIB phosphotransfer component of the mannose-family phosphotransferase
  system in Lactococcus lactis IL1403. Its two domains relay phosphate to sugar in conjunction with the
  PtnC/PtnD membrane permease. The native system supports growth on mannose and glucose. PtnAB can associate
  with the membrane complex but is not itself a transmembrane channel. PtnC/PtnD, without PtnAB, suffice
  for lactococcin A receptor activity; sugar phosphorylation and bacteriocin recognition are distinct
  functions.
