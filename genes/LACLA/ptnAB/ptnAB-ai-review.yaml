  review:
    summary: PtnAB is the catalytic phosphotransfer unit of the assembled mannose PTS. The same native
      system also accepts glucose.
    action: MODIFY
    reason: The fused EIIA/EIIB signatures, native complex identification and operon utilization phenotype
      support the mannose-specific coupled phosphotransfer activity. This is mechanistic inference for
      IL1403, not a purified PtnAB phosphate-transfer assay. Membrane partners remain necessary for the
      complete transporter reaction. Refine the true broad activity to both supported mannose and glucose
      PTS transporter functions. GO:0022855 specifies phosphohistidine-dependent glucose group translocation
      without an unverified product-position claim. Native glucose utilization is independently supported
      alongside mannose; no GlcNAc or fructose activity is extrapolated to IL1403. No new row is needed.
