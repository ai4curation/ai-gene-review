  review:
    summary: ptnC contributes directly to mannose binding/translocation in the assembled Ptn complex.
      The same native system also accepts glucose.
    action: MODIFY
    reason: The PROSITE domain assignment identifies actual sugar-binding/translocation work, strengthened
      by native IL1403 ptnC/ptnD mutant utilization phenotypes with cellobiose controls. The assembled
      transporter claim is supported; the core explicitly uses contributes_to, without assigning autonomous
      phosphorylation to this membrane subunit. The growth assays are not direct flux measurements and
      bacteriocin recognition alone would not establish sugar transport. Refine the true broad activity
      to both supported mannose and glucose PTS transporter functions. GO:0022855 specifies phosphohistidine-dependent
      glucose group translocation without an unverified product-position claim. Native glucose utilization
      is independently supported alongside mannose; no GlcNAc or fructose activity is extrapolated to
      IL1403. No new row is needed.
    supported_by:
    - reference_id: file:LACLA/ptnC/ptnC-uniprot.txt
