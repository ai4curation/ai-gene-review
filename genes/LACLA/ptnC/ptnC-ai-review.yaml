taxon:
  id: NCBITaxon:272623
  label: Lactococcus lactis subsp. lactis Il1403
description: PtnC is the membrane IIC component of the mannose-family phosphotransferase system in Lactococcus
  lactis IL1403. It provides part of the sugar-binding/translocation machinery together with PtnD, coupled
  to phosphate delivery by PtnAB. Native mutant phenotypes support a role in mannose and glucose utilization.
  The PtnC/PtnD pair also acts as a receptor for lactococcin A and related bacteriocins. Receptor sensitivity
  and sugar utilization can be partly uncoupled.
