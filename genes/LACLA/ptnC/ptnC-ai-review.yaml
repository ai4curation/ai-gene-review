- id: PMID:17284603
  title: Common mechanisms of target cell recognition and immunity for class II bacteriocins.
  findings:
  - statement: Native IL1403 PtnAB/PtnC/PtnD copurify in the receptor-associated complex; this identifies
      components without assigning catalytic activity to the membrane subunits.
    supporting_text: Through mass spectrometric analysis, three of these proteins were identified as components
      of the man-PTS, namely IIAB, IIC, and IID.
  - statement: Whole-operon disruption reduces glucose/mannose growth; reported complementation establishes
      bacteriocin receptor rescue, not a purified uptake measurement.
    supporting_text: the reduced ability of the mutant (B464) to grow on glucose or mannose
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full cached primary text read. Native IL1403 assays are separated from heterologous
      receptor expression and from general domain-mechanism interpretation.
- id: PMID:38047704
  title: Lactococcus lactis mutants resistant to lactococcin A and garvicin Q reveal missense mutations
    in the sugar transport domain of the mannose phosphotransferase system.
  findings:
  - statement: Native IL1403 ptnC/ptnD mutants perturb sugar-dependent growth; cellobiose controls distinguish
      a broad growth defect. Mutants 1 and 5 retain near-wild-type utilization, so bacteriocin resistance
      is not equivalent to loss of transport.
    supporting_text: As expected, little difference in growth rate was seen between WT and mutants of
      IL1403 when cells were grown in M17 supplemented with cellobiose
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full cached primary text read. Native IL1403 assays are separated from heterologous
      receptor expression and from general domain-mechanism interpretation.
