  label: Lactococcus lactis subsp. lactis Il1403
status: COMPLETE
description: >-
  The KBase gene-annotate dashboard (Dark Protein Atlas) LLM call for L. lactis
  CP006766.1_2177 (eggNOG name dus) is "DusB-like FMN-dependent tRNA-dihydrouridine synthase
  catalyzing reduction of uridine residues in tRNA to dihydrouridine" (tier A), with three GO
  terms: GO:0017150 tRNA dihydrouridine synthase activity, GO:0010181 FMN binding and
  GO:0006400 tRNA modification. The query differs from UniProt Q9CE84 (IL1403 yudI) at one
  position (E267G), so the call is scored on Q9CE84. The call is supported. It agrees with the
  NCBIfam DusB-like, PIRSF Dus and Pfam Dus models on the query and with every prior annotation,
  and the catalytic cysteine and FMN-binding residues of E. coli DusB are conserved. It is
  right not to assign a modified position: E. coli DusB makes D17 only, whereas the single
  DusB of Mycoplasma capricolum also makes D20/D20a, and L. lactis likewise has only one Dus.
  It is also right to set aside the heat-stress and fitness evidence, which comes from
  expression correlations and from distant (36-43%) homologs. The process term could be
  sharpened from tRNA modification to tRNA dihydrouridine synthesis, which GOA already holds.
  Scored per term: the synthase activity is CNN (already in GOA), FMN binding is COR (novel
  relative to GOA) and tRNA modification is LSP.
