    id: GO:0017150
    label: tRNA dihydrouridine synthase activity
  predicted_term_type: GO_MF
  review:
    assessment: CNN
    confidence_score: 2
    summary: >-
      Correct, and at the right level, but not novel. The query is a full-length DusB-subfamily enzyme with
      the catalytic cysteine (Cys111, E. coli DusB Cys100) and FMN site conserved. GOA already
      holds this term (IEA). A position-specific child would overreach: site specificity
      varies within the DusB subfamily, and no lactococcal tRNA modification map exists.
    supported_by:
    - reference_id: file:LACLA/yudI/yudI-bioinformatics/RESULTS.md
      supporting_text: >-
        The catalytic cysteine and every FMN-binding residue annotated on E. coli DusB are
        conserved, so the protein is an intact Dus enzyme rather than a degenerate paralog.
    - reference_id: PMID:33685366
      supporting_text: >-
        DusBMCap modifies U17 to D17 but also synthetizes D20/D20a combining therefore both
        E. coli DusA and DusB activities.
