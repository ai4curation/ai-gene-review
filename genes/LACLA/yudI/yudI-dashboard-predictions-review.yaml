- id: file:LACLA/yudI/yudI-bioinformatics/RESULTS.md
  title: 'yudI bioinformatics: Dus subfamily placement and conserved residues'
  findings:
  - statement: The catalytic Cys and FMN-binding residues of E. coli DusB are conserved.
    supporting_text: >-
      The catalytic cysteine and every FMN-binding residue annotated on E. coli DusB are
      conserved, so the protein is an intact Dus enzyme rather than a degenerate paralog.
- id: PMID:33685366
  title: Dihydrouridine synthesis in tRNAs is under reductive evolution in Mollicutes.
  findings:
  - statement: The single DusB of M. capricolum modifies U17, U20 and U20a.
    supporting_text: >-
      DusBMCap modifies U17 to D17 but also synthetizes D20/D20a combining therefore both
      E. coli DusA and DusB activities.
- id: PMID:22123979
  title: Molecular basis of dihydrouridine formation on tRNA.
  findings:
  - statement: Dus enzymes use FMN as cofactor.
    supporting_text: >-
      Dihydrouridine synthase (Dus) catalyzes the D formation of tRNA through reduction of
      uracil base with flavin mononucleotide (FMN) as a cofactor.
