        the Dus family is FMN, not FAD (PMID:22123979), and UniProt records FMN as the
        cofactor of Dus members such as Q9CE84. The InterPro2GO mapping for these entries
        should point to GO:0010181 FMN binding instead.
      supported_by:
      - reference_id: PMID:22123979
        supporting_text: Dihydrouridine synthase (Dus) catalyzes the D formation of tRNA
          through reduction of uracil base with flavin mononucleotide (FMN) as a cofactor.
