- id: PMID:11983710
  title: Identification of the tRNA-dihydrouridine synthase family.
  findings:
  - statement: Deletion of the three E. coli COG0042 genes showed that this family makes
      dihydrouridine in tRNA, with non-redundant site-specific roles.
    supporting_text: The results showed that the COG0042 gene family is responsible
      for tRNA-dihydrouridine synthase activity in E. coli.
- id: PMID:29294097
  title: 'Unveiling structural and functional divergences of bacterial tRNA dihydrouridine
    synthases: perspectives on the evolution scenario.'
  findings:
  - statement: In E. coli, DusB makes D17 only, DusC makes D16 and DusA makes D20/D20a.
    supporting_text: DusC and DusB are mono-site specific flavoenzymes involved in
      D16 and D17 biosynthesis, respectively, while DusA is a U20/U20a bi-site specific
      enzyme
  - statement: DusB is the ancestral bacterial Dus, from which DusA and DusC arose by
      duplication.
    supporting_text: Considered as the oldest prokaryotic member, DusB is present in
      most bacteria whereas DusA and DusC, observed mainly in proteobacteria, originate
      from dusB duplications
- id: PMID:33685366
  title: Dihydrouridine synthesis in tRNAs is under reductive evolution in Mollicutes.
  findings:
  - statement: The single DusB of Mycoplasma capricolum modifies U17, U20 and U20a.
    supporting_text: DusBMCap modifies U17 to D17 but also synthetizes D20/D20a combining
      therefore both E. coli DusA and DusB activities.
  - statement: Firmicutes have three DusB subgroups (DusB1, DusB2, DusB3); DusB1 and
      DusB2 were ancestral, and Mollicutes kept DusB1.
    supporting_text: three DusB subgroups namely DusB1, DusB2 and DusB3. The first two
      subgroups were likely present in the Firmicute ancestor, and Mollicutes have
      retained DusB1 and lost DusB2.
- id: PMID:32629984
  title: Survey and Validation of tRNA Modifications and Their Corresponding Genes in
    Bacillus subtilis sp Subtilis Strain 168.
  findings:
  - statement: B. subtilis tRNAs carry D17, D20, D20a and D47, made by only two Dus
      paralogs whose site specificities are unknown.
    supporting_text: 'only two COG0042 members are encoded in the B. subtilis genome:
      Dus1 (BSU00810) and Dus2 (BSU08030). At this stage, without further biochemical
      and/or genetic experiments, it is not possible to predict which position each enzyme
      modifies.'
