id: Q9CE84
gene_symbol: yudI
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:272623
  label: Lactococcus lactis subsp. lactis Il1403
aliases: [L19272, dus]
description: >-
  YudI is the only tRNA-dihydrouridine synthase (Dus, COG0042) of Lactococcus lactis,
  a cytoplasmic FMN-dependent flavoenzyme of the DusB subfamily that reduces the C5-C6
  double bond of specific uridines in the tRNA D-loop to dihydrouridine, using NADPH or
  NADH as the electron source. It keeps the catalytic cysteine (Cys111, equivalent to
  E. coli DusB Cys100) and all FMN-binding residues of E. coli DusB. Among Firmicute Dus
  proteins it is closest to Bacillus subtilis Dus1 (YacF), and so probably belongs to
  the DusB1 subgroup that Mollicutes also retained. In E. coli DusB makes D17 only,
  whereas the single DusB of Mycoplasma capricolum makes D17, D20 and D20a; because
  L. lactis has no other Dus paralog, YudI may likewise modify several D-loop positions,
  but the positions it modifies have not been determined. Within L. lactis strain
  KF147, expression of the orthologue correlates positively with heat-stress robustness
  across the culture conditions tested (the correlation was not found in other strains),
  and a Lactobacillus paracasei transposon mutant in the orthologue was picked up in a
  heat-stress screen, but no direct physiological role has been shown.
