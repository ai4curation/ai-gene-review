core_functions:
- description: >-
    FMN-dependent, NAD(P)H-driven reduction of specific uridines in the tRNA D-loop to
    dihydrouridine. As the only Dus of L. lactis it is expected to make all D residues in
    lactococcal tRNA; the positions (U17 and possibly U20/U20a) are not determined.
  molecular_function:
    id: GO:0017150
    label: tRNA dihydrouridine synthase activity
  directly_involved_in:
  - id: GO:0002943
    label: tRNA dihydrouridine synthesis
  supported_by:
  - reference_id: file:LACLA/yudI/yudI-bioinformatics/RESULTS.md
    supporting_text: The catalytic cysteine and every FMN-binding residue annotated on E. coli DusB are
      conserved, so the protein is an intact Dus enzyme rather than a degenerate paralog.
  - reference_id: PMID:33685366
    supporting_text: DusBMCap modifies U17 to D17 but also synthetizes D20/D20a combining
      therefore both E. coli DusA and DusB activities.
knowledge_gaps:
- gap_statement: >-
    The dihydrouridine positions in L. lactis tRNAs, and which of them YudI makes, are
    unknown. E. coli DusB is mono-site (U17) while the single Mollicute DusB is multisite
    (U17, U20, U20a); L. lactis, with one Dus, could resemble either.
  gap_kind:
  - BIOLOGY
- gap_statement: >-
    The link between yudI and heat-stress survival rests on an expression correlation in
    L. lactis and a transposon screen in L. paracasei; no deletion phenotype or mechanism
    has been reported for any lactococcal Dus.
  gap_kind:
  - BIOLOGY
suggested_questions:
- question: Does the single L. lactis Dus, like M. capricolum DusB, make D20 and D20a as
    well as D17, or do lactococcal tRNAs lack D at some positions?
- question: Is the positive correlation between yudI expression and heat-stress survival
    causal, for example through tRNA D-loop flexibility at elevated temperature?
suggested_experiments:
- description: Map dihydrouridines in tRNAs of L. lactis wild type and a yudI deletion
    (AlkAnilineSeq, Rho-seq or LC-MS of tRNA digests) to define the positions the enzyme
    modifies.
  experiment_type: tRNA modification mapping
- description: Express YudI in an E. coli dusA dusB dusC triple mutant and assay D17 and
    D20/D20a restoration, as done for M. capricolum DusB.
  experiment_type: heterologous complementation
- description: Compare heat-stress survival of a yudI deletion with wild type and the
    complemented strain in L. lactis MG1363 or KF147.
  experiment_type: mutant phenotyping
