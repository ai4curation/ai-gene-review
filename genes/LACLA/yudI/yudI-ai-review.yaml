  review:
    summary: >-
      Wrong cofactor. Dus enzymes are FMN flavoenzymes; FAD binding comes from a broad
      InterPro2GO mapping of the Dus family signatures.
    action: REMOVE
    reason: >-
      The flavin of the Dus family is FMN (PMID:22123979), and UniProt records FMN as
      the cofactor of this protein. All FMN-binding residues of E. coli DusB are
      conserved in YudI. No Dus enzyme is known to bind FAD. The row comes from
      InterPro2GO mappings of IPR001269, IPR004652 and IPR018517, which put the same FAD
      term on other Dus proteins (recorded under source_defects). The correct cofactor
      term, GO:0010181 FMN binding, is added below.
    supported_by:
    - reference_id: PMID:22123979
      supporting_text: Dihydrouridine synthase (Dus) catalyzes the D formation of tRNA
        through reduction of uracil base with flavin mononucleotide (FMN) as a cofactor.
    - reference_id: file:LACLA/yudI/yudI-uniprot.txt
