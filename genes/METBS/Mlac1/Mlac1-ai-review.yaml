- term:
    id: GO:0046148
    label: pigment biosynthetic process
  evidence_type: ISS
  original_reference_id: PMID:29958281
  review:
    summary: Mlac1 (Abr2 homolog) is the laccase of the Pks1 gene cluster and is proposed
      to catalyze a late oxidative step converting the Pks1-derived anthraquinone into
      the conidial pigment.
    action: NEW
    reason: Revised in the 2026-10 re-review from GO:0030639 polyketide biosynthetic
      process. Comparator check - the experimentally characterized A. fumigatus cluster
      laccase Abr2 (E9RBR0) carries pigment biosynthetic process (IMP) and melanin
      biosynthetic process, not polyketide biosynthetic process; tailoring laccases
      act on the released polyketide to make pigment. The Mlac1 step itself is inferred
      (UniProt marks it Probable) from cluster membership and Abr2 homology, hence ISS
      rather than an experimental code. If confirmed, Mlac1 performs a catalytic step
      of pigment formation (participation, not mere requirement).
    supported_by:
    - reference_id: PMID:29958281
      supporting_text: PKS1 is involved in synthesis of an anthraquinone derivative,
        and contributes to conidial pigmentation
    - reference_id: UniProt:A0A0B4F5S2
      supporting_text: the laccase Mlac1 further convert the anthraquinone derivative
        into the final conidial pigment
- term:
    id: GO:0009986
    label: cell surface
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: located_in
  supporting_entities:
  - UniProtKB:E9RBR0
  review:
    summary: ISS transfer of cell-surface localization from A. fumigatus Abr2 (E9RBR0),
      the conidial DHN-melanin laccase that has experimental (EXP) cell-surface localization.
      Mlac1 is the Abr2 homolog in the Metarhizium Pks1 pigment cluster; a conidial
      surface location fits a laccase acting on conidial wall pigment. Same assertion
      as the GO_REF:0000044 IEA row, which derives from the same UniProt statement.
    action: ACCEPT
    reason: Plausible, homology-based localization consistent with the pigment role;
      no Mlac1-specific localization data exist, so this remains a supporting rather
      than core annotation.
    supported_by:
    - reference_id: file:METBS/Mlac1/Mlac1-uniprot.txt
      supporting_text: 'SUBCELLULAR LOCATION: Cell surface {ECO:0000250|UniProtKB:E9RBR0}.'
