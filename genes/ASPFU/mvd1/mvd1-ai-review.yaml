taxon:
  id: NCBITaxon:330879
  label: Aspergillus fumigatus Af293
description: mvd1 (AFUA_4G07130) encodes the Aspergillus fumigatus diphosphomevalonate decarboxylase
  (EC 4.1.1.33), a 404-residue GHMP-superfamily enzyme and the only member of this family in the
  genome. It uses ATP to phosphorylate and decarboxylate (R)-5-diphosphomevalonate to isopentenyl
  diphosphate (IPP), ADP, phosphate and CO2, the last step of the mevalonate pathway. IPP feeds
  farnesyl diphosphate and hence ergosterol, the target of azole and polyene antifungals, as well as
  dolichol, ubiquinone and protein prenylation. In this mold the mevalonate pool is shared between
  ergosterol synthesis and the triacetylfusarinine C siderophore, which branches off before this
  step. The A. fumigatus protein has not been characterised directly; its function rests on
  orthology to the S. cerevisiae and A. oryzae enzymes, the latter of which rescues a yeast erg19
  mutant and affects ergosterol content, growth, sporulation and stress tolerance. The enzyme lacks
  recognisable targeting signals and is presumed cytosolic, although an overexpressed fluorescent
  fusion of the A. oryzae ortholog accumulates in vacuoles.
