  supporting_entities:
  - MGI:MGI:2179327
  - PANTHER:PTN000104601
  - UniProtKB:P53602
  review:
    summary: PTN000104601 cytosol inheritance from characterized cytosolic MVDs.
    action: ACCEPT
    reason: >-
      No A. fumigatus-specific localization paper is cached. The PAINT cytosol
      node is seeded by mouse and human MVDs rather than a fungal MVD, but
      cytosol inheritance is consistent with direct S. pombe and S. cerevisiae
      localization of soluble fungal MVD enzymes. The UniProt FUNCTION record's
      vacuole sentence is the same review-level pathway-compartment statement
      flagged as weak for S. cerevisiae MVD1/ERG19, not a direct A. fumigatus
      mvd1 localization assay.
    supported_by:
    - reference_id: file:interpro/panther/PTHR10977/PTHR10977-paint.tsv
      supporting_text: "PTHR10977\tPTN000104601\tGO:0005829\tC\tIBD\tfalse"
