suggested_questions:
- question: Is A. fumigatus mvd1 essential? The 2025 summary of essential A. fumigatus genes lists erg10,
    erg12, erg8 and erg20 from this segment, but not mvd1.
- question: Is the vacuolar signal reported for overexpressed DsRed fusions of A. oryzae AoErg19 a real
    working location, or turnover of the fusion? Where is native-level Mvd1 in A. fumigatus hyphae?
suggested_experiments:
- hypothesis: A. fumigatus Mvd1 expressed from its native locus is cytosolic, and the vacuolar signal of
    the A. oryzae fusions reflects overexpression and turnover.
  description: Tag mvd1 at its chromosomal locus with a monomeric GFP under the native promoter, confirm
    that the fusion is functional as the sole copy, and image hyphae with vacuolar (CMAC) and peroxisomal
    markers, with and without autophagy blocked (atg1 or atg8 deletion); compare with the same fusion
    overexpressed from a strong promoter.
  experiment_type: localization
- hypothesis: mvd1 is essential for growth and virulence of A. fumigatus.
  description: Place mvd1 under a tetracycline-repressible (tetOFF) promoter, test growth on repression in
    vitro with and without exogenous ergosterol, and test virulence in an invertebrate or murine
    infection model under doxycycline.
  experiment_type: genetic interaction / conditional knockdown
