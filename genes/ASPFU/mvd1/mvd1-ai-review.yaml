- id: file:ASPFU/mvd1/mvd1-uniprot.txt
  title: UniProt entry Q4WNV9 (MVD1_ASPFU)
  findings: []
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: Function, reaction and pathway are by similarity to S. cerevisiae MVD1 and agree with the
      review. The FUNCTION sentence placing the second ergosterol module in the vacuole is copied from the
      S. cerevisiae entry; the cited A. fumigatus papers do not support it.
    source_defects:
    - defect_type: WRONG_STATEMENT
      resource: UNIPROT
      record: UniProtKB:Q4WNV9
      slot: CC:FUNCTION
      requested_change: CHECK
      asserted_value: The second module is carried out in the vacuole and involves the formation of farnesyl
        diphosphate, which is also an important intermediate in the biosynthesis of ubiquinone, dolichol, heme
        and prenylated proteins.
      cause: SCOPE_OVER_REACH
      confidence: SUSPECTED
      explanation: The FUNCTION comment of Q4WNV9 places the middle (mevalonate-to-FPP) module of ergosterol
        synthesis in the vacuole. The cited A. fumigatus papers (PMID:16110826, PMID:22106303) contain no
        localization data. The S. cerevisiae Mvd1 ortholog is cytoplasmic in the genome-wide GFP survey
        (PMID:14562095). The one Aspergillus report, on A. oryzae AoErg19 (PMID:31156588), used
        overexpressed DsRed fusions of a protein with no targeting signal. The clause should be qualified or
        removed unless primary A. fumigatus data exist. This query rests on the full text of PMID:22106303
        and PMID:31156588 and the abstract of PMID:16110826.
