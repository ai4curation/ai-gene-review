taxon:
  id: NCBITaxon:330879
  label: Aspergillus fumigatus Af293
description: >-
  mvd1 encodes the A. fumigatus diphosphomevalonate decarboxylase of the
  mevalonate pathway. It is a GHMP-family enzyme in PTHR10977:SF3 that is
  predicted to ATP-dependently decarboxylate (R)-5-diphosphomevalonate to
  isopentenyl diphosphate, supplying the C5 precursor for ergosterol,
  prenylation and other isoprenoid products.
