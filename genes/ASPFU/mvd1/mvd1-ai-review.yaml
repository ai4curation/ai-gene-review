- term:
    id: GO:0005829
    label: cytosol
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  supporting_entities:
  - MGI:MGI:2179327
  - PANTHER:PTN000104601
  - UniProtKB:P53602
  review:
    summary: PAINT cytosol inference seeded by mouse Mvd and human MVD, which are cytosolic by
      fractionation and microscopy. No A. fumigatus localization data exist. The S. cerevisiae ortholog,
      tagged at its chromosomal locus, is cytoplasmic. The one Aspergillus report, on A. oryzae AoErg19,
      found its DsRed overexpression fusions in vacuoles.
    action: ACCEPT
    reason: The protein has no signal peptide or other targeting signal, so a vacuolar lumen location
      could only arise by autophagy or degradation; the A. oryzae result used overexpressed DsRed fusions
      and is more plausibly turnover than the working location of the enzyme. Its substrate and product
      are made and used by cytosolic enzymes in yeast. The cytosol claim holds; an experiment with the
      native-promoter A. fumigatus protein is suggested below.
    supported_by:
    - reference_id: PMID:14972328
      supporting_text: We found a cytosolic localization for both endogenous human mevalonate pyrophosphate
        decarboxylase (in human fibroblasts, liver, CV1 and HEK293 cells) and overexpressed mevalonate
        pyrophosphate decarboxylase
    - reference_id: PMID:14562095
      supporting_text: We classify these proteins, representing 75% of the yeast proteome, into 22 distinct
        subcellular localization categories
    - reference_id: PMID:31156588
      supporting_text: Bioinformatic analysis showed that there were no specific targeting signal sequences
        in the amino acid sequence of AoErg19
    - reference_id: PMID:31156588
      supporting_text: To construct the overexpression vector, the CDS of Aoerg19 was fused to DsRed at the
