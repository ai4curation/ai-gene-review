taxon:
  id: NCBITaxon:330879
  label: Aspergillus fumigatus Af293
description: Aspergillus fumigatus erg7A encodes the dominant lanosterol synthase paralog, an
  oxidosqualene cyclase that initiates the sterol branch of ergosterol biosynthesis. It is
  functionally redundant with erg7B at high erg7B expression and distinct from the helvolic-acid
  protostadienol synthase HelA.
