  - sgd:YBL082C
  - UniProtKB:Q9Y7I4
  - PomBase:SPAC7D4.06c.1:pep
  review:
    summary: >-
      The combined automated inference to glycoprotein biosynthesis is true but
      broader than alg3's direct lipid-linked oligosaccharide assembly step.
    action: KEEP_AS_NON_CORE
    reason: >-
      ALG3 builds the lipid-linked oligosaccharide precursor that is subsequently
      transferred to nascent proteins. That makes glycoprotein biosynthesis a
      valid pathway-level annotation, while GO:0006488 and GO:0052925 capture the
      direct process and molecular function.
    supported_by:
    - reference_id: file:genes/ASPFU/alg3/alg3-uniprot.txt
      record_section:
      - CC:FUNCTION
      supporting_text: 'Once assembled, the oligosaccharide is transferred from the lipid to nascent proteins by oligosaccharyltransferases'
    - reference_id: file:genes/ASPFU/alg3/alg3-uniprot.txt
      record_section:
      - CC:FUNCTION
      supporting_text: 'is transferred from the lipid to nascent proteins'
