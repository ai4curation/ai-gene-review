  qualifier: involved_in
  supporting_entities:
  - UniProtKB:P38179
  - sgd:YBL082C
  - UniProtKB:Q9Y7I4
  - PomBase:SPAC7D4.06c.1:pep
  review:
    summary: >-
      The combined automated inference to dolichol-linked oligosaccharide
      biosynthesis is the conserved pathway context of ALG3.
    action: ACCEPT
    reason: >-
      UniProt assigns Q4WVG2 to dolichol-linked oligosaccharide biosynthesis by
      similarity to S. cerevisiae ALG3. This is the direct process for the
      accepted GO:0052925 activity, in which alg3 adds the first
      Dol-P-Man-derived mannose after the Man(5)GlcNAc(2)-PP-Dol intermediate is
      flipped to the ER lumen.
    supported_by:
