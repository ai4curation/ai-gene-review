      record_section:
      - CC:PATHWAY
      supporting_text: 'PATHWAY: Protein modification; protein glycosylation.'
- term:
    id: GO:0009101
    label: glycoprotein biosynthetic process
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - AGI_LocusCode:AT2G47760
  - FB:FBgn0011297
  - PANTHER:PTN000291297
  - PomBase:SPAC7D4.06c
  - SGD:S000000178
  - UniProtKB:Q92685
  review:
    summary: >-
      The PANTHER PTN000291297 IBD to glycoprotein biosynthetic process is
      sound, but it is a broad pathway-level description of alg3's direct
      lipid-linked oligosaccharide assembly role.
    action: KEEP_AS_NON_CORE
    reason: >-
      The family review accepts the PTN000291297 node for this broad process.
      Q4WVG2 is expected to contribute to glycoprotein biosynthesis by building
      the lipid-linked N-glycan precursor rather than by acting directly on a
      glycoprotein; the direct core process is dolichol-linked oligosaccharide
      biosynthesis.
    supported_by:
    - reference_id: file:interpro/panther/PTHR12646/PTHR12646-paint.tsv
      supporting_text: "PTHR12646\tPTN000291297\tGO:0009101\tP\tIBD\tfalse"
    - reference_id: file:genes/ASPFU/alg3/alg3-uniprot.txt
      record_section:
      - CC:FUNCTION
      supporting_text: 'Once assembled, the oligosaccharide is transferred from the lipid to nascent proteins by oligosaccharyltransferases'
- term:
    id: GO:0009101
    label: glycoprotein biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  supporting_entities:
