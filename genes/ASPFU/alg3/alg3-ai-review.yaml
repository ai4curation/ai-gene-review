    id: GO:0000030
    label: mannosyltransferase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR007873
  review:
    summary: >-
      The InterPro ALG3-family mapping to mannosyltransferase activity is correct
      but less informative than the accepted reaction-level
      Dol-P-Man:Man(5)GlcNAc(2)-PP-Dol alpha-1,3-mannosyltransferase activity.
    action: TOO_GENERAL
    reason: >-
      Q4WVG2 belongs to PTHR12646:SF0, the ALG3 Dol-P-Man alpha-1,3-mannosyltransferase
      family, and the family review scopes GO:0052925 to the whole family. The
      generic mannosyltransferase term is therefore redundant with the specific
      GO:0052925 rows retained below.
    supported_by:
    - reference_id: file:interpro/panther/PTHR12646/PTHR12646-entries.csv
      supporting_text: "Q4WVG2,\"Dol-P-Man:Man(5)GlcNAc(2)-PP-Dol alpha-1,3-mannosyltransferase\""
    - reference_id: file:interpro/panther/PTHR12646/PTHR12646-review.yaml
      supporting_text: 'scope: FAMILY_WIDE'
