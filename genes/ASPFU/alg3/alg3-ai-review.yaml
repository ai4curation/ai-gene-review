id: Q4WVG2
gene_symbol: alg3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:330879
  label: Aspergillus fumigatus Af293
description: >-
  alg3 encodes a multi-pass endoplasmic-reticulum membrane enzyme of the ALG3
  glycosyltransferase family. By homology to characterized ALG3 enzymes, it is
  predicted to catalyze the first Dol-P-Man-dependent lumenal mannose transfer in
  lipid-linked oligosaccharide biosynthesis, adding mannose in alpha-1,3 linkage
  to Man(5)GlcNAc(2)-PP-dolichol to form Man(6)GlcNAc(2)-PP-dolichol during
  assembly of N-glycan precursors for protein N-linked glycosylation.
existing_annotations:
