taxon:
  id: NCBITaxon:330879
  label: Aspergillus fumigatus Af293
description: 'erg3B encodes the major Aspergillus fumigatus Delta7-sterol 5(6)-desaturase, a multi-pass ER-membrane
  sterol enzyme for the late ergosterol pathway. erg3B deletion, alone or combined with erg3A loss, reduces ergosterol
  and accumulates non-C-5-desaturated sterols, whereas erg3A loss alone has little effect under the tested conditions.'
