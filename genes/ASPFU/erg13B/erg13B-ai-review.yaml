knowledge_gaps:
- gap_statement: The respective in-vivo contributions of the duplicated
    A. fumigatus HMG-CoA synthases erg13A and erg13B to mevalonate-pathway
    flux have not been established.
  boundary: Both Af293 proteins are in PANTHER:PTHR43323:SF2 and UniProt
    attributes the HMG-CoA synthase reaction to erg13A and erg13B, but Q4WXT8
    itself remains protein-existence level 3 with HMG-CoA synthase function
    inferred by homology rather than by direct assay.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: The answer would show whether erg13B is redundant with erg13A
    or has condition-specific flux through the sterol, nonsterol isoprenoid, or
    mevalonate-derived siderophore branches.
  resolution: Measure erg13A and erg13B expression, enzyme activity, and
    pathway flux in single and double perturbations across basal and
    siderophore-inducing growth conditions.
  provenance:
  - reference_id: file:interpro/panther/PTHR43323/PTHR43323-entries.csv
    supporting_text: |-
      Q4WBQ3,Hydroxymethylglutaryl-CoA synthase erg13A,protein,330879,Aspergillus fumigatus (strain ATCC MYA-4609 / CBS 101355 / FGSC A1100 / Af293),Aspergillus fumigatus (strain ATCC MYA-4609 / CBS 101355 / FGSC A1100 / Af293),erg13A,467,PTHR43323:SF2,HYDROXYMETHYLGLUTARYL-COA SYNTHASE,True
      Q4WXT8,Hydroxymethylglutaryl-CoA synthase erg13B,protein,330879,Aspergillus fumigatus (strain ATCC MYA-4609 / CBS 101355 / FGSC A1100 / Af293),Aspergillus fumigatus (strain ATCC MYA-4609 / CBS 101355 / FGSC A1100 / Af293),erg13B,460,PTHR43323:SF2,HYDROXYMETHYLGLUTARYL-COA SYNTHASE,True
  - reference_id: file:genes/ASPFU/erg13B/erg13B-uniprot.txt
    supporting_text: Erg13A and erg13B condense acetyl-CoA with acetoacetyl-CoA
      to form hydroxymethylglutaryl-CoA (HMG-CoA) (By similarity).
  - reference_id: file:genes/ASPFU/erg13B/erg13B-uniprot.txt
    supporting_text: 'PE   3: Inferred from homology;'
suggested_questions:
- question: Under which growth or infection-relevant conditions does A. fumigatus
    erg13B contribute measurably to mevalonate production, and is that
    contribution redundant with or distinct from erg13A?
suggested_experiments:
- hypothesis: erg13A and erg13B encode active HMG-CoA synthases with redundant
    or condition-biased contributions to A. fumigatus mevalonate production.
  description: Generate erg13A and erg13B single loss-of-function or
    conditional-knockdown strains and a double perturbation, then measure growth,
    ergosterol abundance, TAFC output, and rescue by mevalonate under iron-replete
    and iron-starved conditions.
  experiment_type: genetic perturbation plus sterol/siderophore flux assay
