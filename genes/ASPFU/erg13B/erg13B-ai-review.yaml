- term:
    id: GO:0006696
    label: ergosterol biosynthetic process
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000933803
  - SGD:S000004595
  review:
    summary: The PTN000933803 IBA is the PTHR43323 fungal sterol node seeded by
      yeast ERG13. Q4WXT8 is in the retained fungal HMG-CoA synthase subfamily,
      and the accepted PAINT node, rather than direct erg13B experiments, carries
      this process assertion. The reaction produces the early HMG-CoA intermediate
      used to make mevalonate for fungal sterol and isoprenoid biosynthesis.
    action: ACCEPT
    supported_by:
