      supporting_text: "PTHR43323\tPTN000933803\tGO:0006696\tP\tIBD\tfalse"
    - reference_id: PMID:22106303
      supporting_text: Mevalonate is a key metabolite in the biosynthesis of
        sterols such as fungal ergosterol and a variety of nonsterol isoprenoid
        derivatives
