taxon:
  id: NCBITaxon:330879
  label: Aspergillus fumigatus Af293
description: >-
  Aspergillus fumigatus erg25B encodes the second of two PTHR11863 C-4
  methylsterol oxidase paralogs in the ER late ergosterol pathway. Erg25B is a
  functional SMO, but deletion phenotypes and sterol profiles indicate a
  smaller or later contribution than Erg25A, with both paralogs providing
  partially compensatory C-4 demethylation capacity.
