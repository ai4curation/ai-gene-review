suggested_experiments:
- description: >-
    Conditionally deplete A. fumigatus alg14 and profile lipid-linked
    oligosaccharides to test whether loss of Alg14 blocks assembly at
    GlcNAc1-PP-dolichol, the step expected from the yeast Alg13/Alg14 transferase.
