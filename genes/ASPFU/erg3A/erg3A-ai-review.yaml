  review:
    summary: Inherited C-5 sterol-desaturase PAINT row for erg3A; unresolved because the only direct
      sterol-profile study found no apparent Erg3A contribution under the tested conditions.
    action: UNDECIDED
    reason: The activity term itself is superseded by GO:0050046 for Erg3/SC5D enzymes, but this A. fumigatus
      paralog should not be asserted as a Delta7-sterol C-5 desaturase without resolving the negative erg3A
      and erg3A erg3B mutant profiles.
    supported_by:
    - reference_id: PMID:16436696
      supporting_text: The lack of any obvious sterol composition alteration in the erg3A − strain implies
        that Erg3A might not be a C-5 sterol desaturase, although functional compensation by others enzymes
        (Erg3B and/or Erg3C) could not be ruled out.
