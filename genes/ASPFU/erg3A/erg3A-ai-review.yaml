taxon:
  id: NCBITaxon:330879
  label: Aspergillus fumigatus Af293
description: 'erg3A encodes one of three Aspergillus fumigatus Erg3-family Delta7-sterol 5(6)-desaturases. Erg3A
  is a predicted multi-pass ER-membrane sterol desaturase that is much less important than Erg3B under standard
  sterol-growth conditions; erg3A single and erg3A erg3B double mutants showed no stronger sterol-profile defect
  than erg3B loss alone in the cached direct study.'
