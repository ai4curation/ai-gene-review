id: Q4WEB8
gene_symbol: erg20
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:330879
  label: Aspergillus fumigatus Af293
description: >-
  erg20 (AFUA_5G02450; UniProt Q4WEB8) encodes the Aspergillus fumigatus farnesyl
  diphosphate synthase, a soluble FPP/GGPP-synthase-family trans-prenyltransferase
  in central isoprenoid metabolism. The enzyme performs the two Mg2+-dependent,
  head-to-tail condensations that convert dimethylallyl diphosphate and two
  isopentenyl diphosphate molecules first to geranyl diphosphate and then to
  (2E,6E)-farnesyl diphosphate, the C15 isoprenoid branch point feeding ergosterol
  and other sterol/non-sterol isoprenoids.
