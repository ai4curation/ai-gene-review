id: Q4W9V1
gene_symbol: erg6
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:330879
  label: Aspergillus fumigatus Af293
description: erg6 (AFUA_4G03630) encodes the major sterol C-24 methyltransferase of
  Aspergillus fumigatus, a SAM-dependent Erg6/SMT-family enzyme in the ergosterol
  biosynthesis pathway. In the Aspergillus pathway Erg6 methylates lanosterol to
  eburicol upstream of the Cyp51 sterol C14-demethylases; conditional repression
  of erg6 blocks ergosterol production, causes lanosterol accumulation, and is
  lethal in A. fumigatus, while tagged Erg6 localizes to lipid droplets in hyphae.
