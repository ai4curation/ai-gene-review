  - SGD:S000004467
  review:
    summary: PANTHER PAINT transfers sterol 24-C-methyltransferase activity from
      the eukaryotic SMT node PTN002226525. Q4W9V1 is in the fungal Erg6/SMT
      subfamily, and A. fumigatus Erg6 is the essential sterol C-24
      methyltransferase that converts lanosterol to eburicol. The clade placement
      and inherited activity class are correct; a new child term would capture the
      exact Aspergillus lanosterol-to-eburicol reaction.
    action: ACCEPT
    reason: >-
      PAINT places the activity at the correct ancestral node: Q4W9V1 is in the
      same PTHR44068:SF1 sterol C-24 methyltransferase subfamily as S. cerevisiae
      Erg6, S. pombe erg6, C. albicans Erg6, and Neurospora Erg-4. However,
      Aspergillus methylates lanosterol before CYP51, whereas budding-yeast Erg6
      methylates zymosterol. GO:0003838 is currently defined as the RHEA:21128
      zymosterol-to-fecosterol reaction, but PAINT uses it for the broader
      inherited sterol C-24 methyltransferase activity class. Retain the class-level
      term while proposing a lanosterol-specific child term for the Aspergillus
      RHEA:52652 reaction.
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: PANTHER:PTN002226525
        source_status: SUPPORTS_TRANSFER
        comment: >-
          PTN002226525 supports conserved sterol C-24 methyltransferase activity
          across fungal and plant SMT enzymes.
    supported_by:
    - reference_id: file:genes/ASPFU/erg6/erg6-uniprot.txt
      supporting_text: Reaction=lanosterol + S-adenosyl-L-methionine = eburicol
        + S-adenosyl-L-homocysteine + H(+)
