  review:
    summary: PANTHER PAINT transfers sterol 24-C-methyltransferase activity from
      the eukaryotic SMT node PTN002226525. Q4W9V1 is in the fungal Erg6/SMT
      subfamily, and A. fumigatus Erg6 is the essential sterol C-24
      methyltransferase that converts lanosterol to eburicol. The clade placement
      is correct, but the current GO term is scoped to the zymosterol-to-fecosterol
      reaction rather than the Aspergillus lanosterol-to-eburicol reaction.
    action: MODIFY
    reason: >-
      PAINT places the activity at the correct ancestral node: Q4W9V1 is in the
      same PTHR44068:SF1 sterol C-24 methyltransferase subfamily as S. cerevisiae
      Erg6, S. pombe erg6, C. albicans Erg6, and Neurospora Erg-4. However,
      Aspergillus methylates lanosterol before CYP51, while GO:0003838 is bound
      to RHEA:21128, zymosterol + S-adenosyl-L-methionine = fecosterol. A
      lanosterol 24-C-methyltransferase activity term equivalent to RHEA:52652
      would be the exact Aspergillus molecular-function term.
    proposed_replacement_terms:
    - id: NTR
      label: lanosterol 24-C-methyltransferase activity
