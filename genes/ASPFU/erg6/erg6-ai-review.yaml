proposed_new_terms:
- proposed_name: lanosterol 24-C-methyltransferase activity
  proposed_definition: >-
    Catalysis of the reaction: lanosterol + S-adenosyl-L-methionine = eburicol +
    S-adenosyl-L-homocysteine + H(+).
  justification: >-
    Aspergillus Erg6 catalyzes the RHEA:52652 lanosterol-to-eburicol reaction.
    GO:0003838 sterol 24-C-methyltransferase activity is the right parent but is
    currently defined as the budding-yeast zymosterol-to-fecosterol reaction
    RHEA:21128.
