proposed_new_terms:
- proposed_name: lanosterol 24-C-methyltransferase activity
  proposed_definition: >-
    Catalysis of the reaction: lanosterol + S-adenosyl-L-methionine = eburicol +
    S-adenosyl-L-homocysteine + H(+).
  justification: >-
    Aspergillus Erg6 is curated with the RHEA:52652 lanosterol-to-eburicol
    reaction, whereas the existing GO:0003838 sterol 24-C-methyltransferase
    activity term is defined as the budding-yeast zymosterol-to-fecosterol
    reaction RHEA:21128.
  proposed_parent:
    id: GO:0008757
    label: S-adenosylmethionine-dependent methyltransferase activity
  proposed_mappings:
  - predicate: skos:exactMatch
    target_term:
      id: RHEA:52652
      label: lanosterol + S-adenosyl-L-methionine = eburicol + S-adenosyl-L-homocysteine + H(+)
  supported_by:
  - reference_id: file:genes/ASPFU/erg6/erg6-uniprot.txt
    supporting_text: Reaction=lanosterol + S-adenosyl-L-methionine = eburicol
      + S-adenosyl-L-homocysteine + H(+)
suggested_questions:
- question: Does A. fumigatus Erg6 have a measurable ER-resident pool or ER-localized
    activity in addition to the lipid-droplet pool detected by Erg6-GFP?
- question: Should GO add a lanosterol 24-C-methyltransferase activity term, or
    broaden GO:0003838 to cover both the yeast zymosterol-to-fecosterol reaction
    and the Aspergillus lanosterol-to-eburicol reaction?
suggested_experiments:
- hypothesis: A. fumigatus Erg6 is active both at lipid droplets and at the ER.
  description: Tag endogenous Erg6 and quantify colocalization with lipid-droplet
    and ER markers during basal growth, erg6 repression, and azole stress; pair
    the imaging with subcellular fractionation and lanosterol-dependent 24-SMT
    activity measurements from matched fractions.
  experiment_type: subcellular localization and enzymatic activity assay
