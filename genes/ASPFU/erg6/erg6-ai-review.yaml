id: Q4W9V1
gene_symbol: erg6
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:330879
  label: Aspergillus fumigatus Af293
description: >-
  erg6 encodes the Aspergillus fumigatus Erg6/SMT-family sterol C-24
  methyltransferase. The enzyme catalyzes the S-adenosyl-L-methionine
  dependent methylation of lanosterol to form eburicol, placing it early in the
  filamentous-fungal route from lanosterol to ergosterol before Cyp51A/Cyp51B
  C-14 demethylation. Native-locus Erg6-GFP localizes to lipid droplets, and
  repression of erg6 depletes ergosterol-rich membrane domains, accumulates
  lanosterol, and impairs viability and hyphal growth.
