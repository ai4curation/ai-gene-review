suggested_questions:
- question: >-
    Does A. fumigatus Erg6 have a low-abundance or condition-specific ER pool in
    addition to its lipid-droplet pool?
- question: >-
    Does Smt1 retain weak sterol C-24 methyltransferase activity on a secondary
    substrate, or is Erg6 the only physiologically relevant C-24 SMT in
    A. fumigatus?
suggested_experiments:
- hypothesis: >-
    Q4W9V1 directly prefers lanosterol over zymosterol and other C-24-unmethylated
    sterols.
  description: >-
    Purify A. fumigatus Erg6 or assay membrane fractions from native and
    erg6-repressed strains with lanosterol, zymosterol, and related sterol
    acceptors, measuring SAM-dependent C-24 methylation products by GC-MS or
    LC-MS/MS.
  experiment_type: enzyme kinetics
- hypothesis: >-
    Erg6 traffics between ER and lipid droplets depending on sterol flux and
    azole stress.
  description: >-
    Image native Erg6-GFP together with ER and lipid-droplet markers during
    vegetative growth, erg6 repression, and triazole exposure.
  experiment_type: fluorescence microscopy
