- id: PMID:22106303
  title: Mevalonate governs interdependency of ergosterol and siderophore biosyntheses
    in the fungal pathogen Aspergillus fumigatus.
  findings:
  - statement: >-
      Mevalonate supply links ergosterol and triacetylfusarinine C siderophore
      biosynthesis in A. fumigatus.
    supporting_text: >-
      Consistent with mevalonate being a limiting prerequisite for TAFC biosynthesis,
      we observed increased expression of 3-hydroxy-3-methyl-glutaryl (HMG)-CoA
      reductase (Hmg1) under iron starvation
    reference_section_type: ABSTRACT
    full_text_unavailable: true
