  review:
    summary: >-
      IBA from PTN000781523, a plant peroxisomal PMK node seeded only by
      Arabidopsis AT1G31910. The PTHR31814 family review already marks this
      peroxisome node as needing pruning for the fungal PMK subfamily.
    action: REMOVE
    reason: >-
      PTN000781523 propagates a plant-lineage compartment to fungal Erg8 proteins;
      this is a compartment and taxon mismatch, not evidence that A. fumigatus erg8
      acts in peroxisomes.
    propagation_review:
      root_cause: PROPAGATION_BAD
