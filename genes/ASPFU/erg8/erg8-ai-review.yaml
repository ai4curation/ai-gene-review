  review:
    summary: >-
      IBA from PTN001274235, the fungal/plant GHMP phosphomevalonate kinase node
      seeded by Arabidopsis PMK and S. cerevisiae ERG8. Q4WV38 is in fungal
      PTHR31814:SF2, and the same phosphomevalonate kinase reaction is curated on
      the A. fumigatus Swiss-Prot record, so this is the core molecular function.
    action: ACCEPT
