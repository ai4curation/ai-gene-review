id: Q4WV38
gene_symbol: erg8
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:330879
  label: Aspergillus fumigatus Af293
description: >-
  erg8 (AFUA_5G10680) encodes the fungal GHMP-type phosphomevalonate kinase that
  phosphorylates (R)-5-phosphomevalonate with ATP to form (R)-5-diphosphomevalonate.
  This is the second kinase step of isopentenyl diphosphate formation from mevalonate
  and supplies prenyl diphosphate precursors for ergosterol biosynthesis in
  Aspergillus fumigatus.
