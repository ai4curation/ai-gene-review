      agrees with the predicted multi-pass topology.
    additional_reference_ids:
    - file:genes/ASPFU/alg10/alg10-uniprot.txt
    supported_by:
    - reference_id: file:genes/ASPFU/alg10/alg10-uniprot.txt
      record_section: ["CC:SUBCELLULAR LOCATION"]
