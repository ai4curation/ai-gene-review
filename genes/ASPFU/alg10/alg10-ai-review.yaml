    id: GO:0005783
    label: endoplasmic reticulum
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  supporting_entities:
  - AGI_LocusCode:AT5G02410
  - PANTHER:PTN000312712
  - RGD:708500
  - SGD:S000003459
  - UniProtKB:Q5I7T1
  review:
    summary: PAINT places ALG10-family enzymes in the endoplasmic reticulum.
    action: ACCEPT
    reason: >-
      Accept the PTN000312712 ER IBA. The PTHR12989 review judges this
      eukaryotic ALG10 node sound, and A. fumigatus alg10 is a non-diverged
      SF10 ALG10 member whose UniProt record places it at the ER membrane.
    additional_reference_ids:
    - file:interpro/panther/PTHR12989/PTHR12989-review.yaml
    - file:interpro/panther/PTHR12989/PTHR12989-paint.tsv
