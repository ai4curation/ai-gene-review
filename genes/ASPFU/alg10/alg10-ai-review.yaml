core_functions:
- description: >-
    Transfers glucose from dolichyl beta-D-glucosyl phosphate to
    Glc2Man9GlcNAc2-PP-dolichol, forming Glc3Man9GlcNAc2-PP-dolichol during
    ER-membrane lipid-linked oligosaccharide assembly.
  molecular_function:
    id: GO:0106073
    label: dolichyl pyrophosphate Glc2Man9GlcNAc2 alpha-1,2-glucosyltransferase activity
  directly_involved_in:
