- term:
    id: GO:0005789
    label: endoplasmic reticulum membrane
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: located_in
  supporting_entities:
  - UniProtKB:P50076
  review:
    summary: Manual transfer from yeast Die2 supports ER-membrane localization.
    action: ACCEPT
    reason: >-
      The S. cerevisiae Die2 donor is the PTHR12989 reference protein, and the
      A. fumigatus protein sits in the same fungal ALG10/DIE2 SF10 subfamily.
      The ER-membrane location is retained across reviewed ALG10 proteins.
    additional_reference_ids:
