id: Q4X162
gene_symbol: alg10
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:330879
  label: Aspergillus fumigatus Af293
description: >-
  alg10 encodes the Aspergillus fumigatus ortholog of the conserved ALG10
  dolichyl-phosphate-glucose glucosyltransferase. It is a multi-pass
  endoplasmic-reticulum membrane enzyme that adds the terminal glucose to
  Glc2Man9GlcNAc2-PP-dolichol, completing the lipid-linked oligosaccharide
  precursor used for protein N-linked glycosylation.
