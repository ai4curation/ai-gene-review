  - reference_id: file:genes/ASPFU/alg10/alg10-uniprot.txt
    record_section: ["CC:FUNCTION"]
    supporting_text: >-
      Glc(2)Man(9)GlcNAc(2)-PP-Dol to produce
      Glc(3)Man(9)GlcNAc(2)-PP-Dol.
