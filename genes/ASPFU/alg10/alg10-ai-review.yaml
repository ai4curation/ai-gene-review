      record_section: ["CC:SIMILARITY"]
      supporting_text: 'Belongs to the ALG10 glucosyltransferase family.'
- term:
    id: GO:0006487
    label: protein N-linked glycosylation
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - AGI_LocusCode:AT5G02410
  - FB:FBgn0052076
  - PANTHER:PTN000312712
  - PomBase:SPAC56F8.06c
  - SGD:S000003459
  - UniProtKB:Q5I7T1
  review:
    summary: PAINT places ALG10 in protein N-linked glycosylation.
    action: ACCEPT
    reason: >-
      Accept the PTN000312712 N-linked glycosylation IBA. Although this term
      is broader than LLO biosynthesis, Alg10 directly performs the terminal
      glucosylation step that completes the oligosaccharide donor used by
      oligosaccharyltransferase.
    additional_reference_ids:
