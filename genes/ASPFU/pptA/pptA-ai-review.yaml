id: Q4X1W0
gene_symbol: pptA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:330879
  label: Aspergillus fumigatus Af293
description: 'PptA is the cytosolic Sfp-type 4''-phosphopantetheinyl transferase
  of Aspergillus fumigatus. It transfers the phosphopantetheine arm of coenzyme
  A to carrier domains in alpha-aminoadipate reductase and nonribosomal peptide
  synthetase/polyketide synthase enzymes, activating the holo-carrier proteins
  required for lysine biosynthesis, siderophore production, DHN-melanin formation,
  and multiple secondary-metabolite pathways.'
