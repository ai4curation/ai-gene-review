- id: PMID:15719355
  title: A 4'-phosphopantetheinyl transferase mediates non-ribosomal peptide synthetase
    activation in Aspergillus fumigatus.
  findings:
  - statement: Recombinant A. fumigatus PptA phosphopantetheinylated an A. fumigatus
      Afpes1 thiolation-domain fragment in vitro and a C. albicans alpha-aminoadipate
      reductase in vitro.
    supporting_text: Detection of a 4'-phosphopantetheinylated peptide (SFSAMK)
      from this protein, by MALDI-TOF mass spectrometric analysis after coincubation
      of the 4'-phosphopantetheinyl transferase with the recombinant NRP synthetase
      fragment and acetyl CoA, confirms that it is competent to play a role in
      NRP synthetase activation in A. fumigatus.
    full_text_unavailable: true
- id: PMID:21195204
  title: Functional analysis of a mitochondrial phosphopantetheinyl transferase (PPTase)
    gene pptB in Aspergillus fumigatus.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed and UniProt confirm that this abstract-only paper is
      the source used for curated A. fumigatus pptA function and disruption
      phenotypes; full-text AspGD IMP/IDA rows are therefore retained but are
      corroborated with UniProt and direct 2017 PptA evidence where possible.
  findings:
  - statement: The abstract distinguishes pptA from the mitochondrial pptB enzyme
      by noting that pptA is required for lysine biosynthesis, secondary metabolism,
      and iron assimilation, whereas pptB is essential and mitochondrial.
    supporting_text: Unlike pptA, which is required for lysine biosynthesis, secondary
      metabolism, and iron assimilation, pptB is essential for viability.
    full_text_unavailable: true
- id: PMID:28720735
  title: A Nonredundant Phosphopantetheinyl Transferase, PptA, Is a Novel Antifungal
    Target That Directs Secondary Metabolite, Siderophore, and Lysine Biosynthesis
    in Aspergillus fumigatus and Is Critical for Pathogenicity.
  findings:
  - statement: PptA phosphopantetheinyl transferase activity was measured directly
      in vitro using recombinant PptA and AarA proteins and labeled CoA.
    supporting_text: The phosphopantetheinyl transferase activity of PptA was assessed
      in an FP assay. The assay monitored the transfer of the P-pant) from CoA
      to a target protein, AarA.
  - statement: A pptA null mutant lacked detectable LC-MS peaks for several major
      A. fumigatus secondary metabolites and the reconstituted isolate restored
      the parental metabolite profile.
    supporting_text: None of these peaks was identified in supernatant extracts
      from the pptA null isolate, which showed an apparent lack of secondary metabolite
      production.
  - statement: Loss of pptA caused auxotrophic requirements for lysine and the TAFC
