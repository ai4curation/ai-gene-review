taxon:
  id: NCBITaxon:330879
  label: Aspergillus fumigatus Af293
description: 'erg24B encodes one of two Aspergillus fumigatus ER-localized Erg24 Delta14-sterol reductases. Erg24B and Erg24A
  redundantly support the C-14 reduction branch of ergosterol biosynthesis: either paralog can maintain near-normal ergosterol
  synthesis alone, while combined Erg24 depletion blocks growth and accumulates a sterol intermediate.'
