- term:
    id: GO:0044804
    label: nucleophagy
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000132136
  - SGD:S000001917
  - SGD:S000003455
  - SGD:S000006021
  review:
    summary: >-
      Nucleophagy is seeded by S. cerevisiae Atg18, Atg21 and Hsv2, two of them inside the fungal
      Atg18 clade that holds atg18. Kept as a non-core, cargo-specific process.
    action: KEEP_AS_NON_CORE
    reason: >-
      Keep as non-core. The IBD is at the family root PTN000132136 (419 leaves) with three seeds,
      all S. cerevisiae. Atg18 (SGD:S000001917, IMP, PMID:22768199) and Atg21 (SGD:S000006021) join
      atg18 at the fungal node PTN000132223 (12 leaves); Hsv2 (SGD:S000003455) is in the other root
      child PTN000132247 (275 leaves). Atg21 and Hsv2 carry IMP rows for the child term piecemeal
      microautophagy of the nucleus. Seeds therefore sit in both root children, so the root
      placement is sound for this term, and the target is inside the seeded fungal clade. As the
      Atg18 ortholog of Aspergillus fumigatus it is expected to belong to the core autophagy
      machinery, and nothing on the protein argues against a role when nuclear material is the
      cargo. Nucleophagy has not been tested for this protein, which is not a ground for doubting
      the IBA. It is a cargo-specific process and not the phosphoinositide adaptor core, so the row
      is non-core.
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      source_entities:
      - source_id: PANTHER:PTN000132136
        source_label: PTN000132136
        source_status: SUPPORTS_TRANSFER
        comment: >-
          Two of the three budding yeast seeds, Atg18 and Atg21, join atg18 at the fungal node
          PTN000132223 (12 leaves); the third, Hsv2, is in the other root child.
- term:
    id: GO:0061723
    label: glycophagy
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - FB:FBgn0035850
  - PANTHER:PTN000132136
  review:
    summary: >-
      Glycophagy is seeded by Drosophila Atg18a, the fly member of the Atg18, WIPI1 and WIPI2 ortholog node
      that also holds atg18. Kept as a non-core, cargo-specific process.
    action: KEEP_AS_NON_CORE
    reason: >-
      Keep as non-core. The IBD is at the family root PTN000132136 (419 leaves) with one seed, Drosophila
      Atg18a (FB:FBgn0035850, IMP, PMID:24265594), whose evidence is a requirement for the core autophagy
      machinery in glycogen autophagy. The seed sits in the metazoan clade PTN000881175 (67 leaves) and atg18
      is in the sister fungal clade PTN000881190 (20 leaves); the two join at PTN000132139 (87 leaves, the
      Atg18, WIPI1 and WIPI2 node), so the target is inside the ortholog node that holds the seed. Nothing in
      the sources of this review describes glycogen autophagy in Aspergillus fumigatus or tests it. That is
      absence of a test and not a ground. atg18 is the Atg18 ortholog, the seed's evidence is for the shared
      core machinery, and the S. cerevisiae ATG18 review keeps the same row in this fungal clade because
      glycogen is delivered to the vacuole by autophagy in budding yeast. Nothing on atg18 argues against a
      role when glycogen is the cargo, and the pexophagy row of this review is kept on the same reasoning.
      Glycophagy is a cargo-specific process and not the phosphoinositide adaptor core, so the row is
      non-core. The root placement is too deep for the other root child (PTN000132247, the Hsv2 and WDR45
      side), which holds no seed; the PAINT fix is to move the IBD down to PTN000132139.
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      source_entities:
      - source_id: PANTHER:PTN000132136
        source_label: PTN000132136
        source_status: SUPPORTS_TRANSFER
        comment: >-
          The single fly seed and the target join at the Atg18, WIPI1 and WIPI2 node PTN000132139, below the
          root IBD.
