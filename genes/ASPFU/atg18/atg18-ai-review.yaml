- term:
    id: GO:0000422
    label: autophagy of mitochondrion
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - FB:FBgn0035850
  - PANTHER:PTN000132136
  - SGD:S000006021
  review:
    summary: >-
      Mitophagy is seeded by S. cerevisiae Atg21 and Drosophila Atg18a, and atg18 sits inside the
      fungal Atg18 clade that holds the yeast seed. Kept as a non-core, cargo-specific process.
    action: KEEP_AS_NON_CORE
    reason: >-
      Keep as non-core. The IBD is at the family root PTN000132136 (419 leaves) with two seeds, S.
      cerevisiae Atg21 (SGD:S000006021, IMP, PMID:19793921) and Drosophila Atg18a (FB:FBgn0035850,
      IMP rows for the child term mitophagy). atg18 joins the Atg21 seed at the fungal node
      PTN000132223 (12 leaves) and the fly seed at PTN000132139 (87 leaves), so it is inside the
      seeded clade on both sides. As the Atg18 ortholog of Aspergillus fumigatus it is expected to
      belong to the core autophagy machinery that the selective routes use, and nothing on the
      protein argues against a role when mitochondria are the cargo. Mitophagy has not been tested
      for this protein, which is not a ground for doubting the IBA. It is a cargo-specific process
      and not the phosphoinositide adaptor core, so the row is non-core. The root placement is too
      deep for the other root child (PTN000132247, the WDR45 and Hsv2 side), which holds no seed for
      this term.
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      source_entities:
      - source_id: PANTHER:PTN000132136
        source_label: PTN000132136
        source_status: SUPPORTS_TRANSFER
        comment: >-
          The yeast Atg21 seed and atg18 join at the fungal node PTN000132223 (12 leaves); the fly
          seed joins at PTN000132139 (87 leaves).
