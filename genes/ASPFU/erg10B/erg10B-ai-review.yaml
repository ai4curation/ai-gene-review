    label: mitochondrion
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: located_in
  supporting_entities:
  - ARBA:ARBA00026962
  review:
    summary: >-
      Wrong-paralog ARBA location. The mitochondrial A. fumigatus
      acetoacetyl-CoA thiolase is Erg10A in PTHR18919:SF156, whereas Erg10B
      sits in the cytosolic fungal SF165 branch where PAINT stops the ancestral
      mitochondrion assertion.
    action: REMOVE
    reason: >-
      Remove the ARBA mitochondrial transfer because Erg10B is the cytosolic
      ERG10 paralog. PAINT explicitly places an IRD for mitochondrion on the
      fungal cytosolic branch PTN001052717; A. fumigatus Erg10A is the
      mitochondrial SF156 paralog.
    supported_by:
    - reference_id: file:interpro/panther/PTHR18919/PTHR18919-paint.tsv
      supporting_text: "PTHR18919\tPTN001052717\tGO:0005739\tC\tIRD\ttrue\tPANTHER:PTN000432235\ttaxon:4751"
