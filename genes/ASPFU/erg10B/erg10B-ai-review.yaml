  label: Aspergillus fumigatus Af293
description: >-
  Aspergillus fumigatus erg10B encodes the cytosolic Erg10-family
  acetoacetyl-CoA thiolase in PTHR18919:SF165. The protein is a predicted
  cytosolic mevalonate-pathway acetyl-CoA acetyltransferase that forms
  acetoacetyl-CoA from acetyl-CoA, matching the fungal PAINT branch that feeds
  ergosterol biosynthesis.
