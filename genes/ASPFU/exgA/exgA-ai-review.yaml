description: >-
  Aspergillus fumigatus exgA encodes a secreted GH5 glucan
  exo-1,3-beta-glucosidase homolog. Its exact biochemical activity has not been
  tested in Af293, but its signal peptide, EC 3.2.1.58 assignment, and
  PTHR31297:SF1 placement support an extracellular role in fungal cell-wall
  beta-glucan degradation and remodeling.
