  - PomBase:SPBC1105.05.1:pep
  review:
    summary: >-
      This EnsemblFungi transfer imports the fission-yeast Exg1 septum
      localization from a beta-1,6-specific branch and is too specific for
      A. fumigatus exgA.
    action: REMOVE
    reason: >-
      S. pombe Exg1 accumulates at the septum during fission-yeast cytokinesis,
      but the same paper showed that S. pombe Exg1 is biochemically unlike the
      Saccharomyces/Candida exo-1,3 enzymes: it is an endo-beta-1,6 glucanase
      unable to degrade beta-1,3-glucans. A. fumigatus exgA is inferred as a
      secreted exo-1,3-beta-glucanase, and no Aspergillus evidence localizes the
      product specifically to septa rather than the extracellular wall region.
    supported_by:
    - reference_id: PMID:20852022
      supporting_text: Exg1 first started to accumulate as a ring surrounding the septa
    - reference_id: PMID:20852022
      supporting_text: >-
        In contrast to ScExg1 and CaXog1, the S. pombe Exg1 and Exg3 were
        highly specific for β(1,6)-glucans
    propagation_review:
      root_cause: PROPAGATION_BAD
