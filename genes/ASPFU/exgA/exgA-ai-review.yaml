    correctness: VERIFIED
    review_notes: >-
      Full-text cache; directly supports why S. pombe Exg1-specific
      beta-1,6-glucanase and septum annotations should not be projected onto A.
      fumigatus exgA.
  findings:
  - statement: >-
      S. pombe Exg1 localizes at septa during cytokinesis and is an
      endo-beta-1,6 glucanase rather than the exo-beta-1,3 glucanase represented
      by Candida Xog1 and Saccharomyces Exg1.
    supporting_text: >-
      In contrast to ScExg1 and CaXog1, the S. pombe Exg1 and Exg3 were highly
      specific for β(1,6)-glucans
- id: PMID:23616783
  title: β-1,3-glucan modifying enzymes in Aspergillus fumigatus.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full-text review of beta-1,3-glucan modifying enzymes in the A. fumigatus
      Af293 genome; it identifies AFUA_1G03600/AfExg1p as a GH5 exo-beta-1,3
      glucanase candidate with a signal peptide and notes that EXG1-4 had not
      been directly characterized in A. fumigatus.
  findings:
  - statement: >-
      The Af293 beta-1,3-glucanase survey listed AFUA_1G03600 as EXG1/AfExg1p,
      a 416-aa GH5 exo-beta-1,3-glucanase candidate with a signal peptide.
    supporting_text: >-
      AfExg1p and AfExg4p have a signal peptide in contrast to the others
      AfExg2p and AfExg3p.
- id: PMID:25825517
  title: A formin-nucleated actin aster concentrates cell wall hydrolases for cell fusion
    in fission yeast.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Full-text cache; directly explains the fission-yeast mating projection
      actin fusion focus that was over-transferred to A. fumigatus exgA by
      EnsemblFungi.
  findings:
  - statement: >-
      Fission-yeast type V myosins concentrate cell-wall hydrolases at a
      formin-nucleated actin fusion focus during mating cell fusion.
    supporting_text: >-
      Type V myosins are essential for fusion and concentrate cell wall
      hydrolases
