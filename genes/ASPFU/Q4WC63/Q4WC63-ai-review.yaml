description: AFUA_8G05580 encodes the Aspergillus fumigatus member of the fungal Ach1/CoaT acetyl-CoA hydrolase/transferase family. Its A. nidulans ortholog CoaT is an acyl-CoA:carboxylate CoA-transferase that transfers CoASH from succinyl-, propionyl-, and acetyl-CoA donors to acetate or related carboxylates and contributes to propionyl-CoA detoxification.
