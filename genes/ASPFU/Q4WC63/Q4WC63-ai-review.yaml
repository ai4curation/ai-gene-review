description: AFUA_8G05580 encodes an Aspergillus fumigatus member of the Ach1/CoaT acyl-CoA:carboxylate CoA-transferase family. PANTHER places it in the single-subfamily PTHR43609 family, and PAINT places it below fungal Ach1/CoaT nodes whose characterized members such as S. cerevisiae Ach1p and N. crassa Acu-8 act primarily as mitochondrial acetate CoA-transferases with minor acetyl-CoA hydrolase activity.
