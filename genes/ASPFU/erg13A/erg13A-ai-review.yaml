knowledge_gaps:
- gap_statement: The respective in-vivo contributions of the duplicated
    A. fumigatus HMG-CoA synthases erg13A and erg13B to mevalonate-pathway
    flux have not been established.
  boundary: >-
    Both Af293 proteins are in PANTHER:PTHR43323:SF2 and UniProt attributes the HMG-CoA synthase
    reaction to erg13A and erg13B, but the available evidence does not distinguish the two paralogs'
    expression, activity, or pathway flux. An OpenScientist run (kgap-erg13a-paralog-division)
    confirms that they cannot be distinguished functionally, and each of the three axes it was asked
    to test fails for a different reason. Catalytic integrity fails because both proteins are
    intact: every active-site and substrate-binding residue of the family is present in both and in
    register with the characterised yeast and human enzymes, so neither is a degenerate copy and
    that route to an answer is closed. Measured expression fails because exactly one published
    dataset resolves both loci and it moves them in the same direction. Requirement fails because it
    is empty: neither gene has ever been deleted, repressed or called essential, and no double
    perturbation has been attempted. A compartmental division of labour was already excluded by the
    companion run on the mitochondrial thiolase, which found neither paralogue mitochondrial, so
    that reading is not available either. What the run does establish is an asymmetry of rank,
    supported by three independent sequence-level lines the gap did not name, with erg13B the
    principal copy and erg13A the accessory one. The duplication is an ancestral Eurotiomycete split
    into two reciprocally monophyletic clades, the erg13B clade retained in all seven Eurotiomycetes
    sampled while the erg13A clade is absent from two of them. This gene sits inside the
    sub-telomeric 100 kb of its chromosome, 63 kb from the end, whereas erg13B sits 20.9-fold
    further from any chromosome end. And erg13B carries markedly stronger codon adaptation, 0.587 at
    the 96.2nd percentile against 0.454 at the 86.7th, which survives chromosome, GC3 and
    gene-length confound checks. The run then draws the distinction that governs the curation
    decision, and this review adopts it: rank is not division of labour. Codon bias indexes how much
    a gene is translated on average, chromosomal address predicts dispensability at the population
    level, and clade retention predicts that an erg13A-type gene is dispensable somewhere in the
    group; none of the three says which reaction either protein performs, and the reaction is
    identical in both. So no term assigning a branch of isoprenoid biosynthesis to one paralogue is
    supportable, and none is proposed. The experiment that would separate them is the
    double-perturbation design already used in this organism for the ERG11A and ERG11B pair: delete
    one paralogue, place the other under a repressible promoter, and score growth, ergosterol
    content and siderophore output under iron starvation and hypoxia. Verified here against both
    entries' own UniProt records, 467 residues for this protein and 460 for erg13B: the catalytic
    triads of both, Glu86, Cys118 and His259 here against Glu86, Cys120 and His263 in erg13B, all
    six positions confirmed, which is what closes the degenerate-copy route. Two identifiers the
    run's own validator reported as possibly fabricated were checked against PubMed and are real
    records directly on topic, an expression study of this organism during infection initiation and
    a hypoxia transcriptome and ChIP-seq study, so those were lookup failures rather than
    confabulations; this is the third run in this campaign where that flag behaved so. Not
    reproduced here: the phylogenetic clade analysis and its sign test, the chromosomal distance
    measurements, the codon-adaptation comparison and its bootstrap and confound checks, and the
    reading of the single expression dataset.
