- term:
    id: GO:0006084
    label: acetyl-CoA metabolic process
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:107592
  - PANTHER:PTN000222418
  - PomBase:SPAC4F8.14c
  - UniProtKB:P54868
  review:
    summary: >-
      Keep as non-core: the PTN000222418 PAINT node soundly places HMG-CoA
      synthases in acetyl-CoA metabolism, but this process term is broader than
      erg13A's direct activity.
    action: KEEP_AS_NON_CORE
    reason: >-
      Erg13A consumes acetyl-CoA and acetoacetyl-CoA to make HMG-CoA in the
      early mevalonate module, so it participates in acetyl-CoA metabolism. No
      more specific acetyl-CoA-metabolism term captures this substrate-consumer
      role, and acetyl-CoA metabolism is therefore peripheral rather than a core
      biological role of this HMG-CoA synthase.
    supported_by:
    - reference_id: file:interpro/panther/PTHR43323/PTHR43323-paint.tsv
      supporting_text: "PTHR43323\tPTN000222418\tGO:0006084\tP\tIBD\tfalse"
    - reference_id: file:genes/ASPFU/erg13A/erg13A-uniprot.txt
      record_section: ["CC:CATALYTIC ACTIVITY"]
      supporting_text: >-
        Reaction=acetoacetyl-CoA + acetyl-CoA + H2O =
        (3S)-3-hydroxy-3-methylglutaryl-CoA + CoA + H(+)
