suggested_questions:
- question: Under which growth or infection-relevant conditions does A. fumigatus
    erg13A carry mevalonate production, and is its contribution redundant with
    or distinct from erg13B?
suggested_experiments:
- hypothesis: erg13A and erg13B encode active HMG-CoA synthases with redundant
    or condition-biased contributions to A. fumigatus mevalonate production.
  description: Generate erg13A and erg13B single loss-of-function or
    conditional-knockdown strains and a double perturbation, then measure growth,
    ergosterol abundance, TAFC output, and rescue by mevalonate under iron-replete
    and iron-starved conditions.
  experiment_type: genetic perturbation plus sterol/siderophore flux assay
references:
- id: file:ASPFU/erg13A/erg13A-hypotheses/kgap-erg13a-paralog-division/openscientist.md
  title: OpenScientist analysis of the erg13A and erg13B division of labour
  findings:
  - statement: >-
      The paralogues cannot be distinguished functionally, and each axis fails differently: both
      proteins carry the complete catalytic set so neither is degenerate, only one published dataset
      resolves both loci and it moves them together, and no deletion, repression or essentiality call
      exists for either. Three sequence-level lines nevertheless establish a rank asymmetry, erg13B
      principal and erg13A accessory: an ancestral clade split in which the erg13A clade is lost in
      two of seven Eurotiomycetes, a sub-telomeric address for erg13A against one 20.9-fold further
      from any chromosome end for erg13B, and markedly stronger codon adaptation in erg13B surviving
      confound checks. Rank is not division of labour, and since the reaction is identical in both,
      no term assigning an isoprenoid branch to one paralogue is supportable.
    supporting_text: >-
      Rank is not the same as division of labour, and the distinction governs the curation
      decision.
  reference_review:
    relevance: HIGH
    correctness: UNVERIFIED
    review_notes: >-
      Verified against both entries' own UniProt records, 467 and 460 residues: the catalytic triads
      of both paralogues, Glu86/Cys118/His259 for erg13A and Glu86/Cys120/His263 for erg13B, all six
      positions confirmed, which is the finding that closes the degenerate-copy route. Two
      identifiers the run's own validator reported as possibly fabricated were checked against
      PubMed and are real, on-topic records, so those were lookup failures; this is the third run in
      this campaign where that flag behaved so, and it should not be read as a confabulation signal
      without a check. Not reproduced here: the phylogenetic clade analysis and sign test, the
      chromosomal distance measurements, the codon-adaptation comparison with its bootstrap and
      confound checks, and the reading of the single expression dataset. The run's own refusal to
      convert a rank asymmetry into a division of labour is the reason to credit its negative.
