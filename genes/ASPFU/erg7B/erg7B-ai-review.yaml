gene_symbol: erg7B
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:330879
  label: Aspergillus fumigatus Af293
description: Aspergillus fumigatus erg7B encodes a lanosterol synthase paralog, an oxidosqualene
  cyclase in the ergosterol pathway. The Swiss-Prot record places erg7B in the A. fumigatus
  ergosterol pathway and assigns the conserved RHEA:14621 reaction, and PANTHER places the
  protein in the heterogeneous PTHR11764 cyclase family on a branch that retains lanosterol
  synthase activity.
