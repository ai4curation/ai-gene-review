taxon:
  id: NCBITaxon:330879
  label: Aspergillus fumigatus Af293
description: erg4B encodes the Aspergillus fumigatus SF48 Delta24(24-1)-sterol reductase. Erg4B is a diverged ERG4/ERG24-family
  paralog that works with Erg4A at the ER to catalyze the final C-24(28) reduction of ergosterol biosynthesis; either copy
  can largely compensate for the other in single mutants.
