- id: PMID:26878695
  title: Mitogen activated protein kinases SakA(HOG1) and MpkC collaborate for Aspergillus
    fumigatus virulence.
  findings:
  - statement: MpkC::GFP translocates to the nucleus during osmotic and
      cell-wall stress.
    supporting_text: |-
      Both MpkC::GFP and SakA::GFP translocated to the
      nucleus upon osmotic stress and cell wall damage, with SakA::GFP showing a
      quicker response.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: MpkC and SakA collaborate genetically in osmotic, oxidative, and
      cell-wall stress responses.
    supporting_text: |-
      mutants were more sensitive to osmotic and oxidative stresses, and
      to cell wall damaging agents.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract cached; central A. fumigatus paper linking MpkC to
      SakA/HOG stress signaling and cytoplasm-nucleus relocalization.
