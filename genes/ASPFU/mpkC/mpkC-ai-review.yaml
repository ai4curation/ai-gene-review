gene_symbol: mpkC
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:330879
  label: Aspergillus fumigatus Af293
description: mpkC encodes a HOG1-subfamily mitogen-activated protein kinase in
  Aspergillus fumigatus. The protein cycles between the cytoplasm and nucleus
  during stress signaling, phosphorylates protein substrates as a MAP kinase,
  and collaborates with SakA in high-osmolarity-glycerol signaling, oxidative
  and cell-wall stress responses, and polyalcohol-carbon-source utilization.
