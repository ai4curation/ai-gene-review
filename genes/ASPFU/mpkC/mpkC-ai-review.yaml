- question: Which direct substrates account for MpkC-specific control of
    polyalcohol-carbon utilization, and how are they distinguished from the
    substrates shared with SakA during canonical HOG stress signaling?
  experts: []
- question: Does the SakA-MpkC physical association reflect a stable HOG-branch
    MAPK complex, stress-specific substrate recruitment, or transient pathway
    cross-regulation with the MpkA cell-wall-integrity cascade?
  experts: []
suggested_experiments:
- description: Compare MpkC phosphoproteomes from wild-type, kinase-dead mpkC,
    and complemented strains after sorbitol, mannitol, and oxidative stress to
    identify direct MpkC substrates that are independent of SakA.
- description: Use endogenously tagged MpkC and SakA with stress time courses,
    reciprocal co-immunoprecipitation, and kinase-dead alleles to test whether
    MpkC nuclear import and SakA binding require MpkC catalytic activation.
