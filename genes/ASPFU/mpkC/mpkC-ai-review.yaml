        comment: The PAINT placement is at the fungal stress-MAPK node rather
          than a cross-family similarity transfer; available A. fumigatus data
          support retention of oxidative-stress signaling in the SakA/MpkC
          branch.
    supported_by:
    - reference_id: PMID:25459537
      supporting_text: |-
        We concluded that
        MpkC is able to bypass SakA, and the two MAPKs redundantly regulate the
        conidia-related function of AtfA in A. fumigatus.
