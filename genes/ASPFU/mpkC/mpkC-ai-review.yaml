  review:
    summary: The AspGD IMP row is a direct A. fumigatus mutant phenotype
      showing that MpkC signaling is required for polyalcohol carbon-source use.
    action: ACCEPT
    reason: Reyes et al. deleted mpkC and found a strong, specific defect in
      growth and germination when sorbitol or mannitol was the sole carbon
      source, establishing that MpkC acts upstream of carbon utilization.
    supported_by:
    - reference_id: PMID:16998074
      supporting_text: we determined that the mpkC deletion mutants were unable
        to grow on minimal medium with sorbitol or mannitol as the sole carbon
        source.
