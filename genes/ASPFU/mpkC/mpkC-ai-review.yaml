- id: PMID:27706915
  title: Genome-wide transcriptome analysis of Aspergillus fumigatus exposed to
    osmotic stress reveals regulators of osmotic and cell wall stresses that are
    SakA(HOG1) and MpkC dependent.
  findings:
  - statement: Transcriptomic profiling supports independent and collaborative
      MpkC/SakA functions during transient osmotic stress.
    supporting_text: |-
