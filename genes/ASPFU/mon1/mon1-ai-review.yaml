  review:
    summary: PAINT places the conserved Mon1 contribution to Rab7/Ypt7
      guanyl-nucleotide exchange activity on the eukaryotic PTHR13027 node
      PTN000315021.
    action: ACCEPT
    reason: Accept. The contributes_to qualifier is important because Mon1 is a
      subunit of the Rab7/Ypt7-directed GEF module, not a standalone exchange
      factor. The broad PAINT node is consistent with yeast Mon1-Ccz1
      biochemical evidence and with Fusarium FgMon1 data showing Rab7
      interaction and rescue of mon1-mutant defects by constitutively active
      FgRab7.
    additional_reference_ids:
    - PMID:24413168
    - PMID:26657788
    supported_by:
    - reference_id: PMID:24413168
      supporting_text: Mon1-Ccz1 activity requires residues within the
        predicted longin domains of both subunits
    - reference_id: PMID:26657788
      supporting_text: constitutively activated FgRab7 could rescue the defects
        of the ΔFgmon1 mutant, indicating that FgMon1 likely is a GEF of FgRab7
    propagation_review:
      root_cause: NO_FAILURE_CORE
