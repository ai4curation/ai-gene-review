    supporting_text: Mon1 and Ccz1 were identified from a gene deletion library
      as mutants defective in the vacuolar import of aminopeptidase I (Ape1)
      via the cytoplasm to vacuole targeting (Cvt) pathway.
  - reference_id: PMID:26657788
