- term:
    id: GO:0035658
    label: Mon1-Ccz1 complex
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: part_of
  supporting_entities:
  - FB:FBgn0031640
  - PANTHER:PTN000315023
  - SGD:S000003092
  - UniProtKB:Q7L1V2
  - UniProtKB:Q86VX9
  - WB:WBGene00018321
  review:
    summary: PAINT places the Mon1-Ccz1 complex annotation at the opisthokont
      PTN000315023 ancestor with fungal, fly, nematode, and human experimental
      descendants.
    action: ACCEPT
    reason: Accept. Q4WHL1 is a canonical PTHR13027:SF7 Mon1-family protein
      under the opisthokont PAINT node, and S. cerevisiae experiments show that
      Mon1 and Ccz1 form a stable heterodimeric complex. The inference is less
      direct in filamentous ascomycetes because the Ccz1 partner is much more
      diverged than Mon1 and early standard BLAST searches failed to identify
      Aspergillus and Fusarium Ccz1 candidates; this is a reason to keep direct
      Aspergillus Mon1-partner validation as an open question, not to reject the
      PAINT complex call.
    additional_reference_ids:
    - PMID:12364329
    - PMID:32010467
    supported_by:
    - reference_id: PMID:12364329
      supporting_text: Subcellular fractionation and co-immunoprecipitation
        experiments confirm that Mon1 and Ccz1 physically interact as a stable
        protein complex termed the Ccz1-Mon1 complex.
    - reference_id: PMID:32010467
      supporting_text: However, the Ccz1 orthologs could not be found in the
        genome database of several filamentous fungi including Fusarium spp.,
        Aspergillus spp., and Penecillium spp
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: PANTHER:PTN000315023
        source_status: SUPPORTS_TRANSFER
        comment: Broad opisthokont PAINT node for Mon1-Ccz1 complex membership;
          the Af293 Mon1 protein is under this node, but direct pairing with a
          filamentous-fungal Ccz1 ortholog remains untested.
- term:
    id: GO:0016236
    label: macroautophagy
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  supporting_entities:
  - SGD:S000003092
  review:
    summary: Propose macroautophagy as the specific conserved autophagy route
      that uses the Mon1/Rab7 module in fungi.
    action: NEW
    reason: Macroautophagy is the specific autophagy branch in which Mon1
      performs a late route by enabling Rab7/Ypt7 activation and fusion of
      autophagosomes with vacuoles, rather than merely being required upstream
      of the process. S. cerevisiae MON1 is experimentally required for
      macroautophagy, and Fusarium FgMon1 directly supports conservation of
      this Mon1-dependent autophagosome-vacuole fusion role in filamentous
      ascomycetes.
    additional_reference_ids:
    - PMID:12364329
    - PMID:26657788
    supported_by:
    - reference_id: PMID:12364329
      supporting_text: The mon1 Δ and ccz1 Δ strains also displayed defects in
        autophagy and pexophagy, degradative pathways that share protein
        machinery and mechanistic features with the biosynthetic Cvt pathway.
    - reference_id: PMID:26657788
      supporting_text: We concluded that the fusion of autophagosomes and
        vacuoles was impaired in the ΔFgmon1 mutant.
