id: Q4WHL1
gene_symbol: mon1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:330879
  label: Aspergillus fumigatus Af293
description: mon1 encodes the Aspergillus fumigatus ortholog of the conserved
  fungal Mon1/SAND-family trafficking protein. As an intact PTHR13027:SF7 Mon1
  homolog, the protein is inferred to act on endosomal and fungal-type vacuole
  membranes, where Mon1-family proteins promote Rab7/Ypt7-dependent delivery and
  fusion of MVB, endocytic, Cvt, and autophagy cargo vesicles with the vacuole.
