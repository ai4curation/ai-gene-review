core_functions:
- description: Contributes to Rab7/Ypt7 guanyl-nucleotide exchange on endosomal
    and fungal-type vacuole membranes to promote late vesicle fusion with the
    vacuole during vacuolar protein targeting and autophagy.
  contributes_to_molecular_function:
