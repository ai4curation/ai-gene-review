      was impaired in the ΔFgmon1 mutant.
suggested_questions:
- question: Which A. fumigatus longin-domain protein is the functional Ccz1
    partner for Mon1, and does it form a stable Rab7/Ypt7-directed GEF complex
    with Q4WHL1 on fungal endolysosomal membranes?
  experts: []
- question: Is A. fumigatus Mon1 directly required for autophagy, endocytosis,
    and MVB-to-vacuole trafficking under infectious hyphal growth conditions, or
    are those functions only inferred from S. cerevisiae and other filamentous
    ascomycetes?
  experts: []
suggested_experiments:
- description: Endogenously tag A. fumigatus Mon1 and candidate Ccz1 orthologs
    and compare their localization with Rab7/Ypt7, late-endosomal, MVB, and
    fungal-vacuole markers during vegetative growth and autophagy induction.
- description: Delete or deplete mon1 in Af293 and assay vacuole morphology,
    FM4-64 endocytosis, MVB cargo delivery, and autophagosome-vacuole fusion,
    with rescue by wild-type Mon1 and GEF-interface mutant alleles.
