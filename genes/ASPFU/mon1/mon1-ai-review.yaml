  title: The Ccz1-Mon1 protein complex is required for the late step of multiple
    vacuole delivery pathways.
  findings:
  - statement: S. cerevisiae Mon1 and Ccz1 physically interact in a stable
      complex and are required at or before fusion of multiple vesicle classes
      with the vacuole.
    supporting_text: Subcellular fractionation and co-immunoprecipitation
      experiments confirm that Mon1 and Ccz1 physically interact as a stable
      protein complex termed the Ccz1-Mon1 complex.
    reference_section_type: ABSTRACT
    full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached; direct S. cerevisiae source evidence for
      the fungal PTN000989606 PAINT placement.
- id: PMID:24413168
  title: The Mon1-Ccz1 GEF activates the Rab7 GTPase Ypt7 via a longin-fold-Rab
    interface and association with PI3P-positive membranes.
  findings:
  - statement: S. cerevisiae Mon1 and Ccz1 both contribute longin-domain
      surfaces needed for Ypt7 nucleotide exchange.
    supporting_text: Mon1-Ccz1 activity requires residues within the predicted
      longin domains of both subunits
    reference_section_type: DISCUSSION
    full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached; establishes why the Mon1 subunit receives a
      contributes_to GEF annotation rather than an independent activity.
- id: PMID:26657788
  title: FgMon1, a guanine nucleotide exchange factor of FgRab7, is important for
    vacuole fusion, autophagy and plant infection in Fusarium graminearum.
  findings:
  - statement: Fusarium FgMon1 links a filamentous-ascomycete Mon1 protein to
      Rab7-dependent vacuole fusion and autophagy.
    supporting_text: We concluded that the fusion of autophagosomes and
      vacuoles was impaired in the ΔFgmon1 mutant.
    reference_section_type: DISCUSSION
    full_text_unavailable: false
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text cached; supports filamentous-fungal conservation but
      is not a direct assay of A. fumigatus Q4WHL1.
