  review:
    summary: The fungal PTN000989606 PAINT node places the fungal-type vacuole
      membrane location on the PTHR13027:SF7 Mon1 clade that contains A.
      fumigatus Q4WHL1.
    action: ACCEPT
    reason: Accept. This IBA follows a fungal PAINT node seeded by
      experimentally characterized S. cerevisiae MON1, rather than a pairwise
      transfer, and Q4WHL1 remains in the same fungal Mon1 subfamily as
      S. cerevisiae MON1, S. pombe mon1, C. albicans MON1, and other
      Aspergillus MonA proteins. Budding-yeast Mon1 localizes with Ccz1 on
      perivacuolar and vacuolar membranes, and Aspergillus nidulans and
      A. flavus monA mutants have abnormal vacuoles, supporting retention of
      the fungal-vacuole membrane call for Af293 mon1.
