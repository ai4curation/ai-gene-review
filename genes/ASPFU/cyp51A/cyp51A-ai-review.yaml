gene_symbol: cyp51A
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:330879
  label: Aspergillus fumigatus Af293
description: cyp51A encodes one of two Aspergillus fumigatus sterol 14-alpha-demethylase enzymes, heme-thiolate
  cytochrome P450s in the endoplasmic reticulum membrane that remove the 14alpha-methyl group from lanosterol
  or eburicol during the late fungal ergosterol biosynthesis pathway. Cyp51A is a major triazole target; point
  mutations, tandem promoter repeats, or overexpression of cyp51A can lower azole susceptibility while retaining
  the core demethylase activity.
