- id: PMID:35448585
  title: Protein Kinase A Regulates Autophagy-Associated Proteins Impacting Growth
    and Virulence of Aspergillus fumigatus.
  findings:
  - statement: >-
      RFP-tagged Atg8 expressed from the native atg8 locus relocalizes to
      punctate autophagosomal structures under carbon and nitrogen starvation.
    supporting_text: >-
      under carbon and nitrogen starvation (C/N-) conditions, Atg8 localized to
      punctate autophagosomal structures
    reference_section_type: RESULTS
  - statement: >-
      Deleting atg8 reduces A. fumigatus conidiation on glucose minimal medium.
    supporting_text: >-
      Deletion of Atg8 resulted in reduced conidiation on glucose minimal
      medium agar (GMM)
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed and PMC verified; directly reports A. fumigatus atg8 deletion and
      native-promoter RFP-Atg8 localization assays.
- id: PMID:39852455
  title: Roles of the Sec2p Gene in the Growth and Pathogenicity Regulation of
    Aspergillus fumigatus.
  findings:
  - statement: >-
      Sec2p positively regulates A. fumigatus rapamycin-induced autophagy and
      enhances cell-wall-integrity gene expression under autophagy-inducing
      conditions.
    supporting_text: >-
      Sec2p positively regulated the autophagy pathway to enhance the expression
      of CWI pathway genes in the presence of autophagy inducers
    reference_section_type: DISCUSSION
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Full-text 2025 A. fumigatus paper found in the update scan; relevant as
      newer pathway context but focused on Sec2p rather than atg8, so no seeded
      AfAtg8 GO row was changed from this regulator-level evidence.
- id: PMID:41407331
  title: Evaluating the Antifungal Potential of Autophagy-Related Protein 4 (ATG4)
    Inhibitors against Human Fungal Pathogens.
  findings:
  - statement: >-
      The study reconstituted A. fumigatus Atg4-mediated processing of an
      A. fumigatus Atg8 substrate in vitro, supporting conservation of fungal
      ATG4-ATG8 processing across pathogenic Aspergillus species.
    supporting_text: >-
      CnAtg4T (J9VN57), AfAtg4 (A0A9P9N7X1), and AnAtg4 (A2QY50) open reading
      frames (ORFs) were synthesized and cloned into pET28a expression vector
      (Twist Bioscience, USA), resulting in 6xHis-ATG4. For BRET-based
      substrates of ATG8s, the synthesized ORF fragments of CnAtg8 (P0CO54),
      AfAtg8 (B0XPW3), and AnAtg8 (G3XZT6)
    reference_section_type: METHODS
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Full-text 2025 study identified in the update scan; it uses recombinant
      A. fumigatus Atg4 and Atg8 proteins to test ATG4 inhibitors. The Atg8
      substrate is B0XPW3 from the A1163 background rather than Q4WJ27 from
      Af293, so this is same-species biochemical context rather than direct
      evidence for a seeded GOA row.
