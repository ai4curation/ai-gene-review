gene_symbol: atg8
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:330879
  label: Aspergillus fumigatus Af293
description: >-
  Aspergillus fumigatus atg8 encodes the single Atg8-family ubiquitin-like
  modifier. The Atg8 precursor is proteolytically matured to expose a
  C-terminal glycine and is conjugated to phosphatidylethanolamine, anchoring
  Atg8 on phagophore and autophagosome membranes where it supports
  autophagosome assembly, autophagosome maturation, starvation-induced
  autophagy, and selective autophagy pathways inferred from the conserved
  Atg8 branch.
