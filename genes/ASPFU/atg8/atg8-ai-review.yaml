core_functions:
- description: >-
    Mature AfAtg8 is conjugated to phosphatidylethanolamine on autophagosome
    membranes, providing the conserved Atg8 lipidation platform used for
    autophagosome assembly, autophagosome maturation, and selective autophagy.
