- id: PMID:26878695
  title: Mitogen activated protein kinases SakA(HOG1) and MpkC collaborate for Aspergillus
    fumigatus virulence.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-fetched abstract-only cache; directly supports SakA and MpkC as
      cooperating A. fumigatus HOG MAPKs with osmotic, oxidative, cell-wall,
      localization, MpkA-crosstalk, and virulence roles.
  findings:
  - statement: >-
      sakA deletion increased sensitivity to osmotic, oxidative, and cell-wall
      stresses, and SakA::GFP translocated to the nucleus during osmotic and
      cell-wall stress.
    supporting_text: >-
      The ΔsakA and the double ΔmpkC ΔsakA mutants were more sensitive to
      osmotic and oxidative stresses, and to cell wall damaging agents.
- id: PMID:27538790
  title: The Aspergillus fumigatus SchA(SCH9) kinase modulates SakA(HOG1) MAP kinase
    activity and it is essential for virulence.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full-text cache; links SchA/TOR stress signaling with SakA phosphorylation
      and SakA/MpkC-dependent osmotic regulation, and provides independent
      SakA::GFP localization evidence.
  findings:
  - statement: >-
      SchA modulates SakA phosphorylation and genetically interacts with SakA
      and MpkC during A. fumigatus osmotic-stress responses.
    supporting_text: >-
      Our results indicate that schA genetically interacts with sakA upon
      osmotic stress.
- id: PMID:27706915
  title: Genome-wide transcriptome analysis of Aspergillus fumigatus exposed to
    osmotic stress reveals regulators of osmotic and cell wall stresses that are
    SakA(HOG1) and MpkC dependent.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-fetched abstract-only cache; directly compares osmotic-stress
      transcriptomes in wild-type, sakA, mpkC, and double mutants and identifies
      SakA/MpkC-dependent regulators.
  findings:
  - statement: >-
      SakA and MpkC have both independent and collaborative roles in the
      transcriptional response to transient osmotic stress.
    supporting_text: >-
      Our results strongly indicate that MpkC and SakA have independent and
      collaborative functions during the transcriptional response to transient
      osmotic stress.
- id: PMID:30538182
  title: Protein Kinase A and High-Osmolarity Glycerol Response Pathways Cooperatively
    Control Cell Wall Carbohydrate Mobilization in Aspergillus fumigatus.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full-text cache; connects SakA/MpkC HOG signaling to PKA activity,
      glucose uptake, glycogen/trehalose metabolism, and carbohydrate supply for
      cell-wall remodeling.
  findings:
  - statement: >-
      HOG MAPKs SakA and MpkC cooperate with PKA signaling to control
      carbohydrate mobilization for A. fumigatus cell-wall construction.
    supporting_text: >-
