- id: PMID:24312504
  title: NikA/TcsC histidine kinase is involved in conidiation, hyphal morphology,
    and responses to osmotic stress and antifungal chemicals in Aspergillus fumigatus.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Full-text cache; characterizes an upstream histidine kinase that modulates
      SakA phosphorylation and SakA-dependent transcription during fungicide and
      osmotic signaling.
  findings:
  - statement: >-
      NikA/TcsC modulates the HOG pathway upstream of SakA, including
      fludioxonil-triggered SakA phosphorylation and SakA-dependent induction of
      stress genes.
    supporting_text: >-
      In contrast, in response to fludioxonil treatment, NikA was implicated in
      the phosphorylation of SakA MAPK and the transcriptional upregulation of
      catA, dprA, and dprB, which are regulated under the control of SakA.
- id: PMID:25459537
  title: The role of AtfA and HOG MAPK pathway in stress tolerance in conidia of
    Aspergillus fumigatus.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed-fetched abstract-only cache; supports partial redundancy between
      SakA and MpkC in conidial stress tolerance.
  findings:
  - statement: >-
      MpkC can bypass SakA in conidial stress-tolerance signaling, because the
      sakA mpkC double mutant disrupted conidial stress tolerance even though
      the sakA single mutant produced normal conidia.
    supporting_text: >-
      We investigated another MAPK, MpkC, in relation with SakA, and the double
