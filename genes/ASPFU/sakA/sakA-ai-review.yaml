- id: PMID:32743127
  title: Mitogen activated protein kinases (MAPK) and protein phosphatases are
    involved in Aspergillus fumigatus adhesion and biofilm formation.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Full-text cache; shows SakA, MpkC, and MpkA influence adhesion, biofilm
      formation, extracellular matrix, and cell-surface organization.
  findings:
  - statement: >-
      Loss of SakA, MpkC, or MpkA altered A. fumigatus cell-surface and
      extracellular-matrix features during biofilm formation and reduced
      adherence.
    supporting_text: >-
      The loss of the MAP kinases MpkA, MpkC and SakA had an impact on the cell
      surface and the ECM during biofilm formation and reduced the adherence of
      A. fumigatus to polystyrene and fibronectin-coated plates.
suggested_questions:
- question: >-
    Which SakA and MpkC substrates and transcription factors are direct
    effectors for the A. fumigatus cell-wall, biofilm, and carbohydrate-storage
    responses downstream of the HOG cascade?
- question: >-
    Does SakA directly phosphorylate PkaR or other PKA-pathway components to
    mobilize glycogen and trehalose during osmotic and cell-wall stress?
suggested_experiments:
- description: >-
    Combine SakA analog-sensitive or kinase-dead alleles with phosphoproteomics
    after sorbitol and Congo red stress to distinguish direct SakA substrates
    from secondary HOG-dependent transcriptional changes.
- description: >-
    Mutate candidate SakA-dependent PkaR phosphorylation sites and assay PKA
    release, glycogen and trehalose mobilization, chitin/glucan exposure, and
    stress survival to test the proposed HOG-PKA coupling mechanism.
