- id: PMID:25597841
  title: High osmolarity glycerol response PtcB phosphatase is important for Aspergillus
    fumigatus virulence.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed-fetched abstract-only cache; places the PtcB phosphatase in the
