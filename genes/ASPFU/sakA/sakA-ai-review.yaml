- id: PMID:30692984
  title: The AGC Kinase YpkA Regulates Sphingolipids Biosynthesis and Physically
    Interacts With SakA MAP Kinase in Aspergillus fumigatus.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Full-text cache; adds a SakA interaction with the AGC kinase YpkA at the
      sphingolipid, CWI, and HOG pathway interface.
  findings:
  - statement: >-
      The AGC kinase YpkA genetically interacts with A. fumigatus MAPKs and
      physically interacts with SakA.
    supporting_text: >-
      Genetic analyzes showed that ypkA genetically interacts with the MAP
