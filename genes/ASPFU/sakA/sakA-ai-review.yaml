- id: PMID:16702099
  title: The role of the sakA (Hog1) and tcsB (sln1) genes in the oxidant adaptation
    of Aspergillus fumigatus.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-fetched abstract-only cache; directly supports SakA's role in
      A. fumigatus oxidant adaptation and growth.
  findings:
  - statement: >-
      Deletion of sakA reduced growth and increased sensitivity to hydrogen
      peroxide, menadione, and SDS.
    supporting_text: >-
      Compared to the wild type strain (Wt), growth of sakA (sakAtriangle up)
      mutant was reduced, and growth inhibition was increased when H(2)O(2),
      menadione, or SDS was added to the media.
- id: PMID:16998074
  title: Novel mitogen-activated protein kinase MpkC of Aspergillus fumigatus is required
    for utilization of polyalcohol sugars.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Full-text cache; MpkC-focused study that includes sakA as the related HOG
      MAPK and compares sakA and mpkC transcription under hypertonic and
      oxidative stresses.
  findings:
  - statement: >-
      sakA and mpkC showed distinct transcriptional responses after hypertonic
      and oxidative stresses, supporting partly separable signaling by the two
      related HOG MAPKs.
    supporting_text: >-
      To further investigate whether mpkC may share functions with sakA , we
      examined changes in sakA and mpkC mRNA levels by qRT-PCR following
      hypertonic shock (1 M KCl) and oxidative stress (H 2 O 2 ).
- id: PMID:22678624
  title: HOG-MAPK signaling regulates the adaptive responses of Aspergillus fumigatus
