- id: PMID:31134001
  title: Aspergillus fumigatus High Osmolarity Glycerol Mitogen Activated Protein
    Kinases SakA and MpkC Physically Interact During Osmotic and Cell Wall Stresses.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full-text cache; directly maps SakA/MpkC interactomes under osmotic and
      cell-wall stress and validates SakA-MpkC, SakA-MpkA, and SakA-PtcB
      associations.
  findings:
  - statement: >-
      SakA and MpkC physically associate upon osmotic and cell-wall stresses,
