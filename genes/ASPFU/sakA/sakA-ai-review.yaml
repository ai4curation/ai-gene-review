id: Q4WSF6
gene_symbol: sakA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:330879
  label: Aspergillus fumigatus Af293
description: >-
  SakA is a Hog1/Sty1-family mitogen-activated protein kinase in Aspergillus
  fumigatus that acts with the related MAPK MpkC in the high-osmolarity glycerol
  stress-response pathway. SakA is activated by environmental stresses,
  shuttles between the cytoplasm and nucleus under osmotic and cell-wall stress,
  and regulates transcriptional, cell-wall, carbohydrate-mobilization, oxidative,
  and biofilm responses that support adaptation to hostile growth conditions.
core_functions:
- description: >-
    Hog1-family MAP kinase that relays osmotic and oxidative stress signals in
    the fungal HOG/stress-activated MAPK cascade and shuttles between cytoplasm
    and nucleus during stress adaptation.
  molecular_function:
    id: GO:0004707
    label: MAP kinase activity
  directly_involved_in:
  - id: GO:0051403
    label: stress-activated MAPK cascade
  - id: GO:0007231
    label: osmosensory signaling pathway
  - id: GO:0034599
    label: cellular response to oxidative stress
  locations:
  - id: GO:0005737
    label: cytoplasm
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:26878695
    supporting_text: >-
      Here, we investigated which stress responses were influenced by the MpkC
      and SakA mitogen-activated protein kinases of the high-osmolarity glycerol
      (HOG) pathway in the fungal pathogen Aspergillus fumigatus.
  - reference_id: PMID:27706915
    supporting_text: >-
      A. fumigatus MpkC and SakA, orthologues of the Saccharomyces cerevisiae
      Hog1p, constitute the primary regulator of the hyperosmotic stress
      response.
  - reference_id: PMID:16702099
    supporting_text: >-
      Compared to the wild type strain (Wt), growth of sakA (sakAtriangle up)
      mutant was reduced, and growth inhibition was increased when H(2)O(2),
      menadione, or SDS was added to the media.
