suggested_questions:
- question: Is the S. cerevisiae lipid-droplet Erg27 localization conserved in Aspergillus fumigatus, or is A. fumigatus erg27 restricted to the ER C-4 demethylation complex?
  experts: []
- question: Does A. fumigatus Erg27 also stabilize oxidosqualene cyclase Erg7 at lipid droplets, as C. albicans
    Erg27 and budding-yeast Erg27 do?
  experts: []
suggested_experiments:
- description: Delete or repress A. fumigatus erg27 and profile sterols by GC-MS to distinguish accumulation of
    3-keto sterol C-4 demethylation intermediates from squalene or oxidosqualene signatures that would report loss
    of Erg7-dependent cyclization.
  experiment_type: mutant phenotype analysis
