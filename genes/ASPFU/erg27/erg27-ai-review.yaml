- id: file:genes/ASPFU/erg27/erg27-uniprot.txt
  title: UniProt flat file for A. fumigatus erg27
  findings:
  - statement: Q4WQ42 is A. fumigatus erg27 and belongs to PTHR43647:SF1.
    record_section: ["DR:PANTHER"]
    supporting_text: 'DR   PANTHER; PTHR43647:SF1; 3-KETO-STEROID REDUCTASE ERG27; 1.'
  - statement: UniProt describes Q4WQ42 as the Erg27 catalytic subunit of the C-4 demethylation complex and places
      it at the ER membrane and lipid droplet by similarity to budding-yeast Erg27.
    record_section: ["CC:FUNCTION"]
    supporting_text: Erg27 is a catalytic component of the C-4
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: The record supports the orthology, ER and lipid-droplet localization statements, but the CC:FUNCTION
      lead sentence incorrectly calls Erg27 a sterol-C4-methyl oxidase.
    source_defects:
    - defect_type: WRONG_STATEMENT
      resource: UNIPROT
      record: UniProtKB:Q4WQ42
      slot: CC:FUNCTION
      requested_change: CHECK
      asserted_value: Sterol-C4-methyl oxidase; part of the third module of ergosterol biosynthesis pathway
      cause: UNKNOWN
      confidence: CONFIRMED
      explanation: The Q4WQ42 FUNCTION comment opens by calling Erg27 a sterol-C4-methyl oxidase, but sterol-C4-methyl
        oxidase is Erg25; the same UniProt comment later correctly lists Erg25A/Erg25B as C-4 methylsterol oxidases,
        Erg26 as the dehydrogenase, and Erg27 as the 3-keto-steroid reductase. Request checking the lead wording while
        retaining the rest of the Erg27 C-4 demethylation-complex description.
      supported_by:
      - reference_id: file:genes/ASPFU/erg27/erg27-uniprot.txt
      report_status: NOT_REPORTED
