- term:
    id: GO:0045047
    label: protein targeting to ER
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:P15367
  - sgd:YIR022W
  review:
    summary: >-
      Protein targeting to ER is an upstream signal-recognition and targeting
      process, not the proteolytic signal-peptide removal catalyzed by Sec11.
    action: REMOVE
    reason: >-
      Sec11 executes the post-targeting signal peptide cleavage step within the
      ER signal peptidase complex. Its substrate signal peptides direct
      precursors to the ER; Sec11 removes those peptides after targeting and
      translocation, so the EnsemblFungi transfer overstates Sec11's role.
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - ROLE_CONFLATION
      source_entities:
      - source_id: UniProtKB:P15367
        source_label: Saccharomyces cerevisiae SEC11
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          The yeast source is the orthologous catalytic subunit, but this
          process term captures the upstream targeting role of the signal
          sequence rather than Sec11's cleavage step.
