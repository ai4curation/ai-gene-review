id: Q4WYF4
gene_symbol: sec11
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:330879
  label: Aspergillus fumigatus Af293
description: >-
  Sec11 is the catalytic subunit of the Aspergillus fumigatus endoplasmic
  reticulum signal peptidase complex. It is a type II ER membrane protease in
  the peptidase S26B family and cleaves N-terminal signal peptides from
  secretory-pathway precursor proteins, including the cell-wall
  1,3-beta-glucanosyltransferase Gel1.
existing_annotations:
- term:
    id: GO:0004252
    label: serine-type endopeptidase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR019533
  - InterPro:IPR019756
  review:
    summary: >-
      InterPro identifies Sec11 as a signal peptidase I/S26 catalytic subunit,
      and the exact activity is signal peptidase activity rather than a generic
      serine endopeptidase call.
    action: MODIFY
    reason: >-
      The S26-family active-site signatures support proteolytic Sec11 function,
      but A. fumigatus AfSec1/sec11 has target-specific support for signal
      peptidase activity on Gel1 and GO:0009003 is already asserted in GOA. The
      InterPro row should therefore be refined to signal peptidase activity.
    proposed_replacement_terms:
    - id: GO:0009003
      label: signal peptidase activity
    additional_reference_ids:
    - PMID:36657388
    supported_by:
    - reference_id: PMID:36657388
      supporting_text: >-
        These results suggest that AfSec1 exerts signal peptidase activity on
        its target Gel1 and has an important role in fungal pathogenesis.
