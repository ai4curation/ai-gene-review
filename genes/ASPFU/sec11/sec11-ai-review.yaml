- term:
    id: GO:0009003
    label: signal peptidase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - ARBA:ARBA00098390
  - EC:3.4.21.89
  review:
    summary: >-
      The EC/ARBA electronic annotation matches Sec11's experimentally supported
      signal peptidase activity.
    action: ACCEPT
    reason: >-
      AfSec1/sec11 promoter depletion caused accumulation of nonprocessed Gel1,
      while mature Gel1 was restored in wild-type and promoter-complemented
      strains, directly supporting signal peptide cleavage by A. fumigatus
      Sec11.
    additional_reference_ids:
    - PMID:36657388
    supported_by:
    - reference_id: PMID:36657388
      supporting_text: >-
        The nonprocessed form of Gel1 was identified in the AfSec1-ΔP strain,
        which lacked the promoter, but mature forms of Gel1 were found in the
        wild-type and in AfSec1-ΔP/P, which was the promoter complementation
        strain.
