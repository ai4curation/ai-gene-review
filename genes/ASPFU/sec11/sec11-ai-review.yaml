- id: PMID:36657388
  title: AfSec1 is a signal peptidase and removes signal peptides of 1,3-β-glucanosyltransferases
    in Aspergillus fumigatus.
  findings:
  - statement: >-
      A. fumigatus AfSec1/sec11 is required for normal proteolytic removal of
      the Gel1 signal peptide.
    supporting_text: >-
      The nonprocessed form of Gel1 was identified in the AfSec1-ΔP strain,
      which lacked the promoter, but mature forms of Gel1 were found in the
      wild-type and in AfSec1-ΔP/P, which was the promoter complementation
      strain.
    reference_section_type: ABSTRACT
  - statement: >-
      Kim and colleagues concluded that AfSec1 has signal peptidase activity on
      Gel1 in A. fumigatus.
    supporting_text: >-
      These results suggest that AfSec1 exerts signal peptidase activity on its
      target Gel1 and has an important role in fungal pathogenesis.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-cached abstract for the direct A. fumigatus AfSec1/sec11 paper;
      the abstract reports Gel1 processing defects after AfSec1 promoter
      deletion and rescue by promoter complementation.
