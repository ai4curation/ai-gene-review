  label: Aspergillus fumigatus Af293
description: >-
  Sec2 is an Aspergillus fumigatus Sec2-family Rab guanine nucleotide exchange
  factor in the conserved fungal exocytic Rab cascade. By homology to fungal
  Sec2 proteins it is expected to activate the Sec4-family post-Golgi Rab at
  polarized hyphal tips, and deletion of the gene slows colony growth, causes
  swollen hyphal tips, alters autophagy homeostasis and cell-wall-stress resistance,
  and attenuates virulence in a mouse infection model.
