- question: >-
    Does A. fumigatus Sec2 directly activate Sec4 at hyphal tips, and how does
    the conserved exocytic Rab cascade intersect with autophagosome maturation
    and cell-wall-integrity signaling?
  experts: []
suggested_experiments:
- description: >-
    Live-image Sec2-GFP with Sec4 and Spitzenkorper or secretory-vesicle markers
    to test whether A. fumigatus Sec2 localizes to hyphal-tip exocytic vesicles.
- description: >-
    Assay purified A. fumigatus Sec2 against the candidate Sec4-family Rab in
    vitro to confirm the direct physiological nucleotide-exchange substrate.
