  - PomBase:SPAC23C4.10
  review:
    summary: PAINT places Sec2 active localization at fungal cell tips on node
      PANTHER:PTN001024876, using Candida and fission-yeast long-Sec2 sources.
    action: ACCEPT
    reason: Appropriate transfer to this filamentous fungus. Aspergillus Sec2
      is the long Sec2/Rabin3-family member expected to act in post-Golgi
      secretion toward polarized hyphal tips; unlike budding yeast, A.
      fumigatus uses true cell tips as the major vegetative growth sites.
    supported_by:
