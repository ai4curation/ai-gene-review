taxon:
  id: NCBITaxon:330879
  label: Aspergillus fumigatus Af293
description: sec2 encodes the long Sec2/Rabin3-family Rab guanine nucleotide
  exchange factor of Aspergillus fumigatus. Orthology to characterized fungal
  Sec2 proteins supports a conserved role in activating Sec4/Rab8-family
  exocytic Rabs at hyphal tips, and sec2 disruption perturbs hyphal morphology,
  autophagy markers, cell-wall stress responses, and virulence in a mouse
  infection model.
