  review:
    summary: PAINT places generic Rab guanine-nucleotide exchange activity on
      the Opisthokonta Sec2/Rabin3 node PANTHER:PTN000374167.
    action: ACCEPT
    reason: Correct conserved activity. A. fumigatus Sec2 falls in the same
      PTHR14430:SF0 long Sec2 branch as S. cerevisiae SEC2, S. pombe sec2,
      and C. albicans SEC2, rather than the short sporulation-specific Spo13
      branch.
