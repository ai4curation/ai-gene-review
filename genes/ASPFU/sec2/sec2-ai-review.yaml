- id: PMID:39852455
  title: Roles of the Sec2p Gene in the Growth and Pathogenicity Regulation of
    Aspergillus fumigatus.
  findings:
  - statement: Liu et al. identified AFUA_3G06430 as the A. fumigatus Sec2p-encoding
      locus and then generated a directed deletion strain for phenotypic assays.
    supporting_text: the T-DNA disrupted the AFUA_3G06430 gene, which encodes the GDP/GTP
      exchange factor Sec2p
    reference_section_type: RESULTS
  - statement: A. fumigatus sec2 deletion causes hyphal-tip morphology defects but
      has not been paired with direct Sec2 localization or GEF assays in this species.
    supporting_text: The results showed that compared with the wild-type strain,
      the tips of the hyphae of the Δsec2p strain were swollen, and the number of
      hyphal branches and septa increased
    reference_section_type: RESULTS
  - statement: The sec2 deletion has pleiotropic autophagy, cell-wall-stress and
      infection phenotypes that are downstream of the conserved Sec2 activity rather
      than direct evidence for additional core activities.
    supporting_text: Unlike the wild type, the ΔSec2p strain showed strong resistance
      to cell wall stress.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Full text verified. The paper directly deletes and complements A.
      fumigatus AFUA_3G06430/sec2 and establishes growth, hyphal-morphology,
      autophagy, cell-wall-stress, and virulence phenotypes, but it does not
      directly assay nucleotide exchange or Sec2 localization.
