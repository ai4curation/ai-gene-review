    label: S-adenosyl-L-methionine
proposed_new_terms: []
suggested_questions:
- question: >-
    Does A. fumigatus rmt2 monomethylate Aspergillus ribosomal protein L12 at
    the conserved arginine residue, and are any additional protein substrates
    present in filamentous fungi?
- question: >-
    Does rmt2 deletion perturb A. fumigatus 60S subunit maturation,
    translational fidelity, stress resistance, or virulence-associated growth?
suggested_experiments:
- hypothesis: >-
    AFUA_2G09080/rmt2 is the methyltransferase for the conserved Rpl12
    N5-methylarginine mark in A. fumigatus.
  description: >-
    Delete or catalytically inactivate rmt2 in Af293, assay Rpl12 arginine
    methylation by targeted mass spectrometry, and complement the mutant with
    wild-type and SAM-binding-site mutant alleles.
- hypothesis: >-
    Loss of Rpl12 methylation perturbs ribosome performance in A. fumigatus.
  description: >-
    Compare wild-type, rmt2-null and complemented strains in polysome profiling,
    stop-codon readthrough and programmed frameshifting reporters, oxidative and
    heat-stress growth, and in vivo infection assays.
