- id: PMID:11856739
  title: Yeast ribosomal protein L12 is a substrate of protein-arginine methyltransferase
    2.
  findings:
  - statement: >-
      Budding-yeast Rmt2 methylates ribosomal protein L12 at Arg67 to form
      delta-N-monomethylarginine.
    supporting_text: >-
      Using synthetic peptides, recombinant L12, and
      its mutant as substrates, we pinpointed Arg(67) on ribosomal protein L12 as the
      methyl acceptor
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified S. cerevisiae RMT2 biochemical paper that experimentally
      grounds the SGD seed used by the fungal PTN001285370 PAINT
      protein-arginine N5-methyltransferase IBD and the automatic transfers from
      budding-yeast Rmt2.
- id: PMID:26801560
  title: 'Ribosomal protein methyltransferases in the yeast Saccharomyces cerevisiae:
    Roles in ribosome biogenesis and translation.'
  findings:
  - statement: >-
      Budding-yeast rmt2 deletion increased stop-codon readthrough in
      translational-fidelity reporter assays.
    supporting_text: >-
      Loss of each of the ten ribosomal protein methyltransferases resulted in
      increased readthrough of the UAA and UAG stop codons
  - statement: >-
      The same study found that rmt2 deletion caused a 60S subunit deficit and
      left the causal relationship between ribosome-biogenesis and
      translational-fidelity phenotypes unresolved.
    supporting_text: >-
      Like Hpm1-deficient cells, loss of Rkm1, Ntm1, Rmt1, or Rmt2 resulted in
      a deficit of 60S subunits
  - statement: >-
      The authors explicitly treated the reporter defects as potentially
      secondary to altered ribosome biogenesis.
    supporting_text: >-
      It is unclear if these translational fidelity phenotypes are caused by
      the ribosome biogenesis defects in the methyltransferase mutants.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified ribosomal-protein methyltransferase paper. It directly
      supports the S. cerevisiae RMT2 deletion phenotype behind the transferred
