core_functions:
- description: >-
    A. fumigatus rmt2 is inferred to catalyze S-adenosyl-L-methionine-dependent
    N5/delta methylation of peptidyl-arginine residues. It belongs to the fungal
    Rmt2 clade that inherited protein arginine N5-methyltransferase activity
    from the experimentally characterized budding-yeast enzyme, and is not in
    the vertebrate GAMT branch of PTHR32379.
  molecular_function:
    id: GO:0019702
    label: protein arginine N5-methyltransferase activity
  supported_by:
  - reference_id: GO_REF:0000033
  - reference_id: file:interpro/panther/PTHR32379/PTHR32379-paint.tsv
    supporting_text: |-
      PTHR32379	PTN001285370	GO:0019702	F	IBD	false	SGD:S000002873	taxon:4751	20170228
  - reference_id: PMID:11856739
    supporting_text: >-
      Using synthetic peptides, recombinant L12, and
      its mutant as substrates, we pinpointed Arg(67) on ribosomal protein L12 as the
      methyl acceptor
  substrates:
