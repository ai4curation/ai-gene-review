- term:
    id: GO:0045903
    label: positive regulation of translational fidelity
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q03305
  - sgd:YDR465C
  review:
    summary: >-
      Ensembl Compara transfers the budding-yeast translational-fidelity
      phenotype to A. fumigatus rmt2, but the yeast reporter phenotype is
      pleiotropic across ribosomal protein methyltransferase deletions and was
      not resolved from ribosome-biogenesis defects.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      S. cerevisiae rmt2 deletion perturbs stop-codon readthrough, but the
      same study found readthrough defects in all ten ribosomal protein
      methyltransferase deletions, a 60S subunit deficit in the rmt2 deletion,
      and explicitly left open whether the translational-fidelity effects were
      caused by ribosome biogenesis defects. The direct N5 methyltransferase
      activity is conserved across the fungal Rmt2 node; the downstream
      reporter phenotype is a plausible consequence but should not be
      propagated automatically to A. fumigatus.
    supported_by:
    - reference_id: PMID:26801560
      supporting_text: >-
        Loss of each of the ten ribosomal protein methyltransferases resulted in
        increased readthrough of the UAA and UAG stop codons
    - reference_id: PMID:26801560
      supporting_text: >-
        Like Hpm1-deficient cells, loss of Rkm1, Ntm1, Rmt1, or Rmt2 resulted in
        a deficit of 60S subunits
    - reference_id: PMID:26801560
      supporting_text: >-
        It is unclear if these translational fidelity phenotypes are caused by
        the ribosome biogenesis defects in the methyltransferase mutants.
