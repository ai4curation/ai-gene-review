description: >-
  rmt2 encodes the Aspergillus fumigatus ortholog of fungal Rmt2 type IV
  protein arginine methyltransferases. The protein has an N-terminal
  ankyrin-repeat region and a C-terminal RMT2 SAM-dependent methyltransferase
  domain, and is inferred from characterized fungal Rmt2 enzymes to catalyze
  N5/delta methylation of peptidyl-arginine residues. Its best-established
  fungal homolog, Saccharomyces cerevisiae Rmt2, monomethylates ribosomal
  protein L12/Rpl12.
