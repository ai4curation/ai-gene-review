    label: farnesyl diphosphate metabolic process
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN001700951
  - RGD:61834
  review:
    summary: >-
      IBA FPP metabolic-process annotation from PAINT node PTN001700951.
    action: KEEP_AS_NON_CORE
    reason: >-
      This is biologically correct because Erg9 consumes two molecules of
      farnesyl diphosphate to make squalene. It is kept as non-core because it
      describes a substrate-pool effect of the squalene synthase reaction rather
      than the sterol-pathway role that the enzyme was conserved to execute.
