- term:
    id: GO:0006696
    label: ergosterol biosynthetic process
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000907895
  - SGD:S000001233
  review:
    summary: >-
      Fungal PAINT inference to ergosterol biosynthesis from node
      PTN000907895.
    action: ACCEPT
    reason: >-
      PAINT places ergosterol biosynthetic process on a fungal squalene synthase
      node, and A. fumigatus erg9 catalyzes the FPP-to-squalene step that feeds
      the ergosterol pathway. The two older A. fumigatus ergosterol-pathway
      papers are abstract-only in this cache, but the 2024 full text provides
      species-specific erg9 depletion and GC-MS sterol-profiling evidence.
    additional_reference_ids:
    - PMID:16110826
    - PMID:18191972
    - PMID:39060235
    - file:interpro/panther/PTHR11626/PTHR11626-review.yaml
    supported_by:
    - reference_id: file:interpro/panther/PTHR11626/PTHR11626-review.yaml
      supporting_text: Only the fungal squalene synthases in SF2. PAINT confines the term to a fungal node
    - reference_id: PMID:39060235
      supporting_text: To form the initial sterols of the pathway, farnesyl pyrophosphate, the last product of the mevalonate pathway, is converted to squalene by squalene synthase
    - reference_id: PMID:39060235
      supporting_text: The conditional erg9tetOn and erg1tetOn mutants were not viable under repressed conditions
    - reference_id: PMID:39060235
      supporting_text: depletion of Erg9 resulted in a slight but significant decrease in the amount of ergosterol relative to other sterols
