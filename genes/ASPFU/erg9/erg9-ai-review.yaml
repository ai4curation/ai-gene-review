id: Q4WAG4
gene_symbol: erg9
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:330879
  label: Aspergillus fumigatus Af293
description: >-
  A. fumigatus erg9 encodes the conserved squalene synthase that condenses two
  farnesyl diphosphate molecules and reduces the intermediate to squalene, the
  first committed sterol precursor en route to lanosterol and ultimately
  ergosterol. The protein belongs to the fungal, animal and plant squalene
  synthase subfamily of PTHR11626 and is inferred to act at the endoplasmic
  reticulum membrane.
