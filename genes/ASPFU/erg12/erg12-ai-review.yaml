  review:
    summary: PANTHER/PAINT places mevalonate kinase activity at the
      PTN000048555 mevalonate-kinase node, which contains Q4WP25 and is seeded
      by experimentally characterized mammalian and S. cerevisiae mevalonate
      kinases. The fungal protein is in PTHR43290:SF2 and retains the conserved
      GHMP mevalonate-kinase architecture.
    action: ACCEPT
    reason: Conserved core molecular function, with direct S. cerevisiae ERG12
      enzyme evidence and no A. fumigatus-specific loss or divergence.
    supported_by:
