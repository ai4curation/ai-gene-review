id: Q4WP25
gene_symbol: erg12
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:330879
  label: Aspergillus fumigatus Af293
description: A. fumigatus erg12 (AFUA_4G07780) encodes a GHMP-family mevalonate
  kinase that phosphorylates (R)-mevalonate with ATP to form
  (R)-5-phosphomevalonate. This cytosolic enzyme catalyzes the first
  phosphorylation in conversion of mevalonate to isopentenyl diphosphate,
  supplying isoprenoid precursors for farnesyl diphosphate and ergosterol
  biosynthesis.
