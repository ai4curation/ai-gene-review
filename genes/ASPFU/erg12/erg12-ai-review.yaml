- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: located_in
  supporting_entities:
  - InterPro:IPR006205
  review:
    summary: InterPro2GO infers a cytoplasmic location from IPR006205; this is
      true but less informative than the accepted cytosol annotations.
    action: TOO_GENERAL
    reason: >-
      Cytoplasm is a broad parent-style location for the more specific cytosol
      rows already accepted for the soluble mevalonate kinase. The UniProt entry
      places A. fumigatus Erg12 in the cytosol, despite a pathway-level comment
      that refers to the second ergosterol module as vacuolar, so the exact
      cytosol rows should carry the localization assertion.
    supported_by:
    - reference_id: file:ASPFU/erg12/erg12-uniprot.txt
      supporting_text: 'SUBCELLULAR LOCATION: Cytoplasm, cytosol'
