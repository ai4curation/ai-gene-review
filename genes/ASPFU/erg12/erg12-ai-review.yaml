  - InterPro:IPR006203
  - InterPro:IPR006204
  - InterPro:IPR006205
  review:
    summary: InterPro2GO infers ATP binding from the GHMP kinase domains and
      ATP-binding signature. ATP is the phosphoryl donor in the mevalonate
      kinase reaction, so this is true for Erg12.
    action: KEEP_AS_NON_CORE
    reason: ATP binding is a substrate-binding aspect of the kinase reaction
      and is subordinate to GO:0004496 mevalonate kinase activity.
