    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full-text A. fumigatus study that sequenced hmg1 and hmg2 in azole-resistant isolates
      and directly states that both encode ergosterol-pathway HMG-CoA reductases; the hmg2 variants
