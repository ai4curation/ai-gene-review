id: Q4WSY2
gene_symbol: hmg2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:330879
  label: Aspergillus fumigatus Af293
description: >-
  hmg2 encodes the second Aspergillus fumigatus HMG-CoA reductase, a polytopic
  endoplasmic-reticulum membrane enzyme predicted to use NADPH to reduce
  HMG-CoA to mevalonate. This early mevalonate-pathway reaction supplies
  precursors for fungal ergosterol, broader isoprenoid biosynthesis, and
  triacetylfusarinine C (TAFC) siderophore production; hmg2 is expressed much
  more weakly than the hmg1 paralog under tested conditions, and current
  clinical-isolate data do not establish Hmg2 variation as a major
  triazole-resistance mechanism.
