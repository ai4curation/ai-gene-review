knowledge_gaps:
- gap_statement: >-
    The individual in-vivo contribution of the weakly expressed hmg2 paralog
    to A. fumigatus mevalonate flux, ergosterol production, and TAFC
    siderophore production is unknown.
  boundary: >-
    Hmg2 is predicted to be an ER-membrane class I HMG-CoA reductase, but the
    available A. fumigatus perturbation data directly test hmg1 and do not
    resolve whether hmg2 contributes measurably under any physiological or
    stress condition.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    hmg1 connects the shared mevalonate pool to both ergosterol and TAFC
    siderophore biosynthesis, but hmg2 expression was not detected in the same
    Northern blot analysis, so direct paralog-specific measurements are needed
    before assigning a relative pathway contribution to Hmg2.
  resolution: >-
    Targeted hmg2 deletion or controlled hmg2 expression assays that quantify
    HMG-CoA reductase activity, hmg1 compensation, ergosterol abundance, and
    TAFC output under basal, iron-limited, and azole-stressed conditions.
  provenance:
  - reference_id: PMID:22106303
    supporting_text: In A. fumigatus, the individual contribution of the two putative
      isoforms is unknown.
  - reference_id: PMID:22106303
    supporting_text: In Northern blot analyses, we detected only hmg1 , but not hmg2 , expression
suggested_experiments:
- experiment_type: targeted paralog genetics and metabolite flux
  hypothesis: >-
    hmg2 contributes detectably to mevalonate-pathway output only under a
    restricted subset of iron or sterol-stress conditions in A. fumigatus.
  description: >-
    Construct hmg2 loss-of-function and inducible-expression strains and
    measure hmg1 and hmg2 transcript/protein levels, HMG-CoA reductase
    activity, ergosterol content, and TAFC production under iron-replete,
    iron-limited, and azole-treated conditions.
