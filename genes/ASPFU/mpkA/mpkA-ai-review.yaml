  review:
    summary: EnsemblFungi transfer of the fission-yeast cell-integrity MAPK cascade fits A. fumigatus MpkA.
    action: ACCEPT
    reason: MpkA is the terminal MAP kinase in the conserved PkcA-Bck1-Mkk2-MpkA cell-wall-integrity cascade; direct A. fumigatus
      deletion and western-blot data place MpkA in this MAPK module under vegetative growth and cell-wall stress conditions.
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: PomBase:SPBC119.08
        source_label: S. pombe Pmk1/Spm1 CWI MAPK source
        source_status: SUPPORTS_TRANSFER
        comment: The S. pombe CWI MAPK cascade safely transfers to the orthologous A. fumigatus PkcA-Bck1-Mkk2-MpkA module.
    supported_by:
    - reference_id: PMID:19715768
      supporting_text: 'Deletion of these genes resulted in severe

        sensitivity of the mutants against cell wall-disturbing compounds and drastic

        alterations of the fungal morphology. Western blot analysis demonstrated that

        Bck1 and Mkk2 directly activate MpkA during vegetative growth and under cell

        wall stress conditions further confirming that Bck1, Mkk2 and MpkA form a MAP

        kinase module.'
