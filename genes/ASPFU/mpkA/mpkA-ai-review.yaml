suggested_questions:
- question: Should direct MpkA phosphorylation of FmqC and regulation of GliT/GtmA be captured with specific secondary-metabolite
    regulation terms for fumiquinazoline C and gliotoxin, or left as mechanistic extensions of the cell-wall-integrity MAPK
    cascade?
suggested_experiments:
- description: Map MpkA-dependent phosphorylation sites on FmqC, GliT, GtmA, and RlmA and mutate the sites individually to
    separate direct MpkA substrates from indirect CWI transcriptional effects on conidial metabolite production.
