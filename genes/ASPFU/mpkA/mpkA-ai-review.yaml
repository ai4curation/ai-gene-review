id: Q4WQR3
gene_symbol: mpkA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:330879
  label: Aspergillus fumigatus Af293
description: MpkA is the terminal MAP kinase of the Aspergillus fumigatus PkcA-Bck1-Mkk2-MpkA cell-wall-integrity pathway.
  It is activated during vegetative growth and cell-wall stress, regulates fungal cell-wall organization and hyphal morphology,
  and also phosphorylates downstream targets that connect CWI signaling to conidial secondary-metabolite production, including
  fumiquinazoline C and gliotoxin regulation.
