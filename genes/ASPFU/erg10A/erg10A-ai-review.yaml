knowledge_gaps:
- gap_statement: >-
    The in-vivo mitochondrial pathway that uses AfErg10A's acetoacetyl-CoA
    thiolase activity is unknown.
  boundary: >-
    Zhang et al. showed that purified AfErg10A catalyzes the reversible
    acetyl-CoA/acetoacetyl-CoA reaction, localizes to mitochondria, and is
    essential, while UniProt's curated FUNCTION comment says Erg10A has no
    overlapping function with cytosolic Erg10B and seems not to be involved in
    ergosterol biosynthesis. An OpenScientist run
    (kgap-erg10a-mitochondrial-pathway) narrows the candidate pathways without
    settling the assignment, and it begins by refuting the premise the run was
    given. The prompt proposed that an absent succinyl-CoA:3-oxoacid
    CoA-transferase would make ketone-body utilisation impossible and remove the
    mammalian analogy; the organism has three full-length family I 3-oxoacid
    CoA-transferases, Q4WLU8, Q4WK09 and Q4WEZ2, at 56.6, 54.0 and 48.6 per cent
    identity to human OXCT1, all carrying the matching InterPro and Pfam
    assignments and all with mitochondrial-type presequences, with the
    Ach1-type acetyl-CoA hydrolase ruled out as a confounder because it is a
    separate non-homologous gene. Acetoacetate activation is therefore
    metabolically permitted and the absent-enzyme argument is unavailable. What
    the inventory does settle is the direction of supply and the exclusion of two
    candidates. There is no mitochondrial-type HMG-CoA synthase: both paralogues,
    Q4WBQ3 and Q4WXT8, which are this corpus's own erg13A and erg13B, have
    N-terminal net charges inside the cytosolic control range against a
    mitochondrial control median of +5. There is no credible 3-hydroxybutyrate
    dehydrogenase, the sole candidate being a generic short-chain
    dehydrogenase/reductase at 22.3 per cent identity to human BDH1. So this
    organism has an acetoacetate module rather than a mammalian ketone-body
    system, and the acetoacetate it can make comes from leucine, through a
    clustered set of loci and a mitochondrial-type HMG-CoA lyase; across 15
    fungal reference proteomes the transferase and the leucine module co-occur in
    14 of 15. Terminal beta-oxidation is excluded for this protein on two
    independent grounds: it sits in the ACAT clade at 50.1 per cent identity to
    human ACAT1 and 47.4 per cent to yeast Erg10 but only 36.1 and 35.6 per cent
    to the ACAA-clade enzymes, and the organism maintains four separate
    ACAA-clade thiolases for the 3-ketoacyl-CoA step, of which a PTS2 analysis
    marks two as peroxisomal and one, lacking a PTS2 and carrying net charge +6,
    as the mitochondrial counterpart. The mitochondrial thiolysis step thus has a
    dedicated enzyme that is not this one. Two questions stay open, and one of
    them answers a question the prompt asked in the negative: essentiality
    supports no pathway assignment at all, because every candidate route is
    dispensable in fungi, so the essential phenotype has to be explained by
    something other than a choice among these pathways. And isoleucine catabolism
    cannot be separated from the acetoacetate loop, because the one measurement
    that would discriminate them, activity on 2-methylacetoacetyl-CoA, has never
    been run on this enzyme. Verified here: the accessions Q4WBQ3 and Q4WXT8 are
    this corpus's own erg13A and erg13B entries, which is an independent check on
    the run's identification, and this entry is the 433-residue reviewed record
    whose own curated name and EC come from the same publication the gap cites.
    Not reproduced here: the Smith-Waterman identity figures, the N-terminal
    charge comparison and its statistics, the PTS2 assignments, the InterPro and
    Pfam lookups for the transferase candidates, and the 15-proteome
    co-occurrence test. The three transferase candidates are unreviewed entries
    with no experimental characterisation, which the run states, so they show the
    chemistry is possible and not that it happens.
  gap_kind:
  - BIOLOGY
  dark_aspect: BP_DARK
  status: NARROWING
  significance: >-
    The phenotype data establish that Erg10A is required for viability, but do
    not identify the mitochondrial product or pathway whose loss causes the
    growth, oxidative-stress, and cell-wall-stress defects.
  resolution: >-
    Mitochondrial metabolomics and isotope tracing after controlled erg10A
    repression, paired with rescue tests by compartment-targeted Erg10B or
    pathway intermediates, would distinguish biosynthetic, degradative, and
    CoA-buffering roles.
