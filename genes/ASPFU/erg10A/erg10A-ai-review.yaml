suggested_experiments:
- experiment_type: mitochondrial metabolomics and compartment-specific rescue
  hypothesis: >-
    AfErg10A supplies or consumes acetoacetyl-CoA in a mitochondrial pathway
    outside cytosolic mevalonate and ergosterol biosynthesis.
  description: >-
    Repress erg10A acutely, quantify mitochondrial acetyl-CoA, acetoacetyl-CoA,
    CoA, ketone-body-like and branched-chain-acid intermediates by targeted
    metabolomics and isotope tracing, and test rescue with mitochondrially
    targeted versus cytosolic Erg10-family enzymes.
