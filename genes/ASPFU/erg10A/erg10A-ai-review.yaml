description: >-
  Aspergillus fumigatus erg10A encodes a mitochondrial acetyl-CoA
  acetyltransferase and acetoacetyl-CoA thiolase in the PTHR18919:SF156
  ACAT1-like branch. Purified AfErg10A catalyzes both synthetic and degradative
  acetoacetyl-CoA thiolase reactions, and a functional C-terminal GFP fusion
  colocalizes with mitochondrial dye in hyphae.
