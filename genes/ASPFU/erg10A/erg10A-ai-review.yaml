references:
- id: file:ASPFU/erg10A/erg10A-hypotheses/kgap-erg10a-mitochondrial-pathway/openscientist.md
  title: OpenScientist analysis of the erg10A mitochondrial pathway assignment
  findings:
  - statement: >-
      The organism encodes three full-length family I 3-oxoacid CoA-transferases with
      mitochondrial-type presequences, so acetoacetate activation is permitted and the
      absent-enzyme argument against a ketone-body-like route is unavailable. But there is no
      mitochondrial-type HMG-CoA synthase, both paralogues being cytosolic by N-terminal charge, and
      no credible 3-hydroxybutyrate dehydrogenase, so the organism has an acetoacetate module rather
      than a mammalian ketone-body system, supplied from leucine. Terminal beta-oxidation is excluded
      for this protein, which sits in the ACAT clade while four separate ACAA-clade thiolases cover
      the 3-ketoacyl-CoA step, one of them mitochondrial by PTS2 and charge. Essentiality
      discriminates nothing, since every candidate route is dispensable in fungi, and isoleucine
      catabolism cannot be separated from the acetoacetate loop without an assay on
      2-methylacetoacetyl-CoA.
    supporting_text: >-
      Acetoacetate activation is metabolically permitted in this organism.
  reference_review:
    relevance: HIGH
    correctness: UNVERIFIED
    review_notes: >-
      The run refutes a premise supplied in its own prompt, that the organism would lack a
      succinyl-CoA:3-oxoacid CoA-transferase, and that refutation is adopted here. Verified
      independently: the accessions it gives for the HMG-CoA synthase paralogues, Q4WBQ3 and Q4WXT8,
      are this corpus's own erg13A and erg13B entries. Not reproduced here: the Smith-Waterman
      identity figures, the N-terminal charge comparison and its statistics, the PTS2 assignments,
      the InterPro and Pfam lookups, and the 15-proteome co-occurrence test. The three transferase
      candidates are unreviewed entries without experimental characterisation, which the run states,
      so they establish that the chemistry is possible rather than that it occurs.
