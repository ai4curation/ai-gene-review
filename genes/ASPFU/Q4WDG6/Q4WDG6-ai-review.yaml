  title: The mitA gene of Aspergillus fumigatus is required for mannosylation of inositol-phosphorylceramide,
    but is dispensable for pathogenicity.
  findings:
  - statement: Kotz et al. identified MitA as the A. fumigatus MIPC transferase.
    supporting_text: >-
      identified MitA as the only MIPC transferase in A. fumigatus
    reference_section_type: ABSTRACT
  - statement: Deleting mitA eliminates MIPC and downstream MIPC-derived glycosphingolipids
      while causing IPC accumulation.
    supporting_text: >-
      The DeltamitA mutant lacks MIPC and MIPC-derived glycosphingolipids and accumulates
      the precursor IPC.
    reference_section_type: ABSTRACT
  - statement: The mitA mutant has a delayed-germination calcium phenotype but no strong
      cell-wall, membrane, virulence or macrophage-stimulation phenotype.
    supporting_text: >-
      Germination of DeltamitA mutant conidia is also decelerated under normal growth
      conditions, but neither the virulence of this mutant in a systemic model of infection
      nor its ability to trigger a cytokine response in macrophages is impaired
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PMID, title and abstract verified in PubMed/cache. The cache is abstract-only,
      so direct support is restricted to the abstract's MitA mutant lipid and phenotype
      summary.
