suggested_experiments:
- description: >-
    Tag native MitA and co-image it with Golgi and vacuolar markers to determine the
    membrane compartment where IPC is mannosylated in A. fumigatus.
- description: >-
    Reconstitute MitA with GDP-mannose and purified IPC acceptor to confirm the direct
    IPC mannosyltransferase reaction biochemically and define substrate specificity.
