taxon:
  id: NCBITaxon:330879
  label: Aspergillus fumigatus Af293
description: >-
  MitA (AFUA_6G04680; UniProt Q4WDG6) is the Aspergillus fumigatus GT32 inositol
  phosphorylceramide mannosyltransferase that transfers mannose to IPC to initiate
  the acidic glycosphingolipid branch. Loss of mitA abolishes MIPC and MIPC-derived
  glycosphingolipids, causes IPC accumulation and modestly delays conidial germination,
  but does not measurably impair cell-wall or membrane organization, macrophage cytokine
  stimulation or systemic virulence in the reported Af293 mutant.
