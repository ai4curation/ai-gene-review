proposed_new_terms:
- proposed_name: protostadienol synthase activity
  proposed_definition: 'Catalysis of the reaction: (S)-2,3-epoxysqualene = (17Z)-protosta-17(20),24-dien-3beta-ol.'
  justification: HelA and related fungal oxidosqualene cyclases make protostadienol for
    fusidane-type antibiotics rather than lanosterol for sterol biosynthesis; GO lacks a
    molecular-function term for the RHEA:30987 reaction.
  proposed_parent:
    id: GO:0016866
    label: intramolecular transferase activity
  proposed_mappings:
