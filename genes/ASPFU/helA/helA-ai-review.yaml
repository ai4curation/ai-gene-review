id: Q4WR16
gene_symbol: helA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:330879
  label: Aspergillus fumigatus Af293
description: Aspergillus fumigatus helA encodes protostadienol synthase, the oxidosqualene
  cyclase of the helvolic-acid biosynthetic gene cluster. HelA cyclizes (S)-2,3-epoxysqualene to
  (17Z)-protosta-17(20),24-dien-3beta-ol rather than lanosterol; the protostadienol scaffold is
  then oxidized, decarboxylated, and acylated by neighboring Hel enzymes to produce the fusidane
  antibiotic helvolic acid.
