id: Q4WK25
gene_symbol: erg5
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:330879
  label: Aspergillus fumigatus Af293
description: >-
  erg5 encodes the Aspergillus fumigatus CYP61-family C-22 sterol desaturase
  in PTHR24286:SF228. This predicted ER-membrane cytochrome P450 catalyzes the
  oxygen- and NADPH-dependent introduction of the C22-C23 sterol side-chain
  double bond late in ergosterol biosynthesis. A. fumigatus erg5 is required
  for ergosterol production and conidiation, as shown by erg5 deletion and
  Tet-on conditional-expression strains.
