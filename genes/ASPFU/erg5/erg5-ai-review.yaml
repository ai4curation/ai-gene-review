suggested_questions:
- question: >-
    Does A. fumigatus Erg5 use the same immediate sterol substrate as
    Saccharomyces CYP61, or can altered flux through the duplicated Erg3/Erg4
    late-pathway paralogs change the preferred C-22-desaturation substrate?
suggested_experiments:
- hypothesis: A. fumigatus Erg5 directly catalyzes C-22 desaturation of 5-dehydroepisterol.
  description: >-
    Purify A. fumigatus Erg5 or isolate Erg5-containing microsomes, reconstitute
    the reaction with NADPH-cytochrome P450 reductase and candidate sterol
    substrates, and quantify C-22-desaturated products by GC-MS.
  experiment_type: biochemistry
