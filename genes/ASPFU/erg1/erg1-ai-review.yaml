id: E9R5G2
gene_symbol: erg1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:330879
  label: Aspergillus fumigatus Af293
description: >-
  A. fumigatus erg1 encodes a conserved squalene epoxidase/squalene
  monooxygenase of the PTHR10835:SF0 family. This FAD-dependent ER-membrane
  enzyme uses O2 and electrons from NADPH-cytochrome P450 reductase to oxidize
  squalene to (S)-2,3-epoxysqualene, supplying the oxidosqualene substrate that
  lanosterol synthase consumes in the ergosterol biosynthetic pathway.
