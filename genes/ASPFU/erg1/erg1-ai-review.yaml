gene_symbol: erg1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:330879
  label: Aspergillus fumigatus Af293
description: erg1 (AFUA_5G07780) encodes the Aspergillus fumigatus squalene
  epoxidase, an FAD-dependent, multi-pass endoplasmic-reticulum membrane
  monooxygenase of the squalene monooxygenase family. Erg1 catalyzes the
  oxygenation of squalene to (S)-2,3-epoxysqualene, the reaction immediately
  upstream of lanosterol cyclization in the ergosterol biosynthetic pathway, and
  is the target of the allylamine antifungal terbinafine.
