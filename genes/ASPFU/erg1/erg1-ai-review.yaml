- term:
    id: GO:0050660
    label: flavin adenine dinucleotide binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR013698
  review:
    summary: Squalene monooxygenases are FAD-dependent flavoproteins; the
      A. fumigatus record includes conserved FAD-binding features by similarity
      to human SQLE. This cofactor binding is genuine support for the enzyme
      mechanism but is secondary to the squalene monooxygenase activity.
    action: KEEP_AS_NON_CORE
    reason: FAD binding is a conserved cofactor interaction of the monooxygenase,
      not a standalone core function.
    supported_by:
    - reference_id: file:genes/ASPFU/erg1/erg1-uniprot.txt
      supporting_text: Name=FAD; Xref=ChEBI:CHEBI:57692;
