suggested_questions:
- question: >-
    Does A. fumigatus Eaf3 physically associate with both NuA4 and Rpd3S
    complexes, and does its Tudor-knot/chromo-like module read H3K36
    methylation as in budding- and fission-yeast Eaf3-family proteins?
suggested_experiments:
- hypothesis: >-
    A. fumigatus eaf3 encodes a nuclear MRG-family subunit shared by NuA4 and
    Rpd3S-type complexes.
  description: >-
    Endogenously tag Eaf3 in Af293, perform reciprocal affinity purification
    with NuA4 and Rpd3S catalytic or scaffold subunits under vegetative and
    stress conditions, and quantify H3K36me-dependent chromatin binding with
    wild-type and Tudor-knot/chromo-like-domain mutant Eaf3 alleles.
  experiment_type: reciprocal AP-MS and H3K36me peptide/chromatin-binding assay
