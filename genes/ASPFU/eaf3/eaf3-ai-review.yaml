core_functions:
- description: >-
    Acts as the A. fumigatus Eaf3/MRG-family subunit of the NuA4 histone
    acetyltransferase complex in nuclear chromatin, where fungal Eaf3 proteins
    link RNA polymerase II-associated chromatin regulation to the noncatalytic
    targeting module of NuA4.
  directly_involved_in:
