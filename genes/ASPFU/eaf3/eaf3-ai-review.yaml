    label: nucleus
  in_complex:
    id: GO:0035267
    label: NuA4 histone acetyltransferase complex
  supported_by:
  - *paint_nua4
  - *uniprot_nua4
- description: >-
    Acts as the A. fumigatus Eaf3/MRG-family subunit of the conserved fungal
    Rpd3S histone deacetylase complex branch, which links transcribed nuclear
    chromatin to RNA polymerase II-associated histone deacetylation and
    transcriptional regulation.
  directly_involved_in:
  - id: GO:0006357
    label: regulation of transcription by RNA polymerase II
  molecular_function:
    id: GO:0140003
    label: histone H3K36me3 reader activity
  contributes_to_molecular_function:
