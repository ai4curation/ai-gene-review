taxon:
  id: NCBITaxon:330879
  label: Aspergillus fumigatus Af293
description: >-
  eaf3 encodes a nuclear MRG-family chromatin protein in Aspergillus fumigatus.
  It has an N-terminal Tudor-knot/chromo-like module and a C-terminal MRG
  interaction domain, belongs to the conserved fungal Eaf3 branch, and is
  inferred to act as a noncatalytic subunit of NuA4 histone acetyltransferase
  and Rpd3S histone deacetylase complexes that couple RNA polymerase
  II-associated chromatin to histone acetylation and deacetylation control.
