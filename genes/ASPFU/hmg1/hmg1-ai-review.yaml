        source_status: SUPPORTS_TRANSFER
        comment: The broad isoprenoid-biosynthesis placement on the conserved HMGR
          node is sound, but the A. fumigatus core-function summary should spell out
          the direct mevalonate-pathway step and supported ergosterol branch.
    supported_by:
    - reference_id: file:interpro/panther/PTHR10572/PTHR10572-paint.tsv
