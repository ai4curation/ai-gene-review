id: Q4WHZ1
gene_symbol: hmg1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:330879
  label: Aspergillus fumigatus Af293
description: >-
  hmg1 encodes HMG-CoA reductase 1, a polytopic endoplasmic-reticulum membrane
  enzyme that uses NADPH to reduce HMG-CoA to mevalonate. This rate-limiting
  mevalonate step feeds fungal ergosterol biosynthesis and other isoprenoid
  products; in A. fumigatus, the same mevalonate pool is also drawn into the
  TAFC siderophore branch during iron limitation, and hmg1 mutations can alter
  sterol homeostasis and contribute to triazole resistance.
