  - PomBase:SPCC162.09c
  - UniProtKB:Q9Y0F3
  review:
    summary: PAINT process IBA from PTN000060346 to isoprenoid biosynthesis; Hmg1
      produces mevalonate at the entry to ergosterol and nonsterol isoprenoid routes,
      so the PAINT claim should be retained as more specific descendant processes.
    action: MODIFY
    reason: Isoprenoid biosynthesis is true but broad for A. fumigatus Hmg1. The
      enzyme directly catalyzes the mevalonate-forming HMGR step that feeds
      isopentenyl diphosphate production through the mevalonate pathway, and the
      same mevalonate pool is required for downstream fungal ergosterol production.
    proposed_replacement_terms:
    - id: GO:0019287
      label: isopentenyl diphosphate biosynthetic process, mevalonate pathway
    - id: GO:0006696
      label: ergosterol biosynthetic process
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - GRANULARITY_MISMATCH
      source_entities:
