- term:
    id: GO:0008299
    label: isoprenoid biosynthetic process
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - AGI_LocusCode:AT1G76490
  - AGI_LocusCode:AT2G17370
