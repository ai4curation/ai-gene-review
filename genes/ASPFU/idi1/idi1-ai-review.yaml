id: Q4WM52
gene_symbol: idi1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:330879
  label: Aspergillus fumigatus Af293
description: >-
  idi1 (AFUA_6G11160) encodes the Aspergillus fumigatus type-I
  isopentenyl-diphosphate delta-isomerase of the mevalonate pathway. The enzyme
  interconverts isopentenyl diphosphate and dimethylallyl diphosphate, providing
  the allylic dimethylallyl diphosphate primer that Erg20 extends into farnesyl
  diphosphate for ergosterol and other fungal isoprenoid products.
