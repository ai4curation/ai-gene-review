taxon:
  id: NCBITaxon:330879
  label: Aspergillus fumigatus Af293
description: erg26 encodes the Aspergillus fumigatus sterol-4-alpha-carboxylate 3-dehydrogenase/C-4 decarboxylase,
  a 3-beta-HSD-family enzyme inferred to catalyze the oxidative decarboxylation step of C-4 sterol demethylation
  between Erg25A/B and Erg27. In Aspergillus, C-4 demethylation acts on the eburicol-derived route to fecosterol,
  but the Erg26 step is conserved as an ER-membrane reaction in ergosterol biosynthesis.
