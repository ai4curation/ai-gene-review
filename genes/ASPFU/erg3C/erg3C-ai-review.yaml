description: 'erg3C encodes one of three Aspergillus fumigatus Erg3-family Delta7-sterol 5(6)-desaturases. Erg3C
  is a predicted multi-pass ER-membrane sterol desaturase; genetic studies established Erg3B as the major isoform
  and left the possible compensating contribution of Erg3C unresolved.'
