- term:
    id: GO:0050547
    label: feruloyl-CoA hydratase/lyase activity
  evidence_type: EXP
  original_reference_id: PMID:10222033
  qualifier: enables
  review:
    summary: Purified HCHL turns over feruloyl-CoA with measured kinetics; this is the core activity.
    action: ACCEPT
    reason: >-
      Mitra et al. purified the enzyme from strain AN103 and measured Km values
      for feruloyl-CoA, caffeoyl-CoA and 4-coumaroyl-CoA. The GO term is defined
      by the feruloyl-CoA reaction, which is the reaction Swiss-Prot records with
      this paper as evidence.
    supported_by:
    - reference_id: PMID:10222033
      supporting_text: >-
        The enzyme is a homodimer and is active with three closely related
        substrates, 4-coumaroyl-CoA, caffeoyl-CoA, and feruloyl-CoA (Km values:
        5.2, 1.6, and 2.4 microM, respectively), but not with cinnamoyl-CoA or
        with sinapinoyl-CoA.
    - reference_id: file:PSEFL/O69762/O69762-uniprot.txt
      record_section: ["CC:CATALYTIC ACTIVITY"]
      supporting_text: 'Reaction=(E)-feruloyl-CoA + H2O = vanillin + acetyl-CoA;'
