- term:
    id: GO:1901067
    label: ferulate catabolic process
  evidence_type: IC
  original_reference_id: PMID:10222033
  qualifier: involved_in
  review:
    summary: HCHL catalyses a step of 4-hydroxycinnamate (ferulate) degradation itself.
    action: NEW
    reason: >-
      HCHL performs the side-chain hydration and two-carbon cleavage that
      converts the CoA-activated ferulate to vanillin, so it does part of the
      work of ferulate breakdown rather than being merely required for it. The
      gene was isolated by complementing a mutant, and the purification paper
      describes the reaction as a step in 4-hydroxycinnamate degradation. The
      same process is carried by the KT2440 ortholog Ech on target-strain
      genetic evidence.
    supported_by:
    - reference_id: PMID:10222033
      supporting_text: >-
        The enzyme 4-hydroxycinnamoyl-CoA hydratase/lyase (HCHL), which
        catalyzes a hydration and two-carbon cleavage step in the degradation of
        4-hydroxycinnamic acids, has been purified and characterized from
        Pseudomonas fluorescens strain AN103.
