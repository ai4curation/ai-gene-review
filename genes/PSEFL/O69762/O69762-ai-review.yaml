taxon:
  id: NCBITaxon:294
  label: Pseudomonas fluorescens
description: >-
  Hydroxycinnamoyl-CoA hydratase-lyase (HCHL) of Pseudomonas fluorescens AN103,
  the founding characterized enzyme of the non-beta-oxidative hydroxycinnamate
  degradation route. A member of the enoyl-CoA hydratase/isomerase (crotonase)
  superfamily, it hydrates the double bond of feruloyl-CoA and cleaves the
  beta-hydroxy thioester intermediate by a retro-aldol reaction to vanillin and
  acetyl-CoA; it is also active on caffeoyl-CoA and 4-coumaroyl-CoA but not on
  cinnamoyl-CoA or sinapoyl-CoA. The purified enzyme was reported as a
  homodimer, whereas crystal structures show a hexamer of two stacked trimers, with Glu-143 essential for catalysis and Tyr-239 contributing
  to recognition of the para-hydroxyl group of the substrate.
