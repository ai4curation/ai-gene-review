core_functions:
- description: >-
    Hydroxycinnamoyl-CoA hydratase-lyase that hydrates feruloyl-CoA (and
    caffeoyl- or 4-coumaroyl-CoA) and cleaves the hydrated intermediate by a
    retro-aldol reaction to vanillin (or the corresponding benzaldehyde) and
    acetyl-CoA, the side-chain-shortening step of 4-hydroxycinnamate
    degradation.
  molecular_function:
    id: GO:0050547
    label: feruloyl-CoA hydratase/lyase activity
  directly_involved_in:
  - id: GO:1901067
    label: ferulate catabolic process
  supported_by:
  - reference_id: PMID:10222033
    supporting_text: >-
      The enzyme is a homodimer and is active with three closely related
      substrates, 4-coumaroyl-CoA, caffeoyl-CoA, and feruloyl-CoA
  - reference_id: PMID:18479250
    supporting_text: >-
      HCHL (hydroxycinnamoyl-CoA hydratase-lyase) catalyses the
      biotransformation of feruloyl-CoA to acetyl-CoA and the important
      flavour-fragrance compound vanillin
