suggested_questions:
- question: Is the native quaternary state of HCHL the hexamer seen in crystals or the dimer reported for the purified enzyme, and does it matter for activity?
suggested_experiments:
- description: Determine the solution oligomeric state of purified HCHL by SEC-MALS or analytical ultracentrifugation and relate it to activity.
  hypothesis: HCHL is a hexamer in solution and the active site is formed between subunits.
  experiment_type: biophysical characterization
