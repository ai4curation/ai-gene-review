id: F1L8A5
gene_symbol: F1L8A5
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6253
  label: Ascaris suum
description: >-
  F1L8A5 is a near-complete Ascaris suum beta-tubulin chain from a
  polyadenylated-RNA transcriptome assembly. It contains the conserved
  Tubulin/FtsZ GTPase and C-terminal beta-tubulin domains needed to
  heterodimerize with alpha-tubulin and contribute beta subunits to the
  microtubule lattice. The exact Ascaris isotype represented by F1L8A5 and its
  direct contribution to benzimidazole sensitivity have not been
  experimentally resolved.
