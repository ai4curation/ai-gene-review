knowledge_gaps:
- gap_statement: >-
    The A. suum beta-tubulin isotype or isotypes that form the
    benzimidazole-engaged microtubule target have not been genetically
    identified.
  boundary: >-
    UniProt resolves F1L8A5 only to a TSA mRNA/protein accession from a broad
    A. suum transcriptome resource, and live UniProt/PANTHER searches return
    multiple full-length or near-full-length A. suum beta-tubulin candidates.
    This review did not find F1L8A5-specific expression, loss-of-function,
    allele-swap, or resistance-mapping evidence that separates this sequence
    from the other A. suum PTHR11588 beta-tubulins.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    Resolving the drug-sensitive Ascaris beta-tubulin isotype would define the
    on-target microtubule species for benzimidazole response and resistance
    surveillance.
  resolution: >-
    Reconcile A. suum beta-tubulin transcript accessions to current gene
    models, quantify isotype-specific expression in drug-exposed parasite
    stages, and test candidate beta-tubulins by targeted perturbation or
    reciprocal allele replacement where Ascaris genetics permit it.
  provenance:
  - reference_id: file:genes/ASCSU/F1L8A5/F1L8A5-uniprot.txt
    supporting_text: >-
      DR   EMBL; JI173658; ADY46359.1; -; mRNA.
suggested_questions:
- question: >-
    Which A. suum beta-tubulin loci encode the benzimidazole-sensitive
    microtubule pool, and is the F1L8A5 TSA sequence an allele, isoform or
    assembly product of one of those loci?
suggested_experiments:
- description: >-
    Map F1L8A5 and the other full-length ASCSU PTHR11588 beta-tubulin
    transcripts onto a current A. suum genome, then compare isotype-resolved
    expression and codon-167/198/200 haplotypes across benzimidazole-sensitive
    and experimentally selected resistant Ascaris samples.
  hypothesis: >-
    A subset of A. suum beta-tubulin isotypes constitutes the
    benzimidazole-sensitive microtubule pool, and one or more full-length
    F1L8A5-like transcripts tracks parasite drug response.
  experiment_type: comparative genomics and expression profiling
