    Deep small RNA sequencing from the nematode Ascaris reveals conservation,
    functional diversification, and novel developmental profiles.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      This is a small-RNA and transcriptome resource paper rather than an
      F1L5R2 functional study; it is cited here only because its
      transcriptome-shotgun accession range contains the JI171920 and JI173475
      mRNAs that UniProt imports for F1L5R2.
  findings:
  - statement: >-
      Wang et al. sequenced poly(A) cDNA libraries from A. suum and submitted
      the transcriptome assembly containing the two mRNA records that UniProt
      uses for F1L5R2.
    supporting_text: >-
      The transcriptome assembly has been submitted to NCBI Transcriptome
      Shotgun Assembly Sequence Database
  - statement: >-
      The Wang et al. cDNA libraries were prepared from polyadenylated RNA and
      sequenced as Illumina paired-end reads.
    supporting_text: >-
