id: F1L5R2
gene_symbol: F1L5R2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6253
  label: Ascaris suum
description: >-
  F1L5R2 is a full-length 450 aa Ascaris suum beta-tubulin chain from a
  polyadenylated-RNA transcriptome assembly. It contains the conserved
  Tubulin/FtsZ GTPase and C-terminal beta-tubulin domains needed to
  heterodimerize with alpha-tubulin and contribute beta subunits to the
  microtubule lattice. The exact Ascaris isotype represented by F1L5R2 and its
  relationship to the benzimidazole-sensitive beta-tubulin pool have not been
  experimentally resolved.
