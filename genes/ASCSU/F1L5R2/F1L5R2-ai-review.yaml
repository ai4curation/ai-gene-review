knowledge_gaps:
- gap_statement: >-
    The A. suum beta-tubulin isotype or isotypes that form the
    benzimidazole-engaged microtubule target have not been genetically
    identified.
  boundary: >-
    The C. elegans BEN-1 beta-tubulin genetically defines one nematode
    benzimidazole-sensitive beta-tubulin, but this review did not find
    F1L5R2-specific expression, loss-of-function, allele-swap, or
    resistance-mapping evidence showing that the A. suum locus encoding F1L5R2
    belongs to the equivalent drug-sensitive isotype pool.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    Resolving the drug-sensitive Ascaris beta-tubulin isotype would define the
    on-target microtubule species for benzimidazole response and resistance
    surveillance.
  resolution: >-
    Test candidate A. suum beta-tubulins by targeted perturbation or reciprocal
    allele replacement where Ascaris genetics permit it, then measure
    microtubule integrity, parasite viability and benzimidazole sensitivity.
  provenance:
  - reference_id: PMID:2592410
    supporting_text: >-
      Since the deletion strains appear to be fully resistant to the drugs, the
      ben-1 product appears to be the only benzimidazole-sensitive beta-tubulin
      in C. elegans.
    full_text_unavailable: true
suggested_questions:
- question: >-
    Which A. suum beta-tubulin loci encode the benzimidazole-sensitive
    microtubule pool, and is the locus encoding the F1L5R2 transcript one of
    them?
suggested_experiments:
- description: >-
    Perturb A. suum beta-tubulin genes singly, including the locus encoding
    F1L5R2, and test which perturbations alter parasite microtubule integrity,
    viability and benzimidazole sensitivity.
  hypothesis: >-
    A subset of A. suum beta-tubulin isotypes constitutes the
    benzimidazole-sensitive microtubule pool, and the F1L5R2-encoding locus may
    be one such isotype.
  experiment_type: targeted perturbation
