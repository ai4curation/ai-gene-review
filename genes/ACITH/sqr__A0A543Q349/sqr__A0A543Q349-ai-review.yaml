  label: Acidithiobacillus thiooxidans ATCC 19377
description: >-
  sqr (GCD22_02301, A0A543Q349) of the sulfur-oxidizing acidophile
  Acidithiobacillus thiooxidans encodes a 428-residue FAD/NAD(P)-binding
  flavoprotein of the sulfide:quinone oxidoreductase (SQR) family. By sequence
  it is a Type V (SqrE)-like SQR, not a Type I (SqrA) enzyme. It lacks the Type
  I flavin-linked cysteine but keeps the two cysteines that carry the persulfide
  in the characterized Type V SQR of Acidianus ambivalens. Its closest
  characterized relative is the Chlorobaculum tepidum SqrE homolog CT0876
  (about 56% identical), which showed no SQR activity when made recombinantly.
  The protein is therefore a putative sulfide-oxidizing quinone reductase whose
  activity, electron acceptor and membrane association have not been
  established. In A. thiooxidans ATCC 19377 a gene designated sqr is expressed
  at medium to high levels during growth on elemental sulfur and thiosulfate.
