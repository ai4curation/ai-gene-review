- id: PMID:19028893
  title: Functional analysis of three sulfide:quinone oxidoreductase homologs in Chlorobaculum
    tepidum.
  findings:
  - statement: >-
      Of three C. tepidum SQR homologs, recombinant CT1087 (SqrD) and CT0117
      (SqrF) had SQR activity, but CT0876, the closest typed relative of
      A0A543Q349, did not.
    supporting_text: CT0876 may support the growth of C. tepidum at low sulfide
      concentrations, but no evidence was found for SQR activity associated with
      this protein.
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed abstract checked. This is the key evidence that membership of the
      SqrE-like clade does not guarantee SQR activity.
- id: PMID:21833341
  title: Mechanisms and evolution of oxidative sulfur metabolism in green sulfur bacteria.
  findings:
  - statement: Assigns CT0876 to the SqrE (Type V) group, CT1087 to SqrD (Type
      IV) and CT0117 to SqrF (Type VI).
    supporting_text: tepidum has an SqrE homolog (CT0876/NP_661769), although
      no SQR activity has been demonstrated for this protein
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text cached; used for the SqrA-F to Type I-VI mapping
      and the CT0876 type assignment.
- id: PMID:23103448
  title: Characterization of the Type III sulfide:quinone oxidoreductase from Caldivirga
    maquilingensis and its membrane binding.
  findings:
  - statement: Maps the SqrA-F nomenclature to Types I-VI (SqrE = Type V) and
      lists the Type I hallmarks that A0A543Q349 lacks.
    supporting_text: 'Type I = SqrA; Type II = SqrB; Type III = SqrC; Type IV =
      SqrD plus SqrX; Type V = SqrE and Type VI = SqrF.'
- id: PMID:32231653
  title: New Insights Into Acidithiobacillus thiooxidans Sulfur Metabolism Through
    Coupled Gene Expression, Solution Chemistry, Microscopy, and Spectroscopy Analyses.
  findings:
  - statement: >-
      In A. thiooxidans ATCC 19377 a gene designated sqr is expressed at
      comparable medium-to-high levels during growth on S0 and thiosulfate. The
      paper's sqr is presumed, but not confirmed by locus tag, to be
      GCD22_02301.
    supporting_text: The sqr gene is medium to highly expressed in all three conditions
      at comparable levels suggesting that the gene product sulfide quinone reductase
      also plays an important role in A.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Full text cached. Expression only; no enzyme activity. The locus tag of the
      measured sqr was not verified against this UniProt entry.
