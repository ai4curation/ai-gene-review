  title: SQR type assignment for five acidophile sulfide:quinone oxidoreductase entries
  findings:
  - statement: >-
      A0A543Q349 is Type V (SqrE)-like, not Type I. It is 26-28% identical to
      the acidophile Type I SQRs and has a Tyr at the Type I flavin-linked
      cysteine position.
