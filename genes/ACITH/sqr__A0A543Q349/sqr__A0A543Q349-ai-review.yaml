suggested_questions:
- question: >-
    Does A. thiooxidans ATCC 19377 encode any Type I (SqrA) SQR in other
    assemblies? If not, is this Type V-like protein the main sulfide-oxidizing
    enzyme of the species, as genome-based sulfur-oxidation models assume?
- question: >-
    Does the SqrE-like clade that includes C. tepidum CT0876 and this protein
    share a non-SQR activity, given that CT0876 lacked sulfide:quinone activity
    in vitro?
suggested_experiments:
- description: >-
    Purify recombinant A0A543Q349 and test sulfide:decylubiquinone and
    sulfide:caldariellaquinone/menaquinone activity, with C186A and C361A
    controls. Test membrane association by fractionating A. thiooxidans
    membranes.
  experiment_type: recombinant enzyme assay and membrane fractionation
