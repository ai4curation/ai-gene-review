  review:
    summary: >-
      InterPro2GO mapping from the FAD/NAD(P)-binding domain that holds the
      redox-active cysteine pair. Correct, and at present as specific as the
      evidence allows.
    action: ACCEPT
    reason: >-
      The protein has the Pyr_redox_2 FAD/NAD(P)-binding domain and matches the
      InterPro SQR family (IPR052541). Pairwise analysis places it with Type V
      (SqrE) SQRs: 56.2% identity to C. tepidum CT0876 and 32.0% to the
      characterized A. ambivalens Type V SQR. Its cysteines C186 and C361 align
      with the A. ambivalens active-site cysteines C178 and C350. That supports
      a flavin-dependent thiol-based oxidoreductase. It does not establish
      sulfide:quinone oxidoreductase activity: the most similar characterized
      protein, CT0876, had no SQR activity in vitro, and the Type V group
      contains both active and inactive members. A specific activity term is
      therefore not proposed. Oxidoreductase activity is the most specific
      molecular function supported, so it is accepted.
