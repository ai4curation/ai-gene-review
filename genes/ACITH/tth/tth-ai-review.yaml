  label: Acidithiobacillus thiooxidans ATCC 19377
description: >-
  Fragmentary tetrathionate hydrolase-like gene product (locus GCD22_00683) of the acidophilic
  sulfur oxidizer Acidithiobacillus thiooxidans ATCC 19377. The 235-residue sequence corresponds
  only to the central part of the TetH PQQ-repeat beta-propeller (about residues 113-348 of the
  A. ferrooxidans enzyme, which it matches at 60% identity, including the catalytic aspartate);
  it lacks the Sec signal peptide and N-terminal blades, which are encoded in another reading
  frame by the adjacent ORF GCD22_00682, and lacks the C-terminal ~150 residues. The locus is
  therefore a frame-shifted, truncated tth copy whose product is unlikely to be exported or
  active. The same genome encodes a separate, intact 503-residue tetrathionate hydrolase
  (GCD22_02315, UniProtKB A0A5P9XS05), which is the functional TetH candidate of this strain.
