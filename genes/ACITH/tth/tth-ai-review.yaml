suggested_questions:
- question: Is the GCD22_00682/GCD22_00683 split a genuine pseudogene in A. thiooxidans ATCC 19377
    or an indel error of the PacBio-only assembly (CP045571.1)? Short-read or resequencing data
    across CP045571.1:618900-621300 would settle it.
- question: Does A. thiooxidans ATCC 19377 express the intact tth copy GCD22_02315 (A0A5P9XS05)
    during growth on tetrathionate, and is it the sole tetrathionate hydrolase?
suggested_experiments:
- description: Resequence the CP045571.1:618900-621300 region by Sanger or Illumina and RT-PCR across
    the GCD22_00682/00683 junction during tetrathionate growth.
  hypothesis: The region contains frameshift(s) and the C-terminal truncation that make it a pseudogene,
    and GCD22_02315 is the transcribed tetH.
  experiment_type: targeted resequencing and RT-PCR
