id: Q9RZP7
gene_symbol: DR_B0073
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:243230
  label: Deinococcus radiodurans R1 = ATCC 13939 = DSM 20539
description: DR_B0073 encodes FruA, a membrane fructose phosphotransferase-system component with two N-terminal
  EIIB-like domains and a C-terminal EIIC translocation domain. The membrane component supports fructose
  uptake coupled to phosphorylation, while the upstream cytosolic machinery determines the phosphate-donor
  route. Deinococcal membranes can support PEP-dependent phosphorylation with Rhodobacter capsulatus cytosol;
  ATP-dependent phosphorylation was reported with the older deinococcal cytosolic preparation. The 598-residue
  Q9RZP7 sequence is also present in ATCC13939K, which retains an intact fruB locus, but native PEP-driven
  uptake in that stock has not been demonstrated.
