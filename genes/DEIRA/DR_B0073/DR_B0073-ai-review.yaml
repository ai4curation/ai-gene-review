  - *id006
  - *id009
  - *id005
suggested_questions:
- question: Does ATCC13939K use its intact FruB for native PEP-driven fructose uptake, and which cytosolic
    activity supports the older ATP-dependent fraction phenotype?
- question: Which of the two predicted EIIB cysteines participates in catalytic transfer, and does either
    repeat instead chiefly support partner recognition?
