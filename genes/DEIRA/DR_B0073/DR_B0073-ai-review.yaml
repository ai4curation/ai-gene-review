core_functions:
- description: Provides the fructose-specific membrane phosphotransfer/translocation component. The EIIB
    phosphocysteine-to-fructose reaction is inferred from conserved type-2 domains and fraction-reconstitution
    evidence; a compatible cytosolic relay is required. The upstream phosphate donor and productive native
    PEP flux remain stock-dependent questions.
  molecular_function: *id010
  directly_involved_in:
