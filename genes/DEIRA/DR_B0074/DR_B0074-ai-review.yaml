id: Q9RZP6
gene_symbol: DR_B0074
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:243230
  label: Deinococcus radiodurans R1 = ATCC 13939 = DSM 20539
description: DR_B0074 encodes a predicted soluble 1-phosphofructokinase that uses ATP to convert fructose
  1-phosphate to fructose 1,6-bisphosphate. It belongs to the PfkB carbohydrate kinase family and lies
  beside the fructose PTS genes. The 315-residue Q9RZP6 sequence is identical to KDR_B0074 in ATCC13939K.
  Substrate assignment is supported by FruK-specific classifications and a curated reaction rule; direct
  kinetic or substrate-panel characterization of this protein has not been established.
