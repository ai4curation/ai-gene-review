- id: PMID:21822900
  title: ATP-dependent fructose uptake system in Deinococcus radiodurans.
  findings:
  - statement: The donor preference in the reported fraction experiments followed the cytosolic source;
      membrane PTS compatibility does not establish direct FruA ATP binding.
    supporting_text: Complementation assays by reconstituting the membrane fraction of D. radiodurans
      to the cytoplasmic fraction of R. capsulatus resulted in a PEP-dependent fructose phosphorylation
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only cache. Publisher article/PDF acquisition returned subscription-preview
      HTML and no accessible author manuscript was found. Use only the explicit fraction-swap result.
      The assayed stock, complete methods and purified-protein attribution could not be independently
      verified. No experimental annotation is removed for inaccessible text; no native ATCC13939K donor
      mechanism is assigned from this source.
- id: PMID:38962131
  title: 'Comparative genomics of Deinococcus radiodurans: unveiling genetic discrepancies between ATCC
    13939K and BAA-816 strains.'
  findings:
  - statement: Resequencing established an intact fru locus and full FruB ORF in ATCC13939K, not a functional
      uptake assay.
    supporting_text: Upon resequencing, a complete coding sequence for FruB (KDR_B0075) was identified
      in ATCC-13939K
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full cached article read, with committed supplementary coordinate/sequence analysis.
      FruA and FruK sequences match Q9RZP7/Q9RZP6 exactly; native donor choice remains untested. The inconsistent
      KDR_B0074 kinase labels in Tables S2/S3 are genome annotations rather than biochemical measurements.
- id: file:DEIRA/DR_B0074/DR_B0074-uniprot.txt
  title: Frozen UniProt Q9RZP6 sequence and curated domain/classification evidence
  findings:
