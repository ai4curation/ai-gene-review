- id: file:analysis/module_audits/bacterial_fructose_pts_catabolism/deinococcus-sequence-bridge.json
  title: Deinococcus ATCC13939K supplementary-coordinate and exact-sequence bridge
  findings:
  - statement: Both target sequences occur exactly in the ATCC13939K assembly.
    supporting_text: Q9RZP7 and Q9RZP6 exactly match the complete FruA and FruK translations despite historical
      strain-label ambiguity.
- id: file:DEIRA/DR_B0073/DR_B0073-source-analysis/evidence-boundaries.md
  title: Deinococcus FruA/FruK identity, accessibility and mechanistic evidence boundaries
  findings:
  - statement: Direct reaction measurements are distinguished from sequence and annotation evidence.
    supporting_text: Exact protein identity does not identify the stock or accessory donor proteins used
      in the older fraction experiment.
core_functions:
- description: Predicted ATP-dependent phosphorylation of fructose 1-phosphate to fructose 1,6-bisphosphate.
    The assignment is grounded in FruK-specific classification and a curated reaction rule; exact sequence
    identity links Q9RZP6 to ATCC13939K KDR_B0074, but neither genome annotation nor the older mixed-fraction
    uptake study is a direct FruK substrate assay.
