id: Q9RSY6
gene_symbol: rpsA
taxon:
  id: NCBITaxon:243230
  label: Deinococcus radiodurans R1
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for Deinococcus radiodurans ribosomal protein bS1, a
  629-aa protein with five tandem S1/OB-fold domains. The GO channel fails on a protein
  whose identity is not in doubt: its top five are misfolded RNA binding, polysome binding
  (obsolete), poly(A) binding, regulation of poly(A) tail shortening and IRES-dependent
  initiation - a set drawn from eukaryotic mRNA metabolism, for a bacterial ribosomal
  protein. None of the annotated functions (mRNA binding, structural constituent of
  ribosome, cytosolic small ribosomal subunit, translation) is recovered in the top 25.
  The free-text channel, on the same query, returns the exact bS1 description ("Binds mRNA;
  thus facilitating recognition of the initiation point ... needed to translate mRNA with a
  short Shine-Dalgarno sequence") at a score of 18.60 against the GO channel's 12.57.
  This is the sharpest GO-versus-free-text dissociation in the benchmark. ProtNLM2 on the
  same protein returned nucleic acid binding and ribosome, both correct.
  Assessment: 0 correct novel (COR), 0 correct not novel (CNN), 1 less precise (LSP),
  1 uncertain (UNC), 1 incorrect (NPI).
source_documents:
  - projects/PROTREK_EVALUATION/argo50_protrek_hits.tsv
  - genes/DEIRA/Q9RSY6/Q9RSY6-uniprot.txt
  - genes/DEIRA/Q9RSY6/Q9RSY6-goa.tsv
predictions:
  - source_method: ProTrek
    source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
    source_reference_id: PMID:41039041
    predicted_term:
      id: GO:0034336
      label: misfolded RNA binding
    predicted_term_type: GO_MF
    review:
      assessment: LSP
      confidence_score: 2
      summary: >-
        Top-ranked hit (score 12.57). RNA binding is correct and is annotated; "misfolded RNA"
        is an RNA-chaperone claim characteristic of CYT-19/DEAD-box helicases, not of bS1.
        Scored LSP because the term is a descendant of the annotated nucleic acid binding and
        a curator climbing to the parent recovers a correct annotation, but the qualifier is
        unsupported. The low absolute score (12.6 against 18.6 for the same query's free-text
        hit) is the signal that the GO channel has not resolved this protein.
      supported_by:
        - reference_id: GO_REF:0000033
          supporting_text: Annotation inferences using phylogenetic trees
  - source_method: ProTrek
    source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
    source_reference_id: PMID:41039041
    predicted_term:
      id: GO:0008143
      label: poly(A) binding
    predicted_term_type: GO_MF
    review:
      assessment: NPI
      confidence_score: 0
      error_type: PARALOG_OVERANNOTATION
      summary: >-
        Rank 3 by score (12.14), reviewed in place of rank 2 whose label ("polysome binding")
        is obsolete in the current GO release. Poly(A) binding is the PABP function; bacterial
        mRNAs are not polyadenylated for translation and bS1 recognises the 5' untranslated
        region, not a 3' poly(A) tail. The shared S1/OB fold between bS1 and eukaryotic
        RNA-binding proteins is the likely route, and it leads to a claim that is wrong in
        both mechanism and taxon.
      supported_by:
        - reference_id: GO_REF:0000033
          supporting_text: Annotation inferences using phylogenetic trees
  - source_method: ProTrek
    source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
    source_reference_id: PMID:41039041
    predicted_term:
      id: GO:0060212
      label: negative regulation of nuclear-transcribed mRNA poly(A) tail shortening
    predicted_term_type: GO_BP
    review:
      assessment: UNC
      confidence_score: 1
      summary: >-
        Rank 4 (score 11.76). A nuclear-transcript deadenylation process, impossible in a
        bacterium, and by this point in the list the scores have fallen far enough that the
        output should be read as no answer rather than as an assertion; recorded as uncertain
        on that basis. The instructive point for the benchmark is that a protein with an
        unambiguous, heavily-annotated identity can still fail completely in the GO channel
        while succeeding in the free-text channel - the failure is not a function of how
        obscure the query is.
      supported_by:
        - reference_id: GO_REF:0000033
          supporting_text: Annotation inferences using phylogenetic trees
