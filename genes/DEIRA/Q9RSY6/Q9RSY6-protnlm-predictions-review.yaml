id: Q9RSY6
gene_symbol: Q9RSY6
taxon:
  id: NCBITaxon:243230
  label: Deinococcus radiodurans R1 = ATCC 13939 = DSM 20539
status: COMPLETE
description: >-
  Q9RSY6 (DR_1983) is the Deinococcus radiodurans bS1 ribosomal protein, in the same PANTHER subfamily
  (PTHR10724:SF7) as E. coli RpsA, with five S1/OB-fold domains, and its purified protein binds RNA in vitro.
  Both ProtNLM2 predictions are correct but less specific than supported annotations the gene already
  carries (mRNA binding; cytosolic small ribosomal subunit).
source_documents:
  - genes/DEIRA/Q9RSY6/Q9RSY6-uniprot.txt
  - genes/DEIRA/Q9RSY6/Q9RSY6-goa.tsv
  - publications/PMID_9451450.md
  - publications/PMID_35856907.md
  - publications/PMID_38474204.md
