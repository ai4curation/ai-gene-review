predictions:
  - source_method: ProtNLM2
    source_version: UniProt 2024_06 pilot
    predicted_term:
      id: GO:0003676
      label: nucleic acid binding
    predicted_term_type: GO_MF
    review:
      assessment: LSP
      confidence_score: 2
      summary: >-
        Nucleic acid binding is correct: Q9RSY6 has five S1/OB-fold single-stranded nucleic acid binding
        domains, sits in the same PANTHER subfamily (PTHR10724:SF7) as E. coli RpsA, whose S1 binds RNA
        (PMID:9451450), and the purified D. radiodurans protein binds RNA oligonucleotides in vitro
        (PMID:35856907). The gene already carries the more specific GO:0003729 mRNA binding (IBA, accepted
        as core in the gene review), a descendant of GO:0003676 (OLS4 ancestry); the gene review refines the
        identical InterPro2GO nucleic acid binding row to mRNA binding. The prediction is supported but less
        precise than the existing annotation.
      supported_by:
        - reference_id: file:DEIRA/Q9RSY6/Q9RSY6-uniprot.txt
          supporting_text: 'PANTHER; PTHR10724:SF7; SMALL RIBOSOMAL SUBUNIT PROTEIN BS1C; 1.'
        - reference_id: file:DEIRA/Q9RSY6/Q9RSY6-uniprot.txt
          supporting_text: 'Pfam; PF00575; S1; 5.'
        - reference_id: PMID:38474204
          supporting_text: >-
            The S1 domain adopts an OB-fold that is highly specific for binding single-stranded nucleic acids
        - reference_id: PMID:35856907
          supporting_text: >-
            all four proteins exhibited higher binding affinity to the 8-oxoG-containing oligoribonucleotide
            than the control oligoribonucleotide
        - reference_id: PMID:9451450
          supporting_text: >-
            The binding of S1 to poly(A) occurred
  - source_method: ProtNLM2
    source_version: UniProt 2024_06 pilot
    predicted_term:
      id: GO:0005840
      label: ribosome
    predicted_term_type: GO_CC
    review:
      assessment: LSP
      confidence_score: 2
      summary: >-
        Ribosome is correct: Q9RSY6 belongs to the bacterial bS1 family (PANTHER PTHR10724:SF7, with E. coli
        RpsA) and bS1 is a component of the 30S subunit, binding it via its N-terminal S1 domains. The gene
        already carries GO:0022627 cytosolic small ribosomal subunit (IBA, accepted in the gene review), and
        GO:0005840 ribosome is an ancestor of that term (OLS4 ancestry). The prediction is supported but less
        precise than the existing annotation.
      supported_by:
        - reference_id: file:DEIRA/Q9RSY6/Q9RSY6-uniprot.txt
          supporting_text: 'SIMILARITY: Belongs to the bacterial ribosomal protein bS1 family.'
        - reference_id: file:DEIRA/Q9RSY6/Q9RSY6-uniprot.txt
          supporting_text: 'InterPro; IPR050437; Ribos_protein_bS1-like.'
        - reference_id: PMID:38474204
          supporting_text: >-
            bS1 binds to the 30S subunit at the final step of the assembly via domains D1–D2 that form
            contacts with r-proteins, especially with uS2
