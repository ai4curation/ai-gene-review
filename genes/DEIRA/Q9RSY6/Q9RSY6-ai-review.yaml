    reason: >-
      Target is inside the bS1 clade that inherited the function (same PANTHER
      subfamily as the experimentally characterised E. coli protein), retains the
      tandem S1 RNA-binding domain architecture, and has its own in vitro RNA
      binding data. Core function.
