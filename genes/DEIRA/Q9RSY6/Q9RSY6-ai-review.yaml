  original_reference_id: GO_REF:0000033
  qualifier: enables
  review:
    summary: >-
      PAINT places mRNA binding at node PTN000076677, seeded by experimental
      annotations of E. coli RpsA (P0AG67), Arabidopsis chloroplast RPS1
      (AT5G30510) and P46837. Q9RSY6 shares PANTHER subfamily PTHR10724:SF7 with
      E. coli RpsA, and has five S1/OB-fold domains of the RNA-binding type. In
      E. coli, bS1 binds single-stranded regions of most leadered mRNAs at the
      first step of initiation; purified D. radiodurans RpsA binds RNA
      oligonucleotides in vitro. mRNA binding is the core molecular activity of
      bS1.
