- id: PMID:35856907
  title: PNPase and RhlB Interact and Reduce the Cellular Availability of Oxidized
    RNA in Deinococcus radiodurans.
  findings:
  - statement: >-
      Purified D. radiodurans RpsA (DR_1983) binds RNA oligonucleotides in vitro,
      with higher affinity for 8-oxoG-containing RNA, though with micromolar Kd
      (much weaker than PNPase or RhlB).
    supporting_text: >-
      RpsA and Rho showed relatively lower affinity to the 8-oxoG-modified
      oligoribonucleotides
  - statement: >-
      rpsA could not be deleted in D. radiodurans, consistent with an essential
      role.
    supporting_text: >-
      deletion of these proteins could not be achieved, likely due to their
      critical roles for cell viability in D. radiodurans
  - statement: >-
      RpsA co-purifies with PNPase in D. radiodurans independently of RNA.
    supporting_text: >-
      RpsA (the ribosomal protein S1) was also found to interact with PNPase in
      D. radiodurans in an RNA-independent fashion
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Only experimental study of the D. radiodurans protein itself (full text
      cached). Provides direct RNA-binding data and essentiality; the oxidized-RNA
      preference is modest and not used as a basis for a separate annotation.
- id: PMID:38474204
  title: Extraribosomal Functions of Bacterial Ribosomal Proteins-An Update, 2023.
  findings:
  - statement: >-
      bS1 recognises and binds mRNAs at the first step of translation initiation
      as a component of the 30S subunit; N-terminal domains anchor it to the
      30S via uS2 and C-terminal domains bind RNA.
    supporting_text: >-
      The two N-terminal S1 domains (D1–D2) lost their RNA-binding functions
      during evolution and acquired an ability to form protein–protein
      interactions, while the C-terminal domains (D3-D6) provide the RNA-binding
      capacity of bS1.
  - statement: >-
      Autogenous repression of rpsA translation is conserved mainly in
      gamma-proteobacteria and is not transferred to D. radiodurans.
    supporting_text: >-
      which are highly conserved in several families of γ-proteobacteria
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Authoritative review of bS1 biology (mostly E. coli), used for the
      family-level mechanism transferred within PANTHER subfamily SF7.
