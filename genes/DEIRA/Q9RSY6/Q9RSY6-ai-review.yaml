id: Q9RSY6
gene_symbol: Q9RSY6
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:243230
  label: Deinococcus radiodurans R1 = ATCC 13939 = DSM 20539
description: >-
  Small ribosomal subunit protein bS1 (30S ribosomal protein S1, RpsA), encoded by
  DR_1983 on chromosome 1 of Deinococcus radiodurans R1, is a 629-residue
  cytoplasmic RNA-binding protein of the 30S ribosomal subunit. It belongs to the
  bacterial bS1 family (PANTHER PTHR10724:SF7, the same subfamily as Escherichia
  coli RpsA) and consists of an approximately 100-residue disordered, polar
  N-terminal extension followed by five tandem S1/OB-fold domains (residues
  122-539) and a disordered Gly-rich C-terminal tail. By homology to E. coli bS1,
  the N-terminal S1 domains anchor the protein to the 30S platform (via uS2),
  while the more C-terminal S1 domains bind single-stranded regions of mRNA
  leaders upstream of the Shine-Dalgarno element, recruiting and unfolding mRNAs
  so that they can be positioned on the 30S subunit at the start of translation
  initiation. In D. radiodurans itself, purified RpsA binds RNA oligonucleotides
  in vitro, with a modest preference (micromolar Kd) for 8-oxoguanine-containing
  RNA, co-purifies with polynucleotide phosphorylase independently of RNA, and the
  gene could not be deleted, consistent with an essential role.
