suggested_questions:
- question: >-
    Should bacterial bS1 orthologs carry GO:0006413 translational initiation? E.
    coli RpsA has no such annotation in GOA and PAINT propagated only
    GO:0006412 translation, although bS1's mechanistic role is at the
    mRNA-recruitment step of initiation.
- question: >-
    Is the micromolar-affinity preference of D. radiodurans RpsA for
    8-oxoguanine-containing RNA physiologically relevant, or a general property
    of its single-stranded RNA binding?
- question: >-
    Does the D. radiodurans-specific ~100-residue disordered N-terminal
    extension, absent from E. coli bS1, alter how the protein anchors to the 30S
    subunit?
suggested_experiments:
- description: >-
    Cryo-EM of D. radiodurans 30S or 70S initiation complexes with mRNA to locate
    bS1, test whether its N-terminal S1 domain contacts uS2 as in E. coli, and
    map the five S1 domains onto the mRNA path.
  experiment_type: cryo-EM structural analysis
- description: >-
    Conditional depletion of RpsA (the gene appears essential) followed by
    ribosome profiling to measure dependence of leadered versus leaderless mRNA
    translation on bS1 in D. radiodurans.
  experiment_type: ribosome profiling
