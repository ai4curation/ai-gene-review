  label: Mycolicibacterium smegmatis MC2 155
description: NirB is the 859-residue catalytic large-subunit homolog of the NAD(P)H-linked nitrite reductase
  in Mycolicibacterium smegmatis. It combines an N-terminal pyridine-nucleotide/FAD-binding region with
  a conserved siroheme/[4Fe-4S] catalytic region and is associated with the neighboring NirD-family small
  subunit MSMEG_0428. Family and conserved-site assignments support reduction of nitrite to ammonium in
  nitrogen assimilation, and native nitrogen-limitation studies place nirBD under GlnR control. The precise
  physiological donor preference and cofactor occupancy of purified mc2 155 NirBD remain unmeasured in
  the sources examined.
