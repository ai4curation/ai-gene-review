  label: Mycolicibacterium smegmatis MC2 155
description: MetE/MSMEG_6638 is the full-length, cobalamin-independent methionine synthase of Mycolicibacterium
  smegmatis mc²155. Its folate- and homocysteine-binding architecture supports zinc-dependent transfer
  of a methyl group from methyltetrahydrofolate to homocysteine, producing methionine. Unlike compact
  MesD or MesB proteins, it contains the canonical N-terminal folate-associated and C-terminal catalytic
  domains. Endogenous cobalamin represses its expression through a riboswitch, favoring the alternative
  MetH route; when cobalamin synthesis is disabled, MetE can sustain methionine biosynthesis.
