  label: Mycolicibacterium smegmatis MC2 155
description: NasN is a 1351-residue cytoplasmic assimilatory nitrate reductase in Mycolicibacterium smegmatis
  mc2 155. It reduces nitrate to nitrite using electrons supplied preferentially by NADPH; purified enzyme
  also turns over with NADH at substantially lower activity. A molybdopterin-containing catalytic region
  with a [4Fe-4S] center is fused to a diflavin electron-transfer region, and the purified protein behaves
  as a monomer. NasN enables aerobic growth with nitrate as the nitrogen source. The enzyme is oxygen-sensitive
  in vitro, although it tolerates oxygen exposure better than the heterodimeric nitrate reductase tested
  as a comparator.
