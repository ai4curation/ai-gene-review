- id: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC7152768/?report=xml
  title: A recently evolved diflavin-containing monomeric nitrate reductase is responsible for highly
    efficient bacterial nitrate assimilation
  findings:
  - statement: Purified NasN is NADPH-preferred but also uses NADH.
    supporting_text: Among the physiological electron donors tested for the purified NasN, NADPH was preferred
      over NADH, as shown by a 26-fold greater activity with NADPH relative to NADH
  - statement: Native nasN loss disrupts nitrate-supported growth.
    supporting_text: the disruption of Msmeg_4206 caused a totally impaired growth of the resulting strain
      in minimal medium with nitrate as the sole nitrogen source
  - statement: Native-gene complementation restores nitrate use.
    supporting_text: This growth defect and the inability to utilize nitrate of the Msmeg_4206-null mutant
      in the nitrate-containing minimal medium were rescued when a copy of the prototype Msmeg_4206 was
      introduced into the mutant
  - statement: The activity is detected in native cytoplasmic fractions.
    supporting_text: when NADPH was used as an electron donor, both cytoplasmic fractions from M. smegmatis
      WT and narG-null mutant showed similar detectable NaR activity, but not that of the nasN-null mutant
  - statement: Reconstituted NasN contains one [4Fe-4S] center per monomer.
    supporting_text: indicating the presence of one [4Fe-4S] cluster in each NasN monomer
  - statement: FMN/FAD supplementation enhances enzyme activity.
    supporting_text: both flavins could significantly enhance the NADPH-dependent activity of NasN
  - statement: The purified protein behaves as a monomer by size exclusion.
    supporting_text: an apparent molecular mass of ∼147 kDa was observed for this protein
  - statement: Oxygen tolerance is relative, not oxygen insensitivity.
    supporting_text: NasN was shown to be oxygen-sensitive, as air-exposure of the purified enzyme resulted
      in a significant decrease in both NADPH- and NADH-dependent NaR activities
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full primary article corresponding to PMID32111737, recovered through the normal PMC
      URL fetch. Native mc2 155 genetics and purified heterologously expressed NasN support the stated
      claims. NasN sequence identity is independently reconciled. Comparator NasAC is Amycolatopsis mediterranei,
      not Pseudomonas PP_1703.
