- term:
    id: GO:0051537
    label: 2 iron, 2 sulfur cluster binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR036922
  review:
    summary: A generic Rieske-fold match does not establish a two-iron cofactor in this NirD protein.
    action: MARK_AS_OVER_ANNOTATED
    reason: The target belongs to the specific NirD subgroup. The characterized M. tuberculosis NirD homolog
      has a Rieske-like fold but no Fe-S cluster or other electron-transfer cofactor. Thus transfer of
      two-iron binding from the broad InterPro superfamily exceeds the evidence. The homolog result does
      not experimentally establish cofactor absence in MSMEG_0428; native occupancy remains unresolved.
      The target sequence contains three cysteines (22, 79, 98) and two histidines (15, 54), so residue
      totals do not exclude a canonical ligand set as they do for PSEPK NirD. Counts alone also do not
      establish the ligand geometry or cofactor occupancy; MARK_AS_OVER_ANNOTATED remains appropriate.
    supported_by:
    - reference_id: file:MYCS2/MSMEG_0428/MSMEG_0428-uniprot.txt
      record_section:
      - DR:NCBIfam
      supporting_text: NCBIfam; TIGR02378; nirD_assim_sml; 1.
