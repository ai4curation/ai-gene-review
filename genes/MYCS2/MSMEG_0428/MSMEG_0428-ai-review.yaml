core_functions:
- description: Contributes as the NirD-family small subunit to the NirB-associated nitrite-to-ammonium
    system used in nitrogen assimilation. The functional role is inferred from specific family assignment
    and native nirBD regulation; independent small-subunit catalysis and a native Fe-S cofactor are not
    asserted.
