  review:
    summary: The NirD-family small subunit contributes to NAD(P)H-linked nitrite reductase activity.
    action: ACCEPT
    reason: NirD-specific NCBIfam/PROSITE assignments and native nirBD expression support an accessory
      contribution to the assembled enzyme. This does not claim that the isolated small subunit performs
      the catalytic reaction, and lack of an independent active site is not a reason to discard a complex
      contribution. Exact donor preference and the molecular contribution in the native target remain
      unmeasured.
