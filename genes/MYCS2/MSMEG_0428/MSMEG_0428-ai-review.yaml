    label: nitrate assimilation
  evidence_type: IC
  original_reference_id: DOI:10.1186/1471-2164-14-301
  qualifier: involved_in
  review:
    action: NEW
    summary: Infer participation as the conserved NirD-family component of the native assimilatory nitrite-reductase
      system.
    reason: Specific NirD-family classifications identify an enzyme component that contributes to the
      nitrite-to-ammonium step, rather than a consumed substrate or an unrelated necessary regulator.
      Native paired nirBD expression under nitrogen limitation and the identified MSMEG_0427-0428 subunit
      cluster place that conserved role in nitrogen assimilation. This is an explicit family-role plus
      native-context inference, weaker than a target-specific small-subunit activity experiment; precise
      native assembly and subunit requirement remain unmeasured. Exact process annotations are absent
      on the E. coli, Pseudomonas and Bacillus small-subunit comparators, so annotation absence is not
      treated as an obvious oversight. The proposal instead rests on the independent mechanistic role
      and context; process annotation to enzyme components is supported by the NasB comparator and is
      not excluded by the term definition. No process ancestor/descendant redundancy or target GO-CAM
      record was found.
    supported_by:
    - reference_id: file:MYCS2/MSMEG_0428/MSMEG_0428-uniprot.txt
      record_section:
      - DR:NCBIfam
      supporting_text: NCBIfam; TIGR02378; nirD_assim_sml; 1.
    - reference_id: file:MYCS2/MSMEG_0428/MSMEG_0428-uniprot.txt
      record_section:
