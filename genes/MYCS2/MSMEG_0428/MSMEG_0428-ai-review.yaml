      record_section:
      - DR:PROSITE
      supporting_text: PROSITE; PS51300; NIRD; 1.
    - reference_id: PMID:22965870
      supporting_text: it does not contain any Fe-S cluster or other cofactors that might be involved
        in electron transfer.
    - reference_id: file:PSEPK/nirD/nirD-source-analysis/RESULTS.md
      supporting_text: A0QPK3 Cys22/Cys79/Cys98 and His15/His54
- term:
