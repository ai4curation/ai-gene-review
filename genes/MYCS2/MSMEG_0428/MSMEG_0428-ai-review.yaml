  label: Mycolicibacterium smegmatis MC2 155
description: MSMEG_0428 encodes a 122-residue NirD-family small subunit associated with the NirB nitrite
  reductase of Mycolicibacterium smegmatis. The adjacent nirBD genes are controlled by the nitrogen-response
  regulator GlnR. Specific sequence-family assignments support a contribution to reduction of nitrite
  to ammonium by the assembled pyridine-nucleotide-linked complex. The small subunit has a Rieske-like
  fold, but its native cofactor content and precise molecular role have not been experimentally established.
