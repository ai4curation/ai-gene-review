  label: Mycolicibacterium smegmatis MC2 155
description: MetH/MSMEG_4185 is the cobalamin-dependent methionine synthase of Mycolicibacterium smegmatis mc²155. It transfers methyl groups from methyltetrahydrofolate to homocysteine through an enzyme-bound cobalamin intermediate, producing methionine and tetrahydrofolate. Its modular protein contains homocysteine-, folate-, cobalamin- and SAM-associated regions; zinc supports activation of homocysteine. In the native strain, endogenous cobalamin suppresses the alternative MetE route, making MetH necessary under the tested conditions. Disabling cobalamin synthesis relieves that dependence by permitting MetE use.
