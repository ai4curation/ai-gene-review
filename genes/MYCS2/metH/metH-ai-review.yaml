- id: PMID:9201956
  title: Cobalamin-dependent methionine synthase is a modular protein with distinct regions for binding homocysteine, methyltetrahydrofolate, cobalamin, and adenosylmethionine.
  publication_type: PRIMARY_RESEARCH
  full_text_unavailable: true
  findings:
  - statement: Canonical MetH uses a methylcobalamin intermediate and distinct substrate/cofactor modules; this is homolog mechanistic evidence.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only modular enzymology; source fragments and residues are not presented as assayed MYCS2 constructs.
- id: PMID:33468593
  title: De Novo Cobalamin Biosynthesis, Transport, and Assimilation and Cobalamin-Mediated Regulation of Methionine Biosynthesis in Mycobacterium smegmatis.
  publication_type: PRIMARY_RESEARCH
  full_text_unavailable: false
  findings:
  - statement: Native M. smegmatis mc²155 cobalamin synthesis suppresses MetE and conditions dependence on MetH; B12-deficient backgrounds change route availability.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full source read. The experiments use M. smegmatis mc²155 and explicitly reference CP000480.1. The cloning methods name MSMEG_4185 as metH. The paper names metE but does not independently give its locus number; the MSMEG_6638/A0R6Q9 bridge uses the official reference-genome entry. No ADP1 or M. tuberculosis phenotype is assigned to these targets. The authorship correction PMID:35289639 does not change the functional result.
