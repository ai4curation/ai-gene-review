knowledge_gaps:
- gap_statement: >-
    The S. stercoralis beta-tubulin isotype that forms the benzimidazole-engaged
    microtubule target has not been genetically identified.
  boundary: >-
    Q4KS25 is the cloned btub sequence from a Strongyloides
    benzimidazole-resistance marker study, and polymorphisms in beta-tubulin
    codons 167, 198 and 200 were chosen for resistance surveillance. The cached
    literature does not show a Q4KS25 loss-of-function, allele-swap, expression
    or resistance-mapping experiment that separates this isotype from other
    S. stercoralis beta-tubulins.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    Resolving the drug-sensitive Strongyloides beta-tubulin isotype would
    define the on-target microtubule species for benzimidazole response and
    resistance surveillance.
  resolution: >-
    Compare isotype-resolved expression, beta-tubulin codon-167/198/200
    haplotypes and benzimidazole sensitivity across Strongyloides isolates,
    then test candidate beta-tubulins by targeted perturbation or allele
    replacement where the parasite genetics permit it.
  provenance:
  - reference_id: PMID:16309677
    supporting_text: >-
      Resistance to these drugs has been associated with polymorphisms in the
      beta-tubulin gene.
    full_text_unavailable: true
suggested_questions:
- question: >-
    Which S. stercoralis beta-tubulin paralog or paralogs are expressed in
    benzimidazole-sensitive microtubules, and is BTUB/Q4KS25 the isotype whose
    codon-167/198/200 haplotype best tracks Strongyloides drug response?
suggested_experiments:
- description: >-
    Map Q4KS25-specific sequence markers onto the current Strongyloides
    beta-tubulin repertoire and compare isoform-resolved beta-tubulin
    expression in susceptible, benzimidazole-exposed and refractory
    Strongyloides isolates.
  hypothesis: >-
    Only a subset of Strongyloides beta-tubulin isotypes constitutes the
    benzimidazole-sensitive microtubule pool, and Q4KS25-like BTUB may be one
    such isotype.
  experiment_type: comparative genomics and expression profiling
