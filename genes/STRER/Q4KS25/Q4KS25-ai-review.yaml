id: Q4KS25
gene_symbol: btub
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6248
  label: Strongyloides stercoralis
description: >-
  BTUB is a full-length beta-tubulin from the human threadworm Strongyloides
  stercoralis. It carries the conserved Tubulin/FtsZ GTPase and C-terminal
  beta-tubulin domains needed to heterodimerize with alpha-tubulin and supply
  the beta structural subunit of microtubules. The Q4KS25 cDNA was cloned in a
  Strongyloides beta-tubulin benzimidazole-resistance marker study, but its
  direct contribution to Strongyloides benzimidazole susceptibility has not
  been genetically tested.
