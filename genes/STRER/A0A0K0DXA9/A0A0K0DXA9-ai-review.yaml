knowledge_gaps:
- gap_statement: >-
    The beta-tubulin isotype or isotypes that form the S. stercoralis
    benzimidazole-engaged microtubule target have not been genetically
    identified.
  boundary: >-
    A0A0K0DXA9 is a predicted WormBaseParasite beta-tubulin entry. Its
    expression, isotype-level relationship to the cloned Strongyloides BTUB
    beta-tubulin, and direct contribution to the benzimidazole-sensitive
    microtubule pool have not been experimentally resolved.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    Resolving the drug-sensitive Strongyloides beta-tubulin isotype would
    define the on-target microtubule species for benzimidazole response and
    resistance surveillance.
  resolution: >-
    Reconcile the predicted S. stercoralis beta-tubulin repertoire with cloned
    sequences, then compare isotype-resolved expression, beta-tubulin
    codon-167/198/200 haplotypes and benzimidazole sensitivity across
    Strongyloides isolates.
suggested_questions:
- question: >-
    Does A0A0K0DXA9 encode a beta-tubulin isotype in the S. stercoralis
    benzimidazole-sensitive microtubule pool, or is it a paralog that is
    separated from the BTUB/Q4KS25 marker sequence?
suggested_experiments:
- description: >-
    Map A0A0K0DXA9 and the cloned BTUB/Q4KS25 sequence onto the current
    S. stercoralis beta-tubulin gene set, then compare isoform-resolved
    beta-tubulin expression in susceptible, benzimidazole-exposed and
    refractory Strongyloides isolates.
  hypothesis: >-
    Only a subset of Strongyloides beta-tubulin isotypes constitutes the
    benzimidazole-sensitive microtubule pool.
  experiment_type: comparative genomics and expression profiling
