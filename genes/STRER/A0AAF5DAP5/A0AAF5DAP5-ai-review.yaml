knowledge_gaps:
- gap_statement: >-
    The beta-tubulin isotype or isotypes that form the S. stercoralis
    benzimidazole-engaged microtubule target have not been genetically
    identified.
  boundary: >-
    A0AAF5DAP5 is a predicted S. stercoralis beta-tubulin candidate from a
    WBParaSite transcript, not the cloned BTUB/Q4KS25 beta-tubulin, and its
    modeled N terminus appears to be five residues overextended. The
    literature codon names F167/E198/F200 correspond to Q4KS25 F168/E199/F201
    and then to A0AAF5DAP5 F173/E204/F206, but A0AAF5DAP5-specific expression
    and direct contribution to the drug-sensitive microtubule pool have not
    been experimentally resolved.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    Resolving the drug-sensitive Strongyloides beta-tubulin isotype would
    define the on-target microtubule species for benzimidazole response and
    resistance surveillance.
  resolution: >-
    Compare A0AAF5DAP5-specific expression, haplotypes at the
    benzimidazole-resistance-associated beta-tubulin codons, and benzimidazole
    sensitivity across Strongyloides isolates, then test candidate
    beta-tubulins by targeted perturbation or allele replacement where the
    parasite genetics permit it.
  provenance:
  - reference_id: PMID:16309677
    supporting_text: >-
      Our genotyping test allows the identification of polymorphisms at codons
      167, 198, and 200 in the Strongyloides beta-tubulin gene, thus enabling
      survey for BZ resistant genotypes.
    full_text_unavailable: true
suggested_questions:
- question: >-
    Is A0AAF5DAP5 expressed in the cells and life stages that carry
    benzimidazole-sensitive S. stercoralis microtubules, and do its A0AAF5DAP5
    F173/E204/F206 residues equivalent to Q4KS25 F168/E199/F201 vary in
    refractory Strongyloides isolates?
suggested_experiments:
- description: >-
    Use isotype-specific markers that distinguish A0AAF5DAP5 from the cloned
    BTUB/Q4KS25 sequence and other predicted S. stercoralis beta-tubulins to
    compare beta-tubulin expression and F173/E204/F206 haplotypes at the
    residues equivalent to Q4KS25 F168/E199/F201 in susceptible,
    benzimidazole-exposed and refractory Strongyloides isolates.
  hypothesis: >-
    Only a subset of Strongyloides beta-tubulin isotypes constitutes the
    benzimidazole-sensitive microtubule pool.
  experiment_type: comparative genomics and expression profiling
