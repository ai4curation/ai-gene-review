- id: PMID:16309677
  title: The beta-tubulin genes of two Strongyloides species.
  full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      The cached PubMed record is abstract-only, so this review uses it for
      Strongyloides beta-tubulin benzimidazole-resistance codon context, not
      for A0AAF5DAP5-specific protein-level activity or direct drug-binding
      evidence.
  findings:
  - statement: >-
      Melville, Sykes and McCarthy cloned and sequenced Strongyloides
      stercoralis and S. ratti beta-tubulin genes and developed a genotyping
      assay for single-worm beta-tubulin polymorphism detection.
    supporting_text: >-
      We have cloned and sequenced the beta-tubulin genes of Strongyloides
      stercoralis and Strongyloides ratti and have proceeded to develop a
      protocol for genotyping single worms for polymorphisms in beta-tubulin.
  - statement: >-
      Their Strongyloides beta-tubulin genotyping assay was designed to
      identify polymorphisms at the benzimidazole-resistance-associated codons
      167, 198 and 200.
    supporting_text: >-
      Our genotyping test allows the identification of polymorphisms at codons
      167, 198, and 200 in the Strongyloides beta-tubulin gene, thus enabling
      survey for BZ resistant genotypes.
