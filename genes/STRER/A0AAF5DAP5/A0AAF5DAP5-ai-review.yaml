id: A0AAF5DAP5
gene_symbol: A0AAF5DAP5
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6248
  label: Strongyloides stercoralis
description: >-
  A0AAF5DAP5 is a WormBaseParasite-predicted Strongyloides stercoralis
  beta-tubulin chain. It has the conserved Tubulin/FtsZ GTPase and C-terminal
  beta-tubulin domains needed to heterodimerize with alpha-tubulin and supply
  beta subunits to the microtubule lattice. Its assignment to the
  benzimidazole-engaged Strongyloides beta-tubulin isotype pool has not been
  experimentally resolved.
gene_model_issues:
- issue_type: WRONG_START_SITE
  status: SUSPECTED
  description: >-
    The WBParaSite TCONS_00009497.p1 model begins with LFNII before the
    beta-tubulin MREIV start conserved in the cloned Q4KS25/BTUB sequence and
    in the A0A0K0DXA9 and A0A0K0EJ28 predicted S. stercoralis beta-tubulins;
    position 1 is Leu rather than an initiator Met. All residue coordinates in
    this review that name the A0AAF5DAP5 modeled sequence are therefore offset
    by five residues relative to the likely real protein start.
  reviewed_segment: 6-450
  evidence_types:
  - ORTHOLOG_COMPARISON
  supported_by:
  - reference_id: file:genes/STRER/A0AAF5DAP5/A0AAF5DAP5-bioinformatics/RESULTS.md
    supporting_text: >-
      Q4KS25, A0A0K0DXA9 and A0A0K0EJ28 all start at the conserved
      beta-tubulin MREIV sequence, while A0AAF5DAP5 starts with five
      additional modeled residues, LFNII, before the same MREIV sequence.
