descriptions:
- source: UniProt
  text: Serine/threonine-protein kinase which regulates mRNA translation (PubMed:17266680).
    Negatively regulates lifespan and resistance to starvation, oxidative stress,
    protein aggregation and P.aeruginosa-mediated infection (PubMed:17266680, PubMed:23879233,
    PubMed:24332851). May regulate these processes by preventing the activation of
    transcription factor hif-1 (PubMed:23879233). Required, probably downstream of
    let-363/TOR, for the establishment of the proper number of germline progenitors
    by promoting cell cycle progression and preventing differentiation during larval
    development. Regulates germ cell size (PubMed:22278922). In addition required
    for sperm production and embryo viability (PubMed:17266680, PubMed:22278922).
    Involved in axon regeneration of PLM and ALM neurons by inhibiting growth cone
    formation early after axotomy and later by inhibiting axon extension. Functions
    in axon regeneration and lifespan probably by preventing aak- 2/AMPK activation
    (PubMed:24332851, PubMed:24431434). Negatively regulates autophagy (PubMed:22560223).
