gene_symbol: rsks-1
organism: worm
uniprot_id: Q9NAH6
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Serine/threonine-protein kinase which regulates mRNA translation (PubMed:17266680).
    Negatively regulates lifespan and resistance to starvation, oxidative stress,
    protein aggregation and P.aeruginosa-mediated infection (PubMed:17266680, PubMed:23879233,
    PubMed:24332851). May regulate these processes by preventing the activation of
    transcription factor hif-1 (PubMed:23879233). Required, probably downstream of
    let-363/TOR, for the establishment of the proper number of germline progenitors
    by promoting cell cycle progression and preventing differentiation during larval
    development. Regulates germ cell size (PubMed:22278922). In addition required
    for sperm production and embryo viability (PubMed:17266680, PubMed:22278922).
    Involved in axon regeneration of PLM and ALM neurons by inhibiting growth cone
    formation early after axotomy and later by inhibiting axon extension. Functions
    in axon regeneration and lifespan probably by preventing aak- 2/AMPK activation
    (PubMed:24332851, PubMed:24431434). Negatively regulates autophagy (PubMed:22560223).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q9NAH6
  source_id: Q9NAH6
- source: Alliance_Imported
  text: rsks-1 encodes a putative ribosomal protein S6 kinase (S6K) requiredadditively
    with IFG-1 for normally high levels of protein synthesis, andfor normally short
    lifespan; RSKS-1's effect on lifespan is independentof DAF-16, ISP-1, and SIR-2.1,
    and does not correlate with jugloneresistance, but does correlate with abnormally
    high resistance tostarvation and (perhaps) thermotolerance; RSKS-1 is required
    for normaljuglone resistance, as well as normally rapid growth and normal broodsizes;
    RSKS-1 is expressed in E-lineage embryonic cells, and inpharyngeal and hypodermal
    cells of larvae and adults; RSKS-1 isorthologous to human RPS6KB1 (OMIM:608938)
    and RPS6KB2 (OMIM:608939).
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00012929;class=Gene
  source_id: WB:WBGene00012929
- source: Alliance_Automated
  text: Predicted to enable protein serine/threonine kinase activity. Involved in
    determination of adult lifespan; nematode larval development; and positive regulation
    of autophagosome assembly. Located in perikaryon. Is expressed in several structures,
    including Eal; Eala; Ealaa; Ealp; and Ear. Orthologous to several human genes
    including RPS6KB2 (ribosomal protein S6 kinase B2).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00012929;class=Gene
  source_id: WB:WBGene00012929
- source: RefSeq
  text: Predicted to enable protein serine/threonine kinase activity. Involved in
    determination of adult lifespan; nematode larval development; and positive regulation
    of autophagosome assembly. Predicted to be located in axon and perikaryon. Predicted
    to be active in cytoplasm and nucleoplasm. Is expressed in several structures,
    including Eal; Eala; Ealaa; Ealp; and Ear. Orthologous to several human genes
    including RPS6KB2 (ribosomal protein S6 kinase B2). [provided by Alliance of Genome
