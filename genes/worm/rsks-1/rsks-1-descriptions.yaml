- source: Alliance_Imported
  text: rsks-1 encodes a putative ribosomal protein S6 kinase (S6K) requiredadditively
    with IFG-1 for normally high levels of protein synthesis, andfor normally short
    lifespan; RSKS-1's effect on lifespan is independentof DAF-16, ISP-1, and SIR-2.1,
    and does not correlate with jugloneresistance, but does correlate with abnormally
    high resistance tostarvation and (perhaps) thermotolerance; RSKS-1 is required
    for normaljuglone resistance, as well as normally rapid growth and normal broodsizes;
    RSKS-1 is expressed in E-lineage embryonic cells, and inpharyngeal and hypodermal
    cells of larvae and adults; RSKS-1 isorthologous to human RPS6KB1 (OMIM:608938)
    and RPS6KB2 (OMIM:608939).
