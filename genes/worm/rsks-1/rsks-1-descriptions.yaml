  text: Predicted to enable protein serine/threonine kinase activity. Involved in
    determination of adult lifespan; nematode larval development; and positive regulation
    of autophagosome assembly. Located in perikaryon. Is expressed in several structures,
    including Eal; Eala; Ealaa; Ealp; and Ear. Orthologous to several human genes
    including RPS6KB2 (ribosomal protein S6 kinase B2).
