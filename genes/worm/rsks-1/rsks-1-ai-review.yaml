gene_symbol: rsks-1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: rsks-1 (Y47D3A.16) encodes RSKS-1, the sole Caenorhabditis elegans ortholog of the p70 ribosomal
  protein S6 kinase (S6K), a 550-residue AGC-family serine/threonine kinase with an N-terminal kinase
  domain, an AGC-kinase C-terminal domain carrying the TOR-site hydrophobic-motif threonine (T404) and
  a disordered C-terminal tail. RSKS-1 acts as a downstream effector of TORC1 (LET-363/TOR with DAF-15/RAPTOR),
  coupling nutrient and amino-acid signals to protein synthesis and growth. Loss of rsks-1 lowers protein
  synthesis, slows development, reduces brood size and extends adult lifespan and stress resistance through
  PHA-4/FoxA, HSF-1, AAK-2/AMPK and germline signalling. It acts germline-autonomously to expand the larval
  germline progenitor pool, promoting cell cycle progression and the proliferative fate, and cell-autonomously
  in touch neurons, where it is found in the perikaryon and axon, to restrain axon regeneration after
  injury via AAK-2. Adult knockdown reduces autophagy.
