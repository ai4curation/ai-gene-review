core_functions:
- description: AGC-family serine/threonine protein kinase (p70 S6 kinase ortholog) acting as a downstream
    effector of TORC1, coupling nutrient signals to protein synthesis, growth and germline progenitor
    proliferation; requires the TOR-site T404.
  molecular_function:
    id: GO:0004674
    label: protein serine/threonine kinase activity
  directly_involved_in:
  - id: GO:0038202
    label: TORC1 signaling
  locations:
  - id: GO:0005737
    label: cytoplasm
  supported_by:
  - reference_id: file:worm/rsks-1/rsks-1-uniprot.txt
    record_section:
    - CC:SIMILARITY
    supporting_text: Belongs to the protein kinase superfamily. AGC Ser/Thr protein kinase family. S6
      kinase subfamily.
  - reference_id: PMID:22278922
    supporting_text: rsks-1 (S6K) acts downstream of let-363 (TOR) and daf -15 (RAPTOR) for proper larval
      expansion of the germline progenitor pool
  - reference_id: PMID:22278922
    supporting_text: the T404A transgene did not rescue the germline phenotype of rsks-1(sv31)
  - reference_id: PMID:18804378
    supporting_text: rsks-1/S6 kinase and ife-2/eIF4E each promoted protein biosynthesis, but neither
