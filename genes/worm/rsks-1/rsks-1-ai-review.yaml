suggested_questions:
- question: Which proteins does RSKS-1 phosphorylate in vivo? Is ribosomal protein S6 (RPS-6) a direct
    substrate in C. elegans, and do distinct substrates mediate its lifespan, germline and axon-regeneration
    roles?
- question: Does RSKS-1 promote or inhibit autophagy? Robida-Stubbs et al. (PMID:22560223) report reduced
    LGG-1 puncta after rsks-1 RNAi, whereas the UniProt entry states the reverse and Sheaffer et al. report
    no change in mutants.
- question: What experiment underlies the NOT 'determination of adult lifespan' annotation from PMID:17277769,
    given the consistent lifespan extension reported elsewhere?
suggested_experiments:
- description: In vitro kinase assay with immunopurified RSKS-1 (wild type, K115Q, T404A, T404E) on RPS-6
    peptides, plus phospho-RPS-6 immunoblots in rsks-1 mutants and let-363/daf-15 RNAi worms.
  hypothesis: RSKS-1 is a TORC1-activated kinase that directly phosphorylates RPS-6, and T404 phosphorylation
    is required for its activity.
- description: Phosphoproteomics comparing wild type and rsks-1(ok1255) germline and neurons to identify
    tissue-specific RSKS-1 substrates.
  hypothesis: Distinct RSKS-1 substrates mediate germline proliferation, lifespan and axon regeneration
    phenotypes.
