    action: KEEP_AS_NON_CORE
    summary: rsks-1 mutations suppress the larval lethality of pha-4 loss, and rsks-1 RNAi (like raga-1/rheb-1
      RNAi) blocks the nprl-3 rescue of elo-5 L1 arrest; RSKS-1 acts as a TORC1 output that promotes larval
      growth.
    reason: Genetic-interaction evidence places RSKS-1 in the nutrient/TORC1 control of postembryonic
      development, but rsks-1 is not itself required to complete larval development (mutants are slow-growing
      but viable). The term is a broad developmental process downstream of the core signalling role, so
