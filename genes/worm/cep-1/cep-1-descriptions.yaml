descriptions:
- source: UniProt
  text: Transcriptional activator that binds the same DNA consensus sequence as p53
    (PubMed:11696333, PubMed:15242600, PubMed:28560849). Has a role in normal development
    to ensure proper meiotic chromosome segregation (PubMed:11557844, PubMed:12445383).
    Promotes apoptosis under conditions of cellular and genotoxic stress in response
    to DNA damage, hypoxia, or starvation (PubMed:11557844, PubMed:11696333, PubMed:12445383,
    PubMed:15273685, PubMed:17186023, PubMed:18836529, PubMed:21901106). Regulates
    germline apoptosis in response to DNA damage (PubMed:11696333, PubMed:15273685,
    PubMed:15707894, PubMed:16319925, PubMed:17186023, PubMed:17276923, PubMed:17347667,
    PubMed:19015549, PubMed:26598553). Its pro-apoptotic activity is inhibited when
    bound to ape-1 in vitro (PubMed:12524540). Plays a role in cell cycle arrest in
    the germline in response to DNA damage by UV-C light (PubMed:17347667). However,
    not required for survival in response to DNA damage induced by UV-C light, indicating
    that it is unlikely to be involved in DNA repair (PubMed:17347667). Required for
    induction of ced-13 in response to DNA damage (PubMed:15605074). Regulates DNA
    damage-induced apoptosis by inducing transcription of the programmed cell death
    activator egl-1 (PubMed:12445383, PubMed:19521535). Regulates germline proliferation
    by activating phg-1 (PubMed:17186023). Modulates lifespan (PubMed:17895432, PubMed:18836529,
    PubMed:28560849).
