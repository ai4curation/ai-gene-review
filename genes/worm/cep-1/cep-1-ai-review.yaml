- term:
    id: GO:0008630
    label: intrinsic apoptotic signaling pathway in response to DNA damage
  evidence_type: IMP
  original_reference_id: PMID:19521535
  qualifier: involved_in
  review:
    summary: The PRMT-5/CBP-1 evidence concerns CEP-1-dependent DNA-damage apoptosis and can be represented with the 
      p53-class mediator child term.
    action: MODIFY
    reason: Loss of prmt-5 increases ionizing-radiation-induced germ-cell apoptosis through CEP-1-dependent egl-1 
      transcription. Because CEP-1 is the p53-family transcriptional effector in this pathway, the p53-specific 
      DNA-damage intrinsic apoptosis term is more precise than its parent.
    proposed_replacement_terms:
    - id: GO:0042771
      label: intrinsic apoptotic signaling pathway in response to DNA damage by p53 class mediator
    supported_by:
    - reference_id: PMID:19521535
      supporting_text: "PRMT-5 forms a complex with both CEP-1 and\nCBP-1 and can methylate the latter"
      reference_section_type: ABSTRACT
    - reference_id: PMID:19521535
      supporting_text: "PRMT-5 likely represses CEP-1\ntranscriptional activity through CBP-1"
      reference_section_type: ABSTRACT
