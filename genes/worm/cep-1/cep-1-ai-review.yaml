    label: response to oxidative stress
  evidence_type: IMP
  original_reference_id: PMID:18836529
  qualifier: involved_in
  review:
    summary: CEP-1 is genetically required for the oxidative-stress resistance caused by smg-1 inactivation, but the 
      evidence is an epistasis endpoint.
    action: MARK_AS_OVER_ANNOTATED
    reason: The SMG-1 study showed that smg-1 inactivation confers paraquat resistance in a daf-18-, daf-16-, and 
      cep-1-dependent pathway. That places CEP-1 in the longevity/stress-resistance network but does not show that CEP-1
      itself directly executes an oxidative-stress response.
