suggested_questions:
- question: Which CEP-1 targets mediate the hypoxia, starvation, oxidative-stress, and lifespan phenotypes, and are they
    direct transcriptional targets rather than indirect organismal stress readouts?
  experts:
  - Rothman JH
  - Derry WB
  - Solari F
- question: Is the PRMT-5/CBP-1/CEP-1 complex a stable endogenous transcription repressor complex at egl-1 and ced-13 
    promoters, or a transient regulatory assembly on CEP-1?
  experts:
  - Yang C
suggested_experiments:
- hypothesis: A compact, stress-specific subset of CEP-1 genomic binding events drives DNA-damage apoptosis while other 
    CEP-1 targets drive non-apoptotic stress and lifespan outputs.
  description: Perform CEP-1 ChIP-seq or CUT&RUN together with matched RNA-seq after ionizing radiation, UV-C, oxidative
    stress, hypoxia, starvation, and neuronal IRE-1 activation, and compare wild-type, cep-1-null, and 
    PRMT-5/CBP-1-perturbed germ lines.
  experiment_type: comparative ChIP-seq/RNA-seq stress-response profiling
- hypothesis: The CEP-1 oligomerization/SAM domain is required for apoptotic target-gene activation independently of DNA
    binding.
  description: Rescue cep-1 mutants with separation-of-function DNA-binding-domain, dimerization-interface, and 
    SAM-domain alleles, then measure egl-1 and ced-13 induction, germ-cell corpses, and fasn-1 or phg-1 target 
    expression after DNA damage.
  experiment_type: structure-function rescue assay
