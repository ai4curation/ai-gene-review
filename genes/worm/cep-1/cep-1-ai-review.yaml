- term:
    id: GO:0008340
    label: determination of adult lifespan
  evidence_type: IMP
  original_reference_id: PMID:11557844
  qualifier: involved_in
  review:
    summary: CEP-1 modulates adult lifespan in several genetic and stress contexts, but this is peripheral to its direct
      DNA-damage apoptosis role.
    action: KEEP_AS_NON_CORE
    reason: Early cep-1 work reported decreased longevity under starvation stress, reduced cep-1 expression extends 
      lifespan, and the SMG-1 longevity branch requires cep-1. These genetics support the broad lifespan term but not as
      a core molecular output of CEP-1.
    supported_by:
    - reference_id: PMID:11557844
      supporting_text: "decreased longevity in\nresponse to starvation-induced stress"
      reference_section_type: ABSTRACT
    - reference_id: PMID:18836529
      supporting_text: cep-1 RNAi partially suppressed the extension of lifespan due to smg-1 inhibition
