id: Q20646
gene_symbol: cep-1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: 'cep-1 encodes the single C. elegans p53-family transcription factor. CEP-1 localizes to germline nuclei and
  uses its p53-like DNA-binding domain and dimeric C-terminal oligomerization/SAM domain to activate RNA polymerase II target
  genes. Its best-established apoptotic role is in the germline DNA-damage pathway, where CEP-1 induces the BH3-only genes
  egl-1 and ced-13 upstream of the CED-9/CED-4/CED-3 intrinsic apoptosis module. CEP-1 also regulates additional development,
  stress, and lifespan outputs, including fasn-1 and phg-1, and its DNA-damage apoptotic output is restrained by GLD-1-dependent
  translational repression and by a PRMT-5/CBP-1 complex that represses CEP-1 transcriptional activity.'
