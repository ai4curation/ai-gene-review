descriptions:
- source: Alliance_Imported
  text: hsp-12.6 encodes a small heat-shock protein with very short N- and C-terminal
    domains flanking its central region of similarity to alpha-crystallins; HSP-12.6
    is required in vivo for normal lifespan; HSP-12.6 is predominantly and ubiquitously
    expressed in L1 larvae without any obvious induction by stressors; but, in adult
    hermaphrodites, at least one HSP-12 is also expressed in spermatids (and perhaps
    spermatocytes), as well as in some vulval cells; moreover, hsp-12.6 is upregulated
    in 6- and 10-day-old daf-2 mutants, and this upregulation is highly reproducible
    (like that of five other genes, vit-2, vit-5, fat-3, nid-1, and mtl-1), strongly
    suggesting that hsp-12.6's expression may contribute to prolonged lifespan in
    dauer larvae; the hsp-12.6 promoter is predicted to have both DAF-16 and HSF-1
    binding sites; hsp-12.6(RNAi) animals are shorter-lived than normal; recombinant
    HSP-12.6 is monomeric, and lacks molecular chaperone activity in vitro; hsp-12.6
    induction requires DAF-16 and HSF-1, but not SMK-1.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00002013;class=Gene
  source_id: WB:WBGene00002013
