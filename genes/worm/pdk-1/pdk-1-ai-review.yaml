- term:
    id: GO:0004676
    label: 3-phosphoinositide-dependent protein kinase activity
  evidence_type: ISS
  original_reference_id: PMID:11274160
  qualifier: enables
  review:
    summary: >-
      PDK-1 is the PDPK1-subfamily AGC kinase with a C-terminal PDK1-type PH domain; it is the
      kinase that relays AGE-1 PI3K (PIP3) signals to AKT-1/AKT-2 and SGK-1.
    action: NEW
    reason: >-
      PDK-1 itself performs the catalytic step (activation-loop phosphorylation of AKT and SGK-1),
      so this is a participation, not a necessity, claim. The canonical product carries a
      PDK1-type PH domain (InterPro IPR033931, Pfam PF14593, SMART SM00233, CDD PH_PDK1); the
      PIAK study defines the phospholipid-independent PIAK form precisely by its lack of the PH
      domain present in PDK-1, and genetically pdk-1 is the relay for AGE-1 PI3K signals.
      Comparators in the same role carry this term (Drosophila Pdk1, human PDPK1). GOA has only
      the parent GO:0004674 for this gene; the PH-less PIAK form is better described by that
      parent, which remains accepted above.
    supported_by:
    - reference_id: PMID:11274160
      supporting_text: >-
        PIAK is highly homologous to C. elegans and mammalian PDK 1 with the exception that
        the novel kinase lacks a phospholipid binding pleckstrin homology domain.
