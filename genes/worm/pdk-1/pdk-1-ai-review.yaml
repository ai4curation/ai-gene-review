id: Q9Y1J3
gene_symbol: pdk-1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: >-
  PDK-1 is the Caenorhabditis elegans ortholog of 3-phosphoinositide-dependent protein kinase
  1, an AGC-family serine/threonine kinase. In the DAF-2 insulin/IGF-1-like pathway it acts
  downstream of the AGE-1 PI3K and phosphorylates and activates AKT-1, AKT-2 and SGK-1, which
  form a complex and in turn phosphorylate the FOXO factor DAF-16 to keep it out of the nucleus.
  pdk-1 loss of function causes constitutive dauer arrest and extended lifespan that are suppressed
  by daf-16, while an activating kinase-domain mutation bypasses the requirement for age-1,
  showing PDK-1 is necessary and sufficient to relay PI3K signals to the AKT kinases. PDK-1
  is expressed in neurons, intestine and hypodermis, and its signalling also influences salt
  chemotaxis learning and cadmium-responsive metallothionein expression.
