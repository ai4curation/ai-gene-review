gene_symbol: pdk-1
organism: worm
uniprot_id: Q9Y1J3
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Involved in the daf-2/insulin receptor-like transduction pathway, which controls
    longevity and prevents developmental arrest at the dauer stage (PubMed:10364160,
    PubMed:21980302). Phosphorylates and activates sgk-1, akt-1 and akt-2 (PubMed:15068796).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q9Y1J3
  source_id: Q9Y1J3
- source: Alliance_Imported
  text: pdk-1 encodes the C. elegans 3-phosphoinositide-dependent kinase 1 ortholog;
    PDK-1 is a component of the DAF-2/insulin receptor-like signaling pathway and
    accordingly, functions to regulate such processes as dauer larvae formation, longevity,
    and salt chemotaxis learning; genetic analyses indicate that, in regulating dauer
    arrest, PDK-1 acts downstream of AGE-1/PI3K and upstream of the AKT-1 and AKT-2
    kinases; a PDK-1::GFP fusion protein is expressed broadly beginning in late stage
    embryos and continuing on through adulthood; expression is seen in head, tail,
    and ventral cord motor neurons, pharyngeal tissues, hypodermal cells, the intestine,
    and the somatic gonad; in neurons, the PDK-1::GFP localizes to cell bodies and
    processes, with occasional expression seen in some neuronal nuclei.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00003965;class=Gene
  source_id: WB:WBGene00003965
- source: Alliance_Automated
  text: Enables protein serine/threonine kinase activity. Involved in several processes,
    including cellular response to reactive oxygen species; dauer larval development;
    and regulation of synaptic assembly at neuromuscular junction. Located in axon;
    neuronal cell body; and nucleus. Is expressed in several structures, including
    gonad; intestine; neurons; pharynx; and ventral nerve cord. Used to study depressive
    disorder. Human ortholog(s) of this gene implicated in prostate cancer. Orthologous
    to several human genes including PDPK1 (3-phosphoinositide dependent protein kinase
    1).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00003965;class=Gene
  source_id: WB:WBGene00003965
