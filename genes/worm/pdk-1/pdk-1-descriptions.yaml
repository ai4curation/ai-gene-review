- source: UniProt
  text: Involved in the daf-2/insulin receptor-like transduction pathway, which controls
    longevity and prevents developmental arrest at the dauer stage (PubMed:10364160,
    PubMed:21980302). Phosphorylates and activates sgk-1, akt-1 and akt-2 (PubMed:15068796).
  source_type: curated
