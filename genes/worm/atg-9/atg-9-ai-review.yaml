    id: GO:0017121
    label: plasma membrane phospholipid scrambling
  evidence_type: IEA
  original_reference_id: GO_REF:0000108
  qualifier: involved_in
  supporting_entities:
  - GO:0017128
  review:
    summary: Logical inference from the scramblase MF to plasma membrane phospholipid scrambling.
    action: REMOVE
    reason: This IEA arises from an automatic inter-ontology link from scramblase activity to plasma membrane
      scrambling. ATG9 scrambles lipids in ATG9 vesicles, the phagophore and (in worms) influences lysosome
      membranes. It is not a plasma membrane scramblase and has no role in exposing phosphatidylserine
      at the cell surface. In C. elegans neurons ATG-9 passes through the plasma membrane only transiently
      during exo-endocytosis. The inferred process is therefore wrong for this protein.
    supported_by:
    - reference_id: PMID:33106659
      supporting_text: Mutations in the pore reduce scrambling activity and yield markedly smaller autophagosomes,
        indicating that lipid scrambling by ATG9A is essential for membrane expansion
