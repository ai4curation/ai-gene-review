core_functions:
- description: ATG-9 is a trimeric transmembrane phospholipid scramblase on small vesicles that seed the
    phagophore; it moves lipids delivered by ATG-2 to the inner leaflet so the phagophore can expand (activity
    inferred from yeast and human orthologs, conserved residues probed genetically in C. elegans).
  molecular_function:
    id: GO:0017128
    label: phospholipid scramblase activity
  directly_involved_in:
