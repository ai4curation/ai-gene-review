id: Q9TXN6
gene_symbol: atg-9
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: ATG-9 is the C. elegans ortholog of Atg9/ATG9A, the only multi-pass transmembrane protein
  of the core autophagy machinery (921 aa, six predicted transmembrane segments). Atg9 family proteins
  form homotrimers that scramble phospholipids between the two leaflets of a bilayer; ATG9-containing
  vesicles seed the phagophore, and ATG9 redistributes the lipids that ATG2 delivers to the outer leaflet,
  allowing the phagophore to expand. In C. elegans neurons ATG-9 is sorted from the trans-Golgi network
  into synaptic-vesicle-like carriers, transported to presynaptic sites by the kinesin UNC-104/KIF1A,
  and cycles through activity-dependent exo-endocytosis there. atg-9 is needed for autophagosome biogenesis
  near synapses and, cell-autonomously, for presynaptic assembly in the AIY interneuron. Mutations that
  reduce ATG-9 scramblase activity leave autophagy largely intact but enhance lysosome biogenesis and
  integrity, indicating that ATG-9 lipid scrambling also influences lysosome membranes.
