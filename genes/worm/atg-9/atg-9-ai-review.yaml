suggested_questions:
- question: How does attenuated ATG-9 scramblase activity enhance lysosome biogenesis; does ATG-9 act
    on lysosomal membranes directly or by changing lipid flow from the phagophore?
- question: Does ATG-9 have roles at synapses (for example in the synaptic vesicle cycle or neuropeptide
    receptor trafficking) that are separable from autophagosome formation?
suggested_experiments:
- experiment_type: In vitro scramblase assay of the nematode protein
  description: Reconstitute purified C. elegans ATG-9 (wild type and the scramblase-attenuated mutants
    from Peng et al. 2025) into proteoliposomes and measure NBD-phospholipid scrambling by dithionite
    quenching.
  hypothesis: Worm ATG-9 is a phospholipid scramblase, and the suppressor mutations reduce but do not
    abolish activity.
