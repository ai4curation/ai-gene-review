descriptions:
- source: UniProt
  text: Phospholipid scramblase involved in autophagy. Cycles between the preautophagosomal
    structure/phagophore assembly site (PAS) and the cytoplasmic vesicle pool and
    supplies membrane for the growing autophagosome. Lipid scramblase activity plays
    a key role in preautophagosomal structure/phagophore assembly by distributing
    the phospholipids that arrive through ATG2 from the cytoplasmic to the luminal
    leaflet of the bilayer, thereby driving autophagosomal membrane expansion.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q9TXN6
  source_id: Q9TXN6
- source: Alliance_Automated
  text: Predicted to enable phospholipid scramblase activity. Involved in regulation
    of presynapse assembly. Located in cytoplasm. Is active in presynapse. Is expressed
    in several structures, including AIY; hypodermis; nerve ring; neuronal sheath
    cell; and spermatheca. Orthologous to several human genes including ATG9A (autophagy
    related 9A).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00020706;class=Gene
  source_id: WB:WBGene00020706
