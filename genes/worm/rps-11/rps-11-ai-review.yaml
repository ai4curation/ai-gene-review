- id: PMID:17266679
  title: Lifespan extension by conditions that inhibit translation in Caenorhabditis elegans.
  findings:
  - statement: Reducing ribosomal protein levels by RNAi extends C. elegans lifespan and increases thermal-stress
      resistance.
    supporting_text: reducing the levels of ribosomal proteins, ribosomal-protein S6 kinase or translation-initiation
      factors increases the lifespan of Caenorhabditis elegans
  full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only cache (Hansen et al. 2007, Aging Cell). Abstract supports lifespan extension by ribosomal
      protein knockdown in general but does not name rps-11; the gene-specific data behind the WormBase IMP row could
      not be checked. No PMC full text.
- id: PMID:39209556
  title: High-resolution reconstruction of a C. elegans ribosome sheds light on evolutionary dynamics and tissue
    specificity.
  findings:
  - statement: Cryo-EM structure of the C. elegans 80S ribosome purified by sucrose gradient; all ribosomal proteins
      except stalk proteins, eL28 and RACK-1 were modelled, including uS17.
    supporting_text: We also modeled the ribosomal proteins, with the exceptions of those bound to the P- and L-stalks
      (uL10/P0, P1, P2, uL1, uL11), eL28, and RACK-1
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Sehgal et al. 2024, RNA; full text read. Source of PDB 9BH5/9CAI cross-referenced in Q20206 (chain
      AL, residues 1-155); uS17 is not among the unmodelled proteins.
- id: PMID:30020921
  title: Hypodermal responses to protein synthesis inhibition induce systemic developmental arrest and AMPK-dependent
    survival in Caenorhabditis elegans.
  findings:
  - statement: rps-11 RNAi was used to inhibit protein synthesis and reduced induced reporter (hsp-16p::GFP) synthesis.
    supporting_text: protein synthesis inhibition by egl-45 (red) or rps-11 (green) RNAi impairs GFP biosynthesis
      in response to heat shock in animals expressing hsp-16.
  - statement: rps-11 RNAi from L1 causes a reversible L2 developmental arrest; hypodermis-specific RNAi suffices.
    supporting_text: hypodermal-specific RNAi targeting egl-45 (C) or rps-11 (D) is sufficient to drive developmental
      arrest
  - statement: An rps-11 promoter reporter is expressed in multiple tissues.
    supporting_text: An rps-11p::gfp (R,S) and egl-45p::mCherry (T,U) reporter is detectable in multiple tissues
      at 24 hours (R,T) and 48 hours (S,U) of development.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Dalton and Curran 2018, PLoS Genet; full text read. Uses rps-11 RNAi as a protein-synthesis inhibition
      tool; supports a role in translation in vivo. Arrest and stress-resistance phenotypes are necessity phenotypes
      and do not justify process annotations.
- id: PMID:16247027
  title: A complex containing the Sm protein CAR-1 and the RNA helicase CGH-1 is required for embryonic cytokinesis
    in Caenorhabditis elegans.
  findings:
  - statement: RNAi of RPS-11 (with five other RPS proteins), used as a translation-inhibition control, caused penetrant
      sterility; partial depletion gave osmotically sensitive embryos without cytokinesis defects.
    supporting_text: Depletions of six different ribosomal subunits (RPS-1, -3, -5, -11, -18, and -23) each resulted
      in penetrant sterility (unpublished data).
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Full text read. Paper is about CAR-1/CGH-1; RPS-11 data are an unpublished-data control showing
      necessity phenotypes consistent with general translation loss. Does not justify any process annotation.
