gene_symbol: rps-11
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: rps-11 (F40F11.1) encodes the Caenorhabditis elegans small ribosomal subunit protein uS17 (40S ribosomal
  protein S11), a member of the universal uS17 family with an OB-fold nucleic-acid-binding domain. uS17 is a core
  protein of the cytosolic 40S subunit, where it binds 18S rRNA in the body of the subunit; it is resolved in the
  cryo-EM structures of the C. elegans 80S ribosome. As a structural constituent of the ribosome it contributes to
  cytoplasmic mRNA translation. rps-11 is expressed in many tissues, and its RNAi depletion reduces protein synthesis,
  causing sterility, a reversible larval (L2) arrest with stress resistance, and, in adults, extended lifespan;
  these are organismal consequences of reduced translation rather than distinct functions of the protein.
