suggested_questions:
- question: Does uS17/RPS-11 occupancy of 40S subunits vary between tissues or developmental stages in C. elegans,
    as proposed for ribosome heterogeneity, or is it invariant?
- question: Is the lifespan extension reported for ribosomal-protein RNAi specific to particular small-subunit proteins
    such as rps-11, or a generic consequence of reduced translational capacity?
suggested_experiments:
- description: Quantify RPS-11 stoichiometry in polysome and monosome fractions from dissected tissues (e.g. by targeted
    proteomics or an endogenous tag) to test whether uS17 occupancy of ribosomes varies by tissue.
