descriptions:
- source: Alliance_Imported
  text: rps-11 encodes a small ribosomal subunit S11 protein; by homology, RPS-11
    is predicted to function in protein biosynthesis; in C. elegans, RPS-11 activity
    is required for embryonic and germline development, as well as the overall health
    of the animal; loss of rps-11 activity in adult animals extends lifespan.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00004480;class=Gene
