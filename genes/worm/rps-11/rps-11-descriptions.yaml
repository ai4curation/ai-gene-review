- source: Alliance_Automated
  text: Predicted to be a structural constituent of ribosome. Involved in determination
    of adult lifespan. Predicted to be located in ribosome. Predicted to be part of
    cytosolic small ribosomal subunit. Orthologous to human RPS11 (ribosomal protein
    S11).
