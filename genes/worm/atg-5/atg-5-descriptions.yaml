gene_symbol: atg-5
organism: worm
uniprot_id: Q3V5I7
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Involved in autophagic vesicle formation (By similarity). Conjugation with
    lgg-3/ATG12, through a ubiquitin-like conjugating system involving atg-7 as an
    E1-like activating enzyme and atg-10 as an E2-like conjugating enzyme, is essential
    for its function (By similarity). Most likely a component of an atg-5-lgg-3-atg-16
    complex that promotes autophagosome formation by associating with lgg-2, but not
    lgg-1, at the preautophagosomal membrane (PubMed:24185444). Probably, as part
    of an atg-5-lgg-3-atg-16 complex, required for lgg-1 lipidation; the complex acts
    as an E3-like enzyme promoting atg-3- mediated lgg-1 lipidation (Probable). Furthermore,
    association with atg-16.2 is required for the nucleation of lgg-1 positive autophagic
    vesicles (PubMed:24185444).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q3V5I7
  source_id: Q3V5I7
- source: Alliance_Imported
  text: atg-5 encodes, by alternative splicing, two isoforms of an ortholog of the
    autophagic budding yeast protein Atg5p, and of human ATG5 (OMIM:604261); ATG-5
    has no obvious function in mass RNAi assays.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00022152;class=Gene
  source_id: WB:WBGene00022152
- source: Alliance_Automated
  text: Predicted to contribute to Atg8-family ligase activity. Involved in autophagosome
    assembly and regulation of autophagy. Predicted to be located in cytosol. Predicted
    to be part of Atg12-Atg5-Atg16 complex. Predicted to be active in autophagosome;
    phagophore; and phagophore assembly site membrane. Human ortholog(s) of this gene
    implicated in autosomal recessive spinocerebellar ataxia 25. Orthologous to human
    ATG5 (autophagy related 5).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00022152;class=Gene
  source_id: WB:WBGene00022152
