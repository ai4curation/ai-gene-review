suggested_questions:
- question: >-
    Is LGG-3 conjugation to ATG-5 required for every ATG-5 function in C. elegans, and has
    the LGG-3-ATG-5 conjugate been detected biochemically in worms?
suggested_experiments:
- description: >-
    Detect the LGG-3-ATG-5 conjugate by immunoblot in wild-type, atg-7 and atg-10 mutants,
    and test whether a non-conjugatable ATG-5 (acceptor Lys mutant) rescues LGG-1 lipidation
    in atg-5 mutants.
  experiment_type: genetics and biochemistry
