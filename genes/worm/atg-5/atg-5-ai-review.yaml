core_functions:
- description: >-
    As the LGG-3/ATG12-conjugated subunit of the Atg12-Atg5-Atg16 complex, ATG-5 contributes
    the E3-like activity that promotes transfer of LGG-1/LGG-2 from ATG-3 to phosphatidylethanolamine
    on the phagophore; ATG-5 binds the N-termini of ATG-16.1 and ATG-16.2, which direct the
    complex to sites of LGG-1 puncta formation.
