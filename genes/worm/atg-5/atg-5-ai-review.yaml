  label: Caenorhabditis elegans
description: >-
  ATG-5 is the C. elegans ortholog of yeast Atg5 and mammalian ATG5. It is the acceptor of
  the ubiquitin-like protein LGG-3/ATG12, which is covalently attached to it through the E1-like
  ATG-7 and E2-like ATG-10, and the LGG-3-ATG-5 conjugate binds the N-termini of the coiled-coil
  proteins ATG-16.1 and ATG-16.2 to form the Atg12-Atg5-Atg16 complex. This complex associates
  with the forming phagophore and acts as the E3-like enzyme that promotes transfer of LGG-1/LGG-2
  from ATG-3 to phosphatidylethanolamine. Loss of atg-5 abolishes LGG-1 lipidation and LGG-1
  puncta formation and blocks autophagic degradation of protein aggregates in the embryo.
