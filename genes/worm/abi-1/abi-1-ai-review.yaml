    label: neuron migration
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:106913
  - PANTHER:PTN000825624
  - WB:WBGene00015146
  review:
    summary: IBA annotation from Eumetazoa node PTN000825624 seeded directly by C. elegans abi-1 (WB:WBGene00015146)
      and mouse Abi2.
    action: KEEP_AS_NON_CORE
    reason: Directly supported in C. elegans (PMID:19168673, PMID:23022657), where abi-1 mutants display
      incomplete ALM/motoneuron migration; retained as non-core consistently across all PTHR10460 reviews
      because neuron migration is a tissue-specific developmental outcome of core WRC/adaptor function.
    supported_by:
    - reference_id: PMID:19168673
      supporting_text: ABI-1 and UNC-53 have an overlapping expression pattern, and display similar cell
        migration phenotypes in the excretory cell, and in mechanosensory and motoneurons.
    - reference_id: PMID:23022657
      supporting_text: Further analysis using a co-immunoprecipitation system confirmed the interaction
        of MIG-10 and ABI-1 and showed that it requires the SH3 domain of ABI-1. Single mutants for mig-10
        and abi-1 displayed similar phenotypes of incomplete migration of the ALM neurons and truncated
        outgrowth of the excretory cell canals, suggesting that the ABI-1/MIG-10 interaction is relevant
        in vivo.
