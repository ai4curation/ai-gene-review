id: Q10929
gene_symbol: abi-1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: Caenorhabditis elegans ABI-1 is the sole nematode member of the Abl-interactor adaptor family
  (PANTHER subfamily PTHR10460:SF0) and an essential subunit of the heteropentameric WAVE/SCAR regulatory
  complex alongside WVE-1, GEX-2, GEX-3, and BRK-1. Through its N-terminal WAVE-binding region, central
  proline-rich motifs, and C-terminal SH3 domain, ABI-1 couples upstream guidance, polarity, and trafficking
  effectors—including MIG-10/Lamellipodin, UNC-53/NAV2, and the F-BAR proteins TOCA-1/TOCA-2—to WVE-1/Arp2/3-mediated
  branched actin filament assembly, while physically binding and being antagonized by the ABL-1 tyrosine
  kinase. In vivo, ABI-1 drives embryonic epidermal enclosure, excretory-canal and axon outgrowth, neuronal
  and distal-tip-cell migration, apoptotic cell engulfment, oocyte clathrin-mediated endocytosis, and
  Netrin/MIG-10B-dependent presynaptic actin organization and synaptic vesicle clustering.
