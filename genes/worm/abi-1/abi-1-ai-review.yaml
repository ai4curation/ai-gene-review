- id: PMID:19168673
  title: The cell migration molecule UNC-53/NAV2 is linked to the ARP2/3 complex by ABI-1.
  findings:
  - statement: C. elegans ABI-1 binds the N-terminal calponin-homology domain of UNC-53/NAV2 to link UNC-53
      to the Arp2/3 complex during excretory cell and neuronal migration.
    supporting_text: We have identified ABI-1 as a novel molecular partner of UNC-53/NAV2 and have found
      that a restricted calponin homology (CH) domain of UNC-53 is sufficient to bind ABI-1.
- id: PMID:19402756
  title: Abl kinase inhibits the engulfment of apoptotic [corrected] cells in Caenorhabditis elegans.
  findings:
  - statement: ABI-1 physically interacts with ABL-1 in vitro and is required for apoptotic cell engulfment
      and distal tip cell migration, with ABL-1 inhibiting ABI-1.
    supporting_text: ABL-1 and ABI-1 interact physically in vitro. We propose that ABL-1 opposes the engulfment
      of apoptotic cells by inhibiting ABI-1 via a pathway that is distinct from the two known engulfment
      pathways.
- id: PMID:19447967
  title: Shifted Transversal Design smart-pooling for high coverage interactome mapping.
  findings: []
- id: PMID:19798448
  title: Requirements for F-BAR proteins TOCA-1 and TOCA-2 in actin dynamics and membrane trafficking
    during Caenorhabditis elegans oocyte growth and embryonic epidermal morphogenesis.
  findings:
  - statement: CeTOCA-1/2 associate indirectly with WVE-1 via ABI-1 to support clathrin-mediated endocytosis
      and embryonic epidermal morphogenesis.
    supporting_text: Furthermore, mammalian TOCA-1 and C. elegans CeTOCAs physically associated with N-WASP
      and WSP-1 directly, or WAVE2 indirectly via ABI-1.
- id: PMID:23022657
  title: Abelson interactor-1 (ABI-1) interacts with MRL adaptor protein MIG-10 and is required in guided
    cell migrations and process outgrowth in C. elegans.
  findings:
  - statement: The C-terminal SH3 domain of ABI-1 binds MIG-10/Lamellipodin to drive ALM neuron migration
      and excretory canal outgrowth.
    supporting_text: Further analysis using a co-immunoprecipitation system confirmed the interaction
      of MIG-10 and ABI-1 and showed that it requires the SH3 domain of ABI-1. Single mutants for mig-10
      and abi-1 displayed similar phenotypes of incomplete migration of the ALM neurons and truncated
      outgrowth of the excretory cell canals, suggesting that the ABI-1/MIG-10 interaction is relevant
      in vivo.
- id: PMID:23028145
  title: Synaptic vesicle clustering requires a distinct MIG-10/Lamellipodin isoform and ABI-1 downstream
    from Netrin.
  findings:
  - statement: MIG-10B binds ABI-1 in the WAVE complex downstream of Netrin to organize presynaptic F-actin
      and cluster synaptic vesicles.
    supporting_text: MIG-10B interacts with Abl-interacting protein-1 (ABI-1)/Abi1, a component of the
      WAVE complex, to organize the actin cytoskeleton at presynaptic sites and instruct vesicle clustering
      through SNN-1/Synapsin.
- id: PMID:23209429
  title: MIG-10 functions with ABI-1 to mediate the UNC-6 and SLT-1 axon guidance signaling pathways.
  findings:
  - statement: ABI-1 binds MIG-10 via its SH3 domain and acts with WVE-1 in UNC-6/netrin and SLT-1/slit
      axon guidance pathways.
    supporting_text: The SH3 domain of ABI-1 binds to MIG-10, and loss of function of either of these
      proteins causes similar axon guidance defects. Like MIG-10, ABI-1 functions in both the attractive
      UNC-6 (netrin) pathway and the repulsive SLT-1 (slit) pathway.
- id: PMID:23549480
  title: SH3 interactome conserves general function over specific form.
  findings: []
