suggested_questions:
- question: Which tyrosine residues on C. elegans ABI-1 or WVE-1 are phosphorylated by ABL-1 in vivo to
    inhibit apoptotic cell engulfment while permitting axon guidance?
- question: Does the C. elegans ABI-1/GEX-2 interface conserve the WIRS-peptide binding surface used by
    Drosophila and mammalian WAVE regulatory complexes?
suggested_experiments:
- description: Phosphoproteomic mapping and CRISPR non-phosphorylatable/phosphomimetic mutagenesis of
    endogenous C. elegans abi-1 in abl-1 single and ced-1;abl-1 double mutants.
- description: Endogenous affinity purification of GFP::ABI-1 from embryonic epidermis versus adult neurons
    to compare tissue-specific WVE-1, MIG-10A/B, UNC-53, and TOCA-1/2 stoichiometries.
