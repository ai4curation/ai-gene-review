findings:
- category: gap
  text: Neither text says that ABI-1 is a subunit of the WAVE/SCAR regulatory complex
    (SCAR complex IBA accepted in the review), which is its core activity.
  sources:
  - Alliance_Imported
  - Alliance_Automated
- category: discrepancy
  text: 'The two texts cover different roles: WormBase the developmental migrations
    and engulfment, the automated text the synaptic actin and endocytosis terms.'
  sources:
