    overall_notes: Migrations, enclosure, engulfment and the MIG-10, UNC-53 and ABL-1
      interactions are correct and traced in the review. It names human orthologs
      by legacy aliases (SSH3BP1, NESH), spends a third of its length on expression,
      and omits the core fact that ABI-1 is a subunit of the WAVE/SCAR regulatory
      complex.
- source: Alliance_Automated
  text: Enables SH3 domain binding activity and protein kinase binding activity. Involved
    in several processes, including positive regulation of endocytosis; presynaptic
    actin cytoskeleton organization; and synaptic vesicle clustering. Located in several
    cellular components, including axon; dendrite; and neuronal cell body. Is expressed
    in coelomocyte; head neurons; and ventral cord neurons. Orthologous to several
    human genes including ABI1 (abl interactor 1).
