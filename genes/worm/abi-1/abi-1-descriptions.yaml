descriptions:
- source: Alliance_Imported
  text: abi-1 encodes an Abl interactor orthologous to human SSH3BP1 (ABI1; OMIM:603050,
    mutated in acute myeloid leukemia), ABI-2 (OMIM:606442), and NESH (OMIM:606363);
    abi-1 is required for epidermal cell migrations during embryonic enclosure, proper
    migration of the excretory cell, distal tip cell, and mechanosensory and motoneurons,
    and apoptotic cell engulfment; ABI-1 physically interacts with the MIG-10 and
    the N-terminus of UNC-53/NAV2, which may provide a link between ABI-1, MIG-10
    and the ARP2/3 complex; ABI-1 also physically interacts with the ABL-1 tyrosine
    kinase; ABI-1 is expressed in a number of head and nerve ring neurons including
    the amphid interneurons AIYL/R and the RMEL/R motoneurons, several types of ventral
    cord motoneurons and the coelomocytes; in neurons, ABI-1 localizes to the cell
    bodies, dendrites and commissural axons.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00015146;class=Gene
  source_id: WB:WBGene00015146
