gene_symbol: rho-1
organism: worm
uniprot_id: Q22038
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Required for ventral migration of epidermal cells during ventral enclosure
    in the embryo and for cell elongation (PubMed:24016757). Also required for ventral
    migration of P cells during larval development (PubMed:11687661). Involved in
    asymmetric spindle positioning during anaphase and establishment of cell polarity
    during embryo development (PubMed:16921365). In adults, involved in regulation
    of multiple processes including locomotion, pharyngeal pumping, fecundity, ovulation,
    defecation and body morphology (PubMed:21387015). In body wall muscles, regulates
    organization of myosin thick filaments downstream of unc-89 (PubMed:18801371).
    Association with the oxidase bli-3 promotes ROS production and this interaction
    may be modulated by memo-1, in order to control the oxidative stress response
    and longevity (PubMed:28085666).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q22038
  source_id: Q22038
- source: Alliance_Imported
  text: rho-1 encodes a Rho GTPase; rho-1 activity is required for regulation of a
    number of actin filament-based processes including embryonic polarity, cell migration,
    cell shape changes, muscle contraction, and neurite outgrowth; in addition, RHO-1
    is required for both DGK-1- and UNC-13-dependent and independent regulation of
    synaptic signaling at neuromuscular junctions; as RHO-1 binds DGK-1 in vitro,
    its regulation of DGK-1-mediated signaling may be direct; in vitro RHO-1 GTPase
    activity is enhanced by the RGA-3 and RGA-4 GAP proteins, consistent with genetic
    studies showing that, in the early embryo, RHO-1 activity is required for expression
    of the rga-3/4(RNAi) hypercontractibility phenotype; RHO-1 is ubiquitously expressed
    throughout development with notably high expression seen in head neurons and asymmetric
    expression seen in the anterior cortex of one-cell embryos.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00004357;class=Gene
  source_id: WB:WBGene00004357
- source: Alliance_Automated
  text: Enables several functions, including GTP binding activity; GTPase activating
    protein binding activity; and GTPase activity. Involved in several processes,
    including actomyosin structure organization; positive regulation of acetylcholine
    secretion, neurotransmission; and regulation of actin filament-based process.
    Located in cell cortex and cleavage furrow. Is expressed in several structures,
    including germ line. Human ortholog(s) of this gene implicated in breast carcinoma
    and ectodermal dysplasia. Orthologous to several human genes including RHOA (ras
    homolog family member A).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00004357;class=Gene
