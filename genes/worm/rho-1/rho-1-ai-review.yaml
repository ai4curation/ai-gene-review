id: Q22038
gene_symbol: rho-1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: rho-1 encodes the single Caenorhabditis elegans RhoA ortholog, a prenylated Rho-family small
  GTPase that cycles between GDP-bound inactive and GTP-bound active states at the inner face of the plasma
  membrane and the cell cortex. It is activated by RhoGEFs (ECT-2, UNC-73/Trio, the UNC-89 DH-PH region
  in muscle, and neuronal RHGF-2) and inactivated by RhoGAPs (RGA-3/4, RGA-7/SPV-1, CYK-4). GTP-bound
  RHO-1 drives cortical actomyosin contractility in the early embryo, controlling cytokinetic contractile
  ring assembly and the cortical flow that establishes anterior-posterior PAR polarity, and later is required
  for ventral enclosure, embryonic elongation, P-cell migration and myosin thick filament organization
  in body wall muscle. In adult cholinergic motor neurons RHO-1 increases acetylcholine release, in part
  by binding and inhibiting the diacylglycerol kinase DGK-1 so that DAG and UNC-13 accumulate at release
  sites, and it binds the NADPH oxidase BLI-3 to promote ROS signalling, an interaction restrained by
  MEMO-1. In developing neurons, RHO-1 activated by the GEF RHGF-1 restrains growth cone protrusion
  and microtubule entry into the growth cone downstream of UNC-6/Netrin and UNC-5 during axon outgrowth.
