    label: Rho protein signal transduction
  - id: GO:0000915
    label: actomyosin contractile ring assembly
  - id: GO:0032956
    label: regulation of actin cytoskeleton organization
  locations:
  - id: GO:0005886
    label: plasma membrane
  - id: GO:0005938
    label: cell cortex
  supported_by:
  - reference_id: PMID:22363657
    supporting_text: RHGF-2 RhoGEF activity is specific to the C. elegans RhoA homolog RHO-1 as determined
      by direct binding, GDP/GTP exchange
  - reference_id: PMID:17848508
    supporting_text: Here we identify the GTPase-activating proteins (GAPs) RGA-3 and RGA-4, which regulate
      the activity of the small GTPase RHO-1.
  - reference_id: PMID:16921365
