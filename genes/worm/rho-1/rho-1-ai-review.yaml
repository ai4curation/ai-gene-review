proposed_new_terms:
- proposed_name: guanyl-nucleotide exchange factor binding
  proposed_definition: Binding to a guanyl-nucleotide exchange factor (GEF), a protein that stimulates
    the exchange of GDP for GTP on a signaling GTPase.
  justification: GO has GTPase activating protein binding (GO:0032794) but no counterpart for the
    other main class of GTPase regulator. Small GTPases such as RHO-1 bind their GEFs directly (RHO-1
    binds RHGF-2 by GST pull-down), and without a GEF-binding term such interactions are mis-annotated
    to GTPase activating protein binding, as happened for this row, or fall back to bare protein
    binding. The parallel parent would be protein binding, alongside GO:0032794.
  proposed_parent:
    id: GO:0005515
    label: protein binding
  supported_by:
  - reference_id: PMID:22363657
    supporting_text: FLAG::RHGF-2 bound preferentially to GST::RHO-1 in comparison to binding with GST::CED-10
      or GST::CDC-42.
  - *id014
suggested_questions:
- question: Does GTP-bound RHO-1 directly inhibit DGK-1 catalytic activity, or does binding only relocalize
    DGK-1 away from release sites?
- question: Is RHO-1 binding to BLI-3 GTP-dependent and does it directly stimulate BLI-3 NADPH oxidase
    activity, as Rac does for NOX2?
- question: Should GOA rows describing a GTPase binding its own GEF use a dedicated term? GO currently
    lacks a guanyl-nucleotide exchange factor binding term, which led to RHGF-2 being annotated as GTPase
    activating protein binding.
suggested_experiments:
- description: In vitro DGK-1 kinase assays with purified RHO-1-GTPgammaS vs RHO-1-GDP (and the F25N mutant)
    to test direct inhibition.
- description: Reconstituted BLI-3 ROS production with GTP- vs GDP-loaded RHO-1, with and without MEMO-1.
