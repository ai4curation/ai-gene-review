- description: GTP/GDP-cycling RhoA switch at the plasma membrane and cell cortex. Activated by RhoGEFs
    (ECT-2, UNC-73, UNC-89, RHGF-2) and inactivated by RhoGAPs (RGA-3/4, RGA-7), GTP-bound RHO-1 drives
    cortical actomyosin contractility for cytokinetic contractile ring assembly, PAR polarity establishment
    and epidermal morphogenesis.
  molecular_function:
    id: GO:0003925
    label: G protein activity
  directly_involved_in:
