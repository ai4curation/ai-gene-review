gene_symbol: ift-20
organism: worm
uniprot_id: Q8TA52
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Component of the intraflagellar transport (IFT) complex B required for transport
    of proteins in the motile cilium. Required for ciliary entrance and transport
    of specific ciliary cargo proteins such as che-3 which are related to motility.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q8TA52
  source_id: Q8TA52
- source: Alliance_Imported
  text: Y110A7A.20 encodes an ortholog of Chlamydomonas and human IFT20;Y110A7A.20
    undergoes intraflagellar transport (IFT) in a mannerconsistent with its being
    a component of the OSM-3-driven IFT-particle Bsubcomplex; Y110A7A.20 is expressed
    in amphid and phasmid neurons,mechanosensory neurons, and other unidentified head
    neurons and tailcells; by orthology with human IFT20, Y110A7A.20 may deliver ciliarymembrane
    proteins from the Golgi complex to the cilium; Y110A7A.20 hasno obvious function
    in mass RNAi assays.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00022465;class=Gene
  source_id: WB:WBGene00022465
- source: Alliance_Automated
  text: Predicted to be involved in cilium assembly and protein localization to cilium.
    Located in dendrite; neuronal cell body; and non-motile cilium. Is expressed in
    nervous system and tail. Orthologous to human IFT20 (intraflagellar transport
    20).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00022465;class=Gene
  source_id: WB:WBGene00022465
