findings:
- category: discrepancy
  text: WormBase says ift-20 has no obvious RNAi function; the review cites null mutants
    with vestigial axonemes and dye-filling, osmotic avoidance and mating defects.
  sources:
  - Alliance_Imported
- category: discrepancy
  text: UniProt places IFT-20 in the motile cilium; C. elegans IFT-20 acts in non-motile
    sensory cilia.
  sources:
  - UniProt
  - Alliance_Automated
review:
  reviewer: AI
  rubrics:
  - rubric: overall_concordance
    score: 3
  overall_notes: All agree on IFT-B, but UniProt says motile cilium and WormBase says
    no obvious function.
