      score: 3
    - rubric: utility
      score: 3
    - rubric: compactness
      score: 2
    - rubric: completeness
      score: 3
    - rubric: specificity
      score: 3
    overall_notes: Correct on IFT-B and neuron expression; Golgi delivery is by orthology
      and not seen in worms, and 'no obvious function in mass RNAi assays' is superseded
      by null mutants with short cilia. Formatting damage.
- source: Alliance_Automated
  text: Predicted to be involved in cilium assembly and protein localization to cilium.
    Located in dendrite; neuronal cell body; and non-motile cilium. Is expressed in
    nervous system and tail. Orthologous to human IFT20 (intraflagellar transport
    20).
