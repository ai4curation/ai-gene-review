gene_symbol: ift-20
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: IFT-20 is the Caenorhabditis elegans ortholog of IFT20, a small (129 aa) coiled-coil
  subunit of the intraflagellar transport complex B (IFT-B, peripheral IFT-B2 subcomplex).
  Its gene carries a DAF-19-regulated X-box and is expressed in ciliated sensory neurons.
  IFT-20::GFP enters sensory cilia and undergoes IFT with the same kinetics as other IFT subunits,
  and is also seen in dendrites and neuronal cell bodies. Unlike mammalian IFT20, which is
  anchored at the Golgi by GMAP210, worm IFT-20 has not been detected at the Golgi. ift-20
  null mutants position basal bodies and form transition zones but build only short, vestigial
  axonemes, recruit much less IFT-B (IFT-74) to the ciliary base and into cilia, fail to take
  up dye, and are defective in osmotic avoidance and male mating.
