core_functions:
- description: IFT-20 is a small coiled-coil subunit of the IFT-B particle in C. elegans ciliated
    sensory neurons. It moves by IFT, is needed for robust recruitment of IFT-B to the ciliary
    base and its entry into cilia, and is required to build a full-length sensory axoneme.
    No discrete molecular activity has been assigned in the worm, and the Golgi role of mammalian
    IFT20 does not appear to be conserved.
  supported_by:
  - reference_id: PMID:33997658
    supporting_text: IFT-20 plays a role in the ciliary recruitment and entry of IFT subunits
  - reference_id: PMID:33997658
    supporting_text: IFT-20 loss leads to a severe defect in ciliary axoneme assembly but
      does not completely block ciliogenesis in C. elegans
