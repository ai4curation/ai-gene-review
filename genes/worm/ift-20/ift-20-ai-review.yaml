suggested_questions:
- question: Why can ift-20 null worms still assemble short vestigial cilia, when IFT20 loss
    blocks ciliogenesis in most mammalian cells? Is there partial redundancy within the worm
    IFT-B2 subcomplex?
- question: Does worm IFT-20 have any role in delivering ciliary membrane proteins (e.g. receptors
    or channels) given that it does not associate with the Golgi as in mammals?
suggested_experiments:
- description: Image endogenously tagged ciliary membrane proteins (e.g. ODR-10, OSM-9) in
    ift-20 null neurons to test whether IFT-20 is selectively required for membrane cargo
    delivery.
- description: Test direct binding of IFT-20 to other IFT-B2 subunits (IFT-54/DYF-11, IFT-57/CHE-13)
    with recombinant worm proteins to define its position in the worm IFT-B complex.
