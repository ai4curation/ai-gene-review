- id: PMID:23705068
  title: A novel sphingolipid-TORC1 pathway critically promotes postembryonic development
    in Caenorhabditis elegans.
  findings:
  - statement: asna-1(ok938) is used only as a control L1-arrest mutant. Branched-chain
      lipid supplements do not rescue its arrest, placing it outside the mmBCFA/sphingolipid/TORC1
      pathway.
    supporting_text: Neither C17ISO nor d17iso-SPA permits asna-1(−) animals to bypass L1 arrest.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Full text read (PMC3660743). asna-1 appears only in Figure 4-figure supplement
      3E and in the strain list. The paper gives no information on ASNA-1 molecular function
      and supports no annotation here.
- id: PMID:33883621
  title: Alternative redox forms of ASNA-1 separate insulin signaling from tail-anchored
    protein targeting and cisplatin resistance in C. elegans.
  findings:
  - statement: ASNA-1 is required for ER targeting of the TA protein SEC-61beta, binds
      SEC-61beta and the ER receptor WRB-1, and exists in reduced and oxidized redox
      states. The reduced form is needed for TA targeting and cisplatin resistance.
    supporting_text: We conclude that ASNA-1 exists in two alternative redox states, where formation of the oxidized state requires two conserved cysteines.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text read. This is the key worm paper establishing the TA-targeting
      function and the WRB-1 receptor.
- id: PMID:36480541
  title: Identification of C. elegans ASNA-1 domains and tissue requirements that differentially
    influence platinum sensitivity and growth control.
  findings:
  - statement: Point mutants dHis164 and A63V are TA-targeting defective and cisplatin
      sensitive but secrete insulin normally. Depleting ASNA-1 in both neurons and intestine
      causes L1 arrest.
    supporting_text: Somatic depletion of ASNA-1 as well as simultaneous depletion of ASNA-1 in neurons and intestines resulted in an L1 arrest.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text read. Supports the separation of functions and gives tissue
      requirements.
- id: PMID:36939052
  title: A proinsulin-dependent interaction between ENPL-1 and ASNA-1 in neurons is required
    to maintain insulin secretion in C. elegans.
  findings:
  - statement: ASNA-1 acts in neurons to promote DAF-28 secretion, interacts with ENPL-1/GRP94
      (likely in its oxidized chaperone form) and localizes to neuronal Golgi.
    supporting_text: We conclude that ASNA-1 is found in the Golgi and its localization there depends on ENPL-1.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text read. It is the source of the NEW Golgi apparatus row and of the
      mechanistic context for the insulin secretion annotation.
