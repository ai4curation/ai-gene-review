  - reference_id: PMID:33883621
    supporting_text: Taken together, these three properties of WRB-1 satisfy the requirement to regard this protein as the ER-based ASNA-1 receptor.
suggested_questions:
- question: By what mechanism does ASNA-1 promote DAF-28/insulin secretion in neurons,
    given that this role is separable from TA protein targeting and does not need WRB-1?
    Does it depend on the oxidized chaperone form and its interaction with ENPL-1?
- question: Is the arsenite and antimonite hypersensitivity of asna-1 mutants caused by a
    direct metalloid-handling activity of ASNA-1, or indirectly by loss of TA protein
    biogenesis or redox-sensor function? Is the detoxification process annotation
    appropriate for a eukaryotic GET3 ortholog?
- question: Which ASNA-1-dependent TA protein substrates account for cisplatin resistance
    and for the L1 growth arrest?
suggested_experiments:
- description: Reconstitute TA protein capture and release with purified reduced and oxidized
    ASNA-1, a model TA substrate (SEC-61beta) and the WRB-1 cytosolic domain, and measure
    ATPase stimulation and substrate transfer for wild type, dHis164 and A63V.
- description: Use proximity labelling or quantitative ER-membrane proteomics in asna-1 and
    wrb-1 mutants to define the in vivo set of ASNA-1-dependent TA substrates in neurons and
    intestine.
- description: Test whether ASNA-1 lacking ATPase activity, or locked in the oxidized state,
    still binds ENPL-1 and rescues DAF-28 secretion when expressed only in neurons.
