  review:
    summary: asna-1 mutants are more sensitive to As(III) and Sb(III) toxicity than wild
      type, and the purified protein has arsenite/antimonite-stimulated ATPase activity.
    action: KEEP_AS_NON_CORE
    reason: The mutant phenotype is experimental and the curator read the full text, so the
      row is kept. In bacteria ArsA powers the ArsB arsenite efflux pump. Eukaryotic GET3
      orthologs have been repurposed for TA protein targeting, and no arsenite transporter
      partner of ASNA-1 has been identified in worms. The sensitivity may reflect a direct
      role or an indirect effect of losing TA-protein biogenesis or redox-sensor function.
      The role is peripheral to the core function.
