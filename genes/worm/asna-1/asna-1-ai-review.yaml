id: P30632
gene_symbol: asna-1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: >-
  ASNA-1 (ZK637.5) is the C. elegans ortholog of yeast Get3 and human ASNA1/TRC40/GET3,
  a cytosolic P-loop ATPase of the ArsA/GET3 family. As a zinc-bridged homodimer it binds the
  hydrophobic C-terminal transmembrane domain of newly made tail-anchored (TA) proteins and,
  in an ATP-driven cycle, delivers them to the ER membrane receptor WRB-1 for insertion; in
  worms it is required for ER targeting of the TA protein SEC-61beta. ASNA-1 is broadly
  expressed (neurons, intestine, germline and other tissues) and is found in the cytoplasm, at
  the ER and in Golgi puncta of neurons. It exists in reduced and oxidized (chaperone-like)
  redox states; the reduced form is needed for TA targeting and cisplatin resistance. Null
  mutants arrest at the first larval stage, secrete less DAF-28/insulin, and are
  hypersensitive to cisplatin, arsenite and antimonite. The insulin-secretion role is
  genetically separable from TA targeting and involves an interaction with the ER chaperone
  ENPL-1/GRP94, but its mechanism is unknown. Purified ASNA-1 has ATPase activity that is
  stimulated by arsenite and antimonite, a property retained from the bacterial ArsA ancestor.
