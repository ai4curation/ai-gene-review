gene_symbol: asna-1
organism: worm
uniprot_id: P30632
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: ATPase required for the post-translational delivery of tail- anchored (TA)
    proteins to the endoplasmic reticulum. Recognizes and selectively binds the transmembrane
    domain of TA proteins in the cytosol. This complex then targets to the endoplasmic
    reticulum by membrane-bound receptors, where the tail-anchored protein is released
    for insertion. This process is regulated by ATP binding and hydrolysis. ATP binding
    drives the homodimer towards the closed dimer state, facilitating recognition
    of newly synthesized TA membrane proteins. ATP hydrolysis is required for insertion.
    Subsequently, the homodimer reverts towards the open dimer state, lowering its
    affinity for the membrane-bound receptor, and returning it to the cytosol to initiate
    a new round of targeting (By similarity). May be involved in insulin signaling.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P30632
  source_id: P30632
- source: Alliance_Imported
  text: asna-1 encodes a putative membrane transporter that is required,non-cell-autonomously,
    for L1 larvae to proceed through development whenfed, and is also required for
    normal insulin (DAF-28) secretion; thehuman ASNA1 ortholog stimulates insulin
    secretion in pancreatic betacells, and can transgenically rescue asna-1 mutant
    C. elegans,suggesting that ASNA-1's function is conserved among metazoa; asna-1mutants
    only progress to adulthood when rescued by maternal ASNA-1;without maternal rescue,
    asna-1 mutants eat food and endocytosenutrients normally, but nevertheless arrest
    growth as L1 larvae andlocalize DAF-16 to the nucleus as if food were absent;
    asna-1 isexpressed in some sensory neurons, in insulin-producing intestinalcells,
    and in hypodermis; ASNA-1 positively regulates dauer exit in thesame way that
    overexpression of the insulins DAF-28 or INS-4 does, andrequires DAF-28 to do
    this efficiently; ASNA-1 has ATPase activity invitro, and this activity is required
    for transgenic rescue of asna-1mutations.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00014025;class=Gene
  source_id: WB:WBGene00014025
- source: Alliance_Automated
  text: Enables ATP hydrolysis activity. Involved in detoxification of arsenic-containing
    substance and positive regulation of insulin secretion. Located in axon and neuronal
    cell body. Is expressed in several structures, including excretory cell; intestine;
    nervous system; pharynx; and reproductive system. Used to study cancer. Human
    ortholog(s) of this gene implicated in dilated cardiomyopathy. Orthologous to
    human GET3 (guided entry of tail-anchored proteins factor 3, ATPase).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00014025;class=Gene
  source_id: WB:WBGene00014025
