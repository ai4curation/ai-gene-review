- source: Alliance_Automated
  text: Enables ATP hydrolysis activity. Involved in detoxification of arsenic-containing
    substance and positive regulation of insulin secretion. Located in axon and neuronal
    cell body. Is expressed in several structures, including excretory cell; intestine;
    nervous system; pharynx; and reproductive system. Used to study cancer. Human
    ortholog(s) of this gene implicated in dilated cardiomyopathy. Orthologous to
    human GET3 (guided entry of tail-anchored proteins factor 3, ATPase).
