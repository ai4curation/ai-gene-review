gene_symbol: gpa-12
organism: worm
uniprot_id: Q19572
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Guanine nucleotide-binding proteins (G proteins) are involved as modulators
    or transducers in various transmembrane signaling systems (Probable). May play
    a role in resistance to fungal infection in the epidermis by regulating the up-regulation
    of several antimicrobial peptides of the NLP and CNC families (PubMed:19380113,
    PubMed:22470487). Upstream of plc-3, tpa-1 and the p38-like pathway, required
    for the expression of antimicrobial peptide nlp-29 in the epidermis in response
    to fungal infection or physical injury (PubMed:19380113).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q19572
  source_id: Q19572
- source: Alliance_Imported
  text: gpa-12 encodes a member of the G protein alpha subunit family of heterotrimeric
    GTPases that is orthologous to members of the mammalian Galpha G12/G13 family;
    GPA-12 activity is required for antifungal innate immunity and genetic analyses
    indicate that GPA-12 functions upstream of phospholipase Cs PLC-3 and EGL-8 as
    well as the TPA-1 protein kinase C in this process; genetic analyses also suggest
    that gpa-12 functions upstream of tpa-1 in pathways that regulated feeding and
    growth; gpa-12 is expressed in the pharynx and in the hypodermis.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00001674;class=Gene
  source_id: WB:WBGene00001674
- source: Alliance_Automated
  text: Predicted to enable D5 dopamine receptor binding activity and G protein activity.
    Involved in antifungal innate immune response and positive regulation of gene
    expression. Located in cytoplasm and nucleus. Is expressed in several structures,
    including excretory cell; intestine; nerve ring; neurons; and pharynx. Orthologous
    to human GNA12 (G protein subunit alpha 12) and GNA13 (G protein subunit alpha
    13).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00001674;class=Gene
  source_id: WB:WBGene00001674
- source: RefSeq
  text: Predicted to enable D5 dopamine receptor binding activity; G-protein beta/gamma-subunit
    complex binding activity; and GTPase activity. Involved in antifungal innate immune
    response and positive regulation of gene expression. Located in cytoplasm and
    nucleus. Is expressed in several structures, including excretory cell; intestine;
    nerve ring; neurons; and pharynx. Orthologous to human GNA12 (G protein subunit
    alpha 12) and GNA13 (G protein subunit alpha 13). [provided by Alliance of Genome
    Resources, Jul 2025]
  source_type: automated
