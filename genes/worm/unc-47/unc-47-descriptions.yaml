descriptions:
- source: UniProt
  text: Involved in the uptake of GABA into the synaptic vesicles.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P34579
  source_id: P34579
- source: Alliance_Imported
  text: unc-47 encodes a novel transmembrane vesicular GABA transporter; UNC-47 and
    UNC-46, a predicted novel transmembrane protein, are required in GABAergic neurons
    for all GABA neurotransmission, specifically for loading of GABA into synaptic
    vesicles, where UNC-47 is localized; UNC-47 is required for the localization of
    UNC-46, and when overexpressed can rescue unc-46 mutant animals; UNC-47 expression
    in type D neurons is transcriptionally regulated by the UNC-30 homeodomain protein.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00006783;class=Gene
  source_id: WB:WBGene00006783
- source: Alliance_Automated
  text: Predicted to enable glycine transmembrane transporter activity. Predicted
    to be involved in gamma-aminobutyric acid transport; glycine transport; and neurotransmitter
    loading into synaptic vesicle. Located in synaptic vesicle. Is expressed in neurons.
    Used to study alcohol use disorder. Human ortholog(s) of this gene implicated
    in developmental and epileptic encephalopathy 114 and generalized epilepsy with
    febrile seizures plus. Orthologous to human SLC32A1 (solute carrier family 32
    member 1).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00006783;class=Gene
