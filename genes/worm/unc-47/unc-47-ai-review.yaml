  label: Caenorhabditis elegans
description: UNC-47 is the vesicular GABA transporter of Caenorhabditis elegans and
  the founding member of the VGAT/VIAAT (SLC32A1) family. It is a ten-transmembrane
  protein of the synaptic vesicle membrane, expressed in GABAergic neurons, that
  concentrates cytosolic GABA into the vesicle lumen using the proton
  electrochemical gradient generated by the vesicular V-ATPase, so that GABAergic
  vesicles release transmitter on exocytosis. unc-47 mutants were isolated as
  uncoordinated animals defective in GABA release, and the gene's expression pattern
  is the standard marker of GABAergic identity in the worm. Its vertebrate
  orthologues load glycine in addition to GABA at inhibitory terminals.
