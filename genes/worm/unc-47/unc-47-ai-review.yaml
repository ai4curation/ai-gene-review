  review:
    summary: Mammalian VGAT loads glycine as well as GABA at inhibitory terminals,
      and the PAINT node is seeded from mouse and rat Slc32a1, where glycine
      transport is experimentally supported. C. elegans has no glycinergic
      neurotransmission and no worm experiment addresses glycine uptake by UNC-47.
    action: KEEP_AS_NON_CORE
    reason: The phylogenetic placement is sound (UNC-47 is inside the VGAT clade and
      is its founding member), and the transporter's substrate range plausibly
      includes glycine, but in the worm this activity has no physiological substrate
      pool to act on, so it is not a core function. It is not removed because the family-level
      substrate specificity is not contradicted by any worm data.
