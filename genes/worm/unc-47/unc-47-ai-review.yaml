suggested_questions:
- question: Has GABA uptake by UNC-47 itself (rather than by its rat orthologue) been
    measured, and does the worm transporter also accept glycine or beta-alanine
    despite the absence of glycinergic transmission in C. elegans?
suggested_experiments:
- description: Reconstitute UNC-47 in proteoliposomes or express it in a
    non-GABAergic cell line and measure proton-gradient-dependent uptake of GABA,
    glycine and beta-alanine.
