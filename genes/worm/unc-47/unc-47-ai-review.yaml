- term:
    id: GO:0015185
    label: gamma-aminobutyric acid transmembrane transporter activity
  evidence_type: ISS
  original_reference_id: PMID:9349821
  qualifier: enables
  review:
    summary: The GOA set contains the GABA transport process terms and the glycine
      transporter activity term, but no GABA molecular-function term for UNC-47,
      although GABA is the transporter's physiological substrate in the worm.
    action: NEW
    reason: Participation is direct - UNC-47 is the protein that carries GABA across
      the synaptic vesicle membrane, so it enables this activity itself rather than
      being required for a process someone else performs. The comparator check
      supports the addition rather than a convention against it - human SLC32A1
      (GO:0015185 ISS/IEA) and rat Slc32a1 (GO:0015185 IMP, PMID:19843525) both
      carry the GABA transporter activity term, and the same PAINT node already
      transferred the sister glycine activity term to unc-47, so the absence of the
      GABA term is an omission rather than a decision. Evidence is sequence
      similarity to the rat homologue characterized in the founding paper, whose
      vesicular GABA transport was measured directly.
    supported_by:
    - reference_id: PMID:9349821
      supporting_text: a rat homologue of unc-47 is expressed by central GABA neurons
        and confers vesicular GABA transport in transfected cells with kinetics and
        substrate specificity similar to those previously reported for synaptic
        vesicles from the brain
    - reference_id: PMID:9349821
      supporting_text: Thus VGAT is the first of a new family of neurotransmitter
        transporters
