  findings:
  - statement: unc-47 was implicated in GABA release in C. elegans.
    supporting_text: Studies in the nematode Caenorhabditis elegans have implicated
      the gene unc-47 in the release of GABA
  - statement: UNC-47 has ten predicted transmembrane domains, is expressed in GABA
      neurons and colocalizes with synaptic vesicles.
    supporting_text: Here we show that the sequence of unc-47 predicts a protein with
      ten transmembrane domains, that the gene is expressed by GABA neurons, and that
      the protein colocalizes with synaptic vesicles
  - statement: The rat homologue confers vesicular GABA transport in transfected
      cells.
    supporting_text: a rat homologue of unc-47 is expressed by central GABA neurons
      and confers vesicular GABA transport in transfected cells with kinetics and
      substrate specificity similar to those previously reported for synaptic
      vesicles from the brain
  - statement: VGAT and VMAT differ in the bioenergetic dependence of transport.
    supporting_text: Comparison of this vesicular GABA transporter (VGAT) with a
      vesicular transporter for monoamines shows that there are differences in the
      bioenergetic dependence of transport
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract only (no PMC record). The only primary reference for
      unc-47 in the GOA set; establishes identity, GABAergic expression and synaptic
      vesicle localization in the worm, with the transport assay performed on the rat
      orthologue.
