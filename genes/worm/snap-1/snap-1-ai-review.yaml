- id: file:worm/snap-1/snap-1-deep-research-falcon.md
  title: Deep research report for snap-1 (falcon / Edison Scientific Literature)
  findings:
  - statement: alpha-SNAP is a nonenzymatic adaptor that recognises assembled SNARE complexes and 
      positions NSF, which performs the ATP hydrolysis.
    supporting_text: it recognizes assembled SNARE complexes, recruits/positions NSF, and enables 
      NSF-driven, ATP-dependent SNARE disassembly and recycling. ATP hydrolysis is performed by NSF,
      not SNAP-1.
  - statement: Worm snap-1 is paired with the chromosome V lethal locus let-408 and annotated as 
      alpha-soluble NSF attachment protein.
    supporting_text: Published worm literature pairs *snap-1* with the chromosome V lethal locus 
      *let-408* and annotates its product as alpha-soluble NSF attachment protein (α-SNAP).
  - statement: snap-1 RNAi is associated with defective embryonic osmotic integrity and the tm2068 
      deletion is reported sterile/lethal.
    supporting_text: '**snap-1 RNAi** was associated with defective embryonic osmotic integrity; the **tm2068
      deletion** is reported as sterile/lethal.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: LLM literature synthesis; the only source of worm-specific snap-1 information 
      available, since GOA cites no primary snap-1 paper. Its own confidence notes stress that the 
      phenotype summary lacks penetrance and rescue data and that no direct worm trafficking assay 
      exists, so it is used for orientation and not as a basis for new annotations.
