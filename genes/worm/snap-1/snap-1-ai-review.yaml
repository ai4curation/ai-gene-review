suggested_questions:
- question: snap-1 is reported to be the essential locus let-408, with a sterile/lethal deletion and
    embryonic osmotic-integrity defects on RNAi; which trafficking step fails first, and do 
    hypomorphs phenocopy nsf-1 (anchor-cell fusion failure, synaptic transmission defects)?
suggested_experiments:
- description: CRISPR null and auxin-degron alleles of snap-1 scored for lethality, aldicarb 
    sensitivity and anchor-cell fusion.
  hypothesis: SNAP-1 is the sole alpha-SNAP and is required for all NSF-1-dependent SNARE recycling.
