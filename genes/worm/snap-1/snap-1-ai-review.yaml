  label: Caenorhabditis elegans
description: >-
  SNAP-1 is the Caenorhabditis elegans alpha-soluble NSF attachment protein (alpha-SNAP), the
  all-alpha-helical adaptor that binds cis-SNARE complexes left in a membrane after fusion and
  recruits and activates the AAA+ ATPase NSF-1, whose ATP hydrolysis then pulls the SNARE
  four-helix bundle apart. By regenerating free SNAREs, SNAP-1 supports every SNARE-dependent
  fusion pathway in the secretory and endocytic systems, including ER-Golgi transport and the
  recycling of the synaptic SNAREs UNC-64, RIC-4 and SNB-1 after synaptic vesicle exocytosis.
  Its worm-specific biology is largely uncharacterised; the gene is a transcriptional target of
  the IRE-1/XBP-1 unfolded-protein-response pathway. Despite the name, SNAP-1 is unrelated to
  the Qbc-SNARE SNAP-25 (RIC-4).
