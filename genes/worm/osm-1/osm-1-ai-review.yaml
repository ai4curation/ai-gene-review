id: Q22830
gene_symbol: osm-1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: OSM-1 is the Caenorhabditis elegans ortholog of IFT172, the largest subunit of
  the intraflagellar transport complex B (IFT-B). It is a large protein (1737 aa) with an
  N-terminal array of WD40 repeats forming beta-propellers followed by an extended tetratricopeptide-like
  (TPR) alpha-solenoid with WAA repeats, a domain architecture shared with IFT-A subunits
  IFT140/WDR19 and with IFT80. OSM-1 is expressed in ciliated chemosensory neurons, concentrates
  at the base of the transition zone (basal body region) and moves bidirectionally along dendrites
  and along the ciliary axoneme as part of IFT particles, at the same rates as kinesin-II
  and the IFT-B subunit OSM-6; its retrograde movement within cilia depends on the dynein-2
  heavy chain CHE-3. osm-1 mutants have normal transition zones but severely shortened axonemes,
  ectopic doublet microtubules proximal to the cilium, defective dye filling, osmotic avoidance
  and chemotaxis defects, and dauer-defective phenotypes, all secondary to loss of sensory
  cilium structure. By analogy to Chlamydomonas IFT172/FLA11, OSM-1 is expected to act at
  the ciliary tip in the conversion of anterograde to retrograde IFT trains.
