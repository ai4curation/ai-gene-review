    summary: Root MF term with ND evidence. No molecular activity has been demonstrated biochemically
      for C. elegans OSM-1; it is known as a structural subunit of the IFT-B particle and
      IFT cargo of kinesin-II, but no binding partner or activity has been mapped in the worm.
