core_functions:
- description: OSM-1/IFT172 is a structural subunit of the IFT-B particle in ciliated sensory
    neurons. It assembles with IFT-B at the ciliary base, is carried anterogradely by kinesin-2
    and returned by dynein-2, and is required to build the sensory ciliary axoneme. No discrete
    molecular activity has been assigned in the worm.
  supported_by:
  - reference_id: PMID:10545497
    supporting_text: OSM-1 and OSM-6, all move at approximately 1.1 microm/s in the retrograde
      direction along cilia and dendrites
  - reference_id: PMID:2428682
    supporting_text: The cilia in che-13 (e1805), osm-1 (p808), osm-5 (p813), and osm-6 (p811)
      mutants have normal transition zones and severely shortened axonemes.
  directly_involved_in:
