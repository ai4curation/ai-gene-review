suggested_questions:
- question: Does C. elegans OSM-1 function at the ciliary tip in IFT train turnaround, as
    Chlamydomonas IFT172/FLA11 does, and do hypomorphic osm-1 alleles accumulate IFT particles
    at the tip?
- question: Does the C-terminal TPR region of OSM-1 bind membranes or the BBSome to couple
    IFT-B to ciliary membrane cargo in worm sensory cilia?
suggested_experiments:
- description: Image endogenously tagged IFT-B and IFT-A subunits in osm-1 hypomorphic or
    C-terminal truncation alleles to test for tip accumulation and defective anterograde-to-retrograde
    conversion.
- description: Map OSM-1 binding partners within IFT-B by in vivo proximity labeling in ciliated
    neurons or cross-linking mass spectrometry of purified worm IFT-B.
