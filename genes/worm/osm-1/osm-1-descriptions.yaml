findings:
- category: discrepancy
  text: UniProt says OSM-1 is required for transport in the 'motile cilium'; the review
    states all C. elegans cilia are non-motile sensory cilia.
  sources:
  - UniProt
- category: gap
  text: WormBase's ivermectin-resistance link with avr-14 is not covered in the review.
  sources:
  - Alliance_Imported
review:
  reviewer: AI
  rubrics:
  - rubric: overall_concordance
    score: 4
  overall_notes: All agree on an IFT-B subunit for sensory cilia; UniProt mislabels
    cilia as motile.
