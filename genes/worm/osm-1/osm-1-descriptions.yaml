    - rubric: compactness
      score: 3
    - rubric: completeness
      score: 4
    - rubric: specificity
      score: 4
    overall_notes: IFT172 ortholog with bidirectional IFT movement and middle-segment
      assembly; adds peripheral ivermectin and osmotic avoidance phenotypes.
- source: Alliance_Automated
  text: Involved in dauer entry and non-motile cilium assembly. Located in ciliary
    transition zone and non-motile cilium. Part of intraciliary transport particle
    B. Is expressed in nervous system. Human ortholog(s) of this gene implicated in
    Bardet-Biedl syndrome 20; retinitis pigmentosa 71; and short-rib thoracic dysplasia
    10 with or without polydactyly. Orthologous to human IFT172 (intraflagellar transport
    172).
