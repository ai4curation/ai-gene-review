descriptions:
- source: UniProt
  text: Component of the intraflagellar transport (IFT) complex B required for transport
    of proteins in the motile cilium (PubMed:28479320). May be required for ciliary
    entrance and transport of specific ciliary cargo proteins such as che-3 which
    are related to motility (PubMed:28479320). Required for the maintenance and formation
    of chemosensory cilia that detect chemosensory cues (PubMed:10545497).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q22830
  source_id: Q22830
  review:
    reviewer: AI
    rubrics:
    - rubric: correctness
      score: 3
    - rubric: utility
      score: 3
    - rubric: compactness
      score: 4
    - rubric: completeness
      score: 3
    - rubric: specificity
      score: 3
    overall_notes: IFT-B membership and chemosensory cilium formation are correct,
      but it calls the cilium 'motile' and che-3 cargo 'related to motility'; C. elegans
      cilia are non-motile.
- source: Alliance_Imported
  text: osm-1 encodes a WD- and WAA-repeat containing protein that is the C. elegans
    ortholog of intraflagellar transport (IFT) complex B component IFT172; OSM-1 is
    a presumptive cargo molecule for kinesin-II, and OSM-1 is required, along with
    OSM-6, for the proper assembly of the middle segments of sensory cilia; osm-1
    may act in a pathway with avr-14 to affect resistance to ivermectin-induced cessation
    of pumping, and mutants are defective in avoidance of solutions of high osmotic
    strength; an OSM-1::GFP fusion protein is expressed in amphid and phasmid chemosensory
    neurons where it undergoes both anterograde and retrograde intraflagellar transport.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00003883;class=Gene
  source_id: WB:WBGene00003883
