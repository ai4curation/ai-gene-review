- source: Alliance_Imported
  text: ufd-1 encodes the C. elegans ortholog of Saccharomyces cerevisiae Ufd1p, a
    protein that is part of the Cdc48/Ufd1/Npl4 complex that mediates endoplasmic
    reticulum (ER)-associated protein degradation; loss of ufd-1 function via RNAi
    results in increased sensitivity to ER stress indicating that, like its yeast
    ortholog, ufd-1 plays a role in ER-associated protein degradation; ufd-1 is also
    essential for embryonic development and for efficient DNA replication during cell
    cycle progression; UFD-1 interacts with both CDC-48.1 and CDC-48.2 as well as
    NPL-4.2 in yeast two-hybrid assays, suggesting that an analogous CDC-48/UFD1/NPL4
    complex, predicted to localize to the endoplasmic reticulum, exists in C. elegans;
    a YFP::UFD-1 reporter has also been shown to localize to the nucleus.
