descriptions:
- source: UniProt
  text: Functions at a post-ubiquitination step in the ubiquitin fusion degradation
    (UFD) pathway (By similarity). In association with npl-4.1 and/or npl-4.2 and
    ATPase cdc-48.1 and/or cdc-48.2, involved in the cytoplasmic elimination of misfolded
    proteins exported from the ER (PubMed:16647269, PubMed:22768338). This pathway,
    known as ERAD, prevents the activation of the unfolded protein response (UPR)
    caused by the accumulation of misfolded proteins in the ER (PubMed:16647269, PubMed:22768338).
    During S phase and in association with npl-4.1 and/or npl-4.2, cdc-48.1 and/or
    cdc-48.2 and ubxn-3, ensures the degradation of DNA licensing factor cdt-1 after
    the initiation of DNA replication and thus the disassembly of the DNA replication
    CMG helicase complex by promoting the dissociation from chromatin of several of
    its components including cdc-45 and sld-5 (PubMed:18728180, PubMed:21981920, PubMed:26842564).
    Regulates ubxn-3 nuclear localization during S phase (PubMed:26842564).
