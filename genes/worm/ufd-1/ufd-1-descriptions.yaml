gene_symbol: ufd-1
organism: worm
uniprot_id: Q19584
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Functions at a post-ubiquitination step in the ubiquitin fusion degradation
    (UFD) pathway (By similarity). In association with npl-4.1 and/or npl-4.2 and
    ATPase cdc-48.1 and/or cdc-48.2, involved in the cytoplasmic elimination of misfolded
    proteins exported from the ER (PubMed:16647269, PubMed:22768338). This pathway,
    known as ERAD, prevents the activation of the unfolded protein response (UPR)
    caused by the accumulation of misfolded proteins in the ER (PubMed:16647269, PubMed:22768338).
    During S phase and in association with npl-4.1 and/or npl-4.2, cdc-48.1 and/or
    cdc-48.2 and ubxn-3, ensures the degradation of DNA licensing factor cdt-1 after
    the initiation of DNA replication and thus the disassembly of the DNA replication
    CMG helicase complex by promoting the dissociation from chromatin of several of
    its components including cdc-45 and sld-5 (PubMed:18728180, PubMed:21981920, PubMed:26842564).
    Regulates ubxn-3 nuclear localization during S phase (PubMed:26842564).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q19584
  source_id: Q19584
- source: Alliance_Imported
  text: ufd-1 encodes the C. elegans ortholog of Saccharomyces cerevisiae Ufd1p, a
    protein that is part of the Cdc48/Ufd1/Npl4 complex that mediates endoplasmic
    reticulum (ER)-associated protein degradation; loss of ufd-1 function via RNAi
    results in increased sensitivity to ER stress indicating that, like its yeast
    ortholog, ufd-1 plays a role in ER-associated protein degradation; ufd-1 is also
    essential for embryonic development and for efficient DNA replication during cell
    cycle progression; UFD-1 interacts with both CDC-48.1 and CDC-48.2 as well as
    NPL-4.2 in yeast two-hybrid assays, suggesting that an analogous CDC-48/UFD1/NPL4
    complex, predicted to localize to the endoplasmic reticulum, exists in C. elegans;
    a YFP::UFD-1 reporter has also been shown to localize to the nucleus.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00006733;class=Gene
  source_id: WB:WBGene00006733
- source: Alliance_Automated
  text: Predicted to enable polyubiquitin modification-dependent protein binding activity.
    Involved in ERAD pathway; embryo development; and positive regulation of protein
    localization to nucleus. Located in cytoplasm and nucleus. Part of VCP-NPL4-UFD1
    AAA ATPase complex. Used to study velocardiofacial syndrome. Human ortholog(s)
    of this gene implicated in DiGeorge syndrome and schizophrenia. Orthologous to
    human UFD1 (ubiquitin recognition factor in ER associated degradation 1).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00006733;class=Gene
