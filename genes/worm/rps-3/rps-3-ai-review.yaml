suggested_questions:
- question: Does C. elegans RPS-3 have intrinsic AP-lyase or 8-oxoguanine-processing activity, and does a free (non-ribosomal)
    nuclear pool act in base excision repair together with UNG-1 and APN-1?
- question: Is the IBA propagation of positive regulation of apoptotic signaling pathway (PTN000924666, seeded only
    by human RPS3) placed at too deep a node, given the absence of the relevant death-receptor/JNK signalling contexts
    in nematodes?
suggested_experiments:
- description: Purify recombinant CeRPS-3 and test AP-lyase activity on abasic-site and 8-oxoG-containing DNA substrates,
    with KH-domain and lysine point mutants as controls.
- description: Endogenously tag rps-3 and use tissue-specific auxin-inducible degradation with polysome profiling
    to separate a translation-independent DNA-damage sensitivity from general loss of 40S function; test for nuclear
    accumulation after H2O2 exposure.
