- id: PMID:39209556
  title: High-resolution reconstruction of a C. elegans ribosome sheds light on evolutionary dynamics and tissue
    specificity.
  findings:
  - statement: Cryo-EM structure of the C. elegans 80S ribosome; all ribosomal proteins except stalk proteins, eL28
      and RACK-1 were modelled, including uS3.
    supporting_text: We also modeled the ribosomal proteins, with the exceptions of those bound to the P- and L-stalks
      (uL10/P0, P1, P2, uL1, uL11), eL28, and RACK-1
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Sehgal et al. 2024, RNA. Source of PDB 9CAI used for the secondary-structure features in P48152;
      uS3 is not among the unmodelled proteins.
- id: PMID:16247027
  title: A complex containing the Sm protein CAR-1 and the RNA helicase CGH-1 is required for embryonic cytokinesis
    in Caenorhabditis elegans.
  findings:
  - statement: RNAi of RPS-3 (with five other RPS proteins), used as a translation-inhibition control, caused penetrant
      sterility; partial depletion gave osmotically sensitive embryos without cytokinesis defects.
    supporting_text: Depletions of six different ribosomal subunits (RPS-1, -3, -5, -11, -18, and -23) each resulted
      in penetrant sterility (unpublished data).
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Full text read. Paper is about CAR-1/CGH-1; RPS-3 data are an unpublished-data control showing
      necessity phenotypes consistent with general translation loss. Does not justify any process annotation.
- id: PMID:35809390
  title: C. elegans ribosomal protein S3 protects against H(2)O(2)-induced DNA damage and suppresses spontaneous
    mutations in yeast.
  findings:
  - statement: CeRPS-3 associates with UNG-1 (affinity purification-MS, yeast two-hybrid); knockdown sensitises
      worms to H2O2; CeRPS-3 complements yeast apn1 apn2 H2O2 sensitivity and mutator phenotype.
    supporting_text: A cross-species complementation experiment reveals that the expression of CeRPS-3 rescued the
      hydrogen peroxide sensitivity, and suppressed the high mutation frequency of the yeast AP endonuclease-deficient
      strain lacking Apn1 and Apn2.
  reference_review:
    relevance: MEDIUM
    correctness: LOW_QUALITY
    review_notes: Abstract only (full text not cached). Evidence for a DNA repair role is indirect (knockdown sensitivity
      confounded by translation loss; heterologous complementation); the authors only propose an auxiliary repair
      function.
  full_text_unavailable: true
