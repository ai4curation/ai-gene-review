  review:
    summary: Pro-apoptotic signalling inherited from human RPS3 only; no nematode evidence.
    action: MARK_AS_OVER_ANNOTATED
    reason: The PAINT node PTN000924666 is seeded solely by human RPS3 (P23396), whose pro-apoptotic activity is
      an extra-ribosomal, context-dependent function shown largely in overexpression and death-receptor/JNK paradigms.
      Those signalling contexts are not part of the nematode core apoptosis machinery (CED-9/CED-4/CED-3) and there
      are no C. elegans data linking rps-3 to apoptosis. Propagation of this vertebrate moonlighting role to the
      worm is not supported; the term is likely an over-annotation here.
    supported_by:
    - reference_id: file:worm/rps-3/rps-3-deep-research-manual.md
