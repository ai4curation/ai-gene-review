id: P48152
gene_symbol: rps-3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: rps-3 (C23G10.3) encodes the Caenorhabditis elegans small ribosomal subunit protein uS3 (40S ribosomal
  protein S3), a member of the universal uS3 family with an N-terminal KH type-2 RNA-binding domain and a C-terminal
  uS3 domain. It is a core protein of the head of the cytosolic 40S subunit, at the mRNA entry channel, and is resolved
  in the cryo-EM structure of the C. elegans 80S ribosome. As a structural constituent of the ribosome it contributes
  to cytoplasmic mRNA translation; RNAi depletion causes sterility and osmotically sensitive embryos, as expected
  for general loss of translation. CeRPS-3 interacts with uracil DNA glycosylase UNG-1 and can suppress the oxidative-damage
  sensitivity and mutator phenotype of yeast AP endonuclease mutants, suggesting a possible auxiliary role in base
  excision repair that has not been shown biochemically for the worm protein.
