descriptions:
- source: Alliance_Imported
  text: rps-3 encodes a small ribosomal subunit S3 protein that contains a KH RNA-binding
    domain and by homology,is predicted to function in protein biosynthesis; in C.
    elegans, RPS-3 activity is required for embryonic and germline development, as
    well as the overall health of the animal.
  source_type: curated
