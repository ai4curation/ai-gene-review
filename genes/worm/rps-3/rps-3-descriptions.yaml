  source_id: WB:WBGene00004472
- source: Alliance_Automated
  text: Predicted to be a structural constituent of ribosome. Predicted to be involved
    in positive regulation of apoptotic signaling pathway. Predicted to be located
    in cytosolic ribosome. Predicted to be part of cytosolic small ribosomal subunit.
    Predicted to be active in nucleus. Orthologous to human RPS3 (ribosomal protein
    S3).
