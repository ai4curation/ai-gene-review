suggested_questions:
  - question: Which phosphoinositides does the UNC-26 Sac1 domain hydrolyse in vivo, and is its 4-phosphatase
      activity needed in non-neuronal tissues where coated vesicles also accumulate in unc-26 mutants?
  - question: Is the Golgi coated-vesicle accumulation in unc-26 mutants a direct AP-1 uncoating defect
      (via PI(4)P or PI(4,5)P2 hydrolysis) or secondary to endosomal trafficking defects?
suggested_experiments:
  - description: Lipidomic measurement of PI(4,5)P2, PI(4)P and PI(3,5)P2 in unc-26 null, Sac1-dead (C378S,D380N)
      and 5-phosphatase-dead (D716A) single-copy rescue strains.
    hypothesis: Only the 5-phosphatase-dead allele raises PI(4,5)P2 at synapses, while Sac1-dead alleles
      alter PI(4)P without synaptic consequences.
