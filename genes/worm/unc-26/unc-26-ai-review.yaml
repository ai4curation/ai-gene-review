  - description: 'PI(4,5)P2 5-phosphatase acting on endocytic membranes at the presynaptic endocytic zone:
      targeted by its Sac1 domain to endophilin-bent membranes, UNC-26 dephosphorylates PI(4,5)P2 so that
      clathrin/AP-2 coats are shed from newly budded synaptic vesicles, pits complete budding, and synaptic
      vesicles are regenerated from endosomes after ultrafast endocytosis.'
