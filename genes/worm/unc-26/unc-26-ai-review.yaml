id: G5ECL2
gene_symbol: unc-26
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: 'UNC-26 is the Caenorhabditis elegans synaptojanin, a 1,119-residue polyphosphoinositide
  phosphatase with an N-terminal Sac1 phosphatase domain, a central inositol 5-phosphatase domain and
  a C-terminal proline-rich domain. Its essential reaction is 5-dephosphorylation of phosphatidylinositol
  4,5-bisphosphate on endocytic membranes: an inactivating D716A substitution in the 5-phosphatase abolishes
  rescue of evoked synaptic currents, whereas the proline-rich domain is dispensable and the Sac1 domain
  serves mainly as a non-catalytic targeting module that places the enzyme where endophilin (UNC-57) bends
  membranes. unc-26 null synapses are depleted of synaptic vesicles and accumulate endocytic pits, almost
  tenfold more clathrin-coated vesicles, and endosome-like intermediates, and coated vesicles also accumulate
  at the Golgi and in non-neuronal tissues, showing that PI(4,5)P2 hydrolysis is required for vesicle
  budding, for shedding the clathrin coat after fission, and for regenerating synaptic vesicles from the
  endosomes formed by ultrafast endocytosis. The resulting loss of cholinergic and GABAergic transmission
  produces the uncoordinated, small, coiling phenotype that named the gene.'
