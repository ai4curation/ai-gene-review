  - id: PMID:10931870
    title: Mutations in synaptojanin disrupt synaptic vesicle recycling.
    findings:
      - statement: unc-26 encodes worm synaptojanin.
        supporting_text: Here, we demonstrate that the unc-26 gene encodes the Caenorhabditis elegans
          ortholog of synaptojanin.
      - statement: Defects in budding, uncoating, endosomal recovery and cytoskeletal tethering.
        supporting_text: Specifically, we observed defects in the budding of synaptic vesicles from the
          plasma membrane, in the uncoating of vesicles after fission, in the recovery of vesicles from
          endosomes, and in the tethering of vesicles to the cytoskeleton.
      - statement: Vesicle depletion, endocytic pits and coated vesicles.
        supporting_text: unc-26 mutants exhibit a depletion of vesicles at synapses, an accumulation of
          endocytic pits, and an accumulation of coated vesicles.
      - statement: Tenfold coated-vesicle accumulation.
        supporting_text: unc-26(s1710) animals contained an almost tenfold increase in the number of coated
          vesicles over the wild-type (Fig.
      - statement: Uncoating blocked in diverse tissues.
        supporting_text: The accumulation of coated vesicles in diverse tissues indicated that, in the
          absence of synaptojanin, the uncoating process is blocked or delayed for synaptic vesicle endocytosis,
          as well as for other trafficking events.
      - statement: Presynaptic cholinergic and GABAergic defects.
        supporting_text: Behavioral and pharmacological analyses indicate that unc-26 mutants possess
          a presynaptic disruption of cholinergic and GABA neurotransmission.
      - statement: Coated vesicles at the Golgi.
        supporting_text: The presence of coated vesicles at both the Golgi complex and the synapse in
          unc-26 mutants suggest similarities between uncoating mechanisms acting on AP1 and AP2 clathrin
          complexes.
      - statement: Domain architecture.
        supporting_text: 'The longest predicted Ce-synaptojanin protein is 1,119 amino acids and contains
          the three defining domains of synaptojanin: an amino-terminal Sac1-like polyphosphoinositide
          phosphatase domain, a PI 5-phosphatase domain, and a COOH-terminal proline-rich domain (Fig.'
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: Full text cached; founding characterization.
  - id: PMID:25918845
    title: Synaptojanin cooperates in vivo with endophilin through an unexpected mechanism.
    findings:
      - statement: PRD dispensable; core function in the two phosphatase domains.
        supporting_text: 'Surprisingly, we find that truncated synaptojanin lacking the PRD domain sustains
          normal synaptic transmission, indicating that synaptojanin''s core function in vivo resides
          in the remaining two domains that contain phosphoinositide-phosphatase activities: an N-terminal
          Sac1 phosphatase domain and a 5-phosphatase domain.'
      - statement: Sac1 domain targets synaptojanin to synapses.
        supporting_text: We further show that the Sac1 domain plays an unexpected role in targeting synaptojanin
          to synapses.
      - statement: 5-phosphatase D716A abolishes rescue.
        supporting_text: The stimulus-evoked EPSC amplitudes were significantly reduced in worms carrying
          UNC-26∆PRD (D716A) mutant proteins.
      - statement: Tethering the 5-phosphatase to endophilin bypasses Sac1.
        supporting_text: In agreement with this notion, tethering synaptojanin 5-phosphatase to endophilin
          bypasses the requirement of the Sac1 domain and revives synaptojanin activity, suggesting that
          synaptojanin 5-phosphatase functions at sites where endophilin resides.
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: Full text cached; domain-function dissection in vivo.
