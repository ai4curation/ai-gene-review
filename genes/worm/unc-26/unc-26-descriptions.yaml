gene_symbol: unc-26
organism: worm
uniprot_id: G5ECL2
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Probable inositol 5-phosphatase which regulates synaptic vesicle recycling
    in neurons by regulating clathrin-mediated endocytosis.
  source_type: curated
  url: https://www.uniprot.org/uniprot/G5ECL2
  source_id: G5ECL2
- source: Alliance_Imported
  text: unc-26 encodes synaptojanin, a polyphosphoinositide phosphatase orthologous
    to human synaptojanin 1 (OMIM:604297, 309000, which when mutated leads to Lowe
    oculocerebrorenal syndrome); UNC-26 is required for normal locomotion, pharyngeal
    pumping, and defecation, and specifically, appears to function in multiple steps
    of synaptic vesicle recycling; UNC-26 may also play a role in cytoskeletal organization.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00006763;class=Gene
  source_id: WB:WBGene00006763
- source: Alliance_Automated
  text: Predicted to enable inositol-1,4,5-trisphosphate 5-phosphatase activity; phosphatidylinositol-3,5-bisphosphate
    5-phosphatase activity; and phosphatidylinositol-4,5-bisphosphate 5-phosphatase
    activity. Involved in several processes, including Golgi vesicle uncoating; acetylcholine
    transport; and synaptic vesicle endocytosis. Located in synapse. Is expressed
    in several structures, including intestine; nervous system; pharynx; tail; and
    vulval muscle. Used to study Down syndrome and early-onset Parkinson's disease.
    Human ortholog(s) of this gene implicated in Parkinson's disease; Parkinson's
    disease 20; and developmental and epileptic encephalopathy 53. Orthologous to
    several human genes including SYNJ1 (synaptojanin 1).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00006763;class=Gene
  source_id: WB:WBGene00006763
