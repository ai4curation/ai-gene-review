      score: 4
    - rubric: completeness
      score: 3
    - rubric: specificity
      score: 3
    overall_notes: Correct on synaptojanin orthology, recycling steps and phenotypes.
      Cytoskeletal organization is non-core in the review.
- source: Alliance_Automated
  text: Predicted to enable inositol-1,4,5-trisphosphate 5-phosphatase activity; phosphatidylinositol-3,5-bisphosphate
    5-phosphatase activity; and phosphatidylinositol-4,5-bisphosphate 5-phosphatase
    activity. Involved in several processes, including Golgi vesicle uncoating; acetylcholine
    transport; and synaptic vesicle endocytosis. Located in synapse. Is expressed
    in several structures, including intestine; nervous system; pharynx; tail; and
    vulval muscle. Used to study Down syndrome and early-onset Parkinson's disease.
    Human ortholog(s) of this gene implicated in Parkinson's disease; Parkinson's
    disease 20; and developmental and epileptic encephalopathy 53. Orthologous to
    several human genes including SYNJ1 (synaptojanin 1).
