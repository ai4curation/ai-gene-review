descriptions:
- source: UniProt
  text: 'Probable ligand for tyrosine kinase receptor let-23. Essential for vulval
    induction, where it acts downstream of the synthetic multivulva (synMuv) class
    genes (PubMed:15455032, PubMed:1641037, PubMed:16678779, PubMed:17891142). Probably
    by activating let-23, phospholipase plc-3 and inositol 1,4,5-trisphosphate receptor
    itr-1 signaling cascade, plays a role in ovulation by promoting gonadal sheath
    cell contractions and spermatheca dilatation during ovulation (PubMed:15194811,
    PubMed:9491893). Probably by regulating neuronal transmission in ALA neurons,
    mediates the decrease in pharyngeal pumping and locomotion during the quiescent
    state that precedes each larval molt, by activating receptor lin-23-mediated signaling
    cascade (PubMed:17891142). . [Isoform a]: Essential for vulval induction; its
    activity on vulval precursor cells is partially dependent on rom-1. . [Isoform
    c]: Essential for vulval induction; acts independently of rom-1.'
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q03345
  source_id: Q03345
