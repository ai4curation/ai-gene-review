descriptions:
- source: UniProt
  text: 'Probable ligand for tyrosine kinase receptor let-23. Essential for vulval
    induction, where it acts downstream of the synthetic multivulva (synMuv) class
    genes (PubMed:15455032, PubMed:1641037, PubMed:16678779, PubMed:17891142). Probably
    by activating let-23, phospholipase plc-3 and inositol 1,4,5-trisphosphate receptor
    itr-1 signaling cascade, plays a role in ovulation by promoting gonadal sheath
    cell contractions and spermatheca dilatation during ovulation (PubMed:15194811,
    PubMed:9491893). Probably by regulating neuronal transmission in ALA neurons,
    mediates the decrease in pharyngeal pumping and locomotion during the quiescent
    state that precedes each larval molt, by activating receptor lin-23-mediated signaling
    cascade (PubMed:17891142). . [Isoform a]: Essential for vulval induction; its
    activity on vulval precursor cells is partially dependent on rom-1. . [Isoform
    c]: Essential for vulval induction; acts independently of rom-1.'
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q03345
  source_id: Q03345
- source: Alliance_Imported
  text: lin-3 encodes a member of the EGF family of peptide growth factors that affects
    induction of vulval development, viability, ovulation, behavioral quiescence after
    stress, and male spicule development; it acts genetically upstream of its presumptive
    receptor let-23, and is expressed in multiple locations consistent with it acting
    as a localized ligand; for example, the anchor cell of the developing gonad, which
    induces vulval development.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00002992;class=Gene
  source_id: WB:WBGene00002992
- source: Alliance_Automated
  text: Enables receptor ligand activity. Involved in several processes, including
    egg-laying behavior; positive regulation of ovulation; and positive regulation
    of vulval development. Located in plasma membrane. Is expressed in several structures,
    including excretory canal; germ line; hermaphrodite gonad; rectal epithelial cell;
    and vulF.
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00002992;class=Gene
