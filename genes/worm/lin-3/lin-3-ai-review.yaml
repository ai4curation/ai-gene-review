- term:
    id: GO:0002119
    label: nematode larval development
  evidence_type: IMP
  original_reference_id: PMID:3996896
  qualifier: involved_in
  review:
    summary: lin-3 mutants affect nematode larval vulval lineages through loss
      of the LIN-3 inductive signal.
    action: KEEP_AS_NON_CORE
    reason: Nematode larval development is a broad parent-level process rather
      than LIN-3's core activity. The later molecular cloning paper shows that
      lin-3 is the EGF-like anchor-cell signal required for vulval induction,
      supporting a real but non-core larval-development annotation.
    additional_reference_ids:
    - PMID:1641037
    supported_by:
    - reference_id: PMID:1641037
      supporting_text: |-
        The lin-3 gene is necessary for induction of the Caenorhabditis elegans vulva by
        the anchor cell. It encodes a molecule similar to epidermal growth factor and to
        transforming growth factor-alpha and acts through the epidermal growth factor
        receptor homologue let-23. Expression of lin-3 in the anchor cell stimulates
        vulval induction; lin-3 may encode the vulval inducing signal.
