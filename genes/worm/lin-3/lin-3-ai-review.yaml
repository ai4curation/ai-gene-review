- term:
    id: GO:0030431
    label: sleep
  evidence_type: IMP
  original_reference_id: PMID:17891142
  qualifier: involved_in
  review:
    summary: LIN-3/LET-23 signaling can induce behavioral quiescence through
      the ALA neuron.
    action: KEEP_AS_NON_CORE
    reason: Ectopic LIN-3 is sufficient to drive quiescence, acting through
      neuronal LET-23. This is a real physiological output of the same ligand
      but is context-specific rather than the core developmental EGFR
      induction role.
    supported_by:
    - reference_id: PMID:17891142
      supporting_text: |-
        Ectopic expression of the EGF-like ligand
        LIN-3 at any stage induces a reversible cessation of feeding and locomotion.
        These effects are mediated by neuronal EGFR (also called LET-23)
