  evidence_type: IDA
  original_reference_id: PMID:29358026
  qualifier: involved_in
  review:
    summary: LIN-3 stimulation of full-length LET-23 drives EGFR-family
      signaling in the cell-based receptor assay.
    action: ACCEPT
    reason: Liu et al. used purified LIN-3 EGF domain to stimulate full-length
      LET-23 and showed that allosteric-interface mutations abrogate the
      LIN-3-dependent cellular signaling response, directly supporting the
      pathway row.
    supported_by:
    - reference_id: PMID:29358026
      supporting_text: Most importantly, these mutations also abrogated LET-23
        signaling in cells in response to its ligand, LIN-3.
