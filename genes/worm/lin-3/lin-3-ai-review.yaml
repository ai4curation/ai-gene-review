id: Q03345
gene_symbol: lin-3
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: >-
  lin-3 encodes the C. elegans EGF-family ligand for the LET-23 receptor
  tyrosine kinase. LIN-3 is produced as a membrane-associated precursor and acts
  as a local inductive signal that activates LET-23/Ras/MAPK signaling in
  responding epithelial cells, most prominently during vulval induction and male
  spicule development.
