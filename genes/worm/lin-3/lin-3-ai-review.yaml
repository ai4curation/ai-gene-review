- term:
    id: GO:0018991
    label: egg-laying behavior
  evidence_type: IMP
  original_reference_id: PMID:1641037
  qualifier: involved_in
  supporting_entities:
  - WB:WBVar00089466
  - WB:WBVar00248903
  review:
    summary: LIN-3 loss causes egg-laying defects through vulval-development
      failure, not a demonstrated direct role in the egg-laying motor program.
    action: MARK_AS_OVER_ANNOTATED
    reason: The Hill and Sternberg rows establish LIN-3 as the anchor-cell
      inducer of the vulva. Egg-laying is downstream of forming a functional
      vulval opening, so GO:0018991 overstates the direct biological process
      executed by the ligand.
    supported_by:
    - reference_id: PMID:1641037
      supporting_text: |-
        The lin-3 gene is necessary for induction of the Caenorhabditis elegans vulva by
        the anchor cell.
