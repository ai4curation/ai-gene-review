- term:
    id: GO:0007173
    label: epidermal growth factor receptor signaling pathway
  evidence_type: IDA
  original_reference_id: PMID:26060020
  qualifier: involved_in
  review:
    summary: Purified LIN-3 EGF-domain ligand binds and activates the
      C. elegans EGFR ortholog LET-23.
    action: ACCEPT
    reason: Freed et al. biochemically showed that LET-23 is the C. elegans EGFR
      ortholog and that LIN-3 is its activating EGF-like ligand, supporting both
      LIN-3 receptor ligand activity and its direct role in EGFR signaling.
    supported_by:
    - reference_id: PMID:26060020
      supporting_text: |-
        Here we show that the Caenorhabditis elegans EGFR orthologue LET-23 is
        constitutively dimeric, yet responds to its ligand LIN-3 without changing
        oligomerization state.
- term:
