gene_symbol: sma-2
organism: worm
uniprot_id: Q02330
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Involved in TGF-beta pathway. Plays a role in male tail tip morphogenesis
    (PubMed:21408209).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q02330
  source_id: Q02330
- source: Alliance_Imported
  text: sma-2 encodes, along with sma-3 and sma-4, one of three C. elegans Smad proteins,
    with SMA-2 and SMA-3 most closely related to receptor-regulated Smads (R-Smads)
    and SMA-4 more closely related to co-mediator Smads (CoSmads); during development,
    SMA-2 functions in a TGF-beta signaling pathway to regulate body size and specification
    of sensory structures in the male tail; sma-2, through this pathway, also regulates
    reproductive aging; studies show that reduction of TGF-beta pathway genes extends
    reproductive span by maintaining oocyte and germline quality; a sma-2::gfp reporter
    is expressed in the pharynx, intestine, and hypodermis; SMA-2 protein interacts
    with DAF-16.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00004856;class=Gene
  source_id: WB:WBGene00004856
- source: Alliance_Automated
  text: Predicted to enable DNA-binding transcription factor activity, RNA polymerase
    II-specific; I-SMAD binding activity; and RNA polymerase II cis-regulatory region
    sequence-specific DNA binding activity. Involved in several processes, including
    male anatomical structure morphogenesis; nematode pharynx development; and positive
    regulation of nematode male tail tip morphogenesis. Predicted to be located in
    cytoplasm and nucleus. Predicted to be part of heteromeric SMAD protein complex.
    Is expressed in head; pharynx; reproductive system; and seam cell. Human ortholog(s)
    of this gene implicated in several diseases, including Loeys-Dietz syndrome (multiple);
    Lynch syndrome; female reproductive organ cancer (multiple); pancreatic cancer;
    and primary pulmonary hypertension. Orthologous to several human genes including
    SMAD9 (SMAD family member 9).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00004856;class=Gene
  source_id: WB:WBGene00004856
