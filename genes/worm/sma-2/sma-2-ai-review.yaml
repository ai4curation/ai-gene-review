  review:
    summary: 'IBA: I-SMAD binding, transferred from vertebrate Smads that bind SMAD6/SMAD7.'
    action: MARK_AS_OVER_ANNOTATED
    reason: The C. elegans members of PANTHER PTHR13703 are sma-2, sma-3, sma-4, daf-3, daf-8
      and daf-14. None falls in the inhibitory-Smad subfamilies (SMAD6 PTHR13703:SF28, SMAD7
      PTHR13703:SF44), and no I-Smad partner has been characterized in this pathway. The binding
      capacity may be ancestral, but in C. elegans it has no known partner, so the term overstates
      what is known for this gene.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - LINEAGE_OR_TAXON_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN000344419
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Smad family node seeded by vertebrate R-Smad/I-Smad interaction data (e.g.
          SMAD6/SMAD7 partners). In C. elegans, no PTHR13703 member falls in the I-Smad subfamilies,
          so the binding partner is not known in this lineage.
