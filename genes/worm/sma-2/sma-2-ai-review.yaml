- description: Receptor-regulated Smad transcription factor of the DBL-1/BMP-like Sma/Mab
    pathway. With SMA-3 and the co-Smad SMA-4, it transduces the signal from the DAF-4/SMA-6
    receptors to regulate target genes (for example, repressing lon-1). This promotes postembryonic
    body growth and male tail patterning.
