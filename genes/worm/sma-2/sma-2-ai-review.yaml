id: Q02330
gene_symbol: sma-2
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: SMA-2 is one of two receptor-regulated Smads (R-Smads, with SMA-3) in the C.
  elegans DBL-1/BMP-like Sma/Mab pathway. It is a dwarfin/MAD-family protein with an N-terminal
  MH1 DNA-binding domain and a C-terminal MH2 domain. Downstream of the DAF-4 type II and
  SMA-6 type I receptors, SMA-2 is thought to act with SMA-3 and the co-Smad SMA-4 as a heteromeric
  transcription factor. This complex controls postembryonic growth, so loss of sma-2 gives
  small animals with smaller cells but normal cell numbers. It also controls patterning of
  the male tail sensory rays and spicules, and it represses targets such as the CRISP-family
  gene lon-1. SMA-2 acts in the same cells as the receptor DAF-4. It modestly enhances SMA-3
  function in male tail tip retraction, binds DAF-16/FOXO, and is needed for BMP-dependent
  M lineage fate in sma-9 mutants.
