gene_symbol: cgh-1
organism: worm
uniprot_id: Q95YF3
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Probable RNA helicase required for oocyte and sperm function. Also required
    to prevent the physiological germline apoptosis mechanism killing essentially
    all developing oocytes.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q95YF3
  source_id: Q95YF3
- source: Alliance_Imported
  text: cgh-1 encodes a putative DEAD-box RNA helicase, orthologous tobudding yeast
    Dhh1p, fission yeast Ste13p, Drosophila ME31B, andhuman DDX6 (OMIM:600326); CGH-1
    inhibits physiological apoptosis inoocytes, keeping it down to a normal level
    of ~50% in hermaphroditegonads; independently of apoptosis, CGH-1 is also required
    for spermfunction, oocyte fertilization, and early embryonic cytokinesis; byorthology
    with budding yeast, CGH-1 is expected to enabledecapping-dependent mRNA degradation;
    CGH-1 is expressed in meioticgerm cells, oocytes, sperm, early embryonic P granules,
    otherunidentified cytoplasmic foci of the gonad core and early embryos,and the
    germline precursors Z2 and Z3; cgh-1(RNAi) hermaphroditeslose ~100% of their oocytes
    to physiological apoptosis; gonadal CGH-1accumulation is suppressed by either
    glh-1/4 RNAi orgld-1(q485);gld-2(q497) mutations, yet physiological apoptosis
    (whichwould normally be elevated by loss of CGH-1) is also abnormally lowin these
    genotypes; cgh-1(RNAi) males have sterile sperm withabnormally short pseudopods;
    CGH-1 associates with CAR-1, DCAP-2, andCEY-2/3/4 in P granules and cytoplasmic
    particles of the earlyembryo; CGH-1 is required for normal CAR-1 localization
    in earlyembyros, and binds CAR-1 in an RNA-dependent manner.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00000479;class=Gene
  source_id: WB:WBGene00000479
- source: Alliance_Automated
  text: Predicted to enable RNA helicase activity and mRNA binding activity. Involved
    in several processes, including P-body assembly; determination of adult lifespan;
    and negative regulation of translation. Located in P granule; P-body; and cytoplasmic
    stress granule. Part of ribonucleoprotein complex and ribonucleoprotein granule.
    Is expressed in several structures, including Z2; Z3; germ line; gonad; and neurons.
    Human ortholog(s) of this gene implicated in intellectual disability. Orthologous
    to human DDX6 (DEAD-box helicase 6).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00000479;class=Gene
  source_id: WB:WBGene00000479
