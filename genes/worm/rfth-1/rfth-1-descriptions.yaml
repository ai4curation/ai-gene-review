descriptions:
- source: UniProt
  text: Intramembrane glycolipid transporter that operates in the biosynthetic pathway
    of dolichol-linked oligosaccharides, the glycan precursors employed in protein
    asparagine (N)-glycosylation. The sequential addition of sugars to dolichol pyrophosphate
    produces dolichol-linked oligosaccharides containing fourteen sugars, including
    two GlcNAcs, nine mannoses and three glucoses. Once assembled, the oligosaccharide
    is transferred from the lipid to nascent proteins by oligosaccharyltransferases.
    The assembly of dolichol-linked oligosaccharides begins on the cytosolic side
    of the endoplasmic reticulum membrane and finishes in its lumen. RFT1 could mediate
    the translocation of the cytosolically oriented intermediate DolPP- GlcNAc2Man5,
    produced by ALG11, into the ER lumen where dolichol-linked oligosaccharides assembly
    continues (By similarity). However, the intramembrane lipid transporter activity
    could not be confirmed in vitro (By similarity).
