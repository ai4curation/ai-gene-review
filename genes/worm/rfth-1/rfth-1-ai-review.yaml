suggested_questions:
- question: Is rfth-1 essential in C. elegans, and does its loss cause M5-DLO accumulation
    and N-glycosylation defects as in yeast and human?
  experts:
  - C. elegans glycobiologists
  - WormBase curators
- question: Should the M5-DLO translocase activity be annotated as the molecular function
    of RFT1-family proteins while its in-vivo essentiality is contested?
  experts:
  - GO molecular function ontology editors
suggested_experiments:
- hypothesis: rfth-1 is required for dolichol-linked oligosaccharide assembly in C. elegans.
  description: Deplete rfth-1 by RNAi or a CRISPR deletion (with balancer if lethal)
    and measure lipid-linked oligosaccharide profiles and glycoprotein N-glycosylation,
    testing for M5-DLO accumulation; test rescue with human RFT1.
  experiment_type: genetic loss of function with glycan profiling
- hypothesis: RFTH-1 is an ER-resident polytopic membrane protein.
  description: Express a functional endogenously tagged RFTH-1 and co-localize with
    an ER marker in intestine and other tissues.
  experiment_type: fluorescent protein tagging and confocal microscopy
