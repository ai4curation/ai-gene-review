- id: PMID:11807558
  title: Translocation of lipid-linked oligosaccharides across the ER membrane requires
    Rft1 protein.
  reference_review:
    relevance: MEDIUM
    correctness: DISPUTED
    review_notes: Founding yeast genetic paper (abstract only in cache). The requirement
      of Rft1 for M5-DLO appearance in the lumen is solid; the inference that Rft1 itself
      is the flippase is contested (PMID:18668045, PMID:19494107, PMID:23720757).
  findings:
  - statement: Yeast Rft1 is required for luminal appearance of M5-DLO at the ER membrane
    supporting_text: Here we provide evidence that yeast RFT1 encodes an evolutionarily
      conserved protein required for the translocation of Man5GlcNAc2-PP-Dol from
      the cytoplasmic to the lumenal leaflet of the ER membrane.
- id: PMID:18313027
  title: Human RFT1 deficiency leads to a disorder of N-linked glycosylation.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Index RFT1-CDG paper; source of the human annotations transferred here
      by ISS. Abstract only in cache.
  findings:
  - statement: RFT1 loss stalls LLO assembly at M5-DLO in yeast and human cells
    supporting_text: RFT1 deficiency in both yeast and human cells leads to the accumulation
      of incomplete DolPP-GlcNAc(2)Man(5) and to a profound glycosylation disorder
      in humans.
- id: PMID:18668045
  title: Does Rft1 flip an N-glycan lipid precursor?
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Brief Communication Arising showing M5-DLO flipping in reconstituted
      ER vesicles without Rft1; context for the mechanistic dispute.
  findings:
  - statement: Reconstituted ER vesicles flip M5-DLO without Rft1
    supporting_text: We now show that a specific ER protein(s), but not Rft1, is required
      to flip Man(5)GlcNAc(2)-PP-Dol in reconstituted vesicles.
- id: PMID:19494107
  title: Suppression of Rft1 expression does not impair the transbilayer movement of
    Man5GlcNAc2-P-P-dolichol in sealed microsomes from yeast.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Counter-evidence to a catalytic flippase role in vivo.
  findings:
  - statement: Rft1-depleted sealed microsomes retain M5-DLO flippase activity
    supporting_text: no difference was seen in the level of M5-DLO flippase activity
      in sealed wild type and Rft1-depleted microsomal vesicles
- id: PMID:23720757
  title: Glycoprotein biosynthesis in a eukaryote lacking the membrane protein Rft1.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Rft1-null Trypanosoma brucei is viable and N-glycosylates; origin of
      the chaperone model.
  findings:
  - statement: Rft1-null trypanosomes grow nearly normally
    supporting_text: We report that TbRft1-null procyclic trypanosomes grow nearly
      normally.
- id: PMID:38886340
  title: Rft1 catalyzes lipid-linked oligosaccharide translocation across the ER membrane.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached. Purified yeast, human and archaeal family members
      translocate M5-DLO in proteoliposomes without ATP; the basis for the family-level
      transport activity transferred to RFTH-1.
  findings:
  - statement: Purified human RFT1 translocates M5-DLO in proteoliposomes
    supporting_text: As with ScRft1, proteoliposomes reconstituted with HsRft1 showed
      almost 90% conversion of M5GN2 to M3GN2 after 2 h of incubation.
  - statement: Translocation is ATP-independent and requires Rft1 or archaeal Agl23
    supporting_text: Translocation was ATP-independent, occurred with similar kinetics
      for both dolichol or phytanol lipid carriers, and importantly, was dependent
      on addition of purified Rft1 or archaeal Agl23
- id: PMID:39025454
  title: Molecular characterization of Rft1, an ER membrane protein associated with
    congenital disorder of glycosylation RFT1-CDG.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text cached; direct localization and topology of human RFT1.
  findings:
  - statement: Human Rft1 is a multispanning ER membrane protein with cytosolic termini
    supporting_text: We show that it is a multispanning membrane protein located in
      the ER, with its N and C termini facing the cytoplasm.
- id: PMID:42417535
  title: Mechanism-guided mutagenesis of Rft1 to test its role as a dolichol-linked
    oligosaccharide scramblase in cells.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract only in cache. A portal-blocking yeast mutant predicted to
      lack scramblase activity supports growth, separating the in-vitro activity from
      the essential in-vivo role.
  findings:
  - statement: M5-DLO binding, not scrambling, appears essential in yeast
    supporting_text: These data suggest that while M5-DLO binding is important for
      Rft1's essential function, scrambling activity is dispensable.
- id: PMID:23483992
  title: Identification and functional characterization of the Caenorhabditis elegans
    riboflavin transporters rft-1 and rft-2.
  reference_review:
    relevance: NONE
    correctness: MISCITED
    review_notes: Full text read. This paper characterizes rft-1 (Y47D7A.16) and rft-2
      (Y47D7A.14), riboflavin transporters orthologous to human SLC52A, not rfth-1
      (ZK180.3). It never mentions ZK180.3 or the RFT1 family and provides no evidence
      about this gene. Listed only to document the rft-1/rfth-1 name collision; it was
      flagged as a key paper for this gene by mistake.
  findings:
  - statement: rft-1 and rft-2 are distinct C. elegans genes (Y47D7A.16, Y47D7A.14)
      encoding riboflavin transporters
    supporting_text: we assign them the names rft-1 (for Y47D7A.16) and rft-2 (for
      Y47D7A.14)
