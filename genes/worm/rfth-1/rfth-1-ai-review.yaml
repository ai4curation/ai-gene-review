id: Q23444
gene_symbol: rfth-1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: >-
  rfth-1 (ZK180.3) encodes the single Caenorhabditis elegans member of the RFT1 family
  (Pfam PF04506), a polytopic endoplasmic reticulum membrane protein of the MOP
  transporter superfamily that acts at the Man(5)GlcNAc(2)-PP-dolichol (M5-DLO) step of
  dolichol-linked oligosaccharide assembly, the pathway that builds the
  Glc3Man9GlcNAc2 precursor for protein N-glycosylation. The worm protein (522 aa,
  three splice isoforms) shares roughly 31% identity with human RFT1 and 25% with yeast
  Rft1 and has not been studied experimentally; its function is inferred from orthologs.
  In yeast and human, loss of RFT1 stalls oligosaccharide assembly at the cytosolically
  oriented M5-DLO intermediate, and purified yeast, human and archaeal RFT1-family
  proteins move M5-DLO across liposome bilayers without ATP. Whether this transbilayer
  movement, or M5-DLO binding and routing (a chaperone role), is the essential cellular
  function remains disputed. rfth-1 is distinct from the similarly named rft-1 and
  rft-2, which encode riboflavin transporters.
