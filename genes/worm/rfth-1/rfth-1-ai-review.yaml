- term:
    id: GO:0034203
    label: glycolipid translocation
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000319164
  - SGD:S000000116
  - UniProtKB:Q96AA3
  review:
    summary: PAINT propagation of glycolipid translocation from the eukaryote-root node
      PTN000319164, seeded by yeast Rft1 and human RFT1.
    action: ACCEPT
    reason: Purified yeast and human Rft1 and archaeal Agl23 all translocate M5-DLO in
      reconstituted liposomes, so the capacity is deeply conserved and the node placement
      is sound. The process term does not specify energy coupling or whether this is
      the essential in-vivo role, which remains disputed, so it is the safe level at
      which to state the family activity for the worm protein.
    supported_by:
    - reference_id: PMID:38886340
      supporting_text: Translocation was ATP-independent, occurred with similar kinetics
        for both dolichol or phytanol lipid carriers, and importantly, was dependent
        on addition of purified Rft1 or archaeal Agl23
