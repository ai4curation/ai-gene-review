  review:
    summary: PAINT propagation of ER membrane from node PTN000319164, placed at the
      eukaryote root (taxon:2759) and seeded by yeast Rft1, human RFT1 and Trypanosoma
      brucei Rft1. RFTH-1 is the worm member of the same family (PTHR13117:SF5) and is
      a predicted multi-pass membrane protein.
    action: ACCEPT
    reason: ER membrane is a sub-compartment term, not a root organelle term. The node
      placement at the eukaryote root is well grounded, because ER residence has direct
      evidence in yeast and human, including human topology mapping, and the predicted
      polytopic architecture of RFTH-1 is consistent. There is no worm-specific evidence
      of divergence.
