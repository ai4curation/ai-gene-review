- id: PMID:31409866
  title: Nuclear and cytoplasmic WDR-23 isoforms mediate differential effects on GEN-1 and SKN-1 substrates.
  findings:
  - statement: Primary worm isoform experiments show that compartment and regulatory outcome cannot be
      assigned independently of the N terminus.
    supporting_text: 'These opposing roles are mediated by two distinct isoforms: WDR-23A

      in the cytoplasm and WDR-23B in the nucleus.'
  - statement: The primary study identifies GEN-1 as a WDR-23 substrate; its DNA repair role does not
      make WDR-23 a nuclease.
    supporting_text: 'we identify

      GEN-1, a Holliday junction resolvase, as an evolutionarily conserved WDR-23

      substrate'
  - statement: The tested alternative N termini permit GEN-1 interaction, supporting a shared substrate-binding
      mechanism without establishing localization of the shorter target.
    supporting_text: the N-terminal domain of WDR-23B that mediates nuclear localization does not interfere
      with binding of GEN-1 in vitro.
  full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary report checked against the cached abstract/full text; the evidence scope is
      stated in the finding.
