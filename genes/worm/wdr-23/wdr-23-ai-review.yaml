    abundance and activity of SKN-1 in Caenorhabditis elegans.
  findings:
  - statement: The primary worm study establishes association of WDR-23 with CUL-4/DDB-1 and regulation
      of SKN-1 abundance and activity.
    supporting_text: "WDR-23, which interacts with the \nCUL-4/DDB-1 ubiquitin ligase"
  full_text_unavailable: true
