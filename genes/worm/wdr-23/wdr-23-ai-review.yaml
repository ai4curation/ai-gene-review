id: S6FN32
gene_symbol: wdr-23
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: >-
  Caenorhabditis elegans wdr-23 (D2030.9) encodes a WD40-repeat DDB1- and CUL4-associated factor, the
  nematode ortholog of human DCAF11/WDR23 (PANTHER PTHR19847:SF7). WDR-23 is a non-catalytic substrate
  receptor of a CUL-4/DDB-1 cullin-RING ubiquitin ligase. It binds the cytoprotective transcription
  factor SKN-1 and restrains its abundance, nuclear accumulation and activity, so that loss of wdr-23
  constitutively induces SKN-1-dependent detoxification and oxidative-stress genes; it also binds the
  Holliday junction resolvase GEN-1. The gene produces a cytoplasmic WDR-23A isoform (associated with
  mitochondria and presynaptic organelles in neurons) and a nuclear WDR-23B isoform that differ only
  in their N termini; nuclear WDR-23B provides the main negative, turnover-promoting control of SKN-1
  and GEN-1, whereas WDR-23A has a proteasome-independent role. This entry, S6FN32, is the 498-residue
  D2030.9d gene model, which starts at an internal methionine (Met74 of WDR-23A) and lacks both
  isoform-specific N termini but retains all WD repeats and the WDxR DDB1-binding motifs; its
  expression and localization have not been examined directly.
references:
- id: PMID:19273594
  title: The WD40 repeat protein WDR-23 functions with the CUL4/DDB1 ubiquitin ligase to regulate nuclear
    abundance and activity of SKN-1 in Caenorhabditis elegans.
  findings:
  - statement: The primary worm study establishes association of WDR-23 with CUL-4/DDB-1 and regulation
      of SKN-1 abundance and activity.
    supporting_text: "WDR-23, which interacts with the \nCUL-4/DDB-1 ubiquitin ligase"
  - statement: WDR-23 represses SKN-1 protein level, nuclear accumulation and activity, presumably
      by targeting it for proteasomal degradation.
    supporting_text: SKN-1 protein levels, nuclear accumulation, and activity are repressed by the WD40
      repeat protein WDR-23
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Founding report (abstract-only in cache). The WormBase IPI annotation of SKN-1 binding
      to WDR-23 (P90794) is drawn from this paper. Assays used the canonical wdr-23 products, not the
      D2030.9d model specifically.
- id: PMID:31409866
  title: Nuclear and cytoplasmic WDR-23 isoforms mediate differential effects on GEN-1 and SKN-1 substrates.
  findings:
  - statement: Primary worm isoform experiments show that compartment and regulatory outcome cannot be
      assigned independently of the N terminus.
    supporting_text: 'These opposing roles are mediated by two distinct isoforms: WDR-23A

      in the cytoplasm and WDR-23B in the nucleus.'
  - statement: The primary study identifies GEN-1 as a WDR-23 substrate; its DNA repair role does not
      make WDR-23 a nuclease.
    supporting_text: 'we identify

      GEN-1, a Holliday junction resolvase, as an evolutionarily conserved WDR-23

      substrate'
  - statement: The tested alternative N termini permit GEN-1 interaction, supporting a shared substrate-binding
      mechanism without establishing localization of the shorter target.
    supporting_text: the N-terminal domain of WDR-23B that mediates nuclear localization does not interfere
      with binding of GEN-1 in vitro.
  - statement: Nuclear WDR-23B inhibits substrates, probably via turnover, whereas cytoplasmic WDR-23A
      has a proteasome-independent role.
    supporting_text: 'nuclear WDR-23B inhibits the activity of

      substrates, most likely by promoting protein turnover, while cytoplasmic WDR-23A

      performs a proteasome-independent role.'
  - statement: The isoforms differ only at the N terminus, where WDR-23A carries predicted nuclear export
      signals; S6FN32 lacks this region.
    supporting_text: cytoplasmic WDR-23A is predicted to encode two nuclear export signals (NES) in the
      N-terminal region that are not found in nuclear WDR-23B.
  full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text read in cache. In vitro ubiquitination used the human CUL4A-DDB1-WDR23 complex
      and human GEN1; worm GEN-1 interaction shown by yeast two-hybrid and co-IP in HEK293T cells.
- id: PMID:24453991
  title: Regulation of synaptic nlg-1/neuroligin abundance by the skn-1/Nrf stress response pathway protects
    against oxidative stress.
  findings:
  - statement: In cholinergic motor neurons WDR-23a is punctate in cell bodies and axons, colocalizing
      with synaptic vesicle and mitochondrial markers, whereas WDR-23b is nuclear.
    supporting_text: a WDR-23a::GFP fusion protein was found in cell bodies and in axons where it adopted
      a punctate pattern of fluorescence (Figure 1C), whereas WDR-23b::GFP localized exclusively to nuclei
  - statement: WDR-23 controls SKN-1 abundance in neurons as in the intestine.
    supporting_text: suggesting that the primary function of WDR-23 is to negatively regulate SKN-1
  full_text_unavailable: false
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text in cache. Isoform-tagged localization in neurons; shows that localization
      is isoform-specific and so cannot be transferred to the N-terminally shortened S6FN32 model.
