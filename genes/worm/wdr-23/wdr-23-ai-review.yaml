existing_annotations: []
core_functions:
- description: >-
    Substrate receptor of the CUL-4/DDB-1 cullin-RING ubiquitin ligase: the WD40 propeller binds
    substrates (SKN-1, GEN-1) and WDxR motifs dock on DDB-1, so that substrates are presented for
    ubiquitination; nuclear action promotes substrate turnover. Asserted at gene level from the
    assayed WDR-23A/B products; S6FN32 retains the WD40 propeller and WDxR motifs but has not been
    assayed itself, and its compartment (and hence substrate outcome) is unresolved.
  molecular_function:
    id: GO:1990756
    label: ubiquitin-like ligase-substrate adaptor activity
  in_complex:
    id: GO:0080008
    label: Cul4-RING E3 ubiquitin ligase complex
  directly_involved_in:
  - id: GO:0043161
    label: proteasome-mediated ubiquitin-dependent protein catabolic process
