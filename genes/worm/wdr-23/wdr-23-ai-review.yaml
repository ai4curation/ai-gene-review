suggested_questions:
- question: Is the D2030.9d transcript, which starts at the first shared methionine, expressed in vivo, and
    where does its product localise without the nuclear-targeting N terminus of WDR-23B or the predicted
    NES of WDR-23A?
- question: Does the D2030.9d product promote SKN-1 turnover (like WDR-23B) or a proteasome-independent
    outcome (like WDR-23A) on GEN-1 and SKN-1?
suggested_experiments:
- description: Express a D2030.9d-specific (Met74-start) GFP fusion in a wdr-23(tm1817) null background,
    image its nuclear, cytoplasmic and mitochondrial distribution, and quantify gst-4 reporter repression
    and SKN-1 protein levels side by side with the WDR-23A and WDR-23B constructs.
  experiment_type: transgenic rescue with subcellular imaging
