id: S6FN32
gene_symbol: wdr-23
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: >-
  WDR-23 (also called XREP-1; ORF D2030.9) is the Caenorhabditis elegans member of the
  DCAF11/WDR23 family of WD40-repeat substrate receptors for CUL-4/DDB-1 (CRL4) cullin-RING
  E3 ubiquitin ligases. Its seven-bladed WD40 propeller carries two DxR boxes needed for DDB-1
  engagement and recognises substrate proteins, chiefly the Nrf-family transcription factor
  SKN-1, which it restrains under basal conditions by limiting SKN-1 abundance, nuclear
  accumulation and transcriptional output, presumably through ubiquitin-dependent proteasomal
  degradation. Loss of WDR-23 constitutively induces SKN-1-dependent phase II detoxification
  and antioxidant genes such as gst-4. The Holliday junction resolvase GEN-1 is a second
  substrate. The gene makes alternative N-terminal isoforms with different compartments:
  WDR-23A is cytoplasmic and associated with the mitochondrial outer membrane, and WDR-23B is
  nuclear and is the main repressor of SKN-1. S6FN32 (WormBase D2030.9d) is a 498-residue
  product that starts at Met74 of WDR-23A. It lacks the N-terminal sequences specific to
  either isoform but keeps the whole shared WD40 core, including both DxR boxes. An
  equivalent cDNA lacking the isoform-specific exons fully rescues the wdr-23 (xrep-1)
  derepression phenotype.
references:
- id: PMID:19273594
  title: The WD40 repeat protein WDR-23 functions with the CUL4/DDB1 ubiquitin ligase to regulate nuclear
    abundance and activity of SKN-1 in Caenorhabditis elegans.
  findings:
  - statement: WDR-23 interacts with CUL-4/DDB-1 and represses SKN-1 protein levels, nuclear accumulation
      and activity, presumably by targeting SKN-1 for proteasomal degradation.
    supporting_text: SKN-1 protein levels, nuclear accumulation, and activity are repressed by the WD40
      repeat protein WDR-23, which interacts with the CUL-4/DDB-1 ubiquitin ligase to presumably target
      the transcription factor for proteasomal degradation.
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Foundational primary study; cached abstract only. Experiments used the canonical wdr-23
      products, not specifically D2030.9d.
- id: PMID:20585349
  title: Genetic and cellular characterization of Caenorhabditis elegans mutants abnormal in the regulation
    of many phase II enzymes.
  findings:
  - statement: Positional cloning identifies xrep-1 as D2030.9 (wdr-23); mutations in the WD-repeat domain
      derepress phase II genes.
    supporting_text: D2030.9 encodes WDR-23, a nematode homologue of WDR23
  - statement: A WDR-23A cDNA lacking exons 1 to 3 (which encode the isoform-specific N termini), and
      therefore translated from the first shared methionine like S6FN32, fully rescues the xrep-1 mutant
      phenotype.
    supporting_text: the latter was an xrep-1a cDNA::gfp fusion gene without exons 1 through 3
  - statement: The N-terminally shortened construct rescues GST-4 repression.
    supporting_text: Also the xrep-1aProm acDNAEx4-11::gfp fusion gene completely rescued the xrep-1(k1007)
      phenotype
  full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached. The exon 4-11 construct is the closest experimental proxy for the
      S6FN32 product. Its subcellular localisation was not reported separately.
- id: PMID:23555279
  title: The conserved SKN-1/Nrf2 stress response pathway regulates synaptic function in Caenorhabditis
    elegans.
  findings:
  - statement: WDR-23 has two conserved DDB1-binding DxR boxes in WD repeats four and five; a DxR mutant
      (R342H, R389H) is expressed and localised normally but cannot rescue, so DDB-1/CUL-4 engagement
      is required for function.
    supporting_text: This suggests that the interaction between WDR-23 and DDB-1/CUL-4 is essential for
      regulating neuromuscular function.
  - statement: The two isoforms localise differently, to mitochondrial outer membranes and to nuclei.
    supporting_text: WDR-23 isoforms differentially localize to the
      outer membranes of mitochondria and to nuclei
  full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached. The DxR residues map to R269 and R316 of S6FN32 (see bioinformatics
      RESULTS.md).
- id: PMID:31409866
  title: Nuclear and cytoplasmic WDR-23 isoforms mediate differential effects on GEN-1 and SKN-1 substrates.
  findings:
  - statement: WDR-23A is cytoplasmic and WDR-23B nuclear, with opposing effects on substrates.
    supporting_text: 'These opposing roles are mediated by two distinct isoforms: WDR-23A

      in the cytoplasm and WDR-23B in the nucleus.'
  - statement: GEN-1 is a conserved WDR-23 substrate.
    supporting_text: 'we identify

      GEN-1, a Holliday junction resolvase, as an evolutionarily conserved WDR-23

      substrate'
  - statement: The isoforms differ only in their N-terminal region; the predicted NES lies in the WDR-23A-specific
      N terminus, which S6FN32 lacks.
    supporting_text: The isoforms of WDR-23 share similar sequences that vary only in the N-terminal region.
  full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached; establishes that compartment and outcome depend on the N terminus.
- id: file:worm/wdr-23/wdr-23-bioinformatics/RESULTS.md
  title: S6FN32 mapped onto the characterised WDR-23A and WDR-23B isoforms
  findings:
  - statement: S6FN32 is identical to WDR-23A residues 74-571 and WDR-23B residues 33-530, and retains
      all WD repeats and both DxR boxes.
    supporting_text: '| 342 | DKR | 269 | DKR | True |'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Reproducible script reading only UniProt-derived inputs (flat file, P90794 JSON, isoform
      b FASTA).
existing_annotations:
- term:
    id: GO:1990756
    label: ubiquitin-like ligase-substrate adaptor activity
  evidence_type: IMP
  original_reference_id: PMID:23555279
  review:
    summary: S6FN32 has no GOA annotations of its own; the gene's annotations are filed on P90794. This
      product contains the whole WD40 substrate-recognition propeller and both DDB-1-binding DxR boxes,
      the motifs whose mutation abolishes WDR-23 function.
    action: NEW
    reason: >-
      DCAF-family WD40 proteins act as the substrate-recognition subunit that links a substrate to
      DDB-1/CUL-4, and the specific adaptor term is preferable to the generic GO:0060090 used previously.
      The function is carried by the shared C-terminal core: the DxR boxes (R269/R316 here) are
      required, and a WDR-23A cDNA without the isoform-specific exons, matching this product, fully
      rescues wdr-23 loss. The human ortholog DCAF11 in the same PANTHER subfamily (PTHR19847:SF7)
      carries the same molecular function in its own review.
    supported_by:
    - reference_id: PMID:23555279
      supporting_text: This suggests that the interaction between WDR-23 and DDB-1/CUL-4 is essential for
        regulating neuromuscular function.
    - reference_id: PMID:19273594
      supporting_text: SKN-1 protein levels, nuclear accumulation, and activity are repressed by the WD40
        repeat protein WDR-23, which interacts with the CUL-4/DDB-1 ubiquitin ligase to presumably target
        the transcription factor for proteasomal degradation.
    - reference_id: PMID:20585349
      supporting_text: Also the xrep-1aProm acDNAEx4-11::gfp fusion gene completely rescued the xrep-1(k1007)
        phenotype
- term:
    id: GO:0080008
    label: Cul4-RING E3 ubiquitin ligase complex
  evidence_type: IPI
  original_reference_id: PMID:19273594
  review:
    summary: WDR-23 interacts physically with CUL-4/DDB-1. PAINT places part_of GO:0080008 at the
      eukaryotic node PTN000457302 of PTHR19847, seeded by human DCAF11. P90794 inherits it by IBA, but
      the non-canonical S6FN32 entry does not.
    action: NEW
    reason: >-
      S6FN32 lies within PTHR19847:SF7, below the PAINT node, and keeps the DDB-1-docking DxR boxes, so
      membership of the CRL4 complex applies to this product as much as to P90794. The missing IBA
      comes from propagation running only to the canonical entry, not from a curator excluding this
      product.
    supported_by:
    - reference_id: PMID:19273594
      supporting_text: SKN-1 protein levels, nuclear accumulation, and activity are repressed by the WD40
        repeat protein WDR-23, which interacts with the CUL-4/DDB-1 ubiquitin ligase to presumably target
        the transcription factor for proteasomal degradation.
    - reference_id: file:worm/wdr-23/wdr-23-bioinformatics/RESULTS.md
      supporting_text: '| 342 | DKR | 269 | DKR | True |'
- term:
    id: GO:0043161
    label: proteasome-mediated ubiquitin-dependent protein catabolic process
  evidence_type: IMP
  original_reference_id: PMID:19273594
  review:
    summary: P90794 carries this process by IMP (PMID:19273594) and by IBA from PTN000457302 (seeded by
      WBGene00008419 itself). As substrate receptor, WDR-23 performs the substrate-recognition step of
      CRL4-mediated ubiquitination that sends SKN-1 to the proteasome.
    action: NEW
    reason: >-
      The adaptor does part of the work of the process (it selects the substrate for ubiquitination), so
      it passes the participation test. The product retains the core that carries this activity. The
      evidence for proteasomal degradation of SKN-1 is described as presumptive in the abstract, and
      nuclear WDR-23B is the isoform most linked to turnover. The process is therefore assigned at gene
      level, and which compartment this shorter product acts in is left open.
    supported_by:
    - reference_id: PMID:19273594
      supporting_text: SKN-1 protein levels, nuclear accumulation, and activity are repressed by the WD40
        repeat protein WDR-23, which interacts with the CUL-4/DDB-1 ubiquitin ligase to presumably target
        the transcription factor for proteasomal degradation.
    - reference_id: PMID:20585349
      supporting_text: Also the xrep-1aProm acDNAEx4-11::gfp fusion gene completely rescued the xrep-1(k1007)
        phenotype
core_functions:
- description: >-
    Substrate receptor of the CUL-4/DDB-1 (CRL4) E3 ubiquitin ligase. The WD40 propeller docks on
    DDB-1 through its DxR boxes and recruits substrates, chiefly SKN-1 and also GEN-1, for
    ubiquitination, limiting basal SKN-1 activity. This core is fully present in S6FN32. Which
    compartment this shorter product acts in (nuclear or cytoplasmic) is not determined.
