- id: file:worm/wdr-23/wdr-23-bioinformatics/RESULTS-rereview.md
  title: 'wdr-23 re-review: S6FN32 versus the reviewed WDR-23A/B isoforms'
  findings:
  - statement: S6FN32 starts at Met74 of WDR-23A (residue 33 of WDR-23B) and lacks both isoform-specific
      N termini plus a shared 19-residue segment.
    supporting_text: S6FN32 is therefore an N-terminally shortened alternative gene model of wdr-23 that
      begins at an internal methionine (Met74 of WDR-23A).
  - statement: Four (W/Y)DxR DDB1-binding-box motifs are retained.
    supporting_text: Four (W/Y)DxR motifs, the DDB1-binding "DxR box" signature of DCAF
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Reproducible stdlib script (compare_isoforms_rereview.py) reading only the UniProt
