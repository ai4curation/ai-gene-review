suggested_questions:
- question: Is the D2030.9d (S6FN32) transcript translated from the internal Met74 start in vivo, and
    if so where does the product localize, given that it lacks both the WDR-23A NES-bearing and the
    basic WDR-23B N termini?
- question: Does the N-terminally shortened product bind DDB-1 and SKN-1/GEN-1 and promote their
    turnover like WDR-23B, act like WDR-23A, or neither?
suggested_experiments:
- description: Express GFP-tagged D2030.9d cDNA from the endogenous wdr-23 promoter in wdr-23(tm1817)
    null animals and score localization, gst-4p::gfp repression and brood-size rescue in parallel with
    WDR-23A-only and WDR-23B-only strains.
