id: S6FN32
gene_symbol: wdr-23
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: Caenorhabditis elegans WDR-23 is a WD-repeat substrate receptor associated with the CUL-4/DDB-1
  ubiquitin ligase system. Characterized isoforms regulate SKN-1 stress-response activity and the GEN-1
  DNA-repair protein, with different outcomes in nuclear and cytoplasmic compartments. The selected 498-residue
  product retains the shared WD-repeat region but lacks the distinct N termini of the experimentally characterized
  isoforms; its substrate-receptor role is plausible, while its localization and regulatory effects remain
  unresolved.
