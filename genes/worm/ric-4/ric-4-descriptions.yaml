gene_symbol: ric-4
organism: worm
uniprot_id: A5PEW5
taxon_id: NCBITaxon:6239
descriptions:
- source: Alliance_Imported
  text: ric-4 encodes an ortholog of vertebrate SNAP-25 and S. cerevisiae Sec9p; SNAP-25
    is associated with synaptosomes, required for axonal growth in vivo, and targeted
    by botulinum neurotoxins; UNC-86 and MEC-3 are required for ric-4 expression,
    and act on a regulatory element (I2h) in ric-4 conserved between the first introns
    of C. elegans and C. briggsae ric-4 genes; other conserved motifs in the promoter
    region (P1 and P2) and first intron (I1h, I1m, I2h, and I2m) are required for
    ric-4 expression in DA and DD motor neurons (P1), DB and DA neurons (I1m and I2m),
    amphid and phasmid neurons (P2), pharyngeal neurons (I1h), and mechanosensory
    neurons (I2h); loss of ric-4 function via RNAi results in aldicarb resistance,
    indicating that ric-4 plays a role in synapse structure and function.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00004364;class=Gene
  source_id: WB:WBGene00004364
- source: Alliance_Automated
  text: Predicted to enable SNAP receptor activity and syntaxin binding activity.
    Involved in cholinergic synaptic transmission. Located in plasma membrane and
    synapse. Is expressed in several structures, including excretory gland cell; intestinal
    cell; nervous system; pharyngeal gland cell; and rectal gland cell. Human ortholog(s)
    of this gene implicated in Down syndrome and developmental and epileptic encephalopathy
    117. Orthologous to several human genes including SNAP23 (synaptosome associated
    protein 23).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00004364;class=Gene
  source_id: WB:WBGene00004364
