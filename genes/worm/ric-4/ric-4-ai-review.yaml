  label: Caenorhabditis elegans
description: >-
  RIC-4 is the Caenorhabditis elegans SNAP-25 orthologue, the Qbc-SNARE of the neuronal
  exocytic machinery. Anchored to the axonal plasma membrane through its palmitoylated central
  linker, it contributes two of the four helices of the synaptic SNARE complex, pairing with
  UNC-64/syntaxin-1 and the vesicle R-SNARE SNB-1/synaptobrevin; zippering of this bundle
  primes synaptic vesicles and, when triggered by Ca2+ through SNT-1, fuses them with the
  presynaptic active zone membrane to release acetylcholine and other transmitters. ric-4
  was identified through aldicarb resistance (resistance to inhibitors of cholinesterase),
  and loss of RIC-4 causes severe neurotransmitter-secretion defects. The protein is
  distributed diffusely along nerve cords rather than confined to release sites, is trafficked
  independently of UNC-18, and is expressed across neuronal subsets under the control of
  multiple promoter and intronic elements.
