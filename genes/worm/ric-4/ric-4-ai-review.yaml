suggested_questions:
- question: Is RIC-4 palmitoylated on its central cysteine cluster in vivo, and is this required for
    its axonal plasma-membrane distribution as for mammalian SNAP-25?
- question: Do ric-4 null alleles phenocopy the L1 arrest of unc-64 nulls, or is there residual 
    release from a paralogous Qbc-SNARE (e.g. SNAP-29/aex-4-like proteins)?
suggested_experiments:
- description: Electrophysiological recording of evoked and spontaneous release at the neuromuscular
    junction of ric-4(ox45) animals, with and without open UNC-64.
  hypothesis: RIC-4 is required for both priming and fusion, so open syntaxin will not bypass its 
    loss.
