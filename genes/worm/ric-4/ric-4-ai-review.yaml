- id: file:worm/ric-4/ric-4-deep-research-falcon.md
  title: Deep research report for ric-4 (falcon / Edison Scientific Literature)
  findings:
  - statement: RIC-4 contributes the Qb and Qc helices of the neuronal SNARE bundle with UNC-64 and 
      SNB-1; zippering supplies the energy for fusion.
    supporting_text: In the canonical worm neuronal complex, plasma-membrane **UNC-64/syntaxin** 
      contributes a Qa-SNARE helix, vesicular **SNB-1/synaptobrevin** contributes the R-SNARE helix,
      and RIC-4 contributes the Qb and Qc elements.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: LLM literature synthesis; used only for the family-level SNARE architecture, which
      the primary papers support.
