id: Q17328
gene_symbol: glc-2
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: >-
  glc-2 encodes the beta subunit of a Cys-loop glutamate-gated chloride
  channel. Recombinant GLC-2 forms homomeric plasma-membrane channels that open
  in response to extracellular glutamate, and it can coassemble with GLC-1 into
  heteromeric channels that respond to glutamate, ibotenate, and avermectin
  allosteric agonists. Reporter analyses place native glc-2 expression in
  pharyngeal, enteric, and anal-depressor muscles; enteric-muscle genetic data
  support a role with GLC-4 in inhibitory glutamatergic signaling from the DVB
  motor neuron.
