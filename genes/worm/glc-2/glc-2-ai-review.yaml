suggested_questions:
- question: >-
    Which native C. elegans GluCl complexes contain GLC-2 protein: GLC-2
    homomers, GLC-1/GLC-2 heteromers, GLC-2/GLC-4 heteromers in enteric muscle,
    or additional combinations with GLC alpha subunits?
- question: >-
    Is GLC-2 protein concentrated at inhibitory glutamatergic postsynaptic
    specializations, or is it distributed more broadly over pharyngeal and
    enteric-muscle plasma membranes?
- question: >-
    Which Brugia, Onchocerca and Haemonchus GluCl beta-like paralogs are the
    direct orthologs or functional analogs of C. elegans glc-2 in
    ivermectin-sensitive motor circuits?
suggested_experiments:
- description: >-
    Endogenously tag GLC-2 and co-image it with GLC-1, GLC-4, presynaptic
    glutamate-release markers and enteric-muscle postsynaptic markers in animals
    with normal and elevated glutamate tone.
  hypothesis: >-
    Native GLC-2 enters defined heteromeric GluCl complexes in enteric-muscle
    and pharyngeal plasma membranes, with only a subset concentrated opposite
    glutamate-releasing synapses.
