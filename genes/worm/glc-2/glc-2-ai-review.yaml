proposed_ontology_changes:
- change_type: NODE_SHALLOWING
  ontology: GO
  about_node:
    id: GO:0005234
    label: extracellularly glutamate-gated ion channel activity
  old_value: GO:0005231
  new_value: GO:0005230
  subject:
    id: GO:0005230
    label: extracellular ligand-gated monoatomic ion channel activity
  predicate: rdfs:subClassOf
  justification: >-
    GO:0005234 is currently a child of GO:0005231, which makes every
    extracellularly glutamate-gated chloride channel a kind of excitatory
    extracellular ligand-gated channel and causes the correct GO:0008068
    glutamate-gated chloride-channel term to propagate excitatory postsynaptic
    potential assertions to invertebrate anion-selective GluCls. Glutamate-gated
    channels include both cation-selective excitatory channels and
    chloride-selective inhibitory channels, so the glutamate-gated ion-channel
    parent should sit under GO:0005230 without the excitatory sign commitment;
    cation-selective glutamate receptors would then need a more specific
    excitatory glutamate-gated channel parent so AMPA/NMDA receptor inferences
    keep the excitatory-postsynaptic-potential link.
  origin: SELF_PROPOSED
  confidence: PROBABLE
