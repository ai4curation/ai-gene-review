- id: PMID:7935817
  title: Cloning of an avermectin-sensitive glutamate-gated chloride channel from
    Caenorhabditis elegans.
  findings:
  - statement: >-
      GLC-2 is one of two C. elegans cDNAs cloned by Xenopus oocyte expression as
      functional avermectin-sensitive glutamate-gated chloride-channel subunits.
    supporting_text: >-
      expression cloning of two functional complementary DNAs encoding an
      avermectin-sensitive glutamate-gated chloride channel
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Only the abstract is cached. It identifies functional cloning from C.
      elegans of two GluCl cDNAs; the Swiss-Prot record supplies the mapping of
      the beta subunit to glc-2.
- id: PMID:9407104
  title: Genetic and biochemical evidence for a novel avermectin-sensitive chloride
    channel in Caenorhabditis elegans. Isolation and characterization.
  findings:
  - statement: >-
      A GLC-1-related alpha2 subunit forms homomeric glutamate- and
      avermectin-gated chloride channels and coassembles with GLC beta into
      heteromeric channels gated by both ligands.
    supporting_text: >-
      This subunit forms homomeric channels that are gated irreversibly by
      avermectin and reversibly by glutamate. GluClalpha2 coassembles with
      GluClbeta to form heteromeric channels that are gated by both ligands.
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Abstract only in the local cache. This follow-up to the original Cully et
      al. cloning paper supports GLC beta coassembly with another C. elegans
      GluCl alpha subunit.
- id: PMID:9192499
  title: Reporter gene constructs suggest that the Caenorhabditis elegans
    avermectin receptor beta-subunit is expressed solely in the pharynx.
  findings:
  - statement: >-
      A translational glc-2/GluCl beta reporter was active in the pharyngeal
      metacorpus of adults and larvae, with additional pharyngeal terminal-bulb
      nuclei observed in larvae.
    supporting_text: >-
      Stained nuclei were observed in the pharyngeal metacorpus in adults and
      in all larval stages, and stained nuclei were seen in many embryos
      undergoing morphogenesis.
    full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Abstract only in the local cache. The early 1.4 kb promoter reporter
      traces WormBase's pm4/pharyngeal-expression statement, but later reporter
      data also place glc-2 in enteric and anal-depressor muscles.
- id: PMID:37811674
  title: UBR-1 ubiquitin ligase regulates the balance between GABAergic and
    glutamatergic signaling.
  findings:
  - statement: >-
      glc-2 and glc-4 are expressed in enteric and anal-depressor muscles; loss
      of either receptor subunit suppresses the reduced expulsion and enteric
      muscle calcium activity of ubr-1 mutants.
    supporting_text: >-
      glutamate-gated chloride channels GLC-3 and GLC-2/4 receive DVB's
      glutamate signals to inhibit DVB and enteric muscle activity, respectively
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Full text cached. This paper supports a native inhibitory role for GLC-2
      and GLC-4 in DVB-to-enteric-muscle signaling, but the glc-2 phenotype is
      conditional in an ubr-1 glutamate-homeostasis mutant and therefore should
      not be promoted to a broad defecation-process annotation.
- id: file:worm/glc-2/glc-2-deep-research-wormbase.md
  title: WormBase gene description for glc-2
  findings:
  - statement: >-
      WormBase summarizes glc-2 as encoding a GluCl beta subunit that can form
      glutamate-gated homomers and heteromeric channels with GLC-1, and it notes
      that glc-2 expression had been reported in pm4 pharyngeal muscles.
    supporting_text: >-
      glc-2 encodes the beta subunit of a glutamate-gated chloride channel
  reference_review:
    relevance: HIGH
    correctness: LOW_QUALITY
    review_notes: >-
      The oocyte-expression and channel-activity statements match Cully et al.,
      Vassilatis et al., and UniProt, and the pm4 expression statement traces to
      Laughton et al.'s 1.4 kb promoter/LacZ reporter. The MOD text is now
      incomplete because Li et al. 2023 report glc-2 reporter expression in
      enteric and anal-depressor muscles.
    source_defects:
    - defect_type: OUTDATED_STATEMENT
      resource: WORMBASE
      record: WB:WBGene00001592
      slot: MOD_provided_gene_description
      requested_change: CHECK
      asserted_value: >-
        GLC-2 expression is generally restricted to the pm4 pharyngeal muscles
        of larvae and adults
      corrected_value: >-
        glc-2 expression has been reported in pm4 pharyngeal muscles and, more
        recently, in enteric and anal-depressor muscles
      confidence: PROBABLE
      explanation: >-
        The WormBase glc-2 description still reflects the early
        promoter-reporter result that placed GluCl beta in the pharynx.
        Subsequent reporter and genetic work found strong glc-2 reporter
        expression in the enteric and anal-depressor muscles and showed that
        glc-2 loss suppresses the ubr-1 enteric-muscle calcium phenotype,
        supporting an enteric-muscle GluCl role outside the pharynx.
      supported_by:
      - reference_id: PMID:37811674
        supporting_text: >-
          glutamate-gated chloride channels GLC-3 and GLC-2/4 receive DVB's
          glutamate signals to inhibit DVB and enteric muscle activity,
          respectively
