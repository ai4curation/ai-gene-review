    c', which is found in fungi butnot in animals; conversely, orthologs of Ac45 are
    only found in animals;VHA-19 is predicted to help carry protons from the cytosol
    toa-subunits (VHA-5, VHA-6, VHA-7, or UNC-32) for transmembrane export.
