descriptions:
- source: UniProt
  text: Accessory subunit of the proton-transporting vacuolar (V)- ATPase protein
    pump, which is required for luminal acidification of secretory vesicles (By similarity).
    In the germline, required for the trafficking of the receptor RME-2 to the oocyte
    cell membrane where it regulates the uptake of yolk proteins (PubMed:22768351).
    Also, plays an essential role in osmoregulation in the embryo, probably by regulating
    the proper formation of the eggshell (PubMed:22768351).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q9TYW1
