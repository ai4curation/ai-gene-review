descriptions:
- source: UniProt
  text: Accessory subunit of the proton-transporting vacuolar (V)- ATPase protein
    pump, which is required for luminal acidification of secretory vesicles (By similarity).
    In the germline, required for the trafficking of the receptor RME-2 to the oocyte
    cell membrane where it regulates the uptake of yolk proteins (PubMed:22768351).
    Also, plays an essential role in osmoregulation in the embryo, probably by regulating
    the proper formation of the eggshell (PubMed:22768351).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q9TYW1
  source_id: Q9TYW1
- source: Alliance_Imported
  text: vha-19 encodes an ortholog of subunit Ac45 of the membrane-bound (V0)domain
    of vacuolar proton-translocating ATPase (V-ATPase); VHA-19 isa predicted V-ATPase
    transmembrane rotor component; Ac45 is anonhomologous replacement for subunit
    c', which is found in fungi butnot in animals; conversely, orthologs of Ac45 are
    only found in animals;VHA-19 is predicted to help carry protons from the cytosol
    toa-subunits (VHA-5, VHA-6, VHA-7, or UNC-32) for transmembrane export.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00021952;class=Gene
  source_id: WB:WBGene00021952
- source: Alliance_Automated
  text: Involved in intracellular water homeostasis; positive regulation of oocyte
    development; and positive regulation of protein targeting to membrane. Located
    in membrane raft. Is expressed in excretory cell; hypodermis; intestine; pharynx;
    and vulva. Human ortholog(s) of this gene implicated in immunodeficiency 47. Orthologous
    to several human genes including ATP6AP1 (ATPase H+ transporting accessory protein
    1).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00021952;class=Gene
  source_id: WB:WBGene00021952
