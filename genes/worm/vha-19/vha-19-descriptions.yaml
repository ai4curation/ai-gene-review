- source: Alliance_Automated
  text: Involved in intracellular water homeostasis; positive regulation of oocyte
    development; and positive regulation of protein targeting to membrane. Located
    in membrane raft. Is expressed in excretory cell; hypodermis; intestine; pharynx;
    and vulva. Human ortholog(s) of this gene implicated in immunodeficiency 47. Orthologous
    to several human genes including ATP6AP1 (ATPase H+ transporting accessory protein
    1).
