suggested_questions:
- question: Does VHA-19 physically associate with the C. elegans V0 sector (e.g. VHA-1/VHA-2/VHA-3
    c-ring subunits or VHA-6 a-subunit), given its low sequence identity (<30%) to mammalian
    Ac45?
- question: Is VHA-19 proteolytically processed (predicted furin site at 159/160) like
    mammalian Ac45, and is processing required for function?
- question: Are the eggshell and RME-2 trafficking defects caused by loss of Golgi/secretory
    lumenal acidification and consequent N-glycosylation defects, as in human ATP6AP1-CDG?
suggested_experiments:
- description: Co-immunoprecipitation or affinity purification of endogenously tagged
    VHA-19 to test association with V0 subunits, and measurement of V0 subunit levels
    in vha-19(RNAi) animals to test an assembly role.
  experiment_type: biochemical interaction and assembly assay
- description: Endogenous CRISPR knock-in tag of VHA-19 to determine its subcellular
    localization (ER, Golgi, secretory vesicles, endolysosomes) in oocytes and excretory
    cell.
  experiment_type: localization
- description: Measure Golgi/secretory compartment pH and N-glycan profiles in vha-19(RNAi)
    oocytes to test whether the trafficking defect reflects impaired V-ATPase acidification.
  experiment_type: pH and glycomics assay
