taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: vha-19 (Y55H10A.1) encodes the C. elegans member of the vacuolar ATPase
  subunit S1 (Ac45/ATP6AP1) family, a type I membrane glycoprotein with a signal peptide,
  a large N-glycosylated lumenal domain, a single C-terminal transmembrane helix and
  a short cytoplasmic tail. By homology with mammalian Ac45 it is an accessory subunit
  of the membrane V0 sector of the proton-pumping V-ATPase that supports pump assembly
  and acidification of secretory and endolysosomal compartments, although its association
  with the worm V-ATPase has not been tested directly. vha-19 is essential; deletion
  mutants are inviable and RNAi causes larval arrest. In the germline it is required
  maternally in oocytes, where its depletion blocks secretory trafficking of the yolk
  receptor RME-2 to the oocyte plasma membrane (and hence vitellogenin uptake), reduces
  oocyte production and causes endomitotic oocytes; embryos from depleted mothers have
  fragile, osmotically sensitive eggshells and fail cytokinesis. It is also expressed
  in the excretory cell, intestine, hypodermis and pharynx of larvae and adults.
existing_annotations:
- term:
    id: GO:0009992
    label: intracellular water homeostasis
  evidence_type: IMP
  original_reference_id: PMID:22768351
  qualifier: involved_in
  review:
    summary: vha-19(RNAi) embryos shrink in hypertonic and swell in hypotonic media and
      tend to swell to fill the eggshell, a genuine osmoregulation phenotype in the
      embryo.
    action: KEEP_AS_NON_CORE
    reason: The IMP is correctly derived from a direct osmotic assay in the full text.
      However the authors attribute the defect to a compromised eggshell (a maternal
      secretory/trafficking product) rather than to VHA-19 acting in cellular water
      handling, so this is a downstream, pleiotropic consequence of the V-ATPase accessory
      subunit's role in secretory-pathway function. Retained as non-core.
    supported_by:
    - reference_id: PMID:22768351
      supporting_text: vha-19(RNAi) embryos were osmotically sensitive in hypertonic
        and hypotonic media
    - reference_id: PMID:22768351
      supporting_text: which suggests that vha-19(RNAi) embryos have a defect in osmoregulation
        more generally
- term:
    id: GO:0016020
    label: membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  review:
    summary: VHA-19 is a single-pass type I membrane protein (signal peptide, lumenal
      domain, one TM helix, short cytoplasmic tail).
    action: ACCEPT
    reason: Membrane localization is certain from the topology. A more specific organelle
      membrane has not been determined for the worm protein (the authors' antibody was
      non-specific and no tagged-protein localization exists); the mammalian ortholog
      resides in ER/ERGIC and endolysosomal membranes, but this cannot be transferred
      with confidence to this divergent ortholog, so membrane is as precise as the
      worm evidence allows.
    supported_by:
