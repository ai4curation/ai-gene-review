  review:
    summary: VHA-19 is the nematode Ac45/ATP6AP1 family member (PTHR12471:SF7, IPR008388);
      the PAINT node is seeded by human ATP6AP1, mouse Atp6ap1 and Drosophila orthologs.
    action: ACCEPT
    reason: The IBA places V-ATPase complex membership at the ancestral node of the
      S1/Ac45 subfamily, which VHA-19 is inside (InterPro Ac45 accessory subunit and
      Ac45-VOA1 TM domains). The human seed is structurally resolved as a V0-associated
      assembly hub. No worm-specific evidence of divergence exists; the shared oocyte/germline
      phenotypes with core V-ATPase subunits (milder onset) are consistent with an
      accessory subunit. Direct biochemical association in C. elegans is untested,
      which is noted as a question rather than grounds to doubt the node placement.
