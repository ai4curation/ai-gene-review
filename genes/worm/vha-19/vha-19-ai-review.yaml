  review:
    summary: As a V-ATPase accessory subunit, the S1/Ac45 family contributes to acidification
      of intracellular compartments; this IBA is seeded from the same ancestral node
      via a zebrafish ortholog.
    action: ACCEPT
    reason: Consistent with the accepted V-ATPase complex membership and with the mammalian
      ortholog's role in V-ATPase-dependent acidification. The specific compartment
      acidified by VHA-19-containing pumps (secretory vesicles, endolysosomes) has not
      been measured in C. elegans, so the broader pH-regulation term is as specific
      as the worm evidence allows.
