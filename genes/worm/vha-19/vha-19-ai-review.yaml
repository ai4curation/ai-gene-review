- term:
    id: GO:0060282
    label: positive regulation of oocyte development
  evidence_type: IMP
  original_reference_id: PMID:22768351
  qualifier: involved_in
  review:
    summary: vha-19 germline/maternal RNAi reduces oocyte production, causes endomitotic
      oocytes and blocks yolk uptake; the requirement is in the oocyte, not sperm.
    action: MARK_AS_OVER_ANNOTATED
    reason: The full text establishes that VHA-19 is required in oocytes, but the evidence
      is necessity (RNAi phenotype), and the authors explain the oocyte defects by a
      trafficking/secretion defect (RME-2 retention, failed vitellogenin uptake) shared
      with core V-ATPase subunit knockdowns. Nothing indicates a regulatory role in
      oocyte development; "positive regulation" over-interprets a pleiotropic housekeeping
      requirement. Not removed, since the oocyte requirement itself is well supported.
    supported_by:
    - reference_id: PMID:22768351
      supporting_text: Thus, VHA-19 was required in the oocytes rather than the sperm,
        indicating that expression of vha-19 in the oocytes is essential for successful
        embryogenesis.
    - reference_id: PMID:22768351
      supporting_text: In summary, we propose that VHA-19 is involved in trafficking
        of molecules in the oocytes and the embryo that are essential for osmotic homeostasis,
        and possibly, cytokinesis.
- term:
    id: GO:0090314
    label: positive regulation of protein targeting to membrane
  evidence_type: IMP
  original_reference_id: PMID:22768351
  qualifier: involved_in
  review:
    summary: In vha-19(RNAi) oocytes RME-2::GFP accumulates in perinuclear, Golgi-like
      aggregates and fails to reach the plasma membrane, and VIT-2::GFP is not endocytosed.
    action: KEEP_AS_NON_CORE
    reason: This is the most specific cellular phenotype for VHA-19, from a direct
      cargo-localization assay, and the curator's term is a reasonable capture of it.
      Mechanistically the block resembles a general secretory-pathway (Golgi) defect
      expected when V-ATPase-dependent lumenal acidification is compromised, rather
      than a dedicated targeting-regulator function, so it is kept as non-core.
    supported_by:
    - reference_id: PMID:22768351
      supporting_text: the majority of RME-2::GFP aggregated around the nucleus of vha-19(RNAi)
        oocytes and did not reach the plasma membrane
    - reference_id: PMID:22768351
      supporting_text: resembled previously reported “Golgi –like” blocks in secretion
