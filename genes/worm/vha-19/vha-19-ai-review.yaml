core_functions:
- description: Accessory, single-pass membrane subunit of the V0 sector of the proton-pumping
    V-type ATPase (Ac45/ATP6AP1 family), inferred to support pump assembly and thereby
    contribute to proton transport and acidification of secretory-pathway and endolysosomal
    compartments; in oocytes this activity is needed for secretory trafficking of the
    yolk receptor RME-2 to the plasma membrane.
