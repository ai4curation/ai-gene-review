gene_symbol: pek-1
organism: worm
uniprot_id: Q19192
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Phosphorylates the alpha subunit of eukaryotic translation- initiation factor
    2 (eIF2alpha), leading to its inactivation and thus to a rapid reduction of translational
    initiation and repression of global protein synthesis (PubMed:10677345). May phosphorylate
    eIF2alpha during hypoxia (PubMed:20733002). Proposed to have a role in alleviating
    endoplasmic reticulum stress (PubMed:10677345, PubMed:11779465, PubMed:16184190).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q19192
  source_id: Q19192
- source: Alliance_Imported
  text: pek-1 encodes a predicted transmembrane protein kinase orthologous to human
    eukaryotic translation initiation factor 2-alpha kinase 3 (EIF2AK3, OMIM:604032),
    which when mutated leads to Wolcott-Rallison syndrome; PEK-1 is strongly expressed
    in intestinal cells and is required for the unfolded protein response (UPR) that
    counteracts cellular stress induced by accumulation of unfolded proteins in the
    endoplasmic reticulum (ER); PEK-1 may function in the endoplasmic reticulum to
    phosphorylate eIF2alpha and inhibit protein synthesis in response to endogenous
    ER stress.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00003970;class=Gene
  source_id: WB:WBGene00003970
- source: Alliance_Automated
  text: Enables eukaryotic translation initiation factor 2alpha kinase activity and
    protein serine kinase activity. Involved in PERK-mediated unfolded protein response;
    nematode larval development; and regulation of cytoplasmic translational initiation.
    Predicted to be located in endoplasmic reticulum membrane. Predicted to be active
    in cytoplasm and nucleus. Is expressed in intestine; muscle cell; and neurons.
    Human ortholog(s) of this gene implicated in Wolcott-Rallison syndrome and type
    1 diabetes mellitus. Orthologous to human EIF2AK3 (eukaryotic translation initiation
    factor 2 alpha kinase 3).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00003970;class=Gene
  source_id: WB:WBGene00003970
- source: RefSeq
