  text: Involved in non-motile cilium assembly. Located in ciliary transition zone.
    Is expressed in neurons. Used to study Meckel syndrome. Human ortholog(s) of this
    gene implicated in several diseases, including Bardet-Biedl syndrome (multiple);
    COACH syndrome; Joubert syndrome 6; Meckel syndrome 3; and nephronophthisis (multiple).
    Orthologous to human TMEM67 (transmembrane protein 67).
