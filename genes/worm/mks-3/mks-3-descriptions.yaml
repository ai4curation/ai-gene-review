descriptions:
- source: Alliance_Imported
  text: mks-3 encodes a transmembrane domain protein homologous to the human ciliopathy
    protein MKS-3/tmem67/meckelin; MKS-3 is required for cilia-mediated chemosensory
    reception and for the normal length of cilia; in regulating cilia organization
    and function, mks-3 functions in the same pathway as other mks (Meckel-Gruber
    Syndrome (MKS) homolog genes), including mks-1, but in parallel to the nphp (nephronophthisis
    (human kidney disease) homolog) genes, nphp-1 and nphp-4; mks-1;nphp-4 double
    mutants also display cell autonomous defects in connections between sheath and
    socket cells; MKS-3 is expressed in ciliated sensory neurons where it localizes
    to the distal end of dendrites and the cilium base; mks-3 expression is dependent
    upon the DAF-19 RFX-type transcription factor.
