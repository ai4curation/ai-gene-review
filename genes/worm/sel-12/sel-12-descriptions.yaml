gene_symbol: sel-12
organism: worm
uniprot_id: P52166
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Probable catalytic subunit of the gamma-secretase complex, an endoprotease
    complex that catalyzes the intramembrane cleavage of integral membrane proteins
    such as Notch receptors (lin-12 or glp-1). Provides the major presenilin function
    compared to hop-1 and spe-4. Required cell-autonomously for correct neurite connectivity
    of the AIY cholinergic interneurons and their correct functioning in thermotaxis.
    Required for mesodermal patterning of muscle function. Promotes basement membrane
    gap formation during tissue remodeling (PubMed:27661254).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P52166
  source_id: P52166
- source: Alliance_Imported
  text: sel-12 encodes a transmembrane domain protein orthologous to presenilins;
    during gonadal, germline, and vulval development, sel-12 functions, within receiving
    cells, to positively regulate lin-12 and glp-1 Notch-like signaling pathways;
    sel-12 presenilin activity and/or levels are likely regulated by the SET/NAP protein
    sub-family member encoded by spr-2, as mutations in sel-12 are suppressed by mutations
    in spr-2; spr-2 regulation of sel-12 occurs in a hop-1 presenilin dependent manner.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00004769;class=Gene
  source_id: WB:WBGene00004769
- source: Alliance_Automated
  text: Predicted to enable endopeptidase activity. Involved in several processes,
    including apical protein localization; egg-laying behavior; and regulation of
    signal transduction. Located in perinuclear region of cytoplasm. Is expressed
    in touch receptor neurons. Used to study Alzheimer's disease. Human ortholog(s)
    of this gene implicated in Alzheimer's disease (multiple); breast cancer; dilated
    cardiomyopathy (multiple); frontotemporal dementia (multiple); and hidradenitis
    suppurativa. Orthologous to several human genes including PSEN2 (presenilin 2).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00004769;class=Gene
  source_id: WB:WBGene00004769
