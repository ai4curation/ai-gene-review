- term:
    id: GO:0034205
    label: amyloid-beta formation
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - FB:FBgn0284421
  - MGI:MGI:1202717
  - PANTHER:PTN000024430
  - UniProtKB:P49768
  - UniProtKB:P49810
  - ZFIN:ZDB-GENE-000330-9
  - ZFIN:ZDB-GENE-991119-4
  review:
    summary: >-
      PAINT PTN000024430 propagates amyloid-beta formation from vertebrate and fly presenilins.
    action: REMOVE
    reason: >-
      Amyloid-beta formation requires an APP substrate containing the amyloid-beta sequence.
      The sole C. elegans APP-family protein, APL-1, does not contain the beta-amyloid peptide,
      so this process cannot occur in C. elegans; the propagation is taxonomically inappropriate
      for the worm even though the catalytic machinery is conserved.
    supported_by:
    - reference_id: PMID:8265668
      supporting_text: >-
        Similar to the Drosophila, human, and mouse APP-related proteins, APL-1 does not appear
        to contain the beta-amyloid peptide.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - LINEAGE_OR_TAXON_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN000024430
        source_label: PTN000024430
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          Presenilin node assertion is sound for vertebrate/fly members whose APP orthologs
          carry the amyloid-beta region; the C. elegans APP-family protein APL-1 lacks it,
          so the process cannot occur in the target organism.
