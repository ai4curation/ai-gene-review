      label: Notch receptor processing
    supported_by:
    - reference_id: PMID:9716525
      supporting_text: >-
        Reducing sel-12 activity can suppress the effects of elevated lin-12 activity when
        LIN-12 is activated by missense mutations but not when LIN-12 is activated by removal
        of the extracellular and transmembrane domains.
    - reference_id: PMID:9716525
      supporting_text: >-
        These results suggest that SEL-12 does not function downstream of activated LIN-12.
