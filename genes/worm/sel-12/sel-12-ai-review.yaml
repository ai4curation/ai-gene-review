suggested_questions:
- question: >-
    Which gamma-secretase substrates other than LIN-12/GLP-1 depend on SEL-12 in vivo, and
    does the SEL-12 versus HOP-1 division of labor reflect expression pattern or substrate
    preference?
- question: >-
    Should presenilin IBA propagation of amyloid-beta formation be restricted to taxa whose
    APP orthologs contain the amyloid-beta region (excluding nematodes)?
- question: >-
    What molecular activity of SEL-12 underlies its reported gamma-secretase-independent restraint
    of ER-to-mitochondria calcium transfer (e.g. ER calcium leak channel activity, or organization
    of ER-mitochondria contacts), and could it be captured by a GO molecular function term?
suggested_experiments:
- description: >-
    Test catalytic-aspartate mutants (D226A, D364A) of SEL-12 for rescue of pi cell and AIY
    phenotypes in sel-12; hop-1 backgrounds to confirm that all Notch-related functions require
    protease activity.
