- term:
    id: GO:0006509
    label: membrane protein ectodomain proteolysis
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - FB:FBgn0284421
  - PANTHER:PTN000024429
  - RGD:3425
  - UniProtKB:P49768
  - UniProtKB:P49810
  review:
    summary: >-
      PAINT PTN000024429 assigns membrane protein ectodomain proteolysis to presenilins.
    action: KEEP_AS_NON_CORE
    reason: >-
      Gamma-secretase does not itself shed ectodomains: it performs the intramembrane cleavage
      of the membrane-bound stub left after ectodomain shedding (e.g. by SUP-17/ADAM10), releasing
      the intracellular domain. Human PSEN1 carries this term by IDA, so it reflects an established
      convention of annotating the sequential shedding/RIP process to presenilin; kept, but
      GO:0031293 (membrane protein intracellular domain proteolysis) or Notch receptor processing
      better describe what SEL-12 does.
    supported_by:
    - reference_id: PMID:9716525
      supporting_text: >-
        Reducing sel-12 activity can suppress the effects of elevated lin-12 activity when
        LIN-12 is activated by missense mutations but not when LIN-12 is activated by removal
        of the extracellular and transmembrane domains.
    - reference_id: PMID:23539368
      supporting_text: >-
        SEL-12/Presenilin releases the Notch intracellular domain (NICD), which enters the
        cell nucleus and interacts with LAG-1/CSL and other transcription factors to activate
        target gene transcription.
