  review:
    summary: >-
      sel-12 hop-1 mutants have defective temperature memory (thermotaxis) owing to AIY interneuron
      neurite defects.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Detection of temperature stimulus is a sensory transduction process (performed by AFD
      thermosensory neurons). The presenilin phenotype is a structural defect in downstream
      AIY interneurons that affects thermotaxis behavior, not temperature detection; the annotation
      over-interprets the phenotype.
    supported_by:
