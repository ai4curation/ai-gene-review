      supporting_text: >-
        Mutations in the Caenorhabditis elegans presenilin genes sel-12 and hop-1 result in
        a defect in the temperature memory of the animals.
    - reference_id: PMID:10917532
      supporting_text: >-
        This defect is caused by the loss of presenilin function in two cholinergic interneurons
        that display neurite morphology defects in presenilin mutants.
