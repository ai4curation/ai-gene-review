id: P52166
gene_symbol: sel-12
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: >-
  sel-12 encodes the principal C. elegans presenilin, a multipass (eight transmembrane) aspartyl
  protease of the peptidase A22A family that is the catalytic subunit of the gamma-secretase
  complex (with APH-1, APH-2/nicastrin and PEN-2). Its two transmembrane catalytic aspartates
  and PAL motif mediate intramembrane cleavage of type I membrane proteins after ectodomain
  shedding; its best established substrate role is the S3 cleavage of the LIN-12 and GLP-1
  Notch receptors that releases the intracellular domain to act with LAG-1/CSL in the nucleus.
  SEL-12 acts in signal-receiving cells, upstream of the activated intracellular domain, and
  is partially redundant with the second presenilin HOP-1 (and SPE-4 in sperm), so sel-12
  single mutants show a restricted subset of lin-12 phenotypes such as defective uterine pi
  cell induction and egg-laying defects, as well as defects in AIY interneuron neurite morphology
  and thermotaxis memory. The protein localizes to ER/Golgi (perinuclear) membranes and human
  PS1 can substitute for it. SEL-12 has also been reported to restrain ER-to-mitochondria
  calcium transfer independently of its protease activity, a function linked to neuronal and
  lysosomal maintenance.
