  review:
    summary: >-
      sel-12 reduction suppresses missense-activated LIN-12 but not LIN-12 truncated for the
      extracellular and transmembrane domains.
    action: MODIFY
    reason: >-
      This epistasis places SEL-12 at the step that generates the active intracellular domain
      from the membrane-bound receptor, i.e. Notch receptor processing (the gamma-secretase
      S3 cleavage). SEL-12 is a core pathway component (enzyme), not a regulator of the pathway;
      Notch receptor processing is the more precise term.
    proposed_replacement_terms:
