core_functions:
- description: >-
    Catalytic subunit of gamma-secretase: an intramembrane-cleaving aspartyl protease that
    cleaves the membrane-bound stub of LIN-12/GLP-1 generated by S2 ectodomain shedding (S3
    cleavage), releasing the Notch intracellular domain that activates LAG-1/CSL target genes.
    Acts in signal-receiving cells, partially redundantly with HOP-1.
  molecular_function:
    id: GO:0042500
    label: aspartic endopeptidase activity, intramembrane cleaving
  directly_involved_in:
  - id: GO:0007220
    label: Notch receptor processing
  locations:
  - id: GO:0005789
    label: endoplasmic reticulum membrane
  - id: GO:0000139
    label: Golgi membrane
  in_complex:
    id: GO:0070765
    label: gamma-secretase complex
  supported_by:
  - reference_id: PMID:7566091
    supporting_text: >-
      The sel-12 gene encodes a protein with multiple transmembrane domains, and is similar
      to S182, which has been implicated in early-onset familial Alzheimer's disease.
  - reference_id: PMID:10917532
    supporting_text: >-
      The wild-type human presenilin PS1, but not the FAD mutant PS1 A246E, can also rescue
      these morphological defects.
  - reference_id: PMID:9716525
    supporting_text: >-
      Reducing sel-12 activity can suppress the effects of elevated lin-12 activity when LIN-12
      is activated by missense mutations but not when LIN-12 is activated by removal of the
      extracellular and transmembrane domains.
  - reference_id: PMID:9716525
    supporting_text: >-
      These results suggest that SEL-12 does not function downstream of activated LIN-12.
  - reference_id: PMID:23539368
    supporting_text: >-
      SEL-12/Presenilin releases the Notch intracellular domain (NICD), which enters the cell
      nucleus and interacts with LAG-1/CSL and other transcription factors to activate target
      gene transcription.
  - reference_id: file:worm/sel-12/sel-12-deep-research-falcon.md
    supporting_text: >-
      SEL-12-containing gamma-secretase catalyzes the final transmembrane cleavage (S3 cleavage),
      releasing the LIN-12 intracellular domain from its membrane anchor
