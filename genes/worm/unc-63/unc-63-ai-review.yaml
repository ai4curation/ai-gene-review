id: Q9N587
gene_symbol: unc-63
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: 'UNC-63 is a C. elegans alpha Cys-loop nicotinic acetylcholine receptor subunit shared by
  two heteromeric acetylcholine-gated cation channels. With UNC-29, LEV-1, UNC-38 and LEV-8, it forms
  the levamisole-sensitive receptor that mediates excitatory cholinergic transmission at body-wall neuromuscular
  junctions. With ACR-2, ACR-3, ACR-12 and UNC-38, it forms the neuronal ACR-2 receptor that maintains
  cholinergic motor-neuron excitability. UNC-63 localizes to the muscle plasma membrane and to punctate
  receptor clusters in nerve cords, and unc-63 mutants show levamisole resistance and locomotory defects
  because L-AChR channel gating or assembly is impaired.'
