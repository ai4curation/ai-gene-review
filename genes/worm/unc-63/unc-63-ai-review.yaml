suggested_questions:
- question: Which UNC-63 subunit interfaces supply the acetylcholine/levamisole binding sites in the
    L-AChR and the acetylcholine binding sites in ACR-2R?
  experts:
  - Boulin T
  - Bessereau JL
  - Jorgensen EM
- question: Does native ACR-2R contain a fixed ACR-2/ACR-3/ACR-12/UNC-38/UNC-63 stoichiometry in
    cholinergic motor neurons, or can it vary with subunit abundance or developmental stage?
  experts:
  - Jospin M
  - Jin Y
suggested_experiments:
- description: Tag endogenous UNC-63 and ACR-2R-specific subunits in the same animals and quantify
    receptor stoichiometry and localization in cholinergic motor neurons using knock-in fluorescence
    plus biochemical purification.
- description: Use structure-guided mutations in predicted UNC-63 interface residues to separate its
    L-AChR and ACR-2R roles, then assay levamisole-evoked muscle currents, ACR-2R-dependent
    motor-neuron excitation, and locomotion.
