  text: Involved in several processes, including non-motile cilium assembly; protein
    localization to cilium; and protein to membrane docking. Located in ciliary basal
    body and ciliary transition zone. Is expressed in chemosensory neurons and ciliated
    neurons. Human ortholog(s) of this gene implicated in several diseases, including
    COACH syndrome; Joubert syndrome 7; Leber hereditary optic neuropathy; Meckel
    syndrome 5; and retinal disease (multiple). Orthologous to human RPGRIP1 (RPGR
    interacting protein 1) and RPGRIP1L (RPGRIP1 like).
