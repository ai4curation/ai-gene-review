descriptions:
- source: UniProt
  text: 'Functions as a calcium permeable cation channel (PubMed:15862350). Required
    for 2 aspects of male mating behavior: response to hermaphrodite contact and vulva
    location (PubMed:11553327, PubMed:12411744, PubMed:15753033, PubMed:15862350,
    PubMed:18037411, PubMed:28745435). Acts in the same pathway as lov-1 and atp-2
    in response behavior (PubMed:11553327).'
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q9U1S7
