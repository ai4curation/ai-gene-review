gene_symbol: pkd-2
organism: worm
uniprot_id: Q9U1S7
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: 'Functions as a calcium permeable cation channel (PubMed:15862350). Required
    for 2 aspects of male mating behavior: response to hermaphrodite contact and vulva
    location (PubMed:11553327, PubMed:12411744, PubMed:15753033, PubMed:15862350,
    PubMed:18037411, PubMed:28745435). Acts in the same pathway as lov-1 and atp-2
    in response behavior (PubMed:11553327).'
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q9U1S7
  source_id: Q9U1S7
- source: Alliance_Imported
  text: 'pkd-2 encodes a TRPP cation channel orthologous to human PKD2; pkd-2 is required
    for two aspects of male mating behavior: response to hermaphrodite contact and
    vulva location and acts with lov-1; PKD-2 is expressed in the cilia of three types
    of male-specific sensory neurons; EGL-44 and EGL-46 regulate cell-specific expression
    of lov-1 and pkd-2 to specify the behavioral function of the HOB neuron.'
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00004035;class=Gene
  source_id: WB:WBGene00004035
- source: Alliance_Automated
  text: Enables calcium channel activity. Involved in calcium ion transport; response
    to hermaphrodite contact; and vulval location. Located in several cellular components,
    including ciliary base; perikaryon; and sensory dendrite. Is expressed in CEM;
    nerve ring; neurons; and ray. Used to study autosomal dominant polycystic kidney
    disease. Human ortholog(s) of this gene implicated in autosomal dominant polycystic
    kidney disease; intracranial aneurysm; polycystic kidney disease; polycystic kidney
    disease 2; and retinal degeneration. Orthologous to several human genes including
    PKD2 (polycystin 2, transient receptor potential cation channel).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00004035;class=Gene
  source_id: WB:WBGene00004035
