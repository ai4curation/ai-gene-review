      regulation.
- source: Alliance_Imported
  text: 'pkd-2 encodes a TRPP cation channel orthologous to human PKD2; pkd-2 is required
    for two aspects of male mating behavior: response to hermaphrodite contact and
    vulva location and acts with lov-1; PKD-2 is expressed in the cilia of three types
    of male-specific sensory neurons; EGL-44 and EGL-46 regulate cell-specific expression
    of lov-1 and pkd-2 to specify the behavioral function of the HOB neuron.'
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00004035;class=Gene
