id: Q23272
gene_symbol: atfs-1
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for worm atfs-1, the bZIP master regulator of the mitochondrial
  unfolded protein response. Rank 2 is an exact GOA match on the defining process with IGI/IMP support,
  and rank 4 (obsolete) reaches the innate-immunity transcription role that is the review's third
  core function - so two of the three curated core functions are represented in the top five. The
  failures are of one kind: ranks 1 and 3 assert membership in two named mammalian bZIP complexes,
  transferred from the ATF4/ATF5 family that PANTHER places ATFS-1 in. The free-text channel returns
  ATFS-1's own UniProt comment at 21.30, the highest free-text score in the worm set. Assessment:
  1 correct-not-novel, 2 nonparalog incorrect. Assessment: 1 correct not novel (CNN), 2 nonparalog
  incorrect (NPI).
