    summary: >-
      Top-ranked hit (score 17.41). The ATF1-ATF4 transcription factor complex is a named mammalian
      heterodimer; C. elegans has no ATF1 ortholog and ATFS-1 is not a component of it. The call follows
      from PANTHER's placement of ATFS-1 in the ATF4/ATF5 family (PTHR13044) - family membership transferred
      as complex membership. Scored MORE_SPECIFIC against GOA's nucleus, so ontology closure would
      credit it.
