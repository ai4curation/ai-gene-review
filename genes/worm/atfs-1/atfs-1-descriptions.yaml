- source: Alliance_Automated
  text: Enables DNA-binding transcription factor activity, RNA polymerase II-specific;
    enzyme binding activity; and mitochondrial transcription factor activity. Involved
    in defense response to Gram-negative bacterium; mitochondrial unfolded protein
    response; and regulation of gene expression. Located in mitochondrial matrix and
    nucleus. Is expressed in intestine.
  source_type: automated
