gene_symbol: atfs-1
organism: worm
uniprot_id: Q23272
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Acts as a transcription factor during mitochondrial stress by activating the
    mitochondrial unfolded protein response (mtUPR) (PubMed:22700657, PubMed:25274306,
    PubMed:25773600, PubMed:30642431). Induces nuclear and mitochondrial gene transcription,
    including genes coding for mitochondrial chaperones and proteins involved in glycolysis,
    amino acid catabolism and innate immunity (PubMed:22700657, PubMed:25274306, PubMed:25773600).
    Following mitochondrial stress, restores mitochondrial respiratory capacity by
    limiting the transcription of oxidative phosphorylation (OXPHOS) machinery genes
    and by promoting the assembly of OXPHOS complexes via the up-regulation of chaperone
    and assembly factor genes (PubMed:25773600). Component of a feedback loop involving
    atfs-1, atgl-1 and hlh-11 (PubMed:33078707). Acts together with flp-7 to negatively
    regulate the expression of the transcription regulator hlh-11, to promote expression
    of atgl-1, and thus atgl-1-dependent fat oxidation in response to mitochondrial
    stress (PubMed:33078707). In addition, functions with hlh-11 to maintain lifespan
    (PubMed:33078707). Promotes mtDNA maintenance and propagation of deleterious mtDNA
    (PubMed:27135930).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q23272
  source_id: Q23272
- source: Alliance_Imported
  text: atfs-1 encodes a bZip transcription factor; ATFS-1 is required for the mitochondrial
    unfolded protein response (UPRmt); in wild-type animals, ATFS-1 is imported into
    the mitochondria and degraded, but in response to perturbed mitchondrial protein
    folding and decreased mitochondrial import efficiency, some ATFS-1 accumulates
    in the cytosol and then, traffics to the nucleus.
