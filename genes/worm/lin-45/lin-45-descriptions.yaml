gene_symbol: lin-45
organism: worm
uniprot_id: Q07292
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Protein kinase that participates in the induction of vulva and has roles in
    fertility and viability. Acts downstream of the Ras protein let-60 (PubMed:11861555,
    PubMed:14724126, PubMed:8483497). Required for progression of developing oocytes
    through the pachytene stage (PubMed:19826475). Plays a role in responses to M.nematophilum-
    mediated bacterial infection by promoting tail swelling and preventing constipation
    (PubMed:15268855). Positively regulates lifespan upstream of mek-2 and mpk-1 (PubMed:20624915).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q07292
  source_id: Q07292
- source: Alliance_Imported
  text: The lin-45 gene encodes an ortholog of the vertebrate protein RAF which is
    required for larval viability, fertility and the induction of vulval cell fates.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00003030;class=Gene
  source_id: WB:WBGene00003030
- source: Alliance_Automated
  text: Enables small GTPase binding activity. Involved in several processes, including
    defense response to Gram-positive bacterium; intracellular signaling cassette;
    and vulval development. Predicted to be active in cytoplasm. Is expressed in head
    neurons and vulval precursor cell. Human ortholog(s) of this gene implicated in
    several diseases, including Noonan syndrome (multiple); Noonan syndrome with multiple
    lentigines (multiple); cardiofaciocutaneous syndrome (multiple); dilated cardiomyopathy
    1NN; and disease of cellular proliferation (multiple). Orthologous to several
    human genes including BRAF (B-Raf proto-oncogene, serine/threonine kinase).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00003030;class=Gene
  source_id: WB:WBGene00003030
