descriptions:
- source: UniProt
  text: Protein kinase that participates in the induction of vulva and has roles in
    fertility and viability. Acts downstream of the Ras protein let-60 (PubMed:11861555,
    PubMed:14724126, PubMed:8483497). Required for progression of developing oocytes
    through the pachytene stage (PubMed:19826475). Plays a role in responses to M.nematophilum-
    mediated bacterial infection by promoting tail swelling and preventing constipation
    (PubMed:15268855). Positively regulates lifespan upstream of mek-2 and mpk-1 (PubMed:20624915).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q07292
  source_id: Q07292
