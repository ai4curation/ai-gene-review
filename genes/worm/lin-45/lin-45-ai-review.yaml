id: Q07292
gene_symbol: lin-45
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: >-
  lin-45 encodes the C. elegans RAF-family MAP kinase kinase kinase downstream
  of LET-60/Ras. Activated LIN-45 phosphorylates the MEK-2/MPK-1 ERK cascade
  and transduces LET-23/Ras signals during vulval induction, larval viability,
  fertility, and infection-associated ERK signaling.
