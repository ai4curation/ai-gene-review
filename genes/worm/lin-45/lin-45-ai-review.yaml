  review:
    summary: LIN-45 participates in the ERK-type MAPK cascade during the response to
      rectal infection.
    action: ACCEPT
    reason: The same LIN-45/MEK-2/MPK-1 ERK cassette that patterns the vulva is
      also used downstream of Microbacterium nematophilum infection, so the broad
      MAPK cascade annotation is a correct core pathway assertion for this RAF.
    supported_by:
    - reference_id: PMID:15268855
      supporting_text: an extracellular signal-regulated kinase (ERK) mitogen-activated
        protein (MAP) kinase cascade mediates tail swelling
