core_functions:
- description: >-
    Structural core component of the ciliary transition-zone central cylinder, the
    inner scaffold that holds the axonemal microtubules. It is needed for TZ
    ultrastructure, ciliary gate (diffusion barrier) function, and recruitment of
    MKS-module proteins and of TMEM-138/CDKL-1 to the TZ. No GO MF term describes a
    TZ scaffold, so structural molecule activity is used as the nearest available
    term.
  molecular_function:
    id: GO:0005198
    label: structural molecule activity
  locations:
  - id: GO:1990805
    label: central cylinder
  - id: GO:0035869
    label: ciliary transition zone
  directly_involved_in:
