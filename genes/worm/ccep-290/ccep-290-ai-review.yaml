id: A2A266
gene_symbol: ccep-290
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: >-
  CCEP-290 (Y47G6A.17; also referred to as CEP-290) is the Caenorhabditis elegans
  ortholog of human CEP290 (NPHP6/MKS4), a large (1736 aa) protein made up largely
  of predicted coiled-coil segments. It is expressed only in ciliated sensory
  neurons and concentrates at the ciliary transition zone (TZ), where it occupies
  a central position inside the ring of axonemal doublet microtubules and is a
  core component of the central cylinder (apical ring), the inner scaffold to
  which the outer doublet and inner singlet microtubules attach. Loss of CCEP-290
  fragments or abolishes the central cylinder and disrupts TZ ultrastructure,
  including Y-links, and compromises the ciliary gate, so that periciliary
  membrane proteins (TRAM-1a, RPI-2) leak into cilia and ARL-13 escapes its
  ciliary compartment. CCEP-290 acts in the TZ assembly hierarchy between MKS-5
  and the MKS module, being required for TZ localisation of MKS-module proteins
  (MKSR-1, MKSR-2, MKS-2, TMEM-231, TMEM-17, TMEM-218) and of TMEM-138 and CDKL-1,
  but not of MKS-5 or the NPHP module. Genetically it behaves as an MKS-module
  gene: cep-290 single mutants form largely intact cilia, but combining cep-290
  with nphp-4 causes synthetic cilium structure defects, and removing all three TZ
  modules abolishes TZ structure. Together with NPHP-4, CCEP-290 is also needed
  for dendrite anchoring and extension during embryogenesis.
