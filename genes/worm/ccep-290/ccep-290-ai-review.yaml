  review:
    summary: >-
      Phylogenetic inference that places CCEP-290 in chromatin. It comes from a
      PANTHER node in the SMC2 (condensin) family. The protein's PANTHER
      assignment is to PTHR43941 (STRUCTURAL MAINTENANCE OF CHROMOSOMES PROTEIN 2),
      not to the CEP290 family (PTHR18879).
    action: REMOVE
    reason: >-
      CCEP-290 is the C. elegans CEP290 ortholog, identified by reciprocal BLAST and
      conserved across eukaryotes. It is a coiled-coil transition-zone protein, not
      an SMC ATPase. It lacks SMC ATPase/hinge domain annotations and has no reported
      nuclear or chromatin association. The IBA arises because the long
      coiled-coil sequence was placed in the SMC2 PANTHER family (UniProt DR line
      PTHR43941:SF1), so it inherits condensin-subunit terms from SMC2 orthologs.
      That family assignment is wrong for this protein, so the inherited chromatin
      annotation should be removed.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - WRONG_ORTHOLOG_OR_PARALOG
      source_entities:
      - source_id: PANTHER:PTN000434684
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: SMC2/condensin node; the assertion is sound for SMC2 orthologs, but
          A2A266 is a CEP290 ortholog misplaced in PTHR43941 by its HMM assignment
          and so sits outside the clade that has the function.
    supported_by:
    - reference_id: PMID:26124290
      supporting_text: CEP290 orthologues were identified by reciprocal BLAST analysis
        using human CEP290 as the starting point.
    - reference_id: PMID:26982032
      supporting_text: Based on Y47G6A.17 consisting largely of coiled coils and having
        sequence homology to mammalian Cep290, its TZ localisation, and our finding
        that it plays an important role in the assembly and function of the TZ (see
        below), our data support the notion that it is indeed the functional homologue
        of Cep290
    - reference_id: file:worm/ccep-290/ccep-290-uniprot.txt
      supporting_text: PANTHER; PTHR43941; STRUCTURAL MAINTENANCE OF CHROMOSOMES PROTEIN 2; 1.
