- term:
    id: GO:1905349
    label: ciliary transition zone assembly
  evidence_type: IMP
  original_reference_id: PMID:26124290
  qualifier: involved_in
  review:
    summary: >-
      Loss of CCEP-290 fragments the central cylinder, removes TZ hallmarks in the
      null mutant, and together with mksr-2 and nphp-4 abolishes the TZ entirely.
    action: NEW
    reason: >-
      CCEP-290 does part of the work of TZ assembly: it is a structural component
      of the central cylinder, the inner scaffold the TZ is built on (structure
      case, not mere requirement). For the comparator check, CEP290 orthologs placed
      in the CEP290 PANTHER family carry this term (e.g. rat Cep290 by IBA). The
      worm protein only lacks it because PANTHER puts it in the SMC2 family. This
      term is more specific than non-motile cilium assembly and is not its
      ancestor.
    supported_by:
    - reference_id: PMID:26124290
      supporting_text: with CCEP-290 serving as a core component of the central cylinder,
        which appears to act as an inner scaffold for transition zone assembly
    - reference_id: PMID:26124290
      supporting_text: Transition zone structures are completely lost in ccep-290;mksr-2;nphp-4
        triple mutants.
