  review:
    summary: >-
      CEP-290::GFP is expressed in ciliated sensory neurons and enriched at the TZ.
      Its localisation depends on MKS-5 but not on MKS- or NPHP-module proteins.
      The tagged protein rescues the mutant, so the localisation is functionally
      relevant.
    action: ACCEPT
    reason: >-
      Direct, well-supported core location. Schouteden et al. (PMID:26124290) found
      the same independently, with GFP:CCEP-290 placed between the basal body
      marker HYLS-1 and the glutamylated axoneme.
    supported_by:
    - reference_id: PMID:26982032
      supporting_text: is expressed only in ciliated sensory neurons (including amphids
        and phasmids) and is specifically enriched at the ciliary transition zone (TZ)
    - reference_id: PMID:26982032
      supporting_text: Rescue of the cep-290 mutant with our CEP-290::GFP translational
        reporter confirms that cep-290 is responsible for this phenotype and that the
        GFP-tagged protein is functional
    - reference_id: PMID:26124290
      supporting_text: Consistent with localization to transition zones, CCEP-290 was
        found distal to the basal body marker HYLS-1
- term:
    id: GO:1904491
    label: protein localization to ciliary transition zone
  evidence_type: IMP
  original_reference_id: PMID:26982032
  qualifier: involved_in
  review:
    summary: >-
      In cep-290 null mutants, TMEM-218, MKSR-1, MKS-2, TMEM-231, TMEM-17, TMEM-138
      and CDKL-1 fail to localise to the TZ. MKS-5 and NPHP-1/NPHP-4 still localise
      largely normally. Schouteden et al. likewise report that CCEP-290 tethers
      MKSR-2 at the TZ.
    action: ACCEPT
    reason: >-
      This is a core process for CCEP-290: it is an assembly factor for the MKS
      branch of the TZ. As a structural component of the central cylinder, it
      supplies the scaffold that these proteins depend on, which counts as
      participation and not just indirect requirement.
    supported_by:
    - reference_id: PMID:26982032
      supporting_text: Hence, CEP-290 is required for the localisation of MKS module
        components but is not essential for the largely normal TZ localisation of the
        NPHP module or MKS-5.
    - reference_id: PMID:26124290
      supporting_text: CCEP-290 therefore tethers MKSR-2 to the transition zone.
- term:
    id: GO:1905515
    label: non-motile cilium assembly
  evidence_type: IGI
  original_reference_id: PMID:26982032
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:G5ECP0
  review:
    summary: >-
      cep-290;nphp-4 double mutants lose dye-filling, a readout of intact
      sensory-cilium structure. cep-290;mks-2 double mutants do not. This is the
      synthetic interaction pattern of an MKS-module gene.
    action: ACCEPT
    reason: >-
      C. elegans sensory cilia are non-motile. CCEP-290 is a structural TZ component,
      and the TZ is a sub-structure built during cilium assembly. The redundant
      requirement shows up when the NPHP module is also removed. Cilia are still
      largely present even in triple TZ-module mutants (PMID:26124290), so
      CCEP-290's contribution is to the TZ part of cilium assembly. The more
      specific term GO:1905349 is proposed as NEW below.
    supported_by:
    - reference_id: PMID:26982032
      supporting_text: A synthetic dye-filling phenotype is observed when cep-290 is
        combined with the nphp-4 mutant, but not with the mks-2 mutant (Fig 4E)
