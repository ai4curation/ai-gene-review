suggested_questions:
- question: >-
    Does CCEP-290 need MKS-5 to reach the TZ (Li et al. 2016) or does it target
    independently (Schouteden et al. 2015)? Which alleles and imaging conditions
    explain the difference?
- question: >-
    Should PANTHER reclassify A2A266 from PTHR43941 (SMC2) into the CEP290 family
    PTHR18879? The SMC2 assignment propagates condensin terms to the worm CEP290
    ortholog and keeps CEP290-family IBAs off it.
- question: Which CCEP-290 coiled-coil segments bind MKS-5 and the MKS-module proteins it
    recruits?
suggested_experiments:
- description: >-
    Map the CCEP-290 regions needed for central cylinder localisation and for
    MKSR-2/MKS-2 recruitment, using CRISPR domain deletions with endogenously
    tagged TZ markers and expansion or super-resolution microscopy.
  hypothesis: Distinct coiled-coil regions of CCEP-290 mediate central cylinder incorporation
    and tethering of MKS-module proteins.
