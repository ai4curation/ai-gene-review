    label: ciliary transition zone assembly
  - id: GO:1904491
    label: protein localization to ciliary transition zone
  - id: GO:1905515
    label: non-motile cilium assembly
  supported_by:
  - reference_id: PMID:26124290
    supporting_text: with CCEP-290 serving as a core component of the central cylinder,
      which appears to act as an inner scaffold for transition zone assembly
  - reference_id: PMID:26982032
    supporting_text: Together, our two complementary TZ functional assays suggest that
      CEP-290 plays an essential role in maintaining a functional TZ “gate” or membrane
      diffusion barrier.
