- id: PMID:26982032
  title: MKS5 and CEP290 Dependent Assembly Pathway of the Ciliary Transition Zone.
  findings:
  - statement: CEP-290 is a TZ protein required for ciliary gate function and TZ ultrastructure,
      acting downstream of MKS-5 and upstream of MKS-module proteins.
    supporting_text: Together, the data point to CEP-290 functioning downstream of
      MKS-5 and upstream of MKS module components.
  - statement: CEP-290 TZ localisation requires MKS-5 (its coiled-coil region).
    supporting_text: In contrast, CEP-290 localisation to the TZ is lost when the
      core assembly factor, MKS-5, is ablated (Fig 4B).
    finding_review:
      finding_status: DISPUTED
      superseded_by:
      - PMID:26124290
      review_notes: >-
        Schouteden et al. found CCEP-290 recruitment unaffected in mks-5 mutants and
        concluded that it targets the TZ independently. Different alleles, reporters
        and imaging approaches may explain the discrepancy.
      supported_by:
      - reference_id: PMID:26124290
        supporting_text: CCEP-290 recruitment was unaffected in mutants of MKS-5, MKSR-2,
          and NPHP-4, the most upstream components of the MKS and NPHP assembly pathways
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached; primary C. elegans characterisation of CEP-290 localisation,
      gate function, TZ ultrastructure and assembly hierarchy.
