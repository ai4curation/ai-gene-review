gene_symbol: clk-1
organism: worm
uniprot_id: P48376
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Catalyzes the hydroxylation of the 5-methoxy-2-methyl-3-(all- trans-polyprenyl)benzoquinone
    at the C6 position and participates in the biosynthesis of ubiquinone. Catalyzes
    the reaction through a substrate-mediated reduction pathway, whereby NADH shuttles
    electrons to 5-methoxy-2-methyl-3-(all-trans-decaprenyl)benzoquinone, which then
    transfers the electrons to the two Fe(3+) centers. The binding of 5- methoxy-2-methyl-3-(all-trans-polyprenyl)benzoquinone
    (DMQn) mediates reduction of the diiron center by nicotinamide adenine dinucleotide
    (NADH) and initiates oxygen activation for subsequent DMQ hydroxylation (By similarity).
    Also has a structural role in the COQ enzyme complex, stabilizing other COQ polypeptides
    (By similarity). Involved in lifespan determination in a ubiquinone-independent
    manner (PubMed:25961505, PubMed:9020081). Plays a role in modulating mitochondrial
    stress responses, acting in the nucleus, perhaps via regulating gene expression,
    independent of its characterized mitochondrial function in ubiquinone biosynthesis
    (PubMed:25961505). Plays a role in modulating polyribosome formation (PubMed:30198021).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P48376
  source_id: P48376
- source: Alliance_Imported
  text: clk-1 encodes the C. elegans ortholog of COQ7/CAT5, a highly conserved demethoxyubiquinone
    (DMQ) hydroxylase that is necessary for the biosynthesis of ubiquinone (coenzyme
    Q, Q9) from 5-demethoxyubiquinone (DMQ9); in C. elegans, CLK-1 activity is required
    for normal physiological rates of growth, development, behavior, and aging, as
    well as for normal brood sizes.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00000536;class=Gene
  source_id: WB:WBGene00000536
- source: Alliance_Automated
  text: Enables transcription cis-regulatory region binding activity. Involved in
    several processes, including determination of adult lifespan; positive regulation
    of growth rate; and regulation of transcription by RNA polymerase II. Located
    in mitochondrion and nucleus. Is expressed widely. Human ortholog(s) of this gene
    implicated in autosomal recessive distal hereditary motor neuronopathy 9 and primary
    coenzyme Q10 deficiency 8. Orthologous to human COQ7 (coenzyme Q7, hydroxylase).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00000536;class=Gene
