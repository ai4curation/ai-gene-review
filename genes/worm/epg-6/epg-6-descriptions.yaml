descriptions:
- source: UniProt
  text: Component of the epg-6/atg-2 complex, which is involved in the generation
    of autophagosomes from omegasomes and in the distribution of atg-9 and atg-13
    during the autophagy-mediated degradation of protein aggregates (PubMed:21802374).
    Binds to phosphatidylinositols on preautophagosomes, which are early autophagic
    structures, to promote autophagosome formation (PubMed:21802374). In particular,
    binds with high affinity to phosphatidylinositols including phosphatidylinositol
    3-phosphate (PtdIns(3)P) and phosphatidylinositol 5-phosphate (PtdIns(5)P), but
    more weakly to phosphatidylinositol 4- phosphate (PtdIns(4)P) and phosphatidylinositol
    3,5-bisphosphate (PtdIns(3,5)P2) (PubMed:21802374). Involved in autophagy-mediated
    degradation of ribosomal RNA and ribosomal proteins in lysosomes, which is essential
    for maintaining nucleotide homeostasis (PubMed:30102152).
