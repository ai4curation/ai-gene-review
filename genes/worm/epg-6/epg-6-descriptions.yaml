gene_symbol: epg-6
organism: worm
uniprot_id: Q86MP3
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Component of the epg-6/atg-2 complex, which is involved in the generation
    of autophagosomes from omegasomes and in the distribution of atg-9 and atg-13
    during the autophagy-mediated degradation of protein aggregates (PubMed:21802374).
    Binds to phosphatidylinositols on preautophagosomes, which are early autophagic
    structures, to promote autophagosome formation (PubMed:21802374). In particular,
    binds with high affinity to phosphatidylinositols including phosphatidylinositol
    3-phosphate (PtdIns(3)P) and phosphatidylinositol 5-phosphate (PtdIns(5)P), but
    more weakly to phosphatidylinositol 4- phosphate (PtdIns(4)P) and phosphatidylinositol
    3,5-bisphosphate (PtdIns(3,5)P2) (PubMed:21802374). Involved in autophagy-mediated
    degradation of ribosomal RNA and ribosomal proteins in lysosomes, which is essential
    for maintaining nucleotide homeostasis (PubMed:30102152).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q86MP3
  source_id: Q86MP3
- source: Alliance_Imported
  text: epg-6 encodes a WD40 repeat-containing protein that is related to the mammalian
    WIPI3/4 family of proteins (WD40 repeat protein interacting with phosphoinositides);
    in C. elegans, epg-6 activity is required for autophagic processes, specifically
    for the formation of autophagosomes from omegasomes (PtdIns(3)P-enriched endoplasmic
    reticulum subdomains) and for proper distribution of the autophagic proteins ATG-9
    and EPG-1; EPG-6 binds ATG-2 in vitro and in vivo and also binds, in vitro, PtdIns(3)P
    and PtdIns(5)P and weakly binds PtdIns(4)P and PtdIns(3,5)P2; an EGP-6::GFP reporter
    fusion protein is widely expressed during embryonic and post-embryonic development,
    and localizes diffusely to the cytoplasm.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00012641;class=Gene
  source_id: WB:WBGene00012641
- source: Alliance_Automated
  text: Enables phosphatidylinositol phosphate binding activity. Involved in autophagosome
    assembly. Located in cytoplasm. Is expressed in several structures, including
    nervous system. Human ortholog(s) of this gene implicated in neurodegeneration
    with brain iron accumulation 5 and spastic quadriplegic cerebral palsy. Orthologous
    to several human genes including WDR45 (WD repeat domain 45).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00012641;class=Gene
  source_id: WB:WBGene00012641
