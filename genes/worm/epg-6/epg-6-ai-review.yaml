- id: PMID:21802374
  title: The WD40 repeat PtdIns(3)P-binding protein EPG-6 regulates progression of omegasomes to autophagosomes.
  findings:
  - statement: EPG-6 is a WD40 PROPPIN that binds PtdIns(3)P, binds ATG-2 directly, and with ATG-2 moves
      omegasomes on to autophagosomes.
    supporting_text: epg-6 and atg-2 regulate progression of omegasomes to autophagosomes, and their loss
      of function causes accumulation of enlarged early autophagic structures
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Founding paper for epg-6; source of all experimental GOA rows. Abstract only in cache.
- id: PMID:25124690
  title: PI3P phosphatase activity is required for autophagosome maturation and autolysosome formation.
  findings:
  - statement: MTM-3 acts downstream of the ATG-2/EPG-6 complex.
    supporting_text: MTM-3 acts downstream of the ATG-2/EPG-6 complex and upstream of EPG-5 to promote
      autophagosome maturation into autolysosomes
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Places the ATG-2/EPG-6 complex in the genetic hierarchy.
- id: PMID:30871075
  title: ATG-18 and EPG-6 are Both Required for Autophagy but Differentially Contribute to Lifespan Control
    in Caenorhabditis elegans.
  findings:
  - statement: Both ATG-18 and EPG-6 are required for autophagic flux; epg-6 mutants are long-lived, unlike
      atg-18 mutants.
    supporting_text: we provide evidence that in the absence of either ATG-18 or EPG-6 autophagy was impaired
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Independent confirmation of the epg-6 autophagy defect; reports an unexplained lifespan
      extension.
- id: PMID:30185561
  title: Insights into autophagosome biogenesis from structural and biochemical analyses of the ATG2A-WIPI4
    complex.
  findings:
  - statement: Human WIPI4 binds one tip of ATG2A; the complex tethers PI3P-containing membranes to other
      membranes.
    supporting_text: WIPI4 binds to one of the tips, enabling the ATG2A-WIPI4 complex to tether a PI3P-containing
      vesicle to another PI3P-free vesicle
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Human ortholog structural/biochemical evidence for the adaptor role of the WIPI4 group.
- id: PMID:27396362
  title: KIF1A/UNC-104 Transports ATG-9 to Regulate Neurodevelopment and Autophagy at Synapses.
  findings:
  - statement: epg-6 mutants, like atg-2 mutants, accumulate stalled autophagosomes in AIY neurons.
    supporting_text: all lesions in genes for late stages of autophagosome biogenesis and all known
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Uses epg-6 mutants in neurons; consistent with a late biogenesis step.
