id: Q86MP3
gene_symbol: epg-6
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: EPG-6 (ectopic PGL granules 6) is the C. elegans member of the WIPI3/WIPI4 (yeast Hsv2) group
  of PROPPINs, seven-bladed WD40 beta-propeller proteins that bind phosphoinositides. EPG-6 binds PtdIns(3)P
  (and, in vitro, PtdIns(5)P and more weakly PtdIns(4)P and PtdIns(3,5)P2) through a conserved LRRG motif
  and binds ATG-2 directly, forming an ATG-2/EPG-6 complex equivalent to the yeast Atg2-Atg18 and human
  ATG2A-WIPI4 complexes. The complex acts at a late step of autophagosome formation, moving PI3P-positive
  omegasomes on to closed autophagosomes; epg-6 and atg-2 mutants accumulate enlarged early autophagic
  structures and fail to degrade protein aggregates such as PGL granules and SQST-1 during embryogenesis.
  EPG-6 is broadly expressed and cytoplasmic. Its paralog ATG-18 (WIPI1/2 group) also binds PI3P but acts
  at a distinct step. Loss of epg-6 also extends adult lifespan, which may reflect a role outside autophagy.
