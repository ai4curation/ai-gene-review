- source: Alliance_Imported
  text: nphp-1 encodes a novel, SH3 domain-containing protein that is orthologous
    to mammalian nephrocystin-1 (OMIM:607100, mutated in juvenile nephronophthisis);
    nphp-1 along with nphp-4 is required for the proper assembly and structure of
    cilia; both NPHP-1 and NPHP-4 but not NPHP-1 alone is required for the proper
    localization of the IFT-B polypeptide OSM-6, the OSM-3-kinesin, and the BBS proteins
    BBS-7 and BBS-8; NPHP-1 localizes to the transition zone of the cilium in a NPHP-4
    dependant manner and colocalizes with the polycystins LOV-1 and PKD-2 in male-specific
    sensory neurons.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00010898;class=Gene
  source_id: WB:WBGene00010898
  review:
    reviewer: AI
    rubrics:
    - rubric: correctness
      score: 4
    - rubric: utility
      score: 4
    - rubric: compactness
      score: 3
    - rubric: completeness
      score: 4
    - rubric: specificity
      score: 4
    overall_notes: Covers transition-zone localization dependent on NPHP-4, redundancy
      with nphp-4 for OSM-6/OSM-3/BBS localization and colocalization with LOV-1/PKD-2.
      'Novel' is stale.
- source: Alliance_Automated
  text: Involved in several processes, including determination of adult lifespan;
    male mating behavior; and non-motile cilium assembly. Located in several cellular
    components, including ciliary basal body; ciliary base; and ciliary transition
    zone. Is expressed in nervous system and postcloacal sensillum. Used to study
    nephronophthisis. Human ortholog(s) of this gene implicated in Bardet-Biedl syndrome;
    Joubert syndrome 4; Senior-Loken syndrome 1; nephronophthisis; and nephronophthisis
    1. Orthologous to human NPHP1 (nephrocystin 1).
  source_type: automated
