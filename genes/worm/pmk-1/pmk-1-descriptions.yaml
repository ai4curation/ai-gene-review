- source: Alliance_Automated
  text: Enables MAP kinase activity; RNA polymerase II-specific DNA-binding transcription
    factor binding activity; and protein serine kinase activity. Involved in several
    processes, including antifungal innate immune response; defense response to bacterium;
    and regulation of gene expression. Located in cytosol and nucleus. Is expressed
    in several structures, including germ line; head neurons; intestine; and vulval
    precursor cell. Used to study Parkinson's disease and cardiovascular system disease.
    Human ortholog(s) of this gene implicated in colon cancer; colorectal carcinoma;
    nasopharynx carcinoma; and rectum cancer. Orthologous to several human genes including
    MAPK11 (mitogen-activated protein kinase 11) and MAPK14 (mitogen-activated protein
    kinase 14).
