- source: Alliance_Imported
  text: pmk-1 encodes a mitogen-activated protein kinase (MAPK), orthologous to human
    p38 MAPK (OMIM:600289); PMK-1 is an essential component of the MAPK pathway that
    regulates the innate immune response; PMK-1 is required, upstream of CED-9, for
    eliciting gonadal programmed cell death in response to Salmonella enterica infection;
    PMK-1 physically interacts with the ATF-7 transcription factor to regulate the
    transcriptional innate immune response and phosphorylation of ATF-7 is dependent
    upon PMK-1 and SEK-1.
