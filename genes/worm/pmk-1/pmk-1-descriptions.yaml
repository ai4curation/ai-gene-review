descriptions:
- source: UniProt
  text: Serine/threonine kinase which responds to activation by environmental stress
    and pro-inflammatory cytokines by phosphorylating downstream targets (PubMed:11703092,
    PubMed:12142542, PubMed:16166371, PubMed:18394898, PubMed:20369020, PubMed:22308034).
    As part of a MAP kinase signaling pathway, plays a role in modulation of lifespan
    and immunity (PubMed:12142542, PubMed:20369020, PubMed:22216003, PubMed:29748542).
    Phosphorylates skn-1 which probably regulates skn-1 nuclear translocation in response
    to oxidative stress (PubMed:16166371). Probably by activating skn-1, involved
    in the up- regulation of gcs-1 and glutathione-S-transferase gst-4 expression
    upon bacteria infection (PubMed:22216003). Up-regulates expression of gcs-1 in
    intestinal cells upon arsenite treatment (PubMed:16166371, PubMed:25204677). Functions
    downstream of the MAPKK sek-1 and the MAPKKK nsy-1 as the MAP kinase which regulates
    pathogen resistance and responses to oxidative stress (PubMed:11703092, PubMed:12142542,
    PubMed:16166371, PubMed:18394898). Required for expression of antimicrobial peptide
    nlp-29 in response to fungal infection or physical injury (PubMed:18394898). Involved
    in resistance to the nematotoxic C.cinerea galectin (Cgl2) (PubMed:20062796).
    May play a redundant role with other MAP kinases in susceptibility to anoxia,
    downstream of tir-1/nsy-1 (PubMed:21212236). Phosphorylates transcription factor
    rnt-1 during oxidative stress which results in rnt-1 stabilization in the intestine
    (PubMed:22308034). Phosphorylates transcription factor atf-7 during pathogen infection
    resulting in modulation of target genes (PubMed:19497412). Probably downstream
    of nsy-1 and sek-1, involved in germline apoptosis induced by heavy metals, such
    as Cu(2+) (PubMed:19497412). Regulates the basal expression of immune effector
    genes including irg-4, irg-5, mul-1 and drd-50 (PubMed:30668573).
