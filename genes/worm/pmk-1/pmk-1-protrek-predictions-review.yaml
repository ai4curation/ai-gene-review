description: >-
  ProTrek sequence-to-text retrieval for worm pmk-1, the C. elegans p38 MAP kinase and central node
  of the TIR-1/NSY-1/SEK-1/PMK-1 innate immunity cascade. MAP kinase activity (GO:0004707, IDA) and
  protein serine/threonine kinase activity (IDA) are both in GOA and neither appears in the top five;
  rank 4, stress-activated protein kinase signaling cascade, is the closest the retrieval gets to
  the enzymology and it names a pathway rather than an activity. The parallel with rat Mapk1 in the
  same cohort is exact: two CMGC MAP kinases, both with IDA-supported MAP kinase activity, and neither
  retrieves it. Rank 1 is the fourth appearance in this worm set of the same obsolete Gram-negative-defence
  transcription composite (hlh-30 rank 1, atfs-1 rank 4, hsf-1 rank 4, skn-1 rank 1) - it is correct
  for all of them, but the model is emitting one sentence across five unrelated stress and immunity
  genes. The free-text channel returns a p38 comment at 18.98 and, at 18.63, the comment for NSY-1,
  the MAP3K two steps upstream in PMK-1's own cascade. Assessment: 1 correct-not-novel, 2 less precise.
  Assessment: 1 correct not novel (CNN), 2 less precise (LSP).
