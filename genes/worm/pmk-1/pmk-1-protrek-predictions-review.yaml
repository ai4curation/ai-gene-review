    summary: >-
      Rank 2 (score 17.31). GOA holds defense response to Gram-negative bacterium (IGI, IMP); response
      to Gram-negative bacterium is the weaker statement, asserting only that the organism changes
      state on encountering the bacterium rather than that it mounts a defence. Worth noting mechanically:
      the two terms are not connected by is_a in the current ontology, so the overlap analysis scores
      this NO_OVERLAP even though the retrieved call is plainly a less committal version of an existing
      annotation. Closure-based scoring over-credits wrong calls elsewhere in this cohort; here it
      under-credits a correct one.
