- source: Alliance_Automated
  text: Predicted to enable monoatomic cation channel activity. Involved in defecation.
    Predicted to be located in membrane. Predicted to be active in plasma membrane.
    Is expressed in head neurons; intestine; nervous system; and rectal gland cell.
    Human ortholog(s) of this gene implicated in amyotrophic lateral sclerosis-parkinsonism/dementia
    complex 1; cataract; congenital stationary night blindness (multiple); familial
    hyperlipidemia; and musculoskeletal system disease. Orthologous to human TRPM1
    (transient receptor potential cation channel subfamily M member 1); TRPM3 (transient
    receptor potential cation channel subfamily M member 3); and TRPM7 (transient
    receptor potential cation channel subfamily M member 7).
