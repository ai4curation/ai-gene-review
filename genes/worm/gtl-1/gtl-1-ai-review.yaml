  label: Caenorhabditis elegans
description: 'GTL-1 (gon-2-like 1) is one of three TRPM-subfamily (melastatin-related) transient receptor
  potential cation channels in C. elegans, paralogous to GON-2 and GTL-2 and related to vertebrate TRPM1/3/6/7,
  but without a C-terminal kinase domain. In intestinal epithelial cells it carries part of the outwardly
  rectifying, highly Ca2+-selective, Mg2+-permeable plasma-membrane current (I-ORCa) together with GON-2,
  possibly as a heteromer; the two channels are inhibited by PI(4,5)P2 and act with PLCgamma. Expressed
  alone in HEK293 cells, GTL-1 forms a channel activated by cytosolic Ca2+ and downstream of Gq-coupled
  receptors. Through intestinal cation influx GTL-1 supports the rhythmic IP3-dependent Ca2+ oscillations
  that time the defecation motor program, and it is a main route of dietary Mg2+ (and Ni2+) uptake: gtl-1
  mutants are Mg2+-depleted and suppress the Mg2+ overload of gtl-2 and cnnm mutants. In the PVD nociceptor
  neuron GTL-1 amplifies sensory responses, notably to cold.'
