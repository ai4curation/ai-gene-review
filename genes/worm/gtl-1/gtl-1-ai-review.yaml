  - *id007
suggested_questions:
- question: Does GTL-1 co-assemble with GON-2 into a heteromeric intestinal ORCa channel, or do the two
    act as separate homomers whose activities are interdependent?
- question: What is the Ca2+/Mg2+ selectivity of homomeric GTL-1 in a heterologous system, and is it sufficient
    to account for its large in vivo contribution to Mg2+ uptake?
- question: Is GTL-1 localized to the apical (luminal) plasma membrane of intestinal cells, as models
    of dietary Mg2+ uptake assume?
- question: GOA has no annotation from PMID:32009965 (HEK293 expression, calcium-activated channel) or
    PMID:16054081 (Mg2+/Ni2+ uptake); should WormBase curators add calcium-activated cation channel activity
    (IDA) and magnesium ion transmembrane transport?
suggested_experiments:
- description: Endogenous CRISPR GFP knock-in at gtl-1 to determine protein localization in intestine
    (apical vs basolateral) and PVD.
  hypothesis: GTL-1 is an apical plasma-membrane channel in intestinal cells.
- description: Bi-ionic reversal-potential measurements of GTL-1 alone and GTL-1+GON-2 in HEK293 cells,
    with co-immunoprecipitation.
  hypothesis: GTL-1 alone is Ca2+-selective and Mg2+-permeable and co-assembles with GON-2 to reproduce
    I-ORCa properties.
