core_functions:
- description: Ca2+-selective, Mg2+-permeable TRPM cation channel of the plasma membrane, gated by cytosolic
    Ca2+. In the intestinal epithelium it carries part of the I-ORCa Ca2+ influx (with GON-2) and mediates
    dietary Mg2+ uptake; in PVD neurons Ca2+-activation lets it amplify sensory signals.
  molecular_function:
