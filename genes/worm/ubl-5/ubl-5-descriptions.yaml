findings:
- category: gap
  text: No source mentions UBL-5's spliceosome role (SART-1, PRP-38 binding), which
    the review lists as a core function.
  sources:
  - UniProt
  - Alliance_Imported
  - Alliance_Automated
- category: discrepancy
  text: The automated text says UBL-5 enables protein tag activity; the review removes
    this because UBL-5 cannot be conjugated.
  sources:
