descriptions:
- source: UniProt
  text: Involved in the mitochondrial unfolded protein response (mtUPR) (PubMed:17925224).
    Plays a role in modulation of lipid metabolism in response to the citrate-induced
    mtUPR, acting upstream of transcription factor nhr-80 (PubMed:35021096).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P91302
  source_id: P91302
- source: Alliance_Imported
  text: ubl-5 encodes a ubiquitin-like protein orthologous to human ubiquitin-like
    protein UBL5; UBL-5 activity is required for normal mitochondrial morphology as
    well as for assembly of mitochondrial multi-protein complexes; in addition, UBL-5
    is essential for the mitochondrial unfolded protein response (UPRmt); in adult
    animals, ubl-5 is expressed at low levels in most tissues, with slightly higher
    levels seen in the intestine, particularly the posterior region, and the pharynx;
    UBL-5 localizes to the cytosol and to the nucleus, with nuclear levels increased
    upon induction of the UPRmt.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00006726;class=Gene
  source_id: WB:WBGene00006726
- source: Alliance_Automated
  text: Predicted to enable protein tag activity. Involved in mitochondrial unfolded
    protein response. Located in cytosol and nucleus. Part of transcription regulator
    complex. Is expressed in intestine; pharynx; and terminal bulb. Orthologous to
    human UBL5 (ubiquitin like 5).
