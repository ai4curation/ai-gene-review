gene_symbol: bbs-8
organism: worm
uniprot_id: Q23049
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Component of the BBSome complex (By similarity). The BBSome complex is thought
    to function as a coat complex required for sorting of specific membrane proteins
    to the primary cilia (By similarity). The BBSome complex is required for ciliogenesis
    but is dispensable for centriolar satellite function (By similarity). Required
    for proper BBSome complex assembly and its ciliary localization (PubMed:22922713).
    Required for cilia biogenesis and both the assembly and movement of intraflagellar
    transport proteins along the ciliary axoneme (PubMed:15231740, PubMed:17000880,
    PubMed:22022287, PubMed:22922713, PubMed:27930654). Plays a role in guanylyl cyclase
    localization in the ring-like structures at the base of the finger compartment
    in AFD sensory neurons (PubMed:25335890).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q23049
  source_id: Q23049
- source: Alliance_Imported
  text: bbs-8 encodes a tetratricopeptide repeat (TPR)-containing protein that is
    orthologous to the human Bardet-Biedl syndrome protein, BBS8; in C. elegans, bbs-8
    activity is required for cilia biogenesis and function; accordingly, bbs-8 mutant
    animals display odorant chemotaxis defects and exhibit both aberrant motility
    and abnormal localization of at least two intraflagellar transport (IFT) protein
    markers; bbs-8 is also required for the proper regulation of insulin secretion;
    bbs-8, bbs-5, bbs-1, and bbs-9 mutants along with ciliary phenotypes show an increased
    secretion of insulin, biogenic amines and neuropeptides, which requires the Rab27/AEX-6
    dense-core vesicle exocytosis machinery; a BBS-8::GFP translational fusion is
    expressed exclusively in ciliated head and tail neurons, where it localizes predominantly
    to the base of cilia, known as the ciliary transition zone; bbs gene expression
    is regulated by the DAF-19 RFX-type transcription factor.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00000244;class=Gene
  source_id: WB:WBGene00000244
- source: Alliance_Automated
  text: Involved in several processes, including cilium organization; olfactory learning;
    and positive regulation of intracellular transport. Located in several cellular
    components, including ciliary basal body; ciliary base; and dendrite terminus.
    Is expressed in head and nervous system. Used to study Bardet-Biedl syndrome and
    ciliopathy. Human ortholog(s) of this gene implicated in Bardet-Biedl syndrome;
    Bardet-Biedl syndrome 8; and retinitis pigmentosa 51. Orthologous to human TTC8
    (tetratricopeptide repeat domain 8).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00000244;class=Gene
  source_id: WB:WBGene00000244
