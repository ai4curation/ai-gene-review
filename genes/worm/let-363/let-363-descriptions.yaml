descriptions:
- source: UniProt
  text: Serine/threonine-protein kinase that regulates the mRNA translation machinery,
    probably by modulating the activity of translation factors such as eIF-4G and
    eIF-2 (PubMed:12225660). It may have some protein kinase activity instead of lipid
    kinase activity (PubMed:12225660). May play a role in P-granule degradation by
    autophagy in somatic cells during embryogenesis (PubMed:19377305). Required, during
    larval development, for the establishment of the proper number of germline progenitors,
    probably upstream of rsks-1 and ife-1 (PubMed:22278922). Required for larval development
    (PubMed:22278922). May act as a mediator of lifespan regulation by insulin signaling
    and nutrient sensing (PubMed:14668850, PubMed:28853436).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q95Q95
  source_id: Q95Q95
- source: Alliance_Automated
  text: Enables protein serine/threonine kinase activity. Involved in several processes,
    including TOR signaling; box C/D snoRNP assembly; and determination of adult lifespan.
    Located in cytoplasm. Part of TORC1 complex and TORC2 complex. Is expressed in
    several structures, including intestine; muscle cell; neurons; pharynx; and vulva.
    Human ortholog(s) of this gene implicated in several diseases, including diabetes
    mellitus (multiple); epilepsy; kidney disease (multiple); lung disease (multiple);
    and prostate cancer. Orthologous to human MTOR (mechanistic target of rapamycin
    kinase).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00002583;class=Gene
  source_id: WB:WBGene00002583
