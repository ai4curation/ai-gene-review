id: Q95Q95
gene_symbol: let-363
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: 'let-363 encodes CeTOR, the single Caenorhabditis elegans ortholog of the target of rapamycin
  (TOR/mTOR). It is a large PI3K-related protein kinase (PIKK) with N-terminal HEAT repeats, FAT, FRB
  (FKBP12-rapamycin binding), kinase and FATC domains. LET-363 is the catalytic subunit of two complexes:
  TORC1, with DAF-15/Raptor, and TORC2, with RICT-1/Rictor. Semaphorin-plexin signalling can shift the
  balance between them. TORC1 phosphorylates Ser/Thr residues on substrates such as EPG-3, ALY-2, RSP-6
  and VAV-1. It couples nutrient and lipid (d17iso-glucosylceramide) signals to growth by promoting mRNA
  translation and ribosome biogenesis and by restraining autophagy. Loss of let-363 causes L3 larval arrest
  with intestinal atrophy and gonadal degeneration, and reduced let-363 activity in adults extends lifespan.
  TORC2 acts through SGK-1 in embryonic, male tail and metabolic contexts. LET-363 is expressed ubiquitously
  and acts in the cytoplasm; a nuclear location has also been reported.'
