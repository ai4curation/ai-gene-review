    label: nematode larval development
  evidence_type: IMP
  original_reference_id: PMID:12150926
  qualifier: involved_in
  review:
    summary: let-363 loss of function (mutation or RNAi) causes larval arrest at mid-to-late L3, with
      gonadal degeneration and intestinal atrophy.
    action: KEEP_AS_NON_CORE
    reason: Larval arrest is a well-replicated loss-of-function phenotype, and TOR-dependent growth signalling
      is needed for larval progression. It is a pleiotropic consequence of losing the central growth kinase
      rather than a specific developmental activity, so the row is kept as non-core. The cached Hara et
      al. 2002 entry is abstract-only; the abstract compares raptor RNAi phenotypes with Ce-TOR inactivation.
      The curator had the full text, so the row is not second-guessed.
    supported_by:
