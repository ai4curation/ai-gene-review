      upstream of SGK-1 in embryonic and male-tail contexts. LET-363 is the catalytic subunit, so it does
      the kinase step of this signalling.
    supported_by:
    - *id009
    - *id012
- term:
    id: GO:0044877
    label: protein-containing complex binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR009076
  - InterPro:IPR036738
  review:
    summary: InterPro2GO mapping from the FRB domain (IPR009076/IPR036738) to protein-containing complex
      binding.
    action: MARK_AS_OVER_ANNOTATED
    reason: The FRB domain binds the FKBP12-rapamycin complex, which is a drug-dependent interaction,
      and in mammals it also contacts some substrates. 'Protein-containing complex binding' captures neither
      a physiological activity nor TOR's role inside TORC1/TORC2, which the complex CC terms already record.
      No worm evidence shows LET-363 binding a pre-formed complex. The domain-to-term mapping is therefore
      an over-annotation.
