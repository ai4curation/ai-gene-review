- term:
    id: GO:0000492
    label: box C/D snoRNP assembly
  evidence_type: IMP
  original_reference_id: PMID:18804378
  qualifier: involved_in
  supporting_entities:
  - WB:WBVar00146434
  review:
    summary: let-363 RNAi lowers FIB-1 levels and leaves FIB-1 in the nucleoplasm and nucleolar periphery
      instead of the nucleolus. Sheaffer et al. infer that CeTOR promotes box C/D snoRNP accumulation
      in nucleoli.
    action: MARK_AS_OVER_ANNOTATED
    reason: The experiment measures FIB-1 abundance and nucleolar localization after TOR knockdown, a
      downstream readout of reduced growth signalling. Starvation produces the same change. LET-363 is
      a kinase acting upstream; nothing shows that it binds snoRNP components or does any step of snoRNP
      assembly. RUVB-1 is the protein in this paper with an assembly role. The annotation records an indirect
      effect of TOR signalling on ribosome biogenesis as direct participation in snoRNP assembly. GO has
      no 'regulation of box C/D snoRNP assembly' term (OLS search) to move it to.
    supported_by:
    - &id008
      reference_id: PMID:18804378
      supporting_text: Inactivation of let-363/TOR produced similar defects, with low levels of FIB-1,
        which were localized to the nucleoplasm and nucleolar periphery
    - reference_id: PMID:18804378
      supporting_text: We analyzed worms that had undergone eight hours starvation and observed that FIB-1
        levels were reduced and restricted to the nucleoplasm
- term:
