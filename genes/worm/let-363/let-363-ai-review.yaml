- description: 'Catalytic subunit of TORC1 (with DAF-15/Raptor). Phosphorylates Ser/Thr residues on substrates
    and couples nutrient and lipid signals to growth: it promotes translation and ribosome biogenesis
    and restrains autophagy.'
