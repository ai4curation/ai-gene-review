suggested_questions:
- question: Is the reduced nucleolar FIB-1 after let-363 knockdown a direct TORC1 output (e.g., via phosphorylation
    of a snoRNP assembly factor such as RUVB-1) or a secondary consequence of reduced growth signalling?
    The answer decides whether any snoRNP-related process term is appropriate.
- question: 'Where does LET-363 reside in worm cells: is TORC1 recruited to lysosomes by RAGA-1/RAGC-1
    as in mammals, and is the reported nuclear pool functional?'
suggested_experiments:
- description: Endogenously tag LET-363 (CRISPR) and image it with lysosomal (LMP-1) and nuclear markers
    under fed and starved conditions and after raga-1 loss, to define where TORC1 acts.
- description: Kinase-dead let-363 knock-in allele, to separate catalytic from scaffolding roles in larval
    development, translation and lifespan.
