descriptions:
- source: Alliance_Imported
  text: hsp-16.11 encodes a 16-kD heat shock protein (HSP) that is a member of the
    hsp16/hsp20/alphaB-crystallin (HSP16) family of heat shock proteins, and that
    is identical to the protein encoded by hsp-16.1; hsp-16.11 expression is induced
    in response to heat shock or other environmental stresses; HSP-16.11 is likely
    to function as passive ligand temporarily preventing unfolded proteins from aggregating;
    HSP-16.11 has been shown to interact with intracellular human beta amyloid peptide,
    a primary component of the extracellular plaques found in Alzheimer's disease.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00002017;class=Gene
  source_id: WB:WBGene00002017
- source: Alliance_Automated
  text: Predicted to enable unfolded protein holdase activity. Involved in defense
    response to Gram-negative bacterium; endoplasmic reticulum unfolded protein response;
    and response to heat. Located in Golgi medial cisterna. Orthologous to human HSPB9
    (heat shock protein family B (small) member 9).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00002017;class=Gene
  source_id: WB:WBGene00002017
- source: RefSeq
  text: Predicted to enable unfolded protein binding activity. Involved in defense
    response to Gram-negative bacterium; endoplasmic reticulum unfolded protein response;
    and response to heat. Located in Golgi medial cisterna. Is expressed in several
    structures, including coelomocyte; enteric muscle; intestine; pharynx; and ventral
    nerve cord. Used to study neurodegenerative disease. Orthologous to human HSPB9
    (heat shock protein family B (small) member 9). [provided by Alliance of Genome
    Resources, Jun 2026]
  source_type: automated
