  text: Predicted to enable unfolded protein binding activity. Involved in defense
    response to Gram-negative bacterium; endoplasmic reticulum unfolded protein response;
    and response to heat. Located in Golgi medial cisterna. Is expressed in several
    structures, including coelomocyte; enteric muscle; intestine; pharynx; and ventral
    nerve cord. Used to study neurodegenerative disease. Orthologous to human HSPB9
    (heat shock protein family B (small) member 9). [provided by Alliance of Genome
