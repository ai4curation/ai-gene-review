proposed_new_terms:
- proposed_name: holdase chaperone activity
  proposed_definition: Binding to an unfolded or misfolded protein to prevent its aggregation without
    actively catalyzing refolding. The holdase maintains the client protein in a soluble, folding-competent
    state. This is mechanistically distinct from foldase activity (GO:0044183) and from carrier-holdase
    activity (GO:0140309).
  justification: 'hsp-16.1: an alpha-crystallin-domain small HSP of the C. elegans HSP-16 family; the
    paralogue HSP-16.2 suppresses thermal aggregation of citrate synthase ATP-independently. Obsolete
    GO:0051082 captured binding only; GO:0044183 requires assisting folding, and GO:0140309 (relabelled
    ''unfolded protein holdase activity'') keeps a carrier-specific definition requiring escort to an
    acceptor molecule or location, which is not demonstrated here. See go-ontology#30552.'
  proposed_parent:
    id: GO:0003674
    label: molecular_function
  supported_by:
  - reference_id: PMID:9305934
    supporting_text: both wild-type and C-terminally-truncated HSP16-2 can function as molecular chaperones
      by suppressing the thermally-induced aggregation of citrate synthase
suggested_questions:
- question: Do HSP-16.1/16.2 (one subclass) and HSP-16.41/16.48 (the other subclass) form mixed oligomers
    in vivo, and do they differ in client range?
- question: Does the HSP-16 family hand clients to the inducible HSP70s (HSP-70, F44E5.4/5) for refolding,
    or primarily route them to sequestration/degradation?
- question: How does Golgi-localized HSP-16.1 cooperate with PMR-1 mechanistically - does it chaperone
    PMR-1 itself under heat stress?
suggested_experiments:
- description: Purify recombinant HSP-16.1 and test ATP-independent suppression of thermal aggregation
    of model clients (citrate synthase, luciferase), alone and with HSP-70 + DNJ-13 to measure hand-off
    refolding.
  hypothesis: HSP-16.1 is an ATP-independent holdase whose bound clients can be refolded by the worm HSP70/HSP40
    system.
