  label: Caenorhabditis elegans
description: HSP-16.1 is a heat-inducible small heat shock protein (sHSP) of the alpha-crystallin/HSP20
  family, encoded by two identical genes, hsp-16.1 (T27E4.8) and hsp-16.11 (T27E4.2), which form the arms
  of an inverted repeat on chromosome V where each is paired head-to-head with hsp-16.48 or hsp-16.49.
  HSP-16.1 belongs to the same sHSP subclass as HSP-16.2. Like the other HSP-16 proteins it is not expressed
  under normal conditions and is strongly induced by heat (and by hypoxia and oxidative stress) through
  HSF-1 and heat shock elements in the shared intergenic promoter. It acts as an ATP-independent holdase
  chaperone that binds unfolding proteins to prevent aggregation and keep them competent for refolding;
  HSP-16 proteins co-immunoprecipitate and co-localize with intracellular amyloid-beta in transgenic worms.
  A pool of HSP-16.1 localizes to the Golgi, where it works with the Ca2+/Mn2+ pump PMR-1 to maintain
  Ca2+ homeostasis and mediates the protection of neurons against heat-stroke-induced necrosis conferred
  by thermal preconditioning. HSF-1-dependent sHSPs are also required for resistance to Gram-negative
  pathogens.
