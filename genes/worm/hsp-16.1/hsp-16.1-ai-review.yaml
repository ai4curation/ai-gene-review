core_functions:
- description: 'Heat-inducible ATP-independent holdase chaperone: binds unfolding proteins through its
    alpha-crystallin domain to prevent aggregation during heat stress; a Golgi-associated pool acts with
    PMR-1 to preserve Ca2+ homeostasis and protect neurons from heat-stroke-induced necrosis.'
  proposed_molecular_function: holdase chaperone activity
