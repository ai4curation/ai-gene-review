id: Q9XX00
gene_symbol: sbp-1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: >-
  sbp-1 (also published as lpd-1) encodes the single Caenorhabditis elegans ortholog of the
  sterol regulatory element-binding proteins (SREBPs). It is a 1113-residue bHLH-leucine-zipper
  transcription factor with an N-terminal acidic activation region, a central bHLH DNA-binding
  domain and two predicted transmembrane helices; by analogy to mammalian SREBP-1 the
  full-length precursor is held in the endoplasmic reticulum membrane and proteolytic release
  of the N-terminal fragment allows it to enter the nucleus. Nuclear SBP-1 acts with the
  Mediator subunit MDT-15 (ARC105/MED15) to activate lipogenic genes, including acetyl-CoA
  carboxylase, fatty acid synthase, the elongases elo-5 and elo-6 (needed for monomethyl
  branched-chain fatty acids), and the delta-9 desaturases fat-5, fat-6 and fat-7. It is
  expressed most strongly in the intestine and also in neurons and glia. Loss of sbp-1 gives
  pale, lipid-depleted, slow-growing animals with altered fatty acid composition. Its nuclear
  activity is modulated by nutrient and metabolic cues, rising when S-adenosylmethionine or
  phosphatidylcholine synthesis is limited and when oxygen is low, and falling when zinc is
  reduced. In amphid sheath glia, Golgi-dependent control of SBP-1 activation restrains cell
  growth through long-chain polyunsaturated fatty acid synthesis.
