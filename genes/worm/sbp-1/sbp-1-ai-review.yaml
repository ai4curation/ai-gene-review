- term:
    id: GO:0001676
    label: long-chain fatty acid metabolic process
  evidence_type: IMP
  original_reference_id: PMID:15340492
  qualifier: involved_in
  review:
    summary: >-
      lpd-1 (sbp-1) RNAi changes fatty acid composition, lowering mmBCFAs and other
      very-long-chain fatty acids; elo-5 and elo-6 elongase reporters are down-regulated.
    action: MODIFY
    reason: >-
      The phenotype is real, but SBP-1 does not perform any step of fatty acid metabolism;
      it is a transcription factor that drives expression of the elongases and other
      lipogenic enzymes. The process it takes part in is the positive regulation of fatty
      acid biosynthesis, which is the GO convention for transcriptional regulators of
      metabolic pathways. Replacement GO:0045723 positive regulation of fatty acid
      biosynthetic process.
    proposed_replacement_terms:
    - id: GO:0045723
      label: positive regulation of fatty acid biosynthetic process
    supported_by:
    - reference_id: PMID:15340492
      supporting_text: >-
        LPD-1 is important for production of mmBCFAs as well as other very-long-chain FAs,
        whereas LPD-2 has no specificity for any particular type of FA.
    - reference_id: PMID:15340492
      supporting_text: >-
        They have also shown that lpd-1 regulates the expression of several lipogenic
        enzymes, acetyl-CoA carboxilase (ACC), FAS, and glycerol 3-phosphate
        acyltransferase (G3PA)
