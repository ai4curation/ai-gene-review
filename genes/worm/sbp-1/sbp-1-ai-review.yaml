  review:
    summary: >-
      Phylogenetic inference from the SREBP clade (human SREBF1/SREBF2, mouse and rat
      orthologs) that the family binds sterol regulatory elements and E-box sequences in
      RNA polymerase II promoters.
    action: ACCEPT
    reason: >-
      SBP-1 is the single nematode SREBP and retains a canonical bHLH domain (PROSITE
      PS50888), so it sits inside the PAINT clade in which sequence-specific promoter DNA
      binding was placed. Worm evidence is consistent: Grove et al. profiled DNA-binding
      specificity of the C. elegans bHLH family, and SBP-1 is required for transcription of
      defined target genes. No evidence of divergence or loss.
    supported_by:
    - reference_id: file:worm/sbp-1/sbp-1-uniprot.txt
      record_section: ["DR:InterPro"]
      supporting_text: InterPro; IPR011598; bHLH_dom.
