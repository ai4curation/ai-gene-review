    label: endoplasmic reticulum membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  supporting_entities:
  - UniProtKB-SubCell:SL-0097
  review:
    summary: >-
      UniProt subcellular-location mapping for the unprocessed precursor to the ER membrane.
    action: ACCEPT
    reason: >-
      Two independent lines agree: SBP-1 has the two predicted transmembrane helices that
      anchor SREBP precursors as an ER hairpin, and the SREBP family is retained in the ER
      membrane before Golgi processing. The worm precursor has not been imaged in the ER in
      the cached literature, but the Golgi-localised RNF-145 / EAS-1 control of SBP-1
      activation (PMID:33370778) fits the canonical ER-to-Golgi activation route. This is the
      location of the inactive precursor and underlies its regulation.
    supported_by:
    - reference_id: file:worm/sbp-1/sbp-1-uniprot.txt
      record_section: ["FT:TRANSMEM"]
      supporting_text: TRANSMEM        541..561
    - reference_id: PMID:33370778
      supporting_text: >-
        These data suggest that RNF-145 inhibits SBP-1 activation while in the cis-Golgi
        during early stages of development for faster AMsh growth
