core_functions:
- description: >-
    Nuclear SBP-1 is a bHLH-Zip, RNA polymerase II-specific DNA-binding transcription factor
    that, together with the Mediator coactivator subunit MDT-15, activates transcription of
    lipogenic genes (ACC, FAS, elo-5/elo-6 elongases, fat-5/fat-6/fat-7 delta-9
    desaturases), thereby promoting fatty acid synthesis (including monomethyl
    branched-chain and polyunsaturated fatty acids) and fat storage.
  molecular_function:
    id: GO:0000981
    label: DNA-binding transcription factor activity, RNA polymerase II-specific
  directly_involved_in:
  - id: GO:0045944
    label: positive regulation of transcription by RNA polymerase II
  - id: GO:0045723
    label: positive regulation of fatty acid biosynthetic process
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:16799563
    supporting_text: >-
      both SBP-1 and MDT-15 control transcription of genes governing desaturation of
      stearic acid to oleic acid
  - reference_id: PMID:15340492
    supporting_text: >-
      They have also shown that lpd-1 regulates the expression of several lipogenic
      enzymes, acetyl-CoA carboxilase (ACC), FAS, and glycerol 3-phosphate
      acyltransferase (G3PA)
  - reference_id: PMID:22035958
    supporting_text: >-
      Indeed, GFP∷SBP-1 showed increased nuclear accumulation after sams-1 RNAi (Figure
      2E), suggesting that levels of transcriptionally active SBP-1 are increased.
suggested_questions:
- question: >-
    How is SBP-1 proteolytically activated in C. elegans? Are there functional SCAP, INSIG,
    S1P and S2P orthologs, and does the worm precursor reside in the ER membrane as its two
    predicted transmembrane helices suggest?
- question: >-
    Does SBP-1 bind sterol regulatory elements, E-boxes, or both at the promoters of elo-5,
    elo-6, fat-5, fat-6 and fat-7 in vivo, and which of its reported targets (e.g. wdr-5.1)
    are direct?
- question: >-
    Should the WormBase lifespan IMP (PMID:16799563) be retained? The abstract describes
    oleate-rescuable defects but no lifespan assay.
suggested_experiments:
- description: >-
    ChIP-seq or CUT&RUN with an endogenously tagged SBP-1 in intestine, combined with RNA-seq
    after auxin-induced degradation, to define direct target genes and binding motifs.
  hypothesis: SBP-1 directly binds the promoters of elongase and delta-9 desaturase genes.
- description: >-
    Image an endogenously tagged full-length SBP-1 with ER and Golgi markers, and test
    whether cleavage of the precursor depends on S1P/S2P protease orthologs.
  hypothesis: The SBP-1 precursor is an ER-membrane protein activated by Golgi proteolysis as in mammals.
