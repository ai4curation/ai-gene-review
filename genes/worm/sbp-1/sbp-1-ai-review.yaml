      phenotype-pale, skinny, larval-arrested worms that lack fat stores.
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Abstract-only cache. First functional description of the worm SREBP (named lpd-1);
      target-gene results are cited in the full-text PMID:15340492.
- id: PMID:15340492
  title: Monomethyl branched-chain fatty acids play an essential role in Caenorhabditis
    elegans development.
  findings:
  - statement: SBP-1 (LPD-1) is needed for normal levels of mmBCFAs and other very-long-chain fatty acids.
    supporting_text: >-
      LPD-1 is important for production of mmBCFAs as well as other very-long-chain FAs,
      whereas LPD-2 has no specificity for any particular type of FA.
  - statement: The elongases elo-5 and elo-6 are likely transcriptional targets of SBP-1.
    supporting_text: >-
      elo-5 and elo-6 transcription is downregulated in the absence of lpd-1 suggests that
      elo-5 and elo-6 are likely to be the targets of lpd-1
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text read. The gene is called lpd-1 throughout (Y47D3B.7), identical to sbp-1.
      Target-gene evidence is reporter-based (promoter-GFP), not direct binding.
