    label: protein dimerization activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR011598
  - InterPro:IPR036638
  review:
    summary: InterPro2GO mapping from the bHLH domain to protein dimerization.
    action: KEEP_AS_NON_CORE
    reason: >-
      bHLH(-Zip) factors bind DNA as dimers, so dimerization is true and inherent to the
      domain, but it is a supporting property of the DNA-binding transcription factor
      activity rather than a separate function. The partner (homodimer vs heterodimer) is
      not established for SBP-1, so no more specific term is warranted.
