descriptions:
- source: UniProt
  text: 'Transcription factor involved in maintaining normal fat levels (PubMed:19187779).
    Regulates the expression of genes involved in lipid metabolism in response to
    nutrient availability, such as the fatty-acid desaturases fat-5, fat-6 and fat-7
    (PubMed:12530969, PubMed:19936816). In response to a high-glucose diet, promotes
    fatty acid synthesis, elongation and desaturation, acting in concert with transcription
    factor mxl-3 (PubMed:29113111). Plays a role in synthesis of monomethyl branched-chain
    fatty acids (mmBCFAs) as well as other very-long-chain fatty acids (PubMed:15340492).
    Downstream of the cis- Golgi membrane protein eas-1/GOLT1B and the E3 ubiquitin
    ligase rnf- 145/RNF145, plays a role in the regulation of glial size, perhaps
    by modulating synthesis of long-chain polyunsaturated fatty-acids (LC- PUFA) (PubMed:33370778).
    Modulates expression of genes in the one- carbon cycle, which produces the methyl
    donor S-adenosylmethionine (SAM) (PubMed:22035958). Probably involved in a feedback
    loop in which decreased levels of SAM lead to increased transcriptional activity
    of sbp-1, thereby causing lipid accumulation (PubMed:22035958). Involved in the
    negative regulation of zinc homeostasis (PubMed:28710073). Involved in the response
    to simulated microgravity, in concert with Mediator complex subunit mdt-15, probably
    acting in the intestine (PubMed:32448509). Plays a role in transgenerational lipid
    accumulation in response to a high-fat diet, probably acting by up-regulating
    wdr-5.1 expression to increase the level of trimethylated ''Lys-4'' histone H3
    (H3K4me3), which may then induce the expression of fat-5, fat-6 and fat-7 (PubMed:35140229).
    May act as an oxygen sensor for lipid metabolism (PubMed:19187779). . [Sterol
    regulatory element binding protein sbp-1]: Precursor of the transcription factor
    form, which is embedded in the endoplasmic reticulum membrane (By similarity).
    Processing of this form allows release of the transcription factor form that translocates
    into the nucleus and activates transcription of genes involved in sterol biosynthesis
    and lipid homeostasis (By similarity). . [Processed sterol regulatory element
    binding protein sbp-1]: Key transcription factor that regulates expression of
    genes involved in sterol biosynthesis and lipid homeostasis.'
