  source_id: Q9XX00
- source: Alliance_Imported
  text: sbp-1 encodes a basic helix-loop-helix (bHLH) transcription factor homologous
    to the mammalian Sterol Regulatory Element Binding Proteins (SREBPs, OMIM:184756,
    overexpression of nuclear form of SREBP-1c is associated with insulin resistance
    and features of congenital generalized lipodystrophy); in C. elegans, SBP-1 activity
    is required for normal lipid metabolism and wild-type levels of lipogenic enzyme
    expression, as well as for embryonic and larval development; in addition, sbp-1
    is required for mediating the lipid accumulation and increased body width/length
    ratio that occurs in response to oxygen deprivation; sbp-1 expression is detected
    in the intestine, the major site of fat storage, from early embryogenesis through
    adulthood and also in the amphid neurons.
