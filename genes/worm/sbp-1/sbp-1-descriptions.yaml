- source: Alliance_Automated
  text: Enables DNA-binding transcription factor activity. Involved in several processes,
    including cellular response to zinc ion; fatty acid metabolic process; and regulation
    of gene expression. Located in nucleus. Is expressed in several structures, including
    head; intestine; and terminal bulb. Used to study alcohol use disorder. Human
    ortholog(s) of this gene implicated in several diseases, including alopecia; artery
    disease (multiple); glucose metabolism disease (multiple); prostate cancer; and
    vascular dementia. Orthologous to several human genes including SREBF2 (sterol
    regulatory element binding transcription factor 2).
