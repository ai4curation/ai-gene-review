descriptions:
- source: Alliance_Imported
  text: rab-5 encodes the C. elegans Rab5 GTPase ortholog; RAB-5 activity is required
    for receptor-mediated yolk endocytosis and for phagosome maturation involved in
    apoptotic cell clearance; rab-5 mutations also affect localization of P granules
    and PAR-2, as well as the cytoplasmic appearance of cells in the early embryo
    and larval development; RAB-5 localizes to early endosomes and maturing phagosomes.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00004268;class=Gene
  source_id: WB:WBGene00004268
