gene_symbol: rab-5
organism: worm
uniprot_id: P91857
taxon_id: NCBITaxon:6239
descriptions:
- source: Alliance_Imported
  text: rab-5 encodes the C. elegans Rab5 GTPase ortholog; RAB-5 activity is required
    for receptor-mediated yolk endocytosis and for phagosome maturation involved in
    apoptotic cell clearance; rab-5 mutations also affect localization of P granules
    and PAR-2, as well as the cytoplasmic appearance of cells in the early embryo
    and larval development; RAB-5 localizes to early endosomes and maturing phagosomes.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00004268;class=Gene
  source_id: WB:WBGene00004268
- source: Alliance_Automated
  text: Enables GTPase activating protein binding activity and GTPase activity. Involved
    in several processes, including apical protein localization; endocytosis; and
    secretion by cell. Located in cell cortex; cytoplasmic vesicle; and periciliary
    membrane compartment. Is active in cholinergic synapse. Is expressed in several
    structures, including ventral cord neurons. Orthologous to several human genes
    including RAB5C (RAB5C, member RAS oncogene family).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00004268;class=Gene
  source_id: WB:WBGene00004268
