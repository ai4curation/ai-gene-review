    - rubric: specificity
      score: 4
    overall_notes: Correct yolk endocytosis, phagosome maturation in corpse clearance,
      P granule/PAR-2 effects and early endosome localization.
- source: Alliance_Automated
  text: Enables GTPase activating protein binding activity and GTPase activity. Involved
    in several processes, including apical protein localization; endocytosis; and
    secretion by cell. Located in cell cortex; cytoplasmic vesicle; and periciliary
    membrane compartment. Is active in cholinergic synapse. Is expressed in several
    structures, including ventral cord neurons. Orthologous to several human genes
    including RAB5C (RAB5C, member RAS oncogene family).
  source_type: automated
