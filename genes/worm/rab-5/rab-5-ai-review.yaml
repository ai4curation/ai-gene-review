id: P91857
gene_symbol: rab-5
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: 'RAB-5 is the Caenorhabditis elegans ortholog of the Rab5 subfamily of small GTPases. It
  cycles between a GDP-bound inactive and a GTP-bound active state: the Vps9-domain exchange factors RME-6
  (at clathrin-coated pits) and RABX-5/Rabex-5 (on early endosomes) activate it, and the TBC-domain GAP
  TBC-2 stimulates its GTP hydrolysis. Active RAB-5 resides on early endosome membranes, where it recruits
  effectors including the PI3K complex that generates endosomal PtdIns3P, and it is replaced by RAB-7
  during early-to-late endosome conversion under the control of SAND-1/Mon1. RAB-5 is required for receptor-mediated
  endocytosis of yolk by oocytes and for delivery of endocytic cargo to early endosomes; loss of function
  is embryonic lethal. It is also recruited to phagosomes containing apoptotic cell corpses and promotes
  their maturation upstream of RAB-7, and it labels the periciliary membrane compartment of sensory neurons.
  In motor neurons RAB-5 acts with RAB-10 at the Golgi-endosomal interface for the formation of release-competent
  dense core vesicles. Depletion also perturbs cortical PAR protein dynamics and polarity in the one-cell
  embryo.'
