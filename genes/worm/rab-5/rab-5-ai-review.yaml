  title: WormBase gene description for rab-5 (worm)
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: WormBase curated description. The claims checked are correct. Rab5
      orthology and the requirement for receptor-mediated yolk endocytosis agree
      with PMID:10588660. The phagosome maturation role in apoptotic cell clearance
      agrees with PMID:20921409. The PAR-2 cortical defect agrees with PMID:22545101,
      and early endosome localization is consistent with the review. The P granule
      localization phenotype was not checked. The text names no regulators. It omits
      the GEFs RME-6 and RABX-5 (PMID:15895077), the GAP TBC-2 (PMID:20462958) and
      the SAND-1-controlled switch from RAB-5 to RAB-7 (PMID:20434987). These are
      in the review, so the omission is noted here and not recorded as a defect.
core_functions:
- description: 'Rab5 molecular switch on early endosome membranes: activated by RME-6 and RABX-5, inactivated
    by TBC-2, and in its GTP-bound form drives uptake and delivery of endocytosed cargo, including RME-2-mediated
    yolk endocytosis by oocytes, to early endosomes.'
