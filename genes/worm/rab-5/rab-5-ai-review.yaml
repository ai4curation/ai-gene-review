suggested_questions:
- question: Is GO:0032794 GTPase activating protein binding (partner RME-6) intended to capture the RME-6
    interaction? RME-6 binds GDP-RAB-5 through its Vps9 GEF domain; would a GEF-binding term, or modelling
    RAB-5 as has_input of RME-6 GEF activity, be more appropriate?
- question: Does RAB-5 act in DCV biogenesis in the neuronal cell body only, or is it also present and
    required at cholinergic synapses, as the SynGO annotations imply?
- question: Should RAB-5 carry early endosome to late endosome transport, given that in worms it is the
    GTPase being replaced during Rab conversion (SAND-1/TBC-2 act on it) rather than an established executor
    of the transport step?
suggested_experiments:
- description: Measure intrinsic and RME-6- or RABX-5-stimulated nucleotide exchange on recombinant RAB-5,
    and test whether the RME-6 RasGAP-like domain has any GAP activity on RAB-5 or other Ras/Rab GTPases.
- description: Use neuron-specific auxin-inducible degradation of endogenously tagged RAB-5 with DCV cargo
    reporters to separate a somatic DCV-sorting role from any synaptic role.
