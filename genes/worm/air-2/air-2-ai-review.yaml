id: O01427
gene_symbol: air-2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: AIR-2 is the single Aurora B-type serine/threonine protein kinase of Caenorhabditis elegans
  and the catalytic subunit of the chromosomal passenger complex (CPC), together with ICP-1 (INCENP),
  BIR-1 (survivin) and CSC-1. ICP-1 binds and strongly activates AIR-2, and AIR-2 in turn phosphorylates
  ICP-1 in a positive feedback loop; CSC-1 and BIR-1 target the kinase. AIR-2 sits on meiotic and mitotic
  chromosomes before anaphase (in meiosis restricted to the mid-bivalent and sister-chromatid interfaces),
  then moves to the central spindle (spindle midzone) and persists at the midbody. On chromosomes it phosphorylates
  histone H3 and the meiotic cohesin REC-8, promoting the stepwise release of meiotic cohesion and correct
  mitotic and meiotic chromosome segregation; it is also needed for condensin loading. At the central
  spindle it binds and phosphorylates the kinesins ZEN-4/MKLP1 and BMK-1 and recruits them to the spindle,
  driving spindle midzone assembly and completion of cytokinesis; loss of AIR-2 lets cleavage furrows
  form and then regress. Its activity is stimulated by TLK-1 and restrained by CDC-48.3, PP1 and LAB-1.
