      localization of ZEN-4, and cytokinesis
- description: After anaphase onset the CPC kinase relocates to the central spindle and midbody, where
    AIR-2 binds and phosphorylates the kinesins ZEN-4/MKLP1 and BMK-1, recruits them to the spindle, drives
    spindle midzone assembly in mitosis and meiosis, and is required for completion of cytokinesis.
