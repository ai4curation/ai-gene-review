suggested_questions:
- question: Does AIR-2 directly phosphorylate histone H3 Ser10 in vitro? The existing histone H3 kinase
    IDA/IMP rows cite a TLK-1 transcription paper (PMID:14614817) whose abstract does not mention AIR-2;
    if a Ser10 assay exists, GO:0035175 histone H3S10 kinase activity would be the more precise term.
- question: Does AIR-2 contribute to spindle assembly checkpoint signalling or to mitotic sister chromatid
    separation in C. elegans, as the ComplexPortal annotations assert by analogy?
- question: Are the centrosome and spindle pole IBA annotations an over-propagation from an Aurora A node
    to the Aurora B clade, and should the PAINT node placement be revisited?
suggested_experiments:
- description: Express a kinase-dead or analog-sensitive AIR-2 from the endogenous locus and inhibit it
    acutely after anaphase onset, scoring midzone assembly, ZEN-4 phosphorylation and furrow stability.
  hypothesis: AIR-2 kinase activity at the central spindle, separate from its earlier chromosomal role,
    is required for completion of cytokinesis.
- description: Measure mitotic delay after auxin-induced degradation of AIR-2 in a background with unattached
    kinetochores (for example monopolar spindles).
  hypothesis: AIR-2 is needed for full spindle assembly checkpoint signalling in C. elegans.
