core_functions:
- description: Catalytic subunit of the chromosomal passenger complex. Activated by ICP-1, AIR-2 phosphorylates
    chromosomal substrates (histone H3, the meiotic cohesin REC-8) while bound to meiotic and mitotic
    chromosomes, promoting stepwise release of meiotic cohesion and correct mitotic and meiotic chromosome
    segregation.
