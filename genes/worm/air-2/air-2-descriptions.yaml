- source: Alliance_Automated
  text: Enables ATPase binding activity; kinesin binding activity; and protein kinase
    activity. Involved in several processes, including chromosome condensation; regulation
    of actomyosin contractile ring contraction; and spindle midzone assembly. Located
    in condensed nuclear chromosome; midbody; and spindle midzone. Part of chromosome
    passenger complex. Is expressed in oocyte and sperm. Human ortholog(s) of this
    gene implicated in colorectal cancer; ovarian cancer; spermatogenic failure 5;
    and uterine cancer. Orthologous to several human genes including AURKB (aurora
    kinase B).
