descriptions:
- source: UniProt
  text: Serine/threonine-protein kinase component of the chromosomal passenger complex
    (CPC), a complex that acts as a key regulator of chromosome segregation and cytokinesis
    (PubMed:10354474, PubMed:10975519, PubMed:10983970, PubMed:11050384, PubMed:11050385,
    PubMed:12707312, PubMed:9852156). The CPC complex has essential functions at the
    centromere in ensuring correct chromosome alignment and segregation (PubMed:10983970,
    PubMed:12707312). Required for histone H3 phosphorylation during segregation of
    homologous chromosomes in meiosis and mitosis (PubMed:18923084). Required for
    histone H3 'Ser- 10' phosphorylation (PubMed:10354474, PubMed:10975519, PubMed:10983970,
    PubMed:11050384, PubMed:11050385, PubMed:11940606, PubMed:12015116, PubMed:9852156).
    Phosphorylates tlk-1 at 'Ser-634', which enhances its activity (PubMed:15916946).
    Phosphorylates zen-4 at 'Ser-680' (PubMed:15854913). Required for the recruitment
    of bub-1 to the ring- shaped domain between chromosomes during meiotic anaphase
    I (PubMed:20729837). Also required for the localization of the condensin I complex
    subunit smc-4 to mitotic chromosomes (PubMed:11914278). Acts at the spindle midzone
    and the midbody to prevent cleavage furrow regression upon chromatin obstructions
    during cytokinesis (PubMed:12213836, PubMed:23684975).
