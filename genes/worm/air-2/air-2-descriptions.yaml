- source: Alliance_Imported
  text: air-2 encodes an aurora/Ipl1-related serine/threonine protein kinase that
    affects embryonic viability and chromosome segregation during meiosis and mitosis
    and is required for cytokinesis; AIR-2 has two functions during mitosis, one in
    chromosome segregation, and a second, independent function in cytokinesis through
    ZEN-4; AIR-2 and ZEN-4 may act in parallel to a second pathway that includes CYK-1;
    AIR-2 phosphorylates two adjacent, evolutionarily conserved C-terminal serines
    of the inner centromere protein ICP-1; AIR-2 i modified in vitro by the GEI-17
    E3 SUMO ligase; AIR-2 forms a robust complex with CSC-1, BIR-1, and ICP-1; air-2
    is expressed highly in embryos, in the mature oocytes, spermatocytes, and extruded
    polar bodies.
