- source: Alliance_Imported
  text: irg-2 encodes a novel protein, conserved amongst nematodes; irg-2 expression
    is induced in response to infection by virulent strains of Pseudomonas aeruginosa
    in a manner dependent upon the bZIP transcription factor ZIP-2, but independent
    of the p38 MAPK pathway.
