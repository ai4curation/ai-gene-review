gene_symbol: irg-2
organism: worm
uniprot_id: O16224
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Plays a role in innate immunity by conferring resistance to virulent strains
    of the Gram-negative bacterium P.aeruginosa via the zip-2 pathway and independent
    of the pmk-1 p38MAPK pathway (PubMed:20133860). Induced as part of several immune
    responses to translational inhibition arising from endocytosis of ToxA during
    P.aeruginosa infection or exposure to exogenous cycloheximide (PubMed:22520465).
  source_type: curated
  url: https://www.uniprot.org/uniprot/O16224
  source_id: O16224
- source: Alliance_Imported
  text: irg-2 encodes a novel protein, conserved amongst nematodes; irg-2 expression
    is induced in response to infection by virulent strains of Pseudomonas aeruginosa
    in a manner dependent upon the bZIP transcription factor ZIP-2, but independent
    of the p38 MAPK pathway.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00016783;class=Gene
  source_id: WB:WBGene00016783
