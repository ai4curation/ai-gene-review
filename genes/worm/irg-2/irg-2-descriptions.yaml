descriptions:
- source: UniProt
  text: Plays a role in innate immunity by conferring resistance to virulent strains
    of the Gram-negative bacterium P.aeruginosa via the zip-2 pathway and independent
    of the pmk-1 p38MAPK pathway (PubMed:20133860). Induced as part of several immune
    responses to translational inhibition arising from endocytosis of ToxA during
    P.aeruginosa infection or exposure to exogenous cycloheximide (PubMed:22520465).
  source_type: curated
  url: https://www.uniprot.org/uniprot/O16224
