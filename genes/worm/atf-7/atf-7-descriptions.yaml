- source: Alliance_Imported
  text: atf-7 encodes a basic-region leucine zipper (bZIP) transcription factor orthologous
    to members of the ATF2/ATF7/CREB5 family of cyclic AMP-response element binding
    (CREB)/activating transcription factors (ATFs); ATF-7 plays a key role in the
    innate immune response by regulating the expression of immune genes downstream
    of PMK-1/p38 MAPK; ATF-7 is likely converted from a transcriptional repressor
    to a transcriptional activator in response to phosphorylation by activated PMK-1
    with which it physically interacts and serves as a substrate in heterologous expression
    assays; an ATF-7::GFP reporter fusion is expressed in the intestine and localizes
    to the nucleus.
  source_type: curated
