- source: Alliance_Automated
  text: Enables RNA polymerase II cis-regulatory region sequence-specific DNA binding
    activity and mitogen-activated protein kinase binding activity. Involved in several
    processes, including defense response to bacterium; regulation of innate immune
    response; and regulation of transcription by RNA polymerase II. Acts upstream
    of or within serotonin biosynthetic process. Located in chromatin and nucleus.
    Is expressed in body wall musculature; hypodermis; intestine; neurons; and rectal
    epithelial cell. Orthologous to human ATF2 (activating transcription factor 2);
    ATF7 (activating transcription factor 7); and CREB5 (cAMP responsive element binding
    protein 5).
