gene_symbol: pfd-2
organism: worm
uniprot_id: Q9N5M2
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Binds specifically to cytosolic chaperonin (c-CPN) and transfers target proteins
    to it. Binds to nascent polypeptide chain and promotes folding in an environment
    in which there are many competing pathways for nonnative proteins (By similarity).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q9N5M2
  source_id: Q9N5M2
- source: Alliance_Imported
  text: pfd-2 encodes a putative prefoldin subunit 2, orthologous to human PFDN2,
    that is required for normal microtubule growth; pfd-2(RNAi) animals have sterile
    progeny, and pfd-2(RNAi) embryos show a reduced microtubule growth rate; in mass
    RNAi assays, PFD-2 is required for normal pronuclear migration, embryonic and
    larval viability, body shape, and locomotion.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00019220;class=Gene
  source_id: WB:WBGene00019220
- source: Alliance_Automated
  text: Predicted to enable protein-macromolecule adaptor activity. Predicted to be
    involved in protein folding. Located in endoplasmic reticulum; sarcomere; and
    striated muscle dense body. Orthologous to human PFDN2 (prefoldin subunit 2).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00019220;class=Gene
  source_id: WB:WBGene00019220
- source: RefSeq
  text: Predicted to enable protein folding chaperone. Predicted to be involved in
    protein folding. Located in endoplasmic reticulum; sarcomere; and striated muscle
    dense body. Orthologous to human PFDN2 (prefoldin subunit 2). [provided by Alliance
    of Genome Resources, Jul 2025]
  source_type: automated
