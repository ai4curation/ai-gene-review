      Correct retained molecular function. GLC-3 is a Cys-loop receptor subunit
      whose extracellular ligand-binding domain is coupled to an intrinsic
      transmembrane chloride pore, as demonstrated by homomeric
      glutamate-gated channel activity in Xenopus oocytes.
    supported_by:
