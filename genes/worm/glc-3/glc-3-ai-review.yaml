- id: PMID:11250875
  title: >-
    GLC-3: a novel fipronil and BIDN-sensitive, but
    picrotoxinin-insensitive, L-glutamate-gated chloride channel subunit from
    Caenorhabditis elegans.
  findings:
  - statement: >-
      GLC-3 forms homomeric L-glutamate-gated, chloride-selective channels in
      Xenopus oocytes and is directly activated by ivermectin.
    supporting_text: >-
      Expression of glc-3 cRNA in XENOPUS oocytes resulted in the formation of
      homo-oligomeric L-glutamate-gated chloride channels
    full_text_unavailable: true
  - statement: >-
      Homomeric GLC-3 is picrotoxinin-insensitive but blocked by BIDN and
      fipronil.
    supporting_text: >-
      Picrotoxinin failed to inhibit L-glutamate agonist responses at
      concentrations up to 1 mM
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Abstract only in the local cache. This is the direct cloning and
      Xenopus-oocyte electrophysiology paper for C. elegans GLC-3.
- id: PMID:16527366
  title: >-
    Caenorhabditis elegans ivermectin receptors regulate locomotor behaviour
    and are functional orthologues of Haemonchus contortus receptors.
  findings:
  - statement: >-
      Four C. elegans GluCl alpha subunits regulate locomotory behavior, and a
      H. contortus GluCl alpha3 channel can functionally complement a C.
      elegans GluCl alpha mutant.
    supporting_text: >-
      we use RNAi and gene knockouts to show that four GluClalpha subunits are
      involved in regulating the pattern of locomotor activity in Caenorhabditis
      elegans
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Abstract only in the local cache. The paper supports the native locomotor
      role of C. elegans GluCl alpha subunits and the direct parasitic-nematode
      relevance of the receptor set, but the abstract does not name GLC-3.
- id: PMID:21414922
  title: >-
    Behavioral choice between conflicting alternatives is regulated by a
    receptor guanylyl cyclase, GCY-28, and a receptor tyrosine kinase, SCD-2,
    in AIA interneurons of Caenorhabditis elegans.
  findings:
  - statement: >-
      GLC-3 acts in AIA interneurons downstream of ASH glutamatergic sensory
      neurons to regulate the Cu2+/diacetyl choice assay.
    supporting_text: >-
      GLC-3 mediates the inhibitory synaptic inputs from the ASH sensory neurons
      to the AIA interneurons
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      The local publication cache carries only the abstract plus a manually
      checked PMC HTML excerpt from the Fig. 6 GLC-3 analysis. The full text
      directly supports the glc-3(ok321) sensory-integration phenotype and
      AIA-specific rescue.
- id: PMID:37811674
  title: UBR-1 ubiquitin ligase regulates the balance between GABAergic and glutamatergic signaling.
  findings:
  - statement: >-
      GLC-3 mediates inhibitory glutamatergic autocrine signaling in the DVB
      neuron when glutamate signaling is elevated in ubr-1 mutants.
    supporting_text: >-
      glutamate-gated chloride channels GLC-3 and GLC-2/4 receive DVB's
      glutamate signals to inhibit DVB and enteric muscle activity,
      respectively
  - statement: >-
      HEK293T expression of GLC-3 reconstitutes a glutamate-activated conductance
      that depends on extracellular chloride.
    supporting_text: >-
      GLC-3 forms a glutamate-gated chloride-dependent conductance, which we
      successfully reconstituted in the HEK293T cells
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text cached. Li et al. support a native inhibitory role for GLC-3 in
      DVB autoinhibition in the defecation circuit and independently confirm
      GLC-3's glutamate-gated chloride conductance in HEK293T cells.
