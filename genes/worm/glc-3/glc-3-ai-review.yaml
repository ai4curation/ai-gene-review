suggested_questions:
- question: >-
    Which native C. elegans GluCl complexes contain GLC-3 protein: GLC-3
    homomers, heteromers with other GluCl subunits, or distinct combinations in
    AIA, DVB and motor neurons?
- question: >-
    Is GLC-3 protein concentrated at inhibitory glutamatergic postsynaptic
    specializations, or does it act partly from extrasynaptic plasma-membrane
    pools?
- question: >-
    Which Brugia, Onchocerca and Haemonchus GluCl paralogs are the direct
    orthologs or functional analogs of C. elegans glc-3 in ivermectin-sensitive
    circuits?
suggested_experiments:
- description: >-
    Endogenously tag GLC-3 and co-image it with presynaptic glutamate-release
    markers in AIA, DVB and locomotor neurons before and after elevated
    glutamate or ivermectin exposure.
  hypothesis: >-
    GLC-3-containing receptors occupy defined native plasma-membrane
    subdomains and are recruited to cells that are inhibited by glutamate in
    ivermectin-sensitive circuits.
- description: >-
    Reconstitute candidate parasite GLC-3-like subunits in HEK293T cells or
    oocytes and measure glutamate-, ivermectin-, fipronil- and
    picrotoxinin-dependent chloride currents.
  hypothesis: >-
    Parasite orthologs retain the core GLC-3 chloride-channel mechanism but
    differ in antagonist pharmacology and ivermectin sensitivity.
