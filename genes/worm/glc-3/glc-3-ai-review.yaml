  label: Caenorhabditis elegans
description: >-
  glc-3 encodes a Cys-loop glutamate-gated chloride channel subunit in
  Caenorhabditis elegans. Recombinant GLC-3 forms homomeric plasma-membrane
  channels that open in response to extracellular glutamate, conduct chloride,
  and are directly activated by the antiparasitic drug ivermectin. Native
  genetic data place GLC-3 in inhibitory glutamatergic signaling in AIA
  sensory-interneuron choice behavior and in DVB motor-neuron autoinhibition.
