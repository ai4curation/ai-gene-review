core_functions:
- description: >-
    Pentameric Cys-loop receptor subunit that enables homomeric
    extracellularly glutamate-gated chloride-channel activity and mediates
    inhibitory glutamatergic signaling in native AIA and DVB neurons.
  molecular_function:
