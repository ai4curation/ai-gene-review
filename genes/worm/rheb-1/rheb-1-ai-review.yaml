  review:
    summary: GTPase activity inferred by PAINT from a broad Ras/Rheb clade node that includes human RHEB (Q15382)
      and yeast Rhb1.
    action: ACCEPT
    reason: RHEB-1 is a Rheb-family small GTPase with the conserved G-box residues. Its GTP-locked Q71L/Q72D variant
      behaves as a constitutive TORC1 activator in worms, consistent with a nucleotide-state switch that hydrolyses
      GTP. The worm protein has not been assayed biochemically, but nothing places it outside the clade that inherited
      the activity. Rheb GTPase activity is intrinsically low, as for its orthologues; the annotation is still correct.
