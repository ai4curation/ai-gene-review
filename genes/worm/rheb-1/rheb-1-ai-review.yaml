  review:
    summary: Plasma membrane location inferred from a broad Ras-family PAINT node (PTN000631348) whose experimental
      seeds are mostly Ras, Rap and Ral proteins.
    action: MARK_AS_OVER_ANNOTATED
    reason: The seeding node spans classical Ras proteins that are plasma-membrane localized; the Rheb branch is
      not. Endogenous CRISPR-tagged worm RHEB-1 is on lysosomes, colocalizing with the lysosomal membrane marker
      CTNS-1 and with DAF-15/Raptor, which is where Rheb meets TORC1. No worm data place RHEB-1 at the plasma membrane.
