suggested_questions:
- question: In the absence of TSC1/TSC2, what protein(s) act as the GTPase-activating protein for C. elegans RHEB-1,
    and does the RalGAP or GATOR1 (NPRL-2/NPRL-3) complex play that role?
- question: Does GTP-bound RHEB-1 directly bind and allosterically activate worm LET-363/TOR, as mammalian Rheb
    does, or could it also act through other effectors?
- question: Is CGEF-1 a true guanine nucleotide exchange factor for RHEB-1, given that Rheb is generally thought
    to need no GEF?
suggested_experiments:
- description: Measure GTP binding and intrinsic and GAP-stimulated GTP hydrolysis by recombinant RHEB-1 (wild type
    and Q71L/Q72D) with candidate GAPs (RalGAP, NPRL-2/3).
  hypothesis: RHEB-1 has low intrinsic GTPase activity that is stimulated by a TSC-independent GAP.
  experiment_type: In vitro biochemistry
- description: Test whether purified RHEB-1-GTP stimulates LET-363/DAF-15 kinase activity toward 4E-BP or S6K substrates,
    and map the effect of the CAAX mutation on lysosomal localization of endogenous RHEB-1.
  hypothesis: RHEB-1 is a direct, membrane-dependent activator of worm TORC1 kinase.
  experiment_type: Kinase assay and live imaging
