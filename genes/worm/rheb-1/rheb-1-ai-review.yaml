taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: 'rheb-1 (F54C8.5) encodes the single Caenorhabditis elegans orthologue of the Rheb small GTPase. RHEB-1
  is a Ras-superfamily GTP-binding switch with a C-terminal CAAX box that is predicted to be farnesylated, and endogenously
  tagged RHEB-1 is expressed in all tissues and sits on lysosomal membranes together with the TORC1 subunit DAF-15/Raptor.
  In its GTP-bound state RHEB-1 activates TORC1 (LET-363/TOR with DAF-15): a GTP-locked rheb-1 transgene behaves
  as a constitutive TORC1 activator, and loss of rheb-1 causes L3 larval arrest like loss of TORC1 subunits. C.
  elegans has no TSC1/TSC2 orthologues, so the GTPase-activating input to RHEB-1 differs from mammals; the Dbl-family
  exchange-factor homologue CGEF-1 binds RHEB-1 and acts in the same pathway. Through TORC1, RHEB-1 promotes larval
  development and growth, including sphingolipid-dependent L1 growth, and limits lifespan; its activity is required
  for intermittent-fasting and hypoxia-induced longevity.'
