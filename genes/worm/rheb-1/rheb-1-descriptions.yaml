- source: Alliance_Automated
  text: Predicted to enable GTPase activity and protein serine/threonine kinase activator
    activity. Predicted to be involved in positive regulation of TORC1 signaling and
    small GTPase-mediated signal transduction. Predicted to be located in membrane.
    Predicted to be active in plasma membrane. Is expressed in head neurons; hypodermis;
    intestine; tail neurons; and vulval muscle. Orthologous to several human genes
    including RHEB (Ras homolog, mTORC1 binding).
