- source: Alliance_Imported
  text: rheb-1 encodes a GTPase orthologous to the mammalian Rheb and Rheb1 GTPases;
    by homology, RHEB-1 is predicted to function as a regulator of LET_363/TOR function;
    in C. elegans, rheb-1 plays an essential role in mediating intermittent fasting
    (IF)-induced longevity; further, loss of rheb-1 activity via RNAi indicates that
    rheb-1 is involved in the mitochondrial unfolded protein response and that its
    function is required for normal growth rates, body size, osmoregulation, reproduction,
    and locomotion.
  source_type: curated
