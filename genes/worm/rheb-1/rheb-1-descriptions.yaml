gene_symbol: rheb-1
organism: worm
uniprot_id: P34443
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Binds GTP and exhibits intrinsic GTPase activity.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P34443
  source_id: P34443
- source: Alliance_Imported
  text: rheb-1 encodes a GTPase orthologous to the mammalian Rheb and Rheb1 GTPases;
    by homology, RHEB-1 is predicted to function as a regulator of LET_363/TOR function;
    in C. elegans, rheb-1 plays an essential role in mediating intermittent fasting
    (IF)-induced longevity; further, loss of rheb-1 activity via RNAi indicates that
    rheb-1 is involved in the mitochondrial unfolded protein response and that its
    function is required for normal growth rates, body size, osmoregulation, reproduction,
    and locomotion.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00010038;class=Gene
  source_id: WB:WBGene00010038
- source: Alliance_Automated
  text: Predicted to enable GTPase activity and protein serine/threonine kinase activator
    activity. Predicted to be involved in positive regulation of TORC1 signaling and
    small GTPase-mediated signal transduction. Predicted to be located in membrane.
    Predicted to be active in plasma membrane. Is expressed in head neurons; hypodermis;
    intestine; tail neurons; and vulval muscle. Orthologous to several human genes
    including RHEB (Ras homolog, mTORC1 binding).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00010038;class=Gene
  source_id: WB:WBGene00010038
