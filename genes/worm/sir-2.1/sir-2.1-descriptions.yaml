- source: Alliance_Automated
  text: Enables histone H4K deacetylase activity. Involved in dauer larval development;
    determination of adult lifespan; and intrinsic apoptotic signaling pathway in
    response to DNA damage. Located in chromosome, telomeric region; nucleus; and
    perinuclear region of cytoplasm. Is expressed in several structures, including
    intestinal cell; neurons; retrovesicular ganglion; tail; and ventral nerve cord.
    Used to study alcohol use disorder. Human ortholog(s) of this gene implicated
    in Huntington's disease. Orthologous to human SIRT1 (sirtuin 1).
