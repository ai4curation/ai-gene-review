descriptions:
- source: UniProt
  text: NAD-dependent deacetylase (By similarity). Involved in metabolism, apoptosis,
    response to oxidative stress, response to DNA damage, and determination of lifespan
    (PubMed:16256736, PubMed:16280150, PubMed:16777605, PubMed:21909281, PubMed:23509272,
    PubMed:24077178, PubMed:26598553, PubMed:27514077, PubMed:27650246). Required
    for a reduction of the 'Lys-16' acetylation of histone H4 (H4K16ac) on dosage-compensated
    X chromosomes in hermaphrodites (PubMed:22393255). Plays a role in germ cell and
    somatic cell apoptosis in response to DNA damage (PubMed:26598553, PubMed:27650246).
    Functions upstream of daf-16/Forkhead box protein O in the Insulin/IGF-1-like
    signaling (IIS) mediated pathway, promoting daf-16 mediated transcriptional activation
    and increased lifespan (PubMed:16280150, PubMed:16777605). May also regulate lifespan
    independently of daf-16 by modulating the transcription of genes involved in the
    stress response of the endoplasmic reticulum (ER) (PubMed:16256736, PubMed:16280150).
    Functions upstream of transcriptional coregulator hcf-1, perhaps acting independently
    of the IIS mediated pathway, to modulate lifespan and oxidative stress response
    (PubMed:21909281). Acts upstream of the nicotinic acid metabolism pathway, which
    may be linked to the regulation of longevity (PubMed:24077178). Plays a role in
    ascaroside- mediated longevity and stress resistance (PubMed:23509272).
