suggested_questions:
- question: >-
    Is RFT-2 localized to the apical (luminal) plasma membrane of intestinal cells,
    as expected for a dietary uptake carrier, and what does it do in the pharynx?
- question: >-
    Do the rft-2 splice isoforms (a, b, c; isoform c lacks the first three
    transmembrane helices) differ in transport activity or localization?
- question: >-
    What are the kinetic parameters, pH dependence and analogue sensitivity of
    RFT-2, which were measured only for RFT-1?
suggested_experiments:
- description: >-
    Endogenous CRISPR knock-in of a fluorescent tag on rft-2 to determine
    subcellular localization in intestinal and pharyngeal cells.
  hypothesis: RFT-2 resides in the apical plasma membrane of intestinal cells.
- description: >-
    Characterize RFT-2-mediated [3H]riboflavin uptake in a heterologous system
    (Km, pH dependence, inhibition by lumiflavin/lumichrome) and compare isoforms.
  hypothesis: RFT-2 is a lower-capacity, pH-dependent riboflavin carrier like RFT-1.
