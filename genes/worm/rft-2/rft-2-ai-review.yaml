  review:
    summary: >-
      Phylogenetic inference that RFT-2 acts at the plasma membrane, from the SLC52
      family node PTN000986065 seeded by the human and rodent RFVT1-3 transporters,
      which are plasma membrane riboflavin uptake carriers.
    action: ACCEPT
    reason: >-
      RFT-2 descends within the SLC52 clade and retains the full 11-TM carrier
      architecture of the family; uptake of extracellular riboflavin into
      transfected cells is what a plasma membrane carrier would mediate. No
      RFT-2-specific localization assay exists (only promoter reporters were used),
      but nothing argues against the inherited location, and this is where the core
      uptake activity is expected to act.
