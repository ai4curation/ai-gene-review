  label: Caenorhabditis elegans
description: >-
  rft-2 (Y47D7A.14) encodes one of two tandemly arranged Caenorhabditis elegans
  orthologs of the human SLC52/RFVT riboflavin transporters (closest to RFVT3,
  SLC52A3). The protein is an 11-transmembrane-helix carrier predicted to reside in
  the plasma membrane. Because nematodes cannot synthesise riboflavin, RFT-2 and its
  paralog RFT-1 mediate uptake of dietary riboflavin (vitamin B2), the precursor of
  the FMN and FAD cofactors. Expression of rft-2 cDNA in mammalian ARPE-19 cells
  increases specific riboflavin uptake, though less than RFT-1. rft-2 is expressed
  in the intestine and pharynx from embryo to adult, and its mRNA is adaptively
  down-regulated by high and up-regulated by low dietary riboflavin. RNAi knockdown
  reduces brood size, an effect compounded by rft-1 knockdown and partly rescued by
  riboflavin supplementation, consistent with organismal riboflavin deficiency.
