- term:
    id: GO:0036498
    label: IRE1-mediated unfolded protein response
  evidence_type: HEP
  original_reference_id: PMID:16184190
  qualifier: involved_in
  review:
    summary: >-
      High-throughput expression profiling (HEP): Y47D7A.14 appears in the
      supplementary microarray data of a genome-wide C. elegans UPR study as a gene
      whose expression depends on the IRE-1/XBP-1 branch. It is not named in the
      main text of the paper.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Transcriptional responsiveness to UPR signalling does not show that a
      riboflavin uptake carrier does any of the work of the unfolded protein
      response (sensing unfolded proteins, IRE1 signalling, XBP1 splicing or
      transcription). The term is at most a description of expression regulation
      and is not part of RFT-2's function. Not removed, because the expression
      data themselves are not contested.
    supported_by:
    - reference_id: PMID:16184190
      supporting_text: Microarray analysis identified inducible UPR (i-UPR) genes, as
        well as numerous constitutive UPR (c-UPR) genes that require the ER stress transducers
        during normal development.
