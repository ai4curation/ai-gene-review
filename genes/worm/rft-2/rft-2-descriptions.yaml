- source: Alliance_Automated
  text: Enables riboflavin transmembrane transporter activity. Involved in IRE1-mediated
    unfolded protein response. Predicted to be active in plasma membrane. Is expressed
    in intestine. Human ortholog(s) of this gene implicated in Brown-Vialetto-Van
    Laere syndrome 1; Brown-Vialetto-Van Laere syndrome 2; Fazio-Londe disease; and
    riboflavin deficiency. Orthologous to several human genes including SLC52A3 (solute
    carrier family 52 member 3).
