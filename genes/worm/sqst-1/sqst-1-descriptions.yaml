taxon_id: NCBITaxon:6239
descriptions:
- source: Alliance_Imported
  text: sqst-1 encodes a protein with similarity to mammalian sequestosome 1(SQSTM1)/p62,
    a signal transduction or adaptor protein involved in receptor-mediated signalling
    pathways; SQST-1 is weakly expressed in embryos and exhibits a diffuse, cytoplasmic
    localization; SQST-1 is selectively removed by autophagy during embryogenesis.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00011737;class=Gene
  source_id: WB:WBGene00011737
- source: Alliance_Automated
  text: Predicted to enable K63-linked polyubiquitin modification-dependent protein
    binding activity and protein kinase C binding activity. Predicted to be involved
    in aggrephagy; endosome organization; and mitophagy. Located in cytoplasm. Is
    expressed in several structures, including hypodermal cell; intestine; nervous
    system; pharynx; and reproductive system. Used to study amyotrophic lateral sclerosis.
    Human ortholog(s) of this gene implicated in Paget disease of bone; Paget disease
    of bone 3; distal myopathy with rimmed vacuoles; frontotemporal dementia and/or
    amyotrophic lateral sclerosis 3; and neurodegeneration with ataxia, dystonia,
    and gaze palsy, childhood-onset. Orthologous to human SQSTM1 (sequestosome 1).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00011737;class=Gene
  source_id: WB:WBGene00011737
