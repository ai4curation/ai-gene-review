  text: T24B8.5 encodes an ShK-like toxin peptide containing a domain rich in cysteine
    residues found in the sea anemone potassium channel inhibitor ShK; T24B8.5 expression
    is regulated by the PMK-1/p38 MAPK signaling pathway and the ATF-7 transcription
    factor, which is a downstream target of PMK-1.
