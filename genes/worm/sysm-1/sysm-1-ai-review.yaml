core_functions:
- description: >-
    Secreted intestinal ShKT-domain signal, produced under PMK-1/ATF-7 control, that is
    transferred to the germline and promotes DNA-damage-induced apoptosis of pachytene
    germ cells in parallel to CEP-1/p53. Its molecular activity is unknown, so no
    molecular_function is asserted.
  directly_involved_in:
  - id: GO:1902231
    label: positive regulation of intrinsic apoptotic signaling pathway in response to
      DNA damage
  locations:
  - id: GO:0005576
    label: extracellular region
  supported_by:
  - reference_id: PMID:35121747
    supporting_text: Therefore, SYSM-1 is secreted from the intestine into the germline
      where is required to facilitate DNA damage-induced apoptosis.
  - reference_id: PMID:42173292
    supporting_text: SYSM-1 is an apoptosis effector, whose deficiency leads to decreased,
      rather than increased, DNA damage-induced germ cell apoptosis.
suggested_questions:
- question: Does SYSM-1 contribute to pathogen resistance at all, given that it is the
    canonical PMK-1/ATF-7 reporter but has only been shown to act in germline DNA-damage
    apoptosis? Should modules treat it as an antibacterial effector or as a stress
    signal?
- question: What germline receptor or uptake route takes up intestinal SYSM-1, and do its
    ShKT domains bind a channel or receptor as ShK toxins do?
suggested_experiments:
- hypothesis: SYSM-1 contributes to survival during P. aeruginosa or other bacterial
    infection.
  description: Compare survival and intestinal bacterial load of sysm-1(ok3236), wild type,
    and intestine-rescued sysm-1 animals on P. aeruginosa PA14, E. faecalis and S. aureus,
    alone and in a background lacking related ShKT paralogs.
- hypothesis: SYSM-1 acts through a specific germline receptor or channel.
  description: Forward genetic suppressor screen for loss of the excess IR-induced
    apoptosis caused by germline SYSM-1 overexpression, plus proximity labeling of V5-tagged
    SYSM-1 in the germline to identify binding partners.
