id: Q22714
gene_symbol: sysm-1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: >-
  sysm-1 (T24B8.5, systemic stress signaling mediator 1) encodes a small (99 aa)
  secreted, cysteine-rich protein with an N-terminal signal peptide and two
  ShKT (ShK toxin-like) domains, a member of a nematode-expanded family of ShKT
  peptides. Its transcription in the intestine is driven by the TIR-1/NSY-1/SEK-1/PMK-1
  p38 MAPK pathway and the ATF-7 transcription factor, and it is strongly induced
  by Pseudomonas aeruginosa infection, which made the T24B8.5 promoter the standard
  in vivo reporter of PMK-1 pathway activity. Genetic analysis of a sysm-1 deletion
  showed that SYSM-1 is processed through the Golgi in anterior intestinal cells,
  secreted in a signal-peptide-dependent manner, and taken up by the germline, where
  it is required, and sufficient when expressed in either tissue, for
  DNA-damage-induced and heat-stress-enhanced apoptosis of pachytene germ cells. It
  acts in parallel to CEP-1/p53, since egl-1 and ced-13 induction is intact in sysm-1
  mutants. A direct antimicrobial activity has not been demonstrated, and its
  molecular activity (receptor, binding partner or mechanism) is unknown.
existing_annotations:
- term:
    id: GO:0003674
    label: molecular_function
  evidence_type: ND
  original_reference_id: GO_REF:0000015
  qualifier: enables
  review:
    summary: No molecular function has been determined for SYSM-1.
    action: ACCEPT
    reason: >-
      The ND annotation correctly records that no molecular activity is known. SYSM-1 is
      a secreted ShKT-domain protein that acts non-cell-autonomously on germ cell
      apoptosis (PMID:35121747), but its receptor, binding partner or biochemical
      activity has not been identified, and UniProt flags that it lacks conserved
      residues needed for propagation of ShKT feature annotation. Potassium channel
      blocking, the canonical ShK toxin activity, has never been tested.
    supported_by:
    - reference_id: PMID:35121747
      supporting_text: Together, these observations indicate that SYSM-1 functions downstream
        of PMK-1/p38 MAPK signaling pathway as a putative intestinal secreted immune peptide
        in response to IR-induced DNA damage to promote apoptosis in germ cells in a
        non-cell-autonomous fashion
- term:
    id: GO:0005576
    label: extracellular region
  evidence_type: ISM
  original_reference_id: PMID:17096597
  qualifier: is_active_in
  review:
    summary: SYSM-1 has a signal peptide and is secreted from the intestine and taken up
      by the germline.
    action: ACCEPT
    reason: >-
      The sequence-model prediction (signal peptide 1-19, two disulfide-bonded ShKT
      domains) is borne out experimentally. Removing the signal sequence blocks SYSM-1
      transfer from intestine to germline, and intestinal SYSM-1 co-localizes with the
      Golgi marker SQV-8 (PMID:35121747). Acting extracellularly as an inter-tissue signal
      is consistent with is_active_in extracellular region.
    additional_reference_ids:
    - PMID:35121747
    supported_by:
    - reference_id: PMID:17096597
      supporting_text: There was a preponderance of secreted genes among PMK-1–regulated
        genes
    - reference_id: PMID:35121747
      supporting_text: These results establish that SYSM-1 that is generated in the intestine
        is secreted into the germline through recognition of the signal sequence
    - reference_id: PMID:35121747
      supporting_text: indicating that SYSM-1 is processed and secreted via Golgi apparatus
        in the anterior part of the intestine
- term:
    id: GO:0045087
    label: innate immune response
  evidence_type: HEP
  original_reference_id: PMID:16968778
  qualifier: involved_in
  review:
    summary: Expression-profiling evidence that T24B8.5 is part of the pathogen-induced
      intestinal transcriptional program.
    action: KEEP_AS_NON_CORE
    reason: >-
      T24B8.5 is induced by P. aeruginosa infection under PMK-1/ATF-7 (and, per this
      genome-wide study, ELT-2) control and is a robust reporter of the intestinal immune
      response. The HEP evidence shows membership of the infection-response program
      rather than a demonstrated defensive activity; the cached abstract does not name
      the gene and its full text is not cached. No study has shown that sysm-1 loss
      alters pathogen resistance, and single-gene RNAi of PMK-1-induced effectors did not
      reproducibly alter susceptibility (PMID:17096597). The only demonstrated function is
      in germline DNA-damage apoptosis (PMID:35121747). The broad term is kept as a
      plausible but non-core role.
    supported_by:
    - reference_id: PMID:16968778
      supporting_text: Gene expression and functional RNAi-based analyses identified the
        tissue-specific GATA transcription factor ELT-2 as a major regulator of an early
        intestinal protective response to infection with the human bacterial pathogen
        Pseudomonas aeruginosa.
    - reference_id: PMID:35121747
      supporting_text: It was reported that the T24B8.5 gene, which contains an N-terminal
        signal sequence for extracellular secretion as well as a ShK-like toxin domain is
        robustly up-regulated in intestines of C. elegans upon pathogenic bacteria
        infection in a PMK-1- and ATF-7-dependent manner
- term:
    id: GO:0045087
    label: innate immune response
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN008579146
  - WB:WBGene00011979
  - WB:WBGene00018643
  review:
    summary: Phylogenetic inference placing innate immune response on a nematode ShKT
      peptide node (PTN008579146) whose descendants include sysm-1 itself and drd-50.
    action: KEEP_AS_NON_CORE
    reason: >-
      The IBD node is seeded by nematode ShKT-family genes, including sysm-1 itself
      (WBGene00011979), whose own grounding is expression-based (HEP/IEP). The
      inference is consistent with the family's widespread induction by pathogens, so
      there is no basis to reject it, but for sysm-1 the demonstrated function is
      inter-tissue signaling for germ cell apoptosis, not a defensive activity against
      microbes. Kept as non-core, as for the HEP row.
    supported_by:
    - reference_id: PMID:17096597
      supporting_text: The two most highly represented classes of PMK-1–upregulated genes
        were genes with a CUB-like domain and genes with homology to ShK toxins.
- term:
    id: GO:0140367
    label: antibacterial innate immune response
  evidence_type: IEP
  original_reference_id: PMID:17096597
  qualifier: involved_in
  review:
    summary: Induction of T24B8.5 by P. aeruginosa and by PMK-1 in microarray and qRT-PCR
      experiments.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      IEP shows that sysm-1 mRNA is induced by a bacterial pathogen and by PMK-1, which is
      well established (PMID:17096597, PMID:20369020). The term asserts a specifically
      antibacterial defense role, and no study has shown that SYSM-1 kills or restricts
      bacteria or that its loss reduces survival on P. aeruginosa. The same paper found
      that knockdown of individual PMK-1-induced genes did not reproducibly enhance
      pathogen susceptibility, and the only functional study of sysm-1 places it in
      germline DNA-damage apoptosis (PMID:35121747). The expression pattern supports the
      broader innate immune response term at most.
    additional_reference_ids:
    - PMID:20369020
    - PMID:35121747
    supported_by:
    - reference_id: PMID:17096597
      supporting_text: However, none of the genes inactivated individually by RNAi
        reproducibly resulted in an enhanced susceptibility to pathogens (unpublished data).
    - reference_id: PMID:20369020
      supporting_text: the promoter of a PMK-1-regulated gene, T24B8.5, encoding a ShK-like
        toxin peptide, fused to green fluorescent protein (GFP) and provides an in vivo
        sensor of PMK-1 pathway activity
- term:
    id: GO:1902231
    label: positive regulation of intrinsic apoptotic signaling pathway in response to DNA
      damage
  evidence_type: IMP
  original_reference_id: PMID:35121747
  qualifier: involved_in
  review:
    summary: SYSM-1 is a secreted intestinal signal required for ionizing-radiation-induced
      germ cell apoptosis.
    action: NEW
    reason: >-
      sysm-1(ok3236) mutants have strongly reduced IR-induced germ cell apoptosis, rescued
      by endogenous, intestine-specific or germline-specific sysm-1 expression; intestinal
      SYSM-1 is secreted into the germline and also restores apoptosis in pmk-1 mutants
      (PMID:35121747). SYSM-1 is the signal molecule itself, so it does the work of
      conveying the stress signal to germ cells, and the regulation term fits a secreted
      signal acting on the core apoptotic machinery. The "by p53 class mediator" child is
      not used because egl-1 and ced-13 induction is intact in sysm-1 mutants
      (PMID:42173292). The mul-1 paper confirmed the sysm-1 apoptosis defect.
    additional_reference_ids:
    - PMID:42173292
    supported_by:
    - reference_id: PMID:35121747
      supporting_text: These results indicate that (i) SYSM-1 is required, (ii) intestinal
        SYSM-1 is sufficient, and (iii) constitutive germline expression of SYSM-1 is
        sufficient for DNA damage-induced germ cell apoptosis
    - reference_id: PMID:35121747
      supporting_text: Indeed, constitutive re-expression of SYSM-1 in the intestine was
        sufficient to restore IR-induced apoptosis in pmk-1 mutants to WT levels
    - reference_id: PMID:42173292
      supporting_text: We confirmed that sysm-1 mutants are defective for DNA damage-induced
        apoptosis
