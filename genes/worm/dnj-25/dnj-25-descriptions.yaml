- source: Alliance_Imported
  text: The dnj-25 (Ce-auxilin) gene is required in vivo for clathrin-mediated endocytosis
    and for normal development.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00001043;class=Gene
  source_id: WB:WBGene00001043
- source: Alliance_Automated
  text: Predicted to enable clathrin binding activity. Predicted to be involved in
    clathrin coat disassembly. Predicted to be active in cytoplasm and vesicle. Is
    expressed in hypodermis; pharynx; and seam cell. Human ortholog(s) of this gene
    implicated in Parkinson's disease and Parkinson's disease 19A. Orthologous to
    human DNAJC6 (DnaJ heat shock protein family (Hsp40) member C6).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00001043;class=Gene
  source_id: WB:WBGene00001043
- source: RefSeq
  text: Predicted to enable clathrin binding activity. Predicted to be involved in
    clathrin coat disassembly and clathrin-dependent endocytosis. Predicted to be
    active in cytoplasm and vesicle. Is expressed in hypodermis; pharynx; and seam
    cell. Human ortholog(s) of this gene implicated in Parkinson's disease and Parkinson's
    disease 19A. Orthologous to human DNAJC6 (DnaJ heat shock protein family (Hsp40)
    member C6). [provided by Alliance of Genome Resources, Jun 2026]
