  label: Caenorhabditis elegans
description: DNJ-25 is the single Caenorhabditis elegans auxilin, a J-domain co-chaperone of the auxilin/cyclin
  G-associated kinase family with a C-terminal DnaJ domain preceded by low-complexity clathrin-binding
  regions (the scaffold entry is the 786-residue isoform d). Like mammalian auxilin, it binds clathrin-coated
  vesicles and, through its J domain, recruits and stimulates the ATPase of the cytosolic Hsc70 chaperone
  HSP-1 to dismantle the clathrin lattice after membrane scission, releasing naked vesicles and free clathrin
  for reuse. The worm protein reproduces the in vitro uncoating co-chaperone activity of mammalian auxilin;
  its depletion by RNAi blocks receptor-mediated yolk endocytosis in oocytes, mislocalizes clathrin and
  freezes clathrin dynamics in many cell types, causes clathrin accumulation in the epidermis and molting
  defects, and arrests larval development. It supplies the auxilin step of clathrin-mediated endocytosis
  in all tissues, including the regeneration of synaptic vesicles at nerve terminals.
