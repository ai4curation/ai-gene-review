  - description: 'Clathrin-uncoating co-chaperone: DNJ-25 binds clathrin coats on newly budded vesicles
      and, through its J domain, recruits HSP-1/Hsc70 and stimulates its ATPase to drive ATP-dependent
      disassembly of the clathrin lattice, completing clathrin-mediated endocytosis and synaptic vesicle
      regeneration.'
