suggested_questions:
  - question: Do dnj-25 loss-of-function synapses accumulate clathrin-coated vesicles as unc-26 synapses
      do, establishing the auxilin/HSP-1 step of synaptic vesicle uncoating directly in C. elegans?
  - question: Does DNJ-25 bind HSP-1 through its J domain in vivo, and which clathrin-binding motifs in
      its low-complexity region are required?
suggested_experiments:
  - description: Electron microscopy of neuromuscular junctions in dnj-25 null or neuron-specific knockdown
      animals, scoring coated vesicles per synapse, with a J-domain HPD mutant rescue.
    hypothesis: Loss of DNJ-25 traps synaptic vesicles in clathrin coats, phenocopying unc-26.
