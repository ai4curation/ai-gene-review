suggested_questions:
- question: >-
    Which native C. elegans neurons express AVR-14A versus AVR-14B protein, and
    do the two splice forms coassemble in vivo?
- question: >-
    Which parasite GluClalpha3 orthologs are the direct AVR-14 functional
