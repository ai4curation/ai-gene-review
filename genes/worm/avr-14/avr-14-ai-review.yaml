  label: Caenorhabditis elegans
description: >-
  avr-14 encodes a Cys-loop glutamate-gated chloride channel alpha subunit.
  The AVR-14B/GluClalpha3B splice form makes homomeric channels that open in
  response to glutamate and ivermectin when expressed in Xenopus oocytes. In C.
  elegans, avr-14 acts in extrapharyngeal neurons and belongs to a parallel
  ivermectin-sensitivity system with the GluCl alpha-subunit genes avr-15 and
  glc-1; loss of all three genes is needed for high-level resistance to the
  antiparasitic drug ivermectin. AVR-14 also contributes to locomotory behavior
  and to inhibitory coupling between mechanosensory input and pharyngeal
  pumping, consistent with an inhibitory neuronal chloride-channel role.
