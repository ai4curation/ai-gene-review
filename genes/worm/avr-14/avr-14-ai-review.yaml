suggested_experiments:
- description: >-
    Endogenously tag the AVR-14A- and AVR-14B-specific C termini and co-image
    them with glutamatergic synapse markers in adult extrapharyngeal neurons.
  hypothesis: >-
    Native AVR-14-containing receptors occupy inhibitory neuronal membrane
    subdomains and use both splice-specific subunits.
- description: >-
    Express candidate Haemonchus, Brugia and Onchocerca GluClalpha3 subunits
    from the C. elegans avr-14 promoter in avr-14 mutants and assay glutamate-
    and ivermectin-sensitive movement rescue.
  hypothesis: >-
    Parasitic-nematode AVR-14-like subunits can replace C. elegans AVR-14 in
    motor-circuit inhibition but differ in ivermectin sensitivity.
knowledge_gaps:
- gap_statement: >-
    The endogenous AVR-14 receptor composition is unknown: Dent et al. detected
    channel activity from AVR-14B alone in oocytes, but the similar genetics of
    avr-14A- and pan-avr-14-disrupting alleles suggested that AVR-14A and
    AVR-14B may need to associate in vivo.
  boundary: >-
    AVR-14B produced robust glutamate- and ivermectin-gated currents in Xenopus
    oocytes, and an avr-14 promoter::AVR-14B minigene restored ivermectin
    sensitivity in an avr-14; avr-15; glc-1 mutant background.
