suggested_questions:
- question: Which phosphotyrosine sites does the CED-2 SH2 domain bind in vivo during engulfment (for
    example on SRC-1 targets, APR-1 or PSR-1-associated proteins), and is any receptor tyrosine kinase
    involved?
- question: If the PXXP-binding surface of the first SH3 domain is dispensable, how does CED-2 bind the
    N-terminal region of CED-5, and is the SH3 domain needed at all for engulfment?
suggested_experiments:
- hypothesis: CED-2 recruitment to corpse-facing membranes depends on its SH2 domain and on PSR-1 or
    MOM-5.
  description: Image endogenously tagged CED-2 in embryos during corpse engulfment, comparing wild type,
    SH2-dead (R-to-K in the FLVRES motif) knock-in, psr-1 and mom-5 mutants, and score enrichment around
    corpses together with engulfment timing.
  experiment_type: imaging
- hypothesis: The CED-2 interaction with the CED-5 N-terminal region is required for engulfment and distal
    tip cell migration.
  description: Map the CED-5 N-terminal binding surface for CED-2 and test CRISPR point mutants that break
    it for persistent corpses and distal tip cell migration defects.
