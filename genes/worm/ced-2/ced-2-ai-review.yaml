id: Q9NHC3
gene_symbol: ced-2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: CED-2 is the C. elegans orthologue of the CrkII adaptor protein. It has an N-terminal
  SH2 domain followed by two SH3 domains and no catalytic activity. It acts in engulfing cells, where
  it links upstream engulfment signals to the CED-5/DOCK180 and CED-12/ELMO bipartite guanine nucleotide
  exchange factor, which activates the Rac GTPase CED-10. CED-2, CED-5 and CED-12 form a ternary complex,
  and CED-2 co-precipitates with the phosphatidylserine receptor PSR-1. Upstream inputs include PSR-1,
  the Frizzled receptor MOM-5 acting with GSK-3 and the APC homologue APR-1, and the Src kinase SRC-1.
  Rac activation drives the actin rearrangement and polarized membrane extension needed to engulf apoptotic
  and necrotic cell corpses. The same CED-2/CED-5/CED-12/CED-10 module is needed for the migration of
  the two gonadal distal tip cells. ced-2 mutants accumulate unengulfed corpses, but programmed cell death
  itself still occurs. Engulfment genes, including those of this pathway, also help ensure that cells
  receiving weak death signals die.
