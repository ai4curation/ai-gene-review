gene_symbol: ced-2
organism: worm
uniprot_id: Q9NHC3
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Required for cell migration and engulfment of cell corpses but not for programmed
    cell death/apoptosis (PubMed:10707082, PubMed:11449278, PubMed:15744306, PubMed:1936965,
    PubMed:19402756, PubMed:20226672, PubMed:6857247). Has a role in the migration
    of the 2 gonadal distal tip cells (DTCs) (PubMed:10707082). Plays a role in protecting
    dopaminergic neurons from oxidative stress-induced degeneration (PubMed:29346382).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q9NHC3
  source_id: Q9NHC3
- source: Alliance_Imported
  text: The ced-2 gene encodes a Src homology (SH) 2 and 3-containing adaptor protein,
    homologous to human CrkII, that is required for phagocytosis during programmed
    cell death and for migration of the distal tip cells of the somatic gonad; CED-2
    functions in the engulfing cell during apoptosis and interacts with CED-5/DOCK180
    to activate CED-10/Rac and promote formation of the polarized cell extensions
    associated with cell corpse engulfment.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00000416;class=Gene
  source_id: WB:WBGene00000416
- source: Alliance_Automated
  text: Predicted to enable receptor tyrosine kinase binding activity and signaling
    adaptor activity. Involved in several processes, including engulfment of apoptotic
    cell; positive regulation of distal tip cell migration; and positive regulation
    of engulfment of apoptotic cell. Predicted to be located in plasma membrane. Predicted
    to be active in cytoplasm. Human ortholog(s) of this gene implicated in chronic
    myeloid leukemia. Orthologous to human CRKL (CRK like proto-oncogene, adaptor
    protein) and CRK (CRK proto-oncogene, adaptor protein).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00000416;class=Gene
  source_id: WB:WBGene00000416
