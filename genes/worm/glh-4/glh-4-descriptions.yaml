gene_symbol: glh-4
organism: worm
uniprot_id: O76743
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Probable ATP-binding RNA helicase. May act redundantly with the P-granule
    component glh-1 to regulate the formation of the granular structure of P-granules
    in embryos (PubMed:21402787, PubMed:24746798). May protect somatic cells from
    excessive apoptosis during normal development (PubMed:27650246).
  source_type: curated
  url: https://www.uniprot.org/uniprot/O76743
  source_id: O76743
- source: Alliance_Imported
  text: glh-4 encodes a putative germline RNA helicase that affects germline proliferation,
    oogenesis, spermatogenesis, and hence fertility in combination with glh-1, and
    is partially redundant with glh-1; glh-4 is a constituent of P granules and expression
    is most abundant in newly fertilized embryos.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00001601;class=Gene
  source_id: WB:WBGene00001601
- source: Alliance_Automated
  text: Enables JUN kinase binding activity. Involved in gamete generation and regulation
    of cell population proliferation. Located in P granule.
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00001601;class=Gene
  source_id: WB:WBGene00001601
