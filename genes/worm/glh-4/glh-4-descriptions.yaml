    - rubric: completeness
      score: 3
    - rubric: specificity
      score: 3
    overall_notes: Correct on redundancy with glh-1 for fertility and P granule localization,
      but calls GLH-4 'putative' and says nothing about Argonaute recruitment or piRNA
      surveillance.
