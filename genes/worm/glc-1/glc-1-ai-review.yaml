  review:
    summary: >-
      PAINT propagation of an excitatory channel term from the anion-selective
      PTN001055382 node.
    action: MODIFY
    reason: >-
      The PANTHER node is the correct broad anion-selective GluCl/glycine
      receptor lineage, but GO:0005231 carries the wrong sign for GLC-1. GLC-1
      is a chloride channel, and mature C. elegans GluCl target circuits are
      inhibited rather than excited by ivermectin-induced chloride current.
      Although the family review left the PAINT node unresolved because its seeds
      are experimental and glycinergic currents can be depolarizing in immature
      vertebrate neurons, inhibitory extracellular ligand-gated channel activity
      is the more accurate sign-broadened replacement for this anion-selective
      nematode GluCl.
    proposed_replacement_terms:
    - id: GO:0005237
      label: inhibitory extracellular ligand-gated monoatomic ion channel activity
    supported_by:
    - reference_id: file:interpro/panther/PTHR18945/PTHR18945-review.yaml
      supporting_text: Anion-selective glycine receptor and invertebrate chloride-channel lineage
    - reference_id: PMID:21572436
      supporting_text: >-
        neurotransmitter-gated, chloride-selective ion channels generally oppose
        normal excitability and repolarize the cell
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - GRANULARITY_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN001055382
        source_label: Anion-selective glycine receptor and invertebrate chloride-channel lineage
