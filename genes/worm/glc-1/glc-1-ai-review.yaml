- id: PMID:21572436
  title: Principles of activation and permeation in an anion-selective Cys-loop receptor.
  findings:
  - statement: >-
      Structures of C. elegans GluClcryst show a homopentameric, anion-selective
      Cys-loop receptor with extracellular glutamate sites, an intersubunit
      ivermectin site and a chloride pore.
    supporting_text: >-
      Ivermectin is bound at each of the GluClcryst subunit interfaces in the TM
      domain whereas glutamate electron density is present in all five of the
      classical neurotransmitter binding sites in the ECD.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text cached. Structural and biochemical evidence for GLC-1
      homopentamers, L-glutamate binding, ivermectin allosteric activation and
      the chloride-selective transmembrane pore.
