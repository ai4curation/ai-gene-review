id: G5EBR3
gene_symbol: glc-1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: >-
  glc-1 encodes a Cys-loop glutamate-gated chloride channel alpha subunit. GLC-1
  forms pentameric anion-selective channels at the cell membrane: recombinant
  GLC-1 homomers conduct chloride and open in response to the antiparasitic
  allosteric agonist ivermectin, with ivermectin also licensing glutamate binding
  and potentiation of the homomer. Early Xenopus oocyte reconstitution showed
  that GLC-1 can pair with the GLC-2 beta subunit in glutamate- and
  ivermectin-gated heteromers. In the C. elegans motor system, glc-1 contributes
  with other GluCl alpha-subunit genes, including avr-14 and avr-15, to
  ivermectin-sensitive control of locomotory behavior.
