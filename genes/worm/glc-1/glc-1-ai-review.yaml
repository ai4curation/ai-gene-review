suggested_questions:
- question: >-
    Which native C. elegans cells express GLC-1 protein, and are GLC-1-containing
    receptors concentrated at postsynaptic sites or in extra-synaptic plasma
    membrane domains?
- question: >-
    Do native GLC-1-containing channels assemble as GLC-1 homomers, GLC-1/GLC-2
    heteromers, or larger combinations with AVR-14, AVR-15 and other GluCl alpha
    subunits?
- question: >-
    Which Brugia, Onchocerca and Haemonchus GluCl paralogs are the direct
    orthologs or functional analogs of C. elegans glc-1 in ivermectin-sensitive
    motor circuits?
suggested_experiments:
- description: >-
    Endogenously tag GLC-1 and co-image it with presynaptic markers, AVR-14,
    AVR-15 and GLC-2 in motor-circuit neurons before and after ivermectin.
  hypothesis: >-
    GLC-1-containing receptors occupy defined neuronal plasma-membrane
    subdomains and assemble with other GluCl subunits in the motor system.
- description: >-
    Reconstitute candidate parasite GluCl subunits with C. elegans GLC-1 and
    GLC-2 in oocytes and measure glutamate-, ivermectin- and picrotoxin-dependent
    chloride currents.
  hypothesis: >-
    Parasite orthologs differ in ivermectin sensitivity but retain the
    allosteric coupling mechanism defined by C. elegans GLC-1 structures.
