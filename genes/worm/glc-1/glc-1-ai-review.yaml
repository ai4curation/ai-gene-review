  evidence_type: IDA
  original_reference_id: PMID:7935817
  qualifier: enables
  review:
    summary: Original functional cloning of C. elegans GluCl subunits in Xenopus oocytes.
    action: ACCEPT
    reason: >-
      Heteromeric core molecular function. GLC-1 is one of the two C. elegans
      cDNAs Cully et al. cloned as functional avermectin-sensitive
      glutamate-gated chloride-channel subunits, and the GLC-1/GLC-2 heteromer
      had glutamate-gated and ivermectin-gated chloride currents. Purified GLC-1
