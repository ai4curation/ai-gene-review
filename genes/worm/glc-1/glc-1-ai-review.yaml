      reason: >-
        GO currently places the glutamate-gated chloride channel term under the
        excitatory ligand-gated channel parent, but GLC-1 is an anion-selective
        inhibitory channel. The child term is correct for this gene; the
        excitatory ancestor and the automated excitatory-postsynaptic-potential
        row are the claims being rejected.
