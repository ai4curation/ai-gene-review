- term:
    id: GO:0032794
    label: GTPase activating protein binding
  evidence_type: IPI
  original_reference_id: PMID:22363657
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q22354
  review:
    summary: The interaction between MPZ-1 PDZ domains 8-10 and RHGF-2 (Q22354) is
      well supported (Y2H, GST pull-down that depends on the RHGF-2 C-terminal SDV
      motif, co-IP, co-localization). However, RHGF-2 is a Rho guanine-nucleotide
      exchange factor (GEF), not a GTPase-activating protein (GAP).
    action: REMOVE
    reason: GO:0032794 is defined as binding to a GTPase activating protein. The full
      text of PMID:22363657 shows that the partner, RHGF-2, has RhoGEF activity
      specific for RHO-1, which is the opposite regulatory activity. RHGF-2 is not
      described as a GAP anywhere in the paper. The interaction is real, but the term
      makes a false claim about the partner. GO has no guanyl-nucleotide exchange
      factor binding term to repoint to, and bare protein binding is excluded by
      policy, so the row is removed and flagged upstream. Whether MPZ-1 acts as a GEF
      adaptor (GO:0005091) has not been tested.
    supported_by:
    - reference_id: PMID:22363657
      supporting_text: RHGF-2 GEF activity is specific to RHO-1, the C. elegans RhoA
        homolog
    - reference_id: PMID:22363657
      supporting_text: RHGF-2 bound strongly to MPZ-1 PDZ domain 8 and to a lesser extent
        to PDZ domains 9 and 10, but not at all to PDZ domains 1–7 (Fig. 1A).
    source_defects:
    - defect_type: WRONG_TERM
      resource: WORMBASE
      slot: GO_ID
      requested_change: CHECK
      asserted_value: GO:0032794
      confidence: PROBABLE
      explanation: >-
        This IPI row gives MPZ-1 (G5ECZ8) GTPase activating protein binding with
        RHGF-2 (UniProtKB:Q22354, T08H4.1) in With/From. PMID:22363657 shows that
        RHGF-2 is a RHO-1-specific guanine nucleotide exchange factor (RhoGEF),
