core_functions:
- description: Multi-PDZ scaffold that binds the C-terminal PDZ ligands of signalling
    proteins. The best-defined interaction is with the 5-HT2-like serotonin receptor
    SER-1 at PDZ10, which facilitates serotonin-stimulated egg laying in vulval muscle.
    Further PDZ-ligand partners are the RhoGEF RHGF-2 (PDZ8), the mGluR MGL-1 and the
    arrestin ARR-1.
  molecular_function:
    id: GO:0031821
    label: G protein-coupled serotonin receptor binding
  locations:
  - id: GO:0045202
    label: synapse
  - id: GO:0030424
    label: axon
  supported_by:
  - reference_id: PMID:16890216
    supporting_text: SER-1 binds specifically to PDZ domain 10 of the multi-PDZ domain
      protein, MPZ-1, based on GST pulldown and co-immunoprecipitation.
  - reference_id: PMID:16890216
    supporting_text: These studies suggest that the SER-1/MPZ-1 interaction facilitates
      SER-1 mediated signaling.
suggested_questions:
- question: Does the ARR-1/MPZ-1/DAF-18 complex directly inhibit DAF-18/PTEN lipid
    phosphatase activity, and does MPZ-1 bridge ARR-1 and DAF-18 or bind DAF-18
    directly?
- question: Should GO provide a guanyl-nucleotide exchange factor binding term? Without
    one, the well-supported MPZ-1/RHGF-2 interaction cannot be annotated more
    specifically than protein binding.
- question: Does MPZ-1 positively regulate SER-1 serotonin receptor signalling in vulval
    muscle (a candidate regulation-of-signalling annotation), given that the RNAi
    effect depends on the SER-1 PDZ-binding motif?
suggested_experiments:
- description: Reconstitute ARR-1, MPZ-1 and DAF-18 in vitro and measure DAF-18
    PIP3 phosphatase activity with and without MPZ-1 or the ARR-1 PDZ ligand.
  hypothesis: MPZ-1 acts as an adaptor that brings ARR-1 to DAF-18 and lowers DAF-18
    phosphatase activity, which would give positive regulation of DAF-2 signalling.
- description: Test serotonin-stimulated egg laying in mpz-1 null alleles, or in
    endogenous knock-ins lacking PDZ10, with and without SER-1.
  hypothesis: MPZ-1 PDZ10 is required for full SER-1 signalling in vulval muscle.
