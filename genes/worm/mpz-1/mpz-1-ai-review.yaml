id: G5ECZ8
gene_symbol: mpz-1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: >-
  MPZ-1 (Multiple PDZ domain protein 1, C52A11.4) is a large multi-PDZ scaffold
  protein of the MUPP1/PATJ family, with ten PDZ domains separated by long
  disordered linkers and no catalytic or transmembrane domain. It is expressed in
  many neurons, in body wall and vulval muscle, and in the excretory canal and
  spermatheca. In neurons it is punctate at synapses and enriched in nerve-ring
  axons. Its PDZ domains bind the C-terminal PDZ ligands of several partners: the
  5-HT2-like serotonin receptor SER-1 (PDZ10), the metabotropic glutamate receptor
  MGL-1, the RHO-1-specific RhoGEF RHGF-2 (mainly PDZ8), the arrestin ARR-1 and the
  PALS1 ortholog MAGU-2. In vulval muscle MPZ-1 facilitates SER-1-dependent,
  serotonin-stimulated egg laying. With ARR-1 and the PTEN ortholog DAF-18 it forms
  a complex that positively regulates DAF-2 insulin/IGF-1-like receptor signalling
  and affects lifespan.
