- term:
    id: GO:0046628
    label: positive regulation of insulin receptor signaling pathway
  evidence_type: NAS
  original_reference_id: PMID:20207731
  qualifier: involved_in
  review:
    summary: Complex Portal annotation of the ARR-1/MPZ-1/DAF-18 complex (CPX-3881),
      which positively regulates DAF-2 insulin/IGF-1-like receptor signalling.
    action: KEEP_AS_NON_CORE
    reason: The abstract states that ARR-1 positively regulates DAF-2 signalling
      through direct interaction with MPZ-1, and that ARR-1, MPZ-1 and DAF-18/PTEN
      form a complex. The genetic and biochemical data are in the full text, which
      could not be retrieved here, and the Complex Portal curators had read it. A
      positive regulatory role in DAF-2 signalling is plausible and consistent, but it
      is one of several signalling contexts in which MPZ-1 acts as a scaffold. It is
      kept as a non-core process annotation.
    supported_by:
    - reference_id: PMID:20207731
      supporting_text: Genetic and biochemical analysis reveal that ARR-1 functions to
        regulate DAF-2 signaling via direct interaction with MPZ-1, a multi-PDZ
        domain-containing protein, via a C-terminal PDZ binding domain in ARR-1.
    - reference_id: PMID:20207731
      supporting_text: Our results suggest that the ARR-1-MPZ-1-DAF-18 complex functions
        to regulate DAF-2 signaling in vivo
- term:
    id: GO:0062049
    label: protein phosphatase inhibitor complex
  evidence_type: NAS
  original_reference_id: PMID:20207731
  qualifier: part_of
  review:
    summary: Complex Portal places MPZ-1 in the ARR-1/MPZ-1/DAF-18 complex (CPX-3881)
      and types it as a phosphatase inhibitor complex. Complex Portal describes the
      inhibition of DAF-18/PTEN phosphatase activity as probable.
    action: KEEP_AS_NON_CORE
    reason: The abstract directly supports a complex of ARR-1, MPZ-1 and DAF-18. The
      inhibitory character is an inference from the opposing genetic roles (ARR-1
      promotes DAF-2 signalling, whereas DAF-18/PTEN suppresses it), which Complex
      Portal itself qualifies as probable. Without the full text, this review cannot
      confirm or refute that inhibition. The complex membership is kept as non-core,
      and inhibition of DAF-18 by the complex is raised as a question.
    supported_by:
    - reference_id: PMID:20207731
      supporting_text: ARR-1 and MPZ-1 are found in a complex with the phosphatase and
        tensin homolog (PTEN) ortholog DAF-18, which normally serves as a suppressor of
        DAF-2 signaling
- term:
    id: GO:0031821
    label: G protein-coupled serotonin receptor binding
  evidence_type: IPI
  original_reference_id: PMID:16890216
  qualifier: enables
  review:
    summary: The C-terminal PDZ-binding motif of SER-1, a 5-HT2-like serotonin GPCR,
      binds specifically to MPZ-1 PDZ domain 10 (GST pull-down and
      co-immunoprecipitation). The interaction is functionally relevant to
      serotonin-stimulated egg laying.
    action: NEW
    reason: This is an experimentally demonstrated binding activity of MPZ-1 itself,
      mapped to a single PDZ domain, and it replaces the uninformative protein-binding
      rows with a specific partner class. MPZ-1 also binds other GPCRs that have acidic
      residues at the -3 position of their PDZ ligands (PMID:16890216) and binds MGL-1
      in yeast two-hybrid assays (PMID:30417267). This is a molecular-function
      annotation, not a process inference from phenotype.
    supported_by:
    - reference_id: PMID:16890216
      supporting_text: SER-1 binds specifically to PDZ domain 10 of the multi-PDZ domain
        protein, MPZ-1, based on GST pulldown and co-immunoprecipitation.
    - reference_id: PMID:16890216
      supporting_text: MPZ-1 also interacts with other GPCRs with acidic amino acids in
        the -3 position of their PDZ binding motifs.
