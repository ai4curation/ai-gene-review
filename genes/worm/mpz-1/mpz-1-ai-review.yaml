- term:
    id: GO:0016020
    label: membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  supporting_entities:
  - UniProtKB-SubCell:SL-0162
  review:
    summary: Electronic mapping of the UniProt subcellular location "Membrane", which
      in this unreviewed entry rests on an ARBA association rule.
    action: KEEP_AS_NON_CORE
    reason: MPZ-1 has no transmembrane segment or signal peptide, so it cannot be an
      integral membrane protein. The UniProt location comes from an ARBA rule and is
      not independent evidence. Membrane association is still plausible for a PDZ
      scaffold that binds the cytoplasmic tails of GPCRs (SER-1, MGL-1) and is
      punctate at synapses. The term is kept but treated as peripheral to the core
      function. No more specific membrane sub-compartment has direct evidence.
    supported_by:
    - reference_id: PMID:16890216
      supporting_text: SER-1 binds specifically to PDZ domain 10 of the multi-PDZ domain
        protein, MPZ-1, based on GST pulldown and co-immunoprecipitation.
