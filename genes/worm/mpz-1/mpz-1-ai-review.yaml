- id: PMID:22363657
  title: RHGF-2 is an essential Rho-1 specific RhoGEF that binds to the multi-PDZ
    domain scaffold protein MPZ-1 in Caenorhabditis elegans.
  findings:
  - statement: RHGF-2 binds MPZ-1 PDZ domain 8 (and more weakly 9 and 10) through its
      C-terminal class I PDZ-binding motif.
    supporting_text: RHGF-2 bound strongly to MPZ-1 PDZ domain 8 and to a lesser extent
      to PDZ domains 9 and 10, but not at all to PDZ domains 1–7 (Fig. 1A).
  - statement: RHGF-2 is a RHO-1-specific GEF, not a GAP.
    supporting_text: RHGF-2 GEF activity is specific to RHO-1, the C. elegans RhoA
      homolog
  - statement: MPZ-1::tagRFP localizes to nerve-ring axons.
    supporting_text: MPZ-1::tagRFP was most strongly localized to the axons of the
      nerve ring where RHGF-2::GFP was also highly distributed
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text read. It supports the axon localization and the
      RHGF-2 interaction, but it shows that the partner is a GEF, which contradicts
      the GTPase activating protein binding term attached to it.
- id: PMID:30417267
  title: Yeast two-hybrid screening identifies MPZ-1 and PTP-1 as candidate
