        partner incorrectly. GO has no GEF-binding term. Please consider deleting
        the row, or replacing it with a term that does not misstate the partner's
        activity.
      supported_by:
      - reference_id: PMID:22363657
        supporting_text: RHGF-2 GEF activity is specific to RHO-1, the C. elegans RhoA
