    elegans.
  findings:
  - statement: MPZ-1 binds MGL-1 in Y2H, but mpz-1 deletion mutants have largely
      normal MGL-1-dependent pharyngeal responses.
    supporting_text: The mpz-1 mutants displayed a largely wild-type response to
      L-CCG-I, suggesting MGL-1 signalling is not overtly disrupted
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract only.
- id: PMID:35247383
  title: Identification and characterization of Crumbs polarity complex proteins in
    Caenorhabditis elegans.
  findings:
  - statement: MPZ-1 is a candidate PATJ ortholog that binds MAGU-2/PALS1 but is not
      broadly epithelial, so it is unlikely to be a core Crumbs complex component.
    supporting_text: However, MPZ-1 is not broadly expressed in epithelial tissues
      and, therefore, not likely a core component of the C. elegans Crumbs complex.
  - statement: An endogenous MPZ-1::GFP knock-in is expressed in neurons, excretory
      canal and spermatheca.
    supporting_text: we did not observe expression in epithelial tissues, apart from
      the spermatheca and excretory canal
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text checked.
