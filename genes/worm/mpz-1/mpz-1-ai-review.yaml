- id: PMID:16890216
  title: SER-1, a Caenorhabditis elegans 5-HT2-like receptor, and a multi-PDZ domain
    containing protein (MPZ-1) interact in vulval muscle to facilitate
    serotonin-stimulated egg-laying.
  findings:
  - statement: SER-1 binds MPZ-1 PDZ domain 10 via its C-terminal PDZ ligand.
    supporting_text: SER-1 binds specifically to PDZ domain 10 of the multi-PDZ domain
      protein, MPZ-1, based on GST pulldown and co-immunoprecipitation.
  - statement: MPZ-1 is expressed in about 60 neurons and in body wall and vulval
      muscle, and is punctate at synapses.
    supporting_text: mpz-1 is expressed in about 60 neurons and body wall and vulval
      muscles.
  - statement: mpz-1 RNAi reduces serotonin-stimulated egg laying only when SER-1
      retains its PDZ-binding motif.
    supporting_text: mpz-1 RNAi reduces 5-HT stimulated egg-laying in wild type
      animals and in ser-1 mutants rescued by muscle expression of SER-1.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract only. The title, PMID and content match the PubMed search
      for mpz-1. Primary source for the SER-1 interaction and synaptic localization.
