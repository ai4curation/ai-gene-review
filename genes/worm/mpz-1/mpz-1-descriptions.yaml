descriptions:
- source: Alliance_Imported
  text: mpz-1 encodes a multi-PDZ domain scaffold protein; mpz-1(RNAi) animals have
    reduced serotonin (5-HT)-stimulated egg laying unless truncated SER-1 is transgenically
    expressed in vulval muscle; overexpressed MPZ-1 PDZ domain 10 also reduces SER-1-mediated
    egg laying; the PDZ domain 10 of MPZ-1 binds the C-terminal PDZ-binding motif
    (ETFL) of the 5-HT receptor SER-1; MPZ-1 also physically interacts with the RHGF-2
    RhoGEF, and may also bind NPR-1 and ZC84.4; MPZ-1 binding enhances SER-1 activity;
    mpz-1 is expressed in the nerve ring, pharyngeal, body, and tail neurons, as well
    as body wall and vulval muscles; mpz-1 is coexpressed with ser-1 in three neuron
    types and vulval muscle; MPZ-1 co-localizes with SNB-1 in neuronal puncta and
    with RHGF-2 in nerve ring axons; mpz-1 may be translationally regulated by a small
    upstream open reading frame (uORF).
  source_type: curated
