  text: pgl-2 encodes a novel protein of 532 amino acids that, in C. elegans, is one
    of three PGL protein family members; PGL-2 associates with P granules during postembryonic
    development; PGL-2 interacts with PGL-1, an additional P granule component, in
    yeast two-hybrid assays, but neither protein is required for proper localization
    of the other.
