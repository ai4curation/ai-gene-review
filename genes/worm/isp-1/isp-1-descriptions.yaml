descriptions:
- source: Alliance_Imported
  text: isp-1 encodes a Rieske iron sulphur protein (ISP) which is a subunit of the
    mitochondrial complex III in the mitochondrial membrane; the subunits are highly
    conserved in all mitochondria and aerobic bacteria; mitochondrial complex III
    catalyses electron transport from ubiquinol to cytochrome c; isp-1 mutants show
    low oxygen consumption, a decreased sensitivity to reactive oxygen species and
    increased lifespan suggesting that mitochondrial electron transport is a key factor
    affecting life span; isp-1 affects the rates of physiological processes like reproduction
    and development and also affects behavior.
  source_type: curated
