    overall_notes: 'Correct: Rieske subunit of complex III, ubiquinol to cytochrome
      c, low O2 consumption and long lifespan of mutants. ''Decreased sensitivity
      to ROS'' framing is older; lifespan extension is now attributed to a superoxide
      signal.'
- source: Alliance_Automated
  text: Predicted to enable oxidoreductase activity. Involved in mitochondrial electron
    transport, ubiquinol to cytochrome c. Predicted to be located in mitochondrial
    inner membrane. Predicted to be part of respiratory chain complex III. Is expressed
    in several structures, including enteric muscle; intestine; nervous system; rectal
    epithelium; and reproductive system. Human ortholog(s) of this gene implicated
    in mitochondrial complex III deficiency. Orthologous to several human genes including
    UQCRFS1 (ubiquinol-cytochrome c reductase, Rieske iron-sulfur polypeptide 1).
