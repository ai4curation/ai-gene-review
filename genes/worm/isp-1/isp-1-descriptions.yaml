gene_symbol: isp-1
organism: worm
uniprot_id: O44512
taxon_id: NCBITaxon:6239
descriptions:
- source: Alliance_Imported
  text: isp-1 encodes a Rieske iron sulphur protein (ISP) which is a subunit of the
    mitochondrial complex III in the mitochondrial membrane; the subunits are highly
    conserved in all mitochondria and aerobic bacteria; mitochondrial complex III
    catalyses electron transport from ubiquinol to cytochrome c; isp-1 mutants show
    low oxygen consumption, a decreased sensitivity to reactive oxygen species and
    increased lifespan suggesting that mitochondrial electron transport is a key factor
    affecting life span; isp-1 affects the rates of physiological processes like reproduction
    and development and also affects behavior.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00002162;class=Gene
  source_id: WB:WBGene00002162
- source: Alliance_Automated
  text: Predicted to enable oxidoreductase activity. Involved in mitochondrial electron
    transport, ubiquinol to cytochrome c. Predicted to be located in mitochondrial
    inner membrane. Predicted to be part of respiratory chain complex III. Is expressed
    in several structures, including enteric muscle; intestine; nervous system; rectal
    epithelium; and reproductive system. Human ortholog(s) of this gene implicated
    in mitochondrial complex III deficiency. Orthologous to several human genes including
    UQCRFS1 (ubiquinol-cytochrome c reductase, Rieske iron-sulfur polypeptide 1).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00002162;class=Gene
  source_id: WB:WBGene00002162
