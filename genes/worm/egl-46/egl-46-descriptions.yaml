  text: Enables RNA polymerase II-specific DNA-binding transcription factor binding activity.
    Involved in several processes, including detection of oxygen; generation of neurons; and
    positive regulation of exit from mitosis. Located in nucleus. Is expressed in several
    structures, including QL; QL.aa; QL.pp; QR; and neurons. Orthologous to human INSM1 (INSM
    transcriptional repressor 1) and INSM2 (INSM transcriptional repressor 2).
