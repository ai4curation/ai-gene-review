- source: Alliance_Imported
  text: egl-46 encodes a transcription factor with similarity to the TFIIA-like zinc-finger
    protein family; egl-46 activity is required for coordinated locomotion, morphology and
    process formation of the touch cells, male mating efficiency, HSN cell migration, differentiation,
    and axonal outgrowth, serotonin production and also terminal divisions of the Q neuroblasts;
    egl-46 acts to inhibit touch cell fate in FLP cells together with egl-44; EGL-46 is a
    nuclear protein expressed dynamically in neurons, including the touch receptor neurons,
    ventral cord neurons, FLP, and HSN neurons; egl-46 expression in FLP cells, but not HSN
    cells, is dependent upon EGL-44.
