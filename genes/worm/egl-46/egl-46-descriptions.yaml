findings:
- category: discrepancy
  text: WormBase says egl-46 is required for the terminal divisions of the Q neuroblasts;
    egl-46 mutants instead make an extra division, because EGL-44/EGL-46 instructs cell-cycle
    exit after the terminal division (PMID:23946438). Recorded as a PROBABLE WRONG_STATEMENT
    defect.
  sources:
  - Alliance_Imported
- category: discrepancy
  text: WormBase calls EGL-46 similar to the TFIIA-like zinc-finger family; UniProt and the
    literature place it in the INSM1/INSM2 family (TFIIA has no zinc fingers). Recorded as
    a PROBABLE OUTDATED_STATEMENT defect.
  sources:
  - Alliance_Imported
  - UniProt
- category: gap
  text: WormBase omits the BAG gas-sensing, PVD dendrite and HOB/DAF-19M roles and the direct
    EGL-44/EGL-46 repressor complex with its ZAG-1 loop, all of which UniProt covers.
  sources:
  - Alliance_Imported
- category: gap
  text: UniProt FUNCTION omits EGL-46's place in the HSN serotonergic transcription factor
    collective (PMID:29553368), which WormBase alludes to as serotonin production; recorded
    as a MISSING_STATEMENT defect.
  sources:
  - UniProt
- category: gap
  text: WormBase lists coordinated locomotion and touch-cell morphology and process formation
    among egl-46 phenotypes; no paper supporting these was found, so they are not in the review.
  sources:
  - Alliance_Imported
- category: discrepancy
  text: The automated text leads with detection of oxygen and positive regulation of exit
    from mitosis, which the review marks over-annotated and modifies, and lists no transcription
    factor activity of EGL-46 itself.
  sources:
  - Alliance_Automated
  - RefSeq
review:
  reviewer: AI
  rubrics:
  - rubric: overall_concordance
    score: 3
  overall_notes: UniProt and WormBase agree on a zinc-finger transcription factor acting with
    EGL-44 in neuron identity, but WormBase misstates the Q-lineage role and family, and each
    omits roles the other covers. The automated texts are dominated by over-annotated process
    terms.
