id: G5EFY4
gene_symbol: egl-46
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: EGL-46 is the C. elegans member of the INSM (insulinoma-associated) family of C2H2 zinc-finger
  transcription factors, orthologous to human INSM1 and INSM2. It is a nuclear protein expressed in many
  developing and mature neurons, including the touch receptor neurons, FLP, HSN, BAG, HOB, PVD, ventral
  cord motor neurons and the Q neuroblast lineage. Through its C-terminal zinc-finger region it binds
  the TEA-domain region of the TEAD factor EGL-44, and the EGL-44/EGL-46 complex is a transcriptional
  repressor. In the FLP neurons, which share the UNC-86/MEC-3 selector with the touch receptor neurons,
  the complex keeps touch-receptor genes off and represses zag-1, while ZAG-1 represses egl-44 and egl-46
  in the touch cells, so the two sets of factors form a bistable switch between the two fates. With EGL-44
  it also stops Q-lineage neuron precursors from dividing again after their terminal division and promotes
  commissural dendrite branching of the PVD nociceptor. EGL-46 also acts where EGL-44 is not needed. In
  the HSN motor neurons it is one of a collective of six transcription factors that activates the serotonergic
  gene battery, apparently in part through INSM binding sites, and mouse Insm1 can replace it there. In
  the male HOB neuron it acts upstream of the RFX factor DAF-19M to switch on the polycystin genes lov-1
  and pkd-2 needed for vulva location. In the BAG neurons it helps switch on the oxygen- and carbon dioxide-sensing
  guanylyl cyclases, in parallel with ETS-5 and EGL-13.
