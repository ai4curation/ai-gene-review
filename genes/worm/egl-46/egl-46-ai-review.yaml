- id: file:worm/egl-46/egl-46-deep-research-wormbase.md
  title: WormBase gene description for egl-46 (worm)
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: DISPUTED
    review_notes: WormBase curated description (uncited, undated). Correct - inhibition of touch fate
      in FLP with egl-44 (PMID:11274062, PMID:8187641), male mating efficiency (PMID:12954713), HSN differentiation
      and serotonin (PMID:29553368), nuclear expression in touch cells, ventral cord, FLP and HSN, and
      egl-44 dependence in FLP but not HSN (PMID:11274062). HSN migration and axonal outgrowth match WormBase's
      own IMP rows from PMID:11274062 but are not in its abstract. Wrong or misleading - "required for
      ... terminal divisions of the Q neuroblasts" (egl-46 mutants make an extra division; PMID:23946438)
      and the "TFIIA-like" family label (INSM family; TFIIA has no zinc fingers). Not traced - coordinated
      locomotion, and morphology and process formation of the touch cells. Missing - BAG, PVD and HOB/DAF-19
      roles, the HSN transcription factor collective, and the EGL-44 complex and ZAG-1 loop.
    source_defects:
    - defect_type: WRONG_STATEMENT
      resource: WORMBASE
      record: WB:WBGene00001210
      slot: MOD_provided_gene_description
      requested_change: CHECK
      asserted_value: egl-46 activity is required for coordinated locomotion, morphology and process formation
        of the touch cells, male mating efficiency, HSN cell migration, differentiation, and axonal outgrowth,
        serotonin production and also terminal divisions of the Q neuroblasts
      confidence: PROBABLE
      explanation: Read literally, the sentence says egl-46 is needed for the terminal divisions of the
        Q neuroblasts to happen. The Q-lineage data show the opposite direction - egl-46 mutants (for
        example cas36) produce an extra neuron because a precursor divides again, and EGL-44 with EGL-46
        instructs cell-cycle exit after the terminal division (PMID:23946438). The clause should say that
        egl-46 is required for Q-lineage cells to exit the cell cycle after their terminal division. Confidence
        is PROBABLE because the wording may have been meant as "for the divisions to be terminal".
      supported_by:
      - reference_id: PMID:23946438
        supporting_text: The TEAD TF EGL-44, in a physical association with the zinc-finger TF EGL-46,
          instructs cell cycle exit after the terminal division.
      - reference_id: file:worm/egl-46/egl-46-uniprot.txt
        record_section: ["FT:MUTAGEN"]
        supporting_text: In cas36; production of an extra neuron from the Q lineage.
    - defect_type: OUTDATED_STATEMENT
      resource: WORMBASE
      record: WB:WBGene00001210
      slot: MOD_provided_gene_description
      requested_change: CHECK
      asserted_value: egl-46 encodes a transcription factor with similarity to the TFIIA-like zinc-finger
        protein family
      confidence: PROBABLE
      explanation: EGL-46 belongs to the INSM (insulinoma-associated, INSM1/INSM2) family of C2H2 zinc-finger
        transcription factors, which Wu et al. defined as a new zinc-finger family (PMID:11274062). TFIIA
        is a general transcription factor without zinc fingers; "TFIIA-like" appears to be a slip for
        TFIIIA-type (C2H2) zinc fingers. The text should name the INSM family and the INSM1/INSM2 orthology.
      supported_by:
      - reference_id: PMID:11274062
        supporting_text: The product of the egl-46 gene, two Drosophila proteins, and two proteins in
          human and mice define a new family of zinc finger proteins.
      - reference_id: file:worm/egl-46/egl-46-uniprot.txt
        record_section: ["CC:SIMILARITY"]
        supporting_text: Belongs to the INSM1 family.
    - defect_type: MISSING_STATEMENT
      resource: WORMBASE
      record: WB:WBGene00001210
      slot: MOD_provided_gene_description
      requested_change: ADD
      asserted_value: WB:WBGene00001210
      confidence: CONFIRMED
      explanation: The description omits the direct EGL-44/EGL-46 repressor complex and its ZAG-1 feedback
        loop (PMID:30291162), EGL-46 as a member of the HSN serotonergic transcription factor collective
        (PMID:29553368), its roles in BAG gas-sensing identity (PMID:25395666), in the HOB neuron upstream
        of DAF-19M (PMID:20923979) and in PVD commissural dendrites (PMID:29031632), and its INSM1/INSM2
        orthology.
      supported_by:
      - reference_id: PMID:30291162
        supporting_text: The FLP neurons fail to activate TRN genes, however, because a complex of two
          transcriptional repressors (EGL-44/EGL-46) prevents their expression.
      - reference_id: PMID:25395666
        supporting_text: We report here the identification of EGL-46, a zinc-finger transcription factor,
          which regulates BAG gas-sensing fate in partially parallel pathways to ETS-5 and EGL-13.
      - reference_id: PMID:29553368
        supporting_text: 'At least four genes matched this criteria: the POU domain TF unc-86, the Spalt-type
          Zn finger TF sem-4, the bHLH domain TF hlh-3 and the Insm-type Zn finger TF egl-46'
