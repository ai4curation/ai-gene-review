- id: file:worm/egl-46/egl-46-notes.md
  title: Review notes for C. elegans egl-46 (manual literature search)
  findings: []
core_functions:
- description: With its direct partner EGL-44, EGL-46 forms a transcriptional repressor complex that keeps
    touch-receptor genes and zag-1 off in the FLP neurons, locking in the FLP rather than the touch-receptor
    fate, and that stops Q-lineage precursors from dividing after their terminal division.
  molecular_function:
    id: GO:0001227
    label: DNA-binding transcription repressor activity, RNA polymerase II-specific
  directly_involved_in:
  - id: GO:0000122
    label: negative regulation of transcription by RNA polymerase II
  - id: GO:0030182
    label: neuron differentiation
  locations:
  - id: GO:0005634
    label: nucleus
  in_complex:
    id: GO:0017053
    label: transcription repressor complex
  supported_by:
  - reference_id: PMID:30291162
    supporting_text: The FLP neurons fail to activate TRN genes, however, because a complex of two transcriptional
      repressors (EGL-44/EGL-46) prevents their expression.
  - reference_id: file:worm/egl-46/egl-46-uniprot.txt
    record_section: ["CC:SUBUNIT"]
    supporting_text: Interacts (via C-terminus) with egl-44 (via N-terminus); the interaction is direct
- description: Independently of EGL-44, EGL-46 is one of several transcription factors that switch on
    and maintain neuron-type identity genes - the serotonergic battery in HSN (partly through INSM binding
    sites), the polycystin genes in the male HOB neuron upstream of DAF-19M, and the gas-sensing guanylyl
    cyclases in BAG.
  molecular_function:
    id: GO:0000981
    label: DNA-binding transcription factor activity, RNA polymerase II-specific
  directly_involved_in:
  - id: GO:0045944
    label: positive regulation of transcription by RNA polymerase II
  - id: GO:0030182
    label: neuron differentiation
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:29553368
    supporting_text: bas-1prom13 contains bHLH- and INSM-binding sites and INMS-binding site mutation,
      but not bHLH mutation, leads to expression defects which suggest a direct role for EGL-46 in robust
      bas-1 expression (Figure 5F).
  - reference_id: PMID:20923979
    supporting_text: In the male-specific HOB neuron, DAF-19(M) acts downstream of the zinc finger TF
      EGL-46, indicating that a TF cascade controls the PKD gene battery in this cell-type specific context.
suggested_questions:
- question: Does EGL-46 bind DNA on its own through its zinc fingers, as the INSM-site requirement in
    HSN enhancers suggests, or only as part of the EGL-44/EGL-46 complex?
- question: How does the same protein repress target genes with EGL-44 in FLP and activate serotonergic
    genes in HSN, where EGL-44 is not needed for its expression? Are there distinct partners or co-repressors
    in each cell?
- question: Do the HSN migration and axon defects reported for egl-46 reflect guidance, outgrowth, or
    an earlier failure of HSN differentiation?
- question: Is EGL-46 required cell-autonomously in BAG, given that its expression there is transient?
suggested_experiments:
- description: Map EGL-46 binding genome-wide (CUT&RUN on an endogenous tag) in FLP-, HSN- and BAG-enriched
    cells, with and without egl-44, and test purified EGL-46 zinc fingers on INSM sites by EMSA.
  hypothesis: EGL-46 binds INSM sites directly in HSN and BAG, while at TRN genes in FLP its recruitment
    depends on EGL-44.
  experiment_type: CUT&RUN / EMSA
- description: Deplete EGL-46 with a cell-specific degron in BAG or HSN after their birth and score terminal
    gene expression and sensory or egg-laying behaviour.
  hypothesis: EGL-46 acts cell-autonomously and is needed continuously to maintain terminal identity genes.
  experiment_type: tissue-specific protein depletion
