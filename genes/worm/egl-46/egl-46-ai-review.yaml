- term:
    id: GO:0031536
    label: positive regulation of exit from mitosis
  evidence_type: IMP
  original_reference_id: PMID:23946438
  qualifier: involved_in
  review:
    summary: In egl-46 mutants a Q-lineage precursor divides one extra time, producing an extra neuron.
    action: MODIFY
    reason: The GO term names the transition from anaphase/telophase to G1 within a mitotic cycle. The
      egl-46 defect is not in completing mitosis but in withdrawing from further cycles after the terminal
      division, which negative regulation of neuroblast proliferation describes. Same correction as on
      the egl-44 row from this paper.
    proposed_replacement_terms:
    - id: GO:0007406
      label: negative regulation of neuroblast proliferation
    supported_by:
    - reference_id: PMID:23946438
      supporting_text: The TEAD TF EGL-44, in a physical association with the zinc-finger TF EGL-46, instructs
        cell cycle exit after the terminal division.
    - reference_id: file:worm/egl-46/egl-46-uniprot.txt
      record_section: ["FT:MUTAGEN"]
      supporting_text: In cas36; production of an extra neuron from the Q lineage.
    source_defects:
    - defect_type: WRONG_TERM
      resource: UNIPROT
      slot: GO_ID
      requested_change: CHECK
      asserted_value: GO:0031536
      corrected_value: GO:0007406
      corrected_label: negative regulation of neuroblast proliferation
      cause: LABEL_WITHOUT_DEFINITION
      confidence: PROBABLE
      explanation: GO:0031536 positive regulation of exit from mitosis is defined as promoting progression
        from anaphase/telophase to G1. In egl-46 mutants (cas36; PMID:23946438) Q-lineage cells complete
        mitosis but divide again after the terminal division, producing an extra neuron. The paper's "cell
        cycle exit" means withdrawal from the cell cycle, which a proliferation term such as GO:0007406
        captures. The same check applies to the egl-44 row from this paper.
