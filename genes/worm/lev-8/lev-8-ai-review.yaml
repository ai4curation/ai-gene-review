    label: postsynaptic membrane
  supported_by:
  - reference_id: PMID:15990870
    supporting_text: >-
      Multiple peptides of each of the levamisole receptor subunits, UNC-29,
      UNC-38, UNC-63, LEV-8, and LEV-1
