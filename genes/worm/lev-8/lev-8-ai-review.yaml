id: Q93329
gene_symbol: lev-8
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: >-
  LEV-8 is an alpha-type Cys-loop nicotinic acetylcholine receptor subunit in
  Caenorhabditis elegans. Together with the alpha subunits UNC-38 and UNC-63
  and the non-alpha subunits UNC-29 and LEV-1, it forms the heteropentameric
  levamisole-sensitive acetylcholine receptor at body-wall neuromuscular
  junctions. This postsynaptic, acetylcholine-gated cation channel mediates
  excitatory cholinergic transmission and is activated by the nematode
  anthelmintic levamisole; efficient recombinant expression requires the three
  ancillary factors RIC-3, UNC-50 and UNC-74. lev-8 mutants retain partial
  levamisole sensitivity but have reduced levamisole-evoked body-wall muscle
  currents and defects in levamisole-induced egg laying, levamisole-induced
  paralysis and pharyngeal pumping.
