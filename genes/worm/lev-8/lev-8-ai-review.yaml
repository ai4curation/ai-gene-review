knowledge_gaps:
- gap_statement: >-
    The exact position of LEV-8 within the C. elegans L-AChR pentamer and the
    subunit interface that explains levamisole's nematode-selective agonism
    remain unresolved.
  boundary: >-
    Genetic, biochemical and heterologous-expression data establish LEV-8 as
    one of the five pore subunits in the functional L-AChR.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  significance: >-
    Defining the LEV-8 interface would connect this alpha subunit to the
    receptor pharmacology that makes levamisole an anthelmintic.
  resolution: >-
    Determine the L-AChR subunit arrangement by structural analysis of the
    five-subunit receptor and test LEV-8 interface mutants for acetylcholine
    and levamisole responses.
  provenance:
  - reference_id: file:worm/lev-8/lev-8-notes.md
    supporting_text: >-
      The exact five-subunit order and the drug-binding contribution of LEV-8
      remain open.
suggested_questions:
- question: >-
    Which neighboring subunits flank LEV-8 in the C. elegans L-AChR, and does
    LEV-8 contribute a principal or complementary face to a levamisole-binding
    site?
suggested_experiments:
- description: >-
    Purify the full UNC-29/LEV-1/UNC-38/UNC-63/LEV-8 receptor and determine
    its subunit order by cryo-EM, then mutate LEV-8 interface residues for
    two-electrode voltage-clamp tests with acetylcholine and levamisole.
  hypothesis: >-
    LEV-8 provides a defined ligand-binding interface that shapes the
    levamisole pharmacology of nematode L-AChRs.
  experiment_type: structure-function analysis
