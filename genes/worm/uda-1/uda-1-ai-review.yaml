suggested_questions:
- question: In which organelle does UDA-1 reside in worm cells? The yeast fractionation placed it
    between the ER and the Golgi. Does it co-localise with UGGT (uggt-1) in the ER, or with Golgi
    nucleotide-sugar transporters?
- question: Does UDA-1 really fail to hydrolyse IDP, unlike its SF127 fly co-member, or was IDP not
    tested?
- question: Is UDA-1 functionally redundant with APY-1, the unrelated ER UDP/GDPase, in supporting
    glycoprotein reglucosylation during ER stress?
suggested_experiments:
- description: Measure N-glycoprotein folding, UGGT-dependent reglucosylation and luminal UDP and UMP
    levels in uda-1 null and uda-1; apy-1 double mutants, under basal conditions and under tunicamycin
    or heat stress.
  experiment_type: genetic loss-of-function with glycoproteomics
- description: Tag endogenous UDA-1 by CRISPR and co-localise it with ER and Golgi markers in intestine
    and hypodermis. Confirm luminal topology by protease protection.
  experiment_type: in vivo localisation
