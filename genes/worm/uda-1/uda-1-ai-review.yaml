- term:
    id: GO:0006487
    label: protein N-linked glycosylation
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:1321385
  - PANTHER:PTN008981015
  review:
    summary: Plausible and inherited from mouse ENTPD5, but in C. elegans it is only a hypothesis.
    action: KEEP_AS_NON_CORE
    reason: The sole donor is mouse Entpd5. For ENTPD5, UDP hydrolysis in the ER has been shown to
      promote N-glycosylation and folding. PAINT put the term at the same node as the UDPase activity,
      and uda-1 lies inside that clade. That placement is a deliberate phylogenetic judgement, and
      nothing specific to the worm argues against it. Transcriptional induction of uda-1 by the UPR
      fits the model. The role is enabling, not catalytic, however. UDA-1 does not transfer any sugar.
      It is proposed to remove the inhibitory product UDP and to supply UMP for UDP-glucose import.
      In the worm this rests only on the authors' hypothesis, and no uda-1 loss-of-function
      glycosylation phenotype has been reported. The row is kept as an inferred, non-core process and
      should not be treated as experimentally established in C. elegans.
    supported_by:
    - reference_id: PMID:21074248
      supporting_text: ENTPD5 hydrolyzes UDP to UMP to promote protein N-glycosylation and
        folding in ER
    - reference_id: PMID:15102851
      supporting_text: thereby further relieving ER stress by favoring protein re-glycosylation
    - reference_id: file:worm/uda-1/uda-1-uniprot.txt
      supporting_text: mono- or triphosphates. May promote reglycosylation reactions involved
