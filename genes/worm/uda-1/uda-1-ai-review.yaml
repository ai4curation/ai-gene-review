  review:
    summary: Hydrolysis of UDP to UMP is UDP breakdown, which UDA-1 catalyses directly.
    action: ACCEPT
    reason: UDA-1 itself carries out the step, UDP + H2O to UMP + phosphate, so it takes part in UDP
      catabolism in the strict GO sense. PAINT propagated the term from mouse Entpd5 at the same node
      that carries the UDP phosphatase activity. The worm IDA rows for "UDP metabolic process" make the
      same claim less specifically. UDP catabolic process is the more precise term for them, and they
      are modified to it.
    supported_by:
    - reference_id: PMID:15102851
      supporting_text: We hypothesize that up-regulation of uda-1 favors hydrolysis of the glucosyltransferase
        inhibitory product UDP to UMP
    - reference_id: file:worm/uda-1/uda-1-uniprot.txt
