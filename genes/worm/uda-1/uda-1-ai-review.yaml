- id: PMID:15102851
  title: ire-1-dependent transcriptional up-regulation of a lumenal uridine diphosphatase
    from Caenorhabditis elegans.
  findings:
  - statement: UDA-1 is a cation-dependent UDP/GDPase in C. elegans membranes.
    supporting_text: UDA-1, is a UDP/GDPase encoded by the gene uda-1
  - statement: Expressed in yeast, UDA-1 has a luminal active site in vesicles of density between that
      of the ER and that of the Golgi.
    supporting_text: has a lumenal active site in vesicles displaying an intermediate density between
      those of the ER and GA when expressed in S. cerevisiae
  - statement: The ER stress sensor ire-1 is required for stress induction of the uda-1 transcript.
    supporting_text: Up-regulation of uda-1 did not occur in ire-1-deficient mutants
  - statement: A role in relieving UGGT product inhibition and favouring reglycosylation is proposed
      as a hypothesis, not demonstrated.
    supporting_text: We hypothesize that up-regulation of uda-1 favors hydrolysis of the glucosyltransferase
      inhibitory product UDP to UMP
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: This is the only primary characterisation of UDA-1 and the source of all IDA rows.
      The PMID, title and authors (Hirschberg lab, JBC 2004) were checked against the cached record. Only
      the abstract was available, and Europe PMC lists no open full text. The substrate exclusivity,
      kinetics and cofactors are taken from the Swiss-Prot curation of this paper.
- id: PMID:19467631
  title: The single NTPase gene of Drosophila melanogaster encodes an intracellular nucleoside triphosphate
    diphosphohydrolase 6 (NTPDase6).
  findings:
  - statement: Fly NTPase, the other characterised member of subfamily SF127, is an ER-luminal UDP/GDP/IDPase.
    supporting_text: The enzyme hydrolyzed UDP, GDP, and IDP equally well whereas other NDP and NTP
      were poor substrates.
  full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Characterises the fly co-member of the same PANTHER subfamily (SF127). It is used
      only to corroborate the inherited UDP/GDPase activity, not as evidence about the worm protein.
- id: PMID:21074248
  title: The ER UDPase ENTPD5 promotes protein N-glycosylation, the Warburg effect,
    and proliferation in the PTEN pathway.
  findings:
  - statement: Mammalian ENTPD5 (PANTHER SF35) hydrolyses UDP to UMP in the ER to promote N-glycosylation
      and folding.
    supporting_text: ENTPD5 hydrolyzes UDP to UMP to promote protein N-glycosylation and
      folding in ER
  full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: This is the experimental basis for the role of ENTPD5 in N-glycosylation, which PAINT
      propagated through PTN008981015. ENTPD5 is in a different PANTHER subfamily (SF35) from uda-1, so
      for uda-1 the role is inferred and has not been demonstrated.
