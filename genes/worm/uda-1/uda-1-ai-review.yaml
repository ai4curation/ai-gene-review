gene_symbol: uda-1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: uda-1 (K08H10.4) encodes a 479-residue nucleoside diphosphatase of the GDA1/CD39
  (NTPDase) family. It is a type II membrane glycoprotein, with a short cytoplasmic N-terminus, one
  signal-anchor transmembrane helix and a large luminal catalytic domain that carries the apyrase
  conserved regions. The enzyme hydrolyses UDP and GDP to UMP and GMP and is reported not to act on
  other nucleoside di-, mono- or triphosphates. Activity depends on divalent cations (Ca2+, Mg2+ or
  Mn2+), with a Km of about 180 uM for UDP. When UDA-1 is expressed in yeast, its active site faces
  the lumen of membrane vesicles whose density lies between that of the endoplasmic reticulum and
  that of the Golgi apparatus. Heat, tunicamycin and ethanol induce the uda-1 transcript, and this
  induction needs the ER stress sensor ire-1. By analogy with secretory-pathway UDPases, UDA-1 is
  thought to remove the UDP released by luminal glucosyltransferases, which would relieve product
  inhibition and supply UMP for nucleotide-sugar antiport. No loss-of-function study in the worm has
  tested this role. In PANTHER, UDA-1 shares subfamily PTHR11782:SF127 with Drosophila NTPase,
  separate from vertebrate ENTPD5 and ENTPD6.
