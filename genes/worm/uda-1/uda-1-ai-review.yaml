    summary: The term is technically correct but uninformative. UDA-1 acts in the lumen of
      secretory-pathway membranes.
    action: MODIFY
    reason: In GO, cytoplasm includes the organelles of the secretory pathway, so this inherited
      location is not wrong. It does not say where the enzyme works, however. UDA-1 is a type II
      signal-anchored protein whose catalytic domain faces the lumen of vesicles between the ER and
      the Golgi. The curated UniProt location is the endomembrane system, which this gene already
      carries (GO:0012505), and that is the most precise location the evidence supports. It cannot
      yet be narrowed to ER or Golgi because the only fractionation data come from expression in
      yeast. The replacement is a correction to the stated location; it is not a descendant of
      cytoplasm in GO.
