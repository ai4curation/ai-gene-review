descriptions:
- source: UniProt
  text: Hydrolyzes UDP and GDP but not any other nucleoside di-, mono- or triphosphates.
    May promote reglycosylation reactions involved in glycoproteins folding and quality
    control in the endoplasmic reticulum.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q9XU84
  source_id: Q9XU84
- source: Alliance_Automated
  text: Enables GDP phosphatase activity and UDP phosphatase activity. Involved in
    GDP metabolic process and UDP metabolic process. Located in cytoplasmic vesicle
    membrane. Orthologous to human ENTPD5 (ectonucleoside triphosphate diphosphohydrolase
    5 (inactive)) and ENTPD6 (ectonucleoside triphosphate diphosphohydrolase 6).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00010697;class=Gene
  source_id: WB:WBGene00010697
