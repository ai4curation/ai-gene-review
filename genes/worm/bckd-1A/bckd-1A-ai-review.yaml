- term:
    id: GO:0006633
    label: fatty acid biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000041
  qualifier: involved_in
  supporting_entities:
  - UniPathway:UPA00094
  review:
    summary: Correct but general; in C. elegans BCKDH supplies the branched acyl-CoA primers for
      monomethyl branched-chain fatty acid synthesis, so the specific child term applies.
    action: MODIFY
    reason: The UniPathway mapping reflects the Kniazeva et al. finding that bckd-1A knockdown
      lowers C15ISO and C17ISO. The BCKDH complex catalyses the primer-forming step whose branched
      acyl group becomes the carbon skeleton of the product, so the gene product performs a step of
      the pathway rather than merely being required for it. GO:1902321 methyl-branched fatty acid
      biosynthetic process (is_a GO:0006633) is the precise term. Comparator check - the
      elongases elo-5 and elo-6 carry GO:1902321 by IMP from the same paper, as does Drosophila
      FASN2, i.e. the term is given to enzymes performing steps of the pathway.
    supported_by:
    - reference_id: PMID:15340492
      supporting_text: Key enzymes engaged in synthesizing the mmBCFA acyl-CoA primers are branched-chain
        aminotransferase (BCAT) and the branched-chain α-keto-acid dehydrogenase (BCKAD) complex
    - reference_id: PMID:15340492
      supporting_text: RNAi of Y39E4A.3 led to a significant decrease in C15ISO and C17ISO production
    - reference_id: PMID:26683372
      supporting_text: Here we show that disrupting BCKDH in Caenorhabditis elegans causes mmBCFA deficiency,
        in addition to BCAA accumulation.
    proposed_replacement_terms:
    - id: GO:1902321
      label: methyl-branched fatty acid biosynthetic process
