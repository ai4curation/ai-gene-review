  review:
    summary: Core E1 catalytic activity of the BCKDH E1 alpha chain; correct, although the cited
      paper shows only an RNAi fatty-acid phenotype rather than an enzyme assay.
    action: ACCEPT
    reason: bckd-1A is a close ortholog of human and bovine BCKDHA (E1 alpha), carries the E1_dh
      domain with conserved thiamine-diphosphate and potassium binding sites, and its knockdown
      reduces the branched-chain acyl-CoA-derived mmBCFAs C15ISO and C17ISO. The activity itself is
      therefore well supported. However, PMID:15340492 contains no biochemical assay of the worm
      protein; the EXP code (assigned by UniProt from the same paper used for the EC number)
      overstates the direct evidence, which is a knockdown phenotype interpreted through homology.
      The activity is accepted; the evidence code is recorded as a probable source defect. The
      activity strictly belongs to the alpha2beta2 E1 heterotetramer, so contributes_to would also
      be defensible, as discussed in core_functions.
    supported_by:
    - reference_id: PMID:15340492
      supporting_text: We identified a predicted C. elegans protein, Y39E4A.3, with significant sequence
        homology to the E1 alpha subunit of BCKAD
