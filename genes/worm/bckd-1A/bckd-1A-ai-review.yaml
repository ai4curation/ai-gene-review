      RNAi and GC; contains no enzyme assay of the worm protein, so it does not directly support an
      EXP molecular-function annotation.
- id: PMID:26683372
  title: Developmental Defects of Caenorhabditis elegans Lacking Branched-chain α-Ketoacid
    Dehydrogenase Are Mainly Caused by Monomethyl Branched-chain Fatty Acid Deficiency.
  findings:
  - statement: BCKDH deficiency in C. elegans causes mmBCFA deficiency and BCAA accumulation; the
      resulting larval arrest is suppressed by mmBCFA supplementation.
    supporting_text: Worms with deficiency in BCKDH function manifest larval arrest and embryonic lethal
      phenotypes, and mmBCFA supplementation suppressed both without correcting BCAA levels.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached; centred on the E2 subunit dbt-1, but confirms that E1 alpha
      (Y39E4A.3) RNAi lowers mmBCFAs and defines the physiological role of the worm BCKDH complex.
