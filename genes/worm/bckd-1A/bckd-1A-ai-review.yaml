gene_symbol: bckd-1A
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: bckd-1A (Y39E4A.3) encodes the E1 alpha chain of the mitochondrial branched-chain
  alpha-ketoacid dehydrogenase (BCKDH) complex of Caenorhabditis elegans, the ortholog of human
  BCKDHA. Together with the E1 beta chain it forms the thiamine-diphosphate-dependent E1 enzyme
  that decarboxylates the branched-chain 2-oxo acids derived from leucine, isoleucine and valine
  and reductively acylates the lipoyl domain of the E2 subunit DBT-1; E2 then transfers the acyl
  group to CoA and the E3 lipoamide dehydrogenase reoxidizes the lipoyl group. The complex acts in
  the mitochondrial matrix. In C. elegans the branched-chain acyl-CoAs it produces feed both
  branched-chain amino acid catabolism and the de novo synthesis of the monomethyl branched-chain
  fatty acids C15ISO and C17ISO, which are elongated by ELO-5 and ELO-6. Knockdown of bckd-1A
  lowers C15ISO and C17ISO, and loss of BCKDH function causes branched-chain amino acid accumulation
  and larval arrest that is largely suppressed by mmBCFA supplementation.
