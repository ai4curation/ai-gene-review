core_functions:
- description: E1 alpha chain of the mitochondrial BCKDH complex. As part of the thiamine-diphosphate
    dependent alpha2beta2 E1 enzyme it decarboxylates branched-chain 2-oxo acids and reductively
    acylates the lipoyl domain of DBT-1 (E2), producing the branched-chain acyl groups that feed both
    branched-chain amino acid catabolism and, in C. elegans, the primers for monomethyl branched-chain
    fatty acid (C15ISO, C17ISO) synthesis.
