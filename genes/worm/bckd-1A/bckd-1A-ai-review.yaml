suggested_questions:
- question: Does C. elegans BCKDH E1 show the same substrate preference among the 2-oxo acids of
    leucine, isoleucine and valine as the mammalian enzyme, given that worm mmBCFAs are mainly
    iso-branched (C15ISO, C17ISO) and therefore leucine- or valine-derived?
- question: Is the EXP evidence code on the O45924 GO:0003863 and EC 1.2.4.4 assertions intended,
    given that PMID:15340492 reports RNAi phenotypes but no enzyme assay?
- question: Is worm E1 alpha regulated by phosphorylation by a BCKDK-like kinase as in mammals,
    and does this tune mmBCFA versus BCAA flux?
suggested_experiments:
- description: Express and purify worm BCKD-1A with its E1 beta partner (F27D4.5) and measure
    thiamine-diphosphate dependent decarboxylation of 3-methyl-2-oxobutanoate,
    4-methyl-2-oxopentanoate and 3-methyl-2-oxopentanoate, to provide direct biochemical evidence
    for the E1 activity and define substrate preference.
- description: Stable-isotope tracing of labelled leucine and valine into C15ISO and C17ISO in
    wild-type versus bckd-1A mutant animals to quantify the contribution of BCKDH-derived primers
    to mmBCFA synthesis.
