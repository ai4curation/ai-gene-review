descriptions:
- source: UniProt
  text: 'The branched-chain alpha-keto dehydrogenase complex catalyzes the overall
    conversion of alpha-keto acids to acyl-CoA and CO(2). It contains multiple copies
    of three enzymatic components: branched-chain alpha-keto acid decarboxylase (E1),
    lipoamide acyltransferase (E2) and lipoamide dehydrogenase (E3) (By similarity).
    Required for the production of the monomethyl branched-chain fatty acids (mmBCFAs)
    isopentadecanoate (C15iso) and isoheptadecanoate (C17iso) (PubMed:15340492).'
  source_type: curated
  url: https://www.uniprot.org/uniprot/O45924
  source_id: O45924
- source: Alliance_Imported
  text: Y39E4A.3 is orthologous to the human gene MAPLE SYRUP URINE DISEASE, TYPE
    IA (MSUD, TYPE IA; E1-alpha subunit of branched-chain keto acid dehydrogenase;
    OMIM:248600), which when mutated leads to maple syrup urine disease; Y39E4A.3
    protein is predicted to be mitochondrial.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00012713;class=Gene
  source_id: WB:WBGene00012713
- source: Alliance_Automated
  text: Enables branched-chain 2-oxo acid dehydrogenase activity. Predicted to be
    involved in branched-chain amino acid catabolic process. Predicted to be located
    in mitochondrial matrix. Predicted to be part of branched-chain alpha-ketoacid
    dehydrogenase complex. Human ortholog(s) of this gene implicated in maple syrup
    urine disease and maple syrup urine disease type IA. Orthologous to human BCKDHA
    (branched chain keto acid dehydrogenase E1 subunit alpha).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00012713;class=Gene
