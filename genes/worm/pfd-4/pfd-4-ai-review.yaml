    summary: PFD-4 is a beta-type prefoldin subunit (ortholog of human PFDN4). Prefoldin is a heterohexamer
      of two alpha-type and four beta-type subunits, and in C. elegans it is made up of PFD-1 to PFD-6.
    action: ACCEPT
    reason: 'Family membership and the conserved subunit composition place PFD-4 in the prefoldin complex.
      Son et al. describe the C. elegans complex as PFD-1 through PFD-6 [PMID:30478249]. Complex membership
      is the most informative cellular component for this subunit. Caveat: according to the deep-research
