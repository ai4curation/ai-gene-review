  review:
    summary: PFD-4 is a beta-class subunit of the heterohexameric prefoldin co-chaperone, which captures
      non-native actin and tubulin chains and delivers them to the CCT/TRiC chaperonin. Prefoldin RNAi
      in C. elegans lowers alpha-tubulin levels and slows microtubule growth [PMID:18062952].
    action: ACCEPT
    reason: 'Protein folding is the established biological role of the prefoldin complex, conserved from
      yeast and archaea to mammals [PMID:9630229], and C. elegans RNAi data link prefoldin function to
      tubulin biogenesis [PMID:18062952]. The IBA node placement is sound: the gene is a canonical member
      of the prefoldin family with no evidence of divergence. Caveat: according to the deep-research summary
      of Lundin''s 2008 thesis (not verified against the primary text), pfd-4 RNAi and the pfd-4(gk430)
      deletion give no visible phenotype, unlike the other subunits, and the authors considered PFD-4
      divergent. This does not contradict the family-level inference, because loss of one beta subunit
      could be buffered, but the strength of PFD-4''s contribution in worms is uncertain.'
    supported_by:
    - *id001
    - &id002
      reference_id: PMID:18062952
      supporting_text: Our analyses suggest that these defects result mainly from a decrease in alpha-tubulin
        levels and a subsequent reduction in the microtubule growth rate.
