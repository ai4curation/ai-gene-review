gene_symbol: pfd-4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: PFD-4 (B0035.4) is a beta-class prefoldin subunit in C. elegans, the ortholog of human PFDN4.
  By homology it is part of the heterohexameric prefoldin co-chaperone, which captures non-native actin
  and tubulin chains in the cytosol and delivers them to the CCT/TRiC chaperonin for folding. Other C.
  elegans prefoldin subunits are needed for embryonic viability, normal alpha-tubulin levels and microtubule
  growth. Loss of pfd-4, by RNAi or in the pfd-4(gk430) deletion, reportedly gives no visible phenotype,
  and nematode PFD-4 is divergent, so its contribution to prefoldin function in worms is uncertain. B0035.4
  RNAi, like RNAi of other prefoldin subunits, suppresses the lethality of a temperature-sensitive dynein
  heavy chain mutant.
