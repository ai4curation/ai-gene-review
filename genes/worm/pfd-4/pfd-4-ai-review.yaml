suggested_questions:
- question: Does PFD-4 contribute to a C. elegans R2TP/prefoldin-like (URI-1/UXT/PDRG1) complex as well
    as canonical prefoldin, and do the two pools have separable functions?
- question: Which clients other than actin and tubulin does C. elegans prefoldin deliver to CCT in vivo,
    and does dependence on prefoldin differ between tissues?
suggested_experiments:
- description: Pull down endogenously tagged PFD-4 (CRISPR knock-in) and identify co-purifying proteins
    by mass spectrometry, to tell canonical prefoldin from R2TP/prefoldin-like complex membership and
    to find clients.
- description: Use auxin-inducible degradation of PFD-4 in specific tissues, then measure alpha/beta-tubulin
    and actin levels and microtubule growth rate (EB1 tracking), to define the tissue-specific requirement.
