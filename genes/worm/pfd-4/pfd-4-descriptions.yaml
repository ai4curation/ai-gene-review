gene_symbol: pfd-4
organism: worm
uniprot_id: Q17435
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Binds specifically to cytosolic chaperonin (c-CPN) and transfers target proteins
    to it. Binds to nascent polypeptide chain and promotes folding in an environment
    in which there are many competing pathways for nonnative proteins (By similarity).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q17435
  source_id: Q17435
- source: Alliance_Imported
  text: pfd-4 encodes a putative prefoldin subunit 4, orthologous to human PFDN4 (OMIM:604898),
    that is dispensable for viability; PFD-4 is redundant for prefoldin function in
    C. elegans; pfd-4(gk403) mutants and pfd-4(RNAi) animals, unlike animals undergoing
    RNAi against most prefoldin subunits, have no obvious phenotypes.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00007107;class=Gene
  source_id: WB:WBGene00007107
- source: Alliance_Automated
  text: Predicted to be involved in protein folding. Predicted to be part of prefoldin
    complex. Predicted to be active in cytoplasm. Orthologous to human PFDN4 (prefoldin
    subunit 4).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00007107;class=Gene
  source_id: WB:WBGene00007107
- source: RefSeq
  text: Predicted to enable unfolded protein binding activity. Predicted to be involved
