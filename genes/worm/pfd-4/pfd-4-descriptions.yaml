- source: Alliance_Imported
  text: pfd-4 encodes a putative prefoldin subunit 4, orthologous to human PFDN4 (OMIM:604898),
    that is dispensable for viability; PFD-4 is redundant for prefoldin function in
    C. elegans; pfd-4(gk403) mutants and pfd-4(RNAi) animals, unlike animals undergoing
    RNAi against most prefoldin subunits, have no obvious phenotypes.
