core_functions:
- description: VPS-34 is the catalytic subunit of the autophagy-specific class III PI3K complex I (with
    BEC-1, VPS-15 and EPG-8/ATG14). It phosphorylates PtdIns to make PtdIns3P at autophagosome formation
    sites.
