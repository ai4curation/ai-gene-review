suggested_questions:
- question: What makes VPS-34 concentrate at the nuclear envelope, and does the perinuclear pool belong
    to complex I, complex II, or a different assembly?
- question: Is a worm UVRAG ortholog (complex II-specific subunit) needed for the endocytic and phagosomal
    functions of VPS-34, and what is it?
suggested_experiments:
- description: Degron or tissue-specific depletion of endogenous VPS-34, combined with GFP-tagged EPG-8
    or a UVRAG candidate, to separate the autophagic complex I functions from the endocytic complex II
    functions in the same tissue.
- description: Immuno-EM of endogenously tagged VPS-34 to test whether the perinuclear pool is on the
    outer nuclear membrane or on adjacent ER/omegasome membranes.
