  review:
    summary: Autophagosome assembly by PAINT inference from the PIK3C3/Vps34 clade. VPS-34 is the only
      class III PI3K in C. elegans and the catalytic partner of BEC-1, which is required for autophagy
      in worms.
    action: ACCEPT
    reason: Making PtdIns3P at the autophagosome formation site is the conserved core role of the class
      III PI3K complex I, and C. elegans VPS-34 is inside that clade. Worm data show that BEC-1 is needed
      for LET-512/VPS-34 function in autophagy, and that the PtdIns3P effectors EPG-6 and ATG-18 act in
      autophagosome formation. The IBA node placement is sound.
    supported_by:
    - reference_id: PMID:16111945
      supporting_text: We demonstrate that BEC-1 is necessary for the function of the class III PI3 kinase
        LET-512/Vps34, an essential protein required for autophagy, membrane trafficking, and endocytosis.
