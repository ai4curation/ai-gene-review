    supporting_text: We demonstrate that BEC-1 is necessary for the function of the class III PI3 kinase
      LET-512/Vps34, an essential protein required for autophagy, membrane trafficking, and endocytosis.
- description: As part of the endocytic class III PI3K complex II, VPS-34 makes endosomal PtdIns3P for
    endocytic trafficking and early-to-late endosome conversion. With the class II PI3K PIKI-1, it also
    makes the phagosomal PtdIns3P needed for maturation of phagosomes containing apoptotic cells.
