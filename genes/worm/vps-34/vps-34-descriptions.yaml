descriptions:
- source: UniProt
  text: Catalytic subunit of the PI3K complex that mediates formation of phosphatidylinositol
    3-phosphate (PubMed:11927551). Together with bec-1, mediates the production of
    phosphatidylinositol 3-phosphate on intracellular vesicles and thereby regulates
    membrane trafficking (PubMed:11927551, PubMed:16111945). Plays a role in endosome-to-Golgi
    retrograde transport of mig-14 (PubMed:21183797). Involved in clearance of apoptotic
    cell corpses by phagosomes (PubMed:22272187). Phagosome maturation requires two
    sequential and non-overlapping pulses of phosphatidylinositol-3-phosphate (PI3P)
    on the vesicle surface which mediates recruitment of sortins snx-1 and lst-4 and
    small GTPases rab- 5, rab-2 and rab-7, downstream of dynamin dyn-1 (PubMed:18425118,
    PubMed:22272187). The first pulse is initiated by piki-1, then maintained by vps-34
    which also produces the second pulse (PubMed:22272187). Required for embryonic
    development (PubMed:22272187). Together with bec-1, involved in L3/L4 larval molting
    stage probably by regulating cuticle shedding (PubMed:11927551). Regulates the
    expansion of the nucleus outer membrane (PubMed:11927551). Involved in the secretion
    and localization of lrp-1 at the apical surface of hyp7 syncytium (PubMed:16111945).
    May regulate endocytosis in hypodermal cells (PubMed:11927551). May play a role
    in the formation of gut granules (a lysosome-related organelle) (PubMed:15843430).
    Plays a role in germ stem cell proliferation during larval development (PubMed:28285998).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q9TXI7
  source_id: Q9TXI7
- source: Alliance_Imported
  text: vps-34 encodes an ortholog of the phosphoinositide 3-kinase VPS34 in S. cerevisiae,
    a protein that regulates multiple steps in endocytosis, and that is required for
    growth at normal rates during development; in C. elegans, vps-34 is required for
    vesicular trafficking, including endocytosis, apoptotic cell clearance, and autophagy.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00006932;class=Gene
  source_id: WB:WBGene00006932
- source: Alliance_Automated
  text: Enables 1-phosphatidylinositol-3-kinase activity. Involved in several processes,
    including determination of adult lifespan; ecdysis, collagen and cuticulin-based
    cuticle; and positive regulation of engulfment of apoptotic cell. Located in cytoplasm;
    nuclear outer membrane; and nucleolus. Orthologous to human PIK3C3 (phosphatidylinositol
    3-kinase catalytic subunit type 3).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00006932;class=Gene
