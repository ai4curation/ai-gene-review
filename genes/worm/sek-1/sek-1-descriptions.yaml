  text: Enables mitogen-activated protein kinase kinase kinase binding activity and
    protein kinase activity. Involved in several processes, including defense response
    to bacterium; p38MAPK cascade; and regulation of gene expression. Is expressed
    in excretory canal; linker cell; neurons; rectal epithelium; and uterine-vulval
    cell. Used to study Parkinson's disease. Human ortholog(s) of this gene implicated
    in Pick's disease; cardiomyopathy (multiple); disease of cellular proliferation
    (multiple); and progressive supranuclear palsy. Orthologous to human MAP2K3 (mitogen-activated
    protein kinase kinase 3) and MAP2K6 (mitogen-activated protein kinase kinase 6).
