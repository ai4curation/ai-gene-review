- source: RefSeq
  text: Enables MAP kinase kinase activity; mitogen-activated protein kinase kinase
    kinase binding activity; and protein serine kinase activity. Involved in several
    processes, including defense response to bacterium; p38MAPK cascade; and regulation
    of gene expression. Is expressed in excretory canal; linker cell; neurons; rectal
    epithelium; and uterine-vulval cell. Used to study Parkinson's disease. Human
    ortholog(s) of this gene implicated in Pick's disease; cervical cancer; ovarian
    carcinoma; progressive supranuclear palsy; and restrictive cardiomyopathy. Orthologous
    to human MAP2K3 (mitogen-activated protein kinase kinase 3) and MAP2K6 (mitogen-activated
    protein kinase kinase 6). [provided by Alliance of Genome Resources, Jun 2026]
