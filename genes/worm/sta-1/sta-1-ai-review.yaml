    label: DNA-binding transcription repressor activity, RNA polymerase II-specific
  evidence_type: IDA
  original_reference_id: PMID:28874466
  review:
    summary: GFP::STA-1 ChIP-seq places STA-1 ~200 bp upstream of the TSS of about 20% of genes, and genes
      upregulated in sta-1 null mutants are enriched for STA-1 binding; STA-1 acts mostly as a constitutive
      transcriptional repressor (PMID:28874466). Repression requires DNA-binding residues, nuclear localisation
      and Y588 (PMID:42427644).
