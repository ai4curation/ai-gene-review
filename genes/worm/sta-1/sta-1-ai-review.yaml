- id: PMID:24058748
  title: Comparative evolutionary genomics of the STAT family of transcription factors.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Review with primary data from the Levy lab (full text cached, PMC3670131). Checked passages
      on the sta-1 locus, STA-1 domain content (SH2, DNA-binding, coiled-coil; no N-terminal domain) and
      STA-1 binding a STAT consensus motif in EMSA. Also shows the second worm STAT-like protein F58E6.1
      (sta-2) is highly divergent from STA-1.
  findings:
  - statement: STA-1 is the C. elegans STAT ortholog.
    supporting_text: Previously we characterized the C. elegans STAT ortholog, sta-1.
  - statement: STA-1 has SH2, DNA-binding and STAT coiled-coil domains.
    supporting_text: A similar search with STA-1 produced three domains, SH2 (E-value 7.2e-31), DNA binding
      (E-value 1.9e-60) and STAT coiled-coil domain (E-value 8.8e-38)
  - statement: The nematode STAT lacks the N-terminal domain found in other animal STATs, which probably
      reflects the ancestral domain structure.
    supporting_text: Prior to nematode divergence, the ancestral STAT likely had the same domain structure
      as the nematode STAT, lacking the N-terminal domain, which is conserved among all other known animal
      STATs.
  - statement: STA-1 binds a STAT consensus DNA motif in EMSA.
    supporting_text: although many other STAT proteins, including STA-1, score positive in this assay
- id: PMID:24058787
  title: Evolution of the JAK-STAT pathway.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Review (full text cached, PMC3670263). Checked passages placing C. elegans STATs among
      the slime-mold-like STAT architectures and dating canonical JAK-STAT pathway assembly to the bilaterian
      ancestor, before the protostome split. The review does not itself discuss the absence of JAK in nematodes;
      that comes from PMID:28874466.
  findings:
  - statement: C. elegans STATs share the core slime-mold-like STAT architecture (coiled-coil, DNA-binding,
      SH2).
    supporting_text: Extant members of the cnidara, the sea anemone (Nematostella vectensis) and nematode
      (Caenorhabditis elegans), both contain at least one STAT with architectures similar to that seen
      in slime mold
  - statement: The canonical JAK-STAT pathway was assembled before protostomes diverged, so its absence
      in nematodes is a secondary, lineage-specific loss.
    supporting_text: These came together to form the canonical JAK-STAT signaling pathway prior to the
      divergence of protostomia
