suggested_questions:
- question: Which tyrosine kinase phosphorylates STA-1 Y588 in the absence of JAK? Is SID-3 a direct kinase
    for STA-1, and is the same kinase used in amphid neurons for dauer repression?
- question: 'How does STA-1 repress transcription: by recruiting corepressors, by competing with activators
    such as the IPR transcription factors, or through GATA-like co-bound factors at its peaks?'
- question: Is the STA-1-DRH-1 association direct, and is cytoplasmic sequestration the cause or consequence
    of loss of nuclear STA-1 during infection?
- question: Should GO:0007259 carry a taxon constraint or should PAINT add an IRD for the nematode STAT
    branch so that JAK-STAT terms stop propagating to sta-1 and sta-2?
suggested_experiments:
- description: In vitro kinase assay of recombinant SID-3 with STA-1 plus phospho-Y588-specific antibody
    staining in sid-3 mutants, to test whether SID-3 directly phosphorylates STA-1.
- description: Endogenous STA-1 CUT&RUN/ChIP-seq in intestine (mock vs Orsay virus) and in neurons, combined
    with Y588F and DNA-binding mutants, to define direct repressed targets and test whether occupancy
    is lost upon infection.
- description: STA-1 IP-mass spectrometry in uninfected animals to identify corepressor partners mediating
    repression.
