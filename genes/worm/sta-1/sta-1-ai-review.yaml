  review:
    summary: 'PAINT transfer (PTN000927860) of defense response, seeded by activating STATs (mammalian
      STAT1/STAT2 etc., fly Stat92E) and worm STA-2. STA-1 is involved in antiviral defense, but as a
      negative regulator: sta-1 mutants are 100-fold less permissive to Orsay virus (PMID:28874466) and
      STA-1 overexpression increases susceptibility (PMID:42427644).'
    action: MODIFY
    reason: STA-1 does not execute defense; it restrains the antiviral gene-expression program in uninfected
      cells and is removed from infected-cell nuclei to de-repress it. The essence (a STAT acting in host
      defense) is right but the polarity matters, so the more precise regulatory term negative regulation
      of defense response to virus (GO:0050687) is proposed, matching MODULE c_elegans_jak_independent_stat_signaling.
    proposed_replacement_terms:
    - id: GO:0050687
      label: negative regulation of defense response to virus
    supported_by:
    - reference_id: PMID:28874466
      supporting_text: sta-1 mutants were 100-fold less permissive to infection than wild-type animals
    - &id011
      reference_id: PMID:42427644
      supporting_text: STA-1/STAT is a negative regulator of anti-viral defense
    - &id010
      reference_id: PMID:42427644
      supporting_text: STA-1 overexpression causes increased susceptibility to viral infection, in a manner
        dependent on conserved residues important for DNA binding, nuclear localization and phosphorylation
    - reference_id: file:worm/sta-1/sta-1-deep-research-openscientist.md
      supporting_text: loss of STA-1 makes animals *more* resistant to the natural Orsay virus, revealing
        that STA-1 normally suppresses a constitutive defense state
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - REGULATORY_SIGN_INVERSION
      source_entities:
      - source_id: PANTHER:PTN000927860
        source_label: PTN000927860
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Node seeds are STATs that execute or activate defense (vertebrate STAT1/STAT2-type, fly
          Stat92E, worm STA-2). STA-1 is in the same lineage but acts with opposite sign, repressing the
          antiviral program (PMID:28874466), so the inherited positive defense role needs refinement to
          a negative regulation term.
