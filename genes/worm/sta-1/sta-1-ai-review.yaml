id: Q9NAD6
gene_symbol: sta-1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: sta-1 encodes STA-1, one of two STAT (signal transducer and activator of transcription) family
  proteins in Caenorhabditis elegans. It has the coiled-coil, DNA-binding, linker and SH2 domains of STATs
  and a conserved C-terminal tyrosine (Y588), but lacks the N-terminal oligomerization domain of most
  metazoan STATs. STA-1 binds a conserved STAT-type cis element and occupies promoter-proximal sites of
  many genes. Unlike vertebrate STATs it acts mostly as a transcriptional repressor. C. elegans has no
  JAK kinase and no interferon system; STA-1 activity requires its tyrosine and, genetically, the ACK-family
  tyrosine kinase SID-3. In intestinal cells STA-1 is nuclear and represses an antiviral and anti-pathogen
  gene program, so sta-1 mutants are more resistant to Orsay virus. Infection removes STA-1 from the nuclei
  of infected cells and it forms cytoplasmic puncta with the RIG-I-like sensor DRH-1, relieving repression.
  In head and amphid neurons, activated STA-1 is nuclear and represses dauer formation together with DAF-1/DAF-8
  TGF-beta signaling; its expression is induced by TGF-beta signaling through DAF-3.
