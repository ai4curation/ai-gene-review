  - ZFIN:ZDB-GENE-980526-68
  review:
    summary: PAINT transfer (PTN000927860) of cell surface receptor signaling pathway via JAK-STAT, seeded
      by vertebrate STATs and fly Stat92E. C. elegans has no JAK homolog and no interferon/cytokine receptor
      system; STA-1 acts in a JAK-independent pathway (PMID:28874466).
    action: REMOVE
    reason: The term presupposes a receptor-associated JAK that phosphorylates the STAT. No such kinase
      exists in C. elegans; STA-1 function instead requires the ACK-family tyrosine kinase SID-3 genetically
      and is relieved by DRH-1 signaling in infected cells. The IBA is a lineage-inappropriate transfer
      (projects/IBA_REVIEW.md section 14; projects/TAXON_PATHWAY_VARIANCE.md case study 1), consistent
      with the REMOVE of the same IBA on the paralog sta-2. STA-1 signaling is modelled instead in MODULE
      c_elegans_jak_independent_stat_signaling. Liongue & Ward (2013) place the assembly of the canonical
      JAK-STAT pathway in the bilaterian ancestor before the protostome split, so the absence of JAK in
      C. elegans is a lineage-specific loss; the IBD node placement is sound for the seeds, and the fix
      is an IRD on the nematode branch rather than moving the node.
    supported_by:
    - reference_id: PMID:24058787
      supporting_text: These came together to form the canonical JAK-STAT signaling pathway prior to the
        divergence of protostomia
    - reference_id: PMID:28874466
      supporting_text: There is no conserved homolog of the JAK kinases in C. elegans
    - reference_id: PMID:28874466
      supporting_text: despite the absence of both interferon and JAK, the C. elegans STAT homolog STA-1
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - LINEAGE_OR_TAXON_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN000927860
        source_label: PTN000927860
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: STAT-family node whose GO:0007259 IBD is seeded by vertebrate STATs and fly Stat92E,
          all genuine JAK-STAT pathway members. STA-1 descends from it into the nematode branch, which
          has no JAK homolog (PMID:28874466); STA-1 acts downstream of the non-JAK tyrosine kinase SID-3
          instead. The inheritance needs an IRD on the nematode branch.
