      in cooperation with DAF-1/DAF-8 signaling, so its role is regulatory and of negative polarity. The
      more precise child term negative regulation of dauer larval development (GO:0061067) is proposed.
      This is a developmental role outside STA-1 antiviral repression but is the best-characterised in
      vivo function in neurons.
    action: MODIFY
    proposed_replacement_terms: *id008
    supported_by: *id009
