- id: PMID:28874466
  title: An Alternative STAT Signaling Pathway Acts in Viral Immunity in Caenorhabditis elegans.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached (PMC5587905). Establishes no JAK in C. elegans, STA-1 as promoter-bound
      constitutive repressor (ChIP-seq, RNA-seq), sta-1 less permissive to Orsay virus, SID-3 genetically
      upstream.
  findings:
