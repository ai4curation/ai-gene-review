    supporting_text: There is no conserved homolog of the JAK kinases in C. elegans
  - statement: STA-1 is mainly a transcriptional repressor of antiviral genes.
    supporting_text: These data suggest that STA-1 largely acts as a transcriptional repressor of an antiviral
      gene expression program.
- id: PMID:42427644
  title: Viral infection drives cell-intrinsic re-localization of the C. elegans immune-repressive STAT
    transcription factor STA-1.
  reference_review:
    relevance: HIGH
