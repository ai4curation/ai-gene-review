gene_symbol: sta-1
organism: worm
uniprot_id: Q9NAD6
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: 'Carries out a dual function: signal transduction and activation of transcription.
    Activated STAT proteins play a role in repression of dauer formation. Neuronal
    expression is held in check by negative signals through the TGF-beta pathway that
    target the daf-3 transcription factor.'
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q9NAD6
  source_id: Q9NAD6
- source: Alliance_Imported
  text: sta-1 encodes a protein that is a member of the STAT family of transcription
    factors; from N- to C-terminus, STA-1 contains conserved coiled-coil, DNA-binding,
    and SH2 domains, but apparently lacks a conserved amino-terminal oligomerization
    domain found in other STAT family members; sta-1 activity is required for repressing
    dauer formation at high temperatures and genetic analyses indicate that STA-1
    acts redundantly with some members of the DAF-7/TGF-beta signaling pathway to
    repress dauer formation, particularly at low temperatures; tyrosine-phosphorylated
    STA-1 is able to bind a high affinity mammalian STAT binding sequence, and the
    STA-1 C-terminus can function as a transcriptional activation domain; sta-1 is
    widely expressed during most life stages, including the dauer stage, and is found
    in the pharynx, intestine, body wall muscles, and in neurons; STA-1 localizes
    to both the cytoplasm and the nucleus, with expression in the latter found particularly
    in some amphid neurons; in some neurons, STA-1 expression appears to be negatively
    regulated by DAF-7/TGF-beta signaling.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00013111;class=Gene
  source_id: WB:WBGene00013111
- source: Alliance_Automated
  text: Enables sequence-specific DNA binding activity. Involved in dauer larval development
    and positive regulation of transcription by RNA polymerase II. Located in cytoplasm
    and nucleus. Is expressed in several structures, including anal depressor muscle;
    body wall musculature; coelomocyte; intestine; and nervous system. Human ortholog(s)
    of this gene implicated in several diseases, including IgA glomerulonephritis;
    disease of cellular proliferation (multiple); immune system disease (multiple);
    mouth disease (multiple); and scleroderma (multiple). Orthologous to several human
    genes including STAT5A (signal transducer and activator of transcription 5A) and
    STAT5B (signal transducer and activator of transcription 5B).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00013111;class=Gene
  source_id: WB:WBGene00013111
