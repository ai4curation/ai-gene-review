gene_symbol: zen-4
organism: worm
uniprot_id: G5EG83
taxon_id: NCBITaxon:6239
descriptions:
- source: Alliance_Imported
  text: zen-4 encodes a kinesin-like protein that is a member of the kinesin-6 subfamily
    of plus-end-directed microtubule motors; loss-of-function mutations and RNAi experiments
    indicate that ZEN-4 is required for polar body extrusion after meiotic divisions,
    for completion of cytokinesis after mitosis, and for formation and/or maintenance
    of spindle midzone microtubules; in addition, zen-4 functions together with cyk-1
    to regulate pronuclear migration; during mitosis, ZEN-4 is detected at the spindle
    midzone where it co-localizes with spindle microtubules, and ZEN-4 persists at
    the midbody remnant once cell division is complete; ZEN-4 is also occasionally
    seen at centrosomes in interphase cells; initial localization of ZEN-4 to the
    spindle midzone requires activity of the Aurora-related kinase AIR-2 which physically
    interacts with ZEN-4 in vitro.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00006974;class=Gene
  source_id: WB:WBGene00006974
- source: Alliance_Automated
  text: Enables microtubule binding activity; plus-end-directed microtubule motor
    activity; and protein kinase binding activity. Involved in several processes,
    including nuclear division; pronuclear migration; and regulation of actomyosin
    contractile ring contraction. Located in cleavage furrow; microtubule cytoskeleton;
    and midbody. Part of centralspindlin complex. Is expressed in germ cell and gonad.
    Human ortholog(s) of this gene implicated in congenital dyserythropoietic anemia
    type IIIa. Orthologous to human KIF23 (kinesin family member 23).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00006974;class=Gene
  source_id: WB:WBGene00006974
