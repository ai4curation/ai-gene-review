- term:
    id: GO:0000281
    label: mitotic cytokinesis
  evidence_type: IMP
  original_reference_id: PMID:9693365
  qualifier: involved_in
  review:
    summary: zen-4 null (maternal and zygotic) embryos initiate furrows that then regress, leaving multinucleate
      cells.
    action: NEW
    reason: 'This passes the NEW bar. ZEN-4 is not a substrate of cytokinesis: it carries out a step itself,
      as the motor subunit that cross-links midzone microtubules into the central spindle and midbody
      on which furrow completion depends. Comparator check: the CYK-4 review (cyk-4, same complex) carries
      mitotic cytokinesis, and KIF23 in human is the canonical cytokinesis kinesin. The process is absent
      from GOA for zen-4 only because older rows used narrower terms.'
    supported_by:
    - reference_id: PMID:9693365
      supporting_text: Here, we report the identification of a null allele of zen-4 , an MKLP1 homologue
        in the nematode Caenorhabditis elegans , and demonstrate that ZEN-4 is essential for cytokinesis.
    - reference_id: PMID:9693365
      supporting_text: Time-lapse recordings and microtubule staining reveal that the cytokinesis defect
        is preceded by the dissociation of the midzone microtubules.
    - reference_id: PMID:9693365
      supporting_text: Time-lapse videomicroscopy reveals that the furrow continues to expand for ∼2–3
        min but stalls at the region of the spindle midzone (Figure 6 ).
