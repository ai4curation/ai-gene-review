id: G5EG83
gene_symbol: zen-4
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: 'ZEN-4 (M03D4.1) is the Caenorhabditis elegans kinesin-6 of the MKLP1/KIF23 subfamily. It
  is the motor subunit of centralspindlin, a constitutive 2:2 heterotetramer with the RhoGAP CYK-4. The
  protein has an N-terminal kinesin motor domain, a long neck that folds into a globular mass bound by
  the CYK-4 N terminus, a coiled coil that dimerizes it, and a C-terminal MKLP1 Arf-binding domain. Purified
  ZEN-4 is a plus-end-directed microtubule motor that cross-links microtubules; CYK-4 binding slows it
  and reconfigures the motor heads so that centralspindlin selectively bundles and accumulates on antiparallel
  microtubule overlaps. Recruited by the Aurora B kinase AIR-2 and interdependent with CDC-14 for localization,
  ZEN-4 concentrates on the spindle midzone in anaphase and persists at the midbody and midbody remnant.
  It is essential for building the central spindle and for completing cytokinesis: without ZEN-4 furrows
  ingress, then regress, and embryos become multinucleate. It is also required for polar body extrusion
  after meiosis, and the midbody it builds anchors factors such as the LEM-3 nuclease that resolves late
  chromatin bridges.'
