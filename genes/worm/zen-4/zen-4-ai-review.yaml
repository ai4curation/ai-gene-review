      supporting_text: In contrast, when embryos treated with combination of partial mcm-7 RNAi and zen-4
        or cyk-4 RNAi, chromatin bridges formed with high penetrance in (4/7) and (4/9) cases, respectively
    - reference_id: PMID:29463814
      supporting_text: This finding indicates that the spindle midzone is important for the resolution
        of chromatin bridges, and by inference suggests that LEM-3 midbody localization might have a role
        in this.
