suggested_questions:
- question: Is ZEN-4 required for assembly of the meiotic anaphase midzone, or only localized there? Dumont
    et al. (2010) report that its inhibition did not prevent meiotic anaphase bundles, which conflicts
    with the IMP annotation to meiotic spindle midzone assembly.
- question: Antiparallel microtubule bundling is a property of the ZEN-4/CYK-4 complex, not of either
    subunit alone. Should GO model this as a complex-level MF (for example a microtubule cross-linking/bundling
    activity of centralspindlin) rather than only as a BP?
suggested_experiments:
- description: Use auxin-inducible degradation of ZEN-4 in oocytes, with quantitative imaging of meiotic
    anaphase microtubule overlap length and chromosome separation, to test whether ZEN-4 contributes to
    meiotic midzone organization.
  experiment_type: conditional depletion with live imaging
