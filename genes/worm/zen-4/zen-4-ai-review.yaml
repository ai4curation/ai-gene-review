  review:
    summary: Combined partial mcm-7 RNAi and zen-4 RNAi produces anaphase chromatin bridges, which neither
      depletion causes alone.
    action: MARK_AS_OVER_ANNOTATED
    reason: ZEN-4 does no work in separating sister chromatids. The authors interpret the synthetic bridges
      as loss of the midbody that tethers the LEM-3 nuclease, which resolves bridges. ZEN-4 builds that
      platform, so the effect on chromatid segregation is indirect. The row is not wrong as a phenotype
      but over-states participation.
    supported_by:
