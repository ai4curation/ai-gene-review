  title: WormBase gene description for zen-4 (worm)
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: UNVERIFIED
    review_notes: WormBase curated description. Checked claims. Kinesin-6 identity, requirements for polar
      body extrusion, completion of cytokinesis and midzone microtubules, midzone and midbody remnant localization,
      and AIR-2-dependent recruitment agree with PMID:9693365 and PMID:11050384. The statement that zen-4
      functions with cyk-1 to regulate pronuclear migration comes from the IGI in PMID:11050384, whose full
      text is not cached; zen-4 single mutants have normal pronuclear migration (PMID:9693365), and the review
      keeps that row as over-annotated, so this claim could not be verified and no defect is recorded. Occasional
      centrosome localization was not checked. The text omits that ZEN-4 acts as the motor subunit of
      centralspindlin with CYK-4 (PMID:25875822); recorded as a missing statement.
    source_defects:
    - defect_type: MISSING_STATEMENT
      resource: WORMBASE
      record: WB:WBGene00006974
      slot: MOD_provided_gene_description
      requested_change: ADD
      asserted_value: WB:WBGene00006974
      confidence: PROBABLE
      explanation: The WormBase description does not name CYK-4. ZEN-4 is the MKLP1 (kinesin-6) subunit of
        centralspindlin, a heterotetramer with the RhoGAP CYK-4; CYK-4 binds the ZEN-4 neck and reconfigures
        the motor so that the complex bundles antiparallel microtubules, and both subunits are essential for
        bundling (PMID:25875822). The description could add ZEN-4's role as part of centralspindlin with CYK-4.
      supported_by:
      - reference_id: PMID:25875822
        supporting_text: A part of the neck domain of the MKLP1 subunit of centralspindlin folds into a globular
          domain, which provides the binding site for the N-terminal non-coiled coil region of the CYK4 subunit.
core_functions:
- description: Plus-end-directed kinesin-6 motor subunit of centralspindlin. With CYK-4 it cross-links
    and accumulates on antiparallel microtubule overlaps to build the central spindle and midbody, which
    is required to complete mitotic cytokinesis and polar body extrusion.
