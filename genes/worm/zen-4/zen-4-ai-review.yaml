- term:
    id: GO:0031991
    label: regulation of actomyosin contractile ring contraction
  evidence_type: IGI
  original_reference_id: PMID:11050384
  qualifier: involved_in
  supporting_entities:
  - WB:WBGene00000872
  review:
    summary: Loss of ZEN-4 lets the cleavage furrow ingress partway and then regress. The IGI row records
      the genetic interaction with the formin CYK-1.
    action: KEEP_AS_NON_CORE
    reason: The phenotype is a late cytokinesis failure. Raich et al. show the furrow initiates normally
      and stalls at the midzone, and Gruneberg et al. conclude ZEN-4 has no direct role in actomyosin
      ring formation. Centralspindlin does promote cortical contractility through its CYK-4 subunit, so
      regulation of ring contraction is defensible. It is downstream of ZEN-4's own activity (midzone
      bundling), so it is kept as non-core. Mitotic cytokinesis (GO:0000281) is added as NEW.
    supported_by:
    - reference_id: PMID:9693365
      supporting_text: Time-lapse videomicroscopy reveals that the furrow continues to expand for ∼2–3
        min but stalls at the region of the spindle midzone (Figure 6 ).
    - reference_id: PMID:12213836
      supporting_text: Thus, we do not believe that either CeCDC-14 or ZEN-4 play a direct role in actomyosin
        ring formation
    - reference_id: PMID:11050384
      supporting_text: AIR-2 and ZEN-4 shared similar genetic interactions with the formin homology (FH)
        protein CYK-1
    - reference_id: PMID:11050384
      supporting_text: ZEN-4 is first required late in cytokinesis, and also functions to maintain cell
        separation through much of the subsequent interphase.
