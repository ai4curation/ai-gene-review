gene_symbol: mksr-1
organism: worm
uniprot_id: Q21191
taxon_id: NCBITaxon:6239
descriptions:
- source: Alliance_Imported
  text: mkrs-1 encodes an ortholog of human B9D1, paralogous to MKRS-2 and MKS-1;
    MKRS-1 is required for fully normal foraging behavior, and is redundantly required
    with NPH-4 for roughly normal foraging, and with both NPH-1 and NPH-4 for cilia
    formation; mkrs-1 is expressed generally in neurons throughout the body, with
    ciliary neuron expression being dependent on DAF-19; MKRS-1 forms a complex with
    MKRS-2 and MKS-1 at the base of cilia, and is coexpressed with these proteins
    in ciliated sensory neurons; MKRS-1 requires MKRS-2 for localization to the transistion
    zone, and binds MKRS-2 in two-hybrid assays.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00019364;class=Gene
  source_id: WB:WBGene00019364
- source: Alliance_Automated
  text: Involved in several processes, including determination of adult lifespan;
    larval foraging behavior; and non-motile cilium assembly. Located in ciliary transition
    zone. Is expressed in nervous system. Human ortholog(s) of this gene implicated
    in Joubert syndrome 27 and Meckel syndrome 9. Orthologous to human B9D1 (B9 domain
    containing 1).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00019364;class=Gene
