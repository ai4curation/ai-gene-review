  review:
    summary: Atg1/ULK1 is required for mitophagy in yeast and mammals. In worms, unc-51 mutants keep more
      mtDNA during starvation, showing that UNC-51-dependent autophagy removes mitochondria.
    action: KEEP_AS_NON_CORE
    reason: The worm evidence points to bulk (nonselective) autophagy of mitochondria during starvation
      rather than a mitophagy-specific role, so it is kept as a non-core consequence of general autophagy
      initiation.
    supported_by:
    - reference_id: PMID:30133321
      supporting_text: Autophagy mutants unc-51/Atg1 and atg-18/Atg18 maintained greater mtDNA content
        than wild-type worms during starvation, suggesting that autophagy promotes mitochondrial degradation
        during starvation
