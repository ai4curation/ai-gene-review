    supporting_text: show that VAB-8 and UNC-14 can be targets of UNC-51 kinase activity
  - reference_id: PMID:16887826
    supporting_text: These results suggest that UNC-51 and UNC-14 regulate the subcellular localization
      of the Netrin receptor UNC-5
  - reference_id: PMID:20392746
    supporting_text: In C. elegans, UNC-51 regulates the axon guidance of many neurons by a different
      mechanism than it and its homologs use for autophagy
  - reference_id: PMID:7958904
