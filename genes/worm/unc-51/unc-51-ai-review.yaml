- description: Neuronal Ser/Thr kinase that phosphorylates UNC-14 and VAB-8 and controls UNC-5 receptor
    localization to direct axon outgrowth and guidance, separately from its autophagy role.
  molecular_function:
    id: GO:0004674
    label: protein serine/threonine kinase activity
