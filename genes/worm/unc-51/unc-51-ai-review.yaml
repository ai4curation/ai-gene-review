id: Q23023
gene_symbol: unc-51
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: UNC-51 is the C. elegans ortholog of yeast Atg1 and mammalian ULK1/ULK2, an 856-residue serine/threonine
  protein kinase with an N-terminal kinase domain and C-terminal MIT-like domains. It has two separable
  roles. In autophagy, UNC-51 is the catalytic subunit of the initiation complex with EPG-1/ATG-13 and
  EPG-9/ATG101; the complex is recruited to preautophagosomal structures, in part through a LIR motif
  that binds LGG-1, and is needed for autophagosome formation, aggrephagy, survival of starvation, dauer
  morphogenesis and lifespan extension. In neurons, UNC-51 is needed for axon outgrowth and guidance,
  a role that does not need other autophagy genes. There it binds and phosphorylates UNC-14 (a RUN domain
  protein) and VAB-8, controls the subcellular localization of the Netrin receptor UNC-5, is opposed by
  PP2A (LET-92), and phosphorylates the histidine phosphatase PHIP-1 to promote axon regeneration.
