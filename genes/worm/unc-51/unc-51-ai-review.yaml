      activity and was dominant negative, indicating that the kinase domain of Unc-51 is essential for
      the function
suggested_questions:
- question: What are the in vivo autophagy substrates of UNC-51 in C. elegans (for example ATG-9, EPG-1
    or the BEC-1/VPS-34 complex), and are they the same sites phosphorylated by ULK1 in mammals?
- question: 'How is the axon-guidance function of UNC-51 kept separate from its autophagy function: by
    distinct partners (UNC-14, VAB-8 versus EPG-1/EPG-9), distinct pools, or distinct substrates?'
suggested_experiments:
- description: Phosphoproteomics of unc-51 null versus kinase-dead knock-in animals under starvation to
    identify autophagy-specific substrates.
- description: Neuron-specific depletion of epg-1/epg-9 versus unc-14 to test whether the axon-guidance
    and autophagy pools of UNC-51 use separate complexes.
