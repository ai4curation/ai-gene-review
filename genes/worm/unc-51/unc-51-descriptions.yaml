- source: Alliance_Automated
  text: Enables protein serine kinase activity and protein serine/threonine kinase
    activity. Involved in several processes, including determination of adult lifespan;
    nematode male tail tip morphogenesis; and regulation of axon extension. Located
    in axon and neuronal cell body. Is expressed in body wall musculature; neurons;
    and pharyngeal muscle cell. Orthologous to human ULK1 (unc-51 like autophagy activating
    kinase 1) and ULK2 (unc-51 like autophagy activating kinase 2).
