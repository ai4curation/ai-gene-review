descriptions:
- source: UniProt
  text: Protein kinase important for axonal elongation and axonal guidance (PubMed:15539493,
    PubMed:7958904). Functions in the CAN axons to direct both anterior and posterior
    migrations (PubMed:15539493). Phosphorylates both unc-14 and vab-8 (PubMed:15539493).
    Component of the unc-51/atg-13 complex that is probably recruited by lgg-1 to
    preautophagosomes and is required for autophagosome formation (PubMed:12958363,
    PubMed:17890369, PubMed:19377305, PubMed:26687600). Interaction with autophagy
    related proteins such as atg-13 links it to the autophagy machinery to in turn
    promote P-granule degradation in somatic cells (PubMed:19377305). Plays a role
    in mitophagy during limited food availability (PubMed:30133321). Regulates cell
    size (PubMed:17890369). Plays a role in male tail ray pattern formation (PubMed:17890369).
    May be required for normal dauer morphogenesis (PubMed:12958363).
