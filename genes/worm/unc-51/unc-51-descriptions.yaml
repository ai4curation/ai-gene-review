descriptions:
- source: UniProt
  text: Protein kinase important for axonal elongation and axonal guidance (PubMed:15539493,
    PubMed:7958904). Functions in the CAN axons to direct both anterior and posterior
    migrations (PubMed:15539493). Phosphorylates both unc-14 and vab-8 (PubMed:15539493).
    Component of the unc-51/atg-13 complex that is probably recruited by lgg-1 to
    preautophagosomes and is required for autophagosome formation (PubMed:12958363,
    PubMed:17890369, PubMed:19377305, PubMed:26687600). Interaction with autophagy
    related proteins such as atg-13 links it to the autophagy machinery to in turn
    promote P-granule degradation in somatic cells (PubMed:19377305). Plays a role
    in mitophagy during limited food availability (PubMed:30133321). Regulates cell
    size (PubMed:17890369). Plays a role in male tail ray pattern formation (PubMed:17890369).
    May be required for normal dauer morphogenesis (PubMed:12958363).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q23023
  source_id: Q23023
- source: Alliance_Imported
  text: unc-51 encodes a serine/threonine protein kinase orthologous to Saccharomyces
    cerevisiae autophagy protein Atg1p and the vertebrate ULK proteins; unc-51 is
    required for axon outgrowth along the anterior-posterior axis and sex myoblast
    migration; in regulating axon outgrowth, UNC-51 functions together with the VAB-8
    kinesin-like protein and UNC-14, both of which physically interact with, and are
    phosphorylated by, UNC-51, and with the UNC-5 Netrin receptor, whose subcellular
    localization in neurons is regulated by UNC-51 and UNC-14; in addition, UNC-51
    is required for normal dauer morphogenesis of daf-2 mutant animals; UNC-51 is
    expressed in all C. elegans neurons and in body wall and pharyngeal muscles; in
    neurons, an UNC-51::GFP fusion protein shows punctate cytoplasmic localization
    in axons and cell bodies and partial co-localization with UNC-14 and UNC-5.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00006786;class=Gene
  source_id: WB:WBGene00006786
- source: Alliance_Automated
  text: Enables protein serine kinase activity and protein serine/threonine kinase
    activity. Involved in several processes, including determination of adult lifespan;
    nematode male tail tip morphogenesis; and regulation of axon extension. Located
    in axon and neuronal cell body. Is expressed in body wall musculature; neurons;
    and pharyngeal muscle cell. Orthologous to human ULK1 (unc-51 like autophagy activating
    kinase 1) and ULK2 (unc-51 like autophagy activating kinase 2).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00006786;class=Gene
  source_id: WB:WBGene00006786
