- source: Alliance_Imported
  text: sel-8 encodes a nuclear protein required for GLP-1 and LIN-12 signalling,
    that is analogous to (and may be homologous to) Drosophila MASTERMIND and its
    mammalian orthologs; SEL-8 (also known as LAG-3) forms a ternary complex with
    LAG-1/Su(H) and the intracellular domain of either GLP-1 or LIN-12; like MAM,
    SEL-8 is glutamine- and proline-rich; SEL-8 contains a novel motif shared with
    W09C5.1 and orthologs of W09C5.1 in S. cerevisiae (YER126c), Drosophila (DMIP259),
    and also has two prominent glutamine-rich domains.
  source_type: curated
