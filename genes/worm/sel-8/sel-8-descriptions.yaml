- source: Alliance_Automated
  text: Enables DNA-binding transcription factor binding activity; Notch binding activity;
    and transcription coactivator activity. Involved in several processes, including
    Notch signaling pathway; positive regulation of stem cell proliferation; and positive
    regulation of transcription by RNA polymerase II. Located in nucleus. Part of
    CSL-Notch-Mastermind transcription factor complex. Is expressed in several structures,
    including P3.p hermaphrodite; P4.p hermaphrodite; P5.p hermaphrodite; P6.p hermaphrodite;
    and neurons.
