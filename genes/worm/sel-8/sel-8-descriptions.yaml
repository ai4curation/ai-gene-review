descriptions:
- source: UniProt
  text: glp-1/Notch and lin-12/Notch proteins promote signaling by recruiting lag-3
    to target promoters, where it functions as a transcriptional activator, probably
    as part of a complex with a Notch intracellular domain (NICD) and the transcription
    regulator lag-1 (PubMed:10830967, PubMed:10884418, PubMed:16530045). Involved
    in the p53-mediated germ-cell apoptotic response to DNA damage, perhaps acting
    as a transcriptional activator (PubMed:17317671). May regulate phosphatase lip-1
    mRNA transcription downstream of glp-1 (PubMed:16319922).
  source_type: curated
