gene_symbol: sel-8
organism: worm
uniprot_id: Q09260
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: glp-1/Notch and lin-12/Notch proteins promote signaling by recruiting lag-3
    to target promoters, where it functions as a transcriptional activator, probably
    as part of a complex with a Notch intracellular domain (NICD) and the transcription
    regulator lag-1 (PubMed:10830967, PubMed:10884418, PubMed:16530045). Involved
    in the p53-mediated germ-cell apoptotic response to DNA damage, perhaps acting
    as a transcriptional activator (PubMed:17317671). May regulate phosphatase lip-1
    mRNA transcription downstream of glp-1 (PubMed:16319922).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q09260
  source_id: Q09260
- source: Alliance_Imported
  text: sel-8 encodes a nuclear protein required for GLP-1 and LIN-12 signalling,
    that is analogous to (and may be homologous to) Drosophila MASTERMIND and its
    mammalian orthologs; SEL-8 (also known as LAG-3) forms a ternary complex with
    LAG-1/Su(H) and the intracellular domain of either GLP-1 or LIN-12; like MAM,
    SEL-8 is glutamine- and proline-rich; SEL-8 contains a novel motif shared with
    W09C5.1 and orthologs of W09C5.1 in S. cerevisiae (YER126c), Drosophila (DMIP259),
    and also has two prominent glutamine-rich domains.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00004765;class=Gene
  source_id: WB:WBGene00004765
- source: Alliance_Automated
  text: Enables DNA-binding transcription factor binding activity; Notch binding activity;
    and transcription coactivator activity. Involved in several processes, including
    Notch signaling pathway; positive regulation of stem cell proliferation; and positive
    regulation of transcription by RNA polymerase II. Located in nucleus. Part of
    CSL-Notch-Mastermind transcription factor complex. Is expressed in several structures,
    including P3.p hermaphrodite; P4.p hermaphrodite; P5.p hermaphrodite; P6.p hermaphrodite;
    and neurons.
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00004765;class=Gene
  source_id: WB:WBGene00004765
