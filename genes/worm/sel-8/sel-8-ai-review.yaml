id: Q09260
gene_symbol: sel-8
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: >-
  sel-8 (also called lag-3) encodes the sole C. elegans member of the Mastermind/MAML family
  of Notch transcriptional coactivators. The glutamine-rich nuclear protein is recruited to
  DNA-bound LAG-1 (CSL) by the intracellular domains of the LIN-12 and GLP-1 Notch receptors,
  forming the CSL-Notch ICD-Mastermind ternary complex whose structure has been solved with
  the worm proteins; within this complex SEL-8/LAG-3 contacts the composite groove formed
  by the Notch ankyrin repeats and the CSL C-terminal domain and acts as the transcriptional
  activation module. It is required for essentially all LIN-12- and GLP-1-mediated cell fate
  decisions, including germline stem cell maintenance, anchor cell/ventral uterine specification,
  vulval and mesodermal (M lineage) patterning, and embryonic development. LAG-3 has also
  been reported to contribute to CEP-1/p53-dependent germ cell apoptosis after DNA damage.
