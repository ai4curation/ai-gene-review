- description: >-
    Mastermind-family transcriptional coactivator. SEL-8/LAG-3 is recruited by the LIN-12
    or GLP-1 intracellular domain to DNA-bound LAG-1/CSL, forming the CSL-NICD-Mastermind
    ternary complex, and supplies the transcriptional activation function that switches LAG-1
    target genes on.
