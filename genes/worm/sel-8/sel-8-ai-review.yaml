- term:
    id: GO:0005112
    label: Notch binding
  evidence_type: IPI
  original_reference_id: PMID:16530045
  qualifier: enables
  supporting_entities:
  - UniProtKB:P14585
  review:
    summary: >-
      In the worm CSL-Notch-Mastermind crystal structure, the Mastermind (LAG-3) helix binds
      the composite groove formed by the LIN-12 ankyrin repeats and the LAG-1 C-terminal domain.
    action: ACCEPT
    reason: >-
      LAG-3 directly contacts the Notch ANK repeat domain in the ternary complex, so binding
      to Notch is a real, structurally defined interaction. The binding is only stable in
      the context of CSL (it is a composite-interface interaction), so it is the means by
      which the coactivator is recruited rather than a standalone function. Accepted as a
      correct but supporting MF.
    supported_by:
    - reference_id: PMID:16530045
      supporting_text: >-
        Here we report the 3.1 A structure of the ternary complex formed by CSL, NotchIC,
        and Mastermind bound to DNA.
    - reference_id: PMID:16530045
      supporting_text: >-
        the C-terminal domain of CSL has an unanticipated central role in the interface formed
        with the Notch ankyrin repeats and Mastermind.
