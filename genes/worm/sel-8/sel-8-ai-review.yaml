suggested_questions:
- question: >-
    Does SEL-8/LAG-3 recruit CBP/p300 (CBP-1) and CDK8/Mediator in C. elegans as MAML1 does
    in mammals, and which of its glutamine-rich regions carries the activation function?
- question: >-
    Is the reported contribution of LAG-3 to CEP-1/p53-dependent germ cell apoptosis a direct
    coactivator function at CEP-1 target promoters or an indirect consequence of Notch signaling?
suggested_experiments:
- description: >-
    ChIP-seq/CUT&RUN of endogenously tagged SEL-8 with and without GLP-1 or LIN-12 activity
    to test whether its chromatin occupancy is strictly Notch ICD- and LAG-1-dependent at
    lst-1, sygl-1 and other LAG-1 targets.
