  review:
    summary: >-
      SEL-8/LAG-3 is the single C. elegans Mastermind-family coactivator; it joins the LAG-1/CSL-Notch
      intracellular domain complex and is a potent transcriptional activator.
    action: ACCEPT
    reason: >-
      Transcription coactivator activity is the core molecular function of SEL-8/LAG-3. It
      is recruited to DNA-bound LAG-1 by the Notch ICD and activates transcription (yeast
      activation assay), and it is the worm counterpart of the Mastermind/MAML coactivators.
      This is the most informative MF term and is consistent with the ternary complex structures.
    supported_by:
