    - reference_id: PMID:10830967
      supporting_text: >-
        LAG-3 is a potent transcriptional activator in yeast, and a Myc-tagged LAG-3 is predominantly
        nuclear in C. elegans.
    - reference_id: PMID:10830967
      supporting_text: >-
