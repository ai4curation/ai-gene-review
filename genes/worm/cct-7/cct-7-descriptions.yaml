gene_symbol: cct-7
organism: worm
uniprot_id: Q9TZS5
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Molecular chaperone; assists the folding of proteins upon ATP hydrolysis.
    Known to play a role, in vitro, in the folding of actin and tubulin.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q9TZS5
  source_id: Q9TZS5
- source: Alliance_Imported
  text: cct-7 encodes a putative eta subunit of the eukaryotic cytosolic ('T complex')
    chaperonin, orthologous to human CCT7 (OMIM:605140); CCT-7 is expressed in most,
    if not all, tissues; in mass RNAi assays, CCT-7 is required for normal transgene
    repression and subcellular localization, embryonic and larval viability, fertility,
    vulval development, and normal locomotion.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00020391;class=Gene
  source_id: WB:WBGene00020391
- source: Alliance_Automated
  text: Predicted to enable ATP binding activity; ATP hydrolysis activity; and ATP-dependent
    protein folding chaperone. Predicted to be involved in protein folding. Predicted
    to be located in cytoplasm. Predicted to be part of chaperonin-containing T-complex.
    Is expressed in several structures, including anchor cell; head; pharynx; tail;
    and vulval muscle. Orthologous to human CCT7 (chaperonin containing TCP1 subunit
    7).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00020391;class=Gene
  source_id: WB:WBGene00020391
- source: RefSeq
  text: Predicted to enable unfolded protein binding activity. Predicted to be involved
