- term:
    id: GO:0000303
    label: response to superoxide
  evidence_type: IMP
  original_reference_id: PMID:18454199
  review:
    summary: eat-3 mutants are hypersensitive to paraquat and show induction of SOD-2. 
      This is a stress response consequence of mitochondrial dysfunction.
    action: KEEP_AS_NON_CORE
    reason: eat-3 mutants show hypersensitivity to paraquat (superoxide) and compensatory 
      induction of SOD-2, but this is a consequence of mitochondrial dysfunction leading 
      to increased ROS production, not a primary function in oxidative stress response.
    supported_by:
    - reference_id: PMID:18454199
      supporting_text: eat-3 mutants are hypersensitive to paraquat, which promotes damage
        by free radicals, and they are sensitive to loss of the mitochondrial superoxide 
        dismutase sod-2. We conclude that free radicals contribute to the pathology of C. 
        elegans eat-3 mutants.
    - reference_id: PMID:18454199
      supporting_text: Fe/Mn-SOD expression is induced more than two-fold in eat-3(ad426) 
        animals... This induction is almost entirely attributable to SOD-2
- term:
    id: GO:0007005
    label: mitochondrion organization
  evidence_type: IMP
  original_reference_id: PMID:18454199
  review:
    summary: EAT-3 promotes mitochondrial inner-membrane fusion and maintains cristae 
      architecture.
    action: ACCEPT
    reason: 'PMID:18454199 combines target genetics, rescue and electron microscopy: mutant
      mitochondria fragment, contain inner-membrane septae and have reduced cristae. The phenotype
      and conserved OPA1/Mgm1 mechanism support direct membrane-organization work rather than
      only an upstream requirement for mitochondrial health. No respiratory-chain catalytic
      activity is inferred.'
    supported_by:
    - reference_id: PMID:18454199
      supporting_text: "Electron microscopy shows that \nthe matrices of fragmented mitochondria
        in eat-3 mutants are divided by inner \nmembrane septae, suggestive of a specific defect
        in fusion of the mitochondrial \ninner membrane."
