- id: PMID:18454199
  title: The C. elegans Opa1 homologue EAT-3 is essential for resistance to free radicals.
  findings:
  - statement: EAT-3 is the C. elegans ortholog of OPA1/Mgm1, with conserved dynamin 
      domains
    supporting_text: 'Similar to yeast Mgm1 and mammalian Opa1, this C. elegans protein has
      a putative mitochondrial targeting sequence followed by domains that are typical of dynamin
      family members: a conserved GTPase domain, a middle domain and a GED or assembly domain'
  - statement: eat-3 mutations cause mitochondrial fragmentation with inner membrane 
      septae
    supporting_text: We find that mutations in the C. elegans eat-3 locus cause 
      mitochondria to fragment in agreement with the mutant phenotypes observed in yeast 
      and mammalian cells. Electron microscopy shows that the matrices of fragmented 
      mitochondria in eat-3 mutants are divided by inner membrane septae, suggestive of a 
      specific defect in fusion of the mitochondrial inner membrane.
  - statement: Cristae length is reduced by 66.2% after normalization to inner-boundary 
      membrane length.
    supporting_text: There is, however, still a 66.2% decrease of total cristae length 
      when normalized with the lengths of inner boundary membranes or a 70.3% decrease 
      when normalized with the surface area of the mitochondrial section.
  - statement: eat-3 mutants are hypersensitive to paraquat and induce SOD-2
    supporting_text: eat-3 mutants are hypersensitive to paraquat, which promotes damage 
      by free radicals, and they are sensitive to loss of the mitochondrial superoxide 
      dismutase sod-2. We conclude that free radicals contribute to the pathology of C. 
      elegans eat-3 mutants.
  - statement: drp-1 mutations suppress eat-3 phenotypes
    supporting_text: We conclude that a functioning mitochondrial division apparatus is 
      required for the mitochondrial fragmentation induced by mutant eat-3.
  - statement: ced-3/ced-4 mutations do not suppress eat-3 phenotypes
    supporting_text: Although mammalian Opa1 is antiapoptotic, mutations in the canonical 
      C. elegans cell death genes ced-3 and ced-4 do not suppress the slow growth and 
      small broodsize phenotypes of eat-3 mutants.
- id: PMID:18722182
  title: Caenorhabditis elegans drp-1 and fis-2 regulate distinct cell-death execution 
    pathways downstream of ced-3 and independent of ced-9.
  findings:
