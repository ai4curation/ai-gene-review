- term:
    id: GO:0016559
    label: peroxisome fission
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: The inherited nonmitochondrial function requires assessment beyond the 
      dominant inner-membrane role.
    action: UNDECIDED
    reason: The GOA assertion traces to PTN008520527 in PTHR11566. Primary experiments 
      establish mitochondrial targeting, protease-protected localization, inner-membrane 
      fusion and cristae organization. These findings create a mechanistic question about 
      access to cytosolic microtubules or peroxisomes, but do not alone exclude every 
      precursor, processed form or additional context. The previous rejection relied on 
      principal localization and family specialization without resolving inheritance or
      loss at the relevant ancestral node. Keep the exact inherited claim unresolved
      after the focused source/target report. The
      report confirms that PTN000170013 and PTN008520527 are ancestors of OPA1 node 
      PTN007514526, so donor specialization alone does not overturn the ancestral 
      placement. Its missing PH/PRD/GED-domain argument is not a demonstrated requirement 
      for every microtubule interaction or membrane-remodeling mechanism. Rejection does
      not require a negative capacity assay. Here the ancestry is verified and the
      proposed domain-loss premise is contradicted; topology remains a strong
      mechanistic constraint requiring adjudication of inheritance or loss. PMID:32228866 explicitly
      identifies human OPA1 middle/GED stalk architecture (Fig. 1A and Fig. 3); the 
      report's claimed absence of GED is therefore not a valid family-level premise. This 
      ortholog structure does not itself demonstrate the disputed EAT-3 capacity.
    propagation_review:
      root_cause: UNRESOLVED
      source_entities:
      - source_id: PANTHER:PTN008520527
        source_label: PTN008520527
        source_status: UNRESOLVED
        comment: Actual PAINT IBD recovered. Mitochondrial topology is a constraint to 
          investigate, not by itself proof that the inherited capacity was lost.
    supported_by:
    - reference_id: PMID:21248201
      supporting_text: MOMA-1 and F55F8.6 proteins are both much more sensitive to 
        proteases than EAT-3
    - reference_id: 
        file:worm/eat-3/eat-3-hypotheses/microtubule-and-peroxisome-capacities/openscientist.md
      supporting_text: this reasoning does not *prove* that EAT-3 can never, under any 
        engineered or stress condition, contact a microtubule or a peroxisome.
    - reference_id: PMID:32228866
      supporting_text: OPA1 contains an N-terminal mitochondrial targeting sequence (MTS),
        a following transmembrane domain (TM), a coiled-coil domain, a highly conserved 
        GTPase domain, a middle domain, and a C-terminal GTPase effector domain (GED).
