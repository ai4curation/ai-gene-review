- term:
    id: GO:0006915
    label: apoptotic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000043
  review:
    summary: Direct C. elegans assays argue against transferring the canonical OPA1 
      apoptotic role to EAT-3.
    action: REMOVE
    reason: This decision rests on experiments, not absence of target publications or 
      mitochondrial specialization. PMID:18454199 finds no increase in dying embryonic 
      cells and no rescue of growth or brood-size defects by ced-3/ced-4 loss. 
      PMID:18722182 additionally tests developmental cell-corpse profiles, inappropriate 
      pharyngeal-cell survival and a sensitized ced-3 background without detecting an 
      eat-3-dependent death effect. These data oppose the inherited canonical apoptotic 
      role represented by the keyword mapping, while not proving that EAT-3 can never 
      affect death under any untested stress.
    supported_by:
    - reference_id: PMID:18722182
      supporting_text: Analysis of fzo-1(tm1133); ced-3(n2438) animals and eat-3(ad426); 
        ced-3(n2438) animals did not reveal a significant decrease or increase in the 
        number of extra cells compared with ced-3(n2438) animals
- term:
    id: GO:0008289
    label: lipid binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000043
  review:
    summary: Lipid interaction is a supported family mechanism of OPA1/Mgm1-type membrane 
      remodeling.
    action: ACCEPT
    reason: Retain this inferred EAT-3 lipid-binding activity while clearly distinguishing
      ortholog biochemistry from direct worm assays. PMID:19703904 maps lipid-binding 
      determinants in yeast Mgm1 using liposome association, activity and complementation 
      experiments; PMID:28628083 reconstitutes human OPA1-cardiolipin fusion. These are 
      relevant support for conservation of the broad function. The old added PMID:23226476
      instead concerns hCG-driven mouse reproductive dysfunction and tumorigenesis, and is
      withdrawn as a wrong supporting identifier.
    supported_by:
    - reference_id: PMID:19703904
      supporting_text: 'Here, we demonstrate that

        s-Mgm1 binds to a mixture of phospholipids characteristic of the mitochondrial

        inner membrane.'
    - reference_id: PMID:28628083
      supporting_text: 'L-OPA1 and

        cardiolipin (CL) cooperate in heterotypic mitochondrial IM fusion.'
