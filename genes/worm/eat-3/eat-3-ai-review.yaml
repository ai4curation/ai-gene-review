- term:
    id: GO:0005739
    label: mitochondrion
  evidence_type: IDA
  original_reference_id: PMID:21248201
  review:
    summary: EAT-3 is experimentally recovered in the mitochondrial fraction.
    action: ACCEPT
    reason: 'Although the paper foregrounds MOMA-1, PMID:21248201 explicitly assays EAT-3 as
      a compartment control: 88% is in the mitochondrial pellet, and it is protected from protease
      in intact mitochondria. This is direct evidence on EAT-3, not a citation misattributed
      from the protein named in the title.'
    supported_by:
    - reference_id: PMID:21248201
      supporting_text: 'The distributions were quantified with densitometry of P2 and S2 fractions:
        88% of EAT-3, 12% of tubulin, and 98% of MOMA-1 is in the mitochondrial pellet.'
- term:
    id: GO:0002119
    label: nematode larval development
  evidence_type: IGI
  original_reference_id: PMID:18454199
  review:
    summary: eat-3 mutants have slow development and growth defects. This is a phenotypic 
      consequence of mitochondrial dysfunction rather than a core function.
    action: KEEP_AS_NON_CORE
    reason: While eat-3 mutants do have developmental defects (slow growth, delayed 
      development), these are secondary consequences of impaired mitochondrial function 
      rather than a direct role in development. The core function is mitochondrial inner 
      membrane fusion.
    supported_by:
    - reference_id: PMID:18454199
      supporting_text: Worms injected with eat-3 dsRNA give viable progeny but their brood
        size is reduced... The F1 worms remain small, are sluggish and develop slowly.
- term:
    id: GO:0040014
    label: regulation of multicellular organism growth
  evidence_type: IMP
  original_reference_id: PMID:18454199
  review:
    summary: eat-3 mutants show growth defects, but this is a pleiotropic consequence of 
      mitochondrial dysfunction rather than a direct regulatory role in growth.
    action: KEEP_AS_NON_CORE
    reason: eat-3 loss of function causes slow growth and small body size, but this is due
      to impaired mitochondrial function (oxidative phosphorylation defects) rather than a
      direct role in regulating organismal growth. The growth defects are consistent with 
      metabolic insufficiency.
    supported_by:
    - reference_id: PMID:18454199
      supporting_text: eat-3 RNAi worms rarely reach 0.5 mm, consistent with a previous 
        study showing that the eat-3(ad426) mutant also remains small... developmental 
        decisions are normal, but the rate of development is greatly reduced as one might 
        expect from a general decrease in metabolic activity.
- term:
    id: GO:0040014
    label: regulation of multicellular organism growth
  evidence_type: IGI
  original_reference_id: PMID:18454199
