  title: 'EAT-3: microtubule and peroxisome capacities'
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: Full report read. Correctly emphasizes mitochondrial fusion/topology and
      recovers the relevant ancestral nodes. However, both challenged nodes are ancestors 
      of the OPA1 node, not transfers from an exclusively separate DRP1 clade. Missing 
      conventional dynamin modules and absence of target experiments do not establish loss
      of all binding or process capacities. No target negative assay or executable 
      tree/domain artifact was supplied. Full PMID:32228866 explicitly describes the OPA1 
      middle/GED stalk, contradicting the report's claimed missing GED module.
