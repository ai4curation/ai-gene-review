id: Q18965
gene_symbol: eat-3
product_type: PROTEIN
status: IN_PROGRESS
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: EAT-3 is the Caenorhabditis elegans ortholog of mammalian OPA1, a 
  dynamin-family GTPase that promotes mitochondrial inner-membrane fusion and maintains 
  cristae architecture. It has a mitochondrial targeting sequence and conserved GTPase and
  assembly domains, and acts at the inner membrane with an intermembrane-space-exposed 
  region. Loss of eat-3 causes mitochondrial fragmentation, inner-membrane septae, reduced
  cristae, slow growth, reduced brood size and increased sensitivity to 
  superoxide-generating paraquat. Genetic suppression and mitochondrial ultrastructure 
  connect these phenotypes to membrane dynamics and oxidative-stress resistance.

existing_annotations:
- term:
    id: GO:0003924
    label: GTPase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: EAT-3 retains the dynamin-family GTP-binding and hydrolytic mechanism 
      underlying mitochondrial membrane remodeling.
    action: ACCEPT
    reason: The GTPase IBD is at PTN000170013 in PTHR11566. EAT-3 has conserved 
      nucleotide-binding motifs, and primary mutations and intragenic suppressors in its 
      GTPase domain alter and restore biological function (PMID:18454199). Those 
      suppressor experiments are genetic, not direct measurements of rescued enzyme 
      activity; the authors propose restoration of GTP interaction or 
      hydrolysis-associated conformational changes. Broad nucleotide binding and hydrolase
      annotations remain valid alongside GTPase specificity.
    supported_by:
    - reference_id: PMID:18454199
      supporting_text: It seems likely that they restore the ability of the G2 threonine 
        to interact properly with GTP or make the conformational changes that occur during
        GTP hydrolysis.
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: Cytoplasm is an accurate broad compartment for a mitochondrial protein.
    action: ACCEPT
    reason: The PTN000170013 cytoplasm IBD does not imply free cytosolic localization. 
      Mitochondria are cytoplasmic organelles, so the experimentally supported 
      mitochondrial and intermembrane-space localizations are compatible with this broad 
      term. The previous objection conflated cytoplasm with cytosol.
