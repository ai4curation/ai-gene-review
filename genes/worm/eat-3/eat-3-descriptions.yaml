descriptions:
- source: Alliance_Imported
  text: eat-3 encodes a mitochondrial dynamin family member, closely related to bacterial
    dynamin-like proteins, that is orthologous to human Opa1 (OMIM:203740, mutated
    in autosomal dominant optic atrophy) and budding yeast Mgm1; eat-3 is required
    for proper regulation of inner mitochondrial membrane fusion and normal mitochondrial
    function (oxidative phosphorylation); accordingly, eat-3 is also required for
    normal body size, growth rates, locomotion, and reproductive levels; eat-3 promoter
    fusions are expressed at high levels in the intestine, muscles, and neurons, with
    lower levels seen in other cell types; by similarity to its mammalian and yeast
    orthologs, EAT-3 is predicted to localize to the mitochondrial intermembrane space.
  source_type: curated
