gene_symbol: eat-3
organism: worm
uniprot_id: Q18965
taxon_id: NCBITaxon:6239
descriptions:
- source: Alliance_Imported
  text: eat-3 encodes a mitochondrial dynamin family member, closely related to bacterial
    dynamin-like proteins, that is orthologous to human Opa1 (OMIM:203740, mutated
    in autosomal dominant optic atrophy) and budding yeast Mgm1; eat-3 is required
    for proper regulation of inner mitochondrial membrane fusion and normal mitochondrial
    function (oxidative phosphorylation); accordingly, eat-3 is also required for
    normal body size, growth rates, locomotion, and reproductive levels; eat-3 promoter
    fusions are expressed at high levels in the intestine, muscles, and neurons, with
    lower levels seen in other cell types; by similarity to its mammalian and yeast
    orthologs, EAT-3 is predicted to localize to the mitochondrial intermembrane space.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00001134;class=Gene
  source_id: WB:WBGene00001134
- source: Alliance_Automated
  text: Predicted to enable GTPase activity and microtubule binding activity. Involved
    in several processes, including mitochondrial fusion; nematode larval development;
    and response to superoxide. Located in mitochondrion. Is expressed in intestinal
    cell; muscle cell; and neurons. Human ortholog(s) of this gene implicated in Behr
    syndrome; dominant optic atrophy plus syndrome; glaucoma; mitochondrial DNA depletion
    syndrome 14; and optic atrophy (multiple). Orthologous to human OPA1 (OPA1 mitochondrial
    dynamin like GTPase).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00001134;class=Gene
  source_id: WB:WBGene00001134
