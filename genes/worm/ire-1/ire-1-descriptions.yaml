- source: Alliance_Automated
  text: Predicted to enable RNA endonuclease activity and protein serine/threonine
    kinase activity. Involved in IRE1-mediated unfolded protein response; nematode
    larval development; and positive regulation of transcription by RNA polymerase
    II. Is active in neuronal cell body. Is expressed widely. Human ortholog(s) of
    this gene implicated in hepatocellular carcinoma. Orthologous to several human
    genes including ERN2 (endoplasmic reticulum to nucleus signaling 2).
