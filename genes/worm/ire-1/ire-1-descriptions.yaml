gene_symbol: ire-1
organism: worm
uniprot_id: Q09499
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Senses unfolded proteins in the lumen of the endoplasmic reticulum via its
    N-terminal domain which leads to enzyme auto- activation (PubMed:11779465). The
    active endoribonuclease domain splices xbp-1 precursor mRNA to produce the mature
    form which then induces transcription of UPR target genes (PubMed:11779465). Unfolded
    protein response (UPR) transcriptional activation by ire-1, as well as translational
    attenuation by pek-1 in a complementary pathway, maintains ER homeostasis (PubMed:11779465,
    PubMed:16184190). Regulates the transcriptional up-regulation of nucleoside-diphosphatase
    apy-1 and many other genes, upon ER stress (PubMed:16184190, PubMed:18216284).
    By activating the UPR pathway during non-lethal hypoxia pre-conditioning, confers
    adaptive protection to subsequent exposure to hypoxia (PubMed:20733002). ire-1
    and pek-1 are redundant genes that control a pathway essential for larval development
    and survival (PubMed:11779465, PubMed:16184190). Plays a role in the nuclear retention
    of unspliced mRNAs (PubMed:23149939).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q09499
  source_id: Q09499
- source: Alliance_Imported
  text: ire-1 encodes a transmembrane serine/threonine protein kinase and site-specific
    endoribonuclease orthologous to Saccharomyces cerevisiae inositol-requiring 1
    protein kinase (Ire1) and human endoplasmic reticulum-to-nucleus signaling 1 (ERN1,
    OMIM:604033); IRE-1 is required for the unfolded protein response (UPR) that counteracts
    cellular stress induced by accumulation of unfolded proteins in the endoplasmic
    reticulum (ER); in response to ER stress, IRE-1 cleaves xbp-1 mRNA to produce
    transcriptionally active XBP-1 that positively regulates UPR gene expression in
    order to maintain ER homeostasis.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00002147;class=Gene
  source_id: WB:WBGene00002147
- source: Alliance_Automated
  text: Predicted to enable RNA endonuclease activity and protein serine/threonine
    kinase activity. Involved in IRE1-mediated unfolded protein response; nematode
    larval development; and positive regulation of transcription by RNA polymerase
    II. Is active in neuronal cell body. Is expressed widely. Human ortholog(s) of
    this gene implicated in hepatocellular carcinoma. Orthologous to several human
    genes including ERN2 (endoplasmic reticulum to nucleus signaling 2).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00002147;class=Gene
  source_id: WB:WBGene00002147
