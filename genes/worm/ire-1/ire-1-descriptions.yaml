- source: Alliance_Imported
  text: ire-1 encodes a transmembrane serine/threonine protein kinase and site-specific
    endoribonuclease orthologous to Saccharomyces cerevisiae inositol-requiring 1
    protein kinase (Ire1) and human endoplasmic reticulum-to-nucleus signaling 1 (ERN1,
    OMIM:604033); IRE-1 is required for the unfolded protein response (UPR) that counteracts
    cellular stress induced by accumulation of unfolded proteins in the endoplasmic
    reticulum (ER); in response to ER stress, IRE-1 cleaves xbp-1 mRNA to produce
    transcriptionally active XBP-1 that positively regulates UPR gene expression in
    order to maintain ER homeostasis.
