    error_type: TAXON_CONSTRAINT_VIOLATION
    summary: >-
      Rank 3 (score 20.83), absent from GOA. The IRE1-TRAF2-ASK1 complex is the mammalian module that
      couples ER stress to JNK activation; it is defined by the presence of TNF receptor-associated
      factor 2 and the MAP3K ASK1. C. elegans IRE-1 signals through xbp-1 splicing and RIDD, not through
      a TRAF2-ASK1 module. The call is scored MORE_SPECIFIC against GOA's endoplasmic reticulum, so
      ontology closure credits it, and it outranks the exact ER-UPR match at rank 4.
