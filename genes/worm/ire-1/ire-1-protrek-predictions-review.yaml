    summary: >-
      Top-ranked hit (score 23.29), absent from GOA. The Ire1 complex is defined as the ER-membrane
      IRE1-IRE1 dimer that forms on accumulation of unfolded protein and carries the RNase activity
      - precisely the oligomerization step the gene review describes as required for xbp-1 splicing.
      Correct, specific, and a real addition to a GOA record that has no complex term for this gene.
      The GO term's own example is S. cerevisiae Ire1, which is itself a member of this cohort.
