  label: Caenorhabditis elegans
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for worm ire-1, the dual kinase/endoribonuclease ER stress sensor.
  Rank 1 scores 23.29, the highest GO-channel score of any call in either cohort, and the top five
  are tightly on-target: the Ire1 dimer complex, the IRE1-mediated unfolded protein response (exact
  GOA match, IBA/IGI/IMP), the ER unfolded protein response (exact GOA match) and its positive regulation.
  The one error is rank 3, the IRE1-TRAF2-ASK1 complex - a mammalian apoptotic signalling module that
  requires TRAF2 and ASK1, neither of which C. elegans has in this configuration. That same complex
  recurs elsewhere in ARGO139 as a spurious hit on unrelated kinases, so its appearance here is the
  one case in the cohort where the attractor lands on the right protein family and still asserts something
  the organism cannot support. Missing from the top five are both catalytic activities - RNA endonuclease
  and protein serine/threonine kinase - which are the review's first two core functions; as with lgg-1,
  the retrieval returns processes and complexes and no molecular function. Assessment: 1 correct novel,
  1 correct-not-novel, 1 nonparalog incorrect. Assessment: 1 correct novel (COR), 1 correct not novel
  (CNN), 1 nonparalog incorrect (NPI).
