- genes/worm/ire-1/ire-1-ai-review.yaml
predictions:
- source_method: GO-GPT
  source_version: bioreason.net/2026-03/rl
  source_reference_id: doi:10.64898/2026.03.19.712954
  predicted_term:
    id: GO:0016788
    label: hydrolase activity, acting on ester bonds
  predicted_term_type: GO_MF
  review:
    assessment: LSP
    confidence_score: 2
    summary: >-
      IRE-1 cleaves phosphodiester bonds in xbp-1 mRNA, so the prediction is
      chemically adjacent to the true activity but less precise than the
      accepted GO:0004521 RNA endonuclease activity already present on the
      review. In the current GO structure, GO:0016788 is not an asserted
      ancestor of RNA endonuclease activity, while IRE-1 already carries the
      more precise RNA nuclease and RNA endonuclease terms. LSP is preferred
      over NPI or UNC because the broad ester-hydrolase chemistry is adjacent
      to the curated nuclease activity, but the proposed term is off-branch
      and redundant.
    supported_by:
    - reference_id: PMID:11780124
      supporting_text: Purified mouse IRE1 accurately cleaved XBP-1 mRNA in vitro, indicating that XBP-1 mRNA is a direct target of IRE1 endonucleolytic activity
    - reference_id: PMID:11779465
      supporting_text: C. elegans requires ire-1-mediated splicing of xbp-1 mRNA for UPR gene transcription and survival upon ER stress
    - reference_id: file:worm/ire-1/ire-1-hypotheses/prediction-ester-bond-hydrolase/openscientist.md
      supporting_text: GO:0016788 adds no information beyond these.
    - reference_id: file:worm/ire-1/ire-1-hypotheses/prediction-ester-bond-hydrolase/openscientist.md
      supporting_text: GO:0016788 is NOT an ancestor of GO:0004521
