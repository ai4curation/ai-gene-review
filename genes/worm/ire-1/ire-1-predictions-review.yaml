id: Q09499
gene_symbol: ire-1
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
status: COMPLETE
description: >-
  Focused review of the GO-GPT/BioReason-Pro prediction that ire-1 has
  hydrolase activity acting on ester bonds. The prediction is not a useful new
  annotation: the direct activity is the already curated RNA endonuclease
  activity of the IRE-1 KEN domain, and GO:0016788 is both less informative and
  off the current ontology branch for GO:0004521 RNA endonuclease activity.
references:
- id: doi:10.64898/2026.03.19.712954
  title: 'BioReason-Pro: Advancing Protein Function Prediction with Multimodal Biological Reasoning'
- id: file:worm/ire-1/ire-1-hypotheses/prediction-ester-bond-hydrolase/openscientist.md
  title: OpenScientist focused review of the GO:0016788 ester-bond-hydrolase prediction for worm ire-1
- id: PMID:11780124
  title: IRE1 couples endoplasmic reticulum load to secretory capacity by processing the XBP-1 mRNA.
- id: PMID:11779465
  title: Complementary signaling pathways regulate the unfolded protein response and are required for C. elegans development.
- id: file:worm/ire-1/ire-1-gogpt-leaf-predictions.yaml
  title: GO-GPT leaf predictions for worm ire-1
source_documents:
- genes/worm/ire-1/ire-1-gogpt-leaf-predictions.yaml
