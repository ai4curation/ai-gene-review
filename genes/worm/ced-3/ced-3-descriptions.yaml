    cell cellular homeostasis; negative regulation of cellular response to manganese
    ion; and regulation of apoptotic process. Located in several cellular components,
    including mitochondrion; neuronal cell body; and perinuclear region of cytoplasm.
    Part of caspase complex. Is expressed in several structures, including ABaraapapaa;
    NSM; apoptotic cell; germ line; and oocyte. Human ortholog(s) of this gene implicated
