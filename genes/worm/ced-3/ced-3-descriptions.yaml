- source: Alliance_Imported
  text: ced-3 encodes a caspase, a cysteine-aspartate protease; CED-3 activity is
    required for execution of apoptosis and functions in a conserved genetic pathway
    with CED-4, CED-9, and EGL-1 to regulate apoptosis during C. elegans development.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00000417;class=Gene
  source_id: WB:WBGene00000417
- source: Alliance_Automated
  text: Enables cysteine-type endopeptidase activity; identical protein binding activity;
    and peptidase activator activity. Involved in several processes, including muscle
    cell cellular homeostasis; negative regulation of cellular response to manganese
    ion; and regulation of apoptotic process. Located in several cellular components,
    including nuclear membrane; perikaryon; and perinuclear region of cytoplasm. Part
    of caspase complex. Is expressed in several structures, including ABaraapapaa;
    NSM; apoptotic cell; germ line; and oocyte. Human ortholog(s) of this gene implicated
    in several diseases, including autoimmune lymphoproliferative syndrome type 2B;
    breast disease (multiple); gastrointestinal system cancer (multiple); lung disease
    (multiple); and neurodegenerative disease (multiple). Orthologous to several human
    genes including CASP2 (caspase 2) and CASP3 (caspase 3).
