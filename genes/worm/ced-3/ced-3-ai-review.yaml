  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN002235080
  - WB:WBGene00000417
  review:
    summary: CED-3 substrate cleavage is a direct execution-phase event in worm apoptosis.
    action: ACCEPT
    reason: CED-3 cleaves execution substrates such as DCR-1, CED-8, CNT-1, and DRP-1 to drive DNA
      fragmentation, phosphatidylserine exposure, AKT suppression, and organelle/corpse remodeling.
    supported_by:
    - reference_id: PMID:20223951
      supporting_text: DCR-1 was cleaved by the CED-3 caspase to generate a C-terminal fragment with
        deoxyribonuclease activity, which produced 3' hydroxyl DNA breaks on chromosomes and promoted
        apoptosis.
      reference_section_type: ABSTRACT
    - reference_id: PMID:24225442
      supporting_text: Here we report that CED-8, a Caenorhabditis elegans protein implicated in controlling
        the kinetics of apoptosis and a homologue of the XK family proteins, is a substrate of the CED-3
        caspase.
      reference_section_type: ABSTRACT
    - reference_id: PMID:25383666
      supporting_text: In this study, we report a new CED-3 substrate, CNT-1, whose cleavage by CED-3
        activates an N-terminal cleavage product, truncated CNT-1 (tCNT-1), that promotes apoptosis by
        suppressing the AKT pro-survival activity.
