  review:
    summary: The CSP-1 combinatorial genetics still places CED-3 in canonical apoptotic execution.
    action: MODIFY
    reason: The paper distinguishes CSP-1 and caspase-independent branches from the canonical pathway
      involving CED-3 activation; CED-3 should be curated to execution phase rather than positive regulation
