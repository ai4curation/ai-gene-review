id: P42573
gene_symbol: ced-3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: 'CED-3 is the canonical C. elegans apoptotic caspase, a C14-family Asp-directed cysteine endopeptidase
  synthesized as an inactive zymogen and activated by CED-4-apoptosome-mediated dimerization and autoproteolysis.
  Active CED-3 cleaves execution substrates such as DCR-1, CED-8, CNT-1, FEM-1, and DRP-1 to drive apoptotic DNA
  fragmentation, phosphatidylserine exposure, organelle remodeling, and suppression of AKT survival signaling. CED-3
  is also used in limited, non-apoptotic proteolysis, notably GSNL-1 activation during synapse pruning and LIN-14/LIN-28/DISL-2
  cleavage during heterochronic developmental control; these nonlethal outputs reuse the caspase catalytic activity
  in restricted cellular contexts.'
