suggested_questions:
- question: Should GO add or revive a caspase autoprocessing term that can distinguish CED-3 self-processing
    from CED-4-enabled activator activity?
- question: Can the CED-3-dependent manganese dopaminergic-neuron phenotype be resolved as canonical neuron
    apoptosis, caspase-dependent stress degeneration, or a non-apoptotic CED-3 output?
- question: How should non-apoptotic CED-3 cleavage of GSNL-1 and heterochronic regulators be represented in
    GO-CAM without implying whole-cell apoptosis?
suggested_experiments:
- hypothesis: Distinct substrate-docking surfaces route CED-3 toward apoptotic versus non-apoptotic
    substrates.
  description: Introduce separation-of-function CED-3 surface mutants in vivo and quantify cleavage of DCR-1,
    CED-8, GSNL-1, LIN-28 and DISL-2 together with apoptotic cell-corpse counts, presynaptic-cluster
    elimination and heterochronic reporter timing.
  experiment_type: in vivo substrate-cleavage rescue assay
- hypothesis: NPP-14 prevents inappropriate germline apoptosis by tethering and restraining a perinuclear
    CED-3 zymogen pool until CED-4 accumulates locally.
  description: Use endogenous fluorescent CED-3 and acute NPP-14 perturbation to follow zymogen localization,
    CED-4 recruitment, CED-3 processing and caspase-reporter activation in live germ cells after checkpoint
    induction.
  experiment_type: live-cell imaging and acute depletion
