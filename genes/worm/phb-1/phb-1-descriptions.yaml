gene_symbol: phb-1
organism: worm
uniprot_id: Q9BKU4
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: PHB proteins are essential during embryonic development and are required for
    somatic and germline differentiation in the larval gonad. A deficiency in PHB
    proteins results in altered mitochondrial biogenesis in body wall muscle cells.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q9BKU4
  source_id: Q9BKU4
- source: Alliance_Imported
  text: 'phb-1 encodes the C. elegans ortholog of prohibitin PHB1; loss of phb-1 activity
    via RNAi indicates that phb-1 function is required for mitochondrial organization
    and morphology and for embryonic, germline, and somatic gonad development; PHB-1,
    along with prohibitin subunit PHB-2, forms a macromolecular complex that localizes
    to mitochondrial membranes; PHB-1 and PHB-2 are dependent upon one another for
    stability: loss of either phb-1 or phb-2 activity via RNAi results in depletion
    of both protein products.'
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00004014;class=Gene
  source_id: WB:WBGene00004014
- source: Alliance_Automated
  text: Involved in several processes, including defecation; regulation of nematode
    pharyngeal pumping; and regulation of oxidative phosphorylation. Located in mitochondrial
    inner membrane. Part of mitochondrial prohibitin complex. Is expressed in several
    structures, including body wall musculature; excretory canal; hypodermis; intestine;
    and pharynx. Human ortholog(s) of this gene implicated in breast cancer and sporadic
    breast cancer. Orthologous to human PHB1 (prohibitin 1).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00004014;class=Gene
  source_id: WB:WBGene00004014
