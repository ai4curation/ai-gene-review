- source: Alliance_Imported
  text: atg-3 encodes an ortholog of the autophagic budding yeast protein Atg3p,and
    of human ATG3 (OMIM:609606); ATG-3 is expressed in larval and adultpharynx and
    body wall muscle, and in adult reproductive system, vulvalmuscle, spermetheca,
    and seam cells; ATG-3 has no obvious phenotype inmass RNAi assays.
