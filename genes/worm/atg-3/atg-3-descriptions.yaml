descriptions:
- source: Alliance_Imported
  text: atg-3 encodes an ortholog of the autophagic budding yeast protein Atg3p,and
    of human ATG3 (OMIM:609606); ATG-3 is expressed in larval and adultpharynx and
    body wall muscle, and in adult reproductive system, vulvalmuscle, spermetheca,
    and seam cells; ATG-3 has no obvious phenotype inmass RNAi assays.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00021922;class=Gene
  source_id: WB:WBGene00021922
- source: Alliance_Automated
  text: Predicted to enable Atg8-family conjugating enzyme activity. Involved in macroautophagy.
    Predicted to be active in cytosol and phagophore assembly site. Is expressed in
    body wall musculature; pharynx; reproductive system; and seam cell. Orthologous
    to human ATG3 (autophagy related 3).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00021922;class=Gene
  source_id: WB:WBGene00021922
