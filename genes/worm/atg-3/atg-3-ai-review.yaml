  review:
    summary: >-
      Lin et al. used atg-3 mutants as an autophagy-null reference: SQST-1, EPG-7 and other
      autophagy substrates accumulate at dramatically elevated levels and form aggregates
      in atg-3 mutant embryos and larvae.
    action: ACCEPT
    reason: >-
      Directly shows that atg-3 is required for autophagic (aggrephagy) degradation in C.
      elegans. The evidence is a loss-of-function phenotype (closer to IMP than IDA), but
      the macroautophagy term is correct.
    supported_by:
    - reference_id: PMID:23530068
      supporting_text: >-
        levels of SQST-1 are dramatically elevated in atg-3 and epg-7 mutant embryos in an
        immunoblotting assay
    - reference_id: PMID:23530068
      supporting_text: >-
        Levels of EPG-7 are dramatically elevated and a large number of EPG-7 aggregates are
        formed in atg-3 mutants.
