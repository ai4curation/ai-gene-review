id: Q9N369
gene_symbol: atg-3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: >-
  ATG-3 is the C. elegans ortholog of yeast Atg3 and mammalian ATG3, the E2-like conjugating
  enzyme of the Atg8 lipidation system. It receives the Atg8-family proteins LGG-1 and LGG-2
  from the E1-like enzyme ATG-7 as a thioester and, with the E3-like LGG-3/ATG12-ATG-5-ATG-16
  complex, transfers them to phosphatidylethanolamine on forming autophagosomal membranes.
  ATG-3 acts in the cytosol and at sites of autophagosome formation and is essential for autophagosome
  biogenesis; atg-3 mutant embryos fail to degrade the aggrephagy substrates SQST-1/p62, EPG-7
  and other autophagy cargo, which accumulate as aggregates.
