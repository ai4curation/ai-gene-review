suggested_questions:
- question: >-
    Does C. elegans ATG-3 carry the conserved N-terminal amphipathic helix that senses membrane
    curvature, and is it required for LGG-1 lipidation in vivo?
suggested_experiments:
- description: >-
    In vitro LGG-1 versus LGG-2 lipidation with recombinant ATG-7 and ATG-3 on liposomes,
    with and without the ATG-5-LGG-3-ATG-16 complex, to quantify the affinity differences
    reported in vivo.
  experiment_type: in vitro reconstitution
