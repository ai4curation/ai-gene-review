descriptions:
- source: UniProt
  text: Guanylate cyclase involved in the production of the second messenger cGMP
    (PubMed:27062922). Regulates thermotaxis responses in AFD sensory neurons (PubMed:16415369,
    PubMed:21315599, PubMed:27062922). May regulate AFD neuronal activity such as
    calcium responses to temperature gradients (PubMed:16415369, PubMed:21315599).
    Maintains the microvilli receptive ending morphology of the AFD thermosensory
    neurons by regulating cGMP levels downstream of kcc-3 (PubMed:27062922). cGMP
    levels antagonize the actin cytoskeleton regulator wsp-1 (PubMed:27062922).
