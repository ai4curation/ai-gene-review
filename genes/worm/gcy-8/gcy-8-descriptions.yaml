- source: Alliance_Imported
  text: gcy-8 encodes a receptor-type guanylyl cyclase that, along with gcy-18 and
    gcy-23, constitutes a subfamily of guanylyl cyclase genes in C. elegans; gcy-8
    functions redundantly with gcy-18 and gcy-23, and upstream of tax-4, to regulate
    thermotaxis via the AFD thermosensory neurons, although of the three guanylyl
    cyclases required, genetic analyses suggest that GCY-18 is the primary guanylyl
    cyclase required; GCY-8 is expressed exclusively in the AFD thermosensory neurons
    where it localizes to sensory endings; GCY-8 expression in the AFD neurons requires
    activity of the TAX-2/4 cyclic nucleotide gated channel and the CMK-1 Ca2+/calmodulin-dependent
    protein kinase I, while maintenance of GCY-8 expression requires the OTD/OTX homeodomain
    protein TTX-1.
  source_type: curated
