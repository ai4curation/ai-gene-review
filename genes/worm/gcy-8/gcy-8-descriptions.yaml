  text: WormBase states GCY-18 is the primary AFD guanylyl cyclase; the gcy-8 review
    calls GCY-8 the principal individual AFD cyclase for thermotaxis, and the gcy-18
    review restricts GCY-18's primacy to higher cultivation temperatures.
