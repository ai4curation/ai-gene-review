gene_symbol: gcy-8
organism: worm
uniprot_id: Q9GYQ4
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Guanylate cyclase involved in the production of the second messenger cGMP
    (PubMed:27062922). Regulates thermotaxis responses in AFD sensory neurons (PubMed:16415369,
    PubMed:21315599, PubMed:27062922). May regulate AFD neuronal activity such as
    calcium responses to temperature gradients (PubMed:16415369, PubMed:21315599).
    Maintains the microvilli receptive ending morphology of the AFD thermosensory
    neurons by regulating cGMP levels downstream of kcc-3 (PubMed:27062922). cGMP
    levels antagonize the actin cytoskeleton regulator wsp-1 (PubMed:27062922).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q9GYQ4
  source_id: Q9GYQ4
- source: Alliance_Imported
  text: gcy-8 encodes a receptor-type guanylyl cyclase that, along with gcy-18 and
    gcy-23, constitutes a subfamily of guanylyl cyclase genes in C. elegans; gcy-8
    functions redundantly with gcy-18 and gcy-23, and upstream of tax-4, to regulate
    thermotaxis via the AFD thermosensory neurons, although of the three guanylyl
    cyclases required, genetic analyses suggest that GCY-18 is the primary guanylyl
    cyclase required; GCY-8 is expressed exclusively in the AFD thermosensory neurons
    where it localizes to sensory endings; GCY-8 expression in the AFD neurons requires
    activity of the TAX-2/4 cyclic nucleotide gated channel and the CMK-1 Ca2+/calmodulin-dependent
    protein kinase I, while maintenance of GCY-8 expression requires the OTD/OTX homeodomain
    protein TTX-1.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00001535;class=Gene
  source_id: WB:WBGene00001535
- source: Alliance_Automated
  text: Enables guanylate cyclase activity. Involved in several processes, including
    microvillus organization; thermosensory behavior; and thermotaxis. Located in
    microvillus membrane and neuron projection terminus. Is expressed in AFDL and
    AFDR.
