id: Q9GYQ4
gene_symbol: gcy-8
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: >-
  gcy-8 encodes a receptor-type (transmembrane) guanylate cyclase expressed exclusively in the AFD thermosensory
  neurons of C. elegans. With GCY-8, GCY-18 and GCY-23 it forms an AFD-specific subfamily; each has an
  extracellular domain with little similarity to mammalian receptor guanylyl cyclases, a single transmembrane
  helix, an intracellular kinase-homology domain predicted to be catalytically inactive, and a C-terminal
  guanylate cyclase domain that converts GTP to cGMP. GCY-8 is concentrated at the AFD sensory ending
  (the microvillar receptive ending). The three AFD cyclases act partly redundantly to supply the cGMP
  that opens the TAX-2/TAX-4 cyclic nucleotide-gated channel in response to warming; triple mutants are
  athermotactic and lack temperature-evoked AFD currents. GCY-8 has the most prominent individual role,
  being required for AFD responses to rapid temperature changes and for execution of isothermal tracking.
  Its basal cyclase activity is directly inhibited by extracellular chloride, which is regulated by the
  glial K/Cl transporter KCC-3; through this, GCY-8-derived cGMP also controls the length of AFD receptive-ending
  microvilli by antagonizing the actin regulator WSP-1.
