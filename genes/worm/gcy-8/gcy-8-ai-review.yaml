    label: thermotaxis
  supported_by:
  - reference_id: PMID:21315599
    supporting_text: >-
      Together, these results indicate that mutations in gcy-8, but not in gcy-18 and gcy-23, affect the
      ability of the AFD neurons to respond to oscillating temperature stimuli centered around a mean
      temperature.
  - reference_id: PMID:21315599
    supporting_text: >-
      Thus, while all three rGC genes play roles in regulating the temperature range in which IT behavior
      can be exhibited, only gcy-8 regulates the ability of the AFD neurons to execute IT behavior.
