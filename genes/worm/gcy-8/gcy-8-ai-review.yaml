  review:
    summary: >-
      PANTHER IBA transfer of peptide receptor activity from vertebrate natriuretic peptide receptor guanylyl
      cyclases.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      GCY-8 is an AFD-specific receptor guanylyl cyclase of the GCY-8/18/23 subfamily whose extracellular
      domain shows little homology to human guanylyl cyclases; no peptide ligand is known. The only identified
      extracellular regulator of this subfamily is inhibitory chloride acting on GCY-8. Peptide-receptor
      activity is a natriuretic-peptide-receptor-specific property not demonstrated for this nematode
      clade.
    supported_by:
    - reference_id: PMID:16415369
      supporting_text: >-
