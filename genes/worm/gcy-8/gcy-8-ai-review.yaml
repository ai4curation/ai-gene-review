suggested_questions:
- question: >-
    Are the AFD receptor guanylyl cyclases intrinsically thermosensitive (i.e. the thermoreceptors themselves),
    and which domain confers temperature dependence of cyclase activity?
- question: >-
    Is chloride inhibition via the extracellular S(x)nGPxC motif conserved in GCY-18 and GCY-23, and does
    extracellular Cl− tune thermosensory operating range in vivo?
suggested_experiments:
- description: >-
    Express each AFD rGC (GCY-8, GCY-18, GCY-23) alone in a heterologous cell with a cGMP sensor and measure
    temperature-dependent cGMP production, swapping extracellular and kinase-homology domains to map thermosensitivity.
