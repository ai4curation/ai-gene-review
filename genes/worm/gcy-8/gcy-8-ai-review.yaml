core_functions:
- description: >-
    AFD-specific receptor guanylate cyclase: converts GTP to cGMP at the AFD sensory ending, supplying
    the cGMP that gates the TAX-2/TAX-4 channel in thermotransduction (partly redundant with the other
    AFD GCYs).
  molecular_function:
    id: GO:0004383
    label: guanylate cyclase activity
  directly_involved_in:
  - id: GO:0006182
    label: cGMP biosynthetic process
  - id: GO:0016048
    label: detection of temperature stimulus
  locations:
  - id: GO:0044306
    label: neuron projection terminus
  supported_by:
  - reference_id: PMID:27062922
    supporting_text: >-
      First, while hNPR1 has essentially no basal activity, as previously reported, GCY-8-expressing cells
      show significant activity, as predicted by our genetic data.
  - reference_id: PMID:27062922
    supporting_text: GFP fluorescence is localized to AFD microvilli
  - reference_id: PMID:16415369
    supporting_text: >-
      Temperature received by a thermoreceptor is transduced to changes in intracellular cGMP concentration
      via three guanylyl cyclases, GCY-8, GCY-18, and GCY-23, and transmitted to the TAX-4 CNG channel,
      resulting in a change of membrane potential of AFD.
- description: >-
    Required for AFD responses to temperature changes around the cultivation temperature and for execution
    of isothermal tracking; principal individual AFD cyclase for thermotaxis behaviour.
  molecular_function:
    id: GO:0004383
    label: guanylate cyclase activity
  directly_involved_in:
