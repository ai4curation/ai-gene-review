    summary: >-
      UniProt subcellular-location mapping to cilium, based on localization to the AFD sensory ending.
    action: KEEP_AS_NON_CORE
    reason: >-
      The AFD sensory ending comprises a short bona fide cilium plus an elaborate microvillar subcompartment;
      Nguyen et al. show that the thermosensory guanylyl cyclases are localized to the microvillar compartment
      (dependent on BBS-8 and DAF-25), whereas the CNG channel is anchored in the proximal cilium. Cilium
      is therefore an approximation of the true location; retained as non-core.
