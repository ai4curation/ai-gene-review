core_functions:
- description: Type II receptor kinase that, with SMA-6, transduces DBL-1 BMP-like 
    signals from the plasma membrane to control body size and male tail development.
  molecular_function:
    id: GO:0098821
    label: BMP receptor activity
  directly_involved_in:
  - id: GO:0030509
    label: BMP signaling pathway
  - id: GO:0040018
    label: positive regulation of multicellular organism growth
  locations:
  - id: GO:0005886
    label: plasma membrane
  in_complex:
    id: GO:0070724
    label: BMP receptor complex
  supported_by:
  - reference_id: PMID:8413626
    supporting_text: When expressed in monkey COS cells, the daf-4 receptor binds human 
      BMP-2 and BMP-4
  - reference_id: PMID:9847239
    supporting_text: In addition, it is also required for body size determination and 
      male tail patterning, roles which do not require daf-1
  - reference_id: PMID:24550286
    supporting_text: We found that both SMA-6::GFP and DAF-4::GFP, visualized in 
      otherwise wild-type intact living animals, localized to the basolateral plasma 
      membrane, where they are in position to receive signaling molecules secreted by 
      neurons
- description: Type II receptor kinase that, with DAF-1, transduces the TGF-beta-like 
    DAF-7 signal and so prevents dauer larval development under favourable conditions.
  molecular_function:
    id: GO:0005024
    label: transforming growth factor beta receptor activity
  directly_involved_in:
  - id: GO:0061067
    label: negative regulation of dauer larval development
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:9847239
    supporting_text: In association with the type I receptor daf-1, it functions in the 
      dauer pathway
  - reference_id: PMID:8413626
    supporting_text: The daf-4 gene, which acts to inhibit dauer larva formation and 
      promote growth, encodes a receptor protein kinase similar to the daf-1, activin 
      and TGF-beta receptor serine/threonine kinases
suggested_questions:
- question: Does DAF-4 directly bind DAF-7 and DBL-1 with distinct affinities, and how 
    is partner choice between DAF-1 and SMA-6 achieved in cells that express all three 
    receptors?
- question: Is the truncated, ligand-binding-domain-only DAF-4 secreted, and does it 
    also antagonize DBL-1 signaling?
suggested_experiments:
- description: Reconstitute DAF-4/SMA-6 and DAF-4/DAF-1 receptor complexes in cells and 
    measure ligand-dependent GS-domain phosphorylation of each type I receptor by DAF-4.
  hypothesis: DAF-4 kinase activity phosphorylates SMA-6 and DAF-1 in a ligand-specific 
    way, and DAF-1 retains partial DAF-4-independent signaling.
