id: P50488
gene_symbol: daf-4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: 'DAF-4 is the only type II TGF-beta-family serine/threonine receptor kinase in
  C. elegans, an ortholog of BMPR2. It is a single-pass transmembrane protein that serves
  two TGF-beta-like pathways. With the type I receptor DAF-1 it receives the TGF-beta-like
  ligand DAF-7, which is secreted by ASI sensory neurons. This signal prevents dauer arrest
  and also affects lifespan, feeding quiescence and other behaviors. With the type I receptor
  SMA-6 it receives the BMP-like ligand DBL-1, and this Sma/Mab signaling controls body size,
  male tail patterning, M-lineage fate and epidermal antimicrobial peptide expression. DAF-4
  binds BMP-2 and BMP-4 when expressed in COS cells. It is found at the basolateral plasma
  membrane and recycles through an ARF-6-dependent, retromer-independent route, and its surface
  levels depend on the tetraspanins TSP-12 and TSP-14. Alternative polyadenylation produces
  a truncated, ligand-binding-domain-only form that antagonizes DAF-4 signaling.'
