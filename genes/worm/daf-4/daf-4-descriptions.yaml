gene_symbol: daf-4
organism: worm
uniprot_id: P50488
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Involved in a TGF-beta pathway (PubMed:8413626). May be a receptor for TGF-beta-like
    ligand daf-7 (PubMed:8413626). Controls the decision of whether or not larvae
    enter a developmentally arrested state, known as dauer, in response to environmental
    conditions (PubMed:8413626). Regulates body size and male tail patterning (PubMed:10887089,
    PubMed:21408209). Involved in regulating entry into quiescence triggered by satiety
    (PubMed:18316030). Involved in sensitivity to CO2 levels (PubMed:18524955).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P50488
  source_id: P50488
- source: Alliance_Imported
  text: daf-4 encodes a transmembrane serine/threonine kinase that is the sole C.
    elegans ortholog of the type II transforming growth factor-beta (TGF-b) receptors;
    DAF-4 activity is required for several biological processes, including entry into
    and exit from the dauer larval stage, normal adult lifespan, body size determination,
    male tail patterning, egg laying, chemosensory neuron specification, and increased
    thermotolerance; in regulating dauer larval development, DAF-4 acts in parallel
    with the insulin signaling pathway and likely partners with the DAF-1 type I TGF-b
    receptor to receive a signal from the DAF-7 TGF-b ligand; in body size determination
    and male tail patterning, DAF-4 likely partners with the SMA-6 type I receptor
    and responds to signals from the DBL-1 ligand; thus daf-4 is utilized by both
    the Dauer TGF-beta pathway and the TGF-beta Sma/Mab pathway; daf-4 also regulates
    reproductive aging, via the TGF-beta Sma/Mab pathway, mutants of which show a
    large reproductive span extension; DAF-4 expression begins in late embryogenesis
    and continues through larval and adult stages; consistent with its role in many
    developmental processes, DAF-4 localizes to the plasma membrane of several tissues
    including head and tail neurons, the pharynx, intestine, ventral nerve cord, tail
    hypodermis, and body wall muscle.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00000900;class=Gene
  source_id: WB:WBGene00000900
- source: Alliance_Automated
  text: Enables BMP binding activity. Involved in several processes, including dauer
    entry; determination of adult lifespan; and regulation of BMP signaling pathway.
    Located in plasma membrane. Is expressed in several structures, including ganglia;
    intestine; somatic nervous system; tail hypodermis; and vulva. Used to study Marfan
    syndrome. Human ortholog(s) of this gene implicated in several diseases, including
    Loeys-Dietz syndrome 2; Lynch syndrome (multiple); Marfan syndrome; gastrointestinal
    system cancer (multiple); and visceral heterotaxy (multiple). Orthologous to several
    human genes including ACVR2B (activin A receptor type 2B).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00000900;class=Gene
  source_id: WB:WBGene00000900
