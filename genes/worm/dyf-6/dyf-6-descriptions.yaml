gene_symbol: dyf-6
organism: worm
uniprot_id: Q0G838
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Component of the intraflagellar transport (IFT) complex B required for transport
    of proteins in the motile cilium (PubMed:28479320). May be required for ciliary
    entrance and transport of specific ciliary cargo proteins such as che-3 which
    are related to motility (PubMed:28479320). Required for normal morphology and
    function of ciliated amphid sensory neurons (PubMed:16648645, PubMed:7705621).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q0G838
  source_id: Q0G838
- source: Alliance_Imported
  text: 'dyf-6 encodes several proteins that, while novel, contain orthologs in Drosophila
    and mammals; during development, dyf-6 activity is essential for establishing
    the normal dendritic length of the amphid and phasmid chemosensory neurons; a
    DYF-6::GFP reporter is expressed in amphid and phasmid neurons where it: 1) localizes
    to dendritic bodies and endings as well as to cell bodies, and 2) appears to undergo
    intraflagellar transport (IFT);  DYF-6::GFP is also seen in hypodermal cells and
    in additional neurons, including inner labial neurons and a lateral neuron in
    the vicinity of PDE; genetic mosaic analyses indicate that dyf-6 functions autonomously
    at the level of the amphid dendritic bundle to regulate proper dendritic morphology.'
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00001122;class=Gene
  source_id: WB:WBGene00001122
- source: Alliance_Automated
  text: Involved in intraciliary transport and non-motile cilium assembly. Located
    in dendrite and perikaryon. Is expressed in ciliated neurons and hypodermis. Orthologous
    to human IFT46 (intraflagellar transport 46).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00001122;class=Gene
  source_id: WB:WBGene00001122
- source: RefSeq
  text: Involved in intraciliary transport and non-motile cilium assembly. Located
    in dendrite and neuronal cell body. Is expressed in ciliated neurons and hypodermis.
    Orthologous to human IFT46 (intraflagellar transport 46). [provided by Alliance
    of Genome Resources, Jul 2025]
