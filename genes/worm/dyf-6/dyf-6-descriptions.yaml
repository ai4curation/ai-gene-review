descriptions:
- source: UniProt
  text: Component of the intraflagellar transport (IFT) complex B required for transport
    of proteins in the motile cilium (PubMed:28479320). May be required for ciliary
    entrance and transport of specific ciliary cargo proteins such as che-3 which
    are related to motility (PubMed:28479320). Required for normal morphology and
    function of ciliated amphid sensory neurons (PubMed:16648645, PubMed:7705621).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q0G838
  source_id: Q0G838
