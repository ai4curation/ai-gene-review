descriptions:
- source: UniProt
  text: Involved in the fragmentation of the mitochondrial network (By similarity).
    Involved in perinuclear clustering of the mitochondrial network (By similarity).
    May act, redundantly with fis-1, downstream of mitochondrial fission, before the
    fission products participate in mitochondrial homeostasis, mitophagy, or apoptosis
    (PubMed:24196833). Plays a role in apoptosis by promoting mitochondrial elimination
    and cell-death execution, acting downstream of caspase ced- 3, and perhaps independently
    of dynamin GTPase drp-1, caspase ced-9 and apoptosis-inducing factor AIFM/wah-1
    (PubMed:18722182).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q6AHP8
