- source: Alliance_Imported
  text: fis-2 encodes a protein similar to the yeast and human Fis1 proteins involved
    in mitochondrial fission; fis-2 functions downstream of, or in parallel to, the
    ced-3 caspase during apoptosis and does not seem to be required for mitochondrial
    fission but it is possible that it may function redundantly along with fis-1 and
    other genes; the fis-2 protein localizes to mitochondria.
  source_type: curated
