gene_symbol: fis-2
organism: worm
uniprot_id: Q6AHP8
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Involved in the fragmentation of the mitochondrial network (By similarity).
    Involved in perinuclear clustering of the mitochondrial network (By similarity).
    May act, redundantly with fis-1, downstream of mitochondrial fission, before the
    fission products participate in mitochondrial homeostasis, mitophagy, or apoptosis
    (PubMed:24196833). Plays a role in apoptosis by promoting mitochondrial elimination
    and cell-death execution, acting downstream of caspase ced- 3, and perhaps independently
    of dynamin GTPase drp-1, caspase ced-9 and apoptosis-inducing factor AIFM/wah-1
    (PubMed:18722182).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q6AHP8
  source_id: Q6AHP8
- source: Alliance_Imported
  text: fis-2 encodes a protein similar to the yeast and human Fis1 proteins involved
    in mitochondrial fission; fis-2 functions downstream of, or in parallel to, the
    ced-3 caspase during apoptosis and does not seem to be required for mitochondrial
    fission but it is possible that it may function redundantly along with fis-1 and
    other genes; the fis-2 protein localizes to mitochondria.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00001425;class=Gene
  source_id: WB:WBGene00001425
- source: Alliance_Automated
  text: Predicted to enable lipid binding activity and molecular adaptor activity.
    Involved in apoptotic process. Acts upstream of or within IRE1-mediated unfolded
    protein response. Located in mitochondrion. Orthologous to human FIS1 (fission,
    mitochondrial 1).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00001425;class=Gene
  source_id: WB:WBGene00001425
