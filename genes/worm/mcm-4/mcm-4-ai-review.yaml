core_functions:
- description: Subunit of the MCM2-7 replicative helicase. MCM-4 contributes to the ATP-dependent
    single-stranded DNA helicase activity of the assembled ring (as CMG), which unwinds template
    DNA at replication origins and forks. Inferred by phylogeny (MCM4 subfamily, PAINT MCM2-7
    node) and conserved catalytic motifs; the C. elegans loss-of-function data show it is
    required for DNA synthesis.
  contributes_to_molecular_function:
    id: GO:0017116
    label: single-stranded DNA helicase activity
  in_complex:
    id: GO:0042555
    label: MCM complex
  directly_involved_in:
  - id: GO:1902975
    label: mitotic DNA replication initiation
  - id: GO:0006271
    label: DNA strand elongation involved in DNA replication
