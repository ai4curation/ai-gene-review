- term:
    id: GO:0006271
    label: DNA strand elongation involved in DNA replication
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: The MCM2-7 ring is the motor of the CMG helicase that unwinds DNA at moving forks,
      so the complex takes part in strand elongation directly. The IBA is from PTN000179968
      (eukaryotic MCM4 subfamily node), seeded by yeast Mcm4.
    action: ACCEPT
    reason: 'The participation test is met: the MCM ring does the unwinding work at the fork.
      In C. elegans, loss of mcm-4 abolishes postembryonic somatic DNA synthesis, which agrees
      with this but cannot separate an initiation defect from an elongation defect; the elongation
      role itself rests on the phylogenetic inference.'
