  review:
    summary: MCM-4 is a subunit of the heterohexameric MCM2-7 (MCM) complex. The IBA is placed
      at PTN000179711, the PAINT node for the replicative MCM2-7 clade, which C. elegans MCM-4
      (PANTHER PTHR11630:SF66, MCM4 subfamily) descends from; the identity of lin-6 as the
      MCM4 ortholog was established in C. elegans.
