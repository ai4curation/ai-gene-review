- id: PMID:21146520
  title: C. elegans MCM-4 is a general DNA replication and checkpoint component with an epidermis-specific
    requirement for growth and viability.
  findings:
  - statement: lin-6 corresponds to mcm-4, encoding the C. elegans MCM4 ortholog, a conserved
      subunit of the MCM2-7 pre-RC and replicative helicase complex.
    supporting_text: lin-6 corresponds to mcm-4 and encodes an evolutionarily conserved component
      of the MCM2-7 pre-RC and replicative helicase complex.
  - statement: mcm-4 is required for postembryonic somatic DNA synthesis and for the replication
      checkpoint coupling M-phase entry to S-phase completion.
    supporting_text: lin-6 is required for the checkpoint that couples M phase entry to S
      phase completion
  - statement: MCM-4 is expressed in all dividing cells and associates with chromatin in late
      anaphase.
    supporting_text: The MCM-4 protein is expressed in all dividing cells during embryonic
      and postembryonic development and associates with chromatin in late anaphase
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full-text-verified primary paper that cloned lin-6 = mcm-4 and established
      its role as a conserved MCM2-7 subunit functioning in DNA replication and the replication
      checkpoint, with an epidermis-specific requirement. Source of the EXP/IDA/NAS annotations.
- id: PMID:31283754
  title: The demethylase NMAD-1 regulates DNA replication and repair in the Caenorhabditis
    elegans germline.
  findings:
  - statement: NMAD-1 binds MCM-4 directly in vitro (recombinant pulldown); MCM-4 was identified
      in NMAD-1 IP/MS as a candidate binder, but the NMAD-1/MCM-4 interaction was not confirmed
      in vivo (only NMAD-1/TOP-2 was confirmed in vivo).
    supporting_text: NMAD-1 directly bound to MTSS-1, TOP-2, and MCM-4, components of the
      DNA replication machinery
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full-text-verified. Primarily an NMAD-1 demethylase study; MCM-4 binds NMAD-1
      directly in vitro but the interaction was not confirmed in vivo (only TOP-2 was). MCM-4
      is described as an MCM2-7 / replicative helicase subunit. Source of the IPI protein
      binding annotation.
- id: PMID:7262539
  title: Isolation and genetic characterization of cell-lineage mutants of the nematode Caenorhabditis
    elegans.
  findings:
  - statement: Classic screen for postembryonic cell-lineage (lin) mutants, the screen in
      which lin-6(e1466) - later shown to be mcm-4 - was isolated. The quoted sentence establishes
      the screen itself; the cached record does not contain the strings 'lin-6' or 'e1466',
      so the identification of that specific allele is sourced from the other references in
      this review, not from this one.
    supporting_text: Twenty-four mutants that alter the normally invariant post-embryonic
      cell lineages of the nematode Caenorhabditis elegans have been isolated and genetically
      characterized.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only in cache; identity as the source screen for lin-6 (= mcm-4)
      corroborated by full text of PMID:21146520. Source of the IMP developmental annotations
      (nervous system development, gonad development, locomotion), which reflect pleiotropic
      downstream consequences of the replication defect rather than dedicated developmental
      functions.
