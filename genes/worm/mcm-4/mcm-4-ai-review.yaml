gene_symbol: mcm-4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: 'mcm-4 (also known as lin-6 and let-358) encodes the Caenorhabditis elegans ortholog
  of MCM4, one of the six AAA+ ATPase subunits of the MCM2-7 heterohexamer. MCM2-7 is the
  motor of the eukaryotic replicative helicase. It is loaded onto replication origins as an
  inactive double hexamer to license them, and at S phase it is activated with CDC45 and GINS
  into the CMG helicase that unwinds template DNA. Helicase and ATPase activity belong to
  the assembled ring: each of its six ATP sites pairs one subunit''s Walker A/B motifs with
  the arginine finger of its neighbour, and MCM-4 keeps these catalytic motifs. In C. elegans,
  MCM-4 is expressed in all dividing cells, is nuclear in interphase, leaves condensed mitotic
  chromosomes, and reassociates with chromatin in late anaphase, the expected licensing window.
  Loss of zygotic mcm-4 abolishes DNA synthesis in postembryonic somatic lineages while those
  cells still enter mitosis, so mitotic entry is no longer coupled to completed replication.
  mcm-4 is also needed for the S-phase checkpoint delay caused by reduced ribonucleotide reductase
  in embryos. Germline replication continues longer in mutants, probably on maternal product.
  MCM-4 acts cell-autonomously in DNA synthesis and intestinal endoreduplication, and its
  expression in the epidermis alone rescues the growth retardation and larval lethality of
  mutants. The biochemical activities (ATP hydrolysis, ssDNA binding, helicase) are inferred
  from orthology and conserved motifs. They have not been measured for the C. elegans protein.'
