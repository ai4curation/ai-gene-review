proposed_new_terms: []
suggested_questions:
- question: Does the apparent tolerance of the C. elegans germline and somatic gonad to loss
    of zygotic mcm-4 reflect maternal MCM-4 contribution, or a genuinely lower requirement
    for MCM-4 in those lineages?
- question: What is the functional significance of the physical interaction between MCM-4
    and the DNA demethylase NMAD-1 (and TOP-2) for replication or repair in the germline?
- question: Why is epidermal (hypodermal) expression of MCM-4 specifically sufficient to rescue
    organismal growth and viability, given that MCM-4 is expressed in all dividing cells?
- question: Does MCM-4, as an obligate subunit of the CMG helicase, contribute to the proposed
    replication-independent / chromatin-handling role of CMG in asymmetric cell-fate divergence
    (reported for the GINS subunit PSF-2), or is that function genetically separable from
    MCM-4?
- question: Is the C. elegans requirement for mcm-4 in the S-phase checkpoint delay a direct
    signalling role, or does it simply reflect that, without licensed and fired origins, no
    stalled forks exist to produce the checkpoint signal? GO has no annotation for this, and
    none is proposed here.
suggested_experiments:
- description: Reconstitute or affinity-purify the C. elegans MCM2-7 / CMG complex and measure
    ATP-dependent single-stranded DNA helicase and ATPase activity to directly confirm MCM-4
    incorporation and biochemical function.
  hypothesis: C. elegans MCM-4 assembles into a functional MCM2-7/CMG complex with ATP-dependent
    DNA helicase activity, as predicted from orthology.
- description: Use tissue-specific degron/auxin-inducible depletion of MCM-4 (germline vs.
    hypodermis vs. neurons) to dissect lineage-specific replication requirements and separate
    the primary replication defect from downstream developmental phenotypes.
  hypothesis: The developmental (nervous system, gonad, locomotion) phenotypes are secondary
    to loss of DNA replication in dividing precursors rather than a tissue-specific molecular
    function of MCM-4.
- description: Map the MCM-4/NMAD-1 interaction interface and test whether NMAD-1 demethylase
    activity modulates MCM-4 chromatin loading or replication/repair in the germline.
  hypothesis: NMAD-1 regulates MCM-4-dependent replication/repair in the germline through
    a direct physical interaction.
