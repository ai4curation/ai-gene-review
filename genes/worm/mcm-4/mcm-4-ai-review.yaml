- description: ATP hydrolysis by the MCM-4 AAA+ module (Walker A/B in MCM-4, arginine finger
    from the neighbouring subunit) powers DNA translocation by the MCM2-7 ring.
  molecular_function:
    id: GO:0016887
    label: ATP hydrolysis activity
  in_complex:
