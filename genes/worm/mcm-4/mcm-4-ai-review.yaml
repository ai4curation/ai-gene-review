    label: single-stranded DNA binding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  review:
    summary: Single-stranded DNA binding is a conserved property of the MCM2-7 ring, which
      encircles and translocates along the leading-strand template during unwinding. The IBA
      comes from PTN000179711 (MCM2-7 clade), seeded by yeast Mcm4 (SGD:S000006223).
    action: ACCEPT
    reason: Inherited from the MCM2-7 ancestral node, inside which MCM-4 sits. No C. elegans
      biochemistry exists; the claim rests on phylogeny plus the conserved MCM OB-fold and
      AAA+ modules. As with the helicase, the activity is exercised within the hexamer.
