- id: file:worm/mcm-4/mcm-4-deep-research-falcon.md
  title: Deep research report on mcm-4 (falcon/Edison)
  findings:
  - statement: MCM-4 contributes as one subunit to the ATPase and helicase activities of the
      MCM2-7/CMG complex, with ATP hydrolysis in the MCM ring driving DNA translocation and
      unwinding.
    supporting_text: MCM proteins carry ATP-binding motifs and are attributed ATPase and helicase
      activities, with ATP hydrolysis within the MCM ring driving DNA translocation and unwinding
      in CMG.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: LLM-generated deep-research synthesis (falcon/Edison, 51 citations). Corroborates
      the lin-6/let-358 = mcm-4 = MCM4 identity, the complex-level ATPase/helicase activities,
      the replication checkpoint role, the epidermis-specific requirement, and the chromatin-association
      dynamics drawn from the primary literature. Also flags a 2024 emerging-frontier report
      (Memar et al.) of replication-independent CMG roles in cell-fate divergence, studied
      via the GINS subunit PSF-2 rather than mcm-4 directly.
- id: doi:10.5772/19397
  title: Regulation of DNA synthesis and replication checkpoint activation during C. elegans
    development.
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: UNVERIFIED
    review_notes: Ruijtenberg, van den Heuvel & The (2011) book chapter surfaced by the falcon
      deep-research report as additional worm-specific support for MCM-4 localization dynamics
      and MCM-4::mCherry reporters. Not independently retrieved or read in this review (no
