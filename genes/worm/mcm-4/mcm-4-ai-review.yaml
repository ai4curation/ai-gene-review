- term:
    id: GO:0007399
    label: nervous system development
  evidence_type: IMP
  original_reference_id: PMID:7262539
  qualifier: involved_in
  review:
    summary: IMP from the original postembryonic cell-lineage screen, where lin-6(e1466) (=
      mcm-4) was isolated. The lineage defects in neuronal precursors follow from failed DNA
      synthesis in dividing blast cells, which still enter mitosis.
    action: MARK_AS_OVER_ANNOTATED
    reason: MCM-4 does none of the work of nervous system development. It replicates DNA in
      dividing precursors, and the lineage phenotype is a downstream consequence of that general
      requirement (necessity, not participation). The full text of the cloning paper (PMID:21146520)
      shows mutant cells keep their temporal and differentiation programmes but lack DNA synthesis.
      The IMP observation is not disputed (the original paper is abstract-only here), but
      the process term over-interprets it.
