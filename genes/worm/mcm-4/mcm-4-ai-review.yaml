- term:
    id: GO:0000727
    label: double-strand break repair via break-induced replication
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: Break-induced replication uses the replicative MCM2-7 helicase to copy DNA from
      an invading broken end. PAINT placed this term at the eukaryotic MCM4 subfamily node
      PTN000179968 based on yeast Mcm4 (SGD:S000006223) experimental data.
    action: KEEP_AS_NON_CORE
    reason: The earlier MARK_AS_OVER_ANNOTATED is revised. An IBA has to be challenged on
      its node placement. MCM-4 sits inside the MCM4 subfamily clade, there is no evidence
      of divergence, and the MCM helicase does the unwinding work during BIR, so the participation
      test is met. What is missing is C. elegans-specific evidence, which is not grounds for
      overturning a phylogenetic inference. The term is a correct but peripheral use of the
      core replicative helicase activity, so it is kept as non-core.
    supported_by:
    - *id002
    - *id003
  supporting_entities:
  - PANTHER:PTN000179968
  - SGD:S000006223
