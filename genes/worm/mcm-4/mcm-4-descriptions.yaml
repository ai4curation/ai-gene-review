descriptions:
- source: UniProt
  text: Acts as a component of the mcm2-7 complex (mcm complex) which is the putative
    replicative helicase essential for 'once per cell cycle' DNA replication initiation
    and elongation in eukaryotic cells. Core component of CDC45-MCM-GINS (CMG) helicase,
    the molecular machine that unwinds template DNA during replication, and around
    which the replisome is built. The active ATPase sites in the mcm2-7 ring are formed
    through the interaction surfaces of two neighboring subunits such that a critical
    structure of a conserved arginine finger motif is provided in trans relative to
    the ATP-binding site of the Walker A box of the adjacent subunit. The six ATPase
    active sites, however, are likely to contribute differentially to the complex
    helicase activity (By similarity). Required for DNA replication as well as for
    the subsequent DNA replication checkpoint controlling entry into M phase in embryos
    and in postembryonic somatic blast cells (PubMed:21146520). Required for normal
    growth and viability, specifically via tissue- specific expression in the hypodermis
    (PubMed:21146520).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q95XQ8
