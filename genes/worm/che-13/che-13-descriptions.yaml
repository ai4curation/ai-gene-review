taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Component of the intraflagellar transport (IFT) complex B required for transport
    of proteins in the motile cilium (PubMed:12651157, PubMed:28479320). May be required
    for ciliary entrance and transport of specific ciliary cargo proteins such as
    che-3 which are related to motility (PubMed:28479320). Required for the formation
    of chemosensory cilia that detect chemosensory cues (PubMed:12651157).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q93833
  source_id: Q93833
- source: Alliance_Imported
  text: che-13 encodes a novel protein homologous to mammalian IFT57/Hippi; CHE-13
    is a proposed component of the intraflagellar transport (IFT) complex B, and is
    required for the construction and maintenance of cilia on a subset of sensory
    neurons; in addition, CHE-13 is required for proper localization of OSM-5, a murine
    polaris homolog, to IFT complex B; CHE-13 is expressed in ciliated sensory neurons
    including the amphids, phasmids, inner and outer labial neurons, and sensory rays
    of the male tail, localizing to the cilia base (transition zone) as well as to
    the axoneme; che-13 expression, like that of ciliogenic genes osm-1, osm-5, osm-6,
    and che-2, is positively regulated by the DAF-19 RFX-type transcription factor.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00000492;class=Gene
  source_id: WB:WBGene00000492
- source: Alliance_Automated
  text: Involved in chemosensory behavior; cilium organization; and intracellular
    protein localization. Located in axoneme; ciliary basal body; and ciliary transition
    zone. Part of intraciliary transport particle B. Is expressed in neurons. Used
    to study ciliopathy. Human ortholog(s) of this gene implicated in orofaciodigital
    syndrome XVIII. Orthologous to human IFT57 (intraflagellar transport 57).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00000492;class=Gene
  source_id: WB:WBGene00000492
