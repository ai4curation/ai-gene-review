id: G5EGI2
gene_symbol: snn-1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: SNN-1 is the single Caenorhabditis elegans synapsin, a peripheral presynaptic phosphoprotein
  built around a conserved ATP-grasp-like core and most similar to vertebrate synapsin II. It is not an
  enzyme; it works as a regulated adapter that links synaptic vesicles to one another and to the presynaptic
  actin environment, clustering vesicles in the reserve pool next to release sites and releasing them
  for use when the terminal is stimulated. In the AIY interneuron, SNN-1 acts at the vesicle-clustering
  step downstream of a netrin/Rac/MIG-10 actin-organizing pathway; loss of SNN-1 redistributes vesicles,
  impairs stimulation-evoked mobilization from the reserve pool, and reduces cAMP-dependent neuropeptide
  release. Its activity is tuned by phosphorylation of the conserved Ser9 site, whose state is set in
  part by PP1/PHAC-1 signalling and which modulates cholinergic transmission.
