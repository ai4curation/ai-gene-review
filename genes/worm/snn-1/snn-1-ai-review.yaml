- term:
    id: GO:0106006
    label: cytoskeletal protein-membrane anchor activity
  evidence_type: IMP
  original_reference_id: file:worm/snn-1/snn-1-deep-research-falcon.md
  review:
    summary: Proposed molecular function for SNN-1 - a regulated adapter that links synaptic vesicle membranes
      to each other and to the presynaptic actin environment, the activity that underlies vesicle clustering
      and its phosphorylation-dependent release.
    action: NEW
    reason: SNN-1 currently has no molecular-function annotation beyond ATP and metal-ion binding, neither
      of which describes what it does. The anchor activity is the function accepted for the human ortholog
      SYN1 in this repository and used for the synapsin annoton in modules/synaptic_vesicle_cycle.yaml,
      and worm evidence supports it directly - SNN-1 acts downstream of a netrin/Rac/MIG-10 pathway that
      organizes presynaptic actin, and its presynaptic enrichment depends on mig-10 while MIG-10B localization
      does not depend on snn-1. The participation test is met because the synapsin itself is the tether,
      not merely a requirement for tethering. The primary worm papers are not cached in this repository,
      so the supporting text is drawn from the deep-research synthesis and the ortholog review.
    supported_by:
    - reference_id: file:worm/snn-1/snn-1-deep-research-falcon.md
      supporting_text: SNN-1 acts as a **regulated adapter/scaffold linking vesicles, vesicle clusters,
        and the presynaptic actin environment**
    - reference_id: file:human/SYN1/SYN1-ai-review.yaml
      supporting_text: cytoskeletal protein-membrane anchor activity
