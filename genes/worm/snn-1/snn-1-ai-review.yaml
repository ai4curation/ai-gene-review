core_functions:
- description: Regulated vesicle-cluster anchor; SNN-1 tethers synaptic vesicles to one another and to
    the presynaptic actin environment in the periactive zone, maintaining the reserve pool and releasing
    vesicles for release-site resupply when the terminal is stimulated, under control of Ser9 phosphorylation.
