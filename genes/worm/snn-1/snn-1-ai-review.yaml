suggested_questions:
- question: Can the primary worm synapsin papers (netrin-dependent AIY vesicle clustering, reserve-pool
    mobilization, PHAC-1/Ser9 regulation) be cached and curated, so that snn-1 carries clustering and
    anchor annotations on primary evidence rather than only an RNAi screen?
- question: Does worm SNN-1 bind F-actin and vesicle phospholipids directly, as vertebrate synapsins do,
    and is the ATP-grasp core required for cluster formation in vivo?
suggested_experiments:
- description: In-vitro reconstitution with purified SNN-1, liposomes and F-actin, plus phospho-Ser9 and
    ATP-grasp point mutants assayed in vivo by electron microscopy of vesicle clusters and by stimulation-evoked
    release, to separate the anchoring activity from the nucleotide-binding core.
