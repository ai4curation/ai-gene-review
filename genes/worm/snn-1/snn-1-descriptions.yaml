descriptions:
- source: Alliance_Imported
  text: snn-1 encodes the C. elegans synapsin ortholog; snn-1 is required for proper
    synaptic function, as loss of snn-1 results in a decrease in acetylcholine release;
    SNN-1::GFP reporters are expressed in neurons and exhibit patterns consistent
    with localization to vesicles in presynaptic regions.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00004913;class=Gene
  source_id: WB:WBGene00004913
  review:
    reviewer: AI
