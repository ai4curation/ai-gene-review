      score: 5
    - rubric: utility
      score: 3
    - rubric: compactness
      score: 5
    - rubric: completeness
      score: 3
    - rubric: specificity
      score: 3
    overall_notes: Correct synapsin ortholog with reduced acetylcholine release and
      presynaptic vesicle localization; no vesicle clustering mechanism.
- source: Alliance_Automated
  text: Predicted to enable ATP binding activity and metal ion binding activity. Involved
    in neuromuscular synaptic transmission. Located in presynaptic periactive zone.
    Is expressed in epithelial cell and nervous system. Human ortholog(s) of this
    gene implicated in X-linked epilepsy with variable learning disabilities and behavior
    disorders; non-syndromic X-linked intellectual disability 50; and schizophrenia.
    Orthologous to several human genes including SYN3 (synapsin III).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00004913;class=Gene
  source_id: WB:WBGene00004913
