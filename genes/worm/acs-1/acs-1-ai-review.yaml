- id: PMID:21926990
  title: Apicobasal domain identities of expanding tubular membranes depend on glycosphingolipid
    biosynthesis.
  findings:
  - statement: acs-1 RNAi converts apicobasal polarity in the larval intestine, generating ectopic
      lateral lumens, as does RNAi of three other lipid-biosynthetic enzymes.
    supporting_text: A highly penetrant intestinal polarity phenotype (Fig.1a) was identified by
      knockdowns of each of four different lipid-biosynthetic enzymes
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text cached (PMC3249144). Source of the epithelial apical/basal polarity
