id: Q5TKA3
gene_symbol: acs-1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: >-
  acs-1 (F46E10.1) encodes a 578-residue acyl-CoA synthetase of the ANL superfamily of
  adenylate-forming enzymes. It has an N-terminal AMP-dependent synthetase/ligase domain with the
  AMP-binding signature and a C-terminal AMP-binding enzyme domain, and belongs to the ACSF2
  subfamily, whose mammalian member is a mitochondrial medium-chain acyl-CoA ligase. In C. elegans,
  ACS-1 is required for the synthesis of the monomethyl branched-chain fatty acids C15ISO and
  C17ISO and for channelling C17ISO into membrane phospholipids. Its expression in the somatic
  gonad sets the C17ISO content of maternal phospholipids needed for membrane dynamics in the early
  embryo, and in the intestine it supports ER integrity and lipid droplet growth. In an RNAi screen
  for intestinal tubulogenesis, acs-1 knockdown, like loss of the glycosphingolipid-pathway enzymes
  POD-2, LET-767 and SPTL-1, displaced apical membrane components to lateral membranes and produced
  ectopic lateral lumens in first-stage larvae, a polarity defect thought to reflect a lipid supply
  role rather than direct polarity signalling. The acs-1
  promoter is active in intestinal cells and the CAN neurons and is induced by feedback when C17ISO
  is lacking. Loss of acs-1 causes embryonic lethality, larval arrest and reduced fertility, all
  rescued by dietary mmBCFAs. Its substrate preference has not been measured biochemically, and its
  subcellular location is unknown.
