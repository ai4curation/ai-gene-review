core_functions:
- description: >-
    ATP-dependent fatty acid-CoA ligase (ANL superfamily, ACSF2 subfamily) that activates
    iso-branched fatty acids to their CoA thioesters. Genetic evidence places this activity in the
    de novo synthesis of the monomethyl branched-chain fatty acids C15ISO and C17ISO and in the
    channelling of C17ISO into phospholipids, in the intestine and somatic gonad. The exact
    substrates and chain-length preference have not been determined biochemically.
  molecular_function:
    id: GO:0120515
    label: fatty acid-CoA ligase activity
  directly_involved_in:
  - id: GO:1902321
    label: methyl-branched fatty acid biosynthetic process
  supported_by:
  - reference_id: PMID:18676815
    supporting_text: acs-1 encodes a very long-chain acyl-CoA synthetase that plays an essential
      role in mmBCFA biosynthesis and activation
  - reference_id: PMID:15340492
    supporting_text: In addition, RNAi of these two genes resulted in a significant loss in the mmBCFA
      fraction.
  - reference_id: PMID:22426533
    supporting_text: We show that expression of ACS-1 in the somatic gonad guides the incorporation of
      C17ISO into certain phospholipids
  - reference_id: file:worm/acs-1/acs-1-uniprot.txt
    record_section: ["DR:Pfam"]
    supporting_text: Pfam; PF00501; AMP-binding; 1.
proposed_new_terms: []
suggested_questions:
- question: >-
    Which fatty acids does ACS-1 activate in vitro: C13ISO, C15ISO, C17ISO, or straight-chain medium-
    or long-chain fatty acids? Does it act before ELO-5 elongation, on the elongation product before
    acyl transfer into phospholipids, or at both steps?
- question: >-
    The UniProt name, EC 6.2.1.2 and medium-chain catalytic-activity lines for Q5TKA3 come only from
    ARBA rules for the ACSF2 subfamily. Should the chain-length class be kept for a nematode member
    whose genetically implicated substrates are C13-C17 iso-branched fatty acids?
- question: Is ACS-1 mitochondrial, like mammalian ACSF2, or does it act at the ER, where
    C17ISO-containing phospholipids are made?
suggested_experiments:
- description: >-
    Express and purify recombinant ACS-1 and measure acyl-CoA formation (AMP release or acyl-CoA
    detection by LC-MS) with C13ISO, C15ISO, C17ISO and straight-chain C8-C18 fatty acids, to
    define its substrate specificity.
  hypothesis: ACS-1 prefers iso-branched C13-C17 fatty acids over straight-chain medium-chain
    fatty acids.
- description: >-
    CRISPR knock-in of a fluorescent tag at the endogenous acs-1 locus, co-imaged with
    mitochondrial and ER markers in the intestine and somatic gonad.
  hypothesis: ACS-1 localizes to the compartment where C17ISO is incorporated into phospholipids.
