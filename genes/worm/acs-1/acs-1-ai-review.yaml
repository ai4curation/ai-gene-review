- id: PMID:15340492
  title: Monomethyl branched-chain fatty acids play an essential role in Caenorhabditis elegans
    development.
  findings:
  - statement: acs-1 was found as a gene upregulated in mmBCFA-deficient elo-5(RNAi) worms, and acs-1
      RNAi itself lowers mmBCFA levels.
    supporting_text: pnk-1, nhr-49, and acs-1 were upregulated in C17ISO-deficient elo-5(RNAi)
  - statement: RNAi of acs-1 caused a significant loss of the mmBCFA fraction.
    supporting_text: In addition, RNAi of these two genes resulted in a significant loss in the mmBCFA
      fraction.
  - statement: The authors identify ACS-1 as a homolog of very-long-chain fatty acid CoA ligases.
    supporting_text: ACS-1, very-long-chain FA CoA ligase
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached (PMC514883). This is the first paper placing acs-1 (F46E10.1) in
      mmBCFA metabolism. It gives RNAi fatty acid profiles and reporter expression, not enzyme assays.
- id: PMID:18676815
  title: A branched-chain fatty acid is involved in post-embryonic growth control in parallel to the
    insulin receptor pathway and its biosynthesis is feedback-regulated in C. elegans.
  findings:
  - statement: ACS-1 plays an essential role in the biosynthesis and activation of mmBCFAs.
    supporting_text: acs-1 encodes a very long-chain acyl-CoA synthetase that plays an essential
      role in mmBCFA biosynthesis and activation
  - statement: In acs-1(RNAi) worms the precursor C13ISO does not restore C17ISO, which places ACS-1
      between the shorter iso-fatty acid and C17ISO.
    supporting_text: acs-1(RNAi) animals maintained with the C13ISO supplement (and therefore
      deficient for C17ISO)
  - statement: The acs-1 promoter is active in the intestine and the CAN neurons.
    supporting_text: An acs-1Prom∷GFP reporter is expressed in intestinal cells and canal-associated
      neurons (CAN) in L4 and adult animals
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached. This is the strongest functional statement for ACS-1 in mmBCFA
      synthesis. The evidence is genetic and from supplementation; no biochemical assay of ACS-1 is
      reported.
- id: PMID:22426533
  title: Regulation of maternal phospholipid composition and IP(3)-dependent embryonic membrane
    dynamics by a specific fatty acid metabolic event in C. elegans.
  findings:
  - statement: Somatic-gonad ACS-1 directs C17ISO into maternal phospholipids, and loss of this
      function causes defects in embryonic membrane dynamics and early embryonic lethality.
    supporting_text: We show that expression of ACS-1 in the somatic gonad guides the incorporation of
      C17ISO into certain phospholipids and thus regulates the phospholipid composition in the zygote.
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Only the abstract is cached, and the PMC full text could not be retrieved through the
      PubMed tool. The abstract asserts an activity of ACS-1 on C17ISO. Whether the full text includes
      an in vitro assay could not be checked.
- id: PMID:34623380
  title: mmBCFA C17iso ensures endoplasmic reticulum integrity for lipid droplet growth.
  findings:
  - statement: acs-1 RNAi prevents intestinal lipid droplet growth and disrupts ER integrity. Dietary
      C17iso or C17iso-containing complex lipids restore both.
    supporting_text: Dietary C17iso, or complex lipids with C17iso including phosphatidylcholine,
      phosphatidylethanolamine, and triacylglycerol, could fully restore the LD growth in the
      acs-1RNAi worms
  - statement: acs-1 RNAi lowers C15iso and C17iso levels.
    supporting_text: the content (micrograms per milligrams of protein) of mmBCFAs C15iso and C17iso
      were indeed significantly decreased in the acs-1RNAi worms
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text cached. The lipid droplet and ER phenotypes are downstream consequences of
      mmBCFA deficiency, not separate activities of ACS-1.
- id: PMID:21704635
  title: Regulation of fat storage and reproduction by Krüppel-like transcription factor KLF3 and
    fat-associated genes in Caenorhabditis elegans.
  findings:
  - statement: acs-1 RNAi increases fat staining and causes reduced fertility, embryonic lethality and
