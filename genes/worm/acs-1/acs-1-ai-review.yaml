  review:
    summary: >-
      Electronic mapping from EC 6.2.1.2 (medium-chain acyl-CoA ligase). The EC number on Q5TKA3 is
      itself an ARBA prediction carried by the ACSF2-subfamily protein name. The domain content
      (AMP-dependent synthetase/ligase domain, AMP-binding C-terminal domain, AMP-binding signature)
      and the PANTHER ACSF2 subfamily assignment support fatty acid-CoA ligase activity. Worm genetics
      support it as well: ACS-1 is required for synthesis and activation of the monomethyl
      branched-chain fatty acids C15ISO and C17ISO and for incorporating C17ISO into
      phospholipids. The medium-chain specificity is not supported. No substrate assay exists, the
      substrates implicated genetically are C13-C17 iso-branched fatty acids, and the original
      authors described ACS-1 as homologous to a very-long-chain fatty acid CoA ligase.
    action: MODIFY
    reason: >-
      The activity class is right, but the chain-length class is more specific than any evidence for
      this protein supports, and it runs against the genetic data. The parent term GO:0120515
      fatty acid-CoA ligase activity states what is supported without committing to a chain-length
      class. It is the core molecular function in this review. This is a generalisation, not a
      claim that the EC mapping is wrong for the ACSF2 subfamily as a whole.
