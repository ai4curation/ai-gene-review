- id: file:worm/acs-1/acs-1-uniprot.txt
  title: UniProt TrEMBL record Q5TKA3 (acs-1)
  reference_review:
    relevance: LOW
    correctness: DISPUTED
    review_notes: The CC FUNCTION text is an ARBA rule (ARBA00037247) for the ACSF2 family. The
      generic acyl-CoA synthase sentence is consistent with the domain content. The medium-chain
      preference has not been measured for ACS-1. The sentence "Plays a role in adipocyte
      differentiation" is carried over from mammalian ACSF2 and has no counterpart in C. elegans,
      which has no adipocytes. The text also omits the genetically established role of ACS-1 in
      C15ISO/C17ISO monomethyl branched-chain fatty acid synthesis.
    source_defects:
    - defect_type: WRONG_STATEMENT
      resource: UNIPROT
      record: UniProtKB:Q5TKA3
      slot: CC:FUNCTION
      requested_change: CHECK
      asserted_value: "Plays a role in adipocyte differentiation"
      confidence: PROBABLE
      explanation: The FUNCTION comment for C. elegans ACS-1 (Q5TKA3), propagated by ARBA rule
        ARBA00037247, says "Plays a role in adipocyte differentiation". Nematodes have no
        adipocytes; this role comes from mammalian ACSF2 and should not be applied to the worm
        protein. The rule's taxonomic scope should be checked.
    - defect_type: MISSING_STATEMENT
      resource: UNIPROT
      record: UniProtKB:Q5TKA3
      slot: CC:FUNCTION
      requested_change: ADD
      asserted_value: UniProtKB:Q5TKA3
      confidence: PROBABLE
      explanation: The FUNCTION comment for Q5TKA3 does not mention the main established role of
        ACS-1, which is required for biosynthesis of the monomethyl branched-chain fatty acids
        C15ISO and C17ISO and for their incorporation into phospholipids (PMID:18676815,
        PMID:22426533).
      supported_by:
      - reference_id: PMID:18676815
        supporting_text: acs-1 encodes a very long-chain acyl-CoA synthetase that plays an essential
          role in mmBCFA biosynthesis and activation
