- term:
    id: GO:1902321
    label: methyl-branched fatty acid biosynthetic process
  evidence_type: IMP
  original_reference_id: PMID:18676815
  qualifier: involved_in
  review:
    summary: >-
      Proposed process. acs-1 RNAi depletes the monomethyl branched-chain fatty acids C15ISO and
      C17ISO, and the C13ISO precursor does not restore C17ISO in acs-1(RNAi) animals, which places
      ACS-1 within de novo mmBCFA synthesis.
    action: NEW
    reason: >-
      This passes the participation test. ACS-1 is an acyl-CoA synthetase of the ANL superfamily,
      and forming the acyl-CoA thioester is a chemical step that the enzyme itself performs in
      mmBCFA synthesis; ACS-1 is not a substrate of the process. The comparator is the sibling
      elongase elo-6, whose review accepts GO:1902321 by IMP on the same class of RNAi fatty acid
      profiling evidence from PMID:15340492. The exact step and substrate are not biochemically
      established. ACS-1 could activate an iso-branched precursor before ELO-5 elongation or the
      elongation product before acyl transfer, and no in vitro assay has been published. The
      downstream growth, fertility, embryonic and lipid droplet phenotypes are not proposed.
    supported_by:
    - reference_id: PMID:18676815
      supporting_text: acs-1 encodes a very long-chain acyl-CoA synthetase that plays an essential
        role in mmBCFA biosynthesis and activation
    - reference_id: PMID:18676815
      supporting_text: acs-1(RNAi) animals maintained with the C13ISO supplement (and therefore
        deficient for C17ISO)
