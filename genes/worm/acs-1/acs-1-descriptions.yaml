descriptions:
- source: UniProt
  text: Acyl-CoA synthases catalyze the initial reaction in fatty acid metabolism,
    by forming a thioester with CoA. Has some preference toward medium-chain substrates.
    Plays a role in adipocyte differentiation.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q5TKA3
  source_id: Q5TKA3
- source: Alliance_Automated
  text: Predicted to enable medium-chain fatty acid-CoA ligase activity. Involved
    in establishment or maintenance of epithelial cell apical/basal polarity. Is expressed
    in gonad; intestine; neurons; and seam cell. Orthologous to human ACSF2 (acyl-CoA
    synthetase family member 2).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00018488;class=Gene
  source_id: WB:WBGene00018488
