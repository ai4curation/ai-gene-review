descriptions:
- source: UniProt
  text: Acyl-CoA synthases catalyze the initial reaction in fatty acid metabolism,
    by forming a thioester with CoA. Has some preference toward medium-chain substrates.
    Plays a role in adipocyte differentiation.
  source_type: curated
