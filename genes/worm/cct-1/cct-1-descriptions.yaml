findings:
- category: gap
  text: WormBase says CCT-1 represses SKN-1-dependent gst-4 transcription. The review
    does not mention gst-4 or SKN-1.
  sources:
  - Alliance_Imported
- category: insight
  text: RefSeq still carries the obsolete 'unfolded protein binding' MF that the current
    automated text has replaced.
  sources:
  - RefSeq
  - Alliance_Automated
review:
  reviewer: AI
  rubrics:
  - rubric: overall_concordance
