gene_symbol: cct-1
organism: worm
uniprot_id: P41988
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Molecular chaperone; assists the folding of proteins upon ATP hydrolysis.
    Known to play a role, in vitro, in the folding of actin and tubulin.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P41988
  source_id: P41988
- source: Alliance_Imported
  text: cct-1 encodes a putative alpha subunit of the eukaryotic cytosolic ('T complex')
    chaperonin, orthologous to human TCP1 (OMIM:186980), and required for normal pronuclear-centrosome
    rotation, positioning of the mitotic spindle, meiosis, and distal tip cell migration;
    CCT-1 is also required to repress SKN-1-dependent transcription of gst-4, and
    for fertility and viability; CCT-1 is expressed in larval and adult pharynx, intestine,
    body wall muscle, and neurons, as well as adult rectal epithelium; cct-1 mRNA
    is enriched in cultured touch receptor neurons.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00000377;class=Gene
  source_id: WB:WBGene00000377
- source: Alliance_Automated
  text: Predicted to enable ATP binding activity; ATP hydrolysis activity; and ATP-dependent
    protein folding chaperone. Predicted to be involved in protein folding. Located
    in nucleus. Part of chaperonin-containing T-complex. Is expressed in several structures,
    including hypodermis; intestine; nervous system; pharynx; and vulva. Human ortholog(s)
    of this gene implicated in intellectual disability. Orthologous to human TCP1
    (t-complex 1).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00000377;class=Gene
  source_id: WB:WBGene00000377
- source: RefSeq
  text: Predicted to enable unfolded protein binding activity. Predicted to be involved
    in protein folding. Located in nucleus. Part of chaperonin-containing T-complex.
    Is expressed in several structures, including hypodermis; intestine; nervous system;
    pharynx; and vulva. Orthologous to human TCP1 (t-complex 1). [provided by Alliance
    of Genome Resources, Jul 2025]
