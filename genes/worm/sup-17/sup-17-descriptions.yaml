- source: Alliance_Automated
  text: Predicted to enable metalloendopeptidase activity. Involved in several processes,
    including nematode male tail tip morphogenesis; positive regulation of transforming
    growth factor beta receptor signaling pathway; and vulval development. Located
    in basolateral plasma membrane and cytoplasmic vesicle membrane. Is expressed
    in several structures, including M lineage cell; germ line; intestinal cell; spermatheca;
    and vulva. Human ortholog(s) of this gene implicated in Alzheimer's disease 18
    and reticulate acropigmentation of Kitamura. Orthologous to human ADAM10 (ADAM
    metallopeptidase domain 10).
