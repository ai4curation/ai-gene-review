descriptions:
- source: UniProt
  text: Metalloprotease (By similarity). Acts together with protease adm-4 and in
    a cell autonomous manner to facilitate lin-12/Notch signaling during developmental
    cell fate decision, including anchor cell/ventral uterine precursor cell decision
    and vulva precursor cell specification (PubMed:16197940, PubMed:9409830, PubMed:9428412).
    By modulating glp-1/Notch signaling, plays a role in germline development (PubMed:16197940).
    Probably by modulating BMP-like Sma/Mab signaling via the shedding of unc-40 ectodomain,
    involved in the regulation of body size and mesoderm development (PubMed:28068334).
    Probably by shedding ephrin efn-4, regulates axon guidance of SDQL neuron during
    development (PubMed:26903502).
  source_type: curated
  url: https://www.uniprot.org/uniprot/G5EFD9
