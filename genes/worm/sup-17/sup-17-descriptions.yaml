- source: Alliance_Imported
  text: sup-17 encodes an ADAM protein, an integral membrane disintegrin and zinc-activated
    metalloproteinase, orthologous to Drosophila and mouse KUZBANIAN and the vertebrate
    ADAM10 proteins; SUP-17 is required maternally for embryonic development and plays
    a role in LIN-12/Notch-mediated cell signaling required for several cell fate
    decisions during vulval development; SUP-17 is also required for normal body morphology
    and male tail development; SUP-17 functions cell autonomously to facilitate LIN-12
    signaling and requires the LIN-12 extracellular domain to do so.
  source_type: curated
