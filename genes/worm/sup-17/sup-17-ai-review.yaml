id: G5EFD9
gene_symbol: sup-17
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: >-
  sup-17 encodes the C. elegans ortholog of ADAM10 (Drosophila Kuzbanian), a single-pass type
  I transmembrane zinc metalloprotease of the ADAM (disintegrin and metalloproteinase) family
  with a reprolysin-type catalytic domain, disintegrin domain and ADAM10-type cysteine-rich
  domain. SUP-17 acts cell autonomously in signal-receiving cells to facilitate LIN-12 and
  GLP-1 Notch signaling, dependent on the receptor extracellular domain, consistent with its
  role as the site-2 (S2) protease that sheds the Notch ectodomain after ligand binding and
  generates the substrate for gamma-secretase; this function is partially redundant with the
  TACE/ADAM17 ortholog ADM-4. It localizes to the (basolateral) plasma membrane and intracellular
  vesicles, and its surface delivery is promoted by the TspanC8-type tetraspanins TSP-12 and
  TSP-14. Beyond Notch, SUP-17 sheds other membrane proteins, promoting BMP-like Sma/Mab signaling
  (in part via UNC-40/DCC) and SDQL axon guidance (via ephrin EFN-4). Null mutants are lethal.
