    label: cell fate specification
  evidence_type: IGI
  original_reference_id: PMID:16197940
  qualifier: involved_in
  supporting_entities:
  - WB:WBGene00000075
  review:
    summary: >-
      Concomitant reduction of sup-17 and adm-4 gives two anchor cells, a lin-12 loss-of-function
      cell fate defect.
    action: KEEP_AS_NON_CORE
    reason: >-
      SUP-17 contributes to LIN-12-mediated cell fate decisions by processing the receptor
      (S2 ectodomain shedding), redundantly with ADM-4/TACE. The cell fate outcome is a downstream
      consequence of its protease function; kept as non-core.
    supported_by:
    - reference_id: PMID:16197940
      supporting_text: >-
        Furthermore, concomitant reduction of adm-4 and sup-17 activity causes the production
        of two anchor cells in the hermaphrodite gonad, instead of one--a phenotype associated
        with loss of lin-12 activity.
    - reference_id: PMID:16197940
      supporting_text: >-
        Our results are consistent with the possibility that sup-17 and adm-4 are functionally
        redundant for at least a subset of LIN-12/Notch-mediated decisions in C. elegans.
