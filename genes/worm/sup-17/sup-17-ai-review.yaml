    - reference_id: PMID:28068334
      supporting_text: >-
        We further show that the ADAM10 (a disintegrin and metalloprotease 10) ortholog SUP-17
        also functions to promote BMP signaling, and that TSP-12 can bind to and promote the
        cell surface localization of SUP-17.
