- id: file:worm/sup-17/sup-17-deep-research-falcon.md
  title: Falcon deep research report for sup-17
core_functions:
- description: >-
    Zinc-dependent ADAM metalloendopeptidase (ADAM10/Kuzbanian ortholog) that cleaves transmembrane
    substrates near the membrane to release their ectodomains. Its best-supported role is
    the ligand-dependent site-2 cleavage (ectodomain shedding) of the LIN-12 and GLP-1 Notch
    receptors, acting cell autonomously in receiving cells and redundantly with ADM-4; other
    substrates include UNC-40/DCC and EFN-4.
  molecular_function:
    id: GO:0004222
    label: metalloendopeptidase activity
  directly_involved_in:
  - id: GO:0006509
    label: membrane protein ectodomain proteolysis
  - id: GO:0007220
    label: Notch receptor processing
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:9428412
    supporting_text: >-
      Here, we show that sup-17 encodes a member of the ADAM family of metalloproteases.
  - reference_id: PMID:9428412
    supporting_text: >-
      SUP-17 is highly similar to Drosophila KUZBANIAN, which functions in Drosophila neurogenesis,
      and the vertebrate ADAM10 protein.
  - reference_id: PMID:9428412
    supporting_text: >-
      Furthermore, we show by genetic analysis that the extracellular domain of LIN-12 appears
      to be necessary for sup-17 to facilitate lin-12 signalling and that sup-17 does not
      act downstream of lin-12.
  - reference_id: PMID:16197940
    supporting_text: >-
      Expression of a truncated form of LIN-12 that mimics the product of ectodomain shedding
      rescues this fertility defect, suggesting that sup-17 and adm-4 may mediate ectodomain
      shedding of LIN-12 and/or GLP-1.
  - reference_id: PMID:16197940
    supporting_text: >-
      In Caenorhabditis elegans, genetic evidence has implicated SUP-17, the ortholog of Drosophila
      Kuzbanian and mammalian ADAM10, as the protease that mediates this event.
  - reference_id: file:worm/sup-17/sup-17-deep-research-falcon.md
    supporting_text: >-
      In the context of Notch signaling, SUP-17 participates in ligand-induced proteolytic
      processing of Notch receptors (LIN-12 and GLP-1), performing the S2 cleavage that exposes
      the receptor for subsequent γ-secretase processing and release of the Notch intracellular
      domain
proposed_new_terms: []
suggested_questions:
- question: >-
    Is SUP-17 the direct S2 protease for LIN-12/GLP-1 in vivo (biochemical detection of the
    S2-cleaved NEXT fragment), and how is the work divided between SUP-17 and ADM-4 in different
    tissues?
- question: >-
    Do TSP-12/TSP-14 (TspanC8 homologs) determine SUP-17 substrate selectivity for Notch versus
    UNC-40/EFN-4, as TspanC8s do for ADAM10 in mammals?
suggested_experiments:
- description: >-
    Express a catalytically dead (E-to-A in HExxH) SUP-17 in a sup-17 null background to test
    whether all Notch, BMP and axon guidance functions require protease activity.
