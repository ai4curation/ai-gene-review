  review:
    summary: >-
      SUP-17 co-immunoprecipitates with the tetraspanins TSP-12 and TSP-14, and TSP-12 promotes
      SUP-17 cell surface localization.
    action: REMOVE
    reason: >-
      Generic protein binding is uninformative. The interaction itself is real (and is the
      worm counterpart of the TspanC8-ADAM10 partnership), but no more specific MF term is
      appropriate from this evidence; the functional consequence is captured by the plasma
      membrane localization annotations. Removal does not imply the interaction is false.
    supported_by:
    - reference_id: PMID:28068334
