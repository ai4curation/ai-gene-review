- term:
    id: GO:0007220
    label: Notch receptor processing
  evidence_type: IGI
  original_reference_id: PMID:16197940
  review:
    summary: >-
      SUP-17 (with ADM-4) is implicated as the protease for site-2 ectodomain shedding of
      LIN-12/GLP-1: the sup-17; adm-4 sterility is rescued by a truncated LIN-12 mimicking
      the shed product, and sup-17 requires the LIN-12 extracellular domain to facilitate
      signaling.
    action: NEW
    reason: >-
      SUP-17 is proposed to catalyse a step of Notch receptor processing (the S2 cleavage),
      so it passes the participation test as the enzyme, not the substrate. Comparator: mammalian
      ADAM10 (Adam10, NAS) and presenilins (PSEN1, IDA) carry this term. Evidence in worm
      is genetic and by orthology; no biochemical detection of the cleavage product in C.
      elegans.
    supported_by:
    - reference_id: PMID:16197940
      supporting_text: >-
        Expression of a truncated form of LIN-12 that mimics the product of ectodomain shedding
        rescues this fertility defect, suggesting that sup-17 and adm-4 may mediate ectodomain
        shedding of LIN-12 and/or GLP-1.
    - reference_id: PMID:16197940
      supporting_text: >-
        In Caenorhabditis elegans, genetic evidence has implicated SUP-17, the ortholog of
        Drosophila Kuzbanian and mammalian ADAM10, as the protease that mediates this event.
    - reference_id: PMID:9428412
      supporting_text: >-
        Furthermore, we show by genetic analysis that the extracellular domain of LIN-12 appears
        to be necessary for sup-17 to facilitate lin-12 signalling and that sup-17 does not
        act downstream of lin-12.
