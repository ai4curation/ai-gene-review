suggested_questions:
- question: Do the two unc-13 germline annotations (GO:0007283, GO:0060282) trace to the cis-linked unc-13(e1091)
    marker in the fog-3 genotype, and should WormBase retract them?
- question: Which UNC-13 isoform-specific N-terminal determinants set the nanoscale distance to UNC-2
    calcium channels, and does UNC-10/RIM position UNC-13L directly?
suggested_experiments:
- description: Endogenous tagging of UNC-13L and UNC-13S combined with super-resolution imaging relative
    to UNC-2 and UNC-10, paired with flash-and-freeze EM, to test whether isoform position rather than
    abundance sets the fast and slow release components.
