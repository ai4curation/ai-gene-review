core_functions:
- description: Active-zone priming factor; UNC-13 engages syntaxin through its MUN domain at the presynaptic
    membrane, templating productive SNARE-complex assembly so that docked synaptic vesicles become fusion
    competent, with its C1 and C2 domains coupling diacylglycerol and calcium signals to release probability.
  molecular_function:
    id: GO:0017075
    label: syntaxin-1 binding
  directly_involved_in:
