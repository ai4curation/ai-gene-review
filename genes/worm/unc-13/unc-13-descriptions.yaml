descriptions:
- source: UniProt
  text: May form part of a signal transduction pathway, transducing the signal from
    diacylglycerol to effector functions (PubMed:2062851). One such function could
    be the release of neurotransmitter from neurons (PubMed:2062851). Probably by
    regulating neuronal transmission downstream of lin-3 and receptor lin-23 and phospholipase
    plc-3 and upstream of innexin unc-7 and egl-4/PKG in ALA neurons, involved in
    the decrease in pharyngeal pumping during the quiescent state that precedes each
    larval molt, (PubMed:17891142).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P27715
  source_id: P27715
  review:
    reviewer: AI
    rubrics:
    - rubric: correctness
      score: 3
    - rubric: utility
      score: 2
    - rubric: compactness
      score: 4
    - rubric: completeness
      score: 1
    - rubric: specificity
      score: 2
    overall_notes: 'Dated and hedged: ''may form part of a signal transduction pathway''
      from DAG. No priming, MUN domain or syntaxin role; mainly the molting quiescence
      pathway.'
- source: Alliance_Imported
  text: unc-13 encodes at least five protein isoforms that regulate neurotransmitter
    release by altering the conformation of syntaxin; UNC-13 proteins are required
    for normal pharyngeal pumping and thrashing in liquid, normally short lifespan,
    normally large brood sizes, and full adult body sizes; UNC-13 proteins have orthologs
    in vertebrates and Drosophila; UNC-13 proteins are complex, with multiple C2,
    phorbol ester-binding, and DUF1041 domains; UNC-13 protein form is localized to
    most or all synapses; many of the unc-13 mutant alleles with viable phenotypes
    are transcript-specific, while homozygotes with an unc-13 null (deletion) allele
    die as paralyzed first-stage larvae.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00006752;class=Gene
  source_id: WB:WBGene00006752
  review:
    reviewer: AI
    rubrics:
    - rubric: correctness
      score: 4
    - rubric: utility
      score: 3
    - rubric: compactness
      score: 3
    - rubric: completeness
      score: 3
    - rubric: specificity
      score: 3
    overall_notes: Correct on syntaxin conformation, isoforms, domains and null lethality.
      Includes lifespan, brood size and body size phenotypes the review does not cover.
- source: Alliance_Automated
  text: Predicted to enable calmodulin binding activity and syntaxin-1 binding activity.
    Involved in several processes, including positive regulation of oocyte development;
    regulation of egg-laying behavior; and regulation of nematode pharyngeal pumping.
    Located in presynaptic active zone. Is expressed in nervous system. Human ortholog(s)
    of this gene implicated in amyotrophic lateral sclerosis; intellectual developmental
    disorder with seizures and dysmorphic facies; neurodevelopmental disorder with
    hypotonia, epilepsy, and absent speech; and neurodevelopmental disorder with speech
    delay, movement abnormalities, and seizures. Orthologous to human UNC13A (unc-13
    homolog A); UNC13B (unc-13 homolog B); and UNC13C (unc-13 homolog C).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00006752;class=Gene
  source_id: WB:WBGene00006752
