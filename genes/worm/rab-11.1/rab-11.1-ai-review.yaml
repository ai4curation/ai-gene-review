id: O01803
gene_symbol: rab-11.1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: RAB-11.1 is the main Caenorhabditis elegans ortholog of the Rab11 subfamily of small GTPases
  (human RAB11A/RAB11B). It is a geranylgeranylated Rab that cycles between GDP- and GTP-bound states;
  REI-1 and REI-2 (SH3BP5 homologs) act as its guanine nucleotide exchange factors on late-Golgi membranes.
  Active RAB-11.1 resides on recycling endosomes and trans-Golgi membranes and controls traffic from these
  compartments to the plasma membrane. In oocytes it supports recycling of the yolk receptor RME-2 and
  of the VAB-1 MSP/Eph receptor, which influences meiotic maturation, and it transiently decorates cortical
  granules and is required, with the t-SNARE SYN-4, for their exocytosis after fertilization, delivering
  chondroitin proteoglycans to the eggshell. In the early embryo RAB-11 recycling endosomes cluster around
  centrosomes and the spindle and are delivered to the cleavage furrow, and RAB-11 is required for completion
  of cytokinesis and for normal spindle alignment. In intestinal epithelial cells RAB-11.1 marks apically
  enriched recycling endosomes and is required for apical exocytosis of microsporidian spore-containing
  compartments. Loss of function causes embryonic lethality.
