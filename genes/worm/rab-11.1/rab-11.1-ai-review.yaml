- term:
    id: GO:0000281
    label: mitotic cytokinesis
  evidence_type: IMP
  original_reference_id: PMID:18765566
  qualifier: involved_in
  review:
    summary: RAB-11 depletion causes cytokinesis defects in early embryos.
    action: ACCEPT
    reason: 'RAB-11 is needed for completion of cytokinesis: embryos lacking RAB-11 fail the first division,
      and REI-1-dependent delivery of RAB-11 to the cleavage furrow is needed for timely cytokinesis.
      The GTPase acts in membrane delivery to the furrow, which is a component step of cytokinesis, so
      this is participation and not only necessity. Part of the defect may be secondary to failed eggshell/ECM
      secretion, as the abstract notes, but the furrow localization supports a direct role.'
    supported_by:
    - reference_id: PMID:18765566
      supporting_text: cytokinesis defects in early embryos are commonly observed after depletion of either
        rab-11 or syn-4
    - &id016
      reference_id: PMID:18385514
      supporting_text: All embryos lacking the transgene failed cytokinesis at the first division
    - &id017
      reference_id: PMID:26506309
      supporting_text: further reduced the RAB-11 distribution to the cleavage furrow, which resulted
        in cytokinesis delay
