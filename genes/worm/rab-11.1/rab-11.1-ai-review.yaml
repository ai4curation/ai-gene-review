- term:
    id: GO:0006898
    label: receptor-mediated endocytosis
  evidence_type: IMP
  original_reference_id: PMID:10588660
  qualifier: involved_in
  review:
    summary: rab-11 RNAi reduces yolk uptake into oocytes and mislocalizes the yolk receptor RME-2.
    action: MODIFY
    reason: The authors interpret the phenotype as a receptor recycling defect, and the effect on uptake
      was milder than for clathrin or rab-5. RAB-11 does not perform internalization; it returns receptors
      from recycling endosomes to the surface, so uptake falls indirectly. The process RAB-11 does work
      in is endocytic recycling (GO:0032456), which is supported independently by the oocyte VAB-1 and
      GBF-1 studies.
    supported_by:
    - reference_id: PMID:10588660
      supporting_text: 'The Ce-rab11 (RNAi) phenotype was consistent with a role for receptor recycling
        in yolk endocytosis: YP170::GFP uptake was reduced, and RME-2 localization was altered.'
    - reference_id: PMID:10588660
      supporting_text: Ce-rab11 RNAi had a milder effect on endocytosis by the oocyte.
    - reference_id: PMID:23840591
      supporting_text: RAB-11.1, which is the Rab GTPase essential for recycling from endosomes to the
        plasma membrane was not affected by the reduction of GBF-1
    proposed_replacement_terms:
    - id: GO:0032456
      label: endocytic recycling
