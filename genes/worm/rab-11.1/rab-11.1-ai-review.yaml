suggested_questions:
- question: Which RAB-11.1 effectors (FIP-family, exocyst, myosin V homologs) mediate cortical granule
    tethering versus recycling-endosome delivery to the furrow, and are they shared?
- question: Is the spindle alignment and astral microtubule length phenotype of rab-11 RNAi a direct trafficking
    effect (e.g. delivery of a cortical force-generator component) or secondary to ER and polarity defects?
- question: How much of the embryonic cytokinesis failure is direct membrane delivery versus a consequence
    of the eggshell/ECM defect from failed cortical granule exocytosis?
- question: Do RAB-11.1 and RAB-11.2 have distinct functions, given that rab-11.2 RNAi also lowers RAB-11.1
    levels?
suggested_experiments:
- description: Separate direct cytokinesis roles from eggshell defects by depleting rab-11.1 after eggshell
    formation (auxin-inducible degron in permeabilized embryos) and scoring furrow membrane addition and
    abscission.
- description: Measure intrinsic and GAP-stimulated GTP hydrolysis of recombinant RAB-11.1 and test GTP-locked
    (Q70L) and GDP-locked (S25N) mutants for rescue of cortical granule exocytosis and RME-2 recycling.
