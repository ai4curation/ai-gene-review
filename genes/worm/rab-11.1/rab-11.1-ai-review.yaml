- term:
    id: GO:0061796
    label: obsolete membrane addition at site of mitotic cytokinesis
  evidence_type: IMP
  original_reference_id: PMID:11378383
  qualifier: involved_in
  review:
    summary: Obsolete term (membrane addition at site of mitotic cytokinesis).
    action: MODIFY
    reason: 'GO:0061796 is obsolete (QuickGO: pre-composed term, consider exocytosis). The cached abstract
      of PMID:11378383 reports the brefeldin A experiments only; RAB-11 RNAi data presumably come from
      the full text, which is not cached. RAB-11 delivers membrane to the cleavage furrow and is required
      to complete cytokinesis, so the claim is retained as mitotic cytokinesis (GO:0000281), which the
      gene already carries by IMP.'
