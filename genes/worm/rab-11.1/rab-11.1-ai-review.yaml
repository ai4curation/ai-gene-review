  review:
    summary: Phylogenetic inference of GTPase activity from the Rab11 PAINT node.
    action: ACCEPT
    reason: RAB-11.1 is a Rab11 subfamily GTPase with conserved P-loop and switch residues; GTP hydrolysis
      is the intrinsic activity that ends the Rab switch cycle. The IBA node placement is uncontroversial
      for a canonical Rab. No direct hydrolysis assay on the worm protein exists, but the GEF study shows
      a normal nucleotide cycle (GDP-form binds REI-1).
