- source: Alliance_Imported
  text: rab-11.1 encodes a small GTPase homologous to the Rab GTPases that function
    in endocytosis, membrane fusion, and vesicular trafficking events; RAB-11.1 activity
    is required for completion of the final stages of cytokinesis during early embryogenesis
    and for efficient uptake of yolk proteins during oocyte development; RAB-11.1
    is also required for normal peripheral localization of nuclei in the synctial
    germ cell in the ovary and for regulated secretion of CAV-1-containing cortical
    granules following fertilization; RAB-11.1 localizes to recycling endosomes and
    to cortical granules.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00004274;class=Gene
  source_id: WB:WBGene00004274
- source: Alliance_Automated
  text: Predicted to enable GTP binding activity and GTPase activity. Involved in
    several processes, including cortical granule exocytosis; eggshell formation;
    and membrane addition at site of mitotic cytokinesis. Located in Golgi membrane;
    apical plasma membrane; and cytoplasmic vesicle. Is active in Golgi trans cisterna
    membrane. Is expressed in gonad. Human ortholog(s) of this gene implicated in
    neurodevelopmental disorder with ataxic gait, absent speech, and decreased cortical
    white matter. Orthologous to several human genes including RAB11B (RAB11B, member
    RAS oncogene family).
