descriptions:
- source: UniProt
  text: The small GTPases Rab are key regulators of intracellular membrane trafficking,
    from the formation of transport vesicles to their fusion with membranes (PubMed:21320697,
    PubMed:24843160). Rabs cycle between an inactive GDP-bound form and an active
    GTP-bound form that is able to recruit to membranes different set of downstream
    effectors directly responsible for vesicle formation, movement, tethering and
    fusion (PubMed:21320697, PubMed:24843160). Involved in regulating the meiotic
    maturation of oocytes (PubMed:18472420). Plays a role in egg shell formation,
    regulating exocytosis of chondroitin proteoglycans following fertilization (PubMed:18765566,
    PubMed:26506309). Controls cortical granule localization and targets them to the
    plasma membrane for exocytosis (PubMed:18765566, PubMed:22992455). Acts as a major
    regulator of membrane delivery during cytokinesis (PubMed:18765566, PubMed:20116245,
    PubMed:26506309). Regulates the cytoskeleton by facilitating astral microtubule
    elongation and organization during metaphase to ensure proper spindle alignment
    and polarity in the first embryonic cell division (PubMed:18385514). Maintains
    normal endoplasmic reticulum morphology during metaphase (PubMed:18385514). Involved
    in vesicle formation and plasma membrane repair following exposure to pore forming
    toxins (PubMed:21320697). Regulates endocytic recycling (PubMed:24843160). May
    play a role in yolk receptor endocytosis in growing oocytes (PubMed:18354496,
    PubMed:26506309). Plays a role in the shedding of pathogen spores from intestinal
    cells via its involvement in spore fusion and endocytic trafficking (PubMed:24843160).
