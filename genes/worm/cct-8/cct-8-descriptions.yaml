gene_symbol: cct-8
organism: worm
uniprot_id: Q9N358
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Molecular chaperone; assists the folding of proteins upon ATP hydrolysis.
    Known to play a role, in vitro, in the folding of actin and tubulin (By similarity).
    Required for correct subcellular localization of pgl-1.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q9N358
  source_id: Q9N358
- source: Alliance_Imported
  text: cct-8 encodes a putative theta subunit of the eukaryotic cytosolic ('T complex')
    chaperonin, orthologous to human CCT8, ENSG00000020219, and CCT8L2/KCNMB3L; in
    mass RNAi assays, CCT-8 is required for transgene repression, distal tip cell
    migration, embryonic and larval viability, fertility, normal body coloration,
    locomotion, and vulval development, and normally rapid growth.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00021934;class=Gene
  source_id: WB:WBGene00021934
- source: Alliance_Automated
  text: Predicted to enable ATP binding activity; ATP hydrolysis activity; and ATP-dependent
    protein folding chaperone. Predicted to be involved in protein folding. Predicted
    to be located in cytoplasm. Predicted to be part of chaperonin-containing T-complex.
    Orthologous to human CCT8 (chaperonin containing TCP1 subunit 8).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00021934;class=Gene
  source_id: WB:WBGene00021934
- source: RefSeq
  text: Predicted to enable unfolded protein binding activity. Predicted to be involved
    in protein folding. Predicted to be located in cytoplasm. Predicted to be part
    of chaperonin-containing T-complex. Orthologous to human CCT8 (chaperonin containing
    TCP1 subunit 8). [provided by Alliance of Genome Resources, Jul 2025]
  source_type: automated
