    - rubric: specificity
      score: 3
    overall_notes: Generic CCT text plus the cited requirement for pgl-1 localization.
      Does not mention CCT8 as the limiting subunit for assembly and lifespan.
- source: Alliance_Imported
  text: cct-8 encodes a putative theta subunit of the eukaryotic cytosolic ('T complex')
    chaperonin, orthologous to human CCT8, ENSG00000020219, and CCT8L2/KCNMB3L; in
    mass RNAi assays, CCT-8 is required for transgene repression, distal tip cell
    migration, embryonic and larval viability, fertility, normal body coloration,
    locomotion, and vulval development, and normally rapid growth.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00021934;class=Gene
