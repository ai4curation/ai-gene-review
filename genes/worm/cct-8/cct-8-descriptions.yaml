- source: UniProt
  text: Molecular chaperone; assists the folding of proteins upon ATP hydrolysis.
    Known to play a role, in vitro, in the folding of actin and tubulin (By similarity).
    Required for correct subcellular localization of pgl-1.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q9N358
