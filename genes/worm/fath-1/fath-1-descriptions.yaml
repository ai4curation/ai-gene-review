    overall_notes: 'The reaction is right, but the text is mammalian FA2H boilerplate:
      myelin galactosphingolipids, epidermal lamellar bodies, sebaceous glands and
      hair follicles do not exist in C. elegans.'
- source: Alliance_Automated
  text: Predicted to enable fatty acid 2-hydroxylase activity. Predicted to be involved
    in ceramide biosynthetic process. Predicted to be located in endoplasmic reticulum
    membrane. Predicted to be active in endoplasmic reticulum. Is expressed in several
    structures, including nervous system; non-striated muscle; pharyngeal-intestinal
    valve; rectal gland cell; and reproductive system. Human ortholog(s) of this gene
    implicated in hereditary spastic paraplegia 35. Orthologous to human FA2H (fatty
    acid 2-hydroxylase).
