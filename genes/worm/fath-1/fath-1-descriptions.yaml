descriptions:
- source: UniProt
  text: Catalyzes stereospecific hydroxylation of free fatty acids at the C-2 position
    to produce (R)-2-hydroxy fatty acids, which are building blocks of sphingolipids
    and glycosphingolipids common in neural tissue and epidermis. Plays an essential
    role in the synthesis of galactosphingolipids of the myelin sheath. Responsible
    for the synthesis of sphingolipids and glycosphingolipids involved in the formation
    of epidermal lamellar bodies critical for skin permeability barrier. Participates
    in the synthesis of glycosphingolipids and a fraction of type II wax diesters
    in sebaceous gland, specifically regulating hair follicle homeostasis. Involved
    in the synthesis of sphingolipids of plasma membrane rafts, controlling lipid
    raft mobility and trafficking of raft-associated proteins.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q9XVS0
  source_id: Q9XVS0
