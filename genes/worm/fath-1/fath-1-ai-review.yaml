    action: ACCEPT
    reason: Core molecular function. FATH-1 is the sole C. elegans member of the FA2H/SCS7 subfamily and
      retains the cytochrome b5 heme-binding domain and the full set of histidine di-metal ligands of the
      catalytic centre. Worm in vivo evidence is consistent with the activity, since the fath-1 RNAi growth
