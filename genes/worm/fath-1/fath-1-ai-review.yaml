  review:
    summary: Phylogenetic inference that FATH-1 participates in ceramide biosynthesis, from the FA2H/Scs7
      node seeded by yeast Scs7 and mammalian FA2H.
    action: ACCEPT
    reason: FATH-1 performs a chemical step of the pathway, the C-2 hydroxylation that generates the 2-hydroxy
      acyl chain of 2-hydroxyceramides, so it does some of the work of ceramide biosynthesis rather than
      merely being required for it. FATH-1 lies within the PTN000304948 clade with no evidence of divergence.
      In worm, glucosylceramide is invariably 2-hydroxylated, fath-1 knockdown phenocopies loss of the
      glucosylceramide synthases cgt-1/cgt-3 (polarity conversion and L1 arrest), and the fath-1 arrest
      is not bypassed by the sphingoid base d17iso-sphinganine, placing FATH-1 in the ceramide/GlcCer
      branch.
    supported_by:
    - reference_id: PMID:21926990
      supporting_text: Finally, our MS analysis characterized GlcCer as invariably hydroxylated, consistent
        with the identified sphingolipid fatty-acid hydroxylase, C25A1.5
    - reference_id: PMID:21926990
      supporting_text: The phenotype was found in the single knockdown of a predicted sphingolipid-fatty-acid
        hydroxylase, C25A1.5, and the double knockdown of the CGT orthologs cgt-1 and cgt-3
    - reference_id: PMID:23705068
      supporting_text: As shown above, RNAi of fath-1, or mutating both cgt-1 and cgt-3, caused larval arrest
        that could not be rescued by feeding with either mmBCFAs or d17iso-SPA
