- term:
    id: GO:0046513
    label: ceramide biosynthetic process
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:2443327
  - PANTHER:PTN000304948
