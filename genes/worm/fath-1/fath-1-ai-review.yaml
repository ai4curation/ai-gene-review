gene_symbol: fath-1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: fath-1 (C25A1.5) encodes FATH-1, the sole Caenorhabditis elegans ortholog of mammalian
  fatty acid 2-hydroxylase (FA2H) and yeast Scs7. It is a 316-residue membrane enzyme of the sterol
  desaturase family (SCS7 subfamily) with an N-terminal cytochrome b5 heme-binding domain and a C-terminal
  fatty acid hydroxylase domain carrying four predicted transmembrane helices and the conserved histidine
  motifs of a di-metal (diiron/zinc) catalytic centre. By homology it resides in the endoplasmic reticulum
  membrane and hydroxylates fatty acyl chains at C-2 to produce (R)-2-hydroxy fatty acids that are incorporated
  into ceramides; C. elegans glucosylceramides are invariably 2-hydroxylated. In vivo, the growth defect
  of fath-1 RNAi animals is rescued by (R)- but not (S)-2-hydroxy palmitate. FATH-1 is expressed in neurons,
  intestine and epidermis from embryo to adult, and is required mainly in the intestine. Loss of fath-1
  causes larval arrest or growth retardation, shortened lifespan, loss of intestinal apicobasal polarity,
  reduced lipid droplets and aggregation of peroxisomes and apical endosomes, consistent with a requirement
  for hydroxylated glucosylceramide in intestinal membrane organisation and postembryonic development.
