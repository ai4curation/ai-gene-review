    summary: Yeast two-hybrid interaction between FATH-1 and DAF-3/SMAD4 from a large-scale interactome
      map of the DAF-7/TGF-beta network.
    action: REMOVE
    reason: Bare protein binding is uninformative and is removed under the protein-binding policy; this
      does not deny that the Y2H interaction was observed. The interaction comes from a systematic Y2H
      screen (abstract only available), and no more informative molecular function follows from it. FATH-1
      is a polytopic ER-membrane hydroxylase whereas DAF-3 is a SMAD transcription factor, so the physiological
      relevance of a direct interaction is uncertain.
