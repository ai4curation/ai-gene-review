core_functions:
- description: ER-membrane fatty acid 2-hydroxylase that introduces an (R)-2-hydroxyl group into fatty
    acyl chains, supplying the 2-hydroxy acyl chains of ceramides and hence of the invariably hydroxylated
    glucosylceramides of C. elegans. Activity is inferred from orthology with FA2H/Scs7, conservation of the
    cytochrome b5 domain and histidine di-metal centre, and stereospecific in vivo product rescue.
  molecular_function:
    id: GO:0080132
    label: fatty acid 2-hydroxylase activity
  directly_involved_in:
  - id: GO:0046513
    label: ceramide biosynthetic process
  - id: GO:0006631
    label: fatty acid metabolic process
  locations:
  - id: GO:0005789
    label: endoplasmic reticulum membrane
  supported_by:
  - reference_id: PMID:30184537
    supporting_text: The results showed that (R)-2-OH FA supplement nicely rescued the growth defect caused
      by fath-1 RNAi, while (S)-2-OH FA did not
  - reference_id: PMID:21926990
    supporting_text: Finally, our MS analysis characterized GlcCer as invariably hydroxylated, consistent
      with the identified sphingolipid fatty-acid hydroxylase, C25A1.5
  - reference_id: file:worm/fath-1/fath-1-uniprot.txt
    record_section: ["CC:SIMILARITY"]
    supporting_text: Belongs to the sterol desaturase family. SCS7 subfamily.
suggested_questions:
- question: Does C. elegans FATH-1 hydroxylate free fatty acids (like mammalian FA2H, supporting free fatty
    acid 2-hydroxylase activity) or ceramide-bound acyl chains (like yeast Scs7)?
- question: Is the loss of 2-hydroxylated glucosylceramide the cause of the fath-1 RNAi larval arrest and
    polarity defects, and should glucosylceramide biosynthetic process be asserted once 2-OH GlcCer depletion
    is shown in fath-1 animals?
- question: How does loss of FATH-1 reduce Delta10-C17:1 fatty acid, for example via alpha-oxidation of
    2-hydroxy C18 fatty acids?
- question: Is the reported Y2H interaction with DAF-3/SMAD4 physiologically meaningful for an ER-membrane
    enzyme?
suggested_experiments:
- description: Express FATH-1 in yeast scs7 mutants or insect/mammalian microsomes and assay 2-hydroxylation
    of free fatty acids versus ceramide-bound acyl chains by GC-MS, including stereochemistry of the product.
- description: Lipidomic profiling of fath-1 deletion or RNAi animals to quantify 2-hydroxy and non-hydroxy
    ceramides and glucosylceramides.
- description: Localise endogenously tagged FATH-1 with an ER marker (e.g. TRAM or SP12) in the intestine
    to confirm ER-membrane residence.
- description: Introduce CRISPR point mutations in the conserved histidine motif (e.g. His183/His188) to test
    whether catalytic activity is required for development and intestinal polarity.
