  title: MKS5 and CEP290 Dependent Assembly Pathway of the Ciliary Transition Zone.
  findings:
  - statement: TMEM-218 is a novel, peripheral MKS-module TZ protein whose localisation
      depends on MKS-5, CEP-290 and MKS-2.
    supporting_text: Our genetic interaction, hierarchical, and in vivo functional
      analyses reveal that TMEM-218 is a new MKS module component.
  - statement: TMEM-218 is not required for localisation of MKS-5, MKS-2 or NPHP-4,
      nor for exclusion of TRAM-1a from cilia.
    supporting_text: Our data show that TMEM-218 is not required for the localisation
      of MKS-5, MKS-2 (“core” MKS module protein), or NPHP-4 (“core” NPHP module protein)
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached; the only primary characterisation of C. elegans
      TMEM-218.
core_functions:
- description: >-
    Peripheral MKS-module membrane protein of the ciliary transition zone. It is
    recruited downstream of MKS-5, CEP-290 and MKS-2, and acts redundantly with the
    NPHP module in assembling sensory cilia. Its molecular activity is unknown, so
    no MF is asserted.
  locations:
  - id: GO:0035869
    label: ciliary transition zone
  directly_involved_in:
  - id: GO:1905515
    label: non-motile cilium assembly
  supported_by:
  - reference_id: PMID:26982032
    supporting_text: Altogether, our findings that tmem-218 encodes a TZ protein and
      genetically interacts with nphp-4 but not mks-2 are consistent with TMEM-218
      representing a novel MKS module protein.
proposed_new_terms: []
suggested_questions:
- question: Does TMEM-218 bind any MKS-module protein directly (e.g. MKS-2), and is it
    part of a biochemical MKS complex in worms as proposed for mammalian Tmem218?
- question: Does the tmem-218;nphp-4 dye-filling defect reflect loss of Y-links or TZ
    membrane anchoring that TEM can see?
suggested_experiments:
- description: Serial-section TEM of tmem-218;nphp-4 double mutant amphid cilia, compared
    with mks-2;nphp-4.
  hypothesis: TMEM-218 contributes to Y-link formation or TZ membrane docking redundantly
    with the NPHP module.
