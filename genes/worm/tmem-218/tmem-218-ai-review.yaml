id: Q2A955
gene_symbol: tmem-218
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: >-
  TMEM-218 (T23E7.5) is the Caenorhabditis elegans ortholog of human TMEM218, a
  small (126 aa) protein with three predicted transmembrane helices. It is
  expressed only in ciliated sensory neurons, and its GFP-tagged form concentrates
  at the ciliary transition zone (TZ), just distal to the basal-body transition
  fibres. TMEM-218 is a peripheral member of the MKS module. Its TZ localisation
  requires MKS-5, CEP-290 and the core MKS-module protein MKS-2, but not the NPHP
  module protein NPHP-4. TMEM-218 is not itself needed to localise MKS-5, MKS-2 or
  NPHP-4, nor to keep the periciliary membrane protein TRAM-1a out of cilia. A
  tmem-218 deletion has no overt phenotype alone, but tmem-218;nphp-4 double
  mutants show a strong dye-filling defect and tmem-218;mks-2 double mutants do
  not. This synthetic interaction places tmem-218 in the MKS module, which acts
  redundantly with the NPHP module in building the TZ and the sensory cilium. No
  molecular activity is known.
