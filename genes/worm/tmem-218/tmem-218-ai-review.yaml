    label: ciliary transition zone
  evidence_type: IDA
  original_reference_id: PMID:26982032
  qualifier: located_in
  review:
    summary: >-
      TMEM-218::GFP, expressed from its own promoter in ciliated neurons,
      concentrates at the base of amphid and phasmid cilia immediately distal to
      the transition fibres, in the same pattern as known TZ proteins.
    action: ACCEPT
    reason: >-
      Direct localisation evidence, consistent with its MKS-5/CEP-290/MKS-2-dependent
      recruitment. This is the core location of TMEM-218.
    supported_by:
    - reference_id: PMID:26982032
      supporting_text: The GFP-tagged TMEM-218 protein is specifically concentrated
        at the base of cilia, immediately distal to the basal body-associated transition
        fibres
    - reference_id: PMID:26982032
      supporting_text: This subcellular localisation for TMEM-218 is identical to known
        TZ proteins
- term:
    id: GO:1905515
    label: non-motile cilium assembly
  evidence_type: IGI
  original_reference_id: PMID:26982032
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:G5ECP0
  review:
    summary: >-
      tmem-218 single mutants dye-fill normally. tmem-218;nphp-4 double mutants have
      a mostly disrupted dye-filling phenotype, which indicates defective
      sensory-cilium structure. tmem-218;mks-2 double mutants dye-fill normally.
    action: ACCEPT
    reason: >-
      An IGI with nphp-4 (G5ECP0) supports a redundant role for TMEM-218, as an
      MKS-module protein, in building the non-motile sensory cilium. The authors
      say TEM would be needed to confirm a TZ ultrastructure defect, and TMEM-218 is
      a peripheral module component. So this process involvement is real but weaker
      than for core MKS proteins. It is kept as the gene's main known process.
    supported_by:
    - reference_id: PMID:26982032
      supporting_text: However, a double mutant with tmem-218 and an NPHP module mutant,
        nphp-4, shows a prominent dye-filling phenotype (Fig 1D).
    - reference_id: PMID:26982032
      supporting_text: Such a genetic interaction is consistent with TMEM-218 acting
        together with NPHP-4 to facilitate TZ and cilium ultrastructure formation, a
        possibility that will need to be confirmed by TEM analysis.
references:
