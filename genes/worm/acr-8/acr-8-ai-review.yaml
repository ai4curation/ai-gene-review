core_functions:
- description: >-
    Alpha-type subunit of a native C. elegans postsynaptic nicotinic
    acetylcholine receptor subset. ACR-8 contributes to acetylcholine-gated
    cation-selective channel complexes that are related to, but genetically
    distinguishable from, the canonical levamisole-sensitive body-wall muscle
    receptor.
  contributes_to_molecular_function:
    id: GO:0022848
    label: acetylcholine-gated monoatomic cation-selective channel activity
  directly_involved_in:
  - id: GO:0098655
    label: monoatomic cation transmembrane transport
  - id: GO:0007271
    label: synaptic transmission, cholinergic
  - id: GO:0099565
    label: chemical synaptic transmission, postsynaptic
  locations:
  - id: GO:0045211
    label: postsynaptic membrane
  in_complex:
    id: GO:0005892
    label: acetylcholine-gated channel complex
  supported_by:
  - *acr8_subunit
  - *acr8_subset
  - &acr8_nicotine
    reference_id: PMID:15990870
    supporting_text: acr-8 and acr-13 mutations conferred nicotine resistance
knowledge_gaps:
- gap_statement: >-
    The endogenous subunit composition, stoichiometry and pharmacology of
    ACR-8-containing C. elegans nicotinic acetylcholine receptor complexes
    remain unresolved.
  boundary: >-
    ACR-8 is established as a Cys-loop nAChR subunit that physically
    associates with native UNC-29-containing receptor material and localizes to
    a subset of UNC-38-positive postsynaptic clusters.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  significance: >-
    Defining the native ACR-8 receptor would clarify why acr-8 loss changes
    nicotine sensitivity even though acr-8 was not among the genes used to
    reconstitute the canonical LEV-8-containing L-AChR in oocytes.
  resolution: >-
    Purify ACR-8-tagged receptor complexes and combine subunit-specific
    knockouts with rescue and electrophysiology to map the receptor's
    endogenous subunit set and drug response.
  provenance:
  - *acr8_subunit
  - *acr8_subset
  - reference_id: PMID:15990870
    supporting_text: only acr-13/lev-8(x15) animals were levamisole resistant
  - reference_id: PMID:19020092
    supporting_text: *lachr_eight_genes
suggested_questions:
- question: >-
    Which endogenous C. elegans nAChR subunits assemble with ACR-8 in the
    UNC-38-positive postsynaptic clusters where ACR-8 is detected?
- question: >-
    Does ACR-8 mark a pharmacologically distinct postsynaptic receptor that
    accounts for the nicotine-resistance phenotype of acr-8 mutants?
suggested_experiments:
- description: >-
    Endogenously tag ACR-8, purify ACR-8-containing receptor complexes from
    adults, and identify co-purifying Cys-loop subunits by targeted mass
    spectrometry.
  hypothesis: >-
    ACR-8 assembles into a defined acetylcholine-gated channel complex that
    includes only a subset of canonical L-AChR subunits.
  experiment_type: affinity purification-mass spectrometry
- description: >-
    Reconstitute candidate ACR-8-containing receptor combinations in Xenopus
    oocytes with the RIC-3, UNC-50 and UNC-74 ancillary-factor system, then
    compare acetylcholine, nicotine and levamisole dose responses against the
    canonical LEV-8-containing L-AChR.
  hypothesis: >-
    ACR-8-containing receptors have nicotine and levamisole pharmacology that
    differs from the canonical five-subunit C. elegans L-AChR.
  experiment_type: heterologous electrophysiology
