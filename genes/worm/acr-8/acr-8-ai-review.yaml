  review:
    summary: PAINT propagation of calcium transport across cationic nAChR subunits.
    action: KEEP_AS_NON_CORE
    reason: >-
      Calcium permeability is a real but secondary property of many nicotinic
      acetylcholine receptor cation channels. The PTHR18945 family review
      judges this PAINT node sound for nAChR members, but exact calcium
      permeability of the endogenous ACR-8-containing receptor pool remains
      unresolved, so the row is kept as non-core.
    supported_by:
    - &pthr_calcium_sound
