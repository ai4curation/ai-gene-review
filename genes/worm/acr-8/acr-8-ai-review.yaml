references:
- id: GO_REF:0000002
  title: Gene Ontology annotation through association of InterPro records with GO
    terms
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      InterPro mappings correctly identify ACR-8 as a membrane Cys-loop
      nicotinic acetylcholine receptor subunit; the generic receptor,
      ion-channel, ion-transport and membrane rows need refinement to the
      acetylcholine-gated cation-channel function and postsynaptic locations
      supported by PAINT and the native purification/localization data.
- id: GO_REF:0000033
  title: Annotation inferences using phylogenetic trees
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PAINT correctly places the WormBase-linked ACR-8 entry in the
      cation-selective nAChR branch of PTHR18945. The propagated
      acetylcholine-gated channel activity, acetylcholine-gated channel
      complex, plasma membrane, postsynaptic membrane and cholinergic process
      rows are supported; broad membrane-potential and ion-transport rows were
      refined to the supported specific terms.
