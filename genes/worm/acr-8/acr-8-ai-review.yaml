- id: PMID:15990870
  title: >-
    Identification and characterization of novel nicotinic receptor-associated
    proteins in Caenorhabditis elegans.
  findings:
  - statement: >-
      Gottschalk et al. identified ACR-8 as an nAChR alpha subunit that
      copurified with native UNC-29-tagged receptor material.
    supporting_text: >-
      not previously implicated in levamisole receptor function: ACR-8
  - statement: >-
      ACR-8 localized to body muscles, selected neurons and nerve-cord
      synapses, and appeared in only a subset of UNC-38-positive postsynaptic
      receptor clusters.
    supporting_text: >-
      ACR-8 and ACR-12 may contribute to levamisole receptors in only a subset
      of postsynaptic clusters
  - statement: >-
      acr-8 mutants were nicotine resistant but, unlike lev-8/acr-13 mutants,
      were not detectably levamisole resistant.
    supporting_text: >-
      while acr-8 and acr-13 mutations conferred nicotine resistance,
      acr-12(ok367) did not
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text read. Native UNC-29 tandem-affinity purifications recovered
      ACR-8 as an associated alpha-type nAChR subunit, ACR-8 reporters placed
      the protein in body muscles and nerve-cord synapses, and surface
      labeling showed HA-tagged ACR-8 in a subset of UNC-38-positive
      postsynaptic clusters. The acr-8 mutant phenotype was nicotine
      resistance, not the strong levamisole-resistance phenotype of
      lev-8/acr-13.
- id: PMID:21486278
  title: >-
    Functional reconstitution of Haemonchus contortus acetylcholine receptors
    in Xenopus oocytes provides mechanistic insights into levamisole
    resistance.
  findings:
  - statement: >-
      Boulin et al. reported that Hco-ACR-8 is most closely related to C.
      elegans ACR-8 and LEV-8, and noted that a clear lev-8 ortholog had not
      been found in H. contortus.
    supporting_text: >-
      Hco-ACR-8 is most closely related to the C. elegans LEV-8 and ACR-8
      receptor subunits
  - statement: >-
      The cloned C. elegans acr-8 cDNA had accession JF416644 and was part of
      the sequence set used for comparative parasite ACR-8 analyses.
    supporting_text: >-
      C. elegans : ACR-2 NM_076727 , ACR-3 NM_076728 , ACR-8
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Full text read as comparative context for parasite ACR-8. The paper
      supports the close relationship between strongylid ACR-8 and C. elegans
      ACR-8/LEV-8, lists the F2YQX1/JF416644 cDNA as a cloned C. elegans ACR-8
      sequence rather than the WormBase reference entry, and establishes that
      H. contortus ACR-8 can contribute to an oocyte-reconstituted parasite
      L-AChR, but it was not used as direct evidence for a matching receptor
      stoichiometry or levamisole sensitivity of C. elegans ACR-8.
- id: PMID:19020092
  title: >-
    Eight genes are required for functional reconstitution of the
    Caenorhabditis elegans levamisole-sensitive acetylcholine receptor.
  findings:
  - statement: >-
      Boulin et al. reconstituted the canonical C. elegans L-AChR in Xenopus
      oocytes by expressing lev-1, lev-8, unc-29, unc-38 and unc-63 with the
      three ancillary factors ric-3, unc-50 and unc-74; acr-8 was absent from
      the required reconstitution set.
    supporting_text: &lachr_eight_genes >-
      cRNAs corresponding to the 5 L-AChR subunit genes lev-1 , lev-8 ,
      unc-29 , unc-38 , and unc-63 and the 3 ancillary factors ric-3 , unc-50
      , and unc-74
  - statement: >-
      Coexpressing the five canonical pore subunits without RIC-3, UNC-50 and
      UNC-74 did not produce measurable L-AChR current.
    supporting_text: &lachr_ancillary_requirement >-
      coinjection of the 5 receptor subunits never yielded any measurable
      current when the 3 ancillary proteins RIC-3, UNC-50, and UNC-74 were
      absent
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text read. Xenopus reconstitution of the canonical L-AChR required
      lev-1, lev-8, unc-29, unc-38, unc-63, RIC-3, UNC-50 and UNC-74; ACR-8
      was absent from that required reconstitution set, supporting the
      boundary between ACR-8 and the canonical LEV-8-containing receptor.
