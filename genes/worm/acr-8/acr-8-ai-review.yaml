id: Q23355
gene_symbol: acr-8
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: >-
  ACR-8 is an alpha-type Cys-loop nicotinic acetylcholine receptor subunit in
  Caenorhabditis elegans. It has an N-terminal ligand-binding domain and four
  predicted transmembrane helices, physically associates with native
  UNC-29-containing acetylcholine receptor preparations, and localizes to body
  muscles, nerve-cord synapses and a subset of UNC-38-positive postsynaptic
  receptor clusters. acr-8 mutants retain levamisole sensitivity but show
  nicotine resistance, consistent with ACR-8 acting in an alternative or
  subset postsynaptic nicotinic receptor pool rather than as an obligate subunit
  of the canonical five-subunit levamisole-sensitive receptor.
