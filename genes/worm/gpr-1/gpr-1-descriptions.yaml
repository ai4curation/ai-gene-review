- source: Alliance_Imported
  text: gpr-1 encodes an extremely similar (97% identity) paralog of GPR-2; GPR-1(and
    GPR-2) proteins have two N-terminal tetratricopeptide-like motifs anda C-terminal
    GoLoco/GPR (G protein regulatory) motif, the latter of whichhas also been found
    in mammalian AGS3 and Drosophila Pins; GPR-1 isrequired for normally asymmetrical
    cleavage of one-cell embryos; GPR-1 andGPR-2 form a high molecular weight (~700
    kDa) complex that includes LIN-5;GPR-1 binds GDP-bound GOA-1 via a GoLoco/GPR
    motif, and depends on RIC-8for this binding; GPR-1/2, GOA-1, and LIN-5 colocalize
    at the cortex ofearly embryos; cortical enrichment of GPR-1 requires LIN-5, PAR-2,
    PAR-3,and LET-99; the asymmetric distribution of GPR-1/2 and LET-99 in EMS cellsis
    dependent on MES-1/SRC-1 signaling; GPR-1/2 is co-immunoprecipitatedwith RIC-8
    and GPA-16.
  source_type: curated
