core_functions:
- description: Heat-inducible ATP-independent holdase chaperone of the HSP-16 family that binds unfolding
    cytoplasmic proteins (including aggregation-prone amyloid-beta) to prevent aggregation during stress.
  proposed_molecular_function: holdase chaperone activity
