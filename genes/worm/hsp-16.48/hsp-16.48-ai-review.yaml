  label: Caenorhabditis elegans
description: HSP-16.48 is a heat-inducible small heat shock protein (sHSP) of the alpha-crystallin/HSP20
  family, encoded by two identical genes, hsp-16.48 (T27E4.3) and hsp-16.49 (T27E4.9), each paired head-to-head
  with a copy of hsp-16.1 in an inverted repeat on chromosome V. It belongs to the same sHSP subclass
  as HSP-16.41. The gene is strongly induced by heat via HSF-1, with the hsp-16.1/hsp-16.48 promoter acting
  preferentially in muscle and hypodermis, and is also induced by oxidative stress. HSP-16.48 functions
  as an ATP-independent holdase chaperone that binds unfolding proteins to prevent their aggregation,
  and it is among the HSP-16 proteins that co-immunoprecipitate with intracellular amyloid-beta. HSF-1
  target chaperones including the small HSPs contribute to the extended lifespan of insulin-signalling
  mutants. Constitutive neuronal HSP-16.48 also modulates behavioural sensitivity to ethanol and nicotine
  through an N-terminal region, independently of the heat shock response.
