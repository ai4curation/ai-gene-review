- source: Alliance_Automated
  text: Predicted to enable unfolded protein holdase activity. Involved in determination
    of adult lifespan; endoplasmic reticulum unfolded protein response; and response
    to heat. Predicted to be active in cytoplasm and nucleus. Is expressed in several
    structures, including coelomocyte; enteric muscle; intestine; nervous system;
    and pharynx. Human ortholog(s) of this gene implicated in cataract 9 multiple
    types. Orthologous to human CRYAA (crystallin alpha A).
