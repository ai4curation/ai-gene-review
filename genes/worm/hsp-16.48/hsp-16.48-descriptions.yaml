descriptions:
- source: Alliance_Imported
  text: hsp-16.48 encodes a 16-kD heat shock protein (HSP) that is a member of the
    hsp16/hsp20/alphaB-crystallin (HSP16) family of heat shock proteins; an hsp-16.48
    reporter fusion, expressed broadly but most strongly in body muscle and hypodermis,
    is induced solely in response to heat shock or other environmental stresses; expression
    is detectable in somatic tissues in post-gastrulation embryos, all larval stages,
    and in adults; HSP-16.48 is likely to function as a passive ligand temporarily
    preventing unfolded proteins from aggregating.
