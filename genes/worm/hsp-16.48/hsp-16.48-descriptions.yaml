descriptions:
- source: Alliance_Imported
  text: hsp-16.48 encodes a 16-kD heat shock protein (HSP) that is a member of the
    hsp16/hsp20/alphaB-crystallin (HSP16) family of heat shock proteins; an hsp-16.48
    reporter fusion, expressed broadly but most strongly in body muscle and hypodermis,
    is induced solely in response to heat shock or other environmental stresses; expression
    is detectable in somatic tissues in post-gastrulation embryos, all larval stages,
    and in adults; HSP-16.48 is likely to function as a passive ligand temporarily
    preventing unfolded proteins from aggregating.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00002019;class=Gene
  source_id: WB:WBGene00002019
- source: Alliance_Automated
  text: Predicted to enable unfolded protein holdase activity. Involved in determination
    of adult lifespan; endoplasmic reticulum unfolded protein response; and response
    to heat. Predicted to be active in cytoplasm and nucleus. Is expressed in several
    structures, including coelomocyte; enteric muscle; intestine; nervous system;
    and pharynx. Human ortholog(s) of this gene implicated in cataract 9 multiple
    types. Orthologous to human CRYAA (crystallin alpha A).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00002019;class=Gene
  source_id: WB:WBGene00002019
