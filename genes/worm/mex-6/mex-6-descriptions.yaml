gene_symbol: mex-6
organism: worm
uniprot_id: Q09436
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Functions with mex-5 to affect embryonic viability, establish soma germline
    asymmetry in embryos and establish plk-1, pie-1, mex-1, and pos-1 asymmetry in
    embryos (PubMed:10882103, PubMed:18199581). Also affects formation of intestinal
    cells (PubMed:10882103).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q09436
  source_id: Q09436
- source: Alliance_Imported
  text: mex-6 encodes a CCCH zinc-finger protein highly similar to MEX-5 that functions
    with MEX-5 to affect embryonic viability, establish soma germline asymmetry in
    embryos and establish PIE-1, MEX-1, and POS-1 asymmetry in embryos, and also affects
    formation of intestinal cells; MEX-6 and MEX-5 may act downstream of the PAR proteins.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00003231;class=Gene
  source_id: WB:WBGene00003231
- source: Alliance_Automated
  text: Enables mRNA 3'-UTR binding activity; protein domain specific binding activity;
    and protein kinase binding activity. Involved in regulation of protein localization.
    Located in P granule. Is expressed in AB; ABa; ABp; and germ line.
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00003231;class=Gene
  source_id: WB:WBGene00003231
