- id: PMID:10882103
  title: MEX-5 and MEX-6 function to establish soma/germline asymmetry in early C. elegans embryos.
  findings:
  - statement: mex-5 and mex-6 are two nearly identical genes that link PAR cortical asymmetry to
      downstream protein asymmetries.
    supporting_text: We provide evidence that two nearly identical genes, mex-5 and mex-6, link PAR
      asymmetry to those subsequent protein asymmetries.
  - statement: The paralogs act downstream of the PAR network to pattern expression of nonlocalized
      maternal mRNAs.
    supporting_text: This network is required for subsequent asymmetries in the expression patterns
      of several proteins that are encoded by nonlocalized, maternally expressed mRNAs.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Founding paper that identifies and names mex-6 (with mex-5); PubMed-verified. Abstract
      characterizes MEX-5 localization in detail but explicitly establishes the redundant mex-5/mex-6
      pair as the link between PAR asymmetry and downstream germline protein asymmetries. Full text
      abstract-only in cache.
- id: PMID:12588843
  title: Polarization of the C. elegans zygote proceeds via distinct establishment and maintenance
    phases.
  findings:
  - statement: Zygote polarization along the A-P axis depends on cortical PAR and cytoplasmic MEX-5/6
      proteins.
    supporting_text: Polarization of the C. elegans zygote along the anterior-posterior axis depends
      on cortically enriched (PAR) and cytoplasmic (MEX-5/6) proteins
  - statement: MEX-5 and MEX-6 (CCCH finger proteins) act with PAR-1 in the establishment phase in
      a feedback loop regulating the posterior domain.
    supporting_text: The kinase PAR-1 and the CCCH finger proteins MEX-5 and MEX-6 also function
      during the establishment phase in a feedback loop to regulate growth of the posterior domain.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only central cache supplemented by explicitly labeled indexed primary
      Results in the primary-evidence note; neither the title nor the abstract alone describes all
      target assays.
  full_text_unavailable: true
- id: PMID:17264081
  title: Molecular basis of RNA recognition by the embryonic polarity determinant MEX-5.
  findings:
  - statement: MEX-5 (the near-identical paralog of MEX-6) binds RNA with high affinity but low sequence
      specificity, recognizing tracts of six or more uridines.
    supporting_text: The minimal binding site is a tract of six or more uridines within a 9-13-nucleotide
      window.
  - statement: MEX-5 has lower discrimination than mammalian TTP; changing a discriminator residue
      in each finger changes specificity. This does not mean MEX-5 or MEX-6 fails to bind AU-rich
      elements.
    supporting_text: We show that mutation of a single amino acid in each MEX-5 zinc finger confers
      tristetraprolin-like specificity to this protein.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only central cache supplemented by explicitly labeled indexed primary
      Results in the primary-evidence note; neither the title nor the abstract alone describes all
      target assays.
  full_text_unavailable: true
- id: PMID:18199581
  title: Polo kinases regulate C. elegans embryonic polarity via binding to DYRK2-primed MEX-5 and
    MEX-6.
  findings:
  - statement: Polo kinases (PLK-1, PLK-2) bind MEX-5 and MEX-6 via their polo-box domains and regulate
      their activity.
    supporting_text: We show that polo kinases, via their polo box domains, bind to and regulate
      the activity of two key polarity proteins, MEX-5 and MEX-6.
  - statement: Asymmetric localization of the polo kinases depends on MEX-5 and MEX-6.
    supporting_text: This asymmetric localization of polo kinases depends on MEX-5 and MEX-6, as
      well as genes regulating MEX-5 and MEX-6 asymmetry.
  - statement: MBK-2/DYRK2 primes the polo-docking threonine (T186 in MEX-5) for polo kinase-dependent
      phosphorylation during the oocyte-to-embryo transition.
    supporting_text: We also show that MBK-2, a developmentally regulated DYRK2 kinase activated
      at meiosis II, primes T(186) for subsequent polo kinase-dependent phosphorylation.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Names MEX-6 explicitly and is the source of the mex-6 IPI (PLK-1/PLK-2, polo-box)
      and IGI (regulation of protein localization) annotations. In MEX-6 the primed residue is Thr-190
      (UniProt MOD_RES 190; MUTAGEN T190A/T190E abolish PLK binding, ECO:0000269|PubMed:18199581).
      PubMed-verified; abstract-only in cache.
