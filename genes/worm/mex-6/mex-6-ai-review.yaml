gene_symbol: mex-6
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: MEX-6 is a tandem CCCH zinc-finger RNA-binding protein that works partly redundantly
  with MEX-5 to establish cytoplasmic soma/germline asymmetry in early Caenorhabditis elegans embryos.
  Purified MEX-6 binds an AU-rich mRNA 3′-UTR element. The MEX-5/6 pair regulates maternal RNA expression
  in a target-dependent manner, including promotion of zif-1 expression and repression of mom-2 translation,
  and contributes to maternal RNA turnover. MEX-6 binds Polo-like kinases and helps establish asymmetric
  protein localization downstream of cortical PAR polarity. It is cytoplasmic, becomes anterior-enriched
  in early embryos, and tagged MEX-6 is also observed on granules in germline blastomeres.
