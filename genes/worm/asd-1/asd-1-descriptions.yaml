      score: 4
    - rubric: utility
      score: 4
    - rubric: compactness
      score: 3
    - rubric: completeness
      score: 3
    - rubric: specificity
      score: 4
    overall_notes: Correct on egl-15 exon 5A/5B regulation with FOX-1; typo-ridden
      run-on text. Misses unc-32 neuronal targets and SUP-12 cooperation.
- source: Alliance_Automated
  text: Enables single-stranded RNA binding activity. Predicted to be involved in
    nervous system development and regulation of alternative mRNA splicing, via spliceosome.
    Predicted to be active in cytoplasm and nucleus. Is expressed in body wall musculature;
    intestine; nervous system; pharynx; and vulval muscle. Human ortholog(s) of this
    gene implicated in alcohol use disorder and congenital heart disease. Orthologous
    to human RBFOX1 (RNA binding fox-1 homolog 1); RBFOX2 (RNA binding fox-1 homolog
    2); and RBFOX3 (RNA binding fox-1 homolog 3).
  source_type: automated
