gene_symbol: asd-1
organism: worm
uniprot_id: G5EEW7
taxon_id: NCBITaxon:6239
descriptions:
- source: Alliance_Imported
  text: asd-1 encodes an ortholog of human RBM9 et al., and paralog of FOX-1 andSPN-4;
    ASD-1 isoforms have an RNA recognition motif and 1-2glutamine/asparagine-rich
    domains; ASD-1 and FOX-1 both bind a site inegl-15 mRNA that is required to repress
    exon 5B splicing into maturemRNA; ASD-1 alone is partly required for exon 5A expression
    in musclecells, while FOX-1 alone is dispensable for it; double asd-1;fox-1mutants
    completely fail to express exon 5A in muscle cells, and have asynthetic egl-15
    phenotype, while asd-1;spn-4 mutants do not; asd-1 isexpressed pharyngeally.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00011279;class=Gene
  source_id: WB:WBGene00011279
- source: Alliance_Automated
  text: Enables single-stranded RNA binding activity. Predicted to be involved in
    nervous system development and regulation of alternative mRNA splicing, via spliceosome.
    Predicted to be active in cytoplasm and nucleus. Is expressed in body wall musculature;
    intestine; nervous system; pharynx; and vulval muscle. Human ortholog(s) of this
    gene implicated in alcohol use disorder and congenital heart disease. Orthologous
    to human RBFOX1 (RNA binding fox-1 homolog 1); RBFOX2 (RNA binding fox-1 homolog
    2); and RBFOX3 (RNA binding fox-1 homolog 3).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00011279;class=Gene
  source_id: WB:WBGene00011279
