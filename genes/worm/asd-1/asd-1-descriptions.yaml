descriptions:
- source: Alliance_Imported
  text: asd-1 encodes an ortholog of human RBM9 et al., and paralog of FOX-1 andSPN-4;
    ASD-1 isoforms have an RNA recognition motif and 1-2glutamine/asparagine-rich
    domains; ASD-1 and FOX-1 both bind a site inegl-15 mRNA that is required to repress
    exon 5B splicing into maturemRNA; ASD-1 alone is partly required for exon 5A expression
    in musclecells, while FOX-1 alone is dispensable for it; double asd-1;fox-1mutants
    completely fail to express exon 5A in muscle cells, and have asynthetic egl-15
    phenotype, while asd-1;spn-4 mutants do not; asd-1 isexpressed pharyngeally.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00011279;class=Gene
  source_id: WB:WBGene00011279
  review:
    reviewer: AI
