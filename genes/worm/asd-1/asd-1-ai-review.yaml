id: G5EEW7
gene_symbol: asd-1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: asd-1 (alternative-splicing defective-1, R74.5) encodes ASD-1, one of the two C. elegans
  members of the RBFOX (Fox-1) family of RNA-binding proteins. Its paralog is FOX-1. The 404-residue
  protein has one central RRM domain (residues 100-176) of the FOX1 type, flanked by disordered,
  glutamine- and alanine-rich regions, and a C-terminal PY-type nuclear localization signal ending in
  ...RRFAPY. Like other RBFOX proteins, the RRM binds the (U)GCAUG element in pre-mRNA introns, and
  ASD-1 acts in the nucleus as a tissue-specific regulator of alternative splicing. With FOX-1 it acts
  redundantly, and with the muscle-specific RRM protein SUP-12 it acts cooperatively. In body-wall muscle,
  ASD-1 (or FOX-1) and SUP-12 bind juxtaposed elements upstream of exon 5B of the FGF receptor gene egl-15.
  The two RRMs sandwich a shared G base, and together they cause the skipping of exon 5B so that the
  muscle isoform EGL-15(5A) is made. In neurons, ASD-1 and FOX-1 bind a UGCAUG stretch in intron 7b of
  unc-32 (V-ATPase a subunit) and promote selection of exon 7a. Transcriptome-wide, ASD-1 shares many
  targets with FOX-1, MEC-8 and EXC-7. Loss of asd-1 alone has mild effects. asd-1; fox-1 double mutants
  lack EGL-15(5A) and are egg-laying defective, and asd-1; sup-12 double mutants are defective in sex
  myoblast migration.
