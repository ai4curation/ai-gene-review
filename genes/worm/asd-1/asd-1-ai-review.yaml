    supporting_text: demonstrating direct and specific binding of ASD-1 and FOX-1 to the UGCAUG stretch
  - reference_id: PMID:23468662
    supporting_text: indicating that the C-terminal portions of ASD-1 and FOX-1 are the sole NLSs
  - reference_id: PMID:17923701
