  review:
    summary: Regulation of alternative splicing, inherited from the RBFOX ancestral node (PTN001037261),
      whose seeds include the mammalian RBFOX proteins and C. elegans FOX-1.
    action: ACCEPT
    reason: This is the defining activity of the RBFOX family, and ASD-1 has its own direct evidence.
      asd-1 was isolated in a forward screen for regulators of the egl-15 mutually exclusive exon
      reporter. asd-1; fox-1 double mutants fail to express EGL-15(5A), and ASD-1 binds the target pre-mRNA
      elements directly (egl-15 with SUP-12; unc-32 intron 7b UGCAUG). It regulates unc-32 exon 7a
      selection in neurons. ASD-1 itself binds the regulatory cis element, so it does part of the work
      of choosing the splice site, not just a necessity role. This is the core process.
    supported_by:
    - reference_id: PMID:17060915
      supporting_text: We identified alternative-splicing defective-1 (asd-1), encoding a new RNA-binding
        protein of the evolutionarily conserved Fox-1 family, as a regulator of the egl-15 reporter.
