core_functions:
- description: Sequence-specific binding of the RBFOX-type RRM to (U)GCAUG elements in pre-mRNA introns.
    In the nucleus, this binding regulates tissue-specific alternative splicing. In muscle, ASD-1 acts
    together with SUP-12 to skip egl-15 exon 5B so that EGL-15(5A) is made. In neurons, it acts with FOX-1
    to select unc-32 exon 7a. It works redundantly with its paralog FOX-1.
  molecular_function:
    id: GO:0097157
    label: pre-mRNA intronic binding
  directly_involved_in:
