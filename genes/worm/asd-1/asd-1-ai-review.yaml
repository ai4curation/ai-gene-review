suggested_questions:
- question: Does asd-1 produce isoforms that lack the C-terminal PY-NLS and act in the cytoplasm, as
    the cytoplasmic RBFOX1 isoforms do in mammals? This would decide the family-level cytoplasm and mRNA
    binding rows.
- question: What separates ASD-1 from FOX-1? Both bind the same element and are largely redundant, yet
    RNA-seq of single mutants shows distinct exon changes. Are the differences in expression pattern,
    partner choice (for example SUP-12 or EXC-7) or intrinsic RRM affinity?
- question: Should the experimentally supported egl-15 and unc-32 splicing roles be captured in GO with
    has_input targets (for example in a GO-CAM), rather than through the general regulation of alternative
    splicing term alone?
