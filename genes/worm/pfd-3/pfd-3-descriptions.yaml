- source: Alliance_Imported
  text: pfd-3 encodes a putative prefoldin, orthologous to human VBP1 (OMIM:300133),
    that is required for normal alpha-tubulin synthesis, microtubule growth, mitotic
    spindle formation and positioning, early embryonic cell division, and embryonic
    and larval viability; PFD-3 is expressed cytoplasmically in most, if not all,
    tissues.
