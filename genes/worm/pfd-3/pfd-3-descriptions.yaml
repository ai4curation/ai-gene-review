gene_symbol: pfd-3
organism: worm
uniprot_id: O18054
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Binds specifically to cytosolic chaperonin (c-CPN) and transfers target proteins
    to it. Binds to nascent polypeptide chain and promotes folding in an environment
    in which there are many competing pathways for nonnative proteins (By similarity).
  source_type: curated
  url: https://www.uniprot.org/uniprot/O18054
  source_id: O18054
- source: Alliance_Imported
  text: pfd-3 encodes a putative prefoldin, orthologous to human VBP1 (OMIM:300133),
    that is required for normal alpha-tubulin synthesis, microtubule growth, mitotic
    spindle formation and positioning, early embryonic cell division, and embryonic
    and larval viability; PFD-3 is expressed cytoplasmically in most, if not all,
    tissues.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00006889;class=Gene
  source_id: WB:WBGene00006889
- source: Alliance_Automated
  text: Predicted to enable protein-macromolecule adaptor activity. Predicted to be
    involved in protein folding and tubulin complex assembly. Located in cytoplasm.
    Is expressed in body wall musculature; head muscle; oocyte; pharyngeal muscle
    cell; and vulval muscle. Orthologous to human VBP1 (VHL binding protein 1).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00006889;class=Gene
  source_id: WB:WBGene00006889
- source: RefSeq
  text: Predicted to enable tubulin binding activity. Predicted to be involved in
    microtubule-based process and tubulin complex assembly. Located in cytoplasm.
    Is expressed in body wall musculature; head muscle; oocyte; pharyngeal muscle
    cell; and vulval muscle. Orthologous to human VBP1 (VHL binding protein 1). [provided
    by Alliance of Genome Resources, Jun 2026]
  source_type: automated
  url: https://www.ncbi.nlm.nih.gov/gene/173141
  source_id: GeneID:173141
