- term:
    id: GO:0030674
    label: protein-macromolecule adaptor activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN000274575
  - UniProtKB:P61758
  review:
    summary: IBA assigning adaptor activity to PFD-3. Prefoldin bridges non-native clients and the CCT
      chaperonin, which is the sense in which it could be called an adaptor.
    action: MODIFY
    reason: Prefoldin does bring clients and CCT together, but its own established activity is chaperone
      (holdase) binding of non-native chains and their delivery to CCT [PMID:9630229]. 'Protein-macromolecule
      adaptor activity' describes a scaffold that holds two partners together to form a functional assembly.
      It does not convey the chaperone role, and the human ortholog reviews in this repository use protein
      folding chaperone. Replace with GO:0044183 protein folding chaperone.
    proposed_replacement_terms:
    - id: GO:0044183
      label: protein folding chaperone
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - ROLE_CONFLATION
      source_entities:
      - source_id: PANTHER:PTN000274575
        source_status: SUPPORTS_TRANSFER
        comment: 'The prefoldin-subunit node placement is sound and the target is a canonical member.
          The problem is the choice of term: prefoldin''s activity is chaperone delivery of clients to
          CCT, not a generic adaptor scaffold.'
    supported_by:
    - *id001
