  label: Caenorhabditis elegans
description: PFD-3 (T06G6.9; also called VBP-1) is an alpha-class subunit of C. elegans prefoldin, the
  ortholog of human VBP1/PFDN3. Prefoldin is a heterohexamer of two alpha and four beta subunits. It captures
  non-native actin and tubulin chains in the cytosol and passes them to the CCT/TRiC chaperonin, supporting
  efficient tubulin biogenesis. In C. elegans, prefoldin RNAi lowers alpha-tubulin levels and slows microtubule
  growth, causing defects in embryonic cell division and in distal tip cell migration. Depleting vbp-1,
  like other prefoldin subunits, suppresses the lethality of a temperature-sensitive dynein heavy chain
  mutant.
