  review:
    summary: IBA linking PFD-3 to tubulin complex assembly. Prefoldin acts upstream, folding nascent tubulin
      with CCT before tubulin cofactors assemble the alpha/beta heterodimer.
    action: KEEP_AS_NON_CORE
    reason: Prefoldin loss in C. elegans lowers alpha-tubulin levels and slows microtubule growth [PMID:18062952],
      so the complex is needed to make assembly-competent tubulin. The assembly step itself is carried
      out by tubulin-folding cofactors, with prefoldin acting earlier in the folding pathway. The IBA
      is retained as a non-core, downstream-process annotation.
    supported_by:
