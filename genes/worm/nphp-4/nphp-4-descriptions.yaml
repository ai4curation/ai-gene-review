gene_symbol: nphp-4
organism: worm
uniprot_id: G5ECP0
taxon_id: NCBITaxon:6239
descriptions:
- source: Alliance_Imported
  text: nphp-4 encodes an ortholog of human NPHP4 (OMIM:607215, mutated injuvenile
    nephronophthisis and Senior-Loken syndrome-4) that is requiredfor normal chemotaxis,
    lifespan, and male mating behavior; NPHP-4 isexpressed in diverse neurons (amphid
    and phasmid sensory, URX, labial,male lumbar and cloacal ganglia, and male-specific
    CEM, HOB and RnB);within neurons, NPHP-4 is a ciliary protein, localized to the
    transistionzone at cilial bases rather than ciliary axonemes, and absent fromsomata,
    axons, or dendrites; NPHP-4 colocalizes with NPHP-1 and PKD-2 inmale-specific
    sensory cilia, and is required for the normal ciliarylocalization of NPHP-1; NPHP-4
    expression requires DAF-19, and mutating anX-box in nphp-4's promoter abolishes
    nphp-4 expression; NPHP-4 is requiredfor NPHP-1's localization to transistion
    zones; morphologically, nphp-4mutant cilia are normal, indicating a function for
    NPHP-4 in signaltransduction.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00011261;class=Gene
  source_id: WB:WBGene00011261
- source: Alliance_Automated
  text: Involved in several processes, including determination of adult lifespan;
    male mating behavior; and plasma membrane bounded cell projection organization.
    Located in ciliary basal body; ciliary transition zone; and non-motile cilium.
    Is expressed in cloacal ganglion; neurons; and tail ganglion. Used to study nephronophthisis.
    Human ortholog(s) of this gene implicated in Joubert syndrome 4; Senior-Loken
    syndrome 4; congenital heart disease; nephronophthisis; and nephronophthisis 4.
    Orthologous to human NPHP4 (nephrocystin 4).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00011261;class=Gene
