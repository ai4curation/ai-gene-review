- source: Alliance_Imported
  text: lag-1 encodes a transcription factor orthologous to members of the CSL (CBF1,
    Suppressor of Hairless, LAG-1) family that is highly conserved amongst metazoans;
    during development, LAG-1 functions as a downstream effector in both the lin-12-
    and glp-1-mediated Notch-like signaling pathways and accordingly, is required
    for such processes as germline induction, AC/VU lateral signaling, and embryonic
    development; LAG-1 can bind a consensus CSL family binding site found in multiple
    copies in the predicted regulatory regions of lin-12, glp-1, and lag-1, thus implicating
    LAG-1 as an important component of the positive feedback loop observed in the
    LIN-12/GLP-1 signaling pathway.
