- source: Alliance_Automated
  text: Enables Notch binding activity; RNA polymerase II cis-regulatory region sequence-specific
    DNA binding activity; and transcription coactivator binding activity. Involved
    in several processes, including dauer exit; germ cell development; and regulation
    of DNA-templated transcription. Located in chromatin and nucleus. Part of CSL-Notch-Mastermind
    transcription factor complex. Is expressed in several structures, including ADF;
    P4.p; P5.p; P6.p; and ventral uterine precursor. Human ortholog(s) of this gene
    implicated in Adams-Oliver syndrome 3 and dilated cardiomyopathy. Orthologous
    to several human genes including RBPJ (recombination signal binding protein for
    immunoglobulin kappa J region).
