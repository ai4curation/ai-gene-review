    label: negative regulation of transcription by RNA polymerase II
  evidence_type: IMP
  original_reference_id: PMID:32839181
  qualifier: involved_in
  review:
    summary: >-
      LAG-1 binding sites in the lag-1 enhancer mediate default repression in the AC/VU context
      when LIN-12 is inactive.
    action: ACCEPT
    reason: >-
      Default repression of Notch target genes by CSL in the absence of Notch ICD is conserved
      CSL biology (the CSL repressor-to-activator switch). The Luo et al. analysis provides
      worm evidence for such repression at the lag-1 locus. Accepted; note that germline ChIP/AID
      data suggest repression is not a general property of LAG-1 in the germline (PMID:32196486).
    supported_by:
    - reference_id: PMID:32839181
      supporting_text: However, our analysis suggests default repression in the AC/VU context.
    - reference_id: PMID:16530045
      supporting_text: >-
        Ternary complex formation induces a substantial conformational change within CSL,
        suggesting a molecular mechanism for the conversion of CSL from a repressor to an
        activator.
