id: V6CLJ5
gene_symbol: lag-1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: >-
  lag-1 encodes the single C. elegans CSL (CBF1/RBPJ, Suppressor of Hairless, LAG-1) protein,
  the sequence-specific DNA-binding transcription factor through which both worm Notch receptors,
  LIN-12 and GLP-1, regulate gene expression. LAG-1 binds the RTGGGAA CSL motif via its N-terminal
  Rel-homology and beta-trefoil domains. The RAM region of the Notch intracellular domain
  binds the beta-trefoil domain, and the ankyrin repeats together with the Mastermind-family
  coactivator LAG-3/SEL-8 assemble on the CSL C-terminal domain, converting LAG-1 from a default
  repressor into an activator of Notch target genes; crystal structures of this worm ternary
  complex on DNA have been solved. Direct targets include lst-1 and sygl-1 in germline stem
  cells, lin-11, egl-43, mir-57 and lag-1 itself (positive autoregulation). lag-1 is required
  for essentially all LIN-12- and GLP-1-mediated cell fate decisions, and strong loss of function
  phenocopies the lin-12 glp-1 double mutant (Lag phenotype). LAG-1 also has a reported Notch-independent
  role as a terminal selector transcription factor maintaining the serotonergic identity of
  ADF chemosensory neurons.
