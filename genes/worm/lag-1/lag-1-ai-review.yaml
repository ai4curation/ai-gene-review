- id: file:worm/lag-1/lag-1-deep-research-falcon.md
  title: Falcon deep research report for lag-1
core_functions:
- description: >-
    Sequence-specific DNA-binding transcription factor that binds the CSL (RTGGGAA) motif
    in cis-regulatory regions of Notch target genes. With the LIN-12 or GLP-1 intracellular
    domain and the coactivator LAG-3/SEL-8 it forms the CSL-NICD-Mastermind activation complex
    that turns on targets such as lst-1, sygl-1, lin-11 and lag-1 itself; in the absence of
    Notch ICD it can act as a default repressor.
  molecular_function:
    id: GO:0000981
    label: DNA-binding transcription factor activity, RNA polymerase II-specific
  directly_involved_in:
  - id: GO:0007221
    label: positive regulation of transcription of Notch receptor target
  - id: GO:0000122
    label: negative regulation of transcription by RNA polymerase II
  locations:
  - id: GO:0005634
    label: nucleus
  - id: GO:0000785
    label: chromatin
  in_complex:
    id: GO:1990433
    label: CSL-Notch-Mastermind transcription factor complex
  supported_by:
  - reference_id: PMID:8625826
    supporting_text: >-
      Furthermore, we show that LAG-1 binds specifically to the DNA sequence RTGGGAA, previously
      identified as a CBF-1/Su(H)-binding site.
  - reference_id: PMID:32196486
    supporting_text: >-
      First, we identified robust germline LAG-1 ChIP-seq peaks in the promoters of lst-1
      and sygl-1, overlapping the position of consensus LAG-1/CSL binding sites.
  - reference_id: PMID:32196486
    supporting_text: >-
      In the C. elegans germline, GLP-1 Notch signaling specifies the stem cell fate, employing
      the sequence-specific DNA binding protein LAG-1 to implement the transcriptional response.
  - reference_id: PMID:16530045
    supporting_text: >-
      Ternary complex formation induces a substantial conformational change within CSL, suggesting
      a molecular mechanism for the conversion of CSL from a repressor to an activator.
  - reference_id: file:worm/lag-1/lag-1-deep-research-falcon.md
    supporting_text: >-
      This NICD-LAG-1-SEL-8 complex converts LAG-1 from a basal repressor into an activator
      of Notch target gene transcription
- description: >-
    Binds the RAM and ankyrin-repeat regions of the LIN-12 and GLP-1 intracellular domains
    (RAM binds the beta-trefoil domain with high affinity), the defining interaction that
    couples receptor proteolysis to nuclear transcription; RAM binding also creates the docking
    site for the Mastermind coactivator LAG-3.
  molecular_function:
    id: GO:0005112
    label: Notch binding
  directly_involved_in:
  - id: GO:0007221
    label: positive regulation of transcription of Notch receptor target
  locations:
  - id: GO:0005634
    label: nucleus
  in_complex:
    id: GO:1990433
    label: CSL-Notch-Mastermind transcription factor complex
  supported_by:
  - reference_id: PMID:15297877
    supporting_text: >-
      A 13-mer peptide derived from the RAM domain of the C. elegans Notch ortholog Lin-12
      interacts tightly and specifically with BTD constructs from both Lag-1 and the mouse
      CSL ortholog RBP-Jκ
  - reference_id: PMID:9003776
    supporting_text: >-
      By contrast, the interaction between the RAM domain and LAG-1 is likely to be direct,
      since it is observed by co-precipitation of the proteins in vitro as well as by yeast
      two-hybrid experiments.
  - reference_id: PMID:18381292
    supporting_text: >-
      Our binding data show that RAM and CSL form a high affinity complex in the presence
      or absence of DNA.
  - reference_id: PMID:18381292
    supporting_text: >-
      Our structural studies reveal a striking distal conformational change in CSL upon RAM
      binding, which creates a docking site for Mastermind to bind to the complex.
proposed_new_terms: []
suggested_questions:
- question: >-
    Which corepressors mediate LAG-1 default repression in C. elegans (worm SHARP/MINT or
    Hairless-like proteins have not been clearly identified), and how widespread is repression
    outside the AC/VU context given that germline data argue against general repression?
- question: >-
    LAG-1 is reported to act independently of GLP-1, LIN-12 and SEL-8 as a terminal selector
    in ADF serotonergic neurons (Maicas et al. 2021) and to repress hlh-6 in a lin-12-independent
    manner; which partner factors replace the Notch ICD/Mastermind in these contexts, and
    should these Notch-independent activities be annotated separately?
suggested_experiments:
- description: >-
    Tissue-specific degradation of LAG-1 (AID) combined with ChIP-seq in somatic gonad, vulval
    precursor cells and M lineage to define direct LIN-12 versus GLP-1 targets and directly
    test default repression.
