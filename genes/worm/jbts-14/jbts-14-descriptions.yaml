  text: Involved in non-motile cilium assembly. Located in ciliary basal body and
    ciliary transition zone. Is expressed in ciliated neurons. Used to study Joubert
    syndrome. Human ortholog(s) of this gene implicated in Joubert syndrome and Joubert
    syndrome 14. Orthologous to human TMEM237 (transmembrane protein 237).
