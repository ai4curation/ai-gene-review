- term:
    id: GO:0036064
    label: ciliary basal body
  evidence_type: IDA
  original_reference_id: PMID:27623382
  qualifier: located_in
  review:
    summary: >-
      Nechipurenko et al. used GFP-tagged JBTS-14 as one of several TZ markers
      (with MKS-5, MKSR-2, NPHP-1, NPHP-4) and showed that these TZ proteins are
      mislocalised together with basal-body proteins in grdn-1 mutants.
    action: MODIFY
    reason: >-
      The cached record is abstract-only, so I read the PMC full text
      (PMC5023068). It reports JBTS-14 localising to the TZ in wild-type AWB/AWC
      cilia. In the same paper the basal-body markers (DYF-19, GASR-8, GRDN-1) are
      described as excluded from the TZ marked by MKS-5. So the paper places
      JBTS-14 at the TZ, which lies just distal to the basal body, and ciliary
      transition zone is the accurate term. The 'ciliary base' wording probably
      explains the basal body mapping. JBTS-14 does co-mislocalise with basal-body
      proteins, but that reflects TZ templating by the basal body, not residence in
      it.
    proposed_replacement_terms:
    - id: GO:0035869
      label: ciliary transition zone
    supported_by:
    - reference_id: PMID:22152675
      supporting_text: Both
        mammalian and C. elegans TMEM237/JBTS-14 require RPGRIP1L/MKS5 for proper TZ
        localization
