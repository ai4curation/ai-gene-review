core_functions:
- description: >-
    MKS-module membrane protein of the ciliary transition zone. It is recruited by
    MKS-5 and TMEM-107 and acts redundantly with the NPHP module in anchoring the
    basal body/TZ to the membrane and in assembling the non-motile sensory cilium.
    Its molecular activity is unknown, so no MF is asserted.
