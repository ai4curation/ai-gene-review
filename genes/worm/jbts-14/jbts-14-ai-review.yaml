suggested_questions:
- question: Does JBTS-14 TZ localisation depend on CEP-290, as other MKS-module membrane
    proteins (TMEM-231, TMEM-17, TMEM-218) do?
- question: Is JBTS-14 needed for the TZ diffusion barrier (e.g. TRAM-1a exclusion),
    as core MKS proteins are?
suggested_experiments:
- description: Image endogenously tagged JBTS-14 in cep-290 and tmem-107 mutants, and
    assay TRAM-1a/RPI-2 ciliary leakage in jbts-14 single mutants.
  hypothesis: JBTS-14 is a CEP-290-dependent MKS-module protein needed for TZ gate function.
