  label: Caenorhabditis elegans
description: >-
  JBTS-14 (F53A9.4; also called TMEM-237) is the Caenorhabditis elegans ortholog of
  human TMEM237 (JBTS14, formerly ALS2CR4), a protein of the TMEM237 family with
  four predicted transmembrane helices. JBTS-14 localises to the ciliary transition
  zone (TZ) of sensory cilia and belongs to the MKS module of TZ proteins. Its TZ
  localisation depends on MKS-5 (the RPGRIP1L ortholog) and on TMEM-107, and it
  interacts functionally with the MKS-module proteins MKS-2/TMEM216, MKSR-1/B9D1
  and MKSR-2/B9D2. jbts-14 interacts genetically with the NPHP-module gene nphp-4:
  double mutants are defective in anchoring the basal body and TZ to the membrane
  and in ciliogenesis. Like other TZ proteins, JBTS-14 is also mislocalised to
  ectopic sites when basal-body positioning is perturbed in girdin (grdn-1)
  mutants. Its molecular activity is unknown. Mutations in human TMEM237 cause a
  Joubert syndrome-related disorder.
