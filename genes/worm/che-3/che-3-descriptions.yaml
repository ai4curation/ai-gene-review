- source: Alliance_Automated
  text: Predicted to enable dynein intermediate chain binding activity; dynein light
    intermediate chain binding activity; and minus-end-directed microtubule motor
    activity. Involved in several processes, including dauer entry; non-motile cilium
    assembly; and positive regulation of dauer larval development. Located in non-motile
    cilium. Is expressed in I4 neuron; ciliated neurons; and nerve ring. Human ortholog(s)
    of this gene implicated in asphyxiating thoracic dystrophy and asphyxiating thoracic
    dystrophy 3. Orthologous to human DYNC2H1 (dynein cytoplasmic 2 heavy chain 1).
