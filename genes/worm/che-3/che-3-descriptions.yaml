gene_symbol: che-3
organism: worm
uniprot_id: Q19542
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Functions as a motor for intraflagellar retrograde transport in chemosensory
    neurons (PubMed:10545497, PubMed:28479320). Functions in cilia biogenesis (PubMed:10545497,
    PubMed:27515926).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q19542
  source_id: Q19542
- source: Alliance_Imported
  text: che-3 encodes a dynein heavy chain (DHC) 1b isoform that affects the establishment
    and maintainance of the structural integrity of sensory cilia, and that also has
    a role in intraflagellar transport; CHE-3 is expressed in ciliated sensory neurons.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00000485;class=Gene
  source_id: WB:WBGene00000485
- source: Alliance_Automated
  text: Predicted to enable dynein intermediate chain binding activity; dynein light
    intermediate chain binding activity; and minus-end-directed microtubule motor
    activity. Involved in several processes, including dauer entry; non-motile cilium
    assembly; and positive regulation of dauer larval development. Located in non-motile
    cilium. Is expressed in I4 neuron; ciliated neurons; and nerve ring. Human ortholog(s)
    of this gene implicated in asphyxiating thoracic dystrophy and asphyxiating thoracic
    dystrophy 3. Orthologous to human DYNC2H1 (dynein cytoplasmic 2 heavy chain 1).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00000485;class=Gene
  source_id: WB:WBGene00000485
