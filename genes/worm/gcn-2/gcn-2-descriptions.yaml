gene_symbol: gcn-2
organism: worm
uniprot_id: D0Z5N4
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Serine/threonine-protein kinase which phosphorylates the alpha subunit of
    eukaryotic translation-initiation factor 2 (eIF2alpha), leading to its inactivation
    and thus to a rapid reduction of translational initiation and repression of global
    protein synthesis (By similarity). Involved in the unfolded protein response (UPR)
    triggered by several stresses including mitochondrial, osmotic and oxidative stresses,
    amino acid deprivation and UV irradiation, probably by phosphorylating and inhibiting
    eIF2alpha (PubMed:20733002, PubMed:22719267, PubMed:23076791, PubMed:23692540).
    In addition, leads to the selective translation/transcription of some mRNA including
    atf- 5, pha-4 and gpdh-1 which are part of the UPR (PubMed:23076791, PubMed:23692540).
    Required for maintaining lifespan during amino acid starvation (PubMed:23692540).
    Involved in hypoxia-mediated adaptive protective response (PubMed:20733002).
  source_type: curated
  url: https://www.uniprot.org/uniprot/D0Z5N4
  source_id: D0Z5N4
- source: Alliance_Imported
  text: gcn-2 encodes the C. elegans homolog of the eIF2alpha kinase; GCN-2 is required
    for regulation of translation and specifically, for regulation of translation
    in response to mitochondrial dysfunction; in regulating mitochondrial protein
    homeostasis, GCN-2 functions in parallel to the ATFS-1 bZip transcription factor.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00013591;class=Gene
  source_id: WB:WBGene00013591
- source: Alliance_Automated
  text: Predicted to enable eukaryotic translation initiation factor 2alpha kinase
    activity and protein serine kinase activity. Involved in several processes, including
    GCN2-mediated signaling; cytoplasmic stress granule assembly; and mitochondrial
    unfolded protein response. Acts upstream of with a positive effect on positive
    regulation of gene expression. Predicted to be active in cytosol and nucleus.
    Human ortholog(s) of this gene implicated in pulmonary venoocclusive disease 2.
    Orthologous to human EIF2AK4 (eukaryotic translation initiation factor 2 alpha
    kinase 4).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00013591;class=Gene
  source_id: WB:WBGene00013591
