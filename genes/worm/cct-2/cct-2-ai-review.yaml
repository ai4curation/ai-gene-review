suggested_questions:
- question: Which native C. elegans CCT clients depend specifically on contacts made by the
    beta subunit apical domain, as opposed to the complex as a whole?
- question: Does cct-2 overexpression extend lifespan by raising assembled CCT levels, as
    shown for cct-8, or through a subunit-specific mechanism?
suggested_experiments:
- description: Affinity purification and mass spectrometry of endogenously tagged cct-2 (or
    of assembled CCT) from staged C. elegans, combined with crosslinking, to map clients contacting
    the beta subunit.
  hypothesis: The beta subunit contributes a defined subset of client contacts, dominated
    by actin and tubulin but including WD40 and other proteins.
