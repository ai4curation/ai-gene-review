  review:
    summary: High-throughput yeast two-hybrid interaction of CCT-2 with Y39A1A.3 (G5EEN7,
      an SSSCA1-like protein) from the WI-2007 worm interactome.
    action: REMOVE
    reason: Generic protein binding is uninformative and the single Y2H pair has no known
      functional link to chaperonin activity; the paper supports no more informative MF term.
      CCT subunits contact many polypeptides as folding clients, so an isolated binary Y2H
      hit does not describe a molecular function of CCT-2. Removal does not imply the interaction
      is false.
