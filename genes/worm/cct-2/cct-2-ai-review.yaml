gene_symbol: cct-2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: cct-2 encodes the beta (CCT2 / TCP-1-beta) subunit of the eukaryotic cytosolic
  chaperonin CCT (chaperonin-containing TCP-1), also called TRiC. CCT/TRiC is an ATP-dependent
  double-ring chaperonin in which each ring is built from eight distinct paralogous subunits;
  the assembled complex, not any single subunit, encloses and folds a subset of cytosolic
  proteins, most prominently actin and tubulin. CCT-2 is one of the four high-ATP-affinity
  subunits whose nucleotide binding drives the folding cycle. In C. elegans cct-2 is expressed
  throughout development, strongly in pharynx and tail, and acts in the cytoplasm of somatic
  and germline cells. Depletion of cct-2 lowers the levels of other CCT subunits and causes
  ectopic RNA-binding-protein condensates and expanded ER sheets in maturing oocytes, while
  somatic overexpression of cct-2 modestly extends lifespan, increases heat-stress resistance
  and reduces polyglutamine toxicity, consistent with CCT capacity supporting cytosolic protein
  homeostasis.
