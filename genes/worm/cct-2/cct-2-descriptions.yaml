descriptions:
- source: UniProt
  text: Molecular chaperone; assists the folding of proteins upon ATP hydrolysis.
    Known to play a role, in vitro, in the folding of actin and tubulin.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P47207
  source_id: P47207
  review:
    reviewer: AI
    rubrics:
    - rubric: correctness
      score: 4
    - rubric: utility
      score: 3
    - rubric: compactness
      score: 5
    - rubric: completeness
      score: 2
    - rubric: specificity
      score: 3
    overall_notes: Correct generic CCT chaperonin text with actin and tubulin. Leaves
      out the beta-subunit identity and the worm data (oocyte condensates, lifespan
      effect of overexpression).
- source: Alliance_Imported
  text: cct-2 encodes a putative beta subunit of the eukaryotic cytosolic ('T complex')
    chaperonin, orthologous to human CCT2 (OMIM:605139); CCT-2 is expressed in most,
    if not all, tissues; CCT-2 represses SKN-1-dependent transcription of gst-4; CCT-2
    is expressed in touch receptor neurons in a MEC-3-dependent fashion; in mass RNAi
    assays, CCT-2 is required for normal transgene repression and subcellular localization,
    embryonic osmotic integrity, embryonic and larval viability, fertility, vulval
    development, and body color.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00000378;class=Gene
  source_id: WB:WBGene00000378
