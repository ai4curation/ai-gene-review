    - rubric: utility
      score: 3
    - rubric: compactness
      score: 3
    - rubric: completeness
      score: 3
    - rubric: specificity
      score: 2
    overall_notes: '''Putative'' beta subunit, plus a list of mass-RNAi phenotypes
      and MEC-3-dependent touch-neuron expression. The gst-4 repression claim is not
      in the review.'
- source: Alliance_Automated
  text: Predicted to enable ATP binding activity; ATP hydrolysis activity; and ATP-dependent
    protein folding chaperone. Predicted to be involved in protein folding. Predicted
    to be located in cytosol. Predicted to be part of chaperonin-containing T-complex.
    Is expressed in several structures, including alimentary muscle; body wall musculature;
    hypodermis; tail; and touch receptor neurons. Orthologous to human CCT2 (chaperonin
    containing TCP1 subunit 2).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00000378;class=Gene
