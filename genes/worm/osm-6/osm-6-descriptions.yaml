taxon_id: NCBITaxon:6239
descriptions:
- source: Alliance_Imported
  text: osm-6 encodes a novel protein that is orthologous to the IFT52 component of
    the intraflagellar transport particle;  osm-6 activity is required cell autonomously
    for proper sensory cilium structure and thus for normal ciliated sensory neuron
    function; OSM-6 is a component of the intraflagellar transport particle subcomplex
    B, and OSM-6::GFP reporter fusions are expressed exclusively in ciliated sensory
    neurons.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00003886;class=Gene
  source_id: WB:WBGene00003886
- source: Alliance_Automated
  text: Involved in several processes, including cellular response to salt; non-motile
    cilium assembly; and sensory perception of mechanical stimulus. Located in several
    cellular components, including ciliary basal body; ciliary transition zone; and
    neuronal cell body. Is expressed in neurons. Human ortholog(s) of this gene implicated
    in asphyxiating thoracic dystrophy. Orthologous to human IFT52 (intraflagellar
    transport 52).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00003886;class=Gene
  source_id: WB:WBGene00003886
