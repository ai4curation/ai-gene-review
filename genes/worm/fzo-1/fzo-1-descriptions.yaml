- source: Alliance_Imported
  text: fzo-1 encodes a GTPase orthologous to MFN1(Mitofusin)/FZO1, a conserved mitochondrial
    transmembrane protein essential for mitochondrial fusion; in C. elegans, fzo-1
    is also required for mitochondrial fusion and organization and accordingly, is
    essential for reproduction, embryonic development, and normal growth rates.
