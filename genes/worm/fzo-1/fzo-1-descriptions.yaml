gene_symbol: fzo-1
organism: worm
uniprot_id: Q23424
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Probable transmembrane GTPase (By similarity). Mediates mitochondrial fusion
    (PubMed:18722182, PubMed:19327994, PubMed:21248201, PubMed:25190516, PubMed:33734301).
    Fusion of mitochondria occurs in many cell types and constitutes an important
    step in mitochondria morphology, which is balanced between fusion and fission
    (By similarity). Dispensable for normal apoptotic processes during embryonic development
    (PubMed:18722182).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q23424
  source_id: Q23424
- source: Alliance_Imported
  text: fzo-1 encodes a GTPase orthologous to MFN1(Mitofusin)/FZO1, a conserved mitochondrial
    transmembrane protein essential for mitochondrial fusion; in C. elegans, fzo-1
    is also required for mitochondrial fusion and organization and accordingly, is
    essential for reproduction, embryonic development, and normal growth rates.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00001509;class=Gene
  source_id: WB:WBGene00001509
- source: Alliance_Automated
  text: Predicted to enable GTPase activity. Involved in mitochondrial fusion. Predicted
    to be located in membrane. Predicted to be active in mitochondrial outer membrane.
    Is expressed in intestine; nervous system; pharynx; and tail. Human ortholog(s)
    of this gene implicated in Charcot-Marie-Tooth disease (multiple) and multiple
    symmetric lipomatosis. Orthologous to several human genes including MFN1 (mitofusin
    1).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00001509;class=Gene
  source_id: WB:WBGene00001509
- source: RefSeq
  text: Predicted to enable GTPase activity. Involved in mitochondrial fusion. Predicted
