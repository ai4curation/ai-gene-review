suggested_questions:
- question: Is SKN-1 directly ubiquitinated by a CUL-4/DDB-1/WDR-23 complex, and which SKN-1
    lysines are modified?
- question: Should the well-documented role of CUL-4 in preventing DNA re-replication be captured
    with a regulation-of-replication-initiation term, given that orthologous CUL4 proteins
    are not annotated this way?
suggested_experiments:
- description: In vitro or in vivo ubiquitination assays of SKN-1 with reconstituted CUL-4/DDB-1/WDR-23/RBX-1,
    with and without neddylation, to test the presumed direct mechanism of SKN-1 repression.
