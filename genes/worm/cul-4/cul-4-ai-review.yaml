  title: The Caenorhabditis elegans replication licensing factor CDT-1 is targeted for degradation
    by the CUL-4/DDB-1 complex.
  findings:
  - statement: DDB-1 binds CUL-4 specifically; CUL-4/DDB-1 degrades CDT-1 in S phase.
    supporting_text: The CUL-4/DDB-1 complex is required for CDT-1 degradation during S phase
      and for restraining DNA rereplication.
- id: PMID:17509881
  title: C. elegans CUL-4 prevents rereplication by promoting the nuclear export of CDC-6
    via a CKI-1-dependent pathway.
  findings:
  - statement: CUL-4 promotes CDC-6 phosphorylation and nuclear export via CKI-1.
    supporting_text: CUL-4 promotes the phosphorylation of CDC-6 and its translocation via
      negative regulation of the CDK-inhibitor CKI-1.
- id: PMID:19273594
  title: The WD40 repeat protein WDR-23 functions with the CUL4/DDB1 ubiquitin ligase to regulate
    nuclear abundance and activity of SKN-1 in Caenorhabditis elegans.
  findings:
  - statement: WDR-23 works with CUL-4/DDB-1 to repress SKN-1; ubiquitination presumed.
    supporting_text: SKN-1 protein levels, nuclear accumulation, and activity are repressed
      by the WD40 repeat protein WDR-23, which interacts with the CUL-4/DDB-1 ubiquitin ligase
      to presumably target the transcription factor for proteasomal degradation.
