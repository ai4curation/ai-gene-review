  label: Caenorhabditis elegans
description: 'CUL-4 is the single C. elegans cullin-4, the scaffold subunit of CRL4 (cullin-RING)
  E3 ubiquitin ligases. Its N-terminal cullin repeats bind the adaptor DDB-1, which in turn
  carries interchangeable DCAF substrate receptors (for example CDT-2 and WDR-23), while its
  C-terminal cullin-homology domain binds the RING protein and is activated by NEDD8 conjugation.
  CRL4 complexes act mainly in the nucleus: during S phase CUL-4/DDB-1 directs degradation
  of the replication-licensing factor CDT-1 and, via repression of the CDK inhibitor CKI-1,
  promotes nuclear export of CDC-6, together preventing DNA re-replication in proliferating
  larval blast cells. CRL4-CDT-2 also degrades the translesion polymerase POLH-1 during the
  embryonic DNA damage response, and the WDR-23-containing CRL4 restrains the abundance and
  nuclear accumulation of the stress-responsive transcription factor SKN-1.'
