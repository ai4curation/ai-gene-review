core_functions:
- description: 'Scaffold of CRL4 cullin-RING E3 ubiquitin ligases: binds the DDB-1 adaptor
    (which carries DCAF substrate receptors such as CDT-2 and WDR-23) and the RING subunit,
    driving ubiquitination and proteasomal degradation of nuclear targets including CDT-1
    and POLH-1.'
