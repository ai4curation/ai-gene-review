  review:
    summary: IBA to DNA damage response. In worm embryos CRL4-CDT-2 (requiring cul-4) degrades
      POLH-1 during the response to MMS-induced damage.
    action: KEEP_AS_NON_CORE
    reason: Supported by worm data (POLH-1 stabilised by cul-4 co-depletion), but the DNA
      damage response is one of several substrate-specific outputs of the CRL4 scaffold rather
      than the core activity.
