gene_symbol: cul-4
organism: worm
uniprot_id: Q17392
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Component of cullin-based E3 ubiquitin-protein ligase complexes which mediate
    the ubiquitination and subsequent proteasomal degradation of target proteins.
    The functional specificity of the E3 ubiquitin-protein ligase complex depends
    on the variable substrate recognition component. In association with ddb-1 directs
    ubiquitination of cdt-1 during S phase and is required for restraining DNA rereplication.
    Probably is involved in ubiquitination of cki-1.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q17392
  source_id: Q17392
- source: Alliance_Imported
  text: cul-4 encodes one of six C. elegans cullin proteins; CUL-4 activity is essential
    for negative regulation of DNA-replication licensing and thus, for maintenance
    of genome stability; in regulating DNA replication, CUL-4 functions as part of
    a CUL-4/DDB-1 ubiquitin ligase complex that degrades the replication licensing
    factor CDT-1 and indirectly promotes nuclear export of the replication licensing
    factor CDC-6 by negatively regulating the levels of the CKI-1 CDK inhibitor; cul-4
    mRNA is expressed throughout development with highest levels seen in embryos and
    lower levels seen in larvae and adults; maternal cul-4 mRNA is present in early
    embryos and larval and adult mRNA is most notably present in the intestine and
    germ line.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00000839;class=Gene
  source_id: WB:WBGene00000839
- source: Alliance_Automated
  text: Predicted to enable ubiquitin ligase complex scaffold activity and ubiquitin
    protein ligase binding activity. Involved in proteasome-mediated ubiquitin-dependent
    protein catabolic process. Predicted to be part of Cul4-RING E3 ubiquitin ligase
    complex. Predicted to be active in nucleus. Is expressed in embryonic cell; germ
    line; gonad; intestine; and oocyte. Human ortholog(s) of this gene implicated
    in syndromic X-linked intellectual disability Cabezas type. Orthologous to several
    human genes including CUL4B (cullin 4B).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00000839;class=Gene
  source_id: WB:WBGene00000839
