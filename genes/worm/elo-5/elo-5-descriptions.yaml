gene_symbol: elo-5
organism: worm
uniprot_id: Q20300
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Catalyzes the first and rate-limiting reaction of the four reactions that
    constitute the long-chain fatty acids elongation cycle. Uses malonyl-CoA to add
    2 carbons per cycle to the chain of long-chain fatty acids. Condensing enzyme
    required for the formation of isopentadecanoate (C15iso) and isoheptadecanoate
    (C17iso), both play critical roles in animal development and growth.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q20300
  source_id: Q20300
- source: Alliance_Imported
  text: The elo-5 gene encodes a paralog of elo-1 and elo-2, each of which encodes
    a polyunsaturated fatty acid (PUFA) elongase; ELO-5 is required for normally rapid
    growth and for normal fatty acid composition.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00001243;class=Gene
  source_id: WB:WBGene00001243
- source: Alliance_Automated
  text: Predicted to enable fatty acid elongase activity. Involved in methyl-branched
    fatty acid biosynthetic process. Predicted to be located in membrane. Predicted
    to be active in endoplasmic reticulum membrane. Is expressed in amphid neurons
    and intestine.
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00001243;class=Gene
  source_id: WB:WBGene00001243
- source: RefSeq
