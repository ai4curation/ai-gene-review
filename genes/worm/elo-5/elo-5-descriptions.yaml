descriptions:
- source: UniProt
  text: Catalyzes the first and rate-limiting reaction of the four reactions that
    constitute the long-chain fatty acids elongation cycle. Uses malonyl-CoA to add
    2 carbons per cycle to the chain of long-chain fatty acids. Condensing enzyme
    required for the formation of isopentadecanoate (C15iso) and isoheptadecanoate
    (C17iso), both play critical roles in animal development and growth.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q20300
  source_id: Q20300
