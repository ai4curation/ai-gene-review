  - *id004
  - *id002
  - *id006
  - *id007
suggested_questions:
- question: 'What is the precise acyl-CoA substrate specificity of ELO-5: does it elongate only the C11/C13
    iso-branched primers (to C13ISO/C15ISO), and does it also contribute to C15ISO->C17ISO elongation
    alongside ELO-6?'
- question: Should the PAINT node propagating unsaturated and very-long-chain fatty acid elongation (GO:0034625,
    GO:0034626, GO:0042761) to all nematode ELO paralogs be restricted, given that ELO-5/ELO-6 are specialized
    for branched-chain substrates?
suggested_experiments:
- description: Express ELO-5 in a yeast elo-deficient strain or in microsomes and assay condensation activity
    with iso-branched (C11ISO, C13ISO, C15ISO) and straight-chain acyl-CoA substrates plus malonyl-CoA.
  hypothesis: ELO-5 preferentially condenses iso-branched C11-C13 acyl-CoAs, directly producing the C15ISO
    precursor.
- description: Endogenous tagging of ELO-5 (CRISPR GFP knock-in) with co-localization against an ER marker
    in intestinal cells.
  hypothesis: ELO-5 is an integral ER membrane protein like other ELO-family elongases.
