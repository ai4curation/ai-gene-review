  reference_review:
    relevance: LOW
    correctness: DISPUTED
    review_notes: WormBase curated description (uncited, undated). Paralogy to elo-1
      and elo-2 and the requirement for normal growth and fatty acid composition are
      correct. The text describes ELO-5 only through its PUFA-elongase paralogs. It
      omits that ELO-5 elongates monomethyl branched-chain fatty acids to C15ISO and
      C17ISO (PMID:15340492). It also omits that C15ISO feeds the d17iso sphingoid
      base of C. elegans sphingolipids (PMID:23705068, PMID:38704027), which explains
      the L1 arrest. A missing-statement defect is recorded. Not used as support.
    source_defects:
    - defect_type: MISSING_STATEMENT
      resource: WORMBASE
      record: WB:WBGene00001243
      slot: MOD_provided_gene_description
      requested_change: ADD
      asserted_value: WB:WBGene00001243
      confidence: PROBABLE
      explanation: The WormBase gene description says only that elo-5 "encodes a paralog
        of elo-1 and elo-2, each of which encodes a polyunsaturated fatty acid (PUFA)
        elongase" and is required for growth and normal fatty acid composition. ELO-5
        is not a PUFA elongase. elo-5 RNAi strongly reduces the monomethyl branched-chain
        fatty acids C15ISO and C17ISO, and dietary C17ISO rescues the elo-5 growth
        arrest (PMID:15340492). elo-5 mutants lack sphingolipids built on the d17iso
        sphingoid base (PMID:23705068). The description should name the mmBCFA elongation
        activity and the sphingolipid link.
      supported_by:
      - reference_id: PMID:15340492
        supporting_text: The RNAi of elo-6 significantly reduced the amount of only
          C17ISO, while the RNAi of elo-5 dramatically reduced quantities of both C15ISO
          and C17ISO
      - reference_id: PMID:23705068
        supporting_text: In contrast to wild type animals, elo-5(-);ku540 animals had
          ceramides and glucosylceramides containing straight chain d16LCB rather than
          d17isoLCB
core_functions:
- description: ELO-family 3-ketoacyl-CoA synthase in the ER membrane that elongates iso-branched acyl-CoA
    primers with malonyl-CoA, producing the monomethyl branched-chain fatty acids C15ISO and (with ELO-6)
    C17ISO. It supplies the C15ISO acyl-CoA that serine palmitoyltransferase converts into the d17iso
    sphingoid base, making ELO-5 required for synthesis of most C. elegans ceramides, glucosylceramides
    and sphingomyelins.
  molecular_function:
    id: GO:0009922
    label: fatty acid elongase activity
  directly_involved_in:
  - id: GO:1902321
    label: methyl-branched fatty acid biosynthetic process
  - id: GO:0030148
    label: sphingolipid biosynthetic process
  locations:
  - id: GO:0005789
    label: endoplasmic reticulum membrane
