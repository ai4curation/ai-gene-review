  review:
    summary: IBA for sphingolipid biosynthesis from yeast ELO2/ELO3, Candida and mouse ELOVL donors.
    action: ACCEPT
    reason: In C. elegans the iso-C15 acyl-CoA made by ELO-5 is the substrate that serine palmitoyltransferase
      (SPTL-1) condenses into the worm-specific d17iso sphingoid base, so ELO-5 catalyses an early step
      of sphingolipid biosynthesis (analogous to how VLCFA elongases supply ceramide acyl chains). elo-5
      mutants lack d17iso sphingolipids and RNAi lowers nearly all ceramides; the essential developmental
      role of elo-5 is mediated by d17iso-glucosylceramide. The IBA is therefore well supported by worm
      data.
