id: Q20300
gene_symbol: elo-5
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: 'ELO-5 is an endoplasmic reticulum membrane fatty acid elongase (ELO family 3-ketoacyl-CoA
  synthase) of Caenorhabditis elegans that catalyses the condensation of malonyl-CoA with iso-branched
  acyl-CoA primers, the first and rate-limiting step of the elongation cycle. It is the principal enzyme
  for de novo synthesis of the monomethyl branched-chain fatty acids isopentadecanoate (C15ISO) and, together
  with ELO-6, isoheptadecanoate (C17ISO). C15ISO-CoA is the precursor of the nematode-specific d17iso
  sphingoid base, so ELO-5 is required for the bulk of C. elegans ceramides, glucosylceramides and sphingomyelins.
  Through d17iso-glucosylceramide and TORC1 signalling these lipids are essential for postembryonic development:
  elo-5 loss causes a diet-reversible L1 arrest. elo-5 is expressed mainly in the intestine and some head
  neurons and is transcriptionally promoted by the SREBP homolog LPD-1.'
