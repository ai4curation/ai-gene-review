gene_symbol: ife-2
organism: worm
uniprot_id: Q21693
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Recognizes and binds the 7-methylguanosine-containing mRNA cap during an early
    step in the initiation of protein synthesis and facilitates ribosome binding by
    inducing the unwinding of the mRNAs secondary structures. All 5 eIF4E proteins
    bind monomethyl cap structures. Only ife-1, ife-2 and ife-5 bind trimethyl cap
    structures which result from trans-splicing. Translation of trimethyl cap structure
    mRNAs may be regulated by intracellular redox state; disulfide bonds change the
    width and depth of the cap-binding cavity determining selectivity to mRNA caps
    (PubMed:10744754, PubMed:9553113). Probably by regulating mRNA translation in
    somatic cells, negatively regulates lifespan independently of daf-2/insulin and
    let-363/TOR pathways (PubMed:17277769). Negatively regulates resistance to oxidative
    stress (PubMed:17277769). May play a role in embryonic development (PubMed:17277769).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q21693
  source_id: Q21693
- source: Alliance_Imported
  text: ife-2 encodes a translation initiation factor 4F, cap-binding subunit (eIF-4E);
    by homology, IFE-2 is predicted to function in cap-dependent mRNA translation
    initiation; loss of ife-2 activity in adult animals extends lifespan.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00002060;class=Gene
  source_id: WB:WBGene00002060
- source: Alliance_Automated
  text: Enables RNA 7-methylguanosine cap binding activity and RNA trimethylguanosine
    cap binding activity. Involved in several processes, including determination of
    adult lifespan; negative regulation of response to oxidative stress; and positive
    regulation of translation. Located in cytoplasmic stress granule. Is expressed
    in several structures, including excretory canal; germ line; nerve ring; neurons;
    and vulva. Human ortholog(s) of this gene implicated in autistic disorder. Orthologous
    to human EIF4E (eukaryotic translation initiation factor 4E) and EIF4E1B (eukaryotic
    translation initiation factor 4E family member 1B).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00002060;class=Gene
  source_id: WB:WBGene00002060
