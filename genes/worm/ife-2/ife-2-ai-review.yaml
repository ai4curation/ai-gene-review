suggested_questions:
- question: Does IFE-2 relocalise to P bodies during ageing (PMID:30282029) or remain excluded from them
    (PMID:25061667), and does any such sequestration regulate its availability for translation?
- question: Which mRNAs depend selectively on IFE-2 rather than IFE-1/IFE-5 or IFE-3, and does the TMG-cap
    preference explain this selectivity?
- question: Is the Y2H interaction with MXT-1 a 4E-BP-like repressive interaction in vivo, and should
    it be captured as an informative partner-specific term on MXT-1?
suggested_experiments:
- description: Ribosome profiling or polysome-seq of ife-2(ok306) versus wild type at 20 C and 25 C, separating
    SL1 trans-spliced (TMG) from non-trans-spliced (m7G) mRNAs, to define IFE-2-dependent transcripts.
- description: Quantitative cap-analogue binding (fluorescence titration) of recombinant IFE-2 with m7GTP
    and m3(2,2,7)GTP, under reducing and oxidising conditions, to test the proposed redox control of cap
    selectivity via the Cys130-Cys134 disulfide.
- description: Endogenous-tag (CRISPR) IFE-2 co-immunoprecipitation with IFG-1/eIF4G and MXT-1 to confirm
    eIF4F membership in vivo.
