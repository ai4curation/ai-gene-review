      lifespan, DAF-16 independently.
    supporting_text: loss of a specific eIF4E isoform (IFE-2) that functions in somatic tissues reduces
      global protein synthesis, protects from oxidative stress and extends lifespan
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract only in cache; supports lifespan, translation and oxidative-stress rows.
- id: PMID:18804378
  title: The Target of Rapamycin pathway antagonizes pha-4/FoxA to control development and aging.
  findings:
  - statement: ife-2 mutation reduces protein biosynthesis and extends lifespan independently of pha-4.
    supporting_text: ife-2/eIF4E also reduce protein biosynthesis and extend lifespan, but only rsks-1
      mutations require pha-4 for adult longevity
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text read; 35S incorporation reduced ~20% by ife-2 RNAi.
