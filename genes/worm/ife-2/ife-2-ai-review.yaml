id: Q21693
gene_symbol: ife-2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: ife-2 (R04A9.4) encodes IFE-2, one of five C. elegans members of the eukaryotic translation
  initiation factor 4E (eIF4E) family and the major eIF4E isoform of somatic tissues. Like other eIF4Es
  it binds the 5' cap of mRNA and, as the cap-binding subunit of eIF4F, recruits mRNA to the ribosome
  during cap-dependent translation initiation. IFE-2 belongs to the IFE-1/IFE-2/IFE-5 subgroup that recognises
  both the standard 7-methylguanosine cap and the 2,2,7-trimethylguanosine cap carried by the majority
  of nematode mRNAs after SL1 trans-splicing; this subgroup is partially redundant and collectively essential.
  IFE-2 is diffusely cytoplasmic and moves into stress granules under heat or oxidative stress, and has
  been reported to accumulate in P bodies during ageing. Loss of IFE-2 lowers somatic protein synthesis,
  increases stress resistance and extends lifespan independently of DAF-16, and ife-2 mutants fail to
  load msh-4, msh-5 and spo-11 mRNAs onto polysomes at elevated temperature, causing a temperature-sensitive
  meiotic crossover defect.
