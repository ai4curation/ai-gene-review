core_functions:
- description: Binds the 5' mRNA cap, recognising both 7-methylguanosine and trans-spliced 2,2,7-trimethylguanosine
    caps, and as the cap-binding subunit of eIF4F recruits mRNA for cap-dependent translation initiation
    in somatic cells.
