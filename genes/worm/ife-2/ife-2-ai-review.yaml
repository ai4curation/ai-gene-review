- id: PMID:25061667
  title: Diverse functions of mRNA metabolism factors in stress defense and aging of Caenorhabditis elegans.
  findings:
  - statement: IFE-2::GFP is diffuse cytoplasmic and forms stress granules under heat or oxidative stress,
      not P bodies.
    supporting_text: This indicates that IFE-2 localizes mainly in SGs under stress conditions
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text read; source of the stress granule IDA row.
- id: PMID:9553113
  title: Multiple isoforms of eukaryotic protein synthesis initiation factor 4E in Caenorhabditis elegans
    can distinguish between mono- and trimethylated mRNA cap structures.
  findings:
  - statement: IFE-2 binds m7GTP-Sepharose and this binding is competed by the trimethylguanosine cap
      analogue.
    supporting_text: binding of IFE-1 and IFE-2 to m7GTP-Sepharose was inhibited by m32,2,7GTP
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract only; original cloning and cap-binding study. Source of the IDA cap-binding
      rows.
- id: PMID:23705068
  title: A novel sphingolipid-TORC1 pathway critically promotes postembryonic development in Caenorhabditis
    elegans.
  findings:
  - statement: ife-2 RNAi, like RNAi of other TORC1 components and targets, abolishes the nprl-3 rescue
      of elo-5 L1 arrest, placing IFE-2 downstream of TORC1 in postembryonic growth.
    supporting_text: We found that elo-5(−) nprl-3(ku540) animals treated with ife-2(RNAi) or rsks-1(RNAi),
      with or without C17ISO supplement, yielded results similar to those obtained with raga-1(RNAi) and
      rheb-1(RNAi)
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text read. Genetic epistasis only; supports IFE-2 as a TORC1 effector but does
      not justify a NEW process term for ife-2.
- id: PMID:20530576
  title: A C. elegans eIF4E-family member upregulates translation at elevated temperatures of mRNAs encoding
    MSH-5 and other meiotic crossover proteins.
  findings:
  - statement: IFE-2 is required at 25 C for polysome loading of msh-4/him-14 and msh-5 mRNAs and for
      crossover formation.
    supporting_text: suggesting that IFE-2 translationally upregulates synthesis of MSH-4/HIM-14 and MSH-5
      at elevated temperatures
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text available; polysome profiling shows IFE-2-dependent initiation on specific
      mRNAs. Meiotic phenotype is downstream.
- id: PMID:30282029
  title: Maintenance of Proteostasis by P Body-Mediated Regulation of eIF4E Availability during Aging
    in Caenorhabditis elegans.
  findings:
  - statement: IFE-2 is increasingly sequestered in P bodies during ageing and stress.
    supporting_text: the eIF4E isoform IFE-2 is increasingly sequestered in mRNA processing (P) bodies
      during aging and upon stress
  reference_review:
    relevance: MEDIUM
    correctness: DISPUTED
    review_notes: Same lab as PMID:25061667, which reported no age-dependent IFE-2 accumulation in P bodies;
      the P-body claim is therefore contested.
