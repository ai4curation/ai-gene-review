- term:
    id: GO:0008340
    label: determination of adult lifespan
  evidence_type: IGI
  original_reference_id: PMID:17277769
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:O16850
  review:
    summary: ife-2 loss extends adult lifespan; genetic interactions with insulin, TOR, clk and dietary-restriction
      pathways.
    action: KEEP_AS_NON_CORE
    reason: Robust and repeatedly reproduced phenotype (ife-2 deletion and RNAi), consistent with the
      translation-inhibition longevity paradigm. It is a downstream organismal consequence of reduced
      somatic translation, not a core activity, so it is kept as non-core. The IGI partners include daf-16
      (lifespan extension is DAF-16 independent) and other longevity mutants used in epistasis tests.
    supported_by:
    - &id007
      reference_id: PMID:17277769
      supporting_text: protects from oxidative stress and extends lifespan in Caenorhabditis elegans
    - &id008
      reference_id: PMID:18804378
      supporting_text: ife-2/eIF4E also reduce protein biosynthesis and extend lifespan
