gene_symbol: bbs-2
organism: worm
uniprot_id: Q19640
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Component of the BBSome complex (By similarity). The BBSome complex is thought
    to function as a coat complex required for sorting of specific membrane proteins
    to the primary cilia. The BBSome complex is required for ciliogenesis but is dispensable
    for centriolar satellite function (By similarity). Required for proper BBSome
    complex assembly and its ciliary localization (PubMed:22922713). Required for
    cilia biogenesis and both the assembly and movement of intraflagellar transport
    proteins along the ciliary axoneme (PubMed:15231740, PubMed:22022287, PubMed:22922713).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q19640
  source_id: Q19640
- source: Alliance_Imported
  text: bbs-2 encodes a ciliary protein that is orthologous to human BBS2; bbs-2 is
    expressed exclusively in ciliated sensory neurons at the transition zone and along
    the axoneme; BBS proteins are required for ciliary structure and function; BBS-2
    along with other BBS proteins undergoes intraflagellar transport (IFT); loss of
    function mutations in the guanylate cyclase complex GCY-35/GCY-36 results in a
    full or partial suppression of the non-ciliary phenotypes of BBS mutants like
    body size, developmental delay, and roaming defects suggesting a non-cell autonomous
    role for sensory cilia and BBS proteins in regulating cGMP signaling.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00000242;class=Gene
  source_id: WB:WBGene00000242
- source: Alliance_Automated
  text: Involved in non-motile cilium assembly. Located in ciliary basal body and
    neuron projection. Is expressed in nervous system. Used to study Bardet-Biedl
    syndrome. Human ortholog(s) of this gene implicated in Bardet-Biedl syndrome;
    Bardet-Biedl syndrome 2; obesity; and retinitis pigmentosa 74. Orthologous to
    human BBS2 (Bardet-Biedl syndrome 2).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00000242;class=Gene
  source_id: WB:WBGene00000242
