- source: Alliance_Imported
  text: bbs-2 encodes a ciliary protein that is orthologous to human BBS2; bbs-2 is
    expressed exclusively in ciliated sensory neurons at the transition zone and along
    the axoneme; BBS proteins are required for ciliary structure and function; BBS-2
    along with other BBS proteins undergoes intraflagellar transport (IFT); loss of
    function mutations in the guanylate cyclase complex GCY-35/GCY-36 results in a
    full or partial suppression of the non-ciliary phenotypes of BBS mutants like
    body size, developmental delay, and roaming defects suggesting a non-cell autonomous
    role for sensory cilia and BBS proteins in regulating cGMP signaling.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00000242;class=Gene
  source_id: WB:WBGene00000242
