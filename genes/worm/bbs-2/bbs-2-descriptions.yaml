- source: Alliance_Automated
  text: Involved in non-motile cilium assembly. Located in ciliary basal body and
    neuron projection. Is expressed in nervous system. Used to study Bardet-Biedl
    syndrome. Human ortholog(s) of this gene implicated in Bardet-Biedl syndrome;
    Bardet-Biedl syndrome 2; obesity; and retinitis pigmentosa 74. Orthologous to
    human BBS2 (Bardet-Biedl syndrome 2).
