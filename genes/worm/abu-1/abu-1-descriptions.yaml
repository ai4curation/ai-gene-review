descriptions:
- source: Alliance_Imported
  text: abu-1 encodes a transmembrane protein with a predicted signal sequence, a
    glutamine/asparagine-rich domain and multiple cysteine-rich repeats (DUF139);
    abu-1 expression is induced by blockage of the endoplasmic reticulum unfolded
    protein response, and ABU-1 may help protect the organism from damage by improperly
    folded nascent protein; when expressed in COS1 cells, ABU-1 localizes to the endoplasmic
    reticulum membrane.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00000024;class=Gene
