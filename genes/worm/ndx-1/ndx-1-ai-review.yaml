id: O45830
gene_symbol: ndx-1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: >-
  ndx-1 (T26E3.2) encodes a 365-residue Nudix hydrolase of the NUDT18 (MTH3) family that
  removes the terminal phosphate from oxidised guanine nucleoside diphosphates. Purified
  NDX-1 hydrolyses 8-oxo-dGDP and 8-oxo-GDP to the corresponding monophosphates, works best
  with Mg2+ (Mn2+ gives about half the activity), and does not act on 8-oxo-dGTP, on
  unoxidised dGDP, dGTP, dADP or dATP, or on 2-hydroxy-dATP/dADP. By converting 8-oxo-dGDP
  to 8-oxo-dGMP it can prevent the oxidised nucleotide from being phosphorylated to the
  mutagenic DNA polymerase substrate 8-oxo-dGTP; consistent with this, expressing NDX-1 in
  an E. coli mutT mutant suppresses A:T to C:G transversions and its sensitivity to methyl
  viologen. In C. elegans, ndx-1 RNAi does not shorten lifespan but makes developing worms
  more sensitive to the superoxide generators methyl viologen and menadione bisulfite, and
  knocking down ndx-1 together with ndx-2 further sensitises ndx-4 mutants. A GFP fusion
  expressed in body wall muscle gave a sarcoplasmic reticulum-like pattern; the endogenous
  localization is not known.
