    summary: >-
      InterPro mapping to the generic nucleoside diphosphate phosphatase activity, the parent
      of both 8-oxo-dGDP and 8-oxo-GDP phosphatase activity.
    action: MODIFY
    reason: >-
      Formally true as an ancestor of the experimentally supported activities, but the
      general term implies activity on ordinary NDPs. Purified NDX-1 does not hydrolyse
      dGDP or dADP, and hydrolyses GDP at under 5%, so the specific oxidised-nucleotide term
      describes it more accurately.
