  review:
    summary: >-
      High-throughput localization screen of GFP-tagged ORFeome clones expressed from a
      muscle-specific promoter; T26E3.2 fell into the "sarcoplasmic reticulum-like" pattern
      class in body wall muscle.
    action: KEEP_AS_NON_CORE
    reason: >-
      An experimental observation the curator read in full, so it is not overruled. It is an
      overexpression pattern in a single cell type, and an enzyme that cleans the
      nucleotide pool would be expected to act mainly in the cytosol and nucleus. No
      endogenous localization data exist, so this is retained as non-core rather than as
      the site of NDX-1 function.
