core_functions:
- description: >-
    Mg2+-dependent hydrolysis of the oxidised guanine nucleoside diphosphates 8-oxo-dGDP
    and 8-oxo-GDP to the monophosphates, with strong discrimination against unoxidised
    nucleotides. This can keep 8-oxo-dGDP from being phosphorylated to the mutagenic DNA
    polymerase substrate 8-oxo-dGTP.
  molecular_function:
    id: GO:0044715
    label: 8-oxo-dGDP phosphatase activity
  supported_by:
  - reference_id: PMID:21873335
    supporting_text: >-
      In this study, we identified a novel MutT homolog (NDX-1) of Caenorhabditis elegans
      that hydrolyzes 8-oxo-dGDP to 8-oxo-dGMP.
  - reference_id: file:worm/ndx-1/ndx-1-notes.md
    supporting_text: >-
      NDX-1 did not hydrolyze 2-oh-dATP or 2-oh-dADP (Table I). In addition, it did not
      hydrolyze normal dGTP, dGDP, dATP or dADP (Table I).
- description: >-
    Hydrolysis of the ribonucleotide 8-oxo-GDP to 8-oxo-GMP, as efficiently as the
    deoxy form, which may limit incorporation of 8-oxo-GTP into RNA.
  molecular_function:
    id: GO:0044716
    label: 8-oxo-GDP phosphatase activity
  supported_by:
  - reference_id: PMID:24435662
    supporting_text: >-
      As shown in Figure 1C and Table I , NDX-1 and NDX-2 showed 8-oxo-GDPase activity.
suggested_questions:
- question: >-
    Where is endogenous NDX-1 located? A muscle GFP overexpression screen gave a
    sarcoplasmic reticulum-like pattern, whereas its substrates are in the cytosolic and
    nuclear nucleotide pools.
- question: >-
    Do ndx-1 mutants accumulate 8-oxo-dGDP or 8-oxo-dGTP in the nucleotide pool, or 8-oxo-dG
    in DNA or RNA? The current in vivo data are survival under oxidative stress only.
suggested_experiments:
- description: >-
    Measure 8-oxo-(d)GDP and 8-oxo-(d)GTP in the nucleotide pool and 8-oxo-G in DNA and
    RNA by LC-MS/MS in an ndx-1 deletion mutant, alone and with ndx-2 and ndx-4 loss, under
    basal and menadione-induced oxidative stress.
- description: >-
    Make an endogenous fluorescent knock-in of ndx-1 to determine tissue expression and
    subcellular localization.
