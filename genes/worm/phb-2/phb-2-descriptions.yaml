    - rubric: specificity
      score: 4
    overall_notes: Cited developmental requirements and clearance of paternal mitochondria;
      does not name the LC3-interacting mitophagy receptor mechanism.
- source: Alliance_Imported
  text: 'phb-2 encodes the C. elegans ortholog of prohibitin PHB2; loss of phb-2 activity
    via RNAi indicates that phb-2 function is required for mitochondrial organization
    and morphology and for embryonic, germline, and somatic gonad development; PHB-2,
    along with prohibitin subunit PHB-1, forms a macromolecular complex that localizes
    to mitochondrial membranes; PHB-1 and PHB-2 are dependent upon one another for
    stability: loss of either phb-1 or phb-2 activity via RNAi results in depletion
    of both protein products.'
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00004015;class=Gene
  source_id: WB:WBGene00004015
