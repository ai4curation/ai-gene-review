    - rubric: compactness
      score: 4
    - rubric: completeness
      score: 3
    - rubric: specificity
      score: 4
    overall_notes: Correct PHB complex, mutual stability and developmental roles;
      no mitophagy receptor role.
- source: Alliance_Automated
  text: Predicted to enable protein homodimerization activity. Involved in several
    processes, including defecation; mitophagy; and regulation of oxidative phosphorylation.
    Located in mitochondrial inner membrane. Part of mitochondrial prohibitin complex.
    Is expressed in several structures, including body wall musculature; excretory
    canal; intestine; nervous system; and pharynx. Orthologous to human PHB2 (prohibitin
    2).
  source_type: automated
