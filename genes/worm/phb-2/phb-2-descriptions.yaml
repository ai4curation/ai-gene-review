gene_symbol: phb-2
organism: worm
uniprot_id: P50093
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: PHB proteins are essential during embryonic development and are required for
    somatic and germline differentiation in the larval gonad. A deficiency in PHB
    proteins results in altered mitochondrial biogenesis in body wall muscle cells
    (PubMed:12794069). Required for clearance of paternal mitochondria after embryonic
    fertilization (PubMed:28017329).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P50093
  source_id: P50093
- source: Alliance_Imported
  text: 'phb-2 encodes the C. elegans ortholog of prohibitin PHB2; loss of phb-2 activity
    via RNAi indicates that phb-2 function is required for mitochondrial organization
    and morphology and for embryonic, germline, and somatic gonad development; PHB-2,
    along with prohibitin subunit PHB-1, forms a macromolecular complex that localizes
    to mitochondrial membranes; PHB-1 and PHB-2 are dependent upon one another for
    stability: loss of either phb-1 or phb-2 activity via RNAi results in depletion
    of both protein products.'
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00004015;class=Gene
  source_id: WB:WBGene00004015
- source: Alliance_Automated
  text: Predicted to enable protein homodimerization activity. Involved in several
    processes, including defecation; mitophagy; and regulation of oxidative phosphorylation.
    Located in mitochondrial inner membrane. Part of mitochondrial prohibitin complex.
    Is expressed in several structures, including body wall musculature; excretory
    canal; intestine; nervous system; and pharynx. Orthologous to human PHB2 (prohibitin
    2).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00004015;class=Gene
  source_id: WB:WBGene00004015
