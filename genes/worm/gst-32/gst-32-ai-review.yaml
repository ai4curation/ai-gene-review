  review:
    summary: WormBase IMP from an RNAi survival screen (PMID:23593298). gst-32(RNAi) animals were
      sensitive to 3 mM arsenite (24.0% vs 90.0% survival) but not to the ROS generator juglone
      (87.8% vs 90.8% control).
    action: MODIFY
    reason: The phenotype scored for gst-32 is reduced tolerance of arsenite. The assay in the
      same screen that directly imposes reactive oxygen species (juglone, a redox cycler) gave no
      gst-32 phenotype, so the experiment does not show a role in responding to ROS. Linking
      arsenite toxicity to oxidative stress is the authors' discussion-level interpretation, based
      on what GSTs and GPXs do in general, and was not measured. The term the data support is
      response to arsenic-containing substance (GO:0046685). This is a sideways correction
      within the BP aspect, not a refinement; GO:0046685 sits under response to chemical. The
      row is still non-core, because RNAi survival data show the gene is needed for arsenite
      tolerance without showing what GST-32 does in that process.
    proposed_replacement_terms:
    - id: GO:0046685
      label: response to arsenic-containing substance
