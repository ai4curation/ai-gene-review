- id: PMID:23593298
  title: The glutathione reductase GSR-1 determines stress tolerance and longevity
    in Caenorhabditis elegans.
  findings:
  - statement: gst-32 RNAi reduces survival on arsenite (24.0% vs 90.0% in controls) without affecting
      survival on juglone.
    supporting_text: knockdown of an alpha-class related GST (gst-32), an omega-class GST (gst-44)
      and an extracellular glutathione peroxidase (C11E4.1) less profoundly affected the survival
      rate under arsenite stress
  - statement: The authors propose, without testing it, that gst-32 protects through GSH-dependent
      peroxide reduction or removal of lipid-peroxidation products.
    supporting_text: Both, the alpha-class related gst-32 and the GPX are implicated in the oxidative
      stress response by way of their GSH-dependent reduction of inorganic and organic peroxides
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text (PMC3620388) read. gst-32 (Y53F4B.37) appears only in a 67-gene RNAi
      screen (Table 2) and the discussion. The arsenite phenotype is significant; the juglone
      result is negative. The paper calls gst-32 alpha-class related, but UniProt places it in the
      sigma family by sequence. The paper is the correct source for the WB IMP, which uses a
      different stress term from the one the data support.
