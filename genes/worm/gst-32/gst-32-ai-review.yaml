description: GST-32 (ORF Y53F4B.37) is a 209-residue cytosolic-type glutathione S-transferase
  of Caenorhabditis elegans, one of the large nematode expansion of soluble GSTs. It has the canonical
  GST thioredoxin-like N-terminal (glutathione-binding) and all-alpha C-terminal (substrate-binding)
  domains, is most similar to sigma-class GSTs, and carries the N-terminal YxLxYF motif whose tyrosine
  activates glutathione in tyrosine-type GSTs; it is therefore expected to catalyse conjugation of
  reduced glutathione to electrophilic substrates, although no substrate or enzymatic activity has
  been measured for the protein itself. The only functional data come from an RNAi screen of
  glutathione-metabolism genes, in which gst-32 knockdown strongly reduced survival on arsenite but
  did not affect survival on the redox cycler juglone, implicating GST-32 in tolerance of
  arsenic-containing compounds.
