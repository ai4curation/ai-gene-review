  review:
    summary: IBA from PANTHER node PTN000170884 (cytosolic GST clade), seeded by many experimentally
      characterised GSTs, including sigma-class HPGDS (O60760) and three C. elegans GSTs.
    action: ACCEPT
    reason: GST-32 has the full cytosolic GST architecture, with GST N-terminal and C-terminal domains
      and sigma-like CDD signatures. Its N-terminus (MPTYKLTYFN) keeps the tyrosine motif of
      tyrosine-type GSTs. Nothing in the sequence points to loss of catalytic function, so the
      node placement is sound. The activity has not been assayed for GST-32 itself, and the
      substrate is unknown.
