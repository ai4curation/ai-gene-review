suggested_questions:
- question: Does GST-32 have measurable glutathione-conjugating activity, and with which substrates
    (CDNB, 4-hydroxynonenal, arsenic-glutathione species, prostaglandin H2)? Is it a sigma-class
    enzyme as the sequence suggests, or alpha-class related as Luersen et al. describe it?
- question: Does GST-32 act on arsenic itself (for example by forming arsenic-glutathione
    conjugates for export), or does it protect against arsenite through secondary oxidative
    damage? The negative juglone result argues against a general ROS-response role.
suggested_experiments:
- description: Express recombinant GST-32 and measure activity with CDNB, 4-HNE and other
    alkenals, and test arsenite-dependent glutathione conjugation.
- description: Repeat the arsenite and juglone survival assays with a gst-32 deletion allele (CRISPR)
    instead of feeding RNAi. Test whether gst-32 expression is induced by arsenite, and whether
    that induction depends on SKN-1.
