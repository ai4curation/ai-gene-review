- id: PMID:10588660
  title: Receptor-mediated endocytosis in the Caenorhabditis elegans oocyte.
  findings:
  - statement: Beta-adaptin RNAi abolishes yolk uptake and causes embryonic defects like clathrin and
      alpha-adaptin RNAi.
    supporting_text: elegans clathrin heavy chain, α-adaptin, and β-adaptin RNAi all produced similar
      defects in oocytes and embryos.
  - statement: Beta-adaptin links AP-2 to clathrin.
    supporting_text: The β-adaptin subunit is thought to connect the AP2 complex to clathrin ( Pearse
      and Robinson, 1990 ).
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached; direct RNAi of the beta-adaptin ORF Y71H2.
- id: PMID:23696751
  title: Clathrin and AP2 are required for phagocytic receptor-mediated apoptotic cell clearance in Caenorhabditis
    elegans.
  findings:
  - statement: apb-1 RNAi causes persistent, un-internalised germ-cell corpses with defective actin recruitment
      and phagosome maturation.
    supporting_text: Similarly, 12 of 25 corpses (48%) from 7 gonad arms of apb-1(RNAi) animals were found
      not to be internalized (Figure 1D).
  - statement: APB-1 binds CED-6 directly.
    supporting_text: GST-CED-6 directly interacted with 35S-labeled APA-2, APB-1 and DPY-23, and His6-tagged
      CHC-1C (Figure 4A).
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached.
- id: PMID:23482940
  title: AP2 hemicomplexes contribute independently to synaptic vesicle endocytosis.
  findings:
  - statement: The worm beta-adaptin is shared by AP-1 and AP-2 and pairs with mu2 as a stable hemicomplex.
    supporting_text: Here we demonstrate that in the absence of α-adaptin that a μ2-β hemicomplex remains,
      and that in the absence of μ2-adaptin that a α-σ2 complex remains in vivo.
  - statement: APB-1::GFP localises to nerve-ring synapses and the oocyte plasma membrane.
    supporting_text: Tagged β-adaptin and μ2-adaptin are localized to synaptic regions of the nerve ring
      (the major neuropil of the worm, Figure 6B,C) and at the plasma membrane in oocytes (Figure 6—figure
      supplement 1).
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached; not cited in GOA for apb-1 but the key in vivo study of the worm beta
      subunit.
