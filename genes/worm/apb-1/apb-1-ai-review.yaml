  original_reference_id: PMID:23482940
  review:
    summary: 'APB-1 is the beta2 subunit of the worm AP-2 complex: in alpha-adaptin (apa-2) mutants a
      stable beta/mu2 hemicomplex remains and APB-1::GFP stays at nerve-ring synapses and the oocyte plasma
      membrane, whereas in mu2 (apm-2) mutants beta is reduced; the apoptotic-cell-clearance study names
      apb-1 as the beta2 subunit alongside apa-2 and dpy-23.'
    action: NEW
    reason: GOA carries AP-1 adaptor complex (by IBA) but not AP-2 adaptor complex for apb-1, because
      the family node for the shared worm beta-adaptin is the beta1 clade. The experimental data show
      APB-1 acting as the beta subunit of AP-2 in vivo, so the AP-2 complex membership should be recorded
      alongside AP-1.
    supported_by:
    - reference_id: PMID:23482940
      supporting_text: Here we demonstrate that in the absence of α-adaptin that a μ2-β hemicomplex remains,
        and that in the absence of μ2-adaptin that a α-σ2 complex remains in vivo.
    - reference_id: PMID:23482940
      supporting_text: Tagged β-adaptin and μ2-adaptin are localized to synaptic regions of the nerve
        ring (the major neuropil of the worm, Figure 6B,C) and at the plasma membrane in oocytes (Figure
        6—figure supplement 1).
    - reference_id: PMID:23696751
      supporting_text: RNAi of apa-2, apb-1 and dpy-23, which encode the α, β2 and μ2 subunits of the
