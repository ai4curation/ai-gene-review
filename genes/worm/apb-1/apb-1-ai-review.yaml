gene_symbol: apb-1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: apb-1 encodes the single large beta-adaptin of Caenorhabditis elegans, a subunit shared between
  the AP-1 and AP-2 clathrin adaptor complexes (mammals use separate beta1 and beta2 paralogues). Beta-adaptin
  forms one half of the adaptor trunk, pairs with the mu subunit as a hemicomplex, and through its hinge
  and appendage domains recruits clathrin and accessory endocytic proteins to nascent coated pits. Within
  AP-2, APB-1 localises with mu2 to presynaptic regions of the nerve ring and to the oocyte plasma membrane
  and is required for clathrin-mediated uptake of yolk by oocytes and for clathrin- and AP-2-dependent
  engulfment and phagosome maturation of apoptotic cell corpses downstream of the CED-1/CED-6 receptor
  pathway. Within AP-1 it participates in clathrin-coated sorting at the trans-Golgi network of polarised
  epithelia such as the intestine. Depletion of apb-1 blocks yolk endocytosis and is embryonic lethal.
