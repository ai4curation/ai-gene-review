gene_symbol: tin-44
organism: worm
uniprot_id: O02161
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Essential component of the PAM complex, a complex required for the translocation
    of transit peptide-containing proteins from the inner membrane into the mitochondrial
    matrix in an ATP-dependent manner. Recruits mitochondrial HSP70 to drive protein
    translocation into the matrix using ATP as an energy source.
  source_type: curated
  url: https://www.uniprot.org/uniprot/O02161
  source_id: O02161
- source: Alliance_Automated
  text: Predicted to enable protein-folding chaperone binding activity. Predicted
    to be involved in protein import into mitochondrial matrix. Predicted to be located
    in mitochondrial inner membrane. Predicted to be part of PAM complex, Tim23 associated
    import motor. Is expressed in intestine; nervous system; pharynx; reproductive
    system; and tail. Orthologous to human TIMM44 (translocase of inner mitochondrial
    membrane 44).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00020383;class=Gene
  source_id: WB:WBGene00020383
- source: RefSeq
  text: Predicted to enable protein-folding chaperone binding activity and protein-macromolecule
    adaptor activity. Predicted to be involved in protein import into mitochondrial
    matrix. Predicted to be located in mitochondrial inner membrane. Predicted to
    be part of PAM complex, Tim23 associated import motor. Is expressed in intestine;
    nervous system; pharynx; reproductive system; and tail. Orthologous to human TIMM44
    (translocase of inner mitochondrial membrane 44). [provided by Alliance of Genome
    Resources, Jun 2026]
  source_type: automated
