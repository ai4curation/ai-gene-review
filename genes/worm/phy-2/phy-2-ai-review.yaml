knowledge_gaps:
- gap_statement: >-
    The native cuticle-collagen substrates that require PHY-2 rather than
    DPY-18/PHY-1 remain unresolved.
  boundary: >-
    phy-2 loss is phenotypically buffered by increased PHY-1/PDI-2 dimer
    assembly, and the in vivo cuticle-collagen hydroxyproline defect was
    measured in dpy-18/phy-1 mutants rather than in phy-2 single mutants.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  significance: >-
    Resolving alpha-subunit-specific substrates would clarify whether PHY-2 is
    purely redundant with DPY-18/PHY-1 or carries a distinct subset of collagen
    hydroxylation in wild-type animals.
  resolution: >-
    Quantify hydroxyproline occupancy on individual cuticle collagens from
    stage-matched wild-type, dpy-18, phy-2 and double-depleted animals.
  provenance:
  - reference_id: PMID:12036960
    supporting_text: >-
      phy-2-/- and phy-1-/- (dpy-18) mutant nematodes can compensate for its
      absence by increasing the assembly of the PHY-1/PDI-2 and PHY-2/PDI-2
      dimers, respectively.
suggested_questions:
- question: >-
    Which C. elegans cuticle collagen sites are most sensitive to loss of
    PHY-2 versus DPY-18/PHY-1?
- question: >-
    Does the C. elegans collagen P4H complex contribute separable
    procollagen-chaperone activity during cuticle assembly in addition to
    proline 4-hydroxylation?
- question: >-
    Does the excretory-cell or spermathecal phy-2 expression reported by
    WormBase reflect a direct procollagen substrate outside the main
    collagenous cuticle program?
suggested_experiments:
- description: >-
    Use stage-resolved collagen peptidomics in wild type, dpy-18, phy-2 and
    double-depleted animals to quantify hydroxyproline occupancy on individual
    cuticle collagens and identify alpha-subunit-specific substrates.
