- id: PMID:10805750
  title: >-
    Prolyl 4-hydroxylase is an essential procollagen-modifying enzyme required
    for exoskeleton formation and the maintenance of body shape in the nematode
    Caenorhabditis elegans.
  findings:
  - statement: >-
      phy-2 RNAi in a dpy-18/phy-1-null background causes postelongation
      embryonic lethality with retraction after cuticle synthesis, consistent
      with a malformed exoskeleton that cannot maintain body shape.
    supporting_text: >-
      The effect of combined phy disruption was examined further by RNAi of
      phy-2 in a dpy-18 strain. This strain was found to be a null mutant of
      phy-1 (see below). Disruption resulted in a postelongation embryonic
      lethal phenotype, the time course of which is depicted in Fig. 2 C to
      F. From the 1,250 embryos laid by 16 injected hermaphrodites, 89%
      failed to hatch (Table 1 ). Affected embryos were observed to develop
      normally through gastrulation and elongation (Fig. 2 C and D) and were
      motile throughout elongation. Distinct internal structures, including a
      discernible pharynx, were also noted. The abnormal phenotype became
      evident after cuticle synthesis (710 min into development; see also
      reference 31 ). The fully elongated embryos (threefold; Fig. 2 D) began
      to retract to a shorter, fatter form (twofold; Fig. 2 E), which
      ultimately failed to hatch. Animals then died slowly, with a
      corresponding breakdown in structural organization and the appearance of
      internal vacuoles (Fig. 2 F). This phenotype is consistent with the
      generation of a dysfunctional or poorly formed exoskeleton that fails to
      maintain worm body shape.
    reference_section_type: RESULTS
  - statement: >-
      phy-1, phy-2 and pdi-2 are expressed in cuticle-synthesizing hypodermal
      cells at times of maximal collagen synthesis.
    supporting_text: >-
      We identified genes encoding two PHYs and a single associated PDI and
      showed that all three are expressed in collagen-synthesizing ectodermal
      cells at times of maximal collagen synthesis.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full-text primary study establishing that the two conserved C. elegans
      collagen P4H alpha-subunit genes, phy-1/dpy-18 and phy-2, act
      redundantly in collagenous cuticle formation and embryonic development
      and are coexpressed with pdi-2 in cuticle-collagen-synthesizing
      hypodermis.
- id: PMID:12036960
  title: >-
    The exoskeleton collagens in Caenorhabditis elegans are modified by prolyl
    4-hydroxylases with unique combinations of subunits.
  findings:
  - statement: >-
      PHY-2 assembles with PDI-2 in vivo as a PHY-2/PDI-2 dimer and with
      PHY-1 and PDI-2 as the main mixed tetrameric collagen P4H form in
      wild-type C. elegans.
    supporting_text: >-
      We report here that three unique P4H forms are assembled from these
      polypeptides and the single beta subunit PDI-2, both in a recombinant
      expression system and in vivo, namely a PHY-1/PHY-2/(PDI-2)(2) mixed
      tetramer and PHY-1/PDI-2 and PHY-2/PDI-2 dimers.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Abstract-only primary study directly supporting PHY-2 membership in
      recombinant and native collagen P4H complexes with PDI-2 and PHY-1, and
      coexpression of all three subunits in cuticle-collagen-synthesizing
      hypodermis.
- id: PMID:12417582
  title: >-
    A hypodermally expressed prolyl 4-hydroxylase from the filarial nematode
