  label: Caenorhabditis elegans
description: >-
  PHY-2 is a secretory procollagen prolyl 4-hydroxylase alpha subunit of
  Caenorhabditis elegans. The protein has an N-terminal signal peptide, a
  C-terminal Fe(II)- and 2-oxoglutarate-dependent dioxygenase domain, and the
  conserved residues expected to coordinate iron and 2-oxoglutarate in a
  collagen P4H active site. PHY-2 assembles with the ER protein disulfide
  isomerase PDI-2 either as a PHY-2/PDI-2 dimer or with DPY-18/PHY-1 as a
  mixed PHY-1/PHY-2/(PDI-2)2 tetramer; these complexes hydroxylate prolines in
  cuticle collagen chains in collagen-synthesizing hypodermal cells, and loss
  of both phy-2 and dpy-18/phy-1 disrupts embryonic development while either
  alpha subunit can partially compensate for loss of the other.
