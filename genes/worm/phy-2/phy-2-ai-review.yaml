- term:
    id: GO:0040002
    label: collagen and cuticulin-based cuticle development
  evidence_type: IGI
  original_reference_id: PMID:10805750
  qualifier: involved_in
  supporting_entities:
  - WB:WBGene00001077
  review:
    summary: >-
      New core biological-process annotation. PHY-2 is expressed with PHY-1 and
      PDI-2 in cuticle-collagen-synthesizing ectoderm, phy-2 RNAi in the
      dpy-18/phy-1-null background caused failure of post-elongation embryos to
      hatch in a genetic-interaction assay, and native PHY-2-containing P4H
      complexes provide the direct enzyme step that hydroxylates cuticle
      procollagens.
    action: NEW
    supported_by:
    - reference_id: PMID:10805750
      supporting_text: >-
        The effect of combined phy disruption was examined further by RNAi of
        phy-2 in a dpy-18 strain. This strain was found to be a null mutant of
        phy-1 (see below). Disruption resulted in a postelongation embryonic
        lethal phenotype, the time course of which is depicted in Fig. 2 C to
        F. From the 1,250 embryos laid by 16 injected hermaphrodites, 89%
        failed to hatch (Table 1 ). Affected embryos were observed to develop
        normally through gastrulation and elongation (Fig. 2 C and D) and were
        motile throughout elongation. Distinct internal structures, including a
        discernible pharynx, were also noted. The abnormal phenotype became
        evident after cuticle synthesis (710 min into development; see also
        reference 31 ). The fully elongated embryos (threefold; Fig. 2 D) began
        to retract to a shorter, fatter form (twofold; Fig. 2 E), which
        ultimately failed to hatch. Animals then died slowly, with a
        corresponding breakdown in structural organization and the appearance
        of internal vacuoles (Fig. 2 F). This phenotype is consistent with the
        generation of a dysfunctional or poorly formed exoskeleton that fails
        to maintain worm body shape.
    - reference_id: PMID:12036960
      supporting_text: >-
        All three of the mixed tetramer-forming polypeptides PHY-1, PHY-2, and
        PDI-2 are coexpressed in the cuticle collagen-synthesizing hypodermal
        cells.
