- id: PMID:18413715
  title: Semaphorin controls epidermal morphogenesis by stimulating mRNA translation via
    eIF2alpha in Caenorhabditis elegans.
  findings:
  - statement: Semaphorin/plexin signaling lowers eIF2alpha phosphorylation to permit
      translation needed for epidermal morphogenesis; S49 phosphomimetic and
      non-phosphorylatable transgenes modulate the phenotype.
    supporting_text: In semaphorin/plexin mutants, a marked elevation in the
      phosphorylation of eIF2alpha is observed, which causes translation repression and is
      causally related to the morphological epidermal phenotype in the mutants.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
- id: PMID:22719267
  title: Protective coupling of mitochondrial function and protein synthesis via the
    eIF2α kinase GCN-2.
  findings:
  - statement: GCN-2 phosphorylates eIF2alpha in response to mitochondrial stress.
    supporting_text: A similar result was observed in the isp-1(qm150) mutant, supporting
      the role of GCN-2 in eIF2α phosphorylation in response to stress
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
- id: PMID:28292919
  title: Molecular Determinants of the Regulation of Development and Metabolism by Neuronal
    eIF2α Phosphorylation in Caenorhabditis elegans.
  findings:
  - statement: Phosphomimetic eIF2alpha(S49D) in ASI neurons enhances dauer entry.
    supporting_text: Furthermore, we show that constitutive expression of eIF2α carrying a
      phosphomimetic S49D mutation in the ASI neurons enhances dauer entry through
      bypassing the requirement for nutritionally deficient conditions.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
- id: PMID:32292896
  title: Loss of eif-2alpha phosphorylation on S49 (mammalian S51) associated with the
    integrated stress response hastens development in C. elegans.
  findings:
  - statement: Ser49 is the stress-induced phosphorylation site; S49A mutants are viable
      and develop faster.
    supporting_text: This result confirms that serine 49 is the site of phosphorylation in
      eif-2alpha in response to salt stress and is a novel finding for heat and oxidative
      stress in C. elegans.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
- id: PMID:38161330
  title: The integrated stress response protects against ER stress but is not required for
    altered translation and lifespan from dietary restriction in Caenorhabditis elegans.
  findings:
  - statement: eIF2alpha Ser49 phosphorylation is required for translational repression
      and survival under ER stress, but not for dietary-restriction effects on translation
      or lifespan.
    supporting_text: The ISR was not dispensable under ER stress conditions, as
      demonstrated by the requirement for PERK and eIF2α phosphorylation for decreased
      translation and wild type-like survival.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
