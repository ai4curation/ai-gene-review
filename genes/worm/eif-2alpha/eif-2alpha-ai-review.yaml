gene_symbol: eif-2alpha
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: >-
  eif-2alpha (Y37E3.10) encodes the alpha subunit of eukaryotic translation initiation
  factor 2 (eIF2) in Caenorhabditis elegans. It has an N-terminal S1 RNA-binding (OB-fold)
  domain, a helical middle domain and a C-terminal domain, ending in an acidic disordered
  tail. As part of the eIF2 heterotrimer, which delivers initiator Met-tRNAi to the 40S
  subunit as a GTP-bound ternary complex, it acts in the 43S/48S preinitiation complex
  during cap-dependent translation initiation. eIF2alpha is the regulatory subunit of
  eIF2. Phosphorylation of Ser49 (mammalian Ser51) by the eIF2alpha kinases PEK-1 (PERK)
  and GCN-2 blocks eIF2B-catalysed GDP/GTP exchange. This attenuates global translation in
  the integrated stress response, including the ER unfolded protein response,
  mitochondrial stress, nutrient limitation, osmotic, heat and oxidative stress.
  Non-phosphorylatable S49A mutants are viable, develop faster, and are needed for
  translational repression and wild-type survival under ER stress. Phosphorylation in
  ASI sensory neurons modulates dauer entry, and semaphorin signaling lowers eIF2alpha
  phosphorylation during epidermal morphogenesis.
