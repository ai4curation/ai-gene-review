  review:
    summary: Phylogenetic inference of translation initiation factor activity from the
      eIF2alpha family node (yeast SUI2, human EIF2S1, mouse, fly).
    action: ACCEPT
    reason: >-
      eif-2alpha is the single-copy C. elegans ortholog of eIF2alpha and lies inside the
      PTHR10602 clade, where this activity is experimentally grounded in yeast and
      mammals. The worm protein is described as the eIF2 alpha subunit, and its Ser49
      phosphorylation controls translation as in other eukaryotes (PMID:32292896,
      PMID:38161330). This is the core molecular function.
