- term:
    id: GO:0036499
    label: PERK-mediated unfolded protein response
  evidence_type: IMP
  original_reference_id: PMID:38161330
  qualifier: involved_in
  review:
    summary: The phospho-acceptor Ser49 of EIF-2alpha is required for ER-stress-induced
      translational repression and survival.
    action: NEW
    reason: >-
      Phosphorylated eIF2alpha is the effector of the PERK branch. It binds and inhibits
      eIF2B, so the product itself carries out translational attenuation and is not only
      a substrate. In C. elegans, the non-phosphorylatable eif-2alpha(rog3) S49A mutant
      lacks PEK-1-dependent translational repression under tunicamycin and does not
      survive ER stress like wild type (PMID:38161330). Comparator check: human EIF2S1
      (P05198) carries GO:0036499 involved_in by IDA in GOA, assigned by UniProt from
      PMID:31023583 and PMID:33384352 (plus a ParkinsonsUK-UCL NAS from PMID:22934019;
      QuickGO query 2026-10-09), so the term is used for the alpha subunit. The ER UPR
      module (modules/er_unfolded_protein_response.yaml) is consistent with this: its
      PERK arm models eIF2alpha as a participant annoton, with translation initiation
      factor activity (GO:0003743) and GO:0036499 as its process, alongside its role as
      the PEK-1 kinase target.
    supported_by:
    - reference_id: PMID:38161330
      supporting_text: The ISR was not dispensable under ER stress conditions, as
        demonstrated by the requirement for PERK and eIF2α phosphorylation for decreased
        translation and wild type-like survival.
    - reference_id: PMID:38161330
      supporting_text: We also included a mutant eif-2α(rog3), hitherto referred to simply
        as eif-2α, with serine 49 replaced by alanine, which cannot be phosphorylated.
