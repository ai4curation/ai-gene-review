  review:
    summary: eIF2alpha contacts the 40S subunit within the preinitiation complex.
    action: KEEP_AS_NON_CORE
    reason: >-
      In 48S structures the eIF2alpha subunit contacts the small ribosomal subunit near the
      E site, which is the basis of the human annotation propagated here. This is
      consistent with the subunit's position, but it is a structural feature of initiation
      factor activity rather than a separate function, so it is kept as non-core.
    supported_by:
