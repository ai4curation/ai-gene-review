suggested_questions:
- question: GO has no molecular-function term for the inhibitory activity of phosphorylated
    eIF2 toward eIF2B ("guanyl-nucleotide exchange factor inhibitor activity" is the
    closest). Should a phospho-eIF2alpha-specific activity be modeled in GO-CAMs of the
    PERK and GCN2 branches, or should eIF2alpha stay a kinase target only?
suggested_experiments:
- hypothesis: The residual eIF2-independent effects of GCN-2 and PEK-1 on dietary
    restriction lifespan act through other substrates or other eIF2alpha sites.
  description: Phosphoproteomics of gcn-2;pek-1 versus eif-2alpha(S49A) worms under fasting,
    and testing of additional eIF2alpha phosphosites by mutation.
