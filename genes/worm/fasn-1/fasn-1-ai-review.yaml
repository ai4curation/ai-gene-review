  review:
    summary: PAINT IBA transferring overall fatty acid synthase activity (EC 2.3.1.85) from the animal/amoebozoan
      type I FAS clade (PTN000196555; fly, mouse, rat, human, Dictyostelium donors) to C. elegans FASN-1.
    action: ACCEPT
    reason: 'FASN-1 sits squarely inside the metazoan type I FAS clade: it is the single full-length FAS
      gene in the worm genome, is orthologous to human FASN, carries the full KS-MAT-DH-ER-KR-ACP-TE domain
      order, and our alignment shows every human FASN catalytic residue conserved. In vivo, transgenic
      fasn-1 raises palmitate (C16:0), the canonical FAS product. No evidence of loss or divergence of
      the node function. This is the core function.'
