suggested_questions:
- question: Does purified C. elegans FASN-1 show the same product spectrum (mainly C16:0) as mammalian
    FASN, and can it use branched-chain primers (isobutyryl/isovaleryl-CoA) to initiate monomethyl branched-chain
    fatty acid synthesis?
- question: Is F32H2.6, the N-terminal FASN-1 paralog fragment, expressed as protein, and does it contribute
    to or interfere with FASN-1 function?
- question: Should a fatty acid synthase complex (homodimer) location be asserted for nematode FASN-1,
    given that dimerization is inferred only from orthology?
suggested_experiments:
- description: Express and purify FASN-1 (or a tagged endogenous protein by pull-down) and assay overall
    NADPH-dependent fatty acid synthesis from acetyl-CoA and malonyl-CoA with product analysis by GC-MS,
    including branched-chain primers.
- description: Introduce catalytic-site point mutations (e.g. KS Cys197Ala, TE Ser2415Ala) by CRISPR and
    test viability and fatty-acid profiles, to separate enzymatic activity from scaffold roles.
