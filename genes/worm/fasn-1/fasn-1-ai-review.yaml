  label: Caenorhabditis elegans
description: 'fasn-1 (F32H2.5; formerly emb-14) encodes the sole full-length type I fatty acid synthase
  of Caenorhabditis elegans, a 2613-residue multifunctional enzyme orthologous to human FASN. A single
  polypeptide carries ketoacyl synthase, malonyl/acetyl transferase, dehydratase, enoylreductase, ketoreductase,
  acyl carrier protein and thioesterase domains, with all catalytic residues known from human FASN conserved,
  and it synthesizes long-chain saturated fatty acids, mainly palmitate, de novo from acetyl-CoA, malonyl-CoA
  and NADPH in the cytoplasm. Its products supply membrane phospholipids, sphingolipid precursors and
  stored triglyceride. fasn-1 is essential: strong loss of function causes embryonic lethality with permeable
  eggshells or larval arrest, and weaker alleles or knockdown disrupt molting and cuticle integrity, anchor
  cell invasion and epidermal osmotic/antimicrobial peptide homeostasis. Expression is driven by SBP-1/SREBP
  and other lipogenic regulators.'
