- description: 'Multifunctional type I fatty acid synthase: catalyses de novo synthesis of long-chain
    saturated fatty acids (mainly palmitate) from acetyl-CoA, malonyl-CoA and NADPH through iterative
    KS/KR/DH/ER cycles on its integral ACP, with release by the thioesterase domain.'
  molecular_function:
