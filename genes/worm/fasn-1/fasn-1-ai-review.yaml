    supporting_text: the rescued siblings did show significantly increased levels of C16:0 (palmitic acid),
      the main product of FASN-1, and its elongated form C18:0
  - reference_id: file:worm/fasn-1/fasn-1-bioinformatics/RESULTS.md
    supporting_text: Every catalytic residue annotated on human FASN (UniProt ACT_SITE) and the ACP
  - reference_id: PMID:39007804
