gene_symbol: fasn-1
organism: worm
uniprot_id: P91871
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Fatty acid synthetase is a multifunctional enzyme that catalyzes the de novo
    biosynthesis of long-chain saturated fatty acids starting from acetyl-CoA and
    malonyl-CoA in the presence of NADPH. This multifunctional protein contains 7
    catalytic activities and a site for the binding of the prosthetic group 4'-phosphopantetheine
    of the acyl carrier protein ([ACP]) domain.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P91871
  source_id: P91871
- source: Alliance_Imported
  text: fasn-1 encodes a fatty acid synthase, orthologous to human FASN (OMIM:600212);
    CEP-1 is required for fully normal fasn-1 expression in vivo; CEP-1 drives transcription
    of luciferase reporters whose promoters contains either of two putative CEP-1
    binding sites (FAS-T1 and FAS-T2) found in the fasn-1 gene, and this activity
    is partially lost bymutation of conserved CEP-1 residues (R298 or H310); in humans,
    the CEP-1 ortholog isoforms TAp73alpha and deltaNp63alpha bind the human FASN
    gene, suggesting that FASN genes might be a conserved direct target of p53-like
    proteins in metazoa; fasn-1 transcription is moderately activated (2 to 4-fold)
    in L1 or L2 larvae starved for 12 hours, but is not so activated in later larvae
    or adults.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00009342;class=Gene
  source_id: WB:WBGene00009342
- source: Alliance_Automated
  text: Predicted to enable fatty acid synthase activity. Predicted to be involved
    in fatty acid biosynthetic process. Is expressed in excretory duct; hermaphrodite
    gonad; hypodermis; intestine; and neurons. Used to study muscular disease. Orthologous
    to human FASN (fatty acid synthase).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00009342;class=Gene
  source_id: WB:WBGene00009342
