  title: The response of Caenorhabditis elegans to hydrogen sulfide and hydrogen cyanide.
  findings:
  - statement: >-
      A forward screen for H2S-sensitive mutants identified F02H6.5 (sqrd-1); the tm3378 deletion phenocopies
      and fails to complement the screen alleles.
    supporting_text: The available deletion allele of sqrd-1 (tm3378) phenocopies and fails to complement
      these mutants
  - statement: ethe-1 mutants share the H2S-sensitivity, placing sqrd-1 in the sulfide-oxidation pathway.
    supporting_text: is sensitive to RA/H2S, which suggests that sqrd-1 confers resistance to H2S
  - statement: H2S and HCN induce sqrd-1 mRNA and protein in a hif-1-dependent manner.
    supporting_text: hif-1(ia04) mutant animals fail to increase sqrd-1 and cysl-2 mRNA levels
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text read. Main genetic characterisation of sqrd-1. The enzyme activity is inferred
      from homology, not assayed. The GFP fusion shows tissue expression but no subcellular marker.
