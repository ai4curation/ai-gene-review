- id: PMID:39178951
  title: Rhodoquinone-dependent electron transport chain is essential for Caenorhabditis elegans survival
    in hydrogen sulfide environments.
  findings:
  - statement: >-
      Homology-model docking suggests SQRD-1 binds both ubiquinone and rhodoquinone. sqrd-1(tm3378)
      is sulfide-sensitive in liquid culture. Isoforms differ in FAD-binding domains.
    supporting_text: The sqrd-1 mutant strain (sqrd-1(tm3378)) is more sensitive to sulfide than the wild-type
      N2 strain
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Full text read. The quinone-binding conclusion is in-silico (docking and MD); there is no enzyme
      assay.
