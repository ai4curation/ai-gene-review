  review:
    summary: >-
      Mitochondrion from the UniProt subcellular-location rule (ARBA). The worm protein has no direct
      localization experiment.
    action: ACCEPT
    reason: >-
      Under the root-organelle policy, the organelle claim was checked. The UniProt location is an
      ARBA rule and not evidence on its own. The claim rests on two points. SQRD-1 belongs to the
      mitochondrial SQR subfamily (PANTHER PTHR10632:SF2), whose human member SQOR is a mitochondrial
      enzyme. Its catalytic cycle reduces the quinone pool of the mitochondrial respiratory chain.
      Horsman and Miller describe SQRD-1 as mitochondrial, but they cite Budde and Roth, whose GFP
      fusion shows tissue expression without a mitochondrial marker. The C6KRP5 gene model also has
      no obvious N-terminal presequence. The organelle claim holds by orthology and function, so the
      row is kept. A sub-compartment (inner membrane) is not added, because only the homology line
      supports it.
