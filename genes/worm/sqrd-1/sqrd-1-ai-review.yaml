    action: ACCEPT
    reason: >-
      This is the core activity of the animal SQR subfamily. Human SQOR performs this reaction with
      glutathione as acceptor. Worm genetics places SQRD-1 at the entry of the ETHE-1 sulfide-oxidation
      pathway, and the quinone site is modelled to bind ubiquinone and rhodoquinone. No enzyme assay
      of the worm protein exists, so the acceptor specificity is inferred.
    supported_by:
    - reference_id: PMID:25225291
      supporting_text: >-
        Human SQR uses glutathione as an acceptor forming glutathione persulfide (GSSH), which is preferentially
        converted to thiosulfate by human rhodanese.
