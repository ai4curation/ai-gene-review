  review:
    summary: >-
      Proposed process: SQRD-1 catalyses the first step of mitochondrial sulfide oxidation. sqrd-1
      and ethe-1 mutants are both H2S-sensitive, and SQR performs that step in other animals.
    action: NEW
    reason: >-
      This passes the participation test: the gene product itself catalyses a step of the process,
      the oxidation of sulfide to a persulfide with transfer of the electrons to quinone. The term
      is not based on the mutant phenotype alone. The mechanism comes from orthology with human SQOR,
      and the worm genetics places sqrd-1 in the same pathway as the persulfide dioxygenase ethe-1.
      Comparators: fly Sqor carries GO:0019418 by ISS, and the fly sulfide-oxidation GO-CAM
      (gomodel 69d8496c00000431) types Sqor with GO:0106436, part of GO:0019418. The obsolete GO:0070221
      ("sulfide oxidation, using sulfide:quinone oxidoreductase") points to GO:0019418. Response to
      hydrogen sulfide and the downstream proteostasis phenotypes are not proposed.
    supported_by:
    - reference_id: PMID:21840852
      supporting_text: SQRD-1 catalyzes the first step in the H2S-oxidation pathway, ultimately resulting
        in production of sulfate and thiosulfate.
    - reference_id: PMID:21840852
      supporting_text: is sensitive to RA/H2S, which suggests that sqrd-1 confers resistance to H2S
    - reference_id: PMID:21840852
      supporting_text: The available deletion allele of sqrd-1 (tm3378) phenocopies and fails to complement
        these mutants
    - reference_id: PMID:25225291
      supporting_text: Organization of the human mitochondrial hydrogen sulfide oxidation pathway.
