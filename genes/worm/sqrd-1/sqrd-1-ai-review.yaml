  title: GEI-8, a homologue of vertebrate nuclear receptor corepressor NCoR/SMRT, regulates gonad development
    and neuronal functions in Caenorhabditis elegans.
  findings:
  - statement: >-
      In a gei-8 mutant background, RNAi against sqrd-1 regions that include 21U-RNA loci gave weak gonad
      migration and germline accumulation phenotypes (4.5%).
    supporting_text: resulted in changes in gonad arm migrations and an accumulation of germline cells
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Full text read. The paper is mainly about gei-8 and the paralog sqrd-2 (Y9C9A.16). The sqrd-1
