- term:
    id: GO:0070224
    label: sulfide:quinone oxidoreductase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: enables
  supporting_entities:
  - ARBA:ARBA00092407
  review:
    summary: >-
      Sulfide:quinone oxidoreductase activity (H2S + quinone giving sulfane sulfur and quinol) from
      an ARBA rule.
    action: MODIFY
    reason: >-
      The enzyme class is right, but GO:0070224 is defined by the bacterial-type reaction, which
      releases free sulfane sulfur (S0). The animal group II SQRs, to which SQRD-1 belongs, transfer
      the sulfane sulfur to an acceptor. The human ortholog uses glutathione and forms glutathione
      persulfide (EC 1.8.5.8). That reaction is GO:0106436, a sibling term that the gene already
      carries. The worm acceptor has not been measured, so the change rests on orthology. It matches
      the treatment of fly Sqor and the fly sulfide-oxidation GO-CAM.
    proposed_replacement_terms:
    - id: GO:0106436
      label: glutathione-dependent sulfide quinone oxidoreductase activity
    supported_by:
    - reference_id: PMID:25225291
      supporting_text: >-
        Human SQR uses glutathione as an acceptor forming glutathione persulfide (GSSH), which is preferentially
        converted to thiosulfate by human rhodanese.
    - reference_id: PMID:21840852
      supporting_text: >-
        The C. elegans gene sqrd-1 encodes a member of the group II SQRD enzymes, which also includes human,
        mouse, and Drosophila homologs.
