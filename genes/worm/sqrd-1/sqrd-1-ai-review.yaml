id: C6KRP5
gene_symbol: sqrd-1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: >-
  sqrd-1 (F02H6.5) encodes the Caenorhabditis elegans sulfide:quinone oxidoreductase, an FAD-dependent
  flavoprotein of the SQRD family orthologous to human SQOR. By orthology it catalyses the first step
  of mitochondrial hydrogen sulfide oxidation: H2S is oxidized, the sulfane sulfur is passed to an acceptor
  (glutathione in the human enzyme, giving S-sulfanylglutathione), and the electrons pass through FAD
  to the membrane quinone pool. Modelling suggests the worm enzyme can bind both ubiquinone and rhodoquinone.
  The persulfide is then oxidized further by the persulfide dioxygenase ETHE-1. sqrd-1 mutants cannot survive
  low concentrations of H2S, and the gene is strongly induced by HIF-1 in response to H2S or HCN. Induced
  SQRD-1 is most abundant in the hypodermis and muscle. Without SQRD-1, H2S exposure triggers
  eIF2alpha phosphorylation, translational arrest and ER and mitochondrial stress responses. The gene
  encodes several isoforms, some of which lack the N-terminal FAD-binding motif. No purified-enzyme assay
  or direct localization study of the worm protein has been reported.
