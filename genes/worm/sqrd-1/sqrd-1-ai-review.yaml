suggested_questions:
- question: >-
    What is the physiological sulfane-sulfur acceptor of worm SQRD-1 (glutathione, sulfite or another
    thiol), and does the enzyme reduce rhodoquinone as well as ubiquinone in vivo?
- question: >-
    How is SQRD-1 targeted to mitochondria? The C6KRP5 and O62133 gene models lack an obvious N-terminal
    presequence. Is there an unannotated upstream exon?
- question: >-
    Which sqrd-1 isoforms are catalytically active? Isoforms lacking the N-terminal FAD motif (e.g.
    A0A061ADY3, C6KRP6) may be non-catalytic or regulatory.
suggested_experiments:
- description: >-
    Express recombinant SQRD-1 (isoform b) and measure sulfide-dependent reduction of decylubiquinone
    and rhodoquinone analogues with glutathione, sulfite or cyanide as acceptor.
  hypothesis: SQRD-1 is a glutathione-dependent SQR that can use both benzoquinones.
- description: >-
    Co-localize an endogenously tagged SQRD-1 (CRISPR knock-in) with a mitochondrial matrix or inner-membrane
    marker in hypodermis after H2S induction, and fractionate mitochondria with ER markers as controls.
  hypothesis: SQRD-1 is a mitochondrial inner-membrane protein.
