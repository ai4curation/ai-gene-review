core_functions:
- description: >-
    Glutathione-dependent sulfide:quinone oxidoreductase activity (by orthology, with worm genetic
    support). SQRD-1 oxidizes H2S with FAD, transfers the sulfane sulfur to an acceptor and the
    electrons to the mitochondrial quinone pool (ubiquinone, and possibly rhodoquinone). This is
    the first step of mitochondrial sulfide oxidation and is needed for survival in H2S.
  molecular_function:
