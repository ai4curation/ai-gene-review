    summary: Sound PAINT IBA from Unikont node PTN000106239; retained at root mitochondrion without sub-compartment refinement on uncharacterized SF3 paralog O62202.
    action: ACCEPT
    reason: >-
      PAINT node PANTHER:PTN000106239 (Unikonts, excluding bacterial YbfF)
      soundly transfers GO:0005739 from experimentally verified mouse Abhd11
      (PMID:18614015), human ABHD11 (PMID:32792488), and yeast Imo32
      (PMID:21525245). Per projects/ORGANELLES.md, localization stays at root
      GO:0005739 without adding GO:0005759 because O62202 belongs to the
      divergent nematode-specific PTHR46118:SF3 duplicate branch with a shorter
      N-terminus and lacks experimental transit-peptide or sub-organelle data.
