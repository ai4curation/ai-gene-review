  title: Chemoproteomic, biochemical and pharmacological approaches in the discovery
    of inhibitors targeting human α/β-hydrolase domain containing 11 (ABHD11).
  findings:
  - statement: Human ABHD11 lacks mono- or diacylglycerol lipase activity and hydrolyzes short-chain carboxylic esters such as p-nitrophenyl butyrate.
