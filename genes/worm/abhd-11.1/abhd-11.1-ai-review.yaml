    reason: >-
      Propagated from Eukaryota node PANTHER:PTN002919262 solely from high-copy
      overexpression triacylglycerol changes of yeast IMO32 (PMID:28465236),
      whereas metazoan ABHD11 lacks mono- or diacylglycerol lipase activity
