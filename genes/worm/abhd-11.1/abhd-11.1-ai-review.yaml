suggested_questions:
- question: >-
    Does the shorter N-terminus of Caenorhabditis elegans abhd-11.1 (O62202)
    still direct import into the mitochondrial matrix, or has this SF3 paralog
    relocalized to another mitochondrial sub-compartment or the cytosol?
suggested_experiments:
- hypothesis: >-
    Endogenous C-terminally tagged ABHD-11.1::mNeonGreen colocalizes with
    mitochondrial markers in C. elegans and exhibits active-site Ser114
    reactivity toward fluorophosphonate serine-hydrolase probes.
  description: >-
    Image endogenous ABHD-11.1::mNeonGreen alongside MitoTracker in C. elegans
    tissues, perform sub-mitochondrial protease-protection fractionation, and
    assay purified wild-type vs Ser114Ala ABHD-11.1 with fluorophosphonate ABPP
    and p-nitrophenyl ester substrates.
  experiment_type: Endogenous fluorescent knock-in microscopy, protease-protection fractionation, and ABPP enzymology
