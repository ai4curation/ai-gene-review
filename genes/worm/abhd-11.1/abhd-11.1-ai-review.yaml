  label: Caenorhabditis elegans
description: >-
  abhd-11.1 (F32B4.6) is a 297-residue Caenorhabditis elegans mitochondrial
  alpha/beta-hydrolase belonging to the nematode-specific PTHR46118:SF3
  subfamily, sister to abhd-11.2 (PTHR46118:SF4). Despite a shorter N-terminal
  presequence region than abhd-11.2, abhd-11.1 retains the complete
  Ser114-Asp140-His267 charge-relay catalytic triad and the
  -GLFG- oxyanion-loop backbone (42-PGLFG-46 within 41-VPGLFGTKEN-50, with the
  canonical N-terminal His of -HGLFG- substituted by Pro42) supporting
  carboxylic-ester hydrolase activity, while its sub-mitochondrial compartment
  and endogenous biological substrate in C. elegans remain experimentally
  uncharacterized.
