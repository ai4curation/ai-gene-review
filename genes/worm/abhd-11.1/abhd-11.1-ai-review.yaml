      Our fluorescent activity assays designed for natural lipase substrates
      revealed no activity of hABHD11 towards mono- or diacylglycerols.
  - statement: Human ABHD11 exhibits carboxylic-ester hydrolase activity toward p-nitrophenyl butyrate.
    supporting_text: >-
      Instead, hABHD11 readily utilized para-nitrophenyl butyrate (pNPC4),
      indicating lipase/esterase-type activity that could be exploited in
      inhibitor discovery.
