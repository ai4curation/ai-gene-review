- source: UniProt
  text: Central receptor component of the translocase of the outer membrane of mitochondria
    (TOM complex) responsible for the recognition and translocation of cytosolically
    synthesized mitochondrial preproteins (By similarity). Together with the peripheral
    receptor tomm-20 functions as the transit peptide receptor and facilitates the
    movement of preproteins into the translocation pore (PubMed:21264209).
