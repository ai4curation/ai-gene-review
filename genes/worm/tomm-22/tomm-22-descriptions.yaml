descriptions:
- source: UniProt
  text: Central receptor component of the translocase of the outer membrane of mitochondria
    (TOM complex) responsible for the recognition and translocation of cytosolically
    synthesized mitochondrial preproteins (By similarity). Together with the peripheral
    receptor tomm-20 functions as the transit peptide receptor and facilitates the
    movement of preproteins into the translocation pore (PubMed:21264209).
  source_type: curated
  url: https://www.uniprot.org/uniprot/O17287
  source_id: O17287
- source: Alliance_Automated
  text: Predicted to contribute to transmembrane protein transporter activity. Predicted
    to be involved in protein import into mitochondrial matrix. Predicted to be located
    in mitochondrial outer membrane. Predicted to be part of mitochondrial outer membrane
    translocase complex. Orthologous to human TOMM22 (translocase of outer mitochondrial
    membrane 22).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00021133;class=Gene
