description: >-
  ProTrek sequence-to-text retrieval for worm hsf-1, the master transcriptional regulator of the heat
  shock response. All five top calls are stress-responsive transcriptional-activation terms, so the
  neighbourhood is right - but three of the five, including the highest-scoring one at 18.83, are
  obsolete in the current GO release, retired as GO-CAM-style composites. That is a structural hazard
  of retrieving against a fixed SwissProt sentence index: the index preserves terms the ontology has
  since dropped, and a user has no way to tell from the output which identifiers are still enterable.
  Rank 4 is the same obsolete Gram-negative-defence composite ProTrek returns as rank 1 for hlh-30
  and rank 4 for atfs-1: all three worm genes really do drive that response, so the sharing is defensible,
  but it means the model emits one sentence for three unrelated transcription factors rather than
  distinguishing them. The free-text channel returns the HSF2 comment at rank 1 and HSF1's own at
  rank 2, 0.02 units behind - a paralog slip decided by a margin far below any usable resolution.
  Assessment: 1 correct-not-novel, 1 nonparalog incorrect, 1 correct novel. Assessment: 1 correct
  novel (COR), 1 correct not novel (CNN), 1 nonparalog incorrect (NPI).
