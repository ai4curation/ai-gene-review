predictions:
- source_method: ProTrek
  source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
  source_reference_id: PMID:41039041
  predicted_term:
    id: GO:0061408
    label: positive regulation of transcription from RNA polymerase II promoter in response to heat
      stress
  predicted_term_type: GO_BP
  review:
    assessment: CNN
    confidence_score: 2
    summary: >-
      Top-ranked hit (score 18.83) and obsolete in the current GO release, where it is replaced by
      consideration of cellular response to heat and positive regulation of transcription by RNA polymerase
      II. Both of those are held for this gene in GOA with IMP support, so the composite is correct
      and already annotated in its parts. It is also an exact statement of what HSF-1 does - bind
      heat shock elements and activate chaperone transcription on heat stress - which makes its obsolescence
      the only thing standing between this call and a directly usable annotation.
    supported_by:
    - reference_id: file:worm/hsf-1/hsf-1-uniprot.txt
      supporting_text: >-
        Heat shock transcription factor hsf-1
- source_method: ProTrek
  source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
  source_reference_id: PMID:41039041
  predicted_term:
    id: GO:0006990
    label: positive regulation of transcription from RNA polymerase II promoter involved in unfolded
      protein response
  predicted_term_type: GO_BP
  review:
    assessment: NPI
    confidence_score: 0
    summary: >-
      Rank 2 (score 17.34), also obsolete. The term's definition is specific: activation of genes
      whose promoters carry the unfolded protein response element (CAGCGTG) or the ER stress-response
      element, downstream of compartment-specific UPR signalling, and its replacement candidates are
      the ER and mitochondrial UPR terms. HSF-1 governs the cytosolic proteotoxic stress response
      through heat shock elements (inverted nGAAn pentamers); it does not act on UPRE or ERSE promoters
      and is not an ER-UPR transcription factor. GOA's response to topologically incorrect protein
      (IGI, IMP) is the correct level for this gene, and the retrieved term is a compartment-specific
      claim it does not support.
    supported_by:
    - reference_id: file:worm/hsf-1/hsf-1-uniprot.txt
      supporting_text: >-
        Belongs to the HSF family.
- source_method: ProTrek
  source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
  source_reference_id: PMID:41039041
  predicted_term:
    id: GO:1900036
    label: positive regulation of cellular response to heat
  predicted_term_type: GO_BP
  review:
    assessment: COR
    confidence_score: 2
    summary: >-
      Rank 3 (score 17.29), absent from GOA and - unlike ranks 1, 2 and 4 - a live term in the current
      release. HSF-1 is the principal positive regulator of the cellular heat response, activating
      chaperone gene transcription that constitutes that response. The most directly usable of the
      five calls for a curator, and it ranks below two terms that cannot be entered at all.
    supported_by:
    - reference_id: file:worm/hsf-1/hsf-1-uniprot.txt
      supporting_text: >-
        Heat shock transcription factor hsf-1
