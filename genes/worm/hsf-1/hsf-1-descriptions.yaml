  text: hsf-1 encodes the C. elegans heat-shock transcription factor ortholog; HSF-1
    functions as a transcriptional regulator of stress-induced gene expression whose
    activity is required for heat-shock and proteotoxicity response, larval development,
    innate immunity, and regulation of adult lifespan; HSF-1 binds bovine calmodulin
    in vitro in a calcium-dependent manner.
