- source: Alliance_Automated
  text: Enables several functions, including DNA-binding transcription factor activity;
    calmodulin binding activity; and promoter-specific chromatin binding activity.
    Involved in several processes, including defense response to bacterium; positive
    regulation of catabolic process; and regulation of gene expression. Located in
    chromatin; cytoplasm; and nuclear stress granule. Part of nuclear body. Is expressed
    in several structures, including germ cell; hypodermis; intestine; neurons; and
    somatic cell. Used to study neurodegenerative disease. Human ortholog(s) of this
    gene implicated in Huntington's disease; cataract; and cataract 5 multiple types.
    Orthologous to several human genes including HSF2 (heat shock transcription factor
    2).
