gene_symbol: akt-1
organism: worm
uniprot_id: Q17941
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Acts downstream of PI3 kinase age-1 and kinase pdk-1 in the daf-2/insulin
    receptor-like transduction pathway. Phosphorylates Forkhead-related daf-16 and
    the longevity-promoting skn-1 transcription factors, which inhibits their entry
    into the nucleus and antagonizes their functions (PubMed:11381260, PubMed:11747825,
    PubMed:15068796, PubMed:18358814, PubMed:9716402). Plays a role in maintaining
    the gonadal basement membrane through its role in inhibiting daf-16 activity (PubMed:22916022).
    Has an essential role in regulating developmental arrest at the dauer stage (PubMed:10364160).
    Plays a role in immune function and pathogen resistance (PubMed:18782349). Regulates
    salt chemotaxis learning (PubMed:16950159, PubMed:30779740). Downstream of age-1
    and together with akt-2 and sgk-1, promotes cell survival during embryonic development
    (PubMed:25383666).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q17941
  source_id: Q17941
- source: Alliance_Imported
  text: akt-1 encodes an ortholog of the serine/threonine kinase Akt/PKB; akt-1 genetically
    interacts with the insulin signaling pathway and functions to regulate such processes
    as dauer larval development and salt chemotaxis learning; AKT-1 binds calmodulin
    in vitro in a calcium-dependent manner; an AKT-1::GFP fusion protein is widely
    expressed beginning in late stage embryos and continuing through adulthood; expression
    is seen in head, tail, and dorsal and ventral cord neurons, with additional expression
    seen in other cells including those of the pharynx, hypodermis, intestine, and
    spermatheca; two alleles of akt-1 (sa573 and sa700) have a Daf-c mutant phenotype
    at 27 degrees C (Hid phenotype).
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00000102;class=Gene
  source_id: WB:WBGene00000102
- source: Alliance_Automated
  text: Enables calmodulin binding activity; phosphatidylinositol-3,4,5-trisphosphate
    binding activity; and protein serine/threonine kinase activity. Involved in several
    processes, including determination of adult lifespan; insulin receptor signaling
    pathway; and intrinsic apoptotic signaling pathway in response to DNA damage by
    p53 class mediator. Located in axon; dendrite; and neuronal cell body. Part of
    protein kinase complex. Is active in cytoplasmic side of plasma membrane. Is expressed
    in several structures, including excretory canal; neurons; pharynx; rectal gland
    cell; and ventral nerve cord. Human ortholog(s) of this gene implicated in several
    diseases, including Cowden syndrome 6; Proteus syndrome; amphetamine abuse; disease
    of cellular proliferation (multiple); and glucose metabolism disease (multiple).
    Orthologous to human AKT1 (AKT serine/threonine kinase 1); AKT2 (AKT serine/threonine
    kinase 2); and AKT3 (AKT serine/threonine kinase 3).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00000102;class=Gene
