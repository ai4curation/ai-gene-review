  review:
    summary: PAINT inference that YAP-1 acts in hippo signaling.
    action: ACCEPT
    reason: 'YAP-1 is the effector of the worm Hippo pathway: WTS-1 binds it and restricts its
      nuclear entry, and the Hippo-related kinases CST-1/CST-2 repress its nuclear localisation
      in the epithelium (PMID:41746831, PMID:31358532). In the intestine WTS-1 acts without
      CST-1/2, and barrier loss activates YAP-1 independently of the pathway (PMID:32857822),
      so not every YAP-1 input is canonical; the epidermal cascade is enough for the term.'
    supported_by:
    - reference_id: PMID:41746831
      supporting_text: The duplicated Hippo-related kinases CST-1 and CST-2 repressed YAP-1
        nuclear localization in the epithelium but not the intestine, indicating that intestinal
        WTS-1 functions without CST-1/2.
    - reference_id: PMID:41746831
      supporting_text: WTS-1, YAP-1, and the TEAD-like transcription factor EGL-44 form a conserved
        core module required for larval development past the L2 stage.
