- term:
    id: GO:0050829
    label: defense response to Gram-negative bacterium
  evidence_type: IMP
  original_reference_id: PMID:32857822
  review:
    summary: 'Proposed: YAP-1, with EGL-44/TEAD, induces intestinal immune genes and is required
      for survival of Pseudomonas aeruginosa PA14 infection once the gut barrier is breached.'
    action: NEW
    reason: 'Participation, not only necessity: barrier loss during PA14 infection sends YAP-1
      into the nucleus (Hippo-independently, through PP2A), and the YAP-1/EGL-44 complex then
      drives a defined set of immune response genes whose induction is lost in yap-1 and egl-44
      mutants; the mutants survive worse and accumulate more bacteria. As the coactivator of
      that transcriptional program YAP-1 does part of the work of the defense response. Comparator
      check: C. elegans transcription factors that drive infection programs (ATF-7, ZIP-2, SKN-1,
      ELT-2, HLH-30, DAF-16, CEBP-1) carry GO:0050829, and no curator has annotated this 2020
      paper for any gene, so the gap is uncurated rather than declined. The term is not an ancestor
      or descendant of any term the gene carries.'
    supported_by:
    - reference_id: PMID:32857822
      supporting_text: Genetic inactivation of yap-1 and egl-44 significantly reduced the survival
        rate and promoted bacterial accumulation in worms after bacterial infections.
    - reference_id: PMID:32857822
      supporting_text: These results demonstrate that the EGL-44/TEAD-YAP-1/YAP complex specifically
        controls a set of immune response-related genes in C.
    - reference_id: PMID:32857822
      supporting_text: our study revealed that the activation of YAP-1/YAP was independent of
        the Hippo pathway during disruption of intestinal barrier
