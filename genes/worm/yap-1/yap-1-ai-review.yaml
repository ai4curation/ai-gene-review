          survival rate and promoted bacterial accumulation in worms after bacterial infections.
core_functions:
- description: YAP-1 is the transcriptional coactivator of the TEAD factor EGL-44 and the effector
    of the worm Hippo pathway. WTS-1/LATS (with CST-1/2 in the epidermis) binds it and keeps
    it in the cytoplasm; when released, YAP-1 enters the nucleus and with EGL-44 activates Pol
    II target genes. Restraint of this activity by intestinal WTS-1 is essential for intestinal
    polarity and larval development.
