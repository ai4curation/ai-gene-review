gene_symbol: yap-1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: yap-1 encodes the C. elegans homolog of the YAP/TAZ/Yorkie transcriptional coactivators.
  It is a divergent protein that keeps the N-terminal TEAD-binding region and one WW domain.
  YAP-1 binds the TEAD-family transcription factor EGL-44, and the YAP-1/EGL-44 complex activates
  RNA polymerase II target genes. YAP-1 is expressed in many tissues and is mostly cytoplasmic.
  The LATS kinase WTS-1 binds it directly and, with the 14-3-3 protein FTT-2, keeps it out of
  the nucleus; YAP-1 is phosphorylated at the LATS site Ser104. In the epidermis the Hippo-related
  kinases CST-1/CST-2 act upstream of WTS-1, whereas in the intestine WTS-1 acts without them,
  together with NFM-1/Merlin. In C. elegans this module does not control proliferation or organ
  size. Instead, restraint of YAP-1/EGL-44 by intestinal WTS-1 maintains apicobasal polarity
  of the growing intestine, and is essential for larval development past L2; yap-1 and egl-44
  loss suppress wts-1 mutants. YAP-1 enters the nucleus transiently after heat shock, and its
  re-export needs HSF-1 and DAF-21/HSP90. YAP-1 overexpression helps thermotolerance, while
  yap-1 loss in adults extends lifespan. When pathogens or junction loss breach the intestinal
  barrier, PP2A activates YAP-1 independently of the Hippo kinases, and YAP-1/EGL-44 induce
  immune genes that protect against Pseudomonas aeruginosa. Other reported roles are cell-autonomous
  anterior polarity of ALM touch-neuron dendrites downstream of Wnt signalling, YAP-1-dependent
  touch-neuron deformation when wts-1 is lost, pharynx size scaling, mechanotransduction-dependent
  ECM gene expression and longevity, and phagosome closure during compartmentalized cell elimination.
