- id: file:worm/yap-1/yap-1-deep-research-wormbase.md
  title: WormBase gene description for yap-1 (worm)
  findings: []
  reference_review:
    relevance: HIGH
    correctness: UNVERIFIED
    review_notes: 'WormBase curated description (uncited, undated), drawn entirely from Iwasa
      et al. 2013 (PMID:23396260). Traced in the abstract: YAP-like TEAD-binding and WW domains;
      roles in the heat response and adult lifespan; interaction with WTS-1 (confirmed as direct
      in PMID:31358532); broad expression; mainly cytoplasmic localisation regulated by WTS-1
      and FTT-2; transient nuclear accumulation after heat with HSF-1- and DAF-21-dependent
      re-export. Not traced: the physical interaction with EGL-44 and the co-activation of a
      TEAD reporter, which are in the full text only (they agree with the later EGL-44-dependent
      targets). No claim is contradicted. The text predates and omits the essential WTS-1/YAP-1/EGL-44
      module in the intestine (PMID:31358532, PMID:41746831), the immune role (PMID:32857822)
      and the neuronal roles (PMID:29853655, PMID:40178516).'
    source_defects:
    - defect_type: MISSING_STATEMENT
      resource: WORMBASE
      record: WB:WBGene00008748
      slot: MOD_provided_gene_description
      requested_change: ADD
      asserted_value: WB:WBGene00008748
      confidence: CONFIRMED
      explanation: The description stops at the 2013 characterisation. It omits that WTS-1,
        YAP-1 and EGL-44 form a module needed for larval development past L2 and for apicobasal
        polarity of the intestine, with yap-1 loss suppressing wts-1 (PMID:31358532, PMID:41746831);
        that YAP-1/EGL-44 induce immune genes protecting against Pseudomonas aeruginosa after
