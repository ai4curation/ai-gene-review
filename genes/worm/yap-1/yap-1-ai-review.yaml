  review:
    summary: Sequence-similarity inference from mouse Yap1 that YAP-1 is located at cell-cell
      junctions.
    action: MARK_AS_OVER_ANNOTATED
    reason: No worm study reports YAP-1 at cell-cell junctions. Endogenous tagged YAP-1 is cytosolic
      and nuclear (PMID:41746831); intestinal YAP-1::GFP is cytoplasmic, or nuclear and membranous
      in wts-1 mutants (PMID:31358532); and the one membrane-proximal site reported is the hemidesmosome-containing
      structures of the hypodermis after daf-2 RNAi, which are cell-matrix, not cell-cell, junctions
      (PMID:38177158). E-cadherin junction disruption activates YAP-1 (PMID:32857822), which
      says the junction signals to YAP-1, not that YAP-1 sits there. UniProt calls the protein
      highly divergent from YAP1, so the mouse location is not a safe transfer.
    supported_by:
    - reference_id: PMID:41746831
      supporting_text: Upon WTS-1 loss, endogenous YAP-1 translocated from cytosol to nucleus
        in the epithelium and intestine.
    - reference_id: PMID:38177158
      supporting_text: Upon daf-2(RNAi), YAP-1 translocated from the cytoplasm to localize at
        the hemidesmosome-containing structures between the apical and basal VAB-10/plectin/dystonin
    - reference_id: file:worm/yap-1/yap-1-uniprot.txt
      record_section: ["CC:SIMILARITY"]
      supporting_text: Belongs to the YAP1 family. Highly divergent.
