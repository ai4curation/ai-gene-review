- id: PMID:23396260
  title: Yes-associated protein homolog, YAP-1, is involved in the thermotolerance and aging
    in the nematode Caenorhabditis elegans.
  findings:
  - statement: F13E6.4 (yap-1) has YAP-like TEAD-binding and WW domains; its nuclear accumulation
      is restrained by WTS-1 and FTT-2; it affects thermotolerance and ageing.
    supporting_text: YAP-1 overexpression is beneficial for thermotolerance, whereas YAP-1 hyperactivity
      induced by wts-1 and ftt-2 knockdowns is deleterious on thermal response and yap-1 deficiency
      promotes health aging.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Founding paper (Exp Cell Res 2013); abstract-only in the cache, so the EGL-44
      and WTS-1 interaction data, the TEAD reporter assay and the S104 mutagenesis were not
      read. Source of most GOA rows and of the WormBase and UniProt texts.
- id: PMID:27930654
  title: Whole-Organism Developmental Expression Profiling Identifies RAB-28 as a Novel Ciliary
    GTPase Associated with the BBSome and Intraflagellar Transport.
  findings:
  - statement: A bbs-8-promoter YAP-1::GFP reporter localises to the ciliary axoneme of sensory
      neurons.
    supporting_text: Ciliary axoneme localisations are also observed for the GFP-tagged RPI-1,
      MAPH-9, YAP-1 and CCDC-104 translational reporters
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Full text. A localisation screen with a heterologous promoter; no ciliary
      function of YAP-1 tested.
- id: PMID:29853655
  title: Involvement of YAP-1, the Homolog of Yes-Associated Protein, in the Wnt-Mediated Neuronal
    Polarization in Caenorhabditis elegans.
  findings:
  - statement: yap-1 acts cell-autonomously for anterior ALM dendrite polarity, probably downstream
      of CWN-1/CWN-2.
    supporting_text: Cell-specific rescue experiments showed that yap-1 acts in the cell autonomous
      manner to polarize ALM dendrites.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text.
- id: PMID:31358532
  title: The Hippo Pathway Is Essential for Maintenance of Apicobasal Polarity in the Growing
    Intestine of Caenorhabditis elegans.
  findings:
  - statement: yap-1 and egl-44 mutations suppress wts-1; WTS-1 binds YAP-1 directly and blocks
      its nuclear accumulation; NFM-1 acts in the same pathway.
    supporting_text: WTS-1 bound directly to YAP-1 and inhibited its nuclear accumulation in
      intestinal cells.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text.
- id: PMID:41746831
  title: Canonical and noncanonical Hippo signaling in C. elegans.
  findings:
