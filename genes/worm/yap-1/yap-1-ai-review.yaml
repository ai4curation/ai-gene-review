- id: file:worm/yap-1/yap-1-uniprot.txt
  title: UniProtKB Q19404 (yap-1, Caenorhabditis elegans) Swiss-Prot record
  findings:
  - statement: WW domain 203-236; YAP1 family (highly divergent); experimental cytoplasmic,
      nuclear and ciliary locations; Ser104 phosphorylation.
    record_section: ["CC:SIMILARITY"]
    supporting_text: Belongs to the YAP1 family. Highly divergent.
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: The FUNCTION text ("Plays a role in thermal stress response and in aging")
      is correct (PMID:23396260) but says nothing of the transcription coactivator role, the
      EGL-44 partnership or the intestinal, immune and neuronal roles. The SUBUNIT, SUBCELLULAR
      LOCATION and DISRUPTION PHENOTYPE statements agree with the abstract or later papers where
      they could be checked; the WW-domain mapping of the EGL-44 interaction and the S104A result
      could not be checked (abstract-only source). The S104A MUTAGEN note contradicts itself.
    source_defects:
    - defect_type: MISSING_STATEMENT
      resource: UNIPROT
      record: UniProtKB:Q19404
      slot: CC:FUNCTION
      requested_change: ADD
      asserted_value: UniProtKB:Q19404
      confidence: CONFIRMED
      explanation: The FUNCTION comment gives only thermal stress and ageing. It could add that
        YAP-1 is a transcriptional coactivator acting with the TEAD factor EGL-44 downstream
        of WTS-1/LATS, that this module is required for larval development past L2 and for apicobasal
        polarity of the growing intestine (PMID:41746831, PMID:31358532), and that YAP-1/EGL-44
        induce intestinal immune genes after barrier loss (PMID:32857822).
