suggested_questions:
- question: Which YAP-1/EGL-44 target genes, when derepressed in wts-1 mutants, disrupt intestinal
    apicobasal polarity, and is tat-2 sufficient to explain the defect?
  experts:
  - C. elegans Hippo pathway researchers
  - Epithelial polarity researchers
- question: Does YAP-1 bind EGL-44 through its N-terminal TEAD-binding region, as mammalian
    YAP does, or through the WW domain as the UniProt record states?
  experts:
  - YAP/TEAD structural biologists
- question: How do the opposite lifespan effects reconcile, adult yap-1 RNAi extending lifespan
    (PMID:23396260) and YAP-1 being required for mechanotransduction-dependent longevity (PMID:38177158)?
  experts:
  - C. elegans ageing researchers
suggested_experiments:
- experiment_type: Genome-wide target mapping
  description: Profile EGL-44 and YAP-1 chromatin occupancy (targeted DamID or CUT&RUN on tagged
    endogenous alleles) in intestine and epidermis of wild-type and wts-1-depleted larvae, and
    after PA14 infection.
  hypothesis: YAP-1/EGL-44 share a core target set but add tissue- and condition-specific targets,
    including polarity genes in the intestine and immune genes after barrier loss.
- experiment_type: Domain mapping
  description: Test EGL-44 and WTS-1 binding of YAP-1 variants lacking the N-terminal TEAD-binding
    region or the WW domain, and test phosphosite S104A/S104D knock-in alleles for localisation
    and suppression of wts-1.
  hypothesis: EGL-44 binds the TEAD-binding region and WTS-1 the WW domain; S104 phosphorylation
    is needed for cytoplasmic retention.
- experiment_type: Tissue-specific requirement in immunity
  description: Deplete YAP-1 only in the intestine (auxin-inducible degradation) and measure
    immune gene induction and survival on PA14.
  hypothesis: Intestinal YAP-1 is sufficient to account for the infection phenotype.
