      score: 3
    - rubric: completeness
      score: 2
    - rubric: specificity
      score: 4
    overall_notes: 'A faithful summary of Iwasa et al. 2013 (PMID:23396260): domains, heat response,
      lifespan, WTS-1 and FTT-2 regulation of localisation and the heat-shock shuttling all
      check out. The EGL-44 reporter co-activation could not be traced (full text unavailable).
      It predates and omits the WTS-1/YAP-1/EGL-44 module needed for intestinal polarity and
      larval development (PMID:31358532, PMID:41746831), the immune role (PMID:32857822) and
      the neuronal roles.'
- source: Alliance_Automated
  text: Enables RNA polymerase II-specific DNA-binding transcription factor binding activity
    and protein kinase binding activity. Involved in establishment of cell polarity and positive
    regulation of transcription by RNA polymerase II. Located in axoneme and ciliary base. Part
    of RNA polymerase II transcription regulator complex. Is active in nucleus. Is expressed
    in several structures, including excretory system; hermaphrodite gonad; hypodermis; pharyngeal
    muscle cell; and vulva. Human ortholog(s) of this gene implicated in uveal coloboma-cleft
    lip and palate-intellectual disability. Orthologous to human WWTR1 (WW domain containing
    transcription regulator 1) and YAP1 (Yes1 associated transcriptional regulator).
  source_type: automated
