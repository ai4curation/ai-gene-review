    overall_notes: 'Correct (PMID:23396260) but minimal: it does not say that YAP-1 is a transcription
      coactivator, and omits EGL-44, the Hippo pathway, the essential intestinal role and the
      immune and neuronal roles.'
- source: Alliance_Imported
  text: yap-1 encodes a protein with sequence similarity to YAP (yes-associated protein) in
    its N-terminal TEAD-binding domain and WW domain; YAP-1 plays a role in the response to
    heat and in determination of adult life span; YAP-1 physically interacts with EGL-44, a
    transcription enhancer factor of the TEA domain (TEAD) class, and when co-expressed, the
    two proteins are able to activate a TEAD reporter; YAP-1 also physically interacts with
    WTS-1, the C. elegans LATS ortholog; YAP-1 is broadly expressed throughout development  and
    found in a number of different tissues including epithelia, hypodermis, muscles, pharynx,
    intestine, gonadal sheath cells, vulval, and the spermatheca; YAP-1 mainly localizes to
    the cytoplasm and, during specific developmental events, to the nucleus; YAP-1 cytoplasmic
    localization is regulated by WTS-1, and the 14-3-3 protein FTT-2; in response to heat, YAP-1
    transiently accumulates in the nucleus, with subsequent translocation to the cytoplasm dependent
    on the DAF-21 HSP90 and HSF-1 heat shock factor.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00008748;class=Gene
  source_id: WB:WBGene00008748
  review:
    reviewer: AI
    rubrics:
