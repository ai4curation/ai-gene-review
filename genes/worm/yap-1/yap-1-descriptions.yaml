findings:
- category: gap
  text: No source mentions that WTS-1, YAP-1 and EGL-44 form a module needed for larval development
    past L2 and for intestinal apicobasal polarity, with yap-1 loss suppressing wts-1 (PMID:31358532,
    PMID:41746831). The review covers it.
  sources:
  - UniProt
  - Alliance_Imported
  - Alliance_Automated
  - RefSeq
- category: gap
  text: No source mentions the Hippo-independent YAP-1/EGL-44 immune response to intestinal
    barrier loss (PMID:32857822); the review adds a NEW GO:0050829 row for it.
  sources:
  - UniProt
  - Alliance_Imported
  - Alliance_Automated
  - RefSeq
- category: discrepancy
  text: The automated text lists the ciliary axoneme and ciliary base, from one bbs-8-promoter
    overexpression screen (PMID:27930654), but not the cytoplasm, where WormBase, UniProt and
    endogenous tagging (PMID:41746831) place most YAP-1.
  sources:
  - Alliance_Automated
  - RefSeq
  - Alliance_Imported
- category: insight
  text: UniProt maps the EGL-44 interaction to the WW domain, whereas mammalian YAP binds TEAD
    through its N-terminal TEAD-binding region; the founding paper could not be read to check,
    so this is kept as a suggested question. Its S104A MUTAGEN note contradicts itself and is
    recorded as a SUSPECTED defect.
  sources:
  - UniProt
review:
  reviewer: AI
  rubrics:
  - rubric: overall_concordance
    score: 4
  overall_notes: 'The texts agree with each other where they overlap: a YAP-like coactivator
    that binds EGL-44 and WTS-1 and shuttles between cytoplasm and nucleus. All of them stop
    at the 2013 characterisation and miss the intestinal, immune and neuronal roles established
    since.'
