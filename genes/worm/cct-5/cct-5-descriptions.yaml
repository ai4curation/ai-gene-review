gene_symbol: cct-5
organism: worm
uniprot_id: P47209
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Molecular chaperone; assists the folding of proteins upon ATP hydrolysis.
    Known to play a role, in vitro, in the folding of actin and tubulin.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P47209
  source_id: P47209
- source: Alliance_Imported
  text: cct-5 encodes, by alternative splicing, two isoforms of a putative epsilon
    subunit of the eukaryotic cytosolic ('T complex') chaperonin, orthologous to human
    CCT5 (OMIM:610150, mutated in sensory neuropathy with spastic paraplegia); CCT-5
    represses SKN-1-dependent transcription of gst-4; in mass RNAi assays, cct-5 is
    required for normal embryonic osmotic integrity, transgene subcellular localization,
    viability (throughout the life cycle), fertility, vulval development, and locomotion.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00000380;class=Gene
  source_id: WB:WBGene00000380
- source: Alliance_Automated
  text: Predicted to enable ATP binding activity; ATP hydrolysis activity; and ATP-dependent
    protein folding chaperone. Predicted to be involved in protein folding. Part of
    chaperonin-containing T-complex. Human ortholog(s) of this gene implicated in
    autosomal recessive sensory neuropathy with spastic paraplegia. Orthologous to
    human CCT5 (chaperonin containing TCP1 subunit 5).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00000380;class=Gene
  source_id: WB:WBGene00000380
- source: RefSeq
  text: Predicted to enable unfolded protein binding activity. Predicted to be involved
    in protein folding. Part of chaperonin-containing T-complex. Human ortholog(s)
    of this gene implicated in autosomal recessive sensory neuropathy with spastic
    paraplegia. Orthologous to human CCT5 (chaperonin containing TCP1 subunit 5).
