- source: Alliance_Imported
  text: cct-5 encodes, by alternative splicing, two isoforms of a putative epsilon
    subunit of the eukaryotic cytosolic ('T complex') chaperonin, orthologous to human
    CCT5 (OMIM:610150, mutated in sensory neuropathy with spastic paraplegia); CCT-5
    represses SKN-1-dependent transcription of gst-4; in mass RNAi assays, cct-5 is
    required for normal embryonic osmotic integrity, transgene subcellular localization,
    viability (throughout the life cycle), fertility, vulval development, and locomotion.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00000380;class=Gene
