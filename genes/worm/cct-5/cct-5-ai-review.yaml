gene_symbol: cct-5
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: cct-5 encodes the epsilon (CCT5 / TCP-1-epsilon) subunit of the eukaryotic cytosolic
  chaperonin CCT/TRiC, an ATP-dependent double-ring chaperonin built from eight distinct paralogous
  subunits per ring that folds a subset of cytosolic proteins, most notably actin and tubulin.
  CCT-5 is one of the four high-ATP-affinity subunits that power the folding cycle. In C.
  elegans CCT-5 is a biochemically identified component of the purified CCT complex and is
  expressed at all life stages. It is distributed diffusely in the cytoplasm of intestinal
  cells, where its depletion causes actin aggregation, reduced tubulin, microtubule disorganization
  and defective apical microvilli; cct-5 knockdown also causes larval arrest and embryonic
  lethality. In the germline CCT-5 co-purifies with CCT-4 and with the meiotic axis protein
  HIM-3.
