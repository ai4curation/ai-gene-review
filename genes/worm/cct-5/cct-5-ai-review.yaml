suggested_questions:
- question: Which native C. elegans CCT clients depend specifically on contacts made by the
    epsilon subunit apical domain, as opposed to the complex as a whole?
suggested_experiments:
- description: Affinity purification and mass spectrometry of endogenously tagged cct-5 (or
    of assembled CCT) from staged C. elegans, combined with crosslinking, to map clients contacting
    the epsilon subunit.
  hypothesis: The epsilon subunit contributes a defined subset of client contacts, dominated
    by actin and tubulin but including WD40 and other proteins.
