core_functions:
- description: cct-5 is the epsilon subunit of the cytosolic chaperonin CCT/TRiC and one of
    its four high-ATP-affinity subunits. Within the assembled double ring it binds ATP through
    its equatorial domain, driving the conformational cycle, and presents an apical substrate-binding
    surface, contributing to the ATP-dependent folding of actin, tubulin and other cytosolic
    clients.
