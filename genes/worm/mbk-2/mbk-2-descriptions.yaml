gene_symbol: mbk-2
organism: worm
uniprot_id: Q9XTF3
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Required for oocyte-to-zygote transition in which it phosphorylates oocyte
    proteins, including mei-1, oma-1, oma-2, mex-5, and mex-6, modifying their activity
    and/or stability following meiosis (PubMed:16289132, PubMed:16338136, PubMed:17869113,
    PubMed:18199581, PubMed:18854162, PubMed:19879842). Through phosphorylation of
    P granule components including meg-1, promotes the disassembly of zygotic P granules
    in the anterior cytoplasm during zygote polarization, and thus plays a role in
    P granule distribution and segregation in early stage embryos following meiosis
    (PubMed:25535836). Functions in both spindle positioning and in the posterior
    localization of cytoplasmic determinants, including pie-1, pos-1, and pgl-1, in
    early embryos (PubMed:14697358). Involved in the asymmetric distribution of plk-1
    at the 2-cell embryonic stage (PubMed:18199581).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q9XTF3
  source_id: Q9XTF3
- source: Alliance_Imported
  text: 'mbk-2 encodes one of two C. elegans members of the DYRK (dual-specificity
    Yak1-related kinase) family of proteins that includes S. cerevisiae Yak1 and the
    Drosophila minibrain and DYRK2 kinases; MBK-2 activity is required maternally
    for the oocyte-to-egg transition that occurs during the earliest stages of embryonic
    development; specifically, MBK-2 is required for: 1) posterior localization of
    the germ plasm components PIE-1, POS-1, and PGL-1, and 2) post-fertilization degradation
    of a subset of maternal proteins including the MEI-1 and MEI-2 meiosis-specific
    katanin subunits, the OMA-1 oocyte maturation factor, and residual PIE-1 that
    remains anteriorly localized after its normal posterior segregation; MBK-2 also
    primes the MEX-5 polarity protein for subsequent phosphorylation by the polo-like
    kinase PLK-1; genetic analyses suggest that, in regulating the segregation and
    degradation of maternal proteins, MBK-2 lies downstream of the initial embryonic
    polarity cues established by the PAR and MEX proteins; MBK-2 activity depends
    upon progression through the meiotic divisions and is positively regulated by
    CDK-1 and negatively regulated by EGG-3 and EGG-4/5; MBK-2 physically interacts
    with EGG-3 and EGG-4, suggesting that regulation by EGG-3 and EGG-4 is direct;
    MBK-2 is expressed uniformly in the cortex of oocytes and newly fertilized zygotes;
    in later  stage zygotes, just prior to the second meiotic division, MBK-2 becomes
    localized to discrete cortical foci, and by the first mitosis it is found predominantly
    on centrosomes and chromosomes; MBK-2 is also associated with P granules in the
    germline blastomeres P2, P3, and P4.'
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00003150;class=Gene
  source_id: WB:WBGene00003150
- source: Alliance_Automated
  text: Enables protein serine kinase activity; protein serine/threonine kinase activity;
    and protein tyrosine kinase activity. Involved in several processes, including
    P granule disassembly; asymmetric protein localization involved in cell fate determination;
    and positive regulation of proteasomal ubiquitin-dependent protein catabolic process.
    Located in several cellular components, including P granule; condensed chromosome;
    and microtubule cytoskeleton. Is expressed in several structures, including P0;
    body wall musculature; gonad; oocyte; and pharynx. Used to study Down syndrome.
    Orthologous to several human genes including DYRK3 (dual specificity tyrosine
    phosphorylation regulated kinase 3).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00003150;class=Gene
