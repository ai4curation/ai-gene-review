descriptions:
- source: Alliance_Imported
  text: mec-14 encodes a protein with similarity to the beta-subunits of Shaker-type
    potassium channels, which are members of the aldo-keto reductase superfamily;
    MEC-14 is required for response to gentle touch by the six touch receptor neurons,
    and likely functions to regulate activity of the MEC-4 and MEC-10 degenerin channels;
    mec-14 expression is detected solely in the touch receptor neurons and is dependent
    on the MEC-3 LIM domain transcription factor; proper MEC-14 localization in the
    touch receptor neurons is dependent on MEC-12/alpha-tubulin.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00003176;class=Gene
  source_id: WB:WBGene00003176
- source: Alliance_Automated
  text: Predicted to enable oxidoreductase activity. Involved in several processes,
    including detection of mechanical stimulus involved in sensory perception of touch;
    positive regulation of detection of mechanical stimulus involved in sensory perception
    of touch; and positive regulation of mechanosensory behavior. Human ortholog(s)
    of this gene implicated in temporal lobe epilepsy. Orthologous to human KCNAB1
    (potassium voltage-gated channel subfamily A regulatory beta subunit 1).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00003176;class=Gene
  source_id: WB:WBGene00003176
