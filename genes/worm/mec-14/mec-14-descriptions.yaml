findings:
- category: discrepancy
  text: WormBase and the automated text relate MEC-14 to Shaker/Kv beta subunits (KCNAB1);
    the review says it belongs to an L-galactose dehydrogenase-like AKR family that
    has no vertebrate member.
  sources:
  - Alliance_Imported
  - Alliance_Automated
- category: gap
  text: WormBase says MEC-14 likely regulates the MEC-4/MEC-10 channel; the review
    leaves its mechanism unknown and does not assess that claim.
  sources:
  - Alliance_Imported
review:
