- term:
    id: GO:0010349
    label: L-galactose dehydrogenase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR044479
  review:
    summary: An InterPro2GO mapping from the LGALDH-like family signature (IPR044479), which takes the
      activity of plant L-galactose dehydrogenase to every family member. The family includes enzymes
      with different substrates. In the PAINT tree, curators put L-galactose dehydrogenase activity only
      on the land-plant node (PTN000920391, with the Arabidopsis LGALDH as seed). They put D-arabinose
      dehydrogenase activity only on the fungal node (PTN000920371, with ARA2 as seed). The node above
      the animal clade received only generic oxidoreductase activity. mec-14 is in the opisthokont clade,
      as the sister of yeast ARA2, so it is not inside the plant clade where the L-galactose activity
      was placed. No substrate has been tested for MEC-14.
    action: REMOVE
    reason: This is an over-propagated electronic inference, argued against on phylogenetic grounds. L-galactose
      dehydrogenase is a step in the plant ascorbate pathway. PAINT curators deliberately kept this activity
      to land plants, and the characterised member closest to mec-14 (yeast ARA2) uses a different sugar.
      Substrate specificity varies within PTHR42686:SF1, so a family signature cannot assign one. The
      generic oxidoreductase activity is kept.
    supported_by:
    - reference_id: file:worm/mec-14/mec-14-bioinformatics/RESULTS.md
      supporting_text: PAINT curators placed the substrate-specific activities (D-arabinose dehydrogenase;
        L-galactose dehydrogenase) on the fungal and land-plant nodes only, and placed only generic oxidoreductase
        activity at the node that also covers the animal clade.
    - reference_id: file:worm/mec-14/mec-14-bioinformatics/RESULTS.md
      supporting_text: In PTHR42686:SF1 the characterised members act on different substrates (L-galactose
        in plants, D-arabinose in yeast, D-threo-aldoses and pyridoxal in bacteria), so the substrate of
        mec-14 cannot be inferred from family membership.
- term:
