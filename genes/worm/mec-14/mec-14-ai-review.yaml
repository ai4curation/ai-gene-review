id: Q20127
gene_symbol: mec-14
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: mec-14 (F37C12.12) encodes a 453-residue aldo-keto reductase (AKR) superfamily protein
  of the L-galactose dehydrogenase-like family (PANTHER PTHR42686:SF1). Its closest relatives are three
  Drosophila paralogs (CG18547, CG3397, CG12224), and more distantly yeast Ara2 (an NAD+-dependent D-arabinose
  1-dehydrogenase) and plant L-galactose dehydrogenase; the family has no vertebrate member. MEC-14 retains
  the AKR catalytic tetrad (Asp132, Tyr137, Lys163, His206) and has N- and C-terminal extensions not found
  in the plant and yeast enzymes. Its substrate and enzymatic activity have not been tested. mec-14 is one
  of the touch-receptor genes defined by touch-insensitive mutants. It is needed for the response of the
  six touch receptor neurons to gentle touch, its transcript is enriched in those neurons, and its mutant
  alleles interact genetically with mutations in other mechanosensory genes (mec-4, mec-5, mec-6, mec-12,
  mec-15). This suggests that MEC-14 contributes to, or modulates, the touch-transduction apparatus by a
  mechanism that is still unknown.
