  - SGD:S000004644
  review:
    summary: A PAINT IBA from node PTN002448388, which was seeded by the experimentally characterised Arabidopsis
      L-galactose dehydrogenase and yeast Ara2. mec-14 descends from this node through the Eukaryota (PTN000199432),
      Opisthokont (PTN000199433) and Ecdysozoa (PTN000199440) nodes, and it keeps the full AKR catalytic
      tetrad, so inheriting a catalytic oxidoreductase activity is well supported. The curators placed
      only this generic term at the node that includes animals.
    action: ACCEPT
    reason: The node placement is sound and the catalytic residues are conserved. The substrate is unknown,
      so this generic term is as precise as the evidence allows. It is the only molecular function that
      can be assigned to mec-14, and it is inferred, not shown by experiment.
    supported_by:
