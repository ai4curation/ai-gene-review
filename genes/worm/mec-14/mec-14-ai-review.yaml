      supporting_text: mec-14 retains all four AKR catalytic tetrad residues (D132, Y137, K163, H206), so
        it is not predicted to be a pseudoenzyme.
    - reference_id: file:worm/mec-14/mec-14-bioinformatics/RESULTS.md
