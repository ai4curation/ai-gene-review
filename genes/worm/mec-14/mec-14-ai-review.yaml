- term:
    id: GO:0050976
    label: detection of mechanical stimulus involved in sensory perception of touch
  evidence_type: IGI
  original_reference_id: PMID:8692859
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:P24612
  review:
    summary: WormBase IGI with mec-4, the pore-forming DEG/ENaC subunit of the touch-transduction channel.
      mec-14 is required in the touch receptor neurons for the gentle-touch response, and its alleles
      interact genetically with ts alleles of transduction-complex genes. The authors interpret these
      interactions to mean that almost all touch genes contribute to the mechanosensory apparatus.
    action: ACCEPT
    reason: This is the most specific process supported by experiment in C. elegans, and WormBase curators
      made it from the full text. The genetic data do not show which molecular step MEC-14 performs. The
      annotation records its requirement for touch detection, and the exact contribution of MEC-14 remains
      an open question.
    supported_by:
    - reference_id: PMID:8692859
      supporting_text: These results are consistent with a model, supported by the known sequences of these
        genes, that almost all of the touch function genes contribute to the mechanosensory apparatus.
    - reference_id: PMID:2646709
      supporting_text: The remaining 15 genes are likely targets of mec-3 action; mutants defective in these
        genes have nonfunctioning, yet differentiated, touch cells.
