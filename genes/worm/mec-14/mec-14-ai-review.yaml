- id: file:worm/mec-14/mec-14-deep-research-wormbase.md
  title: WormBase gene description for mec-14 (worm)
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: DISPUTED
    review_notes: WormBase curated description (uncited, undated). Three claims are
      consistent with this review and PMID:8692859. These are the requirement for
      gentle-touch response by the six touch receptor neurons, expression restricted
      to (or enriched in) those neurons and dependent on MEC-3, and the AKR superfamily
      membership. The likely regulation of MEC-4 and MEC-10 degenerin channel activity
      could not be verified. The only mec-14 paper found in PubMed (PMID:8692859)
      reports genetic enhancement of temperature-sensitive mec-4, mec-5, mec-6, mec-12
      and mec-15 alleles. It shows no direct effect on channel activity. The review
      therefore leaves the mechanism unknown ("contributes to, or modulates, the
      touch-transduction apparatus"). The MEC-12-dependent localization was not checked.
      The "similarity to the beta-subunits of Shaker-type potassium channels" is
      misleading. MEC-14 shares only the AKR superfamily with Kv-beta subunits. It
      belongs to the L-galactose dehydrogenase-like family PTHR42686, which has no
      vertebrate member, whereas human KCNAB1 is in PTHR43150. A probable wrong-statement
      defect is recorded. Not used as support.
    source_defects:
    - defect_type: WRONG_STATEMENT
      resource: WORMBASE
      record: WB:WBGene00003176
      slot: MOD_provided_gene_description
      requested_change: CHECK
      asserted_value: WB:WBGene00003176
      confidence: PROBABLE
      explanation: The WormBase gene description says mec-14 "encodes a protein with
        similarity to the beta-subunits of Shaker-type potassium channels" and that
        MEC-14 "likely functions to regulate activity of the MEC-4 and MEC-10 degenerin
        channels". In PANTHER, MEC-14 (Q20127) is the only C. elegans member of the
        L-galactose dehydrogenase-like AKR family PTHR42686. Its relatives are Drosophila
        CG18547/CG3397/CG12224, yeast Ara2 and plant L-galactose dehydrogenase, and
        the family has no vertebrate member. The Kv-beta subunits (human KCNAB1) are
        a different AKR family (PTHR43150). The resemblance to Kv-beta therefore reflects
        only shared AKR superfamily membership. The channel-regulation statement rests
        on genetic interactions (PMID:8692859) and has no published direct test. Suggest
        describing MEC-14 as an aldo-keto reductase family protein of unknown substrate
        and marking the channel-regulation role as hypothetical.
      supported_by:
      - reference_id: file:worm/mec-14/mec-14-bioinformatics/RESULTS.md
        supporting_text: mec-14 is therefore not an ortholog of human KCNAB1 (Kv beta
          subunits, a different AKR family) in PANTHER.
core_functions:
- description: A predicted aldo-keto reductase that retains the catalytic tetrad. It inherits generic
    oxidoreductase activity by PAINT from a family whose characterised members act on different sugars,
    and its own substrate is unknown. This activity is inferred and has not been shown experimentally
    in C. elegans.
  molecular_function:
    id: GO:0016491
    label: oxidoreductase activity
  supported_by:
  - reference_id: file:worm/mec-14/mec-14-bioinformatics/RESULTS.md
    supporting_text: mec-14 retains all four AKR catalytic tetrad residues (D132, Y137, K163, H206), so
      it is not predicted to be a pseudoenzyme.
- description: mec-14 is required in the touch receptor neurons for the response to gentle touch, and
    it interacts genetically with genes of the touch-transduction apparatus. This is the only function
    of mec-14 established experimentally in C. elegans, and it rests on genetic evidence only.
  directly_involved_in:
  - id: GO:0050976
    label: detection of mechanical stimulus involved in sensory perception of touch
  supported_by:
  - reference_id: PMID:8692859
    supporting_text: At least 13 genes (mec-1, mec-2, mec-4-10, mec-12, mec-14, mec-15, and mec-18) are
      needed for the response to gentle touch by 6 touch receptor neurons in the nematode Caenorhabditis
      elegans.
  - reference_id: PMID:34875684
    supporting_text: Orange data points indicate genes known to be specific to (or highly enriched in)
      touch neurons based on existing single-gene analyses
knowledge_gaps:
- gap_statement: The substrate and cofactor of MEC-14, and whether its AKR catalytic activity is needed
    for touch sensitivity, are unknown. It is also unknown whether MEC-14 binds the MEC-4/MEC-10 channel
    complex directly, in the way that Kv beta AKRs bind potassium channels, or acts through a metabolite.
  gap_kind:
  - BIOLOGY
suggested_questions:
- question: Is the oxidoreductase activity of MEC-14 needed for touch sensitivity, or does it act as a
    structural or modulatory subunit of the touch-transduction complex, as Kv beta AKR subunits do for
    potassium channels?
- question: Which publication supports the WormBase statements that mec-14 expression depends on mec-3
    and that MEC-14 localisation depends on MEC-12? If they are unpublished, can they be deposited?
- question: The WormBase automated description calls mec-14 an ortholog of human KCNAB1, but PANTHER places
    mec-14 in PTHR42686, a family with no vertebrate member, and places KCNAB1 in a different AKR family.
    Should the orthology statement be revised?
suggested_experiments:
- description: Express recombinant MEC-14 and screen aldose sugars (D-arabinose, L-galactose, L-fucose,
    D-threo-aldoses) and pyridoxal with NAD+ and NADP+ for dehydrogenase activity. In parallel, rescue
    mec-14 mutants with wild-type MEC-14 and with a catalytic-tyrosine mutant (Y137F), and test touch
    sensitivity.
  experiment_type: biochemical assay and transgenic rescue
- description: Tag endogenous MEC-14 by CRISPR to find its subcellular localisation in touch receptor
    neurons, and test co-immunoprecipitation with MEC-4, MEC-2 and MEC-6.
  experiment_type: localisation and interaction mapping
