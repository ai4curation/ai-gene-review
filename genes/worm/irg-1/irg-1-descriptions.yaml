descriptions:
- source: UniProt
  text: Plays a role in innate immunity by conferring resistance to virulent strains
    of the Gram-negative bacterium P.aeruginosa via the zip-2 pathway (PubMed:20133860,
    PubMed:22520465). Can act independently of several immunity-related pathways including
    pmk-1 p38MAPK, dbl-1 TGF-beta, kgb-1 JNK and bar-1/beta-catenin pathways (PubMed:20133860,
    PubMed:22520465).
  source_type: curated
  url: https://www.uniprot.org/uniprot/O16327
  source_id: O16327
  review:
    reviewer: AI
    rubrics:
    - rubric: correctness
      score: 4
    - rubric: utility
      score: 3
    - rubric: compactness
      score: 4
    - rubric: completeness
      score: 3
    - rubric: specificity
      score: 3
    overall_notes: Correct on zip-2-dependent resistance to P. aeruginosa. 'Can act
      independently' of p38 etc. really refers to its induction.
- source: Alliance_Imported
  text: irg-1 encodes a protein containing a conserved DUF1768 domain, a domain of
    unknown function found as a stand-alone domain in bacterial and bacteriophage
    proteins as well as fused to proteins involved in riboflavin biosynthesis in bacteria
    and plants; irg-1 expression is induced in response to infection with pathogenic
    Pseudomonas aeruginosa, in a manner independent of the p38 MAPK pathway, but dependent
    upon the ZIP-2 bZIP transcription factor; irg-1 expression is also induced at
    a low level in response to cadmium exposure, in a manner that is dependent upon
    pmk-1.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00015574;class=Gene
