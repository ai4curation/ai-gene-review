suggested_questions:
- question: Does CED-7 transport phosphatidylserine itself, or does it move another lipid that drives PS-vesicle
    release? No reconstituted transport assay exists for CED-7.
- question: What does CED-7 do in the dying cell versus the engulfing cell, given that mosaic analysis shows a requirement
    in both?
suggested_experiments:
- hypothesis: CED-7 ATPase activity is required for PS-vesicle release from apoptotic cells and for CED-1 clustering.
  description: Express Walker A mutant CED-7 in ced-7 null embryos, in dying cells or engulfing cells only, and
    score sAnxV::GFP loss from corpses, extracellular PS vesicles by immuno-EM, and CED-1::GFP clustering.
  experiment_type: genetic
