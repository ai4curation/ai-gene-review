- id: PMID:9635425
  title: The C. elegans cell corpse engulfment gene ced-7 encodes a protein similar to ABC transporters.
  findings:
  - statement: Mosaic analysis revealed that ced-7 functions in both dying cells and engulfing cells during the
      engulfment process
    supporting_text: Mosaic analysis revealed that ced-7 functions in both dying cells and engulfing cells during
      the engulfment process
  - statement: the CED-7 protein has sequence similarity to ABC transporters, is broadly expressed during embryogenesis,
      and is localized to the plasma membrane
    supporting_text: the CED-7 protein has sequence similarity to ABC transporters, is broadly expressed during
      embryogenesis, and is localized to the plasma membrane
  - statement: Like CED-7, the mammalian ABC transporter ABC1 has been implicated in the engulfment of cell corpses
    supporting_text: Like CED-7, the mammalian ABC transporter ABC1 has been implicated in the engulfment of cell
      corpses
- id: PMID:11163239
  title: CED-1 is a transmembrane receptor that mediates cell corpse engulfment in C. elegans.
  findings:
  - statement: CED-1 failed to cluster around cell corpses in mutants defective in the engulfment gene ced-7
    supporting_text: CED-1 failed to cluster around cell corpses in mutants defective in the engulfment gene ced-7
  - statement: We suggest that the ABC transporter CED-7 promotes cell corpse recognition by CED-1, possibly by
      exposing a phospholipid ligand on the surfaces of cell corpses
    supporting_text: We suggest that the ABC transporter CED-7 promotes cell corpse recognition by CED-1, possibly
      by exposing a phospholipid ligand on the surfaces of cell corpses
- id: PMID:22727702
  title: CED-1, CED-7, and TTR-52 regulate surface phosphatidylserine expression on apoptotic and phagocytic cells.
  findings:
  - statement: CED-7 and TTR-52 may promote the efflux of PS from apoptotic cells through the generation of extracellular
      PS vesicles
    supporting_text: CED-7 and TTR-52 may promote the efflux of PS from apoptotic cells through the generation of
      extracellular PS vesicles
  - statement: indicating that CED-7 and TTR-52 promote the generation of extracellular PS vesicles
    supporting_text: indicating that CED-7 and TTR-52 promote the generation of extracellular PS vesicles
  - statement: Phagocytic cells also express exPS, which is dependent on the activity of CED-7, TTR-52, and TTR-52-interacting
      phagocyte receptor CED-1
    supporting_text: Phagocytic cells also express exPS, which is dependent on the activity of CED-7, TTR-52, and
      TTR-52-interacting phagocyte receptor CED-1
- id: PMID:15744306
  title: Two pathways converge at CED-10 to mediate actin rearrangement and corpse removal in C. elegans.
  findings:
  - statement: CED-1, CED-6 and CED-7 are required for actin reorganization around the apoptotic cell corpse
    supporting_text: CED-1, CED-6 and CED-7 are required for actin reorganization around the apoptotic cell corpse
- id: PMID:20126385
  title: The Wnt pathway controls cell death engulfment, spindle orientation, and migration through CED-10/Rac.
  findings:
  - statement: ced-1, ced-7, or ced-6 single mutants showed a weaker engulfment defect
    supporting_text: ced-1, ced-7, or ced-6 single mutants showed a weaker engulfment defect
  - statement: we found that the CED-1/6/7 pathway appears to play at most a minor role, if any, in this process
    supporting_text: we found that the CED-1/6/7 pathway appears to play at most a minor role, if any, in this process
  - statement: we did observe spindle defects in a small fraction of ced-1; ced-5 double mutants
    supporting_text: we did observe spindle defects in a small fraction of ced-1; ced-5 double mutants
- id: PMID:23505386
  title: Both the caspase CSP-1 and a caspase-independent pathway promote programmed cell death in parallel to the
    canonical pathway for apoptosis in Caenorhabditis elegans.
  findings:
  - statement: we used mutations (e.g., ced-1(e1735), ced-6(n2095) or ced-7(n1996)) that cause defects in cell-corpse
      engulfment and result in the persistence of many embryonic cell corpses into larval stages
    supporting_text: we used mutations (e.g., ced-1(e1735), ced-6(n2095) or ced-7(n1996)) that cause defects in
      cell-corpse engulfment and result in the persistence of many embryonic cell corpses into larval stages
- id: PMID:24225442
  title: Caspase-mediated activation of Caenorhabditis elegans CED-8 promotes apoptosis and phosphatidylserine externalization.
  findings:
  - statement: only mildly enhanced the corpse engulfment defect of the ced-1, ced-6, ced-7 or ttr-52 mutants at
      the L1 larval stage
    supporting_text: only mildly enhanced the corpse engulfment defect of the ced-1, ced-6, ced-7 or ttr-52 mutants
      at the L1 larval stage
- id: PMID:11449278
  title: Phagocytosis promotes programmed cell death in C. elegans.
  findings:
  - statement: mutations in engulfment genes enhance the frequency of this cell survival
    supporting_text: mutations in engulfment genes enhance the frequency of this cell survival
  - statement: requires the genes ced-1, ced-2, ced-5, ced-6, ced-7, ced-10 and ced-12
    supporting_text: requires the genes ced-1, ced-2, ced-5, ced-6, ced-7, ced-10 and ced-12
- id: PMID:11449279
  title: Engulfment genes cooperate with ced-3 to promote cell death in Caenorhabditis elegans.
  findings:
  - statement: can also function to actively kill cells
    supporting_text: can also function to actively kill cells
- id: PMID:17205124
  title: 'Cooperation between engulfment receptors: the case of ABCA1 and MEGF10.'
  findings:
  - statement: MEGF10 function can be modulated by the ATP binding cassette transporter ABCA1, ortholog to CED-7
    supporting_text: MEGF10 function can be modulated by the ATP binding cassette transporter ABCA1, ortholog to
      CED-7
