  review:
    summary: Lipid carrier activity, by phylogenetic inference from ABCA-family members.
    action: MARK_AS_OVER_ANNOTATED
    reason: Lipid carrier activity is defined as directly binding a lipid and delivering it to an acceptor or location,
      which describes soluble lipid-transfer proteins. ABCA transporters move lipids across or out of the membrane
      by ATP-coupled transport, which the ATPase-coupled and ABC-type transporter terms already capture. For CED-7
      there is genetic evidence for PS efflux but no data on lipid binding or delivery by the protein itself.
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - ROLE_CONFLATION
      source_entities:
      - source_id: PANTHER:PTN000442469
        source_label: PTN000442469
        source_status: UNRESOLVED
        comment: ABCA node whose seeds are mammalian ABCA transporters. The question is whether lipid carrier activity
          (bind and deliver) fits ATP-driven lipid efflux by ABCA transporters at all; node placement for CED-7
          is not disputed.
    supported_by:
    - reference_id: PMID:22727702
      supporting_text: CED-7 and TTR-52 may promote the efflux of PS from apoptotic cells through the generation
        of extracellular PS vesicles
