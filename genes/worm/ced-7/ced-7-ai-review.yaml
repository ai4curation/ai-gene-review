    label: establishment of mitotic spindle orientation
  evidence_type: IGI
  original_reference_id: PMID:20126385
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:A0A0K3AWM6
  review:
    summary: Establishment of mitotic spindle orientation (IGI with mom-5, Cabello et al. 2010).
    action: REMOVE
    reason: Full text read. The spindle orientation phenotypes in this paper depend on MOM-5/Frizzled, GSK-3, beta-catenins
      and CED-10. The authors state that apart from ced-10 none of the other ced genes showed a strong defect. ced-7
      is not in the one genotype with rare defects (ced-1; ced-5 double mutants), so there is no positive evidence
      for ced-7 in this process; the paper's own statement contradicts it. Same action as for ced-6 and ced-12; ced-1
      and ced-5, which are in that double mutant, are marked over-annotated instead.
    supported_by:
    - reference_id: PMID:20126385
      supporting_text: neither apr-1 nor any of the other ced genes showed a strong defect, suggesting that the link
        to CED-10 may not occur through CED-2/5/12 as is the case for engulfment and DTC migration
