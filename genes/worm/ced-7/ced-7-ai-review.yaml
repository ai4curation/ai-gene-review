id: P34358
gene_symbol: ced-7
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: CED-7 is a C. elegans ABCA-family ATP-binding cassette transporter, the orthologue of mammalian ABCA1.
  It has two homologous halves, each with a membrane-spanning domain and an ATP-binding cassette, and it localizes
  to the plasma membrane. It is broadly expressed in embryos, and mosaic analysis shows it acts in both dying and
  engulfing cells during corpse engulfment. CED-7 belongs to the CED-1/CED-6/CED-7 engulfment pathway. It is required
  for the CED-1 receptor to cluster around cell corpses and for actin reorganization around them. With the secreted
  phosphatidylserine (PS)-binding bridging protein TTR-52, it promotes the release of PS-containing extracellular
  vesicles from apoptotic cells. Those vesicles lead to PS exposure on neighbouring engulfing cells, which depends
  on CED-1 and helps corpse clearance. Like other engulfment genes, ced-7 helps engulfing cells promote the death
  of cells that receive weak death signals.
