core_functions:
- description: ABCA-family ATP-binding cassette transporter at the plasma membrane of dying and engulfing cells.
    With TTR-52 it promotes phosphatidylserine efflux from apoptotic cells into extracellular vesicles, and it is
    needed for CED-1 to recognize and cluster around corpses.
  molecular_function:
    id: GO:0140359
    label: ABC-type transporter activity
