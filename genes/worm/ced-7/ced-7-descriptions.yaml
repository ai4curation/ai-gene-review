    - rubric: completeness
      score: 4
    - rubric: specificity
      score: 4
    overall_notes: 'Correct and specific: ABCA transporter needed in both dying and
      engulfing cells, upstream of CED-10, acting with CED-1/CED-6 in parallel to
      CED-2/5/12. Gives expression detail.'
- source: Alliance_Automated
  text: Predicted to enable ATPase-coupled transmembrane transporter activity and
