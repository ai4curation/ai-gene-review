- source: Alliance_Imported
  text: ced-7 encodes an ATP binding cassette (ABC) transporter that is a member of
    the ABCA subfamily of transporter proteins; CED-7 activity is required in both
    apoptotic and phagocytic cells for engulfment of apoptotic cell corpses; in regulating
    apoptotic cell clearance, CED-7 functions upstream of CED-10/Rac, and together
    with CED-1 and CED-6, to mediate actin reorganization around the apoptotic cell
    corpse in the phagocytic cell; in regulating engulfment with CED-1 and CED-6,
    CED-7 acts in a pathway parallel to that of CED-2, CED-5, and CED-12; CED-7 localizes
    to the plasma membrane of many embryonic cells, but in larvae and adults is found
    in the amphid and phasmid sheath cells and the pharyngeal-intestinal valve; further,
    CED-7 is expressed in the Z2 and Z3 germline precursor cells and in the germline,
    except for sperm.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00000421;class=Gene
  source_id: WB:WBGene00000421
  review:
    reviewer: AI
    rubrics:
