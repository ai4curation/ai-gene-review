    supporting_text: In wild type, LMP-1::GFP largely associated with conventional lysosomes
  - reference_id: PMID:22225878
    supporting_text: positive for membrane localization of CDF-2, LMP-1 and PGP-2
  - reference_id: PMID:27810910
    supporting_text: These data suggest that the increased level of LMP-1 and LMP-2 compensates
