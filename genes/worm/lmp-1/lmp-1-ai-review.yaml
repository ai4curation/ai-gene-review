id: Q11117
gene_symbol: lmp-1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: >-
  LMP-1 is one of two Caenorhabditis elegans LAMP-family (lysosome-associated membrane
  glycoprotein) proteins. It is a 237-residue single-pass type I membrane glycoprotein with
  a heavily N-glycosylated luminal domain, a single transmembrane helix and a short
  cytoplasmic tail ending in a GYXX(phi) lysosomal targeting motif. LMP-1 resides mainly in
  the limiting membrane of lysosomes and late endosomes, and in intestinal cells it also
  marks gut granules (lysosome-related organelles), nonacidic late lysosomes and
  phagolysosomes; a minor pool is found at the basolateral plasma membrane. Its delivery to
  gut granules depends on AP-3. No molecular activity has been demonstrated. lmp-1 deletion
  mutants are viable but have an altered population of intestinal granules, and raising
  LMP-1 (with LMP-2) levels protects lysosomal membrane integrity in scav-3 mutants, which
  fits the protective luminal glycocalyx role proposed for mammalian LAMPs. LMP-1 fusions are
  widely used as lysosome markers in C. elegans.
