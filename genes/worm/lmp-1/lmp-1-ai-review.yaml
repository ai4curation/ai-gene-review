core_functions:
- description: >-
    Abundant N-glycosylated type I integral membrane protein of the limiting membrane of
    lysosomes, late endosomes and intestinal lysosome-related organelles (gut granules),
    delivered there by a C-terminal tyrosine motif and AP-3; contributes, with LMP-2, to
    lysosomal membrane integrity. No specific molecular activity has been established.
  locations:
