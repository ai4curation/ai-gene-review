  review:
    summary: Process seeded by vertebrate LAMP1/LAMP2-specific roles; not shown for LMP-1.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The seeds are LAMP1 (perforin delivery to NK-cell lytic granules) and LAMP2 (LAMP2A as the
      receptor/translocation component of chaperone-mediated autophagy). Both are
      vertebrate- or cell-type-specific roles; nematodes lack NK cells and the LAMP2A
      splice form, and no study shows LMP-1 directing any protein to an organelle. The only
      LMP-1 functional data are a granule-population phenotype and suppression of lysosomal
      membrane damage on overexpression, neither of which shows LMP-1 performing protein
      targeting. Placing this process at the family root over-propagates it to the nematode
      lineage.
    supported_by:
    - reference_id: PMID:10862717
      supporting_text: the absence of LMP-1 leads to an alteration in intestinal granule
        populations, with apparent loss of one type of granule
    - reference_id: PMID:27810910
      supporting_text: These data suggest that the increased level of LMP-1 and LMP-2 compensates
        for the loss of SCAV-3 to maintain lysosome membrane integrity.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - CONTEXT_OR_TISSUE_MISMATCH
      - LINEAGE_OR_TAXON_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN000897064
        source_label: PTHR11506 LAMP family root
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Seeded only by mammalian LAMP1 and LAMP2 (human, mouse, rat). The underlying
          roles (NK-cell lytic granule cargo delivery; LAMP2A-dependent chaperone-mediated
          autophagy) are not documented outside vertebrates, and LMP-1 is not among the seeds
          for this term.
