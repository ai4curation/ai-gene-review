suggested_questions:
- question: Does LMP-1 have a specific molecular activity comparable to human LAMP1
    inhibition of the TMEM175 proton channel, or is its role purely as a luminal glycocalyx
    component protecting the lysosomal membrane?
- question: Which granule type is lost in lmp-1(nr2045) intestine, and is the defect one of
    biogenesis or of maintenance of a lysosome-related organelle subpopulation?
suggested_experiments:
- description: Test whether LMP-1 (alone and with LMP-2) binds and modulates a C. elegans
    TMEM175-family lysosomal channel (if one is present), and measure lysosomal pH and proton leak in lmp-1; lmp-2 double mutants.
- description: Measure lysosomal membrane permeabilization (galectin puncta) and hydrolase
    leakage in lmp-1; lmp-2 double mutants under lysosomal stress to test the glycocalyx
    protection model.
