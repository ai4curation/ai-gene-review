descriptions:
- source: Alliance_Imported
  text: lmp-1 encodes a protein with similarity to vertebrate lysosome-associated
    membrane proteins CD68, and appears to be the only protein in C. elegans that
    has a GYXX (phi) vertebrate lysosomal targeting sequence at its carboxy terminus;
    LMP-1 is widely expressed in the early embryo, with later expression seen in the
    intestine, coelomocytes, and neurons; LMP-1 localizes to lysosomes and is recruited
    to phagosomes upon lysosomal fusion.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00003053;class=Gene
  source_id: WB:WBGene00003053
- source: Alliance_Automated
  text: Predicted to be involved in establishment of protein localization to organelle.
    Located in cytoplasmic vesicle and lysosomal membrane. Is expressed in coelomocyte;
    germ line; intestinal cell; intestine; and pharynx. Orthologous to human LAMP1
    (lysosome associated membrane protein 1).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00003053;class=Gene
