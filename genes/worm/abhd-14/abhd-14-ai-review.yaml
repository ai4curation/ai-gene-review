description: >-
  Uncharacterized Caenorhabditis elegans alpha/beta-hydrolase domain-containing
  protein (246 aa; ORF Y55F3AM.10) belonging to the invertebrate/divergent
  ABHD14 family clade (PANTHER:PTHR46197:SF3). Predicted to be a soluble
  cytoplasmic protein lacking transmembrane helices or signal peptides, ABHD-14
  retains a putative Ser145-Asp193-His220 charge-relay triad within its
  alpha/beta-hydrolase fold (residues 73-169) but replaces the canonical
  vertebrate ABHD14 SxSxS nucleophilic-elbow motif (SPSLS) with CASMA
  (Cys143-Ala144-Ser145-Met146-Ala147); neither its enzymatic activity nor its
  physiological role in nematodes has been experimentally determined.
