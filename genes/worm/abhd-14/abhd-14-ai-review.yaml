- id: PMID:31478652
  title: Functional Annotation of ABHD14B, an Orphan Serine Hydrolase Enzyme.
  findings:
  - statement: >-
      Mammalian ABHD14B is a soluble cytosolic and nuclear CoA-dependent
      protein-lysine deacetylase, providing the experimental orthologous basis
      for cytoplasmic localization in PTHR46197 while its specialized
      vertebrate SF2 KDAC mechanism cannot be assumed for divergent SF3 member
      abhd-14 without biochemical testing.
    supporting_text: >-
      Second, we report a selective anti-ABHD14B antibody, and show that this
      enzyme is present throughout the cell (nucleus and cytosol) (Figure 5),
      and is mostly expressed in metabolically rich tissues (kidney, liver)
      (Figure 4).
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Experimental characterization of human/mouse SF2 homolog ABHD14B seeding
      PTN002475422.
- id: PMID:37974539
  title: Identification of sequence determinants for the ABHD14 enzymes.
  findings:
  - statement: >-
      Defines sequence determinants distinguishing ABHD14 subfamilies across
      organisms and warns against automated cross-assignment across divergent
      ABHD14 clades.
    supporting_text: >-
      Given 
      their high sequence similarity, automated databases often wrongly assign ABHD14A 
      and ABHD14B as the same enzyme, and therefore, annotating functions to them in 
      various organisms has been problematic.
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Directly cautions against unverified automated functional propagation
      across ABHD14 homologs in non-mammalian organisms.
