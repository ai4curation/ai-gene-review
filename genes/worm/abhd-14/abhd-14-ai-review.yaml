knowledge_gaps:
- gap_statement: >-
    The catalytic activity and physiological substrate of C. elegans ABHD-14
    (PANTHER:PTHR46197:SF3) are completely untested, including whether its
    divergent CASMA nucleophilic elbow catalyzes hydrolysis, CoA-dependent acyl
    transfer, or another alpha/beta-hydrolase reaction.
  boundary: >-
    Q9N366 preserves an alpha/beta-hydrolase domain (PF12697, residues 73-169)
    and putative Ser145-Asp193-His220 catalytic triad, but diverges from
    vertebrate SF2 (ABHD14B) and SF1 (ABHD14A) by substituting the conserved
    SPSLS nucleophile motif with CASMA and carrying an uncharacterized 45-aa
    N-terminal extension; WormBase carries no curated functional description.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: >-
    Prevents unwarranted orthology projection of mammalian SF2 CoA-dependent
    protein-lysine deacetylase activity (or Reactome R-CEL-156584 cytosolic
    sulfonation) onto invertebrate SF3 homologs.
  resolution: >-
    Express recombinant C. elegans ABHD-14 (WT and S145A) and test activity
    by fluorophosphonate ABPP, esterase profiling, and CoA-dependent peptide
    lysine deacetylase assays alongside human ABHD14B.
  provenance:
  - reference_id: file:worm/abhd-14/abhd-14-notes.md
    supporting_text: >-
      Carries Pfam `PF12697` (`AB hydrolase-1`, residues 73–169) and retains a putative alpha/beta-hydrolase catalytic triad at `Ser145`, `Asp193`, and `His220`, **but** its nucleophilic elbow sequence (`CASMAAQY`, residues 143–150) substitutes the characteristic vertebrate ABHD14A/ABHD14B `SxSxS` (`SPSLS`) motif with `CASMA` (`Cys143-Ala144-Ser145-Met146-Ala147`)!
- gap_statement: >-
    No biological process or mutant/RNAi phenotype has been established for
    C. elegans abhd-14 in vivo.
  boundary: >-
    Transcriptomic resources (Bgee) detect abhd-14 expression in pharyngeal
    muscle and several other C. elegans cell types, and WormBase has no
    hand-written curated gene description.
  gap_kind:
  - BIOLOGY
  dark_aspect: BP_DARK
  status: OPEN
  significance: >-
    Defines whether invertebrate SF3 ABHD-14 regulates organismal energy/glucose
    homeostasis analogously to mammalian hepatic ABHD14B or acts in a distinct
    nematode metabolic pathway.
  resolution: >-
    Generate a CRISPR/Cas9 abhd-14 null allele in C. elegans and assay
    starvation survival, ATP levels, lipid stores, and pharyngeal pumping.
  provenance:
  - reference_id: file:worm/abhd-14/abhd-14-notes.md
    supporting_text: >-
      Running `ai-gene-review mod-description-deep-research worm abhd-14` returned `no_curated: 1` (WormBase carries no hand-written curated `concise_description` for `abhd-14`, only Alliance automated ontology text).
suggested_questions:
- question: >-
    Does the Cys143-Ala144-Ser145-Met146-Ala147 (CASMA) nucleophilic elbow of
    C. elegans ABHD-14 support CoA-dependent lysine deacetylation like
    mammalian ABHD14B (SPSLS), or does invertebrate SF3 catalyze a hydrolytic
    esterase reaction?
- question: >-
    What is the role of the 45-residue N-terminal extension of C. elegans
    ABHD-14, and where does endogenous ABHD-14 localize within pharyngeal
    muscle and intestinal cells?
suggested_experiments:
- hypothesis: >-
    C. elegans ABHD-14 is a catalytically active cytoplasmic serine hydrolase
    or acyltransferase with substrate specificity shaped by its CASMA
    nucleophilic elbow.
  description: >-
    Purify recombinant WT and S145A C. elegans ABHD-14, perform FP-rhodamine
    activity-based protein profiling, and compare p-nitrophenyl ester hydrolysis
    with and without CoA as well as acetyl-lysine peptide deacetylation against
    human ABHD14B.
  experiment_type: enzymology and activity-based protein profiling
- hypothesis: >-
    Loss of abhd-14 alters metabolic resilience during fasting/starvation in
    C. elegans.
  description: >-
    Generate a CRISPR deletion and endogenous mNeonGreen knock-in at the
    Y55F3AM.10 locus to determine subcellular localization and measure L1/adult
    starvation survival, oxygen consumption, and whole-worm acetylome changes.
  experiment_type: nematode genetics, live imaging, and metabolomics
