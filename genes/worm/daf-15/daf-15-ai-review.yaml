id: G5EEV7
gene_symbol: daf-15
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: >-
  daf-15 encodes the Caenorhabditis elegans ortholog of Raptor (regulatory-associated protein of
  mTOR), a large (1782 aa) non-catalytic scaffold built from an N-terminal Raptor N-terminal
  CASPase-like (RNC) domain, a central ARM/HEAT-like repeat region and a C-terminal WD40
  propeller. By orthology with mammalian and yeast Raptor/Kog1 it is the defining subunit of TOR
  complex 1 (TORC1), binding the LET-363/TOR kinase and presenting TORC1 substrates such as
  RSKS-1/S6K and the translational repressor pathway, and docking the complex on the lysosomal
  Rag GTPase platform; a DAF-15 fusion carrying the RAP-1 C-terminal lysosome-targeting signal
  constitutively activates TORC1 signaling in vivo. DAF-15/TORC1 signaling couples nutrient
  availability to postembryonic growth: daf-15 loss-of-function causes a non-recoverable
  dauer-like larval arrest, intestinal fat accumulation and small nucleoli, reduced TORC1 activity
  limits the germline progenitor pool, and partial reduction extends adult lifespan in a
  pha-4/FoxA-dependent manner. daf-15 transcription is repressed by DAF-16/FOXO, providing a point
  of convergence between insulin/IGF-1 signaling and nutrient sensing.
existing_annotations:
- term:
    id: GO:0008340
    label: determination of adult lifespan
  evidence_type: IGI
  original_reference_id: PMID:18804378
  qualifier: involved_in
  supporting_entities:
  - WB:WBGene00002583
  review:
    summary: >-
      Combined let-363(RNAi); daf-15(RNAi) from L4 extends adult lifespan, and this extension
      depends on pha-4/FoxA (WBGene00002583, the IGI partner). Jia et al. 2004 independently report
      that raptor mutations extend lifespan. The term is a genuine organismal output of DAF-15/TORC1
      signaling but is downstream of the core signaling activity, so it is kept as non-core.
    action: KEEP_AS_NON_CORE
    reason: >-
      Well supported genetic evidence (full text read) that reduced DAF-15/TORC1 activity extends
      lifespan via pha-4; lifespan is an organismal consequence of TORC1 signaling rather than the
      molecular role of Raptor.
    supported_by:
    - reference_id: PMID:18804378
      supporting_text: Reduction of let-363 and daf-15 together led to a statistically-significant
        increase in lifespan in 3/4 experiments
    - reference_id: PMID:18804378
      supporting_text: Strikingly, pha-4(ts); let-363(RNAi); daf-15(RNAi) animals had shorter life
        spans than pha-4(ts) alone.
    - reference_id: PMID:15253933
      supporting_text: raptor mutations extend adult life span
- term:
    id: GO:0031929
    label: TOR signaling
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR004083
  review:
    summary: >-
      InterPro2GO mapping from the Raptor family signature (IPR004083). The claim is correct, but
      Raptor is the defining subunit of TORC1 (it is absent from TORC2, which uses Rictor/RICT-1),
      so the specific child term TORC1 signaling (GO:0038202) is warranted. Worm evidence: DAF-15
      is listed among the C. elegans TORC1 components, and a DAF-15::RAP-1(22) fusion
      hyperactivates TORC1 signaling in vivo.
    action: MODIFY
    reason: >-
      Correct but general. Raptor-containing signaling is by definition TORC1 signaling (GO:0038202
      definition names Raptor), so refine to that is_a child.
    proposed_replacement_terms:
    - id: GO:0038202
      label: TORC1 signaling
    supported_by:
    - reference_id: file:worm/daf-15/daf-15-uniprot.txt
      record_section: ["DR:InterPro"]
      supporting_text: IPR004083; Raptor
    - reference_id: PMID:18804378
      supporting_text: C. elegans possesses homologues of TOR complex 1 (TORC1) components, including
        TOR kinase (let-363 [21]), Raptor (daf-15; [15]) and LST8
    - reference_id: PMID:23705068
      supporting_text: This indicates that hyperactivation of TORC1 was sufficient to support L1 growth
        in mmBCFA-depleted animals.
- term:
    id: GO:0031931
    label: TORC1 complex
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: part_of
  supporting_entities:
  - InterPro:IPR004083
  review:
    summary: >-
      InterPro2GO mapping from the Raptor family signature. Raptor is the defining subunit of
      TORC1 in all eukaryotes examined, and DAF-15 carries the full RNC/ARM/WD40 architecture
      of Raptor. Accepted as the core complex membership.
    action: ACCEPT
    reason: >-
      Family membership (IPR004083 Raptor, PANTHER PTHR12848) plus worm genetic and transgenic
      evidence that DAF-15 acts as a TORC1 component.
    supported_by:
    - reference_id: file:worm/daf-15/daf-15-uniprot.txt
      record_section: ["DR:InterPro"]
      supporting_text: IPR004083; Raptor
    - reference_id: PMID:18804378
      supporting_text: C. elegans possesses homologues of TOR complex 1 (TORC1) components, including
        TOR kinase (let-363 [21]), Raptor (daf-15; [15]) and LST8
- term:
    id: GO:0031931
    label: TORC1 complex
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: part_of
  supporting_entities:
  - UniProtKB:Q8N122
  review:
    summary: >-
      WormBase sequence-similarity transfer from human RPTOR (Q8N122), whose TORC1 membership is
      experimentally established. Consistent with the IEA row; the orthology is unambiguous
      (single Raptor gene in C. elegans, same domain architecture).
    action: ACCEPT
    reason: >-
      Sound orthology transfer for a defining complex subunit; in vivo DAF-15::RAP-1(22) fusion
      behaves as a TORC1 activator, as Raptor-Rap1 fusions do in mammalian cells.
    supported_by:
    - reference_id: file:worm/daf-15/daf-15-deep-research-manual.md
      supporting_text: Ortholog of human RPTOR (Q8N122), Drosophila raptor, yeast KOG1.
    - reference_id: PMID:23705068
      supporting_text: fusion of one of the TOR binding partners, Raptor, with a C-terminal lysosome
        localization signal from Rap-1 can localize mTOR to the lysosome and thus constitutively
        activate the TOR pathway
    - reference_id: PMID:23705068
      supporting_text: We fused a 22-amino acid fragment of the C-terminal end of rap-1 to the C-terminal
        end of daf-15 and named it daf-15::rap-1(22).
- term:
    id: GO:0040024
    label: dauer larval development
  evidence_type: IMP
  original_reference_id: PMID:3350212
  qualifier: involved_in
  supporting_entities:
  - WB:WBVar00088570
  review:
    summary: >-
      daf-15(m81) animals constitutively enter an incomplete, non-recoverable dauer-like state and
      are epistatic to dauer-defective mutations (abstract only; full text not cached). Jia et al.
      2004 confirm that raptor and CeTOR mutations cause dauer-like larval arrest. The phenotype
      reflects loss of nutrient-driven TORC1 growth signaling that normally promotes reproductive
      development; DAF-15 regulates the dauer decision rather than executing dauer morphogenesis.
      Kept as non-core, deferring to the curator's reading of the full text.
    action: KEEP_AS_NON_CORE
    reason: >-
      Experimental IMP annotation consistent with independent evidence; a developmental
      consequence of TORC1 signaling, peripheral to Raptor's molecular role.
    supported_by:
    - reference_id: PMID:3350212
      supporting_text: Dauer larva morphogenesis is initiated regardless of environmental stimuli, and
        it is incomplete or abnormal.
    - reference_id: PMID:15253933
      supporting_text: mutations in the genes encoding CeTOR and raptor result in dauer-like larval
        arrest, implying that CeTOR regulates dauer diapause
- term:
    id: GO:0030674
    label: protein-macromolecule adaptor activity
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q8N122
  review:
    summary: >-
      DAF-15 has no molecular-function annotation. Raptor's established activity is that of a
      scaffold/adaptor that binds TOR and recruits TORC1 substrates (TOS-motif proteins such as
      S6K and 4E-BP) and the Rag GTPases. DAF-15 shares the full Raptor architecture, and the
      in vivo DAF-15::RAP-1(22) experiment shows DAF-15 can bring TORC1 to the lysosome as
      mammalian Raptor does. Proposed by sequence similarity to human RPTOR.
    action: NEW
    reason: >-
      Captures the core molecular role of Raptor, the only function DAF-15 itself performs
      within TORC1 signaling; consistent with the DROME raptor review. No worm biochemistry
      (binding assays) exists, hence ISS.
    supported_by:
    - reference_id: file:worm/daf-15/daf-15-uniprot.txt
      record_section: ["DR:InterPro"]
      supporting_text: IPR004083; Raptor
    - reference_id: PMID:23705068
      supporting_text: fusion of one of the TOR binding partners, Raptor, with a C-terminal lysosome
        localization signal from Rap-1 can localize mTOR to the lysosome and thus constitutively
        activate the TOR pathway
