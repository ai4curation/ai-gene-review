- id: PMID:18804378
  title: The Target of Rapamycin pathway antagonizes pha-4/FoxA to control development and aging.
  findings:
  - statement: Combined let-363/TOR and daf-15/Raptor RNAi from L4 extends lifespan, and the extension
      requires pha-4/FoxA; daf-15 mutants share small nucleoli and lipid accumulation with let-363.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached and read; supports the IGI lifespan row and TORC1 membership.
- id: PMID:3350212
  title: Mutants of Caenorhabditis elegans that form dauer-like larvae.
  findings:
  - statement: daf-15(m81) forms incomplete dauer-like larvae that cannot exit arrest; daf-15 is epistatic
      to dauer-defective mutations.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract only; abstract explicitly describes daf-15(m81) and supports the IMP dauer
      row.
- id: PMID:23705068
  title: A novel sphingolipid-TORC1 pathway critically promotes postembryonic development in Caenorhabditis
    elegans.
  findings:
  - statement: A DAF-15::RAP-1(22) fusion (Raptor with a lysosome-targeting tail) constitutively activates
      TORC1 and bypasses mmBCFA-deficiency L1 arrest.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text read; key functional evidence that DAF-15 acts as the TOR-recruiting TORC1
      subunit in vivo.
- id: PMID:15253933
  title: The TOR pathway interacts with the insulin signaling pathway to regulate C. elegans larval development,
    metabolism and life span.
  findings:
  - statement: daf-15 encodes raptor; raptor and CeTOR mutants arrest as dauer-like larvae, accumulate
      fat, and raptor mutations extend lifespan; daf-15 transcription is regulated by DAF-16/FOXO.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract only cached; molecular identification paper for daf-15 as raptor.
- id: PMID:22278922
  title: S6K links cell fate, cell cycle and nutrient response in C. elegans germline stem/progenitor
    cells.
  findings:
  - statement: Reducing let-363/TOR or daf-15/Raptor activity reduces the larval germline progenitor
      pool, similarly to loss of rsks-1 plus ife-1.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text; daf-15 used as a TORC1 genetic tool in germline proliferation.
