suggested_questions:
- question: Does DAF-15 bind LET-363/TOR and TOS-motif substrates (RSKS-1, IFE/4E-BP pathway components)
    directly in C. elegans, as Raptor does in mammals, or is the adaptor activity inferred only by
    orthology?
- question: Is DAF-15 lysosome-associated in vivo under fed conditions via RAGA-1/RAGC-1, and how does
    DAF-16-mediated transcriptional repression of daf-15 change TORC1 localization or activity?
suggested_experiments:
- description: Co-immunoprecipitation of endogenously tagged DAF-15 with LET-363 and RSKS-1 from fed
    versus starved worms, with RNC-domain point mutants predicted to disrupt TOS-motif binding.
- description: Live imaging of CRISPR-tagged DAF-15 with a lysosomal marker (LMP-1) across feeding
    states and in raga-1 mutants.
