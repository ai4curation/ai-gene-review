gene_symbol: daf-15
organism: worm
uniprot_id: G5EEV7
taxon_id: NCBITaxon:6239
descriptions:
- source: Alliance_Imported
  text: daf-15 encodes an ortholog of RAPTOR (the regulatory associated proteinof
    mTOR), and is regulated by DAF-16; daf-15 is required for non-dauerdevelopment,
    at least in some tissues or stages; daf-15(m81) mutantsconstitutively and irreversibly
    form abnormal dauer-like larvae (and arethus effectively lethal/sterile); mutants
    do not form true dauers whenexposed to dauer pheromone, yet execute only two molts.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00000911;class=Gene
  source_id: WB:WBGene00000911
- source: Alliance_Automated
  text: Is expressed in several structures, including body wall musculature; excretory
    cell; hermaphrodite distal tip cell; intestine; and pharyngeal muscle cell. Human
    ortholog(s) of this gene implicated in nicotine dependence. Orthologous to human
    RPTOR (regulatory associated protein of MTOR complex 1).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00000911;class=Gene
  source_id: WB:WBGene00000911
- source: RefSeq
  text: Predicted to enable protein kinase activator activity and protein-macromolecule
    adaptor activity. Involved in nematode larval development and regulation of autophagosome
    assembly. Part of TORC1 complex. Is expressed in several structures, including
    body wall musculature; excretory cell; hermaphrodite distal tip cell; intestine;
    and pharyngeal muscle cell. Human ortholog(s) of this gene implicated in nicotine
    dependence. Orthologous to human RPTOR (regulatory associated protein of MTOR
    complex 1). [provided by Alliance of Genome Resources, Jun 2026]
  source_type: automated
  url: https://www.ncbi.nlm.nih.gov/gene/177770
  source_id: GeneID:177770
