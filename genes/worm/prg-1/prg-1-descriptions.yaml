- source: Alliance_Automated
  text: Enables 21U-RNA binding activity. Involved in several processes, including
    21U-RNA metabolic process; germ-line stem cell division; and positive regulation
    of mitotic nuclear division. Located in P granule. Is expressed in germ line and
    in male. Orthologous to several human genes including PIWIL1 (piwi like RNA-mediated
    gene silencing 1); PIWIL3 (piwi like RNA-mediated gene silencing 3); and PIWIL4
    (piwi like RNA-mediated gene silencing 4).
