descriptions:
- source: Alliance_Imported
  text: prg-1 encodes a novel, basic protein that is one of two C. elegans members
    of the Piwi subfamily of highly conserved Argonaut/Piwi proteins; during development,
    PRG-1 activity is essential for successful gametogenesis, normal levels of fertility,
    and accumulation of 21 U-RNAs (piRNAs), small RNAs expressed in the germ line;
    in addition, PRG-1 appears to act upstream of an siRNA pathway to regulate transposition
    of the Tc3 DNA transposon; PRG-1 physically interacts with 21 U-RNAs in vivo;
    PRG-1 localizes to P granules throughout development.
  source_type: curated
