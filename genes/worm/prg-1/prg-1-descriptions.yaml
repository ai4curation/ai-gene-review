gene_symbol: prg-1
organism: worm
uniprot_id: P90786
taxon_id: NCBITaxon:6239
descriptions:
- source: Alliance_Imported
  text: prg-1 encodes a novel, basic protein that is one of two C. elegans members
    of the Piwi subfamily of highly conserved Argonaut/Piwi proteins; during development,
    PRG-1 activity is essential for successful gametogenesis, normal levels of fertility,
    and accumulation of 21 U-RNAs (piRNAs), small RNAs expressed in the germ line;
    in addition, PRG-1 appears to act upstream of an siRNA pathway to regulate transposition
    of the Tc3 DNA transposon; PRG-1 physically interacts with 21 U-RNAs in vivo;
    PRG-1 localizes to P granules throughout development.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00004178;class=Gene
  source_id: WB:WBGene00004178
- source: Alliance_Automated
  text: Enables 21U-RNA binding activity. Involved in several processes, including
    21U-RNA metabolic process; germ-line stem cell division; and positive regulation
    of mitotic nuclear division. Located in P granule. Is expressed in germ line and
    in male. Orthologous to several human genes including PIWIL1 (piwi like RNA-mediated
    gene silencing 1); PIWIL3 (piwi like RNA-mediated gene silencing 3); and PIWIL4
    (piwi like RNA-mediated gene silencing 4).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00004178;class=Gene
  source_id: WB:WBGene00004178
