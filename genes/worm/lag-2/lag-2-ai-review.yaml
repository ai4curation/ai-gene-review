gene_symbol: lag-2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: >-
  LAG-2 is a transmembrane Delta/Serrate/LAG-2 (DSL) family ligand for the Caenorhabditis elegans Notch
  receptors LIN-12 and GLP-1. It is a single-pass type I membrane protein with an N-terminal region and
  DSL domain that engage the receptor EGF repeats; its own EGF-like repeats are dispensable for activity.
  LAG-2 lacks the DOS motif, which can be supplied in trans by secreted DOS-motif co-ligands such as OSM-11.
  LAG-2 is expressed by the distal tip cell and its processes. There it forms the germline stem-cell niche
  signal that activates GLP-1 to maintain germline proliferation. It is also the lateral signal in LIN-12-mediated
  decisions, including the anchor cell/ventral uterine decision, vulval precursor cell patterning, and
  ventral M-lineage fates. It acts partly redundantly with APX-1 and DSL-1, which can substitute for it.
  Secreted, truncated extracellular forms of LAG-2 retain signaling activity.
