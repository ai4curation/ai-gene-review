suggested_questions:
- question: >-
    Does LAG-2 require an endogenous DOS-motif co-ligand (OSM-11/OSM-7 family) for GLP-1 activation in
    the germline niche, as proposed for LIN-12 in vulval development?
- question: >-
    Is the neuronal cell body membrane annotation for LAG-2 a mapping error for the distal tip cell body?
suggested_experiments:
- description: >-
    Measure direct LAG-2 DSL-domain binding affinity for LIN-12 versus GLP-1 EGF repeats, with and without
    OSM-11, using purified proteins.
