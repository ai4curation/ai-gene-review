gene_symbol: lag-2
organism: worm
uniprot_id: P45442
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Probable ligand for lin-12/Notch and glp-1/Notch receptors and involved in
    the mediation of Notch signaling (PubMed:18036582, PubMed:18700817, PubMed:7607081,
    PubMed:8139658, PubMed:8575327). Involved in the lin-12/Notch pathway signaling
    of cell fate in vulval precursor cells (VPCs) and in the postembryonic mesodermal
    lineage (M lineage), acting redundantly with dsl-1 and apx-1 (PubMed:14960273,
    PubMed:18036582). Functions in uterine cells to promote basement membrane mobility
    during tissue remodeling (PubMed:27661254, PubMed:8139658). Required for oocyte
    growth control, acting redundantly with apx-1, perhaps signaling via the glp-1/Notch
    pathway (PubMed:19502484). Plays a role in Notch-dependent induction of left-
    right asymmetry in interneurons and motoneurons (PubMed:21737278). Involved in
    maintaining the developmentally arrested larval state known as dauer, probably
    signaling in the glp-1/Notch pathway (PubMed:18599512). Required for normal sleep
    bout quantity and arousal thresholds during the transition from the last larval
    stage to adulthood in well-fed animals (PubMed:29523076).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P45442
  source_id: P45442
- source: Alliance_Imported
  text: lag-2 encodes a transmembrane protein of the Delta/Serrate/Lag-2 (DSL) family
    that functions as a signaling ligand for the GLP-1 and LIN-12 Notch-like receptors;
    LAG-2 is required for larval viability and for cell fate decisions involving the
    germline (meiosis vs mitosis), the somatic gonad, and the early embryo; in addition,
    LAG-2 functions redundantly with the transmembrane APX-1 and secreted DSL-1 ligands
    to regulate lateral signaling during vulval development; LAG-2 is expressed in
    the distal tip cell of the somatic gonad, the ventral nerve cord, the descendants
    of ABalap and MSap in the developing embryo, and in all six vulval precursor cells
    (VPCs) during the early L3 stage, with later expression in the VPCs generally
    restricted to P6.p; lag-2 expression in the vulval cells is regulated by the LET-23/EGF
    receptor signaling pathway and the SUR-2 component of the Mediator transcription
    complex.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00002246;class=Gene
  source_id: WB:WBGene00002246
- source: Alliance_Automated
  text: Enables Notch binding activity. Involved in several processes, including maintenance
    of dauer; positive regulation of stem cell proliferation; and regulation of basement
    membrane organization. Located in cell projection membrane and neuronal cell body
    membrane. Is expressed in several structures, including CAN; distal tip cell;
    head neurons; somatic gonad precursor; and vulval cell.
