gene_symbol: ddb-1
organism: worm
uniprot_id: Q21554
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Plays a role in DNA repair. May be a component of an E3 ubiquitin-protein
    ligase which promotes histone ubiquitination in response to UV irradiation. Histone
    ubiquitination may be important for subsequent DNA repair (By similarity). Promotes
    the degradation of the replication licensing factor cdt-1 during S-phase, thereby
    preventing rereplication of DNA during a single round of cell division.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q21554
  source_id: Q21554
- source: Alliance_Imported
  text: ddb-1 encodes a protein orthologous to human DNA damage-binding protein 1
    (DDB1); ddb-1 is part of a ubiquitin ligase E3 complex, CUL-4/DDB-1, and targets
    the replication licensing factor, cdt-1, for ubiquitin-mediated proteolysis; ddb-1
    interacts physically with CUL-4/Cullin and CDT-1; the CUL-4/DDB-1 complex also
    regulates SKN-1 transcription factor activity, and LET-23/EGFR signalling in vulval
    precursor cells.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00010890;class=Gene
  source_id: WB:WBGene00010890
- source: Alliance_Automated
  text: Predicted to enable nucleic acid binding activity. Involved in proteasome-mediated
    ubiquitin-dependent protein catabolic process. Predicted to be located in cytoplasm.
    Predicted to be active in nucleus and site of double-strand break. Is expressed
    in several structures, including P3.p hermaphrodite; P4.p hermaphrodite; P5.p
    hermaphrodite; germ line; and rectum. Used to study xeroderma pigmentosum. Human
    ortholog(s) of this gene implicated in communication disorder and disease of mental
    health. Orthologous to human DDB1 (damage specific DNA binding protein 1).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00010890;class=Gene
  source_id: WB:WBGene00010890
