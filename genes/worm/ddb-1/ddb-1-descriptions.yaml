descriptions:
- source: UniProt
  text: Plays a role in DNA repair. May be a component of an E3 ubiquitin-protein
    ligase which promotes histone ubiquitination in response to UV irradiation. Histone
    ubiquitination may be important for subsequent DNA repair (By similarity). Promotes
    the degradation of the replication licensing factor cdt-1 during S-phase, thereby
    preventing rereplication of DNA during a single round of cell division.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q21554
  source_id: Q21554
  review:
    reviewer: AI
    rubrics:
