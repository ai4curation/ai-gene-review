suggested_questions:
- question: Does worm DDB-1 participate in nucleotide excision repair, and if so which DCAF
    provides damaged-DNA recognition in the absence of a characterised worm DDB2 counterpart?
suggested_experiments:
- description: UV sensitivity and CPD-removal assays in ddb-1 hypomorphs or germline-specific
    depletion to test a conserved DNA-repair role.
