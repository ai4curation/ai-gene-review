  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR004871
  review:
    summary: InterPro (CPSF_A domain) mapping to nucleic acid binding.
    action: REMOVE
    reason: The CPSF_A beta-propeller domain is shared with RNA-processing CPSF1 proteins;
      DDB1 family proteins act as protein adaptors of CRL4 ligases, and damaged-DNA binding
      in the DDB complex is provided by DDB2, not DDB1. No worm evidence for nucleic acid
      binding exists. Consistent with the human DDB1 review.
