id: Q21554
gene_symbol: ddb-1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: DDB-1 is the C. elegans ortholog of DNA damage-binding protein 1, a large triple
  beta-propeller adaptor of CRL4 (cullin-4-RING) E3 ubiquitin ligases. DDB-1 binds CUL-4 specifically
  among the worm cullins and recruits DCAF substrate receptors, linking them to the cullin
  scaffold. The CUL-4/DDB-1 complex associates with and degrades the replication-licensing
  factor CDT-1 during S phase, preventing DNA re-replication in proliferating larval blast
  cells; with CDT-2 it targets the translesion polymerase POLH-1 during the embryonic DNA
  damage response, and with the DCAF WDR-23 it represses the stress-responsive transcription
  factor SKN-1. DDB-1 is broadly expressed in proliferating larval cells and at high levels
  in the adult spermatheca, and is predicted to act in the nucleus and cytoplasm.
