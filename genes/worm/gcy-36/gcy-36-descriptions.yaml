gene_symbol: gcy-36
organism: worm
uniprot_id: Q6DNF4
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Plays a central role in social feeding behavior by synthesizing 3',5'-cyclic
    guanosine monophosphate (cGMP) from GTP. Oxygen, which probably binds to its heme-binding
    sites, may regulate social behavior by modulating its activity. cGMP is a common
    second messenger in sensory transduction and is implicated in oxygen sensation.
    Indeed, C.elegans exhibits a strong behavioral preference for 5-12% oxygen, avoiding
    higher and lower oxygen levels; a higher level of oxygen inducing a naturally
    polymorphic social feeding behavior. Involved in avoidance of hyperoxia and for
    oxygen-induced aggregation and bordering, probably by mediating oxygen sensing
    in URX, AQR and PQR sensory neurons.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q6DNF4
  source_id: Q6DNF4
- source: Alliance_Imported
  text: gcy-36 encodes a soluble guanylate cyclase; GCY-36 activity is required in
    the URX sensory neurons to sense increases in O2 levels and effect corresponding
    behavioral changes; gcy-36 genetically interacts with npr-1 with respect to feeding
    behavior; a gcy-36 reporter fusion is expressed in the AQR, PQR, and URX neurons.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00001556;class=Gene
  source_id: WB:WBGene00001556
- source: Alliance_Automated
  text: Enables oxygen sensor activity. Involved in feeding behavior and response
    to oxygen levels. Located in dendrite and neuronal cell body. Is expressed in
    AQR; PQR; URXL; and URXR. Orthologous to several human genes including GUCY1B2
    (guanylate cyclase 1 soluble subunit beta 2 (pseudogene)).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00001556;class=Gene
  source_id: WB:WBGene00001556
