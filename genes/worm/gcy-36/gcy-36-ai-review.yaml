gene_symbol: gcy-36
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: GCY-36 is an atypical soluble guanylate cyclase (sGC) subunit of Caenorhabditis
  elegans with an H-NOX heme domain, an HNOB-associated domain and a C-terminal guanylate
  cyclase domain. It acts as the beta-like partner of GCY-35 (probably as a GCY-35/GCY-36
  heterodimer) in the body-cavity O2-sensing neurons URX, AQR and PQR. Both subunits are required
  for O2-evoked calcium responses in URX, and their co-expression is sufficient to confer
  O2-rise sensitivity on other neurons. The GCY-35/GCY-36 sGC produces cGMP that opens TAX-2/TAX-4
  channels, driving hyperoxia avoidance, O2-dependent locomotion and npr-1-dependent aggregation.
  A functional GFP-tagged GCY-36 localizes to the soma and dendrites of these neurons. A C-terminal
  prenylation motif and H-NOX residues contribute to its regulation, including inhibition
  by the neuroglobin GLB-5.
