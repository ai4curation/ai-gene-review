suggested_questions:
- question: Does ATG-4.1 process LGG-2 (the LC3-type Atg8) in vivo, and how is the work divided with ATG-4.2
    between LGG-1 and LGG-2?
suggested_experiments:
- experiment_type: Paralog substrate specificity
  description: Compare cleavage of LGG-1 and LGG-2 precursors and of LGG-1-PE/LGG-2-PE on liposomes by
    purified ATG-4.1 and ATG-4.2, and test whether catalytic-dead ATG-4.1 (active-site cysteine mutant)
    rescues atg-4.1 aggrephagy defects.
  hypothesis: ATG-4.1 is specialised for LGG-1 priming, whereas ATG-4.2 is specialised for delipidation
    during maturation.
