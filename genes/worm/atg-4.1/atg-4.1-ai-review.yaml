  label: Caenorhabditis elegans
description: 'ATG-4.1 is one of two C. elegans orthologs of the Atg4/autophagin cysteine protease (peptidase
  family C54). It cleaves the C terminus of the Atg8-family protein LGG-1 (GABARAP-type) to expose the
  glycine that is then conjugated to phosphatidylethanolamine, and it can also remove LGG-1 from membranes
  by cleaving the LGG-1-PE amide bond (delipidation). ATG-4.1 processes LGG-1 precursors about 100-fold
  more efficiently than its paralog ATG-4.2, and it is the main LGG-1 processing enzyme in embryos: atg-4.1
  mutants accumulate unprocessed LGG-1 and fail to degrade protein aggregates (PGL granules, SQST-1),
  a defect rescued by pre-processed LGG-1. The two paralogs are partly redundant for LGG-1 lipidation,
  but ATG-4.2, not ATG-4.1, is needed for autophagosome maturation in neurons. ATG-4.1 is a cytoplasmic
  protein expressed throughout the embryo.'
