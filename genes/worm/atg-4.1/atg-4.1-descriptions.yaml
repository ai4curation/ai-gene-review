gene_symbol: atg-4.1
organism: worm
uniprot_id: K8ESC5
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Cysteine protease required for autophagy (PubMed:22767594, PubMed:30880001).
    Cleaves the C-terminal amino acid of ATG8 family proteins lgg-1, to reveal a C-terminal
    glycine (PubMed:22767594). Exposure of the glycine at the C-terminus is essential
    for ATG8 proteins conjugation to phosphatidylethanolamine (PE) and insertion to
    membranes, which is necessary for autophagy (Probable). Its cleavage activity
    is functionally redundant to atg-4.2, but it cleaves lgg-1 precursors more efficiently
    than atg-4.2 (Probable). Acts redundantly with atg-4.2 to promote the lgg-1 delipidation
    to release the protein from membranes, which facilitates multiple events during
    macroautophagy (PubMed:22767594). Unlike atg-4.2 does not seem to be required
    for autophagosome maturation (PubMed:30880001).
  source_type: curated
  url: https://www.uniprot.org/uniprot/K8ESC5
  source_id: K8ESC5
- source: Alliance_Imported
  text: atg-4.1 encodes a putative cysteine protease orthologous to the autophagic
    budding yeast protein Atg4p, and to human ATG4A and ATG4B; ATG-4.1 is paralogous
    to ATG-4.2 and to human ATG4C (OMIM:611339) and ATG4D (OMIM:611340); ATG-4.1 is
    expressed from early embryos to adults, in larval and adult intestine, renal gland
    cells, and neurons; ATG-4.1 exhibits protease activity towards LGG-1; ATG-4.1
    localizes to the cytoplasm of most cells during embryogenesis.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00013595;class=Gene
  source_id: WB:WBGene00013595
- source: Alliance_Automated
  text: Enables cysteine-type endopeptidase activity. Involved in aggrephagy and protein
    processing. Located in cytoplasm. Is expressed in several structures, including
    P3.p hermaphrodite; P4.p hermaphrodite; P5.p hermaphrodite; head muscle; and nervous
    system. Orthologous to several human genes including ATG4A (autophagy related
    4A cysteine peptidase).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00013595;class=Gene
  source_id: WB:WBGene00013595
