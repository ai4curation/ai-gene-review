  review:
    summary: >-
      Core molecular function. DPY-31 is the C. elegans DPY-31/NAS-35 astacin
      family member; Novelli et al. showed that dpy-31 encodes an essential
      extracellular BMP-1/tolloid-related astacin and genetically implicated it
      in C-terminal SQT-3 procollagen processing, while Stepek et al. confirmed
      the conserved C-terminal SQT-3 processing activity of parasitic DPY-31
      orthologs. PAINT places the metalloendopeptidase activity on the DPY-31
      ancestral node and `just paint-losses worm dpy-31` reports no IRD or IKR
      loss on the P98060 lineage.
