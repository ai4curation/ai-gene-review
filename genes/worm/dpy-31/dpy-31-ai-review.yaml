- id: PMID:15579684
  title: Gene interactions in Caenorhabditis elegans define DPY-31 as a candidate
    procollagen C-proteinase and SQT-3/ROL-4 as its predicted major target.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full-text primary genetics paper that identified dpy-31 as an essential
      BMP-1/tolloid-family astacin metalloprotease, showed cuticle defects and
      embryonic/larval lethality in loss-of-function mutants, localized
      promoter activity to collagen-secreting hypodermal cells, and implicated
      the SQT-3 C terminus as the likely DPY-31 processing target by extragenic
      suppression.
- id: PMID:19883650
  title: >-
    Collagen processing and cuticle formation is catalysed by the astacin
    metalloprotease DPY-31 in free-living and parasitic nematodes.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Abstract-only cached study. It confirms conservation of DPY-31 in Brugia
      malayi and Haemonchus contortus, reports functional rescue of the C.
      elegans dpy-31 mutant body form by the H. contortus ortholog, and shows
      that recombinant parasitic DPY-31 enzymes cleave C. elegans SQT-3 at the
      correct C-terminal procollagen processing site.
