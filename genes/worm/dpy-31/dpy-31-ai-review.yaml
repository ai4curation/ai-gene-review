  label: Caenorhabditis elegans
description: >-
  DPY-31/NAS-35 is a secreted zinc-dependent astacin metalloprotease of the
  BMP-1/tolloid family. It is synthesized as a precursor with an N-terminal
  signal peptide and propeptide, a catalytic M12A astacin domain, EGF-like and
  CUB domains, and a catalytic zinc-binding site. In C. elegans, DPY-31 acts as
  a procollagen C-proteinase in the extracellular/cuticular compartment: it
  cleaves the C-terminal propeptide of cuticle collagen precursors such as
  SQT-3 so that mature collagens can assemble into the collagenous exoskeleton
  during cuticle formation and molting.
