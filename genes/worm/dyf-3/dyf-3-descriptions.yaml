gene_symbol: dyf-3
organism: worm
uniprot_id: Q6I6D4
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Component of the intraflagellar transport (IFT) complex B required for transport
    of proteins in the motile cilium (PubMed:28479320). May be required for ciliary
    entrance and transport of specific ciliary cargo proteins such as che-3 which
    are related to motility (PubMed:28479320). Required for sensory cilia biogenesis
    (PubMed:15713455).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q6I6D4
  source_id: Q6I6D4
- source: Alliance_Imported
  text: dyf-3 encodes an ortholog of zebrafish cluap1 (also qilin, and like PKD2required
    to suppress kidney cysts) and human clusterin-associatedprotein 1 (CLUAP1); DYF-3
    is predicted to have two coiled-coil domains;DYF-3 is required for normal assembly
    of middle and distal ciliarysegments, with dyf-3 mutants showing truncated sensory
    cilia; DYF-3 isrequired cell-autonomously for dye uptake; dyf-3 is expressed in
    amphid,phasmid, and IL2 sensory neurons; dyf-3 expression requires DAF-19.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00001119;class=Gene
  source_id: WB:WBGene00001119
- source: Alliance_Automated
  text: Involved in several processes, including chemosensory behavior; cilium assembly;
    and response to alkaline pH. Located in axon; dendrite; and neuronal cell body.
    Is expressed in nervous system. Orthologous to human IFT38 (intraflagellar transport
    38).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00001119;class=Gene
  source_id: WB:WBGene00001119
