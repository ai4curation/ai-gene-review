- source: Alliance_Imported
  text: dyf-3 encodes an ortholog of zebrafish cluap1 (also qilin, and like PKD2required
    to suppress kidney cysts) and human clusterin-associatedprotein 1 (CLUAP1); DYF-3
    is predicted to have two coiled-coil domains;DYF-3 is required for normal assembly
    of middle and distal ciliarysegments, with dyf-3 mutants showing truncated sensory
    cilia; DYF-3 isrequired cell-autonomously for dye uptake; dyf-3 is expressed in
    amphid,phasmid, and IL2 sensory neurons; dyf-3 expression requires DAF-19.
  source_type: curated
