findings:
- category: discrepancy
  text: The automated text places ACBP-5 in the endoplasmic reticulum and plasma membrane;
    the review removes both IBA rows because the protein is soluble and lacks any
    transmembrane segment.
  sources:
  - Alliance_Automated
  - RefSeq
- category: discrepancy
  text: The RefSeq copy gives predicted protein myristoylation, which the Alliance
    automated text fetched on 2026-11-16 and the current GOA rows do not; the human
    ortholog ACBD6 supplies myristoyl-CoA to N-myristoyltransferase, so the term may
    have been dropped upstream.
  sources:
  - RefSeq
  - Alliance_Automated
review:
  reviewer: AI
  rubrics:
  - rubric: overall_concordance
    score: 4
  overall_notes: WormBase and the automated text agree on acyl-CoA binding; only the
    automated text carries the membrane locations the review rejects.
