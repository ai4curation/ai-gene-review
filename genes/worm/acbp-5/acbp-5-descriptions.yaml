    overall_notes: Acyl-CoA-binding domain, two ankyrin repeats, 1.4-fold lipid-droplet
      increase and pharynx/anterior-intestine expression are all verified in the review
      (PMID:21539519, PMID:36551154). Omits the yeast ACB1 complementation result
      and has a duplicated word ('acyl-CoA-binding binding').
- source: Alliance_Automated
  text: Predicted to enable enzyme activator activity and fatty-acyl-CoA binding activity.
    Predicted to be active in endoplasmic reticulum and plasma membrane. Is expressed
    in intestine and pharynx. Human ortholog(s) of this gene implicated in disease
    of mental health. Orthologous to human ACBD6 (acyl-CoA binding domain containing
    6).
