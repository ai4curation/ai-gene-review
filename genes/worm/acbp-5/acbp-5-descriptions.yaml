descriptions:
- source: Alliance_Imported
  text: acbp-5 encodes a highly conserved protein containing a functional acyl-CoA-binding
    binding domain required for protein stability and ligand binding; contains two
    ankyrin repeats which may mediate interactions with other proteins; Disruption
    of ACBP-5 function results in 1.4 times more lipid droplets than in wildtype;
    ACBP-5 localizes in adult pharynx and intestine with highest expression in anterior
    part of the intestine.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00011731;class=Gene
  source_id: WB:WBGene00011731
