id: Q9XVJ0
gene_symbol: acbp-5
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: >-
  Caenorhabditis elegans acbp-5 (T12D8.3, WBGene00011731) encodes a soluble 274-residue
  intracellular ankyrin-repeat acyl-CoA-binding protein (CeACBP-5) that is the nematode
  ortholog of vertebrate ACBD6 and one of three multidomain ACBP-domain proteins alongside
  four basal cytosolic ACBPs in C. elegans. CeACBP-5 pairs an N-terminal four-helix
  acyl-CoA-binding (ACB) domain (residues 28-114) conserving the CoA-headgroup triad (Tyr55,
  Lys59, Lys82) and acyl-chain pocket tyrosine (Tyr101) with two C-terminal ankyrin repeats
  (spanning up to residue 254), and lacks any transmembrane segment. Heterologous expression
  of acbp-5 rescues the growth defect of ACBP-deficient Saccharomyces cerevisiae, confirming
  functional intracellular fatty-acyl-CoA carrier activity in vivo; in adult worms, ACBP-5
  is expressed predominantly in the pharynx and anterior intestine, where loss or
  downregulation of acbp-5 elevates intestinal lipid droplet abundance by approximately
  40%.
