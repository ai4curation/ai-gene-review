suggested_questions:
- question: >-
    Why does acbp-5 loss in C. elegans increase intestinal lipid droplet abundance by ~40%
    whereas ACBD6 knockout in human HeLa cells reduces lipid droplet content by ~30%, and
    does CeACBP-5 interact with C. elegans NMT-1 via its C-terminal ankyrin repeats?
  experts:
  - Nils J. Faergeman
  - Eric Soupene
suggested_experiments:
- hypothesis: >-
    CeACBP-5 binds C. elegans NMT-1 via its C-terminal ankyrin repeats to stimulate protein
    N-myristoylation in pharyngeal and intestinal cells while separately partitioning
    unsaturated fatty-acyl-CoAs away from triacylglycerol synthesis in the anterior
    intestine.
  description: >-
    Compare intestinal phospholipid/triacylglycerol acyl-chain remodeling and global YnMyr
    N-myristoylation between wild-type, acbp-5 null, acbp-5(Y101A), and acbp-5(DeltaANK)
    rescue strains in C. elegans, alongside recombinant CeACBP-5/NMT-1 activity assays.
  experiment_type: C. elegans domain-specific rescue lipidomics and NMT-1 enzyme kinetics
