- id: PMID:18268358
  title: Characterization of an acyl-coenzyme A binding protein predominantly expressed
    in human primitive progenitor cells.
  findings:
  - statement: >-
      The N-terminal ACB domain of ACBD6 is sufficient for selective long-chain
      fatty-acyl-CoA binding.
    supporting_text: >-
      Removal of the two ANK motifs, ACBD6-ΔC, had no effect on the binding activity or on
      the substrate preference ( Fig. 4 ). Thus, the ACB domain present at the N terminus is
      sufficient for binding to the substrate.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Full text read; establishes biochemical function of the conserved ACB domain in the
      metazoan ACBD6 clade.
- id: PMID:21539519
  title: Tissue- and paralogue-specific functions of acyl-CoA-binding proteins in lipid
    metabolism in Caenorhabditis elegans.
  full_text_unavailable: true
  findings:
  - statement: >-
      All seven C. elegans ACBP paralogs—four basal forms and three multidomain ACBP-domain
      proteins including ACBP-5—complement the growth defect of ACBP-deficient yeast cells
      and show distinct tissue expression patterns in C. elegans.
    supporting_text: >-
      The nematode Caenorhabditis elegans expresses seven ACBPs: four basal forms and three
      ACBP domain proteins. We find that each of these paralogues is capable of complementing
      the growth of ACBP-deficient yeast cells, and that they exhibit distinct temporal and
      tissue expression patterns in C. elegans.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Primary C. elegans ACBP family characterization (cached abstract-only), establishing in
      vivo yeast-complementation acyl-CoA carrier activity across all seven paralogs
      including acbp-5.
- id: PMID:30642881
  title: ACBD6 protein controls acyl chain availability and specificity of the N-myristoylation
    modification of proteins.
  findings:
  - statement: >-
      Soluble ankyrin-repeat ACBD6 proteins across divergent eukaryotes bind and stimulate
      N-myristoyltransferase enzymes while protecting them from acyl-CoA competitors.
    supporting_text: >-
      The human ankyrin-repeat-containing ACBD6 protein supports the reaction catalyzed by
      the human and Plasmodium N -myristoyltransferase (NMT) enzymes. Likewise, the newly
      identified Plasmodium ACBD6 homologue regulates the activity of the NMT enzymes.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Full text read; establishes evolutionary conservation of NMT activation across soluble
      eukaryotic ACB+ANK homologs.
- id: PMID:36551154
  title: Dual Role of ACBD6 in the Acylation Remodeling of Lipids and Proteins.
  findings:
  - statement: >-
      Downregulation of the C. elegans ACBD6 ortholog CeACBP-5 increases cellular lipid
      droplet abundance by approximately 40%, contrasting with the lipid-droplet reduction
      seen in human ACBD6-knockout HeLa cells.
    supporting_text: >-
      Interestingly, downregulation of the Caenorhabditis elegans ACBD6 homolog, CeACBP-5,
      resulted in an opposite effect, and a 40% increase in the production of lipid droplets
      was observed [58].
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Full text read; independently corroborates the ~1.4-fold lipid-droplet increase upon
      CeACBP-5 loss summarized by WormBase from PMID:21539519.
- id: file:worm/acbp-5/acbp-5-deep-research-wormbase.md
  title: WormBase gene description for acbp-5 (worm)
  findings:
  - statement: >-
      WormBase summarizes acbp-5 as encoding a conserved acyl-CoA-binding and two-ankyrin-repeat
      protein localized to the adult pharynx and anterior intestine whose disruption
      increases lipid droplets 1.4-fold over wild type.
    supporting_text: >-
      acbp-5 encodes a highly conserved protein containing a functional acyl-CoA-binding
      binding domain required for protein stability and ligand binding; contains two ankyrin
      repeats which may mediate interactions with other proteins; Disruption of ACBP-5
      function results in 1.4 times more lipid droplets than in wildtype; ACBP-5 localizes in
      adult pharynx and intestine with highest expression in anterior part of the intestine.
  reference_review:
    relevance: HIGH
