- source: Alliance_Automated
  text: Predicted to enable Notch binding activity. Involved in several processes,
    including lateral inhibition; regulation of germ cell proliferation; and regulation
    of vulval development. Located in cytoplasm; nucleus; and plasma membrane. Is
    expressed in several structures, including AB; C; P6.p hermaphrodite; non-striated
    muscle; and vulva. Human ortholog(s) of this gene implicated in dysostosis and
    spondylocostal dysostosis 1. Orthologous to human DLL3 (delta like canonical Notch
    ligand 3).
