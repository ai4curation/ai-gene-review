gene_symbol: apx-1
organism: worm
uniprot_id: P41990
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Probable ligand for lin-12/Notch and glp-1/Notch receptors and involved in
    the mediation of Notch signaling (PubMed:14960273, PubMed:7568229, PubMed:8575327).
    Involved in the lin-12/Notch pathway signaling of cell fate in vulval precursor
    cells (VPCs), acting redundantly with dsl-1 and lag-2 (PubMed:14960273, PubMed:7568229).
    Contributes to the establishment of the dorsal-ventral axis in early embryos (PubMed:18036582,
    PubMed:8156602). Involved in the specification of the blastomere cell ABp fate,
    probably acting as a signal from the P2 blastomere to the glp-1/Notch receptor
    on ABp and ABa (PubMed:7925031, PubMed:8156602, PubMed:8674418). Probably acts
    as a signal, from the secondary vulval epithelial cells and the vulval muscle
    type 1 (vm1) cells, to activate the lin-12/Notch pathway in type 2 vulval muscle
    (vm2) cells, contributing to formation of the postsynaptic muscle plasma membrane
    extensions, known as muscle arms (PubMed:23539368). Required for oocyte growth
    control, acting redundantly with lag-2, perhaps signaling via the glp-1/Notch
    pathway (PubMed:19502484). Plays a somatic role in ovulation during adulthood,
    perhaps via lin-12/Notch signaling (PubMed:29371032). Involved in establishing
    left-right asymmetry during intestinal organogenesis (PubMed:10903169).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P41990
  source_id: P41990
- source: Alliance_Imported
  text: apx-1 encodes one of ten C. elegans DSL (Delta, Serrate, LAG-2) proteins,
    integral transmembrane and secreted proteins that function as signaling ligands
    for the Notch family receptors GLP-1 and LIN-12; in the 4-cell embryo, maternally
    supplied APX-1 functions as a GLP-1 ligand for an inductive interaction that specifies
    the fate of the ABp blastomere; later in embryogenesis, APX-1 is required for
    formation of the LIN-12-dependent, invariant asymmetrical twist that occurs as
    part of normal gut morphogenesis; during larval development, APX-1 is required
    redundantly with DSL-1 and LAG-2 for the LIN-12-mediated lateral signal that spatially
    patterns the primary and secondary vulval cell lineages; in the early embryo,
    APX-1 is first detected at the anterior edge of the P1 blastomere, with later
    expression visible in P2 at sites of contact with ABp, and in the cytoplasm of
    the EMS and P3 blastomeres; expression in the vulval precursor cells (VPCs) is
    detected in the primary VPC, P6.p, and its descendants; embryonic APX-1 expression
    is dependent upon PIE-1 activity, while later vulval expression is mediated by
    the Ras signaling pathway and the SUR-2 transcriptional cofactor.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00000168;class=Gene
