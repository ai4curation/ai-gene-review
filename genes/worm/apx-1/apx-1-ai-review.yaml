core_functions:
- description: >-
    Transmembrane DSL ligand that binds and activates GLP-1/LIN-12 Notch receptors on adjacent cells,
    most notably as the P2-to-ABp inductive signal in the 4-cell embryo and as a component of the VPC
    lateral signal.
  molecular_function:
    id: GO:0005112
    label: Notch binding
  directly_involved_in:
  - id: GO:0007219
    label: Notch signaling pathway
  - id: GO:0031129
    label: inductive cell-cell signaling
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:8674418
    supporting_text: >-
      We propose that APX-1 is part or all of the P2 signal that induces ABp to adopt a fate different
      than ABa.
  - reference_id: PMID:8156602
    supporting_text: >-
      apx-1, functions with glp-1 only in the specification of the ABp fate and that apx-1 can encode
      a protein homologous to the Delta protein of Drosophila
  - reference_id: PMID:14960273
    supporting_text: >-
      show that three of these genes, apx-1, dsl-1, and lag-2, are functionally redundant components of
      the lateral signal
  - reference_id: file:worm/apx-1/apx-1-deep-research-falcon.md
    supporting_text: Both the MNNL and DSL domains are absolutely essential for APX-1 activity
suggested_questions:
- question: >-
    PANTHER places APX-1 in PTHR24049:SF22 ('Drosophila crumbs homolog') together with the LIN-12 receptor
    rather than in the DSL family PTHR22669 used for LAG-2. Is this a family-assignment artefact?
- question: Is the reported nuclear APX-1 signal protein or mRNA?
suggested_experiments:
- description: >-
    Image endogenously tagged APX-1 protein in early embryos to resolve whether any nuclear pool exists,
    and test direct APX-1 DSL-domain binding to GLP-1 EGF repeats.
