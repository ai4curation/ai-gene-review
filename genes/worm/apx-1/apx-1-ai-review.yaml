id: P41990
gene_symbol: apx-1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: >-
  APX-1 (anterior pharynx in excess 1) is a transmembrane Delta/Serrate/LAG-2 (DSL) family ligand for
  the Caenorhabditis elegans Notch receptors GLP-1 and LIN-12. Maternally supplied APX-1 is expressed
  in the P2 blastomere. There it forms the inductive signal that activates GLP-1 on the contacting ABp
  blastomere, so that ABp adopts a fate distinct from its equipotent sister ABa. This contributes to dorsal-ventral
  polarity of the early embryo. Later, APX-1 acts redundantly with LAG-2 and DSL-1 as a lateral signal
  for LIN-12 in vulval precursor cells and with LAG-2 in ventral M-lineage patterning. It also signals
  from vm1 and secondary vulval cells to LIN-12 in vm2 muscles to promote muscle-arm formation, and mediates
  later LIN-12 interactions in intestinal left-right twist. It acts as a redundant distal tip cell ligand
  for GLP-1. APX-1 can fully substitute for LAG-2, and like other C. elegans DSL ligands it lacks a DOS
  motif.
