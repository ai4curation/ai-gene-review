    correctness: VERIFIED
    review_notes: Abstract only; primary cloning and expression paper for vha-1.
core_functions:
- description: Proton-carrying proteolipid subunit c of the V0 c-ring of the rotary
    V-type H+-ATPase; its buried glutamate binds protons that are translocated
    across the membrane into the organelle lumen as the ring rotates, powered by
    ATP hydrolysis in the V1 sector.
