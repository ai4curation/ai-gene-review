id: Q21898
gene_symbol: vha-1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: VHA-1 is a 16 kDa four-transmembrane proteolipid subunit c of the
  membrane-embedded V0 sector of the vacuolar-type H+-ATPase (V-ATPase) of
  Caenorhabditis elegans, orthologous to human ATP6V0C and yeast Vma3. Multiple
  copies of subunit c form the rotating c-ring whose buried glutamate residues bind
  and carry protons across the membrane, so that ATP hydrolysis by the cytosolic V1
  sector is coupled to proton pumping into the lumen of endosomes, lysosomes,
  synaptic vesicles and other acidic compartments. vha-1 lies in a tandem operon
  with vha-2 on chromosome III and is expressed strongly in the H-shaped excretory
  cell and rectal cells, as well as broadly during embryogenesis. Loss of vha-1,
  like loss of other V-ATPase subunits, prevents lysosomal acidification in
  maturing oocytes and causes embryonic lethality, failure of ovulation and
  inappropriate EFF-1-dependent fusion of epidermal cells.
