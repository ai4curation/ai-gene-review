- id: PMID:9305897
  title: Three vha genes encode proteolipids of Caenorhabditis elegans vacuolar-type
    ATPase. Gene structures and preferential expression in an H-shaped excretory
    cell and rectal cells.
  findings:
  - statement: vha-1 and vha-2 encode putative 16 kDa V-ATPase proteolipids and are
      tandemly arranged on chromosome III.
    supporting_text: The vha-1 and vha-2 (vacuolar-type H+-ATPase) genes in
      Caenorhabditis elegans encode putative 16-kDa proteolipids and are tandemly
      localized on chromosome III
  - statement: The proteolipids are ~60% identical to yeast and mammalian subunit c.
    supporting_text: The deduced amino acid sequences of the two genes exhibit about
      60% identity with the homologues from yeast, mouse, and cow
  - statement: The proteolipid genes are highly expressed in the excretory cell and
      rectal cells.
    supporting_text: the three vha genes may be highly expressed in the H-shaped
      excretory cell, rectum, and a pair of cells posterior to the anus
