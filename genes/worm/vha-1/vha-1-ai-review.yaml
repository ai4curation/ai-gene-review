suggested_questions:
- question: Is VHA-1 (rather than the paralogous proteolipids vha-2 and vha-3) the
    c subunit of the neuronal V-ATPase that acidifies synaptic vesicles, and which
    proteolipid is used in which tissue?
suggested_experiments:
- description: Tissue-resolved expression and neuron-specific degron depletion of
    VHA-1, VHA-2 and VHA-3 with measurement of synaptic vesicle pH and evoked
    release at the neuromuscular junction.
