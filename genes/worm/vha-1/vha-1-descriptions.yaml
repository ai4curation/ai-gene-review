- source: Alliance_Automated
  text: Predicted to enable proton-transporting ATPase activity, rotational mechanism.
    Involved in several processes, including lysosomal lumen acidification; ovulation;
    and regulation of syncytium formation by plasma membrane fusion. Located in membrane
    raft. Is expressed in excretory cell; intestine; and rectum. Human ortholog(s)
    of this gene implicated in early-onset epilepsy 3 and thyroid gland carcinoma.
    Orthologous to human ATP6V0C (ATPase H+ transporting V0 subunit c).
