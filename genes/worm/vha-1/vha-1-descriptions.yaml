- source: Alliance_Imported
  text: vha-1 encodes an ortholog of subunit c of the membrane-bound (V0) domainof
    vacuolar proton-translocating ATPase (V-ATPase); VHA-1 is a predictedV-ATPase
    transmembrane rotor component; VHA-1 and VHA-2/3 comprise aclosely related family
    of subunit c co-orthologs, predicted to carryprotons from the cytosol to a-subunits
    (VHA-5, VHA-6, VHA-7, or UNC-32)for transmembrane export; VHA-1, like VHA-12 and
    VHA-17, antagonizesEFF-1-mediated cell fusion in hypodermal cells; VHA-1 is required
    forovulation and embryogenesis, since vha-1(RNAi) animals are sterile withpolyploid,
    unmatured oocytes and dead progeny; VHA-1 is required foralae formation, like
    the V0 subunits VHA-4 and VHA-5, but not like theV1 subunits VHA-8 or VHA-13;
    vha-1 shares an operon with vha-2 andR10E11.6; both vha-1 and vha-2 are expressed
    in the excretory cell, therectum, and a pair of cells near the anus.
