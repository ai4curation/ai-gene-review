suggested_questions:
- question: Does MUT-15 bind RDE-8 and NYN-1/NYN-2 directly, which would make it a protein-macromolecule
    adaptor between MUT-16 and the ribonuclease module? Or does it act through RNA?
suggested_experiments:
- description: Use recombinant pull-downs or yeast two-hybrid tests between MUT-15 fragments
    and MUT-16 (B-C region), RDE-8, NYN-1 and NYN-2. Then make separation-of-function mut-15
    alleles that keep MUT-16 binding but lose RDE-8/NYN recruitment, and measure 22G-RNA levels.
knowledge_gaps:
- gap_statement: The molecular activity of MUT-15 is unknown. It has no recognizable domains,
    and it has not been shown whether it binds RDE-8, NYN-1 or NYN-2 directly (as an adaptor
    between them and MUT-16), binds RNA, or has some other activity.
  boundary: It is established that MUT-15 localizes to Mutator foci in a MUT-16-dependent
    way, co-purifies with MUT-16 and RDE-8, and is needed to recruit RDE-8 and NYN-1 to Mutator
    foci and for secondary siRNA accumulation.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
