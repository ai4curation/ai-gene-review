    label: mutator focus
  evidence_type: IDA
  original_reference_id: PMID:22713602
  qualifier: located_in
  review:
    summary: MUT-15 is one of the six mutator proteins observed in perinuclear Mutator foci.
      Its localization there depends on MUT-16.
    action: ACCEPT
    reason: Core location, directly observed. It is confirmed by MUT-16-dependent recruitment
      and by ectopic MUT-16 foci recruiting MUT-15 in muscle cells.
    supported_by:
    - reference_id: PMID:22713602
      supporting_text: Here we show that each of the six mutator proteins localizes to punctate
        foci at the periphery of germline nuclei.
    - reference_id: PMID:30036386
      supporting_text: In brief, MUT-16 is required for localization of MUT-2, MUT-7, RDE-2,
        MUT-14, and MUT-15, all of which localize independently of one another except for
        MUT-7, which requires RDE-2 for localization (Fig 1C).
- term:
    id: GO:0030422
    label: siRNA processing
  evidence_type: IMP
  original_reference_id: PMID:30036386
  review:
    summary: mut-15 mutants, like other mutator-complex mutants, lose most RdRP-dependent
      secondary siRNAs. MUT-15 is needed to recruit the RDE-8 and NYN-1/NYN-2 nucleases to
      Mutator foci and for RDE-8 to engage target mRNA.
    action: NEW
    reason: MUT-15 does part of the work of secondary siRNA biogenesis as a structural subunit.
      It places the RDE-8/NYN ribonuclease module in the amplification compartment and is
      needed for RDE-8 to bind target mRNA, a step upstream of RdRP templating. This is the
      scaffold case, not only necessity. For the comparator check, the other non-catalytic
      mutator scaffolds, MUT-16 (IMP) and RDE-2 (IDA), already carry GO:0030422.
    supported_by:
    - reference_id: PMID:30036386
      supporting_text: Mutator foci are considered hubs of siRNA amplification because mutations
        in mut-16 or any of the associated Mutator complex proteins (mut-2, mut-7, mut-14
        smut-1, mut-15, rde-2, rde-8, or rrf-1) result in a substantial loss of the RdRP-dependent
        secondary siRNAs
    - reference_id: PMID:30036386
      supporting_text: Localization of RDE-8 and NYN-1 to Mutator foci requires both mut-16
        and mut-15.
    - reference_id: PMID:25635455
      supporting_text: In mut-15(tm1358), mut-16(tm3748), or nyn-1(tm5004); nyn-2(tm4844)
        mutants, enrichment of sel-1 mRNA by GFP::RDE-8(D76N) RIP was reduced to 22–42% of
        the WT level (Figure 6B).
