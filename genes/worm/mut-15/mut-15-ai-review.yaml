  supported_by:
  - reference_id: PMID:30036386
    supporting_text: Since MUT-15 recruits NYN-1, NYN-2 and RDE-8, at least six Mutator complex
      proteins localize to Mutator foci through the B-C region of MUT-16
  - reference_id: PMID:30036386
    supporting_text: MUT-2, MUT-14, and MUT-15 likely interact directly with MUT-16, as we
      can robustly detect these interactions by immunoprecipitation
  - reference_id: PMID:25635455
