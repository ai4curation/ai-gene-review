  label: Caenorhabditis elegans
description: MUT-15 (also RDE-5; T01C3.8) is a germline protein of the mutator complex with
  no recognizable domains. MUT-15 is recruited by the B-C region of the Q/N-rich scaffold
  MUT-16 to perinuclear Mutator foci, and probably binds MUT-16 directly. In turn MUT-15 is
  needed to bring the NYN-domain proteins NYN-1, NYN-2 and the endoribonuclease RDE-8 into
  Mutator foci, and for RDE-8 to engage RNAi target mRNA efficiently. Like other mutator-class
  genes, mut-15 is required for RNAi and for the accumulation of RdRP-dependent secondary
  22G siRNAs. It therefore acts as an organizing subunit that links the MUT-16 scaffold to
  the ribonuclease module of the siRNA amplification machinery.
