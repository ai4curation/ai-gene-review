core_functions:
- description: MUT-15 is a mutator-complex subunit recruited by MUT-16 to perinuclear Mutator
    foci. There it recruits the NYN-domain ribonucleases RDE-8, NYN-1 and NYN-2 and helps
    RDE-8 engage RNAi target mRNA, so that RdRP-dependent secondary 22G-siRNA amplification
    can proceed. Its molecular activity (direct adaptor or something else) is not known.
  directly_involved_in:
  - id: GO:0030422
