descriptions:
- source: UniProt
  text: Maternally provided pie-1 is required for germline cell fate determination. Functions
    as a repressor of RNA polymerase II-dependent gene expression in the developing germline.
    Required for expression of nos-2 in P4 germline blastomere cells. Inhibits the histone
    deacetylase activity of hda-1 (PubMed:34003111). Represses transcriptional activation
    of cdk-9 and cit-1.1, which are members of the P-TEFb complex. Acts redundantly with gei-17
    to promote piRNA-mediated silencing and fertility in adult germline (PubMed:34003111).
    Promotes the sumoylation of hda-1 in adult animals but not in embryos thereby regulating
    its interaction with mep-1 (PubMed:34003111).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q94131
  source_id: Q94131
  review:
    reviewer: AI
    rubrics:
    - rubric: correctness
      score: 3
    - rubric: utility
      score: 4
    - rubric: compactness
      score: 3
    - rubric: completeness
      score: 4
    - rubric: specificity
      score: 4
    overall_notes: Cited and mostly correct on germline fate, Pol II repression, nos-2 expression
      and the adult SUMO/gei-17/piRNA roles. Two statements are wrong. "Inhibits the histone
      deacetylase activity of hda-1" inverts PMID:34003111, which shows PIE-1 promotes HDA-1
      SUMOylation and hypoacetylation. "Represses transcriptional activation of cdk-9 and
      cit-1.1" misstates P-TEFb inhibition as repression of those genes. It omits mom-2 3'-UTR
      binding and oocyte silencing.
- source: Alliance_Imported
  text: pie-1 encodes a C-x8-C-x5-C-x3-H-type zinc-finger protein; maternally provided PIE-1
    is essential for germline cell fate determination, as it functions as a repressor of RNA
    polymerase II-dependent gene expression in the developing germ line; PIE-1 localization,
    initially uniform and then concentrated in the posterior germ cell lineages, is regulated
    by other maternally supplied gene products including PAR-1, MEX-5, and MEX-6.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00004027;class=Gene
  source_id: WB:WBGene00004027
  review:
    reviewer: AI
    rubrics:
    - rubric: correctness
      score: 5
    - rubric: utility
      score: 4
    - rubric: compactness
      score: 4
    - rubric: completeness
      score: 3
    - rubric: specificity
      score: 4
    overall_notes: Every claim traces to the literature (germline fate, Pol II repression,
      uniform then posterior localization under PAR-1 and MEX-5/6). The C-x8-C-x5-C-x3-H type
      is that of ZF1. It omits the second, cytoplasmic function (nos-2 and mom-2 expression),
      the ZIF-1 degradation mechanism and the adult germline roles.
- source: Alliance_Automated
  text: Predicted to enable mRNA 3'-UTR AU-rich region binding activity; mRNA regulatory element
    binding translation repressor activity; and protein-RNA sequence-specific adaptor activity.
    Involved in several processes, including formation of primary germ layer; negative regulation
    of protein phosphorylation; and negative regulation of transcription by RNA polymerase
    II. Located in several cellular components, including P granule; centrosome; and cytosol.
    Is expressed in several structures, including P0; germ line; head muscle; nerve ring;
    and oocyte.
