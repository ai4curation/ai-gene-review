findings:
- category: discrepancy
  text: UniProt says PIE-1 inhibits HDA-1 deacetylase activity, citing PMID:34003111, but
    that paper shows PIE-1 promotes HDA-1 SUMOylation, MEP-1/HDA-1 association and germline
    chromatin hypoacetylation. Recorded as a CONFIRMED UniProt source defect.
  sources:
  - UniProt
- category: discrepancy
  text: The automated text presents PIE-1 as a TTP-like translational repressor and deadenylation
    adaptor (IBA), while the literature shows PIE-1 binding the mom-2 3' UTR and promoting
    mom-2 and nos-2 expression. The review marks the repressor rows over-annotated and generalises
    ARE binding to mRNA 3'-UTR binding.
  sources:
  - Alliance_Automated
  - RefSeq
- category: gap
  text: No source mentions PIE-1's RNA binding (mom-2 3' UTR, PMID:24131629) or its positive
    role in mom-2 translation. WormBase also omits nos-2. The review adds a NEW positive regulation
    of translation row.
  sources:
  - UniProt
  - Alliance_Imported
  - Alliance_Automated
- category: gap
  text: No source mentions PIE-1's requirement for transcriptional silencing of oocytes or
    its nucleolar sequestration there (PMID:37478128). The review adds a NEW nucleolus row.
  sources:
  - UniProt
  - Alliance_Imported
- category: insight
  text: UniProt's "Represses transcriptional activation of cdk-9 and cit-1.1" conflates inhibition
    of P-TEFb activity with repression of the P-TEFb genes; moreover the P-TEFb arm is dispensable
    for repression (PMID:18202370). Recorded as a PROBABLE defect.
  sources:
  - UniProt
review:
  reviewer: AI
  rubrics:
  - rubric: overall_concordance
    score: 3
  overall_notes: WormBase and UniProt agree on the core (maternal germline fate determinant
    that represses Pol II transcription), and UniProt adds the nos-2 and adult SUMO roles.
    The automated text, built from the GO annotations, instead foregrounds TTP-family translational
    repression that PIE-1 is not known to perform.
