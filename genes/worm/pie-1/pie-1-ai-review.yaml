      homolog LET-418, which remodel chromatin to maintain somatic differentiation.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The paper's own model makes MEP-1/LET-418 the remodelers and PIE-1 their inhibitor in
      the germline. Kim et al. (2021) revised the sign for the adult germline, where PIE-1
      promotes HDA-1 SUMOylation, MEP-1/HDA-1 association and chromatin hypoacetylation.
