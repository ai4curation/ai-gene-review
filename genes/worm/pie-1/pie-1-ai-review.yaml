id: Q94131
gene_symbol: pie-1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: >-
  pie-1 encodes PIE-1, a maternally supplied 335-residue protein with two CCCH (TIS11-type)
  zinc fingers that is the germline fate determinant of the early C. elegans embryo. PIE-1
  is segregated to the germline (P) blastomeres at each asymmetric division, by a
  reaction-diffusion gradient set up downstream of the PAR polarity proteins and MEX-5/6,
  by ZIF-1/CUL-2-dependent degradation of the protein (through its first zinc finger) in
  somatic daughters, and by its own translation in the P lineage. In the nuclei of P2-P4
  it globally represses RNA polymerase II transcription, blocking CTD Ser2 and Ser5
  phosphorylation; a C-terminal CTD-like YAPMAPT motif binds cyclin T and inhibits
  P-TEFb, but a second mechanism that blocks Ser5 phosphorylation is the one essential for
  repression. Repression keeps maternal somatic determinants such as SKN-1 from acting in
  the germline, so in pie-1 mutants P2 adopts an EMS-like somatic fate and makes extra
  pharynx and intestine. In the cytoplasm and P granules PIE-1 has a second, genetically
  separable function: it binds the 3' UTR of mom-2 mRNA in vitro and promotes expression
  of the maternal mRNAs mom-2 and nos-2 in the P lineage, through its second zinc finger,
  which also targets it to P granules. In the adult hermaphrodite germline PIE-1 is
  SUMOylated on Lys68 and, with the SUMO machinery, promotes SUMOylation of HDA-1,
  MEP-1/HDA-1 association and chromatin hypoacetylation; with the SUMO E3 GEI-17 it
  supports piRNA-dependent silencing. PIE-1 is also required for global transcriptional
  silencing of prophase-arrested oocytes, where it is held in the nucleolus until the
  nucleolus dissolves.
