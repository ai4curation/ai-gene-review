  review:
    summary: >-
      Phylogenetic inference from the tristetraprolin (TTP/ZFP36) clade, whose members
      recruit CCR4-NOT to deadenylate ARE-containing mRNAs. No deadenylation role has been
      reported for PIE-1.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The IBD at PTN002648882 is seeded by mammalian ZFP36/TTP proteins. PIE-1 sits in a
      nematode-specific subfamily (PTHR12547:SF132) whose known functions differ from TTP:
      nuclear repression of Pol II transcription and, in the cytoplasm, promotion of
      expression of its known target mRNAs, mom-2 and nos-2, not their decay
      (PMID:11316796, PMID:30279189). No study has examined poly(A) length or CCR4-NOT
      recruitment by PIE-1. The claim is not refuted, but nothing on PIE-1 supports it, and
      what is known points the other way.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: PANTHER:PTN002648882
        source_label: PTHR12547 TIS11/ZFP36 node (Eumetazoa)
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: The deadenylation IBD rests on mammalian TTP-family seeds (ZFP36, ZFP36L1).
          PIE-1 descends from the node, but its characterised cytoplasmic activity on mom-2 and
          nos-2 is activation of expression, and its main function is nuclear.
      residue_claims_not_applicable: Process claim; no residue-level argument is made.
    supported_by:
    - reference_id: PMID:11316796
      supporting_text: activation of protein expression from nos-2 and possibly other maternal
        RNAs, which promotes primordial germ cell development
    - reference_id: PMID:30279189
