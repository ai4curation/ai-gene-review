      repression and reduces NOS-2 expression (PMID:11316796), and Gauvin et al. (2018)
      summarise PIE-1 as regulating translation of mom-2 and nos-2. Comparator check:
      maternal RBPs that regulate translation do carry translation-regulation terms (OMA-1
      negative regulation of translation, IMP; MEX-3 negative regulation of translation and
      positive regulation of gene expression, IMP), so the absence of this term on PIE-1 is
      a gap, not a convention. The term is not an ancestor or descendant of other PIE-1
      terms.
