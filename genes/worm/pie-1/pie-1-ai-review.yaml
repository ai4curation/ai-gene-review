- term:
    id: GO:0000122
    label: negative regulation of transcription by RNA polymerase II
  evidence_type: IDA
  original_reference_id: PMID:9925644
  qualifier: involved_in
  review:
    summary: >-
      PIE-1 represses RNA polymerase II transcription. In cell-culture assays a GAL4
      DNA-binding-domain fusion of PIE-1 acts as a transcriptional repressor, and in
      embryos PIE-1 is required to keep the germline blastomeres transcriptionally silent.
    action: ACCEPT
    reason: >-
      This is the best-established activity of PIE-1 and the basis of its role as germline
      fate determinant. Batchelder et al. (1999) mapped a repression domain whose CTD-like
      element is needed both for repression and for transgene rescue. In embryos, newly
      transcribed RNAs accumulate in germline blastomeres of pie-1 mutants, ectopic PIE-1
      reduces transcription in somatic cells (PMID:8751441), and PIE-1 is required for the
      germline-specific absence of phosphorylated Pol II (PMID:9187145). PIE-1 is also
      needed for transcriptional silencing of oocytes (PMID:37478128). Core function.
    supported_by:
    - reference_id: PMID:9925644
      supporting_text: We have determined that PIE-1 can function as a transcriptional repressor
        in cell culture assays.
    - reference_id: PMID:8751441
      supporting_text: Furthermore, ectopic expression of PIE-1 in somatic blastomeres can significantly
        reduce the accumulation of new transcripts in these cells.
    - reference_id: PMID:9187145
      supporting_text: We show here that PIE-1 is also required for the germ-line-specific pattern
        of RNA polymerase II phosphorylation.
    - reference_id: PMID:37478128
      supporting_text: we show that all three of these silencing systems, TOP-2/condensin II, H3K9me,
        and PIE-1, are required for transcriptional repression in oocytes.
- term:
