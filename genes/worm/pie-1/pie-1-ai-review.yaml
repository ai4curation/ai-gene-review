- term:
    id: GO:0001704
    label: formation of primary germ layer
  evidence_type: IMP
  original_reference_id: PMID:8751440
  qualifier: involved_in
  review:
    summary: >-
      In pie-1 mutants the germline blastomeres adopt somatic fates: P2 behaves like EMS and
      produces extra pharyngeal mesoderm and intestinal endoderm.
    action: KEEP_AS_NON_CORE
    reason: >-
      PIE-1's contribution to germ-layer formation is restrictive. It keeps the P lineage
      out of the SKN-1-dependent mesendoderm program by silencing transcription, so loss of
      PIE-1 produces excess germ-layer tissue from P2. The annotation records a real
      developmental consequence of the gene's core activity, but PIE-1 is not a germ-layer
      specifier, so it is kept as non-core.
    supported_by:
    - reference_id: PMID:8751440
      supporting_text: Mutations in the maternal gene pie-1 result in the germline blastomeres adopting
        somatic cell fates.
- term:
    id: GO:0001709
    label: cell fate determination
  evidence_type: IMP
  original_reference_id: PMID:1623520
  qualifier: involved_in
  review:
    summary: >-
      Maternal pie-1 is required for blastomere identity: in pie-1 mutants an additional
      posterior blastomere (P2) adopts an MS-like fate.
    action: ACCEPT
    reason: >-
      PIE-1 is the classic maternal determinant of germline fate in the early embryo. It
      acts in the germline blastomeres themselves, and its loss converts P2 to a somatic
      fate (PMID:1623520, PMID:8751440). GO has no germline-specification term below cell
      fate determination that fits a nematode germline blastomere, so this term is as
      precise as the ontology allows. Core process.
    supported_by:
    - reference_id: PMID:1623520
      supporting_text: In pie-1 mutants one additional posterior blastomere adopts an MS-like fate
    - reference_id: PMID:8751440
