- id: file:worm/pie-1/pie-1-uniprot.txt
  title: UniProtKB/Swiss-Prot entry Q94131 (pie-1)
  findings: []
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: >-
      CC FUNCTION statements on germline fate, Pol II repression, nos-2 expression, the gei-17
      redundancy in piRNA silencing and adult HDA-1 SUMOylation agree with the literature.
      Two statements do not. (1) "Inhibits the histone deacetylase activity of hda-1
      (PubMed:34003111)" inverts the cited paper, which shows PIE-1 promotes HDA-1
      SUMOylation, MEP-1/HDA-1 association and chromatin hypoacetylation and does not assay
      deacetylase activity. (2) "Represses transcriptional activation of cdk-9 and cit-1.1"
      reads as repression of the P-TEFb genes; the papers show PIE-1 binds cyclin T and
      inhibits P-TEFb activity. The DISRUPTION PHENOTYPE line "Does not affect embryo
      viability or brood size of animals (PubMed:34003111)" is also confusing, since pie-1
      loss is maternal-effect lethal; the 2021 paper reports normal viability for tagged
      strains and pie-1(zu154) heterozygotes. It is noted here and not filed, because only
      the FUNCTION text was audited.
    source_defects:
    - defect_type: WRONG_STATEMENT
      resource: UNIPROT
      record: UniProtKB:Q94131
      slot: CC:FUNCTION
      requested_change: CHECK
      asserted_value: Inhibits the histone deacetylase activity of hda-1 (PubMed:34003111)
      confidence: CONFIRMED
      explanation: >-
        The CC FUNCTION comment says PIE-1 "Inhibits the histone deacetylase activity of
        hda-1 (PubMed:34003111)". The cited paper reports the opposite for the adult
        germline: PIE-1, with the SUMO pathway, promotes HDA-1 SUMOylation and the
        association of MEP-1 with HDA-1, and maintains hypoacetylation of germline chromatin
        (H3K9ac rises in pie-1(K68R) gonads). It does not measure deacetylase activity. The
        inhibition model came from the earlier embryo work (PMID:12507426), which the 2021
        paper explicitly revises. Suggested text: "Promotes the sumoylation of hda-1 and its
        association with mep-1 in the adult germline, and maintains histone hypoacetylation
        of germline chromatin (PubMed:34003111)."
      supported_by:
      - reference_id: PMID:34003111
        supporting_text: Surprisingly, whereas PIE-1 was originally thought to inhibit the MEP-1/Mi-2/HDA-1
          complex in embryos, we show that in the germline PIE-1 acts in concert with the SUMO pathway
          to promote the association of MEP-1 with HDA-1, and to maintain the hypoacetylation of germline
          chromatin.
      - reference_id: PMID:34003111
        supporting_text: These findings suggest that PIE-1(K68R) is compromised (but not completely
          inactive) for its ability to promote deacetylation of H3K9 in the adult germline.
    - defect_type: WRONG_STATEMENT
      resource: UNIPROT
      record: UniProtKB:Q94131
      slot: CC:FUNCTION
      requested_change: CHECK
      asserted_value: Represses transcriptional activation of cdk-9 and cit-1.1, which are members
        of the P-TEFb complex.
      confidence: PROBABLE
      explanation: >-
        The CC FUNCTION comment says PIE-1 "Represses transcriptional activation of cdk-9
        and cit-1.1, which are members of the P-TEFb complex." As written, this says PIE-1
        represses the cdk-9 and cit-1.1 genes. The cited work shows instead that PIE-1 binds
        the cyclin T subunit (CycT1 / CIT-1.1) through a CTD-like heptad and inhibits
        P-TEFb-dependent elongation (PMID:12651893), and that the YAPMAPT motif inhibits
        P-TEFb to block CTD Ser2 phosphorylation in vivo, an activity that is not essential
        for transcriptional repression (PMID:18202370). Suggested text: "Binds cit-1.1 and
        inhibits P-TEFb (cdk-9/cit-1.1)-dependent phosphorylation of the RNA polymerase II
        CTD." Filed as a query because the wording may be meant as shorthand for this.
      supported_by:
      - reference_id: PMID:12651893
        supporting_text: It binds CycT1 via an alanine-containing heptapeptide repeat and inhibits transcriptional
          elongation.
      - reference_id: PMID:18202370
        supporting_text: This activity is required to block serine 2 phosphorylation in germline blastomeres,
          but unexpectedly is not essential for transcriptional repression or specification of the
          germline.
- id: file:worm/pie-1/pie-1-deep-research-wormbase.md
  title: WormBase gene description for pie-1 (worm)
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      WormBase curated description (uncited, undated). Every claim was traced: the
      C-x8-C-x5-C-x3-H zinc finger type (true of ZF1; ZF2 has a 7-residue first spacer,
      checked on the sequence), the maternal requirement for germline fate
      (PMID:1623520, PMID:8751440), repression of Pol II-dependent expression
      (PMID:8751441, PMID:9187145, PMID:9925644), uniform then posterior localization
      (PMID:9705228), and control by PAR-1 and MEX-5/MEX-6 (PMID:9705228, PMID:10882103,
      PMID:12894212). It omits PIE-1's second, cytoplasmic function (3'-UTR binding and
      promotion of nos-2 and mom-2 expression), which is recorded as a missing statement.
      It also omits the adult germline roles (SUMOylation, HDA-1, piRNA silencing; PMID:34003111)
      and oocyte silencing (PMID:37478128).
    source_defects:
    - defect_type: MISSING_STATEMENT
      resource: WORMBASE
      record: WB:WBGene00004027
      slot: MOD_provided_gene_description
      requested_change: ADD
      asserted_value: WB:WBGene00004027
      confidence: CONFIRMED
      explanation: >-
        The description gives only PIE-1's transcriptional repression function. PIE-1 is a
        bifunctional protein: through its second CCCH finger it is also required for
        efficient expression of the maternal Nanos homolog NOS-2, separably from repression
        (PMID:11316796). It also binds the mom-2 3' UTR and promotes mom-2 translation in the
        P lineage (PMID:24131629; PMID:30279189). Suggested addition: "in the cytoplasm,
        PIE-1 also binds maternal mRNAs and promotes expression of nos-2 and mom-2 in the
        germline blastomeres."
      supported_by:
      - reference_id: PMID:11316796
        supporting_text: Here we show that PIE-1 has a second function in germ cells; it is required
          for efficient expression of the maternally encoded Nanos homolog NOS-2.
      - reference_id: PMID:30279189
        supporting_text: Consistent with this possibility, PIE-1 promotes the translation of mom-2
          mRNA in P2
suggested_questions:
- question: >-
    What is the P-TEFb-independent mechanism by which PIE-1 blocks CTD Ser5
    phosphorylation, which is the essential arm of transcriptional repression? Does PIE-1
    act on TFIIH/CDK-7 or on preinitiation complex assembly?
- question: >-
    What are the RNA sequence specificity and affinity of PIE-1's tandem zinc fingers, and is
    ZF1, which serves as the ZIF-1 degron, folded and RNA-binding in vivo?
- question: >-
    How does PIE-1 promote translation of mom-2 and nos-2 when its TTP-family relatives
    repress or destabilise their targets? Does it compete with repressors such as SPN-4 and
    MEX-3 for 3'-UTR sites, or recruit an activator?
- question: >-
    Is the GO annotation of PIE-1 to chromatin remodeling (from the MEP-1/LET-418 work) better
    expressed as regulation of chromatin organization, given the opposite signs reported for
    embryo and adult germline?
suggested_experiments:
- description: >-
    Map PIE-1 RNA targets in early embryos by CLIP or TRIBE, with ZF1 and ZF2 point mutants,
    and test the binding motifs in vitro with purified tandem zinc finger protein, to define
    the RNA-binding specificity behind the cytoplasmic function.
  experiment_type: CLIP-seq and in vitro RNA binding
- description: >-
    Measure CTD Ser5 and Ser2 phosphorylation and TFIIH/CDK-7 recruitment in germline
    blastomeres expressing PIE-1 variants lacking YAPMAPT or other C-terminal segments,
    combined with in vitro kinase assays of CDK-9 and CDK-7 with recombinant PIE-1.
  experiment_type: in vivo complementation and in vitro kinase assays
- description: >-
    Use polysome profiling or single-molecule translation reporters for mom-2 and nos-2 in
    pie-1 mutant and ZF2-mutant embryos to test whether PIE-1 promotes translation directly
    and whether it competes with SPN-4 and MEX-3 on the same 3'-UTR regions.
  experiment_type: translation reporter analysis
