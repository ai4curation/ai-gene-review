core_functions:
- description: >-
    In the nuclei of germline blastomeres (P2-P4), and in prophase-arrested oocytes, PIE-1
    globally represses RNA polymerase II transcription by blocking CTD Ser2 and Ser5
    phosphorylation. Its CTD-like YAPMAPT motif binds cyclin T to inhibit P-TEFb, and other
    sequences block Ser5 phosphorylation; the Ser5 block is essential. Repression keeps
    somatic programs off in the P lineage and so specifies germline fate.
  directly_involved_in:
  - id: GO:0000122
    label: negative regulation of transcription by RNA polymerase II
  - id: GO:0001709
    label: cell fate determination
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:8751441
    supporting_text: Furthermore, ectopic expression of PIE-1 in somatic blastomeres can significantly
      reduce the accumulation of new transcripts in these cells.
  - reference_id: PMID:18202370
    supporting_text: We find that sequences outside of the YAPMAPT are required to inhibit serine
      5 phosphorylation, and that this second inhibitory mechanism is essential for transcriptional
      repression and specification of the germ lineage.
  - reference_id: PMID:1623520
    supporting_text: In pie-1 mutants one additional posterior blastomere adopts an MS-like fate
- description: >-
    In the cytoplasm and P granules of germline blastomeres, PIE-1 binds the 3' UTR of mom-2 mRNA (the Wnt ligand needed for P2-EMS signalling) in vitro and promotes mom-2 translation, and it is required for efficient expression of the Nanos homolog NOS-2, although direct binding to nos-2 mRNA has not been shown. This second function depends on ZF2 and is
    genetically separable from transcriptional repression.
  molecular_function:
    id: GO:0003730
    label: mRNA 3'-UTR binding
  directly_involved_in:
  - id: GO:0045727
    label: positive regulation of translation
  locations:
  - id: GO:0005737
    label: cytoplasm
  - id: GO:0043186
    label: P granule
  supported_by:
  - reference_id: PMID:24131629
    supporting_text: These nine proteins all directly bind the mom-2 3'UTR in vitro and function
      as positive or negative regulators of mom-2 translation in vivo.
  - reference_id: PMID:30279189
    supporting_text: Consistent with this possibility, PIE-1 promotes the translation of mom-2
      mRNA in P2
  - reference_id: PMID:11316796
    supporting_text: A mutation in PIE-1's second CCCH finger reduces NOS-2 expression without affecting
      transcriptional repression
