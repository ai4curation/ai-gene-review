id: Q10925
gene_symbol: sid-3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: SID-3 is a cytoplasmic non-receptor tyrosine kinase of the ACK (activated Cdc42-associated
  kinase) family. It has an N-terminal tyrosine kinase domain, an SH3 domain and a Cdc42/Rac-interactive
  binding (CRIB) domain, and is the C. elegans ortholog of human ACK1/TNK2. SID-3 is expressed broadly
  (intestine, pharynx, body wall muscle, epidermis, excretory canal) and localizes diffusely and in puncta
  in the cytoplasm. It acts in recipient cells to promote efficient import of double-stranded RNA and
  mobile silencing RNA, and so is needed for systemic RNA interference. It is not required for cell-autonomous
  RNAi. This import role needs an intact kinase domain (the K139A ATP-binding mutant does not rescue)
  and has been proposed to work through endocytosis. SID-3 kinase activity is also required for infection
  by the Orsay virus at an early, pre-replication step, probably entry. In addition, sid-3 mutants constitutively
  derepress a set of antiviral response genes that are bound and repressed by the STAT factor STA-1, which
  places SID-3 genetically upstream of STA-1-mediated repression. The substrates of SID-3 are unknown.
