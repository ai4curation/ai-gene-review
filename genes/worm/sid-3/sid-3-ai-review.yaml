- term:
    id: GO:0035194
    label: regulatory ncRNA-mediated post-transcriptional gene silencing
  evidence_type: IMP
  original_reference_id: PMID:22912399
  qualifier: involved_in
  review:
    summary: sid-3 mutants are defective in silencing by mobile and ingested dsRNA in many tissues, but
      are not defective (and are marginally enhanced) in cell-autonomous RNAi.
    action: MODIFY
    reason: The phenotype is real, but the full text shows that SID-3 is not part of the silencing machinery.
      sid-3 mutants execute RNAi normally when dsRNA is injected into the syncytial germline. Tissue-specific
      rescue shows SID-3 works in the recipient cell to import dsRNA and mobile silencing RNA. The function
      SID-3 performs is therefore dsRNA import into cells, upstream of silencing. GO:0033227 dsRNA transport
      describes the step SID-3 contributes to more accurately than the general gene-silencing process.
    proposed_replacement_terms:
    - id: GO:0033227
      label: dsRNA transport
    supported_by:
    - reference_id: PMID:22912399
      supporting_text: Nevertheless, these results clearly demonstrate that sid-3 mutants are not defective
        in the execution of RNAi.
    - reference_id: PMID:22912399
      supporting_text: Thus, these results support the idea that SID-3 is specifically required to ensure
        the efficient import of mobile silencing RNA and dsRNA into C. elegans cells.
- term:
    id: GO:0050687
    label: negative regulation of defense response to virus
  evidence_type: IMP
  original_reference_id: PMID:28874466
  review:
    summary: sid-3 mutants constitutively upregulate antiviral response genes that overlap strongly with
      genes derepressed in sta-1 mutants and are enriched for STA-1 ChIP-seq binding.
    action: NEW
    reason: 'The RNA-seq data place the SID-3 kinase genetically upstream of STA-1-mediated repression
      of antiviral genes. SID-3 is a signalling kinase in this pathway, not a substrate, so a regulatory
      process term applies. This repression role is separate from the SID-3 requirement for virus entry:
      sta-1;sid-3 double mutants remain resistant. Evidence is transcriptomic and genetic, and the direct
      SID-3 substrate (possibly STA-1) is unknown.'
    supported_by:
    - reference_id: PMID:28874466
      supporting_text: Moreover, genes upregulated in sid-3 mutants, including those shared with sta-1,
        were enriched for STA-1 binding by ChIP-seq, suggesting that sid-3 acts upstream of sta-1 in the
        antiviral gene expression response
