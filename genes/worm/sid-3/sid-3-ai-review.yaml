suggested_questions:
- question: What are the direct substrates of SID-3? Does SID-3 phosphorylate STA-1, or the dynamin/clathrin
    endocytic machinery used for dsRNA and virus uptake?
- question: Is Cdc42 binding through the CRIB domain needed for SID-3 activation in dsRNA import and in
    Orsay virus entry?
suggested_experiments:
- description: Run phosphotyrosine proteomics on wild-type, sid-3 null and kinase-dead K139A animals to
    identify SID-3 substrates. Test STA-1 tyrosine phosphorylation directly.
- description: Test whether CRIB-domain point mutants of SID-3 rescue systemic RNAi and Orsay virus susceptibility
    in sid-3 mutants.
