      antiviral gene expression response
- id: PMID:28874467
  title: An Evolutionarily Conserved Pathway Essential for Orsay Virus Infection of Caenorhabditis elegans.
  findings:
  - statement: SID-3 kinase activity is required for an early pre-replication step of Orsay virus infection.
    supporting_text: Our experiments suggest that the kinase activity of SID-3 is important for its ability
      to promote Orsay virus infection.
