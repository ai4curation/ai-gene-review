descriptions:
- source: UniProt
  text: Tyrosine-protein kinase which plays a role in RNA-mediated gene silencing
    by mediating import of double-stranded RNA (dsRNA) into cells. Not required for
    import of ingested dsRNA into intestinal cells but involved in subsequent export
    from intestinal cells to internal tissues.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q10925
  source_id: Q10925
  review:
    reviewer: AI
    rubrics:
    - rubric: correctness
      score: 5
    - rubric: utility
      score: 4
    - rubric: compactness
      score: 5
    - rubric: completeness
      score: 3
    - rubric: specificity
      score: 4
    overall_notes: Correct tyrosine kinase for dsRNA import, needed for export from
      intestine to tissues. No antiviral or Orsay virus role.
- source: Alliance_Imported
  text: sid-3 encodes a nonreceptor tyrosine kinase that is a member of the activated
    cdc-42-associated kinase (Ack) subfamily of cytoplasmic tyrosine kinases; in C.
    elegans sid-3 functions to regulate the import of dsRNA into cells, thus affecting
    the efficiency of RNA-mediated gene silencing (RNAi); SID-3 localizes to the cytoplasm.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00002207;class=Gene
  source_id: WB:WBGene00002207
  review:
