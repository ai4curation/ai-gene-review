- source: Alliance_Automated
  text: Involved in several processes, including determination of adult lifespan;
    larval foraging behavior; and non-motile cilium assembly. Located in ciliary basal
    body; ciliary transition zone; and dendrite terminus. Is expressed in neurons.
    Used to study Joubert syndrome. Human ortholog(s) of this gene implicated in Meckel
    syndrome 10. Orthologous to human B9D2 (B9 domain containing 2).
