  qualifier: involved_in
  supporting_entities:
  - ARBA:ARBA00087662
  review:
    summary: ARBA-propagated developmental process; larval development depends on cgt-1 and cgt-3, not on
      cgt-2.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      This machine-learning (ARBA) row generalises the L1-arrest phenotype of cgt-1;cgt-3 double mutants to
      the whole CGT family. For cgt-2 the genetic data argue against it: no single cgt mutant arrests,
      cgt-1;cgt-2 and cgt-3;cgt-2 double mutants develop, and loss of cgt-2 does not enhance the
      cgt-1;cgt-3 arrest. The key paper on the developmental pathway (PMID:23705068) uses only cgt-1 and
      cgt-3 alleles. Even for cgt-1/cgt-3 the effect is a downstream consequence of lipid supply (feeding
      defect and TORC1 signalling) rather than the enzyme doing work within larval development, so this
      pleiotropic process term is not a function of CGT-2.
    supported_by:
    - reference_id: PMID:38704027
      supporting_text: Mutations or RNAi treatments that compromise any single one of them did not show
        obvious L1 arrest phenotype
    - reference_id: PMID:38704027
      supporting_text: cgt-3;cgt-2 or cgt-1;cgt-2 double mutants did not, and cgt-2(lf) did not further
        exacerbate the growth arrest phenotype of cgt-3;cgt-1 worms
    - reference_id: PMID:23705068
      supporting_text: cgt-1 and cgt-3 encode two ceramide glucosyltransferases that glucosylate ceramides
        to GlcCer
    source_defects:
    - defect_type: WRONG_TERM
      resource: UNIPROT
      slot: GO_ID
      requested_change: CHECK
      asserted_value: GO:0002119
      confidence: SUSPECTED
      explanation: >-
        ARBA rule ARBA00087662 assigns nematode larval development to cgt-2 (G5EC84), but the
        developmental requirement for ceramide glucosyltransferase in C. elegans rests on cgt-1;cgt-3
        double mutants; cgt-2 double mutants with either paralog do not arrest (PMID:38704027). Consider
        excluding cgt-2 from the rule's scope.
