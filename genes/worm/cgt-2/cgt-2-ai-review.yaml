- term:
    id: GO:1904508
    label: regulation of protein localization to basolateral plasma membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: involved_in
  supporting_entities:
  - ARBA:ARBA00090220
  review:
    summary: ARBA over-propagation of a cgt-1;cgt-3 intestinal polarity phenotype; not a function of CGT-2.
    action: REMOVE
    reason: >-
      The apicobasal polarity defect in the C. elegans intestine was found in cgt-1;cgt-3 double mutants
      and knockdowns (PMID:21926990); cgt-2 was not shown to be required. Moreover, the phenotype reflects
      an indirect, membrane-lipid-supply effect on vesicle trafficking: a glucosylceramide synthase does not
      itself regulate protein localization to the basolateral membrane. This machine-learned electronic
      row is therefore over-propagated both across paralogs and from phenotype to process.
    supported_by:
    - reference_id: PMID:21926990
      supporting_text: We found the polarity phenotype in double cgt-1(tm999);cgt-3(tm504) mutants
    - reference_id: PMID:38704027
      supporting_text: Regarding the CGTs, deficiency of cgt-3 but not cgt-1 or cgt-2 markedly decreased the
        abundance of all GlcCers quantified in C. elegans.
    source_defects:
    - defect_type: WRONG_TERM
      resource: UNIPROT
      slot: GO_ID
      requested_change: DELETE_ROW
      asserted_value: GO:1904508
      confidence: PROBABLE
      explanation: >-
        ARBA rule ARBA00090220 assigns regulation of protein localization to basolateral plasma membrane
        to cgt-2 (G5EC84). The underlying observation (PMID:21926990) is a polarity phenotype of
        cgt-1;cgt-3 double mutants, an indirect consequence of glycosphingolipid depletion; cgt-2 was not
        tested as required, and the enzyme has no regulatory role in protein localization.
