suggested_questions:
- question: In which tissues and subcellular compartment (Golgi, ER) does endogenous CGT-2 act, and does it
    supply glucosylceramide to the germline, where its knockout reduces brood size?
- question: Does CGT-2 differ from CGT-1 and CGT-3 in substrate preference (for example ceramide acyl chain
    length or hydroxylation), which would explain its small contribution to bulk GlcCer?
- question: Which C. elegans gene was the glucosylceramide synthase identified by Leipelt et al. 2001
    (PMID:11443131), given that UniProt credits that study for cgt-2 activity?
suggested_experiments:
- description: Endogenous CRISPR tagging of CGT-2 to map its tissue and subcellular localization, with
    Golgi and ER markers.
  hypothesis: CGT-2 is a Golgi membrane enzyme expressed in the germline and a subset of somatic tissues.
- description: Germline-specific rescue of cgt-2(tm1192) and lipidomics of isolated gonads.
  hypothesis: CGT-2 supplies a germline glucosylceramide pool needed for normal oogenesis and embryonic
    cytokinesis.
