- id: PMID:21325339
  title: Ceramide glucosyltransferase of the nematode Caenorhabditis elegans is involved in oocyte formation
    and in early embryonic cell division.
  findings:
  - statement: Each of the three C. elegans CGTs, including CGT-2, has UGCG activity when expressed in
      GSL-deficient GM95 cells; single knockouts reduce brood size.
    supporting_text: Each gene product showed active enzymatic activity when expressed in GM95 cells deficient
      in glycosphingolipids (GSLs).
  - statement: Single-gene knockouts reduce brood size with abnormal oocytes and multinucleated embryos.
    supporting_text: When each gene function was disrupted, the brood size of the animal markedly decreased,
      and abnormal oocytes and multinucleated embryos were formed.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract only; title and abstract match PubMed. The only paper reporting a cgt-2 knockout
      and activity of the CGT-2 protein.
- id: PMID:38704027
  title: Sphingolipid profiling reveals differential functions of sphingolipid biosynthesis isozymes of
    Caenorhabditis elegans.
  findings:
  - statement: CGT-3, not CGT-1 or CGT-2, is the major in vivo glucosylceramide synthase.
    supporting_text: These results demonstrate that CGT-3 is the major enzyme for GlcCer production
  - statement: cgt-2 is not required for larval development, alone or with either paralog.
    supporting_text: cgt-3;cgt-2 or cgt-1;cgt-2 double mutants did not, and cgt-2(lf) did not further exacerbate
      the growth arrest phenotype of cgt-3;cgt-1 worms
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text read; uses a cgt-1(tm1027);cgt-2(tm1192) double mutant.
- id: PMID:23705068
  title: A novel sphingolipid-TORC1 pathway critically promotes postembryonic development in Caenorhabditis
    elegans.
  findings:
  - statement: d17iso-glucosylceramide made by CGT-1 and CGT-3 promotes postembryonic development via TORC1;
      cgt-2 is not examined in this paper.
    supporting_text: cgt-1 and cgt-3 encode two ceramide glucosyltransferases that glucosylate ceramides to
      GlcCer
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Full text read. Key paper for the GlcCer-TORC1 developmental pathway, but it uses only
      cgt-1(tm1027) and cgt-3(tm504) and never mentions cgt-2; relevant only as pathway context.
- id: PMID:21926990
  title: Apicobasal domain identities of expanding tubular membranes depend on glycosphingolipid biosynthesis.
  findings:
  - statement: Intestinal apicobasal polarity defects arise in cgt-1;cgt-3 double mutants, not shown for
      cgt-2.
    supporting_text: We found the polarity phenotype in double cgt-1(tm999);cgt-3(tm504) mutants
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Full text available; likely the source of the ARBA basolateral-localization rule, but the
      data concern cgt-1/cgt-3.
- id: PMID:19240113
  title: Expression of ceramide glucosyltransferases, which are essential for glycosphingolipid synthesis,
    is only required in a small subset of C. elegans cells.
  findings:
  - statement: C. elegans encodes three CGTs required for GSL biosynthesis; CGT-deficient larvae arrest
      at L1 owing to digestive-tract defects.
    supporting_text: The C. elegans genome encodes three ceramide glucosyltransferase (CGT) genes, which encode
      enzymes required for GSL biosynthesis.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract only (PMC full text could not be retrieved); does not state the individual cgt-2
      contribution.
- id: PMID:11443131
  title: Glucosylceramide synthases, a gene family responsible for the biosynthesis of glucosphingolipids
    in animals, plants, and fungi.
  findings:
  - statement: A C. elegans glucosylceramide synthase gene was identified by heterologous expression in
      GlcCer-deficient yeast.
    supporting_text: five novel glucosylceramide synthase (UDP-glucose:ceramide glucosyltransferase) genes
      were identified from the plant Gossypium arboreum (cotton), the nematode Caenorhabditis elegans
  reference_review:
    relevance: MEDIUM
    correctness: UNVERIFIED
    review_notes: Abstract only; UniProt cites it for cgt-2 catalytic activity, and the cgt-2 mRNA (AF364401)
      is from this study, but the abstract does not name the gene tested.
