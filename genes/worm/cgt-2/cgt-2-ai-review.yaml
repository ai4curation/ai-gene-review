gene_symbol: cgt-2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: >-
  cgt-2 (F20B4.6) encodes ceramide glucosyltransferase 2, one of three C. elegans UDP-glucose:ceramide
  glucosyltransferases (with cgt-1 and cgt-3) of the glycosyltransferase family 2 / GT21 (Pfam
  Glyco_transf_21). It is a predicted multi-pass membrane protein carrying the D1, D2, D3 and (Q/R)XXRW
  catalytic motifs, and it transfers glucose from UDP-glucose to ceramide to form glucosylceramide, the
  first committed step of glycosphingolipid biosynthesis; in C. elegans the ceramide substrates carry a
  branched-chain d17iso sphingoid base. Expressed in GSL-deficient mammalian cells, CGT-2 shows
  glucosylceramide synthase activity, but in vivo it is a minor isozyme: lipidomics shows that CGT-3
  produces most glucosylceramide, and the L1 larval arrest of CGT deficiency requires loss of cgt-1 and
  cgt-3, not cgt-2. A cgt-2 knockout has a reduced brood size with abnormal oocytes and multinucleate
  embryos, consistent with a contribution of glucosylceramide supply to the germline.
