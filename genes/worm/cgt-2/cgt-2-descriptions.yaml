    overall_notes: Correct, cited glucosylceramide synthase text. Does not say that
      CGT-2 is a minor isozyme in vivo.
- source: Alliance_Imported
  text: cgt-2 encodes a transmembrane protein that is one of three C. elegans ceramide
    glucosyltransferases; by homology, CGT-2 is predicted to localize to the Golgi
    membrane and catalyze the transfer of glucose from UDP-glucose to ceramide to
    synthesize glucosylceramide, a glycosphingolipid precursor; although cgt-2 mutant
    worms show no obvious defects, cgt-3;cgt-1;cgt-2 triply mutant animals show reduced
    glucosylceramide levels; expression of cgt-2 in Saccharomyces cerevisiae results
    in de novo biosynthesis of glucosylceramides, absent from the parental strain.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00017625;class=Gene
