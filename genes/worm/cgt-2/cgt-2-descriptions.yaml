descriptions:
- source: UniProt
  text: Catalyzes the first glycosylation step in glycosphingolipid biosynthesis,
    the transfer of glucose to ceramide to produce glucosylceramides (GlcCer). GlcCer
    are known to contribute to the physical properties and physiological functions
    of membranes and may regulate signal transduction (PubMed:11443131, PubMed:19240113,
    PubMed:21325339). Only branched-chain sphingoid bases like 15- methylhexadecasphing-4-enine
    are used for generating complex sphingolipids in Caenorhabditis elegans (PubMed:7651085).
  source_type: curated
  url: https://www.uniprot.org/uniprot/G5EC84
  source_id: G5EC84
