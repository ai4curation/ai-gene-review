descriptions:
- source: UniProt
  text: Functions with mex-6 to affect embryonic viability, establish soma germline
    asymmetry in embryos and establish plk-1, pie-1, mex-1, and pos-1 asymmetry in
    embryos (PubMed:10882103, PubMed:18199581, PubMed:18842813, PubMed:30279189).
    Also affects formation of intestinal cells (PubMed:10882103). Binds to mRNA in
    vitro, and inhibits pgl-3- mediated P-granule formation, probably by competing
    with pgl-3 for binding to mRNA (PubMed:27594427). Required for neg-1 expression
    in anterior blastomeres during embryogenesis (PubMed:26096734).
