    supporting_text: we show that MEX-5 dissolves preassembled liquid-like PGL-3/RNA condensates
      by altering RNA availability and shifting the phase boundary.
  - reference_id: PMID:27594427
    supporting_text: MEX-5 can regulate PGL-3 drop formation by competing with PGL-3 for mRNA binding.
- description: MEX-5 establishes soma/germline asymmetry by forming an anterior-enriched gradient
    that inhibits germline protein expression in somatic cell precursors. This links PAR protein
    polarity to downstream developmental asymmetries.
  molecular_function:
