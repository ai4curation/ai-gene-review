- id: PMID:18199581
  title: Polo kinases regulate C. elegans embryonic polarity via binding to DYRK2-primed MEX-5 and
    MEX-6.
  findings:
  - statement: MEX-5 binds PLK-1 and PLK-2 via polo box domains when phosphorylated on T186
    supporting_text: We show that polo kinases, via their polo box domains, bind to and regulate
