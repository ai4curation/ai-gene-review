taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: 'MEX-5 is a tandem CCCH zinc-finger RNA-binding protein that works with MEX-6 to pattern
  maternal gene expression and soma/germline asymmetry in the early Caenorhabditis elegans embryo.
  It preferentially binds U-rich RNA, including AU-rich 3′-UTR elements. Its effects depend on the
  RNA target: MEX-5/6 promote zif-1 expression and repress maternal mom-2 translation. PAR-dependent
  phosphorylation and mobility changes generate an anterior-enriched cytoplasmic gradient; MEX-5
  also binds Polo kinases and contributes to their asymmetric localization. By binding RNA, MEX-5
  can dissolve reconstituted PGL-3/RNA condensates, providing a mechanism for spatial control of
  germ granules together with other embryonic factors. Tagged MEX-5 is also observed on granules
  in germline blastomeres.'
