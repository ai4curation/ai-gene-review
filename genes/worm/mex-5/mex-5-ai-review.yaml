    summary: MEX-5 directly disassembles PGL-3/RNA condensates and patterns embryonic P granules.
    action: NEW
    reason: 'Retain this authored process proposal: MEX-5 does the work by binding RNA and altering
      the interactions that sustain the condensate. The 2016 reconstitution prevented assembly and
