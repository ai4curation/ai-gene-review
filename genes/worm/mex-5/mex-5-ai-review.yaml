    summary: MEX-5 retains the phylogenetically inferred contribution to mRNA poly(A) tail shortening.
    action: ACCEPT
    reason: Actual descent from positive IBD PTN002648882 is verified. MEX-5/6-dependent maternal RNA
      turnover and recruitment of P-body decay machinery are biologically consistent with the transfer.
