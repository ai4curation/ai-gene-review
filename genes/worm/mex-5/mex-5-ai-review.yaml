- id: PMID:10882103
  title: MEX-5 and MEX-6 function to establish soma/germline asymmetry in early C. elegans embryos.
  findings:
  - statement: MEX-5 is a novel cytoplasmic CCCH zinc finger protein
    supporting_text: MEX-5 is a novel, cytoplasmic protein that is localized through PAR activities
      to the anterior pole of the 1-cell stage embryo.
  - statement: MEX-5 localizes to the anterior of 1-cell embryo through PAR activities
    supporting_text: MEX-5 is a novel, cytoplasmic protein that is localized through PAR activities
      to the anterior pole of the 1-cell stage embryo.
  - statement: Localization is reciprocal to posterior germline proteins
    supporting_text: MEX-5 localization is reciprocal to that of a group of posterior-localized proteins
      called germline proteins.
  - statement: Ectopic MEX-5 inhibits germline protein expression
    supporting_text: Ectopic expression of MEX-5 is sufficient to inhibit the expression of germline
      proteins, suggesting that MEX-5 functions to inhibit anterior expression of the germline proteins.
  - statement: mex-5 and mex-6 are nearly identical genes with redundant function
    supporting_text: We provide evidence that two nearly identical genes, mex-5 and mex-6, link PAR
      asymmetry to those subsequent protein asymmetries.
- id: PMID:12588843
  title: Polarization of the C. elegans zygote proceeds via distinct establishment and maintenance
    phases.
  findings:
  - statement: MEX-5/6 function during establishment phase of polarity
    supporting_text: The kinase PAR-1 and the CCCH finger proteins MEX-5 and MEX-6 also function
      during the establishment phase in a feedback loop to regulate growth of the posterior domain.
  - statement: MEX-5/6 participate in feedback loop with PAR-1 to regulate posterior domain
    supporting_text: The kinase PAR-1 and the CCCH finger proteins MEX-5 and MEX-6 also function
      during the establishment phase in a feedback loop to regulate growth of the posterior domain.
  - statement: GFP-tagged MEX-5 shows dynamic cytoplasmic localization
    supporting_text: Using time-lapse microscopy and GFP fusions, we have analyzed the localization
      dynamics of PAR-2, PAR-6, MEX-5, MEX-6 and PIE-1 in wild-type and mutant embryos.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only central cache supplemented by explicitly labeled indexed primary
      Results in the primary-evidence note; neither the title nor the abstract alone describes all
      target assays.
  full_text_unavailable: true
- id: PMID:17264081
  title: Molecular basis of RNA recognition by the embryonic polarity determinant MEX-5.
  findings:
  - statement: MEX-5 binds RNA with high affinity but low specificity
    supporting_text: Here we show that the TZF protein MEX-5, a primary anterior determinant, is
      an RNA-binding protein that recognizes linear RNA sequences with high affinity but low specificity.
  - statement: Minimal binding site is 6+ uridine tract within 9-13 nucleotide window
    supporting_text: The minimal binding site is a tract of six or more uridines within a 9-13-nucleotide
      window.
  - statement: Poly-U tracts abundant in C. elegans 3'-UTRs
    supporting_text: This sequence is remarkably abundant in the 3'-untranslated region of C. elegans
      transcripts
  - statement: MEX-5 differs from TTP/ERF-2 in binding specificity
    supporting_text: In contrast, human TZF homologs tristetraprolin and ERF-2 bind with high specificity
      to UUAUUUAUU elements.
  - statement: Mutating a discriminator residue in each zinc finger confers TTP-like RNA specificity.
    supporting_text: We show that mutation of a single amino acid in each MEX-5 zinc finger confers
      tristetraprolin-like specificity to this protein.
