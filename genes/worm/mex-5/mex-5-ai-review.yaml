      tag effects limit extrapolation to the complete embryo.
core_functions:
- description: MEX-5 preferentially binds U-rich RNA and can disassemble preassembled PGL-3/RNA condensates
    by changing RNA availability and condensate interactions. Direct reconstitution supports its
    contribution to embryonic P-granule segregation, with additional MEG proteins and kinase regulation
    operating in vivo.
