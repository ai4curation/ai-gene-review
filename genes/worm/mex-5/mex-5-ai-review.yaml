  - statement: Polo kinase localization depends on MEX-5/6
    supporting_text: This asymmetric localization of polo kinases depends on MEX-5 and MEX-6, as
      well as genes regulating MEX-5 and MEX-6 asymmetry.
- id: PMID:27594427
  title: Polar Positioning of Phase-Separated Liquid Compartments in Cells Regulated by an mRNA Competition
    Mechanism.
  findings:
  - statement: P granules are liquid-like phase-separated compartments
    supporting_text: P granules are non-membrane-bound RNA-protein compartments that are involved
      in germline development in C. elegans. They are liquids that condense at one end of the embryo
      by localized phase separation
  - statement: PGL-3 alone can form P granule-like droplets in vitro
    supporting_text: We reconstitute P granule-like droplets in vitro using a single protein PGL-3.
  - statement: MEX-5 competes with PGL-3 for mRNA binding
    supporting_text: we show that competition between PGL-3 and MEX-5 for mRNA can regulate the formation
      of PGL-3 droplets.
  - statement: A competition-based model explains spatial demixing; the 2016 assay prevented formation,
      while direct preassembled-condensate dissolution was demonstrated later in PMID40354522.
    supporting_text: In this model, MEX-5 influences the demixing of PGL-3 and mRNA by depleting
      the local free mRNA concentration.
  - statement: MEX-5 gradient regulates local phase separation of P granules
    supporting_text: We conclude that gradients of polarity proteins can position RNP granules during
      development by using RNA competition to regulate local phase separation.
- id: file:worm/mex-5/mex-5-deep-research-falcon.md
  title: Falcon deep research report on MEX-5 (C. elegans, UniProt Q9XUB2)
  findings:
  - statement: 'MEX-5 is a cytoplasmic, tandem CCCH-type zinc-finger RNA-binding protein that

      becomes anterior-enriched in the one-cell embryo and functions redundantly with

      MEX-6 to translate cortical PAR polarity into cytoplasmic asymmetries.'
    supporting_text: '*mex-5* encodes a cytoplasmic RNA-binding protein with tandem CCCH-type zinc
      finger domains that becomes enriched in the anterior cytoplasm of the one-cell *C. elegans*
      embryo and functions redundantly with *mex-6* to translate cortical PAR polarity into cytoplasmic
      asymmetries.'
    reference_section_type: OTHER
  - statement: 'The anterior-high MEX-5 gradient is generated by a spatially segregated

      kinase/phosphatase cycle: posterior PAR-1 phosphorylates MEX-5 and a broadly

      distributed PP2A/LET-92 phosphatase reverses it, interconverting MEX-5 between

      slow- and fast-diffusing states without localized synthesis or degradation.'
    supporting_text: a posterior-high PAR-1 kinase activity gradient and a broadly distributed phosphatase
      activity (PP2A/LET-92) drive phosphorylation-state interconversion between slow and fast diffusing
      MEX-5 species, yielding net anterior enrichment.
    reference_section_type: OTHER
  - statement: 'PAR-1 phosphorylates MEX-5 at mapped sites S404 and S458; an S404A/S458A double

      mutant is not phosphorylated in vitro by activated PAR-1, linking these

      phosphosites to the diffusivity-gradient mechanism.'
    supporting_text: PAR-1 phosphorylates MEX-5** in vitro and in vivo, with mapped sites including
      **S404** and **S458**; an S404A/S458A double mutant is not phosphorylated in vitro by activated
      PAR-1.
    reference_section_type: OTHER
  - statement: 'MEX-5/6 are RNA-binding polarity mediators that act largely through translational

      control; their CCCH zinc fingers are required for normal mobility and asymmetry,

      coupling RNA binding to gradient formation.'
    supporting_text: MEX-5/6 are **RNA-binding polarity mediators** that act largely through **translational
      control** and regulated association with RNA-containing complexes. Their CCCH zinc fingers
      are required for normal mobility/asymmetry
    reference_section_type: OTHER
  - statement: 'A well-supported translational-control output is positive regulation of the

      zif-1 3''UTR: MEX-5/6 antagonize POS-1 repression to promote somatic zif-1

      expression, enabling ZIF-1-dependent degradation of germline determinants

      (PIE-1, POS-1, MEX-1) in somatic cells.'
    supporting_text: MEX-5/6 bind the *zif-1* 3′UTR and promote its expression in somatic lineages
      by antagonizing POS-1 repression, enabling ZIF-1–dependent degradation of germline proteins
      such as PIE-1/POS-1/MEX-1 in somatic cells
    reference_section_type: OTHER
  - statement: 'MEX-5 acts as a scaffold/adaptor: it is required for anterior enrichment of

      PLK-1 and PLK-2, which bind MEX-5/6 via their polo-box domains. Disrupting

      MEX-5-PLK binding impairs MEX-5 activities (e.g. promoting PIE-1 degradation)

      without abolishing MEX-5 asymmetry.'
    supporting_text: MEX-5/6 are required for **anterior enrichment of PLK-1 and PLK-2**, and PLK-1/2
      bind MEX-5/6 via their **polo-box domains**. Disrupting MEX-5–PLK binding impairs key MEX-5
      activities (e.g., promoting PIE-1 degradation) without necessarily eliminating MEX-5 asymmetry,
      consistent with an adaptor/scaffold role rather than purely a localization effect.
    reference_section_type: OTHER
  - statement: 'The MEX-5 gradient is conceptually coupled to P-granule phase behavior: high

      anterior MEX-5 correlates with P-granule dissolution while low posterior MEX-5

      permits condensation/phase separation, providing a physical mechanism for

      segregating germ plasm downstream of PAR polarity.'
    supporting_text: high anterior MEX-5 correlates with dissolution, while low posterior MEX-5 permits
      condensation/phase separation, providing a physical mechanism for segregating germ plasm components
      downstream of PAR polarity.
    reference_section_type: OTHER
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Useful synthesis of PAR-1/PP2A mobility control, PLK recruitment and positive zif-1
      regulation. Its failure to retrieve the precise RNA-binding motif is an access limit; PMID17264081
      establishes U-rich/ARE recognition. Its positive zif-1 example does not refute mom-2 repression
      in PMID24131629.
