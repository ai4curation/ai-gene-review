    action: ACCEPT
    reason: The exact target inherits the positive PTN002648882 assertion and PMID:17264081 directly
      assays both paralogs against TNF-ARE. Preference for U-rich RNA with less discrimination than
      TTP is compatible with AU-rich region binding; the term does not require exclusive recognition
      of a canonical ARE.
