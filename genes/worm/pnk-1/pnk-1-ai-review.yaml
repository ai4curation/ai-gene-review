- term:
    id: GO:0004594
    label: pantothenate kinase activity
  evidence_type: IC
  original_reference_id: PMID:30927326
  qualifier: enables
  review:
    summary: Proposed positive pantothenate kinase activity for PNK-1, replacing the removed NOT row.
    action: NEW
    reason: >-
      Three independent lines agree. (1) Family: PNK-1 is a full-length type II pantothenate kinase
      (IPR004567, TIGR00555 panK_eukar). (2) Active site: it retains Glu214 and Arg281, equivalent to
      the PANK3 Glu138 and Arg207 that all active PanKs share and whose substitution abolishes activity
      (PMID:30927326), unlike the worm pseudo-kinase paralog PNK-4. (3) Genetics: pnk-1 loss is lethal and
      partially rescued by CoA, pnk-1 reduction phenotypes are reversed by CoA, and pnk-4 loss does not
      change CoA levels. PNK-1 is therefore the only candidate pantothenate kinase in C. elegans. No
      direct enzyme assay has been published, so the annotation is made as IC rather than IDA.
    supported_by:
    - reference_id: PMID:30927326
      supporting_text: all active, characterized PANKs contain the key catalytic residues Glu138 and
        Arg207 (HsPANK3 numbering)
    - reference_id: file:worm/pnk-1/pnk-1-bioinformatics/RESULTS.md
      supporting_text: 'C. elegans PNK-1 (H2KYP7):	PANK3 E138 -> E214; PANK3 R207 -> R281'
    - reference_id: PMID:42523442
      supporting_text: It was previously described that the pnk-1 KO strain was not viable and CoA
        supplementation partially rescued the detrimental phenotype
    - reference_id: PMID:40304211
      supporting_text: Remarkably, external supplementation with 400 μM CoA negated the benefits of the
        pnk‐1 reduced expression
    - reference_id: PMID:15340492
      supporting_text: PNK-1, human pantothenate kinase
    - reference_id: file:worm/pnk-1/pnk-1-deep-research-manual.md
      supporting_text: No direct enzyme assay of recombinant PNK-1 has been published (searched).
