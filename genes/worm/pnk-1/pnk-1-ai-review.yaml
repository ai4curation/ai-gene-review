    supporting_text: all active, characterized PANKs contain the key catalytic residues Glu138 and Arg207
      (HsPANK3 numbering)
  - statement: Kinase inactivation in PANK4 is due to amniote-specific substitutions; plant and fungal
      PANK4s are active.
