      kinase domain in PTHR12280:SF20.
    action: REMOVE
    reason: >-
      The negation is contradicted for PNK-1. The basis for NOT at the PANK4 node is the
      pseudo-kinase status of amniote PANK4, which carries Glu138Val and Arg207Trp substitutions
      (PANK3 numbering), whereas plant and fungal PANK4 members retain both residues and are active
      kinases (PMID:30927326), so the activity was not lost at the base of the subfamily. PNK-1 retains
      both catalytic residues (Glu214, Arg281) in a pairwise alignment to human PANK3, while the worm
      paralog PNK-4 is the one with an Ala at the catalytic glutamate position. Genetically, the pnk-1
      knockout is inviable and partially rescued by coenzyme A, whereas pnk-4 knockouts are viable with
      unchanged CoA, the expected pattern if PNK-1 is the active kinase. This NOT row is an
      over-propagated negation and should be removed; the positive kinase activity is added as a NEW
