  review:
    summary: PAINT propagation of a nuclear location from mammalian PANK1/PANK2 and fission yeast PanK.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      In mammals the nuclear pools of pantothenate kinase belong to specific isoforms with
      N-terminal targeting extensions (PanK1alpha; human PANK2, which is also mitochondrial), whereas
      PanK1beta and PanK3, the catalytic-domain-only forms, are cytosolic (PMID:23152917). Nuclear
      localization is therefore an isoform- and lineage-specific property of the seed proteins, not a
      family-wide one. There is no localization data for PNK-1, and its N-terminal extension shows no
      demonstrated nuclear targeting. The claim is not shown to hold for PNK-1, so the row is
      considered an over-annotation; the cytosol row better reflects where CoA synthesis begins.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - COMPARTMENT_OR_COMPLEX_MISMATCH
      - LINEAGE_OR_TAXON_MISMATCH
      source_entities:
