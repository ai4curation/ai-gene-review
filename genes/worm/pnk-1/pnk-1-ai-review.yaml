suggested_questions:
- question: >-
    PAINT places C. elegans pnk-1 under PTN000957966 (PANK4 subfamily of PTHR12280), propagating NOT
    pantothenate kinase activity and phosphatase activity. Should the NOT be moved to a node that covers
    amniote PANK4 and worm pnk-4 but excludes pnk-1, and phosphatase activity be restricted to
    proteins with the C-terminal DUF89 domain?
- question: Is recombinant PNK-1 an active pantothenate kinase, and is it feedback-inhibited by acetyl-CoA
    or CoA like mammalian PanK1-3?
- question: Do the alternative PNK-1 isoforms (UniProt H2KYP7 449 aa, Q86NC9 403 aa lacking the first 46
    residues, H2KYP8 392 aa) differ in subcellular localization, as mammalian PanK1alpha/beta and PANK2 do?
suggested_experiments:
- description: >-
    Express and purify PNK-1 (H2KYP7) and the E214A/R281W variants; measure ATP-dependent
    phosphorylation of [14C]pantothenate and its inhibition by acetyl-CoA, with human PANK3 as a
    positive control and PNK-4 kinase domain as a comparator.
  hypothesis: PNK-1 is an active pantothenate kinase whose activity depends on Glu214 and Arg281.
- description: >-
    Endogenous CRISPR tagging of pnk-1 (isoform-aware) with GFP to determine tissue and subcellular
    localization, and LC-MS measurement of CoA and 4'-phosphopantothenate in pnk-1 hypomorphs.
  hypothesis: PNK-1 is cytosolic, and reduced PNK-1 lowers 4'-phosphopantothenate and CoA levels.
