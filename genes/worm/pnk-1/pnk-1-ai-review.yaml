id: H2KYP7
gene_symbol: pnk-1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: >-
  pnk-1 (C10G11.5) encodes the type II (eukaryotic, Fumble-domain) pantothenate kinase of
  Caenorhabditis elegans, the enzyme expected to catalyse the ATP-dependent phosphorylation of
  pantothenate (vitamin B5) to 4'-phosphopantothenate, the first and rate-limiting step of coenzyme A
  biosynthesis. The 449-residue protein consists of a disordered N-terminal extension followed by an
  actin-like ATPase (ASKHA) PanK domain. Although its kinase domain is most similar to the PANK4
  subfamily, it retains the two catalytic residues (Glu214 and Arg281, equivalent to human PANK3
  Glu138 and Arg207) that are lost in amniote PANK4 pseudo-kinases, and it lacks the C-terminal
  DUF89 phosphatase domain of PANK4. The second worm family member, PNK-4, is the PANK4-like
  kinase/phosphatase fusion and has lost the catalytic glutamate. pnk-1 is a DAF-16/FOXO target gene
  expressed prominently in the intestine; its loss is lethal and partially rescued by coenzyme A,
  and partial loss alters monomethyl branched-chain fatty acid levels, lifespan and proteostasis,
  consistent with PNK-1 controlling cellular CoA supply. No direct enzymatic assay or experimental
  localization of the protein has been reported.
