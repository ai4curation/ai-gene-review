        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Nuclear location is specific to the PanK1alpha isoform with its nuclear/nucleolar
          signal-bearing N-terminal extension.
      - source_id: UniProtKB:Q9BZ23
        source_label: human PANK2
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Human PANK2 is mitochondrial and nuclear via its own N-terminal extension; mouse PanK2
          is cytosolic.
      - source_id: UniProtKB:Q9H999
        source_label: human PANK3
        source_status: UNRESOLVED
        comment: PANK3 was cytosolic in PMID:23152917; its contribution to a nuclear IBD is unclear.
