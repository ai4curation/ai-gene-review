findings:
- category: discrepancy
  text: The automated text gives phosphatase activity (removed in the review) instead
    of pantothenate kinase activity, the activity the review assigns because PNK-1
    retains the catalytic Glu and Arg lost in PANK4 pseudokinases and lacks the phosphatase
    domain.
  sources:
  - Alliance_Automated
  - RefSeq
- category: gap
  text: No source mentions the DAF-16 target status, the lethality rescued by coenzyme
    A, or the branched-chain fatty acid and lifespan phenotypes in the review.
  sources:
