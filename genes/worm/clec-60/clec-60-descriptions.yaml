descriptions:
- source: Alliance_Imported
  text: clec-60 encodes a C-type lectin protein with no obvious non-nematode orthologs;
    clec-60 appears to play a role in the innate immune respone to some bacterial
    pathogens, including Microbacterium nematophilum and Salmonella enterica; clec-60
    transcription is induced 6.6-fold by infection with M. nematophilum, making it
    one of the most strongly infection-responsive genes (second only to tts-1); CLEC-60
    is expressed throughout the larval intestine, with expression continuing in the
    adult adult primarily in the posterior intestinal cells int8 and int9; CLEC-60
    contains an N-terminal von Willebrand factor type A domain and a C-terminal C-type
    lectin domain.
  source_type: curated
