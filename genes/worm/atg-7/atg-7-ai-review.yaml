    supporting_text: >-
      E1-like activating enzyme involved in the 2 ubiquitin-like systems required for autophagy.
suggested_questions:
- question: >-
    Does C. elegans ATG-7 activate LGG-1 and LGG-2 with different kinetics in vitro, and does
    this explain the small fraction of LGG-2 that is PE-conjugated?
- question: >-
    Is the atg-7 germline proliferation phenotype, which acts with DAF-7/TGF-beta rather than
    DAF-16, autophagy-dependent or a non-canonical role of ATG-7?
suggested_experiments:
- description: >-
    Reconstitute LGG-3-ATG-5 conjugation and LGG-1/LGG-2 lipidation with recombinant C. elegans
    ATG-7, ATG-10 and ATG-3, including an active-site Cys523 mutant, to confirm both E1 activities
    directly.
  experiment_type: in vitro reconstitution
