id: G5EBK4
gene_symbol: atg-7
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: >-
  ATG-7 is the C. elegans ortholog of yeast Atg7 and mammalian ATG7, the E1-like activating
  enzyme shared by the two ubiquitin-like conjugation systems of autophagy. Its C-terminal
  ThiF/E1-like domain carries the active-site cysteine that forms a thioester with the C-terminal
  glycine of the Atg8-family proteins LGG-1 and LGG-2 and of the Atg12 ortholog LGG-3, and
  it then hands these ubiquitin-like proteins on to the E2-like enzymes ATG-3 (for phosphatidylethanolamine
  conjugation of LGG-1/LGG-2) and ATG-10 (for LGG-3-ATG-5 conjugate formation). ATG-7 acts
  in the cytoplasm at sites of autophagosome formation and is required for autophagosome biogenesis
  and autophagic degradation in vivo. Loss of atg-7 blocks dauer morphogenesis, suppresses
  lifespan extension by reduced insulin-like signalling and dietary restriction, enhances
  polyglutamine aggregate accumulation, and together with loss of apoptosis compromises embryonic
  development.
