  - PANTHER:PTN000102341
  - UniProtKB:O95352
  review:
    summary: >-
      Phylogenetic inference that ATG-7 participates in autophagosome assembly. As the E1
      for both the LGG-1/LGG-2 lipidation system and the LGG-3-ATG-5 system, ATG-7 catalyses
      steps that autophagosome biogenesis depends on; C. elegans data show that LGG-1 and
      LGG-2 lipidation requires ATG-7 and ATG-3.
    action: ACCEPT
    reason: >-
      Core process for the E1 of the autophagic conjugation systems, conserved from yeast
      to mammals; consistent with C. elegans evidence that ATG-7 mediates Atg8-homolog lipidation
      (PMID:27046254) and that atg-7 is required for autophagy-dependent dauer morphogenesis
      (PMID:12958363).
    supported_by:
    - reference_id: PMID:27046254
      supporting_text: Lipidation of LGG-1 and LGG-2 is mediated by 2 enzymes, ATG-7 and ATG-3.
    - reference_id: PMID:24185444
      supporting_text: >-
        The ubiquitin-like protein Atg8 is activated by the E1-like enzyme Atg7 and then transferred
        to the E2-like conjugating enzyme Atg3 and finally conjugated to phosphatidylethanolamine
        (PE).
