core_functions:
- description: >-
    E1-like activating enzyme for the Atg8-family proteins LGG-1 and LGG-2: forms a thioester
    with their C-terminal glycine and transfers them to the E2-like enzyme ATG-3, enabling
    their conjugation to phosphatidylethanolamine during autophagosome assembly.
  molecular_function:
    id: GO:0019779
    label: Atg8 activating enzyme activity
  directly_involved_in:
  - id: GO:0061739
    label: protein lipidation involved in autophagosome assembly
  - id: GO:0000045
    label: autophagosome assembly
  locations:
  - id: GO:0005737
    label: cytoplasm
  supported_by:
  - reference_id: PMID:27046254
    supporting_text: Lipidation of LGG-1 and LGG-2 is mediated by 2 enzymes, ATG-7 and ATG-3.
- description: >-
    E1-like activating enzyme for the Atg12 ortholog LGG-3, passing it to the E2-like enzyme
    ATG-10 for covalent conjugation to ATG-5 (inferred from the conserved ATG7 clade; not
    directly assayed in C. elegans).
  molecular_function:
    id: GO:0019778
    label: Atg12 activating enzyme activity
  directly_involved_in:
  - id: GO:0000045
    label: autophagosome assembly
  locations:
  - id: GO:0005737
    label: cytoplasm
  supported_by:
