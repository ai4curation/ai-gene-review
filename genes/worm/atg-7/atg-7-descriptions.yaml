- source: UniProt
  text: E1-like activating enzyme involved in the 2 ubiquitin-like systems required
    for autophagy.
  source_type: curated
  url: https://www.uniprot.org/uniprot/G5EBK4
  source_id: G5EBK4
- source: Alliance_Imported
  text: atg-7 encodes an E1 ubiquitin-activating-like enzyme orthologous to the  autophagic
    budding yeast protein Apg7p; ATG-7 is required for normal dauer morphogenesis
    and autophagy in daf-2 mutant animals.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00010882;class=Gene
  source_id: WB:WBGene00010882
- source: Alliance_Automated
  text: Predicted to enable Atg12 activating enzyme activity and Atg8 activating enzyme
    activity. Involved in several processes, including dauer larval development; determination
    of adult lifespan; and positive regulation of autophagosome assembly. Predicted
    to be active in phagophore assembly site. Human ortholog(s) of this gene implicated
    in autosomal recessive spinocerebellar ataxia 31. Orthologous to human ATG7 (autophagy
    related 7).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00010882;class=Gene
  source_id: WB:WBGene00010882
