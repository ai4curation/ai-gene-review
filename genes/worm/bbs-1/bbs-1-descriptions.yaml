- source: Alliance_Imported
  text: bbs-1 encodes the C. elegans ortholog of human BBS1, a protein containing
    a predicted beta-propeller domain; bbs-1 is a component of and is required for
    proper intraflagellar transport (IFT); bbs-1 acts in ciliated neurons in a pathway
    along with kat-1/3-ketoacyl-coA thiolase, tub-1/tubby and other genes involved
    in ciliary structure and function to regulate fat storage, as such, bbs-1 affects
    body size, feeding and chemosensation; bbs-1 is also required for the proper regulation
    of insulin secretion; bbs-1, bbs-5, bbs-8 and bbs-9 mutants along with ciliary
    phenotypes show an increased secretion of insulin, biogenic amines and neuropeptides
    which requires the Rab27/AEX-6 dense-core vesicle exocytosis machinery; BBS-1::GFP
    reporter fusion is expressed exclusively in ciliated neurons, where it localizes
    to the transition zones and along the ciliary axonemes; the bbs-1 5' untranslated
    region contains an X box, a regulatory element found in many genes expressed in
    ciliated neurons, that functions as a binding site for the DAF-19 transcription
    factor.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00000241;class=Gene
  source_id: WB:WBGene00000241
