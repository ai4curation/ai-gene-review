gene_symbol: bbs-1
organism: worm
uniprot_id: Q9NEZ7
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Component of the BBSome complex (By similarity). The BBSome complex is thought
    to function as a coat complex required for sorting of specific membrane proteins
    to the primary cilia (By similarity). The BBSome complex is required for ciliogenesis
    but is dispensable for centriolar satellite function (By similarity). Required
    for proper BBSome complex assembly and its ciliary localization (PubMed:22922713).
    Required for cilia biogenesis and both the assembly and movement of intraflagellar
    transport proteins along the ciliary axoneme (PubMed:15231740, PubMed:22022287,
    PubMed:22922713).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q9NEZ7
  source_id: Q9NEZ7
- source: Alliance_Imported
  text: bbs-1 encodes the C. elegans ortholog of human BBS1, a protein containing
    a predicted beta-propeller domain; bbs-1 is a component of and is required for
    proper intraflagellar transport (IFT); bbs-1 acts in ciliated neurons in a pathway
    along with kat-1/3-ketoacyl-coA thiolase, tub-1/tubby and other genes involved
    in ciliary structure and function to regulate fat storage, as such, bbs-1 affects
    body size, feeding and chemosensation; bbs-1 is also required for the proper regulation
    of insulin secretion; bbs-1, bbs-5, bbs-8 and bbs-9 mutants along with ciliary
    phenotypes show an increased secretion of insulin, biogenic amines and neuropeptides
    which requires the Rab27/AEX-6 dense-core vesicle exocytosis machinery; BBS-1::GFP
    reporter fusion is expressed exclusively in ciliated neurons, where it localizes
    to the transition zones and along the ciliary axonemes; the bbs-1 5' untranslated
    region contains an X box, a regulatory element found in many genes expressed in
    ciliated neurons, that functions as a binding site for the DAF-19 transcription
    factor.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00000241;class=Gene
  source_id: WB:WBGene00000241
- source: Alliance_Automated
  text: Predicted to enable patched binding activity and smoothened binding activity.
    Involved in non-motile cilium assembly. Acts upstream of or within intraciliary
    retrograde transport and protein localization to cilium. Located in axoneme; ciliary
    basal body; and neuron projection. Is expressed in intestine and nervous system.
    Used to study Bardet-Biedl syndrome; alcohol use disorder; and obesity. Human
    ortholog(s) of this gene implicated in Bardet-Biedl syndrome and Bardet-Biedl
    syndrome 1. Orthologous to human BBS1 (Bardet-Biedl syndrome 1).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00000241;class=Gene
  source_id: WB:WBGene00000241
