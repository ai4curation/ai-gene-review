- source: Alliance_Automated
  text: Enables insulin receptor binding activity. Involved in several processes,
    including insulin receptor signaling pathway; negative regulation of dauer entry;
    and olfactory learning. Predicted to be located in extracellular region. Is expressed
    in several structures, including coelomocyte; head muscle; neurons; somatic nervous
    system; and uterus.
