descriptions:
- source: UniProt
  text: Probable insulin-like peptide which negatively regulates synapse development
    at the neuromuscular junctions (PubMed:23665919). Probably acts as a daf-2/InsR
    agonist ligand to prevent dauer formation under optimal environmental conditions
    (PubMed:24671950). Acts on AWC sensory neurons to regulate high salt chemotaxis
    responses (PubMed:24013594).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P56174
