gene_symbol: ins-6
organism: worm
uniprot_id: P56174
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Probable insulin-like peptide which negatively regulates synapse development
    at the neuromuscular junctions (PubMed:23665919). Probably acts as a daf-2/InsR
    agonist ligand to prevent dauer formation under optimal environmental conditions
    (PubMed:24671950). Acts on AWC sensory neurons to regulate high salt chemotaxis
    responses (PubMed:24013594).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P56174
  source_id: P56174
- source: Alliance_Imported
  text: ins-6 encodes predicted type-beta insulin-like molecule that lacks a C peptide
    domain; expressed throughout development and in some neurons beginning in the
    two-fold elongated embryo.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00002089;class=Gene
  source_id: WB:WBGene00002089
- source: Alliance_Automated
  text: Enables insulin receptor binding activity. Involved in several processes,
    including insulin receptor signaling pathway; negative regulation of dauer entry;
    and olfactory learning. Predicted to be located in extracellular region. Is expressed
    in several structures, including coelomocyte; head muscle; neurons; somatic nervous
    system; and uterus.
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00002089;class=Gene
  source_id: WB:WBGene00002089
