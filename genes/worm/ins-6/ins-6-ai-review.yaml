  label: Caenorhabditis elegans
description: INS-6 is a neuronally expressed, secreted beta-type insulin-like peptide of C.
  elegans, one of about 40 insulin-like peptides (ILPs). Its structure recapitulates the insulin
  fold, and it binds and activates the human insulin receptor in vitro. In vivo INS-6 acts
  as an agonist of the DAF-2 insulin/IGF-1-like receptor. Released from sensory neurons such
  as ASI and ASJ, it acts redundantly with DAF-28 and INS-4 to prevent dauer entry under favorable
  conditions, and has a more prominent role than DAF-28 in promoting dauer exit. INS-6 is
  also a neuromodulator. ASE salt-sensing neurons release it after BLI-4-dependent processing,
  switching AWC into the salt circuit and enabling high-salt chemotaxis. From ASI it enables
  aversive olfactory learning by repressing ins-7 expression in URX. It also contributes to
  insulin/IGF signaling-dependent regulation of neuromuscular junction development.
