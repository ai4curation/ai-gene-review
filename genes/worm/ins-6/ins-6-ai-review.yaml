suggested_questions:
- question: Does INS-6 bind DAF-2 directly with an affinity comparable to its binding of the
    human insulin receptor, and does it engage particular DAF-2 isoforms in neurons versus
    intestine?
suggested_experiments:
- description: Measure binding of purified INS-6 (and DAF-28) to DAF-2 ectodomain isoforms
    and test activation in a reconstituted cell assay.
