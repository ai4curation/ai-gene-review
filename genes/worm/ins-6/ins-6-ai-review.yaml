core_functions:
- description: INS-6 is a secreted insulin-like peptide hormone that binds and activates insulin
    receptors (DAF-2 in vivo), acting from sensory neurons on distant tissues such as the
    intestine to keep DAF-16 inactive and prevent dauer entry under favorable conditions.
