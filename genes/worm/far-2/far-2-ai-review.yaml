knowledge_gaps:
- gap_statement: >-
    The endogenous fatty-acid or retinoid cargoes carried by C. elegans FAR-2,
    and the in vivo biological processes or phenotypes that depend on far-2,
    have not been directly identified.
  boundary: >-
    Recombinant Ce-FAR-2 binds DAUDA, cis-parinaric acid, and retinol in vitro,
    and UniProt maps the protein to the extracellular region from a
    secreted-location statement inferred by homology.
  gap_kind:
  - BIOLOGY
  dark_aspect: BP_DARK
  significance: >-
    FAR-2 is a secreted C. elegans FAR-family lipid carrier, but its native
    cargoes and same-organism phenotypes need to be established before it can
    be assigned a specific biological process.
  resolution: >-
    Identify endogenous FAR-2-bound lipids from worms and assay far-2
    perturbation phenotypes under defined lipid, retinoid, developmental, and
    stress conditions.
  provenance:
  - reference_id: file:worm/far-2/far-2-notes.md
    supporting_text: >-
      FAR-2 has direct recombinant ligand-binding evidence but no cached
      loss-of-function or native-cargo study tying P34383 to a specific C.
      elegans biological process.
suggested_questions:
- question: >-
    Which endogenous C. elegans lipids are carried by FAR-2, and how do those
    cargoes differ from the same-family FAR-1 cargoes?
  experts:
  - C. elegans lipid metabolism curators
  - Nematode FAR protein specialists
suggested_experiments:
- description: >-
    Immunopurify endogenous FAR-2 from adult hermaphrodites and identify bound
    retinoids and fatty acids by targeted and untargeted LC-MS/MS.
  hypothesis: >-
    FAR-2 carries a restricted set of native C. elegans fatty-acid or retinoid
    ligands rather than binding reporter lipids only as a promiscuous
    recombinant activity.
  experiment_type: native ligand identification
- description: >-
    Generate far-2 loss-of-function animals and assay development, fertility,
    and stress phenotypes across defined lipid supplies and retinoid-like
    supplementation.
  hypothesis: >-
    FAR-2-dependent lipid binding supports a measurable C. elegans phenotype
    under conditions where its native cargo is limiting.
  experiment_type: loss of function
