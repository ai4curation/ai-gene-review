- id: PMID:12592563
  title: >-
    The FAR proteins of parasitic nematodes: their possible involvement in the
    pathogenesis of infection and the use of Caenorhabditis elegans as a model
    system to evaluate their function.
  findings:
  - statement: >-
      Garofalo, Kennedy and Bradley reviewed parasite FAR proteins and
      described C. elegans as a genetically tractable model for FAR-function
      studies.
    supporting_text: >-
      in this review we compare the FAR proteins of C. elegans and parasitic
      nematodes
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Abstract-only review cached for the two WormBase ISS rows. The cached
      abstract supports the general parasite-versus-C. elegans FAR family
      context, but the specific Ce-FAR-2 fatty-acid and retinol-binding
      functions are better supported by the primary PMID:12502713 abstract.
- id: PMID:12502713
  title: >-
    The FAR protein family of the nematode Caenorhabditis elegans.
    Differential lipid binding properties, structural characteristics, and
    developmental regulation.
  findings:
  - statement: >-
      Garofalo et al. produced recombinant Ce-FAR-1 through Ce-FAR-7 in E.
      coli and showed that the Ce-FAR-1 to Ce-FAR-6 set, which includes
      Ce-FAR-2, bound DAUDA, cis-parinaric acid, and retinol in
      fluorescence-based assays.
    supporting_text: >-
      Recombinant Ce-FAR-1 to -7 were produced in Escherichia coli and tested
      for lipid binding in fluorescence-based assays. Ce-FAR-1 to -6 bound
      DAUDA
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Primary abstract supporting the fatty-acid-binding and retinol-binding
      molecular functions for C. elegans FAR-2. The full text was not cached,
      so the developmental expression details beyond the named Ce-far-3,
      Ce-far-4 and Ce-far-7 peaks in the abstract were not used for process
      curation.
