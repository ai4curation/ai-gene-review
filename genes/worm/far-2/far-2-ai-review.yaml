  label: Caenorhabditis elegans
description: >-
  FAR-2 is a 182-residue Caenorhabditis elegans fatty-acid and
  retinol-binding protein with a predicted N-terminal signal peptide and a
  single Gp-FAR-1 domain. It belongs to the nematode-specific FARBP family and
  to PANTHER subfamily PTHR31418:SF19, which separates it from the
  PTHR31418:SF7 FAR-1 subfamily containing C. elegans FAR-1 and filarial FAR-1
  proteins from Brugia malayi and Onchocerca volvulus. Recombinant Ce-FAR-2 was
  included among the Ce-FAR-1 to Ce-FAR-6 proteins that bound DAUDA,
  cis-parinaric acid, and retinol with micromolar dissociation constants in
  fluorescence assays. Its endogenous lipid cargoes, extracellular site of
  action, and in vivo biological roles remain poorly characterized.
