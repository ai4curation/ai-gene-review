- id: PMID:39209556
  title: High-resolution reconstruction of a C. elegans ribosome sheds light on evolutionary dynamics
    and tissue specificity.
  findings:
  - statement: Cryo-EM structure (2.63 A) of the C. elegans 80S ribosome; all ribosomal proteins except
      stalk proteins, eL28 and RACK-1 were modelled, including eS1.
    supporting_text: We also modeled the ribosomal proteins, with the exceptions of those bound to the
      P- and L-stalks (uL10/P0, P1, P2, uL1, uL11), eL28, and RACK-1
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified (Sehgal et al. 2024, RNA 30:1513). Source of PDB 9BH5/9CAI cross-referenced
      in P48154; eS1 is not named in the text but is not among the unmodelled proteins.
- id: PMID:16247027
  title: A complex containing the Sm protein CAR-1 and the RNA helicase CGH-1 is required for embryonic
    cytokinesis in Caenorhabditis elegans.
  findings:
  - statement: RNAi of ribosomal proteins RPS-1, -3, -5, -11, -18 and -23 (used as a translation-inhibition
      control) caused sterility; rps-3A is not named.
    supporting_text: Depletions of six different ribosomal subunits (RPS-1, -3, -5, -11, -18, and -23)
      each resulted in penetrant sterility (unpublished data).
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Full text read. Paper is about CAR-1/CGH-1; the only ribosomal data concern RPS-3 and
      other RPS proteins, not RPS-3A (F56F3.5). Not used to support any annotation.
