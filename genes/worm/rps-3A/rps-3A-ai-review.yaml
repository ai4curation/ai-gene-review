id: P48154
gene_symbol: rps-3A
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: rps-3A (F56F3.5) encodes the Caenorhabditis elegans small ribosomal subunit protein eS1 (40S
  ribosomal protein S3a), a member of the conserved eukaryotic eS1/S3Ae family. It is a core protein of
  the cytosolic 40S ribosomal subunit and is resolved in the cryo-EM structure of the C. elegans 80S ribosome
  purified from translating animals. As a structural constituent of the ribosome it contributes to cytoplasmic
  mRNA translation. No gene-specific biochemical or extra-ribosomal function has been characterised in
  C. elegans.
