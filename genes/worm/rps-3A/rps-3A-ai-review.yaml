suggested_questions:
- question: Does C. elegans eS1 (rps-3A) have any extra-ribosomal function, as proposed for mammalian
    RPS3A, or is it exclusively a ribosomal structural protein?
suggested_experiments:
- description: Endogenous tagging of rps-3A combined with polysome profiling and tissue-specific degradation
    (AID) to test whether a free, non-ribosomal pool exists and whether acute depletion affects 40S assembly
    versus translation per se.
