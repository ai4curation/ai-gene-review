description: >-
  ProTrek sequence-to-text retrieval for worm daf-2, the insulin/IGF-1 receptor ortholog. The best
  result in the worm set and one of the better ones in ARGO139: rank 1 is an exact GOA match on the
  curated core molecular function at 18.30, rank 2 refines the receptor type, and ranks 4 and 5 are
  exact GOA matches on negative regulation of dauer entry and larval feeding behavior - both IMP-supported,
  and the first of them named explicitly in the review's core function. Four of the five top calls
  are substantively right, and the one failure is an insect-specific process term. The free-text channel
  returns DAF-2's own comment at 21.46. The contrast with daf-16 in the same pathway and the same
  organism is stark: the receptor, whose kinase domain has a strong sequence signature, is retrieved
  well; the forkhead transcription factor downstream of it is retrieved worse than almost anything
  in the cohort. Assessment: 1 correct-not-novel, 1 correct novel, 1 nonparalog incorrect. Assessment:
  1 correct novel (COR), 1 correct not novel (CNN), 1 nonparalog incorrect (NPI).
