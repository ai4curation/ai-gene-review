descriptions:
- source: UniProt
  text: 'Insulin receptor-like tyrosine kinase which regulates metabolism, controls
    longevity and prevents developmental arrest at the dauer stage (PubMed:11743719,
    PubMed:21334311, PubMed:22916022, PubMed:24332851, PubMed:24385923, PubMed:28853436,
    PubMed:29500338, PubMed:9252323, PubMed:9790527). Binding of INS family members
    may either stimulate, or antagonize, association of the receptor with downstream
    mediators such as pdk-1 and age-1 (PubMed:11274053). Required for germline progenitor
    proliferation during larval development (PubMed:22278922). Plays a role in maintaining
    gonad integrity in a daf-16/FOXO-dependent manner (PubMed:22916022). Required
    for the response to environmental stimuli such as light, food, pheromone, and
    temperature (PubMed:24332851, PubMed:29500338). Negatively regulates resistance
    to UV and oxidative stress (PubMed:24332851). In a daf-16/FOXO-dependent manner,
    plays a role in regulating the response to white light (PubMed:29500338). Role
    in immune function and pathogen resistance (PubMed:18782349). Negatively regulates
    autophagy (PubMed:22560223). Regulates daf-18/PTEN protein levels (PubMed:23995781).
    Plays a role in controlling seam cell development during the larval stages (PubMed:21471153).
    . [Isoform a]: Required for taste avoidance learning in the cell body of ASER
    gustatory neurons. . [Isoform c]: Required for taste avoidance learning in axons
    of ASER gustatory neurons.'
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q968Y9
  source_id: Q968Y9
- source: Alliance_Imported
  text: daf-2 encodes a receptor tyrosine kinase that is the C. elegans insulin/IGF
    receptor ortholog; DAF-2 activity is required for a number of processes in C.
    elegans, including embryonic and larval development, formation of the developmentally
    arrested dauer larval stage (diapause), larval developmental timing, adult longevity,
    reproduction, fat storage, salt chemotaxis learning, and stress resistance, including
    response to high temperature, oxidative stress, and bacterial infection; DAF-2
    signals through a conserved PI 3-kinase pathway to negatively regulate the activity
    of DAF-16, a Forkhead-related transcription factor, by inducing its phosphorylation
    and nuclear exclusion; in addition, DAF-2 negatively regulates the nuclear localization,
    and hence transcriptional activity, of SKN-1 in intestinal nuclei; amongst the
    38 predicted insulin-like molecules in C. elegans, genetic and microarray analyses
    suggest that at least DAF-28, INS-1, and INS-7 are likely DAF-2 ligands; genetic
    mosaic and tissue-specific promoter studies indicate that daf-2 can function cell
    nonautonomously and within multiple cell types to influence dauer formation and
    adult lifespan, likely by regulating the production of secondary endocrine signals
    that coordinate growth and longevity throughout the animal; temporal analysis
    of daf-2 function indicates that daf-2 regulates lifespan, reproduction, and diapause
    independently, at distinct times during the animal's life cycle.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00000898;class=Gene
  source_id: WB:WBGene00000898
- source: Alliance_Automated
  text: Enables insulin-like growth factor receptor activity; protein domain specific
    binding activity; and protein kinase binding activity. Involved in several processes,
    including dauer exit; determination of adult lifespan; and regulation of gene
    expression. Acts upstream of with a negative effect on protein import into nucleus.
    Located in several cellular components, including axon; neuronal cell body; and
    non-motile cilium. Is expressed in several structures, including germ line; gonad;
    nervous system; oocyte; and vulva. Used to study Parkinson's disease and diabetes
    mellitus. Human ortholog(s) of this gene implicated in several diseases, including
    dementia (multiple); glucose metabolism disease (multiple); kidney cancer (multiple);
    liver disease (multiple); and reproductive organ cancer (multiple). Orthologous
    to several human genes including IGF1R (insulin like growth factor 1 receptor)
    and INSRR (insulin receptor related receptor).
