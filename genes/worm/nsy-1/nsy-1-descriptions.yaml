- source: Alliance_Automated
  text: Enables mitogen-activated protein kinase kinase binding activity and protein
    kinase activity. Involved in several processes, including defense response to
    bacterium; determination of adult lifespan; and regulation of gene expression.
    Located in axon cytoplasm; perikaryon; and postsynaptic density. Is active in
    cytoplasm. Is expressed in several structures, including AWC; hypodermis; intestine;
    rectal gland cell; and tail. Used to study alcohol use disorder and amphetamine
    abuse. Human ortholog(s) of this gene implicated in Huntington's disease and arthritis.
    Orthologous to several human genes including MAP3K15 (mitogen-activated protein
    kinase kinase kinase 15) and MAP3K5 (mitogen-activated protein kinase kinase kinase
    5).
