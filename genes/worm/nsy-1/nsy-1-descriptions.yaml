- source: Alliance_Imported
  text: nsy-1 encodes a MAP kinase kinase kinase (MAP3K) that is orthologous to the
    mammalian apoptosis signal-regulating kinase (ASK) family of protein kinases;
    nsy-1 activity is required for chemotaxis, egg laying, pathogen response, and
    response to anoxia; NSY-1 activity is activated by the calmodulin kinase UNC-43,
    and is required for lateral signalling that leads to asymmetric olfactory neuron
    fates; NSY-1 interacts with SEK-1, and is expressed in the intestine, hypodermis,
    rectal gland cells, and neurons.
