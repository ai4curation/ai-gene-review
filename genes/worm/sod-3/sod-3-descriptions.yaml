gene_symbol: sod-3
organism: worm
uniprot_id: P41977
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Destroys superoxide anion radicals which are normally produced within the
    cells and which are toxic to biological systems.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P41977
  source_id: P41977
- source: Alliance_Imported
  text: sod-3 encodes a iron/manganese superoxide dismutase, predicted to be mitochondrial,
    that might defend against oxidative stress and promote normal lifespan; sod-3
    mRNA levels are diminished by mutation of daf-16 and chromatin immunoprecipitation
    (ChIP) studies demonstrate that DAF-16 can directly bind the sod-3 promoter; heterologously
    expressed SOD-3 in E. coli protects against methyl viologen-induced oxidative
    stress.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00004932;class=Gene
  source_id: WB:WBGene00004932
- source: Alliance_Automated
  text: Enables superoxide dismutase activity. Involved in removal of superoxide radicals.
    Located in mitochondrion. Part of respiratory chain complex. Is expressed in several
    structures, including egg-laying apparatus; head; intestine; pharynx; and tail.
    Human ortholog(s) of this gene implicated in several diseases, including autoimmune
    disease of musculoskeletal system (multiple); diabetes mellitus (multiple); eye
    disease (multiple); liver disease (multiple); and optic nerve disease (multiple).
    Orthologous to human SOD2 (superoxide dismutase 2).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00004932;class=Gene
  source_id: WB:WBGene00004932
