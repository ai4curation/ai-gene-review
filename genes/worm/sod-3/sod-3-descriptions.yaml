- source: Alliance_Imported
  text: sod-3 encodes a iron/manganese superoxide dismutase, predicted to be mitochondrial,
    that might defend against oxidative stress and promote normal lifespan; sod-3
    mRNA levels are diminished by mutation of daf-16 and chromatin immunoprecipitation
    (ChIP) studies demonstrate that DAF-16 can directly bind the sod-3 promoter; heterologously
    expressed SOD-3 in E. coli protects against methyl viologen-induced oxidative
    stress.
  source_type: curated
