  review:
    summary: PAINT inference that CKI-1 is active in the cytoplasm, from mammalian p27 (CDKN1B)
      and p57 (CDKN1C) only.
    action: MARK_AS_OVER_ANNOTATED
    reason: The cytoplasm IBD at the eumetazoan node (PTN004142838) is seeded only by mouse
      and human p27 and human p57, whose cytoplasmic pools regulate RhoA/actin and motility.
      For worm CKI-1 every localisation result is nuclear (PMID:10587644, PMID:15247923), and
      the paper that compared the two systems contrasts nuclear CKI-1 control in worm germ cells
      with cytoplasmic p21 control in human cells (PMID:21074724). CDC-14 promoting nuclear
      accumulation implies some CKI-1 outside the nucleus, but no cytoplasmic activity of CKI-1
      has been shown, so the IBA over-extends a mammalian-specific feature.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - COMPARTMENT_OR_COMPLEX_MISMATCH
      - LINEAGE_OR_TAXON_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN004142838
        source_label: PTHR10265 CIP/KIP eumetazoan node
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: The cytoplasm IBD (2026-05-28) rests on mouse Cdkn1b and human CDKN1B and
          CDKN1C, whose cytoplasmic pools have motility and RhoA roles. Fly Dacapo and the
          worm proteins are not among its seeds, and worm CKI-1 is nuclear in every assay
          (PMID:10587644, PMID:15247923, PMID:21074724).
      residue_claims_not_applicable: Localisation claim; no catalytic or binding residue
        is involved.
    supported_by:
    - reference_id: PMID:21074724
      supporting_text: elegans LRR-1 is nuclear localized in germ cells and regulates the abundance
        of nuclear CKI-1 to control the cell cycle, while human LRR1 is cytoplasmic localized
