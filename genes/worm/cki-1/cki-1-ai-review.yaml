  review:
    summary: PAINT inference of CDK serine/threonine kinase inhibitor activity for CKI-1, from
      the animal CIP/KIP node (fly Dacapo, mammalian p27 and p57).
    action: ACCEPT
    reason: 'CKI-1 is the canonical worm CIP/KIP CDK inhibitor (PMID:9716524). In vivo epistasis
      shows that it keeps cells quiescent by inhibiting CYE-1/CDK-2: the extra divisions of
      cki-1(RNAi) animals are suppressed by loss of cdk-2 or cye-1 (PMID:17476329). No in vitro
      kinase assay on the worm protein was found, but the family membership and the genetics
      agree, and nothing places CKI-1 outside the inhibitory clade.'
    supported_by:
    - reference_id: PMID:9716524
      supporting_text: C. elegans cki-1 encodes a member of the CIP/KIP family of cyclin-dependent
        kinase inhibitors
    - reference_id: PMID:17476329
      supporting_text: Therefore, in wild-type animals, CKI-1/CKI in these cells maintained
        quiescence by inhibiting CYE-1/CDK-2, while sufficient CYE-1/CDK-2 remained to repress
        the terminal differentiation.
