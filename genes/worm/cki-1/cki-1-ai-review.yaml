id: Q22197
gene_symbol: cki-1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: 'cki-1 encodes the main C. elegans CIP/KIP cyclin-dependent kinase inhibitor, a
  p27/KIP1 family protein. It acts in the nucleus to restrain the G1-to-S transition and to
  hold cells in a quiescent G1/G0 state; genetically it acts by inhibiting CYE-1/CDK-2 (cyclin
  E/CDK2), and it is reported to bind CYD-1 cyclin D. In the embryo cki-1 is essential: it is
  needed for cells to stop dividing on schedule, and for differentiation and morphogenesis.
  After hatching, it is expressed in blast cells in G1 and in differentiating cells. Less CKI-1
  gives extra larval divisions and precocious S phase, and excess CKI-1 arrests cells in G1.
  CKI-1 mediates the developmental quiescence of the vulval precursor cells (VPCs) in L1 and
  L2, the arrest of blast cells in dauer and starved L1 larvae, and the G1 arrest that the anchor
  cell needs in order to invade. It acts partly in parallel to LIN-35/Rb and to the second CIP/KIP
  gene, cki-2. Several developmental regulators set cki-1 transcription: DAF-16/FOXO in L1 arrest,
  LIN-1/Ets and LIN-31/FoxB in the VPCs, and NHR-67/TLX in the anchor cell. The protein''s stability
  is controlled by CDC-14, which promotes a stable nuclear form, and by the CUL-2/LRR-1 ubiquitin
  ligase, which degrades CKI-1 in proliferating germ cells. Through its control of division
  timing, CKI-1 also affects cell fate in the somatic gonad, where its loss produces extra distal
  tip cells and anchor cells.'
