- id: PMID:9716524
  title: Developmental regulation of a cyclin-dependent kinase inhibitor controls postembryonic
    cell cycle progression in Caenorhabditis elegans.
  findings:
  - statement: CKI-1 is a CIP/KIP CDK inhibitor whose loss causes extra larval divisions and
