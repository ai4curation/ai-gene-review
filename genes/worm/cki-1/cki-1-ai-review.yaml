- id: file:worm/cki-1/cki-1-deep-research-wormbase.md
  title: WormBase gene description for cki-1 (worm)
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'WormBase curated description (uncited, undated). Every claim traces to Hong
      et al. 1998 (PMID:9716524): p27/KIP1 (CIP/KIP) homology; requirement for arrest in larval
      blast lineages, dauer and starved L1 larvae; premature arrest on overexpression and extra
      divisions on RNAi. "Quantitatively regulates the amount of mitosis" is the authors'' interpretation
      of those two results and is consistent with them. The text is limited to postembryonic
      roles. It omits the essential embryonic role (PMID:12885569), the VPC and anchor cell
      G1 arrests (PMID:18082681, PMID:26506306), the gonadal cell-fate effects (PMID:14597199),
      and the regulators that set CKI-1 levels (DAF-16, CDC-14, CRL2-LRR-1).'
    source_defects:
    - defect_type: MISSING_STATEMENT
      resource: WORMBASE
      record: WB:WBGene00000516
      slot: MOD_provided_gene_description
      requested_change: ADD
      asserted_value: WB:WBGene00000516
      confidence: CONFIRMED
      explanation: The description covers only postembryonic arrest. It omits that cki-1 is
        essential in the embryo for cell-cycle exit, differentiation and morphogenesis (cki-1
        RNAi is embryonic lethal; PMID:12885569), and that CKI-1 levels are set by DAF-16/FOXO
        during L1 arrest (PMID:16631585), by CDC-14 (PMID:15247923) and by CRL2-LRR-1-mediated
        degradation in germ cells (PMID:21074724).
      supported_by:
      - reference_id: PMID:12885569
        supporting_text: RNA interference of cki-1 leads to embryonic lethality with phenotypes
          similar to, or more severe than, the deletion mutants.
      - reference_id: PMID:16631585
        supporting_text: We show that DAF-16 is required for transcription of the cyclin-dependent
          kinase inhibitor cki-1 in stem cells in response to starvation
core_functions:
- description: 'CKI-1 is a nuclear CIP/KIP CDK inhibitor that blocks G1-to-S progression, at
    least in part by inhibiting CYE-1/CDK-2, and so sets when cells divide during development.
    It is the effector of developmental and environmental quiescence: embryonic cell-cycle exit,
    VPC quiescence in L1-L2, blast-cell arrest in dauer and starved L1 larvae, and the G1 arrest
    of the invading anchor cell.'
  molecular_function:
    id: GO:0004861
    label: cyclin-dependent protein serine/threonine kinase inhibitor activity
  directly_involved_in:
  - id: GO:2000134
    label: negative regulation of G1/S transition of mitotic cell cycle
  - id: GO:1903452
    label: positive regulation of G1 to G0 transition
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:17476329
    supporting_text: CKI-1/CKI in these cells maintained quiescence by inhibiting CYE-1/CDK-2
  - reference_id: PMID:9716524
    supporting_text: Ectopic expression of CKI-1 can prematurely arrest cells in G1, while reducing
      cki-1 activity by RNA-mediated interference (RNAi) causes extra larval cell divisions
  - reference_id: PMID:15247923
    supporting_text: cdc-14 functions upstream of the cki-1 Cip/Kip inhibitor to promote accumulation
      of CKI-1 in the nucleus
  - reference_id: PMID:12885569
    supporting_text: Our findings demonstrate that cki-1 activity plays an essential role in
      embryonic cell cycle arrest, differentiation and morphogenesis
suggested_questions:
- question: Which cyclin-CDK complexes does CKI-1 inhibit directly? Genetics points to CYE-1/CDK-2
    and a direct CYD-1 interaction is reported; has inhibition of either kinase by purified
    CKI-1 been measured?
  experts:
  - Cell-cycle biochemists
  - C. elegans cell-cycle researchers
- question: Is CKI-1 found outside the nucleus in any worm cell, and does it have a cytoplasmic
    function like mammalian p27 and p21?
  experts:
  - C. elegans cell biologists
- question: How do cki-1 and cki-2 divide the work of quiescence, given that they act in distinct
    pathways and only cki-1 interacts genetically with lin-35 Rb?
  experts:
  - C. elegans developmental geneticists
suggested_experiments:
- experiment_type: In vitro kinase inhibition
  description: Purify CKI-1 and assay inhibition of reconstituted CYE-1/CDK-2 and CYD-1/CDK-4
    kinase activity, with point mutants in the conserved cyclin- and CDK-binding motifs of the
    CDI domain.
  hypothesis: CKI-1 directly inhibits CYE-1/CDK-2 and binds CYD-1/CDK-4, as mammalian p27 does.
- experiment_type: Endogenous localisation
  description: Tag endogenous CKI-1 (e.g. with a degron-compatible fluorescent tag) and image
    it across lineages and stages, including dauer and L1 arrest, and in cdc-14 and lrr-1 mutants.
  hypothesis: Endogenous CKI-1 is nuclear in quiescent cells; any cytoplasmic pool is transient
    and is reduced by CDC-14.
- experiment_type: Cell-specific depletion
  description: Use tissue-specific auxin-inducible degradation of endogenous CKI-1 in VPCs,
    the somatic gonad or the anchor cell to separate cell-autonomous quiescence roles from secondary
    fate effects.
  hypothesis: The fate defects of cki-1 loss (extra DTCs and ACs) follow from cell-autonomous
    loss of G1 arrest in the precursor cells.
