findings:
- category: gap
  text: No source mentions that cki-1 is essential in the embryo for cell-cycle exit, differentiation
    and morphogenesis (PMID:12885569); WormBase and UniProt describe postembryonic roles only.
    Recorded as MISSING_STATEMENT defects on both.
  sources:
  - UniProt
  - Alliance_Imported
  - Alliance_Automated
  - RefSeq
- category: gap
  text: 'No source names the transcriptional regulators that set cki-1 levels in specific arrests:
    DAF-16 in L1 arrest (PMID:16631585), LIN-1/LIN-31 in the VPCs (PMID:18082681) and NHR-67
    in the invading anchor cell (PMID:26506306).'
  sources:
  - UniProt
  - Alliance_Imported
  - Alliance_Automated
  - RefSeq
- category: insight
  text: 'The UniProt statement that CUL-2 "may" target CKI-1 for degradation is now resolved:
    CRL2-LRR-1 promotes CKI-1 degradation and limits nuclear CKI-1 in germ cells (PMID:21074724).'
  sources:
  - UniProt
- category: insight
  text: The automated text calls CDK inhibitor activity "predicted"; genetic epistasis with
    cye-1 and cdk-2 supports it in vivo (PMID:17476329), but no biochemical assay on worm CKI-1
    was found.
  sources:
  - Alliance_Automated
  - RefSeq
review:
  reviewer: AI
  rubrics:
  - rubric: overall_concordance
    score: 4
  overall_notes: All texts agree that CKI-1 is a p27-family CDK inhibitor that restrains division;
    none contradicts another. UniProt is the most complete; WormBase is accurate but postembryonic
    only; the automated texts are generic.
