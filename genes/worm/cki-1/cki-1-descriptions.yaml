descriptions:
- source: UniProt
  text: Negative cell-cycle regulator that functions at the G1-to-S- phase transition (PubMed:10587644,
    PubMed:9716524). Required for suspension of the cell cycle in dauer larvae and starved L1
    larvae (PubMed:10587644, PubMed:9716524). In vulval precursor cells (VPCs), a pathway of
    heterochronic genes acts via cki-1 to maintain VPCs in G1 during the L2 larval stage (PubMed:10587644,
    PubMed:15247923, PubMed:9716524). Cul-2 may function in ubiquitin-mediated degradation by
    targeting cki-1 for degradation (PubMed:10587644). Involved in distal tip cell development
    by repressing and modulating cye-1/cdk-2 activity levels in Z1.aa/Z4.pp and in Z1.ap/Z4.pa
    (PubMed:17476329).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q22197
