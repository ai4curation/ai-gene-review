    - rubric: specificity
      score: 4
    overall_notes: 'Accurate and cited: G1/S inhibition, arrest in dauer and starved L1, VPC
      quiescence in L2, CUL-2-dependent turnover and the DTC-lineage role all match their papers.
      The CUL-2 sentence keeps a 1999 hedge that CRL2-LRR-1 work (PMID:21074724) has since resolved.
      It omits the essential embryonic role (PMID:12885569) and the transcriptional regulators
      of cki-1.'
- source: Alliance_Imported
  text: cki-1 encodes a homolog of the mammalian cyclin-dependent kinase inhibitor p27/KIP1
    that is required for the arrest of cell division in larval blast lineages, dauer larvae
    and starved L1 larvae; excess CKI-1 expression prematurely stops cell division while cki-1(RNAi)
    induces extra cell divisions, indicating that CKI-1 quantitatively regulates the amount
    of mitosis in postembryonic worms.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00000516;class=Gene
  source_id: WB:WBGene00000516
  review:
    reviewer: AI
    rubrics:
    - rubric: correctness
      score: 5
    - rubric: utility
      score: 4
    - rubric: compactness
      score: 4
    - rubric: completeness
      score: 3
    - rubric: specificity
      score: 4
    overall_notes: 'Every claim traces to Hong et al. 1998 (PMID:9716524): p27/KIP1 homology,
      arrest in blast lineages, dauer and starved L1, and the overexpression and RNAi phenotypes.
      It is limited to postembryonic roles and omits the essential embryonic role, the VPC and
      anchor-cell G1 arrests and the regulators of CKI-1 levels.'
- source: Alliance_Automated
  text: Predicted to enable cyclin-dependent protein serine/threonine kinase inhibitor activity.
    Involved in several processes, including gonad development; regulation of cell cycle process;
    and regulation of cell division. Located in nucleus. Is expressed in several structures,
    including excretory duct; hermaphrodite somatic gonadal cell; hypodermal cell; pharynx;
    and somatic gonad precursor. Human ortholog(s) of this gene implicated in acute myeloid
    leukemia; breast cancer; multiple endocrine neoplasia type 4; and myelodysplastic syndrome.
    Orthologous to human CDKN1B (cyclin dependent kinase inhibitor 1B).
