gene_symbol: fshr-1
organism: worm
uniprot_id: L8EC40
taxon_id: NCBITaxon:6239
descriptions:
- source: Alliance_Imported
  text: fshr-1 encodes a putative neuropeptide receptor required for normalacetylcholine
    secretion by synapses; FSHR-1 is orthologous to humanfollicle-stimulating hormone
    receptor (OMIM:136435; mutated in ovariandysgenesis), thyrotropin receptor (OMIM:603372;
    mutated inhyperthyroidism), and luteinizing hormone receptor (OMIM:152790, mutatedin
    precocious puberty); fshr-1 mutants have abnormally many GFP::SNB-1puncta at synapses,
    suggesting exocytotic defects; the requirement forFSHR-1 and ten other predicted
    neuropeptide signalling proteins incholinergic neurotransmission indicates that
    such signalling isimportant for regulating acetylcholine release at neuromuscularjunctions;
    possible ligands of FSHR-1 are FLP-1 and NLP-12.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00008239;class=Gene
  source_id: WB:WBGene00008239
- source: Alliance_Automated
  text: Predicted to enable G protein-coupled peptide receptor activity. Involved
    in several processes, including defense response to Gram-negative bacterium; innate
    immune response; and stress response to cadmium ion. Predicted to be located in
    membrane. Predicted to be active in plasma membrane. Is expressed in several structures,
    including cephalic sheath cell; intestine; neurons; spermatheca; and vulva. Human
    ortholog(s) of this gene implicated in several diseases, including Graves ophthalmopathy;
    Leydig cell tumor; autoimmune disease of endocrine system (multiple); gonadal
    disease (multiple); and hyperthyroidism (multiple). Orthologous to human FSHR
    (follicle stimulating hormone receptor); LHCGR (luteinizing hormone/choriogonadotropin
    receptor); and TSHR (thyroid stimulating hormone receptor).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00008239;class=Gene
  source_id: WB:WBGene00008239
