- term:
    id: GO:0016500
    label: protein-hormone receptor activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: IEA annotation based on the InterPro glycoprotein hormone receptor family
      (IPR002131). FSHR-1 is activated by a protein hormone. Recombinant GPLA-1/GPA2
      and GPLB-1/GPB5, the C. elegans orthologs of the thyrostimulin subunits, each
      increase cAMP signaling by FSHR-1 in cultured cells (PMID:37409228).
    action: ACCEPT
    reason: The earlier REMOVE assumed that FSHR-1 has no hormone ligand. That premise
      is refuted. C. elegans lacks the vertebrate gonadotropins but has the ancestral
      glycoprotein hormone GPA2/GPB5. Kenis et al. (PMID:37409228) showed that the
      worm subunits activate FSHR-1 in a CRE-luciferase cAMP assay, with no response
      in vector-transfected cells. In vivo they act in the same growth pathway as FSHR-1.
      Buckley et al. (PMID:39561202) showed that intestinal FSHR-1 activity in neuromuscular
      regulation requires both ligands. The InterPro mapping is therefore correct for
      this protein. GO has no term specific to thyrostimulin or GPA2/GPB5 receptors,
      so GO:0016500 is the most specific term for the ligand class. It is the receptor's
      core molecular function together with GO:0004930. Physical association rests
      on a reported co-precipitation of GPLA-1 with the FSHR-1 extracellular domain,
      which PMID:39561202 cites but which is not cached here. Activation rests on the
      ligand-dependent cAMP response.
    supported_by:
    - reference_id: PMID:37409228
      supporting_text: Recombinant proteins purified from cells expressing both subunits
        significantly increased cAMP signaling by FSHR-1, suggesting that GPLA-1/GPLB-1
        is a ligand of FSHR-1
    - reference_id: PMID:37409228
      supporting_text: None of the purified recombinant proteins elicited a significant
        cAMP response in cells transfected with an empty control vector instead of the
        FSHR-1 expression plasmid
    - reference_id: PMID:39561202
      supporting_text: the activity of the FSHR-1 receptor in the C. elegans intestine
        requires the presence of the GPLA-1 and GPLB-1 ligands
- term:
    id: GO:0050829
    label: defense response to Gram-negative bacterium
  evidence_type: IMP
  original_reference_id: PMID:19196974
  qualifier: involved_in
  review:
    summary: IMP annotation based on mutant phenotype. fshr-1 mutants are hypersensitive
      to killing by Pseudomonas aeruginosa PA14 (Gram-negative pathogen). FSHR-1 activates
      antimicrobial gene expression in response to PA14 infection.
    action: ACCEPT
    reason: Core function of FSHR-1. The original characterization paper (PMID:19196974)
      identified FSHR-1 in a screen for immune regulators and demonstrated its requirement
      for defense against Gram-negative PA14. This is strongly supported by experimental
      evidence including survival assays, gene expression studies, and rescue experiments.
    supported_by:
    - reference_id: PMID:19196974
      supporting_text: We screened all LRR-containing transmembrane receptors in C.
        elegans and identified the G protein-coupled receptor FSHR-1 as an important
        component of the C. elegans immune response to Gram-negative and Gram-positive
        bacterial pathogens
    - reference_id: PMID:26360906
      supporting_text: infected fshr-1(ok778) worms have a mean survival time of 39
        hours, significantly less than the wild-type mean survival time of 73 hours
        (P<0.0001)
