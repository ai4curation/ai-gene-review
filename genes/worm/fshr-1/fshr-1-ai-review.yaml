- id: PMID:37409228
  title: Ancestral glycoprotein hormone-receptor pathway controls growth in C. elegans.
  findings:
  - statement: GPLA-1 and GPLB-1, alone or together, increase cAMP signaling by FSHR-1
      in HEK cells, with no response in vector-transfected cells
    supporting_text: We found that GPLA-1 as well as GPLB-1 increased cAMP signaling
      by FSHR-1
  - statement: gpla-1, gplb-1 and fshr-1 act in one growth-regulating pathway in vivo
    supporting_text: This suggests they all act in the same growth-regulating pathway
      in vivo, consistent with our finding that FSHR-1 is a receptor for GPLA-1 and
      GPLB-1 in vitro.
  - statement: FSHR-1 acts in the intestine and glia to promote growth
    supporting_text: Taken together, our results show that FSHR-1 regulates growth
      in the intestine and glial cells
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached. Primary identification of GPLA-1/GPLB-1 as FSHR-1
      ligands, by a CRE-luciferase cAMP assay in HEK cells with recombinant subunits
      and vector controls, plus in vivo epistasis and tissue-specific rescue for body
      size. Reports basal (ligand-independent) FSHR-1 cAMP activity as well. This is
      reference [48] of PMID:39561202.
core_functions:
- description: FSHR-1 is the receptor for the thyrostimulin-like glycoprotein hormone
    GPLA-1/GPLB-1 (GPA2/GPB5 orthologs). Either subunit, or the heterodimer, activates
    it and raises cAMP signaling. Through FSHR-1 in the intestine and glia the hormone
    promotes body growth, and intestinal FSHR-1 needs both subunits to promote neuromuscular
    function.
