suggested_questions:
- question: GPLA-1/GPA2 and GPLB-1/GPB5 activate FSHR-1 in vitro and act upstream of
    it in growth (PMID:37409228) and at the neuromuscular junction (PMID:39561202). Are
    they also the ligands in
    the immune response, or does infection activate FSHR-1 through a different, damage-associated
    signal?
  experts:
  - GPCR pharmacologists
  - C. elegans innate immunity researchers
- question: For the neuromuscular role, GSA-1/Gas and ACY-1 act genetically downstream
    (PMID:39561202). Does the intestinal immune response use the same Gs-cAMP route, and
    what intestinal signal relays FSHR-1 activity to cholinergic motor neurons?
  experts:
  - GPCR signaling specialists
  - C. elegans signaling researchers
- question: What is the relationship between FSHR-1 and the p38 MAPK/pmk-1 pathway
    at the molecular level?
  experts:
  - C. elegans immunity researchers
  - MAPK signaling specialists
- question: Beyond body growth (PMID:37409228), does FSHR-1 have any function in reproduction
    or development given its sequence similarity to mammalian FSH receptor?
  experts:
  - C. elegans developmental biologists
  - Reproductive biology specialists
suggested_experiments:
- experiment_type: Ligand requirement in immunity
  description: Test gpla-1 and gplb-1 single and double mutants, with and without fshr-1,
    for survival on PA14 and for infection-induced gene expression; in parallel, screen
    infected-worm extracts or pathogen-conditioned media for further FSHR-1 activators
    in the cAMP reporter assay
  hypothesis: FSHR-1 activity during infection depends on GPLA-1/GPLB-1, or on an additional
    infection-associated ligand, or on the receptor's basal activity
- experiment_type: G protein coupling analysis
  description: Determine G protein coupling specificity using mutant analysis of Gs,
    Gq, and other G protein subunits in combination with fshr-1
  hypothesis: FSHR-1 couples to specific G protein subunits to activate immune gene
    expression
- experiment_type: ROS sensing analysis
  description: Investigate potential role of FSHR-1 in detecting reactive oxygen species
    or lipid peroxidation products as DAMPs
  hypothesis: FSHR-1 senses oxidative damage caused by infection rather than pathogen
    molecules directly
- experiment_type: Tissue-specific RNAi
  description: Test whether FSHR-1 functions in other tissues besides intestine using
    tissue-specific RNAi or rescue
  hypothesis: FSHR-1 function is restricted to the intestine where it encounters ingested
    pathogens
