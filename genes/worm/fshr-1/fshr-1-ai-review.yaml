- term:
    id: GO:0050830
    label: defense response to Gram-positive bacterium
  evidence_type: IMP
  original_reference_id: PMID:19196974
  review:
    summary: NEW annotation based on experimental evidence. FSHR-1 is required for
      defense against Gram-positive pathogens Staphylococcus aureus and Enterococcus
      faecalis.
    action: NEW
    reason: The publications demonstrate fshr-1 mutants are sensitive to Gram-positive
      pathogens S. aureus and E. faecalis, not just Gram-negative PA14. This is explicitly
      stated in both publications. The annotation for Gram-negative defense exists
      but the corresponding Gram-positive annotation should be added.
    supported_by:
    - reference_id: PMID:19196974
      supporting_text: the G protein-coupled receptor FSHR-1 as an important component
        of the C. elegans immune response to Gram-negative and Gram-positive bacterial
        pathogens
    - reference_id: PMID:26360906
      supporting_text: fshr-1(ok778) mutants are more sensitive than wild-type worms
        to infection by diverse pathogens, including not only the Gram negative pathogen
        PA14, but also the Gram positive bacterial pathogens Staphylococcus aureus
        (P>0.01) and Enterococcus faecalis (P>0.05)
- term:
    id: GO:1900075
    label: positive regulation of neuromuscular synaptic transmission
  evidence_type: IMP
  original_reference_id: PMID:39561202
  review:
    summary: NEW annotation. FSHR-1 promotes cholinergic transmission at the neuromuscular
      junction. Loss of fshr-1 causes aldicarb resistance, reduced muscle contraction
      and synaptic vesicle accumulation in cholinergic motor neurons. Intestinal re-expression
      rescues these defects, and intestine-specific knockdown reproduces them.
    action: NEW
    reason: The WormBase curated description (file:worm/fshr-1/fshr-1-deep-research-wormbase.md)
      pointed to this role, which the review had missed. A dedicated study (PMID:39561202)
      confirms it, building on the original RNAi screen hit (PMID:16049479). A regulation
      term is the right shape. FSHR-1 is a receptor whose signaling, mainly from the
      intestine, increases synaptic vesicle release. It does not carry out synaptic
      transmission itself, so a participation term such as chemical synaptic transmission
      would be wrong. The effect is cell non-autonomous, and the relay from intestine
      to motor neuron is not identified. The term is therefore non-core context and not
      part of core_functions. It is preferred to GO:0032224 (positive regulation of synaptic
      transmission, cholinergic) because the synapse is neuromuscular.
    supported_by:
    - reference_id: PMID:39561202
      supporting_text: Inhibition of fshr-1 expression reduces muscle contraction and
        leads to synaptic vesicle accumulation in cholinergic motor neurons.
    - reference_id: PMID:39561202
      supporting_text: Intestine-specific knockdown of FSHR-1 reduces neuromuscular function,
        indicating FSHR-1 is both necessary and sufficient in the intestine for its neuromuscular
        effects.
