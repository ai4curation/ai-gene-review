    label: plasma membrane
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  review:
    summary: FSHR-1 is a multi-pass transmembrane G protein-coupled receptor localized
      to the plasma membrane. UniProt annotations indicate Cell membrane localization.
      The IBA annotation is based on phylogenetic inference from mammalian FSHR orthologs
      which are established plasma membrane receptors.
    action: ACCEPT
    reason: The plasma membrane localization is consistent with FSHR-1 being a GPCR
      that functions in intestinal cells to sense and respond to pathogens and stress.
      Intestinal expression of fshr-1 rescues the pathogen sensitivity phenotype (PMID:26360906).
      The seven transmembrane domains predicted in UniProt support plasma membrane
      localization.
    supported_by:
    - reference_id: PMID:26360906
      supporting_text: Expression of fshr-1 in the intestine is necessary and sufficient
        for its role in the response to infection by PA14
    - reference_id: file:worm/fshr-1/fshr-1-deep-research-falcon.md
      supporting_text: 'model: Edison Scientific Literature'
- term:
    id: GO:0007189
    label: adenylate cyclase-activating G protein-coupled receptor signaling pathway
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: The IBA annotation infers adenylate cyclase-activating GPCR signaling
      from the PAINT root node of the LGR family, where Gs coupling and cAMP elevation
      are shared by the characterized glycoprotein hormone, bursicon and relaxin-family
      receptors. For FSHR-1 this is now shown directly. Its ligands GPLA-1 and GPLB-1
      increase cAMP signaling by FSHR-1 in a CRE-luciferase assay in HEK cells
      (PMID:37409228), and GSA-1/Gas and ACY-1/adenylyl cyclase act genetically downstream
      of intestinal FSHR-1 in vivo (PMID:39561202).
    action: ACCEPT
    reason: The root placement holds for FSHR-1. FSHR-1 belongs to the invertebrate
      GPA2/GPB5-receptor clade (SF74), a sister of the vertebrate glycoprotein hormone
      receptors, and no IRD or IKR sits on its lineage. The earlier reason for keeping
      this row non-core was the lack of a cAMP assay, and Kenis et al. (PMID:37409228)
      now supply one. Recombinant GPLA-1, GPLB-1 or the heterodimer raises cAMP signaling
      in FSHR-1-expressing cells but not in vector-transfected cells. The receptor also
      shows basal cAMP activity. In vivo, gain-of-function gsa-1 and acy-1 alleles act
      downstream of FSHR-1 in neuromuscular regulation (PMID:39561202). The pathway
      is therefore the receptor's own signaling route and is accepted as core. FSHR-1
      also signals in parallel to p38 MAPK in immunity (PMID:19196974), and whether
      that role also runs through Gs-cAMP has not been tested.
    supported_by:
    - reference_id: PMID:37409228
      supporting_text: Recombinant proteins purified from cells expressing both subunits
        significantly increased cAMP signaling by FSHR-1, suggesting that GPLA-1/GPLB-1
        is a ligand of FSHR-1
    - reference_id: PMID:37409228
      supporting_text: None of the purified recombinant proteins elicited a significant
        cAMP response in cells transfected with an empty control vector instead of the
        FSHR-1 expression plasmid
    - reference_id: PMID:39561202
      supporting_text: Epistasis experiments support a model in which GαS and adenylyl
        cyclase, as well as SPHK signaling, act downstream of FSHR-1 in its control of
        neuromuscular activity
    - reference_id: PMID:19196974
      supporting_text: FSHR-1 signals in parallel to the known p38 MAPK pathway but
        converges to regulate the transcriptional induction of an overlapping but
        nonidentical set of antimicrobial effectors
- term:
    id: GO:0009755
    label: hormone-mediated signaling pathway
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: This IBA comes from the PAINT root node of the LGR family (PTN000689980),
      seeded by rat Lhcgr. FSHR-1 transduces a hormone signal. C. elegans lacks the
      vertebrate gonadotropins but has the ancestral glycoprotein hormone GPA2/GPB5
      (thyrostimulin), encoded by gpla-1 and gplb-1. Each subunit, or the heterodimer,
      activates FSHR-1 in vitro, and both act through FSHR-1 in vivo.
    action: ACCEPT
    reason: The earlier REMOVE assumed that FSHR-1 has no hormone ligand, and the gene's
      own literature refutes that. Kenis et al. (PMID:37409228) showed that recombinant
      GPLA-1 and GPLB-1 increase cAMP signaling by FSHR-1. In vivo, gpla-1, gplb-1
      and fshr-1 mutants are non-additive for body size, and FSHR-1 acts in the intestine
      and glia to promote growth. Buckley et al. (PMID:39561202) found the same ligand
      requirement for neuromuscular function. Intestinal FSHR-1 overexpression fails
      to raise swimming rates without gpla-1 or gplb-1. The PAINT reading also holds.
      The root node covers the type A glycoprotein hormone receptors and their invertebrate
      GPA2/GPB5-receptor sister clade, which contains FSHR-1 (SF74). Its only exceptions
      are the vertebrate LGR4/5/6 clades, whose ligands are R-spondins rather than
      hormones. No loss sits on the FSHR-1 lineage. The immune and stress roles
      (PMID:19196974, PMID:26360906) do not argue against this term. They are additional
      roles, and whether they use the same ligands is untested. GO has no term for
      thyrostimulin signaling, so this is the most specific process term available.
    supported_by:
    - reference_id: PMID:37409228
      supporting_text: This suggests they all act in the same growth-regulating pathway
        in vivo, consistent with our finding that FSHR-1 is a receptor for GPLA-1 and
        GPLB-1 in vitro.
    - reference_id: PMID:37409228
      supporting_text: Taken together, our results show that FSHR-1 regulates growth
        in the intestine and glial cells
    - reference_id: PMID:39561202
      supporting_text: the activity of the FSHR-1 receptor in the C. elegans intestine
        requires the presence of the GPLA-1 and GPLB-1 ligands
- term:
    id: GO:0008528
    label: G protein-coupled peptide receptor activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  review:
    summary: The IBA annotation infers peptide receptor activity from the PAINT root
      node of the LGR family. FSHR-1 is a G protein-coupled receptor whose known ligands
      are the glycoprotein hormone subunits GPLA-1/GPA2 and GPLB-1/GPB5 (PMID:37409228).
      GO files receptors for glycoprotein hormones under protein-hormone receptor activity,
      not peptide receptor activity.
    action: MODIFY
    reason: The G protein-coupled receptor half of the claim is sound. The ligand class
      is wrong for FSHR-1. Its ligands are the cystine-knot glycoprotein hormone subunits
      GPLA-1 and GPLB-1, and GO places the activities of receptors for such hormones
      (GO:0004964, GO:0004996, GO:0035472) under both GO:0004930 and GO:0016500 protein-hormone
      receptor activity, not under GO:0008528. FSHR-1 belongs to the type A receptors.
      For these, the family review (PTHR24372) judges the root peptide-receptor IBD
      too deep and recommends GPCR activity at the root, with the ligand class asserted
      at the type A clades. The replacement therefore pairs GO:0004930 with GO:0016500,
      both of which FSHR-1 already carries. The earlier reason for this MODIFY assumed
      the ligand was unknown and might be an infection signal. The receptor for the
      thyrostimulin-like hormone has since been identified, so that reason no longer
      holds. Whether infection activates FSHR-1 through the same ligands is untested.
    proposed_replacement_terms:
    - id: GO:0004930
      label: G protein-coupled receptor activity
    - id: GO:0016500
      label: protein-hormone receptor activity
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - GRANULARITY_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN000689980
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: LGR family root node. G protein-coupled receptor activity holds across
          the type A clade that contains FSHR-1, but the peptide-ligand class fits only
          the relaxin-family and bursicon receptors. Receptors for glycoprotein hormones,
          including the GPA2/GPB5 receptor FSHR-1, sit under protein-hormone receptor
          activity in GO.
      - source_id: RGD:3007
        source_label: Lhcgr
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Rat lutropin receptor, one of the two IBD seeds. Its ligand is a glycoprotein
          hormone too, so the same branch question applies to the seed.
      - source_id: FB:FBgn0003255
        source_label: rk
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Drosophila rickets, the bursicon receptor and the other IBD seed. It
          is a type B receptor, outside the clade that contains FSHR-1.
    supported_by:
    - reference_id: PMID:37409228
      supporting_text: We found that GPLA-1 as well as GPLB-1 increased cAMP signaling
        by FSHR-1
    - reference_id: PMID:37409228
      supporting_text: Taken together, these results suggest that GPLA-1 and GPLB-1
        are cognate ligands of FSHR-1.
