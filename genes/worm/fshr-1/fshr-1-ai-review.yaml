id: L8EC40
gene_symbol: fshr-1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: FSHR-1 is a leucine-rich-repeat G protein-coupled receptor and the sole
  C. elegans ortholog of the mammalian glycoprotein hormone receptors (FSHR, LHCGR,
  TSHR). It is the receptor for the thyrostimulin-like glycoprotein hormone formed by
  GPLA-1/GPA2 and GPLB-1/GPB5. Either subunit, or the two together, increases cAMP
  signaling by FSHR-1 in cultured cells, and the hormone acts through FSHR-1 in the
  intestine and glia to promote body growth. FSHR-1 acts mainly in the intestine,
  where it is also required for innate immunity. It signals in parallel
  to the p38 MAPK pathway to induce antimicrobial effectors and oxidative stress
  response genes (including gcs-1), and it is needed to resist Gram-negative (Pseudomonas
  aeruginosa) and Gram-positive (Staphylococcus aureus, Enterococcus faecalis) bacteria,
  oxidative stress and cadmium, but not heat. Intestinal FSHR-1 also promotes
  acetylcholine release at neuromuscular junctions through inter-tissue signaling.
  fshr-1 mutants are resistant to aldicarb and accumulate synaptic vesicles and
  UNC-10/RIM in cholinergic motor neurons, and intestinal re-expression restores
  neuromuscular function. In this role GSA-1/Gas, ACY-1/adenylyl cyclase and SPHK-1
  sphingosine kinase act genetically downstream of the receptor. FSHR-1 is also required
  for learned aversion to pathogens.
