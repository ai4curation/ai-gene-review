- term:
    id: GO:1990170
    label: stress response to cadmium ion
  evidence_type: IMP
  original_reference_id: PMID:26360906
  qualifier: involved_in
  review:
    summary: IMP annotation based on mutant phenotype. fshr-1 mutants are hypersensitive
      to cadmium stress. Intestinal expression of fshr-1 rescues the cadmium sensitivity
