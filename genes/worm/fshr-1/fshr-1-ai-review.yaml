- id: PMID:19196974
  title: The G protein-coupled receptor FSHR-1 is required for the Caenorhabditis
    elegans innate immune response
  findings:
  - statement: FSHR-1 identified in screen of LRR-containing transmembrane receptors
      for immune function
    supporting_text: We screened all LRR-containing transmembrane receptors in C.
      elegans and identified the G protein-coupled receptor FSHR-1 as an important
      component of the C. elegans immune response
  - statement: Required for defense against Gram-negative and Gram-positive pathogens
    supporting_text: FSHR-1 as an important component of the C. elegans immune response
      to Gram-negative and Gram-positive bacterial pathogens
  - statement: Acts in the intestine
    supporting_text: FSHR-1 acts in the C. elegans intestine, the primary site of
      exposure to ingested pathogens
  - statement: Signals parallel to p38 MAPK pathway
    supporting_text: FSHR-1 signals in parallel to the known p38 MAPK pathway but
      converges to regulate the transcriptional induction of an overlapping but nonidentical
      set of antimicrobial effectors
  - statement: Regulates transcriptional induction of antimicrobial effectors
    supporting_text: FSHR-1 signals in parallel to the known p38 MAPK pathway but
      converges to regulate the transcriptional induction of an overlapping but nonidentical
      set of antimicrobial effectors
  - statement: May act as pathogen receptor or general immune booster
    supporting_text: FSHR-1 may act generally to boost the nematode immune response,
      or it may function as a pathogen receptor
- id: PMID:26360906
  title: The Conserved G-Protein Coupled Receptor FSHR-1 Regulates Protective Host
    Responses to Infection and Oxidative Stress
  findings:
  - statement: FSHR-1 delays pathogen accumulation in the intestine
    supporting_text: fshr-1(ok778) mutants have already accumulated a significantly
      greater amount of the fluorescent pathogen in their intestinal lumens (P<0.0001)
  - statement: Required for defense against diverse pathogens including PA14, S. aureus,
      E. faecalis
    supporting_text: fshr-1(ok778) mutants are more sensitive than wild-type worms
      to infection by diverse pathogens, including not only the Gram negative pathogen
      PA14, but also the Gram positive bacterial pathogens Staphylococcus aureus (P>0.01)
      and Enterococcus faecalis (P>0.05)
  - statement: Required for survival of oxidative stress (paraquat) and cadmium stress
    supporting_text: fshr-1(ok778) mutants died significantly more quickly in the
      presence of cadmium than wild-type worms (One-way ANOVA, F = 110.68; Tukey HSD
      test, P<0.05)
  - statement: NOT required for thermal stress survival
    supporting_text: "The mean survival of fshr-1(ok778) mutants at 37°C is not significantly\
      \ different from the survival of wild-type worms (One-way ANOVA, F = 0.42, P\
      \ = 0.669), indicating that the fshr-1 pathway does not respond to the damage\
      \ caused by high heat"
  - statement: Regulates expression of immune and stress response genes
    supporting_text: when we examined the reported functions of the genes whose expression
      in infected worms depends on fshr-1, we observed that many were known antimicrobial
      infection response genes; in addition, 18% of fshr-1-regulated genes were associated
      with some type of cellular stress
  - statement: Required for induction of gcs-1 oxidative stress response gene
    supporting_text: fshr-1(ok778) mutant worms fail to induce expression of gcs-1::gfp
      upon PA14 infection
  - statement: Mediates learned pathogen avoidance behavior
    supporting_text: fshr-1(ok778) mutants are impaired in their ability to learn
      pathogen avoidance. 45% of fshr-1(ok778) mutants remain on a lawn of PA14 after
      9 hours of exposure
  - statement: Acts in intestine for all characterized functions
