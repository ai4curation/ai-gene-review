core_functions:
- description: >-
    POS-1 binds the UA-rich POS-1 recognition element in the 3' UTRs of maternal mRNAs and
    represses their translation or expression in posterior and germline blastomeres: glp-1
    (excluding GLD-1 from the spatial control region), zif-1, and neg-1 (opposing GLD-2/GLD-3
    cytoplasmic polyadenylation). This restricts GLP-1/Notch and NEG-1 to anterior cells and
    protects germline proteins from ZIF-1-mediated degradation.
  molecular_function:
    id: GO:0000900
    label: mRNA regulatory element binding translation repressor activity
  directly_involved_in:
  - id: GO:0017148
    label: negative regulation of translation
  - id: GO:0001708
    label: cell fate specification
  locations:
  - id: GO:0005737
    label: cytoplasm
  supported_by:
  - reference_id: PMID:12702662
    supporting_text: We show that a CCCH zinc-finger protein, POS-1, represses glp-1 mRNA translation
      by binding to the spatial control region.
  - reference_id: PMID:26096734
    supporting_text: In posterior cells, POS-1 binds the neg-1 3' UTR to oppose GLD-2 and GLD-3 activities
      that promote NEG-1 expression and cytoplasmic lengthening of the neg-1 mRNA poly(A) tail.
  - reference_id: PMID:22265679
    supporting_text: POS-1, MEX-3, and SPN-4 function as repressors of ZIF-1 expression, whereas MEX-5
      and MEX-6 antagonize this repression. All five proteins bind directly to the zif-1 3' UTR in
      vitro.
- description: >-
    In the germline blastomeres POS-1 also promotes translation of maternal mRNAs: apx-1 in P2,
    which supplies the Notch ligand for ABp, mom-2, and nos-2 in P4, where it relieves
    SPN-4/MEX-3 repression. This contributes to germline founder cell specification.
  molecular_function:
    id: GO:0003730
    label: mRNA 3'-UTR binding
  directly_involved_in:
  - id: GO:0045727
    label: positive regulation of translation
  locations:
  - id: GO:0043186
    label: P granule
  - id: GO:0005737
    label: cytoplasm
  supported_by:
  - reference_id: PMID:16499902
    supporting_text: Finally, the germ plasm component POS-1 activates nos-2 translation in the PGCs.
  - reference_id: PMID:18417623
    supporting_text: The POS-1:SPN-4 ratio in P(4) increases significantly over its precursor, P(3);
      and POS-1 competes with SPN-4 for binding to nos-2 RNA in vitro.
  - reference_id: PMID:9834181
    supporting_text: The earliest defect detected in pos-1 mutants is the failure to express APX-1
      protein from maternally provided apx-1 mRNA
