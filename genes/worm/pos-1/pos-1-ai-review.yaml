- term:
    id: GO:0045727
    label: positive regulation of translation
  evidence_type: IMP
  original_reference_id: PMID:16499902
  qualifier: involved_in
  review:
    summary: >-
      POS-1 activates translation of maternal nos-2 in P4, apx-1 in P2 and mom-2 in the P
      lineage. For nos-2 it relieves repression by SPN-4 and MEX-3, partly by competing with
      SPN-4 for the nos-2 3' UTR.
    action: NEW
    reason: >-
      Participation: POS-1 binds the 3' UTRs of its targets, competes in vitro with the
      repressor SPN-4 for nos-2 RNA (PMID:18417623), and is required for nos-2 translation
      in the primordial germ cells (PMID:16499902). It is also required for APX-1 expression
      from maternal apx-1 mRNA (PMID:9834181) and promotes mom-2 translation
      (PMID:24131629, PMID:30279189). Comparator check: maternal RBPs that regulate
      translation carry translation-regulation terms (OMA-1, MEX-3), and POS-1 itself
      already carries the negative term, so the missing positive term is a gap. The term
      sits beside, not above or below, the accepted negative regulation of translation,
      reflecting target-specific opposite effects.
    supported_by:
    - reference_id: PMID:16499902
      supporting_text: Finally, the germ plasm component POS-1 activates nos-2 translation in the PGCs.
    - reference_id: PMID:18417623
      supporting_text: Further, our results presented here suggest that POS-1 activates nos-2 translation
        in P4 by competing out SPN-4 for binding to nos-2 3′UTR.
    - reference_id: PMID:30279189
      supporting_text: maternal mom-2 RNA, which encodes the WNT ligand MOM-2, is translated specifically
        in P2 due to the combined regulation of PIE-1, MEX-5, MEX-6, POS-1, MEX-1, SPN-4 and MEX-3
- term:
