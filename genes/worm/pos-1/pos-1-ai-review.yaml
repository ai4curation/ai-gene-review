  review:
    summary: >-
      pos-1 mutants are maternal-effect lethal, and germ cell precursors adopt somatic fates;
      somatic fates of the posterior and ABp lineages are also altered.
    action: ACCEPT
    reason: >-
      POS-1 is a maternal fate determinant acting in the blastomeres that inherit it. Its
      control of maternal mRNAs (apx-1, glp-1, neg-1, nos-2) specifies germline and
      posterior fates (PMID:9834181, PMID:26096734). Core process.
    supported_by:
    - reference_id: PMID:9834181
      supporting_text: We show that maternal-effect lethal mutations in the gene pos-1 cause germ cell
        precursors to inappropriately adopt somatic cell fates.
