  review:
    summary: >-
      Phylogenetic inference seeded by human TTP, which bridges bound mRNAs to the CCR4-NOT
      deadenylase. For POS-1, recruitment of an effector complex is proposed but not shown.
    action: UNDECIDED
    reason: >-
      POS-1 binds target 3' UTRs sequence-specifically, and is found with MEG-1 in germline
      P-bodies that contain decapping and deadenylation regulators. Cassani and Seydoux
      (2022) describe it as a protein "predicted to recruit P-body proteins to maternal
      mRNAs", and its activity correlates with short poly(A) tails (PMID:26096734). No study
      has shown that POS-1 itself recruits a specific effector to its targets, and on some
      targets it acts by competing with other RBPs (SPN-4, GLD-1). The adaptor claim is
      plausible but untested.
