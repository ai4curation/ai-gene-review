- id: file:worm/pos-1/pos-1-uniprot.txt
  title: UniProtKB/Swiss-Prot entry G5EF15 (pos-1)
  findings: []
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: >-
      CC FUNCTION statements on the PRE, glp-1 repression, GLD-1 exclusion and neg-1 binding
      are well cited and correct. One statement is wrong: "promotes endo-mesoderm development
      in anterior blastomeres" places the effect in the wrong cells. POS-1 acts in posterior
      blastomeres to keep NEG-1 anterior, and endomesoderm arises from the posterior EMS
      lineage (PMID:26096734). The text also omits POS-1's positive translational role
      (nos-2, apx-1, mom-2).
    source_defects:
    - defect_type: WRONG_STATEMENT
      resource: UNIPROT
      record: UniProtKB:G5EF15
      slot: CC:FUNCTION
      requested_change: CHECK
      asserted_value: By inhibiting the cytoplasmic lengthening of neg-1 mRNA, restricts the accumulation
        of neg-1 protein and promotes endo-mesoderm development in anterior blastomeres
      confidence: CONFIRMED
      explanation: >-
        The CC FUNCTION comment says that POS-1 "restricts the accumulation of neg-1 protein
        and promotes endo-mesoderm development in anterior blastomeres (PubMed:26096734)".
        The cited paper shows the opposite geometry. NEG-1 localises to anterior nuclei,
        where it represses endo-mesoderm fates. In posterior cells POS-1 binds the neg-1
        3' UTR and opposes GLD-2/GLD-3-dependent poly(A) lengthening, which protects the
        posterior endo-mesoderm precursors from NEG-1. Suggested text: "...restricts neg-1
        protein accumulation to anterior blastomeres and thereby promotes endo-mesoderm
        development in posterior blastomeres."
      supported_by:
      - reference_id: PMID:26096734
        supporting_text: We show that NEG-1 localizes in anterior nuclei, where it negatively regulates
          endo-mesoderm fates. In posterior cells, POS-1 binds the neg-1 3' UTR to oppose GLD-2 and
          GLD-3 activities that promote NEG-1 expression and cytoplasmic lengthening of the neg-1 mRNA
          poly(A) tail.
      - reference_id: PMID:26096734
        supporting_text: Conversely, in posterior blastomeres, high POS-1 levels prevent GLD-2/GLD-3
          mediated activation of neg-1 mRNA translation and thus protect endo-mesoderm precursors from
          NEG-1 protein accumulation (Figure 6B).
    - defect_type: MISSING_STATEMENT
      resource: UNIPROT
      record: UniProtKB:G5EF15
      slot: CC:FUNCTION
      requested_change: ADD
      asserted_value: UniProtKB:G5EF15
      confidence: CONFIRMED
      explanation: >-
        The FUNCTION comment describes only POS-1's repressive roles (glp-1, neg-1). POS-1
        also activates translation of maternal mRNAs in germline blastomeres. It activates
        nos-2 translation in the primordial germ cells (PMID:16499902), by relieving
        SPN-4/MEX-3 repression and competing with SPN-4 for the nos-2 3' UTR
        (PMID:18417623). It is also required for APX-1 expression from maternal apx-1 mRNA
        in P2 (PMID:9834181). Suggested addition: "Also promotes translation of maternal
        nos-2 in P4 and is required for apx-1 expression in P2."
      supported_by:
      - reference_id: PMID:16499902
        supporting_text: Finally, the germ plasm component POS-1 activates nos-2 translation in the PGCs.
      - reference_id: PMID:9834181
        supporting_text: The earliest defect detected in pos-1 mutants is the failure to express APX-1
          protein from maternally provided apx-1 mRNA
- id: file:worm/pos-1/pos-1-deep-research-wormbase.md
  title: WormBase gene description for pos-1 (worm)
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: DISPUTED
    review_notes: >-
      WormBase curated description (uncited, undated). Claims traced: the CCCH zinc finger
      protein; maternal requirement for germline, intestine, pharynx and hypodermis fates
      (Tabara et al. 1999, PMID:9834181, full text read online); positive regulation of
      apx-1 and negative regulation of glp-1 translation via the glp-1 spatial control
      region (PMID:9834181, PMID:12702662); interaction with SPN-4 (PMID:12702662; an
      antagonistic POS-1/SPN-4 balance is supported by PMID:18417623); mRNA and protein
      expression and P granule association (PMID:9834181). One detail is wrong: the
      mex-6 3'-UTR binding was a yeast three-hybrid interaction, not an in vitro assay
      (PMID:17028349, PMC full text). The text omits the PRE specificity (PMID:18952820),
      the neg-1 polyadenylation mechanism behind the endoderm defect (PMID:26096734),
      zif-1 repression (PMID:22265679) and nos-2 activation (PMID:16499902).
    source_defects:
    - defect_type: WRONG_STATEMENT
      resource: WORMBASE
      record: WB:WBGene00004078
      slot: MOD_provided_gene_description
      requested_change: CHECK
      asserted_value: POS-1 can also bind the mex-6 3'-UTR in vitro
      confidence: PROBABLE
      explanation: >-
        The description says POS-1 "can also bind the mex-6 3'-UTR in vitro". The source
        study (Tenlen et al. 2006, PMID:17028349) tested this with the yeast three-hybrid
        assay ("We tested whether POS-1 can bind the 3'-UTR of mex-6 using the yeast
        trihybrid assay", PMC1698638 full text, read online; our cache holds only the
        abstract, which says POS-1 "binds the 3'-UTR of mex-6"). We found no in vitro
        binding study. Suggested wording: "POS-1 can also bind the mex-6 3'-UTR in a yeast
        three-hybrid assay".
      supported_by:
      - reference_id: PMID:17028349
        supporting_text: POS-1 binds the 3'-UTR of mex-6
    - defect_type: MISSING_STATEMENT
      resource: WORMBASE
      record: WB:WBGene00004078
      slot: MOD_provided_gene_description
      requested_change: ADD
      asserted_value: WB:WBGene00004078
      confidence: CONFIRMED
      explanation: >-
        The description does not explain POS-1's endoderm requirement, although the
        mechanism is known. In posterior blastomeres POS-1 binds the neg-1 3' UTR and opposes
        GLD-2/GLD-3 cytoplasmic polyadenylation, which keeps the endo-mesoderm repressor NEG-1
        anterior (PMID:26096734). The description also omits the POS-1 recognition element
        defined in vitro (PMID:18952820) and POS-1's activation of nos-2 translation in P4
        (PMID:16499902).
      supported_by:
      - reference_id: PMID:26096734
        supporting_text: In posterior cells, POS-1 binds the neg-1 3' UTR to oppose GLD-2 and GLD-3
          activities that promote NEG-1 expression and cytoplasmic lengthening of the neg-1 mRNA poly(A)
          tail.
suggested_questions:
- question: >-
    How does a single TZF protein repress some targets (glp-1, zif-1, neg-1) and activate
    others (nos-2, apx-1, mom-2)? Is the sign set by the surrounding 3'-UTR elements and
    competing RBPs (SPN-4, GLD-1, MEX-3), or by distinct POS-1 complexes, such as GLD-2 for
    apx-1 or P-body factors for repressed targets?
- question: >-
    Does POS-1 recruit deadenylation or decapping machinery to its targets, as TTP recruits
    CCR4-NOT, or does it act only by blocking GLD-2 polyadenylation and the access of other
    RBPs?
- question: >-
    How does POS-1 protect P2 cytokinesis by lowering septin and anillin at the division
    plane? Are UNC-59 or ANI-1 mRNAs direct POS-1 targets?
suggested_experiments:
- description: >-
    Map POS-1-bound mRNAs in early embryos by CLIP and combine them with ribosome profiling
    or polysome analysis of pos-1 mutant embryos, to classify targets as repressed or
    activated and relate the sign to PRE context and co-bound RBPs.
  experiment_type: CLIP-seq and translation profiling
- description: >-
    Test whether POS-1 tethered to a reporter 3' UTR (lambda-N/boxB) represses or activates
    translation in P lineage blastomeres, and whether it shortens poly(A) tails in a
    CCR4-NOT-dependent manner, to separate adaptor activity from competition with other RBPs.
  experiment_type: tethering reporter assay
