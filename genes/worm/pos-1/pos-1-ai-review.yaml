      requested_change: CHECK
      asserted_value: GO:0003714
      cause: SCOPE_OVER_REACH
      confidence: PROBABLE
      explanation: >-
        Transcription corepressor activity for POS-1 is inferred from repression by a
        GAL4-POS-1 zinc finger fusion in mammalian cell culture (PMC316391 full text, read
