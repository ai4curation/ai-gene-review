- term:
    id: GO:0000122
    label: negative regulation of transcription by RNA polymerase II
  evidence_type: IDA
  original_reference_id: PMID:9925644
  qualifier: involved_in
  review:
    summary: >-
      From the PIE-1 study of Batchelder et al. (1999), in which the POS-1 zinc finger region
      fused to the GAL4 DNA-binding domain also repressed a reporter in mammalian cells.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The cached record is the abstract, which concerns PIE-1. The PMC full text (read
      online) shows that a GAL4 fusion of the POS-1 zinc finger region, like that of human
      TTP, repressed transcription in a site-dependent manner. The authors cautioned that
      this repressor activity "should be interpreted cautiously" because neither protein is a
      transcription factor. POS-1 is a cytoplasmic RNA-binding protein (Tabara et al. 1999),
      and no study has shown it acting on transcription in worms. The row records real
      activity in a heterologous tethering assay whose biological relevance is not
      established, so it is marked over-annotated, not removed.
    supported_by:
    - reference_id: PMID:9834181
      supporting_text: pos-1 encodes a cytoplasmic zinc-finger protein essential for germline
        specification in C. elegans.
    - reference_id: file:worm/pos-1/pos-1-uniprot.txt
      record_section: ["CC:SUBCELLULAR LOCATION"]
      supporting_text: 'SUBCELLULAR LOCATION: Cytoplasm {ECO:0000269|PubMed:9834181}.'
    source_defects:
    - defect_type: WRONG_TERM
      resource: WORMBASE
      requested_change: CHECK
      asserted_value: GO:0000122
      cause: SCOPE_OVER_REACH
      confidence: PROBABLE
      explanation: >-
        This IDA row (and the transcription corepressor activity row from the same paper)
        rests on a GAL4 tethering assay in mammalian cells. There, a fusion of the POS-1
        zinc finger region repressed a reporter, as did the TTP zinc finger region, and the
        authors cautioned that the result "should be interpreted cautiously" (PMC316391
        full text, read online; the quoted sentence is not in our abstract-only cache).
        POS-1 is a cytoplasmic RNA-binding protein with no known transcriptional role.
        Please check whether the annotation should be kept.
- term:
    id: GO:0000289
    label: nuclear-transcribed mRNA poly(A) tail shortening
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:3525151
  - MGI:MGI:99180
  - PANTHER:PTN002648882
  - UniProtKB:P26651
  review:
    summary: >-
      Phylogenetic inference from the TTP clade. POS-1 activity correlates with short
      poly(A) tails on neg-1 and hundreds of other maternal mRNAs, but the mechanism shown is
      opposition to GLD-2 cytoplasmic polyadenylation, not deadenylation.
    action: KEEP_AS_NON_CORE
    reason: >-
      Elewa et al. (2015) found by PAT-seq that hundreds of maternal mRNAs have longer
      poly(A) tails when POS-1 is depleted, and that POS-1 binds the neg-1 3' UTR and
      opposes GLD-2/GLD-3-dependent lengthening of its tail. POS-1 also resides in germline
      P-bodies that contain deadenylation regulators (PMID:36196602). A role in keeping
      poly(A) tails short is therefore supported. Whether POS-1 promotes deadenylation, as
      TTP does, or only blocks polyadenylation is unresolved, so the inherited term is kept
      as non-core.
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      source_entities:
      - source_id: PANTHER:PTN002648882
        source_label: PTHR12547 TIS11/ZFP36 node (Eumetazoa)
        source_status: SUPPORTS_TRANSFER
        comment: The TTP seeds deadenylate their targets. For POS-1 the outcome, short
          poly(A) tails on targets, is shown, but the mechanism studied is opposition to
          GLD-2.
      residue_claims_not_applicable: Process claim; no residue-level argument is made.
    supported_by:
    - reference_id: PMID:26096734
      supporting_text: We show that POS-1 binds directly to two consensus binding sites in the neg-1
        3′UTR and that POS-1 activity correlates with short neg-1 mRNA poly(A) tails
    - reference_id: PMID:26096734
      supporting_text: Of more than 5000 genes represented in our early embryo PAT-seq data sets,
        we identified 436 with “GLD-2/GLD-3-activated, POS-1-repressed” poly(A) tail lengths
- term:
    id: GO:0000900
    label: mRNA regulatory element binding translation repressor activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN002648882
  - WB:WBGene00003864
  - WB:WBGene00003865
  review:
    summary: >-
      Phylogenetic inference seeded by OMA-1/OMA-2. POS-1 represses translation of glp-1 by
      binding a defined element in its 3' UTR, and represses zif-1 and neg-1.
    action: ACCEPT
    reason: >-
      Directly supported for POS-1. It binds the spatial control region of the glp-1 3' UTR
      and represses glp-1 translation in posterior blastomeres (PMID:12702662). The
      functional binding site overlaps a derepression element, and POS-1 binding excludes
      GLD-1 (PMID:23034181). POS-1 also binds and represses zif-1 (PMID:22265679). POS-1
      activates translation of other targets (see the NEW positive regulation of translation
      row), so this is one of two sign-specific activities. Core function.
    supported_by:
    - reference_id: PMID:12702662
      supporting_text: We show that a CCCH zinc-finger protein, POS-1, represses glp-1 mRNA translation
        by binding to the spatial control region.
    - reference_id: PMID:23034181
      supporting_text: We propose that POS-1 regulates glp-1 mRNA translation by blocking access of
        other RBPs to a key regulatory sequence.
    - reference_id: PMID:22265679
      supporting_text: POS-1, MEX-3, and SPN-4 function as repressors of ZIF-1 expression, whereas
        MEX-5 and MEX-6 antagonize this repression. All five proteins bind directly to the zif-1
        3' UTR in vitro.
- term:
