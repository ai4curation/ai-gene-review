id: G5EF15
gene_symbol: pos-1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: >-
  pos-1 encodes POS-1, a maternally supplied 264-residue RNA-binding protein with a CCCH
  tandem zinc finger (TIS11/TTP family) that regulates maternal mRNAs in the posterior and
  germline blastomeres of the early C. elegans embryo. POS-1 is cytoplasmic, associates with
  P granules and germline P-bodies, and is enriched in the germline blastomeres P1-P4. It
  binds a UA-rich POS-1 recognition element (PRE) in the 3' UTRs of maternal mRNAs, with a
  specificity broader than that of tristetraprolin. On some targets POS-1 represses: it
  blocks glp-1 translation in posterior cells by binding the spatial control region (where
  it excludes GLD-1), represses zif-1 so that germline proteins escape degradation in the P
  lineage, and opposes GLD-2/GLD-3 cytoplasmic polyadenylation of neg-1 mRNA so that NEG-1
  stays anterior and endomesoderm can form. On others it activates: it is needed for APX-1
  expression in P2 and for mom-2 translation, and it relieves SPN-4/MEX-3 repression of nos-2
  translation in P4, partly by competing with SPN-4 for the 3' UTR. pos-1 mutants are
  maternal-effect lethal: germline precursors adopt somatic fates (P4 makes muscle), the
  intestine is missing and ABp-derived pharynx is in excess. POS-1 with PIE-1 also protects
  cytokinesis of P2.
