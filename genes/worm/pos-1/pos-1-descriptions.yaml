descriptions:
- source: UniProt
  text: RNA-binding protein that coordinates cell fate specification and differentiation during
    early embryogenesis (PubMed:23034181, PubMed:9834181). Binds to a consensus pos-1 recognition
    element (PRE) consisting of the sequence 5'-UA(U 2-3)RGD(N 1-3)G-3', where R is any purine,
    D is A, G, or U, and N is any base (PubMed:18952820, PubMed:23034181). The PRE motif is
    found within the 3' untranslated region of many maternal transcripts required for early
    development (PubMed:18952820). Binds to the 3' untranslated region (UTR) of Notch receptor
    homolog glp-1, thereby repressing glp-1 translation in the posterior blastomeres in the
    embryo (PubMed:12702662, PubMed:23034181). Binding to glp-1 3' UTR excludes cell fate
    regulator gld-1 binding to an overlapping binding site in the glp-1 3' UTR (PubMed:23034181).
    Binds to the neg-1 3'UTR thereby opposing neg-1 expression and cytoplasmic polyadenylation
    of the neg-1 mRNA poly(A) tail promoted by gld-2 and gld-3 (PubMed:26096734). By inhibiting
    the cytoplasmic lengthening of neg-1 mRNA, restricts the accumulation of neg-1 protein
    and promotes endo-mesoderm development in anterior blastomeres (PubMed:26096734). Essential
    for germline specification (PubMed:9834181).
  source_type: curated
  url: https://www.uniprot.org/uniprot/G5EF15
