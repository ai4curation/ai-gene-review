findings:
- category: discrepancy
  text: UniProt says POS-1 promotes endo-mesoderm development in anterior blastomeres; the
    cited paper (PMID:26096734) shows POS-1 acts in posterior cells to keep NEG-1 anterior.
    Recorded as a CONFIRMED UniProt source defect.
  sources:
  - UniProt
- category: discrepancy
  text: The automated text gives POS-1 transcription corepressor activity and Pol II repression,
    from a GAL4 tethering experiment that the authors cautioned against interpreting. The
    curated texts describe a cytoplasmic translational regulator. The review marks both rows
    over-annotated with PROBABLE WormBase defects.
  sources:
  - Alliance_Automated
  - RefSeq
  - UniProt
  - Alliance_Imported
- category: discrepancy
  text: WormBase says POS-1 binds the mex-6 3' UTR in vitro; the source study used the yeast
    three-hybrid assay (PMID:17028349).
  sources:
  - Alliance_Imported
- category: gap
  text: Neither curated text covers POS-1 activation of nos-2 translation in P4 (PMID:16499902,
    PMID:18417623). WormBase also omits the neg-1 mechanism. The review adds a NEW positive
    regulation of translation row and records missing statements for both sources.
  sources:
  - UniProt
  - Alliance_Imported
- category: insight
  text: POS-1 represses some targets (glp-1, zif-1, neg-1) and activates others (nos-2, apx-1,
    mom-2), often by competing with other RBPs. The review carries both translation-regulation
    terms and places POS-1 in germline P-bodies (NEW, PMID:36196602).
  sources:
  - UniProt
  - Alliance_Imported
review:
  reviewer: AI
  rubrics:
  - rubric: overall_concordance
    score: 3
  overall_notes: UniProt and WormBase agree that POS-1 is a cytoplasmic CCCH RNA-binding translational
    regulator needed for germline and posterior fates, and are complementary (UniProt on specificity
    and neg-1, WormBase on apx-1 and expression). The automated text adds a transcriptional
    corepressor role that neither curated source supports.
