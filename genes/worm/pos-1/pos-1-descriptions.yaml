- source: Alliance_Automated
  text: Enables mRNA 3'-UTR binding activity; poly(U) RNA binding activity; and transcription
    corepressor activity. Involved in several processes, including cell fate specification;
    embryonic pattern specification; and negative regulation of transcription by RNA polymerase
    II. Located in P granule. Is expressed in several structures, including AB; EMS; P4; germ
    line; and oocyte. Orthologous to several human genes including ZFP36 (ZFP36 zinc finger
    CCCH-type).
