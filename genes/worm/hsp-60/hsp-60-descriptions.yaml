descriptions:
- source: UniProt
  text: Implicated in mitochondrial protein import and macromolecular assembly. May
    facilitate the correct folding of imported proteins. May also prevent misfolding
    and promote the refolding and proper assembly of unfolded polypeptides generated
    under stress conditions in the mitochondrial matrix (By similarity).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P50140
  source_id: P50140
