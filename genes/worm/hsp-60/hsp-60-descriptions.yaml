      score: 4
    - rubric: utility
      score: 3
    - rubric: compactness
      score: 4
    - rubric: completeness
      score: 3
    - rubric: specificity
      score: 3
    overall_notes: Correct GroEL family chaperonin with UPRmt induction and RNAi arrest.
      Omits HSP-10 and SEK-1 stabilization.
- source: Alliance_Automated
  text: Enables RNA polymerase II-specific DNA-binding transcription factor binding
    activity. Involved in several processes, including mitochondrial unfolded protein
    response; mitochondrion organization; and nematode larval development. Is active
    in mitochondrion. Is expressed in hypodermis; intestine; muscle cell; and neurons.
    Human ortholog(s) of this gene implicated in several diseases, including artery
    disease (multiple); autistic disorder; glucose intolerance; hereditary spastic
    paraplegia (multiple); and hypomyelinating leukodystrophy 4. Orthologous to human
    HSPD1 (heat shock protein family D (Hsp60) member 1).
  source_type: automated
