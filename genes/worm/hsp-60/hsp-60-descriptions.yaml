      score: 3
    - rubric: specificity
      score: 3
    overall_notes: 'Generic, mostly ''may'' and ''by similarity'': protein import
      and folding in the matrix. No worm UPRmt or immunity role.'
- source: Alliance_Imported
  text: hsp-60 encodes a nuclear-encoded mitochondrion-specific chaperone that is
    a member of the GroE/Hsp10/60 superfamily of molecular chaperones; hsp-60 is involved
    in the mitochondrial unfolded protein response, as hsp-60 expression, normally
    broadly detected during development, is greatly increased in response to treatments
    that disrupt mitochondrial protein handling; loss of hsp-60 activity via RNAi
    results in severe growth defects with arrest at embryonic and early larval stages
    of development.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00002025;class=Gene
  source_id: WB:WBGene00002025
  review:
