gene_symbol: hsp-60
organism: worm
uniprot_id: P50140
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Implicated in mitochondrial protein import and macromolecular assembly. May
    facilitate the correct folding of imported proteins. May also prevent misfolding
    and promote the refolding and proper assembly of unfolded polypeptides generated
    under stress conditions in the mitochondrial matrix (By similarity).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P50140
  source_id: P50140
- source: Alliance_Imported
  text: hsp-60 encodes a nuclear-encoded mitochondrion-specific chaperone that is
    a member of the GroE/Hsp10/60 superfamily of molecular chaperones; hsp-60 is involved
    in the mitochondrial unfolded protein response, as hsp-60 expression, normally
    broadly detected during development, is greatly increased in response to treatments
    that disrupt mitochondrial protein handling; loss of hsp-60 activity via RNAi
    results in severe growth defects with arrest at embryonic and early larval stages
    of development.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00002025;class=Gene
  source_id: WB:WBGene00002025
- source: Alliance_Automated
  text: Enables RNA polymerase II-specific DNA-binding transcription factor binding
    activity. Involved in several processes, including mitochondrial unfolded protein
    response; mitochondrion organization; and nematode larval development. Is active
    in mitochondrion. Is expressed in hypodermis; intestine; muscle cell; and neurons.
    Human ortholog(s) of this gene implicated in several diseases, including artery
    disease (multiple); autistic disorder; glucose intolerance; hereditary spastic
    paraplegia (multiple); and hypomyelinating leukodystrophy 4. Orthologous to human
    HSPD1 (heat shock protein family D (Hsp60) member 1).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00002025;class=Gene
  source_id: WB:WBGene00002025
