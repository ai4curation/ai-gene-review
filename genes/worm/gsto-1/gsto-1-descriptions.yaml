    - rubric: compactness
      score: 4
    - rubric: completeness
      score: 3
    - rubric: specificity
      score: 3
    overall_notes: Activities given 'by similarity', though recombinant GSTO-1 activity
      has been measured. Includes MMA reduction, which the review leaves undecided.
- source: Alliance_Imported
  text: gsto-1 encodes an experimentally verified thiol oxidoreductase and dehydroascorbate
    reductase, required for normal stress resistance; formally, GSTO-1 is an omega-class
    glutathione transferase (GST; EC 2.5.1.18), but it has little activity in vitro
    on classic GST substrates; GSTO-1 is expressed in postembryonic intestine; gsto-1(RNAi)
    induces hypersensitivity to heat-, arsenite-, juglone-, paraquat-, or cumene hydroperoxide-induced
    stresses, whereas overexpression of GSTO-1 enhances resistance to them; gsto-1
    transcription is upregulated by stress; ELT-2 may directly activate gsto-1 transcription
    in developing gut via a 300-nucleotide sequence upstream of gsto-1's ATG start
    site.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00016204;class=Gene
  source_id: WB:WBGene00016204
  review:
    reviewer: AI
    rubrics:
    - rubric: correctness
      score: 5
    - rubric: utility
      score: 4
    - rubric: compactness
      score: 3
    - rubric: completeness
      score: 5
    - rubric: specificity
      score: 4
    overall_notes: 'Correct and specific: verified thiol oxidoreductase and DHAR activity,
      little classic GST activity, intestinal expression under ELT-2, stress sensitivity
      and resistance.'
- source: Alliance_Automated
  text: Enables glutathione dehydrogenase (ascorbate) activity; glutathione transferase
    activity; and methylarsonate reductase activity. Involved in detoxification of
    inorganic compound and response to superoxide. Predicted to be active in cytoplasm.
    Is expressed in intestine. Human ortholog(s) of this gene implicated in Alzheimer's
    disease; Parkinson's disease; and asthma. Orthologous to human GSTO1 (glutathione
    S-transferase omega 1) and GSTO2 (glutathione S-transferase omega 2).
  source_type: automated
