descriptions:
- source: UniProt
  text: Exhibits glutathione-dependent thiol transferase activity (By similarity).
    Has dehydroascorbate reductase activity and may contribute to the recycling of
    ascorbic acid (By similarity). Participates in the biotransformation of inorganic
    arsenic and reduces monomethylarsonic acid (MMA) (By similarity). Protects against
    environmental stress and oxidative stress (PubMed:17901115).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P34345
  source_id: P34345
