suggested_questions:
- question: Was monomethylarsonate (MMA(V)) reductase activity actually assayed on recombinant C. elegans
    GSTO-1 in Burmeister et al. 2008, or is the EC 1.20.4.2 catalytic-activity statement on P34345 a
    by-similarity transfer from human GSTO1?
- question: Does the measurable activity toward cumene hydroperoxide reflect a genuine glutathione
    peroxidase activity of GSTO-1 that would justify a peroxidase MF annotation?
- question: Why did gsto-1 RNAi cause arsenite sensitivity in PMID:17901115 but not in the 2013 RNAi
    screen (PMID:23593298); do differences in RNAi timing or arsenite dose explain it?
suggested_experiments:
- description: Assay purified recombinant GSTO-1 and a C33A mutant for glutathione-dependent reduction
    of MMA(V) to MMA(III), with human GSTO1 as a positive control.
  hypothesis: GSTO-1 reduces MMA(V) via its active-site Cys33, as human GSTO1 does.
- description: Test arsenite and juglone survival of a gsto-1 deletion allele alongside RNAi animals,
    and measure intestinal ascorbate/dehydroascorbate and GSH/GSSG ratios in the mutant.
  hypothesis: Loss of GSTO-1 lowers intestinal ascorbate recycling and shifts glutathione redox state,
    explaining pro-oxidant sensitivity.
