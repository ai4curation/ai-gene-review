id: P34345
gene_symbol: gsto-1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: gsto-1 (C29E4.7) encodes the Omega-class glutathione transferase GSTO-1 of Caenorhabditis
  elegans, a 250-residue cytoplasmic enzyme with a thioredoxin-like GST N-terminal domain carrying the
  predicted active-site nucleophile Cys33 and an all-alpha GST C-terminal domain. Like other Omega GSTs,
  recombinant GSTO-1 has little activity toward classic GST conjugation substrates such as CDNB but shows
  strong glutathione-dependent dehydroascorbate reductase and thiol-disulfide oxidoreductase
  (thioltransferase) activities, and weak activity toward cumene hydroperoxide. The protein is expressed
  only in the intestine at all postembryonic stages, under control of the gut GATA factor ELT-2, and its
  expression is induced by oxidative stress and by hypoxia through TORC1/ELT-2 signalling. Overexpression
  increases resistance to juglone, paraquat and cumene hydroperoxide, and RNAi knockdown sensitises worms
  to pro-oxidants and heat; GSTO-1 is also required for the lifespan extension that follows transient
  hypoxia. By analogy with human GSTO1 it may reduce monomethylarsonate, but its role in arsenic
  metabolism in the worm is not firmly established.
