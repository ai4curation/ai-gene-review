  review:
    summary: WormBase IMP from an RNAi screen of glutathione-metabolism genes in which gsto-1 knockdown
      moderately reduced survival on the superoxide-generating quinone juglone.
    action: KEEP_AS_NON_CORE
    reason: The full text was read. gsto-1(RNAi) worms had reduced juglone survival, and the paper states
      that juglone generates superoxide. The phenotype supports a role in tolerating superoxide-generating
      stress, consistent with GSTO-1 being an antioxidant enzyme, but it is a whole-animal necessity
      phenotype, and juglone is also an electrophilic quinone, so the response is not specific to superoxide.
      Kept as a non-core, phenotype-level process; the core activity is dehydroascorbate reduction.
    supported_by:
