    overall_notes: Correct dynein regulator with NUD-2/UNC-83 nuclear envelope recruitment,
      nuclear migration, GABAergic vesicle localization. Embryonic pronuclear and
      spindle roles are understated.
- source: Alliance_Imported
  text: lis-1 encodes a microtubule-association protein (MAP) that is orthologous
    to human LIS1, and Aspergillus nidulans nudF, which mediates nuclear migration
    along Aspergillus hyphae; in C. elegans lis-1 functions as a dynein regulator
    whose activity is required for a number of processes, including centrosome separation,
    spindle assembly, regulation of neurotransmission, and actin cytoskeleton integrity;
    LIS-1 localizes to the cytoplasm, nucleus, and microtubules.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00003047;class=Gene
