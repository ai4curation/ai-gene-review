- source: Alliance_Automated
  text: Predicted to enable dynein complex binding activity. Involved in several processes,
    including chiasma assembly; microtubule cytoskeleton organization; and nuclear
    migration. Located in several cellular components, including kinetochore; microtubule
    cytoskeleton; and perinuclear region of cytoplasm. Part of cytoplasmic dynein
    complex. Is expressed in several structures, including alimentary muscle; excretory
    cell; hypodermis; nervous system; and reproductive system. Used to study lissencephaly.
    Human ortholog(s) of this gene implicated in lissencephaly; lissencephaly 1; and
    nervous system disease. Orthologous to human PAFAH1B1 (platelet activating factor
    acetylhydrolase 1b regulatory subunit 1).
