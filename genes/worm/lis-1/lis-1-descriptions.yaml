gene_symbol: lis-1
organism: worm
uniprot_id: Q9NDC9
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Positively regulates the activity of the minus-end directed microtubule motor
    protein dynein. May enhance dynein-mediated microtubule sliding by targeting dynein
    to the microtubule plus end. Required for several dynein- and microtubule-dependent
    processes such as nuclear migration during cell division (PubMed:11685578, PubMed:15331665).
    Part of a complex with nud-2, which is recruited to the nuclear envelope by unc-83,
    where, in turn, it recruits dynein to the nuclear surface and regulates nuclear
    migration in hypodermal precursor cells (PubMed:20005871). Plays a role in GABAergic
    synaptic vesicle localization in the ventral nerve cord (PubMed:16996038). Required
    for neuronal cell differentiation (PubMed:15254012).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q9NDC9
  source_id: Q9NDC9
- source: Alliance_Imported
  text: lis-1 encodes a microtubule-association protein (MAP) that is orthologous
    to human LIS1, and Aspergillus nidulans nudF, which mediates nuclear migration
    along Aspergillus hyphae; in C. elegans lis-1 functions as a dynein regulator
    whose activity is required for a number of processes, including centrosome separation,
    spindle assembly, regulation of neurotransmission, and actin cytoskeleton integrity;
    LIS-1 localizes to the cytoplasm, nucleus, and microtubules.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00003047;class=Gene
  source_id: WB:WBGene00003047
- source: Alliance_Automated
  text: Predicted to enable dynein complex binding activity. Involved in several processes,
    including chiasma assembly; microtubule cytoskeleton organization; and nuclear
    migration. Located in several cellular components, including kinetochore; microtubule
    cytoskeleton; and perinuclear region of cytoplasm. Part of cytoplasmic dynein
    complex. Is expressed in several structures, including alimentary muscle; excretory
    cell; hypodermis; nervous system; and reproductive system. Used to study lissencephaly.
    Human ortholog(s) of this gene implicated in lissencephaly; lissencephaly 1; and
    nervous system disease. Orthologous to human PAFAH1B1 (platelet activating factor
    acetylhydrolase 1b regulatory subunit 1).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00003047;class=Gene
  source_id: WB:WBGene00003047
