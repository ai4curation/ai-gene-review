id: Q9NDC9
gene_symbol: lis-1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: lis-1 (pnm-1, T03F6.5) encodes the C. elegans ortholog of LIS1/NudF, a WD40 beta-propeller protein
  with an N-terminal LisH dimerization motif that regulates cytoplasmic dynein. LIS-1 is distributed throughout
  the cytoplasm and enriched at the cell cortex, near microtubule asters, at kinetochores and at the nuclear periphery;
  its perinuclear targeting depends on dynein and dynactin. With the NudE homolog NUD-2 it forms a dynein-regulatory
  complex that the KASH protein UNC-83 recruits to the outer nuclear envelope. In the one-cell embryo lis-1 loss
  phenocopies dynein heavy chain (dhc-1) loss, abolishing pronuclear migration, centrosome separation and movement
  from the posterior cortex, spindle assembly and positioning; lis-1 also contributes to hyp7 nuclear migration,
  bipolar spindle formation in germline mitoses, and GABAergic synaptic vesicle trafficking in ventral cord neurons.
  Loss of lis-1 causes maternal-effect embryonic lethality, germline mitotic arrest and apoptosis, sterility, uncoordinated
  movement and increased convulsion susceptibility.
