      locations, including the cell cortex, the vicinity of microtubule asters, the nuclear periphery and kinetochores.
  - reference_id: PMID:20005871
    supporting_text: One consists of the NudE homolog NUD-2 and the NudF/Lis1/Pac1 homolog LIS-1
  - reference_id: PMID:20005871
    supporting_text: lis-1(RNAi) displayed nuclear migration defects as was evident by the presence of nuclei in
      the dorsal cord
  - reference_id: PMID:20599902
    supporting_text: The dynein heavy chain motor DHC-1 and its regulator LIS-1 are both necessary in wild-type
