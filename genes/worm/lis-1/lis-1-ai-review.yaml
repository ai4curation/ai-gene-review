suggested_questions:
- question: Does LIS-1 act in hyp7 nuclear migration primarily as a dynein regulator counterbalancing kinesin-1
    (bidirectional control), and should UNC-83-recruited NUD-2/LIS-1 be modelled as a distinct nuclear-envelope
    activity in GO-CAM?
  experts:
  - C. elegans nuclear migration researchers (e.g. Starr lab)
- question: Is the maintenance of centrosome location IBA (GO:0051661) the right ancestral term, or is establishment
    of centrosome localization (GO:0051660) a better description of LIS1-family function given worm and fly phenotypes?
  experts:
  - PAINT curators
suggested_experiments:
- description: Use auxin-inducible degradation of LIS-1 specifically in hyp7 precursors or GABAergic neurons to
    separate cell-autonomous nuclear-migration and synaptic-vesicle-transport roles from the maternal embryonic
    requirement.
