id: O45352
gene_symbol: gst-44
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: >-
  gst-44 (F13A7.10) encodes an omega-class glutathione S-transferase (GSTO), one of five GSTO
  genes in C. elegans and closest to GSTO-1 and GSTO-2. It has a thioredoxin-like GST N-terminal
  domain carrying the conserved active-site cysteine (Cys35) and an all-alpha GST C-terminal
  domain. Like other omega-class enzymes it works as a glutathione-dependent reductase rather than
  a conjugating GST. Recombinant GST-44 reduces dehydroascorbate (DHAR activity) and
  monomethylarsonate (MMA-V) using glutathione, has thioltransferase (glutaredoxin-like) and
  cumene hydroperoxide peroxidase activity, and shows no conjugating activity toward CDNB or
  ethacrynic acid. GST-44 is a cytoplasmic protein, also seen weakly in nuclei, of the intestine
  and the excretory canal cell. Arsenite induces it strongly in the excretory system through
  SKN-1/Nrf2 and PHA-4/FoxA; pathogens, oxidants and dimethyl fumarate also induce it. Deletion
  or RNAi knockdown makes worms sensitive to arsenite and arsenate, and this sensitivity is
  specific among the GSTO paralogs. Deletion mutants also have a shorter lifespan and are modestly
  sensitive to juglone and to reductive ER stress, which points to a main role in arsenic
  detoxification and redox defence.
