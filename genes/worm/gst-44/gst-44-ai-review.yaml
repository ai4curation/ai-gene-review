core_functions:
- description: >-
    Glutathione-dependent dehydroascorbate reductase of the omega GST class. GST-44 uses its
    active-site cysteine and GSH to reduce dehydroascorbate to ascorbate, which recycles ascorbate in
    the cytoplasm of intestinal and excretory cells. It also has thioltransferase
    (glutaredoxin-like) and organic hydroperoxide peroxidase activity.
  molecular_function:
    id: GO:0045174
    label: glutathione dehydrogenase (ascorbate) activity
  locations:
  - id: GO:0005737
    label: cytoplasm
  supported_by:
  - reference_id: PMID:40186509
    supporting_text: Furthermore, the enzyme was capable of using GSH as an electron donor to reduce
      dehydroascorbate (DHA) (6.35 ± 0.15 μmol·min−1·mg−1)
- description: >-
    GSH-dependent reduction of methylated arsenicals (MMA-V). This activity supports a
    gene-specific role in arsenic detoxification: the gene is induced by arsenic in the excretory
    system and required for arsenite and arsenate tolerance.
  molecular_function:
