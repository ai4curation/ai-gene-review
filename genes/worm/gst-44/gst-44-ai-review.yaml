- term:
    id: GO:0004364
    label: glutathione transferase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - FB:FBgn0035904
  - FB:FBgn0035906
  - FB:FBgn0035907
  - FB:FBgn0086348
  - PANTHER:PTN000883725
  - UniProtKB:P78417
  - UniProtKB:Q9H4Y5
  - WB:WBGene00016204
  review:
    summary: >-
      IBA from the omega-class GST node PTN000883725. The node is seeded by Drosophila GSTOs, human
      GSTO1 and GSTO2, and C. elegans GSTO-1.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      GO:0004364 means GSH conjugation to an electrophile (RX + GSH, EC 2.5.1.18). GST-44 is a
      genuine omega-class enzyme: it keeps the active-site Cys35 and the G-site. Omega-class enzymes,
      however, use that cysteine for glutathione-dependent redox chemistry (DHAR, thioltransferase,
      arsonate reduction), and their conjugating activity is weak or absent. Purified GST-44 showed
      no conjugation of the two standard GST substrates, CDNB and ethacrynic acid. Its measured
      activities are captured by GO:0045174 and GO:0050610. The conjugation term is therefore an
      over-annotation for this gene. It is not refuted outright, because only two substrates were
      tested and the negative data are "not shown".
    supported_by:
    - reference_id: PMID:40186509
      supporting_text: For the typical GST substrates 1‐chloro‐2,4‐dinitrobenzene (CDNB) and ethacrynic
        acid, no GSH‐conjugating activity could be shown (data not shown).
    - reference_id: PMID:40186509
      supporting_text: Due to a cysteine at the active center, GSTOs do not demonstrate activity with
        typical GST substrates such as CDNB or ethacrynic acid but rather exhibit activity with substrates
        typically associated with glutaredoxins or thioredoxins
    - reference_id: file:worm/gst-44/gst-44-deep-research-manual.md
      supporting_text: 'My reading of the sequence: the catalytic-cysteine motif S-M-R-F-C-P is present with Cys35'
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      - GRANULARITY_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN000883725
        source_label: GST omega-class node (PTHR43968)
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          GST-44 is correctly placed inside the omega clade; that much is right. The trouble is the
          term placed on the node. "Glutathione transferase activity" rests on the weak CDNB
          conjugation of some seeds, such as human GSTO1, and it does not hold for GST-44, which showed
          no conjugation. The clade's shared activity is the glutathione-dependent reductase
          chemistry (GO:0045174), which this review accepts.
      - source_id: WB:WBGene00016204
        source_label: C. elegans gsto-1 (C29E4.7)
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Worm paralog seed; its own activity data do not transfer conjugation activity to GST-44.
      residue_claims_not_applicable: >-
        The active-site cysteine (Cys35) is retained, so residue loss is not the issue. The issue is
        which reaction class the clade performs.
