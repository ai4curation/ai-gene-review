- term:
    id: GO:0071722
    label: detoxification of arsenic-containing substance
  evidence_type: IMP
  original_reference_id: PMID:40186509
  qualifier: involved_in
  review:
    summary: >-
      gst-44(tm6133) deletion mutants survive both arsenite and arsenate poorly, and the gsto-1,
      gsto-2 and gsto-3 deletions do not. GST-44 catalyses GSH-dependent reduction of an arsenical
      (MMA-V), and arsenite induces it in the excretory system through SKN-1 and PHA-4.
    action: NEW
    reason: >-
      Process term chosen after applying the participation test. GST-44 performs a catalytic step in
      arsenical biotransformation itself: it reduces MMA(V), which matches the accepted GO:0050610.
      The mutant phenotype is specific to gst-44 among the four GSTO paralogs tested. Human GSTO1 and
      GSTO2, the comparators in the same role, are the reference arsenic-reducing omega GSTs. The
      evidence is therefore catalysis plus specific loss of function, not necessity evidence alone.
      Whether the methylarsenical reduction detoxifies arsenic in worms (in mammals MMA(III) is more
      toxic) is noted as a question.
    supported_by:
    - reference_id: PMID:40186509
      supporting_text: While the GST‐44 showed a significantly reduced survival rate under arsenic, this
        was not observed in the deletion mutants gsto‐1(eva301) III, gsto‐2(eva302) III, and gsto‐3(eva303)
        III (Fig. 9B).
    - reference_id: PMID:40186509
      supporting_text: Our findings highlight the essential role of GST‐44 in mediating arsenic detoxification
