  review:
    summary: Inter-ontology inference from GO:0045174 DHAR activity.
    action: KEEP_AS_NON_CORE
    reason: >-
      DHAR by itself regenerates ascorbate rather than detoxifying an oxidant, so the inference chain
      is indirect. The conclusion does hold for GST-44 on other evidence. The enzyme reduces cumene
      hydroperoxide (peroxidase activity) and protects E. coli against it, and the deletion mutant is
