suggested_questions:
- question: >-
    Does GST-44 reduce inorganic arsenate (AsV) to arsenite directly, as the paper's "arsenate
    reductase" wording implies, or only methylated arsenicals (MMA-V)? And does C. elegans methylate
    arsenic, so that MMA(V) is a physiological substrate?
- question: >-
    Why is gst-44, and not gsto-1, gsto-2 or gsto-3, required for arsenic tolerance? Is it the
    expression in the excretory canal cell, or a substrate preference?
- question: >-
    Should the PAINT omega-class node PTN000883725 carry GO:0004364 glutathione transferase
    activity, given that several omega members (including GST-44) show no conjugation with CDNB or
    ethacrynic acid?
suggested_experiments:
- description: >-
    Test purified GST-44 with inorganic arsenate, MMA(V) and DMA(V) and identify the products by
    HPLC-ICP-MS. Compare with a Cys35Ser (active-site) mutant.
  hypothesis: GST-44 reduces pentavalent arsenicals through its active-site cysteine, and Cys35Ser abolishes the activity.
- description: >-
    Rescue gst-44(tm6133) arsenic sensitivity with excretory-cell-specific versus intestine-specific
    expression of wild-type or Cys35Ser GST-44.
  hypothesis: Catalytically active GST-44 in the excretory system is sufficient to restore arsenic tolerance.
