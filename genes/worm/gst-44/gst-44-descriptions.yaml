descriptions:
- source: UniProt
  text: Exhibits glutathione-dependent thiol transferase activity. Has high dehydroascorbate
    reductase activity and may contribute to the recycling of ascorbic acid. Participates
    in the biotransformation of inorganic arsenic and reduces monomethylarsonic acid
    (MMA).
  source_type: curated
  url: https://www.uniprot.org/uniprot/O45352
  source_id: O45352
