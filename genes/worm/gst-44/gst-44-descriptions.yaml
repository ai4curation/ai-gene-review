gene_symbol: gst-44
organism: worm
uniprot_id: O45352
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Exhibits glutathione-dependent thiol transferase activity. Has high dehydroascorbate
    reductase activity and may contribute to the recycling of ascorbic acid. Participates
    in the biotransformation of inorganic arsenic and reduces monomethylarsonic acid
    (MMA).
  source_type: curated
  url: https://www.uniprot.org/uniprot/O45352
  source_id: O45352
- source: Alliance_Imported
  text: gst-44 encodes a putative omega-class glutathione transferase (GST; EC 2.5.1.18)
    which, like its paralog GSTO-1, might have thiol oxidoreductase and dehydroascorbate
    reductase activity; GST-44 is expressed in excretory cell cytoplasm; other GST-44
    paralogs include C02D5.3 and K10F12.4; GST-44 has no obvious function in mass
    RNAi assays.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00001792;class=Gene
  source_id: WB:WBGene00001792
- source: Alliance_Automated
  text: Predicted to enable glutathione dehydrogenase (ascorbate) activity and glutathione
    transferase activity. Involved in response to reactive oxygen species. Predicted
    to be active in cytoplasm. Is expressed in excretory cell. Human ortholog(s) of
    this gene implicated in Alzheimer's disease; Parkinson's disease; and asthma.
    Orthologous to several human genes including GSTO2 (glutathione S-transferase
    omega 2).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00001792;class=Gene
  source_id: WB:WBGene00001792
