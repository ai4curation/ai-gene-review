- source: Alliance_Automated
  text: Enables acetylcholine-gated monoatomic cation-selective channel activity.
    Involved in several processes, including neuromuscular synaptic transmission;
    positive regulation of acetylcholine secretion, neurotransmission; and positive
    regulation of locomotion involved in locomotory behavior. Located in neuron projection;
    neuronal cell body; and postsynaptic membrane. Is expressed in body wall musculature;
    neurons; non-striated muscle; and somatic nervous system.
