descriptions:
- source: UniProt
  text: Non-alpha subunit of nicotinic acetylcholine receptor (nAChR). Involved in
    nAChR sensitivity to nicotine and levasimole.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P48181
  source_id: P48181
- source: Alliance_Imported
  text: unc-29 encodes an non-alpha subunit of the nicotinic acetylcholine receptor
    (nAChR) superfamily; UNC-29 is required for normal locomotion and egg-laying,
    and functions as a subunit of a ligand-gated ion channel that likely mediates
    fast actions of acetylcholine at neuromuscular junctions and in the nervous system;
    when coexpressed with LEV-1, a non-alpha nAChR subunit, and UNC-38 or UNC-63,
    alpha AChR subunits, the resulting multimer can form levamisole-gated channels;
    UNC-29 is expressed in body wall muscle.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00006765;class=Gene
  source_id: WB:WBGene00006765
- source: Alliance_Automated
  text: Enables acetylcholine-gated monoatomic cation-selective channel activity.
    Involved in several processes, including neuromuscular synaptic transmission;
    positive regulation of acetylcholine secretion, neurotransmission; and positive
    regulation of locomotion involved in locomotory behavior. Located in neuron projection;
    neuronal cell body; and postsynaptic membrane. Is expressed in body wall musculature;
    neurons; non-striated muscle; and somatic nervous system.
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00006765;class=Gene
  source_id: WB:WBGene00006765
