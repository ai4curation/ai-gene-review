- source: Alliance_Imported
  text: unc-29 encodes an non-alpha subunit of the nicotinic acetylcholine receptor
    (nAChR) superfamily; UNC-29 is required for normal locomotion and egg-laying,
    and functions as a subunit of a ligand-gated ion channel that likely mediates
    fast actions of acetylcholine at neuromuscular junctions and in the nervous system;
    when coexpressed with LEV-1, a non-alpha nAChR subunit, and UNC-38 or UNC-63,
    alpha AChR subunits, the resulting multimer can form levamisole-gated channels;
    UNC-29 is expressed in body wall muscle.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00006765;class=Gene
