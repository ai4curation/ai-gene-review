id: P48181
gene_symbol: unc-29
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: UNC-29 is a non-alpha (beta-type) subunit of the Cys-loop nicotinic acetylcholine receptor
  family in Caenorhabditis elegans. With the non-alpha subunit LEV-1 and the alpha subunits UNC-38, UNC-63
  and LEV-8 it forms the heteropentameric levamisole-sensitive acetylcholine receptor (L-AChR). This acetylcholine-gated
  cation channel produces excitatory postsynaptic currents at cholinergic neuromuscular junctions of body-wall
  muscle; the nematocide levamisole is an agonist and nicotine an allosteric inhibitor. Functional expression
  needs all five subunits plus the ancillary proteins RIC-3, UNC-50 and UNC-74. CRLD-1 promotes the maturation
  of the receptor in the ER, and synaptic clustering relies on the extracellular LEV-10/LEV-9/OIG-4 scaffold.
  unc-29 mutants are uncoordinated and resistant to levamisole; their residual movement relies on the
  ACR-16 nicotinic receptor. UNC-29 is also expressed in some neurons, including the backward command
  interneuron AVA, where UNC-29-containing receptors help relay cholinergic input that triggers reversal
  during male mating. It also contributes to levamisole-stimulated egg laying.
