core_functions:
- description: Non-alpha subunit of the heteropentameric levamisole-sensitive acetylcholine receptor.
    It contributes to acetylcholine-gated cation channel activity in the postsynaptic membrane of body-wall
    muscle and so mediates excitatory cholinergic neuromuscular transmission.
  contributes_to_molecular_function:
    id: GO:0022848
    label: acetylcholine-gated monoatomic cation-selective channel activity
  directly_involved_in:
  - id: GO:0007274
    label: neuromuscular synaptic transmission
  - id: GO:0060079
    label: excitatory postsynaptic potential
  locations:
  - id: GO:0045211
    label: postsynaptic membrane
  in_complex:
    id: GO:0005892
    label: acetylcholine-gated channel complex
  supported_by:
  - reference_id: PMID:19020092
    supporting_text: We demonstrate that 3 alpha- and 2 non-alpha-subunits assemble into the same receptor.
  - reference_id: PMID:19020092
    supporting_text: functional receptors were virtually eliminated when 1 or more of the 5 receptor subunits
      were omitted
  - reference_id: PMID:10461217
    supporting_text: This response was eliminated in mutants lacking either the unc-38 or unc-29 genes,
      which encode alpha and non-alpha acetylcholine receptor subunits, respectively.
  - reference_id: PMID:10461217
    supporting_text: we demonstrated that all three receptor types function at neuromuscular synapses
  - reference_id: PMID:15990870
    supporting_text: These were most likely postsynaptic receptor clusters, since they were juxtaposed
      to, but did not overlap with, presynaptic synaptobrevin
suggested_questions:
- question: Which L-AChR subunit interfaces does UNC-29 contribute to? Does it provide the complementary
    (minus) face of an acetylcholine/levamisole binding site with UNC-38, UNC-63 or LEV-8, and what is
    the subunit stoichiometry and arrangement?
- question: Is the UniProt IMP annotation of unc-29 to regulation of muscle contraction (GO:0006937) correctly
    attributed to PMID:19028454, a paper whose text does not mention unc-29?
- question: Do UNC-29-containing receptors in neurons such as AVA have the same subunit composition as
    the muscle L-AChR, or do they assemble with different alpha subunits such as ACR-18?
suggested_experiments:
- description: Single-subunit cysteine substitution or cryo-EM of the reconstituted L-AChR (UNC-29, LEV-1,
    UNC-38, UNC-63, LEV-8 plus RIC-3, UNC-50 and UNC-74) to map the UNC-29 interfaces and the subunit
    arrangement.
  hypothesis: UNC-29 provides the complementary face of at least one agonist-binding site and occupies
    a defined position in the pentamer.
- description: Cell-specific knockout of unc-29 in AVA versus body-wall muscle, combined with calcium
    imaging of AVA during mate contact.
  hypothesis: AVA-expressed UNC-29 receptors carry part of the cholinergic PVY/PVX input that drives reversal,
    independently of muscle L-AChRs.
