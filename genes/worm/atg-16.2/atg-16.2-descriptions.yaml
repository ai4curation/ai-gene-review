descriptions:
- source: UniProt
  text: Most likely a component of the atg-5-atg-12-atg-16.1/atg-16.2 complex, which
    is recruited to the preautophagosomal membrane and associates with lgg-2 to promote
    autophagosome formation (PubMed:24185444, PubMed:26687600). Plays a role in the
    recruitment of lipidated lgg-1 probably to the autophagosome membrane to promote
    autophagosome formation (PubMed:24185444). Furthermore, association with atg-5
    is required for the nucleation of lgg-1 positive autophagosomes (PubMed:24185444).
    Although its role in autophagosome formation may be distinct to the role of atg-16.2,
    it functions in a partially redundant manner with atg-16.1 to regulate autophagic
    processes (PubMed:24185444, PubMed:28285998). In a daf-18/PTEN- and daf-16/FOXO-dependent
    manner, required for maintaining the numbers of germ stem cell progenitors in
    the gonad during the late phases of larval development (PubMed:28285998).
  source_type: curated
