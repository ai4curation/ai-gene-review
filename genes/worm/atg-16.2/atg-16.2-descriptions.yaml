- source: Alliance_Automated
  text: Predicted to enable protein-membrane adaptor activity. Involved in several
    processes, including defense response to Gram-positive bacterium; germ cell proliferation;
    and macroautophagy. Located in cytoplasm and plasma membrane. Is expressed in
    body wall musculature; embryonic cell; intestine; neurons; and pharyngeal muscle
    cell. Human ortholog(s) of this gene implicated in inflammatory bowel disease
    10. Orthologous to human ATG16L1 (autophagy related 16 like 1) and ATG16L2 (autophagy
    related 16 like 2).
