      with ATG-5.
suggested_questions:
- question: >-
    How does ATG-16.2 find its membrane sites in C. elegans: does it bind an EPG-6 or ATG-18
    WIPI-like protein, as ATG16L1 binds WIPI2, or membranes directly?
- question: >-
    Why does LGG-1 lipidation increase rather than decrease in atg-16.2; atg-16.1 double mutants,
    unlike in yeast and mouse Atg16 mutants?
- question: >-
    What do the WD40 repeats of ATG-16.2 do, given that they are dispensable for aggrephagy,
    and is its binding to LGG-2 through them functionally important?
suggested_experiments:
- description: >-
    Map the membrane-recruitment determinant of ATG-16.2 with truncations and point mutants
    in the coiled-coil and linker regions, and test their binding to EPG-6/ATG-18 and liposomes
    alongside rescue of LGG-1 puncta in atg-16.2; atg-16.1 double mutants.
  experiment_type: genetics and biochemistry
