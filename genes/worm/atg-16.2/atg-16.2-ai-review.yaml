- term:
    id: GO:0043495
    label: protein-membrane adaptor activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN000459085
  - UniProtKB:Q676U5
  review:
    summary: >-
      Phylogenetic inference of protein-membrane adaptor activity, from human ATG16L1, which
      links the ATG12-ATG5 conjugate to membranes.
    action: ACCEPT
    reason: >-
      Consistent with C. elegans data: ATG-16 is dispensable for LGG-1 lipidation per se but
      is required to localize it into puncta, and membrane-tethered ATG-16.2 is sufficient
      to nucleate ectopic LGG-1 puncta, i.e. ATG-16.2 links the conjugation machinery to a
      membrane site.
    supported_by:
    - reference_id: PMID:24185444
      supporting_text: >-
        In atg-16.2; atg-16.1 double mutants, LGG-1-II accumulates but LGG-1 puncta are completely
        absent, whereas forced expression of plasma membrane-localized ATG-16.2 is sufficient
        to nucleate ectopic LGG-1 puncta.
