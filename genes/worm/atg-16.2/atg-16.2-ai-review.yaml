core_functions:
- description: >-
    Subunit of the LGG-3-ATG-5-ATG-16 complex that couples the conjugation machinery to the
    membrane sites where lipidated LGG-1 assembles into puncta on forming autophagosomes;
    binds ATG-5 via its N-terminus and self/hetero-oligomerizes with ATG-16.1 via its coiled-coil.
  molecular_function:
