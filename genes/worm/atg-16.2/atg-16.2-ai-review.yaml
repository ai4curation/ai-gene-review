gene_symbol: atg-16.2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: >-
  ATG-16.2 is one of two C. elegans orthologs of yeast Atg16 and mammalian ATG16L1. It has
  an N-terminal ATG-5-binding region, a central coiled-coil that mediates self-association
  and association with ATG-16.1, and seven C-terminal WD40 repeats. Through ATG-5 it forms
  part of the LGG-3/ATG12-ATG-5-ATG-16 complex, and it specifies the membrane sites at which
  lipidated LGG-1 assembles into puncta: in atg-16.2; atg-16.1 double mutants lipidated LGG-1
  accumulates but LGG-1 puncta are absent, and ATG-16.2 targeted to the plasma membrane nucleates
  ectopic LGG-1 puncta. ATG-16.2 makes the larger contribution of the two paralogs to aggrephagy
  in the embryo, its WD40 repeats are dispensable for this role, and it also binds LGG-2.
  It is broadly expressed in neurons, muscles and intestine, and it is required for the late-larval
  expansion of germline stem cell progenitors.
