gene_symbol: ttr-52
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: TTR-52 is a secreted transthyretin-like protein of C. elegans that bridges apoptotic cells to engulfing
  cells. It is made in and secreted from the endoderm and clusters around apoptotic cells. There it binds surface-exposed
  phosphatidylserine (PS) on the dying cell and the N-terminal EMI domain of the engulfment receptor CED-1 on the
  engulfing cell. Its crystal structure shows an open beta-barrel resembling a C2 domain, and it forms dimers that
  are needed for function in vivo. TTR-52 acts in the CED-1/CED-6/CED-7 pathway and is needed for CED-1 to cluster
  around corpses. With CED-7 and the lipid-binding protein NRF-5, it also takes part in the release of PS-containing
  extracellular vesicles from apoptotic cells and in PS appearance on engulfing cells.
