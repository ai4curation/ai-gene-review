  review:
    summary: Aminophospholipid transport; loss of TTR-52 blocks loss of exposed PS from corpses and its appearance
      on engulfing cells (Mapes et al. 2012).
    action: KEEP_AS_NON_CORE
    reason: 'The genetic result is solid: in ttr-52 mutants PS persists on unengulfed corpses, engulfing cells fail
      to acquire it, and extracellular PS vesicles are reduced. The authors frame TTR-52 as a possible extracellular
      PS acceptor or carrier with "may", so the mechanism is not established. Kept as a non-core role alongside
      the bridging function.'
