suggested_questions:
- question: Does TTR-52 carry PS between membranes (as an acceptor or carrier, possibly with NRF-5), or does it
    only bind PS-bearing vesicles?
- question: Does TTR-52, like CED-1, CED-6 and CED-7, contribute to engulfing cells promoting the death of weakly
    signalled cells?
suggested_experiments:
- hypothesis: TTR-52 promotes the death of cells receiving weak death signals, as other CED-1 pathway genes do.
  description: In a weak ced-3 or ced-4 partial loss-of-function background, compare survival of specific cells
    such as the extra pharyngeal cells in ttr-52 mutants versus ced-1 mutants, scored with cell-type reporters.
  experiment_type: genetic
