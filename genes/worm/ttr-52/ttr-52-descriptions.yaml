descriptions:
- source: UniProt
  text: Plays a role as a bridging molecule that mediates recognition and engulfment
    of apoptotic cells by cross-linking the surface-exposed phosphatidylserine with
    the extracellular domain of the phagocyte receptor ced-1. Important for the generation
    of extracellular phosphatidylserine vesicles that promote loss of the exoplasmic
    leaflet from apoptotic cells in a time-dependent manner. Required for the exposure
    of exoplasmic leaflet on the phagocytic cells surrounding the apoptotic cells.
    Does not affect the phosphatidylserine externalization in living cells. May play
    a role in mediating transfer of phosphatidylserine from phosphatidylserine vesicles
    to ced-1 bearing phagocytes or alternatively result in the activation of a phosphatidylserine
    transporter in the phagocyte that promotes phosphatidylserine externalization.
  source_type: curated
  url: https://www.uniprot.org/uniprot/G5ED35
  source_id: G5ED35
