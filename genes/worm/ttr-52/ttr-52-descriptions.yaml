gene_symbol: ttr-52
organism: worm
uniprot_id: G5ED35
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Plays a role as a bridging molecule that mediates recognition and engulfment
    of apoptotic cells by cross-linking the surface-exposed phosphatidylserine with
    the extracellular domain of the phagocyte receptor ced-1. Important for the generation
    of extracellular phosphatidylserine vesicles that promote loss of the exoplasmic
    leaflet from apoptotic cells in a time-dependent manner. Required for the exposure
    of exoplasmic leaflet on the phagocytic cells surrounding the apoptotic cells.
    Does not affect the phosphatidylserine externalization in living cells. May play
    a role in mediating transfer of phosphatidylserine from phosphatidylserine vesicles
    to ced-1 bearing phagocytes or alternatively result in the activation of a phosphatidylserine
    transporter in the phagocyte that promotes phosphatidylserine externalization.
  source_type: curated
  url: https://www.uniprot.org/uniprot/G5ED35
  source_id: G5ED35
- source: Alliance_Imported
  text: ttr-52 encodes a transthyretin-like secreted protein that is required for
    proper cell corpse engulfment; genetic analysis indicates that ttr-52 functions
    in the ced-1/CD91 pathway for engulfment; TTR-52 binds to both surface-exposed
    phosphatidylserine in vivo and the extracellular domain of CED-1, therefore acting
    like a bridging molecule during the recognition of apoptotic cells during cell
    corpse engulfment; ttr-52 is expressed in, and secreted from intestinal cells
    and co-localizes to apoptotic cells together with CED-1.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00008719;class=Gene
  source_id: WB:WBGene00008719
- source: Alliance_Automated
  text: Enables phosphatidylserine binding activity; protein-macromolecule adaptor
    activity; and scavenger receptor binding activity. Involved in aminophospholipid
    transport; apoptotic process involved in development; and recognition of apoptotic
    cell. Located in cell surface and extracellular vesicle.
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00008719;class=Gene
  source_id: WB:WBGene00008719
- source: RefSeq
  text: Enables several functions, including phosphatidylserine binding activity;
    protein homodimerization activity; and scavenger receptor binding activity. Involved
    in aminophospholipid transport; apoptotic process involved in development; and
    recognition of apoptotic cell. Located in cell surface and extracellular vesicle.
    [provided by Alliance of Genome Resources, Jul 2025]
  source_type: automated
  url: https://www.ncbi.nlm.nih.gov/gene/184363
  source_id: GeneID:184363
