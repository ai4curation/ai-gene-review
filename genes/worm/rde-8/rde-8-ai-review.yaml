core_functions:
- description: RDE-8 is a NYN-domain endoribonuclease recruited by RDE-1/siRNA complexes to
    RNAi target mRNAs in germline Mutator foci. It cleaves the target, which contributes to
    silencing, and produces 5' fragments that RDE-3 uridylates to template RRF-1-dependent
    secondary 22G-RNA amplification.
