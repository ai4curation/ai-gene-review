  label: Caenorhabditis elegans
description: RDE-8 is a germline-enriched NYN-domain (Zc3h12a/Regnase-like) endoribonuclease
  required for RNA interference in C. elegans. RDE-8 is recruited to RNAi target mRNAs downstream
  of the primary Argonaute RDE-1, which itself does not need slicer activity for silencing.
  With its interactors MUT-16, MUT-15, the NYN-domain proteins NYN-1/NYN-2 and the nucleotidyltransferase
  RDE-3/MUT-2, RDE-8 works in perinuclear germline Mutator foci. There it cleaves target mRNA,
  which promotes silencing, and its 5' cleavage fragments are 3'-uridylated by RDE-3 to act
  as templates for RRF-1 RNA-dependent RNA polymerase. RDE-8 catalytic activity (D76) is needed
  for WAGO 22G-RNA amplification and RNAi. RDE-8 is also required for RRF-3-dependent 26G-RNA
  accumulation in the ERI pathway, but this does not need its nuclease activity.
