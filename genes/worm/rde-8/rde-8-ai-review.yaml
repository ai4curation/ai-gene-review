  review:
    summary: NYN/Zc3h12 family IBA for mRNA binding. RDE-8 associates with RNAi target mRNA,
      but the binding is transient or indirect.
    action: KEEP_AS_NON_CORE
    reason: RDE-8 has no recognizable RNA-binding domain. Its association with target mRNA
      is detected only with the catalytic-dead D76N mutant and depends on RDE-1 and RDE-8
      interactors. RDE-8 does engage its mRNA substrate, but direct sequence binding is not
      established.
    supported_by:
    - reference_id: PMID:25635455
      supporting_text: RDE-8 contains no recognizable RNA-binding domain, and we only detected
        target binding when the conserved catalytic residues of RDE-8 were mutated, suggesting
        a transient or indirect interaction between RDE-8 and the target mRNA.
