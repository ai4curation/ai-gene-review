      proteins localize to Mutator foci through the B-C region of MUT-16
suggested_questions:
- question: What decides where along a target mRNA RDE-8 cleaves, and is its in vivo activity
    specific to Argonaute-paired RNA (the activity described by endoribonuclease activity,
    cleaving siRNA-paired mRNA)?
- question: How does RDE-8 support ERI-pathway 26G-RNA accumulation without its nuclease activity?
    Is this a structural role in the RRF-3 complex?
suggested_experiments:
- description: Map RDE-8 cleavage sites on RNAi target mRNAs in vivo by degradome sequencing
    in wild-type and D76N animals. Reconstitute cleavage with purified RDE-1/siRNA complexes
    to test whether pairing to a guide stimulates or directs RDE-8 activity.
