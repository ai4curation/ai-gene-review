  text: Predicted to enable protein serine/threonine kinase activity. Predicted to
    be involved in late endosome to vacuole transport; pexophagy; and protein targeting
    to vacuole. Predicted to be located in autophagosome. Predicted to be part of
    phosphatidylinositol 3-kinase complex, class III, type I and phosphatidylinositol
    3-kinase complex, class III, type II. Predicted to be active in late endosome
    and nucleus-vacuole junction. Orthologous to human PIK3R4 (phosphoinositide-3-kinase
    regulatory subunit 4).
