suggested_questions:
- question: Does C. elegans VPS-15 bind GTP rather than ATP, as human VPS15 does, and is it N-myristoylated
    like the human protein?
- question: Which vps-15 phenotypes (autophagy, endosome maturation, cell corpse clearance) does a vps-15
    null show, compared with bec-1 and vps-34 nulls?
suggested_experiments:
- description: Nucleotide-release HPLC/MS on purified worm VPS-34/VPS-15/BEC-1 complex, and an R101 gatekeeper
    mutant tested for rescue of vps-15 mutant autophagy and endosome phenotypes.
