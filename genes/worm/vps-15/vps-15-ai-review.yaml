    label: protein kinase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR008271
  review:
    summary: InterPro protein kinase domain mapping.
    action: REMOVE
    reason: The VPS15 N-terminal domain is a pseudokinase. In human PI3KC3-C1 it binds GTP, not ATP, and
      acts as an allosteric regulator of VPS34 rather than a protein kinase (PMID:39913640). Worm VPS-15
      keeps the arginine gatekeeper that sets GTP specificity and is well conserved in this region (file:worm/vps-15/vps-15-bioinformatics/RESULTS.md).
      There is no worm biochemical evidence of protein kinase activity. Domain-signature and phylogenetic
      transfer of catalytic kinase activity is therefore removed, consistent with the human PIK3R4 review.
    supported_by:
    - reference_id: PMID:39913640
      supporting_text: Finally, we found that VPS15PKD is an unusual pseudokinase that binds GTP instead
        of ATP
    - reference_id: file:worm/vps-15/vps-15-bioinformatics/RESULTS.md
      supporting_text: C. elegans VPS-15 keeps an arginine at the equivalent position (R101)
