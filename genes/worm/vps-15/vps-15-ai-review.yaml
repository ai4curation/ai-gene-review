id: Q23669
gene_symbol: vps-15
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: VPS-15 (ZK930.1) is the C. elegans ortholog of yeast Vps15 and human PIK3R4/p150, a 1354-residue
  regulatory subunit of the class III phosphatidylinositol 3-kinase. It has an N-terminal pseudokinase
  domain, a central HEAT-repeat region and a C-terminal WD40 domain. With the lipid kinase VPS-34 and
  BEC-1/Beclin it forms the core of two complexes. Complex I (with EPG-8/ATG14) makes phosphatidylinositol
  3-phosphate (PI3P) to nucleate autophagosomes. Complex II (with UVRAG) acts in endosome maturation and
  endosome-to-lysosome traffic. By analogy with human VPS15, the pseudokinase domain probably binds GTP
  and controls VPS-34 activity allosterically, rather than phosphorylating protein substrates. Experimental
  data on the worm protein itself are sparse.
