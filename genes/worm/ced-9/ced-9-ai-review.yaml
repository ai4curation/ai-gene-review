id: P41958
gene_symbol: ced-9
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: 'CED-9 is the Caenorhabditis elegans BCL2-family apoptosis inhibitor that restrains the core EGL-1/CED-9/CED-4/CED-3
  death pathway at mitochondria and other intracellular membranes. CED-9 binds and sequesters an asymmetric CED-4
  dimer, preventing CED-4 apoptosome assembly and CED-3 caspase activation; the BH3-only protein EGL-1 binds CED-9
  to release CED-4 and initiate apoptosis. CED-9 is also reused locally in developmental synapse pruning and has
  reported, context-dependent roles in mitochondrial fission/fusion control through DRP-1 and FZO-1.'
