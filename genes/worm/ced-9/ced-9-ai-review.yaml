suggested_questions:
- question: Should CED-9 involvement in mitochondrial fission and fusion be modeled as a conserved BCL2-family
    activity or kept as a C. elegans context-specific branch until the conflicting mitochondrial-dynamics 
    studies are reconciled?
- question: Should the positive-regulation-of-apoptosis PAINT assertion at PTN000135648 be split below the 
    CED-9 subfamily, or is CED-9 bifunctionality sufficient to keep a conservative positive-regulation row?
- question: Is a more specific GO molecular function needed for anti-apoptotic sequestration of apoptosome 
    adaptors, or is generic protein sequestering activity adequate for CED-9 and BCL2-family curation?
suggested_experiments:
- hypothesis: CED-4 sequestration, rather than a separate channel or mitochondrial-dynamics activity, is 
    sufficient for the essential CED-9 anti-apoptotic function.
  description: Use endogenous ced-9 rescue alleles that independently disrupt the CED-4 interface, the EGL-1 
    BH3-binding groove, the C-terminal membrane anchor, and the reported DRP-1/FZO-1 interfaces, then quantify
    embryonic cell survival, CED-4 localization, CED-3 activation, and mitochondrial morphology in the same 
    animals.
  experiment_type: structure-guided endogenous rescue epistasis
- hypothesis: Synaptic CED-9 uses the same CED-4-sequestering and EGL-1-release mechanism as whole-cell 
    apoptosis but is spatially limited by axonal mitochondria.
  description: Image endogenously tagged CED-9, CED-4, EGL-1, CED-3, and GSNL-1 during RME and DD synapse 
    pruning in BH3-groove and CED-4-interface ced-9 mutants to test whether the local pruning pathway requires
    the canonical inhibitory complex.
  experiment_type: live imaging with separation-of-function mutants
