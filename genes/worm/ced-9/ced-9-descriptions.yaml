gene_symbol: ced-9
organism: worm
uniprot_id: P41958
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Plays a major role in programmed cell death (PCD, apoptosis) (PubMed:10688797,
    PubMed:7907274). egl-1 binds to and directly inhibits the activity of ced-9, releasing
    the cell death activator ced-4 from a ced-9/ced-4 containing protein complex and
    allowing ced-4 to activate the cell-killing caspase ced-3 (PubMed:12894216, PubMed:15383288,
    PubMed:16208361, PubMed:9024666, PubMed:9027313, PubMed:9604928). During larval
    development, required for the elimination of transient presynaptic components
    downstream of egl-1 and upstream of ced-4 and ced-3 apoptotic pathway (PubMed:26074078).
    Has been shown in one study to be dispensable in mitochondrial dynamics and morphology
    during early embryonic development (PubMed:19327994). However, another study shows
    that a egl-1/ced-9 containing complex may promote drp-1-dependent mitochondrial
    fission (PubMed:21949250).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P41958
  source_id: P41958
- source: Alliance_Imported
  text: ced-9 encodes the sole C. elegans homolog of the mammalian cell-death inhibitor
    Bcl-2; during development, ced-9 activity is essential for preventing cells from
    undergoing programmed cell death; ced-9 also appears to have proapoptotic activity;
    CED-9 functions by binding and repressing the activity of CED-4, a protein similar
    to human APAF-1 and positive regulator of CED-3 caspase activity; CED-9 localizes
    to the mitochondrial outer membrane, although this localization is not essential
    for CED-9 to regulate apoptosis.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00000423;class=Gene
  source_id: WB:WBGene00000423
- source: Alliance_Automated
  text: Enables GTPase activator activity and protein sequestering activity. Involved
    in several processes, including actin filament depolymerization; positive regulation
    of cellular component organization; and regulation of apoptotic process. Located
    in several cellular components, including mitochondrial outer membrane; perikaryon;
    and perinuclear region of cytoplasm. Is expressed in several structures, including
    gonad. Human ortholog(s) of this gene implicated in several diseases, including
    breast disease (multiple); carcinoma (multiple); cerebrovascular disease (multiple);
    hematologic cancer (multiple); and prostate cancer (multiple). Orthologous to
    several human genes including BCL2L2 (BCL2 like 2).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00000423;class=Gene
  source_id: WB:WBGene00000423
