- id: PMID:17728253
  title: 'Properties, regulation, and in vivo functions of a novel protein kinase D: Caenorhabditis
    elegans DKF-2 links diacylglycerol second messenger to the regulation of stress responses and
    life span.'
  findings:
  - statement: DKF-2 is a DAG-responsive protein kinase D whose C1 domains deliver it to
      membranes for PKC phosphorylation of Ser-925 and Ser-929.
    supporting_text: DKF-2 C1 domains do not inhibit catalytic activity; they mediate delivery
      of DKF-2 to a membrane where protein kinase C phosphorylates Ser(925) and Ser(929) in the
      A-loop.
  - statement: Loss of DKF-2 extends adult lifespan and permits stress-induced DAF-16 nuclear
      accumulation.
    supporting_text: Adult life span increases 40% in animals lacking DKF-2.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only in cache, but the abstract directly supports the kinase
      regulation, membrane recruitment, intestinal expression and DAF-16/lifespan branch used
      here.
- id: PMID:19371715
  title: Protein kinase D is an essential regulator of C. elegans innate immunity.
  findings:
  - statement: DKF-2 promotes intestinal defense against bacterial pathogens and induces immune
      effector mRNAs by PMK-1-dependent and independent mechanisms.
    supporting_text: Induction of immune effector mRNAs by DKF-2 proceeded via PMK-1 (p38
      Map-kinase)-dependent and -independent pathways.
  - statement: DKF-2 acts downstream of TPA-1 in the DAG-to-immune-effector signaling arm.
    supporting_text: TPA-1, a PKCdelta homolog, regulated activation and functions of DKF-2 in
      vivo.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached; primary study for DKF-2 in antibacterial intestinal
      immunity.
- id: PMID:19671928
  title: Neuronal and intestinal protein kinase d isoforms mediate Na+ (salt taste)-induced
    learning.
  findings:
  - statement: The dkf-2 locus produces intestinal DKF-2A and neuronal DKF-2B isoforms that
      couple EGL-8/TPA-1 DAG signaling to salt-taste learning.
    supporting_text: Thus, pathways containing EGL-8-TPA-1-DKF-2 enable learning and behavioral
      plasticity by receiving, transmitting, and cooperatively integrating environmental signals
      targeted to both neurons and intestine.
  reference_review:
    relevance: MEDIUM
    correctness: UNVERIFIED
    review_notes: Abstract-only in cache; enough to support the non-core salt-learning role but
      not to inspect the original localization figures.
- id: PMID:27662904
  title: 'A Novel Conserved Domain Mediates Dimerization of Protein Kinase D (PKD) Isoforms: DIMERIZATION
    IS ESSENTIAL FOR PKD-DEPENDENT REGULATION OF SECRETION AND INNATE IMMUNITY.'
  findings:
  - statement: DKF-2A homodimerization is required for intestinal immune defense against an
      ingested bacterial pathogen.
    supporting_text: disruption of DKF-2A homodimerization in C. elegans intestine impaired and
      degraded the immune defense of the intact animal against an ingested bacterial pathogen.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only in cache; the abstract directly supports a DKF-2A structural
      requirement for in vivo intestinal immunity.
