taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: 'dkf-2 encodes a C. elegans protein kinase D with DAG/PMA-binding C1 domains and a serine/threonine
  kinase domain. The major DKF-2A isoform is expressed in the intestine, where TPA-1/PKC-dependent
  activation of DKF-2 links DAG signaling to bacterial pathogen resistance and immune-effector transcription
  through PMK-1-dependent and PMK-1-independent branches. DKF-2 is also expressed in a small set of
  neurons and contributes to salt-taste learning, and its stress-response branch opposes heat-induced
  DAF-16 nuclear accumulation and thereby limits adult lifespan under nonpathogenic culture conditions.'
