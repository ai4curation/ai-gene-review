suggested_questions:
- question: What direct DKF-2 substrate connects the PKD branch to PMK-1 activation in the
    intestinal antibacterial pathway?
suggested_experiments:
- hypothesis: DKF-2 activates PMK-1 by phosphorylating a protein upstream of SEK-1 rather than
    PMK-1 itself.
  description: Test candidate TIR-1, NSY-1, SEK-1 and VHP-1 phosphorylation by activated DKF-2
    in vitro and in infected worms, then assay phospho-PMK-1 and DKF-2-dependent effector
    transcripts after phosphosite substitution.
