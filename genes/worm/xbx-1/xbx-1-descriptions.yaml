gene_symbol: xbx-1
organism: worm
uniprot_id: Q19119
taxon_id: NCBITaxon:6239
descriptions:
- source: Alliance_Imported
  text: xbx-1 encodes a dynein light intermediate chain; XBX-1 activity is required
    for retrograde intraflagellar transport and thus, for proper formation of sensory
    neuron cilia; an XBX-1::YFP reporter fusion protein is found at the ciliary base
    and migrating along the ciliary axoneme in both anterograde and retrograde directions.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00006960;class=Gene
  source_id: WB:WBGene00006960
- source: Alliance_Automated
  text: Predicted to enable dynein heavy chain binding activity. Involved in intraciliary
    retrograde transport and non-motile cilium assembly. Located in several cellular
    components, including ciliary base; ciliary transition zone; and cytoskeleton.
    Is expressed in neurons. Human ortholog(s) of this gene implicated in asphyxiating
    thoracic dystrophy. Orthologous to human DYNC2LI1 (dynein cytoplasmic 2 light
    intermediate chain 1).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00006960;class=Gene
  source_id: WB:WBGene00006960
