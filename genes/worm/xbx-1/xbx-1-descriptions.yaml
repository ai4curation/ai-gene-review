- source: Alliance_Automated
  text: Predicted to enable dynein heavy chain binding activity. Involved in intraciliary
    retrograde transport and non-motile cilium assembly. Located in several cellular
    components, including ciliary base; ciliary transition zone; and cytoskeleton.
    Is expressed in neurons. Human ortholog(s) of this gene implicated in asphyxiating
    thoracic dystrophy. Orthologous to human DYNC2LI1 (dynein cytoplasmic 2 light
    intermediate chain 1).
