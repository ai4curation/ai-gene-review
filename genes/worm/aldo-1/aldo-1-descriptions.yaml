taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: May be involved in the metabolism of fructose-bisphosphate (beta-D-fructose
    1,6-bisphosphate) and of fructose 1-phosphate.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P54216
  source_id: P54216
- source: Alliance_Imported
  text: aldo-1 is orthologous to the human gene ALDOLASE A, FRUCTOSE-BISPHOSPHATE
    (ALDOA; OMIM:103850), which when mutated leads to aldolase A deficiency.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00011474;class=Gene
  source_id: WB:WBGene00011474
- source: Alliance_Automated
  text: Enables fructose-bisphosphate aldolase activity and identical protein binding
    activity. Predicted to be involved in fructose 1,6-bisphosphate metabolic process
    and glycolytic process. Located in endoplasmic reticulum; sarcomere; and striated
    muscle dense body. Is expressed in body wall musculature; enteric muscle; nervous
    system; and reproductive system. Human ortholog(s) of this gene implicated in
    autoimmune disease of the nervous system; glycogen storage disease XII; hereditary
    fructose intolerance syndrome; and type 2 diabetes mellitus. Orthologous to several
    human genes including ALDOA (aldolase, fructose-bisphosphate A).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00011474;class=Gene
  source_id: WB:WBGene00011474
