gene_symbol: epg-5
organism: worm
uniprot_id: Q18892
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Involved in the maturation of autophagosomes into autolysosomes during starvation-induced
    autotrophy (PubMed:20550938, PubMed:22451698, PubMed:24374177, PubMed:25124690).
    Specifically, involved in the clearance of apoptotic cells by promoting the delivery
    of engulfed apoptotic cells to the lysosome (PubMed:22451698).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q18892
  source_id: Q18892
- source: Alliance_Automated
  text: Involved in macroautophagy and negative regulation of autophagosome assembly.
    Located in cytoplasm. Is expressed in several structures, including body wall
    musculature; hypodermis; intestine; pharyngeal muscle cell; and tail. Human ortholog(s)
    of this gene implicated in Vici syndrome and neurodevelopmental disorder with
    parkinsonism or other movement abnormalities. Orthologous to human EPG5 (ectopic
    P-granules 5 autophagy tethering factor).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00016968;class=Gene
  source_id: WB:WBGene00016968
