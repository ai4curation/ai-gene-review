      score: 3
    - rubric: utility
      score: 2
    - rubric: compactness
      score: 4
    - rubric: completeness
      score: 2
    - rubric: specificity
      score: 2
    overall_notes: Macroautophagy is right, but 'negative regulation of autophagosome
      assembly' is MODIFIED in the review; no fusion or tethering role.
findings:
- category: discrepancy
  text: The automated text describes EPG-5 as a negative regulator of autophagosome
    assembly; the review MODIFYs that term and places EPG-5 in autophagosome-lysosome
    fusion as a RAB-7 effector.
  sources:
  - Alliance_Automated
review:
  reviewer: AI
  rubrics:
  - rubric: overall_concordance
    score: 3
  overall_notes: Both say autophagy; the automated term implies inhibition of assembly,
    which the review revises.
