gene_symbol: tir-1
organism: worm
uniprot_id: Q86DA5
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: 'NAD(+) hydrolase, which plays a key role in non-apoptotic cell death by regulating
    NAD(+) metabolism (PubMed:27671644). In response to stress, homooligomerizes and
    catalyzes cleavage of NAD(+) into ADP-D-ribose (ADPR) and nicotinamide; NAD(+)
    cleavage promoting non-apoptotic neuronal cell death (PubMed:31439792). In males,
    involved in non-apoptotic death of the linker cell which guides gonad elongation
    during larval development (PubMed:22363008). Required for both innate immune response
    and specification of AWC(OFF) neuron (PubMed:15048112, PubMed:15123841, PubMed:15625192).
    During late embryogenesis, it acts downstream of CAMKII (unc-43) to regulate specification
    of asymmetric odorant receptors in AWC(OFF) neuron via the nsy-1/ASK1 pmk-1/p38
    MAP kinase signaling cascade. Required to localize nsy-1 to postsynaptic regions
    of AWC neuron, suggesting that it may act by assembling a signaling complex that
    regulate odorant receptor expression (PubMed:15625192). Also plays a central role
    in resistance to infection to a broad range of bacterial and fungi pathogens,
    possibly by activating pmk-1, independently of the NF-kappa-B pathway. Required
    for expression of antimicrobial peptides nlp-29 and nlp-31 (PubMed:15048112, PubMed:15123841).
    Its role in immune response and neuron specification may be mediated by the same
    nsy-1/ASK1 pmk-1/p38 MAP kinase cascade signaling pathway (PubMed:15048112, PubMed:15123841,
    PubMed:15625192). Involved in the response to anoxic conditions probably by activating
    the p38 pathway composed of nsy-1/sek-1/pmk-1 (PubMed:21212236). Involved in regulation
    of the serotonergic response of ADF neurons to pathogenic food (PubMed:23505381).
    In addition, plays a role in the up-regulation of gcs-1 upon arsenite treatment,
    most likely through activation of pmk-1, to confer protection against toxicity
    induced by heavy metals (PubMed:25204677). . [Isoform b]: Regulates expression
    of antimicrobial peptide nlp-29 in response to fungal infection or physical injury.'
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q86DA5
  source_id: Q86DA5
- source: Alliance_Imported
  text: tir-1 encodes a Toll-Interleukin 1 Receptor (TIR) domain adaptor protein that
    is the C. elegans ortholog of human SARM (sterile alpha and armadillo repeats);
    tir-1 is required for innate immunity, as loss of tir-1 activity results in increased
    susceptibility to infection; tir-1 also functions in a lateral signaling pathway
    that specifies neuronal identity and is required for proper localization of NSY-1/MAPKKK
    to post-synaptic regions; TIR-1 physically interacts with a number of proteins,
    including UNC-43/CaMKII, the RAB-1 GTPase, and the ATP synthase f subunit encoded
    by R53.4; TIR-1 is expressed in neurons and localizes to post-synaptic regions
    of axons.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00006575;class=Gene
  source_id: WB:WBGene00006575
- source: Alliance_Automated
  text: Enables several functions, including NAD+ nucleosidase activity; enzyme binding
    activity; and identical protein binding activity. Involved in several processes,
    including NAD+ catabolic process; defense response to bacterium; and regulation
    of gene expression. Acts upstream of or within serotonin biosynthetic process.
    Located in axon cytoplasm and cell body. Is active in cytoplasm. Is expressed
    in AWCL; AWCR; head; intestine; and pharynx. Used to study amyotrophic lateral
    sclerosis. Orthologous to human SARM1 (sterile alpha and TIR motif containing
    1).
