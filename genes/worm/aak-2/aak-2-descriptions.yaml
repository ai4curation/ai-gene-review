gene_symbol: aak-2
organism: worm
uniprot_id: Q95ZQ4
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Acts as a sensor that couples lifespan to information about energy levels
    and insulin-like signals (PubMed:15574588). Role in motility and response to oxidative
    stress (PubMed:18408008, PubMed:24763318). Involved in the establishment of germline
    stem cell (GSC) quiescence during dauer development (PubMed:15574588, PubMed:20110331).
    Plays a role in axon regrowth after axotomy in PLM neurons (PubMed:24431434).
    Plays a role in the maintenance of glycogen stores which are necessary for resistance
    to hyperosmotic stress (PubMed:26439621). Plays a role in the regulation of flp-7
    secretion from ASI neurons (PubMed:28128367). Keeps the CREB-regulated transcription
    coactivator 1 homolog crtc-1 inactive which in turn inhibits flp-7 secretion (PubMed:28128367).
    Following serotonin signaling, derepresses crtc-1 which stimulates flp-7 secretion
    and subsequent body fat loss (PubMed:28128367).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q95ZQ4
  source_id: Q95ZQ4
- source: Alliance_Imported
  text: aak-2 encodes one of two C. elegans homologs of the catalytic alpha subunit
    of AMP-activated protein kinases (AMPKs); in C. elegans, aak-2 functions downstream
    of environmental stressors, energy level signals (AMP:ATP ratio), and daf-2-mediated
    insulin signaling to positively regulate adult lifespan; in regulating lifespan,
    aak-2 likely acts in parallel with daf-16/FOXO; aak-2 activity is also required
    for dauer formation in daf-2 mutant animals at high temperature in a manner independent
    of the AMP:ATP ratio; in the germline, aak-2 functions downstream of daf-2 and
    daf-7, and in parallel to par-4 and aak-1, to negatively regulate germline proliferation
    during dauer development; in vitro, AAK-2 exhibits AMP-enhanced kinase activity
    against a known AMPK substrate, the SAMS peptide.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00020142;class=Gene
  source_id: WB:WBGene00020142
- source: Alliance_Automated
  text: Enables AMP-activated protein kinase activity. Involved in several processes,
    including determination of adult lifespan; nematode pharyngeal pumping; and regulation
    of protein secretion. Located in axon; cytoplasm; and neuronal cell body. Is expressed
    in several structures, including body wall musculature; excretory cell; nervous
    system; pharynx; and reproductive system. Human ortholog(s) of this gene implicated
    in Huntington's disease; breast cancer; colon cancer; hyperinsulinism; and type
    2 diabetes mellitus. Orthologous to human PRKAA1 (protein kinase AMP-activated
    catalytic subunit alpha 1) and PRKAA2 (protein kinase AMP-activated catalytic
    subunit alpha 2).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00020142;class=Gene
