- source: Alliance_Automated
  text: Enables AMP-activated protein kinase activity. Involved in several processes,
    including determination of adult lifespan; nematode pharyngeal pumping; and regulation
    of protein secretion. Located in axon; cytoplasm; and neuronal cell body. Is expressed
    in several structures, including body wall musculature; excretory cell; nervous
    system; pharynx; and reproductive system. Human ortholog(s) of this gene implicated
    in Huntington's disease; breast cancer; colon cancer; hyperinsulinism; and type
    2 diabetes mellitus. Orthologous to human PRKAA1 (protein kinase AMP-activated
    catalytic subunit alpha 1) and PRKAA2 (protein kinase AMP-activated catalytic
    subunit alpha 2).
