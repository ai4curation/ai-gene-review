descriptions:
- source: UniProt
  text: Component of the chromosomal passenger complex (CPC), a complex that acts
    as a key regulator of chromosome segregation and cytokinesis during mitosis. The
    CPC complex has essential functions at the centromere in ensuring correct chromosome
    alignment and segregation. In the complex, it may be required to direct the Aurora
    B/air-2 to centromeric DNA.
  source_type: curated
  url: https://www.uniprot.org/uniprot/O45952
  source_id: O45952
