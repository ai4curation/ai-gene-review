gene_symbol: csc-1
organism: worm
uniprot_id: O45952
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Component of the chromosomal passenger complex (CPC), a complex that acts
    as a key regulator of chromosome segregation and cytokinesis during mitosis. The
    CPC complex has essential functions at the centromere in ensuring correct chromosome
    alignment and segregation. In the complex, it may be required to direct the Aurora
    B/air-2 to centromeric DNA.
  source_type: curated
  url: https://www.uniprot.org/uniprot/O45952
  source_id: O45952
- source: Alliance_Imported
  text: csc-1 encodes a novel protein conserved amongst Caenorhabditis nematodes;
    CSC-1 is a member of the Aurora B kinase complex (chromosome passenger complex)
    that, in C. elegans, also includes ICP-1, BIR-1, and AIR-2; CSC-1 localizes to
    meiotic and mitotic chromosomes, as well as to the spindle midzone; CSC-1 is required
    for localization of the AIR-2 kinase, and CSC-1, ICP-1, and BIR-1 are all interdependent
    for their localization.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00000804;class=Gene
  source_id: WB:WBGene00000804
- source: Alliance_Automated
  text: Involved in mitotic cleavage furrow ingression and nuclear division. Located
    in condensed nuclear chromosome; meiotic spindle midzone; and mitotic spindle
    midzone. Part of chromosome passenger complex. Is expressed in oocyte.
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00000804;class=Gene
  source_id: WB:WBGene00000804
