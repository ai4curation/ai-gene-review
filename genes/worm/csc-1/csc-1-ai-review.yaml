      supporting_text: These embryos have defects in chromosome congression to the metaphase plate
        and in segregation of the chromosomes to the spindle poles.
    - reference_id: PMID:12707312
      supporting_text: After spindle elongation, a cleavage furrow forms and ingresses, but it fails
        to ingress to completion, thus producing a multinucleate embryo.
- term:
    id: GO:0000281
    label: mitotic cytokinesis
  evidence_type: IMP
  original_reference_id: PMID:12707312
  qualifier: involved_in
  supporting_entities:
  - WB:WBRNAi00064166
  review:
    summary: >-
      csc-1(RNAi) and csc-1(t1171) embryos initiate a cleavage furrow that fails to complete,
      giving multinucleate embryos. CSC-1 is needed to bring AIR-2, ICP-1 and BIR-1 to the
      spindle midzone, where the CPC acts in cytokinesis.
    action: ACCEPT
    reason: >-
      Clear loss-of-function phenotype, identical to loss of the other CPC subunits, plus
      localization of CSC-1 to the midzone in anaphase and telophase. The CPC is part of the
      cytokinetic machinery, so CSC-1 takes part in the process and is not merely needed for it.
    supported_by:
    - reference_id: PMID:12707312
      supporting_text: the chromatin becomes stretched along the spindle axis, and cytokinesis
        initiates but ultimately fails
    - reference_id: PMID:12707312
      supporting_text: In mitosis, CSC-1 localizes to chromosomes during metaphase (Fig. 2 D) and to
        the spindle midzone during anaphase (Fig. 2 E) and telophase.
