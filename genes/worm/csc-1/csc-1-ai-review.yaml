core_functions:
- description: >-
    CSC-1 is a non-catalytic targeting subunit of the chromosomal passenger complex. It binds
    BIR-1 directly, and the CSC-1/BIR-1 subcomplex recruits ICP-1 and, through it, the Aurora B
    kinase AIR-2, bringing the complex to meiotic and mitotic chromosomes. There it is needed
    for chromosome alignment and for meiotic and mitotic chromosome segregation.
  in_complex:
    id: GO:0032133
    label: chromosome passenger complex
  locations:
  - id: GO:0000794
    label: condensed nuclear chromosome
  directly_involved_in:
  - id: GO:0007080
    label: mitotic metaphase chromosome alignment
  - id: GO:0000070
    label: mitotic sister chromatid segregation
  - id: GO:0045132
    label: meiotic chromosome segregation
  supported_by:
  - reference_id: PMID:12707312
    supporting_text: The binding of AIR-2 to BIR-1 required CSC-1 (and ICP-1) and vice versa.
  - reference_id: PMID:12707312
    supporting_text: AIR-2 requires CSC-1, BIR-1, and ICP-1 to localize to chromosomes.
  - reference_id: PMID:12707312
    supporting_text: The condensed chromosomes do not form a well-ordered metaphase plate
- description: >-
    From anaphase the CSC-1-containing complex moves to the spindle midzone, where it is needed
    for cytokinesis to complete in the embryo.
  in_complex:
    id: GO:0032133
    label: chromosome passenger complex
  locations:
  - id: GO:1990023
    label: mitotic spindle midzone
  directly_involved_in:
  - id: GO:0000281
    label: mitotic cytokinesis
  supported_by:
  - reference_id: PMID:12707312
    supporting_text: In mitosis, CSC-1 localizes to chromosomes during metaphase (Fig. 2 D) and to
      the spindle midzone during anaphase (Fig. 2 E) and telophase.
  - reference_id: PMID:12707312
    supporting_text: After spindle elongation, a cleavage furrow forms and ingresses, but it fails
      to ingress to completion, thus producing a multinucleate embryo.
suggested_questions:
- question: >-
    Should CSC-1 carry a molecular function term? Its biochemistry (direct zinc-dependent BIR-1
    binding; required for stable BIR-1/ICP-1 and BIR-1/AIR-2 association) resembles a
    protein-macromolecule adaptor (GO:0030674), but human Borealin (CDCA8) carries no molecular
    function term beyond protein binding, so none is asserted here.
- question: >-
    Is CSC-1 a true Borealin orthologue, i.e. does it form the three-helix bundle with BIR-1
    and the ICP-1 N-terminus that Borealin forms with Survivin and INCENP, or has it converged
    on Borealin's targeting role?
- question: >-
    Does CSC-1 contact ICP-1 directly within the complex? Binary CSC-1/ICP-1 binding was
    undetectable, yet ICP-1 binds the CSC-1/BIR-1 subcomplex strongly.
- question: >-
    Do the yeast two-hybrid interactions of CSC-1 with PDZ proteins (LIN-10, MAGI-1, AFD-1)
    have any in vivo meaning, for example in post-embryonic or neuronal cells?
suggested_experiments:
- description: >-
    Solve or model (for example with AlphaFold-Multimer) the CSC-1/BIR-1/ICP-1 N-terminal
    complex and test the predicted interface by mutating CSC-1 residues in an endogenous
    CRISPR allele.
  hypothesis: CSC-1 forms a Borealin-like three-helix bundle with BIR-1 and ICP-1 that is
    required for CPC targeting to chromosomes.
- description: >-
    Test whether CSC-1 has a Borealin-like chromatin- or DNA-binding activity of its own,
    using purified CSC-1 and CSC-1/BIR-1 in nucleosome or DNA binding assays.
  hypothesis: CSC-1 contributes directly to chromatin binding of the CPC rather than acting
    only as a bridge between BIR-1 and ICP-1.
