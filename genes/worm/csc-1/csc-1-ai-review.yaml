- id: GO_REF:0000044
  title: Gene Ontology annotation based on UniProtKB/Swiss-Prot Subcellular Location
    vocabulary mapping, accompanied by conservative changes to GO terms applied by
    UniProt
  findings: []
- id: PMID:12707312
  title: 'CSC-1: a subunit of the Aurora B kinase complex that binds to the survivin-like
    protein BIR-1 and the incenp-like protein ICP-1.'
  findings:
  - statement: Loss of CSC-1 phenocopies loss of AIR-2, ICP-1 or BIR-1.
    supporting_text: C. elegans embryos depleted of CSC-1, AIR-2, ICP-1, or BIR-1 have identical
      phenotypes.
  - statement: CSC-1, BIR-1 and ICP-1 are interdependent for localization, and AIR-2 needs all
      three.
    supporting_text: AIR-2 requires CSC-1, BIR-1, and ICP-1 to localize to chromosomes.
  - statement: CSC-1 binds BIR-1 directly; the interaction needs the zinc-bound BIR domain.
    supporting_text: We conclude that the interaction between CSC-1 and BIR-1 requires a native,
      Zn2+-bound BIR domain.
  - statement: ICP-1 binds robustly only to the CSC-1/BIR-1 subcomplex, and AIR-2 binding to BIR-1
      requires CSC-1.
    supporting_text: The binding of AIR-2 to BIR-1 required CSC-1 (and ICP-1) and vice versa.
  - statement: CSC-1 does not stimulate AIR-2 kinase activity; it is proposed to be a targeting
      subunit.
    supporting_text: This activity is not stimulated by CSC-1/BIR-1, suggesting that these two
      subunits function as targeting subunits for AIR-2 kinase.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text read (PMC2172917). The discovery paper and the source of all
      experimental GOA rows for csc-1.
- id: PMID:21110867
  title: A genome-wide study of PDZ-domain interactions in C. elegans reveals a high
    frequency of non-canonical binding.
  findings:
  - statement: CSC-1 interacts with PDZ domains of LIN-7/LIN-10 in a yeast two-hybrid screen; the
      functional relevance is untested.
    supporting_text: the multipartite interaction between LIN-7 and CSC-1, and LIN-10 with CSC-1
      and ICP-1
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Full text checked; source of the four protein-binding IPI rows. Large-scale
      Y2H screen; no functional follow-up for CSC-1.
