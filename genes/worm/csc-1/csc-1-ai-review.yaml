id: O45952
gene_symbol: csc-1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: >-
  csc-1 (Y48E1B.12) encodes CSC-1, a 249-residue non-catalytic subunit of the Caenorhabditis
  elegans chromosomal passenger complex (CPC), together with the Aurora B kinase AIR-2, the
  INCENP orthologue ICP-1 and the Survivin-like protein BIR-1. It has a short N-terminal coiled
  coil followed by a largely disordered region and is a highly divergent member of the Borealin
  family. CSC-1 binds BIR-1 directly, in a way that depends on the zinc-bound BIR domain, and the
  CSC-1/BIR-1 subcomplex binds ICP-1, which in turn binds and activates AIR-2. CSC-1 does not
  stimulate AIR-2 kinase activity itself. Instead, CSC-1, BIR-1 and ICP-1 depend on one another
  to localize, and AIR-2 needs all three to reach its sites of action. CSC-1 is therefore part of
  the targeting module of the complex. It is found on the midregion of meiotic bivalents and on
  mitotic chromosomes up to metaphase, and on the meiotic and mitotic spindle midzone from
  anaphase. Embryos lacking CSC-1 show the same defects as embryos lacking AIR-2: female meiotic
  chromosome segregation and polar body extrusion fail, mitotic chromosomes congress and
  segregate poorly, and cytokinesis starts but is not completed.
