    summary: >-
      Mapped from the UniProt subcellular location "Chromosome, centromere", which UniProt
      attributes to PMID:12707312. The paper shows CSC-1 on mitotic chromosomes and on the
      midregion of meiotic bivalents, and discusses CPC "centromeric localization"; the
      immunofluorescence does not itself resolve a centromeric sub-domain, and C. elegans
