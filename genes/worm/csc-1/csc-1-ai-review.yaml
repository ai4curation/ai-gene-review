  review:
    summary: >-
      ComplexPortal statement for the CPC. True, but the cited paper documents specific mitotic
      defects in csc-1 mutant and RNAi embryos: failed chromosome congression and segregation,
      and incomplete cytokinesis.
    action: MODIFY
    reason: >-
      Correct but too general. The specific mitotic processes supported by the cited paper are
      mitotic sister chromatid segregation and mitotic cytokinesis; the latter is already
      carried by the gene.
    proposed_replacement_terms:
