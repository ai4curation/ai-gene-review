suggested_questions:
- question: What are the direct phosphorylation substrates of GCK-1 at the cortex (e.g. ERM-1, MOB-4, ANI-1, RGA-3/4
    or MRCK-1), and is kinase activity required for its roles in canal extension, bridge stability and contractility?
- question: Does GCK-1 inhibit MPK-1a activation by docking-site sequestration alone, or through phosphorylation
    of an upstream component of the LET-60/LIN-45/MEK-2 cascade?
- question: Is GCK-1 a stable subunit of a purified C. elegans STRIPAK complex (with FARL-11, CASH-1, LET-92, MOB-4),
    and should it carry a FAR/SIN/STRIPAK complex (GO:0090443) annotation?
suggested_experiments:
- description: Express recombinant GCK-1 (wild type and K-to-R / D154N kinase-dead) for in vitro kinase assays against
    candidate substrates, and test kinase-dead CRISPR alleles for excretory canal, germline bridge and zygote contractility
    phenotypes.
  hypothesis: GCK-1 catalytic activity, not only its scaffolding with CCM-3, is required for its cortical functions.
- description: Introduce the ERK docking-site mutations (R55G, I64N) into endogenous gck-1 by CRISPR and measure
    pachytene MAPK-YT staining, oogenesis and germ cell apoptosis.
  hypothesis: Docking to MPK-1a is required for GCK-1 to restrain MPK-1a activation in pachytene.
