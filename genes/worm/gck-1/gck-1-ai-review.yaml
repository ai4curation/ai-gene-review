  title: WormBase gene description for gck-1 (worm)
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: WormBase curated description (uncited, undated). Its claims (sole
      GCK-III member of the Ste20 family, germline inhibition of MPK-1a activation
      and of physiological apoptosis, and in vitro MPK-1a binding) match PMID:19826475
      and this review. The text is correct but incomplete. It omits the CCM-3/STRIPAK
      role of GCK-1 in excretory canal tube extension (PMID:25743393). It also omits
      the CCM-3-dependent stabilisation of germline intercellular bridges (PMID:28285996).
      A missing-statement defect is recorded. Not used as support.
    source_defects:
    - defect_type: MISSING_STATEMENT
      resource: WORMBASE
      record: WB:WBGene00001526
      slot: MOD_provided_gene_description
      requested_change: CHECK
      asserted_value: WB:WBGene00001526
      confidence: PROBABLE
      explanation: The WormBase gene description covers only the germline MPK-1a
        and apoptosis roles of GCK-1. It does not mention that GCK-1 acts with its
        co-factor CCM-3 and the STRIPAK complex to promote excretory canal (seamless
        tube) extension (PMID:25743393). It also omits that GCK-1 with CCM-3 stabilises
        germline intercellular bridges and limits anillin and non-muscle myosin II
        there (PMID:28285996). Consider adding these roles.
