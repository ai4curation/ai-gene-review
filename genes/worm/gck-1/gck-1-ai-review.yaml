          to promote intercellular bridge stability and limit localization of both
          canonical anillin and non-muscle myosin II (NMM II) to intercellular bridges.
core_functions:
- description: GCK-III serine/threonine protein kinase that, bound to CCM-3 as a STRIPAK core subunit, acts at the
    cell cortex (apical membrane of the excretory canal, intercellular bridges, cytokinetic ring) to restrain RHO-1-driven
    actomyosin contractility and support tube extension.
