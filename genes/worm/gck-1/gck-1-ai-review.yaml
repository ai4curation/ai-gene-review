gene_symbol: gck-1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: 'gck-1 (T19A5.2) encodes Germinal center kinase 1, the single C. elegans member of the GCK-III subfamily
  of STE20 serine/threonine protein kinases (orthologous to human STK24/MST3, STK26/MST4 and STK25). It has an N-terminal
  kinase domain and a C-terminal PDCD10_N dimerisation region through which it binds CCM-3, the ortholog of the
  cerebral cavernous malformation protein CCM3/PDCD10; GCK-1 is a core subunit of the CCM-3-containing STRIPAK kinase-phosphatase
  complex, and the two proteins depend on each other for stability and localization. GCK-1 is cytoplasmic and enriched
  at the cell cortex: on the cytoplasmic face of the apical (luminal) membrane of the excretory canal, on germline
  intercellular bridges and on the cytokinetic ring of the zygote. There it acts with CCM-3 to restrain RHO-1-driven
  actomyosin contractility, limiting anillin (ANI-1) and non-muscle myosin (NMY-2) at bridges and rings, and it
  supports extension of the seamless excretory canal tube with CDC-42 signalling, Golgi stability and endocytic
  recycling. In the germline GCK-1 is required for oogenesis and fertility and for restraining germ cell apoptosis;
  it binds the ERK MPK-1 isoform a through an N-terminal ERK docking site and restrains MPK-1a activation during
  pachytene. STRIPAK core components including GCK-1 also modulate katanin activity in early embryos. Direct phosphorylation
  substrates in C. elegans are not known.'
