gene_symbol: gck-1
organism: worm
uniprot_id: H2L099
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Serine/threonine-protein kinase which is required for normal oogenesis and
    suppression of germline cell apoptosis. Inhibits phosphorylation and thus probably
    activation of mpk-1 during pachytene stage (PubMed:19826475). Involved in excretory
    canal elongation during postembryonic development, probably acting downstream
    of ccm-3 (PubMed:25743393).
  source_type: curated
  url: https://www.uniprot.org/uniprot/H2L099
  source_id: H2L099
- source: Alliance_Imported
  text: gck-1 encodes one of eight C. elegans germinal center kinases (GCKs) that
    are members of the Ste20-related family of kinases; GCK-1 is the sole C. elegans
    GCK-III subfamily member; during reproductive development, GCK-1 functions in
    the germ line to regulate oocyte development by inhibiting activation of a specific
    MPK-1 isoform, MPK-1a, and by negatively regulating physiological germline apoptosis;
    GCK-1 physically interacts with MPK-1a in vitro suggesting that, in vivo, GCK-1
    inhibits MPK-1a by a direct interaction.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00001526;class=Gene
  source_id: WB:WBGene00001526
- source: Alliance_Automated
  text: Enables mitogen-activated protein kinase binding activity and protein serine/threonine
    kinase activity. Involved in several processes, including positive regulation
    of GTPase activity; positive regulation of endocytic recycling; and regulation
    of oocyte development. Located in cytoplasm and cytoplasmic side of apical plasma
    membrane. Used to study cerebral cavernous malformation. Orthologous to several
    human genes including STK25 (serine/threonine kinase 25) and STK26 (serine/threonine
    kinase 26).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00001526;class=Gene
  source_id: WB:WBGene00001526
