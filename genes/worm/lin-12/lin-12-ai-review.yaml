core_functions:
- description: >-
    Cell-surface Notch-family receptor that binds DSL ligands (LAG-2, APX-1, DSL-1) and the DOS co-ligand
    OSM-11 on neighboring cells and acts cell-autonomously in the signal-receiving cell to specify binary
    cell fates.
  molecular_function:
    id: GO:0004888
    label: transmembrane signaling receptor activity
  directly_involved_in:
  - id: GO:0007219
    label: Notch signaling pathway
  - id: GO:0001708
    label: cell fate specification
  locations:
  - id: GO:0005886
    label: plasma membrane
  - id: GO:0016324
    label: apical plasma membrane
  supported_by:
  - reference_id: PMID:2736627
    supporting_text: lin-12 functions in the receiving mechanism for the
  - reference_id: PMID:18700817
    supporting_text: >-
      interact with LIN-12 extracellular EGF repeats 1 through 6 in the two-hybrid assay
  - reference_id: PMID:18700817
    supporting_text: >-
      We found that OSM-11 also interacted with LIN-12 extracellular EGF repeats 1 through 6 (Figure 8)
  - reference_id: PMID:8343960
    supporting_text: >-
      Our results indicate that the intracellular domains of Lin-12 and Notch have intrinsic activity
      and that the principal role of the extracellular domains in the intact proteins is to regulate this
      activity.
- description: >-
    After ligand-induced cleavage the LIN-12 intracellular domain enters the nucleus, binds LAG-1/CSL
    via its RAM domain and recruits the Mastermind-like coactivator LAG-3 to activate Notch target transcription.
  molecular_function:
    id: GO:0003713
    label: transcription coactivator activity
  directly_involved_in:
  - id: GO:0045893
    label: positive regulation of DNA-templated transcription
  locations:
  - id: GO:0005634
    label: nucleus
  in_complex:
    id: GO:1990433
    label: CSL-Notch-Mastermind transcription factor complex
  supported_by:
  - reference_id: PMID:10830967
    supporting_text: >-
      Here we identify LAG-3, a glutamine-rich protein that forms a ternary complex together with the
      LAG-1 DNA-binding protein and the receptor's intracellular domain.
  - reference_id: PMID:10830967
    supporting_text: >-
      We propose that GLP-1 and LIN-12 promote signalling by recruiting LAG-3 to target promoters, where
      it functions as a transcriptional activator.
  - reference_id: PMID:16530045
    supporting_text: >-
      Here we report the 3.1 A structure of the ternary complex formed by CSL, NotchIC, and Mastermind
      bound to DNA.
  - reference_id: PMID:18381292
    supporting_text: >-
      Our binding data show that RAM and CSL form a high affinity complex in the presence or absence of
      DNA.
suggested_questions:
- question: >-
    Why does PANTHER place LIN-12 (and APX-1) in PTHR24049:SF22 'Drosophila crumbs homolog' rather than
    the Notch receptor family used for GLP-1 (PTHR45836:SF23)? This placement propagates ligand-only functions
    (Notch binding, negative regulation of Notch signaling) onto a receptor.
- question: >-
    Which LIN-12 functions are strictly CSL(LAG-1)-dependent, and is there any evidence for CSL-independent
    LIN-12 signaling (for example in the lateral-signal-inhibiting activity of the ectodomain)?
suggested_experiments:
- description: >-
    Test direct binding of purified LIN-12 EGF repeats to LAG-2, APX-1 and DSL-1 DSL domains, and to OSM-11,
    by SPR or biolayer interferometry to replace yeast two-hybrid evidence.
