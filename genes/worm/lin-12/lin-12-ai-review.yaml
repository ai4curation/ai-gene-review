- term:
    id: GO:0045746
    label: negative regulation of Notch signaling pathway
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:1859388
  - PANTHER:PTN001170801
  - RGD:70953
  review:
    summary: >-
      IBA from PANTHER node PTN001170801 seeded by mouse DLL4 (MGI:1859388) and rat DLL3 (RGD:70953).
    action: REMOVE
    reason: >-
      Negative regulation of Notch signaling by these donors reflects cis-inhibition by these ligands,
      and DLL3 acts as an inhibitory ligand. LIN-12 is a Notch receptor whose activity is itself the signal,
      and it has no DSL/DOS ligand domain. The propagation is an artefact of LIN-12 being grouped with
      ligands in PTHR24049.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - ROLE_CONFLATION
      - WRONG_ORTHOLOG_OR_PARALOG
      source_entities:
      - source_id: PANTHER:PTN001170801
        source_label: PTN001170801
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          Negative regulation donors are mouse DLL4 (MGI:1859388) and rat DLL3 (RGD:70953), both DSL ligands.
          The receptor LIN-12 does not share that role.
    supported_by:
    - reference_id: PMID:8343960
      supporting_text: >-
        Our results indicate that the intracellular domains of Lin-12 and Notch have intrinsic activity
        and that the principal role of the extracellular domains in the intact proteins is to regulate
        this activity.
