id: P14585
gene_symbol: lin-12
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: >-
  LIN-12 is one of the two Caenorhabditis elegans Notch-family receptors. It is a single-pass type I membrane
  protein with 13 EGF-like repeats, three LIN-12/Notch repeats and a negative regulatory region outside
  the cell, and a RAM region and ankyrin repeats inside. LIN-12 responds to the DSL ligands LAG-2, APX-1
  and DSL-1, aided by the secreted DOS-motif co-ligand OSM-11. Ligand binding triggers ADAM (SUP-17/ADM-4)
  and gamma-secretase (SEL-12/HOP-1) cleavage, which releases the intracellular domain. That domain enters
  the nucleus and forms a transcriptional activation complex with the CSL factor LAG-1 and the Mastermind-like
  coactivator LAG-3/SEL-8. LIN-12 acts cell-autonomously as a binary cell-fate switch in many cell-cell
  interactions. These include the anchor cell/ventral uterine decision, lateral specification of the secondary
  vulval fate, dorsoventral patterning of the postembryonic mesoderm, and vm2 muscle-arm development.
  It acts redundantly with GLP-1 in the embryo. In vulval precursor cells LIN-12 is apical. Its level
  is controlled by EGFR-Ras-MAPK-induced endocytosis and degradation (ALX-1, WWP-1) and by SEL-10/FBW7-mediated
  turnover.
