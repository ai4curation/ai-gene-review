  review:
    summary: >-
      IBA for Notch binding from PANTHER node PTN002371879, whose donors are DSL ligands (e.g. Drosophila
      Delta and Serrate, mouse DLL1, DLL3 and DLL4, rat JAG1).
    action: REMOVE
    reason: >-
      Notch binding is a ligand activity. LIN-12 is itself the Notch receptor and has no DSL domain. The
      IBA arises because PANTHER places LIN-12 in PTHR24049:SF22 alongside the DSL ligand APX-1, so the
      ligand node's function has been propagated onto a receptor. The target is outside the clade that
      plausibly inherited this function, and no LIN-12-LIN-12 or LIN-12-GLP-1 binding evidence exists.
