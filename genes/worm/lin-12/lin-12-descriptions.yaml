- source: Alliance_Imported
  text: The lin-12 gene encodes a member of the Notch/LIN-12/glp-1 transmembrane receptor
    family that affects cell fate specification events during development, notably
    including the anchor cell, secondary vulval precursor cells, and the embryonic
    ABplp lineage; its expression is dynamic, including Z1.ppp and Z4.aaa, ABplaa
    descendants, ABplpa descendants, and the intestinal primordium.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00003001;class=Gene
  source_id: WB:WBGene00003001
- source: Alliance_Automated
  text: Enables RNA polymerase II-specific DNA-binding transcription factor binding
    activity. Involved in several processes, including egg-laying behavior; nematode
    larval development; and positive regulation of mesodermal cell fate specification.
    Located in apical plasma membrane and nucleus. Part of CSL-Notch-Mastermind transcription
    factor complex. Is expressed in several structures, including body wall muscle
    cell from M lineage; gonadal sheath cell; somatic nervous system; vulva; and vulval
    precursor cell. Human ortholog(s) of this gene implicated in several diseases,
    including Alagille syndrome; CADASIL (multiple); Hajdu-Cheney syndrome; adult
    T-cell leukemia/lymphoma; and aortic valve disease 1. Orthologous to several human
    genes including NOTCH4 (notch receptor 4).
