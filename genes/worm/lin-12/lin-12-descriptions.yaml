descriptions:
- source: UniProt
  text: Essential signaling protein which has a major role in many developmental processes;
    involved in cell fate decisions that require cell-cell interactions (PubMed:3000611,
    PubMed:3419531). Probable membrane-bound receptor for putative ligands lag-2,
    apx-1, dsl-1 and osm-11 (PubMed:18036582, PubMed:18700817, PubMed:32053105, PubMed:3419531).
    Upon ligand activation, and releasing from the cell membrane, the lin-12/Notch
    intracellular domain (NICD) forms a transcriptional activator complex with lag-1
    and lag-3 and regulates expression of various genes (PubMed:10830967, PubMed:16197940,
    PubMed:16530045, PubMed:18381292, PubMed:7566091, PubMed:8343960). Required for
    ventral cell fates in the postembryonic mesodermal lineage (M lineage) and in
    uterine precursor cells (PubMed:18036582, PubMed:3419531). Activity in cell fate
    decisions and tumorigenesis is negatively regulated by sel-10 (PubMed:9389650).
    Best known for involvement in cell-fate decisions during development, but also
    plays roles in other events (PubMed:10903169, PubMed:18599512, PubMed:21549604,
    PubMed:27661254). Regulates recovery from the dauer larval state (PubMed:18599512).
    Modulates chemosensory avoidance of octanol and quiescence during molting (PubMed:21549604).
    Promotes basement membrane mobility during tissue remodeling (PubMed:27661254).
    Involved in establishing left-right asymmetry during intestinal organogenesis
    (PubMed:10903169).
