gene_symbol: lov-1
organism: worm
uniprot_id: Q09624
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: 'Required for two aspects of male mating behavior: response to hermaphrodite
    contact and vulva location. Acts in the same pathway as pkd-2 and atp-2 in response
    behavior. May be required for ciliary targeting of pkd-2.'
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q09624
  source_id: Q09624
- source: Alliance_Imported
  text: 'lov-1 encodes a transmembrane protein orthologous to human PKD1; lov-1 is
    required for two aspects of male mating behavior: response to hermaphrodite contact
    and vulva location and acts with PKD-2, a TRPP cation channel; LOV-1 is expressed
    in three types of male-specific neurons and localizes to the cell bodies and cilia;
    EGL-44 and EGL-46 regulate cell-specific expression of lov-1 and pkd-2 to specify
    the behavioral function of the HOB hook sensillum neuron; in vitro, LOV-1 interacts,
    via its conserved PLAT domain, with the N-terminus of ATP-2, the beta subunit
    of ATP synthase that also localizes to cilia, suggesting that ATP synthase may
    play a role in C. elegans polycystin signaling.'
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00003058;class=Gene
  source_id: WB:WBGene00003058
- source: Alliance_Automated
  text: Enables protein domain specific binding activity. Involved in response to
    hermaphrodite contact and vulval location. Located in neuronal cell body and non-motile
    cilium. Is expressed in CEM and in male. Used to study autosomal dominant polycystic
    kidney disease. Orthologous to human PKD1L3 (polycystin 1 like 3, transient receptor
    potential channel interacting).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00003058;class=Gene
  source_id: WB:WBGene00003058
