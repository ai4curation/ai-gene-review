gene_symbol: znfx-1
organism: worm
uniprot_id: E9P860
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Epigenetic inheritance factor which, in association with the Argonaute protein
    wago-4, mediates small RNA-directed transgenerational epigenetic inheritance and
    thus balances the transgenerational inheritance of epigenetic information (PubMed:29769721,
    PubMed:29775580). Specifically, maintains a balanced production of small RNAs
    by preventing the spread of epigenetic signals towards the 5'-end of target mRNAs
    (PubMed:29775580). Plays a role in small RNA- induced gene silencing in the germline
    (PubMed:29775580).
  source_type: curated
  url: https://www.uniprot.org/uniprot/E9P860
  source_id: E9P860
- source: Alliance_Automated
  text: Predicted to enable RNA binding activity. Predicted to be involved in regulatory
    ncRNA-mediated heterochromatin formation. Located in cytoplasm. Is expressed in
    several structures, including Psub1; Psub2; Psub3; Psub4; and germ line. Human
    ortholog(s) of this gene implicated in immunodeficiency 91. Orthologous to human
    ZNFX1 (zinc finger NFX1-type containing 1).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00014208;class=Gene
  source_id: WB:WBGene00014208
- source: RefSeq
  text: Predicted to enable RNA binding activity. Predicted to be involved in regulatory
    ncRNA-mediated heterochromatin formation. Predicted to be located in chromosome;
    nucleus; and perinuclear region of cytoplasm. Predicted to be part of nuclear
    RNA-directed RNA polymerase complex. Is expressed in several structures, including
    Psub1; Psub2; Psub3; Psub4; and germ line. Human ortholog(s) of this gene implicated
    in immunodeficiency 91. Orthologous to human ZNFX1 (zinc finger NFX1-type containing
    1). [provided by Alliance of Genome Resources, Jun 2026]
  source_type: automated
