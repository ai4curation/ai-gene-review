core_functions:
- description: HAF-1 is an inner mitochondrial membrane ABC half-transporter. It exports ClpP-generated
    peptides from the matrix and is required to signal the mitochondrial unfolded protein response, letting
    ATFS-1 reach the nucleus under mitochondrial protein-folding stress.
  molecular_function:
    id: GO:0015440
    label: ABC-type peptide transporter activity
