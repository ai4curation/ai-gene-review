- term:
    id: GO:0030150
    label: protein import into mitochondrial matrix
  evidence_type: IMP
  original_reference_id: PMID:22700657
  qualifier: involved_in
  review:
    summary: Protein import into mitochondrial matrix, IMP from Nargund et al. 2012. The study found that
      during stress, mitochondrial import of ATFS-1 and of an MTS-GFP reporter is reduced, and that this
      reduction is not seen in haf-1 mutants.
    action: MARK_AS_OVER_ANNOTATED
    reason: HAF-1 is not part of the import machinery (TOM/TIM23/PAM). The full text (PMC3518298) concludes
      that HAF-1 is a general attenuator of mitochondrial protein import during stress, so in haf-1 mutants
      more ATFS-1 is imported. HAF-1 therefore affects import indirectly, probably through peptide efflux,
      and the participation term overstates its role. GO currently has no live term for negative regulation
      of mitochondrial protein import (GO:1903215 negative regulation of protein targeting to mitochondrion
      is obsolete).
    supported_by:
    - reference_id: PMID:22700657
      supporting_text: during mitochondrial stress, we found that import efficiency was reduced, allowing
        a percentage of ATFS-1 to accumulate in the cytosol and traffic to the nucleus.
