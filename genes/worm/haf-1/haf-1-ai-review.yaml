id: O45278
gene_symbol: haf-1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: HAF-1 (C30H6.6) is a mitochondrial half-type ATP-binding cassette (ABC) transporter of the
  ABCB subfamily, related to yeast Mdl1 and mammalian ABCB10. It has an N-terminal mitochondrial targeting
  sequence, a transmembrane domain and one nucleotide-binding domain, and probably works as a homodimer
  in the mitochondrial inner membrane with its ATP-binding cassette facing the matrix. HAF-1 is needed
  for the ATP-dependent efflux of peptides, made by ClpP (CLPP-1)-mediated breakdown of matrix proteins,
  from isolated stressed mitochondria. It is required to signal the mitochondrial unfolded protein response
  (UPRmt) under moderate mitochondrial protein-folding stress, including stress-induced nuclear accumulation
  of the bZIP transcription factor ATFS-1 and induction of the mitochondrial chaperone genes hsp-60 and
  hsp-6. HAF-1 is thought to act by dampening mitochondrial protein import during stress, so that ATFS-1
  escapes import and degradation in the matrix and reaches the nucleus. haf-1 mutants grow almost normally
  but are more sensitive to mitochondrial protein-folding stress and heat.
