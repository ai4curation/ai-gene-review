      the protease ClpP.
  - reference_id: PMID:20188671
    supporting_text: Defective UPR(mt) signaling in the haf-1-deleted worms was associated with failure
      of the bZIP protein, ZC376.7, to localize to nuclei in worms with perturbed mitochondrial protein
      folding
suggested_questions:
- question: Does purified HAF-1 transport peptides directly in proteoliposomes, and does it have other
    substrates such as heme, as proposed for the homolog ABCB10?
- question: How does HAF-1-dependent peptide efflux dampen mitochondrial protein import? Is there a cytosolic
    peptide sensor, or is the effect on TIM23/membrane potential direct?
- question: Should GO have a live term for negative regulation of protein import into the mitochondrial
    matrix, to capture regulators such as HAF-1?
suggested_experiments:
- description: Reconstitute purified HAF-1 (wild type and a Walker-A mutant) in proteoliposomes loaded
    with ClpP-digest peptides and measure ATP-dependent peptide transport and ATPase activity.
- description: Peptidomics of material exported from wild-type, haf-1 and clpp-1 mitochondria under stress,
    combined with in organello import assays of ATFS-1, to test whether the exported peptides themselves
    reduce import.
