  source_id: WB:WBGene00001811
- source: Alliance_Automated
  text: Enables peptide transmembrane transporter activity. Involved in mitochondrial
    unfolded protein response; peptide transport; and protein import into mitochondrial
    matrix. Located in mitochondrial inner membrane. Orthologous to human ABCB10 (ATP
    binding cassette subfamily B member 10).
