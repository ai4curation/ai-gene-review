descriptions:
- source: Alliance_Imported
  text: haf-1 encodes a transmembrane protein that is a member of the ATP-binding
    cassette (ABC) transporter superfamily; HAF-1 transporter activity is required
    for peptide transport and functions as part of the mitochondrial unfolded protein
    response (UPRmt) signaling pathway; as part of the UPRmt, HAF-1 functions upstream
    of the ATFS-1 bZip transcription factor that partitions between the mitochondrion,
    where it is degraded under normal conditions, and the nucleus, where it localizes
    in response to the UPRmt; HAF-1 localizes to the the inner mitochondrial membrane.
  source_type: curated
