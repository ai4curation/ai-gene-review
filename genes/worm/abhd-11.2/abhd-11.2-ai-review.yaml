- id: PMID:27544863
  title: Chemoproteomic, biochemical and pharmacological approaches in the discovery
    of inhibitors targeting human α/β-hydrolase domain containing 11 (ABHD11).
  findings:
  - statement: Human ABHD11 lacks mono- or diacylglycerol lipase activity and hydrolyzes short-chain carboxylic esters such as p-nitrophenyl butyrate.
    supporting_text: >-
      Our fluorescent activity assays designed for natural lipase substrates
      revealed no activity of hABHD11 towards mono- or diacylglycerols.
  - statement: Human ABHD11 exhibits carboxylic-ester hydrolase activity toward p-nitrophenyl butyrate.
    supporting_text: >-
      Instead, hABHD11 readily utilized para-nitrophenyl butyrate (pNPC4),
      indicating lipase/esterase-type activity that could be exploited in
      inhibitor discovery.
