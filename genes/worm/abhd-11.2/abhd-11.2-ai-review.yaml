suggested_questions:
- question: >-
    Do Caenorhabditis elegans abhd-11.2 and abhd-11.1 act redundantly or in
    distinct tissues to maintain mitochondrial dlst-1 lipoylation and
    2-oxoglutarate metabolism?
suggested_experiments:
- hypothesis: >-
    Single and double abhd-11.2; abhd-11.1 loss-of-function mutants in C.
    elegans accumulate glutaryl-lipoyl adducts on mitochondrial DLST-1 and
    display elevated 2-oxoglutarate levels.
  description: >-
    Generate single and double CRISPR/Cas9 knockouts of abhd-11.2 and abhd-11.1
    in C. elegans, determine sub-mitochondrial localization using endogenous
    GFP knock-in alleles, and assay mitochondrial lipoylation by anti-lipoate
    immunoblotting and LC-MS metabolomics.
  experiment_type: CRISPR/Cas9 double-mutant genetics, live imaging, and mitochondrial lipoylation profiling
