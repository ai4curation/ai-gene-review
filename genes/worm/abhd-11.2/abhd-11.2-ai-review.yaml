  review:
    summary: Sound PAINT IBA from Unikont node PTN000106239; retained at root mitochondrion because uncharacterized O45707 lacks two independent lines of matrix sub-compartment evidence.
    action: ACCEPT
    reason: >-
      PAINT node PANTHER:PTN000106239 (Unikonts, excluding bacterial YbfF)
      soundly transfers GO:0005739 from experimentally verified mouse Abhd11
      (PMID:18614015), human ABHD11 (PMID:32792488), and yeast Imo32
      (PMID:21525245). Per projects/ORGANELLES.md, localization stays at root
      GO:0005739 without adding GO:0005759 because uncharacterized C. elegans
      O45707 lacks two independent lines of mitochondrial matrix evidence (no
      mapped transit-peptide cleavage and no sub-organelle or matrix complex
      assay).
