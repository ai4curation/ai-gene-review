  review:
    summary: Over-propagated PAINT IBA from single-seed yeast IMO32 overexpression lipid shifts; endogenous pathway of C. elegans abhd-11.2 is uncharacterized.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Propagated from Eukaryota node PANTHER:PTN002919262 solely from high-copy
      overexpression triacylglycerol changes of yeast IMO32 (PMID:28465236),
      whereas metazoan ABHD11 lacks mono- or diacylglycerol lipase activity
      (PMID:27544863) and acts on lipoylated OGDHc in mammals (PMID:32792488),
      and abhd-11.2 has not been experimentally assayed in C. elegans.
    supported_by:
    - reference_id: PMID:27544863
      supporting_text: >-
        Our fluorescent activity assays designed for natural lipase substrates
        revealed no activity of hABHD11 towards mono- or diacylglycerols.
