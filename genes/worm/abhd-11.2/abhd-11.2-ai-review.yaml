knowledge_gaps:
- gap_statement: >-
    Endogenous biological process, sub-mitochondrial localization, and
    functional relationship between the duplicated Caenorhabditis paralogs
    abhd-11.2 (PTHR46118:SF4) and abhd-11.1 (PTHR46118:SF3) are unknown.
  boundary: >-
    Determine whether abhd-11.2, abhd-11.1, or both protect C. elegans
    mitochondrial 2-oxoglutarate dehydrogenase complex (dlst-1) lipoylation.
  gap_kind:
  - BIOLOGY
