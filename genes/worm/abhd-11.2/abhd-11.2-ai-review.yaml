  label: Caenorhabditis elegans
description: >-
  abhd-11.2 (R05D7.4) is a 299-residue Caenorhabditis elegans mitochondrial
  alpha/beta-hydrolase of the ABHD11 family (PTHR46118:SF4) and one of two
  nematode paralogs alongside abhd-11.1 (PTHR46118:SF3). It conserves the
  canonical oxyanion-hole loop (52-HGLFG-56) and complete Ser124-Asp150-His279
  charge-relay catalytic triad supporting carboxylic-ester hydrolase activity,
  while its endogenous mitochondrial substrate and potential division of labor
  with abhd-11.1 in C. elegans remain experimentally uncharacterized.
