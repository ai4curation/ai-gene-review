- source: Alliance_Imported
  text: 'alx-1 encodes one of two C. elegans Bro1 domain-containing proteins; during
    development, ALX-1 functions in the regulation of protein trafficking via endocytic
    recycling of clathrin-independent cargo and membrane-protein degradation; ALX-1
    physically interacts with RME-1, a component of recycling endosomes that regulates
    endocytic recycling of receptor proteins, and LIN-12/Notch whose downregulation,
    but not internalization, in primary vulval precursor cells requires ALX-1; alx-1
    interacts genetically with ego-2, which encodes the second C. elegans Bro1 domain-containing
    protein, in a manner that suggests ALX-1 and EGO-2 function both agonistically
    and antagostically to regulate specific developmental processes; an ALX-1::GFP
    fusion protein is expressed ubiquitously at high levels and localizes to two types
    of endocytic organelles: the HGRS-1-positive multivesicular endosome and the RME-1-positive
    recycling endosome.'
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00007010;class=Gene
  source_id: WB:WBGene00007010
