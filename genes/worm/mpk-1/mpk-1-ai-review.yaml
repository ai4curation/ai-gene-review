    label: MAPK cascade
  evidence_type: IMP
  original_reference_id: PMID:15268855
  qualifier: involved_in
  review:
    summary: MPK-1 is the terminal ERK kinase in a conserved C. elegans MAPK cascade.
    action: ACCEPT
    reason: MPK-1 is the C. elegans ERK/MAP kinase downstream of LIN-45/Raf and
      MEK-2/MEK. The M. nematophilum infection study directly supports an ERK/MAPK
      cascade mediated by MPK-1, and independent LIN-45 genetics place MPK-1 in
      a predominantly linear Raf-MEK-ERK cascade, so this is a core pathway
      annotation.
    additional_reference_ids:
    - PMID:11861555
    supported_by:
    - reference_id: PMID:15268855
      supporting_text: extracellular signal-regulated kinase (ERK) mitogen-activated
        protein (MAP) kinase cascade mediates tail swelling
    - reference_id: PMID:11861555
      supporting_text: LIN-45, MEK-2, and MPK-1 ERK MAP kinase function in a predominantly
        linear signaling pathway
- term:
    id: GO:0001556
    label: oocyte maturation
  evidence_type: IMP
  original_reference_id: PMID:18073423
  qualifier: involved_in
  review:
    summary: MPK-1 promotes oocyte meiotic maturation and ovulation in the hermaphrodite
      germline.
    action: KEEP_AS_NON_CORE
    reason: The Genetics germline study describes dynamic MPK-1 ERK activation and
      a role in oocyte meiotic maturation/ovulation, so the annotation is well supported.
      Oocyte maturation is a germline developmental output of MPK-1 signaling rather
      than the reusable kinase activity itself.
    supported_by:
    - reference_id: PMID:18073423
      supporting_text: 'MPK-1 functions in four developmental switches: progression
        through pachytene, oocyte meiotic maturation/ovulation'
