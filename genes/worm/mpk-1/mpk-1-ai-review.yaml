id: P39745
gene_symbol: mpk-1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: MPK-1 is the C. elegans ERK/MAP kinase in the conserved Ras-Raf-MEK-ERK
  cassette. It phosphorylates protein substrates after activation by upstream MAPKK
  signaling and acts from cytoplasmic and nuclear compartments to transduce receptor-
  and stress-associated inputs into vulval induction, germline and oocyte patterning,
  proteostasis, longevity, and epithelial responses to Gram-positive bacterial infection.
