descriptions:
- source: UniProt
  text: 'Functions in let-60 Ras signaling pathway; acts downstream of lin-45 raf
    kinase, but before the lin-1 gene product in controlling vulval cell differentiation
    (PubMed:8299935, PubMed:8299936). Plays a negative role in proximal germline proliferation
    in the mitotic zone (PubMed:16319922). Required for progression of developing
    oocytes through the pachytene stage, perhaps acting after efl-1/dpl-1-mediated
    gene activation and before gld-1 down-regulation (PubMed:16319922, PubMed:17096596,
    PubMed:19826475, PubMed:21901106). May play a role in global X chromosome reactivation
    or be indirectly required for progression of germ cells through meiosis to the
    point where X reactivation occurs (PubMed:17096596). In oocytes, inhibits the
    activity of the chloride channel clh-3, likely by activating gck-3 (PubMed:21160027).
    Plays a role in response to M.nematophilum-mediated bacterial infection by promoting
    tail swelling and preventing constipation (PubMed:15268855). Involved in fluid
    homeostasis (PubMed:11689700). In addition, involved in the up-regulation of lysozyme
    ilys-3 expression in the intestine in responses to M.nematophilum-mediated bacterial
    infection (PubMed:27525822). By phosphorylating transcription factor skn-1 (isoform
    c) may play a role in increasing life span downstream of lin-45, let-60 and mek-2
    (PubMed:20624915). By up-regulating cep-1 and down-regulating gld-1 expression
    in the late pachytene stage, plays a role in germline apoptosis in response to
    DNA damage (PubMed:21901106). Regulates egl-1 expression in response to DNA damage,
    probably upstream of cep-1 (PubMed:21901106). . [Isoform b]: Suppresses germline
    tumor formation by preventing the dedifferentiation of secondary spermatocytes
    probably upstream of rskn-1.'
