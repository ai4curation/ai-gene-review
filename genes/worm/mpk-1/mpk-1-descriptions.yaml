- source: Alliance_Automated
  text: Enables protein serine kinase activity and protein serine/threonine kinase
    activity. Involved in several processes, including intracellular signaling cassette;
    oocyte maturation; and positive regulation of proteasomal ubiquitin-dependent
    protein catabolic process. Located in cytoplasm and nucleus. Is expressed in several
    structures, including germ line; nervous system; oocyte; pharyngeal-intestinal
    valve; and rectal epithelium. Used to study cancer. Human ortholog(s) of this
    gene implicated in several diseases, including Noonan syndrome 13; Parkinson's
    disease; carcinoma (multiple); endometrial disease; and pulmonary hypertension.
    Orthologous to several human genes including MAPK1 (mitogen-activated protein
    kinase 1).
