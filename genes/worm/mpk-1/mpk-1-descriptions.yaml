- source: Alliance_Imported
  text: mpk-1 encodes a mitogen-activated protein (MAP) kinase an ERK ortholog functioning
    in vulval cell fate specification, cell migration/guidance, defense against bacterial
    infection, and other processes; in proximal germline, sperm-dependent physiological
    MPK-1 activation results in phosphorylation based inactivation of NOS-3, FEM-CUL-2-mediated
    degradation of TRA-1 and the promotion of membrane organization during oogenesis;
    mpk-1 affect LET-60(Ras)-mediated induction of vulval cell fates, larval viability,
    morphology of the male spicules; both LIN-1 and LIN-31 act genetically downstream
    of mpk-1 with respect to vulval induction; MPK-1 is necessary for pachytene cell
    organization; mpk-1 mutants display germ cells arrested in pachytene; MPK-1 is
    necessary for the progression from distal to proximal pachytene; MPK-1 promotes
    pachytene progression, with the rise in dpMPK-1 triggering a transition from a
    distal pachytene to a proximal pachytene subtype; MPK-1 functions in the germline
    for meiotic prophase progression and gametogenesis; MPK-1 ERK signaling is necessary
    for the male germ cell fate; MPK-1 ERK has the nonessential function of promoting
    the proliferative germ cell fate; mpk-1 acts in combination with mek-2 to permit
    germ cell exit from the pachytene stage of first meiotic prophase; MPK-1 activation
    is temporally/spatially dynamic compared to relatively constant levels of total
    MPK-1.
