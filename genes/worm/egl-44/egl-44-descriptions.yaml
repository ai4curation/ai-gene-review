- source: Alliance_Automated
  text: Enables RNA polymerase II cis-regulatory region sequence-specific DNA binding activity;
    RNA polymerase II-specific DNA-binding transcription factor binding activity; and transcription
    coactivator binding activity. Involved in several processes, including generation of neurons;
    positive regulation of exit from mitosis; and regulation of transcription by RNA polymerase
    II. Located in nucleus. Part of RNA polymerase II transcription regulator complex. Is
    expressed in several structures, including anterior hypodermis; body wall musculature;
    ganglia; neurons; and pharynx. Human ortholog(s) of this gene implicated in Sveinsson
    chorioretinal atrophy. Orthologous to several human genes including TEAD2 (TEA domain
    transcription factor 2) and TEAD4 (TEA domain transcription factor 4).
