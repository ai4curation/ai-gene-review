- source: Alliance_Imported
  text: egl-44 encodes a transcription enhancer factor of the TEA domain (TEAD) class; egl-44
    activity is required to repress the touch cell fate in some cells and to promote aspects
    of HSN differentiation; EGL-44 physically interacts with YAP-1, a C. elegans Yes-associated
    protein (YAP) homolog, and when co-expressed, the two proteins are able to activate a
    TEAD reporter; an EGL-44::GFP fusion protein is expressed in nuclei of various cells including
    the hypodermis, pharynx, intestine, and neurons including the FLP and HSN neurons; in
    the FLP neurons, EGL-44 positively regulates expression of EGL-46, a zinc-finger transcription
    factor also required for regulating neuronal differentiation.
