findings:
- category: gap
  text: Neither WormBase nor UniProt FUNCTION describes EGL-44 as the YAP-1-coactivated effector
    restrained by WTS-1, which drives the intestinal polarity defect and L2 arrest of wts-1
    mutants (PMID:31358532, PMID:41746831) and intestinal immune gene induction (PMID:32857822).
    Recorded as MISSING_STATEMENT defects on both.
  sources:
  - Alliance_Imported
  - UniProt
- category: gap
  text: WormBase presents EGL-46 only as a target of EGL-44 in FLP. The two bind directly
    and act as one DNA-binding repressor complex (PMID:23946438, PMID:30291162), and the pair
    also acts in the Q lineage, HOB and PVD.
  sources:
  - Alliance_Imported
- category: discrepancy
  text: The automated text lists positive regulation of exit from mitosis; the Q-lineage defect
    is an extra division after the terminal one, and the review modifies the row to negative
    regulation of neuroblast proliferation.
  sources:
  - Alliance_Automated
  - RefSeq
- category: insight
  text: UniProt SUBUNIT maps the YAP-1 interaction to the YAP-1 WW domain, whereas YAP-family
    proteins bind TEAD through the N-terminal TEAD-binding domain that YAP-1 also has; recorded
    as an open question in the review.
  sources:
  - UniProt
review:
  reviewer: AI
  rubrics:
  - rubric: overall_concordance
    score: 4
  overall_notes: All sources agree that EGL-44 is a TEAD transcription factor in neuron differentiation.
    UniProt is the fullest; WormBase is correct but thin; the automated texts omit both the
    touch-fate switch and the YAP-1 role. None describes the Hippo-pathway function.
