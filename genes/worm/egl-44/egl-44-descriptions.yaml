descriptions:
- source: UniProt
  text: Transcription factor (PubMed:30291162). Binds to DNA sequence motif 5'-CATNNNNAAATGCAT-3'
    as a heterodimer with egl-46 (PubMed:30291162). Represses expression of genes involved
    in differentiation of touch receptor neurons (TRN), probably acting as a heterodimer with
    egl-46, perhaps by occupying similar cis-regulatory elements as an unc-86/mec-3 heterodimer
    (PubMed:30291162). Plays a role in cell fate specification of neurons, including the hook
    neuron HOB, and touch receptor neurons (PubMed:12954713, PubMed:30291162). Involved in
    male mating behavior, acting in concert with egl-46, via modulation of expression of polycystins
    lov-1 and pkd-2, homeodomain protein ceh- 26, and neuropeptide-like protein nlp-8 (PubMed:12954713).
    Acts upstream of egl-46 to prevent touch cell differentiation in FLP neurons (PubMed:11274062).
    Plays a role in neuron differentiation by repressing the expression of zag-1 in FLP neurons,
    probably acting as a heterodimer with egl-46; because zag-1 represses expression of egl-46
    and egl-44, together these proteins form a bistable, negative-feedback loop that regulates
    the choice between neuronal fates (PubMed:30291162). Also promotes HSN neuron development
    (PubMed:11274062). In association with egl-46, regulates cell cycle exit in the neuronal
    Q cell lineage (PubMed:23946438). Plays a role in specifying commissural dendrites of
    the PVD nociceptive neurons, acting in concert with egl-46 (PubMed:29031632). May be involved
    in thermal stress response downstream of yap-1 (PubMed:23396260).
