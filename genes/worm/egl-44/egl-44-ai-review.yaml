- id: PMID:11274062
  title: Inhibition of touch cell fate by egl-44 and egl-46 in C. elegans.
  findings:
  - statement: In egl-44 and egl-46 mutants the FLP neurons express touch receptor features; egl-44 encodes
      a TEF-family protein, is nuclear, and is needed for egl-46 expression in FLP but not HSN; ectopic
      EGL-44 in touch cells blocks their differentiation in an egl-46-dependent way.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only in cache (PMC312646 is not open access). The abstract supports the FLP
      touch-fate repression, HSN role, TEF identity, nuclear GFP and egl-44-dependent egl-46 expression
      in FLP that underlie the IMP, IGI, ISS and IDA rows.
- id: PMID:12954713
  title: Distinct roles of transcription factors EGL-46 and DAF-19 in specifying the functionality of
    a polycystin-expressing sensory neuron necessary for C. elegans male vulva location behavior.
  findings:
  - statement: lov-1 and pkd-2 expression in the male HOB neuron and vulva location behaviour require
      EGL-46 and, to a lesser extent, EGL-44.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only. The EGL-44 contribution is partial ("to some extent"), with the partial
      allele n1080.
- id: PMID:23396260
  title: Yes-associated protein homolog, YAP-1, is involved in the thermotolerance and aging in the nematode
    Caenorhabditis elegans.
  findings:
  - statement: Identifies F13E6.4 as yap-1, with a YAP-like N-terminal TEAD-binding domain and a WW domain;
      YAP-1 localisation is regulated by WTS-1 and FTT-2 and by heat shock.
  reference_review:
    relevance: MEDIUM
    correctness: UNVERIFIED
    review_notes: Abstract-only; the abstract does not mention EGL-44. The YAP-1 binding (IPI rows) and
      TEAD-reporter activation (IGI row) come from the full text, which could not be read here. The YAP-1
      binding is restated by a later paper (PMID:31358532). Whether egl-44 was tested in thermotolerance,
      as UniProt's FUNCTION sentence implies, could not be checked.
  full_text_unavailable: true
- id: PMID:23946438
  title: Developmental stage-dependent transcriptional regulatory pathways control neuroblast lineage
    progression.
  findings:
  - statement: EGL-44 binds EGL-46 directly and the pair is needed for cell-cycle exit after the terminal
      division in the Q neuroblast lineage; HAM-1, not EGL-44, controls the asymmetric division.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only in cache; the Development full text was read through a summarising web-fetch
      tool, which reported an extra round of division of QR.ap in egl-44 mutants (both daughters become
      A/PQR-like neurons) and yeast two-hybrid plus GST pull-down mapping of the EGL-44 TEA-domain fragment
      to the EGL-46 zinc-finger fragment.
- id: PMID:29031632
  title: Separate transcriptionally regulated pathways specify distinct classes of sister dendrites in
    a nociceptive neuron.
  findings:
  - statement: EGL-44 and EGL-46 act in one pathway to promote commissural 2-degree dendrites of PVD,
      and with MEC-3 redundantly maintain expression of PVD markers.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text cached.
- id: PMID:30291162
  title: Inhibition of cell fate repressors secures the differentiation of the touch receptor neurons
    of Caenorhabditis elegans.
  findings:
  - statement: EGL-44/EGL-46 is a repressor complex that prevents TRN gene expression in FLP and represses
      zag-1; ZAG-1 represses egl-44 and egl-46, forming a bistable loop.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only in cache (PMC6262790 not open access). The PMC full text was read through
      a summarising web-fetch tool, which reported EMSA binding of EGL-44 and of the EGL-44/EGL-46 complex
      to sites beside UNC-86/MEC-3 motifs in mec-4 and mec-18 promoters, loss of binding when one adenine
      is changed, partial de-repression of a mec-18 reporter carrying a binding-site mutation in FLP,
      and de-repression of alr-1 in FLP of egl-44 and egl-46 mutants. These details are not quoted because
      the cached copy lacks them.
- id: PMID:31358532
  title: The Hippo Pathway Is Essential for Maintenance of Apicobasal Polarity in the Growing Intestine
    of Caenorhabditis elegans.
  findings:
  - statement: yap-1 and egl-44 alleles suppress the intestinal polarity defects and larval death of wts-1
      mutants; NFM-1-WTS-1-YAP-1-EGL-44 form a Hippo pathway; tat-2 is a candidate target.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached.
- id: PMID:32857822
  title: YAP in epithelium senses gut barrier loss to deploy defenses against pathogens.
  findings:
  - statement: YAP-1/EGL-44 are activated by gut barrier disruption during P. aeruginosa infection, induce
      TEAD-site-containing immune genes, and are needed for survival; activation is Hippo-independent
      and needs PP2A.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached. Target regulation is inferred from TEAD-site enrichment and mutant
      expression changes, not from direct binding assays.
- id: PMID:41746831
  title: Canonical and noncanonical Hippo signaling in C. elegans.
  findings:
  - statement: WTS-1 represses YAP-1 and EGL-44 to allow larval progression past L2; intestinal WTS-1
      is the essential pool.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text cached.
- id: PMID:40178516
  title: Neuroprotective role of Hippo signaling by microtubule stability control in Caenorhabditis elegans.
  findings:
  - statement: Loss of yap-1 or egl-44 suppresses the premature touch-neuron deformation of wts-1 mutants.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Full text cached. Tissue-specific rescue was done for YAP-1 only; egl-44 is not expressed
      in wild-type touch cells (PMID:11274062), so the site of EGL-44 action is open.
- id: PMID:40898783
  title: CDH-3/cadherin, YAP-1/YAP, and EGL-44/TEAD promote SYX-2/syntaxin and EFF-1 fusogen-mediated
    phagosome closure.
  findings:
  - statement: YAP-1 and EGL-44 act downstream of CDH-3 to localise SYX-2 around the dying tail-spike
      cell remnant and promote phagosome sealing.
  reference_review:
    relevance: LOW
    correctness: UNVERIFIED
    review_notes: Abstract-only; not checked beyond the abstract.
  full_text_unavailable: true
- id: PMID:22087002
  title: Shared gene expression in distinct neurons expressing common selector genes.
  findings:
  - statement: FLP neurons transcribe some TRN genes at low level without making the proteins; loss of
      EGL-44/EGL-46 or ectopic ALR-1 lets FLP acquire TRN traits.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only.
- id: PMID:8187641
  title: Combinatorial control of touch receptor neuron expression in Caenorhabditis elegans.
  findings:
  - statement: egl-44 mutations increase the number of touch receptor-like cells.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only. First report of the egl-44 touch-cell phenotype.
- id: PMID:37281420
  title: Genetic regulation of mec-3 gene expression implicated in the specification of the mechanosensory
    neuron cell types in Caenorhabditis elegans.
  findings:
  - statement: mec-3-lacZ expression is unchanged in egl-44 and egl-46 mutants.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Abstract-only. Consistent with EGL-44/EGL-46 acting on TRN effector genes rather than
      on mec-3 itself.
- id: file:worm/egl-44/egl-44-deep-research-wormbase.md
  title: WormBase gene description for egl-44 (worm)
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: UNVERIFIED
    review_notes: WormBase curated description (uncited, undated). Checked claims - TEAD class, touch
      fate repression in some cells (FLP; PMID:11274062, PMID:8187641), promotion of HSN differentiation
      (PMID:11274062), physical interaction with YAP-1 (PMID:31358532 restating PMID:23396260), nuclear
      EGL-44::GFP in hypodermis, pharynx, intestine, FLP and HSN (PMID:11274062; UniProt TISSUE SPECIFICITY),
      and egl-44-dependent egl-46 expression in FLP (PMID:11274062) - are all correct. Not traced - YAP-1
      plus EGL-44 activating a TEAD reporter is attributed to PMID:23396260, whose cached abstract does
      not describe it (a WormBase IGI row from that paper is consistent with it). The text omits the direct
      EGL-46 complex as a DNA-binding repressor and the ZAG-1 loop, the Q-lineage, HOB and PVD roles,
      and the WTS-1/YAP-1/EGL-44 roles in intestinal polarity, larval progression and immunity.
    source_defects:
    - defect_type: MISSING_STATEMENT
      resource: WORMBASE
      record: WB:WBGene00001208
      slot: MOD_provided_gene_description
      requested_change: ADD
      asserted_value: WB:WBGene00001208
      confidence: CONFIRMED
      explanation: The description mentions YAP-1 binding only as an in vitro reporter result and says
        nothing of EGL-44's in vivo role as the YAP-1-coactivated effector of WTS-1/LATS. yap-1 and egl-44
        mutations suppress the intestinal apicobasal polarity defect and larval lethality of wts-1 mutants
        (PMID:31358532), WTS-1 represses YAP-1 and EGL-44 to allow larval development past L2 (PMID:41746831),
        and YAP-1/EGL-44 is needed for intestinal immune gene induction and survival during P. aeruginosa
        infection (PMID:32857822). A sentence on these roles should be added.
      supported_by:
      - reference_id: PMID:31358532
        supporting_text: These data suggest that induction of polarity defects and eventual death in wts-1
          mutants requires both YAP-1 and EGL-44.
      - reference_id: PMID:41746831
        supporting_text: WTS-1, YAP-1, and the TEAD-like transcription factor EGL-44 form a conserved
          core module required for larval development past the L2 stage.
      - reference_id: PMID:32857822
        supporting_text: Genetic inactivation of yap-1 and egl-44 significantly reduced the survival rate
          and promoted bacterial accumulation in worms after bacterial infections.
    - defect_type: MISSING_STATEMENT
      resource: WORMBASE
      record: WB:WBGene00001208
      slot: MOD_provided_gene_description
      requested_change: ADD
      asserted_value: WB:WBGene00001208
      confidence: CONFIRMED
      explanation: The description treats EGL-46 only as a downstream target of EGL-44 in FLP. EGL-44
        binds EGL-46 directly and the two act as a repressor complex that keeps touch-receptor genes off
        in FLP and represses zag-1, forming a bistable loop with ZAG-1 (PMID:30291162); the same pair
        instructs cell-cycle exit in the Q neuroblast lineage (PMID:23946438) and promotes PVD commissural
        dendrites (PMID:29031632). The complex and these roles should be described.
      supported_by:
      - reference_id: PMID:30291162
        supporting_text: The FLP neurons fail to activate TRN genes, however, because a complex of two
          transcriptional repressors (EGL-44/EGL-46) prevents their expression.
      - reference_id: PMID:23946438
        supporting_text: The TEAD TF EGL-44, in a physical association with the zinc-finger TF EGL-46,
          instructs cell cycle exit after the terminal division.
