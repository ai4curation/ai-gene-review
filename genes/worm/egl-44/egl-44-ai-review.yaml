- id: file:worm/egl-44/egl-44-notes.md
  title: Review notes for C. elegans egl-44 (manual literature search)
  findings: []
core_functions:
- description: With its direct partner EGL-46, EGL-44 forms a sequence-specific DNA-binding transcriptional
    repressor complex in neurons. In the FLP neurons it keeps touch-receptor genes off, binding sites next to the UNC-86/MEC-3 selector motifs in their promoters in vitro, and it represses zag-1, so locking in
    the FLP rather than the touch-receptor fate. The same complex acts in HSN, Q-lineage, HOB and PVD
    differentiation.
  molecular_function:
    id: GO:0000981
    label: DNA-binding transcription factor activity, RNA polymerase II-specific
  directly_involved_in:
  - id: GO:0000122
    label: negative regulation of transcription by RNA polymerase II
  - id: GO:0030182
    label: neuron differentiation
  locations:
  - id: GO:0005634
    label: nucleus
  in_complex:
    id: GO:0090575
    label: RNA polymerase II transcription regulator complex
  supported_by:
  - reference_id: PMID:30291162
    supporting_text: The FLP neurons fail to activate TRN genes, however, because a complex of two transcriptional
      repressors (EGL-44/EGL-46) prevents their expression.
  - reference_id: PMID:11274062
    supporting_text: Moreover, ectopic expression of egl-44 in the touch cells prevents touch cell differentiation
      in an egl-46-dependent manner.
  - reference_id: file:worm/egl-44/egl-44-uniprot.txt
    record_section: ["CC:FUNCTION"]
    supporting_text: Binds to DNA sequence motif 5'-CATNNNNAAATGCAT-3' as a heterodimer with egl-46
- description: EGL-44 binds the transcriptional coactivator YAP-1 and is the DNA-binding effector of a
    WTS-1 (LATS)-restrained YAP-1 module. In the intestine, unrestrained YAP-1/EGL-44 activity disrupts
    apicobasal polarity and arrests larval development, and YAP-1/EGL-44 induces immune genes when pathogens
    breach the gut barrier.
  molecular_function:
    id: GO:0001223
    label: transcription coactivator binding
  directly_involved_in:
  - id: GO:0035329
    label: hippo signaling
  - id: GO:0045944
    label: positive regulation of transcription by RNA polymerase II
  locations:
  - id: GO:0005634
    label: nucleus
  in_complex:
    id: GO:0090575
    label: RNA polymerase II transcription regulator complex
  supported_by:
  - reference_id: PMID:31358532
    supporting_text: In summary, we have delineated the conserved Hippo pathway in C. elegans consisting
      of NFM-1-WTS-1-YAP-1-EGL-44
  - reference_id: PMID:32857822
    supporting_text: we found that the EGL-44/TEAD transcription factor and its transcriptional activator
      YAP-1/YAP (Yes-associated protein) were activated when the intestinal barrier was disrupted by infections
      with the pathogenic bacterium Pseudomonas aeruginosa PA14
suggested_questions:
- question: Does EGL-46 contact DNA within the EGL-44/EGL-46 complex, or is the TEA domain of EGL-44 the
    only DNA-binding surface? Which sequence does the complex recognise at its TRN, zag-1 and alr-1 targets?
- question: EGL-46 binds the N-terminal TEA-domain region of EGL-44 and YAP-1 is expected to bind the
    C-terminal YAP-binding domain. Can EGL-44 bind both at once, and do EGL-46 and YAP-1 compete for EGL-44
    in cells that express all three?
- question: UniProt maps the YAP-1 interaction to the YAP-1 WW domain, whereas YAP-family proteins bind
    TEAD through their N-terminal TEAD-binding domain. Which region of YAP-1 binds EGL-44?
- question: egl-44 is not expressed in wild-type touch receptor neurons, yet loss of egl-44 suppresses
    touch-neuron deformation in wts-1 mutants. Does EGL-44 act in the touch neurons in that background,
    or elsewhere?
- question: Which YAP-1/EGL-44 target genes (for example tat-2 or the TEAD-site immune genes) are bound
    directly by EGL-44 in the intestine?
suggested_experiments:
- description: Profile endogenous tagged EGL-44 binding (CUT&RUN or ChIP-seq) in FLP-enriched cells and
    in intestine, in wild type, egl-46 and yap-1 mutants.
  hypothesis: EGL-44 occupies TRN-gene and zag-1 sites with EGL-46 in neurons and a different set of TEAD
    sites with YAP-1 in the intestine.
  experiment_type: ChIP-seq / CUT&RUN
- description: Test binding of purified EGL-44 to EGL-46 and YAP-1 fragments together, by pull-down or
    size-exclusion, and map the YAP-1 region (TEAD-binding domain versus WW domain) that is needed.
  hypothesis: YAP-1 binds the EGL-44 YAP-binding domain through its TEAD-binding domain and can bind alongside
    EGL-46.
  experiment_type: in vitro binding assay
- description: Degrade EGL-44 (auxin-inducible degron) specifically in touch neurons or intestine of wts-1
    mutants and score touch-neuron deformation and larval arrest.
  hypothesis: The intestinal pool of EGL-44 drives larval arrest, and suppression of touch-neuron deformation
    reflects a non-neuronal or low-level neuronal requirement.
  experiment_type: tissue-specific protein depletion
