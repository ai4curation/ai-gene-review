- term:
    id: GO:0031536
    label: positive regulation of exit from mitosis
  evidence_type: IMP
  original_reference_id: PMID:23946438
  qualifier: involved_in
  review:
    summary: In egl-44 mutants a Q-lineage neuron precursor (QR.ap) divides one extra time and both daughters
      become A/PQR-like neurons. EGL-44 with EGL-46 instructs cell-cycle exit after the terminal division.
    action: MODIFY
    reason: The GO term names the transition from anaphase/telophase to G1 within a mitotic cycle. The
      egl-44 defect is not in completing mitosis but in withdrawing from further cycles, so the precursor
      divides once more. The phenotype is an extra division in a neuroblast lineage, which negative regulation
      of neuroblast proliferation describes. The wording "cell cycle exit" in the paper appears to have
      been mapped by label.
    proposed_replacement_terms:
    - id: GO:0007406
      label: negative regulation of neuroblast proliferation
    supported_by:
    - reference_id: PMID:23946438
      supporting_text: The TEAD TF EGL-44, in a physical association with the zinc-finger TF EGL-46, instructs
        cell cycle exit after the terminal division.
    - reference_id: file:worm/egl-44/egl-44-uniprot.txt
      record_section: ["FT:MUTAGEN"]
      supporting_text: Production of an extra neuron from the Q lineage
    source_defects:
    - defect_type: WRONG_TERM
      resource: UNIPROT
      slot: GO_ID
      requested_change: CHECK
      asserted_value: GO:0031536
      corrected_value: GO:0007406
      corrected_label: negative regulation of neuroblast proliferation
      cause: LABEL_WITHOUT_DEFINITION
      confidence: PROBABLE
      explanation: GO:0031536 positive regulation of exit from mitosis is defined as promoting progression
        from anaphase/telophase to G1. In egl-44 mutants (PMID:23946438) Q-lineage cells complete mitosis
        normally but undergo an extra round of division after the terminal one, producing an extra A/PQR-like
        neuron. The paper's "cell cycle exit" means withdrawal from the cell cycle, which is better captured
        by a proliferation term such as GO:0007406 negative regulation of neuroblast proliferation. The
        same check applies to the egl-46 row from this paper.
