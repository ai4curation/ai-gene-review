id: Q19849
gene_symbol: egl-44
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: EGL-44 is the single TEA-domain (TEAD/Scalloped) transcription factor of C. elegans. It is
  a nuclear protein expressed from early embryogenesis in many neurons (including FLP, HSN, HOB and PVD),
  in the hypodermis, pharynx and intestine, but not in the touch receptor neurons. It works with two different
  partners. With the INSM-family zinc-finger protein EGL-46, which binds the N-terminal TEA-domain region
  of EGL-44 directly, it forms a DNA-binding repressor complex. In the FLP neurons, which share the UNC-86/MEC-3
  selector with the touch receptor neurons, this complex keeps touch-receptor genes off, and in vitro it binds sites next to the UNC-86/MEC-3 motifs in their promoters. It also inhibits production of the touch-fate regulator ZAG-1, while ZAG-1 represses egl-44 and egl-46 in the touch cells, so the two sets of factors
  form a bistable switch between the FLP and touch-receptor fates; in FLP, egl-44 is also needed for egl-46
  expression. The same pair promotes aspects of HSN differentiation, terminal cell-cycle exit of Q-lineage
  neuron precursors, the HOB sensory program needed for male vulva location, and commissural dendrite
  branching of the PVD nociceptor. With the YAP homolog YAP-1 as coactivator, EGL-44 is the transcriptional
  effector of a WTS-1 (LATS)-restrained module. Unrestrained YAP-1/EGL-44 activity in wts-1 mutants disrupts
  intestinal apicobasal polarity and arrests larvae at the L2 stage, and YAP-1/EGL-44 induces intestinal
  immune genes when pathogens breach the gut barrier.
