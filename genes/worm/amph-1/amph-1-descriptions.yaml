descriptions:
- source: Alliance_Automated
  text: Predicted to enable phospholipid binding activity. Involved in lipid tube
    assembly involved in organelle fission; nucleus localization; and nucleus organization.
    Located in nuclear envelope; perinuclear region of cytoplasm; and recycling endosome.
    Is expressed in several structures, including coelomocyte; hypodermis; intestine;
    nervous system; and reproductive system. Human ortholog(s) of this gene implicated
    in breast carcinoma; centronuclear myopathy 2; and prostate adenocarcinoma. Orthologous
    to several human genes including BIN1 (bridging integrator 1).
