  - id: PMID:19915558
    title: AMPH-1/Amphiphysin/Bin1 functions with RME-1/Ehd1 in endocytic recycling.
    findings:
      - statement: AMPH-1 is the sole worm amphiphysin/BIN1, co-localizes with RME-1 on recycling endosomes
          and is required for recycling.
        supporting_text: Here we show that endogenous C. elegans AMPH-1, the only C. elegans member of
          the Amphiphysin/BIN1 family of BAR (Bin1-Amphiphysin-Rvs161p/167p)-domain-containing proteins,
          colocalizes with RME-1 on recycling endosomes in vivo, that amph-1-deletion mutants are defective
          in recycling endosome morphology and function, and that binding of AMPH-1 Asn-Pro-Phe(Asp/Glu)
          sequences to the RME-1 EH-domain promotes the recycling of transmembrane cargo.
      - statement: Specific enrichment on recycling endosomes.
        supporting_text: Anti-AMPH-1 staining failed to colocalize with markers for the clathrin coated
          pits (GFP-tagged CHC-1/clathrin)18, early endosome (GFP-RAB-5)19, late endosome (GFP-RAB-7)19
          or Golgi (Mannosidase-GFP)19, indicating that AMPH-1 is specifically enriched on recycling endosomes
          (Fig.
      - statement: Purified AMPH-1 tubulates PS liposomes.
        supporting_text: In the absence of RME-1, AMPH-1 tubulated 400 nm average diameter PS liposomes
          into 50 nm wide tubules
      - statement: AMPH-1/RME-1 complexes form short coated tubules.
        supporting_text: In vitro, we find that purified recombinant AMPH-1-RME-1 complexes produce short,
          coated membrane tubules that are qualitatively distinct from those produced by either protein
          alone.
      - statement: amph-1 mutants have a basolateral recycling defect like rme-1.
        supporting_text: These results indicate a defect in basolateral recycling in the intestinal epithelia
          of amph-1 mutants, very similar to that found in rme-1 mutants.
      - statement: AMPH-1 recruits RME-1 to the recycling endosome.
        supporting_text: The loss of RME-1 from recycling endosomes confirmed the amph-1(RNAi) results
          from the initial screen, suggesting that AMPH-1 functions, at least in part, to recruit RME-1
          to the recycling endosome membrane.
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: Full text cached; primary functional characterization of AMPH-1 in vivo and in vitro.
