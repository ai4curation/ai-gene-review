id: Q21004
gene_symbol: amph-1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: AMPH-1 is the only Caenorhabditis elegans member of the amphiphysin/BIN1 family of N-BAR
  proteins, with an N-terminal BAR domain, central NPF motifs and a C-terminal SH3 domain. Its best-characterized
  activity is on basolateral recycling endosomes of the intestine, where it binds and tubulates phospholipid
  membranes and, through its NPF motifs, recruits the dynamin-like ATPase RME-1/EHD1; together the two
  proteins form coated membrane tubules in vitro and are required in vivo for the return of internalized
  cargo to the plasma membrane. AMPH-1 also binds the GTP-bound form of RAB-10 and helps recruit the RAB-5
  GAP TBC-2 to endosomes, closing the RAB-5 cycle during recycling. In body-wall muscle, AMPH-1 localizes
  to the nuclear envelope and links nesprin/ANC-1 to actin and to the microtubule plus-end protein CLIP-1,
  positioning and shaping nuclei, a role conserved with human BIN1 in centronuclear myopathy. An AMPH-1::GFP
  reporter is also present at motor-neuron release sites, but a synaptic vesicle endocytosis function
  has not been demonstrated in the worm.
