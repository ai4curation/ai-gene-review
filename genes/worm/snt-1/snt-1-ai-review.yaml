suggested_questions:
- question: Is SNT-1 present on dense-core vesicles in C. elegans neurons, and does it act as a Ca2+
    sensor for neuropeptide release, as the PAINT dense core granule propagation implies?
- question: Which endocytic step (AP-2 recruitment, membrane bending) requires SNT-1 C2B in worm 
    synapses, and does the enlarged-vesicle phenotype reflect that step?
suggested_experiments:
- description: Electron microscopy and neuropeptide-reporter (e.g. FLP-3::Venus) coelomocyte uptake 
    assays in snt-1 nulls with neuronal rescue of each isoform.
  hypothesis: SNT-1 is dispensable for dense-core vesicle release, which relies on other 
    synaptotagmins or UNC-31/CAPS-dependent sensors.
