id: P34693
gene_symbol: snt-1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: >-
  SNT-1 is the Caenorhabditis elegans synaptotagmin-1 orthologue, the Ca2+ sensor for fast
  neurotransmitter release. It is a single-pass synaptic vesicle membrane protein whose two
  cytoplasmic C2 domains bind Ca2+ and, Ca2+-dependently, acidic phospholipids and the assembled
  SNARE complex; Ca2+ binding to the C2B domain triggers synchronous evoked release at the
  neuromuscular junction, both C2 domains support tonic release, and SNT-1 clamps spontaneous
  fusion and contributes to vesicle priming. snt-1 mutants (the first synaptotagmin mutants in
  any organism) are severely uncoordinated with feeding and defecation defects, accumulate
  acetylcholine and resist aldicarb, but retain some release, part of which is provided by the
  delayed, vesicle-free sensor SNT-3. SNT-1 also functions in synaptic vesicle recycling, with
  enlarged vesicles in mutants, and its loss suppresses ion-channel-induced necrotic
  neurodegeneration. Two splice isoforms differ in the C2B domain; SNT-1A is the predominant
  synaptic form, while SNT-1B suffices for the expulsion step of defecation. The protein
  colocalises with RAB-3 and SNB-1 on synaptic vesicles in synapse-rich neuropil and is
  trafficked to synapses by the UNC-104 kinesin.
