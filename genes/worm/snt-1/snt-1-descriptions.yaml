    overall_notes: 'Correct: exocytosis and recycling, behavioral phenotypes, SNT-1A/1B
      isoforms and expression.'
- source: Alliance_Automated
  text: Enables calcium ion binding activity; calcium ion sensor activity; and calcium-dependent
    phospholipid binding activity. Involved in several processes, including defecation;
    regulation of nematode pharyngeal pumping; and synaptic vesicle endocytosis. Located
    in synaptic vesicle. Is expressed in several structures, including excretory gland
    cell; gonad; nervous system; pharyngeal gland cell; and rectal gland cell. Human
    ortholog(s) of this gene implicated in congenital myasthenic syndrome; congenital
    myasthenic syndrome 7; and disease of mental health. Orthologous to several human
    genes including SYT1 (synaptotagmin 1).
