    overall_notes: Hedged by-similarity text ('may have a regulatory role'); does
      not state the Ca2+ sensor function. Necrotic death is right.
- source: Alliance_Imported
  text: snt-1 encodes two proteins, SNT-1A and SNT-1B, orthologous to synaptotagmin;
    SNT-1 is required for synaptic vesicle exocytosis and neurotransmitter release
    as well as for synaptic vesicle recycling via clathrin-mediated endocytosis; accordingly,
    snt-1 activity is required for a variety of behaviors including pharyngeal pumping,
    locomotion, and defecation;  SNT-1A and SNT-1B isoforms are expressed in neurons,
    with SNT-1A typically expressed at higher levels, and in a greater number of neurons,
    than SNT-1B; in addition, SNT-1B is exclusively expressed in the excretory duct
    cell and a group of tail neurons including DVB, a GABAergic neuron required for
    defecation.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00004921;class=Gene
  source_id: WB:WBGene00004921
