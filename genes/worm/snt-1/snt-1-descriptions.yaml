gene_symbol: snt-1
organism: worm
uniprot_id: P34693
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: May have a regulatory role in the membrane interactions during trafficking
    of synaptic vesicles at the active zone of the synapse. It binds acidic phospholipids
    with a specificity that requires the presence of both an acidic head group and
    a diacyl backbone (By similarity). Involved in necrotic cell death (PubMed:22157748).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P34693
  source_id: P34693
- source: Alliance_Imported
  text: snt-1 encodes two proteins, SNT-1A and SNT-1B, orthologous to synaptotagmin;
    SNT-1 is required for synaptic vesicle exocytosis and neurotransmitter release
    as well as for synaptic vesicle recycling via clathrin-mediated endocytosis; accordingly,
    snt-1 activity is required for a variety of behaviors including pharyngeal pumping,
    locomotion, and defecation;  SNT-1A and SNT-1B isoforms are expressed in neurons,
    with SNT-1A typically expressed at higher levels, and in a greater number of neurons,
    than SNT-1B; in addition, SNT-1B is exclusively expressed in the excretory duct
    cell and a group of tail neurons including DVB, a GABAergic neuron required for
    defecation.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00004921;class=Gene
  source_id: WB:WBGene00004921
- source: Alliance_Automated
  text: Enables calcium ion binding activity; calcium ion sensor activity; and calcium-dependent
    phospholipid binding activity. Involved in several processes, including defecation;
    regulation of nematode pharyngeal pumping; and synaptic vesicle endocytosis. Located
    in synaptic vesicle. Is expressed in several structures, including excretory gland
    cell; gonad; nervous system; pharyngeal gland cell; and rectal gland cell. Human
    ortholog(s) of this gene implicated in congenital myasthenic syndrome; congenital
    myasthenic syndrome 7; and disease of mental health. Orthologous to several human
    genes including SYT1 (synaptotagmin 1).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00004921;class=Gene
  source_id: WB:WBGene00004921
