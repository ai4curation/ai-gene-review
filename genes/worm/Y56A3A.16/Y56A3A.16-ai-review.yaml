id: G2HK09
gene_symbol: Y56A3A.16
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: Y56A3A.16 (named RUB-1 in the literature) encodes a ~600-residue member of the Rubicon/Pacer
  family (PANTHER PTHR45971, invertebrate Rubicon subfamily SF1). It is divergent and truncated
  relative to vertebrate Rubicon (RUBCN) and Pacer (RUBCNL). Its only recognizable domain is the
  C-terminal zinc-containing Rubicon-homology (RH) domain, which is about equally similar to the
  RH domains of RUBCN, Pacer and Drosophila Rubicon. It lacks the N-terminal RUN domain and the
  VPS34-binding (PIKBD) region found in Rubicon. Functionally it behaves like Rubicon rather than
  Pacer. RNAi knockdown increases autophagosome and autolysosome numbers and autophagic flux in
  an autophagy-gene-dependent manner. Knockdown also extends lifespan (most effectively in neurons),
  reduces polyglutamine aggregation and age-related locomotor decline, and increases oxidative
  stress resistance, all depending on autophagy genes. Overexpression shortens lifespan, and expression
  rises with age. A RUB-1::EGFP reporter is expressed in neurons, intestine and pharynx. Knockdown
  does not detectably alter endocytic trafficking of a transferrin-receptor reporter. Its subcellular
  location, binding partners and biochemical mechanism are unknown, and all functional data come
  from a single RNAi-based study.
existing_annotations:
- term:
    id: GO:1901981
    label: phosphatidylinositol phosphate binding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN002915557
  - UniProtKB:Q9H714
  review:
    summary: Phosphatidylinositol phosphate binding is inherited from the eukaryote-level root
      node PTN002915557, whose only experimental seed is human Pacer (RUBCNL). There are no lipid-binding
      data for RUB-1.
    action: MARK_AS_OVER_ANNOTATED
    reason: RUB-1 is inside the PTHR45971 clade and keeps the RH domain shared by all family members,
      so inheritance from the root node is formally consistent. However, the root-level placement
      rests on a single vertebrate Pacer seed whose PIP-binding region is not mapped to the RH
      domain. Human Rubicon itself has no lipid-binding evidence, and RUB-1 lacks the RUN and
      PIKBD regions present in the other members. RUB-1 also has fewer RH-domain cysteines than
      RUBCN, Pacer or fly Rubicon. Phosphoinositide binding by this divergent RH-only protein
      is therefore untested, and RUB-1 behaves like Rubicon rather than Pacer. The term is treated
      as an over-propagation from the vertebrate Pacer lineage, consistent with the human and mouse
      RUBCN reviews.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: PANTHER:PTN002915557
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Root node seeded only by vertebrate RUBCNL/Pacer (PMID:28306502); Rubicon-lineage
          members, including this one, have no lipid-binding evidence.
    supported_by:
    - reference_id: file:worm/Y56A3A.16/Y56A3A.16-uniprot.txt
      supporting_text: GO; GO:1901981; F:phosphatidylinositol phosphate binding; IBA:GO_Central.
    - reference_id: file:worm/Y56A3A.16/Y56A3A.16-bioinformatics/RESULTS.md
      supporting_text: The worm protein has only the C-terminal RH domain; neither
        worm isoform in UniProt carries a detectable RUN or PIKBD region.
- term:
    id: GO:0010507
    label: negative regulation of autophagy
  evidence_type: IMP
  original_reference_id: PMID:30783089
  qualifier: involved_in
  review:
    summary: RNAi of Y56A3A.16 increases GFP::LGG-1 autophagosomes, autophagosome and autolysosome
      pools, and autophagic flux in the intestine. The increase depends on bec-1 and atg-18. Lifespan
      extension from knockdown also depends on bec-1, unc-51 and atg-18.
    action: NEW
    reason: This is the only experimentally characterized function of RUB-1. It discriminates
      Rubicon-like (negative) from Pacer-like (positive) behaviour, and it is the defining activity
      of the vertebrate Rubicon clade (human RUBCN carries GO:0010507). The worm protein lies
      outside the Euteleostomi PAINT node that propagates the negative-regulation terms, so it
      does not receive them by IBA. The evidence is RNAi-based (40-50% knockdown) from a single
      study. Lifespan (GO:0008340) is not proposed, because it is a downstream organismal readout
      of autophagy derepression.
    supported_by:
    - reference_id: PMID:30783089
      supporting_text: Knockdown of Y56A3A.16 by RNAi significantly increased the number of GFP::LGG-1
        dots, an autophagosome marker5,22, in intestinal cells
    - reference_id: PMID:30783089
      supporting_text: suggesting that Y56A3A.16 knockdown increases the autophagic flux
    - reference_id: PMID:30783089
      supporting_text: the increase in longevity was completely abolished when the autophagy regulators
        bec-1/Beclin1, unc-51/ULK1 and atg-18/ATG18 were knocked down by RNAi along with rub-1
