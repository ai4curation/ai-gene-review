core_functions:
- description: Rubicon-like negative regulator of autophagy. Loss of RUB-1 raises autophagic
    flux and extends lifespan in an autophagy-dependent manner. The molecular mechanism is unknown,
    because RUB-1 lacks the RUN domain through which vertebrate Rubicon binds VPS34 and keeps only
    the RH domain.
  directly_involved_in:
  - id: GO:0010507
    label: negative regulation of autophagy
  supported_by:
  - reference_id: PMID:30783089
    supporting_text: Knockdown of Y56A3A.16 by RNAi significantly increased the number of GFP::LGG-1
      dots, an autophagosome marker5,22, in intestinal cells
  - reference_id: file:worm/Y56A3A.16/Y56A3A.16-bioinformatics/RESULTS.md
    supporting_text: The worm protein has only the C-terminal RH domain
  knowledge_gaps:
  - gap_statement: The biochemical activity, binding partners (VPS34 complex, UVRAG, RAB-7) and
      subcellular location of RUB-1 are unknown. RUB-1 lacks the RUN domain used by vertebrate
      Rubicon to inhibit VPS34, so how an RH-only protein suppresses autophagy remains open.
    gap_kind:
    - BIOLOGY
suggested_questions:
- question: Is RUB-1 a true Rubicon ortholog that lost its RUN domain, or a divergent RH-domain
    family member whose anti-autophagy activity arose independently? The answer affects whether
    RUBCN-specific PAINT terms should extend to it.
  experts:
  - PANTHER/PAINT curators
  - C. elegans autophagy researchers
suggested_experiments:
- description: Generate a rub-1 deletion allele and endogenously tagged RUB-1. Measure autophagic
    flux, lifespan and colocalization with RAB-7 and LGG-1. Test binding of the RUB-1 RH domain
    to GTP-RAB-7 and to the VPS-34/BEC-1 complex.
  hypothesis: RUB-1 acts on RAB-7-positive late endosomes or lysosomes through its RH domain, and
    loss of function reproduces the RNAi phenotypes.
  experiment_type: genetics, imaging and biochemistry
