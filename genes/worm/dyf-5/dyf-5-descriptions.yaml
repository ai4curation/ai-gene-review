gene_symbol: dyf-5
organism: worm
uniprot_id: B3WFY8
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Serine/threonine-protein kinase which is required for ciliogenesis. Regulates
    the length and the morphology of sensory neuron cilia. In addition, plays a role
    in the anterograde intraflagellar transport (IFT) in the cilia by regulating the
    undocking of kinesin-II motor complex (composed of klp-11, klp-20 and kap-1) before
    reaching the distal segment and the docking of kinesin motor osm-3 onto IFT cargos.
  source_type: curated
  url: https://www.uniprot.org/uniprot/B3WFY8
  source_id: B3WFY8
- source: Alliance_Imported
  text: dyf-5 encodes a putative MAP kinase orthologous to human MAK/ICK(OMIM:154235),
    Chlamydomonas reinhardtii LF4, and Leishmania mexicanaMPK9; DYF-5 negatively regulates
    cilial length, restricts KAP-1 tomiddle ciliary segments, is required for normal
    localization of six IFTcomponents, and is required for OSM-3 to comigrate normally
    with IFTparticles; DYF-5 is also required for dye-filling of amphid and phasmidneurons
    and for normal chemotaxis, dauer formation, and male mating;DYF-5 is expressed
    in head neurons (including amphid neurons), tailneurons (including phasmid neurons),
    CAN cells, excretory canal neurons,posterior lateral ganglion neurons and in many
    male tail cells; dyf-5mutant cilia are abnormally elongated, either failing to
    enter theamphid channel or accumulating IFT proteins at their distal ends,whereas
    DYF-5 overexpression results in truncated cilia; the dyf-5promoter region contains
    an X-box, predicted to be bound andtranscriptionally activated by DAF-19, and
    dyf-5 is regulated by DAF-19in vivo; dyf-5 animals are slightly shorter than normal.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00001121;class=Gene
  source_id: WB:WBGene00001121
- source: Alliance_Automated
  text: Enables protein serine/threonine kinase activity. Involved in cilium organization;
    intracellular protein localization; and regulation of non-motile cilium assembly.
    Located in several cellular components, including dendrite; non-motile cilium;
    and perikaryon. Is expressed in hypodermis; intestine; nervous system; and rectal
    gland cell. Human ortholog(s) of this gene implicated in cranioectodermal dysplasia;
    endocrine-cerebro-osteodysplasia syndrome; juvenile myoclonic epilepsy 10; and
    retinitis pigmentosa 62. Orthologous to several human genes including MAK (male
    germ cell associated kinase).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00001121;class=Gene
  source_id: WB:WBGene00001121
- source: RefSeq
  text: Enables protein serine/threonine kinase activity. Involved in cilium organization;
