- term:
    id: GO:0040026
    label: positive regulation of vulval development
  evidence_type: IGI
  original_reference_id: PMID:10880441
  qualifier: involved_in
  supporting_entities:
  - WB:WBGene00002335
  review:
    summary: 'IGI: SOS-1 positively regulates LET-23/Ras-dependent vulval development.'
    action: KEEP_AS_NON_CORE
    reason: sos-1/let-341 acts downstream of LET-23 and upstream of LET-60/Ras
      in the vulval induction pathway, so it positively contributes to vulval
      development. This is a C. elegans developmental context for the conserved
      SOS RasGEF activity rather than a distinct core function.
    supported_by:
    - reference_id: PMID:10880441
      supporting_text: Since s1031 is a null allele, we tested whether this
        mutation alters vulval induction. We used a let-60(gf) mutation to
        rescue the lethality of s1031 and found that loss of let-341 sos-1
        function reduces vulval induction.
- term:
    id: GO:0046982
    label: protein heterodimerization activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR009072
  review:
    summary: 'IEA/InterPro: protein heterodimerization inferred from a histone-fold signature.'
    action: REMOVE
    reason: The IEA appears to be a generic transfer from the histone-fold
      superfamily hit. The SOS-1 record supports DH, PH, Ras-GEF N-terminal and
      Ras-GEF catalytic domains, and its characterized molecular function is
      nucleotide exchange on Ras; the local evidence does not support annotating
      C. elegans SOS-1 to a standalone protein heterodimerization activity.
