  review:
    summary: 'IBA: conserved guanyl-nucleotide exchange factor activity of SOS-family RasGEFs.'
    action: ACCEPT
    reason: SOS-1 is the C. elegans Son of sevenless ortholog and contains the
      conserved Ras-GEF N-terminal and catalytic CDC25/RasGEF domains. Chang et
      al. cloned sos-1 as the missing C. elegans Ras exchange factor and showed
      that let-341 encodes SOS-1, matching the PAINT placement on the SOS/RasGEF
      ancestral node.
    supported_by:
    - reference_id: PMID:10880441
      supporting_text: Here we describe the identification, cloning and genetic
        characterization of C.elegans SOS-1, a putative guanine nucleotide
        exchanger for LET-60 RAS.
