- term:
    id: GO:0007292
    label: female gamete generation
  evidence_type: IMP
  original_reference_id: PMID:10880441
  qualifier: involved_in
  review:
    summary: 'IMP: sos-1 is required for normal oogenesis.'
    action: KEEP_AS_NON_CORE
    reason: sos-1 RNAi perturbs germline pachytene exit and oogenesis, so the
      annotation is supported. Female gamete generation is a nematode
      developmental output of SOS-1-dependent Ras signaling rather than the
      reusable core molecular function of the RasGEF.
    supported_by:
    - reference_id: PMID:10880441
      supporting_text: During oogenesis, a significant retardation of pachytene
        exit is observed (11/11 animals examined) (Figure 3 D).
