  label: Caenorhabditis elegans
description: >-
  sos-1 encodes the C. elegans Son of sevenless Ras guanine-nucleotide exchange
  factor. Acting downstream of RTK adaptors such as SEM-5, SOS-1 promotes GDP
  release from LET-60/Ras and thereby activates Ras/MAPK signaling downstream
  of LET-23 and EGL-15 during vulval, gonadal, sex myoblast, and larval
  developmental outputs.
