  review:
    summary: 'IGI: SOS-1 participates in LET-23/EGFR signaling upstream of LET-60/Ras.'
    action: ACCEPT
    reason: Chang et al. placed SOS-1 in the C. elegans LET-23/EGFR pathway by
      showing that sos-1 RNAi suppresses activated LET-23-driven vulval
