  review:
    summary: 'IBA: SOS-family activity at the plasma membrane.'
    action: ACCEPT
    reason: SOS proteins activate Ras after receptor and GRB2/SEM-5-mediated
      recruitment to the plasma membrane. The PAINT plasma-membrane assertion is
      coherent for C. elegans SOS-1 because it transduces LET-23/EGFR and
      EGL-15/FGFR signals to LET-60/Ras.
    supported_by:
    - reference_id: PMID:10880441
      supporting_text: Ras is activated following the recruitment of Sos to the
        plasma membrane, which stimulates guanine nucleotide exchange.
        Recruitment of Sos follows receptor activation and is dependent upon the
        adaptor protein Grb2.
