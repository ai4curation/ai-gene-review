  review:
    summary: 'IMP: embryonic or early larval lethality of let-341/sos-1.'
    action: UNDECIDED
    reason: Johnsen and Baillie isolated let-341 alleles as part of an LGV
      essential-gene screen, and Chang et al. later showed that let-341 encodes
      SOS-1. The cached Johnsen and Baillie record is abstract-only, however,
      and it does not expose the allele-specific developmental-stage evidence
      needed to confirm whether this row should remain at embryo development or
      be generalized to a broader viability/development term.
    additional_reference_ids:
    - PMID:10880441
    supported_by:
    - reference_id: PMID:10880441
      supporting_text: let-341 alleles were originally isolated in a screen for
        essential genes on the left arm of V ( Johnsen and Baillie, 1991 ).
