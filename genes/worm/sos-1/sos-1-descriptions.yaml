descriptions:
- source: UniProt
  text: Promotes the exchange of Ras-bound GDP by GTP (By similarity). May regulate
    signaling pathways downstream of receptor tyrosine kinase, egl-15 and let-23 (PubMed:10880441).
    Required for larval and male spicule development, fluid homeostasis, vulva induction,
    spermatogenesis, and oogenesis by promoting meiosis prophase exit during oocyte
    maturation (PubMed:10880441, PubMed:17339331). Required for the delamination of
    G1 cell by promoting the loss of cell junctions and detachment from the excretory
    system during larval development (PubMed:25371363). Plays a role in nicotinic
    acetylcholine receptor (nAChR)-mediated sensitivity to nicotine (PubMed:15990870).
    Regulates synaptic levels of nAchR subunit lev-1 in the nerve cord (PubMed:15990870).
  source_type: curated
