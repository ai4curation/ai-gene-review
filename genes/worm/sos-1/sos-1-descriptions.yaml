  text: sos-1 encodes an ortholog of Son of sevenless, a guanine nucleotide exchange
    factor; sos-1 is required for viability, sex myoblast migration, vulval induction,
    and oogenesis; sos-1 acts genetically downstream of let-23 and upstream of let-60
    with respect to vulval development; SOS-1 binds bovine calmodulin in vitro in
    a calcium-dependent manner.
