    summary: >-
      Grant and Hirsh showed RME-2 is the oocyte yolk receptor: mutants lack yolk uptake and ectopic
      RME-2 in muscle is sufficient to bind YP170::GFP. The ligand demonstrated is vitellogenin (yolk),
      not low-density lipoprotein.
