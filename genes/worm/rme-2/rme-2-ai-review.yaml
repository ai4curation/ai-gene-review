  label: Caenorhabditis elegans
description: >-
  RME-2 (receptor-mediated endocytosis 2; T11F8.3) is the Caenorhabditis elegans yolk receptor, a
  925-residue type I transmembrane member of the LDL receptor superfamily with five class A
  ligand-binding repeats, EGF-like repeats, a YWTD beta-propeller, a single transmembrane helix and a
  short cytoplasmic tail. It is expressed in the proximal germline, where it sits at the oocyte plasma
  membrane and in cortical endocytic structures, binds vitellogenin (yolk) particles that are secreted
  by the intestine into the pseudocoelom, and internalizes them by clathrin- and RAB-5-dependent
  receptor-mediated endocytosis before recycling back to the surface. rme-2 mutant oocytes are devoid of
  yolk, yolk accumulates in the body cavity, and brood size and embryo viability are reduced. After
  fertilization RME-2 is cleared from the surface and degraded in embryonic endolysosomal compartments.
