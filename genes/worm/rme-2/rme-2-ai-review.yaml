suggested_questions:
- question: >-
    Does RME-2 bind vitellogenins directly, and which ectodomain modules (class A repeats vs the YWTD
    propeller) mediate binding? Is binding Ca2+-dependent and released at endosomal pH as for LDLR?
- question: >-
    Which cytoplasmic-tail motif and adaptor drives RME-2 internalization? The tail contains an NPMY
    sequence matching the NPXY internalization consensus of LDLR-family receptors; is it required, and is
    it read by AP-2 or a PTB-domain adaptor?
- question: >-
    Are the ovulation defects of rme-2 mutants a secondary consequence of yolk-less oocytes (e.g. altered
    oocyte signaling to the spermatheca), or does RME-2 have a direct role?
suggested_experiments:
- description: >-
    In vitro binding of purified RME-2 ectodomain fragments to purified YP170/YP115/YP88 vitellogenins,
    with Ca2+ chelation and pH titration, to establish direct ligand binding and its mechanism.
- description: >-
    Mutate candidate internalization motifs in the RME-2 cytoplasmic tail in an RME-2::GFP rescuing
    transgene and assay YP170::GFP uptake and RME-2 surface accumulation.
