descriptions:
- source: Alliance_Imported
  text: rme-2 encodes a member of the low-density lipoprotein (LDL) receptor superfamily;
    RME-2 functions as the C. elegans yolk receptor whose activity is required for
    yolk uptake during oogenesis; RME-2 is expressed in developing oocytes where it
    localizes at or near the cell surface.
  source_type: curated
