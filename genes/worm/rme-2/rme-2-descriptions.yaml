gene_symbol: rme-2
organism: worm
uniprot_id: O44191
taxon_id: NCBITaxon:6239
descriptions:
- source: Alliance_Imported
  text: rme-2 encodes a member of the low-density lipoprotein (LDL) receptor superfamily;
    RME-2 functions as the C. elegans yolk receptor whose activity is required for
    yolk uptake during oogenesis; RME-2 is expressed in developing oocytes where it
    localizes at or near the cell surface.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00004374;class=Gene
  source_id: WB:WBGene00004374
- source: Alliance_Automated
  text: Enables low-density lipoprotein particle receptor activity. Involved in embryo
    development; oocyte development; and ovulation. Located in endosome membrane and
    plasma membrane. Is expressed in germ cell; germ line; gonad; and oocyte. Human
    ortholog(s) of this gene implicated in several diseases, including Zollinger-Ellison
    syndrome; hepatobiliary system cancer (multiple); high grade glioma (multiple);
    lung non-small cell carcinoma (multiple); and primary hypomagnesemia (multiple).
    Orthologous to human EGF (epidermal growth factor).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00004374;class=Gene
  source_id: WB:WBGene00004374
