gene_symbol: fan-1
organism: worm
uniprot_id: P90740
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Nuclease required for the repair of DNA interstrand cross- links (ICL). Acts
    as a 5'-3' exonuclease that anchors at a cut end of DNA and cleaves DNA successively
    at every third nucleotide, allowing to excise an ICL from one strand through flanking
    incisions.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P90740
  source_id: P90740
- source: Alliance_Automated
  text: Predicted to enable flap-structured DNA binding activity and nuclease activity.
    Involved in DNA repair. Located in nucleus. Is expressed in embryonic cell; germ
    cell; head neurons; intestine; and tail neurons. Used to study Fanconi anemia.
    Human ortholog(s) of this gene implicated in karyomegalic interstitial nephritis.
    Orthologous to human FAN1 (FANCD2 and FANCI associated nuclease 1).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00015310;class=Gene
  source_id: WB:WBGene00015310
- source: RefSeq
  text: Predicted to enable 5'-3' exonuclease activity; 5'-flap endonuclease activity;
    and flap-structured DNA binding activity. Involved in DNA repair. Located in nucleus.
    Is expressed in embryonic cell; germ cell; head neurons; intestine; and tail neurons.
    Used to study Fanconi anemia. Human ortholog(s) of this gene implicated in karyomegalic
    interstitial nephritis. Orthologous to human FAN1 (FANCD2 and FANCI associated
    nuclease 1). [provided by Alliance of Genome Resources, Jul 2025]
  source_type: automated
  url: https://www.ncbi.nlm.nih.gov/gene/177415
  source_id: GeneID:177415
