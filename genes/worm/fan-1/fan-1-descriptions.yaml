descriptions:
- source: UniProt
  text: Nuclease required for the repair of DNA interstrand cross- links (ICL). Acts
    as a 5'-3' exonuclease that anchors at a cut end of DNA and cleaves DNA successively
    at every third nucleotide, allowing to excise an ICL from one strand through flanking
    incisions.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P90740
