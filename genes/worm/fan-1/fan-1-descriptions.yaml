    - rubric: specificity
      score: 5
    overall_notes: 'Correct and specific: ICL repair nuclease with 5''-3'' exonuclease
      cleaving every third nucleotide. Omits FANCD2 binding and TLS/TMEJ choice.'
- source: Alliance_Automated
  text: Predicted to enable flap-structured DNA binding activity and nuclease activity.
    Involved in DNA repair. Located in nucleus. Is expressed in embryonic cell; germ
    cell; head neurons; intestine; and tail neurons. Used to study Fanconi anemia.
    Human ortholog(s) of this gene implicated in karyomegalic interstitial nephritis.
    Orthologous to human FAN1 (FANCD2 and FANCI associated nuclease 1).
