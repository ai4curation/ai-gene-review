gene_symbol: jmjd-3.1
organism: worm
uniprot_id: Q95QK3
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Histone demethylase that specifically demethylates trimethylated 'Lys-27'
    of histone H3, a mark associated with transcriptional repression, thereby playing
    a central role in the histone code (PubMed:17713478, PubMed:25124442). Involved
    in the transcriptional regulation of the heat shock response, unfolded protein
    response and possibly other stress response target genes (PubMed:26212459, PubMed:27133168).
    Required for gonad development and organization (PubMed:17713478). Required for
    the robust transdifferentiation of the Y rectal epithelial cell to the PDA motor
    neuron during larval development (PubMed:25124442). Acts cell- autonomously in
    Y-to-PDA transdifferentiation, which depends on the demethylase activity and on
    recognition of the H3 tail (PubMed:25124442). Cooperates with set-2 and unc-3
    to ensure robust Y- to-PDA transdifferentiation (PubMed:25124442). Promotes mitochondrial
    stress-induced longevity (PubMed:27133168). Involved in lifespan regulation (PubMed:21803287,
    PubMed:26212459).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q95QK3
  source_id: Q95QK3
- source: Alliance_Imported
  text: jmjd-3.1 encodes, by alternative splicing, two isoforms of a histone H3 trimethyllysine-27
    (H3K27me3) demethylase that is required for normal gonad migration and organization;
    JMJD-3.1 demethylates H3K27me3 in vitro; JMJD-3.1 contains an N-terminal TonB
    domain and a C-terminal JmjC domain, and is homologous to human JMJD3, UTX (OMIM:300128),
    and  UTY (OMIM:400009); null jmjd-3.1(gk384) and jmjd-3.1(gk387) mutants have
    aberrant gonad migration and disordered diakinesis-phase oocytes, phenotypes enhanced
    at 25 deg. C.; JMJD-3.1 is expected to antagonize transcriptional repression by
    polycomb repressor complexes, which mark stem cells (and presumably germline)
    by H3K27me3-mediated repression of somatic genes.
  source_type: curated
