    summary: >-
      Mitochondrion (is_active_in) propagated by PAINT from the SQR node seeded by fission yeast Hmt2
      and human SQOR.
    action: ACCEPT
    reason: >-
      Under the root-organelle policy the organelle claim was checked. J7SF87 sits in the
      mitochondrial SQR subfamily (PANTHER PTHR10632:SF2) whose experimentally characterised members,
      human SQOR and S. pombe Hmt2, are mitochondrial, and the catalytic cycle reduces the
      mitochondrial quinone pool (ubiquinone or rhodoquinone). J7SF87 is inside that clade and
      retains the catalytic and FAD-binding residues, so there is no sign of divergence that would
      argue against the node placement. One caveat: the J7SF87 model has no counterpart of the human
      N-terminal transit peptide, so targeting rests on family membership and function rather than a
      detectable presequence; the same holds for SQRD-1. No sub-compartment is added because only
      the homology line supports the inner membrane.
