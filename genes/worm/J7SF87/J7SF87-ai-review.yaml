id: J7SF87
gene_symbol: J7SF87
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: >-
  J7SF87 is the 422-residue Y9C9A.16b product of the Caenorhabditis elegans gene sqrd-2
  (WBGene00021183), one of two worm paralogs of the mitochondrial sulfide:quinone oxidoreductase
  (SQOR) of animals; the other is sqrd-1, with which it shares about 75% identity. It belongs to
  the FAD-dependent SQRD family and keeps the N-terminal GxGxxG FAD-binding motif and both
  catalytic cysteines that form the persulfide intermediate in human SQOR. By orthology it is
  expected to oxidize hydrogen sulfide, transfer the sulfane sulfur to glutathione and pass the
  electrons to the mitochondrial quinone pool; docking models accommodate both ubiquinone and
  rhodoquinone. The gene, once classed as a pseudogene, is expressed, but unlike sqrd-1 it is not
  induced by H2S. A deletion mutant is not sensitive to H2S and recovers from sulfide exposure
  slightly faster than wild type, so its physiological role is unresolved. Expression rises
  strongly in mutants of the NCoR/SMRT homologue gei-8. The shorter Y9C9A.16a product lacks the
  FAD motif. No enzyme assay or localization study of the worm protein has been reported.
