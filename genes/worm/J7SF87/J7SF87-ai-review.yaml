proposed_new_terms: []
suggested_questions:
- question: >-
    Is SQRD-2 catalytically active as a sulfide:quinone oxidoreductase, and with which sulfane acceptor
    (glutathione, sulfite) and quinone (ubiquinone, rhodoquinone)? Should it carry sulfide oxidation
    (GO:0019418), as SQRD-1 does, once activity is shown? UniProt still lists the obsoleted IBA
    GO:0070221 for this entry.
- question: >-
    Why does sqrd-2 loss speed recovery from sulfide rather than slow it? Does SQRD-2 compete with SQRD-1
    for quinone or acceptor, or act in a different tissue or developmental stage?
- question: >-
    How is SQRD-2 targeted to mitochondria without a recognizable N-terminal presequence, and is the
    FAD-motif-less Y9C9A.16a product (Q9N2S1) expressed and functional?
suggested_experiments:
- description: >-
    Express recombinant SQRD-2 (Y9C9A.16b) and measure sulfide-dependent reduction of decylubiquinone and
    rhodoquinone analogues with glutathione, sulfite or cyanide as acceptor, alongside SQRD-1; mutate
    Cys169 and Cys351 as controls.
  hypothesis: SQRD-2 is an active glutathione-dependent SQR with the catalytic cysteines of human SQOR.
- description: >-
    Co-localize endogenously tagged SQRD-2 (CRISPR knock-in) with a mitochondrial marker, and test
    sqrd-1; sqrd-2 double mutants for H2S sensitivity and sulfide consumption.
  hypothesis: SQRD-2 is mitochondrial and contributes to sulfide oxidation redundantly with SQRD-1.
