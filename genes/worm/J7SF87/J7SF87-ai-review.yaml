- id: PMID:23484030
  title: GEI-8, a homologue of vertebrate nuclear receptor corepressor NCoR/SMRT, regulates gonad development
    and neuronal functions in Caenorhabditis elegans.
  findings:
  - statement: Names Y9C9A.16 sqrd-2 and reports a 7.6-fold increase in its expression in gei-8(ok1671)
      mutants, confirmed by RT-qPCR.
    supporting_text: One of the most significantly affected genes in the gei-8(ok1671) homozygous mutants
      was Y9C9A.16, encoding a predicted mitochondrial sulfide:quinone oxidoreductase, which had an averaged
      7.6-fold increase in expression compared to wild-type controls
  - statement: Y9C9A.16 RNAi gives no phenotype in wild type; in gei-8 mutants it modifies gonad phenotypes,
      but the dsRNA region includes three 21U-RNA loci.
    supporting_text: We were not able to identify any specific phenotype of Y9C9A.16 knockdown in wild
      type animals.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Full text read. Names sqrd-2 and gives expression and genetic-interaction data. The enzyme
      activity is predicted, not assayed. The RNAi phenotypes are modifier effects in a gei-8 mutant
      background and could come from the embedded 21U-RNAs, so they do not support a developmental
      process annotation for the protein.
- id: PMID:21840852
  title: The response of Caenorhabditis elegans to hydrogen sulfide and hydrogen cyanide.
  findings:
  - statement: Identifies Y9C9A.16 as a second SQRD homolog (sqrd-2), formerly classed as a pseudogene;
      its deletion allele is not H2S-sensitive.
    supporting_text: We obtained the deletion allele of sqrd-2 and found that it is not sensitive to RA/H2S.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text read. Mainly about sqrd-1; sqrd-2 appears as a negative genetic result.
- id: PMID:39178951
  title: Rhodoquinone-dependent electron transport chain is essential for Caenorhabditis elegans survival
    in hydrogen sulfide environments.
  findings:
  - statement: Y9C9A.16 is expressed; homology models of SQRD-2 dock ubiquinone and rhodoquinone in the
      quinone site.
    supporting_text: We found that Y9C9A.16 is expressed in C. elegans, yielding an mRNA of the expected
      size according to the gene model (Fig. S2).
  - statement: sqrd-2(ok3440) recovers from sulfide slightly faster than wild type; the authors speculate
      a negative regulatory role.
    supporting_text: In contrast to the sqrd-1 mutant strain, the recovery of sqrd-2 mutant strain (sqrd-2(ok3440))
      was slightly earlier than that of the N2 strain
  - statement: Unlike sqrd-1, sqrd-2 is not induced by H2S.
    supporting_text: Unlike the sqrd-1 gene, sqrd-2 does not change its expression under H2S conditions
      according to microarray studies (16).
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text read. The only study with sqrd-2-specific data on sulfide responses. The quinone-binding
      conclusion is in silico (docking and molecular dynamics); no enzyme assay.
