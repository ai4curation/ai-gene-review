- description: >-
    Glutathione-dependent sulfide:quinone oxidoreductase activity, inferred by orthology with human
    SQOR and supported by conservation of both catalytic persulfide cysteines and the FAD-binding
    motif. SQRD-2 is expected to oxidize H2S with bound FAD, transfer the sulfane sulfur to an
    acceptor and pass the electrons to the mitochondrial quinone pool (ubiquinone, and possibly
    rhodoquinone). Its contribution to sulfide detoxification in vivo is unclear, as the deletion
    mutant is not H2S-sensitive.
