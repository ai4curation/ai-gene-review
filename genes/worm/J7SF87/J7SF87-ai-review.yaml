- term:
    id: GO:0071949
    label: FAD binding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN000066985
  - PomBase:SPBC2G5.06c
  review:
    summary: FAD binding propagated by PAINT from the SQR node.
    action: KEEP_AS_NON_CORE
    reason: >-
      FAD is the prosthetic group of SQRs, and J7SF87 keeps the N-terminal GxGxxG dinucleotide-binding
      motif and the residues aligned to the human SQOR FAD-binding sites. The term is as precise as it
      can be, but cofactor binding is a part of the catalytic activity rather than a separate core
      function. Note that the shorter Y9C9A.16a product (Q9N2S1) lacks this motif.
