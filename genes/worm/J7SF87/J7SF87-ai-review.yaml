  review:
    summary: >-
      Sulfide:quinone oxidoreductase activity propagated by PAINT from the SQR node seeded by human
      SQOR and fission yeast Hmt2.
    action: MODIFY
    reason: >-
      The enzyme class is right and the propagation is sound: J7SF87 is 45% identical to human SQOR
      and keeps both catalytic persulfide cysteines (human Cys201 and Cys379, J7SF87 Cys169 and
      Cys351) and the FAD-binding motif. But GO:0070224 is defined by the bacterial-type reaction
      that releases free sulfane sulfur (S0). The animal mitochondrial SQRs transfer the sulfane
      sulfur to glutathione, forming S-sulfanylglutathione (EC 1.8.5.8), which is GO:0106436, a
      sibling of GO:0070224 under GO:0016672 (checked in OLS), not a descendant. The gene already
      carries GO:0106436 (IEA from EC). The worm acceptor has not been measured, so the refinement
      rests on orthology, as in the sqrd-1 review.
    proposed_replacement_terms:
    - id: GO:0106436
      label: glutathione-dependent sulfide quinone oxidoreductase activity
    supported_by:
    - reference_id: file:worm/J7SF87/J7SF87-bioinformatics/RESULTS.md
      supporting_text: Both catalytic cysteines of human SQOR (Cys201 and Cys379, the cysteine persulfide
        intermediates, experimentally defined in Q9Y6N5) are conserved in J7SF87, as Cys169 and Cys351.
    - reference_id: PMID:21840852
      supporting_text: The C. elegans gene sqrd-1 encodes a member of the group II SQRD enzymes, which
