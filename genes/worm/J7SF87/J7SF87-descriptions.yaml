taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Catalyzes the oxidation of hydrogen sulfide with the help of a quinone, such
    as ubiquinone-10, giving rise to thiosulfate and ultimately to sulfane (molecular
    sulfur) atoms. Requires an additional electron acceptor; can use sulfite, sulfide
    or cyanide (in vitro). It is believed the in vivo electron acceptor is glutathione.
  source_type: curated
  url: https://www.uniprot.org/uniprot/J7SF87
  source_id: J7SF87
- source: Alliance_Automated
  text: Predicted to enable FAD binding activity and sulfide:quinone oxidoreductase
    activity. Predicted to be active in mitochondrion. Human ortholog(s) of this gene
    implicated in inherited metabolic disorder. Orthologous to human SQOR (sulfide
    quinone oxidoreductase).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00021183;class=Gene
  source_id: WB:WBGene00021183
- source: RefSeq
  text: Predicted to enable FAD binding activity and sulfide:quinone oxidoreductase
    activity. Predicted to be involved in sulfide oxidation, using sulfide:quinone
    oxidoreductase. Predicted to be active in mitochondrion. Orthologous to human
    SQOR (sulfide quinone oxidoreductase). [provided by Alliance of Genome Resources,
    Jul 2025]
  source_type: automated
