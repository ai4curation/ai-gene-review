  text: Predicted to enable ATP hydrolysis activity; heat shock protein binding activity;
    and protein folding chaperone. Involved in mitochondrial unfolded protein response.
    Is active in mitochondrion. Is expressed in intestine and muscle cell. Human ortholog(s)
    of this gene implicated in Parkinson's disease; autosomal dominant sideroblastic
    anemia 4; and bone development disease. Orthologous to human HSPA9 (heat shock
    protein family A (Hsp70) member 9).
