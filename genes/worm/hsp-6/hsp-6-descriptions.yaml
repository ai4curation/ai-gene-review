descriptions:
- source: Alliance_Imported
  text: hsp-6 encodes a nuclear-encoded mitochondrion-specific chaperone that is a
    member of the DnaK/Hsp70 superfamily of molecular chaperones; hsp-6 is involved
    in the mitochondrial unfolded protein response, as hsp-6 expression, normally
    broadly detected from the L1 larval through adult stages of development, is greatly
    increased in response to treatments that disrupt mitochondrial protein handling;
    loss of hsp-6 activity via RNAi results in severe growth defects with arrest at
    embryonic and early larval stages of development; loss of hsp-6 via RNAi in young
    adult hermaphrodites results in abnormal mitochondrial membrane potential and
    morphology, accompanied by reduction of ATP levels and reduced levels of mitochondrial
    proteins ATP-2, HSP-60, and CLK-1; in addition, hsp-6(RNAi) of adults disrupts
    gonadal function, motility, and pharyngeal pumping, as well as resulting in reduced
    lifespan; an HSP-6::GFP fusion protein localizes to mitochondria; HSP-6 levels
    are markedly reduced in aged worms.
