knowledge_gaps:
- gap_statement: >-
    The native fatty-acid or retinoid cargoes carried by C. elegans FAR-1, and
    the in vivo biological processes or phenotypes that depend on far-1, have
    not been directly identified.
  boundary: >-
    Recombinant Ce-FAR-1 binds DAUDA, cis-parinaric acid, and retinol in vitro,
    and UniProt maps the protein to the extracellular region based on a
    curated secreted-location statement.
  gap_kind:
  - BIOLOGY
  dark_aspect: BP_DARK
  significance: >-
    C. elegans lacks the host-interface context that motivates filarial FAR-1
    studies, so loss-of-function and native-ligand data are needed before FAR-1
    can be assigned a specific C. elegans biological process.
  resolution: >-
    Identify endogenous FAR-1-bound lipids from worms and assay far-1
    perturbation phenotypes under defined lipid, retinoid, developmental, and
    stress conditions.
  provenance:
  - reference_id: file:worm/far-1/far-1-notes.md
    supporting_text: >-
      FAR-1 has direct recombinant ligand-binding evidence but no cached
      loss-of-function or native-cargo study tying P34382 to a specific C.
      elegans biological process.
suggested_questions:
- question: >-
    Which endogenous C. elegans lipids are carried by FAR-1, and are those
    cargoes shared with the same-subfamily filarial FAR-1 proteins?
  experts:
  - C. elegans lipid metabolism curators
  - Nematode FAR protein specialists
suggested_experiments:
- description: >-
    Immunopurify endogenous FAR-1 from synchronized larvae and adults and
    identify bound retinoids and fatty acids by targeted and untargeted
    LC-MS/MS.
  hypothesis: >-
    FAR-1 carries a restricted set of native C. elegans fatty-acid or retinoid
    ligands rather than binding reporter lipids only as a promiscuous
    recombinant activity.
  experiment_type: native ligand identification
- description: >-
    Generate far-1 loss-of-function animals and assay development, fertility,
    dauer entry or exit, and stress phenotypes across defined lipid supplies
    and retinoid-like supplementation.
  hypothesis: >-
    FAR-1-dependent lipid binding supports a measurable C. elegans
    developmental or stress-response phenotype under conditions where its
    native cargo is limiting.
  experiment_type: loss of function
