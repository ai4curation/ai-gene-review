  label: Caenorhabditis elegans
description: >-
  FAR-1 is a small, predicted secreted fatty-acid and retinol-binding protein
  of Caenorhabditis elegans and a member of the
  nematode-specific Gp-FAR-1/FARBP family. It is a 182-amino-acid precursor
  with a predicted N-terminal signal peptide and a single Gp-FAR-1 domain,
  and PANTHER places it in subfamily PTHR31418:SF7 with filarial FAR-1
  proteins from Brugia malayi and Onchocerca volvulus. In
  recombinant fluorescence-based assays, Ce-FAR-1 bound the fluorescent
  fatty-acid probes DAUDA and cis-parinaric acid and the retinoid retinol with
  micromolar dissociation constants. The native lipid cargoes and in vivo
  biological processes that depend on FAR-1 in C. elegans remain poorly
  characterized.
