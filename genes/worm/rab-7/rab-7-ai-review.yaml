  review:
    summary: >-
      Grant and Hirsh used RNAi against Ce-rab7 in a YP170::GFP yolk-uptake assay. The
      text reports that rab-7 RNAi did not significantly impair yolk uptake into oocytes but
      mislocalized yolk into enlarged peripheral vesicles, consistent with a block in a late
      endocytic step.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The paper's own description of the rab-7 RNAi phenotype is a defect in endosomal
      trafficking of internalized yolk, not a defect in oocyte growth: uptake itself was
      not significantly impaired. Any effect on oocyte size would be an indirect consequence
      of the general endolysosomal trafficking defect. The contents of Table 1 are not in
      the cached text, so the row is marked over-annotated rather than removed.
