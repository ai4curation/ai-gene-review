      Rab5-to-Rab7 switch (with SAND-1/CCZ-1 as its activator). The participation term
      early endosome to late endosome transport describes its role better than a positive
      regulation term.
    proposed_replacement_terms:
    - id: GO:0045022
      label: early endosome to late endosome transport
    supported_by:
    - reference_id: PMID:26783301
      supporting_text: These data further suggest that SORF-1 and SORF-2 act in parallel
        with Rab switching genes (sand-1, ccz-1, rab-7, and tbc-2) to negatively regulate
        PtdIns3P on endosomes.
    - reference_id: PMID:17203072
      supporting_text: SAND-1 is essential for RAB-7
        function at the transition from early to late endosomes
