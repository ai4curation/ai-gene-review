id: Q23146
gene_symbol: rab-7
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: >-
  rab-7 (W03C9.3) encodes the single C. elegans ortholog of the Rab7 small GTPase, a
  209-residue Rab-family protein with the conserved switch I and switch II regions and a
  C-terminal prenylation motif. Like other Rabs it acts as a membrane-associated molecular
  switch that cycles between GDP- and GTP-bound states; its intrinsic GTP hydrolysis is
  stimulated by the TBC-domain GAPs RBG-3 and TBC-2, and its activation and recruitment to
  maturing endosomes at the early-to-late endosome transition depend on SAND-1/Mon1.
  RAB-7 marks late endosomes and lysosomes in the intestine, coelomocytes and oocytes, and
  is recruited to phagosomes containing apoptotic cell corpses shortly after
  phosphatidylinositol 3-phosphate appears on them. It is required for endocytic cargo
  (yolk, fluid-phase markers) to progress from early endosomes to late endosomes and
  lysosomes, and for the recruitment and fusion of lysosomes with phagosomes during
  apoptotic cell corpse degradation, downstream of the CED-1 engulfment receptor pathway.
  On lysosomes it recruits the HEAT-repeat lysosome scission factor HPO-27. Maternal and
  zygotic loss of rab-7 causes embryonic lethality and persistent cell corpses.
