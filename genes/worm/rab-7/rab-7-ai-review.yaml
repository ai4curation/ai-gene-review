core_functions:
- description: >-
    Membrane-associated Rab GTPase switch that, in its GTP-bound form on late endosomes,
    lysosomes and maturing phagosomes, recruits effectors and drives progression of cargo
    from early to late endosomes and fusion of lysosomes with late endosomes and
    phagosomes, including phagosomes containing apoptotic cell corpses.
  molecular_function:
    id: GO:0003924
    label: GTPase activity
  directly_involved_in:
  - id: GO:0045022
    label: early endosome to late endosome transport
  - id: GO:0008333
    label: endosome to lysosome transport
  - id: GO:0090385
    label: phagosome-lysosome fusion
  - id: GO:0090387
    label: phagolysosome assembly involved in apoptotic cell clearance
  locations:
  - id: GO:0031902
    label: late endosome membrane
  - id: GO:0005765
    label: lysosomal membrane
  - id: GO:0030670
    label: phagocytic vesicle membrane
  supported_by:
  - reference_id: PMID:20462958
    supporting_text: we show that TBC-2 specifically catalyzes GTP hydrolysis by RAB-5 and
      to a lesser extent RAB-7
  - reference_id: PMID:18351800
    supporting_text: whose function is essential for promoting the recruitment and fusion
      of lysosomes to phagosomes
  - reference_id: PMID:17203072
    supporting_text: The small rab-GTPase RAB-7 acts in endosome and endosome to lysosome
      traffic
suggested_questions:
- question: >-
    Which RAB-7 effectors in C. elegans (for example the HOPS complex, RILP-like adaptors,
    or HPO-27) are required for lysosome-phagosome fusion versus lysosome fission, and are
    they recruited by the same GTP-bound pool of RAB-7?
- question: >-
    Is the rab-7 requirement for RME-2 accumulation in oocytes a direct role in receptor
    recycling, or a secondary consequence of blocked early-to-late endosome conversion?
- question: >-
    The IGI rows from PMID:26783301 use GO:2000643 positive regulation of early endosome to
    late endosome transport for a Rab that is itself the core switch of that step. Should
    Rab-switch participants be annotated to GO:0045022 rather than to the regulation term?
suggested_experiments:
- description: >-
    Compare GTP-locked (Q68L) and GDP-locked (T23N) RAB-7 in a rab-7(ok511) null background
    for rescue of lysosome-phagosome fusion and HPO-27 recruitment, combined with
    proximity labelling of RAB-7 on lysosomes to identify its effector set.
  hypothesis: GTP-bound RAB-7 recruits distinct effector sets for fusion and fission of
    lysosomes, and nucleotide cycling, not just GTP binding, is needed for phagolysosome
    formation.
