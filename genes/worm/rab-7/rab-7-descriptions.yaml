gene_symbol: rab-7
organism: worm
uniprot_id: Q23146
taxon_id: NCBITaxon:6239
descriptions:
- source: Alliance_Imported
  text: rab-7 encodes a Rab GTPase orthologous to the Rab7 GTPases of yeast, Drosophila,
    and vertebrates; RAB-7 is required for endosome and endosome to lysosome trafficking
    and thus, for proper yolk protein transport in oocytes and transport of endocytosed
    materials in coelomoyctes; RAB-7 is also required for apoptotic cell clearance,
    particularly for regulation of lysosome to phagosome fusion; RAB-7 activity is
    also required for normal embryogenesis, locomotion, and body morphology; RAB-7
    localizes to late endosomes, lysosomes, and phagosomes; RAB-7 localization, and
    presumably function, at endosomes is positively regulated by SAND-1, a novel,
    conserved protein required for early to late endosome maturation and transport;
    rab-7 activity is upregulated by tub-1/tubby, a gene involved in obesity across
    species, suggesting that rab-7 may also be involved in a tub-1/tubby mediated
    endocytic pathway for regulation of fat storage.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00004271;class=Gene
  source_id: WB:WBGene00004271
- source: Alliance_Automated
  text: Enables GTPase activity. Involved in several processes, including oocyte growth;
    phagolysosome assembly involved in apoptotic cell clearance; and positive regulation
    of early endosome to late endosome transport. Located in late endosome membrane;
    lysosome; and phagocytic vesicle membrane. Is active in lysosomal membrane. Is
    expressed in several structures, including oocyte. Used to study obesity. Human
    ortholog(s) of this gene implicated in Charcot-Marie-Tooth disease type 2B. Orthologous
    to human RAB7A (RAB7A, member RAS oncogene family).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00004271;class=Gene
  source_id: WB:WBGene00004271
