product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: 'LON-2 is one of the two C. elegans glypicans. It is a heparan sulfate proteoglycan
  with a signal peptide, heparan sulfate attachment sites and a C-terminal GPI-anchor signal.
  It is expressed in the hypodermis and acts outside the cell as a negative regulator of the
  DBL-1/BMP-like Sma/Mab pathway. Loss of lon-2 increases DBL-1 signaling and makes animals
  long. LON-2 binds human BMP2 in vitro. In the worm, however, its association with DBL-1
  appears to be indirect: the matricellular protein SMOC-1 binds LON-2 and mature DBL-1 and
  forms a three-part complex, and direct LON-2/DBL-1 binding was not detected. Two separable
  parts of LON-2 can each inhibit BMP signaling: the N-terminal furin cleavage product and
  the C-terminal heparan sulfate attachment region. The GPI anchor is not strictly required.
  LON-2 also modulates netrin-dependent axon and cell guidance and Q neuroblast migration.'
