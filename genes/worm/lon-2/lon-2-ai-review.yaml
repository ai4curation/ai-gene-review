  review:
    summary: LON-2 binds human BMP2 in vitro, and the lon-2(e2140) variant weakens this 
      binding [PMID:17240342].
    action: KEEP_AS_NON_CORE
    reason: The IPI accurately records the in vitro BMP2 binding result. But a later 
      biochemical study found no direct binding between LON-2 and any form of the 
      endogenous ligand DBL-1. It found instead that SMOC-1 links LON-2 to mature DBL-1 
      in a three-part complex [PMID:37590248]. Direct growth factor binding is therefore
      shown only for a heterologous ligand. It is uncertain for DBL-1, so this is kept 
      as a non-core annotation and not used as the core molecular function.
    supported_by:
    - reference_id: PMID:17240342
      supporting_text: We show that the LON-2 protein binds BMP2 in vitro, and a mutant 
        variation of LON-2 found in lon-2(e2140) animals diminishes this interaction
    - reference_id: PMID:37590248
      supporting_text: We did not detect any interaction between LON-2 and any form of 
        DBL-1, either by co-IP assays using the Drosophila S2 cell system, or via in 
        silico structural modeling (Figs 5, S2 and S3)
    - reference_id: PMID:37590248
      supporting_text: We showed that CeSMOC-1 binds to the heparin sulfate proteoglycan
