core_functions:
- description: Extracellular glypican that restrains DBL-1/BMP signaling, and thereby 
    body length, at the hypodermal cell surface, probably by sequestering ligand through
    the SMOC-1 bridge rather than by direct DBL-1 binding.
  directly_involved_in:
  - id: GO:0030514
    label: negative regulation of BMP signaling pathway
  locations:
  - id: GO:0009986
    label: cell surface
  supported_by:
  - reference_id: PMID:17240342
    supporting_text: We show that LON-2 negatively regulates a BMP-like signaling 
      pathway that controls body length in C. elegans
  - reference_id: PMID:37590248
    supporting_text: We showed that CeSMOC-1 binds to the heparin sulfate proteoglycan 
      GPC3 homolog LON-2/glypican, as well as the mature domain of the BMP2/4 homolog 
      DBL-1
suggested_questions:
- question: Does endogenous LON-2 contact DBL-1 directly in vivo (for example via 
    heparan sulfate chains absent in S2-cell assays), or only through SMOC-1?
- question: Which RGD-binding partner (integrin?) cooperates with the LON-2 N-terminal 
    core to inhibit BMP signaling?
suggested_experiments:
- description: Measure binding of worm-derived, heparan-sulfate-modified LON-2 to 
    purified mature DBL-1 with and without SMOC-1 (e.g. SPR/BLI).
  hypothesis: LON-2 sequesters DBL-1 only via SMOC-1; HS chains do not confer direct 
    binding.
