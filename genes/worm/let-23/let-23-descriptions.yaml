gene_symbol: let-23
organism: worm
uniprot_id: P24348
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: 'Tyrosine-protein kinase receptor which, upon binding ligand lin-3, activates
    2 signaling cascades: the let-60/Ras and MAP kinase signaling pathway and the
    let-60-independent phospholipase C-mediated Ca(2+) signaling pathway. Each pathway
    regulates distinct functions. By activating let-60/Ras, regulates larval development,
    induction of vulva cell precursors during vulva development, male spicule formation
    and posterior development of the epidermis (PubMed:20230814, PubMed:2071015, PubMed:32053105,
    PubMed:8313880, PubMed:9491893). Probably by activating phospholipase plc-3 and
    inositol 1,4,5- trisphosphate receptor itr-1 signaling cascade downstream of ligand
    lin-3, plays a role in ovulation by promoting ovulatory gonadal sheath cell contractions
    (PubMed:15194811, PubMed:9491893). Probably by regulating neuronal transmission
    in ALA neurons, mediates, independently of let-60/Ras, the decrease in pharyngeal
    pumping and locomotion during the quiescent state that precedes each larval molt,
    downstream of lin-3 and upstream of plc-3 (PubMed:17891142).'
  source_type: curated
  url: https://www.uniprot.org/uniprot/P24348
  source_id: P24348
- source: Alliance_Imported
  text: let-23 encodes an EGF-receptor-family transmembrane tyrosine kinase that affects
    viability, inductive signaling during development of the vulva, male spicule formation,
    posterior development of the epidermis, ovulation and stress induced sleep; let-23
    is genetically upstream of the let-60/RAS pathway with respect to viability and
    vulval development, is upstream of phosopholipase C gamma with respect to fertility
    and sleep, and is expressed in vulval precursor cells and the ALA neuron.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00002299;class=Gene
  source_id: WB:WBGene00002299
- source: Alliance_Automated
  text: Enables epidermal growth factor receptor activity; lipid binding activity;
    and molecular function activator activity. Involved in several processes, including
    positive regulation of vulval development; reproductive structure development;
    and vulval cell fate specification. Located in several cellular components, including
    apical plasma membrane; basolateral plasma membrane; and lateral plasma membrane.
    Is expressed in several structures, including apoptotic cell; epithelial cell;
    head; somatic nervous system; and vulval precursor cell. Human ortholog(s) of
    this gene implicated in several diseases, including amyotrophic lateral sclerosis
    type 19; disease of cellular proliferation (multiple); lethal congenital contracture
    syndrome 2; neonatal nephrocutaneous inflammatory syndrome; and neuronal intestinal
    dysplasia type A. Orthologous to several human genes including ERBB4 (erb-b2 receptor
    tyrosine kinase 4).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00002299;class=Gene
  source_id: WB:WBGene00002299
