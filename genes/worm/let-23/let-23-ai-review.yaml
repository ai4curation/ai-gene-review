        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: The EGFR-family source node is experimentally grounded for
          anti-apoptotic signaling in other animals, but this downstream
          survival phenotype is not exposed in the worm LET-23 evidence.
