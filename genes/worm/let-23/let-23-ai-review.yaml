  evidence_type: IMP
  original_reference_id: PMID:31398431
  qualifier: involved_in
  review:
    summary: LET-23/EGFR signaling participates in the reciprocal vulva-to-uterus
      signal that specifies uv1 fate.
    action: KEEP_AS_NON_CORE
    reason: The Chasser study shows that let-23/EGFR activity in the egg-laying
      system is needed for uterine ventral cell placement and EGL-38 reporter
      expression. That makes uterus development a valid reproductive-system
      output of LET-23 signaling but not the receptor's core molecular function.
    supported_by:
    - reference_id: PMID:31398431
