  review:
    summary: Neuron differentiation is a plausible EGFR-family output in other
      animals but is not established for C. elegans LET-23.
    action: MARK_AS_OVER_ANNOTATED
    reason: The PANTHER node groups receptor tyrosine kinases that can regulate
      neural development in fly and vertebrate systems, but direct C. elegans
      LET-23 evidence supports post-developmental ALA-neuron quiescence rather
      than neuronal differentiation. This IBA appears to over-project a
      context-specific developmental output onto worm LET-23.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - CONTEXT_OR_TISSUE_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN000698827
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: The EGFR-family node supports neuron-differentiation biology in
          some animals, but the cached worm evidence exposes a nondevelopmental
          neuronal LET-23 role in sleep-like quiescence.
- term:
    id: GO:0030431
    label: sleep
  evidence_type: IMP
  original_reference_id: PMID:17891142
  qualifier: involved_in
  review:
    summary: LET-23 mediates an EGF-induced behavioral quiescence state in the
      ALA neuron.
    action: KEEP_AS_NON_CORE
    reason: Van Buskirk and Sternberg showed that ectopic LIN-3 uses neuronal
      LET-23 and PLC-gamma to stop feeding and locomotion, a worm sleep-like
      state. This is a real physiological LET-23 output but not the receptor's
      conserved catalytic core.
    supported_by:
    - reference_id: PMID:17891142
      supporting_text: >-
        These effects are mediated by neuronal EGFR (also called LET-23) and
        phospholipase C-gamma (PLC-gamma), diacylglycerol-binding proteins, and
        regulators of synaptic vesicle release.
- term:
