  qualifier: enables
  review:
    summary: LET-23 kinase domains allosterically activate one another in the
      receptor dimer.
    action: ACCEPT
    reason: >-
      The allosteric-activator role is intrinsic to HER/EGFR-family kinase
      dimers: one kinase domain serves as activator for the partner receiver.
      Liu and colleagues showed that LET-23 uses the same broad asymmetric-dimer
      logic for ligand-dependent signaling.
    supported_by:
