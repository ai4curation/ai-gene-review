id: P24348
gene_symbol: let-23
product_type: PROTEIN
status: INITIALIZED
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: >-
  let-23 encodes the C. elegans epidermal growth factor receptor, a
  single-pass receptor tyrosine kinase activated by LIN-3. LET-23 signals from
  polarized epithelial plasma membranes to initiate Ras/MAPK signaling for
  vulval induction, male spicule development, fertility-associated signaling,
  and additional cell fate and morphogenesis events.
