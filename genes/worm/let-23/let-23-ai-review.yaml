- term:
    id: GO:0006355
    label: regulation of DNA-templated transcription
  evidence_type: IMP
  original_reference_id: PMID:21673654
  qualifier: involved_in
  review:
    summary: LET-23/EGF signaling can change adult UPS and chaperone gene
      expression, but this is a context-specific downstream output.
    action: KEEP_AS_NON_CORE
    reason: The cached abstract supports an EGF-to-Ras/MAPK-to-EOR-1/EOR-2
      pathway that up-regulates ubiquitin proteasome system genes in adults.
      That is a defensible LET-23 signaling output, but transcriptional
      regulation is indirect relative to the receptor kinase activity and
      EGFR/Ras/MAPK signaling that define LET-23.
    supported_by:
    - reference_id: PMID:21673654
      supporting_text: >-
        We find that EGF signalling regulates lifespan via the Ras-MAPK pathway
        and the PLZF transcription factors EOR-1 and EOR-2.
