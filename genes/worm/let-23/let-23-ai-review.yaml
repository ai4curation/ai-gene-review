  review:
    summary: Anti-apoptotic signaling is not an established worm LET-23 output.
    action: MARK_AS_OVER_ANNOTATED
    reason: Mammalian and fly EGFR signaling can feed survival pathways, but the
      cached C. elegans LET-23 evidence supports vulval induction, male spicule
      development, ovulation, sleep-like quiescence, and UPS regulation rather
      than negative regulation of apoptosis. The PAINT transfer likely reflects
      a lineage- or tissue-specific EGFR-family output.
