      IP3-receptor effector to control spermathecal dilation and ovulation. This
      is a direct tissue-specific output of LET-23 but separate from the core
      Ras/MAPK branch.
    supported_by:
    - reference_id: PMID:9491893
      supporting_text: >-
        Signals transduced by LET-23 control ovulation through changes in
        spermathecal dilation
