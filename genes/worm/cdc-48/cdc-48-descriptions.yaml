- source: Alliance_Imported
  text: cdc-48.1 encodes a type II AAA ATPase, homologous to yeast Cdc48 and mammalian
    p97/VCP, that functions as a ubiquitin-selective chaperone; cdc-48.1 acts redundantly
    with cdc-48.2 and in conjunction with ufd-1 and npl-4 in endoplasmic reticulum-associated
    protein degradation (ERAD); in addition, CDC-48.1, UFD-2 and chn-1 function together
    to regulate myosin assembly and muscle formation via the UNC-45 myosin chaperone,
    and CDC-48.1 and ATX-3 function together in determination of adult lifespan via
    interaction with the DAF-2-mediated insulin signaling pathway; cdc-48.1 and cdc-48.2
    also interact to provide an essential function during embryonic development; CDC-48.1
    exhibits ATPase activity in vitro, and in yeast two-hybrid assays, CDC-48.1 interacts
    with itself, CDC-48.2, ATX-3, UFD-1, and UBXN-1, consistent with studies in yeast
    and mammals that show CDC48 homologs form homohexameric complexes that interact
    with adaptor proteins homologous to UFD-1 and UBXN-1.
