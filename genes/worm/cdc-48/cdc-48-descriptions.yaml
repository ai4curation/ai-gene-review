- source: Alliance_Automated
  text: Enables ATP hydrolysis activity and identical protein binding activity. Involved
    in several processes, including ERAD pathway; positive regulation of mitotic cell
    cycle, embryonic; and positive regulation of proteasomal ubiquitin-dependent protein
    catabolic process. Located in nucleoplasm and perinuclear region of cytoplasm.
    Part of VCP-NPL4-UFD1 AAA ATPase complex. Is expressed in several structures,
    including body wall musculature; germ line; and gonad. Used to study amyotrophic
    lateral sclerosis. Human ortholog(s) of this gene implicated in several diseases,
    including Charcot-Marie-Tooth disease type 2Y; Paget disease of bone; frontotemporal
    dementia and/or amyotrophic lateral sclerosis 6; inclusion body myopathy with
    early-onset Paget disease of bone with or without frontotemporal dementia 1; and
    inclusion body myositis. Orthologous to human VCP (valosin containing protein).
