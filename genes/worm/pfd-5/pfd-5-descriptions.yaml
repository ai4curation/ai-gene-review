gene_symbol: pfd-5
organism: worm
uniprot_id: Q21993
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Binds specifically to cytosolic chaperonin (c-CPN) and transfers target proteins
    to it. Binds to nascent polypeptide chain and promotes folding in an environment
    in which there are many competing pathways for nonnative proteins (By similarity).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q21993
  source_id: Q21993
- source: Alliance_Imported
  text: pfd-5 encodes a putative prefoldin 5 subunit, orthologous to human PFDN5 (OMIM:604899),
    that is required for normal microtubule growth, embryonic and larval viability,
    fertility, vulval development, and locomotion; PFD-5 is expressed in most, if
    not all, tissues; pfd-5(RNAi) animals show sterile progeny, larval arrest or lethality,
    uncoordination, and abnormal body shapes, and pfd-5(RNAi) embryos show a reduced
    microtubule growth rate.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00020112;class=Gene
  source_id: WB:WBGene00020112
- source: Alliance_Automated
  text: Predicted to be involved in RNA polymerase I assembly; RNA polymerase II core
    complex assembly; and RNA polymerase III assembly. Predicted to be part of prefoldin
    complex. Predicted to be active in cytoplasm. Is expressed in body wall musculature;
    head muscle; pharyngeal muscle cell; and vulval muscle. Orthologous to human PFDN5
    (prefoldin subunit 5).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00020112;class=Gene
  source_id: WB:WBGene00020112
- source: RefSeq
  text: Predicted to enable unfolded protein binding activity. Predicted to be involved
    in RNA polymerase I assembly; RNA polymerase II core complex assembly; and RNA
    polymerase III assembly. Predicted to be part of prefoldin complex. Predicted
    to be active in cytoplasm. Is expressed in body wall musculature; head muscle;
    pharyngeal muscle cell; and vulval muscle. Orthologous to human PFDN5 (prefoldin
    subunit 5). [provided by Alliance of Genome Resources, Jun 2026]
  source_type: automated
