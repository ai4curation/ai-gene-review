- source: Alliance_Imported
  text: pfd-5 encodes a putative prefoldin 5 subunit, orthologous to human PFDN5 (OMIM:604899),
    that is required for normal microtubule growth, embryonic and larval viability,
    fertility, vulval development, and locomotion; PFD-5 is expressed in most, if
    not all, tissues; pfd-5(RNAi) animals show sterile progeny, larval arrest or lethality,
    uncoordination, and abnormal body shapes, and pfd-5(RNAi) embryos show a reduced
    microtubule growth rate.
