- term:
    id: GO:1990113
    label: RNA polymerase I assembly
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000293176
  - SGD:S000001871
  review:
    summary: IBA assigning a role in RNA polymerase assembly (RNA polymerase I assembly). In other species
      this role belongs to the R2TP/prefoldin-like complex (with URI, UXT and PDRG1), which shares some
      subunits with canonical prefoldin.
    action: KEEP_AS_NON_CORE
    reason: In C. elegans the R2TP/prefoldin-like complex is inferred from homology and from yeast two-hybrid
      data for PFD-6. Son et al. note that this complex promotes RNA polymerase II assembly in the cytoplasm
      [PMID:30478249]. No C. elegans experiment has tested PFD-5 in RNA polymerase assembly, and the experimental
      roles shown for PFD-5 involve canonical prefoldin. The phylogenetic inference is retained as a plausible
      non-core role.
    supported_by:
    - &id003
      reference_id: PMID:30478249
      supporting_text: The R2TP/prefodin-like complex promotes assembly of RNA polymerase II in the cytoplasm
        (Boulon et al. 2010).
