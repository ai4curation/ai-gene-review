  label: Caenorhabditis elegans
description: PFD-5 (R151.9) is an alpha-class subunit of C. elegans prefoldin, the ortholog of human PFDN5.
  The two alpha subunits of the prefoldin heterohexamer, together with four beta subunits, form a coiled-coil
  chamber. This chamber captures non-native actin and tubulin chains in the cytosol and transfers them
  to the CCT/TRiC chaperonin. PFD-5 interacts with PFD-6 in yeast two-hybrid assays. In C. elegans, prefoldin
  function is needed for normal alpha-tubulin levels, embryonic cell division and distal tip cell migration.
