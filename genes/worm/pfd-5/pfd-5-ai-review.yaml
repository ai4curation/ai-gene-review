- term:
    id: GO:0044183
    label: protein folding chaperone
  evidence_type: ISS
  original_reference_id: PMID:9630229
  review:
    summary: PFD-5 is a canonical prefoldin subunit, but GOA has no molecular-function annotation for
      it. The prefoldin hexamer has protein folding chaperone activity, and the other C. elegans subunits
      carry this term or an equivalent through IBA.
    action: NEW
    reason: 'Prefoldin is a chaperone that captures non-native actin and tubulin and transfers them to
      CCT [PMID:9630229]. PFD-5 is a conserved member of the prefoldin family and an obligate member of
      the hexamer, so it contributes to this activity. Comparator check: PFD-1 carries GO:0044183 by IBA,
      and the human orthologs (PFDN5, PFDN6) carry it in their reviews.'
    supported_by:
