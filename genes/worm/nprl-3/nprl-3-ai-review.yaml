- term:
    id: GO:0005096
    label: GTPase activator activity
  evidence_type: ISS
  original_reference_id: PMID:29590090
  qualifier: contributes_to
  supporting_entities:
  - UniProtKB:Q12980
  review:
    summary: As a GATOR1 subunit, NPRL-3 contributes to the complex's GAP activity toward
      the RagA/B GTPases.
    action: NEW
    reason: The molecular activity behind the accepted TORC1-inhibitory role is missing
      from GOA. In human GATOR1 the NPRL2-NPRL3 heterodimer executes GAP activity on
      RAGA; NPRL3 alone is not shown to be a GAP, so contributes_to is the correct form.
      The worm paralog-partner nprl-2 already carries contributes_to GTPase activator
      activity by IBA, so this aligns NPRL-3 with its complex partner. No worm
      biochemistry exists; the inference is by orthology (ISS) from human NPRL3.
    supported_by:
    - reference_id: PMID:29590090
      supporting_text: weaker interactions between the NPRL2-NPRL3 heterodimer and RAGA
        execute GAP activity
    - reference_id: PMID:23723238
      supporting_text: GATOR1 has GTPase-activating protein (GAP) activity for RagA and
        RagB
