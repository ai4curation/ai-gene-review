  review:
    summary: Curator transfer of lysosomal membrane location from human NPRL3.
    action: ACCEPT
    reason: Human NPRL3 (Q12980), as part of GATOR1, is recruited to the lysosomal surface
      by KICSTOR, and fly Nprl3 localizes to lysosomes. C. elegans NPRL-3 is a single-copy
      ortholog with no evidence of divergence; no worm localization data exist, so this
      remains an orthology-based location. Whether worms have a KICSTOR-like recruiter is
      an open question.
