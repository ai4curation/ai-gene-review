  review:
    summary: Conserved role of GATOR1 in shutting off TORC1 upon amino-acid withdrawal;
      not tested directly in C. elegans.
    action: KEEP_AS_NON_CORE
    reason: Loss of GATOR1 subunits including NPRL3 makes TORC1 signalling resistant to
      amino-acid deprivation in human cells, and Drosophila Nprl3 mediates the adaptive
      starvation response, so the IBA is well founded. It is the physiological context of
      the core TORC1-inhibitory role rather than a separate function, and the worm
      experiments addressed lipid (d17iso-GlcCer) rather than amino-acid signalling.
    supported_by:
