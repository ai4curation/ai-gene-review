- term:
    id: GO:0010508
    label: positive regulation of autophagy
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - FB:FBgn0036397
  - PANTHER:PTN000994527
  - SGD:S000001015
  review:
    summary: Autophagy induction is a downstream consequence of GATOR1-mediated TORC1
      inhibition; not tested for nprl-3 in C. elegans.
    action: KEEP_AS_NON_CORE
    reason: The IBA rests on yeast Npr3 and Drosophila Nprl3, whose mutants fail to induce
      autophagy on amino-acid limitation. The effect is mediated by TORC1 inhibition (the
      core process) rather than by a separate activity of NPRL3 in the autophagy
      machinery, so it is kept as a non-core, downstream process. C. elegans NPRL-3 is
      inside the NPR3 clade with no evidence of divergence.
    supported_by:
    - reference_id: PMID:27672113
      supporting_text: nprl2 and nprl3 mutants fail to activate autophagy in response to
        amino acid limitation
- term:
    id: GO:0032007
    label: negative regulation of TOR signaling
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR005365
  review:
    summary: Correct but general; the NPR3 family and worm genetics specifically implicate
      TORC1.
    action: MODIFY
    reason: The InterPro2GO mapping for the Npr3 family gives the general TOR-signalling
      term. GATOR1 acts on the Rag GTPases upstream of TORC1, and in C. elegans the
      nprl-3 suppression phenotype depends on TORC1 components (raga-1, rheb-1, rsks-1,
      ife-2). The child term negative regulation of TORC1 signaling (GO:1904262, is_a
      GO:0032007), which the gene already carries by IBA, is the precise term.
    proposed_replacement_terms:
    - id: GO:1904262
      label: negative regulation of TORC1 signaling
    supported_by:
    - reference_id: PMID:23705068
      supporting_text: Taken together, these results indicate that TORC1 acts downstream
        of d17iso-GlcCer and is negatively regulated by NPRL-3.
- term:
