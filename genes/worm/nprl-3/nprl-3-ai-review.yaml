id: Q20069
gene_symbol: nprl-3
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: >-
  nprl-3 (F35H10.7) encodes the C. elegans member of the NPR3/NPRL3 family, orthologous
  to yeast Npr3 and human NPRL3. By orthology it is a subunit of GATOR1 (with NPRL-2 and
  a DEPDC5-like subunit), the complex whose NPRL2-NPRL3 heterodimer acts as a
  GTPase-activating protein for the RagA/B GTPases at the lysosomal surface and thereby
  switches off nutrient signalling to TORC1. In C. elegans, nprl-3 was identified as a
  suppressor of the L1 growth arrest caused by loss of monomethyl branched-chain fatty
  acids or their derived glucosylceramide; genetic epistasis shows that this suppression
  requires TORC1 components, placing NPRL-3 (with NPRL-2) as a negative regulator of
  lipid-promoted intestinal TORC1 activity. nprl-3 loss also restores intestinal apical
  membrane polarity in lipid-deficient animals by a TORC1-independent route. The gene is
  expressed ubiquitously throughout development and adulthood.
