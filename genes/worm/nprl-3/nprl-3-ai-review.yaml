core_functions:
- description: As a predicted core subunit of GATOR1, NPRL-3 forms a heterodimer with
    NPRL-2 that executes GAP activity toward the RagA/B GTPases at the lysosomal surface,
    thereby inhibiting nutrient- and lipid-promoted TORC1 signalling. In C. elegans this
    restrains the d17iso-GlcCer/TORC1-dependent L1 growth programme in the intestine.
  contributes_to_molecular_function:
    id: GO:0005096
    label: GTPase activator activity
  directly_involved_in:
  - id: GO:1904262
    label: negative regulation of TORC1 signaling
  locations:
  - id: GO:0005765
    label: lysosomal membrane
  in_complex:
    id: GO:1990130
    label: GATOR1 complex
  supported_by:
  - reference_id: PMID:29590090
    supporting_text: weaker interactions between the NPRL2-NPRL3 heterodimer and RAGA
      execute GAP activity
  - reference_id: PMID:23705068
    supporting_text: Taken together, these results indicate that TORC1 acts downstream
      of d17iso-GlcCer and is negatively regulated by NPRL-3.
suggested_questions:
- question: Does C. elegans GATOR1 reach the lysosomal surface through a KICSTOR-like
    recruiter, given that worm NPRL-3 localization has not been examined?
- question: Is the TORC1-independent restoration of intestinal apical polarity by
    nprl-3 loss a direct activity of NPRL-3 or an indirect effect, and is it shared by
    NPRL-2?
- question: Which C. elegans protein is the DEPDC5-like GATOR1 subunit, and is it
    required for NPRL-3 function in L1 growth control?
suggested_experiments:
- description: Endogenously tag NPRL-3 (CRISPR knock-in GFP) and examine co-localization
    with lysosomal and apical membrane markers in the intestine under fed, amino-acid
    deprived and mmBCFA-deficient conditions.
  experiment_type: localization
- description: Reconstitute worm NPRL-2/NPRL-3 (with the DEPDC5-like subunit) and assay
    GAP activity on RAGA-1.
  experiment_type: biochemical assay
- description: Measure TORC1 output (e.g. phospho-S6K or 4E-BP readouts) in a nprl-3
    null allele under fed and starved conditions.
  experiment_type: genetic analysis
