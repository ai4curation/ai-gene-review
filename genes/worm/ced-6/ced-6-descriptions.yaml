gene_symbol: ced-6
organism: worm
uniprot_id: O76337
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: May function as an adapter protein in a pathway that mediates recognition
    and phagocytosis of apoptotic cells during normal development. Promotes engulfment
    of cells at both early and late stages of apoptosis. Required for actin reorganization
    around apoptotic cells. Plays a role in protecting dopaminergic neurons from oxidative
    stress- induced degeneration (PubMed:29346382). Mediates recruitment of E3 ubiquitin-protein
    ligase trim-21 to the apoptotic cell surface which promotes ubiquitination and
    degradation of ced-1 (PubMed:35929733).
  source_type: curated
  url: https://www.uniprot.org/uniprot/O76337
  source_id: O76337
- source: Alliance_Imported
  text: ced-6 encodes an Src homology (SH) 3 and phosphotyrosine-binding (PTB) domain-containing
    adaptor protein, orthologous to human CED-6/GULP, that is required for cell corpse
    engulfment during apoptosis; CED-6 is bound by the phosphotyrosine binding motif
    in the cytoplasmic tail of the transmembrane protein CED-1, and and within phagocytic
    cells this interaction may be part of a signal transduction pathway that promotes
    apoptotic cell engulfment.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00000420;class=Gene
  source_id: WB:WBGene00000420
- source: Alliance_Automated
  text: Enables clathrin-cargo adaptor activity and scavenger receptor binding activity.
    Involved in several processes, including engulfment of apoptotic cell; left/right
    axis specification; and positive regulation of distal tip cell migration. Located
    in cytoplasmic side of plasma membrane and phagocytic vesicle. Orthologous to
    human GULP1 (GULP PTB domain containing engulfment adaptor 1).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00000420;class=Gene
  source_id: WB:WBGene00000420
