descriptions:
- source: UniProt
  text: May function as an adapter protein in a pathway that mediates recognition
    and phagocytosis of apoptotic cells during normal development. Promotes engulfment
    of cells at both early and late stages of apoptosis. Required for actin reorganization
    around apoptotic cells. Plays a role in protecting dopaminergic neurons from oxidative
    stress- induced degeneration (PubMed:29346382). Mediates recruitment of E3 ubiquitin-protein
    ligase trim-21 to the apoptotic cell surface which promotes ubiquitination and
    degradation of ced-1 (PubMed:35929733).
  source_type: curated
  url: https://www.uniprot.org/uniprot/O76337
  source_id: O76337
