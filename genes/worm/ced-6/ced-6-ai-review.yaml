id: O76337
gene_symbol: ced-6
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: CED-6 is the C. elegans orthologue of mammalian GULP1, a cytoplasmic adaptor protein with an N-terminal
  phosphotyrosine-binding (PTB) domain, an adjacent leucine zipper that mediates homodimerization, and a proline/serine-rich
  C-terminal half. It acts in engulfing cells, where its PTB domain binds the NPXY motif in the cytoplasmic tail
  of the engulfment receptor CED-1. CED-6 is recruited with CED-1 around apoptotic cell corpses and, together with
  CED-7, it is needed for actin reorganization and corpse engulfment. It forms a complex with clathrin heavy chain
  and the AP2 adaptor complex on nascent phagosomes and acts upstream of dynamin DYN-1 and the Rac GTPase CED-10.
  CED-6 also recruits the E3 ubiquitin ligase TRIM-21 to CED-1, which leads to proteasomal turnover of the receptor.
  Like other engulfment genes, ced-6 helps engulfing cells promote the death of cells that receive weak death signals,
  and it contributes to the loss of dopaminergic neurons damaged by oxidative stress.
