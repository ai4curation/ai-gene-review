    beyond the clathrin/AP2 hub?
- question: Does the CED-6-dependent recruitment of TRIM-21, which degrades CED-1, act as negative feedback that
    terminates engulfment signalling after each corpse?
- question: Is GO:0035615 clathrin-cargo adaptor activity appropriate for an adaptor whose clathrin/AP2 complex
    appears to organize actin rather than form coated vesicles?
