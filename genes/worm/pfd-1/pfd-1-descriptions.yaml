gene_symbol: pfd-1
organism: worm
uniprot_id: Q17827
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Binds specifically to cytosolic chaperonin (c-CPN) and transfers target proteins
    to it. Binds to nascent polypeptide chain and promotes folding in an environment
    in which there are many competing pathways for nonnative proteins (By similarity).
    Has a role in gonadogenesis.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q17827
  source_id: Q17827
- source: Alliance_Imported
  text: pfd-1 encodes a putative prefoldin subunit 1, orthologous to human PFDN1 (OMIM:604897),
    that is required for normal microtubule nucleation and growth, embryonic viability,
    distal tip cell (DTC) migration, and locomotion; PFD-1 is expressed cytoplasmically
    in most, if not all, tissues; pfd-1(RNAi) animals have sterile progeny and are
    uncoordinated, and pfd-1(RNAi) embryos show a reduced microtubule growth rate;
    pfd-1(gk526) or escaper pfd-1(RNAi) hermaphrodites exhibit detective DTC migration.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00007443;class=Gene
  source_id: WB:WBGene00007443
- source: Alliance_Automated
  text: Predicted to enable protein folding chaperone. Involved in gonad development.
    Located in cytoplasm. Is expressed in body wall musculature; excretory cell; intestine;
    pharynx; and vulval muscle. Orthologous to human PFDN1 (prefoldin subunit 1).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00007443;class=Gene
  source_id: WB:WBGene00007443
- source: RefSeq
  text: Predicted to enable protein folding chaperone and unfolded protein binding
    activity. Involved in gonad development. Located in cytoplasm. Is expressed in
    body wall musculature; excretory cell; intestine; pharynx; and vulval muscle.
    Orthologous to human PFDN1 (prefoldin subunit 1). [provided by Alliance of Genome
    Resources, Jul 2025]
  source_type: automated
