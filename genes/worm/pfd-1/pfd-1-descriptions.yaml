    overall_notes: By-similarity prefoldin text plus gonadogenesis; correct but generic,
      and no tubulin/microtubule effect.
- source: Alliance_Imported
  text: pfd-1 encodes a putative prefoldin subunit 1, orthologous to human PFDN1 (OMIM:604897),
    that is required for normal microtubule nucleation and growth, embryonic viability,
    distal tip cell (DTC) migration, and locomotion; PFD-1 is expressed cytoplasmically
    in most, if not all, tissues; pfd-1(RNAi) animals have sterile progeny and are
    uncoordinated, and pfd-1(RNAi) embryos show a reduced microtubule growth rate;
    pfd-1(gk526) or escaper pfd-1(RNAi) hermaphrodites exhibit detective DTC migration.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00007443;class=Gene
