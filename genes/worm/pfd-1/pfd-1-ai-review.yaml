description: PFD-1 (C08F8.1) is a beta-class subunit of C. elegans prefoldin, the ortholog of human PFDN1.
  Prefoldin is a jellyfish-shaped heterohexamer of two alpha and four beta subunits. Its coiled-coil tentacles
  capture non-native actin and tubulin chains in the cytosol without ATP and pass them to the CCT/TRiC
  chaperonin for folding. In C. elegans, prefoldin RNAi lowers alpha-tubulin levels and slows microtubule
  growth, causing embryonic cell-division defects and lethality. pfd-1 mutants rescued by maternal protein
  reach L4 with gonad defects, including aberrant distal tip cell migration that CCT or tubulin RNAi phenocopies.
