    summary: pfd-1 mutants rescued maternally develop to L4 with gonadogenesis defects, including aberrant
      distal tip cell migration. CCT, tubulin and other prefoldin RNAi produce the same phenotype.
    action: KEEP_AS_NON_CORE
    reason: The IMP is valid but indirect. The gonad phenotype results from too little folded tubulin
