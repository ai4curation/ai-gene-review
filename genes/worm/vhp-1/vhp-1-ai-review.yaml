  review:
    summary: VHP-1 reduces MAPK phosphorylation; the term is correct but too broad.
    action: MODIFY
    reason: Adult and larval VHP-1 perturbation changes KGB-1 and PMK-1 phosphorylation, so the
      evidence is best captured as negative regulation of MAPK cascades rather than the parent
      negative regulation of protein phosphorylation.
