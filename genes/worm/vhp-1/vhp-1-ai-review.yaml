id: Q10038
gene_symbol: vhp-1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: 'VHP-1 is the C. elegans ortholog of MKP-7, a cytoplasmic dual-specificity MAP kinase
  phosphatase that dephosphorylates and inactivates stress-responsive MAPKs. It restrains the KGB-1/JNK
  pathway and PMK-type p38 pathways, thereby tuning heavy-metal stress, protein-folding stress, intestinal
  immunity, DAF-16/FOXO localization, adult lifespan, and axon-regeneration outputs of MAPK signaling.'
