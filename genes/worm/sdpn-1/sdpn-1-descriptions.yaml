descriptions:
- source: Alliance_Imported
  text: sdpn-1 encodes the C. elegans syndapin ortholog; an SDPN-1::GFP fusion protein
    is highly expressed in the intestine, where it localizes to basolateral recycling
    endosomes; SDPN-1 localization to basolateral recycling endosomes is dependent
    upon ALX-1, one of two C. elegans Bro1 domain-containing proteins, and RME-1.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00018467;class=Gene
  source_id: WB:WBGene00018467
