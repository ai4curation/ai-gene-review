      score: 4
    - rubric: completeness
      score: 3
    - rubric: specificity
      score: 3
    overall_notes: Correct syndapin with basolateral recycling endosome localization
      dependent on ALX-1 and RME-1; no F-BAR tubulation or actin role.
- source: Alliance_Automated
  text: Predicted to enable phospholipid binding activity. Involved in endocytic recycling.
    Located in early endosome and recycling endosome membrane. Is expressed in intestine;
    pharyngeal muscle cell; and pharynx. Used to study Huntington's disease and neurodegenerative
    disease. Human ortholog(s) of this gene implicated in congenital myopathy 27.
    Orthologous to human PACSIN1 (protein kinase C and casein kinase substrate in
    neurons 1); PACSIN2 (protein kinase C and casein kinase substrate in neurons 2);
    and PACSIN3 (protein kinase C and casein kinase substrate in neurons 3).
  source_type: automated
