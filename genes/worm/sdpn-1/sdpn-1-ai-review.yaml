taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: SDPN-1 is the only Caenorhabditis elegans syndapin/PACSIN, an F-BAR domain protein with a
  C-terminal SH3 domain. Full-length SDPN-1 binds acidic phospholipids and tubulates membranes in vitro,
  and in the intestinal epithelium it resides on RAB-5 early endosomes and RME-1 basolateral recycling
  endosomes, recruited in a PI(4,5)P2-dependent manner. Loss of sdpn-1 traps recycling cargo (transferrin
  receptor, hTAC, DAF-4) in hybrid early/recycling endosomes and abolishes the F-actin enrichment normally
  found on early endosomes, indicating that SDPN-1 couples membrane curvature to actin assembly to drive
  endosomal fission and cargo exit toward the plasma membrane. Its SH3 domain binds the proline-rich domain
  of dynamin DYN-1 in the SH3 interactome, and SDPN-1 co-localizes with the amphiphysin AMPH-1 on recycling
  endosomes. A role for SDPN-1 in synaptic vesicle endocytosis, as for mammalian syndapin 1, has not been
  examined in the worm.
