        label: early endosome
      - id: GO:0055037
        label: recycling endosome
    supported_by:
      - reference_id: PMID:27630264
        supporting_text: Full-length recombinant SDPN-1 tubulates acidic membranes in vitro
      - reference_id: PMID:27630264
        supporting_text: We find that SDPN-1 is a resident protein of the early and basolateral recycling
          endosomes in the C. elegans intestinal epithelium, and sdpn-1 deletion mutants display phenotypes
          indicating a block in basolateral recycling transport.
      - reference_id: PMID:27630264
        supporting_text: Furthermore, we observed strong colocalization of endosomal SDPN-1 with the F-actin
          biosensor Lifeact, and found that loss of SDPN-1 greatly reduced Lifeact accumulation on early
          endosomes.
