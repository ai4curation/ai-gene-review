suggested_questions:
  - question: Does SDPN-1 act at C. elegans synapses (syndapin 1 is a presynaptic dynamin partner in mammals),
      and do sdpn-1 mutants show any synaptic vesicle recycling phenotype?
  - question: Which actin nucleation-promoting factor does the SDPN-1 SH3 domain recruit to endosomes
      (WSP-1/N-WASP, Cobl homolog), and is DYN-1 the fission GTPase on SDPN-1 tubules?
suggested_experiments:
  - description: Aldicarb sensitivity, evoked EPSC recordings and SNB-1::pHluorin retrieval in sdpn-1(ok1667)
      and sdpn-1; unc-57 double mutants.
    hypothesis: SDPN-1 contributes to presynaptic membrane retrieval alongside endophilin, as syndapin
      1 does in mammals.
