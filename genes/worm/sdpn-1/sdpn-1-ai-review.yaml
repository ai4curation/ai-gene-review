references:
  - id: GO_REF:0000033
    title: Annotation inferences using phylogenetic trees
    findings: []
  - id: PMID:27630264
    title: Syndapin/SDPN-1 is required for endocytic recycling and endosomal actin association in the
      C. elegans intestine.
    findings:
      - statement: Only worm syndapin.
        supporting_text: Here we analyze the endocytic transport function of the only C. elegans syndapin,
          SDPN-1.
      - statement: Resident of early and recycling endosomes; mutants block basolateral recycling.
        supporting_text: We find that SDPN-1 is a resident protein of the early and basolateral recycling
          endosomes in the C. elegans intestinal epithelium, and sdpn-1 deletion mutants display phenotypes
          indicating a block in basolateral recycling transport.
      - statement: Mutants accumulate hybrid endosomes with trapped cargo.
        supporting_text: sdpn-1 mutants accumulate abnormal endosomes positive for early endosome and
          recycling endosome markers that are normally separate, and such endosomes accumulate high levels
          of basolateral recycling cargo.
      - statement: SDPN-1 co-localizes with F-actin and is needed for its endosomal enrichment.
        supporting_text: Furthermore, we observed strong colocalization of endosomal SDPN-1 with the F-actin
          biosensor Lifeact, and found that loss of SDPN-1 greatly reduced Lifeact accumulation on early
          endosomes.
      - statement: Proposed endosomal fission function.
        supporting_text: Taken together our results provide strong evidence for an in vivo function of
          syndapin in endocytic recycling, and suggest that syndapin promotes transport via endosomal
          fission.
      - statement: Full-length SDPN-1 tubulates acidic membranes.
        supporting_text: Full-length recombinant SDPN-1 tubulates acidic membranes in vitro
      - statement: F-BAR and SH3 domain architecture.
        supporting_text: Like its mammalian homologues, SDPN-1 contains one conserved N-terminal F-BAR
          domain and a single C-terminal SH3 domain (Figure 1, A and B).
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: Full text cached; primary functional study.
