  - description: 'F-BAR phospholipid binding and membrane tubulation on early/recycling endosomes: SDPN-1
      binds PI(4,5)P2-containing endosomal membranes, tubulates them and recruits actin assembly through
      its SH3 domain to drive fission of recycling carriers, allowing basolateral cargo to exit endosomes
      and return to the plasma membrane.'
