gene_symbol: unc-11
organism: worm
uniprot_id: Q9XZI6
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Assembly protein recruiting clathrin and adaptor protein complex 2 (AP2) to
    cell membranes at sites of coated-pit formation and clathrin-vesicle assembly.
    May be required to determine the amount of membrane to be recycled, possibly by
    regulating the size of the clathrin cage. Involved in AP2-dependent clathrin-mediated
    endocytosis at the neuromuscular junction. Required for the efficient targeting
    of the synaptic vesicle protein synaptobrevin.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q9XZI6
  source_id: Q9XZI6
- source: Alliance_Imported
  text: unc-11 encodes multiple isoforms of a clathrin-adaptor protein AP180 (OMIM:603025)
    that functions in clathrin-mediated endocytosis; UNC-11 is essential for embryogenesis,
    locomotion, and pharyngeal pumping, and regulates neurotransmitter release by
    controlling vesicle trafficking and fusion; UNC-11 is also required for localization
    of SNB-1/synaptobrevin to synaptic vesicles, thus acting as a sorting protein
    as well as a clathrin-adaptor protein; UNC-11 is expressed at high levels in nearly
    all neurons, where it is enriched at presynaptic terminals, and is also expressed
    in coelomocytes, the uv1 secretory cells of the vulva, and the intestine.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00006751;class=Gene
  source_id: WB:WBGene00006751
- source: Alliance_Automated
  text: Predicted to enable SNARE binding activity; clathrin heavy chain binding activity;
    and phospholipid binding activity. Involved in several processes, including endocytosis;
    necroptotic process; and protein localization to postsynaptic membrane. Located
    in clathrin-coated pit and presynaptic membrane. Is expressed in several structures,
    including epithelial cell; excretory gland cell; nervous system; pharyngeal gland
    cell; and rectal gland cell. Human ortholog(s) of this gene implicated in acute
    myeloid leukemia. Orthologous to human PICALM (phosphatidylinositol binding clathrin
    assembly protein) and SNAP91 (synaptosome associated protein 91).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00006751;class=Gene
  source_id: WB:WBGene00006751
