descriptions:
- source: UniProt
  text: Assembly protein recruiting clathrin and adaptor protein complex 2 (AP2) to
    cell membranes at sites of coated-pit formation and clathrin-vesicle assembly.
    May be required to determine the amount of membrane to be recycled, possibly by
    regulating the size of the clathrin cage. Involved in AP2-dependent clathrin-mediated
    endocytosis at the neuromuscular junction. Required for the efficient targeting
    of the synaptic vesicle protein synaptobrevin.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q9XZI6
  source_id: Q9XZI6
