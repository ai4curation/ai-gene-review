- source: Alliance_Imported
  text: unc-11 encodes multiple isoforms of a clathrin-adaptor protein AP180 (OMIM:603025)
    that functions in clathrin-mediated endocytosis; UNC-11 is essential for embryogenesis,
    locomotion, and pharyngeal pumping, and regulates neurotransmitter release by
    controlling vesicle trafficking and fusion; UNC-11 is also required for localization
    of SNB-1/synaptobrevin to synaptic vesicles, thus acting as a sorting protein
    as well as a clathrin-adaptor protein; UNC-11 is expressed at high levels in nearly
    all neurons, where it is enriched at presynaptic terminals, and is also expressed
    in coelomocytes, the uv1 secretory cells of the vulva, and the intestine.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00006751;class=Gene
  source_id: WB:WBGene00006751
