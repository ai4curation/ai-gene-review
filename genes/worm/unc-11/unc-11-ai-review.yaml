  review:
    summary: IBA SNARE binding from the AP180/CALM family node (human PICALM, rat AP180/CALM, plant and
      Dictyostelium members). In the worm, UNC-11 is required specifically to localise the R-SNARE synaptobrevin
      to synaptic vesicles while other vesicle proteins are targeted normally, matching the ANTH-domain
      VAMP-binding function of the family.
    action: ACCEPT
    reason: 'Core molecular function: the ANTH domain captures synaptobrevin as cargo during vesicle regeneration,
      and the worm phenotype is the in vivo signature of that binding.'
    supported_by:
    - reference_id: PMID:10397769
      supporting_text: Furthermore, the UNC-11 protein is required to localize synaptobrevin, but not
        other synaptic vesicle proteins, to synaptic sites.
    - reference_id: PMID:10397769
      supporting_text: 'We conclude that AP180 provides dual functions for the biogenesis of synaptic
        vesicles: to recruit synaptobrevin to synaptic vesicle membranes and to regulate vesicle diameter
        during clathrin assembly.'
