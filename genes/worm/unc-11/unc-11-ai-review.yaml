- id: PMID:10397769
  title: UNC-11, a Caenorhabditis elegans AP180 homologue, regulates the size and protein composition
    of synaptic vesicles.
  findings:
  - statement: unc-11 encodes the worm AP180 homologue, enriched at presynaptic terminals.
    supporting_text: In neurons, UNC-11 is enriched at presynaptic terminals but is also present in cell
      bodies.
  - statement: UNC-11 is required to localise synaptobrevin but not other synaptic vesicle proteins.
    supporting_text: Furthermore, the UNC-11 protein is required to localize synaptobrevin, but not other
      synaptic vesicle proteins, to synaptic sites.
  - statement: Synaptic membrane is still endocytosed in unc-11 nulls but vesicles are 33% larger.
    supporting_text: In the two null mutants, mean vesicle diameter was 33% larger ( unc-11(e47) 39.1
      ± 7.3 nm; unc-11(q358) 40.4 ± 8.0 nm).
  - statement: The UNC-11 C-terminus promotes clathrin assembly in vitro.
    supporting_text: Likewise, the C-terminal region of UNC-11 promotes clathrin assembly in vitro despite
      minimal sequence similarity with AP180 (Golan, Prasad, Lafer, and Alfonso, unpublished data).
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached; primary characterisation of unc-11.
