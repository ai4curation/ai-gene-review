- term:
    id: GO:0006511
    label: ubiquitin-dependent protein catabolic process
  evidence_type: IMP
  original_reference_id: PMID:12123612
  qualifier: involved_in
  review:
    summary: 'Abstract-only: ubiquitin overexpression lowers GLR-1 abundance at synapses and this requires
      unc-11. UNC-11 performs the clathrin-dependent internalisation of ubiquitinated GLR-1; whether the
      receptor is then degraded, and whether UNC-11 contributes to that degradation, is not shown.'
    action: MARK_AS_OVER_ANNOTATED
    reason: UNC-11 executes the endocytic removal step that ubiquitination triggers, so the annotation
      is not wrong, but 'ubiquitin-dependent protein catabolic process' asserts participation in proteolytic
      breakdown that the evidence does not establish; the receptor-abundance regulation row from the same
      paper captures the finding better.
    supported_by:
    - reference_id: PMID:12123612
      supporting_text: overexpression of ubiquitin decreased the abundance of GLR-1 at synapses and decreased
        the density of GLR-1-containing synapses, and these effects were prevented by mutations in the
        unc-11 gene, which encodes a clathrin adaptin protein (AP180).
