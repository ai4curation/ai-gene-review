gene_symbol: unc-11
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: 'unc-11 encodes the Caenorhabditis elegans orthologue of AP180 (PICALM/SNAP91 family), a
  monomeric clathrin assembly protein expressed at high levels throughout the nervous system and at lower
  levels in coelomocytes, vulval uv1 cells and intestine. Its conserved N-terminal ANTH domain binds phosphatidylinositol-4,5-bisphosphate
  on the cytoplasmic face of the presynaptic membrane and engages the R-SNARE synaptobrevin, while the
  divergent, disordered C-terminal assembly domain binds clathrin heavy chain, promotes clathrin lattice
  assembly and couples the coat to actin. Through these activities UNC-11 sorts synaptobrevin into regenerating
  synaptic vesicles and constrains the size of the budded vesicle: null mutants are viable but uncoordinated,
  synaptobrevin is mislocalised away from synaptic vesicles, membrane retrieval continues but vesicles
  are about 33% larger in diameter, and neurotransmitter release is greatly reduced. UNC-11 also mediates
  clathrin-dependent endocytosis of the postsynaptic AMPA-type glutamate receptor GLR-1, coupling ubiquitin-dependent
  receptor removal to synaptic strength.'
