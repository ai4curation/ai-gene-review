core_functions:
- description: >-
    Secreted cysteine-type GPx-family peroxidase. GPX-3 is predicted to reduce
    organic hydroperoxides, and possibly hydrogen peroxide, outside the cell
    using Cys73, and so to detoxify oxidants. Its physiological reductant,
    glutathione or thioredoxin, is unknown.
  molecular_function:
