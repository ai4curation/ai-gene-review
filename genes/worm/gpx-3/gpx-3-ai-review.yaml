suggested_questions:
- question: >-
    Does GPX-3, a Cys-type GPx with Cys73 in place of selenocysteine, use
    glutathione, thioredoxin or another reductant to regenerate its
    peroxidatic cysteine? Should the glutathione peroxidase activity inherited
    from PTN000904512 be restricted or qualified for nematode SF88 proteins?
- question: >-
    Where is GPX-3 expressed, and into which extracellular compartment
    (pseudocoelom, cuticle, intestinal lumen or another surface) is it secreted?
- question: >-
    Do the SF88 proteins GPX-3 and GPX-5 have distinct extracellular substrates
    or stress-protection roles in C. elegans, given that the complete gpx-5
    review found an arsenite-sensitive RNAi phenotype not detected for gpx-3?
suggested_experiments:
- description: >-
    Express recombinant mature GPX-3 (residues 19-224) and measure hydrogen
    peroxide, cumene hydroperoxide and phospholipid hydroperoxide reduction in
    coupled assays using GSH/glutathione reductase/NADPH or
    thioredoxin/thioredoxin reductase/NADPH as alternative electron-donor
    systems. Include a C73S mutant as a catalytic control.
  hypothesis: >-
    GPX-3 is a Cys-dependent peroxide reductase, and the preferred reducing
    system will determine whether it should be annotated specifically to
    glutathione peroxidase activity.
- description: >-
    Tag the endogenous gpx-3 locus with a fluorescent protein and create a
    gpx-3 deletion allele, then assay localization and sensitivity to arsenite,
    juglone, tert-butyl hydroperoxide, hydrogen peroxide and cuticle/surface
    oxidants alone and in a gpx-5-deficient background.
  hypothesis: >-
    GPX-3 is secreted to a specific extracellular compartment and contributes
    to antioxidant defense under stresses that may not have been captured by
    the original single-gene feeding-RNAi screen.
