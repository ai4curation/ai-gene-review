  label: Caenorhabditis elegans
description: >-
  gpx-3 (C11E4.2) encodes a 224-residue Caenorhabditis elegans glutathione
  peroxidase-family protein with a predicted N-terminal signal peptide. It is a
  member of PANTHER subfamily PTHR11592:SF88, together with secreted/cuticular
  nematode GPx proteins, and is expected to act as an extracellular peroxidase.
  GPX-3 has a cysteine at the peroxidatic position (Cys73) in place of the
  selenocysteine used by vertebrate GPX1-type enzymes, so its reducing substrate
  is not known. The only gpx-3-specific experiment in the literature is an RNAi
  stress screen in which gpx-3 knockdown did not produce significant sensitivity
  to juglone or arsenite; no direct biochemical or localization study of GPX-3
  has been reported.
