  review:
    summary: >-
      This row maps the UniProt extracellular subcellular location to
      GO:0005576.
    action: ACCEPT
    reason: >-
      UniProt predicts a cleavable N-terminal signal peptide at residues 1-18,
      and GPX-3 has no annotated transmembrane segment. The PTHR11592:SF88
