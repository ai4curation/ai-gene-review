  review:
    summary: >-
      This PAINT IBA places glutathione peroxidase activity at PTN000904512.
      The node's descendant evidence comes from vertebrate GPx enzymes (GPX1,
      GPX2, GPX3 and their rodent orthologues), all of which have selenocysteine
      at the peroxidatic position.
    action: UNDECIDED
    reason: >-
      The PAINT node placement is reasonable for the GPx family as a whole, but
      GPX-3 has Cys73 at the peroxidatic position instead of selenocysteine.
      The experimental donors supporting this PAINT assertion are Sec-GPxs,
      whereas Cys-GPx enzymes in other clades can use thioredoxin rather than
      glutathione as their reductant. No gpx-3 biochemical assay has measured
      glutathione-dependent peroxide reduction, so peroxidase activity is kept
      as the core molecular function and glutathione dependence is left
      undecided.
