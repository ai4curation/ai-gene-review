  review:
    summary: >-
      This InterPro2GO row comes from the glutathione peroxidase family signature
      (IPR000889). GPX-3 has the full GPx fold, and its peroxidatic cysteine and
      GPx-family signatures are intact.
    action: ACCEPT
    reason: >-
      Family membership is clear: UniProt places GPX-3 in IPR000889, Pfam
      GSHPx, PIRSF000303 and the three GPx PROSITE signatures, and its sequence
      matches PANTHER PTHR11592:SF88. The catalytic Sec position is replaced by
      Cys73, which aligns with human GPX1 Sec49 in the conserved GPx active-site
      motif (GPX1 NVASLUGTT; GPX-3 NVATFCAYT). Cys-GPx enzymes still reduce
      hydroperoxides, although their physiological electron donors and peroxide
      substrates differ. Peroxidase activity is therefore the most specific
      confident molecular function, while glutathione dependence is left undecided on the
      GO:0004602 rows below.
    supported_by:
