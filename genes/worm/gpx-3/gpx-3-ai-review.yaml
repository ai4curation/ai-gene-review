- term:
    id: GO:0005576
    label: extracellular region
  evidence_type: ISS
  original_reference_id: PMID:23593298
  qualifier: located_in
  supporting_entities:
  - UniProtKB:P22352
  review:
    summary: >-
      WormBase made this ISS row by similarity to human GPX3, a secreted plasma
      GPx, citing the Luersen et al. 2013 glutathione-metabolism RNAi screen.
    action: ACCEPT
    reason: >-
      Human GPX3 is not evidence for the exact reductant preference of nematode
      SF88 proteins because it is a Sec-GPx in a different PANTHER subfamily.
      The location transfer is sound, however: both human GPX3 and C. elegans
      GPX-3 are secretory GPx-family proteins, and the C. elegans protein has a
      predicted signal peptide at residues 1-18. The Luersen et al. paper itself
      is a stress-screen citation rather than a localization study, so it is
      best read as a WormBase similarity-transfer citation. This row is
      consistent with the UniProt SubCell mapping.
    supported_by:
    - reference_id: file:worm/gpx-3/gpx-3-uniprot.txt
      record_section: ["FT:SIGNAL"]
      supporting_text: SIGNAL          1..18
- term:
    id: GO:0006979
    label: response to oxidative stress
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR000889
  review:
    summary: >-
      This is a family-level InterPro2GO process row for GPx-family proteins.
    action: KEEP_AS_NON_CORE
    reason: >-
      A secreted GPx-fold peroxidase plausibly protects against oxidative insult
      by reducing peroxides, and nothing in the GPX-3 sequence argues for loss
      of that activity. No more specific oxidative-stress response term is
      supported for this gene: in the Luersen et al. RNAi screen, gpx-3
      knockdown did not reduce survival under juglone or arsenite. This
      family-level response term is therefore retained as non-core
      antioxidant-defense context.
    supported_by:
