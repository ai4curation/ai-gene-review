descriptions:
- source: Alliance_Imported
  text: nud-1 encodes the C. elegans ortholog of the Aspergillus nidulans nudC, which
    mediates nuclear migration along Aspergillus hyphae.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00003829;class=Gene
  source_id: WB:WBGene00003829
- source: Alliance_Automated
  text: Is expressed in gonad; hypodermis; intestine; and neurons. Used to study epilepsy
    and lissencephaly. Orthologous to human NUDC (nuclear distribution C, dynein complex
    regulator).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00003829;class=Gene
  source_id: WB:WBGene00003829
- source: RefSeq
  text: Enables protein folding chaperone and unfolded protein binding activity. Involved
    in several processes, including GABAergic synaptic transmission; pronuclear migration;
    and vulval development. Predicted to be located in synapse. Predicted to be active
    in cytoplasm. Is expressed in gonad; hypodermis; intestine; and neurons. Used
    to study epilepsy and lissencephaly. Orthologous to human NUDC (nuclear distribution
    C, dynein complex regulator). [provided by Alliance of Genome Resources, Jun 2026]
  source_type: automated
  url: https://www.ncbi.nlm.nih.gov/gene/176754
  source_id: GeneID:176754
