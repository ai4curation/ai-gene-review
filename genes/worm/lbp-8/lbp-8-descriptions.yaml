gene_symbol: lbp-8
organism: worm
uniprot_id: O02324
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Lysosomal lipid chaperone which binds to a wide range of unsaturated fatty
    acids, including high affinity binding to oleic acid and oleoylethanolamide, to
    transport them into the nucleus (PubMed:25554789, PubMed:31292465). As part of
    a lysosome-to-nucleus retrograde lipid signaling pathway, translocates into the
    nucleus where it activates the transcription of genes promoting longevity and
    activation of mitochondrial beta oxidation (PubMed:25554789, PubMed:30713071).
  source_type: curated
  url: https://www.uniprot.org/uniprot/O02324
  source_id: O02324
- source: Alliance_Imported
  text: lpb-8 belongs to a family of small intracellular fatty acid binding proteins
    (FABPs) that includes As-p18, found in the parasitic nematode Ascaris suum; lpb-8
    shares 55% identity with bovine heart FABP but only 25% identity with As-p18 and
    lacks a secretory signal
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00002260;class=Gene
  source_id: WB:WBGene00002260
- source: Alliance_Automated
  text: Enables long-chain fatty acid transmembrane transporter activity and oleic
    acid binding activity. Involved in long-chain fatty acid transport. Located in
    lysosome and nucleus. Human ortholog(s) of this gene implicated in Charcot-Marie-Tooth
    disease type 1G; hypertension; and type 2 diabetes mellitus. Orthologous to several
    human genes including FABP3 (fatty acid binding protein 3); FABP7 (fatty acid
    binding protein 7); and FABP9 (fatty acid binding protein 9).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00002260;class=Gene
  source_id: WB:WBGene00002260
