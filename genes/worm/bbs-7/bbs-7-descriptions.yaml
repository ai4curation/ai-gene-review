taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Component of the BBSome complex (By similarity). The BBSome complex is thought
    to function as a coat complex required for sorting of specific membrane proteins
    to the primary cilia (By similarity). The BBSome complex is required for ciliogenesis
    but is dispensable for centriolar satellite function (By similarity). Required
    for proper BBSome complex assembly and its ciliary localization (By similarity).
    Required for cilia biogenesis and both the assembly and movement of intraflagellar
    transport proteins along the ciliary axoneme (PubMed:15231740, PubMed:17000880,
    PubMed:22022287, PubMed:22922713, PubMed:26150102). Plays a role in the removal
    of degraded mechanosensory receptors within the cilia (PubMed:26150102). Plays
    a role in guanylyl cyclase localization in the ring-like structures at the base
    of the finger compartment in AFD sensory neurons (PubMed:25335890). In ciliated
    sensory neurons, required for the sensation of nitric oxide and avoidance of NO-producing
    organisms like P.aeruginosa (PubMed:30014846).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q9XW70
  source_id: Q9XW70
- source: Alliance_Imported
  text: osm-12 encodes a protein that is an ortholog to human BBS7; osm-12 along with
    bbs-8 is required for cilia biogenesis and function, accordingly, osm-12 mutant
    animals display odorant chemotaxis defects; oms-12 and bbs-8 are required for
    intraflagellar transport (IFT) and the motility and function of IFT proteins like
    OSM-5, CHE-11 and CHE-2; in addition to the sensory defects exhibited by bbs mutants,
    osm-12 and bbs-8 mutants also show reduced body size, developmental delay, and
    altered roaming, which are rescued by mutations in the guanylate complex GCY-35/GCY-36,
    suggesting that BBS proteins may regulate cGMP signaling; OSM-12 is expressed
    exclusively in ciliated sensory neurons, where it localizes predominantly to the
    base of cilia, known as the ciliary transition zone; DNA sequences upstream of
    osm-12 contain X box DNA binding sites, suggesting that osm-12 expression may
    be regulated by the DAF-19 RFX-type transcription factor.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00003892;class=Gene
  source_id: WB:WBGene00003892
- source: Alliance_Automated
  text: Involved in chemotaxis; cilium organization; and protein localization to microvillus
    membrane. Located in ciliary basal body; neuron projection; and non-motile cilium.
    Is expressed in nervous system. Used to study Bardet-Biedl syndrome. Human ortholog(s)
    of this gene implicated in Bardet-Biedl syndrome and Bardet-Biedl syndrome 7.
    Orthologous to human BBS7 (Bardet-Biedl syndrome 7).
