gene_symbol: rpn-10
organism: worm
uniprot_id: O61742
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Binds and presumably selects ubiquitin-conjugates for destruction (By similarity).
    Required for protein degradation and ubiquitin-proteasome system (UBS) function
    and regulates proteasomal subunit expression (PubMed:20453865, PubMed:22105480,
    PubMed:26828939). Involvement in UBS might be cell type specific (PubMed:20453865).
    Regulator of the autophagy-lysosome pathway that may confer resistance to autophagy
    by regulating the expression of autophagy-related proteins such as lgg-1, and
    by regulating lysosome formation, possibly by modulating elt-2 activity (PubMed:26828939).
    Required for fertility, sperm production, and sex determination through regulation
    of tra-2 protein (PubMed:17050737). Plays a role in the elimination of paternal
    mitochondria in fertilized eggs (PubMed:22105480).
  source_type: curated
  url: https://www.uniprot.org/uniprot/O61742
  source_id: O61742
- source: Alliance_Imported
  text: rpn-10 encodes a protein that contains two ubiquitin interaction motifs and
    is a member of the von Willebrand factor, type A superfamily similar to the mouse
    26S proteasome non-ATP regulatory subunit 4.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00004466;class=Gene
  source_id: WB:WBGene00004466
- source: Alliance_Automated
  text: Predicted to enable polyubiquitin modification-dependent protein binding activity.
    Involved in spermatogenesis and ubiquitin-dependent protein catabolic process.
    Located in cytoplasm and nucleus. Is expressed in several structures, including
    excretory cell; gonad; intestine; pharynx; and vulva. Orthologous to human PSMD4
    (proteasome 26S subunit ubiquitin receptor, non-ATPase 4).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00004466;class=Gene
