descriptions:
- source: UniProt
  text: Receptor for members of the ephrin family (By similarity). Receptor for major
    sperm proteins (MSPs), that functions as a sperm- sensing checkpoint which inhibits
    oocyte meiotic maturation and ovulation when sperm are not available for fertilization
    (PubMed:12533508). Specifically, functions to negatively regulates oocyte maturation
    and MAPK activation in the absence of MSPs (PubMed:12533508, PubMed:19853560).
    Required for the MSP-mediated increase in the basal sheath cell contraction rate
    in somatic cells (PubMed:12533508). Phosphorylates phosphatase daf-18/PTEN which
    probably promotes daf-18 degradation (PubMed:19853560). By inactivating daf-18,
    positively regulates insulin-like daf-2 signaling cascade (PubMed:9506518). Involved
    in interactions between neuronal substrate cells and a migrating epithelial sheet
    in head epidermis morphogenesis (PubMed:9506518). Also required for cell movements
    following gastrulation and during ventral closure of the epidermis (PubMed:9506518).
    Might play a role in spermatheca morphogenesis (PubMed:25529479). Involved in
    axon guidance of SDQL neurons during neurogenesis (PubMed:26903502).
  source_type: curated
  url: https://www.uniprot.org/uniprot/O61460
  source_id: O61460
- source: Alliance_Imported
  text: vab-1 encodes an ephrin receptor; during development, vab-1 activity is required
    for neural and epithelial morphogenesis as well as for proper axon targeting and
    neuronal cell migration; in addition, VAB-1 functions as a major sperm protein
    receptor in a sperm-sensing control mechanism that regulates oocyte meiotic maturation;
    VAB-1::GFP reporters are expressed in neuronal cells and in oocytes and sheath
    cells of the proximal gonad.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00006868;class=Gene
  source_id: WB:WBGene00006868
- source: Alliance_Automated
  text: Enables ephrin receptor activity and protein domain specific binding activity.
    Involved in several processes, including embryonic morphogenesis; oocyte maturation;
    and regulation of axon guidance. Located in axon and plasma membrane. Is expressed
    in several structures, including neuroblasts; neurons; oocyte; seam cell; and
    somatic nervous system. Human ortholog(s) of this gene implicated in several diseases,
    including autosomal dominant nonsyndromic deafness 88; cataract 6 multiple types;
    central conducting lymphatic anomaly; pancreatic cancer; and prostate cancer.
    Orthologous to several human genes including EPHB4 (EPH receptor B4).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00006868;class=Gene
  source_id: WB:WBGene00006868
