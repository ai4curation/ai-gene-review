descriptions:
- source: UniProt
  text: Receptor for members of the ephrin family (By similarity). Receptor for major
    sperm proteins (MSPs), that functions as a sperm- sensing checkpoint which inhibits
    oocyte meiotic maturation and ovulation when sperm are not available for fertilization
    (PubMed:12533508). Specifically, functions to negatively regulates oocyte maturation
    and MAPK activation in the absence of MSPs (PubMed:12533508, PubMed:19853560).
    Required for the MSP-mediated increase in the basal sheath cell contraction rate
    in somatic cells (PubMed:12533508). Phosphorylates phosphatase daf-18/PTEN which
    probably promotes daf-18 degradation (PubMed:19853560). By inactivating daf-18,
    positively regulates insulin-like daf-2 signaling cascade (PubMed:9506518). Involved
    in interactions between neuronal substrate cells and a migrating epithelial sheet
    in head epidermis morphogenesis (PubMed:9506518). Also required for cell movements
    following gastrulation and during ventral closure of the epidermis (PubMed:9506518).
    Might play a role in spermatheca morphogenesis (PubMed:25529479). Involved in
    axon guidance of SDQL neurons during neurogenesis (PubMed:26903502).
