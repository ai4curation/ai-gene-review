  title: WormBase gene description for vab-1 (worm)
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: WormBase curated description. The claims checked are correct. VAB-1
      is an ephrin receptor required for neural and epithelial morphogenesis (PMID:9506518)
      and for axon guidance and neuronal migration (PMID:10409513, PMID:26903502).
      It acts as an MSP receptor in the sperm-sensing control of oocyte maturation
      (PMID:12533508). Expression in neurons, oocytes and proximal sheath cells is
      consistent with the review.
core_functions:
- description: 'Ephrin receptor: transmembrane receptor tyrosine kinase at the plasma membrane that binds
    the ephrins EFN-1/2/3 and signals, partly through its kinase, to organise neuroblast and epidermal
    cell movements during embryonic ventral enclosure.'
  molecular_function:
    id: GO:0005003
    label: ephrin receptor activity
  directly_involved_in:
  - id: GO:0048013
    label: ephrin receptor signaling pathway
  - id: GO:0016331
    label: morphogenesis of embryonic epithelium
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:10619431
    supporting_text: We show that the ephrin VAB-2 (also known as EFN-1) is a ligand for VAB-1 and can
      function in neurons to regulate epidermal morphogenesis.
  - reference_id: PMID:9506518
    supporting_text: vab-1 mutants are defective in the movement of neuroblasts during closure of the
      ventral gastrulation cleft and in the movements of epidermal cells during ventral enclosure of the
      embryo by the epidermis.
  - reference_id: PMID:22197242
    supporting_text: Bridge formation requires VAB-1 kinase-dependent extension of presumptive bridge
      cells over scaffold cells toward the ventral midline.
- description: Axon guidance receptor that limits axon extension and prevents ventral midline crossing,
    likely by transducing a repellent or stop cue.
  molecular_function:
    id: GO:0005003
    label: ephrin receptor activity
  directly_involved_in:
  - id: GO:0007411
    label: axon guidance
  supported_by:
  - reference_id: PMID:10409513
    supporting_text: SAX-3/Robo and the VAB-1/Eph receptor both function to prevent aberrant axon crossing
      at the ventral midline.
  - reference_id: PMID:16386725
    supporting_text: the VAB-1 Eph RTK is required for targeting or limiting axons and neuronal cells
      to specific regions, perhaps by transducing a repellent or stop cue.
- description: Receptor for sperm major sperm protein (MSP) on oocytes and gonadal sheath cells; in the
    absence of sperm VAB-1 signalling inhibits oocyte meiotic maturation and MAPK activation, and MSP
    binding relieves the inhibition.
  molecular_function:
    id: GO:0004714
    label: transmembrane receptor protein tyrosine kinase activity
  directly_involved_in:
  - id: GO:1900194
    label: negative regulation of oocyte maturation
  - id: GO:0007169
    label: cell surface receptor protein tyrosine kinase signaling pathway
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:12533508
    supporting_text: We used DNA microarray data and an in situ binding assay to identify the VAB-1 Eph
      receptor protein–tyrosine kinase as an MSP receptor.
  - reference_id: PMID:12533508
    supporting_text: The maturation rate of unmated vab-1(dx31) females is significantly higher than that
      of unmated females
- description: Tyrosine kinase that binds and phosphorylates the PTEN ortholog DAF-18, lowering DAF-18
    protein levels; DAF-18 reciprocally antagonises VAB-1.
  molecular_function:
    id: GO:0004714
    label: transmembrane receptor protein tyrosine kinase activity
  supported_by:
  - reference_id: PMID:19853560
    supporting_text: the VAB-1 Eph kinase domain physically interacts with and phosphorylates PTEN (DAF-18),
      diminishing its protein levels and function.
suggested_questions:
- question: Which kinase-independent VAB-1 activities (for example, adhesion through the ectodomain or
    reverse signalling into ephrin-expressing cells) explain the weak phenotypes of kinase-dead alleles
    in embryonic morphogenesis?
- question: Does MSP binding to VAB-1 inhibit or re-direct VAB-1 kinase signalling in oocytes, and does
    it compete with ephrin binding at the same site?
- question: Is the DAF-18 phosphorylation site(s) on DAF-18 known, and is the VAB-1-DAF-18 relationship
    conserved for vertebrate Eph receptors and PTEN?
suggested_experiments:
- description: Map the MSP-binding surface on the VAB-1 ectodomain by mutagenesis and test whether mutants
    that lose MSP binding but keep ephrin binding uncouple sperm sensing from embryonic morphogenesis.
  experiment_type: structure-guided mutagenesis and binding assays
- description: Identify VAB-1 phosphorylation sites on DAF-18 by mass spectrometry and test phospho-site
    mutants of DAF-18 in vivo for oocyte maturation and lifespan phenotypes.
  experiment_type: phosphoproteomics and CRISPR knock-in
