id: O61460
gene_symbol: vab-1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: vab-1 encodes the single Eph receptor tyrosine kinase of C. elegans, a single-pass type I
  membrane protein with an N-terminal ephrin-binding domain, cysteine-rich region, two fibronectin type
  III repeats, a transmembrane segment, a cytoplasmic tyrosine kinase domain and a C-terminal SAM domain.
  VAB-1 is the receptor for the GPI-anchored ephrins EFN-1/VAB-2, EFN-2 and EFN-3, and it has both kinase-dependent
  and kinase-independent outputs. In the embryo it acts in neuroblasts and in ventral 'plexin band' cells
  to organise the cell movements of gastrulation cleft closure and ventral epidermal enclosure, partly
  redundantly with PTP-3/LAR and semaphorin/plexin signalling. In the nervous system it is a guidance
  receptor that limits axon extension and prevents midline crossing. On oocytes and gonadal sheath cells
  VAB-1 also binds the sperm-derived major sperm protein (MSP) and the MSP domain of VAP proteins; in
  the absence of sperm it inhibits oocyte meiotic maturation and MAPK activation, an inhibition that MSP
  binding relieves. The kinase phosphorylates the PTEN ortholog DAF-18, lowering its levels, while DAF-18
  in turn antagonises VAB-1.
