  review:
    summary: vab-1 null females mature oocytes faster than wild type in the absence of sperm; VAB-1 is
      part of a sperm-sensing (MSP) checkpoint that inhibits meiotic maturation.
    action: MODIFY
    reason: The mutant phenotype is increased, not reduced, maturation in the absence of sperm, so VAB-1
      acts as a negative regulator of oocyte maturation rather than performing maturation itself. Negative
      regulation of oocyte maturation (GO:1900194) states the direction correctly; MSP binding to VAB-1
      relieves this inhibition.
    supported_by:
    - reference_id: PMID:12533508
      supporting_text: The maturation rate of unmated vab-1(dx31) females is significantly higher than
        that of unmated females
    - reference_id: PMID:12533508
      supporting_text: Our results define a sperm-sensing control mechanism that inhibits oocyte maturation,
        MAPK activation, and ovulation when sperm are unavailable for fertilization.
    - &id005
