- term:
    id: GO:0005832
    label: chaperonin-containing T-complex
  evidence_type: IDA
  original_reference_id: PMID:9434769
  qualifier: part_of
  review:
    summary: Leroux & Candido purified C. elegans CCT and characterized its subunits; the annotation asserts
      that C12C8.1 is part of the chaperonin-containing T-complex. The cached record is abstract-only;
      the abstract reports seven CCT subunit species of 52-65 kDa and a co-purifying HSP60, and does not
      mention an HSP70.
    action: MARK_AS_OVER_ANNOTATED
    reason: CCT is a hetero-oligomeric ring of eight TCP-1-family subunits; an HSP70 is not a CCT subunit.
      If C12C8.1 was detected in the CCT preparation in the full text (not available to us), that reflects
      co-purification or a transient chaperone hand-off rather than complex membership, which is what
      part_of asserts. Not removed because the full text could not be read, but this is not a location
      or complex that describes HSP-70 function.
    supported_by:
    - reference_id: PMID:9434769
      supporting_text: was purified and shown to contain at least seven subunit species ranging from 52-65
        kDa
    - reference_id: PMID:9434769
      supporting_text: Surprisingly, the co-purified HSP60 chaperonin present in the C. elegans CCT preparation
        has the greatest binding activity for denatured actin.
