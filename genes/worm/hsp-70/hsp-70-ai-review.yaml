gene_symbol: hsp-70
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: HSP-70 (C12C8.1) is a strictly stress-inducible cytosolic member of the HSP70 chaperone family,
  the C. elegans counterpart of the mammalian inducible HSPA1A/HSPA1B proteins. It is essentially undetectable
  under normal growth conditions and is induced more than a thousand-fold by heat shock in an HSF-1-dependent
  manner, which has made its promoter the standard heat-shock reporter in the worm. Like other HSP70s
  it has an N-terminal nucleotide-binding ATPase domain, a substrate-binding domain and a C-terminal EEVD
  motif for co-chaperone docking, and it functions as an ATP-dependent folding chaperone that binds exposed
  hydrophobic segments of denatured proteins and, with J-domain and nucleotide-exchange co-chaperones,
  refolds them during recovery from proteotoxic stress. Its expression is also increased by ER stress
  in an xbp-1-dependent manner, and HSF-1 target chaperones including the inducible HSP70s contribute
  to the extended lifespan of insulin-signalling mutants.
