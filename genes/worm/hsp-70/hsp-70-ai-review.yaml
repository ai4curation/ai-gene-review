suggested_questions:
- question: Which client proteins does inducible HSP-70 refold after heat shock that the constitutive
    HSC70 HSP-1 cannot handle?
- question: Are HSP-70 (C12C8.1) and F44E5.4/F44E5.5 functionally redundant, given their near-identical
    sequences and shared induction pattern?
suggested_experiments:
- description: Generate a C12C8.1 deletion (and C12C8.1; F44E5.4/5 compound mutant) and measure thermotolerance,
    recovery of heat-denatured luciferase reporters and aggregation of metastable proteins after heat
    shock.
  hypothesis: Inducible HSP70s are required for refolding of heat-denatured proteins and for acquired
    thermotolerance, with partial redundancy among C12C8.1 and F44E5.4/5.
