- description: 'Heat-inducible cytosolic ATP-dependent folding chaperone: binds unfolded/misfolded proteins
    and, driven by ATP hydrolysis in its nucleotide-binding domain and regulated by HSP40 and NEF co-chaperones,
    refolds them during and after heat stress.'
