descriptions:
- source: UniProt
  text: Regulates the efficiency of a post-docking step of the release pathway. Acts
    after vesicle docking likely via regulating priming. May regulate the conformational
    changes in syntaxin. Binding of vesicles via rab-3[GTP] to Rim may signal the
    presence of a docked synaptic vesicle. Rim may then signal to unc-13 to change
    the conformation of syntaxin from the closed to the open state. Syntaxin could
    then engage synaptobrevin on the docked vesicle to form SNARE complexes and to
    prime the vesicle for release. Not required for the development or the structural
    organization of synapses. May play a role in regulating entry into the dauer state
    (PubMed:30460068).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q22366
  source_id: Q22366
