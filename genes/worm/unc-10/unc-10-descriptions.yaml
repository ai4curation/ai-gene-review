- source: Alliance_Automated
  text: Enables small GTPase binding activity. Involved in several processes, including
    chemical synaptic transmission; defecation; and positive regulation of cholinergic
    synaptic transmission. Located in axon and presynaptic active zone. Is expressed
    in nervous system and uv1. Human ortholog(s) of this gene implicated in cone-rod
    dystrophy. Orthologous to several human genes including RIMS1 (regulating synaptic
    membrane exocytosis 1).
