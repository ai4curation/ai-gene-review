      score: 4
    overall_notes: 'Correct: post-docking priming, RAB-3 binding and syntaxin opening
      via UNC-13; synapse structure is normal. Somewhat speculative in tone.'
- source: Alliance_Imported
  text: unc-10 encodes a protein with zinc-finger, Q/N-rich, PDZ, and C2 domains that
    is homologous to vertebrate Rim1, a presynaptic protein which binds, and effects
    the activity of, synaptic vesicle-associated GTP-Rab3; UNC-10 is required for
    normal locomotion and synaptic transmission, and localizes to a subdomain of presynaptic
    termini, where it probably acts to regulate the priming step of presynaptic vesicle
    fusion by promoting conformational changes in syntaxin.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00006750;class=Gene
