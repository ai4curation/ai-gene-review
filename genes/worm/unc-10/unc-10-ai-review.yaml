id: Q22366
gene_symbol: unc-10
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: UNC-10 is the single Caenorhabditis elegans RIM (Rab3-interacting molecule), a large multidomain
  protein of the presynaptic active zone built from an N-terminal Rab-binding zinc-finger region, a PDZ
  domain and two C2 domains. Its N-terminal region binds GTP-loaded RAB-3 on synaptic vesicles, and its
  PDZ domain binds the C-terminal motif of the active-zone protein ELKS-1. Through these interactions
  UNC-10 retains vesicles at the presynaptic density, close to UNC-2 calcium channels, and promotes their
  conversion into a fusion-competent (primed) state, most likely by favouring the open conformation of
  syntaxin. unc-10 mutants are viable but strongly impaired in evoked and spontaneous neurotransmitter
  release and are resistant to acetylcholinesterase inhibitors, while active-zone ultrastructure and overall
  synapse development remain normal. Loss of UNC-10 also lengthens the defecation cycle and alters pheromone-induced
  dauer formation.
