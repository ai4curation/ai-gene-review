core_functions:
- description: Rab3-GTP effector at the presynaptic active zone; UNC-10 binds GTP-loaded RAB-3 on synaptic
    vesicles through its N-terminal zinc-finger region, retaining vesicles at the presynaptic density
    near UNC-2 calcium channels and promoting their priming into a fusion-competent state, thereby positively
    regulating synaptic vesicle exocytosis.
  molecular_function:
    id: GO:0031267
    label: small GTPase binding
  directly_involved_in:
  - id: GO:0016082
    label: synaptic vesicle priming
  - id: GO:2000300
    label: regulation of synaptic vesicle exocytosis
  locations:
  - id: GO:0048786
    label: presynaptic active zone
  supported_by:
  - reference_id: PMID:18721860
    supporting_text: C. elegans and vertebrate Rim both interacted with the activated C. elegans GTP-bound
      RAB-3(Q81L) mutant, but not the GDP-bound RAB-3(T36N) mutant
  - reference_id: PMID:11559854
    supporting_text: The level of fusion competent vesicles at release sites was reduced fivefold in Rim
suggested_questions:
- question: Which UNC-10 domain mediates the priming function, given that the PDZ domain is dispensable
    and the zinc-finger region binds RAB-3?
- question: Does UNC-10 regulate UNC-2 calcium-channel abundance or inactivation at worm active zones,
    as vertebrate RIM does, or only vesicle positioning relative to the channels?
suggested_experiments:
- description: Separation-of-function unc-10 alleles (zinc-finger RAB-3-binding region versus C2 domains)
    assayed by high-pressure-freeze EM for docked and tethered vesicles together with evoked release and
    endogenous UNC-2 punctum intensity, to apportion the phenotype between vesicle targeting, priming
    and calcium-channel anchoring.
