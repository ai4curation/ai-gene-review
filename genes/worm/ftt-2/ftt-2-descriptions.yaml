gene_symbol: ftt-2
organism: worm
uniprot_id: Q20655
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Required for extension of lifespan by sir-2.1 (PubMed:16777605). Required
    to modulate lifespan, in concert with hcf- 1, acting redundantly with 14-3-3-like
    protein par-5 (PubMed:21909281). Promotes nuclear export of yap-1 (PubMed:23396260).
    Negatively regulates the transcriptional activity of daf-16 by sequestering it
    to the cytoplasm (PubMed:21531333).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q20655
  source_id: Q20655
- source: Alliance_Imported
  text: ftt-2 encodes a 14-3-3 protein; FTT-2 is required for regulating the localization
    of the product of YAP-1, a Yes-associated protein (Yap) homolog, between the cytoplasm
    and the nucleus.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00001502;class=Gene
  source_id: WB:WBGene00001502
- source: Alliance_Automated
  text: Enables DNA-binding transcription factor binding activity and protein sequestering
    activity. Involved in dauer larval development and negative regulation of protein
    import into nucleus. Located in cytoplasm and nucleus. Is expressed in several
    structures, including AB; C; E; EMS; and gonad. Human ortholog(s) of this gene
    implicated in Popov-Chang syndrome; developmental and epileptic encephalopathy
    56; transitional cell carcinoma; and vulva squamous cell carcinoma. Orthologous
    to several human genes including YWHAB (tyrosine 3-monooxygenase/tryptophan 5-monooxygenase
    activation protein beta) and YWHAZ (tyrosine 3-monooxygenase/tryptophan 5-monooxygenase
    activation protein zeta).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00001502;class=Gene
  source_id: WB:WBGene00001502
