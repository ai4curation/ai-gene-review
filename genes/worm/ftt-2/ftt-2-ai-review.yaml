gene_symbol: ftt-2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: FTT-2 is one of two C. elegans 14-3-3 proteins (with PAR-5/FTT-1), a small, dimeric
  phospho-serine/threonine-binding adaptor of the 14-3-3 family. Its best characterized role
  is in DAF-2 insulin/IGF-1-like signaling, where FTT-2 binds the FOXO transcription factor
  DAF-16 and retains it in the cytoplasm, restraining DAF-16 target-gene transcription; ftt-2
  knockdown causes DAF-16 nuclear accumulation and enhances daf-2 dauer formation, whereas
  par-5 knockdown does not. FTT-2 also binds the sirtuin SIR-2.1 and is required, partly redundantly
  with PAR-5, for SIR-2.1- and HCF-1-dependent lifespan extension and stress-induced DAF-16
  activation. It similarly restrains nuclear accumulation of the YAP homolog YAP-1. FTT-2
  is found in the cytoplasm and nucleus.
