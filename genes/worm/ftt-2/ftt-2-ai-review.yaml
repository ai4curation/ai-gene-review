core_functions:
- description: FTT-2 binds the FOXO transcription factor DAF-16 and sequesters it in the cytoplasm,
    restraining DAF-16 nuclear accumulation and transcriptional activity downstream of DAF-2
    insulin/IGF-1-like signaling; it similarly restrains nuclear accumulation of YAP-1.
