suggested_questions:
- question: Does FTT-2 binding to DAF-16 require the AKT/SGK phospho-sites, as for mammalian
    14-3-3/FOXO, and how does that reconcile with 14-3-3 being required for SIR-2.1-dependent
    DAF-16 activation after heat stress?
- question: Why does FTT-2, but not the ~80% identical PAR-5, regulate DAF-16 localization
    and dauer formation?
suggested_experiments:
- description: Co-immunoprecipitation of FTT-2 with wild-type versus AKT-site-mutant DAF-16
    (and in akt-1;akt-2;sgk-1 backgrounds) to test phospho-dependence of the interaction in
    vivo.
