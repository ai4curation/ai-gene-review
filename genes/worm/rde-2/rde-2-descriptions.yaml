descriptions:
- source: Alliance_Imported
  text: rde-2 encodes a novel protein that is conserved in at least two other Caenorhabditis
    species; rde-2 is required for the functional silencing of chromosomal loci by
    transgenes (cosuppression) and promotes the effects of RNAi in a step after the
    formation of a heritable interfering agent, also affects X-chromosome nondisjunction
    and transposon activation; functions downstream of rde-1 in the RNAi pathway most
    effective against germline, but not somatically expressed, genes; RDE-2 is present
    predominantly in the cytosol, in complexes with MUT-7, a predicted exoribonuclease
    also required for RNA interference.
  source_type: curated
