gene_symbol: lgg-2
organism: worm
uniprot_id: Q23536
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Ubiquitin-like modifier involved in the formation of autophagosomal vacuoles
    (autophagosomes) (PubMed:26687600). When lipidated mediates tethering between
    adjacent membranes and stimulates membrane fusion (PubMed:26687600). Less effective
    at promoting membrane fusion than lgg-1 (PubMed:26687600). Acts upstream of the
    autophagy protein epg-5 in the aggrephagy pathway, which is the macroautophagic
    degradation of ubiquitinated protein aggregates, and preferentially interacts
    with autophagy proteins and substrates containing LIR motifs to mediate autophagosome
    formation and protein aggregate degradation (PubMed:26687600). In particular binds
    to components of an atg-5-lgg-3- atg-16 complex to regulate autophagosome formation
    and cargo sequestration (PubMed:26687600). Required for the degradation of specific
    sqst-1-containing aggregates during embryogenesis and the early stages of larval
    development (PubMed:26687600). Involved in allophagy, which is an autophagic process
    in which paternal mitochondria and organelles are degraded during fertilization,
    and moreover is required for the degradation of lgg-1-positive allophagic autophagosomes
    in embryos (PubMed:24374177, PubMed:25126728, PubMed:37395461). Involved in xenophagy,
    the autophagy-mediated degradation of pathogens and pathogen products, such as
    toxins (PubMed:27875098). Also plays a role in membrane-pore repair (PubMed:27875098).
    Through HOPS complex subunit vps-39, tethers lysosomes with autophagosomes to
    form autolysosomes (PubMed:24374177). Plays a role in the distribution and clearance
    of germ cell specific P- granules from somatic cells to ensure exclusive localization
    of the P- granules in germ cells (PubMed:19167332). Essential for dauer development
    and life-span extension (PubMed:20523114).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q23536
  source_id: Q23536
- source: Alliance_Imported
  text: lgg-2 encodes an ortholog of the autophagic budding yeast protein Atg8p;LGG-2
    is also homologous the light chain 3 (LC3) subunit of themicrotubule-associated
    proteins 1A and 1B (MAP1A and MAP1B); LGG-2 is   predicted to associate with MAP1A
    and MAP1B and with microtubules and toperhaps play a role in regulating the microtubule-binding
    activity ofMAP1A and MAP1B; LGG-2 has no obvious function in RNAi assays, and
    isnot required for either dauer formation or extended lifespan.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00002981;class=Gene
  source_id: WB:WBGene00002981
- source: Alliance_Automated
  text: Predicted to enable microtubule binding activity; phosphatidylethanolamine
    binding activity; and ubiquitin protein ligase binding activity. Involved in several
    processes, including defense response to Gram-positive bacterium; positive regulation
    of autophagosome maturation; and xenophagy. Acts upstream of or within with a
    positive effect on plasma membrane repair. Located in autophagosome membrane.
    Is expressed in several structures, including intestine; muscle cell; pharynx;
    spermatheca; and vulva. Human ortholog(s) of this gene implicated in glioblastoma.
    Orthologous to several human genes including MAP1LC3A (microtubule associated
    protein 1 light chain 3 alpha) and MAP1LC3B (microtubule associated protein 1
    light chain 3 beta).
