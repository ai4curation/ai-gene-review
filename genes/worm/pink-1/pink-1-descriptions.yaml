    - rubric: completeness
      score: 3
    - rubric: specificity
      score: 4
    overall_notes: Correct oxidative stress, mitochondrial homeostasis, CAN neurite
      outgrowth and LRK-1 antagonism; 'predicted' kinase and no mitophagy.
- source: Alliance_Automated
  text: Predicted to enable protein serine/threonine kinase activity. Involved in
    several processes, including axon extension involved in axon guidance; mitophagy;
    and positive regulation of protein ubiquitination. Located in mitochondrion. Is
    expressed in hermaphrodite distal tip cell; intestine; neurons; pharynx; and vulva.
    Used to study Parkinson's disease. Human ortholog(s) of this gene implicated in
    Parkinson's disease and Parkinson's disease 6. Orthologous to human PINK1 (PTEN
    induced kinase 1).
  source_type: automated
