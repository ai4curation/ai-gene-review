descriptions:
- source: UniProt
  text: Protects against mitochondrial dysfunction during cellular stress, potentially
    by phosphorylating mitochondrial proteins (By similarity). Plays a role in mitophagy
    (PubMed:25896323).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q09298
