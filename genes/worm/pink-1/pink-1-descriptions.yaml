gene_symbol: pink-1
organism: worm
uniprot_id: Q09298
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Protects against mitochondrial dysfunction during cellular stress, potentially
    by phosphorylating mitochondrial proteins (By similarity). Plays a role in mitophagy
    (PubMed:25896323).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q09298
  source_id: Q09298
- source: Alliance_Imported
  text: pink-1 encodes a predicted serine/threonine kinase that is most similar to
    the Drosophila and human PINK1 (PTEN-induced kinase-1) protein kinases, the latter
    of which has been implicated in familial forms of Parkinson's disease; in C. elegans,
    pink-1 activity is required for normal response to oxidative stress, mitochondrial
    homeostasis, proper CAN neurite outgrowth, and wild type brood sizes; pink-1 mutant
    phenotypes are suppressed by mutations in lrk-1, which encodes the C. elegans
    ortholog of the GTPase-regulated kinase LRRK2, while lrk-1 sensitivity to tunicamycin
    is suppressed by loss of pink-1; a PINK-1::GFP is broadly expressed in neurons,
    musculature and vulval tissues in larvae and adults and localizes to both the
    cytoplasm and the mitochondria.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00017137;class=Gene
  source_id: WB:WBGene00017137
- source: Alliance_Automated
  text: Predicted to enable protein serine/threonine kinase activity. Involved in
    several processes, including axon extension involved in axon guidance; mitophagy;
    and positive regulation of protein ubiquitination. Located in mitochondrion. Is
    expressed in hermaphrodite distal tip cell; intestine; neurons; pharynx; and vulva.
    Used to study Parkinson's disease. Human ortholog(s) of this gene implicated in
    Parkinson's disease and Parkinson's disease 6. Orthologous to human PINK1 (PTEN
    induced kinase 1).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00017137;class=Gene
  source_id: WB:WBGene00017137
