description: >-
  ProTrek sequence-to-text retrieval for worm pink-1, the mitochondrial kinase that initiates mitophagy.
  The striking feature is ranks 1 and 2: positive regulation of autophagy of mitochondrion, which
  is correct, immediately followed by negative regulation of autophagy of mitochondrion, which is
  its exact opposite, 0.74 score units below. The searched index stores each GO term as a templated
  sentence, and these two sentences differ in a single word. Contrastive sentence embedding does not
  reliably separate antonyms, so any consumer taking the top-k without reading them ingests a claim
  and its negation together - and there is nothing in the scores to indicate which is which. Beyond
  that, no molecular function appears at all: the review's core function is protein serine/threonine
  kinase activity phosphorylating ubiquitin and PDR-1/Parkin at Ser65, held in GOA by IBA, and the
  whole top five is process terms. Assessment: 1 correct novel, 1 nonparalog incorrect, 1 uncertain.
  Assessment: 1 correct novel (COR), 1 uncertain (UNC), 1 nonparalog incorrect (NPI).
