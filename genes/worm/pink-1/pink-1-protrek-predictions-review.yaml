  source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
  source_reference_id: PMID:41039041
  predicted_term:
    id: GO:1903147
    label: negative regulation of autophagy of mitochondrion
  predicted_term_type: GO_BP
  review:
    assessment: NPI
    confidence_score: 0
    summary: >-
      Rank 2 (score 17.07): the direct negation of rank 1, and wrong. PINK-1 promotes mitophagy; loss
      of pink-1 eliminates the stress-induced autophagic response. Its appearance immediately below
      the correct call is the clearest demonstration in either cohort that retrieval over templated
      GO sentences cannot distinguish a process from its inhibition, because the two sentences are
      nearly identical strings. A curator reading the list catches it instantly; a pipeline consuming
      top-3 does not.
    supported_by:
    - reference_id: file:worm/pink-1/pink-1-uniprot.txt
      supporting_text: >-
        Serine/threonine-protein kinase pink-1, mitochondrial
