  predicted_term_type: GO_BP
  review:
    assessment: COR
    confidence_score: 2
    summary: >-
      Top-ranked hit (score 17.81), absent from GOA, which holds mitophagy (IMP) and autophagy of
      mitochondrion (IBA) but not the positive-regulation term. PINK-1 accumulating on depolarized
      mitochondria and phosphorylating ubiquitin and Parkin is the initiating step of mitophagy, so
      positive regulation is correct and adds a regulatory-direction claim the current annotation
      does not make.
