  predicted_term_type: GO_BP
  review:
    assessment: UNC
    confidence_score: 1
    summary: >-
      Rank 3 (score 16.85), absent from worm GOA, which holds positive regulation of mitochondrial
      fission (IBA). Mammalian PINK1 phosphorylates mitofusins to promote their Parkin-dependent ubiquitination,
      which does inhibit fusion, so the claim is well-founded for the family - but no worm evidence
      for it is available here, and after ranks 1 and 2 the ordering gives no reason to trust the
      sign of a regulatory claim from this method. Cannot be validated or refuted for this gene.
