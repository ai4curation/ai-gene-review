descriptions:
- source: Alliance_Imported
  text: mks-1 encodes, by alternative splicing, two isoforms of an ortholog of  human
    MKS1, and is paralogous to  MKRS-1 and MKRS-2; MKS-1 is redundantly required with
    NPH-4 for roughly  normal foraging, and with both NPH-1 and NPH-4 for cilia formation;  MKS-1
    is expressed in a subset of amphid and inner labial neurons, in a  DAF-19-dependent
    manner; MKS-1 forms a complex with MKRS-1 and MKRS-2 at  the base of cilia, requires
    MKRS-1 and MKRS-2 for localization to the  transistion zone, and is coexpressed
    with these proteins in ciliated  sensory neurons; mks-1(RNAi) suppresses the normal
    egg-laying defect of  egl-9 mutants.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00020100;class=Gene
