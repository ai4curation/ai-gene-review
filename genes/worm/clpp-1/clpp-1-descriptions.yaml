gene_symbol: clpp-1
organism: worm
uniprot_id: Q27539
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Clp cleaves peptides in various proteins in a process that requires ATP hydrolysis.
    Clp may be responsible for a fairly general and central housekeeping function
    rather than for the degradation of specific substrates.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q27539
  source_id: Q27539
- source: Alliance_Imported
  text: clpp-1 encodes a mitochondrial protein, homologous to bacterial ClpP, required
    to initiate the stress response to unfolded mitochondrial proteins; as with its
    bacterial ortholog, CLPP-1 is predicted to be a proteolytic subunit of a Clp-like
    protease, with an N-terminal region required for mitochondrial localization, and
    a C-terminal region of ClpP similarity; in response to a mutation stressing mitochondria,
    clpp-1(RNAi) animals show reduced HSP-60 levels, inhibited nuclear translocation
    and hsp-60 activation by DVE-1, and aberrant mitochondrial morphology; CLPP-1
    is biochemically inhibited by the ClpP inhibitor Z-LY-CMK and the peptide aldehyde
    MG132, and may also be blocked by them when injected in vivo; CLPP-1 is expressed
    in the intestine.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00014172;class=Gene
  source_id: WB:WBGene00014172
- source: Alliance_Automated
  text: Enables serine-type endopeptidase activity. Involved in mitochondrial unfolded
    protein response and proteolysis. Located in mitochondrial matrix. Is expressed
    in intestine. Human ortholog(s) of this gene implicated in Perrault syndrome.
    Orthologous to human CLPP (caseinolytic mitochondrial matrix peptidase proteolytic
    subunit).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00014172;class=Gene
  source_id: WB:WBGene00014172
