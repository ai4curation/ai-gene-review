gene_symbol: wago-1
organism: worm
uniprot_id: Q21770
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Argonaute protein which is involved in the endogenous small interfering RNA
    (endo-siRNA) pathway. Interacts with secondary 22G- RNAs, which are RNA-dependent
    RNA polymerase-derived endo-siRNAs, typically 22 nucleotides in length with a
    5'guanosine residue. In the germline, functions in a genome surveillance system
    to silence transposons and aberrant transcripts.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q21770
  source_id: Q21770
- source: Alliance_Automated
  text: Predicted to enable RNA endonuclease activity; miRNA binding activity; and
    single-stranded RNA binding activity. Predicted to be involved in regulatory ncRNA-mediated
    post-transcriptional gene silencing. Located in P granule. Is expressed in germ
    line and in male.
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00011061;class=Gene
  source_id: WB:WBGene00011061
- source: RefSeq
  text: Enables DEAD/H-box RNA helicase binding activity. Predicted to be involved
    in regulatory ncRNA-mediated post-transcriptional gene silencing. Located in P
    granule. Is expressed in germ line and in male. [provided by Alliance of Genome
    Resources, Jul 2025]
  source_type: automated
  url: https://www.ncbi.nlm.nih.gov/gene/172463
  source_id: GeneID:172463
