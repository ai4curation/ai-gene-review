- term:
    id: GO:0003032
    label: detection of oxygen
  evidence_type: IMP
  original_reference_id: PMID:19323996
  review:
    summary: 'GCY-35 is itself the O2 receptor molecule of URX/AQR/PQR: its heme binds O2,
      it is required for O2-evoked cGMP and Ca2+ rises, and it is instructive (misexpressed
      with GCY-36 it confers O2-rise detection on other neurons).'
    action: NEW
    reason: 'Participation test: GCY-35 performs the detection step itself (ligand binding
      and transduction into cGMP), so it is not just required for the process. Comparator
      check: GO:0003032 is carried in C. elegans by the globin GLB-5 (IMP), another O2-binding
      protein in the same neurons, so the term is used for the O2-binding protein in the same
      role. The sGCs carry only the broader ''response to oxygen levels''. Detection is a
      more precise description of the sensor role than response.'
    supported_by:
    - reference_id: PMID:19323996
      supporting_text: The sGCs are instructive O2 sensors, as forced expression of URX sGC
        genes causes BAG neurons to detect O2 increases.
    - reference_id: PMID:15220933
      supporting_text: The GCY-35 haem domain binds molecular oxygen, unlike the haem domains
        of classical nitric-oxide-regulated guanylate cyclases.
    - reference_id: PMID:23940325
      supporting_text: We show that a rise in O2 can evoke a tonic increase in cGMP that requires
        an atypical O2-binding soluble guanylate cyclase and that is sustained until oxygen
        levels fall.
    - reference_id: PMID:15916947
      supporting_text: Coexpression of GCY-35 and GCY-36 is sufficient to transform olfactory
        neurons into O2 sensors.
