id: O02298
gene_symbol: gcy-35
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: GCY-35 is an atypical soluble guanylate cyclase (sGC) subunit of Caenorhabditis
  elegans, with an N-terminal heme-nitric oxide/oxygen binding (H-NOX) domain, a PAS-like/HNOB-associated
  domain, a coiled coil and a C-terminal guanylate cyclase domain. Unlike the NO-activated
  vertebrate sGCs, the GCY-35 heme binds molecular O2. GCY-35 acts together with its partner
  subunit GCY-36 (probably as a heterodimer) in the body-cavity sensory neurons URX, AQR and
  PQR, where a rise in O2 towards atmospheric levels drives a tonic increase in cGMP that
  opens TAX-2/TAX-4 cGMP-gated channels and depolarizes the neurons. Expression of GCY-35
  with GCY-36 is sufficient to make other neurons respond to O2 increases. GCY-35 is enriched
  at URX dendritic endings in a PDL-1 (PrBP/PDE6delta)-dependent manner and its activity is
  tuned by the neuroglobin GLB-5. Through these neurons GCY-35 drives hyperoxia avoidance
  (aerotaxis), O2-dependent locomotory responses and npr-1-dependent aggregation and bordering
  (social feeding), and indirectly influences body size, pathogen lawn avoidance and lifespan.
