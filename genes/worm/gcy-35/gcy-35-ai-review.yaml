- question: Is the purified full-length GCY-35/GCY-36 heterodimer stimulated by O2 binding,
    and what is its O2 affinity relative to the URX response range (~12-21% O2)?
- question: Does GCY-35 heterodimerize with sGCs other than GCY-36 (e.g. GCY-32, GCY-34, GCY-37)
    in URX/AQR/PQR?
suggested_experiments:
- description: Reconstitute purified GCY-35/GCY-36 heterodimer and measure cGMP production
    across O2 concentrations, with heme-pocket mutants as controls.
