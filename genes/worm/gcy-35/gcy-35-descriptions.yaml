- source: Alliance_Automated
  text: Enables several functions, including carbon monoxide binding activity; nitric
    oxide binding activity; and oxygen binding activity. Involved in aerotaxis; defense
    response to Gram-negative bacterium; and response to hyperoxia. Located in dendrite
    and neuronal cell body. Is expressed in body wall musculature; neurons; and pharyngeal
    muscle cell. Orthologous to human GUCY1B2 (guanylate cyclase 1 soluble subunit
    beta 2 (pseudogene)).
