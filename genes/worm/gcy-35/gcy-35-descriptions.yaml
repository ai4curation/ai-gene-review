      score: 4
    overall_notes: 'Correct: O2-regulated cGMP synthesis in URX/AQR/PQR for hyperoxia
      avoidance and aggregation; padded with general background on oxygen preference.'
- source: Alliance_Imported
  text: gcy-35 encodes a soluble guanylyl cyclase; GCY-35 activity is required for
    regulation of aggregation, aerotaxis, aerokinesis, gustatory plasticity, and innate
    immunity; GCY-35 activity is also required in the URX sensory neurons to sense
    increases in O2 levels and effect corresponding behavioral changes; gcy-35::gfp
    reporter fusions are expressed in a number of neurons, including the AQR, PQR,
    and URX sensory neurons, the SDQL/R and BDU interneurons, the AVM and PVM mechanosensory
    neurons, the cholinergic ALN and PLN neurons, the excretory cell, and in pharyngeal
    and body wall muscles; gcy-35 expression in the URX neuron is positively regulated
    by the AHR-1 transcription complex; the heme-binding domain of GCY-35 binds molecular
    oxygen as well as NO and CO.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00001555;class=Gene
