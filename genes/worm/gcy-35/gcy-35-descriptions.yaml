gene_symbol: gcy-35
organism: worm
uniprot_id: O02298
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Plays a central role in social feeding behavior and oxygen sensation by synthesizing
    3',5'-cyclic guanosine monophosphate (cGMP) from GTP. Oxygen, which binds to its
    heme-binding sites, probably regulates social behavior by modulating its activity.
    cGMP is a common second messenger in sensory transduction and is implicated in
    oxygen sensation. Indeed, C.elegans exhibits a strong behavioral preference for
    5-12% oxygen, avoiding higher and lower oxygen levels; a higher level of oxygen
    inducing a naturally polymorphic social feeding behavior. Involved in avoidance
    of hyperoxia and for oxygen-induced aggregation and bordering, probably by mediating
    oxygen-sensing in URX, AQR and PQR sensory neurons.
  source_type: curated
  url: https://www.uniprot.org/uniprot/O02298
  source_id: O02298
- source: Alliance_Imported
  text: gcy-35 encodes a soluble guanylyl cyclase; GCY-35 activity is required for
    regulation of aggregation, aerotaxis, aerokinesis, gustatory plasticity, and innate
    immunity; GCY-35 activity is also required in the URX sensory neurons to sense
    increases in O2 levels and effect corresponding behavioral changes; gcy-35::gfp
    reporter fusions are expressed in a number of neurons, including the AQR, PQR,
    and URX sensory neurons, the SDQL/R and BDU interneurons, the AVM and PVM mechanosensory
    neurons, the cholinergic ALN and PLN neurons, the excretory cell, and in pharyngeal
    and body wall muscles; gcy-35 expression in the URX neuron is positively regulated
    by the AHR-1 transcription complex; the heme-binding domain of GCY-35 binds molecular
    oxygen as well as NO and CO.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00001555;class=Gene
  source_id: WB:WBGene00001555
- source: Alliance_Automated
  text: Enables several functions, including carbon monoxide binding activity; nitric
    oxide binding activity; and oxygen binding activity. Involved in aerotaxis; defense
    response to Gram-negative bacterium; and response to hyperoxia. Located in dendrite
    and neuronal cell body. Is expressed in body wall musculature; neurons; and pharyngeal
    muscle cell. Orthologous to human GUCY1B2 (guanylate cyclase 1 soluble subunit
    beta 2 (pseudogene)).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00001555;class=Gene
  source_id: WB:WBGene00001555
