- source: Alliance_Imported
  text: odr-3 encodes a G protein alpha subunit; odr-3 activity is required for normal
    chemotaxis, odorant avoidance, and nociceptive function as well as cilium morphogenesis
    in chemosensory neurons; an ODR-3::GFP is expressed in five pairs of sensory neurons
    AWA, AWB, AWC, ASH, and ADF; the AWC neurons consistently express GFP most strongly,
    while the AWB neurons express at lower levels and the AWA, ASH, and ADF neurons
    express only weakly; in AWC neurons, ODR-3::GFP localizes to cilia which have
    a characteristic wing-shaped morphology.
