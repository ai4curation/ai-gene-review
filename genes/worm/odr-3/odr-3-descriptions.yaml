descriptions:
- source: UniProt
  text: Guanine nucleotide-binding proteins (G proteins) are involved as modulators
    or transducers in various transmembrane signaling systems (PubMed:10192394). This
    specific G-alpha subunit plays an important role in olfaction and in cilia morphogenesis
    (PubMed:15342507, PubMed:9459442). Involved in chemotactic responses to attractants
    diacetyl, pyrazine, 2,4,5-trimethylthiazole, benzaldehyde, isoamyl alcohol, butanone
    and 2,3-pentanedione (PubMed:12694294). Displays a redundant function with gpa-3
    in chemotactic responses (PubMed:12694294). Plays a role in the avoidance response
    to the noxious chemical quinine in ASH sensory neurons (PubMed:14988722). Involved
    in avoidance responses to copper, sodium dodecyl sulfate and linoleic acid (PubMed:12694294).
    Involved in osmotic avoidance and mechanosensory responses (PubMed:12694294).
    Involved in specifying fan- like morphology of cilia of head sensory neurons AWC
    (PubMed:9459442). Plays a role in the detection of preferred food sources by mediating
    the recognition of food odors in olfactory sensory neurons (PubMed:25009271).
