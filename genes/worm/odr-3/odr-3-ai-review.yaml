id: Q18434
gene_symbol: odr-3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: >-
  odr-3 encodes a Gi/Go-like heterotrimeric G protein alpha subunit of C. elegans that is expressed mainly
  in ciliated chemosensory neurons, most strongly in the AWC olfactory neurons and also in AWB, AWA, ASH,
  ADF and the phasmid neurons PHA/PHB. ODR-3 is concentrated in the non-motile sensory cilia, with weaker
  signal in dendrites and cell bodies. As a GTP-binding, GTP-hydrolysing G-alpha in a heterotrimer with
  G-beta/gamma, it couples seven-transmembrane chemoreceptors (for example the diacetyl receptor ODR-10)
  to downstream effectors. ODR-3 is the main stimulatory G-alpha for odorant detection: in AWC its signal
  is transduced through cGMP produced by the receptor guanylyl cyclases ODR-1 and DAF-11 and the TAX-2/TAX-4
  cGMP-gated channel, and it acts partly redundantly with GPA-3 in AWA and AWC. In the ASH nociceptive
  neurons ODR-3 is required for avoidance of noxious chemicals, high osmolarity and nose touch, signalling
  through the TRPV channel OSM-9. ODR-3 also controls the fan-like shape of AWC sensory cilia, a role
  that is separable from its function in olfaction.
