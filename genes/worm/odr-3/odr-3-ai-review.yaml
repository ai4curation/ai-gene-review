  review:
    summary: >-
      IBA adenylate cyclase-modulating GPCR signalling pathway from a deep G-alpha node.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Although adenylyl cyclase modulation is ancestral for many G-alpha subunits, ODR-3 signalling in
      AWC is transduced through cGMP produced by the receptor guanylyl cyclases ODR-1 and DAF-11 and the
      TAX-2/TAX-4 CNG channel, and in ASH through the TRPV channel OSM-9. No evidence links ODR-3 to adenylyl
      cyclase regulation; the more general GPCR signalling pathway term captures the supported role.
    supported_by:
    - reference_id: PMID:9459442
      supporting_text: >-
        in AWC olfactory neurons, ODR-3 may interact with another signal transduction pathway.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: PANTHER:PTN000026392
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          Deep G-alpha node grounded in mammalian Gs/Gi/Go and fungal G-alpha regulation of adenylyl cyclase;
          the nematode-specific sensory G-alpha ODR-3 is coupled in AWC to cGMP production by receptor
          guanylyl cyclases and in ASH to TRPV (OSM-9) signalling, with no evidence for adenylyl cyclase
          modulation.
