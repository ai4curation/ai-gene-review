    summary: >-
      IMP cilium assembly. ODR-3 regulates the morphogenesis (fan-like shape) of AWC olfactory cilia:
      odr-3 null AWC cilia become filamentous, and ODR-3 overexpression in AWA makes its cilia fan-like.
