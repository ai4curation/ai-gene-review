findings:
- category: discrepancy
  text: WormBase says NUC-1 acts in apoptotic cells prior to engulfment; the review
    states corpse DNA degradation depends on engulfment and that action inside dying
    cells is debated.
  sources:
  - Alliance_Imported
review:
  reviewer: AI
  rubrics:
  - rubric: overall_concordance
    score: 4
  overall_notes: All describe a DNase II acting in apoptotic DNA degradation; WormBase
    alone asserts a pre-engulfment action.
