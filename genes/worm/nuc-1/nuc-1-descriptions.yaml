gene_symbol: nuc-1
organism: worm
uniprot_id: Q17778
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Hydrolyzes DNA under acidic conditions with a preference for double-stranded
    DNA. Implicated in apoptosis.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q17778
  source_id: Q17778
- source: Alliance_Imported
  text: The nuc-1 gene encodes a DNase II homolog similar to mammalian and Drosophila
    DNaseII enzymes and is required for DNA degradation during apoptosis as well as
    for degradation of dietary DNA during normal feeding; during apoptosis, NUC-1
    functions in apoptotic cells at an intermediate stage of DNA degradation, after
    the killing step, but prior to cell-corpse engulfment.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00003828;class=Gene
  source_id: WB:WBGene00003828
- source: Alliance_Automated
  text: Enables deoxyribonuclease II activity. Involved in apoptotic DNA fragmentation.
    Acts upstream of or within with a positive effect on negative regulation of antimicrobial
    peptide production. Located in lysosome. Is expressed in body wall musculature;
    head; intestinal cell; and vulva. Human ortholog(s) of this gene implicated in
    pancytopenia. Orthologous to human DNASE2B (deoxyribonuclease 2 beta) and DNASE2
    (deoxyribonuclease 2, lysosomal).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00003828;class=Gene
  source_id: WB:WBGene00003828
- source: RefSeq
