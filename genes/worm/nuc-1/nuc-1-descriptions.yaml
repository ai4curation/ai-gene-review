      score: 5
    - rubric: completeness
      score: 2
    - rubric: specificity
      score: 3
    overall_notes: Correct acid DNase preference for dsDNA; 'implicated in apoptosis'
      is vague and dietary DNA digestion is absent.
- source: Alliance_Imported
  text: The nuc-1 gene encodes a DNase II homolog similar to mammalian and Drosophila
    DNaseII enzymes and is required for DNA degradation during apoptosis as well as
    for degradation of dietary DNA during normal feeding; during apoptosis, NUC-1
    functions in apoptotic cells at an intermediate stage of DNA degradation, after
    the killing step, but prior to cell-corpse engulfment.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00003828;class=Gene
  source_id: WB:WBGene00003828
  review:
    reviewer: AI
