descriptions:
- source: UniProt
  text: Hydrolyzes DNA under acidic conditions with a preference for double-stranded
    DNA. Implicated in apoptosis.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q17778
  source_id: Q17778
