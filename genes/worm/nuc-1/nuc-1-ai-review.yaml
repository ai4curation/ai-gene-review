- term:
    id: GO:0005634
    label: nucleus
  evidence_type: TAS
  original_reference_id: PMID:10716942
  qualifier: located_in
  review:
    summary: Traceable author statement placing NUC-1 in the nucleus, presumably because its substrate
      is the chromosomal DNA of apoptotic cells.
    action: MARK_AS_OVER_ANNOTATED
    reason: No direct evidence places the NUC-1 protein in the nucleus. The cached Wu et al. abstract
      describes degradation of apoptotic-cell DNA but no localization. NUC-1 is a signal-peptide-bearing,
      glycosylated acid hydrolase. It is lysosomal (IDA) and secreted, and its secretion signal is needed
      for function. Completion of corpse DNA degradation requires engulfment. The nuclear location of the
      substrate does not make the enzyme nuclear. A 2026 preprint (Europe PMC PPR1304135, not cited as
      support) reports that NUC-1 is absent from nuclei of apoptotic and live cells. Because this is a
      TAS and not an experimental call, we flag it as an over-annotation and do not remove it.
    supported_by:
    - reference_id: file:worm/nuc-1/nuc-1-uniprot.txt
      record_section: ["FT:SIGNAL"]
      supporting_text: SIGNAL          1..21
    - reference_id: PMID:10716942
      supporting_text: Completion of DNA degradation did not occur in the absence of cell-corpse engulfment.
    - reference_id: PMID:19809494
      supporting_text: Removal or disruption of NUC-1 secretion signal eliminates NUC-1's ability to
        mediate DNA degradation across its expression border.
