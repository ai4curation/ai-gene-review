id: Q17778
gene_symbol: nuc-1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: >-
  NUC-1 (C07B5.5) is the major acid deoxyribonuclease of C. elegans and a member of the
  DNase II family. It is a secreted, glycosylated acid hydrolase with an N-terminal signal
  peptide. It resides in lysosomes and phagolysosomes and is released in excretory and
  secretory products. It cleaves double-stranded DNA endonucleolytically and is most active
  at acidic pH. Loss of nuc-1 removes almost all of the worm's DNase II-type activity. NUC-1
  carries out the late step of apoptotic DNA degradation. Its loss leaves TUNEL-reactive DNA
  ends in cell corpses of the embryo, larva and germline, and it is the predominant of the
  three worm DNase II paralogs (NUC-1, CRN-6, CRN-7) in this role. Degradation of corpse DNA
  depends on corpse engulfment, which fits digestion in the phagolysosome of the engulfing
  cell. NUC-1 also acts non-autonomously after secretion and uptake. Whether it can act
  inside dying cells is debated. NUC-1 also digests the DNA of ingested bacteria in the
  intestinal lumen, and secreted NUC-1 degrades extracellular DNA. Undigested apoptotic DNA
  in nuc-1 mutant gonads goes with raised expression of antimicrobial genes.
existing_annotations:
- term:
    id: GO:0002785
    label: negative regulation of antimicrobial peptide production
  evidence_type: IMP
  original_reference_id: PMID:26251453
  qualifier: acts_upstream_of_or_within_positive_effect
  review:
    summary: nuc-1 (and crn-7) mutant gonads show raised transcript levels of antimicrobial genes
      (abf-2, spp-1, nlp-29, cnc-2, lys-7). The authors attribute this to undigested apoptotic DNA
      fragments activating ERK signalling.
    action: KEEP_AS_NON_CORE
    reason: The phenotype is real and the WormBase curator read the paper (abstract only in our
      cache), so we do not overrule it. But NUC-1 does not take part in regulating antimicrobial
      peptide production. It degrades DNA, and accumulation of its undigested substrate triggers an
      innate immune response. The effect is indirect and downstream of the core nuclease function.
      The readout was antimicrobial gene expression, not peptide production. Kept as a non-core,
      indirect consequence.
    supported_by:
    - reference_id: PMID:26251453
      supporting_text: loss of NUC-1 and CRN-7 lead to up-regulation of antimicrobial genes (abf-2,
        spp-1, nlp-29, cnc-2, and lys-7)
    - reference_id: PMID:26251453
      supporting_text: an incomplete digestion of DNA fragments resulting from the absence of NUC-1
        or CRN-7 in the gonad could induce the ERK signalling, consequently activating antimicrobial
        gene expression
