core_functions:
- description: >-
    NUC-1 is the major DNase II-family acid endonuclease of C. elegans. In lysosomes and
    phagolysosomes it digests the chromosomal DNA of apoptotic cells, completing the
    conversion of nicked (TUNEL-reactive) DNA to fully degraded products. It acts in the
    embryo, larva and germline, mostly non-autonomously after secretion and uptake.
  molecular_function:
    id: GO:0004531
    label: deoxyribonuclease II activity
  directly_involved_in:
  - id: GO:0006309
    label: apoptotic DNA fragmentation
  locations:
  - id: GO:0005764
    label: lysosome
  - id: GO:0043202
    label: lysosomal lumen
  supported_by:
  - reference_id: PMID:10716942
    supporting_text: Mutations in nuc-1 allowed the generation of TUNEL-reactive DNA but blocked the
      conversion of TUNEL-reactive DNA to a subsequent TUNEL-unreactive state.
  - reference_id: PMID:10903446
    supporting_text: wild-type animals contained a potent endonuclease activity with a cleavage preference
      similar to DNase II, while nuc-1 mutant worms demonstrated a marked reduction in this nuclease
      activity
  - reference_id: PMID:26182365
    supporting_text: The ToLFP results confirmed the previous findings that NUC-1 is the major DNase
      II for degrading apoptotic DNA.
- description: >-
    Secreted NUC-1 degrades extracellular DNA, including the DNA of ingested bacteria in
    the intestinal lumen. It is the only worm DNase II with this activity.
  molecular_function:
    id: GO:0004531
    label: deoxyribonuclease II activity
  directly_involved_in:
  - id: GO:0006308
    label: DNA catabolic process
  locations:
  - id: GO:0005576
    label: extracellular region
  supported_by:
  - reference_id: PMID:19809494
    supporting_text: Therefore, NUC-1 appears to be the only DNase II nuclease that has a function in
      degrading DNA in post-embryonic apoptotic cells and bacterial DNA in intestine.
  - reference_id: PMID:37523858
    supporting_text: Deoxyribonuclease (DNase) II encoded by nuc-1 in the excretory and secretory products
      of nematodes was the primary mechanism.
suggested_questions:
- question: Where does NUC-1 act on apoptotic DNA? Lai et al. 2009 and Yu et al. 2015 report activity
    in unengulfed dying cells. Wu et al. 2000 and a 2026 preprint (PPR1304135) show that degradation
    needs engulfment and phagolysosome fusion, and that NUC-1 is absent from nuclei. Can the
    engulfment-independent signal be explained by residual engulfment or by CRN-6/CRN-7?
- question: Should GO:0032010 phagolysosome (or phagocytic vesicle lumen) be added for NUC-1 once the
    engulfing-cell phagosomal localization is published in peer-reviewed form?
- question: Should the WormBase TAS nucleus annotation (PMID:10716942) be retired, given that NUC-1 is
    a secreted lysosomal hydrolase whose substrate, not itself, is nuclear?
- question: How is secreted NUC-1 taken back up by distant cells and delivered to lysosomes? Is it
    mannose-6-phosphate-independent, and which receptor is involved?
suggested_experiments:
- experiment_type: Endogenous tagging and live imaging
  description: CRISPR knock-in of a pH-insensitive fluorescent tag at the nuc-1 locus, with
    imaging of embryonic cell-corpse phagosomes and dying-cell nuclei in wild-type and
    engulfment-defective (ced-1; ced-5) backgrounds.
  hypothesis: Endogenous NUC-1 is found in phagolysosomes of engulfing cells and not in apoptotic
    nuclei.
- experiment_type: Cell-type-specific rescue
  description: Express nuc-1 only in engulfing cells or only in dying cells (for example with ced-1
    versus egl-1 promoters) in nuc-1 mutants and quantify TUNEL/ToLFP-positive corpses.
  hypothesis: Only engulfing-cell expression rescues apoptotic DNA degradation.
- experiment_type: Recombinant enzymology
  description: Purify recombinant NUC-1 and determine pH optimum, product ends (3'-phosphate), and
    the effect of mutating the conserved catalytic histidines of the two PLD-like motifs.
  hypothesis: NUC-1 is a canonical DNase II with 3'-phosphate products and an acidic pH optimum,
    and needs both PLD-like motifs.
