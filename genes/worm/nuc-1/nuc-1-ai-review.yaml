- id: PMID:3228446
  title: 'An endonuclease from Caenorhabditis elegans: partial purification and characterization.'
  findings:
  - statement: The major C. elegans DNase is an EDTA-insensitive endonuclease that prefers dsDNA,
      and nuc-1 mutations reduce it to below 1% of wild type.
    supporting_text: Three independent mutations in the nuc-1 gene were shown to reduce nuclease
      activity to less than 1% of that seen in wild-type organisms.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Europe PMC-verified (Hevelone and Hartman 1988, Biochem Genet); abstract-only cache.
      Early biochemical evidence that nuc-1 encodes or controls the major worm DNase.
- id: PMID:10716942
  title: NUC-1, a caenorhabditis elegans DNase II homolog, functions in an intermediate step of DNA
    degradation during apoptosis.
  findings:
  - statement: nuc-1 encodes a DNase II homolog that converts TUNEL-reactive apoptotic DNA to a
      TUNEL-unreactive state, and completion of degradation needs engulfment.
    supporting_text: Mutations in nuc-1 allowed the generation of TUNEL-reactive DNA but blocked the
      conversion of TUNEL-reactive DNA to a subsequent TUNEL-unreactive state.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Europe PMC-verified (Wu, Stanfield and Horvitz 2000, Genes Dev); abstract-only cache.
      Founding paper on the role of nuc-1 in apoptotic DNA degradation. Supports the process but not
      the TAS nucleus row.
- id: PMID:10903446
  title: The C. elegans apoptotic nuclease NUC-1 is related in sequence and activity to mammalian
    DNase II.
  findings:
  - statement: C07B5.5 encodes NUC-1. Mutant extracts lose DNase II-like endonuclease activity, and
      the transgene complements.
    supporting_text: wild-type animals contained a potent endonuclease activity with a cleavage preference
      similar to DNase II, while nuc-1 mutant worms demonstrated a marked reduction in this nuclease
      activity
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Europe PMC-verified (Lyon et al. 2000, Gene); abstract-only cache. Molecular identification
      and activity evidence.
- id: PMID:19809494
  title: The roles and acting mechanism of Caenorhabditis elegans DNase II genes in apoptotic dna
    degradation and development.
  findings:
  - statement: NUC-1 is the major DNase II for apoptotic DNA degradation and the only one for bacterial
      DNA in the intestine. It is secreted and acts across its expression border.
    supporting_text: Removal or disruption of NUC-1 secretion signal eliminates NUC-1's ability to mediate
      DNA degradation across its expression border.
  - statement: The authors propose NUC-1 can act in apoptotic cells independently of engulfment.
      This is disputed by Wu et al. 2000 and by a 2026 preprint.
    supporting_text: blocking cell corpse engulfment does not affect apoptotic DNA degradation mediated
      by nuc-1, suggesting that NUC-1 acts in apoptotic cells rather than in phagocytes to resolve
      3' OH DNA breaks
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Europe PMC-verified (Lai et al. 2009, PLoS One); full text cached. Key paper on paralog
      roles, secretion and non-autonomous action. The site-of-action conclusion conflicts with Wu
      et al. 2000.
