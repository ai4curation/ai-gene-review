- term:
    id: GO:0043202
    label: lysosomal lumen
  evidence_type: IC
  original_reference_id: PMID:20921409
  review:
    summary: Proposed sub-compartment for the lysosomal localization of NUC-1.
    action: NEW
    reason: >-
      Added beside, not instead of, the lysosome row, following the root-organelle policy.
      Several independent lines agree that NUC-1 is a soluble lumenal hydrolase. (1) It has
      an N-terminal signal peptide and no transmembrane segment, and it is secreted. (2) Its
      activity is gated by acidic pH, which is only met in the lumen. (3) Yu et al. had to
      fuse the LMP-1 membrane domain to NUC-1 to make a membrane-bound form, so the native
      protein is soluble. (4) NUC-1::mCHERRY fills lysosomes and phagolysosomes and is used
      to mark them.
    supported_by:
    - reference_id: file:worm/nuc-1/nuc-1-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: Hydrolyzes DNA under acidic conditions with a preference for double-stranded
        DNA.
    - reference_id: PMID:26182365
      supporting_text: express a different version of fusion protein (NUC-1::LMP-1153–237::GFP) with
        the insertion of the membrane domain of lysosomal protein LMP-1 between NUC-1 and GFP
    - reference_id: PMID:22822152
      supporting_text: Using NUC-1::mCHERRY, which labels lysosomes (8, 9)
    - reference_id: PMID:40349596
      supporting_text: environmental pH specifically modulates NUC-1 activity rather than expression
- term:
    id: GO:0005576
    label: extracellular region
  evidence_type: IDA
  original_reference_id: PMID:19809494
  review:
    summary: NUC-1 is secreted. Its signal peptide is needed for it to leave the pharynx and act on
      distant cells, and it is present in worm excretory/secretory products.
    action: NEW
    reason: Two independent lines show secretion. (1) Lai et al. 2009 found that NUC-1::GFP expressed
      from the myo-2 promoter left the pharynx, while a signal-peptide-deleted form was retained and
      failed to rescue. (2) Dong et al. 2023 found NUC-1 DNase II in nematode excretory and secretory
      products, where it degrades extracellular DNA. Secretion explains non-autonomous action and the
      degradation of bacterial DNA in the intestinal lumen.
    supported_by:
    - reference_id: PMID:19809494
      supporting_text: in which the NUC-1 signal peptide (amino acids 1–21) was deleted and the mutant
        NUC-1 protein was not secreted
    - reference_id: PMID:37523858
      supporting_text: Deoxyribonuclease (DNase) II encoded by nuc-1 in the excretory and secretory
        products of nematodes was the primary mechanism.
