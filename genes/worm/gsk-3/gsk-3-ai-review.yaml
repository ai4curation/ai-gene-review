suggested_questions:
- question: Does worm GSK-3 form a biochemically isolable destruction complex with PRY-1/AXL-1 and APR-1
    that phosphorylates the BAR-1 N-terminus in vivo (i.e. is GO:0030877 beta-catenin destruction complex
    justified for C. elegans, beyond binary Y2H data)?
- question: What is the substrate and mechanism of the positive GSK-3 requirement for endoderm induction
    in the Wnt/beta-catenin asymmetry pathway (e.g. effects on WRM-1/LIT-1, SYS-1 or POP-1 asymmetry),
    and is it kinase-dependent?
- question: Which SKN-1 residues does GSK-3 phosphorylate in vivo, is priming required, and does phosphorylation
    promote nuclear export, block import, or promote WDR-23/CUL4-dependent degradation?
suggested_experiments:
- description: Endogenous tagging and co-immunoprecipitation/mass spectrometry of GSK-3 from larvae to
    test for a PRY-1/AXL-1/APR-1/BAR-1 complex, combined with BAR-1 N-terminal phospho-site mutants and
    auxin-inducible GSK-3 depletion in the Q lineage to test negative regulation without embryonic lethality.
- description: Rescue gsk-3 embryos with kinase-dead (K65R) and priming-pocket (R76A) transgenes to determine
    which GSK-3 Wnt functions (endoderm induction, spindle orientation, engulfment) require catalytic
    activity and primed substrate recognition.
