id: Q9U2Q9
gene_symbol: gsk-3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: 'gsk-3 (historically sgg-1) encodes the C. elegans ortholog of glycogen synthase kinase-3,
  a CMGC-group serine/threonine protein kinase that preferentially phosphorylates substrates already phosphorylated
  by a priming kinase. In the oocyte-to-embryo transition it phosphorylates the CCCH zinc-finger protein
  OMA-1 at T339 after MBK-2/DYRK priming, promoting CUL-2-dependent OMA-1 degradation after the first
  mitosis. In the early embryo it is a component of the MOM-2/Wnt signalling network that, unusually,
  acts positively: it is required for Wnt-dependent endoderm induction in the EMS daughter E and, through
  a transcription-independent branch, for orientation of the EMS and ABar mitotic spindles; it also represses
  the mesendoderm GATA factors med-1/2 in the C lineage. A Wnt/Frizzled-GSK-3-APR-1 branch promotes apoptotic
  cell engulfment and distal tip cell migration via CED-10/Rac. Later in development GSK-3 binds the Axin-like
  scaffolds PRY-1 and AXL-1 and acts as a negative regulator of BAR-1/beta-catenin-dependent canonical
  Wnt signalling (Q neuroblast and vulval precursor lineages). In the intestine GSK-3 phosphorylates SKN-1/Nrf
  and keeps it out of nuclei in the absence of stress, restraining the phase II oxidative stress response.'
