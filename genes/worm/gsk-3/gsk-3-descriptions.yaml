- source: Alliance_Automated
  text: Enables protein serine/threonine kinase activity. Involved in several processes,
    including Wnt signaling pathway, regulating spindle positioning; engulfment of
    apoptotic cell; and left/right axis specification. Predicted to be active in cytosol
    and nucleus. Is expressed in distal tip cell; germ line; seam cell; and sperm.
    Human ortholog(s) of this gene implicated in several diseases, including bipolar
    disorder; endometrial disease; neurodegenerative disease (multiple); oral squamous
    cell carcinoma; and schizophrenia. Orthologous to several human genes including
    GSK3B (glycogen synthase kinase 3 beta).
