descriptions:
- source: UniProt
  text: Phosphorylates oma-1, a regulator of the oocyte-to-embryo transition, enabling
    its degradation (PubMed:16289132, PubMed:16343905). Phosphorylates skn-1, preventing
    it from accumulating in nuclei and thus inhibiting phase II gene expression in
    the oxidative stress defense (PubMed:16251270). Involved in mesendoderm specification
    and mitotic spindle orientation in EMS blastomeres (PubMed:11463373). Thought
    to be a branch point in these processes as proteins downstream are not required
    (PubMed:10444600). Negatively regulates Wnt signaling in vulval precursor cells
    and acts as a Wnt-independent repressor of med-1 and med-2 in the C lineage inhibiting
    mesoderm development (PubMed:10444600, PubMed:11463373, PubMed:15572126). Required
    for normal lifespan and LiCl-induced lifespan extension (PubMed:17959600).
