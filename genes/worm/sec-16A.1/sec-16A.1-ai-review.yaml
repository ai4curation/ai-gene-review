suggested_questions:
- question: Does worm SEC-16 bind SEC-23/SEC-24 and SEC-13/SEC-31 directly through its
    central and C-terminal domains, as shown for yeast and mammalian Sec16?
- question: How are functions divided between sec-16A.1 and the other C. elegans
    Sec16-family loci, and is sec-16A.1 the only one acting at germline ERES?
- question: Should UniProt revise the ERGIC subcellular location for P34643, given that
    the cited paper (PMID:23840591) uses SEC-16 only as an ER exit site marker?
suggested_experiments:
- description: Pull-down of recombinant SEC-16 domains with purified SEC-23/SEC-24 and
    SEC-13/SEC-31, and tissue-specific degron depletion of endogenously tagged SEC-16
    followed by cargo-export (e.g. RUSH-type) assays in intestine and hypodermis.
  hypothesis: SEC-16 binds COPII subunits directly and is required for ER export in
    somatic secretory tissues as well as the germline.
