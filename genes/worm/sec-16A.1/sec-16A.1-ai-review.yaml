description: >-
  sec-16A.1 (ZK512.5) encodes the Caenorhabditis elegans SEC-16 protein, a large
  (1232 aa), largely disordered member of the SEC16 family carrying the conserved
  central domain and the C-terminal Sec23-binding domain. SEC-16 is a peripheral
  scaffold of endoplasmic reticulum exit sites (ERES), the ER subdomains where
  COPII vesicles bud. In the germline and oocytes it marks ERES puncta, binds
  directly to the N-terminus of the hexameric TFG-1 protein, and is required for
  TFG-1 and the COPII subunit SEC-13 to assemble at these sites; SEC-16 and TFG-1
  co-fractionate in large complexes that also contain COPII subunits. Depletion of
  SEC-16 disrupts ERES and COPII puncta, mislocalizes the Golgi marker RAB-6, and
  prevents embryo production, consistent with a conserved role in organizing
  COPII-dependent export of secretory cargo from the ER toward the Golgi.
