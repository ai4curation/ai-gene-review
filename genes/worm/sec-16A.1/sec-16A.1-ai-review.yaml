    SEC16-family scaffold of endoplasmic reticulum exit sites; binds TFG-1 directly
    and anchors TFG-1 and COPII coat subunits (SEC-13) at ERES, organizing
    COPII-dependent export of secretory cargo from the ER toward the Golgi.
