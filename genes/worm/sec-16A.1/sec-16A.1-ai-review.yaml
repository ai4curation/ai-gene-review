- term:
    id: GO:0006888
    label: endoplasmic reticulum to Golgi vesicle-mediated transport
  evidence_type: IMP
  original_reference_id: PMID:21478858
  qualifier: involved_in
  review:
    summary: >-
      SEC-16 RNAi abolishes normal ERES/COPII (SEC-13) puncta and shifts the Golgi
      marker RAB-6 to enlarged endosome-like structures; SEC-16 is required for
      embryo production along with COPII subunits.
    action: ACCEPT
    reason: >-
      Loss-of-function evidence combined with SEC-16's direct role in assembling
      COPII at ERES (remaining SEC-16 continues to recruit COPII in proportion to its
      level) shows the protein does part of the work of COPII vesicle formation, not
      merely that it is needed. Core process.
    supported_by:
    - reference_id: PMID:21478858
      supporting_text: Depletion of SEC-16 led to nearly complete loss of puncta labeled
        by TFG-1, and the few structures that were observed appeared abnormally large
        and did not co-stain for the COPII component SEC-13
    - reference_id: PMID:21478858
      supporting_text: following depletion of either SEC-16 or TFG-1, RAB-6 accumulated
        on fewer, large punctate structures in the germline that also harbored RAB-5,
        suggesting that RAB-6 localization was shifted from the Golgi to enlarged early
        endosomes
    - reference_id: PMID:21478858
      supporting_text: indicating that the remaining SEC-16 on ER exit sites can continue
        to recruit COPII components in the absence of TFG-1
