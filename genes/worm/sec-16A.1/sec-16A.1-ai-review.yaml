  review:
    summary: >-
      UniProt cites Ackema et al. 2013 for ERGIC localization. In the full text,
      SEC-16 is used only as an ERES marker adjacent to GBF-1 and the cis-Golgi;
      the paper does not mention an ERGIC or localize SEC-16 to one.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The full text of PMID:23840591 (cached) supports ER exit site localization,
      which is already annotated (GO:0070971, IDA from this same paper). ERGIC is a
      distinct post-ER compartment; nothing in the paper places SEC-16 there, and
      SEC16-family proteins are ERES-resident scaffolds. The ERGIC claim therefore
      exceeds the evidence. Not REMOVE, because the observation (SEC-16 puncta at
