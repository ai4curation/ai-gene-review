    overall_notes: 'Concise and cited: ERES organization with TFG-1 promoting ER-to-ERGIC/Golgi
      export.'
- source: Alliance_Imported
  text: 'sec-16 encodes a scaffolding protein homologous to human SEC-16A (OMIM: 612854);
    SEC-16 directly interacts with TFG-1; SEC-16 localizes to endoplasmic reticulum
    exit sites with both TFG-1 and COPII machinery; levels of SEC-16 correlates with
    those of TFG-1, regardless of whether they were high or low SEC-16 requires TFG-1
    to accumulate normally and TFG-1 requires SEC-16 for its localization on endoplasmic
    reticulum exit sites; normal assembly of large complexes containing SEC-16 and
    COPII subunits is facilitated by TFG-1 hexamers; SEC-16 on endoplasmic reticulum
    exit sites can continue to recruit COPII components in the absence of TFG-1, although
    to lower levels; Sec16 interacts with the N terminus of TFG in an evolutionarily
    conserved manner. SEC-16 is detectable at the two-cell stage of embryogenesis
    and expression continues throughout embryogenesis, punctated pattern in cytoplasm
    colocalizing with mitochondrial COX1.'
  source_type: curated
