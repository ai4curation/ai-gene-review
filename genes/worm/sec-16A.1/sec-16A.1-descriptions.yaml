descriptions:
- source: UniProt
  text: Plays a role in the organization of the endoplasmic reticulum exit sites (ERES),
    also known as transitional endoplasmic reticulum (tER) (PubMed:21478858). In association
    with tfg-1, accumulates at ERES to positively regulate secretory cargo trafficking
    from the endoplasmic reticulum to the endoplasmic reticulum-Golgi intermediate
    compartment (ERGIC) and Golgi apparatus (PubMed:21478858).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P34643
