gene_symbol: sec-16A.1
organism: worm
uniprot_id: P34643
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Plays a role in the organization of the endoplasmic reticulum exit sites (ERES),
    also known as transitional endoplasmic reticulum (tER) (PubMed:21478858). In association
    with tfg-1, accumulates at ERES to positively regulate secretory cargo trafficking
    from the endoplasmic reticulum to the endoplasmic reticulum-Golgi intermediate
    compartment (ERGIC) and Golgi apparatus (PubMed:21478858).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P34643
  source_id: P34643
- source: Alliance_Imported
  text: 'sec-16 encodes a scaffolding protein homologous to human SEC-16A (OMIM: 612854);
    SEC-16 directly interacts with TFG-1; SEC-16 localizes to endoplasmic reticulum
    exit sites with both TFG-1 and COPII machinery; levels of SEC-16 correlates with
    those of TFG-1, regardless of whether they were high or low SEC-16 requires TFG-1
    to accumulate normally and TFG-1 requires SEC-16 for its localization on endoplasmic
    reticulum exit sites; normal assembly of large complexes containing SEC-16 and
    COPII subunits is facilitated by TFG-1 hexamers; SEC-16 on endoplasmic reticulum
    exit sites can continue to recruit COPII components in the absence of TFG-1, although
    to lower levels; Sec16 interacts with the N terminus of TFG in an evolutionarily
    conserved manner. SEC-16 is detectable at the two-cell stage of embryogenesis
    and expression continues throughout embryogenesis, punctated pattern in cytoplasm
    colocalizing with mitochondrial COX1.'
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00013985;class=Gene
  source_id: WB:WBGene00013985
- source: Alliance_Automated
  text: Predicted to enable protein-membrane adaptor activity. Involved in endoplasmic
    reticulum to Golgi vesicle-mediated transport. Located in endoplasmic reticulum
    exit site and endoplasmic reticulum-Golgi intermediate compartment. Orthologous
    to several human genes including SEC16B (SEC16 homolog B, endoplasmic reticulum
    export factor).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00013985;class=Gene
  source_id: WB:WBGene00013985
