    summary: PAINT propagation of cholinergic-transmission involvement in the RIC-3 family.
    action: MODIFY
    reason: >-
      The direction of the propagated claim is sound but the term is too
      direct. RIC-3 does not carry acetylcholine across the synapse; it is an
      ER nAChR maturation factor whose loss reduces cholinergic receptor
      function. Positive regulation of cholinergic synaptic transmission
      captures that role more precisely.
    proposed_replacement_terms:
    - id: GO:0032224
      label: positive regulation of synaptic transmission, cholinergic
