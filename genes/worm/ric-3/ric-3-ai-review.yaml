id: Q22472
gene_symbol: ric-3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: >-
  RIC-3 is a conserved, two-pass endoplasmic-reticulum membrane protein in
  Caenorhabditis elegans that promotes maturation and functional cell-surface
  expression of nicotinic acetylcholine receptors. Genetic and heterologous
  expression studies show that RIC-3 is required for several C. elegans nAChRs,
  including DEG-3/DES-2 and the neuronal ACR-2 receptor, and interacts
  differently with different receptor subunits. Its transmembrane domains are
  sufficient for the effects on DEG-3/DES-2 receptor quantity and gating
  properties, consistent with an ER-resident, subunit-selective chaperone or
  assembly-factor role.
