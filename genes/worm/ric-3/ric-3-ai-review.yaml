        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          PAINT correctly groups RIC-3-family nAChR maturation factors, but
          GO:0007271 names cholinergic transmission itself rather than the
          positive regulatory role supplied by the ER maturation factor.
    supported_by:
    - reference_id: PMID:11867529
      supporting_text: >-
        Together, these data suggest that RIC-3 is specifically required for
        the maturation of acetylcholine receptors.
