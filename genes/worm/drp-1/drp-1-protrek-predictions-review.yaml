    summary: >-
      Rank 2 (score 17.54), absent from GOA and obsolete in the current GO release. The term states
      DRP-1's actual mechanism - recruitment to constriction sites followed by oligomerization and
      GTP-driven scission - at a level of detail GOA does not currently hold for this gene, which
      stops at mitochondrial fission (IBA/IGI/IMP). Correct and a real refinement; the obsolescence
      means it would have to be entered as the surviving equivalent rather than as this identifier.
    supported_by:
