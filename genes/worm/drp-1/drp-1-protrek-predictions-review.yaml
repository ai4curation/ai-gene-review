    id: GO:0061883
    label: clathrin-dependent endocytosis involved in vitellogenesis
  predicted_term_type: GO_BP
  review:
    assessment: PLI
    confidence_score: 0
    error_type: PARALOG_OVERANNOTATION
    summary: >-
      Top-ranked hit (score 17.69), absent from GOA. Clathrin-dependent endocytosis involved in vitellogenesis
      is the function of classical dynamin - in C. elegans, dyn-1 - which pinches clathrin-coated
      vesicles from the plasma membrane, including during yolk uptake by the oocyte. DRP-1 is a dynamin-related
      protein that acts on the mitochondrial outer membrane and has no endocytic role; the two branches
      of the dynamin superfamily share the GTPase fold and little else. The single clearest within-superfamily
      substitution in the worm set.
    supported_by:
