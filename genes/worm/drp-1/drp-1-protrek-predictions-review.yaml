  label: Caenorhabditis elegans
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for worm drp-1, the dynamin-related GTPase that drives mitochondrial
  outer membrane fission. Rank 2 is the most mechanistically precise call in the worm set - dynamin
  family protein polymerization involved in mitochondrial fission is exactly DRP-1's mechanism, and
  more informative than GOA's mitochondrial fission - but it is obsolete in the current GO release,
  and it sits below a classical clathrin-endocytosis term that belongs to the paralog DYN-1. The dynamin
  family split into fission and endocytosis branches is precisely what a sequence-only method has
  to get right here, and the top hit gets it backwards. Ranks 3 and 4 are two spellings of the same
  less-specific localization idea, both less precise than GOA's intracellular distribution of mitochondria.
  The Function channel returns DRP-1's own comment at 20.47. Assessment: 1 correct novel, 1 less precise,
  1 paralog incorrect. Assessment: 1 correct novel (COR), 1 less precise (LSP), 1 paralog incorrect
  (PLI).
