gene_symbol: drp-1
organism: worm
uniprot_id: Q8WQC9
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Functions in mitochondrial division (PubMed:10619028, PubMed:15716954, PubMed:18722182,
    PubMed:19327994). Functions in peroxisomal division (By similarity). Mediates
    membrane fission, perhaps mainly of the mitochondrial outer membrane (PubMed:10619028).
    Mitochondrial fission may be promoted by recruitment to mitochondrial membranes
    via the egl-1/ced-9 complex (PubMed:21949250). Involved in the coordination of
    mitochondrial division with autophagy in response to acute heat stress during
    larval development (PubMed:33734301). Plays a role in apoptosis by promoting mitochondrial
    elimination and cell- death execution, acting downstream of caspase ced-3, and
    perhaps independently of FIS1-related protein fis-2, caspase ced-9 and apoptosis-inducing
    factor AIFM/wah-1 (PubMed:15716954, PubMed:18722182). Role in promoting apoptosis
    dependent upon cleavage of drp-1 by ced-3 (PubMed:18722182). Involved in negatively
    modulating longevity in concert with the Insulin/IGF-1-like signaling (IIS) mediated
    pathway (PubMed:21463460).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q8WQC9
  source_id: Q8WQC9
- source: Alliance_Imported
  text: drp-1 encodes a dynamin-related protein, orthologous to Dnm1p in S. cerevisiae
    and DRP1 in mammals, that is required for severing of the mitochondrial outer
    membrane during mitochondrial division.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00001093;class=Gene
  source_id: WB:WBGene00001093
- source: Alliance_Automated
  text: Predicted to enable GTP binding activity; GTPase activity; and microtubule
    binding activity. Involved in apoptotic mitochondrial changes; embryo development;
    and mitochondrial fission. Located in mitochondrial outer membrane. Is expressed
    in several structures, including germ line; intestine; non-striated muscle; rectal
    muscle; and somatic nervous system. Used to study Parkinson's disease. Human ortholog(s)
    of this gene implicated in encephalopathy due to defective mitochondrial and peroxisomal
    fission 1 and optic atrophy 5. Orthologous to human DNM1L (dynamin 1 like).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00001093;class=Gene
  source_id: WB:WBGene00001093
