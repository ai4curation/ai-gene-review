- source: Alliance_Automated
  text: Predicted to enable GTP binding activity; GTPase activity; and microtubule
    binding activity. Involved in apoptotic mitochondrial changes; embryo development;
    and mitochondrial fission. Located in mitochondrial outer membrane. Is expressed
    in several structures, including germ line; intestine; non-striated muscle; rectal
    muscle; and somatic nervous system. Used to study Parkinson's disease. Human ortholog(s)
    of this gene implicated in encephalopathy due to defective mitochondrial and peroxisomal
    fission 1 and optic atrophy 5. Orthologous to human DNM1L (dynamin 1 like).
