descriptions:
- source: UniProt
  text: Functions in mitochondrial division (PubMed:10619028, PubMed:15716954, PubMed:18722182,
    PubMed:19327994). Functions in peroxisomal division (By similarity). Mediates
    membrane fission, perhaps mainly of the mitochondrial outer membrane (PubMed:10619028).
    Mitochondrial fission may be promoted by recruitment to mitochondrial membranes
    via the egl-1/ced-9 complex (PubMed:21949250). Involved in the coordination of
    mitochondrial division with autophagy in response to acute heat stress during
    larval development (PubMed:33734301). Plays a role in apoptosis by promoting mitochondrial
    elimination and cell- death execution, acting downstream of caspase ced-3, and
    perhaps independently of FIS1-related protein fis-2, caspase ced-9 and apoptosis-inducing
    factor AIFM/wah-1 (PubMed:15716954, PubMed:18722182). Role in promoting apoptosis
    dependent upon cleavage of drp-1 by ced-3 (PubMed:18722182). Involved in negatively
    modulating longevity in concert with the Insulin/IGF-1-like signaling (IIS) mediated
    pathway (PubMed:21463460).
