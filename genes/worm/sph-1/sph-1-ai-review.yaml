- id: PMID:16698939
  title: Synaptic tetraspan vesicle membrane proteins are conserved but not needed for 
    synaptogenesis and neuronal function in Caenorhabditis elegans.
  findings:
  - statement: SPH-1 is the single worm physin; sph-1 is expressed mostly in pharyngeal and anal 
      sphincter muscle, not pan-neuronally.
    supporting_text: Synaptogyrin is expressed pan-neuronally ( 22 ). Synaptophysin is mostly 
      localized to the muscles of the pharynx and anal sphincter.
  - statement: Translational fusions show a punctate, vesicle-associated distribution.
    supporting_text: Translational fusions further revealed a punctate distribution, suggesting that
      these proteins are associated with vesicles (data not shown).
  - statement: The three worm TVPs colocalise in the same vesicular compartment in mammalian cells.
    supporting_text: Fluorescence microscopy showed a considerable degree of colocalization of all 
      three TVPs ( Fig. 1 ).
  - statement: sph-1 nulls and TVP triple mutants have normal development, synapse density and 
      neuromuscular function.
    supporting_text: The morphologies and gross behaviors of all mutant worms were remarkably 
      unaffected.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached; the only primary study of sph-1.
- id: file:worm/sph-1/sph-1-deep-research-falcon.md
  title: Deep research report for sph-1 (falcon / Edison Scientific Literature)
  findings:
  - statement: SPH-1::YFP is punctate and vesicular, in pharyngeal epithelium and some pharyngeal 
      neurons, intestinal valve, intestine, excretory canal and duct, rectal gland, anal sphincter, 
      and only weakly in the nervous system.
    supporting_text: SPH-1::YFP had a punctate distribution characteristic of vesicular 
      compartments. In adult worms, it was detected in pharyngeal epithelial cells and some 
      pharyngeal neurons, the intestinal valve, intestine, excretory canal and duct cells, rectal 
      gland and epithelial cells, anal sphincter, and weakly in coelomocytes and the nervous system
  - statement: Loss of all three tetraspan vesicle proteins gives no baseline defect in behaviour, 
      neuronal anatomy or synaptobrevin clustering.
    supporting_text: Even simultaneous loss of *sph-1*, *sng-1*, and *scm-1* produced no large 
      baseline defect in locomotion, mechanosensation, chemotaxis, adaptation, thermotaxis, osmotic 
      avoidance, brood production, neuronal anatomy, or synaptobrevin-cluster distribution.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: LLM literature synthesis. Its SPH-1 localisation detail derives from a doctoral 
      thesis (Abraham 2007), not from a peer-reviewed paper, so it is used only as corroboration of 
      the peer-reviewed PMID:16698939 findings, which agree with it.
core_functions: []
suggested_questions:
- question: Which secretory vesicles of pharyngeal and anal sphincter muscle carry SPH-1, and does 
    it bind cholesterol or organise their membranes as vertebrate synaptophysin does?
- question: Is there any neuronal expression of sph-1 below the detection limit of promoter-GFP 
    reporters, and does SPH-1 interact with SNB-1?
suggested_experiments:
- description: Endogenous CRISPR tagging of sph-1 with immuno-EM in pharyngeal muscle, and sph-1 
    sng-1 double-mutant analysis of muscle vesicle ultrastructure and cholesterol sensitivity.
  hypothesis: SPH-1 organises cholesterol-rich secretory/recycling vesicles in muscle rather than 
    synaptic vesicles.
