gene_symbol: sph-1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: >-
  SPH-1 is the single Caenorhabditis elegans physin, a tetraspan (MARVEL-domain) vesicle membrane
  protein of the synaptophysin/synaptoporin family. Unlike mammalian synaptophysin, and unlike the
  worm synaptogyrin SNG-1 which is pan-neuronal, sph-1 is expressed mostly in the muscles of the
  pharynx and anal sphincter, where the protein shows a punctate, vesicle-associated distribution;
  when expressed in mammalian cells it shares a vesicular compartment with the other worm
  tetraspan vesicle proteins SNG-1 and SCM-1. Null mutants, and even scm-1 sph-1 sng-1 triple
  mutants, develop normally with normal neuronal architecture, synapse density, behaviour and
  neuromuscular electrophysiology, showing that tetraspan vesicle proteins are dispensable for
  synaptogenesis and neurotransmission in the worm. The molecular function of SPH-1 in muscle
  secretory vesicles is unknown.
