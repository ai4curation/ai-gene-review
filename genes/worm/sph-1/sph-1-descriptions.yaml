descriptions:
- source: Alliance_Imported
  text: sph-1 encodes a member of the synaptophysin/synaptoporin family that contains
    a MARVEL domain, a membrane-associating domain found in lipid-associating proteins,
    and contains a transmembrane domain.
  source_type: curated
