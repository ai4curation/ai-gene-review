- source: Alliance_Automated
  text: Located in cytoplasmic vesicle. Is expressed in anal sphincter muscle and
    pharyngeal muscle cell. Human ortholog(s) of this gene implicated in non-syndromic
    X-linked intellectual disability 96. Orthologous to several human genes including
    SYNPR (synaptoporin).
