- source: Alliance_Imported
  text: xbp-1 encodes a bZIP transcription factor orthologous to yeast Hac1 and mammalian
    X box-binding protein 1 (XBP-1, OMIM:194355); XBP-1 is required for the unfolded
    protein response (UPR) that counteracts cellular stress induced by accumulation
    of unfolded proteins in the endoplasmic reticulum (ER); xbp-1 mRNA is spliced
    by the IRE-1 endoribonuclease to promote translation of transcriptionally active
    XBP-1 that positively regulates UPR gene expression to maintain ER homeostasis
    and promote normal development; loss of xbp-1 activity also results in near-complete
    loss of myo-2 pharnygeal myosin expression, although pharyngeal muscle is still
    present.
