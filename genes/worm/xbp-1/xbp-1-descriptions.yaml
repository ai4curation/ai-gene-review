  text: Enables RNA polymerase II transcription regulatory region sequence-specific
    DNA binding activity. Involved in several processes, including IRE1-mediated unfolded
    protein response; defense response to Gram-negative bacterium; and determination
    of adult lifespan. Predicted to be active in nucleus. Is expressed in several
