descriptions:
- source: UniProt
  text: 'Required for transcriptional regulation of the unfolded protein response
    (UPR) in the endoplasmic reticulum (ER) under stressed conditions, acting downstream
    of ire-1, and also maintaining ER homeostasis via a negative feedback loop, in
    parallel with ER kinase pek-1 (PubMed:11779465, PubMed:11780124, PubMed:16184190,
    PubMed:22125500). May also regulate Golgi protein trafficking distal to the ER
    (PubMed:16184190). Protects the host organism from the detrimental effects of
    mounting an innate immune response to microbes, such as the Gram-negative bacterium
    P.aeruginosa, probably by modulating the UPR (PubMed:20182512, PubMed:22125500).
    . [Isoform 1]: Plays a role in the unconventional cytoplasmic splicing processing
    of its own mRNA triggered by the endoplasmic reticulum (ER) transmembrane endoribonuclease
    ire-1: upon ER stress, the emerging xbp-1 polypeptide chain, as part of a mRNA-ribosome-
    nascent chain (R-RNC) complex, cotranslationally recruits its own unprocessed
    mRNA through transient docking to the ER membrane and translational pausing, therefore
    facilitating efficient ire-1-mediated xbp-1 mRNA isoform 2 production. . [Isoform
    2]: Functions as a stress-inducible potent transcriptional activator during endoplasmic
    reticulum (ER) stress by inducing unfolded protein response (UPR) target genes
    via binding to the UPR element (UPRE) (By similarity). Plays a role in modulation
    of the UPR, lipid metabolism, proteostasis, and lifespan (PubMed:23791175, PubMed:31303493,
    PubMed:31315038, PubMed:31570707). In neurons, rescues stress resistance, increases
    longevity, and, drives expression of lysosomal genes in the intestine and activates
    the UPR in distal, non- neuronal cell types through a cell-nonautonomous mechanism
    (PubMed:23791175, PubMed:31303493, PubMed:31315038). In neurons or intestine,
    plays a role in protection against proteotoxicity, acting via positive modulation
    of genes involved in lysosomal function, including lipases and the fatty-acid
    desaturase fat-6 (PubMed:31303493, PubMed:31315038). Protection against proteotoxicity
    in neurons is dependent upon the transcription factor atf-6 (PubMed:31570707).'
