gene_symbol: unc-18
organism: worm
uniprot_id: P34815
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Mediates vesicle exocytosis, protein trafficking and neurotransmission (PubMed:12973353,
    PubMed:1347782, PubMed:18596236, PubMed:19032153, PubMed:21423527, PubMed:21445306,
    PubMed:28821673, PubMed:8398155). Associates with SNARE protein unc-64 and thereby
    promotes the anterograde transport of unc-64 out of the endoplasmic reticulum
    and out of neuronal cell bodies (PubMed:18596236). Plays a role in synaptic vesicle
    docking and tethering through its association with unc-64 (PubMed:12973353, PubMed:21423527).
    Competes with SNARE protein tom-1 for binding to unc-64 (PubMed:21423527). Through
    association with unc-64, mediates the release of the neurotransmitter acetylcholine
    from cholinergic motor neurons, and thereby promotes locomotory behaviors (PubMed:1347782,
    PubMed:18596236, PubMed:28821673, PubMed:8398155). In the AFD thermosensory neuron,
    plays a role in regulating temperature-dependent locomotion through its phosphorylation
    by pkc-2 (PubMed:22593072). Probably by regulating neuronal transmission downstream
    of lin-3 and receptor lin-23 and phospholipase plc-3 and upstream of innexin unc-7
    and egl-4/PKG in ALA neurons, involved in the decrease in pharyngeal pumping during
    the quiescent state that precedes each larval molt (PubMed:17891142). Plays a
    role in maintaining the localization of unc-6 in muscle cells (PubMed:20382828).
    Modulates locomotion in response to exogenous stimulants such as ethanol (PubMed:18923141,
    PubMed:24244732).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P34815
  source_id: P34815
- source: Alliance_Imported
  text: unc-18 encodes the C. elegans ortholog of Saccharomyces cervisiae SEC1 and
    mammalian Munc18 proteins; UNC-18 function as a chaperone for UNC-64/syntaxin,
    ensuring its anterograde transport from the endoplasmic reticulum to the plasma
    membrane; UNC-18 also enables the docking of vesicles to synaptic regions before
    vesicle priming and fusion, and promotes synaptic vesicle exocytosis; UNC-18 may
    also inhibit excessive exocytosis; UNC-18 is expressed in ventral cord motor neurons.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00006757;class=Gene
  source_id: WB:WBGene00006757
- source: Alliance_Automated
  text: Enables syntaxin binding activity. Involved in cholinergic synaptic transmission;
    positive regulation of neurotransmitter secretion; and presynaptic dense core
    vesicle exocytosis. Located in axon and plasma membrane. Is expressed in intestine;
    nervous system; and uv1. Used to study alcohol use disorder and developmental
    and epileptic encephalopathy. Human ortholog(s) of this gene implicated in West
    syndrome; developmental and epileptic encephalopathy 4; and familial hemophagocytic
    lymphohistiocytosis 5. Orthologous to several human genes including STXBP1 (syntaxin
    binding protein 1).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00006757;class=Gene
  source_id: WB:WBGene00006757
- source: RefSeq
  text: Enables syntaxin binding activity. Involved in chemical synaptic transmission
