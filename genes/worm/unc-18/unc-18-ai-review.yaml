suggested_questions:
- question: Now that GO:0016081 synaptic vesicle docking has been obsoleted in favour of the molecular
    functions GO:0160321 vesicle docking activity and GO:7770062 vesicle membrane tethering activity,
    should UNC-18 carry one of those activities directly, given that the UNC-18/closed-syntaxin complex
    is what tethers the vesicle?
- question: Does C. elegans UNC-18 contribute to dense-core vesicle docking, as mammalian Munc18-1 does
    in chromaffin cells, or is that role carried entirely by UNC-31/CAPS in the worm?
suggested_experiments:
- description: High-pressure-freeze EM of unc-18 point mutants that selectively disrupt closed- versus
    open-syntaxin binding (including the Ser322 phosphomutants), scoring tethered and docked vesicle pools
    separately, to assign each morphological step to a defined binding mode.
