  label: Caenorhabditis elegans
description: 'UNC-18 is the single Caenorhabditis elegans Sec1/Munc18 (SM) protein, the ortholog of vertebrate
  Munc18-1/STXBP1. It binds the syntaxin UNC-64 - preferentially in its closed conformation - and through
  that interaction is recruited to the presynaptic plasma membrane, where it delivers synaptic vesicles
  to the release site. Loss of UNC-18 severely reduces the readily releasable pool and neurotransmitter
  release, with fewer vesicles tethered within 25 nm of the plasma membrane and fewer docked on it, while
  syntaxin localization and vesicle fusion competence per se are not abolished. UNC-18 activity is regulated
  by phosphorylation: PKC-2 phosphorylates Ser322, reducing closed-syntaxin binding, and this modification
  in the AFD thermosensory neurons sets the temperature dependence of locomotion. UNC-18 also participates,
  with syntaxin and the FEZ1/UNC-76 adaptor, in kinesin-1-dependent axonal transport of syntaxin.'
