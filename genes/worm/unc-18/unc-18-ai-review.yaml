core_functions:
- description: Sec1/Munc18 SM protein that binds the syntaxin UNC-64 in its closed conformation at the
    presynaptic plasma membrane, tethering and docking synaptic vesicles at the release site and thereby
    building the readily releasable pool; the interaction is negatively regulated by PKC-2 phosphorylation
    of Ser322.
