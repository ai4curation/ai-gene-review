    overall_notes: 'Correct: BiP homolog, constitutive and not heat-inducible, L1
      abundance, DTT/tunicamycin induction, KDEL. Molecular chaperone stated as ''likely''.'
- source: Alliance_Automated
  text: Predicted to enable ATP hydrolysis activity; heat shock protein binding activity;
    and protein folding chaperone. Involved in IRE1-mediated unfolded protein response.
    Predicted to be part of endoplasmic reticulum chaperone complex. Predicted to
    be active in endoplasmic reticulum lumen; membrane; and nucleus. Is expressed
    in several structures, including germ line; intestinal muscle; pharyngeal gland
    cell; pharyngeal-intestinal valve; and tail. Human ortholog(s) of this gene implicated
    in dopamine beta-hydroxylase deficiency and infertility. Orthologous to human
    HSPA5 (heat shock protein family A (Hsp70) member 5).
