taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Probably plays a role in facilitating the assembly of multimeric protein complexes
    inside the ER.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P27420
  source_id: P27420
- source: Alliance_Imported
  text: hsp-3 encodes one of two C. elegans heat shock response 70 (hsp70) proteins
    homologous to mammalian grp78/BiP (glucose regulated protein 78/immunoglobulin
    heavy chain-binding protein, OMIM:138120); HSP-3 likely functions as a molecular
    chaperone, and is expressed constitutively (expression is not heat inducible)
    throughout development with greatest abundance during the L1 larval stage; hsp-3
    transcription is, however, upregulated in response to endoplasmic reticulum stress
    induced by dithiothreitol (DTT) or tunicamycin; HSP-3 contains a long hydrophobic
    amino terminus and a carboxyl terminal KDEL sequence suggesting that it may be
    retained in the endoplasmic reticulum.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00002007;class=Gene
  source_id: WB:WBGene00002007
- source: Alliance_Automated
  text: Predicted to enable ATP hydrolysis activity; heat shock protein binding activity;
    and protein folding chaperone. Involved in IRE1-mediated unfolded protein response.
    Predicted to be part of endoplasmic reticulum chaperone complex. Predicted to
    be active in endoplasmic reticulum lumen; membrane; and nucleus. Is expressed
    in several structures, including germ line; intestinal muscle; pharyngeal gland
    cell; pharyngeal-intestinal valve; and tail. Human ortholog(s) of this gene implicated
    in dopamine beta-hydroxylase deficiency and infertility. Orthologous to human
    HSPA5 (heat shock protein family A (Hsp70) member 5).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00002007;class=Gene
  source_id: WB:WBGene00002007
