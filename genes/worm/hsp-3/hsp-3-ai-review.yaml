id: P27420
gene_symbol: hsp-3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: >-
  Caenorhabditis elegans HSP-3 is an ER-resident BiP/HSP70-family chaperone with an N-terminal targeting sequence and C-terminal KDEL retention motif. Its conserved ATP-dependent chaperone mechanism supports folding and quality control of secretory-pathway proteins, and its expression responds to the IRE-1/XBP-1 unfolded-protein-response pathway. HSP-3 and its paralog HSP-4 share essential proteostasis functions but differ in developmental expression, stress responses and signaling phenotypes. HSP-3 is particularly abundant during larval development and contributes to infection-associated antimicrobial gene induction. Purified HSP-3 is AMPylated by FIC-1 at Thr176 in vitro; the site-specific physiological effect remains incompletely resolved.
