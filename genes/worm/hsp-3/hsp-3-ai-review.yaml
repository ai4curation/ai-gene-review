- id: PMID:11779465
  title: Complementary signaling pathways regulate the unfolded protein response and are required for C. elegans development.
  findings:
  - statement: Foundational study establishing that C. elegans uses ire-1-mediated splicing of xbp-1 mRNA for UPR gene transcription and survival upon ER stress.
    supporting_text: C. elegans requires ire-1-mediated splicing of xbp-1 mRNA for UPR gene transcription and survival upon ER stress
  reference_review:
    relevance: MEDIUM
    correctness: UNVERIFIED
    review_notes: >-
      PubMed-verified as the foundational C. elegans UPR paper (Shen et al., Cell 2001) and the source of the WormBase IEP UPR annotations for hsp-3. Only the abstract is cached locally, so the hsp-3-specific expression data underlying the IEP call could not be independently re-verified here; the experimental annotation is deferred to the WormBase curator who read the full text.
- id: PMID:12186849
  title: A survival pathway for Caenorhabditis elegans with a blocked unfolded protein response.
  findings:
  - statement: Genome-wide microarray of the C. elegans ER-stress response; hsp-3 (cosmid C15H9.6) is among the tunicamycin-induced genes whose induction is attenuated in xbp-1 mutants (Table I), establishing hsp-3 as an xbp-1-dependent UPR target.
    supporting_text: in C. elegans, the ire-1 and xbp-1 pathway has retained its essential role in upregulating expression of many UPR target genes that are similarly upregulated by the homologous pathway in yeast
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Urano et al., J Cell Biol 2002). hsp-3 is unambiguously cosmid C15H9.6 (UniProt/WormBase ORFName); C15H9.6 appears in Table I of tunicamycin- induced, xbp-1-dependent genes (N2 log2 1.32 +/- 0.06, reduced to 0.68 +/- 0.05 in xbp-1), directly supporting the HEP UPR annotation on hsp-3.
- id: PMID:2225768
  title: The HSP70 multigene family of Caenorhabditis elegans.
  findings:
  - statement: Reviews the C. elegans HSP70 multigene family, including the ER-resident BiP-type members; used as the ISS source for ATP hydrolysis activity.
  reference_review:
    relevance: LOW
    correctness: UNVERIFIED
    review_notes: >-
      Review article (Heschl & Baillie 1990); abstract-only in the local cache. Cited by WormBase as the ISS basis (by similarity to yeast KAR2, UniProtKB:P16474) for the HSP70 ATPase activity of hsp-3. Family-level context rather than direct hsp-3 functional data.
- id: PMID:27138431
  title: The Caenorhabditis elegans Protein FIC-1 Is an AMPylase That Covalently Modifies Heat-Shock 70 Family Proteins, Translation Elongation Factors and Histones.
  findings:
  - statement: The paper describes HSP-3 as retained in the ER lumen as biological background, not as a new target localization experiment.
    supporting_text: HSP-1 is predominantly cytosolic, whereas HSP-3 is retained within the ER lumen.
  - statement: HSP-3 is an ex-vivo lysate-screen and purified-protein AMPylation substrate of FIC-1, with Thr176 identified in vitro; direct site-specific modification in intact worms is not demonstrated.
    supporting_text: 'two classes of proteins over-represented amongst the AMPylated fraction of proteins: HSP 70 proteins (HSP-1, HSP-3)'
  - statement: The introduction invokes the classical BiP interaction/repression model for IRE-1, ATF-6 and PEK-1; it does not directly assay a ternary HSP-3 sensor complex.
    supporting_text: form a complex with IRE-1, ATF-6 and PEK-1, to preclude activation of UPR-related signaling events
  - statement: HSP-3 contributes to tolerance of chronic ER stress and to innate immunity, based on hypersensitivity of hsp-3 animals to Pseudomonas aeruginosa.
    supporting_text: highlighting a role for HSP-3 in the tolerance of chronic ER stress and innate immunity.
  - statement: The two worm BiP paralogs hsp-3 and hsp-4 are assumed to cross-compensate as ER-resident chaperones, framing their functional redundancy.
    supporting_text: elegans encodes two Grp78/BiP homologues, hsp-3 and hsp-4, assumed to cross-compensate for each other in their roles as ER-residing protein chaperones
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full Results, Methods and S2 caption checked. HSP-3 is directly AMPylated with purified protein; lysate target discovery mixes worm lysate with recombinant FIC-1 and modified ATP ex vivo. Neither direct in-vivo Thr176 modification, a new localization experiment, nor HSP-3 co-IP with all three UPR sensors is shown. Those earlier summaries overstated assay scope.
- id: PMID:41387410
  title: Functionally diversified Caenorhabditis elegans BiP orthologs control body growth, reproduction, stress resistance, aging, and autophagy.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full Results/Discussion and relevant reporter/co-IP Methods read. Genetically distinguishes HSP-3/HSP-4 developmental, transcriptional and stress roles; canonical HSP-3 refolding is a supported model rather than purified kinetics. The BiP/IRE1/Sec62 co-IP is human A549, not direct HSP-3 binding.
- id: PMID:39134659
  title: Identification of BiP as a temperature sensor mediating temperature-induced germline sex reversal in C. elegans.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full genetic Results and binding Methods read. Hsp-4 RNAi affects both paralogs in this study; genetic dosage supports redundant germline functions. TRA-2 co-IP directly uses HSP-4 expressed in HEK293 cells; it must not be presented as direct HSP-3 binding or a general proof that HSP-3 performs ERAD degradation.
- id: PMID:22546897
  title: A UPR-independent infection-specific role for a BiP/GRP78 protein in the control of antimicrobial peptide expression in C. elegans epidermis.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full target mutant, infection, rescue-context Results and Discussion read. Supports an HSP-3-dependent infection-specific antimicrobial response. Extra-ER action is explicitly a hypothesis, not a measured cytosolic pool; no new immune-process annotation is inferred from the phenotype.
- id: PMID:1373379
  title: Analysis of the BiP gene and identification of an ER retention signal in Schizosaccharomyces pombe.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed abstract verified; source experiment directly localizes fission-yeast BiP to nuclear envelope, cell periphery and reticular cytoplasm. This supports interpretation of the BiP node, not a direct worm localization measurement.
- id: file:worm/hsp-3/hsp-3-deep-research-falcon.md
  title: Falcon research report on C. elegans HSP-3
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Actual narrative, comparative table and cited findings read. Useful2025 paralog-diversification and2012 infection leads, checked in primary papers. Refolding specialization is a model supported by expression/phenotypes, not directly measured enzyme kinetics; extra-ER activity remains explicitly speculative; direct TRA-2 binding is HSP-4. AMPylation site evidence is in vitro.
