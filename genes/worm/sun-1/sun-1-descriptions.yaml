gene_symbol: sun-1
organism: worm
uniprot_id: Q20924
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Involved in centrosome attachment to the nucleus. Required for zyg-12 localization
    to the nuclear envelope. Together with pot-1, it is required to anchor telomeres
    to the nuclear envelope in embryos (PubMed:24297748).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q20924
  source_id: Q20924
- source: Alliance_Imported
  text: sun-1 encodes a protein member of the SUN-domain family, also called Matefin
    and is paralogous to UNC-84, whose general domain organization (one or more central
    transmembrane and coiled-coil domains, followed by a C-terminal SUN domain) is
    shared by Sad1p from Schizosaccharomyces pombe and UNC-84 from C. elegans; SUN-domain
    proteins bind lamins and the KASH domain proteins of the outer nuclear membrane;
    SUN-1 along with the KASH-domain protein ZYG-12, is required for movement, homologous
    pairing and interhomolog recombination of chromosomes during meiosis; SUN-1 is
    a nuclear envelope receptor for CED-4 during apoptosis, and is bound by CED-4
    in vitro; SUN-1 colocalizes with the nuclear lamin LMN-1 in vivo and binds it
    in vitro; SUN-1 is required for localization of the hook protein ZYG-12 to the
    nuclear envelope, and thus for the attachment of centrosomes to nuclei; SUN-1
    is strongly expressed in the nuclear envelope of all early embryonic cells, the
    primordial germ cells Z2 and Z3, and the germ cell lineage (but not in sperm).
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00006311;class=Gene
  source_id: WB:WBGene00006311
- source: Alliance_Automated
  text: Predicted to enable protein-membrane adaptor activity. Involved in several
    processes, including centrosome localization; embryo development; and regulation
    of centrosome duplication. Located in nuclear envelope. Is expressed in several
    structures, including AB; C; D; E; and germ line. Human ortholog(s) of this gene
    implicated in spermatogenic failure 16. Orthologous to human SUN5 (Sad1 and UNC84
    domain containing 5).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00006311;class=Gene
  source_id: WB:WBGene00006311
