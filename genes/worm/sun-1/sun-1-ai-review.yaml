gene_symbol: sun-1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: SUN-1 (matefin, MTF-1) is a C. elegans SUN-domain protein of the inner nuclear membrane,
  a type II membrane protein with a nucleoplasmic N-terminus and a luminal C-terminal region that contains
  the SUN domain. SUN-1 binds the divergent short KASH domain of the Hook-family protein ZYG-12 in the
  perinuclear space (through a luminal region outside the canonical SUN domain) and retains ZYG-12 in
  the outer nuclear membrane. In early embryos the SUN-1/ZYG-12 bridge, with dynein, attaches centrosomes
  to the nuclear envelope, which is essential for normal spindles and embryonic viability; SUN-1 also
  anchors telomeres at the nuclear periphery in embryos together with the shelterin protein POT-1. In
  the germline, SUN-1/ZYG-12 complexes gather into mobile patches at the nuclear envelope where the chromosomal
  pairing centers attach, and connect them to cytoplasmic microtubules and dynein. The resulting chromosome
  movements drive homolog pairing and prevent nonhomologous synapsis. CHK-2-dependent phosphorylation
  of the SUN-1 nucleoplasmic domain in leptotene/zygotene regulates this program. SUN-1 is also reported
  to bind the apoptosis protein CED-4 and to be required for its translocation to the nuclear envelope
  during apoptosis.
