suggested_questions:
- question: C. elegans meiosis attaches subtelomeric pairing centers rather than telomeres to the nuclear
    envelope. Is there a GO process term for meiotic pairing-center attachment to the nuclear envelope,
    analogous to GO:0070197 meiotic attachment of telomere to nuclear envelope, or should GO:0070197 be
    interpreted to include it?
  experts:
  - GO biological process editors
  - meiosis biologists
- question: Should SUN-1's reported role as the nuclear-envelope receptor for CED-4 during apoptosis (PMID:16938876)
    be captured by a process annotation, given that it rests on a single study?
  experts:
  - WormBase curators
suggested_experiments:
- description: Structural analysis of the SUN-1-ZYG-12 luminal complex, which uses a SUN-1 region outside
    the canonical SUN domain and a mini-KASH peptide.
  hypothesis: The SUN-1-ZYG-12 interface differs from the canonical SUN2-KASH groove, explaining binding
    outside the SUN domain.
  experiment_type: structural biology
