  evidence_type: IMP
  original_reference_id: PMID:17543861
  review:
    summary: sun-1(jf18) abolishes presynaptic homolog alignment; SUN-1/ZYG-12 transmit microtubule forces
      to pairing centers.
    action: NEW
    reason: 'SUN-1 does part of the work of pairing: it is the inner-membrane half of the bridge that
      physically connects pairing centers to microtubules and dynein, and it aggregates at the chromosome
      attachment sites (structural participation, not only necessity). Comparator: the human KASH5 review
      and SUN1 review carry the equivalent meiotic chromosome movement/pairing terms, and GO:0007129 is
      annotated in C. elegans to structural pairing/synapsis proteins (HTP-3, SYP proteins). No GOA row
      currently records the defining meiotic function of SUN-1.'
