core_functions:
- description: >-
    Furin/Kex2-like serine endoprotease activity that proteolytically
    processes secretory proproteins at dibasic cleavage sites. In external
    epithelia this activity promotes N-terminal processing of cuticle
    collagens, including SQT-3 and DPY-17, so that they can be efficiently
    secreted before assembly of the collagenous cuticle.
  molecular_function:
    id: GO:0004252
    label: serine-type endopeptidase activity
  directly_involved_in:
  - id: GO:0016485
    label: protein processing
  - id: GO:0040002
    label: collagen and cuticulin-based cuticle development
  supported_by:
  - reference_id: PMID:37721936
    supporting_text: >-
      Furthermore, this early secretion depends on BLI-4/PCSK; in bli-4 and
      cleavage-site mutants, SQT-3 and DPY-17 are not efficiently secreted and
      instead form large intracellular puncta.
  - reference_id: PMID:10903434
    supporting_text: >-
      h384 represents a molecular null mutant in which the catalytically
      essential serine residue (Ser415) is replaced by phenylalanine.
knowledge_gaps:
- gap_statement: >-
    The exact compartment in which BLI-4 cleaves cuticle collagens is not yet
    known.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  significance: >-
    BLI-4 is a membrane-anchored secretory-pathway proprotein convertase, PAINT
    places the family at the Golgi/TGN, and endogenous BLI-4::SfGFP marks
    sub-apical intracellular puncta as well as faint extraembryonic signal, but
    BLI-4 has not been colocalized with Golgi, TGN, endosomal, or apical
    membrane markers during collagen secretion.
  resolution: >-
    Image the functional BLI-4::SfGFP reporter with stage-matched Golgi, TGN,
    endosomal, plasma-membrane and extracellular markers during SQT-3 and
    DPY-17 secretion.
  provenance:
  - reference_id: PMID:37721936
    supporting_text: >-
      BLI-4 localizes to intracellular and extracellular compartments
- gap_statement: >-
    Direct biochemical cleavage of SQT-3, DPY-17 or other cuticle collagens by
    BLI-4 has not yet been reconstituted.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  significance: >-
    The SQT-3 and DPY-17 consensus furin cleavage-site mutants phenocopy
    `bli-4` loss, but the 2023 imaging study could not directly assay BLI-4
    cleavage in vivo, leaving open which collagens are direct substrates and
    which are secondarily retained.
  resolution: >-
    Reconstitute the BLI-4 catalytic domain or native isoforms with
    wild-type and cleavage-site mutant SQT-3 and DPY-17 peptides or
    procollagen fragments, and pair it with stage-specific substrate
    N-terminomics after acute `bli-4` depletion.
  provenance:
  - reference_id: PMID:37721936
    supporting_text: >-
      These data strongly support the model that BLI-4 directly cleaves both
      SQT-3 and DPY-17 collagens to promote their secretion.
suggested_questions:
- question: >-
    Which BLI-4 isoforms process SQT-3, DPY-17 and other collagen substrates
    at each embryonic and larval cuticle-building stage?
- question: >-
    Does BLI-4 cleave cuticle collagens in the Golgi/TGN, at the apical plasma
    membrane, or after release into the extraembryonic space?
- question: >-
    Does BLI-4 process any insulin-like peptides outside the adult ASEL
    high-salt circuit, or is neuromuscular-junction INS-6 maturation fully
    EGL-3-dependent?
suggested_experiments:
- description: >-
    Reconstitute BLI-4 cleavage of wild-type and CFCS-mutant SQT-3 and DPY-17
    substrates in vitro, then identify the generated N termini by targeted mass
    spectrometry.
- description: >-
    Combine acute, epidermis-specific `bli-4` degron depletion with
    stage-resolved cuticle-collagen secretome and N-terminome profiling to map
    direct BLI-4 substrates in vivo.
- description: >-
    Colocalize CRISPR-tagged BLI-4 isoforms with Golgi, TGN, endosomal,
    apical-membrane and extraembryonic markers while imaging tagged SQT-3 and
    DPY-17 trafficking through the first cuticle-secretion window.
