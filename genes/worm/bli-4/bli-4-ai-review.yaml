  label: Caenorhabditis elegans
description: >-
  BLI-4/KPC-4 is a Caenorhabditis elegans furin/Kex2-like subtilisin proprotein
  convertase required for collagenous cuticle formation. Its alternatively
  spliced isoforms share an N-terminal signal peptide, prodomain, subtilisin
  peptidase domain and P domain but differ in C-terminal regulatory domains
  and membrane anchors. In external epithelia, BLI-4 promotes N-terminal
  proteolytic processing of cuticle collagens such as SQT-3 and DPY-17 before
  efficient secretion and cuticle matrix assembly. Null alleles cause
  embryonic collapse after elongation, and isoform-specific alleles can arrest
  as dumpy larvae or produce blistered adult cuticles, consistent with
  essential and stage-specific processing of cuticle or epithelial substrates.
  In ASEL sensory neurons, BLI-4 has a separate non-essential role in
  processing insulin-like INS-6 neuropeptides that recruit AWCON to the adult
  high-salt chemotaxis circuit.
