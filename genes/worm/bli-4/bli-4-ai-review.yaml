  title: WormBase bli-4 gene description
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Hand-written WormBase gene description fetched through Alliance. Its
      claims that BLI-4 encodes multiple related Kex2/subtilisin-like serine
      endoproteases with shared N termini and distinct C termini are supported
      by PMID:7774813, and its summary of larval viability and adult cuticle
      adhesion is supported by PMID:7774813, PMID:10903434 and PMID:37721936.
- id: file:worm/bli-4/bli-4-uniprot.txt
  title: UniProtKB record for C. elegans BLI-4/KPC-4
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Reviewed sequence record supporting the BLI-4 signal peptide,
      membrane-associated topology, peptidase S8 and P/Homo B domains, active
      site residues, and isoform inventory. Its functional summary is
      consistent with the 1995, 2000, 2013 and 2023 primary literature.
- id: PMID:7774813
  title: >-
    The bli-4 locus of Caenorhabditis elegans encodes structurally distinct
    kex2/subtilisin-like endoproteases essential for early development and
    adult morphology.
  findings:
  - statement: >-
      bli-4 encodes Kex2/subtilisin-like proprotein convertases, and exons
      shared by the alternative isoforms are required for late embryogenesis
      while the viable e937 allele disrupts blisterase A and causes adult
      cuticle blistering.
    supporting_text: >-
      These findings suggest that blisterase A is required for the normal
      function of the adult cuticle.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Abstract-only primary cloning and allele paper. The abstract supports
      the Kex2/subtilisin-like identity of BLI-4, the shared-N/different-C
      isoform architecture, essential functions of the shared exons, and the
      adult cuticle requirement for the blisterase A isoform. It does not
      locally verify the old WormBase nuclear-localization row.
- id: PMID:10903434
  title: >-
    Mutational analysis of bli-4/kpc-4 reveals critical residues required for
    proprotein convertase function in C. elegans.
  findings:
  - statement: >-
      Lethal bli-4 mutations cluster in shared exons, including conserved
      residues of the subtilisin/Kex2 catalytic domain, and the h384 molecular
      null changes the catalytic Ser-415 to phenylalanine.
    supporting_text: >-
      h384 represents a molecular null mutant in which the catalytically
      essential serine residue (Ser415) is replaced by phenylalanine.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Abstract-only primary mutational study that directly supports the
      essential serine-type endoprotease activity of BLI-4 and the requirement
      for convertase activity during cuticle production.
- id: PMID:19716386
  title: >-
    The kunitz domain protein BLI-5 plays a functionally conserved role in
    cuticle formation in a diverse range of nematodes.
  findings:
  - statement: >-
      C. elegans BLI-5 participates in cuticle collagen biosynthesis through
      interaction with subtilisin-like processing enzymes such as BLI-4.
    supporting_text: >-
      Blister-5 (BLI-5) represents a protein with a kunitz-type serine
      protease interacting domain and is involved in cuticle collagen
      biosynthesis in C. elegans, through its interaction with
      subtilisin-like processing enzymes (such as BLI-4).
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Abstract-only parasite-comparator paper focused on BLI-5 rather than
      BLI-4. It is useful background for conservation of the nematode cuticle
      protease network, but it is not primary evidence for a specific BLI-4
      molecular activity.
- id: PMID:23665919
  title: >-
    Attenuation of insulin signalling contributes to FSN-1-mediated regulation
    of synapse development.
  findings:
  - statement: >-
      The accessible abstract attributes neuronal processing of INS-4 and
      INS-6 for FSN-1-mediated neuromuscular-junction development to EGL-3,
      not to BLI-4.
    supporting_text: >-
      reducing the activity of EGL-3, a prohormone convertase that processes
      agonistic insulin/IGF ligands INS-4 and INS-6, in neurons
    reference_section_type: ABSTRACT
  reference_review:
    relevance: LOW
    correctness: UNVERIFIED
    review_notes: >-
      Abstract-only paper that appears to support EGL-3 rather than BLI-4 in
      insulin-like peptide processing for neuromuscular-junction synaptic
      development. Full text is needed to determine whether the UniProt BLI-4
      IGI row rests on a hidden BLI-4 assay or on an overextension from EGL-3.
- id: PMID:24013594
  title: >-
    Neuropeptide signaling remodels chemosensory circuit composition in
    Caenorhabditis elegans.
  findings:
  - statement: >-
      BLI-4 acts in ASEL sensory neurons to mature insulin-like INS-6
      neuropeptides that recruit AWCON into the adult high-salt circuit and
      potentiate behavioral attraction to high salt.
    supporting_text: >-
      Together, these results suggest a novel role for BLI-4 cleavage in the
      production of a mature insulin-like peptide, INS-6, which recruits
      AWCON neurons to the high salt neural circuit and specifically
      potentiates attraction to high salt.
    reference_section_type: DISCUSSION
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full-text primary paper defining a real, non-core ASEL neuronal function
      for BLI-4 in adult high-salt chemotaxis. The evidence supports BLI-4
      proteolytic processing upstream of INS-6/DAF-2/AGE-1 signaling, cellular
      responses to salt, salt chemotaxis behavior, and peptide hormone
      processing.
- id: PMID:37721936
  title: >-
    The proprotein convertase BLI-4 promotes collagen secretion prior to
    assembly of the Caenorhabditis elegans cuticle.
  findings:
  - statement: >-
      An endogenous functional BLI-4::SfGFP reporter localizes to sub-apical
      epithelial puncta and faintly to the extraembryonic space during cuticle
      assembly.
    supporting_text: >-
      A functional BLI-4::SfGFP(int) fusion protein, tagged at the protease
      domain and expressed from the endogenous locus, marked sub-apical
      intracellular compartments of external epithelia
    reference_section_type: RESULTS
  - statement: >-
      BLI-4 promotes SQT-3 and DPY-17 secretion, and mutation of their
      consensus furin cleavage sites phenocopies bli-4 loss.
    supporting_text: >-
      CFCS mutations mimicked loss of bli-4, causing intracellular retention
      of the mutant proteins
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full-text primary paper that localizes endogenous BLI-4, generates null
      and isoform-specific alleles, shows that BLI-4 promotes early secretion
      of the cuticle collagens SQT-3 and DPY-17, and demonstrates that SQT-3
      and DPY-17 consensus furin cleavage-site mutants mimic BLI-4 loss.
