core_functions:
- description: GEI-8 is the C. elegans NCoR/SMRT nuclear receptor corepressor. Its C-terminal receptor
    interaction region binds nuclear receptors such as NHR-60, and by homology its N-terminal SANT domains
    recruit and activate histone deacetylase, so that it regulates RNA polymerase II transcription of
    genes needed for development, gonadogenesis, neuromuscular function and muscle mitochondrial metabolism.
    Corepressor activity is inferred from orthology and receptor binding and has not been shown directly
    in the worm.
