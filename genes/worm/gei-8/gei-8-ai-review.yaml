suggested_questions:
- question: Does GEI-8 bind and activate the worm HDAC3 orthologue (hda-2 or hda-3) through its SANT1
    domain, as NCoR/SMRT do with HDAC3?
- question: Which C. elegans nuclear receptors besides NHR-60 recruit GEI-8, and does binding depend on
    the absence of ligand?
- question: Are the genes upregulated in gei-8 mutants (e.g. Y9C9A.16) direct targets that GEI-8 occupies
    and represses, or are they indirect consequences of developmental arrest?
suggested_experiments:
- description: Co-immunoprecipitation or in vitro binding of GEI-8 SANT1/DAD with HDA-2/HDA-3, and
    histone deacetylase activity assays of the complex, including a point mutant of the conserved DAD
    lysine.
- description: Endogenous GFP knock-in of gei-8 to establish nuclear localization of the protein, followed
    by ChIP-seq or CUT&RUN to identify direct target loci and compare them with genes deregulated in
    gei-8(ok1671).
- description: Gal4-DBD tethering of GEI-8 fragments in worm tissues to test directly for transcriptional
    repression activity.
