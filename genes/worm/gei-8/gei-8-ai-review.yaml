  label: Caenorhabditis elegans
description: >-
  gei-8 encodes the single Caenorhabditis elegans orthologue of the vertebrate nuclear receptor
  corepressors NCoR (NCOR1) and SMRT (NCOR2). The 1778-residue protein has two N-terminal SANT/Myb-like
  domains, corresponding to the HDAC3-activating deacetylase activation domain and the histone-binding
  SANT2 domain of NCoR/SMRT, a long disordered central region, and a C-terminal region with predicted
  nuclear receptor interaction motifs. The C-terminal region binds the HNF4-related nuclear receptor
  NHR-60 in vitro, and GEI-8 was first found as a yeast two-hybrid partner of GEX-3. gei-8 is expressed
  through development in neurons, muscles and intestine. Loss of gei-8 causes slow growth and movement,
  arrested gonadogenesis with sterility, defective cholinergic neurotransmission and genome-wide
  deregulation of gene expression, and muscle-specific knockdown increases muscle mitochondrial content
  and respiration. By homology GEI-8 is thought to act in the nucleus as a transcriptional corepressor
  that couples nuclear receptors to histone deacetylase complexes, although repression and HDAC
  partnership have not been directly shown in the worm.
