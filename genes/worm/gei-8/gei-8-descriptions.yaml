taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Mediates transcriptional repression by certain nuclear receptors. Plays a
    role in development and neuronal function. May play a role in muscle-specific
    oxidative mitochondrial metabolism.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P34333
  source_id: P34333
- source: Alliance_Imported
  text: gei-8 encodes a novel protein highly similar to C. briggsae BP:CBP04038 that
    contains a glutamine/asparagine (Q/N)-rich ('prion') domain (by the algorithm
    of Michelitsch and Weissman) and two myb-like DNA-binding domains; interacts with
    GEX-3 in yeast two-hybrid assays.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00001565;class=Gene
  source_id: WB:WBGene00001565
- source: Alliance_Automated
  text: Predicted to be involved in regulation of transcription by RNA polymerase
    II. Predicted to be located in nucleus. Predicted to be part of protein-containing
    complex. Predicted to be active in chromatin. Is expressed in several structures,
    including anal depressor muscle; egg-laying apparatus; germ line; somatic nervous
    system; and tail ganglion. Human ortholog(s) of this gene implicated in osteoarthritis.
    Orthologous to several human genes including NCOR1 (nuclear receptor corepressor
    1).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00001565;class=Gene
  source_id: WB:WBGene00001565
