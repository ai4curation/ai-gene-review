- source: Alliance_Automated
  text: Predicted to be involved in regulation of transcription by RNA polymerase
    II. Predicted to be located in nucleus. Predicted to be part of protein-containing
    complex. Predicted to be active in chromatin. Is expressed in several structures,
    including anal depressor muscle; egg-laying apparatus; germ line; somatic nervous
    system; and tail ganglion. Human ortholog(s) of this gene implicated in osteoarthritis.
    Orthologous to several human genes including NCOR1 (nuclear receptor corepressor
    1).
