gene_symbol: unc-57
organism: worm
uniprot_id: B1V8A0
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Involved in synaptic vesicle (SV) recycling in neurons probably by regulating
    clathrin-mediated endocytosis (PubMed:14622579, PubMed:21029864). By controlling
    SV endocytosis, regulates the rate of excitatory postsynaptic currents (EPSCs)
    at neuromuscular junctions and thus locomotion (PubMed:21029864). In a similar
    manner, involved in necrotic neuronal cell death induced by abnormal hyperactivation
    of ion channels (PubMed:22157748). Plays a minor role in responses to mechanical
    stimuli (PubMed:17928447). Plays a minor role in unc- 26/synaptojanin localization
    to synapses (PubMed:14622579).
  source_type: curated
  url: https://www.uniprot.org/uniprot/B1V8A0
  source_id: B1V8A0
- source: Alliance_Imported
  text: unc-57 encodes an ortholog of endophilin A that is required for synaptic vesicle
    endocytosis; UNC-57 is expressed in all neurons, at synapses and neuromuscular
    junctions, and (weakly) in the spermetheca; like other endophilins, UNC-57 has
    a large BAR domain, an N-terminal coiled-coil domain within the BAR domain, and
    a C-terminal SH3 domain; UNC-57 protein is necessary for proper localization of
    UNC-26 (synaptojanin) protein, which in turn is needed for endocytosis; unc-57
    and unc-26 mutants are morphologically, ultrastructurally, and electrophysiologically
    similar both to one another and to double mutants, indicating that UNC-57 and
    UNC-26 act in a single genetic pathway.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00006791;class=Gene
  source_id: WB:WBGene00006791
- source: Alliance_Automated
  text: Predicted to enable protein-macromolecule adaptor activity. Involved in clathrin-dependent
    endocytosis and necroptotic process. Located in neuromuscular junction. Is expressed
    in several structures, including coelomocyte; hermaphrodite gonad; intestine;
    muscle cell; and nervous system. Human ortholog(s) of this gene implicated in
    acute myeloid leukemia and high grade glioma. Orthologous to several human genes
    including SH3GL3 (SH3 domain containing GRB2 like 3, endophilin A3).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00006791;class=Gene
  source_id: WB:WBGene00006791
