  - term:
      id: GO:0048488
      label: synaptic vesicle endocytosis
    evidence_type: IMP
    original_reference_id: PMID:21029864
    review:
      summary: unc-57 mutants show defective synaptic vesicle recycling (depleted vesicles, reduced EPSC
        rate, synaptopHluorin retrieval defect) that is rescued by membrane-anchored UNC-57 or by endophilin-A
        BAR domains competent for membrane bending. The N-BAR domain bends the plasma membrane at the
        endocytic zone before scission, i.e. UNC-57 performs part of the work of synaptic vesicle endocytosis.
        Later optogenetic/EM work shows UNC-57 is also required for regenerating synaptic vesicles from
        the endosomes/large vesicles formed by ultrafast or bulk endocytosis.
      action: NEW
      reason: 'Participation test: endophilin supplies the membrane-curvature step, not merely a requirement.
        Comparator test: endophilin-A orthologs in human (SH3GL2), mouse and Drosophila carry synaptic
        vesicle endocytosis; the worm GOA has only the parent endocytosis IBA and a clathrin-dependent
        endocytosis IMP from a necrosis study, so this specific, well-supported process was never captured
        from the primary unc-57 papers.'
      additional_reference_ids:
        - PMID:14622579
      supported_by:
        - reference_id: PMID:14622579
          supporting_text: We demonstrate that endophilin is required in C. elegans for synaptic vesicle
            recycling.
        - reference_id: PMID:21029864
          supporting_text: First, Endophilin promotes SV endocytosis by acting as a membrane-bending molecule,
            not as a molecular scaffold.
        - reference_id: PMID:21029864
          supporting_text: Second, Endophilin functions on the plasma membrane, promoting an early step
            in endocytosis (prior to scission of endocytic vesicles).
        - reference_id: PMID:29962934
          supporting_text: At the same time, the breakdown of these LVs into new SVs was strongly attenuated
            in both unc-26 and unc-57 mutants, arguing that the two proteins act at the step of SV formation
            from the endosome.
        - reference_id: PMID:29962934
          supporting_text: Just as unc-57 mutants, unc-57; erp-1 double mutants had extremely reduced
