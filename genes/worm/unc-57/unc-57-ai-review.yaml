gene_symbol: unc-57
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: UNC-57 is the single Caenorhabditis elegans endophilin-A, an N-BAR/SH3 protein of presynaptic
  terminals. Its N-terminal amphipathic helix and crescent-shaped BAR-domain dimer bind and bend the presynaptic
  plasma membrane, and this membrane-bending activity, acting before scission, is what drives the retrieval
  of synaptic vesicle membrane after exocytosis; unc-57 mutants are depleted of synaptic vesicles, retrieve
  synaptobrevin poorly and show reduced rates of evoked release at neuromuscular junctions. Its C-terminal
  SH3 domain binds the proline-rich domains of dynamin (DYN-1) and synaptojanin (UNC-26) and is required
  to localize and stabilize synaptojanin at synapses, although it is dispensable for endocytosis itself.
  UNC-57 is not essential for the ultrafast/bulk membrane retrieval step itself but is required, with
  synaptojanin, to convert the resulting endosomes into new synaptic vesicles. Most UNC-57 at synapses
  rides on the synaptic vesicle pool and is released to endocytic zones by exocytosis, coupling vesicle
  retrieval to release. UNC-57 is expressed in neurons and the posterior intestine; its endocytic activity
  also contributes, non-specifically, to the execution of necrotic neurodegeneration.
