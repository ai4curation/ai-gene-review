core_functions:
  - description: 'N-BAR membrane-bending activity: the UNC-57 dimer binds the presynaptic plasma membrane
      through its amphipathic helices and BAR domain and imposes positive curvature on the invaginating
      membrane before dynamin-mediated scission, driving synaptic vesicle endocytosis at the presynaptic
      endocytic zone. After ultrafast/bulk retrieval, the same activity is required to bud new synaptic
      vesicles from synaptic endosomes.'
