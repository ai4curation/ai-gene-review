suggested_questions:
  - question: Which endocytic proteins bud new synaptic vesicles from the endosomes formed by ultrafast
      endocytosis, and does UNC-57 membrane bending act there together with clathrin/CHC-1 or independently
      of it?
  - question: Is the recruitment of DYN-1 dynamin to endocytic zones dependent on the UNC-57 SH3 domain
      in vivo, as it is for UNC-26 synaptojanin?
suggested_experiments:
  - description: Flash-and-freeze electron microscopy of unc-57 null and BAR-domain point mutants to determine
      which retrieval step (plasma membrane invagination versus endosomal budding) requires endophilin.
    hypothesis: Endophilin membrane bending is required for pit formation at the plasma membrane rather
      than for endosomal vesicle regeneration.
