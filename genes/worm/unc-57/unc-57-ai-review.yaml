  - id: PMID:14622579
    title: Endophilin is required for synaptic vesicle endocytosis by localizing synaptojanin.
    findings:
      - statement: unc-57 encodes the C. elegans endophilin A ortholog and is required for synaptic vesicle
          recycling.
        supporting_text: In this study, we demonstrate that the unc-57 gene encodes the Caenorhabditis
          elegans ortholog of endophilin A.
      - statement: Endophilin is required for synaptic vesicle recycling in vivo.
        supporting_text: We demonstrate that endophilin is required in C. elegans for synaptic vesicle
          recycling.
      - statement: Endophilin and synaptojanin act in the same pathway; endophilin stabilizes synaptojanin
          at synapses.
        supporting_text: The electrophysiological phenotype of endophilin and synaptojanin double mutants
          are virtually identical to the single mutants, demonstrating that endophilin and synaptojanin
          function in the same pathway.
