descriptions:
- source: UniProt
  text: Component of the IFT complex A (IFT-A), a complex required for retrograde
    ciliary transport (PubMed:27515926, PubMed:28479320). In particular, may act redundantly
    with the intraflagellar transport protein ift-43 to regulate the transport of
    specific ciliary cargo proteins such as che-3 which are related to motility (PubMed:28479320).
    Functions in cilia biogenesis (PubMed:27515926).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q20255
  source_id: Q20255
- source: Alliance_Automated
  text: Predicted to be involved in intraciliary retrograde transport and protein
    localization to cilium. Predicted to be located in cilium. Predicted to be part
    of intraciliary transport particle A. Is expressed in neurons. Used to study nephronophthisis.
    Human ortholog(s) of this gene implicated in asphyxiating thoracic dystrophy 4;
    nephronophthisis 12; and spermatogenic failure 37. Orthologous to human TTC21A
    (tetratricopeptide repeat domain 21A) and TTC21B (tetratricopeptide repeat domain
    21B).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00022696;class=Gene
  source_id: WB:WBGene00022696
