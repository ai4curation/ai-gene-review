descriptions:
- source: UniProt
  text: Component of the IFT complex A (IFT-A), a complex required for retrograde
    ciliary transport (PubMed:27515926, PubMed:28479320). In particular, may act redundantly
    with the intraflagellar transport protein ift-43 to regulate the transport of
    specific ciliary cargo proteins such as che-3 which are related to motility (PubMed:28479320).
    Functions in cilia biogenesis (PubMed:27515926).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q20255
