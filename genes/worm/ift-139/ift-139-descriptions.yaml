    overall_notes: Correct on IFT-A and retrograde transport, redundancy with ift-43.
      Calls the dynein-2 heavy chain che-3 a 'cargo related to motility', which misdescribes
      it.
- source: Alliance_Automated
  text: Predicted to be involved in intraciliary retrograde transport and protein
    localization to cilium. Predicted to be located in cilium. Predicted to be part
    of intraciliary transport particle A. Is expressed in neurons. Used to study nephronophthisis.
    Human ortholog(s) of this gene implicated in asphyxiating thoracic dystrophy 4;
    nephronophthisis 12; and spermatogenic failure 37. Orthologous to human TTC21A
    (tetratricopeptide repeat domain 21A) and TTC21B (tetratricopeptide repeat domain
    21B).
