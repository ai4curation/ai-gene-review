knowledge_gaps:
- gap_statement: >-
    How IFT-139 contributes to dynein-2 engagement is unknown. It acts
    redundantly with IFT-43 to promote dynein-2 motility, but which IFT-A
    interface it supplies, and whether it contacts dynein-2 directly, has not
    been shown in the worm.
  boundary: >-
    Established: IFT-A membership, retrograde IFT role, and redundancy with
    IFT-43 for dynein-2 motility. Unknown: the direct binding partners of
    IFT-139 within IFT-A and on dynein-2, and why loss of IFT-139 alone is
    stronger than loss of IFT-43 alone.
  gap_kind:
  - BIOLOGY
  status: OPEN
  significance: >-
    Would explain how the peripheral IFT-A subunits (IFT-A2 lobe) help license
    retrograde transport and why TTC21B ciliopathy alleles are pathogenic.
  resolution: >-
    Structure-guided separation-of-function alleles of ift-139 in ift-43 and
    wild-type backgrounds, with single-molecule dynein-2 imaging.
  provenance:
  - reference_id: PMID:28479320
    supporting_text: our affinity purification and genetic analyses show that IFT-A
      subunits IFT-139 and IFT-43 function redundantly to promote dynein-2 motility
    reference_section_type: ABSTRACT
suggested_questions:
- question: >-
    Does IFT-139 bind dynein-2 directly, or does it promote dynein-2 motility only
    by stabilizing the IFT-A2 lobe (with IFT-43 and IFTA-1)?
suggested_experiments:
- description: >-
    In ift-139 single and ift-139; ift-43 double mutants, image endogenously
    tagged dynein-2 (CHE-3) and IFT-A subunits at single-molecule resolution to
    measure train coupling at the tip and the frequency of retrograde starts.
  hypothesis: >-
    IFT-139 is needed for dynein-2 to couple to trains at the ciliary tip, and
    IFT-43 partly compensates for its loss.
