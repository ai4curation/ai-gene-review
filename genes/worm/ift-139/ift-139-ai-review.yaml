gene_symbol: ift-139
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: >-
  IFT-139 is the Caenorhabditis elegans ortholog of human TTC21B (IFT139), a
  subunit of intraflagellar transport complex A (IFT-A). It is a large (1324 aa)
  tetratricopeptide-repeat (TPR)/armadillo-like alpha-solenoid protein with no
  catalytic domain. ift-139 is expressed only in ciliated sensory neurons, and
  GFP-tagged IFT-139 concentrates at the ciliary base, is present at lower levels
  in dendrites, and moves bidirectionally along the axoneme at IFT rates. Genetic
  analysis places IFT-139 in IFT-A and in retrograde (tip-to-base) intraflagellar
  transport: ift-139 deletion mutants have short, irregular cilia that phenocopy
  dynein-2 (che-3) and ifta-1 mutants rather than kinesin-II mutants, and are
  defective in dye filling, dauer formation and male mating. IFT-139 acts
  partially redundantly with the small IFT-A subunit IFT-43 to promote dynein-2
  motility, and with IFT-43 and IFTA-1 it is needed to remove periciliary
  membrane proteins from the cilium (transition-zone gating). A ciliopathy
  missense mutation modelled in the worm protein disrupts its function;
  human TTC21B mutations cause nephronophthisis and short-rib thoracic dysplasia.
