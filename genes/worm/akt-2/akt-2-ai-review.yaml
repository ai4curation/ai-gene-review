core_functions:
- description: AKT-2 is a PIP3-dependent AGC serine/threonine kinase that, with AKT-1 and
    SGK-1, phosphorylates DAF-16/FOXO and SKN-1 downstream of DAF-2, AGE-1 and PDK-1, preventing
    their nuclear accumulation and thus transducing insulin/IGF-1-like signals that inhibit
    dauer arrest and modulate stress resistance and lifespan.
  molecular_function:
    id: GO:0004674
    label: protein serine/threonine kinase activity
  directly_involved_in:
  - id: GO:0008286
    label: insulin receptor signaling pathway
  in_complex:
    id: GO:1902911
    label: protein kinase complex
  supported_by:
  - reference_id: PMID:15068796
    supporting_text: All three kinases of this complex are able to directly phosphorylate
      DAF-16/FKHRL1
  - reference_id: PMID:18358814
    supporting_text: The IIS kinases AKT-1, -2, and SGK-1 phosphorylate SKN-1
  - reference_id: PMID:9716402
    supporting_text: AKT-1 and AKT-2 function primarily to antagonize DAF-16
- description: The AKT-2 PH domain binds PIP3, coupling the kinase to AGE-1 PI3K output; this
    binding is antagonized by caspase-cleaved CNT-1 during apoptosis.
  molecular_function:
    id: GO:0005547
    label: phosphatidylinositol-3,4,5-trisphosphate binding
  directly_involved_in:
  - id: GO:0008286
    label: insulin receptor signaling pathway
  supported_by:
