id: Q9XTG7
gene_symbol: akt-2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: 'AKT-2 is one of two C. elegans orthologs of the AGC-family serine/threonine
  kinase Akt/PKB. It has an N-terminal pleckstrin homology (PH) domain that binds phosphatidylinositol-3,4,5-trisphosphate
  (PIP3), a central kinase domain and an AGC-kinase C-terminal region. In the DAF-2 insulin/IGF-1-like
  receptor pathway, PIP3 generated by the AGE-1 PI3K recruits AKT-2, which is activated by
  PDK-1 and acts in a complex with AKT-1 and SGK-1. These kinases directly phosphorylate the
  FOXO transcription factor DAF-16 (and SKN-1/Nrf), retaining them in the cytoplasm and antagonizing
  their transcriptional programs. AKT-2 acts largely redundantly with AKT-1: the akt-1; akt-2
  double loss-of-function causes daf-16-dependent constitutive dauer arrest, while single
  mutants have mild phenotypes. Together with AKT-1 and SGK-1 it also promotes embryonic cell
  survival, and contributes to lifespan and pathogen-resistance regulation. AKT-2 is expressed
  in neurons, pharyngeal muscle, rectal gland cells and spermatheca.'
