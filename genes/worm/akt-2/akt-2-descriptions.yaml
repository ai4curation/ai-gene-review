descriptions:
- source: UniProt
  text: Acts downstream of PI3 kinase age-1 and kinase pdk-1 in the daf-2/insulin
    receptor-like transduction pathway (PubMed:10364160, PubMed:11381260, PubMed:11747825,
    PubMed:15068796, PubMed:18782349, PubMed:22916022, PubMed:9716402). Essential
    role in regulating developmental arrest at the dauer stage (PubMed:10364160).
    Phosphorylates Forkhead-related daf-16 and the longevity-promoting skn- 1 transcription
    factors, which inhibits their entry into the nucleus and antagonizes their functions
    (PubMed:11381260, PubMed:11747825, PubMed:15068796, PubMed:18358814). Role in
    immune function and pathogen resistance (PubMed:18782349). Downstream of age-1
    and together with akt-1 and sgk-1, promotes cell survival during embryonic development
    (PubMed:25383666). Plays a role in maintaining the gonadal basement membrane through
    antagonizing akt-1 activity (PubMed:22916022).
