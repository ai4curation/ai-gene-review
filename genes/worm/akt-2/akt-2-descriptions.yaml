      akt-2.'
- source: Alliance_Automated
  text: Enables phosphatidylinositol-3,4,5-trisphosphate binding activity and protein
    serine/threonine kinase activity. Involved in several processes, including determination
    of adult lifespan; insulin receptor signaling pathway; and regulation of synaptic
    assembly at neuromuscular junction. Part of protein kinase complex. Is expressed
    in several structures, including excretory canal; neurons; pharynx; rectum; and
    vulva. Human ortholog(s) of this gene implicated in several diseases, including
    Cowden syndrome 6; Proteus syndrome; amphetamine abuse; disease of cellular proliferation
    (multiple); and glucose metabolism disease (multiple). Orthologous to human AKT1
    (AKT serine/threonine kinase 1); AKT2 (AKT serine/threonine kinase 2); and AKT3
    (AKT serine/threonine kinase 3).
