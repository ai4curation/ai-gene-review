- source: Alliance_Imported
  text: akt-2 encodes a homolog of the serine/threonine kinase Akt/PKB, AKT-2, that
    is required for progression through the dauer stage of development and for the
    negative regulation of adult lifespan; inactivation of akt-2 causes animals to
    arrest constitutively at the dauer stage, while having an increased life span;
    widely expressed, AKT-2 is activated by the phospholipid products of phosphoinositide
    3-kinase AGE-1/PI3K and by PDK-1, a homolog of vertebrate 3-phosphoinositide-dependent
    kinase-1 (PDK-1) Normal akt-2 (and akt-1) activity is required for excess pdk-1
    activity to suppress the dauer-arrest phenotype of age-1, indicating that the
    3-phosphoinositide-dependent kinase-1 homolog PDK-1 transduces signals from AGE-1
    to AKT-2 (and AKT-1); conversely, the akt-2 loss-of-function phenotype is suppressed
    by daf-16 null mutations, indicating that the Fork head transcription factor DAF-16
    is downstream of AKT-2 (and AKT-1), and that AKT-1 and AKT-2 act primarily to
    antagonize DAF-16.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00000103;class=Gene
  source_id: WB:WBGene00000103
  review:
