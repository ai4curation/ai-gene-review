gene_symbol: nlp-29
organism: worm
uniprot_id: O44664
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Antimicrobial peptides that have antibacterial activity against the Gram-negative
    bacteria S.marcescens. Has antifungal activity against D.coniospora (PubMed:15048112,
    PubMed:19380113). May play a role in response to physical injury and osmotic stress
    (PubMed:18394898, PubMed:19380113). Through the neuropeptide receptor nlp-29,
    induces sleep upon activation of the innate immune response to molting and injury
    to the adult epidermis (PubMed:33259791).
  source_type: curated
  url: https://www.uniprot.org/uniprot/O44664
  source_id: O44664
- source: Alliance_Imported
  text: nlp-29 encodes an antimicrobial, neuropeptide-like protein; nlp-29 appears
    to play a role in innate immunity, as its expression in the epidermis is strongly
    induced following fungal infection; nlp-29 expression is also induced following
    physical injury and osmotic stress; nlp-29 expression following fungal infection
    or physical wounding is regulated by a TIR-1, (Toll-interleukin 1 receptor (TIR)
    domain protein)/NSY-1/SEK-1/PMK-1 p38 MAPK signaling pathway and the ELT-3 GATA
    transcription factor; nlp-29 expression in the epidermis is also regulated by
    the SNF-12 sodium-dependent neurotransmitter symporter acting in concert with
    the STA-2 STAT transcription factor; the RAB-1 GTPase and the product of R53.4,
    a mitochondrial ATP synthase subunit f homolog, also appear to play a role in
    nlp-29 regulation; several reports indicate that nlp-29 is expressed exclusively
    in the hypodermis, while one report additionally reported expression in the intestine.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00003767;class=Gene
  source_id: WB:WBGene00003767
- source: Alliance_Automated
  text: Predicted to enable neuropeptide receptor binding activity. Involved in antifungal
    innate immune response. Is active in extracellular region. Is expressed in hyp7
    syncytium; hypodermis; and intestine.
