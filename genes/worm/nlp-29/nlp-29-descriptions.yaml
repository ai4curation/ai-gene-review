findings:
- category: discrepancy
  text: UniProt states sleep is induced 'through the neuropeptide receptor nlp-29';
    the review identifies the receptor as the neuronal GPCR NPR-12.
  sources:
  - UniProt
- category: gap
  text: WormBase mentions RAB-1 and the R53.4 ATP synthase subunit as nlp-29 regulators;
    the review's regulatory summary does not name them.
  sources:
  - Alliance_Imported
review:
