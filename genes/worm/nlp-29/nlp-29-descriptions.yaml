descriptions:
- source: UniProt
  text: Antimicrobial peptides that have antibacterial activity against the Gram-negative
    bacteria S.marcescens. Has antifungal activity against D.coniospora (PubMed:15048112,
    PubMed:19380113). May play a role in response to physical injury and osmotic stress
    (PubMed:18394898, PubMed:19380113). Through the neuropeptide receptor nlp-29,
    induces sleep upon activation of the innate immune response to molting and injury
    to the adult epidermis (PubMed:33259791).
  source_type: curated
  url: https://www.uniprot.org/uniprot/O44664
  source_id: O44664
  review:
    reviewer: AI
