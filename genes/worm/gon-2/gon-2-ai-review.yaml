  title: gon-2, a gene required for gonadogenesis in Caenorhabditis elegans.
  findings:
  - statement: gon-2 loss of function delays or blocks the postembryonic divisions of the gonadal precursors.
    supporting_text: in the onset and continuation of gonadal divisions
  full_text_unavailable: true
  reference_review:
