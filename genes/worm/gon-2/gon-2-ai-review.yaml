  review:
    summary: gon-2 mutants fail to initiate or continue the postembryonic mitotic divisions of the gonadal
      precursors Z1/Z4 (and Z2/Z3).
    action: KEEP_AS_NON_CORE
    reason: The phenotype is well supported, and the curator read the cloning paper (abstract-only in
      our cache). However GON-2 is a plasma-membrane cation channel, not a component of the cell-cycle
      machinery. The bypass of a gon-2 null by gain-of-function GEM-1 (an SLC16 transporter), and partial
      suppression by Mg2+ supplementation, indicate that GON-2 supports division by supplying cations
      (most likely Mg2+). This experimental row is kept, but as a non-core, likely indirect role.
    supported_by:
