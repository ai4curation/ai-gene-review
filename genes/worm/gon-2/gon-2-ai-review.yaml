core_functions:
- description: Ca2+-selective, Mg2+-permeable TRPM cation channel in the plasma membrane. In the intestinal
    epithelium it provides the major Ca2+ influx pathway (I-ORCa, probably with GTL-1) and contributes
    to divalent cation uptake; it is gated down by intracellular Mg2+ and PI(4,5)P2.
  molecular_function:
    id: GO:0005262
    label: calcium channel activity
  directly_involved_in:
  - id: GO:0070588
    label: calcium ion transmembrane transport
  - id: GO:1903830
    label: magnesium ion transmembrane transport
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:18299395
    supporting_text: GON-2, GTL-1, and the ORCa channels exhibit a >60-fold selectivity for Ca2+ over
      Na+
  - reference_id: PMID:18299395
    supporting_text: The ORCa, GON-2, and GTL-1 channels clearly have measurable Mg2+ permeabilities under
      bi-ionic conditions
  - reference_id: PMID:19923421
    supporting_text: GON-2/GTL-1 functions as the major intestinal cell Ca(2+) influx pathway
suggested_questions:
- question: Does GON-2 form functional homomeric channels in a heterologous system, and does it co-assemble
    with GTL-1 into the intestinal ORCa channel?
- question: Is the in vivo requirement of GON-2 for gonadal precursor divisions due to Mg2+ influx, Ca2+
    influx, or both? Is GON-2 itself expressed and active in Z1/Z4?
- question: Where is GON-2 protein localized in intestinal cells (apical vs basolateral membrane)? Only
    electrophysiological and model-based arguments exist.
suggested_experiments:
- description: Endogenous CRISPR GFP knock-in at gon-2 to determine tissue expression (intestine, gonadal
    precursors) and apical/basolateral membrane localization.
  hypothesis: GON-2 localizes to the apical plasma membrane of intestinal cells and to the plasma membrane
    of somatic gonadal precursors.
- description: Heterologous expression of GON-2 alone or with GTL-1 (e.g. HEK293 or Xenopus oocytes),
    with patch clamp to measure Ca2+/Mg2+ permeability and Mg2+/PIP2 inhibition, plus co-immunoprecipitation.
  hypothesis: GON-2 forms a Ca2+-selective, Mg2+-permeable channel on its own and co-assembles with GTL-1
    into a heteromer with ORCa properties.
- description: Genetically encoded Mg2+ and Ca2+ sensors expressed in Z1/Z4 of wild-type and gon-2 mutant
    L1 larvae.
  hypothesis: gon-2 loss lowers intracellular Mg2+ in gonadal precursors before their first division.
