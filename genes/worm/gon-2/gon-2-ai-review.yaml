id: Q93971
gene_symbol: gon-2
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: GON-2 is a TRPM-subfamily transient receptor potential cation channel of C. elegans, paralogous
  to GTL-1 and GTL-2 and related to vertebrate TRPM1/3/6/7. In intestinal epithelial cells it provides
  most of the outwardly rectifying, highly Ca2+-selective, Mg2+-permeable plasma-membrane current (I-ORCa),
  probably together with GTL-1. This current is inhibited by intracellular Mg2+ and by PI(4,5)P2 and is
  relieved by PLCgamma activity. Through this Ca2+ influx GON-2 supports the rhythmic IP3-dependent intestinal
  Ca2+ oscillations that time the defecation motor program. With GTL-1 it contributes to intestinal uptake
  of Mg2+ and other divalent cations (Ni2+), which underlies systemic Mg2+ homeostasis. GON-2 is also
  required, with maternal and zygotic contributions, for the postembryonic divisions of the gonadal precursor
  cells. This requirement can be bypassed by Mg2+ supplementation or by hyperactive GEM-1, which suggests
  the channel supplies cations needed for proliferation.
