  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only cache. Cloning paper; supports the TRPM identity and the requirement for
      gonadal precursor divisions.
- id: PMID:18299395
  title: Highly Ca2+-selective TRPM channels regulate IP3-dependent oscillatory Ca2+ signaling in the
    C. elegans intestine.
  findings:
  - statement: GON-2-dependent intestinal currents are highly Ca2+-selective.
    supporting_text: GON-2, GTL-1, and the ORCa channels exhibit a >60-fold selectivity for Ca2+ over
      Na+
  - statement: The channels are measurably Mg2+-permeable.
    supporting_text: The ORCa, GON-2, and GTL-1 channels clearly have measurable Mg2+ permeabilities under
      bi-ionic conditions
  - statement: gon-2 loss disrupts pBoc rhythm and intestinal Ca2+ oscillations.
    supporting_text: loss of gon-2 and/or gtl-1 activity dramatically disrupts pBoc rhythmicity and intestinal
      Ca2+ signaling
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text read. Key electrophysiology paper; supports calcium channel activity and the
      defecation IMP/IGI rows. The heteromer is proposed, not shown.
