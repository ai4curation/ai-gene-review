- id: PMID:20221407
  title: Magnesium excretion in C. elegans requires the activity of the GTL-2 TRPM channel.
  findings:
  - statement: GON-2/GTL-1 are proposed to mediate intestinal Mg2+ uptake.
    supporting_text: Mg2+ within the gut lumen is taken up by the intestinal cells through apically-localized
      channels composed of GTL-1 and/or GON-2 subunits
  - statement: Whether GON-2/GTL-1 carry significant Mg2+ in vivo has been questioned.
    supporting_text: they are not likely to mediate significant levels of Mg2+ uptake in vivo
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text read. Mainly about GTL-2 in the excretory cell; gtl-2 mutations suppress gon-2(q388)
      through Mg2+ build-up, which supports a Mg2+-supply model for the GON-2 gonadal requirement.
