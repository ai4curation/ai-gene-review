gene_symbol: gon-2
organism: worm
uniprot_id: Q93971
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Required for initiation and continuation of postembryonic mitotic cell divisions
    of gonadal cells Z1 and Z4. Zygotic expression is necessary for hermaphrodite
    fertility. May be a cation channel.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q93971
  source_id: Q93971
- source: Alliance_Imported
  text: gon-2 encodes a predicted transmembrane cation channel homologous to the long
    transient receptor potential channel (LTRPC) subfamily of TRP channels including
    Drosophila DLTRP and mammalian melastatin and LTRPC7; GON-2 regulates the onset
    and continuation of post-embryonic mitotic cell divisions in the somatic gonad
    precursor cells perhaps by mediating an increase in intracellular calcium in response
    to activating signals.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00001651;class=Gene
  source_id: WB:WBGene00001651
- source: Alliance_Automated
  text: Predicted to enable monoatomic cation channel activity. Involved in defecation;
    gonad development; and mitotic cell cycle. Predicted to be located in membrane.
    Predicted to be active in plasma membrane. Is expressed in excretory cell; gonad;
    intestine; pharynx; and rectal epithelium. Human ortholog(s) of this gene implicated
    in several diseases, including amyotrophic lateral sclerosis-parkinsonism/dementia
    complex 1; cataract; congenital stationary night blindness (multiple); familial
    hyperlipidemia; and metal metabolism disorder (multiple). Orthologous to several
    human genes including TRPM3 (transient receptor potential cation channel subfamily
    M member 3) and TRPM7 (transient receptor potential cation channel subfamily M
    member 7).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00001651;class=Gene
  source_id: WB:WBGene00001651
