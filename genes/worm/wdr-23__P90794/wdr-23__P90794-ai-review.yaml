gene_symbol: wdr-23
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: >-
  WDR-23 is the C. elegans ortholog of DCAF11/WDR23 (PANTHER PTHR19847:SF7), a WD40-repeat
  beta-propeller protein that acts as a substrate receptor of the CUL-4/DDB-1 cullin-RING
  ubiquitin ligase. Its WDxR (DxR-box) motifs dock on DDB-1 and are required for function in
  vivo, and it binds substrates through the propeller. Its best-characterized substrate is the
  cap'n'collar transcription factor SKN-1 (the Nrf ortholog): WDR-23 represses SKN-1 protein
  level, nuclear accumulation and target-gene activation, most likely by promoting its
  proteasomal turnover, and it also binds the Holliday junction resolvase GEN-1. Two isoforms
  differ in their N termini and location: WDR-23A (this canonical entry) is cytoplasmic and
  associated with the outer mitochondrial membrane, while WDR-23B (P90794-2) is nuclear and is
  the isoform that suppresses SKN-1-dependent stress resistance. Loss of wdr-23 constitutively
  activates SKN-1, producing SKN-1-dependent stress and xenobiotic resistance, extended
  lifespan, and reduced growth, fecundity and neuromuscular function.
