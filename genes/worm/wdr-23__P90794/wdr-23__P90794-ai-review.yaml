    supporting_text: SKN-1 protein levels, nuclear accumulation, and activity are repressed by
      the WD40 repeat protein WDR-23, which interacts with the CUL-4/DDB-1 ubiquitin ligase
  - reference_id: PMID:23555279
    supporting_text: However, expression of WDR-23(DxR) driven by the endogenous wdr-23
      promoter fragment failed to restore wild type aldicarb responsiveness to wdr-23 mutants
  - reference_id: PMID:31409866
    supporting_text: nuclear WDR-23B inhibits the activity of substrates, most likely by
      promoting protein turnover, while cytoplasmic WDR-23A performs a proteasome-independent
      role.
suggested_questions:
- question: Is SKN-1 polyubiquitinated by CRL4(WDR-23) in worms, and on which SKN-1 isoform
    (SKN-1A, B or C) and motif does WDR-23 act?
- question: What is the activity of mitochondria-associated WDR-23A, given that it appears to
    promote rather than repress SKN-1 target activation, and does it mono- or multi-mono-ubiquitinate substrates in vivo?
- question: Given that the two Choe-lab papers on direct WDR-23/SKN-1 binding and feedback
    regulation were retracted, has the direct physical interaction between WDR-23 and SKN-1
    been independently reproduced?
suggested_experiments:
- description: In vivo ubiquitination of endogenously tagged SKN-1 in wdr-23(tm1817) animals
    rescued with single-copy WDR-23A, WDR-23B or WDR-23(DxR), with proteasome inhibition, to
    test directly whether CRL4(WDR-23B) polyubiquitinates SKN-1.
  experiment_type: biochemistry
- description: Reconstitute CUL-4/DDB-1/WDR-23 with purified SKN-1 and GEN-1 in vitro and map
    ubiquitin linkages by mass spectrometry for each isoform.
  experiment_type: biochemistry
