core_functions:
- description: >-
    Substrate receptor (DCAF) of the CUL-4/DDB-1 cullin-RING ubiquitin ligase. WDxR motifs in
    the WD40 propeller dock on DDB-1 and are required in vivo; the propeller binds the
    transcription factor SKN-1 (and the resolvase GEN-1). The nuclear isoform WDR-23B limits
    SKN-1 abundance, nuclear accumulation and target-gene activation, most likely by
    promoting proteasomal turnover. Established in C. elegans by interaction, DxR mutant
    rescue and SKN-1 protein-level data; direct in vivo SKN-1 ubiquitination is inferred
    from the conserved human WDR23-NRF2 mechanism rather than shown in worm.
