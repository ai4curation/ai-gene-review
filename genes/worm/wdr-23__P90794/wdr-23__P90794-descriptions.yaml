- source: Alliance_Imported
  text: wdr-23 encodes a WD40 repeat-containing protein; WDR-23 functions as part
    of a CUL-4/DDB-1 ubiquitin ligase complex that negatively regulates accumulation
    and hence, transcriptional activation activity of the SKN-1 transcription factor
    in intestinal nuclei; wdr-23 activity is thus required for regulation of stress
    resistance, longevity, and normal growth and development; WDR-23 physically interacts
    with DDB-1 and SKN-1, thus likely serving as a bridge between the ubiquitin ligase
    complex and its SKN-1 substrate; in regulating skn-1 function, wdr-23 appears
    to act downstream of the p38 MAPK pathway and together with gsk-3 and the daf-2-mediated
    insulin signaling pathway; WDR-23 is expressed in the intestine, hypodermis, and
    neurons, where it localizes to nuclei.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00008419;class=Gene
  source_id: WB:WBGene00008419
