- source: UniProt
  text: Involved in regulation of lifespan (PubMed:17411345). Required for dopaminergic
    CEP neuron degeneration in response to Mn(2+) (PubMed:23721876). Inhibits the
    skn-1-mediated up-regulation of tatn-1 (PubMed:31043480).
