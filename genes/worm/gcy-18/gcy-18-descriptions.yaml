gene_symbol: gcy-18
organism: worm
uniprot_id: G5EFQ0
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Guanylate cyclase involved in the production of the second messenger cGMP
    (By similarity). Regulates thermotaxis responses in AFD sensory neurons. May regulate
    AFD neuronal activity such as calcium responses to temperature gradients (PubMed:16415369).
  source_type: curated
  url: https://www.uniprot.org/uniprot/G5EFQ0
  source_id: G5EFQ0
- source: Alliance_Imported
  text: gcy-18 encodes a receptor-type guanylyl cyclase that, along with gcy-8 and
    gcy-23, constitutes a subfamily of guanylyl cyclase genes in C. elegans; gcy-18
    functions redundantly with gcy-8 and gcy-23, and upstream of tax-4, to regulate
    thermotaxis via the AFD thermosensory neurons, although of the three guanylyl
    cyclases required, genetic analyses suggest that GCY-18 is the primary guanylyl
    cyclase required; in addition, microarray experiments indicate that gcy-18 expression
    is induced in daf-16(RNAi); daf-2(RNAi) double mutants and repressed in daf-2(RNAi)
    mutants, suggesting that GCY-18 activity may contribute to a shortened lifespan;
    consistent with this, loss of gcy-18 activity via RNAi does result in lifespan
    extension; GCY-18 is expressed exclusively in the AFD thermosensory neurons, where
    it localizes to sensory endings.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00001543;class=Gene
  source_id: WB:WBGene00001543
- source: Alliance_Automated
  text: Predicted to enable guanylate cyclase activity and peptide receptor activity.
    Involved in detection of temperature stimulus; thermosensory behavior; and thermotaxis.
    Located in microvillus membrane and neuron projection terminus. Is expressed in
    intestine and nervous system.
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00001543;class=Gene
  source_id: WB:WBGene00001543
