suggested_questions:
- question: Does EPG-1/ATG-13 directly stimulate UNC-51 kinase activity in vitro, as yeast Atg13 does
    for Atg1, and is this regulated by LET-363/TOR phosphorylation?
suggested_experiments:
- description: In vitro kinase assays with recombinant UNC-51 with or without EPG-1 and EPG-9, and EPG-1
    phosphosite mutants mimicking TOR phosphorylation.
