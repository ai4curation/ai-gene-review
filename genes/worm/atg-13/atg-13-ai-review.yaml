gene_symbol: atg-13
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: EPG-1/ATG-13 is the C. elegans ortholog of Atg13, a highly divergent 443-residue protein
  with limited sequence similarity to yeast Atg13. It binds the C-terminus of the UNC-51/Atg1 kinase and
  the ATG101 homolog EPG-9, forming the UNC-51 initiation complex. Under starvation it moves to punctate
  preautophagosomal structures, where it is recruited by direct binding to the Atg8 homolog LGG-1. EPG-1
  is needed for autophagosome formation, for autophagic removal of germ-cell P-granule components (such
  as SEPA-1) and other protein aggregates in somatic cells, and for survival during starvation. It is
  expressed from early embryogenesis onward, strongly in neurons and also in muscle.
