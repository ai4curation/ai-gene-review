gene_symbol: atg-13
organism: worm
uniprot_id: P34379
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Component of the unc-51/atg-13 complex required for autophagosome formation
    (PubMed:19377305, PubMed:26687600). Required for the degradation of germ cell
    specific P-granule components such as sepa-1 by autophagy in somatic cells (PubMed:19377305).
    This ensures exclusive localization of the P-granules in germ cells (PubMed:19377305).
    May function downstream of the let-363 (Tor) signaling pathway to mediate sepa-1
    degradation (PubMed:19377305). Plays a role in survival during limited food availability
    (PubMed:19377305).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P34379
  source_id: P34379
- source: Alliance_Imported
  text: atg-13 encodes a divergent ortholog of the autophagic budding yeast protein
    Atg13p, and a more obvious ortholog of uncharacterized but well-conserved metazoan
    proteins such as human KIAA0652; ATG-13 is expressed broadly in early (pre-100-cell
    stage) embryos, in larval and adult ventral nerve cord and other neurons, and
    in adult pharyngeal muscle.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00017045;class=Gene
  source_id: WB:WBGene00017045
- source: Alliance_Automated
  text: Predicted to enable protein kinase regulator activity. Predicted to be involved
    in mitophagy; piecemeal microautophagy of the nucleus; and protein localization
    to phagophore assembly site. Located in perikaryon and phagophore assembly site.
    Is expressed in body wall musculature; nerve ring; neurons; and pharyngeal muscle
    cell. Orthologous to human ATG13 (autophagy related 13).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00017045;class=Gene
  source_id: WB:WBGene00017045
- source: RefSeq
  text: Predicted to enable protein kinase regulator activity. Predicted to be involved
    in mitophagy; piecemeal microautophagy of the nucleus; and protein localization
    to phagophore assembly site. Predicted to be located in cytoplasm. Predicted to
    be part of Atg1/ULK1 kinase complex. Predicted to be active in autophagosome;
    cytosol; and phagophore assembly site. Is expressed in body wall musculature;
    nerve ring; neurons; and pharyngeal muscle cell. Orthologous to human ATG13 (autophagy
    related 13). [provided by Alliance of Genome Resources, Jun 2026]
