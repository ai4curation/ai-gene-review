gene_symbol: meg-2
organism: worm
uniprot_id: Q21127
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: P granule component, which acts redundantly with P granule component meg-1
    to promote P granule segregation during embryogenesis, and germ cell proliferation
    and differentiation in larval stages (PubMed:18202375, PubMed:21305687, PubMed:25535836).
    Together with phosphorylated meg-1, promotes the disassembly of zygotic P granules
    in the anterior cytoplasm of pre-gastrulation embryos (PubMed:25535836). Together
    with dephosphorylated meg-1, promotes the assembly and accumulation of zygotic
    P granules in the posterior cytoplasm of pre- gastrulation embryos (PubMed:25535836).
    Required for fertility (PubMed:18202375, PubMed:21305687).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q21127
  source_id: Q21127
- source: Alliance_Imported
  text: meg-2 encodes a novel protein that localizes exclusively to P granules; originally
    identified by microarray analyses of germline-enriched transcripts, loss of meg-2
    activity by itself results in no obvious abnormalities, but loss of meg-2 activity
    in meg-1 mutant animals indicates that meg-1 and meg-2 likely have redundant functions
    in germline development; meg-2 may also function redundantly with mes-1; meg-2
    expression in the proximal germline is positively regulated by MPK-1, the C. elegans
    MAP kinase ortholog; a GFP::MEG-2 fusion protein localizes exclusively to P granules
    in the embryonic germ cell lineage.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00010493;class=Gene
  source_id: WB:WBGene00010493
