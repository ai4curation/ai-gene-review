      score: 4
    overall_notes: 'Correct and cited: redundancy with MEG-1 and phosphorylation-dependent
      P granule disassembly and assembly. Predates the germline P-body model.'
- source: Alliance_Imported
  text: meg-2 encodes a novel protein that localizes exclusively to P granules; originally
    identified by microarray analyses of germline-enriched transcripts, loss of meg-2
    activity by itself results in no obvious abnormalities, but loss of meg-2 activity
    in meg-1 mutant animals indicates that meg-1 and meg-2 likely have redundant functions
    in germline development; meg-2 may also function redundantly with mes-1; meg-2
    expression in the proximal germline is positively regulated by MPK-1, the C. elegans
    MAP kinase ortholog; a GFP::MEG-2 fusion protein localizes exclusively to P granules
    in the embryonic germ cell lineage.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00010493;class=Gene
