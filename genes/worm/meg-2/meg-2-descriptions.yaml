descriptions:
- source: UniProt
  text: P granule component, which acts redundantly with P granule component meg-1
    to promote P granule segregation during embryogenesis, and germ cell proliferation
    and differentiation in larval stages (PubMed:18202375, PubMed:21305687, PubMed:25535836).
    Together with phosphorylated meg-1, promotes the disassembly of zygotic P granules
    in the anterior cytoplasm of pre-gastrulation embryos (PubMed:25535836). Together
    with dephosphorylated meg-1, promotes the assembly and accumulation of zygotic
    P granules in the posterior cytoplasm of pre- gastrulation embryos (PubMed:25535836).
    Required for fertility (PubMed:18202375, PubMed:21305687).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q21127
  source_id: Q21127
