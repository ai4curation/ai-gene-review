gene_symbol: snb-1
organism: worm
uniprot_id: O02495
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Involved in the targeting and/or fusion of transport vesicles to their target
    membrane. Acts in neuronal exocytosis of synaptic transmission. Likely to have
    a role in cholinergic transmisson. Required for viability, coordinated movement
    and M3 pharynx motor neuron function.
  source_type: curated
  url: https://www.uniprot.org/uniprot/O02495
  source_id: O02495
- source: Alliance_Imported
  text: The snb-1 gene encodes synaptobrevin, a synaptic vesicle protein orthologous
    to human vesicle-associated membrane protein 1 (VAMP1 OMIM:185880) and 2 (VAMP2
    OMIM:185881), and is required for viability and synaptic transmission; SNB-1 is
    likely to play a role in vesicle docking and/or fusion and is expressed in neurons
    where it colocalizes with synaptic vesicle proteins RAB-3 and synaptotagmin.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00004897;class=Gene
  source_id: WB:WBGene00004897
- source: Alliance_Automated
  text: Predicted to enable SNAP receptor activity and syntaxin binding activity.
    Involved in several processes, including chemical synaptic transmission; defecation;
    and regulation of hindgut contraction. Located in several cellular components,
    including axon; presynaptic active zone; and secretory vesicle. Is expressed in
    several structures, including epithelial cell; excretory gland cell; nervous system;
    pharynx; and reproductive system. Human ortholog(s) of this gene implicated in
    autistic disorder; congenital myasthenic syndrome; and spastic ataxia 1. Orthologous
    to several human genes including VAMP2 (vesicle associated membrane protein 2).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00004897;class=Gene
  source_id: WB:WBGene00004897
- source: RefSeq
