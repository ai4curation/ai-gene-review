id: O02495
gene_symbol: snb-1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: >-
  SNB-1 is the Caenorhabditis elegans synaptobrevin (VAMP1/2) orthologue, a small tail-anchored
  R-SNARE of synaptic vesicles. Its cytoplasmic coiled-coil helix zippers with the plasma-membrane
  Q-SNAREs UNC-64/syntaxin-1 and RIC-4/SNAP-25 to form the four-helix SNARE complex that drives
  fusion of synaptic vesicles with the presynaptic membrane, releasing acetylcholine, GABA and
  glutamate. Animals lacking snb-1 hatch but arrest as uncoordinated L1 larvae, while hypomorphs
  with lesions on the t-SNARE-binding face of the helix are lethargic, aldicarb-resistant, and
  have defective pharyngeal and enteric neurotransmission; a residual release in nulls suggests
  partial substitution by another R-SNARE. SNB-1 colocalises with RAB-3 and synaptotagmin on
  synaptic vesicles, is delivered to synapses by the UNC-104 kinesin, and after fusion forms a
  plasma-membrane reservoir (about 30% of the protein) that is retrieved by AP180/UNC-11-dependent
  endocytosis; SNB-1::GFP is the standard presynaptic marker in the worm. The protein is also
  expressed in the germline, where it resides mainly on the plasma membrane and on secretory
  granules of oocytes.
