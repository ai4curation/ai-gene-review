- id: file:worm/snb-1/snb-1-deep-research-falcon.md
  title: Deep research report for snb-1 (falcon / Edison Scientific Literature)
  findings:
  - statement: SNB-1 supplies the vesicular SNARE helix that links the vesicle to the target 
      membrane once Ca2+ and synaptotagmin permit zippering.
    supporting_text: calcium entry and synaptotagmin activation permit SNARE zippering; SNB-1 
      supplies the vesicular SNARE helix that links the vesicle physically to the target membrane.
  - statement: Residual release in snb-1 nulls may reflect another vesicular SNARE, maternal 
      protein, or SNB-1-independent spontaneous fusion.
    supporting_text: 'Residual movement in putative null animals is scientifically important: it indicates
      that removal of SNB-1 severely reduces but may not abolish every form of membrane fusion or transmitter
      release. Possible explanations include another vesicular SNARE, SNB-1-independent spontaneous fusion,
      maternal protein, or residual activity not detected by the genetic lesion.'
  reference_review:
