- id: PMID:9412487
  title: Synaptic transmission deficits in Caenorhabditis elegans synaptobrevin mutants.
  findings:
  - statement: snb-1 nulls die after hatching; hypomorphs have general synaptic transmission defects
      and aldicarb resistance.
    supporting_text: Mutants lacking snb-1 die just after completing embryogenesis.
  - statement: Hypomorphic lesions sit on the hydrophobic face of the helix that binds syntaxin and 
      SNAP-25.
    supporting_text: The molecular lesions in the hypomorphic alleles reside on the hydrophobic face
      of a proposed amphipathic-helical region implicated biochemically in interacting with the 
      t-SNAREs syntaxin and SNAP-25.
  - statement: SNB-1 is a synaptic vesicle protein colocalising with RAB-3 and synaptotagmin and 
      dependent on UNC-104 for transport.
    supporting_text: Previously characterized C. elegans synaptic vesicle proteins RAB-3 (Fig. 2 D )
      and synaptotagmin (data not shown) colocalized with synaptobrevin
  - statement: Cholinergic transmission is impaired presynaptically; postsynaptic responses are 
      intact.
    supporting_text: Thus, the assay indicates that postsynaptic responses are fundamentally intact,
      suggesting that cholinergic transmission is impaired presynaptically in snb-1 mutants.
  - statement: M3 glutamatergic transients are lost, pumping is depressed and defecation is 
      impaired; all interpreted as consequences of impaired synaptic transmission.
    supporting_text: These behavioral defects presumably all represent manifestations of the 
      underlying impairment of synaptic transmission.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached; primary genetic characterisation of snb-1.
