descriptions:
- source: Alliance_Imported
  text: mut-2 encodes a nucleotidyltransferase that is a member of the polymerase
    beta nucleotidyltransferase superfamily that includes poly(A) polymerases, 2-5
    oligoadenylate synthetases, C. elegans GLD-2, and S. cerevisiae Trf4p; MUT-2 activity
    is required for meiotic chromosome segregation, negative regulation of DNA transposition,
    non-transgene-induced RNAi (i.e. RNAi via feeding is affected, whereas RNAi via
    expression of sense and antisense RNA from a transgene is not), fertility, and
    viability; analysis of siRNA levels in mut-2 mutant animals indicates that during
    RNAi, MUT-2 activity is required at a point upstream of siRNA accumulation; neither
    the precise mechanistic role of MUT-2 in posttranscriptional silencing, nor the
    MUT-2 expression pattern, is yet known; although it is homologous to GLD-2, CID-1,
    and relatedpolynucleotide polymerases, MUT-2 neither promotes mRNA translation
    norexhibits poly(A) or poly(U) activity on mRNA substrates when tested inXenopus
    oocytes.
