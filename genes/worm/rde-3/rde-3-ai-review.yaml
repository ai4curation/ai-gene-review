id: O44768
gene_symbol: rde-3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: RDE-3 (also called MUT-2) is a C. elegans ribonucleotidyltransferase of the polymerase beta
  nucleotidyltransferase superfamily that acts as a poly(UG) polymerase. It adds long, non-templated,
  perfectly alternating uridine and guanosine tails (pUG tails) to the 3' ends of mRNA fragments targeted
  by RNA interference and to transposon RNAs. pUG tails with more than 16 perfectly alternating U and
  G nucleotides turn the attached RNA fragment into a template for RNA-directed RNA polymerases such as
  RRF-1, which synthesize secondary 22G siRNAs. Cycles of pUG RNA-templated siRNA synthesis and siRNA-directed
  pUGylation sustain dsRNA-triggered transgenerational silencing in the germline. RDE-3 localizes to perinuclear
  germline Mutator foci with RRF-1 and the RDE-8 endonuclease. It is required for siRNA accumulation,
  RNAi in all tissues, transposon silencing, and fertility and viability at high temperature. RDE-3 also
  pUGylates Orsay virus RNAs to support antiviral RNAi.
