  review:
    summary: PAINT IBA for polyuridylation-dependent mRNA catabolism, seeded by S. pombe Cid1/Cid16 and
      mammalian TUT4/TUT7.
    action: MARK_AS_OVER_ANNOTATED
    reason: In the donor enzymes, oligo(U) tails mark mRNAs for decay. RDE-3 instead adds pUG tails that
      convert mRNA fragments into templates for RdRP-driven siRNA synthesis and transgenerational silencing
      (PMID:32499657). The tailed RNA acts as a silencing intermediate, not a catabolic substrate. RDE-3-directed
      silencing does lower target mRNA levels, so the annotation is not entirely wrong, but it describes
      the ancestral TUTase function and not the diverged one in this lineage.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: PANTHER:PTN000263330
        source_label: PTN000263330
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Node seeded by Cid1-type and TUT4/7 uridylyltransferases whose oligo(U) tails trigger
          mRNA decay. RDE-3 is a diverged poly(UG) polymerase whose tails make silencing templates.
    supported_by:
    - *id003
    - reference_id: PMID:32499657
      supporting_text: pUG tails could either mark mRNA fragments for degradation or convert mRNA fragments
        into active mediators of gene silencing.
