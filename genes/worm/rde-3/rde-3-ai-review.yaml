core_functions:
- proposed_molecular_function: poly(UG) polymerase activity
  description: Poly(UG) polymerase. It adds non-templated alternating UG tails to 3' ends of RNAi-targeted
    mRNA fragments and transposon RNAs, which makes them templates for RdRP (RRF-1) synthesis of 22G siRNAs.
    No GO term exists for this activity; the nearest existing terms are RNA uridylyltransferase activity
    (GO:0050265, annotated by IBA) and its parent template-free RNA nucleotidyltransferase activity (GO:0098680).
  locations:
  - id: GO:1990633
    label: mutator focus
  directly_involved_in:
  - id: GO:0035194
    label: regulatory ncRNA-mediated post-transcriptional gene silencing
  supported_by:
  - *id004
  - *id002
  - *id003
proposed_new_terms:
- proposed_name: poly(UG) polymerase activity
  proposed_definition: Catalysis of the template-independent addition of alternating uridine and guanosine
    monophosphate residues to the 3' end of an RNA molecule, forming a poly(UG) tail.
  justification: RDE-3/MUT-2 adds perfectly alternating UG tails, which no existing child of template-free
    RNA nucleotidyltransferase activity describes. RNA uridylyltransferase activity covers only the U
    additions.
  proposed_parent:
    id: GO:0098680
    label: template-free RNA nucleotidyltransferase activity
  supported_by:
  - *id004
  - *id002
suggested_questions:
- question: Does RDE-3 have intrinsic UG alternation in vitro, or does the alternation depend on partner
    proteins or template-like secondary structure in the growing tail?
- question: Should GO create a poly(UG) polymerase activity term under template-free RNA nucleotidyltransferase
    activity (GO:0098680)?
suggested_experiments:
- description: In vitro pUGylation assays with recombinant RDE-3, comparing wild type and catalytic-site
    mutants and varying UTP/GTP ratios.
  hypothesis: RDE-3 alone adds perfectly alternating UG tails to RNA 3' ends.
