  evidence_type: ISS
  original_reference_id: PMID:10835346
  review:
    summary: >-
      Proposed process annotation for the reaction the enzyme itself catalyses: formation of Dol-P-Man
      from GDP-mannose and dolichyl phosphate.
    action: NEW
    reason: >-
      Participation, not necessity: the catalytic DPM1 subunit performs the single step that defines this
      process. Comparator check: human DPM1 (IDA) and DPM2 (IDA, PMID:10835346) and yeast Dpm1 (ISS) carry
      this term; the term is recent and PAINT has not yet placed an IBD for it in PTHR43398, so its absence
      from worm reflects ontology lag rather than a curator decision against it. It is the process
      counterpart of the accepted GO:0004582 activity, inferred by subfamily membership (PTHR43398:SF1) and
      not demonstrated in C. elegans.
