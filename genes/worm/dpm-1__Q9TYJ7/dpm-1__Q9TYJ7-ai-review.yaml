suggested_questions:
- question: Does C. elegans DPM-1 form a complex with DPM-3 (Q9XVV5), and does the worm, which has no
    detectable DPM2 (PF07297) protein, use a DPM2-independent complex or a divergent DPM2?
- question: PAINT propagates GO:0033185 (DPM synthase complex) to DPM3-family members but not to the DPM1
    family node, which also contains single-subunit yeast-class enzymes. Would an animal-level DPM1 node
    be the right place to propagate complex membership and the human GPI-anchor and O-mannosylation
    process annotations?
- question: Which Dol-P-Man-consuming pathways (N-glycan precursor, GPI anchor, O- and C-mannosylation) are
    most sensitive to loss of dpm-1 in C. elegans?
suggested_experiments:
- description: Express full-length Y66H1A.2a (Q9TYJ7) alone and with DPM-3 in a Dol-P-Man-deficient host
    (e.g. S. pombe dpm1 null or mammalian class E cells) and measure Dol-P-Man formation from GDP-mannose and
    dolichyl phosphate, with a DXD-motif (D96A/D98A in the MDAD motif) mutant as negative control.
- description: Tag endogenous DPM-1 and DPM-3 by CRISPR, test ER-membrane co-localisation and
    co-immunoprecipitation, and test whether DPM-1 membrane association is lost after dpm-3 depletion.
- description: Profile lipid-linked oligosaccharides, GPI-anchored proteins and O-mannosylated proteins in a
    conditional dpm-1 loss-of-function background to define which pathways depend on it in worms.
