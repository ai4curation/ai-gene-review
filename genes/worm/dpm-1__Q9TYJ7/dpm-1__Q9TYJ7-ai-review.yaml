  review:
    summary: >-
      PAINT places Dol-P-Man synthase activity at PTN002459128, seeded by experimentally characterised
      yeast Dpm1, human and mouse DPM1 and microbial relatives. Q9TYJ7 is a full-length member of the same
      subfamily (PTHR43398:SF1) as human DPM1 and yeast Dpm1, with the catalytic acidic motifs intact.
    action: ACCEPT
    reason: >-
      The target sits inside the clade that inherited the activity, and nothing in its sequence suggests
      loss: both conserved aspartate-containing motifs (VDDAS at 41, MDAD at 95) are present and the
      protein has the human-class architecture, which is functional in vivo (human-class and yeast-class
      synthases complement each other in S. pombe). This is the core activity of the gene. It is inferred,
      not measured, in C. elegans.
