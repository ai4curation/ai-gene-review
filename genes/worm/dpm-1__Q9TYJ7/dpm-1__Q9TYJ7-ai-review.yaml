id: Q9TYJ7
gene_symbol: dpm-1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: >-
  dpm-1 (Y66H1A.2) encodes the full-length 239-residue Caenorhabditis elegans orthologue of DPM1, the
  catalytic subunit of dolichol-phosphate-mannose (Dol-P-Man) synthase. It is a GT2-family
  glycosyltransferase in PANTHER subfamily PTHR43398:SF1, together with human DPM1 and yeast Dpm1, and it
  retains the conserved acidic DXD-type motifs of the family. By homology it transfers mannose from
  GDP-mannose to dolichyl phosphate on the cytosolic face of the endoplasmic reticulum, producing Dol-P-Man,
  the lipid-linked mannosyl donor for lumenal steps of N-glycan precursor assembly, GPI-anchor synthesis and
  protein O- and C-mannosylation. Like human DPM1, and unlike S. cerevisiae Dpm1, it lacks a C-terminal
  transmembrane anchor, so its ER-membrane association is expected to depend on a partner such as the worm
  DPM3 orthologue DPM-3. None of these properties has been measured directly on the C. elegans protein; the
  assignments rest on subfamily membership, PAINT phylogenetic inference and experiments on yeast and
  mammalian orthologues.
