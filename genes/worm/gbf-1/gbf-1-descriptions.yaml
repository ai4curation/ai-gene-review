descriptions:
- source: UniProt
  text: Guanine-nucleotide exchange factor (GEF) for members of the Arf family of
    small GTPases involved in trafficking in the early secretory pathway; its GEF
    activity initiates the coating of nascent vesicles via the localized generation
    of activated ARFs through replacement of GDP with GTP (By similarity). Also, plays
    a role in receptor-mediated endocytosis in oocytes and endosomal trafficking (PubMed:23840591).
    Involved in vesicle retrograde transport from the ERGIC and cis-Golgi compartments
    to the endoplasmic reticulum (ER) (PubMed:23840591). Plays a role in maintaining
    mitochondrial morphology, network organization and function (PubMed:25190516).
    May be required for the basolateral cell membrane localization of the serine threonine
    protein kinase sgk-1 in intestinal cells (PubMed:26115433).
  source_type: curated
  url: https://www.uniprot.org/uniprot/G5EGS5
  source_id: G5EGS5
- source: Alliance_Automated
  text: Predicted to enable guanyl-nucleotide exchange factor activity. Involved in
    several processes, including endoplasmic reticulum organization; endosomal transport;
    and mitochondrion organization. Located in Golgi cis cisterna; endoplasmic reticulum
    exit site; and endoplasmic reticulum-Golgi intermediate compartment. Human ortholog(s)
    of this gene implicated in Charcot-Marie-Tooth disease dominant intermediate A.
    Orthologous to human GBF1 (golgi brefeldin A resistant guanine nucleotide exchange
    factor 1).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00007703;class=Gene
  source_id: WB:WBGene00007703
