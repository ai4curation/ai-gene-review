suggested_questions:
- question: Which Arf paralogs does GBF-1 activate directly (ARF-1.2, ARF-3, ARF-5 or ARF-6)? The 2013 study
    assumes ARF-1.2, but no exchange assay has been done with the worm protein.
- question: Does isoform b (G5EGS5-2), which lacks the Sec7 domain, have any function, for example as a
    dominant-negative or scaffolding fragment?
- question: Is GBF-1's effect on intestinal endosomes (RAB-5 loss, tubular RAB-7 networks) direct, through
    endosomal Arf activation, or secondary to Golgi dysfunction? The same question applies to its role at
    ER-mitochondria contacts.
- question: Should the worm protein carry a COPI-coat recruitment process term, such as COPI coating of
    Golgi vesicles? It would describe the GEF's participation step, but no worm-specific coat-recruitment
    data exist yet.
suggested_experiments:
- description: Purify the GBF-1 Sec7 domain (wild type and the glutamic-finger mutant) and measure GDP/GTP
    exchange on myristoylated ARF-1.2, ARF-3 and ARF-5 on liposomes, with and without brefeldin A, to define
    activity and substrate specificity.
- description: Tag endogenous GBF-1 by CRISPR and live-image COPI (e.g. GFP-tagged coatomer) recruitment to
    cis-Golgi membranes in oocytes, after auxin-induced GBF-1 degradation, to test directly whether GBF-1
    drives coat assembly and retrograde transport in vivo.
