core_functions:
- description: Sec7-domain guanine-nucleotide exchange factor for Arf GTPases at the cis-Golgi and transitional
    ER-Golgi elements. It activates ARF-1-type GTPases to recruit the COPI coat for retrograde transport
    from the cis-Golgi to the ER, which maintains Golgi and ER organization and supports secretion.
