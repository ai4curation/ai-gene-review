id: G5EGS5
gene_symbol: gbf-1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: gbf-1 (C24H11.7, also called phi-34) encodes GBF-1, the C. elegans ortholog of mammalian
  GBF1, yeast Gea1/Gea2 and Drosophila Gartenzwerg. It is a large (1975-residue) peripheral membrane
  protein of the GBF1 subfamily of Sec7-domain guanine-nucleotide exchange factors for Arf GTPases, with
  N-terminal DCB/HUS regions, a central catalytic Sec7 domain (residues 624-812) and a long, largely
  disordered C-terminus. A short isoform (b) lacks the first 1490 residues, including the Sec7 domain.
  GBF-1 sits on the cis face of the Golgi mini-stacks, at the transitional ER-Golgi units that lie
  against ER exit sites in oocytes and intestine. By analogy with its orthologs, it activates Arf1-type
  GTPases there to recruit the COPI coat for retrograde transport from the cis-Golgi and ER-Golgi
  intermediate compartment back to the ER. Knockdown makes the Golgi stacks clump and fills them with
  vesicles at the cis face, collapses the ER lumen, and partly blocks secretion (caveolin, yolk, cuticle
  and eggshell components). It also disturbs intestinal early and late endosomes and mitochondrial
  morphology. The null mutant is lethal, and RNAi causes cuticle rupture, sterility and embryonic lethality.
  GBF-1 co-immunoprecipitates with the kinase SGK-1 and is needed for its basolateral localization in
  the intestine. No in vitro exchange assay has been reported for the worm protein.

