suggested_questions:
- question: Does LAT-1 binding activate TIR-dependent signalling by TOL-1, or does TOL-1
    act only as the ligand that activates LAT-1 in the adjacent cell? The 2025 structure
    frames TOL-1 as the ligand, while the BAG-neuron genetics treat it as a signalling
    receptor; the two roles may be separate.
- question: Should the TOL-1 pathway in BAG neurons (TOL-1, TRF-1, PIK-1, IKB-1) be annotated
    to GO:0008063 Toll signaling pathway? Its definition names "the receptor Toll", no
    Spatzle-like ligand is known for TOL-1, and the output is p38 MAPK rather than NF-kappaB,
    so a curator decision on scope is needed rather than an automatic transfer.
- question: Is the reported requirement of TOL-1 for defence against Salmonella enterica
    (PMID:17975555) reproducible, and is it an indirect consequence of the developmental
    role of TOL-1 in the pharynx or nervous system?
suggested_experiments:
- description: Express the TOL-1 TIR domain-deleted receptor, or a TIR loss-of-function
    point mutant, from the endogenous locus and test embryonic survival, BAG neuron marker
    expression and CO2 avoidance.
  hypothesis: If embryonic development needs only the LAT-1-binding ectodomain, a TIR mutant
    will be viable but defective in BAG function, separating the ligand role from the
    receptor role of TOL-1.
  experiment_type: CRISPR knock-in domain analysis
- description: Infect tol-1 null and LAT-1-interface point mutants, with BAG-specific and
    pharynx-specific rescue lines, with Salmonella enterica and score survival and pharyngeal
    colonisation.
  hypothesis: Salmonella susceptibility is secondary to developmental defects rather than
    a direct TOL-1-dependent immune signalling response.
  experiment_type: genetic infection assay
