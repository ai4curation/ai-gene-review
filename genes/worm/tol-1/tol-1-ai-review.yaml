id: Q9N5Z3
gene_symbol: tol-1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: >-
  TOL-1 is the only Toll/Toll-like receptor family member encoded in the Caenorhabditis
  elegans genome. It is a single-pass type I transmembrane cell-surface receptor with a
  signal peptide, an extracellular region of two leucine-rich-repeat (LRR) domains with
  cysteine-rich flanking modules, a single transmembrane helix and a cytoplasmic TIR
  domain; by TIR-domain phylogeny it groups with Drosophila Toll and other Toll-type
  receptors. Its best-supported role is in development: tol-1 deletion mutants show
  embryonic arrest with malformed embryos, larval lethality and reduced brood size, and
  the extracellular C-terminal LRR domain binds directly (KD about 0.2 micromolar) to the
  lectin domain of the adhesion G-protein-coupled receptor latrophilin LAT-1, mostly in
  trans between neighbouring cells; point mutations at this interface phenocopy the null
  allele. In the nervous system TOL-1 acts in the CO2-sensing BAG neurons, together with
  homologues of TRAF (TRF-1) and IRAK/Pelle (PIK-1) and upstream of the p38 MAPK PMK-3,
  to promote BAG neuron gene expression, axon morphology and chemosensory function; the
  IkappaB homologue IKB-1 acts antagonistically, as its deletion suppresses the tol-1
  CO2-avoidance defect. Loss of this developmental function abolishes avoidance of
  pathogenic Serratia marcescens.
  Neuronal TOL-1 signalling through PMK-1 has also been linked to feeding behaviour. A
  direct role in antibacterial immunity is limited and contested: tol-1 mutants are not
  generally hypersusceptible to pathogens, but one study reports susceptibility to
  Salmonella enterica with pharyngeal invasion and reduced expression of pharyngeal
  defence genes. C. elegans lacks MyD88 and NF-kappaB, and no microbial ligand of TOL-1
  has been identified.
existing_annotations:
- term:
    id: GO:0006952
    label: defense response
  evidence_type: IMP
  original_reference_id: PMID:11516642
  qualifier: involved_in
  review:
    summary: >-
      Pujol et al. (2001) made tol-1 deletion mutants and found them defective in
      avoidance of pathogenic Serratia marcescens, while tol-1, trf-1, pik-1 and ikb-1
      mutants were not important for resistance to a panel of pathogens. The phenotype
      underlying this IMP is therefore a behavioural avoidance defect, not a failure of
      physiological defence. Brandt and Ringstad (2015) later showed this behaviour depends
      on TOL-1 acting in the CO2-sensing BAG neurons.
    action: MODIFY
    reason: >-
      The annotation is sound but the generic parent hides what was actually measured.
      The same paper that supports it states that tol-1 is not important for resistance to
      several pathogens, and the defect it describes is avoidance behaviour. GO:0002209
      behavioral defense response ("a behavioral response seeking to protect an organism
      from a perceived external threat") captures the observed phenotype precisely. The
      experimental IMP is kept, only made more specific. Later work indicates TOL-1 acts
      developmentally in BAG neurons to enable this behaviour (PMID:26279230), so the
      annotation reflects a required upstream role rather than acute pathogen recognition;
      this is noted, not used to overrule the curator.
    proposed_replacement_terms:
    - id: GO:0002209
      label: behavioral defense response
    additional_reference_ids:
    - PMID:26279230
    supported_by:
    - reference_id: PMID:11516642
      supporting_text: The tol-1 mutants are defective in their avoidance of pathogenic
        S. marcescens, although other chemosensory behaviors are wild type.
    - reference_id: PMID:11516642
      supporting_text: None of them are important for the resistance of C. elegans to a
        number of pathogens.
    - reference_id: PMID:26279230
      supporting_text: for pathogen avoidance TOL-1 signaling is required in the chemosensory
        BAG neurons, where it regulates gene expression and is necessary for their chemosensory
        function
- term:
    id: GO:0007165
    label: signal transduction
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR000157
  review:
    summary: >-
      InterPro2GO mapping from the cytoplasmic TIR domain (IPR000157). TOL-1 is a
      transmembrane receptor with a TIR domain, and genetic epistasis places it upstream
      of TRAF, IRAK/Pelle and p38 MAPK homologues in BAG neurons.
    action: ACCEPT
    reason: >-
      Broad but correct. The TIR domain is the signalling module of Toll-family receptors,
      and cell-specific genetics show TOL-1 acts with conserved Toll-pathway homologues to
      regulate gene expression in BAG neurons. More specific process terms are carried by
      the experimental rows.
    supported_by:
    - reference_id: PMID:26279230
      supporting_text: Genetic studies revealed that TOL-1 acts together with many conserved
        components of TLR signaling.
- term:
    id: GO:0007166
    label: cell surface receptor signaling pathway
  evidence_type: TAS
  original_reference_id: PMID:11516642
  qualifier: involved_in
  review:
    summary: >-
      Traceable author statement from Pujol et al. (2001), which analysed tol-1 as the
      receptor of a candidate nematode Toll pathway. TOL-1 is a cell-surface receptor
      (surface display confirmed in PMID:40588662) and acts upstream of trf-1, pik-1,
      ikb-1 and pmk-3 in BAG neurons (PMID:26279230).
    action: ACCEPT
    reason: >-
      Appropriate level of specificity. TOL-1 is a single-pass cell-surface receptor
      with a cytoplasmic TIR domain, and later genetic work supports a TOL-1-initiated
      signalling pathway in neurons. The more specific GO:0008063 Toll signaling pathway is
      defined around the Drosophila receptor Toll and its ligand Spatzle; TOL-1 has no
      Spatzle homologue ligand identified, so the generic cell-surface-receptor term is
      preferred here. GO:0002224 toll-like receptor signaling pathway would be wrong, as
      its definition requires direct binding of microbial pattern motifs, which has not
      been shown for TOL-1.
    additional_reference_ids:
    - PMID:26279230
    - PMID:40588662
    supported_by:
    - reference_id: PMID:11516642
      supporting_text: We have generated and characterized deletion mutants for four genes
        supposed to function in a nematode Toll signaling pathway.
    - reference_id: PMID:40588662
      supporting_text: We observed that the WT and quadruple mutant TOL-1 were displayed
        on the cell surface at very similar levels
- term:
    id: GO:0009792
    label: embryo development ending in birth or egg hatching
  evidence_type: IMP
  original_reference_id: PMID:11516642
  qualifier: involved_in
  review:
    summary: >-
      tol-1 deletion mutants have developmental defects (Pujol et al. 2001). This was
      independently confirmed and extended by Carmona-Rosas et al. (2025): tol-1(nr2013)
      embryos arrest and appear malformed, and CRISPR point mutations that specifically
      break the TOL-1/LAT-1 interface without affecting surface display phenocopy the
      deletion.
    action: ACCEPT
    reason: >-
      Experimental IMP, independently replicated, with a molecular mechanism: TOL-1
      binds the latrophilin LAT-1, and the LAT-1-binding surface is needed for embryonic
      survival. This is the best-supported biological role of TOL-1 and is a core function.
    additional_reference_ids:
    - PMID:40588662
    supported_by:
    - reference_id: PMID:11516642
      supporting_text: Of these four genes, only tol-1 is required for nematode development.
    - reference_id: PMID:40588662
      supporting_text: we independently confirmed that lat-1 and tol-1 are necessary for
        embryonic development, as a significant fraction of lat-1(ok1465) or tol-1(nr2013)
        homozygous embryos arrest and appear malformed at 20 °C
    - reference_id: PMID:40588662
      supporting_text: Because simultaneous substitution of these four TOL-1 residues,
        which are critical for LAT-1 binding in vitro, phenocopy the effect of the tol-1
        deletion allele in vivo, we propose that the LAT-1-binding surface of TOL-1 is essential
- term:
    id: GO:0038023
    label: signaling receptor activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - FB:FBgn0034476
  - PANTHER:PTN002809265
  - RGD:727797
  - UniProtKB:O15455
  - UniProtKB:Q86UN2
  - UniProtKB:Q86UN3
  - UniProtKB:Q99467
  review:
    summary: >-
      PAINT inference from an ancestral node covering Toll/TLR and related LRR receptors.
      TOL-1 has the full receptor architecture (signal peptide, LRR ectodomain, TM helix,
      cytoplasmic TIR domain), is displayed at the cell surface, and acts cell-autonomously
      in BAG neurons upstream of downstream signalling components.
    action: ACCEPT
    reason: >-
      The generic receptor activity is the correct level for TOL-1. It is inside the
      clade with Toll-type receptors and retains every domain required. No PRR activity or
      ligand-specific receptor term is implied, which is appropriate because no microbial
      ligand has been demonstrated. Whether LAT-1 binding triggers TIR-dependent signalling
      by TOL-1, or TOL-1 acts only as the ligand for LAT-1, is not yet resolved (see
      suggested questions); the BAG-neuron genetics are independent support that TOL-1
      transduces a signal.
    additional_reference_ids:
    - PMID:26279230
    supported_by:
    - reference_id: PMID:26279230
      supporting_text: Importantly, loss of tol-1 function specifically in BAG cells recapitulated
        the pathogen avoidance defect of tol-1 mutants, and BAG cell-specific rescue of pmk-3
        and tol-1 restored pathogen avoidance behavior to the corresponding mutants
- term:
    id: GO:0050829
    label: defense response to Gram-negative bacterium
  evidence_type: IMP
  original_reference_id: PMID:17975555
  qualifier: involved_in
  supporting_entities:
  - WB:WBVar00091387
  review:
    summary: >-
      Tenor and Aballay (2008) report that tol-1(nr2033) mutants are killed by Salmonella
      enterica, which invades the pharynx, and that TOL-1 is needed for normal expression
      of the pharyngeal defensin-like ABF-2 and of HSP-16.41. Only the abstract is cached.
    action: KEEP_AS_NON_CORE
    reason: >-
      Experimental IMP from a curator who had the full text; not overruled. It is kept as
      non-core because the immune role of TOL-1 is pathogen-specific and contested: the
      original deletion study found tol-1 not important for resistance to several
      pathogens (PMID:11516642), a later study found tol-1 mutants have elevated rather
      than reduced innate-immune gene expression on Bifidobacterium infantis
      (PMID:31384522), and C. elegans lacks MyD88 and NF-kappaB. The main defence pathway
      of the worm (TIR-1/NSY-1/SEK-1/PMK-1) is TOL-1-independent.
    additional_reference_ids:
    - PMID:11516642
    - PMID:31384522
    - PMID:23112184
    supported_by:
    - reference_id: PMID:17975555
      supporting_text: C. elegans tol-1(nr2033) mutants are killed by the human pathogen
        Salmonella enterica, which causes a significant pharyngeal invasion in the absence
        of TOL-1-mediated immunity
    - reference_id: PMID:23112184
      supporting_text: a clear immune function of the TLR homolog TOL-1 is controversial
        and central components of vertebrate TLR signaling including the key adapter protein
        myeloid differentiation primary response gene 88 (MyD88) and the transcription factor
        NF-κB are not present
    - reference_id: PMID:31384522
      supporting_text: A microarray analysis revealed that the expression of innate immune
        response-related genes was significantly increased in the tol-1 mutant.
- term:
    id: GO:0001664
    label: G protein-coupled receptor binding
  evidence_type: IDA
  original_reference_id: PMID:40588662
  qualifier: enables
  review:
    summary: >-
      The extracellular C-terminal LRR domain of TOL-1 binds directly to the lectin domain
      of the adhesion GPCR latrophilin LAT-1, shown by an extracellular interaction screen,
      SPR (KD about 186-200 nM), and crystal and cryo-EM structures of the complex.
      Interface point mutations that leave TOL-1 surface display intact abolish binding
      and phenocopy the tol-1 null in embryos.
    action: NEW
    reason: >-
      Not in GOA, and the evidence is direct, structural, quantitative and tested in vivo.
      The authors describe TOL-1 as a ligand for LAT-1, i.e. TOL-1 binds a GPCR. Comparator
      check: soluble and membrane ligands of GPCRs (e.g. NPY, POMC, R-spondin) carry
      GO:0001664; the other known latrophilin partners, the teneurins, carry the parent
      GO:0005102 signaling receptor binding. GO:0001664 is therefore within convention and
      more specific; GO:0005102 would be an acceptable fallback. This is a molecular
      function, not a process term, so the participation test does not arise.
    supported_by:
    - reference_id: PMID:40588662
      supporting_text: The extracellular lectin domain of LAT-1 directly binds to
        the second leucine-rich repeat domain of TOL-1.
    - reference_id: PMID:40588662
      supporting_text: We observed a dissociation constant (KD) of 186 nM for WT TOL-1 and
        LAT-1
    - reference_id: PMID:40588662
      supporting_text: LPHNs have large extracellular regions (ECRs) comprising a lectin,
        an olfactomedin, a hormone receptor (HormR) and a GPCR autoproteolysis-inducing (GAIN)
        domain
