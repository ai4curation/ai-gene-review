descriptions:
- source: Alliance_Imported
  text: tol-1 encodes a predicted transmembrane protein that is the sole C. elegans
    Toll-like receptor (TLR); TOL-1 is required for proper embryonic development and
    for pathogen avoidance behavior, and is expressed primarily in the nervous system.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00006593;class=Gene
  source_id: WB:WBGene00006593
- source: Alliance_Automated
  text: Predicted to enable signaling receptor activity. Involved in defense response
    to Gram-negative bacterium and embryo development. Is expressed in neurons. Orthologous
    to human TRIL (TLR4 interactor with leucine rich repeats); CHAD (chondroadherin);
    and CHADL (chondroadherin like).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00006593;class=Gene
