  label: Caenorhabditis elegans
description: >-
  KAP-1 (F08F8.3) is the Caenorhabditis elegans kinesin-associated protein, the non-motor
  third subunit of heterotrimeric kinesin-II (KLP-11/KLP-20/KAP-1), orthologous to vertebrate
  KIFAP3 (KAP3) and sea urchin KAP115. It is an armadillo-repeat protein that folds into an
  elongated superhelix. Its central groove binds the paired tails of the KLP-11 and KLP-20
  motor subunits, and a C-terminal helical hook binds their heterodimerization segment, so
  KAP-1 joins only the KLP-11/KLP-20 heterodimer and not either motor alone. KAP-1 is expressed
  in ciliated sensory neurons. It concentrates at the ciliary transition zone and moves along
  cilia and dendrites at the same rates as IFT particles. As the subunit that links kinesin-II
  to IFT trains, it takes part in anterograde intraflagellar transport: kinesin-II carries
  trains through the ciliary base and transition zone into the proximal axoneme, where the
  homodimeric kinesin-2 OSM-3 takes over. Mutations at the KAP-1/motor-tail interfaces break
  up the motor and impair IFT. Retrograde return of KAP-1 depends on IFT-dynein (CHE-3).
