core_functions:
- description: >-
    Non-motor cargo-binding subunit of heterotrimeric kinesin-II. KAP-1 binds the paired tails
    of KLP-11 and KLP-20, completing the assembly of the motor, and links it to IFT trains
    for anterograde transport through the ciliary base, transition zone and proximal axoneme.
