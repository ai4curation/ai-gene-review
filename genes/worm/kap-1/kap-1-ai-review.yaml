knowledge_gaps:
- gap_statement: >-
    Which IFT-train subunit KAP-1 binds to attach kinesin-II to trains is not known in C.
    elegans. KAP-1 is described as the link between motor and cargo, but the train-side partner
    and the KAP-1 surface that contacts it have not been identified.
  boundary: >-
    Established: KAP-1 binds the KLP-11/KLP-20 tails (structure) and is needed for a functional
    kinesin-II in IFT. Unknown: the direct IFT-A or IFT-B binding partner of KAP-1, and how
    that contact is released at the handover zone where OSM-3 takes over.
  gap_kind:
  - BIOLOGY
  status: OPEN
  significance: >-
    Would explain how kinesin-II hands trains to OSM-3 and then recycles alone to the ciliary
    base.
  resolution: >-
    Crosslinking mass spectrometry or reconstitution of KAP-1 with purified IFT-A and IFT-B
    subcomplexes, followed by in vivo tests of mutations at the mapped interface.
  provenance:
  - reference_id: PMID:20498083
    supporting_text: >-
      heterodimerization is necessary to bind KAP1, the in vivo link between motor and cargo
    reference_section_type: ABSTRACT
suggested_questions:
- question: >-
    Is the KAP-1 N-terminal region, which is flexible and unresolved in the structure, the
    part that contacts IFT trains, and is this contact regulated by the DYF-5/MAK kinase at
    the handover zone?
suggested_experiments:
- description: >-
    Delete or mutate the KAP-1 N-terminal region at the endogenous locus and image kinesin-II,
    OSM-3 and IFT-B with single-molecule sensitivity to measure train loading and handover.
  hypothesis: >-
    The flexible KAP-1 N-terminus links kinesin-II to IFT trains but is not needed for KLP-11/KLP-20
    binding.
