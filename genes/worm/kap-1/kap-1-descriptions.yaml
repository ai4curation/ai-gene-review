gene_symbol: kap-1
organism: worm
uniprot_id: G5EEE6
taxon_id: NCBITaxon:6239
descriptions:
- source: Alliance_Imported
  text: kap-1 encodes a kinesin-associated protein that, along with KLP-20 and KLP-11,
    is part of the C. elegans heterotrimeric kinesin-II motor protein; animals homozygous
    for a kap-1 loss-of-function mutation have normal cilia and thus display normal
    dye-filling and osmotic avoidance behavior; however, animals doubly mutant for
    kap-1 and osm-3, which encodes a homomeric kinesin-II motor protein, do show defects
    in intraflagellar transport (IFT) indicating that the heteromeric kinsesin-II
    and homomeric OSM-3 motor protein complexes function redundantly to effect IFT;
    antibodies to KAP-1 detect high intensity staining in sensory neuron cilia; kap-1
    expression in the AWB sensory neurons is positively regulated by FKH-2.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00002182;class=Gene
  source_id: WB:WBGene00002182
- source: Alliance_Automated
  text: Contributes to microtubule motor activity. Involved in microtubule-based movement.
    Located in ciliary transition zone and non-motile cilium. Part of axonemal heterotrimeric
    kinesin-II complex. Is expressed in body wall musculature; enteric muscle; intestine;
    and nervous system. Orthologous to human KIFAP3 (kinesin associated protein 3).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00002182;class=Gene
  source_id: WB:WBGene00002182
