gene_symbol: sod-2
organism: worm
uniprot_id: P31161
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Destroys superoxide anion radicals which are normally produced within the
    cells and which are toxic to biological systems.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P31161
  source_id: P31161
- source: Alliance_Imported
  text: sod-2 encodes a iron/manganese superoxide dismutase, predicted to be mitochondrial,
    that might defend against oxidative stress and promote normal lifespan; sod-2
    mRNA levels are diminished by mutation of daf-16, and heterologously expressed
    SOD-2 in E. coli protects against methyl viologen-induced oxidative stress.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00004931;class=Gene
  source_id: WB:WBGene00004931
- source: Alliance_Automated
  text: Enables superoxide dismutase activity. Involved in removal of superoxide radicals.
    Located in respiratory chain complex. Is expressed in head and tail. Human ortholog(s)
    of this gene implicated in several diseases, including autoimmune disease of musculoskeletal
    system (multiple); diabetes mellitus (multiple); eye disease (multiple); liver
    disease (multiple); and optic nerve disease (multiple). Orthologous to human SOD2
    (superoxide dismutase 2).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00004931;class=Gene
  source_id: WB:WBGene00004931
- source: RefSeq
  text: Enables superoxide dismutase activity. Involved in removal of superoxide radicals.
    Located in mitochondrion. Part of respiratory chain complex. Is expressed in head
    and tail. Human ortholog(s) of this gene implicated in several diseases, including
    artery disease (multiple); autoimmune disease of musculoskeletal system (multiple);
    diabetes mellitus (multiple); liver disease (multiple); and optic nerve disease
    (multiple). Orthologous to human SOD2 (superoxide dismutase 2). [provided by Alliance
    of Genome Resources, Jun 2026]
  source_type: automated
