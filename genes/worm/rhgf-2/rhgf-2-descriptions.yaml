gene_symbol: rhgf-2
organism: worm
uniprot_id: Q22354
taxon_id: NCBITaxon:6239
descriptions:
- source: Alliance_Imported
  text: rhgf-2 encodes a Rho guanyl-nucleotide exchange factor (RhoGEF) with similarity
    to the mammalian PLEKHG5/Tech/Syx RhoGEFs; rhgf-2 is required for embryonic morphogenesis,
    larval development, and regulation of locomotion; when expressed in mammalian
    neuronal tissue culture cells, RHGF-2 induces cell rounding inhibits neurite outgrowth;
    RHGF-2 functions as a RhoGEF for the RHO-1 GTPase; RHGF-2 physically interacts
    with the multi-PDZ domain scaffold protein MPZ-1; RHGF-2 is expressed in many,
    but not all, C. elegans neurons from the 1.5-fold stage of embryogenesis through
    adulthood; in nerve ring axons, RHGF-2 expression overlaps with that of MPZ-1.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00006476;class=Gene
  source_id: WB:WBGene00006476
- source: Alliance_Automated
  text: Predicted to enable guanyl-nucleotide exchange factor activity. Predicted
    to be involved in endothelial cell migration. Predicted to be active in endocytic
    vesicle and plasma membrane. Is expressed in nervous system; pharyngeal cell;
    seam cell; and tail. Human ortholog(s) of this gene implicated in Charcot-Marie-Tooth
    disease recessive intermediate C; autosomal recessive distal hereditary motor
    neuronopathy 4; and cystic fibrosis. Orthologous to several human genes including
    PLEKHG5 (pleckstrin homology and RhoGEF domain containing G5).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00006476;class=Gene
