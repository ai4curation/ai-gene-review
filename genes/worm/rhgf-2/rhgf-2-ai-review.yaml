- term:
    id: GO:0010172
    label: embryonic body morphogenesis
  evidence_type: IMP
  original_reference_id: PMID:22363657
  qualifier: involved_in
  review:
    summary: rhgf-2(gk216) embryos arrest elongation at about the 1.5-fold stage and hatch as short immobile
      larvae. The phenotype is rescued by genomic transgenes.
    action: ACCEPT
    reason: This is the essential in vivo role. An independent study places RHGF-2 as the RHO-1 activator
      upstream of LET-502/ROCK in the lateral epidermis, where its expression alone supports elongation
      (PMID:26188247). RHGF-2 therefore performs a step of the process (RHO-1 activation that drives epidermal
      actomyosin contraction), rather than merely being required for it.
    supported_by:
    - reference_id: PMID:22363657
      supporting_text: Time-lapse video analysis revealed that rhgf-2(gk216) mutants arrested elongation
        early in the elongation process at the 1.5 fold stage of embryogenesis
    - reference_id: PMID:26188247
      supporting_text: Although expressed throughout the embryo, lateral cell-specific RHGF-2 expression
        can mediate elongation.
    - reference_id: file:worm/rhgf-2/rhgf-2-deep-research-manual.md
      supporting_text: So the elongation function is epidermal
- term:
    id: GO:0010977
    label: negative regulation of neuron projection development
  evidence_type: IMP
  original_reference_id: PMID:22363657
  qualifier: involved_in
  review:
    summary: Transient overexpression of FLAG-RHGF-2 in mouse N1E-115 neuroblastoma cells caused rounding
      and inhibited neurite outgrowth.
    action: MARK_AS_OVER_ANNOTATED
    reason: The only evidence is heterologous overexpression in a mouse cell line, which mimics constitutive
      RhoA activation. No neuronal morphology or neurite defect was reported in C. elegans for rhgf-2
      loss or gain of function, so this does not show that RHGF-2 regulates neuron projection development
      in the worm.
    supported_by:
    - reference_id: PMID:22363657
      supporting_text: FLAG::RHGF-2 expression in N1E-115 cells induced cell rounding and inhibited neurite
        outgrowth to a similar extent as activated Gα12
