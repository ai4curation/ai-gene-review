  review:
    summary: rhgf-2(gk216) mutant hypodermal seam cells fail to elongate and remain round or square during
      embryogenesis (AJM-1::GFP).
    action: KEEP_AS_NON_CORE
    reason: The phenotype is real and the term is as precise as this evidence warrants (seam-cell shape
      change). The failure of seam cells to elongate is the cellular manifestation of the embryo elongation
      defect, which is captured more informatively by embryonic body morphogenesis (GO:0010172). It is
      kept as a non-core consequence of RHO-1 activation in the epidermis.
    supported_by:
