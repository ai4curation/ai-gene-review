suggested_questions:
- question: Is RHGF-2 protein present in embryonic lateral (seam) epidermal cells at endogenous levels,
    and does it localise to the circumferential actin bundles or apical junctions there?
- question: Does the MPZ-1 interaction have any role in the epidermis during elongation, or is it confined
    to neurons?
- question: Should GO-CAM models of C. elegans embryonic elongation include RHGF-2 as the RHO-1 activator
    upstream of LET-502, alongside RGA-2 as the opposing GAP?
suggested_experiments:
- description: Tag endogenous rhgf-2 at the C terminus (CRISPR knock-in, preserving the SDV motif with
    an internal tag) to determine its native expression and subcellular localisation in the embryonic
    epidermis and nervous system.
  experiment_type: CRISPR knock-in and live imaging
- description: Use tissue-specific degradation (for example, ZIF-1 or AID) of RHGF-2 in post-embryonic
    neurons to test whether it has a loss-of-function locomotion phenotype, distinct from the gain-of-function
    loopy phenotype.
  experiment_type: conditional protein depletion and behavioural assay
