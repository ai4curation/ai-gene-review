core_functions:
- description: RHO-1-specific Rho guanine nucleotide exchange factor (DH-PH, PLEKHG5/Syx/Tech family)
    that binds and activates RHO-1. It drives RHO-1/LET-502 (ROCK)-dependent actomyosin contraction
    in the lateral epidermis during embryonic elongation.
