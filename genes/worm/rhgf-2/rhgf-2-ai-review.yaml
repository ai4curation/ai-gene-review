id: Q22354
gene_symbol: rhgf-2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: rhgf-2 (T08H4.1) encodes a Dbl-family Rho guanine nucleotide exchange factor with tandem
  DH (RhoGEF) and PH domains and a C-terminal class I PDZ-binding motif (SDV). It is the C. elegans
  ortholog of the PLEKHG5/Tech/Syx RhoGEF family. RHGF-2 binds RHO-1 (RhoA) and catalyses GDP/GTP exchange
  on RHO-1 but not on CDC-42 or CED-10 (Rac). Through its PDZ-binding motif it binds PDZ domain 8 of
  the multi-PDZ scaffold MPZ-1 (MUPP1 ortholog), with which it co-localises in nerve-ring axons. rhgf-2
  is an essential gene, and deletion mutants arrest embryonic elongation at about the 1.5-fold stage and
  hatch as short, immobile, arrested larvae. Genetically RHGF-2 activates the RHO-1 effector LET-502/Rho-binding
  kinase, in parallel to FEM-2/PP2c, to drive actomyosin contraction in the lateral epidermis during
  elongation; maternal RHGF-2 also influences cleavage furrow ingression. A tagged transgene is
  also expressed in a subset of neurons, where overexpression alters locomotion.
