- id: PMID:22363657
  title: RHGF-2 is an essential Rho-1 specific RhoGEF that binds to the multi-PDZ domain scaffold protein
    MPZ-1 in Caenorhabditis elegans.
  findings:
  - statement: RHGF-2 has GEF activity specific to RHO-1 and binds RHO-1 preferentially over CED-10 and
      CDC-42.
    supporting_text: FLAG::RHGF-2 strongly stimulated the exchange of GDP for GTPγS35 on GST::RHO-1, but
      not on GST::CDC-42 or GST::CED-10.
  - statement: The RHGF-2 C-terminal PDZ-binding motif mediates binding to MPZ-1 PDZ domains.
    supporting_text: Only RHGF-2 containing the PDZ-binding motif bound to the MPZ-1 PDZ domains in a GST
      pull down experiment
  - statement: rhgf-2 deletion mutants arrest embryonic elongation at the 1.5-fold stage.
    supporting_text: Time-lapse video analysis revealed that rhgf-2(gk216) mutants arrested elongation
      early in the elongation process at the 1.5 fold stage of embryogenesis
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text read (PMC3282746). It is the source of all 12 experimental GOA rows. The GEF assay,
      binding assays and deletion phenotype are solid. The neurite and locomotion data are overexpression-only,
      and the transcription data come from a RhoA reporter readout.
- id: PMID:26188247
  title: The Rho guanine exchange factor RHGF-2 acts through the Rho-binding kinase LET-502 to mediate
    embryonic elongation in C. elegans.
  findings:
  - statement: rhgf-2 acts genetically upstream of LET-502/ROCK in parallel to FEM-2, and lateral epidermal
      expression can support embryo elongation.
    supporting_text: Genetically, rhgf-2 acts as an activator of let-502/Rho-binding kinase, in parallel
      to fem-2/PP2c phosphatase.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract only in cache (PubMed-verified title and authors). It places the essential function
      in the epidermis, resolving the neuron-only expression puzzle in PMID:22363657.
