descriptions:
- source: UniProt
  text: Guanyl-specific endoribonuclease which cleaves the phosphodiester bond in
    single-stranded RNA between the 3'-guanylic residue and the 5'-OH residue of adjacent
    nucleotide, resulting in the formation of a corresponding 2',3'-cyclic phosphate
    intermediate (PubMed:26787882). P-granule component involved in germline development
    (PubMed:15238518, PubMed:19372764, PubMed:24746798). Together with the P-granule
    component pgl-1, is involved in the formation of P-granules (PubMed:21402787,
    PubMed:24746798, PubMed:27594427). Together with pgl- 1, probably recruits other
    granule components such as pos-1, mex-3 and glh-1, and RNA to P-granules (PubMed:21402787,
    PubMed:27594427). In vitro, binds mRNA; this interaction is required for the formation
    of liquid-like droplets that resemble P-granules (PubMed:27594427). Most likely
    recruits pgl-1 into P-granules during autophagy (PubMed:19167332). Associates
    with adapters such as sepa-1 and is required for the accumulation and degradation
    of P-granules by autophagy in somatic cells (PubMed:19167332, PubMed:24140420,
    PubMed:28806108). This ensures exclusive localization of the P-granules in germ
    cells (PubMed:19167332, PubMed:28806108). In addition, may act redundantly with
    pgl-1 to protect germ cells from excessive germline apoptosis during normal oogenesis
    and development of the two gonadal arms (PubMed:26598553). This may in part be
    through regulating the localization of sir-2.1 which is involved in germ cell
    apoptosis (PubMed:26598553). May protect somatic cells from excessive apoptosis
    during normal development (PubMed:27650246).
  source_type: curated
  url: https://www.uniprot.org/uniprot/G5EBV6
  source_id: G5EBV6
- source: Alliance_Imported
  text: pgl-3 encodes a novel protein that is a member of the PGL (P Granule Abnormality)
    family of C. elegans proteins that are associated with germline P granules; pgl-3
    functions redundantly with pgl-1 in hermaphrodite germline development by controlling
    the extent of germline proliferation as well as gametogenesis and embryonic development;
    PGL-3 and PGL-1 interact in vitro and in vivo, suggesting that they function are
    part of the same complex; PGL-3 also interacts with PGL-2 in vitro; PGL-3 localizes
    to P granules in both sexes at all stages of development except during spermatogenesis;
    PGL-3 localization to P granules requires the GLH-1 germline helicase, a constitutive
    P granule component.
  source_type: curated
