gene_symbol: tmem-138
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: >-
  TMEM-138 (F10B5.9) is the Caenorhabditis elegans ortholog of human TMEM138, a
  small four-pass integral membrane protein of the TMEM138 family. Human TMEM138 is
  mutated in Joubert syndrome. In worm ciliated sensory neurons TMEM-138 localizes
  to the ciliary transition zone (TZ). Its TZ localization requires the core
  assembly factor MKS-5 and CEP-290 but not core MKS-module (MKS-2, TMEM-231) or
  NPHP-module (NPHP-4) proteins. tmem-138 mutants have no synthetic dye-filling
  (ciliogenesis) defect with mksr-1 or nphp-4 and do not interact genetically with
  cdkl-1, so TMEM-138 cannot be assigned to either the MKS or the NPHP module.
  Together with CDKL-1 it is instead proposed to form a distinct CEP-290-associated
  branch of the TZ. tmem-138;cep-290 double mutants show only a mild reduction in
  dye uptake compared with the single mutants. A clear in vivo requirement for worm
  TMEM-138 in cilium formation or function has not been demonstrated.
