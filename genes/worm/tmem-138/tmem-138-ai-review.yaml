knowledge_gaps:
- gap_statement: >-
    What TMEM-138 does at the C. elegans transition zone is unknown. No mutant
    phenotype beyond a mild enhancement of cep-290 dye-filling defects has been
    reported, and whether it contributes to Y-link assembly or the ciliary gate is
    untested.
  boundary: >-
    TMEM-138 is a TZ membrane protein whose localization requires MKS-5 and CEP-290
    but not core MKS or NPHP module proteins.
  gap_kind:
  - BIOLOGY
  status: OPEN
suggested_questions:
- question: >-
    Does TMEM-138 belong to the MKS module at all, or to a separate
    CEP-290-associated branch? Worm data argue against assigning it to the MKS
    module.
suggested_experiments:
- description: >-
    Test ciliary gate function (TRAM-1a and RPI-2 exclusion) and TZ ultrastructure
    in tmem-138 single and tmem-138;nphp-4 and tmem-138;cep-290 double mutants.
