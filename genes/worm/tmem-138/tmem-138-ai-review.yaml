- term:
    id: GO:0060271
    label: cilium assembly
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000999504
  - UniProtKB:Q9NPI0
  - ZFIN:ZDB-GENE-120912-1
  review:
    summary: >-
      Phylogenetic inference from human and zebrafish TMEM138, which are required for
      ciliogenesis. In worms, tmem-138 mutants have no synthetic dye-filling defect
      with mksr-1, nphp-4 or cdkl-1, and only a mild reduction in dye uptake with
      cep-290.
    action: ACCEPT
    reason: >-
      The PAINT node placement is reasonable, because TMEM138 function in cilium
      biogenesis is conserved in vertebrates and the worm protein is a TZ-localized
      single-copy ortholog. The worm data are weak but do not contradict the
      inference: the mild enhancement of cep-290 dye-filling phenotypes is
      consistent with a minor, redundant role. No worm-specific evidence of loss of
      function argues against the node, so the IBA is retained.
    supported_by:
    - reference_id: PMID:26982032
      supporting_text: >-
        Only a small difference in dye-filling (weaker uptake) was found between the
        double mutants (tmem-138;cep-290 and cdkl-1;cep-290) compared to the single
        mutants, consistent with the positioning of tmem-138, cdkl-1, and cep-290 in
        the same genetic module
core_functions:
- description: >-
    Transition zone membrane protein assembled in an MKS-5- and CEP-290-dependent but
    MKS/NPHP-module-independent manner. With CDKL-1 it defines a CEP-290-associated
    TZ branch whose function in worm cilia remains poorly defined. Its conserved
    vertebrate role in ciliogenesis is inferred phylogenetically. The molecular
    activity is unknown. 'structural molecule activity' is used only as a
    placeholder, consistent with other TZ membrane protein reviews.
  molecular_function:
    id: GO:0005198
    label: structural molecule activity
