- source: Alliance_Imported
  text: unc-17 encodes a synaptic vesicle acetylcholine transporter (VAChT) highly
    conserved amongst metazoans including Drosophila and humans (OMIM:600336); UNC-17
    is essential for embryonic development, and is required in cholinergic neurons
    for loading acetylcholine into synaptic vesicles to which UNC-17 is localized;
    UNC-17 expression may be regulated indirectly by the UNC-4/UNC-37 transcriptional
    repressor complex, as UNC-17 expression is greatly reduced in unc-4 and unc-37
    mutant backgrounds.
  source_type: curated
