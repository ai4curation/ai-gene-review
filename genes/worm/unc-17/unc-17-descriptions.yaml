gene_symbol: unc-17
organism: worm
uniprot_id: P34711
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Involved in acetylcholine transport into synaptic vesicles.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P34711
  source_id: P34711
- source: Alliance_Imported
  text: unc-17 encodes a synaptic vesicle acetylcholine transporter (VAChT) highly
    conserved amongst metazoans including Drosophila and humans (OMIM:600336); UNC-17
    is essential for embryonic development, and is required in cholinergic neurons
    for loading acetylcholine into synaptic vesicles to which UNC-17 is localized;
    UNC-17 expression may be regulated indirectly by the UNC-4/UNC-37 transcriptional
    repressor complex, as UNC-17 expression is greatly reduced in unc-4 and unc-37
    mutant backgrounds.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00006756;class=Gene
  source_id: WB:WBGene00006756
- source: Alliance_Automated
  text: Enables acetylcholine transmembrane transporter activity. Involved in several
    processes, including cholinergic synaptic transmission; nematode larval development;
    and regulation of nematode pharyngeal pumping. Located in excitatory synapse;
    neuron projection; and synaptic vesicle. Is expressed in several structures, including
    head; midbody; neurons; somatic nervous system; and tail. Human ortholog(s) of
    this gene implicated in congenital myasthenic syndrome 21. Orthologous to human
    SLC18A3 (solute carrier family 18 member A3).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00006756;class=Gene
  source_id: WB:WBGene00006756
