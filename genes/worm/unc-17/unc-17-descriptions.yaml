- source: Alliance_Automated
  text: Enables acetylcholine transmembrane transporter activity. Involved in several
    processes, including cholinergic synaptic transmission; nematode larval development;
    and regulation of nematode pharyngeal pumping. Located in excitatory synapse;
    neuron projection; and synaptic vesicle. Is expressed in several structures, including
    head; midbody; neurons; somatic nervous system; and tail. Human ortholog(s) of
    this gene implicated in congenital myasthenic syndrome 21. Orthologous to human
    SLC18A3 (solute carrier family 18 member A3).
