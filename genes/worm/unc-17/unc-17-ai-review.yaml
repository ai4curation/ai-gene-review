suggested_questions:
- question: Has acetylcholine uptake by UNC-17 been measured directly, and does the
    worm transporter show the same vesamicol sensitivity and proton stoichiometry as
    mammalian VAChT?
- question: Which adaptor complexes actually sort UNC-17 to synaptic vesicles in
    C. elegans, and does the C-terminal dileucine motif mediate that sorting as it
    does in mammalian VAChT?
suggested_experiments:
- description: Express UNC-17 in a heterologous vesicular system and measure
    proton-gradient-dependent acetylcholine uptake and vesamicol inhibition, and test
    dileucine-motif mutants for mislocalization in vivo.
