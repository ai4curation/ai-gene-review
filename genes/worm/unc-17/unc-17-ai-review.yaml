id: P34711
gene_symbol: unc-17
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: UNC-17 is the vesicular acetylcholine transporter (VAChT) of
  Caenorhabditis elegans, a member of the SLC18 family of the major facilitator
  superfamily and the paralogue of the vesicular monoamine transporter CAT-1. It is a
  multi-pass protein of the synaptic vesicle membrane in cholinergic neurons, where
  it exchanges luminal protons for cytosolic acetylcholine and so fills synaptic
  vesicles with the transmitter synthesized by choline acetyltransferase; unc-17 and
  cha-1 share the cholinergic gene locus. UNC-17 protein marks more than a third of
  the 302 neurons, including all classes of excitatory ventral cord motor neurons,
  and its expression defines cholinergic identity. Hypomorphic mutations cause
  uncoordinated movement and resistance to acetylcholinesterase inhibitors, while
  complete loss of unc-17 is lethal, newly hatched animals being small, coiled and
  unable to feed or move.
