  review:
    summary: This assertion comes from the broad SLC18 node shared with the
      vesicular monoamine transporters (CAT-1, human SLC18A1/SLC18A2), whose
      experimental monoamine antiport annotations seeded it. UNC-17 is a VAChT - its
      physiological substrate is acetylcholine, a quaternary ammonium ester rather
      than a monoamine - and the ACh-specific antiporter term GO:0005278 is
      annotated separately.
    action: MARK_AS_OVER_ANNOTATED
    reason: Paralog-level over-propagation within the SLC18 family. The shared
      proton-antiport mechanism is correct, so the row is not simply false, but the
      substrate class belongs to the VMAT branch; retaining it as an over-annotation
      rather than removing it, since low-affinity amine transport by VAChT proteins
      has not been excluded.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - WRONG_ORTHOLOG_OR_PARALOG
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: PANTHER:PTN001519357
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Broad SLC18 node covering both the VMAT and VAChT branches; the
          monoamine substrate specificity is a property of the VMAT branch only.
      - source_id: UniProtKB:Q05940
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Human VMAT2 has direct monoamine antiport evidence, but it is the
          paralogue of unc-17, not its functional equivalent.
