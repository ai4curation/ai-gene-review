- term:
    id: GO:0030121
    label: AP-1 adaptor complex
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: part_of
  supporting_entities:
  - PANTHER:PTN000607168
  - RGD:62072
  review:
    summary: VAChT is a cargo protein recognised by clathrin adaptor complexes
      through its cytoplasmic C-terminal dileucine motif, which is how it is sorted
      to synaptic vesicles. It is not a subunit of the AP-1 heterotetramer, which
      consists of gamma, beta1, mu1 and sigma1 adaptins.
    action: REMOVE
    reason: A cargo-adaptor interaction has been propagated as complex membership.
      The part_of claim is structurally wrong for a twelve-transmembrane transporter,
      and nothing in the worm or mammalian literature makes VAChT an adaptin. This is
      an electronically propagated (IBA) assertion that can be rejected on
      biological grounds; the sorting relationship, if it needs recording, belongs on
      the adaptor complex as an interaction, not as subunit membership.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - ROLE_CONFLATION
      - COMPARTMENT_OR_COMPLEX_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN000607168
        source_status: SOURCE_BAD
        comment: The VAChT node propagates an adaptor-complex membership that
          reflects cargo recognition by AP-1, not subunit composition.
      - source_id: RGD:62072
        source_status: SOURCE_BAD
        comment: Rat Slc18a3 adaptor annotations derive from dileucine-motif binding
          studies, which show interaction with the adaptor rather than membership of
          it.
