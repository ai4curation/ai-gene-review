- term:
    id: GO:0046928
    label: regulation of neurotransmitter secretion
  evidence_type: IMP
  original_reference_id: PMID:15914662
  qualifier: involved_in
  supporting_entities:
  - WB:WBVar00143061
  review:
    summary: Reduced UNC-17 function weakens cholinergic transmission at the
      pharyngeal neuromuscular junction (PMID:15914662); the step UNC-17 itself
      performs is filling synaptic vesicles with acetylcholine (PMID:18041778).
    action: MODIFY
    reason: The transporter does not regulate the secretion machinery; it determines
      how much transmitter each vesicle contains, so the quantal content and hence
      the apparent secretion change. The precise process is neurotransmitter loading
      into synaptic vesicle, which is also the term used for VAChT in the
      neurotransmitter-loading module.
