- id: PMID:8342028
  title: 'The Caenorhabditis elegans unc-17 gene: a putative vesicular acetylcholine
    transporter.'
  findings:
  - statement: unc-17 mutations cause neuromuscular deficits.
    supporting_text: Mutations in the unc-17 gene of the nematode Caenorhabditis
      elegans produce deficits in neuromuscular function
  - statement: Sequence similarity to vesicular amine transporters plus synaptic
      vesicle localization in cholinergic neurons identify unc-17 as the vesicular
      acetylcholine transporter.
    supporting_text: On the basis of sequence similarity to mammalian vesicular
      transporters of biogenic amines and of localization to synaptic vesicles of
      cholinergic neurons in C. elegans, unc-17 likely encodes the vesicular
      transporter of acetylcholine
  - statement: Complete loss of unc-17 function is lethal.
    supporting_text: Mutations that eliminated all unc-17 gene function were lethal,
      suggesting that the acetylcholine transporter is essential
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract only; the founding paper for unc-17 identity, localization
      and essentiality.
  full_text_unavailable: true
core_functions:
- description: Vesicular acetylcholine transporter of cholinergic neurons; exchanges
    luminal protons for cytosolic acetylcholine, filling synaptic vesicles with
    transmitter using the proton gradient generated by the vesicular V-ATPase and
    thereby setting the quantal content of cholinergic transmission.
  molecular_function:
    id: GO:0005278
    label: acetylcholine:proton antiporter activity
  directly_involved_in:
  - id: GO:0098700
    label: neurotransmitter loading into synaptic vesicle
  - id: GO:0015870
    label: acetylcholine transport
  - id: GO:0007271
    label: synaptic transmission, cholinergic
  locations:
