gene_symbol: unc-83
organism: worm
uniprot_id: Q23064
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Cargo-specific adapter that is involved in nuclear migration during development
    and thereafter (PubMed:11748140, PubMed:19605495, PubMed:20005871, PubMed:20921138,
    PubMed:27697906). Component of the unc-83-unc-84 LINC (LInker of Nucleoskeleton
    and Cytoskeleton) complex where it interacts with unc-84 to form a bridge connecting
    the nuclear envelope to the cytoskeleton which allows for nuclear transport along
    microtubules (PubMed:11748140, PubMed:16481402, PubMed:25023515). Within the complex,
    connects the nuclear envelope to the microtubule cytoskeleton through the kinesin-1
    light chain protein klc-2 (most likely within the Kinesin 1 motor complex) to
    regulate nuclear migrations (PubMed:19605495, PubMed:20921138). Moreover, within
    the complex, also recruits the large microtubule-associated bicd-1-dlc-1- egal-1
    and lis-1-nud-2 complexes to the nuclear envelope to regulate both the bidirectional
    migration of nuclei and the extent of nuclear migrations (PubMed:20005871). Not
    required for centrosome attachment to the nucleus (PubMed:11748140).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q23064
  source_id: Q23064
- source: Alliance_Imported
  text: unc-83 encodes a KASH domain-containing transmembrane protein; during development,
    UNC-83 is required for nuclear migrations in P cells, hyp7 hypodermal precursors,
    and intestinal cells and thus, for ventral nerve cord development, locomotion,
    and vulval formation; specifically, UNC-83 functions to recruit kinesin and dynein
    motor complexes to the nuclear envelope to regulate the directionality and extent
    of nuclear migrations; UNC-83 localizes to the outer nuclear membrane and its
    localization is dependent upon the SUN domain of UNC-84, an inner nuclear membrane
    protein with which it interacts in vitro; UNC-83 and UNC-84 are thus proposed
    to link the nuclear lamina with the cytoskeleton to properly effect nuclear migrations.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00006815;class=Gene
  source_id: WB:WBGene00006815
- source: Alliance_Automated
  text: Enables dynein light chain binding activity. Involved in several processes,
    including egg-laying behavior; nuclear migration along microtubule; and vulval
    development. Located in nuclear outer membrane. Part of meiotic nuclear membrane
    microtubule tethering complex. Is expressed in several structures, including P1;
    P10; P11; anal depressor muscle; and reproductive system. Used to study Emery-Dreifuss
    muscular dystrophy.
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00006815;class=Gene
