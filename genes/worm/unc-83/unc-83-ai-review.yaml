id: Q23064
gene_symbol: unc-83
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: UNC-83 is a C. elegans KASH protein of the outer nuclear membrane that serves as a nucleus-specific
  cargo adaptor for microtubule motors during developmental nuclear migration. A single C-terminal transmembrane
  segment followed by a short, divergent KASH peptide places it in the outer nuclear membrane, where it
  is held by binding of the KASH peptide to the SUN domain of UNC-84 in the perinuclear space. Its large
  cytoplasmic domain has separable binding regions for the kinesin-1 light chain KLC-2 and for two dynein-regulating
  complexes, NUD-2/LIS-1 and BICD-1/EGAL-1/DLC-1, which it recruits to the nuclear surface. UNC-83 is
  expressed mainly in cells whose nuclei migrate, including embryonic hyp7 precursors, larval P cells
  and intestinal precursors. In hyp7 precursors kinesin-1 provides the main force and dynein regulates
  bidirectional movement; in larval P cells, whose nuclei squeeze through a narrow constriction towards
  microtubule minus ends, dynein is the main motor. Loss of UNC-83 blocks these nuclear migrations, and
  P cells whose nuclei fail to migrate die, leading to loss of vulval cells and ventral cord motor neurons.
  UNC-83 is not required for centrosome attachment to the nucleus.
