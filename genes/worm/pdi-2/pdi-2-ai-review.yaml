gene_symbol: pdi-2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: >-
  PDI-2 is an endoplasmic reticulum protein disulfide isomerase in
  Caenorhabditis elegans. It has a cleavable signal peptide, two redox-active
  thioredoxin domains, and a C-terminal ER-retention motif, and it catalyzes
  thiol-disulfide exchange reactions during secretory protein folding. PDI-2
  also acts as the single beta subunit for conserved C. elegans procollagen
  prolyl 4-hydroxylase complexes: it assembles with PHY-1 and PHY-2 as
  PHY-1/PDI-2 and PHY-2/PDI-2 dimers and as a mixed PHY-1/PHY-2/(PDI-2)2
  tetramer that hydroxylates nascent cuticle collagens. pdi-2 is coexpressed
  with the collagen prolyl 4-hydroxylase alpha-subunit genes in
  cuticle-synthesizing hypodermal cells, and pdi-2 RNAi causes
  post-elongation embryonic lethality consistent with failure to form a
  functional collagenous cuticle.
