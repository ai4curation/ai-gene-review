knowledge_gaps:
- gap_statement: >-
    It is unresolved whether PDI-2 has protein-glutamine
    gamma-glutamyltransferase activity in addition to its established protein
    disulfide isomerase activity.
  boundary: >-
    The GOA seed contains a WormBase IDA row and an ARBA row for
    protein-glutamine gamma-glutamyltransferase activity, but the only cached
    PMID supporting the direct row is abstract-only and attributes that
    calcium-dependent activity to PDI-3 rather than PDI-2.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  significance: >-
    Resolving whether the WormBase row rests on a hidden PDI-2 assay or on a
    PDI-3 paper attached to the wrong gene would decide whether the
    transglutaminase-like activity is a secondary PDI-2 function or should be
    removed upstream.
  resolution: >-
    Check the full text of PMID:12424233, or re-assay recombinant PDI-2 and
    PDI-3 side by side with a transglutaminase substrate.
  provenance:
  - reference_id: PMID:12424233
    supporting_text: >-
      A novel protein disulfide isomerase gene, pdi-3, was isolated from the
      nematode Caenorhabditis elegans.
- gap_statement: >-
    The native cuticle-collagen substrates that depend most strongly on
    PDI-2-containing PHY complexes have not been mapped.
  boundary: >-
    pdi-2 RNAi phenocopies combined loss of the two conserved collagen P4H
    alpha subunits, but the direct hydroxyproline occupancy changes caused by
    loss of PDI-2 have not been assigned to individual cuticle collagens.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  significance: >-
    PDI-2 partners with several PHY alpha subunits and also performs general
    oxidative protein folding, so direct substrate mapping would distinguish
    cuticle collagen P4H targets from broader secretory-protein clients.
  resolution: >-
    Combine stage-resolved pdi-2 depletion with cuticle-collagen peptidomics
    and compare the lost hydroxyproline sites with dpy-18 and phy-2
    single-mutant profiles.
  provenance:
  - reference_id: PMID:10805750
    supporting_text: >-
      These results support the proposal that PDI-2 represents the single β
      subunit for conserved forms of prolyl 4-hydroxylase complexes in C.
      elegans
suggested_questions:
- question: >-
    Which cuticle collagen sites are most dependent on PDI-2-containing
    PHY-1/PDI-2, PHY-2/PDI-2 or mixed PHY-1/PHY-2/(PDI-2)2 complexes in vivo?
- question: >-
    Does PDI-2 contribute to cuticle procollagen folding primarily as a
    collagen P4H beta subunit, or does its own thiol-disulfide exchange
    activity independently handle disulfide-bonded cuticle clients?
- question: >-
    Does C. elegans PDI-2 have any direct transglutaminase-like cross-linking
    activity, or is that activity limited to PDI-3?
suggested_experiments:
- description: >-
    Use inducible or auxin-degron pdi-2 depletion in late embryonic and larval
    hypodermis followed by cuticle-collagen mass spectrometry to identify the
    proline hydroxylation sites and procollagen clients that require PDI-2 in
    vivo.
- description: >-
    Reconstitute PHY-1/PDI-2 and PHY-2/PDI-2 complexes with wild-type PDI-2,
    active-site cysteine mutants, and ER-retention mutants to separate PDI-2
    redox chemistry, P4H alpha-subunit stabilization, and ER retention during
    cuticle procollagen maturation.
