gene_symbol: tmem-231
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: >-
  TMEM-231 (T26A8.2) is the Caenorhabditis elegans ortholog of human TMEM231
  (JBTS20), a membrane protein of the TMEM231 family. In mammals TMEM231 is a
  component of the MKS/tectonic complex. In worms TMEM-231 is expressed only in
  ciliated sensory neurons and localises to the ciliary transition zone (TZ), just
  distal to the basal body. It is a core MKS-module component. Its TZ localisation
  requires MKS-5, MKS-2, CEP-290 and TMEM-107, but not NPHP-4. TMEM-231 is in turn
  needed to concentrate MKS-2 and TMEM-17 at the TZ, but not MKS-5 or NPHP-1.
  Loss of TMEM-231 compromises the TZ diffusion barrier, so the periciliary
  membrane protein TRAM-1a leaks into cilia. TMEM-231 thus helps assemble the MKS
  module of the TZ, which controls ciliary membrane composition and, with the NPHP
  module, supports sensory cilium formation. Its molecular activity is unknown.
existing_annotations:
- term:
    id: GO:0003674
    label: molecular_function
  evidence_type: ND
  original_reference_id: GO_REF:0000015
  qualifier: enables
  review:
    summary: >-
      No molecular activity has been determined for TMEM-231 in any species. The
      mammalian protein was found as a potential B9D1 interactor and is part of the
      MKS complex, but no specific activity has been shown.
    action: ACCEPT
    reason: >-
      ND is appropriate. The available evidence concerns localisation
      interdependence and TZ function, not a defined molecular activity.
    supported_by:
    - reference_id: PMID:25869670
      supporting_text: We detected Tmem231, a 36-kD two-pass transmembrane protein,
        as a potential B9d1 interactor
- term:
    id: GO:0032880
    label: regulation of protein localization
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:2685024
  - PANTHER:PTN000378535
  review:
    summary: >-
      The phylogenetic inference reflects the conserved role of TMEM231 in
      controlling which proteins localise to the TZ and cilium. In worms, MKS-2 and
      TMEM-17 fail to concentrate at the TZ without TMEM-231, and TRAM-1a enters
      cilia.
    action: MODIFY
    reason: >-
      The underlying biology is sound and conserved (mouse Tmem231 is the donor).
      But 'regulation of protein localization' is vague and implies a regulatory
      rather than a structural role. TMEM-231 is a core MKS-module component needed
      to assemble its partners at the TZ. 'protein localization to ciliary
      transition zone' captures this more precisely.
    proposed_replacement_terms:
    - id: GO:1904491
      label: protein localization to ciliary transition zone
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - GRANULARITY_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN000378535
        source_status: SUPPORTS_TRANSFER
        comment: TMEM231-family node; the worm protein is a bona fide member and the
          localisation-control function is conserved, but the node term is a vague
          regulation term where a specific TZ protein-localisation term fits.
    supported_by:
    - reference_id: PMID:25869670
      supporting_text: Reciprocally, NPHP-1 and MKS-5 localize normally to the TZ in
        nematodes lacking TMEM-231, but TMEM-17 and MKS-2 no longer concentrate at the
        TZ in mutants lacking exons 2 and 3 of tmem-231
