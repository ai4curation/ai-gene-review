- term:
    id: GO:1905515
    label: non-motile cilium assembly
  evidence_type: IMP
  original_reference_id: PMID:25869670
  qualifier: involved_in
  supporting_entities:
  - WB:WBVar01429624
  review:
    summary: >-
      In tmem-231(tm5963) mutants, MKS-2 and TMEM-17 fail to assemble at the TZ and
      TRAM-1a leaks into cilia, so the TZ of the non-motile sensory cilium is
      defective.
    action: ACCEPT
    reason: >-
      The evidence shows defective assembly of the TZ, a sub-structure of the
      sensory cilium, rather than an absent axoneme. The term is acceptable at this
      level. TMEM-231 does part of the work as a core, interdependent MKS-module
      component.
    supported_by:
    - reference_id: PMID:25869670
      supporting_text: TMEM-231 localizes to the TZ and participates with other MKS
        complex proteins to build the TZ and prevent a nonciliary protein, TRAM-1a,
        from entering the cilium.
