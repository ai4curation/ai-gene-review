core_functions:
- description: >-
    Core, interdependent MKS-module membrane protein of the ciliary transition zone.
    It is needed to assemble MKS-module partners (MKS-2, TMEM-17) at the TZ and to
    maintain the TZ diffusion barrier that excludes non-ciliary membrane proteins
    from the cilium. No molecular activity is established, so no MF is asserted.
  locations:
  - id: GO:0035869
    label: ciliary transition zone
  directly_involved_in:
  - id: GO:1904491
    label: protein localization to ciliary transition zone
  - id: GO:1905515
    label: non-motile cilium assembly
  supported_by:
  - reference_id: PMID:25869670
    supporting_text: TMEM-231 is a TZ protein that interacts functionally with other
      TZ proteins to control the composition of the TZ and ciliary membrane.
  - reference_id: PMID:26595381
    supporting_text: nematode TMEM-107 occupies an intermediate layer of the TZ-localized
      MKS module by organizing recruitment of the ciliopathy proteins MKS-1, TMEM-231
      (JBTS20) and JBTS-14 (TMEM237).
proposed_new_terms: []
suggested_questions:
- question: Does worm TMEM-231 physically associate with MKSR-1/B9D1 and MKS-2, as its
    mouse ortholog does with B9d1?
- question: Which TMEM-231 regions contact TMEM-107, which sits in an intermediate layer
    of the MKS module and organises TMEM-231 recruitment?
suggested_experiments:
- description: Proximity labelling (TurboID) of endogenously tagged TMEM-231 in ciliated
    neurons, followed by mass spectrometry.
  hypothesis: TMEM-231 directly contacts MKSR-1, MKS-2 and TMEM-107 in a membrane-embedded
    MKS subcomplex.
