gene_symbol: tmem-231
organism: worm
uniprot_id: Q22804
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Transmembrane component of the tectonic-like complex, a complex localized
    at the transition zone of primary cilia and acting as a barrier that prevents
    diffusion of transmembrane proteins between the cilia and plasma membranes. Required
    for ciliogenesis and sonic hedgehog/SHH signaling.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q22804
  source_id: Q22804
- source: Alliance_Automated
  text: Involved in non-motile cilium assembly. Located in ciliary transition zone.
    Is expressed in amphid neurons; ciliated neurons; inner labial neurons; outer
    labial neurons; and phasmid neurons. Used to study Meckel syndrome and orofaciodigital
    syndrome. Human ortholog(s) of this gene implicated in Joubert syndrome 20 and
    Meckel syndrome 11. Orthologous to human TMEM231 (transmembrane protein 231).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00020825;class=Gene
  source_id: WB:WBGene00020825
