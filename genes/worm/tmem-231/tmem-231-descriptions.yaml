descriptions:
- source: UniProt
  text: Transmembrane component of the tectonic-like complex, a complex localized
    at the transition zone of primary cilia and acting as a barrier that prevents
    diffusion of transmembrane proteins between the cilia and plasma membranes. Required
    for ciliogenesis and sonic hedgehog/SHH signaling.
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q22804
  source_id: Q22804
