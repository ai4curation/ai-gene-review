gene_symbol: gcs-1
organism: worm
uniprot_id: Q20117
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Plays a role in resistance to arsenite (PubMed:23593298). May play a role
    in the oxidative stress response induced by reactive oxygen species produced during
    infection by pathogenic bacteria (PubMed:22216003). Together with trxr-1, required
    for the reduction of disulfide groups in the cuticle during molting (PubMed:21199936).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q20117
  source_id: Q20117
- source: Alliance_Imported
  text: gcs-1 encodes the C. elegans ortholog of gamma-glutamine cysteine synthetase
    heavy chain (GCS(h)); GCS-1 is predicted to function, in a conserved oxidative
    stress response pathway, as a phase II detoxification enzyme that catalyzes the
    rate-limiting first step in glutathione biosynthesis; a GCS-1::GFP reporter fusion
    is expressed in larvae and adults in the pharynx, ASI chemosensory neurons, and
    anterior and posterior intestine and upon exposure to oxidative stress, such as
    heat or herbicide, the intestinal expression increases dramatically; constitutive
    and stress-inducible GCS-1::GFP expression in the ASI neurons and intestine, respectively,
    is under the control of the SKN-1 CNC transcription factor; loss of gcs-1 activity
    via RNAi results in a low percentage of larval lethality and intestinal abnormalities
    suggesting that gcs-1 plays a role in postembryonic development.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00001527;class=Gene
  source_id: WB:WBGene00001527
- source: Alliance_Automated
  text: Predicted to enable glutamate-cysteine ligase activity. Involved in several
    processes, including glutathione biosynthetic process; response to heat; and response
    to superoxide. Predicted to be part of glutamate-cysteine ligase complex. Is expressed
    in ASIL; ASIR; intestine; and pharynx. Human ortholog(s) of this gene implicated
    in bacterial infectious disease; congenital nonspherocytic hemolytic anemia 7;
    cystic fibrosis; hemolytic anemia; and myocardial infarction. Orthologous to human
    GCLC (glutamate-cysteine ligase catalytic subunit).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00001527;class=Gene
  source_id: WB:WBGene00001527
