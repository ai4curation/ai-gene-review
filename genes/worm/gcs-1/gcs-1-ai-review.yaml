taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: 'GCS-1 is the C. elegans glutamate-cysteine ligase (gamma-glutamylcysteine synthetase)
  catalytic subunit, which catalyses the ATP-dependent ligation of L-glutamate and L-cysteine
  to gamma-glutamylcysteine, the first and rate-limiting step of glutathione biosynthesis.
  It is predicted to associate with the modifier subunit GCLM-1 (E01A2.1) in a heterodimeric
  glutamate-cysteine ligase. gcs-1 is a canonical phase II detoxification target of the transcription
  factor SKN-1: it is expressed constitutively in the ASI neurons and is induced in the intestine
  by oxidants, arsenite and pathogen-generated reactive oxygen species. Loss of gcs-1 sensitises
  animals to arsenite and arsenate, a defect rescued by exogenous glutathione, and glutathione
  made by GCS-1 also supports disulfide reduction of cuticle components during molting.'
