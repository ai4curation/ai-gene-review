    - rubric: specificity
      score: 3
    overall_notes: Correct domain description and UNC-84 dependent localization; short.
- source: Alliance_Automated
  text: Predicted to enable actin binding activity and kinesin binding activity. Involved
    in cytoskeleton organization; nucleus organization; and pronuclear migration.
    Located in nuclear outer membrane and perinuclear region of cytoplasm. Is expressed
    in several structures, including body wall musculature; intestinal cell; and vulval
    muscle. Used to study Emery-Dreifuss muscular dystrophy. Human ortholog(s) of
    this gene implicated in arthrogryposis multiplex congenita (multiple); bipolar
    disorder; cerebellar ataxia (multiple); and muscular dystrophy (multiple). Orthologous
    to several human genes including SYNE1 (spectrin repeat containing nuclear envelope
    protein 1).
  source_type: automated
