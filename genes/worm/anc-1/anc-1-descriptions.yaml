descriptions:
- source: UniProt
  text: Plays a central role in nuclear and mitochondrial anchoring (PubMed:10375507,
    PubMed:12169658, PubMed:22298703, PubMed:6889924). Probably connects nuclei to
    the cytoskeleton by interacting with unc-84 at the nuclear envelope and with F-actin
    in the cytoplasm, creating a bridge across the nuclear envelope between the cytoskeleton
    and the nucleus (PubMed:15773756). Has a role in positioning of the cell body
    of the PVQ lumbar interneuron (PubMed:22298703).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q9N4M4
  source_id: Q9N4M4
