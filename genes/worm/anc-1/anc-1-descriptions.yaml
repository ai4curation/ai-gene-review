gene_symbol: anc-1
organism: worm
uniprot_id: Q9N4M4
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Plays a central role in nuclear and mitochondrial anchoring (PubMed:10375507,
    PubMed:12169658, PubMed:22298703, PubMed:6889924). Probably connects nuclei to
    the cytoskeleton by interacting with unc-84 at the nuclear envelope and with F-actin
    in the cytoplasm, creating a bridge across the nuclear envelope between the cytoskeleton
    and the nucleus (PubMed:15773756). Has a role in positioning of the cell body
    of the PVQ lumbar interneuron (PubMed:22298703).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q9N4M4
  source_id: Q9N4M4
- source: Alliance_Imported
  text: anc-1 encodes a protein, orthologous to Drosophila MSP 300 and mammalian SYNE1
    and SYNE2 proteins; ANC-1 has coiled regions, a nuclear envelope localization
    domain (the KASH domain) and an actin-binding domain; ANC-1 affects the positioning
    of nuclei and mitochondria within the cytoskeleton; ANC-1 is expressed in the
    cytoplasm, but is localized to the nuclear periphery in an UNC-84 dependent manner.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00000140;class=Gene
  source_id: WB:WBGene00000140
- source: Alliance_Automated
  text: Predicted to enable actin binding activity and kinesin binding activity. Involved
    in cytoskeleton organization; nucleus organization; and pronuclear migration.
    Located in nuclear outer membrane and perinuclear region of cytoplasm. Is expressed
    in several structures, including body wall musculature; intestinal cell; and vulval
    muscle. Used to study Emery-Dreifuss muscular dystrophy. Human ortholog(s) of
    this gene implicated in arthrogryposis multiplex congenita (multiple); bipolar
    disorder; cerebellar ataxia (multiple); and muscular dystrophy (multiple). Orthologous
    to several human genes including SYNE1 (spectrin repeat containing nuclear envelope
    protein 1).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00000140;class=Gene
  source_id: WB:WBGene00000140
