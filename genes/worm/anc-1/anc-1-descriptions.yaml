    overall_notes: Correct nuclear and mitochondrial anchoring through UNC-84 and
      actin; the review notes the LINC bridge accounts for only part of anchorage,
      which UniProt does not say.
- source: Alliance_Imported
  text: anc-1 encodes a protein, orthologous to Drosophila MSP 300 and mammalian SYNE1
    and SYNE2 proteins; ANC-1 has coiled regions, a nuclear envelope localization
    domain (the KASH domain) and an actin-binding domain; ANC-1 affects the positioning
    of nuclei and mitochondria within the cytoskeleton; ANC-1 is expressed in the
    cytoplasm, but is localized to the nuclear periphery in an UNC-84 dependent manner.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00000140;class=Gene
  source_id: WB:WBGene00000140
