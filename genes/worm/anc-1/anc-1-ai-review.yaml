  review:
    summary: Kinesin binding, PAINT inference whose only experimental donor is Drosophila Klarsicht.
    action: MARK_AS_OVER_ANNOTATED
    reason: The Klarsicht evidence is coimmunoprecipitation of kinesin heavy chain with non-KASH Klar
      isoforms from ovary lysates, in the context of oskar mRNA transport. ANC-1 has no reported interaction
      with kinesin, and its known functions are static anchorage of nuclei and organelles, in which microtubule
      motors play no demonstrated part (microtubules are largely normal in anc-1 nulls). In C. elegans,
      kinesin-1 is coupled to nuclei by the unrelated KASH protein UNC-83. Without target-side evidence,
      the single-donor transfer to a protein specialised for anchorage is likely an over-annotation.
    supported_by:
    - reference_id: PMID:25049271
      supporting_text: No Klar coprecipitation with Khc was observed in two klar alleles (klarB and klarYG3)
        lacking α and β isoforms.
