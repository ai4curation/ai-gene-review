core_functions:
- description: Membrane-anchored cytoplasmic scaffold that holds nuclei, the ER and mitochondria in place
    in the hypodermal syncytium, mainly through its central spectrin-like repeats and C-terminal membrane
    anchor (the cytoplasmic integrity model).
  directly_involved_in:
  - id: GO:0051647
    label: nucleus localization
  - id: GO:0051646
    label: mitochondrion localization
  - id: GO:0051643
    label: endoplasmic reticulum localization
  locations:
  - id: GO:0005789
    label: endoplasmic reticulum membrane
  - id: GO:0005737
    label: cytoplasm
  supported_by:
  - reference_id: PMID:33860766
    supporting_text: The data presented here support a cytoplasmic integrity model where ANC-1 localizes
      to the ER membrane and extends into the cytoplasm to position nuclei, ER, mitochondria, and other
      organelles in place.
  - reference_id: PMID:33860766
    supporting_text: Together, these results suggest that the SUN/KASH interaction only partially contributes
      to nuclear anchorage, implicating the large cytoplasmic domain of ANC-1 as the major player in nuclear
      positioning.
- description: 'KASH partner of UNC-84 in a nuclear-anchorage LINC complex: UNC-84 recruits ANC-1 to the
    outer nuclear membrane, contributing part of hyp7 nuclear anchorage, a contribution that depends on
    the conserved SUN-KASH cysteines.'
  molecular_function:
    id: GO:0140444
    label: cytoskeleton-nuclear membrane anchor activity
  directly_involved_in:
  - id: GO:0051647
    label: nucleus localization
  locations:
  - id: GO:0005640
    label: nuclear outer membrane
  supported_by:
  - reference_id: PMID:12169658
    supporting_text: Thus, ANC-1 may connect nuclei to the cytoskeleton by interacting with UNC-84 at
      the nuclear envelope and with actin in the cytoplasm.
  - reference_id: PMID:30245107
    supporting_text: Mutations of conserved cysteines in SUN or KASH disrupted ANC-1-dependent nuclear
      anchorage in C. elegans
  - reference_id: PMID:33860766
    supporting_text: Two independent anc-1(ΔKASH) mutants exhibited mild nuclear anchorage defects similar
      to those observed in unc-84(null) mutants
suggested_questions:
- question: Which molecular function best describes ANC-1's LINC-independent anchoring by its spectrin-like
    repeats? No current GO MF term captures a membrane-anchored scaffold that stiffens the cytoplasm;
    should one be requested?
  experts:
  - GO molecular function editors
  - nuclear positioning biologists
- question: Is the PANTHER IBA for kinesin binding (node PTN002726706, seeded by Drosophila Klarsicht)
    appropriate for the whole KASH family node including ANC-1 and Msp300, or should it be restricted
    to Klarsicht?
  experts:
  - PANTHER/PAINT curators
suggested_experiments:
- description: Identify binding partners of the ANC-1 spectrin-like repeats (proximity labelling in hyp7)
    and test whether they connect ANC-1 to microtubules, intermediate filaments or other organelles.
  hypothesis: ANC-1 repeats anchor organelles by binding a cytoplasmic network rather than through actin
    binding.
  experiment_type: proximity labelling proteomics
