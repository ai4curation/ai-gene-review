  review:
    summary: Actin binding by the N-terminal CH domains of ANC-1.
    action: KEEP_AS_NON_CORE
    reason: ANC-1 has a conserved alpha-actinin-type tandem CH domain, and its CH domains bind actin filaments
      in vitro and colocalize with actin structures in vivo, so the activity is sound. However, CRISPR
      deletion of the CH domains does not disrupt hyp7 nuclear anchorage, and the shorter ANC-1b isoform
      that lacks them is the main hypodermal isoform. Actin binding is therefore not the core anchoring
      mechanism in the best-studied context.
