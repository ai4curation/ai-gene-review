gene_symbol: anc-1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: 'ANC-1 (nuclear anchorage defective 1) is the C. elegans ortholog of the giant nesprins nesprin-1
  and nesprin-2. Its longest isoforms (up to 8,545 residues) have N-terminal tandem calponin-homology
  (CH) actin-binding domains, a very long central region of six nearly identical ~903-residue spectrin-like
  repeats, and a C-terminal transmembrane span with a KASH domain. ANC-1 is membrane-anchored in the endoplasmic
  reticulum and the continuous outer nuclear membrane, where its KASH domain binds the SUN protein UNC-84,
  and it extends through the cytoplasm of the hypodermal syncytium and other cells. ANC-1 holds nuclei,
  mitochondria, the ER and lipid droplets in place: in anc-1 null mutants nuclei float freely and cluster,
  and other organelles drift through the cytoplasm. The canonical LINC bridge (KASH-UNC-84 plus CH-actin)
  contributes only part of this anchorage; the central repeats together with the membrane anchor provide
  most of it, which supports a model in which ANC-1 maintains the mechanical integrity of the cytoplasm.
  Shorter isoforms lacking the CH domains are sufficient for hypodermal nuclear anchorage, whereas longer
  isoforms position mitochondria in touch neurons. ANC-1 also makes a minor contribution to male pronuclear
  migration in the zygote.'
