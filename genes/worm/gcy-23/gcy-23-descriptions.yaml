    overall_notes: 'Correct but generic: cGMP and AFD thermotaxis.'
- source: Alliance_Imported
  text: gcy-23 encodes a receptor-type guanylyl cyclase that, along with gcy-8 and
    gcy-18, constitutes a subfamily of guanylyl cyclase genes in C. elegans; gcy-23
    functions redundantly with gcy-8 and gcy-18, and upstream of tax-4, to regulate
    thermotaxis via the AFD thermosensory neurons, although of the three guanylyl
    cyclases required, genetic analyses suggest that GCY-18 is the primary guanylyl
    cyclase required; in addition, loss of gcy-23 activity via RNAi results in lifespan
    extension; GCY-23 is expressed exclusively in the AFD thermosensory neurons, where
    it localizes to sensory endings.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00001548;class=Gene
