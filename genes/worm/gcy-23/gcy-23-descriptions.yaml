gene_symbol: gcy-23
organism: worm
uniprot_id: G5EEE9
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Guanylate cyclase involved in the production of the second messenger cGMP
    (By similarity). Regulates thermotaxis responses in AFD sensory neurons. May regulate
    AFD neuronal activity such as calcium responses to temperature gradients (PubMed:16415369).
  source_type: curated
  url: https://www.uniprot.org/uniprot/G5EEE9
  source_id: G5EEE9
- source: Alliance_Imported
  text: gcy-23 encodes a receptor-type guanylyl cyclase that, along with gcy-8 and
    gcy-18, constitutes a subfamily of guanylyl cyclase genes in C. elegans; gcy-23
    functions redundantly with gcy-8 and gcy-18, and upstream of tax-4, to regulate
    thermotaxis via the AFD thermosensory neurons, although of the three guanylyl
    cyclases required, genetic analyses suggest that GCY-18 is the primary guanylyl
    cyclase required; in addition, loss of gcy-23 activity via RNAi results in lifespan
    extension; GCY-23 is expressed exclusively in the AFD thermosensory neurons, where
    it localizes to sensory endings.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00001548;class=Gene
  source_id: WB:WBGene00001548
- source: Alliance_Automated
  text: Predicted to enable guanylate cyclase activity and peptide receptor activity.
    Involved in detection of temperature stimulus; thermosensory behavior; and thermotaxis.
    Located in neuron projection terminus. Is expressed in AFDL and AFDR.
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00001548;class=Gene
  source_id: WB:WBGene00001548
