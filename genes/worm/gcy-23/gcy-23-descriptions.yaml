- source: UniProt
  text: Guanylate cyclase involved in the production of the second messenger cGMP
    (By similarity). Regulates thermotaxis responses in AFD sensory neurons. May regulate
    AFD neuronal activity such as calcium responses to temperature gradients (PubMed:16415369).
  source_type: curated
