gene_symbol: gcy-23
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: >-
  gcy-23 encodes a receptor-type (transmembrane) guanylate cyclase expressed exclusively in the AFD thermosensory
  neurons of C. elegans. With GCY-8, GCY-18 and GCY-23 it forms an AFD-specific subfamily; each has an
  extracellular domain with little similarity to mammalian receptor guanylyl cyclases, a single transmembrane
  helix, an intracellular kinase-homology domain predicted to be catalytically inactive, and a C-terminal
  guanylate cyclase domain that converts GTP to cGMP. GCY-23 is concentrated at the AFD sensory ending
  (the microvillar receptive ending). The three AFD cyclases act partly redundantly to supply the cGMP
  that opens the TAX-2/TAX-4 cyclic nucleotide-gated channel in response to warming; triple mutants are
  athermotactic and lack temperature-evoked AFD currents. GCY-23 makes a smaller, modulatory contribution:
  gcy-23 single mutants retain isothermal tracking and normal AFD temperature responses but track in an
  altered temperature range, and GCY-23 alone can partially restore thermotaxis to triple mutants.
