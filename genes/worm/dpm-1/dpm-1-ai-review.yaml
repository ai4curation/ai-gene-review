core_functions: []
suggested_questions:
- question: Is the Y66H1A.2b transcript translated into a stable 51-residue product in vivo, and, if
    it is, does the C-terminal tail interact with DPM-1 partner subunits or with the full-length enzyme?
- question: Should InterPro2GO transfer of catalytic terms require minimum coverage of the catalytic
    domain, so that C-terminal isoform fragments such as U4PF58 do not inherit full-length enzyme activity?
suggested_experiments:
- description: Look for the Y66H1A.2b product in worm lysates, using tagged endogenous dpm-1 isoform
    b or targeted proteomics of peptides unique to its N-terminal junction. Then test whether it
    co-purifies with full-length DPM-1 or with partner subunits.
  experiment_type: proteomics / co-immunoprecipitation
