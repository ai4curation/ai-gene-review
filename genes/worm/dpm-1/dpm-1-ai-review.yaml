  title: Gene Ontology annotation through association of InterPro records with GO terms
  findings: []
- id: PMID:10835346
  title: Human dolichol-phosphate-mannose synthase consists of three subunits, DPM1, DPM2 and DPM3.
  full_text_unavailable: true
  findings:
  - statement: Mammalian DPM synthase is a three-subunit complex in which DPM1 is the catalytic
      subunit and DPM2/DPM3 are regulatory/stabilizing subunits; Dol-P-Man is the mannosyl donor
      for GPI anchors, N-glycans and protein O- and C-mannosylation.
    supporting_text: mammalian DPM synthase contains catalytic DPM1 and regulatory DPM2
      subunits
  - statement: DPM3 stabilizes DPM1 (the abstract places the association on DPM3's C-terminal
      domain; it does not map a DPM1 region, so it does not show that the DPM1 C-terminal tail
      alone binds DPM3).
    supporting_text: DPM2 stabilizes DPM3 and DPM3 stabilizes DPM1
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only cache checked; primary mammalian study on DPM synthase subunit
      architecture. Background for the catalytic role of full-length DPM1; says nothing about the
      worm short product.
- id: file:worm/dpm-1/dpm-1-bioinformatics/RESULTS.md
  title: U4PF58 mapped onto full-length C. elegans DPM-1 and human DPM1
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Reproducible pairwise alignments regenerated from UniProt downloads in this
      review; show U4PF58 = Q9TYJ7 residues 189-239, outside the glycosyltransferase domain, with no
      DXD motif.
core_functions: []
suggested_questions:
- question: Is the Y66H1A.2b transcript (encoding only the last 51 residues of DPM-1) supported by
    full-length cDNA or ribosome profiling evidence, or is it a gene-model artefact that should be
    retired in favour of Y66H1A.2a?
- question: Does the C-terminal region of full-length DPM-1 (residues 189-239) mediate interaction with
    worm DPM2/DPM3 homologs or ER membrane anchoring, as the accessory subunits do for mammalian
    DPM1?
suggested_experiments:
- description: Tag the endogenous dpm-1 locus and test by western blot or targeted proteomics whether
    a ~6 kDa Y66H1A.2b product is detectable alongside the full-length protein.
