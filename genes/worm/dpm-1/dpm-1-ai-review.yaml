id: U4PF58
gene_symbol: dpm-1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: The selected Caenorhabditis elegans dpm-1 product is a 51-residue polypeptide corresponding
  to the extreme C terminus of the longer dolichol-phosphate mannosyltransferase protein. It lacks the
  glycosyltransferase domain required for dolichol-phosphate mannose synthesis. Stable expression, localization
  and any noncatalytic role of this short product are unknown.
