id: U4PF58
gene_symbol: dpm-1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: >-
  U4PF58 is the 51-residue product of the short Caenorhabditis elegans dpm-1
  transcript Y66H1A.2b. Its sequence is identical to the last 51 residues
  (189-239) of the 239-residue canonical dpm-1 product Q9TYJ7 (Y66H1A.2a), the
  worm member of the DPM1 subfamily (PANTHER PTHR43398:SF1) that also contains
  the characterised human and yeast dolichol-phosphate mannose synthases. The
  short product lacks the whole glycosyltransferase 2-like (GT-A) domain
  (canonical residues 8-176) that carries most of the GDP-mannose and metal
  binding residues, and keeps only the C-terminal tail, which corresponds to the
  end of human DPM1 (residues 211-260) and includes two residues that line the
  GDP-mannose site. On its own it cannot form the catalytic site, so the
  dolichol-phosphate mannose synthase activity of the dpm-1 gene is attributed
  to the full-length isoform. Whether the short product is stably translated,
  where it localises and whether it has any noncatalytic role, for instance in
  partner binding, is unknown.
existing_annotations:
- term:
    id: GO:0004582
    label: dolichyl-phosphate beta-D-mannosyltransferase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR039528
  review:
    summary: >-
      InterPro2GO transfer of Dol-P-Man synthase activity from the DPM1-like
      family signature (IPR039528) to the 51-residue Y66H1A.2b product. The
      activity is right for the dpm-1 gene, whose full-length product Q9TYJ7
      sits in the DPM1 subfamily PTHR43398:SF1 with human DPM1 and yeast Dpm1.
      It is not right for this product, which lacks the catalytic domain.
    action: REMOVE
    reason: >-
      The catalytic activity of DPM1-family synthases lives in the GT-A
      glycosyltransferase fold. In the canonical worm product Q9TYJ7 this
      domain spans residues 8-176. U4PF58 is identical to canonical residues
      189-239 only, so none of that domain is present. Mapped onto human DPM1
      (64.7% identity to Q9TYJ7 over 238 aligned columns), the segment covers
      residues 211-260. It contains 2 of the 13 GDP-mannose binding residues
      annotated by similarity to the archaeal synthase structure, and none of
      the other 11 GDP-mannose binding residues (human positions 32-147), nor
      the Mg2+/Mn2+ binding residue at human position 120. In mammals the catalytic subunit also has to be
      tethered and stabilised by DPM3. An isolated C-terminal tail without the
      fold cannot catalyse the transfer from GDP-mannose to dolichyl
      phosphate. No worm-specific experiment on either dpm-1 product was
      found. The family signature matched on sequence identity to the
      gene's tail, not on a retained catalytic domain, so the electronic
      mapping fails for this product. This REMOVE concerns only the U4PF58
      product. The same term is expected and appropriate for the full-length
      product Q9TYJ7, as noted in the source_defects entry.
    supported_by:
    - reference_id: file:worm/dpm-1/dpm-1-bioinformatics/RESULTS-rereview.md
      supporting_text: 'U4PF58 is an exact substring of Q9TYJ7: canonical residues 189-239 of 239 (51 residues, 100% identity).'
    - reference_id: file:worm/dpm-1/dpm-1-bioinformatics/RESULTS-rereview.md
      supporting_text: '| Domain | Glycosyltransferase 2-like | 8 | 176 | no |'
    - reference_id: file:worm/dpm-1/dpm-1-bioinformatics/RESULTS-rereview.md
      supporting_text: Canonical residues 189-239 align to human DPM1 residues 211-260 (50 aligned columns).
    - reference_id: file:worm/dpm-1/dpm-1-bioinformatics/RESULTS-rereview.md
      supporting_text: Human DPM1 carries 13 annotated binding-site residues in total.
    - reference_id: file:worm/dpm-1/dpm-1-bioinformatics/RESULTS.md
      supporting_text: '| Domain: Glycosyltransferase 2-like | 8–176 | 0 / 169 | 0 |'
    - reference_id: PMID:10835346
      supporting_text: mammalian DPM synthase contains catalytic DPM1 and regulatory DPM2
    - reference_id: PMID:16280320
      supporting_text: A coiled-coil domain near the C terminus of DPM3 was important for tethering DPM1, the catalytic subunit of the enzyme, to the endoplasmic reticulum membrane
    - reference_id: file:worm/dpm-1/dpm-1-deep-research-falcon.md
      supporting_text: In particular, no purified-enzyme assay, mutant rescue, endogenous localization experiment, or pathway-resolved glycomic analysis was found for this exact worm protein.
    source_defects:
    - defect_type: WRONG_GENE_PRODUCT
      resource: GOA_EBI
      slot: DB_Object_ID
      requested_change: REPOINT
      asserted_value: UniProtKB:U4PF58
      corrected_value: UniProtKB:Q9TYJ7
      corrected_label: dpm-1 full-length product (WormBase Y66H1A.2a, 239 aa)
      cause: SEQUENCE_MISMAPPING
      confidence: PROBABLE
      explanation: >-
        The InterPro2GO row assigns GO:0004582 to U4PF58 because the
        DPM1-like signature IPR039528 (PANTHER PTHR43398) matched this
        51-residue dpm-1 isoform b product. U4PF58 is identical to residues
        189-239 of the full-length product Q9TYJ7 and lacks the
        glycosyltransferase 2-like domain (residues 8-176). The catalytic
        term belongs on the full-length product. A minimum-coverage
        requirement on the catalytic domain before InterPro2GO transfer would
        keep it off C-terminal fragments.
      supported_by:
      - reference_id: file:worm/dpm-1/dpm-1-bioinformatics/RESULTS-rereview.md
        supporting_text: '| Domain | Glycosyltransferase 2-like | 8 | 176 | no |'
