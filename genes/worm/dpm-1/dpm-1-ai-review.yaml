id: U4PF58
gene_symbol: dpm-1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: >-
  U4PF58 is the 51-residue product of the Caenorhabditis elegans dpm-1 gene model Y66H1A.2b. Its
  sequence is identical to the last 51 residues (189-239) of the 239-residue full-length DPM-1
  protein (Q9TYJ7, Y66H1A.2a), the worm member of the DPM1 subfamily (PANTHER PTHR43398:SF1) of
  GT2-family glycosyltransferases that make dolichol-phosphate mannose from GDP-mannose and
  dolichol phosphate on the cytosolic face of the endoplasmic reticulum. The short product contains
  none of the glycosyltransferase 2-like domain (residues 8-176 of the full-length protein),
  including its DXD metal and nucleotide-sugar binding motif, so it cannot carry out the
  dolichol-phosphate mannose synthase reaction on its own. Whether this product is translated,
  stable or has any role is unknown; the catalytic function of the dpm-1 locus belongs to the
  full-length Y66H1A.2a product.
existing_annotations:
- term:
    id: GO:0004582
    label: dolichyl-phosphate beta-D-mannosyltransferase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR039528
  review:
    summary: >-
      InterPro2GO transfer of the DPM1 catalytic activity from the DPM1-like signature IPR039528.
      The activity is correct for the full-length dpm-1 product Q9TYJ7, which is a DPM1-subfamily
      (PTHR43398:SF1) member with 64.7% identity to human DPM1 over the aligned length and an intact
      glycosyltransferase 2-like domain with its DXD motif. U4PF58, however, is only residues 189-239
      of that protein and contains none of the catalytic domain and no DXD motif.
    action: REMOVE
    reason: >-
      An enzymatic activity cannot be assigned to a gene product that lacks the catalytic domain. The
      51-residue Y66H1A.2b product maps entirely C-terminal to the glycosyltransferase 2-like domain
      (0 of 169 domain residues present) and has no DXD-type motif, whereas the full-length worm
      protein and human DPM1 both retain one. In mammals DPM1 is the catalytic subunit of the
      DPM synthase complex; the catalytic site is in the GT-A domain that U4PF58 lacks. This is an
      electronic mapping that is demonstrably inapplicable to this specific product, not a rejection
      of DPM1 activity for the dpm-1 locus, which should be annotated on Q9TYJ7.
    supported_by:
    - reference_id: file:worm/dpm-1/dpm-1-bioinformatics/RESULTS.md
      supporting_text: '| 189–239 | 1–51 | 51 |'
    - reference_id: file:worm/dpm-1/dpm-1-bioinformatics/RESULTS.md
      supporting_text: '| Domain: Glycosyltransferase 2-like | 8–176 | 0 / 169 |'
    - reference_id: file:worm/dpm-1/dpm-1-bioinformatics/RESULTS.md
      supporting_text: '- U4PF58: []'
