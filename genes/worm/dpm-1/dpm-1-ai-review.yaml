- id: file:worm/dpm-1/dpm-1-deep-research-falcon.md
  title: Falcon deep research on dpm-1
  findings:
  - statement: No worm-specific biochemical, genetic or localisation study of the dpm-1 products was
      found; function rests on family membership.
    supporting_text: In particular, no purified-enzyme assay, mutant rescue, endogenous localization experiment, or pathway-resolved glycomic analysis was found for this exact worm protein.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Automated literature synthesis. It does not notice that U4PF58 is a 51-residue C-terminal
      isoform and treats it as the full enzyme, so it is used only for its negative literature finding.
- id: file:worm/dpm-1/dpm-1-deep-research-wormbase.md
  title: WormBase gene description for dpm-1 (worm)
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: The text describes the dpm-1 gene, not a specific product. Its claims (putative
      catalytic subunit of dolichol-phosphate mannosyltransferase, orthology to yeast and human
      DPM1, embryonic lethality and cortical motion defects in mass RNAi) are correct at gene
      level and apply to the full-length product Q9TYJ7. The Alliance gene record links the
      gene to U4PF58, the 51-residue isoform b product that lacks the GT-A catalytic domain, so
      descriptions built on that link appear to give the synthase activity to the fragment. That
      mapping problem is recorded on the GO:0004582 annotation row, not on this text. The RNAi
      phenotypes are peripheral and are not annotated here.
