- id: PMID:10835346
  title: Human dolichol-phosphate-mannose synthase consists of three subunits, DPM1, DPM2 and DPM3.
  findings:
  - statement: The primary mammalian complex study distinguishes catalytic DPM1 from regulatory subunits;
      it does not demonstrate activity of the short worm product.
    supporting_text: mammalian DPM synthase contains catalytic DPM1 and regulatory DPM2
  - statement: DPM3 binds DPM1 and stabilises it, so the catalytic subunit relies on partner subunits
      in the mammalian complex.
    supporting_text: DPM3 directly stabilized DPM1
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary report on human DPM synthase; quotes checked against the cached abstract. Provides
      the catalytic-subunit role of full-length DPM1 that the worm canonical product inherits through PTHR43398:SF1;
      it does not test the worm short isoform.
- id: PMID:16280320
  title: DPM1, the catalytic subunit of dolichol-phosphate mannose synthase, is tethered to and stabilized
    on the endoplasmic reticulum membrane by DPM3.
  findings:
  - statement: Mammalian DPM1 is the catalytic subunit and depends on DPM3 for ER-membrane tethering,
      stability and activity.
    supporting_text: DPM1 was rapidly degraded by the proteasome in the absence of DPM3.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Checked against the cached abstract. Comparative evidence on the full-length catalytic
