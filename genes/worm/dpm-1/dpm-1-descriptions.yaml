descriptions:
- source: Alliance_Imported
  text: dpm-1 encodes a putative catalytic subunit of dolichol phosphate mannosyltransferase,
    orthologous to budding yeast and human DPM1 (OMIM:603503, mutated in congenital
    disorder of glycosylation type Ie); in mass RNAi assays, DPM-1 is required for
    embryonic viability and proper cortical motion in the early embryo.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00022044;class=Gene
  source_id: WB:WBGene00022044
- source: Alliance_Automated
  text: Predicted to enable dolichyl-phosphate beta-D-mannosyltransferase activity.
    Predicted to be involved in dolichol-linked oligosaccharide biosynthetic process.
    Predicted to be located in endoplasmic reticulum. Predicted to be active in endoplasmic
    reticulum membrane. Human ortholog(s) of this gene implicated in congenital disorder
    of glycosylation Ie. Orthologous to human DPM1 (dolichyl-phosphate mannosyltransferase
    subunit 1, catalytic).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00022044;class=Gene
  source_id: WB:WBGene00022044
- source: RefSeq
  text: Predicted to enable dolichyl-phosphate beta-D-mannosyltransferase activity.
    Predicted to be involved in GPI anchor biosynthetic process; dolichol-linked oligosaccharide
    biosynthetic process; and protein O-linked glycosylation via mannose. Predicted
    to be located in endoplasmic reticulum. Predicted to be active in endoplasmic
    reticulum membrane. Human ortholog(s) of this gene implicated in congenital disorder
    of glycosylation Ie. Orthologous to human DPM1 (dolichyl-phosphate mannosyltransferase
    subunit 1, catalytic). [provided by Alliance of Genome Resources, Jun 2026]
