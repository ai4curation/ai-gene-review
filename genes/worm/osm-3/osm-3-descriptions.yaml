gene_symbol: osm-3
organism: worm
uniprot_id: P46873
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Kinesin motor protein which is required for the anterograde intraflagellar
    transport (IFT) along the middle segment of the sensory neuron cilia together
    with the kinesin II motor complex (composed of klp-11, klp-20 and kap-1) and on
    its own, is required for IFT along the distal segment (PubMed:17000880, PubMed:17420466).
    In addition, regulates the length of cilia (PubMed:17420466). May have a role
    during neurogenesis and axonal transport (PubMed:7690265, PubMed:7714894).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P46873
  source_id: P46873
- source: Alliance_Imported
  text: osm-3 encodes a kinesin-2 family member that forms a homodimeric kinesin motor
    protein; OSM-3, in conjunction with the heterotrimeric kinesin-II composed of
    KLP-20, KLP-11, and KAP-1, is required for intraflagellar transport (IFT) along
    the middle segment of the cilia and on its own, is required for IFT along the
    distal segment; OSM-3 is thus also required for formation of the distal segment
    of amphid channel cilia, responses to osmotic stimuli, dauer formation, and sensitivity
    to caffeine;  OSM-3 is intensely localized in the ciliated endings of amphid,
    inner labial, and phasmid chemosensory neurons and shows a punctate localization
    pattern in the corresponding cell bodies and dendrites.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00003884;class=Gene
  source_id: WB:WBGene00003884
- source: Alliance_Automated
  text: Enables plus-end-directed microtubule motor activity. Involved in several
    processes, including cilium organization; dauer entry; and regulation of non-motile
    cilium assembly. Located in several cellular components, including ciliary basal
    body; neuronal cell body; and perinuclear region of cytoplasm. Part of kinesin
    complex. Is expressed in ciliated neurons. Orthologous to human KIF17 (kinesin
    family member 17).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00003884;class=Gene
  source_id: WB:WBGene00003884
