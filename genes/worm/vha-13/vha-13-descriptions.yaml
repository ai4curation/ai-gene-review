  text: Predicted to enable ATP binding activity and ATP hydrolysis activity. Predicted
    to contribute to proton-transporting ATPase activity, rotational mechanism. Involved
    in lysosomal lumen acidification. Predicted to be part of vacuolar proton-transporting
    V-type ATPase, V1 domain. Predicted to be active in lysosomal membrane. Is expressed
    in body wall musculature; excretory cell; head; and intestine. Human ortholog(s)
    of this gene implicated in autosomal recessive cutis laxa type IID and developmental
    and epileptic encephalopathy 93. Orthologous to human ATP6V1A (ATPase H+ transporting
    V1 subunit A).
