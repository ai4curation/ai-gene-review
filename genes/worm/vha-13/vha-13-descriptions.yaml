- source: Alliance_Imported
  text: vha-13 encodes an ortholog of subunit A of the cytoplasmic (V1) domainof vacuolar
    proton-translocating ATPase (V-ATPase); VHA-13 is predictedto hydrolyse ATP as
    part of a cytosolic VHA-12/VHA-13 heterohexamer,whose activity drives the V-ATPase
    rotor; VHA-13 levels are lowered inmutants with either abnormally low or abnormally
    high calcineurinlevels, and elevated in mutants lacking both calcineurin andcalreticulin;
    VHA-13 is dispensable for alae formation, like the V1subunit VHA-8, but not like
    the V0 subunits VHA-1 and VHA-4.
