descriptions:
- source: UniProt
  text: Catalytic subunit of the V1 complex of vacuolar(H+)-ATPase (V-ATPase), a multisubunit
    enzyme composed of a peripheral complex (V1) that hydrolyzes ATP and a membrane
    integral complex (V0) that translocates protons (By similarity). V-ATPase is responsible
    for acidifying and maintaining the pH of intracellular compartments and in some
    cell types, is targeted to the plasma membrane, where it is responsible for acidifying
    the extracellular environment (By similarity). Required along with other vacuolar
    ATPase components for the removal of protein aggregates which form in immature
    oocytes in the distal gonad (PubMed:29168500). This removal occurs as the oocytes
    mature and move to the proximal gonad, is triggered by the introduction of sperm
    through mating and occurs before fertilization (PubMed:29168500). The introduction
    of sperm triggers V-ATPase accumulation in proximal oocytes and induces lysosomal
    acidification which leads to engulfing of protein aggregates by lysosomes and
    subsequent clearance of the aggregates (PubMed:29168500). Lysosomal acidification
    also leads to changes in mitochondrial morphology and function (PubMed:29168500).
    Mitochondria in distal immature oocytes are fragmented, produce high levels of
    reactive oxygen species (ROS) and have high membrane potential, indicative of
    metabolic inactivity (PubMed:29168500). In contrast, mitochondria in proximal
    mature oocytes are tubular with lower ROS levels and membrane potential, indicative
    of an active metabolic state required for aggregate mobilization before clearance
    (PubMed:29168500). Involved in receptor-mediated endocytosis (PubMed:16785323).
