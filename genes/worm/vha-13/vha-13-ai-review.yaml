suggested_questions:
- question: Is VHA-13 the catalytic subunit of the neuronal V-ATPase that acidifies
    synaptic vesicles in C. elegans, and does neuronal vha-13 depletion reduce
    neurotransmitter loading?
suggested_experiments:
- description: Neuron-specific degradation of VHA-13 (auxin-inducible degron) with
    measurement of synaptic vesicle pH and evoked neurotransmitter release at the
    neuromuscular junction.
