  label: Caenorhabditis elegans
description: VHA-13 is the catalytic subunit A of the cytosolic V1 sector of the
  vacuolar-type H+-ATPase (V-ATPase) of Caenorhabditis elegans, the orthologue of
  human ATP6V1A and yeast Vma1. Three A subunits alternate with three B subunits in
  the V1 hexamer, and ATP is hydrolysed at the A-B interface; the released energy
  drives rotation of the central stalk and proton translocation through the
  membrane-embedded V0 sector, so that the holoenzyme pumps protons into the lumen
  of endosomes, lysosomes, synaptic vesicles and other acidic compartments. In the
  germline, VHA-13 accumulates on lysosomes of maturing proximal oocytes in a
  sperm-dependent manner (its mRNA is translationally repressed distally by GLD-1),
  where the V-ATPase acidifies lysosomes that engulf and clear protein aggregates
  and thereby supports a metabolic and proteostatic reset before fertilization.
