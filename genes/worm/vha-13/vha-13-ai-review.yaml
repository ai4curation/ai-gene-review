  review:
    summary: ATP is consumed by the V-ATPase, but ATP hydrolysis here is the
      energy source for proton pumping rather than a contribution to ATP
      metabolism as such.
    action: MARK_AS_OVER_ANNOTATED
    reason: Technically true but uninformative; the InterPro family covers both
      F-type ATP synthases (which do participate in ATP metabolism) and V-type
      ATPases. The proton transport terms capture the actual biological role. Same
      decision as taken for human ATP6V1A.
