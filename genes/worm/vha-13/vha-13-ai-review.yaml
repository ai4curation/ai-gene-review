  findings:
  - statement: vha-13 encodes a catalytic subunit of the lysosomal V-ATPase and was
      identified in an RNAi screen as required for clearance of protein aggregates
      from oocytes.
    supporting_text: This gene, vha-13, encodes a catalytic subunit of the V-ATPase,
      a lysosomal proton pump
  - statement: Knockdown of other V-ATPase subunits phenocopies vha-13 RNAi,
      showing the phenotype reflects loss of the holoenzyme.
    supporting_text: Knockdown of other V-ATPase subunits produced similar
      protein-aggregation phenotypes
  - statement: Acidic lysosomes accumulate in maturing proximal oocytes in a
      V-ATPase-dependent manner.
    supporting_text: hermaphrodite, but not female, germlines exhibited acidic
      lysosomes (Fig. 2d, e; Extended Data Fig. 4a) that accumulated specifically in
      maturing, proximal oocytes in a V-ATPase-dependent manner
  - statement: GFP::VHA-13 is expressed in proximal but not distal germ cells and
      co-localizes with LMP-1-positive lysosomes.
    supporting_text: GFP-tagged VHA-13 was present in proximal, but not distal, germ
      cells
  - statement: V-ATPase puncta co-localize with lysosomes.
    supporting_text: As V-ATPase puncta developed, they co-localized with
      LMP-1::GFP-positive vesicles
  - statement: Sperm trigger V-ATPase accumulation and lysosome acidification in
      proximal oocytes.
    supporting_text: we conclude that sperm trigger V-ATPase accumulation in proximal
      oocytes, thereby inducing lysosome acidification
  - statement: V-ATPase activity is required for the sperm-dependent shift of
      oocyte mitochondria to a tubular, low-ROS state.
    supporting_text: The shift to a tubular, low-ROS state required sperm and
      V-ATPase activity
