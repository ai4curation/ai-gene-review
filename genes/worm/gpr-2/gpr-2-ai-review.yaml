- id: file:worm/gpr-2/gpr-2-deep-research-wormbase.md
  title: WormBase gene description for gpr-2 (worm)
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: DISPUTED
    review_notes: WormBase curated description (uncited, undated). Checked claims. The complex with
      GPR-1 and LIN-5, LIN-5-dependent cortical and aster localization, MES-1/SRC-1 control of
      localization at the P2-EMS contact, GOA-1 signalling and action downstream of PAR-3 in spindle
      positioning agree with the literature cited in this review. Wrong - the GoLoco/GPR motif is
      described as "characteristic of guanine nucleotide exchange factors"; GoLoco motifs are GDP
      dissociation inhibitors, and GPR-1/2 is a GDI for GOA-1 and GPA-16 (PMID:12814548, PMID:16162648).
      Unverified - a role in "germ-line development". No cached paper, GOA row or PubMed hit for gpr-1/2
      germline studies supports a germline developmental role (the hits concern spindle positioning
      and engineered gpr-1 overexpression used to separate parental genomes), so the review was not
      changed.
    source_defects:
    - defect_type: WRONG_STATEMENT
      resource: WORMBASE
      record: WB:WBGene00001689
      slot: MOD_provided_gene_description
      requested_change: CHECK
      asserted_value: "a GPR (G Protein Regulator)/GoLoco motif characteristic of guanine nucleotide exchange factors specific for G-alpha GTPases"
      confidence: CONFIRMED
      explanation: The WormBase description says gpr-2 encodes "a GPR (G Protein Regulator)/GoLoco motif
        characteristic of guanine nucleotide exchange factors specific for G-alpha GTPases". GoLoco/GPR
        motifs bind GDP-bound G-alpha and inhibit GDP release; they are guanine nucleotide dissociation
        inhibitors (GDIs), not exchange factors. Nucleotide exchange assays show that the GPR domain of
        GPR-1/2 is a GDI for GOA-1 (PMID:12814548) and for GPA-16 (PMID:16162648). Consider replacing
        "guanine nucleotide exchange factors" with "guanine nucleotide dissociation inhibitors". The
        description also gives a role in germ-line development for which we found no published support;
        please check its source.
      supported_by:
      - reference_id: PMID:12814548
        supporting_text: the GPR domain of GPR-1 and GPR-2 behaves as a GDP dissociation inhibitor for GOA-1
      - reference_id: PMID:16162648
        supporting_text: GPR-1/2 acts as a guanine nucleotide dissociation inhibitor (GDI) for GPA-16, as it
          does for GOA-1
core_functions:
- description: GoLoco-motif guanine nucleotide dissociation inhibitor for the G-alpha(i/o) subunits GOA-1
    and GPA-16, acting redundantly with GPR-1; binds G-alpha-GDP at the cell cortex and, with LIN-5, forms
    the ternary G-alpha-GPR-1/2-LIN-5 complex that anchors dynein and generates asymmetric cortical pulling
    forces on astral microtubules to position the mitotic spindle in the early embryo.
  molecular_function:
    id: GO:0005092
    label: GDP-dissociation inhibitor activity
  locations:
  - id: GO:0005938
    label: cell cortex
  directly_involved_in:
  - id: GO:0040001
    label: establishment of mitotic spindle localization
  supported_by:
  - reference_id: PMID:16162648
    supporting_text: GPR-1/2 acts as a guanine nucleotide dissociation inhibitor (GDI) for GPA-16, as it
      does for GOA-1
  - reference_id: PMID:12814548
    supporting_text: the GPR domain of GPR-1 and GPR-2 behaves as a GDP dissociation inhibitor for GOA-1
  - reference_id: PMID:25548889
    supporting_text: a ternary complex comprised of Gα (GOA-1/GPA-16), GPR-1/GPR-2, and LIN-5 is essential
      for anchoring the motor protein dynein to the cell cortex
  - reference_id: PMID:18234174
    supporting_text: LIN-5 immunoprecipitates with Gα in vivo , and association is GPR-1/2 dependent
suggested_questions:
- question: Does GPR-2 contribute to pulling force independently of GPR-1, or is it a minor dosage contributor,
    given that all RNAi and antibody reagents used to date target both near-identical paralogs?
- question: Is the force-generating species the G-alpha-GDP-GPR-1/2 complex (GDI model) or G-alpha-GTP
    produced by RIC-8 acting on that complex?
- question: Should the ComplexPortal-propagated NAS process terms on the gpr-1-gpr-2-lin-5 complex
    (CPX-4027) include regulation of GPCR signaling, given that the embryonic G-alpha pathway is receptor-independent?
suggested_experiments:
- description: Make gpr-2-specific CRISPR null alleles and an endogenous gpr-2 tag distinguishable from
    gpr-1, and measure cortical localization and spindle pulling forces (spindle severing) in gpr-2, gpr-1
    and double mutants.
  hypothesis: GPR-2 and GPR-1 are functionally redundant and dose-additive for cortical pulling force.
- description: Introduce a GoLoco point mutation into endogenous gpr-2 in a gpr-1 null background and measure
    cortical LIN-5/dynein recruitment and pulling forces.
  hypothesis: Direct GoLoco-G-alpha-GDP binding by GPR-2 is required for cortical recruitment of LIN-5 and
    dynein.
