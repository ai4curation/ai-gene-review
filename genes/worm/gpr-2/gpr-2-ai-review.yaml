gene_symbol: gpr-2
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: GPR-2 (G protein regulator 2) is a TPR-GoLoco protein of the AGS3/LGN/Pins family that
  acts, together with its near-identical paralog GPR-1, in the early C. elegans embryo. Its single C-terminal
  GoLoco motif binds GDP-bound G-alpha(i/o) subunits GOA-1 and GPA-16 and acts as a guanine nucleotide
  dissociation inhibitor. At the cell cortex GPR-1/2 forms a ternary complex with G-alpha and the NuMA-related
  coiled-coil protein LIN-5 that anchors dynein and generates pulling forces on astral microtubules. PAR
  polarity cues (via LET-99, CSNK-1 and PIP2 synthesis by PPK-1) make GPR-1/2 cortical levels asymmetric,
  so that greater posterior pulling force drives nuclear centration and rotation, anaphase spindle elongation
  and posterior spindle displacement, producing the unequal first division. GPR-1/2 also localizes to the
  spindle and asters. Because the two paralogs are nearly identical, their individual contributions have
  not been separated experimentally.
