gene_symbol: gpr-2
organism: worm
uniprot_id: Q03569
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: In the 1-cell embryo, probably together with gpr-1, controls nuclear rotation
    and spindle elongation during mitosis (PubMed:14534135). Complex of gpr-1 and
    gpr-2, in association with lin- 5, activates G protein signaling to affect mitotic
    spindle force (PubMed:12730122). Polarity determinants (par genes) may regulate
    lin- 5/gpr-1/gpr-2/goa-1 locally to create the asymmetric forces that drive spindle
    movement (PubMed:12730122).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q03569
  source_id: Q03569
- source: Alliance_Imported
  text: gpr-2 encodes a protein containing a GPR (G Protein Regulator)/GoLoco motif
    characteristic of guanine nucleotide exchange factors specific for G-alpha GTPases;
    GPR-2 appears to function redundantly during early embryogenesis and germ-line
    development to regulate chromosome and spindle movements during cell division;
    GPR-2 likely acts as a positive regulator of G protein signaling and specifically,
    may regulate GOA-1 signaling in the embryo; GPR-2 forms a protein complex with
    the nearly identical GPR-1 and with LIN-5, a coiled-coil protein that is required
    for proper localization of GPR-2 to the cell cortex and spindle asters of the
    early embryo; in addition, proper GPR-2/GPR-1/LIN-5 localization between the P2
    and EMS blastomeres at the four-cell stage, which may contribute to spindle positioning
    in EMS, requires the MES-1/SRC-1 tyrosine kinase signaling pathway; GPR-2 is believed
    to act downstream of, or in parallel to, PAR-3, a PDZ domain-containing protein,
    in mitotic spindle positioning in the early embryo.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00001689;class=Gene
  source_id: WB:WBGene00001689
- source: Alliance_Automated
  text: Enables GDP-dissociation inhibitor activity. Predicted to be involved in microtubule
    cytoskeleton organization involved in mitosis; nuclear migration; and regulation
    of G protein-coupled receptor signaling pathway. Located in aster; cell cortex;
    and mitotic spindle. Is expressed in P lineage cell.
  source_type: automated
