- source: Alliance_Imported
  text: zip-2 encodes a bZIP transcription factor; ZIP-2 activity is required for
    regulating one branch of the immune response pathway that responds to infection
    by virulent strains of the bacterial pathogen Pseudomonas aeruginosa; specifically,
    ZIP-2 is required for inducing expression of a subset of infection response genes,
    including irg-1 and irg-2, and for full resistance to P. aeruginosa infection.
