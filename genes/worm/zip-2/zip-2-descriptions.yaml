gene_symbol: zip-2
organism: worm
uniprot_id: Q21148
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Transcription factor that binds to the promoter and the enhancer regions of
    target genes (By similarity). May act together with the bZIP transcription factor,
    cebp-2 (PubMed:26876169). Involved in responding to mitochondrial damage (PubMed:28662060,
    PubMed:32350153). Plays a role in the delay of age-associated mitochondrial fragmentation
    and muscle decline (PubMed:32350153). Has a protective role in response to infection
    by the Gram-negative bacterium P.aeruginosa (PubMed:20133860, PubMed:22520465,
    PubMed:26876169, PubMed:28662060). Required to prevent P.aeruginosa ToxA-mediated
    lethality (PubMed:22520464, PubMed:22520465). Required for the activation of several
    infection response genes including irg-1 and irg-2 following P.aeruginosa infection;
    target gene activation may involve effects of the bacterial toxin, ToxA, and perhaps
    other toxins (PubMed:20133860, PubMed:22520465).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q21148
  source_id: Q21148
- source: Alliance_Imported
  text: zip-2 encodes a bZIP transcription factor; ZIP-2 activity is required for
    regulating one branch of the immune response pathway that responds to infection
    by virulent strains of the bacterial pathogen Pseudomonas aeruginosa; specifically,
    ZIP-2 is required for inducing expression of a subset of infection response genes,
    including irg-1 and irg-2, and for full resistance to P. aeruginosa infection.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00019327;class=Gene
  source_id: WB:WBGene00019327
- source: Alliance_Automated
  text: Predicted to enable DNA-binding transcription factor activity, RNA polymerase
    II-specific and RNA polymerase II cis-regulatory region sequence-specific DNA
    binding activity. Involved in defense response to bacterium and regulation of
    gene expression. Predicted to be active in nucleus. Is expressed in intestine
    and pharynx.
  source_type: automated
