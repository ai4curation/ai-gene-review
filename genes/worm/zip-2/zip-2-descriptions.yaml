descriptions:
- source: UniProt
  text: Transcription factor that binds to the promoter and the enhancer regions of
    target genes (By similarity). May act together with the bZIP transcription factor,
    cebp-2 (PubMed:26876169). Involved in responding to mitochondrial damage (PubMed:28662060,
    PubMed:32350153). Plays a role in the delay of age-associated mitochondrial fragmentation
    and muscle decline (PubMed:32350153). Has a protective role in response to infection
    by the Gram-negative bacterium P.aeruginosa (PubMed:20133860, PubMed:22520465,
    PubMed:26876169, PubMed:28662060). Required to prevent P.aeruginosa ToxA-mediated
    lethality (PubMed:22520464, PubMed:22520465). Required for the activation of several
    infection response genes including irg-1 and irg-2 following P.aeruginosa infection;
    target gene activation may involve effects of the bacterial toxin, ToxA, and perhaps
    other toxins (PubMed:20133860, PubMed:22520465).
  source_type: curated
