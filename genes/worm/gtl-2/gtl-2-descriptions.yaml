descriptions:
- source: Alliance_Imported
  text: gtl-2 encodes a predicted receptor-activated calcium channel and represents
    a family of calcium channels, the other two family members being gtl-1 and gon-2.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00001796;class=Gene
  source_id: WB:WBGene00001796
- source: Alliance_Automated
  text: Predicted to enable monoatomic cation channel activity. Predicted to be involved
    in metal ion transport and monoatomic cation transmembrane transport. Located
    in basal plasma membrane. Is expressed in excretory canal; excretory cell; hypodermis;
    pharyngeal muscle cell; and pharynx. Human ortholog(s) of this gene implicated
    in amyotrophic lateral sclerosis-parkinsonism/dementia complex 1; cataract; congenital
    stationary night blindness (multiple); familial hyperlipidemia; and musculoskeletal
    system disease. Orthologous to human TRPM1 (transient receptor potential cation
    channel subfamily M member 1); TRPM3 (transient receptor potential cation channel
    subfamily M member 3); and TRPM7 (transient receptor potential cation channel
    subfamily M member 7).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00001796;class=Gene
  source_id: WB:WBGene00001796
