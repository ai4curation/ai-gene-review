gene_symbol: gtl-2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: 'GTL-2 (gon-2-like 2; F54D1.5) is one of three TRPM-subfamily (melastatin-related) transient receptor
  potential cation channels in C. elegans, paralogous to GON-2 and GTL-1 and related to vertebrate TRPM6/7 but lacking
  a C-terminal kinase domain. It is a multi-pass membrane protein expressed in the excretory (canal) cell, the epidermis
  and the pharynx. In the excretory cell GTL-2 sits on the basal membrane facing the pseudocoelom and is required
  for that cell''s outwardly rectifying, La3+-sensitive TRPM-like current. It is thought to take up Mg2+ from the
  pseudocoelomic fluid for excretion: gtl-2 mutants accumulate Mg2+ and are hypersensitive to dietary Mg2+, which
  balances intestinal Mg2+ uptake by GON-2 and GTL-1. Its ion selectivity has not been measured directly. In the
  epidermis GTL-2 is needed for the Ca2+ rise that follows wounding and for actin-based wound closure. Loss of gtl-2
  also modifies several systemic phenotypes (gon-2 gonadogenesis defects, acr-2(gf) convulsions, pathogen avoidance)
  through altered ion homeostasis.'
