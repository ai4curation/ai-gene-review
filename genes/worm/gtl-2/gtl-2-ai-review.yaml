      GTL-2 the specific metal is Mg2+: GTL-2 sits on the basal membrane of the excretory cell, is needed for that
      cell''s TRPM-like current, and its loss causes whole-body Mg2+ excess and Mg2+-specific (not Ca2+, Na+ or
