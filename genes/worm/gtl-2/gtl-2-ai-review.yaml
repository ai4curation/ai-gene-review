- term:
    id: GO:0010960
    label: magnesium ion homeostasis
  evidence_type: IMP
  original_reference_id: PMID:20221407
  qualifier: involved_in
  review:
    summary: gtl-2 null animals accumulate ~1.5x wild-type Mg2+, are specifically hypersensitive to dietary Mg2+,
      and the excess is suppressed by loss of the intestinal Mg2+ uptake channel GTL-1.
    action: NEW
    reason: 'GTL-2 does part of the work of systemic Mg2+ homeostasis rather than being merely required for it:
      it is the channel on the basal membrane of the excretory cell that mediates the GTL-2-dependent cation current
      and is proposed to be the entry route for Mg2+ from the pseudocoelomic fluid into the cell that excretes it.
      Excretory-cell-specific expression rescues, and the phenotype is Mg2+-specific. Comparator check: human TRPM7
      (Q96QT4) carries GO:0010960 and GO:0010961 in GOA, so TRPM channels that move Mg2+ across the plasma membrane
      are annotated to this process. The caveat is that GTL-2 Mg2+ permeability is inferred, not measured. Downstream
      organismal phenotypes (gonadogenesis suppression, convulsion suppression, pathogen avoidance, clozapine resistance,
      slow growth) are not proposed.'
    supported_by:
    - *id007
    - *id008
    - reference_id: PMID:20221407
      supporting_text: inactivation of gtl-1 suppresses the hypermagnesemic phenotype of gtl-2 mutants
    - *id009
    - reference_id: PMID:24564792
      supporting_text: GTL-2 acts in the excretory canal cell to regulate Mg(2+) homeostasis
