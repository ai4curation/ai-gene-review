suggested_questions:
- question: What is the ion selectivity of GTL-2 (Ca2+ vs Mg2+ vs monovalent cations)? It has never been expressed
    heterologously, so calcium or magnesium channel activity cannot yet be asserted.
- question: Does GTL-2 directly conduct the Ca2+ influx after epidermal wounding (PMID:22100061), or does it act
    indirectly through systemic ion balance? Should calcium ion transmembrane transport be annotated?
- question: GOA has no WormBase annotation for Mg2+ transport or homeostasis from PMID:20221407 despite the hypermagnesemia
    data; would WormBase curators add magnesium ion homeostasis (IMP)?
- question: How is Mg2+ moved from the excretory-cell cytoplasm into the canal lumen (apical exit step), and is
    any GTL-2 present apically?
suggested_experiments:
- description: Express GTL-2 alone in HEK293 cells or Xenopus oocytes and measure bi-ionic reversal potentials and
    Mg2+ influx (e.g. Mag-Fura-2).
  hypothesis: GTL-2 forms a Mg2+-permeable, outwardly rectifying cation channel like GON-2/GTL-1.
- description: Endogenous CRISPR GFP knock-in at gtl-2 with excretory canal apical/basal markers, plus Mg2+-sensitive
    reporters in the excretory cell of wild type and gtl-2 mutants.
  hypothesis: Endogenous GTL-2 is basal and is required for Mg2+ entry into the excretory cell.
