- id: PMID:20221407
  title: Magnesium excretion in C. elegans requires the activity of the GTL-2 TRPM channel.
  findings:
  - statement: GTL-2::GFP is on the basal membrane of the excretory cell.
    supporting_text: The GTL-2::GFP fusion protein is predominantly localized to the outer/basal surface of the
      excretory cell
  - statement: The excretory-cell outwardly rectifying current requires GTL-2.
    supporting_text: In gtl-2 mutant cells, we found that the outwardly-rectifying current was eliminated
  - statement: GTL-2 ion selectivity was not determined.
    supporting_text: we were not able to determine the relative permeability of GTL-2 to different cations
  - statement: gtl-2 null animals are hypermagnesemic.
    supporting_text: we found that gtl-2(tm1463) animals contain approximately 1.5 times as much Mg2+ per unit mass
      as wild type animals
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Full text read (PMC2833210). Primary GTL-2 paper: localization (IDA row), excretory-cell electrophysiology,
      Mg2+ genetics and ICP-MS.'
- id: PMID:22100061
  title: A Gαq-Ca²⁺ signaling pathway promotes actin-mediated epidermal wound closure in C. elegans.
  findings:
  - statement: GTL-2 is the only one of 11 TRP channels required for epidermal wound Ca2+ responses.
    supporting_text: Of 11 TRP channels tested, only GTL-2 was required for normal epidermal Ca2+ responses
  - statement: Epidermal GTL-2 acts cell-autonomously.
    supporting_text: Epidermal expression of GTL-2 rescued gtl-2 Ca2+ defects
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text read. Genetic evidence that GTL-2 supports epidermal Ca2+ influx after wounding; gating
      and direct conduction not shown, and double mutants with gon-2/gtl-1 restore viability, so systemic ion effects
      may contribute. Not used for a NEW term.
- id: PMID:21549603
  title: TRPM channels modulate epileptic-like convulsions via systemic ion homeostasis.
  findings:
  - statement: GTL-2::GFP is on the epidermal cell surface, excretory cell and pharynx.
    supporting_text: We observed GTL-2::GFP on the epidermal cell surface (Figure 1D, E), as well as in the excretory
      cell and pharynx
  - statement: Convulsion suppression is not explained by Mg2+ excess.
    supporting_text: Thus, the increased Mg2+ levels in gtl-2(lf) mutants do not account for the effects on the
      locomotor circuit.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text read. Expression pattern and a systemic, non-neuronal effect on locomotor circuit balance;
      indirect for GO.
- id: PMID:24564792
  title: Transient receptor potential melastatin (TRPM) channels mediate clozapine-induced phenotypes in Caenorhabditis
    elegans.
  findings:
  - statement: GTL-2 acts in the excretory canal cell to regulate Mg2+ homeostasis.
    supporting_text: GTL-2 acts in the excretory canal cell to regulate Mg(2+) homeostasis
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only cache. Corroborates the excretory-cell site of action; clozapine phenotype is indirect.
  full_text_unavailable: true
- id: PMID:34032213
  title: TRPM channels mediate learned pathogen avoidance following intestinal distention.
  findings:
  - statement: GTL-2 is required for learned avoidance of E. faecalis, by an unclear mechanism.
    supporting_text: Thus, it remains unclear how exactly GON-2 and GTL-2 function in pathogen avoidance.
  reference_review:
