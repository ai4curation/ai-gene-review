  text: Predicted to enable insulin receptor binding activity. Involved in several
    processes, including insulin receptor signaling pathway; negative regulation of
    dauer entry; and regulation of synaptic assembly at neuromuscular junction. Acts
    upstream of with a negative effect on protein import into nucleus. Located in
    extracellular region and synapse. Is expressed in several structures, including
    distal tip cell; egg-laying apparatus; neurons; pharynx; and ventral nerve cord.
