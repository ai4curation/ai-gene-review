gene_symbol: daf-28
organism: worm
uniprot_id: Q9NEK7
taxon_id: NCBITaxon:6239
descriptions:
- source: Alliance_Imported
  text: daf-28 encodes a beta-type insulin, mostly similar to INS-4 and INS-6and homologous
    to human insulin; DAF-28 inhibits dauer formation; daf-28mutants arrest as dauers
    and have downregulated signals through theDAF-2/insulin pathway; in young animals,
    daf-28 is expressed in ASI andASJ neurons, which regulate dauer formation; in
    older animals, daf-28expression spreads to other head neurons and to the somatic
    gonad;daf-28 expression is reduced by pheromone signalling, or in daf-1,daf-7,
    daf-11, or daf-22 mutant dauers; daf-28 mutants are dominantnegative, and are
    suppressed by excess wild-type DAF-28, INS-4, orINS-6; normal loss-of-function
    daf-28 alleles are expected to have anormal phenotype because C. elegans' 38 insulin
    genes are likely to beredundant; daf-28 expression is increased in daf-6, osm-1,
    or tax-4mutants; the transmembrane protein-tyrosine phosphatase IDA-1 isrequired
    for DAF-28 function; a ida-1 null allele enhancesdaf-28(sa191), with double mutants
    forming 50% dauers at 22.5 deg. C.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00000920;class=Gene
  source_id: WB:WBGene00000920
- source: Alliance_Automated
  text: Predicted to enable insulin receptor binding activity. Involved in several
    processes, including insulin receptor signaling pathway; negative regulation of
    dauer entry; and regulation of synaptic assembly at neuromuscular junction. Acts
    upstream of with a negative effect on protein import into nucleus. Located in
    extracellular region and synapse. Is expressed in several structures, including
    distal tip cell; egg-laying apparatus; neurons; pharynx; and ventral nerve cord.
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00000920;class=Gene
