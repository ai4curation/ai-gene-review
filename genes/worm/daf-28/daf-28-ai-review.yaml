suggested_questions:
- question: Which daf-28(sa191) phenotypes reflect loss of DAF-28 itself, and which reflect
    dominant-negative poisoning of other insulins or ER stress in ASI/ASJ, now that null alleles
    are available?
suggested_experiments:
- description: Compare daf-28 null and sa191 alleles for dauer entry, DAF-16 localization
    and ER stress reporters in ASI/ASJ, and measure DAF-28 binding to DAF-2 directly.
