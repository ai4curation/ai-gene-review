core_functions:
- description: DAF-28 is a secreted insulin-like peptide hormone released from ASI/ASJ sensory
    neurons in favorable conditions. It acts as a DAF-2 agonist, keeping intestinal DAF-16
    inactive and preventing dauer entry; its expression falls under dauer-inducing cues, coupling
    sensory input to the dauer decision.
