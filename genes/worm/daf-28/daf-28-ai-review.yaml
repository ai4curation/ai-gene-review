gene_symbol: daf-28
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: DAF-28 is a secreted insulin-like peptide of C. elegans and a major agonist ligand
  of the DAF-2 insulin/IGF-1-like receptor. It is expressed in the ASI and ASJ sensory neurons.
  Its expression in ASI and ASJ is down-regulated by dauer-inducing cues (pheromone, low food)
  and in daf-11 guanylyl cyclase mutants, which couples environmental sensing to DAF-2 signaling.
  DAF-28 acts with INS-6 and INS-4 to prevent dauer entry under favorable conditions; it is
  more important than INS-6 for inhibiting dauer entry. Neuron-derived DAF-28 keeps the intestinal
  FOXO factor DAF-16 out of the nucleus. The dominant-negative daf-28(sa191) allele disrupts
  a probable proteolytic processing site and causes dauer arrest; DAF-28 is processed by the
  proprotein convertases KPC-1 and/or EGL-3. DAF-28 localizes to synaptic regions of ASJ,
  and insulin released from ASJ also contributes to cold habituation and to insulin-dependent
  regulation of neuromuscular junction development.
