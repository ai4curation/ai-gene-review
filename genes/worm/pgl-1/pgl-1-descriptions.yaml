gene_symbol: pgl-1
organism: worm
uniprot_id: Q9TZQ3
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Guanyl-specific endoribonuclease which cleaves the phosphodiester bond in
    single-stranded RNA between the 3'-guanylic residue and the 5'-OH residue of adjacent
    nucleotide, resulting in the formation of a corresponding 2',3'-cyclic phosphate
    intermediate (PubMed:26787882). Together with the P-granule component pgl-3, is
    involved in the formation of P-granules (PubMed:21402787, PubMed:24746798). Together
    with pgl-3, probably recruits other granule components such as pos-1, mex-3 and
    glh-1 to P-granules (PubMed:21402787). In addition, may act redundantly with pgl-3
    to protect germ cells from excessive germline apoptosis during normal oogenesis
    and development of the two gonadal arms (PubMed:26598553). This may in part be
    through regulating the localization of sir-2.1 which is involved in germ cell
    apoptosis (PubMed:26598553). May protect somatic cells from excessive apoptosis
    during normal development (PubMed:27650246). Essential role in male and female
    postembryonic germline development; maternally provided protein maintains a population
    of proliferating germ cells and zygotic expression is required for correct oogenesis
    (PubMed:15238518, PubMed:24746798, PubMed:9741628).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q9TZQ3
  source_id: Q9TZQ3
- source: Alliance_Imported
  text: pgl-1 encodes a predicted RNA-binding protein that contains a number of C-terminal
    RGG box motifs; PGL-1 activity is required at high temperatures during midlarval
    to adult stages for postembryonic germline development and hence fertility, and
    also for proper formation of the germline-specific P granules; PGL-1 protein,
    supplied maternally and embryonically, is a constitutive P granule component and
    thus, its localization is cytoplasmic in oocytes and early embryos, while perinuclear
    in the germline blastomere P4 and proliferating germ cells of larvae and adults;
    pgl-1 mRNA is expressed exclusively in hermaphrodite and male germlines and is
    detectable at all stages of development, with highest levels seen in adults; PGL-1
    localization to P granules requires wild-type activity of the predicted germline
    helicase GLH-1.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00003992;class=Gene
  source_id: WB:WBGene00003992
- source: Alliance_Automated
  text: Enables identical protein binding activity and ribonuclease T1 activity. Involved
    in P granule organization and germ-line stem cell division. Located in P granule.
    Is expressed in germ line and germline precursor cell.
