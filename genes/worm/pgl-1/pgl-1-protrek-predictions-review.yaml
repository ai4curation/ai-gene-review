- source_method: ProTrek
  source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
  source_reference_id: PMID:41039041
  predicted_term:
    id: GO:0140610
    label: RNA sequestering activity
  predicted_term_type: GO_MF
  review:
    assessment: UNC
    confidence_score: 1
    summary: >-
      Top-ranked hit (score 17.81), absent from GOA. RNA sequestering activity is defined as binding
      a specific RNA to prevent it interacting with partners or to block its localization. PGL-1 is
      an RGG-repeat RNA binder that scaffolds a phase-separated RNP granule, so sequestration is a
      plausible reading of what a P granule does to its RNA - but PGL-1 also cleaves RNA, and nothing
      in the available material establishes a sequestering rather than a recruiting or catalytic role.
      The gene's review does assert protein sequestering activity (of SIR-2.1); this is the RNA analogue
      and is not supported in the same way. Cannot be validated or refuted here.
    supported_by:
