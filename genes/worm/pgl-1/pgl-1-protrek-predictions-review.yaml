  label: Caenorhabditis elegans
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for worm pgl-1, the constitutive P granule scaffold and guanyl-specific
  endoribonuclease. Rank 3 is an exact GOA match on the compartment, but the enzymology is entirely
  absent: the review's first core function is ribonuclease T1 activity (EC 4.6.1.24), GOA holds RNA
  endonuclease activity with IDA support, and no nuclease term appears anywhere in the top five. What
  comes back instead are condensate-biology terms - RNA sequestering, mRNA localization, stem-loop
  binding, regulation of nonsense-mediated decay - which describe the neighbourhood PGL-1 works in
  without naming anything it does. The free-text channel, once again, holds exactly what the GO channel
  loses: its rank-1 hit at 20.36 is the guanyl-specific endoribonuclease comment describing cleavage
  3' of guanylic residues to give 2',3'-cyclic phosphates. Assessment: 1 correct-not-novel, 2 uncertain.
  Assessment: 1 correct not novel (CNN), 2 uncertain (UNC).
