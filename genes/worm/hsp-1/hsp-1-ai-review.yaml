core_functions:
  - molecular_function:
      id: GO:0140662
      label: ATP-dependent protein folding chaperone
    description: HSP-1/Hsc70 is an ATP-dependent molecular chaperone that binds unfolded or misfolded
      proteins and assists in their proper folding through cycles of ATP hydrolysis-driven conformational
      changes. This is the core molecular function of all HSP70 family members.
    supported_by:
      - reference_id: PMID:25053410
        supporting_text: The molecular chaperone Hsc70 assists in the folding of non-native proteins together
          with its J domain- and BAG domain-containing cofactors.
      - reference_id: PMID:19559711
        supporting_text: Interestingly, we observed physical interactions with both chaperones Hsp70 and
          Hsp90, albeit only the interaction with Hsp90 is strong and inhibition of the Hsp90 ATPase activity
          can be observed upon binding of CeHop.
  - molecular_function:
      id: GO:0016887
      label: ATP hydrolysis activity
    description: The intrinsic ATPase activity of the N-terminal nucleotide-binding domain drives the
      chaperone cycle. ATP hydrolysis causes conformational changes that modulate substrate affinity.
    supported_by:
      - reference_id: PMID:25053410
        supporting_text: C-terminal fragments of UNC-23 instead perform all Hsc70-related functions, like
          ATPase stimulation and regulation of folding activity, albeit with lower affinity than BAG-1.
      - reference_id: PMID:19559711
        supporting_text: inhibition of the Hsp90 ATPase activity can be observed upon binding of CeHop
  - molecular_function:
      id: GO:0016887
      label: ATP hydrolysis activity
    description: As the HSC70 uncoating ATPase, HSP-1 is recruited to clathrin-coated vesicles by the
      J-domain co-chaperone auxilin (DNJ-25) and uses ATP hydrolysis to disassemble the clathrin lattice,
      releasing naked vesicles during clathrin-mediated endocytosis, including synaptic vesicle regeneration
      at the presynaptic endocytic zone.
    directly_involved_in:
      - id: GO:0072318
        label: clathrin coat disassembly
    locations:
      - id: GO:0005829
        label: cytosol
    supported_by:
      - reference_id: PMID:11175756
        supporting_text: In vitro, the molecular chaperone Hsc70 uncoats clathrin-coated vesicles in an
          ATP-dependent process that requires a specific J-domain protein such as auxilin.
      - reference_id: PMID:11175756
        supporting_text: Here we show that C. elegans has a single auxilin homologue that is identical
          to mammalian auxilin in its in vitro activity.
      - reference_id: PMID:19763082
        supporting_text: Loss of SNX-1, RME-8, or the clathrin chaperone Hsc70/HSP-1 leads to over-accumulation
          of endosomal clathrin, reduced clathrin dynamics, and missorting of MIG-14 to the lysosome.
