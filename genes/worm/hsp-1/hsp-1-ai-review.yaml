suggested_questions:
  - question: Has clathrin uncoating by HSP-1 been tested directly in C. elegans (e.g. hsp-1 depletion
      or ATPase mutants scored for coated-vesicle accumulation at synapses or in coelomocytes), rather
      than inferred from the dnj-25 (auxilin) phenotype and mammalian HSC70 biochemistry?
  - question: What specific client proteins are folded by HSP-1 in C. elegans?
  - question: Does HSP-1 function in chaperone-mediated autophagy in C. elegans?
  - question: What is the relative contribution of HSP-1 vs inducible HSP70s (hsp-70) to proteostasis
      under stress?
suggested_experiments:
  - description: Proteomics analysis of HSP-1 client proteins using substrate-trapping mutants
    hypothesis: HSP-1 has a defined set of client proteins that can be identified using substrate-trapping
      ATPase mutants
  - description: Live imaging of HSP-1 dynamics during heat stress and recovery
    hypothesis: HSP-1 redistributes from cytosol to nucleus during heat stress and returns upon recovery
  - description: Structural analysis of HSP-1 complexes with co-chaperones UNC-23 and DNJ-13
    hypothesis: The molecular details of co-chaperone binding sites can inform understanding of ATPase
      cycle regulation
