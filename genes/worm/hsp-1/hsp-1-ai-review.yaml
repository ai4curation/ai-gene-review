      reason: This annotation documents the phenotypic consequence of HSP-1 loss on longevity. The effect
        on lifespan is likely mediated through the core proteostasis function of HSP-1 rather than representing
        a specific molecular function in aging regulation.
      supported_by:
        - reference_id: PMID:14668486
          supporting_text: Down-regulation of individual molecular chaperones, transcriptional targets
            of HSF-1, also decreased longevity of long-lived mutant but not wild-type animals. However,
            suppression by individual chaperones was to a lesser extent, suggesting an important role
            for networks of chaperones.
