gene_symbol: hsp-1
product_type: PROTEIN
status: IN_PROGRESS
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: HSP-1 is the constitutive cytosolic heat shock cognate 70 kDa protein (Hsc70) in C. elegans,
  orthologous to human HSPA8. It functions as an ATP-dependent molecular chaperone that binds unfolded
  or misfolded proteins and assists in their refolding through cycles of ATP hydrolysis-driven substrate
  binding and release. HSP-1 is expressed constitutively at high levels but also shows modest heat-inducibility
  (2-6 fold). It interacts with co-chaperones including STI-1/Hop (linking Hsc70 and Hsp90 systems), BAG
  domain proteins like UNC-23 (which regulates the ATPase cycle), and J-domain proteins like RME-8 (for
  endosomal function) and DNJ-13 (for muscle function). HSP-1 plays essential roles in proteostasis, muscle
  functionality, endosomal trafficking, regulation of DAF-16-mediated stress responses, and longevity.
