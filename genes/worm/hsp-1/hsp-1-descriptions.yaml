    overall_notes: Correct on Hsp70A family, constitutive expression with modest heat
      induction and the age-1 lifespan link. Omits co-chaperones and endocytic and
      clathrin uncoating roles.
- source: Alliance_Automated
  text: Enables ATP hydrolysis activity. Involved in determination of adult lifespan;
    response to heat; and retrograde transport, endosome to Golgi. Located in cytosol
    and nucleus. Is expressed in several structures, including anal depressor muscle;
    excretory cell; germ line; intestine; and pharynx. Human ortholog(s) of this gene
    implicated in several diseases, including artery disease (multiple); autoimmune
    disease of musculoskeletal system (multiple); inner ear disease (multiple); lung
    disease (multiple); and schizophrenia (multiple). Orthologous to several human
    genes including HSPA8 (heat shock protein family A (Hsp70) member 8).
  source_type: automated
