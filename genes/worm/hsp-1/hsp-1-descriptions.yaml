descriptions:
- source: Alliance_Imported
  text: hsp-1 encodes hsp70A, a member of the heat shock family of proteins; hsp70A
    is closely related to the Drosophila heat inducible hsp70s and the S. cerevisiae
    SSA hsp70 subfamily; the hsp-1 gene is normally expressed throughout development
    and upon heat-shock the hsp-1 mRNA is enhanced 2-6 fold; down-regulation of hsp-1
    via RNA interference results in a small reduction in the life-span of an age-1
    mutant indicating that hsp-1 may play some role in regulating longevity.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00002005;class=Gene
  source_id: WB:WBGene00002005
