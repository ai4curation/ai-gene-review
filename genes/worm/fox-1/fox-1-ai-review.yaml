    reason: The observation (FOX-1 dose alters the level of the active xol-1 mRNA) is sound, but FOX-1
      does not carry out mRNA metabolism; it regulates xol-1 pre-mRNA alternative splicing, as later shown
      directly. The specific supported term is regulation of alternative mRNA splicing, via spliceosome
      (GO:0000381), which fox-1 already carries; this is a correction from the process to its regulation
      rather than a descendant refinement.
    proposed_replacement_terms:
    - id: GO:0000381
      label: regulation of alternative mRNA splicing, via spliceosome
    supported_by:
    - reference_id: PMID:33372658
      supporting_text: We demonstrate that FOX-1 represses xol-1 in XX embryos by regulating alternative
        xol-1 pre-mRNA splicing to inhibit formation of the mature transcript that is both necessary and
        sufficient for xol-1 activity in XO embryos.
