core_functions:
- description: Sequence-specific binding of the RBFOX-type RRM to GCAUG/GCACG elements in pre-mRNA introns
    in the nucleus, regulating alternative splicing. In XX embryos the dose-dependent binding of FOX-1
    to xol-1 intron VI causes intron retention or alternative 3' splice-site use, eliminating productive
    xol-1 mRNA and so conveying X-chromosome number to the sex-determination switch. Redundantly with
    ASD-1 it also regulates egl-15 and unc-32 splicing.
  molecular_function:
    id: GO:0097157
    label: pre-mRNA intronic binding
  directly_involved_in:
  - id: GO:0000381
    label: regulation of alternative mRNA splicing, via spliceosome
  - id: GO:0007538
    label: primary sex determination
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:33372658
    supporting_text: FOX-1 RNA binding experiments performed in vitro demonstrate that FOX-1 binds to
      multiple GCAUG and GCACG motifs in intron VI.
  - reference_id: PMID:33372658
    supporting_text: By binding to multiple sites in intron VI using both GCAUG and GCACG motifs, FOX-1
      causes either intron VI retention or directs the use of an alternative 3' splice site, causing deletion
      of exon 7 coding sequences.
  - reference_id: PMID:33372658
    supporting_text: 'Splicing regulation is dose-dependent: mutating one copy of fox-1 or all binding
      motifs in one copy of xol-1 kills XX animals sensitized by reduced XSE activity.'
  - reference_id: PMID:23468662
    supporting_text: demonstrating direct and specific binding of ASD-1 and FOX-1 to the UGCAUG stretch
  - reference_id: PMID:23468662
    supporting_text: indicating that the C-terminal portions of ASD-1 and FOX-1 are the sole NLSs
suggested_questions:
- question: Should X signal elements such as FOX-1, SEX-1 and CEH-39 be annotated to GO:0007540 (sex determination,
    establishment of X:A ratio), which describes sensing X-chromosome number, rather than or in addition
    to primary sex determination? A comparator check across the known XSEs would settle the convention.
- question: Is the FOX-1-directed trans-splicing of xol-1 to unrelated genes ever produced at physiological
    FOX-1 levels, or only on overexpression?
- question: Do any fox-1 isoforms lack the C-terminal PY-NLS and act in the cytoplasm, as mammalian RBFOX1
    isoforms do? This would decide the family-level cytoplasm and mRNA binding rows.
suggested_experiments:
- description: CLIP-seq or TRIBE with endogenously tagged FOX-1 in early XX and XO embryos and in larval
    neurons/muscle to define direct in vivo targets beyond xol-1, egl-15 and unc-32.
- description: Quantitative long-read sequencing of xol-1 transcripts in wild-type XX embryos (without
    FOX-1 overexpression) to test whether trans-spliced xol-1 products occur physiologically.
