- term:
    id: GO:0000366
    label: mRNA alternative trans-splicing
  evidence_type: IDA
  original_reference_id: PMID:33372658
  qualifier: involved_in
  review:
    summary: Trans-splicing of xol-1 exon 6 to exons of unrelated chromosome II genes, seen among xol-1
      cDNAs from embryos overexpressing FOX-1 from a transgene.
    action: MARK_AS_OVER_ANNOTATED
    reason: The trans-spliced xol-1 cDNAs were cloned only from high-FOX-1 (transgenic yIs44) embryos;
      under normal (low) FOX-1 conditions only properly spliced, intron VI-retaining and exon 7-deleted
      transcripts were found. The authors interpret trans-splicing as a by-product of the same alternative
      3' splice-site choice that FOX-1 promotes. FOX-1 is a splicing regulator, not a component of the
      trans-splicing machinery, and there is no evidence that FOX-1-directed trans-splicing occurs at
      physiological FOX-1 dose. The physiological activity is captured by regulation of alternative mRNA
      splicing (GO:0000381).
    supported_by:
    - reference_id: PMID:33372658
      supporting_text: Clones of cDNAs from high FOX-1 conditions revealed both expected and unexpected
        transcripts (Figure 3C).
    - reference_id: PMID:33372658
      supporting_text: 'Sequences of cDNA clones from xol-1 transcripts in low FOX-1 conditions revealed
        only the expected: properly spliced active 2.2 kb transcripts, inactive 2.5 kb transcripts that
        retained intron VI, and inactive alternatively spliced 1.5 kb transcripts that deleted part of
        exon 7 through use of a 3'' acceptor site in the 3'' UTR (Figure 3B).'
