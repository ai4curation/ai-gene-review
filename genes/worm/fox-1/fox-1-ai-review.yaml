id: Q10572
gene_symbol: fox-1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: 'fox-1 (Feminizing locus On X; T07D1.4) encodes FOX-1, the founding member of the RBFOX family
  of RNA-binding proteins, with one central FOX1-type RRM and a C-terminal PY-type nuclear localization
  signal. In the nucleus FOX-1 binds GCAUG and GCACG elements in pre-mRNA introns and regulates alternative
  splicing. Its best-characterised role is as an X-chromosome signal element (numerator) in primary sex
  determination: the twofold higher FOX-1 dose in XX embryos drives non-productive splicing of the master
  sex switch gene xol-1 (intron VI retention or alternative 3'' splice-site use that deletes exon 7 coding
  sequence), eliminating male-determining XOL-1 protein. Together with transcriptional repression of xol-1
  by SEX-1 and CEH-39 this sets the hermaphrodite fate and, through SDC-2, allows assembly of the dosage
  compensation complex on the X chromosomes. Redundantly with its paralog ASD-1, FOX-1 also regulates
  tissue-specific splicing of egl-15 (FGF receptor) in muscle, cooperating with SUP-12, and of unc-32
  in neurons. fox-1 single mutants are viable; loss of fox-1 is lethal to XX animals only when other X
  signal elements are reduced.'
