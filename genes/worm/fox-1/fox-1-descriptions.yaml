- source: Alliance_Automated
  text: Enables pre-mRNA intronic binding activity and single-stranded RNA binding
    activity. Involved in several processes, including mRNA alternative trans-splicing;
    primary sex determination; and regulation of gene expression. Located in nucleus.
    Is expressed in several structures, including body wall musculature; intestine;
    pharynx; tail; and vulval muscle. Used to study depressive disorder. Human ortholog(s)
    of this gene implicated in alcohol use disorder and congenital heart disease.
    Orthologous to several human genes including RBFOX1 (RNA binding fox-1 homolog
    1) and RBFOX3 (RNA binding fox-1 homolog 3).
