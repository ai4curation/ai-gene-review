- source: Alliance_Imported
  text: fox-1 encodes an RNA-binding protein of the RNA recognition motif (RRM) superfamily
    of ribonucleic acid binding proteins; during C. elegans development, FOX-1 functions
    redundantly with other numerator elements to effect proper dosage compensation
    in the early embryo; in influencing dosage compensation, FOX-1 likely acts via
    post-transcriptional regulation of xol-1 mRNA levels; in addition to its role
    in dosage compensation, fox-1 activity is also required for normal male mating
    behavior; Western analysis and lacZ reporter constructs indicate that FOX-1 is
    expressed throughout the life cycle, beginning at the 18-20-cell stage of embryogenesis
    and continuing on through larval stages and into adult hermaphrodites and males;
    while early embryonic expression of fox-1 is ubiquitous, postembryonic expression
    is limited to a subset of head and tail neurons.
