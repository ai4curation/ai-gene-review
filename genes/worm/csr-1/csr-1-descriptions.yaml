descriptions:
- source: Alliance_Imported
  text: csr-1 encodes, by alternative splicing, two isoforms of an Argonaute protein
    required for chromosome segregation, embryonic viability, Slicer activity induced
    by secondary siRNAs, and (partially) for germline RNAi; csr-1(RNAi) embryos are
    generally inviable, with disordered metaphase chromosomes and anaphase DNA bridges;
    CSR-1 is found in secondary-type siRNA/Slicer complexes, and isolated recombinant
    CSR-1 itself shows Slicer activity with secondary-type siRNAs; csr-1(fj54) mutant
    cell-free extracts have only 10% the normal level of secondary siRNA-induced Slicer
    activity; csr-1 mutants are partially defective in germline RNAi; CSR-1 belongs
    to a nematode-specific group of Argonaute homologs, and is most closely related
    to C04F12.1; like ALG-1/2 and RDE-1, but unlike some other Argonaute homologs,
    CSR-1 retains key catalytic residues in an RNAse H domain.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00017641;class=Gene
  source_id: WB:WBGene00017641
- source: Alliance_Automated
  text: Enables endoribonuclease activity, cleaving siRNA-paired mRNA. Involved in
    P granule assembly; mitotic sister chromatid segregation; and siRNA-mediated gene
    silencing by mRNA destabilization. Located in P granule; condensed nuclear chromosome;
    and metaphase plate. Is expressed in several structures, including germ line;
    somatic cell; sperm; spermatid; and spermatocyte.
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00017641;class=Gene
