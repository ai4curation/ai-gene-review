- source: Alliance_Automated
  text: Enables endoribonuclease activity, cleaving siRNA-paired mRNA. Involved in
    P granule assembly; mitotic sister chromatid segregation; and siRNA-mediated gene
    silencing by mRNA destabilization. Located in P granule; condensed nuclear chromosome;
    and metaphase plate. Is expressed in several structures, including germ line;
    somatic cell; sperm; spermatid; and spermatocyte.
