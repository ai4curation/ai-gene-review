  review:
    summary: Actual ancestral miRNA-binding transfer must be reconciled with CSR-1-specific 22G guide
      selection.
    action: UNDECIDED
    reason: H2KZD5 leaf PTN000527417 genuinely descends from miRNA-binding node PTN001113179; the
      inference is not circular or off-clade. However, direct CSR-1 and isoform-specific IP/small-RNA
      studies identify selective 22G-siRNA complexes, with distinct guide-target pools for a and
      b. These experiments create a concrete guide-class specificity question, but predominance of
      22G guides or lower slicing efficiency with another guide type does not prove inability to
      bind miRNAs. The existing identity/TF OpenScientist report does not address miRNA binding in
      its body or final artifact. Retain UNDECIDED for focused assessment of loading data and the
      ancestral placement.
    supported_by:
