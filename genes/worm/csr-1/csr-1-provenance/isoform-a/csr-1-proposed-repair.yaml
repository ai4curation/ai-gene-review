    label: mitotic sister chromatid segregation
  evidence_type: IMP
  original_reference_id: PMID:17110334
  qualifier: involved_in
  review:
    summary: mitotic sister chromatid segregation is supported for CSR-1.
    action: ACCEPT
    reason: Retain the curated mutant-based chromosome segregation assertion. The 2006 source is
      abstract-only, but the independent 2009 target study demonstrates chromosome alignment/segregation
      defects and chromosome association of the CSR-1 pathway, corroborating biological participation
      rather than inferring a spindle enzyme. These are gene-level CSR-1 observations; older experiments
      generally did not distinguish isoforms. The representative H2KZD5 accession is CSR-1a, while
      later isoform-resolved work assigns many constitutive germline/embryonic functions to CSR-1b
      (Q27GU1). Preserve the GOA assertion without relabeling the older assay as isoform-a-specific.
    supported_by:
    - &id001
      reference_id: PMID:19804758
