id: H2KZD5
gene_symbol: csr-1
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: CSR-1 is a C. elegans Argonaute that binds endogenous 22G siRNAs and regulates complementary
  transcripts through RNA cleavage, translational repression, and protection from competing silencing
  pathways. It acts in cytoplasmic germ granules and at nuclear chromatin, contributes to proper
  chromosome segregation, and supports germline gene expression and fertility. The locus produces
  long CSR-1a (H2KZD5) and short CSR-1b (Q27GU1), sharing PAZ/PIWI domains and catalytic residues
  but differing in an N-terminal extension, expression, and guide-RNA targets. CSR-1b is broadly
  expressed in the germline and accounts for many previously characterized essential functions; CSR-1a
  has spermatogenic and somatic roles, including intestinal gene repression.
