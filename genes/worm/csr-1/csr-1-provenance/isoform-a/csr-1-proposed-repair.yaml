core_functions:
- description: CSR-1 binds 22G siRNA guides and cleaves complementary RNA targets. It also cooperates
    in translational repression and occupies germ-granule and nuclear/chromosome-associated pools.
    Gene-level chromosome-segregation and essential germline roles are predominantly attributed to
    CSR-1b in later isoform studies; CSR-1a shares the catalytic domain but has distinct spermatogenic/somatic
    targets.
