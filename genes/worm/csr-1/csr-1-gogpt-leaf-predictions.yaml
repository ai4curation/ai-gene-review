description: 'All predictions in this file were generated from the WRONG SEQUENCE: the gene folder cached UniProt Q17370 (nhr-47, a 579 aa nuclear hormone receptor) instead of CSR-1, and the RL export embeds that sequence verbatim. The model described the protein it was given, so scoring these calls against CSR-1 penalises it for a data error that is ours. Every prediction is therefore recorded as UNC with error_type WRONG_INPUT_SEQUENCE and carries no weight for or against the model. These are web-app exports and cannot be regenerated here; re-running against the corrected accession H2KZD5 is needed before this gene can be scored. See genes/worm/csr-1/csr-1-notes.md and issue #2720.'
