description: >-
  This row does not measure ProTrek. The gene folder cached for worm csr-1 holds UniProt Q17370, whose
  record reads 'Nuclear hormone receptor family member nhr-47' and which belongs to the nuclear hormone
  receptor family - not CSR-1, the essential Argonaute that binds 22G-RNAs and is the subject of the
  gene review in the same folder. The sequence submitted to ProTrek was therefore NHR-47's. Judged
  against the protein actually supplied, the retrieval is respectable: rank 5 is an exact hit on nuclear
  receptor activity, ranks 2 and 3 return dauer larval development and dauer entry, and the free-text
  channel returns 'Orphan nuclear receptor' at 20.28 and 'Orphan nuclear receptor that may have a
  role in dauer formation' at 19.50 - matching the cached record closely. Judged against CSR-1, every
  call is wrong, and none of the Argonaute biology (siRNA binding, RISC, P granule, chromosome segregation)
  could possibly appear. All three reviewed calls are therefore scored uncertain with a wrong-input-sequence
  error: the defect is in the benchmark's data hygiene, not the model, and the correct response is
  to fix the gene folder's accession rather than to record any judgment about ProTrek from this row.
  Assessment: 3 uncertain (UNC).
