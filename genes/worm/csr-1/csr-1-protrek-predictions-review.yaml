description: >-
  ProTrek sequence-to-text retrieval for worm csr-1, the essential Argonaute. This row was previously
  unscorable: the gene folder cached UniProt Q17370 (nhr-47, a nuclear hormone receptor) instead of
  CSR-1, so the sequence submitted was the wrong protein's. The folder has been re-fetched against
  H2KZD5 and the retrieval re-run; this review replaces the earlier wrong-input one. The corrected
  result is good at the top and then makes the cohort's characteristic error in its hardest possible
  setting. Rank 1 is the right compartment class, and the free-text channel returns what is essentially
  CSR-1's own description at 19.32 - an Argonaute interacting with RNA-dependent-RNA-polymerase-derived
  22G endo-siRNAs. But C. elegans encodes 24 Argonautes with sharply divided jobs, and below rank
  1 the retrieval picks other members' specialities: co-transcriptional nuclear silencing (NRDE-3/HRDE-1)
  at rank 2, and antiviral RNAi (RDE-1/DRH-1) at ranks 4 and 5. The Subcellular_location channel makes
  the substitution explicit, returning a sentence naming nrde-3 by name at rank 2. Rank 3, 'RNA-mediated
  gene silencing', no longer resolves to a live GO id, so rank 4 was reviewed in its place. Assessment:
  1 less precise, 2 paralog incorrect. Assessment: 1 less precise (LSP), 2 paralog incorrect (PLI).
