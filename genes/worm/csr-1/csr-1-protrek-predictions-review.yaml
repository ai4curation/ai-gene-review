- source_method: ProTrek
  source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
  source_reference_id: PMID:41039041
  predicted_term:
    id: GO:0033562
    label: co-transcriptional gene silencing by RNA interference machinery
  predicted_term_type: GO_BP
  review:
    assessment: PLI
    confidence_score: 0
    error_type: PARALOG_OVERANNOTATION
    summary: >-
      Rank 2 (score 17.48), absent from GOA. Co-transcriptional silencing by the RNAi machinery is
      the nuclear-Argonaute pathway of NRDE-3 and HRDE-1, which import siRNAs to the nucleus and silence
      nascent transcripts. CSR-1 is a germline Argonaute whose 22G-RNAs license and protect self-mRNAs
      against piRNA-mediated silencing - close to the opposite regulatory sign - and its chromosome
      role is holocentric segregation, not transcriptional silencing. The substitution is made explicit
      by the Subcellular_location channel, whose rank-2 hit is a sentence about siRNA binding driving
      nrde-3 into the nucleus. With 24 Argonautes in this organism, this is the hardest within-family
      discrimination in the cohort, and the model does not make it.
    supported_by:
    - reference_id: file:worm/csr-1/csr-1-uniprot.txt
      supporting_text: >-
        H2KZD5_CAEEL
- source_method: ProTrek
  source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
  source_reference_id: PMID:41039041
  predicted_term:
    id: GO:0009616
    label: RNAi-mediated antiviral immune response
  predicted_term_type: GO_BP
  review:
    assessment: PLI
    confidence_score: 0
    error_type: PARALOG_OVERANNOTATION
    summary: >-
      Rank 4 (score 16.72; reviewed in place of the unresolvable rank 3), absent from GOA. Antiviral
      RNAi in C. elegans runs through RDE-1 with DRH-1 and the RRF-1 amplification arm; CSR-1 has
      no established antiviral role. Rank 5 repeats the same claim narrowed to RNA viruses, so two
      of the top five are spent on another Argonaute's speciality. Scored MORE_SPECIFIC against a
      GOA ancestor, so ontology closure would credit both.
    supported_by:
