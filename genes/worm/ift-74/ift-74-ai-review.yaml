core_functions:
- description: With IFT-81, IFT-74 forms the tubulin-binding module of the IFT-B particle.
    The basic N-terminal region of IFT-74 binds tubulin dimers that IFT carries into the sensory
    cilium for axoneme assembly. Phosphorylation of this region by DYF-5 at the ciliary tip
    lowers its tubulin affinity and releases the tubulin, which helps set cilium length.
  supported_by:
  - reference_id: PMID:35969738
    supporting_text: Tubulin dimers are loaded to IFT machinery through an interaction between
      tubulin and the IFT-74/81 module
  - reference_id: PMID:35969738
    supporting_text: the ciliary kinase DYF-5/MAK phosphorylates multiple sites within the
      tubulin-binding module of IFT-74, reducing the tubulin-binding affinity of IFT-74/81
      approximately sixfold
