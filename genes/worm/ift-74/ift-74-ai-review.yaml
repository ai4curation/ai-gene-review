suggested_questions:
- question: Do the 11 DYF-5 phosphosites in IFT-74N act only in tubulin release, or do they
    also regulate IFT train remodeling and kinesin handover at the middle-segment and distal-segment
    tips?
- question: Does the worm IFT-74/81 module carry specific tubulin isotypes (e.g. TBB-4 vs
    TBA-5) with different affinities?
suggested_experiments:
- description: Measure binding of recombinant IFT-74/81 to purified tubulin isotypes and image
    isotype-specific tubulin transport in ift-74 phospho-mutant knock-ins.
- description: Image IFT train turnaround and kinesin-II/OSM-3 handover at the ciliary tip
    in ift-74 phospho-dead and phospho-mimic alleles.
