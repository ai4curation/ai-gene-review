gene_symbol: ift-74
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: 'IFT-74 is the Caenorhabditis elegans ortholog of IFT74, a core coiled-coil subunit
  of the intraflagellar transport complex B (IFT-B1 core). It forms a heterodimer with IFT-81
  through their coiled-coil domains, and the pair forms the tubulin-binding module of the
  IFT particle; the flexible, basic N-terminal region of IFT-74 (about residues 1-130) binds
  tubulin together with the calponin-homology domain of IFT-81. IFT-74 is expressed in ciliated
  sensory neurons, colocalizes with IFT-81 at the ciliary base and moves within sensory cilia.
  ift-74 and ift-81 loss-of-function mutants have similar phenotypes: mild defects in cilium
  formation, strongly disrupted IFT in mature cilia, dye-filling and chemosensory defects
  and small body size. At the ciliary tip the MAK-family kinase DYF-5 phosphorylates multiple
  sites in the IFT-74 N-terminal region, lowering the tubulin affinity of IFT-74/81 about
  sixfold and promoting tubulin unloading; phospho-dead and phospho-mimic ift-74 alleles produce
  elongated and shortened cilia respectively.'
