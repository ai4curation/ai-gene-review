descriptions:
- source: Alliance_Imported
  text: ift-74 encodes a protein that interacts with the intraflagellar transport
    (IFT) component IFT-81; ift-74 along with ift-81 is involved in growth, chemotaxis,
    intraflagellar transport and the morphogenesis of cilia; ift-74 colocalizes with
    ift-81 in the ciliary transition zone; ift-74 binds ift-81 in protien binding
    assays; the physical interaction of ift-74 and ift-81 and their co-localization
    indicate that they might form a complex in ciliated neurons.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00016005;class=Gene
  source_id: WB:WBGene00016005
