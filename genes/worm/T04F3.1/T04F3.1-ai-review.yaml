taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: >-
  T04F3.1 is an uncharacterized 3,460-residue (392.5 kDa) Caenorhabditis
  elegans multiregion protein encoded on chromosome V whose N-terminal ~3,100
  residues consist of repetitive polar and charged intrinsically disordered
  segments followed by a C-terminal fold-type I aminotransferase-like domain
  (residues 3107-3444) assigned to PANTHER subfamily PTHR43795:SF39. Within its
  C-terminal domain, T04F3.1 retains the core fold-type I putative Schiff-base
  Lys3294, pyridinium-stabilizing Asp3255, and alpha-carboxylate-orienting
  Arg3427, but lacks the canonical class-I aminotransferase PLP-attachment
  consensus signature and diverges extensively across the inter-subunit
  substrate-binding pocket (Glu3105, Val3108, and Met3322 at positions
  corresponding to Tyr132, Trp135, and Arg351 of human ACCS). Its cofactor
  binding, potential enzymatic or scaffolding activity, subcellular
  localization, and biological role in larval and adult nematodes are
  completely unknown.
