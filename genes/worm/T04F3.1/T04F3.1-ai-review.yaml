core_functions:
- description: >-
    Uncharacterized 3,460-residue nematode multiregion protein combining an
    extensive intrinsically disordered repetitive N-terminal region (residues
    1-3106) with a divergent C-terminal fold-type I aminotransferase-like
    domain (residues 3107-3444) that retains Lys3294, Asp3255, and Arg3427
    while substituting Glu3105, Val3108, and Met3322 across the pocket; its
    molecular activity, cellular compartment, and physiological role remain
    undetermined.
  supported_by:
  - reference_id: file:worm/T04F3.1/T04F3.1-uniprot.txt
    record_section: ["FT:DOMAIN"]
    supporting_text: "FT   DOMAIN          3107..3444"
  - reference_id: file:worm/T04F3.1/T04F3.1-notes.md
    supporting_text: >-
      Zero functional, biochemical, localization, or mutant-phenotype
      publications study `T04F3.1` directly (only the *C. elegans* genome
      sequence `PMID:9851916` and high-throughput PeptideAtlas/RNA-seq
      detections exist).
knowledge_gaps:
- gap_statement: >-
    The molecular function, potential PLP cofactor binding of the C-terminal
    domain (residues 3107-3444), role of the ~3,100-residue intrinsically
    disordered repeat N-terminus (including whether G5EE32 represents a single
    giant polypeptide or a fused/alternatively processed gene locus),
    subcellular localization, and in vivo function of C. elegans T04F3.1 are
    completely unknown.
  boundary: >-
    PeptideAtlas proteomic detection and the presence of a C-terminal PF00155
    domain retaining Lys3294/Asp3255/Arg3427 are established in UniProtKB
    G5EE32, whereas no biochemical, cell-biological, or genetic characterization
    exists in WormBase or PubMed.
  gap_kind:
  - BIOLOGY
  dark_aspect: WHOLLY_DARK
  status: OPEN
  significance: >-
    T04F3.1 is the sole C. elegans member of PANTHER family PTHR43795 and
    exhibits an extraordinary 392.5 kDa disordered-plus-PLP-domain architecture
    unlike any characterized transaminase or C-S lyase.
  resolution: >-
    Express and purify the isolated C-terminal domain (residues 3090-3460) to
    test homodimerization, PLP binding at Lys3294, and lyase/transaminase
    activity, and generate endogenous GFP knock-in and deletion alleles in C.
    elegans.
  provenance:
  - reference_id: file:worm/T04F3.1/T04F3.1-notes.md
    supporting_text: >-
      Zero functional, biochemical, localization, or mutant-phenotype
      publications study `T04F3.1` directly (only the *C. elegans* genome
      sequence `PMID:9851916` and high-throughput PeptideAtlas/RNA-seq
      detections exist).
