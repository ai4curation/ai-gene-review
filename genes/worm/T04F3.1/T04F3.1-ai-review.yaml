suggested_questions:
- question: >-
    Does T04F3.1 express as a single intact 392 kDa polypeptide in C. elegans
    larvae, and does its C-terminal PF00155 domain (residues 3107-3444) bind
    PLP at Lys3294 or serve as a non-catalytic dimerization module?
  experts:
  - Yang Hai
suggested_experiments:
- hypothesis: >-
    The isolated C-terminal PF00155 domain of T04F3.1 (residues 3090-3460)
    folds into a dimeric PLP-binding domain or pseudoenzyme scaffold, while the
    N-terminal disordered region mediates biomolecular condensate or
    cytoskeletal localization in C. elegans larvae.
  description: >-
    Purify recombinant T04F3.1(3090-3460) and K3294A to test oligomeric state
    and UV-vis PLP binding, and characterize endogenous C-terminal mNeonGreen
    knock-in localization and null-allele phenotypes in C. elegans.
  experiment_type: Domain biochemistry and C. elegans CRISPR knock-in/knockout
