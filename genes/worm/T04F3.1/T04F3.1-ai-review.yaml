core_functions:
- description: >-
    Uncharacterized 3,460-residue nematode multiregion protein combining an
    extensive intrinsically disordered repetitive N-terminal region (residues
    1-3106) with a divergent C-terminal fold-type I aminotransferase-like
    domain (residues 3107-3444) that retains Lys3294, Asp3255, and Arg3427
    while substituting Glu3105, Val3108, and Met3322 across the pocket; its
    molecular activity, cellular compartment, and physiological role remain
    undetermined.
  supported_by:
  - reference_id: file:worm/T04F3.1/T04F3.1-uniprot.txt
    record_section: ["FT:DOMAIN"]
    supporting_text: "FT   DOMAIN          3107..3444"
  - reference_id: file:worm/T04F3.1/T04F3.1-notes.md
    supporting_text: >-
      Zero functional, biochemical, localization, or mutant-phenotype
      publications study `T04F3.1` directly (only the *C. elegans* genome
      sequence `PMID:9851916` and high-throughput PeptideAtlas/RNA-seq
      detections exist).
knowledge_gaps:
- gap_statement: >-
    The molecular function, potential PLP cofactor binding of the C-terminal
    domain (residues 3107-3444), role of the ~3,100-residue intrinsically
    disordered repeat N-terminus (including whether G5EE32 represents a single
    giant polypeptide or a fused/alternatively processed gene locus),
    subcellular localization, and in vivo function of C. elegans T04F3.1 are
    completely unknown.
  boundary: >-
    PeptideAtlas proteomic detection and the presence of a C-terminal PF00155 domain retaining
    Lys3294/Asp3255/Arg3427 are established in UniProtKB G5EE32, whereas no biochemical,
    cell-biological, or genetic characterization exists in WormBase or PubMed. An OpenScientist run
    (kgap-t04f31-plp-and-gene-model) answers two of the four sub-questions put to it, says plainly that
    two cannot be settled, and corrects one claim this review asserts elsewhere. PLP binding is
    predicted. Contacts were computed from deposited coordinates rather than quoted, as every residue
    with a heavy atom within 4 Angstrom of the PLP ligand in apple ACC synthase, tomato LE-ACS2 and two
    E. coli aspartate aminotransferase structures, then mapped by global alignment. The same-chain
    pocket is largely intact: T04F3.1 keeps the Ser-x-Ser-Lys phosphate cup at Ser3291, Ser3293 and
    Lys3294, the aspartate that salt-bridges the pyridinium nitrogen at Asp3255, the asparagine of the
    phosphate loop at Asn3227, the re-face tyrosine at Tyr3171 and the substrate alpha-carboxylate
    arginine at Arg3427, all identical to apple ACS and all confirmed in the local G5EE32 record, which
    is 3,460 residues. Of 14 cofactor and substrate positions, 8 are identical and 4 conservative. That
    is the distinction the hypothesis asked for: a retained Schiff-base lysine in a pocket that still
    has its phosphate-binding residues, which is a different claim from a stranded lysine in a degraded
    site. The missing PROSITE PS00105 signature carries much less weight than its absence suggests,
    because T04F3.1 fails it at exactly one position, a conservative Arg to Lys at 3302 that preserves
    the charge, and human ACCS fails the same pattern at a different position while keeping a complete
    phosphate cup; the genuinely degraded case is human ACCSL, which has lost the Schiff-base lysine
    region. Across 14 nematode orthologs the same-chain PLP contacts hold at 0.87 mean identity while
    the cross-subunit dimer-interface positions drift to 0.50 in the same alignments, so the pocket is
    maintained rather than coincidentally retained over roughly 300 million years. The gene model is
    sound. The locus is a single compact 14,047 base-pair plus-strand gene on chromosome V with 17 exons
    and a median intron of 98 base pairs, no protein-coding gene inside its span, only an 85 base-pair
    non-coding RNA, and two curated isoforms of 3,460 and 3,393 residues that both carry the repeat
    region and the aminotransferase domain. The same giant architecture is independently annotated in
    ten nematode species across at least four genera, and a mis-joined model is a per-assembly error
    that does not recur independently across ten genome projects. Two sub-questions cannot be settled:
    pocket enclosure and N-terminal occlusion, because no AlphaFold model exists for G5EE32 and there is
    no experimental structure, though MobiDB places the disordered region ending about 700 residues
    before the domain, which weakly argues against the simplest occlusion scenario; and direct
    end-to-end transcript support, because WormBase and ParaSite endpoints were unreachable and the
    RefSeq entry is genome-derived with no evidence block. The correction concerns the residue
    correspondence this review asserts in its description and elsewhere, that Glu3105, Val3108 and
    Met3322 sit at the positions of human ACCS Tyr132, Trp135 and Arg351. Met3322 against Arg351 is
    reproduced exactly. The other two are not: global alignment maps ACCS Tyr132 to Tyr3110 and Trp135
    to Ala3113, an offset of five residues, and re-aligning the local windows under six gap-penalty
    settings returned the same answer in all six. All four residues exist in the local sequence,
    Glu3105, Val3108, Tyr3110 and Ala3113, and the window the run quotes matches the record verbatim, so
    the disagreement is about alignment register and not about the sequence. The run is candid that this
    loop is the least certain part of its alignment, since T04F3.1 also has Trp3116 nearby, and it notes
    that apple ACS itself carries Ser where human ACCS has Arg351, so ACCS is not a conserved benchmark
    at that position either. The deeper point stands independently of the register: these residues are
    cross-subunit dimer-interface positions rather than same-chain cofactor contacts, so their
    divergence bears on substrate specificity and on whether the canonical dimer can form, not on
    whether the chain can bind PLP. Everything here is computational, with no assay, mutant,
    localization or interaction evidence in any organism, the contact mapping rests on alignments at 23
    to 27 per cent identity to the reference structures, and the cofactor site is better supported than
    any catalytic assignment because the substrate-determining loop is the divergent part.
  gap_kind:
  - BIOLOGY
  dark_aspect: WHOLLY_DARK
  status: NARROWING
  significance: >-
    T04F3.1 is the sole C. elegans member of PANTHER family PTHR43795 and
    exhibits an extraordinary 392.5 kDa disordered-plus-PLP-domain architecture
    unlike any characterized transaminase or C-S lyase.
  resolution: >-
    Express and purify the isolated C-terminal domain (residues 3090-3460) to
    test homodimerization, PLP binding at Lys3294, and lyase/transaminase
    activity, and generate endogenous GFP knock-in and deletion alleles in C.
    elegans.
  provenance:
  - reference_id: file:worm/T04F3.1/T04F3.1-notes.md
    supporting_text: >-
      Zero functional, biochemical, localization, or mutant-phenotype
      publications study `T04F3.1` directly (only the *C. elegans* genome
      sequence `PMID:9851916` and high-throughput PeptideAtlas/RNA-seq
      detections exist).
  - reference_id: file:worm/T04F3.1/T04F3.1-hypotheses/kgap-t04f31-plp-and-gene-model/openscientist.md
    supporting_text: >-
      This is the distinction the hypothesis asked for: a retained Schiff-base lysine sitting in a
      pocket that still has its phosphate-binding residues, which is a different claim from a
      stranded lysine in a degraded site.
references:
- id: file:worm/T04F3.1/T04F3.1-hypotheses/kgap-t04f31-plp-and-gene-model/openscientist.md
  title: OpenScientist analysis of PLP binding and gene-model soundness for C. elegans T04F3.1
  findings:
  - statement: >-
      The same-chain PLP pocket is largely intact, with the phosphate cup, pyridinium aspartate,
      phosphate-loop asparagine, re-face tyrosine and carboxylate arginine all identical to apple ACC
      synthase and held at 0.87 mean identity across 14 nematode orthologs, while the cross-subunit
      interface drifts to 0.50; the missing PROSITE signature is not diagnostic, since human ACCS fails
      it too; and the locus is a single compact gene whose giant architecture recurs in ten nematode
      species, which rules against a fusion artefact.
    supporting_text: >-
      A mis-joined gene model is a per-assembly annotation error; it does not recur independently
      across ten separate genome projects.
  reference_review:
    relevance: HIGH
    correctness: UNVERIFIED
    review_notes: >-
      Computed results only; the run's literature quotations were not independently re-verified. Verified
      locally against G5EE32, which is 3,460 residues: Ser3291, Ser3293, Lys3294, Asp3255, Asn3227,
      Tyr3171, Arg3427, Lys3302 and Trp3116 are all as stated, as are both the residues this review
      asserts, Glu3105 and Val3108, and the two the run maps instead, Tyr3110 and Ala3113, and the
      sequence window the run quotes matches the record verbatim. The disagreement is therefore about
      alignment register, not sequence, and the run itself calls this loop the least certain part of its
      alignment. Not verified: the PLP contact sets computed from 1B8G, 1IAX, 1ARS and 1ASM, the
      14-ortholog conservation figures, the locus coordinates and exon structure, the ten-species
      architecture survey, and the human ACCS and ACCSL comparisons. No annotation action was changed.
