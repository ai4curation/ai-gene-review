    Two annotation reason fields on this gene argue partly from the absence of PROSITE PS00105 and from
    the Glu3105/Val3108/Met3322 correspondence to human ACCS Tyr132/Trp135/Arg351. A later analysis finds
    the PS00105 absence non-diagnostic, since human ACCS fails the same pattern while keeping a complete
    phosphate cup, and reproduces only the Met3322 correspondence. Do those actions still stand on their
    remaining grounds, the zero functional data and the PAINT node depth?
