gene_symbol: agef-1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: agef-1 (Y6B3A.1) encodes AGEF-1, the single C. elegans member of the BIG subfamily of Sec7-domain
  guanine-nucleotide exchange factors for ADP-ribosylation factor (Arf) GTPases. It is orthologous to
  yeast Sec7p and human BIG1 (ARFGEF1) and BIG2 (ARFGEF2). The 1594-residue protein has the conserved
  DCB, HUS, Sec7 (catalytic), HDS and C-terminal domains of the family and no transmembrane segment. It
  acts at the trans-Golgi network, where it activates class I/II Arfs (ARF-1.2, ARF-3, ARF-1, ARF-5 in
  genetic studies) to drive AP-1-dependent cargo sorting and post-Golgi secretory transport. Loss of function
  inflates trans-Golgi cisternae, traps caveolin bodies in the Golgi, and impairs secretion from muscle
  and intestine. It also enlarges late endosomes/lysosomes in coelomocytes and increases basolateral LET-23
  EGFR in vulval precursor cells, which enhances vulval induction. In the epidermis it acts upstream of
  RAB-35 to tune neuron-epidermal attachment, and the human BIG2 cDNA can substitute for it there. A catalytically
  dead Sec7 mutant acts as a dominant negative, so these roles depend on Arf exchange activity. No in
  vitro exchange assay has been reported for the worm protein.
