- id: PMID:23840591
  title: The ArfGEF GBF-1 Is Required for ER Structure, Secretion and Endocytic Transport in C. elegans.
  findings:
  - statement: agef-1 RNAi inflates Golgi cisternae in oocytes, consistent with a trans-Golgi exit block,
      in contrast to the cis-Golgi defect of the paralog GBF-1.
    supporting_text: agef-1(RNAi) resulted in large inflated cisternae, consistent with a block in secretion
      at the trans-Golgi
  - statement: AGEF-1 is required for Golgi-to-plasma-membrane transport of caveolin bodies in oocytes.
    supporting_text: In the absence of AGEF-1 or ARF-1.2, the internal CAV-1 structures become trapped
      in a perinuclear Golgi compartment
  - statement: The C. elegans germline Golgi is dispersed in mini-stacks next to ER exit sites.
    supporting_text: The Golgi in C. elegans germ line is organized in small mini stacks localized in
      close proximity to ER-exit sites (ERES).
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text read. The paper is mainly about GBF-1 but runs agef-1 RNAi side by side (Golgi
      morphology, TEM, ER, CAV-1 and yolk secretion). Its CAV-1 statement summarises earlier work (its
      ref. 3).
- id: PMID:25329472
  title: An AGEF-1/Arf GTPase/AP-1 ensemble antagonizes LET-23 EGFR basolateral localization and signaling
    during C. elegans vulva induction.
  findings:
  - statement: agef-1(vh4) animals are defective in secretion from body wall muscle and intestine.
    supporting_text: Consistent with yeast Sec7p and human BIG1/BIG2 functioning in the secretory pathway,
      we found that agef-1(vh4) animals had defects in secretion of ssGFP from body wall muscles and Yolk::GFP
      from the intestine.
  - statement: AGEF-1 regulates polarized SID-2 localization and late endosome/lysosome size with AP-1.
    supporting_text: We show that AGEF-1 regulates protein secretion in multiple tissues, regulates polarized
      localization of the SID-2 transmembrane protein in the intestine, and regulates the size of late
      endosomes/lysosomes with the AP-1 complex in the macrophage/scavenger cell-like coelomocytes.
  - statement: ARF-1.2 and ARF-3 act with AGEF-1 as negative regulators of LET-23 EGFR signalling.
    supporting_text: In accordance with AGEF-1 being an Arf GEF, we found that ARF-1.2 and ARF-3, Class
      I/II Arf GTPases, also negatively regulate LET-23 EGFR signaling.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text read. This is the main genetic characterisation (vh4 allele). The GEF activity
      is inferred from homology and is not assayed.
- id: PMID:42312793
  title: A conserved Arf-GEF modulates axonal integrity through RAB-35 by altering neuron-epidermal attachment.
  findings:
  - statement: A Sec7 catalytic-dead AGEF-1[E608K] acts as a dominant negative in the epidermis.
    supporting_text: To test this notion, we engineered a dominant negative agef-1 cDNA (AGEF-1[E608K]),
      which mimics a previously validated mutation in BIG2 that renders the SEC7 domain catalytically
      inactive
  - statement: Human BIG2 expressed in the epidermis rescues agef-1 loss.
    supporting_text: Importantly, we found that SKIN::BIG2 fully restored the penetrance of PLM axon breaks
  - statement: Endogenously tagged AGEF-1 is in cytoplasmic and membrane-associated puncta in the epidermis.
    supporting_text: We found that epidermal AGEF-1::GFPx7 and AGEF-1[S784L]::GFPx7 localized to small
      puncta throughout the cytoplasm and membrane of the epidermis
  - statement: AGEF-1 is in proximity to RAB-35 in vivo (split GFP), directly or indirectly.
    supporting_text: These results demonstrate that a subset of AGEF-1 is in proximity to RAB-35 in vivo
      suggesting that these molecules interact, either directly or indirectly
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text read. Residue numbers E608 and S784 match the displayed G5EFH7 sequence. The
      split-GFP result shows proximity, not direct binding or RAB-35 exchange activity.
- id: PMID:42388253
  title: An activating mutation in AGEF-1, a putative Arf GEF, causes yolk extrusion from C. elegans embryos.
  findings:
  - statement: agef-1(vh4) E1028K in HDS2 is predicted, from the Sec7p structure, to be activating. Its
      yolk phenotype needs ARF-1 and ARF-5.
    supporting_text: Based on structure of the yeast AGEF-1 ortholog, Sec7p, the E1028K change is predicted
      to activate AGEF-1
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: microPublication. Residue E1028 matches G5EFH7. Activation is predicted structurally,
      not measured biochemically.
