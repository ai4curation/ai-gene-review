  review:
    summary: Vesicle-mediated transport, from the Sec7-family node PTN008950430.
    action: MODIFY
    reason: 'This is correct but too general. For the BIG subfamily the established process is post-Golgi
      transport from the TGN. AGEF-1 does a step of it: it loads GTP onto Arfs, which recruit AP-1/clathrin
      coats to TGN membranes. This is participation, not only necessity. Worm loss-of-function blocks
      Golgi exit of caveolin bodies and secretion of ssGFP and yolk, which matches that step. Golgi to
      plasma membrane transport (GO:0006893, a descendant via post-Golgi vesicle-mediated transport) is
      the best-supported refinement. It is also the process the human ortholog ARFGEF2 carries as core.'
