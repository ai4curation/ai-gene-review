    summary: Guanine-nucleotide exchange factor activity inherited from the Sec7/BIG ancestral node (PTN008950430).
      AGEF-1 carries a complete Sec7 domain (residues 506-695) within the DCB-HUS-Sec7-HDS architecture
      of the BIG1/BIG2/Sec7p subfamily.
    action: ACCEPT
    reason: The PAINT node is seeded by experimentally characterised Sec7 GEFs (yeast Sec7p, Gea1/Gea2,
      human BIG1/BIG2 and GBF1), and AGEF-1 sits inside the BIG clade with no sign of losing the catalytic
      domain. Worm in vivo evidence agrees. A Sec7 glutamic-finger mutant (E608K, matching the catalytically
      dead BIG2 E738K) acts as a dominant negative and phenocopies loss of agef-1, and human BIG2 rescues
      the mutant. No in vitro exchange assay exists for the worm protein. GO:0005086 ARF GEF activity
      has been merged into GO:0005085, so this is the most specific term available. Core function.
