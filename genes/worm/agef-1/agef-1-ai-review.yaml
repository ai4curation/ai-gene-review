suggested_questions:
- question: Which Arf paralogs does AGEF-1 activate directly? Genetic data implicate ARF-1.2/ARF-1, ARF-3
    and ARF-5, but no exchange assay has been done with the worm protein.
- question: Does AGEF-1 act on RAB-35 directly (as Sec7p acts as a Ypt effector), or only through an Arf
    intermediate such as ARF-5 stimulating the RAB-35 GEF RME-4/DENND1?
- question: Should WormBase capture the published agef-1 mutant and RNAi phenotypes (secretion, LET-23
    EGFR basolateral localization, lysosome size) as GO process annotations? They currently have no experimental
    GO rows. Under the participation criterion, only the trafficking steps where the GEF acts would qualify,
    not the downstream signalling outcomes.
suggested_experiments:
- description: Purify the AGEF-1 Sec7 domain (with and without the E608K glutamic-finger mutation) and
    measure GDP/GTP exchange on myristoylated ARF-1.2, ARF-3, ARF-5 and RAB-35 on liposomes, to define
    substrate specificity.
- description: Co-image endogenously tagged AGEF-1 with TGN (e.g. AP-1/APM-1), Golgi and recycling-endosome
    markers in intestine and epidermis, to place the protein directly rather than by phenotype.
