  review:
    summary: Perinuclear region of cytoplasm, from the UniProt subcellular-location vocabulary (ARBA-derived).
    action: MARK_AS_OVER_ANNOTATED
    reason: 'The perinuclear concentration of BIG1/BIG2 in mammalian cells reflects the pericentriolar
      Golgi ribbon. C. elegans has no ribbon: its Golgi is dispersed mini-stacks next to ER exit sites.
      Endogenously tagged epidermal AGEF-1 is in puncta throughout the cytoplasm, not perinuclear. The
      only "perinuclear" worm observation is a phenotype: in agef-1 loss of function, cargo becomes trapped
      in a perinuclear Golgi compartment. That describes the cargo, not the location of AGEF-1. The source
      is an ARBA prediction, which is not evidence. The term is not impossible, but nothing supports it
      for this protein.'
    supported_by:
    - reference_id: PMID:23840591
      supporting_text: The Golgi in C. elegans germ line is organized in small mini stacks localized in
        close proximity to ER-exit sites (ERES).
