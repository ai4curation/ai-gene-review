gene_symbol: agef-1
organism: worm
uniprot_id: G5EFH7
taxon_id: NCBITaxon:6239
descriptions:
- source: Alliance_Imported
  text: agef-1 encodes a putative ARF guanine nucleotide exchange factor orthologous
    to human ARFGEF1 (OMIM:604141) and ARFGEF2 (OMIM:605371); agef-1(RNAi) inhibits
    CAV-1 body formation in oocytes more severely than arf-1 disruption alone, indicating
    that activation of both ARF-1 and ARF-3 by AGEF-1 may be required for transport
    of caveolin from Golgi to CAV-1 bodies during oogenesis; more generally, AGEF-1
    is required in mass RNAi assays for embryonic and larval viability, embryonic
    osmotic integrity, normal neurotransmission, locomotion, and osmoregulation, and
    normally rapid growth.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00012386;class=Gene
  source_id: WB:WBGene00012386
- source: Alliance_Automated
  text: Predicted to enable guanyl-nucleotide exchange factor activity. Predicted
    to be involved in vesicle-mediated transport. Predicted to be located in Golgi
    apparatus; membrane; and perinuclear region of cytoplasm. Predicted to be active
    in trans-Golgi network. Is expressed in coelomocyte; intestine; muscle cell; and
    neurons. Human ortholog(s) of this gene implicated in epilepsy and periventricular
    nodular heterotopia. Orthologous to several human genes including ARFGEF2 (ARF
    guanine nucleotide exchange factor 2).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00012386;class=Gene
  source_id: WB:WBGene00012386
