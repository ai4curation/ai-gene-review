suggested_questions:
- question: Which lysines of POLH-1 (and POLK-1) does GEI-17 SUMOylate, and is POLK-1 a direct 
    GEI-17 substrate as suggested by epistasis?
- question: Does GEI-17 directly SUMOylate HDA-1 in the adult germline, and how is labour divided 
    between GEI-17 and PIE-1 in piRNA-directed silencing?
- question: Is GEI-17 required for mitotic metaphase chromosome alignment through AIR-2 or other 
    chromatin substrates, warranting a mitotic counterpart to the meiotic alignment annotation?
- question: Which telomere-associated protein (e.g. POT-1 or SUN-1) is the GEI-17 substrate for 
    perinuclear telomere anchoring in embryos?
- question: Do any GEI-17 outputs (tbx-2 repression, piRNA condensate inhibition) depend on 
    SIM-mediated binding rather than E3 catalysis?
suggested_experiments:
- hypothesis: SUMOylation of POLH-1 by GEI-17 is the signal that protects it from CRL4-Cdt2.
  description: Map GEI-17-dependent SUMO sites on POLH-1 by mass spectrometry, introduce K-to-R 
    mutations at the endogenous locus by CRISPR, and test POLH-1 stability, embryonic MMS/UV 
    sensitivity and checkpoint activation.
  experiment_type: site-directed mutagenesis
- hypothesis: Catalytic and SIM-dependent functions of GEI-17 are separable.
  description: Generate endogenous SP-RING (L417A) and SIM-mutant gei-17 alleles and score DNA 
    damage tolerance, meiotic ring complex assembly, tbx-2 repression and piRNA sensor silencing (in
