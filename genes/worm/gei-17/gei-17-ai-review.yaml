- term:
    id: GO:0046426
    label: negative regulation of receptor signaling pathway via JAK-STAT
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - FB:FBgn0003612
  - PANTHER:PTN000845825
  - UniProtKB:O75925
  review:
    summary: IBA from a PIAS1/Su(var)2-10 subnode (PTN000845825) for negative regulation of JAK-STAT
      receptor signalling. C. elegans has no JAK kinase, so the receptor-JAK-STAT pathway this term
      regulates does not exist in the organism.
    action: REMOVE
    reason: The function is grounded in human PIAS1 (inhibition of STAT1) and fly Su(var)2-10, and the
      node placement is sound for those lineages. But the term presupposes a receptor-JAK-STAT pathway,
      and C. elegans lacks a conserved JAK homolog; its STAT STA-1 acts in a JAK-independent pathway
      (PMID:28874466). None of the GEI-17 literature (DNA damage tolerance, chromosome segregation,
      transcription factor SUMOylation, germline silencing) involves STAT. This is the same
      lineage-inappropriate transfer as the JAK-STAT IBA on worm sta-2; the nematode branch needs an
      IRD (or GEI-17 a NOT annotation). The PTHR10782 FamilyReview agrees; it rates this node
      NEEDS_PRUNING and, because SF94 also holds the valid fly seed, records GEI-17 as a member
      exception to the SF94 scope for this term, anchored to PTN000845825.
      Liongue & Ward (2013) date assembly of the canonical JAK-STAT pathway to the bilaterian ancestor,
      before protostomes diverged, which is why the eumetazoan PIAS node is a sound place for the IBD
      and the nematode JAK absence is a lineage-specific loss calling for an IRD, not a node move. The
      PIAS name itself is no evidence for the term; Palvimo (2007) notes PIAS functions are not restricted
      to STATs.
    supported_by:
    - *id005
    - reference_id: PMID:28874466
      supporting_text: There is no conserved homolog of the JAK kinases in C. elegans
    - reference_id: PMID:28874466
      supporting_text: the absence of both interferon and JAK, the C. elegans STAT homolog STA-1
    - reference_id: PMID:24058787
      supporting_text: These came together to form the canonical JAK-STAT signaling pathway prior to the
        divergence of protostomia
    - reference_id: PMID:18031232
      supporting_text: PIAS proteins were initially named for their ability to interact with STAT proteins
        and inhibit their activity, but their interactions and functions are not restricted to the STATs.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - LINEAGE_OR_TAXON_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN000845825
        source_label: PTN000845825
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Eumetazoan PIAS node seeded by human PIAS1 (STAT1 inhibition) and fly Su(var)2-10, both
          sound. GEI-17 descends through the ecdysozoan node into the nematode branch, where no JAK
          exists (PMID:28874466); the inheritance needs an IRD on that branch.
