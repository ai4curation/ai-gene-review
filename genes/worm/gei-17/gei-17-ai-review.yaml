id: Q94361
gene_symbol: gei-17
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: gei-17 encodes the single PIAS/Siz-family SP-RING-type SUMO E3 ligase of Caenorhabditis
  elegans, co-orthologous to human PIAS1/PIAS2 and Drosophila Su(var)2-10. It contains a PINIT 
  domain, a zinc-coordinating SP-RING (MIZ-type) zinc finger required for E3 activity, and 
  C-terminal SUMO-interacting motifs. Working with the E2 UBC-9 and SUMO (SMO-1), GEI-17 catalyses 
  SUMO conjugation to nuclear substrates, including MUS-101/TopBP1, the translesion DNA polymerase 
  POLH-1, Aurora B/AIR-2, the chromokinesin KLP-19 and BUB-1, and auto-SUMOylates and forms SUMO 
  chains. In early embryos GEI-17 associates with damaged chromatin and SUMOylates POLH-1, 
  protecting it from CRL4-Cdt2-mediated proteolysis so that translesion synthesis can proceed; loss 
  of gei-17 causes replication fork stalling on damaged templates, activation of the otherwise 
  silenced embryonic DNA damage checkpoint and sensitivity to MMS and UV. GEI-17 localises to the 
  metaphase plate and drives metaphase SUMO conjugation in mitosis, and in acentrosomal oocyte 
  meiosis it builds a SUMO-SIM network that assembles the midbivalent ring complex (KLP-19, BUB-1, 
  AIR-2) needed for chromosome congression and regulates BUB-1 and CLS-2 dynamics in anaphase I. It 
  also contributes to SUMO-dependent transcriptional repression (tbx-2 autorepression, LIN-1 in 
  vulval development), perinuclear telomere anchoring in embryos, and, redundantly with PIE-1, HDA-1
  SUMOylation and piRNA-directed germline silencing and fertility. Null alleles are embryonic 
  lethal.
