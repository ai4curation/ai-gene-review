- term:
    id: GO:0140416
    label: transcription regulator inhibitor activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN000845825
  - UniProtKB:O75925
  review:
    summary: IBA for transcription regulator inhibitor activity from the PIAS1-seeded node 
      PTN000845825 (human PIAS1 blocks STAT1/p65 DNA binding).
    action: UNDECIDED
    reason: GO:0140416 covers inhibiting a transcription regulator by direct binding or by
      post-translational modification, so a SUMO E3 that inhibits transcription factors by
      SUMOylating them would fit it. An earlier version of this review marked the term over-annotated
      on the grounds that GEI-17's transcriptional effects need its ligase activity; that reading was
      wrong, because ligase-dependent inhibition is within the term. What the evidence does exclude is
      a binding route through the SAP domain. An OpenScientist analysis found GEI-17 has no SAP domain
      detectable by Pfam, PROSITE or InterPro (UniProt lists only PINIT and the SP-RING zinc finger,
      whereas PIAS1 carries IPR003034), and in human PIAS1 the ligase-independent inhibition does not
      need the SAP domain anyway; it maps to a C-terminal region that sequesters the transcription
      factor (PMID:24036127), as for PIASy and Oct4 (PMID:17991485). The modification route is
      plausible but not shown. GEI-17 inhibits formation of piRNA transcription condensates built by
      the USTC transcription complex in a SUMOylation-dependent way (PMID:40316696), but the cached
      abstract does not say whether GEI-17 SUMOylates USTC components directly, and the full text is
      not available. Other worm SUMOylation targets (TBX-2, LIN-1) are SUMOylated to support, not
      inhibit, their repressor function. Nor is the ligase-independent binding route excluded,
      because a positional check finds that GEI-17 keeps a motif-predicted SIM-like core followed
      by an acidic run (IITLSDDDDEEL, aa 545-556) at essentially the same distance past the SP-RING
      (+63 vs +62) as PIAS1's SIM-adjacent acidic cluster, the likeliest candidate for the region
      PMID:24036127 maps the activity to, although whether GEI-17 binds a transcription regulator
      through it is untested. The IBA is therefore neither confirmed nor refuted.
    supported_by:
    - *id002
    - reference_id: PMID:24036127
      supporting_text: PIAS1 with a mutation in the SAP domain retained the inhibitory function in
        virus-induced IFN transcription
    - reference_id: PMID:24036127
      supporting_text: SUMO E3 ligase activity dead mutant PIAS1/C350S still had the comparable
        inhibitory function with WT PIAS1
    - reference_id: PMID:17991485
      supporting_text: These modes of PIASy action are uncoupled from its sumoylation activity
    - reference_id: PMID:40316696
      supporting_text: isolated the SUMO E3 ligase GEI-17 as inhibiting and the SUMO protease TOFU-3
        as promoting piRNA transcription foci formation
    - reference_id: file:worm/gei-17/gei-17-uniprot.txt
      supporting_text: PS51044; ZF_SP_RING
    - reference_id: file:human/PIAS1/PIAS1-uniprot.txt
      supporting_text: IPR003034; SAP_dom
    - reference_id: file:worm/gei-17/gei-17-hypotheses/gei17-sap-sim-coregulator/openscientist.md
      supporting_text: For GEI-17 (Q94361), **none** of these methods call a SAP domain
    - reference_id: file:worm/gei-17/gei-17-bioinformatics/RESULTS.md
      supporting_text: GEI-17 keeps a positionally equivalent, motif-predicted SIM-plus-acidic module after the
    propagation_review:
      root_cause: UNRESOLVED
      source_entities:
      - source_id: PANTHER:PTN000845825
        source_label: PTN000845825
