- source: Alliance_Imported
  text: gei-17 encodes a SUMO E3 ligase; during embryonic development, GEI-17 activity
    is required for maintaining normal levels of the DNA polymerase eta POLH-1, and
    hence checkpoint silencing, in embryos exposed to DNA damage; gei-17 mutations
    affect embryonic viability, vulval development, and body morphology; in vitro,
    GEI-17 has been demonstrated to sumoylate AIR-2, MUS-101, POLH-1, as well as to
    undergo autosumoylation; GEI-17 interacts with GEX-3 in yeast two-hybrid assays.
  source_type: curated
