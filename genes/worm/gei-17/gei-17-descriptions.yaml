- source: Alliance_Automated
  text: Enables RNA polymerase II-specific DNA-binding transcription factor binding
    activity and SUMO ligase activity. Involved in several processes, including meiotic
    metaphase I homologous chromosome alignment; protein sumoylation; and regulation
    of cellular response to stress. Located in chromatin and metaphase plate. Is expressed
    in motor neurons. Orthologous to several human genes including PIAS1 (protein
    inhibitor of activated STAT 1); PIAS2 (protein inhibitor of activated STAT 2);
    and PIAS3 (protein inhibitor of activated STAT 3).
