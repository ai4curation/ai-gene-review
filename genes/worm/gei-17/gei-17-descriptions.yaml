descriptions:
- source: UniProt
  text: Functions as an E3-type smo-1 ligase (PubMed:15654100, PubMed:16549501, PubMed:16701625,
    PubMed:25475837). Mediates smo-1 conjugation to air-2 in vitro and is required
    for proper chromosome alignment (PubMed:25475837). In the early embryo, specifically
    suppresses checkpoint activation in response to DNA damage, maybe by promoting
    mus-101 sumoylation (PubMed:15654100). In embryos, plays a role in determining
    telomere localization in the nucleus (PubMed:24297748). Acts with pie-1 to promote
    piRNA-mediated silencing and fertility in the adult germline (PubMed:34003111).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q94361
  source_id: Q94361
