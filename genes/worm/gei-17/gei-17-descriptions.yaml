gene_symbol: gei-17
organism: worm
uniprot_id: Q94361
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Functions as an E3-type smo-1 ligase (PubMed:15654100, PubMed:16549501, PubMed:16701625,
    PubMed:25475837). Mediates smo-1 conjugation to air-2 in vitro and is required
    for proper chromosome alignment (PubMed:25475837). In the early embryo, specifically
    suppresses checkpoint activation in response to DNA damage, maybe by promoting
    mus-101 sumoylation (PubMed:15654100). In embryos, plays a role in determining
    telomere localization in the nucleus (PubMed:24297748). Acts with pie-1 to promote
    piRNA-mediated silencing and fertility in the adult germline (PubMed:34003111).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q94361
  source_id: Q94361
- source: Alliance_Imported
  text: gei-17 encodes a SUMO E3 ligase; during embryonic development, GEI-17 activity
    is required for maintaining normal levels of the DNA polymerase eta POLH-1, and
    hence checkpoint silencing, in embryos exposed to DNA damage; gei-17 mutations
    affect embryonic viability, vulval development, and body morphology; in vitro,
    GEI-17 has been demonstrated to sumoylate AIR-2, MUS-101, POLH-1, as well as to
    undergo autosumoylation; GEI-17 interacts with GEX-3 in yeast two-hybrid assays.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00001574;class=Gene
  source_id: WB:WBGene00001574
- source: Alliance_Automated
  text: Enables RNA polymerase II-specific DNA-binding transcription factor binding
    activity and SUMO ligase activity. Involved in several processes, including meiotic
    metaphase I homologous chromosome alignment; protein sumoylation; and regulation
    of cellular response to stress. Located in chromatin and metaphase plate. Is expressed
    in motor neurons. Orthologous to several human genes including PIAS1 (protein
    inhibitor of activated STAT 1); PIAS2 (protein inhibitor of activated STAT 2);
    and PIAS3 (protein inhibitor of activated STAT 3).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00001574;class=Gene
  source_id: WB:WBGene00001574
