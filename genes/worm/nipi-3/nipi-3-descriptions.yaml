gene_symbol: nipi-3
organism: worm
uniprot_id: G5EED4
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Adapter protein that regulates different signaling pathways (By similarity).
    Required for larval development and viability (PubMed:27927209). Involved in negatively
    modulating pmk-1 p38/MAPK signaling (PubMed:27927209). Involved in innate immunity,
    acting either in a manner dependent upon, or independent of, the pmk-1 or pmk-3
    p38/MAPK pathways (PubMed:18394898, PubMed:27927200, PubMed:34407394). Has a protective
    role in response to infection by the Gram-negative bacterium P.aeruginosa, acting
    by negatively modulating expression of cebp-1, and regulating the pmk-1 p38/MAPK
    pathway, leading to activation of transcription factor skn-1 (PubMed:27927200,
    PubMed:34407394). Required to prevent P.aeruginosa toxin ToxA-mediated lethality,
    probably acting via modulating the effects of translational inhibition caused
    by the toxin (PubMed:27927200). By regulating the up- regulation in the epidermis
    of antimicrobial peptides nlp-29 and nlp- 31, plays a role in resistance to fungal
    infection (PubMed:18394898, PubMed:27927200).
  source_type: curated
  url: https://www.uniprot.org/uniprot/G5EED4
  source_id: G5EED4
- source: Alliance_Imported
  text: nipi-3 encodes a kinase similar to the human kinase Tribbles homolog 1; nipi-3
    functions in the innate immune response, likely upstream of the SEK-1 MAPKK, to
    upregulate expression of NLP-29, an antimicrobial peptide, in response to fungal
    infection.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00010700;class=Gene
  source_id: WB:WBGene00010700
- source: Alliance_Automated
  text: Enables DNA-binding transcription factor binding activity. Involved in antifungal
    innate immune response; defense response to bacterium; and regulation of gene
    expression. Located in nucleus. Is expressed in several structures, including
    hypodermis; intestine; neurons; pharynx; and spermatheca. Human ortholog(s) of
    this gene implicated in familial hyperlipidemia. Orthologous to human TRIB1 (tribbles
    pseudokinase 1).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00010700;class=Gene
  source_id: WB:WBGene00010700
