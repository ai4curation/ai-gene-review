descriptions:
- source: UniProt
  text: Subunit of the V0 complex of vacuolar(H+)-ATPase (V-ATPase), a multisubunit
    enzyme composed of a peripheral complex (V1) that hydrolyzes ATP and a membrane
    integral complex (V0) that translocates protons (By similarity). V-ATPase is responsible
    for acidifying and maintaining the pH of intracellular compartments and in some
    cell types, is targeted to the plasma membrane, where it is responsible for acidifying
    the extracellular environment (By similarity). Required for assembly and activity
    of the vacuolar ATPase (By similarity). Regulates the size of gut granules during
    embryonic development (PubMed:20148972). In neurons, required for necrotic cell
    death by promoting intracellular acidification (PubMed:16005300). Required for
    cell death induced by hypoxia (PubMed:16005300). Required for acidification of
    synaptic vesicles and the release of neurotransmitters from adult neurons (PubMed:22426883).
