- source: Alliance_Imported
  text: unc-32 encodes, by alternative splicing, six isoforms of an ortholog of subunit
    a of the membrane-bound (V0) domain of vacuolar proton-translocating ATPase (V-ATPase);
    UNC-32 is orthologous to human ATP6N1A (OMIM:192130), ATP6V0A2, ATP6V0A4 (OMIM:605239,
    mutated in distal renal tubular acidosis), and TCIRG1 (OMIM:604592, mutated in
    osteopetrosis); one UNC-32 isoform is essential for locomotion and normal synaptic
    vesicle morphology in motoneurons, is expressed solely in the nervous system,
    and is specifically mutated by unc-32(e189) or unc-32(f120); other UNC-32 isoforms
    are essential for embryonic and larval development; UNC-32 is expressed throughout
    the life cycle, strongly in the nervous system, but also in vulvae, spermathecal-uterine
    valves, intestine, and pharynx; UNC-32 is required for necrosis, since mutations
    of unc-32 suppress necrotic neurodegeneration and thapsigargin-induced cell death;
    in S. cerevisiae, different V0 a-subunits (Stv1p and Vph1p) direct the assembly
    of V-ATPases to different membranes and organelles, suggesting that the profusion
    of such subunits in C. elegans (co-orthologous VHA-5, VHA-6, VHA-7, and six UNC-32
    isoforms) may have a similar function; alternative splicing of the unc-32 pre-mRNA
    is dependent on ASD-1 and FOX-1, and in neurons, is also dependent on UNC-75,
    which binds unc-32 intron 7a in vitro.
