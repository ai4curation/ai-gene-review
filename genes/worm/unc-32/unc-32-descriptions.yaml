- source: Alliance_Automated
  text: Predicted to enable ATPase binding activity. Predicted to contribute to proton-transporting
    ATPase activity, rotational mechanism. Involved in several processes, including
    cholinergic synaptic transmission; defense response to Gram-positive bacterium;
    and positive regulation of neurotransmitter secretion. Located in membrane. Part
    of vacuolar proton-transporting V-type ATPase complex. Is expressed in several
    structures, including alimentary muscle; gonad; neurons; somatic nervous system;
    and vulva. Human ortholog(s) of this gene implicated in autosomal recessive cutis
    laxa type IIA; epilepsy (multiple); renal tubular acidosis (multiple); and wrinkly
    skin syndrome. Orthologous to several human genes including ATP6V0A1 (ATPase H+
    transporting V0 subunit a1).
