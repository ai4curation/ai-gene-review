- term:
    id: GO:0001956
    label: positive regulation of neurotransmitter secretion
  evidence_type: IMP
  original_reference_id: PMID:22426883
  qualifier: involved_in
  review:
    summary: unc-32(e189), which truncates the neural-specific isoform, is strongly
      aldicarb resistant with normal levamisole sensitivity (presynaptic defect),
      and synaptobrevin-pHluorin shows that its synaptic vesicles are less acidic
      than wild type (PMID:22426883).
    action: MODIFY
    reason: The evidence shows that UNC-32 acidifies the synaptic vesicle lumen,
      which is the direct process the V-ATPase performs; reduced transmitter release
      is the downstream consequence of impaired proton-driven vesicle loading. The
      regulation term describes the outcome rather than the activity, so the more
      precise process term synaptic vesicle lumen acidification (GO:0097401) is
      proposed, matching the human ATP6V0A1 review and the neurotransmitter-loading
      module.
    proposed_replacement_terms:
    - id: GO:0097401
      label: synaptic vesicle lumen acidification
    supported_by:
    - reference_id: file:worm/unc-32/unc-32-deep-research-falcon.md
      supporting_text: The resulting acidification supports neurotransmitter loading
        into synaptic vesicles and degradative activity in endosomes, lysosomes, and
        autolysosomes.
    - reference_id: PMID:22426883
      supporting_text: unc-32 ( e189 ) mutants were also significantly aldicarb
        resistant with only 8.5% (±9%, n = 5 assays) paralyzed after 2 hr exposure
    - reference_id: PMID:22426883
      supporting_text: Similar results were seen in the V o subunit a mutant unc-32
        ( e189 )
    - reference_id: PMID:22426883
      supporting_text: neurotransmitter loading into vesicles relies on exchange of
        protons for neurotransmitter molecules
