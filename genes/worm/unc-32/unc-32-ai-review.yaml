- term:
    id: GO:0015986
    label: proton motive force-driven ATP synthesis
  evidence_type: NAS
  original_reference_id: PMID:11110798
  qualifier: involved_in
  review:
    summary: The V-ATPase is an ATP-driven proton pump; it hydrolyses ATP to move
      protons and does not synthesise ATP from a proton motive force. The cited paper
      describes unc-32 as a V-ATPase a subunit and makes no claim of ATP synthesis.
    action: REMOVE
    reason: Biologically wrong direction of the reaction for a V-type ATPase (the
      term describes F-type ATP synthase function). This is a non-traceable author
      statement, not an experimental annotation, and it is contradicted by the
      enzymology of the complex (EC 7.1.2.2, ATP + H2O + H+(in) -> ADP + Pi + H+(out)).
    supported_by:
    - reference_id: PMID:11110798
      supporting_text: unc-32 corresponds to one of the four genes encoding a
        V-ATPase a subunit in the nematode
