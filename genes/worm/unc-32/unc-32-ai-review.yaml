id: P30628
gene_symbol: unc-32
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: UNC-32 is the 116 kDa subunit a of the membrane-embedded V0 sector of the
  vacuolar-type H+-ATPase (V-ATPase) of Caenorhabditis elegans, one of four subunit a
  genes in the worm (vha-5, vha-6, vha-7, unc-32) and the orthologue of human ATP6V0A1.
  Subunit a provides the two proton half-channels through which protons enter and
  leave the rotating c-ring, and its cytosolic N-terminal domain anchors the V1
  sector, so it is required for assembly and proton-pumping activity of the
  holoenzyme. unc-32 produces at least six splice isoforms; neural-specific isoforms
  are expressed in head neurons and ventral cord motor neurons, where the V-ATPase
  acidifies synaptic vesicles to power vesicular neurotransmitter loading, and
  their loss causes uncoordinated movement, resistance to acetylcholinesterase
  inhibitors and poorly acidified synaptic vesicles; other isoforms are expressed
  broadly during embryogenesis and in the gonad, intestine and uterus, and their
  loss is embryonic lethal. UNC-32-dependent organellar acidification is also
  required for degenerin-induced necrotic neuronal death and for hypoxia-induced
  cell death.
