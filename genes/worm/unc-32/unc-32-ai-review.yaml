    supporting_text: Nomarski micrographs illustrating the Dar phenotype after 12 h
      of S. aureus infection in wild type (F), egl-5 (H), pmk-1 (I), and unc-32 (J)
      mutant animals in contrast to non-Dar bar-1 (G) and mpk-1,unc-32 (K) mutants
  reference_review:
    relevance: NONE
