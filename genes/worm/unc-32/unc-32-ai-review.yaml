- id: PMID:22426883
  title: V-ATPase V1 sector is required for corpse clearance and neurotransmission in
    Caenorhabditis elegans.
  findings:
  - statement: unc-32(e189) truncates the neural-specific isoform.
    supporting_text: The unc-32 ( e189 ) mutation truncates a neural-specific isoform
      of the V o subunit a
  - statement: unc-32(e189) mutants are viable but uncoordinated.
    supporting_text: Like vha-12 ( n2915 ) mutant animals, unc-32 ( e189 ) animals
      are viable as adults but uncoordinated
  - statement: unc-32(e189) mutants are strongly aldicarb resistant.
    supporting_text: unc-32 ( e189 ) mutants were also significantly aldicarb
      resistant with only 8.5% (±9%, n = 5 assays) paralyzed after 2 hr exposure
  - statement: Levamisole sensitivity is normal, placing the defect presynaptically.
    supporting_text: The V o mutant unc-32 ( e189 ) also exhibited comparable
      sensitivity to levamisole to that of wild-type animals
  - statement: Synaptic vesicles are less acidic in unc-32(e189), as in the V1
      mutant vha-12.
    supporting_text: Similar results were seen in the V o subunit a mutant unc-32 (
      e189 )
  - statement: Vesicle acidification is the basis for proton-coupled transmitter
      loading.
    supporting_text: neurotransmitter loading into vesicles relies on exchange of
      protons for neurotransmitter molecules
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached; provides the direct synaptic vesicle pH evidence
      for unc-32.
- id: PMID:7498734
  title: Caenorhabditis elegans mutants resistant to inhibitors of
    acetylcholinesterase.
  findings:
  - statement: unc-32 is among 18 genes whose mutation confers resistance to
      acetylcholinesterase inhibitors, several acting presynaptically.
    supporting_text: Measurements of acetylcholine levels in these mutants suggest
      that some of the genes are involved in presynaptic functions
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract only; unc-32 is not named in the abstract but is one of
      the classical Ric genes characterized in this paper.
