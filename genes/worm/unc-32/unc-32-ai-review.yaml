  title: The Caenorhabditis elegans unc-32 gene encodes alternative forms of a
    vacuolar ATPase a subunit.
  findings:
  - statement: unc-32 encodes one of four C. elegans V-ATPase subunit a genes.
    supporting_text: unc-32 corresponds to one of the four genes encoding a V-ATPase a
      subunit in the nematode
  - statement: unc-32 produces at least six alternatively spliced transcripts.
    supporting_text: unc-32 gives rise via alternative splicing to at least six
      transcripts
  - statement: The strongest allele is embryonic lethal.
    supporting_text: We have isolated four new mutant alleles, the strongest of which
      is embryonic lethal
  - statement: The uncoordinated alleles affect transcript B, proposed to encode a
      synaptic vesicle isoform in cholinergic neurons.
    supporting_text: In the uncoordinated alleles, the transcript unc-32 B is
      affected, suggesting that it encodes an isoform that is targeted to synaptic
      vesicles of cholinergic neurons, where it would control neurotransmitter
      uptake or release
  - statement: Broadly expressed isoforms are affected in lethal alleles and act in
      other acidic organelles.
    supporting_text: Other isoforms expressed widely during embryogenesis are mutated
      in the lethal alleles and would be involved in other acidic organelles
  - statement: unc-32 was isolated as a movement-defective mutant.
    supporting_text: In Caenorhabditis elegans, the unc-32 mutant was originally
      isolated on the basis of its movement defect
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract only; primary molecular identification of unc-32. Does not
