- id: PMID:11441002
  title: Four subunit a isoforms of Caenorhabditis elegans vacuolar H+-ATPase.
    Cell-specific expression during development.
  findings:
  - statement: Four subunit a genes were identified, including unc-32.
    supporting_text: We have identified four genes (vha-5, vha-6, vha-7, and unc-32)
      coding for vacuolar-type proton-translocating ATPase (V-ATPase) subunit a in
      Caenorhabditis elegans
  - statement: The subunit a isoforms have nine transmembrane regions and are
      43-60% identical to bovine a1.
    supporting_text: Their products had nine putative transmembrane regions,
      exhibited 43-60% identity and 62-84% similarity with the bovine subunit a1
      isoform
  - statement: Immunoprecipitation supports membership in the V-ATPase complex.
    supporting_text: The similarities, together with the results of
      immunoprecipitation, suggest that these isoforms are components of V-ATPase
  - statement: unc-32 is strongly expressed in nerve cells.
    supporting_text: unc-32 was strongly expressed in nerve cells
  - statement: unc-32 RNAi causes embryonic lethality.
    supporting_text: RNA interference analysis showed that the double-stranded RNA
      for unc-32 caused embryonic lethality similar to that seen with other subunit
      genes
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract only.
- id: PMID:16005300
  title: The vacuolar H+ -ATPase mediates intracellular acidification required for
    neurodegeneration in C. elegans.
  findings:
  - statement: V-ATPase function is essential for necrotic cell death.
    supporting_text: the function of the vacuolar H(+)-ATPase, a pump that acidifies
      lysosomes and other intracellular organelles, is essential for necrotic cell
      death in C. elegans
  - statement: Intracellular acidification during necrosis requires the V-ATPase and
      alkalinizing agents protect.
    supporting_text: Intracellular acidification requires the vacuolar H(+)-ATPase,
      whereas alkalization of endosomal and lysosomal compartments by weak bases
      protects against necrosis
  - statement: V-ATPase activity acts downstream of calcium overload in necrosis.
    supporting_text: vacuolar H(+)-ATPase activity is required downstream of
      cytoplasmic calcium overload during necrosis
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract only; the abstract does not name unc-32 or hypoxia, but
      UniProt records both from the full text.
- id: PMID:20617181
  title: Distinct pathogenesis and host responses during infection of C. elegans by
    P. aeruginosa and S. aureus.
  findings:
  - statement: unc-32 single mutants show the wild-type Dar response to S. aureus;
