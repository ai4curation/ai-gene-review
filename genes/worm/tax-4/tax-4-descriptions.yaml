descriptions:
- source: UniProt
  text: Pore-forming subunit of the cyclic nucleotide-gated channel (By similarity).
    Required for normal thermosensation and chemosensation sensory behavior (PubMed:8893027).
    Required, downstream of receptor- type guanylate cyclase gcy-9, for CO2-mediated
    responses in BAG neurons (PubMed:21173231). Required, downstream of receptor-type
    guanylate cyclase gcy-14, for alkaline pH-mediated responses in ASE-left (ASEL)
    neurons (PubMed:23664973). Involved in the development of ASJ sensory neuron axon
    during late larval stages and in the maintenance of normal axon morphology in
    the adult. Regulates dauer formation (PubMed:9486798). Required for the calcium
    flux to the cytoplasm in the ASJ sensory neurons upon the onset and removal of
    a nitric oxide (NO) stimulus, thereby promoting the ASJ-mediated behavioral avoidance
    response to NO-producing organisms like P.aeruginosa (PubMed:30014846). In ASI
    and ASJ sensory neurons, controls behavioral response to P.aeruginosa by up-regulating
    the transcription of daf-7, a member of the TGF-beta family (PubMed:25303524).
    In AWB and AWC sensory neurons, mediates the recognition of food odors which subsequently
    allows for the detection of preferred food sources (PubMed:25009271). In AWC neurons,
    acts to promote expression of srsx-3, a member of the GPCR family. Binding to
    cGMP results in conformational changes at the hydrophobic gate that converts the
    protein from an inactive closed state to an active open state (PubMed:28099415,
    PubMed:32483338, PubMed:35233102).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q03611
  source_id: Q03611
- source: Alliance_Imported
  text: tax-4 encodes a a cyclic nucleotide-gated channel subunit orthologous to the
    human gene ROD PHOTORECEPTOR CGMP-GATED CHANNEL (CNGA1; OMIM:123825); tax-4 is
    required for chemosensation and thermosensation; a TAX-4::GFP fusion protein is
    expressed in sensory neurons where it localizes to the cilia.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00006526;class=Gene
  source_id: WB:WBGene00006526
- source: Alliance_Automated
  text: Enables identical protein binding activity; intracellularly cAMP-activated
    cation channel activity; and intracellularly cGMP-activated cation channel activity.
    Involved in several processes, including G protein-coupled receptor signaling
    pathway coupled to cGMP nucleotide second messenger; negative regulation of receptor
    guanylyl cyclase signaling pathway; and regulation of gene expression. Located
    in ciliary inversin compartment; dendrite; and non-motile cilium. Part of cation
    channel complex. Is expressed in nervous system. Human ortholog(s) of this gene
    implicated in achromatopsia; achromatopsia 2; color blindness; retinitis pigmentosa;
    and retinitis pigmentosa 49. Orthologous to several human genes including CNGA1
    (cyclic nucleotide gated channel subunit alpha 1) and CNGA2 (cyclic nucleotide
    gated channel subunit alpha 2).
