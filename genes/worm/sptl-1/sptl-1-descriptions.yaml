gene_symbol: sptl-1
organism: worm
uniprot_id: P91079
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Component of the serine palmitoyltransferase (SPT) that catalyzes the first
    committed step in sphingolipid biosynthesis, which is the condensation of an acyl-CoA
    species and L-serine. The catalytic core is composed of a heterodimer of sptl-1
    and sptl-2 or sptl-1 and sptl-3 (By similarity). Required for the specification
    of abicobasal polarity and development of the gut lumen.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P91079
  source_id: P91079
- source: Alliance_Imported
  text: sptl-1 encodes a putative serine palmitoyltransferase required for normal
    embryonic and larval developement, locomotion, and speed of growth.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00016020;class=Gene
  source_id: WB:WBGene00016020
- source: Alliance_Automated
  text: Predicted to enable serine C-palmitoyltransferase activity. Involved in establishment
    or maintenance of epithelial cell apical/basal polarity. Predicted to be active
    in endoplasmic reticulum. Is expressed in head and intestine. Human ortholog(s)
    of this gene implicated in hereditary sensory and autonomic neuropathy type 1A
    and juvenile amyotrophic lateral sclerosis type 27. Orthologous to human SPTLC1
    (serine palmitoyltransferase long chain base subunit 1).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00016020;class=Gene
  source_id: WB:WBGene00016020
