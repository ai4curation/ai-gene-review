descriptions:
- source: UniProt
  text: Component of the serine palmitoyltransferase (SPT) that catalyzes the first
    committed step in sphingolipid biosynthesis, which is the condensation of an acyl-CoA
    species and L-serine. The catalytic core is composed of a heterodimer of sptl-1
    and sptl-2 or sptl-1 and sptl-3 (By similarity). Required for the specification
    of abicobasal polarity and development of the gut lumen.
  source_type: curated
  url: https://www.uniprot.org/uniprot/P91079
  source_id: P91079
