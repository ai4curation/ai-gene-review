suggested_questions:
- question: Does SPTL-1 heterodimerize with both SPTL-2 and SPTL-3 in vivo, and do the two complexes
    differ in acyl-CoA preference (iso-C15 versus straight-chain palmitoyl-CoA) or tissue distribution?
- question: Is there a C. elegans small subunit (ssSPT/Tsc3-like) or ORMDL ortholog regulating SPTL-1
    complexes, and should the worm complex be annotated as GO:0017059 with experimental evidence?
- question: Should the epithelial polarity IMP on SPT subunits be represented in GO-CAM as a downstream
    requirement for glycosphingolipid products rather than a direct process role of the enzyme?
suggested_experiments:
- description: Express SPTL-1 with SPTL-2 or SPTL-3 (in yeast lcb1 lcb2 mutants or insect cells) and
    assay SPT activity with iso-C15-CoA versus palmitoyl-CoA, with SPTL-1 alone as a control.
  hypothesis: SPTL-1 is required but not sufficient for SPT activity, and the partner subunit sets acyl-CoA
    preference.
- description: Endogenous CRISPR tag of SPTL-1 imaged with ER membrane and Golgi markers in intestine
    and hypodermis.
  hypothesis: SPTL-1 resides in the ER membrane, as do its orthologs.
