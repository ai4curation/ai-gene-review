- term:
    id: GO:0045197
    label: establishment or maintenance of epithelial cell apical/basal polarity
  evidence_type: IMP
  original_reference_id: PMID:21926990
  qualifier: involved_in
  review:
    summary: sptl-1 RNAi (full text read) converts intestinal apicobasal polarity in larvae, with
      apical markers (ERM-1, PAR-6, actin) displaced to lateral membranes and ectopic lateral lumens;
      the phenotype is phenocopied by sptl-2;sptl-3 double RNAi, myriocin and fumonisin B, and is
      partially rescued by glycosphingolipids.
    action: KEEP_AS_NON_CORE
    reason: The IMP is well supported and the curators read the full paper. The paper's model is
      that glycosphingolipids, the downstream products of the pathway SPTL-1 initiates, are
      required for polarized apical membrane biogenesis; SPTL-1 itself acts upstream by supplying
      the long-chain base. Retained as a genuine, experimentally grounded but indirect,
      non-core process annotation rather than the enzyme's core function.
    supported_by:
    - reference_id: PMID:21926990
      supporting_text: "Sphingolipid's role in polarity was, however, confirmed via sptl-1(RNAi) phenocopy
        by: double knockdowns of sptl-2 and sptl-3, two additional C.elegans SPTs (Fig.S6e); feeding
        Myriocin or Fumonisin B, mycotoxins specifically inhibiting SPT and ceramide synthase (CerS),
        respectively."
    - reference_id: PMID:31138658
      supporting_text: sptl-1(c363g) homozygous mutants exhibited the same larval lethality and
        epithelial polarity defect as observed in sptl-1(RNAi) animals
