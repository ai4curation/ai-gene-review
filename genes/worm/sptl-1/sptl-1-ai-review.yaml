- id: PMID:21926990
  title: Apicobasal domain identities of expanding tubular membranes depend on glycosphingolipid
    biosynthesis.
  findings:
  - statement: sptl-1 RNAi causes conversion of intestinal apicobasal polarity with ectopic lateral
      lumens at L1 arrest; phenocopied by sptl-2;sptl-3 double RNAi and by SPT/CerS inhibitors.
    supporting_text: "Sphingolipid's role in polarity was, however, confirmed via sptl-1(RNAi) phenocopy
      by: double knockdowns of sptl-2 and sptl-3, two additional C.elegans SPTs (Fig.S6e)"
  - statement: sptl-1 RNAi intestines show vesicle paucity and distended ER and Golgi membranes.
    supporting_text: sptl-1(RNAi) intestinal sections revealed vesicle paucity, along with distended
      endoplasmic reticular (ER) and Golgi membranes
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text read; source of the IMP polarity annotation and of the UniProt FUNCTION
      statement for P91079.
- id: PMID:15340492
  title: Monomethyl branched-chain fatty acids play an essential role in Caenorhabditis
    elegans development.
  findings:
  - statement: Early identification of C23H3.4 (then spt-1) as the C. elegans SPT subunit 1 homolog;
      used as an RNAi comparator in expression profiling.
    supporting_text: The spt-1 (C23H3.4) gene encodes a predicted C. elegans homolog of serine-palmitoyl
      transferase subunit 1.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Full text checked; mentions sptl-1 (as spt-1) only in passing as a comparator; its
      main subject is mmBCFA synthesis by ELO-5/ELO-6.
- id: PMID:23705068
  title: A novel sphingolipid-TORC1 pathway critically promotes postembryonic development
    in Caenorhabditis elegans.
  findings:
  - statement: sptl-1 is required for d17iso-sphinganine synthesis; d17iso-sphinganine supplementation
      suppresses sptl-1(RNAi) L1 arrest.
    supporting_text: supplementation with d17iso-SPA, but not mmBCFAs, also suppressed the L1 arrest
      phenotype caused by feeding RNAi of sptl-1
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text read; supports SPTL-1 in long-chain base synthesis using mmBCFA-derived
      acyl-CoA and that the larval arrest is due to sphingolipid loss.
- id: PMID:38704027
  title: Sphingolipid profiling reveals differential functions of sphingolipid biosynthesis isozymes
    of Caenorhabditis elegans.
  findings:
  - statement: sptl-1 RNAi lowers nearly all 47 quantified Cer, GlcCer and SM species in young adults.
    supporting_text: RNAi targeting the first key enzyme (SPT) in the de novo sphingolipid biosynthesis
      pathway caused a decrease of nearly all sphingolipids in Caenorhabditis elegans.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text checked. Note the paper calls SPTL-1 the ortholog of the catalytic subunit;
      by sequence SPTL-1 is the LCB1/SPTLC1-type subunit, so that wording is imprecise, but the
      lipidomic data are sound.
- id: PMID:31138658
  title: A Model of Hereditary Sensory and Autonomic Neuropathy Type 1 Reveals a Role of Glycosphingolipids
    in Neuronal Polarity.
  findings:
  - statement: CRISPR SPTL-1(C121W), equivalent to human SPTLC1 C133W, behaves as loss of function
      (homozygous) and dominant-negative (overexpression), reducing glucosylceramide.
    supporting_text: Overexpression of SPTL-1(C121W) led to similar epithelial and neuronal defects
      and to reduced levels of complex sphingolipids
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract only in cache; abstract verified against PubMed. C121/C133 equivalence
      confirmed by our alignment.
- id: PMID:41191545
  title: Sphingosine kinase SPHK-1 maintains sphingolipid metabolism to protect lysosome membrane
    integrity in C. elegans.
  findings:
  - statement: sptl-1 loss-of-function suppresses sphingosine accumulation and lysosome damage in
      sphk-1 mutants.
    supporting_text: Loss of sptl-1 alleviates sphingosine accumulation
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract only in cache; abstract verified against PubMed. Genetic support that SPTL-1
      feeds the sphingoid base pool in vivo.
