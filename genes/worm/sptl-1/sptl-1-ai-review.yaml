id: P91079
gene_symbol: sptl-1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: >-
  sptl-1 (C23H3.4) encodes the single C. elegans LCB1/SPTLC1-type subunit of serine
  palmitoyltransferase (SPT), the enzyme that catalyses the first committed step of de novo
  sphingolipid biosynthesis, the pyridoxal 5'-phosphate (PLP)-dependent condensation of L-serine
  with an acyl-CoA to give a 3-ketosphinganine long-chain base. By homology, the active enzyme is a
  heterodimer of SPTL-1 with one of the LCB2/SPTLC2-type subunits SPTL-2 or SPTL-3, which carry
  the PLP-binding lysine; SPTL-1 is a class-II PLP-dependent aminotransferase-fold protein that
  lacks this lysine (Asn at the equivalent position) and, like its orthologs, is expected to sit in
  the endoplasmic reticulum. In C. elegans the major sphingoid base is the C17 iso-branched
  d17iso-sphingosine (id17:1), made from a monomethyl branched-chain fatty acyl-CoA, and sptl-1
  knockdown lowers nearly all ceramide, glucosylceramide and sphingomyelin species. Loss of sptl-1
  causes larval arrest and lethality and a striking conversion of intestinal apicobasal polarity
  (ectopic lateral lumens), attributed to loss of glycosphingolipids needed for apical membrane
  biogenesis; a CRISPR model of the human HSAN1 SPTLC1 C133W mutation (SPTL-1 C121W) reproduces
  these defects and causes neuronal polarity defects. Loss of sptl-1 also suppresses sphingosine
  accumulation and lysosomal damage in sphingosine kinase (sphk-1) mutants.
