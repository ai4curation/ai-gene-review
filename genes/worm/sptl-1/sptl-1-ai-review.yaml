  review:
    summary: PAINT propagation of serine C-palmitoyltransferase activity from the LCB1/SPTLC1
      clade (mouse Sptlc1, yeast LCB1, Aspergillus LCB1) to C. elegans SPTL-1.
    action: ACCEPT
    reason: SPTL-1 sits inside the SPTLC1/LCB1 clade (50% identity to human SPTLC1 vs 30% to SPTLC2
      in our alignment), so the IBD node placement covers it. Like other LCB1 subunits SPTL-1 lacks
      the PLP Schiff-base lysine (Asn297 at the SPTLC2 K379 position), so it is the non-catalytic
      but obligate partner of the heterodimeric enzyme; GO convention (human SPTLC1, yeast LCB1)
      annotates this subunit to the activity of the heterodimer. Genetic data in the worm are
      consistent with SPT function (sptl-1 RNAi depletes nearly all sphingolipids and is phenocopied
      by the SPT inhibitor myriocin). This is the core molecular function.
