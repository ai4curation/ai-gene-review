core_functions:
- description: Non-catalytic LCB1-type subunit of the ER serine palmitoyltransferase heterodimer
    (with SPTL-2 or SPTL-3), which condenses L-serine with an acyl-CoA (largely iso-branched C15
    in C. elegans) to form the 3-ketosphinganine long-chain base, the first committed step of de
    novo sphingolipid (ceramide, glucosylceramide, sphingomyelin) biosynthesis.
