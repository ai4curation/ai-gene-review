  review:
    summary: Establishment of mitotic spindle orientation (IGI with ced-5, Cabello et al. 2010).
    action: REMOVE
    reason: The full text was read. In this paper ABar spindle orientation needs MOM-5/Frizzled, GSK-3, beta-catenins
      and CED-10, but the authors state that the other ced genes, which include the CED-2/5/12 branch, showed no
      strong spindle defect, and they conclude that the spindle signal probably does not pass through CED-2/5/12.
      The only engulfment-gene spindle defect reported is a small fraction of ced-1; ced-5 double mutants, which does
      not involve ced-12. The paper therefore argues against, rather than for, a ced-12 role in spindle orientation.
    supported_by:
    - reference_id: PMID:20126385
      supporting_text: neither apr-1 nor any of the other ced genes showed a strong defect, suggesting that the link
        to CED-10 may not occur through CED-2/5/12 as is the case for engulfment and DTC migration
    - reference_id: PMID:20126385
      supporting_text: we found that the β-catenin WRM-1 (and to a minor extent, BAR-1 and HMP-2) is required for
        spindle orientation, but not for cell corpse clearance or DTC migration
