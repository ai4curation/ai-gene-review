    on the Rac GTPase CED-10, forming with CED-5 and CED-2 a bipartite Rac exchange-factor complex at the plasma membrane
    of engulfing cells. This drives the actin rearrangement that extends the engulfing membrane around apoptotic cell
    corpses.
