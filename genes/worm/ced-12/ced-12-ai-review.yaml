- question: Which phosphoinositide does the CED-12 PH domain bind in vivo, and does MTM-1 control CED-12 recruitment
    to the engulfing membrane through PtdIns(3,5)P2 or another lipid?
- question: How are the inputs to CED-12 (MOM-5/Frizzled via CED-2, MIG-2/RhoG via the ARM repeats, and phosphoinositides
    via the PH domain) combined in a single engulfing cell?
- question: How does CED-12 act on the UNC-5 netrin receptor to steer distal tip cells, and is this the same Rac-activating
    activity used in engulfment?
suggested_experiments:
- hypothesis: The CED-12 PH domain binds PtdIns(3,5)P2 in vivo and this binding is needed for membrane recruitment
    and engulfment.
  description: Express PH-domain lipid-binding mutants of CED-12 in ced-12 null animals, image CED-12::GFP at phagocytic
    cups in wild-type and mtm-1 backgrounds, and score embryonic and germ-cell corpse numbers.
  experiment_type: genetic
- hypothesis: ced-12 loss enhances the survival of cells receiving weak death signals.
  description: Score extra surviving cells (for example, in the anterior pharynx) in ced-3 partial loss-of-function
    animals with and without a ced-12 null allele, and test whether ced-12 expression in engulfing cells reverses
    the effect.
