id: Q8STE5
gene_symbol: ced-12
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: CED-12 is the C. elegans orthologue of mammalian ELMO1 and ELMO2. It is a cytoplasmic scaffold of
  731 residues with N-terminal armadillo (ARM) repeats, a central ELMO domain, a C-terminal pleckstrin homology
  (PH) domain and a proline-rich SH3-binding motif. CED-12 binds directly to CED-5, the DOCK180-family exchange
  factor, and together with the CrkII-like adaptor CED-2 forms a ternary complex that acts as a bipartite guanine
  nucleotide exchange factor for the Rac GTPase CED-10. Within this complex the ELMO PH domain binds the CED-5-Rac
  complex in trans and helps hold Rac in the nucleotide-free state, so CED-12 raises the exchange activity of CED-5
  rather than catalysing exchange itself. The ARM repeats bind active MIG-2 (RhoG), which places CED-12 downstream
  of the UNC-73/TRIO-MIG-2 module, and the PH domain binds phosphoinositides, which may help recruit the complex to
  the plasma membrane. CED-12 acts in engulfing cells, where Rac activation drives the actin rearrangements that
  extend the engulfing membrane around apoptotic and necrotic cell corpses. The same CED-2/CED-5/CED-12 module
  drives the migration of the gonadal distal tip cells, so ced-12 mutants have both persistent cell corpses and
  misshapen gonad arms. Upstream inputs include the Frizzled receptor MOM-5 and the myotubularin MTM-1, which
  restrains the pathway. Like other engulfment genes, ced-12 is thought to help engulfing cells promote the death
  of cells that receive weak death signals.
