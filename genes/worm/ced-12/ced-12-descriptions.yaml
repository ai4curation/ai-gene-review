descriptions:
- source: UniProt
  text: Involved in programmed apoptosis and necrosis. Required for the cell corpse
    engulfment process. Has roles in the formation of actin halos and distal tip cell
    migration (PubMed:11146658, PubMed:11595183, PubMed:11703939, PubMed:11703940,
    PubMed:14645848, PubMed:15247908, PubMed:15620647, PubMed:15744306, PubMed:21490059).
    Negatively regulates the unc-6/Netrin receptor unc-5 to control distal tip cell
    migration along the anterior-posterior axis of the body (PubMed:26292279). Plays
    no role in amphid axon outgrowth (PubMed:12297102).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q8STE5
  source_id: Q8STE5
