gene_symbol: ced-12
organism: worm
uniprot_id: Q8STE5
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Involved in programmed apoptosis and necrosis. Required for the cell corpse
    engulfment process. Has roles in the formation of actin halos and distal tip cell
    migration (PubMed:11146658, PubMed:11595183, PubMed:11703939, PubMed:11703940,
    PubMed:14645848, PubMed:15247908, PubMed:15620647, PubMed:15744306, PubMed:21490059).
    Negatively regulates the unc-6/Netrin receptor unc-5 to control distal tip cell
    migration along the anterior-posterior axis of the body (PubMed:26292279). Plays
    no role in amphid axon outgrowth (PubMed:12297102).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q8STE5
  source_id: Q8STE5
- source: Alliance_Imported
  text: ced-12 encodes the C. elegans ELMO ortholog; ced-12 is required both for phagocytotic
    engulfment of apoptotic cells, and for normal migrations of healthy cells during
    development; CED-12 binds directly to CED-5, the C. elegans DOCK180 ortholog.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00000426;class=Gene
  source_id: WB:WBGene00000426
- source: Alliance_Automated
  text: Enables phosphatidylinositol phosphate binding activity; proline-rich region
    binding activity; and small GTPase binding activity. Involved in several processes,
    including cytoskeleton organization; engulfment of apoptotic cell; and left/right
    axis specification. Located in cytoplasm and plasma membrane. Part of guanyl-nucleotide
    exchange factor complex. Is expressed in intestine; nervous system; reproductive
    system; and tail. Orthologous to human ELMO1 (engulfment and cell motility 1);
    ELMO2 (engulfment and cell motility 2); and ELMO3 (engulfment and cell motility
    3).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00000426;class=Gene
  source_id: WB:WBGene00000426
