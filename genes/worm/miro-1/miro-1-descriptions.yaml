descriptions:
- source: UniProt
  text: Mitochondrial GTPase involved in mitochondrial trafficking (By similarity).
    Probably involved in control of anterograde transport of mitochondria and their
    subcellular distribution (By similarity). Plays a role in maintaining mitochondrial
    morphology (PubMed:25190516).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q94263
  source_id: Q94263
- source: Alliance_Automated
  text: Predicted to enable GTP binding activity and GTPase activity. Involved in
    mitochondrion organization. Predicted to be active in mitochondrial outer membrane.
    Is expressed in body wall muscle cell; intestine; neurons; pharyngeal muscle cell;
    and pharynx. Orthologous to human RHOT1 (ras homolog family member T1) and RHOT2
    (ras homolog family member T2).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00019544;class=Gene
