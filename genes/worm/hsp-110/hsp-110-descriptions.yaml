descriptions:
- source: Alliance_Imported
  text: C30C11.4 encodes a member of the Hsp70 family of heat shock proteins;  loss
    of C30C11.4 activity via large-scale RNAi screens results in a variety of defects
    including embryonic and larval lethality, slow growth rates, and locomotory and
    morphological defects; in addition loss of C30C11.4 has been reported to result
    in a small but reproducible reduction in adult lifespan in otherwise long-lived
    animals.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00016250;class=Gene
  source_id: WB:WBGene00016250
- source: Alliance_Automated
  text: Predicted to enable adenyl-nucleotide exchange factor activity. Involved in
    determination of adult lifespan; protein folding; and response to topologically
    incorrect protein. Predicted to be active in cytosol and nucleus. Human ortholog(s)
    of this gene implicated in Chagas disease. Orthologous to several human genes
    including HSPA4 (heat shock protein family A (Hsp70) member 4) and HSPH1 (heat
    shock protein family H (Hsp110) member 1).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00016250;class=Gene
  source_id: WB:WBGene00016250
