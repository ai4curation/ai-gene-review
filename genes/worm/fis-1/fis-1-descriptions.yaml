gene_symbol: fis-1
organism: worm
uniprot_id: Q20291
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Involved in the fragmentation of the mitochondrial network (By similarity).
    Involved in perinuclear clustering of the mitochondrial network (By similarity).
    Plays a role in removal of ultraviolet C radiation-induced mitochondrial DNA damage
    (PubMed:24058863). May act, redundantly with fis-2, downstream of mitochondrial
    fission, before the fission products participate in either mitochondrial homeostasis,
    mitophagy, or apoptosis (PubMed:18722182, PubMed:24196833).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q20291
  source_id: Q20291
- source: Alliance_Imported
  text: fis-1 encodes a protein similar to the yeast and human Fis1 proteins involved
    in mitochondrial fission; fis-1 does not seem to be required for mitochondrial
    fission in C. elegans, but it is possible that it may function redundantly along
    with fis-2 and other genes; fis-1 expression is enriched in the germline.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00001424;class=Gene
  source_id: WB:WBGene00001424
- source: Alliance_Automated
  text: Predicted to enable lipid binding activity and molecular adaptor activity.
    Predicted to be involved in mitochondrial fission and peroxisome fission. Located
    in mitochondrial outer membrane. Orthologous to human FIS1 (fission, mitochondrial
    1).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00001424;class=Gene
  source_id: WB:WBGene00001424
