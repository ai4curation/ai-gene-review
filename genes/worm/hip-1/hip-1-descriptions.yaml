gene_symbol: hip-1
organism: worm
uniprot_id: G5EE04
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: One HIP oligomer binds the ATPase domains of at least two HSC70 molecules
    dependent on activation of the HSC70 ATPase by HSP40. Stabilizes the ADP state
    of HSC70 that has a high affinity for substrate protein. Through its own chaperone
    activity, it may contribute to the interaction of HSC70 with various target proteins.
  source_type: curated
  url: https://www.uniprot.org/uniprot/G5EE04
  source_id: G5EE04
- source: Alliance_Automated
  text: Predicted to enable Hsp70 protein binding activity. Predicted to be involved
    in protein folding. Located in endoplasmic reticulum; sarcomere; and striated
    muscle dense body. Is expressed in germ line; head; hypodermis; intestine; and
    tail. Orthologous to several human genes including ST13 (ST13 Hsp70 interacting
    protein).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00011735;class=Gene
  source_id: WB:WBGene00011735
