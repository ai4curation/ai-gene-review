    overall_notes: Mechanistic Hip text on binding the HSC70 ATPase domain and stabilizing
      the ADP state, but transferred from mammals with nothing worm-specific.
- source: Alliance_Automated
  text: Predicted to enable Hsp70 protein binding activity. Predicted to be involved
    in protein folding. Located in endoplasmic reticulum; sarcomere; and striated
    muscle dense body. Is expressed in germ line; head; hypodermis; intestine; and
    tail. Orthologous to several human genes including ST13 (ST13 Hsp70 interacting
    protein).
