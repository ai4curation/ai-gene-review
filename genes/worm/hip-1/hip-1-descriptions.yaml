descriptions:
- source: UniProt
  text: One HIP oligomer binds the ATPase domains of at least two HSC70 molecules
    dependent on activation of the HSC70 ATPase by HSP40. Stabilizes the ADP state
    of HSC70 that has a high affinity for substrate protein. Through its own chaperone
    activity, it may contribute to the interaction of HSC70 with various target proteins.
  source_type: curated
  url: https://www.uniprot.org/uniprot/G5EE04
