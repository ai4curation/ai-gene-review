gene_symbol: spg-7
organism: worm
uniprot_id: Q9N3T5
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Acts as a component of the m-AAA protease complex which is an ATP-dependent
    metalloprotease mediating degradation of non-assembled mitochondrial inner membrane
    proteins (By similarity). The complex is necessary for the assembly of mitochondrial
    respiratory chain and ATPase complexes (By similarity). Functions both in post-translational
    assembly and in the turnover of mistranslated or misfolded polypeptides (PubMed:22700657,
    PubMed:25274306, PubMed:25773600). Plays a role in male tail tip morphogenesis
    (PubMed:21408209).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q9N3T5
  source_id: Q9N3T5
- source: Alliance_Imported
  text: spg-7 encodes a metalloprotease orthologous to human paraplegin, a nuclear-encoded
    mitochondrial metalloprotease mutations in which are associated with hereditary
    spastic paraplegia (spinal cord dysfunction); based upon studies of Saccharomyces
    cerevisiae SPG7, C. elegans SPG-7 is predicted to function as part of a mt-AAA
    metalloprotease that regulates proteolytic degradation of mitochondrial proteins
    and formation of multisubunit mitochondrial protein complexes; loss of spg-7 activity
    via large-scale RNAi indicates that SPG-7 function is required for embryonic and
    larval development, reproduction, normal body size and growth rates, and proper
    subcellular localization of an unc-54::POLYQ(Q35)-YFP transgene; in addition,
    postdevelopmental inactivation of spg-7 results in significantly increased adult
    lifespan.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00004978;class=Gene
  source_id: WB:WBGene00004978
- source: Alliance_Automated
  text: Predicted to enable metalloendopeptidase activity. Involved in several processes,
    including defense response to Gram-negative bacterium; mitochondrial protein processing;
    and positive regulation of nematode male tail tip morphogenesis. Predicted to
    be located in mitochondrial inner membrane. Predicted to be part of m-AAA complex.
    Is expressed in germ line. Human ortholog(s) of this gene implicated in optic
    atrophy 12; spastic ataxia; spastic ataxia 5; and spinocerebellar ataxia 28. Orthologous
    to human AFG3L2 (AFG3 like matrix AAA peptidase subunit 2).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00004978;class=Gene
  source_id: WB:WBGene00004978
