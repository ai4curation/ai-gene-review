    overall_notes: m-AAA protease subunit in inner membrane quality control and complex
      assembly, plus male tail tip; mostly by similarity.
- source: Alliance_Imported
  text: spg-7 encodes a metalloprotease orthologous to human paraplegin, a nuclear-encoded
    mitochondrial metalloprotease mutations in which are associated with hereditary
    spastic paraplegia (spinal cord dysfunction); based upon studies of Saccharomyces
    cerevisiae SPG7, C. elegans SPG-7 is predicted to function as part of a mt-AAA
    metalloprotease that regulates proteolytic degradation of mitochondrial proteins
    and formation of multisubunit mitochondrial protein complexes; loss of spg-7 activity
    via large-scale RNAi indicates that SPG-7 function is required for embryonic and
    larval development, reproduction, normal body size and growth rates, and proper
    subcellular localization of an unc-54::POLYQ(Q35)-YFP transgene; in addition,
    postdevelopmental inactivation of spg-7 results in significantly increased adult
    lifespan.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00004978;class=Gene
  source_id: WB:WBGene00004978
