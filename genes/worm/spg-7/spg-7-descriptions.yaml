- source: Alliance_Automated
  text: Predicted to enable metalloendopeptidase activity. Involved in several processes,
    including defense response to Gram-negative bacterium; mitochondrial protein processing;
    and positive regulation of nematode male tail tip morphogenesis. Predicted to
    be located in mitochondrial inner membrane. Predicted to be part of m-AAA complex.
    Is expressed in germ line. Human ortholog(s) of this gene implicated in optic
    atrophy 12; spastic ataxia; spastic ataxia 5; and spinocerebellar ataxia 28. Orthologous
    to human AFG3L2 (AFG3 like matrix AAA peptidase subunit 2).
