    overall_notes: 'Correct and cited: regulatory subunit of MTM-6, PI(3)P levels,
      coelomocyte fluid-phase endocytosis, MIG-14 trafficking for Q-neuroblast and
      HSN migration, DA9 synapse number.'
- source: Alliance_Imported
  text: mtm-9 encodes a catalytically inactive myotubularin lipid phosphatase orthologous
    to human MTMR9 (OMIM:606260) that affects phosphoinositide 3-phosphate localization,
    and whose mutation blocks endocytosis by the coelomocytes of C. elegans; MTM-9
    is believed to function as part of a complex with MTM-6A and it is predominantly
    localized to the coelomocyte cytoplasm, with some localization to the membrane.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00003479;class=Gene
  source_id: WB:WBGene00003479
