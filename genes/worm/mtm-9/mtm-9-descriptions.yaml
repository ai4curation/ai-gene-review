gene_symbol: mtm-9
organism: worm
uniprot_id: Q965W9
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: May act as a regulatory subunit for mtm-6. In association with phosphatase
    mtm-6, plays a role in endosome trafficking probably by regulating phosphatidylinositol-3-phosphate
    levels (PubMed:14565969). Regulates fluid phase endocytosis in coelomocytes (PubMed:14565969).
    Regulates posterior migration of QL neuroblast descendants and the anterior migration
    of QR neuroblast descendants and HSN neurons during larval development probably
    by controlling Wnt ligand secretion through the regulation of sorting receptor
    mig-14 trafficking (PubMed:21076391). Involved in the formation of correct synapse
    number in DA9 motor neurons (PubMed:25479419).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q965W9
  source_id: Q965W9
- source: Alliance_Imported
  text: mtm-9 encodes a catalytically inactive myotubularin lipid phosphatase orthologous
    to human MTMR9 (OMIM:606260) that affects phosphoinositide 3-phosphate localization,
    and whose mutation blocks endocytosis by the coelomocytes of C. elegans; MTM-9
    is believed to function as part of a complex with MTM-6A and it is predominantly
    localized to the coelomocyte cytoplasm, with some localization to the membrane.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00003479;class=Gene
  source_id: WB:WBGene00003479
- source: Alliance_Automated
  text: Enables phosphatase binding activity. Involved in pinocytosis and regulation
    of cell migration. Located in apical plasma membrane and cytosol. Is expressed
    in several structures, including coelomocyte; epithelial cell; intestine; neurons;
    and vulva. Used to study centronuclear myopathy. Human ortholog(s) of this gene
    implicated in disease of metabolism. Orthologous to human MTMR9 (myotubularin
    related protein 9).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00003479;class=Gene
  source_id: WB:WBGene00003479
