    overall_notes: 'Correct: catalytically inactive MTMR9 ortholog in a complex with
      MTM-6, coelomocyte endocytosis, cytoplasmic localization. No Wnt/MIG-14 role.'
- source: Alliance_Automated
  text: Enables phosphatase binding activity. Involved in pinocytosis and regulation
    of cell migration. Located in apical plasma membrane and cytosol. Is expressed
    in several structures, including coelomocyte; epithelial cell; intestine; neurons;
    and vulva. Used to study centronuclear myopathy. Human ortholog(s) of this gene
    implicated in disease of metabolism. Orthologous to human MTMR9 (myotubularin
    related protein 9).
  source_type: automated
