taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: MTM-9 (CUP-10) is a catalytically inactive myotubularin-related protein (pseudophosphatase)
  of C. elegans. It has a PH-GRAM domain and a myotubularin phosphatase domain whose catalytic loop lacks
  the nucleophilic cysteine and the arginine. MTM-9 forms a complex with the active phosphatidylinositol
  3-phosphate phosphatase MTM-6, and MTM-6 controls its recruitment to membranes. The MTM-6/MTM-9 complex
  regulates PI(3)P distribution on endocytic membranes. It is required for fluid-phase endocytosis by
  coelomocytes in an ARF-6/RME-1-associated pathway, and for MIG-14/Wntless recycling in Wnt-producing
  cells. Loss of mtm-9 therefore impairs Wnt-dependent neuroblast migrations and reduces synapse number
  in the DA9 motor neuron. The protein is mainly cytosolic, with a minor peripheral-membrane pool.
