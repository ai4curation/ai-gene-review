suggested_questions:
- question: Does MTM-9 increase the catalytic rate, stability or substrate preference of MTM-6 in vitro,
    as human MTMR9 does for MTMR6/MTMR8? PAINT propagated MTMR9 partner binding to the SF73 branch but
    not phosphatase activator activity.
- question: Is the MTM-6/MTM-9 requirement for Wnt secretion cell-autonomous for MTM-9 in Wnt-producing
    cells, and does it act through endosome-to-Golgi retrieval of MIG-14/Wls?
- question: Which annotation evidence supports apical plasma membrane localisation of MTM-9 (GO:0016324)?
suggested_experiments:
- description: Reconstitute recombinant MTM-6 alone and the MTM-6/MTM-9 complex, and measure PI(3)P and
    PI(3,5)P2 phosphatase kinetics and MTM-6 protein stability. This would test whether MTM-9 has phosphatase
    activator activity.
- description: Express mtm-9 under tissue-specific promoters (egl-20 or lin-44 Wnt-producing cells versus
    neurons) in an mtm-9(ok3523) background, and score Q-neuroblast migration, MIG-14::GFP levels and
    DA9 synapse number.
