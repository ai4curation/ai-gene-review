core_functions:
- description: Non-catalytic partner subunit that binds the active PI(3)P phosphatase MTM-6, forming the
    MTM-6/MTM-9 myotubularin complex that acts in phosphatidylinositol dephosphorylation. MTM-9 itself
    lacks catalytic activity, and whether it directly stimulates MTM-6 activity has not been tested in
    C. elegans.
