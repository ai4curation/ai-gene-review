  review:
    summary: mut-14 smut-1 double mutants cause widespread loss of endogenous siRNAs, comparable
      to mut-16. MUT-14 is proposed to start siRNA amplification in Mutator foci.
    action: NEW
    reason: MUT-14 is a catalytic subunit of the mutator amplification complex, and its helicase
      activity is needed in vivo, so it contributes enzymatic work to secondary siRNA biogenesis
      rather than being only required for it. For the comparator check, the other mutator-complex
      members in the same role are MUT-16 (IMP), RDE-2 (IDA), NYN-1/NYN-2 (IGI) and RDE-8
      (IMP), and all of them carry GO:0030422 in WormBase/GOA.
    supported_by:
    - reference_id: PMID:24684932
      supporting_text: Mutations in both smut-1 and mut-14 also cause widespread loss of endogenous
        siRNAs.
    - reference_id: PMID:24684932
      supporting_text: the mut-14 smut-1 double mutant and the mut-16 mutant display the most
        dramatic depletion of siRNAs, suggesting that they act at a similarly early step in
        siRNA formation
