id: Q17978
gene_symbol: mut-14
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: MUT-14 is a germline-expressed DEAD-box RNA helicase and a component of the mutator
  complex. This siRNA amplification module is nucleated by the Q/N-rich protein MUT-16 and
  assembles in perinuclear Mutator foci next to P granules. MUT-14 is recruited to Mutator
  foci by MUT-16. It acts redundantly with its paralog SMUT-1 and is needed for RNAi against
  germline-expressed genes, for silencing triggered by antisense RNA oligomers and co-suppression,
  for transposon silencing, and for the RdRP-dependent production of secondary 22G endo-siRNAs
  from thousands of germline targets. A catalytically inactive dominant-negative MUT-14 is
  RNAi defective in vivo, although mutator complexes containing it can still make siRNAs in
  vitro. This suggests that its ATP-dependent helicase activity starts amplification at an
  early step, possibly by recruiting or retaining target mRNAs in Mutator foci.
