core_functions:
- description: MUT-14 is an ATP-dependent DEAD-box RNA helicase recruited by MUT-16 to perinuclear
    Mutator foci. Acting redundantly with SMUT-1, it starts RdRP-dependent secondary 22G-siRNA
    amplification on germline targets, which is needed for RNAi, antisense-RNA-triggered silencing
    and endo-siRNA production.
  molecular_function:
    id: GO:0003724
    label: RNA helicase activity
  directly_involved_in:
  - id: GO:0030422
    label: siRNA processing
  - id: GO:0035194
    label: regulatory ncRNA-mediated post-transcriptional gene silencing
  locations:
  - id: GO:1990633
    label: mutator focus
  supported_by:
  - reference_id: PMID:24684932
    supporting_text: A catalytically inactive, dominant-negative missense mutant of MUT-14
      is RNAi defective in vivo
  - reference_id: PMID:24684932
    supporting_text: The results point to a role for mut-14 and smut-1 in initiating siRNA
      amplification in germ cell Mutator foci, possibly through the recruitment or retention
      of target mRNAs.
suggested_questions:
- question: Which RNA substrates does MUT-14 unwind or remodel in Mutator foci, and does its
    ATPase cycle control how target mRNAs are captured or released for RdRP-templated 22G-RNA
    synthesis?
suggested_experiments:
- description: Purify MUT-14, wild type and the catalytic mutant, and measure its ATPase and
    unwinding activity on target mRNA/siRNA duplexes. Use CLIP in germlines to map which mRNAs
    MUT-14 binds in vivo, with and without SMUT-1.
