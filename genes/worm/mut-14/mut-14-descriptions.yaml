descriptions:
- source: Alliance_Imported
  text: mut-14 encodes a DEAD box RNA helicase; MUT-14 activity is required redundantly
    with its paralog SMUT-1, for germline RNAi and endogenous siRNA formation; mut-14
    mutant animals exhibit germline transposon activation, a deficient response to
    RNAi, resistance to co-suppression, and transgene desilencing.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00003507;class=Gene
  source_id: WB:WBGene00003507
- source: Alliance_Automated
  text: Predicted to enable RNA helicase activity and mRNA binding activity. Involved
    in regulatory ncRNA-mediated post-transcriptional gene silencing. Is active in
    mutator focus. Is expressed in germ cell and germ line.
