descriptions:
- source: Alliance_Imported
  text: mut-14 encodes a DEAD box RNA helicase; MUT-14 activity is required redundantly
    with its paralog SMUT-1, for germline RNAi and endogenous siRNA formation; mut-14
    mutant animals exhibit germline transposon activation, a deficient response to
    RNAi, resistance to co-suppression, and transgene desilencing.
