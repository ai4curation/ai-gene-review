suggested_questions:
- question: What does UGTP-1 transport in C. elegans? The worm lacks CMP-sialic acid, so candidates include
    UDP-sugars (as the name implies) or CDP-linked substrates such as CDP-ribitol, which human SLC35A1
    also carries.
- question: Should PAINT node PTN008496232 (CMP-sialic acid transport, placed at Bilateria) exclude nematodes,
    given that C. elegans has no CMP-sialic acid synthetase or sialyltransferases?
suggested_experiments:
- description: Express UGTP-1 in yeast or in a mammalian SLC35A1/SLC35A2-null cell line and measure uptake
    of radiolabelled CMP-, UDP- and CDP-linked substrates into Golgi-enriched vesicles, to define its
    substrate specificity.
- description: Make a ugtp-1 deletion and profile N- and O-glycans and eggshell or cuticle glycoconjugates
    by mass spectrometry, to identify the glycosylation pathway it supplies.
