id: Q02334
gene_symbol: ugtp-1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: ugtp-1 encodes a 355-residue multi-pass membrane protein of the SLC35A subfamily of nucleotide-sugar
  transporters. Its closest vertebrate orthologs are the SLC35A1 Golgi CMP-sialic acid transporters. GFP-tagged
  UGTP-1 marks medial Golgi elements in oocytes, and during meiosis I it is also seen on cortical granules,
  the Golgi-derived secretory granules whose exocytosis helps build the eggshell. By homology it is a
  Golgi antiporter that exchanges a cytosolic pyrimidine nucleotide sugar for the matching nucleoside
  monophosphate, supplying lumenal glycosyltransferases. Its physiological substrate in C. elegans is
  unknown. The name "UDP-galactose translocator" rests on similarity alone, and CMP-sialic acid is unlikely
  to be the substrate, because the nematode lacks the sialic-acid biosynthesis and sialyltransferase machinery.
