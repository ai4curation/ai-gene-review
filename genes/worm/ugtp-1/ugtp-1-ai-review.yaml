    action: REMOVE
    reason: A transport process needs its substrate. C. elegans has no annotated enzymes to make CMP-sialic
      acid (no NANS, no CMAS) or to use it (no sialyltransferases), while the human and fly controls do.
      CMP-sialic acid transmembrane transport therefore cannot take place in the worm. This is lineage-specific
      biology of the vertebrate and insect SLC35A1 orthologs that the Bilateria-level node over-propagates
      to the nematode. The broader pyrimidine nucleotide-sugar transport row is kept.
