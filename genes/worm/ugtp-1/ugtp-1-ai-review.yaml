    correctness: UNVERIFIED
    review_notes: WormBase curated description (uncited, undated). The nucleotide sugar
      transporter identity and the punctate cytoplasmic UGTP-1::GFP signal with cortical
      granule labelling in oocytes agree with the review (the puncta are medial Golgi,
      PMID:17913784). The UDP-galactose substrate is stated as a prediction and has
      never been tested. It can be neither confirmed nor refuted. UGTP-1 groups with the
      SLC35A1 clade rather than with the SLC35A2 UDP-galactose transporters, and the worm
      substrate is treated as unknown in the review. The CMP-sialic acid substrate in
      the automated text comes from an IBA row that the review already rejects.
