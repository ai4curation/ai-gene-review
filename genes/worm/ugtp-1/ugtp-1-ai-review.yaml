  review:
    summary: CMP-sialic acid transmembrane transporter activity, from PAINT node PTN008496232 (seeded
      only by mouse Slc35a1 and human SLC35A1, placed at Bilateria).
    action: MARK_AS_OVER_ANNOTATED
    reason: 'UGTP-1 is an SLC35A1-like protein, so the node placement is phylogenetically defensible.
      But C. elegans has no annotated CMP-sialic acid synthetase, Neu5Ac synthase or sialyltransferase,
      while the human and fly controls do. The worm therefore apparently lacks the substrate, so this
      cannot be a physiological activity of UGTP-1. Whether the protein could carry CMP-sialic acid in
      vitro has never been tested. The SLC35A1 clade is also not specific to CMP-sialic acid: human SLC35A1
      imports CDP-ribitol as well. The worm substrate is unknown, and the general pyrimidine nucleotide-sugar
      term is as far as the evidence goes.'
