findings:
- category: discrepancy
  text: WormBase gives UDP-galactose and the automated text CMP-sialic acid as the
    substrate; the review says the physiological substrate is unknown and sialic acid
    is implausible in C. elegans.
  sources:
  - Alliance_Imported
  - Alliance_Automated
review:
