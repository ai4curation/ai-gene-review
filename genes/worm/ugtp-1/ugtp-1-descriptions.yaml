descriptions:
- source: Alliance_Imported
  text: ugtp-1 encodes a nucleotide sugar transporter; UGTP-1 is predicted to transport
    UDP-galactose; a UGTP-1::GFP fusion protein is present in the cytoplasm in a punctate
    pattern and also seen on cortical granules in oocytes and briefly in newly fertilized
    embryos.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00022721;class=Gene
  source_id: WB:WBGene00022721
- source: Alliance_Automated
  text: Predicted to enable CMP-N-acetylneuraminate transmembrane transporter activity.
    Predicted to be involved in CMP-N-acetylneuraminate transmembrane transport. Located
    in Golgi medial cisterna and cortical granule. Human ortholog(s) of this gene
    implicated in congenital disorder of glycosylation type IIf. Orthologous to human
    SLC35A1 (solute carrier family 35 member A1).
  source_type: automated
