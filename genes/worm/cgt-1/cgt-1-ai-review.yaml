- term:
    id: GO:1904508
    label: regulation of protein localization to basolateral plasma membrane
  evidence_type: IGI
  original_reference_id: PMID:26115433
  qualifier: involved_in
  supporting_entities:
  - WB:WBGene00004789
  - WB:WBGene00019127
  review:
    summary: cgt-1/cgt-3 double RNAi restored basolateral MIG-14::GFP in sgk-1 (WBGene00004789)
      null intestinal cells.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The observation is a suppression of the sgk-1 null trafficking defect in a sensitized
      background, together with reduced hTAC::GFP puncta in wild type. The authors interpret it as
      a lipid-homeostasis interaction, not as a regulatory role of CGT-1 in basolateral protein
      targeting. Reducing a bulk membrane glycosphingolipid alters many trafficking readouts; this
      is a pleiotropic consequence of the enzyme's biosynthetic activity rather than a process in
      which CGT-1 acts as a regulator.
    supported_by:
    - reference_id: PMID:26115433
      supporting_text: sgk-1 null nearly abolished MIG-14::GFP on the basolateral membrane, but this
        was restored by cgt-1/3 double RNAi (Fig 5).
    - reference_id: PMID:26115433
      supporting_text: Altogether, our results show that sgk-1 and cgt-1/3 have complex genetic
        interactions. Our data indicate that SGK-1 plays a conserved role in lipid homeostasis.
