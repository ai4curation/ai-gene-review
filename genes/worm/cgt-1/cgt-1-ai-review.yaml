suggested_questions:
- question: Is CGT-1 localized to Golgi membranes, as mammalian UGCG is, and is its active site on
    the cytosolic face? If so, can its membrane annotation be refined to GO:0000139 Golgi membrane?
- question: What is the relative contribution of CGT-1 versus CGT-3 to intestinal
    d17iso-glucosylceramide, and do they differ in ceramide substrate (fatty acyl chain) preference?
- question: Should the IGI rows from PMID:26115433 for regulation of protein localization to
    basolateral plasma membrane be retained, given that they rest on suppression of an sgk-1 null
    phenotype rather than on a regulatory activity of CGT-1?
suggested_experiments:
- description: Endogenous CRISPR tagging of CGT-1 (e.g. GFP knock-in) with co-imaging of Golgi
    and ER markers in intestinal cells.
  hypothesis: CGT-1 resides in Golgi membranes of intestinal cells, like mammalian UGCG.
- description: Lipidomic quantification of glucosylceramide species in cgt-1, cgt-3 and double
    mutants, and in vitro assay of purified/microsomal CGT-1 with defined ceramides.
  hypothesis: CGT-1 contributes a minor fraction of total d17iso-glucosylceramide and may differ
    from CGT-3 in acyl-chain preference.
