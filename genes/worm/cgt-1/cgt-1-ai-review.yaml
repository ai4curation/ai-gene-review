id: O18037
gene_symbol: cgt-1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: >-
  cgt-1 (T06C12.10) encodes one of the three C. elegans ceramide glucosyltransferases
  (UDP-glucose:ceramide glucosyltransferase, UGCG/GCS orthologs; EC 2.4.1.80), a multi-pass
  membrane glycosyltransferase of the GT2 family with three predicted transmembrane helices and
  the conserved D1, D2, D3 and (Q/R)XXRW catalytic motifs. CGT-1 transfers glucose from
  UDP-glucose to ceramide to form glucosylceramide, the first step of glycosphingolipid
  synthesis; in C. elegans the substrate ceramides carry an iso-branched C17 sphingoid base.
  CGT-1 acts redundantly with CGT-3 (the more active paralog): animals lacking both enzymes make
  essentially no glycosphingolipids and arrest at the first larval stage because of defects in
  digestive-tract cells, and the d17iso-glucosylceramide they produce in the intestine acts
  upstream of TORC1 to promote postembryonic development. Loss of cgt-1 alone reduces brood size
  and causes oocyte and early embryonic cytokinesis defects, and modifies intestinal membrane
  trafficking phenotypes of sgk-1 mutants. Its subcellular location has not been determined
  experimentally; by homology to mammalian UGCG it is expected to reside in Golgi membranes.
