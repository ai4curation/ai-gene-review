      cells deficient in glycosphingolipids (GSLs).
  - reference_id: PMID:23705068
    supporting_text: cgt-1 and cgt-3 encode two ceramide glucosyltransferases that glucosylate
      ceramides to GlcCer
  - reference_id: PMID:19240113
