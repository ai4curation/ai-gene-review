- description: >-
    UDP-glucose:ceramide glucosyltransferase that synthesises glucosylceramide (including
    d17iso-glucosylceramide with the C. elegans iso-branched sphingoid base), the first step of
    glycosphingolipid synthesis, acting redundantly with CGT-3 in intestinal and other
    digestive-tract cells; it is a multi-pass membrane enzyme.
