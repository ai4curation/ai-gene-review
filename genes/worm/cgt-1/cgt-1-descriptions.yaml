gene_symbol: cgt-1
organism: worm
uniprot_id: O18037
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Catalyzes the first glycosylation step in glycosphingolipid biosynthesis,
    the transfer of glucose to ceramide to produce glucosylceramides (GlcCer). GlcCer
    are known to contribute to the physical properties and physiological functions
    of membranes and may regulate signal transduction (PubMed:19240113, PubMed:21325339).
    Only branched-chain sphingoid bases like 15-methylhexadecasphing-4-enine are used
    for generating complex sphingolipids in Caenorhabditis elegans (PubMed:7651085).
    Together with cgt-3, plays a role in the trafficking of proteins such as mig-14
    to the cell membrane in intestinal cells (PubMed:26115433).
  source_type: curated
  url: https://www.uniprot.org/uniprot/O18037
  source_id: O18037
- source: Alliance_Imported
  text: cgt-1 encodes a transmembrane protein that is one of three C. elegans ceramide
    glucosyltransferases; by homology, CGT-1 is predicted to localize to the Golgi
    membrane and catalyze the transfer of glucose from UDP-glucose to ceramide to
    synthesize glucosylceramide, a glycosphingolipid precursor; although cgt-1 mutant
    worms show no obvious defects, animals doubly mutant for cgt-1 and cgt-3 arrest
    development in the early L1 larval stage, showing impaired feeding ability; in
    addition, cgt-3;cgt-1 and cgt-3;cgt-1;cgt-2 mutant animals show reduced glucosylceramide
    levels; a CGT-1::GFP reporter fusion is expressed in pharyngeal tissues, the intestine,
    the pharyngeal-intestinal and intestinal-rectal valves, the rectal gland cells,
    unidentified head cells, and the excretory system; cgt-1 expression in the intestine
    is sufficient to rescue the defects of cgt-3;cgt-1 mutant animals.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00011517;class=Gene
  source_id: WB:WBGene00011517
- source: Alliance_Automated
  text: Predicted to enable ceramide glucosyltransferase activity. Involved in glucosylceramide
    biosynthetic process; nematode larval development; and regulation of protein localization
    to basolateral plasma membrane. Predicted to be active in membrane. Is expressed
    in excretory system; intestine; pharyngeal muscle cell; pharyngeal-intestinal
    valve; and rectum. Orthologous to human UGCG (UDP-glucose ceramide glucosyltransferase).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00011517;class=Gene
  source_id: WB:WBGene00011517
