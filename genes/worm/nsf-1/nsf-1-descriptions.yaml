    overall_notes: By-similarity Golgi/ER-Golgi fusion text; correct but no SNARE
      disassembly mechanism or worm-specific data.
- source: Alliance_Automated
  text: Predicted to enable ATP hydrolysis activity. Involved in IRE1-mediated unfolded
    protein response. Predicted to be located in cytoplasm. Predicted to be active
    in Golgi stack. Is expressed in several structures, including egg-laying apparatus;
    excretory gland cell; nervous system; pharynx; and rectal gland cell. Human ortholog(s)
    of this gene implicated in cocaine dependence and developmental and epileptic
    encephalopathy 96. Orthologous to human NSF (N-ethylmaleimide sensitive factor,
    vesicle fusing ATPase).
