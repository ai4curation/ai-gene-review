gene_symbol: nsf-1
organism: worm
uniprot_id: Q94392
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Required for vesicle-mediated transport. Catalyzes the fusion of transport
    vesicles within the Golgi cisternae. Is also required for transport from the endoplasmic
    reticulum to the Golgi stack. Seems to function as a fusion protein required for
    the delivery of cargo proteins to all compartments of the Golgi stack independent
    of vesicle origin (By similarity).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q94392
  source_id: Q94392
- source: Alliance_Automated
  text: Predicted to enable ATP hydrolysis activity. Involved in IRE1-mediated unfolded
    protein response. Predicted to be located in cytoplasm. Predicted to be active
    in Golgi stack. Is expressed in several structures, including egg-laying apparatus;
    excretory gland cell; nervous system; pharynx; and rectal gland cell. Human ortholog(s)
    of this gene implicated in cocaine dependence and developmental and epileptic
    encephalopathy 96. Orthologous to human NSF (N-ethylmaleimide sensitive factor,
    vesicle fusing ATPase).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00003818;class=Gene
  source_id: WB:WBGene00003818
