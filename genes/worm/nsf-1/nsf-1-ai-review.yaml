suggested_questions:
- question: Do nsf-1 loss-of-function or temperature-sensitive alleles cause synaptic transmission 
    defects (aldicarb resistance, reduced evoked release) confirming the synaptic cis-SNARE 
    recycling role in worm?
- question: Which vesicular trafficking step downstream of NSF-1 (delivery of EFF-1/AFF-1 fusogen or
    membrane) underlies the anchor-cell fusion requirement?
suggested_experiments:
- description: Auxin-inducible degradation of NSF-1 in cholinergic motor neurons with 
    electrophysiology at the neuromuscular junction and cis-SNARE complex measurement by 
    non-denaturing western blot.
  hypothesis: Acute loss of NSF-1 accumulates SDS-resistant cis-SNARE complexes and depletes 
    releasable vesicles.
