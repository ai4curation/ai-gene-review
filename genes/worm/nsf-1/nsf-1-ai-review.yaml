  label: Caenorhabditis elegans
description: >-
  NSF-1 is the Caenorhabditis elegans N-ethylmaleimide-sensitive factor, a homohexameric AAA+
  ATPase that, with its adaptor alpha-SNAP (SNAP-1), binds cis-SNARE complexes left in a membrane
  after fusion and uses ATP hydrolysis to pull the four-helix bundle apart, regenerating free
  SNAREs for further rounds of vesicle fusion. This disassembly activity underlies vesicle traffic
  throughout the secretory pathway, including ER-Golgi and intra-Golgi transport and the recycling
  of the synaptic SNAREs UNC-64, RIC-4 and SNB-1 after synaptic vesicle exocytosis. Two isoforms
  are transcribed from separate promoters in distinct tissues; the uterine isoform NSF-1L is
  required cell-autonomously for fusion of the anchor cell with the uterine seam cell, the best
  characterised in vivo requirement for NSF-1 in the worm. nsf-1 transcription is also under
  control of the IRE-1/XBP-1 unfolded-protein-response pathway.
