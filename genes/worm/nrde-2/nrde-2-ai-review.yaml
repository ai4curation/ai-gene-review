core_functions:
- description: siRNA-guided nuclear Argonautes (NRDE-3, HRDE-1) recruit NRDE-2 to nascent
    target transcripts. There it is required for NRDE-1 recruitment to pre-mRNA and chromatin,
    for H3K9me3 deposition, and for inhibition of RNAP II elongation, which silences targets
    co-transcriptionally in somatic and germ-cell nuclei. Its exact molecular activity (adaptor,
    or regulator of an RNA helicase such as MTR-4) is not yet known.
  directly_involved_in:
  - id: GO:0031048
    label: regulatory ncRNA-mediated heterochromatin formation
  - id: GO:0031047
    label: regulatory ncRNA-mediated gene silencing
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:20543824
    supporting_text: NRDE-2 associates with the Argonaute protein NRDE-3 within nuclei and
      is recruited by NRDE-3/siRNA complexes to nascent transcripts that have been targeted
      by RNAi.
  - reference_id: PMID:22810588
    supporting_text: HRDE-1 was required for RNAi-mediated recruitment of NRDE-2 to a germline
      pre-mRNA
  - reference_id: PMID:37083324
    supporting_text: Tethering a heterochromatin-silencing factor, NRDE-2, induces heterochromatin
      formation, which subsequently causes de novo synthesis of HRDE-1 guide RNAs.
suggested_questions:
- question: Does C. elegans NRDE-2 keep the MTR4-interacting domain and the MTR-4/exosome-inhibitory
    activity of human NRDE2? If so, is that activity part of how it silences nascent transcripts?
- question: What is the direct molecular activity by which NRDE-2 links Argonaute recruitment
    to NRDE-1 loading, H3K9me3 and RNAP II elongation arrest?
suggested_experiments:
- description: Test in vitro whether recombinant worm NRDE-2 binds MTR-4. In vivo, test whether
    NRDE-2 mutants lacking the putative MTR4-interacting region keep nuclear RNAi and H3K9me3
    at germline target genes.
