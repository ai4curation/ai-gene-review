gene_symbol: nrde-2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: NRDE-2 (nuclear RNAi defective-2) is a conserved nuclear protein of the NRDE2
  family, with an N-terminal NRDE-2 domain, an SR-rich region and HAT-like (half-a-TPR) repeats.
  It is a core downstream factor of the C. elegans nuclear RNAi pathway. siRNA-loaded nuclear
  Argonautes (NRDE-3 in somatic cells, HRDE-1 in the germline) recruit NRDE-2 to nascent transcripts
  complementary to their guide RNAs. NRDE-2 is then needed for NRDE-1 to associate with pre-mRNA
  and chromatin, for siRNA-directed H3K9 and H3K27 trimethylation at target loci, and for
  inhibition of RNA polymerase II during transcription elongation, which silences target pre-mRNA
  co-transcriptionally. When antisense ribosomal siRNAs are present, NRDE-2 also moves to
  the nucleolus and inhibits RNA polymerase I elongation on pre-rRNA. NRDE-2 is required for
  multigenerational RNAi inheritance and germline immortality. The human ortholog NRDE2 binds
  and inhibits the exosome cofactor MTR4 in nuclear speckles. Whether worm NRDE-2 keeps this
  exosome-regulatory activity has not been tested.
