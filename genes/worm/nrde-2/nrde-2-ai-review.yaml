- term:
    id: GO:0035194
    label: regulatory ncRNA-mediated post-transcriptional gene silencing
  evidence_type: IMP
  original_reference_id: PMID:21901112
  qualifier: involved_in
  review:
    summary: nrde-2 mutants are defective in nuclear RNAi (for example lir-1 RNAi) and in
      the recruitment of NRDE-1 to pre-mRNA. The silencing is nuclear and co-transcriptional,
      not post-transcriptional.
    action: MODIFY
    reason: The genetic requirement is solid, but NRDE-2 acts in the nucleus on nascent transcripts
      and chromatin. It inhibits RNAP II elongation and promotes H3K9me3 rather than destabilizing
      mature mRNA or blocking its translation, as the post-transcriptional silencing definition
      requires. The general parent regulatory ncRNA-mediated gene silencing describes this
      better.
    proposed_replacement_terms:
    - id: GO:0031047
      label: regulatory ncRNA-mediated gene silencing
    supported_by:
    - reference_id: PMID:21901112
      supporting_text: NRDE-3 and NRDE-2 are required for the association of NRDE-1 with pre-mRNA
        and chromatin.
    - reference_id: PMID:20543824
      supporting_text: These results define NRDE-2 as a component of the nuclear RNAi machinery
        and demonstrate that metazoan siRNAs can silence nuclear-localized RNAs co-transcriptionally.
