gene_symbol: nrde-2
organism: worm
uniprot_id: G5EG51
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Protein of the nuclear speckles that regulates RNA exosomal degradation (By
    similarity). Involved in short interfering RNAs- mediated silencing in nuclei
    (PubMed:20543824). Functions with nrde-3 in the nuclear RNA-mediated gene silencing
    (RNAi) pathway to regulate gene expression via inhibition of RNA polymerases I
    and II during the elongation phase of transcription (PubMed:20543824, PubMed:34365510).
    Required for exogenous RNAi-induced H3K27 methylation (PubMed:26365259).
  source_type: curated
  url: https://www.uniprot.org/uniprot/G5EG51
  source_id: G5EG51
- source: Alliance_Imported
  text: nrde-2 encodes a protein containing a conserved domain of unknown function
    (DUF 1740), a serine/arginine-rich domain, and a half-a-tetratricopeptide (HAT)-like
    domain that is conserved in plants, fungi, insect, and mammals; NRDE-2 functions
    with NRDE-3 in the nuclear RNAi pathway to regulate gene expression via inhibition
    of RNA polymerase II during the elongation phase of transcription and via an NRDE-2-dependent
    enrichment of histone H3K9 methylation at genomic sites targeted by RNAi; an NRDE-2::GFP
    fusion protein localizes to the nucleus.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00011333;class=Gene
  source_id: WB:WBGene00011333
- source: Alliance_Automated
  text: Involved in regulatory ncRNA-mediated heterochromatin formation and regulatory
    ncRNA-mediated post-transcriptional gene silencing. Located in nucleus. Is expressed
    in several structures, including germ line. Orthologous to human NRDE2 (NRDE-2,
    necessary for RNA interference, domain containing).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00011333;class=Gene
  source_id: WB:WBGene00011333
