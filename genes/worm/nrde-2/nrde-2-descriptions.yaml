    - rubric: specificity
      score: 4
    overall_notes: Nuclear RNAi with NRDE-3, Pol I and Pol II elongation inhibition,
      H3K27 methylation are cited; the nuclear speckle/exosome sentence is by similarity
      to human NRDE2 and untested in worm.
- source: Alliance_Imported
  text: nrde-2 encodes a protein containing a conserved domain of unknown function
    (DUF 1740), a serine/arginine-rich domain, and a half-a-tetratricopeptide (HAT)-like
    domain that is conserved in plants, fungi, insect, and mammals; NRDE-2 functions
    with NRDE-3 in the nuclear RNAi pathway to regulate gene expression via inhibition
    of RNA polymerase II during the elongation phase of transcription and via an NRDE-2-dependent
    enrichment of histone H3K9 methylation at genomic sites targeted by RNAi; an NRDE-2::GFP
    fusion protein localizes to the nucleus.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00011333;class=Gene
