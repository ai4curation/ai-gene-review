descriptions:
- source: UniProt
  text: Protein of the nuclear speckles that regulates RNA exosomal degradation (By
    similarity). Involved in short interfering RNAs- mediated silencing in nuclei
    (PubMed:20543824). Functions with nrde-3 in the nuclear RNA-mediated gene silencing
    (RNAi) pathway to regulate gene expression via inhibition of RNA polymerases I
    and II during the elongation phase of transcription (PubMed:20543824, PubMed:34365510).
    Required for exogenous RNAi-induced H3K27 methylation (PubMed:26365259).
  source_type: curated
  url: https://www.uniprot.org/uniprot/G5EG51
  source_id: G5EG51
