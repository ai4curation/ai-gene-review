suggested_questions:
- question: Does loss of unc-41 deplete synaptotagmin (SNT-1) from synaptic vesicles and cause its accumulation
    on the presynaptic plasma membrane, as stonin 2 loss does in mammalian neurons, and which AP-2-binding
    motifs of UNC-41 are required in vivo?
