core_functions:
- description: UNC-41 is a stonin sorting adaptor whose mu-homology domain binds the C2 domains of synaptotagmin
    and whose N-terminal motifs engage AP-2, concentrating synaptotagmin into clathrin-coated pits at
    the presynaptic membrane so that it is retrieved into regenerating synaptic vesicles.
