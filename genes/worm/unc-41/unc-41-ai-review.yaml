gene_symbol: unc-41
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: 'unc-41 encodes the sole Caenorhabditis elegans stonin, the orthologue of Drosophila stoned
  B and mammalian stonin 2: a monomeric endocytic sorting adaptor dedicated to retrieving the synaptic
  vesicle calcium sensor synaptotagmin during clathrin-mediated synaptic vesicle recycling. Its C-terminal
  mu-homology domain binds basic clusters on the cytoplasmic C2 domains of synaptotagmin through a conserved
  KYE-containing beta strand, while its N-terminal region carries motifs that engage the AP-2 adaptor
  and other endocytic proteins, so that synaptotagmin is concentrated into clathrin-coated pits at the
  presynaptic membrane. UNC-41B is expressed in neurons and accumulates in synaptic puncta; a nonsense
  allele abolishes the protein and causes severe locomotion defects that are rescued by wild-type UNC-41B
  but not by a synaptotagmin-binding-defective mutant, showing that cargo recognition is essential for
  its function in neurotransmission.'
