    overall_notes: 'Dated and vague: ''potential adapter'' that ''may be involved''
      in vesicle recycling. No synaptotagmin cargo, which is the established function.'
- source: Alliance_Imported
  text: unc-41 encodes an ortholog of Drosophila STONED B (STNB) required for normal
    locomotion; a beta-strand in the mu-adaptin-like domain of UNC-41 binds the C2A
    domain of SNT-1, and this binding is required for SNT-1 endocytosis, punctate
    localization of UNC-41 in neurons, and transgenic rescue of unc-41(e268) animals;
    UNC-41 is also required for normal secretion of EGL-17 from P6.p cells, and for
    embryonic viability; UNC-41 is expressed in the larval and adult nervous system;
    UNC-41, like other stonins, is an adaptin, and by orthology with stonins is predicted
    to be a protein adaptor that helps sort SNT-1 endocytotically.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00006777;class=Gene
  source_id: WB:WBGene00006777
