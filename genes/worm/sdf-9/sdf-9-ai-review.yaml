- id: PMID:12783794
  title: SDF-9, a protein tyrosine phosphatase-like molecule, regulates the L3/dauer
    developmental decision through hormonal signaling in C. elegans.
  findings:
  - statement: sdf-9 mutants form dauer-like larvae resembling daf-9/daf-12 Daf-c mutants,
      enhanced by cholesterol deprivation; SDF-9 promotes DAF-9 activity.
    supporting_text: suggested that SDF-9 increases the activity of DAF-9 or helps the
      execution of the DAF-9 function
  - statement: SDF-9 is expressed in the XXXL/R cells, which also express DAF-9; ablation of
      these cells causes dauer-like arrest.
    supporting_text: Killing of the sdf-9-expressing cells in the wild-type first-stage
      larva induced formation of the dauer-like larva.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Cloning paper for sdf-9 (Development 2003). Title and abstract confirmed in cache;
      abstract-only, so localization (cytoplasm) and residue claims in the full text could not
      be checked here.
- id: PMID:16839187
  title: Two membrane-associated tyrosine phosphatase homologs potentiate C. elegans AKT-1/PKB
    signaling.
  findings:
  - statement: SDF-9 lacks the catalytic cysteine and is predicted to be catalytically
      inactive.
    supporting_text: Whereas SDF-9 does not retain the canonical catalytic cysteine residue
      found in all known PTPs and is therefore predicted to be catalytically inactive
  - statement: SDF-9::GFP localizes to the XXX plasma membrane independently of DAF-2
      signalling.
    supporting_text: indicating that its localization does not require normal levels of
      DAF-2/InsR signaling
  - statement: Tagged SDF-9 did not co-precipitate tyrosine phosphoproteins and did not bind
      phosphoinositides (data not shown), so a pTyr-binding adaptor function is unproven.
    supporting_text: epitope-tagged SDF-9 and EAK-6 did not coprecipitate tyrosine
      phosphoproteins after exposure of transfected cultured 293T cells to IGF-1
  - statement: SDF-9 may act with DAF-9 in XXX to promote dafachronic acid production.
    supporting_text: In XXX, SDF-9 may function with DAF-9/CYP27A1 to promote the synthesis
      and/or secretion of dafachronic acids
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text available (PMC1487177). Primary source for membrane localization, eak-pathway
      genetics, and the pseudophosphatase prediction. Several key biochemical negatives
      (coIP, phosphoinositide binding) are reported as unpublished data.
- id: PMID:17660545
  title: Caenorhabditis elegans SDF-9 enhances insulin/insulin-like signaling through
    interaction with DAF-2.
  findings:
  - statement: SDF-9 is proposed, from genetic interaction data, to stabilize activated
      DAF-2 or act as an adaptor in insulin-like signalling.
    supporting_text: We propose that SDF-9 stabilizes the active phosphorylated state of
      DAF-2 or acts as an adaptor protein to enhance insulin-like signaling.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Genetics 2007; abstract-only in cache. The DAF-2 interaction is framed as a proposal
      ("may interact directly"), based on allele-specific genetic interactions; no biochemical
      binding is described in the abstract.
- id: file:worm/sdf-9/sdf-9-bioinformatics/RESULTS.md
  title: SDF-9 catalytic-residue check against PTP1B
  findings:
  - statement: Catalytic Cys aligns to Ser223; P-loop His and Ser/Thr and pTyr-loop Tyr are
      also substituted; P-loop Arg retained.
    supporting_text: The catalytic cysteine position is **Ser223** in the current SDF-9
      sequence.
core_functions:
- description: >-
    Catalytically inactive PTP-like (pseudophosphatase) protein at the cytoplasmic face of
    the plasma membrane of the XXXL/R endocrine cells, where, together with EAK-4 and EAK-6
    and in parallel to AKT-1, it promotes reproductive development and prevents dauer entry,
    probably by potentiating DAF-9-dependent dafachronic acid production. Its molecular
    activity is unknown.
  directly_involved_in:
  - id: GO:0040024
    label: dauer larval development
  locations:
  - id: GO:0005886
    label: plasma membrane
  anatomical_locations:
  - id: WBbt:0007855
    label: XXX cell
  supported_by:
  - reference_id: PMID:16839187
    supporting_text: The data presented in this work are consistent with a model whereby
      EAK-4, SDF-9, and EAK-6 function in a single complex or pathway at the XXX plasma
      membrane in parallel with AKT-1 to inhibit dauer formation.
  - reference_id: PMID:12783794
    supporting_text: suggested that SDF-9 increases the activity of DAF-9 or helps the
      execution of the DAF-9 function
  knowledge_gaps:
  - gap_statement: >-
      The molecular activity of SDF-9 is unknown. It is catalytically dead, and proposed
      roles as a phosphotyrosine-binding (substrate-trap-like) adaptor, a stabilizer of
      phosphorylated DAF-2, or a partner of EAK-6 in a heteromeric phosphatase have not been
      demonstrated; tested interactions (pTyr proteins, phosphoinositides, EAK-4, EAK-6) were
      negative in heterologous cells.
    boundary: >-
      Established: SDF-9 is a PTP-fold protein lacking the catalytic cysteine, is
      membrane-associated in XXX cells, and is genetically required with EAK-4/EAK-6 and DAF-9
      to prevent dauer entry. Unknown: what it binds and how it promotes DAF-9 output.
    gap_kind:
    - BIOLOGY
    dark_aspect: MF_DARK
    status: OPEN
    significance: >-
      Without a molecular activity, the link between an XXX-cell membrane pseudophosphatase
      and dafachronic acid production cannot be modelled mechanistically.
    resolution: >-
      In vivo proximity labelling or IP-mass spectrometry of endogenously tagged SDF-9 in XXX
      cells, plus tests of DAF-2 and EAK-6 binding in worm extracts.
    provenance:
    - reference_id: PMID:16839187
      supporting_text: We cannot rule out the possibility that biologically relevant EAK
        protein-protein or protein-lipid interactions require additional components that
        exist in vivo but were not present in the assays described.
suggested_questions:
- question: >-
    UniProt's CAUTION states the catalytic cysteine is replaced by lysine at position 223,
    but the current G5EGA9 sequence has serine at 223 (QSARGSSRAG aligned to PTP1B
    HCSAGIGRSG). Should the CAUTION text be corrected?
- question: >-
    Does SDF-9 directly bind DAF-2 (as proposed from allele-specific genetics) or
    tyrosine-phosphorylated proteins in vivo, given that heterologous co-IP in 293T cells was
    negative?
- question: >-
    Would positive regulation of insulin receptor signaling pathway (GO:0046628) or negative
    regulation of dauer larval development (GO:0061067) be a more precise process annotation
    for sdf-9 than dauer larval development, given genetic placement upstream of or in
    parallel to AGE-1/AKT-1 rather than demonstrated participation?
- question: >-
    Does SDF-9 act as the non-catalytic partner of EAK-6 (same PANTHER subfamily SF561), by
    analogy with the inactive D2 domains of receptor PTPs?
suggested_experiments:
- description: >-
    Restore the catalytic cysteine (S223C, with Q222H and A230S) in an sdf-9 rescue
    construct and test whether a catalytically competent version changes rescue of the
    dauer phenotype; in parallel, assay recombinant SDF-9 and the restored mutant for PTP
    activity against pNPP and phosphopeptides.
- description: >-
    Endogenous tagging of SDF-9 followed by XXX-cell-specific proximity labelling (TurboID)
    to identify membrane partners (e.g. DAF-2, EAK-4, EAK-6) and test whether SDF-9 controls
    DAF-9 levels or dafachronic acid output (rescue of sdf-9 Daf-c by exogenous
    dafachronic acid).
