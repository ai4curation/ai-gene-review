gene_symbol: sdf-9
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: >-
  SDF-9 (synthetic dauer formation 9; also EAK-5) is a 345-residue protein consisting
  almost entirely of a single protein tyrosine phosphatase (PTP)-like domain that has lost
  the catalytic machinery of the family: the nucleophilic cysteine of the HCxxGxxR(S/T)
  signature is replaced by serine (Ser223), and the P-loop histidine, P-loop serine/threonine
  and the phosphotyrosine-recognition tyrosine are also substituted. It is therefore a
  pseudophosphatase. SDF-9 is expressed specifically in the two XXXL/R head cells, endocrine
  cells that also express the dafachronic acid-synthesizing cytochrome P450 DAF-9, and it
  is a peripheral protein of the XXX plasma membrane whose membrane association does not
  require DAF-2 insulin-receptor signalling. Loss of sdf-9 causes partial, dauer-like larval
  arrest resembling daf-9 and daf-12 dauer-constitutive mutants, enhanced by cholesterol
  deprivation and suppressed by DAF-9 overexpression and by daf-16/FoxO loss. Genetically,
  SDF-9 acts with the membrane-associated EAK-4 and the PTP homolog EAK-6 in a single pathway,
  in parallel to AKT-1, to promote reproductive development, probably by potentiating DAF-9
  dafachronic acid production in XXX cells. Its molecular activity is unknown; proposed roles
  as a phosphotyrosine-binding adaptor or a stabilizer of activated DAF-2 have not been
  substantiated biochemically.
existing_annotations:
- term:
    id: GO:0004725
    label: protein tyrosine phosphatase activity
  evidence_type: IKR
  original_reference_id: PMID:16839187
  qualifier: enables
  negated: true
  review:
    summary: >-
      NOT annotation: SDF-9 lacks protein tyrosine phosphatase activity. Hu et al. note that
      SDF-9 lacks the catalytic cysteine found in all known PTPs and predict it to be
      catalytically inactive. A local alignment to PTP1B confirms the signature motif
      HCSAGIGRSG aligns gap-free to SDF-9 QSARGSSRAG, so the nucleophile Cys215 is Ser223 in
      SDF-9, and the P-loop His214 (Gln) and Ser222 (Ala) and pTyr-loop Tyr46 (Val) are also
      lost. No phosphatase activity has been reported for SDF-9. The NOT annotation is
      correct and is the appropriate record of pseudophosphatase status.
    action: ACCEPT
    reason: >-
      Loss of the catalytic nucleophile plus several other invariant catalytic residues is
      the strongest sequence-level evidence of catalytic inactivity; this is the canonical
      PSEUDOENZYME case and the NOT annotation correctly blocks family-level propagation of
      GO:0004725 to SDF-9.
    supported_by:
    - reference_id: PMID:16839187
      supporting_text: Whereas SDF-9 does not retain the canonical catalytic cysteine residue
        found in all known PTPs and is therefore predicted to be catalytically inactive
    - reference_id: file:worm/sdf-9/sdf-9-bioinformatics/RESULTS.md
      supporting_text: The catalytic cysteine position is **Ser223** in the current SDF-9
        sequence.
