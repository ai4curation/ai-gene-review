gene_symbol: sdf-9
organism: worm
uniprot_id: G5EGA9
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Together with eak-4 and phosphatase eak-6, negatively regulates dauer larva
    formation downstream of insulin-like receptor daf-2 and in parallel of age-1,
    pdk-1 and akt-1.
  source_type: curated
  url: https://www.uniprot.org/uniprot/G5EGA9
  source_id: G5EGA9
- source: Alliance_Imported
  text: sdf-9 encodes a protein tyrosine phosphatase, paralogous to EAK-6; sdf-9 acts
    in parallel to akt-1 to regulate insulin-like signaling and dauer formation and
    may promote DAF-9 activity by means of steroid hormone signalling; sdf-9 dauer
    larvae resemble those of daf-9 and daf-12 dauer-constitutive mutants, and these
    Daf-c mutants are all enhanced by cholesterol deprivation; SDF-9 is expressed
    in the neuroendocrine XXXL/R cells, where it associates with the plasma membrane;
    ablation of the XXXL/R cells in wild-type L1 larvae also causes daf-9-like pseudodauer
    larvae.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00004748;class=Gene
  source_id: WB:WBGene00004748
- source: Alliance_Automated
  text: Involved in dauer larval development. Located in cytoplasm and plasma membrane.
    Is expressed in XXXL; XXXR; and head.
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00004748;class=Gene
