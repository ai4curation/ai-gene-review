    overall_notes: Correct but generic GST text plus ROS detoxification during infection.
      Omits the SKN-1 induction that makes gst-4 a standard reporter.
- source: Alliance_Imported
  text: gst-4 encodes a putative glutathione-requiring prostaglandin D synthase;gst-4
    is required for sperm to normally migrate towards a PUFA-basedsignal exuded by
    oocytes; gst-4(RNAi) hermaphrodites are infertile, boththrough aberrant loss of
    their own sperm and through failure of males toeffectively inseminate them; in
    mammalian eicosanoid signalling,prostaglandin D synthase is required for the conversion
    of prostaglandinH2 into D2; gst-4 mRNA is expressed in adults, and accumulationincreases
    in response to paraquat.
