gene_symbol: gst-4
organism: worm
uniprot_id: Q21355
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Conjugation of reduced glutathione to a wide number of exogenous and endogenous
    hydrophobic electrophiles (By similarity). May play a role in the detoxification
    of reactive oxygen species produced during pathogenic bacterial infection (PubMed:22216003).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q21355
  source_id: Q21355
- source: Alliance_Imported
  text: gst-4 encodes a putative glutathione-requiring prostaglandin D synthase;gst-4
    is required for sperm to normally migrate towards a PUFA-basedsignal exuded by
    oocytes; gst-4(RNAi) hermaphrodites are infertile, boththrough aberrant loss of
    their own sperm and through failure of males toeffectively inseminate them; in
    mammalian eicosanoid signalling,prostaglandin D synthase is required for the conversion
    of prostaglandinH2 into D2; gst-4 mRNA is expressed in adults, and accumulationincreases
    in response to paraquat.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00001752;class=Gene
  source_id: WB:WBGene00001752
- source: Alliance_Automated
  text: Enables glutathione transferase activity. Involved in glutathione metabolic
    process. Located in contractile muscle fiber. Is expressed in several structures,
    including body wall musculature; intestine; muscle cell; nervous system; and pharynx.
    Human ortholog(s) of this gene implicated in allergic asthma. Orthologous to human
    HPGDS (hematopoietic prostaglandin D synthase).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00001752;class=Gene
  source_id: WB:WBGene00001752
