- source: UniProt
  text: Conjugation of reduced glutathione to a wide number of exogenous and endogenous
    hydrophobic electrophiles (By similarity). May play a role in the detoxification
    of reactive oxygen species produced during pathogenic bacterial infection (PubMed:22216003).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q21355
