- source: Alliance_Automated
  text: Enables glutathione transferase activity. Involved in glutathione metabolic
    process. Located in contractile muscle fiber. Is expressed in several structures,
    including body wall musculature; intestine; muscle cell; nervous system; and pharynx.
    Human ortholog(s) of this gene implicated in allergic asthma. Orthologous to human
    HPGDS (hematopoietic prostaglandin D synthase).
