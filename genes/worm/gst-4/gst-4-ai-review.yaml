  evidence_type: IMP
  original_reference_id: PMID:12757851
  review:
    summary: 'GST-4 levels determine oxidative stress resistance: overexpression raises it,
      RNAi or K08F4.7 deletion lowers it; the enzyme detoxifies lipid peroxidation products.'
    action: NEW
    reason: GST-4 performs part of the response (enzymatic conjugation/detoxification of oxidative
      products), satisfying the participation test; bidirectional dosage data support it.
      No process term beyond glutathione metabolism is currently annotated.
    supported_by:
    - reference_id: PMID:12757851
      supporting_text: Stress experiments with BL1 demonstrated an increased resistance to
        intracellularly induced oxidative stress, as compared to wild type.
    - reference_id: PMID:12757851
      supporting_text: In both cases, the reduced Ce-GST-p24 enzyme level resulted in a significant
        decrease in the stress resistance of the nematodes.
    - reference_id: PMID:12757851
      supporting_text: The enzymatic activity of this detoxification enzyme was examined with
        various substrates, giving emphasis to lipid peroxidation products.
