description: 'GST-4 (K08F4.7, also called Ce-GST-p24) is a sigma-class glutathione S-transferase
  of C. elegans, a small cytosolic enzyme that conjugates reduced glutathione to hydrophobic
  electrophiles, with activity towards lipid peroxidation products. gst-4 is transcriptionally
  induced by oxidative stress (paraquat, pathogen-generated reactive oxygen species, light)
  through the transcription factor SKN-1, and its promoter-GFP fusion is a widely used reporter
  of SKN-1 activity. The enzyme is broadly distributed in tissues, and its abundance sets
  organismal resistance to oxidative stress: overexpression increases, and RNAi or deletion
  decreases, survival under intracellularly generated oxidative stress.'
