gene_symbol: srp-2
organism: worm
uniprot_id: O17365
taxon_id: NCBITaxon:6239
descriptions:
- source: Alliance_Imported
  text: srp-2 encodes an ovalbumin-like serpin (ov-serpin), that is a member of the
    serine protease inhibitor superfamily; SRP-2 is predicted to function as a suicide
    substrate that inhibits the proteolytic activity of serine proteases, and in vitro,
    recombinant SRP-2 is able to inhibit granzyme B activity; srp-2 expression is
    detected in hypodermal cells, particularly in the lateral seam cells.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00005643;class=Gene
  source_id: WB:WBGene00005643
- source: Alliance_Automated
  text: Enables cysteine-type endopeptidase inhibitor activity and serine-type endopeptidase
    inhibitor activity. Predicted to be active in extracellular region. Is expressed
    in several structures, including anal sphincter muscle; cuticle; eggshell; epithelial
    cell; and phasmid neurons. Used to study familial encephalopathy with neuroserpin
    inclusion bodies. Human ortholog(s) of this gene implicated in several diseases,
    including angioedema (multiple); artery disease (multiple); cerebrovascular disease
    (multiple); liver disease (multiple); and lung disease (multiple). Orthologous
    to several human genes including SERPINB11 (serpin family B member 11); SERPINB3
    (serpin family B member 3); and SERPINI1 (serpin family I member 1).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00005643;class=Gene
  source_id: WB:WBGene00005643
