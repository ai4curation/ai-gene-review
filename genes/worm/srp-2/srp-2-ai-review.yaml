- id: PMID:14739286
  title: 'SRP-2 is a cross-class inhibitor that participates in postembryonic development
    of the nematode Caenorhabditis elegans: initial characterization of the clade L
    serpins.'
  findings:
  - statement: Recombinant SRP-2 is a cross-class inhibitor of granzyme B (serine) and of
      cathepsins K, L, S and V (cysteine).
    supporting_text: Biochemical analysis of recombinant SRP-2 protein revealed SRP-2 to be a
      dual cross-class inhibitor of the apoptosis-related serine proteinase, granzyme B, and the
      lysosomal cysteine proteinases, cathepsins K, L, S, and V.
  - statement: SRP-2 is expressed in early embryos and in the larval and adult intestine and
      hypodermis.
    supporting_text: SRP-2 was present during early embryonic development and highly expressed in
      the intestine and hypoderm of larval and adult worms
  - statement: Overexpression of SRP-2 causes slow growth and larval arrest. This is a gain-of-function
      phenotype and does not show that SRP-2 participates in a developmental process.
    supporting_text: Transgenic animals engineered to overexpress SRP-2 were slow growing and/or
      arrested at the first, second, or third larval stages.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      This is the primary biochemical characterization of SRP-2 and the source of both IDA
      MF annotations. PMID, title and abstract were checked against the cached PubMed record.
      Only the abstract was available (the JBC full text returned 403), so the kinetic details
      were not checked by us.
  full_text_unavailable: true
- id: PMID:25786854
  title: The aggregation-prone intracellular serpin SRP-2 fails to transit the ER in
    Caenorhabditis elegans.
  findings:
  - statement: Wild-type SRP-2::GFP is cytosolic, not in the ER, and is not secreted. It has no
      predicted signal peptide.
    supporting_text: Using confocal imaging and an ER colocalization marker, we confirmed that
      GFP-tagged wild-type SRP-2 localized to the cytosol and not the ER.
  - statement: SRP-2 is not an ortholog of neuroserpin. Its closest human relative by
      similarity is SERPINB7 (clade B), and in a neighbor-joining tree it forms its own branch.
    supporting_text: We concluded that SRP-2 is neither an ortholog nor a functional homolog of
      neuroserpin.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text was available in the cache. This paper is the basis for removing the
      extracellular region rows and for the new cytosol annotation. It also refutes the earlier
      claim that SRP-2 is a neuroserpin homolog that aggregates in the ER lumen (PMID:23335331).
- id: PMID:23335331
  title: A novel interaction between aging and ER overload in a protein conformational dementia.
  findings: []
  reference_review:
    relevance: LOW
    correctness: DISPUTED
    review_notes: >-
      Schipanski et al. used SRP-2 H302R::YFP as a "neuroserpin homolog" model of FENIB and
      proposed that it aggregates within the ER lumen. Silverman et al. 2015 (PMID:25786854)
      showed that SRP-2 is cytosolic and that the H302R aggregates are cytosolic, so this paper
      is not used to support any localization or function. Abstract only.
- id: PMID:21683259
  title: Using C. elegans to identify the protease targets of serpins in vivo.
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      This methods review from the Silverman/Pak group summarizes SRP-2 as an intracellular
      inhibitor of granzyme B and lysosomal cysteine peptidases, and warns that its similarity to
      SERPINI1 does not make it a functional homolog. It corroborates the other sources but adds
      no new primary data on SRP-2.
core_functions:
- description: >-
    Cross-class serpin inhibitor of endopeptidases. Recombinant SRP-2 inhibits the serine
    peptidase granzyme B and the papain-like cysteine cathepsins K, L, S and V, which is
    consistent with the serpin suicide-substrate mechanism (intact consensus proximal hinge in
    the reactive-centre loop). The serine-type activity is backed by both the IDA and the PAINT
    node PTN002479231. The cysteine-type activity is established experimentally for SRP-2 only.
    The physiological peptidase target in C. elegans is unknown.
