    label: serine-type endopeptidase inhibitor activity
  evidence_type: IDA
  original_reference_id: PMID:14739286
  qualifier: enables
  review:
    summary: >-
      Recombinant SRP-2 inhibits the serine peptidase granzyme B in vitro, part of its
      cross-class inhibitory profile.
    action: ACCEPT
    reason: >-
      Direct biochemical evidence on the C. elegans protein (PMID:14739286). The assayed
      enzyme is mammalian granzyme B, so the activity is established in vitro and the
      endogenous serine-peptidase target is unknown, but the term describes the protein's
      molecular activity and is supported. The P1-P1' reactive-centre composition and
      intact proximal hinge (PMID:25786854) are consistent with an inhibitory serpin.
      This term is also the PAINT IBD placed at the clade-L node PTN002479231, seeded by
      srp-2 itself.
    supported_by:
    - reference_id: PMID:14739286
      supporting_text: >-
        Biochemical analysis of recombinant SRP-2 protein revealed SRP-2 to be a dual
        cross-class inhibitor of the apoptosis-related serine proteinase, granzyme B, and
        the lysosomal cysteine proteinases, cathepsins K, L, S, and V.
    - reference_id: PMID:25786854
      supporting_text: >-
        In contrast, SRP-2 inhibits granzyme B-like serine proteinases (they prefer
        cleavage after acidic residues)
