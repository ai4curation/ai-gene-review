suggested_questions:
- question: >-
    Should the PAINT tree carry an IRD NOT extracellular region (GO:0005576) at the
    nematode clade-L node (PTN002479231), given direct evidence that SRP-2 is cytosolic
    and non-secreted, mirroring the existing negation at the vertebrate intracellular
    node PTN002606963?
- question: >-
    Which endogenous C. elegans peptidases does SRP-2 target in vivo, and is the
    cysteine-peptidase activity physiologically dominant over the serine-peptidase
    activity?
knowledge_gaps:
- gap_statement: >-
    The physiological target peptidases and the in vivo biological role of SRP-2 are
    unknown; only overexpression phenotypes (slow growth, larval arrest) and in vitro
    inhibition of mammalian enzymes have been reported.
  gap_kind:
  - BIOLOGY
suggested_experiments:
- description: >-
    Generate an srp-2 null allele and test for lysosomal or cytoplasmic proteolysis
    phenotypes under stress, and identify SRP-2:peptidase covalent complexes from worm
    lysates by immunoprecipitation and mass spectrometry to define endogenous targets.
