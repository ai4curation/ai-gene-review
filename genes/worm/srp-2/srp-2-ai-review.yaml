- term:
    id: GO:0005829
    label: cytosol
  evidence_type: IDA
  original_reference_id: PMID:25786854
  review:
    summary: >-
      GFP-tagged wild-type SRP-2 is diffusely cytosolic in intestinal cells and does not
      colocalize with an ER marker; it is not secreted.
    action: NEW
    reason: >-
      Direct in vivo localization of the C. elegans protein, using an ER colocalization
      marker and comparison with secreted alpha1-antitrypsin controls (PMID:25786854).
      GOA currently carries only the incorrect extracellular-region location. Expression
      from both the intestinal nhx-2 promoter and the endogenous srp-2 promoter gave an
      intracellular, non-secreted distribution.
    supported_by:
    - reference_id: PMID:25786854
      supporting_text: >-
        Using confocal imaging and an ER colocalization marker, we confirmed that
        GFP-tagged wild-type SRP-2 localized to the cytosol and not the ER.
    - reference_id: PMID:25786854
