  review:
    summary: >-
      This IBA comes from the family-root node PTN000156123, which is seeded by secreted serpins
      (clade A, C and other plasma serpins). SRP-2 belongs to the nematode intracellular serpin
      clade, has no signal peptide, is cytosolic in vivo, and is not secreted by either a
      conventional or an unconventional route.
    action: REMOVE
    reason: >-
      Extracellular localization is the ancestral state of the serpin superfamily, but it was lost
      in the intracellular serpin lineages. PAINT already records this loss for the vertebrate
      clade B node PTN002606963 with a NOT (IRD) for GO:0005576, and the nematode clade L serpins
      need an equivalent exception. There is direct evidence of loss on this target. Three
      signal-peptide predictors (SignalP 4.1, Phobius, PrediSi) found no cleavable signal peptide.
      SRP-2::GFP driven by the endogenous promoter in hypodermis and seam cells stayed in the
      cytoplasm and was not trapped in the cuticle, whereas secreted controls were. SRP-2 forced
      into the ER by a synthetic signal peptide was retained there and not secreted. "Is active in
      extracellular region" is therefore contradicted for SRP-2, not merely over-annotated. The
      IBA should be blocked at the nematode intracellular serpin node (see suggested_questions).
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - COMPARTMENT_OR_COMPLEX_MISMATCH
      - LINEAGE_OR_TAXON_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN000156123
