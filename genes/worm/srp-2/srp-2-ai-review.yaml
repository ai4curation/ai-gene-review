          those members but was lost in the intracellular serpin lineages. PAINT blocks it for
          vertebrate clade B (PTN002606963, NOT) but not for the nematode clade L node that
          contains SRP-2.
    supported_by:
    - reference_id: PMID:25786854
      supporting_text: SRP-2 , like the clade B/intracellular serpins, has no N-terminal
        extension, and analysis of its N terminus by Signal P 4.1, Phobius, and PrediSi failed
        to detect a cleavable signal peptide
    - reference_id: PMID:25786854
      supporting_text: Wild-type SRP-2 was not secreted via a conventional or an unconventional
        pathway
    - reference_id: PMID:25786854
      supporting_text: SRP-2 appears to be an obligate intracellular serpin that resides in the
        cytosol
- term:
    id: GO:0005576
    label: extracellular region
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: located_in
  supporting_entities:
  - InterPro:IPR000215
  review:
    summary: >-
      InterPro2GO maps the serpin family signature (IPR000215) to extracellular region. This
      mapping holds for secreted serpins but not for the intracellular clades that SRP-2 belongs
      to.
    action: REMOVE
    reason: >-
      The family-wide mapping does not take into account the intracellular serpin lineages, which
      have lost the signal peptide. For SRP-2 there is direct experimental evidence of cytosolic
      localization and of no secretion (Silverman et al. 2015). The same evidence applies as for
      the IBA row for this term, and both rows are removed for the same reason.
    supported_by:
    - reference_id: PMID:25786854
      supporting_text: As expected, SRP-2::GFP ( i.e. , the wild-type protein) also showed a
        diffuse cytoplasmic distribution, which did not colocalize with sDsRed::KDEL
    - reference_id: PMID:25786854
      supporting_text: Wild-type SRP-2 was not secreted via a conventional or an unconventional
        pathway
- term:
    id: GO:0005829
    label: cytosol
  evidence_type: IDA
  original_reference_id: PMID:25786854
  qualifier: located_in
  review:
    summary: >-
      GFP-tagged wild-type SRP-2, expressed in the C. elegans intestine and from its own promoter
      in hypodermis and seam cells, shows a diffuse cytoplasmic distribution. It does not
      colocalize with the ER marker sDsRed::KDEL and is not secreted.
    action: NEW
    reason: >-
      SRP-2 has no localization annotation apart from the incorrect extracellular region rows.
      Confocal imaging of transgenic worms with an ER co-marker shows that wild-type SRP-2 is
      cytosolic, and the authors call it an obligate intracellular serpin. This matches the lack
      of a signal peptide. The evidence comes from overexpressed GFP fusions, not from endogenous
      tagging, but the result agrees with the sequence features and with what is known of the
      other C. elegans serpins. The cytosol is also where SRP-2 would have to act if it inhibits
      cysteine cathepsins released from damaged lysosomes, as SRP-6 does.
    supported_by:
    - reference_id: PMID:25786854
      supporting_text: Using confocal imaging and an ER colocalization marker, we confirmed that
        GFP-tagged wild-type SRP-2 localized to the cytosol and not the ER.
    - reference_id: PMID:25786854
      supporting_text: SRP-2 is a cytosolic serpin that inhibits lysosomal cysteine peptidases.
