id: O17365
gene_symbol: srp-2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: >-
  srp-2 (C05E4.1) encodes SRP-2, a 359-residue intracellular serpin of the nematode-specific
  clade L, one of nine serpin genes tandemly arrayed on C. elegans chromosome V. Like vertebrate
  clade B (ov-serpin) proteins, SRP-2 has no N-terminal signal peptide and no N- or C-terminal
  extension. GFP-tagged SRP-2 is diffusely cytosolic and is not secreted. When it is artificially
  given a signal peptide, it is retained in the ER lumen rather than secreted. Recombinant SRP-2 is a
  cross-class inhibitor: it inhibits the serine peptidase granzyme B and the papain-like lysosomal
  cysteine cathepsins K, L, S and V. Its reactive-centre loop keeps the consensus proximal hinge of
  inhibitory serpins (EDGTTAAAA, P17-P9). SRP-2 is present in early embryos and is highly expressed
  in the intestine, hypodermis and seam cells of larvae and adults. Overexpression slows growth and
  causes arrest at the L1 to L3 larval stages, which suggests that the serpin-peptidase balance
  matters for postembryonic development. The physiological target peptidase in the worm is not
  known. The FENIB-like H302R variant aggregates in the cytosol and is used as a model of cytosolic
  serpin aggregation.
existing_annotations:
- term:
    id: GO:0004867
    label: serine-type endopeptidase inhibitor activity
  evidence_type: IDA
  original_reference_id: PMID:14739286
  qualifier: enables
  review:
    summary: >-
      Recombinant SRP-2 inhibited the serine peptidase granzyme B in vitro. Pak et al. (2004)
      describe it as a dual cross-class inhibitor of granzyme B and of cathepsins K, L, S and V.
      SRP-2 also keeps the consensus inhibitory hinge in its reactive-centre loop (Silverman et al.
      2015).
    action: ACCEPT
    reason: >-
      This is direct biochemical evidence in this species, on this protein, for serpin-type
      inhibition of a serine endopeptidase, and it is the core molecular activity of SRP-2. The
      cached copy of the paper is the abstract only, so we could not check the kinetic constants
      and the SDS-stable complex data, but the WormBase curator read the full text, and a later
      paper from the same group independently restates the inhibitory activity. Granzyme B is a
      mammalian enzyme, so this establishes the activity but not the physiological target in the
      worm. PAINT seeded the GO:0004867 IBD at the nematode node PTN002479231 from this single
      annotation (WB:WBGene00005643), so this IDA is the experimental anchor for propagation of
      serine-type inhibitor activity across the Caenorhabditis srp lineages.
    supported_by:
    - reference_id: PMID:14739286
      supporting_text: Biochemical analysis of recombinant SRP-2 protein revealed SRP-2 to be a
        dual cross-class inhibitor of the apoptosis-related serine proteinase, granzyme B, and
        the lysosomal cysteine proteinases, cathepsins K, L, S, and V.
    - reference_id: PMID:25786854
      supporting_text: Since both serpins are bona fide protease inhibitors, we expected that the
        corresponding residues for NS/SERPINI1 and SRP-2 conformed to this consensus (EEGSEAAAV
        and EDGTTAAAA, respectively).
