- id: PMID:14739286
  title: 'SRP-2 is a cross-class inhibitor that participates in postembryonic development
    of the nematode Caenorhabditis elegans: initial characterization of the clade
    L serpins.'
  findings:
  - statement: >-
      Recombinant SRP-2 is a cross-class inhibitor of granzyme B and cathepsins K, L, S
      and V.
    supporting_text: >-
      Biochemical analysis of recombinant SRP-2 protein revealed SRP-2 to be a dual
      cross-class inhibitor of the apoptosis-related serine proteinase, granzyme B, and
      the lysosomal cysteine proteinases, cathepsins K, L, S, and V.
  - statement: >-
      SRP-2 is expressed in early embryos and highly in intestine and hypodermis of
      larvae and adults; overexpression causes slow growth and larval arrest.
    supporting_text: >-
      Analysis of temporal and spatial expression indicated that SRP-2 was present
      during early embryonic development and highly expressed in the intestine and
      hypoderm of larval and adult worms.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Primary characterization of SRP-2; source of both IDA MF annotations (GOA evidence
      code and reference agree). Only the abstract is cached, so kinetic data were not
      checked. The title's "participates in postembryonic development" rests on an
      overexpression phenotype and is not used to support a process annotation.
- id: PMID:25786854
  title: The aggregation-prone intracellular serpin SRP-2 fails to transit the ER in
    Caenorhabditis elegans.
  findings:
  - statement: >-
      Wild-type SRP-2::GFP is cytosolic, excluded from the ER, and not secreted; it is
      an obligate intracellular serpin with no cleavable signal peptide.
    supporting_text: >-
      Using confocal imaging and an ER colocalization marker, we confirmed that
      GFP-tagged wild-type SRP-2 localized to the cytosol and not the ER.
  - statement: >-
      SRP-2 is not an ortholog of neuroserpin and its RCL P2 residue favours lysosomal
      cysteine peptidases.
    supporting_text: >-
      We concluded that SRP-2 is neither an ortholog nor a functional homolog of
      neuroserpin.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text cached (PMC4423363). Direct localization evidence on the C. elegans
      protein; basis for the NEW cytosol annotation and for removing the
      extracellular-region rows.
