  review:
    summary: >-
      Root-level PAINT IBD for the whole serpin family, seeded by secreted vertebrate,
      fly and plant serpins. SRP-2 has been shown directly to be cytosolic and not
      secreted.
    action: REMOVE
    reason: >-
      The IBD at PTN000156123 is sound for the many secreted serpins that seed it, but
      SRP-2 belongs to the nematode clade-L intracellular serpins, which lack a signal
      peptide. Target-specific experiments show that wild-type SRP-2::GFP is diffusely
      cytoplasmic, excluded from the ER, and not detected in the cuticle or the
      perivitelline space under its own promoter; when forced into the ER with a
      synthetic signal peptide it is retained rather than secreted (PMID:25786854). This
      is direct evidence that the inherited location does not apply to this branch. The
      PAINT tree already carries an IRD NOT extracellular region at a vertebrate
      intracellular-serpin node (PTN002606963), but no corresponding negation was placed
      on the nematode clade-L branch; the srp-2 result supports one. Replace with cytosol
      (proposed as NEW below).
    supported_by:
    - reference_id: PMID:25786854
      supporting_text: >-
        Using confocal imaging and an ER colocalization marker, we confirmed that
        GFP-tagged wild-type SRP-2 localized to the cytosol and not the ER.
    - reference_id: PMID:25786854
      supporting_text: >-
        Taken together these imaging studies suggested that SRP-2 was not secreted and
        behaved as an obligate intracellular serpin.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - COMPARTMENT_OR_COMPLEX_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN000156123
        source_label: PTN000156123
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          Serpin-family root node whose extracellular assertion reflects signal-peptide
          bearing secreted serpins; the nematode clade-L intracellular serpins descend
          from it without inheriting secretion, and SRP-2 is experimentally cytosolic.
