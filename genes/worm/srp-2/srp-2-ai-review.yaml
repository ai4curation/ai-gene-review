gene_symbol: srp-2
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: >-
  srp-2 (C05E4.1) encodes a 359-residue intracellular serpin of the nematode-specific
  clade L, one of nine tandemly arrayed serpin genes on C. elegans chromosome V. Like
  vertebrate clade B serpins it lacks an N-terminal signal peptide and N- and C-terminal
  extensions. Recombinant SRP-2 is a cross-class inhibitor: it inhibits the serine
  peptidase granzyme B and the papain-like lysosomal cysteine peptidases cathepsins K, L,
  S and V, consistent with the suicide-substrate serpin mechanism. GFP-tagged SRP-2 is
  diffusely cytosolic, is excluded from the ER, and is not secreted into the cuticle or
  perivitelline space; forced ER targeting leads to ER retention rather than secretion.
  It is expressed in early embryos and strongly in the intestine and hypodermis
  (including seam cells) of larvae and adults. Its endogenous target peptidases and in
  vivo physiological role are not known; overexpression slows growth and causes early
  larval arrest.
