- term:
    id: GO:0004869
    label: cysteine-type endopeptidase inhibitor activity
  evidence_type: IDA
  original_reference_id: PMID:14739286
  qualifier: enables
  review:
    summary: >-
      Recombinant SRP-2 inhibited the papain-like lysosomal cysteine peptidases cathepsins K, L,
      S and V. A later study from the same group calls SRP-2 a cytosolic serpin that inhibits
      lysosomal cysteine peptidases.
    action: ACCEPT
    reason: >-
      This is direct biochemical evidence for cross-class (serpin-mediated) inhibition of
      cysteine endopeptidases, and Silverman et al. (2015) restate it as the defining activity of
      SRP-2. It is a core activity. For later transfer to relatives, note that PAINT placed an
      IBD at PTN002479231 for serine-type inhibitor activity only (GO:0004867) and did not
      propagate GO:0004869. Cross-class inhibition of cysteine peptidases depends on the
      reactive-centre loop sequence. It should therefore be treated as experimentally established
      for SRP-2 itself and not inferred for its paralogs or for C28G1.2.
    supported_by:
    - reference_id: PMID:14739286
      supporting_text: the lysosomal cysteine proteinases, cathepsins K, L, S, and V
    - reference_id: PMID:25786854
      supporting_text: SRP-2 is a cytosolic serpin that inhibits lysosomal cysteine peptidases.
