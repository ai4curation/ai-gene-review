suggested_questions:
- question: >-
    The family-root IBD for GO:0005576 extracellular region (PTN000156123) propagates to SRP-2
    and the other C. elegans clade L serpins, although SRP-2 is experimentally cytosolic and not
    secreted. Should PAINT add a NOT (IRD) for GO:0005576 at the nematode intracellular serpin
    node (PTN002479231 or the Caenorhabditis node PTN002479232), as it already has for the
    vertebrate clade B node PTN002606963?
- question: >-
    Which endogenous C. elegans peptidase does SRP-2 inhibit in vivo? Candidates are the lysosomal
    cysteine cathepsins (for example CPL-1), by analogy with the SRP-6 lysoptosis pathway.
- question: >-
    Does SRP-2, like SRP-6, protect cells from lysosomal-injury-induced necrosis (lysoptosis)? Or
    is its cysteine cathepsin inhibition an in vitro property only?
suggested_experiments:
- description: >-
    Make a CRISPR null allele of srp-2 and an endogenous fluorescent knock-in. Test the null for
    sensitivity to hypo-osmotic or lysosomal stress (as was done for srp-6), and use the knock-in
    to confirm cytosolic localization at endogenous levels.
  hypothesis: SRP-2 is a cytosolic inhibitor of lysosome-derived cysteine peptidases that protects
    intestinal and hypodermal cells from lysosomal injury.
- description: >-
    Trap SRP-2 with endogenous peptidases by affinity purification of SDS-stable serpin-peptidase
    complexes from worm lysates, followed by mass spectrometry.
  hypothesis: SRP-2 forms covalent complexes with one or more C. elegans papain-like cathepsins
    in vivo.
