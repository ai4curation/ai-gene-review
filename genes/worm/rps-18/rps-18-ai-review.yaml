taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: rps-18 (Y57G11C.16) encodes the Caenorhabditis elegans small ribosomal subunit protein uS13 (40S
  ribosomal protein S18), the single worm member of the universal uS13 family. uS13 is a core protein of the
  cytosolic 40S subunit, located in the head of the subunit, and is resolved full length in the cryo-EM structure of
  the C. elegans 80S ribosome, where it makes extensive contacts with 18S rRNA through its N-terminal
  helix-two-turn-helix region and basic C-terminal region, and its C-terminal tail approaches the bound tRNA. As a
  structural constituent of the ribosome it contributes to cytoplasmic mRNA translation in the cytosol. RNAi depletion
  causes penetrant sterility, consistent with loss of general translation capacity.
