suggested_questions:
- question: Does the C-terminal tail of C. elegans uS13, which approaches the tRNA in the 80S structure, contact P-site
    tRNA and contribute to tRNA positioning or translocation as proposed for uS13 in other eukaryotes?
- question: Is RPS-18 required in all tissues equally, or does its depletion preferentially affect the germline, as
    the penetrant RNAi sterility might suggest?
suggested_experiments:
- description: Generate a CRISPR C-terminal truncation of rps-18 that removes the tRNA-contacting tail (residues
    ~140-154) and assay viability, polysome profiles and translational fidelity reporters.
