- id: PMID:39209556
  title: High-resolution reconstruction of a C. elegans ribosome sheds light on evolutionary dynamics and tissue
    specificity.
  findings:
  - statement: Cryo-EM structure of the C. elegans 80S ribosome from sucrose-gradient purified ribosomes; all
      ribosomal proteins except stalk proteins, eL28 and RACK-1 were modelled, so uS13 (chain AS of 9CAI) is part of
      the modelled 40S subunit.
    supporting_text: We also modeled the ribosomal proteins, with the exceptions of those bound to the P- and L-stalks
      (uL10/P0, P1, P2, uL1, uL11), eL28, and RACK-1
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Sehgal et al. 2024, RNA. Source of PDB 9BH5/9CAI listed in O18240 (chain AS, residues 1-154); uS13
      is not among the unmodelled proteins. The paper does not discuss uS13 specifically.
- id: PMID:16247027
  title: A complex containing the Sm protein CAR-1 and the RNA helicase CGH-1 is required for embryonic cytokinesis
    in Caenorhabditis elegans.
  findings:
  - statement: RNAi of RPS-18 (with five other RPS proteins), used as a translation-inhibition control, caused
      penetrant sterility; partial depletion gave osmotically sensitive embryos without cytokinesis defects.
    supporting_text: Depletions of six different ribosomal subunits (RPS-1, -3, -5, -11, -18, and -23) each resulted
      in penetrant sterility (unpublished data).
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Full text read. Paper is about CAR-1/CGH-1; RPS-18 data are an unpublished-data control showing
      necessity phenotypes consistent with general translation loss. Does not justify any process annotation.
- id: PMID:11279123
  title: The small subunit of the mammalian mitochondrial ribosome. Identification of the full complement of ribosomal
    proteins present.
  findings:
  - statement: Mitochondrial ribosomes have no homolog of bacterial S13, so eukaryotic uS13 proteins are cytosolic
      ribosomal proteins. The "S18" proteins discussed in this paper are the unrelated bS18 family, not RPS-18.
    supporting_text: No mitochondrial homologs to prokaryotic ribosomal proteins S1, S3, S4, S8, S13, S19, and S20
      could be found
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Abstract read. Background only, used to argue that the single worm uS13 is cytosolic; not about
      C. elegans RPS-18 itself.
