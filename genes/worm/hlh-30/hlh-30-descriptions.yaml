- source: Alliance_Imported
  text: hlh-30 encodes a predicted basic helix-loop-helix (bHLH) transcription factor,
    one of 42 such genes in the C. elegans genome, it is spliced to give 18 different
    transcripts; it is orthologous to human microphthalmia-associated transcription
    factor (HGNC:MITF); loss of hlh-30 activity via RNAi results in reduced fat storage;
    HLH-30 demonstrates sequence-specific DNA binding for the E box sequence CACGTG
    and likely binds DNA as a homodimer; expression profiles of hlh-30 mutants indicate
    that, like its human ortholog, HLH-30 regulates expression of genes involved in
    metabolism; at least one of the bHLH protein isoforms appears to be important
    for an infection-specific immune response to M. nematophilum, though the overall
    induction of this gene following infection was not appreciable (1.3-fold).
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00020930;class=Gene
  source_id: WB:WBGene00020930
  review:
    reviewer: AI
