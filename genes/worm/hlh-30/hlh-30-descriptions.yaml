descriptions:
- source: UniProt
  text: Transcription factor which regulates the expression of genes involved in lipid
    metabolism and autophagy in response to nutrient availability, bacterial pore-forming
    toxins or heat shock (PubMed:23604316, PubMed:23925298, PubMed:27001890, PubMed:27875098,
    PubMed:28198373). Binds to the E-box motif 5'-CACGTG-3' (PubMed:19632181). Under
    fasting conditions, binds to the promoter and activates the expression of lipase
    genes lipl-2, lipl-3 and lipl-5, and to a lesser extent, lipl-1, thereby regulating
    lipolysis (PubMed:23604316). Involved in modulating longevity in response to TOR
    signaling, dietary restriction, germline signaling, heat shock and the insulin-like
    signaling pathway (PubMed:23925298, PubMed:24882217, PubMed:27001890, PubMed:28198373).
    Involved in the immune response to infection by the S.aureus bacterium, probably
    acting downstream of the protein kinase dkf-1, leading to the transcriptional
    activation of host defense genes (PubMed:24882217, PubMed:27184844). May also
    play a role in lysosomal biogenesis in response to nutrient availability (PubMed:23604316).
  source_type: curated
  url: https://www.uniprot.org/uniprot/H2KZZ2
