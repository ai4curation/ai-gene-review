    - rubric: completeness
      score: 2
    - rubric: specificity
      score: 2
    overall_notes: Dated. Calls it a predicted bHLH and MITF ortholog, gives the fat
      storage and E-box data, but misses TFEB-like control of autophagy, lysosomes
      and lifespan; transcript count trivia.
- source: Alliance_Automated
  text: Predicted to enable DNA-binding transcription factor activity, RNA polymerase
    II-specific and RNA polymerase II cis-regulatory region sequence-specific DNA
    binding activity. Involved in several processes, including defense response to
    bacterium; determination of adult lifespan; and regulation of gene expression.
    Acts upstream of or within positive regulation of plasma membrane repair and positive
    regulation of xenophagy. Located in cytoplasm. Colocalizes with nucleus. Is expressed
    in several structures, including anal depressor muscle; nervous system; rectal
    valve cell; reproductive system; and somatic cell. Human ortholog(s) of this gene
    implicated in several diseases, including Tietz syndrome; Tietze's syndrome; Waardenburg
    syndrome (multiple); familial melanoma; and renal cell carcinoma. Orthologous
    to several human genes including MITF (melanocyte inducing transcription factor);
    TFEB (transcription factor EB); and TFEC (transcription factor EC).
