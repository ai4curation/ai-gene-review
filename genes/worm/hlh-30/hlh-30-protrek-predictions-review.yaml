    summary: >-
      Top-ranked hit (score 17.42) and obsolete in the current GO release. The composite claim decomposes
      into two IMP-supported GOA terms for this gene, defense response to Gram-negative bacterium
      and positive regulation of transcription by RNA polymerase II, and HLH-30 is known to drive
      roughly 80 percent of host defence gene expression on infection. Correct and already annotated
      in its component parts; the identifier itself is not enterable.
