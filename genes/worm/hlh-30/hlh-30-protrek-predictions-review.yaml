  predicted_term:
    id: GO:0045614
    label: negative regulation of plasmatocyte differentiation
  predicted_term_type: GO_BP
  review:
    assessment: NPI
    confidence_score: 0
    error_type: TAXON_CONSTRAINT_VIOLATION
    summary: >-
      Rank 3 (score 14.95). Plasmatocytes are Drosophila hemocytes; C. elegans has no hemocytes and
      no such differentiation programme. The call presumably follows the innate-immunity thread from
      rank 1 into an insect-specific cell type. Rank 4 (positive regulation of transcription from
      a mobile element promoter) and rank 5 continue the drift.
    supported_by:
