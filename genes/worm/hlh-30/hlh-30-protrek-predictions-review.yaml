  label: Caenorhabditis elegans
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for worm hlh-30, the TFEB ortholog and master transcriptional
  regulator of autophagy and lysosomal biogenesis. Not one autophagy or lysosome term appears in the
  top five, despite GOA holding positive regulation of macroautophagy, regulation of autophagy and
  positive regulation of xenophagy, all with IMP support, and despite the review naming autophagy
  and lysosome organization as the first two core functions. Rank 1 is correct - an innate-immunity
  transcription composite matching two IMP-supported GOA terms - and is also the same obsolete identifier
  ProTrek returns for atfs-1 at rank 4; here the sharing is legitimate rather than an artefact, since
  both genes really are worm transcription factors driving Gram-negative defence. Below rank 1 there
  is a 2.1-unit drop and the remaining four calls are unrelated, one of them a Drosophila hemocyte
  term. The Function channel returns HLH-30's own comment at 19.06, naming lipid metabolism and autophagy
  explicitly - the GO channel loses what the free-text channel holds. Assessment: 1 correct-not-novel,
  2 nonparalog incorrect. Assessment: 1 correct not novel (CNN), 2 nonparalog incorrect (NPI).
