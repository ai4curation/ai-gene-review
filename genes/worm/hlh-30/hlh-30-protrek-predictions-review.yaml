  predicted_term:
    id: GO:0140467
    label: integrated stress response signaling
  predicted_term_type: GO_BP
  review:
    assessment: NPI
    confidence_score: 0
    summary: >-
      Rank 2 (score 15.29), 2.1 units below rank 1 and absent from GOA. Integrated stress response
      signaling is the specific eIF2-alpha-phosphorylation/ATF4 axis; HLH-30/TFEB is a stress-responsive
      transcription factor but is not a component of that pathway, and conflating 'responds to stress'
      with a named stress-signalling pathway is exactly the kind of near-miss that costs a curator
      time to refute.
    supported_by:
