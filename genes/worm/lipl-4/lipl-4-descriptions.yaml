descriptions:
- source: UniProt
  text: Lysosomal lipase that regulates the metabolism of long-chain fatty acids,
    primarily in response to nutrient availability (PubMed:21906946, PubMed:23392608,
    PubMed:25554789, PubMed:30713071). The production of these lipid signaling mediators
    regulates various processes, including lipolysis, autophagy, mitochondrial beta-
    oxidation, which in turn control lifespan and adaptation to starvation (PubMed:21906946,
    PubMed:23392608, PubMed:25554789, PubMed:30713071). In response to fasting, promotes
    the production of omega-6 polyunsaturated fatty acids (PUFAs), which in turn activates
    autophagy resulting in lifespan extension (PubMed:23392608). Produces oleoylethanolamide
    (OEA), a ligand for the lysosomal lipid chaperone lbp-8 which translocates into
    the nucleus where it activates the transcription of genes promoting longevity
    and activation of mitochondrial beta oxidation (PubMed:25554789, PubMed:30713071).
  source_type: curated
