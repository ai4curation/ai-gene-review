gene_symbol: lipl-4
organism: worm
uniprot_id: Q94252
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Lysosomal lipase that regulates the metabolism of long-chain fatty acids,
    primarily in response to nutrient availability (PubMed:21906946, PubMed:23392608,
    PubMed:25554789, PubMed:30713071). The production of these lipid signaling mediators
    regulates various processes, including lipolysis, autophagy, mitochondrial beta-
    oxidation, which in turn control lifespan and adaptation to starvation (PubMed:21906946,
    PubMed:23392608, PubMed:25554789, PubMed:30713071). In response to fasting, promotes
    the production of omega-6 polyunsaturated fatty acids (PUFAs), which in turn activates
    autophagy resulting in lifespan extension (PubMed:23392608). Produces oleoylethanolamide
    (OEA), a ligand for the lysosomal lipid chaperone lbp-8 which translocates into
    the nucleus where it activates the transcription of genes promoting longevity
    and activation of mitochondrial beta oxidation (PubMed:25554789, PubMed:30713071).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q94252
  source_id: Q94252
- source: Alliance_Imported
  text: lipl-4 encodes a triglyceride lipase; by homology, LIPL-4 is predicted to
    function in lipid hydrolysis; genetic studies indicate that lipl-4 functions as
    part of an endocrine signaling pathway that coordinates reproductive status, fat
    metabolism, and longevity; in response to reduced insulin signaling or germline
    removal (glp-1 mutant animals), lipl-4 expression is induced in the intestine,
    in a DAF-16-dependent manner; overexpression of lipl-4 can extend lifespan, in
    a manner dependent upon autophagy genes, such as bec-1, vps-34, and lgg-1.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00019376;class=Gene
  source_id: WB:WBGene00019376
- source: Alliance_Automated
  text: Enables triacylglycerol lipase activity. Involved in several processes, including
    determination of adult lifespan; positive regulation of macroautophagy; and triglyceride
    catabolic process. Located in lysosomal lumen. Part of cytoplasm. Is expressed
    in intestine and seam cell. Orthologous to human LIPJ (lipase family member J)
    and LIPK (lipase family member K).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00019376;class=Gene
