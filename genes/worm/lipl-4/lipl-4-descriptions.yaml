- source: Alliance_Imported
  text: lipl-4 encodes a triglyceride lipase; by homology, LIPL-4 is predicted to
    function in lipid hydrolysis; genetic studies indicate that lipl-4 functions as
    part of an endocrine signaling pathway that coordinates reproductive status, fat
    metabolism, and longevity; in response to reduced insulin signaling or germline
    removal (glp-1 mutant animals), lipl-4 expression is induced in the intestine,
    in a DAF-16-dependent manner; overexpression of lipl-4 can extend lifespan, in
    a manner dependent upon autophagy genes, such as bec-1, vps-34, and lgg-1.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00019376;class=Gene
