descriptions:
- source: UniProt
  text: 'The pyruvate dehydrogenase complex catalyzes the overall conversion of pyruvate
    to acetyl-CoA and CO(2). It contains multiple copies of three enzymatic components:
    pyruvate dehydrogenase (E1), dihydrolipoamide acetyltransferase (E2) and lipoamide
    dehydrogenase (E3).'
  source_type: curated
  url: https://www.uniprot.org/uniprot/P52899
  source_id: P52899
- source: Alliance_Imported
  text: T05H10.6 encodes an ortholog of the human gene PYRUVATE DEHYDROGENASE (LIPOAMIDE)
    ALPHA 1 (PDHA1; OMIM:312170), which when mutated leads to Leigh syndrome (OMIM:256000).
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00011510;class=Gene
  source_id: WB:WBGene00011510
- source: Alliance_Automated
  text: Predicted to enable pyruvate dehydrogenase (acetyl-transferring) activity.
    Predicted to be involved in pyruvate decarboxylation to acetyl-CoA. Located in
    mitochondrion. Human ortholog(s) of this gene implicated in pyruvate decarboxylase
    deficiency and spermatogenic failure 70. Orthologous to human PDHA1 (pyruvate
    dehydrogenase E1 subunit alpha 1) and PDHA2 (pyruvate dehydrogenase E1 subunit
    alpha 2).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00011510;class=Gene
  source_id: WB:WBGene00011510
