id: P52899
gene_symbol: pdha-1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: >-
  pdha-1 (T05H10.6) encodes the sole Caenorhabditis elegans pyruvate dehydrogenase E1 alpha
  subunit, a nuclear-encoded mitochondrial matrix protein with an N-terminal transit peptide. With
  the E1 beta subunit it forms the alpha2beta2 E1 component of the pyruvate dehydrogenase complex
  (PDHc), which carries out the thiamine diphosphate- and Mg2+-dependent decarboxylation of pyruvate
  and the reductive acetylation of the E2 lipoyl arm. This is the committed step that converts
  pyruvate to acetyl-CoA and links glycolysis to the TCA cycle. The alpha subunit holds the conserved
  pyruvate, Mg2+ and shared ThDP binding residues. By analogy with mammals, it also carries the
  phosphorylation sites through which PDH kinase (PDHK-2) inactivates the complex and PDH
  phosphatase (PDP-1) reactivates it. The worm protein has not been characterised biochemically,
  but RNAi knockdown gives a coherent PDH-deficiency phenotype: raised alanine, lactate and pyruvate,
  greater glycolytic flux, mitochondrial stress (UPRmt) induction, sterility, and lethality over
  generations. Because these phenotypes mirror human PDHA1 deficiency, pdha-1(RNAi) worms are used to
  model it.
