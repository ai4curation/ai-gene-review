core_functions:
- description: >-
    E1 alpha subunit of the mitochondrial pyruvate dehydrogenase complex. With the E1 beta subunit
    (PDHB-1) it forms the alpha2beta2 E1 component, which catalyses the ThDP- and Mg2+-dependent
    decarboxylation of pyruvate and the reductive acetylation of the E2 lipoyl arm. This is the
    committed step that converts pyruvate to acetyl-CoA.
  contributes_to_molecular_function:
    id: GO:0004739
    label: pyruvate dehydrogenase (acetyl-transferring) activity
  directly_involved_in:
  - id: GO:0006086
    label: pyruvate decarboxylation to acetyl-CoA
  locations:
  - id: GO:0005759
    label: mitochondrial matrix
  in_complex:
    id: GO:0045254
    label: pyruvate dehydrogenase complex
  supported_by:
  - reference_id: file:worm/pdha-1/pdha-1-uniprot.txt
    record_section: ["CC:FUNCTION"]
    supporting_text: >-
      The pyruvate dehydrogenase complex catalyzes the overall conversion of pyruvate to acetyl-CoA
      and CO(2).
  - reference_id: file:worm/pdha-1/pdha-1-uniprot.txt
    record_section: ["FT:BINDING"]
    supporting_text: ligand shared with beta subunit
  - reference_id: PMID:21533078
    supporting_text: >-
      T05H10.6 (E1α), C04C3.3 (E1β), F23B12.5 (E2), or LLC1.3 (E3)
suggested_questions:
- question: >-
    Should PDH E1 alpha subunits across PTHR11516 carry contributes_to rather than enables for
    GO:0004739, given that the ThDP active site is formed at the alpha/beta interface? Reviewed
    orthologs in this repository (human PDHA1, yeast PDA1) currently keep enables.
- question: >-
    Are the regulatory phosphorylation sites (mammalian Ser232/Ser293/Ser300 equivalents) conserved
    and used in C. elegans PDHA-1, and are PDHK-2 and PDP-1 its kinase and phosphatase in vivo?
- question: >-
    Is the reported fall in monomethyl branched-chain fatty acids after T05H10.6 RNAi (PMID:15340492,
    unpublished data) a direct effect, for example a shortage of acetyl-CoA for elongation, or does
    PDHA-1 have a role in branched-chain keto acid metabolism?
suggested_experiments:
- description: >-
    Phosphoproteomics of C. elegans mitochondria from wild type, pdhk-2 mutants and pdp-1 mutants,
    with PDH activity measured in each mitochondrial extract.
  hypothesis: >-
    PDHA-1 is reversibly phosphorylated at conserved serines that switch off PDH activity, with
    PDHK-2 as the kinase and PDP-1 as the phosphatase.
- description: >-
    Express recombinant PDHA-1 together with PDHB-1 and assay E1 pyruvate decarboxylation (the
    DCPIP-coupled assay), comparing the alpha subunit alone with the alpha2beta2 heterotetramer.
  hypothesis: >-
    E1 activity requires the alpha2beta2 assembly; the alpha subunit alone is inactive.
