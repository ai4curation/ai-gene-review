  review:
    summary: >-
      PAINT inference of E1 pyruvate dehydrogenase activity from the root PTHR11516 node; PDHA-1 is
      the only E1 alpha subunit in C. elegans and retains every ThDP, Mg2+ and pyruvate binding residue.
    action: ACCEPT
    reason: >-
      The activity term is correct and core. PDHA-1 is a canonical member of the PDH E1 alpha family
      (TIGR03182 PDH_E1_alph_y, PTHR11516:SF60) and keeps all the ligand-binding residues mapped from
      human PDHA1. The PAINT node PTN008519424 is seeded by experimentally characterised E1 alpha
      subunits from rat, yeast, plants and Aspergillus, and nothing suggests the worm lineage has lost
      the function. RNAi phenotypes in the worm (raised alanine and lactate, more glycolytic flux)
      are consistent with loss of PDH activity. The E1 reaction is performed by the alpha2beta2
      heterotetramer, with ThDP bound at the alpha/beta interface, so the precise relation of the alpha
      subunit is contributes_to. The core function records it that way, and the qualifier is noted as a
      source defect.
    supported_by:
