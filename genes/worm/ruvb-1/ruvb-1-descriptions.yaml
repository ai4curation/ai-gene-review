gene_symbol: ruvb-1
organism: worm
uniprot_id: O17607
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Possesses single-stranded DNA-stimulated ATPase and ATP dependent DNA helicase
    (3' to 5') activity suggesting a role in nuclear processes such as recombination
    and transcription (By similarity). May participate in several chromatin remodeling
    complexes that mediate the ATP-dependent exchange of histones and remodel chromatin
    by shifting nucleosomes (By similarity). Involvement in these complexes is likely
    required for transcriptional activation of selected genes and DNA repair in response
    to DNA damage (By similarity). Involved in the Ce- Tor signaling pathway whereby
    it is required for the accumulation and localization of box C/D snoRNP to nucleoli
    to regulate ribosomal maturation and thus protein synthesis (PubMed:18804378).
    Antagonizes the transcriptional activity of transcription factor pha-4, to control
    postembryonic development and adult longevity (PubMed:17720918, PubMed:18804378).
    Has a role in pharyngeal development (PubMed:17720918). Has a role in gonadal
    development (PubMed:25437307).
  source_type: curated
  url: https://www.uniprot.org/uniprot/O17607
  source_id: O17607
- source: Alliance_Imported
  text: ruvb-1 encodes a AAA+ ATPase orthologous to the RUVBL1 family of ATPases;
    ruvb-1 functions as a component of the TOR signaling pathway that promotes localization
    of the box C/D snoRNP complex to nucleoli, thus enabling robust protein synthesis;
    ruvb-1 mutations strongly suppress pha-4 mutations, suggesting that pha-4 and
    the CeTOR pathway antagonize one another to regulate larval development and adult
    lifespan; ruvb-1::gfp promoter fusions are expressed in most cells of the early
    embryo, but restricted to pharyngeal cells beginning at ~2-fold stage of embryogenesis.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00007784;class=Gene
  source_id: WB:WBGene00007784
- source: Alliance_Automated
  text: Predicted to enable ATP hydrolysis activity and DNA helicase activity. Involved
    in several processes, including TOR signaling; box C/D snoRNP assembly; and nematode
    larval development. Located in cytoplasm and nucleus. Is expressed in gonad and
    pharyngeal cell. Orthologous to human RUVBL1 (RuvB like AAA ATPase 1).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00007784;class=Gene
  source_id: WB:WBGene00007784
