gene_symbol: ruvb-1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: 'RUVB-1 (C27H6.2) is the Caenorhabditis elegans ortholog of RUVBL1/pontin, a RuvB-family
  AAA+ ATPase. With its paralog RUVB-2 it is expected to form hexameric rings and double-ring dodecamers
  that serve as the ATP-hydrolysing core of several conserved nuclear assemblies: INO80 and SWR1/SRCAP-type
  chromatin-remodeling and histone-exchange complexes, TIP60/NuA4, and the R2TP co-chaperone that assembles
  box C/D snoRNPs. In C. elegans, ruvb-1 was identified as a dominant suppressor of partial loss of the
  FoxA factor pha-4. Mutants arrest at the L3 larval stage, have small nucleoli and fail to accumulate
  the box C/D snoRNP protein fibrillarin (FIB-1) in nucleoli, which reduces protein synthesis; genetically
  ruvb-1 acts with the TOR pathway. The protein is found in both nucleus and cytoplasm, and its depletion
  also causes gonadal leader-cell detachment, phenocopying the LINKIN (lnkn-1) adhesion mutant.'
