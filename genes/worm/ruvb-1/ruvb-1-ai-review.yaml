  review:
    summary: IBA for DNA helicase activity from PTN000120244, seeded by yeast Rvb1/Rvb2, human RUVBL1/RUVBL2,
      rat Ruvbl1 and Plasmodium members.
    action: MARK_AS_OVER_ANNOTATED
    reason: Helicase activity of eukaryotic RUVBL proteins is weak and disputed. Purified human RuvBL1
      shows only marginal ATPase activity, and DNA unwinding was shown for a RuvBL1/RuvBL2 complex with
      truncated domain II, with domain II auto-inhibiting unwinding. The in vivo roles of RUVBL1/2 (scaffolding
      INO80, SWR1, R2TP and snoRNP assembly) do not require DNA unwinding. RUVB-1 is not a DNA helicase
      in any demonstrated sense, and at most contributes to an activity of the hetero-oligomer. ATP hydrolysis
      activity is the supported molecular function.
    supported_by:
    - &id004
      reference_id: PMID:17060327
      supporting_text: Although it has been shown that ATPase activity of RuvBL1 is needed for several
        in vivo functions, we could only detect a marginal activity with the purified protein.
    - &id003
      reference_id: PMID:21933716
      supporting_text: we present evidence that DNA unwinding of the human RuvBL proteins can be auto-inhibited
        by domain II, which is not present in the homologous bacterial helicase RuvB
    - reference_id: PMID:21933716
      supporting_text: show that this complex is competent for helicase activity
    propagation_review:
