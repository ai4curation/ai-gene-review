suggested_questions:
- question: Should EC 3.6.4.12 (DNA helicase) on O17607 and on other eukaryotic RUVBL1 entries be retained
    when full-length RUVBL1/RUVBL2 show only marginal, domain-II-inhibited unwinding, and the EC is borrowed
    from bacterial RuvB?
- question: Does RUVB-1 act in C. elegans R2TP-like assemblies with RUVB-2 and worm RPAP3/PIH1D1 homologs,
    and does it support TOR-family kinase (LET-363) complex assembly as RUVBL1/2 do in mammals?
- question: Which RUVB-1-containing complex accounts for gonadal leader-cell detachment and the lnkn-1
    phenocopy?
suggested_experiments:
- description: Purify recombinant RUVB-1, RUVB-2 and the RUVB-1/RUVB-2 complex (wild type, Walker B E->Q,
    and the px34 E371K variant); measure ATPase rates and DNA unwinding with and without domain II truncation.
  hypothesis: RUVB-1 is a weak ATPase stimulated in the heterocomplex, lacks robust helicase activity,
    and the E371K mutation impairs complex ATPase or assembly.
- description: Immunoprecipitate endogenously tagged RUVB-1 from larvae and identify partners by mass
    spectrometry, testing for INO80, SWR1/SRCAP, TIP60 and R2TP subunits and for box C/D snoRNP proteins
    (FIB-1, NOL-5).
  hypothesis: RUVB-1 is a shared core subunit of conserved chromatin-remodeling complexes and of a snoRNP
    assembly intermediate in C. elegans.
