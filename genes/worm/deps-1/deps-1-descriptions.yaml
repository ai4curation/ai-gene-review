descriptions:
- source: UniProt
  text: Component of P-granules which is required for P-granule formation and integrity
    in adult germ cells (PubMed:18234720). Promotes the accumulation of glh-1 mRNA
    and localization of pgl-1 to P-granules (PubMed:18234720). Involved in RNA-mediated
    gene silencing (RNAi) in the germline (PubMed:18234720, PubMed:32843637). In particular,
    it is required for piwi-interacting RNA (piRNA) gene silencing and positively
    regulates the formation of secondary 22G-RNAs, which are RNA-dependent RNA polymerase-derived
    endo-siRNAs, typically 22 nucleotides in length with a 5'guanosine residue (PubMed:32843637).
    Its role in RNAi may also be through positively regulating the expression of the
    dsRNA-binding protein rde-4 (PubMed:18234720). Plays a role in small RNA-directed
    transgenerational epigenetic inheritance (PubMed:27015309, PubMed:29769721).
  source_type: curated
