gene_symbol: deps-1
organism: worm
uniprot_id: Q9N303
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Component of P-granules which is required for P-granule formation and integrity
    in adult germ cells (PubMed:18234720). Promotes the accumulation of glh-1 mRNA
    and localization of pgl-1 to P-granules (PubMed:18234720). Involved in RNA-mediated
    gene silencing (RNAi) in the germline (PubMed:18234720, PubMed:32843637). In particular,
    it is required for piwi-interacting RNA (piRNA) gene silencing and positively
    regulates the formation of secondary 22G-RNAs, which are RNA-dependent RNA polymerase-derived
    endo-siRNAs, typically 22 nucleotides in length with a 5'guanosine residue (PubMed:32843637).
    Its role in RNAi may also be through positively regulating the expression of the
    dsRNA-binding protein rde-4 (PubMed:18234720). Plays a role in small RNA-directed
    transgenerational epigenetic inheritance (PubMed:27015309, PubMed:29769721).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q9N303
  source_id: Q9N303
- source: Alliance_Imported
  text: deps-1 encodes an large (619-residue), unfamiliar P-granule-associated protein
    required for germline RNAi, PGL-1's localization in P granules, accumulation of
    GLH-1 and RDE-4 (along with glh-1 mRNA), germline proliferation and fertility
    at high temperatures, and embryonic viability at low temperatures; unless rescued
    by maternal DEPS-1, deps-1 mutants show temperature-sensitive sterility at 24+
    deg. C., but remain fertile at 15-20 deg. C.; DEPS-1 upregulates 13 germline-expressed
    genes (including glh-1, rde-4, aco-2, cts-1, plk-3, and deps-1 itself), and downregulates
    32 such genes (including dyf-3, klp-10, pvf-1, rnh-1.3, and ugt-64); DEPS-1 has
    a C-terminal serine-rich domain, and has orthologs in other Caenorhabditis species,
    but has no non-nematode orthologs.
  source_type: curated
