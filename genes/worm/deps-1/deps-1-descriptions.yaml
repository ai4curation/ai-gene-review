- source: Alliance_Imported
  text: deps-1 encodes an large (619-residue), unfamiliar P-granule-associated protein
    required for germline RNAi, PGL-1's localization in P granules, accumulation of
    GLH-1 and RDE-4 (along with glh-1 mRNA), germline proliferation and fertility
    at high temperatures, and embryonic viability at low temperatures; unless rescued
    by maternal DEPS-1, deps-1 mutants show temperature-sensitive sterility at 24+
    deg. C., but remain fertile at 15-20 deg. C.; DEPS-1 upregulates 13 germline-expressed
    genes (including glh-1, rde-4, aco-2, cts-1, plk-3, and deps-1 itself), and downregulates
    32 such genes (including dyf-3, klp-10, pvf-1, rnh-1.3, and ugt-64); DEPS-1 has
    a C-terminal serine-rich domain, and has orthologs in other Caenorhabditis species,
    but has no non-nematode orthologs.
  source_type: curated
