- id: PMID:16184190
  title: Genetic interactions due to constitutive and inducible gene regulation mediated
    by the unfolded protein response in C. elegans.
  findings:
  - statement: >-
      cht-1 was the sole gene whose tunicamycin induction depended only on
      atf-6 in the inducible UPR expression array.
    supporting_text: >-
      the only gene that depends solely on atf-6 for its induction is cht-1,
      which encodes a chitinase orthologous to human chitotriosidase
    reference_section_type: RESULTS
  reference_review:
    relevance: LOW
    correctness: MISCITED
    review_notes: >-
      Full-text high-throughput expression study. The GOA HEP row indicates
      that cht-1 was an ATF-6-dependent tunicamycin-expression hit, but the
      paper does not show that CHT-1 itself executes ATF6-mediated unfolded
      protein response signaling.
- id: PMID:21731485
  title: Candida albicans infection of Caenorhabditis elegans induces antifungal immune
    defenses.
  findings:
  - statement: >-
      cht-1 transcript was strongly induced in young adult C. elegans exposed
      to C. albicans yeast.
    supporting_text: >-
      Two chitinase genes (cht-1 and T19H5.1) were also strongly induced by
      C. albicans.
    reference_section_type: RESULTS
  reference_review:
    relevance: MEDIUM
    correctness: MISCITED
    review_notes: >-
      Full-text pathogen-response transcriptomics study. It supports
      Candida-induced expression of cht-1, but does not perturb cht-1 or assay
      CHT-1 chitinase action against a fungus, so the response-to-fungus IEP
      row overstates the evidence.
- id: PMID:33691404
  title: Crystal Structure and Structure-Based Discovery of Inhibitors of the Nematode
    Chitinase CeCht1.
  findings:
  - statement: >-
      The authors solved the crystal structure of C. elegans CHT-1/CeCht1 as a
      representative nematode chitinase.
    supporting_text: >-
      Here, we report the first crystal structure of a representative nematode
      chitinase, that of CeCht1 from the model nematode Caenorhabditis
      elegans, to a 1.7 Å resolution.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Abstract-only structural and inhibitor-discovery paper for C. elegans
      CHT-1/CeCht1. The cached abstract confirms that the paper solved the
      representative nematode chitinase structure and identified active-site
      inhibitors. The full text likely contains the direct assay behind the
      WormBase IDA rows, but the abstract plus UniProt's linked PDB xrefs, EC
      assignment and PTHR11177 PAINT support are already enough to retain
      CHT-1 as an active chitinase.
