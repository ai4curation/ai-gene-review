taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: >-
  C. elegans CHT-1 is a glycosyl hydrolase family 18 endochitinase with a GH18
  catalytic domain and two C-terminal type-2 chitin-binding modules. It belongs
  to the same reviewed PANTHER endochitinase-related subfamily as the Brugia
  malayi MF1 secreted microfilarial chitinase. CHT-1 is predicted to act as an
  extracellular endochitinase, hydrolyzing beta-1,4-linked N-acetylglucosamine
  polymers in chitin-containing substrates; its transcript is induced by
  Candida albicans exposure and tunicamycin-induced ER stress, but those
  expression responses have not been tied to a direct antifungal or UPR
  execution role for the enzyme.
