core_functions:
- description: >-
    Endochitinase that catalyzes random endo-hydrolysis of
    N-acetyl-beta-D-glucosaminide beta-1,4 linkages in chitin and
    chitodextrins through its GH18 catalytic domain, with two type-2
    chitin-binding modules that likely help target chitin-containing substrates.
  molecular_function:
    id: GO:0008843
