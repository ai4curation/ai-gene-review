gene_symbol: dbl-1
organism: worm
uniprot_id: G5EEL5
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Ligand for the serine/threonine-protein kinase receptor type- 1 sma-6 which
    activates a TGF-beta-like signaling pathway (PubMed:24004951). Multifunctional
    protein that is involved in body size, male ectodermal patterning, innate immunity,
    lipid metabolism and neural plasticity (PubMed:10021351, PubMed:12176330, PubMed:23019581,
    PubMed:29162682, PubMed:9847238). Dose-dependent regulator of body size, probably
    influencing the sizes of some or all cells rather than their number (PubMed:10021351,
    PubMed:22189608, PubMed:9847238). Plays a role in patterning of male-specific
    genital sensilla (simple sense organs), known as rays, and mating-associated structures,
    spicules (PubMed:10021351, PubMed:9847238). Plays a protective role in response
    to infection by the Gram-negative bacterium S.marcescens, by activating expression
    of genes involved in innate immunity (PubMed:12176330). Regulator of lipid homeostasis,
    acting non cell-autonomously in the hypodermis; partly dependent on the Insulin/IGF-1-like
    signaling (IIS) mediated pathway (PubMed:29162682). Required for aversive olfactory
    learning of pathogenic bacteria in adults (PubMed:23019581). Involved in gland
    cell morphology, possibly via activation of a Smad-independent TGF-beta signaling
    pathway (PubMed:24690231). Required to oppose the autoregulation of expression
    of Runt-related transcription factor rnt- 1.
  source_type: curated
  url: https://www.uniprot.org/uniprot/G5EEL5
  source_id: G5EEL5
- source: Alliance_Imported
  text: dbl-1 encodes a member of the transforming growth factor beta (TGFbeta) superfamily
    that includes Drosophila decapentaplegic (Dpp) and the vertebrate bone morphogenetic
    proteins (BMPs); DBL-1 functions as a dose-dependent ligand for the SMA-6 and
    DAF-4 TGFbeta receptors that ultimately activate the SMA-2, -3, and -4 complex
    of transcription factors to regulate body length and size, as well as the patterning
    of male sensory rays and copulatory spicules; DBL-1 signaling upregulates sma-6
    expression, suggesting that there is positive autoregulation in the DBL-1 signaling
    pathway; in contrast, DBL-1 negatively regulates expression of LON-1, a predicted
    secreted protein that is a downstream component of the body size pathway; in addition
    to its other roles, the TGFbeta Sma/Mab pathway also regulates reproductive aging,
    mutants of the pathway show an extension of the reproductive span, independent
    of somatic longevity; DBL-1 is expressed primarily in neurons.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00000936;class=Gene
  source_id: WB:WBGene00000936
- source: Alliance_Automated
  text: Predicted to enable BMP receptor binding activity and cytokine activity. Involved
    in several processes, including defense response to bacterium; nematode male tail
    tip morphogenesis; and regulation of gene expression. Predicted to be active in
    extracellular region. Is expressed in body wall musculature; nervous system; pm2
    precursor; and in male. Used to study Marfan syndrome. Human ortholog(s) of this
    gene implicated in several diseases, including bone disease (multiple); cleft
    lip; congenital anomalies of the kidney and urinary tract (multiple); hemochromatosis
    type 1; and orofacial cleft 11. Orthologous to several human genes including BMP2
    (bone morphogenetic protein 2); BMP4 (bone morphogenetic protein 4); and BMP7
    (bone morphogenetic protein 7).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00000936;class=Gene
