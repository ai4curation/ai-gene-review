- source: Alliance_Imported
  text: 'met-2 encodes a histone methyltransferase similar to human SETDB1; during
    development, met-2 acts as a class B synMuv gene: loss of met-2 activity in the
    background of a class A or class C synMuv mutant, such as lin-15A or trr-1, respectively,
    results in a multivulval phenotype, indicating that met-2 acts to negatively regulate
    vulval cell fate specification; as met-2 is required for normal levels of histone
    H3K36 and H3K9 trimethylation and met-2;lin-15A animals show an increase in lin-3
    EGF expression, met-2 likely acts as part of a transcriptional repressor complex
    that negatively regulates lin-3 EGF transcription to restrict vulval development
    to three of the six cells in the vulval equivalence group; in addition, genetic
    studies indicate that met-2 likely acts redundantly with met-1 to inhibit vulval
    cell fates.'
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00019883;class=Gene
  source_id: WB:WBGene00019883
