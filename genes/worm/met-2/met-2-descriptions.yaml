    - rubric: specificity
      score: 3
    overall_notes: SETDB1-like synMuv B gene repressing lin-3 is correct. The H3K36
      trimethylation claim and H3K9 'trimethylation' are out of date; MET-2 deposits
      H3K9me1/me2. Nothing on heterochromatin.
- source: Alliance_Automated
  text: Enables histone H3K36 methyltransferase activity and histone H3K9 methyltransferase
    activity. Involved in several processes, including negative regulation of vulval
    development; regulation of gene expression; and vulval cell fate commitment. Located
    in cytoplasm. Is expressed in several structures, including germ line; hypodermis;
    intestine; muscle cell; and neurons. Human ortholog(s) of this gene implicated
    in autistic disorder and lung cancer. Orthologous to several human genes including
    SETDB1 (SET domain bifurcated histone lysine methyltransferase 1).
