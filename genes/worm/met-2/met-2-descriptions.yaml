findings:
- category: discrepancy
  text: WormBase and the automated text attribute H3K36 methylation to MET-2; the
    review removes H3K36 methyltransferase activity and describes MET-2 as an H3K9me1/me2
    enzyme.
  sources:
  - Alliance_Imported
  - Alliance_Automated
- category: insight
  text: No Alliance source mentions the LIN-65/ARLE-14 complex or heterochromatin
    anchoring that the review treats as central.
  sources:
  - Alliance_Imported
  - Alliance_Automated
