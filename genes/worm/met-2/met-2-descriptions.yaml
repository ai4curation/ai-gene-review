gene_symbol: met-2
organism: worm
uniprot_id: P34544
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Histone methyltransferase which is required for the mono- and dimethylation
    of 'Lys-9' of histone H3 (PubMed:20107519, PubMed:22939621). This increases the
    efficiency of set-25-mediated trimethylation of histone H3 'Lys-9' (PubMed:22939621).
    Involved in the transcriptional repression of lin-3 which is required for the
    negative regulation of vulval cell fate specification during postembryonic development
    (PubMed:17634190). Has a role in blocking checkpoint signaling and mediating the
    transcriptional silencing of meiotic sex chromosome inactivation; a mechanism
    which enables checkpoint proteins to distinguish between the partnerless male
    X chromosome and asynapsed chromosomes thereby shielding the lone X from inappropriate
    activation of an apoptotic program (PubMed:21909284). Operates redundantly with
    set-25 to position chromatin at the nuclear periphery (PubMed:22939621). Required
    for small-RNA-induced H3K9 methylation (PubMed:26365259). Together with set-25,
    protects and stabilizes repeat-rich genomic regions by suppressing transcription-induced
    replication stress through methylation of H3K9 (PubMed:27668659). Together with
    spr-5, required for transgenerational fertility (PubMed:24685137).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P34544
  source_id: P34544
- source: Alliance_Imported
  text: 'met-2 encodes a histone methyltransferase similar to human SETDB1; during
    development, met-2 acts as a class B synMuv gene: loss of met-2 activity in the
    background of a class A or class C synMuv mutant, such as lin-15A or trr-1, respectively,
    results in a multivulval phenotype, indicating that met-2 acts to negatively regulate
    vulval cell fate specification; as met-2 is required for normal levels of histone
    H3K36 and H3K9 trimethylation and met-2;lin-15A animals show an increase in lin-3
    EGF expression, met-2 likely acts as part of a transcriptional repressor complex
    that negatively regulates lin-3 EGF transcription to restrict vulval development
    to three of the six cells in the vulval equivalence group; in addition, genetic
    studies indicate that met-2 likely acts redundantly with met-1 to inhibit vulval
    cell fates.'
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00019883;class=Gene
  source_id: WB:WBGene00019883
- source: Alliance_Automated
  text: Enables histone H3K36 methyltransferase activity and histone H3K9 methyltransferase
    activity. Involved in several processes, including negative regulation of vulval
    development; regulation of gene expression; and vulval cell fate commitment. Located
    in cytoplasm. Is expressed in several structures, including germ line; hypodermis;
    intestine; muscle cell; and neurons. Human ortholog(s) of this gene implicated
    in autistic disorder and lung cancer. Orthologous to several human genes including
    SETDB1 (SET domain bifurcated histone lysine methyltransferase 1).
  source_type: automated
