- source: Alliance_Automated
  text: Predicted to enable intraciliary transport particle B binding activity. Predicted
    to be involved in intraciliary anterograde transport and intraciliary transport
    involved in cilium assembly. Predicted to be located in cilium. Predicted to be
    part of intraciliary transport particle B. Predicted to be active in ciliary basal
    body and ciliary base. Is expressed in neurons. Human ortholog(s) of this gene
    implicated in kidney disease. Orthologous to human IFT56 (intraflagellar transport
    56).
