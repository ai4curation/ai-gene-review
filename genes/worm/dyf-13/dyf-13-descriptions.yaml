descriptions:
- source: UniProt
  text: Component of the intraflagellar transport (IFT) complex B required for transport
    of proteins in the motile cilium (PubMed:15916950, PubMed:28479320). May be required
    for ciliary entrance and transport of specific ciliary cargo proteins such as
    che-3 which are related to motility (PubMed:28479320).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q95QT8
