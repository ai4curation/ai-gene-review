gene_symbol: dyf-13
organism: worm
uniprot_id: Q95QT8
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Component of the intraflagellar transport (IFT) complex B required for transport
    of proteins in the motile cilium (PubMed:15916950, PubMed:28479320). May be required
    for ciliary entrance and transport of specific ciliary cargo proteins such as
    che-3 which are related to motility (PubMed:28479320).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q95QT8
  source_id: Q95QT8
- source: Alliance_Imported
  text: dyf-13 encodes a ciliary protein, belonging to a conserved butunfamiliar protein
    family, that is required for cilial function andformation, undergoes IFT, and
    might represent a core component of theOSM-3 kinesin IFT pathway; dyf-13 is expressed
    in AWB neurons; dyf-13mutations affect morphology of the amphid and phasmid neurons,chemotaxis,
    dauer formation, growth, male mating, and hermaphroditebrood size; dyf-13 requires
    DAF-19 for its transcription.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00001129;class=Gene
  source_id: WB:WBGene00001129
- source: Alliance_Automated
  text: Predicted to enable intraciliary transport particle B binding activity. Predicted
    to be involved in intraciliary anterograde transport and intraciliary transport
    involved in cilium assembly. Predicted to be located in cilium. Predicted to be
    part of intraciliary transport particle B. Predicted to be active in ciliary basal
    body and ciliary base. Is expressed in neurons. Human ortholog(s) of this gene
    implicated in kidney disease. Orthologous to human IFT56 (intraflagellar transport
    56).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00001129;class=Gene
  source_id: WB:WBGene00001129
