descriptions:
- source: UniProt
  text: Guanylate cyclase involved in the production of the second messenger cGMP
    (By similarity). Regulates chemotaxis responses toward volatile odorants in AWC
    sensory neurons and their avoidance in AWB sensory neurons (PubMed:10774726, PubMed:8348618).
    May be involved in sensitivity to quinine by regulating egl-4 activity through
    the production of cGMP (PubMed:23874221). Involved in phototransduction in ASJ
    neurons downstream of G protein-coupled-photoreceptor lite-1 (PubMed:20436480).
    Required to maintain the expression of putative olfactory receptor str-2 in AWC
    neurons in adults (PubMed:10571181). In AWB and AWC sensory neurons, mediates
    the recognition of food oders which subsequently allows for the detection of preferred
    food sources (PubMed:25009271). Involved in AWB sensory neuron development and
    extension during postembryonic development, potentially via mediating localization
    of tub-1 and PI(4,5)P2 to membrane cilia (PubMed:31259686).
