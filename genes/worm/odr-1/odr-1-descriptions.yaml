gene_symbol: odr-1
organism: worm
uniprot_id: B1Q257
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Guanylate cyclase involved in the production of the second messenger cGMP
    (By similarity). Regulates chemotaxis responses toward volatile odorants in AWC
    sensory neurons and their avoidance in AWB sensory neurons (PubMed:10774726, PubMed:8348618).
    May be involved in sensitivity to quinine by regulating egl-4 activity through
    the production of cGMP (PubMed:23874221). Involved in phototransduction in ASJ
    neurons downstream of G protein-coupled-photoreceptor lite-1 (PubMed:20436480).
    Required to maintain the expression of putative olfactory receptor str-2 in AWC
    neurons in adults (PubMed:10571181). In AWB and AWC sensory neurons, mediates
    the recognition of food oders which subsequently allows for the detection of preferred
    food sources (PubMed:25009271). Involved in AWB sensory neuron development and
    extension during postembryonic development, potentially via mediating localization
    of tub-1 and PI(4,5)P2 to membrane cilia (PubMed:31259686).
  source_type: curated
  url: https://www.uniprot.org/uniprot/B1Q257
  source_id: B1Q257
- source: Alliance_Imported
  text: odr-1 encodes a putative guanylyl cyclase; odr-1 activity is required for
    normal responses to all AWC-sensed odorants; ODR-1 is expressed in chemosensory
    neurons including AWC, where it localizes to the flattened ciliated endings.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00003848;class=Gene
  source_id: WB:WBGene00003848
- source: Alliance_Automated
  text: Predicted to enable guanylate cyclase activity and peptide receptor activity.
    Involved in several processes, including olfactory learning; response to odorant;
    and sensory perception of bitter taste. Located in non-motile cilium. Is expressed
    in I1 neuron and amphid neurons. Human ortholog(s) of this gene implicated in
    Leber congenital amaurosis 1; choroidal sclerosis; cone-rod dystrophy 6; congenital
    stationary night blindness; and retinitis pigmentosa. Orthologous to human GUCY2D
    (guanylate cyclase 2D, retinal) and GUCY2F (guanylate cyclase 2F, retinal).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00003848;class=Gene
  source_id: WB:WBGene00003848
