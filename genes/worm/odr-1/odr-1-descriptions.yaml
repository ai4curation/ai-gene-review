- source: Alliance_Automated
  text: Predicted to enable guanylate cyclase activity and peptide receptor activity.
    Involved in several processes, including olfactory learning; response to odorant;
    and sensory perception of bitter taste. Located in non-motile cilium. Is expressed
    in I1 neuron and amphid neurons. Human ortholog(s) of this gene implicated in
    Leber congenital amaurosis 1; choroidal sclerosis; cone-rod dystrophy 6; congenital
    stationary night blindness; and retinitis pigmentosa. Orthologous to human GUCY2D
    (guanylate cyclase 2D, retinal) and GUCY2F (guanylate cyclase 2F, retinal).
