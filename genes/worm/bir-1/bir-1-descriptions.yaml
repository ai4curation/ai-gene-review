- source: Alliance_Automated
  text: Involved in several processes, including chromosome organization; egg-laying
    behavior; and inductive cell migration. Located in condensed chromosome; midbody;
    and spindle midzone. Part of chromosome passenger complex. Is expressed in egg-laying
    apparatus; hypodermis; pharynx; rectal muscle; and somatic nervous system. Human
    ortholog(s) of this gene implicated in breast disease; cervix disease; prostate
    cancer; and transitional cell carcinoma. Orthologous to human BIRC5 (baculoviral
    IAP repeat containing 5).
