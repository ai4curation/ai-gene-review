descriptions:
- source: UniProt
  text: Component of the chromosomal passenger complex (CPC), a complex that acts
    as a key regulator of chromosome segregation and cytokinesis (PubMed:10209096,
    PubMed:10983970, PubMed:12707312). The CPC complex has essential functions at
    the centromere in ensuring correct chromosome condensation, alignment and segregation
    (PubMed:10983970, PubMed:12707312). In the complex, required to direct the Aurora
    B/air-2 kinase to chromosomes (PubMed:10983970, PubMed:12707312). Also functions
    in spindle midzone formation and in the formation of polar bodies during oogenesis
    (PubMed:10209096, PubMed:10983970). Required for the localization of the kinetochore
    component hcp-1 to chromosomes (PubMed:10983970). Involved in the positive regulation
    of transcription (PubMed:12682297). Involved in the transcriptional regulation
    of collagen genes (PubMed:17116281).
