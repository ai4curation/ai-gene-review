gene_symbol: bir-1
organism: worm
uniprot_id: G5EFA2
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Component of the chromosomal passenger complex (CPC), a complex that acts
    as a key regulator of chromosome segregation and cytokinesis (PubMed:10209096,
    PubMed:10983970, PubMed:12707312). The CPC complex has essential functions at
    the centromere in ensuring correct chromosome condensation, alignment and segregation
    (PubMed:10983970, PubMed:12707312). In the complex, required to direct the Aurora
    B/air-2 kinase to chromosomes (PubMed:10983970, PubMed:12707312). Also functions
    in spindle midzone formation and in the formation of polar bodies during oogenesis
    (PubMed:10209096, PubMed:10983970). Required for the localization of the kinetochore
    component hcp-1 to chromosomes (PubMed:10983970). Involved in the positive regulation
    of transcription (PubMed:12682297). Involved in the transcriptional regulation
    of collagen genes (PubMed:17116281).
  source_type: curated
  url: https://www.uniprot.org/uniprot/G5EFA2
  source_id: G5EFA2
- source: Alliance_Imported
  text: bir-1 encodes a homolog of the baculoviral inhibitor-of-apoptosis (IAP) repeat
    (BIR) proteins (BIRPs) family; bir-1 is required for meiotic and mitotic chromosome
    segregation and for cytokinesis; BIR-1 localizes to meiotic and mitotic chromosomes
    and to the spindle midzone; BIR-1 forms a protein complex with CSC-1, ICP-1 and
    AIR-2.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00000249;class=Gene
  source_id: WB:WBGene00000249
- source: Alliance_Automated
  text: Involved in several processes, including chromosome organization; egg-laying
    behavior; and inductive cell migration. Located in condensed chromosome; midbody;
    and spindle midzone. Part of chromosome passenger complex. Is expressed in egg-laying
    apparatus; hypodermis; pharynx; rectal muscle; and somatic nervous system. Human
    ortholog(s) of this gene implicated in breast disease; cervix disease; prostate
    cancer; and transitional cell carcinoma. Orthologous to human BIRC5 (baculoviral
    IAP repeat containing 5).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00000249;class=Gene
  source_id: WB:WBGene00000249
