id: G5EFA2
gene_symbol: bir-1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: >-
  bir-1 (T27F2.3) encodes BIR-1, a 155-residue Survivin-like protein of Caenorhabditis elegans
  that consists of a single zinc-binding baculoviral IAP repeat (BIR) domain and lacks the RING
  and CARD domains of classical inhibitor-of-apoptosis proteins. BIR-1 is a non-catalytic
  targeting subunit of the chromosomal passenger complex (CPC), together with the Aurora B
  kinase AIR-2, the INCENP orthologue ICP-1 and the Borealin-like protein CSC-1. Its BIR domain
  binds CSC-1 directly in a zinc-dependent manner, and the CSC-1/BIR-1 subcomplex binds ICP-1,
  which binds and activates AIR-2; BIR-1 does not stimulate the kinase itself. BIR-1, CSC-1 and
  ICP-1 depend on one another to localize, and AIR-2 needs all three to reach chromosomes. BIR-1
  is on meiotic and mitotic chromosomes up to metaphase, moves to the spindle midzone in
  anaphase and persists at the midbody. Embryos lacking BIR-1 have the same defects as embryos
  lacking AIR-2: poor chromosome condensation, alignment and segregation, reduced histone H3
  Ser10 phosphorylation, failed spindle midzone assembly, failed polar body extrusion, and
  cytokinesis that starts but does not complete. Unlike mammalian Survivin, BIR-1 has no
  detectable role in programmed cell death. Larval RNAi also causes egg-laying, body-shape and
  gonad-migration defects and reduced expression of some genes, including collagens, effects
  attributed to an indirect role in transcription.
