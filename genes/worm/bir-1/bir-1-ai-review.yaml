    summary: >-
      Transferred from Survivin, Deterin and yeast Bir1. In monocentric organisms the CPC
      occupies the inner centromere, between rather than on kinetochores. On holocentric C.
      elegans mitotic chromosomes the CPC (shown for ICP-1) lies in a stripe between the two
