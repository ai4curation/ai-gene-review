      inhibit developmental cell death and bir-1 knockdown did not increase cell death.
    action: REMOVE
    reason: >-
      Over-propagated IBA refuted by experiment in the target organism. The apoptotic role is
      lineage-specific (or disputed even in mammals) and was not inherited by nematode BIR-1,
      whose only conserved role is in the CPC.
    supported_by:
    - reference_id: PMID:10209096
      supporting_text: Overexpression of bir-1 was unable to inhibit developmentally occurring cell
        death in C. elegans and inhibition of bir-1 expression did not increase cell death.
    propagation_review:
