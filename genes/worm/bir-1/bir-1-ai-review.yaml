core_functions:
- description: >-
    BIR-1 is a non-catalytic targeting subunit of the chromosomal passenger complex. Its
    zinc-bound BIR domain binds CSC-1, and the CSC-1/BIR-1 subcomplex recruits ICP-1 and,
    through it, the Aurora B kinase AIR-2 to meiotic and mitotic chromosomes, where the complex
    is needed for chromosome alignment and for meiotic and mitotic chromosome segregation.
  in_complex:
    id: GO:0032133
    label: chromosome passenger complex
  locations:
  - id: GO:0000794
    label: condensed nuclear chromosome
  directly_involved_in:
  - id: GO:0000070
    label: mitotic sister chromatid segregation
  - id: GO:0045132
    label: meiotic chromosome segregation
  supported_by:
  - reference_id: PMID:12707312
    supporting_text: CSC-1, BIR-1, and ICP-1 are interdependent for their localization, and all
      are required for AIR-2 localization.
  - reference_id: PMID:12707312
    supporting_text: This activity is not stimulated by CSC-1/BIR-1, suggesting that these two
      subunits function as targeting subunits for AIR-2 kinase.
  - reference_id: PMID:10983970
    supporting_text: AIR-2 was not present on chromosomes in the absence of BIR-1.
- description: >-
    From anaphase the BIR-1-containing complex relocates to the spindle midzone, where it is
    needed to assemble the midzone and to complete cytokinesis in the embryo.
  in_complex:
    id: GO:0032133
    label: chromosome passenger complex
  locations:
  - id: GO:1990023
    label: mitotic spindle midzone
  directly_involved_in:
  - id: GO:0051256
    label: mitotic spindle midzone assembly
  - id: GO:0000281
    label: mitotic cytokinesis
  supported_by:
  - reference_id: PMID:10209096
    supporting_text: embryos lacking bir-1 were unable to complete cytokinesis and they became
      multinucleate
  - reference_id: PMID:10983970
    supporting_text: The C. elegans BIRP BIR-1 was localized to chromosomes and to the spindle
      midzone.
suggested_questions:
- question: >-
    Does the BIR domain of BIR-1 bind histone H3 phosphorylated on Thr3, as human Survivin does,
    and is this how the C. elegans CPC is targeted to holocentric chromosomes?
- question: >-
    Is the effect of BIR-1 on transcription of collagen and other genes direct, or an indirect
    consequence of CPC (AIR-2) dependent histone H3 Ser10 phosphorylation in non-dividing
    cells?
- question: >-
    Should PAINT place a NOT annotation for negative regulation of apoptotic process on the
    nematode BIR-1 branch of PTHR46771, given the negative result in PMID:10209096?
- question: >-
    Does BIR-1 contribute to spindle assembly checkpoint signalling in C. elegans, as the
    ComplexPortal annotation for the CPC asserts by analogy?
suggested_experiments:
- description: >-
    Mutate the residues of the BIR-1 BIR domain that correspond to the Survivin phospho-H3T3
    binding pocket in an endogenous bir-1 allele, and test CPC recruitment to chromosomes,
    chromosome segregation and midzone localization.
  hypothesis: BIR-1 targets the CPC to chromatin by reading a histone phosphorylation mark,
    separable from its CSC-1 binding.
- description: >-
    Use tissue-specific (for example hypodermal) auxin-inducible degradation of BIR-1 in larvae,
    with CUT&RUN or ChIP of BIR-1 at collagen loci, to test whether BIR-1 regulates
    transcription directly in non-dividing cells.
  hypothesis: BIR-1 acts at collagen promoters in post-mitotic hypodermis independently of its
    role in cell division.
