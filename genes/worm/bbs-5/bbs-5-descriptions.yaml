- source: Alliance_Imported
  text: bbs-5 encodes a novel protein that is the C. elegans ortholog of human BBS5;
    bbs-5 is required for the proper regulation of insulin secretion; bbs-5, bbs-1,
    bbs-8 and bbs-9 mutants along with ciliary phenotypes show an increased secretion
    of insulin, biogenic amines and neuropeptides which requires the Rab27/AEX-6 dense-core
    vesicle exocytosis machinery; a BBS-5::GFP reporter protein is expressed exclusively
    in ciliated neurons, where it localizes to the ciliary base; consistent with the
    presence of an X box in the bbs-5 5' UTR, bbs-5 expression is positively regulated
    by daf-19, a RFX-transcription factor.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00010974;class=Gene
  source_id: WB:WBGene00010974
