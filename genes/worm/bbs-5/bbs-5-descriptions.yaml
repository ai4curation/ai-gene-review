- source: Alliance_Automated
  text: Predicted to enable phosphatidylinositol-3-phosphate binding activity. Predicted
    to be involved in cilium assembly. Located in ciliary base; cytoskeleton; and
    non-motile cilium. Is expressed in head; nervous system; and tail. Used to study
    Bardet-Biedl syndrome and ciliopathy. Human ortholog(s) of this gene implicated
    in Bardet-Biedl syndrome and Bardet-Biedl syndrome 5. Orthologous to human BBS5
    (Bardet-Biedl syndrome 5).
