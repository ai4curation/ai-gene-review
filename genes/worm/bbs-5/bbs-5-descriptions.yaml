descriptions:
- source: UniProt
  text: Component of the BBSome complex (By similarity). The BBSome complex is thought
    to function as a coat complex required for sorting of specific membrane proteins
    to the primary cilia (By similarity). The BBSome complex is required for ciliogenesis
    but is dispensable for centriolar satellite function (By similarity). Required
    for BBSome complex ciliary localization but not for the proper complex assembly
    (By similarity). Required, redundantly with bbs-4, for cilia biogenesis and both
    the assembly and movement of intraflagellar transport proteins along the ciliary
    axoneme (PubMed:22922713, PubMed:26150102). Plays a role in the removal of degraded
    mechanosensory receptors within the cilia (PubMed:26150102).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q21626
  source_id: Q21626
