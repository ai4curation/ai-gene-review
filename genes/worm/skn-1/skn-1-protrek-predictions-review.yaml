    summary: >-
      Rank 3 (score 16.24), the unqualified version of rank 2 and wrong for the same reason. That
      the retrieval returns both the regulation term and its positive-regulation child for a yeast-specific
      process, while returning nothing at all about detoxification or oxidative stress, is a compact
      illustration of how little the ranking is constrained by the query protein once the top hit
      is spent.
    supported_by:
