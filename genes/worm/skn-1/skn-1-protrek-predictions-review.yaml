  label: Caenorhabditis elegans
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for worm skn-1, the Nrf1/Nrf2 ortholog and master regulator of
  oxidative stress response and Phase II detoxification. Nothing that defines the gene appears: GOA
  holds sequence-specific DNA binding and RNA polymerase II cis-regulatory region binding with IDA
  support, cellular detoxification and positive regulation of cellular response to oxidative stress
  with IMP, and endodermal cell fate specification with IGI/IMP, and none of it is in the top five.
  Worse, four of the five slots are sentences ProTrek also returns for other genes in this same cohort:
  rank 1 is the obsolete Gram-negative-defence composite it gives four other worm genes, rank 4 is
  the Drosophila plasmatocyte term it gives hlh-30, and rank 5 is the nematode male tail term it gives
  the mis-keyed csr-1 row. Ranks 2 and 3 are two spellings of yeast mating-type switching. The free-text
  channel is no better on identity - its top hit at 21.90 is ATFS-1's comment, a different worm bZIP
  - though its rank 2 at 21.68 does name phase I detoxification and dietary restriction, which is
  close to SKN-1's real role. Assessment: 1 correct-not-novel, 2 nonparalog incorrect. Assessment:
  1 correct not novel (CNN), 2 nonparalog incorrect (NPI).
