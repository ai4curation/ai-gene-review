    label: positive regulation of mating type switching
  predicted_term_type: GO_BP
  review:
    assessment: NPI
    confidence_score: 0
    error_type: TAXON_CONSTRAINT_VIOLATION
    summary: >-
      Rank 2 (score 17.23). Mating type switching is the budding-yeast HO-endonuclease-initiated gene
      conversion at the MAT locus. C. elegans has no mating type locus and no such process; SKN-1's
      developmental role is EMS blastomere and endoderm specification. Rank 3 repeats the same claim
      without the positive-regulation qualifier, spending two of five slots on a process that cannot
      occur in this organism.
    supported_by:
    - reference_id: file:worm/skn-1/skn-1-uniprot.txt
      supporting_text: >-
        Belongs to the bZIP family. Skn1 subfamily.
