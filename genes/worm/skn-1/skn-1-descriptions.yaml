- source: Alliance_Automated
  text: Enables Hsp70 protein binding activity and RNA polymerase II cis-regulatory
    region sequence-specific DNA binding activity. Involved in several processes,
    including determination of adult lifespan; endoplasmic reticulum unfolded protein
    response; and regulation of gene expression. Located in endoplasmic reticulum;
    mitochondrion; and nucleus. Is expressed in several structures, including AB;
    C; germ line; head ganglion; and neurons. Human ortholog(s) of this gene implicated
    in several diseases, including Alzheimer's disease; chronic obstructive pulmonary
    disease; eye disease (multiple); immunodeficiency, developmental delay, and hypohomocysteinemia;
    and liver disease (multiple). Orthologous to several human genes including NFE2L1
    (NFE2 like bZIP transcription factor 1); NFE2L2 (NFE2 like bZIP transcription
    factor 2); and NFE2L3 (NFE2 like bZIP transcription factor 3).
