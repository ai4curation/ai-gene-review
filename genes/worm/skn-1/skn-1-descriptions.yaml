descriptions:
- source: UniProt
  text: 'Transcription factor (PubMed:1547503, PubMed:28600327). Required to specify
    the fate of ventral blastomeres in the early embryo, and postembryonically for
    the development of the intestine (PubMed:1547503). Directly regulates expression
    of zygotically expressed med-1 and med-2 to direct mesendoderm development (PubMed:11463373,
    PubMed:1547503). In response to oxidative stress and anoxia, required to up-regulate
    expression of stl-1 mRNA (PubMed:24385935). Involved in regulating innate immunity,
    acting downstream of the pmk-1 p38/MAPK pathway and probably also downstream of
    nipi-3 (PubMed:34407394). Required for the up-regulation of phase II detoxification
    genes, including gcs-1 and several glutathione-S- transferase mRNAs in response
    to oxidative stress generated during pathogenic bacterial infection (PubMed:22216003).
    Modulates oxidative stress responses in concert with transcription factors such
    as hcf-1 and elt-3 (PubMed:22568582, PubMed:28600327). Regulates the transcription
    of genes associated with metabolism in response to changes in nutrient availability
    (PubMed:23040073). In neurons, involved in mitochondrial fusion and behavioral
    recovery during reoxygenation (PubMed:24385935). Required for riok-1 mRNA expression
    in the intestine (PubMed:25688864). Downstream of the let-60/Ras, mek-2 and pmk-1
    pathway, positively regulates lifespan probably by preventing transcription of
    insulin-like peptides such as ins-39 (PubMed:20624915). Prevents degeneration
    of dopaminergic CEP neurons in response to high Al(3+) or Mn(2+) levels, probably
    by promoting the expression of glutathione-S-transferase gst-1 (PubMed:23106139,
    PubMed:23721876). . [Isoform a]: Directed by the ER-associated degradation pathway
    (ERAD), mediates proteasomal homeostasis by regulating the expression of proteasomal
    subunits such as rpt-3 to confer resistance to proteasomal dysfunction.'
