findings:
- category: insight
  text: UniProt describes DYF-1 as acting in the 'motile cilium', but C. elegans sensory
    cilia are non-motile; the phrasing comes from a cross-species IFT-B statement
    (PMID:28479320).
  sources:
  - UniProt
- category: gap
  text: WormBase's placement of DYF-1 downstream of BBS-8 is not mentioned in the
    review.
  sources:
  - Alliance_Imported
