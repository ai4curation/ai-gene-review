gene_symbol: dyf-1
organism: worm
uniprot_id: Q8I7G4
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Plays a role in anterograde intraflagellar transport (IFT), the process by
    which cilia precursors are transported from the base of the cilium to the site
    of their incorporation at the tip (PubMed:16049494). Specifically required for
    the kinesin osm-3 to dock onto and move the IFT particles which contain these
    precursors (PubMed:16049494). Component of the intraflagellar transport (IFT)
    complex B required for transport of proteins in the motile cilium (PubMed:28479320).
    May be required for ciliary entrance and transport of specific ciliary cargo proteins
    such as che-3 which are related to motility (PubMed:28479320). Required for polyglutamylation
    of axonemal tubulin in sensory cilia (PubMed:17761526).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q8I7G4
  source_id: Q8I7G4
- source: Alliance_Imported
  text: dyf-1 encodes a ciliary protein, belonging to a conserved but unfamiliarprotein
    family, specifically required for the kinesin OSM-3 to dock ontoand move intraflagellar
    transport (IFT) particles; DYF-1 affectsdevelopment of the amphid and phasmid
    neurons, chemotaxis, and dauerformation; DYF-1 function is downstream of BBS-8,
    which is required forIFT particles to stably bind both kinesin-II and OSM-3.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00001117;class=Gene
  source_id: WB:WBGene00001117
- source: Alliance_Automated
  text: Predicted to enable intraciliary transport particle B binding activity. Involved
    in intraciliary transport; protein localization to plasma membrane; and protein
    polyglutamylation. Located in axonemal microtubule and ciliary basal body. Is
    expressed in amphid neurons; inner labial neurons; outer labial neurons; and phasmid
    neurons. Orthologous to human IFT70A (intraflagellar transport 70A) and IFT70B
    (intraflagellar transport 70B).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00001117;class=Gene
  source_id: WB:WBGene00001117
