descriptions:
- source: UniProt
  text: Plays a role in anterograde intraflagellar transport (IFT), the process by
    which cilia precursors are transported from the base of the cilium to the site
    of their incorporation at the tip (PubMed:16049494). Specifically required for
    the kinesin osm-3 to dock onto and move the IFT particles which contain these
    precursors (PubMed:16049494). Component of the intraflagellar transport (IFT)
    complex B required for transport of proteins in the motile cilium (PubMed:28479320).
    May be required for ciliary entrance and transport of specific ciliary cargo proteins
    such as che-3 which are related to motility (PubMed:28479320). Required for polyglutamylation
    of axonemal tubulin in sensory cilia (PubMed:17761526).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q8I7G4
