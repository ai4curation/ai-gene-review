- id: PMID:19380113
  title: 'Antifungal innate immunity in C. elegans: PKCdelta links G protein signaling and a conserved
    p38 MAPK cascade.'
  findings:
  - statement: tpa-1 alleles block fungal-infection-induced nlp-29 expression, placing PKC-delta
      upstream of p38 MAPK signaling in epidermal antifungal defense.
    supporting_text: Through epistasis analyses, we demonstrate that C. elegans PKC acts through
      the p38 MAPK pathway to regulate nlp-29.
  - statement: In the epidermal nlp-29 antifungal pathway, TPA-1 does not signal through D-type
      protein kinases.
    supporting_text: Unexpectedly and unlike in mammals, tpa-1 does not act via D-type protein
      kinases
    finding_review:
      finding_status: CURRENT
      review_notes: This is current for the epidermal nlp-29 antifungal branch and does not
        contradict the distinct intestinal antibacterial pathway in which Ren et al. place TPA-1
        upstream of DKF-2.
      supported_by:
      - reference_id: PMID:19371715
        supporting_text: Thus, we conclude that TPA-1 uniquely regulates DKF-2 in intestinal
          cells in vivo.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only in cache; the abstract directly supports the epidermal
      antifungal tpa-1 role.
- id: PMID:22470487
  title: The pseudokinase NIPI-4 is a novel regulator of antimicrobial peptide gene expression.
  findings:
  - statement: NIPI-4 acts downstream of TPA-1 in the epidermal antimicrobial peptide pathway
      after fungal infection.
    supporting_text: It acts in the epidermis downstream of the PKC∂ TPA-1, as a positive
      regulator of nlp antimicrobial peptide gene expression after infection.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached; supports the epidermal antifungal/wounding branch and also
      shows that this branch is not the intestinal antibacterial DKF-2 pathway.
- id: PMID:23072806
  title: Endocannabinoid-Goα signalling inhibits axon regeneration in Caenorhabditis elegans by
    antagonizing Gqα-PKC-JNK signalling.
  findings:
  - statement: TPA-1 phosphorylates MLK-1 and promotes the MLK-1/MEK-1/KGB-1 JNK cascade after
      axon injury.
    supporting_text: Furthermore, we demonstrate that TPA-1 PKC phosphorylates the Ser residue
      in the activation loop of the MLK-1 kinase domain.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached; primary support for the TPA-1 to MLK-1/JNK axon-regeneration
      branch.
- id: PMID:19371715
  title: Protein kinase D is an essential regulator of C. elegans innate immunity.
  findings:
  - statement: TPA-1 activates and regulates DKF-2 in the intestinal antibacterial pathway.
    supporting_text: Thus, we conclude that TPA-1 uniquely regulates DKF-2 in intestinal cells
      in vivo.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text cached; not in current GOA for tpa-1, but it is the direct support
      for the intestinal antibacterial TPA-1-to-DKF-2 branch used by GO-CAM 568b0f9600000284.
