suggested_questions:
- question: Does TPA-1 directly activate DKF-2 at the intestinal plasma membrane during PA14
    infection, and what receptor or lipid signal raises DAG in that context?
suggested_experiments:
- hypothesis: TPA-1 phosphorylates DKF-2 activation-loop sites in intestinal cells during
    bacterial infection.
  description: Use phosphosite-specific DKF-2 antibodies or targeted phosphoproteomics in wild
    type and tpa-1 mutants after PA14 exposure, combined with intestine-specific TPA-1 rescue
    and DKF-2 S925/S929 phosphosite mutants.
