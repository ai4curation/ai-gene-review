  label: Caenorhabditis elegans
description: 'tpa-1 encodes the C. elegans protein kinase C-delta ortholog, a diacylglycerol-dependent
  serine/threonine kinase represented by two isoforms. TPA-1 acts downstream of G-protein/phospholipase
  C signaling in multiple MAPK-linked pathways: in the epidermis it promotes p38-dependent nlp antimicrobial
  peptide expression after Drechmeria fungal infection and wounding, in adult motor neurons it phosphorylates
  the MLK-1 MAPKKK to activate MEK-1/KGB-1 JNK signaling during axon regeneration, and in intestinal
  cells it activates the DKF-2 protein kinase D arm that contributes to antibacterial defense.'
