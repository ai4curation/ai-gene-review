- term:
    id: GO:0042490
    label: mechanoreceptor differentiation
  evidence_type: IMP
  original_reference_id: PMID:2898300
  review:
    summary: MEC-3 is required for the touch receptor neurons to acquire their differentiated features.
    action: NEW
    reason: mec-3 mutant touch receptors make none of their distinguishing features, and MEC-3, with UNC-86,
      directly activates touch-receptor genes such as mec-4 and mec-7 through promoter sites needed for
      their expression. MEC-3 therefore does the transcriptional work of the touch-receptor differentiation
      program rather than being merely needed for it. FLP and PVD, also mec-3 dependent, are mechanosensory
      neurons too. The existing annotations stop at neuron differentiation; in C. elegans only mec-17
      carries this term at present (IMP, PMID:8187641).
    supported_by:
    - reference_id: PMID:2898300
      supporting_text: In mutants lacking mec-3 activity, the touch receptors express none of their unique
        differentiated features and appear to be transformed into other types of neurons.
    - reference_id: PMID:9735371
      supporting_text: These sites, which are well-conserved in the related nematode C. briggsae, are
        required for promoter activity.
    - reference_id: PMID:2576011
      supporting_text: mec-3 is necessary for the differentiation of the touch receptors, because in mec-3
        mutants, the touch receptors do not function and have none of their distinguishing features.
