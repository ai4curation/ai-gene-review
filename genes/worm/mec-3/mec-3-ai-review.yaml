- term:
    id: GO:0003713
    label: transcription coactivator activity
  evidence_type: IDA
  original_reference_id: PMID:10899123
  qualifier: enables
  review:
    summary: MEC-3 binds the POU-specific domain of UNC-86 at a surface like the OCA-B-binding pocket
      of Oct-1, and potentiates UNC-86-dependent activation.
    action: KEEP_AS_NON_CORE
    reason: The authors describe MEC-3 as coactivating UNC-86, and MEC-3 does bind DNA-bound UNC-86, which
      fits the coactivator definition. But MEC-3 is itself a homeodomain protein that contacts DNA and
      carries an activation domain within the heterodimer, so its primary activity is as a DNA-binding
      transcription factor partner, captured by the accepted DNA-binding transcription factor rows. The
      coactivator reading is kept as a non-core description of the same interaction.
    supported_by:
    - reference_id: PMID:10899123
      supporting_text: A structural model of the UNC-86 POU domain, including base pairs and amino acid
        residues required for MEC-3 interaction, revealed that P145 and L195 are part of a hydrophobic
        pocket which is similar to the OCA-B-binding domain of the mammalian POU protein, Oct-1.
    - reference_id: PMID:10848606
      supporting_text: as well as mutations that prevent coactivation by MEC-3
