id: P09088
gene_symbol: mec-3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: MEC-3 is a LIM homeodomain transcription factor, one of the three proteins (LIN-11, ISL-1,
  MEC-3) that define the LIM homeodomain family. It is a nuclear protein of the mechanosensory neurons
  - the six gentle-touch receptor neurons (ALM, PLM, AVM, PVM) and the FLP and PVD neurons. With the POU
  homeodomain protein UNC-86 it forms a heterodimer that binds cooperatively, and with higher stability
  and specificity than either protein alone, to AATGCAT-containing sites in the promoters of touch-receptor
  genes such as mec-4 and mec-7 and of mec-3 itself, and synergistically activates their transcription.
  MEC-3 is the terminal selector of touch-receptor identity. In mec-3 mutants the touch cells make none
  of their differentiated features, and the ALM neurons take on the identity of their BDU sister neurons,
  because MEC-3 normally binds UNC-86 and diverts it from PAG-3, with which UNC-86 would induce the neuropeptidergic
  BDU program. mec-3 expression is started by UNC-86, helped by the Hox proteins CEH-13 and EGL-5, and
  maintained by MEC-3 itself, by a second positive feedback loop through the Aristaless factor ALR-1,
  and, in the touch cells, by mec-17. In the PVD nociceptor MEC-3 is needed for harsh-touch responses
  and for the elaborate dendritic arbor, acting through targets such as the claudin-like HPO-30 and the
  zinc-finger factor EGL-46. Its level distinguishes the highly branched PVD from the simple AVM and PVM
  touch neurons, where AHR-1 raises MEC-3, and it is tuned by MBL-1/Muscleblind-dependent splicing to
  its long, fully active isoform and by the E3 ligase EEL-1. In FLP, where MEC-3 and UNC-86 are also present,
  touch-receptor genes are kept off by the EGL-44/EGL-46 repressor.
