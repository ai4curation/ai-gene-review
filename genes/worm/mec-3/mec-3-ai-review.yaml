      dendrite role and its regulation.
    source_defects:
    - defect_type: MISSING_STATEMENT
      resource: WORMBASE
      record: WB:WBGene00003167
      slot: MOD_provided_gene_description
      requested_change: ADD
      asserted_value: WB:WBGene00003167
      confidence: CONFIRMED
      explanation: The description does not say how MEC-3 acts or what it does outside the touch cells.
        MEC-3 binds DNA cooperatively as a heterodimer with UNC-86 at sites in the mec-3, mec-4 and mec-7
        promoters (PMID:8103239, PMID:9735371); it outcompetes PAG-3 for UNC-86 to specify ALM rather
        than BDU identity (PMID:26096732); and its level specifies the branched PVD nociceptor versus
        the AVM/PVM touch neurons (PMID:23889932). These should be added.
      supported_by:
      - reference_id: PMID:8103239
        supporting_text: bind cooperatively as a heterodimer to the mec-3 promoter.
      - reference_id: PMID:9735371
        supporting_text: UNC-86::MEC-3 hetero-oligomer-binding sites are also found in the promoters of
          two presumed targets of mec-3, the mec-4 and mec-7 genes
      - reference_id: PMID:26096732
        supporting_text: We show that the MEC-3 LIM homeodomain protein can outcompete the execution of
          a neuropeptidergic differentiation program by direct interaction with the UNC-86/Brn3 POU homeodomain
          protein.
      - reference_id: PMID:23889932
        supporting_text: Low levels of MEC-3 specify the elaborate branching pattern of PVD nociceptors,
          whereas high MEC-3 is correlated with the simple morphology of AVM and PVM touch neurons.
