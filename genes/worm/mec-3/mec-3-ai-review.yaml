    review_notes: WormBase curated description (uncited, undated). Every claim checks out - founding LIM
      homeodomain member (PMID:2898300), required for differentiation of the mechanosensory neurons (PMID:2898300,
      PMID:2576011), expressed in them (touch receptors, FLP, PVD; PMID:2576011), initiation dependent
      on UNC-86 and maintenance on MEC-3 and mec-17 (PMID:2576011; mec-17 only in the touch receptors).
