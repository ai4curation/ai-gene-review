- id: file:worm/mec-3/mec-3-notes.md
  title: Review notes for C. elegans mec-3 (manual literature search)
  findings: []
core_functions:
- description: With UNC-86, MEC-3 forms a heterodimer that binds cooperatively to AATGCAT-containing sites
    in the promoters of touch-receptor genes (mec-4, mec-7) and of mec-3 itself, and synergistically activates
    their transcription. As the terminal selector it drives touch-receptor differentiation and, by sequestering
    UNC-86 from PAG-3, blocks the alternative BDU program.
  molecular_function:
    id: GO:0000981
    label: DNA-binding transcription factor activity, RNA polymerase II-specific
  directly_involved_in:
  - id: GO:0045944
    label: positive regulation of transcription by RNA polymerase II
  - id: GO:0042490
    label: mechanoreceptor differentiation
  locations:
  - id: GO:0005634
    label: nucleus
  in_complex:
    id: GO:0090575
    label: RNA polymerase II transcription regulator complex
  supported_by:
  - reference_id: PMID:8103239
    supporting_text: The POU-type homeodomain protein UNC-86 and the LIM-type homeodomain protein MEC-3,
      which specify neuronal cell fate in the nematode Caenorhabditis elegans, bind cooperatively as a
      heterodimer to the mec-3 promoter.
  - reference_id: PMID:9735371
    supporting_text: These data support a model in which touch-cell differentiation is specified, in part,
      by the UNC-86::MEC-3 hetero-oligomer and not by MEC-3 alone.
  - reference_id: PMID:7664734
    supporting_text: in the presence of both UNC-86 and MEC-3, we observed cooperative binding to the
      mec-3 promoter and synergistic activation of transcription in vitro
- description: In the PVD nociceptor, MEC-3 is required cell-autonomously for the elaborate dendritic
    arbor and harsh-touch function, activating targets such as hpo-30 and egl-46; its level, set by AHR-1
    and by MBL-1-dependent splicing, distinguishes PVD from the touch neurons.
  molecular_function:
    id: GO:0000981
    label: DNA-binding transcription factor activity, RNA polymerase II-specific
  directly_involved_in:
  - id: GO:0045944
    label: positive regulation of transcription by RNA polymerase II
  - id: GO:0030182
    label: neuron differentiation
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:23889932
    supporting_text: Low levels of MEC-3 specify the elaborate branching pattern of PVD nociceptors, whereas
      high MEC-3 is correlated with the simple morphology of AVM and PVM touch neurons.
  - reference_id: PMID:20537990
    supporting_text: These results are consistent with a cell-autonomous role for mec-3 in promoting PVD
      dendritic branching.
suggested_questions:
- question: Does MEC-3 bind DNA on its own in vivo, or only within the UNC-86/MEC-3 heterodimer? In vitro
    results differ between footprinting (PMID:1361171) and embryo-extract assays (PMID:7664734).
- question: How does one selector pair (UNC-86/MEC-3) activate different target sets in the touch neurons,
    FLP and PVD - through MEC-3 level, isoform, partners such as LDB-1 and ALR-1, or repressors such as
    EGL-44/EGL-46 and AHR-1?
- question: Do the UniProt isoforms of P09088 correspond to the long and short mec-3 isoforms whose ratio
    MBL-1 controls?
suggested_experiments:
- description: Profile endogenous MEC-3 binding (CUT&RUN or DamID) in sorted touch neurons, FLP and PVD,
    in wild type and in unc-86 and egl-44 mutants.
  hypothesis: MEC-3 occupancy depends on UNC-86 everywhere, while EGL-44/EGL-46 occupy a subset of the
    same sites in FLP.
  experiment_type: ChIP-seq / CUT&RUN / DamID
- description: Titrate MEC-3 in PVD with an inducible degron and measure dendrite branch number and hpo-30
    and egl-46 expression.
  hypothesis: Branching and target expression follow MEC-3 dose, with distinct thresholds for PVD and
    touch-neuron programs.
  experiment_type: dose-controlled protein depletion
