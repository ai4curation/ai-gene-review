findings:
- category: gap
  text: WormBase omits the UNC-86/MEC-3 heterodimer and its target genes (mec-4, mec-7), the
    ALM/BDU identity competition with PAG-3 (PMID:26096732) and the level-dependent PVD dendrite
    role (PMID:23889932). Recorded as a MISSING_STATEMENT defect.
  sources:
  - Alliance_Imported
- category: gap
  text: UniProt TISSUE SPECIFICITY lists the touch receptors and FLP but not PVD, although
    PMID:2576011 reports PVD expression and the entry's FUNCTION text describes a PVD role.
    Recorded as a MISSING_STATEMENT defect.
  sources:
  - UniProt
- category: insight
  text: WormBase's statement that maintenance of mec-3 expression depends on mec-17 is correct
    only for the touch receptors; FLP and PVD expression is unaffected in mec-17 mutants (PMID:2576011).
  sources:
  - Alliance_Imported
- category: discrepancy
  text: The automated text does not mention touch-receptor differentiation, the defining mec-3
    function, and gives transcription coactivator activity, which the review keeps as non-core.
  sources:
  - Alliance_Automated
  - RefSeq
- category: insight
  text: The touch-receptor differentiation role stated by UniProt and WormBase had no specific
    GO term on mec-3; the review adds GO:0042490 mechanoreceptor differentiation as a NEW
    row.
  sources:
  - UniProt
  - Alliance_Imported
review:
  reviewer: AI
  rubrics:
  - rubric: overall_concordance
    score: 4
  overall_notes: UniProt and WormBase agree on a LIM homeodomain selector of touch-receptor
    identity and are both correct; UniProt is much fuller. The automated texts list correct
    molecular terms but miss the core differentiation role.
