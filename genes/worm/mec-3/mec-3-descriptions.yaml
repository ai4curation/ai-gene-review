      does not name the target genes (mec-4, mec-7) that SUBUNIT mentions.
- source: Alliance_Imported
  text: mec-3 encodes a founding member of the LIM (Lin-11, Isl-1, Mec-3) homeodomain family
    of transcriptional regulators; during C. elegans development, MEC-3 activity is required
    for proper differentiation and maturation of the mechanosensory neurons; MEC-3 is expressed
    in the mechanosensory neurons, where initiation of expression is dependent upon the UNC-86
    homeodomain protein and maintenance of expression is dependent upon MEC-3 itself and mec-17.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00003167;class=Gene
