- source: Alliance_Automated
  text: Enables DNA-binding transcription factor activity, RNA polymerase II-specific; RNA
    polymerase II-specific DNA-binding transcription factor binding activity; and transcription
    coactivator activity. Contributes to RNA polymerase II transcription regulatory region
    sequence-specific DNA binding activity. Involved in several processes, including mechanosensory
    behavior; neuron projection organization; and positive regulation of transcription by
    RNA polymerase II. Part of RNA polymerase II transcription regulator complex. Is expressed
    in VA neuron; head neurons; mechanosensory neurons; ventral nerve cord; and vulva. Orthologous
    to human LHX5 (LIM homeobox 5).
