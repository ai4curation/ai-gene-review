id: P45896
gene_symbol: sma-3
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: SMA-3 is the principal receptor-regulated Smad (R-Smad) of the C. elegans DBL-1/BMP-like
  Sma/Mab pathway. It is a dwarfin/MAD-family protein with MH1 DNA-binding and MH2 domains.
  SMA-3 is expressed in the hypodermis, pharynx and intestine. It is found in both cytoplasm
  and nucleus, and SMA-6 receptor activity enhances its nuclear accumulation. With SMA-2 and
  the co-Smad SMA-4, SMA-3 acts as a transcription factor. Its activity in the hypodermis
  is necessary and sufficient for normal body size, and pharyngeal activity adds to pharynx
  and body growth. Targets include lon-1, which the pathway represses. SMA-3 is also required
  for male tail ray and tail tip morphogenesis, and in males it enters the nuclei of the tail
  tip cells during retraction. It mediates DBL-1-induced expression of caenacin antimicrobial
  peptides in the epidermis after fungal infection. SMA-3 binds DAF-16/FOXO and co-occupies
  shared target promoters such as rheb-1. In a feedback loop, pathway activity negatively
  regulates SMA-3 protein levels.
