  review:
    summary: IBA transfer of RNA polymerase II cis-regulatory sequence-specific DNA binding
      from the Smad/MAD family node. The protein has an MH1 (MAD homology 1) DNA-binding domain
      and an MH2 domain, the typical Smad layout.
    action: ACCEPT
    reason: Smad MH1 domains bind DNA directly, and this function is ancestral across the
      Smad family; nothing suggests it has been lost in this worm Smad. Direct DNA binding
      by the worm protein has not been shown biochemically, but the PAINT node placement is
      sound. The module models this protein as a nuclear Smad transcription factor.
    supported_by:
    - &id001
      reference_id: PMID:8570636
      supporting_text: These analyses suggest that dwarfins are conserved cytoplasmic signal
        transducers.
    - &id002
      reference_id: PMID:28549065
      supporting_text: The BMP signaling cascade involves extracellular ligands like DBL-1,
        type I (SMA-6) and type II (DAF-4) receptors, R-Smads (SMA-2 and SMA-3), a co-Smad
        (SMA-4), and a transcription co-factor (SMA-9) [13–15].
