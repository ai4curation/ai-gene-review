suggested_questions:
- question: What mechanism links Sma/Mab pathway activity to reduced SMA-3 protein accumulation
    (feedback degradation versus transcriptional control)?
- question: In the caenacin antifungal branch, SMA-3 acts without SMA-2 or SMA-4. What partner
    (if any) replaces the co-Smad, and does SMA-3 bind the cnc-2 promoter directly?
suggested_experiments:
- description: ChIP-seq of endogenously tagged SMA-3 in hypodermis to define direct body-size
    targets and test direct binding to lon-1 regulatory elements.
- description: Measure SMA-3 protein half-life (e.g. cycloheximide chase of tagged endogenous
    SMA-3) in wild type versus dbl-1 overexpression to test feedback degradation.
