gene_symbol: sma-3
organism: worm
uniprot_id: P45896
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Involved in TGF-beta pathway. Plays a role in male tail tip morphogenesis
    (PubMed:21408209).
  source_type: curated
  url: https://www.uniprot.org/uniprot/P45896
  source_id: P45896
- source: Alliance_Imported
  text: sma-3 encodes a Smad protein; during development, SMA-3 functions as part
    of a DBL-1/SMA-6 TGF-beta-related signaling pathway that controls body size and
    male tail sensory ray and spicule formation; sma-3, through this pathway, also
    regulates reproductive aging; studies have shown that a reduction of TGF-beta
    pathway genes extends reproductive span by maintaining oocyte and germline quality;
    sma-3 is widely expressed at all developmental stages, beginning during embryogenesis,
    continuing through all larval stages, and seen very strongly in adult hermaphrodites
    and males; a SMA-3::GFP is detected in the pharynx, intestine, and hypodermis
    and localizes to the nucleus; sma-3 expression in the hypodermis is necessary
    and sufficient for normal body size; SMA-3 can physically interact with the LIN-31
    forkhead transcription factor and with DAF-16.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00004857;class=Gene
  source_id: WB:WBGene00004857
- source: Alliance_Automated
  text: Enables transcription coactivator activity. Involved in several processes,
    including male anatomical structure morphogenesis; positive regulation of cell
    size; and positive regulation of nematode male tail tip morphogenesis. Located
    in cytoplasm and nucleus. Is expressed in several structures, including hypodermis;
    intestine; pharynx; somatic gonad; and tail.
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00004857;class=Gene
  source_id: WB:WBGene00004857
