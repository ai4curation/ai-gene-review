gene_symbol: ced-5
organism: worm
uniprot_id: G5EEN3
taxon_id: NCBITaxon:6239
descriptions:
- source: Alliance_Imported
  text: ced-5 encodes a homolog of the human protein DOCK180; ced-5 is required for
    the cell engulfment stage of programmed cell death, and physically interacts with
    CED-2.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00000419;class=Gene
  source_id: WB:WBGene00000419
- source: Alliance_Automated
  text: Is expressed in body wall muscle cell; hermaphrodite somatic gonadal cell;
    and intestinal cell. Human ortholog(s) of this gene implicated in attention deficit
    hyperactivity disorder; immunodeficiency 40; and intellectual disability. Orthologous
    to several human genes including DOCK2 (dedicator of cytokinesis 2) and DOCK5
    (dedicator of cytokinesis 5).
  source_type: automated
  url: https://www.wormbase.org/db/get?name=WBGene00000419;class=Gene
  source_id: WB:WBGene00000419
- source: RefSeq
  text: Enables SH3 domain binding activity and enzyme binding activity. Involved
    in several processes, including engulfment of apoptotic cell; left/right axis
    specification; and positive regulation of distal tip cell migration. Part of guanyl-nucleotide
    exchange factor complex. Is active in presynapse. Is expressed in body wall muscle
    cell; hermaphrodite somatic gonadal cell; and intestinal cell. Human ortholog(s)
    of this gene implicated in attention deficit hyperactivity disorder and immunodeficiency
    40. Orthologous to several human genes including DOCK2 (dedicator of cytokinesis
    2) and DOCK5 (dedicator of cytokinesis 5). [provided by Alliance of Genome Resources,
    Jun 2026]
  source_type: automated
  url: https://www.ncbi.nlm.nih.gov/gene/177942
  source_id: GeneID:177942
fetch_date: '2026-10-29'
