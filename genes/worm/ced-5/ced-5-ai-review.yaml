  review:
    summary: Guanyl-nucleotide exchange factor activity, inherited from the DOCK family node.
    action: ACCEPT
    reason: GEF activity of the DHR-2 domain is the defining, ancestral activity of the DOCK family, and CED-5 is
      the direct orthologue of DOCK180 and Myoblast City with a full DHR-2 domain. Worm genetics place CED-5 with
      CED-12/ELMO upstream of CED-10/Rac, and the CED-12/ELMO-CED-5/DOCK180 complex is described as the GEF for
      CED-10. This is the core molecular function. GO now has no Rac-specific GEF term (GO:0030676 is obsolete),
      so this is the most specific available term.
