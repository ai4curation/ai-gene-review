suggested_questions:
- question: Has guanine nucleotide exchange on CED-10 by purified CED-5 (alone or with CED-12) ever been measured
    directly, or does the GEF activity of the worm protein rest on orthology to DOCK180 and genetic epistasis?
- question: How is the CED-2/CED-5/CED-12 complex recruited to the corpse-facing membrane, and which upstream
    receptor (MOM-5/Frizzled, PSR-1, INA-1/integrin or another) is the main input in each tissue?
- question: Does CED-5 contribute to ABar spindle orientation at all, given that only rare defects were seen in
    ced-1; ced-5 double mutants?
suggested_experiments:
- hypothesis: CED-5 with CED-12 catalyses GDP/GTP exchange on CED-10 and this requires the DHR-2 domain.
  description: Purify CED-5, CED-5 DHR-2 catalytic mutants and CED-12, and measure nucleotide exchange on CED-10
    in vitro; test whether DHR-2-dead CED-5 rescues engulfment and distal tip cell migration in ced-5 null animals.
  experiment_type: biochemical
- hypothesis: CED-5 is recruited to the phagocytic cup around corpses in an engulfing-cell-specific way.
  description: Image endogenously tagged CED-5 in embryos and the germline with markers of nascent phagosomes,
    in wild type and in mom-5, ced-2 and ced-12 mutants.
  experiment_type: imaging
