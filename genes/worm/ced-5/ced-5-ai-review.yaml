id: G5EEN3
gene_symbol: ced-5
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: CED-5 is the C. elegans orthologue of human DOCK180 (DOCK1) and Drosophila Myoblast City, a large
  (1781 aa) DOCK-family guanine nucleotide exchange factor with an N-terminal SH3 domain, a DHR-1 (DOCK-type C2)
  lipid-binding domain and a C-terminal DHR-2 (DOCKER) catalytic domain. It binds the PH-domain protein CED-12/ELMO
  directly and the SH2/SH3 adaptor CED-2/CrkII, and the CED-2/CED-5/CED-12 complex acts as a bipartite exchange
  factor that activates the Rac GTPase CED-10 at the plasma membrane of engulfing and migrating cells. Through
  CED-10 it drives actin reorganization and the extension of cell surfaces. It acts in engulfing cells to
  internalize apoptotic cell corpses, in one of two partially redundant engulfment pathways (the other led by
  CED-1/CED-6/CED-7), and it is required for the guided migration of the two gonadal distal tip cells. The
  Frizzled receptor MOM-5 and the Wnt pathway components GSK-3 and APR-1/APC act upstream of the CED-2/CED-5/CED-12
  module in corpse engulfment and distal tip cell migration. ced-5 also contributes, partially redundantly with
  other genes, to embryonic gastrulation, and engulfment by CED-5-dependent cells helps ensure that cells receiving
  weak death signals actually die.
