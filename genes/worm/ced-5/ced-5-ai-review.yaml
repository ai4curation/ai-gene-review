  review:
    summary: Myoblast fusion, inherited from a DOCK-A node seeded by Drosophila Myoblast City and a zebrafish
      gene.
    action: REMOVE
    reason: CED-5 sits correctly inside the DOCK180/Myoblast City clade, so the node placement is not in
      question for the GEF activity. The problem is the process. Myoblast fusion builds multinucleate muscle
      fibers in flies and vertebrates, but C. elegans body wall muscle cells are mononucleate and do not form by
      myoblast fusion, so the process does not occur in the target organism. The ancestral GEF activity was
      inherited; a lineage-specific use of it in muscle formation was not.
