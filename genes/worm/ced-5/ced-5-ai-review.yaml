  review:
    summary: Apoptotic process involved in development (IGI with ced-8, Chen et al. 2013, CED-8 paper).
    action: MODIFY
    reason: In the full text, ced-5(n1812) is used only as an engulfment-defective background in which corpses persist
      and can be counted; the paper tests ced-8, so this is a clearance readout, not evidence that CED-5 takes part
      in the dying cell's apoptotic program. The positive regulation term is supported instead by Reddien et al. 2001,
      whose abstract defines the engulfment genes it studies as ced-1, ced-2, ced-5, ced-6, ced-7, ced-10 and ced-12
      and states that mutations in engulfment genes alone allow some cells that would normally die to survive, and
      by Hoeppner et al. 2001. ced-5 is in that enumerated set, and engulfment genes act from the engulfing cell to
      promote death, which is positive regulation rather than participation.
