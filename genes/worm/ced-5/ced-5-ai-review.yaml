core_functions:
- description: DOCK-family guanine nucleotide exchange factor that, in a complex with CED-12/ELMO and the adaptor
    CED-2/CrkII, activates the Rac GTPase CED-10 at the plasma membrane of engulfing cells, driving the actin
    reorganization and surface extension needed to engulf apoptotic cell corpses.
