- source: Alliance_Automated
  text: Predicted to enable GABA receptor binding activity; phosphatidylethanolamine
    binding activity; and ubiquitin protein ligase binding activity. Involved in several
    processes, including plasma membrane repair; positive regulation of autophagosome
    assembly; and xenophagy. Located in several cellular components, including bounding
    membrane of organelle; neuronal cell body; and phagophore assembly site. Is expressed
    in several structures, including egg-laying apparatus; germ cell; hypodermis;
    intestine; and nervous system. Orthologous to several human genes including GABARAP
    (GABA type A receptor-associated protein).
