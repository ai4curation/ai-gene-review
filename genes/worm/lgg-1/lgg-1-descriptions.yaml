descriptions:
- source: UniProt
  text: Ubiquitin-like modifier involved in the formation of autophagosomal vacuoles
    (autophagosomes) (PubMed:26687600, PubMed:37395461). When lipidated mediates tethering
    between adjacent membranes and stimulates membrane fusion during autophagy (PubMed:21802374,
    PubMed:26687600, PubMed:37395461). Recruits lipidated-lgg-2 to maturing autophagosomes
    (PubMed:12958363, PubMed:20523114, PubMed:26687600). Acts in the aggrephagy pathway,
    which is the macroautophagic degradation of ubiquitinated protein aggregates,
    and preferentially interacts with autophagy proteins and substrates containing
    LIR motifs to mediate autophagosome formation and protein aggregate degradation
    (PubMed:26687600). In particular, binds to components of the unc-51-atg-13 complex
    to regulate autophagosome formation and cargo sequestration (PubMed:26687600).
    Required for the degradation of specific sepa-1- and sqst-1-containing protein
    aggregates during embryogenesis (PubMed:26687600). Involved in allophagy, which
    is an autophagic process in which paternal mitochondria and organelles are degraded
    during fertilization, and moreover is required for the formation of lgg-2-positive
    allophagic autophagosomes in embryos (PubMed:24374177, PubMed:37395461). Involved
    in the clearance of apoptotic cells by promoting the delivery of engulfed apoptotic
    cells to the lysosome (PubMed:22451698). Plays a role in the distribution and
    clearance of germ cell specific P-granules from somatic cells (PubMed:19167332).
    Also plays a role in the autophagy-mediated degradation of ribosomal RNA and ribosomal
    proteins in lysosomes (PubMed:30102152). Involved in xenophagy, the autophagy-
    mediated degradation of pathogens and pathogen products, such as toxins (PubMed:27875098).
    Required for normal survival when exposed to pathogenic bacteria S.typhimurium
    probably by promoting autophagic degradation of intracellular S.typhimurium (PubMed:19667176).
    Also plays a role in membrane-pore repair (PubMed:27875098). Plays a role in mitophagy
    (PubMed:25896323, PubMed:37395461). Essential for dauer development and longevity,
    including longevity in response to moderate, short-term heat shock, also known
    as a hormetic heat shock (PubMed:12958363, PubMed:20523114, PubMed:28198373).
