  label: Caenorhabditis elegans
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for worm lgg-1, the GABARAP/ATG8 ortholog. All five top calls
  are exact or near-exact GOA matches - autophagosome, cellular response to nitrogen starvation, autophagosome
  membrane, macroautophagy - making this the most uniformly correct result in the worm set. What is
  missing is the molecular function. The review's single core function is phosphatidylethanolamine
  binding: LGG-1 is a ubiquitin-like modifier cleaved at Gly-116 and conjugated to PE, and that lipidation
  is what puts it on the membranes the top hits name. The retrieval returns the compartment and the
  process it participates in, and never the biochemistry that gets it there. This is the same shape
  as ire-1 in the same batch - complexes and processes, no molecular function - and it is the shape
  that matters most for a curation workflow, since the compartment and process terms are the ones
  GOA already has. Scores are flat across the five (17.08 to 16.91, a span of 0.17), so ranking carries
  no information here either. Assessment: 3 correct-not-novel. Assessment: 3 correct not novel (CNN).
