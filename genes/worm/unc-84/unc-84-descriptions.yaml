- source: Alliance_Automated
  text: Enables lamin binding activity. Involved in several processes, including egg-laying
    behavior; nuclear migration along microtubule; and vulval development. Located
    in nuclear inner membrane. Part of meiotic nuclear membrane microtubule tethering
    complex. Is expressed in several structures, including oocyte. Orthologous to
    several human genes including SUN2 (Sad1 and UNC84 domain containing 2).
