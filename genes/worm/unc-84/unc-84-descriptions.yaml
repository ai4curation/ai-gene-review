gene_symbol: unc-84
organism: worm
uniprot_id: Q20745
taxon_id: NCBITaxon:6239
descriptions:
- source: UniProt
  text: Involved in nuclear migration and anchoring in hypodermal precursor cells
    (PubMed:10375507, PubMed:11748140, PubMed:11907270, PubMed:12169658, PubMed:16481402,
    PubMed:20921138, PubMed:21411627, PubMed:23150597, PubMed:25023515, PubMed:25057012).
    Most likely recruits anc-1 to the nuclear envelope where anc-1 functions to tether
    the nucleus to the actin cytoskeleton (PubMed:12169658). Component of the unc-83-unc-84
    LINC (LInker of Nucleoskeleton and Cytoskeleton) complex where it recruits and
    interacts with unc-83 to form a bridge connecting the nuclear envelope to the
    cytoskeleton which allows for nuclear transport along microtubules (PubMed:11748140,
    PubMed:16481402). Its role in nuclear migration may be in association with lamin,
    lmn-1 (PubMed:25057012). Regulates nuclear migrations in one-cell embryos, controlling
    the posterior migration of the male pronucleus following fertilization (PubMed:21798253).
    Not required for centrosome attachment to the nucleus (PubMed:10375507, PubMed:11907270).
    Plays a role in the maintenance of the nuclear envelope architecture in body wall
    muscle cells (PubMed:25023515). May be involved in DNA damage repair through an
    association with zyg-12 (PubMed:27956467). Potentially has roles in homologous
    recombination, double strand break repair and meiotic recombination (PubMed:27956467).
    Specifically, may in part inhibit non-homologous end joining repair, most likely
    through recruiting fan-1 to the nucleoplasm, to facilitate the repair of DNA cross-links
    (PubMed:27956467).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q20745
  source_id: Q20745
- source: Alliance_Imported
  text: unc-84 encodes an inner nuclear membrane protein that contains a SUN domain
    with homology to S. pombe Sad1 and is paralogous to sun-1; SUN proteins include
    Drosophila Klaroid and CG6589, and mammalian SUN1, SUN2, SUN3 and Spag4; SUN-domain
    proteins bind lamins and the KASH domain proteins of the outer nuclear membrane;
    UNC-84 affects nuclear migration and anchoring of various cell types together
    with UNC-83 and ANC-1, thereby affecting coordinated locomotion, vulval formation,
    and egg laying; UNC-84 is actively transported from the peripheral endoplasmic
    reticulum to the nuclear envelope, this process being dependent on two nuclear
    localization signals, an inner nuclear membrane sorting motif and the SUN-nuclear
    envelope localization signal; UNC-83 localization at the nuclear envelope requires
    lamin/lmn-1.
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00006816;class=Gene
