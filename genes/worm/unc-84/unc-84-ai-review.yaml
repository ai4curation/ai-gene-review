id: Q20745
gene_symbol: unc-84
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: UNC-84 is the founding SUN (Sad1/UNC-84) domain protein of C. elegans, a widely expressed
  type II integral protein of the inner nuclear membrane. Its large N-terminal nucleoplasmic domain binds
  the B-type lamin LMN-1, and its luminal C-terminal SUN domain binds the KASH domains of outer-nuclear-membrane
  KASH proteins, recruiting them to the nuclear envelope to form LINC complexes. With the KASH protein
  UNC-83, which recruits kinesin-1 and dynein, UNC-84 forms the bridge that moves nuclei along microtubules
  during nuclear migration in embryonic hyp7 precursors and larval P cells (P cells whose nuclei fail
  to migrate die, causing loss of vulval cells and ventral cord motor neurons). With the giant KASH protein
  ANC-1, UNC-84 anchors nuclei in the hypodermal syncytium through the actin cytoskeleton. Lamin binding
  by the nucleoplasmic domain transmits cytoplasmic force to the nucleoskeleton. UNC-84 is targeted to
  the inner nuclear membrane by redundant nuclear localization and inner-nuclear-membrane sorting signals
  and requires lamin for its nuclear-envelope retention. In the germline, UNC-84 also pairs with the KASH
  protein ZYG-12 and promotes repair of DNA interstrand cross-links, in part by limiting nonhomologous
  end joining and recruiting the FAN-1 nuclease.
