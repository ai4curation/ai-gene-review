suggested_questions:
- question: Nuclear anchorage is proposed here as NEW GO:0051647 nucleus localization for UNC-84, following
    the fly Koi/Msp300/Klar convention. Would the more specific GO:0051658 maintenance of nucleus location
    be preferable for anchorage by UNC-84 and ANC-1? It is currently almost unused in GOA.
  experts:
  - WormBase curators
- question: Should the UNC-84-ZYG-12 germline role in interstrand cross-link repair (PMID:27956467) be
    captured, and if so is UNC-84 a direct participant in repair or a regulator that localizes FAN-1 and
    limits NHEJ?
  experts:
  - DNA repair biologists
  - WormBase curators
suggested_experiments:
- description: Structure-guided mutation of the UNC-84 SUN domain residues that contact the divergent
    UNC-83 KASH peptide, compared with those contacting the canonical ANC-1 KASH peptide.
  hypothesis: UNC-84 engages UNC-83 and ANC-1 through overlapping but distinguishable SUN-KASH interfaces,
    explaining the genetically separable migration and anchorage functions.
  experiment_type: structural biology and transgenic rescue
