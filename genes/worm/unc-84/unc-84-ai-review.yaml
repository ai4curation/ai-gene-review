    label: nucleus localization
  evidence_type: IMP
  original_reference_id: PMID:10375507
  review:
    summary: Nuclear anchorage in the hyp7 syncytium requires UNC-84.
    action: NEW
    reason: 'unc-84 mutants fail to anchor hypodermal nuclei, a function genetically separable from nuclear
      migration; UNC-84 contributes the inner-nuclear-membrane half of the ANC-1 anchoring bridge (structural
      participation, not only necessity). Comparator check: the KASH partner ANC-1 (worm) and the fly
      SUN/KASH proteins Koi, Msp300 and Klar all carry GO:0051647 for nuclear positioning, so this is
      the term GO uses for LINC-dependent nuclear positioning in these organisms. Nuclear migration (GO:0007097)
      is already annotated; GO:0051647 adds the anchorage aspect and is not an ancestor or descendant
      of GO:0007097 as used here.'
    supported_by:
