  review:
    summary: Meiotic nuclear membrane microtubule tethering complex, PAINT inference.
    action: MODIFY
    reason: UNC-84 is a somatic SUN protein; the meiotic telomere-led chromosome movements of C. elegans
      use its paralog SUN-1 with ZYG-12. UNC-84 LINC complexes with UNC-83 and ANC-1 act in interphase
      somatic cells, so the non-meiotic parent GO:0106094 is the accurate complex term, consistent with
      the SUN1/SUN2 reviews and the module choice.
    proposed_replacement_terms:
    - id: GO:0106094
      label: nuclear membrane microtubule tethering complex
    supported_by:
    - reference_id: PMID:27697906
      supporting_text: The LINC complex, consisting of the SUN protein UNC-84 and the KASH protein UNC-83,
        recruits dynein and kinesin-1 to the nuclear surface.
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - CONTEXT_OR_TISSUE_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN000308197
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Ancestral SUN node carrying the meiotic LINC complex IBD (donors include fission yeast
          Sad1 and mammalian SUN1/SUN2; UNC-84 appears through its own somatic UNC-83 complex annotation).
          Meiotic telomere tethering is sound for the family, but in C. elegans it is performed by the
          paralog SUN-1 with ZYG-12, while UNC-84 acts in somatic LINC complexes.
