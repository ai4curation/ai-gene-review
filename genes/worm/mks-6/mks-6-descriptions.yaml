descriptions:
- source: Alliance_Automated
  text: Involved in non-motile cilium assembly and protein localization to ciliary
    transition zone. Located in ciliary transition zone and dendrite terminus. Is
    expressed in head; nervous system; and tail. Human ortholog(s) of this gene implicated
    in COACH syndrome; Joubert syndrome 9; Meckel syndrome 6; intellectual disability;
    and retinitis pigmentosa 93. Orthologous to human CC2D2A (coiled-coil and C2 domain
    containing 2A) and CC2D2B (coiled-coil and C2 domain containing 2B).
