- term:
    id: GO:0043065
    label: positive regulation of apoptotic process
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:1332659
  - PANTHER:PTN001032684
  - RGD:620800
  - RGD:621354
  - UniProtKB:O60238
  - UniProtKB:Q12983
  - ZFIN:ZDB-GENE-040325-1
  review:
    summary: >-
      IBA for positive regulation of apoptotic process from PAINT node
      PTN001032684. All seeds are vertebrate (human BNIP3/NIX, mouse Bnip3l,
      rat Bnip3/Bnip3l, zebrafish). For DCT-1 the only supporting data are
      heterologous: in transfected mammalian cells ceBNIP3 cooperates with
      CED-3 to promote apoptosis (PMID:9824163) and kills cells by a BH3- and
      caspase-independent mechanism (PMID:11114722). No study has shown that
      dct-1 loss or gain alters developmental or germline apoptosis in the
      worm.
    action: KEEP_AS_NON_CORE
    reason: >-
      The conserved pro-death capacity of BNIP3-family proteins is retained by
      DCT-1 when expressed in mammalian cells, which is consistent with the
      node placement, and WormBase curators annotated apoptotic process (IMP)
      from the same work. This is kept as non-core rather than removed: the
      inference is plausible, but the physiological worm role is mitophagy and
      the C. elegans core apoptosis pathway (EGL-1/CED-9/CED-4/CED-3) has not
      been shown to require DCT-1.
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      failure_modes:
      - CONTEXT_OR_TISSUE_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN001032684
        source_status: SUPPORTS_TRANSFER
        comment: >-
          Eumetazoan node; pro-apoptotic statements seeded only by vertebrate
          BNIP3/NIX experimental annotations. Retained pro-death activity of
          ceBNIP3 in mammalian cells is consistent with inheritance of the
          capacity, though not with an in vivo worm role.
      - source_id: UniProtKB:Q12983
        source_label: BNIP3
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Human BNIP3 pro-death data are robust in mammalian cells; no equivalent worm in vivo data.
      - source_id: UniProtKB:O60238
        source_label: BNIP3L
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: NIX pro-apoptotic activity is context-dependent and overexpression-driven.
    supported_by:
    - reference_id: PMID:9824163
      supporting_text: Transfection of ceBNIP3 and CED-3 results in enhanced proteolytic processing of the CED-3 zymogen and in cooperative induction of apoptosis
    - reference_id: PMID:11114722
      supporting_text: ceBNIP3 kills mammalian cells by a caspase-independent mechanism
- term:
    id: GO:0043653
    label: mitochondrial fragmentation involved in apoptotic process
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN001032684
  - UniProtKB:Q12983
  review:
    summary: >-
      IBA for mitochondrial fragmentation involved in apoptotic process,
      placed at the eumetazoan node PTN001032684 on the basis of a single
      seed, human BNIP3. There is no evidence that DCT-1 drives mitochondrial
      fragmentation during apoptosis in C. elegans. The only worm data on
      mitochondrial morphology run the other way: loss of dct-1 produces
      fragmented and disorganized mitochondrial networks because damaged
      mitochondria are not cleared.
    action: REMOVE
    reason: >-
      A specialized mammalian apoptotic mechanism attested by one vertebrate
      paralog has been placed at a node spanning nematodes and insects. DCT-1
      kills mammalian cells by a BH3- and caspase-independent mechanism, no
      in vivo apoptotic role for DCT-1 has been shown, and mitochondrial
      fragmentation is not an established step of nematode apoptosis that
      DCT-1 performs. The transfer to worm is not supported.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - LINEAGE_OR_TAXON_MISMATCH
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: PANTHER:PTN001032684
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          Node placed at Eumetazoa (taxon:6072) although the sole experimental
          seed is human BNIP3; no invertebrate member has supporting data.
      - source_id: UniProtKB:Q12983
        source_label: BNIP3
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          Human BNIP3 IDA (mammalian cells) supports the term for BNIP3; the
          apoptotic fragmentation mechanism has not been tested for any
          invertebrate ortholog.
      - source_id: UniProtKB:Q09969
        source_label: dct-1
        source_status: NOT_RELEVANT
        comment: >-
          Target. Loss of dct-1 produces fragmented networks through failed
          mitophagy, which is the opposite relationship to the one the term
          asserts.
    supported_by:
    - reference_id: PMID:11114722
      supporting_text: although ceBNIP3 interacts with CED-9 and CED-3 it kills by a BH3- and caspase-independent mechanism
    - reference_id: file:worm/dct-1/dct-1-uniprot.txt
      supporting_text: accumulation of defective mitochondria that have increased mass, altered network morphology
