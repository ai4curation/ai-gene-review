- term:
    id: GO:0140580
    label: mitochondrion autophagosome adaptor activity
  evidence_type: ISS
  original_reference_id: PMID:25896323
  qualifier: enables
  review:
    summary: >-
      Proposed MF. DCT-1 is the worm ortholog of the mammalian mitophagy
      receptors NIX/BNIP3, which bind LC3/GABARAP through a LIR and tether
      mitochondria to autophagosomes. DCT-1 is an OMM protein required for
      stress-induced mitophagy, carries a WXXL LIR-like motif, and
      colocalizes with LGG-1 on mitochondria.
    action: NEW
    reason: >-
      The activity is inferred by orthology together with worm data:
      localization, a conserved LIR-like motif, LGG-1 colocalization, and an
      in vivo mitophagy requirement. Direct DCT-1–LGG-1 binding and LIR
      dependence have not been shown in the worm, so the evidence is coded
      ISS rather than IDA. PAINT currently places GO:0140580 at a
      Euteleostomi node (PTN002689498) seeded by human BNIP3 alone, which
      reflects the absence of invertebrate binding data rather than evidence
      against the activity. The core-function claim should be upgraded if a
      LIR-mutant or binding experiment is done.
    supported_by:
    - reference_id: file:worm/dct-1/dct-1-deep-research-falcon.md
      supporting_text: It colocalizes with LGG-1/Atg8 and facilitates recruitment of the autophagy machinery to mitochondria, engaging receptor-mediated mitophagy similar to mammalian BNIP3/NIX
    - reference_id: PMID:25896323
      supporting_text: We find that DCT-1 is a key mediator of mitophagy and longevity assurance under conditions of stress in C. elegans
