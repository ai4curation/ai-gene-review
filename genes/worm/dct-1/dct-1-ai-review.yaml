suggested_questions:
- question: Does DCT-1 bind LGG-1 and/or LGG-2 directly, and is the WXXL motif the binding site?
- question: Does DCT-1 contribute to developmental or germline apoptosis in vivo, or is its pro-death activity seen only on overexpression in mammalian cells?
- question: >-
    Should the PAINT statement for mitochondrial fragmentation involved in
    apoptotic process (GO:0043653), seeded only by human BNIP3, sit at the
    eumetazoan node PTN001032684 or at a vertebrate node?
- question: Which E3 ligase ubiquitinates DCT-1 at Lys-26, and does ubiquitination promote LGG-1 recruitment?
suggested_experiments:
- hypothesis: DCT-1 binds LGG-1 directly via its WXXL LIR-like motif
  description: >-
    In vitro binding (GST-LGG-1 pulldown or ITC with the DCT-1 LIR peptide)
    and in vivo co-immunoprecipitation from stressed worms, comparing wild
    type with a WXXL→AXXA CRISPR allele.
- hypothesis: The LIR-like motif is required for DCT-1-mediated mitophagy
  description: >-
    Measure mitophagy (mtRosella or mt-Keima) in a dct-1 LIR-mutant knock-in
    versus wild type and a dct-1 null under paraquat stress.
- hypothesis: DCT-1 is not required for physiological apoptosis
  description: >-
    Count embryonic and germline (basal and DNA-damage-induced) cell corpses
    in dct-1 null mutants, alone and in sensitized ced-3(partial) or
    ced-9(gf) backgrounds.
