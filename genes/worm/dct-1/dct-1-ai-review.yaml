  review:
    summary: >-
      IBA asserting that DCT-1 is active in the nucleus, from PAINT node
      PTN001032684, seeded by rat Bnip3 and human BNIP3/NIX. There is no
      experimental evidence for nuclear DCT-1 in C. elegans; all worm data
      place it on the mitochondrial outer membrane. The mammalian nuclear
      pools (e.g. nuclear BNIP3 in glioma cells) are cell-type specific and
      no nuclear activity is defined for the family.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      is_active_in nucleus claims a site of activity that is not established
      for any invertebrate member and is not the site of the conserved
      mitophagy-receptor function. The vertebrate nuclear observations
      reflect specific cellular contexts rather than an ancestral property.
      The parallel human BNIP3L review marks the same IBA as over-annotated.
