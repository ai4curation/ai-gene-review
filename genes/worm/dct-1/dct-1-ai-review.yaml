id: Q09969
gene_symbol: dct-1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: >-
  DCT-1 (DAF-16/FOXO controlled germline tumor affecting-1; ceBNIP3) is the
  single C. elegans member of the BNIP3/NIX (NIP3) family. It is a
  tail-anchored, single-pass protein of the mitochondrial outer membrane
  (OMM), expressed in all somatic tissues from embryo to adult, and acts as
  the main receptor-type mediator of stress-induced mitophagy in the worm.
  DCT-1 carries a WXXL LIR-like motif and colocalizes with the Atg8/LC3
  homolog LGG-1 on mitochondria, consistent with tethering damaged
  mitochondria to forming autophagosomes as mammalian NIX/BNIP3 do; direct
  DCT-1–LGG-1 binding has not been shown. DCT-1 acts in a common genetic
  pathway with PINK-1 and PDR-1/Parkin: under oxidative stress it is
  ubiquitinated at Lys-26 in a PINK-1-dependent manner, and the protection
  conferred by DCT-1 overexpression requires PINK-1 and PDR-1. dct-1 is a
  direct DAF-16/FOXO target and is induced by SKN-1/Nrf2, linking mitophagy
  to mitochondrial biogenesis in a homeostatic feedback loop. Loss of dct-1
  causes accumulation of dysfunctional mitochondria (increased mass,
  depolarization, reduced ATP, elevated ROS and cytosolic Ca2+) and
  suppresses the extended lifespan of daf-2, isp-1 and clk-1 mutants.
  DCT-1 also self-associates through its transmembrane domain. When
  overexpressed in mammalian cells it binds CED-9 and the CED-3 prodomain
  and kills cells by a BH3- and caspase-independent mechanism; a
  physiological role in C. elegans apoptosis has not been demonstrated.
