core_functions:
- description: >-
    Mitophagy receptor of the mitochondrial outer membrane. DCT-1 is required
    for stress-induced mitophagy, acts with PINK-1 and PDR-1/Parkin, and is
    inferred (by orthology to NIX/BNIP3, its WXXL LIR-like motif and LGG-1
    colocalization) to tether damaged mitochondria to LGG-1-decorated
    autophagosomal membranes.
