    - rubric: compactness
      score: 2
    - rubric: completeness
      score: 3
    - rubric: specificity
      score: 3
    overall_notes: Long and centred on mammalian-cell apoptosis assays. Lifespan and
      DAF-16 regulation are correct. Does not mention mitophagy, now the main role.
- source: Alliance_Automated
  text: Enables protease binding activity and protein homodimerization activity. Involved
    in several processes, including apoptotic process; determination of adult lifespan;
    and mitophagy. Located in mitochondrial outer membrane. Part of protein-containing
    complex. Is expressed in body wall musculature; intestine; neurons; pharynx; and
    vulval muscle. Orthologous to several human genes including BNIP3 (BCL2 interacting
    protein 3).
