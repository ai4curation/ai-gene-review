descriptions:
- source: UniProt
  text: Initiates apoptosis in a BH3-independent mechanism possibly by recruiting
    ced-3 to mitochondria and other cytoplasmic membranes (PubMed:11114722). Has a
    role in lifespan and tumor growth (PubMed:16380712, PubMed:17934462). Required
    for the induction of mitophagy under stress conditions (PubMed:25896323).
  source_type: curated
  url: https://www.uniprot.org/uniprot/Q09969
  source_id: Q09969
  review:
    reviewer: AI
    rubrics:
    - rubric: correctness
      score: 4
    - rubric: utility
      score: 4
    - rubric: compactness
      score: 4
    - rubric: completeness
      score: 3
    - rubric: specificity
      score: 4
    overall_notes: Lists 'initiates apoptosis' first, but the review says no physiological
      apoptotic role has been shown in worms. The mitophagy and lifespan roles are
      correct.
- source: Alliance_Imported
  text: 'dct-1 encodes a protein with similarity to the mammalian BNIP3 proteins that
    interact with Bcl-2 and the Adenovirus E1B 19kDa protein and that have been shown
    to have pro-apoptotic activity; loss of dct-1 activity via RNAi in daf-2 mutants
    and in gld-1; daf-2 doubly mutant animals indicates that dct-1 can function to
    regulate both lifespan and tumor cell proliferation; when expressed in mammalian
    cells, DCT-1 can: 1) induce delayed apoptosis and increase apoptosis when coexpressed
    with CED-3 (perhaps by increasing proteolyic processing of CED-3), 2) physically
    interact with CED-9 or the CED-3 prodomain when coexpressed, and 3) physically
    interact with both CED-9 and CED-3 when all three are coexpressed; chromatin immunoprecipitation
    experiments have demonstrated that the dct-1 promoter is bound in vivo by the
    forkhead transcription factor DAF-16; expression of DCT-1 in mammalian cells suggests
    that, like its mammalian orthologs, DCT-1 localizes to mitochondria via a predicted
    C-terminal transmembrane domain.'
  source_type: curated
  url: https://www.wormbase.org/db/get?name=WBGene00015776;class=Gene
  source_id: WB:WBGene00015776
  review:
    reviewer: AI
