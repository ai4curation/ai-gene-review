findings:
- category: discrepancy
  text: UniProt and WormBase present DCT-1 as an apoptosis initiator. The review says
    a physiological apoptotic role in C. elegans has not been shown and that the protein
    acts mainly as a mitophagy receptor.
  sources:
  - UniProt
  - Alliance_Imported
review:
  reviewer: AI
  rubrics:
  - rubric: overall_concordance
    score: 3
  overall_notes: All sources mention apoptosis. The review gives mitophagy as the
    core function and apoptosis only as an overexpression artefact.
