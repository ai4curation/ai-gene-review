- term:
    id: GO:0045454
    label: cell redox homeostasis
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: involved_in
  supporting_entities:
  - UniRule:UR000415528
  review:
    summary: UniRule propagation of broad redox-homeostasis process.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The thioredoxin domain and TMX3 family membership support a local ER
      thiol-disulfide oxidoreductase role, but the UniRule row projects that
      activity to the broader process of cell redox homeostasis without
      C. elegans evidence that UNC-74 maintains the redox environment of a cell
      or compartment. The direct nematode evidence instead connects UNC-74 to
      efficient functional expression of levamisole-sensitive acetylcholine
      receptors.
    supported_by:
    - reference_id: PMID:19020092
      supporting_text: >-
        Removal of UNC-50 or UNC-74 reduced response amplitudes to <10% of the
        response obtained with the full set of cRNAs
    - reference_id: PMID:15623505
      supporting_text: TMX3 showed oxidase activity
- term:
    id: GO:0006457
    label: protein folding
  evidence_type: IC
  original_reference_id: PMID:15623505
  qualifier: involved_in
  supporting_entities:
  - GO:0015035
  - GO:0005789
  review:
    summary: >-
      Proposed process row for the ER oxidative-folding role of a TMX3-family
      thiol-disulfide oxidoreductase.
    action: NEW
    reason: >-
      Add a conservative protein-folding process row. The participation test is
      satisfied because a protein-disulfide oxidoreductase catalyzes
      thiol-disulfide exchange during nascent protein folding in the ER rather
      than merely acting as a substrate or indirect regulator of folding. The
      Haugstetter TMX3 redox measurements support the accepted conserved
      oxidoreductase activity, and the ER membrane location plus the
      C. elegans and Haemonchus L-AChR reconstitution phenotypes support a
      curator inference that nematode UNC-74 participates in oxidative folding
      or maturation of nAChR clients.
    supported_by:
    - reference_id: PMID:15623505
      supporting_text: >-
        The redox potential of recombinant luminal TMX3 was determined to
        -0.157 V
    - reference_id: PMID:19020092
      supporting_text: >-
        Removal of UNC-50 or UNC-74 reduced response amplitudes to <10% of the
        response obtained with the full set of cRNAs
