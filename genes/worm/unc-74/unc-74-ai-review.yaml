- id: PMID:19020092
  title: >-
    Eight genes are required for functional reconstitution of the
    Caenorhabditis elegans levamisole-sensitive acetylcholine receptor.
  findings:
  - statement: >-
      unc-74 seems to be required solely for expression of the
      levamisole-sensitive AChR among C. elegans AChR classes.
    supporting_text: >-
      seems to be solely required for the expression of L-AChRs
    finding_review:
      finding_status: OVERTURNED
      superseded_by:
      - PMID:20027209
      review_notes: >-
        The assayed ACR-16 comparison remains correct, but the broader
        L-AChR-only inference has been superseded. Jospin et al. later found
        that unc-74 loss of function suppresses the ACR-2 gain-of-function
        convulsion phenotype, implicating UNC-74 in ACR-2R assembly or
        trafficking too.
      supported_by:
      - reference_id: PMID:20027209
        supporting_text: >-
          loss-of-function mutations in unc-50 and unc-74 suppress
          acr-2(n2420gf) suggests that these two ancillary proteins also
          function in ACR-2R assembly and trafficking
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text read. Xenopus oocyte reconstitution showed that the five
      C. elegans L-AChR pore subunits plus RIC-3, UNC-50 and UNC-74 are
      sufficient for robust acetylcholine- and levamisole-gated currents, and
      that removing UNC-74 from the cRNA mix leaves less than 10% of the full
      current.
