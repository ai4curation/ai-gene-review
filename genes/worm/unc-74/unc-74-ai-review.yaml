knowledge_gaps:
- gap_statement: >-
    The direct C. elegans UNC-74 client, mixed-disulfide intermediate, or other
    ER-maturation step that explains its requirement for nicotinic acetylcholine
    receptor biogenesis remains unresolved.
  boundary: >-
    Human TMX3 is an ER-membrane PDI-family oxidoreductase by localization and
    recombinant luminal-domain assays; C. elegans UNC-74 is required for robust
    L-AChR reconstitution and is also implicated genetically in neuronal ACR-2
    receptor assembly or trafficking.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: >-
    Closing this gap would connect a conserved TMX3-family oxidoreductase to
    the specific receptor-folding step that gates nematode nAChR surface
    expression and levamisole sensitivity.
  resolution: >-
    Trap mixed-disulfide UNC-74-client complexes with catalytic-cysteine
    substitutions and test whether the same redox-active residues are required
    for L-AChR and ACR-2R expression in C. elegans.
  provenance:
  - reference_id: PMID:30407909
    supporting_text: >-
      UNC-74 is a predicted thioredoxin homologous to TMX-3
  - reference_id: PMID:30407909
    supporting_text: >-
      It is necessary for L-AChR expression, but its detailed function remains
      uncharacterized
suggested_questions:
- question: >-
    Which nAChR pore subunit or subunits are the direct UNC-74 redox
    substrates, and is the requirement for UNC-74 in L-AChR and ACR-2R
    biogenesis tied to the conserved disulfides in their extracellular
    ligand-binding domains?
- question: >-
    Which non-AChR ER clients, if any, require UNC-74 in C. elegans?
suggested_experiments:
- description: >-
    Mutate the predicted redox-active cysteines in UNC-74 and test rescue of
    levamisole sensitivity in unc-74 mutants and of L-AChR currents in Xenopus
    oocytes to determine whether oxidoreductase chemistry is required.
- description: >-
    Combine tagged UNC-74, L-AChR subunit surface labeling, and redox-trap
    cysteine substitutions to test whether UNC-74 physically engages L-AChR
    subunits in the ER before receptor export.
