id: Q9N4L6
gene_symbol: unc-74
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: >-
  UNC-74 is a Caenorhabditis elegans TMX3-family, single-pass
  endoplasmic-reticulum membrane protein with an N-terminal signal peptide and
  luminal thioredoxin domain. It is predicted by orthology to be a
  protein-disulfide oxidoreductase. Caenorhabditis receptor-biogenesis studies
  place UNC-74 with RIC-3 and UNC-50 among ancillary factors needed for robust
  functional expression of levamisole-sensitive nicotinic acetylcholine
  receptors and implicate it in ACR-2 receptor assembly or trafficking.
