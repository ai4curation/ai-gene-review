    label: protein-disulfide reductase activity
  evidence_type: ISS
  original_reference_id: PMID:15623505
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q96JJ7
  review:
    summary: WormBase ISS transfer of TMX3 thiol-disulfide oxidoreductase activity.
    action: ACCEPT
    reason: >-
      Correct core activity by orthology. Human TMX3 has the same domain
      organization as UNC-74, and Haugstetter et al. showed that recombinant
      luminal TMX3 is folded and has redox potential and oxidase activity
      comparable to ER PDI proteins. GO:0015035 is direction-neutral for
      protein thiol-disulfide oxidoreductase chemistry despite the primary
      reductase label, so oxidase activity supports this term. C. elegans
      UNC-74 retains the luminal thioredoxin domain and redox-active motif that
      support a conserved protein thiol-disulfide oxidoreductase role.
    supported_by:
    - reference_id: PMID:15623505
      supporting_text: TMX3 showed oxidase activity
