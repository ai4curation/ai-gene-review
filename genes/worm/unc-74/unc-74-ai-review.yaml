core_functions:
- description: >-
    Single-pass ER-membrane TMX3/PDI-family oxidoreductase that is likely to
    catalyze thiol-disulfide exchange in nascent secretory and membrane
    proteins. Its receptor-biogenesis role is supported by nematode
    levamisole-sensitive AChR reconstitution and by C. elegans genetics
    implicating UNC-74 in ACR-2 receptor assembly or trafficking.
