- source: RefSeq
  text: Enables protein serine/threonine kinase activator activity. Involved in mitotic
    cytokinesis and nuclear division. Located in kinetochore; microtubule cytoskeleton;
    and nucleus. Orthologous to human INCENP (inner centromere protein). [provided
    by Alliance of Genome Resources, Jun 2026]
  source_type: automated
