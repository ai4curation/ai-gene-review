descriptions:
- source: Alliance_Imported
  text: icp-1 gene encodes a 'chromosomal passenger protein'; inactivation of icp-1
    by RNAi leads to a complete failure of chromosome segregation during the first
    mitotic division of embryonic development; ICP-1 forms a protein complex with
    CSC-1, BIR-1, and AIR-2; in vitro, ICP-1 stimulates AIR-2 protein kinase activity;
    ICP-1 localizes to meiotic and mitotic chromosomes and to the spindle midzone.
