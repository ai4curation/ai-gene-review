    label: mitotic cell cycle
  evidence_type: IMP
  original_reference_id: PMID:11402065
  qualifier: involved_in
  review:
    summary: >-
      RNAi of ICP-1 (CeINCENP) causes failure of mitotic chromosome segregation, spindle
      midzone assembly and cytokinesis in the one-cell embryo. Mitotic cell cycle is true but
      only a container for these specific defects.
    action: MODIFY
    reason: >-
      Correct but too general. The specific mitotic processes supported by this paper are mitotic
      sister chromatid segregation, mitotic spindle midzone assembly and mitotic cytokinesis;
      the last two are already carried by the gene.
    proposed_replacement_terms:
    - id: GO:0000070
      label: mitotic sister chromatid segregation
    - id: GO:0051256
      label: mitotic spindle midzone assembly
    - id: GO:0000281
      label: mitotic cytokinesis
    supported_by:
    - reference_id: PMID:11402065
      supporting_text: This segregation is not normal and leading and lagging chromatin is always
        observed.
    - reference_id: PMID:11402065
      supporting_text: Cytokinesis initiates normally in CeINCENP-depleted embryos, but it does not
        complete and the furrow regresses.
