core_functions:
- description: >-
    ICP-1 is the INCENP scaffold of the chromosomal passenger complex. Its C-terminal
    ARK-binding domain binds the Aurora B kinase AIR-2 and directly stimulates its kinase
    activity, and it links AIR-2 to the CSC-1/BIR-1 targeting subcomplex.
