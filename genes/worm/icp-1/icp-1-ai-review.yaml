id: G5EE37
gene_symbol: icp-1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6239
  label: Caenorhabditis elegans
description: >-
  icp-1 (Y39G10AR.13) encodes ICP-1, the Caenorhabditis elegans orthologue of INCENP and the
  scaffold subunit of the chromosomal passenger complex (CPC), together with the Aurora B kinase
  AIR-2, the Survivin-like protein BIR-1 and the Borealin-like protein CSC-1. The 622-residue
  protein is largely disordered in its N-terminal two thirds and carries a conserved C-terminal
  INCENP ARK-binding domain that binds AIR-2. ICP-1 bridges AIR-2 to the CSC-1/BIR-1 targeting
  subcomplex and directly stimulates AIR-2 kinase activity; it is itself phosphorylated by AIR-2.
  ICP-1, CSC-1 and BIR-1 depend on one another to localize, and AIR-2 needs all three. The
  complex sits on condensing chromosomes in prophase, in a stripe between the two kinetochore
  plates of the holocentric chromosomes at metaphase, and on the spindle midzone in anaphase.
  Embryos depleted of ICP-1 fail female meiosis, congress and segregate mitotic chromosomes
  poorly, do not assemble a spindle midzone or stably localize the centralspindlin kinesin ZEN-4,
  and fail to complete cytokinesis, matching the loss of AIR-2.
