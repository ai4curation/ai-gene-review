suggested_questions:
- question: >-
    PMID:15331665 (a LIS-1 study) is the source of a kinetochore IDA for ICP-1, whereas
    PMID:11402065 places ICP-1 between the two kinetochore plates and shows its targeting is
    independent of kinetochore assembly. Does the LIS-1 paper show ICP-1 on the kinetochore
    itself, or is the location better described as the chromosomal midregion (cup-like domain)?
- question: >-
    Does ICP-1 contribute to spindle assembly checkpoint signalling in C. elegans, as the
    ComplexPortal annotation for the CPC asserts by analogy?
- question: >-
    What is the function of the paralog ICP-2, which shares the C-terminal INCENP homology with
    ICP-1, and is it a CPC subunit in any cell type?
suggested_experiments:
- description: >-
    Replace endogenous ICP-1 with a version carrying mutations in the conserved C-terminal
    region (the IN-box equivalent that binds and activates AIR-2), and test whether AIR-2
    activation, midzone assembly and chromosome segregation are lost while CPC targeting is
    retained.
  hypothesis: Kinase activation by ICP-1, separable from its scaffolding and targeting roles,
    is required for chromosome alignment and midzone assembly.
- description: >-
    Measure spindle assembly checkpoint-dependent mitotic delay (for example in a
    monopolar-spindle background) after icp-1 RNAi or auxin-induced degradation.
  hypothesis: ICP-1 is required for full checkpoint signalling, as INCENP is in other
    organisms.
