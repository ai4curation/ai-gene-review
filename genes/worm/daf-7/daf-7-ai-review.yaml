core_functions:
- description: Secreted TGF-beta-family neuroendocrine ligand made by ASI (and ASJ) sensory neurons. It
    reports favourable environmental conditions (food, low pheromone) by activating the DAF-1/DAF-4 receptor
    and DAF-8/DAF-14 Smad pathway in target neurons, antagonising DAF-3/DAF-5 and thereby inhibiting entry
    into dauer diapause and promoting reproductive development.
