- term:
    id: GO:0040024
    label: dauer larval development
  evidence_type: IGI
  original_reference_id: PMID:10625546
  qualifier: involved_in
  supporting_entities:
  - WB:WBGene00000910
  review:
    summary: IGI evidence (PMID PMID:10625546) from epistasis and dauer-constitutive phenotypes, annotated
      as involvement in dauer larval development.
    action: MODIFY
    reason: DAF-7 does not execute dauer development. It is a secreted signal whose presence prevents
      dauer formation, and loss of daf-7 causes constitutive dauer entry. The epistasis experiments in
      these papers (receptor, Smad, guanylyl cyclase and kinase double mutants) define its place as an
      upstream inhibitory signal. The appropriate term is negative regulation of dauer larval development
      (GO:0061067), which the gene already carries.
    supported_by:
    - *id006
    - &id015
      reference_id: PMID:10625546
      supporting_text: these experiments suggest the nervous system as a target of DAF-7 signaling and
        that the nervous system in turn regulates dauer formation by other tissues
    - &id016
      reference_id: PMID:11677050
      supporting_text: daf-11 acts cell autonomously in ASI chemosensory neurons for daf-7 expression
    - *id014
    - &id017
      reference_id: PMID:15840165
      supporting_text: Interaction with the dauer pathway is observed in double mutant combinations
    proposed_replacement_terms:
    - &id018
