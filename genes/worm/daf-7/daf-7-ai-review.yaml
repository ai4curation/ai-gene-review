suggested_questions:
- question: Does mature DAF-7 bind DAF-1 and DAF-4 directly, and with what affinity and stoichiometry,
    given that DAF-4 is shared with the BMP-like ligand DBL-1?
- question: Which proprotein convertase processes the DAF-7 precursor, and is processing or secretion
    (e.g. GON-1-dependent) regulated by environmental conditions in addition to transcription?
- question: Should the DAF-7 pathway be modelled as TGF-beta receptor signaling, BMP signaling, or both,
    given its TGF-beta-like ligand and BMP-type type II receptor?
suggested_experiments:
- description: Biochemical binding assays (e.g. SPR or co-immunoprecipitation) of recombinant mature DAF-7
    with DAF-1 and DAF-4 ectodomains, compared with DBL-1.
- description: Endogenous tagging of DAF-7 with a cleavable fluorescent reporter to measure processing
    and secretion from ASI and ASJ under food, pheromone and pathogen conditions.
