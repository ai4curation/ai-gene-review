  review:
    summary: Phylogenetic (PAINT) inference that DAF-7, a TGF-beta superfamily ligand, has cytokine activity.
    action: ACCEPT
    reason: DAF-7 is a secreted TGF-beta-family polypeptide released by ASI (and ASJ) sensory neurons.
      It acts non-cell-autonomously on DAF-1/DAF-4 receptor-expressing target neurons and other cells,
      which fits the GO definition of a cytokine-like extracellular signal. The PAINT node for TGF-beta
      ligands includes DAF-7, and nothing indicates that the ligand function was lost.
    supported_by:
    - &id002
      reference_id: file:worm/daf-7/daf-7-uniprot.txt
      record_section:
      - CC:SIMILARITY
      supporting_text: Belongs to the TGF-beta family.
    - &id005
      reference_id: PMID:8910282
      supporting_text: daf-7 gene, required for transducing environmental cues that support continuous
        development with plentiful food, encodes a transforming growth factor-beta (TGF-beta) superfamily
        member
    - &id003
      reference_id: PMID:10625546
      supporting_text: The chemosensory neuron ASI regulates dauer formation by secretion of DAF-7/TGF-beta
    - &id001
      reference_id: PMID:32182864
      supporting_text: the TGFβ homolog DAF-7 signals through the DAF-1 Type I and DAF-4 Type II receptors
