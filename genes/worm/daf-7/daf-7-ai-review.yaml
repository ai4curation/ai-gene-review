- term:
    id: GO:0016045
    label: detection of bacterium
  evidence_type: IMP
  original_reference_id: PMID:25303524
  qualifier: involved_in
  review:
    summary: 'IMP from Meisel et al. 2014: daf-7 is required for avoidance of P. aeruginosa, and its expression
      in ASJ is induced by bacterial secondary metabolites.'
    action: MARK_AS_OVER_ANNOTATED
    reason: Detection of the bacterial metabolites (phenazine-1-carboxamide, pyochelin) is carried out
      by a G-protein pathway (GPA-2/GPA-3) in ASJ that then induces daf-7 transcription. DAF-7 is the
      downstream neuroendocrine output that acts on interneurons. It does not perform the detection step.
    supported_by:
    - &id012
      reference_id: PMID:25303524
      supporting_text: Secondary metabolites phenazine-1-carboxamide and pyochelin activate a G-protein-signaling
        pathway in the ASJ chemosensory neuron pair that induces expression of the neuromodulator DAF-7/TGF-β
    - &id013
      reference_id: PMID:25303524
      supporting_text: DAF-7, in turn, activates a canonical TGF-β signaling pathway in adjacent interneurons
        to modulate aerotaxis behavior and promote avoidance of pathogenic P. aeruginosa
- term:
    id: GO:0030509
    label: BMP signaling pathway
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - FB:FBgn0005590
  - FB:FBgn0024234
  - FB:FBgn0039914
  - MGI:MGI:103302
  - MGI:MGI:107335
  - MGI:MGI:88182
