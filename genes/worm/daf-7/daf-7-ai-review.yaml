  - ZFIN:ZDB-GENE-000208-25
  review:
    summary: PAINT IBA placing DAF-7 in BMP signaling pathway.
    action: KEEP_AS_NON_CORE
    reason: DAF-7 is a TGF-beta-subfamily-like ligand, but it signals through DAF-4, the sole C. elegans
      type II receptor, which is a BMP type II receptor (binds BMP-2/4) shared with the BMP-like DBL-1
      pathway. The signaling is therefore a TGF-beta/BMP hybrid, and the IBA is defensible at the level
      of the ancestral node. The DAF-7 pathway is usually described as the TGF-beta-like 'Daf' pathway,
      distinct from the BMP-like Sma/Mab pathway, so TGF-beta receptor signaling pathway (GO:0007179)
      is kept as the core description.
    supported_by:
    - *id009
    - *id001
