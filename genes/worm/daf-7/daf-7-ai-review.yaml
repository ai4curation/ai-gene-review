  review:
    summary: ISS (from mouse Tgfb2) that DAF-7 binds TGF-beta receptors.
    action: ACCEPT
    reason: DAF-7 is the ligand of the DAF-1 (type I) / DAF-4 (type II) serine/threonine kinase receptor
